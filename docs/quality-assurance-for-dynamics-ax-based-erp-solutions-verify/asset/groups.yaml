  - '[PAGE 103]


    +   - Prescribed or secure design patterns should be used to ensure secure coding.

    +   - Cryptography should be used to minimize the risk of information disclosure.

    +   - Dynamics AX code access security should be used to prevent any dangerous
    API being invoked by untrusted code, i.e. code that has not originated from the
    AOT.

    +   - Strict privileges should be applied on every API.

    +   - Vulnerability should be reduced by using the conclusions of threat modeling.

    +   - The best practices related to data authorization should be followed.


    +   - Secure by default: Real-world software applications cannot be totally secure
    even if an IT application is secured in a thousand ways but has one security loophole.
    This security loophole can be utilized by a malicious user. A few best practices
    can ensure minimum harm in case of malicious attacks:

    +     - AN ERP system or any other application should run with the least necessary
    privileges.

    +     - Unused or title used services should be off.

    +     - Features not used widely should be disabled by default.

    +   - Secure in deployment: The security in deployment works in two ways: i.e.
    security should be hardened during deployment and the deployment procedure should
    be safe and secure to apply patches.

    +   - Communications: If any security vulnerability is discovered, the protective
    action or workaround should be communicated to end users or administrators in
    a clear and responsible manner. While communicating to the end user or administrator,
    corrective action e.g. applying patches, new deployments of workarounds, and changes
    in configuration settings should be suggested.


    # Security Development Life Cycle


    The Trustworthy Security development life cycle is derived from the waterfall
    model. It consists of six stages.'
  - '[PAGE 104]


    # Requirement Stages


    Often people have misconceptions that a review of the application developed is
    sufficient to ensure the trustworthiness of the software application. Reviewing
    the software application is not only cost-inefficient, but also ineffective. A
    security issue found in the design while reviewing developed application may compel
    redesigning and rewriting the code.


    It is true that trustworthiness cannot be achieved in software applications until
    and unless the people involved are educated about security. Microsoft recommends
    the following mandatory security education for the development team:


    +   - Reading *Writing Secure Code, Second Edition*, by Michael Howard.

    +   - Reading the *Microsoft Dynamics AX Writing Secure X++ Code* white paper
    published on Microsoft website.

    +   - Completing the following two Microsoft eLearning security courses:

    +     - Clinic 2806: Microsoft Security Guidance Training for Developers

    +     - Clinic 2807: Microsoft Security Guidance Training for Developers II

    +   - Reading the Threat Modeling section of the IBI ISV Certification Handbook
    distributed by Microsoft to each of the IBI solution provider.


    The completion of security education in the requirement phase will provide an
    opportunity to have security as the prime concern during each stage of the security
    development life cycle.


    This phase must also plan security, i.e. writing a security plan, defining security-related
    defect classifications and progression. We will discuss more about defect management
    in Chapter 8.


    # Design Phase


    The design phase is very much critical in trustworthy application development.
    Carefully designed architecture is the foundation of trustworthiness of software
    applications. Following are a few key activities in the design phase:


    +   - Security architecture and design guidelines definitions. The following should
    be the prime concerns for this activity:

    +     - Identification of design techniques such as application of least privileges

    +     - Identification of components whose correct functioning is essential for
    security'
  - '[PAGE 105]


    +   - Security architecture definition for the overall system

    +   - Minimization of attack surface

    +   - Security by default implementation:

    +     - Documenting the elements of the software attack surface

    +     - Identification of the features that need to be installed by default.

    +   - Conduct threat modeling for each component:

    +     - Identification of assets

    +     - Identification of trust boundaries

    +     - Identification of threats

    +   - Conduct risk analysis:

    +     - Assessment of impact on security for each feature as well as each privilege
    level.

    +     - Identification of countermeasures and risk mitigation. Countermeasures
    may include information encryption at trust boundaries and input validations before
    passing trust boundary.


    # Implementation Phase


    In the implementation phase best practices are identified to meet the goal of
    trustworthiness. A few such activities are:


    +   - Identification of design patterns to ensure security, privacy, and reliability.

    +   - Definition of security testing. The following may be a few testing objectives:

    +     - To ensure that the Application Under Testing (AUT) does not bypass standard
    security model of Dynamics AX.

    +     - To ensure that the system is robust enough against security threats.

    +     - To ensure that user permissions are properly enforced as per the various
    configurations such as user group, company, configuration keys, security keys,
    and license code.

    +   - Apply Dynamics AX best-practice check tool and document the deviations.

    +   - Perform code reviews to:

    +     - Ensure that coding is as per the prescribed design patterns.

    +     - Examine source code with an intent of detecting and removing potential
    security vulnerabilities.'
  - '[PAGE 106]


    # Stabilization Phase


    This is the stage when software is almost in a stable condition (i.e. functionally
    complete) and can be reviewed as a system. At this stage the security push goes
    beyond the security reviews done in earlier stages. Conducting code reviews at
    this stage offers an opportunity to not only review the new code, but also the
    modified code and core dynamics AX code in new perspective of entirety.


    In Dynamics AX the following activities are recommended by Microsoft:


    +   - Review of features and functions specifically designed to improve the trustworthiness
    i.e. reliability, security, and privacy. Risk analysis done in design phase of
    the security development life cycle can be useful to identify such features and
    functions.

    +   - Review of overall code in entirety: i.e. both new code and updated code.
    Impact on existing code should also be a consideration.


    # Release Phase


    The primary activity in release phase is conducting the Final Security Review
    (FSR). This activity is conducted a couple of months before implementing or shipping
    the product. The FSR should be conducted by an independent security team at a
    stage when non-security issues are minimum. The FSR should not only consider the
    security health of the product in scope, but also previously reported issues.
    The previously reported issues give a clue to the pattern of security issues and
    the other areas where this kind of issues are still not discovered. It may also
    help to understand the root causes and take corrective and preventive actions.


    # Support/Servicing Phase


    A software application cannot be 100% secure — and even if it is100% secure today,
    it will definitely be vulnerable tomorrow due to discovery of new kinds of attacks.
    A support system should be in place, which can respond to newly discovered security
    vulnerabilities. The response should include:


    +   - Evaluating vulnerability and issueing advisories and/or updates.

    +   - Conducting a post mortem of the vulnerabilities and conducting an analysis
    of the chances of similar kinds of vulnerabilities in the product and taking preventive
    action.

    +   - Reporting newly identified vulnerabilities to the security team so that
    suitable test cases can be added for future release of the same or other products.'
  - '[PAGE 107]


    # Threat Modeling


    Threat modeling is a security analysis technique to identify and document the
    threats to meet the following objectives:


    +   - Identification of risk

    +   - Analysis of risk

    +   - Identification of the possible remedy or mitigation of threats

    +   - Help design, development, and testing team to improve the security aspects
    of design, secure development, and testing respectively


    To meet the above objectives, threat modeling has three major activities: i.e.
    understanding the adversary''s view, characterizing security, and determining,
    analyzing, and documenting the threats.


    # How to Conduct Threat Modeling


    To conduct threat modeling it is necessary to analyze the system architecture
    to find the entry points and assets and cross reference these with trust levels.
    The entry points or interfaces are the places in the architecture where data and/or
    control flow transfers between the system under consideration for threat modeling
    and any other system. All entry points or interfaces must be identified and documented
    irrespective of the trust level at the interfaces. Here trust level means privileges
    an external entity should have to legitimately use these interfaces.


    These interfaces include the following:


    +   - Open sockets

    +   - Remote Procedure Call (RPC) interfaces

    +   - Web services interfaces

    +   - Data being read from the file system


    After identifying the entry points, assets that a malicious user can misuse (e.g.
    manipulate, steal, etc.) should be identified. Usually most affected assets are
    entities at interfaces points, but they can be other things such as process tokens,
    unencrypted passwords, etc. All assets that can be a targeted for threat should
    be identified and cross-referenced with trust level. Here trust level means privilege
    level required to allow access or affect the assets in some way.'
