    ## User Experience and Usability Testing


    The objective of this testing is to ensure the following:


    - Proper consistency in the user interface

    - Adherence to Windows user interface guidelines

    - Adherence to Dynamics AX UI guidelines


    The following table summarizes the specifications for this testing.


    ### Specifications for User Experience and Usability Testing


    |  |  |

    |---|---|

    | Technique | Manual verification by test engineer. A generalized test pack (GUI
    compliance test document) should be used to perform this testing. Issues encountered
    are reported in the bug tool. |

    | Expected Results | Proper consistency is observed along with compliance to Dynamics
    AX user interface standards. |

    | Completion Criteria | All forms in the code under test have been verified as
    per Microsoft Dynamics AX GUI standards. |

    | Special Considerations | This testing must be conducted on an SVGA display with
    1024*768 pixels. |

    | Responsibility | Tester. |

    | IBI Reference | 5.1 |


    ## Verification of Business Intelligence or Reporting Standard


    The objective of this testing is to verify adherence to reporting guidelines prescribed
    in the Dynamics AX Developers Handbook, for e.g.:


    - Use of Dynamics AX report wizard

    - Use of SQL server reporting service as per implementation guidelines


    The following table summarizes this testing


    ### Specifications for Verification of Business Intelligence/Reporting Standards


    |  |  |

    |---|---|

    | Technique | Manual verification through code review. |

    | Expected Results | Compliance to Reporting guidelines mentioned in the Dynamics
    AX Developers Guide. |

    | Completion Criteria | All reports have been verified in the code under test.
    Issues encountered are reported in the review and authorization form. |

    | Special Considerations | The purpose of the report should be considered. If
    the report under testing is to be used for some regulatory purpose and should
    be in the same format as issued by a regulatory authority, an exception can be
    documented. |

    | Responsibility | Lead Developer. |

    | IBI Reference | 6.1 |


    ## Performance Testing


    The objective of this testing is to verify that there is no significant performance
    degradation of core Dynamics AX processes with installation of the application
    under test. Performance is not expected to degrade more than 5%. The following
    table summarizes this testing.


    ### Specifications for Performance Testing


    |  |  |

    |---|---|

    | Technique | Dynamics AX benchmark toolkit should be used for performance testing.
    The performance test for standard Dynamics AX should be executed to baseline the
    performance. The same tests should be run again with application under test and
    the results should be compared against the baseline values. The Dynamics AX Event
    log should be checked for error and warnings regarding the performance. Test scripts
    should be written for the business processes to be tested. The business processes
    that are most affected by customization and are under the main business flow of
    the application should be selected. Issues found are recorded in the review and
    authorization form. |

    | Expected Results | No significant (>5%) performance degradation when running
    performance benchmark tool before and after installing this solution onto core
    Dynamics AX. |

    | Completion Criteria | Performance degradation is not greater than 5%. |

    | Special Considerations | Application testing demo data must be planned and reviewed
    before starting Performance Testing. |

    | Responsibility | Tester. |

    | IBI Reference | 7.1 |


    This testing will be applicable only in countries where the benchmark kit for
    Dynamics AX has been released by Microsoft.


    ## Security Testing


    Any software application cannot be useful until and unless it is secure. As per
    Microsoft vision, IT applications should be as safe as water and electrical devices
    in our homes. The following should be included in the objectives of security testing
    for Dynamics AX implementations:


    - To ensure that Application Under Testing (AUT) does not bypass standard security
    model

    - To ensure that the system is robust enough to deal with security threats

    - Analysis of threat modeling, security measures, etc.

    - Final code review to ensure that no critical security is left unresolved


    The following table summarizes this testing.


    ### Specifications for Security Testing


    |  |  |

    |---|---|

    | Technique | The following verifications should be performed as part of this
    testing: In **Administration | Setup | Security** menu, AUT must have a node available
