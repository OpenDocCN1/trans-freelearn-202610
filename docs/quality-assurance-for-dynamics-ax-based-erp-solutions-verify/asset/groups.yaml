  - '[PAGE 26]


    # Total Cost of Ownership (TCO)


    In any business organization, cost is the primary concern for any new initiative;
    an ERP system is no exception to that. Dynamics AX offers cost advantages due
    to following unique features:


    +   - Dynamics AX provides the same version of code for Web and Microsoft Windows
    clients, which leads to simpler, less expensive development and IT costs, and
    provides a great degree of ease for businesses that are either distributed or
    have a mobile workforce.

    +   - Separate layers for industry-specific verticals and country-specific localization
    not only offer cost savings but also reduce efforts required to implement the
    Dynamics AX.

    +   - Due to the layered technology of Microsoft Dynamics AX, customizations can
    be easier to build and maintain. You can customize one layer without affecting
    the functionality of the other layers. This means that you can adapt and upgrade
    your solution over time with less disruption to business, risk, and expense.

    +   - Because of feature keys, any functionality can be enabled or disabled for
    an individual user or user group. This not only gives flexibility but also reduces
    the total cost of ownership.

    +   - Since Dynamics AX is an ERP application based on common Microsoft standards,
    which end users are generally aware of, less effort are required to train the
    end user.


    # Flexibility


    Flexibility is another important aspect in an ERP solution, but unfortunately
    most of the current ERP solutions lack it. For example, with an ERP package like
    SAP, you have to adhere to SAP''s ideas about your business, what they think about
    uniqueness of your business and strategy. Dynamics AX has an edge due to the following
    features:


    +   - **Customization flexibility**: Dynamics AX allows changing anything you
    need. Businesses see this as a wonderful feature. This is the key for the ERP
    you implement, to grow as your business grows. Going with an ERP package like
    SAP, you have to adhere to SAP''s thoughts about your business, how they think
    it is best for your business run. With Dynamics AX, you are in control, and, granted
    best business practices should be sought after, those best practices can be applied
    to your custom needs. This helps businesses to reduce the total cost of ownership.'
  - '[PAGE 27]


    +   - **Layered programming:** Microsoft Dynamics AX offers a layered technology
    of customizations to facilitate building and maintenance. You can customize one
    layer without affecting the functionality of other layers. This means that you
    can adapt and upgrade your solution over time with less disruption to business,
    risk, and expense.

    +   - **Feature key:** Feature key code is a wonderful system. Using feature keys,
    features can be disabled or enabled for an individual or a user group.


    > *Microsoft Dynamics AX combines rich out-of-the-box functionality with added
    flexibility, giving The Systems Depot the ability to adjust capabilities to meet
    its exact business needs.* — Jan Sorensen, Senior Managing Consultant, BKD Technologies
    (http://www.sdepot.com). (Source: http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=1000003831.)


    # Usability


    Any software or ERP package can be considered successful only if the end user
    can use it productively. Dynamics AX is considered to be a highly usable ERP package
    for the following reasons:


    +   - **Microsoft Product:** Dynamics AX is owned and developed by Microsoft.
    Currently Dynamics AX 4.0 is highly integrated with the different product lines
    of Microsoft, and with the release of Vista, DotNet 3.0, Commerce Server 2007,
    SharePoint Server 2007, Exchange 2007, and Office 2007, all these product lines
    will become even more tightly integrated into the Dynamics AX product. This means
    that you will be able to work from SharePoint Excel Services, and create a Spreadsheet
    that could work directly with Dynamics AX ERP data; and it could all be centrally
    managed in a decentralized controlled fashion by an information worker. Besides
    this Microsoft has a long-term vision for integrating various Microsoft products,
    for example, Microsoft is planning to support full integration of Microsoft Office
    PerformancePoint server and Dynamics CRM will support full integration with Dynamics
    AX 5.0.

    +   - **Familiarity with Microsoft:** The best way to make a company productive
    is to make the people in it more productive. To accomplish this goal, people need
    business software tools like Microsoft Dynamics that enable them to work the way
    they like. When you implement Microsoft Dynamics, you support and enhance the
    work your people do, and the way they do it. Microsoft Dynamics AX works like
    familiar Microsoft software such as Microsoft SQL Server, Microsoft SharePoint
    products and technologies, and Microsoft Office products, which means a reduced
    learning curve for your employees, so that they can focus on their jobs.'
  - '[PAGE 28]


    > > We also wanted the system to provide our business users with the information
    they needed, in an intuitive, easy-to-use environment. That''s what Microsoft
    Dynamics AX has given us. — Tomasz Gesiarz, Director of Finance and IT, Lantmännen
    Unibake Poland. (http://www.lantmannen.com) (Source: http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=100003869)


    # Performance


    Dynamics AX 4.0 has some advanced concepts to optimize its performance. A few
    are listed below:


    +   - **Data Compression**: This ensures minimum time for data traveling through
    the network and hence performance is improved and added security is a bonus.

    +   - **Axapta Object Server (AOS) Thread Pooling**: This allows AOS to have a
    lower number of threads (less than the number of logged in users) and hence performance
    is improved.


    # Coherence of Business Processes


    Software applications like Payroll, Accounting, Purchase management, etc. have
    been available for a long time, but these individual applications could not be
    integrated with each other and hence communication between various business processes/departments
    was manual, which put serious limitations on the benefits of information technology.
    An ERP system offers coherent working of various business processes and hence
    is the solution to this integration problem.


    +   - Dynamics AX 4.0 also includes roles-based features so that users can gain
    easy access to the business data relevant to their position within an organization.

    +   - With comprehensive features that help to automate and streamline financials,
    customer relationships, business services, human resource management, and supply
    chain processes, Microsoft Dynamics AX 4.0 brings together people, processes,
    and technologies located worldwide. In this way, Microsoft Dynamics AX 4.0 helps
    to increase the productivity and effectiveness of your business.


    > > Through sales and purchase procedures we have minimized multiple data input
    and optimized workflow between the offices. Now, fewer people need to be involved
    in these processes. — Alexander Sharafutdinov, Chief Information Officer, UCC
    Shchekinoazot (http://www.n-azot.ru) (Source: http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=200916.)'
  - '[PAGE 29]


    # Easy to Integrate


    In an organization there may be a need to preserve old investment in different
    software application or some specialized software needs to work with an ERP system.
    In such cases it is necessary that an ERP system offers various industry-standard
    methods of integration. Microsoft has a long-term strategy to integrate various
    applications such as MS Office, Microsoft Office PerformancePoint server, etc.
    Dynamics AX can be integrated using the following technologies:


    +   - Microsoft Dynamics AX 4.0 includes the Application Integration Framework
    (AIF), which lets organizations extend the solution by easily inserting business
    logic from other vendors'' applications with no dependencies created within the
    core solution. In addition, AIF acts as a web services toolbox by exposing all
    the application components and gives developers a head start by publishing an
    extensive set of web services for core business processes such as receiving and
    fulfilling orders.

    +   - Biztalk is a compatible integration adapter for Dynamics AX, which offers
    many advantages such as real-time visibility across the extended organization,
    flexibility, ease of deployment, and improved ROI.

    +   - Dynamics AX can be connected with external data sources using web services
    as well as industry-standard technologies such as Microsoft BizTalk Server, Component
    Object Model (COM) integration, Microsoft Message Queuing (MSMQ), Simple Object
    Access Protocol (SOAP), Microsoft .NET Framework, XBRL, and XML.

    +   - Microsoft Dynamics AX is designed with common standards shared with other
    Microsoft applications; it enables tighter integration and more seamless connectivity
    with products such as Microsoft Windows, Microsoft Office programs, and Microsoft
    SQL Server 2005.

    +   - Dynamics AX supports different Microsoft-developed document formats used
    by Microsoft Office Outlook messaging and collaboration client, Microsoft Office
    Word, and Microsoft Office Excel spreadsheet software and interoperability can
    be assured.

    +   - Unlike some business management systems that force you to use specialized
    tool sets, Microsoft Dynamics AX uses standard adapters based on SQL Server Reporting
    Services and the Microsoft Visual Studio .NET development system. This instantly
    enables you to access a wide variety of industry-standard integration protocols
    and trained integration partners that you can use to connect to the business management
    solutions of your business partners.'
