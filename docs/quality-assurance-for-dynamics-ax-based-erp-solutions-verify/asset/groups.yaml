    \ must use this mechanism to turn on and off the features. One example of such\
    \ features is country-specific functionality. The application must not overwrite\
    \ the configuration keys available in core Dynamics AX product, but a new configuration\
    \ key or any configuration key available in core product can be extended. If extension\
    \ is not possible, new configuration keys must be created.\n- Dynamics AX is a\
    \ fully customizable ERP solution in which customization can be done in several\
    \ layers or at several places in the same layer. While uninstalling a Dynamics\
    \ AX application, the uninstallation process should not remove any other customization,\
    \ which may be in a different layer or in the same layer in which the application\
    \ being uninstalled resides.\n\n## Back up/Restore\n\nA customer should be able\
    \ to back up and restore the application as well as associated data. Since in\
    \ Dynamics AX-based (i.e. X++-based) applications, new fields and tables will\
    \ be treated the same way as any other data and hence core Dynamics AX-based processes\
    \ will consider these entities to be like any other data, they will be backed\
    \ up with the core Dynamics AX backup process.\n"
  mdcn: "\n可信性不能像一次事件那样实现。它需要受过教育的人力资源持续工作，并高度关注与可信性相关的质量，即安全性、隐私性、可靠性等。最后但同样重要的是，客户也应了解如何以最安全的方式使用系统，即应提供实施指南，其中描述了安全加固。\n\
    \n推荐的做法是对所有相关人员进行安全、安全设计和安全编码等方面的教育。这将有助于他们分析安全问题。所有安全问题必须归类为以下类别之一：伪造、篡改、否认、信息泄露、拒绝服务、权限提升和攻击面减少。适当的分类将有助于更好地理解安全问题，并能有效进行根本原因分析。有效的根本原因分析将有助于采取纠正和预防措施。\n\
    \n我们将在第 5 章 *最佳实践 – 可信计算* 中更详细地讨论可信计算。\n\n## 全球化\n\nMicrosoft Dynamics AX 是一个真正全球化的\
    \ ERP 解决方案，因为它支持全球不同地理位置的三十多种语言和货币的输入和输出显示。为了保持 ERP 解决方案的全球化特性，应具备以下特征：\n\n- 更改日期格式等不应需要定制，因此：\n\
    \  - 应使用内置数据类型，或 **EDT（扩展数据类型）** 应从内置数据类型扩展用于时间和日期。\n- 代码应与语言元素分离，以便翻译时无需定制：\n\
    \  - 语言元素（例如帮助文本、显示标签、错误消息等）应使用标签文件系统实现。\n  - 标签长度在不同语言中可能有所不同，因此标签/UI 控件的宽度必须能够根据不同语言的要求进行调整。Microsoft\
    \ Dynamics 具有一个非常好的功能，如果遵循最佳实践（例如控件上的标签未设置为固定宽度），UI 元素的宽度将根据语言需求自动更改。\n- 在世界不同地区，数字格式的约定各不相同，例如小数分隔符、千位分隔符等。Microsoft\
    \ Dynamics AX 提供了根据偏好约定调整数字格式的灵活性。需要遵循一些关于千位分隔符、小数分隔符等的最佳实践，即这些应设置为自动。\n- 在当今企业中，国家已不再是边界，因此\
    \ ERP 系统必须允许使用多种货币及其转换。Microsoft Dynamics AX 方便用户使用不同货币。\n\n我们将在第 3 章中更详细地讨论这些最佳实践。\n\
    \n## 本地化\n\n本地化是将全球化应用程序适配到特定文化或区域的过程。ERP 系统应实现本地化，这意味着：\n\n- 语言元素应与代码分离，以便代码可在本地语言中使用而无需重新定制。\n\
    - GUI 应根据标签或 Windows 控件数量的变化进行调整，以防止布局损坏。\n- 为特定文化或区域调整图形。\n\nDynamics AX 是一个真正可本地化的\
    \ ERP 解决方案。Dynamics AX 中的标签文件系统允许将以下项目与代码分离：\n\n- 显示标签\n- F1 帮助文件\n- 错误消息\n\n\
    Dynamics AX 最佳实践工具是一个非常有用的工具，用于查找代码中是否嵌入了任何语言元素，即上述任何语言元素均未使用标签文件。\n\nDynamics\
    \ AX 具有 IntelliMorph 技术，可使其调整或重新排列用户界面元素，例如文本框、复选框等。这些对齐或调整大小的需求来自以下原因：\n\n- 显示标签在不同语言中的大小不同。\n\
    - UI 元素数量可能根据本地需求而变化，因此可能需要删除某些 UI 元素或容纳更多 UI 控件。\n\n最佳实践是使用不包含任何语言元素或特定文化信息的图形。需要注意的是，是否符合此最佳实践无法使用最佳实践工具进行验证。\n\
    \n## 平台兼容性\n\n在定制过程中，我们需要特别注意使其平台兼容：\n\n- 不应使用与 Dynamics AX 不兼容的任何技术。\n- 不应使用在该操作系统中为保留关键字的任何名称，例如组件名称、注册表项名称等。\n\
    - 在设计企业门户时应考虑浏览器兼容性。\n\n## 设置/安装\n\n任何软件安装或卸载过程中的错误不仅可能导致正在安装或卸载的应用程序出现故障，还可能导致共享某些组件的其他应用程序出现故障，例如\
    \ DLL/Active X 组件、配置设置、注册表值等。以下示例可能是安装或卸载过程中出现的一些可能问题：\n\n- 对共享组件的引用计数和版本检查管理不当可能导致在其他应用程序仍在使用共享组件时将其删除。另一个错误可能是应用程序安装未导致共享组件更新，这将导致已安装应用程序出现故障。\n\
    - 如果需要取消安装过程或由于某种原因安装未完成，设置中缺少回滚功能可能会带来很多困难。一个这样的例子可能是系统/设置包中没有依赖项。\n- 不适当的卸载可能会损坏在\
    \ Dynamics AX 的多个不同层中定制的共享 AOT 元素。不当卸载的另一个例子是未手动删除标签和帮助文件。如果未手动删除标签和帮助文件，它们仍将被\
    \ Dynamics AX 使用，这意味着它们将抑制本不应再被抑制的标签。\n\n为了最大程度地减少不良安装或卸载的影响，设置过程应具有以下特征：\n\n\
    - 应用程序的安装程序必须与核心 Dynamics AX 产品兼容。\n- 设置程序必须在注册表数据库中记录所有 DLL 和 Active X 组件，因为注册表是\
    \ Windows 操作系统中用户、应用程序和计算机特定信息的中央配置数据库。\n- 设置必须更新 AOT 中的 ApplicationVersion 类以添加应用程序的版本/构建号。\n\
    - 正在安装的应用程序的设置程序必须在设置早期阶段检查所需的 Dynamics AX 模块是否可用。如果所需的 Dynamics AX 模块不可用，设置程序应显示依赖项列表并优雅地失败，即适当地逆转设置过程。如果未自动化，则必须提供正确的手动检查程序。设置不应强制从\
    \ Internet 下载。\n- Dynamics AX 具有内置系统，可通过检查配置键来选择或取消选择特定功能。配置键可在以下位置查看：**主菜单 |\
    \ 管理 | 设置 | 系统 | 配置**。正在安装的应用程序必须使用此机制来打开和关闭功能。此类功能的一个例子是国家/地区特定功能。应用程序不得覆盖核心\
    \ Dynamics AX 产品中可用的配置键，但可以扩展新的配置键或核心产品中可用的任何配置键。如果无法扩展，必须创建新的配置键。\n- Dynamics\
    \ AX 是一个完全可定制的 ERP 解决方案，其中定制可以在多个层或同一层的多个位置进行。在卸载 Dynamics AX 应用程序时，卸载过程不应删除任何其他定制，这些定制可能位于不同的层或与正在卸载的应用程序所在的同一层中。\n\
    \n## 备份/恢复\n\n客户应能够备份和恢复应用程序以及相关数据。由于在基于 Dynamics AX（即基于 X++）的应用程序中，新字段和表将与其他数据同样对待，因此基于核心\
    \ Dynamics AX 的流程会将这些实体视为与其他数据相同，它们将与核心 Dynamics AX 备份流程一起备份。\n"
