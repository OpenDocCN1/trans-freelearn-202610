    ## 选项卡


    选项卡分为两类，即网格布局和表单布局。选项卡需要遵守的标准取决于以下因素：


    - 从布局角度来看的选项卡类别

    - 选项卡位置

    - 从使用角度来看的选项卡类型，例如设置选项卡、维度选项卡等。

    - 其包含的 Windows 控件，例如树视图


    选项卡必须符合以下规范：


    | 序号 | 检查点 | 预期结果 |

    |---|---|---|

    | 1 | 任何表单中的第一个选项卡必须始终是概述选项卡。是否有任何表单忽略了此标准？注意：以下情况是这些规则的例外：- 在双选项卡控件表单中，行中的第一个选项卡必须命名为“行”，而不是“概述”。-
    如果选项卡包含树视图控件，当选择树视图时，选项卡必须命名为“树”而不是“概述”。如果未选择树视图，则此选项卡应仅为“概述”。- 此标准不适用于功能窗口类型表单。
    | 否 |

    | 2 | 当打开任何表单时，必须显示概述选项卡。这里需要注意的是，此标准仅在存在概述选项卡时适用。在某些情况下，概述选项卡可以命名为树选项卡或行选项卡；在这种情况下，此规则分别适用于树选项卡和行选项卡。是否有任何表单忽略了此标准？
    | 否 |

    | 3 | 概述选项卡是否包含特定表单的记录列表？ | 是 |

    | 4 | 在行选项卡控件中，第一个选项卡是否命名为“行”？注意：此规则仅适用于双选项卡控件表单，即行选项卡仅存在于此类表单中。 | 是 |

    | 5 | 行选项卡是否包含在页眉选项卡控件中选择的记录的“行”列表？ | 是 |

    | 6 | 任何表单（除功能窗口外）中的第二个选项卡必须始终是“常规”选项卡。此标准适用于页眉以及行（如果存在）。是否有任何表单忽略了此标准？ | 否 |

    | 7 | 在功能选项卡控件中，第一个选项卡必须命名为“常规”。是否有任何功能表单忽略了此标准？ | 否 |

    | 8.1 | 常规选项卡必须包含表单中最常用的控件。是否有任何表单忽略了此标准？ | 否 |

    | 8.2 | 常规选项卡应显示在概述选项卡中选择的记录或在行选项卡中选择行的數據。是否有任何表单忽略了此标准？ | 否 |

    | 9 | 如果任何表单上存在设置选项卡，它应为从左侧数起的第三个选项卡。是否有任何表单忽略了此标准？ | 否 |

    | 10 | 如果设置选项卡相关，则必须命名为“设置”。是否有任何表单忽略了此标准？ | 否 |


    ## 最佳实践 – GUI


    | 序号 | 检查点 | 预期结果 |

    |---|---|---|

    | 11 | 如果任何表单上存在维度选项卡，它应为最右侧的选项卡。是否有任何表单忽略了此标准？ | 否 |

    | 12 | 如果维度选项卡相关，则必须命名为“维度”。是否有任何表单忽略了此标准？ | 否 |

    | 13 | 维度选项卡必须包含控件，用户可以在其中为当前选定的对象定义默认财务选项，例如当前选定零件的首选账户或成本中心。是否有任何表单忽略了此标准？ |
    否 |

    | 14 | 必须仔细遵守选项卡隐喻。这例如意味着控件不得添加或隐藏，并且选项卡上的标签不得根据该选项卡上或同一选项卡控件中的另一个选项卡上的某些输入字段的值或记录类型而更改。可以根据记录类型激活和停用控件。是否有任何表单忽略了此标准？注意：将存在树控件的概述选项卡命名为“树”不仅是允许的，而且是强制性的。
    | 否 |

    | 15 | 是否有任何选项卡上的选项卡控件？ | 否 |

    | 16 | 主键是否出现在常规选项卡的左上角？ | 是 |

    | 17 | 当用户单击任何控件时，可见选项卡的数量不得更改。但是，用户可以通过使用标准 Dynamics AX 约定来隐藏选项卡。是否有任何表单忽略了此标准？
    | 否 |

    | 18 | 是否有任何选项卡控件与两个以上的数据库表相关？注意：如果提供了理由，此检查点可以被忽略。 | 否 |


    ## 表格


    此处表一词用于所有网格，例如概述选项卡或行选项卡。以下规范必须在每个表上遵守。


    | 序号 | 检查点 | 预期结果 |

    |---|---|---|

    | 1.1 | 表格应仅出现在概述选项卡或行选项卡上。是否有任何表单忽略了此标准？ | 否 |

    | 1.2 | 表格是否出现在功能窗口中？ | 否 |

    | 2 | 每一列必须有标题。是否有任何表单不遵循此标准？ | 否 |

    | 3 | 是否有任何表格列宽无法更改？ | 否 |

    | 4 | 是否有任何表格无法按一列或多列排序？ | 否 |

    |  | 注意：此规范不适用于包含派生数据的列。此类列称为显示列。即使列只有图标，此规则也适用。 |  |

    | 5 | 默认情况下，表的键必须出现在最左列。是否有任何表单忽略了此标准？ | 否 |

    | 6 | 默认情况下，文本形式的主键必须出现在第二列。是否有任何表单忽略了此标准？ | 否 |

    | 7 | 所有重要字段是否都出现在概述选项卡中？ | 是 |

    | 8 | 表格中是否出现单选控件？ | 否 |

    '
