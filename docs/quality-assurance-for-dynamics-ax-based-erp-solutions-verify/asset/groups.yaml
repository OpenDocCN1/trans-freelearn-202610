  mdcn: '

    ## 功能键


    在任何 ERP 解决方案中，我们可以将功能分为三类：


    - 符合客户需求的标准功能

    - 实施中不使用的标准额外功能

    - 使 ERP 适应业务场景的定制


    隔离不需要的功能，即通过禁用某些功能来创建标准功能的子集，可以通过启用或禁用功能键代码轻松完成。使用功能键，可以为某个安装创建标准功能的子集。功能键系统可用于单个用户或用户组。此功能是使
    Dynamics AX 成为高度可适应 ERP 的又一工具。


    功能键不仅适用于表、窗体、报表、查询和菜单，还适用于更深层次的内容，即单个类或方法。


    ## X++ 编程语言


    在 Microsoft Dynamics AX 集成开发环境中用于开发和编写类和方法使用的语言是一种面向对象的语言，类似于 Sun Microsystems
    的 JAVA 和 C++。它基于 JAVA，并在代码中嵌入了 SQL。该语言对对象引用具有广泛的检查系统，既在编译时也可在运行时进行检查。如果系统中发现任何对象没有引用，则会收回其存储空间。


    X++ 语言遵循 OOPS 概念，并且继承的概念与任何其他面向对象语言一样有效。它提供了一个巨大的优势，即在 Microsoft Dynamics AX 中某处对属性所做的更改应在
    Microsoft Dynamics AX 中使用该对象的所有地方得到反映/继承。例如，如果数据库字段的显示属性从长度 10 改为长度 15 个字符，则在显示或使用该字段的所有窗体中都会发生变化。


    用任何语言编写的语句在语法上可能是正确的，但这并不能保证它符合编程推荐的最佳实践。Dynamics AX 内置了一个名为 Dynamics AX Best
    Practice Check Tool 的工具。


    ## Dynamics AX 最佳实践检查工具


    代码审查非常耗时，因为它需要将每个语句对照大量检查点进行审查。由于成本原因，手动对照如此大量的质量检查点审查代码几乎是不可能的。Dynamics AX 具有内置的代码扫描工具。它名为
    Dynamics AX Best Practices Check tool 或 ABC 工具。它将代码对照超过 200 个检查点进行验证。


    ## 应用程序组件管理


    Microsoft Dynamics IDE 中的所有对象都可以通过自动附加修改任何对象的开发人员标识以及日期和时间戳来有效管理。


    组件在被处理时会被锁定并从系统中签出。开发人员完成工作后，组件会被解锁并签入系统。


    ## Dynamics AX 层系统


    Dynamics AX 提供了完全的灵活性来定制其各个方面（功能和图形用户界面等），并优雅地在其自己的容器即层中保留不同方所做的各种更改。


    Dynamics AX 应用程序层是 Dynamics AX 应用程序源代码中的层级结构，确保您可以进行修改和添加，而不会干扰您所在层级以下的应用对象。


    由于分层技术，Microsoft Dynamics AX 定制更容易构建和维护，该技术促进了不同合作伙伴在不同层中进行定制。您可以定制一个层中编码的功能，而不会影响其他层中编码的功能。这意味着您可以随着时间的推移以较少的业务中断、风险和费用（即更低的风险、更高的适应性和更低的
    TCO）来适应和升级您的解决方案。例如，您可以选择向标准窗体添加一个字段。添加内容将保存在您当前的层级中；修订后的窗体将替换标准窗体，但您只需删除新窗体即可始终返回到您所在层级以下层级的原始窗体，因此您可以以最小的业务中断风险工作，因为您可以始终使用已正常工作的功能。


    ## Dynamics AX 简介


    Dynamics AX 应用程序层层次结构包含十六个层，分为每组两个层的组，即八个不同的层类别。每个层还都有一个补丁层，用于处理补丁、次要更新、服务包、热修复和额外功能。这种层设计清楚地表明
    Dynamics AX 是为优雅地容纳多方更改而构建的，并鼓励定制。Dynamics AX 层是为不同的 Dynamics AX 组以及不同类型的定制而设计的，如下表所述。层按从下到上的顺序列出：


    | 层 | 用户组 | 特征 |

    |---|---|---|

    | SYS (System) | Microsoft | - 最内层的层。<br>- 用于实现标准 Dynamics AX 应用程序的层。<br>- 该层中的应用程序对象永远不能被删除。
    |

    | GLS (Global Solutions) | MBS Certified third parties | - 解决方案是按照与标准应用程序相同的开发标准创建的，并因此获得资格认证。<br>-
    该层中实现的解决方案作为 Dynamics AX 产品标准的一部分交付。<br>- 这些不是行业特定的垂直领域，而是核心功能，如人力资源模块。 |

    | DIS (Distributor) | - 本地 Microsoft Business Solutions 办公室<br>- 提供国家特定解决方案的 IBI
    合规解决方案提供商 | - DIS 层用于包含国家特定功能。<br>- 由 IBI 解决方案提供商开发的本地化应用程序将保留在 DIS 层中。 |

    | LOS (Local Solution) | Local MBS offices | - LOS 层中的解决方案受标准应用程序使用的许可证代码框架保护。<br>-
    如果本地 MBS 办公室希望认证和分发一个未在内部开发的战略本地解决方案（例如 Payroll），则该解决方案必须在 LOS 层中实现。 |

    | BUS (Business Solution) | Business Partners | - 业务合作伙伴使用 BUS 层开发和分发垂直和水平解决方案给其他合作伙伴和客户。<br>-
    保留用于附加组件/垂直解决方案。<br>- 业务合作伙伴只有在获得 MBS 的书面同意后才能在此层中实现任何解决方案。 |

    | VAR (Value Added Reseller) | Business Partners | - 业务合作伙伴可以在没有任何业务相关限制的情况下使用此层。
    |

    | CUS (Customer) | - 企业<br>- 业务合作伙伴 | - 企业以及业务合作伙伴可以修改此层。<br>- 客户层和用户层包含在内，以支持企业和个人公司在内部开发方面的需求，而不会危及业务合作伙伴所做的修改。
    |

    | USR (User) | End users | - 个人公司或企业内的公司可以利用此层进行特定于客户安装的定制。 |


    ## Dynamics AX 简介


    除了这些主要应用程序层之外，还有补丁层，可以通过层名称末尾使用字母 P 与其他应用程序层区分开来。层为：SYP、GLP、DIP、LIP、BUP、VAP、CUP
    和 USP。补丁层的使用不受任何预定义的 MBS 规则限制，因此可以以任何合适的方式用于支持客户/业务合作伙伴。此过程提供了在不干扰现有层的情况下发送更正的选项。


    所有应用程序层都能够使用 Dynamics AX MorphX 开发套件中提供的所有工具以及所有对象类型、表、类、宏、扩展数据类型、窗体、报表等。联机帮助也包含在层技术中，以及标签系统的使用。


    在每个应用程序层中都提供所有对象类型，使得应用程序层技术非常灵活和动态。


    ## Dynamics AX 定制文件


    每个层在技术上都保存在一个单独的文件中，称为 `Ax<layer>.aod`，例如 SYS 层的 `Axsys.aod`，DIS 层的 `Axdis.aod`，等等。`.aod`
    扩展名是 Application Object Data 文件的缩写。文件存储在 `Appl` 下的 `Dynamics AX Standard` 文件夹中。


    除了 `Ax<layer>.aod` 之外，还有一些其他文件保存层的不同类型数据，如下表所述。


    | 序号 | 命名约定 | 描述 |

    |---|---|---|

    | 1 | Axapd.aoi | - aoi 代表“应用程序对象索引”。<br>- 它告诉 Dynamics AX 在哪里找到每个单独的对象。<br>-
    在任何定制后下次登录 Dynamics AX 时，该文件将被重建。 |

    | 2 | ax<layer><language>.ald | - ald 代表“应用程序标签数据”。<br>- 每个层中每种语言的单独文件。 |

    | 3 | ax<layer><language>.alc | - alc 代表“应用程序标签注释”。<br>- 每个层中每种语言的单独文件。 |

    | 4 | ax<layer><language>.ali | - ali 代表“应用程序标签索引”。 |


    需要注意的是，在直接复制、删除等上述文件时，不应有任何用户连接。

    '
