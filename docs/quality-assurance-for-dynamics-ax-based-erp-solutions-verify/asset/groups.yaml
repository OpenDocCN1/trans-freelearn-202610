  - '[PAGE 108]


    After identifying entry points or interfaces, the next step of threat modeling
    is characterizing the security of the system, which involves binding the threat
    model, gathering information about dependencies that are security critical, and
    understanding the internal component structure working of the system. Once this
    is done, usage scenarios are studied in order to understand how the system will
    be used. This will help understand the use scenarios beyond the security architecture.
    After use scenarios, the dependencies are studied, as some of the dependencies
    on other systems may affect the security of the system under consideration for
    threat modeling.


    After collecting all the information, the system is modeled as a data flow diagram
    or control flow diagram to understand the system action for various use scenarios
    and data or control flow across the trust boundaries, etc. The objective of this
    activity is to know the following:


    +   - How are protected resources affected?

    +   - Where could an external entity manipulate an asset?

    +   - What kind processing occurs beyond entry points?

    +   - How is the information used beyond entry points?

    +   - What processing or action is done on behalf of external entities?


    Now all the threats should be documented with all the information such as description
    of the threat, the target of the attack, the risk of the attack, the possible
    technique for the attack, and strategy to manage the risk. Now every threat has
    enough details to review these threats and prioritize them. Some of them may not
    be great enough to address. The DREAD model may be used to prioritize the threats.
    DREAD is discussed in Chapter 8.


    # Summary


    In this chapter we discussed trustworthy computing, the components of trustworthy
    computing, and how we can achieve trustworthiness. We also discussed phased activities
    in the security development lifecycle.


    Last but not the least, we discussed threat modeling, which can be considered
    as the foundation for trustworthy computing.'
  - '[PAGE 109]


    # 6

    Testing


    In the last few chapters we discussed the characteristics of an ERP system and
    Dynamics AX as an ideal ERP system. Since we need to customize it for every implementation,
    it is imperative that we preserve the qualities that make Dynamics AX an ideal
    ERP system. We also discussed the best practices that should be followed during
    customization to preserve the qualities of Dynamics AX.


    Now we need to verify if the best practices are followed during customization.
    In this chapter we will discuss various types of testing, which will cover verification
    for most of the best practices. IBI references are provided so that readers working
    with IBI-compliant projects can easily demonstrate IBI compliance. For each type
    of testing we will discuss the following:


    +   - Test objectives

    +   - Technique

    +   - Expected results

    +   - Completion criterion

    +   - Special considerations

    +   - Responsibility (i.e. most suitable person to conduct given testing)

    +   - Deliverables

    +   - IBI reference


    # Unit Testing


    As in any project, unit testing is the first level of testing where most of the
    defects should be caught. The objective of this testing is to verify that the
    labels, validations, boundary conditions, flow, and calculations are coded as
    per the defined standards and requirements.'
  - '[PAGE 110]


    # Testing


    The effectiveness of the unit testing is very critical not only for the quality
    of deliverable code, but also to minimize the total efforts of the project team
    and ensure the on time delivery of the code being achieved. The unit testing is
    done only by developers. The following table summarizes unit testing:


    | Item | Details |

    |------|---------|

    | Specifications for Unit Testing | |

    | Technique | Trustworthiness test cases, memory management test cases, and functional
    test cases (validations, conditions, boundary conditions, flow, and calculations)
    should be verified by the developer. A checklist can be prepared for each kind
    of code and a unit test document can be prepared for the code under unit testing.
    A unit test document should be prepared that contains test cases as well as test
    results. |

    | Expected Results | The application behaves as per the unit test cases. |

    | Completion Criteria | All the newly written code is tested. The unit test document
    is filled. |

    | Special Considerations | Dynamics AX 4.0 has a unit test framework. It should
    be utilized. Code coverage must be analyzed for test cases in unit testing. |

    | Responsibility | The developer who have developed the piece of code. |

    | Deliverables | Unit test document. |

    | IBI Reference | None. |


    # Compliance Check to Coding Standards


    The objective of this test is to ensure adherence to Dynamics AX''s best practices
    of coding in the unit under test. Besides that, conformance to the naming conventions
    and commenting is also in the scope of this testing. The following table summarizes
    this testing.'
  - '[PAGE 111]


    **Specifications for Compliance Check to Coding Standards**


    | Technique | Dynamics AX''s best-practice tool should be utilized to detect such
    errors, but it should be ensured that this tool is used in default configuration.


    All naming conventions are reviewed after source code **Titlecase Update** through
    the Add-Ins menu.


    Most of the Microsoft Business Solutions providers have some kind of automated
    mechanism to mark a comment as soon as a new code block is written or an existing
    code block is modified.


    Errors found are reported in:

    - ''Compliance check to coding standards'' for deviations from best practices
    of coding;

    - Review and Authorization form for other defects found in this testing. |

    | Expected Results | Error-free results when running Dynamics AX best-practice
    tool. Some warnings may be acceptable at the discretion of the Lead Developer.
    |

    | Completion Criteria | All best practice errors have been either removed or negotiated
    with Team Leads and documented accordingly.


    All issues related to naming conventions have been fixed.


    All errors found are recorded in the review and authorization form. |

    | Special Considerations | None. |

    | Responsibility | Peer to Developer or Lead Developer. |

    | IBI reference | 2.2 |


    # Compliance Check to Design and Architecture Guidelines


    This test ensures adherence to design concepts and standards prescribed in the
    Dynamics AX Developer''s Guide, Dynamics AX Developer''s Best Practice Handbook,
    and Dynamics AX User Assistance Best Practice Handbook. The following table summarizes
    the specifications:


    **Specifications for the Compliance Check to Design and Architecture Guidelines**


    | Technique | The application objects should be reviewed to check their compliance
    with the guidelines and design patterns.


    All errors found are recorded in the review and authorization form. |

    | Expected Results | All objects found compliant to prescribed standards and guidelines.
    |'
  - '[PAGE 112]


    **Specifications for the Compliance Check to Design and Architecture Guidelines**


    | Completion Criteria | Objects found compliant to prescribed standards and guidelines.
    |

    | Special Considerations | The design patterns document used as reference must
    be reviewed (by a competent person or team) before starting this test. |

    | Responsibility | Lead Developer. |

    | IBI Reference | 2.3 |


    # Help Navigation (User Assistance) Testing


    The objectives of this testing are as follows:


    +   - To ensure that every form has corresponding help and that it is accessible
    through the F1 key.

    +   - To ensure that the file format for help files is .chm.


    The following table summarizes the testing.


    **Specifications for Help Navigation (User Assistance) Testing**


    | Technique | Verification for each form by pressing the F1 key. The help text
    displayed should be as per the stated requirement.


    While defining the help requirements, the following should be taken into consideration:

    - The online help must be easy to understand and must tell the user how to perform
    specific tasks.

    - It must provide a user experience that is consistent in terms of the writing
    style and depth of information. Ideally this can be covered under Functional testing
    if help has been taken care of, else a separate test must be performed for help
    navigation when help is added after the functional testing.


    A User assistance test document should be prepared, which will form the basis
    for testing. |

    | Expected Results | Pressing F1 while an application window is open must result
    in a launch of a contextually-correct help window.


    The help window must comply with Dynamics AX help standards. |

    | Completion Criteria | All forms in the code under test have been tested and
    all help documentations are as per Dynamics AX help standards. |

    | Special Considerations | Performing this testing along with Functional testing
    will reduce the efforts required. |

    | Responsibility | Tester. |

    | IBI Reference | 4.1 |'
  md: "\nAfter identifying entry points or interfaces, the next step of threat modeling\
    \ is characterizing the security of the system, which involves binding the threat\
    \ model, gathering information about dependencies that are security critical,\
    \ and understanding the internal component structure working of the system. Once\
    \ this is done, usage scenarios are studied in order to understand how the system\
    \ will be used. This will help understand the use scenarios beyond the security\
    \ architecture. After use scenarios, the dependencies are studied, as some of\
