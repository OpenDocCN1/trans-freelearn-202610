    | 7 | Is there any icon that blinks? | No |


    # User Assistance—Help


    Dynamics AX help systems comprise six types of help:


    +   - **Procedural help**: This is the help that opens if the F1 key and then
    **Content** are clicked. The objective of this help is to provide complete information
    about the screen in focus so that a user can know how to complete a task.

    +   - **Form help**: This opens in a separate window on request from the user.
    It describes when and why this form should be used.

    +   - **Screen tips (what-is-this help)**: This appears near to a text box so
    that as a user can know what this text box is.

    +   - **Tool tips**: This type of help appears near a command button, if the mouse
    pointer is kept stationary on the command button for a short time.

    +   - **Explicit tips**: This is an explanation of the currently selected object,
    which automatically appears above the table.

    +   - **Status bar messages**: A status bar message appears on the left side of
    the status bar.'
