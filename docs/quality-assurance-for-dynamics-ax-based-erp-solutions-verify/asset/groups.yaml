    # 5

    Best Practices—Trustworthy Computing


    Today, computers are very important and useful for individuals and organizations.
    In the case of organizations, the information needs to flow in an accurate, reliable,
    and controlled fashion. The success of any business depends upon the reliability,
    availability, and security of information used for operational control, management,
    and strategic planning of the business. Due to the criticality of information
    being available in a secured and private manner, the benefits of an ERP system
    can be fully unleashed only if the information is available to the customer in
    an accurate, secured, and controlled manner as and when required. These characteristics
    will make an ERP a trustworthy system.


    Microsoft defines these qualities as follows:


    **Availability**: *Our products should always be available when our customers
    need them. System outages should become a thing of the past because of a software
    architecture that supports redundancy and automatic recovery. Self-management
    should allow for service resumption without user intervention in almost every
    case.*


    **Security**: *The data our software and services store on behalf of our customers
    should be protected from harm and used or modified only in appropriate ways. Security
    models should be easy for developers to understand and build into their applications.*


    **Privacy**: *Users should be in control of how their data is used. Policies for
    information use should be clear to the user. Users should be in control of when
    and if they receive information to make best use of their time. It should be easy
    for users to specify appropriate use of their information including controlling
    the use of email they send.*


    > — An excerpt from Bill Gates'' email on Trustworthy Computing, January 5, 2002.


    Microsoft adds another dimension in trustworthiness and that is the business integrity.
    This means a software provider should be responsive and transparent in dealing
    with its customer. This is beyond the scope of this book.'
  - '[PAGE 100]


    # What is Trustworthy Computing?


    We have discussed the elements of a trustworthy computing experience. Now we will
    discuss the core elements of trustworthy computing in greater detail from the
    engineering perspective; i.e. how to achieve trustworthiness.


    # Security


    The prime component of trustworthy computing is security, which means — making
    IT applications inherently safer. Security can be achieved with the following
    strategy:


    +   - Making the application development life cycle compliant with Microsoft''s
    Security Development Lifecycle.

    +   - Better equipped code analysis from the security perspective.

    +   - Threat and vulnerability mitigation through:

    +     - Employment of best-of-breed threat protection, detection, and removal
    mechanisms.

    +     - Isolation and resiliency; i.e. isolating the vulnerable code and providing
    effective control over the various computer processes interacting with each other.

    +   - Strong authentication mechanisms to ensure correct who, what, and when information:

    +     - Who: To know who the logged-in user is, so that the user''s privileges
    can be determined, and traced at a later stage if required.

    +     - What: To know the user activities performed and the privileges available
    to user so that access or deny decisions can be taken for any of the system assets
    such as a data table.

    +     - When: To know when events happened so that any security attacks can be
    analyzed for detection, prevention, and removal of security impacts.

    +   - Authorization: To know what types of privileges (read-only, read and write,
    etc.) are available for a particular user group.

    +   - Access control: The access control list (ACL) should be designed in the
    beginning so that proper privileges can be assigned to the system users. The ACL
    should not be limited to files or folders, but also apply to registry settings,
    database files, printers, and objects in active directory, etc. Some other tips
    about ACL are:

    +     - To protect sensitive files and folders of your application, programmatically
    create ACLs during installation.'
  - '[PAGE 101]


    +   - Be explicit and use the deny access control entry (ACE) often.

    +   - A NULL discretionary access control list (DACL) can act as a passage for
    a hacker. For example, a hacker can change a NULL DACL to Everyone Deny Access
    so don''t use NULL DACL entries.

    +   - Education and awareness are key strategies to ensure the use or development
    of IT applications in the most secured way. The following could be used to increase
    awareness about security:

    +     - Providing security hardening guides with ERP applications so that ERP
    can be implemented in the most secured way.

    +     - Providing security education to all concerned such as programmers, testers,
    program managers, and IT administrators.


    # Privacy


    The core element of privacy is that the users should feel that their information
    is confidential. They are not forced to share their information, nor is the information
    taken without their agreement. To meet this characteristic the following guidelines
    are suggested:


    +   - Functional design to achieve privacy such as:

    +     - Features and functionality to support the customers'' right to control
    their personal information.

    +     - Features to provide an option to customers to opt in or opt out when providing
    personal information.

    +   - Design a solution keeping privacy as a concern.

    +   - Comply with Microsoft Privacy Policy for development as well as deployment.


    # Reliability


    Reliability does not have any measure; different people have different perceptions
    about reliability. A non-IT professional may define reliable systems as "systems
    working continuously in an expected and consistent manner." While an IT professional
    may define a reliable system as "a system that is dependable requires minimum
    maintenance and interruptions with high availability of the overall system." The
    difference in the definitions creates a major obstruction for devising a measuring
    unit for it. Microsoft defines that reliability has the following five characteristics:


    +   - Predictable: It provides consistent services.'
  - '[PAGE 102]


    *Best Practices – Trustworthy Computing*


    +   - Maintainable: It is easy to configure and manage.

    +   - Resilient: It works despite changes in conditions.

    +   - Recoverable: It is easily restored without adverse impact.

    +   - Proven: It operates in a variety of environments.


    The above qualities can be achieved with a multipoint strategy, which not only
    ensures higher reliability, but also continuous improvement in it:


    +   - Designing for greater reliability such as interoperable design, fail-safe
    design etc.

    +   - Engineering to offer more reliability such as code analysis for superior
    coding logic and removal of memory leakage

    +   - Features to understand where the system fails or how the customer wants
    to use the system, etc. Windows error reporting is one such example


    # Microsoft Security Development Life Cycle


    To develop, deploy, and use software applications in a trustworthy way Microsoft
    recommends a Security Development Life Cycle. This lifecycle is based on SD3+C
    methodology.


    # SD3+C Methodology


    Microsoft has developed a methodology to combat real-world security issues. It
    consists of four pillars:


    +   - Secure by design: Any ERP solution based on Dynamics AX should be designed,
    architected, and implemented in such a way that it can protect itself as well
    as the information being processed. Following are a few points that make for secure
    design:

    +     - The ERP solution should be designed in such a way that it only accepts
    the user inputs that are supposed to be the expected inputs.

    +     - Dangerous APIs should be handled in a secured way (as prescribed by Microsoft).

    +     - Data or control commands should be validated at trust boundaries.

    +     - Overall architecture should be secure, which can be achieved by threat
    modeling at design stage.'
