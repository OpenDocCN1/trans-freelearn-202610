    # Summary


    In this chapter we studied the challenges of business that are solved by ERP packages.
    To address these challenges the following key qualities are required in an ERP
    package:


    +   - Competitive and affordable cost of ownership

    +   - Flexibility in adaptability to business processes

    +   - Scalability

    +   - Usability

    +   - Coherence of business processes

    +   - Ease of integration

    +   - Internationalization

    +   - Localization


    We also discussed the features that make Dynamics AX an ideal ERP system and the
    built-in tools that are helpful in preserving the qualities of Dynamics during
