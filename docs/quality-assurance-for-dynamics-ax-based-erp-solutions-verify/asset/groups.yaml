  mdcn: "\n- 缺陷管理工具必须能够记录 bug 的原因，并且选项必须包括以下内容：\n  - 不是安全漏洞\n  - 缓冲区溢出或下溢\n  - 算术错误（例如，整数溢出）\n\
    \  - SQL/脚本注入\n  - 目录遍历\n  - 竞态条件\n  - 跨站脚本\n  - 加密弱点\n  - 弱认证\n  - 弱授权或不当的访问控制列表\n\
    \  - 无效的密钥隐藏\n  - 无限资源消耗（DoS）\n  - 不正确/无错误消息\n  - 不正确/无路径名\n  - 规范化\n  - 其他\n\
    - 缺陷管理工具应能够接受以下其中一个值作为解决方式：\n  - 不采取行动\n  - 将所有内容告知客户\n  - 禁用或移除该功能\n  - 修复它\n\
    \n## 缺陷生命周期\n\n缺陷生命周期应基于项目的定制需求以及项目中使用的通信方法。关闭类别应具有充足的选项，以便可以轻松记录关闭 bug 的原因。可能的已关闭类别可能包括以下内容：\n\
    \n- 不是问题\n- 无法重现\n- 需求已更改\n- 与此代码段无关\n- 已验证\n- 重复\n- 不可重现\n- 按设计\n- 已推迟\n- 已撤回\n\
    - 无需操作\n\n如此广泛的已关闭类别列表将有助于识别已关闭问题如何达到关闭阶段。\n\n## 摘要\n\n在本章中，我们讨论了 bug 是什么以及如何对其进行分类。我们还讨论了适用于对安全相关\
    \ bug 进行分类的其他维度以及缺陷管理工具所需的特殊特性。\n\n## 9 Dynamics AX 工具\n\n由于定制过程中存在特殊性，市场上大多数标准工具除非付出很大努力将其适配到\
    \ Dynamics AX 的需求，否则无法使用。幸运的是，Dynamics AX 提供了一些有用的工具：\n\n- 用于代码分析或扫描的最佳实践检查工具\n\
    - 用于扫描代码更改的比较工具\n- 用于代码覆盖率分析和性能分析的代码分析器\n- 用于基准测试的基准套件\n\n## 最佳实践检查工具\n\nDynamics\
    \ AX 最佳实践检查工具可用于检查代码和对象是否符合 Dynamics AX 的最佳实践。此工具可以在三种不同的方式下使用：在编译时（仅当诊断级别设置为第\
    \ 4 级时）、在签入时，以及在任何时间手动使用。\n\n要将诊断级别设置为第 4 级，请转到 Tools | Options | Compiler 并将\
    \ Diagnostics level 的值设置为 Level 4。\n\n要手动调用此工具，请转到 AOT 中的一个或多个节点，然后：\n\n1. 右键单击。\n\
    2. 选择 Add-Ins。\n3. 选择 Check Best Practices。\n\n双击最佳实践偏差消息将打开代码编辑器。\n这些消息为：\n\n\
    - 错误：应该一定修复的事情（在最佳实践工具输出中以红色显示）\n- 警告：应该强烈考虑修复的事情（在最佳实践工具输出中以黄色显示）\n- 信息：可能值得知道的事情（在最佳实践工具输出中以蓝色显示）\n\
    \n类别信息可以从最佳实践选项表单中控制。此表单可以从工具菜单访问。单击工具菜单中的 **Options**，然后单击 **Best Practices**。\n\
    \n选择 **Warning level** 以设置您希望在编译器输出窗口中看到的错误消息类型。编译器输出窗口将有三个选项 – **Errors only**、**Errors\
    \ and warnings** 和 **All**。以下表格描述了这三个选项：\n\n| 选项 | 错误 | 警告 | 信息 |\n|---|---|---|---|\n\
    | 仅错误 | 是 | 否 | 否 |\n| 错误和警告 | 是 | 是 | 否 |\n| 全部 | 是 | 是 | 是 |\n\n用户还可以通过勾选或取消勾选以下表格中列出的相关选项来控制某些类型确认检查结果的显示。\n\
    \n| 检查 | 说明 |\n|---|---|\n| 属性 | 检查所有期望值与默认值相同的属性 |\n| AOT 中的唯一树节点名称 | 检查 AOT\
    \ 中所有节点的唯一节点名称 |\n| 对象 ID | 检查是否有任何对象 ID 被修改 |\n| AOS 性能 | 检查表单的 AOS 优化 |\n| 可信计算\
    \ | 检查是否遵循可信计算的最佳实践 |\n| 已使用 | 检查未使用的元素，例如变量、扩展数据类型等。 |\n| 引用应用程序对象的存在 | 检查引用应用程序对象的存在\
    \ |\n\n| 检查 | 说明 |\n|---|---|\n| 已停用功能的使用 | 检查系统中已停用功能的使用 |\n| 记录和表 ID 引用 | 检查开发人员在代码中是否未使用\
    \ `RecId` 或 `TableId` 系统数据类型 |\n| 配置键 | 检查配置键的使用 |\n| 安全键 | 检查安全键的使用 |\n| 标签 |\
    \ 检查标签是否以正确的方式使用。以下为主要检查：\n- 标签应用于所有用户界面文本。\n- 在代码中编写的用户界面文本必须用双引号书写。\n- 用于帮助（而非用户界面文本）的标签必须以句号结尾。\n\
    - 帮助和标签不得相同。 |\n| 分析可见性 | 检查表、字段或视图的可见性设置 |\n\n上述提到的最佳实践检查适用于所有 AOT 元素或至少适用于一个以上\
    \ AOT 元素。以下是仅适用于特定 AOT 元素（如下表所述）的一些最佳实践检查。\n\n| 检查类别 | 检查 | 说明 |\n|---|---|---|\n\
    | 表 | 唯一标签 | 检查每个表字段是否具有唯一标签 |\n|  | 索引使用 | 检查索引是否选择得当，即：\n- 检查只有一个索引的表应将该索引作为聚集索引\n\
    - 检查如果存在唯一索引，则应定义主键索引\n- 检查 RecId 索引未用作聚集索引 |\n|  | 删除操作 | 检查两个表是否没有相互指向的删除操作\
    \ |\n|  | 声明的标题字段 | 检查是否已声明标题字段 |\n|  | 表单引用 | 检查引用的菜单项是否存在 |\n|  | 字段属于字段组 |\
    \ 检查每个字段是否属于一个字段组 |\n\n| 检查类别 | 检查 | 说明 |\n|---|---|---|\n|  | 字段名/方法名冲突 | 检查字段名/方法名冲突\
    \ |\n|  | 字段组中的字段数 | 检查字段组中的字段数 |\n|  | 分析行为 | 检查在设置了 **AnalysisVisibility** 属性的所有表或视图上是否设置了\
    \ **AnalysisSelection** 或 **TypicalRowCount** 属性 |\n|  | 货币代码字段 | 检查货币代码字段 |\n\
    |  | 货币日期字段 | 检查日期字段 |\n|  | 检查表关系 | 检查表关系及关系的正确性 |\n| 表集合 | 关系 | 检查表集合中引用的表是否存在\
    \ |\n| 类 | 抽象 | 检查抽象类是否标记为 `abstract` |\n|  | Runbase 实现 | 通过 Runbase 实现检查对话框框实现\
    \ |\n|  | 缺失成员函数 | 检查类是否缺少成员函数 |\n|  | 构造函数 | 检查类构造函数的实现 |\n| 方法 | 空方法 | 检查空方法\
    \ |\n|  | 日期功能 | 检查日期功能的使用，例如类型转换、today 函数等。 |\n|  | 隐私 | 检查可以根据调用方式分配更大的隐私级别（public、private\
    \ 等） |\n|  | 打印和暂停 | 检查代码中是否存在用于调试的 `print` 和 `pause` 语句 |\n|  | 变量使用 | 检查变量的声明、使用、命名约定符合性以及未使用的变量\
    \ |\n|  | 未来保留字 | 检查变量名是否使用了任何未来保留字 |\n|  | 单引号文本 | 检查是否使用了单引号中的文本 |\n\n"
