- raw:
  - '[PAGE 30]


    > *We chose Microsoft Business Solutions Dynamics AX because of the possibility
    of integrating it with office software suites, flexible reporting, the ability
    to display information in two currencies, the multilingual user interface and
    the functionality of the Project Module, all giving us an advanced project management
    system. — Agnieszka Burak, Chief Accountant ZWIK. (http://www.zwik.lodz.pl/) (Source:
    http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=200554.)*


    # Internationalization


    Internationalization is very much necessary when the scope of business is more
    than one country. The following features make Dynamics AX a true internationalized
    ERP solution:


    +   - Dynamic AX is Unicode compliant. Today Unicode is the largest industry standard
    character set; compliance to Unicode means that you can access new regions and
    transport data through many different systems with least risk of data corruption.
    Unicode compliance enables you to integrate with subsidiaries where the language
    might use a multi-bit character set such as China, Japan, and other East Asian
    countries.

    +   - Dynamics AX supports the linkage of date/currency format with locales, which
    enables Dynamics AX to automatically change the date format as per the standards
    of the locale. Dynamics AX supports multiple languages and multiple currencies
    (more than 36 languages and 40 currencies).


    # Localization


    The business processes cannot be identical in different countries as there may
    be differences in the regulatory system, tax structure, language, currency, and
    locale. IntelliMorph is a feature that provides the capability to Dynamics AX
    to realign its Graphical User Interface according to difference in business processes.
    Besides that, the following features are very helpful to localize the Dynamics
    AX ERP package.


    +   - Microsoft Dynamics AX is featured to support built-in multi-site, multi-language,
    and multi-currency capabilities in 36 countries and 40 languages.

    +   - One can get local tax, regulatory, and market requirements from the localization
    layer of Dynamics AX.

    +   - The label file system is a powerful feature in Dynamics AX, which enables
    Dynamics AX to automatically change labels as per the locale settings.


    > *Because of the multi-language tool in Microsoft Dynamics AX, our employees
    can work more productively in their local language. — Patrik Dannehall, IT Director,
    Haldex Europe. (http://www.haldex.com) (Source: http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=200926.)*'
  - '[PAGE 31]


    # Scalable


    Businesses grow with time; a small business may turn to a multimillion dollar
    business tomorrow. In such cases it is necessary that an ERP solution is highly
    scalable, i.e. it should be able to change according to the growing business needs.
    The following features make Dynamics AX a highly scalable solution:


    +   - Dynamics AX is truly modular in structure and various modules can be added
    or removed easily if the core of Dynamics AX is not touched. You can use the functions
    you need now and unlock additional capabilities as needs arise. Dynamics AX is
    modular up to the second degree i.e. it is not only modular up to department level
    but it goes further; e.g. HR has HR 1, HR 2, HR 3.

    +   - With the MorphX development environment, developers can design, edit, compile,
    and view the changes within minutes using a single screen.

    +   - Microsoft Dynamics AX can easily adapt to market changes, which helps your
    people and business follow the market and work more effectively. Furthermore,
    you can extend the already powerful core solution by adding industry-specific
    solutions provided by a wide variety of partners and independent software vendors.

    +   - Dynamics AX supports the three-tier, object-oriented architecture of Microsoft.
    Dynamics AX integrates with other Microsoft technologies such as Microsoft SQL
    Server, offering you high-speed server-side performance and the capability to
    scale your IT infrastructure easily, so the solution can grow with the company.


    > *Microsoft Dynamics AX is a scalable, flexible solution that is capable of supporting
    our technology requirements, both now and in the future.* — Sébastien Batt, Manager
    of Microsoft Dynamics AX E-Commerce and Back-Office Systems, Stock Fenêtre. (http://www.stock-fenetre.com)
    (Source: http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=1000003854.)


    # Code Documentation


    During the life span of an ERP system, other developers might need to understand
    the code written by the developer, and hence it is necessary that any modification
    made to the standard Dynamics AX is documented. Dynamics AX facilitates documenting
    why and what customizations were made by various developers, which would help
    a new developer to understand and customize new functionalities.'
  - '[PAGE 32]


    # Comprehensive Functionality


    Last but not least, an ERP system should be functionally rich to accommodate business
    processes with minimal changes in the standard ERP package. This not only enables
    rapid implementation, but also reduces the total cost of ownership.


    +   - Dynamics AX offers a wide range of industry-specific verticals developed
    in compliance with Microsoft Industry Builder Initiative (IBI) specifications.
    Compliance with IBI specifications not only ensures the quality in these verticals,
    but also goes beyond that (such as prompt support services, etc.). The high adaptability
    of Dynamics AX ensures that it can be implemented as a feature-rich ERP where
    all business processes are customized as per the custom need.

    +   - Microsoft Dynamics AX is designed to provide your customers/vendors security-enhanced
    access to the business information they want over the Internet. Secured Internet
    access helps your customers/vendors enter sales orders and find shipment status,
    account balances, inventory stock levels, and purchase order status – 24 hours
    a day, 7 days a week – from anywhere in the world.

    +   - Built-in business models are the true power of Dynamics AX. It supports
    a wide types of functionality, e.g. it not only supports the various supply chain
    models such as build-to-order, engineer-to-order, and build-to-forecast, but also
    works well in mixed-mode environments.


    > _It is now possible for us to get the data we need to react to changes and effectively
    manage the business in a timely fashion. The system allows us to track an individual
    item by group or by its specific part number. This gives us the visibility we
    need over the global operations, —Joe Horvath, Vice President of the Apollo Program
    Office, Esselte. (http://www.esselte.com) (Source: http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=1000003878.)_


    # Customization of Dynamics AX


    Virtually all business owners strive to do something to stand out from their competitors;
    the same cannot always be said for their choice of off-the-shelf software. As
    a result, the unique aspects of a business are often lost in a "plain vanilla"
    integrated enterprise application. However, the Dynamics AX solution allows businesses
    to integrate their unique terminology, formulas, processes, and business strategy
    totally and seamlessly into the software. Now we will briefly discuss some of
    the useful features in Dynamics AX, which are very useful for Dynamics AX customization.'
  - '[PAGE 33]


    # MorphX


    Microsoft Dynamics AX provides an integrated development environment called MorphX.
    It is very intuitive and enables developers to graphically design, develop, and
    report for both types of interfaces, i.e. Windows client and web browser interfaces.
    The MorphX development tools are available at the **Tools | Development tools**
    menu. This tool helps developers extensively by offering designing, editing, and
    compiling through a single screen. Once the changes are compiled, all changes
    will be reflected by the application.


    The MorphX development suite is a collection of a wide range of features. which
    enables fast pace customization, with affordable cost, without affecting the reliability,
    integrity, and security of the original solution, i.e. with minimal risk involved.
    Another useful tool, which provides the wonderful capability to align the GUI
    as per the context of location, language, currency, regulatory requirements, etc.
    is IntelliMorph. We will discuss it in the following section.


    # IntelliMorph


    Usually the major concern for the solution designers or developers is that a GUI
    entity (form, report, etc.) works well in all the languages supported. It is easy
    to translate different labels by using label file systems. However, the length
    may vary greatly, which could spoil the entire GUI design and the usability of
    such systems would be compromised.


    In different countries, functionality may be used in a different way or some of
    the fields may be hidden or extra ones required. This may also be the case with
    different companies.


    Consider a scenario where some business processes may not be implemented, and
    hence all connections from other business processes to this business process have
    to be removed. Therefore, some fields may need to be added and some removed from
    all the relevant business processes. Due to such addition or deletion of fields
    the GUI may change, which will be highly inconvenient for the user.


    MorphX has a solution for the above mentioned scenarios, i.e. IntelliMorph technology.
    The IntelliMorph technology allows forms and reports to automatically resize the
    display widths to accommodate the word length, and hence the GUI remains in a
    presentable or useable shape.'
