    # Profile Summary Form


    This form is used to calculate the total execution time for each line of code,
    each method, and each object for a code profiler run. This form is used when the
    ''Calculate line total'' checkbox is cleared on the Code profiler form while creating
    a run; else total calculation is automatically done.


    > The code profiler tool will be soon replaced by "Trace Parser" trace parser.


    # Dynamics AX Benchmark Toolkit


    The ''Dynamics AX Benchmark Toolkit'' for performance testing is an external tool
    supplied along with **Microsoft Dynamics AX Resource Kit**. It offers the following
    distinct advantages in comparison to the benchmark tool in Axapta 3.0.


    +   - Greater functional coverage.

    +   - Light-weight business connectors in comparison to Dynamics AX clients.

    +   - ''Dynamics AX Benchmark Toolkit'' is a managed assembly in C#. It has two
    major libraries, i.e. The Programming Model Library and The Microsoft Dynamics
    AX Wrapper Library. The first library is to provide a gateway to access Dynamics
    AX through business connectors. The latter library (Microsoft Dynamics AX Wrapper)
    is to generate type-safe managed classes to interface with Microsoft Dynamics
    AX. The prerequisite for learning about how to use this tool is to know .NET and
    X++ so this tool is not being discussed in this book.


    # Summary


    We discussed some Dynamics AX built-in tools, which may play a vital role in making
    the testing process more efficient and effective. Dynamics AX also has a Unit-test
    framework, which is beyond the scope of this book, as unit testing is usually
    carried out by the development team itself.'
