- raw:
  - '[PAGE 140]


    # Classification for Security Bugs


    The security bugs are classified as per STRIDE and hence it is critical to have
    correct categorization of bugs:


    +   - **Spoofing:** If a user pretends to be another entity or person. Other terms
    for spoofing are impersonation, masquerading, or identity theft.

    +   - **Tampering:** If there is an unauthorized modification of data by using
    techniques such as SQL Injection. Other terms for it may be (data) integrity.

    +   - **Repudiation:** If a user denies having performed an action, and there
    is insufficient evidence to prove the contrary.

    +   - **Information disclosure:** If information is accessed by an unauthorized
    person.

    +   - **Denial of service:** If people misuse the functionality with an intention
    of creating stressed conditions so that other real users cannot use the system
    comfortably.

    +   - **Elevation of privilege:** If a user gets more privileges than entitled.

    +   - **Attack surface reduction:** If code access is reduced for users with least
    privileged such as anonymous users.


    The defect management tool must have an additional option ''Not a Security Bug''
    to declare that an issue is not a security-related issue.


    # Root Cause Analysis for Security Bugs


    Root cause analysis must be carried out for all security bugs. Based on their
    origin, security bugs could be classified in one of the following types:


    +   - Not a security bug.

    +   - **Buffer overrun or underrun:** Occurs when the size of a variable is not
    large enough to contain a given value and the memory buffer is overwritten with
    extra data. Buffer overruns are one of the most common and damaging security risks.
    While designing or coding ensure that variables declared have sufficient size
    or precision to handle the maximum or minimum possible values. A few types of
    buffer overruns are heap overruns, stack-based buffer overruns, V-table and function
    pointer overwrites, and exception handler overwrites. The buffer overrun may result
    in access violation, instability, and code injection for malicious purposes.'
  - '[PAGE 141]


    +   - Arithmetic error: Occurs when the limitations (any of the upper or lower
    range boundaries) of a variable are exceeded. For example, an integer overflow.
    There can be two kinds of arithmetic errors — over flow and under flow. Over flow
    occurs when the value to be stored exceeds the upper limit of a variable''s storage
    capacity and under flow occurs when the value to be stored is less than lower
    limit of a variable. Arithmetic errors may leads to some more serious errors such
    as buffer over flow or buffer underflow.

    +   - SQL/Script injection: This is the process of adding SQL statements in user
    input, which may be to bypass authorization, call built-in stored procedures,
    and probe the database. SQL injection attack are possible when SQL statements
    are dynamically built using user inputs; hackers can add a part of SQL statement
    to the user input and hence the resulting SQL statement could perform a malicious
    operation.

    +   - Cross-site scripting: This attack occurs when a user input directly outputs
    without checking its validity. For example, if a malicious JavaScript is inputted
    in a discussion forum, this malicious JavaScript code is executed at the client
    machine whenever a user opens that forum. Another example could be stealing client-side
    cookies using a form tag in email.

    +   - Cryptographic weakness: Occurs when a weak algorithm is used or keys are
    not securely stored. Sometimes it occurs due to human engineering factors.

    +   - Weak authentication: The authentication mechanism should be strong and the
    user should not be able to bypass it through any means such as SQL injections,
    canonicalization, etc.

    +   - Weak authorization or inappropriate access control list: The authorization
    level should be set for every asset, precisely; it should be correctly set.

    +   - Ineffective secret hiding: This occurs when some secret information is provided
    to a user. A few examples are error messages, exception handling, etc.

    +   - Unlimited resource consumption (DoS): Occurs when too many services are
    provided to unauthorized users. For example it should be checked at an early stage
    (rather than just checking before information display to the user) whether a user
    is authorized or not for the information before retrieving any data from the database.
    DoS attacks can be of four types: CPU starvation, memory starvation, resource
    starvation, and network starvation. This threat should be considered when either
    user input is trusted more than required, costly operations are done before checking
    authorization, or proper security is not involved in security design.

    +   - Incorrect/No pathname: A file or path name can be encoded in many ways so
    the incorrect path name may lead to canonicalization errors. Path name with spaces,
    or special characters such as &, ?, or + should be avoided.'
  - '[PAGE 142]


    +   - Canonicalization Erros: Occur when a security decision is based upon file
    name and parsing error occurs while parsing a file name, URL, or device name.
    This may result in an incorrect permission being applied by the resources being
    accessed.

    +   - Others such as accidental breaches (e.g. wrong operation by user due to
    inappropriate or missing error message, or poor security practices), directory
    traversal, and unhandled exceptions or poor exception handling due to which a
    user can get valuable information.


    # Importance Identification Using the DREAD Model


    In order to take appropriate action on each security issue, its importance needs
    to be identified. DREAD is a useful tool to calculate the importance of a security
    bug. DREAD stands for:


    +   - Damage Potential: What will be the degree of the damage to the system?

    +   - Reproducibility: Is it easy to produce the same attacks again and again?

    +   - Exploitability: Is much effort or experiment required to make an attack?

    +   - Affected Users: What will be the percentage of people affected by this threat?

    +   - Discoverability: Can this attack be easily discovered?


    A value from one to ten is assigned to each of the five DREAD components and then
    the sum of the ratings is calculated for each security threat. This sum value
    indicates the importance level of a security threat.


    Based on the sum value in DREAD, the following actions could be taken for each
    threat:


    +   - Take no action: If the DREAD value is very low.

    +   - Convey everything to customer: If the DREAD value is very low.

    +   - Disable or remove the feature: If the DREAD value is moderate to high and
    a fix is very costly in comparison to ROI.

    +   - Fix it: If the DREAD value is moderate to high and a fix is not so complex.


    The defect management tool should be able to accept one of the above values as
    a closing resolution.'
  - '[PAGE 143]


    # Defect Management Tool


    The defect management tool must support classification with proper levels for
    categorizations. Besides this there are some more additional requirements for
    a Defect Management Tool as prescribed by the IBI Specifications for the Dynamics
    AX.


    +   - The defect management system must have the capability to register, track,
    and report the following:

    +     - Bugs

    +     - Issues

    +     - Design change requests

    +   - The defect management tool must accept or generate the following information
    for each bug:

    +     - Unique number (auto generated)

    +     - Description of the bug

    +     - Bug priority (four levels as mentioned above)

    +     - Bug severity (four levels as mentioned above)

    +     - A record of comments to show the how defect is handled throughout its
    life

    +     - Closing comments

    +   - The defect management tool should generate reports as per the different
    classification criteria mentioned above as well as status.

    +   - The defect management tool must generate reports for all open bugs (i.e.
    bugs with status such as work in progress, under investigation, more information
    required, waiting clarification from client, deferred, etc). It will help to generate
    a report for all know bugs at any point of time.

    +   - The defect management tool must accept additional information for security
    related bugs.

    +   - The defect management tool must take an action after finding security-related
    issues:

    +     - Must fix: Issues such as write access violations, stack overflow exceptions

    +     - Must investigate: Large memory allocations, integer overflows, custom
    exceptions, other system-level exceptions that could lead to an exploitable crash'
