  - '[PAGE 121]


    # Back up and Restore Testing


    The objective of this testing is to verify the ability to back up and restore
    data and AUT. Usually X++ applications share the same database as the standard
    Dynamics AX product and hence customization is considered as an extension of standard
    Dynamics AX. In such a case the back up and restore process of standard Dynamics
    AX will work and hence no separate mechanism is needed for this purpose. Of course
    the back up and restore mechanism provided in standard Dynamics AX need not to
    be tested.


    This testing is applicable if customized X++ applications have a separate database.
    The following table summarizes this testing.


    | Specifications for Back up and Restore Testing |

    |---|---|

    | Technique | An executed sequence of backup and restore processes should return
    the application to the same state.

    A back up and restore test document should be prepared to specify the test cases
    and expected results. |

    | Expected Results | An executed sequence of backup and restore processes returns
    the application to the same state. |

    | Completion Criteria | If the application can be restored to its original state
    by a sequence of backup and restore process. |

    | Special Considerations | Application backup and data backup processes are two
    different things and hence should be tested separately. If testing is related
    to an X++ application using a separate database only data backup and restore mechanism
    should be tested, while if it is a .NET application both need to be tested. |

    | Responsibility | Tester. |

    | IBI Reference | 14.1 |'
