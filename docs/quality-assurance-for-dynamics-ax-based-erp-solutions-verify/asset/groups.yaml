    # Security Testing


    Any software application cannot be useful until and unless it is secure. As per
    Microsoft vision, IT applications should be as safe as water and electrical devices
    in our homes. The following should be included in the objectives of security testing
    for Dynamics AX implementations:


    +   - To ensure that Application Under Testing (AUT) does not bypass standard
    security model

    +   - To ensure that the system is robust enough to deal with security threats

    +   - Analysis of threat modeling, security measures, etc.

    +   - Final code review to ensure that no critical security is left unresolved


    The following table summarizes this testing.


    | Specifications for Security Testing |

    |---|

    | Technique | The following verifications should be performed as part of this
    testing:

    In **Administration | Setup | Security** menu, AUT must have a node available
    in the tree view listing of modules.

    Setting no access to a user group should not allow seeing any part of the functionality,
    forms, or menu item related to the AUT.

    A Security test plan should be written to define the scope of testing, defect
    classification, root-cause classification, etc. A security checklist should be
    provided to the Tester, which should be filled while testing.

    Test results should be recorded in an Excel sheet, which will also contain bug
    classification and root-cause classification. |

    | Expected Results | - The access control security works as in the standard Dynamics
    AX product.

    - The counter measure is found for every security threat identified in threat
    modeling. |

    | Completion Criteria | - Verification of node and tree structure.

    - Verification of removal of AUT from security menu. |

    | Special Considerations | The accessing permission to various groups should be
    checked with Dynamics AX unique challenges; e.g. if access permission is set to
    NO, all menu items, buttons, forms, etc. should be invisible. |

    | Responsibility | Tester. |

    | IBI Reference | 8.1 |'
  - '[PAGE 116]


    # Authorization Testing


    Authorization testing is a type of security testing. This testing is very important
    and is required to supplement the security testing to achieve the objective of
    trustworthiness. This testing ensures that user permissions are enforced as per
    the following configurations in Dynamics AX:


    +   - User group

    +   - Company

    +   - Configuration codes and security keys

    +   - License codes


    The following table summarizes authorization testing.


    Specifications for Authorization Testing


    Technique | The following scenarios should be tested:

    - A security key set to **View level** allows the user to view records.

    - A top-level security key is disabled; the user should not have access to that
    item.

    - A security key set to **Create level** allows the user to create new records.

    - A feature is disabled when the configuration key is turned off.

    - A form control is invisible when its security access is set to **No Access**.

    - A field inside a table does not appear on a form if it is set to **No Access**.

    - Users cannot see the forms to which they do not have access.

    - Users cannot see the reports to which they do not have access.


    Expected Result | A combination of various means of controlling permissions should
    behave in the way a standard Dynamics AX does.


    Completion Criteria | All scenarios are executed.


    Special Considerations | The following special considerations must be taken care
    while designing test scenarios:

    - All conditions (i.e. **No Access**, **Edit**, **Create**, **View**, **Full Control**)
    must be checked for users with limited permissions.

    - Users belonging to more than one user group (with conflicting permissions) must
    be tested.

    - Users belonging to multiple companies may have different permissions in different
    companies. This must be a special consideration while designing test scenarios.

    - The Dynamics AX system has limited license codes, such as a user with administrator
    privileges may not have access to AR or AP as per the license provided.'
