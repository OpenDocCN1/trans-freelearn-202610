    # Introduction to ERP


    An ERP system is a strategic tool, which can help businesses to achieve the previously
    listed goals. It is a collection of various business processes in an integrated
    fashion, which simulates the real-world business functions and provides seamless
    integrated information at all the required places in an appropriate form. It helps
    the enterprise link, utilize, and allocate its resources in the best possible
    manner, and control them on a real-time basis. It enables the enterprise to achieve
    world-class performance by streamlining its processes, optimizing the resources,
    and taking quick, accurate, and consistent decisions.


    Now it is obvious that an ERP solution should have one essential characteristic
    – ability to integrate various business functions. However, there are greater
    expectations from a usable ERP system. The following list summarizes the business
    needs and expected characteristics of an ERP solution.


    +   - **Total Cost of Ownership (TCO)**: An ERP solution is not just a tool; it
    is an organization-wide synchronization of business processes and hence is a very
    large size software application, which could take several years to implement.
    The TCO does not only consist of ERP product cost and customization cost, it also
    includes the cost to bring about cultural changes in the organization (training,
    etc.). In such a large size project, TCO is one of the critical decision criteria.'
