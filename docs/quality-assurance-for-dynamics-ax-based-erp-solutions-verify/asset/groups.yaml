  mdcn: "\n- 所有“呼吸前修复”和“立即修复”优先级的缺陷均已修复且修复已验证。请参阅第 8 章 *缺陷管理体系* 了解优先级分类详情。\n- 严重程度\
    \ 1 级和 2 级的缺陷均已修复且修复已验证。\n- 在模块测试期间提出的与被测需求的功能行为相关的所有问题或疑问均已解决。\n- 与被测需求相关的所有测试脚本均已执行，且结果截图已纳入。\n\
    - 如果存在任何中等或低优先级的错误待处理，则实施风险必须由业务分析师和/或客户批准。\n- 与模块测试阶段相关的所有类型测试的完成标准（在 *测试方法*\
    \ 部分表中提到）均已满足。\n\n## 系统测试的进入标准\n\n为了进入系统测试阶段，必须通过模块测试阶段的定制工作退出标准，并且系统测试的准备工作已完成。准备工作包括编写和评审‘端到端’和‘基于场景’的功能和非功能测试用例。因此，以下可被视为系统测试阶段的进入标准：\n\
    \n- 应用已通过模块测试的退出标准。\n- 本阶段需要执行的测试用例或脚本已准备就绪。\n- 所有非功能需求均已可用：\n  - 性能需求\n  - 安全配置\n\
    \  - 支持的国家和区域\n  - 支持的语言\n- 根据非功能需求，所有非功能测试用例均已准备就绪。\n\n## 系统测试的退出标准\n\n完成系统测试后，所有功能以及非功能需求必须经过测试，且重要缺陷不应处于开放状态。系统测试阶段也适合进行应用的最终安全评审，因为该定制应用几乎处于（除回归测试期间可能发现的一些问题外）已开发完成的状态。因此，以下可被视为系统测试阶段的退出标准：\n\
    \n- 所有“呼吸前修复”和“立即修复”优先级的缺陷均已修复且修复已验证。\n- 严重程度 1 级和 2 级的缺陷均已修复且修复已验证。\n- 如果存在任何中等或低优先级的错误待处理，则实施风险必须由业务分析师和/或客户批准。\n\
    - 安排在系统测试阶段的测试用例已通过。\n- 最终安全评审已完成且没有安全相关问题处于开放状态。\n- 与系统测试阶段相关的所有类型测试的完成标准（在 *测试方法*\
    \ 部分表中提到）均已满足。\n\n## 回归测试的进入标准\n\n通过回归测试的进入标准表明代码已通过系统测试，并且回归测试的准备工作（包括必要的测试脚本和应用配置）已完成。因此，以下可能为回归测试的进入标准：\n\
    \n- 系统测试的退出标准已满足。\n- 回归测试脚本已准备就绪。\n- 安全密钥或配置密钥已最终确定。\n- 一致性验证测试脚本已准备就绪。\n\n> 为了优化工作量，回归测试脚本可以设计成也可以用作一致性验证测试脚本。\n\
    \n## 回归测试的退出标准\n\n以下可以作为回归测试的退出标准：\n\n- 所有“呼吸前修复”和“立即修复”优先级的缺陷均已修复且修复已验证。\n- 严重程度\
    \ 1 级和 2 级的缺陷均已修复且修复已验证。\n- 如果存在任何中等或低优先级的错误待处理，则实施风险必须由业务分析师和/或客户批准。\n- 不存在开放的问题或疑问。\n\
    - 与回归测试阶段相关的所有类型测试的完成标准均已满足（在 *测试方法* 部分表中提到）\n\n## 发布测试的进入标准\n\n在 Dynamics AX\
    \ 的上下文中，发布测试阶段仅包含安装测试。根据微软标准，安装和卸载过程应安全且自动化，但在 Dynamics AX 中，成功安装或卸载所需的一些活动无法自动化。对于所有此类活动，手动操作流程应在安装指南中说明。测试人员应遵循安装指南中提到的所有步骤，且系统行为应如安装指南所述。有关安装测试的更多详情，读者可参考前一章。以下要点可被视为发布测试阶段的进入标准：\n\
    \n- 系统测试阶段的退出标准已成功完成。\n- 安装指南已准备就绪。\n- 安装测试用例已编写并修订。\n- 需要交付的 XPO 或安装程序可执行文件已准备就绪。\n\
    - 安装测试的测试环境已准备就绪。\n\n## 发布测试的退出标准\n\n在执行以下操作后，发布测试可被视为已完成：\n\n- 与安装测试相关的所有问题均已修复。\n\
    - 所有开放问题均已记录为已知缺陷。\n- 严重程度 1 级和 2 级的缺陷均已修复且修复已验证。\n- 如果存在任何中等或低优先级的错误待处理，则实施风险必须由业务分析师和/或客户批准。\n\
    - 与发布测试阶段相关的所有类型测试的完成标准均已满足（在 Test Approach 部分表中提到）。\n\n## 准则定义\n\n为了为项目测试团队以及项目中的其他团队提供清晰度，关键决策准则必须记录在测试计划中，并获得各利益相关方的承诺。\n\
    \n## 测试用例通过或失败标准\n\n每个失败的测试用例（单元测试除外）都将被记录。应用在存在严重程度 1 级或 2 级或紧急或高优先级错误的情况下不会进入后续的软件测试阶段。以下可能是关于测试用例通过/失败标准的概括性想法。可以为每种单独的测试用例类型（即测试类型）定义更准确的定义：\n\
    \n- 功能是否通过或失败取决于测试操作的结果。如果操作的实际输出与测试用例指定的预期输出相同，则功能通过。如果测试用例中的任何操作失败，则整个用例失败。\n\
    - 如果测试用例失败，不能假设代码存在缺陷。失败只能解释为预期结果与实际结果之间的差异，预期结果源自项目文档。预期结果可能因项目文档被误解、不完整或不准确而出错。报告的失败将被记录以供进一步分析，然后分析失败原因。如果是缺陷，应在评审和授权表上记录。\n\
    \n## 暂停/恢复标准\n\n如果出现以下任何情况，测试团队可能会暂停对特定代码的部分或全部测试活动：\n\n- 测试环境未更新为最新代码（需要测试的代码）。\n\
    - 开发团队无法为特定代码配置设置数据。\n- 健全性（或构建验证）测试（如果正在进行）失败。\n- 功能存在故障导致其无法测试。\n- 某项未包含指定的更改。\n\
    - 在更高级的测试阶段发现了大量本应在前一阶段被发现的缺陷。这里非常重要的是要定义“过多缺陷”的标准，即 X 个严重程度为 1 或 2 的缺陷或 Y 个优先级为关键或紧急的缺陷。\n\
    - 有新版本的软件可供测试。\n"
