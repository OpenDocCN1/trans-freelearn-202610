    \ planning of the business. Due to the criticality of information being available\
    \ in a secured and private manner, the benefits of an ERP system can be fully\
    \ unleashed only if the information is available to the customer in an accurate,\
    \ secured, and controlled manner as and when required. These characteristics will\
    \ make an ERP a trustworthy system.\n\nMicrosoft defines these qualities as follows:\n\
    \n**Availability**: *Our products should always be available when our customers\
    \ need them. System outages should become a thing of the past because of a software\
    \ architecture that supports redundancy and automatic recovery. Self-management\
    \ should allow for service resumption without user intervention in almost every\
    \ case.*\n\n**Security**: *The data our software and services store on behalf\
    \ of our customers should be protected from harm and used or modified only in\
    \ appropriate ways. Security models should be easy for developers to understand\
    \ and build into their applications.*\n\n**Privacy**: *Users should be in control\
    \ of how their data is used. Policies for information use should be clear to the\
    \ user. Users should be in control of when and if they receive information to\
    \ make best use of their time. It should be easy for users to specify appropriate\
    \ use of their information including controlling the use of email they send.*\n\
    \n> — An excerpt from Bill Gates' email on Trustworthy Computing, January 5, 2002.\n\
    \nMicrosoft adds another dimension in trustworthiness and that is the business\
    \ integrity. This means a software provider should be responsive and transparent\
    \ in dealing with its customer. This is beyond the scope of this book.\n\n###\
    \ What is Trustworthy Computing?\n\nWe have discussed the elements of a trustworthy\
    \ computing experience. Now we will discuss the core elements of trustworthy computing\
    \ in greater detail from the engineering perspective; i.e. how to achieve trustworthiness.\n\
    \n### Security\n\nThe prime component of trustworthy computing is security, which\
    \ means — making IT applications inherently safer. Security can be achieved with\
    \ the following strategy:\n\n- Making the application development life cycle compliant\
    \ with Microsoft's Security Development Lifecycle.\n- Better equipped code analysis\
    \ from the security perspective.\n- Threat and vulnerability mitigation through:\n\
    \  - Employment of best-of-breed threat protection, detection, and removal mechanisms.\n\
    \  - Isolation and resiliency; i.e. isolating the vulnerable code and providing\
    \ effective control over the various computer processes interacting with each\
    \ other.\n- Strong authentication mechanisms to ensure correct who, what, and\
    \ when information:\n  - Who: To know who the logged-in user is, so that the user's\
    \ privileges can be determined, and traced at a later stage if required.\n  -\
    \ What: To know the user activities performed and the privileges available to\
    \ user so that access or deny decisions can be taken for any of the system assets\
    \ such as a data table.\n  - When: To know when events happened so that any security\
    \ attacks can be analyzed for detection, prevention, and removal of security impacts.\n\
    - Authorization: To know what types of privileges (read-only, read and write,\
    \ etc.) are available for a particular user group.\n- Access control: The access\
    \ control list (ACL) should be designed in the beginning so that proper privileges\
    \ can be assigned to the system users. The ACL should not be limited to files\
    \ or folders, but also apply to registry settings, database files, printers, and\
    \ objects in active directory, etc. Some other tips about ACL are:\n  - To protect\
    \ sensitive files and folders of your application, programmatically create ACLs\
    \ during installation.\n  - Be explicit and use the deny access control entry\
    \ (ACE) often.\n  - A NULL discretionary access control list (DACL) can act as\
    \ a passage for a hacker. For example, a hacker can change a NULL DACL to Everyone\
    \ Deny Access so don't use NULL DACL entries.\n- Education and awareness are key\
    \ strategies to ensure the use or development of IT applications in the most secured\
    \ way. The following could be used to increase awareness about security:\n  -\
    \ Providing security hardening guides with ERP applications so that ERP can be\
    \ implemented in the most secured way.\n  - Providing security education to all\
    \ concerned such as programmers, testers, program managers, and IT administrators.\n\
    \n### Privacy\n\nThe core element of privacy is that the users should feel that\
    \ their information is confidential. They are not forced to share their information,\
    \ nor is the information taken without their agreement. To meet this characteristic\
    \ the following guidelines are suggested:\n\n- Functional design to achieve privacy\
    \ such as:\n  - Features and functionality to support the customers' right to\
    \ control their personal information.\n  - Features to provide an option to customers\
    \ to opt in or opt out when providing personal information.\n- Design a solution\
    \ keeping privacy as a concern.\n- Comply with Microsoft Privacy Policy for development\
    \ as well as deployment.\n\n### Reliability\n\nReliability does not have any measure;\
    \ different people have different perceptions about reliability. A non-IT professional\
    \ may define reliable systems as \"systems working continuously in an expected\
    \ and consistent manner.\" While an IT professional may define a reliable system\
    \ as \"a system that is dependable requires minimum maintenance and interruptions\
    \ with high availability of the overall system.\" The difference in the definitions\
    \ creates a major obstruction for devising a measuring unit for it. Microsoft\
    \ defines that reliability has the following five characteristics:\n\n- Predictable:\
    \ It provides consistent services.\n- Maintainable: It is easy to configure and\
    \ manage.\n- Resilient: It works despite changes in conditions.\n- Recoverable:\
    \ It is easily restored without adverse impact.\n- Proven: It operates in a variety\
    \ of environments.\n\nThe above qualities can be achieved with a multipoint strategy,\
    \ which not only ensures higher reliability, but also continuous improvement in\
    \ it:\n\n- Designing for greater reliability such as interoperable design, fail-safe\
    \ design etc.\n- Engineering to offer more reliability such as code analysis for\
    \ superior coding logic and removal of memory leakage\n- Features to understand\
    \ where the system fails or how the customer wants to use the system, etc. Windows\
    \ error reporting is one such example\n\n### Microsoft Security Development Life\
    \ Cycle\n\nTo develop, deploy, and use software applications in a trustworthy\
    \ way Microsoft recommends a Security Development Life Cycle. This lifecycle is\
    \ based on SD3+C methodology.\n\n### SD3+C Methodology\n\nMicrosoft has developed\
    \ a methodology to combat real-world security issues. It consists of four pillars:\n\
    \n- Secure by design: Any ERP solution based on Dynamics AX should be designed,\
    \ architected, and implemented in such a way that it can protect itself as well\
    \ as the information being processed. Following are a few points that make for\
    \ secure design:\n  - The ERP solution should be designed in such a way that it\
    \ only accepts the user inputs that are supposed to be the expected inputs.\n\
    \  - Dangerous APIs should be handled in a secured way (as prescribed by Microsoft).\n\
    \  - Data or control commands should be validated at trust boundaries.\n  - Overall\
    \ architecture should be secure, which can be achieved by threat modeling at design\
    \ stage.\n"
  mdcn: "\n| 序号 | 检查点 | 预期结果 |\n|---|---|---|\n| 10 | 是否将网格线的最大数量设置为 **Auto**？ | 是\
    \ |\n| 11 | 是否使用 Tunnel 显示帮助？ | 是 |\n| 12 | 帮助是否显示在列表上方？ | 否 |\n\n## 记录偏差\n\n\
    Dynamics AX 用户界面规范旨在确保高标准的用户体验和可用性；然而，在某些情况下，偏离这些规范是不可避免的。以下情况的几个例子可能是：\n\n- 法律要求，例如遵守法律文件。\n\
    - 行业特定功能无法以符合这些规范的方式实现。\n\n记录偏差不仅必须针对强制性要求，还必须针对建议。要记录偏差，我们需要记录以下信息：\n\n- 为什么需要偏差？\n\
    - 头脑风暴文档，用于记录其他符合 Dynamics AX 的实现方式以及导致无法以这些方式实现时发现的限制。\n\n## 摘要\n\n我们研究了大量 Dynamics\
    \ AX 的 GUI 标准，这将确保：\n\n- 卓越的用户体验\n- 高度辅助的帮助\n- 直观的用户界面\n- 在消息、向导等方面提供适当的帮助。\n\n\
    尽管建议遵守用户界面标准，如果在某个 GUI 元素中无法遵守，则应进行头脑风暴以最大程度地减少不合规情况，并记录实现该功能的各种可能选项以及如何选择偏差最小的方法应被记录。\n\
    \n## 5 项最佳实践——值得信赖的计算\n\n今天，计算机对个人和组织非常重要且有用。在组织的情况下，信息需要在准确、可靠和受控的方式下流动。任何企业的成功都取决于用于业务运营控制、管理和战略规划的信息的可靠性、可用性和安全性。由于信息需要在安全和私密的方式下可用，ERP\
    \ 系统的益处只有在信息在需要时以准确、安全和受控的方式提供给客户时才能充分释放。这些特征将使 ERP 成为值得信赖的系统。\n\nMicrosoft 将这些品质定义如下：\n\
    \n**可用性**：*我们的产品应在客户需要时始终可用。系统停机应成为过去，因为软件架构支持冗余和自动恢复。自我管理应允许在几乎所有情况下无需用户干预即可恢复服务。*\n\
    \n**安全性**：*我们软件和服务代表客户存储的数据应受到保护，不受伤害，并且仅以适当的方式使用或修改。安全模型应易于开发人员理解并构建到其应用程序中。*\n\
    \n**隐私**：*用户应控制其数据的使用方式。信息使用的政策应让用户清楚。用户应控制何时以及是否接收信息以便最好地利用其时间。用户应能够轻松指定其信息的使用方式，包括控制其发送的电子邮件的使用。*\n\
    \n> — 摘自比尔·盖茨关于可信计算的电子邮件，2002 年 1 月 5 日。\n\nMicrosoft 在可信度方面增加了另一个维度，那就是业务诚信。这意味着软件提供商应在与客户的交往中保持响应和透明。这超出了本书的范围。\n\
    \n### 什么是可信计算？\n\n我们已经讨论了可信计算体验的要素。现在我们将从工程角度更详细地讨论可信计算的核心要素；即如何实现可信性。\n\n###\
    \ 安全\n\n可信计算的主要组成部分是安全，这意味着——使 IT 应用本质上更安全。可以通过以下策略实现安全：\n\n- 使应用程序开发生命周期符合 Microsoft\
    \ 的安全开发生命周期。\n- 从安全角度进行更好的代码分析。\n- 通过以下方式缓解威胁和漏洞：\n  - 采用最佳的威胁保护、检测和清除机制。\n  -\
    \ 隔离和弹性；即隔离易受攻击的代码并对相互交互的各种计算机进程提供有效控制。\n- 强身份验证机制以确保正确的谁、何事、何时信息：\n  - 谁：要知道登录用户是谁，以便确定用户的权限，并在需要时在以后阶段进行追踪。\n\
    \  - 何事：要知道用户执行的操作以及用户可用的权限，以便对系统资产（如数据表）做出访问或拒绝决策。\n  - 何时：要知道事件发生的时间，以便对任何安全攻击进行分析以检测、预防和消除安全影响。\n\
    - 授权：要知道特定用户组可用的权限类型（只读、读写等）。\n- 访问控制：访问控制列表（ACL）应在开始时设计，以便为系统用户分配适当的权限。ACL 不应仅限于文件或文件夹，还应适用于注册表设置、数据库文件、打印机和活动目录中的对象等。关于\
    \ ACL 的其他提示如下：\n  - 为保护应用程序的敏感文件和文件夹，请在安装期间以编程方式创建 ACL。\n  - 明确使用并经常使用拒绝访问控制条目（ACE）。\n\
    \  - NULL 自主访问控制列表（DACL）可能成为黑客的通道。例如，黑客可以将 NULL DACL 更改为“每个人拒绝访问”，因此请勿使用 NULL\
    \ DACL 条目。\n- 教育和意识是确保以最安全的方式使用或开发 IT 应用的关键策略。以下可用于提高安全意识：\n  - 提供 ERP 应用的安全加固指南，以便以最安全的方式实施\
    \ ERP。\n  - 为所有相关人员提供安全培训，如程序员、测试员、项目经理和 IT 管理员。\n\n### 隐私\n\n隐私的核心要素是用户应感到其信息是保密的。他们不会被迫分享其信息，也不会在未经同意的情况下被获取信息。为满足这一特性，建议遵循以下准则：\n\
    \n- 功能设计以实现隐私，例如：\n  - 支持客户控制其个人信息的权利的功能和特性。\n  - 在提供个人信息时为客户提供选择加入或选择退出的选项的功能。\n\
    - 在设计解决方案时将隐私作为关注点。\n- 在开发和部署中遵守 Microsoft 隐私政策。\n\n### 可靠性\n\n可靠性没有衡量标准；不同的人对可靠性有不同的感知。非\
    \ IT 专业人员可能将可靠系统定义为“以预期和一致的方式持续运行的系统”。而 IT 专业人员可能将可靠系统定义为“一个可靠的系统，需要最少的维护和中断，且整体系统具有高可用性”。定义上的差异为制定其衡量单位造成了主要障碍。Microsoft\
    \ 认为可靠性具有以下五个特征：\n\n- 可预测：提供一致的服务。\n- 可维护：易于配置和管理。\n- 有弹性：尽管条件发生变化仍能工作。\n- 可恢复：可在无不利影响的情况下轻松恢复。\n\
    - 已验证：在多种环境中运行。\n\n上述品质可通过多点策略实现，该策略不仅确保更高的可靠性，还能持续改进：\n\n- 设计以提高可靠性，例如互操作设计、失效安全设计等。\n\
    - 工程以提供更多可靠性，例如代码分析以实现更优的编码逻辑并消除内存泄漏\n- 用于了解系统在哪里失败或客户希望如何使用系统等功能。Windows 错误报告就是一个例子\n\
    \n### Microsoft 安全开发生命周期\n\n为了以值得信赖的方式开发、部署和使用软件应用程序，Microsoft 推荐安全开发生命周期。该生命周期基于\
    \ SD3+C 方法论。\n\n### SD3+C 方法论\n\nMicrosoft 开发了一种方法来应对现实世界的安全问题。它包含四个支柱：\n\n- 安全设计：任何基于\
    \ Dynamics AX 的 ERP 解决方案都应以能够保护自身以及正在处理的信息的方式进行设计、架构和实施。以下是使设计安全的几点：\n  - ERP\
    \ 解决方案应设计为仅接受预期输入的用户输入。\n  - 危险 API 应以安全的方式处理（如 Microsoft 规定）。\n  - 数据或控制命令应在信任边界处进行验证。\n\
    \  - 整体架构应安全，这可通过在设计阶段进行威胁建模来实现。\n\n"
