- raw:
  - '[PAGE 69]


    # Branching


    A few recommended best practices related to the `if-else` statement and `switch`
    statement are as follows:


    +   - Always use positive logic e.g. write `if (true)` rather than `if (! false)`.

    +   - Prefer `switch` statement rather than multiple `if-else` statements.

    +   - Always end a case with a `break` or `return` or `throw` statement unless
    a fall through mechanism is intentionally used. When a fall through mechanism
    is used a comment should be given like `//fall through` so that it is clear to
    every reader.


    # Code Layout


    For readability of the code, code should be written in a proper layout. Some chief
    best practices for code layout are as follows:


    +   - Remove commented code before shipping code.

    +   - Follow indentation rules.

    +   - Follow case rules for naming classes, methods, tables, etc.


    # Methods


    Following are a few best practices for methods:


    +   - Methods should be small and logical so that it can be easily overridden
    or over-layered.

    +   - Methods should perform a single well defined task and from their name the
    task performed should be clear.

    +   - For static class methods and table methods, qualified `client`, `server`,
    or `client server` should be used in such a way that calls to other tiers are
    minimized. For greater details refer to the *Best Practices for Designing* section
    in the Developer''s Guide.

    +   - To ensure trustworthiness, appropriate access levels (public, private, or
    protected) should be assigned.

    +   - Methods should be named according to the Dynamics AX naming conventions;
    the reserved keywords such as *is*, *check*, *validate*, *set*, *get*, and *find*
    should be used as per the Dynamics AX way of using these standard methods or functions.
    All methods using such keywords must not have side effects e.g. no assignment
    in validate, check, get, or is methods.

    +   - Parameter''s names must start with an underscore (`_`) character besides
    following other generalized naming conventions.'
  - '[PAGE 70]


    # Handling Dates


    Dates are sources of error due to variations in date presentation formats and
    in values due to differences in time zone. A few best practices for handling dates
    are as follows:


    +   - Date fields must be stored or displayed in the date field only as **IntelliMorph**
    has the ability to display the date value in a format suitable for the user provided
    that the date format property is chosen as **Auto** and it is presented in a date
    control.

    +   - The system date should not be considered as reliable information but in
    some cases (e.g. validation of information input by a user) system date should
    be read using the `SystemDateGet()` function instead of the `today()` function.

    +   - Date conversion should be avoided as it will loose date properties and hence
    sometimes conversion may result in wrong information. For all user interface-related
    situations strFmt or date2Str should be used with a value of **-1** for all formatting-related
    parameters. This will allow users to use this information in the format specified
    in regional settings. Care should also be taken that string variables storing
    converted date information are sufficiently long.


    # Label Standards


    It is highly recommended that any user-interface text is defined using labels.
    This will ensure many advantages during translation. A few label file standards
    to ensure the true benefits of the label file system are as follows:


    +   - The location of label files should be the most generalized one i.e. extended
    data type (EDT). In some cases an existing EDT cannot be used only because of
    the difference in label text. In such cases a new EDT should be created by extending
    the existing EDT. In such cases other alternatives may also be available (e.g.
    label change at the field) but the rule of thumb is to use the label at the most
    general place.

    +   - The label files should not be duplicated i.e. two label files should not
    exist for the same text.'
  - '[PAGE 71]


    # AOT Object Standards


    The AOT object standards are specific to a particular AOT element. Broadly we
    can classify AOT elements as follows:


    +   - Data Dictionary

    +     - Extended data type

    +     - Base Enum

    +     - Tables

    +     - Feature keys

    +     - Table collection

    +   - Classes

    +   - Forms

    +   - Reports

    +   - Jobs

    +   - Menu items


    # Data Dictionary


    This is a group of AOT objects including the items mentioned in the previous section.
    The best practices for tables can further be divided into best practices for the
    fields, field groups, indexes, table relations, delete actions, and methods.


    # Extended Data Type


    The EDT plays a great role as it is the basic entity of GUI elements. The following
    are a few basic best practices related to extended data types.


    +   - All date and date format-related properties should be set to Auto.

    +   - Help text should not be same as the label property. Help text is supposed
    to be more descriptive and should be able to explain why and/or how.

    +   - An EDT name must be a real-world name, prefixed with module (if it belongs
    to one module only).'
  - '[PAGE 72]


    # Base Enum


    The following are a few basic best practices related to Base Enum:


    +   - The Enum name should be an indication of either the few possible values
    or type of values. For example DiscountType, OpenClose, etc.

    +   - Display length property should be set to auto so that in every language
    the full name can be displayed.

    +   - Help and label properties must have some value. Help and label properties
    should not have the same value.


    # Tables


    Many of the best practices for tables come under the scope of performance optimization,
    database design standards, etc. and hence those standards have been discussed
    elsewhere. Some of the standards not discussed are discussed here.


    +   - The table name may consist of the following valuable information:

    +     - **Prefix**: Module name such as Cust for Account Payable, Sales for Account
    Receivables

    +     - **Infix**: Logical description of the content

    +     - **Post fix**: Type of data e.g. Trans (for transactions), Jour (Journals),
    Line (table containing detailed information about a particular record in header
    table), Table (primary main tables), Group, Parameters, Setup, or module name
    to which the table belongs

    +   - Label is a mandatory property and tables must be labelled using Label ID
    only. The text value of Label ID must be unique in all languages supported.

    +   - If a table belongs to one of the four types Parameter, Group, Main, or WorksheetHeader,
    then it must have an associated form to maintain the table records. This form
    should have a name identical to its display menu item (used to start this form)
    and like the table name. formRef is the property of a table for the name of the
    associated form.

    +   - Title Field 1 and Title Field 2 should be mentioned:

    +     - **TitleField1**: The key field for the records in the table. This should
    be a descriptive title, if the key is information for the user.

    +     - **TitleField2**: The description for the records in the table.'
  - '[PAGE 73]


    # Fields


    Most of the properties for the fields are inherited from extended data types;
    however, it is not mandatory to use some or all inherited values for such properties.
    Here are a few guidelines:


    +   - Name: Should be like the corresponding EDT name but if named separately,
    it should be logical. The fields used as key should be postfixed as ID e.g. CustId,
    ItemId, etc.


    +   - HelpText: This is a mandatory property and inherited from the corresponding
    EDT. Since Help Text needs to be customized as per the different uses of the same
    EDT, Help text can be modified at any field but the following are the guidelines:

    +     - The help text property should not be same as the label property.

    +     - Label is also a mandatory property, which is inherited from EDT. If a
    value is set here, it should be different from the value on EDT.

    +     - Every field that is either the primary key or one of the key mandatory
    properties must be set to Yes.

    +     - Before considering memo or container type fields, it should be kept in
    mind that they add time to application and database fetch, they inhibit array
    fetching, and these types of fields cannot be used in where expressions.


    # Field Group


    The field group is a group of fields shown in the user interface. Dynamics AX
    has some standard groups (e.g. Identification, Administration, Address, Dimension,
    Setup, Misc, etc.), while other can be created. The fields that logically belong
    together can be placed in one field group while the Misc field group can be used
    to group fields that do not fit in any other field group. The dimension field
    group must have a single kind of field Dimension. The field groups should have
    the same kind of grouping at the database and form or reports to improve caching
    and hence the performance.


    # Delete Actions


    The database integrity is one of the key principles in Relational Database Management
    System (RDBMS). The delete action should be used on every relation between two
    tables. The following are key best practices for delete actions


    +   - Use a delete action on every relation between two tables.

    +   - Use table delete actions instead of writing code to specify whether deletes
    are restricted or cascaded.'
