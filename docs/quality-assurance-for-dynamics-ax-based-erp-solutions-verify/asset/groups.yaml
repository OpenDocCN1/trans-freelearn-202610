    # 4

    Best Practices—GUI


    The user interface plays a vital role in the usability of an ERP system and affects
    the user''s productivity. The user-interface standards for Dynamics AX are largely
    based upon the following standards:


    +   - Dynamics AX user assistance best practices

    +   - Windows user experience guidelines


    The objective of Dynamics AX user-interface standards is to ensure consistency
    with the core Dynamics AX application and minimum overriding of Dynamics AX defaults.


    We will discuss how to meet the above objectives and the best practices with which
    we need to comply. The following topics will be clear after reading this chapter:


    +   - Various GUI best practices

    +   - Documentation of deviation from GUI best practices


    # Window and Screen Layout


    The objective of this standard is to provide commonality between Dynamics AX and
    other windows applications. Meeting this objective ensures ease in managing different
    Windows for the Dynamics AX application; as the user is generally aware about
    Microsoft standards for windows while using other Microsoft application such as
    MS Office, Outlook, and Internet Explorer, etc.'
