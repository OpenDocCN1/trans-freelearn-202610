    # Task Pane Requirements


    The task pane appears (if you opt to display it) at the right side of the application
    window. The disadvantage associated with it is that it reduces the space for the
    content pane and hence many users opt to not display it. Hence, UI specifications
    recommend using the task pane in a way in which users are not compelled to opt
    for it to complete their task. A few suggested uses of the task pane may be to
    display the search results, help contents, etc. The following specifications must
    be observed to ensure that a user is not compelled to use the task pane to complete
    any task:


    | Sr. No. | Checkpoint | Expected Result |

    |---|---|---|

    | 1 | The task pane must be used to present information that is useful but not
    required. The task pane must not be used to display notifications or information
    that is critically important to the user''s task. Is this standard followed? |
    Yes |

    | 2 | The task pane must not be used as a dialog box or for setting options. Is
    this standard followed? | Yes |

    | 3 | The task pane must not be used as a secondary workspace that competes with
    the content pane. The content pane is the primary workspace for displaying forms
    and windows associated with application tasks. Is this standard followed? | Yes
    |

    | 4 | The task pane must not be used to present excessive information that confuses
    the user. Is this standard followed? | Yes |

    | 5 | The task pane must not be used to display content that is specific to the
    currently selected form or window. The task pane should display information that
    applies to the application in general or that is peripherally useful.

    Is this standard followed for every window? | Yes |'
