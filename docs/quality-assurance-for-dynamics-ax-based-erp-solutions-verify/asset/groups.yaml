    ## 测试


    下表总结了此项测试。


    | 本地化测试规范 | |

    |---|---|

    | 技术 | - 在执行 Dynamics AX 最佳实践检查工具时，检查 Dynamics AX 事件日志（或最佳实践工具）是否存在指示代码中存在硬编码字符串的错误。<br>-
    手动检查配置键，并确保由独立软件供应商（ISV）发布的应用程序包含应用程序/定制实现需要实现的区域设置的配置键。 |

    | 完成标准 | - Dynamics AX 最佳实践检查工具不包含与文本字符串与代码分离相关的任何错误。<br>- Dynamics AX 事件日志仅包含测试团队接受的警告。
    |

    | 预期结果 | Dynamics AX 最佳实践检查工具不应显示任何错误消息。<br>除非在文档中给出说明，否则 Dynamics AX 最佳实践检查工具不应显示任何警告消息。<br>ISV
    发布的配置键表单应根据定制包含区域设置的配置键。 |

    | 特别考虑 | - Dynamics AX 最佳实践检查工具应处于默认配置。<br>- SysBPCheckIgnore 宏不应包含任何类型的条目。 |

    | 责任 | 测试员。 |

    | IBI 参考 | 11.1, 11.4 |


    ## 平台兼容性测试


    此项测试用于验证被测应用程序在受支持的平台和数据库上成功运行。下表总结了此项测试。


    | 平台兼容性测试规范 | |

    |---|---|

    | 技术 | 在每个平台上，应用程序被安装、打开，并检查部分功能是否正常运行。 |

    |  | 应填写审查和授权表以记录结果。 |

    | 预期结果 | 解决方案在受支持的环境中正确安装并运行。 |

    | 完成标准 | 在嵌入式 Excel 表中提到的所有平台上成功执行。 |

    | 特别考虑 | 需要配备所有必需平台的测试实验室。 |

    | 责任 | 测试员。 |

    | IBI 参考 | 12.1 |


    ## 安装测试


    此项测试的目标是确保安装过程顺利。如果安装无法完成，则新安装的项目将被卸载，并且不会影响已安装的 Dynamics AX。目标可能包括以下内容。


    - 确保核心 Dynamics AX 产品兼容的安装程序

    - 确保安装程序正确注册 DLL 和 ActiveX 控件

    - 确保安装程序检查正确的 Dynamics AX 版本和服务包级别

    - 确保安装程序检查必需的 Dynamics AX 模块是否存在

    - 确保配置设置是固有的或已创建

    - 确保安装程序提供所有依赖项，即安装所需的文件


    ## 测试


    下表总结了此项测试。


    | 安装测试规范 | |

    |---|---|

    | 技术 | 安装测试文档应准备好，并且测试应根据该文档执行。<br>AUT 应使用其安装指南进行安装，之后应验证执行情况。<br>每个 DLL 和 ActiveX
    控件的共享计数应在安装或卸载或重新安装之前和之后记录。还应检查注册表是否已使用 DLL 和 ActiveX 控件的正确版本进行更新。<br>安装过程中可能会使用不合适的
    Dynamics AX 版本。安装过程应在安装早期阶段检查 Dynamics AX 的正确版本。<br>应考虑每个因素，以确保安装程序检查所有依赖项，如果任何依赖项不可用，安装程序应中止，而不会对核心
    Dynamics AX 造成任何影响。<br>还应检查安装程序是否不会要求从 Internet 等下载任何文件。<br>确保安装程序通过从配置键中删除必需模块来检查必需的
    Dynamics AX 模块。对每个必需模块应重复此测试。 |

    | 预期结果 | 安装程序符合本测试目标中提到的准则。 |

    | 完成标准 | AUT 根据安装测试文档成功安装并运行。 |

    | 特别考虑 | 仅在以下情况后才能开始安装测试：<br>- 安装指南可用<br>- 提供了 AUT 创建的注册表记录信息<br>- 提供了包含在 AUT
    安装中的所有系统和应用程序组件的信息 |

    | 责任 | 测试员。 |

    | IBI 参考 | 13.1, 13.2, 13.3, 13.4, 13.5, 13.6 |


    ## 备份和恢复测试


    此项测试的目标是验证备份和恢复数据以及 AUT 的能力。通常 X++ 应用程序与标准 Dynamics AX 产品共享同一数据库，因此定制被视为标准 Dynamics
    AX 的扩展。在这种情况下，标准 Dynamics AX 的备份和恢复过程将有效，因此无需为此目的提供单独的机制。当然，无需测试标准 Dynamics AX
    提供的备份和恢复机制。


    如果定制的 X++ 应用程序具有单独的数据库，则适用此测试。下表总结了此项测试。


    | 备份和恢复测试规范 | |

    |---|---|

    | 技术 | 执行的备份和恢复过程序列应将应用程序恢复到相同状态。<br>应准备备份和恢复测试文档以指定测试用例和预期结果。 |

    | 预期结果 | 执行的备份和恢复过程序列将应用程序恢复到相同状态。 |

    | 完成标准 | 如果应用程序可以通过备份和恢复过程序列恢复到原始状态。 |

    | 特别考虑 | 应用程序备份和数据备份过程是两件不同的事情，因此应分别测试。如果测试与使用单独数据库的 X++ 应用程序相关，则仅应测试数据备份和恢复机制，而如果是
    .NET 应用程序，则两者都需要测试。 |

    | 责任 | 测试员。 |

    | IBI 参考 | 14.1 |


    ## 可扩展性测试


    此项测试的目标是验证 AUT 的每个元素在 AOT 文档中是否有对应的帮助文本节点。下表总结了此项测试。


    | 可扩展性测试规范 | |

    |---|---|

    | 技术 | 手动验证 AOT 文档中的每个帮助文本节点。 |

    | 预期结果 | 所有（新和定制的）AOT 元素在 AOT 文档中都有相应的帮助文本。 |

    | 完成标准 | 已验证所有 AOT 元素（仅与 AUT 相关）的帮助文本节点存在。 |

    | 特别考虑 | 无。 |

    | 责任 | 测试员。 |

    | IBI 参考 | 15.1 |


    ## 功能测试


    此项测试的目标是验证所有所述功能需求是否按预期方式完成。下表总结了此项测试。


    | 功能测试规范 | |

