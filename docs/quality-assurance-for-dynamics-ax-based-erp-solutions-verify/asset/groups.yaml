    # Documenting Deviations


    The Dynamics AX user interface specifications are designed to ensure a high standard
    of user experience and usability; however, there may be certain circumstances
    where deviation from these specifications is inevitable. A few examples of such
    circumstances could be:


    +   - Legal requirements such as compliance to a legal document.

    +   - Industry-specific functionality that cannot be implemented in a way compliant
    to these specifications.


    The documenting of deviations must be done not only for the mandatory requirements,
    but also for the recommendations. To document a deviation, we need to document
    the following information:


    +   - Why is a deviation necessary?

    +   - Brainstorming document to document the other Dynamics AX-compliant ways
    to implement and the limitation found that prevented implementation in those ways.


    # Summary


    We have studied a large number of GUI Standards for Dynamics AX, which will ensure:


    +   - Excellent user experience

    +   - Highly assisting help

    +   - Intuitive user interface

    +   - Appropriate assistance in terms of messages, wizards, etc.


    Though it is advised to comply with the user interface standards, if this compliance
    is not possible in a particular GUI element, it should be brainstormed to minimize
    the non-compliance and the various possible options to implement the functionality
    and how an approach with minimum deviation was chosen should be documented.'
