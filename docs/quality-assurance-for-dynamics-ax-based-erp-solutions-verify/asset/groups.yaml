  mdcn: "\n测试恢复将在以下内容交付给测试团队后开始：\n\n- 导致测试暂停的问题代码已得到修正。\n- 新版本中修复的所有错误清单。\n- 来自主导开发人员的书面保证，证明他/她或团队成员之一已验证导致测试暂停的原因已被移除。\n\
    \n## 角色与职责\n\n为了项目成功，每个利益相关者都必须了解其职责以及对其他利益相关者的期望。\n\n推荐用于 Dynamics AX 定制项目的测试团队并非孤立的测试团队，而是测试责任在整个项目团队中分布。这是为了最小化成本并高效利用可用技能而建议的。\n\
    \n| 角色 | 职责 |\n|------|-------------------|\n| Test Manager | - 编写测试计划<br>- 维护测试计划<br>-\
    \ 监控测试进度<br>- 监控对测试计划的遵守情况<br>- 做出进入和退出测试阶段的决策<br>- 做出暂停或恢复测试的决策<br>- 对测试策略进行更改或对测试计划进行修订\
    \ |\n| Test Lead | - 协调测试团队<br>- 在各种会议中代表测试团队<br>- 生成各种报告和指标<br>- 风险识别、分析和缓解<br>-\
    \ 向测试经理报告测试进度更新、遇到的任何问题以及已识别的风险 |\n| Business Analyst | - 创建功能测试用例和测试脚本<br>- 执行功能测试<br>-\
    \ 协助系统测试用例<br>- 编写一致性验证测试脚本 |\n| Developers | - 执行单元测试<br>- 进行同行代码评审<br>- 交付应用程序的完整构建<br>-\
    \ 就更改和新功能向测试人员提供反馈<br>- 根据需要向测试团队提供被测应用程序的专业知识和信息<br>- 消除已达成一致的错误 |\n| Lead Developer\
    \ | - 进行代码评审（执行设计和架构合规性检查、业务标准或报告标准合规性检查）<br>- 在分诊会议中代表开发团队<br>- 代表可信计算相关活动，如最终安全评审、威胁评审和优先级排序\
    \ |\n| Testers | - 编写或执行除功能测试用例之外的测试用例（即除功能测试外的测试用例、回归测试、基于场景的测试和端到端功能测试）<br>-\
    \ 查找、报告并跟踪测试中发现的错误<br>- 分析结果<br>- 执行对编码标准的合规性检查、帮助导航测试、用户体验和可用性测试、性能测试、全球化测试、本地化测试、平台兼容性测试、可扩展性测试、备份和恢复测试、安装测试\
    \ |\n\n## 代码评审\n\nDynamics AX 中的代码评审具有多个目标，包括以下内容：\n\n- 对设计和架构指南的合规性检查。\n- 业务智能或报告标准的验证。\n\
    - 最终安全评审。\n\n代码评审应在两个层级进行；一个是在代码片段层级，有助于满足前两个目标，另一个是在系统层级，主要关注安全。系统级代码评审也有助于评审关键业务逻辑的正确性。\n\
    \n在代码评审期间，应牢记此测试的目标。为了确保满足所述测试的目标，应准备一份包含与此测试相关的检查点的清单。此清单应在代码评审开始前进行评审和批准。\n\n\
    设计和架构模式应从包括可信计算在内的各个角度进行评审和最终确定。\n\n## 摘要\n\n本章我们讨论了推荐的测试生命周期、其阶段、每个测试阶段的进入和退出标准、每个利益相关者的职责、各种关键标准等。本章还确定了何时应执行测试。为了测试活动的成功，不仅需要使用适当的技巧进行测试，而且还需要在正确的阶段进行测试。\n\
    \n我们看到 Dynamics AX 定制项目的测试是项目团队的共同责任，即开发人员、业务分析师、测试团队等；不同团队之间高度合作、清晰的沟通协议以及对每个参与者的明确期望是\
    \ Dynamics AX 定制项目测试成功的关键。\n\n## 8 缺陷管理系统\n\n任何定制而非从零开始开发的软件系统都需要全面的测试，这超出了需求验证的范围，因为许多错误是由于定制而出现的。这需要对“缺陷”进行特殊定义，因为缺陷可能超出需求范围。以下情况可被视为缺陷：\n\
    \n- 系统执行了需求和设计文档未提及的功能。\n- 系统未执行需求和设计文档中提及的功能。\n- 系统执行了某个功能，而需求文档中对此功能没有任何信息。根据所有相关利益相关者的协议，这可能被视为缺陷或增强。\n\
    - 系统未执行某个功能，而需求文档中对此功能没有任何信息。根据所有相关利益相关者的协议，这可能被视为缺陷或增强。\n\n核心 Dynamics AX 产品或本地化中发现的所有问题应逐案处理。除了上述方面之外，业务应用程序需要获得可信性。为了实现这一特性，安全问题必须系统化处理。所有安全问题应按照本章规定的方法进行分类和处理。\n\
    \n为处理安全缺陷，缺陷跟踪工具应具备接受和处理此类问题的额外信息的功能。\n\n### 缺陷分类\n\n从缺陷管理的角度来看，缺陷可分为两类，即安全相关缺陷和非安全相关缺陷。安全相关缺陷需要为每个安全缺陷附加一些额外信息。在\
    \ Dynamics AX 中，缺陷分类（即无论发现错误的类型如何）基于以下因素：\n\n- Bug priority\n- Category\n- Issue\
    \ status\n- Requirement Ref.\n- STRIDE\n- Severity\n- Discoverability\n- Mitigation\n\
    - Vulnerability\n- Resources\n\n缺陷管理工具应具备接受所有安全相关缺陷信息的功能。工具应确保当缺陷被记录为安全相关问题时，用户输入所有必需信息。工具还应能够根据上述所有维度生成报告。\n\
    \n### Bug Priority\n\n错误优先级分类表示整体重要性并决定错误修复的顺序。为了确保优先修复的错误得到应有的优先级，为每个错误分配正确的优先级是必要的。以下是在\
    \ Dynamics AX 的 IBI 规范中推荐的优先级级别。\n\n- **紧急 (0)**：在做任何其他事情之前修复。\n- **高 (1)**：立即修复；这应是优先级\
    \ 0 之后的最高重要问题。\n- **普通 (2)**：尽快修复；具体时间取决于客户或测试的变通成本。\n- **低 (3)**：如果有时间则修复，很好有。\n\
    \n### Severity\n\n严重性应根据问题从技术角度的影响进行分配。以下是在 Dynamics AX 的 IBI 规范中推荐的严重性级别：\n\n\
    - **严重性 1（必须修复）**：这些是与系统崩溃或信息丢失相关的修复。此类别的几个示例包括应用程序崩溃、产品不稳定、主要测试阻塞、高安全风险、构建损坏或构建验证测试失败、应用程序安全故障和可信计算故障、数据丢失、损坏或误表示、内存泄漏等。\n\
    - **严重性 2**：当主要部分或整个功能不可用，或功能的小部分不可用但变通方法非常复杂时分配此严重性。这也可能是一个严重性级别，其中错误会显著影响客户或测试。几个示例是：\n\
    \  - 电话号码字段（必须填写）只能容纳 5 个字符，而客户所在地的实际电话号码为 7 位数字。\n  - 缺少加密信用卡号码等敏感信息的加密功能。\n\
    - **严重性 3**：当存在次要功能问题且有变通方法时应分配此严重性级别。客户或测试不应因错误而受到显著影响。\n  - 某个字段接受 ISD 代码超过两位字符，但客户所在国家的\
    \ ISD 代码为一位数字。变通方法可能是输入 00X 而不是 X。\n- **严重性 4**：非常次要的问题，如拼写错误（不提供错误信息）、制表符顺序不正确等。\n\
    \n有些人对严重性和优先级感到困惑，常常认为高优先级的错误也是高严重性的，这是不正确的。例如：\n\n- 新添加的功能缺少帮助文件：\n  - High Priority\
    \ (a user cannot use the functionality as the help file is the only way to know\
    \ about the new feature).\n  - Low severity (it is not information loss or functionality\
    \ missing; from a technical perspective it is not so damaging).\n- Interest calculation\
    \ is wrong in the year 2100 due to incorrect leap year calculation at the end\
    \ of a century:\n  - Low priority (Customer is not affected today).\n  - High\
    \ severity (the calendar algorithm may need a change).\n"
