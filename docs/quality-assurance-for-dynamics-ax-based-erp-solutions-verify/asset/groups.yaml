    # Globalization Testing


    The objective of this testing includes the verification of adherence to rules
    to function in any country without translation (i.e. proper handling of date/times,
    currency, string formats) and the ability to run on different (supported) language
    versions of Windows. It should also verify if the Dynamics AX layer conventions
    are followed or not. The following table summarizes this testing.


    | Specifications for Globalization Testing | |

    |---|---|

    | Technique | Dynamics AX best-practice tool should not show any label file-related
    errors or any other errors that indicate that date/time, currency, or string formats
    are hard coded. |

    | Expected Results | - Ensure the application can function in any culture/locale.

    - The system should run on different (supported) language versions of Windows.

    - Adhere to Dynamics AX globalization conventions (i.e. by layer). |

    | Completion Criteria | Dynamics AX best-practice tool does not show any error
    related to globalization. |

    | Special Considerations | The first check point should be covered during the
    compliance check of Dynamics AX best practices. |

    | Responsibility | Tester. |

    | IBI Reference | 10.1, 10.2, 10.3 |


    # Localization Testing


    The following should be the objectives of localization testing for Dynamics AX
    implementations:


    +   - Configuration keys to enable and disable appropriate country functionality
    based on country settings

    +   - Manual verification to check that all country-specific localization is in
    the DIS layer

    +   - Inspecting the Dynamics AX Event log for errors indicating hard-coded strings
    in the code when executing the Dynamics AX best-practice tool'
