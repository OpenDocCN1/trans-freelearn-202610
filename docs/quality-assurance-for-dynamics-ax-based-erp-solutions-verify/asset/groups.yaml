- raw:
  - '[PAGE 50]


    If an application under installation has a separate database then data back up
    and data restore processes must be provided in documentation.


    # Extensibility and Customization


    Dynamics AX has a built-in AOT documentation system where the considerations for
    successful customization of the application are mentioned. In AOT documentation
    there will be one node corresponding to each AOT element such as table, form,
    etc. The corresponding node must be updated if an existing element is customized;
    but if a new AOT element is created, there should be a new node in the AOT documentation.


    # Upgrade and Maintenance


    Applications can be connected to Dynamics AX in many ways such as COM connector,
    BIZ Talk, etc. All integration points must be known so that customers can access
    Dynamics AX externally using these integration points. The following information
    is required but it is encouraged to supply additional necessary information too.


    # Documentation of Integration Points


    Dynamics AX integration points should cover at least the following information;
    however, additional information is highly encouraged.


    +   - Core Dynamics AX Objects Modified (repeat this section as many times as
    necessary)

    +     - Object modified (table/form/report/class)

    +     - List of components added or modified with core object

    +     - New restrictions or dependencies added (save/delete verifications, restrictions
    to data able to be viewed, etc.)

    +     - List of integration points with this object

    +   - New Dynamics AX Objects added that interface with core Dynamics AX

    +     - Object added (table/form/report/class)

    +     - Navigation method to new object (if a form or web resource)

    +     - List of core Dynamics AX resources used by new object

    +     - Tables used

    +     - Classes referenced

    +     - Integration points from new object into core Dynamics AX

    +     - Method of integration used

    +     - Type of integration (read only, read/write, etc.)'
  - '[PAGE 51]


    +   - External Objects added that interface with core Dynamics AX

    +     - Object added

    +     - Navigation method to new object (if a form or web resource)

    +     - List of core Dynamics AX resources used by new object

    +     - Tables used

    +     - Classes referenced

    +     - Integration points from new object into core Dynamics AX

    +     - Method of integration used

    +     - Type of integration (read only, read/write, etc.)


    # Database Upgrade Script


    As Dynamics AX requires a data upgrade script for handling data upgrade, whenever
    any changes are made such as releasing new versions, service packs, or hotfixes
    an upgrade script should be provided if any change is required in the data model
    structure.


    # File Versioning for DLL and ActiveX Controls


    All executable files (e.g. DLLs and ActiveX control files) should have associated
    versioning metadata. This will help in upgrading and application of service packs
    or hot fixes. The installation program for any upgrade, service pack, or hot fix
    checks if required versions of these files are in place. Only if it finds everything
    required, will it proceed with installation. If versioning metadata is not associated,
    there may be chances of faulty installation. Metadata must have information about
    the supplier company so that if any kind of corruption occurs in that file, the
    customer can identify the company name and contact for the regression.


    # Description of All Objects Modified


    Dynamics AX can generate a list of all modified objects. A detailed description
    should be provided for all the objects modified in a release. The description
    must include how the changes affect the application.


    It should be noted that the detailed description is required only for the modified
    objects and not for the new objects or unchanged objects that have been customized
    in previous release.'
  - '[PAGE 52]


    # Removal of Non-functioning Code


    Any non functioning code should be removed from the code base as non-functioning
    code may offer difficulties while understanding the code for further customization
    or support.


    # Summary


    We studied how we can define quality in Dynamics AX and why we should preserve
    this quality. This chapter will be a foundation to understand the IBI specifications.'
  - '[PAGE 53]


    # 3


    # Best Practices—Technical


    After completing this chapter, you will understand the basics behind the various
    best practices for coding and designing. In this chapter, we will discuss some
    of the most important best practices.


    Most of the qualities of an ideal ERP system discussed in Chapter 1 are implemented
    by conformance to the technical best practices discussed in this chapter. The
    Dynamics AX best practice can be categorized in three categories i.e. application
    design standards, shared standards, and AOT object standards.


    # Application Design Standards


    The Dynamics AX design standards consist of the following considerations:


    +   - Code placement

    +   - Performance optimization

    +   - Using field groups in tables

    +   - Auto property settings


    # Code Placement


    Code placement is important as it affects the following:


    +   - Performance

    +   - Customization

    +   - Reusability

    +   - Maintainability (upgrade, extensibility, etc.)'
  - '[PAGE 54]


    The general guidelines are that the code should be placed in such a way that various
    calls to other layers are minimized, the operation is performed at the layer where
    it is least expensive, and the same code need not be written at several places
    (e.g. if business logic is written on a form then it needs to be written in the
    enterprise portal for the web client also). So we should not only think about
    the tier of placement in the three-tier architecture, but also about the best
    AOT (Application Object Tree) element type for a piece of code. Once these have
    been designed we need to think about the type of method or objects in the classes,
    etc.


    # Three-Tier Architecture Considerations


    The three tiers in this architecture are dedicated for the following three types
    of jobs:


    +   - **Client**—The Presentation layer—This is where the forms are stored. Place
    client-specific classes and methods here.

    +   - **Object server**—The Business application logic layer—Transaction-oriented
    database update jobs should be run here, close to the database.

    +   - **Database server**—The Database layer—Utilize the power of the database
    server by using aggregate functions, joins, and other calculating features of
    the database management system.


    Dynamics AX has a property, RunOn, for every AOT element, which indicates the
    layer where it should be executed i.e. Client, AOS, or Database server. This RunOn
    property may have one of three values i.e. Client, Called from, and Server.


    Client: The object will live on the client.


    Called from: The object will live at the tier where the object is created using
    the ''new'' constructor.


    Server: The object will live on the server.


    Now we will discuss how to decide the RunOn property value.


    # Classes


    The value of the RunOn property for a class will decide the location of the object
    created from that class.


    +   - The value of RunOn property for a class will be same as the parent class
    if the parent class has a RunOn property other than Called from i.e. the RunOn
    property cannot be changed for a class if the parent class has as its value either
    Client or Server.'
  - '[PAGE 55]


    +   - If the parent class has `Called from` as its RunOn property value, it can
    be changed to `Client` or `Server` and if it is not changed it will retain the
    inherited value i.e. `Called from`.

    +   - The `Called from` value of the RunOn property means the object will live
    at the tier where the code creating it (by calling the new constructor) is running.


    # Methods


    Now we will discuss the execution place for various types of methods.


    +   - Class static methods and table methods (except for the database methods)
    can have their default behavior.

    +   - The execution place for a method can be changed to `Server` or `Client`
    by adding the `Client` or `Server` modifier keywords in the method declaration
    as shown below:

    +     - `server static boolean mymethod()`: to make server the execution place.

    +     - `client static boolean mymethod()`: to make client the execution place.

    +     - `client server static boolean mymethod()`: to make called from the execution
    place.


    The following table summarizes the execution place of various types of methods:


    | AOT elements | Default behavior | Can be changed |

    |---|---|---|

    | Class static methods | Runs by default at the same place where the associated
    class runs i.e. if the associated class has the RunOn property value as `server`
    then the class static method will also be executed at the server. | Yes |

    | Class instance methods | Runs where the object of the class lives. The class
    objects live as described in the class RunOn property. | No |

    | Table static methods | Table static methods have the RunOn property as `Called
    from` and hence by default they run where they are called. | Yes |

    | Table instance methods | Table instance methods have the RunOn property as `Called
    from` and hence by default they run where they are called. The standard methods
    Insert/doInsert, Update/doUpdate, and Delete/doDelete run on the `Server` where
    the data source is located. | No |'
