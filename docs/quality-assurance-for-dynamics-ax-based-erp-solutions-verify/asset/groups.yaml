  - '[PAGE 134]


    Resumption of testing will begin when the following are delivered to the test
    team:


    +   - The code with the problem that caused suspension of testing corrected.

    +   - A list of all bugs fixed in the new version.

    +   - A written assurance from the lead developer that he or she, or one of the
    team members has verified that cause which suspended testing and it has been removed.


    # Roles and Responsibilities


    For the success of the project it is necessary that each stakeholder knows his
    or her responsibilities and expectations from other stakeholders.


    The test team recommended for Dynamics AX customization projects is not an isolated
    testing team, but the testing responsibility is distributed throughout the project
    team. This is suggested to minimize the cost and make efficient utilization of
    available skills.


    | Role | Responsibilities |

    |------|-------------------|

    | Test Manager | - Writing test plan

    - Maintaining test plan

    - Monitoring test progress

    - Monitoring adherence to test plan

    - Making decisions about entry and exit to and from a testing stage

    - Making decisions about suspension or resumption of testing

    - Making changes in test strategy or amendments in test plan |

    | Test Lead | - Coordinating test team

    - Representing testing team in various meeting

    - Generating various reports and matrices

    - Risk identification, analysis, and mitigation

    - Reporting updates about testing progress, any issues being faced, and risk identified
    to Test Manager |

    | Business Analyst | - Creating functional test cases and test scripts

    - Performing functional testing

    - Assisting in system test cases

    - Writing consistency verification test scripts |'
  - '[PAGE 135]


    | Role | Responsibilities |

    |------|-------------------|

    | Developers | - Performing unit testing

    - Conducting peer code reviews

    - Delivering complete builds of the application

    - Providing feedback to the testers regarding changes and new functionality

    - Providing expertise and knowledge of the application under test to the test
    team as and when required

    - Eliminating errors that were agreed |

    | Lead Developer | - Conducting code reviews (performing compliance check to design
    and architecture, compliance check to business standards or reporting standards)

    - Representing development team in triage meetings

    - Representing trustworthy computing-related activities such as final security
    review, threat review, and prioritization |

    | Testers | - Writing or executing test cases other than functional test cases
    (i.e. test cases for other than functional testing regression testing, scenario-based
    testing, and end-to-end functional testing)

    - Finding, reporting, and tracking errors discovered during testing

    - Analyzing results

    - Performing compliance check to coding standards, help navigation testing, user
    experience and usability testing, performance testing, globalization testing,
    localization testing, platform compatibility testing, extensibility testing, backup
    and restore testing, installation testing |


    # Code Review


    Code review in Dynamics AX has multiple objectives, which include the following:


    +   - Compliance check to design and architecture guidelines.

    +   - Verification of business intelligence or reporting standards.

    +   - Final security review.


    The code review should be conducted at two levels; one is at the level of piece
    of code that would help to meet the first two objectives and the other is at a
    system level where the major focus is on security. The system-level code review
    will also help in reviewing the correctness of critical business logic.'
  - '[PAGE 136]


    During code review, the objectives of this testing should be kept in mind. To
    ensure meeting the objectives of the said testing a checklist should be prepared
    that contains checkpoints related to this testing. This checklist should be reviewed
    and approved before code review starts.


    The design and architectural patterns should be reviewed and finalized from every
    perspective including trustworthy computing.


    # Summary


    In this chapter we discussed various key points about the recommended testing
    life cycle, its stages, entry and exit criteria for each of the testing stages,
    responsibilities of each of the stakeholders, various key criteria, etc. This
    chapter also identified when testing should be performed. For the success of testing
    activities, it is not only necessary to perform testing with proper techniques,
    but also that it is performed at the correct stage.


    We saw that testing for Dynamics AX customization projects is a shared responsibility
    for a project team i.e. developers, business analysts, test team, etc.; a high
    level of cooperation among different teams, clear communication protocols, and
    defined expectations from each of the participants are key to success of testing
    for Dynamics AX customization projects.'
  - '[PAGE 137]


    # 8

    Defect Management System


    Any software system that is customized and not developed from scratch requires
    comprehensive testing, which goes beyond requirement verification, as many bugs
    appear because of customization. This requires a special definition for ''defect''
    as the defect may be beyond the requirement area. The following could be considered
    as a defect:


    +   - The system does something the requirements and design document does not
    mention.

    +   - The system does not do what the requirements and design document mentions.

    +   - The system does something and requirement document does not contain any
    information about that function. It may be considered as a defect or an enhancement
    depending upon the agreement between all relevant stake holders.

    +   - The system does not do something and requirement document does not contain
    any information about that function. It may be considered as a defect or an enhancement
    depending upon the agreement between all relevant stake holders.


    All issues found in the core Dynamics AX product or localization should be dealt
    with case by case. Besides the aspects mentioned above, business applications
    need to gain trustworthiness. To achieve this characteristic security issues must
    be handled systematically. All security issues should be classified and handled
    as per the methodology prescribed in this chapter.


    To handle security defects, the defect tracking tool should have provision to
    accept and process additional information for such issues.'
  - '[PAGE 138]


    # Defect Classification


    From the perspective of defect management defects can be classified into two categories
    i.e. security related defects and non security related defects. The security-related
    defects need some additional information attached with each security defect. Defect
    classification in Dynamics AX, for all kinds of defects (i.e. irrespective of
    the type of testing discovering the bugs), is based on the following factors:


    +   - Bug priority

    +   - Category

    +   - Issue status

    +   - Requirement Ref.

    +   - STRIDE

    +   - Severity

    +   - Discoverability

    +   - Mitigation

    +   - Vulnerability

    +   - Resources


    The defect management tool should have the provision to accept all the security-related
    defects'' information. The tool should ensure that when a defect is logged as
    a security-related issue, the user enters all the required information. The tool
    should also be able to generate reports as per all the dimensions mentioned above.


    # Bug Priority


    The bug priority categorization indicates overall importance and determines the
    order in which bugs should be fixed. To ensure that bugs to be fixed on priority
    are given due priority, assigning correct priority to each bug is necessary. The
    following are the recommended priority levels in the IBI specifications for Dynamics
    AX.


    +   - **Urgent (0)**: Fix before doing anything else.

    +   - **High (1)**: Fix immediately; this should be the most important issue after
    priority 0.

    +   - **Normal (2)**: Fix soon; the specific timing is based on customer or test
    cost of workaround.

    +   - **Low (3)**: Fix if time is available, nice to have.'
  - '[PAGE 139]


    # Severity


    The severity should be assigned as per the impact of the issues from a technical
    perspective. The following are the recommended severity levels in the IBI specifications
    for Dynamics AX:


    +   - **Severity 1 (Must Fix)**: These are fixes related to system crash or information
    loss. A few examples of this category are application crash, product instability,
    major test blockage, high security risk, broken builds, or failed build verification
    tests, application security failures and trustworthy computing failures, data
    loss, corruption, or misrepresentation, memory leaks, etc.

    +   - **Severity 2**: This severity is assigned when a major part or the entire
    feature is unusable, or a small part of the feature is unusable but the workaround
    is very complex. This may also be a severity level where a bug can affect customer
    or testing significantly. A few examples are:

    +     - A telephone number field (which it is mandatory to fill) can accommodate
    only 5 characters while real-life phone number at customer locations are 7 digits.

    +     - Functionality to encrypt sensitive information such as credit card numbers
    is missing.

    +   - **Severity 3**: This severity level should be assigned when a minor feature
    problem exists and has workaround. The customer or test should not be affected
    significantly due to the bug.

    +     - A field accepts more than two characters for ISD code, but the ISD code
    for the customer''s country is single digit. The workaround may be to put 00X
    rather than X.

    +   - **Severity 4**: Very minor issues such as typo errors (without giving wrong
    information), incorrect tab order, etc.


    Some people are confused between severity and priority and often consider that
    a bug of high priority is also of high severity, which is not true. For example:


    +   - The help file is missing for a newly added feature:

    +     High Priority (a user cannot use the functionality as the help file is the
    only way to know about the new feature).

    +     Low severity (it is not a information loss or functionality missing; from
    a technical perspective it is not so damaging).

    +   - Interest calculation is wrong in the year 2100 due to incorrect leap year
    calculation at the end of a century:

    +     Low priority (Customer is not affected today).

    +     High severity (the calendar algorithm may need a change).'
