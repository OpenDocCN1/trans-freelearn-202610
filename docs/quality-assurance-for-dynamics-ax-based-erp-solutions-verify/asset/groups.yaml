    # Projects


    Create and maintain base data for projects


    For each project, information about the project number, name, invoice project,
    group and project status is listed, along with other base data This is also where
    you will find an overview of project transactions, the setup for project posting,
    the project sales and cost price setup, invoice information, project forecasting,
    WIP definination and other critical project data


    Four different project types can be created For more information on the characteristics
    of these project, see Type


    # Project hierarchy


    Each project that you create can be a parent to any number of child projects in
    a parent-child hierarchy The project hierarchy can contain an optional number
    of levels Each child project can inherit base data from the parent project


    # Viewing projects


    Projects are viewed in either a list, or in a tree structure Select or clear the
    Tree control check box to change between project and Tree view


    # Sub-projects


    If you select the Sub-projects check box, transactions on the parent project as
    well as transactions on sub-projects of the current parent project appear in the
    Hours, Costs, and Revenues windows If the check box is left blank, only transactions
    on the parent project appear in these windows


    Also, if this check box is selected, transactions on sub-projects will be included
    in the project range suggested when adjustment transactions and invoice proposals
    are created


    # Buttons


    | Option | Description |

    |---|---|

    | Transactions | View transactions posted on the current project Revenue transactions
    are revenue with no matching costs WIP transacinos are all transactions posted
    to a fixed-price project with WIP applied |

    | Activities | Open the Activities window where you can enter project activities
    |

    | Item | Open a submenu with options for entering item requirements on a project,
    or accessing the Sales Order or the Purchase Order windows |

    | Setup | View and maintain contact persons, posting profiles, sales and cost
    prices on the current project |

    | Functions | Open the Scheduling or the Adjustment windows |

    | Invoice | Access the invoicing features with this button With the On-account
    button you can enter on-account transactions on the current project With the Invoice
    proposal button you can create invoice proposals and on-account invoice proposals
    Note, that the proposals apply to all transactions entered on projects attached
    to the current invoice project and not transactions entered on the current project
    The Invoice button allows you to access the invoice register window which lists
    historical invoice information |

    | Inquiry | Access three project inquiry features Ledger posting View the posting
    setup The Gamet chart provides a graphic overview of forecasted activities In
    the Statistics window budgeted and realized transactions are compared |

    | Forecast | This button provides an opportunity to enter and maintain expected
    hour, cost, revenue, and item transactions on projects forecasts are used as a
    basis for financial control of projects Hour forecasts form the basis of project
    planning Revenue, cost, and item forecasts are used for general budgeting purposes
    The four forecast functions are also available under the Forecasts menu folder
    |

    | Stages | Click the button to change the stage of a project''s life cycle |

    | Project control | Click this button to access the Project control window where
    you set up estimate periods for fixed price projects |'
