    \ should run with the least necessary privileges.\n  - Unused or little used services\
    \ should be off.\n  - Features not used widely should be disabled by default.\n\
    - Secure in deployment: The security in deployment works in two ways: i.e. security\
    \ should be hardened during deployment and the deployment procedure should be\
    \ safe and secure to apply patches.\n- Communications: If any security vulnerability\
    \ is discovered, the protective action or workaround should be communicated to\
    \ end users or administrators in a clear and responsible manner. While communicating\
    \ to the end user or administrator, corrective action e.g. applying patches, new\
    \ deployments of workarounds, and changes in configuration settings should be\
    \ suggested.\n\n## Security Development Life Cycle\n\nThe Trustworthy Security\
    \ development life cycle is derived from the waterfall model. It consists of six\
    \ stages.\n\n## Requirement Stages\n\nOften people have misconceptions that a\
    \ review of the application developed is sufficient to ensure the trustworthiness\
    \ of the software application. Reviewing the software application is not only\
    \ cost-inefficient, but also ineffective. A security issue found in the design\
    \ while reviewing developed application may compel redesigning and rewriting the\
    \ code.\n\nIt is true that trustworthiness cannot be achieved in software applications\
    \ until and unless the people involved are educated about security. Microsoft\
    \ recommends the following mandatory security education for the development team:\n\
    \n- Reading *Writing Secure Code, Second Edition*, by Michael Howard.\n- Reading\
    \ the *Microsoft Dynamics AX Writing Secure X++ Code* white paper published on\
    \ Microsoft website.\n- Completing the following two Microsoft eLearning security\
    \ courses:\n  - Clinic 2806: Microsoft Security Guidance Training for Developers\n\
    \  - Clinic 2807: Microsoft Security Guidance Training for Developers II\n- Reading\
    \ the Threat Modeling section of the IBI ISV Certification Handbook distributed\
    \ by Microsoft to each of the IBI solution provider.\n\nThe completion of security\
    \ education in the requirement phase will provide an opportunity to have security\
    \ as the prime concern during each stage of the security development life cycle.\n\
    \nThis phase must also plan security, i.e. writing a security plan, defining security-related\
    \ defect classifications and progression. We will discuss more about defect management\
    \ in Chapter 8.\n\n## Design Phase\n\nThe design phase is very much critical in\
    \ trustworthy application development. Carefully designed architecture is the\
    \ foundation of trustworthiness of software applications. Following are a few\
    \ key activities in the design phase:\n\n- Security architecture and design guidelines\
    \ definitions. The following should be the prime concerns for this activity:\n\
    \  - Identification of design techniques such as application of least privileges\n\
    \  - Identification of components whose correct functioning is essential for security\n\
    - Security architecture definition for the overall system\n- Minimization of attack\
    \ surface\n- Security by default implementation:\n  - Documenting the elements\
    \ of the software attack surface\n  - Identification of the features that need\
    \ to be installed by default.\n- Conduct threat modeling for each component:\n\
    \  - Identification of assets\n  - Identification of trust boundaries\n  - Identification\
    \ of threats\n- Conduct risk analysis:\n  - Assessment of impact on security for\
    \ each feature as well as each privilege level.\n  - Identification of countermeasures\
    \ and risk mitigation. Countermeasures may include information encryption at trust\
    \ boundaries and input validations before passing trust boundary.\n\n## Implementation\
    \ Phase\n\nIn the implementation phase best practices are identified to meet the\
    \ goal of trustworthiness. A few such activities are:\n\n- Identification of design\
    \ patterns to ensure security, privacy, and reliability.\n- Definition of security\
    \ testing. The following may be a few testing objectives:\n  - To ensure that\
    \ the Application Under Testing (AUT) does not bypass standard security model\
    \ of Dynamics AX.\n  - To ensure that the system is robust enough against security\
    \ threats.\n  - To ensure that user permissions are properly enforced as per the\
    \ various configurations such as user group, company, configuration keys, security\
    \ keys, and license code.\n- Apply Dynamics AX best-practice check tool and document\
    \ the deviations.\n- Perform code reviews to:\n  - Ensure that coding is as per\
    \ the prescribed design patterns.\n  - Examine source code with an intent of detecting\
    \ and removing potential security vulnerabilities.\n\n## Stabilization Phase\n\
    \nThis is the stage when software is almost in a stable condition (i.e. functionally\
    \ complete) and can be reviewed as a system. At this stage the security push goes\
    \ beyond the security reviews done in earlier stages. Conducting code reviews\
    \ at this stage offers an opportunity to not only review the new code, but also\
    \ the modified code and core Dynamics AX code in new perspective of entirety.\n\
    \nIn Dynamics AX the following activities are recommended by Microsoft:\n\n- Review\
    \ of features and functions specifically designed to improve the trustworthiness\
    \ i.e. reliability, security, and privacy. Risk analysis done in design phase\
    \ of the security development life cycle can be useful to identify such features\
    \ and functions.\n- Review of overall code in entirety: i.e. both new code and\
    \ updated code. Impact on existing code should also be a consideration.\n\n##\
    \ Release Phase\n\nThe primary activity in release phase is conducting the Final\
    \ Security Review (FSR). This activity is conducted a couple of months before\
    \ implementing or shipping the product. The FSR should be conducted by an independent\
    \ security team at a stage when non-security issues are minimum. The FSR should\
    \ not only consider the security health of the product in scope, but also previously\
    \ reported issues. The previously reported issues give a clue to the pattern of\
    \ security issues and the other areas where this kind of issues are still not\
    \ discovered. It may also help to understand the root causes and take corrective\
    \ and preventive actions.\n\n## Support/Servicing Phase\n\nA software application\
    \ cannot be 100% secure — and even if it is 100% secure today, it will definitely\
    \ be vulnerable tomorrow due to discovery of new kinds of attacks. A support system\
    \ should be in place, which can respond to newly discovered security vulnerabilities.\
    \ The response should include:\n\n- Evaluating vulnerability and issuing advisories\
    \ and/or updates.\n- Conducting a post mortem of the vulnerabilities and conducting\
    \ an analysis of the chances of similar kinds of vulnerabilities in the product\
    \ and taking preventive action.\n- Reporting newly identified vulnerabilities\
    \ to the security team so that suitable test cases can be added for future release\
    \ of the same or other products.\n\n## Threat Modeling\n\nThreat modeling is a\
    \ security analysis technique to identify and document the threats to meet the\
    \ following objectives:\n\n- Identification of risk\n- Analysis of risk\n- Identification\
    \ of the possible remedy or mitigation of threats\n- Help design, development,\
    \ and testing team to improve the security aspects of design, secure development,\
    \ and testing respectively\n\nTo meet the above objectives, threat modeling has\
    \ three major activities: i.e. understanding the adversary's view, characterizing\
    \ security, and determining, analyzing, and documenting the threats.\n\n## How\
    \ to Conduct Threat Modeling\n\nTo conduct threat modeling it is necessary to\
    \ analyze the system architecture to find the entry points and assets and cross\
    \ reference these with trust levels. The entry points or interfaces are the places\
    \ in the architecture where data and/or control flow transfers between the system\
    \ under consideration for threat modeling and any other system. All entry points\
    \ or interfaces must be identified and documented irrespective of the trust level\
    \ at the interfaces. Here trust level means privileges an external entity should\
    \ have to legitimately use these interfaces.\n\nThese interfaces include the following:\n\
    \n- Open sockets\n- Remote Procedure Call (RPC) interfaces\n- Web services interfaces\n\
    - Data being read from the file system\n\nAfter identifying the entry points,\
    \ assets that a malicious user can misuse (e.g. manipulate, steal, etc.) should\
    \ be identified. Usually most affected assets are entities at interfaces points,\
    \ but they can be other things such as process tokens, unencrypted passwords,\
    \ etc. All assets that can be a targeted for threat should be identified and cross-referenced\
    \ with trust level. Here trust level means privilege level required to allow access\
    \ or affect the assets in some way.\n"
  mdcn: "\n- 应使用规定的或安全的设计模式以确保安全编码。\n- 应使用加密技术以最大限度降低信息泄露风险。\n- 应使用 Dynamics AX 代码访问安全机制，防止不受信任的代码（即未源自\
    \ AOT 的代码）调用任何危险的 API。\n- 应在每个 API 上应用严格的权限。\n- 应通过使用威胁建模的结论来降低漏洞。\n- 应遵循与数据授权相关的最佳实践。\n\
    \n- 默认安全：即使 IT 应用以千种方式得到保护，但存在一个安全漏洞，现实世界的软件应用也无法完全安全。该安全漏洞可能被恶意用户利用。一些最佳实践可以在恶意攻击发生时确保最小化损害：\n\
    \  - ERP 系统或任何其他应用程序应以最少的必要权限运行。\n  - 未使用或很少使用的服务应关闭。\n  - 使用不广泛的功能应默认禁用。\n- 部署中的安全：部署安全有两种方式：即在部署期间应加强安全，并且部署程序应安全可靠以应用补丁。\n\
    - 沟通：如果发现任何安全漏洞，保护性措施或变通方法应以清晰且负责任的方式传达给最终用户或管理员。在与最终用户或管理员沟通时，应建议纠正措施，例如应用补丁、部署变通方法以及配置设置更改。\n\
    \n## 安全开发生命周期\n\n可信安全开发生命周期源自瀑布模型。它包含六个阶段。\n\n## 需求阶段\n\n许多人误以为对已开发应用的审查足以确保软件应用的可信度。审查软件应用不仅成本低效，而且无效。在审查已开发应用时在设计中发现的安全问题可能会迫使重新设计和重写代码。\n\
    \n确实，除非相关人员接受过安全培训，否则软件应用无法实现可信度。Microsoft 建议开发团队接受以下强制性安全培训：\n\n- 阅读 Michael\
    \ Howard 所著的 *编写安全代码，第二版*。\n- 阅读 Microsoft 网站上发布的 *Microsoft Dynamics AX 编写安全\
    \ X++ 代码* 白皮书。\n- 完成以下两门 Microsoft eLearning 安全课程：\n  - Clinic 2806：面向开发人员的 Microsoft\
    \ 安全指导培训\n  - Clinic 2807：面向开发人员的 Microsoft 安全指导培训 II\n- 阅读 Microsoft 向每位 IBI\
    \ 解决方案提供商分发的 IBI ISV 认证手册中的威胁建模部分。\n\n在需求阶段完成安全培训将提供机会，使安全成为安全开发生命周期每个阶段的首要关注点。\n\
    \n该阶段还必须规划安全，即编写安全计划、定义与安全相关的缺陷分类和进展。我们将在第 8 章中更详细地讨论缺陷管理。\n\n## 设计阶段\n\n设计阶段在可信应用开发中至关重要。精心设计的结构是软件应用可信度的基础。以下是设计阶段的几个关键活动：\n\
    \n- 安全架构和设计指南定义。以下应是此活动的首要关注点：\n  - 识别设计技术，例如应用最小权限原则\n  - 识别正确运行对安全至关重要的组件\n\
    - 为整个系统定义安全架构\n- 最小化攻击面\n- 默认安全实现：\n  - 记录软件攻击面的元素\n  - 识别需要默认安装的功能。\n- 对每个组件进行威胁建模：\n\
    \  - 识别资产\n  - 识别信任边界\n  - 识别威胁\n- 进行风险分析：\n  - 评估每个功能以及每个权限级别对安全的影响。\n  - 识别对策和风险缓解。对策可能包括在信任边界处加密信息以及在通过信任边界之前进行输入验证。\n\
    \n## 实现阶段\n\n在实现阶段，确定最佳实践以实现可信度的目标。一些此类活动包括：\n\n- 识别设计模式以确保安全性、隐私性和可靠性。\n- 定义安全测试。以下可能是一些测试目标：\n\
    \  - 确保被测应用程序（AUT）不会绕过 Dynamics AX 的标准安全模型。\n  - 确保系统对安全威胁具有足够的鲁棒性。\n  - 确保用户权限根据各种配置（如用户组、公司、配置键、安全键和许可证代码）得到正确执行。\n\
    - 应用 Dynamics AX 最佳实践检查工具并记录偏差。\n- 执行代码审查以：\n  - 确保编码符合规定的设计模式。\n  - 检查源代码以检测并移除潜在的安全漏洞。\n\
    \n## 稳定化阶段\n\n这是软件几乎处于稳定状态（即功能完整）并可作为系统进行审查的阶段。在此阶段，安全推进超出了早期阶段进行的安全审查。在此阶段进行代码审查不仅提供了审查新代码的机会，还提供了从整体新视角审查修改后的代码和核心\
    \ Dynamics AX 代码的机会。\n\n在 Dynamics AX 中，Microsoft 建议执行以下活动：\n\n- 审查专门设计用于提高可信度（即可靠性、安全性和隐私性）的特性和功能。安全开发生命周期设计阶段进行的风险分析可用于识别此类特性和功能。\n\
    - 对整体代码进行全面审查：即新代码和更新的代码。现有代码的影响也应予以考虑。\n\n## 发布阶段\n\n发布阶段的主要活动是进行最终安全审查（FSR）。该活动在实施或交付产品前几个月进行。FSR\
    \ 应由独立的安全团队在非安全问题最少时进行。FSR 不仅应考虑范围内产品的健康状况，还应考虑之前报告的问题。之前报告的问题可揭示安全问题的模式以及此类问题尚未发现的其他领域。它还可能有助于理解根本原因并采取纠正和预防措施。\n\
    \n## 支持/维护阶段\n\n软件应用不可能 100% 安全——即使今天是 100% 安全，明天也肯定会因发现新型攻击而变得脆弱。应建立支持系统以应对新发现的安全漏洞。响应应包括：\n\
    \n- 评估漏洞并发布咨询和/或更新。\n- 对漏洞进行事后分析，并分析产品中出现类似漏洞的可能性并采取预防措施。\n- 向安全团队报告新识别的漏洞，以便为同一产品或其他产品的未来版本添加合适的测试用例。\n\
    \n## 威胁建模\n\n威胁建模是一种安全分析技术，用于识别和记录威胁以实现以下目标：\n\n- 识别风险\n- 分析风险\n- 识别威胁的可能补救或缓解措施\n\
    - 帮助设计、开发和测试团队分别改进设计、安全开发和测试的安全方面\n\n为实现上述目标，威胁建模有三个主要活动：即理解对手的视角、表征安全以及确定、分析和记录威胁。\n\
    \n## 如何进行威胁建模\n\n进行威胁建模时，有必要分析系统架构以找到入口点和资产并将其与信任级别交叉引用。入口点或接口是架构中数据和/或控制流在被考虑进行威胁建模的系统与任何其他系统之间转移的位置。所有入口点或接口必须被识别和记录，而不论接口处的信任级别如何。这里的信任级别是指外部实体合法使用这些接口应拥有的权限。\n\
    \n这些接口包括以下内容：\n\n- 打开的套接字\n- 远程过程调用（RPC）接口\n- Web 服务接口\n- 从文件系统读取的数据\n\n在识别入口点后，应识别恶意用户可能滥用的资产（例如操纵、窃取等）。通常受影响最大的资产是接口点处的实体，但它们也可以是其他事物，例如进程令牌、未加密的密码等。所有可能成为威胁目标的资产都应被识别并与信任级别交叉引用。这里的信任级别是指允许访问或以某种方式影响资产所需的权限级别。\n"
