    # Testing


    The following table summarizes this testing.


    **Specifications for Installation Testing**


    | Technique | The installation test document should be prepared and the test should
    be performed against this document.


    The AUT should be installed using its installation guide and the execution should
    be verified thereafter.


    The share count for every DLL and ActiveX control should be noted before and after
    installation or uninstallation or reinstallation. It should also be checked that
    the registry is updated with the correct version for DLLs and ActiveX controls.


    An inappropriate version of Dynamics AX could be used for the setup process. The
    setup process should check for the correct version of Dynamics AX at an early
    stage of installation.


    Every factor should be taken into consideration to ensure that setup checks all
    dependencies and if any of the dependencies are not available the setup should
    abort without leaving any impact on the core Dynamics AX.


    It should also be checked that setup does not ask for any file download from the
    Internet, etc.


    Ensure that the setup checks for required Dynamics AX modules by deseleting a
    required module from the configuration keys. This test should be repeated for
    each required module. |

    | Expected Results | The setup meets the guidelines mentioned as the objective
    of this test. |

    | Completion Criteria | AUT installs and runs successfully as per the installation
    test document. |

    | Special Considerations | The installation testing can be started only after:

    - The installation guides are available

    - The information for registry records created by AUT is provided

    - The information about all system and application components that are included
    in the AUT installation is available |

    | Responsibility | Tester. |

