    # Preface


    Dynamics AX is a next-generation ERP system that can be customized in any area
    to provide a competitive edge by facilitating ERP implementations that follow
    the time-proven processes being used by businesses. This ERP system not only provides
    additional flexibilities but also has some other unique features such as its layered
    customization approach, separation of language elements from code, feature keys,
    etc. All these features add great value allowing implementation of solutions in
    a flexible, cost-effective, risk-free, and timely manner but these things may
    add challenges in Quality Assurance of these solutions.


    This book discusses the methodology to ensure quality standards in Dynamics AX
    customization projects and IBI-compliant ISV application development. Dynamics
    AX customization is not equivalent to fresh application development!; however,
    Dynamics is so flexible in customization that it allows customization in almost
    all areas, which poses greater challenges for correctness, accuracy, and trustworthiness
    of customized Dynamics AX-based ERP solutions.


    This book discusses the quality expectations from the Dynamics AX-based ERP solutions,
    what best practices need to be followed to meet the quality expectations, and
    what are the strategies to test a customized Dynamics AX ERP application.


    # What This Book Covers


    Chapter 1 discusses the challenges of businesses that are solved by ERP, key quality
    expectations from an ERP, and what makes Dynamics AX an ideal ERP system.


    Chapter 2 is the foundation to understand IBI standards, as this chapter is all
    about quality definition in the context of Dynamics AX''s unique challenges. It
    also explains why we should preserve and maintain the quality of Dynamics AX-based
    ERP applications.'
