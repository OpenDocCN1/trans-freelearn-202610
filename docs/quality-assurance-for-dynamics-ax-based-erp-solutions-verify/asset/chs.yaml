  \ Microsoft 的愿景，IT 应用程序应像我们家中的水电设备一样安全。Dynamics AX 实施的安全测试目标应包括以下内容：\n\n- 确保测试中应用程序\
  \ (AUT) 不会绕过标准安全模型\n- 确保系统足够健壮以应对安全威胁\n- 对威胁建模、安全措施等的分析\n- 最终代码审查，以确保没有关键安全问题未解决\n\
  \n下表总结了此测试。\n\n### 安全测试规范\n\n|  |  |\n|---|---|\n| 技术 | 应作为此测试的一部分执行以下验证：在 **管理\
  \ | 设置 | 安全** 菜单中，AUT 必须在模块的树视图列表中有一个节点。对用户组设置无访问权限不应允许查看与 AUT 相关的任何功能、表单或菜单项的部分。应编写安全测试计划以定义测试范围、缺陷分类、根本原因分类等。应向测试员提供安全检查清单，测试时应填写。测试结果应记录在\
  \ Excel 表格中，该表格还将包含错误分类和根本原因分类。 |\n| 预期结果 | - 访问控制安全的工作方式与标准 Dynamics AX 产品相同。 -\
  \ 针对威胁建模中识别的每个安全威胁，都找到了对策。 |\n| 完成标准 | - 节点和树结构的验证。 - 从安全菜单中删除 AUT 的验证。 |\n| 特别考虑\
  \ | 应使用 Dynamics AX 独特的挑战检查对各个组的访问权限；例如，如果访问权限设置为 NO，所有菜单项、按钮、表单等都应不可见。 |\n| 责任\
  \ | 测试员。 |\n| IBI 参考 | 8.1 |\n\n## 授权测试\n\n授权测试是一种安全测试。此测试非常重要，并且需要补充安全测试以实现可信度的目标。此测试确保\
  \ Dynamics AX 中根据以下配置强制执行用户权限：\n\n- 用户组\n- 公司\n- 配置代码和安全密钥\n- 许可证代码\n\n下表总结了授权测试。\n\
  \n### 授权测试规范\n\n|  |  |\n|---|---|\n| 技术 | 应测试以下场景： - 设置为 **查看级别** 的安全密钥允许用户查看记录。\
  \ - 顶级安全密钥被禁用；用户不应有权访问该项目。 - 设置为 **创建级别** 的安全密钥允许用户创建新记录。 - 当配置密钥关闭时，功能被禁用。 - 当其安全访问设置为\
  \ **无访问** 时，表单控件不可见。 - 如果表中的字段设置为 **无访问**，则该字段不会出现在表单上。 - 用户无法看到他们无权访问的表单。 - 用户无法看到他们无权访问的报表。\
  \ |\n| 预期结果 | 各种权限控制手段的组合应以标准 Dynamics AX 的方式运行。 |\n| 完成标准 | 所有场景均已执行。 |\n| 特别考虑\
  \ | 设计测试场景时必须注意以下特殊考虑： - 对于权限有限的用户，必须检查所有条件（即 **无访问**、**编辑**、**创建**、**查看**、**完全控制**）。\
  \ - 属于多个用户组（权限冲突）的用户必须进行测试。 - 属于多个公司的用户在不同公司可能具有不同的权限。设计测试场景时必须特别考虑这一点。 - Dynamics\
  \ AX 系统具有有限的许可证代码，例如，具有管理员权限的用户可能根据提供的许可证无法访问 AR 或 AP。 |\n| 责任 | 业务分析师。 |\n| IBI\
  \ 参考 | 8.6 |\n\n## 全球化测试\n\n本测试的目标包括验证遵守在任何国家/地区无需翻译即可运行的规则（即正确处理日期/时间、货币、字符串格式）以及在不同（受支持的）Windows\
