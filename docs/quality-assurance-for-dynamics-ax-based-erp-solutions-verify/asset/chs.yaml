  \ IT 书籍相比，Packt 的书籍更具体、更少泛化。我们的独特商业模式使我们能够为您提供更集中的信息，让您了解更多所需的内容，减少不必要的内容。\n\nPackt\
  \ 是一家现代而独特的出版公司，专注于为开发者、管理员和新手社区生产优质、前沿的书籍。如需更多信息，请访问我们的网站：www.packtpub.com。\n\n\
