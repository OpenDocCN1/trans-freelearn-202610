  \ |\n| IBI 参考 | 3.5。 |\n\n## SDL 验证\n\n此活动具有以下需要验证的目标：\n\n- 确保已实施安全开发生命周期（SDL），并且正确遵循\n\
  - 审查所有开放的安全相关缺陷，并确保没有关键安全缺陷处于开放状态\n- 审查应用程序以确定是否由标准工具和程序遗漏了任何安全漏洞\n\n## 测试\n\n下面的表格总结了规范。\n\
  \nSDL 验证规范\n\n| 项目 | 描述 |\n|---|---|\n| 技术 | 使用为一致性验证测试编写的测试脚本进行手工测试。手工代码审查。 |\n\
