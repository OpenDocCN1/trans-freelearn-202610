  | 14 | 必须仔细遵守选项卡隐喻。这例如意味着控件不得添加或隐藏，并且选项卡上的标签不得根据该选项卡上或同一选项卡控件中的另一个选项卡上的某些输入字段的值或记录类型而更改。可以根据记录类型激活和停用控件。是否有任何表单忽略了此标准？注意：将存在树控件的概述选项卡命名为“树”不仅是允许的，而且是强制性的。
