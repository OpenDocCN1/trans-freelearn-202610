  \ 宏不应包含任何类型的条目。 |\n| 责任 | 测试员。 |\n| IBI 参考 | 11.1, 11.4 |\n\n## 平台兼容性测试\n\n此项测试用于验证被测应用程序在受支持的平台和数据库上成功运行。下表总结了此项测试。\n\
