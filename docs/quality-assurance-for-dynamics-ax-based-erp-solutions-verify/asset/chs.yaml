  以下应为 Dynamics AX 实施本地化测试的目标：\n\n- 根据国家/地区设置启用和禁用适当国家/地区功能的配置密钥\n- 手动验证以检查所有特定于国家/地区的本地化是否在\
  \ DIS 层中\n- 在执行 Dynamics AX 最佳实践工具时，检查 Dynamics AX 事件日志中指示代码中硬编码字符串的错误\n\n\n\n##\
