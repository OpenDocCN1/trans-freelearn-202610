  \n### 性能\n\nDynamics AX 4.0 具有一些优化其性能的高级概念。列出如下：\n\n- **数据压缩**：这确保了数据在网络中传输的最小时间，因此性能得到改善，额外的安全性也是一个好处。\n\
  - **Axapta 对象服务器 (AOS) 线程池**：这允许 AOS 拥有少于登录用户数量的线程数量，因此性能得到改善。\n\n### 业务流程的连贯性\n\
  \n像 Payroll、Accounting、Purchase management 等软件应用程序已经存在很长时间了，但这些单独的应用程序无法相互集成，因此各种业务流程/部门之间的沟通是手动进行的，这对信息技术的益处造成了严重限制。ERP\
  \ 系统提供了各种业务流程的连贯运作，因此是解决这一集成问题的解决方案。\n\n- Dynamics AX 4.0 还包括基于角色的功能，以便用户可以轻松访问与其在组织中的职位相关业务数据。\n\
  - 通过有助于自动化和简化财务、客户关系、业务服务、人力资源管理和供应链流程的全面功能，Microsoft Dynamics AX 4.0 将全球各地的人、流程和技术汇聚在一起。这样，Microsoft\
  \ Dynamics AX 4.0 有助于提高您业务的生产率和有效性。\n\n> 通过销售和采购流程，我们最大限度地减少了多余的数据输入并优化了办公室之间的工作流程。现在，参与这些流程的人员更少了。\
  \ — Alexander Sharafutdinov, 首席信息官, UCC Shchekinoazot (http://www.n-azot.ru) (Source:\
  \ http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=200916.)\n\n###\
  \ 易于集成\n\n在组织中可能需要保留对不同软件应用程序的旧投资，或某些专用软件需要与 ERP 系统协同工作。在这种情况下，ERP 系统必须提供各种行业标准集成方法。Microsoft\
  \ 有将各种应用程序如 MS Office、Microsoft Office PerformancePoint server 等集成的长期战略。Dynamics\
  \ AX 可以使用以下技术进行集成：\n\n- Microsoft Dynamics AX 4.0 包含应用程序集成框架 (AIF)，它允许组织通过在不创建核心解决方案内依赖关系的情况下轻松插入来自其他供应商应用程序的业务逻辑进行扩展。此外，AIF\
  \ 作为 Web 服务工具箱，通过公开所有应用程序组件来发挥作用，并通过发布用于接收和履行订单等核心业务流程的广泛 Web 服务为开发人员提供先发优势。\n-\
  \ Biztalk 是 Dynamics AX 的兼容集成适配器，它提供了许多优势，例如跨扩展组织的实时可见性、灵活性、部署简便性和投资回报率提升。\n- Dynamics\
  \ AX 可以使用 Web 服务以及行业标准技术（如 Microsoft BizTalk Server、组件对象模型 (COM) 集成、Microsoft 消息队列\
  \ (MSMQ)、简单对象访问协议 (SOAP)、Microsoft .NET Framework、XBRL 和 XML）与外部数据源连接。\n- Microsoft\
  \ Dynamics AX 采用与其他 Microsoft 应用程序共享的通用标准设计；它能够与 Microsoft Windows、Microsoft Office\
  \ 程序和 Microsoft SQL Server 2005 等产品实现更紧密的集成和更无缝的连接。\n- Dynamics AX 支持 Microsoft\
  \ Office Outlook 消息传递和协作客户端、Microsoft Office Word 和 Microsoft Office Excel 电子表格软件使用的不同\
  \ Microsoft 开发的文档格式，并且可以确保互操作性。\n- 与迫使您使用专用工具集的一些业务管理系统不同，Microsoft Dynamics AX\
  \ 使用基于 SQL Server Reporting Services 和 Microsoft Visual Studio .NET 开发系统的标准适配器。这立即使您能够访问各种行业标准集成协议和经过培训的集成合作伙伴，您可以使用它们将业务合作伙伴的业务管理解决方案连接起来。\n\
  \n\n\n> *我们选择 Microsoft Business Solutions Dynamics AX 是因为可以将其与办公软件套件集成、灵活的报表、能够以两种货币显示信息、多语言用户界面以及项目模块的功能，所有这些都为我们提供了一个先进的项目管理系统。—\
  \ Agnieszka Burak，ZWIK 首席会计师。 (http://www.zwik.lodz.pl/) (Source: http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=200554.)*\n\
  \n### 国际化\n\n国际化在业务范围超过一个国家时非常必要。以下特性使 Dynamics AX 成为真正的国际化 ERP 解决方案：\n\n- Dynamics\
  \ AX 符合 Unicode 标准。今天 Unicode 是最大的行业标准字符集；符合 Unicode 意味着您可以以最小的数据损坏风险访问新地区并通过许多不同的系统传输数据。Unicode\
  \ 合规性使您能够与使用多字节字符集的语言的子公司集成，例如中国、日本和其他东亚国家。\n- Dynamics AX 支持日期/货币格式与区域设置的关联，这使得\
  \ Dynamics AX 能够根据区域设置的标准自动更改日期格式。Dynamics AX 支持多种语言和多种货币（超过 36 种语言和 40 种货币）。\n\n\
  ### 本地化\n\n不同国家的业务流程不能完全相同，因为监管制度、税制、语言、货币和区域设置可能存在差异。IntelliMorph 是一项功能，可使 Dynamics\
  \ AX 根据业务流程的差异重新调整其图形用户界面。除此之外，以下特性对本地化 Dynamics AX ERP 包非常有帮助。\n\n- Microsoft Dynamics\
  \ AX 具有内置的多站点、多语言和多货币功能，支持 36 个国家和 40 种语言。\n- 可以从 Dynamics AX 的本地化层获取本地税收、监管和市场要求。\n\
  - 标签文件系统是 Dynamics AX 中的一项强大功能，可使 Dynamics AX 根据区域设置自动更改标签。\n\n> *由于 Microsoft Dynamics\
  \ AX 中的多语言工具，我们的员工可以用本地语言更高效地工作。— Patrik Dannehall，Haldex Europe IT 总监。 (http://www.haldex.com)\
  \ (Source: http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=200926.)*\n\
  \n### 可扩展性\n\n企业会随着时间增长；一家小企业明天可能变成一家价值数百万美元的企业。在这种情况下，ERP 解决方案必须具有高度可扩展性，即应能够根据不断增长的业务需求而变化。以下特性使\
  \ Dynamics AX 成为高度可扩展的解决方案：\n\n- Dynamics AX 在结构上真正模块化，如果不触及 Dynamics AX 的核心，各种模块可以轻松添加或移除。您现在可以使用所需的函数，并在需要时解锁额外功能。Dynamics\
  \ AX 的模块化程度达到第二级，即不仅在部门级别模块化，而且更进一步；例如，HR 有 HR 1、HR 2、HR 3。\n- 使用 MorphX 开发环境，开发人员可以在单屏内几分钟内设计、编辑、编译并查看更改。\n\
  - Microsoft Dynamics AX 可以轻松适应市场变化，有助于您的员工和业务跟上市场并更有效地工作。此外，您可以通过添加由各种合作伙伴和独立软件供应商提供的行业特定解决方案来扩展已经强大的核心解决方案。\n\
  - Dynamics AX 支持 Microsoft 的三层、面向对象的架构。Dynamics AX 与其他 Microsoft 技术（如 Microsoft\
  \ SQL Server）集成，为您提供高速服务器端性能和轻松扩展 IT 基础设施的能力，以便解决方案能够随公司一起成长。\n\n> *Microsoft Dynamics\
  \ AX 是一款可扩展、灵活的解决方案，能够满足我们现在和未来的技术需求。* — Sébastien Batt，Stock Fenêtre 的 Microsoft\
  \ Dynamics AX 电子商务和后台系统经理。 (http://www.stock-fenetre.com) (Source: http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=1000003854.)\n\
  \n### 代码文档\n\n在 ERP 系统的生命周期中，其他开发人员可能需要理解开发人员编写的代码，因此必须记录对标准 Dynamics AX 所做的任何修改。Dynamics\
  \ AX 方便记录各种开发人员所做的自定义的原因和内容，这将有助于新开发人员理解和定制新功能。\n\n### 全面功能\n\n最后但并非最不重要的一点是，ERP\
  \ 系统应功能丰富，以在标准 ERP 包中进行最少更改的情况下适应业务流程。这不仅能够实现快速实施，还能降低总体拥有成本。\n\n- Dynamics AX 提供广泛的行业特定垂直解决方案，均符合\
  \ Microsoft Industry Builder Initiative (IBI) 规范。符合 IBI 规范不仅确保了这些垂直领域的质量，还超越了这一点（如及时的支持服务等）。Dynamics\
  \ AX 的高度适应性确保其可以作为功能丰富的 ERP 实现，其中所有业务流程均可根据定制需求进行定制。\n- Microsoft Dynamics AX 设计用于通过互联网为您的客户/供应商提供增强安全性的业务信息访问。安全的互联网访问帮助您的客户/供应商输入销售订单并查找发货状态、账户余额、库存水平和采购订单状态——全天\
  \ 24 小时、每周 7 天——来自世界任何地方。\n- 内置业务模型是 Dynamics AX 的真正力量。它支持广泛的功能，例如，它不仅支持各种供应链模型，如按订单生产、按工程生产和按预测生产，而且在混合模式环境中也表现良好。\n\
  \n> _我们现在可以获取所需的数据，以便及时应对变化并有效管理业务。该系统允许我们按组或按特定零件号跟踪单个项目。这为我们提供了对全球运营所需的可见性，—Joe\
  \ Horvath，Esselte Apollo 项目办公室副总裁。 (http://www.esselte.com) (Source: http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=1000003878.)_\n\
  \n### Dynamics AX 的定制\n\n几乎所有企业主都努力做些什么来脱颖而出；但这并不总是适用于他们对现成软件的选择。因此，企业独特的方面往往在“原味香草”集成企业应用中丢失。然而，Dynamics\
  \ AX 解决方案允许企业将独特的术语、公式、流程和业务战略完全无缝地集成到软件中。现在我们将简要讨论 Dynamics AX 中的一些有用功能，这些功能对 Dynamics\
  \ AX 定制非常有用。\n\n### MorphX\n\nMicrosoft Dynamics AX 提供了一个名为 MorphX 的集成开发环境。它非常直观，使开发人员能够为两种类型的界面即\
  \ Windows 客户端和 Web 浏览器界面进行图形化设计、开发和报告。MorphX 开发工具可在 **Tools | Development tools**\
  \ 菜单中使用。该工具通过单屏提供设计、编辑和编译，大大帮助了开发人员。一旦更改编译完成，所有更改将由应用程序反映。\n\nMorphX 开发套件是一系列广泛功能的集合，可实现快速定制，成本低廉，同时不影响原始解决方案的可靠性、完整性和安全性，即风险最小。另一个有用的工具是\
  \ IntelliMorph，它提供了根据位置、语言、货币、监管要求等上下文对齐 GUI 的出色功能。我们将在下一节讨论它。\n\n### IntelliMorph\n\
  \n通常，解决方案设计师或开发人员的主要关注点是 GUI 实体（表单、报表等）在所有受支持语言中都能良好运行。使用标签文件系统翻译不同标签很容易。然而，长度可能差异很大，这可能会破坏整个\
  \ GUI 设计，并且此类系统的可用性会受到损害。\n\n在不同国家，功能可能以不同的方式使用，或者某些字段可能被隐藏或需要额外的字段。不同公司也可能出现这种情况。\n\
  \n考虑这样一种情况：某些业务流程可能未实施，因此必须删除其他业务流程到此业务流程的所有连接。因此，可能需要在所有相关业务流程中添加某些字段并删除某些字段。由于此类字段的添加或删除，GUI\
  \ 可能会发生变化，这对用户来说非常不便。\n\nMorphX 对上述场景有解决方案，即 IntelliMorph 技术。IntelliMorph 技术允许表单和报表自动调整显示宽度以适应单词长度，因此\
  \ GUI 保持在可呈现或可用的状态。\n\n\n\n### 功能键\n\n在任何 ERP 解决方案中，我们可以将功能分为三类：\n\n- 符合客户需求的标准功能\n\
  - 实施中不使用的标准额外功能\n- 使 ERP 适应业务场景的定制\n\n隔离不需要的功能，即通过禁用某些功能来创建标准功能的子集，可以通过启用或禁用功能键代码轻松完成。使用功能键，可以为某个安装创建标准功能的子集。功能键系统可用于单个用户或用户组。此功能是使\
  \ Dynamics AX 成为高度可适应 ERP 的又一工具。\n\n功能键不仅适用于表、窗体、报表、查询和菜单，还适用于更深层次的内容，即单个类或方法。\n\
  \n### X++ 编程语言\n\n在 Microsoft Dynamics AX 集成开发环境中用于开发和编写类和方法使用的语言是一种面向对象的语言，类似于\
  \ Sun Microsystems 的 JAVA 和 C++。它基于 JAVA，并在代码中嵌入了 SQL。该语言对对象引用具有广泛的检查系统，既在编译时也可在运行时进行检查。如果系统中发现任何对象没有引用，则会收回其存储空间。\n\
  \nX++ 语言遵循 OOPS 概念，并且继承的概念与任何其他面向对象语言一样有效。它提供了一个巨大的优势，即在 Microsoft Dynamics AX 中某处对属性所做的更改应在\
  \ Microsoft Dynamics AX 中使用该对象的所有地方得到反映/继承。例如，如果数据库字段的显示属性从长度 10 改为长度 15 个字符，则在显示或使用该字段的所有窗体中都会发生变化。\n\
  \n用任何语言编写的语句在语法上可能是正确的，但这并不能保证它符合编程推荐的最佳实践。Dynamics AX 内置了一个名为 Dynamics AX Best\
  \ Practice Check Tool 的工具。\n\n### Dynamics AX 最佳实践检查工具\n\n代码审查非常耗时，因为它需要将每个语句对照大量检查点进行审查。由于成本原因，手动对照如此大量的质量检查点审查代码几乎是不可能的。Dynamics\
  \ AX 具有内置的代码扫描工具。它名为 Dynamics AX Best Practices Check tool 或 ABC 工具。它将代码对照超过 200\
  \ 个检查点进行验证。\n\n### 应用程序组件管理\n\nMicrosoft Dynamics IDE 中的所有对象都可以通过自动附加修改任何对象的开发人员标识以及日期和时间戳来有效管理。\n\
  \n组件在被处理时会被锁定并从系统中签出。开发人员完成工作后，组件会被解锁并签入系统。\n\n### Dynamics AX 层系统\n\nDynamics AX\
  \ 提供了完全的灵活性来定制其各个方面（功能和图形用户界面等），并优雅地在其自己的容器即层中保留不同方所做的各种更改。\n\nDynamics AX 应用程序层是\
  \ Dynamics AX 应用程序源代码中的层级结构，确保您可以进行修改和添加，而不会干扰您所在层级以下的应用对象。\n\n由于分层技术，Microsoft\
  \ Dynamics AX 定制更容易构建和维护，该技术促进了不同合作伙伴在不同层中进行定制。您可以定制一个层中编码的功能，而不会影响其他层中编码的功能。这意味着您可以随着时间的推移以较少的业务中断、风险和费用（即更低的风险、更高的适应性和更低的\
  \ TCO）来适应和升级您的解决方案。例如，您可以选择向标准窗体添加一个字段。添加内容将保存在您当前的层级中；修订后的窗体将替换标准窗体，但您只需删除新窗体即可始终返回到您所在层级以下层级的原始窗体，因此您可以以最小的业务中断风险工作，因为您可以始终使用已正常工作的功能。\n\
  \n### Dynamics AX 简介\n\nDynamics AX 应用程序层层次结构包含十六个层，分为每组两个层的组，即八个不同的层类别。每个层还都有一个补丁层，用于处理补丁、次要更新、服务包、热修复和额外功能。这种层设计清楚地表明\
  \ Dynamics AX 是为优雅地容纳多方更改而构建的，并鼓励定制。Dynamics AX 层是为不同的 Dynamics AX 组以及不同类型的定制而设计的，如下表所述。层按从下到上的顺序列出：\n\
  \n| 层 | 用户组 | 特征 |\n|---|---|---|\n| SYS (System) | Microsoft | - 最内层的层。<br>- 用于实现标准\
  \ Dynamics AX 应用程序的层。<br>- 该层中的应用程序对象永远不能被删除。 |\n| GLS (Global Solutions) | MBS\
  \ Certified third parties | - 解决方案是按照与标准应用程序相同的开发标准创建的，并因此获得资格认证。<br>- 该层中实现的解决方案作为\
  \ Dynamics AX 产品标准的一部分交付。<br>- 这些不是行业特定的垂直领域，而是核心功能，如人力资源模块。 |\n| DIS (Distributor)\
  \ | - 本地 Microsoft Business Solutions 办公室<br>- 提供国家特定解决方案的 IBI 合规解决方案提供商 | - DIS\
  \ 层用于包含国家特定功能。<br>- 由 IBI 解决方案提供商开发的本地化应用程序将保留在 DIS 层中。 |\n| LOS (Local Solution)\
  \ | Local MBS offices | - LOS 层中的解决方案受标准应用程序使用的许可证代码框架保护。<br>- 如果本地 MBS 办公室希望认证和分发一个未在内部开发的战略本地解决方案（例如\
  \ Payroll），则该解决方案必须在 LOS 层中实现。 |\n| BUS (Business Solution) | Business Partners\
  \ | - 业务合作伙伴使用 BUS 层开发和分发垂直和水平解决方案给其他合作伙伴和客户。<br>- 保留用于附加组件/垂直解决方案。<br>- 业务合作伙伴只有在获得\
  \ MBS 的书面同意后才能在此层中实现任何解决方案。 |\n| VAR (Value Added Reseller) | Business Partners\
  \ | - 业务合作伙伴可以在没有任何业务相关限制的情况下使用此层。 |\n| CUS (Customer) | - 企业<br>- 业务合作伙伴 | - 企业以及业务合作伙伴可以修改此层。<br>-\
  \ 客户层和用户层包含在内，以支持企业和个人公司在内部开发方面的需求，而不会危及业务合作伙伴所做的修改。 |\n| USR (User) | End users\
  \ | - 个人公司或企业内的公司可以利用此层进行特定于客户安装的定制。 |\n\n### Dynamics AX 简介\n\n除了这些主要应用程序层之外，还有补丁层，可以通过层名称末尾使用字母\
  \ P 与其他应用程序层区分开来。层为：SYP、GLP、DIP、LIP、BUP、VAP、CUP 和 USP。补丁层的使用不受任何预定义的 MBS 规则限制，因此可以以任何合适的方式用于支持客户/业务合作伙伴。此过程提供了在不干扰现有层的情况下发送更正的选项。\n\
  \n所有应用程序层都能够使用 Dynamics AX MorphX 开发套件中提供的所有工具以及所有对象类型、表、类、宏、扩展数据类型、窗体、报表等。联机帮助也包含在层技术中，以及标签系统的使用。\n\
  \n在每个应用程序层中都提供所有对象类型，使得应用程序层技术非常灵活和动态。\n\n### Dynamics AX 定制文件\n\n每个层在技术上都保存在一个单独的文件中，称为\
  \ `Ax<layer>.aod`，例如 SYS 层的 `Axsys.aod`，DIS 层的 `Axdis.aod`，等等。`.aod` 扩展名是 Application\
  \ Object Data 文件的缩写。文件存储在 `Appl` 下的 `Dynamics AX Standard` 文件夹中。\n\n除了 `Ax<layer>.aod`\
  \ 之外，还有一些其他文件保存层的不同类型数据，如下表所述。\n\n| 序号 | 命名约定 | 描述 |\n|---|---|---|\n| 1 | Axapd.aoi\
  \ | - aoi 代表“应用程序对象索引”。<br>- 它告诉 Dynamics AX 在哪里找到每个单独的对象。<br>- 在任何定制后下次登录 Dynamics\
  \ AX 时，该文件将被重建。 |\n| 2 | ax<layer><language>.ald | - ald 代表“应用程序标签数据”。<br>- 每个层中每种语言的单独文件。\
  \ |\n| 3 | ax<layer><language>.alc | - alc 代表“应用程序标签注释”。<br>- 每个层中每种语言的单独文件。 |\n\
  | 4 | ax<layer><language>.ali | - ali 代表“应用程序标签索引”。 |\n\n需要注意的是，在直接复制、删除等上述文件时，不应有任何用户连接。\n\
  \n\n\n### Summary\n\n本章我们研究了由 ERP 包解决的业务挑战。为应对这些挑战，ERP 包需要具备以下关键特性：\n\n- 竞争力强且经济的所有权成本\n\
  - 对业务流程适应性的灵活性\n- 可扩展性\n- 易用性\n- 业务流程的连贯性\n- 易于集成\n- 国际化\n- 本地化\n\n我们还讨论了使 Dynamics\
  \ AX 成为理想 ERP 系统的功能，以及在定制过程中有助于保持 Dynamics 特性的内置工具。\n"
- "## 2 Quality in Dynamics AX-Based ERP Solutions\n\n在上一章中，我们讨论了从业务或用户角度使 ERP 系统理想的关键特征。我们还了解了为什么\
  \ Dynamics AX 可被视为理想的 ERP 解决方案。在本章中，我们将从技术角度讨论各种关键特征，并学习如何保持这些特征。学习本章后，以下主题将变得清晰：\n\
  \n- 什么是质量？\n- 为什么需要关注质量？\n- 我们如何实现这一质量？\n\n### Quality Definition for Dynamics AX\n\
  \n为保持 Dynamics AX 的关键特性，需要考虑一些规范。这些规范最初由微软作为“Industry Builder Initiatives”发布。尽管它们已详细讨论，但可能存在一些差异，因为我结合了自己在经济成本下提高质量的经验。\n\
  \n### Coding\n\n定制编写的代码应符合规定的编码标准。编码标准基于以下因素制定：\n\n- 后续定制的便捷性\n- 集成\n- 性能\n- 国际化/本地化\n\
  - 可扩展性\n- 可理解性（包括代码布局和注释）\n- 易用性\n- Dynamics AX 之道\n- 可信赖性\n\n这些编码标准分为以下两类：\n\n\
  - 语法级最佳实践（静态代码分析）\n- 设计模式级最佳实践\n\n大量语法级最佳实践的检查可以通过 Dynamics AX 的内置工具——Dynamics AX\
  \ 最佳实践检查工具来执行。该工具可用于：\n\n- 编译时\n- 提交时\n- 随时通过在 AOT 中右键单击对象并检查最佳实践\n\n随时可以通过右键单击节点并选择\
  \ **Add-Ins | Best Practices | Check Best Practices.** 来检查应用程序对象树（AOT）中一个或多个节点的最佳实践。\n\
  \n要在编译时配置最佳实践检查，用户需要执行以下操作：\n\n1. 选择 **Tools | Options**。\n2. 单击 **Compiler** 按钮。\n\
  3. 将 **Diagnostics level** 选择为 **level 4**。\n\n最佳实践检查工具显示三种类型的最佳实践偏差，即 Error、Warning\
  \ 和 Information。我们可以选择要显示的偏差严重程度级别。以下是可选择的不同的警告级别：\n\n- **Errors only**: 如果 Dynamics\
  \ AX 仅显示严重程度为 Error 的偏差。\n- **Errors and Warnings**: 如果 Dynamics AX 应显示严重程度为 Error\
  \ 和 Warning 的偏差。系统不会显示严重程度为 'Information' 的偏差。\n- **All**: 当所有最佳实践偏差都需向用户显示时。\n\n\
  与警告级别相关的设置只会隐藏不相关的错误，但不会停止对最佳实践偏差的检查。警告级别可在 **Tools | Options | Best Practices**\
  \ 中通过从警告级别列表中选择适当的警告级别进行设置。\n\n定义了三种不同的严重程度级别如下：\n\n- **Information:** 可能值得了解的事情（在最佳实践工具输出中以蓝色显示）。\n\
  - **Warnings:** 强烈建议修复的事情（在最佳实践工具输出中以黄色显示）。建议至少消除该类别中 95% 的偏差，并且对无法修复的部分需要提供适当的理由并记录。\n\
  - **Errors:** 必须修复的事情（在最佳实践工具输出中以红色显示）。\n\n如果双击偏差消息，它将打开代码编辑器并聚焦于该偏差消息。\n\n### Testing\
  \ and Quality Assurance Standards\n\n必须利用与开发 Dynamics AX 时相同的质量标准，即微软标准，来保持核心 Dynamics\
  \ AX 的质量，从而在 Dynamics AX 定制中保持其质量。缺陷必须得到适当的分类和管理。应强调以下几点：\n\n- 定义缺陷严重程度和优先级的依据必须与微软标准相同。\n\
  - 缺陷管理系统应具有微软定义的特点，包括但不限于以下内容：\n  - 每个错误都应有一个唯一的编号（ID）与之关联。\n  - 它应允许根据严重程度和优先级对错误进行分类。\n\
  \  - 它应允许插入注释或至少是关闭注释。\n  - 它应允许为安全相关错误提供附加信息（对于安全错误而言这是强制性的）。\n- 所有已知问题必须记录在案，以描述可能的影响/故障以及可能的变通方法以最大程度地减少已知问题的影响。\n\
  \n我们将在第 8 章《缺陷管理系统》中讨论这些标准。\n\n### User Friendliness\n\n行业事实标准是帮助应可在用户当前屏幕下通用访问，即帮助系统在\
  \ HR 模块和 CRM 模块中不应不同。这将确保用户在无需花费太多精力查找帮助本身的情况下获得帮助。为了与 Microsoft Dynamics AX 用户帮助指南保持一致，我们需要遵守以下规定：\n\
  \n- 帮助文档应为 `.chm` 文件格式。\n- 帮助必须可通过按 `F1` 功能键访问。\n- 帮助必须描述“如何”，而不仅仅是“什么”或“为什么”。\n\
  - 帮助样式应符合 Microsoft Dynamics AX 帮助样式/标准。\n- 用户界面应符合 Microsoft Dynamics AX 用户界面指南和\
  \ Microsoft Windows 用户界面指南。\n- 高水平的一致性，例如：\n  - 同一实体不应使用不同的标签，例如 Bill of material\
  \ 和 BOM 或 Inquiry 和 enquiry。\n  - 按钮应按确定的顺序出现。\n\nDynamics AX 用户界面指南将在第 4 章《最佳实践\
  \ – GUI》中详细讨论。\n\n### Report Standards\n\n在定制期间使用 Dynamics AX 中遵循的通用标准是可取的。标准报表应使用\
  \ Dynamics AX 提供的报表向导开发。\n\n如果需要创建新型标准报表，应在所有此类报表中使用内置通用模板以保持一致性。使用标准模板还将提高可维护性。\n\
  \n应按照 Dynamics AX 应用程序中 SQL 报表实现的指南所述使用 SQL 报表。这些指南在 Microsoft Dynamics AX 中提供。\n\
  \n### Performance Optimization\n\n编码和实现应进行性能优化。以下考虑因素可确保定制不会导致性能下降：\n\n- 遵循性能优化/三层架构的最佳实践。\n\
  - 正确选择 run-on 属性，该属性决定代码应在哪个层运行。合适的选择将最大程度地减少不同层之间的调用，从而提高性能。\n- 正确使用缓存不仅可以减少网络/带宽资源，还可以使\
  \ AOS/数据库服务器的负载最小化。\n- 在代码中使用客户端/服务器中立函数。\n\n如果遵循上述考虑因素，将确保定制后没有显著的性能下降，这是 IBI 规范的要求之一。\n\
  \n### Trustworthy Computing\n\n如果不为用户提供可信赖的计算体验，任何 ERP 系统实施都无法成功。可通过以下特性实现可信赖的计算体验：\n\
  \n- **Security**: 如今计算机网络不仅局限于一个组织。网络可能暴露于互联网或广域网等，这增加了安全攻击的风险。业务系统应能够保护系统并维护数据的保密性、完整性和可用性。\n\
  - **Privacy**: 如今业务成功在于信息、其保密性、流动性和可用性。业务系统不仅应具有适当的访问控制机制，还应确保恶意用户无法通过设计、开发或部署中的安全漏洞访问机密信息。\n\
  - **Reliability**: ERP 系统实施不仅仅是另一种工具。它是一种文化变革。在新的文化中，业务成功高度依赖于 ERP 系统的可靠性，这意味着在每种情况下\
  \ ERP 系统都应按预期执行。系统呈现的信息应准确、精确且格式符合要求。客户应体验到一致且无故障的计算体验，无需使用其他手段来处理/了解信息。\n\n\n\n\
  可信性不能像一次事件那样实现。它需要受过教育的人力资源持续工作，并高度关注与可信性相关的质量，即安全性、隐私性、可靠性等。最后但同样重要的是，客户也应了解如何以最安全的方式使用系统，即应提供实施指南，其中描述了安全加固。\n\
  \n推荐的做法是对所有相关人员进行安全、安全设计和安全编码等方面的教育。这将有助于他们分析安全问题。所有安全问题必须归类为以下类别之一：伪造、篡改、否认、信息泄露、拒绝服务、权限提升和攻击面减少。适当的分类将有助于更好地理解安全问题，并能有效进行根本原因分析。有效的根本原因分析将有助于采取纠正和预防措施。\n\
  \n我们将在第 5 章 *最佳实践 – 可信计算* 中更详细地讨论可信计算。\n\n### 全球化\n\nMicrosoft Dynamics AX 是一个真正全球化的\
  \ ERP 解决方案，因为它支持全球不同地理位置的三十多种语言和货币的输入和输出显示。为了保持 ERP 解决方案的全球化特性，应具备以下特征：\n\n- 更改日期格式等不应需要定制，因此：\n\
  \  - 应使用内置数据类型，或 **EDT（扩展数据类型）** 应从内置数据类型扩展用于时间和日期。\n- 代码应与语言元素分离，以便翻译时无需定制：\n \
  \ - 语言元素（例如帮助文本、显示标签、错误消息等）应使用标签文件系统实现。\n  - 标签长度在不同语言中可能有所不同，因此标签/UI 控件的宽度必须能够根据不同语言的要求进行调整。Microsoft\
  \ Dynamics 具有一个非常好的功能，如果遵循最佳实践（例如控件上的标签未设置为固定宽度），UI 元素的宽度将根据语言需求自动更改。\n- 在世界不同地区，数字格式的约定各不相同，例如小数分隔符、千位分隔符等。Microsoft\
  \ Dynamics AX 提供了根据偏好约定调整数字格式的灵活性。需要遵循一些关于千位分隔符、小数分隔符等的最佳实践，即这些应设置为自动。\n- 在当今企业中，国家已不再是边界，因此\
  \ ERP 系统必须允许使用多种货币及其转换。Microsoft Dynamics AX 方便用户使用不同货币。\n\n我们将在第 3 章中更详细地讨论这些最佳实践。\n\
  \n### 本地化\n\n本地化是将全球化应用程序适配到特定文化或区域的过程。ERP 系统应实现本地化，这意味着：\n\n- 语言元素应与代码分离，以便代码可在本地语言中使用而无需重新定制。\n\
  - GUI 应根据标签或 Windows 控件数量的变化进行调整，以防止布局损坏。\n- 为特定文化或区域调整图形。\n\nDynamics AX 是一个真正可本地化的\
  \ ERP 解决方案。Dynamics AX 中的标签文件系统允许将以下项目与代码分离：\n\n- 显示标签\n- F1 帮助文件\n- 错误消息\n\nDynamics\
  \ AX 最佳实践工具是一个非常有用的工具，用于查找代码中是否嵌入了任何语言元素，即上述任何语言元素均未使用标签文件。\n\nDynamics AX 具有 IntelliMorph\
  \ 技术，可使其调整或重新排列用户界面元素，例如文本框、复选框等。这些对齐或调整大小的需求来自以下原因：\n\n- 显示标签在不同语言中的大小不同。\n- UI\
  \ 元素数量可能根据本地需求而变化，因此可能需要删除某些 UI 元素或容纳更多 UI 控件。\n\n最佳实践是使用不包含任何语言元素或特定文化信息的图形。需要注意的是，是否符合此最佳实践无法使用最佳实践工具进行验证。\n\
  \n### 平台兼容性\n\n在定制过程中，我们需要特别注意使其平台兼容：\n\n- 不应使用与 Dynamics AX 不兼容的任何技术。\n- 不应使用在该操作系统中为保留关键字的任何名称，例如组件名称、注册表项名称等。\n\
  - 在设计企业门户时应考虑浏览器兼容性。\n\n### 设置/安装\n\n任何软件安装或卸载过程中的错误不仅可能导致正在安装或卸载的应用程序出现故障，还可能导致共享某些组件的其他应用程序出现故障，例如\
  \ DLL/Active X 组件、配置设置、注册表值等。以下示例可能是安装或卸载过程中出现的一些可能问题：\n\n- 对共享组件的引用计数和版本检查管理不当可能导致在其他应用程序仍在使用共享组件时将其删除。另一个错误可能是应用程序安装未导致共享组件更新，这将导致已安装应用程序出现故障。\n\
  - 如果需要取消安装过程或由于某种原因安装未完成，设置中缺少回滚功能可能会带来很多困难。一个这样的例子可能是系统/设置包中没有依赖项。\n- 不适当的卸载可能会损坏在\
  \ Dynamics AX 的多个不同层中定制的共享 AOT 元素。不当卸载的另一个例子是未手动删除标签和帮助文件。如果未手动删除标签和帮助文件，它们仍将被 Dynamics\
  \ AX 使用，这意味着它们将抑制本不应再被抑制的标签。\n\n为了最大程度地减少不良安装或卸载的影响，设置过程应具有以下特征：\n\n- 应用程序的安装程序必须与核心\
  \ Dynamics AX 产品兼容。\n- 设置程序必须在注册表数据库中记录所有 DLL 和 Active X 组件，因为注册表是 Windows 操作系统中用户、应用程序和计算机特定信息的中央配置数据库。\n\
  - 设置必须更新 AOT 中的 ApplicationVersion 类以添加应用程序的版本/构建号。\n- 正在安装的应用程序的设置程序必须在设置早期阶段检查所需的\
  \ Dynamics AX 模块是否可用。如果所需的 Dynamics AX 模块不可用，设置程序应显示依赖项列表并优雅地失败，即适当地逆转设置过程。如果未自动化，则必须提供正确的手动检查程序。设置不应强制从\
  \ Internet 下载。\n- Dynamics AX 具有内置系统，可通过检查配置键来选择或取消选择特定功能。配置键可在以下位置查看：**主菜单 | 管理\
  \ | 设置 | 系统 | 配置**。正在安装的应用程序必须使用此机制来打开和关闭功能。此类功能的一个例子是国家/地区特定功能。应用程序不得覆盖核心 Dynamics\
  \ AX 产品中可用的配置键，但可以扩展新的配置键或核心产品中可用的任何配置键。如果无法扩展，必须创建新的配置键。\n- Dynamics AX 是一个完全可定制的\
  \ ERP 解决方案，其中定制可以在多个层或同一层的多个位置进行。在卸载 Dynamics AX 应用程序时，卸载过程不应删除任何其他定制，这些定制可能位于不同的层或与正在卸载的应用程序所在的同一层中。\n\
  \n### 备份/恢复\n\n客户应能够备份和恢复应用程序以及相关数据。由于在基于 Dynamics AX（即基于 X++）的应用程序中，新字段和表将与其他数据同样对待，因此基于核心\
  \ Dynamics AX 的流程会将这些实体视为与其他数据相同，它们将与核心 Dynamics AX 备份流程一起备份。\n\n\n\n如果安装的应用程序具有独立的数据库，则必须在文档中提供数据备份和数据恢复流程。\n\
  \n### 可扩展性和定制\n\nDynamics AX 具有内置的 AOT 文档系统，其中提到了成功定制应用程序的注意事项。在 AOT 文档中，每个 AOT\
  \ 元素（如表、窗体等）都对应一个节点。如果对现有元素进行定制，则必须更新相应的节点；但如果创建了新的 AOT 元素，则应在 AOT 文档中新增一个节点。\n\n\
  ### 升级和维护\n\n应用程序可以通过多种方式连接到 Dynamics AX，例如 COM 连接器、BizTalk 等。必须了解所有集成点，以便客户可以使用这些集成点从外部访问\
  \ Dynamics AX。需要以下信息，但也鼓励提供其他必要信息。\n\n### 集成点的文档\n\nDynamics AX 集成点应至少涵盖以下信息；不过，强烈鼓励提供更多信息。\n\
  \n- 修改的核心 Dynamics AX 对象（根据需要重复此部分多次）\n  - 修改的对象（表/窗体/报表/类）\n  - 与核心对象一起添加或修改的组件列表\n\
  \  - 新增的限制或依赖项（保存/删除验证、对可查看数据的限制等）\n  - 与此对象的集成点列表\n- 新增的与核心 Dynamics AX 接口的 Dynamics\
  \ AX 对象\n  - 添加的对象（表/窗体/报表/类）\n  - 导航到新对象的方法（如果是窗体或 Web 资源）\n  - 新对象使用的核心 Dynamics\
  \ AX 资源列表\n  - 使用的表\n  - 引用的类\n  - 从新对象到核心 Dynamics AX 的集成点\n  - 使用的集成方法\n  - 集成类型（只读、读写等）\n\
  - 新增的与核心 Dynamics AX 接口的外部对象\n  - 添加的对象\n  - 导航到新对象的方法（如果是窗体或 Web 资源）\n  - 新对象使用的核心\
  \ Dynamics AX 资源列表\n  - 使用的表\n  - 引用的类\n  - 从新对象到核心 Dynamics AX 的集成点\n  - 使用的集成方法\n\
  \  - 集成类型（只读、读写等）\n\n### 数据库升级脚本\n\n由于 Dynamics AX 需要数据升级脚本来处理数据升级，每当进行任何更改（如发布新版本、服务包或热修复）时，如果数据模型结构需要更改，则应提供升级脚本。\n\
  \n### DLL 和 ActiveX 控件的文件版本控制\n\n所有可执行文件（例如 DLL 和 ActiveX 控件文件）都应具有关联的版本元数据。这将有助于升级以及服务包或热修复的应用程序。任何升级、服务包或热修复的安装程序都会检查这些文件的所需版本是否已到位。只有在找到所需的一切后，它才会继续安装。如果未关联版本元数据，则可能出现安装故障的情况。元数据必须包含供应商公司信息，以便如果该文件出现任何类型的损坏，客户可以识别公司名称并联系以进行回归。\n\
  \n### 所有修改对象的描述\n\nDynamics AX 可以生成所有修改对象的列表。应为版本中修改的所有对象提供详细描述。描述必须包括更改如何影响应用程序。\n\
  \n需要注意的是，详细描述仅适用于修改的对象，而不适用于新对象或在先前版本中已定制的未更改对象。\n\n### 删除非功能代码\n\n应从代码库中删除任何非功能代码，因为非功能代码在理解代码以进行进一步定制或支持时可能会带来困难。\n\
  \n### 摘要\n\n我们研究了如何在 Dynamics AX 中定义质量以及为什么应保持这种质量。本章将成为理解 IBI 规范的基础。\n\n## 3 最佳实践—技术\n\
  \n## 最佳实践—技术\n\n完成本章后，您将了解各种编码和设计最佳实践背后的基础知识。在本章中，我们将讨论一些最重要的最佳实践。\n\n第 1 章中讨论的理想\
  \ ERP 系统的大多数质量都是通过符合本章中讨论的技术最佳实践来实现的。Dynamics AX 最佳实践可以分为三个类别，即应用程序设计标准、共享标准和 AOT\
  \ 对象标准。\n\n## 应用程序设计标准\n\nDynamics AX 设计标准包括以下考虑因素：\n\n- 代码放置\n- 性能优化\n- 在表中使用字段组\n\
  - 自动属性设置\n\n## 代码放置\n\n代码放置很重要，因为它会影响以下方面：\n\n- 性能\n- 定制\n- 可重用性\n- 可维护性（升级、可扩展性等）\n\
  \n一般指导原则是，代码应放置在尽量减少对其他层的各种调用、操作在成本最低的层执行，并且无需在多个地方编写相同代码的方式（例如，如果业务逻辑写入窗体，则也需要在\
  \ Web 客户端的企业门户中编写）。因此，我们不仅应考虑三层架构中的放置层，还应考虑代码片段的最佳 AOT（应用程序对象树）元素类型。设计完成后，我们需要考虑类中的方法和对象类型等。\n\
  \n## 三层架构考虑\n\n该架构中的三个层专用于以下三种类型的工作：\n\n- **Client**—表示层—窗体存储在此处。将客户端特定的类和方法放置在此处。\n\
  - **Object server**—业务应用程序逻辑层—应在此处、靠近数据库运行面向事务的数据库更新作业。\n- **Database server**—数据库层—通过使用聚合函数、连接和其他数据库管理系统的计算功能来利用数据库服务器的强大功能。\n\
  \nDynamics AX 为每个 AOT 元素都有一个属性 RunOn，表示应在哪一层执行，即 Client、AOS 或 Database server。此\
  \ RunOn 属性可能具有三个值之一，即 Client、Called from 和 Server。\n\nClient: 对象将驻留在客户端。\n\nCalled\
  \ from: 对象将驻留在使用 'new' 构造函数创建对象的层。\n\nServer: 对象将驻留在服务器上。\n\n现在我们将讨论如何确定 RunOn 属性值。\n\
  \n## 类\n\n类的 RunOn 属性值将决定从该类创建的对象的所在位置。\n\n- 如果父类具有除 Called from 之外的 RunOn 属性，则类的\
  \ RunOn 属性值将与父类相同，即如果父类的值为 Client 或 Server，则不能更改类的 RunOn 属性。\n- 如果父类的 RunOn 属性值为\
  \ `Called from`，则可以将其更改为 `Client` 或 `Server`，如果未更改，则将保留继承的值，即 `Called from`。\n-\
  \ RunOn 属性的 `Called from` 值意味着对象将驻留在创建它的代码（通过调用 new 构造函数）运行的层。\n\n## 方法\n\n现在我们将讨论各种类型方法的执行位置。\n\
  \n- 类静态方法和表方法（数据库方法除外）可以具有其默认行为。\n- 可以通过在方法声明中添加 `Client` 或 `Server` 修饰符关键字将方法的执行位置更改为\
  \ `Server` 或 `Client`，如下所示：\n  - `server static boolean mymethod()`：使服务器成为执行位置。\n\
  \  - `client static boolean mymethod()`：使客户端成为执行位置。\n  - `client server static boolean\
  \ mymethod()`：使 called from 成为执行位置。\n\n下表总结了各种类型方法的执行位置：\n\n| AOT 元素 | 默认行为 | 可以更改\
  \ |\n|---|---|---|\n| 类静态方法 | 默认情况下在与关联类相同的地点运行，即如果关联类的 RunOn 属性值为 `server`，则类静态方法也将在服务器上执行。\
  \ | 是 |\n| 类实例方法 | 在类的对象所在位置运行。类对象按类 RunOn 属性所述驻留。 | 否 |\n| 表静态方法 | 表静态方法具有 RunOn\
  \ 属性为 `Called from`，因此默认情况下它们在被调用的位置运行。 | 是 |\n| 表实例方法 | 表实例方法具有 RunOn 属性为 `Called\
  \ from`，因此默认情况下它们在被调用的位置运行。标准方法 Insert/doInsert、Update/doUpdate 和 Delete/doDelete\
  \ 在数据源所在位置的 `Server` 上运行。 | 否 |\n\n\n\n## GUI 对象和报表\n\nGUI 对象始终驻留在 `client` 上。GUI\
  \ 对象包括 FormRun、FormDataSource、所有 FormControls、DialogBox 和 OperationProgress 对象。\n\
  \n报表始终驻留在 `calledFrom` 上，这意味着对象将在创建它的代码（通过调用 new 构造函数）运行的层上驻留。\n\n## 临时表\n\n临时表在数据首次插入的层上实例化并驻留，声明位置无关紧要。由于临时表的位置对性能至关重要，临时表应驻留在使用的层上。如果表在多个层中使用，则应驻留在执行插入和更新次数最多的层上。\n\
  \n## 查询\n\nQueryRun 的 RunOn 属性的默认值是 `calledFrom`。QueryRun 应始终从最初运行它的同一层提供。\n\n如果要用新的\
  \ QueryRun 替换旧的 QueryRun，则应在旧 QueryRun 执行的同一层上创建。\n\n## AOT 元素类型考虑\n\n决定代码容器类型时必须遵循以下准则：\n\
  \n| AOT 元素 | 考虑因素 |\n|---|---|\n| Class | 当满足以下任一条件时在类中编写代码：\n• 代码与多个表相关。\n• 代码与任何表都不相关。\n\
  \n当满足以下条件时创建类实例方法：\n• 在类的实例变量上工作。\n• 重写可能很有用。\n\n当满足以下条件时创建类静态方法：\n• 不需要访问类实例方法。\n\
  • 不需要重写。\n• 方法的功能与其定义的类相关。\n• 方法需要在与方法层不同的层上执行。 |\n| Table | 当满足以下条件时在表方法中编写代码：\n\
  - 它严格与表相关。\n当满足以下条件时创建表实例方法：\n- 它应该一次处理一条记录。\n当满足以下条件时创建表静态方法：\n- 它应该一次处理零条、一些或所有记录。\
  \ |\n| Global class | 当满足以下条件时在全局类中编写代码：\n- 代码不能更合逻辑地放置在另一个类（或表）中。\n- 代码是通用目的、工具扩展和应用程序中立的。\
  \ |\n| Forms and reports | 只要可能就应避免在表单或报表上编码，即除调用处理复杂布局和业务逻辑的类和表方法外。\n如果表方法中放置了编辑和显示方法，则必须避免使用它们。\n\
  如果代码无法放置在其他任何位置，即表示层最合适，则应遵守以下准则：\n- 将代码放置在数据源或数据源字段级别，而不是控件级别。\n- 通过使用菜单项从表单上的按钮调用类。例如，而不是在表单或报表上编写代码，可以在类中编写代码并从菜单项调用该类。\
  \ |\n| Maps | 当需要对少量连接字段进行分组时在映射中编写代码。 |\n| Views | 不要在视图中放置太多代码。 |\n\n## 性能优化\n\
  \n性能优化准则可分为以下三类：\n\n- 数据库设计\n- AOS 性能优化\n- 通用编程\n\n## 数据库设计\n\n数据库设计原则基于以下考虑：\n\n\
  - 通过缓存最小化数据库调用\n- 最小化数据库事务\n- 明智的索引设计\n- 以最佳方式使用 select 语句\n- 在尽可能短的时间内执行事务\n\n\
  ## 缓存\n\n只要不是绝对必要就应避免数据库访问，因为从内存中检索数据库记录要便宜得多且更快。将数据库记录记录在内存中称为缓存。服务器上可能的缓存类型如下：\n\
  \n- 记录缓存\n- 整个表缓存\n- 结果集缓存\n\n## 记录缓存\n\n记录缓存是一种性能增强技术，其中一个或一组记录是从内存而不是数据库中检索的。相对于从数据库检索，从内存中检索记录可显著改善数据访问。只有满足以下条件时才能启用记录缓存：\n\
  \n- 表中的 CacheLookup 属性应通过选择 notITTS、Found 或 FoundAndEmpty 值启用。\n- 表具有唯一索引；使用主索引或第一个唯一索引。基于\
  \ RecId（称为 RecId 索引）的索引不符合缓存索引条件。\n\n如果满足以下条件，则检索到的记录可以放入缓存：\n\n- 表已缓存，即满足上述条件。\n\
  - 用于读取记录的 select 语句在缓存键上使用相等运算符 (==)。\n- 检索记录中的所有字段。\n\n当满足以下条件时，会查找记录：\n\n- 表已缓存。\n\
  - 用于读取记录的 `select` 语句在缓存键上使用相等运算符 (==)。\n- `select` 语句位于 TTS 内或外，但表的缓存属性值不是 NotITTS\
  \ 且 `select` 不是 `forupdate`。\n\n下表总结了不同类型的缓存机制：\n\n| CacheLookup 属性 | 说明 |\n|---|---|\n\
  | None | 不会缓存数据或从缓存中检索数据。\nCacheLookup 属性此值用于以下情况：\n- 表经常更新，例如事务表。\n- 非常关键地读取最新数据。\
  \ |\n| NotITTS | 所有检索到至少一个结果的 `select` 查询将被缓存。 |\n| Found | - 对于此类型的缓存，所有基于缓存键的成功\
  \ `select` 查询都会被缓存。\n- 如果记录存在于其中，则所有 `select` 查询都将从缓存返回。\n- TTS 中的 `select forupdate`\
  \ 将始终从数据库读取并替换缓存中的记录。\n- CacheLookup 属性此值通常用于静态表，如 ZipCodes，其中记录通常存在。 |\n| FoundAndEmpty\
  \ | - 所有基于缓存键的 `select` 查询都会被缓存，即使那些不返回数据的 `select` 查询也会被缓存。\n- 如果记录存在或被标记为不存在，则所有缓存键选择将从缓存返回，如果既未标记为不存在也未检索到任何结果，则会检查数据库并相应地更新缓存。\n\
  - TTS 中的 `select forupdate` 将始终从数据库读取并替换缓存中的记录。\n- CacheLookup 属性此值通常用于注册不存在的键也很重要的表，例如折扣表。\
  \ |\n| EntireTable | - 以临时表的形式创建表的副本。\n- 对表的所有选择都将在副本上执行。\n- 包含该表的连接仅在参与连接的所有表都是\
  \ EntireTable 缓存时才对副本执行。否则将执行数据库连接。\n- 更改数据（插入、更新和删除）的操作将同时对数据库和副本执行。\n- reread\
  \ 方法将从数据库检索数据并同时更新副本数据。\n- Microsoft Dynamics AX Object Server  thin 客户端将把 EntireTable\
  \ 缓存表视为 FoundAndEmpty 缓存，并因此在访问表时在本地构建 recordCache。\n- CacheLookup 属性此值通常用于不打算经常修改的表。\
  \ |\n\n## 结果集缓存\n\nRecordViewCache 对于缓存非静态表或包含太多记录以至于其他缓存方法不切实际的表很有用。\n\n这种类型的缓存可通过\
  \ RecordViewCache 类获得。RecordViewCache 使用带有定义结果集的 where 子句的 X++ select 实例化。从技术上讲，RecordViewCache\
  \ 可以使用 X++ select 实例化，但它会在内存中创建表的副本，这可能是内存的低效使用。\n\n以下规则适用于实例化 X++ select：\n\n-\
  \ 它可能不是连接。\n- 它必须是 noFetch。\n- 表不能是临时的。\n- 运行 Dynamics AX Object Server thin 客户端时，实例化必须在服务器上进行。\n\
  \n\n\n\n结果集缓存的局限性如下：\n\n-   RecordViewCache 在 Dynamics AX 客户端之间不共享。\n-   RecordViewCache\
  \ 对象超出作用域或被销毁时，RecordViewCache 立即被停用。\n\n在某些情况下，结果集缓存可能很危险，因此仅建议谨慎使用。以下关于结果集缓存的事实有助于决定是否使用结果集缓存。\n\
  \n-   数据库会与 RecordViewCache 同时更新。\n-   在实例化时未符合结果集的行，其键的更新不会导致该行被包含在缓存中。\n-   插入操作始终包含在该表的\
  \ RecordViewCaches 中。这无疑是一个优势；然而，在向表插入大量行同时该表上存在 RecordViewCache 时应谨慎，因为这会延长缓存更新时间。\n\
  -   `delete` 会将该行从该表上的 RecordViewCaches 中移除，但不会从表中移除\n-   `Delete_from` 会使该表上的 RecordViewCaches\
  \ 无效。\n\n如上所述，RecordViewCache 可能不同步，因此我们可能需要再次重新同步它。X++ 有一个方法 `reread`，它从数据库检索数据并更新缓存副本。\n\
  \n## 索引\n\n索引设计对于数据库性能优化而言非常重要。一般来说，索引存储在与数据表不同的文件或表中。因此，搜索是通过一小部分列（仅索引列）进行的，然后数据库使用索引最终从表本身检索数据。目标如下。\n\
  \n主键或索引通常用于唯一标识一条记录。主键和外键的最初意图是表示和强制相关表之间的引用完整性。现在主键被用作表的最重要的索引，并且不一定在其他表中具有引用的外键。主键通常附加到表本身的数据空间，但并非总是如此。这取决于数据库产品。\n\
  \n非主键索引是从一个或多个表列构造的索引。非主键索引可能包含也可能不包含主键索引列。非主键索引的目的是提高数据库访问性能。这些索引将在数据库内创建为单独的文件。因此，在搜索这些索引时，只会将少量列加载到内存中进行搜索。这些索引具有指向表数据空间的虚拟内存地址，从而允许索引空间与表空间之间快速访问。\n\
  \n请注意，索引所需的内存或缓存空间远小于数据表，因为索引表的行长度更小。其原因在于，与数据表相比，索引的列数更少。因此，在内存/缓存与磁盘之间进行页面交换时，由于索引比数据表小，一次可将更多页面加载到内存中，从而索引可以比数据表空间快得多地遍历。不同数据库的处理方式不同。\n\
  \n有不同类型的索引可用。\n\n索引可以是唯一的或非唯一的。唯一索引通常用作主键（并非总是如此），而非唯一索引包含重复项，通常用于数据库访问。\n\n聚簇索引通常是哈希或\
  \ B 树算法的数据表空间形式。聚簇索引将表的实际数据表行聚类或分组，其中实际数据行驻留在索引的叶页面中。\n\n非聚簇索引将索引的叶页面设置为指向包含表中行的數據页面的指针。\n\
  \n任何类型的索引都可以按升序或降序排列。升序索引是常见做法。\n\n现在很明显，索引并不会使每个数据库操作都变快；由于除了表之外还需要更新索引文件，读写以外的操作甚至会因索引而变慢。\n\
  \n## 要索引的内容\n\n为了在避免或最小化索引缺点的前提下发挥索引的最大益处，应仔细决定索引什么或不索引什么。以下是经验法则：\n\n在频繁执行查询的地方使用索引：\n\
  \n-   列用于连接。\n-   列用于 where 子句或 group by。\n-   列用于 order by 子句。\n-   当被分组的值范围相对于所选表中的行数较小时，通过索引可以增强\
  \ group by 子句。\n\n索引会降低插入和更新的性能，有时甚至大幅下降。以下是一些此类情况：\n\n-   行数较少的表\n-   静态表\n-  \
  \ 值范围很广的列\n-   频繁更改且数据访问量低的表\n-   列未在数据访问查询 `select` 语句中使用\n-   没有固定宽度或数值数据列可供索引的表，或未对该列进行索引\n\
  \n## 索引类型\n\n有几种类型的索引，每种都有其自身的优点和缺点。聚簇索引是在表本身中创建的索引，而不是在单独的索引文件中，因此使用这种类型的索引，整个表会按索引列排序。这是聚簇索引与非聚簇索引之间的主要区别。在非聚簇索引中，索引是在一个或多个列上创建的，然后列值被引用到表中的记录。因此，在非聚簇索引中主要进行两个操作，即在索引中定位键，然后在表中定位引用的记录，而聚簇索引则不同，可以直接搜索记录。由于这一事实，聚簇索引比非聚簇索引是更好的选择，因此如果只需要一个索引，建议使用聚簇索引，或者最频繁使用的列或主键应为聚簇索引。\n\
  \n聚簇索引也有一些缺点。当更新操作更改索引列的值时，本质上需要两个操作，即从先前位置删除，然后根据更新后的值在下一个位置插入。\n\n复合索引是对两个或多个列的索引，可以是聚簇的也可以是非聚簇的。通常不建议使用复合索引，除以下情况外：\n\
  \n-   覆盖查询：覆盖查询中的所有列，以便数据库无需在数据库中搜索引用，只需扫描列即可达到目的。\n-   满足特定的（复杂）搜索条件，例如主键本身就是两个或多个列的组合。\n\
  \n## 索引的一些提示：\n\n| Category | Tips |\n|---|---|\n| 表列选择 | -   应选择易于索引的列。\n-   数值比字符串更容易索引，因此对整数值的索引要快得多。\n\
  -   如果需要在字符串字段上创建索引，则应为定宽，而非 `varchar` 等。\n-   切勿基于日期创建索引。\n-   Dynamics AX 为大多数表自动生成\
  \ `RecID`。如果没有其他列符合条件，对该列进行索引是明智的。 |\n| 需包含在索引中的编号列（用于构成复合键） | -   尽量减少复合键的使用。如果没有其他单个列符合条件，RecId\
  \ 可以是索引的良好选择。\n-   索引中的列数应尽可能少，以便搜索条件尽可能简单。\n-   复合键建议最多包含三列。 |\n| 索引数量 | -   表上的索引数量没有上限。然而，建议将索引限制在\
  \ `select` 查询的 `where` 子句中频繁使用的列上。\n-   索引过多会减慢整体操作，因为一次插入或更新操作会导致多次插入或更新操作，因为除了表之外，每个索引文件都需要进行插入或更新。\
  \ |\n| 索引列大小 | 索引所基于的列或列组合称为键。键的大小应尽可能小，以发挥索引在性能优化方面的优势。键大小可以通过以下方式减小：\n-   在索引中使用最少的列数\n\
  -   使用用作索引键的列的最小数据大小\n-   使用数值键代替其他数据类型，如 varchar、字符串等。 |\n| 不同的索引键 | 应选择索引键，使键的重复值最少。最佳情况是键是唯一的。\
  \ |\n\n\n\n\n## Select Statements\n\n以下是关于使用 `select` 语句的最佳实践：\n\n- 使用 `joins` 代替多个嵌套的\
  \ `while` selects。\n- 在适用时使用字段列表。\n- 在适用时使用 `select` 或聚合函数。\n- 使用 `delete_from`（而不是\
  \ `while`、`select`、... `delete()`）。\n- 在可能的情况下从缓存中选择。\n\n## Transactions\n\n关于数据库事务的最佳实践的关键原则是，数据库事务的数量应最小化，并且所需的事务应在最短时间内执行并且必须避免死锁。因此可以得出以下最佳实践：\n\
  \n- 在事务内部绝不要等待用户交互。\n- 如果必须执行多个操作才能使数据恢复到一致状态，请在一个事务中执行所有操作。\n- 使事务尽可能短小，以避免死锁和大的回滚日志。\n\
  - 避免死锁或长时间锁定。始终明确地按特定顺序（最好是键的顺序）在表中选择要更新的记录，在整个应用程序中每次都如此。从不同表中选择要更新的记录时，在整个应用程序中每次都按相同顺序进行。\n\
  - 如果记录未被更改，则不要写入或更新。\n- 为避免对常用记录进行长时间锁定，进一步建议以下最佳实践：\n  - 使用 **乐观并发控制 (OCC)**。\n\
  \  - 对代表应用程序瓶颈的中央、常用（已更新）记录进行更新锁定。\n  - 尽量避免在事务内部更新常用记录。\n  - 设计结构以便可以使用插入代替更新。插入不会锁定对象。\n\
  \  - 将用于更新的 `select` 语句尽可能靠近 `ttsCommit` 语句，以减少记录被锁定的时间。\n\n## Use Joins in Forms\n\
  \n`join` 在表单中的使用与使用包含 `select` 查询的显示方法相比可以提供明显的优势。一次调用即可获取所有记录，用于显示大约二十行网格的表单。使用\
  \ `join` 的另一个优点是，对连接字段进行排序、过滤和查找非常容易。\n\n## AOS Performance Optimization\n\nAOS\
  \ 优化背后的关键原则是最大限度地减少客户端和服务器之间的调用次数。每次调用传输的数据量是次要的，调用次数更为重要。一些最佳实践如下：\n\n- 实现选择折扣。\n\
  - 使用容器减少客户端或服务器调用。\n\n## Achieve Select Discount\n\n每当需要从位于另一层的数据源执行 select 语句时，返回的记录具有一定的最小大小，这意味着可以在一次调用中获取多条记录，因此对于给定数量的记录，需要的往返\
  \ AOS 调用更少。这种现象被称为 'Select Discount'。\n\n如果只需要获取一条记录，则记录数可以最小化为仅第一条记录。\n\n## Using\
  \ Field Groups in Tables\n\n字段组是 Dynamics AX 设计中的一个重要功能，不仅用于在添加、删除或修改表的任何字段时将表单和报表与相关表同步，还用于缓存和性能优化等许多其他目的。以下是使用字段组在表中的一些优点：\n\
  \n- IntelliMorph 可以在对字段组进行任何更改时自动更新所有相关表单和报表的布局。\n- 升级具有与标准表相同字段组的新表单和报表很容易，即标准字段组中的自定义对象在升级版本中也会得到更新。\n\
  - 可以使用字段序列来确定表单和报表中字段的序列，因此可以确保与表相关的所有表单和报表中字段的顺序相同。\n- 表和表单上相同的字段组有助于 AOS 优化。\n\
  \n## Maintaining Auto Property Settings\n\n在 Dynamics AX 中，许多属性的值应设置为 Auto，这可以使应用程序对象根据内核对各种事物（如区域设置等）的解释自动适应任何更改。Auto\
  \ 属性设置的一些优点如下：\n\n- 根据客户端的区域设置自动选择日期和时间格式\n- 自动选择货币代码\n- 根据登录用户的可用权限控制表单或报表布局\n\n\
  ## Shared Standards\n\n一些 Dynamics AX 自定义最佳实践适用于任何 AOT 元素。这些标准包括 X++ 标准、命名约定、标签标准和帮助文本指南。\n\
  \n## X++ Standards\n\n本节讨论与 X++ 语言相关的一些最佳实践。遵循此标准可带来执行时间改善、升级和进一步自定义的便利性、面向对象概念的高效使用、代码可读性更好等。一些一般原则如下：\n\
  \n- 变量、常量或参数声明应尽可能局部化，以高效利用内存资源。\n- 应在开始时检查错误条件，以便对操作和操作回滚所做的工作最少。这也有助于阻止拒绝服务攻击。拒绝服务攻击是试图通过太多垃圾请求使系统超负荷，从而使授权用户无法获得服务。\n\
  - 作为值提供的参数不得被修改或操作，否则可能增加在其他地方使用错误值几率。\n- 代码应以干净的方式编写，这意味着应从代码中删除未使用的变量、方法和类。\n\
  - 应尽可能使用现有的 MorphX 函数或功能（除非其他最佳实践阻止你这样做），而不是创建新功能，因为这样可以使升级更容易。\n- 用户不应遇到运行时错误。所有可能的情况都应预见并相应处理。如果运行时出现某些不可预测的情况，应在\
  \ Infolog 中显示错误，并附带帮助用户避免该情况以及可采取什么措施防止它的消息。\n\n### Best Practices – Technical\n\
  \n- `this` 变量的值不应被更改。\n- 应最大化可重用性。例如，而不是在不同地方重复代码行，可以编写一个单一方法，以便对该方法的更改可以在使用该方法的所有地方得到体现。\n\
  - 应该只有一个成功的返回点（switch 语句除外），以便可以确保对象删除等操作。\n- 方法应执行单一明确定义的任务，并根据所执行任务命名。\n\n## Text\
  \ Constant Standards\n\nDynamics AX 中使用的所有文本都应放在标签文件中，无论其用途如何，例如用户界面或错误或成功消息。文本常量的使用可分为两大类，即用户界面文本和系统导向文本。\n\
  \n用户界面中使用的文本应遵循以下最佳实践：\n\n- 修改应用程序中扩展数据类型或基础枚举的属性值。\n- 切勿创建重复的标签文件，即相同的文本（同一种语言）但不同的标签文件。\n\
  - 在自定义文本时可以创建新的标签文件，但始终建议重用标准标签。然而，这可能带来一个缺点——每当升级发生时，对 SYS 层标签文件所做的所有更改都会丢失。因此，是否自定义现有标签文件或创建新标签文件的决定应谨慎做出。\n\
  - 用户界面文本（标签文件）应使用双引号。\n\n系统导向的文本常量必须使用单引号。\n\n## Exception Handling\n\n异常处理的原则用途包括释放系统资源（例如通过对象删除释放内存、关闭数据库连接等）以及在\
  \ Infolog 中提供建设性信息，以便用户可以防止此类错误情况。以下是与异常处理相关的一些推荐最佳实践：\n\n- 应始终在可能导致死锁的数据库事务周围创建\
  \ `try` 或 `catch` 死锁或 `retry` 循环。\n- 在 `retry` 子句中，瞬态变量的值应恢复为 `try` 之前的值。\n\n\n\n\
  ## Branching\n\n一些关于 `if-else` 语句和 `switch` 语句的推荐最佳实践如下：\n\n- 始终使用正向逻辑，例如写 `if (true)`\
  \ 而不是 `if (! false)`。\n- 优先使用 `switch` 语句而不是多个 `if-else` 语句。\n- 除非有意使用 fall through\
  \ 机制，否则应始终以 `break` 或 `return` 或 `throw` 语句结束一个 case。当使用 fall through 机制时，应给出类似\
  \ `//fall through` 的注释，以便每个读者都能清楚明白。\n\n## Code Layout\n\n为了提高代码的可读性，代码应以适当的布局编写。代码布局的一些主要最佳实践如下：\n\
  \n- 在发布代码前移除注释掉的代码。\n- 遵循缩进规则。\n- 遵循命名类、方法、表等的大小写规则。\n\n## Methods\n\n以下是方法的一些最佳实践：\n\
  \n- 方法应小而逻辑清晰，以便于轻松重写或覆盖。\n- 方法应执行单一明确定义的任务，并且从其名称即可清楚任务内容。\n- 对于静态类方法和表方法，应以最小化对其他层调用的方式使用限定\
  \ `client`、`server` 或 `client server`。更多细节请参阅《开发者指南》中的 *Best Practices for Designing*\
  \ 部分。\n- 为确保可信度，应分配适当的访问级别（public、private 或 protected）。\n- 方法应根据 Dynamics AX 命名约定命名；保留关键字如\
  \ *is*、*check*、*validate*、*set*、*get* 和 *find* 应按照 Dynamics AX 使用这些标准方法或函数的方式使用。所有使用此类关键字的方法不得产生副作用，例如\
  \ validate、check、get 或 is 方法中不得进行赋值。\n- 参数名称必须以下划线 (`_`) 字符开头，同时遵循其他通用命名约定。\n\n\
  ## Handling Dates\n\n日期因日期呈现格式的差异以及时区差异导致的值差异而成为错误来源。处理日期的几个最佳实践如下：\n\n- 日期字段必须仅存储或显示在日期字段中，因为\
  \ **IntelliMorph** 具有在日期格式属性选择为 **Auto** 且以日期控件呈现时以适合用户格式显示日期值的能力。\n- 系统日期不应被视为可靠信息，但在某些情况下（如用户输入信息的验证），系统日期应使用\
  \ `SystemDateGet()` 函数读取，而不是 `today()` 函数。\n- 应避免日期转换，因为它会丢失日期属性，因此有时转换可能导致错误信息。对于所有与用户界面相关的情况，应使用\
  \ strFmt 或 date2Str，并将所有格式化相关参数的值设为 **-1**。这将允许用户以区域设置中指定的格式使用此信息。还应注意，存储转换后日期信息的字符串变量应足够长。\n\
  \n## Label Standards\n\n强烈建议使用标签定义任何用户界面文本。这将在翻译过程中确保许多优势。以下是一些标签文件标准，以确保标签文件系统的真正优势：\n\
  \n- 标签文件的位置应尽可能通用，即扩展数据类型（EDT）。在某些情况下，仅因标签文本不同而无法使用现有 EDT。在这种情况下，应通过扩展现有 EDT 创建新的\
  \ EDT。在这种情况下，也可能有其他替代方案（例如在字段处更改标签），但经验法则是将标签用于最通用位置。\n- 标签文件不应重复，即不应为同一文本存在两个标签文件。\n\
  \n## AOT Object Standards\n\nAOT 对象标准特定于某个 AOT 元素。我们可以大致将 AOT 元素分类如下：\n\n- Data\
  \ Dictionary\n  - Extended data type\n  - Base Enum\n  - Tables\n  - Feature keys\n\
  \  - Table collection\n- Classes\n- Forms\n- Reports\n- Jobs\n- Menu items\n\n##\
  \ Data Dictionary\n\n这是一组 AOT 对象，包括上一节提到的项目。表的最佳实践可进一步细分为字段、字段组、索引、表关系、删除操作和方法方面的最佳实践。\n\
  \n## Extended Data Type\n\nEDT 在 GUI 元素中发挥重要作用，因为它是 GUI 元素的基本实体。以下是与扩展数据类型相关的一些基本最佳实践。\n\
  \n- 所有日期和日期格式相关属性都应设置为 Auto。\n- 帮助文本不应与标签属性相同。帮助文本应更具描述性，并能够解释原因和/或方法。\n- EDT 名称必须是真实世界的名称，如果仅属于一个模块，则应以模块为前缀。\n\
  \n## Base Enum\n\n以下是与基础枚举相关的一些基本最佳实践：\n\n- 枚举名称应表示可能的几个值或值的类型。例如 DiscountType、OpenClose\
  \ 等。\n- 显示长度属性应设置为 auto，以便在每种语言中都能显示完整名称。\n- 帮助和标签属性必须具有值。帮助和标签属性不应具有相同的值。\n\n##\
  \ Tables\n\n表的许多最佳实践属于性能优化、数据库设计标准等范围，因此这些标准已在其他地方讨论。一些未讨论的标准在此讨论。\n\n- 表名可能包含以下有价值的信息：\n\
  \  - **Prefix**：模块名称，例如 Cust 代表应付账款，Sales 代表应收账款\n  - **Infix**：内容的逻辑描述\n  - **Post\
  \ fix**：数据类型，例如 Trans（交易）、Jour（日记账）、Line（包含表头表中特定记录详细信息的表）、Table（主要主表）、Group、Parameters、Setup\
  \ 或表所属的模块名称\n- Label 是强制属性，表必须仅使用 Label ID 进行标记。Label ID 的文本值在所有受支持语言中必须唯一。\n- 如果表属于\
  \ Parameter、Group、Main 或 WorksheetHeader 四种类型之一，则必须具有关联的表单来维护表记录。该表单应具有与其显示菜单项（用于启动该表单）相同且与表名相似的名称。formRef\
  \ 是表用于关联表单名称的属性。\n- 应提及标题字段 1 和标题字段 2：\n  - **TitleField1**：表中记录的键字段。如果键是用户的信息，则应为描述性标题。\n\
  \  - **TitleField2**：表中记录的描述。\n\n## Fields\n\n字段的大多数属性都继承自扩展数据类型；然而，对于此类属性，使用部分或全部继承值并非强制。以下是一些指导原则：\n\
  \n- Name：应与对应的 EDT 名称相似，但如果单独命名，则应合乎逻辑。用作键的字段应以 ID 为后缀，例如 CustId、ItemId 等。\n- HelpText：这是一个强制属性，并继承自对应的\
  \ EDT。由于帮助文本需要根据同一 EDT 的不同用途进行自定义，帮助文本可在任何字段中修改，但以下为指导原则：\n  - 帮助文本属性不应与标签属性相同。\n\
  \  - 标签也是一个强制属性，继承自 EDT。如果在此处设置值，则应与 EDT 上的值不同。\n  - 每个主键或关键强制属性之一的字段必须设置为 Yes。\n\
  \  - 在考虑 memo 或容器类型字段之前，应记住它们会增加应用程序和数据库获取的时间，它们会抑制数组获取，并且此类字段不能在 where 表达式中使用。\n\
  \n## Field Group\n\n字段组是在用户界面中显示的字段组。Dynamics AX 有一些标准组（例如 Identification、Administration、Address、Dimension、Setup、Misc\
  \ 等），同时也可以创建其他组。逻辑上属于一起的字段可以放在一个字段组中，而 Misc 字段组可用于对不适合任何其他字段组的字段进行分组。维度字段组必须具有单一类型的\
  \ Dimension 字段。字段组应在数据库和表单或报表中具有相同类型的分组，以提高缓存性能。\n\n## Delete Actions\n\n数据库完整性是关系数据库管理系统（RDBMS）的主要原则之一。删除操作应在两个表之间的每个关系上使用。以下是删除操作的关键最佳实践\n\
  \n- 在两个表之间的每个关系上使用删除操作。\n- 使用表删除操作，而不是编写代码来指定删除是受限还是级联。\n\n\n\nDynamics AX 有三种类型的删除操作；选择其中一种完全取决于自定义需求。\n\
  \n## 表方法\n\nDynamics AX 中的表具有多个属性，例如 delete、validateDelete 等，因此 Dynamics AX 建议您不要编写方法或\
  \ X++ 代码来实现仅通过设置属性值即可完成的功能。\n\nDynamics AX 建议对无法通过表属性设置满足的自定义需求使用内置表方法。其中一些表方法是必须实现的，例如\
  \ find 和 exists 方法。\n\n## 类\n\n类的一个特点是它们可能同时具有后端（数据库）和前端（GUI）。前端界面应易于使用，同时尽可能安全。类的实现细节应始终对用户隐藏，因此建议使用私有或受保护的方法。后端方法高度安全、标准化且可靠，因此在规定的设计模式中建议使用私有或受保护的方法。设计模式取决于类的类型。类可以分为以下类别：\n\
  \n- 真实对象\n- 操作类\n- 支持类\n\n以下是在声明方面常见的一些最佳实践：\n\n- 对象成员变量只能用于保存对象的状态，即在实例方法调用之间和之外应保持其值的变量。\n\
  - 必须尽量减少全局变量的使用。\n- 必须清理未使用的变量；可使用 Add-Ins | Best Practices | Check Variables 处的工具来了解未使用的变量。\n\
  - 在一个类（或子类）中的多个方法中使用的常量应在类声明期间声明。\n\n类有一套丰富的最佳实践，微软发布的《Microsoft Dynamics AX 开发最佳实践》是一本很好的读物。\n\
  \n## 表单\n\n在任何三层架构系统中，表单都位于表示层。它们大多数与外观或布局相关，我们将在第 4 章 *最佳实践 – GUI* 中讨论。表单的其他一些最佳实践围绕以下特征展开：\n\
  \n- 最大化使用 IntelliMorph\n- 不强制日期或时间格式\n- 不强制布局，例如标签的固定宽度、GUI 控件的位置控制等。\n- 对 GUI 文本使用标签文件\n\
  - 表单具有最少的编码\n\n### 避免在表单上编码\n\n三层架构的基本概念是表单应仅用于表示层，因此不应在表单上存在其他代码，例如业务逻辑。放置在表单上的代码也会降低其可重用性和进一步定制的便利性；例如，如果您想开发企业门户，表单上编写的代码将需要在类或表方法等中重写，这会使实现变得复杂。另一个例子可能是当您想“COM\
  \ 启用”您的业务逻辑时；与业务逻辑相关的表单代码会让您的生活几乎不可能。\n\n在表单上编写的任何代码（除表示逻辑外）都会对性能造成限制，因为不同层之间的调用会增加，从而降低性能，因此应尽可能避免在表单上编写代码。在无法避免在表单上编写代码的情况下，应使用下表中总结的指南来编写表单上的代码。\n\
  \n| 编写代码的位置 | 指南 |\n|---|---|\n| 表单级别 | 当代码与整个表单相关时 |\n|  | 当代码与多个数据源相关时 |\n|  |\
  \ 编辑器或显示方法（仅与任何数据源无关的那些） |\n| 数据源 | 与数据源相关的编辑或显示方法 |\n|  | 仅与数据源相关的代码，无法有效放置在表方法中\
  \ |\n| 控件 | 当它严格与控件相关时 |\n\n### 最大化使用 IntelliMorph\n\n由于用户的区域设置或首选格式，表单可能以不同的语言和/或不同的日期、时间或货币格式呈现。Dynamics\
  \ AX 最佳实践建议将以下显示属性的值设为 **Auto**：\n\n- 日期\n- 货币\n- 时间\n- 语言\n- 数字格式（如小数运算符、分隔符等）\n\
  - 标签大小\n- 表单大小\n\n经验法则是将各种属性保持为 **Auto** 或默认值，这将有助于 IntelliMorph 最大化发挥作用。有关最佳实践的更多详细信息，建议读者阅读《最佳实践开发者指南》。\n\
  \n## 报表\n\n报表的一个特殊事实是它们是输出媒体，其中纸张大小、用户关于区域设置或语言的配置、字体大小等外部环境很重要。\n\nDynamics AX\
  \ 建议使用“Auto Design”来开发报表，因为这类报表可以根据外部环境变量更改布局。另一种在 Dynamics AX 中开发报表的方式是“Generated\
  \ Design”；这种设计类型仅在需要严格的报表布局时才推荐。一些此类示例可能是监管报表、财务报表等。\n\n## 摘要\n\n在本章中，我们讨论了通过采用最佳实践可以提高质量的各个领域。我们还讨论了各种最佳实践、最佳实践背后的理论以及如何采用这些最佳实践，即提供实用技巧。\n"
- '## 4 最佳实践—GUI


  用户界面在 ERP 系统的可用性中发挥着至关重要的作用，并影响用户的工作效率。Dynamics AX 的用户界面标准主要基于以下标准：


  - Dynamics AX 用户帮助最佳实践

  - Windows 用户体验指南


  Dynamics AX 用户界面标准的目标是确保与核心 Dynamics AX 应用程序的一致性，并最大限度地减少对 Dynamics AX 默认设置的覆盖。


  我们将讨论如何实现上述目标以及需要遵守的最佳实践。阅读本章后，以下主题将变得清晰：


  - 各种 GUI 最佳实践

  - 对 GUI 最佳实践偏离的文档记录


  ### 窗口和屏幕布局


  该标准的目标是在 Dynamics AX 和其他 Windows 应用程序之间提供通用性。实现这一目标可确保轻松管理 Dynamics AX 应用程序的不同窗口；因为用户在使用其他
  Microsoft 应用程序（如 MS Office、Outlook 和 Internet Explorer 等）时通常了解 Microsoft 对窗口的标准。


  | 序号 | 检查点 | 预期结果 |

  |---|---|---|

  | 1.1 | 是否有任何窗口可以通过除调整大小按钮以外的任何方式调整大小？ | 否 |

  | 1.2 | 是否有任何表单在网格调整大小时会被调整大小？ | 否 |

  | 1.3 | 是否有任何窗口在用户从表格视图更改为树视图或反之时会被调整大小？ | 否 |

  | 2 | 是否有任何窗口无法适应 1024*768 像素的 SVGA 显示？ | 否 |

  | 3 | 是否有任何窗口在默认大小时需要水平滚动？ | 否 |

  | 4 | 是否有任何窗口正好打开在已打开窗口的顶部？（如果提供充分理由，测试人员可以忽略此标准。） | 否 |

  | 5 | 是否有任何窗口无法调整大小？ | 否 |


  ### 导航窗格要求


  导航窗格的 GUI 标准是为了确保导航窗格的使用方式与其他 Microsoft 应用程序（如 Outlook 等）相同。


  | 序号 | 检查点 | 预期结果 |

  |---|---|---|

  | 1 | 导航窗格必须以应用程序窗口的特定百分比显示。如果用户调整窗口大小，导航窗格必须自动调整大小以保持百分比恒定。是否遵循此标准？ | 是 |

  | 2 | 导航窗格必须具有以下两个部分：

  - 收藏夹

  - 主菜单

  是否遵循此标准？ | 是 |


  ### 收藏夹


  收藏夹菜单是导航窗格上的一个部分。核心 Dynamics AX 中未在收藏夹菜单上添加任何项目，但只要满足以下条件即可添加收藏夹项目：


  | 序号 | 检查点 | 预期结果 |

  |---|---|---|

  | 1 | 在收藏夹中包含最多七个项目。此标准是否遵循？ | 是 |

  | 2 | 不得使用超过两级的嵌套（缩进）。此标准是否遵循？ | 是 |

  | 3 | 在收藏夹下分组项目的标准必须是 **任务类型**。此标准是否遵循？ | 是 |

  | 4 | 必须为收藏夹使用清晰、简洁且易于理解的名称。不得使用晦涩的缩写或行话。此标准是否遵循？ | 是 |


  ## 主菜单


  主菜单在导航到各种表单、报表等时发挥着关键作用。它设计成能够提高可用性（通过结构化导航），并缩短导航路径（即减少到达各种表单/报表所需的平均点击次数）。为了保持这些特性，任何定制都必须符合以下规范：


  | 序号 | 检查点 | 预期结果 |

  |---|---|---|

  | 1 | 菜单开头（针对任何模块）的表单数量是否超过六个？ | 否 |

  | 2 | 是否有任何菜单，其开头显示的表单使用频率较低？ | 否 |

  | 3 | 是否有任何文件夹图标的名称不同于 Journals、Inquiries、Reports、Periodic 和 Setup？ | 否 |

  | 4 | 文件夹图标是否按 Journals、Inquiries、Reports、Periodic 和 Setup 的顺序出现？ | 是 |

  | 5 | 是否有任何文件夹包含超过六个表单？（不包含任何表单的文件夹是可以接受的。） | 否 |

  | 6 | 主菜单中是否有任何节点的缩进级别超过 5？ | 否 |

  | 7 | 是否有任何菜单图标与 Dynamics AX 标准不一致？ | 否 |

  | 8 | 如果用户点击主菜单上的表单图标，请确保同一表单图标出现在新窗口的左上角。是否有任何窗口未遵循此标准？ | 否 |

  | 9 | 是否有任何表单图标，其标题与对应表单上的标题不同？注意：表单标题右侧可能包含额外字符串，但它必须以表单图标中提到的标签字符串开头。 | 否 |

  | 10 | 是否有任何表单不能通过单击表单图标打开？注意：有时点击图标后打开表单可能需要时间，建议测试人员耐心测试。 | 否 |

  | 11 | 双击表单图标是否会打开两个相同的表单？ | 否 |


  ## 任务窗格要求


  任务窗格（如果选择显示）在应用程序窗口右侧出现。其缺点是它减少了内容窗格的空间，因此许多用户选择不显示它。因此，UI 规范建议以用户无需选择它即可完成任务的方式使用任务窗格。任务窗格的几种建议用途可能是显示搜索结果、帮助内容等。必须遵守以下规范，以确保用户无需使用任务窗格即可完成任何任务：


  | 序号 | 检查点 | 预期结果 |

  |---|---|---|

  | 1 | 任务窗格必须用于呈现有用但非必需的信息。任务窗格不得用于显示通知或对用户任务至关重要的信息。此标准是否遵循？ | 是 |

  | 2 | 任务窗格不得用作对话框或用于设置选项。此标准是否遵循？ | 是 |

  | 3 | 任务窗格不得用作与内容窗格竞争的次要工作区。内容窗格是显示与应用程序任务相关联的表单和窗口的主要工作区。此标准是否遵循？ | 是 |

  | 4 | 任务窗格不得用于呈现使用户困惑的过量信息。此标准是否遵循？ | 是 |

  | 5 | 任务窗格不得用于显示特定于当前所选表单或窗口的内容。任务窗格应显示适用于应用程序的一般信息或具有周边用处的信息。此标准是否对每个窗口都遵循？ | 是
  |

  | 6 | 考虑使用向导或替代内容格式来呈现信息或指导。是否有任何窗口未遵循此标准？注意：这是一个建议，因此在有充分理由的情况下可以忽略此检查点。 | 否 |


  ## 表单


  精心设计的表单对可用性贡献最大，因为用户大部分时间只处理表单。Dynamics AX 将表单分为三类，所有用户界面规范必须符合特定表单类别。


  | 序号 | 检查点 | 预期结果 |

  |---|---|---|

  | 1 | 表单必须属于三种标准表单类别之一，即两个选项卡控件（即 标题-行）、一个选项卡控件或功能窗口。不允许在单个表单中组合上述类别。是否存在此类表单？ |
  否 |

  | 2 | 是否有任何双选项卡控件表单不包含可移动分隔符以将表单拆分为标题和行？ | 否 |

  | 3 | 表格上方的区域必须为空白或应包含一个或多个与表格中显示记录的常用筛选器或呈现格式相关的控件。是否有任何表单忽略了此标准？ | 否 |

  | 4 | 是否有任何筛选控件用于根据组标题筛选记录？ | 否 |

  | 5 | 表格的筛选条件不得在同一选项卡控件下的选项卡中提供。例如，包含表格的选项卡控件不得包含控制表格筛选的筛选选项卡。是否有任何表单忽略了此标准？ | 否
  |

  | 6.1 | 非活动筛选条件必须为空白。是否有任何表单忽略了此标准？ | 否 |

  | 6.2 | 是否有任何复选框可用于激活或停用筛选控件？ | 否 |


  ### 最佳实践 – GUI


  | 序号 | 检查点 | 预期结果 |

  |---|---|---|

  | 7 | 表格下方区域必须为空白或应包含以下任一项：行扩展控件 表格的相关汇总，例如列总数 行扩展控件包含属于当前所选行的信息。行扩展控件必须用于显示所有相关字段，否则需要水平滚动才能显示所有相关字段。行扩展只能用于用户垂直扫描对应列不相关的字段。是否有任何表单忽略了此标准？
  | 否 |

  | 8.1 | 列总数必须对数据库中的整列求和，而不仅仅是对可见部分求和。如果列的筛选器处于活动状态，则总数应针对受筛选条件控制的记录计算。是否有任何表单忽略了此标准？
  | 否 |

  | 8.2 | 列总数必须对数据库中受筛选器控制的整列求和。是否有任何表单忽略了此标准？ | 否 |

  | 9 | 在表格的默认外观中，不得存在水平滚动。是否有任何表单忽略了此标准？ | 否 |

  | 10 | 类型 1 和 2 的表单（在表单的检查点 1 中描述）不得包含 OK、Cancel 或 Help 按钮。是否有任何表单忽略了此标准？ | 否 |

  | 11.1 | 表单上的按钮必须放在右侧的列中。是否有任何表单忽略了此标准？ | 否 |

  | 11.2 | 按钮不应特定于选项卡。是否有任何表单忽略了此标准？ | 否 |


  ## 编辑控件


  以下是编辑控件的规范。所有编辑控件包括禁用的编辑控件必须符合这些规范。


  | 序号 | 检查点 | 预期结果 |

  |---|---|---|

  | 1 | 是否覆盖了默认编辑标签？ | 否 |

  | 2 | 不得使用固定标签。换句话说，窗口中的所有静态文本（标题、说明、编辑控件标签等）必须取自 Dynamics AX 标签文件系统以便于本地化。是否有任何编辑控件忽略了此标准？注意：这可以在
  Dynamics AX 最佳实践检查工具期间检查，因此在此可以忽略此检查点 | 否 |




