  | 责任 | 测试员。 |\n| IBI 参考 | 8.7 |\n\n## 摘要\n\n在本章中，我们研究了所有推荐的测试类型、其目标、执行技术、预期结果、完成标准以及每个由\
  \ IBI 或作者推荐的测试类型的特殊考虑（如有）。这将确定所执行各种测试类型的范围和愿景。\n\n每种测试类型也映射到相应的 IBI 参考。这将使 IBI 合规性监控变得容易。\n\
  \n对于任何类型的测试，都必须在软件测试的适当阶段执行。各种测试阶段、其进入和退出标准等将在下一章中讨论。\n"
- "## 7 测试生命周期\n\n在上一章中，我们讨论了适用于 Dynamics AX 定制项目的各种测试类型。为了充分发挥所有测试的最大效益并优化工作量从而降低成本，必须在适当的时间进行所有测试。\n\
  \n要了解各种测试类型的最佳顺序，我们需要仔细理解测试生命周期、测试中的各个测试阶段，以及测试在进入和退出测试阶段的进入和退出标准。\n\nDynamics AX\
  \ 定制的测试生命周期具有一些独特特征，这源于 Dynamics AX 产品本身的固有特性以及它是一个定制过程而非完整的软件开发。\n\n## 测试方法\n\n\
  为了优化工作量并更好地管理测试活动，我们需要对各种测试类型进行分组。每个测试组应在软件测试和开发生命周期中具有共同的开始和结束点。开始和结束点之间的活动称为测试阶段。对于\
  \ Dynamics AX 定制项目，测试应以覆盖以下阶段的所有测试类型的方式进行：\n\n| 序号 | 测试阶段 | 应执行的测试类型 |\n|---|---|---|\n\
  | 1 | 单元 | 独立部件/单元的单元测试。 |\n| 2 | 模块 | 模块或功能的业务功能测试，对编码标准的合规性检查，对设计和架构指南的合规性检查，帮助导航测试，用户体验和可用性测试，商业智能或报告标准的验证。\
  \ |\n| 3 | 系统测试 | 性能测试，安全测试，全球化测试，本地化测试，平台兼容性测试，对 ISV 标准的合规性验证，备份和恢复，可扩展性。 |\n|\
  \ 4 | 回归测试 | 整个功能的业务功能测试，授权测试。 |\n| 5 | 发布测试 | 安装测试。 |\n| 6 | 用户验收测试 | 由提出需求的用户对交付的功能进行验收。\
  \ |\n\n## 入口和出口标准\n\n由于推荐采用分阶段方法进行 Dynamics AX 定制测试，应为软件测试的每个阶段定义进入和退出标准。你可能会认为软件测试阶段的退出标准应为后续软件测试阶段的进入标准；然而，这是不正确的。请考虑以下示例：\n\
  \n系统测试的一个进入标准是“本阶段需要执行的测试用例或脚本已准备就绪”，除模块测试的退出标准外。\n\n## 单元测试的入口标准\n\n单元测试是根据最终确定的需求和设计验证功能的一项活动。只有在需求得到同意和批准后，才能充分发挥单元测试的效益。因此，以下内容应被视为单元测试的入口标准：\n\
  \n- 与正在测试的需求相关的功能规范已冻结。\n- 技术设计文档已完成、批准并发布。\n- 系统设计已记录、批准并发布。\n- 查询或问题登记中没有与正在测试的需求相关的项目。\n\
  \n## 单元测试的出口标准\n\n只有在代码按照需求完成并符合设计标准后，单元测试才应被视为完成——所有代码已清理（即删除未使用的代码、变量和标签文件），并且代码文档（AOT\
  \ 文档、注释等）已完成。简而言之，代码应足够好以发布给内部客户，即测试团队。单元测试的出口标准如下：\n\n- 单元测试已通过。\n- 代码在正在测试的需求方面已完成，即没有缺失的功能或元素。\n\
  - 代码文档已完成，即注释和作业说明。\n- 按照测试方法部分，已尽可能删除 Dynamics AX 最佳实践错误和警告。这是可选标准，因为有时此测试由测试团队在模块测试下执行。\n\
  - 已完成三层架构的代码优化，最佳实践工具未显示与代码性能优化相关的任何错误。\n- 创建所有标签文件并删除未使用的标签文件，包括所有信息日志、警告等。\n-\
  \ 已删除未使用、无法到达和冗余的代码。\n- 成功执行单元测试的声明已签署/记录\n\n## 模块测试的入口标准\n\n如前所述，一个测试阶段的退出标准可能不是另一个的入口标准。例如，模块测试不能在单元测试完成后立即开始（即单元测试的退出标准已通过）；必须将通过单元测试的代码部署到测试环境后，才能开始模块测试。因此，以下内容可被视为模块测试的入口标准：\n\
  \n- 所有必需的单元均已通过单元测试退出标准。\n- 单元测试文档已由进行单元测试的开发人员或其同事签署。\n- 代码已部署到测试环境（拥有不同的测试环境是理想方法）。\n\
  \n## 模块测试的出口标准\n\n模块测试的目标是根据对需求的最新理解完成本阶段的各种测试。因此，在完成本测试阶段之前，必须完成所有测试类型的完成标准，并且如果对需求的理解发生变化（通过查询或问题登记请求），则必须在退出本阶段前研究、分析和测试变更的影响。同样，必须在任何终止阶段关闭所有重要问题或缺陷，以便不再需要对任何问题或缺陷进行未来跟踪。因此，以下内容可被视为模块测试阶段的出口标准：\n\
  \n- 所有“呼吸前修复”和“立即修复”优先级的缺陷均已修复且修复已验证。请参阅第 8 章 *缺陷管理体系* 了解优先级分类详情。\n- 严重程度 1 级和 2\
  \ 级的缺陷均已修复且修复已验证。\n- 在模块测试期间提出的与被测需求的功能行为相关的所有问题或疑问均已解决。\n- 与被测需求相关的所有测试脚本均已执行，且结果截图已纳入。\n\
  - 如果存在任何中等或低优先级的错误待处理，则实施风险必须由业务分析师和/或客户批准。\n- 与模块测试阶段相关的所有类型测试的完成标准（在 *测试方法* 部分表中提到）均已满足。\n\
  \n## 系统测试的进入标准\n\n为了进入系统测试阶段，必须通过模块测试阶段的定制工作退出标准，并且系统测试的准备工作已完成。准备工作包括编写和评审‘端到端’和‘基于场景’的功能和非功能测试用例。因此，以下可被视为系统测试阶段的进入标准：\n\
  \n- 应用已通过模块测试的退出标准。\n- 本阶段需要执行的测试用例或脚本已准备就绪。\n- 所有非功能需求均已可用：\n  - 性能需求\n  - 安全配置\n\
  \  - 支持的国家和区域\n  - 支持的语言\n- 根据非功能需求，所有非功能测试用例均已准备就绪。\n\n## 系统测试的退出标准\n\n完成系统测试后，所有功能以及非功能需求必须经过测试，且重要缺陷不应处于开放状态。系统测试阶段也适合进行应用的最终安全评审，因为该定制应用几乎处于（除回归测试期间可能发现的一些问题外）已开发完成的状态。因此，以下可被视为系统测试阶段的退出标准：\n\
  \n- 所有“呼吸前修复”和“立即修复”优先级的缺陷均已修复且修复已验证。\n- 严重程度 1 级和 2 级的缺陷均已修复且修复已验证。\n- 如果存在任何中等或低优先级的错误待处理，则实施风险必须由业务分析师和/或客户批准。\n\
  - 安排在系统测试阶段的测试用例已通过。\n- 最终安全评审已完成且没有安全相关问题处于开放状态。\n- 与系统测试阶段相关的所有类型测试的完成标准（在 *测试方法*\
  \ 部分表中提到）均已满足。\n\n## 回归测试的进入标准\n\n通过回归测试的进入标准表明代码已通过系统测试，并且回归测试的准备工作（包括必要的测试脚本和应用配置）已完成。因此，以下可能为回归测试的进入标准：\n\
  \n- 系统测试的退出标准已满足。\n- 回归测试脚本已准备就绪。\n- 安全密钥或配置密钥已最终确定。\n- 一致性验证测试脚本已准备就绪。\n\n> 为了优化工作量，回归测试脚本可以设计成也可以用作一致性验证测试脚本。\n\
  \n## 回归测试的退出标准\n\n以下可以作为回归测试的退出标准：\n\n- 所有“呼吸前修复”和“立即修复”优先级的缺陷均已修复且修复已验证。\n- 严重程度\
  \ 1 级和 2 级的缺陷均已修复且修复已验证。\n- 如果存在任何中等或低优先级的错误待处理，则实施风险必须由业务分析师和/或客户批准。\n- 不存在开放的问题或疑问。\n\
  - 与回归测试阶段相关的所有类型测试的完成标准均已满足（在 *测试方法* 部分表中提到）\n\n## 发布测试的进入标准\n\n在 Dynamics AX 的上下文中，发布测试阶段仅包含安装测试。根据微软标准，安装和卸载过程应安全且自动化，但在\
  \ Dynamics AX 中，成功安装或卸载所需的一些活动无法自动化。对于所有此类活动，手动操作流程应在安装指南中说明。测试人员应遵循安装指南中提到的所有步骤，且系统行为应如安装指南所述。有关安装测试的更多详情，读者可参考前一章。以下要点可被视为发布测试阶段的进入标准：\n\
  \n- 系统测试阶段的退出标准已成功完成。\n- 安装指南已准备就绪。\n- 安装测试用例已编写并修订。\n- 需要交付的 XPO 或安装程序可执行文件已准备就绪。\n\
  - 安装测试的测试环境已准备就绪。\n\n## 发布测试的退出标准\n\n在执行以下操作后，发布测试可被视为已完成：\n\n- 与安装测试相关的所有问题均已修复。\n\
  - 所有开放问题均已记录为已知缺陷。\n- 严重程度 1 级和 2 级的缺陷均已修复且修复已验证。\n- 如果存在任何中等或低优先级的错误待处理，则实施风险必须由业务分析师和/或客户批准。\n\
  - 与发布测试阶段相关的所有类型测试的完成标准均已满足（在 Test Approach 部分表中提到）。\n\n## 准则定义\n\n为了为项目测试团队以及项目中的其他团队提供清晰度，关键决策准则必须记录在测试计划中，并获得各利益相关方的承诺。\n\
  \n## 测试用例通过或失败标准\n\n每个失败的测试用例（单元测试除外）都将被记录。应用在存在严重程度 1 级或 2 级或紧急或高优先级错误的情况下不会进入后续的软件测试阶段。以下可能是关于测试用例通过/失败标准的概括性想法。可以为每种单独的测试用例类型（即测试类型）定义更准确的定义：\n\
  \n- 功能是否通过或失败取决于测试操作的结果。如果操作的实际输出与测试用例指定的预期输出相同，则功能通过。如果测试用例中的任何操作失败，则整个用例失败。\n\
  - 如果测试用例失败，不能假设代码存在缺陷。失败只能解释为预期结果与实际结果之间的差异，预期结果源自项目文档。预期结果可能因项目文档被误解、不完整或不准确而出错。报告的失败将被记录以供进一步分析，然后分析失败原因。如果是缺陷，应在评审和授权表上记录。\n\
  \n## 暂停/恢复标准\n\n如果出现以下任何情况，测试团队可能会暂停对特定代码的部分或全部测试活动：\n\n- 测试环境未更新为最新代码（需要测试的代码）。\n\
  - 开发团队无法为特定代码配置设置数据。\n- 健全性（或构建验证）测试（如果正在进行）失败。\n- 功能存在故障导致其无法测试。\n- 某项未包含指定的更改。\n\
  - 在更高级的测试阶段发现了大量本应在前一阶段被发现的缺陷。这里非常重要的是要定义“过多缺陷”的标准，即 X 个严重程度为 1 或 2 的缺陷或 Y 个优先级为关键或紧急的缺陷。\n\
  - 有新版本的软件可供测试。\n\n\n\n测试恢复将在以下内容交付给测试团队后开始：\n\n- 导致测试暂停的问题代码已得到修正。\n- 新版本中修复的所有错误清单。\n\
  - 来自主导开发人员的书面保证，证明他/她或团队成员之一已验证导致测试暂停的原因已被移除。\n\n## 角色与职责\n\n为了项目成功，每个利益相关者都必须了解其职责以及对其他利益相关者的期望。\n\
  \n推荐用于 Dynamics AX 定制项目的测试团队并非孤立的测试团队，而是测试责任在整个项目团队中分布。这是为了最小化成本并高效利用可用技能而建议的。\n\
  \n| 角色 | 职责 |\n|------|-------------------|\n| Test Manager | - 编写测试计划<br>- 维护测试计划<br>-\
  \ 监控测试进度<br>- 监控对测试计划的遵守情况<br>- 做出进入和退出测试阶段的决策<br>- 做出暂停或恢复测试的决策<br>- 对测试策略进行更改或对测试计划进行修订\
  \ |\n| Test Lead | - 协调测试团队<br>- 在各种会议中代表测试团队<br>- 生成各种报告和指标<br>- 风险识别、分析和缓解<br>-\
  \ 向测试经理报告测试进度更新、遇到的任何问题以及已识别的风险 |\n| Business Analyst | - 创建功能测试用例和测试脚本<br>- 执行功能测试<br>-\
  \ 协助系统测试用例<br>- 编写一致性验证测试脚本 |\n| Developers | - 执行单元测试<br>- 进行同行代码评审<br>- 交付应用程序的完整构建<br>-\
  \ 就更改和新功能向测试人员提供反馈<br>- 根据需要向测试团队提供被测应用程序的专业知识和信息<br>- 消除已达成一致的错误 |\n| Lead Developer\
  \ | - 进行代码评审（执行设计和架构合规性检查、业务标准或报告标准合规性检查）<br>- 在分诊会议中代表开发团队<br>- 代表可信计算相关活动，如最终安全评审、威胁评审和优先级排序\
  \ |\n| Testers | - 编写或执行除功能测试用例之外的测试用例（即除功能测试外的测试用例、回归测试、基于场景的测试和端到端功能测试）<br>- 查找、报告并跟踪测试中发现的错误<br>-\
  \ 分析结果<br>- 执行对编码标准的合规性检查、帮助导航测试、用户体验和可用性测试、性能测试、全球化测试、本地化测试、平台兼容性测试、可扩展性测试、备份和恢复测试、安装测试\
  \ |\n\n## 代码评审\n\nDynamics AX 中的代码评审具有多个目标，包括以下内容：\n\n- 对设计和架构指南的合规性检查。\n- 业务智能或报告标准的验证。\n\
  - 最终安全评审。\n\n代码评审应在两个层级进行；一个是在代码片段层级，有助于满足前两个目标，另一个是在系统层级，主要关注安全。系统级代码评审也有助于评审关键业务逻辑的正确性。\n\
  \n在代码评审期间，应牢记此测试的目标。为了确保满足所述测试的目标，应准备一份包含与此测试相关的检查点的清单。此清单应在代码评审开始前进行评审和批准。\n\n\
  设计和架构模式应从包括可信计算在内的各个角度进行评审和最终确定。\n\n## 摘要\n\n本章我们讨论了推荐的测试生命周期、其阶段、每个测试阶段的进入和退出标准、每个利益相关者的职责、各种关键标准等。本章还确定了何时应执行测试。为了测试活动的成功，不仅需要使用适当的技巧进行测试，而且还需要在正确的阶段进行测试。\n\
  \n我们看到 Dynamics AX 定制项目的测试是项目团队的共同责任，即开发人员、业务分析师、测试团队等；不同团队之间高度合作、清晰的沟通协议以及对每个参与者的明确期望是\
  \ Dynamics AX 定制项目测试成功的关键。\n"
- "## 8 缺陷管理系统\n\n任何定制而非从零开始开发的软件系统都需要全面的测试，这超出了需求验证的范围，因为许多错误是由于定制而出现的。这需要对“缺陷”进行特殊定义，因为缺陷可能超出需求范围。以下情况可被视为缺陷：\n\
  \n- 系统执行了需求和设计文档未提及的功能。\n- 系统未执行需求和设计文档中提及的功能。\n- 系统执行了某个功能，而需求文档中对此功能没有任何信息。根据所有相关利益相关者的协议，这可能被视为缺陷或增强。\n\
  - 系统未执行某个功能，而需求文档中对此功能没有任何信息。根据所有相关利益相关者的协议，这可能被视为缺陷或增强。\n\n核心 Dynamics AX 产品或本地化中发现的所有问题应逐案处理。除了上述方面之外，业务应用程序需要获得可信性。为了实现这一特性，安全问题必须系统化处理。所有安全问题应按照本章规定的方法进行分类和处理。\n\
  \n为处理安全缺陷，缺陷跟踪工具应具备接受和处理此类问题的额外信息的功能。\n\n### 缺陷分类\n\n从缺陷管理的角度来看，缺陷可分为两类，即安全相关缺陷和非安全相关缺陷。安全相关缺陷需要为每个安全缺陷附加一些额外信息。在\
  \ Dynamics AX 中，缺陷分类（即无论发现错误的类型如何）基于以下因素：\n\n- Bug priority\n- Category\n- Issue\
  \ status\n- Requirement Ref.\n- STRIDE\n- Severity\n- Discoverability\n- Mitigation\n\
  - Vulnerability\n- Resources\n\n缺陷管理工具应具备接受所有安全相关缺陷信息的功能。工具应确保当缺陷被记录为安全相关问题时，用户输入所有必需信息。工具还应能够根据上述所有维度生成报告。\n\
  \n### Bug Priority\n\n错误优先级分类表示整体重要性并决定错误修复的顺序。为了确保优先修复的错误得到应有的优先级，为每个错误分配正确的优先级是必要的。以下是在\
  \ Dynamics AX 的 IBI 规范中推荐的优先级级别。\n\n- **紧急 (0)**：在做任何其他事情之前修复。\n- **高 (1)**：立即修复；这应是优先级\
  \ 0 之后的最高重要问题。\n- **普通 (2)**：尽快修复；具体时间取决于客户或测试的变通成本。\n- **低 (3)**：如果有时间则修复，很好有。\n\
  \n### Severity\n\n严重性应根据问题从技术角度的影响进行分配。以下是在 Dynamics AX 的 IBI 规范中推荐的严重性级别：\n\n-\
  \ **严重性 1（必须修复）**：这些是与系统崩溃或信息丢失相关的修复。此类别的几个示例包括应用程序崩溃、产品不稳定、主要测试阻塞、高安全风险、构建损坏或构建验证测试失败、应用程序安全故障和可信计算故障、数据丢失、损坏或误表示、内存泄漏等。\n\
  - **严重性 2**：当主要部分或整个功能不可用，或功能的小部分不可用但变通方法非常复杂时分配此严重性。这也可能是一个严重性级别，其中错误会显著影响客户或测试。几个示例是：\n\
  \  - 电话号码字段（必须填写）只能容纳 5 个字符，而客户所在地的实际电话号码为 7 位数字。\n  - 缺少加密信用卡号码等敏感信息的加密功能。\n- **严重性\
  \ 3**：当存在次要功能问题且有变通方法时应分配此严重性级别。客户或测试不应因错误而受到显著影响。\n  - 某个字段接受 ISD 代码超过两位字符，但客户所在国家的\
  \ ISD 代码为一位数字。变通方法可能是输入 00X 而不是 X。\n- **严重性 4**：非常次要的问题，如拼写错误（不提供错误信息）、制表符顺序不正确等。\n\
  \n有些人对严重性和优先级感到困惑，常常认为高优先级的错误也是高严重性的，这是不正确的。例如：\n\n- 新添加的功能缺少帮助文件：\n  - High Priority\
  \ (a user cannot use the functionality as the help file is the only way to know\
  \ about the new feature).\n  - Low severity (it is not information loss or functionality\
  \ missing; from a technical perspective it is not so damaging).\n- Interest calculation\
  \ is wrong in the year 2100 due to incorrect leap year calculation at the end of\
  \ a century:\n  - Low priority (Customer is not affected today).\n  - High severity\
  \ (the calendar algorithm may need a change).\n\n\n\n## 安全漏洞分类\n\n安全漏洞按照 STRIDE\
  \ 进行分类，因此正确对漏洞进行分类至关重要：\n\n- **欺骗：** 如果用户冒充另一个实体或个人。欺骗的其他术语有冒名、伪装或身份盗用。\n- **篡改：**\
  \ 如果通过诸如 SQL 注入等技术对数据进行未经授权的修改。其其他术语可能是（数据）完整性。\n- **否认：** 如果用户否认已执行某个操作，且没有足够的证据证明相反的情况。\n\
  - **信息泄露：** 如果信息被未经授权的人员访问。\n- **拒绝服务：** 如果人们滥用功能，意图制造压力状况，从而使其他真实用户无法舒适地使用系统。\n\
  - **权限提升：** 如果用户获得超出其应有权限的更多权限。\n- **攻击面减小：** 如果对权限最低的用户（如匿名用户）的代码访问被减少。\n\n缺陷管理工具必须提供一个额外的选项\
  \ '不是安全漏洞' 来声明某个问题不是安全相关问题。\n\n## 安全漏洞的根本原因分析\n\n必须对所有安全漏洞进行根本原因分析。根据其来源，安全漏洞可归类为以下一种类型：\n\
  \n- 不是安全漏洞。\n- **缓冲区溢出或欠溢：** 当变量的大小不足以容纳给定值时发生，内存缓冲区会被额外数据覆盖。缓冲区溢出是最常见且危害最大的安全风险之一。在设计或编码时，确保声明的变量具有足够的尺寸或精度来处理最大或最小可能值。缓冲区溢出的几种类型有堆溢出、基于栈的缓冲区溢出、V-表和函数指针覆盖以及异常处理程序覆盖。缓冲区溢出可能导致访问违规、不稳定以及用于恶意目的的代码注入。\n\
  - 算术错误：当变量的限制（任一上限或下限范围边界）被超过时发生。例如，整数溢出。算术错误可分为两种——溢出和欠溢。溢出发生在要存储的值超过变量存储容量的上限时，欠溢发生在要存储的值小于变量的下限时。算术错误可能导致更严重的错误，如缓冲区溢出或缓冲区欠溢。\n\
  - SQL/脚本注入：这是在用户输入中添加 SQL 语句的过程，可能用于绕过授权、调用内置存储过程并探测数据库。当使用用户输入动态构建 SQL 语句时可能发生\
  \ SQL 注入攻击；黑客可以在用户输入中添加 SQL 语句的一部分，从而使生成的 SQL 语句执行恶意操作。\n- 跨站脚本：此攻击发生在用户输入未经有效性检查直接输出时。例如，如果在讨论论坛中输入了恶意\
  \ JavaScript，则每当用户打开该论坛时，此恶意 JavaScript 代码就会在客户端机器上执行。另一个例子可能是使用电子邮件中的表单标签窃取客户端\
  \ cookie。\n- 加密弱点：当使用弱算法或密钥未安全存储时发生。有时这是由于人为工程因素造成的。\n- 弱认证：认证机制应足够强，用户不应通过任何手段（如\
  \ SQL 注入、规范化等）绕过它。\n- 弱授权或不当的访问控制列表：应为每项资产精确设置授权级别；应正确设置。\n- 秘密隐藏无效：这发生在向用户提供某些秘密信息时。几个例子是错误消息、异常处理等。\n\
  - 无限资源消耗（DoS）：当向未经授权的用户提供过多服务时发生。例如，在从数据库检索任何数据之前，应尽早检查（而不是仅在向用户显示信息前检查）用户是否被授权访问该信息。DoS\
  \ 攻击可分为四种类型：CPU 饥饿、内存饥饿、资源饥饿和网络饥饿。当用户输入被信任超过所需程度、在检查授权之前执行昂贵操作，或安全设计中未涉及适当安全时，应考虑此威胁。\n\
  - 不正确/无路径名：文件或路径名可以以多种方式编码，因此不正确的路径名可能导致规范化错误。应避免包含空格或特殊字符（如 &、? 或 +）的路径名。\n- 规范化错误：当安全决策基于文件名且在解析文件名、URL\
  \ 或设备名时发生解析错误时出现。这可能导致对被访问资源应用不正确的权限。\n- 其他等，如意外泄露（例如由于不适当或缺少错误消息或不良安全实践导致用户操作错误）、目录遍历，以及未处理的异常或异常处理不当，从而导致用户获取有价值的信息。\n\
  \n## 使用 DREAD 模型进行重要性识别\n\n为了对每个安全问题采取适当措施，需要识别其重要性。DREAD 是计算安全漏洞重要性的有用工具。DREAD\
  \ 代表：\n\n- 损害潜力：对系统的损害程度会如何？\n- 可再现性：是否容易一再产生相同的攻击？\n- 可利用性：实施攻击需要多少努力或实验？\n- 受影响用户：有多少百分比的人会受到此威胁影响？\n\
  - 可发现性：此攻击是否可以被轻易发现？\n\n为 DREAD 的五个组成部分中的每一个分配 1 到 10 的值，然后为每个安全威胁计算评级总和。此总和值表示安全威胁的重要性级别。\n\
  \n根据 DREAD 中的总和值，可对每个威胁采取以下措施：\n\n- 不采取行动：如果 DREAD 值为非常低。\n- 告知客户所有信息：如果 DREAD 值为非常低。\n\
  - 禁用或移除功能：如果 DREAD 值为中等到高，且修复成本相对于投资回报率来说非常高。\n- 修复它：如果 DREAD 值为中等到高，且修复并不复杂。\n\n\
  缺陷管理工具应能够接受上述其中一个值作为关闭解决方案。\n\n## 缺陷管理工具\n\n缺陷管理工具必须支持分类并为分类提供适当的级别。除此之外，根据 IBI\
  \ 规范对 Dynamics AX 的规定，缺陷管理工具还有一些额外的要求。\n\n- 缺陷管理系统必须具备注册、跟踪和报告以下内容的 capability：\n\
  \  - 缺陷\n  - 问题\n  - 设计变更请求\n- 缺陷管理工具必须接受或为每个缺陷生成以下信息：\n  - 唯一编号（自动生成）\n  - 缺陷描述\n\
  \  - 缺陷优先级（上面提到的四个级别）\n  - 缺陷严重性（上面提到的四个级别）\n  - 评论记录，以显示缺陷在其生命周期内是如何处理的\n  - 关闭评论\n\
  - 缺陷管理工具应根据上述提到的不同分类标准以及状态生成报告。\n- 缺陷管理工具必须为所有开放缺陷生成报告（即状态为进行中、正在调查、需要更多信息、等待客户澄清、已延期等）。这有助于在任何时间点生成所有已知缺陷的报告。\n\
  - 缺陷管理工具必须接受安全相关缺陷的额外信息。\n- 缺陷管理工具在发现安全相关问题后必须采取行动：\n  - 必须修复：诸如写访问违规、栈溢出异常等问题\n\
  \  - 必须调查：大内存分配、整数溢出、自定义异常、可能导致可利用崩溃的其他系统级异常\n\n\n\n- 缺陷管理工具必须能够记录 bug 的原因，并且选项必须包括以下内容：\n\
  \  - 不是安全漏洞\n  - 缓冲区溢出或下溢\n  - 算术错误（例如，整数溢出）\n  - SQL/脚本注入\n  - 目录遍历\n  - 竞态条件\n\
  \  - 跨站脚本\n  - 加密弱点\n  - 弱认证\n  - 弱授权或不当的访问控制列表\n  - 无效的密钥隐藏\n  - 无限资源消耗（DoS）\n\
  \  - 不正确/无错误消息\n  - 不正确/无路径名\n  - 规范化\n  - 其他\n- 缺陷管理工具应能够接受以下其中一个值作为解决方式：\n  -\
  \ 不采取行动\n  - 将所有内容告知客户\n  - 禁用或移除该功能\n  - 修复它\n\n## 缺陷生命周期\n\n缺陷生命周期应基于项目的定制需求以及项目中使用的通信方法。关闭类别应具有充足的选项，以便可以轻松记录关闭\
  \ bug 的原因。可能的已关闭类别可能包括以下内容：\n\n- 不是问题\n- 无法重现\n- 需求已更改\n- 与此代码段无关\n- 已验证\n- 重复\n\
  - 不可重现\n- 按设计\n- 已推迟\n- 已撤回\n- 无需操作\n\n如此广泛的已关闭类别列表将有助于识别已关闭问题如何达到关闭阶段。\n\n## 摘要\n\
  \n在本章中，我们讨论了 bug 是什么以及如何对其进行分类。我们还讨论了适用于对安全相关 bug 进行分类的其他维度以及缺陷管理工具所需的特殊特性。\n"
- '## 9 Dynamics AX 工具


  由于定制过程中存在特殊性，市场上大多数标准工具除非付出很大努力将其适配到 Dynamics AX 的需求，否则无法使用。幸运的是，Dynamics AX 提供了一些有用的工具：


  - 用于代码分析或扫描的最佳实践检查工具

  - 用于扫描代码更改的比较工具

  - 用于代码覆盖率分析和性能分析的代码分析器

  - 用于基准测试的基准套件

  '
- "## 最佳实践检查工具\n\nDynamics AX 最佳实践检查工具可用于检查代码和对象是否符合 Dynamics AX 的最佳实践。此工具可以在三种不同的方式下使用：在编译时（仅当诊断级别设置为第\
  \ 4 级时）、在签入时，以及在任何时间手动使用。\n\n要将诊断级别设置为第 4 级，请转到 Tools | Options | Compiler 并将 Diagnostics\
  \ level 的值设置为 Level 4。\n\n要手动调用此工具，请转到 AOT 中的一个或多个节点，然后：\n\n1. 右键单击。\n2. 选择 Add-Ins。\n\
  3. 选择 Check Best Practices。\n\n双击最佳实践偏差消息将打开代码编辑器。\n这些消息为：\n\n- 错误：应该一定修复的事情（在最佳实践工具输出中以红色显示）\n\
  - 警告：应该强烈考虑修复的事情（在最佳实践工具输出中以黄色显示）\n- 信息：可能值得知道的事情（在最佳实践工具输出中以蓝色显示）\n\n类别信息可以从最佳实践选项表单中控制。此表单可以从工具菜单访问。单击工具菜单中的\
  \ **Options**，然后单击 **Best Practices**。\n\n选择 **Warning level** 以设置您希望在编译器输出窗口中看到的错误消息类型。编译器输出窗口将有三个选项\
  \ – **Errors only**、**Errors and warnings** 和 **All**。以下表格描述了这三个选项：\n\n| 选项 | 错误\
  \ | 警告 | 信息 |\n|---|---|---|---|\n| 仅错误 | 是 | 否 | 否 |\n| 错误和警告 | 是 | 是 | 否 |\n|\
  \ 全部 | 是 | 是 | 是 |\n\n用户还可以通过勾选或取消勾选以下表格中列出的相关选项来控制某些类型确认检查结果的显示。\n\n| 检查 | 说明 |\n\
  |---|---|\n| 属性 | 检查所有期望值与默认值相同的属性 |\n| AOT 中的唯一树节点名称 | 检查 AOT 中所有节点的唯一节点名称 |\n\
  | 对象 ID | 检查是否有任何对象 ID 被修改 |\n| AOS 性能 | 检查表单的 AOS 优化 |\n| 可信计算 | 检查是否遵循可信计算的最佳实践\
  \ |\n| 已使用 | 检查未使用的元素，例如变量、扩展数据类型等。 |\n| 引用应用程序对象的存在 | 检查引用应用程序对象的存在 |\n\n| 检查 |\
  \ 说明 |\n|---|---|\n| 已停用功能的使用 | 检查系统中已停用功能的使用 |\n| 记录和表 ID 引用 | 检查开发人员在代码中是否未使用\
  \ `RecId` 或 `TableId` 系统数据类型 |\n| 配置键 | 检查配置键的使用 |\n| 安全键 | 检查安全键的使用 |\n| 标签 | 检查标签是否以正确的方式使用。以下为主要检查：\n\
  - 标签应用于所有用户界面文本。\n- 在代码中编写的用户界面文本必须用双引号书写。\n- 用于帮助（而非用户界面文本）的标签必须以句号结尾。\n- 帮助和标签不得相同。\
  \ |\n| 分析可见性 | 检查表、字段或视图的可见性设置 |\n\n上述提到的最佳实践检查适用于所有 AOT 元素或至少适用于一个以上 AOT 元素。以下是仅适用于特定\
  \ AOT 元素（如下表所述）的一些最佳实践检查。\n\n| 检查类别 | 检查 | 说明 |\n|---|---|---|\n| 表 | 唯一标签 | 检查每个表字段是否具有唯一标签\
  \ |\n|  | 索引使用 | 检查索引是否选择得当，即：\n- 检查只有一个索引的表应将该索引作为聚集索引\n- 检查如果存在唯一索引，则应定义主键索引\n\
  - 检查 RecId 索引未用作聚集索引 |\n|  | 删除操作 | 检查两个表是否没有相互指向的删除操作 |\n|  | 声明的标题字段 | 检查是否已声明标题字段\
  \ |\n|  | 表单引用 | 检查引用的菜单项是否存在 |\n|  | 字段属于字段组 | 检查每个字段是否属于一个字段组 |\n\n| 检查类别 | 检查\
  \ | 说明 |\n|---|---|---|\n|  | 字段名/方法名冲突 | 检查字段名/方法名冲突 |\n|  | 字段组中的字段数 | 检查字段组中的字段数\
  \ |\n|  | 分析行为 | 检查在设置了 **AnalysisVisibility** 属性的所有表或视图上是否设置了 **AnalysisSelection**\
  \ 或 **TypicalRowCount** 属性 |\n|  | 货币代码字段 | 检查货币代码字段 |\n|  | 货币日期字段 | 检查日期字段 |\n\
  |  | 检查表关系 | 检查表关系及关系的正确性 |\n| 表集合 | 关系 | 检查表集合中引用的表是否存在 |\n| 类 | 抽象 | 检查抽象类是否标记为\
  \ `abstract` |\n|  | Runbase 实现 | 通过 Runbase 实现检查对话框框实现 |\n|  | 缺失成员函数 | 检查类是否缺少成员函数\
  \ |\n|  | 构造函数 | 检查类构造函数的实现 |\n| 方法 | 空方法 | 检查空方法 |\n|  | 日期功能 | 检查日期功能的使用，例如类型转换、today\
  \ 函数等。 |\n|  | 隐私 | 检查可以根据调用方式分配更大的隐私级别（public、private 等） |\n|  | 打印和暂停 | 检查代码中是否存在用于调试的\
  \ `print` 和 `pause` 语句 |\n|  | 变量使用 | 检查变量的声明、使用、命名约定符合性以及未使用的变量 |\n|  | 未来保留字 |\
  \ 检查变量名是否使用了任何未来保留字 |\n|  | 单引号文本 | 检查是否使用了单引号中的文本 |\n\n\n\n\n| 检查类别 | 检查项 | 说明\
  \ |\n|---|---|---|\n| 表单 | 表单大小 | 检查表单大小不超过 1024*768 像素 |\n|  | 禁用技术 | 检查表单控制禁用技术的设置\
  \ |\n|  | 控件名称 | 检查控件的命名 |\n|  | 选项卡 | 检查表单是否具有正确的选项卡页及其标题是否正确 |\n| 文档 |  | 检查文档的拼写\
  \ |\n| 透视图 |  | 检查是否包含所有分析可见对象 |\n\n请注意，从此处启用或禁用任何类型的检查只会影响结果的显示；但符合性检查仍将执行。\n\n\
  在某些情况下，我们可能需要隐藏某些代码片段中的错误或整个代码中一种或多种最佳实践偏差类型。这可以通过以下两种方式完成：\n\n- “BP Deviation documented”\
  \ 注释可用于阻止某段代码的最佳实践警告。需要注意的是，这仍然会显示最佳实践偏差，但不会作为警告显示；它将作为信息显示。此注释与普通注释一样，应按如下方式编写：\n\
  \  `// BP Deviation Documented`\n- 上述方法的缺点是错误消息仍作为信息显示，即仅抑制了严重性。另一种完全抑制最佳实践偏差的方法是使用\
  \ SysBPCheckIgnore 宏。以下是使用 SysBPCheckIgnore 宏的流程：\n  1. 对于每个错误代码和 AOT 位置的组合，添加以下代码行\n\
  \     ```\n     C+= [#BP Error Code, @\"AOTLocation\"]\n     ```\n     其中 `BPErrorCode`\
  \ 是 SysBPCheck 宏中列出的警告/错误的错误代码，而 `AOTLocation` 是 AOT 中应抑制其最佳实践偏差的对象的所在位置。\n  2.\
  \ 编译 SysBPCheck 类。\n  3. 重启 Dynamics AX。\n"
- "## 比较工具\n\n比较工具是 Dynamics AX 中代码审查最有用的工具之一。比较工具可用于三种不同的比较：\n\n- 两个不同层中的同一应用程序对象\n\
  - 同一对象的两个版本（如果使用版本控制）\n- 两个不同的应用程序对象\n- 导入 XPO 中的代码与 AOT 层中的相同对象\n\n在每种情况下，比较结果都显示在“比较表单”中。以下表格解释了“比较表单”。\n\
  \n| 符号/图标/颜色/背景 | 说明 |\n|---|---|\n| 带勾选标记的阴影框 | 当前节点的子节点存在差异。 |\n| 红色和蓝色图标 | 当前节点内部存在差异。\
  \ |\n| 黑色文本 | 当前代码行或属性或控件中两个对象之间不存在差异。 |\n| 红色或蓝色图标或文本 | 当前代码行、属性或控件仅属于其中一个对象。 |\n\
  | 阴影背景 | 当前代码行或属性中两个对象之间存在差异。 |\n| 浅灰色背景 | 相同的代码行出现在两个对象中，但位置不同。 |\n\n### 比较类型\n\
  \n比较工具可以按前面提到的三种不同方式使用。现在我们将讨论所有三种比较方式。\n\n### 两个不同层中的同一应用程序对象\n\n这是为了比较在引用层中不存在的对象，或在两个层中都存在但在两个层中不同的对象。需要注意的是，如果引用层位于源层下方，则比较将在源层中的对象与引用层中的对象以及引用层下方的层中的对象之间进行。以下表格解释了图形用户界面中使用的术语：\n\
  \n| GUI 术语 | 说明 |\n|---|---|\n| 项目名称 | 在比较层过程中将创建的项目的名称 |\n| 源层 | 该层用作比较的基础。如前所述，结果项目永远不能包含源层中未包含的对象。\
  \ |\n| 引用层 | 与源层进行比较的层。 |\n\n> 可以选择“OLD SYS”作为引用层，以了解新版本中哪些对象已被更改。\n\n比较两个不同层中同一应用程序对象的步骤：\n\
  \n1. 单击 **工具 | 开发工具 | 版本更新 | 比较层**。\n2. 输入项目名称，选择源层和引用层，然后单击 **确定**。\n3. 现在已创建包含不同的应用程序对象的项目。转到该项目（您在上一步中输入的名称）。\n\
  4. 使用“Add-ins”快捷菜单上的“Compare”命令比较单个对象。\n   若要查看每个对象所属层的名称，请转到 **工具 | 选项 | 开发选项卡**，然后选择\
  \ **显示所有层**。\n5. 在“比较表单”中查看比较结果\n\n### 同一对象的两个版本\n\n仅当使用版本控制系统时，才能在同一层中比较同一对象的两个版本。\n\
  \n1. 转到 AOT，右键单击对象，然后单击 **Add-Ins | Compare**。\n2. 选择要比较的两个版本，然后单击 **Compare**。\n\
  3. 再次单击 **Compare**。\n4. 在 **比较表单** 中查看比较结果。\n\n### 两个不同的应用程序对象\n\n以下是比较 AOT 中两个不同应用程序对象的过程：\n\
  \n1. 在 AOT 中选择对象。\n2. 右键单击并单击 **Add-Ins | Compare**。\n3. 再次单击 **Compare**。\n4. 在\
  \ **比较表单** 中查看比较结果。\n"
- '## 代码分析器


  代码分析器是在运行时跟踪代码执行历史的工具。代码分析器可用于以下用途：


  - 测量每行、方法、对象等的执行时间

  - 单元测试期间的代码覆盖率分析

  - 识别性能瓶颈


  代码分析器不仅可以通过图形用户界面调用，还可以通过 X++ 代码调用。我们将不讨论通过 X++ 调用它。使用代码分析器包括两个阶段：


  - 收集数据

  - 查看/分析数据


  ### 收集数据


  为了收集执行数据，需要调用代码分析器，然后用户应遍历每个正在审查的功能/功能。应遵循以下步骤：


  1. 通过转到 **工具 | 开发工具 | 代码分析器** 打开代码分析器工具。

  2. 通过选中 **Trace Depth Enabled** 复选框并选择层级数来限制检查深度。

  3. 在应用程序中导航至测试应开始的位置。

  4. 在代码分析器窗口中单击 **Start**。

  5. 在不同条件下使用功能，以确保每行代码至少执行一次。

  6. 当所有待测试功能都已使用后，在代码分析器窗口中单击 **Stop** 按钮。

  7. 在 **Summary** 对话框中编写代码分析的描述（供参考）。

  8. 单击 **OK** 按钮，并在打开“Profiler runs”表单以查看数据时开始查看/分析数据的第二阶段。


  > 不要选中 **Calculate line total** 复选框。


  ### 查看/分析数据


  特定运行的数据视图可能具有不同的目标，例如性能分析、代码覆盖率分析等。代码分析器有四种不同的表单以不同格式查看数据。


  每个表单都以 Ticks 显示时间计数。要将这些数据计算为毫秒或秒等任何单位，请将数据乘以“Profiler run”表单上提供的“Ticks/second”。


  ### 调用树表单


  在此表单中，行按执行的相同顺序显示，第一个执行的行在顶部。这有助于理解表单中的流程和各种触发器。在此表单中，系统方法只有在从应用程序调用时才会出现。


  ### 配置文件行表单


  此表单根据执行时间显示“All executed”行，执行时间最长的行在顶部。此表单也可用于查看给定测试用例集的代码覆盖率。


  ### 遍历表单


  在此表单中，每个方法按执行时间顺序显示，执行时间最长的显示在最前面（尽管顺序可以更改）。除了持续时间外，它还显示对象被调用的次数以及总执行时间的百分比持续时间。此信息可用于优化性能优化的努力，或从测试角度来看，可用于定义性能问题的优先级。此表单分为三个部分。上部窗格显示


  上部显示方法，下部（再次分为两个部分）显示所选方法的子调用和父调用。要选择一个方法，双击它，它将在下部显示子调用和父调用。


  用于限制显示的调用类型，可以使用以下按钮：


  | Button | Type of calls |

  |---|---|

  | Profile line | Opens the profile lines form to show all lines of code that are
  executed. |

  | Setup | This has four items to limit the type of calls displayed

  None: No filtering, view all fields.

  Code hot spots: View only the Duration, Share – duration, Method calls, and Share
  – method calls fields.

  Database access: View only the Method calls, Share – method calls, and Calculated
  SQL time fields.

  Remote connection: View only the Method calls, Share – method calls, and Calculated
  AOS time fields. |


  ## Totals Forms


  **Totals** 表单用于显示汇总数据。各种 **Totals** 表单可从 **Tools | Development tools | Code profiler
  | Profiler runs | Totals** 访问。


  Line total form: Displays aggregated data about total amount of time spent on executing
  each line of code for a code profiler run.


  Method total form: Displays aggregated data about total amount of time spent on
  executing each method for a code profiler run.


  Object total form: Displays aggregated data about total amount of time spent on
  executing each object for a code profiler run.


  以下是三个表单上可用按钮的摘要：


  | Button name and Function | Line total form | Method total form | Object total
  form |

  |---|---|---|---|

  | Profile lines: Opens Profile lines form | Yes | Yes | No |

  | Line total: Opens Line total form | No | Yes | Yes |

  | Method total: Opens Method total form | No | No | Yes |


  ## Profile Summary Form


  此表单用于计算代码分析器运行中每行代码、每个方法和每个对象的总执行时间。当在创建运行时在代码分析器表单上清除“计算行总计”复选框时使用此表单；否则总计计算会自动完成。


  > 代码分析器工具将很快被 "Trace Parser" 跟踪分析器取代。

  '
- '## Dynamics AX Benchmark Toolkit


  用于性能测试的 ''Dynamics AX Benchmark Toolkit'' 是一个随 **Microsoft Dynamics AX Resource
  Kit** 提供的外部工具。与 Axapta 3.0 中的基准测试工具相比，它具有以下明显优势。


  - 更广泛的功能覆盖。

  - 与 Dynamics AX 客户端相比，轻量级的业务连接器。

  - ''Dynamics AX Benchmark Toolkit'' 是一个用 C# 编写的托管程序集。它有两个主要库，即 The Programming Model
  Library 和 The Microsoft Dynamics AX Wrapper Library。第一个库用于通过业务连接器提供访问 Dynamics AX
  的网关。后一个库 (Microsoft Dynamics AX Wrapper) 用于生成类型安全的托管类以与 Microsoft Dynamics AX 接口。使用此工具的前提是了解
  .NET 和 X++，因此本书中未讨论此工具。


  ## Summary


  我们讨论了一些 Dynamics AX 内置工具，它们可能在使测试过程更高效、更有效方面发挥重要作用。Dynamics AX 还有一个单元测试框架，这超出了本书的范围，因为单元测试通常由开发团队本身执行。

  '
