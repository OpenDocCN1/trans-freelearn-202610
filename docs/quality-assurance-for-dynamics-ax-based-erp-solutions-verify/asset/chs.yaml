  ## 记录偏差


  Dynamics AX 用户界面规范旨在确保高标准的用户体验和可用性；然而，在某些情况下，偏离这些规范是不可避免的。以下情况的几个例子可能是：


  - 法律要求，例如遵守法律文件。

  - 行业特定功能无法以符合这些规范的方式实现。


  记录偏差不仅必须针对强制性要求，还必须针对建议。要记录偏差，我们需要记录以下信息：


  - 为什么需要偏差？

  - 头脑风暴文档，用于记录其他符合 Dynamics AX 的实现方式以及导致无法以这些方式实现时发现的限制。


  ## 摘要


  我们研究了大量 Dynamics AX 的 GUI 标准，这将确保：


  - 卓越的用户体验

  - 高度辅助的帮助

  - 直观的用户界面

  - 在消息、向导等方面提供适当的帮助。


  尽管建议遵守用户界面标准，如果在某个 GUI 元素中无法遵守，则应进行头脑风暴以最大程度地减少不合规情况，并记录实现该功能的各种可能选项以及如何选择偏差最小的方法应被记录。

  '
- "## 5 最佳实践——值得信赖的计算\n\n今天，计算机对个人和组织非常重要且有用。在组织的情况下，信息需要在准确、可靠和受控的方式下流动。任何企业的成功都取决于用于业务运营控制、管理和战略规划的信息的可靠性、可用性和安全性。由于信息需要在安全和私密的方式下可用，ERP\
  \ 系统的益处只有在信息在需要时以准确、安全和受控的方式提供给客户时才能充分释放。这些特征将使 ERP 成为值得信赖的系统。\n\nMicrosoft 将这些品质定义如下：\n\
  \n**可用性**：*我们的产品应在客户需要时始终可用。系统停机应成为过去，因为软件架构支持冗余和自动恢复。自我管理应允许在几乎所有情况下无需用户干预即可恢复服务。*\n\
  \n**安全性**：*我们软件和服务代表客户存储的数据应受到保护，不受伤害，并且仅以适当的方式使用或修改。安全模型应易于开发人员理解并构建到其应用程序中。*\n\
  \n**隐私**：*用户应控制其数据的使用方式。信息使用的政策应让用户清楚。用户应控制何时以及是否接收信息以便最好地利用其时间。用户应能够轻松指定其信息的使用方式，包括控制其发送的电子邮件的使用。*\n\
  \n> — 摘自比尔·盖茨关于可信计算的电子邮件，2002 年 1 月 5 日。\n\nMicrosoft 在可信度方面增加了另一个维度，那就是业务诚信。这意味着软件提供商应在与客户的交往中保持响应和透明。这超出了本书的范围。\n\
  \n### 什么是可信计算？\n\n我们已经讨论了可信计算体验的要素。现在我们将从工程角度更详细地讨论可信计算的核心要素；即如何实现可信性。\n\n### 安全\n\
  \n可信计算的主要组成部分是安全，这意味着——使 IT 应用本质上更安全。可以通过以下策略实现安全：\n\n- 使应用程序开发生命周期符合 Microsoft\
  \ 的安全开发生命周期。\n- 从安全角度进行更好的代码分析。\n- 通过以下方式缓解威胁和漏洞：\n  - 采用最佳的威胁保护、检测和清除机制。\n  - 隔离和弹性；即隔离易受攻击的代码并对相互交互的各种计算机进程提供有效控制。\n\
  - 强身份验证机制以确保正确的谁、何事、何时信息：\n  - 谁：要知道登录用户是谁，以便确定用户的权限，并在需要时在以后阶段进行追踪。\n  - 何事：要知道用户执行的操作以及用户可用的权限，以便对系统资产（如数据表）做出访问或拒绝决策。\n\
  \  - 何时：要知道事件发生的时间，以便对任何安全攻击进行分析以检测、预防和消除安全影响。\n- 授权：要知道特定用户组可用的权限类型（只读、读写等）。\n\
  - 访问控制：访问控制列表（ACL）应在开始时设计，以便为系统用户分配适当的权限。ACL 不应仅限于文件或文件夹，还应适用于注册表设置、数据库文件、打印机和活动目录中的对象等。关于\
  \ ACL 的其他提示如下：\n  - 为保护应用程序的敏感文件和文件夹，请在安装期间以编程方式创建 ACL。\n  - 明确使用并经常使用拒绝访问控制条目（ACE）。\n\
  \  - NULL 自主访问控制列表（DACL）可能成为黑客的通道。例如，黑客可以将 NULL DACL 更改为“每个人拒绝访问”，因此请勿使用 NULL DACL\
  \ 条目。\n- 教育和意识是确保以最安全的方式使用或开发 IT 应用的关键策略。以下可用于提高安全意识：\n  - 提供 ERP 应用的安全加固指南，以便以最安全的方式实施\
  \ ERP。\n  - 为所有相关人员提供安全培训，如程序员、测试员、项目经理和 IT 管理员。\n\n### 隐私\n\n隐私的核心要素是用户应感到其信息是保密的。他们不会被迫分享其信息，也不会在未经同意的情况下被获取信息。为满足这一特性，建议遵循以下准则：\n\
  \n- 功能设计以实现隐私，例如：\n  - 支持客户控制其个人信息的权利的功能和特性。\n  - 在提供个人信息时为客户提供选择加入或选择退出的选项的功能。\n\
  - 在设计解决方案时将隐私作为关注点。\n- 在开发和部署中遵守 Microsoft 隐私政策。\n\n### 可靠性\n\n可靠性没有衡量标准；不同的人对可靠性有不同的感知。非\
  \ IT 专业人员可能将可靠系统定义为“以预期和一致的方式持续运行的系统”。而 IT 专业人员可能将可靠系统定义为“一个可靠的系统，需要最少的维护和中断，且整体系统具有高可用性”。定义上的差异为制定其衡量单位造成了主要障碍。Microsoft\
  \ 认为可靠性具有以下五个特征：\n\n- 可预测：提供一致的服务。\n- 可维护：易于配置和管理。\n- 有弹性：尽管条件发生变化仍能工作。\n- 可恢复：可在无不利影响的情况下轻松恢复。\n\
  - 已验证：在多种环境中运行。\n\n上述品质可通过多点策略实现，该策略不仅确保更高的可靠性，还能持续改进：\n\n- 设计以提高可靠性，例如互操作设计、失效安全设计等。\n\
  - 工程以提供更多可靠性，例如代码分析以实现更优的编码逻辑并消除内存泄漏\n- 用于了解系统在哪里失败或客户希望如何使用系统等功能。Windows 错误报告就是一个例子\n\
  \n### Microsoft 安全开发生命周期\n\n为了以值得信赖的方式开发、部署和使用软件应用程序，Microsoft 推荐安全开发生命周期。该生命周期基于\
  \ SD3+C 方法论。\n\n### SD3+C 方法论\n\nMicrosoft 开发了一种方法来应对现实世界的安全问题。它包含四个支柱：\n\n- 安全设计：任何基于\
  \ Dynamics AX 的 ERP 解决方案都应以能够保护自身以及正在处理的信息的方式进行设计、架构和实施。以下是使设计安全的几点：\n  - ERP 解决方案应设计为仅接受预期输入的用户输入。\n\
  \  - 危险 API 应以安全的方式处理（如 Microsoft 规定）。\n  - 数据或控制命令应在信任边界处进行验证。\n  - 整体架构应安全，这可通过在设计阶段进行威胁建模来实现。\n\
  \n\n\n\n- 应使用规定的或安全的设计模式以确保安全编码。\n- 应使用加密技术以最大限度降低信息泄露风险。\n- 应使用 Dynamics AX 代码访问安全机制，防止不受信任的代码（即未源自\
  \ AOT 的代码）调用任何危险的 API。\n- 应在每个 API 上应用严格的权限。\n- 应通过使用威胁建模的结论来降低漏洞。\n- 应遵循与数据授权相关的最佳实践。\n\
  \n- 默认安全：即使 IT 应用以千种方式得到保护，但存在一个安全漏洞，现实世界的软件应用也无法完全安全。该安全漏洞可能被恶意用户利用。一些最佳实践可以在恶意攻击发生时确保最小化损害：\n\
  \  - ERP 系统或任何其他应用程序应以最少的必要权限运行。\n  - 未使用或很少使用的服务应关闭。\n  - 使用不广泛的功能应默认禁用。\n- 部署中的安全：部署安全有两种方式：即在部署期间应加强安全，并且部署程序应安全可靠以应用补丁。\n\
  - 沟通：如果发现任何安全漏洞，保护性措施或变通方法应以清晰且负责任的方式传达给最终用户或管理员。在与最终用户或管理员沟通时，应建议纠正措施，例如应用补丁、部署变通方法以及配置设置更改。\n\
  \n## 安全开发生命周期\n\n可信安全开发生命周期源自瀑布模型。它包含六个阶段。\n\n## 需求阶段\n\n许多人误以为对已开发应用的审查足以确保软件应用的可信度。审查软件应用不仅成本低效，而且无效。在审查已开发应用时在设计中发现的安全问题可能会迫使重新设计和重写代码。\n\
  \n确实，除非相关人员接受过安全培训，否则软件应用无法实现可信度。Microsoft 建议开发团队接受以下强制性安全培训：\n\n- 阅读 Michael Howard\
  \ 所著的 *编写安全代码，第二版*。\n- 阅读 Microsoft 网站上发布的 *Microsoft Dynamics AX 编写安全 X++ 代码* 白皮书。\n\
  - 完成以下两门 Microsoft eLearning 安全课程：\n  - Clinic 2806：面向开发人员的 Microsoft 安全指导培训\n \
  \ - Clinic 2807：面向开发人员的 Microsoft 安全指导培训 II\n- 阅读 Microsoft 向每位 IBI 解决方案提供商分发的 IBI\
  \ ISV 认证手册中的威胁建模部分。\n\n在需求阶段完成安全培训将提供机会，使安全成为安全开发生命周期每个阶段的首要关注点。\n\n该阶段还必须规划安全，即编写安全计划、定义与安全相关的缺陷分类和进展。我们将在第\
  \ 8 章中更详细地讨论缺陷管理。\n\n## 设计阶段\n\n设计阶段在可信应用开发中至关重要。精心设计的结构是软件应用可信度的基础。以下是设计阶段的几个关键活动：\n\
  \n- 安全架构和设计指南定义。以下应是此活动的首要关注点：\n  - 识别设计技术，例如应用最小权限原则\n  - 识别正确运行对安全至关重要的组件\n- 为整个系统定义安全架构\n\
  - 最小化攻击面\n- 默认安全实现：\n  - 记录软件攻击面的元素\n  - 识别需要默认安装的功能。\n- 对每个组件进行威胁建模：\n  - 识别资产\n\
  \  - 识别信任边界\n  - 识别威胁\n- 进行风险分析：\n  - 评估每个功能以及每个权限级别对安全的影响。\n  - 识别对策和风险缓解。对策可能包括在信任边界处加密信息以及在通过信任边界之前进行输入验证。\n\
  \n## 实现阶段\n\n在实现阶段，确定最佳实践以实现可信度的目标。一些此类活动包括：\n\n- 识别设计模式以确保安全性、隐私性和可靠性。\n- 定义安全测试。以下可能是一些测试目标：\n\
  \  - 确保被测应用程序（AUT）不会绕过 Dynamics AX 的标准安全模型。\n  - 确保系统对安全威胁具有足够的鲁棒性。\n  - 确保用户权限根据各种配置（如用户组、公司、配置键、安全键和许可证代码）得到正确执行。\n\
  - 应用 Dynamics AX 最佳实践检查工具并记录偏差。\n- 执行代码审查以：\n  - 确保编码符合规定的设计模式。\n  - 检查源代码以检测并移除潜在的安全漏洞。\n\
  \n## 稳定化阶段\n\n这是软件几乎处于稳定状态（即功能完整）并可作为系统进行审查的阶段。在此阶段，安全推进超出了早期阶段进行的安全审查。在此阶段进行代码审查不仅提供了审查新代码的机会，还提供了从整体新视角审查修改后的代码和核心\
  \ Dynamics AX 代码的机会。\n\n在 Dynamics AX 中，Microsoft 建议执行以下活动：\n\n- 审查专门设计用于提高可信度（即可靠性、安全性和隐私性）的特性和功能。安全开发生命周期设计阶段进行的风险分析可用于识别此类特性和功能。\n\
  - 对整体代码进行全面审查：即新代码和更新的代码。现有代码的影响也应予以考虑。\n\n## 发布阶段\n\n发布阶段的主要活动是进行最终安全审查（FSR）。该活动在实施或交付产品前几个月进行。FSR\
  \ 应由独立的安全团队在非安全问题最少时进行。FSR 不仅应考虑范围内产品的健康状况，还应考虑之前报告的问题。之前报告的问题可揭示安全问题的模式以及此类问题尚未发现的其他领域。它还可能有助于理解根本原因并采取纠正和预防措施。\n\
  \n## 支持/维护阶段\n\n软件应用不可能 100% 安全——即使今天是 100% 安全，明天也肯定会因发现新型攻击而变得脆弱。应建立支持系统以应对新发现的安全漏洞。响应应包括：\n\
  \n- 评估漏洞并发布咨询和/或更新。\n- 对漏洞进行事后分析，并分析产品中出现类似漏洞的可能性并采取预防措施。\n- 向安全团队报告新识别的漏洞，以便为同一产品或其他产品的未来版本添加合适的测试用例。\n\
  \n## 威胁建模\n\n威胁建模是一种安全分析技术，用于识别和记录威胁以实现以下目标：\n\n- 识别风险\n- 分析风险\n- 识别威胁的可能补救或缓解措施\n\
  - 帮助设计、开发和测试团队分别改进设计、安全开发和测试的安全方面\n\n为实现上述目标，威胁建模有三个主要活动：即理解对手的视角、表征安全以及确定、分析和记录威胁。\n\
  \n## 如何进行威胁建模\n\n进行威胁建模时，有必要分析系统架构以找到入口点和资产并将其与信任级别交叉引用。入口点或接口是架构中数据和/或控制流在被考虑进行威胁建模的系统与任何其他系统之间转移的位置。所有入口点或接口必须被识别和记录，而不论接口处的信任级别如何。这里的信任级别是指外部实体合法使用这些接口应拥有的权限。\n\
  \n这些接口包括以下内容：\n\n- 打开的套接字\n- 远程过程调用（RPC）接口\n- Web 服务接口\n- 从文件系统读取的数据\n\n在识别入口点后，应识别恶意用户可能滥用的资产（例如操纵、窃取等）。通常受影响最大的资产是接口点处的实体，但它们也可以是其他事物，例如进程令牌、未加密的密码等。所有可能成为威胁目标的资产都应被识别并与信任级别交叉引用。这里的信任级别是指允许访问或以某种方式影响资产所需的权限级别。\n\
  \n\n\nAfter identifying entry points or interfaces, the next step of threat modeling\
  \ is characterizing the security of the system, which involves binding the threat\
  \ model, gathering information about dependencies that are security critical, and\
  \ understanding the internal component structure working of the system. Once this\
  \ is done, usage scenarios are studied in order to understand how the system will\
  \ be used. This will help understand the use scenarios beyond the security architecture.\
  \ After use scenarios, the dependencies are studied, as some of the dependencies\
  \ on other systems may affect the security of the system under consideration for\
  \ threat modeling.\n\n在识别出入口点或接口之后，威胁建模的下一步是描述系统的安全性，这涉及绑定威胁模型、收集安全关键的依赖项信息，以及理解系统的内部组件结构和工作方式。完成此步骤后，会研究使用场景以了解系统将如何被使用。这有助于理解超出安全架构的使用场景。在研究使用场景之后，会研究依赖项，因为对其他系统的某些依赖可能会影响正在进行威胁建模的系统的安全性。\n\
  \nAfter collecting all the information, the system is modeled as a data flow diagram\
  \ or control flow diagram to understand the system action for various use scenarios\
  \ and data or control flow across the trust boundaries, etc. The objective of this\
  \ activity is to know the following:\n\n收集所有信息后，系统被建模为数据流图或控制流图，以便了解各种使用场景下的系统行为以及跨信任边界的数据或控制流等。此活动的目标是了解以下内容：\n\
  \n- How are protected resources affected?\n- 受保护资源如何受到影响？\n- Where could an external\
  \ entity manipulate an asset?\n- 外部实体可能在何处操纵资产？\n- What kind processing occurs beyond\
  \ entry points?\n- 入口点之外进行何种处理？\n- How is the information used beyond entry points?\n\
  - 入口点之外信息如何被使用？\n- What processing or action is done on behalf of external entities?\n\
  - 代表外部实体执行了何种处理或操作？\n\nNow all the threats should be documented with all the information\
  \ such as description of the threat, the target of the attack, the risk of the attack,\
  \ the possible technique for the attack, and strategy to manage the risk. Now every\
  \ threat has enough details to review these threats and prioritize them. Some of\
  \ them may not be great enough to address. The DREAD model may be used to prioritize\
  \ the threats. DREAD is discussed in Chapter 8.\n\n现在所有威胁都应记录下来，并包含所有信息，例如威胁描述、攻击目标、攻击风险、可能的攻击技术以及管理风险的策略。现在每个威胁都有足够的细节来审查这些威胁并对其进行优先级排序。其中一些可能不足以处理。DREAD\
  \ 模型可用于对威胁进行优先级排序。DREAD 在第 8 章中讨论。\n\n## Summary\n\n## 摘要\n\nIn this chapter we\
  \ discussed trustworthy computing, the components of trustworthy computing, and\
  \ how we can achieve trustworthiness. We also discussed phased activities in the\
  \ security development lifecycle.\n\n本章我们讨论了可信计算、可信计算的组件以及如何实现可信性。我们还讨论了安全开发生命周期中的分阶段活动。\n\
  \nLast but not the least, we discussed threat modeling, which can be considered\
  \ as the foundation for trustworthy computing.\n\n最后但并非最不重要的是，我们讨论了威胁建模，它可以被视为可信计算的基础。\n\
  \n## 6 Testing\n\n## 6 测试\n\nIn the last few chapters we discussed the characteristics\
  \ of an ERP system and Dynamics AX as an ideal ERP system. Since we need to customize\
  \ it for every implementation, it is imperative that we preserve the qualities that\
  \ make Dynamics AX an ideal ERP system. We also discussed the best practices that\
  \ should be followed during customization to preserve the qualities of Dynamics\
  \ AX.\n\n在最近几章中，我们讨论了 ERP 系统的特征以及 Dynamics AX 作为理想 ERP 系统的特征。由于我们需要为每次实施进行定制，因此必须保留使\
  \ Dynamics AX 成为理想 ERP 系统的品质。我们还讨论了在定制过程中应遵循的最佳实践，以保留 Dynamics AX 的品质。\n\nNow we\
  \ need to verify if the best practices are followed during customization. In this\
  \ chapter we will discuss various types of testing, which will cover verification\
  \ for most of the best practices. IBI references are provided so that readers working\
  \ with IBI-compliant projects can easily demonstrate IBI compliance. For each type\
  \ of testing we will discuss the following:\n\n现在我们需要验证在定制过程中是否遵循了最佳实践。本章将讨论各种类型的测试，这将涵盖大多数最佳实践的验证。提供了\
  \ IBI 参考，以便从事符合 IBI 标准的项目的读者能够轻松证明其符合 IBI 标准。对于每种类型的测试，我们将讨论以下内容：\n\n- Test objectives\n\
  - 测试目标\n- Technique\n- 技术\n- Expected results\n- 预期结果\n- Completion criterion\n\
  - 完成标准\n- Special considerations\n- 特殊考虑\n- Responsibility (i.e. most suitable person\
  \ to conduct given testing)\n- 责任（即最适合执行给定测试的人员）\n- Deliverables\n- 交付物\n- IBI reference\n\
  - IBI 参考\n\n## Unit Testing\n\n## 单元测试\n\nAs in any project, unit testing is the\
  \ first level of testing where most of the defects should be caught. The objective\
  \ of this testing is to verify that the labels, validations, boundary conditions,\
  \ flow, and calculations are coded as per the defined standards and requirements.\n\
  \n与任何项目一样，单元测试是测试的第一层级，其中应捕获大多数缺陷。此测试的目标是验证标签、验证、边界条件、流程和计算是否按照定义的标准和要求进行编码。\n\n\
