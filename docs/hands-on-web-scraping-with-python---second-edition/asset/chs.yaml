  \n## Technical requirements\n\n我们将使用安装在 Windows 上的 Python 3.11.1。代码编辑器的选择很多；选择一个方便您使用且能处理本章代码示例中使用的库的编辑器。我们将并行使用来自\
  \ Jupyter 的 Notebooks 和 JupyterLab (https://jupyter.org/)、集成开发和学习环境 (IDLE)（来自 Python\
  \ 的默认编辑器）以及 Windows 的命令提示符 (cmd)。\n\n要跟上本章的学习，您需要安装以下应用程序：\n\n- Python 3.11.* 或适用于您操作系统的最新版本，来自\
  \ https://www.python.org/downloads/\n- pip Python 包管理工具 (https://pypi.org/project/pip/)\n\
  - JupyterLab (https://jupyter.org/install) 用于访问 .ipynb 扩展名的笔记本或文件\n- Google Chrome、Mozilla\
  \ Firefox 或任何其他配备开发者工具 (DevTools) 的网络浏览器\n- JetBrains PyCharm (https://www.jetbrains.com/pycharm/)、Visual\
  \ Studio Code (https://code.visualstudio.com/) 或您习惯使用的任何编辑器\n\n本章所需的 Python 库如下：\n\
  \n- requests\n- urllib\n\n本章的代码文件可在 GitHub 上在线获取：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter02。\n\
  \n## Why Python (for web scraping)?\n\nPython 是一种流行的编程语言，用于编写各种类型的应用程序，从简单的脚本到软件开发、ML/AI\
  \ 算法和 CLI/GUI 应用，以及创建 Web 应用程序。Python 简单的面向对象编程 (OOP) 语法非常易读，这使得开发人员可以用不多行代码编写代码并在不同平台上工作（这意味着\
  \ Python 是平台独立的），使其成为编程语言中的首选。\n\nPython 是当今编程领域的热门词汇。相当多的工具和 Web 应用程序都是使用 Python\
  \ 生产和管理的，它兼容小型和大型应用，并由其全球开发者社区提供充足且最新的库。\n\n网络抓取需要各种工具和技术来从网站收集数据，以满足个人或业务需求，但同时要考虑到任何法律限制。使用\
  \ Python，我们可以使用许多有效的库来访问和管理项目，例如 `requests`、`http`、`urllib`、`json`、`csv` 和 `cookielib`。\n\
  \nPython 开发以及 Python 语言本身都在不断增长并定期更新。它解决了大多数市场需求，帮助用户提高生产力，同时为开发人员提供有效高效的库。在撰写本书时，Python\
  \ 的版本 3.11.1 可在 `https://www.python.org` 获取，如 *Figure 2.3* 所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_48_0.png)\n\
  \nFigure 2.3: Python website (latest versions, jobs, and documentation)\n\nPython\
  \ 还拥有在全球备受推崇的用于各种任务和领域的库。这些库在 Python 社区中很有名：\n\n- `requests`、`http`、`urllib`、`cookielib`\
  \ 和 Starlette：用于 **HTTP** 通信\n- `lxml`、PyQuery 和 BeautifulSoup：用于 **HTML**、**XML**\
  \ 和 **DOM** 解析\n- `json` 和 `csv`：用于文件管理和内容管理\n- `numpy` 和 `pandas`：用于处理和分析数值和表格数据\n\
  - `scipy`：用于科学计算\n- `nltk`、textblob 和 vader：用于 NLP\n- PyTorch：一个开源 ML 框架\n- `scikit-learn`：用于预测性数据分析的高效工具\n\
  - `matplotlib`、seaborn 和 plotly：可视化库\n- PySpark：用于处理大数据、流式传输和块管理\n- FastAPI、Flask\
  \ 和 Django：基于 Web 的框架\n- Pydantic 和 Pandera：数据验证和数据测试工具包\n- PyArrow：用于互操作性和集成 Python\
  \ 对象\n\n有关这些库的更详细信息，请访问 https://www.python.org、https://pypi.org 和 https://pymotw.com/3/。\n\
  \n在本节中，您学习了 Python、其流行度、一些库以及 Python 在顶级公司中的使用。在下一节中，我们将设置 Python、安装所需的库并使用 Python\
  \ 与 Web 通信。\n\n## Accessing the WWW with Python\n\n正如我们在 Why Python (for web scraping)?\
  \ 部分所看到的，有许多 Python 库可用于与 HTTP 交互。requests 和 urllib 是我们感兴趣使用的两个库，因为它们具有深入的功能、处理\
  \ HTTP 通信的各种函数、易于阅读的文档和流行度。\n\n为了开始使用这些库通过 Python 访问万维网，让我们验证是否已安装所有必需资源。在以下小节中，我们将开始设置，例如安装\
  \ Python、创建虚拟环境、在创建的环境中安装库以及使用 Python 库访问 Web。\n\n### Setting things up\n\n假设您系统上已安装了最新版本的\
  \ Python。如果没有，请访问 https://www.python.org/downloads/ 获取适用于您操作系统的最新 Python 版本。关于通用设置和安装程序，请访问\
  \ https://docs.python.org/3/using/windows.html 并按照详细步骤操作。\n\n> **Important note**\n\
  > 在安装期间，Python 用户可以选择 **Customize Installation** 并选择诸如 **Add Python... to PATH**\
  \ 之类的功能。此外，对于初学者和中级用户，建议使用易于定位的位置或根文件夹来设置 Python，例如 C:\\Python311 或 D:\\Python\\\
  Py311。\n\n我们将在 Windows 上使用 Python 3.11.1。安装完成后，我们可以使用以下步骤确认 Python 在操作系统中的可用性：\n\
  \n1. 按 Windows + R 打开运行窗口并输入 cmd 以加载命令行界面 (CLI)。\n2. 移动到您的根目录或所需路径。\n3. 输入 python\
  \ -h。这将加载 Python 选项，如 Figure 2.4 所示：\n\n\n\n\n\n在 *Figure 2.6* 中，我们导入了 `sys` 库（也称为\
  \ system），并且 `sys` 有一个名为 `version` 的属性，用于显示当前的 Python 版本以及一些系统信息。有关 sys 和 IDLE 的更多信息，请分别访问\
  \ `https://docs.python.org/3/library/sys.html` 和 `https://docs.python.org/3/library/idle.html`。\n\
  \n默认的 Python 安装会安装大部分内部或默认库（sys、urllib、os、math 等），但如果我们想要使用不可用的库，系统会抛出 `ModuleNotFoundError`\
  \ 错误，如 *Figure 2.7* 所示：\n\n```\n```text\n>>> import urllib\n>>> import requests\n\
  Traceback (most recent call last):\n  File \"<pyshell#3>\", line 1, in <module>\n\
