  \ in web pages* 中进一步探讨。请访问 MDN Web 文档中的 HTTP 页面（https://developer.mozilla.org/en-US/docs/Web/HTTP）以获取有关\
  \ HTTP 及相关概念的更详细信息。请访问 https://www.softwaretestinghelp.com/best-proxy-server/ 以获取有关最佳代理服务器的信息。\n\
  \n你现在已经了解了有关 HTTP 的一般概念（包括请求、响应、Cookie 和代理）。接下来，我们将了解用于创建 Web 内容或以某些预定义格式提供内容的\n\
  \n## HTML\n\n网站由包含文本、图像、样式表和脚本等内容的页面或文档组成。它们通常使用 **Hypertext Markup Language (HTML)**\
  \ 和 **Extensible Hypertext Markup Language (XHTML)** 等标记语言构建。\n\nHTML 通常被称为用于构建网页的标准标记语言。自\
  \ 1990 年代初以来，HTML 已独立使用，也与服务器端脚本语言（如 PHP、ASP 和 JSP）结合使用。XHTML 是 HTML 的高级扩展版本，是 Web\
  \ 文档的主要标记语言。XHTML 也比 HTML 更严格，从编码角度来看，也被视为使用 **Extensible Markup Language (XML)**\
  \ 构建的应用程序。\n\nHTML 定义并包含网页的内容。可以在 HTML 页面内找到可提取的数据和任何信息揭示的数据源，这些数据位于预定义指令集或称为标签的标记元素中。HTML\
  \ 标签通常是一个带有某些预定义属性的命名占位符，例如 `<a>`、`<b>`、`<table>`、`<img>` 和 `<script>`。\n\nHTML\
  \ 是一种容器或标记语言类型。构建 HTML 涉及各种因素；下一节将使用一些示例定义这些因素。\n\n### HTML 元素和属性\n\nHTML 元素（也称为文档节点）是\
  \ Web 文档的构建块。HTML 元素由开始标签 `<...>` 和结束标签 `</...>` 构建，中间包含某些内容。HTML 元素还可以包含属性，通常定义为\
  \ `attribute-name = attribute-value`，为元素提供额外信息：\n\n```\n```html\n<p>normal paragraph\
  \ tags</p>\n<h1>heading tags there are also h2, h3, h4, h5, h6</h1>\n<a href=\"\
  https://www.google.com\">Click here for Google.com</a>\n<img src=\"myphoto1.jpg\"\
  \ width=\"300\" height=\"300\" alt=\"Picture\" />\n<br />\n```\n```\n\n前面的代码可以分解如下：\n\
  \n- `<p>` 和 `<h1>` 是包含一般文本信息（元素内容）的 HTML 元素。\n- `<a>` 定义了 href 属性，其中包含当点击文本 **Click\
  \ here for Google.com** 时将被处理的实际链接。链接指向 `https://www.google.com/`。\n- `<img>` 图像标签还包含一些属性，如\
  \ src 和 alt 及其各自的值。`src` 的值保存资源，即图像地址或图像 URL，而 `alt` 保存 `<img>` 的替代文本值（主要在连接缓慢或图像无法加载时显示）。\n\
  - `<br />` 在 HTML 中表示换行符，没有属性或文本内容。它用于在文档布局中插入新行。\n\nHTML 元素也可以以树状结构嵌套，具有父子层级关系，如下所示：\n\
  \n```\n```html\n<div class=\"article\">\n    <p id=\"mainContent\" class=\"content\"\
  >\n        <b>Paragraph Content</b>\n        <img src=\"myLogo.png\" id=\"pageLogo\"\
  \ alt=\"Logo\"\n             class=\"logo\" />\n    </p>\n    <p>\n```\n\n```\n\
  ```html\n<h3> Paragraph Title: Web Scraping</h3>\n</p>\n</div>\n```\n```\n\n如前面的代码所示，两个\
  \ `<p>` 子元素位于 HTML `<div>` 块内。两个子元素都带有某些属性以及作为其内容的不同子元素。通常，HTML 文档以上述结构构建。\n\n如最后一个示例中前面的代码块所示，有一些额外的键值对。下一节将探讨这一点。\n\
  \n### 全局属性\n\nHTML 元素可以包含一些额外信息，例如键值对。这些也称为 HTML 元素属性。属性保存值并提供标识，或包含在抓取活动中的许多方面可能有帮助的额外信息，例如识别确切的\
  \ Web 元素并从中提取值或文本以及遍历（*移动沿着*）元素。\n\n某些属性是 HTML 元素的通用属性或可应用于所有 HTML 元素。以下列表提到了一些被识别为全局属性的属性（https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes）：\n\
  \n- `id`：该属性的值应唯一于其应用的元素\n- `class`：该属性的值主要与 CSS 结合使用，提供相等状态的格式化选项，可用于多个元素\n- `style`：这为元素指定内联\
  \ CSS 样式\n- `lang`：这有助于识别文本的语言\n\n> **重要说明**\n> \n> `id` 和 `class` 属性主要用于标识或格式化单个元素或其组。这些属性也可以由\
  \ CSS 和其他脚本语言管理。当与 CSS 一起使用或在遍历和应用解析技术时，可以通过在属性名称前分别放置 `#` 和 `.` 来识别这些属性。\n\nHTML\
  \ 元素属性也可以使用脚本语言动态覆盖或实现。如以下示例所示，`itemscope` 属性用于向元素添加属性，而 `data-*` 用于存储元素本身固有的数据：\n\
  \n```\n```html\n<div itemscope itemtype=\"http://schema.org/Place\">\n    <h1 itemprop=\"\
  university\">University of Helsinki</h1>\n    <span>Subject: <span itemprop=\"subject1\"\
  >Artificial\n        Intelligence</span>\n```\n\n```\n</span><span itemprop=\"subject2\"\
  >Data Science</span>\n</div>\n<img class=\"dept\" src=\"logo.png\" data-course-id=\"\
  324\" datatitle=\"Predictive Analysis\" data-x=\"12345\" data-y=\"54321\" data-z=\"\
  56743\" onclick=\"schedule.load()\"/>\n```\n\nHTML 标签和属性在提取数据时非常有帮助。\n\n> **重要说明**\n\
  > 请访问 https://www.w3.org 或 https://www.w3schools.com/html 获取有关 HTML 的更详细信息。\n\n\
  在第 3 章中，我们将使用不同的工具探索这些属性。我们还将执行各种逻辑操作并将它们用于提取或抓取目的。\n\n我们现在对 HTML 和与 HTML 相关的一些重要属性有了一些了解。在下一节中，我们将学习\
  \ XML 的基础知识，也称为标记语言之父。\n\n## XML\n\nXML 是一种用于在互联网上分发数据的标记语言，具有用于编码可读且易于在机器和文档之间交换的文档的规则集。XML\
  \ 文件由 .xml 扩展名识别。\n\nXML 强调文本数据在各种格式和系统中的可用性。XML 设计用于携带便携式数据或存储在标签中的数据，而这些数据不是使用\
  \ HTML 标签预先定义的。在 XML 文档中，标签由文档开发者或自动化程序创建以描述内容。\n\n以下代码显示了一些示例 XML 内容：\n\n```\n\
  <employees>\n  <employee>\n    <fullName>Shiba Chapagain</fullName>\n    <gender>Female</gender>\n\
  \  </employee>\n  <employee>\n    <fullName>Aasira Chapagain</fullName>\n    <gender>Female</gender>\n\
  \  </employee>\n</employees>\n```\n\n在前面的代码中，<employees> 父节点有两个 <employee> 子节点，而每个子节点又包含\
  \ <fullName> 和 <gender> 的其他子节点。\n\n\n\n\n## JavaScript\n\n**JavaScript**（也称为 **JS**\
  \ 或 **JScript**）是一种用于编程 HTML 和在浏览器中运行的 Web 应用的编程语言。JavaScript 主要用于为网页添加动态功能并提供基于用户的交互。JavaScript、HTML\
  \ 和 CSS 是最常用的 Web 技术之一，现在它们也与无头浏览器一起使用（你可以在 `https://oxylabs.io/blog/what-is-headless-browser`\
  \ 阅读更多关于无头浏览器的内容）。JavaScript 引擎的客户端可用性也加强了其在应用测试和调试中的使用。\n\n`<script>` 包含使用 JavaScript\
  \ 变量、运算符、函数、数组、循环、条件和事件的编程逻辑，目标是 HTML **文档对象模型 (DOM)**。JavaScript 代码可以通过 `<script>`\
  \ 添加到 HTML 中，如以下代码所示，也可作为文件嵌入：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n   \
  \ <script>\n        function placeTitle() {\n            document.getElementById(\"\
  innerDiv\").innerHTML =\n                \"Welcome to WebScraping\";\n        }\n\
  \    </script>\n</head>\n<body>\n    <div>Press the button: <p id=\"innerDiv\"></p></div>\n\
  ```\n\n## AJAX\n\nAJAX 是一种 Web 开发技术，它使用客户端的一组 Web 技术来创建异步 Web 应用。\n\nJavaScript\
  \ XMLHttpRequest (XHR) 对象用于在网页上执行 AJAX，并在不刷新或重新加载页面的情况下加载页面内容。有关 AJAX 的更多信息，请访问\
  \ W3Schools 上的 AJAX 页面（https://www.w3schools.com/js/js_ajax_intro.asp）。从抓取的角度来看，对\
  \ JavaScript 功能的基本概述对于理解页面是如何构建或操作的以及识别使用的动态组件非常有价值。\n\n> **重要说明**\n> \n> 请访问 https://developer.mozilla.org/en-US/docs/Web/JavaScript、https://www.javascript.com/、https://www.w3schools.com/js/js_intro.asp\
  \ 和 https://www.w3schools.com/js/js_ajax_intro.asp 以获取有关 JavaScript 和 AJAX 的更多信息。\n\
  \n我们已经了解了一些今天在 Web 开发中常见的基于 JavaScript 的技术和工具。在下一节中，我们将学习关于数据存储对象的内容。\n\n## JSON\n\
  \nJSON 是一种用于从服务器向网页存储和传输数据的格式。它与语言无关，并且由于其大小和可读性，在基于 Web 的数据交换操作中很受欢迎。JSON 文件是具有\
  \ .json 扩展名的文件。\n\nJSON 数据通常格式化为 name:value 对，被评估为 JavaScript 对象并遵循 JavaScript 操作。JSON\
  \ 和 XML 通常被比较，因为它们都承载并在各种 Web 资源之间交换数据。JSON 通常因其结构而被评为高于 XML，其结构简单、可读、自描述、可理解且易于处理。\n\
  \n对于使用 JavaScript、AJAX 或 RESTful 服务的 Web 应用，JSON 由于其快速且易于操作而优于 XML。JSON 和 JavaScript\
  \ 对象可以互换。JSON 不是一种标记语言，它不包含任何标签或属性。相反，它是一种纯文本格式，可以通过服务器访问，并且可以由任何编程语言管理。\n\nJSON\
  \ 对象也可以表示为数组、字典和列表：\n\n```\n{\"mymembers\": [\n{ \"firstName\":\"Aasira\", \"lastName\"\
  :\"Chapagain\",\"cityName\":\"Kathmandu\"},\n{ \"firstName\":\"Rakshya\", \"lastName\"\
  :\"Dhungel\",\"cityName\":\"New Delhi\"},\n{ \"firstName\":\"Shiba\", \"lastName\"\
  :\"Paudel\",\"cityName\":\"Biratnagar\"},\n]}\n```\n\n你已经了解了 JSON，它是一个内容持有者。在下一节中，我们将讨论使用\
  \ CSS 进行 HTML 样式设置以及为 HTML 标签提供额外标识。\n\n> **重要说明**\n> \n> JSON 也以其在 Python 中提供的字典和列表对象的混合而闻名。JSON\
  \ 以字符串形式编写，我们可以找到大量将 JSON 字符串转换为 JSON 对象的网站，例如 `https://jsonformatter.org/`、`https://jsonlint.com/`\
  \ 和 `https://www.freeformatter.com/json-formatter.html`。\n> \n> 请访问 `http://www.json.org/`、`https://jsonlines.org/`\
  \ 和 `https://www.w3schools.com/js/js_json_intro.asp` 以获取有关 JSON 和 JSON Lines 的更多信息。\n\
  \n## CSS\n\n我们迄今为止介绍的基于 Web 的技术处理内容，包括绑定、开发和处理。CSS 描述了 HTML 元素的显示属性和网页的外观。CSS 用于样式设置并提供\
  \ HTML 元素的所需外观和呈现。\n\n通过使用 CSS，开发人员/设计师可以控制 Web 文档的布局和呈现。CSS 可以应用于页面中的特定元素，也可以嵌入到单独的文档中。样式细节可以使用\
  \ `<style>` 标签描述。\n\n`<style>` 标签可以包含针对块中重复和各种元素的细节。如以下代码所示，存在多个 `<a>` 元素，并且它还具有\
  \ `class` 和 `id` 全局属性：\n\n```html\n<html>\n<head>\n<style>\na{color:blue;}\nh1{color:black;\
  \ text-decoration:underline;}\n#idOne{color:red;}\n.classOne{color:orange;}\n</style>\n\
  </head>\n<body>\n<h1> Welcome to Web Scraping </h1>Links:<a href=\"https://www.google.com\"\
  > Google </a> &nbsp;\n<a class='classOne' href=\"https://www.yahoo.com\"> Yahoo\
  \ </a>\n<a id='idOne' href=\"https://www.wikipedia.org\"> Wikipedia </a>\n</body>\n\
  </html>\n```\n\n使用 CSS 属性提供的属性或在前述代码块中 `<style>` 标签内样式化的属性将导致图 1.4 所示的输出：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_35_0.png)\n\
  \n图 1.4：使用 CSS 的 HTML 代码输出\n\n尽管 CSS 用于管理 HTML 元素的外观，但 CSS 选择器（用于选择元素或元素位置的模式）在抓取过程中通常发挥主要作用。我们将在第\
  \ 3 章详细探讨 CSS 选择器。\n\n> **重要说明**\n> \n> 请访问 https://www.w3.org/Style/CSS/ 和 https://www.w3schools.com/css/\
  \ 以获取有关 CSS 的更详细信息。\n\n在本节中，你了解了一些可用于 Web 抓取的技术。在即将到来的部分中，你将学习关于数据查找技术。它们大多数都是用你已经介绍过的\
  \ Web 技术构建的。\n\n## Web 页面中使用的数据查找技术\n\n要从网站或网页中提取数据，我们必须确定数据确切位于何处。这是自动化从 Web 收集数据的过程中最重要的一步。\n\
  \n当我们在 Web 浏览器中浏览或请求任何 URL 时，我们可以看到内容作为对我们的响应。这些内容可以是动态添加的值，或通过处理某些 API 或 JavaScript\
  \ 代码动态生成或渲染到 HTML 模板中。知道响应内容的 URL 或查找内容在某些文件中的可用性是抓取的第一步。内容也可以使用第三方来源检索，有时甚至嵌入到最终用户视图中。\n\
  \n在本节中，我们将探索一些关键技术，这些技术将帮助我们识别、搜索和定位通过 Web 浏览器接收的内容。\n\n### HTML 源页面\n\nWeb 浏览器用于客户端-服务器基于\
  \ GUI 的交互以探索 Web 内容。浏览器地址栏提供 Web 地址或 URL，请求的 URL 与服务器（主机）通信，并收到响应，这意味着它被浏览器加载。此获得的响应或页面源可以进一步探索并以原始格式搜索所需内容。\n\
  \n\n\n\n# 网页抓取基础\n\n> **重要说明**\n> \n> 你可以自由选择使用哪个网页浏览器。大多数网页浏览器会显示相同或相似的内容。我们将在本书的大部分示例中使用\
  \ Google Chrome，安装在 Windows 操作系统上。\n\n要访问 HTML 源页面，请按照以下步骤操作：\n\n- 1. 在你的网页浏览器中打开\
  \ `https://www.google.com`（你可以用任何其他 URL 尝试相同场景）。\n- 2. 页面完全加载后，*右键单击*页面的任意部分。*图\
  \ 1.5* 中显示的菜单应该可见，其中包含 **查看页面源代码** 选项：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_36_0.png)\n\
  \n图 1.5：查看页面源代码（右键单击任意页面并找到此选项）\n\n- 3. 如果你点击 **查看页面源代码** 选项，它将在浏览器中加载一个新标签页，如 *图\
  \ 1.6* 所见：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_37_0.png)\n\n图 1.6：页面源代码（网页浏览器中加载的新标签页，显示原始\
  \ HTML）\n\n你可以看到浏览器中会新增一个标签页，其中文本 **view-source:** 前置于原始 URL，https://www.google.com。同样，如果我们在\
  \ URL 中添加文本 *view-source:*，URL 加载后会显示页面源代码或原始 HTML。\n\n> **重要说明**\n> 你可以通过在页面源代码中搜索来在网页浏览器中查找任何文本或\
  \ DOM 元素。加载 URL https://www.google.com 并搜索 *web scraping*。使用页面源代码找到 Google 显示的部分内容。\n\
  \n我们现在对数据查找技术有一个基本概念。本节中使用的技术是主要或基础概念。还有一些更复杂的技术，附带大量功能和工具，有助于或指导我们在数据查找上下文中的工作——我们将在下一节中介绍它们。\n\
  \n## 开发人员工具\n\nDevTools 已嵌入当今市场上大多数浏览器中。开发人员和终端用户都可以识别和定位资源，并在客户端-服务器通信期间或在 HTTP\
  \ 请求和响应期间搜索网页内容。\n\nDevTools 允许用户检查、创建、编辑和调试 HTML、CSS 和 JavaScript。它们还允许我们处理和解决性能问题。它们促进了浏览器动态或安全呈现的数据提取。\n\
  \nDevTools 将用于大多数数据提取案例。有关 DevTools 的更详细信息，这里有一些链接：\n\n- **Google Chrome**：`https://developer.chrome.com/docs/devtools/`\n\
  - **Firefox**：`https://firefox-source-docs.mozilla.org/devtools-user/`\n\n与 *HTML\
  \ 源页面* 部分中讨论的 **查看页面源代码** 选项类似，当我们右键单击网页时，可以找到 **检查** 菜单选项，这也是查看页面源代码的另一种选择。\n\n\
  或者，你可以通过浏览器主菜单访问 DevTools。点击 **更多工具 | 开发人员工具**，或按 Ctrl + Shift + I，如 *图 1.7* 所见：\n\
  \n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_38_0.png)\n\n图 1.7：访问 DevTools（网页浏览器菜单栏）\n\
  \n让我们尝试在网页浏览器中加载 URL `https://en.wikipedia.org/wiki/FIFA`。页面加载后，请按照以下步骤操作：\n\n-\
  \ 1. **右键单击** 页面并点击 **检查** 菜单选项。\n  \n  我们会注意到浏览器中出现了一个新的菜单部分，其中包含标签 (**元素、控制台、来源、网络、内存**\
  \ 等)，如 *图 1.8* 所见：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_39_0.png)\n\n图 1.8：检查\
  \ DevTools 面板\n\n- 2. 按 Ctrl + Shift + I 访问 DevTools 或从检查菜单选项中点击网络标签，如图 1.9 所示：\n\
  \n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_39_1.png)\n\n图 1.9：DevTools 网络面板\n\n\
  ### 重要说明\n\n搜索和过滤字段，如图 1.9 所见，通常用于在 HTML 页面源代码或网络面板中可用的其他资源中查找内容。搜索框可以提供正则表达式模式——区分大小写的用于查找或定位内容的信息，静态或动态。\n\
  \n```\n<!DOCTYPE html>\n<html class=\"client-js ve-available\" lang=\"en\" dir=\"\
  ltr\">\n<head></head>\n<body class=\"skin-vector-legacy mediawiki ltr sitedir-ltr\
  \ mw-hide-empty-elt ns-0 ns-subject page-FIFA rootpage-FIFA ...\">\n<div id=\"mw-page-base\"\
  \ class=\"noprint\"></div>\n```\n\nDevTools 内部找到的所有面板和工具都有指定的角色。让我们接下来对其中几个重要的面板做一个基本概述。\n\
  \n## 探索 DevTools\n\n以下是 DevTools 中找到的所有面板和工具列表：\n\n- **元素**：显示所查看页面的 HTML 内容。这用于查看和编辑\
  \ DOM 和 CSS，以及查找 CSS 选择器和 XPath 内容。图 1.10 显示了在检查菜单选项中找到的图标，可以点击并移动到页面中的 HTML 内容或代码内部的元素面板，以定位\
  \ HTML 标签或 XPath 和 DOM 元素位置：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_40_0.png)\n\
  \n图 1.10：元素检查器或选择器\n\n此图标的作用类似于鼠标光标在屏幕上移动。我们将在第 3 章进一步探索 CSS 选择器和 XPath。\n\n> **重要说明**\n\
  > 在元素或网络 | 文档面板中显示或定位的 HTML 元素可能在页面源代码中不可用。\n\n- **控制台**：用于运行和与 JavaScript 代码交互，并查看日志消息。\n\
  - **来源**：用于导航页面并查看可用的脚本和文档来源。脚本化工具可用于诸如脚本执行（即恢复和暂停）、单步执行函数调用、激活和停用断点以及处理异常等任务。\n\
  - **网络**：为我们提供 HTTP 请求和响应相关资源。这里找到的资源具有记录数据到网络日志、捕获屏幕截图、过滤网络资源（JavaScript、图像、文档和\
  \ CSS）、搜索网络资源以及分组网络资源等选项，也可用于调试任务。图 1.11 显示了通过从网络面板内的文档选项访问标头标签访问的 HTTP 请求 URL、请求方法、状态代码等。\n\
  \n对于上面列出的每个过滤选项，在名称面板中为所选资源提供了一些子标签，分别是：\n\n- **标头**：加载特定请求的 HTTP/HTTPS 标头数据。还找到了一些重要且基于自动化的类型数据，例如，请求\
  \ URL、方法、状态代码、请求/响应标头、查询字符串、负载或 POST 信息。\n- **预览**：提供找到的响应的预览，类似于在网页浏览器中查看的实体。\n\
  - **响应**：加载特定实体的响应。此选项卡显示 HTML 页面的 HTML 源代码、JavaScript 文件的 JavaScript 代码以及类似文档的\
  \ JSON 或 CSV 数据。它实际上显示了内容的原始源。\n- **发起者**：提供发起者链接或发起者 URL 链。它类似于请求标头中的 referer。\n\
  - **时间**：显示资源调度、连接开始以及请求/响应之间的时间分解。\n- **Cookie**：提供 cookie 相关信息，其键和值以及到期日期。\n\n\
  > **重要说明**\n> **网络** 面板是最重要的资源中心之一。我们可以在此面板中找到/追踪每个请求/响应周期的大量信息和支持细节。有关 **网络** 面板的更详细信息，请访问\
  \ https://developer.chrome.com/docs/devtools/network/ 和 https://firefox-source-docs.mozilla.org/devtools-user/network_monitor/。\n\
  \n- **性能**：可以记录屏幕截图和内存时间线。获得的视觉信息用于优化网站速度、改善加载时间以及分析运行时或整体性能。\n- **内存**：从此面板获得的信息用于修复内存问题并追踪内存泄漏。总的来说，**性能**\
  \ 和 **内存** 面板中的详细信息允许开发人员分析网站性能并进行与优化相关的进一步规划。\n- **应用程序**：最终用户可以检查和管理页面加载期间加载的所有资源存储。可以在此处查看甚至删除与\
  \ cookie、会话、应用程序缓存、图像、数据库等相关的信息，以创建新会话。\n- **安全**：此面板可能并非在所有网页浏览器中都可用。它通常显示安全相关信息，例如资源、证书和连接。我们甚至可以浏览有关证书的更多详细信息，从此面板中可用的几个详细信息链接或按钮，如图\
  \ 1.12 所示：\n\n\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_43_0.png)\n\nFigure 1.12:\
  \ Security panel (details about certificate, connection, and resources)\n\n在探索了\
  \ HTML 页面源代码和 DevTools 之后，我们现在对数据和请求/响应相关信息存储的位置以及如何访问它有了一些概念。总的来说，抓取过程涉及从网页中提取数据，我们需要识别或定位具有数据或可以承载数据的资源。在进行数据探索和内容识别之前，识别页面\
  \ URL、DevTools 资源、XHR、JavaScript 以及浏览器活动概览是有益的。\n\n最后，还有更多与链接、子页面相关的话题。我们将在第 3 章中深入使用\
  \ sitemaps.xml 和 robots.txt 等技术。\n\n> **Important note**\n> 有关 sitemaps.xml 和 robots.txt\
  \ 的基本概念，请访问 Sitemaps 网站 (https://www.sitemaps.org) 和 Robots Exclusion Protocol 网站\
  \ (http://www.robotstxt.org)。\n\n在本章中，您学习了网络抓取、涉及的网络技术，以及如何使用数据查找技术。\n\n## Summary\n\
