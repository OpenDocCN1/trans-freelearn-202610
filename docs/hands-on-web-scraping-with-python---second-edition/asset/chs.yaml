- "## 11 机器学习与网页抓取\n\n到目前为止，我们已经学习了数据提取、数据存储，以及使用多个 Python 库从数据中获取和分析信息。本章将为您提供机器学习（ML）的入门信息，并附带一些示例。\n\
  \n网页抓取涉及研究一个网站，识别可收集的数据元素，并规划和处理脚本以提取和收集数据到数据集或文件中。这些收集到的数据将被清洗和进一步处理以生成信息或有价值的见解。ML\
  \ 是人工智能（AI）的一个分支，通常处理统计和数学过程。ML 用于开发、训练和评估算法，这些算法可以自动化、从输出中持续学习并最大限度地减少人工干预。\n\n\
  ML 使用数据进行学习、预测、分类和测试情况，以及许多其他功能。数据是使用网页抓取技术收集的，因此 ML（其性能）与抓取数据之间存在相关性。网页抓取主要与 ML\
  \ 关联，因为高质量的数据作为输入提供给 ML 算法。ML 也被认为可用于任何需要大量解释、迭代、处理大量数据（以 GB、TB 或 PB 计）、复杂数据集的任务，以及任何\
  \ ML 相比人类可以减少处理时间并减少错误的任务。\n\n在本章中，我们将学习以下主题：\n- ML 简介\n- 使用 scikit-learn 的 ML\n\
  - 情感分析\n\n## 技术要求\n\n需要一个网络浏览器（Google Chrome 或 Mozilla Firefox），我们将使用 JupyterLab\
  \ 进行 Python 代码。\n\n请参考第 2 章的“设置事项”和“创建虚拟环境”部分以继续设置和使用创建的环境。\n\n本章所需的 Python 库如下：\n\
  - scikit-learn（访问 https://scikit-learn.org/stable/install.html 进行安装）\n- textblob（访问\
  \ https://textblob.readthedocs.io/en/dev/install.html 进行安装）\n- vaderSentiment\n\
  - plotly\n- numpy\n- pandas\n- matplotlib\n\n本章的代码文件可在本书的 GitHub 仓库在线获取：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter11。\n\
  \n## ML 简介\n\n数据收集、分析和挖掘数据以提取信息是许多数据相关系统的重点议程。处理、分析和执行挖掘相关功能需要处理时间、评估和解释以达到期望状态。使用\
  \ ML，系统可以在相关或样本数据上进行训练，并且 ML 还可进一步用于评估和解释其他数据或数据集以获得最终输出。\n\n基于 ML 的处理与数据挖掘和预测建模类似，可以进行比较，例如，将收件箱中的电子邮件分类为垃圾邮件和非垃圾邮件。垃圾邮件检测是一种根据内容对电子邮件进行分类的决策。系统或垃圾邮件检测算法在输入或数据集上进行训练，可以区分电子邮件是否为垃圾邮件。\n\
  \nML 预测和决策模型依赖于数据。ML 模型可以建立在多个算法之上并使用这些算法，从而使系统能够提供最接近的预测和准确结果。在特定数据集上训练的模型也可以应用于新数据集，整合新数据并从额外收集的数据或从抓取器或爬虫获得的实时数据中学习。存在具有这些能力的\
  \ ML 系统，并帮助应用程序实现期望的输出，例如以下列出的：\n- 股价预测\n- 电影分类\n- 情感分析（**自然语言处理（NLP）**）\n- 疾病预测\n\
  - 天气预报\n- 客户支持和翻译\n- 推荐工具\n- 欺诈检测系统和网络安全\n- 文字转语音\n- 图像识别\n- 机器或自动驾驶车辆\n- 定时分析和报告\n\
  \nML 的适用性无界；它可用于研究和学习、健康和医学、商业和营销等领域。ML 中存在一些常见挑战（从数据角度来看）：\n- 数据质量\n- 无偏数据\n- 数据可用性有限\n\
  \nML 模型是在数据上训练的。原始数据大多数时候是无结构的、不完整的，并且可能还包含一些缺陷。以下部分将提供有关 ML 的基本信息。\n\n在下一节中，将介绍在数学和\
  \ ML 相关领域经常使用的 Python 库。\n\n## ML 与 Python 编程\n\nPython 也被称为科学计算的编程语言。Python 的流行、其工具和可用库的完善文档，以及易用性、可维护性和多功能性，使\
  \ Python 成为 ML 和 AI 相关开发的首选。\n\n在接下来的部分中，我们将介绍一些流行的 Python 库。为了展示 Python 在 ML 和\
  \ AI 等领域的使用方式，接下来的部分提到了一些对使用 Python 编程开始 ML 和 AI 之旅非常有用的重要库。\n\n在下一节中，我们将识别某些类型的数据，因为输入\
  \ ML 算法的数据类型是需要考虑的重要因素。\n\n## 数据类型\n\n数据是可以用来生成期望输出的原材料。数据也可以被分类。ML 算法也是根据可用作输入的特定格式的数据类型进行分类的。不仅仅是基本数据类型，如数字（整数、小数或复数），还有布尔值、字符串等。\n\
  \n在我们进行 ML 项目时，经常会遇到数据处理和数据预处理的话题。数据在 ML 中的这一方面是关于准备、清洗和组织数据集，甚至将数据集转换为易于识别且准备好进行构建和训练\
  \ ML 模型的格式。该过程确保输入的准确性，并减少可能不必要消耗的时间。在第 10 章中，类似的话题已通过示例介绍。\n\n这里，我们谈论的是数据类别——尽管大多数\
  \ AI 和 ML 库和框架接受各种类型的数据，提供主要类型或所需类型将增强并确保期望的结果。以下是几种数据类型：\n- **定量**：具有数值的数据——可以计数和测量的数字。它在统计和数据分析项目的客观结果中发挥重要作用。散点图和折线图等图表主要用于可视化。定量数据可以是以下类型：\n\
  \  - **离散**：包括可计数的整数或具体数字。例如，球队中的总球员数、班级中的女学生数或家中的孩子数。\n  - **连续**：数据可能复杂、随时间变化或无限，只能测量而不能计数。例如，身高和体重、银行利率、鞋码或体温。\n\
  - **定性**：数据类别或分组，无法以数值格式表达。它大多数时候用于主观结果，因为这种类型的数据表达了数据的质量和特征。条形图、水平条形图和饼图等图表主要用于可视化此类数据。定性数据可以是以下类型：\n\
  \  - **结构化**：此数据可以是数字，但不适用于数学运算：\n    - **名义**：以标签形式存在的值，没有顺序或排名，例如，性别、宗教或国家\n \
  \   - **二元**：只有两个选项，例如，是或否、真或假、通过或失败、好或坏\n    - **序数**：可计数但不可测量，具有某种相关顺序，例如，血型、学业成绩、排名或电影评分\n\
  \  - **非结构化**：没有适当格式，例如，图像或声音\n\n\n\n\n\n定性数据收集自访谈和调查，其大多为非结构化、描述性和主观性的，需要大量的交互和解读。收集（抓取）和存储也比较困难。数据湖和非关系型**数据库管理系统（DBMSs）**通常被推荐用于存储此类数据。使用定性数据进行编码是一项挑战，因为它需要多轮处理和理解数据。\n\
  \n另一方面，定量数据大多结构化，易于获取，可存储在数据仓库和**关系型数据库管理系统（RDBMSs）**中。它也易于编码、搜索和分析。\n\n> **重要说明**\n\
  > 从分析角度来看，如果定性数据未以正确的方式处理和准备，则易受多种风险因素的影响。Python 中有 ML 和分析库可协助将定性数据转换为定量数据（使用*演绎编码*、*归纳编码*，以及各种分析方法，如*内容分析*、*主题分析*、*扎根分析*和*文本向量化*）。\n\
  \n在下一节中，我们将列出具有科学和统计意义的 Python 库。\n\n## *Python 用于统计和数值计算*\n\nML 相关算法甚至模型的开发都使用统计和数学概念。Python\
  \ 提供了各种内置、可安装和开源模块用于数学和统计目的。\n\n以下是从统计和数学角度来看的几个重要库：\n\n- `numpy`：该 Python 库用于数值和科学计算，还处理*n\
  \ 维矩阵、数组、线性代数*等。请访问 `https://www.numpy.org` 了解详细信息。\n- `statsmodel`：一个用于*统计计算、统计建模、假设检验、数据探索、估计*等的库。请访问\
  \ `https://www.statsmodels.org` 了解详细信息。\n- `scipy`：一个用于科学计算的 Python 库。`scipy` 用于*统计、线性代数、优化算法、n\
  \ 维插值*等。请访问 `https://scipy.org` 了解详细信息。\n\n我们刚刚列出的库都相当庞大——不断增长——在其各自领域深入覆盖了功能和特性。也可能存在模块之间某些常见功能的重叠，但开发者会发现库之间的重叠和相似之处，并选择最适合其实现的库。\n\
  \n还有大量 Python 包和项目建立在现有库的某些重要功能之上，例如 `numpy` 和 `scipy`，以及标准库，例如 `math`、`cmath`、`random`\
  \ 和 `statistics`。请访问 `https://docs.python.org/3/library` 了解有关 Python 标准库的更多信息，以及\
  \ `https://pypi.org` 了解有关第三方和开源库的更多信息。\n\n> **重要说明**\n> \n> `https://pypi.org`（**Python\
  \ 包索引**）是一个可找到包链接和通常完整细节的存储库，包括其主页、错误修复等。开发者也可以提交其项目以发布给全球 Python 受众和开发者。\n\n在下一节中，我们将学习一些专门用于\
  \ ML 项目的 Python 库。\n\n## Python 库用于 ML\n\n在本节中，我们将探索一些在 Python 编程中相当流行的库，尤其是在 ML\
  \ 和 AI 领域。统计和数学程序在 ML 中是必不可少的且被理解的。我们可以找到数十个专门用于 ML 的 Python 库和框架。此类库的数量在以下几个重要方面迅速增长：\n\
  \n- 适用于大量数据\n- 能够处理不同类型的数据\n- 可在各种系统和环境中部署和管理\n- 可与挖掘、分析、可视化、多层处理等进行适配\n\nML 和 AI\
  \ 领域的框架和库必须对变化（研究和环境）开放。ML 实施和范围的例子很多。以下是一些选定的 Python 模块，它们在 ML 和 AI 领域使用 Python\
  \ 编程做出了、并且正在做出卓越的实践影响：\n\n- **PyTorch**：一个基于 `torch` 库的开源深度学习库和 ML 框架，用于研究和生产。快速执行、处理非常大的数据集的能力、基于云的访问和支持，以及比竞争对手库更好的调试能力，使\
  \ PyTorch 更具意义。它在计算机视觉和 NLP 领域也很流行。请访问 `https://pytorch.org` 了解更多信息。\n- **TensorFlow**：来自\
  \ Google 的免费开源 AI 和 ML 库，主要用于深度神经网络。其可扩展性、灵活性、与 ML 模型开发、训练和再训练相关的流程、高速度处理能力、部署简便性以及在各种平台上的适用性，使\
  \ TensorFlow 成为其竞争对手中最好的之一。请访问 `https://www.tensorflow.org` 了解更多详情。\n\n## 监督学习\n\
  \n在此类学习中，机器使用训练数据（标记数据）提供或训练，最终基于训练数据预测或分类输出。输出基于提供的输入数据，算法从训练数据中学习。如果我们想要尽可能接近的输出或预测，必须有高质量的数据集（干净、格式化、预处理完成，并进行\
  \ EDA）。这里，输出变量依赖于输入变量。\n\n以下是解释监督学习技术如何工作的几个步骤：\n\n- 1. 选择一个输入数据集，也称为标记数据集。\n- 2.\
  \ 将数据集拆分为训练集和测试集（通常训练 80%，测试 20%）。记录或行是随机或顺序选择的。\n- 3. 确定或挑选输入变量（或变量）。\n- 4. 选择适用的学习算法（如线性回归）。\n\
  - 5. 在训练集上执行所选算法，而模型效率用测试集进行评估。\n- 6. 如果输出或预测结果正确，则模型准确。如果不是，则使用不同算法重复步骤 1 到 5。\n\
  - 7. 向训练好的模型提供新数据并接收输出。\n\n> **重要说明**\n> \n> 如果输出未导致正确分类或未接近计算值，则再次使用 EDA 功能彻底分析输入数据集并进一步处理，并进行训练。在回归情况下，回归预测模型的有效性可通过计算**均方根误差（RMSE）**来衡量。\n\
  \n监督模型使用先前的观察、数据和输入来分类或预测新的输出。此类算法在日常基本活动中很有用。如果训练集和测试集的数据不同，则不会起作用。对于复杂、不准确的输入数据，这些模型需要大量计算，可能无法揭示准确结果。\n\
  \n监督学习可用于数据过滤、房屋价格预测、情感分析、垃圾邮件检测、图像分类、欺诈检测等。\n\n根据适用的问题，监督学习算法基本上分为两种类型——分类和回归。\n\
  \n## 分类\n\n根据属性对数据模型进行分组、识别或分类称为分类。分类技术通常涉及基于相似性或差异性的排列，也称为排序技术。在此技术中，类别或分类标签，也称为类，是预先确定或设定的。分类模型根据单个或多个自变量识别因变量属于哪个类别。\n\
  \n以下是一些常见的分类算法：\n\n- **线性分类器**：最简单的分类算法形式，它根据简单的线性函数对一组数据进行分类，假设数据可通过在图表上绘制直线线性区分。\n\
  - **支持向量机（SVM）**：一种根据边界（超平面）将数据分离到多个集合的分类器，通过检测重叠数据实现。如果维度大于样本数，则可使用 SVM。SVM 算法创建最接近不同维度线上的点，称为**支持向量（SVs）**。SVM\
  \ 算法在噪声较少（重叠）的数据集上产生高精度。异常值检测是 SVM 算法的主要优势之一。SVM 算法不太适合大型数据集，因为训练复杂度高，且模型在复杂边界上做出决策。\n\
  - **K-最近邻（kNN、k-NN 或 KNN）**：KNN 以高精度著称。它存储可用数据，基于相似性生成新数据点，并找到最近邻。它在 K 个邻居上计算*欧几里得距离*（两点之间）。KNN\
  \ 通常用于大型数据集之上。它也稍慢，因为它必须生成并计算新数据点之间的距离。\n- **决策树**：该算法使用一组规则来做出决策。规则以树结构形式设置，包含*根（问题）*、*分支（决策规则或决策节点）*和表示结果的*叶（叶节点）*。树分支节点可以有多个分支。通过应用规则，使用分类和定量数据将训练数据集分解为许多子集。树中的数据必须是数值。它类似于人类的思考能力和编码中深层嵌套的\
  \ if-elif 语句。分支数量大的决策树复杂且耗时。\n- **随机森林**：这是一组随机的*决策树*（一片森林），其中多个结果合并为一个值作为输出。随机森林也称为**集成学习**。它减少过拟合，因为结果通常是决策树的平均值。由于其对噪声数据集的适用性、可扩展性、训练时间短和结果高度准确，因此在大型数据集上使用。\n\
  \n分类学习可应用于各种情况；例如，衣服图像可按颜色名称分类，收件箱中的电子邮件可分类为垃圾邮件或非垃圾邮件，或可通过研究症状对常见疾病进行分类。\n\n\n\n\
  \n\n## 回归\n\n回归用于估计变量之间的关系，也被称为**预测算法**。回归模型试图确定因变量与一个或多个自变量之间关系的强度。回归中的输出变量通常是定量值。通常，回归技术用于根据一组给定的输入（称为**预测变量**）进行预测。处理回归算法需要扎实的统计学背景。\n\
  \n以下列举了几种常见的回归算法类型：\n\n- **线性回归：** 也称为**简单线性回归（SLR）**，用于根据一个自变量的值预测一个（因变量）值。它通过最佳拟合直线发现变量之间的线性相关性。它最适合小数据集，并产生连续输出。\n\
  - **多元线性回归：** 也称为**多重线性回归（MLR）**，是一种线性回归模型。它使用多于一个自变量和一个因变量来建模线性和非线性关系。输出反映了多个自变量与单个因变量之间的影响或关系。\n\
  - **逻辑回归：** 也被称为*统计回归*模型或概率算法，有助于分析数据集。该算法用于寻找最佳拟合模型，计算二元类型（如是和否）的概率。它还描述了二元（涉及两种可能结果）因变量与预测变量集之间的关系。就变量数量而言，该算法描述了多个自变量与单个因变量之间的关系。这种回归技术产生离散输出，主要用于分类相关问题。\n\
  - **多项式回归：** 多项式回归描述*非线性关系*。通常，如果因变量和自变量之间不可能存在线性关系，则可能是多项式回归的情况。多项式回归也被视为MLR的特例。通过训练好的模型，可以创建非线性方程并用于预测。\n\
  \n回归学习还有许多其他形式。衡量算法的有效性也相当具有挑战性。一些技术，如**普通最小二乘法（OLS）**和**R平方（R2）**，用于最大程度减少误差的可能性。OLS估计线性回归的系数。它使实际值与预测值之间的残差平方和最小化。R2的值介于0和1之间，计算因变量的变化百分比。R2的值越大，模型越好。\n\
  \n基于回归的学习可用于天气预报、销售价格预测、房价预测和股票市场等场景。\n\n## 重要说明\n\n有几种监督机器学习算法可用于回归和分类。逻辑回归最常用于分类相关问题。SVM作为一种深度学习模型，既用于分类也用于回归。同样，随机森林、kNN和决策树等算法也用于这两种监督学习。\n\
  \n选择最佳学习模型取决于数据类型、数据量、数据列之间的相关性、处理时间、预期输出、数据中是否包含变化以及许多其他因素。\n\n对于使用网络爬取收集的数据，监督形式的机器学习是用于分析和决策的最常用形式。在下一节中，我们将探讨无监督机器学习。\n\
  \n## 无监督学习\n\n无监督学习在发现数据趋势和查找隐藏模式方面很有效。在无监督学习中，算法自行检测、探索和学习。没有任何东西来监督学习过程。这种学习在数据挖掘领域很有用，也适用于当我们不确定自己在寻找什么时。\n\
  \n与监督学习相比，无监督学习任务更复杂，面临许多挑战。在无监督学习中，不需要准备数据和进行初步分析的时间。数据中隐藏或未知的模式会被暴露出来，这在监督学习中是不可能的。与监督学习相比，无监督学习的结果可能准确性较低。\n\
  \n无监督学习主要分为两个部分：\n\n- 聚类\n- 关联\n\n在下一节中，将介绍无监督学习的类型。\n\n## 聚类\n\n聚类是将数据或对象进行分组、排序、分类和归类的过程。监督学习中的分类模型也会对输入对象进行分组和归类。分类模型提供了预定义的类别或组名，而在聚类中，组或类别是在处理数据后生成的。\n\
  \n生成的数据组或簇将包含具有相似特征和类型的数据。聚类的灵活性是最受欢迎的特性。学习模型一旦训练好，就可以用于各种其他场景。\n\n**K均值聚类**是最广泛使用的聚类算法之一，它要求有k值。这里，k指的是要创建的簇的数量，或者要划分并分组的数据数量。它确定当前簇中的一个种子点作为质心（均值点），并收集距质心最近的数据到簇中。\n\
  \n与kNN类似，在数据或数据点之间进行距离测量（*欧几里得距离*），用于创建或分离相似和不相似的簇。kNN和K均值聚类通常被归类为基于搜索的（学习）算法。数据点利用自身来查找其他数据点。\n\
  \n## 关联\n\n关联有助于发现新模式、查找数据中的关系，并从大型数据集中产生信息。它识别数据集中模式的频率。此外，它还根据数据的依赖关系进行映射。\n\n\
  关联，也称为**关联规则挖掘（ARM）**，试图识别数据集变量之间的关联。用于ARM的常见算法之一是**Apriori**，它发现数据集中最频繁出现的数据项，并识别它们之间的关联和相关性。ARM通常在大型数据集中处理，但由于关联数量可能无限，很可能带有大量噪声。大多数情况下，使用是和否等二元属性来定义关联规则。\n\
  \n更多详细信息请参阅*第10章*。在下一节中，我们将学习强化学习类型的基础。\n\n## 强化学习\n\n这种类型的学习算法使用并识别其环境，通过访问数据模式来学习行为，或基于试错（也称为奖惩模型）来训练其学习模型。强化学习是关于（基于情况）做出决策或学习动作及其反馈，从而获得最大回报。\n\
  \n强化学习算法从一系列行动中学习，这几乎类似于决策树处理。例如，基于情况的输入产生输出，该输出成为下一周期的输入，依此类推，直到做出或获得决策。\n\n**强化代理（RAs）**，也称为AI驱动系统，是自我训练的，并根据训练数据做出解决分配任务的决策。为了分析或识别情况，使用外部代理和系统，如软件（日志）、系统设置、基于浏览器的扩展、机器中的摄像头等，以获取尽可能多的关于情况的信息。\n\
  \n到目前为止，本章已经探讨了与机器学习相关的信息。现在，我们将构建一个ML模型，并应用一些ML类型的实际概念，这些概念可用于预测和情感分析。\n\n\n\n\n\
  在下一节中，我们将使用Python编程探索实际的机器学习（ML）。\n\n## 使用scikit-learn进行机器学习\n\n要开发模型，我们需要数据集。网络抓取再次成为收集所需数据并存储为相关格式的理想技术。Python中有大量与机器学习相关的库和框架，而且数量还在不断增加。scikit-learn是一个Python库，能够处理并帮助完成大多数监督式机器学习功能。\n\
  \nscikit-learn也被称为并使用为`sklearn`。它构建于`numpy`、`scipy`和`matplotlib`之上。该库提供了大量与机器学习方面相关的功能，如*分类*、*聚类*、*回归*和*预处理*。我们将使用scikit-learn探索*监督学习*类型中的*回归*，涵盖初学者和中级概念。你还可以在https://scikit-learn.org/stable/user_guide.html查看`sklearn`用户指南。\n\
  \n在本章前面的章节中，我们已经介绍了大量关于**回归**的信息。回归是一种监督学习技术，用于基于标记数据做出预测。在接下来的章节中，将通过几个示例探讨简单线性回归（SLR）。\n\
  \n## 简单线性回归\n\nSLR用于估计自变量与单个因变量之间的关系。它通常被用作默认的回归技术，基于另一个变量的值来预测一个变量的值，这个另一变量也被称为SLR的预测变量或输入变量。\n\
  \n现在我们将使用代码讨论一些SLR概念。代码文件可在此找到：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter11/Chapter11_regression.ipynb。\n\
  \n示例中使用的数据（`Fish.csv`）来自**Kaggle**（https://www.kaggle.com/datasets/aungpyaeap/fish-market/download），并使用pandas读取到名为`input`的DataFrame中。图表将使用`plotly`绘制。\n\
  \n如下代码所示，我们导入常规库，如`pandas`、`numpy`和`plotly`。`Fish.csv`数据文件已使用pandas的`read_csv()`方法读取，这将创建一个名为`input`的DataFrame类型对象：\n\
  \n```\nimport pandas as pd\nimport numpy as np\nimport plotly.express as px\npd.options.plotting.backend\
  \ = \"plotly\" # use plotly as plotting option\ninput = pd.read_csv(\"Fish.csv\"\
  )      # load data\n```\n\n`input`包含几种鱼类物种的数据，包括与测量相关的数据，具体如下：\n\n- 物种：物种名称\n- 长度1：垂直长度（cm）\n\
  - 长度2：对角长度（cm）\n- 长度3：水平长度（cm）\n- 重量：鱼的重量（g）\n- 宽度：对角宽度（cm）\n\npandas的`info()`方法，如图11.1所示，显示列名、Dtype（数据类型，如object或float）以及来自DataFrame\
  \ `input`的null或非null计数等信息：\n\n```\ninput.info()\n<class 'pandas.core.frame.DataFrame'>\n\
  RangeIndex: 159 entries, 0 to 158\nData columns (total 7 columns):\n#   Column \
  \  Non-Null Count   Dtype\n---  ------   --------------   -----\n0   Species  159\
  \ non-null     object\n1   Weight   159 non-null     float64\n2   Length1  159 non-null\
  \     float64\n3   Length2  159 non-null     float64\n4   Length3  159 non-null\
  \     float64\n5   Height   159 non-null     float64\n6   Width    159 non-null\
  \     float64\ndtypes: float64(6), object(1)\nmemory usage: 8.8+ KB\n```\n\n图11.1：Fish.csv数据集信息\n\
  \n从图11.1可以看出，数据集中共有七列。其中六列是浮点类型，总共159行记录。数据集看起来很干净，因为没有null值。\n\n研究数据集是必须的，以便关注预处理活动，如填充null值、删除重复项、转换数据类型和排序。这些活动是强制性的，因为在回归处理过程中，我们需要找到作为变量的独立数据和依赖数据，并且不能影响输出（预测）质量。\n\
  \n`input.describe()`代码只处理携带统计值的列。通过`include='all'`参数，甚至字符串和其他对象也可以包含在内，如图11.2所示。我们可以看到，在七个独特的物种中，Perch出现次数最多；在159次中出现56次。\n\
  \n```\ninput.describe(include='all')\n```\n\n|  | Species | Weight | Length1 | Length2\
  \ | Length3 | Height | Width |\n|---|---|---|---|---|---|---|---|\n| 计数 | 159 |\
  \ 159.000000 | 159.000000 | 159.000000 | 159.000000 | 159.000000 | 159.000000 |\n\
  | 唯一值数 | 7 | NaN | NaN | NaN | NaN | NaN | NaN |\n| 众数 | Perch | NaN | NaN | NaN\
  \ | NaN | NaN | NaN |\n| 频数 | 56 | NaN | NaN | NaN | NaN | NaN | NaN |\n| 均值 | NaN\
  \ | 398.326415 | 26.247170 | 28.415723 | 31.227044 | 8.970994 | 4.417486 |\n| 标准差\
  \ | NaN | 357.978317 | 9.996441 | 10.716328 | 11.610246 | 4.286208 | 1.685804 |\n\
  | 最小值 | NaN | 0.000000 | 7.500000 | 8.400000 | 8.800000 | 1.728400 | 1.047600 |\n\
  | 25% | NaN | 120.000000 | 19.050000 | 21.000000 | 23.150000 | 5.944800 | 3.385650\
  \ |\n| 50% | NaN | 273.000000 | 25.200000 | 27.300000 | 29.400000 | 7.786000 | 4.248500\
  \ |\n| 75% | NaN | 650.000000 | 32.700000 | 35.500000 | 39.650000 | 12.365900 |\
  \ 5.584500 |\n| 最大值 | NaN | 1650.000000 | 59.000000 | 63.400000 | 68.000000 | 18.957000\
  \ | 8.142000 |\n\n图11.2：数据集列的详细描述\n\n使用以下代码绘制各个物种的计数（即`value_counts()`方法的结果）：\n\n\
  ```\nspecies_count = input.Species.value_counts()\nspecies_count.plot(title=\"Species\
  \ Count\", labels=dict(index=\"Species_Name\", value=\"Species_Count\", variable=\"\
  Fish\"))\n```\n\n如图11.3所示，从DataFrame `input`中统计Species_Count（即某些物种出现的次数），并以物种名称绘制：\n\
  \n# 物种计数\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_281_0.png)\n\n图11.3：绘制物种计数\n\
  \n在分析数据集时，似乎有许多相关因素。因此，我们将仅针对名为Perch的目标物种，通过基于Length3值训练模型来预测Weight：\n\n```\nperch\
  \ = input[input.Species==\"Perch\"]\n```\n\nPlotly散点图支持通过`trendline`参数显示回归趋势（https://plotly.com/python/linear-fits/#linear-fit-trendlines-with-plotly-express），如下代码所示。该代码使用`ols`作为`trendline`参数：\n\
  \n```\nfig = px.scatter(perch, x=\"Length3\", y=\"Weight\", trendline=\"ols\")\n\
  fig.show()\n```\n\n如图11.4所示，我们可以找到线性方程以及计算出的R2值、系数、截距和所选Length3的预测重量。`trendline`的`ols`参数为我们计算了这些，我们可以从图11.4所示的图表中解读Perch的Length3与重量关系：\n\
  \n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_282_0.png)\n\n图11.4：Perch的OLS趋势线、Length3和重量\n\
  \n从图11.4中，我们可以获得SLR方程的以下列出属性：\n\n- **R2：** 0.920652（准确率得分最高为1）\n- **线性方程：** Weight\
  \ = 35.0009 * Length3 + -652.787\n- **截距：** -652.787\n- **系数：** 35.0009\n\n**重要说明**\n\
  \nR2和系数等值有助于我们验证模型。还应注意到我们尚未使用sklearn。\n\n要使用sklearn通过`Length3`值（针对名为`Perch`的物种）预测`Weight`，我们需要执行以下步骤：\n\
  \n1. 确定因变量和自变量。\n2. 将数据拆分为训练集和测试集。\n3. 创建线性回归模型。\n4. 使用训练数据拟合线性回归模型。\n5. 最后，对测试数据进行预测。\n\
  \n如下代码所示，`sklearn`拥有多个模块，如`model_selection`、`linear_model`和`metrics`：\n\n```\nfrom\
  \ sklearn.model_selection import train_test_split\nfrom sklearn.linear_model import\
  \ LinearRegression\nfrom sklearn.metrics import mean_squared_error, r2_score, mean_absolute_error\n\
  ```\n\n`train_test_split()`接收Length3和Weight值。这将创建训练集和测试集。训练集将占用`train_size`设置的80%的值，其余20%由测试集使用。还使用了额外参数`shuffle`，它会随机打乱可用记录的顺序：\n\
  \n```\nX_train, X_test, y_train, y_test = train_test_split(perch.Length3,\nperch.Weight,\
  \ train_size=0.8, shuffle=True)\n```\n\n通过使用训练数据拟合创建名为`lr`的模型。`fit()`方法传入训练数据：\n\
  \n```\nlr = LinearRegression().fit(X_train, y_train)\ntype(lr)\nsklearn.linear_model._base.LinearRegression\n\
  \ndir(lr)\n['_abc_impl', '...', '_more_tags', '_parameter_constraints',\n'coef_',\
  \ 'copy_X', 'feature_names_in_', 'fit', 'fit_intercept',\n'get_params', 'intercept_',\
  \ 'n_features_in_', 'n_jobs', 'positive',\n'predict', 'rank_', 'score', 'set_params',\
  \ 'singular_']\n```\n\n从前面的代码可以看出，创建了`lr`模型后，我们可以探索一些重要的`lr`属性，如下所示：\n\n```\nlr.intercept_\
  \    # array([-634.55508041])\nlr.coef_         # array([[34.68344575]])\nlr.rank_\
  \         # 1\nlr.score(X_train, y_train)        # 0.927768856667214\n```\n\n在前面的代码中，我们将基于可用数据或\
  \ X_test 来预测体重。现在可以使用 lr 模型、predict() 方法和 X_test 生成 weight_pred 预测数组，其中使用 20% 的记录来预测\
  \ Weight：\n\n```\nweight_pred = lr.predict(X_test)\nweight_pred\narray([[461.4418054\
  \ ], [180.5058948 ], [801.33957378], [659.13744619 ], [544.68207521], [801.33957378],\
  \ [360.85981271], [204.78430682], [731.97268228], [284.55623206], [232.53106343],\
  \ [274.15119833]])\n```\n\n与 X_test 值类似，我们可以向模型预测器提供一个 Length3 的新值，并获得预测结果（Weight）：\n\
  \n```\nlr.predict(np.array([[20.5]])) [0] [0]\n# 76.45555753771407\nlr.predict(np.array([[29.5]]))\n\
  # array([[388.60656932]])\nlr.predict([[29.9,]])\n# array([[402.47994762]])\n```\n\
  \n准备好预测模型后，我们还可以使用 sklearn.metrics 中的方法来计算性能并评估模型本身。r2_score(0.86) 也被解释为准确率得分，其值介于\
  \ 0 和 1 之间——得分越高，准确度越好。这表明该模型在预测结果方面是可以接受的：\n\n```\nmean_squared_error(y_test, weight_pred)\n\
  # 9910.93927217145\nmean_absolute_error(y_test, weight_pred)\n# 87.86230207025248\n\
  mean_squared_error(y_test, weight_pred, squared=False)\n# 99.5537004443\nnp.sqrt(mean_squared_error(y_test,\
  \ weight_pred))\n# 99.5537004443\nr2_score(y_test, weight_pred)\n# 0.8681631783134378\n\
  ```\n\n> **重要提示**\n> **均方误差（MSE）** 值 9910.9392 是残差平方和的均值。RMSE 值 99.5537 是 MSE 的平方根。**平均绝对误差（MAE）**\
  \ 值 87.8623 是残差绝对值之和的均值。在一般情况下，MSE 总是大于 MAE。\n\n在本节中，我们通过代码示例探讨了 SLR 技术，并识别了 sklearn\
  \ 中的各种属性。在下一节中，我们将使用 MLR。\n\n## 多元线性回归\n\n当多个自变量与一个因变量之间存在相关性时，使用 MLR。在本例中，我们希望检查在“简单线性回归”一节中用于\
  \ SLR 的数据集中，Perch 物种的 Width 和 Height 列的值与 Weight 的相关性。\n\n现在，我们将通过代码讨论一些 MLR 概念，以下是代码文件的地址：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter11/Chapter11_multi_regression.ipynb。\n\
  \ninDepd 包含从 Perch 收集的自变量，而 depd 是因变量 Weight：\n\n```\ninDepd = perch[['Width', 'Height']]\
  \ # independent variables\ndepd = perch['Weight']                 # dependent variable\n\
  ```\n\n同样，80% 的数据用于训练，20% 用于测试。使用 sklearn.model_selection 模型的 train_test_split()\
  \ 方法创建训练集和测试集：\n\n```\nX_train, X_test, y_train, y_test = train_test_split(inDepd,\
  \ depd,\ntrain_size=0.8, shuffle=True)\n```\n\n使用训练数据集创建并拟合（或训练）mlr 模型：\n\n```\n\
  mlr = LinearRegression().fit(X_train, Y_train)\nmlr.score(X_train, y_train)\n0.9560246146854837\n\
  ```\n\nX_train 包含多个用于训练模型的数据，如图 11.5 所示：\n\n|   | Width | Height |\n|---|-------|--------|\n\
  | 113 | 6.7408 | 10.6091 |\n| 86 | 3.4075 | 6.1100 |\n| 96 | 3.7230 | 7.2930 |\n\
  | 75 | 2.6316 | 4.5924 |\n| 106 | 4.2042 | 7.8204 |\n| 101 | 4.1440 | 7.1680 |\n\
  | 74 | 2.4320 | 3.8240 |\n| 76 | 2.9415 | 4.5880 |\n| 119 | 7.1064 | 11.9286 |\n\
  \n图 11.5：包含多个自变量的 X_train\n\n训练完成后，使用 mlr 模型来预测来自 X_test 的数据。还需注意，r2_score 为 0.81799，这在\
  \ MLR 情况下是可以接受的：\n\n```\nweight_pred_mlr = mlr.predict(X_test)\nweight_pred_mlr\n\
  array([643.07827704, 96.06295718, 228.07992289, 76.27638592, 136.430909,\n143.8607218,\
  \ 163.98405844, -300.15848523,\n446.23998044,  291.21291802,  944.3976018,  243.67945607])\n\
  \nr2_score(y_test, weight_pred_mlr)\n0.817999125036539\n```\n\n也可以直接将 Width 和 Height\
  \ 的输入提供给 mlr.predict()。例如，请参见以下代码块：\n\n```\nmlr.predict(np.array([[3.45, 6.05]]))\n\
  array([154.53150904])\n\nmlr.predict(np.array([[7.10, 11.22]]))\narray([807.225824])\n\
  ```\n\n**重要提示**\n如本节代码实现所示，scikit-learn 拥有大量用于各种 ML 相关概念的工具。如果用户希望从其 ML 模型中获得大量统计和定量值，那么\
  \ statsmodel 和 scipy 更适用，因为代码更简短。\n\n在下一节中，我们将使用一种与 NLP 相关的技术。\n\n## 情感分析\n\nNLP\
  \ 是 ML 的子集，而情感分析是 NLP 的子集。通过情感分析，我们可以检测文本的情感是正面、中性还是负面。情感分析可用于文本、评论、反馈等内容。\n\n这种分析有助于评估客户或顾客的评论和反馈，以及它们是正面还是负面。检测到的情感有助于更好地开展营销，公司、电子商务网站、银行、旅行社以及更多组织可以监控和管理其战略、营销政策、产品品牌、客户需求等。\n\
  \n在接下来的部分中，我们将使用代码和示例，这些内容可在 https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter11/Chapter11_textblob_vader.ipynb\
  \ 获取。\n\nnltk Python 库是 NLP 的先驱之一。NLP 有很多用途，例如分类。在目前的情况下，我们将使用 textblob 和 vaderSentiment\
  \ 库：\n\n- textblob：这是一个基于 nltk 构建的文本处理库。它可用于各种 NLP 方面，例如词性标注、情感分析、词形还原、分词和文本分类。为了分析文本的情感，textblob\
  \ 计算并返回极性和主观性作为情感结果：\n  - polarity：表示文本的正面或负面情感。取值范围从 -1（非常负面）到 1（非常正面），0 表示中性。\n\
  \  - subjectivity：表示个人感受。取值范围从 0（客观）到 1（主观）。\n\n- vaderSentiment：这是一个社交媒体情感分析器。与\
  \ TextBlob 类似，Valence Aware Dictionary and Sentiment Reasoner（VADER）是一个基于规则的情感分析器。VADER\
  \ 已使用大量社交媒体文本进行训练。vaderSentiment 返回以下四个元素：\n  - compound：这是词典中词语的效价得分。取值范围从 -1（极度负面）到\
  \ 1（非常正面）。\n  - pos：compound 得分 >=0.05 的正面值。\n  - neg：compound 得分 <=-0.05 的负面值。\n\
  \  - neu：compound 得分 >=-0.05 且 <0.05 的中性情感。\n\n对 quote_details.csv 数据执行情感分析，这些数据是在第\
  \ 8 章中从 http://quotes.toscrape.com/ URL 抓取的。在当前案例中，只需要名为 quote 的列。它是唯一将与 textblob\
  \ 和 vaderSentiment 一起用于分析情感的字符串或文本元素。只能通过使用 pd.read_csv() 中的 usecols 参数，才能从文件中读取单个列或选定的列组：\n\
  \n```\nimport pandas as pd\nquotes = pd.read_csv(\"quote_details.csv\",usecols=[\"\
  quote\"])\nquotes['quote'][0]\n'The world as we have created it is a process of\
  \ our thinking. It cannot be changed without changing our thinking.'\n```\n\n将内容作为\
  \ quotes DataFrame 读取后，在下面的示例中，我们将使用两个非常流行的 Python 库来分析内容的情绪。\n\n如图 11.6 所示，quotes\
  \ 现在拥有足够的情感信息，可以对其进行分析：\n\n```\nquotes.head()\n```\n\n|  | quote | polarity | subjectivity\
  \ |\n|---|---|---|---|\n| 0 | The world as we have created it is a process o...\
  \ | 0.000000 | 0.000000 |\n| 1 | It is our choices, Harry, that show what we tr...\
  \ | 0.300000 | 0.750000 |\n| 2 | There are only two ways to live your life. One...\
  \ | 0.003788 | 0.625000 |\n| 3 | The person, be it gentleman or lady, who has n...\
  \ | -0.050000 | 0.800000 |\n| 4 | Imperfection is beauty, madness is genius and\
  \ ... | -0.277778 | 0.833333 |\n\n图 11.6：包含极性和主观性的 DataFrame quotes\n\n使用 textblob\
  \ 从所选数据集中获得情感相关细节。虽然我们在这样的示例中使用了现成的库，但结果可能不如使用该数据集所能获得的结果更具洞察力。\n\n因此，在下一节中，将对同一数据集（quotes）使用\
  \ vaderSentiment，这将有助于生成更多信息，并有助于与 textblob 获得的结果进行比较。\n\n### 示例 2 – 使用 vaderSentiment\n\
  \nvaderSentiment 的 SentimentIntensityAnalyzer 类包含 polarity_score() 方法，该方法接受一个字符串并返回四个键：pos、neg、neu\
  \ 和 compound。每个返回键的值都会被收集并添加到原始 DataFrame quotes 中：\n\n```\npositive, negative,\
  \ neutral, compound=[[], [], [], []]\nfrom vaderSentiment.vaderSentiment import\
  \ SentimentIntensityAnalyzer\nanalyzer = SentimentIntensityAnalyzer()\nfor quote\
  \ in quotes[\"quote\"]:\n    text = analyzer.polarity_scores(quote)\n    positive.append(text['pos'])\n\
  \    negative.append(text['neg'])\n    neutral.append(text['neu'])\n    compound.append(text['compound'])\n\
  quotes['positive']=positive\nquotes['negative']=negative\nquotes['neutral']=neutral\n\
  quotes['compound']=compound\n```\n\n\n\n\n\n## 情感分析\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_291_0.png)\n\
  \n图 11.9：正负值的绘图\n\n在本节完成了一些数据和解析后，可以说语录中找到的大多数记录本质上是中性的。\n\n> **重要说明**\n> \n> 使用\
  \ `nltk` 进行情感分析比 `textblob` 和 `vaderSentiment` 涉及更多步骤。此外，它目前拥有最丰富的方法和属性集合。请访问 `https://www.nltk.org/`\
  \ 了解更多详情。\n\n在本章中，我们学习了机器学习的一些基础知识，以及当提供从网络抓取的高质量数据时，机器学习如何通过其各种技术在各种情境中提供帮助并发挥重要作用。\n\
  \n## 小结\n\nPython 编程在人工智能和机器学习相关领域做出了巨大贡献。在本章中，我们仅仅看到了它的冰山一角。高质量数据在机器学习中扮演着非常重要的角色。无论是通过网络抓取收集数据并存储，还是将抓取到的数据即时提供给机器学习模型，经过处理的数据都是必需的。我们提供给机器学习算法用于绘图的数据质量越高、越精确，能期待的准确结果、可视化和描述性图表就越多。\n\
  \n现在，我们已经通过探索学习了机器学习的概念及其各个方面。我们还学习了如何实现机器学习模型，并在需要时从各种过程中收集结果。总而言之，我们现在已经了解了如何使用\
  \ scikit-learn 以及如何进行情感分析。机器学习是数据驱动的，高质量数据是机器学习模型提供准确性的基本要求。\n\n在下一章中，我们将学习一些对网络抓取数据有益且适用的进一步步骤和主题，这些内容可以用于网络抓取过程。\n\
  \n## 延伸阅读\n\n- **机器学习：**\n  - https://www.ibm.com/topics/machine-learning\n  - https://www.mygreatlearning.com/blog/what-is-machine-learning/\n\
  \  - https://www.run.ai/guides/machine-learning-engineering/machine-learning-automation\n\
  - **机器学习——Python：**\n  - https://scikit-learn.org/\n  - https://www.w3schools.com/python/python_ml_getting_started.asp\n\
  \  - https://realpython.com/tutorials/machine-learning/\n  - https://machinelearningmastery.com/machine-learning-in-python-step-by-step/\n\
  - **回归分析：**\n  - https://www.alchemer.com/resources/blog/regression-analysis/\n\
  \  - https://www.investopedia.com/terms/r/regression.asp\n- **自然语言处理：**\n  - https://www.nltk.org/\n\
  \  - https://www.ibm.com/topics/natural-language-processing\n  - https://hbr.org/2022/04/the-power-of-natural-language-processing\n\
  - **情感分析：**\n  - https://monkeylearn.com/sentiment-analysis/\n  - https://huggingface.co/blog/sentiment-analysis-python\n\
  \  - https://aws.amazon.com/what-is/sentiment-analysis/\n"
- "## 第5部分：结论\n\n在本部分中，你将了解一些精选的高级概念，这些概念可以结合抓取的数据或数据集实现，或在其之上实现，以完成高级处理和功能。你还将了解与网络抓取和数据科学相关的、在全球范围内需求很高的工作和职业发展方向。\n\
  \n本部分包含以下章节：\n\n- *第12章，抓取之后——后续步骤与数据分析*\n\n## 12\n\n## 抓取之后——后续步骤与数据分析\n\n到目前为止，我们已经学习了如何抓取网页、分析收集的数据，并使用\
  \ Python 编程应用**机器学习（ML）**算法。\n\n本章将简要介绍一些在该领域日益重要的新兴概念和技术。从数据中获取洞察和知识的能力需求旺盛，甚至相关供给领域也在呈指数级增长。从研究领域到商业领域，数据的重要性迅速提升。由机器学习逻辑驱动的**人工智能（AI）**系统将继续消耗并生成更多数据。\n\
  \n在本章中，我们将学习以下主题：\n\n- 抓取之后会发生什么？\n- 网络请求\n- 数据处理\n- 工作与职业\n\n## 技术要求\n\n需要使用网络浏览器（*Google\
  \ Chrome* 或 *Mozilla Firefox*）来浏览所提供的资源。\n\n## 抓取之后会发生什么？\n\n网络抓取是一种收集和提供高质量数据的方法，并应用各种依赖数据的技术。任何涉及数据的学科或领域都提供了学习和成长的机会，因为通过抓取获得的数据被用于分析、报告、数据集创建和数据挖掘等许多其他任务。随着基于网络的技术的发展，与网络抓取相关的技术一直是动态的且充满挑战。\n\
  \n基于数据的系统以图像和视频的形式返回原始数据、处理后的数据和可视化图表，正通过多种形式吸引全球受众而不断发展。**信息技术（IT）**驱动的系统是所有行业都在使用的核心应用，Python\
  \ 编程在数据相关系统的开发和处理中发挥了重要作用。\n\n本书前面的章节介绍了几个步骤，这些步骤整合了如下一些主要概念和操作：\n\n- 数据需求\n- 数据收集\n\
  - 数据分析（信息生成）\n- 数据使用（ML/AI）\n\n大量框架和编程语言正在被开发。与数据、信息和知识管理相关的应用在商业和研究领域中使用最为广泛。\n\
  \n虽然我们已经讨论了网络抓取和数据收集的各种特性和技术，但鉴于各种实体不断被创建和演变，能够调整我们的方法和技术非常重要。一些因素，例如系统的有效性、时间消耗、内容量以及适用技术的可用性，会影响整个网络抓取过程，甚至影响数据收集后执行的步骤。\n\
  \n在下一节中，我们将介绍一些处理与网络相关请求的高级技术和 Python 库。\n\n## 网络请求\n\n在本书的各个章节中，一直使用 `requests`\
  \ Python 库在代码和网络之间建立通信。如果在 https://pypi.org/ 上搜索与 `requests` 类似的库，可以找到大量 Python\
  \ 库。\n\n以下小节列出了一些 Python 库和技术，并对其进行了简要介绍。\n\n## pycurl\n\npycurl Python 库（http://pycurl.io/）是基于流行的\
  \ libcurl 库的封装。libcurl 是最早用于与互联网网站通信的 Python 库之一，它基于 **curl** 工具（也称为 **cURL**）。\n\
  \n`curl (https://curl.se/)` 是一个用于在网络上连接和传输数据的命令行工具。`curl` 是网络通信的基础；它是一个核心实现，借助封装器，可用于不同的**操作系统（OS）**、浏览器以及与互联网通信的机器。curl\
  \ 命令与机器无关。Python、PHP、C、R、Java 和 Rust 等编程语言会将原始 curl 命令转换为其首选格式，以便在其代码或库中使用。\n\n\
  pycurl 使用 C 编程语言开发，为 Python 代码提供基于 curl 的功能。与其他库相比，requests 库通常被认为易于使用。pycurl 提供了与\
  \ curl 几乎相同的特性和功能，包括其属性和方法。\n\n以下是 pycurl 相对于 requests 的一些主要优势：\n\n- 支持大量通信协议（HTTPS、POP3、FTP、LDAP、IMAP\
  \ 等）\n- 与 requests 和其他类似 Python 库相比更快\n\n现代浏览器甚至提供原始 curl 命令，可以使用基于浏览器的开发者工具找到，如前面第\
  \ 2 章所述。这些 curl 命令可以被复制并用于以下场景：\n\n- **命令行界面（CLI）**应用程序（Bash shell 或脚本）或终端\n- 基于\
  \ Web 的终端和 API 工具，例如 **Postman**（https://www.postman.com/）\n- 带有请求头的 Python 库，例如\
  \ requests（https://curlconverter.com/python/）\n- 将命令转换为其他编程语言\n\n图 12.1 展示了使用“Copy\
  \ as cURL (bash)”选项从基于浏览器的开发者工具中复制得到的用于加载 https://curl.se/ 的 curl 命令。\n\n```\ncurl\
  \ 'https://curl.se/' \\\n  -H 'authority: curl.se' \\\n  -H 'accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7'\
  \ \\\n  -H 'accept-language: en-US,en;q=0.9' \\\n  -H 'cache-control: max-age=0'\
  \ \\\n  -H 'if-modified-since: Thu, 01 Jun 2023 10:05:02 GMT' \\\n  -H 'if-none-match:\
  \ \"2153-5fd0e9e9a8fc-gzip\"' \\\n  -H 'sec-ch-ua: \"Not.A/Brand\";v=\"8\", \"Chromium\"\
  ;v=\"114\", \"Google Chrome\";v=\"114\"' \\\n  -H 'sec-ch-ua-mobile: ?0' \\\n  -H\
  \ 'sec-ch-ua-platform: \"Windows\"' \\\n  -H 'sec-fetch-dest: document' \\\n  -H\
  \ 'sec-fetch-mode: navigate' \\\n  -H 'sec-fetch-site: none' \\\n  -H 'sec-fetch-user:\
  \ ?1' \\\n  -H 'upgrade-insecure-requests: 1' \\\n  -H 'user-agent: Mozilla/5.0\
  \ (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0\
  \ Safari/537.36' \\\n  --compressed\n```\n\n图 12.1：curl 命令\n\n\n\n\n\n> **重要说明**\n\
  >\n> 使用 **Copy as cURL (bash)** 选项几乎就像从浏览器开发者工具中复制 *请求头*。浏览器会提取、美化并以某种格式呈现此类信息。**Postman**\
  \ 也允许导入 cURL 命令并以 *HTML <form>*-based 布局呈现（可编辑文本框等），在其中开发者可以做出选择并进行网络请求，同时并行开展测试。\n\
  \n通过浏览器获得的 cURL 命令，如图 12.1 所示，可以复制到 https://curlconverter.com/python 并转换为可用于 `requests`\
  \ 和 `http.client` 等库的 Python 代码。以下代码是为 requests 转换/生成的 Python 代码：\n\n```\nimport\
  \ requests\nheaders = {\n    'authority': 'curl.se',\n    'accept': 'text/html,application/xhtml+xml,\n\
  \               application/xml;q=0.9, image/avif,\n               image/webp, image/apng,*/*;q=0.8,\n\
  \               application/signed-exchange;v=b3;q=0.7',\n    'accept-language':\
  \ 'en-US,en;q=0.9',\n    'cache-control': 'max-age=0',\n    'if-modified-since':\
  \ 'Thu, 01 Jun 2023 10:05:02 GMT',\n    'if-none-match': '\"2153-5fd0e91e9a8fc-gzip\"\
  ',\n    'sec-ch-ua': '\"Not.A/Brand\";v=\"8\", \"Chromium\";v=\"114\",\n       \
  \         \"Google Chrome\";v=\"114\"',\n    'sec-ch-ua-mobile': '?0',\n    'sec-ch-ua-platform':\
  \ '\"Windows\"',\n    'sec-fetch-dest': 'document',\n    'sec-fetch-mode': 'navigate',\n\
  \    'sec-fetch-site': 'none',\n    'sec-fetch-user': '?1',\n    'upgrade-insecure-requests':\
  \ '1',\n    'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64;\n              \
  \     x64) AppleWebKit/537.36 (KHTML, like Gecko)\n                   Chrome/114.0.0.0\
  \ Safari/537.36',\n}\nresponse = requests.get('https://curl.se/',\n            \
  \            headers=headers)\n```\n\n使用 cURL 命令，甚至使用 pycURL，都将极大地帮助我们学习如何使用与基于\
  \ Web 的通信相关的核心技术。随着与技术开发相关的流程正被路由到 AI 驱动和 ML 为基础的系统，理解这些核心概念将产生差异。\n\n在下一节中，我们将学习可在网络请求中使用的附加功能（中间件功能）。\n\
  \n## 代理\n\n代理或代理 Web 服务器（也称为中间件）是网络通信中，尤其是网络抓取中最重要和核心的技术之一。在抓取过程中，网络通信中会出现大量与网络安全相关的挑战，使用代理有助于我们克服它们。\n\
  \n在抓取时使用代理通常会隐藏原始机器的 IP。请注意，某些提供商并不总是会隐藏原始 IP。代理使用代理服务提供商可用的其他安全 IP 与目标站点通信。代理充当中间件，有助于绕过物理机器上的网络安全。在网络抓取中最常用的代理类型之一是轮换\
  \ **住宅代理**，它在每次新请求时更改 IP 地址。\n\n互联网是开放内容。Web 服务器实施了大量安全措施以保持其内容安全。你们中的许多人会遇到一些被阻止查看或访问的内容，这可以通过使用代理来克服。在某种程度上，无论是在公共网络还是本地网络上，代理都提供强大的安全和过滤功能。\n\
  \n在处理长格式内容的网络抓取时，例如每日博客、评论、股票信息和评分，存在针对固定站点的各种重复抓取任务，以及包括按小时间隔的计划抓取选项。然而，需要考虑可能遇到网络安全措施而导致被阻止的可能性，例如以下情况：\n\
  \n- IP 黑名单\n- 每个页面都面临 CAPTCHA\n- 无法使用过滤选项\n- 重定向到未针对的目标页面（如托管在与用户不同的国家或语言的页面）\n\
  - 仅重定向到第一页\n- 重定向到主页\n\n这些情况可能导致浪费时间、财务损失、磁盘和网络空间损失、收集无关数据、数据质量下降等等。为了解决这个问题，开发人员需要使用和实施基于\
  \ Web 的渗透测试，例如使用代理；为选定国家选择轮换 IP、代理与 **User-Agent** 的随机组合，或随机或标准的 *请求头*；或在终端中执行 `curl`\
  \ 命令以验证内容。\n\n以下是代理可能有帮助的一些情况：\n\n- 克服地域（边境）限制\n- 防止被列入黑名单\n- 轮换 IP 地址\n- 性能增强\n\
  - 绕过 CAPTCHA、恶意软件、垃圾邮件等\n- 克服被阻止的访问\n- 实现隐私功能\n\n代理使用有众多优势，但也有两个显著的缺点，如下所示：\n\n\
  - 额外的财务需求（购买代理）\n- 额外的配置（在现有网络和代码之上）\n\n代理通常被发现并被规定用于抓取或爬取任务。\n\n如以下示例代码模板所示，Python\
  \ random 库的 shuffle 方法正被用于对 user_agents 和 proxyList 中的值进行随机化。以下代码在我们从网站获取有效 api-key\
  \ 的付费订阅后才会运行，这将导致多个包含 http 和 https 端口的 IP 集合：\n\n```\nimport requests\nimport random\n\
  user_agents = ['Mozilla/5.0 (iPhone; CPU iPhone OS 16.5 like Mac OS X) AppleWebKit/605.1.15\
  \ (KHTML, like Gecko) CriOS/114.0.5735.99 Mobile/15E148 Safari/604.1', 'Mozilla/5.0\
  \ (iPod; CPU iPhone OS 16_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko)\
  \ CriOS/114.0.5735.99 Mobile/15E148 Safari/604.1', 'Mozilla/5.0 (X11; Linux x86_64)\
  \ AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36', 'Mozilla/5.0\
  \ (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0\
  \ Safari/537.36',]\n# proxyList = dict(requests.get(\"https://api.demo-web.com?api-key=XXXX-XX-XXXX-XXX&zone=US&type=multiple&timeloc=12h&channel=chr_moz\"\
  ).content)\nproxyList = {'http':['xxx.xxx.xxx.xxx:xx', 'xxx.xxx.xxx.xxx:xxx','xxx.xxx.xxx.xxx'],\n\
  'https':['xxx.xxx.xxx.xxx:xx','xxx.xxx.xxx.xxx:xxx', 'xxx.xxx.xxx.xxx']}\ndef rand_output(input):\n\
  \    return random.shuffle(input)\nresponse = requests.get('https://www....com',\n\
  headers={'User-Agent': rand_output(user_agents)},\nproxies = rand_output(proxyList['https'])).text\n\
  ```\n\nproxyList 包含已访问服务提供商页面的 IP 列表。IP 也可以通过向代理提供商发出 API 请求来收集。rand_output 函数接收一个\
  \ Python list() 对象并返回 `shuffle` 列表。`requests` 支持 `headers` 和 `proxies` 参数等，可以在其中提供所需的值。\n\
  \n大多数基于云的平台和 Web 主机组织在需要时提供使用其内部代理服务的选项，甚至允许通过一些额外配置使用第三方代理设置。许多代理提供商使用 Web API\
  \ 并允许用户使用某种身份验证系统（API 密钥）访问代理。用户可以在 Google 上搜索 `https://www.google.com/search?q=proxy+providers`\
  \ 以找到最佳代理解决方案并使用或选择适当的解决方案。\n\n> **重要说明**\n>\n> 有大量基于浏览器的扩展提供 **虚拟专用网络 (VPN)** 访问、轮换\
  \ IP 等。Python 库也存在于代理、用户代理、生成与安全相关的令牌等。 这些扩展和库可能会导致系统漏洞，或暂时或永久工作，但使用它们与否的决定是用户的责任，在决定之前应进行适当的调查。\n\
  \n在下一节中，我们将介绍一些在数据处理中有用的新工具和应用程序。\n\n## 数据处理\n\n在网络抓取的上下文中，数据处理是指存储、处理、管理和分析从抓取中生成的数据。在本书的前几章中，我们专注于有效和高效抓取的概念，并附带代码示例。\n\
  \n随着对数据需求的增长，技术也在不断发展并适应新的变化。目前，随着 AI/ML 为基础的系统激增，竞争在于提供易于使用且快速的解决方案，而不损害质量。\n\n\
  在接下来的章节中，我们将介绍一些有助于数据处理的技術。\n\n## PySpark\n\n用于 **Apache Spark** 的 Python 库，`pyspark`\
  \ (`https://spark.apache.org/`)，用于处理和分析数据，尤其是大容量数据。**Spark** 是一个用于处理大数据（具有多样性、容量和速度的数据）的框架，比\
  \ **Hadoop** (`https://hadoop.apache.org/`) 更有效，Hadoop 是一个用于并行处理、调度和资源管理的框架。\n\n\
  Apache Spark 以其分布式处理系统、数据处理、环境的有效集群、CLI 应用程序和大容量数据的并行处理而闻名。它基于 Hadoop 的 **MapReduce**，并针对快速计算进行了额外优化，也可用于各种编程语言，如\
  \ C#、Java 和 Python。\n\n\n\n\n\npyspark 以其惰性计算和分析大数据而闻名，并受以下 Spark 功能支持：\n\n- 内存处理\n\
  - 在 DataFrame 上使用结构化查询语言（SQL）\n- 使用 pandas API\n- 内置的 MLlib 机器学习库\n- 计算速度\n- 容错性\n\
  \nPySpark 还使用 Python 的 pandas API，因此大多数可以用 pandas 完成的操作也适用于 PySpark，同时还具备 Apache\
  \ Spark 的额外优势和功能。通常，对于大型数据集，PySpark 非常有效。PySpark 的功能也可以独立使用，例如仅用于数据分析、使用机器学习、将数据集分块以及合并数据集的选定分块。\n\
  \n与 pandas 和其他 Python 库一样，PySpark 可用于可视化、数据清洗、数据格式化、数据采样等。Spark DataFrame 具有与 pandas\
  \ 相似的属性，并且具有许多实现 Spark 框架各种功能的高级特性。请访问 https://spark.apache.org/docs/latest/quick-start.html\
  \ 和 https://sparkbyexamples.com/ 了解更多详情。\n\n在下一节中，我们将探讨一个因其处理速度而日益流行的 Python 库。\n\
  \n## polars\n\npolars（https://www.pola.rs/）Python 库是一个数据分析库，被认为是速度最快的 DataFrame\
  \ 库之一。polars 使用 Rust 编程语言构建，旨在实现更快、更高效的计算。在处理大型数据集时，polars 已被发现比 Python 的 pandas\
  \ 更有效。\n\n用 polars 编写的代码稍长，可读性也不如 pandas。下面列出了 polars 的一些优点，使其比其他数据分析库更具优势：\n\n\
  - 图形处理单元（GPU）集成\n- 惰性求值（仅在需要时执行）\n- 操作的并行处理\n- 用 Rust 实现的联机分析处理（OLAP）查询引擎\n- 由现代处理器实现的基于单指令多数据（SIMD）的向量化（用单条指令处理多个数据集）\n\
  \npolars 使用 Apache Arrow 或 Arrow（https://arrow.apache.org/）数组，而 pandas 使用 NumPy\
  \ 数组。Arrow 为数据使用独立于语言的列式内存格式。\n\nArrow 推荐使用 Apache Parquet（https://parquet.apache.org/），这是一种实现数据压缩和编码方案的文件格式。Parquet\
  \ 的使用正在迅速增长，因为它比 CSV 和 JSON 更快，并支持以列格式存储数据。Parquet 文件的主要优势之一是在数据加载方面：它们允许在不加载整个数据结构的情况下访问列。Arrow\
  \ 也兼容于与 pandas、NumPy、PySpark 等一起使用或实现。\n\n**重要说明**\nPyArrow 是一个实现 Arrow 的 Python\
  \ 库。Arrow 可以与内置的 Python 对象（如 NumPy 和 pandas）集成。Arrow 在同一个数组中管理数据和数据类型，数组中的数据被分组以创建表。PyArrow\
  \ 将数据实现为表。每个数组代表表的列中的数据。PyArrow 还通过 ExtensionArray 接口集成到 pandas 中。它还支持将表读写为 DataFrame，反之亦然。\n\
  \n在下一节中，我们将讨论就业市场和职业，这些可以结合我们在本书各章中讨论和探索的背景和信息来追求。\n\n## 就业与职业\n\n到目前为止，在本书中，我们已经涵盖了有关\
  \ Python 编程和网络爬取的各个主题。我们学习了不同的技术，特别是侧重于数据的技术，包括搜索、获取、挖掘、转换、分析和可视化。\n\n能够让人们运用所学技能的同时获取最新技能的工作机会，是继续学习和提升技能的强大动力。数据相关的职业在全球提供了诱人的前景，并提供优厚的薪资。\n\
  \n在本节中，我们将提供一份与网络爬取和 Python 编程相关的职位名称列表，供您参考。考虑到当前该领域的需求，这对于那些有兴趣发展数据相关技能（如数据科学和\
  \ AI/ML）的人尤其重要。\n\n以下是一些来自全球各招聘网站的职位名称：\n\n- 高级 Python 程序员\n- 专家级 Python 程序员\n-\
  \ 网络爬虫工程师\n- 数据提取工程师\n- 数据研究员\n- 历史数据研究员\n- 地理数据研究员\n- 数据科学家\n- 数据科学从业者\n- 数据分析师\n\
  - 数据安全\n- 网络安全\n- 数据可视化工程师\n- 数据自由职业者\n- 数据与大数据工程师\n- 管理信息系统专家\n- 报表开发工程师（数据驱动）\n\
  - 信息分析师\n- 信息从业者\n- 机器学习工程师\n- 机器学习从业者\n- 自然语言处理从业者\n- 情感分析师\n\n这些职位名称只是一些示例，您也可以考虑探索自由职业的机会。可以肯定的是，在与数据科学和管理相关的各个领域中，您都会遇到数据及其相关的处理活动。每当任务涉及分析、信息生成、信息处理和报告等活动时，我们在本书各章中学到的技能都将发挥作用。\n\
  \n## 总结\n\n在本章中，我们探讨了市场上和数据科学领域的一些热门技术。技术框架和工具总是在不断演进。因此，开发人员有责任跟上技术的最新更新。\n\n网络爬取或数据提取是数据科学的核心领域之一，尽管数据处理和分析任务紧随其后。使用爬取技术从目标网站收集、采集和存储数据曾经是网络爬取的核心方面。然而，由于与数据交互的系统取得了各种突破，提供可直接实现于系统中的高质量数据、以客户要求的格式存储的数据、适用于实时处理的数据等也需要被考虑。\n\
  \n数据或数据集通过 API、专门提供研究工具的网站等提供。当我们需要以所需格式从目标网站获取特定数据时，网络爬取就发挥作用了。以这种方式接收的数据可以被收集并与其他数据或数据集合并或追加，以创建数据集。\n\
  \n随着在线应用程序和框架的使用日益增长，无论是小规模数据集还是大规模数据集，或是爬取脚本实时收集的记录或行，它们在与数据相关系统交互时都需要具备可访问性和高性能，以验证使用\
  \ Python 编程进行网络爬取的需求。\n\n我们已经到了本书的结尾。网络爬取是数据科学和数据驱动系统中的核心任务。它一直是动态的、进步的，并对数据、信息和知识的生成具有辅助作用。人工智能、机器学习、数据挖掘、自然语言处理和\
  \ Python 编程等主题总是以某种方式与网络爬取相关联。从职业和知识的角度来看，与网络爬取相关的主题值得探索。\n\n## 延伸阅读\n\n- 数据科学：\n\
