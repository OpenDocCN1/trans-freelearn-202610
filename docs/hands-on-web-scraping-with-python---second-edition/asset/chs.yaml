  > 在使用 Python 加载 URL 之前，最好先验证 URL 是否正常工作并包含我们正在寻找的数据。这种基本的可行性检查将在运行和管理项目时节省大量资源。\n\
  \n\n\n\n\n让我们加载两个不同的 URL，一个使用 urllib，另一个使用 requests：\n\n- Task 1: 使用 urllib 加载 https://www.python.org。我们在笔记本中使用代码，如图\
