  \ id=\"link2\">莱西</a> 和\n<a href=\"http://example.com/tillie\" class=\"sister\"\
  \ id=\"link3\">蒂莉</a>；\n她们住在井底。\n</p>\n<p class=\"story\">...</p>\n<h1>秘密特工</h1>\n\
  <ul>\n<li data-id=\"10784\">Jason Walters, 007: 在《致命魔术》中被发现死亡。</li>\n<li data-id=\"\
  97865\">Alex Trevelyan, 006: 成为恐怖分子头目；James 在《黄金眼》中的宿敌。</li>\n<li data-id=\"45732\"\
  >James Bond, 007: 主角；风流倜傥但不失稳重。</li>\n</ul>\n</body>\n</html>\n\n图 5.2：HTML 源代码\n\
  \n以下代码导入 bs4 和 re（Python 正则表达式，或正则表达式）库：\n\n```\nfrom bs4 import BeautifulSoup as\
  \ BSoup\nimport re                 # regex\nhtml = open(\"testHTML.html\",\"r\"\
  ).read()  # html file\nsoup = BSoup(html) # default parser\n```\n\n如图 5.2 所示的 HTML\
  \ 内容，使用指定路径加载并通过 BeautifulSoup 库的默认解析器转换为 soup 对象。\n\n有了 bs4 soup 对象，现在我们可以进一步处理\
  \ DOM 或 HTML 内容。我们处理的 HTML 内容可以是单一的或嵌套的。单个元素可以像访问属性一样访问，如以下代码所示：\n\n```\nsoup.a\
  \  # <a class=\"sister\" href=\"http://example.com/elsie\" id=\"link1\">Elsie</a>\n\
  soup.h1 # <h1>Secret agents</h1>\n```\n\nsoup.a 类似于 soup.find('a')；默认情况下它会找到第一个\
  \ <a> 元素并显示该元素的完整 HTML（文本和属性）。\n\n许多元素具有各种属性，或至少有一个属性。元素属性是重要的资源，因为它们提供了内容的标识。\n\
  \n在以下代码中，使用了 soup 对象的一些主要函数和属性：\n\n```\nsoup.a.attrs\n# {'href': 'http://example.com/elsie',\
  \ 'class': ['sister'], 'id': 'link1'}\n```\n\n```\nsoup.a.has_attr('class')    \
  \  # True\nsoup.a.has_attr('name')      # False\nsoup.a.get('class')          #\
  \ ['sister']\nsoup.a.get('href')      # 'http://example.com/elsie'\n```\n\n下面对前述代码中使用的函数和属性进行简要说明：\n\
  \n+   - **attrs**：列出找到的任何元素的全部属性\n+   - **has_attr()**：接受属性名作为参数以检查其是否存在；搜索查询后返回布尔（true/false）答案\n\
  +   - **get()**：接受属性名作为参数并返回所提供属性的值\n\n可以使用 text 和 string 属性以及 get_text() 函数从任何元素检索字符串值或内容，如以下代码中使用：\n\
  \n```\nsoup.a.text      # Elsie\nsoup.a.get_text()      # Elsie\nsoup.a.string \
  \     # Elsie\n```\n\n这里，我们探索了具有其属性的单个元素。在下一节中，我们将搜索元素。\n\n## find()\n\nsoup 对象还支持\
  \ find() 方法，该方法根据提供的参数返回单个结果。如果没有结果，则 find() 返回 None。\n\n在以下代码中，显示了各种形式的 find()，默认情况下识别或选择\
  \ <a>，输出为 <a class=\"sister\" href=\"http://example.com/elsie\" id=\"link1\">Elsie</a>：\n\
  \n```\nsoup.find('a')\nsoup.find('a',string=\"Elsie\")\nsoup.find('a',{'id':\"link1\"\
  })\nsoup.find('a',\"sister\")\nsoup.find(\"a\",attrs={'class':'sister'},text=\"\
  Elsie\")\n```\n\n让我们尝试理解这里列出的各种形式的 find()：\n\n+   - **find('a')**：找到第一个可用的 <a>。\n\
  +   - **find('a',string=\"Elsie\")**：找到第一个字符串值为 Elsie 的 <a>。\n+   - **find('a',{'id':\"\
  link1\"})**：找到第一个具有 id 属性且值为 link1 的 <a>。\n\n+   - `find('a', \"sister\")`：找到默认具有\
  \ class 值为 `sister` 的 `<a>`。这与 `find('a', attrs={'class': \"sister\"})` 和 `find('a',\
  \ {'class': 'sister'})` 相同。\n+   - `find(\"a\", attrs={'class': 'sister'}, text=\"\
  Elsie\")`：找到第一个文本值为 Elsie 且也拥有名为 class 且值为 sister 的属性的 `<a>`。\n\n接下来的示例显示了一些 `find()`\
  \ 的常见和区别用法。\n\n在以下代码中，默认搜索 `<ul>` 元素，这将返回其内容，包括其子 `<li>` 元素：\n\n```\nsoup.find('ul')\
  \ # <ul>\n<li data-id=\"10784\">Jason Walters, 003: Found dead in \"A\n    View\
  \ to a Kill\".</li>\n<li data-id=\"97865\">Alex ... \"Goldeneye\".</li>\n<li data-id=\"\
  45732\">James Bond, 007: The main man; shaken\n    but not stirred.</li>\n</ul>\n\
  ```\n\n如以下代码所示，`find()` 已用于连接。代码搜索 `<ul>` 然后找到 `<li>`（找到的 `<ul>` 的第一个子元素）：\n\n```\n\
  soup.find('ul').find('li')\n# <li data-id=\"10784\">Jason Walters, 003: Found dead\
  \ in \"A\n    View to a Kill\".</li>\n```\n\n以下代码在查找 `<li>` 时使用额外的过滤选项，提及其 data-id\
  \ 属性并使用 `get_text()` 方法显示其内容：\n\n```\nsoup.find('ul').find('li', attrs={'data-id':\
  \ '97865'})\n    .get_text()\n# 'Alex Trevelyan, 006: Agent turned .... nemesis\
  \ in\n\"Goldeneye\".'\n```\n\n我们在本节中处理了单元素搜索。现在，我们将在下一节学习如何查找所有匹配元素。\n\n## find_all()\n\
  \nsoup 对象还包含 `find_all()` 方法，该方法返回一个或多个结果，或在查询不匹配时返回一个空的 `list()` 对象。\n\n以下代码块使用\
  \ `find_all()` 方法以及主要参数：\n\n```\nsoup.find_all('a') # soup(\"a\")\nsoup.find_all('a',attrs={'id':re.compile(r\"\
  link\")})\nsoup.find_all('a',attrs={'href':re.compile(r\".*ie$\")})\nsoup.find_all(\"\
  a\",text=re.compile(r\".*ie$\"))\n```\n\n使用 soup `find_all()` 方法的前述代码会产生以下输出：\n\n\
  ```\n[<a class=\"sister\" href=\"http://example.com/elsie\"\n    id=\"link1\">Elsie</a>,\n\
  <a class=\"sister\" href=\"http://example.com/lacie\"\n    id=\"link2\">Lacie</a>,\n\
  <a class=\"sister\" href=\"http://example.com/tillie\"\n    id=\"link3\">Tillie</a>]\n\
  ```\n\n让我们尝试使用 `find_all()` 理解代码的各个方面：\n\n+   - `find_all('a')`：找到所有 `<a>` 元素。此代码类似于\
  \ `soup(\"a\")`、`find_all('a','sister')` 和 `find_all('a',{'class':'sister'})`。\n\
  +   - `find_all('a',attrs={'id':re.compile(r\"link\")})`：这里使用了 re Python 库，以匹配 id\
  \ 属性值中包含文本 link 的 `<a>` 元素。同样，可以使用 `find_all('a',attrs={'href':re.compile(r\".*ie$\"\
  )})` 在以字符 ie 结尾的 href 属性值上匹配正则表达式模式。\n+   - `find_all(\"a\",text=re.compile(r\"\
  .*ie$\"))`：与在属性（id 或 href）上匹配正则表达式类似，也可以在以字符 ie 结尾的文本参数中形成模式。\n\n本节中即将出现的示例显示了使用\
  \ `find_all()` 的一些额外功能。\n\n以下代码返回 `<a>` 和 `<title>` 元素的列表：\n\n```\nsoup.find_all(['a','title'])\n\
  # [<title>The Dormouse's story</title>,\n<a class=\"sister\" href=\"http://example.com/elsie\"\
  \n    id=\"link1\">Elsie</a>,\n<a class=\"sister\" href=\"http://example.com/lacie\"\
  \n    id=\"link2\">Lacie</a>,\n<a class=\"sister\" href=\"http://example.com/tillie\"\
  \n    id=\"link3\">Tillie</a>]\n```\n\n以下代码查找具有 `class` 属性且值为 `title` 或 `story`\
  \ 的所有 `<p>` 元素：\n\n```\n```python\nsoup.find_all(\"p\",attrs={\"class\":[\"title\"\
  ,\"story\"]})\n# [<p class=\"title\"><b>The Dormouse's story</b></p>,\n<p class=\"\
  story\">Once upon a time there were three little\nsisters; ...\n<a class=\"sister\"\
  \ href=\"http://example.com/elsie\"\n    id=\"link1\">Elsie</a>,\n<a class=\"sister\"\
  \ href=\"http://example.com/lacie\"\n    id=\"link2\">Lacie</a> ...\n<a class=\"\
  sister\" href=\"http://example.com/tillie\"\n    id=\"link3\">Tillie</a>;\n... well.\
  \ </p>,\n<p class=\"story\">...</p>]\n```\n```\n\n`find_all()` 还支持使用 `limit` 参数限制结果，如下所示：\n\
  \n```\n```python\nsoup.find_all('a',limit=2)\n# [<a class=\"sister\" href=\"http://example.com/elsie\"\
  \n    id=\"link1\">Elsie</a>,\n<a class=\"sister\" href=\"http://example.com/lacie\"\
  \n    id=\"link2\">Lacie</a>]\n```\n```\n\n如前例所示，仅返回两个 `<a>` 元素。\n\n> **重要提示**\n\
  > \n> *CSS 选择器* 也可以与 BeautifulSoup 对象一起使用。有两个方法允许使用 CSS 选择器与 bs4：`select()`，类似于\
  \ `find_all()`，和 `select_one()`，类似于 `find()`。有关更多信息，请访问 https://www.crummy.com/software/BeautifulSoup/bs4/doc/#css-selectors。\n\
  \n我们在本节中查看了元素的搜索，这也可以用于迭代的目的（请参阅 *Iteration* 部分）。在下一节中，我们将介绍搜索和沿 DOM 内容遍历的组合。\n\n\
  ## next_element 和 previous_element\n\n在元素之间前后移动时，沿 DOM 遍历非常有效。它是通过使用 `next_element`\
  \ 和 `previous_element` 实现的。`next_elements` 和 `previous_elements` 也可以用于返回多个元素。在开始理解遍历之前，理解解析树或\
  \ DOM 树的概念非常重要。DOM 树通常显示 HTML 代码结构、父子标签组合以及嵌套或链式标签。\n\n\n\n\n\nThe following code\
  \ shows the use of `next_element`. While traversing along a DOM (normally from top\
  \ to bottom), various elements can be found with `next_element`:\n\n```\nsoup.find('p','story').next_element\n\
  # 'Once upon a time there were three little sisters; and\n#  their names were\\\
  n '\n\nsoup.find('p','story').next_element.next_element\n# <a class=\"sister\" href=\"\
  http://example.com/elsie\"\n#  id=\"link1\">Elsie</a>\n```\n\nLet us understand\
  \ the details of the preceding code:\n\n+   - `find('p','story').next_element`:\
  \ Searches for a `<p>` element for the story value in class, and points to the next\
  \ element. Here, the next element after `<p class=\"story\">` is the text itself,\
  \ as seen in the preceding code output.\n+   - `find('p','story').next_element.next_element`:\
  \ Points to the `<a>` child element with the text `Elsie`.\n\n`previous_element`\
  \ is similar to `next_element`, but the direction of traversing is reversed.\n\n\
  The following code shows the use of `previous_element`, which can be extended or\
  \ chained:\n\n```\nsoup.find('b').previous_element\n# <p class=\"title\"><b>The\
  \ Dormouse's story</b></p>\n\nsoup.find('li',{'data-id':'45732'}).previous_element\n\
  \    .previous_element\n# 'Alex Trevelyan, 006: Agent turned terrorist leader;\n\
  #  James\\'... in \"Goldeneye\".'\n```\n\nRegarding the preceding code, let us understand\
  \ a few details:\n\n+   - `find('b').previous_element`: There’s only one `<b>` element\
  \ in the HTML content inside `<p>`, so it returns the element at `previous_element`\
  \ or `<p class=\"title\">`\n+   - `find('li',{'data-id':'45732'}).previous_element.previous_element`:\
  \ With `<li data-id=\"45732\">`, we find that the previous element is `<li data-id=\"\
  97865\">`, hence we get the text\n\nThe `next_element` and `previous_element` attributes\
  \ can be chained, as seen in the preceding code.\n\nWe have explored a lot regarding\
  \ searching and traversing so far in this section. The next section demonstrates\
  \ performing iteration.\n\n## Iteration\n\nWe have already come across the concept\
  \ of iteration in previous sections. For example, find_all(), next_elements, and\
  \ previous_elements result in one or more elements, where a loop can be used.\n\n\
  The following code iterates on the child elements of the <ul> elements, which are\
  \ <li> using find_all(), and uses the name attribute to show the element name:\n\
  \n```\nfor li in soup.ul.find_all('li'):\n    text = li.get_text().strip()\n   \
  \ print(f\"{li.name} : {li.get('data-id')} :\n        ({len(text)}) - {text}\")\n\
  ```\n\nSimilarly, the get_text() function returns the text string of an element,\
  \ and the get('data-id') function returns the values of the data-id attribute. Printing\
  \ all those return values with their text lengths, the output looks as follows:\n\
  \n```\nli : 10784 : (53) - Jason Walters, 003: Found dead in \"A\n    View to a\
  \ Kill\".\nli : 97865 : (82) - Alex Trevelyan, 006: ...; James' nemesis\n    in\
  \ \"Goldeneye\".\nli : 45732 : (54) - James Bond, 007: The main man; shaken\n  \
  \  but not stirred.\n```\n\nVarious alternate mechanisms exist to perform iteration\
  \ and the extraction process.\n\nIn this and previous sections, we explored the\
  \ main concepts related to BeautifulSoup. We will scrape content using BeautifulSoup\
  \ in the upcoming section.\n\n> **Important note**\n> BeautifulSoup has various\
  \ other methods related to the find activity, such as find_all_next, find_next,\
  \ and find_previous_siblings, to deal with parent-child and traversing-related instances.\
  \ There have been updates to the names and supporting arguments of methods in bs4.\
  \ For the complete and updated documentation, please visit https://www.crummy.com/software/BeautifulSoup/bs4/doc/.\n\
  \n## Web scraping using Beautiful Soup\n\nIn this section, we will build and execute\
  \ a web crawler using Beautiful Soup. To set things up, we have chosen to scrape\
