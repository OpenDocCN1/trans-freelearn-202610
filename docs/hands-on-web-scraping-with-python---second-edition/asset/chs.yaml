  - 数据查找技术\n\n## 技术要求\n\n您可以使用任何操作系统（OS）（例如 Windows、Linux 或 macOS），并在您的 PC 或笔记本电脑上安装最新的网络浏览器（例如\
  \ Google Chrome 或 Mozilla Firefox）。\n\n## 什么是网络抓取？\n\n抓取是提取、复制、筛选或收集数据的过程。从网络（由网站、网页和互联网相关资源构成）抓取或提取数据以满足特定需求通常称为网络抓取。数据收集和分析在信息收集、决策和研究相关活动中至关重要。然而，由于数据可能被轻易操纵，网络抓取应谨慎进行。\n\
  \n互联网和基于网络资源的普及导致信息领域每天都在演变，这也导致了对原始数据的需求不断增长。数据是科学技术和管理领域的基本需求。收集或组织的数据经过处理、分析，与历史数据进行比较，并使用机器学习（ML）以及各种算法和逻辑进行训练，以获得估计和信息并获得进一步的知识。\n\
  \n网络抓取提供了从网站收集数据的工具和技术，适用于个人或业务相关需求，但需考虑法律因素。\n\n如图 1.1 所示，我们根据需要从各种网站获取数据，编写/执行爬虫，收集必要内容并存储它。在此收集的数据之上，我们进行某些分析并得出与决策相关的一些信息。\n\
  \n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_22_0.png)\n\n图 1.1：网络抓取 – 将网页内容存储为数据\n\
  \n我们将在后面的章节中更深入地探讨抓取和数据分析。\n\n在执行抓取任务之前，还需要考虑一些法律因素。大多数网站都包含隐私政策、关于我们和条款和条件等页面，其中包含有关法律行动和禁止内容的法律信息以及一般信息。在计划对网站进行任何抓取活动之前，开发者有道德义务遵守这些条款和条件。\n\
  \n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_24_0.png)\n\n图 1.2：HTTP（客户端和服务器或请求-响应通信）\n\
  \n请求和响应本质上是循环的——它们就像客户端与服务器之间的问答，反之亦然。\n\nHTTP 协议的另一种加密且更安全的版本是超文本传输安全协议（HTTPS）。它使用安全套接层（SSL）（了解有关\
  \ SSL 的更多信息请访问 https://developer.mozilla.org/en-US/docs/Glossary/SSL）和传输层安全（TLS）（了解有关\
  \ TLS 的更多信息请访问 https://developer.mozilla.org/en-US/docs/Glossary/TLS）来在客户端和服务器之间通信加密内容。这种类型的安全性允许客户端以安全的方式与服务器交换敏感数据。银行、在线购物和电子支付网关等活动使用\
  \ HTTPS 使敏感数据安全，防止其暴露。\n\n**重要说明**\nHTTP 请求 URL 以 http:// 开头，例如，http://www.packtpub.com，而\
  \ HTTPS 请求 URL 以 https:// 开头，例如，https://www.packtpub.com。\n\n您现在已经了解了一些关于 HTTP 的知识。在下一节中，您将学习有关\
  \ HTTP 请求（或 HTTP 请求方法）的知识。\n\n## HTTP 请求（或 HTTP 请求方法）\n\n网络浏览器或客户端向服务器提交其请求。请求使用各种方法（通常称为\
  \ HTTP 请求方法）转发到服务器，例如 GET 和 POST：\n\n- GET：这是请求信息的最常见方法。它被认为是一种安全的方法，因为这里资源状态不会被更改。此外，它用于提供查询字符串，例如\
  \ https://www.google.com/search?q=world%20cup%20football&source=hp，这是在基于 q（world\
  \ cup football）和 source（hp）参数发送的请求向 Google 请求信息。信息或查询（本例中的 q 和 source）及其值会显示在 URL\
  \ 中。\n\n- POST：用于向服务器发出安全请求。请求的资源状态可能被更改。发布或发送到请求 URL 的数据不会在 URL 中显示，而是在请求正文中传输。它用于以安全的方式向服务器提交信息，例如登录和用户注册。\n\
  \n我们将在 *第 2 章* 的 *实现 HTTP 方法* 部分更深入地探讨 HTTP 方法。\n\n如 *图 1.2* 所示，HTTP 通信有两个主要部分。了解了\
  \ HTTP 请求的基本概念后，让我们在下一节中探索 HTTP 响应。\n\n## HTTP 响应\n\n服务器处理请求，有时还处理指定的 HTTP 头部。当请求被接收和处理后，服务器会向浏览器返回其响应。大多数时候，响应以\
  \ HTML 格式找到，甚至以 JavaScript 和其他文档类型、**JavaScript 对象表示法（JSON）** 或其他格式。\n\n响应包含状态代码，其含义可使用\
  \ **开发者工具（DevTools）** 揭示。以下列表包含一些状态代码以及它们含义的简要信息：\n\n- **200**：OK，请求成功\n- **404**：未找到，请求资源无法找到\n\
  - **500**：内部服务器错误\n- **204**：无内容可发送\n- **401**：未授权请求已发送到服务器\n\n还有一些响应组可以根据 HTTP\
  \ 响应状态的范围来识别：\n\n- **100–199**：信息性响应\n- **200–299**：成功响应\n- **300–399**：重定向响应\n\
  - **400–499**：客户端错误\n- **500–599**：服务器错误\n\n> **重要说明**\n> 有关 cookie、HTTP、HTTP 响应和状态代码的更多信息，请参阅官方文档\
  \ https://www.w3.org/Protocols/ 和 https://developer.mozilla.org/en-US/docs/Web/HTTP/Status。\n\
  \n现在我们对 HTTP 响应和请求有了基本概念，让我们探索 HTTP cookie（网络抓取中最重要的因素之一）。\n\n## HTTP cookie\n\n\
  HTTP cookie 是服务器发送到浏览器的數據。此数据由网站在您的系统或计算机上生成和存储。它有助于识别用户向网站发出的 HTTP 请求。Cookie 包含有关会话管理、用户偏好和用户行为的信息。\n\
  \n服务器根据 cookie 中存储的信息识别并与浏览器通信。存储在 cookie 中的数据帮助网站访问和传输某些保存的值，例如会话 ID 和过期日期和时间，提供网络请求和响应之间的快速交互。\n\
