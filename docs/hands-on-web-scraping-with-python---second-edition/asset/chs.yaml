  \n> **Important note**\n> \n> BeautifulSoup also supports CSS selectors, and there\
  \ is a short, small crawler available as an example in the GitHub repository: https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter05/bs4_scraping_css_select.ipynb.\n\
  \nIn this section, we have developed Beautiful Soup-based crawlers and extracted\
  \ data into files. In the next section, we will learn about the Python scrapy library\
  \ and develop a crawler using it.\n\n## Web scraping using Scrapy\n\nWe have learned\
  \ about, explored, and used different Python libraries for web scraping in the current\
  \ and previous chapters. Scrapy is one of the few open source web crawling frameworks\
  \ written in Python that allows dynamic adaptation, a project-based scope, and modular\
  \ extensibility for web scraping tasks.\n\n\n\n\n\n根据 Scrapy 官方网站，https://scrapy.org/，它\
  \ *简单、快速、协作且可扩展*。Scrapy 之前由 **Scrapinghub** 维护，现在由 **Zyte**（https://www.zyte.com/）和其他一些贡献者维护。\n\
  \n以下是一些重要的特性，使 Scrapy 流行并使其在 Python 网页爬取框架中脱颖而出的列表：\n\n- 内置支持 *解析、遍历、XPath、CSS 选择器和正则表达式*\n\
  - 使用内置库处理 HTTP 请求和响应\n- 模块化结构和组件允许开发者专注于特定任务并协作管理编码\n- 提供 **命令行界面 (CLI)** 来处理项目、数据导出、管理数据库等\n\
  - 可用的中间件和扩展非常丰富，可以轻松处理 *cookie、会话、身份验证、robots.txt、项目日志、用量统计、电子邮件等*\n\n为了开始使用 Scrapy\
  \ 尝试一些抓取任务，让我们在预设环境中使用 pip 安装它，如图 5.5 所示，或按照 https://docs.scrapy.org/en/latest/intro/install.html\
  \ 中的说明进行操作：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_143_0.png)\n\n图 5.5：Scrapy\
  \ 安装\n\n在对 Scrapy 进行本次基本介绍并在系统中成功安装后，接下来我们将设置一个项目。\n\n## 设置项目\n\nScrapy，如前一节所述，提供了一个命令行工具\
  \ scrapy。该工具包含大量命令，可帮助设置项目和与数据提取相关的活动。代码可在 GitHub 上获取：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter05/bookScrapy。\n\
  \nscrapy genspider booklist books.toscrape.com 命令在 bookScrapy\\books\\spiders 子文件夹中创建名为\
  \ booklist.py 的爬虫，并将 books.toscrape.com 设置为 allowed_domains 参数：\n\n```\nimport scrapy\n\
  class BooklistSpider(scrapy.Spider):\n    name = \"booklist\"\n    allowed_domains\
  \ = [\"books.toscrape.com\"]\n    start_urls = [\"http://books.toscrape.com/\"]\n\
  \    def parse(self, response):\n```\n\n如前述代码所示，刚创建的 booklist.py 爬虫包含默认代码。要开发爬虫，我们必须在\
  \ booklist.py 文件中使用 parse() 实现必要的代码和逻辑。bookScrapy\\books 文件夹还包含一些额外的文件：items.py、middlewares.py、pipelines.py\
  \ 和 settings.py，以及 spiders 文件夹。\n\n> **重要说明**\n> Spider 是一个包含用于抓取和数据收集逻辑的代码的 Python\
  \ 类文件。可以存在多个针对特定抓取活动的 spider 类。spider 类在爬取过程中使用。诸如 scrapy list 和 scrapy list spider\
  \ list 等命令可列出项目的爬虫。请访问 https://docs.scrapy.org/en/latest/intro/tutorial.html?highlight=Spider#our-first-spider\
  \ 了解更多信息。\n\n这些文件各自对最终爬虫具有控制和实现。以下是这些文件的简要说明：\n\n- items.py：Item 就像一个 Python 字典，保存键和值（列名和值）。有关更多详细信息，请访问\
  \ https://docs.scrapy.org/en/latest/topics/items.html。\n- pipelines.py：在收集数据后，抓取的项目会发送到管道以执行其他操作，例如清理和丢弃。有关更多详细信息，请访问\
  \ https://docs.scrapy.org/en/latest/topics/item-pipeline.html。\n- settings.py：可以控制和添加项目相关设置。有关更多详细信息，请访问\
  \ https://docs.scrapy.org/en/latest/topics/settings.html。\n- middlewares.py：我们可以指定一些钩子或扩展，可在爬虫中执行其他任务（处理输入和输出）。请访问\
  \ https://docs.scrapy.org/en/latest/topics/spider-middleware.html 了解更多详细信息。\n\n\
  > **重要说明**\n> 处理或更新我们刚刚提到的文件不是强制性的。这些文件用于实现功能完善的爬取项目，通过允许用户使用 Scrapy 提供的深入功能和变体。\n\
  \n我们现在已准备好项目和默认爬虫文件以开始编码或进一步处理。在下一节中，我们将使用 `items.py` 文件处理 `scrapy.Item`。\n\n##\
  \ 创建项目\n\nItem 通常被理解为用于收集值以在爬虫中实现的值的字典对象的列名或键。`items.py` 文件包含一个默认类，该类实现 `scrapy.Item`。该类（`BooksItem`）是在处理\
  \ `scrapy startproject` 命令期间生成的。\n\n以下代码块探索了 BooksItem 项目类，并与之关联了 `scrapy.Field()`\
  \ 类型的对象：\n\n```\nimport scrapy\nclass BooksItem(scrapy.Item):\n    # define the\
  \ fields for your item here like:\n    title = scrapy.Field()\n    no_review = scrapy.Field()\n\
  \    ...\n    url = scrapy.Field()\n    image = scrapy.Field()\n```\n\n根据我们的爬虫计划，`items.py`\
  \ 将包含 `scrapy.Field()` 的默认对象。这些字段将从爬虫或 `spiders\\booklist.py` 获取其值，如我们在下一节中将发现的那样。\n\
  \n## 实现爬虫\n\n在规划和收集项目准备就绪后，我们将实现爬虫以使用 `items.py` 并进一步进行代码实现。代码可在 GitHub 上获取：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter05/bookScrapy/books/spiders/booklist.py。\n\
  \n与爬取相关的逻辑和代码由 `parse()` 函数提供，该函数存在于 `booklist.py` 中，如下所示：\n\n```\ndef parse(self,\
  \ response):\n    listings = response.xpath(\"//article[@class='product_pod']\"\
  )\n    #root\n    nextPage = response.xpath(\"//ul[@class='pager']/li[@class='next']/a/@href\"\
  )\n    for listing in listings:\n```\n\n前述代码从 http://books.toscrape.com 识别 listings\
  \ 并将使用 XPath 进行迭代。下一页的链接 nextPage 也已被解析。CSS 选择器和 XPath 表达式都可与 response（对 start_urls\
  \ 的 HTTP 响应）一起使用。\n\n如以下代码所示，已从 items.py 创建了 Python BooksItem 类，该类具有列对象，已识别或计划的字段正在被解析并添加到列中：\n\
  \n```\ncolumn = BooksItem() # from books.items import BooksItem\ncolumn['title']\
  \ = listing.xpath(\"./h3/a/@title[normalize-space()]\").extract_first()\ncolumn['url']\
  \ = listing.xpath(\"./h3/a/@href\").extract_first().strip()\n...\nyield response.follow('http://books.toscrape.com/catalogue/'+column['url'],\n\
  \    callback=self.parse_page, meta={'column':column})\n```\n\n为了使用 column['url']\
  \ 提供的链接解析详细列表页，Scrapy 提供了 follow() 函数，该函数链接到 parse 函数以作为回调处理（parse_page），并且收集的项目被添加到\
  \ BooksItem 类的 column 对象中。\n\n以下代码实现了基于循环的逻辑，并在每次有下一页链接可用时调用 parse()：\n\n```\nif\
  \ nextPage:\n    nextPage = 'http://books.toscrape.com/catalogue/'+nextPage\n  \
  \  yield scrapy.Request(nextPage, callback=self.parse)\n```\n\n此爬虫（booklist）可使用\
  \ scrapy crawl booklist 命令执行。它列出了大量日志，例如经过时间和日期。\n\n爬虫准备好处理或爬取后，我们将在下一节中导出数据。\n\n\
  ## 导出数据\n\nscrapy 命令使导出数据到文件变得非常容易。我们可以使用以下命令：\n\n- scrapy crawl booklist -o bookRecords.csv\n\
  - scrapy crawl booklist -o bookRecords.json\n\n4. 项目创建后，Zyte 将引导您进入 **Deploy** 部分，或您可以从菜单中选择该选项。在这里，我们必须指定如何将项目加载到\
  \ app.zyte.com。多个选项可用，如 *图 5.8* 所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_149_0.png)\n\
  \n图 5.8：代码与部署 – Scrapy 选项\n\n5. 根据 *步骤 4* 下 **SCRAPY** 中的说明，我们将使用 `pip install shub`\
  \ 安装 shub，登录并使用 *图 5.9* 中显示的代码进行部署。成功安装和登录将创建 API 密钥，提供部署 ID（638593），并向项目文件夹添加一些文件，例如\
  \ `scrapinghub.yml` 和 `setup.py`：\n\n```text\n(seconded) C:\\HOWScraping2E\\Chapter05\\\
  book\\scrapy>shub deploy 638593\nC:\\HOWScraping2E\\seconded\\Lib\\site-packages\\\
  distutils\\hack\\__init__.py:33: UserWarning: Setuptools is replacing distutils.\n\
  distutils.warn(\"Setuptools is replacing distutils.\")\nPacking version 1.0\nDeploying\
  \ to Scrapy Cloud project \"638593\"\nRun your spiders at: https://app.scrapinghub.com/p/638593/\n\
  {\"status\": \"ok\", \"project\": 638593, \"version\": \"1.0\", \"spiders\": 1}\n\
  ```\n\n图 5.9：shub（安装、部署）\n\n\n\n\n\n6. *Step 5* 将部署的代码或项目加载为作业，这些作业将在 **Jobs Dashboard**\
  \ 下可用，可执行、运行、调度，以及更多选项，如 *Figure 5.10* 所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_150_0.png)\n\
  \nFigure 5.10: Listing jobs and Spider links\n\n7. *Step 6* 显示存在 **1 spider**。点击该蜘蛛，将带你进入\
  \ **Spider Details**，并提供有关蜘蛛的一些信息。我们现在可以通过从 **Jobs Dashboard** 点击 **Run** 选项，然后在\
  \ **Spider Details** 上运行蜘蛛。\n\n8. 你可以通过在 **Completed, Deleted, Running** 和 **Next**\
  \ 部分点击蜘蛛名称（**booklist**）来验证运行是否成功，如 *Figure 5.11* 所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_150_1.png)\n\
  \nFigure 5.11: Spider jobs completed\n\n9. 如 *Figure 5.11* 所示，详细信息如 **Items, Requests,\
  \ Runtime** 和 **Errors** 也可用，可点击以进行更详细的调查。*Figure 5.12* 向我们展示了 **Items** 下的信息：\n\
  \n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_151_0.png)\n\nFigure 5.12: Job Items\
  \ (loading Item 0 or the first item)\n\n10. 如 Figure 5.12 所示，在 Jobs Items 部分下有多个选项，例如\
  \ Download、Exporting to Files（CSV、JSON、XML）、Filtering、Dataset Publishing 和 Samples。\n\
  \n通过上述步骤，我们成功将 Scrapy 项目部署到 app.zyte.com 并根据蜘蛛（booklist）中可用的代码提取了详细信息。\n\nImportant\
  \ note\n最好你在本地机器上测试爬虫，以防出现任何异常和错误，测试所有功能（例如运行爬虫和导出数据）并使用最新的库（如果可能）。关于部署或 Zyte 中的任何问题，请访问\
  \ https://support.zyte.com。\n\n在本节中，我们专注于在服务器上部署我们的爬虫。\n\n## Summary\n\n在本章中，我们探索并学习了使用\
  \ *Beautiful Soup* 和 *Scrapy* 从网页解析和提取数据。\n\n到目前为止，在本书中，我们已经确定了许多有效且适合网页抓取的库和技术。Beautiful\
  \ Soup 为开发人员提供了一些用于解析、遍历和创建爬虫的功能。Scrapy 提供了与 Beautiful Soup 相同的功能，可用于数据提取，但它更像是一个基于项目的框架，在幕后使用大量库，使你只需专注于自己的任务。由于\
  \ Scrapy 易于实现且架构协作性强，它在初学者、专业人士甚至像 Zyte、*ScrapeOps* 和 *Apify* 这样的基于网络的服务提供商中都很受欢迎。\n\
  \n在下一章中，我们将学习并探索更多抓取技术和与安全相关的问题。\n\n## Further reading\n\n- Beautiful Soup: https://www.crummy.com/software/BeautifulSoup/bs4/doc/\n\
  - lxml – XML and HTML with Python: https://lxml.de/\n- Web crawlers:\n  - https://www.cloudflare.com/en-gb/learning/bots/what-is-a-web-crawler/\n\
  \  - https://research.aimultiple.com/web-crawler/\n- Web scraping: https://www.zyte.com/learn/\n\
  - robots.txt: https://www.robotstxt.org/robotstxt.html\n- Scrapy Cloud: https://www.zyte.com/scrapy-cloud/\n\
  - Scrapy: https://docs.scrapy.org/en/latest/index.html\n"
