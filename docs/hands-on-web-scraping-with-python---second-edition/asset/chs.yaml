  \ on GitHub: https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter05/bs4_scraping.ipynb.\n\
  \nThe following code declares the paginated link as url, and columns contains a\
  \ column header for the CSV file to be generated:\n\n```\n```python\nurl = \"http://quotes.toscrape.com/tag/inspirational/page/\"\
  \ncolumns=['id','author','quote','tags','quote_length',\n         'born_date','born_location','author_url']\n\
  ```\n```\n\nInside the paginated loop, a response from url has been collected and\
  \ provided to BSoup to be parsed with the default parser:\n\n```\n```python\nresponse\
  \ = requests.get(url+str(page))\nsource = BSoup(response.content)\n    if source.find('ul','pager').find('li','next'):\n\
  \        txtNext = source.find('ul','pager')\n                  .find('li','next').find('a').get_text()\n\
  ```\n```\n\ntxtNext holds the value for the next page.\n\nAs seen in the following\
  \ code, the nextPage pagination variable is controlled based on the \"Next\" string\
  \ if it exists for txtNext:\n\n```\nif txtNext and\n    re.findall(r\".*(Next).*\"\
  ,txtNext)[0]==\"Next\":\n        nextPage=True\n```\n\nMultiple variables, such\
  \ as quote, author, and tags, are created with the content available from iterating\
  \ <div> with the quote class value:\n\n```\nfor quotes in source.find_all('div','quote'):\n\
  \    quote = quotes.find(attrs={'itemprop':'text'})\n        .get_text().strip()\n\
  \    author = quotes.find(attrs={'class':'author'})\n        .get_text().strip()\n\
  \    tags = quotes.find(attrs={'itemprop':'keywords'})\n        .get('content').strip()\n\
  \    authorUrl = quotes.find(href=re.compile(r\"/author/\"))\n        .get('href')\n\
  ```\n\nSimilarly to the quote-based information, a unique authorUrl string has been\
  \ identified and its content is parsed to collect author-related information, such\
  \ as bornDate and bornLocation:\n\n```\nif authorUrl and authorKey not in authorSet.keys():\n\
  \    authorUrl = \"http://quotes.toscrape.com\"+authorUrl\n    source_author = BSoup(requests.get(authorUrl).content)\n\
  \    bornDate = source_author.find(attrs=\n        {'class':'author-born-date'}).get_text().strip()\n\
  \    bornLocation = source_author.find(attrs=\n        {'class':'author-born-location'}).get_text()\n\
  \        .replace('in', '').strip()\n```\n\nFinally, author-related information\
  \ is collected in authorSet, and dataSet holds quote and author details:\n\n```\n\
  authorSet[authorKey]={\n    'name':author,\n    'url':authorUrl,\n    'date':bornDate,\n\
  \    'location':bornLocation\n}\ndataSet.append([\n    uid,\n    author,\n    quote,\n\
  ```\n\n```\ntags.replace(',', '|'),\nlen(quote),\nauthorSet[authorKey]['date'],\n\
  authorSet[authorKey]['location'],\nauthorSet[authorKey]['url']\n)\n```\n\nThe collected\
  \ set of information (author, quote, tags, and a few more) is finally written into\
