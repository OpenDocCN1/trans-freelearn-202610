  \ pycurl\nTraceback (most recent call last):\n  File \"<pyshell#4>\", line 1, in\
  \ <module>\n    import pycurl\nModuleNotFoundError: No module named 'pycurl'\n```\n\
  ```\n\nFigure 2.7: ModuleNotFoundError encountered when importing the requests library\n\
  \n与 *Figure 2.7* 类似的情况需要额外安装此类库，可以使用 pip 来处理。\n\n到目前为止，Python 已安装完成，并且我们已使用 CLI\
  \ 和 Python 的 **Graphical User Interface (GUI)**、IDLE 验证了安装。为了设置额外的库，例如 requests，我们首先需要采取一些额外的步骤，我们将在下一节中介绍。\n\
  \n## Creating a virtual environment\n\n在继续安装所需库或 Python 默认不可用的额外库之前，建议为项目创建一个虚拟环境。\n\
  \n虚拟环境为项目及其所需库维护一个目录，以避免库与系统之间的冲突。它通常为具有特定需求和规范的目标项目提供完整的环境。有关虚拟环境的更多信息，请访问 `https://docs.python.org/3/tutorial/venv.html`\
  \ 或 `https://docs.python-guide.org/dev/virtualenvs/`。\n\n我们将在虚拟环境中安装本书所需的所有库和工具。因此，让我们开始创建环境，并通过以下步骤使用\
  \ pip 加载所需库：\n\n- 1. 首先创建一个目录，例如 HOWScraping2E（这是我们希望将本书中的所有代码放置的位置），在根驱动器中（C:\\\
  HOWScraping2E>）。\n- 2. 在 HOWScraping2E 中，运行以下命令：\n- 3. 要激活我们创建的环境（secondEd），请使用\
  \ secondEd\\Scripts 运行 activate 命令，如 Figure 2.8 所示：\n- 4. 要停用或关闭环境，我们只需发出 deactivate\
  \ 命令，例如，(secondEd) C:\\HOWScraping2E> deactivate。建议在结束时或关闭系统前停用环境。\n\n```\nC:\\\
