  \ the page http://quotes.toscrape.com/tag/inspirational, as seen in Figure 5.3:\n\
  \n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_140_0.png)\n\nFigure 5.3: Category “inspirational”\n\
  \nThe example we are dealing with is similar to *Example 3 – scraping quotes with\
  \ author details* in Chapter 4. Only the links and compositions have changed, by\
