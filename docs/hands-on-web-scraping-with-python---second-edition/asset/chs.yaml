  Python For Data Analysis\",\n      \"edition_count\": 4,\n      \"edition_key\"\
  : [...], // 4 items\n      \"publish_date\": [...], // 3 items\n      \"publish_year\"\
  : [...], // 2 items\n      \"first_publish_year\": 2012,\n      \"number_of_pages_median\"\
  : 550,\n      \"lccn\": [...], // 1 item\n      \"oclc\": [...], // 2 items\n  \
  \    \"lcc\": [...], // 2 items\n      \"isbn\": [...], // 8 items\n    }\n  ]\n\
  }\n```\n\n图 7.3：Open Library API\n\n### 重要说明\n\n开发人员或用户应该打开或继续调查浏览器的 DevTools 并打开\
  \ Network 面板，以获取 HTTP 方法、HTTP 头、cookie、内容类型等内容和信息，以查看是否可以找到任何 API 链接。某些基于 Web 的逻辑用于生成内容时，后面也可能会使用多个\
  \ API。\n\n在本节中，我们探索了通过 API 找到的各种类型的数据。嵌套的、非嵌套的、key:value 对以及组合输出通常是 Web API 的预期结果。除此之外，API\
  \ 相关链接也很难找到，除非网站提供它们，否则 robots.txt 和 sitemap.xml 以及 DevTools 就需要彻底调查。\n\n在下一节中，我们将使用一些可自由使用的\
  \ Web API。我们将使用 Python 来抓取其内容。\n\n## 使用 API 进行 Web 抓取\n\n从技术上讲，从 API 获取数据很容易，也与\
  \ Web 抓取场景不同。大多数数据为 JSON 格式，不使用 XPath、CSS Selector 或任何其他解析库。某些使用 API 找到的数据可能包含大量\
  \ HTML 代码。要处理此内容，可能需要 XPath 和 CSS Selector。\n\n### 重要说明\n\n本节中的示例中，我们尝试省略需要 API\
  \ 密钥（walmartlabs.com、nasa.gov、nytimes.com、maps.googleapis.com）或用户身份验证工具的 API。API\
  \ 密钥是由服务提供商（用户注册后）提供的经过身份验证的值，用于识别使用 API 的用户。这些示例中使用的是可自由使用的 API。\n\n借助一些示例，我们将收集通过某些\
  \ API 返回的数据。然后将收集到的数据导出为 JSON 和 CSV 文件。\n\n## 示例 1 – 美国日历中的假日\n\nhttps://date.nager.at/\
  \ 包含有关全球公共假期的信息。https://date.nager.at/PublicHoliday/Country/US 显示美国公共假期的列表。可用于抓取的表格数据可用，但我们将使用\
  \ https://date.nager.at/api/v3/PublicHolidays/2023/US API 获取 2023 年的假日。\n\n以下代码声明\
  \ apiUrl，其中包含内容 URL：\n\n```\napiUrl= \"https://date.nager.at/api/v3/PublicHolidays/2023/US\"\
  \nheaders= {          # HTTP Request Header\n'accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,\
  \ image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7',\n'accept-language':\
  \ 'en-US,en;q=0.9',\n'cache-control':'max-age=0',\n'upgrade-insecure-requests':'1',\n\
  'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,\
  \ like Gecko) Chrome/111.0.0.0 Safari/537.36'\n}\nresponse = requests.get(apiUrl,\
  \ headers=headers).json()\n```\n\n\n\n响应是通过 requests 库中的 `json()` 函数收集的。HTTP 请求头，`headers`，也提供给\
  \ `requests.get()`。请求头实体或 headers 已通过 DevTools 中的 **Copy | Copy as cUrl (bash)**\
  \ 收集。\n\n如 *Figure 7.4* 所示，`apiUrl` 以 JSON 格式返回 HTTP 响应。为了处理 JSON 内容，requests 库有一个名为\
  \ `json()` 的方法（它完成了 JSON 内容的加载和转储，因此无需导入 json Python 库）用于处理 JSON 内容。\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_185_0.png)\n\
  \nFigure 7.4: JSON response from the API\n\nJSON 响应看起来简洁明了，易于处理。已决定仅从所有 JSON 列表中收集\
  \ `date` 和 `name`。\n\n以下代码块显示 `date` 和 `name` 条目正被收集到 lists 收集器中：\n\n```\n```python\n\
  lists=[]                 # empty list\nfor holiday in response:\n    lists.append([holiday['date'],holiday['name']])\n\
  \nlists                     # final list\nwriteto_csv(lists,'holidays.csv',['Date','Name'])\
  \       # Export to CSV\n```\n```\n\n最后，`lists` 使用预定义的 `writeto_csv()` 函数导出到名为 `holidays.csv`\
  \ 的文件，其中列标题为 Date 和 Name。\n\n## Example 2 – Open Library book details\n\nOpen Library\
  \ (https://openlibrary.org/developers/api) 提供了一个实验性搜索 API。它为其书籍和类似内容的集合提供了各种 API\
  \ 相关选项。对于本示例，将使用 https://openlibrary.org/dev/docs/api/search 来查找主题为 python 且作者为\
  \ Wes 的书籍数据（结果可通过 https://openlibrary.org/search.json?q=python&author=Wes 获取）。\n\
  \n如以下代码所定义，apiUrl 在 openlibrary.org 中搜索定义的 subject 和 author 变量。apiUrl 的响应为 JSON\
  \ 格式，但结构嵌套。对 apiUrl 的 HTTP 请求连同几个选定的 HTTP 头一起处理。`json()` 方法和 `requests.get()` 显示内容为\
  \ JSON 格式：\n\n```\nsubject=\"python\"\nauthor=\"Wes\"\napiUrl=\"https://openlibrary.org/search.json?q=\"\
  +subject+\"&author=\"+author\n\nheaders={\n'Upgrade-Insecure-Requests': '1',\n'User-Agent':\
  \ 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)\
  \ Chrome/111.0.0.0 Safari/537.36'\n}\nresponse = requests.get(apiUrl, headers=headers).json()\n\
  ```\n\n有关书籍的信息提供在各种索引、标题或键下，位于 response['docs'] 内部。字段如 'book_title'、'published_date'、'publisher'、'author'\
  \ 和 'subjects' 的值（如果可用）被收集到名为 lists 的列表中：\n\n```\nlists=[]  # Collector\nfor book\
  \ in response['docs']:\n    if 'subject_key' in book: # check if subject_key exists\n\
  \        lists.append([book['title'],\n        book['publish_date'][0],\n      \
  \  book['publisher'][0],\n        book['author_name'][0],\n        \"|\".join(book['subject_key'])])\n\
  \    else:\n        lists.append([book['title'],\n        book['publish_date'][0],\
  \ book['publisher'][0],\n        book['author_name'][0], ''])\n```\n\n收集完所有值后，数据随后写入\
  \ CSV 文件 python_wes.csv：\n\n```\nwriteto_csv(\n    lists,\n    'python_wes.csv',\n\
  \    ['book_title', 'published_date', 'publisher', 'author', 'subjects']\n)\n```\n\
