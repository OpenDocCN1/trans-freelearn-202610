  \ Soup ，打印其版本信息，为 4.11.1，并探索 bs4。我们可以在输出中看到有几个重要的类可用，例如 BeautifulSoup 和 SoupStrainer。\n\
  \n在本节中，我们已安装 Beautiful Soup 并验证了其安装及其版本信息。在下一节中，我们将探索 Beautiful Soup 的各种功能。\n\n\
  ## 探索 Beautiful Soup\n\n我们现在将探索 Beautiful Soup 中也称为 bs4 Python 库 的一些选定重要功能和类。本节将涵盖解析网页文档以及使用\
  \ Beautiful Soup 进行遍历、搜索和迭代的活动。\n\n在进行解析和使用 bs4 的功能时，我们将使用 BeautifulSoup 和 SoupStrainer\
  \ 类来定位网页文档的某些部分或元素：\n\n```\nfrom bs4 import BeautifulSoup as BSoup\nfrom bs4 import\
  \ SoupStrainer\n```\n\n如前面的代码所示，BeautifulSoup 和 SoupStrainer 类是从 bs4 导入的。在下一节中，我们将演示使用\
  \ bs4 进行解析。\n\n## 解析\n\n如前几节所述，解析是一种纠正内容错误的活动。使用解析器始终是推荐的，以从不同平台和系统上的网页内容中获得相似的结果。此外，我们需要计划或准备好接受，使用\
  \ BeautifulSoup 时，由于解析，项目会比平常花费更长时间。\n\nHTML 内容或代码块将连同所选解析器或类似 BSoup 的解析器 一可以是字符串或\
  \ HTML 解析器 传递给 BeautifulSoup，也称为 BSoup 构造函数。如果未指定解析器，系统将使用默认 HTML 解析器，通常是 lxml。\n\
  \n通常，BeautifulSoup 支持两种类型的解析器：\n\n- 标记类型：html、xml 和 html5\n- 解析器库名称：lxml、html5lib\
  \ 和 html.parser lxml 和 html5lib 必须安装后才能使用；html.parser 是内置 HTML 解析器\n\n> **重要说明**\n\
  > lxml 被推荐为与 BeautifulSoup 一起使用的最佳解析器，因为其内存和速度。html5lib 通常是第二选择，但解析输出也可以用于根据内容或\
  \ DOM 要求确定要使用的解析器的偏好。\n\n还需要注意的是，生成的解析树 输出 或解析内容将根据所使用的解析器而有所不同。为了演示解析，这里声明了一个带有不完整错误代码的\
  \ markup 变量：\n\n```\nmarkup = \"<a></p></a></p>\"\n```\n\n以下代码使用 markup 的默认解析器：\n\
  \n```\nBSoup(markup)    # <html><body><a></a></body></html>\n```\n\n已使用 html.parser\
  \ 解析器，并且仅解析了 <a>；</p> HTML 标签未从 markup 字符串变量中返回：\n\n```\nBSoup(markup,\"html.parser\"\
  )      # <a></a>\n```\n\nlxml 解析器和默认解析器的输出看起来相似：\n\n```\nBSoup(markup,\"lxml\")\
  \    # <html><body><a></a></body></html>\n```\n\n与 lxml 和 html.parser 相比，html5lib\
  \ 解析器似乎提供了更详细的信息：\n\n```\nBSoup(markup,\"html5lib\")\n# <html><head></head><body><a><p></p></a><p></p></body>\n\
  \  </html>\n```\n\n所有不完整的标签都已列在输出中，并且完整的 HTML 结构 <html>、<head>、<body> 也已保持。\n\n\n\
  \n\n\n<html>\n<head><title>睡鼠的故事</title></head>\n<body>\n<p class=\"title\"><b>睡鼠的故事</b></p>\n\
  <p class=\"story\">从前有三个小妹妹，她们的名字是\n<a href=\"http://example.com/elsie\" class=\"\
