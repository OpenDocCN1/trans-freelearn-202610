  在本部分，你将学习在收集高质量抓取数据后可以实践和执行的先进概念。你将学习如何从各种来源读取收集的数据并执行分析、可视化等活动，以帮助从数据中生成信息和模式。这些信息将帮助你进行决策等等。你还将学习机器学习并部署你的数据模型以生成信息来分析文本情感、进行预测等等。


  本部分包含以下章节：


