  \ 和页面源来识别或查找目标内容是本章的重点。这些信息将指导您在网络抓取中采取初步和专业的步骤。\n\n在下一章中，我们将使用 Python 编程语言与网络或数据源交互，并探索我们为数据提取而选择的几个主要库。\n\
