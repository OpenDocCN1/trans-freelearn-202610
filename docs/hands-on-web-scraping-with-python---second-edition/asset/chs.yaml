  \ 111.0.5563.64 文本的链接，如图 8.1 所示：\n\n- 8. 根据操作系统（就我们而言是 Windows 操作系统），选择 chromedriver，如图\
  \ 8.2 所示，并下载它。\n\n- 9. 成功下载压缩文件（chromedriver_win32.zip）后，可以将其解压或将内容（chromedriver.exe）提取到项目根文件夹或任何适当的位置。chromedriver.exe\
  \ 的路径可以设置在变量中并用于开发代码。\n\n> **重要说明**\n> 使用 selenium 安装和访问 chromedriver 有多种方法。请按照提供的链接获取更详细的信息：https://selenium-python.readthedocs.io/installation.html\
  \ 和 https://www.selenium.dev/documentation/webdriver/getting_started/install_drivers/。如果尝试或测试任何不同的浏览器，也可以遵循类似的步骤。\n\
  \n完成与设置相关的步骤后，在下一节中，我们将借助代码示例验证设置。\n\n## 验证设置\n\n在设置阶段，我们必须访问和处理一些链接，下载文件等等。为了验证设置并确认驱动程序运行正常，让我们部署加载\
  \ https://www.python.org URL 到浏览器（Chrome）中的代码，借助 selenium 和 chromedriver：\n\n```\n\
  from selenium import webdriver\nfrom selenium.webdriver.chrome.service import Service\n\
  chromedriver_path=\"C:\\HOWScraping2E\\driver\\chromedriver.exe\"    # path\nservice\
  \ = Service(service=chromedriver_path)\ndriver = webdriver.Chrome(service=service)\n\
  # initiate an empty Chrome window\ndriver.get('https://www.python.org')  # loads\
  \ URL in browser\ndriver.quit() # closes browser & terminates the session\n```\n\
  \n在此代码块中，我们首先导入了 webdriver 然后导入了 Service。selenium.webdriver 由各种工具和类组成。Service 是来自\
  \ webdriver.chrome.service 的类之一。Service 主要与基于浏览器的功能和函数相关联。chromedriver.exe 的路径（位置）很重要，必须提供给\
  \ service。\n\n> **重要说明**\n> \n> Selenium 的早期版本可以接受 `chromedriver.exe` 的路径作为 executable_path\
  \ 属性。executable_path 属性现已弃用。现在，Chrome() 需要一个作为 Service 对象的路径。\n\n`driver = webdriver.Chrome(service=service)`\
  \ 创建一个新会话并显示一个空的浏览器窗口，如 *图 8.3* 所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_199_0.png)\n\
  \n图 8.3：Chrome 的空浏览器窗口\n\n总是在顶部有一个警报消息，包含文本 **Chrome is being controlled by automated\
  \ test software**，如 *图 8.3* 所示。该文本传达 Selenium WebDriver 正在工作，并且 Chrome 正被自动化相关软件使用。\n\
  \n通常，到目前为止的步骤可以被视为在机器上加载网络浏览器。`driver.get('https://www.python.org')` 代码加载 URL（就像用户在浏览器中输入\
  \ URL 一样）。`get()` 方法接受 URL 并将其传递给驱动程序，几乎就像 HTTP 请求一样。最后，`driver.quit()` 代码关闭加载了\
  \ `https://www.python.org` 的浏览器窗口并终止驱动程序会话。\n\n在下一节中，我们将更详细地探索 `selenium.webdriver`\
  \ 和 selenium 库，并附带示例。\n\n## 探索 Selenium\n\n一旦 Selenium WebDriver 成功安装并正常工作，就可以使用自动化完成大量活动。我们将探索一些基本的事情，并深入研究将自动化作为解决问题方案的使用，同时附带代码示例。\n\
  \n> **重要说明**\n> \n> 有关更多详细信息和解释性文档，请访问 `https://www.selenium.dev/documentation/webdriver/`\
  \ 和 `https://selenium-python.readthedocs.io/getting-started.html`。\n\n## 基本探索\n\n\
  在以下代码示例中，我们将了解使用 Selenium 进行的一些基本活动，这些活动通常是优先任务：\n\n```\nfrom selenium import webdriver\n\
  from selenium.webdriver.chrome.service import Service\nchromedriver_path=\"C:\\\
  HOWScraping2E\\driver\\chromedriver.exe\"\nservice = Service(service=chromedriver_path)\n\
  driver = webdriver.Chrome(service=service)\n# chromedriver\n```\n\n这里，一个空的新 Chrome\
  \ 窗口被加载，与图 8.3 中显示的浏览器窗口类似。\n\n我们现在将提供三个不同的 URL 并通过获取一些信息来迭代它们：\n\n```\nurls = {\n\
  \    'google':'https://www.google.com',\n    'python':'https://www.python.org',\n\
  \    'selenium':'https://www.selenium.dev'\n}\n```\n\n现在，让我们迭代 urls 字典中的 items()：\n\
  \n```\nfor key,url in urls.items():    # iterate the urls items\n    driver.get(url)\n\
  \    driver.implicitly_wait(1)      # Wait 1 sec\n    print(driver.title)      \
  \     # HTML <title>\n    print(driver.current_url)     # Current URL\n```\n\ndriver.get(url)\
  \ 在浏览器中加载 URL。implicitly_wait(1) 方法被用作睡眠时间，在采取任何进一步操作之前等待分配的 1 秒。driver.title 代码返回\
  \ <title> HTML 值。driver.current_url 显示重定向 URL 或当前在浏览器中加载的最新 URL。\n\nSelenium 还支持与屏幕截图相关的功能。get_screenshot_as_file()\
  \ 是用于此目的的常用方法之一：\n\n```\nprint(driver.get_cookies())\ndriver.get_screenshot_as_file(key+\"\
  .png\")  # png files\nprint(driver.page_source)      # HTML page source\ndriver.implicitly_wait(3)\
  \      # wait 3 sec before page Refresh\ndriver.refresh()               # refresh\
  \ the page\n```\n\ndriver.get_cookies() 列出以 JSON 格式存在的所有 cookie 相关值。\n\n接收、更新和设置\
  \ cookie 相关值以绕过某些安全功能是很常见的。从网络抓取的角度来看，使用 selenium 获取 cookie 值并处理它们是主要任务之一。\n\ndriver.page_source\
  \ 返回页面的页面源或页面的 HTML 源。从 Selenium 获取 page_source 也是 Selenium 的重要功能之一。在 page_source\
  \ 中，我们可以找到使用 JavaScript 动态形成或生成的数值。page_source 内容是必需的，可以使用 lxml、pyQuery、bs4 和其他\
  \ Python 库进行解析。refresh() 方法就像浏览器基于的页面刷新按钮。\n\n浏览器基于的历史遍历按钮由 driver 方法 back() 和 forward()\
  \ 处理：\n\n```\ndriver.back() # history Python.org\ndriver.forward() # go forward\n\
  ```\n\nback() 带您到上一页，而 forward() 带您到下一页。\n\n在此示例中，我们使用了与 driver 相关的特性和函数。在下一节中，我们将查找和定位\
  \ HTML 元素并处理动态值。\n\n## HTML 表单和元素，以及 JavaScript\n\n表单（HTML <form>）管理或处理是自动化、测试和整体质量分析（QA）的优先任务之一。使用\
  \ Selenium 进行此类任务在时间方面很方便（迭代值、并行处理）。\n\n尽管我们将使用自动化工具，但我们需要使用 CSS Selector、XPath\
  \ 或 Selenium 中可用的一些新方法来识别元素。识别 HTML 元素（id、name）、它们的位置和值是处理它们所必需的。对于以下示例，我们将使用来自\
  \ https://phptravels.com/demo 的 HTML <form>。\n\n在分析期间，似乎 Instant Demo Request Form\
  \ 表单（如图 8.4 所示）总共有五个 <input> 元素和一个用于提交信息的 <button> 元素。\n\n\n\n\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_202_0.png)\n\
  \n图 8.4：即时演示请求表单\n\n该表单还实现了基本的安全验证。它要求提交两个数值之和。当通过页面源代码或 DevTools 浏览时，这两个数值无法直接被识别，只能通过它们对应的元素（`span#numb1`、`span#numb2`）来识别，如图\
  \ 8.5 所示。\n\n```html\n<input type=\"text\" name=\"first_name\" class=\"first_name\
  \ input mb1\" placeholder=\"First Name\">\n<input type=\"text\" name=\"last_name\"\
  \ class=\"last_name input mb1\" placeholder=\"Last Name\">\n<input type=\"text\"\
  \ name=\"business_name\" class=\"business_name input mb1\" placeholder=\"Business\
  \ Name\">\n<input type=\"email\" name=\"email\" class=\"email input mb1\" placeholder=\"\
  Email\">\n\n<div class=\"row fcr\">\n  <div class=\"col-lg-6 mb1\">\n    <button\
  \ id=\"demo\" class=\"btn w100\">Submit</button>\n  </div>\n  <div class=\"col-lg-6\"\
  >\n    <!-- div style=\"margin-bottom:10px\" class=\"g-recaptcha\" data-sitekey=\"\
  6LdX3oUAAAAAFCG5tmOMFJaCF3LkXUN4p\" -->\n    <div class=\"df\">\n      <h2 class=\"\
  cv mv100\" style=\"margin-top:10px\"><span id=\"numb1\"></span> + <span id=\"numb2\"\
  ></span> = </h2>\n      <input id=\"number\" type=\"text\" placeholder=\"Result\
  \ ?\" >\n    </div>\n  </div>\n</div>\n```\n\n图 8.5：动态内容 numb1、numb2（用于提交）\n\nHTML\
  \ 元素 `<span id=\"numb1\">` 和 `<span id=\"numb2\">` 都是空的。它们的值由 JavaScript 动态生成，如图\
  \ 8.6 中的代码所示：\n\n```javascript\n<script type=\"daf78653d796298cd9e56337-text/javascript\"\
  >\n    numb1 = Math.floor((Math.random() * 10) + 1);\n    numb2 = Math.floor((Math.random()\
  \ * 10) + 1);\n\n    document.getElementById(\"numb1\").innerHTML = numb1;\n   \
  \ document.getElementById(\"numb2\").innerHTML = numb2;\n</script>\n```\n\n图 8.6：JavaScript\
  \ 向 HTML 元素提供随机值\n\nJavaScript 代码 `document.getElementById(\"numb1\").innerHTML\
  \ = numb1` 会将 numb1 的值（某个随机数值）设置/赋给 `id=\"numb1\"` 的 HTML 元素（`<span id=\"numb1\"\
  ></span>`）。例如，如果 numb1 的值为 10，`<span id=\"numb1\"></span>` 将变成 `<span id=\"numb1\"\
  >10</span>`。同样，numb2 也会被赋予一个数值：\n\n```python\nnum1 = driver.find_element(By.ID,\"\
  numb1\").text\nnum2 = driver.find_element(By.ID,\"numb2\").text\nresult = int(num1)+int(num2)\n\
  ```\n\n这段代码从 ID 为 `numb1` 和 `numb2` 的 `<span>` 元素中提取文本字符串值。然后使用 Python 的 `int()`\
  \ 方法将这些文本值转换为整数：\n\n```python\ndriver.find_element(By.ID,\"number\").send_keys(result)\n\
  ```\n\n使用 `send_keys()` 将两个整数的和 `result` 输入或提供给 `id=\"number\"` 的 `<input>` 元素。\n\
  \n> **重要提示**\n>\n> `send_keys()` 是可与文本字段和包含内容的元素配合使用的交互式命令之一。如需更详细的信息，请访问 https://www.selenium.dev/documentation/webdriver/elements/interactions/。\n\
  \n`selenium.webdriver` 提供了多种元素定位器，用于识别 HTML 元素及其相关属性。这些定位器作为参数传递给 driver 的方法：\n\n\
  - `find_element()`：返回单个元素\n- `find_elements()`：返回多个元素或元素列表\n\n通过导入或使用 `By` 类（`from\
  \ selenium.webdriver.common.by import By`），可以找到各种定位器和属性。其中一些如下：\n\n- `By.ID`：查找带有\
  \ `id` 属性的元素，例如使用 `driver.find_element(By.ID, \"numb1\")` 定位 `<span id=\"numb1\"\
  >`\n- `By.XPATH`：通过提供 XPath 表达式查找元素，例如 `driver.find_element(By.XPATH, \"//*[@id='demo']\"\
  )`\n- `By.NAME`：查找带有 `name` 属性的元素，例如 `driver.find_element(By.NAME, \"first_name\"\
  )`\n- `By.TAG_NAME`：按标签名查找元素，例如 `driver.find_element(By.TAG_NAME, \"h2\")`\n- `By.CLASS_NAME`：查找带有\
  \ `class` 属性的元素，例如 `driver.find_element(By.CLASS_NAME, \"email\")`\n- `By.CSS_SELECTOR`：使用\
  \ CSS 选择器表达式查找元素，例如 `driver.find_element(By.CSS_SELECTOR, \".completed > h2\")`\n\
  - `By.LINK_TEXT`：从可用链接中查找与所提供的完整字符串匹配的元素，例如 `driver.find_element(By.LINK_TEXT, \"\
  Childrens\")` 将匹配包含 “Childrens” 文本的锚标签（`<a>`）元素\n- `By.PARTIAL_LINK_TEXT`：从可用链接中查找与所提供的字符串的一部分匹配的元素，例如\
  \ `driver.find_element(By.PARTIAL_LINK_TEXT, \"click\")` 将匹配包含文本（或文本的一部分）click 的锚标签（`<a>`）元素\n\
  \n有关 XPath 和 CSS 选择器的更多信息，请参阅第 3 章的*“使用 XPath 和 CSS 选择器处理标记文档”*一节。除了定位器之外，还有许多辅助方法和属性。下面列出一些常用的及其示例：\n\
  \n- `text`：提取或复制内容。例如，代码 `num1 = driver.find_element(By.ID, \"numb1\").text` 将从\
  \ `id=\"numb1\"` 的元素中提取内容。\n- `tag_name`：返回所提供定位器对应的 HTML 标签名。例如，`driver.find_element(By.ID,\
  \ \"numb1\").tag_name` 将返回 `id=\"numb1\"` 定位器所引用的标签名。\n- `click()`：在网页上执行交互操作，例如鼠标点击。例如，`driver.find_element(By.ID,\
  \ \"demo\").click()` 将点击 `id=\"demo\"` 的元素。\n- `clear()`：清除可编辑元素中的文本。例如，`driver.find_element(By.NAME,\
  \ 'first_name').clear()` 将清除 `<input name='first_name'>` 中的文本或已有值。\n- `get_attribute()`：如果属性值可用，则返回该属性值。例如，`driver.find(By.NAME,'first_name').get_attribute('class')`\
  \ 将返回带有 `name=\"first_name\"` 属性的元素的 class 属性值。\n- `get_screenshot_as_file()`：捕获网页指定区域或默认屏幕的截图。例如，`driver.get_screenshot_as_file('filename.png')`\
  \ 将在代码所在位置捕获一张文件名为 `'filename.png'` 的截图。\n- `is_enabled()`：根据元素的启用或禁用属性，为所提供的定位器返回一个布尔值（True\
  \ 或 False）（*禁用的表单元素不可用或无法交互*）。例如，`driver.find_element(By.NAME,'first_name').is_enabled()`\
  \ 将返回 True。HTML 元素可以带有 `disabled` 属性，例如 `<input type=\"text\" value=\"something\"\
  \ disabled />`。\n\n> **重要提示**\n>\n> 关于 WebDriver 更详细的列表、信息和示例，请访问 `https://www.selenium.dev/documentation/webdriver/`。\n\
  \n本节让我们对 Selenium WebDriver（`selenium.webdriver`）有了选择性的概述，包括如何使用它，以及如何通过一些示例探索各种方法和属性。从抓取的角度来看，我们需要将\
  \ Selenium 和其他解析库中可用的数据与信息，绑定到逻辑或已实现的上下文中，或对其进行管理。\n\n在下一节中，我们将使用 Selenium 抓取网站并收集数据。\n\
  \n## 使用 Selenium 进行抓取\n\nSelenium 用于自动化——主要是 Web 测试——可使用各种浏览器，并以不同语言编写代码。除了自动化，它提供的优点或功能也非常方便，可用于\
  \ Web 抓取等任务。\n\n在本节中，我们将使用并探索 `selenium` 库中用于 Web 抓取的不少功能。\n\n### 示例 1——图书信息\n\n\
  在本示例中，我们将从 `http://books.toscrape.com` 上 **Childrens（儿童）** 类别中列出的书籍收集一些详细信息，这些书籍可在\
  \ `https://toscrape.com` 这个虚构书店网站上找到。\n\n```python\nimageSrc = image.find_element(By.TAG_NAME,\n\
  \    'img').get_attribute('src')\n…\nprice = article.find_element(By.CLASS_NAME,\n\
  \    \"price_color\").text\n```\n\n`articleLink` 变量包含指向特定书籍详情页的 `href` 值。有些信息只在详情页上提供，例如\
  \ UPC 和*库存情况（库存状态、数量）*。这里还使用了 XPath 定位器。例如，`//th[contains(text(),'UPC')]/following-sibling::td`\
  \ 指向在包含 UPC 文本的 `<th>...</th>` 之后出现的 `<td>` 元素。请参阅第 3 章的*“使用 XPath 和 CSS 选择器处理标记文档”*一节：\n\
  \n```python\nif articleLink:\n    listing.find_element(By.TAG_NAME,'img').click()\n\
  \    upc = driver.find_element(By.XPATH,\n        \"//th[contains(text(),'UPC')]/\n\
  \            following-sibling::td\").text\n\n    stockQty= driver.find_element(By.XPATH,\n\
  \        \"//th[contains(text(),'Availability')]/\n            following-sibling::td\"\
  ).text\n```\n\n至此，上述代码会从列表中每本书收集信息，并加载详情页。从列表和详情页收集的数据会使用 Python 的 `strip()` 和 `replace()`\
  \ 方法进行清理和预处理，然后添加到临时收集器或临时列表 `temp` 中。最后，将 `temp` 添加到主数据收集器 `dataSet` 中：\n\n```python\n\
  temp = [upc, title, price,\n    rating.replace('star-rating','').strip(),\n    stockQty.split('(')[0].strip(),\n\
  \    stockQty.split('(')[1].replace('available', '').\n        replace(')','').strip(),\
  \ articleLink, imageSrc]\ndataSet.append(temp) # append temp list details to main\
  \ dataSet.\n```\n\n> **重要提示**\n>\n> `strip()` 会清理或删除字符串左右两边的多余空白字符。`replace()` 用于将一个字符替换为另一个字符。Python\
  \ `list()` 的 `append()` 方法用于向现有的 Python `list()` 对象添加/推入元素。更多详情请参阅 https://docs.python.org/3/library/index.html。\n\
  \n\n\n\n在收集所需数据后，`driver.back()` 会再次加载列表页面（它提供即时历史记录，类似于浏览器窗口中可用的后退按钮），并迭代下一个可用的\
  \ `<li>` 列表元素。Selenium WebDriver 通过 `back()` 和 `forward()` 方法支持浏览器历史相关控件：\n\n```python\n\
  # 返回历史记录（从图书详情页到列表页）\ndriver.back()\n```\n\n由于“儿童”类别中有多个页面，代码会以 `pagination(True)`\
  \ 值迭代页面，并搜索带有“next”文本的链接。本例中使用 Python 异常处理来验证带有“next”文本的元素是否存在：\n\n- 如果元素存在，则页面计数递增，并加载另一个列表页面\n\
  - 如果元素不存在，则捕获 `NoSuchElementException` 异常，通过将分页布尔值更新为 `False` 来禁用页面循环：\n\n```python\n\
  try:\n    # 在列表页面中检查带有文本 'next' 的分页\n    driver.find_element(By.LINK_TEXT,'next').click()\n\
  \    page = page+1\nexcept NoSuchElementException:\n    pagination = False\n   \
  \ print(f\"Further Pagination is not possible, currently at {page}\")\n```\n\n>\
  \ **重要提示**\n> 有关异常处理的更多信息，请访问以下链接：https://docs.python.org/3/tutorial/errors.html\
  \ 和 https://selenium-python.readthedocs.io/api.html。\n\n在页面和列表的循环完成后，收集在 `dataSet`\
  \ 中的最终数据被赋予计划好的列名，这些列名列在列表 `['Upc', 'Title', 'Price', 'Rating', 'Stock', 'Stock_Qty',\
  \ 'Url', 'Image']` 中，并用于创建 CSV 和 JSON 文件。\n\n## 示例 2 – 表单与搜索\n\n在示例 2 中，我们将使用 Selenium\
  \ 登录、注销，并遍历可用页面，从 http://quotes.toscrape.com/ 收集基于各种引用的数据。与示例 1 类似，我们将从 http://toscrape.com\
  \ 定位并处理包含“Login”文本的链接。\n\n以下代码搜索带有“Login”文本的锚元素，并收集 `href` 属性。`click()` 操作应用于该“Login”元素。这会加载\
  \ http://quotes.toscrape.com/login 页面。WebDriver 有一些属性，例如 `current_url`。该属性返回浏览器中加载页面的\
  \ URL：\n\n```python\nmainUrl=https://toscrape.com/\ndriver.get(mainUrl)  # 加载 toscrape.com\n\
  loginPage = driver.find_element(By.LINK_TEXT,\n    \"Login\").get_attribute('href')\n\
  print(loginPage)\nhttp://quotes.toscrape.com/login\n\ndriver.find_element(By.LINK_TEXT,\
  \ \"Login\").click()\n\nprint(f\"Before Login : {driver.current_url}\")\nhttp://quotes.toscrape.com/login\n\
  ```\n\n带有“Login”文本的元素位于所加载页面页脚附近，我们需要向下滚动才能看到该元素。如果浏览器窗口有垂直滚动条（取决于窗口尺寸，如果已配置），`driver.find_element(By.LINK_TEXT,\
  \ \"Login\").click()` 代码将垂直向下滚动页面，直到带有“Login”文本的元素可见，然后点击它。这减少了在 4.1.0 版本之前必须编写的窗口滚动相关代码。\n\
  \nhttp://quotes.toscrape.com/login 页面包含 HTML `<form>` 元素，其中包含几个输入框和一个提交按钮。该表单接受任何凭据，例如\
  \ `username=test` 和 `password=test`。由于必须用凭据填充 `<input>` 类型，因此先识别它们，使用 `clear()`\
  \ 清除，最后使用 `send_keys()` 输入文本值。这些操作自动化了滚动或移动到元素、点击元素以及键入字符的过程：\n\n```python\nusername\
  \ = driver.find_element(By.ID, \"username\")\nusername.clear()  # 清除可能存在的任何字符\n\
  username.send_keys(\"test\") # 输入值\npassword = driver.find_element(By.ID, \"password\"\
  )\npassword.clear()\npassword.send_keys(\"test\")\n```\n\n在向相应的输入元素提供用户名和密码值后，必须进行表单提交。提交相关方法在\
  \ 4.0 版本之前可用，但我们可以通过定位提交表单值的按钮并点击它（使用 `click()` 方法）来实现相同的目的：\n\n```python\ndriver.find_element(By.CLASS_NAME,'btn').click()\n\
  # 点击提交按钮\nquotesUrl = driver.current_url\nprint(f\"After Login : {quotesUrl}\")\
  \ http://quotes.toscrape.com/\nlogoutUrl = driver.find_element(By.LINK_TEXT,\n \
  \   \"Logout\").get_attribute('href')\nprint(f\"Logout : {logoutUrl}\") http://quotes.toscrape.com/logout\n\
  ```\n\n提交登录表单后，您会注意到有一个带有“Logout”文本的链接，指向 http://quotes.toscrape.com/logout URL。这验证了登录相关步骤已成功完成。\n\
  \n**重要提示**\n读者和开发人员会发现处理 HTML 表单相当容易。如果使用 **DevTools** 跟踪，HTTP POST 方法会随有效负载数据（用户名、密码和\
  \ csrf_token）一起提交。\n\n页面上有多个引用 `<div>` 块，带有分页元素（`driver.find_element(By.CSS_SELECTOR,'li.next\
  \ a').click()`）。`quotes` 标识使用 `find_elements()` 定位的各个引用块。分页使用布尔值管理，并从每个引用块中提取所需或计划的数据。最后，将数据添加到主\
  \ `dataSet` 收集器中：\n\n```python\nquotes = driver.find_elements(By.CSS_SELECTOR,\n\
  \    \"div.row .quote\")\nfor quote in quotes: # 迭代可用的引用\n    content =\n      \
  \  quote.find_element(By.CSS_SELECTOR,'.text').text\n    author =\n        quote.find_element(By.CLASS_NAME,\"\
  author\").text\n    authorLink =\n        quote.find_element(By.PARTIAL_LINK_TEXT,\"\
  about\")\n        .get_attribute('href')\n    authorGoodread =\n        quote.find_element(By.PARTIAL_LINK_TEXT,\"\
  Goodread\")\n        .get_attribute('href')\n    tags =\n        quote.find_element(By.TAG_NAME,'meta')\n\
  \        .get_attribute('content')\n```\n\n```python\n.....:\n# 将值添加到 dataSet\n\
  dataSet.append([author, content, tags, tag_count,\n    authorLink, authorGoodread])\n\
  ```\n\n在分页循环和每个页面的引用完成后，最后执行注销操作。注销后，浏览器加载 http://quotes.toscrape.com 页面：\n\n```python\n\
  driver.get(logoutUrl)\nprint(f\"Current URL: {driver.current_url}\")\nhttp://quotes.toscrape.com/\n\
  ```\n\n有了数据在手或主 `dataSet` 收集器中，这些数据可以写入 CSV 文件（使用“author”、“quote”、“tags”、“tag_count”、“author_url”、“goodread_url”作为表头）或\
  \ JSON 文件。最后，使用 `driver.quit()` 关闭由 WebDriver 加载的浏览器。\n\n本节中的网页抓取示例使用了 selenium\
  \ 库中的各种标识符、定位器、属性和方法。WebDriver 对于自动化任务（无论是重复性还是非重复性）非常有效。Selenium 常用于 Web 应用相关测试，但我们在这里探讨了它用于抓取的目的。要进一步探索\
  \ Selenium，请查看本章中分享的内容和链接。\n\n## 总结\n\nSelenium 框架具有许多功能，并广泛用于应用测试和浏览器自动化。通过探索其功能，我们学习了如何使用\
  \ WebDriver 进行与抓取相关的任务。Python 编程确实有独立的库来处理 HTML 或 Web 内容、浏览器属性、网络、解析等。Selenium 可以独立处理这些功能，这是\
  \ Selenium 相对于其他各种 Python 库的主要优势。该框架也在不断更新，用测试、自动化和开发人员友好的功能丰富了平台。\n\n在下一章中，我们将学习正则表达式以及如何使用它们来提取或抓取数据。\n\
  \n## 进一步阅读\n\n- Selenium：\n  - https://selenium-python.readthedocs.io/\n  - https://developer.mozilla.org/en-US/docs/Web/HTML\n\
  \  - https://www.lambdatest.com/blog/selenium-webdriver-tutorial-with-examples/\n\
  \n\n\n\n\n- *浏览器自动化：*\n  - https://www.browserstack.com/guide/what-is-browser-automation\n\
  \  - https://community.dataquest.io/t/web-scraping-without-selenium/456297\n- *自动化练习站点：*\n\
  \  - https://www.automationexercise.com/\n  - https://practicetestautomation.com/practice-test-login/\n\
  - *Chromium:* https://chromedriver.chromium.org/documentation\n- *Puppeteer, Playwright:*\n\
  \  - https://pptr.dev/\n  - https://playwright.dev/\n"
- "# 使用正则表达式和 PDF\n\n到目前为止，我们已经学习并探索了一些核心 Python 库在网络通信、内容读取和浏览器自动化方面的应用，用于数据查找和提取。\n\
  \n**正则表达式**（也称为 **Regex**、**regex** 或 **RegEx** —— 在本章剩余部分我们将使用 **regex**）是使用预定义的一组字符构建的，用于搜索和类似活动的一种模式。在\
  \ *第 3 章和第 4 章* 中，在进行网页抓取时，我们测试并应用了各种可用功能，例如 *CSS 选择器*、*XPath* 和 *PyQuery*，以查找和定位特定类型的活动。Regex\
  \ 帮助我们进行模式匹配 —— 在处理文档或任何文本内容时，我们有意识或无意识地大部分时间都在使用 regex。\n\n在数据相关上下文中，很难避免查找、搜索和匹配等活动。Regex\
  \ 为处理此类活动提供了一种简单而优雅的方法。数据以结构化或非结构化格式存在于各种形式和类型的文档中。**便携式文档格式（PDF）** 是一种安全、功能齐全、压缩良好的文档格式，可轻松通过互联网传输。与其他文本文档格式相比，PDF\
  \ 不同。我们将在本章学习从 PDF 中提取数据。\n\n在本章中，我们将学习以下主题：\n\n- regex 概述\n- 使用 Python 的 regex\n\
  - 使用 regex 提取数据\n- 从 PDF 提取数据\n\n# 技术要求\n\n需要一个网络浏览器（*Google Chrome* 或 *Mozilla\
  \ Firefox*），并且我们将使用 *JupyterLab* 进行 Python 代码。\n\n请参考 *第 2 章* 中的 *设置事项* 和 *创建虚拟环境*\
  \ 部分以继续设置和使用创建的环境。请参考 https://pypdf2.readthedocs.io/en/3.0.0/user/installation.html\
  \ 安装 **PyPDF2。**\n\n本章所需的 Python 库如下：\n\n- `requests`\n- `re`\n- `pypdf2`\n\n本章的代码文件可在本书的\
  \ GitHub 仓库在线获取：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter09。\n\
  \n# regex 概述\n\n在很多情况下，使用 XPath 和 CSS 选择器定位某些基于网络的内容或元素是相当困难的，甚至是不可能的。幸运的是，我们可以使用\
  \ regex 克服这种情况。regex 是一个使用字符串构建的表达式，用于通过识别现有模式来查找或搜索内容。\n\n在网页抓取和提取相关活动中，regex 也被用作最终或首选的模式匹配选项。模式可以使用各种步骤定义，通常伴随表示预定义规则的特殊符号。regex\
  \ 就像对纯文本进行分组和书写一样，许多库和文本相关功能都使用这些表达式，为我们提供方便易用的函数。\n\n最新的代码编辑器、文档阅读器和写作程序都提供诸如在文件、多页和项目文件夹内搜索，以及查找和替换等功能。要使用这些选项，我们需要输入文本或\
  \ regex；无论如何，模式匹配或 regex 都将用于搜索内容。\n\nregex 通常在其他选项不起作用时使用，有时甚至是首选方法。范围可以扩展到一些重要功能，例如以下内容：\n\
  \n- 将内容拆分为块，也称为爆炸或将内容切片成块\n- 查找所有或多个匹配项\n- 基于模式替换或替换内容\n\n以下是数据提取过程中 regex 被广泛使用的一些常见用例：\n\
  \n- 验证电子邮件地址\n- 从地址中匹配或收集邮政编码或邮编\n- 从地理地址中匹配纬度和经度\n- 查找页面上列出的项目数量\n- 验证电话/手机号码\n\
  - 验证日期和时间\n- 使用生成的（用户定义）模式提取内容\n\nregex 可以在大多数支持文本的应用程序或服务中定义和运行。外观相当简单、优雅的表达式可用于处理任何类型的用例。其可用性和可扩展性取决于内容，使其成为强大的文本功能。请访问\
  \ https://www.regular-expressions.info/ 和 https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_expressions\
  \ 获取有关 regex 的详细信息。\n\n**重要说明**\n基于 Unix/Linux 的 grep（global regular expression\
  \ print，全球正则表达式打印）命令非常强大，在 Unix/Linux 用户和开发者中很著名。grep 用于匹配和过滤模式，甚至被认为是一种模式匹配引擎。请访问\
  \ https://www.gnu.org/software/grep/ 获取更详细信息。\n\n在下一节中，我们将更详细地探索 regex 并在实际示例中使用\
  \ re Python 库。\n\n# 使用 Python 的 Regex\n\nPython 编程以其简单、可读、可重用和简短的代码而闻名。Python 也因其科学计算和文本计算功能而流行（**自然语言处理（NLP）**、**情感分析（SA）**\
  \ 等等）。Regex 也是 Python 的核心能力之一，因为 re（regex 库）作为系统或内置库提供，随 Python 安装即可使用。\n\n让我们深入研究\
  \ re 并通过代码查看其中的一些功能。对于此示例，我们将使用 Sadhguru 的以下著名名言（可在 https://isha.sadhguru.org/us/en/wisdom/type/quotes\
  \ 获取）：\n\n> *如果你不与自己为敌，人类的潜能是无限的。*\n\n我们定义了一个名为 quote 的 Python 变量，其值包含前述引语：\n\n\
  ```\nquote=\"If you do not turn against yourself, the Human Potential is limitless\"\
  \n```\n\n在接下来的部分中，我们将使用 re 方法查找至少三个字符长的单词，或字符串长度为三的单词，这些是数据相关任务中常用的方法。\n\n# re（search、match\
  \ 和 findall）\n\nPython 的 re 库提供了各种类型的搜索相关方法。一些通常用于在任何代码中搜索模式的常见方法列于此处：\n\n- search():\
  \ 在字符串中查找与给定模式匹配的位置并返回第一个匹配对象（re.Match）。如前述代码所示，只返回您或在 quote 字符串中找到的第一个匹配项。\n- match():\
  \ 此方法在字符串开头查找匹配项。在前述代码的情况下，它不匹配任何内容。re.match() 在成功时也返回各种函数（start、end、span、group、groups\
  \ 等）和属性（lastindex 和 lastgroup），这在任何情况下都有信息性，但在与 re.finditer() 一起使用时更有用。请访问 https://docs.python.org/3/library/re.html?highlight=regular%20expressions#functions\
  \ 获取更详细信息。\n- findall(): 此方法接受一个模式以在字符串中搜索所有匹配项。它类似于从头到尾迭代 search() 方法。\n\n在即将到来的小节中，我们将学习如何生成\
  \ regex 并通过示例应用它。\n\n# 使用字符集的 Regex\n\n在 regex 中，我们可以使用 [] 查找一组字符。如以下代码所示，[a-z]\
  \ 查找由 a 到 z 字符组成的任何单词组合：\n\n```\nre.search(r\"([a-z]{3})\",quote) # <re.Match object;\
  \ span=(3, 6), match='you'>\n```\n\n在前述代码中，为了固定长度或检查出现次数，我们使用 {}；因此表达式 [a-z]{3}\
  \ 中的 {3} 正在查找由最多三个字母字符组成的单词的匹配项（例如 you、not 和 the）。\n\n通常，regex 模式以 r 字符开头的字符串提供。r\"\
  [a-z]\" 是一个字符串，但也是 regex，也称为原始字符串。此外，我们需要小心字符大小写（小写或大写），因为 regex 模式区分大小写。在一般情况下，我们\n\
  \n\n\n可以应用 `flags=re.IGNORECASE` 来忽略文本大小写，如下例所示。我们还可以看到，在以下代码块中返回了所有三个字符组合的结果：\n\
  \n```\nre.findall(\"([a-z]{3})\",quote)\n# ['you', 'not', 'tur', 'aga', 'ins', 'you',\
  \ 'rse', 'the', 'uma', 'ote', 'nti', 'lim', 'itl', 'ess']\nre.findall(r\"([a-z]{3})\"\
  ,quote, flags=re.IGNORECASE)\n# ['you', 'not', 'tur', 'aga', 'ins', 'you', 'rse',\
  \ 'the', 'Hum', 'Pot', 'ent', 'ial', 'lim', 'itl', 'ess']\n```\n\n## 使用转义代码的正则表达式\n\
  \n除了提及一组字符外，我们还可以使用字符序列。例如，`\\w` 代表任意字母数字字符，`\\w{3}` 代表任意总长度为三个字符的单词，如下所示：\n\n```\n\
  re.findall(r\"\\w{3}\",quote)\n#['you', 'not', 'tur', 'aga', 'ins', 'you', 'rse',\
  \ 'the', 'Hum', 'Pot', 'ent', 'ial', 'lim', 'itl', 'ess']\n```\n\n类似地，`\\s` 匹配空白字符（空格、制表符和换行符）。重复次数和出现次数也可以通过列出的量词来确定：\n\
  \n- `*`：表达式中的单词出现零次或多次。\n- `+`：给定表达式中的单词出现一次或多次。\n- `?`：匹配表达式中的单词出现零次或一次（也称为懒惰量词）。\n\
  - `{, }`：匹配不限数量的字符。出现次数的作用范围是`{最小值, 最大值}`。以下是一些示例：\n  - `{2,10}`：匹配 2 到 10 个字符\n\
  \  - `{,5}`：最多匹配五个字符\n  - `{2,}`：至少两个字符\n  - `{3}`：匹配每三个字符的出现\n\n## 正则表达式的串联\n\n\
  正则表达式的另一个主要优势是它可以串联使用。请看以下示例：\n\n- `\\s+(\\w{3})\\s+`：匹配长度为三个字符且在单词前后至少有一个或多个空格的单词\n\
  - `\\s*(\\w{3})\\s*`：匹配长度为三个字符且在单词前后有零个或多个空格的单词\n\n在以下代码中，使用了许多正则表达式（涉及字符的长度、集合和出现次数）：\n\
  \n```\nre.findall(r\"\\s*(\\w{3})\\s*\",quote)\n# ['you', 'not', 'tur', 'aga', 'ins',\
  \ 'you', 'rse', 'the', 'Hum', 'Pot', 'ent', 'ial', 'lim', 'itl', 'ess']\nre.findall(r\"\
  \\s+(\\w{3})\\s+\",quote)      # ['you', 'not', 'the']\nre.findall(r\"\\s+([a-z]{3})\\\
  s+\",quote)      # ['you', 'not', 'the']\n```\n\n以下是上述代码中使用的一些正则表达式的简要说明：\n\n- 字符集合或\
  \ `[]`（方括号）：\n  - `[A-Z]`：大写字符集合\n  - `[a-z]`：小写字符集合\n  - `[0-9]`：从 0 到 9 的数字字符集合\n\
  \n**重要说明**\n表达式 `[a-zA-Z0-9]` 匹配所有字母数字字符。此外，在正则表达式中，除 `[A-Z0-9a-z]` 之外的其他字符应写成转义字符（`\\\
  ,` 表示逗号，`\\?` 表示问号字符，`\\+` 表示加号字符）。字符集合也可以包含特殊字符或转义字符；例如，`[0-9\\+\\-\\.]` 表示包含数字\
  \ 0-9 以及 `+`、`-`、`.` 字符，或这些数字和字符的任意组合。\n\n- 表达式中的圆括号 `()` 用于保存一组匹配值。例如，`r\"([a-z]+)[0-9]{3}\"\
  ` 保存匹配一个或多个从 a 到 z 的字符的值。\n- 转义代码，有时也称为预定义快捷方式，使用 `\\` 进行转义。以下是一些转义代码的示例：\n  - `\\\
  s`：表示空格（键盘空格键）字符或空白字符；例如，`\\s+` 添加一个或多个空格\n  - `\\n`：换行符，用于多行内容\n  - `\\t`：制表符\n\
  \  - `\\S`：非空白字符\n  - `\\w`：匹配字母数字字符；类似于 `[a-z0-9A-Z]`\n  - `\\W`：匹配非字母数字字符；与 `\\\
  w` 相反\n  - `\\b`：匹配单词边界\n  - `\\B`：匹配非单词边界\n\n- `\\d`：匹配数字或 `[0-9]`\n- `\\D`：匹配非数字\n\
  \n**重要说明**\n转义字符或代码需要谨慎使用，因为它们是区分大小写的。例如，`\\w` 和 `\\W` 具有完全相反的效果。\n\n正则表达式还通过使用\
  \ `|`（管道符）支持 OR 逻辑运算。在表达式 `r\"([A-Z]\\w+ | [a-z]\\w+)\"` 中，它匹配 `[A-Z]\\w+` 或 `[a-z]\\\
  w+`，结果是返回所有任意大小写的单词：\n\n```\nmatches = re.findall(r\"([A-Z]\\w+|[a-z]\\w+)\",quote)\n\
  matches # ['If', 'you', 'do', 'not', 'turn', 'against', 'yourself',\n'the', 'Human',\
  \ 'Potential', 'is', 'limitless']\n```\n\n除了本节探索的正则表达式功能外，还有一些更重要的方法和表达式语法。为了进一步探索，让我们在下一节中统计\
  \ quote 字符串中的单词总数。\n\n在下一节中，我们将使用 re 的 `split()` 方法根据匹配的表达式或提供的条件（如字符）创建分块。\n\n\
  ## re.split\n\n以下代码提供了 `re.split()` 作用于表达式的示例。基于字符串的 Python `split()` 方法默认使用空格作为分隔字符。如下面的代码所示，`\\\
  s` 或空格用于拆分 quote 中的所有单词，正如我们在“正则表达式概述”一节中提到的那样：\n\n```\nwords = re.split(\"\\\\\
  s\",quote)\nwords\n# ['If', 'you', 'do', 'not', 'turn', 'against', 'yourself', 'the',\n\
  'Human', 'Potential', 'is', 'limitless']\nprint(f\"Total words in quote: {len(words)}\"\
  )\nTotal words in quote: 12\nwordsA = re.split(\",\",quote)\n# ['If you do not turn\
  \ against yourself', ' the Human Potential is\nlimitless']\nprint(f\"Total words\
  \ in wordsA: {len(wordsA)}\")\nTotal words in wordsA: 2\n```\n\nPython 的 re 还支持使用\
  \ `sub()` 方法进行替换或替换操作。在下一节中，我们将使用 `re.sub()`。\n\n## re.sub\n\n`re.sub()` 的工作方式与查找替换或字符串的\
  \ `replace()` 方法完全相同。在以下代码块中，表达式 `r\"(H[a-z]+)\"` 匹配任何以 H 开头且包含一个或多个 `[a-z]` 范围字符组合的单词，并将其替换为\
  \ HumanBeing：\n\n```\nnewQuote = re.sub(r\"(H[a-z]+)\", 'HumanBeing', quote)\nnewQuote\n\
  # If you do not turn against yourself, the HumanBeing Potential is limitless\n```\n\
  \n在以下代码中，`\\,` 匹配 `,`（逗号），并使用 `sub()` 将其替换为空值：\n\n```\nnewQuoteA = re.sub(r\"\\\
  ,\",'',quote)\n# If you do not turn against yourself the Human Potential is limitless\n\
  ```\n\n还有一种基于我们的模式返回对象的方法，称为 `compile()`。在下一节中，我们将探讨 `re.compile()` 以及一些重要的正则表达式基础知识。\n\
  \n## re.compile\n\n正如方法名称所示，`re.compile()` 编译正则表达式并创建一个模式对象。使用模式对象不是强制性的，但它使代码更具可读性和可扩展性。\n\
  \n在以下代码中，我们有一个名为 `languages` 的 Python 列表，包含各种编程语言的名称：\n\n```\nlanguages = [\"Javascript\"\
  ,\"Python\",\"Go\",\"Java\",\"Kotlin\",\n\"PHP\",\"C#\",\"Swift\",\"R\", \"Ruby\"\
  ,\"C\",\"C++\",\"Matlab\",\n\"TypeScript\",\"Scala\",\"SQL\",\"HTML\",\"CSS\",\"\
  NoSQL\", \"Rust\", \"Perl\"]\nvowel_start = r\"^[AEIOU]\"\nvowel_end = r\".*[aeiouAEIOU]$\"\
  \nprint(f\" Expression {vowel_start}, Type:{type(vowel_start)}\")\n# Expression\
  \ ^[AEIOU], Type:<class 'str'>\n```\n\n我们定义了两个正则表达式模式，如下所示：\n\n- `vowel_start`：检查\
  \ `languages` 中的元素是否以元音开头（区分大小写）\n- `vowel_end`：检查 `languages` 中的元素是否以元音结尾（不区分大小写）\n\
  \n还需要注意，尽管 `vowel_start` 和 `vowel_end` 被定义为保存正则表达式，但它们仍然是字符串对象。\n\n以下是一些在 `vowel_start`\
  \ 和 `vowel_end` 中出现的正则表达式字符：\n\n- `^`（脱字符）：这是一个位置字符。它匹配字符串的起始位置或开头。例如，`(^\\d+)`\
  \ 查找任何以数字开头的模式。\n  \n  当 `^` 在字符集合中使用时，它表示否定或排除。例如，`[a-z]` 匹配从 a 到 z 的字符，而 `[^a-z]`\
  \ 匹配除了从 a 到 z 的字符之外的任何内容。\n- `$`：这也是一个位置字符，它匹配结束位置。例如，`(\\d$)` 匹配以数字结尾的字符串。表达式 `r\"\
  .*[aeiouAEIOU]$\"` 查找以以下任意一个字符结尾的字符：`aeiouAEIOU`。\n- `.`（点或句点）：匹配任意字符，但不匹配换行符或 `\\\
  n`。例如，`r\".*[aeiouAEIOU]$\"` 匹配任何具有任意数量字符并以 `aeiouAEIOU` 之一作为结尾字符的单词。\n\n定义表达式后，让我们编译它们。`re.compile(expression)`\
  \ 创建一个 `re.Pattern`（patternS 和 patternE）类型的对象：\n\n```\npatternS = re.compile(vowel_start)\n\
  patternE = re.compile(vowel_end)\nprint(f\"{patternS}, {type(patternS)}\")\nre.compile('^[AEIOU]'),\
  \ <class 're.Pattern'>\n\nprint(dir(patternS))\n['__class__',...', 'findall', 'finditer',\
  \ 'flags', 'fullmatch',\n'groupindex', 'groups', 'match', 'pattern', 'scanner',\
  \ 'search',\n'split', 'sub', 'subn']\n```\n\n`compile()` 方法以正则表达式的形式提供指令。编译后，我们可以在需要的地方使用编译后的表达式集合，如前面的代码块和后面的代码块所示。\n\
  \n如下面的代码所示，执行列表迭代以使用 `re.match()` 检查模式，结果只有三个匹配项，即以元音结尾的语言名称：\n\n```\nfor language\
  \ in languages:\n    if re.match(patternS, language):\n        print(f\"{language}\
  \ starts with vowel character\")\n    if re.match(patternE, language):\n       \
  \ print(f\"{language} ends with vowel character\")\nOutput---\nGo ends with vowel\
  \ character\nJava ends with vowel character\nScala ends with vowel character\n```\n\
  \n\n\n\n模式对象拥有各种方法。前面代码中已使用了一些。还有更多可以使用的，需要对正则表达式进行全面研究。欲了解更多详情，请访问 https://www.regular-expressions.info/。\n\
  \n构建正则表达式相当具有挑战性。任何特定任务都可以用一个或多个表达式处理。编写表达式没有唯一正确的方式，但学习正则表达式的基础知识会很有帮助。\n\n在下一节中，我们将看到使用正则表达式编写的实体的多种处理方式，以及通过\
  \ `re` 函数和逻辑步骤来处理。\n\n## 正则表达式标志\n\n正则表达式标志通常被视为对基本表达式的额外补充或增强。可用的标志类型有多种，但最常见的如下：\n\
  \n-   `re.IGNORECASE`：此标志忽略大小写（大写或小写）问题，可以使用简写形式（`re.I`），也可以内联使用 `(?i)`。\n-   `re.MULTILINE`：此标志有助于在跨多行的表达式中搜索和匹配模式。可简写为\
  \ `re.M` 或内联写为 `(?m)`。\n\n如下代码块所示，如果使用 HTTP 头相关值声明，sentence 变量就是一个多行字符串。其中还包含换行符（`\\\
  n`）。让我们探索在带标志和不带标志的情况下实现正则表达式结果的各种方法：\n\n```\nsentence=\"\"\"Accept:text/html,application/xhtml+xml,application/\n\
  xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/\nsigned-exchange;v=b3;q=0.7\\\
  nAccept-Encoding: gzip, deflate\\nAccept-\nLanguage: en-US,en;q=0.9\\nCache-Control:\
  \ max-age=0\\nConnection: keep-\nalive\\nCookie: ci_session=%22session_id%2A40495f61c71a8ca8712e\\\
  nhost: anishchapagain.com\\nIf-Modified-Since: Sun, 1 Apr 2023\n11:22:33 GMT\\nIf-None-Match:\
  \ 64a-5f9724a6cdcf2-gzip\\nUpgrade-\nInsecure-Requests: 1\\nUser-Agent: Mozilla/5.0\
  \ (Windows NT 10.0;\nWin64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/111.0.0.0\n\
  Safari/537.36\"\"\"\n```\n\nPython `re` 方法接受 `flags` 参数。如下代码所示，在 `re.findall(\"\
  (if.*)\",sentence, flags = re.IGNORECASE)` 中，`re.IGNORECASE` 被传递给 `flags` 参数：\n\n\
  ```\nre.findall(\"(if.*)\",sentence) ['if,image/webp,image/\napng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7',\
  \ 'ified-Since:\nSun, 1 Apr 2023 11:22:33 GMT']\nre.findall(\"(if.*)\",sentence,\
  \ flags = re.IGNORECASE) ['if,image/\nwebp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7',\n\
  'If-Modified-Since: Sun, 1 Apr 2023 11:22:33 GMT', 'If-None-Match:\n64a-5f9724a6cdcf2-gzip']\n\
  re.findall(\"(If.*)\",sentence)\n['If-Modified-Since: Sun, 1 Apr 2023 11:22:33 GMT',\
  \ 'If-None-Match:\n64a-5f9724a6cdcf2-gzip']\n```\n\n从上面的代码块可以看出，当提供 `re.IGNORECASE`\
  \ 时，输出会有所不同。\n\n除了输出之外，我们还可以使用一些简写形式来修改或更改上述代码；例如，`re.findall(\"(if.*)\",sentence,flags\
  \ = re.IGNORECASE)` 也可以写成：\n\n-   `re.findall(\"(if.*)\",sentence, re.IGNORECASE)`\n\
  -   `re.findall(\"(if.*)\",sentence, flags = re.I)`\n-   `re.findall(\"(if.*)\"\
  ,sentence, re.I)`\n-   `re.findall(r\"(?i)(if.*)\",sentence)`（这是内联标志表示法；`(?i)` 与\
  \ `re.I` 含义相同）\n\n在下面的代码中，`re.MULTILINE` 标志用于多行字符串，使用和不使用该标志正则表达式时的输出可以很容易地区分：\n\
  \n```\nre.findall (r\"^Accept.*\", sentence)\n['Accept: text/html, application/xhtml+xml,\
  \ application/xml; q=0.9, image/avif, image/webp, image/apng, */*; q=0.8, application/signed-exchange;v=b3;q=0.7']\n\
  re.findall (r\"^Accept.*\", sentence, flags = re.MULTILINE)\n['Accept: text/html,\
  \ application/xhtml+xml, application/xml; q=0.9, image/avif, image/webp, image/apng,\
  \ */*; q=0.8, application/signed-exchange;v=b3;q=0.7', 'Accept-Encoding: gzip, deflate',\
  \ 'Accept-Language: en-US,en;q=0.9']\nre.findall(r\"(?m)^Accept.*\",sentence) #\
  \ inline flag (?m) multi-line\n['Accept: text/html, application/xhtml+xml, application/xml;\
  \ q=0.9, image/avif, image/webp, image/apng, */*; q=0.8, application/signed-exchange;v=b3;q=0.7',\
  \ 'Accept-Encoding: gzip, deflate', 'Accept-Language: en-US,en;q=0.9']\n```\n\n\
  表达式 `re.findall (r\"^Accept.*\",sentence,flags=re.MULTILINE)` 也可以写成如下形式：\n\n-  \
  \ `re.findall(r\"^Accept.*\",sentence, re.MULTILINE)`\n-   `re.findall(r\"^Accept.*\"\
  ,sentence, flags = re.M)`\n-   `re.findall(r\"^Accept.*\",sentence, re.M)`\n-  \
  \ `re.findall(r\"(?m)^Accept.*\",sentence)`（内联标志）\n\n标志也可以组合使用；例如，`flags=re.MULTILINE|re.IGNORECASE`\
  \ 将同时施加两个标志，如下所示：\n\n```\nre.findall(r\"^accept.*\",sentence, re.MULTILINE|re.IGNORECASE)\n\
  re.findall(r\"^accept.*\",sentence, re.M|re.I)\nre.findall(r\"(?im)^accept.*\",sentence)\
  \ # (?im) the inline flag together\n```\n\n上述代码将产生以下输出：\n\n```\n[ 'Accept:text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7',\n\
  'Accept-Encoding: gzip, deflate',\n'Accept-Language: en-US,en;q=0.9' ]\n```\n\n\
  如上面的代码块所示，内联标志在表达式之前提及，并以 `?` 开头，例如 `(?i)` 或 `(?im)`。\n\n**重要说明**\n\n有关编写表达式、标志和正则表达式的更详细信息，请探索以下链接：https://www.regular-expressions.info/、https://regex101.com/（你也可以使用此链接进行练习和生成代码）、https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_expressions/Cheatsheet\
  \ 和 https://learnbyexample.github.io/python-regex-cheatsheet。\n\n在下一节中，我们将使用正则表达式处理\
  \ Web 响应以进行数据提取。\n\n## 使用正则表达式提取数据\n\n在本章前面的章节中，我们通过示例探讨了正则表达式的各个方面。正则表达式可以应用于所有类型的内容，例如内容分析、可扩展性以及时间和资源（机器）分析。这种分析对于确定选择哪些与提取相关的选项（如\
  \ XPath、CSS 选择器和 PyQuery）非常重要。\n\n**重要说明**\n\n文献中经常提到，正则表达式只应在内容为非结构化时应用（用于数据提取），但事实并非如此。正则表达式可用于任何类型的内容（结构化或非结构化）。\n\
  \n从爬取的角度来看，为了提取数据，我们将探索几个使用正则表达式的示例，并探讨其部分功能和特性。\n\n## 示例 1 – 雅马哈经销商信息\n\n在本示例中，我们将从\
  \ https://yamaha-moto.cfaomotors.ng/en/dealership/yamaha-nigeria-cfao-motors 收集摩托车经销商的信息（更准确地说，是经销商的地理位置）。要收集的数据是\
  \ Dealer_ID、Name（经销商名称）、City（位置）、Latitude（纬度）和 Longitude（经度）。\n\ndataSet 将产生如下所示的数据：\n\
  \n```\n[['261', 'AUSTINE BEST VENTURES LTD', 'Igbo-Ora', '7.435186', '3.2874431'],\n\
  ...\n['259', 'S. AKINMADE NIGERIA LTD', 'Akure', '7.2455287', '5.1887157']]\n```\n\
  \n收集完所有数据后，将创建 CSV 和 JSON 文件。\n\n如前面的代码块所示，`re` 的 findall、sub 和 split 方法在多个地方和不同时间被使用，并在数据提取中发挥着非常重要的作用。\n\
  \n## 示例 2 – 从站点地图获取数据\n\n在本示例中，我们将从 https://www.zyte.com/post-sitemap.xml 的站点地图链接中提取数据。\n\
  \n由于站点地图文件是 JSON 格式，它包含一些系统定义和用户定义的标签。source 使用 Python requests 收集 Web 响应：\n\n```\n\
  url=\"https://www.zyte.com/post-sitemap.xml\"\nsource = requests.get(url).text\n\
  ```\n\nsource 输出的一部分，或者 sitemap.xml 中找到的单个链接的内容，如下面的代码块所示——有多个具有类似输出的链接，需要识别、提取和收集这些链接以提取所需数据：\n\
  \n```\n<url>\n    <loc>https://www.zyte.com/blog/json-parsing-with-python/</loc>\n\
  \    <lastmod>2023-04-06T14:42:05+00:00</lastmod>\n</url>\n```\n\n我们感兴趣的链接中的数据如下：\n\
  \n-   **类型**：从 `<loc>` 中提取的类别，如博客、网络研讨会或未分类文本\n-   **主题**：链接中可用的链接文本或标题文本，显示在我们之前定义的类型之后\n\
  -   **日期**：在 `<lastmod>` 中找到的 Y-M-D 值\n-   **时间**：在 `<lastmod>` 中的 H:M:S 值\n\n在这里，由于\
  \ source 中存在可识别的 XML 标签（每个链接或 `<url>` 的 `<loc>` 和 `<lastmod>`），我们将分别收集所有可用的 `<loc>`\
  \ 和 `<lastmod>` 详细信息。locs 收集\n\n\n\n来自所有可用的 `<loc>...</loc>` 标记的数据；同样地，`mods` 列出所有\
  \ `<lastmod>...</lastmod>` 标记中的内容：\n\n```python\nlocs = re.findall(r\"<loc>(.*)</loc>\"\
  , source)\nmods = re.findall(r\"<lastmod>(.*)</lastmod>\", source)\n```\n\n`locFinals`\
  \ 是一个 Python 列表，其中包含来自 `locs` 和 `mods` 的各个元素，并以元组形式呈现。Python 的 `zip(locs, mods)`\
  \ 函数的作用类似于合并器，它合并传入的参数，并将迭代得到的 `locs` 和 `mods` 值创建为一个元组：\n\n```python\nlocFinals\
  \ = list(zip(locs, mods))\nprint(locFinals[0])    # (locs[0], mods[0])\n('https://www.zyte.com/blog/json-parsing-with-python/',\
  \ '2023-04-06T14:42:05+00:00')\n```\n\n`locFinals` 包含多个元素。在迭代时，我们同时进行元组解包，并使用 `re.sub()`\
  \ 和 `re.split()` 对数据进行清理和拆分，以便获取目标数据：\n\n```python\nfor locFinal in locFinals:\n\
  \    loc, datetime = locFinal\n    # unpacking tuple (extracting tuple elements)\n\
  \    loc = re.sub('^(http\\:|https\\:)', '', loc)\n    # cleaning\n    loc = re.sub('[\\\
  /]{2}', '', loc)\n    loc = re.sub('\\/$', '', loc)\n    locSplit = re.split(r\"\
  /\", loc)\n    # breaking\n    category = locSplit[1]\n    categoryTopic = re.sub('[-]',\
  \ ' ', locSplit[2])\n    ymdTime = re.split(\"T\", datetime)\n    # separating date\
  \ and time\n    ymd = ymdTime[0]\n    time = re.sub(\"\\+.*\", \"\", ymdTime[1])\n\
  \    # cleaning\n```\n\n最终，识别出的目标数据被加载到 `dataSet` 数据容器中：\n\n```python\ndataSet.append([\"\
  Zyte\", category, categoryTopic, ymd, time])\nprint(dataSet)\n[['Zyte', 'blog',\
  \ 'json parsing with python', '2023-04-06', '14:42:05'], ...,\n ['Zyte', 'webinars',\
  \ 'the right data fields for e commerce data project', '2023-03-21', '06:17:35'],\
  \ ...]\n```\n\n如本示例所示，re 方法（`findall()`、`sub()` 和 `split()`）以及 Python 的 `zip()`\
  \ 方法发挥了重要作用。通过结合 Python re 和内建方法，可以高效且轻松地完成基于正则表达式的数据提取。\n\n### 示例 3——Godfrey 的经销商\n\
  \n在本示例中，我们将从 `https://godfreysfeed.com/dealersandlocations` 提取经销商详细信息。\n\n使用 Python\
  \ 的 requests 库发起 HTTP 请求，并将响应收集为 source：\n\n```python\nurl = \"https://godfreysfeed.com/dealersandlocations\"\
  \nsource = requests.get(url).text\n```\n\n我们将从 source 中获取与目标列（如 Name、Address、City、State、Zip、Lat\
  \ 和 Lng）相关的数据。经销商相关数据仅在 *JavaScript* 中可用。这些数据还分散在多行中，并且包含一些 HTML 标签，如下所示：\n\n```javascript\n\
  var infoWindowContent = \"<div style='overflow:hidden; width:200px'>\";\ninfoWindowContent\
  \ = infoWindowContent + '<strong><span style='color:#e5011c;'>American Cowboy Shop</span></strong><br><strong>513\
  \ D Murphy Hwy</strong><br><strong>Blairsville, GA</strong><br><strong>30512</strong><br><br>';\n\
  infoWindowContent += '</div>';\nvar infowindow = new google.maps.InfoWindow({maxWidth:\
  \ 450});\ninfowindow.setContent(infoWindowContent);\nvar latLng = new google.maps.LatLng(34.8752421,\
  \ -83.9716038);\n```\n\n定义正则表达式以使用 `latlngs` 变量收集所有坐标数据，而 `contents` 则保存承载地址信息的\
  \ `infoWindowContent` 变量。最后，使用 Python 内建的 `zip()` 创建 `details`：\n\n```python\nlatlngs\
  \ = re.findall(r\"var\\s+latLng.*\\.LatLng\\((.*)\\);\", source)\ncontents = re.findall(r\"\
  infoWindowContent\\+\\s*\\\"(.*)\\\";\", source)\ndetails = list(zip(contents, latlngs))\
  \  # zip\n```\n\n现在，我们已在 `details` 中识别出 `latlngs` 和 `contents` 数据。接下来需要对 `details`\
  \ 进行迭代，将 `detail` 元组解包为一组 `fullAddress` 和 `coordinate`：\n\n```python\nfor detail\
  \ in details:\n    fullAddress, coordinate = detail\n```\n\n大家可以了解到，*Word 文档*、*PowerPoint\
  \ 演示文稿*、*HTML*、*Jupyter 笔记本*、*来自各种应用程序的分析报告*，以及更多内容类型都支持将文件导出并保存为 PDF。\n\n我们经常会在\
  \ PDF 文件中发现各种类型的数据（例如文本、表格和图像）。在*第 3 章和第 4 章*中，我们了解了如何使用 Python 提取基于 Web 的内容。在这里，我们将使用\
  \ PyPDF2 Python 库从 PDF 文件中提取数据。\n\n在接下来的小节中，我们将从数据提取的角度安装并探索 PyPDF2。\n\n## PyPDF2\
  \ 库\n\nPyPDF2（https://pypdf2.readthedocs.io/en/3.0.0/index.html）是一个免费、开源（https://github.com/py-pdf/PyPDF2）的\
  \ Python 库，用于处理 PDF 文件，并因其丰富的功能在 Python 开发者和社区中广受欢迎。\n\n以下是它的一些主要功能：\n\n- 文本提取\n\
  - 图像提取\n- 元数据（文档详细信息）的可用性与提取\n- 文件转换（PDF 转 Word 等）\n- 文本修改（PDF 文件）\n- 为现有或新建的 PDF\
  \ 文件添加水印\n- 添加安全性，例如为 PDF 文件设置密码保护\n- 将 PDF 文件拆分为多个页面\n- 将多个 PDF 文件合并为一个 PDF\n-\
  \ 处理页面布局、裁剪、变换和方向（例如旋转页面）\n\n还应注意，PDF 文件可以使用 PDF 应用程序创建，也可以从其他文档格式导出并保存。虽然 PDF 文件保留了原始文档的适当格式，但其内容不像\
  \ HTML 或基于标记的文档那样。PDF 内容以原始格式（包含换行符、空格和制表符）存在，因此几乎必须使用正则表达式来定位和提取所需信息。\n\n> **重要提示**\n\
  > 有大量处理 PDF 文件的 Python 库，例如 `pdfminer`、`pdfquery`、`xpdf`、`pdfrw`、`pikepdf` 和 `pymupdf`。在上述这些库中，PyPDF2\
  \ 是我最喜欢的，因为它具有多种功能。正如 https://pypdf2.readthedocs.io/en/3.0.0/user/installation.html\
  \ 中所介绍的，PyPDF2 可用于广泛的用例，也可以专注于某个特定领域，例如*加密（加密或解密）*和*图像处理*。\n\n在下一节中，我们将使用 PyPDF2\
  \ 来收集数据。\n\n## 使用 PyPDF2 进行提取\n\nPyPDF2 是一个完整的软件包，其中有各种类来处理其不同的功能。在提取方面，我们将使用 PyPDF2\
  \ 中的 `PdfReader` 类（https://pypdf2.readthedocs.io/en/3.0.0/modules/PdfReader.html）。\n\
  \n如下代码所示，要进行提取，需要从 PyPDF2 导入 `PdfReader` 类。目标文件或文件路径（`pdffile`）被提供给 `PdfReader`。`reader`\
  \ 是一个对象，承载着 `PdfReader` 的方法和属性：\n\n```python\nfrom PyPDF2 import PdfReader\npdffile\
  \ = \"python_cheat_sheet_v1.pdf\" # file path or name\nreader = PdfReader(pdffile)\n\
  # reader = PdfReader(open(pdffile,'rb'))\ndir(reader)\n['__class__',..., '__encryption__',...'isEncrypted',\
  \ 'is_encrypted',\n 'metadata', 'namedDestinations', 'named_destinations', 'numPages',\n\
  \ 'outline', 'outlines', 'pageLayout', 'pageMode', 'page_layout',\n 'page_mode',\
  \ 'pages', 'pdf_header', 'read', 'readNextEndLine',\n 'readObjectHeader', 'read_next_end_line',\
  \ 'read_object_header',\n 'resolved_objects', 'stream', 'strict', 'threads', 'trailer',...]\n\
  ```\n\nPyPDF2 最近进行了一次更新，为其配备了新的方法和属性。此外，还有一些已弃用的实体，你在探索 PyPDF2 时可能会遇到。\n\nPDF 的页数可以通过\
  \ `len(reader.pages)` 获取，而单个页面的来源或内容可以通过 `page1 = reader.pages[0]` 来定位（此处，索引 0 指第\
  \ 1 页，1 指第 2 页，依此类推）。确定页码后，可以使用 `extract_text()` 方法提取内容：\n\n```python\npage1 = reader.pages[0]\
