  ```\n\nFigure 2.12: Import request from urllib\n\nurllib 有许多子模块，例如 request、response、parse\
  \ 和 error。要向 https://www.python.org 发送请求或加载 URL，我们需要导入 requests 并执行 urlopen() 方法，将\
  \ URL 作为参数传入，该方法返回 HTTPResponse 对象，如图 2.13 所示：\n\n```\n[3]: response_a = request.urlopen(url_a)\n\
  [4]: response_a\n```\n\n```text\n[4]: <http.client.HTTPResponse at 0x191b0387880>\n\
  ```\n\nFigure 2.13: Reading the URL and the HTTPResponse object\n\n我们需要使用 read()\
  \ 方法读取对象的内容并显示从网站接收到的页面源或 HTML 内容，如图 2.14 所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_56_0.png)\n\
  \nFigure 2.14: Displaying content by executing read() on the HTTPResponse object\n\
  \n- Task 2: 使用 requests 加载 https://pypi.org/project/pycurl/。如图 2.15 所示，我们已定义要处理的\
  \ URL 并导入了 requests 库。requests 中的 get() 方法以 URL 作为参数加载 URL，并带上 content 属性，返回响应：\n\
  \n以下是可在我们的代码中使用的 DevTools 中的可用信息：\n\n- **Request URL**：我们可能会找到隐藏或重定向的 URL、具有所需内容的\
  \ API，或其他更易于处理的 URL。\n- **Request Headers**：浏览器在请求处理期间发送到服务器的信息，例如 cookies、user-agent、referer\
  \ 和 pragma。\n- **Response Headers**：服务器在响应期间与浏览器交换的信息，例如服务器信息、content/types 和 etags。\n\
  - **Cookies**：具有过期日期和时间的键值对中的安全、权限或会话内容。cookies 的优先级决定了基于 HTTP 的通信周期的复杂性。\n- **Status\
  \ Code**：有关 HTTP 响应的信息，它们是客户端、服务器还是资源问题。\n- **Request Method**：发送请求或接收响应时使用的 HTTP\
  \ 方法（GET/POST）。\n\n开发人员还可能遇到需要 URL 操作的情况（例如更改或清理）。可能存在一些隐藏的 URL、API，甚至是浏览器中无法直接看到的包含我们所需数据的静态内容。\n\
  \n毕竟，我们正在开发爬虫或 Python 脚本来自动化基于浏览器的活动。因此，我们需要充分了解 DevTools 并开发能够像浏览器一样执行、并具有一些额外任务（例如提取数据）的爬虫。为此，我们需要管理和处理\
  \ URL 和 HTTP 通信，我们将在下一节中介绍。\n\n> **Important note**\n> DevTools 显示了在服务器或其他第三方请求和响应期间的完整通信日志。请查看\
  \ *Chapter 1* 的 *Developer tools* 部分了解更多信息，或查看以下网址：https://developer.chrome.com/docs/devtools/\
  \ 和 https://firefox-source-docs.mozilla.org/devtools-user/。\n\n## requests – Python\
  \ library\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_59_0.png)\n\nFigure 2.16:\
  \ requests library – HTTP for Humans\n\n我们在 Installing libraries 部分查看了 requests。对于我们的目的，我们使用的是\
  \ requests 版本 2.28.1。\n\n与 Python 中的其他 HTTP 库相比，requests 因其可读性、开发人员友好性和易用性而备受好评。其主要优点如下：\n\
  \n- 短小、简单且可读的函数和属性\n- 访问各种 HTTP 方法\n- 自动内容解码和解压缩\n- 轻松处理查询字符串\n- 自定义 HTTP 头\n- 会话和\
  \ cookie 处理\n- 能够处理 JSON 请求和内容\n- 代理支持\n- 多部分文件上传（表单处理）\n- 连接池和超时\n\n我们将使用 requests\
  \ 库，并探索其一些主要属性。在 Loading URLs 部分，我们使用 get() 方法加载 URL 并使用 content 查看其源。我们实际上是在使用\
  \ get() 通过 HTTP GET 方法与 URL 通信。\n\nrequests 库还支持其他 HTTP 方法，例如 PUT、POST、DELETE、HEAD\
  \ 和 OPTIONS，分别使用 put()、post()、delete()、head() 和 options() 方法。\n\n通过这段简短的介绍和 requests\
  \ 的概述，我们将在下一节中通过代码示例介绍更多细节。\n\n## General usage\n\n让我们通过一些示例探索 requests 库的一些关键功能，如\
  \ *Figure 2.17* 所示。代码可在 `https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter02/requests.ipynb`\
  \ 获取：\n\n```python\nimport requests\n```\n\n```python\nlink=\"https://requests.readthedocs.io/\"\
  \n```\n\n```python\nresponse = requests.get(link)    #making HTTP Request to link\n\
  ```\n\n```python\ntype(response)\n```\n\n```text\nrequests.models.Response\n```\n\
  \n```python\nresponse\n```\n\n```text\n<Response [200]>\n```\n\nFigure 2.17: Using\
  \ get() and showing the response type and status code\n\n> **Important note**\n\
  > \n> 我们建议使用 `dir(requests)` 和 `dir(response)`，或在代码中找到新对象时使用 `dir()`。这将显示该对象的详细信息，甚至可以帮助您决定使用哪些功能。\n\
  \n如 *Figure 2.17* 所示，我们已导入 `requests` 并加载了 `link` 中定义的 URL。`response` 通常是 `requests.models.Response`\
  \ 的对象，并且它还显示 HTTP 状态码，为 200。\n\n如 *Figure 2.18* 所示，要获取实际状态码，我们可以使用 `status_code`\
  \ 属性：\n\n```python\nresponse.status_code  #status_code\n```\n\n```text\n200\n```\n\
  \n```python\nresponse.status_code == requests.codes.ok\n```\n\n```text\nTrue\n```\n\
  \n```python\nresponse.url\n```\n\n```text\n'https://requests.readthedocs.io/en/latest/'\n\
  ```\n\n```python\nresponse.history\n```\n\n```text\n[<Response [302]>]\n```\n\n\
  Figure 2.18: Using requests with status_code, url, and history\n\n此外，`response.url`\
  \ 显示 HTTP 通信完成后最终的 URL。我们可以看到 `response.url` 的值与 *Figure 2.17* 中的 `link` 不同——如果这是真的，则必须发生了重定向，这一点通过\
  \ `history` 收到的状态码得到证实（302 表示临时重定向）。\n\n编码也是一个重要因素；我们可以在 *Figure 2.19* 中获取有关编码的一些信息：\n\
  \n```python\nresponse.encoding\n```\n\n```text\n'ISO-8859-1'\n```\n\nFigure 2.19:\
  \ The encoding attribute of a response returning the encoding value\n\n在这里，我们借助几个代码示例探索了\
  \ `requests` 的一些基本用法。在下一节中，我们将探索 HTTP 头。\n\n## Request/response headers\n\n如 *URL\
  \ handling and operations* 部分的介绍中所述，HTTP 头对开发人员来说非常重要；服务器和客户端共享的 HTTP 头在请求和响应之间可能不同。*Figure\
  \ 2.20* 显示了一些示例：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_62_0.png)\n\nresponse.request.headers\
  \ 返回 HTTP 请求期间的头，而 response.headers 返回 HTTP 响应期间的头。两个头都可用作字典，我们可以使用其值在处理爬取脚本时设置和更新字典所需的键值对。\n\
  \n有时对于爬虫脚本来说，在进行 HTTP 请求时设置并传递 User-Agent、Accept、Referer 和 Cookies 等头是强制性的。在下一节中，我们将探索\
  \ cookies。\n\n## Cookies/session\n\nHTTP cookies 是服务器发送到浏览器的数据。Cookies 是网站在用户系统或计算机上生成和存储的数据。存储在\
  \ cookies 中的数据有助于识别用户向网站发出的 HTTP 请求。Cookies 包含有关会话管理、用户偏好和用户行为的信息。许多网站在您浏览网页时会要求您允许设置\
  \ cookies。\n\n如 Figure 2.21 所示，cookies 以 RequestCookieJar 对象的形式返回：\n\n```python\n\
  response.cookies\n```\n\n```text\n<RequestsCookieJar[]>\n```\n\n```python\nresponse_github\
  \ = requests.get('https://www.github.com/anishchapagain')\n```\n\n```python\nresponse_github.cookies\n\
  ```\n\n```text\n<RequestsCookieJar[Cookie(version=0, name='gh_sess', value='GPeekFKsJbT9t9xKxV4hH8Q1T7gV0LNUERBn8V2o0x1aestEgpMaDkNJM7mTrUFQZkOVSmA0K2BS7vJg0ZVwWq0MvKX2F28PMR2BvGN8VBo1ZcNs1v2BzA8PEk5rCs0StdPfb6xQk1c4MPhnQq2PjHixTgCbrWmXhbb0U0xce1FiykQqsJAsRpqQy12z4dpgN302iKED3dGZX284ACY5Fspk7Y7usr8S1KPM0ESu5cM3H2F7R2TGwDZmIppdRJN8Z0U0gP0PPI1A3S0D3D\
  \ -FxvagsYkwaK2Fv5m-1I38FjbbdELXJHBysYjJ2BkuW43Q3D', port=None, port_specified=False,\
  \ domain='github.com', domain_specified=False, domain_initial_dot=False, path='/',\
  \ path_specified=True, secure=True, expires=None, discard=True, comment=None, comment_url=None,\
  \ rest={'HttpOnly': None, 'SameSite': 'Lax'}, rfc2109=False), Cookie(version=0,\
  \ name='__Host-github_user', value='GH1.1.504589393.1672387987', port=None, port_specified=False,\
  \ domain='.github.com', domain_specified=True, domain_initial_dot=False, path='/',\
  \ path_specified=True, secure=True, expires=1783923987, discard=False, comment=None,\
  \ comment_url=None, rest={'SameSite': 'Lax'}, rfc2109=False), Cookie(version=0,\
  \ name='logged_in', value='no', port=None, port_specified=False, domain='.github.com',\
  \ domain_specified=True, domain_initial_dot=False, path='/', path_specified=True,\
  \ secure=True, expires=1783923987, discard=False, comment=None, comment_url=None,\
