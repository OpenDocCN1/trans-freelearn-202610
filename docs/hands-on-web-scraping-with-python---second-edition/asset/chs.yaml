- "## 搜索与处理 Web 文档\n\n到目前为止，我们已经了解了 Web 爬取、数据查找技术以及有助于我们进行爬取的相关技术，并且也确定了选择 Python\
  \ 编程语言的一些原因。\n\n基于 Web 或网站的内容以 HTML 元素、预定义文档或某种对象（JSON）的形式存在。为了提取，我们需要分析和识别此类内容、模式和对象。基于\
  \ HTML 的元素通常通过 XML 路径（XPath）和层叠样式表（CSS）选择器来识别，并通过爬取逻辑对所需内容进行遍历和处理。本章将使用 lxml 库来处理标记文档。我们将使用基于浏览器的开发者工具（DevTools）来查找内容和识别元素。\n\
  \n具体而言，在本章中我们将学习以下主题：\n\n- 介绍用于处理标记文档的 XPath 和 CSS 选择器\n- 使用 Web 浏览器 DevTools 访问\
  \ Web 内容\n- 使用 lxml（一个 Python 库）进行爬取\n- 解析 robots.txt 和 sitemap.xml\n\n## 技术要求\n\
  \n需要 Google Chrome 或 Mozilla Firefox 浏览器，我们将使用 JupyterLab 和 Python Notebook。\n\n\
  请参阅第 2 章的“环境搭建”和“创建虚拟环境”部分，并继续使用我们创建的环境。\n\n本章所需的 Python 库如下：\n\n- `lxml`\n- `urllib`\n\
  \n本章的代码文件可在 GitHub 上获取：`https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter03`。\n\
  \n> **重要提示**\n> \n> 基于 Web 或网站的内容是指向 URL 发送请求后收到的响应或页面源代码。内容的类型可以多种多样，如 PDF、CSV、TXT、XML、HTML\
  \ 和 JSON。一般来说，在本章中，除非另有说明，否则我们将 HTML、页面源代码或标记文档作为主要内容进行讨论。\n\n## 介绍用于处理标记文档的 XPath\
  \ 和 CSS 选择器\n\n在 *第 1 章* 的 *理解 Web 页面中使用的最新 Web 技术和数据查找技术* 各节中，我们探讨并讨论了 **HTML**\
  \ 和 **XML** 标记文档及其在整个 Web 中的可用性。\n\n通常，标记是一种对文档中的部分、章节或任何实体进行标注或加标签的方式，有助于识别内容，甚至可以使用第三方应用程序处理内容。在\
  \ HTML 中，我们称它们为**标签**（`https://www.w3.org/html/`），在 XML 中称为**节点**（`https://www.w3.org/standards/xml/`）。因此，标记文档是一种树状结构，包含标签或节点（嵌套或单独的），这种结构也称为**元素树**。\n\
  \n> **重要提示**\n> \n> 自互联网时代开始发展以来，XML 文档在 Web 上一直非常流行和普遍。可读性、编码支持、互操作性和数据可交换性是 XML\
  \ 的一些核心优势。最新的 Web 技术仍然支持 XML，XML 也是标记文档最重要的支柱。\n\n在了解了这里关于标记和 XML 的简要概述之后，接下来的章节将介绍**文档对象模型（DOM）**、XPath\
  \ 和 CSS 选择器，并借助 Python 库将它们用于 Web 爬取。\n\n## 文档对象模型（DOM）\n\n**树型结构**或元素树是大多数标记语言的基础模型，通常被称为\
  \ DOM。请访问以下链接以了解有关 DOM 的更多详细信息：https://www.w3.org/TR/WD-DOM/introduction.html 和\
  \ https://developer.mozilla.org/en-US/docs/Web/API/Document_Object_Model。\n\nDOM\
  \ 处理、DOM 解析、DOM 操作以及更多类似术语指的是与 DOM 相关的活动。借助 DOM 及其定义的约定，我们可以访问、遍历和操作标记文档。许多与 Web\
  \ 相关的技术都支持 DOM 的使用，例如 **JavaScript（JS）**、模板引擎和网页开发工具。\n\nDOM 元素（标签或节点）大多数时候是预定义的或用户自定义的。我们可以在标记文档中找到开放型和闭合型约定。元素在父元素内部以结构化或嵌套的形式存在，也可能同时是某些其他元素的父元素或子元素。这种由\
  \ DOM 元素组成的树状结构基于某种语言或约定，可用于构建标记文档，如图 3.1 所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_77_0.png)\n\
  \n图 3.1：HTML DOM 树结构\n\n理解 DOM 或元素树（HTML 树或 XML 树）是理解文档作为元素容器并遵循提取过程的基本步骤。信息可能嵌套在树结构中，并可能带有表示内容的属性以及其他附加信息。有关更多详细信息，请参阅\
  \ *第 1 章的 HTML 部分*。\n\nXPath 和 CSS 选择器用于沿 DOM 导航，并用于在找到的节点或元素中搜索所需内容。我们将在下一节中探讨\
  \ XPath。\n\n\n\n\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<breakfast_menu>\n\
  \    <food>\n        <name>Brown Toast-Honey</name>\n        <price>$2.99</price>\n\
  \        <description>All time famous, honey and toast combination.</description>\n\
  \    </food>\n    <food>\n        <name>Oat-Pancake</name>\n        <price>$4.95</price>\n\
  \        <description>Delicious pancake, with cheese and berry on top.</description>\n\
  \    </food>\n    <food>\n        <name>Creamy Yoghurt</name>\n        <price>$3.99</price>\n\
  \        <description>Dried nut filled yoghurt, thick and creamy.</description>\n\
  \    </food>\n</breakfast_menu>\n```\n\n如 *Figure 3.2* 所示，我们可以推导出以下内容：\n\n- XML\
  \ 中的一切都是节点 – `breakfast_menu`、`food`、`name` 等\n- 一个 XML 节点本身可以是一个元素，具有开始和结束标签\n\
  - `breakfast_menu` 父节点有三个名为 `food` 的子节点\n- 每个 food 节点都有自己的子节点：`name`、`price` 和 `description`\n\
  - 任何节点中都没有名称-值对或属性\n\n对于 *Figure 3.2* 中的此类 XML 文档，大多数文本或代码编辑器都提供一些格式化选项，例如折叠或展开元素或父节点并美化文本、XPath\
  \ 查询相关功能等。\n\n> **重要说明**\n> \n> 在线或离线有大量平台和应用程序提供 XML 格式化（以及代码相关功能）、美化选项和 XPath\
  \ 表达式测试。其中一些在线提供商有 https://codebeautify.org、https://www.freeformatter.com、https://xpathtester.com、https://try.jsoup.org/\
  \ 和 https://www.webtoolkitonline.com/ 等。\n\n在下面的示例中，我们将使用 Code Beautify 的 XPath\
  \ Tester（https://codebeautify.org/Xpath-Tester）来格式化 XML 内容并测试 XPath 表达式：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_80_0.png)\n\
  \nFigure 3.3: XPath Expression – //food[price>1.99]/name\n\n如 Figure 3.3 所示，//food[price>1.99]/name\
  \ 表达式应用于 Figure 3.2 中的 XML 文件。\n\n如以下输出所示，Figure 3.3 中应用的 XPath 表达式仅返回那些谓词定义为 [price>1.99]\
  \ 且价格值大于 1.99 的 food 节点的 name 元素：\n\n```\n<name>Brown Toast-Honey</name>\n<name>Oat-Pancake</name>\n\
  <name>Creamy Yoghurt</name>\n```\n\n谓词用于识别特定的节点或元素。它们使用方括号编写，其语法类似于 Python 列表。以下是应用于\
  \ Figure 3.2 中看到的 breakfast.xml 文件的几个 XPath 表达式及其一般解释：\n\n- // : 文档节点\n- *: 文档中的所有元素\n\
  - //breakfast_menu: 根元素以及 breakfast_menu 内的所有元素\n- //food: 选择所有 food 元素\n- //food/name:\
  \ 从所有 food 元素中选择 name 元素\n- //food[1]/name/text(): 仅返回第一个 food 元素的 name 的文本\n- //food[1]/name:\
  \ 选择第一个 food 元素的 name，例如 <name>Brown Toast-Honey</name>\n- //food[2]/*: 选择第二个位置的\
  \ food 的所有元素\n\n- `//food[position() <3]/price`: 选择位置小于 3 的 food 元素的价格\n- `//food[price>3.99]/name`:\
  \ 过滤并选择价格值大于 3.99 的 food 元素的 name 元素，例如 <name>Oat-Pancake</name>\n- `//food[last()]/name`:\
  \ 选择最后一个 food 元素的 name 元素\n- `//food[last()]/name | //food[last()]/price`: 选择最后一个\
  \ food 元素的 name 和 price 元素\n- `sum(//food/price)`: 对 food 内部的所有 calories 值求和，总计为\
  \ 11.9\n- `//food/name[contains(.,\"Toast\")]`: 选择包含 \"Toast\" 字符串的 food 元素的 name\
  \ 元素\n- `//food/description[starts-with(.,\"Dried\")]`: 选择 description 元素，其匹配以 \"\
  Dried\" 字符串开头的选项\n- `//food[price>1.99 and price<4.00]/name`: 选择 price>1.99 且 price<4.00\
  \ 过滤选项匹配的 food 元素的 name 元素\n\n现在，有了关于 XPath 表达式的基本概念，让我们考虑一些带属性的表达式。属性是标识给定节点或元素的某些参数的额外属性。单个元素可以包含一些唯一或常见的属性。HTML\
  \ 中的属性在高效有效的遍历中起着重要作用。让我们考虑 https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter03/books.xml\
  \ XML 文件，其内容如下：\n\n```\n<books>\n    <book id=\"1491946008\" price=\"47.49\">\n\
  \        <author>Luciano Ramalho</author>\n        <title>Fluent Python: Clear,\
  \ Concise, and Effective Programming</title>\n    </book>\n    <book id=\"1491939362\"\
  \ price=\"29.83\">\n        <author>Allen B. Downey</author>\n        <title>Think\
  \ Python: How to Think a Computer Scientist</title>\n    </book>\n</books>\n```\n\
  \nXPath 表达式通过在键前添加或前置 @ 字符来接受关键属性。以下是使用属性的几个表达式及其简要解释：\n\n- `//book/@price`: 选择所有可用书籍的价格属性\n\
  \n- `//book[@price>30]`: 选择价格属性大于 30 的 book 元素\n- `//book[@price<30]/title`: 选择价格小于\
  \ 30 的 book 的所有 title 元素\n- `//book/@id`: 选择 id 书籍属性及其值\n- `//@id`: 选择 id 属性及其值\n\
  - `//book[@price=\"29.83\"]/author`: 选择价格属性匹配 29.83 的 book 的作者\n- `sum(//@price)`:\
  \ 返回价格属性值的总和，即 77.3\n\n在本节中，我们查看了一些示例和表达式来学习 XPath 以及如何使用此类表达式检索所需内容。与 XPath 类似，我们也有基于\
  \ CSS 的选择器，我们将在下一节中更详细地探讨。\n\n## CSS selectors\n\n在 *Chapter 1* 的 *Understanding\
  \ the latest web technologies* 和 *Data-finding techniques used in web pages* 部分，我们学习了\
  \ CSS 及其用于设置 HTML 样式的方法。有多种方法可以将 CSS 应用于 HTML。\n\nCSS 选择器（CSS 查询或 CSS 选择器查询）是 CSS\
  \ 用于选择元素的定义模式。与用于查找和识别元素的 XPath 表达式类似，CSS 选择器用于选择或查找 HTML 元素并为其定义样式。在提取过程中，我们使用\
  \ CSS 选择器搜索和查找元素。\n\n以下代码显示了带有基本标签的纯 HTML：\n\n```html\n<html>\n<head>\n    <style>\n\
  \        a{color:blue;}\n        h1{color:black; text-decoration:underline;}\n \
  \       #idOne{color:red;}\n        .classOne{color:orange;}\n    </style>\n</head>\n\
  <body>\n    <h1> Welcome to Web Scraping </h1> Links:\n    <a href=\"https://www.google.com\"\
  > Google </a> &nbsp;\n    <a class='classOne' href=\"https://www.yahoo.com\"> Yahoo\n\
  \    </a> &nbsp;\n    <a id='idOne' href=\"https://www.wikipedia.org\">\n```\n\n\
  ```\nWikipedia </a>\n</body>\n</html>\n```\n\n如前面的代码所示，我们在 https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter03/css_selector.html\
  \ 文件中定义了基本 HTML，我们可以收集以下信息：\n\n- <h1> 是一个 HTML 标签、一个元素和一个选择器\n- 第一个选择器 <a> 有一个 href\
  \ 属性，包含文本 Google\n- 第二个 <a> 选择器具有多个属性，例如 class，其值为 classOne\n- 最后一个 <a> 选择器还具有多个\
  \ id 属性，其值为 idOne，href 有一些值，以及文本 Wikipedia\n\n前述源代码中带或不带属性的区分选择器可用于单独或成组选择该特定元素。与\
  \ XPath Tester 类似，在线和离线有大量 DOM 解析器提供商提供 CSS 查询相关功能。我们将使用 https://try.jsoup.org，如\
  \ Figure 3.4 所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_83_0.png)\n\nFigure\
  \ 3.4: Evaluating CSS query a#idOne\n\n\n\n\n\nCSS 选择器与 XPath 表达式相比具有更多样化的选择。与此同时，它们根据复杂性、代码模式和可用功能被归类为四个基本组。让我们在以下小节中了解有关可用组的更多信息。\n\
  \n## 元素选择器\n\n这些是一些基本选择器，甚至被称为通用选择器，用于从 HTML 中选择或挑选元素。通常，这些选择器是 HTML 的基本标签，如以下列表所示：\n\
  \n- `h1`: 选择文档中所有的 `<h1>` 元素\n- `a`: 选择文档中所有的 `<a>` 元素\n- `body *`: 选择 `<body>`\
  \ 内部的元素组\n- `div a`: 选择 `<div>` 内部所有的 `<a>` 元素\n- `h1, a`: 选择所有的 `<h1>` 和 `<a>`\
  \ 元素\n- `h1 + a`: 选择紧跟在 `<h1>` 元素之后的 `<a>` 元素\n- `h1 ~ a`: 选择所有由 `<h1>` 之前的 `<a>`\
  \ 元素\n\n## ID 和类选择器\n\n这种选择器为元素选择器增加了额外的功能。在使用 CSS 的 HTML 中，我们可以找到大量属性，例如用 # 符号表示的\
  \ ID 和用 . 表示的 class。这些也被称为 HTML 元素中的全局或通用属性。这些全局属性通常比其他属性更受欢迎，因为它们为结构和标识定义了标签。\n\
  \n以下是代码中发现的全局属性，并表达如下：\n\n- `.classOne`: 选择具有 `class=classOne` 的单个或一组元素\n- `#idOne`:\
  \ 选择具有 `id=idOne` 的元素\n- `a.classOne`: 选择具有 `class=classOne` 的单个或一组 `<a>` 元素\n-\
  \ `a#idOne`: 选择具有 `id=idOne` 的单个 `<a>` 元素\n\n## 属性选择器\n\nHTML 标签包含属性（单个或多个），有助于识别携带其值的特定元素。这些与\
  \ XPath 中使用的谓词类似，如下所示：\n\n- `a[href*=\".org\"]`: 选择具有 `href` 属性的 `<a>`，并在其值中找到 `.org`。\n\
  - `a[href^=\"https\"]`: 选择具有 `href` 属性且值以 `https` 开头的 `<a>`。\n- `a[href$=\".com\"\
  ]`: 选择具有 `href` 属性且值以 `.com` 结尾的 `<a>`。\n- `a[href~=google]`: 选择具有 `href` 属性并包含文本\
  \ google 的 `<a>`。这类似于 `[href*=\"google\"]`。\n- `[class=classOne]`: 选择具有 `class=classOne`\
  \ 的元素。\n- `[href]`: 选择所有具有 `href` 属性名的元素。\n\n如前面的 CSS 选择器列表所示，一些 **正则表达式（regex 或\
  \ Regex）** 相关语法也被使用。这使得 CSS 选择器几乎就像 HTML 文档的正则表达式。以下是正则表达式中使用的符号的一些基本解释：\n\n- `*`\
  \ 和 `~`: 表示查找或搜索，尽管两者使用方式不同\n- `$`: 表示字符串的结尾\n- `^`: 表示字符串的开头\n\n## *伪选择器*\n\n这种选择器是一组方便的选择，用于根据其位置来识别或选择元素。以下是一些基本解释：\n\
  \n- `a:eq(1)`: 选择位置为一或文档中第一个 `<a>`\n- `a:gt(1)`: 选择位置大于一的所有 `<a>` 元素\n- `:not(h1)`:\
  \ 选择 HTML 中除 `<h1>` 外的所有元素\n- `a:first-child`: 适用于嵌套元素，选择作为其父元素的第一个子元素的每个 `<a>`\
  \ 元素\n- `a:last-child`: 选择作为其父元素的最后一个子元素的每个 `<a>` 元素\n- `a:nth-child(1)`: 选择从其父元素的第一个子元素开始的每个\
  \ `<a>` 元素\n- `a:nth-last-child(2)`: 选择从其父元素的最后一个子元素开始的每个第二个 `<a>` 元素\n- `a:nth-of-type(2)`:\
  \ 选择从其父元素开始的每个第二个 `<a>` 元素\n- `a:nth-last-of-type(2)`: 选择从其父元素的最后一个开始的第二个位置的每个 `<a>`\
  \ 元素\n- `a:last-of-type`: 选择其父元素的最后一个 `<a>` 元素\n\nCSS 选择器可用作 XPath 表达式的便捷替代方案。它们在长度上相对较短，并且在表达式中使用简单和类似正则表达式的模式。CSS\
  \ 选择器可以转换为 XPath 表达式，但反之则不行。\n\n许多处理 XPath 和 CSS 选择器的开源工具和应用程序都提供在两者之间转换的功能，但测试此类表达式并相应地在代码中应用它们是开发人员的责任。正如我们所见，在\
  \ https://try.jsoup.org 中也存在这样的选项。\n\nhttps://css-selector-to-xpath.appspot.com/\
  \ 在开发者中相当受欢迎，如图 3.5 所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_86_0.png)\n\n\
  图 3.5：CSS 选择器到 XPath\n\n在本节中，我们探索并学习了最流行的网络相关模式查找技术，即 XPath 和 CSS 选择器。我们可以根据方便、代码要求以及所选库中的可用性使用两者或其中之一。在下一节中，我们将探索并学习如何使用基于浏览器的\
  \ DevTools。\n\n## 使用网络浏览器 DevTools 访问网络内容\n\nDevTools 是我们用来探索任何类型响应内容的最重要工具之一，例如\
  \ HTML、JSON、XML 或 TXT。\n\n在第 1 章的开发者工具部分，我们介绍了基于浏览器的 DevTools，其包含各种信息丰富的面板和简要介绍。在本节中，正如标题所述，我们将使用\
  \ DevTools 来定位、查找或访问我们正在寻找的网络内容。通常，我们将以与使用 XPath 和 CSS 选择器表达式处理方式类似的方式搜索并找到保存内容的元素。\n\
  \n我们将使用 Google Chrome 探索网络内容。Chrome 内置了 DevTools，拥有大量功能，可帮助我们提供有关 cookie、标头、curl\
  \ 脚本、美化 DOM、DOM 导航、显示行号、折叠/展开代码块、元素选择、元素识别、内容搜索以及生成 XPath 和 CSS 选择器表达式的信息。\n\n**重要说明**\n\
  cURL，或 curl，是一种命令行工具和库，用于与服务器通信，并被机器和脚本用于处理 URL 中的资源传输。许多编程语言使用与 curl 通信的库来处理与网络的通信。有关\
  \ curl 的更多信息，请访问 https://curl.se/。您也可以探索 cURL 的 Python 接口（PycURL） http://pycurl.io/。\n\
  \n我们现在将继续在 Chrome 中加载一些 URL 并使用 DevTools 在响应内容中访问一些元素或导航 DOM。\n\n## HTML 元素和 DOM\
  \ 导航\n\n访问元素和 DOM 导航的步骤在我们将概念编码化或规划爬虫时非常重要。\n\n此时，我们还应该足够灵活，以至于我们尝试加载和处理的任何 URL\
  \ 都可能被更改或更新。因此，为了应对此类情况的发生，我们选择了一些在线可用的站点，供人们学习网络抓取并实现抓取。我们还在本书的第一版《Hands-On Web\
  \ Scraping with Python》by Packt Publishing 中使用了这些站点。您可以自由地使用类似的概念和步骤与任何其他 URL。\n\
  \n我们将使用 https://toscrape.com。该站点提供了两个不同的 URL，http://books.toscrape.com 和 http://quotes.toscrape.com/，两者都加载了大量类别、标签、分页内容、DOM\
  \ 元素、与授权相关的部分等。让我们使用 Google Chrome 加载 http://books.toscrape.com，如图 3.6 所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_87_0.png)\n\
  \n图 3.6：加载 books.toscrape.com\n\n页面内容成功加载后，我们可以通过在页面上右键单击并选择检查选项，或按 Ctrl + Shift\
  \ + I 来加载 DevTools。有了 DevTools 后，首先，我们可以在左侧找到一个指针图标。这用于从页面中选择元素，如图 3.7 所示。此元素选择器（也称为元素检查器）位于\
  \ DevTools 的左上角，可以通过单击它或按 Ctrl + Shift + C 来打开和关闭：\n\n\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_88_0.png)\n\
  \n我们可以通过点击元素检查器来移动已加载网页上的鼠标，也可以按 *Ctrl + Shift + C*。鼠标或屏幕光标也可以在 **元素** 面板中的代码中移动。\n\
  \n我们使用元素选择器搜索我们所指向的确切 HTML 元素 `<div class=\"alert alert-warning\"...>`，如图 *3.8*\
  \ 所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_88_1.png)\n\n从 *图 3.8* 中可以看到以下内容：\n\
  \n- 已选中 `<section>` 内部找到的 `<div class=\"alert alert-warning\"...>` 元素。\n- 警告文本位于包含\
  \ `<strong>` 节点的 `<div>` 内。页面上该特定元素也有高亮显示。\n\n我们可以重复 *图 3.7* 和 *图 3.8* 中讨论的步骤，选择页面的任意部分，找到\
  \ HTML 标签，或在 HTML 中移动并找到高亮的页面部分。我们还可以右键单击元素代码，找到如 **添加属性、编辑属性、复制元素、删除元素、剪切、复制 XPath**\
  \ 和 **复制选择器** 等选项。\n\n以下是通过上述步骤获得的一些结果：\n\n- **复制 XPath：** `//*[@id=\"default\"\
  ]/div/div/div/div/section/div[2]/ol/li[1]/article/h3/a`\n- **复制完整 XPath：** `/html/body/div/div/div/div/section/div[2]/ol/li[1]/article/h3/a`\n\
  - **复制选择器：** `#default > div > div > div > div > section > div:nth-child(2) > ol\
  \ > li:nth-child(1) > article > h3 > a`\n- **复制元素：** `<a href=\"catalogue/a-light-in-the-attic_1000/index.html\"\
  \ title=\"A Light in the Attic\">A Light in the ...</a>`\n\n类似地，你可以为选定的元素收集所需的表达式。在收集并验证或测试这些表达式之后，将使用\
  \ Python 应用爬取逻辑来自动化数据收集过程。理解 DOM 元素（及其属性）和 HTML 页面源是你必须熟悉的常见领域。\n\n没有特定或完美的方法来确定与表达式相关的\
  \ HTML 元素。我们应该使用本节讨论的工具以及可用的页面源代码。你可以选择市场上任何可用的工具或插件，或基于浏览器的扩展来确定元素表达式。\n\n在本节中，我们检查并探索了用于元素识别和\
  \ DOM 导航的“元素”面板。在下一节中，我们将使用 lxml Python 库，通过 XPath 和 CSS 选择器从 toscrape.com 爬取代码并收集数据。\n\
  \n## 使用 lxml 进行爬取——一个 Python 库\n\nlxml 库是一个 XML 工具包，具有丰富的库集来处理 XML 和 HTML。lxml 因其高速度和有效的内存管理而在\
  \ Python 中被优先选择，同时它还具有处理小型和大型 XML 文件的各种其他特性。\n\nPython 程序员使用 lxml 来处理 XML 和 HTML\
  \ 文档。Python 中还有很多其他类似的库，有些甚至在 lxml 之上构建了额外的附加功能。lxml 也被用作 Python 库中的解析引擎，例如 Beautiful\
  \ Soup (https://www.crummy.com/software/BeautifulSoup/bs4/doc/) 和 pandas (https://pandas.pydata.org/)。\n\
  \nDOM 解析、遍历元素树、XPath 和 CSS 选择器是使 lxml 对网页爬取等任务足够有效和高效的功能。有关 lxml 及其文档的更多详细信息，请访问\
  \ https://lxml.de/。\n\n> **重要说明**\n> lxml 原生支持 XPath 和 XSLT，并基于强大的 C 库 libxml2 和\
  \ libxslt 构建。它的库集通常与 XML 或 HTML 一起使用，以访问 XPath，并解析、验证、序列化、转换和扩展 ElementTree 的功能\
  \ (https://lxml.de/tutorial.html)。\n\nXML 和 HTML 等标记语言的元素具有开始和结束标签。标签也可以具有属性，并且可以包含其他元素。ElementTree\
  \ 是一个包装器，它将 XML 文件加载为元素树。Python 内置的 xml.etree (https://docs.python.org/3/library/xml.etree.elementtree.html)\
  \ 库用于搜索、解析元素和构建文档树。元素对象还表现出与 Python 列表和字典相关的各种可访问属性。\n\nlxml 包含重要的模块，如下所示：\n\n-\
  \ lxml.etree (https://lxml.de/tutorial.html)：用于解析和实现 ElementTree 元素。支持 XPath、迭代等。\n\
  - lxml.html (https://lxml.de/lxmlhtml.html)：解析 HTML 并支持 XPath、CSS 选择器、HTML 表单和表单提交。\n\
  - lxml.cssselect (https://lxml.de/cssselect.html)：将 CSS 选择器转换为 XPath 表达式。接受 CSS\
  \ 选择器或 CSS 查询作为表达式。\n\n在对 lxml 做了基本介绍之后，让我们在下一节中探索一些示例。\n\n## lxml 示例\n\nlxml 是一个核心库，拥有庞大的模块集。在本节中，我们将通过示例探索\
  \ lxml 最常见的功能，例如读取 XML 和 HTML 文件以及使用 lxml 模块进行爬取。\n\n### 读取 XML 文件\n\n在本示例中，我们将使用\
  \ lxml 读取位于 https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter03/breakfast.xml\
  \ 文件中的 XML 内容，如图 3.10 所示：\n\n### 读取“breakfast.xml”并遍历元素\n\n```\n[1]: from lxml import\
  \ etree\n```\n\n读取 XML\n\n```\n[2]: xml = open('breakfast.xml','rb').read()\n```\n\
  \n```\n[3]: xml #bytes\n```\n\n```\n[3]: b'<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\\n<breakfast_menu>\\n <food>\\n  <name>Belgian Waffles</name>\\n  <description>ffiles\
  \ with plenty of real maple syrup</description>\\n  <calories>650</calories>\\n\
  \ </food>\\n <food>\\n\n```\n\n图 3.10：使用 lxml 读取 XML 文件\n\n如图 3.10 所示，xml 变量现在以字节形式包含文件内容。我们需要解析它，将其转换为\
  \ etree 元素。我们可以使用 lxml 默认解析器，例如 etree.parse()，或者由于此处内容是 XML 文件，我们选择了 etree.XML()。在图\
  \ 3.11 中，我们还可以通过使用 etree.get_default_parser() 来找出正在使用哪个解析器。\n\n```\n[4]: tree=etree.XML(xml)\
  \ #parsing using XML()\n```\n\n```\n[5]: tree # element object\n```\n\n```\n[5]:\
  \ <Element breakfast_menu at 0x26cc572f9c0>\n```\n\n```\n[6]: type(tree)\n```\n\n\
  ```\n[6]: lxml.etree._Element\n```\n\n图 3.11：解析文件内容\n\n我们可以看到 tree 是 lxml.etree\
  \ 的 Element 对象。元素树已经定义；现在我们可以遍历并获得基于节点的结果，例如迭代。如图 3.12 所示，我们首先使用 tree.iter() 遍历所有树节点。如果我们要针对某些特定节点（如\
  \ name 和 calories），那么我们可以选择它们，例如 tree.iter('name', 'calories')：\n\n```\n[: for element\
  \ in tree.iter(): #iteration with all elements\n    print(f\"{element.tag} - {element.text}\"\
  )\n```\n\n### 在树中选定的节点之间迭代\n\n```\n[9]: for element in tree.iter('name','calories'):\n\
  \    print(f\"{element.tag} - {element.text}\")\n```\n\n```\nname - Belgian Waffles\n\
  calories - 650\nname - Strawberry Belgian Waffles\ncalories - 900\n```\n\n图 3.12：遍历所有树节点，然后遍历选定的树节点\n\
  \n在图 3.13 中，我们正在对元素标签及其文本应用逻辑，并使用 tree.xpath() 方法应用 XPath 来获取所需结果：\n\n### 当文本小于\
  \ 800 时对“calories”元素应用条件\n\n```python\nfor element in tree.iter():\n    if element.tag==\"\
  calories\":\n        if int(element.text)>800:\n            print(f\"{element.text}\"\
  )\n```\n\n### 使用 XPath 当文本小于 800 时对“calories”元素应用条件\n\n```python\nfor element in\
  \ tree.xpath('//food'):\n    if int(element.xpath('./calories/text()')[0])<800:\n\
  \        print(f\"{element.xpath('./name/text()')[0]} - {element.xpath('./calories/text()')[0]}\"\
  )\n```\n\nBelgian Waffles - 650\nFrench Toast - 600\n\n图 3.13：使用特定节点迭代并应用逻辑，以及使用\
  \ XPath\n\n如本节所示，我们需要先解析内容，然后才能对内容的局部或整体应用基于元素的逻辑。本示例仅使用了 etree 的基本用法及其与读取和遍历相关的核心功能。在下一节中，我们将读取并进一步处理\
  \ HTML 文档。\n\n### 读取 HTML 文档\n\n在本示例中，我们将使用 `urllib.request` 向 URL `http://httpbin.org/forms/post`\
  \ 发起请求，使用 `lxml.html` 解析网页内容，并作为 `lxml.html.HTMLElement` 遍历元素，应用 XPath 和 CSS 选择器。让我们导入并定义要使用的\
  \ URL，如下代码所示：\n\n```python\nfrom lxml import html\nfrom urllib.request import urlopen\
  \   #loading URL\nurl='http://httpbin.org/forms/post'\n```\n\n现在，我们将使用 `urlopen()`\
  \ 向定义的 url 字符串发起请求，并解析收到的响应。如下代码所示，`parse()` 返回 `lxml.etree`，但使用 `getroot()` 时，我们将\
  \ HTMLElement 作为根。由于本示例涉及 HTML，我们对 HTMLElement 感兴趣：\n\n```python\ntree = html.parse(urlopen(url))\
  \  # load URL using urlopen and parse\ntype(tree)                     # lxml.etree._ElementTree\n\
  root = tree.getroot()          # returns the document root node <html>\ntype(root)\
  \                     # lxml.html.HtmlElement\n```\n\n\n\n\n我们可以像处理XML文件并遍历元素一样处理树。在本例中，我们将使用几个新函数，如下所列：\n\
  \n- `find()`：用于定位第一个元素并返回Element。与`find()`和`findall()`类似，可用于查找并遍历所有元素。\n- `text_content()`：返回匹配元素的文本。\n\
  - `findtext()`：从提供的路径返回文本。\n\n这些新函数在以下代码中使用：\n\n```\ntagP = root.find('.//p')  \
  \            # .//p\nprint(tagP.text_content())\n\"Customer name: \"\ntagP1 = root.findtext('.//p/')\
  \      # .//p/\nprint(tagP1)\n\"Customer name: \"\n```\n\n现在，由于我们能够从元素中查找并打印文本，我们将应用XPath并在爬虫代码中使用CSSSelect（CSSSelect将CSS选择器转换为XPath）。\n\
  \n如下面的代码所示，XPath以`root.xpath()`应用，CSS选择器以`root.cssselect()`应用，得到的结果与`xpath()`和`cssselect()`完全相同：\n\
  \n```\nprint(root.xpath('//p/label/input/@value'))\nprint(root.xpath('//legend/text()'))\n\
  print([formP.text_content().strip() for formP in root.xpath('//form/p')])\n...\n\
  print([e.get('value') for e in root.cssselect('p label input[value]')])\nprint([l.text_content()\
  \ for l in root.cssselect('legend')])\nprint([p.text_content().strip() for p in\
  \ root.cssselect('form > p')])\n```\n\n上述代码将产生与以下完全相同的输出：\n\n```\n['small', 'medium',\
  \ 'large', 'bacon', 'cheese', 'onion', 'mushroom']\n[' Pizza Size ', ' Pizza Toppings\
  \ ']\n['Customer name:', 'Telephone:', 'E-mail address:', 'Preferred delivery time:',\
  \ 'Delivery instructions:', 'Submit order']\n```\n\n由于HTML页面源代码中有一个`<form>`元素，并且如示例中的表达式所示，我们也可以针对特定元素——比如`root`中可用的`<form>`元素。\n\
  \n如下面代码所示，只找到一个`<form>`元素：\n\n```\nprint(root.forms)\n[<Element form at 0x1.......>]\n\
  print(root.forms[0].items())\n[('method', 'post'), ('action', '/post')]\nprint(root.forms[0].keys())\n\
  ['method', 'action']\nprint(root.forms[0].method)\nPOST\nprint(root.forms[0].action)\n\
  http://httpbin.org/post\n```\n\n该元素拥有`items()`和`keys()`方法，我们可以获取更多关于method（方法属性，值为GET/POST等）和action（动作属性，带有链接，表单值将提交到该链接）的信息。\n\
  \n在本节中，我们学习了如何读取、加载和解析内容。我们还看了一些基于元素的活动示例，例如遍历、查找元素、返回文本以及应用XPath和CSS选择器表达式。通过本概述以及对处理XML和HTML的代码示例的回顾，在下一节中，我们将使用lxml来抓取一个网站。\n\
  \n## 使用lxml进行Web抓取\n\n在本节中，我们将演示一个使用lxml进行Web抓取的示例。我们将从http://books.toscrape.com抓取并收集数据。更具体地说，我们将以儿童类别的书籍为目标（http://books.toscrape.com/catalogue/category/books/childrens_11/index.html）：\n\
  \n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_95_0.png)\n\n图3.14：儿童类别页面\n\n如*图3.14*所示，此页面有**29个结果**，每页显示**20**个，因此我们必须实现**分页**概念：找到总页数，用表达式定位所需元素，并将数据写入CSV文件。\n\
  \n> **重要说明**\n> \n> 由于我们将处理所选类别的多个页面，因此最好使用DevTools探索并检查Web响应或页面源代码，定位我们正在寻找的页面URL和信息。分页的URL可能包含与第一页不同的内部页面模式。此外，识别并收集元素名称和XPath或CSS选择器表达式。另外，在追踪内容时，内容可能出现在页面源代码中或通过API在某个内部链接中。如果存在API，那么抓取任务将更容易。\n\
  \n在对页面结构和所需URL进行初步研究后，我们部署如下代码：\n\n```\nimport lxml.html as web\nfrom lxml.etree\
  \ import XPath\n...\nbaseUrl=\"http://books.toscrape.com/\"  # URLs and Columns\n\
  bookUrl=baseUrl+\"catalogue/category/books/childrens_11/index.html\"\npageUrl=baseUrl+\"\
  catalogue/category/books/childrens_11/page-\"  # page-\n1,2\ncolumns=['title','price','stock','imageUrl','rating','url']\
  \  #\nColumns for CSV header\n\ndataSet=[]  # container for collected data\npage=1\
  \       # default\ntotalPages=1 # default\n```\n\n如前面的代码所示，我们将使用lxml、XPath、math库（用于处理分页）和csv（将数据写入CSV文件）。我们已经探索了站点的页面，并提出了用于分页的链接，例如baseUrl、bookUrl和pageUrl。首先，对于分页，我们有相同或默认值的page和totalPages，并且一个空的dataSet列表将用于存放收集到的数据：\n\
  \n```\nwhile page <= totalPages:\n    source = web.parse( pageUrl + str(page) +\
  \ \".html\")\n        .getroot()  # read and parse\n    if page==1:          # pagination\n\
  \        perpageArticles =\n            source.xpath(\"//form[@class=\\\"form-\n\
  \            horizontal\\\"]/strong[3]/text()\")  # 20\n        totalArticles =\
  \ source.xpath( \"//form[@class=\n```\n\n```\n\\\"form-horizontal\\\"/strong[1]/text()\"\
  \n# 29\ntotalPages = math.ceil( int(totalArticles[0]) /\n    int(perpageArticles[0]))\
  \ # 1.45\nprint(\"Processing Page \"+ str(page) +\" from \",\n    totalPages)\n\
  ```\n\n在前面的代码中，我们启动了一个循环，并读取和解析了pageUrl以获得根元素。然后我们使用表达式找到了totalArticles（article是表示单个书籍元素的DOM块）的计数、在单个页面上找到的perPageArticles计数以及总页数或totalPages。`math.ceil()`用于获取totalPages的浮点值。\n\
  \n继续循环，我们使用XPath将每个书籍的DOM表达式声明为articles，然后对所需的所有元素使用XPath，例如titlePath：书名，ratingPath：评分等等，针对要获取数据的特定元素：\n\
  \n```\narticles = XPath(\"//ol[contains(@class,'row')]/li[position()>0]\")\ntitlePath\
  \ = XPath(\"./article[contains(@class,'product_pod')]/h3/a/@title\")\n.....\nratingPath\
  \ = XPath(\"./article/p[contains(@class,'star-rating')]/@class\")\n```\n\n借助少量XPath表达式，我们循环遍历页面响应或源代码中找到的articles，以获取选定的实体：\n\
  \n```\nfor row in articles(source):\n    title = titlePath(row)[0].strip()\n   \
  \ link = linkPath(row)[0].replace('.../.../',\n        baseUrl+'catalogue/').strip()\n\
  \n    price = pricePath(row)[0]\n    availability = stockpot(row)[0].strip()\n \
  \   image = imagePath(row)[0].replace('.../.../.../',\n        baseUrl).strip()\n\
  \    rating = ratingPath(row)[0].replace(\n        'star-rating','').strip()\n```\n\
  \n在接收实体、清理它们并删除不需要的文本（使用`replace()`和`strip()`）之后，我们将它们添加到dataSet：\n\n```\nif len(title)>0:\
  \      # if title is not missing, add to dataSet\n    dataSet.append( [title, price,\
  \ availability,\n        image, rating, link] )\n```\n\n最后，我们借助csv库将dataSet写入CSV文件：\n\
  \n```\ndef writeto_csv(data, filename, columns):\n    with open(filename, 'w+',\
  \ newline='', encoding=\"UTF-8\") as file:\n        writer = csv.DictWriter(file,\
  \ fieldnames=columns)\n        writer.writeheader()\n        writer = csv.writer(file)\n\
  \        for element in data:\n            writer.writerows([element])\n```\n\n\
  我们构建了`writeto_csv()`函数，将dataSet中的data转换为CSV文件。它接受三个参数，如下所列：\n\n- `data`：数据收集对象，在此示例中为dataSet\n\
  - `filename`：要生成的CSV文件的名称，例如books.csv\n- `columns`：CSV文件中要提取的那些字段的列名\n\n将所有所需数据追加到dataSet后，我们最终调用`write_to_csv`函数，如`writeto_csv(dataSet,\
  \ 'books.csv', columns)`。这将创建books.csv文件，如图3.15所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_98_0.png)\n\
  \n图3.15：books.csv的输出，包含儿童类别的数据\n\n还需注意，直接从DevTools复制的CSS选择器查询或XPath查询可能与我们在本节示例中使用的不同。我们尝试使用可能的短表达式，并采用一些额外和深入的策略，以及应用Python程序设计中的额外方法。\n\
  \n\n\n\n\nFigure 3.16 shows that User-agent: Nutch is not allowed to crawl python.org:\n\
  \n```\n# Directions for robots.  See this URL:\n# http://www.robotstxt.org/robotstxt.html\n\
  # for a description of the file format.\n\nUser-agent: HTTrack\nUser-agent: puf\n\
  User-agent: MSIECrawler\nDisallow: /\n\n# The Krugle web crawler (though based on\
  \ Nutch) is OK.\nUser-agent: Krugle\nAllow: /\nDisallow: /~nguido/orlijn/\nDisallow:\
  \ /webstats/\n\n# No one should be crawling us with Nutch.\nUser-agent: Nutch\n\
  Disallow: /\n\n# Hide old versions of the documentation and various large sets of\
  \ files.\nUser-agent: *\nDisallow: /~nguido/orlijn/\nDisallow: /webstats/\n```\n\
  \nFigure 3.16: robots.txt file\n\nLet us try to understand a few directives shown\
  \ in *Figure 3.16*:\n\n+   - **Allow:** Permits robots to access the link or directories\
  \ defined.\n+   - **Disallow:** Restricts robots from accessing the link or directories\
  \ defined.\n+   - **User-agent:** Agents, robots, or browser platforms mentioned\
  \ should follow the directives mentioned for those User-agent objects. If * (an\
  \ asterisk) is found mentioned in User-agent, it represents all agents. Sometimes,\
  \ User-agent provides an agent name, such as Nutch, in *Figure 3.16*.\n\nAs mentioned\
  \ in this section, we obey and follow the directives mentioned in the robots.txt\
  \ file. Often, there might not be simple or easy-to-read content and, during automation,\
  \ if we wish to test the directives’ response on the fly, then parsing robots.txt\
  \ is very helpful.\n\n## Parsing robots.txt\n\nUsing a parser, we do not need to\
  \ read the file manually and follow or instruct the steps upon the code found. Also,\
  \ there might be cases that require iteration, validating User-agent for some links,\
  \ or determining the crawl-delay value of the sitemap.xml file (the prescribed time\
  \ that must take place during processing). This information is extremely valuable\
  \ to automate crawlers for some websites and even decide the level of information\
  \ or coding tactics that might be required.\n\nAs seen in the following code, urllib\
  \ has robotparser, which allows developers to read robots.txt and validate or verify\
  \ the necessary actions:\n\n```python\nimport urllib.robotparser\nrobot = urllib.robotparser.RobotFileParser()\n\
  robot.set_url(\"https://www.python.org/robots.txt\")\nrobot.read()\nrobot\n# <urllib.robotparser.RobotFileParser\
  \ at ....>\n```\n\nWe can see examples for methods such as can_fetch(), which deals\
  \ with the Allow and Disallow directives and returns a **Boolean** value of True\
  \ or False, respectively. Similarly, if the sitemap.xml file exists, then robot.site_maps()\
  \ will return the links:\n\n```python\nrobot.can_fetch('*','https://docs.python.org/3/library/urllib.robotparser.html')\n\
  robot.can_fetch('Nutch','https://docs.python.org/3/library/urllib.robotparser.html')\n\
  robot.site_maps()\n```\n\nFor more information on robots.txt directives, please\
  \ visit http://www.robotstxt.org. For parsing, visit https://docs.python.org/3/library/urllib.robotparser.html\
  \ for more details.\n\n## Sitemaps\n\nA sitemap, or sitemap.xml, is an XML file\
  \ that holds the information related to links for a website. Links can be page URLs\
  \ or to specific media. A sitemap is an easy way to inform search engines about\
  \ URLs (*added, updated, modified* date, *removed* URL, *priority, changefreq, and\
  \ more*) or URL management on the site. Search engine scripts crawl the links in\
  \ sitemaps and use the links found for indexing and various purposes, such as **Search\
  \ Engine Optimization (SEO)**.\n\nSimilar to `robots.txt`, we can find sitemaps\
  \ for a domain by appending a URL with `sitemap.xml`. Contents inside a sitemap\
  \ keep changing and sitemaps may not be available for all websites. As seen in Figure\
  \ 3.17, the sitemap of https://www.schools.com/sitemap.xml, there are plenty of\
  \ `<url>` nodes, with a few child nodes:\n\n```\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\"\
  >\n  <url>\n    <loc>https://www.schools.com/</loc>\n    <lastmod>2021-02-03</lastmod>\n\
  \    <changefreq>daily</changefreq>\n    <priority>1.0</priority>\n  </url>\n  <url>\n\
  \    <loc>https://www.schools.com/online-colleges/south-carolina</loc>\n    <lastmod>2021-02-03</lastmod>\n\
  \    <changefreq>daily</changefreq>\n    <priority>0.9</priority>\n  </url>\n  <url>\n\
  \    <loc>https://www.schools.com/online-colleges/west-virginia</loc>\n    <lastmod>2021-02-03</lastmod>\n\
  \    <changefreq>daily</changefreq>\n    <priority>0.9</priority>\n  </url>\n```\n\
  \nFigure 3.17: sitemap.xml\n\nInformation in the child nodes, such as `<lastmod>`,\
  \ notifies us when the last modification took place for the `<loc>` child element.\
  \ Similarly, `<changefreq>` is the changing duration of the `<loc>` element's contents.\
  \ We can deal with sitemap content or parse a sitemap as we did in the Reading XML\
  \ files section.\n\nImportant note\nThere are plenty of Python libraries available\
  \ that read and parse `sitemap.xml` and `robots.txt`. Among those, https://pypi.org/project/advertools/\
  \ is one of the popular ones among the developer community. We also can parse and\
  \ apply logic in sitemaps using lxml. For more details on sitemaps, explore https://www.sitemaps.org/.\n\
  \n## Summary\n\nIn this chapter, we learned about DOM navigation, XPath, and CSS\
  \ selectors using the page source and DevTools. We also learned about reading and\
  \ accessing XML and HTML files and defining and using XPath and CSS selector expressions\
  \ for content extraction.\n\nWe also looked at various aspects of content extraction,\
  \ plus the benefits and restrictions imposed by `robots.txt` and sitemaps. The main\
  \ objective of the chapter was to demonstrate core features related to nodes, element\
  \ identification from HTTP responses received, using the `lxml` and `urllib` libraries\
  \ as required, and dealing with XML and HTML files. Finally, web scraping techniques\
  \ were deployed using an example and data was collected and written to a CSV file.\n\
  \nIn the next chapter, we will learn more about web scraping techniques and about\
  \ some new Python libraries.\n\n## Further reading\n\n+   - **XPath:**\n+     -\
  \ `https://www.w3.org/TR/xpath-31/`\n+     - `https://www.w3schools.com/xml/xpath_intro.asp`\n\
  +   - **CSS selectors:**\n+     - `https://www.css3.info/`\n+     - `https://www.w3schools.com/cssref/css_selectors.php`\n\
  +     - `https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Selectors`\n+   -\
  \ **lxml:** `https://lxml.de/`\n+   - **XML:**\n+     - `https://www.w3.org/XML/`\n\
  +     - `https://developer.mozilla.org/en-US/docs/Web/XML/XML_introduction`\n+ \
  \  - **HTML DOM:**\n+     - `https://html.spec.whatwg.org/multipage/`\n+     - `https://www.w3schools.com/html/`\n\
  +     - `https://www.w3schools.com/xml/dom_intro.asp`\n+   - **robots.txt:**\n+\
  \     - `https://developers.google.com/search/docs/crawling-indexing/robots/intro`\n\
  +     - `https://www.robotstxt.org/robotstxt.html`\n\n+   - **Sitemaps:**\n+   \
  \  - `https://www.sitemaps.org/`\n+     - `https://www.wordstream.com/blog/ws/2022/11/14/what-is-a-sitemap`\n\
  +     - `https://developers.google.com/search/docs/crawling-indexing/sitemaps/overview`\n\
  \n+   - **DevTools:**\n+     - `https://developer.chrome.com/docs/devtools/`\n+\
  \     - `https://developer.mozilla.org/en-US/docs/Learn/Common_questions/Tools_and_setup/What_are_browser_developer_tools`\n"
- "# Scraping Using PyQuery, a jQuery-Like Library for Python\n\nIn the previous chapters,\
  \ you learned about the basics of web scraping, the technologies involved, data-finding\
  \ techniques, and traversing markup documents for data with the help of some **Python**\
  \ code.\n\nWeb scraping is a handful of tasks that involve **reverse engineering**\
  \ techniques. It entails exploring a website (examining its content-related structure,\
  \ **DevTools**, paginations, and more), preparing or installing tools (libraries\
  \ and so on), coding and testing, and finally, collecting data in files, clouds,\
  \ databases, and many more places. In this chapter, we will be learning about web\
  \ scraping using the **PyQuery** Python library; this library assists us in the\
  \ use of concepts such as **XPath**, **CSS selectors**, and parsing markup documents.\
  \ PyQuery provides a **jQuery**-like ability to write less, *do more*, which is\
  \ very significant when coding web scrapers.\n\nIn particular, this chapter will\
  \ cover the following topics:\n\n+   - PyQuery overview\n+   - Exploring PyQuery\n\
  +   - Web scraping using PyQuery\n\n## Technical requirements\n\nA web browser (**Google\
  \ Chrome** or **Mozilla Firefox**) will be required, and we will be using **Jupyter\
  \ notebooks** for code using **JupyterLab**.\n\nPlease refer to the *Creating a\
  \ virtual environment* section in *Chapter 2* to continue setting up and using the\
  \ created environment.\n\n\n\n\n\n本章所需的 Python 库如下：\n\n- pyquery\n- urllib\n- requests\n\
  \n本章的代码文件可在 GitHub 上在线获取：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter04\n\
  \n## PyQuery 概述\n\nPyQuery 是一个类似 jQuery 的 Python 库，可方便地实现和使用 lxml 和 CSS 选择器。\n\n\
  顾名思义，PyQuery 使用简短易读的代码行增强了查询相关操作（XPath 和 CSS 选择器表达式）。正如大家所知，网络爬虫需要解析和遍历功能，这些功能位于各种类型网络文档之上。\n\
  \nPyQuery 提供了与 DOM 和 ElementTree 相关的额外功能，并使用 CSS 选择器执行查询。使用 PyQuery 表达式（或查询）的目的与使用\
  \ XPath 或基于 CSS 选择器的表达式类似。PyQuery 与用于网络文档的 jQuery 几乎相同。\n\n下面的列表包含从 <a class=\"\
  main\"> 元素收集 href 属性的表达式的基本比较：\n\n- PyQuery: response.find('a.main').attr('href')\n\
  - lxml XPath: response.xpath(\".//a[contains(@class,'main')]/@href\")\n- lxml cssselect:\
  \ response.cssselect(\"a.main\").get('href')\n- jQuery: $('a.main').attr('href');\n\
  \n> **重要说明**\n> 有关 PyQuery 的更多详细信息及其最新文档，请访问 https://pyquery.readthedocs.io/en/latest/\
  \ 和 https://pypi.org/project/pyquery/。同样，有关 lxml（XPath 和 cssselect），请访问 https://lxml.de/index.html。\n\
  \n在简要介绍了 PyQuery 及其与 XPath 和 CSS 选择器的相似之处后，让我们回顾一下 jQuery 的基础知识。\n\n## 介绍 jQuery\n\
  \njQuery（*write less, do more; see https://jquery.com/*）是最受欢迎的 JavaScript 库之一，轻量级、符合\
  \ CSS3、跨浏览器兼容且速度快。它支持与网络文档相关的众多功能，如 DOM、HTML 和 CSS。\n\n基于 Web 的文档遍历、操作、事件处理、动画和\
  \ AJAX 是 jQuery 应用的核心功能之一。PyQuery 表达式与 jQuery 表达式相似，因此任何具有先前 jQuery 和 JavaScript\
  \ 知识的人都很容易使用 Python 使用 PyQuery。\n\n在本章中，你将专注于仅使用 Python 库。今天的 Web 开发涉及 JavaScript\
  \ 与动态性、开发和测试以及许多其他方面相关。对于全栈开发人员或 Web 相关程序员而言，JavaScript 以及 AJAX 和 jQuery 的知识几乎是必不可少的。请访问\
  \ https://learn.jquery.com/ 了解有关 jQuery 的更多信息。\n\n在本节中，你已对 PyQuery 和 jQuery 进行了基本介绍。下一节将深入探讨\
  \ PyQuery，并向你展示如何使用它来编写爬虫脚本或抓取网站。\n\n## 探索 PyQuery\n\nPyQuery 以快速、简单和有效的方式处理 **DOM**\
  \ 基于的表达式或查询。在本节中，我们将安装 PyQuery 并探索其中一些重要功能，以便我们准备好开发网络爬虫脚本。\n\n> **重要说明**\n> 你可以找到许多与\
  \ PyQuery 类似的 Python 库。一些示例有 parsel (https://pypi.org/project/parsel/)、beautifulsoup\
  \ (https://pypi.org/project/beautifulsoup4/)、selectolax (https://pypi.org/project/selectolax/)，当然还有\
  \ lxml (https://pypi.org/project/lxml/)。\n\n## 安装 PyQuery\n\n在继续安装 PyQuery 库之前，请参阅\
  \ *Technical requirements* 部分。在 *Chapter 2* 中创建的虚拟环境（`secondEd`）的帮助下，使用 pip 安装或更新\
  \ PyQuery：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_107_0.png)\n\n图 4.1：安装 PyQuery\n\
  \n如图 4.1 所示，安装 PyQuery 还会安装或更新 lxml 和 cssselect 库。为了验证安装，让我们使用以下代码导入 PyQuery：\n\n\
  ```\nimport pyquery\nprint(dir(pyquery)) # Explore pyquery\n# ['PyQuery', '__builtins__',\
  \ '__cached__', '__doc__', '__file__', '__loader__', '__name__', '__package__',\
  \ '__path__', '__spec__', 'cssselectpatch', 'openers', 'pyquery', 'text']\n```\n\
  \n在前面的代码中，我们导入了 PyQuery 并使用 dir() 检查了库的资源。其中有一些函数和类；在这里，我们将主要使用 PyQuery 类：\n\n```\n\
  print(dir(pyquery.PyQuery)) #Class PyQuery provides DOM related features\n['Fn',\
  \ '__add__',..., 'add_class', 'after', 'append', 'appendTo', 'append_to', 'attr',\
  \ 'base_url', 'before', 'children', 'clear', 'clone', 'closest', 'contents', 'copy',\
  \ 'count', 'css', 'each', 'empty', 'encoding', 'end', 'eq', 'extend', 'filter',\
  \ 'find', 'fn', 'hasClass', 'has_class', 'height', 'hide', 'html', 'index', 'insert',\
  \ 'insertAfter', 'insertBefore', 'insert_after', 'insert_before', 'is_', 'items',\
  \ 'length', 'make_links_absolute',..., 'parent', 'parents', 'pop', 'prepend', 'prependTo',\
  \ 'prepend_to', 'prev', 'prevAll', 'prev_all', 'remove', 'removeAttr', 'removeClass',\
  \ 'remove_attr', 'remove_class', 'remove_namespaces', 'replaceAll', 'replaceWith',\
  \ 'replace_all', 'replace_with', 'reverse', 'root', 'serialize', 'serializeArray',\
  \ 'serializeDict', ..., 'show', 'siblings', 'size', 'sort', 'text', 'toggleClass',\
  \ 'toggle_class', 'val', 'width', 'wrap', 'wrapAll', 'wrap_all', 'xhtml_to_html']\n\
  ```\n\n在前面的代码中，我们探索了 PyQuery 类，并发现了许多方法和属性，这些方法和属性或多或少类似于 DOM 概念，例如 attr、children、eq、root、parent、next\
  \ 和 hasClass。\n\nImportant note\n代码和输出均复制自 Jupyter notebook。单行注释 # 已用于呈现简短输出和注释。如果输出分布在多行，则使用带\
  \ # 的新行。此外，多行输出将按需要缩短。\n\n在本节中，你安装了 PyQuery 并了解了其中一些功能。在下一节中，你将探索使用 PyQuery 的一些示例。\n\
  \n## 加载 Web URL\n\n我们现在将借助一些代码示例实际探索 PyQuery 的功能。有各种类型的网络文档。我们将使用 requests 库以如下方式定位\
  \ HTML 和 XML 内容：\n\n```\n```python\nfrom pyquery import PyQuery as pq\nimport requests\n\
  response = requests.get\n    (\"https://webscraper.io/test-sites/\")\ntype(response)\
  \       # requests.models.Response\nsource = pq(response.content) # convert HTTP\
  \ Response to pyquery\ntype(source) # pyquery.pyquery.PyQuery\n```\n```\n\n正如你在前面的代码中所看到的，我们使用了\
  \ requests 库进行 HTTP 通信。在此示例中，我们正在处理 https://webscraper.io/test-sites/ URL，并检查 response\
  \ 和 source 的类型。在处理 DOM 之前，我们需要将页面源或 HTTP 响应转换为 PyQuery 对象，pyquery.source = pq(response.content)\
  \ 将来自网络的 response.content 页面源转换为 PyQuery 对象。\n\n手头有了 PyQuery 对象 source，我们现在准备进入下一节，在那里我们将探索\
  \ PyQuery 的更多功能。\n\n## 元素遍历、属性和伪类\n\n使用上一节中的 source PyQuery 对象，我们将探索 PyQuery 提供的一些属性和方法。在实现代码之前，建议你浏览浏览器中的页面源，或使用\
  \ DevTools 识别或检查元素。\n\n以下示例可用于分析页面源中的元素及其内容：\n\n```\n```python\nsource.find('title')\
  \          # [<title>]\nsource.find('title').text()   # Web Scraper Test Sites\n\
  \nsource.find('a')              # source('a')\n# [<a>,..., <a.menuitem>, <a.menuitem>,\
  \ <a.menuitem.dropdown-\ntoggle>, <a>,………, <a>, <a.btn-menu1.install-extension>,\
  \ <a.btn-menu2>,\n<a>, <a>, <a>,……, <a>, <a>, <a>]\n```\n```\n\n前面的代码使用 find() 方法查找提供给它的元素、标签或\
  \ CSS 选择器并识别这些元素。find(a) 返回 <a> 元素的列表以及一些类名，例如 menuitem 和 btn-menu。找到元素后，有各种方法，例如\
  \ text()、attr() 和 html()，它们返回所需的内容或使用属性名称或表达式捕获 key:value。在前一种情况（source.find('title').text()）中，text()\
  \ 返回 <title> 标签中找到的内容。\n\n\n\n\n\n这里，我们尝试在具有 name 属性且值分别为 keywords 和 description\
  \ 的 <meta> 标签的 content 属性中查找信息：\n\n```\nsource.find('meta[name=\"keywords\"]').attr('content')\n\
  # web scraping, Web Scraper, Chrome extension, Crawling,\n  Cross platform scraper\n\
  source.find('meta[name=\"description\"]').attr('content')\n# You need to train your\
  \ web scraper? We have created\n  simple test sites that allow you to try all corner\
  \ cases\n  and proof test your scraper. Try it now.\n```\n\n以下代码演示了 html() 函数的使用。它返回所提供表达式的\
  \ HTML 内容：\n\n```\nsource.find('ul.dropdown-menu').html()\n# \\n\\t...\\t<li>\\\
  n\\t...\\t<a href=\"/documentation\">Documentation</a>\\n\\t...\\t</li>\\n\\t...\\\
  t<li>\\n\\t...\\t<a href=\"/tutorials\">Video Tutorials</a>\\n\\t...\\t</li>\\n\\\
  t...\\t<li>\\n\\t...\\t<a href=\"/how-to-videos\">How to</a>\\n\\t...\\t</li>\\\
  n\\t...\\t<li>\\n\\t...\\t<a href=\"/test-sites\">Test Sites</a>\\n\\t...\\t</li>\\\
  n\\t...\\t<li>\\n\\t...\\t<a href=\"https://forum.webscraper.io/\" target=\"_blank\"\
  \ rel=\"noopener\">Forum</a>\\n\\t...\\t</li>\\n\\t\\t\\t\\t\\t\n```\n\n这种技术对于在不使用\
  \ DevTools 元素选择器或用于验证 DevTools 的输出的情况下识别内部或子元素及其属性和内容非常方便。\n\n> **重要说明**\n> 类和 id\
  \ CSS 属性分别用 . 和 # 表示。例如，<a class=\"main\" id=\"mainLink\"> 将表示为 a.main 和 a#mainLink。\n\
  \nPyQuery 还包含与表达式一起使用的伪类或伪元素。这些元素以 : 字符开头，例如 :eq()、:last 和 :first。它们就像实现某些快捷方式的预定义常量。大多数情况下，伪元素与已识别的可迭代（集合）类型的元素一起使用。我们将在\
  \ Iterating using PyQuery 部分更详细地介绍迭代。\n\n以下代码块中显示了 PyQuery 伪元素的使用。这些元素类似于快捷方式，并且大多数情况下消除了迭代的需要：\n\
  \n```\nsource.find('a:eq(0)').text()    # Toggle navigation\nsource.find('a.menuitm:first').text()\
  \ # Web Scraper\nsource.find('a.menuitm:last').text()    # Learn\nsource.find('a.menuitm:eq(1)').attr('href')\n\
  # /cloud-scraper\n```\n\n让我们讨论一下在前面的代码中使用的一些伪元素：\n\n- `:eq()`: 接受一个索引号（在 Python\
  \ 中索引从 0 开始）。它评估匹配的表达式并收集与其关联的文本。这也可以用作 `source.find('a')`. `eq(0).text()`. 还有一些元素与\
  \ `:eq()` 类似：\n  - `:lt()`: 接受一个索引号并且仅返回 *小于* 所提供索引号的值，例如，`source.find('a:lt(2)')`\n\
  \  - `:gt()`: 接受一个索引号并且仅返回 *大于* 所提供索引号的值，例如，`source.find('a:gt(0)')`\n- `:first`:\
  \ 返回匹配表达式的元素的 *第一个出现*，与 `:eq(0)` 相同。\n- `:last`: 返回匹配表达式的元素的 *最后一个出现*。\n\n还有一些 *伪元素*，不过它们与前一个代码块中列出的有所不同：\n\
  \n```\nsource.find(':input')\n# [<button.navbar-toggle.pull-right.collapsed>]\n\n\
  source.find(':header')\n# [<h1>, <h2.site-heading>, <h2.site-heading>, <h2.site-heading>,\
  \ <h2.site-heading>, <h2.site-heading>, <h2.site-heading>, <h2.site-heading>]\n\n\
  source.find(':empty')\n# [<meta>, <meta>, <meta>, <meta>, <link>, <meta>, <link>,\
  \ <link>, <link>, <script>, <iframe>, <span.icon-bar.top-bar>, <span.icon-bar.middle-bar>,\
  \ <span.icon-bar.bottom-bar>, <img>, <a>, … <hr.test-site-divider>, <img>, <hr.test-site-divider>,\
  \ <img>… <div.clearfix>, <div.push>, <br>, <img>, <img>]\n\nsource.find('meta:empty')\n\
  # [<meta>, <meta>, <meta>, <meta>, <meta>]\n\nsource.find(':empty:even')\n# [<meta>,\
  \ <meta>, <meta>, <link>, <link>, <iframe>, <span.icon-bar.middle-bar>, <img>, <div.crta>,\
  \ <div.crta>, <hr.test-site-divider>, <hr.test-site-divider>, <hr.test-site-divider>,\
  \ <hr.test-site-divider>, <hr.test-site-divider>, <div.clearfix>, <br>, <img>]\n\
  \nsource.find(':header:odd')\n# [<h2.site-heading>, <h2.site-heading>, <h2.site-heading>,\
  \ <h2.site-heading>]\nsource.find('meta:empty:odd')   # [<meta>, <meta>]\n```\n\n\
  让我们探索一下在前面的代码中使用的 *伪元素*：\n\n- `:input`: 返回所有 <form> 输入元素或接收某些操作的元素，例如 <button>。`source('\
  \ :input ' )` 等同于 `source.find(' :input ')`。HTML 中还有 <input> 元素，可以表示为 `source.find('input')`。\n\
  - `:header`: 返回找到的 HTML 标题元素（<h1>、<h2>... <h6>）。\n- `:empty`: 返回所有没有子元素的元素。这有助于在继续迭代内部元素之前进行检查。\n\
  - `:even`: 返回所有偶数索引的元素。它们也可以与其他 *伪元素* 一起使用。这里有两个示例：`source.find('meta:empty:even')`\
  \ 和 `source('meta;empty:even')`。\n- `:odd`: 与 `:even` 类似，但返回奇数索引的元素。\n\n除了索引相关任务和查找元素之外，*伪元素*\
  \ 还可用于搜索具有所提供文本的元素：\n\n```\nsource.find('a:contains(\"Web\")')\n# [<a.menuitm>,\
  \ <a>, <a>, <a>, <a>]\n\nsource.find('a:contains(\"Web\"):last').text()\n# 'Web\
  \ Scraper'\nsource.find('a:contains(\"Web\"):last').attr('href') # '# '\n```\n\n\
  如前面的代码所示，`:contains()` 接受一个字符串参数，该参数区分大小写并返回匹配的元素。\n\nPyQuery 还具有一些验证函数。这些函数在许多情况下非常有效（例如更新现有爬虫），用于搜索具有属性的元素并确认属性的值。\n\
  \n图 4.2 显示了 https://webscraper.io/test-sites 的页面源代码块，其中包含 <p class=\"copyright\"\
  >：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_112_0.png)\n\n图 4.2：页面源视图\n\n在前面的代码中，source.find('a.menuitm,\
  \ a[class*=\"btn-menu\"]').items() 收集与表达式 a.menuitm 和 a[class*=\"btn-menu\"] 匹配的元素。遍历它们找到了\
  \ items() 的 href 属性；我们总共有六个结果。\n\n我们在 Element traversing, attributes, and pseudo-classes\
  \ 部分遇到了许多 <meta> 标签。让我们收集常见 <meta> 标签的 name 和 content 属性的值（如果存在）：\n\n```\nmeta=[]\n\
  count=0\nfor item in source.find('meta').items():\n    if item.attr('name') and\
  \ item.attr('content'):\n        meta.append({'index':count,'name':item.attr('name')\n\
  \            , 'content':item.attr('content')})\n        count+=1\n```\n\n前面的代码遍历\
  \ source.find('meta').items()。对于每个 <meta> 标签或项目，已应用逻辑步骤来检查 name 和 content 属性是否存在。如果存在，它们将作为\
  \ Python 字典或 dict() 对象附加到 meta 输出列表。最终的 meta 输出列表如下所示：\n\n```\n[ {'index': 2,  'name':\
  \ 'keywords',  'content': 'web scraping,Web Scraper,Chrome extension,Crawling,Cross\
  \ platform scraper'},\n{'index': 3,  'name': 'description',  'content': 'You need\
  \ to train your web scraper? We have created simple test sites that allow you to\
  \ try all corner cases and proof test your scraper. Try it now.'},\n{'index': 4,\
  \  'name': 'viewport',  'content': 'width=device-width, initial-scale=1.0'}]\n```\n\
  \n前面的代码中的输出提供了以下信息：\n\n- 总共有五个 <meta> 标签（索引 0 到 4）\n- 在五个 <meta> 标签中，第一和第二个标签要么没有\
  \ name 和 content 属性，要么缺少其中一个\n\n在本节中，我们学习了如何部署 PyQuery 功能以获得特定结果，并测试了迭代和伪类等技术。在下一节中，我们将学习如何实现前面章节和前几节中的所有概念来从网络抓取数据。\n\
  \n## 使用 PyQuery 进行网络抓取\n\n本节包含大量示例，解释如何编写网络抓取脚本。我们将使用 PyQuery 和 requests 库并处理来自网络的\
  \ HTML 和 XML 内容。我们将把这些示例中收集的数据写入 CSV 或 JSON 文件。\n\n\n\n\n# 示例 1 – 抓取图书详情\n\n在本示例中，我们将抓取\
  \ http://books.toscrape.com 上“Childrens”（儿童）分类（http://books.toscrape.com/catalogue/category/books/childrens_11/index.html）下列出的图书。本示例与第\
  \ 3 章中提供的另一个示例类似，当时使用了 lxml 库。本示例的代码可在 GitHub 上获取：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter04/example_1.ipynb。\n\
  \n如图 4.3 所示，Childrens 分类包含 29 条结果（单页仅显示 20 条结果）：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_115_0.png)\n\
  \n图 4.3：包含 29 条结果的 Childrens 分类页面\n\n## 重要说明\n\n建议你使用 DevTools 浏览所选分类的页面，并通过元素检查工具在页面中移动来找出\
  \ URL 或内容之间的差异，或者查看页面源码并识别目标元素。\n\n在学习了处理页面和 URL 的基础知识后，我们可以继续编写脚本。以下代码定义了所需的库、URL、默认分页值以及用于收集数据的空\
  \ dataSet：\n\n```\nfrom pyquery import PyQuery as pq\nimport requests, math\nsiteUrl=\"\
  http://books.toscrape.com/\"\nbaseUrl=siteUrl+\"catalogue/category/books/childrens_11/index.html\"\
  \npageUrl=siteUrl+\"catalogue/category/books/childrens_11/page-\"\n```\n\n```\n\
  ```python\ndataSet=[]\npage=1\ntotalPages=1\n```\n```\n\npageURL 保存了在浏览 **Childrens**\
  \ 页面时找到的分页链接模式（例如，`../page-1.html` 和 `../page-2.html` 分别代表一个页面的 URL）。\n\n通过分页循环，使用\
  \ requests 处理 pageUrl，最后生成一个名为 source 的 PyQuery 对象：\n\n```\n```python\nresponse\
  \ = requests.get(pageUrl+str(page)+\".html\")\nsource = pq(response.content)\nif\
  \ page==1:\n    pageValues=[value.text() for value in\n        source.find('form.form-horizontal\
  \ strong').items()]\n    if len(pageValues)>0:\n        pageValues = list(map(int,pageValues))\
  \ # converts\n        to int [29 1 20]\n        totalPages = math.ceil(pageValues[0]/pageValues[2])\n\
  print(f\"Page {page} from Total {totalPages}\")\n```\n```\n\n有了 source，我们现在可以找到所需的确切元素块，并对其进行迭代以获取目标值。pageValues\
  \ 在此情况下会得到三个元素：`['29','1','20']`。使用 `map(int,pageValues)`，这些字符串形式的 pageValues 结果会被转换为\
  \ int（整数）值，并计算出 totalPages。\n\n使用 find()、attr() 和 text() 等 PyQuery 方法，可以追踪所需的值，最后通过\
  \ strip() 和 split() 进行清理和拆分：\n\n```\n```python\nbooks = source.find('article.product_pod')\
  \ #book\nfor book in books.items():  #iterate\n    image = book.find('.image_container\
  \ a img').attr('src')\n    rating = book.find('p.star-rating').attr('class')\n \
  \       .split()\n    title = book.find('h3:first a').attr('title').strip()\n  \
  \  url = book.find('h3:first a').attr('href')\n    price = book.find('p.price_color').text().strip()\n\
  \    stock = book.find('p.availability').attr('class')\n        .split()\n```\n\
  ```\n\n如下面的代码所示，在收集到所需值并进行清理和处理后，它们最终会以 Python 字典的形式添加到 dataSet：\n\n```\ndataSet.append({\n\
  \    'name':title,\n    'price':price.replace('£',''),\n    'stock':stock[0],\n\
  \    'rating':rating[1],\n    'image':image.replace('../../../../',\n        'http://books.toscrape.com/catalogue/'),\n\
  \    'url':url.replace('../../../../',\n        'http://books.toscrape.com/catalogue/')\n\
  })\n```\n\n将数据添加到 dataSet 后，下面的代码使用 json 库中的 json.dump() 以 dataSet 中的数据创建一个 childrens_books.json\
  \ 文件：\n\n```\nimport json\nwith open(\"childrens_books.json\", \"w\") as file:\n\
  \    json.dump(dataSet, file, indent=4, sort_keys=False)\n```\n\n对于格式正确且带缩进的 JSON\
  \ 内容，可以使用任何支持 JSON 文件格式的代码编辑器或文本编辑器。\n\n**重要说明**\n有关 json 库的更多信息，请访问 https://docs.python.org/3/library/json.html。\n\
  \n在本示例中，我们学习了如何从存在于多页的 HTML 文档中抓取数据、如何处理多页 URL，以及如何维护 items() 循环。我们还进行了一些基本的数据清理工作，最后从集合对象创建了一个\
  \ JSON 文件。在下一个示例中，我们将处理不同的内容格式。\n\n# 示例 2 – 站点地图转 CSV\n\n在本示例中，我们将解析站点地图或 XML 文件，遍历它，并生成一个\
  \ CSV 文件。本示例的代码可在 GitHub 上获取：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter04/example_2.ipynb。我们加载的\
  \ URL 是 https://www.schools.com/sitemap.xml，其内容如图 4.4 所示：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_118_0.png)\n\
  \n`<urlset>` 节点包含 `<url>` 子节点，这些子节点又包含 `<loc>`、`<lastmod>`、`<changefreq>` 和 `<priority>`\
  \ 等子元素。在确定了这些节点后，我们将遍历每个子节点 `<url>`，将它们的子元素信息收集到列表中，最后写入 CSV 文件：\n\n```\n```python\n\
  from pyquery import PyQuery as pq\nimport requests, csv\nurl = \"https://www.schools.com/sitemap.xml\"\
  \ncolumns=['loc','lastmod','changefreq','priority']\n#Columns for CSV header\n```\n\
  ```\n\n代码中已经声明了所需的库、url 属性以及 CSV 格式所需的列名（columns）。\n\n如下面的代码所示，为 PyQuery 对象提供了一个额外的参数\
  \ `parser='html'`。这使得 PyQuery 能够将源页面中遇到的节点和子节点解释为 HTML 文档：\n\n```\n```python\nxmlFile\
  \ = requests.get(url).content  #loading the url\nurlXML = pq(xmlFile, parser='html')\
  \  #parser\nprint(\"Child-Length: \",urlXML.children().__len__())\n# Child-Length:\
  \ 530\n```\n```\n\nurlXML 指的是 `<urlset>` 节点，urlXML.children() 指的是 `<urlset>` 的 `<url>`\
  \ 子节点，共计 530 个。\n\nPython 提供了非常有用的 range(start, stop, step) 函数。它为我们提供了 start 与 stop（在我们的代码中为\
  \ 0 和 530）之间的范围。由于共有 530 个目标的 `<url>` 元素，因此我们通过 eq(loop) 提供索引号来启动循环：\n\n```\n```python\n\
  dataSet=[]\nloops = range(0, urlXML.children().__len__())\n# range(start, stop)\n\
  for loop in loops:\n    child = urlXML.children().eq(loop)  #0, 1, 2, 3..,529\n\
  \    dataSet.append([\n        child.find('loc').text(),\n        child.find('lastmod').text(),\n\
  \        child.find('changefreq').text(),\n        child.find('priority').text()\n\
  \    ])\n```\n```\n\n在识别出相应的 `<url>` 实例后，它们的 `<loc>`、`<lastmod>`、`<changefreq>`\
  \ 和 `<priority>` 值会被追加到 dataSet 中。\n\n下面的代码定义了一个在*第 3 章*中也使用过的函数。它接受诸如数据（在我们的例子中即集合对象\
  \ dataSet）、要创建的文件名以及 CSV 文件首行的列列表（columns）等参数，如下所示：\n\n```\n```python\ndef writeto_csv(data,filename,columns):\n\
  \    with open(filename,'w+',newline='',encoding=\"UTF-8\") as\n        file:\n\
  \            writer = csv.DictWriter(file, fieldnames=columns)\n            writer.writeheader()\n\
  \            writer = csv.writer(file)\n            for element in data:\n     \
  \           writer.writerows([element])\n```\n```\n\n使用正确的参数调用 writeto_csv(dataSet,\
  \ 'schoolXML.csv', columns) 函数会创建 schoolXML.csv 文件，如图 4.5 所示：\n\n|  | loc | lastmod\
  \ | changefreq | priority |\n|---|---|---|---|---|\n| 1 | https://www.schools.c...\
  \ | 2021-02-03 | daily | 1.0 |\n| 2 | https://www.schools.c... | 2021-02-03 | daily\
  \ | 0.9 |\n| 3 | https://www.schools.c... | 2021-02-03 | daily | 0.9 |\n| 4 | https://www.schools.c...\
  \ | 2021-02-03 | daily | 0.9 |\n| 5 | https://www.schools.c... | 2021-02-03 | daily\
  \ | 0.9 |\n| 6 | https://www.schools.c... | 2021-02-03 | daily | 0.9 |\n| 7 | https://www.schools.c...\
  \ | 2021-02-03 | daily | 0.9 |\n| 8 | https://www.schools.c... | 2021-02-03 | daily\
  \ | 0.9 |\n| 9 | https://www.schools.c... | 2021-02-03 | daily | 0.9 |\n| 10 | https://www.schools.c...\
  \ | 2021-02-03 | daily | 0.9 |\n\n图 4.5：schoolXML.csv\n\n在本示例中，我们从 XML 节点收集了数据并创建了一个\
  \ CSV 文件。这在表示和可视化 XML 参数时非常有用，例如某个 loc（URL 或位置）的 lastmod（最后修改日期）和 priority。在下一个示例中，我们将引入更多对网页抓取有帮助的概念。\n\
  \n# 示例 3 – 抓取带作者详细信息的引言\n\n在本示例中，我们将从 http://quotes.toscrape.com/tag/books 的 books\
  \ 标签下收集数据或引言。本示例的代码可在 GitHub 上找到：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter04/example_3.ipynb。本示例处理的几个场景与示例\
  \ 1 – 抓取图书详情和示例 2 – 站点地图转 CSV 略有不同：\n\n- 我们需要处理分页，这与示例 1 – 抓取图书详情不同。\n- 我们需要深入列表中的单个页面或链接，以收集一些额外的详细信息。\n\
  - 每位作者也可能有多条引言。本示例会在同一页面上反复循环，这可能会消耗内存和时间。\n- 此外，我们还将为作者和引言分别创建文件。\n\n主页（http://quotes.toscrape.com/tag/books）如图\
  \ 4.6 所示：\n\n\n\n\n\n### Quotes to Scrape\n\n#### Viewing tag: books\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_121_0.png)\n\
  \n#### Top Ten tags\n\nFigure 4.6: Base page to be scraped\n\nData related to authors\
  \ (from the about link), tags, author names, and quote statements are the main targets.\n\
  \nThe following code shows the declaration of basic requirements, with the format\
  \ of pagination URLs to be http://quotes.toscrape.com/tag/books/page/1/ and http://quotes.toscrape.com/tag/books/page/2/:\n\
  \n```python\nfrom pyquery import PyQuery as pq\nimport requests, csv\nurl = \"http://quotes.toscrape.com/tag/books/page/\"\
  \ncolumns=['id', 'author', 'quote', 'tags', 'quote_length', 'born_date', 'born_location','author_url']\n\
  authorSet=dict()\ndataSet=list()\npage=1\nnextPage=True\nuid=0\n```\n\nTwo different\
  \ types of collection objects (dictionaries and lists) are also defined (authorSet\
  \ and dataSet), along with some default values carrying variables.\n\nIn the following\
  \ code, while (nextPage) initiates the loop, and the value of nextPage is now True:\n\
  \n```python\nwhile (nextPage):\n    response = requests.get(url+str(page))\n   \
  \ source = pq(response.content)\n    if source.find('ul.pager li.next a:contains(\"\
  Next\")') :\n        nextPage=True\n    else:\n        nextPage=False\n```\n\nWhile\
  \ browsing through the pages, we did find the URL pattern, but there is no mention\
  \ of how many total quotes are available. This restricts us from calculating values\
  \ such as the final page number or the total number of pages to maintain the loop.\
  \ To do this, we have used the nextPage Boolean variable, which is always True if\
  \ the browsed page contains the text Next. If the browsed page does not have the\
  \ text Next, then we assume that the browsed page is the final page and maintain\
  \ the loop accordingly by updating nextPage to False. Maintaining the loop is always\
  \ a priority and needs to be checked while browsing each page.\n\nThe following\
  \ code iterates on the class attribute value quote and collects the required data\
  \ with some basic data-cleaning activities:\n\n```python\nfor quotes in source.find('.quote').items():\n\
  \    quote = quotes.find('[itemprop=\"text\"]').text().strip()\n    author = quotes.find('[itemprop=\"\
  author\"]').text().strip()\n    tags = quotes.find('[itemprop=\"keywords\"]').attr('content').strip()\n\
  \    authorUrl = quotes.find('a[href*=\"/author/\"]').attr('href')\n```\n\nIn each\
  \ iteration over quote, authorUrl is collected. During the preliminary study, we\
  \ found that there are a few different quotes from the same author on the page.\n\
  \nAs we have to browse each authorUrl encountered, some system resources are wasted\
  \ when loading duplicate URLs, and even in the final output, duplicate values will\
  \ be available. To deal with this situation, we must verify whether authorUrl has\
  \ been accessed or not.\n\nThe following code inserts the formatted value of author\
  \ (author name) or authorKey in authorSet:\n\n```python\nif authorUrl:\n    authorKey\
  \ = author.replace('.', '_').replace(' ', '_').strip()\n\nif authorUrl and authorKey\
  \ not in authorSet.keys():\n    authorUrl = \"http://quotes.toscrape.com\"+authorUrl\n\
  \    source_author = pq(requests.get(authorUrl).content)\n    bornDate = source_author.find('.author-born-date').text()\n\
  \    bornLocation = source_author.find('.author-born-location').text().replace('in\
  \ ', '').strip()\n```\n\n### Important note\n\nTargeting only required values and\
  \ unique values and cleaning and formatting the data before inserting it into its\
  \ final destination (files, database tables, or cloud storage) will help the quality\
  \ analysis (QA) and data analysis processes a lot. These processes, also known as\
  \ data verification, are among the basic steps to take with a dataset before carrying\
  \ out machine learning (ML) and data visualization, and exploratory data analysis\
  \ (EDA) helps us to find out how much data verification is required.\n\nThese activities\
  \ are often forwarded to the QA team to find issues (duplicate, missing, and unformatted\
  \ data) in the dataset or for preprocessing (finding duplicates, cleaning, and formatting)\
  \ the dataset.\n\nAfter browsing the author detail page and collecting data on individual\
  \ quotes, the desired, cleaned values are appended to dataSet:\n\n```python\ndataSet.append([\n\
  \    uid,\n    author,\n    quote,\n    tags.replace(',', '|'),\n    len(quote),\n\
  \    authorSet[authorKey]['date'],\n    authorSet[authorKey]['location'],\n    authorSet[authorKey]['url']\n\
  ])\npage += 1  # continue with pagination value\n\n# After looping through all pages\n\
  writeto_csv(dataSet, 'quotes.csv', columns)\n```\n\nAfter collecting all the data\
  \ and progressing through all the pages, the dataSet content is finally written\
  \ to a CSV file, as shown in Figure 4.8, using the writeto_csv() function, as described\
  \ in Example 2 – sitemap to CSV:\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_124_0.png)\n\
  \nFigure 4.8: Output (quotes.csv)\n\nAs defined in the following code, we are also\
  \ exporting the author details from authorSet to a JSON file (quotes_author.json)\
  \ using the json library:\n\n```python\nimport json\n# Writing Dictionary authorSet\
  \ to JSON file using json.dump()\nwith open(\"quotes_author.json\", \"w\") as file:\n\
  \    json.dump(authorSet, file, indent=4, sort_keys=False)\n```\n\nThe final output\
  \ of the JSON file will look as shown in Figure 4.9:\n\n```\n▼ root:\n  ▶ Jane_Austen:\n\
  \  ▶ Mark_Twain:\n  ▶ Jorge_Luis_Borges:\n  ▶ C_S__Lewis:\n  ▶ Haruki_Murakami:\n\
  \  ▶ Ernest_Hemingway:\n  ▼ J_D__Salinger:\n    name: \"J.D. Salinger\"\n    url:\
  \ \"http://quotes.toscrape.com/author/J-D-Salinger\"\n    date: \"January 01, 1919\"\
  \n    location: \"Manhattan, New York, The United States\"\n  ▶ Madeleine_L'Engle:\n\
  \  ▼ George_R_R__Martin:\n    name: \"George R.R. Martin\"\n    url: \"http://quotes.toscrape.com/author/George-R-R-Martin\"\
  \n    date: \"September 20, 1948\"\n    location: \"Bayonne, New Jersey, The United\
  \ States\"\n```\n\nFigure 4.9: JSON data (quotes_author.json)\n\nIn this section,\
  \ we used some scraping techniques to extract the desired content from a website.\
  \ Content identification on the web and a preliminary study before scraping is compulsory\
  \ and is based on the structure of the website. Libraries such as PyQuery provide\
  \ the necessary tools and techniques to scrape effectively and efficiently.\n\n\
  ### Summary\n\nIn this chapter, we explored and learned about PyQuery, applying\
  \ various scraping techniques with examples. Short, simple code that is easy to\
  \ deal with is always in demand, and PyQuery provides and assists with this. PyQuery\
  \ supports CSS selectors and its applicability across various markup documents is\
  \ one of its major advantages. In the next chapter, we will learn more about web\
  \ scraping techniques and some new Python libraries.\n\n### Further reading\n\n\
  - PyQuery, a jQuery-like library for Python: https://pyquery.readthedocs.io/en/latest/\n\
  - jQuery: https://jquery.com/\n- CSS:\n  - https://www.w3.org/Style/CSS/Overview.en.html\n\
  \  - https://developer.mozilla.org/en-US/docs/Web/CSS\n- CSS selectors:\n  - https://www.w3schools.com/css/css_selectors.asp\n\
  \  - https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Selectors\n- JSON: https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Objects/JSON\n\
  - Sitemaps: https://sitemaps.org/\n"
- "## Scraping the Web with Scrapy and Beautiful Soup\n\nIn previous chapters, we\
  \ learned about web scraping-related technologies, data-finding techniques, and\
  \ using various Python libraries to scrape data from the web.\n\nIn this chapter,\
  \ we will explore and learn practically about two popular Python libraries, Scrapy\
  \ and Beautiful Soup. Scrapy is a web crawling framework for Python and provides\
  \ a project-oriented scope for web scraping. Beautiful Soup, on the other hand,\
  \ deals with document or content parsing. Parsing a document is normally done to\
  \ effectively traverse and extract content. Apart from this, both libraries are\
  \ heavily loaded with DOM-related features.\n\nIn particular, we will learn about\
  \ the following topics in this chapter:\n\n- Web parsing using Python\n- Web scraping\
  \ using Beautiful Soup\n- Web scraping using Scrapy\n- Deploying a web crawler\n\
  \n### Technical requirements\n\nA web browser (Google Chrome or Mozilla Firefox)\
  \ will be required and we will be using Python notebooks for the code using JupyterLab.\n\
  \nPlease refer to the Setting things up and Creating a virtual environment sections\
  \ in Chapter 2 to continue setting up and using the environment created.\n\nThe\
  \ Python libraries that are required for this chapter are as follows:\n\n- lxml\n\
  - urllib\n\n\n\n\n\n- `requests`\n- `html5lib`\n- `beautifulsoup4`\n- `scrapy`\n\
  \n本章的代码文件可在 GitHub 上在线获取：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter05\n\
  \n## 使用 Python 进行网页解析\n\n在之前的章节中，无论是在解释还是代码示例中，我们都了解到网页抓取是一种根据我们的需求和选择从网站中提取数据的流程。借助一些\
  \ Python 库，从编码角度来看，数据收集可以很顺畅且无错误，但至少需要识别内容并遍历元素 个别或嵌套 的，才能完成任务。\n\n为了确保收集到高质量的数据，网页上的内容必须完整且无错误。我们在\
  \ DOM 结构中使用基于 CSS 或 XPath 的表达式。如果 DOM 的结构不完善或包含错误，例如不完整的标签、缺少闭合标签或标签拼写错误，那么部署的代码表达式和查询路径将无法指向\
  \ DOM 的原始节点或元素。这将导致提取不完整或不必要的内容，这可能需要额外的任务，例如数据清洗或预处理，甚至拒绝数据，因为它不符合模式或数据验证规则。\n\n\
  网页解析，或更准确地说网页文档 如 HTML 或 XML 解析，是指分解、暴露或识别内容中元素、节点或 HTML 标签等组件的活动。网页解析是为了结构化网页内容并克服网页内容中非结构化数据元素的问题。解析很重要，因为它使遍历、搜索和从所需元素中收集信息变得更容易。使用有效的解析器\
  \ 对网页内容进行解析可使抓取任务更高效、更无忧。\n\n在第 3 章处理 lxml 和第 4 章使用 pyquery 时，我们使用了库提供的默认解析器。在第\
  \ 3 章中，我们还使用了一个特殊解析器来解析 robots.txt。\n\n> **重要说明**\n> \n> lxml 在 Python 中仍然被广泛使用，因为它具有各种基于\
  \ DOM 的功能。它是默认解析器，具有内存高效的功能并与其他库协作。有关 lxml 的更多信息，请访问 https://lxml.de/index.html。\n\
  \n在 Python 编程中，基于网页的文档解析任务主要由 Beautiful Soup 完成，也称为 bs4 Python 库。在下一节中，我们将进一步探索这个主题。\n\
  \n## 介绍 Beautiful Soup\n\nBeautiful Soup 是用于处理 HTML 和 XML 文档的 Python 解析库。它生成与 Python\
  \ lxml 库类似的解析树 使用 lxml.etree 和 ElementTree 等属性和类 ，该树进一步用于遍历、搜索和识别元素以提取数据并抓取网页。\n\
  \nBeautiful Soup 提供了使用 lxml 和 html5lib 库可用的相同解析相关功能。Beautiful Soup 中提供了大型、简单且易于使用的方法和属性来处理与\
  \ DOM 相关的活动。\n\nBeautiful Soup 相对于其他 Python 库的几个区别特征如下：\n\n- 它可以解析带有损坏、不完整、拼写错误或缺失标签的文档。\n\
  - 与其他解析器不同，它允许处理重复和多值属性。\n- 也可以仅解析内容中特定选定的部分或章节，从而节省内存和时间。\n- 文档编码会自动处理。编码细节也可以提供给\
  \ Beautiful Soup 构造函数。\n\n有关 Beautiful Soup 的更详细信息，请访问官方文档 https://www.crummy.com/software/BeautifulSoup/bs4/doc/。现在我们已在本节中介绍了\
  \ Beautiful Soup，我们将在即将到来的章节中安装并进一步探索它。\n\n## 安装 Beautiful Soup\n\n请参考本章中的 技术要求\
  \ 部分，以及 https://www.crummy.com/software/BeautifulSoup/bs4/doc/#installing-beautiful-soup\
  \ 链接来安装 Beautiful Soup。\n\n如图 5.1 所示，pip install beautifulsoup4 安装或更新 bs4 库及其依赖库，例如\
  \ soupsieve：\n\n```\n(secondEd) C:\\HOWScraping2E>pip install beautifulsoup4\nRequirement\
  \ already satisfied: beautifulsoup4 in c:\\how scraping2e\\seconded\\lib\\site-packages\
  \ (4.11.1)\nRequirement already satisfied: soupsieve>1.2 in c:\\how scraping2e\\\
  seconded\\lib\\site-packages (from beautifulsoup4) (2.3.2.post1)\n\n(secondEd) C:\\\
  HOWScraping2E>cd Chapter05\n\n(secondEd) C:\\HOWScraping2E\\Chapter05>jupyter-lab\n\
  ```\n\n图 5.1：安装 Beautiful Soup\n\n让我们验证 bs4 的安装和版本 完整代码可在 GitHub 上获取：https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter05/bs4_setup.ipynb：\n\
  \n```\nimport bs4\nbs4.__version__        # 4.11.1\ndir(bs4)\n# ['BeautifulSoup',\
