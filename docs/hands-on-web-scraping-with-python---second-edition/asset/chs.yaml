  \ Programming f... | 2019 | Independently Publis... | Jason Wes | |\n| Python for\
  \ Data Analysis | 2019 | Independently Publis... | Clark Wes | |\n| Python for Data\
  \ Analysis | 2012 | O'Reilly Media, Incor... | Wes McKinney | |\n| Python for Data\
  \ Science | 2019 | Independently Publis... | Jason Wes | |\n| Python Programming\
  \ L... | 2019 | Independently Publis... | Clark Wes | |\n| Python Para Análise d...\
  \ | Sep 07, 2000 | Novatec | Wes McKinney | |\n| Genuine _ use Python ... | Jan\
  \ 01, 2014 | Machinery Industry P... | MAI JIN NI (Wes McK... | |\n| Python Programming\
  \ f... | 2019 | Independently Publis... | Tony Wes | |\n| Python for Data Analys...\
  \ | Oct 20, 2017 | O'Reilly Media, Inc. | Wes McKinney | computers|data_mining|da...\
  \ |\n| Python for Data Analysis | 2019 | Independently Publis... | Tony Wes | |\n\
  \nFigure 7.5: Book details from the search API\n\n尽管 publish_date、publisher 和 author_name\
  \ 有多个值，但只收集找到的第一个数据。本示例中使用的 API 包含许多嵌套且相似的数据块。开发者有责任决定捕获哪些元素。\n\n## Example 3 –\
  \ US cities and time zones\n\n在本示例中，我们使用免费的 https://api.travelpayouts.com/data/en/cities.json\
  \ API。该 URL 包含全球城市及其坐标、国家和城市代码以及时区。API 的数据为 JSON 格式，转换为 Python dict 对象列表。有超过 9,000\
  \ 条记录。\n\n从全球记录中，我们只对美国的详细信息感兴趣。此外，经过简要分析，你会注意到美国城市存在不同的时区，因此我们将数据收集到两个数据集中。zone_america\
  \ 数据集包含时区包含单词 America 的记录，而 zone_not_america 数据集包含时区不包含单词 America 的城市记录，如以下代码块所示：\n\
  \n```\napiUrl=\"https://api.travelpayouts.com/data/en/cities.json\nresponse = requests.get(apiUrl).json()\
  \ # Load API\nzone_america=[] # time zone like \"America\"\nzone_not_america=[]\
  \ # time zone without word \"America\"\nfor info in response:\n    if info['country_code']==\"\
  US\" and \"America\" in\n    info['time_zone']:\n        zone_america.append([info['country_code'],\n\
  \        info['code'],info['name'],info['time_zone']])\n\n    if info['country_code']==\"\
  US\" and \"America\" not in\n    info['time_zone']:\n        zone_not_america.append([info['country_code'],\n\
  \        info['code'],info['name'],info['time_zone']])\n```\n\n根据前述代码中实现的条件，从迭代中收集数据。数据写入\
  \ zone_america.csv 和 zone_not_america.csv 文件：\n\n```\n# Write collected data to\
  \ CSV\nwriteto_csv(zone_america,'america_timezone.csv',['country_code','city_code','city_name','time_zone'])\n\
  writeto_csv(zone_not_america,'not_america_timezone.csv',['country_code','city_code','city_name','time_zone'])\n\
  ```\n\n收集的数据显示在 Figure 7.6 中：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_188_0.png)\n\
  \nFigure 7.6: US – time zones with city names and codes\n\n在本示例中，我们过滤 API 结果仅返回美国的城市，并按时区文本是否包含单词\
  \ America 进行过滤。将所需数据收集到 CSV 文件后，进行数据分析任务和数据可视化会容易得多。\n\n## Summary\n\nWeb APIs 为查找和抓取数据提供了许多好处。由于\
  \ API 返回的数据具有预定义格式，你无需使用 XPath 或 CSS 选择器执行额外的查询相关任务，从而节省时间。Web API 结构化、易于访问、可过滤，并且可随时在机器、平台和协议之间交换数据。\n\
  \n在下一章中，我们将学习使用 Selenium 进行自动化，并用它来抓取数据。\n\n## Further reading\n\n- APIs:\n  - https://restfulapi.net/\n\
  \  - https://developer.mozilla.org/en-US/docs/Web/API\n  - https://auth0.com/blog/developing-restful-apis-with-python-and-flask/\n\
  - JSON:\n  - https://www.json.org/json-en.html\n  - https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Objects/JSON\n\
  - HTTP methods: https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods\n- SOAP:\
  \ https://www.soapui.org/learn/api/soap-vs-rest-api/\n- REST:\n  - https://www.ibm.com/topics/rest-apis\n\
  \  - https://pythonbasics.org/flask-rest-api/\n\n\n\n\n"
- "## 使用 Selenium 进行网络爬取\n\n到目前为止，我们在第 1 章到第 7 章中学习了一些 Python 库、Web 和基于 API 的技术、数据查找与元素定位、提取技术以及大量与数据相关的服务。\n\
  \nSelenium 可以自动化浏览器——这句话引自 https://www.selenium.dev/，它主要是一组工具的集合，也被称为测试框架。Selenium\
  \ 用于自动化 Web（应用程序、网站表单等）以达到测试目的。除了使用自动化进行测试外，还有许多潜在的服务和基于任务的场景可以通过 Selenium 来执行和处理。Selenium\
  \ 框架由各种模块或组件组成。我们将使用 Selenium WebDriver。\n\n总的来说，我们将安装并学习 Selenium WebDriver，使用\
  \ WebDriver 自动化网站，并使用 Selenium 从 Web 上抓取数据。\n\n在本章中，我们将涵盖以下主题：\n- Selenium 简介\n\
  - 使用 Selenium WebDriver\n- 使用 Selenium 进行抓取\n\n### 技术要求\n\n你需要一个网页浏览器（Google Chrome\
  \ 或 Mozilla Firefox），我们将使用 JupyterLab 来运行 Python 代码。\n\n请参阅第 2 章的“环境设置”和“创建虚拟环境”部分，继续设置和使用所创建的环境。我们将使用\
  \ Google Chrome 和 Selenium WebDriver v4.10.0。\n\n要安装 `selenium` Python 库，以下链接会很有帮助：\n\
  - `https://selenium-python.readthedocs.io/installation.html`\n- `https://www.selenium.dev/documentation/webdriver/getting_started/install_library/`\n\
  - `https://pypi.org/project/selenium/`\n\n本章需要以下 Python 库：\n- `requests`\n- `selenium`\n\
  - `re`\n- `csv`\n- `json`\n\n本章的代码文件可在本书的 GitHub 仓库中在线获取：`https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter08`。\n\
  \n### Selenium 简介\n\n根据**系统开发生命周期（SDLC）**，对基于 Web 的应用程序或系统进行测试是强制性的，这一步骤在应用程序于 Web\
  \ 上发布之前完成。Selenium 是一个开源项目，它以网页浏览器作为自动化的接口，可用于与 Web 相关或基于 Web 的活动。\n\n使用 JavaScript（JS）、Cookie/会话、其他\
  \ JS 脚本以及许多其他 Web 组件的动态和安全 Web 应用程序，都可以借助 Selenium 进行处理、加工、自动化和爬取。*Selenium 是一个包含多种工具和库的综合性项目，用于支持和实现网页浏览器的自动化。*（`https://www.selenium.dev/documentation/overview/`）。虽然它主要用于基于浏览器的自动化，但凡是可以在浏览器中管理或使用的不同场景，都可以通过\
  \ Selenium 来解决。这使得 Selenium 成为最受欢迎且备受赞誉的基于浏览器的自动化工具。\n\nSelenium 主要用于 Web 测试。在接下来的章节中，我们将探讨\
  \ Selenium 的优点和用法，以及如何将其用于网络爬取。\n\n### Selenium 的优点与缺点\n\nSelenium 通过其组件之一 WebDriver\
  \ 支持不同的网页浏览器。有许多优点使 Selenium 广受欢迎，其中包括：\n- 易于实现\n- 支持跨浏览器\n- 开源且免费\n- 支持并行测试\n-\
  \ 支持多种**操作系统（OS）**\n- 支持多种语言（Java、Python、Ruby、PHP 等）\n- 拥有大量可用的文档和资源\n- 支持远程服务器和云设备\n\
  \n在应用程序测试中使用和实现 Selenium 有很多优势，但也存在一些限制或缺点：\n- 处理多个标签页和框架较为复杂\n- 执行速度较慢（取决于机器）\n\
  \n尽管 Selenium 提供了大量的优势和可扩展性，但与其一些竞争对手（**Playwright**、**Puppeteer**）相比，它在处理速度上较慢，而且其巨大的内存消耗仍然是一个值得争论的问题，这一话题常在\
  \ Web 相关的小组和社区中讨论。\n\n> **重要提示**\n> 有关一些精选自动化库和框架的更多详细信息，请参阅 Selenium https://www.selenium.dev/about/、Puppeteer\
  \ https://pptr.dev/ 和 Playwright https://playwright.dev/。\n\n### Selenium 的使用场景\n\
  \nSelenium 在项目中有许多使用场景。从网络爬取的角度来看，Selenium 既可用于普通场景，也可用于复杂场景。对于普通的抓取场景，我们完全可以使用前面在第\
  \ *2 章到第 7 章* 中学到的其他库和技术。\n\nSelenium 用于 Web 上的自动化和测试。在特定情况下，或者当其他库和技术无法完成抓取时，通常会优先选择使用\
  \ Selenium（很多时候甚至是最后的选择）。以下是可能需要使用 Selenium 完成抓取任务的一些情况：\n- 处理警报、iframe 和弹窗（有时间限制的）\n\
  - 收集和使用 Cookie 与会话\n- 处理滚动和点击活动（以应对网站上的反机器人措施）\n- 处理基于 JavaScript 的网站（具有动态值或动态元素的网站）\n\
  - 获取屏幕截图\n- 使用无头模式（减少资源消耗）\n- 绕过基本身份验证（隐藏或动态值）\n- 处理 HTML 表单\n- 执行和注入 JavaScript\
  \ 代码\n- 在页面上模拟人类操作\n\nSelenium 是一个框架，或者说是一组基于任务的模块（库）的集合。我们将在下一节介绍这些模块。\n\n### Selenium\
  \ 的组件\n\n基于 Web 的应用程序测试在开发周期的各个阶段都会进行，甚至会进行多次。这种类型的测试确保开发符合需求或按计划推进。它还有助于发现任何可能的缺陷或错误，并克服或记录它们。\n\
  \n通常，测试是手动（由用户）和/或使用自动化工具（如 Selenium）完成的。自动化测试和验证任务是应用程序生命周期的核心组成部分之一。Selenium 由以下三个主要组件或项目组成（https://www.selenium.dev/projects/）：\n\
  - **Selenium WebDriver**：这是一个面向对象（OO）的 API，也是用于自动化浏览器的主要组件之一。浏览器自动化是通过借助内置 API 和其他语言（Java、PHP\
  \ 和 Python）向第三方浏览器驱动程序（如 Google Chrome、Mozilla 和 Opera）提供命令来实现的。**WebDriver** 允许程序或脚本以原生方式访问浏览器，就像用户操作一样。对于与抓取相关的任务，我们通常会与\
  \ WebDriver 打交道，我们将在“使用 Selenium WebDriver”部分探讨其功能。有关 WebDriver 的更多详细信息，请访问此链接：https://www.selenium.dev/documentation/webdriver/。\n\
  - **Selenium IDE**：这是一个即装即用的浏览器扩展，也被称为 Selenium 的**用户界面（UI）**，用于记录用户在浏览器中的操作。IDE\
  \ 还提供了一个功能，可以回放已记录的操作，同时包含所部署的命令和带值的已定义参数。它还具有调试功能，如设置断点、通过 IDE 处理异常、创建可运行命令的脚本以及支持控制流结构。此扩展适用于\
  \ Google Chrome 和 Mozilla Firefox。有关 Selenium IDE 的更多详细信息，请访问此链接：https://www.selenium.dev/documentation/ide/。\n\
  - **Selenium Grid**：这允许跨多台机器、多种浏览器以及跨平台执行测试或自动化操作。Grid 还支持基于组件的配置，可部署在多台机器或平台上。基本上，Selenium\
  \ Grid 支持分布式测试。这有助于缩短测试时间，并行识别不同系统的性能问题。有关 Selenium Grid 的更多详细信息，请访问此链接：https://www.selenium.dev/documentation/grid/。\n\
  \n通过以上对 Selenium 的简要概述和介绍，我们将在下一节中安装 Selenium WebDriver，并通过代码和示例进行探索。\n\n### 使用\
  \ Selenium WebDriver\n\nSelenium 用于浏览器自动化，其重要组件之一 WebDriver 是访问浏览器的核心工具。WebDriver\
  \ 为选定的浏览器实现了自动化过程中所需的代码逻辑。它也是将 Selenium 框架与浏览器绑定在一起的核心系统，通常被称为 **Selenium 驱动** 或简称为\
  \ **driver**。更详细的信息，请访问此链接：https://www.selenium.dev/documentation/webdriver/getting_started/。\n\
  \n在深入了解自动化或使用该框架之前，让我们先在下一节安装所需的库。\n\n### 环境设置\n\n要使用 Python 和 Selenium WebDriver\
  \ 探索浏览器自动化，首先需要安装 `selenium` 库（一个 Python 库）以及与浏览器相关的驱动程序。\n\n> **重要提示**\n> Selenium\
  \ 是一个包含 WebDriver 等各类组件的框架，而 `selenium` 是一个 Python 库（https://www.selenium.dev/documentation/webdriver/getting_started/install_library/），我们使用它来编写和维护绑定\
  \ WebDriver 与所选浏览器的代码和逻辑。\n\n\n\n\n\n让我们先验证 selenium 库的设置：\n\n```\nimport selenium\n\
  selenium.__version__    # 4.10.0\nselenium.__spec__\nModuleSpec(name='selenium',.....\
  \ submodule_search_locations=['C:\\\\HOWScraping2E\\\\secondEd\\\\Lib\\\\site-packages\\\
  \\selenium'])\n```\n\n此代码块显示 Python selenium 库版本 4.10.0 已成功安装在我们的目标环境中（请参阅第 2 章的\
  \ Setting things up 和 Creating a virtual environment 部分）。\n\n在验证 Python 库之后，我们将在下一节中安装驱动程序（浏览器驱动程序）。\n\
  \n## 安装驱动程序\n\n在安装浏览器驱动程序之前，识别系统规范是必不可少的。为本书的目的，我们将使用 Windows 操作系统并选择 Google Chrome\
  \ 作为我们的浏览器驱动程序。\n\n> **重要说明**\n> Selenium 支持多种网络浏览器，例如 Firefox、Internet Explorer、Safari、Chrome\
