  \ 没有嵌套或数组结果。\n\n## 示例 3 – Open Library\n\nhttps://openlibrary.org/search.json?q=python&author=Wes\
  \ 使用两个参数提供已过滤的数据：q=python 和 author=Wes。我们正在查询 python 文本，作者的姓名为 Wes 或包含文本 Wes。Open\
  \ Library 是一个实验性搜索 API（https://openlibrary.org/dev/docs/api/search）。我们可以看到，在此示例中\
  \ URL 中没有提到术语 API。URL 看起来像是一个带有一些 GET 参数的常规 HTTP GET 请求。\n\n图 7.3 显示了结果，总计 11 个。每个结果都是\
  \ docs 块中发现的可能数组的元素。docs 中还有多个 key:value 对以及一些列表和数组实体，其中包含其中的一些项目。\n\n```\n{\n \
