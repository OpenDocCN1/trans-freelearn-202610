  \n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_26_0.png)\n\n我们将在即将到来的章节和第 3 章中探索并收集有关浏览器\
  \ DevTools 的更多信息。\n\n重要说明\n有关 cookie 的更多信息，请访问 About Cookies http://www.aboutcookies.org/\
  \ 和 All About Cookies http://www.allaboutcookies.org/。\n\n与 cookie 的作用类似，HTTP 代理在抓取中也很重要。我们将在下一节中探讨代理，也将在一些后面的章节中探讨。\n\
  \n\n\n\n\n## HTTP 代理\n\n代理服务器充当客户端与主 Web 服务器之间的中间服务器。Web 浏览器向服务器发送请求，这些请求实际上会通过代理传递，而代理则将服务器的响应返回给客户端。\n\
  \n代理通常用于监控/过滤、性能提升、翻译以及互联网相关资源的保护。代理也可以作为服务购买，这可能还用于处理跨域资源。代理实现也有各种形式，例如 Web 代理（可用于绕过\
  \ IP 封锁）、CGI 代理和 DNS 代理。\n\n你可以购买或与代理卖家或类似组织签订合同。他们会根据你运营的国家为你提供各种类型的代理。在爬取过程中频繁进行代理切换——代理允许我们绕过受限内容也是如此。通常，如果请求通过代理路由，我们的\
  \ IP 就会相对安全，不会被泄露，因为接收方在他们的详情或服务器日志中只会看到第三方代理。你甚至可以通过切换到不同的代理来访问在你所在位置不可用的网站（即你在本国会看到访问被拒绝的消息）。\n\
  \n使用 HTTP GET 请求传递的基于 Cookie 的参数、与 HTML 表单相关的 HTTP POST 请求，以及修改或适配头部，将在管理代码（即脚本）和在网页抓取过程中访问内容时至关重要。\n\
  \n> **重要说明**\n> 有关 HTTP、头部、Cookie 等的详细信息将在即将到来的章节 *Data-finding techniques used\
  \ in web pages* 中进一步探讨。请访问 MDN Web 文档中的 HTTP 页面（https://developer.mozilla.org/en-US/docs/Web/HTTP）以获取有关\
  \ HTTP 及相关概念的更详细信息。请访问 https://www.softwaretestinghelp.com/best-proxy-server/ 以获取有关最佳代理服务器的信息。\n\
  \n你现在已经了解了有关 HTTP 的一般概念（包括请求、响应、Cookie 和代理）。接下来，我们将了解用于创建 Web 内容或以某些预定义格式提供内容的[content]\n\
  \n## HTTP 代理\n\n代理服务器充当客户端与主 Web 服务器之间的中间服务器。Web 浏览器向服务器发送请求，这些请求实际上会通过代理传递，而代理则将服务器的响应返回给客户端。\n\
  \n代理通常用于监控/过滤、性能改善、翻译以及互联网相关资源的安全。代理也可以作为服务购买，这可能还用于处理跨域资源。代理实现也有各种形式，例如 Web 代理（可用于绕过\
  \ IP 封锁）、CGI 代理和 DNS 代理。\n\n你可以购买或与代理卖家或类似组织签订合同。他们会根据你运营的国家为你提供各种类型的代理。爬取时经常进行代理切换——代理也允许我们绕过受限内容。通常，如果请求通过代理路由，我们的\
  \ IP 相对安全且不会被泄露，因为接收方在其详情或服务器日志中只会看到第三方代理。你甚至可以通过切换到不同的代理来访问在你所在位置不可用的网站（即你在本国会看到访问被拒绝的消息）。\n\
  \n使用 HTTP GET 请求传递的基于 Cookie 的参数、与 HTML 表单相关的 HTTP POST 请求，以及修改或适配头部，将在管理代码（即脚本）和网页抓取过程中访问内容时至关重要。\n\
