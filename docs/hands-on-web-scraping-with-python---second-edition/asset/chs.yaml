  \n\n\n\n\n服务器会识别 cookie 的值，并根据存储在 cookie 中的信息与浏览器进行通信。cookie 中的数据帮助网站访问和传递诸如会话 ID、过期日期以及\
  \ cookie 信息存储时间等值。\n\n会话（session）或 Web 会话通常被标识为存储在服务器端（临时）的信息，它在用户与网站交互的整个过程中持续存在。\n\
  \n如图 2.24 所示，会话通常与用户在网站上的凭据相关联：\n\n```\nsession_obj = requests.Session()\n```\n\n\
  ```\nresponse_obj = session_obj.get('https://httpbin.org/cookies', cookies={'name':\
  \ 'anishchapagain','date':'30-dec-2022'})\nresponse_obj.text\n```\n\n'{\\n  \"cookies\"\
  : {\\n    \"date\": \"30-dec-2022\", \\n    \"name\": \"anishchapagain\"\\n  }\\\
  n}\\n'\n\n```\nresponse_obj.headers\n```\n\n{'Date': 'Fri, 30 Dec 2022 09:24:12\
  \ GMT', 'Content-Type': 'application/json', 'Content-Length': '88', 'Connection':\
  \ 'keep-alive', 'Server': 'gunicorn/19.9.0', 'Access-Control-Allow-Origin': '*',\
  \ 'Access-Control-Allow-Credentials': 'true'}\n\n```\nresponse_test = session_obj.get('https://httpbin.org/cookies')\n\
  response_test.text\n```\n\n'{\\n  \"cookies\": {}\\n}\\n'\n\n图 2.24：使用 `requests.Session()`\
  \ 对象发起 HTTP 请求\n\n## 重要说明\n\n在 HTTP 请求过程中，务必对从 DevTools 或代码输出中获取的 header、cookie\
  \ 和 session 值进行监控，并经常更新或替换为代理、header/cookie 键等值。在运行爬虫脚本时，使用这些更新后的值和键将有助于绕过服务器异常并检测机器人程序。有关会话和代理的更多信息，请访问\
  \ https://requests.readthedocs.io/en/latest/user/advanced/#advanced 。\n\n现在你已经对\
  \ HTTP 请求属性（如 cookie、header、session 和方法）有了基本了解。在下一节中，我们将重点讨论 URL 的内容，或者更准确地说，HTTP\
  \ 响应。\n\n## 响应内容\n\n我们可以使用 `content` 属性以字节形式接收页面或响应，或所请求 URL 的页面源码，而 `text` 属性则返回字符串对象，如图\
  \ 2.25 所示：\n\n```\nresponse.content[0:500] #content 500 Chars\n\nb'\\\\n<!DOCTYPE\
  \ html>\\\\n<html lang=\"en\">\\\\n  <head>\\\\n    <meta charset=\"utf-8\" />\\\
  \\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  \ />\\\\n    <meta name=\"generator\" content=\"Docutils 0.17.1: http://docutils.sourceforge.net/\"\
  \ />\\\\n    <title>Requests: HTTP for Humans\\\\x84&#8212; Requests 2.28.1 documentation</title>\\\
  \\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"_static/pygments.css\"\
  \ />\\\\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"_static/alabaster.css\"\
  \ />\\\\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"_static/ty'\n\nresponse.text[0:500]\n\
  \n'\\\\n<!DOCTYPE html>\\\\n<html lang=\"en\">\\\\n  <head>\\\\n    <meta charset=\"\
  utf-8\" />\\\\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  \ />\\\\n    <meta name=\"generator\" content=\"Docutils 0.17.1: http://docutils.sourceforge.net/\"\
  \ />\\\\n    <title>Requests: HTTP for Humans\\\\x84&#8212; Requests 2.28.1 documentation</title>\\\
  \\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"_static/pygments.css\"\
  \ />\\\\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"_static/alabaster.css\"\
  \ />\\\\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"_static/ty'\n```\n\
  \n此外，requests 还返回一个原始套接字响应，如图 *2.26* 所示。我们可以通过带 `stream` 参数的 `get()` 方法获取响应：\n\n\
  ```\nnew_response = requests.get(link,stream=True)\n\nnew_response.raw.read(200)\
  \ #first 200\n\nb'\\\\x1f\\\\x8b\\\\x08\\\\x00\\\\x00\\\\x00\\\\x00\\\\x00\\\\x00\\\
  \\x03\\\\x00\\\\x00\\\\x00\\\\xff\\\\xff\\\\xbc\\\\x...'\n```\n\n原始响应是尚未被自动转换或解码的字符字节。\n\
  \n在收到响应或页面内容后，大多数情况下将其保存到本地文件是相当有用的。这样做是为了研究内容，以揭示代码格式、确定 DOM 树结构或查找元素。如图 *2.27*\
  \ 所示，我们将这个本地文件命名为 `test.html`：\n\n```\nf = open('test.html','wb') #open the file\
  \ in 'w' mode\nf.write(response.content) #write response.content to the file\nf.close()\
  \ #close file handler\n```\n\n现在我们有了响应，并且它们保存在一个本地 HTML 文件中。该文件可用于分析 DOM 结构、查找与查询相关的模式以及许多其他用途。我们会遇到不同类型的\
  \ HTTP 响应（JSON、PDF、HTML 和 XML），下一节将帮助我们处理 JSON 响应。\n\n## 读取 JSON\n\nrequests 凭借其内置解码器非常高效地处理\
  \ JSON。你可以在图 2.28 中看到 `json()` 的用法：\n\n```\njson_response = requests.get(\"https://feeds.citibikenyc.com/stations/stations.json\"\
  ).json()\nfor i in range(5):\n    print(json_response['stationBeanList'][i]['stationName'])\n\
  ```\n\nW 52 St & 11 Ave\nFranklin St & W Broadway\nSt James Pl & Pearl St\nAtlantic\
  \ Ave & Fort Greene Pl\nW 17 St & 8 Ave\n\n图 2.28：加载和读取 JSON 内容\n\nWeb 抓取和爬行任务可能会使用前面提到的任何过程（HTTP\
  \ header、获取 cookie 信息、状态码，或将响应内容保存到本地文件）来进行 HTTP 通信以及收集或验证内容。大多数情况下，Python 库提供的方法和属性使事情变得方便而简单。原因如下：\n\
  \n- 某些库中用少量逻辑步骤（如带条件的循环）编写成的简短代码片段，这些片段在需要的地方发挥特定用途，并封装为函数，比过程式编码更方便使用。\n- 大多数新库通过嵌入和封装一个或多个函数来克服限制和逻辑约束，因为旧库中已有的新特性由最新库来管理。\n\
  - 新库中某些函数可能还有一些冗长且难以管理的额外功能。在这种情况下，开发者会选择使用旧库。\n\n在下一节中，我们将使用 requests 来实现 HTTP\
  \ GET 和 POST 方法。\n\n## 实现 HTTP 方法\n\n通常，网站与用户之间基于 Web 的交互或通信通过以下方式实现：\n\n- 1. 用户访问一个网页或浏览他们可获得的内容。\n\
  - 2. 然后，用户通过 HTML 表单向网站提交信息，例如搜索、登录、注册等，最终收到他们请求的内容。\n\n在本节中，我们将使用 Python requests\
  \ 库来实现适合上述场景的 HTTP 方法。\n\nGET 是默认的 HTTP 方法。类似地，我们还有 POST，它稍微更严格一些，将在下一节中进行说明。\n\n\
  ## POST\n\nPOST 请求被认为是向源或服务器发出的安全请求。被请求资源的状态也可能被更改。发布或发送到所请求 URL 的数据在浏览器中不可见（与 GET\
  \ 查询字符串不同）；相反，它会被传输到所请求的主体中。使用 POST 方法的请求无法被缓存或添加书签，并且在字符长度方面没有限制。\n\n在示例代码中，如图\
  \ 2.30 所示，使用了 `https://httpbin.org/post` URL（一个简单的 HTTP 请求和响应服务）来演示 POST 请求：\n\n\
  ```\n```python\npageUrl = 'http://httpbin.org/forms/post'\npostUrl = 'http://httpbin.org/post'\n\
  params = {'customer': 'Mr Anish', 'custtel': '', 'custemail': 'anish@anishchapagain.com',\
  \ 'size': 'medium', 'topping': ['cheese', 'mushroom'], 'delivery': '14:45', 'comments':\
  \ 'No comments'}\nheaders = {'accept': 'text/html, */*', 'referer': pageUrl}\n\n\
  response = requests.post(postUrl, data=params, headers=headers).json()\nprint(response)\n\
  ```\n```\n\n图 2.30：HTTP POST 请求\n\npageUrl 接受要发布的数据（由 params 定义），并发送到 postUrl。自定义\
  \ header 被分配给 headers。`post()` 函数接受几个参数：URL（例如 postUrl）、data（要发布的数据）以及 headers，并返回\
  \ JSON 格式的响应。\n\n图 2.30 中的 POST 请求代码自动化了 params 和 headers（部分地），并配合所需的 URL，就像我们在\
  \ http://httpbin.org/forms/post 上提交实际的 HTML 表单，并从浏览器将其发布到 http://httpbin.org/post\
  \ 一样。\n\n你也可以从浏览器手动执行相同的任务——打开 DevTools 并验证 Network 面板中使用的参数或 Payload，如图 2.31 所示：\n\
  \n\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_69_0.png)\n\n图 2.31：带有表单数据的 Payload（代码中使用的一个实际\
  \ params 键值对）\n\n如图 2.31 所示，表单数据与图 2.30 中的 params 类似。始终建议通过浏览器和 DevTools 学习、记录并检测任何站点的请求/响应序列。\n\
  \n我们可以从 DevTools 中获取大量信息，并使用这些信息来部署脚本和自动化流程。在当前场景中，图 2.32 显示了 Headers 中 General\
  \ 和 Request Headers 部分所包含的最大信息量：\n\n![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_69_1.png)\n\
  \n图 2.32：HTTP POST 请求中使用的请求 URL、方法和请求头\n\n本部分中的示例和图片涉及 HTTP POST 方法的功能，以及 POST 及提供给\
  \ POST 的参数与 GET 方法相比有何不同。实现 HTTP 方法是 HTTP 活动的核心。有关 HTTP 方法的更多详细信息，请访问 https://requests.readthedocs.io/en/latest/api/\
  \ 和 https://www.w3schools.com/tags/ref_httpmethods.asp。\n\n## 小结\n\n在本章中，我们学习了 Python\
  \ 编程、搭建虚拟环境，以及安装 Python 库来向 Web 资源发送请求并收集响应和其他一些信息。\n\n本章的主要目标是展示 requests 库的核心功能。我们的主要目标是学习如何处理\
  \ HTTP 请求和响应循环、如何使用 HTTP 方法（带额外参数）、如何使用 DevTools，以及在这个领域中使用 Python 的好处。\n\n在下一章中，我们将学习并使用一些基本技术，从\
  \ Web 内容中识别和提取数据。\n\n## 延伸阅读\n\n- **Python 编程：**\n  - https://www.python.org/doc/\n\
  \  - https://www.w3schools.com/python/default.asp\n- **数据与数据分析：**\n  - https://www.diesel-plus.com/the-importance-of-data-collection-10-reasons-why-data-is-so-important/\n\
  \  - https://www.simplilearn.com/data-analysis-methods-process-types-article\n \
  \ - https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8274472/\n  - https://scientific-publishing.webshop.elsevier.com/research-process/when-data-speak-listen-importance-of-data-collection-and-analysis-methods/\n\
  - **requests、urllib、JSON：**\n  - https://requests.readthedocs.io/en/latest/\n  -\
  \ https://pymotw.com/3/\n- **虚拟环境：**\n  - https://docs.python.org/3/library/venv.html\n\
  \  - https://docs.python-guide.org/dev/virtualenvs/\n  - https://conda.io/projects/conda/en/latest/user-guide/tasks/manage-environments.html\n\
  \  - https://docs.anaconda.com/free/navigator/tutorials/manage-environments/\n-\
  \ **Jupyter Notebooks：**\n  - https://jupyter.org/\n  - https://code.visualstudio.com/docs/datascience/jupyter-notebooks\n\
  - **Cookies：**\n  - https://www.cloudflare.com/en-gb/learning/privacy/what-are-cookies/\n\
  \  - https://www.cookieyes.com/blog/session-cookies/\n- **URL 和 HTTP：**\n  - https://blog.hubspot.com/marketing/parts-url\n\
  \  - https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview\n"
- '## 第 2 部分：

  开始 Web 爬取


  在本部分中，你将学习如何分析、规划和处理来自目标网站的所需或必需数据集合，将数据收集或写入所需的文件格式。你将使用 Python 及其选定的库来编写爬虫。本部分中的章节将介绍可以有效且高效完成的爬取实践的各个方面。


  本部分包含以下章节：


  - *第 3 章，搜索与处理 Web 文档*

  - *第 4 章，使用 PyQuery（一个类似 jQuery 的 Python 库）进行爬取*

  - *第 5 章，使用 Scrapy 和 Beautiful Soup 爬取 Web*

