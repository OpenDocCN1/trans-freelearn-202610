    \ the use of CSS selectors with bs4: `select()`, which is similar to `find_all()`,\
    \ and `select_one()`, which is similar to `find()`. For more information, please\
    \ visit https://www.crummy.com/software/BeautifulSoup/bs4/doc/#css-selectors.\n\
    \nWe looked at searching for elements in this section, which can also be used\
    \ for the purpose of iteration (please refer to the *Iteration* section). In the\
    \ next section, we will cover a combination of searching and traversing along\
    \ DOM content.\n\n# next_element and previous_element\n\nTraversing along a DOM\
    \ is quite effective when moving back and forth between an element. It is achieved\
    \ using `next_element` and `previous_element`. `next_elements` and `previous_elements`\
    \ can also be used to return multiple elements. Before we start to understand\
    \ traversing, understanding the concept of the parsed tree, or DOM tree, is very\
    \ important. The DOM tree normally reveals the HTML code structure, parent-child\
    \ tag combinations, and nested or chained tags."
  merge: -1
  img_proc: true
- pgno: 138
  md: "The following code shows the use of `next_element`. While traversing along\
    \ a DOM (normally from top to bottom), various elements can be found with `next_element`:\n\
    \n```\nsoup.find('p','story').next_element\n# 'Once upon a time there were three\
    \ little sisters; and\n#  their names were\\n '\n\nsoup.find('p','story').next_element.next_element\n\
    # <a class=\"sister\" href=\"http://example.com/elsie\"\n#  id=\"link1\">Elsie</a>\n\
    ```\n\nLet us understand the details of the preceding code:\n\n+   - `find('p','story').next_element`:\
    \ Searches for a `<p>` element for the story value in class, and points to the\
    \ next element. Here, the next element after `<p class=\"story\">` is the text\
    \ itself, as seen in the preceding code output.\n+   - `find('p','story').next_element.next_element`:\
    \ Points to the `<a>` child element with the text `Elsie`.\n\n`previous_element`\
    \ is similar to `next_element`, but the direction of traversing is reversed.\n\
    \nThe following code shows the use of `previous_element`, which can be extended\
    \ or chained:\n\n```\nsoup.find('b').previous_element\n# <p class=\"title\"><b>The\
    \ Dormouse's story</b></p>\n\nsoup.find('li',{'data-id':'45732'}).previous_element\n\
    \    .previous_element\n# 'Alex Trevelyan, 006: Agent turned terrorist leader;\n\
    #  James\\'... in \"Goldeneye\".'\n```\n\nRegarding the preceding code, let us\
    \ understand a few details:\n\n+   - `find('b').previous_element`: There’s only\
    \ one `<b>` element in the HTML content inside `<p>`, so it returns the element\
    \ at `previous_element` or `<p class=\"title\">`\n+   - `find('li',{'data-id':'45732'}).previous_element.previous_element`:\
    \ With `<li data-id=\"45732\">`, we find that the previous element is `<li data-id=\"\
    97865\">`, hence we get the text\n\nThe `next_element` and `previous_element`\
    \ attributes can be chained, as seen in the preceding code.\n\nWe have explored\
    \ a lot regarding searching and traversing so far in this section. The next section\
    \ demonstrates performing iteration."
  merge: -1
  img_proc: true
- pgno: 139
  md: "# Iteration\n\nWe have already come across the concept of iteration in previous\
    \ sections. For example, find_all(), next_elements, and previous_elements result\
    \ in one or more elements, where a loop can be used.\n\nThe following code iterates\
    \ on the child elements of the <ul> elements, which are <li> using find_all(),\
    \ and uses the name attribute to show the element name:\n\n```\nfor li in soup.ul.find_all('li'):\n\
    \    text = li.get_text().strip()\n    print(f\"{li.name} : {li.get('data-id')}\
    \ :\n        ({len(text)}) - {text}\")\n```\n\nSimilarly, the get_text() function\
    \ returns the text string of an element, and the get('data-id') function returns\
    \ the values of the data-id attribute. Printing all those return values with their\
    \ text lengths, the output looks as follows:\n\n```\nli : 10784 : (53) - Jason\
    \ Walters, 003: Found dead in \"A\n    View to a Kill\".\nli : 97865 : (82) -\
    \ Alex Trevelyan, 006: ...; James' nemesis\n    in \"Goldeneye\".\nli : 45732\
    \ : (54) - James Bond, 007: The main man; shaken\n    but not stirred.\n```\n\n\
    Various alternate mechanisms exist to perform iteration and the extraction process.\n\
    \nIn this and previous sections, we explored the main concepts related to BeautifulSoup.\
    \ We will scrape content using BeautifulSoup in the upcoming section.\n\n> **Important\
    \ note**\n> BeautifulSoup has various other methods related to the find activity,\
    \ such as find_all_next, find_next, and find_previous_siblings, to deal with parent-child\
    \ and traversing-related instances. There have been updates to the names and supporting\
    \ arguments of methods in bs4. For the complete and updated documentation, please\
    \ visit https://www.crummy.com/software/BeautifulSoup/bs4/doc/.\n\n# Web scraping\
    \ using Beautiful Soup\n\nIn this section, we will build and execute a web crawler\
    \ using Beautiful Soup. To set things up, we have chosen to scrape quotes from\
    \ http://quotes.toscrape.com. Specifically, we will be scraping from the page\
    \ http://quotes.toscrape.com/tag/inspirational, as seen in Figure 5.3:"
