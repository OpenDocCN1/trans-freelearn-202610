    Regex can be defined and run in most text-supporting applications or services.
    The quite simple, elegant-looking expressions can be used to deal with any type
    of use case. Its availability and scalability, depending on the content, make
    it a powerful text feature. Please visit https://www.regular-expressions.info/
    and https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_expressions
    for detailed information about regex.


