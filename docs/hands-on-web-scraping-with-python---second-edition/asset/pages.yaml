- pgno: 200
  md: "# Basic exploring\n\nIn the following code example, we will get an understanding\
    \ of a few basic activities using Selenium that are normally priority tasks:\n\
    \n```\nfrom selenium import webdriver\nfrom selenium.webdriver.chrome.service\
    \ import Service\nchromedriver_path=\"C:\\HOWScraping2E\\driver\\chromedriver.exe\"\
    \nservice = Service(service=chromedriver_path)\ndriver = webdriver.Chrome(service=service)\n\
    # chromedriver\n```\n\nHere, an empty, new Chrome window gets loaded similar to\
    \ the browser window shown in Figure 8.3.\n\nWe will now supply three different\
    \ URLs and iterate them by obtaining some information:\n\n```\nurls = {\n    'google':'https://www.google.com',\n\
    \    'python':'https://www.python.org',\n    'selenium':'https://www.selenium.dev'\n\
    }\n```\n\nNow, let's iterate items() in the urls dictionary:\n\n```\nfor key,url\
    \ in urls.items():    # iterate the urls items\n    driver.get(url)\n    driver.implicitly_wait(1)\
    \      # Wait 1 sec\n    print(driver.title)           # HTML <title>\n    print(driver.current_url)\
    \     # Current URL\n```\n\ndriver.get(url) loads the URL in the browser. The\
    \ implicitly_wait(1) method has been used as the sleep time, waiting for the allotted\
    \ 1 second before any further action is taken. The driver.title code returns the\
    \ <title> HTML value. driver.current_url reveals the redirect URL or the latest\
