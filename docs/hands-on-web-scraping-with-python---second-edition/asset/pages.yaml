    # Introduction to data mining


    The term “mining” normally means the extraction or the process of extracting something.
    Data mining is the process of extracting data or discovering information from
    data. Data mining is a growing and ever-developing concept that discovers hidden,
    unexpected, and other various forms of information from datasets or databases,
    which helps in KD and decision-making.


    In terms of data, mining is used as a form of analysis to discover patterns, hidden
    facts, and more. When knowledge is discovered using mining techniques, this is
    known as knowledge discovery in databases (KDD or knowledge discovery and data
    mining). There are plenty of terms used to describe data mining, such as KDD,
    information harvesting, pattern discovery from databases, and many more; although
    the final results are the same, these terms differ in the steps and processing
    architecture.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '**Important note**

    KDD is an almost cyclical process that has data mining as one of its major components.
    Various steps are used by KDD, such as data selection, cleaning, enrichment (preprocessing),
    coding and transformation, data mining, and reporting (interpretation and evaluation).
    The output from each step is processed as feedback or input for the next step
    until the required information or knowledge is obtained.


    Data analysis and data mining are subsets of data science and are often compared
    and treated as similar processes. Data mining is based on scientific and mathematical
    methods, whereas data analysis is done using analytical models and intelligence
    systems.


    Data mining is also considered a part of the data analysis process, but mining
    is normally done on structured data, whereas analysis can be done on structured,
    unstructured, and semi-structured data. Similar to KD and data analysis, “data
    warehouse” is a term that we often encounter while discussing data mining.


    A data warehouse is central storage for data of various types, such as recent,
    historical, and subject-oriented. Data in a data warehouse is used for decision
    support systems or queries. Hence, the availability and meaningful retrieval of
    data from data warehouses for the mining process significantly affects their usefulness.
    Although the use of data warehouses is common in data science, there is no exact
    or strict relationship between data mining and data warehouses. However, in the
    implementation phases related to mining, they prove to be valuable.


    **Important note**

    Query processing tools and data mining tools are also often used side by side.
    Data mining does not replace queries or tools related to querying; rather, it
    tops up the possible add-ons. In a normal scenario, using **structured query language
    (SQL)** is much harder than mining to find hidden knowledge from databases. In
    general practice, if we know what we are looking for, we will use SQL. Otherwise,
    we use data mining.


    Globally, there is a growing demand for information in various types and forms
    from systems and frameworks related to data mining. AI and ML are also largely
    used to facilitate the correct procedures, algorithms, and time-based information
    extraction. Data mining used to largely process only text content. Now, there
    are various types of content to be mined, such as images, audio, video, web content,
    and social media.


    Data mining is used to collect and discover new patterns and knowledge that describe
    data. We can use this along with some intelligent automated systems to predict,
    discover, and analyze data patterns, deal with large volumes of various types
    of data, and reduce the amount of time it takes to handle data.


    Normally, the goal of data mining is to extract hidden and unidentified information
    and knowledge from data. Tasks related to data mining are either predictive (prediction,
    analytics) or descriptive (description, modeling). There is a large number of
    techniques in both predictive and descriptive processes. In this section, we have
    chosen only a few techniques, which are important and in high demand.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Predictive data mining


    Predictive data mining primarily predicts unknown or future values. It uses statistical
    analysis to turn data into valuable information. Techniques that analyze data
    and predict output fall into this category and are as follows:


    +   - **Classification**: This is one of the most common mining techniques, and
    it classifies data into various categories based on some predictor variables,
    or predictors. Classification divides a dataset into subsets by applying algorithms.
    Classification generally classifies data into predefined categories.

    +   - **Regression**: This technique is used to predict, forecast, and analyze
    the relationships between variables. Some variables might be dependent on others
    and are called dependent variables. This technique helps in the analysis or prediction
    of dependent variable values when independent variables change. Normally, various
    regression methods (such as linear and multi-linear) establish a relationship
    or link between all types of variables.

    +   - **Prediction**: This technique analyzes past events and predicts future
    values. It is used to predict relationships between independent and dependent
    variables, and within these variables as well. It uses past or raw information
    from other techniques, such as classification and clustering.


    # Descriptive data mining


    Descriptive data mining finds interpretable or detectable patterns. Also, it is
    considered to be the preliminary stage of data processing. It analyzes past data
    and uses some of the techniques listed here:


    +   - **Clustering**: This technique groups items that are similar or possess
    similar characteristics. It divides data into clusters with similar content. It
    also tries to make the clusters as different as possible. Clustering and classification
    are similar, but they differ in that clustering finds and stores data clusters
    based on the data''s characteristics and not based on predefined characteristics.

    +   - **Summarization**: This technique provides a concise representation of a
    dataset, including generating reports and visualization. Summarization stores
    a descriptive summary that is easy to understand.

    +   - **Association rules**: This technique associates a number of variables in
    datasets. Association rules state a statistical correlation between certain attributes
    in a dataset. It helps with identifying relations (or associations) between two
    or more variables, which can help with finding hidden observations or patterns.
    This technique is commonly employed in market analysis.


    > **Important note**

    > Market analysis is a modeling technique used by retailers to find associations
    between items. For example, if a customer is buying item A, what other items might
    be bought?'
  merge: -1
  img_proc: true
- pgno: 243
  md: "Data mining is an important component in today’s organizations that uses analytics\
    \ or similar information for decision-making. Companies or organizations can predict\
    \ and collect information based on usage patterns of their clients or customers,\
    \ classify them, and generate information that will be helpful for management\
    \ and can be used in research, to predict client or customer behavior, to detect\
    \ fraud, in **business intelligence (BI)**, to form marketing strategies, in brand\
    \ management, for ML models, and much more.\n\nThere are also some steps in data\
    \ mining that need to be taken seriously and consistently, to prevent invalid\
    \ or incorrect interpretations and outcomes. The quality (clean, preprocessed,\
    \ filled, enriched, duplicates removed) and volume (daily, per transaction, time\
    \ series) of data drives the results.\n\nIn the next section, we will be exploring\
    \ how data is collected, stored, and read, and how the various file formats or\
    \ databases are chosen.\n\n# Handling collected data\n\nThe availability of data\
    \ is the main concern before attempting to process it for information and pattern\
    \ detection. Handling collected data normally refers to gathering data in files\
