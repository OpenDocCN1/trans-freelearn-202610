    \ URL).\n\nWith pagination loops, pageUrl is processed using requests and, finally,\
    \ a PyQuery object is generated called source:\n\n```\n```python\nresponse = requests.get(pageUrl+str(page)+\"\
    .html\")\nsource = pq(response.content)\nif page==1:\n    pageValues=[value.text()\
