- pgno: 270
  md: '# Types of data


    Data is a raw material that can be used to generate desirable output. Data can
    also be categorized. ML algorithms are also classified according to the types
    of data that are available in certain formats to them as input. There are not
    just basic data types such as numbers (integer, decimal, or complex) but also
    Booleans, strings, and more.


    It’s often the case as we progress through ML projects that we encounter the topic
    of data processing and data preprocessing. This aspect of data in ML is about
    preparing, cleaning, and organizing datasets, and even converting datasets into
    a certain format that is easily identifiable and ready to progress with building
    and training ML models. The process ensures the accuracy of the input and cuts
    down on the time that might have been consumed unnecessarily. In Chapter 10, similar
    topics were introduced with examples.


    Here, we are talking about data categories – though most AI and ML libraries and
    frameworks accept various types of data, providing them with the main type or
    the required type will enhance and ensure the desired outcome. Listed here are
    a few types of data:


    +   - **Quantitative**: Data that has numerical values – numbers that can be counted
    and measured. It plays an important role in statistical and data analysis projects’
    objective outcomes. Graphs such as scatter plots and line graphs are mostly used
    for visualization. Quantitative data can be of the following types:

    +     - **Discrete**: Includes countable whole numbers or concrete numbers. For
    example, the total number of players in a squad, female students in a class, or
    children in a house.

    +     - **Continuous**: Data might be complex, varying in nature over time, or
    infinite, and can be measured not counted. For example, height and weight, banks’
    interest rates, shoe size, or the temperature of the body.


    +   - **Qualitative**: Categories or groups of data that cannot be expressed in
    a numerical format. It is used most of the time for subjective outcomes, as this
    type of data expresses the qualities and characteristics of the data. Graphs such
    as bar charts, horizontal bar charts, and pie charts are mostly used to visualize
    such data. Qualitative data can be of the following types:

    +     - **Structured**: This data can be numbers but is not applicable to mathematical
    operations:

    +       - **Nominal**: Values in the form of labels where no order or ranking
    exists, for example, gender, religion, or country

    +       - **Binary**: Only two options are available, for example, yes or no,
    true or false, pass or fail, or good or bad

    +       - **Ordinal**: Countable but not measurable, with some associated order,
    for example, blood group, academic grades, ranking, or movie ratings

    +     - **Unstructured**: There’s no proper format, for example, images or sounds'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'Qualitative data collected from interviews and surveys is mostly unstructured,
    descriptive, and subjective in nature, which requires lots of interaction and
    interpretation. It is also difficult to collect (scrape) and store. Data lakes
    and non-relational **Database Management Systems (DBMSs)** are often prescribed
    to store such data. Coding with qualitative data is a challenge as it requires
    many rounds to process and understand the data.


    On the other hand, quantitative data is mostly structured, easily accessible,
    and storable in data warehouses and **Relational Database Management Systems (RDBMSs)**.
    It is also easy to code, search, and analyze.


    > **Important note**

    > From an analysis point of view, qualitative data is susceptible to many risk
    factors, if it is not processed and prepared in the correct way. There are ML
    and analysis libraries in Python that assist in converting and representing qualitative
    data as quantitative (using *deductive coding*, *inductive coding*, and various
    analysis methods such as *content analysis*, *thematic analysis*, *grounded analysis*,
    and *text vectorization*).


    In the next section, we will list Python libraries with scientific and statistical
    significance.


    # *Python for statistical and numerical computation*


    The development of ML-related algorithms and even models uses statistical and
    mathematical concepts. Python provides various in-built, installable, and open
    source modules for mathematical and statistical purposes.


    Listed here are a few important libraries from a statistical and mathematical
    perspective:


    +   - `numpy`: This Python library for numeric and scientific computation also
    deals with *n-dimension matrices, arrays, linear algebra*, and more. Please visit
    `https://www.numpy.org` for detailed information.

    +   - `statsmodel`: A library for *statistical computation, statistical modeling,
    testing hypotheses, data exploration, estimations*, and more. Please visit `https://www.statsmodels.org`
    for detailed information.

    +   - `scipy`: A Python library for scientific computation. `scipy` is used for
    *statistics, linear algebra, optimizing algorithms, n-dimension interpolations*,
    and more. Please visit `https://scipy.org` for detailed information.


    The libraries that we just listed are quite large – ever-growing – with in-depth
    coverage of features and functionalities in their respective profiles. There might
    also be some overlapping of certain common features among the modules, but developers
    will find such overlapping and similarities between libraries and will opt for
    the one that best suits their implementation.'
  merge: -1
  img_proc: true
