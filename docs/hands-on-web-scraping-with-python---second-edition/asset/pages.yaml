  md: '![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_80_0.png)


    Figure 3.3: XPath Expression – //food[price>1.99]/name


    As seen in Figure 3.3, the //food[price>1.99]/name expression is applied to the
    XML file in Figure 3.2.


    As seen in the following output, the XPath expression applied in Figure 3.3 returns
    only the name element of those food nodes where the predicate defined as [price>1.99]
    matches the price value greater than 1.99:


    ```

    <name>Brown Toast:Honey</name>

    <name>Oat:Pancake</name>

    <name>Creamy Yoghurt</name>

    ```


    A predicate is used to identify a specific node or element. They are written using
    square brackets, which are similar in syntax to Python lists. Here are a few XPath
    expressions with general explanations applied on the breakfast.xml file seen in
    Figure 3.2:


    +   - // : Document node

    +   - *: All elements in the document

    +   - //breakfast_menu: Root element and all elements within breakfast_menu

    +   - //food: Selects all food elements

    +   - //food/name: Selects the name element from all food elements

    +   - //food[1]/name/text(): Returns only the text from name of the first food
    element

    +   - //food[1]/name: Selects the name of the first food element, for example,
    <name>Brown Toast-Honey</name>

    +   - //food[2]/*: Selects all elements from food in the second position'
