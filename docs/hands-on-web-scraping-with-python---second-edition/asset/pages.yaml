- pgno: 275
  md: '# Classification


    Grouping, identifying, or categorizing a data model based on the attributes is
    known as classification. The classification technique normally involves an arrangement
    based on similarities or dissimilarities and is also known as the sorting technique.
    In this technique, categories or classification labels, also known as classes,
    are pre-determined or set in advance. The classification model identifies which
    category a dependent variable belongs to, based on the single or multiple independent
    variables.


    Some of the common classification algorithms are listed here:


    +   - **Linear classifier**: The simplest form of classification algorithm, it
    classifies a set of data based on a simple linear function, assuming data is distinguishable
    linearly by plotting a straight line on a graph.

    +   - **Support Vector Machine (SVM)**: A classifier that separates data into
    multiple sets, based on boundaries (hyperplanes), by detecting overlapping data.
    If the dimensions are greater than the number of samples, SVM can be used. The
    SVM algorithm creates points that are closest to the line from different dimensions
    called **Support Vectors (SVs)**. The SVM algorithm results in high accuracy,
    with a dataset that has less noise (overlapping). Outlier detection is one of
    the major advantages of the SVM algorithm. The SVM algorithm is not really suitable
    for large datasets, as the training complexity is high, and the model makes decisions
    on top of complex boundaries.

    +   - **K-Nearest Neighbors (kNN, k-NN, or KNN)**: KNN is known for its high accuracy.
    It stores available data, generates new data points based on the similarity, and
    finds the nearest neighbor. It calculates the *Euclidean distance* (between two
    points) on K number of neighbors. KNN is often used on top of large datasets.
    It is also a bit slow, as it has to generate and calculate distances between new
    data points.

    +   - **Decision tree**: This algorithm uses a set of rules to make decisions.
    Rules are set in the form of a tree structure that contains a *root (issue)*,
    *branches (decision rules or decision nodes)*, and *leaves (leaf nodes)* representing
    the outcome. A tree branch node can have multiple branches. Training datasets
    are broken down into many subsets by applying rules with categorical and quantitative
    data. Data in the tree must be numerical. It’s comparable to the thinking ability
    of humans and deeply nested if-elif statements in coding. A decision tree with
    a large number of branches is complex and time-consuming.

    +   - **Random forest**: This is a random collection of *decision trees* (a forest),
    where multiple results are combined into a single value treated as output. Random
    forest is also known as **ensemble learning**. It reduces overfitting, as the
    result is often an average value of decision trees. Because of its suitability
    for noisy datasets, scalability, low training time, and highly accurate results,
    it is used on large datasets.


    Classification learning can be applied in various situations; for example, images
    of clothes can be classified by color name, emails in an inbox can be classified
    as spam or not spam, or common diseases can be classified by studying symptoms.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Regression


    Regression estimates the relationship between variables. It is also known as a
    **predictive algorithm**. A regression model attempts to determine the strength
    of the relationship between dependent variables and one or more independent variables.
    The output variable in regression is generally a quantitative value. Normally,
    regression techniques are applied to make predictions from a given set of inputs
    called **predictors**. A strong statistical background is necessary to handle
    regression algorithms.


    Listed here are a few common types of regression algorithms:


    +   - **Linear regression:** Also known as **Simple Linear Regression (SLR)**,
    this is used to predict one (dependent variable) value based on the value of one
    independent variable. It finds the linear correlation between variables, using
    the best-fitting straight line. It is best for small datasets and results in continuous
    output.

    +   - **Multilinear regression:** Also known as **Multiple Linear Regression (MLR)**
    is a type of linear regression model. It models linear and non-linear relationships
    with more than one independent variable and one dependent variable. The output
    reflects the influence or relationship between multiple independent and single
    dependent variables.

    +   - **Logistic regression:** This is also known as a *statistical regression*
    model or probabilistic algorithm, which helps in analyzing datasets. This algorithm
    is used to find the best-fitting model that calculates the probability of binary
    types (such as yes and no). It also describes the relationship between diploid
    (the involvement of two possible outcomes) or dependent variables and sets of
    predictors. In terms of the number of variables, the algorithm describes the relationship
    between multiple independent and single dependent variables. This regression technique
    results in a discrete output and is used mostly with classification-related problems.

    +   - **Polynomial regression:** Polynomial regression describes *non-linear relationships*.
    Generally, if there’s no possibility of a linear relationship between dependent
    and independent variables, it might be a case of polynomial regression. Polynomial
    regression is also considered a special case of MLR. With a trained model, a non-linear
    equation is created and used for prediction.


    There are many more forms of regression learning. Measuring the effectiveness
    of algorithms is also quite challenging. A few techniques, such as **Ordinary
    Least Squares (OLS)** and **R-Squared (R2)**, are used to minimize the possibility
    of errors. OLS estimates the coefficients of linear regression. It minimizes the
    sum of squared residuals between actual and predicted values. R2, with values
    between 0 and 1, calculates the variation percentage of the dependent variable.
    The greater the value of R2, the better the model is.


    Regression-based learning can be used in cases such as weather forecasting, sale
    price prediction, house price prediction, and stock markets.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Important note


    There are a few supervised ML algorithms that can be used for both regression
    and classification. Logistic regression is most often used for classification-related
    problems. SVM, being a deep learning model, is used for both classification and
    regression. Similarly, algorithms such as random forest, kNN, and decision tree
    are also used for both types of supervised learning.


    Choosing the best learning model depends on the type of data, the volume of data,
    the correlation between columns of data, processing time, expected output, the
    inclusion of variation in data, and many more factors.


    With data collected using web scraping, a supervised form of ML is the most used
    format for analysis and decision-making. In the next section, we will explore
    unsupervised ML.


    # Unsupervised learning


    Unsupervised learning is effective in discovering trends and finding hidden patterns
    in data. In unsupervised learning, the algorithms are left to detect, explore,
    and learn on their own. There is nothing to supervise the learning process. This
    type of learning is beneficial in the field of data mining, and also when we are
    not sure of what we are looking for.


    In comparison to supervised learning, unsupervised learning tasks are complex,
    with many challenges. In unsupervised learning, time to prepare data and perform
    preliminary analysis is not required. Hidden or unknown patterns of data are exposed,
    which is not possible in supervised learning. Results from unsupervised learning
    might be low in accuracy, in comparison to supervised learning.


    Unsupervised learning is mostly divided into two parts:


    +   - Clustering

    +   - Association


    In the next section, types of unsupervised learning are introduced.


    # Clustering


    Clustering is a process of grouping, sorting, categorizing, and classifying data
    or objects. Classification models in supervised learning also group and categorize
    input objects. Classification models are provided with predefined categories or
    group names, whereas in clustering the groups or categories are generated after
    processing the data.


    Groups or clusters of data generated will contain data with similar characteristics
    and types. The flexibility of clustering is the most in-demand feature. Learning
    models, once trained, can be used in various other scenarios.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '**K-means clustering**, one of the most widely used clustering algorithms,
    demands the value of k. Here, k refers to the number of clusters that are to be
    created or the data that is to be divided and put into groups. It identifies a
    seed point as a centroid (mean point) in the current cluster and collects data
    in a cluster that is nearest to the centroid.


    Similar to kNN, distance measurement (*Euclidean*) is conducted between pieces
    of data or data points, and is used to create or separate clusters that are similar
    and dissimilar. kNN and k-means clustering are often categorized as search-based
    (learning) algorithms. The data points use themselves to find other data points.


    # Association


    Association helps to discover new patterns, find relationships in data, and produce
    information from large datasets. It identifies the frequency of patterns in a
    dataset. In addition, it maps the data based on its dependencies.


    Association, also known as **Association Rule Mining (ARM)**, tries to identify
    associations among dataset variables. One of the common algorithms used for ARM
    is **Apriori**, which discovers the most frequent data items in datasets and identifies
    associations and correlations among them. ARM is normally processed in large datasets,
    but is likely to carry lots of noise as there is the possibility of the number
    of associations being infinite. Most of the time, binary attributes such as yes
    and no are used to define association rules.


    Please refer to *Chapter 10* for more detailed information. In the next section,
    we will learn about the basics of the reinforcement type of learning.


    # *Reinforcement learning*


    This type of learning algorithm uses and recognizes its environment and learns
    the behaviors by accessing data patterns or trains its learning model based on
    trial and error (also known as the reward and punishment model). Reinforcement
    learning is about making decisions or learning actions (based on the situation)
    and their feedback, which results in the maximum reward.


    Reinforcement learning algorithms learn from a chain of action that is almost
    similar to decision tree processing. For example, situation-based input results
    in output that becomes input for the next cycle and so on, until a decision is
    made or obtained.


    **Reinforcement Agents (RAs)**, also called AI-driven systems, are self-trained
    and make the decision to resolve an assigned task based on the training data.
    To analyze or recognize situations, external agents and systems such as software
    (logs), system settings, browser-based extensions, cameras in machines, and more
    are used to find the most information possible about the situation.


    So far in this chapter, information regarding ML-related features has been explored.
    Now, we will build an ML model and use practical concepts of some ML types that
    can be applied for predictions and analyzing sentiments.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'In the next section, we will explore practical ML using Python programming.


    # ML using scikit-learn


    To develop a model, we need datasets. Web scraping is again the perfect technique
    to collect the desired data and store it in the relevant format. There are plenty
    of ML-related libraries and frameworks available in Python, and they are growing
    in number. scikit-learn is a Python library that addresses and helps to deal with
    the majority of supervised ML features.


    scikit-learn is also known and used as `sklearn`. It is built upon `numpy`, `scipy`,
    and `matplotlib`. The library provides a large number of features related to ML
    aspects such as *classification*, *clustering*, *regression*, and *preprocessing*.
    We will explore beginner and intermediate concepts of the *supervised learning*
    type with *regression* using scikit-learn. You can also explore the `sklearn`
    user guide available at https://scikit-learn.org/stable/user_guide.html.


    We have covered a lot of information about **regression** in previous sections
    of this chapter. Regression is a supervised learning technique that is used to
    make predictions based on labeled data. In the next sections, SLR is explored
    with a few examples.


    # Simple linear regression


    SLR is used to estimate the relationship between an independent variable and a
    single dependent variable. It is usually used as the default regression technique
    and is used to predict the value of one variable based on the value of another
    variable, which is also known as the predictor variable or input variable for
    SLR.


    We will now discuss certain SLR concepts using code. The code files can be found
    here: https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter11/Chapter11_regression.ipynb.


    The data (`Fish.csv`) used for the examples has been collected from **Kaggle**
    (https://www.kaggle.com/datasets/aungpyaeap/fish-market/download) and has been
    read to a DataFrame named `input` using pandas. For charts and graphs, `plotly`
    will be used.


    As seen in the following code, we import regular libraries such as `pandas`, `numpy`,
    and `plotly`. The `Fish.csv` data file has been read using the pandas method `read_csv()`,
    which will create a DataFrame type of object named `input`:


    ```

    import pandas as pd

    import numpy as np

