  md: 'can be obtained using data analysis. Data analysis is also treated as a subset
    of data science, and it has been booming with the use of Python and its features.


    In this section, we will be analyzing some datasets, exploring some of the important
    features of pandas, and visualizing the results using plotly.


    Analyzing data generally involves a few basic steps:


    +   1. **Identify**: Identify the source of data or the origin of data, such as
    a website, PDF file, or image.

    +   2. **Collect**: Collect the identified data using scraping or other techniques.
    Storing data is also important here.

    +   3. **Clean**: Preprocess and clean the collected data. Clean data is easier
    to process with statistical tools and is more likely to return accurate results.

    +   4. **Analyze**: Clean and collected data is processed with logical techniques,
    statistics, and qualitative and quantitative approaches. Obtained results are
    collected, stored, and visualized.

    +   5. **Interpret**: Visualized results are interpreted and a summary of the
    information is explored.


    There are various ways to analyze data. We will be using a reporting tool to explore
    the data we have in the next section.


    # Exploratory Data Analysis using ydata_profiling


    **Exploratory Data Analysis (EDA)** is a compulsory activity that has to be carried
    out on data that will be used for analysis. Performing and studying EDA reports
    can provide more information about the data, and can also provide a small amount
    of analyzed information. For simple datasets with clean, high-quality data, it
    might not be necessary to conduct further analysis by writing code, after doing
    EDA.


    In Python, EDA steps and processes used to involve writing code using various
    Python analysis libraries and graphing tools. There has been a lot of development
    in EDA; we now have a Python library called `ydata_profiling` that automatically
    creates a report based on the dataset provided. `ydata_profiling` is easy to use
    and helps with generating reports (HTML, embedded notebooks, and more) with just
    a few lines of code. Some of the benefits of using these EDA libraries are listed
    here:


    +   - Only a few lines of code need to be used

    +   - Ready-to-use generated reports

    +   - Provides detailed statistics on variables (`count`, `duplicate`, `missing`,
    `types`, `distinct`, correlation with other variables, and many more)

    +   - Provides filterable graphs for correlations, interactions, missing values,
    and more'
