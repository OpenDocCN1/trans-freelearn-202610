- pgno: 42
  md: 'For each of the filter options just listed, there are some child tabs for selected
    resources in the Name panel, which are as follows:


    +   - **Headers**: Loads HTTP/HTTPS header data for a particular request. A few
    important and automation-based types of data are also found, for example, request
    URL, method, status code, request/response headers, query string, payload, or
    POST information.

    +   - **Preview**: Provides a preview of the response found, similar to the entities
    viewed in the web browser.

    +   - **Response**: Loads the response from particular entities. This tab shows
    the HTML source for HTML pages, JavaScript code for JavaScript files, and JSON
    or CSV data for similar documents. It actually shows the raw source of the content.

    +   - **Initiator**: Provides the initiator links or chains of initiator URLs.
    It is similar to the the referer in the request headers.

    +   - **Timing**: Shows a breakdown of the time between resource scheduling, when
    the connection starts, and the request/response.

    +   - **Cookies**: Provides cookie-related information, its keys and values, and
    expiration dates.


    > **Important note**

    > The **Network** panel is one of the most important resource hubs. We can find/trace
    plenty of information and supporting details for each request/response cycle in
    this panel. For more detailed information on the **Network** panel, please visit
    https://developer.chrome.com/docs/devtools/network/ and https://firefox-source-docs.mozilla.org/devtools-user/network_monitor/.


    +   - **Performance**: Screenshots and a memory timeline can be recorded. The
    visual information obtained is used to optimize the website speed, improve load
    times, and analyze the runtime or overall performance.

    +   - **Memory**: Information obtained from this panel is used to fix memory issues
    and track down memory leaks. Overall, the details from the **Performance** and
    **Memory** panels allow developers to analyze website performance and embark on
    further planning related to optimization.

    +   - **Application**: The end user can inspect and manage storage for all loaded
    resources during page loading. Information related to cookies, sessions, application
    cache, images, databases on the fly, and more can be viewed and even deleted to
    create a fresh session.

    +   - **Security**: This panel might not be available in all web browsers. It
    normally shows security-related information, such as resources, certificates,
    and connections. We can even browse more about certificate details, from a few
    detail links or buttons available in this panel, as shown here in Figure 1.12:'
  merge: -1
