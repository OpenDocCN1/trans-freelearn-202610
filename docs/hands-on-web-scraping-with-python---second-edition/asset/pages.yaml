    The Unix/Linux-based grep (global regular expression print) command is very powerful
    and famous among Unix/Linux users and developers. grep is used to match and filter
    patterns and is even considered a pattern-matching engine. Please visit https://www.gnu.org/software/grep/
    for more detailed information.


    In the next section, we will be exploring regex in more detail and using the re
    Python library in a practical example.


    # Regex with Python


    Python programming is known for its simple, readable, reusable, and short code.
    Python is also popular because of its scientific computing and text computation
    features (**natural language processing (NLP)**, **sentiment analysis (SA)**,
    and many more). Regex is also one of the core powers of Python as re (the regex
    library) is provided as a system or built-in library that is available with Python
    installation.


    Let’s dive deep into re and have a look at some of the features using code. For
    this example, we will use the following famous quote from Sadhguru (available
