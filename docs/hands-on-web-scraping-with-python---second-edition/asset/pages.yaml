  md: '**Important note**

    It''s also an important factor to consider that, in the current case, only the
    `Cookie` header value was sufficient for successful form submission. There are
    plenty of other keys inside HTTP headers (such as `Accept`, `Origin`, `Host`,
    and `User-Agent`) that are also important and must be passed along with HTTP GET
    or POST parameters for successful form submission.


    Apart from the form elements, HTTP headers and cookie values do play a significant
    role in form submission, and even in receiving the expected response from the
    processed link. In the next section, we will introduce and learn how to use the
    HTTP proxy.


    # Using proxies


    A proxy (HTTP proxy or web proxy) is considered middleware for the web. A proxy
    is a gateway that is used to communicate between a client and a server. Put simply,
    a proxy is an **Internet Protocol (IP)** address with some random ports assigned
    to it. On the web, an HTTP request starts from the client end with its own IP,
    which, when routed through the proxy, gets updated as a new IP and is then forwarded
    to the actual destination looking for a response. So, a proxy here works as a
    transport layer that resides between the client and the server or destination.


    On the internet, there are plenty of services (paid and free) offered by various
    organizations providing proxies that work as a filter layer for their customers
    and deal with different kinds of security-related threats, malware, content filtering,
    spy protection, and many other activities. There are plenty of benefits to using
    proxies; a few of them are listed here:


    +   - **Privacy**: The destination server does not identify the actual client.
    Privacy issues are mitigated as the client has initiated a request using the web
    proxy.

    +   - **Security**: With privacy in mind, client information is not shared with
    the end location, which is the server. Security features are implemented, such
    as blocking the scope of multiple related requests and blocking and blacklisting
    the IP for a certain duration.

    +   - **Content filter**: Along with security and privacy, the proxy server or
    middle parties act as middleware between the client and server. In this process,
    middle parties can act as a secure layer that filters out content to the client
    based on some preconfigured settings. For example, parents can use settings regarding
    the content that''s being delivered to their child (based on age, movie certificates,
    and many more factors). In addition, such a facility provides security to the
    end user against malware, spyware, geo-location-related spam, and anything that
    is detected as harmful or could be harmful to the client machine.

    +   - **Speed**: Most proxy providers use their servers to accept client requests
    and perform a task on their behalf. These servers also possess in-built cache
    management systems that transfer the content immediately back to the client if
    it already exists in the cache. This speeds up the time taken for requests and
    the response cycle.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Using proxies or involving them in scraping tasks or projects is considered
    a performance enhancer and is used to tackle or bypass web-related security measures
    (such as CAPTCHAs), IP blockage, geo-location barriers (some sites, for example,
    US-based government or organization sites demand a US IP; otherwise, access to
    the site is denied), and plenty more.


    An HTTP proxy hides the client IP address from the server. For example, when the
    client IP address 192.168.0.1 passes or uses a proxy, it is converted to 11.xyz.4x.y2,
    or something similar, which then forwards the request to the server. In this case,
    the server identifies that the request is coming from 11.xyz.4x.y2 and not 192.168.0.1.


    In the *User authentication and cookies* section, we came across the need for
    HTTP headers in making requests. Web proxies are used to generate random HTTP
    headers (combining different header keys, such as User-Agent, Accept, Origin,
    and Referer), which, when processed, act like an entirely new request to the server,
    and the proxies completes the associated tasks successfully (most of the time).


    > **Important note**

    > It''s a widely accepted fact among developers that forwarding a random combination
    of HTTP headers, with or without proxies, to HTTP requests will work most of the
    time as it will bypass certain web-based imposed restrictions.


    From a scraping perspective, proxies are mostly divided into two types:


    +   - **Residential proxy**: These are considered the best, safest, and most reliable
    among the proxy types. These are most often the IP addresses of real devices,
    which are difficult to detect as fake IPs or proxy addresses. The server or end
    user''s machine generally treats requests from such proxies as being genuine and
    does not promptly respond with security measures. These are very costly in comparison
    to other types of proxies, and many providers put conditions in place, such as
    limits on the number of attempts, the usage per hour or per day, and the total
    consumption of bandwidth.

    +   - **Rotating or rotational proxy**: A rotating proxy, sometimes also known
    as a **data center proxy**, is normally considered to be a group of various types
    of proxies (*residential, shared, public, freely available*, and many more). If
    any address is blocked, then some other address is forwarded. The server or end
    machine will treat the request as new and from a different client, which bypasses
    certain restrictions. Because plenty of proxy types are mixed, the chances of
    a device being recognized by the server as an agent or proxy are not high for
    this type.'
  merge: -1
  img_proc: true
