- pgno: 302
  md: 'pyspark is known for its lazy computation and analyzing big data and is supported
    by Spark functionalities such as the following:


    +   - In-memory processing

    +   - Using Structured Query Language (SQL) on DataFrames

    +   - Using the pandas API

    +   - The inbuilt MLlib ML library

    +   - Computational speed

    +   - Fault tolerance


    PySpark also uses the Python pandas API, so most of the activities that can be
    done using pandas are applicable using PySpark, with the additional added benefits
    and facilities of Apache Spark. Generally, for large datasets, PySpark is very
    effective. PySpark’s features can also be used independently, such as only for
    data analysis, using ML, distributing datasets into chunks, and merging selected
    chunks of a dataset.


    PySpark, like pandas and other Python libraries, can be used for visualization,
    data cleaning, data formatting, data sampling, and more. Spark DataFrames possess
    similar attributes to those in pandas, and have many advanced functionalities
    implementing various features of the Spark framework. Please visit https://spark.apache.org/docs/latest/quick-start.html
    and https://sparkbyexamples.com/ for more details.


    In the next section, we will look into a Python library that is rising in popularity
    due to its processing speed.


    # polars


    The polars (https://www.pola.rs/) Python library is a data analysis library considered
    to be one of the fastest DataFrame libraries. Built using the Rust programming
    language, polars is designed for faster and more efficient computing. polars has
    been found to be more effective compared to Python’s pandas while working with
    large datasets.


    Code written in polars is a bit longer and not quite as readable as in pandas.
    Listed here are a few benefits of polars, which make it favorable over other data
    analysis libraries:


    +   - Graphics processing unit (GPU) integration

    +   - Lazy evaluation (executing only when required)

    +   - Parallel processing of operations

    +   - Online analytical processing (OLAP) query engine implemented in Rust

    +   - Single instruction, multiple data (SIMD)-based vectorization (processing
    of multiple datasets with a single instruction) implemented by modern processors'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'polars uses Apache Arrow, or Arrow (https://arrow.apache.org/), arrays, whereas
    pandas uses NumPy arrays. Arrow uses a language-independent columnar memory format
    for data.


    Arrow recommends Apache Parquet (https://parquet.apache.org/), a file format that
    implements data compression and encoding schemes. The use of Parquet is growing
    rapidly, as it is fast in comparison to CSV and JSON, and supports storing data
    in a columnar format. One of the major benefits of Parquet files is in data loading;
    they allow columns to be accessed without having to load the whole data structure.
    Arrow is also compatible for use or implementation with pandas, NumPy, PySpark,
    and more.


    **Important note**

    PyArrow is a Python library that implements Arrow. Arrow can be integrated with
    built-in Python objects, such as NumPy and pandas. Arrow manages data and data
    types in the same array, and the data in arrays is grouped to create tables. PyArrow
    implements data as a table. Each array represents data in columns of a table.
    PyArrow is also integrated into pandas through the ExtensionArray interface. It
    also enables the reading and writing of a table to a DataFrame and vice versa.


