    As seen in the following code, the required links are defined. We now need to\
    \ collect form-related data from the HTML form available at loginUrl (as seen\
    \ in Figure 6.7):\n\n```\nimport requests\nfrom pyquery import PyQuery as pq\n\
    baseUrl=\"http://quotes.toscrape.com/\"  # main URL\nloginUrl=\"http://quotes.toscrape.com/login\"\
    \ # POST URL (Credentials and results)\n\nlogoutUrl=\"http://quotes.toscrape.com/logout\"\
    \n```\n\nTo process the login step, we have the necessary URLs already declared.\
    \ In the following code, we have defined the user and passw variables with some\
    \ test values. These two values are there to be submitted in the payload. loginUrl\
    \ has been processed, and we have collected the values for csrf_token, username,\
    \ and password:\n\n```\nuser = \"test\"\npassw = \"password\"\nhtml = requests.get(loginUrl)\
    \  # load loginUrl\nresponse = pq(html.content)\n# collect <form> data, required\
    \ for submission\n\ncsrf = response.find('form:first input[name=\"csrf_token\"\
    ]')\n    .attr('value')\nusername = response.find('input[id=\"username\"]')\n\
    \    .attr('name')\npassword = response.find('input[id=\"password\"]')\n    .attr('name')\n\
    ```\n\nWith the form data in hand, payload information is to be created: payload\
    \ = {\"csrf_token\":csrf, username:user, password:passw}. This payload will be\
    \ submitted to the path mentioned in the form attribute named action or loginUrl,\
    \ in this case. Upon investigation (using DevTools), it looks like loginUrl is\
