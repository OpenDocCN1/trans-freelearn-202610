  md: '# Technical requirements


    We will be using Python 3.11.1 installed on Windows. There are plenty of choices
    for code editors; choose one that is convenient for you to use and can deal with
    the libraries used in this chapter’s code examples. We will be using Notebooks
    and JupyterLab from Jupyter (https://jupyter.org/), Integrated Development and
    Learning Environment (IDLE) (the default editor from Python), and Windows’ Command
    Prompt (cmd) side by side.


    To follow along with this chapter, you will need to install the following applications:


    +   - Python 3.11.* or the latest version appropriate for your OS from https://www.python.org/downloads/

    +   - The pip Python package management tool (https://pypi.org/project/pip/)

