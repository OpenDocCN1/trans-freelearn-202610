- pgno: 77
  md: '# The Document Object Model (DOM)


    A **tree-type structure** or an element tree is a base model for most markup languages
    and is often known as the DOM. Please visit these links for more details on the
    DOM: https://www.w3.org/TR/WD-DOM/introduction.html and https://developer.mozilla.org/en-US/docs/Web/API/Document_Object_Model.


    DOM processing, DOM parsing, DOM manipulation, and many more similar terms refer
    to activities related to the DOM. With the help of the DOM and its defined conventions,
    we can access, traverse, and manipulate markup documents. Plenty of web-related
    technologies support DOM usage, such as **JavaScript (JS)**, template engines,
    and web page development tools.


    DOM elements (tags or nodes) are predefined or user-defined most of the time.
    We can find open and closed types of conventions used in markup documents. Elements
    are structured or nested inside parent elements and might be the parent or child
    of some other elements too. This tree-like structure made up of DOM elements is
    based on a language or convention and can be used to build markup documents, as
    seen in Figure 3.1:


    ![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_77_0.png)


    Figure 3.1: HTML DOM tree structure


    Understanding the DOM or element tree (HTML tree or XML tree) is a basic step
    toward understanding the document as a container of elements and following the
    extraction process. Information can be found nested inside a tree structure and
    could possess additional information along with attributes representing the content.
    Refer to the *HTML section of Chapter 1* for more details.


    XPath and CSS selectors are used to navigate along the DOM and are used to search
    for the desired content in nodes or elements found. We will explore XPath in the
    next section.'
  merge: -1
  img_proc: true
