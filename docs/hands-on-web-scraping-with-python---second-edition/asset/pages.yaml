- pgno: 204
  md: 'Importing or using the By class (from selenium.webdriver.common.by import By),
    various locators and attributes can be found. A few of them are as follows:


    +   - By.ID: Find elements with the id attribute, used as driver find_element
    (By.ID, "numb1") for <span id="numb1">

    +   - By.XPATH: Find elements by providing XPath expressions, for example, driver.find_element
    (By.XPATH, "[id=''demo'']")

    +   - By.NAME: Find elements with the name attribute, for example, driver.find_element
    (By.NAME, "first_name")

    +   - By.TAG_NAME: Find elements with a tag name, for example, driver.find_element
    (By.TAG_NAME, "h2")

    +   - By.CLASS_NAME: Find elements with the class attribute, for example, driver.find_element
    (By.CLASS_NAME, "email")

    +   - By.CSS_SELECTOR: Find elements using CSS selector expressions, for example,
    driver.find_element (By.CSS_SELECTOR, ".completed > h2")

    +   - By.LINK_TEXT: Find elements from the links available and those that match
    the complete string provided, for example, driver.find_element (By.LINK_TEXT,
    "Childrens") will match the anchor tag or <a> that has the "Childrens" text

    +   - By.PARTIAL_LINK_TEXT: Find elements from the links available and those that
    match a part or portion of the string provided, for example, driver.find_element
    (By.PARTIAL_LINK_TEXT, "click") will match the anchor tag or <a> that contains
    the text (or portion of the text) click


    For more information about XPath and CSS Selector, please refer to the Introducing
    XPath and CSS Selector to process markup documents section of Chapter 3. Along
    with locators, there are also many supporting methods and attributes. Some of
    the common ones and their examples are as follows:


    +   - text: Extracts or copies the content. For example, the num1 = driver.find_element
    (By.ID, "numb1").text code will extract the content from elements with id="numb1".

    +   - tag_name: Returns the HTML tag name from the provided locator. For example,
    driver.find_element (By.ID, "numb1").tag_name will return the tag name that is
    being referenced by the id="numb1" locator.

    +   - click(): Performs interactions on a web page such as mouse clicks. For example,
    driver.find_element (By.ID, "demo").click() will click the element with id="demo".

    +   - clear(): Cleans or clears out the text from editable elements. For example,
    driver.find_element (By.NAME, ''first_name'').clear() will clean the text or values
    if available with <input name=''first_name''>.'
  merge: -1
  img_proc: true
