- pgno: 145
  md: "The scrapy genspider booklist books.toscrape.com command creates a spider named\
    \ booklist.py inside the bookScrapy\\books\\spiders subfolder, with books.toscrape.com\
    \ set for the allowed_domains argument:\n\n```\nimport scrapy\nclass BooklistSpider(scrapy.Spider):\n\
    \    name = \"booklist\"\n    allowed_domains = [\"books.toscrape.com\"]\n   \
    \ start_urls = [\"http://books.toscrape.com/\"]\n    def parse(self, response):\n\
    ```\n\nAs seen in the preceding code, the newly created booklist.py spider contains\
    \ the default code. To develop a crawler, we have to implement the necessary code\
    \ and logic in the booklist.py file using parse(). The bookScrapy\\books folder\
    \ also contains a few additional files: items.py, middlewares.py, pipelines.py,\
    \ and settings.py, along with the spiders folder.\n\n> **Important note**\n> Spider\
    \ is a Python class file that contains code used for scraping and data collection\
    \ logic. Multiple spider classes can exist targeting specific scraping activities.\
    \ The spider class is used in the crawling process. Commands such as scrapy list\
    \ and scrapy list spider list the spiders of a project. Please visit https://docs.scrapy.org/en/latest/intro/tutorial.html?highlight=Spider#our-first-spider\
    \ for more information.\n\nEach of these files has its own control and implementation\
    \ over the final crawler. The following are brief explanations of these files:\n\
    \n+   - items.py: An item is like a Python dictionary that holds keys and values\
    \ (column and value). For more details, visit https://docs.scrapy.org/en/latest/topics/items.html.\n\
    +   - pipelines.py: After collecting data, scraped items are sent to the pipeline\
    \ to perform additional actions, such as cleaning and dropping. For more details,\
    \ please visit https://docs.scrapy.org/en/latest/topics/item-pipeline.html.\n\
    +   - settings.py: Project-related settings can be controlled and added. For more\
    \ details, please visit https://docs.scrapy.org/en/latest/topics/settings.html.\n\
    +   - middlewares.py: We can specify some hooks or extensions that can perform\
    \ additional tasks with spiders (processing inputs and output). Visit https://docs.scrapy.org/en/latest/topics/spider-middleware.html\
    \ for more details."
  merge: -1
  img_proc: true
- pgno: 146
  md: "> **Important note**\n> Dealing with or updating the files we just mentioned\
    \ is not compulsory. These files are there to implement a full-fledged crawling\
    \ project, by allowing users to use the in-depth facilities and variations provided\
    \ by Scrapy.\n\nWe now have the project and default spider files ready to begin\
    \ coding or further processing. In the next section, we will be dealing with `scrapy.Item`\
    \ using the `items.py` file.\n\n# Creating an item\n\nAn item is normally understood\
    \ as a column name or key for a dictionary object that is used to collect values\
    \ to implement in the spider. The `items.py` file contains a default class that\
    \ implements `scrapy.Item`. This class (`BooksItem`) is generated during the processing\
    \ of the `scrapy startproject` command.\n\nThe following code block explores the\
    \ BooksItem item class with a `scrapy.Field()` type of object associated with\
    \ it:\n\n```\nimport scrapy\nclass BooksItem(scrapy.Item):    # define the fields\
    \ for\nyour item here like:\n    title = scrapy.Field()\n    no_review = scrapy.Field()\n\
    \    ...\n    url = scrapy.Field()\n    image = scrapy.Field()\n```\n\nAs per\
    \ our crawler plan, `items.py` will contain the default object of `scrapy.Field()`.\
    \ These fields will get their values from the spider or `spiders\\booklist.py`,\
    \ as we'll discover in the next section.\n\n# Implementing the spider\n\nWith\
    \ the planning and collection of items ready, we will implement the spider to\
    \ use `items.py` and further proceed with the code implementation. The code is\
    \ available on GitHub: https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/blob/main/Chapter05/bookScrapy/books/spiders/booklist.py.\n\
    \nCrawling-related logic and code is provided by the `parse()` function, which\
    \ is present in `booklist.py`, as follows:\n\n```\ndef parse(self, response):\n\
    \    listings =\n        response.xpath(\"//article[@class='product_pod']\")\n\
    ```"
  merge: -1
