- pgno: 127
  md: '# Scraping the Web with Scrapy and Beautiful Soup


    In previous chapters, we learned about web scraping-related technologies, data-finding
    techniques, and using various Python libraries to scrape data from the web.


    In this chapter, we will explore and learn practically about two popular Python
    libraries, Scrapy and Beautiful Soup. Scrapy is a web crawling framework for Python
    and provides a project-oriented scope for web scraping. Beautiful Soup, on the
    other hand, deals with document or content parsing. Parsing a document is normally
    done to effectively traverse and extract content. Apart from this, both libraries
    are heavily loaded with DOM-related features.


    In particular, we will learn about the following topics in this chapter:


    +   - Web parsing using Python

    +   - Web scraping using Beautiful Soup

    +   - Web scraping using Scrapy

    +   - Deploying a web crawler


    # Technical requirements


    A web browser (Google Chrome or Mozilla Firefox) will be required and we will
    be using Python notebooks for the code using JupyterLab.


    Please refer to the Setting things up and Creating a virtual environment sections
    in Chapter 2 to continue setting up and using the environment created.


    The Python libraries that are required for this chapter are as follows:


    +   - lxml

    +   - urllib'
  merge: -1
  img_proc: true
- pgno: 128
  md: "+   - `requests`\n+   - `html5lib`\n+   - `beautifulsoup4`\n+   - `scrapy`\n\
    \nThe code files for this chapter are available online on GitHub: https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter05\n\
    \n# Web parsing using Python\n\nIn earlier chapters (in both the explanations\
    \ and code examples), we learned that web scraping is a procedure for extracting\
    \ data from websites, as per our requirements and choice. Data collection can\
    \ be smooth and error-free from a coding perspective with the use of some Python\
    \ libraries, but still, identifying content and traversing through elements (individual\
    \ or nested) are required, at a minimum, to carry out the task.\n\nTo ensure high-quality\
    \ data is collected, the content on the web must be complete and error-free. We\
    \ use CSS or XPath-based expressions in the DOM structure. If the DOM’s structure\
    \ is somehow imperfect or it contains bugs, such as incomplete tags, missing closing\
    \ tags, or spelling errors in tags, then the code expressions and query paths\
    \ that are deployed will not be directed to the original nodes or elements of\
    \ the DOM. This will lead to the extraction of incomplete or unnecessary content,\
    \ which might then require extra tasks, such as data cleaning or preprocessing,\
    \ or even rejecting the data as it does not comply with the schema or data verification\
    \ rules.\n\nWeb parsing, or more precisely web document (such as HTML or XML)\
    \ parsing, refers to the activity of breaking down, exposing, or identifying components\
    \ such as elements, nodes, or HTML tags in content. Web parsing is done to structure\
    \ web content and overcome the issue of unstructured data elements in web content.\
    \ Parsing is important because it makes it easier to traverse, search, and collect\
    \ information from the desired elements. Using effective parsers (tools used to\
    \ parse) on web content makes the scraping task more efficient and trouble-free.\n\
    \nWhile dealing with lxml in Chapter 3 and pyquery in Chapter 4, we used the default\
    \ parser provided by the libraries. In Chapter 3, we also used a special parser\
    \ to parse robots.txt.\n\n> **Important note**\n> \n> lxml is still used widely\
    \ in Python because of its various DOM-based features. It is the default parser\
    \ and has memory-efficient features and collaborates with other libraries. For\
    \ more information on lxml, visit https://lxml.de/index.html."
  merge: -1
  img_proc: true
- pgno: 129
  md: 'In Python programming, the task of web-based document parsing is mostly carried
    out by Beautiful Soup, also known as the bs4 Python library. In the next section,
    we will explore this topic further.


    # Introducing Beautiful Soup


    Beautiful Soup is the Python parsing library for dealing with HTML and XML documents.
    It generates a parsed tree similar to that of the Python lxml library (using attributes
    and classes such as lxml.etree and ElementTree), which is further used to traverse,
    search, and identify elements to extract data and scrape the web.


    Beautiful Soup provides the same parsing-related features that are available using
    the lxml and html5lib libraries. Large, simple, and easy-to-use methods and properties
    are available to deal with DOM-related activities in Beautiful Soup.


    A few distinguishing features of Beautiful Soup over other Python libraries are
    listed here:


    +   - It can parse documents with broken, incomplete, misspelled, or missing tags.

    +   - Unlike other parsers, it allows handling duplicate and multi-valued attributes.

    +   - Specific selected portions or sections of the content can also be parsed,
    saving memory and time.

    +   - Document-based encoding is handled automatically. Encoding details can also
    be provided to the Beautiful Soup constructor.


    For more detailed information about Beautiful Soup, please visit the official
    documentation at https://www.crummy.com/software/BeautifulSoup/bs4/doc/. Now that
    we have been introduced to Beautiful Soup in this section, we will install and
    further explore it in the upcoming sections.


    # Installing Beautiful Soup


    Please refer to the Technical requirements section in this chapter, and the https://www.crummy.com/software/BeautifulSoup/bs4/doc/#installing-beautiful-soup
    link to install Beautiful Soup.


    As seen in Figure 5.1, pip install beautifulsoup4 installs or updates the bs4
    library and its dependent libraries, such as soupsieve:


    ```

    (secondEd) C:\HOWScraping2E>pip install beautifulsoup4

    Requirement already satisfied: beautifulsoup4 in c:\how scraping2e\seconded\lib\site-packages
    (4.11.1)

    Requirement already satisfied: soupsieve>1.2 in c:\how scraping2e\seconded\lib\site-packages
    (from beautifulsoup4) (2.3.2.post1)


    (secondEd) C:\HOWScraping2E>cd Chapter05


    (secondEd) C:\HOWScraping2E\Chapter05>jupyter-lab

    ```


    Figure 5.1: Installing Beautiful Soup'
  merge: -1
  img_proc: true
