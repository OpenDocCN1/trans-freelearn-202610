- pgno: 101
  md: '# Parsing robots.txt


    Using a parser, we do not need to read the file manually and follow or instruct
    the steps upon the code found. Also, there might be cases that require iteration,
    validating User-agent for some links, or determining the crawl-delay value of
    the sitemap.xml file (the prescribed time that must take place during processing).
    This information is extremely valuable to automate crawlers for some websites
    and even decide the level of information or coding tactics that might be required.


    As seen in the following code, urllib has robotparser, which allows developers
    to read robots.txt and validate or verify the necessary actions:


    ```

    ```python

    import urllib.robotparser

    robot = urllib.robotparser.RobotFileParser()

    robot.set_url("https://www.python.org/robots.txt")

    robot.read()

    robot

    # <urllib.robotparser.RobotFileParser at ....>

    ```

    ```


    We can see examples for methods such as can_fetch(), which deals with the Allow
    and Disallow directives and returns a **Boolean** value of True or False, respectively.
    Similarly, if the sitemap.xml file exists, then robot.site_maps() will return
    the links:


    ```

    ```python

    robot.can_fetch(''*'',''https://docs.python.org/3/library/urllib.robotparser.html'')

    robot.can_fetch(''Nutch'',''https://docs.python.org/3/library/urllib.robotparser.html'')

    robot.site_maps()

    ```

    ```


    For more information on robots.txt directives, please visit http://www.robotstxt.org.
    For parsing, visit https://docs.python.org/3/library/urllib.robotparser.html for
    more details.


    # Sitemaps


    A sitemap, or sitemap.xml, is an XML file that holds the information related to
    links for a website. Links can be page URLs or to specific media. A sitemap is
    an easy way to inform search engines about URLs (*added, updated, modified* date,
    *removed* URL, *priority, changefreq, and more*) or URL management on the site.
    Search engine scripts crawl the links in sitemaps and use the links found for
    indexing and various purposes, such as **Search Engine Optimization (SEO)**.'
  merge: -1
  img_proc: true
