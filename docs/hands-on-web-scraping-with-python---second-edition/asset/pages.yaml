- pgno: 180
  md: '+   - **Validation**: Data retrieved by an API might require verification and
    validation. Normally, API content does not reveal the date or period of the data
    returned, though it’s assumed to provide up-to-date information.

    +   - **Limitation**: APIs can filter and query their output, but there are limitations
    in the resources they return. An API might return 20 results per page but only
    100 in total. APIs are not replacements for web-related content. In addition,
    the parameters supported by an API might be limited, which in turn limits the
    expected results.

    +   - **Irrelevant data**: Data returned by an API might not exactly fit your
    purpose. There might be a huge amount of irrelevant data, which requires extra
    cleaning and filtering.

    +   - **Incomplete data**: Data returned by an API may fulfill a few of your scraping
    requirements but might not completely or exactly fulfill the expectations or requirements.
    For example, basic information on e-commerce data might exist, but detailed information
    may not be available through APIs, so it might be necessary to crawl through individual
    product URLs. Data collection using APIs that are available across categories
    and in multiple pages might be tedious.


    With these pros and cons, API usage is growing on the internet. Various sites
    allow or use API-based data communication. From a web scraping point of view,
    APIs might fulfill certain data needs, but not completely. The data available
    can be helpful and can be used to tackle or manage the urgent need of data in
    JSON type format or even used for inspection purposes.


    > **Important note**

    > Web APIs are not an alternative to web scraping. They do provide timely support
    and various filters. Plus, if we find hidden API links, we can access data directly.


    In the next section, we will look at using APIs, loading requests with different
    parameters, and exploring APIs’ format, URLs, and more.


    # Data formats and patterns in APIs


    Data available through APIs might be different from what you expected or might
    not fit the plan exactly – in the *Benefits of web APIs* section, we covered a
    few of the ways the data might be different (limitation, irrelevance, and more).


    Acquiring data from APIs is a straightforward process with or without API authorization.
    Content received via an API may appear in many formats, such as key names, nested
    lists and dictionaries, named or numerical indexing blocks, and many more. We
    generally find API content in JSON format, comprising Python lists and dictionaries.


    Before moving on to the data formats, patterns, and results of APIs or API content,
    it is important to demonstrate how APIs are called or used. Most of the time,
    API service providers keep an updated'
  merge: -1
  img_proc: true
