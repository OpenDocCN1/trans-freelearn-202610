    # Regex flags


    Regex flags are often considered additional top-ups or enhancements over basic
    expressions. There are various types of flags available, but the most common ones
    are as follows:


    +   - `re.IGNORECASE`: This flag ignores the case-sensitive (lower or uppercase)
    issue, a short version can be used (`re.I`), and it can be used inline with `(?i)`.

    +   - `re.MULTILINE`: This flag helps to search and match a pattern in an expression
    that is distributed across multiple lines. It can be shortened to `re.M` or written
    as `(?m)` inline.


    As seen in the following code block, the sentence Python variable is a multi-line
    string if declared with HTTP header-related values. There are also newline (`\n`)
    characters. Let’s explore various ways of achieving the regex results, with and
