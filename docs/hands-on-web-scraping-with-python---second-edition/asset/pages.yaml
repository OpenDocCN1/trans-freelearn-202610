- pgno: 209
  md: "# Example 2 – forms and searching\n\nIn Example 2, we will use Selenium to\
    \ log in, log out, and go through available pages for collecting various quotes-based\
    \ data from http://quotes.toscrape.com/. Similar to Example 1, we will locate\
    \ and process the link that contains the Login text from http://toscrape.com.\n\
    \nThe following code searches for an anchor element with the Login text and collects\
    \ the href attribute. The click() action is applied to the Login element. This\
    \ loads the http://quotes.toscrape.com/login page. WebDriver has a few attributes,\
    \ such as current_url. This attribute returns the URL of the page loaded in the\
    \ browser:\n\n```\nmainUrl=https://toscrape.com/\ndriver.get(mainUrl)  # loads\
    \ toscrape.com\nloginPage = driver.find_element(By.LINK_TEXT,\n    \"Login\").get_attribute('href')\n\
    print(loginPage)\nhttp://quotes.toscrape.com/login\n\ndriver.find_element(By.LINK_TEXT,\
    \ \"Login\").click()\n\nprint(f\"Before Login : {driver.current_url}\")\nhttp://quotes.toscrape.com/login\n\
    ```\n\nThe element with the Login text is near the footer section of the page\
    \ loaded, and we need to scroll down to view the element. If the browser window\
    \ has a vertical scrollbar (depending on the dimensions of the window, if configured),\
    \ the driver.find_element(By.LINK_TEXT, \"Login\").click() code will scroll down\
    \ the page vertically till the element with the Login text is visible, and then\
    \ click on it. This is a reduction of the window scrolling related code that had\
    \ to be coded in versions before 4.1.0.\n\nThe http://quotes.toscrape.com/login\
    \ page contains the HTML <form> element with a few inputs and a submit button.\
    \ The form accepts any credentials, such as username=test and password=test. Since\
    \ <input> types have to be filled with credentials, they are identified first,\
    \ cleaned using clear(), and finally, the text value is entered using send_keys().\
    \ These actions automate scrolling or moving up to the element, clicking the element,\
    \ and typing characters:\n\n```\nusername = driver.find_element(By.ID, \"username\"\
    )\nusername.clear()  # cleans if there exist any characters\nusername.send_keys(\"\
    test\") # value entered\npassword = driver.find_element(By.ID, \"password\")\n\
    password.clear()\npassword.send_keys(\"test\")\n```"
  merge: -1
  img_proc: true
