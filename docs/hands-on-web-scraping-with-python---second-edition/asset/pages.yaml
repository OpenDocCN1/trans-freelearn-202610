    # re (search, match, and findall)


    Python’s re library provides various types of search-related methods. A few of
    the common ones that are generally used to search patterns within any code are
    listed here:


    +   - search(): Looks for a match with a given pattern everywhere in the string
    and returns the first object that matches (re.Match). As seen in the preceding
    code, only you or the first match found in the quote string is returned.

    +   - match(): This method looks for a match at the start of the string. In the
    case of the preceding code, it does not match anything. re.match(), on success,
    also returns various functions (start, end, span, group, groups, and more) and
    attributes (lastindex and lastgroup), which is informative in any case but more
    useful when using it with re.finditer(). Please visit https://docs.python.org/3/library/re.html?highlight=regular%20expressions#functions
    for more detailed information.

    +   - findall(): This method accepts a pattern to search for all the matches in
    the string. It’s similar to iterating the search() method, from start to end.


    In the upcoming subsections, we will be learning how to generate regex and apply
    it using examples.


    # Regex using a set of characters


    In regex, we can look for a set of characters by using []. As seen in the following
    code, [a-z] looks for any combination of words that are made up of characters
    from a to z:


    ```

    re.search(r"([a-z]{3})",quote) # <re.Match object; span=(3, 6), match=''you''>

    ```


    In the preceding code, to fix the length or check the occurrences, we use {};
    so {3} in the expression [a-z]{3} is looking for a match of words that are made
    up of a maximum of three alphabetical characters (for example, you, not, and the).


    Generally, regex patterns are provided as a string preceded by the r character.
    r"[a-z]" is a string but is also regex, and is also known as a raw string. In
    addition, we need to be careful about the character casing too (lowercase or uppercase)
    as regex patterns are case sensitive. In general cases, we'
