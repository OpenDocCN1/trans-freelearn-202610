- pgno: 131
  md: "Normally, two types of parsers are supported by BeautifulSoup:\n\n+   - Type\
    \ of markup: html, xml, and html5\n+   - Name of parser library: lxml, html5lib,\
    \ and html.parser (lxml and html5lib must be installed to be used; html.parser\
    \ is a built-in HTML parser)\n\n> **Important note**\n> lxml is recommended as\
    \ the best parser to be used with BeautifulSoup, because of its memory and speed.\
    \ html5lib is usually the second preference, but the parsed output can also be\
    \ used to determine the preference of the parser to be used based on the content\
    \ or DOM requirements.\n\nIt’s also to be noted that the parsed tree (output)\
    \ or parsed content generated will differ based on the parser used. To demonstrate\
    \ parsing, here, a markup variable with an incomplete error code has been declared:\n\
    \n```\nmarkup = \"<a></p></a></p>\"\n```\n\nThe following code uses the default\
    \ parser for markup:\n\n```\nBSOup(markup)    # <html><body><a></a></body></html>\n\
    ```\n\nThe html.parser parser has been used and only <a> has been parsed; the\
    \ </p> HTML tag has not been returned from the markup string variable:\n\n```\n\
    BSOup(markup,\"html.parser\")      # <a></a>\n```\n\nThe lxml parser and the default\
    \ parser outputs look similar:\n\n```\nBSOup(markup,\"lxml\")    # <html><body><a></a></body></html>\n\
    ```\n\nThe html5lib parser seems to provide more detailed information in comparison\
    \ to other parsers, such as lxml and html.parser:\n\n```\nBSOup(markup,\"html5lib\"\
    )\n# <html><head></head><body><a><p></p></a><p></p></body>\n  </html>\n```\n\n\
    All incomplete tags have been listed in the output, and the complete HTML structure\
    \ (<html>, <head>, <body>) has also been maintained."
  merge: -1
  img_proc: true
