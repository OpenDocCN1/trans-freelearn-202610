  md: 'GET is the default HTTP method. Similarly, we have POST, which is a bit stricter
    and is explained in the next section.


    # POST


    POST requests are known as secure requests that are made to the source or server.
    The requested resource’s state might be altered too. Data that’s posted or sent
    to the requested URL is not visible in the browser (unlike GET query strings);
    instead, it’s transferred to the requested body. Requests with the POST method
    cannot be cached or bookmarked and have no restrictions in terms of character
    length.


    In the example code, as shown in Figure 2.30, the `https://httpbin.org/post` URL
    (a simple HTTP request and response service) has been used to demo a POST request:


    ```

    ```python

    pageUrl = ''http://httpbin.org/forms/post''

    postUrl = ''http://httpbin.org/post''

    params = {''customer'': ''Mr Anish'', ''custtel'': '''', ''custemail'': ''anish@anishchapagain.com'',
    ''size'': ''medium'', ''topping'': [''cheese'', ''mushroom''], ''delivery'': ''14:45'',
    ''comments'': ''No comments''}

    headers = {''accept'': ''text/html, */*'', ''referer'': pageUrl}


    response = requests.post(postUrl, data=params, headers=headers).json()

    print(response)

    ```

    ```


    Figure 2.30: HTTP POST request


    pageUrl accepts data to be posted, as defined in params, to postUrl. Custom headers
    are assigned to headers. The post() function accepts a few arguments: the URL,
    for example, postUrl, data (the data to be posted), and headers, and returns a
    response in JSON format.


    The POST request code in Figure 2.30 automates params and headers (partially)
    with the required URLs as though we were submitting the actual HTML form on http://httpbin.org/forms/post
    and posting it to http://httpbin.org/post from the browser.


    You can perform the same task manually from the browser – open DevTools and verify
    the parameters or Payload being used in the Network panel, as shown in Figure
    2.31:'
