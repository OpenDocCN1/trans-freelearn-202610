    The following code imports the bs4 and re (Python regex, or regular expression)
    libraries:


    ```

    from bs4 import BeautifulSoup as BSoup

    import re                 # regex

    html = open("testHTML.html","r").read()  # html file

    soup = BSoup(html) # default parser

    ```


    HTML content, as seen in Figure 5.2, is loaded with the designated path and converted
    into a soup object from the BeautifulSoup library using the default parser.


    With the bs4 soup object, now we can further process the DOM or HTML content.
    The HTML content we are dealing with can be singular or nested. Individual elements
    can be accessed in the same way as accessing attributes, as seen in the following
    code:


    ```

    soup.a  # <a class="sister" href="http://example.com/elsie" id="link1">Elsie</a>

    soup.h1 # <h1>Secret agents</h1>

    ```


    soup.a is similar to soup.find(''a''); it finds the first <a> element by default
    and displays the complete HTML (text and attributes) of that element.


    Plenty of elements have various, or at least a single, attributes. Element attributes
    are important resources as they provide identification of the content.


    In the following code, some of the major functions and attributes of the soup
    object are used:


    ```

    soup.a.attrs

    # {''href'': ''http://example.com/elsie'', ''class'': [''sister''], ''id'': ''link1''}

    ```'
