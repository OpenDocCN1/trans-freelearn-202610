    # [''you'', ''not'', ''tur'', ''aga'', ''ins'', ''you'', ''rse'', ''the'', ''uma'',
    ''ote'', ''nti'', ''lim'', ''itl'', ''ess'']

    re.findall(r"([a-z]{3})",quote, flags=re.IGNORECASE)

