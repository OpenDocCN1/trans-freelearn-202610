    ```

    tagP = root.find(''.//p'')              # .//p

    print(tagP.text_content())

    "Customer name: "

    tagP1 = root.findtext(''.//p/'')      # .//p/

    print(tagP1)

    "Customer name: "

    ```


    Now, as we are able to find and print text from elements, we will apply XPath
    and use CSSSelect (CSSSelect converts CSS selectors to XPath) on the scraper code.


    As seen in the following code, XPath is applied as root.xpath() and CSS selectors
    as root.cssselect(), and the results obtained are exactly the same as for xpath()
    and cssselect():


    ```

    print(root.xpath(''//p/label/input/@value''))

    print(root.xpath(''//legend/text()''))

    print([formP.text_content().strip() for formP in root.xpath(''//form/p'')])

    ...

    print([e.get(''value'') for e in root.cssselect(''p label input[value]'')])

    print([l.text_content() for l in root.cssselect(''legend'')])

    print([p.text_content().strip() for p in root.cssselect(''form > p'')])

    ```


