    # Scraping using lxml – a Python library


    The lxml library is an XML toolkit with a rich library set to process XML and
    HTML. lxml is preferred over other XML-based libraries in Python for its high
    speed and effective memory management, plus it has various other features to handle
    both small and large XML files.


    Python programmers use lxml to process XML and HTML documents. There are plenty
    of other such libraries in Python; a few even build on top of lxml with extra
    add-ons. lxml is also used as a parser engine in Python libraries such as Beautiful
    Soup (https://www.crummy.com/software/BeautifulSoup/bs4/doc/) and pandas (https://pandas.pydata.org/).


    DOM parsing, traversing element trees, XPath, and CSS selector are the features
    that make lxml effective and efficient enough for tasks such as web scraping.
    For more details on lxml and its documentation, please visit https://lxml.de/.


    > **Important note**

    > lxml provides native support to XPath and XSLT and is built on the powerful
    C libraries libxml2 and libxslt. Its library set is normally used with XML or
    HTML to access XPath and parse, validate, serialize, transform, and extend features
    from ElementTree (https://lxml.de/tutorial.html).'
