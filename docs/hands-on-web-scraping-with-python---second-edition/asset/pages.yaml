- pgno: 143
  md: 'As per Scrapy’s official website, https://scrapy.org/, it is *simple, fast,
    collaborative, and yet extensible*. Scrapy was previously maintained by **Scrapinghub**,
    but now it is maintained by **Zyte** (https://www.zyte.com/) and some other contributors.


    Listed here are a few important features that make Scrapy popular and make it
    stand out among the Python web crawling frameworks:


    +   - Built-in support for *parsing, traversing, XPath, CSS selectors, and regex*

    +   - Handles HTTP requests and responses using built-in libraries

    +   - Modular structure and components allow developers to focus on a specific
    task and manage coding collaboratively

    +   - Provides a **Command-Line Interface (CLI)** to deal with the project, data
    exporting, managing the database, and much more

    +   - Plenty of middleware and extensions are available, which allows for the
    easy processing of *cookies, sessions, authentication, robots.txt, project log,
    usage statistics, emails, and much more*


    To begin trying out some scraping tasks using Scrapy, let’s install it in the
    preset environment using pip, as seen in Figure 5.5, or follow the instructions
    at https://docs.scrapy.org/en/latest/intro/install.html:


    ![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_143_0.png)


    Figure 5.5: Scrapy installation


    After this basic introduction to and successful installation of Scrapy in the
    system, next, we are going to set up a project.


    # Setting up a project


    Scrapy, as mentioned in the preceding section, provides a command-line tool, scrapy.
    This tool is loaded with plenty of commands that help with setting up the project
    and data extraction-related activities. The code is available on GitHub: https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter05/bookScrapy.'
