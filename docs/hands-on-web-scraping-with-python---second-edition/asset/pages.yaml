- pgno: 287
  md: 'The nltk Python library is one of the pioneers of NLP. There are plenty of
    ways that NLP can be used, such as classification. In the current case, we will
    be using the textblob and vaderSentiment libraries:


    +   - textblob: This is a text-processing library, built on top of nltk. It can
    be used for various NLP aspects, such as POS tagging, sentiment analysis, lemmatizing,
    tokenizing, and text classification. To analyze the sentiment of text, textblob
    calculates and returns polarity and subjectivity as sentiment results:

    +     - polarity: Indicates the positive or negative sentiment of the text. The
    values range from -1 (very negative) to 1 (very positive), with 0 being neutral.

    +     - subjectivity: Indicates personal feeling. The values range from 0 (objective)
    to 1 (subjective).


    +   - vaderSentiment: This is a social media sentiment analyzer. Similar to TextBlob,
    Valence Aware Dictionary and Sentiment Reasoner (VADER) is a rule-based sentiment
    analyzer. VADER has been trained with a large collection of social media texts.
    vaderSentiment returns these four elements:

    +     - compound: This is the valence score of words in the lexicon. Values range
    from -1 (extremely negative) to 1 (very positive).

    +     - pos: A positive value with a compound score of >=0.05.

    +     - neg: A negative value with a compound score of <=-0.05.

    +     - neu: A neutral sentiment with a compound score of >=-0.05 and a compound
    score of <0.05.


    Sentiment analysis is done upon the quote_details.csv data, which was scraped
    from the http://quotes.toscrape.com/ URL in Chapter 8. The column named quote
    is only required in the current case. It''s the only string or text element that
    will be used with textblob and vaderSentiment to analyze sentiment. Individual
    columns or groups of selected columns can only be read from a file by using the
    usecols parameter in pd.read_csv():


    ```

    import pandas as pd

    quotes = pd.read_csv("quote_details.csv",usecols=["quote"])

    quotes[''quote''][0]

    ''The world as we have created it is a process of our thinking. It cannot be changed
    without changing our thinking.''

    ```


    With the content read to be explored as the quotes DataFrame, in the following
    examples, we will analyze the sentiment of the contents using two quite popular
    Python libraries.'
