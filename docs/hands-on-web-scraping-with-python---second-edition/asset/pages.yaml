- pgno: 24
  md: '![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_24_0.png)


    Figure 1.2: HTTP (client and server or request-response communication)


    Requests and responses are cyclic in nature – they are like questions and answers
    from clients to the server, and vice versa.


    Another encrypted and more secure version of the HTTP protocol is Hypertext Transfer
    Protocol Secure (HTTPS). It uses Secure Sockets Layer (SSL) (learn more about
    SSL at https://developer.mozilla.org/en-US/docs/Glossary/SSL) and Transport Layer
    Security (TLS) (learn more about TLS at https://developer.mozilla.org/en-US/docs/Glossary/TLS)
    to communicate encrypted content between a client and a server. This type of security
    allows clients to exchange sensitive data with a server in a safe manner. Activities
    such as banking, online shopping, and e-payment gateways use HTTPS to make sensitive
    data safe and prevent it from being exposed.


    **Important note**

    An HTTP request URL begins with http://, for example, http://www.packtpub.com,
    and an HTTPS request URL begins with https://, such as https://www.packpub.com.


    You have now learned a bit about HTTP. In the next section, you will learn about
    HTTP requests (or HTTP request methods).


    # HTTP requests (or HTTP request methods)


    Web browsers or clients submit their requests to the server. Requests are forwarded
    to the server using various methods (commonly known as HTTP request methods),
    such as GET and POST:


    +   - GET: This is the most common method for requesting information. It is considered
    a safe method as the resource state is not altered here. Also, it is used to provide
    query strings, such as https://www.google.com/search?q=world%20cup%20football&source=hp,
    which is requesting information from Google based on the q (world cup football)
    and source (hp) parameters sent with the request. Information or queries (q and
    source in this example) with values are displayed in the URL.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '+   - POST: Used to make a secure request to the server. The requested resource
    state can be altered. Data posted or sent to the requested URL is not visible
    in the URL but rather transferred with the request body. It is used to submit
    information to the server in a secure way, such as for logins and user registrations.


    We will explore more about HTTP methods in the *Implementing HTTP methods* section
    of *Chapter 2*.


    There are two main parts to HTTP communication, as seen in *Figure 1.2*. With
    a basic idea about HTTP requests, let’s explore HTTP responses in the next section.


    # *HTTP responses*


    The server processes the requests, and sometimes also the specified HTTP headers.
    When requests are received and processed, the server returns its response to the
    browser. Most of the time, responses are found in HTML format, or even, in JavaScript
    and other document types, in **JavaScript Object Notation (JSON)** or other formats.


    A response contains status codes, the meaning of which can be revealed using **Developer
    Tools (DevTools)**. The following list contains a few status codes along with
    some brief information about what they mean:


    +   - **200**: OK, request succeeded

    +   - **404**: Not found, requested resource cannot be found

    +   - **500**: Internal server error

    +   - **204**: No content to be sent

    +   - **401**: Unauthorized request was made to the server


    There are also some groups of responses that can be identified from a range of
    HTTP response statuses:


    +   - **100–199**: Informational responses

    +   - **200–299**: Successful responses

    +   - **300–399**: Redirection responses

    +   - **400–499**: Client error

    +   - **500–599**: Server error


    > **Important note**

    > For more information on cookies, HTTP, HTTP responses, and status codes, please
    consult the official documentation at https://www.w3.org/Protocols/ and https://developer.mozilla.org/en-US/docs/Web/HTTP/Status.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Now that we have a basic idea about HTTP responses and requests, let us explore
    HTTP cookies (one of the most important factors in web scraping).


    # HTTP cookies


    HTTP cookies are data sent by the server to the browser. This data is generated
    and stored by websites on your system or computer. It helps to identify HTTP requests
    from the user to the website. Cookies contain information regarding session management,
    user preferences, and user behavior.


    The server identifies and communicates with the browser based on the information
    stored in the cookies. Data stored in cookies helps a website to access and transfer
    certain saved values, such as the session ID and expiration date and time, providing
    a quick interaction between the web request and response.


    Figure 1.3 displays the list of request cookies from https://www.fifa.com/fifaplus/en,
    collected using Chrome DevTools:


    ![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_26_0.png)


    We will explore and collect more information about and from browser-based DevTools
    in the upcoming sections and Chapter 3.


    Important note

    For more information about cookies, please visit About Cookies at http://www.aboutcookies.org/
    and All About Cookies at http://www.allaboutcookies.org/.


    Similar to the role of cookies, HTTP proxies are also quite important in scraping.
    We will explore more about proxies in the next section, and also in some later
    chapters.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# HTTP proxies


    A proxy server acts as an intermediate server between a client and the main web
    server. The web browser sends requests to the server that are actually passed
    through the proxy, and the proxy returns the response from the server to the client.


    Proxies are often used for monitoring/filtering, performance improvement, translation,
    and security for internet-related resources. Proxies can also be bought as a service,
    which may also be used to deal with cross-domain resources. There are also various
    forms of proxy implementation, such as web proxies (which can be used to bypass
    IP blocking), CGI proxies, and DNS proxies.


    You can buy or have a contract with a proxy seller or a similar organization.
    They will provide you with various types of proxies according to the country in
    which you are operating. Proxy switching during crawling is done frequently –
    a proxy allows us to bypass restricted content too. Normally, if a request is
    routed through a proxy, our IP is somewhat safe and not revealed as the receiver
    will just see the third-party proxy in their detail or server logs. You can even
    access sites that aren’t available in your location (that is, you see an access
    denied in your country message) by switching to a different proxy.


    Cookie-based parameters that are passed in using HTTP GET requests, HTML form-related
    HTTP POST requests, and modifying or adapting headers will be crucial in managing
    code (that is, scripts) and accessing content during the web scraping process.


    > **Important note**

    > Details on HTTP, headers, cookies, and so on will be explored more in an upcoming
    section, *Data-finding techniques used in web pages*. Please visit the HTTP page
    in the MDN web docs (https://developer.mozilla.org/en-US/docs/Web/HTTP) for more
    detailed information on HTTP and related concepts. Please visit https://www.softwaretestinghelp.com/best-proxy-server/
    for information on the best proxy server.


    You now understand general concepts regarding HTTP (including requests, responses,
    cookies, and proxies). Next, we will understand the technology that is used to
    create web content or make content available in some predefined formats.


    # HTML


    Websites are made up of pages or documents containing text, images, style sheets,
    and scripts, among other things. They are often built with markup languages such
    as **Hypertext Markup Language (HTML)** and **Extensible Hypertext Markup Language
    (XHTML)**.


    HTML is often referred to as the standard markup language used for building a
    web page. Since the early 1990s, HTML has been used independently as well as in
    conjunction with server-based scripting languages, such as PHP, ASP, and JSP.
    XHTML is an advanced and extended version of HTML, which is the primary markup
    language for web documents. XHTML is also stricter than HTML, and from a coding
    perspective, is also known as an application built with **Extensible Markup Language
    (XML)**.'
  merge: -1
  img_proc: true
- pgno: 28
  md: "HTML defines and contains the content of a web page. Data that can be extracted,\
    \ and any information-revealing data sources, can be found inside HTML pages within\
    \ a predefined instruction set or markup elements called tags. HTML tags are normally\
    \ a named placeholder carrying certain predefined attributes, for example, `<a>`,\
    \ `<b>`, `<table>`, `<img>`, and `<script>`.\n\nHTML is a container or type of\
    \ markup language. Various factors are involved in building HTML; the next section\
    \ defines these factors with some examples.\n\n# HTML elements and attributes\n\
    \nHTML elements (also referred to as document nodes) are the building blocks of\
    \ web documents. HTML elements are built with a start tag, `<...>`, and an end\
    \ tag, `</...>`, with certain content inside them. An HTML element can also contain\
    \ attributes, usually defined as `attribute-name = attribute-value`, which provide\
    \ additional information to the element:\n\n```\n```html\n<p>normal paragraph\
    \ tags</p>\n<h1>heading tags there are also h2, h3, h4, h5, h6</h1>\n<a href=\"\
    https://www.google.com\">Click here for Google.com</a>\n<img src=\"myphoto1.jpg\"\
    \ width=\"300\" height=\"300\" alt=\"Picture\" />\n<br />\n```\n```\n\nThe preceding\
    \ code can be broken down as follows:\n\n+   - `<p>` and `<h1>` are HTML elements\
    \ containing general text information (element content).\n+   - `<a>` is defined\
    \ with an href attribute that contains the actual link that will be processed\
    \ when the text **Click here for Google.com** is clicked. The link refers to `https://www.google.com/`.\n\
    +   - The `<img>` image tag also contains a few attributes, such as src and alt,\
    \ along with their respective values. `src` holds the resource, which means the\
    \ image address or image URL, as a value, whereas `alt` holds the value for alternative\
    \ text (mostly displayed when there is a slow connection or the image is not able\
    \ to load) for `<img>`.\n+   - `<br />` represents a line break in HTML and has\
    \ no attributes or text content. It is used to insert a new line in the layout\
    \ of the document.\n\nHTML elements can also be nested in a tree-like structure\
    \ with a parent-child hierarchy, as follows:\n\n```\n```html\n<div class=\"article\"\
    >\n    <p id=\"mainContent\" class=\"content\">\n        <b>Paragraph Content</b>\n\
    \        <img src=\"myLogo.png\" id=\"pageLogo\" alt=\"Logo\"\n             class=\"\
    logo\" />\n    </p>\n    <p>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 29
  md: "```\n```html\n<h3> Paragraph Title: Web Scraping</h3>\n</p>\n</div>\n```\n\
    ```\n\nAs seen in the preceding code, two `<p>` child elements are found inside\
    \ an HTML `<div>` block. Both child elements carry certain attributes and various\
    \ child elements as their content. Normally, HTML documents are built with the\
    \ aforementioned structure.\n\nAs seen in the preceding code block in the last\
    \ example, there are a few extra key-value pairs. The next section explores this.\n\
    \n# Global attributes\n\nHTML elements can contain some additional information,\
    \ such as key-value pairs. These are also known as HTML element attributes. Attributes\
    \ hold values and provide identification, or contain additional information that\
    \ can be helpful in many aspects during scraping activities, such as identifying\
    \ exact web elements and extracting values or text from them and traversing (*moving\
    \ along*) elements.\n\nThere are certain attributes that are common to HTML elements\
    \ or can be applied to all HTML elements. The following list mentions some of\
    \ the attributes that are identified as global attributes (https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes):\n\
    \n+   - `id`: This attribute’s values should be unique to the element they are\
    \ applied to\n+   - `class`: This attribute’s values are mostly used with CSS,\
    \ providing equal state formatting options, and can be used with multiple elements\n\
    +   - `style`: This specifies inline CSS styles for an element\n+   - `lang`:\
    \ This helps to identify the language of the text\n\n> **Important note**\n> \n\
    > The `id` and `class` attributes are mostly used to identify or format individual\
    \ elements or groups of them. These attributes can also be managed by CSS and\
    \ other scripting languages. These attributes can be identified by placing `#`\
    \ and `.`, respectively, in front of the attribute name when used with CSS, or\
    \ while traversing and applying parsing techniques.\n\nHTML element attributes\
    \ can also be overwritten or implemented dynamically using scripting languages.\
    \ As displayed in the following example, `itemscope` attributes are used to add\
    \ properties to an element, whereas `data-*` is used to store data that is native\
    \ to the element itself:\n\n```\n```html\n<div itemscope itemtype=\"http://schema.org/Place\"\
    >\n    <h1 itemprop=\"university\">University of Helsinki</h1>\n    <span>Subject:\
    \ <span itemprop=\"subject1\">Artificial\n        Intelligence</span>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 30
  md: "```\n</span><span itemprop=\"subject2\">Data Science</span>\n</div>\n<img class=\"\
    dept\" src=\"logo.png\" data-course-id=\"324\" datatitle=\"Predictive Analysis\"\
    \ data-x=\"12345\" data-y=\"54321\" data-z=\"56743\" onclick=\"schedule.load()\"\
    />\n```\n\nHTML tags and attributes are very helpful when extracting data.\n\n\
    > **Important note**\n> Please visit https://www.w3.org or https://www.w3schools.com/html\
    \ for more detailed information on HTML.\n\nIn Chapter 3, we will explore these\
    \ attributes using different tools. We will also perform various logical operations\
    \ and use them for extracting or scraping purposes.\n\nWe now have some idea about\
    \ HTML and a few important attributes related to HTML. In the next section, we\
    \ will learn the basics of XML, also known as the parent of markup languages.\n\
    \n# XML\n\nXML is a markup language used for distributing data over the internet,\
    \ with a set of rules for encoding documents that are readable and easily exchangeable\
    \ between machines and documents. XML files are recognized by the .xml extension.\n\
    \nXML emphasizes the usability of textual data across various formats and systems.\
    \ XML is designed to carry portable data or data stored in tags that is not predefined\
    \ with HTML tags. In XML documents, tags are created by the document developer\
    \ or an automated program to describe the content.\n\nThe following code displays\
    \ some example XML content:\n\n```\n<employees>\n  <employee>\n    <fullName>Shiba\
    \ Chapagain</fullName>\n    <gender>Female</gender>\n  </employee>\n  <employee>\n\
    \    <fullName>Aasira Chapagain</fullName>\n    <gender>Female</gender>\n  </employee>\n\
    </employees>\n```\n\nIn the preceding code, the <employees> parent node has two\
    \ <employee> child nodes, which in turn contain the other child nodes of <fullName>\
    \ and <gender>."
  merge: -1
  img_proc: true
- pgno: 31
  md: "XML is an open standard, using the Unicode character set. XML is used to share\
    \ data across various platforms and has been adopted by various web applications.\
    \ Many websites use XML data, implementing its contents with the use of scripting\
    \ languages and presenting it in HTML or other document formats for the end user\
    \ to view.\n\nExtraction tasks from XML documents can also be performed to obtain\
    \ the contents in the desired format, or by filtering the requirement with respect\
    \ to a specific need for data. Plus, behind-the-scenes data may also be obtained\
    \ from certain websites only.\n\n> **Important note**\n> \n> Please visit `https://www.w3.org/XML/`\
    \ and `https://www.w3schools.com/xml/` for more information on XML.\n\nSo far,\
    \ we have explored content placing and content holding related technologies based\
    \ on markup languages such as HTML and XML. These technologies are somewhat static\
    \ in nature. The next section is about JavaScript, which provides dynamism to\
    \ the web with the help of scripts.\n\n# JavaScript\n\n**JavaScript** (also known\
    \ as **JS** or **JScript**) is a programming language used to program HTML and\
    \ web applications that run in the browser. JavaScript is mostly preferred for\
    \ adding dynamic features and providing user-based interaction inside web pages.\
    \ JavaScript, HTML, and CSS are among the most-used web technologies, and now\
    \ they are also used with headless browsers (you can read more about headless\
    \ browsers at `https://oxylabs.io/blog/what-is-headless-browser`). The client-side\
    \ availability of the JavaScript engine has also strengthened its usage in application\
    \ testing and debugging.\n\n`<script>` contains programming logic with JavaScript\
    \ variables, operators, functions, arrays, loops, conditions, and events, targeting\
    \ the HTML **Document Object Model (DOM)**. JavaScript code can be added to HTML\
    \ using `<script>`, as seen in the following code, or can also be embedded as\
    \ a file:\n\n```\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <script>\n   \
    \     function placeTitle() {\n            document.getElementById(\"innerDiv\"\
    ).innerHTML =\n                \"Welcome to WebScraping\";\n        }\n    </script>\n\
    </head>\n<body>\n    <div>Press the button: <p id=\"innerDiv\"></p></div>\n```\n\
    ```"
  merge: -1
  img_proc: true
