- pgno: 244
  md: 'The encoding argument is optional. By default, it uses the value `utf-8`. There
    are various modes in which files can be managed or operated:


    +   - `r`: Read mode; this reads the file. It is also the default mode if no other
    mode is provided with `open()`. `r+` reveals combined mode both for reading and
    writing and `rb` opens the file in read mode and binary mode. The full filename
    or location of the file should be available if you want to use this mode. There
    are methods for read mode such as the following:

    +     - `read()`: Reads the complete file content and returns a string, for example,
    `variable = content.read()` or `variable = content.read(200)` # reads first 200
    characters from content

    +     - `readline()`: Reads a single line from the content, for example, `line_1
    = content.readline()`

    +   - `w`: Writes in the file. `w+` is used for writing and reading, whereas `wb`
    is used to write binary values. The `write()` method writes the provided argument
    to the file, for example, `content.write(string)`.

    +   - `a`: Append mode is used to write content at the end of the loaded file.
    If the file is not found or the wrong filename or file path is provided, then
    it creates a new file, for example, `f = open("file.txt", "a")` and `f.write("this
    will be added to last line of file.txt")`


    `rb+` and `wb+` are often encountered with binary file format. There are also
    a few methods that work on content inside the file:


    +   - `tell()`: Returns the current position of the file object in the file, for
    example, `content.tell()`.

    +   - `seek()`: Adds or changes the file object position to the provided offset
    value. Generally, `seek(offset, whence)` accepts two of the offsets, `whence`,
    or `from` arguments.


    For example, `content.seek(199)` points to the two-hundredth character in the
    file and `content.seek(100,199)` points to the one-hundredth character after the
    first 200 characters.


    Python also supports a statement called `with`, which is used for managing resources
    such as files and database connections. The `with` statement is also used for
    making cleaner, more readable code, and it also helps with exception handling.
    There’s no need to use methods such as `close()` because `with` handles the code
    scope automatically. Here’s an example:


    ```

    ```python

    with open(fileNamePath, "r+") as file:


    content = file.read()

    …...

    ```

    ```


    As shown in the preceding code template, `with` is used to open the file referenced
    with `fileNamePath` using `r+` mode. After loading the file, the file’s contents
    are read using the `read()` function.'
