    \n```\nfor locFinal in locFinals:\n    loc, datetime = locFinal\n# unpacking tuple\
    \ (extracting tuple elements)\n    loc = re.sub('^(http\\:|https\\:)', '', loc)\n\
    # cleaning\n    loc = re.sub('[\\/]{2}', '', loc)\n    loc = re.sub('\\/$', '',\
