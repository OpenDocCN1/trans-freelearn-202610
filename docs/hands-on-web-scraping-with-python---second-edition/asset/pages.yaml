    , datetime)\n# separating date and time\n    ymd = ymdTime[0]\n    time = re.sub(\"\
    \\+.*\", \"\", ymdTime[1])\n# cleaning\n```\n\nThe identified desired data is\
    \ finally loaded into the dataSet data container:\n\n```\ndataSet.append([\"Zyte\"\
