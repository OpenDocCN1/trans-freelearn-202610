    (https://docs.python.org/3/library/xml.etree.elementtree.html) library is used
    to search, parse elements, and build document trees. Element objects also exhibit
    various accessible properties related to Python lists and dictionaries.


    lxml contains important modules, listed here:


    +   - lxml.etree (https://lxml.de/tutorial.html): For parsing and implementing
    ElementTree elements. Supports XPath, iterations, and more.

    +   - lxml.html (https://lxml.de/lxmlhtml.html): Parses HTML and supports XPath,
    CSS selectors, HTML forms, and form submission.

    +   - lxml.cssselect (https://lxml.de/cssselect.html): Converts CSS selectors
