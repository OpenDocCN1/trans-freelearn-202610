  md: '# # Scraping Using PyQuery, a jQuery-Like Library for Python


    In the previous chapters, you learned about the basics of web scraping, the technologies
    involved, data-finding techniques, and traversing markup documents for data with
    the help of some **Python** code.


    Web scraping is a handful of tasks that involve **reverse engineering** techniques.
    It entails exploring a website (examining its content-related structure, **DevTools**,
    paginations, and more), preparing or installing tools (libraries and so on), coding
    and testing, and finally, collecting data in files, clouds, databases, and many
    more places. In this chapter, we will be learning about web scraping using the
    **PyQuery** Python library; this library assists us in the use of concepts such
    as **XPath**, **CSS selectors**, and parsing markup documents. PyQuery provides
    a **jQuery**-like ability to write less, *do more*, which is very significant
    when coding web scrapers.


    In particular, this chapter will cover the following topics:


    +   - PyQuery overview

    +   - Exploring PyQuery

    +   - Web scraping using PyQuery


    # ## Technical requirements


    A web browser (**Google Chrome** or **Mozilla Firefox**) will be required, and
    we will be using **Jupyter notebooks** for code using **JupyterLab**.


    Please refer to the *Creating a virtual environment* section in *Chapter 2* to
    continue setting up and using the created environment.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'The Python libraries that are required for this chapter are as follows:


    +   - pyquery

    +   - urllib

    +   - requests


    The code files for this chapter are available online on GitHub: https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter04


    # PyQuery overview


    PyQuery is a jQuery-like library for Python that facilitates the easy implementation
    and use of lxml and CSS selectors.


    As the name suggests, PyQuery enhances query-related procedures (XPath and CSS
    selector expressions) with short and readable lines of code. Web scraping, as
    you all are aware, requires parsing and traversing features that reside on top
    of various types of web documents.


    PyQuery provides additional features related to DOM and ElementTree, and uses
    CSS selectors to perform queries. The purpose of using PyQuery expressions (or
    queries) is similar to that of XPath or CSS selector-based expressions. PyQuery
    is almost the same as jQuery for web documents.


    The following list contains a basic comparison of expressions that collect the
    href attribute from the <a class="main"> element:


    +   - PyQuery: response.find(''a.main'').attr(''href'')

    +   - lxml XPath: response.xpath(".//a[contains(@class,''main'')]/@href")

    +   - lxml cssselect: response.cssselect("a.main").get(''href'')

    +   - jQuery: $(''a.main'').attr(''href'');


    > **Important note**

    > For more details on PyQuery and its latest documentation, please visit https://pyquery.readthedocs.io/en/latest/
    and https://pypi.org/project/pyquery/. Similarly, for lxml (XPath and cssselect),
    visit https://lxml.de/index.html.


    After our short introduction to PyQuery and its similarities with XPath and CSS
    selectors, let''s go over the basics of jQuery.'
  merge: -1
  img_proc: true
