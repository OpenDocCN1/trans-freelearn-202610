  md: '```

    soup.a.has_attr(''class'')      # True

    soup.a.has_attr(''name'')      # False

    soup.a.get(''class'')          # [''sister'']

    soup.a.get(''href'')      # ''http://example.com/elsie''

    ```


    A brief explanation of the functions and attributes used in the preceding code
    is listed here:


    +   - **attrs**: Lists all the attributes of any element found

    +   - **has_attr()**: Accepts the attribute name as an argument to check whether
    it exists; returns a Boolean (true/false) answer upon searching the query

    +   - **get()**: Accepts the attribute name as an argument and returns the value
    of the provided attribute


    A string value or content from any element can be retrieved using text and string
    attributes, as well as the get_text() function, as used in the following code:


    ```

    soup.a.text      # Elsie

    soup.a.get_text()      # Elsie

    soup.a.string      # Elsie

    ```


    Here, we explored individual elements with their attributes. In the following
    section, we will be searching for elements.


    # find()


    The soup object also supports the find() method, which returns a single result
    as per the arguments provided. If there’s no result, then find() returns None.


    In the following code, various forms of find() have been displayed, identifying
    or selecting <a> by default, with the output <a class="sister" href="http://example.com/elsie"
    id="link1">Elsie</a>:


    ```

    soup.find(''a'')

    soup.find(''a'',string="Elsie")

    soup.find(''a'',{''id'':"link1"})

    soup.find(''a'',"sister")

    soup.find("a",attrs={''class'':''sister''},text="Elsie")

    ```


    Let’s try to understand the various forms of find(), as listed here:


    +   - **find(''a'')**: Finds the first <a> available.

    +   - **find(''a'',string="Elsie")**: Finds the first <a> that has the string
    value Elsie.

    +   - **find(''a'',{''id'':"link1"})**: Finds the first <a> that has the id attribute
    with the value link1.'
