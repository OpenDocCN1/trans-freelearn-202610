- pgno: 112
  md: 'Let’s explore the *pseudo-elements* that were used in the preceding code:


    +   - `:input`: Returns all the <form> input elements or elements that receive
    some action, such as <button>. `source('' :input '' )` is equivalent to `source.find(''
    :input '')`. There is also the <input> element in HTML, which can be expressed
    as `source.find(''input'')`.

    +   - `:header`: Returns the HTML header elements (<h1>, <h2>... <h6>) found.

    +   - `:empty`: Returns all the elements that don’t have any child elements. This
    is helpful to check before proceeding with the iteration of inner elements.

    +   - `:even`: Returns all the elements that are evenly indexed. They can be used
    with other *pseudo-elements* too. Here are two examples: `source.find(''meta:empty:even'')`
    and `source(''meta;empty:even'')`.

    +   - `:odd`: Similar to `:even`, but returns elements that are oddly indexed.


    Apart from index-related tasks, and finding elements, *pseudo-elements* can also
    be used to search for elements with the provided text:


    ```

    source.find(''a:contains("Web")'')

    # [<a.menuitm>, <a>, <a>, <a>, <a>]


    source.find(''a:contains("Web"):last'').text()

    # ''Web Scraper''

    source.find(''a:contains("Web"):last'').attr(''href'') # ''# ''

    ```


    As shown in the preceding code, `:contains()` accepts a string parameter, which
    is case sensitive and returns the matching elements.


    PyQuery also has some verification functions. These functions are quite effective
    in many circumstances (such as updating an existing crawler) for searching for
    elements with attributes and confirming the attributes’ values.


