  md: "# SQLite\n\nDatabases store data in the form of tables, or in a row and column\
    \ structure. Data collected from various tables can be used, linked, and queried\
    \ using the features of **relational database management systems (RDBMSs)**. We\
    \ can manage data inside databases using **structured query language (SQL)** or\
    \ by embedding or using programming languages. When there are security concerns\
    \ and SQL is required, databases with tables are generally preferred to file handling.\n\
    \nSQLite is one of the most commonly used database engines with Python, https://docs.python.org/3/library/sqlite3.html.\
    \ It is considered fast and easy to handle and can be used with or without applications.\
    \ It creates a file with the .db extension in a given location, and can also access\
    \ or read the database file as required.\n\nsqlite3 is a standard Python library.\
    \ SQLite supports column types such as integer, float, and text. For example,\
    \ take a look at the following code block:\n\n```\nimport sqlite3 as db\nconnection\
    \ = db.connect('sample.db')\nconnection.execute('create table holiday(ID int,\n\
    \    Title text, Date text')\n```\n\nSome of the main details of the preceding\
    \ code are as follows:\n\n+   - The connect() method connects the database with\
    \ the code file and manages disk activities.\n+   - Every process in SQLite should\
    \ begin by establishing the connection with the database using connect(). The\
    \ connection object of the sqlite3.Connection class is used to deal with database\
    \ activities.\n+   - connection.execute() creates an sqlite3.Cursor object, which\
    \ is used to process SQL queries. cursor objects are used to execute SQL statements\
    \ and deal with rows of data inside tables.\n\nAs per the preceding code block,\
    \ the sample.db file will be created in the stated location, and it contains a\
    \ table named holiday, created using a SQL statement. For more information on\
    \ SQL, please visit https://www.sqltutorial.org.\n\nThe commit() method is used\
    \ as a saving option. A call to commit() secures the availability or execution\
    \ of the SQL statement in the database:\n\n```\nconnection.execute('insert into\
    \ holiday(ID, Title, Date) values\n(1,\"New Year Day\", \"2023-01-01\")')\n.....\n\
    connection.commit()\n```"
