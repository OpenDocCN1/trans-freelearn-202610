    \    )    # POST request\n\npostHTML.url      # http://quotes.toscrape.com/\n\
    verify =\n    pq(postHTML.content).find('a[href=\"/logout\"]').text()\n    # Logout\n\
    ```\n```\n\nThe HTML POST request to `loginUrl` with the `headers={'Cookie':html.headers['Set-Cookie']}`\
    \ parameter seems to be working now, which shows the redirected URL, `http://quotes.toscrape.com`,\
    \ and we can also find the URL for logging out (`verify`) there. The complete\
    \ code for user authentication can be found on GitHub: https://github.com/PacktPublishing/Hands-On-web-scraping-with-Python-Second-Edition/blob/main/Chapter06/chapter06_authentication.ipynb.\n\
    \nThe authentication process has been completed successfully, with the help of\
