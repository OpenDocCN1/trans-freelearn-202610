- pgno: 159
  md: '(such as the machine, profile, or stored information on a server). Such IDs
    are used to identify and track user-related behavior, and they get updated every
    time a session ends.


    In Figure 6.1, we can see certain rows that possess session-related names (such
    as _gh_sess and user_session) with the corresponding columns for Value, Domain,
    Expires / Max-Age, Priority, and so on:


    ![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_159_0.png)


    Figure 6.1: Session-related information in cookies


    Since information will be stored on a server and sharing or identifying information
    between a client and server is necessary, a cookie is the best place to store
    information. Session-related information is stored in cookies and is supplied
    to desired or accessed web pages, maintaining a stable and authenticated state.


    # Important note


    > Note that we can deny a website from storing information in cookies by refusing
    to accept the cookies, or even deleting stored cookies using the browser or DevTools.
    For more information on cookies and sessions, please visit https://www.aboutcookies.org,
    https://developer.mozilla.org/en-US/docs/web/HTTP/Cookies, and https://securiti.ai/blog/session-cookies/.


    So far in this section, we have presented some basic concepts of cookies and sessions.
    In the next section, we will talk about user authentication and using different
    types of web-based security measures.


    # User authentication


    Authentication or web-based user authentication is a process related to the handling
    and managing of user identification. This is often a combined process where HTML
    form processing and cookie-related information and activities need to be used.


    User login or registration is done using HTML form processing. The information
    collected is stored and inserted into backend databases or secure files. Nowadays,
    Two-Factor Authentication (2FA) is often used across the web. Normally, registered
    users are verified and permitted to log in or out of a system, validating their
    username and password while also solving some CAPTCHAs. This whole process is'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'known as **Single-Factor Authentication (SFA)**. Conversely, 2FA imposes additional
    verification on top of SFA, which involves the following:


    +   - Sending an *activation code* or OTP to a cell phone (through a message or
    app) or email address

    +   - Sending a secure *one-time clickable link* for verification (login, a forgotten
    password, updating information, and so on) to a registered email address or cell
    phone (through an app or message)


    These authentication processes need a combination of HTML form processing, within
    some preconfigured or allocated time, and some secure identification IDs or a
    *key:value* pair that manages the session or session management, cookies, and
    so on, helping to complete the authentication process.


    Now that you have been introduced to the basics of authentication, in the next
    section, we will deal with security and authentication-related web-based cases
    using the Python programming language.


    # HTML <form> processing using Python


