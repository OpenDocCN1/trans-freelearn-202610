  md: '# Introducing jQuery


    jQuery (*write less, do more; see https://jquery.com/*) is one of the most popular
    JavaScript libraries and is lightweight, CSS3-complaint, cross-browser compatible,
    and quick. It supports plenty of features related to web documents, such as the
    DOM, HTML, and CSS.


    Web-based document traversal, manipulation, event handling, animation, and AJAX
    are some of the core features jQuery is applied to. PyQuery expressions are similar
    to jQuery expressions, so anyone with prior jQuery and JavaScript knowledge will
    find it easy to use PyQuery with Python.


    Throughout the chapter, you will be focused on using Python libraries only. Web
    development today involves JavaScript in relation to dynamism, development and
    testing, and many other aspects. For a full stack developer or web-related programmer,
    knowledge of JavaScript, along with AJAX and jQuery, is almost compulsory. Please
    visit https://learn.jquery.com/ for more information on jQuery.


    You''ve received a basic introduction to PyQuery and jQuery in this section. The
    next section will explore PyQuery in depth and show you how to use it to write
    a crawling script or scrape a website.


    # Exploring PyQuery


    PyQuery addresses **DOM**-based expressions or queries in a quick, easy, and effective
    manner. In this section, we will install PyQuery and explore a few of its important
    features so that we are ready to develop a web scraping script.


    > **Important note**

    > You can find plenty of Python libraries that are similar to PyQuery. A few examples
    are parsel (https://pypi.org/project/parsel/), beautifulsoup (https://pypi.org/project/beautifulsoup4/),
    selectolax (https://pypi.org/project/selectolax/), and, of course, lxml (https://pypi.org/project/lxml/).


    # Installing PyQuery


    Please refer to the *Technical requirements* section before proceeding with installing
    the PyQuery library. With the help of the virtual environment (`secondEd`) you
    created in *Chapter 2*, install or update PyQuery using pip:


    ![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_107_0.png)


    Figure 4.1: Installing PyQuery'
