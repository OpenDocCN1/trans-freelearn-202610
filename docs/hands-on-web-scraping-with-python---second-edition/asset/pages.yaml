    # CSV


    Comma-separated values (CSV) is another format of structured data. CSV files are
    somewhat compact and voluminous in nature. Each entity in a file is either a column
    or row record, and they are separated by a delimiter, generally a comma (,). We
    can have different delimiters or separators, but need to be careful when reading
    and processing such files.


    Converting CSV files into tables is common in practice. CSV stores data in row
    and column format, almost in a tabular structure. CSV headers, or the first row,
    contain the titles of the columns. From the second row, data is listed line by
    line. Python provides a built-in library, csv, that has certain methods that make
    writing CSV files almost like basic file handling.'
