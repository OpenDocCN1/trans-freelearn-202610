    You can see that a new tab will be added to the browser with the text **view-source:**
    prepended to the original URL, https://www.google.com. Also, if we add the text
    *view-source:* to our URL, once the URL loads, it displays the page source or
    raw HTML.


    > **Important note**

    > You can try to find any text or DOM element in the web browser by searching
    inside the page source. Load the URL https://www.google.com and search *web scraping*.
    Find some of the content displayed by Google using the page source.


    We now possess a basic idea of data-finding techniques. The technique we used
    in this section is a primary or base concept. There are a few more techniques
    that are more sophisticated and come with a large set of functionality and tools,
    which help or guide us in the data-finding context – we will cover them in the
    next section.


    # Developer tools


    DevTools are found embedded within most browsers on the market today. Developers
    and end users alike can identify and locate resources and search for web content
    that is used during client-server communication, or while engaged in an HTTP request
    and response.


    DevTools allow a user to examine, create, edit, and debug HTML, CSS, and JavaScript.
    They also allow us to handle and figure out performance problems. They facilitate
    the extraction of data that is dynamically or securely presented by the browser.'
  merge: -1
  img_proc: true
