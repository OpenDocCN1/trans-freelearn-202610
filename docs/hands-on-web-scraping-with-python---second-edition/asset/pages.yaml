    most common one is index and location, or iloc[]:


    ```

    books.iloc[2]                # returns row from index 3 (0,1,2)

    Upc                                 b5ea0b5dabed25a8

    Title                       The Secret of Dreadwillow Carse

    ......

    Url     http://books.toscrape.com/catalogue/the-secret...

    Image   http://books.toscrape.com/media/cache/c4/a2/c4...

    Name: 2, dtype: object

    ```


    Checking unique values and counting the total number of unique values is quite
    applicable during analysis. Here, books has 29 rows, but there are only 5 unique
    values (nunique() returns the number of unique elements). This suggests that duplicate
    values exist in the Rating column. Rating values are strings, which might cause
    problems if any statistical computation is required. Therefore, cleaning is required
    for the Rating column:


    ```

    books["Rating"].unique()

    # array([''Three'', ''One'', ''Four'', ''Five'',  ''Two''], dtype=object)

    books["Rating"].nunique() # 5

    ```


    One of the important aspects of using pandas is data filtering. Various methods
    can be used for filtering, such as filter(), where(), and query(). Also, as shown
    in the preceding code, logical operations (such as and and or) can be used for
    filtering. [[''Title'',  ''Price'',  ''Stock_Qty'']], after the query() operation,
    collects and displays results from only the three columns mentioned:


    ```

    books.query("Stock_Qty >= 15 and Title.str.contains(''Bear'')")

    [[''Title'', ''Price'', ''Stock_Qty'']]

    ```


    Similar to the str.contains() method, there are also startswith() and endswith()
    methods. These methods play crucial roles when dealing with string types, and
    again when filtering techniques are applied.


    As shown in the preceding code, the value_counts() method counts the total number
    of occurrences of the provided value for the selected columns:


    ```

    ratingCount = books["Rating"].value_counts()

    ```'
