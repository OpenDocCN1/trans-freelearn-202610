    # Web requests


    Throughout the chapters of this book, the `requests` Python library has been used
    to establish communication between the code and the web. Plenty of Python libraries
    can be found at https://pypi.org/ if we search for ones similar to `requests`.


    The following subsections list some Python libraries and technologies and provide
    brief introductions to them.


    # pycurl


    The pycurl Python library (http://pycurl.io/) is a wrapper on top of the popular
    libcurl library. libcurl is one of the earliest Python libraries that was used
    to communicate with websites on the internet, based on the **curl** tool (also
    known as **cURL**).


    `curl (https://curl.se/)` is a command-line tool that is used to connect and transfer
    data over the web. `curl` is the basis of network communication; it''s a core
    implementation that is used with the help of a wrapper across different **operating
    systems (OSs)**, browsers, and machines that communicate'
  merge: -1
