- pgno: 119
  md: "urlXML refers to the `<urlset>` node and urlXML.children() refers to the `<url>`\
    \ child nodes of `<urlset>`, which total 530.\n\nPython provides the very useful\
    \ range(start,stop,step) function. This provides us with the difference between\
    \ start and stop (0 and 530 in our code). As there are a total of 530 targeted\
    \ `<url>` elements, a loop has been initiated by providing the index number as\
    \ eq(loop):\n\n```\n```python\ndataSet=[]\nloops = range(0, urlXML.children().__len__())\n\
    # range(start, stop)\nfor loop in loops:\n    child = urlXML.children().eq(loop)\
    \  #0, 1, 2, 3..,529\n    dataSet.append([\n        child.find('loc').text(),\n\
    \        child.find('lastmod').text(),\n        child.find('changefreq').text(),\n\
    \        child.find('priority').text()\n    ])\n```\n```\n\nWith the respective\
    \ `<url>` instances identified, their `<loc>`, `<lastmod>`, `<changefreq>`, and\
    \ `<priority>` values are appended to dataSet.\n\nThe following code defines a\
    \ function that is also used in *Chapter 3*. It accepts arguments such as data,\
    \ or in our case, the collection object, dataSet; the filename to be created;\
    \ and the column list for the first row of the CSV file (columns) as follows:\n\
    \n```\n```python\ndef writeto_csv(data,filename,columns):\n    with open(filename,'w+',newline='',encoding=\"\
    UTF-8\") as\n        file:\n            writer = csv.DictWriter(file, fieldnames=columns)\n\
    \            writer.writeheader()\n            writer = csv.writer(file)\n   \
    \         for element in data:\n                writer.writerows([element])\n\
    ```\n```"
