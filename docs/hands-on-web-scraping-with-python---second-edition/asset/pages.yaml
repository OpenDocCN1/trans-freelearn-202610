- pgno: 111
  md: 'Let’s discuss a few pseudo-elements that were used in the preceding code:


    +   - `:eq()`: Accepts an index number (and in Python, indexes start at 0). It
    evaluates the matched expression and collects the text associated with it. This
    can also be used as `source.find(''a'')`. `eq(0).text()`. There are also a few
    elements that are similar to `:eq()`:

    +     - `:lt()`: Accepts an index number and only returns values *less than* the
    provided index number, for example, `source.find(''a:lt(2)'')`

    +     - `:gt()`: Accepts an index number and only returns values *greater than*
    the provided index number, for example, `source.find(''a:gt(0)'')`

    +   - `:first`: Returns the *first occurrence* of an element for the matched expression
    and is the same as `:eq(0)`.

    +   - `:last`: Returns the *last occurrence* of an element for the matched expression.


    There are a few more *pseudo-elements*, though they are a bit different from the
    ones listed in the previous code block:


    ```

    source.find('':input'')

    # [<button.navbar-toggle.pull-right.collapsed>]


    source.find('':header'')

    # [<h1>, <h2.site-heading>, <h2.site-heading>, <h2.site-heading>, <h2.site-heading>,
    <h2.site-heading>, <h2.site-heading>, <h2.site-heading>]


    source.find('':empty'')

    # [<meta>, <meta>, <meta>, <meta>, <link>, <meta>, <link>, <link>, <link>, <script>,
    <iframe>, <span.icon-bar.top-bar>, <span.icon-bar.middle-bar>, <span.icon-bar.bottom-bar>,
    <img>, <a>, … <hr.test-site-divider>, <img>, <hr.test-site-divider>, <img>… <div.clearfix>,
    <div.push>, <br>, <img>, <img>]


    source.find(''meta:empty'')

    # [<meta>, <meta>, <meta>, <meta>, <meta>]


    source.find('':empty:even'')

    # [<meta>, <meta>, <meta>, <link>, <link>, <iframe>, <span.icon-bar.middle-bar>,
    <img>, <div.crta>, <div.crta>, <hr.test-site-divider>, <hr.test-site-divider>,
    <hr.test-site-divider>, <hr.test-site-divider>, <hr.test-site-divider>, <div.clearfix>,
    <br>, <img>]


    source.find('':header:odd'')

    # [<h2.site-heading>, <h2.site-heading>, <h2.site-heading>, <h2.site-heading>]

    source.find(''meta:empty:odd'')   # [<meta>, <meta>]

    ```'
