- pgno: 175
  md: '# Data Extraction Using Web APIs


    So far, we have learned about the web, web-based technologies, techniques for
    locating and extracting data, and plenty of data-related services in various chapters
    of this book.


    Web **application programming interfaces** (APIs) are built to interact with queried
    information. Web APIs provide interfaces to query and access formatted data (normally
    in JSON format) or structured data that is easy to use and process. Depending
    on the type of information (HTTP POST payload, JSON content, third-party authentication,
    collective metadata, or middleware, for example) being carried and the type of
    service being engaged with, authentication and some form of tokenization are also
    required.


    In general, a web API is a medium for loading, seeking, transferring, and embedding
    information in pages or other APIs.


    In this chapter, we will learn about the following topics:


    +   - Introduction to web APIs

    +   - Data formats and patterns in APIs

    +   - Web scraping using APIs


    # Technical requirements


    A web browser (*Google Chrome* or *Mozilla Firefox*) will be required, and we
    will be using *JupyterLab* for our Python code.


    Please refer to the *Setting things up* and *Creating a virtual environment* sections
    in *Chapter 2* to continue with setting up and using the environment we created.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'The Python libraries that are required for this chapter are as follows:


    +   - `requests`

    +   - `csv`


    The code files for this chapter are available online in this book''s GitHub repository:
    https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter07.


    # Introduction to web APIs


    Information sharing and processing are in huge demand on the web and across web-based
    services. A web API is a service available on the web that provides access to
    resources such as raw data, filtered information, and embedded and dynamic content,
    normally in a ready-to-use and exchangeable format such as JSON, CSV, or XML.


    Information exchange or transfer is the core purpose of web APIs. We can consider
    an API as a web- or browser-based service or **user interface (UI)** for retrieving,
    sharing, or accessing information based on requests made to a web server or API
    provider. With plenty of security-related vulnerabilities, many providers ask
    for authentication in the form of an *API key* (a unique block of identification
    with a certain length that identifies the user or client with the API or server)
    or some code to make API processing more efficient and effective.


    Web APIs are not dependent on any single programming language (such as ASP, PHP,
    or JSP); users and developers can read data from an API and copy it into their
    system or platforms using any tools or languages they wish. Data collection and
    exchange, even in huge volumes, has been made possible with the use of APIs, and
    also, APIs incorporate some security when required. Many API providers found on
    the web provide their APIs as **Software-as-a-Service (SaaS)** and **Product-as-a-Service
    (PaaS)** to their clients.


    **Important note**

    As developers and data collectors, we should always be analyzing web links (using
    DevTools) for any possible APIs or any other related links, if available. If we
    use DevTools, then scraping activities become quite easy and fast compared to
    dealing with HTML code using regex, PyQuery, lxml, and so on.


    While using DevTools for scraping, there might be situations that require some
    code-level processing (such as HTTP requests) to be handled, such as HTTP headers,
    HTTP methods, and setting up requests with proxies.


    The number of web APIs on the market for web-related services and products has
    grown tremendously. Product and service users are often provided with API tokens
    and API keys, and they can use APIs for their tasks (banking, fetching logs, HTTP
    request analysis, web traffic analysis, accessing HTTP'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'status code logs, customer support, and accessing contact us and sitemap pages,
    dealer lists, and more). Growth in the number of APIs has powered mobile app systems.
    Many service providers use APIs in their mobile or associated systems and use
    content from APIs to create or generate various kinds of messages and display
    that generated information in their mobile apps.


    From a user''s point of view, if it''s only information that users are seeking,
    APIs are a huge relief because users do not have to learn complex systems or programming
    languages. Service providers will make API links available, which can be used
    to load and view results in real time and as required.


    APIs extend the possible uses of browser-based features, and serving data. In
    the next section, we will briefly discuss API types.


    # Types of API


    Web APIs, when normally used through the browser, accept some input, authorization
    credentials or keys, and information for existing keys or key:value pairs. The
    API result generated shows the data, and even transfers or exchanges the data
    to configured systems. Developers can also extend the functionality and features
    of web APIs, integrating essential logic as required.


    Based on the *web as a service*, APIs can be classified into four different types:


    +   - **Public API**: This is the most common type of API found on the web. These
    APIs are the services that websites provide to their clients and users. They are
    service-oriented and are used for information exchange. There are plenty of freely
    available public APIs that are found on the web relating to Twitter, weather forecasting,
    the stock market, NBA games, and plenty more. Also, most of the free APIs available
    on the web apply usage limits to each IP address or machine, or time limits.


    +   - **Partner API**: These are a restricted type of public API. Service providers
    allow their approved clients or registered users to use this API based on authorization,
    paid services, and requirement demand. Service providers provide an API key or
    credentials, and the client has to use the key or credentials while using the
    API.


    +   - **Private or Internal API**: These APIs are used for internal, company,
    or organizational purposes. They are also known as in-house APIs and serve organizational
    features such as calendars, **human resources (HR)**, leave management, notices,
    and many more for employees and staff.


    +   - **Composite API**: Also known as unified APIs, these APIs incorporate multiple
    different APIs from one system. There might be task-specific APIs implemented
    in a system that need to be implemented as a process in a certain order (that
    is, the output from one API becomes the input for another API); a unified API
    comes in handy in such cases. The client, when accessing a composite API, is not
    sure where the content comes from because redirection and time-related issues
    might occur with this type of API.'
  merge: -1
  img_proc: true
- pgno: 178
  md: "APIs provide data and perform services as requested. In a web-based communication\
    \ *protocol and design architecture* scenario, they can be divided into two types:\n\
    \n+   - **REST:** The most common and popular API architecture, **representational\
    \ state transfer (REST)**. It is stateless (data is not stored between requests),\
    \ it supports caching, and it is considered secure. It uses standard HTTP methods\
    \ (GET/POST) to provide services that are not exposed. HTTP status codes are tracked\
    \ and can also be provided as responses. It supports various response formats,\
    \ such as JSON, XML, and CSV. External library support is not required when used\
    \ with HTTP. *RESTful* (this is what REST APIs for web services are called) APIs\
    \ provide an interface for the user and resources to communicate; many public\
    \ APIs are RESTful. In the majority of cases, REST APIs perform **Create, Retrieve,\
    \ Update,** and **Delete (CRUD)** activities.\n+   \n+   - **SOAP: Simple object\
    \ access protocol (SOAP)** is normally a messaging protocol for the web. It supports\
    \ various other protocols on the web, such as HTTP, **Simple Mail Transfer Protocol\
    \ (SMTP), Remote procedure calls (RPC),** and **Transmission control protocol/Internet\
    \ protocol (TCP/IP)** to exchange or share information across the web. SOAP is\
    \ independent of platforms and programming languages. SOAP is popular in distributed\
    \ enterprise environments because of its function drive approach, strict rules,\
    \ structure, and controlled standard. SOAP supports XML as a messaging service\
    \ and is known as an XML-based protocol. The HTTP POST method is used for information\
    \ exchange and is also considered difficult to use by developers.\n\nWe now have\
    \ looked at the different types of APIs based on their architectures and the services\
    \ that are integrated. With the growing demand for data, web APIs are already\
    \ widely used because of their applicability and usage among diverse web systems,\
    \ applications, and users.\n\n> **Important note**\n> \n> For more information\
    \ on web APIs, REST, and SOAP, please visit the following URLs: https://www.w3.org/api/,\
    \ https://www.w3.org/TR/soap/, https://restfulapi.net/, https://www.ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm,\
    \ and https://www.altexsoft.com/blog/engineering/.\n\nIn the next section, we\
    \ will discuss the benefits and limitations of web APIs from a data collection\
    \ point of view.\n\n# Benefits of web APIs\n\nThough web APIs are not exactly\
    \ a solution to web scraping, APIs are among the preferred and most widely searched\
    \ data sources that can be used to retrieve data. APIs not only process web queries\
    \ (URLs with parameters); they also display information that has been requested.\n\
    \nWe can access an API as an information source, transformer or exchanger, query\
    \ engine, in-house web system, and plenty of other forms and formats where data\
    \ communication is needed. We just need the web browser, API access, and the API’s\
    \ URL, and we are ready to go. With the growing demand from developers and users,\
    \ web APIs are being deployed, or are being used directly or indirectly."
  merge: -1
  img_proc: true
