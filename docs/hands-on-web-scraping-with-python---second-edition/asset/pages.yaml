  md: 'driver.get_cookies() lists all the cookie-related values that exist in JSON
    format.


    Receiving, updating, and setting cookie-related values is quite common to bypass
    some security features. Using selenium to obtain cookie values and process them
    is one of the major tasks from the web-scraping perspective.


    driver.page_source returns the page source of the page or the HTML source of the
    page. Receiving page_source is also one of the significant features of Selenium.
    In page_source, from selenium, we can find values that are dynamically formed
    or generated using JavaScript. page_source content is required and can be parsed
    using lxml, pyQuery, bs4, and other Python libraries. The refresh() method acts
    like a browser-based page refresh button.


    Browser-based history traversing buttons are handled by the driver methods back()
    and forward():


    ```

    driver.back() # history Python.org

    driver.forward() # go forward

    ```


    back() takes you to the previous page, whereas forward() takes you to the next
    page.


    In this example, we used the driver-related features and functions. In the next
    section, we will find and locate HTML elements and deal with dynamic values.


    # HTML forms and elements, and JavaScript


    Form (HTML <form>) management or processing is one of the priority tasks for automation,
    testing, and overall Quality Analysis (QA). Using Selenium for such tasks is handy
    in terms of time (iterating through values, parallel processing).


    Although we will be using an automation tool, we need to identify elements using
    CSS Selector, XPath, or some new methods available in Selenium. The identification
    of HTML elements (id, name), their positions, and values is required to process
    them. For the following example, we will be using HTML <form> from https://phptravels.com/demo.


    During analysis, it seems that the Instant Demo Request Form form (as shown in
