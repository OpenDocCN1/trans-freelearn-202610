  md: "# Supervised learning\n\nIn this type of learning, machines are provided with\
    \ or trained using training data (labeled data), and finally, they predict or\
    \ classify the output based on the training data. The output is based on the input\
    \ data supplied and the algorithm learns from the training data. A quality dataset\
    \ (clean, formatted, preprocessed, and EDA conducted) must be available if we\
    \ want the nearest possible output or prediction. Here, the output variable is\
    \ dependent on the input variable.\n\nListed here are a few steps explaining how\
    \ the supervised learning technique works:\n\n+   1. An input dataset, also known\
    \ as a labeled dataset, is selected.\n+   2. The dataset is chunked into two sets,\
    \ training and testing (normally 80% for training and 20% for testing). Records\
    \ or rows are selected either randomly or sequentially.\n+   3. An input variable\
    \ (or variables) is determined or picked.\n+   4. An applicable learning algorithm\
    \ is chosen (such as linear regression).\n+   5. The selected algorithm is executed\
    \ on the training set, whereas the efficiency of the model is evaluated with the\
    \ testing set.\n+   6. If the output or predicted result is correct, then the\
    \ model is accurate. If not, steps 1 to 5 are repeated with a different algorithm.\n\
    +   7. New sets of data are provided to the trained model and outputs are received.\n\
    \n> **Important note**\n> \n> If the output does not result in the correct classification\
    \ or is not near the calculated value, the input dataset is thoroughly analyzed\
    \ again using EDA features and processed further, and training is conducted. In\
    \ the case of regression, the effectiveness of the regression predictive model\
    \ can be measured by calculating the **Root Mean Square Error (RMSE)**.\n\nA supervised\
    \ model uses prior observations, data, and inputs to classify or predict the new\
    \ output. This type of algorithm is useful in daily, basic activities. It will\
    \ not work if the data is different for training and testing sets. For complex,\
    \ inaccurate input data, these models will require lots of computation and might\
    \ not reveal accurate results.\n\nSupervised learning can be used in data filtering,\
    \ house price prediction, sentiment analysis, spam detection, classifying images,\
    \ fraud detection, and more.\n\nBased on the applicable problems, supervised learning\
    \ algorithms are basically classified into two types – classification and regression."
