    ''Pot'', ''ent'', ''ial'', ''lim'', ''itl'', ''ess'']

    ```


    # Regex using escaped code


    Apart from mentioning a set of characters, we can also use a sequence of characters.
    For example, \w represents any alphanumeric character and \w{3} represents any
    word with a total of three characters, as shown here:


    ```

    re.findall(r"\w{3}",quote)

    #[''you'', ''not'', ''tur'', ''aga'', ''ins'', ''you'', ''rse'', ''the'', ''Hum'',
    ''Pot'', ''ent'', ''ial'', ''lim'', ''itl'', ''ess'']

    ```


    Similarly, \s matches whitespaces (space, tab, and newlines). The number of repetitions
    and occurrences can also be determined with the quantifiers listed here:


    +   - *: Zero or more of the words in the expression.

    +   - +: One or more than one of the words in the provided expression.

    +   - ?: Matches zero or one of the words in the expression (also known as a lazy
    quantifier).

    +   - {, }: Matches unlimited characters. Occurrences work with a scope of {minimum,
    maximum}. Here are a few examples:

    +     - {2,10}: Matches from 2 to 10 characters

    +     - {,5}: Matches up to five characters

    +     - {2,}: A minimum of two characters

    +     - {3}: Match occurrences of every three character


    # Regex using concatenation


    Another major benefit of regex is that it can be concatenated. Take the following
    examples:


    +   - \s+(\w{3})\s+: Matches any words that are three characters in length and
    have at least one or more space before and at the end of the word

    +   - \s*(\w{3})\s*: Matches any words that are three characters in length and
    have zero or multiple spaces before and at the end of the word'
