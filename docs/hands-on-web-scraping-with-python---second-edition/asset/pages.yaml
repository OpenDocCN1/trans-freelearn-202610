- pgno: 58
  md: 'Here is the information available in DevTools that can be used in our code:


    +   - **Request URL**: We might find hidden or redirected URLs, APIs with the
    desired contents, or other URLs that are easier to process.

    +   - **Request Headers**: Information sent by the browser to the server during
    request processing, for example, cookies, user-agent, referer, and pragma.

    +   - **Response Headers**: Information that the server exchanges with the browser
    during the response, for example, server information, content/types, and etags.

    +   - **Cookies**: Security, permissions, or session content in key-value pairs
    with expiration dates and times. The priority of cookies determines the complexity
    of the HTTP-based communication cycles.

    +   - **Status Code**: Information about HTTP responses, whether they are client,
    server, or resource issues.

    +   - **Request Method**: HTTP methods (GET/POST) being used when sending requests
    or receiving responses.


    Developers might also encounter situations where URL manipulation is required
    (altered or cleaning, for example). There might be some hidden URLs, APIs, or
    even static content with data that we require that is not visible directly through
    web browsers.


    After all, we are developing crawlers or Python scripts to automate our browser-based
    activities. Hence, we need to fully understand the DevTools and develop crawlers
    that can perform similarly to the browser with some additional tasks, such as
    extracting data. For this purpose, we need to manage and handle the URLs and HTTP
    communication, which we will cover in the upcoming sections.


    > **Important note**

    > DevTools shows us the complete communication logs during the requests and responses
    from the server or other third parties. Please check out the *Developer tools*
    section of *Chapter 1* for more information, or check out these URLs: https://developer.chrome.com/docs/devtools/
    and https://firefox-source-docs.mozilla.org/devtools-user/.


    # requests – Python library


    requests, an HTTP-based Python library released in 2011, is still one of the most
    renowned libraries among developers. It is an elegant and simple HTTP library
    for Python, written in natural language (https://requests.readthedocs.io/en/latest/),
    as shown in Figure 2.16:'
  merge: -1
  img_proc: true
- pgno: 59
  md: '![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_59_0.png)


    Figure 2.16: requests library – HTTP for Humans


    We took a look at requests in the Installing libraries section. For our purposes,
    we are using requests version 2.28.1.


    Compared to other HTTP libraries in Python, requests is highly rated because of
    its readable, developer-friendly, and simple-to-use attributes. Some of its main
    qualities are as follows:


    +   - Short, simple, and readable functions and attributes

    +   - Access to various HTTP methods

    +   - Automatic content decoding and decompression

    +   - Easy processing of query strings

    +   - Customization of HTTP headers

    +   - Session and cookie processing

    +   - Ability to deal with JSON requests and content

    +   - Proxy support

    +   - Multipart file uploads (form handling)

    +   - Connection pooling and timeouts


    We will be using the requests library, and we’ll explore some of its main properties.
    In the Loading URLs section, we used the get() method to load a URL and view its
    source using content. We were actually using the HTTP GET method to communicate
    with the URL using get().


    The requests library also supports other HTTP methods, such as PUT, POST, DELETE,
    HEAD, and OPTIONS, using the put(), post(), delete(), head(), and options() methods,
    respectively.


    With this brief introduction and overview of requests, we will cover some more
    details with code examples in the following sections.'
  merge: -1
  img_proc: true
