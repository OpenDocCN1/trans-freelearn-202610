- pgno: 40
  md: 'All panels and tools found inside DevTools have a designated role. Let’s get
    a basic overview of a few important ones next.


    # Exploring DevTools


    Here is a list of all the panels and tools found in DevTools:


    +   - **Elements**: Displays the HTML content of the page viewed. This is used
    for viewing and editing the DOM and CSS, and for finding CSS selectors and XPath
    content. Figure 1.10 shows the icon as found in the Inspect menu option, which
    can be clicked and moved to the HTML content in the page or code inside the Elements
    panel, to locate HTML tags or XPath and DOM element positions:


    ![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_40_0.png)


    Figure 1.10: Element inspector or selector


    This icon acts similarly to the mouse cursor moving across the screen. We will
    explore CSS selectors and XPath further in Chapter 3.


    > **Important note**

    > HTML elements displayed or located in the Elements or Network | Doc panel may
    not be available in the page source.


    +   - **Console**: Used to run and interact with JavaScript code, and to view
    log messages.

    +   - **Sources**: Used to navigate pages and view available scripts and document
    sources. Script-based tools are available for tasks such as script execution (that
    is, resuming and pausing), stepping over function calls, activating and deactivating
    breakpoints, and handling exceptions.

    +   - **Network**: Provides us with HTTP request and response-related resources.
    Resources found here feature options such as recording data to network logs, capturing
    screenshots, filtering web resources (JavaScript, images, documents, and CSS),
    searching web resources, and grouping web resources, and can also be used for
    debugging tasks. Figure 1.11 displays the HTTP request URL, request method, status
    code, and more, by accessing the Headers tab from the Doc option available inside
    the Network panel.'
  merge: -1
  img_proc: true
