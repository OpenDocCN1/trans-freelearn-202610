- pgno: 213
  md: '# Using Regular Expressions and PDFs


    So far, we have learned about and explored some of the core Python libraries in
    the context of web communication, content reading, and browser automation, for
    data finding and extraction.


    **Regular expressions** (also referred to as **Regex**, **regex**, or **RegEx**
    – we will use **regex** throughout the rest of this chapter) are built using a
    predefined set of characters to form a pattern used for searching and similar
    activities. In *Chapters 3 and 4*, when carrying out web scraping, we tested and
    applied various available features, such as *CSS selectors*, *XPath*, and *PyQuery*,
    to find and locate specific types of activities. Regex helps us with pattern matching
    – we are knowingly or unknowingly using regex most of the time while working on
    documents or any textual content.


    In a data-related context, it is very hard to avoid activities such as finding,
    searching, and matching. Regex provides us with a simple and elegant approach
    to dealing with such activities. Data is available in structured or unstructured
    formats in various forms and types of documents. **Portable Document Format (PDF)**
    is a secure, feature-enabled, nicely compressed document format that is easily
    transferred over the internet. PDF is different in comparison to other textual
    document formats. We will learn about data extraction from a PDF in this chapter.


    In this chapter, we will learn about the following topics:


    +   - Overview of regex

    +   - Regex with Python

    +   - Using regex to extract data

    +   - Data extraction from a PDF'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Technical requirements


    A web browser (*Google Chrome* or *Mozilla Firefox*) will be required and we will
    be using *JupyterLab* for the Python code.


    Please refer to the *Setting things up* and *Creating a virtual environment* sections
    in *Chapter 2* to continue setting up and using the environment created. Refer
    to https://pypdf2.readthedocs.io/en/3.0.0/user/installation.html to install **PyPDF2.**


    The Python libraries that are required for this chapter are as follows:


    +   - `requests`

    +   - `re`

    +   - `pypdf2`


    The code files for this chapter are available online in this book''s GitHub repository:
    https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter09.


    # Overview of regex


    There are plenty of cases when it''s quite hard or even impossible to locate some
    web-based content or elements with XPath and CSS selectors. Fortunately, we can
    overcome such situations using a regex. A regex is an expression built using strings
    that is used to find or search content by identifying an existing pattern.


    In web scraping and extraction-related activities, a regex is also used as a final
    or firsthand pattern-matching option. Patterns can be defined using various steps,
    often accompanied by special notations that represent predefined rules. A regex
    is like grouping and writing plain text, and many libraries and text-related features
    exist that use these expressions, providing us with handy, easy-to-use functions.


    The latest code editors, document readers, and writing programs all provide facilities
    such as searching in files, multiple pages, and inside project folders, and using
    find and replace. To use these options, we need to input text or a regex; in any
    case, pattern matching or a regex will be used to search through the content.


    A regex is usually used when other options haven''t worked, or sometimes it''s
    even the preferred method used. The scope can be extended to a few important features,
    such as the following:


    +   - Splitting or breaking down the content into chunks, also known as exploding
    or slicing the contents into pieces

    +   - Finding all or more than one match

