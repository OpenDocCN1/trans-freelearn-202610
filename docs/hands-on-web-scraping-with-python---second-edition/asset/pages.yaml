  md: '# 11

    Machine Learning and Web Scraping


    So far, we have learned about data extraction, data storage, and acquiring and
    analyzing information from data by using a number of Python libraries. This chapter
    will provide you with introductory information on Machine Learning (ML) with a
    few examples.


    Web scraping involves studying a website, identifying collectible data elements,
    and planning and processing a script to extract and collect data in datasets or
    files. This collected data will be cleaned and processed further to generate information
    or valuable insights. ML is a branch of Artificial Intelligence (AI) and generally
    deals with statistical and mathematical processes. ML is used to develop, train,
    and evaluate algorithms that can be automated, keep learning from the outputs,
    and minimize human intervention.


    ML uses data to learn, predict, classify, and test situations, and for many other
    functions. Data is collected using web scraping techniques, so there is a correlation
    between ML (its performance) and scraped data. Web scraping is primarily linked
    with ML because quality data is provided to ML algorithms as input. ML is also
    considered for use for any tasks that require lots of interpretation, iterations,
    handling large volumes of data (in GB, TB, or PB), complex datasets, and any tasks
    that ML can reduce the processing time of, and reduce errors, when compared to
    humans.


    In this chapter, we will learn about the following topics:


    +   - Introduction to ML

    +   - ML using scikit-learn

    +   - Sentiment analysis


