    source = BSoup(response.content)\n    if source.find('ul','pager').find('li','next'):\n\
    \        txtNext = source.find('ul','pager')\n                  .find('li','next').find('a').get_text()\n\
    ```\n```\n\ntxtNext holds the value for the next page."
