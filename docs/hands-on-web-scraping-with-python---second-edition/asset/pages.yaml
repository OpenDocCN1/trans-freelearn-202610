  md: '# re.sub


    re.sub() works exactly the same as find and replace or the string replace() method.
    In the following code block, the r"(H[a-z]+)" expression matches any word starting
    with H and a combination of one or more characters in the range [a-z] and is replaced
    with HumanBeing:


    ```

    newQuote = re.sub(r"(H[a-z]+)", ''HumanBeing'', quote)

    newQuote

    # If you do not turn against yourself, the HumanBeing Potential is limitless

    ```


    In the following code, \, matches , (comma), which is replaced, using sub(), with
    a null or empty value:


    ```

    newQuoteA = re.sub(r"\,",'''',quote)

    # If you do not turn against yourself the Human Potential is limitless

    ```


    There''s also a method that returns an object based on our pattern, called compile().
    In the next section, we will be exploring re.compile() along with some important
    regex fundamentals.


    # re.compile


    As the method name suggests, re.compile() compiles a regex and creates a pattern
    object. Using a pattern object is not compulsory but it makes the code more readable
    and scalable.


    In the following code, we have a Python list called languages, containing the
    names of various programming languages:


    ```

    languages = ["Javascript","Python","Go","Java","Kotlin",

    "PHP","C#","Swift","R", "Ruby","C","C++","Matlab",

    "TypeScript","Scala","SQL","HTML","CSS","NoSQL", "Rust", "Perl"]

    vowel_start = r"^[AEIOU]"

    vowel_end = r".*[aeiouAEIOU]$"

    print(f" Expression {vowel_start}, Type:{type(vowel_start)}")

    # Expression ^[AEIOU], Type:<class ''str''>

    ```


    We have defined two regex patterns, as listed here:


    +   - vowel_start: Checks whether the elements in languages start with a vowel
    (case-sensitive)

    +   - vowel_end: Checks whether elements in languages end with vowels (case-insensitive)


    It''s also to be noted that although vowel_start and vowel_end are defined to
    hold regex, they are still string objects.'
