- pgno: 155
  md: '# Working with the Secure Web


    So far, we have learned about the web, web content, reverse-engineering techniques,
    data-finding techniques, a few Python libraries, and a framework that we can employ
    to access and scrape the desired web content.


    Plenty of security-related concerns exist on web platforms today, along with measures
    to ensure security. Lots of web applications, extensions, and even web-based service
    providers exist to protect us and our web-based systems against unauthenticated
    usage and unauthorized access.


    The growing use of internet applications and e-commerce activity demands a secure
    web (or web-based security-enabled features) as a high priority to deal with actions
    that are harmful or even illegal. We often receive irrelevant emails or spam,
    containing information that we did not ask for.


    It’s quite challenging from a web scraping perspective to deal with such issues,
    but the concept of ethical hacking makes it more viable, even from an application
    and security perspective. We will cover a few basic concepts that deal with security
    on the web and proceed to look at web scraping.


    In this chapter, we will learn about the following topics:


    +   - Exploring secure web content

    +   - HTML <form> processing using Python

    +   - User authentication and cookies

    +   - Using proxies


    # Technical requirements


    A web browser (*Google Chrome* or *Mozilla Firefox*) will be required, and we
    will also use *JupyterLab* for Python code.


    Please refer to the *Setting things up* and *Creating a virtual environment* sections
    in *Chapter 2* to continue using the environment created.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'The Python libraries that are required for this chapter are as follows:


    +   - `requests`

    +   - `pyquery`


    The code files for this chapter are available online in this book''s GitHub repository:
    https://github.com/PacktPublishing/Hands-On-Web-Scraping-with-Python-Second-Edition/tree/main/Chapter06.


    # Exploring secure web content


    Today''s web and internet technologies are quite vulnerable in terms of web security
    (content, authorization, illegal access, and so on). We want the web to be safe
    and the content that we browse, search, or view to be genuine, not violating any
    legal or ethical standards or affecting people''s human rights.


    The web must be accessible and available to everyone who seeks information, effectively
    and by following ethical practices. We often encounter web content that is not
    exactly what we were looking for, or hear of web content that has been tampered
    with or hacked into or that private and sensitive information has been leaked
    illegally, and so on. Although a lot of these cases are beyond our control, we
    can reduce vulnerabilities and make the web a much safer place to be.


    In many new technologies, security-related concerns have been identified and solutions
    have been implemented. There are even applications and organizations concerned
    with network-based security, which are growing in demand and using the security
    enabled technologies. In government departments, developers use up-to-date technologies
    to make the web a safer place. With such improvements in technology, scraping
    and crawling are getting more challenging. Web scraping, or extracting the information
    available on the web, is not harmful when ethical concerns are taken into account.


    In the upcoming sections, we will introduce some basic security-related concepts
    that can be implemented and are easily available on the web, and then explore,
    implement, and access them using Python.


    # Form processing


    Form or HTML `<form>` processing, also known as form handling, is used in most
    cases to pass or submit collected or user-provided data to a backend or server.
    There are plenty of cases of web-based forms (such as login, contact us, registration,
    and subscription forms) being submitted by someone impersonating someone else.


    From a user perspective, a form is simply a data collector that has some `<form>`
    elements, such as `<select>`, `<option>`, `<textarea>`, and `<input>`, asking
    for some input or values. When data is provided, it gets validated at some level
    and is processed by the server or concerned system, and any necessary further
    action takes place (such as user login, user registration, resetting a forgotten
    password, QR processing, and image validation).'
  merge: -1
  img_proc: true
