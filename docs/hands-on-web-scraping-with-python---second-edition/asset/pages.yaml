    Figure 3.16: robots.txt file


    Let us try to understand a few directives shown in *Figure 3.16*:


    +   - **Allow:** Permits robots to access the link or directories defined.

    +   - **Disallow:** Restricts robots from accessing the link or directories defined.

    +   - **User-agent:** Agents, robots, or browser platforms mentioned should follow
    the directives mentioned for those User-agent objects. If * (an asterisk) is found
    mentioned in User-agent, it represents all agents. Sometimes, User-agent provides
    an agent name, such as Nutch, in *Figure 3.16*.


    As mentioned in this section, we obey and follow the directives mentioned in the
    robots.txt file. Often, there might not be simple or easy-to-read content and,
    during automation, if we wish to test the directives’ response on the fly, then
    parsing robots.txt is very helpful.'
