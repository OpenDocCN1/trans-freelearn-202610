  md: 'to know that *Word documents*, *PowerPoint presentations*, *HTML*, *Jupyter
    notebooks*, *analysis reports from various applications*, and many more content
    types support exporting and saving files as PDF.


    We often find various types of data (such as textual, tabular, and images) in
    a PDF file. In *Chapters 3 and 4*, we saw how to extract web-based content using
    Python. Here, we will be using the PyPDF2 Python library to extract data from
    PDF files.


    In the next sections, we will install and explore PyPDF2 from a data extraction
    perspective.


    # The PyPDF2 library


    PyPDF2 (https://pypdf2.readthedocs.io/en/3.0.0/index.html) is a free, open source
    (https://github.com/py-pdf/PyPDF2) Python library to work with PDF files and is
    quite famous among Python developers and the community because of its various
    features.


    Listed here are a few of its major functionalities:


    +   - Text extraction

    +   - Image extraction

    +   - Metadata (document details) availability and extraction

    +   - File conversion (PDF to Word, and more)

    +   - Text modification (PDF files)

    +   - Adding a watermark to existing or new PDF files

    +   - Adding security, such as password-protecting PDF files

    +   - Splitting a PDF file into pages

    +   - Merging PDF files into one PDF

    +   - Dealing with the page layout, cropping, transformation, and orientation
    (such as rotating the page)


    It should also be noted that PDF files can be created using PDF applications or
    exported and saved from another document format. Though PDF files contain the
    proper formatting of the original document, their content is not like HTML or
    markup-based documents. PDF contents are available in raw format (with line breaks,
    spaces, and tabs), and the use of regex is almost compulsory to target and extract
    the desired information.


    > **Important note**

    > There are plenty of Python libraries that deal with PDF files, such as `pdfminer`,
    `pdfquery`, `xpdf`, `pdfrw`, `pikepdf`, and `pymupdf`. PyPDF2 is my favorite among
    those listed because of its various features. As explained at https://pypdf2.readthedocs.io/en/3.0.0/user/installation.html,
    PyPDF2 can be used for broad use cases, or can just be focused on a domain, such
    as *crypto (encrypting or decrypting)* and *image processing*.'
  merge: -1
  img_proc: true
