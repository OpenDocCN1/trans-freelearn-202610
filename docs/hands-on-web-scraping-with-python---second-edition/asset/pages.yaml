    \  - `get_screenshot_as_file()`: Captures a screenshot of the designated area\
    \ of a web page or the default screen. For example, `driver.get_screenshot_as_file('filename.png')`\
    \ will capture a screenshot in the code location with the filename `'filename.png'`.\n\
    +   - `is_enabled()`: Returns a Boolean value (True or False) for the provided\
    \ locator based on the element property enabled or disabled (*disabled form elements\
    \ are not usable or cannot interact*). For example, `driver.find_element(By.NAME,'first_name').is_enabled()`\
    \ will return True. HTML elements can carry a disabled attribute, for example,\
