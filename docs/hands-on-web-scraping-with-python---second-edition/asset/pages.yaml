  md: '# 10


    # Data Mining, Analysis, and Visualization


    So far, we have learned about some of the core Python libraries and techniques
    regarding HTTP/HTTPS communication, reading content, browser automation, and more
    from a data extraction perspective.


    Data is the new oil (we all agree about this), but solely obtaining or collecting
    data does not provide any significant value. Collected data is stored in files
    (JSON, CSV, and XML), databases, and more. Stored data needs to be identified,
    searched, arranged, cleaned, transformed, explored, or modeled using algorithms
    and can sometimes be used by many services and applications before there''s any
    profit from the information from it.


    Various technologies and concepts are involved in identifying and collecting data
    and processing it in order to extract some value. Data analysis implements and
    executes logic and algorithms using data-related applications and tools to generate
    valuable information. Visualization, on the other hand, displays the data in a
    more presentable format using plots, charts, and much more.


    In this chapter, we will discuss topics that are applicable to collecting data.
    We will also discuss how to use concepts and techniques that will help us to gain
    key information and valuable insights. These concepts and topics are in high demand
    in domains such as **data science**, **data analysis**, **knowledge discovery
    (KD)**, **artificial intelligence (AI)**, and **machine learning (ML)**.


    To that end, we will cover the following topics in this chapter:


    +   - Data mining

    +   - Handling collected data

    +   - Data analysis and visualization'
