    Here is a brief explanation of some of the regex used in the preceding code:


    +   - Set of characters or [] (square brackets):

    +     - [A-Z]: Set of uppercase characters

    +     - [a-z]: Set of lowercase characters

    +     - [0-9]: Set of numeric characters from 0 to 9


    **Important note**

    The expression [a-zA-Z0-9] matches all alphanumeric characters. In addition, in
    regex, characters other than [A-Z0-9a-z] are written as escaped characters (\,
    for comma, \? for the question mark character, and \+ for the + character). The
    set of characters can also contain special or escape characters; for example,
    [0-9\+\-\.] means containing the numbers 0-9 and the +, -, and . characters or
    any combination of these numbers and characters.


    +   - Round brackets () within the expression are used to hold a group of matching
    values. For example, r"([a-z]+)[0-9]{3}" holds values matching one or more characters
    from a to z.

    +   - Escape code, sometimes also known as predefined shortcuts, is escaped with
    \. Here are some examples of escape code:

    +     - \s: Represents space (keyboard space bar) characters or whitespaces; for
    example, \s+ adds one or more spaces

    +     - \n: Newline character, used with multi-line content

    +     - \t: Tab character

    +     - \S: Non-whitespace

    +     - \w: Matches alphanumeric characters; is similar to [a-z0-9A-Z]

    +     - \W: Matches non-alphanumeric characters; is the opposite of \w

    +     - \b: Matches the word boundary

    +     - \B: Matches the non-word boundary'
