    +   - `re.findall(r"^Accept.*",sentence, re.M)`

    +   - `re.findall(r"(?m)^Accept.*",sentence)` (inline flag)


    Flags can also be applied together; for example, `flags=re.MULTILINE|re.IGNORECASE`
    will impose both flags, as shown here:


