- pgno: 21
  md: '# Web Scraping Fundamentals


    This book about web scraping covers practical concepts with detailed explanations
    and example code. We will introduce you to the essential topics in extracting
    or scraping data (that is, high-quality data) from websites, using effective techniques
    from the web and the Python programming language.


    In this chapter, we are going to understand basic concepts related to web scraping.
    Whether or not you have any prior experience in this domain, you will easily be
    able to proceed with this chapter.


    The discussion of the web or websites in our context refers to pages or documents
    including text, images, style sheets, scripts, and video contents, built using
    a markup language such as HTML. It’s almost a container of various content.


    The following are a couple of common queries in this context:


    +   - Why web scraping?

    +   - What is it used for?


    Most of us will have come across the concept of data and the benefits or usage
    of data in deriving information, decision-making, gaining insights from facts,
    or even knowledge discovery. There has been growing demand for data, or high-quality
    data, in most industries globally (such as *governance, medical sciences, artificial
    intelligence, agriculture, business, sport, and R&D*).


    We will learn what exactly web scraping is, explore the techniques and technologies
    it is associated with, and find and extract data from the web, with the help of
    the Python programming language, in the chapters ahead.


    In this chapter, we are going to cover the following main topics:


    +   - What is web scraping?

    +   - Understanding the latest web technologies

    +   - Data-finding techniques'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Technical requirements


    You can use any Operating System (OS) (such as Windows, Linux, or macOS) along
    with an up-to-date web browser (such as Google Chrome or Mozilla Firefox) installed
    on your PC or laptop.


    # What is web scraping?


    Scraping is a process of extracting, copying, screening, or collecting data. Scraping
    or extracting data from the web (a buildup of websites, web pages, and internet-related
    resources) for certain requirements is normally called web scraping. Data collection
    and analysis are crucial in information gathering, decision-making, and research-related
    activities. However, as data can be easily manipulated, web scraping should be
    carried out with caution.


    The popularity of the internet and web-based resources is causing information
    domains to evolve every day, which is also leading to growing demand for raw data.
    Data is a basic requirement in the fields of science and technology, and management.
    Collected or organized data is processed, analyzed, compared with historical data,
    and trained using Machine Learning (ML) with various algorithms and logic to obtain
    estimations and information and gain further knowledge.


    Web scraping provides the tools and techniques to collect data from websites,
    fit for either personal or business-related needs, but with legal considerations.


    As seen in Figure 1.1, we obtain data from various websites based on our needs,
    write/execute crawlers, collect necessary content, and store it. On top of this
    collected data, we do certain analyses and come up with some information related
    to decision-making.


    ![](img/61ad17ff4226a1bcbcd5f7a33a05dc4f_22_0.png)


    Figure 1.1: Web scraping – storing web content as data


    We will explore more about scraping and the analysis of data in later chapters.


    There are some legal factors that are also to be considered before performing
    scraping tasks. Most websites contain pages such as Privacy Policy, About Us,
    and Terms and Conditions, where information on legal action and prohibited content,
    as well as general information, is available. It is a developer’s ethical duty
    to comply with these terms and conditions before planning any scraping activities
    on a website.'
  merge: -1
  img_proc: true
