- pgno: 147
  md: "```\n#root\nnextPage = response.xpath\n(\"//ul[@class='pager']/li[@class='next']/a/@href\"\
    )\nfor listing in listings:\n```\n\nThe preceding code identifies listings from\
    \ http://books.toscrape.com and will iterate using XPath. A link for the new page,\
    \ nextPage, has also been parsed. Both CSS selectors and XPath expressions are\
    \ available to use with response (HTTP response to start_urls).\n\nAs seen in\
    \ the following code, the Python BooksItem class from items.py, which has the\
    \ column object, has been created and identified or planned fields are being parsed\
    \ and added to column:\n\n```\ncolumn = BooksItem() # from books.items import\
    \ BooksItem\ncolumn['title'] = listing.xpath\n(\"./h3/a/@title[normalize-space()]\"\
    ).extract_first()\ncolumn['url'] =\n    listing.xpath(\"./h3/a/@href\").extract_first().strip()\n\
    ...\nyield response.follow\n('http://books.toscrape.com/catalogue/'+column['url'],\n\
    \    callback=self.parse_page, meta={'column':column})\n```\n\nTo parse the detail\
    \ listing page using the link made available by column['url'], Scrapy provides\
    \ the follow() function, which links to the parse function to deal with (parse_page)\
    \ as a callback, and the items collected are added to the BooksItem class's column\
    \ object.\n\nThe following code implements loop-based logic and the parse() call\
    \ function each time a link to the next page is available:\n\n```\nif nextPage:\n\
    \    nextPage =\n        'http://books.toscrape.com/catalogue/'+nextPage\n   \
    \ yield scrapy.Request(nextPage, callback=self.parse)\n```\n\nThis spider (booklist)\
    \ created can be executed using the scrapy crawl booklist command. It lists lots\
    \ of logs, such as elapsed time and dates.\n\nWith the spider ready to process\
    \ or crawl, we will export data in the next section.\n\n# Exporting data\n\nThe\
    \ scrapy command has made exporting data to files very easy. We can use these\
    \ commands:\n\n+   - scrapy crawl booklist -o bookRecords.csv\n+   - scrapy crawl\
    \ booklist -o bookRecords.json"
