  - '[PAGE 24]


    Now, let''s review the new tools that are available in Magento 2:


    # New tools


    +   - **Magento Performance Toolkit**: This is a tool that allows merchants and
    developers to test the performance of the Magento installation and customizations.

    +   - **Magento 2 Command Line Tool**: This is a tool to run a set of commands
    in the Magento installation to clear the cache, re-index the store, create database
    backups, enable maintenance mode, and more.

    +   - **Data Migration Tool**: This tool allows developers to migrate the existing
    data from Magento 1.x to Magento 2. The tool includes verification, progress tracking,
    logging, and testing functions.

    +   - **Code Migration Toolkit**: This allows developers to migrate Magento 1.x
    extensions and customizations to Magento 2. Manual verification and updates are
    required in order to make the Magento 1.x extensions compatible with Magento 2.

    +   - **Magento 2 Developer Documentation**: One of the complaints by the Magento
    community was that Magento 1 didn''t have enough documentation for developers.
    In order to resolve this problem, the Magento team created the official Magento
    2 Developer Documentation with information for developers, system administrators,
    designers, and QA specialists.


    # Admin panel changes


    +   - **Better UI**: The admin panel has a new look-and-feel, which is more intuitive
    and easier to use. In addition to that, the admin panel is now responsive and
    can be viewed from any device in any resolution.

    +   - **Inline editing**: The admin panel grids allow inline editing to manage
    data in a more effective way.

    +   - **Step-by-step product creation**: The product add/edit page is one of the
    most important pages in the admin panel. The Magento team worked hard to create
    a different experience when it comes to adding/editing products in the Magento
    admin panel, and the result is that you can manage products with a step-by-step
    page that includes the fields and import tools separated in different sections.'
  - '[PAGE 25]


    # Frontend changes


    +   - **Integrated video in product page:** Magento 2 allows you to add a video
    to the product, introducing a new way of displaying products in the catalog.

    +   - **Simplified checkout:** The steps in the checkout page have been reduced
    to allow customers to place orders in less time, increasing the conversion rate
    of the Magento store.

    +   - **Register section removed from checkout page:** In Magento 1, the customer
    had the opportunity to register from step 1 of the checkout page. This required
    the customer to think about his account and the password before completing the
    order. In order to make the checkout simpler, Magento 2 allows the customer to
    register from the order success page without delaying the checkout process.


    # What do you need to get started?


    Magento is a really powerful platform and there is always something new to learn.
    Just when you think you know everything about Magento, a new version is released
    with new features to discover. This makes Magento fun and unique as an e-commerce
    platform.


    That being said, this book will be your guide to discover everything you need
    to know to implement, manage, and maintain your first Magento store.


    In addition to that, I would like to highlight additional resources that will
    be useful in your journey of mastering Magento:


    +   - **Official Magento Blog** (`https://magento.com/blog`): Get the latest news
    from the Magento team: best practices, customer stories, information related to
    events, and general Magento news

    +   - **Magento Resources Library** (`https://magento.com/resources`): Videos,
    webinars and publications covering useful information organized by categories:
    order management, marketing and merchandising, international expansion, customer
    experience, mobile architecture and technology, performance and scalability, security,
    payments and fraud, retail innovation, and business flexibility'
