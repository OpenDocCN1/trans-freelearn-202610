    # Reports


    +   - **Reviews:**

    +     - By Customers

    +     - By Products

    +   - **Sales:**

    +     - Orders

    +     - Tax

    +     - Invoiced

    +     - Shipping

    +     - Refunds

    +     - Coupons

    +     - PayPal Settlement

    +     - Braintree Settlement

    +   - **Customers:**

    +     - Order Total

    +     - Order Count

    +     - New

    +   - **Products:**

    +     - Views

    +     - Bestsellers

    +     - Low Stock

    +     - Ordered

    +     - Downloads


    In addition to that, you will see an additional menu item at the end of the list:
    **Refresh Statistics.**


    To optimize performance, Magento calculates and stores the information for each
