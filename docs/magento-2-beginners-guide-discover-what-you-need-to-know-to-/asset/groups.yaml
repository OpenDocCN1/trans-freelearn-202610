    \ 35 gabriel staff 11920 Dec 17 16:25 ..\n-rw-r--r-- 1 gabriel staff  7002 Dec\
    \ 19 11:38 config.xml.dist\n-rw-r--r-- 1 gabriel staff  63779 Dec 19 11:38 map.xml.dist\n\
    ~/Projects/Playground/magento2-migration.dev/vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4\
    \ $ cp config.xml.dist config.xml\n~/Projects/Playground/magento2-migration.dev/vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4\
    \ $ cat config.xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!--\n/**\n *\
    \ Copyright © 2015 Magento. All rights reserved.\n * See COPYING.txt for license\
