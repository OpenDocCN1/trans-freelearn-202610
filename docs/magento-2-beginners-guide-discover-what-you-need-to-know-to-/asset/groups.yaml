    \n5. 点击**保存**以完成虚拟产品的设置。\n\n现在，让我们在店面查看产品的展示效果。这是产品列表页面：\n\n![](img/de3034a92496a32462134266292a51dd_167_1.png)\n\
    \n## 产品类型\n\n这是产品详细信息页面：\n\n![](img/de3034a92496a32462134266292a51dd_168_0.png)\n\
    \n### 可下载产品\n\n**可下载产品**是一种可下载的数字文件，例如电子书、软件、音乐视频等。\n\n由于下载文件在购买前不可用，你可以在产品详细信息页中添加示例，例如电子书简介、软件试用版或音乐视频短片。\n\
    \n让我们按照以下步骤创建一个**可下载产品**：\n\n1. 转到**产品 | 库存 | 目录**页面。\n2. 点击**添加产品**按钮内的箭头，然后选择**可下载产品**。\n\
    \n如下面的屏幕截图所示，可下载产品表单中有一个名为“可下载信息”的特殊部分：\n\n![](img/de3034a92496a32462134266292a51dd_169_0.png)\n\
    \n3. 我们将为此产品设置以下信息：\n\n   **基本信息：**\n\n   - 启用产品：是\n   - 属性集：默认\n   - 产品名称：示例培训计划\n\
    \   - SKU：sample-training-program\n   - 价格：$25\n   - 税类：应税商品\n   - 数量：100\n  \
    \ - 库存状态：有库存\n   - 可见性：目录，搜索\n   - 类别：默认类别 | 系列 | Erin 推荐\n\n4. 为此产品添加示例图片：\n\n\
    \   ![](img/de3034a92496a32462134266292a51dd_170_0.png)\n\n5. 你现在可以添加可下载产品的具体详细信息。“可下载信息”部分包含以下内容：\n\
    \n   - **链接**：用于指定此产品的下载链接。这些链接在购买产品时显示。\n   - **示例**：用于为可下载产品添加示例，这些示例将显示在产品详细信息页中。\n\
    \n6. 让我们为可下载产品添加一个链接和一个示例。点击“链接”容器中的“添加链接”，并设置以下信息：\n\n   - **标题**：示例链接\n   -\
    \ **文件**：URL | http://url.dev/file\n   - **示例**：URL | http://url.dev/sample\n\
    \   - **可共享**：否\n   - **最大下载次数**：100\n\n如详细信息中所示，你也可以为各个链接设置示例。\n\n如果将“可共享”设置为“是”，客户将通过电子邮件收到链接，并能够与他人共享该链接。\n\
    如果将“可共享”设置为“否”，客户必须登录客户账户才能访问下载链接。\n\n最后，你可以设置下载次数限制，并且还有一个复选框可以设置无限次下载，如下面的截图所示：\n\
    \n![](img/de3034a92496a32462134266292a51dd_171_0.png)\n\n7. 现在，让我们在“示例”容器中为产品添加一个示例：\n\
    \n   - 标题：产品示例\n   - 文件：URL – http://url.dev/product-sample\n\n8. 最后，点击“保存”以完成可下载产品的设置。\n\
    \n现在，我们将从产品详细信息页面到客户账户，逐一查看可下载产品的各个页面：\n\n- 产品列表页面：\n\n  ![](img/de3034a92496a32462134266292a51dd_172_0.png)\n\
    \n- 产品详细信息页面：\n\n  ![](img/de3034a92496a32462134266292a51dd_173_0.png)\n\n- 购物车：\n\
    \n  ![](img/de3034a92496a32462134266292a51dd_173_1.png)\n\n- 结账：\n\n  ![](img/de3034a92496a32462134266292a51dd_174_0.png)\n\
    \n- 客户账户：\n\n  ![](img/de3034a92496a32462134266292a51dd_174_1.png)\n\n### 总结\n\
    \n在本章中，你了解了 Magento 中不同的产品类型，并为每种产品类型创建了一个示例产品。\n在下一章中，我们将介绍 Magento 2 中管理类别的过程，以便为我们的商店设置主导航菜单和类别树。\n\
    \n## 7 类别\n\n在本章中，我们将涵盖以下概念：\n\n- 类别\n- 层级结构\n- 顶部导航\n\n### 类别\n\nMagento 提供了一种将目录组织成不同类别和子类别的方式。你可以在管理面板内部组织目录，并为客户在店面提供清晰的产品浏览方式。\n\
    \n你可以通过转到管理面板中的**产品 | 库存 | 类别**部分来管理商店中的类别：\n\n![](img/de3034a92496a32462134266292a51dd_177_0.png)\n\
    \n当该部分在管理面板中加载后，你将在左侧看到类别树，在右侧看到用于添加和编辑类别的表单：\n\n![](img/de3034a92496a32462134266292a51dd_177_1.png)\n\
    \n在类别树顶部，你会看到两个按钮：\n\n- **添加根类别**：你可以添加根类别。这有助于设置多个商店视图，例如，一个服装商店和一个电子产品与电脑商店。这些商店是独立的商店视图，每个视图都有包含在不同根类别中的特定目录。下面这个屏幕截图展示了两个根类别的示例：\n\
    \n  ![](img/de3034a92496a32462134266292a51dd_178_0.png)\n\n- **添加子类别**：你可以为当前类别添加子类别。在上面的屏幕截图中，**Alternative\
    \ Store** 根类别已被选中，因此如果我们点击**添加子类别**，就会创建子类别，如下面的屏幕截图所示：\n\n  ![](img/de3034a92496a32462134266292a51dd_179_0.png)\n\
    \n我们添加了一个根类别和一个子类别，但尚未查看创建它们的表单。我们将创建一个新类别，并逐步完成整个过程：\n\n1. 点击类别树中的**默认类别**以选择它：\n\
    \n   ![](img/de3034a92496a32462134266292a51dd_180_0.png)\n\n2. 点击屏幕左上角的“添加子类别”。\n\
    \n3. 在表单顶部区域添加以下信息：\n\n   - 启用类别：是\n   - 在菜单中显示：是\n   - 类别名称：示例类别\n\n这些字段不言自明。**在菜单中显示**字段允许您设置是否在店面的主导航菜单中显示该类别：\n\
    \n![](img/de3034a92496a32462134266292a51dd_181_0.png)\n\n4. 在**内容**部分设置以下信息：\n\
    \n   - **类别图片**：为类别添加横幅图片，如下面的屏幕截图所示：\n\n     ![](img/de3034a92496a32462134266292a51dd_181_1.png)\n\
    \n   - **描述：**为类别添加示例描述\n   - **添加 CMS 块：**你可以添加一个静态块，使其显示在该类别中\n\n5. 在“显示设置”中设置以下部分：\n\
    \n   ![](img/de3034a92496a32462134266292a51dd_182_0.png)\n\n在此部分中，你可以设置：\n\n-\
    \ **显示模式：**你可以选择仅显示产品、仅显示选定的静态块，或两者都显示。对于此类别，我们将选择**仅产品**。\n- **锚点：**如果你选择**是**，则该类别将在左侧边栏中显示分层导航筛选器。分层导航是一个块，可让你按属性（例如颜色或尺寸）筛选类别。我们将为此类别选择**是**。\n\
    \n6. 接下来，我们找到“搜索引擎优化”部分：\n\n   ![](img/de3034a92496a32462134266292a51dd_183_0.png)\n\
    \n此部分提供以下设置：\n\n- **URL 键**：你可以为该类别设置特定的 URL 键。对于此类别，我们将此字段留空，Magento 将根据类别标题创建\
    \ URL 键。\n- **元标题**：你可以设置用于搜索引擎优化的标题元标记。\n- **元关键字**：你可以设置用于搜索引擎优化的关键字元标记。\n-\
    \ **元描述**：你可以设置用于搜索引擎优化的描述元标记。\n\n我们将**元标题**、**元关键字**和**元描述**字段留空，Magento 将根据类别标题分配元标记。\n\
    \n7. 你可以通过“**类别中的产品**”部分选择与此类别关联的产品：\n\n"
