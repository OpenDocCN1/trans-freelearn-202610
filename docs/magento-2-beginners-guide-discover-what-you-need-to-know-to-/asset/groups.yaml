    \ This is an optional field to set an alternative location for static view files\n\
    \    - **Secure Base URL for User Media Files**: This is an optional field to\
    \ set an alternative location for user media files\n    - **Use Secure URLs on\
    \ Storefront**: Enable this setting to serve all the pages on the Storefront over\
    \ HTTPS\n    - **Use Secure URLs in Admin**: Enable this setting to serve all\
    \ the pages on the Storefront over HTTPS\n    - **Offloader header**: Set the\
    \ SSL offloader header value\n- **Default Pages:**\n  - **Default Web URL**: Relative\
    \ path to the folder in the Magento instance that contains the landing page\n\
    \  - **CMS Home Page**: Set the CMS page that will be displayed for the home page\n\
    \  - **Default No-route URL**: Relative path to the folder in the Magento instance\
    \ where the page is redirected when a 404 error occurs\n  - **CMS No Route Page**:\
    \ Set the CMS page that will be displayed for the 404 error page\n  - **CMS No\
