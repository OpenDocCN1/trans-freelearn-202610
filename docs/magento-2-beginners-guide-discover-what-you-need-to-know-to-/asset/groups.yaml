  mdcn: "\n你可以在 Magento 管理面板中找到用于选择作用域的下拉菜单。例如，对于系统配置值（商店 | 设置 | 配置），你可以在屏幕左上角找到作用域下拉菜单：\n\
    \n![](img/de3034a92496a32462134266292a51dd_220_0.png)\n\n### 小结\n\n在本章中，你了解了 Magento\
    \ 用于管理商店的层级系统。我们介绍了网站、商店和商店视图的概念，现在你已经清楚这些作用域之间的区别。在下一章中，我们将介绍 Magento 中的系统配置设置。\n\
    \n## 10 系统配置\n\n本章将涵盖以下内容：\n\n- 常规系统配置\n- 目录配置\n- 客户配置\n- 销售、配送和付款配置\n- 高级配置\n\
    \n### 系统配置部分和字段\n\n系统配置页面是管理面板中最重要的页面之一，原因在于你可以在这里配置所有 Magento 模块。\n\n你可以通过选择管理面板中的“商店\
    \ | 设置 | 配置”菜单项进入系统配置页面。屏幕上将显示以下页面：\n\n![](img/de3034a92496a32462134266292a51dd_222_0.png)\n\
    \n系统配置页面包含以下部分：\n\n- **常规：**\n  - 常规\n  - Web\n  - 设计\n  - 货币设置\n  - 商店电子邮件地址\n\
    \  - 联系人\n  - 报表\n  - 内容管理\n  - New Relic 报告\n- **目录：**\n  - 目录\n  - 库存\n  - XML\
    \ 站点地图\n  - RSS 源\n  - 邮件发送给朋友\n- **客户：**\n  - 新闻通讯\n  - 客户配置\n  - 愿望清单\n  - 促销\n\
    \  - 持久购物车\n- **销售：**\n  - 销售\n  - 销售电子邮件\n  - PDF 打印输出\n  - 税\n  - 结账\n  - 配送设置\n\
    \  - 多地址配送设置\n  - 配送方式\n  - Google API\n  - 付款方式\n- **服务：**\n  - Magento Web API\n\
    \  - OAuth\n- **高级：**\n  - 管理\n  - 系统\n  - 高级\n  - 开发\n\n我们将介绍系统配置中最重要的部分，并说明每个部分可以管理的内容。\n\
    \n### 常规 | 常规\n\n你可以从此部分更新以下设置：\n\n- **国家选项：**\n  - **默认国家**：你的业务所在的国家\n  - **允许国家**：你可以选择接受订单的国家\n\
    \  - **邮政编码/邮编可选的国家**：你可以指定不需要 ZIP/邮政编码信息的国家\n  - **欧盟国家**：你可以选择在欧盟开展业务的国家\n \
    \ - **热门目的地**：你可以定义在商店前台国家下拉菜单顶部显示的特定国家。根据此设置，下拉菜单将包含热门国家，如以下截图所示：\n\n![](img/de3034a92496a32462134266292a51dd_224_0.png)\n\
    \n- **州/省选项：**\n  - **必须填写州/省的国家**：你可以指定不需要州/省信息的国家\n  - **若国家未强制要求，允许选择州/省**：如果此设置设为**是**，州/省将作为可选字段包含在商店前台中。如果此设置设为**否**，则该字段不会显示在商店前台中。\n\
    - **区域设置选项：**\n  - **时区**：选择你的时区\n  - **区域**：选择商店的语言\n  - **重量单位**：设置商店的重量单位（磅或千克）\n\
    \  - **每周第一天**：选择你所在位置被视为一周第一天的日期\n  - **周末日**：选择你所在位置被视为周末的日子\n- **商店信息：**你的业务的一般信息，包括：\n\
    \  - **商店名称**\n  - **商店电话号码**\n  - **商店营业时间**\n  - **国家**\n  - **地区/州**\n  - **邮政编码**\n\
    \  - **城市**\n  - **街道地址**\n  - **街道地址第二行**\n  - **增值税号**\n- **单商店模式：**\n  - **启用单商店模式**：你可以将此设置设为**是**，通过关闭所有商店视图和作用域指示器来简化页面显示\n\
    \n### 常规 | Web\n\n- **URL 选项：**\n  - **在 URL 中添加商店代码**：如果将此设置设为**是**，商店 URL 将包含商店代码，例如\
    \ `http://www.magento2-playground.dev/[store-code]/url-key`\n  - **自动重定向到基础 URL**：当请求的\
    \ URL 不同时重定向到基础 URL，例如从 `http://magento2-playground.dev/store/` 重定向到 `http://www.magento2-playground.com/store/`\n\
    - **搜索引擎优化：**\n  - **使用 Web 服务器重写**：当此设置禁用时，URL 在基础 URL 后包含 `index.php`，例如 `http://magento2-playground.dev/index.php/url-key`。当此设置启用时，URL\
    \ 在基础 URL 后不包含 `index.php`。\n- **基础 URL：**\n  - **基础 URL**：设置非安全基础 URL，例如 `http://magento2-playground.dev/`\n\
    \  - **基础链接 URL**：设置用于创建指向非安全基础 URL 的相对链接的占位符\n  - **静态视图文件的基础 URL**：这是一个可选字段，用于设置静态视图文件的替代位置\n\
    \  - **用户媒体文件的基础 URL**：这是一个可选字段，用于设置用户媒体文件的替代位置\n  - **基础 URL（安全）：**\n    - **安全基础\
    \ URL**：设置安全基础 URL，例如 `https://magento2-playground.dev/`\n    - **安全基础链接 URL**：设置用于创建指向安全基础\
    \ URL 的相对链接的占位符\n    - **静态视图文件的安全基础 URL**：这是一个可选字段，用于设置静态视图文件的替代位置\n    - **用户媒体文件的安全基础\
    \ URL**：这是一个可选字段，用于设置用户媒体文件的替代位置\n    - **在商店前台使用安全 URL**：启用此设置以通过 HTTPS 提供商店前台的所有页面\n\
    \    - **在管理面板中使用安全 URL**：启用此设置以通过 HTTPS 提供商店前台的所有页面\n    - **卸载器标头**：设置 SSL 卸载器标头值\n\
    - **默认页面：**\n  - **默认 Web URL**：Magento 实例中包含落地页的文件夹的相对路径\n  - **CMS 主页**：设置将显示为首页的\
    \ CMS 页面\n  - **默认无路由 URL**：当发生 404 错误时，Magento 实例中页面重定向到的文件夹的相对路径\n  - **CMS\
    \ 无路由页面**：设置将显示为 404 错误页面的 CMS 页面\n  - **CMS 无 Cookie 页面**：设置当浏览器中禁用 Cookie 时显示的\
    \ CMS 页面\n  - **为 CMS 页面显示面包屑**：指定是否为 CMS 页面显示面包屑\n\n### 常规 | 货币设置\n\n- **货币选项：**\n\
    \  - **基础货币**：设置商店交易的主要货币\n  - **默认显示货币**：设置在商店前台产品价格中显示的货币\n  - **允许的货币**：设置商店交易接受的货币\n\
    \n### 常规 | 商店电子邮件地址\n\n- **一般联系 / 销售代表 / 客户支持 / 自定义电子邮件 1 / 自定义电子邮件 2：**\n  -\
    \ **发件人名称**：为每种联系类型设置发件人名称\n  - **发件人电子邮件**：为每种联系类型设置电子邮件地址\n\n### 常规 | 联系人\n\n\
    - **联系我们：**\n  - **启用联系我们**：在商店前台启用联系我们页面\n- **电子邮件选项：**\n  - **发送电子邮件至**：将联系电子邮件发送到指定的电子邮件地址\n\
    \  - **电子邮件发件人**：设置将成为联系电子邮件发件人的联系类型\n  - **电子邮件模板**：设置联系电子邮件的电子邮件模板\n\n### 常规\
    \ | 内容管理\n\n- **WYSIWYG 选项：**\n  - **启用 WYSIWYG 编辑器**：当此设置禁用时，WYSIWYG 编辑器将不会显示，管理面板中的文本区域字段将使用纯文本\n\
    \n### 目录 | 目录\n\n- **商店前台：**\n  - **列表模式**：设置产品列表页的显示模式。可能的值有：\n    - 仅网格\n  \
    \  - 仅列表\n    - 网格（默认） / 列表\n    - 列表（默认） / 网格\n\n"
