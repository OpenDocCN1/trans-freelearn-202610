    The process is the same for the **Database and Media Backup** and **Database Backup**.
    Now, we should really consider automating this process so that we always have
    a backup for our Magento store.


    Magento allows you to schedule the backup to be automatically created on a regular
    basis by the system. In order to do so, you should go to the store configuration
    page (**STORES | Configuration**), and click on **ADVANCED | System**.


    On this page, you will see the **Scheduled Backup Settings** section:


    ![](img/de3034a92496a32462134266292a51dd_392_0.png)'
  - '[PAGE 393]


    # Store Maintenance


    If you select Yes in the Enable Scheduled Backup field, the following form will
    be displayed:


    ![](img/de3034a92496a32462134266292a51dd_393_0.png)


    From there, you can choose the backup type for the scheduled backup, the start
    time, and the frequency and also define whether the website should be put into
    maintenance mode during backup. It''s recommended to schedule the backup to be
    done on a daily basis at night when the store has less traffic, for example, every
    day at 2 AM.


    In addition to the admin panel backup, you can create a backup using the Magento
    2 command-line tool.


    In order to do that, you should go to the Terminal and change the current directory
    to the document root for your Magento 2 instance.


    If you run php bin/magento, you will see the setup:backup command to create the
    backup, which backs up the Magento application code base, media, and database.


    In addition to that, the setup:rollback command is available to restore a backup,
    which rolls back Magento Application code base, media, and database.'
  - '[PAGE 394]


    In order to create the backup, you should pass the type of backup to be created
    as a parameter. The available arguments are:


    +   - `--code`

    +   - `--media`

    +   - `--db`


    As you can tell by the name of each parameter, you will be able to specify whether
    the code base, media, and database should be included in the backup.


    For example, to create a code base and database backup, you should run the following
    command:


    ```

    php bin/magento setup:backup --code --db

    ```


    As you can see in the following screenshot, you can keep track of the progress
    from the command-line output:


    ![](img/de3034a92496a32462134266292a51dd_394_0.png)'
  - '[PAGE 395]


    You can see a list of available backups by running the `magento info:backups:list`
    command:


    ![](img/de3034a92496a32462134266292a51dd_395_0.png)


    This is essential to know since the `setup:rollback` command requires you to specify
    the name of the file to restore each of the parameters:


    ```

    magento setup:rollback [-c|--code-file="<name>"] [-m|--media-file="<name>"]

    [-d|--db-file="<name>"]

    ```


