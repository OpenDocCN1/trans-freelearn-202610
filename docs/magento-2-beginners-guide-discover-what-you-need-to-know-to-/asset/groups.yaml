    # About the Author


    **Gabriel Guarino** has been working with Magento since 2009.


    As a Magento specialist he has achieved all the Magento certifications. He is
    an active member of the community and has been recognized as a Magento Master
    for 2017.


    He is the Chief Operating Officer of Wagento, a full-service Magento Solution
    Partner with offices in USA, Mexico, Bolivia, India, and Argentina.


    He is also a moderator in Magento forums, and he is a frequent speaker at Magento
    events.'
