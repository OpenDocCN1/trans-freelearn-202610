    \ Magento and the product relations.\n\n## 6 Product Types\n\nWe will go through\
    \ the following sections in this chapter:\n\n- Introduction to the different product\
    \ types in Magento\n- Simple products\n- Configurable products\n- Grouped products\n\
    - Virtual products\n- Bundle products\n- Downloadable products\n\n### Introduction\
    \ to the different product types in Magento\n\nOne of the most important features\
    \ of Magento are the product types. The different product types allow you to set\
    \ up products in different ways, for example, by offering a group of products\
    \ in the product details page or by allowing the customer to buy downloadable\
    \ products.\n\nThere are six product types in Magento:\n\n- Simple products\n\
    - Configurable products\n- Grouped products\n- Virtual products\n- Bundle products\n\
    - Downloadable products\n\nYou can see the list with the help of the following\
    \ steps:\n\n1. Go to the following section in the admin panel:\n   **Products\
    \ | Inventory | Catalog**\n2. Click on the arrow inside the **Add Product** button\
    \ on the top-right corner of the screen:\n\n   ![](img/de3034a92496a32462134266292a51dd_134_0.png)\n\
    \nIt's important to mention that Magento can set the correct product type based\
    \ on the information from the product. For example, if you add a new product with\
    \ no weight, Magento will create a virtual product.\n\nYou will see the new attributes\
    \ that we included in the previous step:\n\n![](img/de3034a92496a32462134266292a51dd_137_0.png)\n\
    \n3. We will update the information on the product as follows:\n\n- Product Name:\
    \ Red Shirt - Men - L\n- Color: Red\n- Size: L\n- Gender: Men\n\n4. Next, click\
    \ on Save, and then re-index the catalog as we saw in the previous sections.\n\
    \nIf we go back to the Storefront and open the product details page for the Red\
    \ Shirt product, we will see the updated product showing all the information that\
    \ we need for that simple product:\n\n![](img/de3034a92496a32462134266292a51dd_138_0.png)\n\
    \n### Configurable products\n\nNow, imagine if you have shirts in different sizes\
    \ and colors. If you add all of them as simple products and display them in the\
    \ catalog, the result would be several red shirts that look exactly the same in\
    \ the product listing page. It would be difficult to find the shirt that you need,\
    \ and it would be visually confusing.\n\nFortunately, Magento allows you to create\
    \ products that can be configured from the product details page. In our example,\
    \ you will have a shirt product with multiple options to select the color and\
    \ size from the product details page.\n\nThis is the concept of a configurable\
    \ product. Configurable products are made of simple products that are associated.\
    \ When the customer chooses a combination in the configurable product, the customer\
    \ is actually choosing which simple product will be added to the cart from the\
    \ configurable product page.\n\nLet's create the first configurable product: Shirt.\
    \ In order to do that, we will follow these steps:\n\n1. Go to the PRODUCTS |\
    \ Inventory | Catalog page and select Red Shirt.\n2. Click on the arrow inside\
    \ the Add Product button, and select Configurable Product.\n\n   ![](img/de3034a92496a32462134266292a51dd_139_0.png)\n\
    \n3. Set the following information for the configurable product:\n\n   **General\
    \ Information:**\n\n   - Enable Product: Yes\n   - Attribute Set: Shirt\n   -\
    \ Product Name: Shirt\n   - SKU: shirt\n   - Price: $50\n   - Tax Class: Taxable\
    \ Goods\n   - Quantity: 100\n   - Stock Status: In Stock\n   - Weight: 1 lbs.\n\
    \   - **Visibility:** Catalog, Search\n   - **Categories:** Default Category |\
    \ Men | Tops\n   - **Sleeve Length:** None\n   - **Color:** None\n   - **Size:**\
    \ None\n   - **Gender:** None\n\n   **Configurations:**\n\n   - **Create Configurations:**\
    \ Click on this button to open the **Create Product Configurations** window, as\
    \ shown in the following screenshot:\n\n     ![](img/de3034a92496a32462134266292a51dd_140_0.png)\n\
    \n4. Follow these steps to create different configurations (simple products) for\
    \ the configurable product:\n\n    - **Step 1: Select Attributes:** Choose the\
    \ configurable attributes for the product. The list of configurable attributes\
    \ from the selected attribute set will be displayed in the list. Select **color**\
    \ and **size**, and click on the **Next** button on the top-right corner of the\
    \ screen:\n\n      ![](img/de3034a92496a32462134266292a51dd_141_0.png)\n\n   \
    \ - **Step 2: Attribute Values:** In this step, you can select which combinations\
    \ will be available for the product. Each unique combination will create a new\
    \ simple product.\n\n      Select the following colors:\n\n      - **Black**\n\
    \      - **Blue**\n      - **Green**\n      - **White**\n\n      Then, select\
    \ the following sizes:\n\n      - S\n      - M\n      - L\n      - XL\n\n    \
    \  ![](img/de3034a92496a32462134266292a51dd_142_0.png)\n\n    - **Step 3: Bulk\
