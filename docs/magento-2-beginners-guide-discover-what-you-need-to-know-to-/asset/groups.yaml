    \ at this time**: You can skip this step and upload the images later.\n\n    \
    \  **Quantity:**\n\n      - **Apply single quantity to each SKUs**: Set 100 as\
    \ the quantity for all product combinations\n\n    - **Step 4: Summary**: In this\
    \ step, you can review all the product combinations that will be created for the\
    \ configurable product. Once you review the list of products, you can click on\
    \ **Next** to finish the product configuration:\n\n      ![](img/de3034a92496a32462134266292a51dd_145_0.png)\n\
    \n5. Lastly, we will upload an image for the configurable product. The process\
    \ is the same as the one we followed when we uploaded images for Red Shirt in\
    \ Chapter 4, Creating Your First Product, Images, Inventory, and Prices.\n\n \
    \  For this configurable product, I created a special image showing the different\
    \ colors in just one image:\n\n   ![](img/de3034a92496a32462134266292a51dd_146_0.png)\n\
    \n6. Finally, click on Save to add the product to the catalog. We are ready to\
    \ save the configurable product and review how it looks on the Storefront.\n\n\
    \   Here is how the configurable product looks in the product listing page:\n\n\
    \   ![](img/de3034a92496a32462134266292a51dd_147_0.png)\n\n   If you click on\
    \ the blue swatch, you will see that the image is updated in the product listing\
    \ page:\n\n   ![](img/de3034a92496a32462134266292a51dd_147_1.png)\n"
  mdcn: "\n\n## 摘要\n\n在本章中，我们创建了一个属性和一个属性集，并将该属性集与产品关联。现在你可以通过属性添加新特性并通过属性集对它们进行分组来自定义产品。在下一章中，我们将介绍\
    \ Magento 中的不同产品类型和产品关系。\n\n## 6 产品类型\n\n本章我们将介绍以下部分：\n\n- Magento 中不同产品类型的介绍\n\
    - 简单产品\n- 可配置产品\n- 组合产品\n- 虚拟产品\n- 捆绑产品\n- 可下载产品\n\n### Magento 中不同产品类型的介绍\n\n\
    Magento 最重要的功能之一就是产品类型。不同的产品类型允许你以不同的方式设置产品，例如，在产品详情页中提供一组产品，或允许客户购买可下载产品。\n\n\
    Magento 中有六种产品类型：\n\n- 简单产品\n- 可配置产品\n- 组合产品\n- 虚拟产品\n- 捆绑产品\n- 可下载产品\n\n你可以通过以下步骤查看列表：\n\
    \n1. 在管理面板中进入以下部分：\n   **Products | Inventory | Catalog**\n2. 点击屏幕右上角 **Add Product**\
    \ 按钮内的箭头：\n\n   ![](img/de3034a92496a32462134266292a51dd_134_0.png)\n\n需要提到的是，Magento\
    \ 可以根据产品信息设置正确的产品类型。例如，如果你添加一个没有重量的新产品，Magento 将创建一个虚拟产品。\n\n你将看到我们在上一步中包含的新属性：\n\
    \n![](img/de3034a92496a32462134266292a51dd_137_0.png)\n\n3. 我们将按如下方式更新产品信息：\n\n\
    - Product Name: Red Shirt - Men - L\n- Color: Red\n- Size: L\n- Gender: Men\n\n\
    4. 接下来，点击保存，然后像我们在前几节中看到的那样重新索引目录。\n\n如果我们返回 Storefront 并打开 Red Shirt 产品的产品详情页，我们将看到更新后的产品显示了该简单产品所需的所有信息：\n\
    \n![](img/de3034a92496a32462134266292a51dd_138_0.png)\n\n### 可配置产品\n\n现在，假设你有不同尺寸和颜色的衬衫。如果将它们全部添加为简单产品并在目录中显示，结果将在产品列表页中出现几件看起来完全相同的红衬衫。找到所需的衬衫会很困难，而且在视觉上会令人困惑。\n\
    \n幸运的是，Magento 允许你创建可在产品详情页中配置的产品。在我们的示例中，你将拥有一个衬衫产品，可以从产品详情页中选择颜色和尺寸等多个选项。\n\n\
    这就是可配置产品的概念。可配置产品由关联的简单产品组成。当客户在可配置产品中选择一种组合时，客户实际上是从可配置产品页面中选择哪个简单产品将被添加到购物车。\n\
    \n让我们创建第一个可配置产品：Shirt。为此，我们将遵循以下步骤：\n\n1. 进入 PRODUCTS | Inventory | Catalog 页面并选择\
    \ Red Shirt。\n2. 点击 Add Product 按钮内的箭头，并选择 Configurable Product。\n\n   ![](img/de3034a92496a32462134266292a51dd_139_0.png)\n\
    \n3. 为可配置产品设置以下信息：\n\n   **General Information:**\n\n   - Enable Product: Yes\n\
    \   - Attribute Set: Shirt\n   - Product Name: Shirt\n   - SKU: shirt\n   - Price:\
    \ $50\n   - Tax Class: Taxable Goods\n   - Quantity: 100\n   - Stock Status: In\
    \ Stock\n   - Weight: 1 lbs.\n   - **Visibility:** Catalog, Search\n   - **Categories:**\
    \ Default Category | Men | Tops\n   - **Sleeve Length:** None\n   - **Color:**\
    \ None\n   - **Size:** None\n   - **Gender:** None\n\n   **Configurations:**\n\
    \n   - **Create Configurations:** 点击此按钮以打开 **Create Product Configurations** 窗口，如以下屏幕截图所示：\n\
    \n     ![](img/de3034a92496a32462134266292a51dd_140_0.png)\n\n4. 按照以下步骤为可配置产品创建不同的配置（简单产品）：\n\
    \n    - **Step 1: Select Attributes:** 选择产品的可配置属性。所选属性集的可配置属性列表将显示在列表中。选择 **color**\
    \ 和 **size**，然后点击屏幕右上角的 **Next** 按钮：\n\n      ![](img/de3034a92496a32462134266292a51dd_141_0.png)\n\
    \n    - **Step 2: Attribute Values:** 在此步骤中，你可以选择产品可用的组合。每个唯一组合将创建一个新的简单产品。\n\n\
    \      选择以下颜色：\n\n      - **Black**\n      - **Blue**\n      - **Green**\n   \
    \   - **White**\n\n      然后，选择以下尺寸：\n\n      - S\n      - M\n      - L\n     \
    \ - XL\n\n      ![](img/de3034a92496a32462134266292a51dd_142_0.png)\n\n    - **Step\
    \ 3: Bulk Images, Price, and Quantity:** 在步骤标题下方，你将看到根据你在上一步中选择的设置将创建的简单产品数量。在此步骤中，你可以自定义每个产品组合的图像、价格和数量。\n\
    \n      **Create Product Configurations**\n\n      **Step 3: Bulk Images, Price\
    \ and Quantity**\n\n      Based on your selections 16 new products will be created.\
    \ Use this step to customize images and price for your new products.\n\n     \
    \ **Images**\n\n      - Apply single set of images to all SKUs\n      - Apply\
    \ unique images by attribute to each SKU\n      - Skip image uploading at this\
    \ time\n\n      **Price**\n\n      - Apply single price to all SKUs\n      - Apply\
    \ unique prices by attribute to each SKU\n      - Skip price at this time\n\n\
    \      **Quantity**\n\n      - Apply single quantity to each SKUs\n      - Apply\
    \ unique quantity by attribute to each SKU\n      - Skip quantity at this time\n\
    \n      你可以从以下选项中进行选择：\n\n      **Images:**\n\n      - **Apply a single set of\
    \ images to all SKUs**: 如果选择此选项，你将能够上传一组图像并将其应用于所有产品组合。\n      - **Apply unique\
    \ images by attribute to each SKU**: 通过选择此选项，你将能够选择一个可配置属性，然后为每个属性值上传图像。例如，我们可以选择\
    \ Color，然后为产品的每种颜色上传图像。\n      - **Skip image uploading at this time**: 你可以跳过此步骤并稍后上传图像。\n\
    \n      **Quantity:**\n\n      - **Apply single quantity to each SKUs**: 将 100\
    \ 设置为所有产品组合的数量\n\n    - **Step 4: Summary**: 在此步骤中，你可以查看将为可配置产品创建的所有产品组合。查看完产品列表后，你可以点击\
    \ **Next** 完成产品配置：\n\n      ![](img/de3034a92496a32462134266292a51dd_145_0.png)\n\
    \n5. 最后，我们将为可配置产品上传一张图片。流程与我们在第 4 章《创建你的第一个产品、图像、库存和价格》中为 Red Shirt 上传图片时遵循的流程相同。\n\
    \n   对于此可配置产品，我创建了一张特殊图片，展示了多种颜色在一张图片中：\n\n   ![](img/de3034a92496a32462134266292a51dd_146_0.png)\n\
    \n6. 最后，点击保存将产品添加到目录。我们准备好保存可配置产品并查看其在 Storefront 上的显示效果。\n\n   这是可配置产品在产品列表页中的显示效果：\n\
    \n   ![](img/de3034a92496a32462134266292a51dd_147_0.png)\n\n   如果你点击蓝色色块，你会看到产品列表页中的图片已更新：\n\
    \n   ![](img/de3034a92496a32462134266292a51dd_147_1.png)\n\n"
