    \  - 总结 — 375\n- 第 21 章：商店维护 — 376\n  - 备份、恢复和数据库管理 — 376\n  - 性能调优 — 383\n  -\
    \ 搜索引擎优化 — 394\n  - 缓存和索引管理 — 400\n  - 将 Magento 升级到新版本 — 403\n  - 总结 — 411\n\
    - 索引 — 412\n\n## 前言\n\n这不仅仅是一本书，更是一本参考指南。现实是，你必须在需要时准确获取正确的信息；因此，本书的目标是涵盖你管理商店所需了解的一切。第一次阅读本书时，你将能够理解与管理\
    \ Magento 商店相关的所有概念，之后你可以将本书作为参考，在每次需要时快速翻阅相关页面。本书由四部分组成。我们首先了解 Magento 是什么、为什么以及如何使用它，以及是否可以将旧版网络商店迁移到\
    \ Magento 2。迁移部分仅对那些希望通过将旧网站迁移到新平台来赋予其新生命的人感兴趣。我们将向你介绍主要的电子商务概念和基本功能，并让你动手实践，从而体验目录和内容管理的工作方式。我们将演示如何优化你的商店以供正确使用。最后，我们将认真起来，尝试将你的示例商店转变为真正的网络商店，并教你如何实际运营它。\n\
    \n## 本书涵盖内容\n\n- 第 1 章，Magento 2 简介，涵盖 Magento 是什么、你可以用它做什么、与最受欢迎的竞争对手的比较，以及 Magento\
    \ 2 新功能的逐步讲解。\n- 第 2 章，安装，介绍 Magento 的系统要求、在本地计算机上安装 Magento、选择托管提供商以及在其中安装 Magento。\n\
    - 第 3 章，迁移，探讨现有 Magento 用户如何将其网络商店从 Magento 1 迁移到 Magento 2，并包含详细指南和建议。\n- 第 4\
    \ 章，创建你的第一个产品、图像、库存和价格，教你如何向商店添加产品并包含详细描述、图像、价格和库存信息。\n- 第 5 章，属性集和自定义属性，讲解如何使用产品属性集和产品属性。\n\
    - 第 6 章，产品类型，描述所有支持的默认产品类型，以及可配置产品、分组产品和可下载产品的使用。\n- 第 7 章，类别，涵盖 Magento 商店中的类别管理。\n\
    - 第 8 章，CMS 页面、块和部件，涵盖使用页面、块和部件为 Magento 商店添加内容。\n- 第 9 章，管理作用域和区域设置，解释作用域——Magento\
    \ 最基本的概念之一——以及如何设置它。\n- 第 10 章，系统配置，回顾 Magento 中最重要的系统配置部分和字段。\n- 第 11 章，客户管理，教你管理\
    \ Magento 商店中的客户账户。\n- 第 12 章，管理员用户和角色，涵盖管理员用户管理、向特定角色授予权限以及基本安全。\n- 第 13 章，税，解释正确计算税费如何让你在向不同区域和不同配送点提供不同类型产品时感到安全。\n\
    - 第 14 章，目录和购物车价格规则，教你价格规则——一种将 Magento 商店提升到专业水平的基本营销工具；你可以基于各种条件管理折扣和优惠券。\n\
    - 第 15 章，处理付款，概述默认的 Magento 付款方式、为 Magento 商店设置 PayPal 以及 PCI 合规性。\n- 第 16 章，配置配送，概述默认的\
    \ Magento 配送方式，并讲解如何设置 UPS 配送。\n- 第 17 章，订单履行，带你了解订单履行；通过观察 Magento 中订单的生命周期，发现处理订单履行的选项。\n\
    - 第 18 章，事务性电子邮件和新闻通讯，讲解新闻通讯和事务性电子邮件的设置，以便来自网站的通信与网站的外观和感觉相符。\n- 第 19 章，报告，教你如何生成报告以跟踪\
    \ Magento 商店的活动和转化率。\n- 第 20 章，*自定义您的 Magento 商店*，讲解如何管理 Magento 主题、使用行内翻译工具，以及浏览\
    \ Magento 市场以查找新扩展、主题和语言包。\n- 第 21 章，*商店维护*，教你如何在搜索引擎中定位网站、缓存和索引管理、性能调优和 Magento\
    \ 备份，以及如何将 Magento 升级到新版本。\n\n## 阅读本书需要什么\n\n阅读本书并按照各章节的指南操作不需要任何技术技能。\n\n## 本书适合谁阅读\n\
    \n本书面向商家、电子商务经理和商店管理员。更进一步说，本书适合每一个有好产品要销售但需要指导的人。\n\n## 约定\n\n在本书中，你会看到多种文本样式，用于区分不同类型的信息。以下是这些样式的一些示例及其含义说明。\n\
    \n文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟 URL、用户输入和 Twitter 用户名显示如下：“接下来的代码行读取链接并将其赋值给\
    \ BeautifulSoup 函数。” 任何命令行输入或输出写为以下形式：\n\n```bash\nphp bin/magento indexer:reindex\n\
    ```\n\n**新术语和重要词语**以粗体显示。你在屏幕上看到的文字，例如菜单或对话框中的文字，在文本中显示如下：“要重新建立索引，你可以在最新截图的弹出窗口中点击\
    \ **索引器无效** 链接，或者转到 **系统 | 工具 | 索引管理** 菜单项。”\n\n警告或重要说明会出现在这样的方框中。\n\n提示和技巧显示如下。\n\
    \n## 读者反馈\n\n我们始终欢迎读者的反馈。请告诉我们您对本书的看法——喜欢什么或不喜欢什么。读者反馈对我们非常重要，因为它帮助我们开发出您真正能从中获益的图书。要向我们发送一般反馈，只需发送电子邮件至\
    \ feedback@packtpub.com，并在邮件主题中提及本书书名。如果您在某主题方面有专长，并且对撰写或参与编写图书感兴趣，请参阅我们的作者指南\
