  mdcn: "\n\n## 自托管服务器\n\n我们有自托管服务器；当你选择这种类型的服务器时，配置、升级和监控都是用户的责任。\n\n这对于高级用户或拥有自己的系统管理员的商家来说是最好的选择。你可以完全控制服务器，这在管理\
    \ Magento 商店时非常重要。同时，如果服务器宕机或出现其他与服务器相关的问题，你需要负责解决紧急情况。\n\n当你选择这种类型的服务器时，你应该具备服务器管理知识，或者找到一位真正优秀的系统管理员来处理紧急情况并正确配置服务器。\n\
    \n以下是 Magento 推荐的自托管服务器列表：\n\n- Amazon EC2: https://aws.amazon.com/ec2/\n- DigitalOcean:\
    \ https://www.digitalocean.com/\n- Linode: https://www.linode.com/\n\n## 在 Amazon\
    \ EC2 中安装 Magento\n\n在本节中，我们将从零开始在 Amazon 上设置服务器。服务器将准备好用于 Magento，并安装了所有要求和依赖项，以便你可以管理你的第一个\
    \ Magento 开发服务器。\n\n## 设置 Amazon AWS 账户\n\n第一步是设置你的 Amazon AWS 账户，以便在 Amazon EC2\
    \ 中创建服务器实例。\n\n### 安装\n\n要做到这一点，你应该按照以下步骤操作：\n\n1. 访问 Amazon AWS 首页 `https://aws.amazon.com/`。它看起来会是这样：\n\
