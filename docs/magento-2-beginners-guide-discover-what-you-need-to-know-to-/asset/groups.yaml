    be displayed:


    ![](img/de3034a92496a32462134266292a51dd_382_1.png)'
  - '[PAGE 383]


    # Customizing Your Magento Store


    From there, you can specify whether the translation will be specific to the current
    store view, and then you can set the custom text. In the example below, we replaced
    `Create an Account` with **Register**.


    ![](img/de3034a92496a32462134266292a51dd_383_0.png)


    Now, consider that the inline translation tool has been enabled without restrictions.
    This means that anybody who has access to the website can see the tool, and they
    can change the text in your Magento store. This is dangerous and should be avoided.


    In order to prevent that, Magento allows you to restrict the inline translation
    tool just for your computer. You can do this by specifying your IP address in
    the **ADVANCED | Developer | Allowed IPs (comma-separated)** section of the store’s
    **Configuration** page (**Stores | Configuration**):'
