    \ Magento 论坛上获取 Magento 社区的反馈\n\n## Summary\n\n在本章中，我们回顾了 Magento 2 以及在平台新版本中引入的变更。我们还分析了电子商务解决方案的类型以及最重要的可用平台。在下一章中，我们将回顾安装\
    \ Magento 2 以开始使用该平台的过程。\n\n## 2\n\n### Installation\n\n在本章中，我们将介绍在 Linux 服务器上安装\
