    \  - PHP 5.6.x (Magento 2.1.0)\n- Required PHP extensions:\n  - BC Math\n  - curl\n\
    \  - GD, ImageMagick 6.3.7 (or later), or both\n  - intl\n  - mbstring\n  - Mcrypt\n\
    \  - Mhash\n  - OpenSSL\n  - PDO/MySQL\n  - SimpleXML\n  - OPCache\n  - SOAP\n\
    \  - xml\n  - XSL\n  - Zip\n  - JSON (PHP 7 only)\n  - iconv (PHP 7 only)\n\n\
    ## Installation\n\n- PHP Dependency Manager:\n  - Composer\n- SSL:\n  - Valid\
    \ security certificate (required for HTTPS)\n  - **Transport Layer Security (TLS)**\
