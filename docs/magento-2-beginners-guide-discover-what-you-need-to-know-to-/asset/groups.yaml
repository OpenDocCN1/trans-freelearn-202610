  mdcn: "\n\n## 总结\n\n在本章中，我们回顾了 Magento 默认支付方式的列表，并为商店实现了 **PayPal Express Checkout**。此外，我们还讨论了\
    \ PCI 合规性和 SSL 加密。\n\n在下一章中，我们将讨论 Magento 2 中包含的不同配送方式，我们将设置 UPS 作为配送方式，并介绍我们\
    \ Magento 商店额外配送方式的配置。\n\n## 16 配置配送\n\n我们将在本章中介绍以下内容：\n\n- Magento 默认配送方式概述\n\
    - 如何设置 UPS 配送\n- 其他承运商\n\n### Magento 默认配送方式概述\n\n在本章中，我们将逐步介绍 Magento 配送方式的配置。所有配置部分都位于\
    \ STORES | Configuration | SALES | Shipping Methods 页面。\n\n### 统一费率\n\n让我们从查看\
    \ **统一费率** 开始。如果您展开此部分，将看到以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_305_0.png)\n\
    \n这是将应用于您商店订单的预定义费用。定义为配送成本的金额是固定的，取决于您在管理面板中设置的配置。\n\n要配置此方法，您应该更新以下字段：\n\n-\
    \ **启用：** 指定 **统一费率** 是否应作为店面（Storefront）上的配送方式可用。\n- **标题：** 配送方式的描述性标题。\n- **方法名称：**\
    \ 这是在店面（Storefront）上显示在费率旁边的标签。\n\n- **类型：** 这是 Magento 为配送方式设置费率所进行的计算。可用的类型如下：\n\
    \  - **无：** 统一费率作为配送方式在店面（Storefront）上可用，但费率为零（免费配送）\n  - **按订单：** 定义为 **统一费率**\
    \ 配送方式价格的金额将按订单收取\n  - **按项目：** 定义为 **统一费率** 配送方式价格的金额将乘以购物车中的项目数量，以设置订单的配送费率\n\
    - **价格：** 这是将根据前一个字段中选择的选项用于计算最终配送费率的金额。\n- **计算手续费：** 设置手续费是根据前一个字段中定义的价格计算的固定金额还是百分比。\n\
    - **手续费：** 这将是用于计算手续费的固定金额或百分比。\n- **显示的错误消息：** 当配送方式不可用时要显示的错误消息。\n- **运送到适用的国家/地区：**\
    \ 指定配送方式应对所有国家/地区可用，还是仅对特定国家/地区可用。如果您选择特定国家/地区，将启用 **运送到特定国家/地区** 下拉列表，以选择此配送方式可用的国家/地区。\n\
    - **排序顺序：** 设置顺序以确定 **统一费率** 在店面（Storefront）可用配送方式列表中的位置。数字越低，它在列表中显示的位置越高。\n\n\
    ### 免费配送\n\n下一个可用的配送方式是 **免费配送**。如果您展开该部分，将看到以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_307_0.png)\n\
    \n**免费配送** 方法，顾名思义，是专门为免费配送配置特定配送方式的功能。这是在线商店中最常见的促销活动之一，您可以指定规则，使免费配送在特定场景下可用，从最低订单金额到应满足的购物车价格规则，以允许订单享受\
    \ **免费配送**。\n\n以下字段可用于配置配送方式：\n\n- **启用：** 指定 **免费配送** 是否应作为店面（Storefront）中的配送方式可用。\n\
    - **标题：** 配送方式的描述性标题。\n- **方法名称：** 这是在店面（Storefront）上显示在费率旁边的标签。\n- **最低订单金额：**\
    \ 设置订单符合免费配送条件所需的最低金额。\n\n- **显示的错误消息：** 当配送方式不可用时要显示的错误消息。\n- **运送到适用的国家/地区：**\
    \ 指定配送方式应对所有国家/地区可用，还是仅对特定国家/地区可用。如果您选择特定国家/地区，将启用 **运送到特定国家/地区** 下拉列表，以选择此配送方式可用的国家/地区。\n\
    - **排序顺序：** 设置顺序以确定 **免费配送** 在店面（Storefront）可用配送方式列表中的位置。数字越低，它在列表中显示的位置越高。\n\n\
    ### 表费率\n\n接下来，我们将找到可作为配送方式配置的 **表费率**。如果您展开 **表费率** 部分，将看到以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_308_0.png)\n\
    \n这种配送方式允许您定义一个 CSV 文件来计算配送费率。CSV 文件的格式取决于配送计算的条件。您可以选择以下任一条件：\n\n- **重量与目的地**\n\
    - **价格与目的地**\n- **商品数量与目的地**\n\n表费率配送方式配置中提供以下字段：\n\n- **启用：** 指定表费率是否应作为店面（Storefront）上的配送方式可用。\n\
    - **标题：** 配送方式的描述性标题。\n- **方法名称：** 这是在店面（Storefront）上显示在费率旁边的标签。\n- **条件：** 这是根据您上传的表格计算费率的条件。可用的条件有：\n\
    \  - **重量与目的地**\n  - **价格与目的地**\n  - **商品数量与目的地**\n- **在价格计算中包括虚拟产品：** 定义是否应将虚拟产品包含在费率计算中。由于表费率配送用于根据客户地址（距离）计算价格，因此大多数情况下此选项设置为“否”，因为虚拟产品是通过电子邮件交付的。\n\
    - **计算手续费：** 设置手续费是根据前一个字段中定义的价格计算的固定金额还是百分比。\n- **手续费：** 这将是用于计算手续费的固定金额或百分比。\n\
    - **显示的错误消息：** 当配送方式不可用时要显示的错误消息。\n- **运送到适用的国家/地区：** 指定配送方式应对所有国家/地区可用，还是仅对特定国家/地区可用。如果您选择特定国家/地区，将启用“运送到特定国家/地区”下拉列表，以选择此配送方式可用的国家/地区。\n\
    - **排序顺序：** 设置顺序以确定统一费率在店面（Storefront）可用配送方式列表中的位置。数字越低，它在列表中显示的位置越高。\n\n现在，要为表费率方法上传\
    \ CSV 文件，您应该使用屏幕左上角的下拉列表按网站进行筛选。之后，表费率表单中将出现两个新字段：导出和导入。您可以在以下截图中看到用于按网站筛选的下拉列表和新字段：\n\
    \n![](img/de3034a92496a32462134266292a51dd_310_0.png)\n\n您可以使用“导出”字段中的“导出 CSV”按钮导出表费率配送方式的当前\
    \ CSV。如果您尚未上传 CSV，则可以下载 Magento 默认附带的 CSV。尤其重要的是，要有一个可用于为您的商店创建自己的 CSV 文件的模板。\n\
    \n这是 Magento 默认附带的 CSV：\n\n"
