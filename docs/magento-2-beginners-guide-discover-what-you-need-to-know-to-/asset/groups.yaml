  - '[PAGE 309]


    This shipping method allows you to define a CSV file to calculate the shipping
    rate. The format for the CSV file depends on the condition for the shipping calculation.
    You can choose any of the following conditions:


    +   - **Weight Vs. Destination**

    +   - **Price Vs. Destination**

    +   - **# of items Vs. Destination**


    The following fields are available in the Table Rates shipping method configuration:


    +   - **Enabled**: Specify whether Table Rates should be available as a shipping
    method on the Storefront.

    +   - **Title**: A descriptive title for the shipping method.

    +   - **Method Name**: This is the label that is displayed next to the rate on
    the Storefront.

    +   - **Condition**: This is the condition to calculate the rate based on the
    table that you upload. The available conditions are:

    +     - **Weight Vs. Destination**

    +     - **Price versus Destination**

    +     - **# of items Vs. Destination**

    +   - **Include Virtual Products in Price Calculation**: Define whether virtual
    products should be included in the rate calculation. Since the table rates shipping
    is used to calculate the price based on the customer address (distance), most
    of the times, this option is set to No since virtual products are delivered through
    e-mail.

    +   - **Calculate Handling Fee**: Set whether the handling fee is a fixed amount
    or a percentage based on the price defined in the previous field.

    +   - **Handling Fee**: This will be a fixed amount or a percentage to calculate
    the handling fee.

    +   - **Displayed Error Message**: The error message to be displayed when the
    shipping method is not available.

    +   - **Ship to Applicable Countries**: Specify whether the shipping method should
    be available for all countries or only specific countries. If you choose specific
    countries, the Ship to Specific Countries dropdown will be enabled to select the
    countries that will be available for this shipping method.

    +   - **Sort Order**: Set the order to determine the position of Flat Rate in
    the list of available shipping methods on the Storefront. The lower the number,
    the higher it will appear on the list.'
  - '[PAGE 310]


    Now, in order to upload the CSV file for the Table Rates method, you should filter
