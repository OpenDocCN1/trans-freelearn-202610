    # CMS Pages, Blocks, and Widgets


    As you can see in the previous screenshot, there are six pages included in the
    Magento 2 sample data. One important aspect of CMS Pages is the **URL Key**, which
    is unique for each page from the same store view.


    You can access the CMS Pages by combining the Base URL for the store and the URL
    Key. For example, to access the **About us** page, you should go to

    http://magento2-playground.dev/about-us.


    You will see the following page on the screen:


