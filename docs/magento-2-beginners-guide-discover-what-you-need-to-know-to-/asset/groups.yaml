    \ 设置为 all，以授予文档根目录正确的权限。\n\n6. 找到以下代码块：\n\n```\n<Directory /var/www/>\n  Options\
    \ Indexes FollowSymLinks\n  AllowOverride none\n  Require all granted\n</Directory>\n\
    ```\n\n将其替换为以下代码：\n\n```\n<Directory /var/www/>\n  Options Indexes FollowSymLinks\n\
    \  AllowOverride all\n  Require all granted\n</Directory>\n```\n\n7. 重启 Apache\
    \ 服务器以应用更改：\n\n```\nsudo service apache2 restart\n```\n\n8. 在文档根目录中创建一个示例 `phpinfo.php`\
    \ 文件：\n\n```\ncd /var/www/html\nrm index.html\necho \"<?php echo phpinfo();\"\
    \ > phpinfo.php\n```\n\n9. 然后，你可以访问文档根目录，并在浏览器中查看 `phpinfo.php` 文件的输出。例如，<公共 IP>/phpinfo.php。\n\
    \n你应该在浏览器中看到以下页面：\n\n![](img/de3034a92496a32462134266292a51dd_58_0.png)\n\n10.\
    \ 如果 `phpinfo.php` 能正常显示，请删除该文件，并创建一个自定义 MySQL 用户和数据库以导入 Magento（创建与旧服务器相同的用户名）：\n\
    \n```\nmysql -u root -p\nCREATE USER '<username>'@'localhost' IDENTIFIED BY 'password';\n\
    GRANT ALL PRIVILEGES ON * . * TO '<username>'@'localhost';\nFLUSH PRIVILEGES;\n\
    CREATE DATABASE <databasename>;\n```\n\n现在，Amazon 实例已为 Magento 2 准备就绪，你可以继续进行安装向导或我们在上一节中看到的命令行安装方法。\n\
    \n## 小结\n\n在本章中，我们回顾了 Magento 的系统要求。我们在本地机器上安装了一个实例，甚至还从零开始为 Magento 2 设置了一台 Amazon\
    \ 服务器。在下一章中，我们将回顾如何将商店从 Magento 1 迁移到 Magento 2。\n\n## 代码审计\n\n高级软件工程师应审查当前 Magento\
    \ 1.x 商店的代码库，并记录当前代码的状态。\n\n这意味着软件工程师将确保 Magento 1.x 商店中不存在不良实践，因为不良实践会导致 Magento\
    \ 2.x 商店中缺少功能。\n\n### 修改过的 Magento 核心\n\nMagento 1.x 中一个不良实践的示例是直接修改 Magento 核心。有些开发者这样做而不是创建自定义模块，这导致平台上的一些更改在代码库中无法通过自定义模块体现出来。这些功能将无法迁移到\
    \ Magento 2，因为在审查自定义模块时，开发人员看不到这些更改。\n\n如果核心已被修改，那么第一步就是将这些更改从核心移动到自定义扩展，并从 Magento\
    \ 恢复原始核心文件。\n\n你可以从 Magento 技术资源下载页面的 `https://magento.com/tech-resources/download`\
    \ 下载从 1.0 起的任何 Magento 版本。\n\n软件工程师将能够将你的商店核心的当前状态与原始 Magento 核心进行比较。\n\n### 模板中的业务逻辑\n\
    \nMagento 中另一个不良编程实践是将业务逻辑放在模板中，而不是放在自定义扩展中。在 Magento 中向模板添加业务逻辑的正确方法是在自定义扩展的块中添加该逻辑，但有些开发者改为在前端模板中包含\
    \ PHP 代码。\n\n软件工程师应审查前端模板，以查看是否有任何需要移至自定义扩展的自定义业务逻辑。\n\n### 第三方扩展\n\n我不建议拥有大量第三方扩展。你应该只保留你需要的、并且你认为对商店至关重要的扩展。\n\
    \n话虽如此，你应该审查你的商店使用的第三方扩展是否可用于 Magento 2。这意味着你应该访问模块供应商的网站，检查是否已为 Magento 2 创建了新扩展。\n\
    \n非常重要的一点是，一些模块供应商正在为其扩展创建 Magento 2 版本，但这些 Magento 2 扩展并不具备 Magento 1 扩展的所有功能。\n\
    \n这意味着你不仅应检查该扩展是否可用，还应检查你在 Magento 1 中使用的该扩展的所有功能在 Magento 2 的扩展中是否都可用。\n\n如果某扩展不适用于\
    \ Magento 2，则你应该分析是否真的需要该扩展。如果你确实需要，可以联系模块供应商，了解近期是否有发布计划。如果模块供应商不打算很快发布 Magento\
    \ 2 的新版本，那么你应该为 Magento 2 从零开始创建该扩展。\n\n### 自定义扩展\n\n如果你在 Magento 1 中寻找自定义功能但未在\
    \ Magento Connect 中找到任何扩展，那么你必须实现自定义代码来支持该扩展。这些是 Magento 1 中可用但与 Magento 2 不兼容的自定义扩展。\n\
    \nMagento 2 是一个具有新数据结构和新编码实践的新平台。你应该为这些扩展从零开始创建新版本，并使用与 Magento 2 兼容的代码。\n\n###\
    \ 未使用的扩展\n\n是否有未使用的自定义或第三方扩展？如果有，你应该审查这些扩展的功能，以确定是否真的需要它们。通过减少扩展数量，你可以减少需要迁移的代码量，并保持更干净的\
    \ Magento 2 实例。\n\n### 自定义 JavaScript\n\n自定义 JavaScript 不会迁移到 Magento 2，你需要记录使用\
    \ JavaScript 实现的自定义功能。这些功能应由经验丰富的 Magento 开发人员手动迁移到 Magento 2，以使用 RequireJS。\n\
    \n### 迁移要求\n\n现在你已经分析了代码，是时候审查迁移要求了。有时，原始需求在代码审计后会发生变化。这是合理的，因为你对商店当前状态的了解会更多，并且你将基于此制定行动计划。\n\
    \n代码审计过程之后，你将获得一个列表，包括：\n\n- 需要移至自定义扩展的核心更改\n- 需要移至自定义扩展的模板中的业务逻辑\n- 可用于 Magento\
    \ 2 的第三方扩展\n- 需要为 Magento 2 更新的第三方扩展\n- 需要为 Magento 2 更新的自定义扩展\n- 不会在 Magento\
    \ 2 中实现的未使用扩展\n- 需要在 Magento 2 中实现的自定义 JavaScript\n\n还有其他需要考虑的事项——主题（主题模板）。主题不会从\
    \ Magento 1 自动迁移到 Magento 2。就像你对第三方扩展所做的那样，你应该检查该主题是否适用于 Magento 2，并在必要时联系主题开发者，了解是否即将有发布计划。\n\
    \n如果你想保持商店相同的外观和感觉，那么如果主题不适用于 Magento 的新版本，你就应该考虑为 Magento 2 从零开始创建主题。\n\n现在，推进迁移的计划应类似于以下内容：\n\
    \n- 准备好你之前创建的列表中的每一项\n- 确保代码中没有问题，因为这些问题在迁移到 Magento 2 时仍会存在\n- 将 Magento 1.x\
    \ 升级到最新的 Magento 1.x 版本\n- 如果你完成了以上所有项目，你就可以进行数据迁移了\n\n## 使用数据迁移工具\n\n数据迁移工具由\
    \ Magento 团队创建，允许商店所有者从 Magento 1 迁移到 Magento 2。\n\n该工具有助于将数据库信息迁移到 Magento 2，例如产品、订单、客户、商店配置等。\n\
    \n你可以从 Github 上的以下地址访问数据迁移工具的代码：\n\n```\nhttps://github.com/magento/data-migration-tool\n\
    ```\n\n![](img/de3034a92496a32462134266292a51dd_64_0.png)\n\n"
