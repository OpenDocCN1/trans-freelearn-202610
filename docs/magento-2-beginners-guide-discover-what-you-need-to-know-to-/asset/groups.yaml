  mdcn: "\n您可以在 Magento Marketplace 中查看可用的扩展列表，访问 https://marketplace.magento.com：\n\
    \n![](img/de3034a92496a32462134266292a51dd_385_0.png)\n\n当您选择某个扩展时，您将在扩展列表页面看到所需的全部信息，包括：\n\
    \n- 扩展的可用版本\n- 供应商提供的可用支持\n- 安装服务\n- 价格\n- 描述\n- 当前版本\n- 更新日期\n- 分类\n- 兼容的 Magento\
    \ 2 版本\n- 评论\n- 发布说明\n- 支持\n\n![](img/de3034a92496a32462134266292a51dd_386_0.png)\n\
    \n我建议您将 Magento Marketplace 视为一个可以为您的商店找到三种不同类型定制方案的地方：\n\n- **扩展：** https://marketplace.magento.com/extensions\n\
    - **主题：** https://marketplace.magento.com/themes.html\n- **语言包：** https://marketplace.magento.com/extensions/content-customizations/translations-localization.html\n\
    \n除此之外，Marketplace 非常直观，提供了一种非常简单的方法来查找您需要的扩展并查看这些扩展的所有信息，包括供应商信息。\n\n这些扩展可以由供应商安装，也可以由经验丰富的\
    \ Magento 开发人员安装，他们会审查扩展代码，以便将扩展集成到您的 Magento 商店中。\n\n## 本章小结\n\n在本章中，我们回顾了管理\
    \ Magento 主题、使用内联翻译工具翻译字符串，以及使用 Magento Marketplace 下载主题、扩展和语言包的过程。\n\n在下一章中，我们将回顾如何备份、恢复和管理您的\
    \ Magento 数据库，如何提高 Magento 实例的性能，如何优化网站的 SEO，如何管理缓存和索引，以及如何将 Magento 升级到最新版本。\n\
    \n## 21\n\n## 商店维护\n\n在本章中，我们将涵盖以下主题：\n\n- 备份、恢复和数据库管理\n- 性能调优\n- 搜索引擎优化\n- 缓存和索引管理\n\
    - 将 Magento 升级到新版本\n\n### 备份、恢复和数据库管理\n\n创建备份至关重要，因为这能确保在发生意外情况时，我们可以恢复 Magento\
    \ 商店。Magento 允许我们通过管理后台和 Magento 2 命令行工具创建代码库和数据库备份。\n\n若要从管理后台创建备份，您应进入以下部分：\n\
    系统 | 工具 | 备份\n\n![](img/de3034a92496a32462134266292a51dd_389_0.png)\n\n在该部分中，您将看到已创建的所有备份列表。此外，您还可以创建三种类型的备份：\n\
    \n- **系统备份**：创建代码库和数据库备份，并可以选择包含或排除媒体文件夹\n- **数据库和媒体备份**：创建数据库和媒体文件夹备份\n- **数据库备份**：创建数据库备份\n\
    \n对于所有这些备份类型，您都可以将 Magento 商店置于维护模式，因为备份过程会占用大量服务器资源。\n\n如果您单击**系统备份**，将显示以下窗口：\n\
    \n![](img/de3034a92496a32462134266292a51dd_390_0.png)\n\n当您继续执行备份时，系统会显示一个旋转加载器图像，并由系统创建备份。由于此备份包含代码库和数据库，因此该过程需要一些时间才能完成。\n\
    \n备份创建完成后，您将在屏幕上看到一条确认消息，并且备份将列在网格中：\n\n![](img/de3034a92496a32462134266292a51dd_391_0.png)\n\
    \n此外，备份文件将位于代码库中的 var/backups 文件夹中。\n\n正如您在网格中所见，您可以下载 .tgz 格式的备份，或使用最后一列中的“回滚”操作进行恢复。\n\
    \n**数据库和媒体备份**与**数据库备份**的过程相同。现在，我们确实应考虑自动化此过程，以便始终为我们的 Magento 商店保留备份。\n\nMagento\
    \ 允许您安排系统定期自动创建备份。为此，您应进入商店配置页面（**商店 | 配置**），并单击**高级 | 系统**。\n\n在此页面上，您将看到**计划备份设置**部分：\n\
    \n![](img/de3034a92496a32462134266292a51dd_392_0.png)\n\n如果在“启用计划备份”字段中选择“是”，将显示以下表单：\n\
    \n![](img/de3034a92496a32462134266292a51dd_393_0.png)\n\n在那里，您可以选择计划备份的备份类型、开始时间和频率，还可以定义在备份期间是否将网站置于维护模式。建议将备份安排在每天夜间商店流量较少时进行，例如每天凌晨\
    \ 2 点。\n\n除管理后台备份外，您还可以使用 Magento 2 命令行工具创建备份。\n\n为此，您应打开终端，并将当前目录更改为 Magento\
    \ 2 实例的文档根目录。\n\n如果您运行 php bin/magento，您将看到用于创建备份的 setup:backup 命令，该命令会备份 Magento\
    \ 应用程序的代码库、媒体和数据库。\n\n此外，setup:rollback 命令可用于恢复备份，该命令会回滚 Magento 应用程序的代码库、媒体和数据库。\n\
    \n要创建备份，您应将要创建的备份类型作为参数传递。可用的参数有：\n\n- `--code`\n- `--media`\n- `--db`\n\n从每个参数的名称可以看出，您可以指定备份中是否包含代码库、媒体和数据库。\n\
    \n例如，要创建代码库和数据库备份，您应运行以下命令：\n\n```\nphp bin/magento setup:backup --code --db\n\
    ```\n\n如下面的截图所示，您可以从命令行输出中跟踪进度：\n\n![](img/de3034a92496a32462134266292a51dd_394_0.png)\n\
    \n您可以通过运行 `magento info:backups:list` 命令查看可用备份列表：\n\n![](img/de3034a92496a32462134266292a51dd_395_0.png)\n\
    \n这一点至关重要，因为 `setup:rollback` 命令要求您指定要恢复的每个参数对应的文件名：\n\n```\nmagento setup:rollback\
    \ [-c|--code-file=\"<name>\"] [-m|--media-file=\"<name>\"]\n[-d|--db-file=\"<name>\"\
    ]\n```\n\n### 性能调优\n\n对于 Magento 商店的转化率而言，性能是获得高转化率的关键。没有人喜欢等待页面加载，而您希望客户在决定购买哪些商品后尽快下单。\n\
    \n在本节中，我们将回顾如何优化 Magento 以获得尽可能快的性能，包括 Magento 配置、服务器优化等。\n\n为了比较平台旧版本与新版本的性能，我们将在本书中收录\
    \ Magento 提供的性能统计信息。请注意，这些统计信息是基于 Magento Enterprise Edition 2.0 生成的，但它们是不错的参考数据：\n\
    \n- **每小时订单数：** Magento Enterprise Edition 2.0 每小时可处理 597 个订单，与 Magento Enterprise\
    \ Edition 1.14.2 相比，每小时增加了 130 个订单：\n\n  ![](img/de3034a92496a32462134266292a51dd_396_0.png)\n\
    \n- **目录浏览：** 使用 Varnish 时，Magento Enterprise Edition 2.0 中目录浏览的响应时间几乎是即时的：\n\n\
    \  ![](img/de3034a92496a32462134266292a51dd_397_0.png)\n\n- **加入购物车：** 与 Magento\
    \ Enterprise Edition 1.14.2 相比，Magento Enterprise Edition 2 中的“加入购物车”操作快 66%：\n\
    \n  ![](img/de3034a92496a32462134266292a51dd_398_0.png)\n\n"
