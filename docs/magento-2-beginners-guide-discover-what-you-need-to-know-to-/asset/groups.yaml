    \ (`https://magento.com/security`)：有关每个 Magento 安全补丁的信息，以及保持 Magento 商店安全的最佳实践和指南\n\
    - **Upcoming Events and Webinars** (`https://magento.com/events`)：官方即将举行的 Magento\
