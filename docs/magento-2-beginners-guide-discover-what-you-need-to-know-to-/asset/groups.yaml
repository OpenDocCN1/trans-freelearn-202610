    # New features in Magento 2


    Magento 2 is a new generation of the platform, with new features, technologies,
    and improvements that make Magento one of the most robust and complete e-commerce
    solutions available at the moment. In this section, we will describe the main
    differences between Magento 1 and Magento 2.


    First, let''s review the new technologies that are available in Magento 2:


    # New technologies


    +   - **Composer:** This is a dependency manager for PHP. Dependencies can be
    declared and Composer will manage these dependencies by installing and updating
    them. In Magento 2, Composer simplifies the process of installing and upgrading
    extensions and upgrading Magento.

    +   - **Varnish 4:** This is an open source HTTP accelerator. Varnish stores pages
    and other assets in memory to reduce the response time and network bandwidth consumption.

    +   - **Full Page Caching:** In Magento 1, Full Page Caching was only included
    in the Magento Enterprise Edition. In Magento 2, Full Page Caching is included
    in all editions, allowing the content from static pages to be cached, increasing
    the performance and reducing the server load.

    +   - **Elasticsearch:** This is a search engine that improves the search quality
    in Magento and provides background re-indexing and horizontal scaling.

    +   - **RequireJS:** It is a library to load Javascript files on-the-fly, reducing
    the number of HTTP requests and improving the speed of the Magento Store.

    +   - **jQuery:** The frontend in Magento 1 was implemented using Prototype as
    the language for Javascript. In Magento 2, the language for Javascript code is
    jQuery.

    +   - **Knockout.js:** This is an open source Javascript library that implements
    the **Model-View-ViewModel (MVVM)** pattern, providing a great way of creating
    interactive frontend components.

    +   - **LESS:** This is an open source CSS preprocessor that allows the developer
    to write styles for the store in a more maintainable and extendable way.

    +   - **Magento UI Library:** This is a modular frontend library that uses a set
    of mix-ins for general elements and allows developers to work more efficiently
    on frontend tasks.'
