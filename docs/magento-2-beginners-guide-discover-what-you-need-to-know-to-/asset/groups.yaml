  md: "\n## Sales\n\n- **Reorder:**\n  - **Allow Reorder:** If this setting is enabled,\
    \ the “Reorder” link will appear for the customer to be able to place the same\
    \ order again\n- **Gift Options:**\n  - **Allow Gift Messages on Order Level:**\
    \ Allow customers to specify gift messages for orders\n  - **Allow Gift Messages\
    \ for Order Items:** Allow customers to specify gift messages for order items\n\
    \n## Sales – Tax\n\n- **Calculation Settings:**\n  - **Tax Calculation Method\
    \ Based On:** There are three calculation methods for taxes:\n    - **Unit Price:**\
    \ The tax will be calculated for each unit\n    - **Row Total:** The tax will\
    \ be calculated for each item\n    - **Total:** The tax will be calculated from\
    \ the order total\n  - **Tax Calculation Based On:** You can select which address\
    \ type to consider as the location to calculate the taxes\n    - Shipping Address\n\
    \    - Billing Address\n    - Shipping Origin\n  - **Catalog Prices:** Specify\
    \ if the prices in the catalog include taxes or not\n  - **Shipping Prices:**\
    \ Specify whether the shipping prices entered from the Magento admin panel or\
    \ retrieved from gateways include taxes or not\n  - **Apply Customer Tax:** Specify\
    \ whether taxes should be calculated before or after discount\n  - **Apply Discount\
    \ On Prices:** If “Apply Customer Tax after Discount” is selected in the previous\
    \ field, then you can specify if the discount on prices should include taxes or\
    \ not\n  - **Apply Tax On:** Specify if the taxes should be applied on the original\
    \ price or custom price if available\n  - **Enable Cross Border Trade:** If you\
    \ enable this setting and the prices in the catalog include taxes, then the price\
    \ will be fixed, no matter the customer's tax rate\n\n## Sales – Checkout\n\n\
    - **Checkout Options:**\n  - **Enable One-page Checkout:** If this setting is\
    \ set to “No”, then the default checkout won't be available on the Storefront\
    \ (you can still enable multi-shipping checkout)\n  - **Allow Guest Checkout:**\
    \ Allow guest users to place orders on the Storefront\n  - **Enable Terms and\
    \ Conditions:** Enable the terms and conditions checkbox in the checkout page\n\
    \n## Sales – Shipping Settings\n\n- **Origin:** Set the address from where the\
    \ items for the orders are delivered. These are the available fields in this section:\n\
    \  - Country\n  - Region/State\n  - ZIP/Postal Code\n  - City\n  - Street Address\n\
    \  - Street Address Line 2\n- **Shipping Policy Parameters:**\n  - **Apply custom\
    \ shipping policy:** You can add your custom shipping policy to display in the\
    \ checkout\n\n## Sales – Multishipping Settings\n\n- **Options:**\n  - **Allow\
    \ Shipping to Multiple Addresses:** Enable multishipping checkout\n  - **Maximum\
    \ Qty Allowed for Shipping to Multiple Addresses:** Set the maximum allowed quantity\
    \ for multishipping checkout\n\n## Sales – Shipping Methods\n\nConfigure the available\
    \ shipping methods for the customers in the checkout page. The available shipping\
    \ methods are:\n\n- Flat Rate\n- Free Shipping\n- Table Rates\n- UPS\n- USPS\n\
    - FedEx\n- DHL\n\n## Sales – Google API\n\n- **Google Analytics:**\n  - **Enable:**\
    \ Enable Google Analytics to keep a track of the web traffic in your Magento store\n\
    - **Google AdWords:**\n  - **Enable:** Enable Google AdWords Conversion Tracking\n\
    \n## Sales – Payment Methods\n\nConfigure the available payment methods for the\
    \ customers in the checkout page. We will review the process of setting up payment\
    \ methods in Chapter 15, Processing Payments. The available payment methods are:\n\
    \n- PayPal\n- Braintree\n- Check/Money Order\n- Bank Transfer Payment\n- Cash\
    \ On Delivery Payment\n- Zero Subtotal Checkout\n- Purchase Order\n- Authorize.net\
    \ Direct Post\n\n## Advanced – Admin\n\n- **Startup Page:**\n  - **Startup Page:**\
    \ Set the page that will be displayed after the administrators log in to the admin\
    \ panel\n- **Admin Base URL:**\n  - **Use Custom Admin URL:** Set the custom base\
    \ URL for the admin panel, for example, http://magento-playground.dev/magento/\n\
    \  - **Use Custom Admin Path:** Append the custom path after the base URL, for\
    \ example, sample_admin\n\n## Advanced – System\n\n- **Scheduled Backup Settings:**\n\
    \  - **Enable Scheduled Backup:** If this setting is set to **Yes**, then Magento\
    \ will perform the specified backup on a regular basis.\n  - **Backup Type:**\
    \ Select the type of backup that will be automatically done by Magento. The available\
    \ backup types are:\n    - Database\n    - Database and Media\n    - System\n\
    \    - System (excluding Media)\n  - **Start Time:** Set specific time in the\
    \ day to automatically start backup\n  - **Frequency:** Set the frequency of automatic\
    \ backup\n  - **Maintenance Mode:** Specify whether the store should be put into\
    \ maintenance mode during backup (recommended)\n\n## Advanced – Advanced\n\n-\
    \ **Disable Modules Output:** You can disable specific modules from your Magento\
    \ instance from this section. By disabling the modules in this section, you are\
    \ specifically disabling the output and not the entire module functionality. For\
    \ example, an event observer will still be running after the module is disabled\
    \ from this section.\n  - Magento_AdminNotification\n  - Magento_AdvancedPricingImportExport\n\
    \  - Magento_Authorization\n  - Magento_Authorizenet\n  - Magento_Backup\n  -\
    \ Magento_Braintree\n  - Magento_Bundle\n  - Magento_BundleImportExport\n  - Magento_BundleSampleData\n\
