  mdcn: "\n\n### 用户角色：\n\n- 角色：管理员\n\n在表单中填写完这些信息后，点击“保存用户”。系统会将您重定向到用户网格页面，并在屏幕上显示以下消息：\n\
    \n![](img/de3034a92496a32462134266292a51dd_256_0.png)\n\n### 管理角色\n\n您可以为管理员用户创建新角色，从而为不同的管理页面授予特定权限。您可以在管理面板中转到“系统\
    \ | 权限 | 用户角色”页面来管理用户角色。系统会将您重定向到以下页面：\n\n![](img/de3034a92496a32462134266292a51dd_257_0.png)\n\
    \n我们可以看到，Magento 默认提供的唯一管理员角色拥有管理面板中的所有权限。我们将通过点击屏幕右上角的**添加新角色**来创建一个新的用户角色。点击该按钮后，屏幕上会显示以下页面：\n\
    \n![](img/de3034a92496a32462134266292a51dd_257_1.png)\n\n在第一个选项卡**角色信息**中，您可以设置角色名称，并指定当前管理员用户的密码，以便保存更改。在第二个选项卡**角色资源**中，您会看到可以分配给用户角色的所有资源列表：\n\
    \n![](img/de3034a92496a32462134266292a51dd_258_0.png)\n\n我们将创建一个示例用户角色，使其只能访问管理面板中的**仪表盘**和**销售**部分。\n\
    \n首先，我们将名称设置为`Sample User Role`，并在**角色信息**选项卡中指定当前管理员用户的密码。然后，我们将在“角色资源”选项卡中勾选“仪表盘”和“销售”复选框，如下面的屏幕截图所示：\n\
    \n![](img/de3034a92496a32462134266292a51dd_259_0.png)\n\n最后，点击**保存角色**，将新的管理员用户角色添加到\
    \ Magento。您将在角色网格中看到确认消息：\n\n![](img/de3034a92496a32462134266292a51dd_259_1.png)\n\
    \n如果我们返回用户网格页面（系统 | 权限 | 所有用户），并点击刚刚创建的用户，就可以将该用户分配到新的用户角色：\n\n![](img/de3034a92496a32462134266292a51dd_260_0.png)\n\
    \n如果我们保存更改，退出当前管理员用户账户，然后以新用户身份登录，就会看到该用户只能访问“仪表盘”和“销售”部分：\n\n![](img/de3034a92496a32462134266292a51dd_260_1.png)\n\
    \n### 总结\n\n在本章中，您学习了如何创建新的管理员用户，并为不同的管理区域授予特定权限。在下一章中，我们将介绍 Magento 中的税费配置，包括税类、税率规则、税区和税率。\n\
    \n## 13 税费\n\n在本章中，我们将介绍以下主题：\n\n- 税类和税率规则\n- 税区和税率\n\n### 税类和税率规则\n\n网站上线前，店主需要完成的任务之一就是为商店设置税费。\n\
    \nMagento 允许您根据业务需求设置税费。税费的常规配置位于我们之前介绍过的系统配置页面中（商店 | 配置 | 销售 | 税）：\n\n![](img/de3034a92496a32462134266292a51dd_262_0.png)\n\
    \n系统会将您重定向到以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_264_0.png)\n\n如果您点击“附加设置”，表单中将显示以下附加字段：\n\
    \n![](img/de3034a92496a32462134266292a51dd_264_1.png)\n\n如您所见，您可以为客户和产品添加新的税类。稍后，您可以在系统配置页面中选择这些新税类。\n\
    \n下面我们逐一介绍“新建税率规则”表单中的各个字段：\n\n- **税率规则信息：**\n    - **名称：** 税率规则的名称。\n    - **税率：**\
    \ 这是基于位置设置的税率规则百分比。您可以选择现有税率，也可以创建新的税率以供选择。我们稍后会对此进行介绍。\n- **附加设置：**\n    - **客户税类：**\
    \ 客户税类用于购买行为不是零售交易的特定场景。\n    - **产品税类：** 由于不同产品适用的税费不同，您可以为商店中的每个产品系列添加产品税类。\n\
    \    - **优先级：** 当存在多个税类时使用优先级。优先级相同的税率会相加，而其他税率会进行复合计算。\n    - **仅根据小计计算：** 覆盖复合税的优先级顺序，并根据订单小计计算税费。\n\
    \    - **排序顺序：** 税费的显示顺序。排序值越低，在列表中的显示位置越靠前。\n    - **导入税率：** 从 CSV 文件导入税率。\n\
    \    - **导出税率：** 将税率导出为 CSV 文件。这有助于获取上一个字段中导入操作所需的正确 CSV 格式。\n\n下面我们继续创建新的税率规则。我们将在表单中添加以下信息：\n\
    \n- **税率规则信息：**\n    - **名称：** `Sample Rule`\n    - **税率：** 对于此规则，我们将选择以下税率：\n\
    \        - **US-CA-\\*-Rate 1**\n        - **US-NY-\\*-Rate 1**\n- **附加设置：**\n\
    \    - **客户税类：** 零售客户\n    - **产品税类：** 应税商品\n    - **优先级：** 0\n    - **仅根据小计计算：**\
    \ 未选中\n    - **排序顺序：** 0\n\n现在，点击**保存规则**。当系统将您重定向到**税率规则**网格页面时，您会看到确认消息以及网格中的新规则：\n\
    \n![](img/de3034a92496a32462134266292a51dd_266_0.png)\n\n现在，让我们修改刚刚创建的规则的**客户税类**和**产品税类**。我们将点击网格中的**Sample\
    \ Rule**项目，以进入编辑表单。\n\n在那里，我们将点击**附加设置**链接，然后点击**添加新税类**按钮。\n\n如果您点击“保存规则”，就会在“税率规则”网格中看到更新后的税类：\n\
    \n![](img/de3034a92496a32462134266292a51dd_268_0.png)\n\n除此之外，新的税类还可以在税费系统配置页面（商店\
    \ | 配置 | 销售 | 税）中选择：\n\n![](img/de3034a92496a32462134266292a51dd_268_1.png)\n\n\
    我们将通过点击**添加新税率**来添加新的税率。页面加载后，您将看到以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_270_0.png)\n\
    \n在这里，您可以指定以下信息：\n\n- **税率标识：** 税率的名称。\n- **邮政编码是否为范围：** 您可以为税率指定邮政编码范围。\n- **邮政编码：**\
    \ 您可以指定具体的邮政编码，也可以使用星号字符指定邮政编码模式。例如，`bay*`将匹配所有以 bay 开头的邮政编码。\n- **州/省：** 从下一字段中选择的国家/地区中选择所有州/省或特定州/省。\n\
    - **国家/地区：** 选择税率适用的国家/地区。\n- **税率百分比：** 设置税率百分比。\n\n您还可以在“新建/编辑税率规则”页面中，通过点击“添加新税率”按钮来添加新的税率：\n\
    \n![](img/de3034a92496a32462134266292a51dd_271_0.png)\n\n点击该按钮后，您将看到以下窗口，用于添加新税率的信息：\n\
    \n![](img/de3034a92496a32462134266292a51dd_271_1.png)\n\n### 总结\n\n在本章中，我们介绍了基于客户位置创建税类、税率规则和税率的流程。现在，您将能够为\
    \ Magento 商店中的目录准确设置价格和税费。在下一章中，您将学习目录价格规则和购物车价格规则，以创建促销活动并提高销售额。\n\n## 14 目录和购物车价格规则\n\
    \n在本章中，我们将介绍以下概念：\n\n- 目录价格规则\n- 购物车价格规则\n- 生成优惠券\n\n### 目录价格规则\n\n在线商店的关键要素之一，就是能够设置促销活动，从而提高销量，并吸引访客再次下单。\n\
    \n"
