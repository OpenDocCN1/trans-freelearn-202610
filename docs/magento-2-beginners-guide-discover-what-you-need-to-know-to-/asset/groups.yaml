    +   - How to manage Magento themes

    +   - How Inline Translation works

    +   - Magento marketplace


    # How to manage Magento themes


    A theme in Magento defines the look and feel of the Storefront for your customers.
    By default, Magento includes the following themes:


    +   - Magento Blank

    +   - Magento Luma'
