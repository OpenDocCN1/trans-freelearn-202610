  - '[PAGE 300]


    +   - **Sale**: The customer will be charged immediately when the order is placed.
    Magento will create the invoice when PayPal confirms the payment.

    +   - **Order**: The purchase represents an agreement between PayPal and the merchant.
    The total amount can be captured by the merchant at any time during the next 29
    days.

    +   - **Display on Product Details Page**: Select whether or not the PayPal buttons
    should be displayed on the **Product Details** page.


    And you will see the following fields for the **Advanced Settings** form:


    +   - **Display on Shopping Cart**: Select whether or not the PayPal buttons should
    be displayed on the shopping cart page and the mini shopping cart in the header

    +   - **Payment Applicable From**: Restrict **PayPal Express Checkout** to only
    be available as a payment method in specific countries

    +   - **Debug Mode**: Enable debug mode to log useful information for debugging
    during development

    +   - **Enable SSL verification**: Enable SSL protection for **PayPal Express
    Checkout**

    +   - **Transfer Cart Line Items**: Include details about the purchased items
    in PayPal

    +   - **Transfer Shipping Options**: Include details about the shipping options
    in PayPal

    +   - **Shortcut Buttons Flavor**: Choose between dynamic or static shortcut buttons

    +   - **Enable PayPal Guest Checkout**: Allow customers who don''t have a PayPal
    account to use **PayPal Express Checkout**

    +   - **Require Customer''s Billing Address**: Specify whether the customer should
    include a billing address for **PayPal Express Checkout**

    +   - **Billing Agreement Signup**: Allow the customer to save the billing details
    for the next purchase through a billing agreement

    +   - **Skip Order Review Step**: Skip the order review step when using **PayPal
    Express Checkout**


    # PCI compliance


    PCI compliance ensures that your customers can securely use credit cards to purchase
    from your store. All credit card associations require merchants to implement PCI
    Compliance to protect their customers online.'
  - '[PAGE 301]


    # Processing Payments


    Magento includes payment gateways that securely transmit credit card data through
    direct API post methods or hosted payment forms provided by the payment gateway.


    The following are the requirements to meet the **Payment Card Industry Data Security
    Standard (PCI DSS):**


    +   1. Install and maintain a firewall configuration to protect cardholder data.

    +   2. Do not use vendor-supplied defaults for system passwords and other security
    parameters.

    +   3. Protect stored cardholder data.

    +   4. Encrypt the transmission of cardholder data across open public networks.

    +   5. Use and regularly update your antivirus software.

    +   6. Develop and maintain secure systems and applications.

    +   7. Restrict access to cardholder data to business need-to-know.

    +   8. Assign a unique ID to each person with computer access.

    +   9. Restrict physical access to cardholder data.

    +   10. Track and monitor all access to network resources and cardholder data.

    +   11. Regularly test security systems and processes.

    +   12. Maintain a policy that addresses information security.


    There are two methods to protect your customers and guarantee PCI compliance:


    +   - **Direct post:** The information is sent directly to the payment gateway
    without data flowing through or being stored on Magento.

    +   - **Hosted payment form:** The payment form is integrated in the Magento checkout,
    but it is hosted by the payment gateway rather than by the Magento application.


    By keeping sensitive data outside the Magento instance, merchants can validate
    compliance through self-assessment at the SAQ A or SAQ A-EP level without having
    to go through the PCI compliance reassessment of the entire Magento platform.'
