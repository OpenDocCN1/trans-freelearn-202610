    \ your Magento 1.x instance**: From this point, make sure you don't modify the\
    \ catalog, such as Products or Categories, until everything is migrated to Magento\
    \ 2. Also, disable all the cron jobs and create a database backup before moving\
    \ forward. It's also required to put the store into maintenance mode during the\
    \ migration process. In the following image, you can see that we created a database\
    \ backup using the command line:\n\n![](img/de3034a92496a32462134266292a51dd_66_0.png)\n\
    \n3. Ensure that you are using PHP 7 to ensure the best performance of the Data\
    \ Migration Tool:\n\n![](img/de3034a92496a32462134266292a51dd_67_0.png)\n\n4.\
    \ Install the Data Migration Tool in your Magento 2 directory by following these\
