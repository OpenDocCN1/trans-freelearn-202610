    # Modifying transactional e-mail templates


    Magento provides all the transactional e-mail templates that you need to launch
    your e-commerce store. A transactional e-mail is an e-mail that is automatically
    sent to the customer by Magento when a specific action occurs in your store, for
    example, when a user creates a customer account or when a new order is placed.


    You can modify the default transactional e-mails that are included in Magento
    2 from the **MARKETING | Communications | Email Templates** page in the admin
    panel.'
