    # Summary


    In this chapter, we reviewed the system requirements for Magento. We installed
    an instance in our local machine, and we even set up an Amazon server from scratch
    for Magento 2. In the next chapter, we will review the process of migrating a
    store from Magento 1 to Magento 2.'
