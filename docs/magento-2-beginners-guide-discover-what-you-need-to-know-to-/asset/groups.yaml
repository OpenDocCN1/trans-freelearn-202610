    at once in the product listing page.

    +   - **Use Flat Catalog Category:** Turn this setting on to enable flat tables
    for categories. This setting improves the performance of the store by combining
    all the category information in a flat table to fetch the data in a single query.

    +   - **Use Flat Catalog Product:** Turn this setting on to enable flat tables
    for products. This setting improves the performance of the store by combining
    all the product information in the flat table to fetch the data in a single query.

