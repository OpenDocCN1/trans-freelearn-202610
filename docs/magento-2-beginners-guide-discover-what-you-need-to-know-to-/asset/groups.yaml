    \ 2 允许客户在订单成功页面注册，而不会延迟结账流程。\n\n## 开始需要什么？\n\nMagento 是一个非常强大的平台，总有新的东西需要学习。就在你以为你已经了解\
    \ Magento 的一切时，一个新版本就会发布，带来新的功能可供探索。这使得 Magento 作为电子商务平台变得有趣且独一无二。\n\n话虽如此，本书将成为你的指南，帮助你发现实现、管理和维护你的第一个\
