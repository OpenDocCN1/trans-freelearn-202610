    \n      - Apply single price to all SKUs\n      - Apply unique prices by attribute\
    \ to each SKU\n      - Skip price at this time\n\n      **Quantity**\n\n     \
    \ - Apply single quantity to each SKUs\n      - Apply unique quantity by attribute\
    \ to each SKU\n      - Skip quantity at this time\n\n      You can choose from\
    \ the following options:\n\n      **Images:**\n\n      - **Apply a single set\
    \ of images to all SKUs**: If you select this option, you will be able to upload\
