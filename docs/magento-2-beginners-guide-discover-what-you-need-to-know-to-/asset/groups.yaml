    # 8


    # CMS Pages, Blocks, and Widgets


    In this chapter, we will cover the following topics:


    +   - CMS Pages

    +   - Static blocks

    +   - Widgets


    # CMS Pages


    If you are wondering whether you can add additional pages with static content,
    this is the right section for you. We will cover the process of managing static
    pages in Magento, such as *Privacy Policy* or *Terms and Conditions*, allowing
    you to create additional pages to add more information to your store.'
