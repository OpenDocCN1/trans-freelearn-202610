    最后，在**订单总计**部分，你可以跟踪**总计**、已支付总额、已退款总额和应付总额。


    - **发票选项卡**


    如果你转到**发票**选项卡，你将看到一个包含为此订单生成的所有发票的网格。在前面的示例中，你可以看到没有发票的网格（我们将在本章后面生成一张发票）：


    ![](img/de3034a92496a32462134266292a51dd_323_0.png)


    此网格唯一可用的批量操作是**PDF 发票**，它会以 PDF 格式下载所选每张发票的副本。


    - **贷项通知单选项卡**


    在此部分，你可以看到为此订单生成的所有贷项通知单的完整列表：


    ![](img/de3034a92496a32462134266292a51dd_324_0.png)


    与**发票**选项卡一样，此网格上有一个批量操作，可为所有选中的贷项通知单下载 PDF。


    ## 履行订单


    - **发货选项卡**


    在此部分，你可以看到为此订单生成的所有发货记录的完整列表。需要注意的是，该选项卡在之前的图片中不可用。这是因为发货选项卡仅适用于实物订单，而我们到目前为止所查看的订单是一个仅包含
    1 个可下载产品的订单。


    ![](img/de3034a92496a32462134266292a51dd_325_0.png)


    - 评论历史选项卡


    除了**信息**选项卡中的**此订单备注**部分之外，你还可以从**评论历史**选项卡查看订单的完整评论列表：


    ![](img/de3034a92496a32462134266292a51dd_326_0.png)


    ## 履行订单


    如果你需要编辑客户订单，可以通过单击屏幕右上角的“编辑”按钮来完成。但是，如果你单击该按钮，你将看到以下消息：


    ![](img/de3034a92496a32462134266292a51dd_327_0.png)


    尽管该操作的名称是“编辑”，但实际上当前订单将被取消，并且你将被重定向到一个包含与当前订单相同信息的表单，但在创建订单之前可以编辑这些信息。


    ## 履行订单


    如果你需要编辑客户购买的物品，则需要编辑订单，但更改地址信息则没有必要。如果你单击账单地址或发货地址旁边的“编辑”按钮，你将被重定向到以下表单以编辑这些详细信息：


    ![](img/de3034a92496a32462134266292a51dd_328_0.png)


    正如你在前面截图中的消息中所看到的，更改发货地址不会改变订单总额，因为运费、税金和订单金额不会被重新计算。


    ## 履行订单


    这意味着，例如，当街道名称中存在拼写错误时，编辑地址很有用；但如果地址完全不同，则应取消订单并创建一个新订单（基本上，通过单击“编辑”按钮）以获得更新的运费和税率。


    现在，让我们回到订单网格。你会在屏幕右上角看到一个用于创建新订单的按钮：


    ![](img/de3034a92496a32462134266292a51dd_329_0.png)


    ## 履行订单


    如果你单击该按钮，你将被重定向到以下屏幕：


    ![](img/de3034a92496a32462134266292a51dd_330_0.png)


    创建新订单流程的第一步是选择客户。你可以从列表中选择客户，也可以使用屏幕右上角的按钮创建新客户。


    选择客户后，下一步是在以下页面上添加与订单相关的所有信息：


    ![](img/de3034a92496a32462134266292a51dd_331_0.png)


    这是一个非常长的表单，包含许多用于配置订单的选项。


    首先要注意的是左侧的侧边栏。你可以选择订单的货币，还可以根据客户活动更新订单。


    你将能够看到客户在店面购物车中的所有物品、心愿单中的物品列表、最近订购的物品、比较列表中的产品、最近比较过的产品以及最近查看过的产品。这是一种基于客户在店面中的操作历史快速选择订单产品的方法。


    现在，让我们从第一个部分“已订购物品”开始。


    ## 履行订单


    如果你单击此部分右侧的**添加产品**按钮，将显示以下网格：


    ![](img/de3034a92496a32462134266292a51dd_332_0.png)


    正如你在**产品**列中所看到的，对于捆绑产品、分组产品和可配置产品，有一个**配置**链接。如果你单击该按钮，你将能在以下窗口中为客户配置这些产品：


    ## 履行订单


    ![](img/de3034a92496a32462134266292a51dd_333_0.png)


    一旦你为订单选择了所有产品，你可以单击“将所选产品添加到订单”按钮来更新“已订购物品”网格：


    ![](img/de3034a92496a32462134266292a51dd_333_1.png)


    ## 履行订单


    最后，在**已订购物品**部分，你可以看到**应用优惠券代码**字段。假设我们接到客户电话，并在管理面板中下订单；如果客户有商店促销活动的优惠券代码，你可以将优惠券代码添加到该字段中，促销活动将被应用。


    接下来，我们有**账户信息**和**地址信息**部分：


    ![](img/de3034a92496a32462134266292a51dd_334_0.png)


    在第一个部分中，你可以更改订单的客户组和客户电子邮件。在第二个部分中，你可以从客户账户中选择现有地址，或者在客户没有可用地址或订单需要不同地址时添加新地址。此外，你可以选择**与账单地址相同**，以使用发货地址作为账单地址（此选项在新订单中默认选中）。


    ## 履行订单


    最后，我们可以看到**付款与发货信息**和**订单总计**部分：


    ![](img/de3034a92496a32462134266292a51dd_335_0.png)


    在**付款与发货信息**部分，你可以为订单选择付款方式和发货方式，运费将使用你在上一部分中指定的地址进行计算。


    如果你单击**获取发货方式和运费**链接，系统将使用订单的发货地址即时计算运费，然后你就可以选择客户偏好的发货方式。


    最后，在**订单总计**部分，你可以像我们之前看到的那样向订单添加评论、查看订单总计，并选择是否要在订单确认邮件中附上评论并发送给客户。


    ## 状态和状态值


    从订单在 Magento 中创建的那一刻起，它就会被处理并经历不同的状态和状态值。


    Magento 在内部使用订单状态来标识订单的当前阶段。这些状态不可自定义，且在后台中不可见；它们只能在 Magento 的代码库和数据库中看到。


    订单状态值由商店管理员使用，用来为订单设置流程，从购买开始到订单开票和产品交付为止。这些状态值可由商店管理员在 Magento 管理面板中进行自定义。


    你可以在 `sales_order_status_state` 数据库表中查看所有内部订单状态的列表：


    ![](img/de3034a92496a32462134266292a51dd_336_0.png)


