  - '[PAGE 399]


    +   - **Checkout Process:** The checkout process (all the steps combined) is 48%
    faster for guest checkout and 36% faster for customer checkout in Magento Enterprise
    Edition 2 as compared with Magento Enterprise Edition 1.14.2:


    ![](img/de3034a92496a32462134266292a51dd_399_0.png)'
  - '[PAGE 400]


    Now let''s see how we can increase the performance of the Magento store:


    +   - **Server Configuration:** Even though Magento 2 is compatible with PHP 5.6,
    it''s recommended to use PHP 7 with Varnish to achieve the best performance results.

    +   - **Magento Configuration - Varnish:** We have mentioned Varnish previously;
    in order to enable it, you should deploy and configure Varnish first. After that,
    you will be able to enable it from the Stores Configuration page (**STORES | Configuration**)
    in the admin panel and open the **ADVANCED | System** page. From there, you will
    be able to select Varnish as a caching application and set the configuration:


    ![](img/de3034a92496a32462134266292a51dd_400_0.png)


    +   - **Magento Configuration - Redis:** Redis can be used instead of `Zend_Cache_Backend_File`
    for backend caches, and it''s also used for PHP session storage.'
  - '[PAGE 401]


    +   - **Magento Configuration - Developer Settings:** The following developer
    settings are recommended to increase the performance of your Magento store; you
    can set these configurations from **STORES | Configuration | ADVANCED | Developer**.
    You will see the following sections in that page:


    ![](img/de3034a92496a32462134266292a51dd_401_0.png)


    Set the following configurations:


    +   - **Grid Settings | Asynchronous indexing:** Enable

    +   - **CSS Settings | Minify CSS Files:** Yes

    +   - **JavaScript Settings | Minify JS Files:** Yes

    +   - **JavaScript Settings | Merge JavaScript Files:** No

    +   - **Template Settings | Minify HTML:** Yes

    +   - **JavaScript Settings | Enable JavaScript Bundling:** Yes'
  - '[PAGE 402]


    <!-- no content -->'
  - '[PAGE 403]


    # Store Maintenance


    +   - **Magento Configuration: Email:** You can set the e-mails to be generated
    asynchronously from the **STORES | Configuration | Sales | Sales Emails** section.
    As you can see in the following screenshot, you can mark **Asynchronous** sending
    as enabled:


    ![](img/de3034a92496a32462134266292a51dd_403_0.png)'
  - '[PAGE 404]


    +   - **Magento Configuration - Flat Catalog**: We described the Flat Catalog
    feature for categories and products in Chapter 10, *System Configuration*. As
    we mentioned in that chapter, this setting improves the performance of the store
    by combining all the category and product information in a flat table to fetch
    data in a single query. You can enable the Flat Catalog from the **CATALOG | Catalog**
    store configuration page; these settings are under Storefront as **Use Flat Catalog
    Category** and **Use Flat Catalog Product**, as you can see in the following screenshot:


    ![](img/de3034a92496a32462134266292a51dd_404_0.png)'
  - '[PAGE 405]


    +   - **Magento Configuration - Index:** Instead of the indexes being updated
    at the moment when you make a change in the catalog through the admin panel, you
    can set the reindex process to be done by schedule according to the cron job configuration.
    You can make that change in the **SYSTEM | Index Management** admin panel page.
    From there, you will see that you can set the indexes to be updated by schedule
    using the mass action:


    ![](img/de3034a92496a32462134266292a51dd_405_0.png)


    +   - **Magento Configuration - Production Mode:** When the server and Magento
    have been configured, you should set Magento to run in **Production Mode**. In
    the production mode, static view files are served from the cache instead of going
    through the fallback mechanism from Magento. In addition to that, errors are logged
    by Magento in the `var` folder and they are not displayed to the user on the storefront.
    You can enable the production mode by running the following command in the Magento
    2 command-line tool:


    ```

    php bin/magento deploy:mode:set production

    ```


    You will see output similar to the following screenshot:'
  - '[PAGE 406]


    ![](img/de3034a92496a32462134266292a51dd_406_0.png)


    # # Search engine optimization


    In addition to off-site SEO factors, such as backlinks, onsite SEO factors are
    under your control, and you can optimize the SEO of your Magento store from the
    Magento admin panel. In this section, we will cover all the Magento 2 settings
    that are available out-of-the-box for SEO.'
  - '[PAGE 407]


    # Store Maintenance


    One feature from Magento 2 that is really convenient is metatag autogeneration
    for products. You can set up the feature from the following admin panel section
    (**STORES | Configuration | CATALOG | Catalog | Product Fields Auto-Generation**):


    ![](img/de3034a92496a32462134266292a51dd_407_0.png)


    From there, you can use placeholders and custom text to autogenerate the metatags
    for SEO for all the products in your catalog.


    It''s important to clarify that you can''t set up this feature for each store
    view since these fields are global for your Magento instance, and new changes
    for the autogeneration configuration won''t be applied to existing products.'
  - '[PAGE 408]


    In addition to that, you can override the autogenerated value from Search engine
    optimization in the product settings at any given time.


    In the following screenshot, you can also see that you can specify an SEO-friendly
    **URL key** for the product as well. You can configure the **ALT Text** for all
    the product images from the same page by updating **ALT Text** from the **Image
    Detail** window in the **Images and Videos** section:


    ![](img/de3034a92496a32462134266292a51dd_408_0.png)'
  - '[PAGE 409]


    # Store Maintenance


    If you go to **PRODUCTS | Categories**, you will be able set the URL key, Meta
    Title, Meta Keywords, and Meta Description for each of the categories as well:


    ![](img/de3034a92496a32462134266292a51dd_409_0.png)


    Finally, two very important aspects of SEO are the XML sitemap and the Robots.xml
    files for your website. You can set up the XML sitemap for your store from the
    **STORES | Configuration | Catalog | XML Sitemap** section:'
  - '[PAGE 410]


    <!-- no content -->'
  - '[PAGE 411]


    The Robots.txt settings can be found in the STORES | Configuration | General |
    Design | Search Engine Robots section:


    ![](img/de3034a92496a32462134266292a51dd_411_0.png)


    In this page, you can set:


    +   - **Default robots**: Choose the default robots rules:

    +     - INDEX, FOLLOW

    +     - NOINDEX, FOLLOW

    +     - INDEX, NOFOLLOW

    +     - NOINDEX, NOFOLLOW

    +   - **Edit the custom instruction of robots.txt file**: Enter the custom instructions
    for the Robots.txt file if required

    +   - **Reset to Defaults**: Delete custom instructions and reset the Robots.txt
    configuration to default'
  - '[PAGE 412]


    # Cache and Index Management


    Two aspects to consider when managing a Magento store are cache and index.


    Every time you make a change to the storefront, such as adding a new banner or
    changing a title, if the cache is enabled, you have to clear it to allow your
    customers to see updates on the storefront.


    Similarly, every time you make a change to the catalog, you have to reindex it
    to display the updated information for your customers.


    If you open the **SYSTEM** tab in the Magento admin panel, you will see that both
    sections are available under the **Tools** sub-menu:


    ![](img/de3034a92496a32462134266292a51dd_412_0.png)'
  - '[PAGE 413]


    <!-- no content -->'
