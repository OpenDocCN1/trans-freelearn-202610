    ## 小部件


    小部件是可以包含在不同页面中的模块，通过不同的小部件类型，根据不同的配置显示信息。


    Magento 中提供以下用于内容管理的小部件：


    - CMS 页面链接

    - CMS 静态块

    - 目录类别链接

    - 目录新产品列表

    - 目录产品链接

    - 目录产品列表

    - 订单和退货

    - 最近比较的产品

    - 最近查看的产品


    你可以通过转到管理面板中的“内容 | 元素 | 小部件”部分来管理你的小部件：


    ![](img/de3034a92496a32462134266292a51dd_206_0.png)


    Magento 2 示例数据中包含 18 个小部件。如下面的截图所示，它们都是 CMS 静态块，分布在店面（Storefront）的不同位置。


    ## CMS 页面、静态块和小部件


    ![](img/de3034a92496a32462134266292a51dd_207_0.png)


    我们将通过单击屏幕右上角的“添加小部件”按钮来创建一个新小部件。将显示以下表单：


    ![](img/de3034a92496a32462134266292a51dd_207_1.png)


    你可以在下面的截图中看到小部件的条件：


