  - '[PAGE 285]


    +   - **Labels:** From this section, you can manage the default and specific labels
    for each of the store views:


    ![](img/de3034a92496a32462134266292a51dd_285_0.png)


    +   - **Manage Coupon Codes:** You can generate coupon codes for the promotion,
    based on specific properties, including length, code format, prefix, suffix, and
    dashes:'
  - '[PAGE 286]


    # Catalog and Shopping Cart Price Rules


