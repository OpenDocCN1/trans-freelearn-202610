    to reveal its subcategories:


    ![](img/de3034a92496a32462134266292a51dd_189_0.png)


    Now, let''s say we want to change the hierarchy for the category tree by moving
    the Sample Category to become a child category of the Woman category.


    If you want to do that, Magento allows you to simply drag and drop the category,
    just like you do in your favorite operating system to manage your folders.


    Let''s go ahead and drag the Sample Category from its current location and drop
    it on top of the Women category.'
