    \  - `vendor/magento/data-migration-tool/etc/ce-to-ee`\n- Migration from Magento\
    \ 1 Enterprise Edition to Magento 2 Enterprise Edition:\n  - `vendor/magento/data-migration-tool/etc/ee-to-ee`\n\
    \nYou can see the content of each of those directories in the following screenshot:\n\
    \n![](img/de3034a92496a32462134266292a51dd_75_0.png)\n\nBefore running the migration\
    \ process, you should create `config.xml` with all the database connection details\
    \ for the migration.\n\nDepending on the type of migration (ce to ce, ce to ee,\
    \ or ee to ee), you should add `config.xml` to the specific location that we previously\
    \ described.\n\nFor this migration, I have prepared a Magento 1 Community Edition\
    \ with a sample data instance:\n\n![](img/de3034a92496a32462134266292a51dd_76_0.png)\n\
    \nThis migration will be from Magento 1 Community Edition to Magento 2 Community\
    \ Edition, so the location for the configuration file will be `vendor/magento/data-migration-tool/etc/ce-to-ce/<Magento\
    \ 1 version>/config.xml`.\n\nIn the location, the `<Magento 1 version>` is the\
    \ version number of your Magento 1 store. The installed Magento 1 version in this\
    \ example is `1.9.2.4`, so the following command should be run to go to the right\
    \ directory: `cd vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4`\n\n\
    There is a sample configuration file in that directory, so you should go to the\
    \ directory and run the following command to duplicate it: `cp config.xml.dist\
    \ config.xml`\n\nHere, you can see all the commands to go to the right directory\
    \ and duplicate the configuration file, including a preview of that file:\n\n\
    ```shell\n~/Projects/Playground/magento2-migration.dev $ cd vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4\n\
    ~/Projects/Playground/magento2-migration.dev/vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4\
    \ $ ls\nconfig.xml.dist  map.xml.dist\n~/Projects/Playground/magento2-migration.dev/vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4\
