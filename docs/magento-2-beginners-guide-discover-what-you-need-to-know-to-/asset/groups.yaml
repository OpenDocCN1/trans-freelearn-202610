    \ your store.\n\n## 8. CMS Pages, Blocks, and Widgets\n\nIn this chapter, we will\
    \ cover the following topics:\n\n- CMS Pages\n- Static blocks\n- Widgets\n\n###\
    \ CMS Pages\n\nIf you are wondering whether you can add additional pages with\
    \ static content, this is the right section for you. We will cover the process\
    \ of managing static pages in Magento, such as *Privacy Policy* or *Terms and\
    \ Conditions*, allowing you to create additional pages to add more information\
    \ to your store.\n\nYou can manage these pages from the **CONTENT | Elements |\
    \ Pages** section in the admin panel:\n\n![](img/de3034a92496a32462134266292a51dd_196_0.png)\n\
    \nIf you go to the section, you will see the list of pages that are currently\
    \ available in your store:\n\n![](img/de3034a92496a32462134266292a51dd_196_1.png)\n\
    \nAs you can see in the previous screenshot, there are six pages included in the\
    \ Magento 2 sample data. One important aspect of CMS Pages is the **URL Key**,\
    \ which is unique for each page from the same store view.\n\nYou can access the\
    \ CMS Pages by combining the Base URL for the store and the URL Key. For example,\
    \ to access the **About us** page, you should go to\nhttp://magento2-playground.dev/about-us.\n\
    \nYou will see the following page on the screen:\n\n![](img/de3034a92496a32462134266292a51dd_197_0.png)\n\
    \nNow, let's say you want to edit the page to update the subtitle. Then, you should\
    \ click on Select on the row for that page in the pages grid and click on Edit:\n\
    \n![](img/de3034a92496a32462134266292a51dd_198_0.png)\n\nYou will be redirected\
    \ to the following form:\n\n![](img/de3034a92496a32462134266292a51dd_198_1.png)\n\
    \n## 故宫博物院\n\n### 故宫学研究报告·2024\n\n#### 内容提要\n\n本书以故宫学为整体研究视域，从故宫古建筑、院藏文物、宫廷遗存、学术成果等维度，系统梳理2024年度故宫博物院在文物保护、学术研究、对外文化交流等方面的重要进展与核心成果，力求全面呈现故宫学研究的年度面貌与发展趋势。\n\
    \n本卷在既往编辑经验的基础上，进一步突出研究的系统性、前沿性与开放性，围绕故宫学理论建构、文化遗产保护利用、明清宫廷历史与文化、文物科技保护等主题，精选重要论文与研究报告，以期为相关领域的研究者与爱好者提供兼具学术深度与阅读价值的年度文本。\n\
    \n- **New Layout:** Set a specific layout on the scheduled date:\n  - Empty\n\
    \  - 1 column\n  - 2 columns with left bar\n  - 2 columns with right bar\n  -\
    \ 3 columns\n\nWe will edit the **About Us** page by updating the following fields:\n\
    \n- **General:**\n  - **Page Title:** `About this company`\n- **Content:**\n \
    \ - **Content Heading:** `The company`\n  - **WYSIWYG Editor:** Replace `230 stores`\
    \ with `300 stores` and add an image below the subtitle\n\nNow, if you try to\
    \ access the same page as before, you will see the changes that we made:\n\n![](img/de3034a92496a32462134266292a51dd_200_0.png)\n\
    \n### Static blocks\n\nIf you have information that you want to display in different\
    \ places, for example, a promotional banner, or the *Business Hours* for your\
    \ business location, then you should have a way of editing the information from\
    \ one section in the admin panel and implementing it in different areas of your\
    \ websites.\n\nMagento allows you to do the same through static blocks. Static\
    \ blocks are a powerful way of managing content in your Magento store as you can\
    \ add HTML content to display in different pages and manage them from the static\
    \ blocks section in the admin panel.\n\nYou can access the static blocks section\
    \ through the **CONTENT | Elements | Blocks** menu item in the admin panel:\n\n\
    ![](img/de3034a92496a32462134266292a51dd_202_0.png)\n"
  mdcn: "\n\n![](img/de3034a92496a32462134266292a51dd_184_0.png)\n\n按照前面的截图，选择我们在上一章中创建的所有产品。\n\
    \n8. 下一节是 Design。就像产品一样，你也可以为分类设置特定的设计：\n\n![](img/de3034a92496a32462134266292a51dd_184_1.png)\n\
    \n我们将逐一介绍各个字段，但我们将为所有字段保留默认值：\n\n- **Use Parent Category Settings**: 如果你点击此复选框，该分类将继承父分类的设计配置\n\
    - **Theme**: 你可以为分类选择特定的主题\n- **Layout**: 你可以为分类设置特定的布局：\n  - **Empty**\n  - **1\
    \ column**\n  - **2 columns with left bar**\n  - **2 columns with right bar**\n\
    \  - **3 columns**\n- **Layout Update XML**: 为分类布局添加自定义 XML 配置，例如自定义样式表\n- **Apply\
    \ Design to Products**: 如果你点击此复选框，相关产品将继承此分类的设计配置\n\n9. 表单末尾的章节是 **Schedule Design\
    \ Update**。在这里，你可以为上一节的设计更新指定一个日期范围。我们将对此分类保持为空。\n\n10. 点击 **Save** 来添加新的分类。\n\
    \n分类保存后，你将看到确认消息以及该分类作为 **Default Category** 的子分类：\n\n![](img/de3034a92496a32462134266292a51dd_186_0.png)\n\
    \n如果进入 Storefront，你将在主导航菜单中看到新的分类：\n\n![](img/de3034a92496a32462134266292a51dd_186_1.png)\n\
    \n## Hierarchy\n\n正如我们之前所见，你可以通过在创建子分类前选择父分类来设置分类的层级结构。Magento 允许你轻松管理分类的层级结构，我们将回顾如何更新分类树以更改父分类和子分类。\n\
    \n在分类树中，你会看到有些分类旁边有一个加号图标：\n\n![](img/de3034a92496a32462134266292a51dd_188_0.png)\n\
    \n如果你点击任意一个加号图标，你将能够展开该分类以显示其子分类：\n\n![](img/de3034a92496a32462134266292a51dd_189_0.png)\n\
    \n现在，假设我们想通过将 Sample Category 移为 Women 分类下的子分类来更改分类树的层级结构。\n\n如果你想这样做，Magento\
    \ 允许你像在你喜欢的操作系统中管理文件夹那样简单地拖放分类。\n\n我们继续将 Sample Category 从当前位置拖出并放到 Women 分类之上。\n\
    \n你将在屏幕上看到以下消息：\n\n![](img/de3034a92496a32462134266292a51dd_190_0.png)\n\n更新分类的层级结构会消耗\
    \ Magento 很多资源，这就是为什么屏幕上会显示警告。让我们继续前进并按下 Ok 以继续操作。\n\n分类移动后，你将看到确认消息以及屏幕上的更新后分类树：\n\
    \n![](img/de3034a92496a32462134266292a51dd_191_0.png)\n\n现在，如果你进入 Storefront，你将在屏幕上看到更新后的导航菜单：\n\
    \n![](img/de3034a92496a32462134266292a51dd_191_1.png)\n\n## Top navigation\n\n\
    让我们再看一下管理面板中的分类树：\n\n![](img/de3034a92496a32462134266292a51dd_192_0.png)\n\n正如你所见，其中一些分类的颜色为浅灰色。这意味着这些分类已被禁用，这就是为什么\
    \ Collections 和 Promotions 在 Storefront 的主导航菜单中不可见。\n\n即使这是正确的，一个分类在主导航菜单中不可见的第二个原因也可能是存在的。如果你查看前面的截图，你会看到表单中有一个\
    \ Include in Menu 设置。这是一个非常重要的设置，因为你可以保持分类启用但不包含在主导航菜单中。\n\n我们继续选择之前创建的 Sample\
    \ Category。进入后，将 Include in Menu 设置更新为 No，如以下截图所示：\n\n![](img/de3034a92496a32462134266292a51dd_193_0.png)\n\
    \n如果你现在进入 Storefront，你会看到 Women 菜单项在下拉菜单中不包含 Sample Category 子菜单项：\n\n![](img/de3034a92496a32462134266292a51dd_194_0.png)\n\
    \n这允许你指定要在主导航菜单中保持可见的菜单项，这对于自定义目录在 Storefront 向客户展示的方式非常重要。\n\n## Summary\n\n\
    在本章中，你学习了如何在你的 Magento 商店中管理分类，现在你可以将产品关联到不同的分类并更新主导航菜单。在下一章中，我们将介绍 CMS 页面、块和部件以继续自定义你的商店。\n\
    \n## 8. CMS Pages, Blocks, and Widgets\n\n在本章中，我们将介绍以下主题：\n\n- CMS Pages\n- Static\
    \ blocks\n- Widgets\n\n### CMS Pages\n\n如果你想知道是否可以添加带有静态内容的额外页面，那么这是适合你的部分。我们将介绍在\
    \ Magento 中管理静态页面的流程，例如 *Privacy Policy* 或 *Terms and Conditions*，让你可以创建额外页面以向你的商店添加更多信息。\n\
    \n你可以通过管理面板中的 **CONTENT | Elements | Pages** 部分管理这些页面：\n\n![](img/de3034a92496a32462134266292a51dd_196_0.png)\n\
    \n进入该部分后，你将看到商店中当前可用的页面列表：\n\n![](img/de3034a92496a32462134266292a51dd_196_1.png)\n\
    \n正如前一个截图中所示，Magento 2 示例数据中包含六个页面。CMS 页面一个重要方面是 **URL Key**，它对同一商店视图中的每个页面都是唯一的。\n\
    \n你可以通过组合商店的 Base URL 和 URL Key 来访问 CMS 页面。例如，要访问 **About us** 页面，你应该前往\nhttp://magento2-playground.dev/about-us.\n\
    \n你将在屏幕上看到以下页面：\n\n![](img/de3034a92496a32462134266292a51dd_197_0.png)\n\n现在，假设你想编辑页面以更新副标题。然后，你应该在页面网格中该页面的行上点击\
    \ Select 并点击 Edit：\n\n![](img/de3034a92496a32462134266292a51dd_198_0.png)\n\n\
    你将被重定向到以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_198_1.png)\n\n## 故宫博物院\n\
    \n### 故宫学研究报告·2024\n\n#### 内容提要\n\n本书以故宫学为整体研究视域，从故宫古建筑、院藏文物、宫廷遗存、学术成果等维度，系统梳理2024年度故宫博物院在文物保护、学术研究、对外文化交流等方面的重要进展与核心成果，力求全面呈现故宫学研究的年度面貌与发展趋势。\n\
    \n本卷在既往编辑经验的基础上，进一步突出研究的系统性、前沿性与开放性，围绕故宫学理论建构、文化遗产保护利用、明清宫廷历史与文化、文物科技保护等主题，精选重要论文与研究报告，以期为相关领域的研究者与爱好者提供兼具学术深度与阅读价值的年度文本。\n\
    \n- **New Layout:** Set a specific layout on the scheduled date:\n  - Empty\n\
    \  - 1 column\n  - 2 columns with left bar\n  - 2 columns with right bar\n  -\
    \ 3 columns\n\n我们将通过更新以下字段来编辑 **About Us** 页面：\n\n- **General:**\n  - **Page Title:**\
    \ `About this company`\n- **Content:**\n  - **Content Heading:** `The company`\n\
    \  - **WYSIWYG Editor:** 将 `230 stores` 替换为 `300 stores` 并在副标题下方添加一张图片\n\n现在，如果你尝试像之前一样访问同一页面，你将看到我们所做的更改：\n\
    \n![](img/de3034a92496a32462134266292a51dd_200_0.png)\n\n### Static blocks\n\n\
    如果你有想要在不同位置显示的信息，例如促销横幅，或你业务地点的 *Business Hours*，那么你应该有一种方式从管理面板的一个部分编辑信息并将其实现在网站的不同区域。\n\
    \nMagento 允许你通过静态块来实现同样的功能。静态块是管理 Magento 商店内容的一种强大方式，因为你可以添加 HTML 内容以在不同页面中显示并从管理面板的静态块部分进行管理。\n\
    \n你可以通过管理面板中的 **CONTENT | Elements | Blocks** 菜单项访问静态块部分：\n\n![](img/de3034a92496a32462134266292a51dd_202_0.png)\n\
