    5. Open the apache2.conf file and set AllowOverride all to grant the right permissions\
    \ to the document root.\n\n6. Find the following block of code:\n\n```\n<Directory\
    \ /var/www/>\n  Options Indexes FollowSymLinks\n  AllowOverride none\n  Require\
    \ all granted\n</Directory>\n```\n\nReplace it with the following code:\n\n```\n\
    <Directory /var/www/>\n  Options Indexes FollowSymLinks\n  AllowOverride all\n\
    \  Require all granted\n</Directory>\n```\n\n7. Restart the Apache server to apply\
    \ the changes:\n\n```\nsudo service apache2 restart\n```\n\n8. Create a sample\
