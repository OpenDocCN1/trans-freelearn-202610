    \nAmazon EC2\n\nAmazon Elastic Compute Cloud (Amazon EC2) 是一种 Web 服务，提供云中的可扩展计算容量。它旨在让开发人员更轻松地进行\
    \ Web 级云计算。\n\nAmazon EC2 简单的 Web 服务接口允许你以最小的摩擦获得和配置容量。它为你提供对计算资源的完全控制，并让你能够在\
