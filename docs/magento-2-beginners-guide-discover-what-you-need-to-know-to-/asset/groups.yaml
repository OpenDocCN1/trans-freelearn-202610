    # # 故宫博物院


    # ## 故宫学研究报告·2024


    # ### 内容提要


    本书以故宫学为整体研究视域，从故宫古建筑、院藏文物、宫廷遗存、学术成果等维度，系统梳理2024年度故宫博物院在文物保护、学术研究、对文化交流等方面的重要进展与核心成果，力求全面呈现故宫学研究的年度面貌与发展趋势。


    本卷在既往编辑经验的基础上，进一步突出研究的系统性、前沿性与开放性，围绕故宫学理论建构、文化遗产保护利用、明清宫廷历史与文化、文物科技保护等主题，精选重要论文与研究报告，以期为相关领域的研究者与爱好者提供兼具学术深度与阅读价值的年度文本。'
