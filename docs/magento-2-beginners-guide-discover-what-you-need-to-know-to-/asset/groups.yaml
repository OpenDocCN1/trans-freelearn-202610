    # 9

    Managing Scope and Locale Settings


    In this chapter, we will cover:


    +   - Magento scopes – websites, stores, and store views

    +   - Reviewing how adding store views affects the catalog and CMS

    +   - Languages


    # Magento scopes – websites, stores, and store views


    One of the most important features of Magento is the ability to create multiple
    stores from a single Magento instance. Magento has implemented a hierarchical
    system that includes four levels:


    +   - Default/global

    +   - Website

    +   - Store/store group

    +   - Store view'
  - '[PAGE 213]


    The most common scenario of multistore configuration in Magento is found in retailers
    that separate their catalog by store view as follows:


    ![](img/de3034a92496a32462134266292a51dd_213_0.png)


    In the preceding example, the company has a website, but each product family has
    its own store to target different customers. Finally, each store has its own store
    views to be able to display the content in different languages.


    With a single instance of Magento, you can implement a multistore configuration
    using:


    +   - Multiple languages

    +   - Multiple domain names

    +   - Different categories'
  - '[PAGE 214]


    # Managing Scope and Locale Settings


    You can see the store configuration for your Magento instance in the STORES |
    Settings | All Stores section of the Magento admin panel. You will see the following
    grid on the screen:


    ![](img/de3034a92496a32462134266292a51dd_214_0.png)


    There you will see the current store configuration of your Magento instance. Magento
    includes one website, one store, and one store view in the Magento 2 sample data.
    In the subsequent sections, we will review all the concepts, from websites to
    store views.


    # Websites


    A website contains one or more stores. You can have a different set of customers
    in different websites, all of them managed from a single Magento instance.

    If not, you can share the customer accounts between all the websites. In addition
    to that, you can set specific product prices, tax classes, currencies, and system
    configurations by website.'
  - '[PAGE 215]


    # Stores/store groups


    A store contains products and categories. Each store has an associated root category,
    allowing you to define different categories by store. In the previous example,
    we saw two stores with completely different product families:


    ![](img/de3034a92496a32462134266292a51dd_215_0.png)


    Magento allows you to do this by defining a root category per store. All the stores
    that are associated with the same website share the same customer accounts.


    # Store views


    Store views are commonly used to define different languages for your website.
    By doing so, the merchants are able to target customers by their language.'
  - '[PAGE 216]


    # Managing Scope and Locale Settings


    All the store views that are associated with the same store share the same root
    category, shipping, and payment methods. By using store views, you can set different
    prices, titles, descriptions, and more.


    We will review the **Web Site**, **Store**, and **Store View** that is included
    in the Magento 2 sample data.


    We will go to the **STORES** section in the admin panel: **STORES | Settings |
    All Stores.**


    There, you will see the grid that we described before:


    ![](img/de3034a92496a32462134266292a51dd_216_0.png)'
  - '[PAGE 217]


    # Managing Scope and Locale Settings


    We will start by clicking on the Main Website link on the first column. You will
    be redirected to the following screen:


    ![](img/de3034a92496a32462134266292a51dd_217_0.png)


    There you can edit the Name, Code, Sort Order, and Default Store. Take into account
    that the multistore configuration can be set in the index.php file in the root
    of the project. If the multistore configuration has been set in that way and you
    change the website code, make sure to update the index.php file to specify the
    new code for the website.'
  - '[PAGE 218]


    # Managing Scope and Locale Settings


    If we go back to the **STORES** grid and click on the **Main Website Store** link
    in the second column, we will be redirected to the following page:


    ![](img/de3034a92496a32462134266292a51dd_218_0.png)


    As you can see on that page, you can see the parent website for this store, edit
    the **Name**, and set the **Root Category** and the **Default Store View**.'
  - '[PAGE 219]


    Finally, if we go back to the grid and click on the Default Store View link in
    the third column, we will be redirected to the following form:


    ![](img/de3034a92496a32462134266292a51dd_219_0.png)


    You can edit the parent store for the store view, set the Name, Code, Status,
    and Sort Order. It''s important to mention that the multistore configuration can
    be set using the store view code in the index.php file. If that is the case, you
    should update the file every time you change the store view code in the admin
    panel.


    # Default/global scope


    Besides the Web Site, Store, and Store View, we should mention that the default/global
    scope defines the default values for different configurations in the admin panel.
    By selecting this scope, you will set the specific configuration to be applied
    to all websites, stores, and store views.


    When you are editing the Magento configuration, products, or categories, you will
    be able to select the scope for the values. You can define the values globally,
    or, specifically, on a website, store, or store view level.'
