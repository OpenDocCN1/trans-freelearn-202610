    # Reports


    As you can see in the following image, there are two mass actions you can select
    to update the selected reports by refreshing lifetime statistics or just for the
    last day:


    ![](img/de3034a92496a32462134266292a51dd_364_0.png)'
  - '[PAGE 365]


    If **Refresh Lifetime Statistics** is selected, the confirmation message clarifies
    that the update may slow down the performance of your store:


    ![](img/de3034a92496a32462134266292a51dd_365_0.png)'
  - '[PAGE 366]


    # Reports


    If you confirm the update, the data for your report will be up to date and the
    **Updated** date in the grid will show the time that the reports were updated
    at:


    ![](img/de3034a92496a32462134266292a51dd_366_0.png)


    Let''s review each of the reports:


    +   - **Marketing | Products in Carts:** The first report in the marketing group
    is the **Products in Carts** report. As the name suggests, you can see the products
    that are currently in customers'' shopping carts on the storefront or in pending
    orders in the admin panel.

    +   - **Marketing | Search Terms:** The second report in the marketing group is
    the **Search Terms** report, which allows you to see the most popular search queries
    in your Magento store.

    +   - **Marketing | Abandoned Carts:** The next report allows you to see the abandoned
    carts from your customers, which is really important in order to contact those
    customers again to motivate them to complete their order.'
  - '[PAGE 367]


    # Reports


    +   - **Marketing | Newsletter Problems Report:** If there are errors in the newsletter
    delivery, you will be able to see and review those errors from this report, and
    all the details about the errors will be located in the log file in the `var/log`
    folder.

    +   - **Reviews | By Customers / By Products:** With these reports, you will be
    able to take a closer look at the statistics of the reviews in your store, grouping
    the statistics for those reviews by customers or by products.

    +   - **Sales | Orders / Tax / Invoiced / Shipping / Refunds / Coupons:** See
    all the statistics related to orders, tax rates, invoices, shipping, credit memos,
    and coupons in your store. For all reports, there is a filter to see the report
    by period of time, date range, and order status.

    +   - **Sales | PayPal Settlements / Braintree Settlements:** See the information
    for every transaction that affects the settlement of funds for PayPal and Braintree.

    +   - **Customers | Orders Total:** See the total amount for the orders of each
    customer for a given period of time, including the average amount of orders by
    customer.

    +   - **Customers | Order Count:** See the total number of orders by each customer
    for a given period of time, including the average number of orders by customer.

    +   - **Customers | New:** Number of new customers by interval of a specific period
    of time.

    +   - **Products | Views:** See the number of views for each of the products in
    the store in a specific period of time.

    +   - **Products | Bestsellers:** Review the list of bestsellers for a given period
    of time.

    +   - **Products | Low Stock:** Review the list of products that currently have
    a low stock quantity.

    +   - **Products | Ordered:** See a list of ordered products and the quantity
    sold for the selected period of time.

    +   - **Products | Downloads:** See the statistics related to downloadable products,
    including purchases and downloads.


    # Summary


    In this chapter, we reviewed the existing reports in Magento 2, and we reviewed
    how to refresh the statistics to get up-to-date information from each one of them.
    In the next chapter, you will learn about managing Magento themes, inline translations,
    the Magento Marketplace, and more, to be able to customize your Magento store.'
  - '[PAGE 368]


    # 20


    # Customizing Your Magento Store


