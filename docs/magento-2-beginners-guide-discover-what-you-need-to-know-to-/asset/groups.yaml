  - '[PAGE 81]


    # Migration


    The mapping files are located in the same directories that we described before.
    There, we will see the mapping file templates:


    ![](img/de3034a92496a32462134266292a51dd_81_0.png)


    The `map.xml.dist` file will be the one that you will use most of the time. Besides
    that, Magento provides a set of additional mapping files:


    +   - **General:**

    +     - `class-map.xml.dist`: Class mappings between Magento 1 and Magento 2

    +     - `config.xml.dist`: Main configuration file for the Data Migration Tool

    +     - `datalog.xml.dist`: List of tables for the setup of database routines

    +     - `settings.xml.dist`: Configuration file for the `core_config_data` table
    migration

    +   - **EAV step in Data Migration Tool:**

    +     - `map-eav.xml.dist`: Map file

    +     - `eav-attribute-groups.xml.dist`: List of attributes

