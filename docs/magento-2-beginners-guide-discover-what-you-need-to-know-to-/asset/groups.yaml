    \ Edition:\n  - Version 1.6.x\n  - Version 1.7.x\n  - Version 1.8.x\n  - Version\
    \ 1.9.x\n- Magento Enterprise Edition:\n  - Version 1.11.x\n  - Version 1.12.x\n\
    \  - Version 1.13.x\n  - Version 1.14.x\n\n## 迁移流程\n\n在使用 Data Migration Tool\
    \ 之前，您应遵循以下步骤：\n\n1. Set up an empty Magento 2 instance: The instance should meet\
    \ the requirements described in Chapter 2, Installation and the cron jobs shouldn't\
