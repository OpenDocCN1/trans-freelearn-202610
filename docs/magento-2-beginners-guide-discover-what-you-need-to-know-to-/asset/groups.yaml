    - **Product Alert:**\n  - Cron Error Warning\n  - Price Alert\n  - Stock Alert\n\
    - **Promotions:**\n  - Promotion Notification / Reminder\n  - Admin Activity\n\
    \  - Forgot Admin Password\n  - Reset Password\n- **Email Templates:**\n  - Email\
    \ – Header\n  - Export Failed\n  - Import Failed\n- **Product Alert:**\n  - Product\
    \ Alerts Cron Error\n  - Product Price Alert\n  - Product Stock Alert\n- **Order:**\n\
