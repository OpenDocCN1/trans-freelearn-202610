    Here, you can see the details in the checkout page:


    ![](img/de3034a92496a32462134266292a51dd_150_0.png)


    ## Grouped Product


    Grouped Products are simple products that are presented in the product details
    page together. Let''s say you want to display accessories in addition to the main
    product:


    - Digital camera

    - Memory card

    - Tripod


    By doing this, you have the opportunity of presenting one set of products together
    to increase the probability of selling all of them. There are multiple ways of
    doing this and the **Grouped Product** type is one of them.


    Let''s create a **Grouped Product**:


    1. Go to the **PRODUCTS | Inventory | Catalog** page.

    2. Click on the arrow inside the **Add Product** button and select **Grouped Product**.


    ![](img/de3034a92496a32462134266292a51dd_151_0.png)


    3. Once you open the **New Product** page, you will see that the form is almost
    identical to the other forms that we have seen before in that page. The difference
    is that there is a new section in the form: **Grouped Products**


    ![](img/de3034a92496a32462134266292a51dd_152_0.png)


    4. If you click on the Add Products to Group button, the following window will
    be displayed in the page:


    ![](img/de3034a92496a32462134266292a51dd_153_0.png)


    5. For the grouped product, we will select the existing products from the Magento
    2 sample data.


    Select the products with the following IDs:


    - 1: Joust Duffle Bag

    - 4: Wayfarer Messenger Bag

    - 8: Voyage Yoga Bag


    ![](img/de3034a92496a32462134266292a51dd_154_0.png)


    6. Now, click on the Add Selected Products button on the top-right corner of the
    screen. Finally, append the additional information for the product as well:


    ### General Information:


    - **Enable Product:** Yes

    - **Attribute Set:** Default

    - **Product Name:** Bag Collection

    - **SKU:** bag-collection

    - **Stock Status:** In Stock

    - **Visibility:** Catalog, Search

    - **Categories:** Default Category | Collections | Erin Recommends


    For the grouped product, I uploaded each of the images from the associated simple
    products:


    ![](img/de3034a92496a32462134266292a51dd_155_0.png)


    7. Now, save the product by clicking on the Save button on the top-right corner
    of the screen.


    Let''s see how the product is displayed on the Storefront. We have associated
    the product with the Erin Recommends category. You can''t access that category
    from the main navigation menu; you should click on the banner in the middle of
    the page that contains the Shop Erin Recommends link:


    ![](img/de3034a92496a32462134266292a51dd_156_0.png)


    You will find the product in the last page of the product listing page:


    ![](img/de3034a92496a32462134266292a51dd_156_1.png)


    Let''s click on the product to review the product details page:


    ![](img/de3034a92496a32462134266292a51dd_157_0.png)


    As you can see on the page, you can add any number of items from each of the products.
    If you add some of these products to the cart, they will be individually displayed
    there.


    ## Bundle Product


    A **Bundle Product** is very similar to a **Grouped Product**; the only difference
    is that the customer can choose the products to include into the bundle. The final
    price will depend on the options that have been chosen.


    A very good example of a **Bundle Product** is a computer. The customer will be
    able to choose which components to include in the computer; for example, the customer
    will be able to select between 8 GB and 16 GB for memory or between 256 GB and
    512 GB for SSD storage. The price of the product will be updated at the time of
    the selection, depending on the selection.


    We will create a Bundle Product using the Magento 2 sample data:


    1. Go to the PRODUCTS | Inventory | Catalog page.

    2. Click on the arrow inside the Add Product button and select Bundle Product.


    You will see that the form will be similar to the other products but there will
    be a new section, Bundle Items:


    ![](img/de3034a92496a32462134266292a51dd_158_0.png)


    3. We will add the following information on this product:


    ### General Information:


    - **Enable Product:** Yes

    - **Attribute Set:** Default

    - **Product Name:** Bags

    - **Dynamic SKU:** Yes

    - **Dynamic Price:** Yes

    - **Stock Status:** In Stock

    - **Dynamic Weight:** Yes

    - **Visibility:** Catalog, Search

    - **Categories:** Default Category | Collections | Erin Recommends


    By enabling the **Dynamic Price**, **Dynamic Weight**, and **Dynamic SKU**, the
    customer will get the information for each of the options in the product details
    page.


    **Ship Bundle Items:**


    With this setting, you can specify if the bundle products will be shipped together
    or separately.


    - **Ship Bundle Items:** Together


    4. Now, click on **Add Option** in that section:


    ![](img/de3034a92496a32462134266292a51dd_159_0.png)


    The following screen will be displayed:


    ![](img/de3034a92496a32462134266292a51dd_160_0.png)


    Here, you can set the Option Title, Input Type (Drop-down, Radio Buttons, Checkbox,
    or Multiple Select), and set whether the option is mandatory or not. Each of the
    options in a bundle product will have a set of products to select. You can add
    those products to the option by clicking on the Add Product to Option button.


    We will set the following information for the option:


    - **Option Title:** Choose your collection

    - **Input Type:** Radio Buttons

    - **Required:** Yes


    ![](img/de3034a92496a32462134266292a51dd_161_0.png)


    5. Now, if you click on **Add Product to Option**, the following modal will be
    displayed:


    ![](img/de3034a92496a32462134266292a51dd_162_0.png)


    Filter the grid to show bags by using the **Name** filter, as follows:


    ![](img/de3034a92496a32462134266292a51dd_162_1.png)


    We will select all the products from the filtered grid:


    ![](img/de3034a92496a32462134266292a51dd_163_0.png)


    6. Click on Add Selected Products to associate the products, and then, set the
    default quantity to 1 for the bundled items, as you can see in the following screenshot:


    ![](img/de3034a92496a32462134266292a51dd_163_1.png)


    7. We will associate an image from one of the bundled items for our new product:


    ![](img/de3034a92496a32462134266292a51dd_164_0.png)


    8. Finally, click on Save to save the bundle product.


    Let''s review the new product on the Storefront. This is how the product looks
    in the product listing page:


    ![](img/de3034a92496a32462134266292a51dd_164_1.png)


    ## Virtual Product


    Magento allows you to create non-tangible products for your catalog, such as memberships
    or professional services. These products can be displayed individually or included
    as part of grouped or bundle products.


    Virtual products are very similar to the simple products in Magento, the only
    difference being that the virtual products don''t have weight as an attribute
