    \ 您可以在 **STORES | Configuration | Sales | Sales Emails** 部分将邮件设置为异步生成。如以下截图所示，您可以标记\
    \ **Asynchronous** 发送为已启用：\n\n    ![](img/de3034a92496a32462134266292a51dd_403_0.png)\n\
    \n- **Magento 配置 - 平面目录：** 我们在第 10 章 *System Configuration* 中描述了类别和产品的平面目录功能。正如我们在该章中所提到的，此设置通过将所有类别和产品信息合并到一个平面表中以单次查询获取数据，从而提高商店性能。您可以在\
    \ **CATALOG | Catalog** 商店配置页面启用平面目录；这些设置在 Storefront 下为 **Use Flat Catalog Category**\
    \ 和 **Use Flat Catalog Product**，如以下截图所示：\n\n    ![](img/de3034a92496a32462134266292a51dd_404_0.png)\n\
    \n- **Magento 配置 - 索引：** 而不是在通过管理面板对目录进行更改时立即更新索引，您可以设置重新索引过程根据 cron 作业配置按计划执行。您可以在\
    \ **SYSTEM | Index Management** 管理面板页面进行此更改。从那里，您将看到可以使用批量操作将索引设置为按计划更新：\n\n \
    \   ![](img/de3034a92496a32462134266292a51dd_405_0.png)\n\n- **Magento 配置 - 生产模式：**\
    \ 当服务器和 Magento 已配置好后，您应将 Magento 设置为在 **Production Mode** 下运行。在生产模式下，静态视图文件从缓存提供，而不是通过\
    \ Magento 的回退机制。此外，错误会由 Magento 记录在 `var` 文件夹中，并且不会在商店前端显示给用户。您可以通过在 Magento 2\
    \ 命令行工具中运行以下命令来启用生产模式：\n\n    ```\n    php bin/magento deploy:mode:set production\n\
    \    ```\n\n    您将看到与以下截图类似的输出：\n\n    ![](img/de3034a92496a32462134266292a51dd_406_0.png)\n\
    \n## Search engine optimization\n\n除了反向链接等站外 SEO 因素外，站内 SEO 因素在您控制之下，您可以从 Magento\
    \ 管理面板优化 Magento 商店的 SEO。在本节中，我们将介绍 Magento 2 开箱即用的所有 SEO 设置。\n\nMagento 2 中的一个非常方便的功能是产品的元标签自动生成。您可以从以下管理面板部分设置该功能（**STORES\
    \ | Configuration | CATALOG | Catalog | Product Fields Auto-Generation**）：\n\n\
    ![](img/de3034a92496a32462134266292a51dd_407_0.png)\n\n从那里，您可以使用占位符和自定义文本为目录中的所有产品自动生成\
    \ SEO 元标签。\n\n需要明确的是，您无法为每个商店视图单独设置此功能，因为这些字段对您的 Magento 实例是全局的，并且自动生成配置的新更改不会应用于现有产品。\n\
    \n此外，您可以随时从产品设置中的搜索引擎优化中覆盖自动生成的值。\n\n在以下截图中，您还可以看到您可以为产品指定 SEO 友好的 **URL key**。您也可以从同一页面通过在\
    \ **Images and Videos** 部分的 **Image Detail** 窗口中更新 **ALT Text** 来为所有产品图片配置 **ALT\
    \ Text**：\n\n![](img/de3034a92496a32462134266292a51dd_408_0.png)\n\n如果您进入 **PRODUCTS\
    \ | Categories**，您也可以为每个类别设置 URL 键、Meta Title、Meta Keywords 和 Meta Description：\n\
    \n![](img/de3034a92496a32462134266292a51dd_409_0.png)\n\n最后，SEO 的两个非常重要的方面是网站的\
    \ XML 网站地图和 Robots.txt 文件。您可以从 **STORES | Configuration | Catalog | XML Sitemap**\
    \ 部分为商店设置 XML 网站地图：\n\nRobots.txt 设置可在 STORES | Configuration | General | Design\
    \ | Search Engine Robots 部分找到：\n\n![](img/de3034a92496a32462134266292a51dd_411_0.png)\n\
    \n在此页面中，您可以设置：\n\n- **Default robots**：选择默认的 robots 规则：\n    - INDEX, FOLLOW\n\
    \    - NOINDEX, FOLLOW\n    - INDEX, NOFOLLOW\n    - NOINDEX, NOFOLLOW\n- **Edit\
    \ the custom instruction of robots.txt file**：如有需要，输入 Robots.txt 文件的自定义指令\n- **Reset\
    \ to Defaults**：删除自定义指令并将 Robots.txt 配置重置为默认值\n\n## Cache and Index Management\n\
    \n管理 Magento 商店时需要考虑的两个方面是缓存和索引。\n\n每次您对商店前端进行更改，例如添加新横幅或更改标题，如果启用了缓存，您必须清除它，以便客户能够在商店前端看到更新。\n\
    \n同样，每次您对目录进行更改时，都必须重新索引它，以便客户可以看到更新的信息。\n\n如果您在 Magento 管理面板中打开 **SYSTEM** 选项卡，您会看到两个部分都位于\
    \ **Tools** 子菜单下：\n\n![](img/de3034a92496a32462134266292a51dd_412_0.png)\n\n现在，如果您进入\
    \ SYSTEM | Tools | Index Management，您将在屏幕上看到以下网格：\n\n![](img/de3034a92496a32462134266292a51dd_414_0.png)\n\
    \n索引器有两种模式：\n\n- **Update on Save**：当通过管理面板对目录进行更改时，索引数据会更新\n- **Update on Schedule**：重新索引过程由\
    \ cron 作业根据其配置执行\n\n## Upgrading Magento to a new version\n\n在本节中，我们将回顾如何将 Magento\
    \ 2 升级到最新版本。作为示例，我们将把本书中一直在审查的网站从 Magento 2.1.3 升级到 2.1.4。\n\n在进行升级之前，您可以在页脚中看到我们使用的\
    \ Magento 版本是之前提到的那个：\n\n![](img/de3034a92496a32462134266292a51dd_415_0.png)\n\
    \n要运行系统升级，您应进入管理面板中的以下部分：\n\n**SYSTEM | Tools | Web Setup Wizard**\n\n以下页面将显示在屏幕上：\n\
    \n"
