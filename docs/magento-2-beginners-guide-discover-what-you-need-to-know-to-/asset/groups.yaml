    # Handling newsletters and their subscribers


    You can see a list of e-mail subscribers for your Magento store in the MARKETING
    | Communications | Newsletter Subscribers page in the admin panel.


    As you can see in the following screenshot, the grid is empty when you first install
    Magento 2:


    ![](img/de3034a92496a32462134266292a51dd_355_0.png)


    If we go to the Storefront, we will find the Subscribe box in the footer:'
  - '[PAGE 356]


    # Transactional E-mails and Newsletter


    If you click on Subscribe, the following confirmation message will be displayed
    on screen:'
  - '[PAGE 357]


    Now, if we go back to the Newsletter Subscribers page, we will see the new subscriber
    in the grid:


    ![](img/de3034a92496a32462134266292a51dd_357_0.png)


    From that grid, you can unsubscribe or delete e-mail accounts using grid mass
    actions; you can export all the subscribers, filter them, and sort subscribers
    by column.


    Now, if you go back to the Newsletter Templates page (MARKETING | Communications
    | Newsletter Templates), you will be able to add the newsletter template to the
    queue by using the dropdown in the last column:'
  - '[PAGE 358]


    # Transactional E-mails and Newsletter


    ![](img/de3034a92496a32462134266292a51dd_358_0.png)


    You will be redirected to the **Edit Queue** page from which you can set the **Queue
    Date Start** to specify when the newsletter e-mail should be sent and edit the
    newsletter details:


    ![](img/de3034a92496a32462134266292a51dd_358_1.png)'
  - '[PAGE 359]


    After saving the template to include it in the queue, you will find that the template
    is pending, waiting to be sent to the **Newsletter Queue** page (**MARKETING |
    Communications | Newsletter Queue**):


    ![](img/de3034a92496a32462134266292a51dd_359_0.png)


    If you click on that row, you will be redirected to the same page as before, where
    you can set the **Queue Date Start** to specify when the newsletter should be
    sent and to modify the newsletter information.


    # Summary


    In this chapter, we covered the process of modifying transactional e-mails and
    newsletters, and we scheduled a newsletter template to be sent to newsletter subscribers.
    In the next chapter, we will create reports to track store sales, customer activity,
    and statistics related to the store catalog.'
