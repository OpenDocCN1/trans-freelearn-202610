    # Catalog and Shopping Cart Price Rules


    Magento allows you to set up promotions for your catalog. You can manage those
    promotions from the MARKETING | Promotions | Catalog Price Rule admin page:


    ![](img/de3034a92496a32462134266292a51dd_273_0.png)


    As you can see in the preceding screenshot, the Magento 2 sample data includes
    one catalog promotion– 20% off all Women''s and Men''s Pants


    You can add a new rule by clicking on Add New Rule in the top-right corner of
    the page.'
  - '[PAGE 274]


    The **New Catalog Price Rule** will be visible on the screen when the page loads:


    ![](img/de3034a92496a32462134266292a51dd_274_0.png)


    Here, you can specify the following information:


    +   - **Rule Information:**

    +     - **Rule Name:** A name to help you remember the details of this catalog
    price rule.

    +     - **Description:** A description for the catalog price rule. This is an
    internal field for the administrator and won''t be displayed on the Storefront.

    +     - **Status:** Set whether the catalog price rule is active or not.

    +     - **Websites:** Specify the websites for the catalog price rule.

    +     - **Customer Groups:** Set specific customer groups for the catalog price
    rule.

    +     - **From (Select Date) – To (Select Date):** Set a specific date range for
    the catalog price rule.

    +     - **Priority:** The matching catalog price rules will be applied in the
    order that is set in this field, the lower priority being the first to be applied.'
  - '[PAGE 275]


    +   - **Conditions:** Set conditions to apply the catalog price rule to specific
    products. If there are no conditions, then the catalog price rule will be applied
    to all products. You can set the conditions based on the product attributes:


    ![](img/de3034a92496a32462134266292a51dd_275_0.png)


    You can also set the catalog price rule to be valid if all the selected conditions
    are True or False:


    ![](img/de3034a92496a32462134266292a51dd_275_1.png)'
  - '[PAGE 276]


    When you click on the green plus icon and select a product attribute, a new field
    and new icons will be visible, and you can choose the specific filter for the
    attribute:


    ![](img/de3034a92496a32462134266292a51dd_276_0.png)


    The preceding filter is for the SKU attribute; different filters apply for the
    attributes. For example, here is the filter dropdown for the color attribute:


    ![](img/de3034a92496a32462134266292a51dd_276_1.png)'
  - '[PAGE 277]


    Finally, a blue window icon is available for some of the attributes. For example,
    if you select the **SKU** attribute and click on the blue window button, you will
    see a product grid to filter and choose products through that interface:


    ![](img/de3034a92496a32462134266292a51dd_277_0.png)


    If you select the **Category** attribute and click on the blue window icon, you
    will be able to select categories through the category grid:'
  - '[PAGE 278]


    # Catalog and Shopping Cart Price Rules


    ![](img/de3034a92496a32462134266292a51dd_278_0.png)


    +   - **Actions:**

    +     - **Apply:** This will be the action that will be applied to all matching
    products, based on the rule information and conditions that form the previous
    fields. The available actions are:

    +       - **Apply as percentage of original:** The discount is calculated as a
    percentage of the product price. If the product price is $200 and the discount
    is 10%, then the final price with discount will be $190.

    +       - **Apply as fixed amount:** The discount will be a fixed amount. If the
    product price is $200 and the discount is 10%, then the final price with discount
    will be $190.'
  - '[PAGE 279]


    +   - **Adjust final price to this percentage:** The final price for the product
    will be the percentage of the product price (direct percentage calculation from
    the product price). If the product price is $200 and the discount is 10%, then
    the final price with discount will be $20.

    +   - **Adjust final price to discount value:** The final price for the product
    will be the amount that you set as a discount. The original price doesn''t matter;
    the price will always be the amount specified as the discount. If the product
    price is $200 and the discount is 10%, then the final price with discount will
    be $10.

    +   - **Discount Amount:** Set the discount amount that will be applied in the
    way that you selected in the previous dropdown.

    +   - **Discard subsequent rules:** If additional rules meet the same conditions,
    then you can discard those rules to prevent multiple discounts from being applied
    to the same purchase.


    # # Shopping cart price rules


    Magento allows you to create specific promotions that can be applied to the shopping
    cart. For example, customers love using coupon codes in online stores, and some
    of them even search for a coupon code for every online purchase that they make.
    You can manage those promotions from the **MARKETING | Promotions | Cart Price
    Rules** section in the admin panel. You will be redirected to the following grid:'
  - '[PAGE 280]


    ![](img/de3034a92496a32462134266292a51dd_280_0.png)


    By default, the Magento 2 sample data includes four cart price rules:


    +   - $4 Luma water bottle (save 70%)

    +   - Buy 3 tee shirts and get the 4th free

    +   - Spend $50 or more – shipping is free!

    +   - 20% OFF Ever $200-plus purchase!*'
  - '[PAGE 281]


    # Catalog and Shopping Cart Price Rules


    If you click on the first row in the grid, you will be redirected to the form
    to edit that specific cart price rule:


    ![](img/de3034a92496a32462134266292a51dd_281_0.png)


    If we collapse the first section, we will see that there are several sections
    to set up the cart price rules:'
  - '[PAGE 282]


    ![](img/de3034a92496a32462134266292a51dd_282_0.png)


    We will describe the fields from each of those sections:


    +   - **Rule Information:**

    +     - **Rule Name:** A name to help you remember the details of the cart price
    rule.

    +     - **Description:** A description for the cart price rule. This is an internal
    field for the administrator and won''t be displayed on the Storefront.

    +     - **Active:** Set whether the cart price rule is active or not.

    +     - **Websites:** Specify the websites for the cart price rule.

    +     - **Customer Groups:** Set specific customer groups for the cart price rule.

    +     - **Coupon:** Specify whether a coupon is required for this promotion to
    be applied.

    +     - **Coupon Code:** If you specify that a coupon is required for the promotion,
    then you can set the coupon code in this field.

    +     - **Use Auto Generation:** By using this checkbox, you can autogenerate
    the coupon codes from the last section of this form.

    +     - **Uses per Coupon:** Set a limit for the number of uses of the coupon.'
  - '[PAGE 283]


    +   - **Uses per Customer**: Set a limited number of times that the coupon can
    be used by the same customer (only for logged in customers).

    +   - **From (Select Date) – To (Select Date)**: Set a specific date range for
    the cart price rule.

    +   - **Priority**: The matching cart price rules will be applied in the order
    that is set in this field, the lower priority being the first to be applied.

    +   - **Public In RSS Feed**: Set whether the cart price rule should be public
    in the Magento RSS Feed.


    +   - **Conditions**: Set conditions that should match for the cart price rule
    to be applied. If there are no conditions, then the cart price rule will always
    be applied if the properties defined in the **Rule Information** section are met.


    We can find the following conditions to apply:


    ![](img/de3034a92496a32462134266292a51dd_283_0.png)'
  - '[PAGE 284]


