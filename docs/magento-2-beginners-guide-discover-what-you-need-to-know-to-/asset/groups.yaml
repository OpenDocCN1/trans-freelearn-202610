    - **Inline editing**：后台面板的网格支持内联编辑，以便更有效地管理数据。\n- **Step-by-step product creation**：产品添加/编辑页面是后台面板中最重要的页面之一。Magento\
    \ 团队在添加/编辑产品方面的体验上付出了大量努力，结果是您可以通过分步页面管理产品，该页面将字段和导入工具分在不同的部分。\n\n## 前端变更\n\n\
    - **Integrated video in product page:** Magento 2 允许您为产品添加视频，引入了一种在目录中展示产品的新方式。\n\
