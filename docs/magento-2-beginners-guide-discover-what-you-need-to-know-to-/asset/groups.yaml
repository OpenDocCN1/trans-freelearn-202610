  mdcn: "\n\n## 配置 UPS 配送\n\n如果你在“商店 | 配置”页面中转到“销售 | 配送方式 | UPS”部分，将看到以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_312_0.png)\n\
    \n我们将逐一介绍此表单中的各个字段：\n\n- **常规配置：**\n  - **启用结账**：指定 UPS 是否应作为店面的一种配送方式提供。\n  -\
    \ **UPS 类型**：你可以选择 **United Parcel Service** 或 **United Parcel Service XML**。使用\
    \ **United Parcel Service**，你可以获取实时运费；使用 **United Parcel Service XML**，你可以获取实时费率并打印\
    \ UPS 标签。\n- **取决于 UPS 类型的 UPS 特定配置**：以下字段取决于你在上一个字段中所选的 **UPS 类型**。如果你选择 **United\
    \ Parcel Service** 作为 **UPS 类型**，将显示以下字段：\n\n  - **正式账户**：选择 **是** 可在线启用 UPS（生产环境）。如果你选择\
    \ **否**，则会在测试模式下将 UPS 启用为配送方式。\n  - **网关 URL**：Magento 中已包含默认网关 URL。如果需要更改网关 URL，可以在此字段中进行更改。\n\
    \  - **标题：** 配送方式的描述性标题。\n  - **包裹请求类型：** 你可以选择 **按等重拆分（一个请求）** 或 **使用原重量（少量请求）**。\n\
    \n如果你选择 **United Parcel Service XML** 作为 UPS 类型，将显示以下字段：\n\n- **正式账户：** 选择 **是**\
    \ 可在线启用 UPS（生产环境）。如果你选择 **否**，则会在测试模式下将 UPS 启用为配送方式。\n- **访问许可证号：** 你的 UPS 访问密钥。\n\
    - **网关 XML URL：** Magento 中已包含默认网关 XML URL。如果需要更改网关 XML URL，可以在此字段中进行更改。\n- **模式：**\
    \ 如该字段的注释所示，此设置可启用或禁用 UPS 对 Magento 服务器的 SSL 验证。\n- **用户 ID：** 你的 UPS 用户 ID。\n\
    - **发货地：** 从下拉列表中选择一个选项以指定货件的发货地。\n- **密码：** 你的 UPS 账户密码。\n- **标题：** 配送方式的描述性标题。\n\
    - **启用协商费率：** 启用与 UPS 的协商运费费率。\n- **包裹请求类型：** 你可以选择 **按等重拆分（一个请求）** 或 **使用原重量（多个请求）**。\n\
    - **发货人编号：** 这是一个由六个字符组成的 UPS 代码，是协商费率所必需的。\n- **跟踪 XML URL：** Magento 中已包含默认跟踪\
    \ XML URL。如果需要更改跟踪 XML URL，可以在此字段中进行更改。\n\n**其他配置：** 以下字段适用于 **United Parcel Service**\
    \ 和 **United Parcel Service XML UPS** 两种类型：\n\n- **容器：** 设置货件的容器。\n- **重量单位：**\
    \ 设置配送方式的重量单位。\n- **目的地类型：** 选择目的地类型是住宅还是商业。\n- **最大包裹重量：** 设置承运人中的最大包裹重量数值。\n\
    - **取件方式：** 将取件方式设置为以下任一方法：\n  - **常规每日取件**\n  - **按需空运**\n  - 一次性取件\n  - 信件中心\n\
    \  - 客户柜台\n- **最小包裹重量：** 设置承运人中的最小包裹重量数值。\n- **计算处理费：** 设置处理费是基于上一个字段中定义的价格的固定金额还是百分比。\n\
    - **处理费：** 这将是一个固定金额或百分比，用于计算处理费。\n- **允许的配送方式：** 选择将在店面可供选择的 UPS 配送方式。\n- **免费配送方式：**\
    \ 选择应可作为免费配送方式供选择的 UPS 配送方式。\n- **免费配送金额阈值：** 当订单总金额高于此数字时，上一个字段中选择的 UPS 配送方式将可作为免费配送方式供选择。\n\
    - **显示的错误消息：** 当配送方式不可用时显示的错误消息。\n- **配送至适用国家：** 指定配送方式应对所有国家可用，还是仅对特定国家可用。如果你选择特定国家，将启用\
    \ **配送至特定国家** 下拉列表，以选择可为此配送方式提供的国家。\n- **不适用时显示配送方式：** 指定当配送方式不可用时，是否应在店面显示该配送方式。\n\
    - **调试：** 启用调试模式，以在开发过程中记录有用的调试信息。\n- **排序顺序：** 设置顺序以确定 **UPS** 在店面可用配送方式列表中的位置。数字越低，在列表中显示的位置越高。\n\
    \n设置好配送方式后，客户将能够从 UPS 获取费率，并为其订单选择配送方式。\n\n在那里，你会看到可以按 Magento 版本（edition）、版本号、扩展评分、价格和扩展开发者类型进行筛选：\n\
    \n![](img/de3034a92496a32462134266292a51dd_316_0.png)\n\n### 总结\n\n在本章中，我们回顾了\
    \ Magento 默认包含的配送方式。在下一章中，我们将回顾订单履行的过程，包括 Magento 中订单生命周期的概述。\n\n## 17 订单履行\n\n\
    在本章中，我们将介绍以下概念：\n\n- 订单管理\n- 状态（State）和状态（Status）\n- 发票、发货和退款单\n\n### 订单管理\n\n\
    Magento 提供了一种强大而简单的方式来管理你的商店中生成的订单。如果客户通过电话订购并想购买商店中的产品，你甚至可以从管理后台创建订单。\n\n你可以在管理后台的“销售\
    \ | 订单”页面查看和管理订单：\n\n![](img/de3034a92496a32462134266292a51dd_318_0.png)\n\n此页面一个非常重要的方面是，你可以选择非常有用的批量操作来管理订单：\n\
    \n![](img/de3034a92496a32462134266292a51dd_318_1.png)\n\n如你所见，你可以同时挂起多个订单、打印多个订单的发票等等。除此之外，订单网格还允许你继续使用\
    \ Magento 2 管理后台网格的所有工具，例如以下功能：\n\n- 筛选器\n- 可选择的列\n- 导出为 CSV 和 XML\n- 按关键字搜索\n\
    \n如果你单击网格中的任意订单，将跳转到订单页面：\n\n![](img/de3034a92496a32462134266292a51dd_319_0.png)\n\
    \n你首先会注意到，在屏幕右上角有几个针对此订单的操作：\n\n![](img/de3034a92496a32462134266292a51dd_320_0.png)\n\
    \n你可以单击这些按钮快速执行操作——从向客户发送订单邮件，到挂起订单、创建发票，甚至编辑订单。\n\n- **信息**选项卡\n\n让我们逐一查看**信息**选项卡中的各个部分：\n\
    \n| 订单与账户信息 |  |\n|---|---|\n| **订单 # 000000003 （订单确认邮件已发送）** | **账户信息** |\n|\
    \ 订单日期 | 2016年12月26日 上午9:07:43 |\n| 订单状态 | 待处理 |\n| 购买自 | 主网站<br>主网站商店<br>默认商店视图\
    \ |\n| 下单 IP | 127.0.0.1 |\n| 客户名称 | Gabriel Guarino |\n| 电子邮件 | guarinogabriel@gmail.com\
    \ |\n| 客户组 | 一般 |\n\n在这里，你可以看到订单的基本信息。了解该订单对应的商店（对于多商店 Magento 网站而言）、客户名称、电子邮件甚至\
    \ IP 地址非常重要，以防订单可疑。\n\n接下来的两个部分是**地址信息**和**付款与配送方式**：\n\n![](img/de3034a92496a32462134266292a51dd_321_0.png)\n\
    \n如你在第一部分中所见，如果客户在下单时出现任何拼写错误或失误，你可以编辑客户地址（包括配送地址和账单地址）。\n\n"
