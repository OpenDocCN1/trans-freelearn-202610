    +   - **Ship to Applicable Countries:** Specify whether the shipping method should
    be available for all countries or only specific countries. If you choose specific
    countries, the **Ship to Specific Countries** dropdown will be enabled to select
    the countries that will be available for this shipping method.

    +   - **Sort Order:** Set the order to determine the position of **Free Shipping**
    in the list of available shipping methods on the Storefront. The lower the number,
