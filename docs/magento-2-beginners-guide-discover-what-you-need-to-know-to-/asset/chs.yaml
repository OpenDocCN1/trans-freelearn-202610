  \n  ![](img/de3034a92496a32462134266292a51dd_374_0.png)\n\n  演示通知也将在管理面板中显示：\n\n\
  \  ![](img/de3034a92496a32462134266292a51dd_375_0.png)\n\n- **Header:**\n  - **Logo\
  \ image:** 设置页眉的 Logo 图像。允许的文件类型为：\n    - PNG\n    - GIF\n    - JPG\n    - JPEG\n\
  \    - SVG\n  - **Logo image width:** 以像素为单位设置 Logo 图像宽度。\n  - **Logo image height:**\
  \ 以像素为单位设置 Logo 图像高度。\n  - **Welcome text:** 设置要在页眉中显示的文本。欢迎文本的实际外观和位置取决于主题。以下是\
  \ Luma 主题中欢迎文本的显示方式（页面顶部 **Sign In** 旁边的 **This is the welcome text message!**）：\n\
  \n    ![](img/de3034a92496a32462134266292a51dd_376_0.png)\n\n  - **Logo image alt**:\
  \ 用于 Logo 图像的 alt 标签文本。\n- **Footer:**\n  - **Miscellaneous HTML**: 您在此复选框中添加的 HTML\
  \ 将在所有页面的 body 标签关闭前显示\n  - **Copyright**: 在页脚中显示的版权文本\n- **Pagination:**\n  - **Pagination\
  \ frame:** 在 Storefront 的分页控件上显示的链接数量。在以下示例中，分页框架已设置为 4：\n\n    ![](img/de3034a92496a32462134266292a51dd_377_0.png)\n\
  \n  - **Pagination Frame Skip**: 设置在显示下一组分页链接之前跳过的链接数量。在以下示例中，分页框架跳过已设置为 2：\n\n\
  \    ![](img/de3034a92496a32462134266292a51dd_378_0.png)\n\n  - **Anchor text for\
  \ previous/anchor text for next**: 如果您为上一个和下一个链接设置锚文本，则箭头图像将被您设置的锚文本替换。在以下示例中，上一个的锚文本已设置为\
  \ **Previous**，下一个的锚文本已设置为 **Next**：\n\n    ![](img/de3034a92496a32462134266292a51dd_379_0.png)\n\
  \n- **Product image watermarks**: 在此部分，您可以上传基础图像、小图像、缩略图和色板图像的水印图像，并可以设置图像不透明度、大小和位置等属性。\n\
  - **Transactional Emails:**\n  - **Logo image:** 上传要在交易电子邮件中用作 Logo 的图像。允许的文件类型为：\n\
  \    - JPG\n    - JPEG\n    - GIF\n    - PNG\n  - **Logo image alt:** 用于 Logo 图像的替代文本。\n\
  \  - **Logo width:** 设置 Logo 图像的宽度。像素数应输入且末尾不附加 px。\n  - **Logo height:** 设置 Logo\
  \ 图像的高度。像素数应输入且末尾不附加 px。\n  - **Header template/footer template:** 选择要在交易电子邮件中用作页眉和页脚的模板。\n\
  \n### 内联翻译的工作原理\n\n在 Magento 中翻译 Storefront 的正确方法是使用 Magento 代码库中的翻译词典（`.csv` 文件）和语言包。\n\
  \n话虽如此，Magento 也为商店管理员提供了一种快速更新和翻译 Storefront 文本的方法：内联翻译。\n\n内联翻译存储在数据库中并且是主题特定的，这意味着如果在完成内联翻译后为\
  \ Magento 商店选择了另一个主题，则内联翻译将不适用。因此，如果更改了主题，商店管理员应再次进行内联翻译。\n\n要启用内联翻译工具，您应转到管理面板中的\
  \ **Stores | Configuration** 页面。\n\n到达后，您应进入 Advanced | Developer 部分，您将看到用于在 Storefront\
  \ 和管理面板上启用内联翻译的下拉菜单：\n\n![](img/de3034a92496a32462134266292a51dd_381_0.png)\n\n\
  如果您将 Enable for Storefront 设置为 Yes 并保存新设置，则内联翻译工具将在 Storefront 上启用。如果已启用缓存，则在查看\
  \ Storefront 之前应清除缓存。\n\n如以下屏幕所示，内联翻译工具现已启用，每个可翻译的字符串都用红色框标记：\n\n![](img/de3034a92496a32462134266292a51dd_382_0.png)\n\
  \n如果将鼠标悬停在红色框上，您将看到与前一屏幕截图中可见的相同书籍图标。如果单击该图标，将显示以下窗口：\n\n![](img/de3034a92496a32462134266292a51dd_382_1.png)\n\
  \n从那里，您可以指定翻译是否特定于当前商店视图，然后设置自定义文本。在下面的示例中，我们将 `Create an Account` 替换为 **Register**。\n\
  \n![](img/de3034a92496a32462134266292a51dd_383_0.png)\n\n现在，假设内联翻译工具已启用且无限制。这意味着任何有权访问网站的人都可以看到该工具，并且可以更改您的\
  \ Magento 商店中的文本。这很危险，应避免。\n\n为了防止这种情况，Magento 允许您仅将内联翻译工具限制为您自己的计算机。您可以通过在商店的 **Configuration**\
  \ 页面（**Stores | Configuration**）的 **ADVANCED | Developer | Allowed IPs (comma-separated)**\
  \ 部分指定您的 IP 地址来做到这一点：\n\n![](img/de3034a92496a32462134266292a51dd_384_0.png)\n\n\
  您可以将多个 IP 添加到允许的 IP 列表中，只有这些 IP 才可以访问 **ADVANCED | Developer** 工具。\n\n### Magento\
  \ Marketplace\n\n选择 Magento 作为平台的优势之一是市场中可用的扩展数量，可为您的 Magento 商店添加新功能。\n\n\n\n\n\
  您可以在 Magento Marketplace 中查看可用的扩展列表，访问 https://marketplace.magento.com：\n\n![](img/de3034a92496a32462134266292a51dd_385_0.png)\n\
  \n当您选择某个扩展时，您将在扩展列表页面看到所需的全部信息，包括：\n\n- 扩展的可用版本\n- 供应商提供的可用支持\n- 安装服务\n- 价格\n- 描述\n\
  - 当前版本\n- 更新日期\n- 分类\n- 兼容的 Magento 2 版本\n- 评论\n- 发布说明\n- 支持\n\n![](img/de3034a92496a32462134266292a51dd_386_0.png)\n\
  \n我建议您将 Magento Marketplace 视为一个可以为您的商店找到三种不同类型定制方案的地方：\n\n- **扩展：** https://marketplace.magento.com/extensions\n\
  - **主题：** https://marketplace.magento.com/themes.html\n- **语言包：** https://marketplace.magento.com/extensions/content-customizations/translations-localization.html\n\
  \n除此之外，Marketplace 非常直观，提供了一种非常简单的方法来查找您需要的扩展并查看这些扩展的所有信息，包括供应商信息。\n\n这些扩展可以由供应商安装，也可以由经验丰富的\
  \ Magento 开发人员安装，他们会审查扩展代码，以便将扩展集成到您的 Magento 商店中。\n\n### 本章小结\n\n在本章中，我们回顾了管理 Magento\
  \ 主题、使用内联翻译工具翻译字符串，以及使用 Magento Marketplace 下载主题、扩展和语言包的过程。\n\n在下一章中，我们将回顾如何备份、恢复和管理您的\
  \ Magento 数据库，如何提高 Magento 实例的性能，如何优化网站的 SEO，如何管理缓存和索引，以及如何将 Magento 升级到最新版本。\n"
- "# 21 商店维护\n\n## 商店维护\n\n在本章中，我们将涵盖以下主题：\n\n- 备份、恢复和数据库管理\n- 性能调优\n- 搜索引擎优化\n- 缓存和索引管理\n\
  - 将 Magento 升级到新版本\n\n## 备份、恢复和数据库管理\n\n创建备份至关重要，因为这能确保在发生意外情况时，我们可以恢复 Magento 商店。Magento\
  \ 允许我们通过管理后台和 Magento 2 命令行工具创建代码库和数据库备份。\n\n若要从管理后台创建备份，您应进入以下部分：\n系统 | 工具 | 备份\n\
  \n![](img/de3034a92496a32462134266292a51dd_389_0.png)\n\n在该部分中，您将看到已创建的所有备份列表。此外，您还可以创建三种类型的备份：\n\
  \n- **系统备份**：创建代码库和数据库备份，并可以选择包含或排除媒体文件夹\n- **数据库和媒体备份**：创建数据库和媒体文件夹备份\n- **数据库备份**：创建数据库备份\n\
  \n对于所有这些备份类型，您都可以将 Magento 商店置于维护模式，因为备份过程会占用大量服务器资源。\n\n如果您单击**系统备份**，将显示以下窗口：\n\
  \n![](img/de3034a92496a32462134266292a51dd_390_0.png)\n\n当您继续执行备份时，系统会显示一个旋转加载器图像，并由系统创建备份。由于此备份包含代码库和数据库，因此该过程需要一些时间才能完成。\n\
  \n备份创建完成后，您将在屏幕上看到一条确认消息，并且备份将列在网格中：\n\n![](img/de3034a92496a32462134266292a51dd_391_0.png)\n\
  \n此外，备份文件将位于代码库中的 var/backups 文件夹中。\n\n正如您在网格中所见，您可以下载 .tgz 格式的备份，或使用最后一列中的“回滚”操作进行恢复。\n\
  \n**数据库和媒体备份**与**数据库备份**的过程相同。现在，我们确实应考虑自动化此过程，以便始终为我们的 Magento 商店保留备份。\n\nMagento\
  \ 允许您安排系统定期自动创建备份。为此，您应进入商店配置页面（**商店 | 配置**），并单击**高级 | 系统**。\n\n在此页面上，您将看到**计划备份设置**部分：\n\
  \n![](img/de3034a92496a32462134266292a51dd_392_0.png)\n\n如果在“启用计划备份”字段中选择“是”，将显示以下表单：\n\
  \n![](img/de3034a92496a32462134266292a51dd_393_0.png)\n\n在那里，您可以选择计划备份的备份类型、开始时间和频率，还可以定义在备份期间是否将网站置于维护模式。建议将备份安排在每天夜间商店流量较少时进行，例如每天凌晨\
  \ 2 点。\n\n除管理后台备份外，您还可以使用 Magento 2 命令行工具创建备份。\n\n为此，您应打开终端，并将当前目录更改为 Magento 2\
  \ 实例的文档根目录。\n\n如果您运行 php bin/magento，您将看到用于创建备份的 setup:backup 命令，该命令会备份 Magento\
  \ 应用程序的代码库、媒体和数据库。\n\n此外，setup:rollback 命令可用于恢复备份，该命令会回滚 Magento 应用程序的代码库、媒体和数据库。\n\
  \n要创建备份，您应将要创建的备份类型作为参数传递。可用的参数有：\n\n- `--code`\n- `--media`\n- `--db`\n\n从每个参数的名称可以看出，您可以指定备份中是否包含代码库、媒体和数据库。\n\
  \n例如，要创建代码库和数据库备份，您应运行以下命令：\n\n```\nphp bin/magento setup:backup --code --db\n```\n\
  \n如下面的截图所示，您可以从命令行输出中跟踪进度：\n\n![](img/de3034a92496a32462134266292a51dd_394_0.png)\n\
  \n您可以通过运行 `magento info:backups:list` 命令查看可用备份列表：\n\n![](img/de3034a92496a32462134266292a51dd_395_0.png)\n\
  \n这一点至关重要，因为 `setup:rollback` 命令要求您指定要恢复的每个参数对应的文件名：\n\n```\nmagento setup:rollback\
  \ [-c|--code-file=\"<name>\"] [-m|--media-file=\"<name>\"]\n[-d|--db-file=\"<name>\"\
  ]\n```\n\n## 性能调优\n\n对于 Magento 商店的转化率而言，性能是获得高转化率的关键。没有人喜欢等待页面加载，而您希望客户在决定购买哪些商品后尽快下单。\n\
  \n在本节中，我们将回顾如何优化 Magento 以获得尽可能快的性能，包括 Magento 配置、服务器优化等。\n\n为了比较平台旧版本与新版本的性能，我们将在本书中收录\
  \ Magento 提供的性能统计信息。请注意，这些统计信息是基于 Magento Enterprise Edition 2.0 生成的，但它们是不错的参考数据：\n\
  \n- **每小时订单数：** Magento Enterprise Edition 2.0 每小时可处理 597 个订单，与 Magento Enterprise\
  \ Edition 1.14.2 相比，每小时增加了 130 个订单：\n\n  ![](img/de3034a92496a32462134266292a51dd_396_0.png)\n\
  \n- **目录浏览：** 使用 Varnish 时，Magento Enterprise Edition 2.0 中目录浏览的响应时间几乎是即时的：\n\n\
  \  ![](img/de3034a92496a32462134266292a51dd_397_0.png)\n\n- **加入购物车：** 与 Magento\
  \ Enterprise Edition 1.14.2 相比，Magento Enterprise Edition 2 中的“加入购物车”操作快 66%：\n\n\
  \  ![](img/de3034a92496a32462134266292a51dd_398_0.png)\n\n\n\n\n\n- **结账流程：** 结账流程（所有步骤合计）在\
  \ Magento Enterprise Edition 2 中，访客结账比 Magento Enterprise Edition 1.14.2 快 48%，客户结账快\
  \ 36%：\n\n    ![](img/de3034a92496a32462134266292a51dd_399_0.png)\n\n现在让我们看看如何提高\
  \ Magento 商店的性能：\n\n- **服务器配置：** 尽管 Magento 2 与 PHP 5.6 兼容，但建议使用 PHP 7 搭配 Varnish\
  \ 以获得最佳性能效果。\n- **Magento 配置 - Varnish：** 我们之前提到过 Varnish；要启用它，您应先部署并配置 Varnish。之后，您可以从管理面板的商店配置页面（**STORES\
  \ | Configuration**）中启用它并打开 **ADVANCED | System** 页面。从那里，您可以选择 Varnish 作为缓存应用程序并设置配置：\n\
  \n    ![](img/de3034a92496a32462134266292a51dd_400_0.png)\n\n- **Magento 配置 - Redis：**\
  \ Redis 可用于替代 `Zend_Cache_Backend_File` 作为后端缓存，也可用于 PHP 会话存储。\n- **Magento 配置 -\
  \ 开发人员设置：** 建议使用以下开发人员设置来提高 Magento 商店的性能；您可以从 **STORES | Configuration | ADVANCED\
  \ | Developer** 设置这些配置。在该页面中您将看到以下部分：\n\n    ![](img/de3034a92496a32462134266292a51dd_401_0.png)\n\
  \n    设置以下配置：\n\n    - **Grid Settings | Asynchronous indexing：** Enable\n    -\
  \ **CSS Settings | Minify CSS Files：** Yes\n    - **JavaScript Settings | Minify\
  \ JS Files：** Yes\n    - **JavaScript Settings | Merge JavaScript Files：** No\n\
  \    - **Template Settings | Minify HTML：** Yes\n    - **JavaScript Settings | Enable\
  \ JavaScript Bundling：** Yes\n\n### Store Maintenance\n\n- **Magento 配置：邮件：** 您可以在\
  \ **STORES | Configuration | Sales | Sales Emails** 部分将邮件设置为异步生成。如以下截图所示，您可以标记 **Asynchronous**\
  \ 发送为已启用：\n\n    ![](img/de3034a92496a32462134266292a51dd_403_0.png)\n\n- **Magento\
  \ 配置 - 平面目录：** 我们在第 10 章 *System Configuration* 中描述了类别和产品的平面目录功能。正如我们在该章中所提到的，此设置通过将所有类别和产品信息合并到一个平面表中以单次查询获取数据，从而提高商店性能。您可以在\
  \ **CATALOG | Catalog** 商店配置页面启用平面目录；这些设置在 Storefront 下为 **Use Flat Catalog Category**\
  \ 和 **Use Flat Catalog Product**，如以下截图所示：\n\n    ![](img/de3034a92496a32462134266292a51dd_404_0.png)\n\
  \n- **Magento 配置 - 索引：** 而不是在通过管理面板对目录进行更改时立即更新索引，您可以设置重新索引过程根据 cron 作业配置按计划执行。您可以在\
  \ **SYSTEM | Index Management** 管理面板页面进行此更改。从那里，您将看到可以使用批量操作将索引设置为按计划更新：\n\n   \
  \ ![](img/de3034a92496a32462134266292a51dd_405_0.png)\n\n- **Magento 配置 - 生产模式：**\
  \ 当服务器和 Magento 已配置好后，您应将 Magento 设置为在 **Production Mode** 下运行。在生产模式下，静态视图文件从缓存提供，而不是通过\
  \ Magento 的回退机制。此外，错误会由 Magento 记录在 `var` 文件夹中，并且不会在商店前端显示给用户。您可以通过在 Magento 2 命令行工具中运行以下命令来启用生产模式：\n\
  \n    ```\n    php bin/magento deploy:mode:set production\n    ```\n\n    您将看到与以下截图类似的输出：\n\
  \n    ![](img/de3034a92496a32462134266292a51dd_406_0.png)\n\n### Search engine optimization\n\
  \n除了反向链接等站外 SEO 因素外，站内 SEO 因素在您控制之下，您可以从 Magento 管理面板优化 Magento 商店的 SEO。在本节中，我们将介绍\
  \ Magento 2 开箱即用的所有 SEO 设置。\n\nMagento 2 中的一个非常方便的功能是产品的元标签自动生成。您可以从以下管理面板部分设置该功能（**STORES\
  \ | Configuration | CATALOG | Catalog | Product Fields Auto-Generation**）：\n\n![](img/de3034a92496a32462134266292a51dd_407_0.png)\n\
  \n从那里，您可以使用占位符和自定义文本为目录中的所有产品自动生成 SEO 元标签。\n\n需要明确的是，您无法为每个商店视图单独设置此功能，因为这些字段对您的\
  \ Magento 实例是全局的，并且自动生成配置的新更改不会应用于现有产品。\n\n此外，您可以随时从产品设置中的搜索引擎优化中覆盖自动生成的值。\n\n在以下截图中，您还可以看到您可以为产品指定\
  \ SEO 友好的 **URL key**。您也可以从同一页面通过在 **Images and Videos** 部分的 **Image Detail** 窗口中更新\
  \ **ALT Text** 来为所有产品图片配置 **ALT Text**：\n\n![](img/de3034a92496a32462134266292a51dd_408_0.png)\n\
  \n如果您进入 **PRODUCTS | Categories**，您也可以为每个类别设置 URL 键、Meta Title、Meta Keywords 和 Meta\
  \ Description：\n\n![](img/de3034a92496a32462134266292a51dd_409_0.png)\n\n最后，SEO\
  \ 的两个非常重要的方面是网站的 XML 网站地图和 Robots.txt 文件。您可以从 **STORES | Configuration | Catalog\
  \ | XML Sitemap** 部分为商店设置 XML 网站地图：\n\nRobots.txt 设置可在 STORES | Configuration |\
  \ General | Design | Search Engine Robots 部分找到：\n\n![](img/de3034a92496a32462134266292a51dd_411_0.png)\n\
  \n在此页面中，您可以设置：\n\n- **Default robots**：选择默认的 robots 规则：\n    - INDEX, FOLLOW\n \
  \   - NOINDEX, FOLLOW\n    - INDEX, NOFOLLOW\n    - NOINDEX, NOFOLLOW\n- **Edit\
  \ the custom instruction of robots.txt file**：如有需要，输入 Robots.txt 文件的自定义指令\n- **Reset\
  \ to Defaults**：删除自定义指令并将 Robots.txt 配置重置为默认值\n\n### Cache and Index Management\n\
  \n管理 Magento 商店时需要考虑的两个方面是缓存和索引。\n\n每次您对商店前端进行更改，例如添加新横幅或更改标题，如果启用了缓存，您必须清除它，以便客户能够在商店前端看到更新。\n\
  \n同样，每次您对目录进行更改时，都必须重新索引它，以便客户可以看到更新的信息。\n\n如果您在 Magento 管理面板中打开 **SYSTEM** 选项卡，您会看到两个部分都位于\
  \ **Tools** 子菜单下：\n\n![](img/de3034a92496a32462134266292a51dd_412_0.png)\n\n现在，如果您进入\
  \ SYSTEM | Tools | Index Management，您将在屏幕上看到以下网格：\n\n![](img/de3034a92496a32462134266292a51dd_414_0.png)\n\
  \n索引器有两种模式：\n\n- **Update on Save**：当通过管理面板对目录进行更改时，索引数据会更新\n- **Update on Schedule**：重新索引过程由\
  \ cron 作业根据其配置执行\n\n### Upgrading Magento to a new version\n\n在本节中，我们将回顾如何将 Magento\
  \ 2 升级到最新版本。作为示例，我们将把本书中一直在审查的网站从 Magento 2.1.3 升级到 2.1.4。\n\n在进行升级之前，您可以在页脚中看到我们使用的\
  \ Magento 版本是之前提到的那个：\n\n![](img/de3034a92496a32462134266292a51dd_415_0.png)\n\n\
  要运行系统升级，您应进入管理面板中的以下部分：\n\n**SYSTEM | Tools | Web Setup Wizard**\n\n以下页面将显示在屏幕上：\n\
  \n\n使用我们在*第3章“迁移”*中为你的 Magento 商店生成的访问密钥，然后点击**提交**。\n\n之后，Magento 将检查是否有新版本可用：\n\
  \n![](img/de3034a92496a32462134266292a51dd_417_0.png)\n\n如果你的商店有可用的 Magento 新版本，你会看到它们列在下拉列表中，如下所示：\n\
  \n![](img/de3034a92496a32462134266292a51dd_417_1.png)\n\n选择要升级的 Magento 版本后，你可以点击**下一步**进入下一步，**就绪检查**：\n\
  \n![](img/de3034a92496a32462134266292a51dd_418_0.png)\n\n与我们在*第2章“安装”*中介绍的 Magento\
  \ 安装第一步类似，系统将检查你的 Magento 实例是否准备好继续执行向导。\n\n安装过程中的**就绪检查**与升级过程中的**就绪检查**之间的区别在于，升级需要配置\
  \ cron 作业。\n\n如果 cron 作业、PHP 版本、设置或扩展存在错误，那么你应该考虑检查 cron 的状态和配置。\n\n如果**就绪检查**成功，你应该看到所有项目都带有勾选标记：\n\
  \n![](img/de3034a92496a32462134266292a51dd_419_0.png)\n\n**就绪检查**完成后，你可以进入下一步，该步骤允许你创建代码库、媒体和数据库备份：\n\
  \n### 商店维护\n\n最后一步会通知你，网站将暂时离线，并且你的商店将启用维护模式：\n\n![](img/de3034a92496a32462134266292a51dd_421_0.png)\n\
  \n如果你点击**升级**，则过程将开始，你就可以从浏览器中跟踪其进度：\n\n![](img/de3034a92496a32462134266292a51dd_422_0.png)\n\
  \n升级完成后，你将在屏幕上看到以下页面：\n\n![](img/de3034a92496a32462134266292a51dd_422_1.png)\n\n\
  维护模式将被禁用，你的 Magento 商店将运行所选的 Magento 版本，正如你将在 Magento 管理面板页脚中看到的那样：\n\n![](img/de3034a92496a32462134266292a51dd_423_0.png)\n\
  \n### 总结\n\n在本章中，你学习了如何备份和恢复你的 Magento 商店、如何提高其性能、如何更新商店配置以进行 SEO、如何管理 Magento 缓存和索引，以及如何将你的网站升级到最新版本。\n\
  \n这是本书的结尾，但却是你管理 Magento 商店之旅的开始。我们已经涵盖了 Magento 商店所有者和管理员的所有活动，你现在拥有足够的知识来取得成功。请将本书放在手边，因为当你使用\
  \ Magento 平台时，它能帮助你快速查阅相关页面。祝你好运！\n"
