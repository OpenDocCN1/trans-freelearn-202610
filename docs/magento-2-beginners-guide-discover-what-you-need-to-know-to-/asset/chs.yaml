- "### 19 报告\n\n本章我们将介绍以下概念：\n\n- Marketing reports\n- Sales reports\n- Customer reports\n\
  - Product reports\n\n## Magento 报告\n\n作为商店所有者和管理员，您的一项关键活动是跟踪 Magento 商店的活动和转化率。Magento\
  \ 包含多个报告，您可以定期查看，以便始终能够查看商店的统计数据。\n\n所有报告都可以通过 Magento 管理面板中的同一菜单项访问：Reports\n\n\
  ![](img/de3034a92496a32462134266292a51dd_361_0.png)\n\n如前图所示，Magento 包含 22 个报告，分为\
  \ 5 个组，如下所示：\n\n- **Marketing:**\n    - Products in Carts\n    - Search Terms\n\
  \    - Abandoned Carts\n    - Newsletter Problem Reports\n- **Reviews:**\n    -\
  \ By Customers\n    - By Products\n- **Sales:**\n    - Orders\n    - Tax\n    -\
  \ Invoiced\n    - Shipping\n    - Refunds\n    - Coupons\n    - PayPal Settlement\n\
  \    - Braintree Settlement\n- **Customers:**\n    - Order Total\n    - Order Count\n\
  \    - New\n- **Products:**\n    - Views\n    - Bestsellers\n    - Low Stock\n \
  \   - Ordered\n    - Downloads\n\n除此之外，您将在列表末尾看到一个额外的菜单项：**Refresh Statistics.**\n\
  \n为了优化性能，Magento 会计算并存储每个报告的信息，而不是即时计算所有内容。为了在报告中看到最新信息，您应该从 Magento 管理面板的该页面刷新统计数据。\n\
  \n如以下图所示，有两个批量操作可供选择，以通过刷新生命周期统计数据或仅最近一天的数据来更新所选报告：\n\n![](img/de3034a92496a32462134266292a51dd_364_0.png)\n\
  \n如果选择 **Refresh Lifetime Statistics**，确认消息会说明更新可能会降低商店的性能：\n\n![](img/de3034a92496a32462134266292a51dd_365_0.png)\n\
  \n如果您确认更新，您的报告数据将是最新的，并且网格中的 **Updated** 日期将显示报告更新的时间：\n\n![](img/de3034a92496a32462134266292a51dd_366_0.png)\n\
  \n让我们回顾一下每个报告：\n\n- **Marketing | Products in Carts:** 营销组中的第一个报告是 **Products in\
  \ Carts** 报告。正如名称所示，您可以看到当前在商店前端的客户购物车中或管理面板中待处理订单中的产品。\n- **Marketing | Search\
  \ Terms:** 营销组中的第二个报告是 **Search Terms** 报告，您可以借此查看 Magento 商店中最受欢迎的搜索查询。\n- **Marketing\
  \ | Abandoned Carts:** 下一个报告允许您查看客户的弃购购物车，这对于再次联系这些客户以激励他们完成订单非常重要。\n- **Marketing\
  \ | Newsletter Problem Reports:** 如果新闻通讯投递出现错误，您将能够从此报告中查看和审查这些错误，所有错误详细信息都位于 `var/log`\
  \ 文件夹中的日志文件中。\n- **Reviews | By Customers / By Products:** 通过这些报告，您将能够更仔细地查看商店中评论的统计数据，按客户或按产品对这些评论的统计数据进行分组。\n\
  - **Sales | Orders / Tax / Invoiced / Shipping / Refunds / Coupons:** 查看与商店中订单、税率、发票、运输、贷项通知单和优惠券相关的所有统计数据。对于所有报告，都有一个筛选器可按时间段、日期范围和订单状态查看报告。\n\
  - **Sales | PayPal Settlements / Braintree Settlements:** 查看影响 PayPal 和 Braintree\
  \ 资金结算的每笔交易的信息。\n- **Customers | Orders Total:** 查看在给定时间段内每个客户订单的总金额，包括每个客户的订单平均金额。\n\
  - **Customers | Order Count:** 查看在给定时间段内每个客户的订单总数，包括每个客户的平均订单数。\n- **Customers |\
  \ New:** 特定时间段内间隔的新客户数量。\n- **Products | Views:** 查看在特定时间段内商店中每个产品的浏览次数。\n- **Products\
  \ | Bestsellers:** 查看给定时间段的畅销书列表。\n- **Products | Low Stock:** 查看当前库存量低的产品列表。\n\
  - **Products | Ordered:** 查看所选时间段内已订购产品的列表和售出数量。\n- **Products | Downloads:** 查看与可下载产品相关的统计数据，包括购买和下载。\n\
  \n## 总结\n\n在本章中，我们回顾了 Magento 2 中现有的报告，并回顾了如何刷新统计数据以从每个报告中获取最新信息。在下一章中，您将了解如何管理\
  \ Magento 主题、内联翻译、Magento Marketplace 等，以便能够自定义您的 Magento 商店。\n"
