- '# 11 客户管理

  ## 客户管理


  在本章中，我们将涵盖以下主题：

  - 管理客户账户

  - 客户群组


  ## 管理客户账户


  客户可以在商店前台注册账户，以跟踪订单、保存个人信息以备未来订单使用等。


  你可以在管理后台的“客户 | 所有客户”部分管理商店中的客户账户。


  ### 客户管理


  你将在屏幕上看到以下页面：


  ![](img/de3034a92496a32462134266292a51dd_244_0.png)


  Magento 管理后台的网格中，最有用的元素之一是“操作”下拉菜单。该下拉菜单包含批量操作，可将特定操作应用于网格中所选的项目。


  客户网格中提供以下批量操作：

  - 删除

  - 订阅新闻通讯

  - 取消订阅新闻通讯

  - 分配客户群组

  - 编辑


  此外，你可以在网格中筛选和排序客户列表，设置每页显示的客户数量，选择要显示的列，按关键字搜索，以及将客户列表导出为 CSV 和 Excel XML。


  ### 客户管理


  你可以通过单击“操作”网格中最后一列的**编辑**链接来查看和编辑客户信息。


  点击该链接后，你将跳转到**客户**编辑页面：


  ![](img/de3034a92496a32462134266292a51dd_245_0.png)


  我们可以看到顶部有几个按钮，可对客户账户执行不同操作：

  - **删除客户**

  - **重置**：重置你打开**客户**编辑页面以来对客户信息所做的所有更改

  - **创建订单**：为客户创建订单

  - **重置密码**

  - **强制登录**：撤销客户账户的 API 令牌


  左侧边栏提供以下部分：

  - **客户视图**：查看以下截图：


  ![](img/de3034a92496a32462134266292a51dd_246_0.png)


  你可以看到客户的个人信息，包括：

  - 客户上次登录的时间

  - 账户是锁定还是解锁（Magento 会在六次登录失败后锁定账户）

  - 如果需要确认电子邮件，你可以查看账户是否已验证

  - 账户创建的日期

  - 创建账户的商店视图

  - 客户账户所属的客户群组

  - 默认账单地址和送货地址


  - **账户信息**：你可以在此部分编辑个人信息，并指定客户账户所属的客户群组：


  ![](img/de3034a92496a32462134266292a51dd_246_1.png)


  - **地址：** 你可以为客户账户添加新地址，并指定其中哪一个应为默认账单地址和送货地址：

  - **订单：** 你可以查看客户下的订单列表。你可以打开订单查看所有详细信息，甚至可以直接从网格中重新订购（如果在系统配置中启用了重新订购——销售 | 销售
  | 重新订购 | 允许重新订购）：


  ![](img/de3034a92496a32462134266292a51dd_247_0.png)


  ![](img/de3034a92496a32462134266292a51dd_247_1.png)


  - **账单协议**：为了简化结账流程，客户可以与支付服务提供商 PayPal 签订账单协议。客户在结账时选择账单协议作为支付方式，PayPal 通过其唯一编号识别账单协议，并继续进行收费。**账单协议**部分包含该客户的所有账单协议：


  ![](img/de3034a92496a32462134266292a51dd_248_0.png)


  - **新闻通讯**：你可以检查客户是否订阅了新闻通讯，并查看新闻通讯列表，且能够按**ID**、**开始日期**、**结束日期**、**接收日期**、**主题**和**状态**进行筛选：


  ![](img/de3034a92496a32462134266292a51dd_248_1.png)


  - **产品评论：** 你可以查看客户撰写的产品评论列表：


  ![](img/de3034a92496a32462134266292a51dd_249_0.png)


  - **愿望清单：** 你可以查看客户愿望清单中的产品列表，包括重要信息，例如自产品添加到愿望清单以来的天数：


  ![](img/de3034a92496a32462134266292a51dd_249_1.png)


  ### 添加新客户


  尽管客户可以从商店前台创建账户，但管理员也可以从管理后台创建账户。你可以通过单击“客户”页面（客户 | 客户 | 所有客户）中的“添加新客户”按钮来添加新客户：


  ![](img/de3034a92496a32462134266292a51dd_250_0.png)


  现在，点击屏幕右上角的**保存客户**按钮。你将跳转到**客户**页面，并看到成功消息，确认账户已创建：


  ![](img/de3034a92496a32462134266292a51dd_252_0.png)


  ### 总结


  你已经看到，在 Magento 中管理客户确实非常简单，从查看所有客户列表到应用有用的批量操作，例如*订阅新闻通讯*。创建和编辑客户也是一个简单的过程，你可以查看客户的所有信息，包括他们的订单、评论等。


  在下一章中，我们将介绍为你的 Magento 商店设置和管理税费的过程。

  '
- '## 12 管理员用户和角色

  # 管理员用户和角色


  在本章中，我们将涵盖以下概念：

  - 管理管理员用户

  - 管理角色和授予权限


  ## 管理管理员用户


  在管理电子商务网站时，你需要不同的管理员来访问管理后台中的不同页面。例如，如果你的团队成员负责在 Magento 商店中添加和更新产品，那么你需要该人员仅访问**产品
  | 目录**页面。如果另一位团队成员负责营销，那么你可以创建一个具有特定角色的新管理员用户，使其仅访问**营销**和**内容**部分。


  ### 管理员用户和角色


  你可以为 Magento 管理后台创建用户，并为每个用户角色授予特定权限。你可以通过打开管理后台中的“系统 | 权限 | 所有用户”页面查看现有管理员用户列表：


  ![](img/de3034a92496a32462134266292a51dd_254_0.png)


  你可以通过单击屏幕右上角的“添加新用户”按钮来添加新用户。你将跳转到以下表单：


  ![](img/de3034a92496a32462134266292a51dd_254_1.png)


  ### 管理员用户和角色


  在此，你可以设置新管理员用户的个人信息、密码、界面语言、账户状态和管理员角色。


  如果我们查看“用户角色”选项卡，可以看到 Magento 默认只包含一个用户角色，即“管理员”：


  ![](img/de3034a92496a32462134266292a51dd_255_0.png)


  让我们通过向表单中添加以下信息来创建一个示例管理员用户：


  #### 用户信息：

  - **名字**：你的名字

  - **姓氏**：你的姓氏

  - **电子邮件**：你的电子邮件地址

  - **密码**：为账户设置一个密码

  - **确认密码**：为账户重复输入相同密码

  - **界面语言**：英语（美国）/ 英语（美国）

  - **你的密码**：当前管理员用户的密码






  #### 用户角色：


  - 角色：管理员


  在表单中填写完这些信息后，点击“保存用户”。系统会将您重定向到用户网格页面，并在屏幕上显示以下消息：


  ![](img/de3034a92496a32462134266292a51dd_256_0.png)


  #### 管理角色


  您可以为管理员用户创建新角色，从而为不同的管理页面授予特定权限。您可以在管理面板中转到“系统 | 权限 | 用户角色”页面来管理用户角色。系统会将您重定向到以下页面：


  ![](img/de3034a92496a32462134266292a51dd_257_0.png)


  我们可以看到，Magento 默认提供的唯一管理员角色拥有管理面板中的所有权限。我们将通过点击屏幕右上角的**添加新角色**来创建一个新的用户角色。点击该按钮后，屏幕上会显示以下页面：


  ![](img/de3034a92496a32462134266292a51dd_257_1.png)


  在第一个选项卡**角色信息**中，您可以设置角色名称，并指定当前管理员用户的密码，以便保存更改。在第二个选项卡**角色资源**中，您会看到可以分配给用户角色的所有资源列表：


  ![](img/de3034a92496a32462134266292a51dd_258_0.png)


  我们将创建一个示例用户角色，使其只能访问管理面板中的**仪表盘**和**销售**部分。


  首先，我们将名称设置为`Sample User Role`，并在**角色信息**选项卡中指定当前管理员用户的密码。然后，我们将在“角色资源”选项卡中勾选“仪表盘”和“销售”复选框，如下面的屏幕截图所示：


  ![](img/de3034a92496a32462134266292a51dd_259_0.png)


  最后，点击**保存角色**，将新的管理员用户角色添加到 Magento。您将在角色网格中看到确认消息：


  ![](img/de3034a92496a32462134266292a51dd_259_1.png)


  如果我们返回用户网格页面（系统 | 权限 | 所有用户），并点击刚刚创建的用户，就可以将该用户分配到新的用户角色：


  ![](img/de3034a92496a32462134266292a51dd_260_0.png)


  如果我们保存更改，退出当前管理员用户账户，然后以新用户身份登录，就会看到该用户只能访问“仪表盘”和“销售”部分：


  ![](img/de3034a92496a32462134266292a51dd_260_1.png)


  ## 总结


  在本章中，您学习了如何创建新的管理员用户，并为不同的管理区域授予特定权限。在下一章中，我们将介绍 Magento 中的税费配置，包括税类、税率规则、税区和税率。

  '
- "# 13 税费\n\n在本章中，我们将介绍以下主题：\n\n- 税类和税率规则\n- 税区和税率\n\n## 税类和税率规则\n\n网站上线前，店主需要完成的任务之一就是为商店设置税费。\n\
  \nMagento 允许您根据业务需求设置税费。税费的常规配置位于我们之前介绍过的系统配置页面中（商店 | 配置 | 销售 | 税）：\n\n![](img/de3034a92496a32462134266292a51dd_262_0.png)\n\
  \n系统会将您重定向到以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_264_0.png)\n\n如果您点击“附加设置”，表单中将显示以下附加字段：\n\
  \n![](img/de3034a92496a32462134266292a51dd_264_1.png)\n\n如您所见，您可以为客户和产品添加新的税类。稍后，您可以在系统配置页面中选择这些新税类。\n\
  \n下面我们逐一介绍“新建税率规则”表单中的各个字段：\n\n- **税率规则信息：**\n    - **名称：** 税率规则的名称。\n    - **税率：**\
  \ 这是基于位置设置的税率规则百分比。您可以选择现有税率，也可以创建新的税率以供选择。我们稍后会对此进行介绍。\n- **附加设置：**\n    - **客户税类：**\
  \ 客户税类用于购买行为不是零售交易的特定场景。\n    - **产品税类：** 由于不同产品适用的税费不同，您可以为商店中的每个产品系列添加产品税类。\n\
  \    - **优先级：** 当存在多个税类时使用优先级。优先级相同的税率会相加，而其他税率会进行复合计算。\n    - **仅根据小计计算：** 覆盖复合税的优先级顺序，并根据订单小计计算税费。\n\
  \    - **排序顺序：** 税费的显示顺序。排序值越低，在列表中的显示位置越靠前。\n    - **导入税率：** 从 CSV 文件导入税率。\n  \
  \  - **导出税率：** 将税率导出为 CSV 文件。这有助于获取上一个字段中导入操作所需的正确 CSV 格式。\n\n下面我们继续创建新的税率规则。我们将在表单中添加以下信息：\n\
  \n- **税率规则信息：**\n    - **名称：** `Sample Rule`\n    - **税率：** 对于此规则，我们将选择以下税率：\n \
  \       - **US-CA-\\*-Rate 1**\n        - **US-NY-\\*-Rate 1**\n- **附加设置：**\n  \
  \  - **客户税类：** 零售客户\n    - **产品税类：** 应税商品\n    - **优先级：** 0\n    - **仅根据小计计算：**\
  \ 未选中\n    - **排序顺序：** 0\n\n现在，点击**保存规则**。当系统将您重定向到**税率规则**网格页面时，您会看到确认消息以及网格中的新规则：\n\
  \n![](img/de3034a92496a32462134266292a51dd_266_0.png)\n\n现在，让我们修改刚刚创建的规则的**客户税类**和**产品税类**。我们将点击网格中的**Sample\
  \ Rule**项目，以进入编辑表单。\n\n在那里，我们将点击**附加设置**链接，然后点击**添加新税类**按钮。\n\n如果您点击“保存规则”，就会在“税率规则”网格中看到更新后的税类：\n\
  \n![](img/de3034a92496a32462134266292a51dd_268_0.png)\n\n除此之外，新的税类还可以在税费系统配置页面（商店\
  \ | 配置 | 销售 | 税）中选择：\n\n![](img/de3034a92496a32462134266292a51dd_268_1.png)\n\n\
  我们将通过点击**添加新税率**来添加新的税率。页面加载后，您将看到以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_270_0.png)\n\
  \n在这里，您可以指定以下信息：\n\n- **税率标识：** 税率的名称。\n- **邮政编码是否为范围：** 您可以为税率指定邮政编码范围。\n- **邮政编码：**\
  \ 您可以指定具体的邮政编码，也可以使用星号字符指定邮政编码模式。例如，`bay*`将匹配所有以 bay 开头的邮政编码。\n- **州/省：** 从下一字段中选择的国家/地区中选择所有州/省或特定州/省。\n\
  - **国家/地区：** 选择税率适用的国家/地区。\n- **税率百分比：** 设置税率百分比。\n\n您还可以在“新建/编辑税率规则”页面中，通过点击“添加新税率”按钮来添加新的税率：\n\
  \n![](img/de3034a92496a32462134266292a51dd_271_0.png)\n\n点击该按钮后，您将看到以下窗口，用于添加新税率的信息：\n\
  \n![](img/de3034a92496a32462134266292a51dd_271_1.png)\n\n## 总结\n\n在本章中，我们介绍了基于客户位置创建税类、税率规则和税率的流程。现在，您将能够为\
  \ Magento 商店中的目录准确设置价格和税费。在下一章中，您将学习目录价格规则和购物车价格规则，以创建促销活动并提高销售额。\n"
- "# 14 目录和购物车价格规则\n\n在本章中，我们将介绍以下概念：\n\n- 目录价格规则\n- 购物车价格规则\n- 生成优惠券\n\n## 目录价格规则\n\
  \n在线商店的关键要素之一，就是能够设置促销活动，从而提高销量，并吸引访客再次下单。\n\n\n\n\n\n### 目录价格规则和购物车价格规则\n\nMagento\
  \ 允许你为目录设置促销活动。你可以从“营销 | 促销 | 目录价格规则”管理页面管理这些促销活动：\n\n![](img/de3034a92496a32462134266292a51dd_273_0.png)\n\
  \n如前面的屏幕截图所示，Magento 2 示例数据包含一个目录促销活动——所有女士裤装和男士裤装均享受 20% 折扣。\n\n你可以点击页面右上角的“添加新规则”来添加新规则。\n\
  \n页面加载后，屏幕上将显示**新建目录价格规则**：\n\n![](img/de3034a92496a32462134266292a51dd_274_0.png)\n\
  \n在这里，你可以指定以下信息：\n\n- **规则信息：**\n  - **规则名称：**用于帮助你记住此目录价格规则详细信息的名称。\n  - **描述：**目录价格规则的描述。这是供管理员使用的内部字段，不会显示在店面中。\n\
  \  - **状态：**设置目录价格规则是否处于启用状态。\n  - **网站：**指定目录价格规则适用的网站。\n  - **客户组：**为目录价格规则设置特定的客户组。\n\
  \  - **从（选择日期）– 到（选择日期）：**为目录价格规则设置特定的日期范围。\n  - **优先级：**匹配的目录价格规则将按照此字段设置的顺序应用，优先级数值越低，越先应用。\n\
  \n- **条件：**设置条件，使目录价格规则应用于特定产品。如果未设置条件，目录价格规则将应用于所有产品。你可以根据产品属性设置条件：\n\n![](img/de3034a92496a32462134266292a51dd_275_0.png)\n\
  \n你还可以设置：只有当所选条件全部为 True 或 False 时，目录价格规则才有效：\n\n![](img/de3034a92496a32462134266292a51dd_275_1.png)\n\
  \n点击绿色加号图标并选择产品属性后，将显示一个新字段和新图标，你可以为该属性选择具体筛选条件：\n\n![](img/de3034a92496a32462134266292a51dd_276_0.png)\n\
  \n前面的筛选条件适用于 SKU 属性；不同属性适用不同的筛选条件。例如，下面是颜色属性的筛选下拉菜单：\n\n![](img/de3034a92496a32462134266292a51dd_276_1.png)\n\
  \n最后，某些属性还提供蓝色窗口图标。例如，如果选择**SKU**属性并点击蓝色窗口按钮，你将看到一个产品网格，可以通过该界面筛选和选择产品：\n\n![](img/de3034a92496a32462134266292a51dd_277_0.png)\n\
  \n如果选择**类别**属性并点击蓝色窗口图标，你将能够通过类别网格选择类别：\n\n![](img/de3034a92496a32462134266292a51dd_278_0.png)\n\
  \n- **操作：**\n  - **应用：**根据前面字段中设置的规则信息和条件，将此操作应用于所有匹配的产品。可用操作包括：\n    - **按原价的百分比应用：**折扣按照产品价格的百分比计算。如果产品价格为\
  \ $200，折扣为 10%，则折后最终价格为 $190。\n    - **应用固定金额：**折扣为固定金额。如果产品价格为 $200，折扣为 10%，则折后最终价格为\
  \ $190。\n\n- **将最终价格调整为此百分比：**产品最终价格将为产品价格的指定百分比，即直接根据产品价格计算百分比。如果产品价格为 $200，折扣为\
  \ 10%，则折后最终价格为 $20。\n- **将最终价格调整为折扣值：**产品最终价格将为你设置的折扣金额。原始价格无关紧要，价格始终为指定的折扣金额。如果产品价格为\
  \ $200，折扣为 10%，则折后最终价格为 $10。\n- **折扣金额：**设置将按照前一个下拉菜单中所选方式应用的折扣金额。\n- **放弃后续规则：**如果其他规则满足相同条件，你可以放弃这些规则，以防止同一笔购买应用多重折扣。\n\
  \n## 购物车价格规则\n\nMagento 允许你创建可应用于购物车的特定促销活动。例如，顾客喜欢在网上商店使用优惠券代码，有些顾客甚至会为每次在线购买搜索优惠券代码。你可以从管理面板的**营销\
  \ | 促销 | 购物车价格规则**部分管理这些促销活动。随后你将进入以下网格页面：\n\n![](img/de3034a92496a32462134266292a51dd_280_0.png)\n\
  \n默认情况下，Magento 2 示例数据包含四条购物车价格规则：\n\n- Luma 水瓶 $4（节省 70%）\n- 购买 3 件 T 恤，第 4 件免费\n\
  - 消费满 $50——免运费！\n- 每笔满 $200 的订单享受 20% 折扣！*\n\n如果点击网格中的第一行，你将进入用于编辑该购物车价格规则的表单：\n\
  \n![](img/de3034a92496a32462134266292a51dd_281_0.png)\n\n如果折叠第一个部分，我们会看到可以设置购物车价格规则的多个部分：\n\
  \n![](img/de3034a92496a32462134266292a51dd_282_0.png)\n\n下面介绍每个部分中的字段：\n\n- **规则信息：**\n\
  \  - **规则名称：**用于帮助你记住此购物车价格规则详细信息的名称。\n  - **描述：**购物车价格规则的描述。这是供管理员使用的内部字段，不会显示在店面中。\n\
  \  - **启用：**设置购物车价格规则是否处于启用状态。\n  - **网站：**指定购物车价格规则适用的网站。\n  - **客户组：**为购物车价格规则设置特定的客户组。\n\
  \  - **优惠券：**指定应用此促销活动是否需要优惠券。\n  - **优惠券代码：**如果指定促销活动需要优惠券，则可以在此字段中设置优惠券代码。\n \
  \ - **使用自动生成：**选中此复选框后，可以从此表单的最后一个部分自动生成优惠券代码。\n  - **每张优惠券的使用次数：**设置优惠券可使用的次数上限。\n\
  \  - **每位客户的使用次数**：设置同一客户可以使用该优惠券的次数上限（仅适用于已登录的客户）。\n  - **从（选择日期）– 到（选择日期）**：为购物车价格规则设置特定的日期范围。\n\
  \  - **优先级**：匹配的购物车价格规则将按照此字段设置的顺序应用，优先级数值越低，越先应用。\n  - **在 RSS 源中公开**：设置购物车价格规则是否应在\
  \ Magento RSS 源中公开。\n\n- **条件**：设置应用购物车价格规则必须满足的条件。如果未设置条件，则只要满足**规则信息**部分中定义的属性，购物车价格规则就会始终应用。\n\
  \n我们可以找到以下可应用的条件：\n\n![](img/de3034a92496a32462134266292a51dd_283_0.png)\n\n- **标签：**在此部分中，你可以管理每个商店视图的默认标签和特定标签：\n\
  \n![](img/de3034a92496a32462134266292a51dd_285_0.png)\n\n- **管理优惠券代码：**你可以根据长度、代码格式、前缀、后缀和短横线等特定属性，为促销活动生成优惠券代码：\n\
  \n![](img/de3034a92496a32462134266292a51dd_286_0.png)\n\n随后，你将能够在以下网格中查看优惠券代码及其使用情况：\n\
  \n![](img/de3034a92496a32462134266292a51dd_286_1.png)\n\n\n\n\n\n### 目录与购物车价格规则\n\
  \n请注意，只有在**规则信息**部分勾选**使用自动生成**复选框时，才能生成优惠券代码：\n\n![](img/de3034a92496a32462134266292a51dd_287_0.png)\n\
  \n然后，如果你再次进入**管理优惠券代码**部分，你会看到表单已激活，并且可以根据你设置的特定条件生成优惠券：\n\n![](img/de3034a92496a32462134266292a51dd_287_1.png)\n\
  \n当你点击**生成**按钮时，优惠券会即时生成，屏幕上会显示“已生成 X 张优惠券”的消息。此外，你还可以在页面底部的网格中看到已生成的优惠券：\n\n![](img/de3034a92496a32462134266292a51dd_288_0.png)\n\
  \n### 小结\n\n在本章中，我们回顾了目录和购物车价格规则，以便为你的商店创建促销活动，从而提升销售额。\n\n在下一章中，我们将配置 Magento 中的默认支付方式，并介绍\
  \ PCI 合规性的概念，以保持系统安全，让客户能够无风险地使用信用卡下订单。\n"
- "# 15 处理付款\n\n## 处理付款\n\n在本章中，我们将介绍以下主题：\n\n- Magento 默认支付方式\n- 设置 PayPal\n- PCI\
  \ 合规性\n\n## Magento 默认支付方式\n\nMagento 默认包含几种支付方式：\n\n- PayPal\n- Braintree\n- 支票或汇票\n\
  - 银行转账支付\n- 货到付款支付\n- 零小计结账\n- 采购订单\n- Authorize.net direct post\n\n你可以在系统配置页面（商店\
  \ | 配置）的“销售 | 支付方式”部分查看这些支付方式的配置：\n\n![](img/de3034a92496a32462134266292a51dd_290_0.png)\n\
  \n在这里，你可以看到 Magento 推荐以下支付解决方案：\n\n- PayPal Express Checkout\n- Braintree\n\n不过，在**推荐解决方案**部分，你会看到右下角有一个链接——**其他\
  \ PayPal 支付解决方案**。如果你点击该链接，就会看到 Magento 中包含的其他 PayPal 解决方案：\n\n![](img/de3034a92496a32462134266292a51dd_291_0.png)\n\
  \n这样，Magento 开箱即用地总共包含了 13 种支付解决方案，这为你设置偏好的支付方式提供了大量选择。\n\n## 设置 PayPal\n\n**PayPal\
  \ Express Checkout** 是电子商务中使用最广泛的支付方式之一。客户可以使用他们的 PayPal 账户登录，也可以作为 PayPal 访客使用信用卡或借记卡付款。\n\
  \n我们将描述为你的 Magento 商店设置 **PayPal Express Checkout** 的过程。设置完成后，PayPal 按钮将显示在商店前端，如下所示：\n\
  \n产品详情页：\n\n![](img/de3034a92496a32462134266292a51dd_292_0.png)\n\n如果你点击该按钮，将显示以下表单：\n\
  \n![](img/de3034a92496a32462134266292a51dd_295_0.png)\n\n你需要账户中的 API 用户名、密码和签名才能使用\
  \ PayPal Express Checkout。\n\n你可以按照以下步骤获取该信息：\n\n1. 登录你的 PayPal 企业账户：\n\n![](img/de3034a92496a32462134266292a51dd_296_0.png)\n\
  \n2. 点击屏幕右上角的**个人资料**链接，然后点击“个人资料和设置”。\n\n3. 点击**我的设置工具**，然后点击 **API 访问**部分中的**更新**链接：\n\
  \n![](img/de3034a92496a32462134266292a51dd_297_0.png)\n\n4. 点击 **NVP/SOAP API 集成**部分中的**请求\
  \ API 凭据**链接：\n\n![](img/de3034a92496a32462134266292a51dd_298_0.png)\n\n5. 点击“请求\
  \ API 签名”链接，然后点击“同意并提交”：\n\n![](img/de3034a92496a32462134266292a51dd_299_0.png)\n\
  \n现在你已经获得了凭据，请将该信息复制并粘贴到 Magento 中的 PayPal Express Checkout 表单中。\n\n此外，你还会看到 PayPal\
  \ Express Checkout 部分末尾需要配置的基本和高级设置：\n\n你将看到**基本设置**表单的以下字段：\n\n- **标题**：你可以自定义在商店前端显示的这种支付方式的标题。\n\
  - **排序顺序**：你可以设置商店前端支付方式列表中的特定顺序，0 表示支付方式显示在列表顶部。\n- **支付操作**：你可以选择以下购买操作：\n  -\
  \ **授权**：此操作中，购买被批准，但需要商家授权才能向客户收费。商家负责开具发票，然后完成订单。\n- **销售**：客户下单时立即扣款。当 PayPal\
  \ 确认付款后，Magento 将创建发票。\n- **订单**：此购买代表 PayPal 与商家之间的协议。商家可以在接下来的 29 天内的任何时间捕获总金额。\n\
  - **显示在产品详情页**：选择是否应在**产品详情**页面上显示 PayPal 按钮。\n\n你将看到**高级设置**表单的以下字段：\n\n- **显示在购物车中**：选择是否应在购物车页面和页眉中的迷你购物车中显示\
  \ PayPal 按钮。\n- **适用付款国家/地区**：将 **PayPal Express Checkout** 限制为仅在特定国家/地区作为支付方式可用。\n\
  - **调试模式**：启用调试模式以记录开发期间调试有用的信息。\n- **启用 SSL 验证**：为 **PayPal Express Checkout**\
  \ 启用 SSL 保护。\n- **传输购物车明细**：在 PayPal 中包含所购商品的详细信息。\n- **传输配送选项**：在 PayPal 中包含配送选项的详细信息。\n\
  - **快捷按钮样式**：选择动态或静态快捷按钮。\n- **启用 PayPal 访客结账**：允许没有 PayPal 账户的客户使用 **PayPal Express\
  \ Checkout**。\n- **要求客户提供账单地址**：指定客户是否应为 **PayPal Express Checkout** 提供账单地址。\n-\
  \ **账单协议注册**：允许客户通过账单协议保存下一次购买所需的账单详细信息。\n- **跳过订单审核步骤**：在使用 **PayPal Express Checkout**\
  \ 时跳过订单审核步骤。\n\n## PCI 合规性\n\nPCI 合规性可确保你的客户能够安全地使用信用卡在你的商店购物。所有信用卡协会都要求商家实施 PCI\
  \ 合规性，以在线保护他们的客户。\n\nMagento 包含支付网关，通过直接的 API post 方法或支付网关提供的托管支付表单，安全地传输信用卡数据。\n\
  \n以下是满足**支付卡行业数据安全标准（PCI DSS）**的要求：\n\n1. 安装并维护防火墙配置以保护持卡人数据。\n2. 不要使用供应商提供的默认系统密码和其他安全参数。\n\
  3. 保护存储的持卡人数据。\n4. 加密通过开放公共网络传输的持卡人数据。\n5. 使用并定期更新你的防病毒软件。\n6. 开发并维护安全的系统和应用程序。\n\
  7. 将持卡人数据的访问权限限制在业务需要知情的人员范围内。\n8. 为每位可访问计算机的人员分配唯一 ID。\n9. 限制对持卡人数据的物理访问。\n10.\
  \ 跟踪并监控对网络资源和持卡人数据的所有访问。\n11. 定期测试安全系统和流程。\n12. 制定一项涵盖信息安全的安全策略。\n\n有两种方法可以保护你的客户并确保\
  \ PCI 合规性：\n\n- **直接 post：** 信息直接发送到支付网关，数据不经过 Magento 或在 Magento 中存储。\n- **托管支付表单：**\
  \ 支付表单集成在 Magento 结账流程中，但由支付网关托管，而不是由 Magento 应用程序托管。\n\n通过将敏感数据保存在 Magento 实例之外，商家可以通过\
  \ SAQ A 或 SAQ A-EP 级别的自我评估来验证合规性，而无需对整个 Magento 平台进行 PCI 合规性重新评估。\n\n\n\n\n\n###\
  \ 总结\n\n在本章中，我们回顾了 Magento 默认支付方式的列表，并为商店实现了 **PayPal Express Checkout**。此外，我们还讨论了\
  \ PCI 合规性和 SSL 加密。\n\n在下一章中，我们将讨论 Magento 2 中包含的不同配送方式，我们将设置 UPS 作为配送方式，并介绍我们 Magento\
  \ 商店额外配送方式的配置。\n"
- "# 16 配置配送\n\n我们将在本章中介绍以下内容：\n\n- Magento 默认配送方式概述\n- 如何设置 UPS 配送\n- 其他承运商\n\n##\
  \ Magento 默认配送方式概述\n\n在本章中，我们将逐步介绍 Magento 配送方式的配置。所有配置部分都位于 STORES | Configuration\
  \ | SALES | Shipping Methods 页面。\n\n## 统一费率\n\n让我们从查看 **统一费率** 开始。如果您展开此部分，将看到以下表单：\n\
  \n![](img/de3034a92496a32462134266292a51dd_305_0.png)\n\n这是将应用于您商店订单的预定义费用。定义为配送成本的金额是固定的，取决于您在管理面板中设置的配置。\n\
  \n要配置此方法，您应该更新以下字段：\n\n- **启用：** 指定 **统一费率** 是否应作为店面（Storefront）上的配送方式可用。\n- **标题：**\
  \ 配送方式的描述性标题。\n- **方法名称：** 这是在店面（Storefront）上显示在费率旁边的标签。\n\n- **类型：** 这是 Magento\
  \ 为配送方式设置费率所进行的计算。可用的类型如下：\n  - **无：** 统一费率作为配送方式在店面（Storefront）上可用，但费率为零（免费配送）\n\
  \  - **按订单：** 定义为 **统一费率** 配送方式价格的金额将按订单收取\n  - **按项目：** 定义为 **统一费率** 配送方式价格的金额将乘以购物车中的项目数量，以设置订单的配送费率\n\
  - **价格：** 这是将根据前一个字段中选择的选项用于计算最终配送费率的金额。\n- **计算手续费：** 设置手续费是根据前一个字段中定义的价格计算的固定金额还是百分比。\n\
  - **手续费：** 这将是用于计算手续费的固定金额或百分比。\n- **显示的错误消息：** 当配送方式不可用时要显示的错误消息。\n- **运送到适用的国家/地区：**\
  \ 指定配送方式应对所有国家/地区可用，还是仅对特定国家/地区可用。如果您选择特定国家/地区，将启用 **运送到特定国家/地区** 下拉列表，以选择此配送方式可用的国家/地区。\n\
  - **排序顺序：** 设置顺序以确定 **统一费率** 在店面（Storefront）可用配送方式列表中的位置。数字越低，它在列表中显示的位置越高。\n\n\
  ## 免费配送\n\n下一个可用的配送方式是 **免费配送**。如果您展开该部分，将看到以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_307_0.png)\n\
  \n**免费配送** 方法，顾名思义，是专门为免费配送配置特定配送方式的功能。这是在线商店中最常见的促销活动之一，您可以指定规则，使免费配送在特定场景下可用，从最低订单金额到应满足的购物车价格规则，以允许订单享受\
  \ **免费配送**。\n\n以下字段可用于配置配送方式：\n\n- **启用：** 指定 **免费配送** 是否应作为店面（Storefront）中的配送方式可用。\n\
  - **标题：** 配送方式的描述性标题。\n- **方法名称：** 这是在店面（Storefront）上显示在费率旁边的标签。\n- **最低订单金额：**\
  \ 设置订单符合免费配送条件所需的最低金额。\n\n- **显示的错误消息：** 当配送方式不可用时要显示的错误消息。\n- **运送到适用的国家/地区：**\
  \ 指定配送方式应对所有国家/地区可用，还是仅对特定国家/地区可用。如果您选择特定国家/地区，将启用 **运送到特定国家/地区** 下拉列表，以选择此配送方式可用的国家/地区。\n\
  - **排序顺序：** 设置顺序以确定 **免费配送** 在店面（Storefront）可用配送方式列表中的位置。数字越低，它在列表中显示的位置越高。\n\n\
  ## 表费率\n\n接下来，我们将找到可作为配送方式配置的 **表费率**。如果您展开 **表费率** 部分，将看到以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_308_0.png)\n\
  \n这种配送方式允许您定义一个 CSV 文件来计算配送费率。CSV 文件的格式取决于配送计算的条件。您可以选择以下任一条件：\n\n- **重量与目的地**\n\
  - **价格与目的地**\n- **商品数量与目的地**\n\n表费率配送方式配置中提供以下字段：\n\n- **启用：** 指定表费率是否应作为店面（Storefront）上的配送方式可用。\n\
  - **标题：** 配送方式的描述性标题。\n- **方法名称：** 这是在店面（Storefront）上显示在费率旁边的标签。\n- **条件：** 这是根据您上传的表格计算费率的条件。可用的条件有：\n\
  \  - **重量与目的地**\n  - **价格与目的地**\n  - **商品数量与目的地**\n- **在价格计算中包括虚拟产品：** 定义是否应将虚拟产品包含在费率计算中。由于表费率配送用于根据客户地址（距离）计算价格，因此大多数情况下此选项设置为“否”，因为虚拟产品是通过电子邮件交付的。\n\
  - **计算手续费：** 设置手续费是根据前一个字段中定义的价格计算的固定金额还是百分比。\n- **手续费：** 这将是用于计算手续费的固定金额或百分比。\n\
  - **显示的错误消息：** 当配送方式不可用时要显示的错误消息。\n- **运送到适用的国家/地区：** 指定配送方式应对所有国家/地区可用，还是仅对特定国家/地区可用。如果您选择特定国家/地区，将启用“运送到特定国家/地区”下拉列表，以选择此配送方式可用的国家/地区。\n\
  - **排序顺序：** 设置顺序以确定统一费率在店面（Storefront）可用配送方式列表中的位置。数字越低，它在列表中显示的位置越高。\n\n现在，要为表费率方法上传\
  \ CSV 文件，您应该使用屏幕左上角的下拉列表按网站进行筛选。之后，表费率表单中将出现两个新字段：导出和导入。您可以在以下截图中看到用于按网站筛选的下拉列表和新字段：\n\
  \n![](img/de3034a92496a32462134266292a51dd_310_0.png)\n\n您可以使用“导出”字段中的“导出 CSV”按钮导出表费率配送方式的当前\
  \ CSV。如果您尚未上传 CSV，则可以下载 Magento 默认附带的 CSV。尤其重要的是，要有一个可用于为您的商店创建自己的 CSV 文件的模板。\n\n\
  这是 Magento 默认附带的 CSV：\n\n\n\n\n\n### 配置 UPS 配送\n\n如果你在“商店 | 配置”页面中转到“销售 | 配送方式 |\
  \ UPS”部分，将看到以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_312_0.png)\n\n我们将逐一介绍此表单中的各个字段：\n\
  \n- **常规配置：**\n  - **启用结账**：指定 UPS 是否应作为店面的一种配送方式提供。\n  - **UPS 类型**：你可以选择 **United\
  \ Parcel Service** 或 **United Parcel Service XML**。使用 **United Parcel Service**，你可以获取实时运费；使用\
  \ **United Parcel Service XML**，你可以获取实时费率并打印 UPS 标签。\n- **取决于 UPS 类型的 UPS 特定配置**：以下字段取决于你在上一个字段中所选的\
  \ **UPS 类型**。如果你选择 **United Parcel Service** 作为 **UPS 类型**，将显示以下字段：\n\n  - **正式账户**：选择\
  \ **是** 可在线启用 UPS（生产环境）。如果你选择 **否**，则会在测试模式下将 UPS 启用为配送方式。\n  - **网关 URL**：Magento\
  \ 中已包含默认网关 URL。如果需要更改网关 URL，可以在此字段中进行更改。\n  - **标题：** 配送方式的描述性标题。\n  - **包裹请求类型：**\
  \ 你可以选择 **按等重拆分（一个请求）** 或 **使用原重量（少量请求）**。\n\n如果你选择 **United Parcel Service XML**\
  \ 作为 UPS 类型，将显示以下字段：\n\n- **正式账户：** 选择 **是** 可在线启用 UPS（生产环境）。如果你选择 **否**，则会在测试模式下将\
  \ UPS 启用为配送方式。\n- **访问许可证号：** 你的 UPS 访问密钥。\n- **网关 XML URL：** Magento 中已包含默认网关 XML\
  \ URL。如果需要更改网关 XML URL，可以在此字段中进行更改。\n- **模式：** 如该字段的注释所示，此设置可启用或禁用 UPS 对 Magento\
  \ 服务器的 SSL 验证。\n- **用户 ID：** 你的 UPS 用户 ID。\n- **发货地：** 从下拉列表中选择一个选项以指定货件的发货地。\n\
  - **密码：** 你的 UPS 账户密码。\n- **标题：** 配送方式的描述性标题。\n- **启用协商费率：** 启用与 UPS 的协商运费费率。\n\
  - **包裹请求类型：** 你可以选择 **按等重拆分（一个请求）** 或 **使用原重量（多个请求）**。\n- **发货人编号：** 这是一个由六个字符组成的\
  \ UPS 代码，是协商费率所必需的。\n- **跟踪 XML URL：** Magento 中已包含默认跟踪 XML URL。如果需要更改跟踪 XML URL，可以在此字段中进行更改。\n\
  \n**其他配置：** 以下字段适用于 **United Parcel Service** 和 **United Parcel Service XML UPS**\
  \ 两种类型：\n\n- **容器：** 设置货件的容器。\n- **重量单位：** 设置配送方式的重量单位。\n- **目的地类型：** 选择目的地类型是住宅还是商业。\n\
  - **最大包裹重量：** 设置承运人中的最大包裹重量数值。\n- **取件方式：** 将取件方式设置为以下任一方法：\n  - **常规每日取件**\n  -\
  \ **按需空运**\n  - 一次性取件\n  - 信件中心\n  - 客户柜台\n- **最小包裹重量：** 设置承运人中的最小包裹重量数值。\n- **计算处理费：**\
  \ 设置处理费是基于上一个字段中定义的价格的固定金额还是百分比。\n- **处理费：** 这将是一个固定金额或百分比，用于计算处理费。\n- **允许的配送方式：**\
  \ 选择将在店面可供选择的 UPS 配送方式。\n- **免费配送方式：** 选择应可作为免费配送方式供选择的 UPS 配送方式。\n- **免费配送金额阈值：**\
  \ 当订单总金额高于此数字时，上一个字段中选择的 UPS 配送方式将可作为免费配送方式供选择。\n- **显示的错误消息：** 当配送方式不可用时显示的错误消息。\n\
  - **配送至适用国家：** 指定配送方式应对所有国家可用，还是仅对特定国家可用。如果你选择特定国家，将启用 **配送至特定国家** 下拉列表，以选择可为此配送方式提供的国家。\n\
  - **不适用时显示配送方式：** 指定当配送方式不可用时，是否应在店面显示该配送方式。\n- **调试：** 启用调试模式，以在开发过程中记录有用的调试信息。\n\
  - **排序顺序：** 设置顺序以确定 **UPS** 在店面可用配送方式列表中的位置。数字越低，在列表中显示的位置越高。\n\n设置好配送方式后，客户将能够从\
  \ UPS 获取费率，并为其订单选择配送方式。\n\n在那里，你会看到可以按 Magento 版本（edition）、版本号、扩展评分、价格和扩展开发者类型进行筛选：\n\
  \n![](img/de3034a92496a32462134266292a51dd_316_0.png)\n\n## 总结\n\n在本章中，我们回顾了 Magento\
  \ 默认包含的配送方式。在下一章中，我们将回顾订单履行的过程，包括 Magento 中订单生命周期的概述。\n"
- '# 17 订单履行


  在本章中，我们将介绍以下概念：


  - 订单管理

  - 状态（State）和状态（Status）

  - 发票、发货和退款单


  ## 订单管理


  Magento 提供了一种强大而简单的方式来管理你的商店中生成的订单。如果客户通过电话订购并想购买商店中的产品，你甚至可以从管理后台创建订单。


  你可以在管理后台的“销售 | 订单”页面查看和管理订单：


  ![](img/de3034a92496a32462134266292a51dd_318_0.png)


  此页面一个非常重要的方面是，你可以选择非常有用的批量操作来管理订单：


  ![](img/de3034a92496a32462134266292a51dd_318_1.png)


  如你所见，你可以同时挂起多个订单、打印多个订单的发票等等。除此之外，订单网格还允许你继续使用 Magento 2 管理后台网格的所有工具，例如以下功能：


  - 筛选器

  - 可选择的列

  - 导出为 CSV 和 XML

  - 按关键字搜索


  如果你单击网格中的任意订单，将跳转到订单页面：


  ![](img/de3034a92496a32462134266292a51dd_319_0.png)


  你首先会注意到，在屏幕右上角有几个针对此订单的操作：


  ![](img/de3034a92496a32462134266292a51dd_320_0.png)


  你可以单击这些按钮快速执行操作——从向客户发送订单邮件，到挂起订单、创建发票，甚至编辑订单。


  - **信息**选项卡


  让我们逐一查看**信息**选项卡中的各个部分：


  | 订单与账户信息 |  |

  |---|---|

  | **订单 # 000000003 （订单确认邮件已发送）** | **账户信息** |

  | 订单日期 | 2016年12月26日 上午9:07:43 |

  | 订单状态 | 待处理 |

  | 购买自 | 主网站<br>主网站商店<br>默认商店视图 |

  | 下单 IP | 127.0.0.1 |

  | 客户名称 | Gabriel Guarino |

  | 电子邮件 | guarinogabriel@gmail.com |

  | 客户组 | 一般 |


  在这里，你可以看到订单的基本信息。了解该订单对应的商店（对于多商店 Magento 网站而言）、客户名称、电子邮件甚至 IP 地址非常重要，以防订单可疑。


  接下来的两个部分是**地址信息**和**付款与配送方式**：


  ![](img/de3034a92496a32462134266292a51dd_321_0.png)


  如你在第一部分中所见，如果客户在下单时出现任何拼写错误或失误，你可以编辑客户地址（包括配送地址和账单地址）。






  最后，在**订单总计**部分，你可以跟踪**总计**、已支付总额、已退款总额和应付总额。


  - **发票选项卡**


  如果你转到**发票**选项卡，你将看到一个包含为此订单生成的所有发票的网格。在前面的示例中，你可以看到没有发票的网格（我们将在本章后面生成一张发票）：


  ![](img/de3034a92496a32462134266292a51dd_323_0.png)


  此网格唯一可用的批量操作是**PDF 发票**，它会以 PDF 格式下载所选每张发票的副本。


  - **贷项通知单选项卡**


  在此部分，你可以看到为此订单生成的所有贷项通知单的完整列表：


  ![](img/de3034a92496a32462134266292a51dd_324_0.png)


  与**发票**选项卡一样，此网格上有一个批量操作，可为所有选中的贷项通知单下载 PDF。


  ### 履行订单


  - **发货选项卡**


  在此部分，你可以看到为此订单生成的所有发货记录的完整列表。需要注意的是，该选项卡在之前的图片中不可用。这是因为发货选项卡仅适用于实物订单，而我们到目前为止所查看的订单是一个仅包含
  1 个可下载产品的订单。


  ![](img/de3034a92496a32462134266292a51dd_325_0.png)


  - 评论历史选项卡


  除了**信息**选项卡中的**此订单备注**部分之外，你还可以从**评论历史**选项卡查看订单的完整评论列表：


  ![](img/de3034a92496a32462134266292a51dd_326_0.png)


  ### 履行订单


  如果你需要编辑客户订单，可以通过单击屏幕右上角的“编辑”按钮来完成。但是，如果你单击该按钮，你将看到以下消息：


  ![](img/de3034a92496a32462134266292a51dd_327_0.png)


  尽管该操作的名称是“编辑”，但实际上当前订单将被取消，并且你将被重定向到一个包含与当前订单相同信息的表单，但在创建订单之前可以编辑这些信息。


  ### 履行订单


  如果你需要编辑客户购买的物品，则需要编辑订单，但更改地址信息则没有必要。如果你单击账单地址或发货地址旁边的“编辑”按钮，你将被重定向到以下表单以编辑这些详细信息：


  ![](img/de3034a92496a32462134266292a51dd_328_0.png)


  正如你在前面截图中的消息中所看到的，更改发货地址不会改变订单总额，因为运费、税金和订单金额不会被重新计算。


  ### 履行订单


  这意味着，例如，当街道名称中存在拼写错误时，编辑地址很有用；但如果地址完全不同，则应取消订单并创建一个新订单（基本上，通过单击“编辑”按钮）以获得更新的运费和税率。


  现在，让我们回到订单网格。你会在屏幕右上角看到一个用于创建新订单的按钮：


  ![](img/de3034a92496a32462134266292a51dd_329_0.png)


  ### 履行订单


  如果你单击该按钮，你将被重定向到以下屏幕：


  ![](img/de3034a92496a32462134266292a51dd_330_0.png)


  创建新订单流程的第一步是选择客户。你可以从列表中选择客户，也可以使用屏幕右上角的按钮创建新客户。


  选择客户后，下一步是在以下页面上添加与订单相关的所有信息：


  ![](img/de3034a92496a32462134266292a51dd_331_0.png)


  这是一个非常长的表单，包含许多用于配置订单的选项。


  首先要注意的是左侧的侧边栏。你可以选择订单的货币，还可以根据客户活动更新订单。


  你将能够看到客户在店面购物车中的所有物品、心愿单中的物品列表、最近订购的物品、比较列表中的产品、最近比较过的产品以及最近查看过的产品。这是一种基于客户在店面中的操作历史快速选择订单产品的方法。


  现在，让我们从第一个部分“已订购物品”开始。


  ### 履行订单


  如果你单击此部分右侧的**添加产品**按钮，将显示以下网格：


  ![](img/de3034a92496a32462134266292a51dd_332_0.png)


  正如你在**产品**列中所看到的，对于捆绑产品、分组产品和可配置产品，有一个**配置**链接。如果你单击该按钮，你将能在以下窗口中为客户配置这些产品：


  ### 履行订单


  ![](img/de3034a92496a32462134266292a51dd_333_0.png)


  一旦你为订单选择了所有产品，你可以单击“将所选产品添加到订单”按钮来更新“已订购物品”网格：


  ![](img/de3034a92496a32462134266292a51dd_333_1.png)


  ### 履行订单


  最后，在**已订购物品**部分，你可以看到**应用优惠券代码**字段。假设我们接到客户电话，并在管理面板中下订单；如果客户有商店促销活动的优惠券代码，你可以将优惠券代码添加到该字段中，促销活动将被应用。


  接下来，我们有**账户信息**和**地址信息**部分：


  ![](img/de3034a92496a32462134266292a51dd_334_0.png)


  在第一个部分中，你可以更改订单的客户组和客户电子邮件。在第二个部分中，你可以从客户账户中选择现有地址，或者在客户没有可用地址或订单需要不同地址时添加新地址。此外，你可以选择**与账单地址相同**，以使用发货地址作为账单地址（此选项在新订单中默认选中）。


  ### 履行订单


  最后，我们可以看到**付款与发货信息**和**订单总计**部分：


  ![](img/de3034a92496a32462134266292a51dd_335_0.png)


  在**付款与发货信息**部分，你可以为订单选择付款方式和发货方式，运费将使用你在上一部分中指定的地址进行计算。


  如果你单击**获取发货方式和运费**链接，系统将使用订单的发货地址即时计算运费，然后你就可以选择客户偏好的发货方式。


  最后，在**订单总计**部分，你可以像我们之前看到的那样向订单添加评论、查看订单总计，并选择是否要在订单确认邮件中附上评论并发送给客户。


  ### 状态和状态值


  从订单在 Magento 中创建的那一刻起，它就会被处理并经历不同的状态和状态值。


  Magento 在内部使用订单状态来标识订单的当前阶段。这些状态不可自定义，且在后台中不可见；它们只能在 Magento 的代码库和数据库中看到。


  订单状态值由商店管理员使用，用来为订单设置流程，从购买开始到订单开票和产品交付为止。这些状态值可由商店管理员在 Magento 管理面板中进行自定义。


  你可以在 `sales_order_status_state` 数据库表中查看所有内部订单状态的列表：


  ![](img/de3034a92496a32462134266292a51dd_336_0.png)






  ![](img/de3034a92496a32462134266292a51dd_339_0.png)


  ## 发票、发货和贷项通知单


  生成和管理发票、发货以及贷项通知单的过程非常简单，且对它们而言流程相同。


  如果进入订单页面，你会看到之前介绍过的标签页，包括以下内容：


  - Invoices

  - Credit Memos

  - Shipments


  从这两个部分中，如我们之前所见，可以看到该订单的发票和贷项通知单列表。


  ### 履行订单


  你可以通过点击屏幕右上角编辑按钮旁边的 Invoices 按钮为订单创建发票：


  ![](img/de3034a92496a32462134266292a51dd_340_0.png)


  点击该按钮后，你将看到发票中将包含的所有信息的预览，并且可以添加注释并通过电子邮件发送发票副本：


  ![](img/de3034a92496a32462134266292a51dd_340_1.png)


  点击 **Submit Invoice** 后，发票将被生成且订单状态会被更新。接下来，你可以为订单创建发货。


  如果进入 **Shipments** 标签页，你将看到为当前订单创建的发货列表：


  ![](img/de3034a92496a32462134266292a51dd_341_0.png)


  要创建发货，应点击屏幕右上角的 Ship。你将被重定向到以下页面：


  ![](img/de3034a92496a32462134266292a51dd_342_0.png)


  在该页面上，你可以编辑收货和账单地址，为已发货产品添加追踪号码，指定将要发货的商品，添加注释，并通过电子邮件发送发货副本。一旦点击 Submit Shipment，发货将被创建，订单状态会被更新，且发货信息可从发货标签页中查看：


  ![](img/de3034a92496a32462134266292a51dd_343_0.png)


  当订单已开具发票后，你可以通过点击屏幕右上角的 **Credit Memo** 按钮创建贷项通知单。你将被重定向到以下页面：


  ![](img/de3034a92496a32462134266292a51dd_343_1.png)


  在那里，你可以标记要退回库存的商品，设置退款数量，为运费退款指定特定金额，并调整退款和费用。此外，如我们对发票和发货所见，你可以添加注释并通过电子邮件发送副本：


  ![](img/de3034a92496a32462134266292a51dd_344_0.png)


  如果点击 **Refund Offline**，贷项通知单将被生成，并在屏幕上显示以下消息：


  ![](img/de3034a92496a32462134266292a51dd_345_0.png)


  ## Summary


  在本章中，我们回顾了 Magento 中订单的生命周期。在下一章中，我们将介绍如何在 Magento 中修改交易性电子邮件并管理商店通讯。

