  \n### Virtual Product\n\nMagento 允许你为目录创建非有形产品，例如会员资格或专业服务。这些产品可以单独显示，也可以作为组合产品或捆绑产品的一部分包含在内。\n\
  \n虚拟产品与 Magento 中的简单产品非常相似，唯一的区别是虚拟产品没有重量属性并且不需要发货信息。\n\n我们将通过以下步骤创建一个 **Virtual\
  \ Product**：\n\n1. 前往 **Products | Inventory | Catalog** 页面。\n2. 点击 **Add Product**\
  \ 按钮内的箭头并选择 **Virtual Product**。\n3. 我们将为此产品设置以下信息：\n\n#### General Information:\n\
  \n- **Enable Product:** Yes\n- **Attribute Set:** Default\n- **Product Name:** Membership\n\
  - **SKU:** membership\n- **Price:** $100\n- **Tax Class:** Taxable Goods\n- **Quantity:**\
  \ 50\n- **Stock Status:** In Stock\n- **Visibility:** Catalog, Search\n- **Categories:**\
  \ Default Category | Collections | Erin Recommends\n\n\n\n\n4. 为产品添加示例图片：\n\n  \
  \ ![](img/de3034a92496a32462134266292a51dd_167_0.png)\n\n5. 点击**保存**以完成虚拟产品的设置。\n\
  \n现在，让我们在店面查看产品的展示效果。这是产品列表页面：\n\n![](img/de3034a92496a32462134266292a51dd_167_1.png)\n\
  \n### 产品类型\n\n这是产品详细信息页面：\n\n![](img/de3034a92496a32462134266292a51dd_168_0.png)\n\
  \n#### 可下载产品\n\n**可下载产品**是一种可下载的数字文件，例如电子书、软件、音乐视频等。\n\n由于下载文件在购买前不可用，你可以在产品详细信息页中添加示例，例如电子书简介、软件试用版或音乐视频短片。\n\
  \n让我们按照以下步骤创建一个**可下载产品**：\n\n1. 转到**产品 | 库存 | 目录**页面。\n2. 点击**添加产品**按钮内的箭头，然后选择**可下载产品**。\n\
  \n如下面的屏幕截图所示，可下载产品表单中有一个名为“可下载信息”的特殊部分：\n\n![](img/de3034a92496a32462134266292a51dd_169_0.png)\n\
  \n3. 我们将为此产品设置以下信息：\n\n   **基本信息：**\n\n   - 启用产品：是\n   - 属性集：默认\n   - 产品名称：示例培训计划\n\
  \   - SKU：sample-training-program\n   - 价格：$25\n   - 税类：应税商品\n   - 数量：100\n   -\
  \ 库存状态：有库存\n   - 可见性：目录，搜索\n   - 类别：默认类别 | 系列 | Erin 推荐\n\n4. 为此产品添加示例图片：\n\n  \
  \ ![](img/de3034a92496a32462134266292a51dd_170_0.png)\n\n5. 你现在可以添加可下载产品的具体详细信息。“可下载信息”部分包含以下内容：\n\
  \n   - **链接**：用于指定此产品的下载链接。这些链接在购买产品时显示。\n   - **示例**：用于为可下载产品添加示例，这些示例将显示在产品详细信息页中。\n\
  \n6. 让我们为可下载产品添加一个链接和一个示例。点击“链接”容器中的“添加链接”，并设置以下信息：\n\n   - **标题**：示例链接\n   - **文件**：URL\
  \ | http://url.dev/file\n   - **示例**：URL | http://url.dev/sample\n   - **可共享**：否\n\
  \   - **最大下载次数**：100\n\n如详细信息中所示，你也可以为各个链接设置示例。\n\n如果将“可共享”设置为“是”，客户将通过电子邮件收到链接，并能够与他人共享该链接。\n\
  如果将“可共享”设置为“否”，客户必须登录客户账户才能访问下载链接。\n\n最后，你可以设置下载次数限制，并且还有一个复选框可以设置无限次下载，如下面的截图所示：\n\
  \n![](img/de3034a92496a32462134266292a51dd_171_0.png)\n\n7. 现在，让我们在“示例”容器中为产品添加一个示例：\n\
  \n   - 标题：产品示例\n   - 文件：URL – http://url.dev/product-sample\n\n8. 最后，点击“保存”以完成可下载产品的设置。\n\
  \n现在，我们将从产品详细信息页面到客户账户，逐一查看可下载产品的各个页面：\n\n- 产品列表页面：\n\n  ![](img/de3034a92496a32462134266292a51dd_172_0.png)\n\
  \n- 产品详细信息页面：\n\n  ![](img/de3034a92496a32462134266292a51dd_173_0.png)\n\n- 购物车：\n\
  \n  ![](img/de3034a92496a32462134266292a51dd_173_1.png)\n\n- 结账：\n\n  ![](img/de3034a92496a32462134266292a51dd_174_0.png)\n\
  \n- 客户账户：\n\n  ![](img/de3034a92496a32462134266292a51dd_174_1.png)\n\n## 总结\n\n\
  在本章中，你了解了 Magento 中不同的产品类型，并为每种产品类型创建了一个示例产品。\n在下一章中，我们将介绍 Magento 2 中管理类别的过程，以便为我们的商店设置主导航菜单和类别树。\n"
- "# 7 类别\n\n在本章中，我们将涵盖以下概念：\n\n- 类别\n- 层级结构\n- 顶部导航\n\n## 类别\n\nMagento 提供了一种将目录组织成不同类别和子类别的方式。你可以在管理面板内部组织目录，并为客户在店面提供清晰的产品浏览方式。\n\
  \n你可以通过转到管理面板中的**产品 | 库存 | 类别**部分来管理商店中的类别：\n\n![](img/de3034a92496a32462134266292a51dd_177_0.png)\n\
  \n当该部分在管理面板中加载后，你将在左侧看到类别树，在右侧看到用于添加和编辑类别的表单：\n\n![](img/de3034a92496a32462134266292a51dd_177_1.png)\n\
  \n在类别树顶部，你会看到两个按钮：\n\n- **添加根类别**：你可以添加根类别。这有助于设置多个商店视图，例如，一个服装商店和一个电子产品与电脑商店。这些商店是独立的商店视图，每个视图都有包含在不同根类别中的特定目录。下面这个屏幕截图展示了两个根类别的示例：\n\
  \n  ![](img/de3034a92496a32462134266292a51dd_178_0.png)\n\n- **添加子类别**：你可以为当前类别添加子类别。在上面的屏幕截图中，**Alternative\
  \ Store** 根类别已被选中，因此如果我们点击**添加子类别**，就会创建子类别，如下面的屏幕截图所示：\n\n  ![](img/de3034a92496a32462134266292a51dd_179_0.png)\n\
  \n我们添加了一个根类别和一个子类别，但尚未查看创建它们的表单。我们将创建一个新类别，并逐步完成整个过程：\n\n1. 点击类别树中的**默认类别**以选择它：\n\
  \n   ![](img/de3034a92496a32462134266292a51dd_180_0.png)\n\n2. 点击屏幕左上角的“添加子类别”。\n\
  \n3. 在表单顶部区域添加以下信息：\n\n   - 启用类别：是\n   - 在菜单中显示：是\n   - 类别名称：示例类别\n\n这些字段不言自明。**在菜单中显示**字段允许您设置是否在店面的主导航菜单中显示该类别：\n\
  \n![](img/de3034a92496a32462134266292a51dd_181_0.png)\n\n4. 在**内容**部分设置以下信息：\n\n\
  \   - **类别图片**：为类别添加横幅图片，如下面的屏幕截图所示：\n\n     ![](img/de3034a92496a32462134266292a51dd_181_1.png)\n\
  \n   - **描述：**为类别添加示例描述\n   - **添加 CMS 块：**你可以添加一个静态块，使其显示在该类别中\n\n5. 在“显示设置”中设置以下部分：\n\
  \n   ![](img/de3034a92496a32462134266292a51dd_182_0.png)\n\n在此部分中，你可以设置：\n\n- **显示模式：**你可以选择仅显示产品、仅显示选定的静态块，或两者都显示。对于此类别，我们将选择**仅产品**。\n\
  - **锚点：**如果你选择**是**，则该类别将在左侧边栏中显示分层导航筛选器。分层导航是一个块，可让你按属性（例如颜色或尺寸）筛选类别。我们将为此类别选择**是**。\n\
  \n6. 接下来，我们找到“搜索引擎优化”部分：\n\n   ![](img/de3034a92496a32462134266292a51dd_183_0.png)\n\
  \n此部分提供以下设置：\n\n- **URL 键**：你可以为该类别设置特定的 URL 键。对于此类别，我们将此字段留空，Magento 将根据类别标题创建\
  \ URL 键。\n- **元标题**：你可以设置用于搜索引擎优化的标题元标记。\n- **元关键字**：你可以设置用于搜索引擎优化的关键字元标记。\n- **元描述**：你可以设置用于搜索引擎优化的描述元标记。\n\
  \n我们将**元标题**、**元关键字**和**元描述**字段留空，Magento 将根据类别标题分配元标记。\n\n7. 你可以通过“**类别中的产品**”部分选择与此类别关联的产品：\n\
  \n\n\n![](img/de3034a92496a32462134266292a51dd_184_0.png)\n\n按照前面的截图，选择我们在上一章中创建的所有产品。\n\
  \n8. 下一节是 Design。就像产品一样，你也可以为分类设置特定的设计：\n\n![](img/de3034a92496a32462134266292a51dd_184_1.png)\n\
  \n我们将逐一介绍各个字段，但我们将为所有字段保留默认值：\n\n- **Use Parent Category Settings**: 如果你点击此复选框，该分类将继承父分类的设计配置\n\
  - **Theme**: 你可以为分类选择特定的主题\n- **Layout**: 你可以为分类设置特定的布局：\n  - **Empty**\n  - **1\
  \ column**\n  - **2 columns with left bar**\n  - **2 columns with right bar**\n\
  \  - **3 columns**\n- **Layout Update XML**: 为分类布局添加自定义 XML 配置，例如自定义样式表\n- **Apply\
  \ Design to Products**: 如果你点击此复选框，相关产品将继承此分类的设计配置\n\n9. 表单末尾的章节是 **Schedule Design\
  \ Update**。在这里，你可以为上一节的设计更新指定一个日期范围。我们将对此分类保持为空。\n\n10. 点击 **Save** 来添加新的分类。\n\n\
  分类保存后，你将看到确认消息以及该分类作为 **Default Category** 的子分类：\n\n![](img/de3034a92496a32462134266292a51dd_186_0.png)\n\
  \n如果进入 Storefront，你将在主导航菜单中看到新的分类：\n\n![](img/de3034a92496a32462134266292a51dd_186_1.png)\n\
  \n### Hierarchy\n\n正如我们之前所见，你可以通过在创建子分类前选择父分类来设置分类的层级结构。Magento 允许你轻松管理分类的层级结构，我们将回顾如何更新分类树以更改父分类和子分类。\n\
  \n在分类树中，你会看到有些分类旁边有一个加号图标：\n\n![](img/de3034a92496a32462134266292a51dd_188_0.png)\n\
  \n如果你点击任意一个加号图标，你将能够展开该分类以显示其子分类：\n\n![](img/de3034a92496a32462134266292a51dd_189_0.png)\n\
  \n现在，假设我们想通过将 Sample Category 移为 Women 分类下的子分类来更改分类树的层级结构。\n\n如果你想这样做，Magento 允许你像在你喜欢的操作系统中管理文件夹那样简单地拖放分类。\n\
  \n我们继续将 Sample Category 从当前位置拖出并放到 Women 分类之上。\n\n你将在屏幕上看到以下消息：\n\n![](img/de3034a92496a32462134266292a51dd_190_0.png)\n\
  \n更新分类的层级结构会消耗 Magento 很多资源，这就是为什么屏幕上会显示警告。让我们继续前进并按下 Ok 以继续操作。\n\n分类移动后，你将看到确认消息以及屏幕上的更新后分类树：\n\
  \n![](img/de3034a92496a32462134266292a51dd_191_0.png)\n\n现在，如果你进入 Storefront，你将在屏幕上看到更新后的导航菜单：\n\
  \n![](img/de3034a92496a32462134266292a51dd_191_1.png)\n\n### Top navigation\n\n\
  让我们再看一下管理面板中的分类树：\n\n![](img/de3034a92496a32462134266292a51dd_192_0.png)\n\n正如你所见，其中一些分类的颜色为浅灰色。这意味着这些分类已被禁用，这就是为什么\
  \ Collections 和 Promotions 在 Storefront 的主导航菜单中不可见。\n\n即使这是正确的，一个分类在主导航菜单中不可见的第二个原因也可能是存在的。如果你查看前面的截图，你会看到表单中有一个\
  \ Include in Menu 设置。这是一个非常重要的设置，因为你可以保持分类启用但不包含在主导航菜单中。\n\n我们继续选择之前创建的 Sample Category。进入后，将\
  \ Include in Menu 设置更新为 No，如以下截图所示：\n\n![](img/de3034a92496a32462134266292a51dd_193_0.png)\n\
  \n如果你现在进入 Storefront，你会看到 Women 菜单项在下拉菜单中不包含 Sample Category 子菜单项：\n\n![](img/de3034a92496a32462134266292a51dd_194_0.png)\n\
  \n这允许你指定要在主导航菜单中保持可见的菜单项，这对于自定义目录在 Storefront 向客户展示的方式非常重要。\n\n### Summary\n\n在本章中，你学习了如何在你的\
  \ Magento 商店中管理分类，现在你可以将产品关联到不同的分类并更新主导航菜单。在下一章中，我们将介绍 CMS 页面、块和部件以继续自定义你的商店。\n"
- "# 8. CMS Pages, Blocks, and Widgets\n\n在本章中，我们将介绍以下主题：\n\n- CMS Pages\n- Static\
  \ blocks\n- Widgets\n\n## CMS Pages\n\n如果你想知道是否可以添加带有静态内容的额外页面，那么这是适合你的部分。我们将介绍在\
  \ Magento 中管理静态页面的流程，例如 *Privacy Policy* 或 *Terms and Conditions*，让你可以创建额外页面以向你的商店添加更多信息。\n\
  \n你可以通过管理面板中的 **CONTENT | Elements | Pages** 部分管理这些页面：\n\n![](img/de3034a92496a32462134266292a51dd_196_0.png)\n\
  \n进入该部分后，你将看到商店中当前可用的页面列表：\n\n![](img/de3034a92496a32462134266292a51dd_196_1.png)\n\
  \n正如前一个截图中所示，Magento 2 示例数据中包含六个页面。CMS 页面一个重要方面是 **URL Key**，它对同一商店视图中的每个页面都是唯一的。\n\
  \n你可以通过组合商店的 Base URL 和 URL Key 来访问 CMS 页面。例如，要访问 **About us** 页面，你应该前往\nhttp://magento2-playground.dev/about-us.\n\
  \n你将在屏幕上看到以下页面：\n\n![](img/de3034a92496a32462134266292a51dd_197_0.png)\n\n现在，假设你想编辑页面以更新副标题。然后，你应该在页面网格中该页面的行上点击\
  \ Select 并点击 Edit：\n\n![](img/de3034a92496a32462134266292a51dd_198_0.png)\n\n你将被重定向到以下表单：\n\
  \n![](img/de3034a92496a32462134266292a51dd_198_1.png)\n\n### CMS Blocks\n\n####\
  \ CMS Blocks 管理\n\n##### 创建静态块\n\n本书以故宫学为整体研究视域，从故宫古建筑、院藏文物、宫廷遗存、学术成果等维度，系统梳理2024年度故宫博物院在文物保护、学术研究、对外文化交流等方面的重要进展与核心成果，力求全面呈现故宫学研究的年度面貌与发展趋势。\n\
  \n本卷在既往编辑经验的基础上，进一步突出研究的系统性、前沿性与开放性，围绕故宫学理论建构、文化遗产保护利用、明清宫廷历史与文化、文物科技保护等主题，精选重要论文与研究报告，以期为相关领域的研究者与爱好者提供兼具学术深度与阅读价值的年度文本。\n\
  \n- **New Layout:** Set a specific layout on the scheduled date:\n  - Empty\n  -\
  \ 1 column\n  - 2 columns with left bar\n  - 2 columns with right bar\n  - 3 columns\n\
  \n我们将通过更新以下字段来编辑 **About Us** 页面：\n\n- **General:**\n  - **Page Title:** `About\
  \ this company`\n- **Content:**\n  - **Content Heading:** `The company`\n  - **WYSIWYG\
  \ Editor:** 将 `230 stores` 替换为 `300 stores` 并在副标题下方添加一张图片\n\n现在，如果你尝试像之前一样访问同一页面，你将看到我们所做的更改：\n\
  \n![](img/de3034a92496a32462134266292a51dd_200_0.png)\n\n## Static blocks\n\n如果你有想要在不同位置显示的信息，例如促销横幅，或你业务地点的\
  \ *Business Hours*，那么你应该有一种方式从管理面板的一个部分编辑信息并将其实现在网站的不同区域。\n\nMagento 允许你通过静态块来实现同样的功能。静态块是管理\
  \ Magento 商店内容的一种强大方式，因为你可以添加 HTML 内容以在不同页面中显示并从管理面板的静态块部分进行管理。\n\n你可以通过管理面板中的 **CONTENT\
  \ | Elements | Blocks** 菜单项访问静态块部分：\n\n![](img/de3034a92496a32462134266292a51dd_202_0.png)\n\
  \n\n\n\n\n### CMS 页面、静态块和小部件\n\n在那里，你会看到包含现有块的以下网格：\n\n![](img/de3034a92496a32462134266292a51dd_203_0.png)\n\
  \nMagento 2 示例数据中包含 18 个静态块。让我们查看名为 Training Block 的静态块。在 Blocks 网格中，单击该静态块所在行上的\
  \ Select，然后单击 Edit：\n\n![](img/de3034a92496a32462134266292a51dd_203_1.png)\n\n你将被重定向到以下表单：\n\
  \n![](img/de3034a92496a32462134266292a51dd_204_0.png)\n\n如你所见，这个表单比 CMS 页面中的新建/编辑页面更简单。有以下一些字段：\n\
  \n- **启用块**：将静态块设置为活动状态，以便包含在其他页面中\n- **块标题**：静态块的标题\n- **标识符**：静态块的唯一标识符\n- **商店视图**：该页面将在选定的商店视图中可见\n\
  - **WYSIWYG 编辑器**：你可以使用所见即所得编辑器编辑静态块的内容\n\n这是 Training 类别页面中包含的横幅。如果单击主导航菜单中的 Training\
  \ 类别，就可以看到该横幅：\n\n![](img/de3034a92496a32462134266292a51dd_205_0.png)\n\n静态块可以包含在以下位置：\n\
  \n- 主题中的模板文件（以编程方式包含）\n- 类别\n- 通过小部件包含在 CMS 页面和其他静态块中\n\n### 小部件\n\n小部件是可以包含在不同页面中的模块，通过不同的小部件类型，根据不同的配置显示信息。\n\
  \nMagento 中提供以下用于内容管理的小部件：\n\n- CMS 页面链接\n- CMS 静态块\n- 目录类别链接\n- 目录新产品列表\n- 目录产品链接\n\
  - 目录产品列表\n- 订单和退货\n- 最近比较的产品\n- 最近查看的产品\n\n你可以通过转到管理面板中的“内容 | 元素 | 小部件”部分来管理你的小部件：\n\
  \n![](img/de3034a92496a32462134266292a51dd_206_0.png)\n\nMagento 2 示例数据中包含 18 个小部件。如下面的截图所示，它们都是\
  \ CMS 静态块，分布在店面（Storefront）的不同位置。\n\n### CMS 页面、静态块和小部件\n\n![](img/de3034a92496a32462134266292a51dd_207_0.png)\n\
  \n我们将通过单击屏幕右上角的“添加小部件”按钮来创建一个新小部件。将显示以下表单：\n\n![](img/de3034a92496a32462134266292a51dd_207_1.png)\n\
  \n你可以在下面的截图中看到小部件的条件：\n\n![](img/de3034a92496a32462134266292a51dd_210_0.png)\n\n\
  最后，单击**保存**以启用小部件。你会看到 Magento 通知你需要刷新缓存：\n\n![](img/de3034a92496a32462134266292a51dd_210_1.png)\n\
  \n你应该像之前看到的那样，从“缓存管理”页面清除缓存类型。之后，你将在锚定类别中看到该小部件，例如“男装 | 上衣”：\n\n![](img/de3034a92496a32462134266292a51dd_211_0.png)\n\
  \n### 总结\n\n在本章中，你学习了如何管理你的 Magento 商店中的内容，包括 CMS 页面、静态块和小部件。在下一章中，我们将介绍如何管理你的网站、商店和商店视图的范围，以及如何配置\
  \ Magento 商店中的区域设置选项。\n"
- '# 9 管理范围和区域设置

  ## 管理范围和区域设置


  在本章中，我们将介绍：


  - Magento 范围——网站、商店和商店视图

  - 回顾添加商店视图如何影响目录和 CMS

  - 语言


  ### Magento 范围——网站、商店和商店视图


  Magento 最重要的功能之一是从单个 Magento 实例创建多个商店的能力。Magento 实现了一个包含四个层级的层级系统：


  - 默认/全局

  - 网站

  - 商店/商店组

  - 商店视图


  Magento 中最常见的多商店配置场景出现在零售商中，他们按商店视图分离其目录，如下所示：


  ![](img/de3034a92496a32462134266292a51dd_213_0.png)


  在前面的示例中，公司有一个网站，但每个产品系列都有自己的商店，以面向不同的客户。最后，每个商店都有自己的商店视图，以便能够以不同的语言显示内容。


  使用单个 Magento 实例，你可以通过以下方式实现多商店配置：


  - 多种语言

  - 多个域名

  - 不同的类别


  ### 管理范围和区域设置


  你可以在 Magento 管理面板的“商店 | 设置 | 所有商店”部分看到你的 Magento 实例的商店配置。屏幕上将显示以下网格：


  ![](img/de3034a92496a32462134266292a51dd_214_0.png)


  在那里，你将看到你的 Magento 实例的当前商店配置。Magento 2 示例数据中包括一个网站、一个商店和一个商店视图。在接下来的部分中，我们将回顾从网站到商店视图的所有概念。


  ### 网站


  一个网站包含一个或多个商店。你可以在不同的网站中拥有不同的客户集合，所有这些都可以通过单个 Magento 实例进行管理。否则，你可以在所有网站之间共享客户账户。除此之外，你还可以按网站设置特定的产品价格、税类、货币和系统配置。


  ### 商店/商店组


  一个商店包含产品和类别。每个商店都有一个关联的根类别，允许你按商店定义不同的类别。在前面的示例中，我们看到了两个拥有完全不同产品系列的商店：


  ![](img/de3034a92496a32462134266292a51dd_215_0.png)


  Magento 允许你通过为每个商店定义根类别来实现这一点。与同一网站关联的所有商店共享相同的客户账户。


  ### 商店视图


  商店视图通常用于为你的网站定义不同的语言。通过这样做，商家能够按照客户的语言来定位客户。


  ### 管理范围和区域设置


  与同一商店关联的所有商店视图共享相同的根类别、配送方式和支付方式。通过使用商店视图，你可以设置不同的价格、标题、描述等。


  我们将回顾 Magento 2 示例数据中包含的**网站**、**商店**和**商店视图**。


  我们将进入管理面板中的**商店**部分：**商店 | 设置 | 所有商店**。


  在那里，你将看到我们之前描述的网格：


  ![](img/de3034a92496a32462134266292a51dd_216_0.png)


  ### 管理范围和区域设置


  我们将从单击第一列中的“主网站”链接开始。你将被重定向到以下屏幕：


  ![](img/de3034a92496a32462134266292a51dd_217_0.png)


  在那里，你可以编辑名称、代码、排序顺序和默认商店。请注意，多商店配置可以在项目根目录的 index.php 文件中设置。如果已通过这种方式设置了多商店配置，并且你更改了网站代码，请确保更新
  index.php 文件以指定网站的新代码。


  ### 管理范围和区域设置


  如果我们回到**商店**网格并单击第二列中的**主网站商店**链接，我们将被重定向到以下页面：


  ![](img/de3034a92496a32462134266292a51dd_218_0.png)


  正如你在该页面上看到的，你可以查看此商店的父网站，编辑**名称**，并设置**根类别**和**默认商店视图**。


  最后，如果我们回到网格并单击第三列中的“默认商店视图”链接，我们将被重定向到以下表单：


  ![](img/de3034a92496a32462134266292a51dd_219_0.png)


  你可以为商店视图编辑父商店，设置名称、代码、状态和排序顺序。需要说明的是，多商店配置可以使用 index.php 文件中的商店视图代码来设置。如果是这种情况，每次在管理面板中更改商店视图代码时，都应更新该文件。


  ### 默认/全局范围


  除了网站、商店和商店视图之外，我们还应该提到，默认/全局范围定义了管理面板中不同配置的默认值。通过选择此范围，你将设置要应用于所有网站、商店和商店视图的特定配置。


  当你编辑 Magento 配置、产品或类别时，你将能够为值选择范围。你可以在全局范围内定义值，也可以在网站、商店或商店视图级别专门定义值。





  你可以在 Magento 管理面板中找到用于选择作用域的下拉菜单。例如，对于系统配置值（商店 | 设置 | 配置），你可以在屏幕左上角找到作用域下拉菜单：


  ![](img/de3034a92496a32462134266292a51dd_220_0.png)


  #### 小结


  在本章中，你了解了 Magento 用于管理商店的层级系统。我们介绍了网站、商店和商店视图的概念，现在你已经清楚这些作用域之间的区别。在下一章中，我们将介绍 Magento
  中的系统配置设置。

  '
- "# 10 系统配置\n\n本章将涵盖以下内容：\n\n- 常规系统配置\n- 目录配置\n- 客户配置\n- 销售、配送和付款配置\n- 高级配置\n\n##\
  \ 系统配置部分和字段\n\n系统配置页面是管理面板中最重要的页面之一，原因在于你可以在这里配置所有 Magento 模块。\n\n你可以通过选择管理面板中的“商店\
  \ | 设置 | 配置”菜单项进入系统配置页面。屏幕上将显示以下页面：\n\n![](img/de3034a92496a32462134266292a51dd_222_0.png)\n\
  \n系统配置页面包含以下部分：\n\n- **常规：**\n  - 常规\n  - Web\n  - 设计\n  - 货币设置\n  - 商店电子邮件地址\n\
