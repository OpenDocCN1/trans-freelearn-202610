  \ Magento 商店的 Internet 流量，你应该启用 HTTP 和 HTTPS 端口。你可以通过点击 **Add Rule** 然后从 **Custom\
  \ TCP Rule** 下拉菜单中选择 **HTTP** 和 **HTTPS** 来添加这些端口。\n\n   7. Review: 在此步骤中，你可以查看\
  \ Amazon 实例的配置。点击屏幕右下角的 Launch：\n\n   ![](img/de3034a92496a32462134266292a51dd_54_0.png)\n\
  \n这是流程中非常重要的一部分。你可以通过使用私钥文件访问 Amazon 实例。\n\n访问新实例的唯一方式是使用密钥对，即 AWS 存储的公钥和你的私钥文件。\n\
  \n选择 Create a new key pair 然后设置密钥对名称并点击 Download Key Pair。切勿丢失私钥文件，因为那是访问你的 Amazon\
  \ 实例的主密钥。\n\n最后，点击 Launch Instance 以完成 Setup Wizard。\n\n### 为 Magento 2 准备 Amazon\
  \ 实例\n\n现在你已经创建了 Amazon 实例，我们准备安装所有软件包和依赖项以准备实例用于 Magento 2。\n\n#### 安装\n\n第一步是使用你在\
  \ Setup Wizard 中下载的私钥文件登录服务器。\n\n要登录，你需要知道实例的公共 DNS 或公共 IP。你可以从 AWS EC2 Management\
  \ Console 获取这些值：\n\n1. 转到 `https://console.aws.amazon.com/ec2/` AWS EC2 Management\
  \ Console。\n\n2. 你将看到我们在列表中刚创建的实例。在表格中向右滚动以找到实例的 **Public DNS** 和 **Public IP**：\n\
  \n![](img/de3034a92496a32462134266292a51dd_55_0.png)\n\n3. 在登录服务器之前，我们应该为私钥文件赋予正确的权限。在\
  \ Terminal 中定位该文件并运行以下命令：\n\n```\nchmod 400 ~/Key Pairs/sample.pem\n```\n\n现在我们可以使用以下命令登录\
  \ AWS 实例：\n\n```\nssh -i ~/sample.pem ubuntu@107.20.106.201\n```\n\n我们也可以使用此命令：\n\
  \n```\nssh -i ~/sample.pem ubuntu@ec2-107-20-106-201.compute-1.amazonaws.com\n```\n\
  \n一旦你登录到开发服务器，你应该获得 sudo 权限以便在没有问题地继续安装所有依赖项：\n\n```\nsudo su\n```\n\n现在，是时候为 Magento\
  \ 2 设置所有依赖项了：\n\n1. 更新服务器中所有现有的软件包：\n\n```\napt-get update\n```\n\n2. 我们将使用以下命令安装\
  \ Apache、PHP、所需的 PHP 模块和 composer：\n\n```\nsudo apt-get install apache2\nsudo apt-get\
  \ install php7.0\nsudo apt-get install libapache2-mod-php\nsudo apt-get install\
  \ php7.0-simplexml\nsudo apt-get install php7.0-curl\nsudo apt-get install php7.0-intl\n\
  sudo apt-get install php7.0-xsl\nsudo apt-get install php7.0-zip\nsudo apt-get install\
  \ php7.0-xml\nsudo apt-get install php7.0-curl\nsudo apt-get install php7.0-gd\n\
  sudo apt-get install php7.0-mcrypt\nsudo apt-get install php7.0-dom\nsudo apt-get\
  \ install php7.0-mbstring\nsudo apt-get install composer\n```\n\n![](img/de3034a92496a32462134266292a51dd_56_0.png)\n\
  \n你可以像这样用一条命令运行所有依赖项的安装：\n\n```\nsudo apt-get install apache2 php7.0 libapache2-mod-php\
  \ php7.0-dom php7.0-simplexml php7.0-curl php7.0-intl php7.0-xsl php-mbstring php7.0-zip\
  \ php7.0-xml php7.0-curl php7.0-gd php7.0-mcrypt php7.0-dom php7.0-mbstring composer\n\
  ```\n\n\n\n\n\n3. 接下来，我们将安装 MySQL。请注意，安装程序会要求你为 root 用户设置密码：\n\n```\nsudo apt-get\
  \ install mysql-server\nsudo apt-get install php-mysql\n```\n\n4. 保护 MySQL 安装。为此，请运行以下命令：\n\
  \n```\nmysql_secure_installation\n```\n\n它会要求输入你之前配置的 MySQL 密码：\n\n- 移除匿名用户：是\n\
  - 禁止远程登录：是\n- 移除测试数据库及其访问权限：是\n- 现在重新加载权限表？：是\n\n5. 打开 apache2.conf 文件，并将 `AllowOverride`\
  \ 设置为 all，以授予文档根目录正确的权限。\n\n6. 找到以下代码块：\n\n```\n<Directory /var/www/>\n  Options\
  \ Indexes FollowSymLinks\n  AllowOverride none\n  Require all granted\n</Directory>\n\
  ```\n\n将其替换为以下代码：\n\n```\n<Directory /var/www/>\n  Options Indexes FollowSymLinks\n\
  \  AllowOverride all\n  Require all granted\n</Directory>\n```\n\n7. 重启 Apache 服务器以应用更改：\n\
  \n```\nsudo service apache2 restart\n```\n\n8. 在文档根目录中创建一个示例 `phpinfo.php` 文件：\n\
  \n```\ncd /var/www/html\nrm index.html\necho \"<?php echo phpinfo();\" > phpinfo.php\n\
  ```\n\n9. 然后，你可以访问文档根目录，并在浏览器中查看 `phpinfo.php` 文件的输出。例如，<公共 IP>/phpinfo.php。\n\n\
  你应该在浏览器中看到以下页面：\n\n![](img/de3034a92496a32462134266292a51dd_58_0.png)\n\n10. 如果\
  \ `phpinfo.php` 能正常显示，请删除该文件，并创建一个自定义 MySQL 用户和数据库以导入 Magento（创建与旧服务器相同的用户名）：\n\n\
  ```\nmysql -u root -p\nCREATE USER '<username>'@'localhost' IDENTIFIED BY 'password';\n\
  GRANT ALL PRIVILEGES ON * . * TO '<username>'@'localhost';\nFLUSH PRIVILEGES;\n\
  CREATE DATABASE <databasename>;\n```\n\n现在，Amazon 实例已为 Magento 2 准备就绪，你可以继续进行安装向导或我们在上一节中看到的命令行安装方法。\n\
  \n## 小结\n\n在本章中，我们回顾了 Magento 的系统要求。我们在本地机器上安装了一个实例，甚至还从零开始为 Magento 2 设置了一台 Amazon\
  \ 服务器。在下一章中，我们将回顾如何将商店从 Magento 1 迁移到 Magento 2。\n\n## 代码审计\n\n高级软件工程师应审查当前 Magento\
  \ 1.x 商店的代码库，并记录当前代码的状态。\n\n这意味着软件工程师将确保 Magento 1.x 商店中不存在不良实践，因为不良实践会导致 Magento\
  \ 2.x 商店中缺少功能。\n\n### 修改过的 Magento 核心\n\nMagento 1.x 中一个不良实践的示例是直接修改 Magento 核心。有些开发者这样做而不是创建自定义模块，这导致平台上的一些更改在代码库中无法通过自定义模块体现出来。这些功能将无法迁移到\
  \ Magento 2，因为在审查自定义模块时，开发人员看不到这些更改。\n\n如果核心已被修改，那么第一步就是将这些更改从核心移动到自定义扩展，并从 Magento\
  \ 恢复原始核心文件。\n\n你可以从 Magento 技术资源下载页面的 `https://magento.com/tech-resources/download`\
  \ 下载从 1.0 起的任何 Magento 版本。\n\n软件工程师将能够将你的商店核心的当前状态与原始 Magento 核心进行比较。\n\n### 模板中的业务逻辑\n\
  \nMagento 中另一个不良编程实践是将业务逻辑放在模板中，而不是放在自定义扩展中。在 Magento 中向模板添加业务逻辑的正确方法是在自定义扩展的块中添加该逻辑，但有些开发者改为在前端模板中包含\
  \ PHP 代码。\n\n软件工程师应审查前端模板，以查看是否有任何需要移至自定义扩展的自定义业务逻辑。\n\n### 第三方扩展\n\n我不建议拥有大量第三方扩展。你应该只保留你需要的、并且你认为对商店至关重要的扩展。\n\
  \n话虽如此，你应该审查你的商店使用的第三方扩展是否可用于 Magento 2。这意味着你应该访问模块供应商的网站，检查是否已为 Magento 2 创建了新扩展。\n\
  \n非常重要的一点是，一些模块供应商正在为其扩展创建 Magento 2 版本，但这些 Magento 2 扩展并不具备 Magento 1 扩展的所有功能。\n\
  \n这意味着你不仅应检查该扩展是否可用，还应检查你在 Magento 1 中使用的该扩展的所有功能在 Magento 2 的扩展中是否都可用。\n\n如果某扩展不适用于\
  \ Magento 2，则你应该分析是否真的需要该扩展。如果你确实需要，可以联系模块供应商，了解近期是否有发布计划。如果模块供应商不打算很快发布 Magento\
  \ 2 的新版本，那么你应该为 Magento 2 从零开始创建该扩展。\n\n### 自定义扩展\n\n如果你在 Magento 1 中寻找自定义功能但未在\
  \ Magento Connect 中找到任何扩展，那么你必须实现自定义代码来支持该扩展。这些是 Magento 1 中可用但与 Magento 2 不兼容的自定义扩展。\n\
  \nMagento 2 是一个具有新数据结构和新编码实践的新平台。你应该为这些扩展从零开始创建新版本，并使用与 Magento 2 兼容的代码。\n\n###\
  \ 未使用的扩展\n\n是否有未使用的自定义或第三方扩展？如果有，你应该审查这些扩展的功能，以确定是否真的需要它们。通过减少扩展数量，你可以减少需要迁移的代码量，并保持更干净的\
  \ Magento 2 实例。\n\n### 自定义 JavaScript\n\n自定义 JavaScript 不会迁移到 Magento 2，你需要记录使用\
  \ JavaScript 实现的自定义功能。这些功能应由经验丰富的 Magento 开发人员手动迁移到 Magento 2，以使用 RequireJS。\n\n\
  ### 迁移要求\n\n现在你已经分析了代码，是时候审查迁移要求了。有时，原始需求在代码审计后会发生变化。这是合理的，因为你对商店当前状态的了解会更多，并且你将基于此制定行动计划。\n\
  \n代码审计过程之后，你将获得一个列表，包括：\n\n- 需要移至自定义扩展的核心更改\n- 需要移至自定义扩展的模板中的业务逻辑\n- 可用于 Magento\
  \ 2 的第三方扩展\n- 需要为 Magento 2 更新的第三方扩展\n- 需要为 Magento 2 更新的自定义扩展\n- 不会在 Magento 2\
  \ 中实现的未使用扩展\n- 需要在 Magento 2 中实现的自定义 JavaScript\n\n还有其他需要考虑的事项——主题（主题模板）。主题不会从 Magento\
  \ 1 自动迁移到 Magento 2。就像你对第三方扩展所做的那样，你应该检查该主题是否适用于 Magento 2，并在必要时联系主题开发者，了解是否即将有发布计划。\n\
  \n如果你想保持商店相同的外观和感觉，那么如果主题不适用于 Magento 的新版本，你就应该考虑为 Magento 2 从零开始创建主题。\n\n现在，推进迁移的计划应类似于以下内容：\n\
  \n- 准备好你之前创建的列表中的每一项\n- 确保代码中没有问题，因为这些问题在迁移到 Magento 2 时仍会存在\n- 将 Magento 1.x 升级到最新的\
  \ Magento 1.x 版本\n- 如果你完成了以上所有项目，你就可以进行数据迁移了\n\n## 使用数据迁移工具\n\n数据迁移工具由 Magento 团队创建，允许商店所有者从\
  \ Magento 1 迁移到 Magento 2。\n\n该工具有助于将数据库信息迁移到 Magento 2，例如产品、订单、客户、商店配置等。\n\n你可以从\
  \ Github 上的以下地址访问数据迁移工具的代码：\n\n```\nhttps://github.com/magento/data-migration-tool\n\
  ```\n\n![](img/de3034a92496a32462134266292a51dd_64_0.png)\n\n\n\n\n\n## 兼容版本\n\n\
  最好提到 Data Migration Tool 与以下 Magento 版本兼容：\n\n- Magento Community Edition:\n  -\
  \ Version 1.6.x\n  - Version 1.7.x\n  - Version 1.8.x\n  - Version 1.9.x\n- Magento\
  \ Enterprise Edition:\n  - Version 1.11.x\n  - Version 1.12.x\n  - Version 1.13.x\n\
  \  - Version 1.14.x\n\n## 迁移流程\n\n在使用 Data Migration Tool 之前，您应遵循以下步骤：\n\n1. Set\
  \ up an empty Magento 2 instance: The instance should meet the requirements described\
  \ in Chapter 2, Installation and the cron jobs shouldn't be enabled.\n\n![](img/de3034a92496a32462134266292a51dd_65_0.png)\n\
  \n2. **Prepare your Magento 1.x instance**: From this point, make sure you don't\
  \ modify the catalog, such as Products or Categories, until everything is migrated\
  \ to Magento 2. Also, disable all the cron jobs and create a database backup before\
  \ moving forward. It's also required to put the store into maintenance mode during\
  \ the migration process. In the following image, you can see that we created a database\
  \ backup using the command line:\n\n![](img/de3034a92496a32462134266292a51dd_66_0.png)\n\
  \n3. Ensure that you are using PHP 7 to ensure the best performance of the Data\
  \ Migration Tool:\n\n![](img/de3034a92496a32462134266292a51dd_67_0.png)\n\n4. Install\
  \ the Data Migration Tool in your Magento 2 directory by following these instructions:\n\
  \n   1. Go to the Magento 2 directory using the Terminal:\n\n```shell\n~/Projects\
  \ $ cd Playground/magento2-migration.dev\n~/Projects/Playground/magento2-migration.dev\
  \ $ ls\nCHANGELOG.md          Gruntfile.js.sample   LICENSE_APL.txt   composer.json\
  \   index.php   package.json.sample   pub   var\nCONTRIBUTING.md       ISSUE_TEMPLATE.md\
  \     app               composer.lock   lib         php.ini.sample        setup\
  \   vendor\nCOPYING.txt           LICENSE.txt           bin               dev  \
  \           nginx.conf.sample     phpserver   update\n~/Projects/Playground/magento2-migration.dev\
  \ $ \n```\n\n   2. Check the latest release version of the Data Migration Tool at\
  \ https://github.com/magento/data-migration-tool/releases:\n\n![](img/de3034a92496a32462134266292a51dd_69_0.png)\n\
  \n   3. Run the following commands in the Terminal:\n\n```\ncomposer config repositories.data-migration-tool\
  \ git https://github.com/magento/data-migration-tool\ncomposer require magento/data-migration-tool:2.1.3\n\
  ```\n\nPlease note that the second command includes the latest version of the Data\
  \ Migration Tool at the end (2.1.3). Make sure you update that command to match\
  \ the latest release version from Github.\n\n## Migration\n\nThe second command\
  \ will require authentication from `repo.magento.com`. You can get these credentials\
  \ from your Magento account by following these steps:\n\n1. Go to `http://magento.com`\
  \ and click on **MY ACCOUNT** at the top-right of the screen:\n\n![](img/de3034a92496a32462134266292a51dd_70_0.png)\n\
  \n2. If you have a Magento account, log in using your username and password. If\
  \ not, create your account by clicking on the Register button on the right:\n\n\
  ![](img/de3034a92496a32462134266292a51dd_71_0.png)\n\n4. Click on the Magento 2\
  \ tab and then Create A New Access Key:\n\n![](img/de3034a92496a32462134266292a51dd_73_0.png)\n\
  \nNow that you have your Access Keys, you can finish the Data Migration Tool installation\
  \ by adding your credentials after running the command:\n\n![](img/de3034a92496a32462134266292a51dd_74_0.png)\n\
  \n5. Configure the Data Migration Tool: After the installation, you will find the\
  \ directory that contains the mapping and configuration files in the following locations\
  \ in the Magento 2 directory:\n\n- Migration from Magento 1 Community Edition to\
  \ Magento 2 Community Edition:\n  - `vendor/magento/data-migration-tool/etc/ce-to-ce`\n\
  - Migration from Magento 1 Community Edition to Magento 2 Enterprise Edition:\n\
  \  - `vendor/magento/data-migration-tool/etc/ce-to-ee`\n- Migration from Magento\
  \ 1 Enterprise Edition to Magento 2 Enterprise Edition:\n  - `vendor/magento/data-migration-tool/etc/ee-to-ee`\n\
  \nYou can see the content of each of those directories in the following screenshot:\n\
  \n![](img/de3034a92496a32462134266292a51dd_75_0.png)\n\nBefore running the migration\
  \ process, you should create `config.xml` with all the database connection details\
  \ for the migration.\n\nDepending on the type of migration (ce to ce, ce to ee,\
  \ or ee to ee), you should add `config.xml` to the specific location that we previously\
  \ described.\n\nFor this migration, I have prepared a Magento 1 Community Edition\
  \ with a sample data instance:\n\n![](img/de3034a92496a32462134266292a51dd_76_0.png)\n\
  \nThis migration will be from Magento 1 Community Edition to Magento 2 Community\
  \ Edition, so the location for the configuration file will be `vendor/magento/data-migration-tool/etc/ce-to-ce/<Magento\
  \ 1 version>/config.xml`.\n\nIn the location, the `<Magento 1 version>` is the version\
  \ number of your Magento 1 store. The installed Magento 1 version in this example\
  \ is `1.9.2.4`, so the following command should be run to go to the right directory:\
  \ `cd vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4`\n\nThere is a sample\
  \ configuration file in that directory, so you should go to the directory and run\
  \ the following command to duplicate it: `cp config.xml.dist config.xml`\n\nHere,\
  \ you can see all the commands to go to the right directory and duplicate the configuration\
  \ file, including a preview of that file:\n\n```shell\n~/Projects/Playground/magento2-migration.dev\
  \ $ cd vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4\n~/Projects/Playground/magento2-migration.dev/vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4\
  \ $ ls\nconfig.xml.dist  map.xml.dist\n~/Projects/Playground/magento2-migration.dev/vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4\
  \ $ ls -lat\ntotal 144\ndrwxr-xr-x 4 gabriel staff  1136 Dec 27 16:25 .\ndrwxr-xr-x\
  \ 35 gabriel staff 11920 Dec 17 16:25 ..\n-rw-r--r-- 1 gabriel staff  7002 Dec 19\
  \ 11:38 config.xml.dist\n-rw-r--r-- 1 gabriel staff  63779 Dec 19 11:38 map.xml.dist\n\
  ~/Projects/Playground/magento2-migration.dev/vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4\
  \ $ cp config.xml.dist config.xml\n~/Projects/Playground/magento2-migration.dev/vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4\
  \ $ cat config.xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!--\n/**\n * Copyright\
  \ © 2015 Magento. All rights reserved.\n * See COPYING.txt for license details.\n\
  \ */\n-->\n<config xmlns:xs=\"http://www.w3.org/2001/XMLSchema-instance\" xs:noNamespaceSchemaLocation=\"\
  ../../config.xsd\">\n    <steps mode=\"settings\">\n        <step title=\"Settings\
  \ Step\">\n            <integrity>Migration\\Step\\Settings\\Integrity</integrity>\n\
  \            <data>Migration\\Step\\Settings\\Data</data>\n        </step>\n   \
  \     <step title=\"Stores Step\">\n            <integrity>Migration\\Step\\Stores\\\
  Integrity</integrity>\n            <data>Migration\\Step\\Stores\\Data</data>\n\
  \            <volume>Migration\\Step\\Stores\\Volume</volume>\n        </step>\n\
  \    </steps>\n    <steps mode=\"data\">\n        <step title=\"Data Integrity Step\"\
  >\n            <integrity>Migration\\Step\\DataIntegrity\\Integrity</integrity>\n\
  \        </step>\n        <step title=\"EAV Step\">\n            <integrity>Migration\\\
  Step\\Eav\\Integrity</integrity>\n            <data>Migration\\Step\\Eav\\Data</data>\n\
  \            <volume>Migration\\Step\\Eav\\Volume</volume>\n        </step>\n  \
  \  </steps>\n</config>\n```\n\nOpen config.xml in your favorite editor and locate\
  \ the `<source>` tag:\n\n```xml\n<source>\n    <step title=\"Customer Attributes\
  \ Step\">\n        <delta>Migration/Step/Customer/Delta</delta>\n        <volume>Migration/Step/Customer/Volume</volume>\n\
  \    </step>\n    <step title=\"Map Step\">\n        <delta>Migration/Step/Map/Delta</delta>\n\
  \        <volume>Migration/Step/Map/Volume</volume>\n    </step>\n    <step title=\"\
  Log Step\">\n        <delta>Migration/Step/Log/Delta</delta>\n        <volume>Migration/Step/Log/Volume</volume>\n\
  \    </step>\n    <step title=\"OrderGrids Step\">\n        <delta>Migration/Step/OrderGrids/Delta</delta>\n\
  \        <volume>Migration/Step/OrderGrids/Volume</volume>\n    </step>\n    <step\
  \ title=\"SalesIncrement Step\">\n        <delta>Migration/Step/SalesIncrement/Delta</delta>\n\
  \        <volume>Migration/Step/SalesIncrement/Volume</volume>\n    </step>\n</source>\n\
  <destination>\n    <database host=\"localhost\" name=\"magento1\" user=\"root\"\
  />\n</destination>\n<destination>\n    <database host=\"localhost\" name=\"magento2\"\
  \ user=\"root\"/>\n</destination>\n<options>\n    <map_file>etc/ce-to-ce/1.9.2.4/map.xml.dist</map_file>\n\
  \    <eav_map_file>etc/ce-to-ce/1.9.2.4/eav_map.xml.dist</eav_map_file>\n    <eav_document_groups_file>etc/ce-to-ce/1.9.2.4/eav_document_groups.xml.dist</eav_document_groups_file>\n\
  \    <eav_attribute_groups_file>etc/ce-to-ce/1.9.2.4/eav_attribute_groups.xml.dist</eav_attribute_groups_file>\n\
  \    <log_map_file>etc/ce-to-ce/1.9.2.4/log_map.xml.dist</log_map_file>\n    <log_document_groups_file>etc/ce-to-ce/1.9.2.4/log_document_groups.xml.dist</log_document_groups_file>\n\
  \    <settings_map_file>etc/ce-to-ce/1.9.2.4/settings.xml.dist</settings_map_file>\n\
  \    <customer_map_file>etc/ce-to-ce/1.9.2.4/customer.xml.dist</customer_map_file>\n\
  \    <customer_document_groups_file>etc/ce-to-ce/1.9.2.4/customer_document_groups.xml.dist</customer_document_groups_file>\n\
  \    <customer_attribute_groups_file>etc/ce-to-ce/1.9.2.4/customer_attribute_groups.xml.dist</customer_attribute_groups_file>\n\
  \    <delta_document_groups_file>etc/ce-to-ce/1.9.2.4/delta.xml.dist</delta_document_groups_file>\n\
  \    <order_grids_document_groups_file>etc/ce-to-ce/1.9.2.4/order_grids_document_groups.xml.dist</order_grids_document_groups_file>\n\
  \    <map_document_groups_file>etc/ce-to-ce/1.9.2.4/map_document_groups.xml.dist</map_document_groups_file>\n\
  \    <class_map_file>etc/ce-to-ce/1.9.2.4/class_map.xml.dist</class_map_file>\n\
  \    <tier_price_map_file>etc/ce-to-ce/1.9.2.4/tier_price.xml.dist</tier_price_map_file>\n\
  </options>\n```\n\nCustomize the node to match the information in the Magento 1\
  \ and Magento 2 databases. Take into account that you should add the following to\
  \ each of the database tags to specify the database password: `password=\"<database\
  \ password>\"` Now, locate the `<crypt_key />` tag.\n\n\n\n\n将该密钥复制并粘贴到数据迁移工具配置文件中，如下所示：\n\
  \n```\n</source>\n<destination>\n<database host=\"localhost\" name=\"magento2migration\"\
  \ user=\"root\">\n</destination>\n<options>\n<map_file>etc/ce-to-ce/9.2.4/map.xml.dist</map_file>\n\
  <eav_map_file>etc/ce-to-ce/eav.xml.dist</eav_map_file>\n<eav_document_groups_file>etc/ce-to-ce/eav/document-groups.xml.dist</eav_document_groups_file>\n\
  <eav_attribute_groups_file>etc/ce-to-ce/eav/attribute-groups.xml.dist</eav_attribute_groups_file>\n\
  <log_map_file>etc/ce-to-ce/log/map.xml.dist</log_map_file>\n<log_document_groups_file>etc/ce-to-ce/log/document-groups.xml.dist</log_document_groups_file>\n\
  <settings_map_file>etc/ce-to-ce/settings.xml.dist</settings_map_file>\n<customer_map_file>etc/ce-to-ce/customer.xml.dist</customer_map_file>\n\
  <customer_document_groups_file>etc/ce-to-ce/customer/document-groups.xml.dist</customer_document_groups_file>\n\
  <customer_attribute_groups_file>etc/ce-to-ce/customer/attribute-groups.xml.dist</customer_attribute_groups_file>\n\
  <delta_document_groups_file>etc/ce-to-ce/delta/log.xml.dist</delta_document_groups_file>\n\
  <order_grids_document_groups_file>etc/ce-to-ce/order-grids/document-groups.xml.dist</order_grids_document_groups_file>\n\
  <price_map_file>etc/ce-to-ce/price.xml.dist</price_map_file>\n<class_map>etc/ce-to-class_map.xml.dist</class_map>\n\
  <tier_price_map_file>etc/ce-to-map/tier-price.xml.dist</tier_price_map_file>\n</options>\n\
  ```\n\n如果 bulk_size=0，则将自动检测每个文档。\n<bulk_size>0</bulk_size>\n</...>\n为了获得更好的性能，请设置\
  \ direct_document_copy = 1。\n注意：'source' 和 'destination' 数据库必须位于同一 MySQL 实例上，并且\
  \ 'destination' 用户必须被授予对 'source' 数据库的 'SELECT' 权限。\n<direct_document_copy>0</direct_document_copy>\n\
  <source_prefix />\n<auto_resolve_url_rewrite_duplicates>0</auto_resolve_url_rewrite_duplicates>\n\
  <log_file_migration>log/log_file>\n<progress_bar_format>%percent% [%bar%] Remaining\
  \ Time: %remaining%</progress_bar_format>\n<edition_customer_password_hash>upgrade_customer_password_hash>\n\
  <edition_migrate>1.9.2.4</edition_number>\n<init_statements_source>SET NAMES utf8</init_statements_source>\n\
  <init_statements_destination>SET NAMES utf8</init_statements_destination>\n<crypt_key>e45b01f...\
  \ </crypt_key>\n</options>\n\n6. 数据迁移工具映射：该工具使用映射文件在 Magento 1 和 Magento 2 数据库之间执行自定义数据库映射。\n\
  \n## 迁移数据\n\n映射文件位于我们之前描述的相同目录中。在那里，我们将看到映射文件模板：\n\n![](img/de3034a92496a32462134266292a51dd_81_0.png)\n\
  \n`map.xml.dist` 文件将是您最常使用的文件。除此之外，Magento 还提供了一组附加的映射文件：\n\n+   - **通用：**\n+  \
  \   - `class-map.xml.dist`：Magento 1 和 Magento 2 之间的类映射\n+     - `config.xml.dist`：数据迁移工具的主要配置文件\n\
  +     - `datalog.xml.dist`：用于设置数据库例程的数据表列表\n+     - `settings.xml.dist`：用于 `core_config_data`\
  \ 表迁移的配置文件\n+   - **数据迁移工具中的 EAV 步骤：**\n+     - `map-eav.xml.dist`：映射文件\n+     -\
  \ `eav-attribute-groups.xml.dist`：属性列表\n+     - `eav-document-groups.xml.dist`：数据表列表\n\
  \n运行此命令只需几秒钟，您就可以将商店配置迁移到 Magento 2。\n\n+   8. **迁移其余数据：** 在此步骤中，您将迁移所有其他数据，例如客户、订单、产品等。\n\
  \n该命令与上一条命令非常相似：\n\n```\nphp bin/magento migrate:data <path to Data Migration Tool\
  \ configuration file>\n```\n\n最终要运行的命令是：\n\n```\nphp bin/magento migrate:data vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4/config.xml\n\
  ```\n\n此命令运行时间最长，会将 Magento 1 数据库中的所有数据映射到新数据库。\n\n+   9. **迁移更改：** 如果您没有将商店置于维护模式，则自上次迁移数据以来可能会有新注册的客户和新订单。幸运的是，数据迁移工具允许您将这些更改也迁移到新的\
  \ Magento 2 数据库。如果您将商店置于维护模式，则此步骤不是必需的，因为不会有任何新订单或客户。\n\n+   请注意，此步骤将迁移新客户和订单，但目录更改将不会被迁移。这就是为什么在决定继续迁移时，不要对目录进行更改很重要。\n\
  \n+   与之前的命令一样，我们将使用 Magento 命令行工具，并指定数据迁移工具配置文件的路径：\n\n```\nphp bin/magento migrate:delta\
  \ <path to Data Migration Tool configuration file>\n```\n\n最终要运行的命令是：\n\n```\nphp\
  \ bin/magento migrate:delta vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4/config.xml\n\
  ```\n\n增量迁移将实时映射 Magento 1 和 Magento 2 数据库之间的更改。您可以按 *Ctrl + C* 停止增量迁移。\n\n## 总结\n\
  \n在本章中，我们回顾了从 Magento 1 迁移到 Magento 2 的过程，包括为 Magento 2 准备自定义和第三方扩展，以及将数据库中的所有信息迁移到新版本的\
  \ Magento。在下一章中，我们将回顾在 Magento 2 中创建产品的过程。\n\n## 创建您的第一个产品、图像、库存和价格\n\n在本章中，您将向\
  \ Magento 2 添加您的第一个产品，这是 Magento 管理员最频繁的任务之一。\n\n我们将涵盖：\n\n+   - 向 Magento 目录添加产品\n\
  +   - 处理图像\n+   - 利用 Magento 的定价可能性\n\n### 添加您的第一个产品\n\n恭喜！您即将在 Magento 2 中添加您的第一个产品，这是\
  \ Magento 学习过程中的一大进步。\n\n## 产品基本信息\n\n首先，您应该使用用户名和密码登录到管理面板。登录后，您应该会在左侧边栏看到产品菜单项：\n\
  \n![](img/de3034a92496a32462134266292a51dd_86_0.png)\n\n您应该转到产品 | 目录子菜单项以打开目录网格。页面加载后，您将在屏幕右上角看到“添加产品”按钮：\n\
  \n![](img/de3034a92496a32462134266292a51dd_86_1.png)\n\n## 产品内容\n\n当您单击该按钮时，您将被重定向到**新产品**表单。您应该会在屏幕上看到以下表单：\n\
  \n![](img/de3034a92496a32462134266292a51dd_87_0.png)\n\n我们将逐一介绍该页面上的每个字段，以描述如何为您的新产品添加信息：\n\
  \n+   - 常规信息：\n+     - **启用产品**：这是产品的状态。\n+     - **属性集**：这是指分配给此产品的一组属性。我们将在下一章中详细介绍。\n\
  +     - **产品名称**：这是产品的名称。\n+     - **SKU**：这是产品的唯一标识符。\n+     - **价格**：这是产品的常规价格。\n\
  +     - **税类**：这是指与此产品关联的税务规则。\n+     - **数量**：这是产品库存中的商品数量。\n\n+   - **库存状态：**\
  \ 这是一个设置，用于将产品标记为**有货**或**缺货**。\n+   - **重量：** 这是产品的重量（如果适用）。\n+   - **可见性：** 这将产品标记为在目录和/或搜索中可见。\n\
  +   - **类别：** 这些设置与模块关联的类别。\n+   - **将产品设置为新品起始日期：** 这会在所选日期之间将产品标记为新。\n+   - **制造国：**\
  \ 这指定了产品的制造国家。\n\n+   - **内容：**\n+     - **描述：** 这是产品的描述。\n+     - **简短描述：** 这是产品描述的简短版本。\n\
  \n+   - **配置：**\n+     - **创建配置：** 这将创建可配置产品。这将在本书后面的章节中介绍。\n\n+   - **图像和视频：**\n\
  +     - **添加视频：** 这可用于为产品添加视频。\n+     - **浏览查找或拖拽图像到此处：** 这用于向产品添加多个图像。\n\n+   -\
  \ **搜索引擎优化：**\n+     - **URL 键：** 这指定了此产品的 URL。例如，如果您将 `sample-product` 指定为 URL\
  \ 键，则产品的 URL 将是 `http://magento2-playground.dev/sample-product.html`。\n+     - **Meta\
  \ 标题：** 这是产品的标题 meta 标签。这将是显示在谷歌等搜索引擎搜索结果中的标题。\n+     - **Meta 关键字：** 这些是产品的关键字\
  \ meta 标签。它们是搜索引擎将考虑用于产品详情页的关键字。\n\n\n\n\n- **元描述：** 这是产品的描述元标签。这将显示在搜索引擎结果中标题下方的描述。\n\
  \n- **相关产品、追加销售和交叉销售：**\n  - **相关产品：** 相关产品是一组基于客户当前查看的产品而可能想要购买的产品推荐。这些产品显示在产品详情页中，如以下截图所示：\n\
  \n    ![](img/de3034a92496a32462134266292a51dd_89_0.png)\n\n  - **追加销售产品：** 追加销售产品是来自同一产品系列中价格更高的产品。例如，如果客户正在查看显示器，追加销售会在产品详情页中推荐更昂贵的显示器。追加销售与当前产品相关联，并显示在产品详情页中，如下所示：\n\
  \n    ![](img/de3034a92496a32462134266292a51dd_90_0.png)\n\n  - **交叉销售产品：** 交叉销售显示在购物车页面中。交叉销售就像在超市排队结账时、下单前看到的那样。那时，你会看到超市放在那个特定位置的产品，试图说服你购买更多。与超市一样，Magento\
  \ 中的交叉销售产品旨在说服客户在下单前购买更多产品。交叉销售产品显示在购物车中，如下所示：\n\n    ![](img/de3034a92496a32462134266292a51dd_91_0.png)\n\
  \n- **可自定义选项：**\n  - **添加选项**：这为产品添加自定义选项。可自定义选项可以使用以下字段类型：\n    - 文本字段\n    - 文本区域\n\
  \    - 文件\n    - 下拉列表\n    - 单选按钮\n    - 复选框\n    - 多选\n    - 日期\n    - 日期和时间\n\
  \    - 时间\n\n- **产品所在网站：**\n  - **网站**：如果您的 Magento 商店有多个视图，您可以将产品设置为与特定视图关联。\n\n\
  - **设计：**\n  - **布局：** 用于设置产品详情页的特定布局：\n    - **空**\n    - **1 列**\n    - **2 列，带左侧栏**\n\
  \    - **2 列，带右侧栏**\n    - **3 列**\n  - **产品选项显示位置：** 设置产品选项的特定位置：\n    - **产品信息列**\n\
  \    - **信息列后的块**\n  - **布局更新 XML：** 为产品布局添加自定义 XML 配置，例如产品详情页的自定义样式表。\n  - **计划设计更新：**\n\
  \    - **计划设计从 – 至：** 这是在特定日期范围内应用的计划自定义设计。\n    - **新主题：** 在计划日期为产品详情页设置特定主题。\n\
  \    - **新布局：** 在计划日期为产品详情页设置特定布局：\n      - **空**\n      - **1 列**\n      - **2\
  \ 列，带左侧栏**\n      - **2 列，带右侧栏**\n      - **3 列**\n  - **礼品选项：**\n    - **允许礼品留言：**\
  \ 允许客户在此产品上设置礼品留言。\n\n- **可下载信息：**\n  - **这是可下载产品吗？：** 仅当产品的重量属性已设置为**该商品无重量**时，此选项才可用。如果产品是可下载产品，您可以添加链接和示例。\n\
  \n既然我们已经查看了**新产品**页面的所有字段，接下来我们将创建第一个产品。\n\n我们将使用以下信息创建一个简单产品：\n\n## 基本信息：\n\n-\
  \ **启用产品：** 是\n- **属性集：** 默认\n- **产品名称：** `Red Shirt`\n- **SKU：** `Red-shirt`\n\
  - **价格：** `$50.00`\n- **税类：** 应税商品\n- **数量：** `100`\n- **库存状态：** 有货\n- **重量：** `25\
  \ lbs`\n- **可见性：** 目录，搜索\n- **类别：** 默认类别 | 男装 | 上衣\n\n## 内容：\n\n- **描述：** 这是产品的长描述。\n\
  - **简短描述：** 这是产品的简短描述。\n- **图片和视频：**\n  - 为此产品上传两张图片。\n\n为产品填写完这些信息后，点击**保存**。您将在屏幕上看到以下消息：\n\
  \n![](img/de3034a92496a32462134266292a51dd_94_0.png)\n\n现在，是时候在网站上查看我们的产品了。\n\n\
  首先，访问主页：http://magento2-playground.dev/。\n\n接下来，转到“男装 | 上衣”类别（新产品已与该类别关联）。您将看到新产品位于网格中的第一位：\n\
  \n![](img/de3034a92496a32462134266292a51dd_95_0.png)\n\n如果您点击该产品，您将被重定向到产品详情页。在那里，您将看到我们在新产品表单中添加到产品的所有信息：\n\
  \n![](img/de3034a92496a32462134266292a51dd_95_1.png)\n\n## 处理图片\n\n在上一节中，您在 Magento\
  \ 2 中创建了第一个产品。您可能想知道如何为产品列表页、产品详情页和购物车分配不同的图片。Magento 2 提供了为这些位置分别指定不同图片的功能，我们将在本节中介绍这一概念。\n\
  \n如果您返回并打开您在管理面板中创建的产品，您将看到类似以下截图的内容：\n\n![](img/de3034a92496a32462134266292a51dd_96_0.png)\n\
  \n在每个图片缩略图的顶部，您会看到两个图标：\n\n- **缩略图左上角的八个点：** 您可以直接拖放缩略图来设置产品详情页图片的顺序。\n- **缩略图左下角的垃圾桶图标：**\
  \ 您可以点击此图标移除图片。\n\n在每个图片缩略图下方，您会看到以下内容：\n\n- 图片的一般信息，例如图片大小和分辨率。\n- 指示图片位置的标签。这些标签可以包括：\n\
  \  - **基础**\n  - **小图**\n  - **缩略图**\n  - **色板**\n\n现在，让我们逐一了解这些位置的含义：\n\n- **基础图片：**\
  \ 基础图片作为产品详情页上的主图片显示。如果上传的图片大于图片容器，则启用缩放功能。\n- **小图片：** 小图片用于多个位置，包括产品列表页、搜索结果页、相关产品和追加销售块。\n\
  - **缩略图：** 缩略图显示在购物车页面和交叉销售块中。\n- **色板：** 色板图片是代表产品颜色、纹理或图案的示例图片。\n\n如果您点击图片缩略图，**图片详情模态框**将从左侧出现，并显示该图片的配置，如以下截图所示：\n\
  \n![](img/de3034a92496a32462134266292a51dd_97_0.png)\n\n在**图片详情模态框**中，您可以更新以下图片配置：\n\
  \n- **替代文本**：替代文本是推荐用于 SEO 的属性。它有助于搜索引擎理解图片的内容。此外，**替代文本**会在鼠标悬停时以弹出框的形式显示在浏览器中。\n\
  - **角色**：您可以将图片与之前描述的特定角色关联，例如**基础**、**小图**、**缩略图**和**色板**。\n- **图片的一般信息**：这指的是**图片大小**和**图片分辨率**。\n\
  - **从产品页面隐藏**：您可以标记此图片以使其不显示在产品详情页上。\n\n## 使用 Magento 的定价功能\n\n您可能已经在**新产品**页面上看到了**高级定价**链接。如果没有，您可以在**价格**字段正下方看到该链接：\n\
  \n![](img/de3034a92496a32462134266292a51dd_98_0.png)\n\n\n\n\n\n## 创建您的第一个产品、图像、库存和价格\n\
  \n如果您点击该链接，**高级定价** 模型将显示在屏幕上，允许您为产品设置高级定价规则：\n\n![](img/de3034a92496a32462134266292a51dd_99_0.png)\n\
  \n![](img/de3034a92496a32462134266292a51dd_103_0.png)\n\n这是在产品详情页中的显示效果：\n\n![](img/de3034a92496a32462134266292a51dd_103_1.png)\n\
  \n- **成本：** 这是代表产品成本的管理员信息。\n- **阶梯价格：** 这是根据网站、客户组和购买数量而定的产品折扣价。\n- **厂商建议零售价：**\
  \ 这是产品的最低广告价格。\n- **显示实际价格：** 通过此选项，您可以选择应显示 **厂商建议零售价 (MSRP)** 的位置：\n  - **On Gesture：**\
  \ 选择此选项时，MSRP 会在产品列表页和产品详情页中显示。此外，MSRP 价格旁边会添加一个 **Click for price** 链接，点击后会打开一个包含产品价格更多信息的弹出层。这是在产品列表页中\
  \ **On Gesture** 选项的显示效果：\n\n![](img/de3034a92496a32462134266292a51dd_101_0.png)\n\
  \n- **Before Order Confirmation**：最终价格在结账的最后一步显示。MSRP 和一条消息会在产品列表、产品详情和 **Shopping\
  \ Cart** 页面中显示，以通知客户结账时的价格信息。以下是 MSRP 和消息在产品列表页中的显示方式：\n\n![](img/de3034a92496a32462134266292a51dd_104_0.png)\n\
  \n这是在产品详情页中的显示效果：\n\n![](img/de3034a92496a32462134266292a51dd_105_0.png)\n\n这里可以看到购物车页面：\n\
  \n![](img/de3034a92496a32462134266292a51dd_105_1.png)\n\n## 总结\n\n在本章中，我们学习了如何添加新产品，包括设置高级定价选项和产品图片。\n\
  \n在下一章中，我们将介绍属性和属性集，以向您的产品添加更多信息。\n\n**Product** 属性是目录的核心部分。尽管您可以管理属性，但不能删除 Magento\
  \ 默认包含的系统属性。为了查看系统属性列表，您应该通过 **System: Yes** 过滤网格，如以下屏幕截图所示：\n\n![](img/de3034a92496a32462134266292a51dd_109_0.png)\n\
  \n如您所见，Magento 中有 43 个系统属性。您必须熟悉其中大部分，因为这些属性是我们在上一章中回顾的 **New Product** 表单字段的一部分。\n\
  \n## 创建产品属性\n\n您可以在 Magento 中创建自定义产品属性，以向目录中的产品添加自定义信息。您可以通过以下步骤查看 **New Product\
  \ Attribute** 表单：\n\n1. 在 **Product** 属性网格的右上角点击 **Add New Attribute**。\n2. 您将在屏幕上看到以下表单：\n\
  \n![](img/de3034a92496a32462134266292a51dd_110_0.png)\n\n我们将逐一介绍表单上的每个字段：\n\n- **Properties\
  \ | Attribute Properties:**\n  - **Default Label**：这是数据录入时描述新属性的标签。\n  - **Catalog\
  \ Input Type for Store Owner**：这为 **Product** 属性设置数据类型和输入控件。需要说明的是，一旦属性类型创建后，就无法更改。以下选项可用：\n\
  \    - **Text Field**\n    - **Text Area**\n    - **Date**\n    - **Yes/No**\n \
  \   - **Multiple Select**\n    - **Dropdown**\n    - **Price**\n    - **Media Image**\n\
  \    - **Fixed Product Tax**\n    - **Visual Swatch**\n    - **Text Swatch**\n \
  \ - **Values Required**：这定义了 **Product** 属性的值是否为必填。\n- **Properties | Advanced attribute\
  \ properties:**\n  - **Attribute Code**：这为 **Product** 属性指定内部使用的唯一标识符。代码仅允许字母 (a-z)、数字\
  \ (0-9) 和下划线，且第一个字符应为字母。代码必须少于三十个字符且不能包含空格。\n  - **Scope**：这定义属性是否可以在全局、网站或商店视图级别进行自定义。\n\
  \  - **Default Value**：这是数据录入时为属性声明的默认值。\n  - **Unique Value**：这设置此 **Product**\
  \ 属性的值是否在作用域设置范围内唯一。例如，SKU 是一个系统属性，必须具有唯一的值来标识每个产品。\n  - **Input Validation for\
  \ Store Owner**：这在从管理面板创建产品时为属性值设置验证。\n\n## 属性集和自定义属性\n\n- **Add to Column Options：**\
  \ 这将属性包含在产品网格的列选项列表中。\n- **Use in Filter Options：** 这将属性包含在产品网格的过滤器选项列表中。\n- **Manage\
  \ Labels:**\n  - **Manage Titles (Size, Color, etc.)：** 这按商店视图自定义 **Product** 属性的标签。例如，如果您有三种不同语言的商店视图，您可以为每个商店视图翻译标签。\n\
  - **Storefront Properties:**\n  - **Use in Search：** 如果为 Yes，则属性将包含在搜索查询中，客户将能够根据属性值在目录中进行搜索：\n\
  \    - **Search Weight：** 如果 Use in Search 设置为 Yes，则此字段将显示。您可以通过设置 1 到 10 之间的数字来设置搜索查询的优先级，其中\
  \ 10 优先级最高。\n    - **Visible in Advanced Search：** 如果 Use in Search 设置为 Yes，则您可以指定\
  \ **Product** 属性是否应包含在 **Advanced Search** 表单中。\n\n![](img/de3034a92496a32462134266292a51dd_112_0.png)\n\
  \n注意：在 Magento 搜索中包含太多属性可能会降低搜索性能。\n\n- **Comparable on Storefront：** 在 **Compare\
  \ Products** 页面中包含 **Product** 属性。\n- **Use in Layered Navigation：** 如果属性类型为 Dropdown、Multiple\
  \ Select 或 Price，您可以将属性添加到产品列表页的分层导航（左侧边栏）中。\n- **Use in Search Results Layered\
  \ Navigation：** 如果属性类型为 Dropdown、Multiple Select 或 Price，您可以将属性添加到搜索结果页的分层导航（左侧边栏）中。\n\
  \n![](img/de3034a92496a32462134266292a51dd_113_0.png)\n\n> 注意：在 Magento 分层导航中包含太多属性可能会降低产品列表页和搜索结果页的性能。\n\
  \n- **Position：** 这设置属性在分层导航中的位置，相对于该区块中的其他属性。\n- **Use for Promo Rule Conditions：**\
  \ 这将属性添加到促销规则可用条件列表中。\n- **Allow HTML Tags on Storefront：** 这用于定义属性值是否可以包含用于格式化的\
  \ HTML。\n- **Visible on Catalog Pages on Storefront：** 这将 **Product** 属性包含在产品详情页的\
  \ **Additional Information** 标签中。此配置仅适用于简单产品和虚拟产品。\n- **Used in Product Listing：**\
  \ 这将属性包含在产品列表页中。此属性配置取决于主题。\n- **Used for Sorting in Product Listing：** 这将属性包含在产品列表页的\
  \ **Sort By** 选项中。此属性配置取决于主题。\n\n现在我们回顾了 **New Product Attribute** 表单，我们准备为上一章中创建的产品创建一个自定义属性。\n\
  \n我们将为之前创建的 **Red Shirt** 创建一个新的产品属性——**Sleeve Length**。\n\n在 **New Product Attribute**\
  \ 表单中为该属性设置以下信息：\n\n- **Properties | Attribute Properties:**\n  - **Default Label:**\
  \ `Sleeve Length`\n  - **Catalog Input Type for Store Owner:** Dropdown\n  - **Values\
  \ Required:** No\n\n\n\n\n\n- **管理选项（属性的值）**：在 **管理选项（属性的值）** 情况下，由于该属性的输入类型为 **下拉列表**，我们必须指定选项，如以下屏幕截图所示：\n\
  \n![](img/de3034a92496a32462134266292a51dd_114_0.png)\n\n- **属性 | 高级属性属性：**\n  -\
  \ **属性代码：** `sleeve_length`\n  - **作用域：** Store View\n  - **唯一值：** 否\n  - **添加到列选项：**\
  \ 是\n  - **用于筛选选项：** 是\n\n- **管理标签：**\n  - **管理标题（尺寸、颜色等） | 默认 Store View：** `Sleeve\
  \ Length`\n\n- **Storefront 属性：**\n  - **用于搜索：** 是\n  - **搜索权重：** 10\n  - **在高级搜索中可见：**\
  \ 是\n  - **可在 Storefront 上比较：** 是\n  - **用于分层导航：** 可筛选（带结果）\n  - **用于搜索结果分层导航：**\
  \ 是\n  - **用于促销规则条件：** 是\n  - **Storefront 上允许 HTML 标签：** 是\n  - **在 Storefront\
  \ 的目录页面上可见：** 是\n  - **用于产品列表：** 是\n  - **用于产品列表排序：** 是\n\n当您为属性添加了所有信息后，应点击屏幕右上角的\
  \ **保存属性**。\n\n保存属性后，您将看到以下弹出窗口：\n\n![](img/de3034a92496a32462134266292a51dd_115_0.png)\n\
  \n该消息通知数据库需要重新索引。索引是 Magento 准备数据（如产品和属性）以提高商店性能的方式。当数据发生变化时，需要重新索引以更新数据库中的信息。\n\
  \n例如，当您更改产品的价格时，必须重新索引价格更改，以便在产品详情页中显示更新后的价格。如果不进行索引，Magento 将不得不即时计算每个产品的价格，包括高级价格规则、促销等的计算。\n\
  \n为了避免手动重新索引，您应设置 Magento cron 作业每分钟运行一次。由于我们未配置 cron 作业，因此应手动运行重新索引过程。\n\n要重新索引，您可以点击来自最新屏幕截图的弹出窗口上的\
  \ **索引器无效** 链接，或前往 **系统 | 工具 | 索引管理** 菜单项。\n\n在那里，您将看到索引器列表，您将看到需要重新索引的 **索引产品 EAV**\
  \ 索引器，如以下屏幕截图所示：\n\n![](img/de3034a92496a32462134266292a51dd_116_0.png)\n\n如果您的网站未运行\
  \ cron 作业，您可以从 Magento 命令行工具手动运行重新索引：\n\n1. 打开终端并进入项目文件夹。\n2. 运行以下命令：\n\n```bash\n\
  php bin/magento indexer:reindex\n```\n\n您将从命令中看到以下输出：\n\n![](img/de3034a92496a32462134266292a51dd_117_0.png)\n\
  \n如果您重新加载管理面板中的页面，您将看到索引器不再需要更新：\n\n![](img/de3034a92496a32462134266292a51dd_118_0.png)\n\
  \n### 属性集\n\n正如我们在前一节中看到的，您可以通过添加新属性为产品定义新属性。当您创建属性时，它不会立即在新建产品表单中可用。例如，我们创建的袖长属性在编辑红衬衫产品或任何其他产品时尚未可用。\n\
  \n属性按属性集分组。属性集代表与特定产品系列相关的属性列表。例如，**袖长** 属性应为 **衬衫** 属性集的一部分。因此，该特定服装属性仅对与 **衬衫**\
  \ 属性集关联的产品可用。\n\n如果您添加新属性并希望该属性对大多数产品可用，则可以将它与 **默认** 属性集关联。\n\n您可以通过进入管理面板的下一节，即\
  \ **商店 | 属性 | 属性集** 来查看属性集列表，如下所示：\n\n![](img/de3034a92496a32462134266292a51dd_119_0.png)\n\
  \n如果您点击 **默认** 属性集，您将打开编辑该属性集的表单：\n\n![](img/de3034a92496a32462134266292a51dd_120_0.png)\n\
  \n您将看到包含以下三个列的表单：\n\n- **编辑属性集名称：** 这会更新属性集的名称。\n- **组：** 这指定与此属性集关联的属性列表。这些属性包含在不同的组中以便于产品管理。\n\
  - **未分配属性：** 这是未与此属性集关联的属性列表。您可以将属性从此列表拖放到 **组** 列表中以将它们与属性集关联。\n\n我们将为第一章中创建的 **衬衫**\
  \ 创建第一个自定义属性集。\n\n返回到 **属性集** 网格并点击 **添加属性集**，您将能够找到以下内容：\n\n- **名称：** 在此处输入 `Shirt`\n\
  - **基于：** 您可以从现有属性集中选择将默认包含在新属性集中的属性。我们将选择 **默认** 属性集：\n\n![](img/de3034a92496a32462134266292a51dd_121_0.png)\n\
  \n如果未配置 cron，您将在屏幕上看到以下消息：\n\n![](img/de3034a92496a32462134266292a51dd_123_0.png)\n\
  \n正如我们之前看到的，我们应使用 Magento 命令行工具重新索引数据库：\n\n```bash\nphp bin/magento indexer:reindex\n\
  ```\n\n### 将属性集与产品关联\n\n现在我们有了包含新属性的新属性集，让我们继续将属性集与产品关联。\n\n1. 导航到目录页面，即 PRODUCTS\
  \ | Catalog。\n2. 选择我们在上一章中创建的红衬衫：\n\n   ![](img/de3034a92496a32462134266292a51dd_124_0.png)\n\
  \n3. 从 **属性集** 下拉列表中选择 **Shirt**：\n\n   ![](img/de3034a92496a32462134266292a51dd_125_0.png)\n\
  \n4. 您将在 **新建产品** 表单中看到新属性。请注意，属性将显示在您在前一节中将属性从 **未分配属性** 移动到 **组** 列时所选择的组中。从列表中选择\
  \ **短袖**：\n\n   ![](img/de3034a92496a32462134266292a51dd_126_0.png)\n\n5. 点击屏幕右上角的\
  \ **保存**。\n\n现在，产品已与新的属性集关联，并且包含我们在本章中创建的新属性。\n\n让我们看看它在产品详情页上的显示效果：\n\n![](img/de3034a92496a32462134266292a51dd_127_0.png)\n\
  \n现在，让我们检查属性是否也能在其他位置看到。\n\n### 比较产品页面：\n\n**比较产品** 页面如下显示该属性：\n\n![](img/de3034a92496a32462134266292a51dd_128_0.png)\n\
  \n以下是产品列表页面中分层导航的视图（左侧边栏）：\n\n![](img/de3034a92496a32462134266292a51dd_129_0.png)\n\
  \n请看以下在搜索结果页面中分层导航的视图（左侧边栏）：\n\n![](img/de3034a92496a32462134266292a51dd_129_1.png)\n\
  \n以下屏幕截图显示了产品列表页面中的排序方式下拉菜单：\n\n![](img/de3034a92496a32462134266292a51dd_130_0.png)\n\
  \n高级搜索表单（http://magento2-playground.dev/catalogsearch/advanced/）如下：\n\n![](img/de3034a92496a32462134266292a51dd_131_0.png)\n\
  \n以下屏幕截图显示了管理面板中的促销规则条件：\n\n![](img/de3034a92496a32462134266292a51dd_131_1.png)\n\
  \n\n\n\n\n## 摘要\n\n在本章中，我们创建了一个属性和一个属性集，并将该属性集与产品关联。现在你可以通过属性添加新特性并通过属性集对它们进行分组来自定义产品。在下一章中，我们将介绍\
  \ Magento 中的不同产品类型和产品关系。\n"
- "# 6 产品类型\n\n本章我们将介绍以下部分：\n\n- Magento 中不同产品类型的介绍\n- 简单产品\n- 可配置产品\n- 组合产品\n- 虚拟产品\n\
  - 捆绑产品\n- 可下载产品\n\n## Magento 中不同产品类型的介绍\n\nMagento 最重要的功能之一就是产品类型。不同的产品类型允许你以不同的方式设置产品，例如，在产品详情页中提供一组产品，或允许客户购买可下载产品。\n\
  \nMagento 中有六种产品类型：\n\n- 简单产品\n- 可配置产品\n- 组合产品\n- 虚拟产品\n- 捆绑产品\n- 可下载产品\n\n你可以通过以下步骤查看列表：\n\
  \n1. 在管理面板中进入以下部分：\n   **Products | Inventory | Catalog**\n2. 点击屏幕右上角 **Add Product**\
  \ 按钮内的箭头：\n\n   ![](img/de3034a92496a32462134266292a51dd_134_0.png)\n\n需要提到的是，Magento\
  \ 可以根据产品信息设置正确的产品类型。例如，如果你添加一个没有重量的新产品，Magento 将创建一个虚拟产品。\n\n你将看到我们在上一步中包含的新属性：\n\
  \n![](img/de3034a92496a32462134266292a51dd_137_0.png)\n\n3. 我们将按如下方式更新产品信息：\n\n\
  - Product Name: Red Shirt - Men - L\n- Color: Red\n- Size: L\n- Gender: Men\n\n\
  4. 接下来，点击保存，然后像我们在前几节中看到的那样重新索引目录。\n\n如果我们返回 Storefront 并打开 Red Shirt 产品的产品详情页，我们将看到更新后的产品显示了该简单产品所需的所有信息：\n\
  \n![](img/de3034a92496a32462134266292a51dd_138_0.png)\n\n## 可配置产品\n\n现在，假设你有不同尺寸和颜色的衬衫。如果将它们全部添加为简单产品并在目录中显示，结果将在产品列表页中出现几件看起来完全相同的红衬衫。找到所需的衬衫会很困难，而且在视觉上会令人困惑。\n\
  \n幸运的是，Magento 允许你创建可在产品详情页中配置的产品。在我们的示例中，你将拥有一个衬衫产品，可以从产品详情页中选择颜色和尺寸等多个选项。\n\n\
  这就是可配置产品的概念。可配置产品由关联的简单产品组成。当客户在可配置产品中选择一种组合时，客户实际上是从可配置产品页面中选择哪个简单产品将被添加到购物车。\n\
  \n让我们创建第一个可配置产品：Shirt。为此，我们将遵循以下步骤：\n\n1. 进入 PRODUCTS | Inventory | Catalog 页面并选择\
  \ Red Shirt。\n2. 点击 Add Product 按钮内的箭头，并选择 Configurable Product。\n\n   ![](img/de3034a92496a32462134266292a51dd_139_0.png)\n\
  \n3. 为可配置产品设置以下信息：\n\n   **General Information:**\n\n   - Enable Product: Yes\n\
  \   - Attribute Set: Shirt\n   - Product Name: Shirt\n   - SKU: shirt\n   - Price:\
  \ $50\n   - Tax Class: Taxable Goods\n   - Quantity: 100\n   - Stock Status: In\
  \ Stock\n   - Weight: 1 lbs.\n   - **Visibility:** Catalog, Search\n   - **Categories:**\
  \ Default Category | Men | Tops\n   - **Sleeve Length:** None\n   - **Color:** None\n\
  \   - **Size:** None\n   - **Gender:** None\n\n   **Configurations:**\n\n   - **Create\
  \ Configurations:** 点击此按钮以打开 **Create Product Configurations** 窗口，如以下屏幕截图所示：\n\n\
