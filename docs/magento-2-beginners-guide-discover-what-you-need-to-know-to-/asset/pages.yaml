- pgno: 44
  md: '# How to choose the right hosting provider


    Magento is a big platform with a huge community that provides all the services
    that you need, from design and development to hosting for the store.


    The advantage when there is a big community behind a product is that you get specialized
    professionals who can help resolve your problems.


    It is an advantage that you can use to ensure that your Magento store is always
    in good shape and that you are ready to resolve emergencies, if necessary.


    That being said, it’s really important to choose the right server for the Magento
    store. There are two types of servers that hosting providers offer:


    +   - Managed servers

    +   - Self-managed server


    # Managed servers


    Managed servers are managed by the hosting provider. This means that the hosting
    provider is in charge of keeping the server up and running.


    If there is any problem related to the server, you can create a ticket on the
    helpdesk of the hosting provider.


    When you choose this type of server, you should find a good hosting provider with
    extensive knowledge and experience of Magento. This is essential to ensure that
    the hosting provider will be able to investigate and review the Magento instance
    when an emergency occurs.


    Here is a list of recommended managed servers for Magento:


    +   - Nexcess: https://www.nexcess.net/magento/hosting

    +   - MageMojo: https://magemojo.com/

    +   - Rackspace: https://www.rackspace.com/digital/magento'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Self-managed servers


    We have the self-managed servers; when you choose this type of server, the configuration,
    upgrades, and monitoring are the responsibilities of the user.


    This is the best option for advanced users or merchants who have their own system
    administrator. You have total control of the server, which is really important
    when it comes to managing a Magento store. At the same time, you are in charge
    of resolving emergencies if the server is down or if there are other kinds of
    problems related to the server.


    When you choose this type of server, you should have knowledge of server administration
    or find a really good system administrator who can handle emergencies and configure
    the server properly.


    Here is a list of recommended self-managed servers for Magento:


    +   - Amazon EC2: https://aws.amazon.com/ec2/

    +   - DigitalOcean: https://www.digitalocean.com/

    +   - Linode: https://www.linode.com/


