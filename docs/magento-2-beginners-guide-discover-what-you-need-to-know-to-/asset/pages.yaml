  md: '+   - **CATALOG:**

    +     - Catalog

    +     - Inventory

    +     - XML Sitemap

    +     - RSS Feeds

    +     - Email to a friend

    +   - **CUSTOMERS:**

    +     - Newsletter

    +     - Customer Configuration

    +     - Wish List

    +     - Promotions

    +     - Persistent Shopping Cart

    +   - **SALES:**

    +     - Sales

    +     - Sales Emails

    +     - PDF Print-outs

