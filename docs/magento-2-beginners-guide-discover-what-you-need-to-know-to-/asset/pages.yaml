- pgno: 299
  md: '5. Click on the Request API signature link and click on Agree and Submit:


    ![](img/de3034a92496a32462134266292a51dd_299_0.png)


    Now that you have the credentials, copy and paste that information in the PayPal
    Express Checkout form in Magento.


    In addition to that, you will see the basic and advanced settings to configure
    at the end of the PayPal Express Checkout section:


    You will see the following fields for the Basic Settings form:


    +   - **Title**: You can customize the title that will be displayed for this payment
    method in the Storefront.

    +   - **Sort Order**: You can set the specific order in the list of payment methods
    on the Storefront, 0 being the payment method that would be displayed at the top
