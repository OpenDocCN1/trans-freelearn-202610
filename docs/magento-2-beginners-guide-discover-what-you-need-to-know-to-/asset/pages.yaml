- pgno: 289
  md: '# 15


    # Processing Payments


    In this chapter, we will cover the following topics:


    +   - Default Magento payment methods

    +   - Setting up PayPal

    +   - PCI compliance


    # Default Magento payment methods


    Magento includes several payment methods by default:


    +   - PayPal

    +   - Braintree

    +   - Check or money order

    +   - Bank transfer payment

    +   - Cash on delivery payment

    +   - Zero subtotal checkout

    +   - Purchase order

    +   - Authorize.net direct post'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'You can see the configuration for those payment methods on the System Configuration
    page (STORES | Configuration) in the SALES | Payment Methods section:


    ![](img/de3034a92496a32462134266292a51dd_290_0.png)


    Here, you can see that Magento recommends the following payment solutions:


    +   - PayPal Express Checkout

    +   - Braintree'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'However, in the **Recommended Solutions** section, you will see that there
