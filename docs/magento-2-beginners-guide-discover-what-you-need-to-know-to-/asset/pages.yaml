- pgno: 346
  md: '# 18


    # Transactional E-mails and Newsletter


    In this chapter, we will cover the following topics:


    +   - Modifying transactional e-mail templates

    +   - Modifying newsletter templates

    +   - Handling newsletters and their subscribers


    # Modifying transactional e-mail templates


    Magento provides all the transactional e-mail templates that you need to launch
    your e-commerce store. A transactional e-mail is an e-mail that is automatically
    sent to the customer by Magento when a specific action occurs in your store, for
    example, when a user creates a customer account or when a new order is placed.


    You can modify the default transactional e-mails that are included in Magento
    2 from the **MARKETING | Communications | Email Templates** page in the admin
    panel.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'If you open the page for the first time, you will see that the grid is empty:


    ![](img/de3034a92496a32462134266292a51dd_347_0.png)


    Only the transactional e-mails that have been modified by the administrator will
    be displayed on the Email Templates grid. You can modify or add a transactional
    e-mail template by clicking on the Add New Template button.'
  merge: -1
  img_proc: true
