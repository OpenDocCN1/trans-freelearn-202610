- pgno: 383
  md: '# Customizing Your Magento Store


    From there, you can specify whether the translation will be specific to the current
    store view, and then you can set the custom text. In the example below, we replaced
    `Create an Account` with **Register**.


    ![](img/de3034a92496a32462134266292a51dd_383_0.png)


    Now, consider that the inline translation tool has been enabled without restrictions.
    This means that anybody who has access to the website can see the tool, and they
