- pgno: 366
  md: '# Reports


    If you confirm the update, the data for your report will be up to date and the
    **Updated** date in the grid will show the time that the reports were updated
    at:


    ![](img/de3034a92496a32462134266292a51dd_366_0.png)


    Let''s review each of the reports:


    +   - **Marketing | Products in Carts:** The first report in the marketing group
    is the **Products in Carts** report. As the name suggests, you can see the products
    that are currently in customers'' shopping carts on the storefront or in pending
    orders in the admin panel.

    +   - **Marketing | Search Terms:** The second report in the marketing group is
    the **Search Terms** report, which allows you to see the most popular search queries
    in your Magento store.

    +   - **Marketing | Abandoned Carts:** The next report allows you to see the abandoned
    carts from your customers, which is really important in order to contact those
    customers again to motivate them to complete their order.'
  merge: -1
