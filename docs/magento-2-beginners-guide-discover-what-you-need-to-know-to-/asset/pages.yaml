- pgno: 224
  md: '# GENERAL | General


    You can update the following settings from this section:


    +   - **Country Options:**

    +     - **Default Country**: This is the country where your business is located

    +     - **Allow Countries**: You can select the countries from where you accept
    orders

    +     - **Zip/Postal Code is Optional for**: You can specify the countries that
    don''t need ZIP/postal code information

    +     - **European Union Countries**: You can select the countries in the EU where
    you conduct business

    +     - **Top destinations**: You can define specific countries to be displayed
    at the top of the Country dropdown in the Storefront. Based on this setting, the
    drop-down menu will include the top countries, as can be seen in the following
    screenshot:


    ![](img/de3034a92496a32462134266292a51dd_224_0.png)'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# System Configuration


    +   - **State Options:**

    +     - **State is Required For:** You can specify the countries that don''t need
    state information

    +     - **Allow to Choose State if It is Optional for Country:** If this setting
    is set to **Yes**, the state will be included as an optional field in the Storefront.
    If this setting is set to **No**, then the field won''t be displayed in the Storefront.

    +   - **Locale Options:**

    +     - **Timezone:** Selects your timezone

    +     - **Locale:** Selects the language for the store

    +     - **Weight Unit:** Sets the weight unit for the store (lbs or kgs)

    +     - **First Day of Week:** Selects the day that is considered the first day
    of the week in your location

    +     - **Weekend Days:** Selects the days that are considered weekend days in
    your location

    +   - **Store Information:** General information of your business, including:

    +     - **Store Name**

    +     - **Store Phone Number**

    +     - **Store Hours of Operation**

    +     - **Country**

    +     - **Region/State**

    +     - **ZIP/Postal Code**

    +     - **City**

    +     - **Street Address**

    +     - **Street Address Line 2**

    +     - **VAT Number**

    +   - **Single-Store Mode:**

    +     - **Enable Single-Store Mode:** You can set this setting to **Yes** to simplify
    the display of the pages by turning off all store views and scope indicators'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# GENERAL | Web


    +   - **Url Options:**

    +     - **Add Store Code to Urls**: If you set this setting to **Yes**, then the
    store URL will include the store code, for example,

    +       `http://www.magento2-playground.dev/[store-code]/url-key`

    +     - **Auto-redirect to Base URL**: Redirect to the base URL when the requested
    URL is different, for example, redirect from

    +       `http://magento2-playground.dev/store/` to

    +       `http://www.magento2-playground.com/store/`

    +   - **Search Engine Optimization:**

    +     - **Use Web Server Rewrites**: When this setting is disabled, the URL includes
    `index.php` after the base URL, for example,

    +       `http://magento2-playground.dev/index.php/url-key.`

    +       When the setting is enabled, the URL doesn''t include `index.php` after
    the base URL.

    +   - **Base URLs:**

    +     - **Base URL**: Set the unsecure base URL, for example,

    +       `http://magento2-plaground.dev/`

    +     - **Base Link URL**: Set the placeholder that is used to create relative
    links to the unsecure base URL

    +     - **Base URL for Static View Files**: This is an optional field to set an
    alternative location for static view files

    +     - **Base URL for User Media Files**: This is an optional field to set an
    alternative location for user media files

    +     - **Base URLs (Secure):**

    +       - **Secure Base URL**: Set the secure base URL, for example, `https://magento2-plaground.dev/`

    +       - **Secure Base Link URL**: Set the placeholder that is used to create
    relative links to the secure base URL

    +       - **Secure Base URL for Static View Files**: This is an optional field
    to set an alternative location for static view files'
  merge: -1
  img_proc: true
- pgno: 227
  md: '+   - **Secure Base URL for User Media Files**: This is an optional field to
    set an alternative location for user media files

    +   - **Use Secure URLs on Storefront**: Enable this setting to serve all the
    pages on the Storefront over HTTPS

    +   - **Use Secure URLs in Admin**: Enable this setting to serve all the pages
    on the Storefront over HTTPS

    +   - **Offloader header**: Set the SSL offloader header value


    +   - **Default Pages:**

    +     - **Default Web URL**: Relative path to the folder in the Magento instance
    that contains the landing page

    +     - **CMS Home Page**: Set the CMS page that will be displayed for the home
    page

    +     - **Default No-route URL**: Relative path to the folder in the Magento instance
    where the page is redirected when a 404 error occurs

    +     - **CMS No Route Page**: Set the CMS page that will be displayed for the
    404 error page

    +     - **CMS No Cookies Page**: Set the CMS page that will be displayed when
    the cookies are disabled in the browser

    +     - **Show Breadcrumbs for CMS Pages**: Specify whether breadcrumbs should
    be displayed for CMS pages


    # GENERAL | Currency Setup


    +   - **Currency Options:**

    +     - **Base Currency**: Set the primary currency for store transactions

    +     - **Default Display Currency**: Set the currency to be displayed in product
    prices on the Storefront

    +     - **Allowed Currencies**: Set the accepted currencies for store transactions'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# GENERAL | Store Email Addresses


    +   - General Contact / Sales Representative / Customer Support / Custom Email
    1 / Custom Email 2:

