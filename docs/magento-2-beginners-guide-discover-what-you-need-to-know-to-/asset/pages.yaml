- pgno: 143
  md: '# Create Product Configurations


    # Step 3: Bulk Images, Price and Quantity


    Based on your selections 16 new products will be created. Use this step to customize
    images and price for your new products.


    # Images


    +   - Apply single set of images to all SKUs

    +   - Apply unique images by attribute to each SKU

    +   - Skip image uploading at this time


    # Price


    +   - Apply single price to all SKUs

    +   - Apply unique prices by attribute to each SKU

    +   - Skip price at this time


    # Quantity


    +   - Apply single quantity to each SKUs

    +   - Apply unique quantity by attribute to each SKU

    +   - Skip quantity at this time


    You can choose from the following options:


    # Images:


    +   - **Apply a single set of images to all SKUs**: If you select this option,
    you will be able to upload a set of images that will be applied to all the product
    combinations.

    +   - **Apply unique images by attribute to each SKU**: By selecting this option,
    you will be able to select one of the configurable attributes, and then upload
    an image for each attribute value. For example, we can select Color, and then
    upload the image for each color of the product.

    +   - **Skip image uploading at this time**: You can skip this step and upload
    the images later.'
  merge: -1
  img_proc: true
