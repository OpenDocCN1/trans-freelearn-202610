- pgno: 168
  md: '# Product Types


    Here is the product details page:


    ![](img/de3034a92496a32462134266292a51dd_168_0.png)


    # Downloadable Product


    A **Downloadable Product** is a digital file that can be sent to a downloadable
    file, for example, e-books, software, music videos, and so on.


    Since the downloadable file is not available before purchase, you can add samples
    to the product details page, such as the introduction for the e-book, a trial
    version for the software, or a short clip for the music video.


    Let''s create a **Downloadable Product** by following these steps:


    +   1. Go to the **Products | Inventory | Catalog** page.

    +   2. Click on the arrow inside the **Add Product** button and select **Downloadable
    Product**.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'As you can see in the following screenshot, the downloadable product form has
    a special section named Downloadable Information:


