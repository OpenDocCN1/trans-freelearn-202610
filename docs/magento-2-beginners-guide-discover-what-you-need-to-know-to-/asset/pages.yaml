    As you can see on the page, you can add any number of items from each of the products.
    If you add some of these products to the cart, they will be individually displayed
    there.


    # Bundle Product


    A **Bundle Product** is very similar to a **Grouped Product**; the only difference
    is that the customer can choose the products to include into the bundle. The final
    price will depend on the options that have been chosen.


    A very good example of **Bundle Product** is a computer. The customer will be
    able to choose which components to include in the computer; for example, the customer
    will be able to select between 8 GB and 16 GB for memory or between 256 GB and
    512 GB for SSD storage. The price of the product will be updated at the time of
    the selection, depending on the selection.'
  merge: -1
  img_proc: true
