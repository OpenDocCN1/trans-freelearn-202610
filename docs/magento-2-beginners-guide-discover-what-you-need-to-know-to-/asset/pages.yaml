- pgno: 360
  md: '# 19

    Reports


    We will cover the following concepts in this chapter:


    +   - Marketing reports

    +   - Sales reports

    +   - Customer reports

    +   - Product reports


    # Magento reports


    As a store owner and administrator, one of your key activities is tracking the
    activity and conversion rates of your Magento store. Magento includes several
    reports that you can review on a regular basis to always have the ability to take
    a look at the statistics of the store.'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'All reports can be accessed from the same menu item in the Magento admin panel:
    Reports


    ![](img/de3034a92496a32462134266292a51dd_361_0.png)


    As you can see in the preceding image, Magento includes 22 reports divided into
    5 groups, as follows:


    +   - Marketing:

    +     - Products in Cart

    +     - Search Terms

    +     - Abandoned Carts

    +     - Newsletter Problem Reports'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# Reports


    +   - **Reviews:**

    +     - By Customers

    +     - By Products

    +   - **Sales:**

    +     - Orders

    +     - Tax

    +     - Invoiced

    +     - Shipping

    +     - Refunds

    +     - Coupons

    +     - PayPal Settlement

    +     - Braintree Settlement

    +   - **Customers:**

    +     - Order Total

    +     - Order Count

    +     - New

    +   - **Products:**

    +     - Views

    +     - Bestsellers

    +     - Low Stock

    +     - Ordered

    +     - Downloads


    In addition to that, you will see an additional menu item at the end of the list:
    **Refresh Statistics.**


    To optimize performance, Magento calculates and stores the information for each
    of the reports instead of calculating everything on the fly. In order to see the
    most recent information in your reports, you should refresh the statistics from
    that page in the Magento admin panel.'
  merge: -1
  img_proc: true
