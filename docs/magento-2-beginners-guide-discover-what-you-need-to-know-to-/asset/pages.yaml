    +   2. Click on the arrow inside the Add Product button, and select Configurable
    Product.


    ![](img/de3034a92496a32462134266292a51dd_139_0.png)


    3. Set the following information for the configurable product:


    # General Information:


    +   - Enable Product: Yes

    +   - Attribute Set: Shirt

    +   - Product Name: Shirt

    +   - SKU: shirt

    +   - Price: $50

    +   - Tax Class: Taxable Goods

    +   - Quantity: 100

    +   - Stock Status: In Stock

    +   - Weight: 1 lbs.'
  merge: -1
  img_proc: true
