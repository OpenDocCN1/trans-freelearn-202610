- pgno: 305
  md: '# Flat Rate


    Let''s start by reviewing **Flat Rate**. If you expand this section, you will
    see the following form:


    ![](img/de3034a92496a32462134266292a51dd_305_0.png)


    This is a predefined charge that will be applied to the orders in your store.
    The amount defined as the cost for shipping is fixed and depends on the configuration
    that you set from the admin panel.


    In order to configure the method, you should update the following fields:


    +   - **Enabled:** Specify whether **Flat Rate** should be available as a shipping
    method on the Storefront.

    +   - **Title:** A descriptive title for the shipping method.

    +   - **Method Name:** This is the label that is displayed next to the rate on
    the Storefront.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '+   - **Type**: This is the calculation that is done by Magento to set the
    rate for the shipping method. The following types are available:

    +     - **None**: Flat Rate is available on the Storefront as a shipping method,
    but the rate will be zero (free shipping)

    +     - **Per Order**: The amount defined as the price for the **Flat Rate** shipping
    method will be charged to the order

    +     - **Per Item**: The amount defined as the price for the **Flat Rate** shipping
    method will be multiplied by the number of items in the cart to set the shipping
    rate for the order

    +   - **Price**: This is the price that will be used to calculate the final shipping
    rate based on the option chosen in the previous field.

    +   - **Calculate Handling Fee**: Set whether the handling fee is a fixed amount
    or a percentage, based on the price defined in the previous field.

    +   - **Handling Fee**: This will be a fixed amount or a percentage to calculate
    the handling fee.

    +   - **Displayed Error Message**: The error message to be displayed when the
    shipping method is not available.

    +   - **Ship to Applicable Countries**: Specify whether the shipping method should
    be available for all countries or only specific countries. If you choose specific
    countries, the **Ship to Specific Countries** dropdown will be enabled to select
    the countries that will be available for this shipping method.

    +   - **Sort Order**: Set the order to determine the position of **Flat Rate**
    in the list of available shipping methods on the Storefront. The lower the number,
    the higher it will appear on the list.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# # Free Shipping


    The next available shipping method is **Free Shipping**. If you expand that section,
    you will see the following form:


    ![](img/de3034a92496a32462134266292a51dd_307_0.png)


    The **Free Shipping** method, as its name suggests, is the ability to configure
    a specific shipping method exclusively for free shipping. This is one of the most
    frequent promotions in online stores and you can specify the rules to set free
    shipping as available in specific scenarios, from a minimum order amount to shipping
    cart price rules that should be met to allow **Free Shipping** for the order.


    The following fields are available to configure the shipping method:


    +   - **Enabled:** Specify whether **Free Shipping** should be available as a
    shipping method in the Storefront.

    +   - **Title:** A descriptive title for the shipping method.

    +   - **Method Name:** This is the label that is displayed next to the rate on
    the Storefront.

    +   - **Minimum Order Amount:** Set the minimum amount for the order to qualify
    for free shipping.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '+   - **Displayed Error Message:** The error message to be displayed when the
    shipping method is not available.

    +   - **Ship to Applicable Countries:** Specify whether the shipping method should
    be available for all countries or only specific countries. If you choose specific
    countries, the **Ship to Specific Countries** dropdown will be enabled to select
    the countries that will be available for this shipping method.

    +   - **Sort Order:** Set the order to determine the position of **Free Shipping**
    in the list of available shipping methods on the Storefront. The lower the number,
    the higher it will appear on the list.


    # Table Rates


    Next, we will find **Table Rates** available to configure as a shipping method.
    If you expand the **Table Rates** section, you will see the following form:


    ![](img/de3034a92496a32462134266292a51dd_308_0.png)'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'This shipping method allows you to define a CSV file to calculate the shipping
    rate. The format for the CSV file depends on the condition for the shipping calculation.
    You can choose any of the following conditions:


    +   - **Weight Vs. Destination**

    +   - **Price Vs. Destination**

    +   - **# of items Vs. Destination**


    The following fields are available in the Table Rates shipping method configuration:


    +   - **Enabled**: Specify whether Table Rates should be available as a shipping
    method on the Storefront.

    +   - **Title**: A descriptive title for the shipping method.

    +   - **Method Name**: This is the label that is displayed next to the rate on
    the Storefront.

    +   - **Condition**: This is the condition to calculate the rate based on the
    table that you upload. The available conditions are:

    +     - **Weight Vs. Destination**

    +     - **Price versus Destination**

    +     - **# of items Vs. Destination**

    +   - **Include Virtual Products in Price Calculation**: Define whether virtual
    products should be included in the rate calculation. Since the table rates shipping
    is used to calculate the price based on the customer address (distance), most
    of the times, this option is set to No since virtual products are delivered through
    e-mail.

    +   - **Calculate Handling Fee**: Set whether the handling fee is a fixed amount
    or a percentage based on the price defined in the previous field.

    +   - **Handling Fee**: This will be a fixed amount or a percentage to calculate
    the handling fee.

    +   - **Displayed Error Message**: The error message to be displayed when the
    shipping method is not available.

    +   - **Ship to Applicable Countries**: Specify whether the shipping method should
    be available for all countries or only specific countries. If you choose specific
    countries, the Ship to Specific Countries dropdown will be enabled to select the
    countries that will be available for this shipping method.

    +   - **Sort Order**: Set the order to determine the position of Flat Rate in
    the list of available shipping methods on the Storefront. The lower the number,
    the higher it will appear on the list.'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'Now, in order to upload the CSV file for the Table Rates method, you should
    filter by website using the dropdown in the top-left corner of the screen. After
    that, two new fields will appear in the Table Rates form: Export and Import. You
    can see the dropdown to filter by website and the new fields in the following
    screenshot:


    ![](img/de3034a92496a32462134266292a51dd_310_0.png)


    You can export the current CSV for the Table Rates shipping method by using the
    Export CSV button in the Export field. If you haevn’t uploaded a CSV yet, you
    will be able to download the CSV that is included in Magento by default. It is
    especially important to have a template to use to create your own CSV file for
    your store.


    This is the CSV that is included in Magento by default:'
  merge: -1
  img_proc: true
