    # CATALOG | Catalog


    +   - Storefront:

    +     - List Mode: Set the display mode for the product listing page. The possible
    values are:

    +       - Grid Only

    +       - List Only

    +       - Grid (default) / List

    +       - List (default) / Grid'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# System Configuration


    +   - **Products per Page on Grid Allowed Values:** Set the allowed number of
    products per page in the grid mode of the product listing page.

    +   - **Products per Page on Grid Default Value:** Set the default number of products
    per page in the grid mode of the product listing page.

    +   - **Products per Page on List Allowed Values:** Set the allowed number of
    products per page in the list mode of the product listing page.

    +   - **Products per Page on List Default Value:** Set the default number of products
    per page in the list mode of the product listing page.

    +   - **Product Listing Sort by:** Set sorting criteria for the products in the
    product listing page.

    +   - **Allow All Products per Page:** Allow the customer to display all products
    at once in the product listing page.

    +   - **Use Flat Catalog Category:** Turn this setting on to enable flat tables
    for categories. This setting improves the performance of the store by combining
    all the category information in a flat table to fetch the data in a single query.

    +   - **Use Flat Catalog Product:** Turn this setting on to enable flat tables
    for products. This setting improves the performance of the store by combining
    all the product information in the flat table to fetch the data in a single query.

    +   - **Allow Dynamic Media URLs in Products and Categories:** When this setting
    is enabled, you can add relative references to images and other media assets.
    For example, you can reference an image in the media folder by using `{{media
    url="path/to/image.jpg"}}`. Enabling this setting has an impact on the catalog
    performance.

    +   - **Product Reviews:**

    +     - **Allow Guests to Write Reviews:** If this setting is set to **No**, then
    authentication will be required on the Storefront to write reviews.

    +   - **Product Image Placeholders:** Set default image placeholder when the image
    for the product is missing. You can specify a different placeholder with a different
    size for each of the Magento product types:

    +     - **Base**

    +     - **Small**

    +     - **Swatch**

    +     - **Thumbnail**'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# CATALOG | Inventory


    +   - **Recently Viewed/Compared Products:**

    +     - **Show for Current**: Set the scope of the list of recently viewed or
    compared products

    +     - **Default Recently Viewed Products Count**: Set the number of products
    to be displayed in the recently viewed products block

    +     - **Default Recently Compared Products Count**: Set the number of products
    to be displayed in the recently compared products block

    +   - **Layered Navigation:**

    +     - **Display Product Count**: Display the number of products in each item
    of the layered navigation

    +     - **Price Navigation Step Calculation**: By configuring this setting, you
    will be able to distribute products by price range in the layered navigation

    +   - **Category Top Navigation:**

    +     - **Maximal Depth**: Set the limit for the number of subcategories that
    should be displayed in the top navigation menu on the Storefront


    +   - **Stock Options:**

    +     - **Decrease Stock When Order is Placed**: Specify whether the available
    quantity for the product should be decreased as soon as the customer places the
    order

    +     - **Set Items'' Status to be In Stock When Order is Cancelled**: Increase
    the available quantity of products and change the status back to in stock if the
    order is cancelled

    +     - **Display Out of Stock Products**: Indicates whether out of stock products
    should be displayed on the Storefront

    +     - **Only X left Threshold**: Set the quantity to display the Only X left
    label on the Storefront

    +     - **Display Products Availability in Stock on Storefront**: If you enable
    this setting, the **Out of Stock** label will be displayed on the Storefront'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# CATALOG | Email to a Friend


    +   - Email Templates:

    +     - **Enabled**: Specify whether the Email to a Friend feature should be available
    in the Storefront.

    +     - **Select Email Template**: Choose the e-mail template for the Email to
    a Friend feature.

    +     - **Allow for Guests**: If you set this setting to Yes, then the link to
    share the product will be available to all the customers. If you set the setting
    to No, then only logged in customers will be able to see the link.

    +     - **Max Recipients**: Set the maximum number of recipients for the shared
    product.

    +     - **Max Products Sent in 1 Hour**: Set a limit to the number of products
    that the customer can share per hour.

    +     - **Limit Sending By**: Specify whether the customer should be identified
    by a cookie or the IP address. The limitation on the number of products per hour
    will depend on this setting. If you select Cookie (unsafe), then there will be
    X number of products allowed per cookie to be sent in an hour. If you select IP
    address, then the specific IP address can share X number of products per hour.
    The IP address option is recommended since the cookies can be cleaned in the browser,
    and the customer would be able to continue sharing products.


    # CUSTOMERS | Newsletter


    +   - Subscription Options:

    +     - **Allow Guest Subscription**: Allow guests to subscribe to the newsletter

    +     - **Need to Confirm**: Configure whether the e-mail address should be confirmed
    by the subscriber'
  merge: -1
  img_proc: true
- pgno: 232
  md: '- **Confirmation Email Sender / Success Email Sender / Unsubscription Email
    Sender:** Set the contact type for the confirmation/success/unsubscription e-mail

    - **Confirmation Email Template / Success Email Template / Unsubscription Email
    Template:** Set the e-mail template for the confirmation/success/unsubscription
    e-mail


    # CUSTOMERS | Customer Configuration


    +   - **Create New Account Options:**

    +     - **Enable Automatic Assignment to Customer Group:** Set whether the customer
    should be auto-assigned to a specific customer group

    +     - **Default Group:** If you enable the previous field, you can specify the
    customer group for the auto-assignment using this dropdown

    +     - **Default Welcome Email:** Specify the default transactional e-mail for
    the e-mail that is sent to the customer after registering

    +     - **Default Welcome Email Without Password:** Specify the default transactional
    e-mail for the e-mail that is sent when the customer was created without a password

    +     - **Email Sender:** Set the contact type as the sender for the **Welcome
    Email**

    +     - **Require Emails Confirmation:** Specify whether new customer accounts
    require validation to be active

    +     - **Confirmation Link Email:** Choose the transactional e-mail for the confirmation
    link e-mail

    +     - **Welcome Email:** If you specify the account validation, you can set
    the transactional e-mail that is sent when the account is confirmed

    +   - **Login Options:**

    +     - **Redirect Customer to Account Dashboard after Logging in:** If you set
    this setting to **No**, the customer will stay on the current page after logging
    in'
  merge: -1
