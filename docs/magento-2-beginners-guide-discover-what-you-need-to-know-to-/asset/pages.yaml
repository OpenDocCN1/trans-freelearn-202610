- pgno: 133
  md: '# 6

    Product Types


    We will go through the following sections in this chapter:


    +   - Introduction to the different product types in Magento

    +   - Simple products

    +   - Configurable products

    +   - Grouped products

    +   - Virtual products

    +   - Bundle products

    +   - Downloadable products


    # Introduction to the different product types in Magento


    One of the most important features of Magento are the product types. The different
    product types allow you to set up products in different ways, for example, by
    offering a group of products in the product details page or by allowing the customer
    to buy downloadable products.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Product Types


    There are six product types in Magento:


    +   - Simple products

    +   - Configurable products

    +   - Grouped products

    +   - Virtual products

    +   - Bundle products

    +   - Downloadable products


    You can see the list with the help of the following steps:


    +   1. Go to the following section in the admin panel:

    +      **Products | Inventory | Catalog**

    +   2. Click on the arrow inside the **Add Product** button on the top-right corner
    of the screen:


    ![](img/de3034a92496a32462134266292a51dd_134_0.png)


    It''s important to mention that Magento can set the correct product type based
    on the information from the product. For example, if you add a new product with
    no weight, Magento will create a virtual product.'
  merge: -1
  img_proc: true
