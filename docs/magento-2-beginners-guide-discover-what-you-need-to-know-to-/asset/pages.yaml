    +   - **Sales | PayPal Settlements / Braintree Settlements:** See the information
    for every transaction that affects the settlement of funds for PayPal and Braintree.

    +   - **Customers | Orders Total:** See the total amount for the orders of each
    customer for a given period of time, including the average amount of orders by
    customer.

    +   - **Customers | Order Count:** See the total number of orders by each customer
    for a given period of time, including the average number of orders by customer.

    +   - **Customers | New:** Number of new customers by interval of a specific period
    of time.

    +   - **Products | Views:** See the number of views for each of the products in
    the store in a specific period of time.

    +   - **Products | Bestsellers:** Review the list of bestsellers for a given period
    of time.

    +   - **Products | Low Stock:** Review the list of products that currently have
    a low stock quantity.

    +   - **Products | Ordered:** See a list of ordered products and the quantity
    sold for the selected period of time.

    +   - **Products | Downloads:** See the statistics related to downloadable products,
    including purchases and downloads.


