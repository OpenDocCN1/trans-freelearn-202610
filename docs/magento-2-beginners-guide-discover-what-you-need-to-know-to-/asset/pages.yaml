- pgno: 192
  md: '# Top navigation


    Let''s take another look at the category tree in the admin panel:


    ![](img/de3034a92496a32462134266292a51dd_192_0.png)


    As you can see there, the color for some of the categories is light gray. This
    means that these categories are disabled, and that is why Collections and Promotions
    are not visible in the main navigation menu in the Storefront.


    Even though that is correct, there could be a second reason why a category is
    not visible in the main navigation menu. If you look at the preceding screenshot,
