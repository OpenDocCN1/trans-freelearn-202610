    the cart price rule.

    +   - **Priority**: The matching cart price rules will be applied in the order
    that is set in this field, the lower priority being the first to be applied.

    +   - **Public In RSS Feed**: Set whether the cart price rule should be public
    in the Magento RSS Feed.


    +   - **Conditions**: Set conditions that should match for the cart price rule
    to be applied. If there are no conditions, then the cart price rule will always
    be applied if the properties defined in the **Rule Information** section are met.


