    # Backup, restore, and database management


    Creating a backup is essential to ensure we have a way to restore our Magento
    store in case something unexpected happens. Magento allows us to create a code
    base and database backup through the admin panel and the Magento 2 command-line
    tool.'
  merge: -1
  img_proc: true
- pgno: 389
  md: 'In order to create a backup from the admin panel, you should go to the following
    section:

    SYSTEM | Tools | Backups


    ![](img/de3034a92496a32462134266292a51dd_389_0.png)


    In that section, you will see a list of all the backups that you have created.
    In addition to that, you will be able to create three types of backup:


    +   - **System Backup**: Creates a code base and database backup with the ability
    to include or exclude the media folder

    +   - **Database and Media Backup**: Creates a database and media folder backup

    +   - **Database Backup**: Creates a database backup


    For all these backup types, you have the ability to put the Magento store in maintenance
    mode, since the process takes a lot of server resources.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# Store Maintenance


    If you click on **System Backup**, the following window will be displayed:


    ![](img/de3034a92496a32462134266292a51dd_390_0.png)


    When you proceed with the backup, a spin loader image is displayed and the backup
    will be created by the system. Since this backup includes the code base and database,
    the process takes time to get completed.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# Store Maintenance


    Once the backup is created, you will see a confirmation message on the screen
    and the backup will be listed on the grid:


    ![](img/de3034a92496a32462134266292a51dd_391_0.png)


    In addition to that, the backup file will be located in the var/backups folder
    in the code base.


    As you can see in the grid, you have the ability to download the backup in the
    .tgz format or restore it using the Rollback action in the last column.'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'The process is the same for the **Database and Media Backup** and **Database
    Backup**. Now, we should really consider automating this process so that we always
    have a backup for our Magento store.


    Magento allows you to schedule the backup to be automatically created on a regular
    basis by the system. In order to do so, you should go to the store configuration
    page (**STORES | Configuration**), and click on **ADVANCED | System**.


    On this page, you will see the **Scheduled Backup Settings** section:


    ![](img/de3034a92496a32462134266292a51dd_392_0.png)'
  merge: -1
  img_proc: true
- pgno: 393
  md: '# Store Maintenance


    If you select Yes in the Enable Scheduled Backup field, the following form will
    be displayed:


    ![](img/de3034a92496a32462134266292a51dd_393_0.png)


    From there, you can choose the backup type for the scheduled backup, the start
    time, and the frequency and also define whether the website should be put into
    maintenance mode during backup. It''s recommended to schedule the backup to be
    done on a daily basis at night when the store has less traffic, for example, every
    day at 2 AM.


    In addition to the admin panel backup, you can create a backup using the Magento
    2 command-line tool.


    In order to do that, you should go to the Terminal and change the current directory
    to the document root for your Magento 2 instance.


    If you run php bin/magento, you will see the setup:backup command to create the
    backup, which backs up the Magento application code base, media, and database.


    In addition to that, the setup:rollback command is available to restore a backup,
    which rolls back Magento Application code base, media, and database.'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'In order to create the backup, you should pass the type of backup to be created
    as a parameter. The available arguments are:


    +   - `--code`

    +   - `--media`

    +   - `--db`


    As you can tell by the name of each parameter, you will be able to specify whether
    the code base, media, and database should be included in the backup.


    For example, to create a code base and database backup, you should run the following
    command:


    ```

    php bin/magento setup:backup --code --db

    ```


    As you can see in the following screenshot, you can keep track of the progress
    from the command-line output:


    ![](img/de3034a92496a32462134266292a51dd_394_0.png)'
  merge: -1
  img_proc: true
- pgno: 395
  md: 'You can see a list of available backups by running the `magento info:backups:list`
    command:


    ![](img/de3034a92496a32462134266292a51dd_395_0.png)


    This is essential to know since the `setup:rollback` command requires you to specify
    the name of the file to restore each of the parameters:


    ```

    magento setup:rollback [-c|--code-file="<name>"] [-m|--media-file="<name>"]

    [-d|--db-file="<name>"]

    ```


    # Performance tuning


    When it comes to the conversion of your Magento store, performance is the key
    to have a high conversion rate. Nobody likes waiting for the pages to be loaded,
    and you want your customers to place their order as soon as possible when they
    decide what products they want to buy.


    In this section, we will review how to optimize Magento to have the fastest performance
    possible, including Magento configuration, server optimizations, and more.'
  merge: -1
  img_proc: true
- pgno: 396
  md: 'To compare the performance between the previous version and the new version
    of the platform, we will include in the book the performance statistics shared
    by Magento. Take into account that these statistics have been created using Magento
    Enterprise Edition 2.0, but they are a good reference to review:


    +   - **Orders per Hour:** Magento Enterprise Edition 2.0 can process 597 orders
    per hour, which is an additional 130 orders per hour in comparison with Magento
    Enterprise Edition 1.14.2:


    ![](img/de3034a92496a32462134266292a51dd_396_0.png)'
  merge: -1
  img_proc: true
- pgno: 397
  md: '+   - **Catalog Browsing:** The response time for catalog browsing is almost
    immediate in Magento Enterprise Edition 2.0 with Varnish:


    ![](img/de3034a92496a32462134266292a51dd_397_0.png)'
  merge: -1
  img_proc: true
- pgno: 398
  md: '**Add to Cart:** The Add to Cart action is 66% faster in Magento Enterprise
    Edition 2 in comparison with Magento Enterprise Edition 1.14.2:


    ![](img/de3034a92496a32462134266292a51dd_398_0.png)'
  merge: -1
  img_proc: true
- pgno: 399
  md: '+   - **Checkout Process:** The checkout process (all the steps combined) is
    48% faster for guest checkout and 36% faster for customer checkout in Magento
    Enterprise Edition 2 as compared with Magento Enterprise Edition 1.14.2:


    ![](img/de3034a92496a32462134266292a51dd_399_0.png)'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'Now let''s see how we can increase the performance of the Magento store:


    +   - **Server Configuration:** Even though Magento 2 is compatible with PHP 5.6,
    it''s recommended to use PHP 7 with Varnish to achieve the best performance results.

    +   - **Magento Configuration - Varnish:** We have mentioned Varnish previously;
    in order to enable it, you should deploy and configure Varnish first. After that,
    you will be able to enable it from the Stores Configuration page (**STORES | Configuration**)
    in the admin panel and open the **ADVANCED | System** page. From there, you will
    be able to select Varnish as a caching application and set the configuration:


    ![](img/de3034a92496a32462134266292a51dd_400_0.png)


    +   - **Magento Configuration - Redis:** Redis can be used instead of `Zend_Cache_Backend_File`
    for backend caches, and it''s also used for PHP session storage.'
  merge: -1
  img_proc: true
- pgno: 401
  md: '+   - **Magento Configuration - Developer Settings:** The following developer
    settings are recommended to increase the performance of your Magento store; you
    can set these configurations from **STORES | Configuration | ADVANCED | Developer**.
    You will see the following sections in that page:


    ![](img/de3034a92496a32462134266292a51dd_401_0.png)


    Set the following configurations:


    +   - **Grid Settings | Asynchronous indexing:** Enable

    +   - **CSS Settings | Minify CSS Files:** Yes

    +   - **JavaScript Settings | Minify JS Files:** Yes

    +   - **JavaScript Settings | Merge JavaScript Files:** No

    +   - **Template Settings | Minify HTML:** Yes

    +   - **JavaScript Settings | Enable JavaScript Bundling:** Yes'
  merge: -1
  img_proc: true
- pgno: 402
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 403
  md: '# Store Maintenance


    +   - **Magento Configuration: Email:** You can set the e-mails to be generated
    asynchronously from the **STORES | Configuration | Sales | Sales Emails** section.
    As you can see in the following screenshot, you can mark **Asynchronous** sending
    as enabled:


    ![](img/de3034a92496a32462134266292a51dd_403_0.png)'
  merge: -1
  img_proc: true
- pgno: 404
  md: '+   - **Magento Configuration - Flat Catalog**: We described the Flat Catalog
    feature for categories and products in Chapter 10, *System Configuration*. As
    we mentioned in that chapter, this setting improves the performance of the store
    by combining all the category and product information in a flat table to fetch
    data in a single query. You can enable the Flat Catalog from the **CATALOG | Catalog**
    store configuration page; these settings are under Storefront as **Use Flat Catalog
    Category** and **Use Flat Catalog Product**, as you can see in the following screenshot:


    ![](img/de3034a92496a32462134266292a51dd_404_0.png)'
  merge: -1
  img_proc: true
- pgno: 405
  md: '+   - **Magento Configuration - Index:** Instead of the indexes being updated
    at the moment when you make a change in the catalog through the admin panel, you
    can set the reindex process to be done by schedule according to the cron job configuration.
    You can make that change in the **SYSTEM | Index Management** admin panel page.
    From there, you will see that you can set the indexes to be updated by schedule
    using the mass action:


    ![](img/de3034a92496a32462134266292a51dd_405_0.png)


    +   - **Magento Configuration - Production Mode:** When the server and Magento
    have been configured, you should set Magento to run in **Production Mode**. In
    the production mode, static view files are served from the cache instead of going
    through the fallback mechanism from Magento. In addition to that, errors are logged
    by Magento in the `var` folder and they are not displayed to the user on the storefront.
    You can enable the production mode by running the following command in the Magento
    2 command-line tool:


    ```

    php bin/magento deploy:mode:set production

    ```


    You will see output similar to the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 406
  md: '![](img/de3034a92496a32462134266292a51dd_406_0.png)


    # # Search engine optimization


    In addition to off-site SEO factors, such as backlinks, onsite SEO factors are
    under your control, and you can optimize the SEO of your Magento store from the
    Magento admin panel. In this section, we will cover all the Magento 2 settings
    that are available out-of-the-box for SEO.'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# Store Maintenance


    One feature from Magento 2 that is really convenient is metatag autogeneration
    for products. You can set up the feature from the following admin panel section
    (**STORES | Configuration | CATALOG | Catalog | Product Fields Auto-Generation**):


    ![](img/de3034a92496a32462134266292a51dd_407_0.png)


    From there, you can use placeholders and custom text to autogenerate the metatags
    for SEO for all the products in your catalog.


    It''s important to clarify that you can''t set up this feature for each store
    view since these fields are global for your Magento instance, and new changes
    for the autogeneration configuration won''t be applied to existing products.'
  merge: -1
  img_proc: true
- pgno: 408
  md: 'In addition to that, you can override the autogenerated value from Search engine
    optimization in the product settings at any given time.


    In the following screenshot, you can also see that you can specify an SEO-friendly
    **URL key** for the product as well. You can configure the **ALT Text** for all
    the product images from the same page by updating **ALT Text** from the **Image
    Detail** window in the **Images and Videos** section:


    ![](img/de3034a92496a32462134266292a51dd_408_0.png)'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# Store Maintenance


    If you go to **PRODUCTS | Categories**, you will be able set the URL key, Meta
    Title, Meta Keywords, and Meta Description for each of the categories as well:


    ![](img/de3034a92496a32462134266292a51dd_409_0.png)


    Finally, two very important aspects of SEO are the XML sitemap and the Robots.xml
    files for your website. You can set up the XML sitemap for your store from the
    **STORES | Configuration | Catalog | XML Sitemap** section:'
  merge: -1
  img_proc: true
- pgno: 410
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 411
  md: 'The Robots.txt settings can be found in the STORES | Configuration | General
    | Design | Search Engine Robots section:


    ![](img/de3034a92496a32462134266292a51dd_411_0.png)


    In this page, you can set:


    +   - **Default robots**: Choose the default robots rules:

    +     - INDEX, FOLLOW

    +     - NOINDEX, FOLLOW

    +     - INDEX, NOFOLLOW

    +     - NOINDEX, NOFOLLOW

    +   - **Edit the custom instruction of robots.txt file**: Enter the custom instructions
    for the Robots.txt file if required

    +   - **Reset to Defaults**: Delete custom instructions and reset the Robots.txt
    configuration to default'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# Cache and Index Management


    Two aspects to consider when managing a Magento store are cache and index.


    Every time you make a change to the storefront, such as adding a new banner or
    changing a title, if the cache is enabled, you have to clear it to allow your
    customers to see updates on the storefront.


    Similarly, every time you make a change to the catalog, you have to reindex it
    to display the updated information for your customers.


    If you open the **SYSTEM** tab in the Magento admin panel, you will see that both
    sections are available under the **Tools** sub-menu:


    ![](img/de3034a92496a32462134266292a51dd_412_0.png)'
  merge: -1
  img_proc: true
- pgno: 413
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 414
  md: 'Now, if you go to SYSTEM | Tools | Index Management, you will see the following
    grid on the screen:


    ![](img/de3034a92496a32462134266292a51dd_414_0.png)


    There are two modes for indexers:


    +   - **Update on Save**: The indexed data is updated when a change is made to
    the catalog through the admin panel

    +   - **Update on Schedule**: The reindex process is made by the cron job, based
    on its configuration'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# Upgrading Magento to a new version


    In this section, we will review how to upgrade Magento 2 to the latest version.
    As an example, we will upgrade the website that we have been reviewing in the
    book from Magento 2.1.3 to 2.1.4.


    Before proceeding with the upgrade, you can see in the footer that the Magento
    version we are using is the one that we have previously mentioned:


    ![](img/de3034a92496a32462134266292a51dd_415_0.png)


    To run a system upgrade, you should go to the following section in the admin panel:


    **SYSTEM | Tools | Web Setup Wizard**


    The following page will be displayed on screen:'
  merge: -1
  img_proc: true
- pgno: 416
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 417
  md: 'Use the access key that we generated for your Magento store in *Chapter 3,
    Migration*, and click on **Submit**.


    After this, Magento will check whether a new version is available:


    ![](img/de3034a92496a32462134266292a51dd_417_0.png)


    If there are new versions of Magento available for your store, then you will see
    them listed in the dropdown, as follows:


    ![](img/de3034a92496a32462134266292a51dd_417_1.png)'
  merge: -1
  img_proc: true
- pgno: 418
  md: 'After selecting the Magento version for the upgrade, you can click on **Next**
    to go to the next step, **Readiness Check**:


    ![](img/de3034a92496a32462134266292a51dd_418_0.png)


    Similar to the first step in the Magento installation, which we reviewed in `Chapter
    2`, *Installation*, the system will check whether your Magento instance is ready
    to proceed with the wizard.


    The difference between the **Readiness Check** in the installation and the one
    in the upgrade is that the cron jobs should be configured for the upgrade.'
  merge: -1
  img_proc: true
- pgno: 419
  md: 'If there are errors with the cron job, PHP version, settings, or extensions,
    then you should consider reviewing the status and the configuration of your cron.


    If the **Readiness Check** is successful, you should see all the items marked
    with a checkmark:


    ![](img/de3034a92496a32462134266292a51dd_419_0.png)


    Once the **Readiness Check** is complete, you can proceed to the next step, which
    allows you to create a code base, media, and database backup:'
  merge: -1
  img_proc: true
- pgno: 420
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 421
  md: '# Store Maintenance


    The last step notifies you that the website will be temporarily offline and that
    maintenance mode in your store will be enabled:


    ![](img/de3034a92496a32462134266292a51dd_421_0.png)


    If you click on **Upgrade**, then the process will start and you will be able
    to track its progress from the browser:'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# Store Maintenance


    ![](img/de3034a92496a32462134266292a51dd_422_0.png)


    Once the upgrade is complete, you will see the following page on the screen:


    ![](img/de3034a92496a32462134266292a51dd_422_1.png)'
  merge: -1
  img_proc: true
- pgno: 423
  md: '# Store Maintenance


    The maintenance mode will be disabled and your Magento store will be running the
    selected Magento version, as you will see in the Magento admin panel footer:


    ![](img/de3034a92496a32462134266292a51dd_423_0.png)


    # Summary


    In this chapter, you learned how to back up and restore your Magento store, how
    to improve its performance, how to update your store configuration for SEO, how
    to manage the Magento cache and indexes, and how to upgrade your website to the
    latest version.


    This is the end of the book, but the beginning of your journey managing your Magento
    store. We were able to cover all the activities of a Magento store owner and administrator,
    and you are ready to succeed using the knowledge that you have now. Keep the book
    really close, as it can be useful for you to quickly take a look at the pages
    when you are working with the Magento platform. Good luck!'
  merge: -1
  img_proc: true
