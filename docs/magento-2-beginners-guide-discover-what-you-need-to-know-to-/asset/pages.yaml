    in Magento:


    ![](img/de3034a92496a32462134266292a51dd_291_0.png)


    This makes a total of 13 payment solutions that are included in Magento out-of-the-box,
    which gives you a lot of alternatives to set up the payment methods that you prefer.


    # Setting up PayPal


    **PayPal Express Checkout** is one of the most widely used payment methods for
