- pgno: 56
  md: '# Installation


    Now we are ready to log in to the AWS instance using the following command:


    ```

    ssh -i ~/sample.pem ubuntu@107.20.106.201

    ```


    We can alternatively use this command:


    ```

    ssh -i ~/sample.pem ubuntu@ec2-107-20-106-201.compute-1.amazonaws.com

    ```


    Once you log in to the development server, you should get sudo privileges to proceed
    with the installation of all the dependencies without problems:


    ```

    sudo su

    ```


    Now, it is time to set up all the dependencies for Magento 2:


    +   1. Update all the existing packages in the server:


    ```

    apt-get update

    ```


    +   2. We will install Apache, PHP, and the required PHP modules and composer
    using the following commands:


    ```

    apt-get install

    sudo apt-get install apache2

    sudo apt-get install php7.0

    sudo apt-get install libapache2-mod-php

    sudo apt-get install php7.0-simplexml

    sudo apt-get install php7.0-curl

    sudo apt-get install php7.0-intl

    sudo apt-get install php7.0-xsl

    sudo apt-get install php7.0-zip

    sudo apt-get install php7.0-xml

    sudo apt-get install php7.0-curl

    sudo apt-get install php7.0-gd

    sudo apt-get install php7.0-mcrypt

    sudo apt-get install php7.0-dom

    sudo apt-get install php7.0-mbstring

    sudo apt-get install composer

    ```


    ![](img/de3034a92496a32462134266292a51dd_56_0.png)


    You can run the installation for all the dependencies in one command, like this:


    ```

    sudo apt-get install apache2 php7.0 libapache2-mod-php php7.0-dom php7.0-simplexml
    php7.0-curl php7.0-intl php7.0-xsl php-mbstring php7.0-zip php7.0-xml php7.0-curl
    php7.0-gd php7.0-mcrypt php7.0-dom php7.0-mbstring composer

    ```'
  merge: -1
  img_proc: true
- pgno: 57
