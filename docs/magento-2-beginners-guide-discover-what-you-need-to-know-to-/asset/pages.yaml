- pgno: 18
  md: '# 1


    # Introduction to Magento 2


    In this chapter, we will cover the following topics:


    +   - Magento as a life style: Magento as a platform and the Magento community

    +   - Competitors: hosted and self-hosted e-commerce platforms

    +   - New features in Magento 2

    +   - What do you need to get started?


    # Magento as a lifestyle


    Magento is an open source e-commerce platform. That is the short definition, but
    I would like to define Magento considering the seven years that I have been part
    of the Magento ecosystem.


    In the seven years, Magento has been evolving to where it is today, a complete
    solution backed up by people with a passion for e-commerce. If you choose Magento
    as the platform for your e-commerce website, you will receive updates for the
    platform on a regular basis. Those updates include new features, improvements,
    and bug fixes to enhance the overall experience in your website.


    As a Magento specialist, I can confirm that Magento is a platform that can be
    customized to fit any requirement. This means that you can add new features, include
    third-party libraries, and customize the default behavior of Magento. As the saying
    goes, the only limit is your imagination.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Whenever I have to talk about Magento, I always take some time to talk about
    its community. Sherrie Rohde is the Magento Community Manager and she has shared
    some really interesting facts about the Magento community in 2016:


    +   - Delivered over 725 talks on Magento or at Magento-centric events

    +   - Produced over 100 podcast episodes around Magento

    +   - Organized and produced conferences and meetup groups in over 34 countries

    +   - Written over 1,000 blog posts about Magento


    # Types of e-commerce solutions


    There are two types of e-commerce solutions: *hosted* and *self-hosted*.


    We will analyze each e-commerce solution type, and we will cover the general information,
    pros, and cons of each platform from each category.


    # Self-hosted e-commerce solutions


    Self-hosted e-commerce solution is a platform that runs on your server, which
    means that you can download the code, customize it based on your needs, and then
    implement it in the server that you prefer. Magento is a self-hosted e-commerce
    solution, which means that you have absolute control over the customization and
    implementation of your Magento store.


    # WooCommerce


    WooCommerce is a free shopping cart plugin for WordPress that can be used to create
    a full-featured e-commerce website. WooCommerce has been created following the
    architecture and standards of WordPress, which means that you can customize it
    with themes and plugins. The plugin currently has more than 18,000,000 downloads,
    which represents over 39% of all online stores.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Now, we will review the pros and cons of WooCommerce:


    Pros:


    +   - It can be downloaded for free

    +   - Easy setup and configuration

    +   - A lot of themes available

    +   - Almost 400 extensions in the marketplace

    +   - Support through the WooCommerce help desk


    Cons:


    +   - WooCommerce cannot be used without WordPress

    +   - Some essential features are not included out-of-the-box, such us PayPal
    as a payment method, which means that you need to buy several extensions to add
    those features

    +   - Adding custom features to WooCommerce through extensions can be expensive


    # PrestaShop


    PrestaShop is a free open source e-commerce platform. The platform is currently
    used by more than 250,000 online stores and is backed by a community of more than
    1,000,000 members. The company behind PrestaShop provides a range of paid services,
    such us technical support, migration, and training to run, manage, and maintain
    the store.


    Now, let''s take a look at the pros and cons of Prestashop:


    Pros:


    +   - Free and open source

    +   - 310 integrated features

    +   - 3,500 modules and templates in the marketplace

    +   - Downloaded over 4 million times

    +   - 63 languages'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Cons:


    +   - As with WooCommerce, many basic features are not included by default and
    adding those features through extensions is expensive

    +   - Multiple bugs and complaints from the PrestaShop community


    # OpenCart


    OpenCart is an open source platform for e-commerce, available under the GNU General
    Public License. OpenCart is a good choice for a basic e-commerce website.


    Now, let''s take a look at the pros and cons of OpenCart:


    Pros:


    +   - Free and open source

    +   - Easy learning curve

    +   - More than 13,000 extensions available

    +   - More than 1,500 themes available


    Cons:


    +   - Limited features

    +   - Not ready for SEO

    +   - No cache management page in admin panel

    +   - Hard to customize


    # Hosted e-commerce solutions


    A hosted e-commerce solution is a platform that runs on the server belonging to
    the company that provides that service, which means that the solution is easier
    to set up but there are limitations and you don''t have the freedom to customize
    the solution according to your needs. The monthly or annual fees increase when
    the store attracts more traffic and has more customers and orders placed.'
  merge: -1
  img_proc: true
