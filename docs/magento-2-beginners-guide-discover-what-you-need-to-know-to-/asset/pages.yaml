    You will see the following message on screen:


    ![](img/de3034a92496a32462134266292a51dd_190_0.png)


    The process of updating the hierarchy for the categories takes a lot of resources
    for Magento, and that is why a warning is presented on screen. Let''s move forward
    and press Ok to proceed with the operation.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Categories


