- pgno: 40
  md: '# Command-line installation


    The command-line installation is the alternative method that Magento provides
    to install Magento 2 from the Terminal.


    These are the steps to proceed with the installation:


    +   1. Open the Terminal and go to the directory of your local Magento installation.


    +   2. The command-line installation is done using the Magento 2 command-line
    tool. You can confirm that you are in the right directory by running `php bin/magento`.
    You will see the output with a list of all the commands from the Magento 2 command-line
    tool:


    ![](img/de3034a92496a32462134266292a51dd_40_0.png)


    +   3. The next step is running Composer in the project directory. If you don''t
    have Composer installed in your local machine, you can follow the instructions
    on the official Composer website: https://getcomposer.org/. Then, you should run
    the following command in the Terminal:


    ```

    composer install

    ```'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'If everything goes well, you should see an output similar to the following:


    ![](img/de3034a92496a32462134266292a51dd_41_0.png)


    4. Finally, you should run setup:install to install Magento with your local configuration.
    That said, this is a long command and you can customize it to match your local
    configuration. We will review each of the parameters in the command:


    ```

    php bin/magento setup:install

    --db-host=localhost

    --db-name=magento2playground

    --db-user=root

    --db-password=root

    --backend-frontname=admin

    --admin-user=admin

    --admin-password=ABC123xyz

    --admin-email=email@sample.com

    --admin-firstname=Gabriel

    --admin-lastname=Guarino

    --base-url=http://magento2-playground.dev/

    --language=en_US

    --currency=USD

    --use-rewrites=1

    --use-secure=0

    --use-secure-admin=0

    ```


    +   - db-host: Host for your local database (localhost or 127.0.0.1)

    +   - db-name: Name of the empty database for the Magento installation

    +   - db-user: MySQL username

    +   - db-password: MySQL password

    +   - backend-frontname: URL (frontname) for the Magento Admin panel

    +   - admin-user: Username for your first admin user

    +   - admin-password: Password for your first admin user

    +   - admin-email: E-mail for your first admin user

    +   - admin-firstname: First name for your first admin user

    +   - admin-lastname: Last name for your first admin user

    +   - base-url: Base URL for the local Magento installation

    +   - language: Language for the Magento installation'
