- pgno: 109
  md: 'The **Product** attributes are part of the core of the catalog. Even though
    you can manage the attributes, you can''t remove the system attributes that are
    included in Magento by default. In order to see a list of system attributes, you
    should filter the grid by **System: Yes**, as seen in the following screenshot:


    ![](img/de3034a92496a32462134266292a51dd_109_0.png)


    As you can see, there are 43 system attributes in Magento. You must be familiar
    with most of them since these attributes are part of the **New Product** form
    field that we reviewed in the last chapter.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Creating a product attribute


    You can create custom product attributes in Magento to add custom information
    to the products in your catalog. You can see the **New Product Attribute** form
    by following these steps:


    +   1. Click on **Add New Attribute** in the top-right of the **Product** attributes
    grid.

    +   2. You will see the following form on screen:


    ![](img/de3034a92496a32462134266292a51dd_110_0.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'We will go through each of the fields on the form:


    +   - **Properties | Attribute Properties:**

    +     - **Default Label**: This is the label that describes the new attribute
    during data entry.

    +     - **Catalog Input Type for Store Owner**: This sets the data type and input
    control for the **Product** attribute. It''s important to mention that once the
    attribute type is created, it cannot be changed. The following options are available:

    +       - **Text Field**

    +       - **Text Area**

    +       - **Date**

    +       - **Yes/No**

    +       - **Multiple Select**

    +       - **Dropdown**

    +       - **Price**

    +       - **Media Image**

    +       - **Fixed Product Tax**

    +       - **Visual Swatch**

    +       - **Text Swatch**

    +     - **Values Required**: This defines whether the value for the **Product**
    attribute is mandatory or not.

    +   - **Properties | Advanced attribute properties:**

    +     - **Attribute Code**: This specifies a unique identifier for the **Product**
    attribute for internal use. Only letters (a-z), numbers (0-9), and underscores
    are allowed for the code, and the first character should be a letter. The code
    must be less than thirty characters and it shouldn''t contain any spaces.

    +     - **Scope**: This defines whether the attribute can be customized at a global,
    website, or store view level.

    +     - **Default Value**: This is the value that will be declared for the attribute
    by default during data entry.

    +     - **Unique Value**: This sets whether the value for this **Product** attribute
    should be unique within the context of scope setting. For example, SKU is a system
    attribute that must have a unique value identifying each product.

    +     - **Input Validation for Store Owner**: This sets validation for the attribute
    value when the product is created from the admin panel.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Attribute Sets and Custom Attributes


    +   - **Add to Column Options:** This includes the attribute in the list of column
    options in the product grid.

    +   - **Use in Filter Options:** This includes the attribute in the list of filter
    options in the product grid.

    +   - **Manage Labels:**

    +     - **Manage Titles (Size, Color, etc.):** This customizes the label for the
    **Product** attribute by store view. For example, if you have three store views
    with different languages, you can translate the label for each of the store views.

    +   - **Storefront Properties:**

    +     - **Use in Search:** If Yes, the attribute will be included in the search
    queries and customers will be able to search in the catalog based on the values
    for the attribute:

    +       - **Search Weight:** If Use in Search is set to Yes, then this field will
    be displayed. You can set the priority for the search query by setting a number
    between 1 and 10, where 10 has the highest priority.

    +       - **Visible in Advanced Search:** If Use in Search is set to Yes, then
    you can specify whether the **Product** attribute should be included in the **Advanced
    Search** form.


    ![](img/de3034a92496a32462134266292a51dd_112_0.png)


    Note: Including many attributes in the Magento search can slow down the search
    performance.


    +   - **Comparable on Storefront:** Include the **Product** attribute in the **Compare
    Products** page.

    +   - **Use in Layered Navigation:** If the attribute type is Dropdown, Multiple
    Select, or Price, you can add the attribute to the layered navigation (left sidebar)
    in the product listing page.

    +   - **Use in Search Results Layered Navigation:** If the attribute type is Dropdown,
    Multiple Select, or Price, you can add the attribute to the layered navigation
    (left sidebar) in the search results page.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Attribute Sets and Custom Attributes


    ![](img/de3034a92496a32462134266292a51dd_113_0.png)


    > > Note: Including many attributes in the Magento layered navigation can slow
    down the performance in the product listing and search result pages.


    +   - **Position:** This sets the position for the attribute in the layered navigation
    in relation to other attributes in the block.

    +   - **Use for Promo Rule Conditions:** This adds an attribute to the list of
    the available conditions for the promo rules.

    +   - **Allow HTML Tags on Storefront:** This is used to define whether the attribute
    value can include HTML for formatting.

    +   - **Visible on Catalog Pages on Storefront:** This includes the **Product**
    attribute in the **Additional Information** tab of the product detail page. This
    configuration is only applicable to simple and virtual products.

    +   - **Used in Product Listing:** This includes attributes in the product listing
    page. This attribute configuration depends on the theme.

    +   - **Used for Sorting in Product Listing:** This includes attributes in the
    **Sort By** option in the product listing page. This attribute configuration depends
    on the theme.


    Now that we reviewed the **New Product Attribute** form, we are ready to create
    a custom attribute for the product that we created in the last chapter.


    We will create a new product attribute for the **Red Shirt** that we created before—**Sleeve
    Length**.


    Set the following information for the attribute in the **New Product Attribute**
    form:


    +   - **Properties | Attribute Properties:**

    +     - **Default Label:** `Sleeve Length`

    +     - **Catalog Input Type for Store Owner:** Dropdown

    +     - **Values Required:** No'
  merge: -1
  img_proc: true
- pgno: 114
  md: '+   - **Manage Options (Values of Your Attribute)**: In the case of **Manage
    Options (Values of Your Attribute)**, since the input type for the attribute is
    **Dropdown**, we must specify the options, as seen in the following screenshot:


    ![](img/de3034a92496a32462134266292a51dd_114_0.png)


    +   - **Properties | Advanced attribute properties:**

    +     - **Attribute Code:** `sleeve_length`

    +     - **Scope:** Store View

    +     - **Unique Value:** No

    +     - **Add to Column Options:** Yes

    +     - **Use in Filter Options:** Yes


    +   - **Manage Labels:**

    +     - **Manage Titles (Size, Color, etc.) | Default Store View:** `Sleeve Length`


    +   - **Storefront Properties:**

    +     - **Use in Search:** Yes

    +     - **Search Weight:** 10

    +     - **Visible in Advanced Search:** Yes

    +     - **Comparable on Storefront:** Yes'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Attribute Sets and Custom Attributes


    +   - Use in Layered Navigation: Filterable (with results)

    +   - Use in Search Results Layered Navigation: Yes

    +   - Use for Promo Rule Conditions: Yes

    +   - Allow HTML Tags on Storefront: Yes

    +   - Visible on Catalog Pages on Storefront: Yes

    +   - Used in Product Listing: Yes

    +   - Used for Sorting in Product Listing: Yes


    When you have added all the information for the attribute, you should click on
    **Save Attribute** at the top-right of the screen.


    You will see the following popup when the attribute is saved:


    ![](img/de3034a92496a32462134266292a51dd_115_0.png)


    That message is notifying that a reindex is necessary for the database. Indexing
    is the way Magento prepares the data, such us Products and Attributes, to increase
    the performance of the store. When the data changes, a reindex is necessary to
    update the information in the database.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'For example, when you change the price of a product, you must reindex the price
    change to show the updated price in the product detail page. Without indexing,
    Magento will have to calculate the price for every product on-the-fly, including
    all the calculations for the advanced price rules, promotions, and so on.


    In order to avoid a manual reindex, you should set up a Magento cron job to run
    every minute. Since we didn''t configure the cron job, we should manually run
    the reindex process.


    In order to reindex, you can click on the **Indexers are Invalid** link on the
    popup from the latest screenshot or go to the **System | Tools | Index Management**
    menu item.


    There, you will see a list of indexers, and you will see the **Index product EAV**
    indexer requiring the reindex, as can be seen in the following screenshot:


    ![](img/de3034a92496a32462134266292a51dd_116_0.png)'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Attribute Sets and Custom Attributes


    If the cron job is not running in your website, you can manually run the reindex
    from the Magento command-line tool:


    +   1. Open the terminal and go to the project folder.

    +   2. Run the following command:


    ```

    ```bash

    php bin/magento indexer:reindex

    ```

    ```


    You will see the following output from the command:


