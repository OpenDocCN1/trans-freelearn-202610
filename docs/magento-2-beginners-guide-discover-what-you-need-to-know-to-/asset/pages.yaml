- pgno: 138
  md: 'If we go back to the Storefront and open the product details page for the Red
    Shirt product, we will see the updated product showing all the information that
    we need for that simple product:


    ![](img/de3034a92496a32462134266292a51dd_138_0.png)


    # Configurable products


    Now, imagine if you have shirts in different sizes and colors. If you add all
    of them as simple products and display them in the catalog, the result would be
    several red shirts that look exactly the same in the product listing page. It
    would be difficult to find the shirt that you need, and it would be visually confusing.


    Fortunately, Magento allows you to create products that can be configured from
    the product details page. In our example, you will have a shirt product with multiple
    options to select the color and size from the product details page.


    This is the concept of a configurable product. Configurable products are made
    of simple products that are associated. When the customer chooses a combination
    in the configurable product, the customer is actually choosing which simple product
    will be added to the cart from the configurable product page.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Let''s create the first configurable product: Shirt. In order to do that, we
    will follow these steps:


