- pgno: 312
  md: 'If you go to the SALES | Shipping Methods | UPS section in the STORES | Configuration
    page, you will see the following form on the screen:


    ![](img/de3034a92496a32462134266292a51dd_312_0.png)


    We will review each of the fields from this form:


    +   - **General configuration:**

    +     - **Enabled for Checkout**: Specify whether UPS should be available as a
    shipping method on the Storefront.

    +     - **UPS Type**: You can choose between **United Parcel Service** or **United
    Parcel Service XML**. With **United Parcel Service**, you can get real-time shipping
    rates, and with **United Parcel Service XML**, you can get real-time rates and
    print labels for UPS.

    +   - **UPS-specific configuration depending on UPS type**: The following fields
    depend on the **UPS Type** that you choose in the previous field that we reviewed.
    If you choose **United Parcel Service** as a **UPS Type**, the following fields
    will be available:

    +     - **Live Account**: Choose **Yes** to activate UPS in production. If you
    choose **No**, you will activate UPS as a shipping method in the test mode.

    +     - **Gateway URL**: The default gateway URL is included in Magento. If you
    need to change the gateway URL, you can do it from this field.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Configuring Shipping


    +   - **Title:** A descriptive title for the shipping method.

    +   - **Packages Request Type:** You can choose **Divide to equal weight (one
    request)** or **Use origin weight (few requests)**.


    And if you choose **United Parcel Service XML** as a UPS type, the following fields
    will be available:


    +   - **Live Account:** Choose **Yes** to activate UPS in production. If you choose
    **No**, you will activate UPS as a shipping method in the test mode.

    +   - **Access License Number:** Your UPS access key.

    +   - **Gateway XML URL:** The default gateway XML URL is included in Magento.
    If you need to change the gateway XML URL, you can do that from this field.

    +   - **Mode:** As you can see in the comment for the field, this setting enables
    or disables SSL verification of the Magento server by UPS.

    +   - **User ID:** Your UPS User ID.

    +   - **Origin of the Shipment:** Select one of the options from the dropdown
    to specify the origin of the shipment.

    +   - **Password:** Your UPS account password.

    +   - **Title:** A descriptive title for the shipping method.

    +   - **Enable Negotiated Rates:** Enable negotiated shipping rates with UPS.

    +   - **Packages Request Type:** You can choose **Divide to equal weight (one
    request)** or **Use origin weight (several requests)**.

    +   - **Shipper Number:** This is a six-character UPS code, which is required
    for negotiated rates.

    +   - **Tracking XML URL:** The default tracking XML URL is included in Magento.
    If you need to change the tracking XML URL, you can do that from this field.


    **Other configuration:** The following fields are available for both **United
    Parcel Service** and **United Parcel Service XML UPS** types:


    +   - **Container:** Set the container for the shipment.

    +   - **Weight Unit:** Set the weight unit for the shipping method.

    +   - **Destination Type:** Select whether the destination type is residential
    or commercial.

    +   - **Maximum Package Weight:** Set the number for the maximum package weight
    in the carrier.

    +   - **Pickup Method:** Set the pickup to any of the following methods:

    +     - **Regular Daily Pickup**

    +     - **On Call Air**'
  merge: -1
