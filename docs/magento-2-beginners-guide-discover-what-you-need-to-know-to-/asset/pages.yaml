- pgno: 243
  md: '# 11


    # Working with Customers


    In this chapter, we will cover the following topics:


    +   - Working with customer accounts

    +   - Customer groups


    # Working with customer accounts


    Customers have the ability to register an account on the Storefront to keep track
    of their orders, save their personal information for future orders, and more.


    You can manage the customer accounts in your store from the CUSTOMERS | All Customers
    section in the admin panel.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Working with Customers


    You will see the following page on the screen:


    ![](img/de3034a92496a32462134266292a51dd_244_0.png)


    One of the most useful elements from the grids in the Magento admin panel is the
    Actions dropdown. The dropdown contains mass actions to apply a specific action
    to the items that are selected in the grid.


    The following mass actions are available from the Customers grid:


    +   - Delete

    +   - Subscribe to Newsletter

    +   - Unsubscribe from Newsletter

    +   - Assign a Customer Group

    +   - Edit


    In addition to that, you can filter and sort the list of customers in the grid,
    set the number of customers to display per page, select the columns to display,
    search by keyword, and export the customer list to CSV and Excel XML.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Working with Customers


    You can view and edit the customer information by clicking on the **Edit** link
    in the last column from the **Action** grid.


    If you click on that link, you will be redirected to the **Customer** edit page:


    ![](img/de3034a92496a32462134266292a51dd_245_0.png)


    We can see that there are several buttons on top to perform different actions
    on the customer account:


    +   - **Delete Customer**

    +   - **Reset**: Resets all changes that have been made in the customer information
    since you opened the **Customer** edit page

    +   - **Create Order**: Creates an order for the customer

    +   - **Reset Password**

    +   - **Force Sign-In**: Revokes the API token for the customer account'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'On the left sidebar, the following sections are available:


    +   - **Customer View**: Take a look at the following screenshot:


    ![](img/de3034a92496a32462134266292a51dd_246_0.png)


    You can see the personal information of the customer, including:


    +   - The last time the customer logged in

    +   - Whether the account is locked or unlocked (Magento locks the account after
    six failed login events)

    +   - If a confirmation e-mail was required, then you can see whether the account
    has been verified

    +   - The date that the account was created on

    +   - The store view from which the account was created

    +   - The customer group of the customer account

    +   - The default billing and shipping addresses


    +   - **Account Information**: You can edit the personal information in this section
    and specify the customer group for the customer account:


    ![](img/de3034a92496a32462134266292a51dd_246_1.png)'
  merge: -1
  img_proc: true
- pgno: 247
  md: '+   - **Addresses:** You can add new addresses for the customer account and
    specify which one of them should be the default billing and shipping addresses:

    +   - **Orders:** You can see the list of orders placed by the customer. You can
    open the order to see all the details and even reorder directly from the grid
    (if reorder is enabled in the system configuration–SALES | Sales | Reorder | Allow
    Reorder):


    ![](img/de3034a92496a32462134266292a51dd_247_0.png)


    ![](img/de3034a92496a32462134266292a51dd_247_1.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '+   - **Billing Agreements**: To make the checkout process simpler, customers
    can enter into a billing agreement with PayPal as the payment service provider.
    The customer chooses the billing agreement as the payment method in the checkout,
    and PayPal identifies the billing agreement by its unique number and proceeds
    with the charge. The **Billing Agreements** section contains all the billing agreements
    for the customer:


    ![](img/de3034a92496a32462134266292a51dd_248_0.png)


    +   - **Newsletter**: You can check if the customer is subscribed to the newsletter
    and see the list of newsletters with the ability to filter by **ID**, **Start
    date**, **End Date**, **Receive Date**, **Subject**, and **Status**:


    ![](img/de3034a92496a32462134266292a51dd_248_1.png)'
  merge: -1
  img_proc: true
- pgno: 249
  md: '+   - **Product Reviews:** You can see the list of product reviews written
    by the customer:


    ![](img/de3034a92496a32462134266292a51dd_249_0.png)


    +   - **Wish List:** You can review the list of products that are in the wish
    list of the customer, including important information such as the number of days
    since the product was added to the wish list:


    ![](img/de3034a92496a32462134266292a51dd_249_1.png)'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Adding a new customer


    Even though the customer can create the account from the Storefront, the administrator
    can create the account from the admin panel as well. You can add a new customer
    by clicking on the Add New Customer button in the Customers page (Customers |
    Customers | All Customers):


    ![](img/de3034a92496a32462134266292a51dd_250_0.png)'
  merge: -1
  img_proc: true
- pgno: 251
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Now, click on the **Save Customer** button on the top-right corner of the screen.
    You will be redirected to the **Customers** page, and you will see the success
    message as confirmation that the account has been created:


    ![](img/de3034a92496a32462134266292a51dd_252_0.png)


    # Summary


    You saw that managing customers in Magento is really simple, from the ability
    to see the list of all customers to applying useful mass actions such as *Subscribe
    to Newsletter*. Creating and editing customers is an easy process as well, and
    you can review all the information of customers, including their orders, reviews,
    and more.


    In the next chapter, we will go through the process of setting up and managing
    taxes for your Magento store.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# 12


    # Admin Users and Roles


    In this chapter, we will cover the following concepts:


    +   - Managing admin users

    +   - Managing roles and granting permissions


    # Managing admin users


    When managing an e-commerce website, you need different administrators that have
    access to different pages in the admin panel. For example, if a person from your
    team is in charge of adding and updating products in your Magento store, then
    you need that person to access only the **PRODUCTS | Catalog** page. If another
    team member is in charge of marketing, then you can create a new admin user with
    a specific role to access just the **MARKETING** and **CONTENT** sections.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Admin Users and Roles


    You can create users for the Magento admin panel and grant specific privileges
    to each of the user roles. You can see a list of existing admin users by opening
    the SYSTEM | Permissions | All Users page in the admin panel:


    ![](img/de3034a92496a32462134266292a51dd_254_0.png)


    You can add new users by clicking on the Add New User button on the top-right
    corner of the screen. You will be redirected to the following form:


    ![](img/de3034a92496a32462134266292a51dd_254_1.png)'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Admin Users and Roles


    There, you can set the personal information for the new admin user, the password,
    the interface language, the account status, and the admin role.


    If we take a look at the User Role tab, we can see that Magento includes only
    one user role by default, that is, Administrators:


    ![](img/de3034a92496a32462134266292a51dd_255_0.png)


    Let''s create a sample admin user by adding the following information to the form:


    # User Info:


    +   - **First Name**: Your first name

    +   - **Last Name**: Your last name

    +   - **Email**: Your e-mail address

    +   - **Password**: Set a password for the account

    +   - **Password Confirmation**: Repeat the same password for the account

    +   - **Interface Locale**: English (United States) / English (United States)

    +   - **Your Password**: Password for the current admin user'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# User Role:


    +   - Role: Administrator


    After filling out this information in the form, click on Save User. You will be
    redirected to the Users grid, and you will see the following message on the screen:


    ![](img/de3034a92496a32462134266292a51dd_256_0.png)


    # Managing roles


    You can create new roles for your admin users to grant specific permissions to
    different admin pages. You can manage user roles by going to the SYSTEM | Permissions
    | User Roles page in the admin panel. You will be redirected to the following
    page:'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Admin Users and Roles


    ![](img/de3034a92496a32462134266292a51dd_257_0.png)


    We can see the only admin role that is available in Magento by default, which
    has all the permissions in the admin panel. We will create a new user role by
    clicking on **Add New Role** in the top-right corner of the screen. After clicking
    the button, you will see the following page on the screen:


    ![](img/de3034a92496a32462134266292a51dd_257_1.png)'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Admin Users and Roles


    In the first tab, **Role Info**, you can set the role name and specify the password
    for your current admin user to be able to save the changes. In the second tab,
    **Role Resources**, you will see a list of all resources to assign to the user
    role:


    ![](img/de3034a92496a32462134266292a51dd_258_0.png)


    We will create a sample user role with access to just the **Dashboard** and **Sales**
    sections in the admin panel.


    First, we will set the name as `Sample User Role`, and we will specify the password
    for our current admin user in the **Role Info** tab.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'Then, we will check the Dashboard and Sales checkboxes in the Role Resources
    tab, as you can see in the following screenshot:


    ![](img/de3034a92496a32462134266292a51dd_259_0.png)


    Finally, click on Save Role to add the new admin user role to Magento. You will
    see a confirmation message in the Roles grid:


    ![](img/de3034a92496a32462134266292a51dd_259_1.png)'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'If we go back to the Users grid (SYSTEM | Permissions | All Users) and click
    on the user that we have just created, we will be able to assign the user to the
    new user role:


    ![](img/de3034a92496a32462134266292a51dd_260_0.png)


    If we save the changes, sign out from the current admin user account, and log
    in as the new user, we will see that we will just have access to the Dashboard
    and Sales sections:


    ![](img/de3034a92496a32462134266292a51dd_260_1.png)'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Summary


    In this chapter, you learned how to create new admin users and grant specific
    permissions to the different admin sections. In the next chapter, we will go through
    the tax configuration in Magento, including tax classes, tax rules, tax zones,
    and rates.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 13


    # Taxes


    In this chapter, we will cover the following topics:


    +   - Tax classes and rules

    +   - Tax zones and rates


    # Tax classes and rules


    One of the tasks that should be done by the store owner before the website launch
    is setting up taxes for the store.


    Magento allows you to set up taxes based on your business needs. The general configuration
    for the taxes is located in the system configuration page that we reviewed before
    (STORES | Configuration | Sales | Tax):


    ![](img/de3034a92496a32462134266292a51dd_262_0.png)'
  merge: -1
  img_proc: true
- pgno: 263
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Taxes


    You will be redirected to the following form:


    ![](img/de3034a92496a32462134266292a51dd_264_0.png)


    If you click on Additional Settings, the following additional fields will be visible
    in the form:


    ![](img/de3034a92496a32462134266292a51dd_264_1.png)'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'As you can see, you can add new tax classes for customers and products. These
    new classes will be available later for selection from the system configuration
    page.


    Let''s go through each of the fields in the New Tax Rule form:


    +   - **Tax Rule Information:**

    +     - **Name:** Name of the tax rule

    +     - **Tax Rate:** This will be the rate percent for the tax rule, based on
    location. You can select existing rates or create a new tax rate for selection.
    We will cover this later.

    +   - **Additional Settings:**

    +     - **Customer Tax Class:** The customer tax class is used in specific scenarios
    when the purchase is not retail.

    +     - **Product Tax Class:** Since different products have different taxes,
    you can add product tax classes for each of the product families of your store.

    +     - **Priority:** Priority is used when there are multiple tax classes. Tax
    rates of the same priority are added, and other tax rates are compounded.

    +     - **Calculate Off Subtotal Only:** Override the priority order for compound
    taxes and calculate the tax based on the subtotal of the order.

    +     - **Sort Order:** This is the order that the taxes are displayed in. The
    lower the sort order, the higher it will appear in the list.

    +     - **Import Tax Rates:** Import tax rates from a CSV file.

    +     - **Export Tax Rates:** Export tax rates to a CSV file. This is useful to
    get the right CSV format for the import in the previous field.


    Let''s move on and create a new tax rule. We will add the following information
    to the form:


    +   - **Tax Rule Information:**

    +     - **Name:** `Sample Rule`

    +     - **Tax Rate:** For this rule, we will select the following tax rates:

    +       - **US-CA-*-Rate 1**

    +       - **US-NY-*-Rate 1**'
  merge: -1
  img_proc: true
- pgno: 266
  md: '+   - **Additional Settings:**

    +     - **Customer Tax Class:** Retail Customer

    +     - **Product Tax Class:** Taxable Goods

    +     - **Priority:** 0

    +     - **Calculate Off Subtotal Only:** Unchecked

    +     - **Sort Order:** 0


    Now, click on **Save Rule**. When you are redirected to the **Tax Rules** grid,
    you will see a confirmation message and the new rule in the grid:


    ![](img/de3034a92496a32462134266292a51dd_266_0.png)


    Now, let''s modify the **Customer Tax Class** and the **Product Tax Class** for
    the rule that we just created. We will click on the **Sample Rule** item in the
    grid to be redirected to the edit form.


    There, we will click on the **Additional Settings** link, and we will click on
    the **Add New Tax Class** button.'
  merge: -1
  img_proc: true
- pgno: 267
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Taxes


    If you click on Save Rule, you will see the updated tax classes in the Tax Rules
    grid:


    ![](img/de3034a92496a32462134266292a51dd_268_0.png)


    In addition to this, the new tax classes will be available for selection in the
    system configuration page for taxes (STORES | Configuration | Sales | Tax):


    ![](img/de3034a92496a32462134266292a51dd_268_1.png)'
  merge: -1
  img_proc: true
- pgno: 269
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 270
  md: 'We will add a new tax rate by clicking on **Add New Tax Rate**. Once the page
    is loaded, you will see the following form:


    ![](img/de3034a92496a32462134266292a51dd_270_0.png)


    There, you can specify the following information:


    +   - **Tax Identifier**: Name for the tax rate.

    +   - **Zip/Post is Range**: You can specify a zip/post code range for the tax
    rate.

    +   - **Zip/Post Code**: You can specify the specific post code, or use the asterisk
    character to specify a pattern for the zip code. For example, bay*** will match
    any zip/post Code that begins with bay.

    +   - **State**: Select all states or a specific state from the country that you
    choose in the next field.

    +   - **Country**: Select the country for the tax rate.

    +   - **Rate Percent**: Set the tax percent.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'You can also add new tax rates from the New / Edit Tax Rule page by clicking
    on the Add New Tax Rate button:


    ![](img/de3034a92496a32462134266292a51dd_271_0.png)


    When you click on that button, you will see the following window to add the information
    for the new tax rate:


    ![](img/de3034a92496a32462134266292a51dd_271_1.png)


    # Summary


    In this chapter, we reviewed the process of creating tax classes, tax rules, and
    tax rates, based on the customer location. Now, you will be able to set prices
    and taxes accurately for the catalog in your Magento store. In the next chapter,
    you will learn about catalog and shopping cart price rules to create promotions
    and increase your sales.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# 14


    # Catalog and Shopping Cart

    # Price Rules


    We will cover the following concepts in this chapter:


    +   - Catalog price rules

    +   - Shopping cart price rules

    +   - Generating coupons


    # ## Catalog price rules


    One of the key elements of an online store is the ability to set up promotions
    in order to increase sales and keep visitors coming back to place new orders.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Catalog and Shopping Cart Price Rules


    Magento allows you to set up promotions for your catalog. You can manage those
    promotions from the MARKETING | Promotions | Catalog Price Rule admin page:


    ![](img/de3034a92496a32462134266292a51dd_273_0.png)


    As you can see in the preceding screenshot, the Magento 2 sample data includes
    one catalog promotion– 20% off all Women''s and Men''s Pants


    You can add a new rule by clicking on Add New Rule in the top-right corner of
    the page.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'The **New Catalog Price Rule** will be visible on the screen when the page
    loads:


    ![](img/de3034a92496a32462134266292a51dd_274_0.png)


    Here, you can specify the following information:


    +   - **Rule Information:**

    +     - **Rule Name:** A name to help you remember the details of this catalog
    price rule.

    +     - **Description:** A description for the catalog price rule. This is an
    internal field for the administrator and won''t be displayed on the Storefront.

    +     - **Status:** Set whether the catalog price rule is active or not.

    +     - **Websites:** Specify the websites for the catalog price rule.

    +     - **Customer Groups:** Set specific customer groups for the catalog price
    rule.

    +     - **From (Select Date) – To (Select Date):** Set a specific date range for
    the catalog price rule.

    +     - **Priority:** The matching catalog price rules will be applied in the
    order that is set in this field, the lower priority being the first to be applied.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '+   - **Conditions:** Set conditions to apply the catalog price rule to specific
    products. If there are no conditions, then the catalog price rule will be applied
    to all products. You can set the conditions based on the product attributes:


    ![](img/de3034a92496a32462134266292a51dd_275_0.png)


    You can also set the catalog price rule to be valid if all the selected conditions
    are True or False:


    ![](img/de3034a92496a32462134266292a51dd_275_1.png)'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'When you click on the green plus icon and select a product attribute, a new
    field and new icons will be visible, and you can choose the specific filter for
    the attribute:


    ![](img/de3034a92496a32462134266292a51dd_276_0.png)


    The preceding filter is for the SKU attribute; different filters apply for the
    attributes. For example, here is the filter dropdown for the color attribute:


    ![](img/de3034a92496a32462134266292a51dd_276_1.png)'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'Finally, a blue window icon is available for some of the attributes. For example,
    if you select the **SKU** attribute and click on the blue window button, you will
    see a product grid to filter and choose products through that interface:


    ![](img/de3034a92496a32462134266292a51dd_277_0.png)


    If you select the **Category** attribute and click on the blue window icon, you
    will be able to select categories through the category grid:'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Catalog and Shopping Cart Price Rules


    ![](img/de3034a92496a32462134266292a51dd_278_0.png)


    +   - **Actions:**

    +     - **Apply:** This will be the action that will be applied to all matching
    products, based on the rule information and conditions that form the previous
    fields. The available actions are:

    +       - **Apply as percentage of original:** The discount is calculated as a
    percentage of the product price. If the product price is $200 and the discount
    is 10%, then the final price with discount will be $190.

    +       - **Apply as fixed amount:** The discount will be a fixed amount. If the
    product price is $200 and the discount is 10%, then the final price with discount
    will be $190.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '+   - **Adjust final price to this percentage:** The final price for the product
    will be the percentage of the product price (direct percentage calculation from
    the product price). If the product price is $200 and the discount is 10%, then
    the final price with discount will be $20.

    +   - **Adjust final price to discount value:** The final price for the product
    will be the amount that you set as a discount. The original price doesn''t matter;
    the price will always be the amount specified as the discount. If the product
    price is $200 and the discount is 10%, then the final price with discount will
    be $10.

    +   - **Discount Amount:** Set the discount amount that will be applied in the
    way that you selected in the previous dropdown.

    +   - **Discard subsequent rules:** If additional rules meet the same conditions,
    then you can discard those rules to prevent multiple discounts from being applied
    to the same purchase.


    # # Shopping cart price rules


    Magento allows you to create specific promotions that can be applied to the shopping
    cart. For example, customers love using coupon codes in online stores, and some
    of them even search for a coupon code for every online purchase that they make.
    You can manage those promotions from the **MARKETING | Promotions | Cart Price
    Rules** section in the admin panel. You will be redirected to the following grid:'
  merge: -1
  img_proc: true
- pgno: 280
  md: '![](img/de3034a92496a32462134266292a51dd_280_0.png)


    By default, the Magento 2 sample data includes four cart price rules:


    +   - $4 Luma water bottle (save 70%)

    +   - Buy 3 tee shirts and get the 4th free

    +   - Spend $50 or more – shipping is free!

    +   - 20% OFF Ever $200-plus purchase!*'
  merge: -1
  img_proc: true
- pgno: 281
