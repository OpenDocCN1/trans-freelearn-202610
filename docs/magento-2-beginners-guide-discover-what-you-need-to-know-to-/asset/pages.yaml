    \ vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4/config.xml\n```\n\n\
    This command takes the most time to run and will map all the data from the Magento\
    \ 1 database to the new database.\n\n+   9. **Migrate changes:** If you didn't\
    \ put your store in maintenance mode, then there might be new registered customers\
    \ and new orders since the last time you migrated the data. Fortunately, the Data\
    \ Migration Tool allows you to migrate those changes to the new Magento 2 database\
    \ as well. If you put the store in maintenance mode, then this step is not necessary\
    \ since there won't be any new orders or customers.\n+   \n+   Take into account\
    \ that this step will migrate new customers and orders, but catalog changes won't\
    \ be migrated. That is why it's important to not make changes to the catalog when\
    \ you decide to move forward with the migration.\n+   \n+   As in the previous\
    \ commands, we'll use the Magento Command Line Tool and we'll specify the path\
    \ to the Data Migration Tool configuration file:\n\n```\nphp bin/magento migrate:delta\
    \ <path to Data Migration Tool configuration file>\n```\n\nThe final command to\
    \ run is then:\n\n```\nphp bin/magento migrate:delta vendor/magento/data-migration-tool/etc/ce-to-ce/1.9.2.4/config.xml\n\
    ```\n\nThe delta migration will map the changes between your Magento 1 and Magento\
    \ 2 databases in real time. You can stop the delta migration by pressing *Ctrl\
    \ + C*."
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Summary


    In this chapter, we reviewed the process of migrating from Magento 1 to Magento
    2, including preparing custom and third-party extensions for Magento 2, and migrating
    all the information from the database to the new version of Magento. In the next
    chapter, we will review the process of creating a product in Magento 2.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# # Creating Your First Product,

    ## Images, Inventory, and Prices


    In this chapter, you will be adding your first product to Magento 2, which is
    one of the most frequent tasks for a Magento administrator.


    We will cover:


    +   - Adding a product to the Magento catalog

    +   - Working with images

    +   - Working with Magento’s pricing possibilities


    # ## Adding your first product


    Congratulations! You are about to add your first product in Magento 2, which is
    a big step forward in the learning curve of Magento.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Creating Your First Product, Images, Inventory, and Prices


    First, you should log in to the admin panel using your username and password.
    Once you do that, you should see the PRODUCTS menu item on the left sidebar:


    ![](img/de3034a92496a32462134266292a51dd_86_0.png)


    You should go to the PRODUCTS | Catalog submenu item to open the Catalog grid.
    When the page loads, you will see the Add Product button in the top-right of the
    screen:


    ![](img/de3034a92496a32462134266292a51dd_86_1.png)'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Creating Your First Product, Images, Inventory, and Prices


    When you click on that button, you will be redirected to the **New Product** form.
    You should see the following form on screen:


    ![](img/de3034a92496a32462134266292a51dd_87_0.png)


    We will go through each of the fields on that page to describe how to add the
    information for your new product:


    +   - General information:

    +     - **Enable Product**: This is the status for the product.

    +     - **Attribute Set**: This refers to the group of attributes that are assigned
    to this product. We will cover this in detail in the next chapter.

    +     - **Product Name**: This is the name of the product.

    +     - **SKU**: This is the unique identifier of the product.

    +     - **Price**: This is the regular price of the product.

    +     - **Tax Class**: This refers to the tax rules associated to this product.

    +     - **Quantity**: This is the number of items in the inventory for the product.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '+   - **Stock Status:** This is a setting to mark the product as **in-stock**
    or **out-of-stock**.

    +   - **Weight:** This is the weight of the product (if applicable).

    +   - **Visibility:** This marks the product as visible in the catalog and/or
    search.

    +   - **Categories:** These set categories associated with the module.

    +   - **Set Product as New From:** This marks the product as new in between the
    selected date.

    +   - **Country of Manufacture:** This specifies the country of manufacture for
    the product.


    +   - **Content:**

    +     - **Description:** This is the description of the product.

    +     - **Short Description:** This is a short version of the description for
    the product.


    +   - **Configurations:**

    +     - **Create configurations:** This creates a configurable product. This will
    be described in a chapter later in the book.


    +   - **Images and Videos:**

    +     - **Add video:** This can be used to add a video for the product.

    +     - **Browse to find or drag images here:** This is used to add multiple images
    to the product.


    +   - **Search Engine Optimization:**

    +     - **URL Key:** This specifies the URL for this product. For example, if
    you specify `sample-product` as the URL Key, then the URL for the product will
    be `http://magento2-playground.dev/sample-product.html`.

    +     - **Meta Title:** This is the title meta tag for the product. This will
    be the title displayed in the search results in search engines, such as Google.

    +     - **Meta Keywords:** These are the keywords meta tag for the product. They
    are the keywords that the search engines will consider for the product detail
    page.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '+   - **Meta Description:** This is the description meta tag for the product.
    This will be the description below the title in the search engine results.


    +   - **Related Products, Up-Sells, and Cross-Sells:**

    +     - **Related Products:** The related products are a set of product recommendations
    that the customer may want to buy based on the product that he/she is currently
    viewing. Those products are displayed in the product detail pages, as shown in
    the following screenshot:


    ![](img/de3034a92496a32462134266292a51dd_89_0.png)


    +   - **Up-Sell Products:** The up-sell products are more expensive products from
    the same product family. For example, if the customer is viewing a monitor, the
    up-sells will suggest more expensive monitors in the product detail page.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '+   - The up-sells are associated to the current product and are displayed
    in the product detail page, as follows:


    ![](img/de3034a92496a32462134266292a51dd_90_0.png)


    +   - **Cross-Sell Products:** Cross-sells are displayed to the customer in the
    shopping cart page. A cross-sell can be seen in the supermarket waiting line,
    right before placing the order. At that time, you will see products that the supermarket
    places in that specific location to try to convince you to buy more. Just like
    the supermarket, the cross-sell products in Magento are intended to convince the
    customer to buy more products before placing the order.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'The cross-sell products are displayed in the shopping cart, as follows:


    ![](img/de3034a92496a32462134266292a51dd_91_0.png)


    +   - **Customizable options:**

    +     - **Add Option**: This adds custom options to the product. The following
    field types are available for the customizable options:

    +       - Text field

    +       - Text area

    +       - File

    +       - Dropdown

    +       - Radio buttons

    +       - Checkbox

    +       - Multiple select

    +       - Date

    +       - Date and time

    +       - Time

    +   - **Product in Website:**

    +     - **Websites**: If your Magento store has multiple views, you can set the
    product to be associated with specific views.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '+   - **Design:**

    +     - **Layout:** This is used to set a specific layout for the product detail
    page:

    +       - **Empty**

    +       - **1 column**

    +       - **2 columns with left bar**

    +       - **2 columns with right bar**

    +       - **3 columns**

    +     - **Display Product Options In:** This sets a specific location for the
    product options:

    +       - **Product Info Column**

    +       - **Block after Info Column**

    +     - **Layout Update XML:** This adds custom XML configuration for the product
    layout, such us custom style sheets for the product detail page

    +     - **Schedule Design Update:**

    +       - **Schedule Design From – To:** This is a schedule custom design to be
    applied in a specific range of dates

    +       - **New Theme:** This sets a specific theme for the product detail page
    on the scheduled date

    +       - **New Layout:** This sets a specific layout for the product detail page
    on the scheduled date:

    +         - **Empty**

    +         - **1 column**

    +         - **2 columns with left bar**

    +         - **2 columns with right bar**

    +         - **3 columns**

    +     - **Gift Options:**

    +       - **Allow Gift Message:** This allows the customer to set a gift message
    on this product'
  merge: -1
  img_proc: true
- pgno: 93
  md: '+   - **Downloadable Information:**

    +     - **Is this a downloadable Product?:** This option is only available if
    the weight property for the product has been set to **The item has no weight**.
    You can add links and samples if the product is a downloadable product.


    Now that we have reviewed all the fields for the **New Product** page, we will
    create our first product.


    We will create a simple product with the following information:


    # General Information:


    +   - **Enable Product:** Yes

    +   - **Attribute Set:** Default

    +   - **Product Name:** `Red Shirt`

    +   - **SKU:** `Red-shirt`

    +   - **Price:** `$50.00`

    +   - **Tax Class:** Taxable goods

    +   - **Quantity:** `100`

    +   - **Stock Status:** In stock

    +   - **Weight:** `25 lbs`

    +   - **Visibility:** Catalog, Search

    +   - **Categories:** Default Category | Men | Tops


    # Content:


    +   - **Description:** This is the long description of the product

    +   - **Short Description:** This is the short description of the product'
  merge: -1
  img_proc: true
- pgno: 94
  md: '+   - **Images and Videos:**

    +     - Upload two images for this product

    +     After filling this information for the product, click on **Save**. You will
    see the following message on screen:


    ![](img/de3034a92496a32462134266292a51dd_94_0.png)


    Now, it is time to see our product on the website.

    First, go to the home page: http://magento2-playground.dev/.


    Next, go to the Men | Tops category (the new product was associated with that
    category). You will see the new product as the first one in the grid:'
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/de3034a92496a32462134266292a51dd_95_0.png)


    If you click on that product, you will be redirected to the product detail page.
    There, you will see all the information that we added to the product in the new
    product form:


    ![](img/de3034a92496a32462134266292a51dd_95_1.png)'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Working with images


    In the last section, you created your first product in Magento 2. You might be
    wondering how you can assign different images for the product listing page, product
    detail page, and shopping cart. Magento 2 provides the ability to specify a different
    image for each of those locations, and we will cover this concept in this section.


    If you go back and open the product that you created in the admin panel, you will
    see something similar to the following screenshot:


    ![](img/de3034a92496a32462134266292a51dd_96_0.png)


    On the top of each image thumbnail, you will see two icons:


    +   - **Eight dots in the top-left of the thumbnail:** You can simply drag and
    drop the thumbnails to set the order of the images on the product detail page

    +   - **Trash icon in the bottom-left of the thumbnail:** You can remove the image
    by clicking on this icon


    Below each image thumbnail, you will see the following things:


    +   - General information for the image, such us the image size and resolution.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '+   - Labels indicating the location of the image. These labels can be as follows:

    +     - **Base**

    +     - **Small**

    +     - **Thumbnail**

    +     - **Swatch**


    Now, let''s review each of the locations to understand what they mean:


    +   - **Base image:** The base image is displayed as the main image on the product
    detail page. The zoom is activated if the uploaded image is larger than the image
    container.

    +   - **Small image:** The small image is used in several places, including the
    product listing page, search results page, related products, and up-sells block.

    +   - **Thumbnail:** The thumbnail image is displayed on the shopping cart page
    and the cross-sells block.

    +   - **Swatch:** The swatch image is an illustrative image that represents a
    color, texture, or pattern for the product.


    If you click on the image thumbnail, the **Image Detail** model will appear from
    the left with the configuration for that specific image, as seen in the following
    screenshot:


    ![](img/de3034a92496a32462134266292a51dd_97_0.png)'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'In the **Image Detail** model, you can update the following image configuration:


    +   - **Alt Text**: The Alt Text is an attribute that is recommended for SEO.
    It helps the search engines to understand the content of your image. In addition,
    the **Alt Text** is displayed in the browser as a popover on mouseover.

    +   - **Role**: You can associate the image with the specific roles that we described
    before, such as **Base, Small, Thumbnail,** and **Swatch**.

    +   - **General Information for the Image**: This refers to **Image Size** and
    **Image Resolution**.

    +   - **Hide from Product Page**: You can mark this image to not be displayed
    on the product detail page.


    # Working with Magento’s pricing possibilities


    You may have seen the **Advanced Pricing** link on the **New Product** page. If
    you haven''t, you can see that link right below the **Price** field:


    ![](img/de3034a92496a32462134266292a51dd_98_0.png)'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Creating Your First Product, Images, Inventory, and Prices


    If you click on that link, the **Advanced Pricing** model will be displayed on
    screen, allowing you to set advanced pricing rules for the product:


    ![](img/de3034a92496a32462134266292a51dd_99_0.png)'
  merge: -1
  img_proc: true
