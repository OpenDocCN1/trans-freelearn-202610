- pgno: 101
  md: '+   - **Cost:** This is the information for the administrator representing
    the cost of the product.

    +   - **Tier Price:** This is the discounted price for the product based on the
    website, customer group, and purchased quantity.

    +   - **Manufacturer''s Suggested Retail Price:** This is the Minimum Advertised
    Price for the product.

    +   - **Display Actual Price:** With this option, you can select where the **Manufacturer''s
    Suggested Retail Price (MSRP)** should be displayed:

    +     - **On Gesture:** When this option is selected, the MSRP is displayed in
    the product listing and product detail pages. In addition, a **Click for price**
    link is added next to the MSRP price, which opens a popover that includes more
    information about the price of the product. This is what the **On Gesture** option
    looks like in the product listing page:


    ![](img/de3034a92496a32462134266292a51dd_101_0.png)'
  merge: -1
  img_proc: true
- pgno: 102
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/de3034a92496a32462134266292a51dd_103_0.png)


    And this is how it looks in the product detail page:


    ![](img/de3034a92496a32462134266292a51dd_103_1.png)'
  merge: -1
  img_proc: true
- pgno: 104
  md: '+   - **Before Order Confirmation**: The final price is displayed in the last
    step of the checkout. The MSRP and a message are displayed in the product listing,
    product details, and **Shopping Cart** pages to notify the customer about the
    price information in the checkout. Here''s the way the MSRP and message are displayed
