  md: '# Hierarchy


    As we have seen before, you can set the hierarchy for the categories by selecting
    the parent category before creating the subcategory. Magento allows you to manage
    the hierarchy for the categories easily, and we will review how to update the
    category tree to change the parent and child categories.


    On the category tree, you will see that there is a plus icon next to some of the
    categories:


    ![](img/de3034a92496a32462134266292a51dd_188_0.png)'
