- pgno: 55
  md: '# Installation


    The first step is to log in to the server using the private key file that you
    downloaded from the Setup Wizard.


    To log in, you need to know the public DNS or the public IP for the instance.
    You can get those values from the AWS EC2 Management Console:


    +   1. Go to the `https://console.aws.amazon.com/ec2/` AWS EC2 Management Console.

    +   2. You will see the instance that we just created in the list. Scroll to the
    right in the table to find the **Public DNS** and the **Public IP** for the instance:


    ![](img/de3034a92496a32462134266292a51dd_55_0.png)


    +   3. Before logging in to the server, we should give the right permissions to
    the private key file. Locate the file in the Terminal and run the following command:


    ```

    chmod 400 ~/Key Pairs/sample.pem

    ```'
  merge: -1
