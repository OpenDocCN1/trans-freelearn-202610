- pgno: 233
  md: '+   - **CAPTCHA:**

    +     - **Enable CAPTCHA on Storefront:** You can enable and configure CAPTCHA
    for the following forms:

    +       - Create user

    +       - Login

    +       - Forgot password

    +       - Checkout as guest

    +       - Register during checkout

    +       - Contact us

    +       - Change password


    # CUSTOMERS | Persistent Shopping Cart


    +   - **General Options:**

    +     - **Enable Persistence:** If you enable this setting, the customers will
    be able to keep their products in the cart after leaving the website or logging
    out from their account. The customers will still have the products in the cart
    the next time they visit the store.

    +     - **Persistence Lifetime (seconds):** This is the time period for which
    the cookie that saves the customer data will be stored. 31,536,000 seconds is
    equal to 1 year, and that''s the maximum value allowed.

    +     - **Enable “Remember Me”:** Display the **Remember Me** checkbox in the
    login page

    +     - **“Remember Me” Default Value:** Indicates whether or not the **Remember
    Me** checkbox should be checked by default.

    +     - **Clear Persistence on Sign Out:** Clear the products that are in the
    customer''s shopping cart after customer logout.

    +     - **Persist Shopping Cart:** Keep the persistent cookie after the session
    expires. For example, if a guest user adds products to the cart and the session
    cookie expires, then the shopping cart items will be still there.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# SALES | Sales


    +   - **Reorder:**

    +     - Allow Reorder: If this setting is enabled, the “Reorder” link will appear
    for the customer to be able to place the same order again

    +   - **Gift Options:**

    +     - Allow Gift Messages on Order Level: Allow customers to specify gift messages
    for orders

    +     - Allow Gift Messages for Order Items: Allow customers to specify gift messages
    for order items


    # Sales – Tax


    +   - **Calculation Settings:**

    +     - Tax Calculation Method Based On: There are three calculation methods for
    taxes:

    +       - Unit Price: The tax will be calculated for each unit

    +       - Row Total: The tax will be calculated for each item

    +       - Total: The tax will be calculated from the order total

    +     - Tax Calculation Based On: You can select which address type to consider
    as the location to calculate the taxes

    +       - Shipping Address

    +       - Billing Address

    +       - Shipping Origin

    +     - Catalog Prices: Specify if the prices in the catalog include taxes or
    not

    +     - Shipping Prices: Specify whether the shipping prices entered from the
    Magento admin panel or retrieved from gateways include taxes or not

    +     - Apply Customer Tax: Specify whether taxes should be calculated before
    or after discount

    +     - Apply Discount On Prices: If “Apply Customer Tax after Discount” is selected
    in the previous field, then you can specify if the discount on prices should include
    taxes or not'
  merge: -1
  img_proc: true
