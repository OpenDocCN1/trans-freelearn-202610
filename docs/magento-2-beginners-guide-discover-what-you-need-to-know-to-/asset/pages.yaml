- pgno: 367
  md: '# Reports


    +   - **Marketing | Newsletter Problems Report:** If there are errors in the newsletter
    delivery, you will be able to see and review those errors from this report, and
    all the details about the errors will be located in the log file in the `var/log`
    folder.

    +   - **Reviews | By Customers / By Products:** With these reports, you will be
    able to take a closer look at the statistics of the reviews in your store, grouping
    the statistics for those reviews by customers or by products.

    +   - **Sales | Orders / Tax / Invoiced / Shipping / Refunds / Coupons:** See
    all the statistics related to orders, tax rates, invoices, shipping, credit memos,
    and coupons in your store. For all reports, there is a filter to see the report
