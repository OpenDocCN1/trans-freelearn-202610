- pgno: 119
  md: '# Attribute Sets and Custom Attributes


    Attributes are grouped by attribute sets. The attribute sets represent a list
    of attributes that are related to a specific product family. For example, the
    **Sleeve Length** attribute should be part of the **Shirt** attribute set. Therefore,
    that specific attribute for clothing is available only for products that are associated
    with the **Shirt** attribute set.


    If you add a new attribute and you want the attribute to be available for most
    of the products, then you can associate it with the **Default** attribute set.


    You can see a list of attribute sets by going to the next section in the admin
    panel, that is, **Stores | Attributes | Attribute Sets**, as shown:


    ![](img/de3034a92496a32462134266292a51dd_119_0.png)'
  merge: -1
  img_proc: true
- pgno: 120
  md: "# Attribute Sets and Custom Attributes\n\nIf you click on the **Default** attribute\
    \ set, you will open the form to edit that attribute set specifically:\n\n![](img/de3034a92496a32462134266292a51dd_120_0.png)\n\
    \nYou will see a form with the following three columns:\n\n+   - **Edit Attribute\
    \ Set Name:** This updates the name for the attribute set.\n+   \n+   - **Groups:**\
    \ This specifies the list of attributes that are associated with this attribute\
    \ set. These attributes are contained in different groups for easier product management.\n\
    +   \n+   - **Unassigned Attributes:** This is a list of attributes that are not\
    \ associated with this attribute set. You can drag and drop the attributes from\
    \ this list to the **Groups** list to associate them with an attribute set."
  merge: -1
  img_proc: true
