- pgno: 170
  md: '4. Add a sample image for this product:


    ![](img/de3034a92496a32462134266292a51dd_170_0.png)


    5. You can now add the specific details for the downloadable product. The Downloadable
    Information section contains the following:


    +   - **Links**: This allows you to specify the downloadable links for this product.
    The links are displayed when the product is purchased.

    +   - **Samples**: This allows you to add samples for the downloadable product
    that will be displayed in the product details page.


    6. Let''s add a link and a sample for the downloadable product. Click on Add Link
    in the Links container, and set the following information:


    +   - **Title**: Sample Link

    +   - **File**: URL | http://url.dev/file

    +   - **Sample**: URL | http://url.dev/sample

    +   - **Shareable**: No

    +   - **Max. Downloads**: 100'
  merge: -1
