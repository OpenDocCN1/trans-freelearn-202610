- pgno: 224
  md: "+   - **DebugShowException**—used to test the actual MCMS data together with\
    \ the current configured stylesheet. If exceptions occur, they will be displayed\
    \ in clear text—something you would avoid on a production site.\n+   - **Production**—similar\
    \ to DebugShowException but hides the exception details and displays a friendly\
    \ error message.\n\n```\n#region declarations - enumerations, constants and private\
    \ variables\n\n// The mode of the Web Part used for troubleshooting and exception\
    \ handling.\npublic enum enumMode\n{\n    DebugWithTestData,   // Render the Web\
    \ Part using the XSLT and TestXml\n    DebugShowXml,        // Output the XML\n\
    \    DebugShowException,  // If an exception is thrown return the details\n  \
    \  Production           // Mode for running in production, suppress error\n  \
    \                       // messages.\n}\n```\n\nThe second enumeration, enumSortBy,\
    \ specifies the sort order of the channel items returned by MCMS:\n\n```\npublic\
    \ enum enumSortBy\n{\n    Default,      // No Sort\n    ChangeDate,\n    DisplayName,\n\
    \    DisplayPath,\n    ExpiryDate,\n    Importance,\n    Ordinal,\n    StartDate\n\
    }\n```\n\n```\n#endregion\n```\n\nIn the next step, we define the custom properties\
    \ for the Web Part. Each public property will get and set a private variable and\
    \ will also have a default value. The following table shows the Web Part Framework\
    \ attributes assigned to each of the public properties:\n\n| Attribute Name |\
    \ Description |\n|---|---|\n| Browsable | Must be set to True for the custom property\
    \ to appear in the ToolPane. |\n| Category | Defines the grouping in the ToolPane.\
    \ If this value is left empty or is not defined, the category will be Custom Properties.\
    \ |\n| DefaultValue | The value of the Web Part will be stored in the Web Part\
    \ storage system if it differs from this attribute. |\n| Description | The tooltip\
    \ that will be displayed over the friendly name in the ToolPane. |\n| FriendlyName\
    \ | The name that will be displayed in the ToolPane. |\n| ReadOnly | If this is\
    \ set to True, the custom property will be displayed in the ToolPane but the user\
    \ will be unable to modify it. |\n| WebPartStorageAttribute | Custom properties\
    \ can be stored at a per-user level by setting this to Storage.Personal or on\
    \ a global level by using Storage.Shared. If it is set to Storage.None the value\
    \ will not be stored in the Web Part storage system and the property will not\
    \ appear in the ToolPane. |"
  merge: -1
  img_proc: true
- pgno: 225
  md: "Required properties for our Web Part are the mode it should be running in (Mode),\
    \ the column to use for sorting (SortBy), the channel that should be enumerated\
    \ (StartChannel), and a property to define the XSLT stylesheet to be used for\
    \ rendering (PresentationXsl).\n\nWe'll also have a property (TestXml) that is\
    \ only used in DebugWithTestData mode. This property will allow us to configure\
    \ the test XML data to be used when debugging the XSLT stylesheet.\n\n```\n```csharp\n\
    #region properties\n\n// Declare the private variables for the Mode property\n\
    // By default we run the Web Part in Production mode (suppressing exceptions)\n\
    const NavigationWebPart.enmMode _ModeDefault =\n    NavigationWebPart.enmMode.Production;\n\
    private NavigationWebPart.enmMode _Mode = _ModeDefault;\n\n// Set the attributes\
    \ for the property\n[ Browsable(true) ]\n[ Category(\"MCMS Listing Mode\") ]\n\
    [ DefaultValue(_ModeDefault) ]\n[ Description(\"The mode of the Webpart.\") ]\n\
    [ FriendlyName(\"Mode\") ]\n[ WebPartStorageAttribute(Storage.Shared) ]\npublic\
    \ NavigationWebPart.enmMode Mode\n{\n    get{ return _Mode; }\n    set{ _Mode\
    \ = value; }\n}\n```\n```\n\nThe SortBy property sets the sort order of the channel\
    \ items returned by MCMS. By default the channel items will be sorted by ordinal.\n\
    \n```\n```csharp\n// Declare the start channel private variables\nconst NavigationWebPart.enmSortBy\
    \ _SortByDefault =\n    NavigationWebPart.enmSortBy.Ordinal;\nprivate NavigationWebPart.enmSortBy\
    \ _SortBy = _SortByDefault;\n\n// Set the attributes for the property\n[ Browsable(true)\
    \ ]\n[ Category(\"MCMS Listing Configuration\") ]\n[ DefaultValue(_SortByDefault)\
    \ ]\n[ Description(\"The Sort order of the Webpart.\") ]\n[ FriendlyName(\"Sort\
    \ By\") ]\n[ WebPartStorageAttribute(Storage.Shared) ]\npublic NavigationWebPart.enmSortBy\
    \ SortBy\n{\n    get{ return _SortBy; }\n    set{ _SortBy = value; }\n}\n```\n\
    ```\n\nThe StartChannel property sets the path of the channel whose child items\
    \ (channels and/or postings) we will list:\n\n```\n```csharp\n// Declare the start\
    \ channel private variables, default is /Channels/\nconst string _StartChannelDefault\
    \ = \"/Channels/\";\nprivate string _StartChannel = _StartChannelDefault;\n\n\
    // Set the attributes for the property\n[ Browsable(true) ]\n[ Category(\"MCMS\
    \ Listing Configuration\") ]\n[ DefaultValue(_StartChannelDefault) ]\n[ Description(\"\
    The channel to list the child items of.\") ]\n[ FriendlyName(\"Start Channel\"\
    ) ]\n[ WebPartStorageAttribute(Storage.Shared) ]\npublic string StartChannel\n\
    ```\n```"
