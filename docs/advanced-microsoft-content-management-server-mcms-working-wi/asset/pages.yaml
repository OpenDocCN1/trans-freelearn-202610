    ```\n\nNow that we know how to identify links to deleted resources, we can remove\
    \ them! Let's start with links within ImagePlaceholders and AttachmentPlaceholders.\n\
    \n> In the example above, we have hard-coded the administrator’s user ID and password\
    \ into the code for simplicity. It's probably a better idea to store it within\
    \ a web.config file and have the password encrypted. Alternatively, store the\
    \ user ID and password in a file in another folder and protect it using Windows\
    \ security measures.\n\n# Removing Links from ImagePlaceholders and AttachmentPlaceholders\n\
    \nRemoving links from ImagePlaceholders and AttachmentPlaceholders is fairly simple.\
    \ We first check the values of the ImagePlaceholder.Src and AttachmentPlaceholder.Url\
    \ properties to see if they contain links to a deleted resource by running their\
    \ values through the IsResourceDeleted() method. If the link does indeed point\
    \ to a deleted resource, we set the ImagePlaceholder.Src and AttachmentPlaceholder.Url\
    \ values to empty strings.\n\nThe HandleImgAndAttPlaceholderTypes() method below\
    \ shows how it is done. Links to internal resources always begin with /nr/rdonlyres/\
    \ so we only need to consider links that start with it. Add the following code\
    \ directly below the IsResourceDeleted() method."
