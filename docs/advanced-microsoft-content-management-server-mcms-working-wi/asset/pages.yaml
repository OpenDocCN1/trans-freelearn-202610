- pgno: 498
  md: 'While exporting channels and postings satisfies the requirements of most websites,
    many sites make use of resources without postings. Common examples include sites
    that provide a listing of resources from a channel rendering script, such as a
    list of documents within a resource gallery. Or perhaps there are links to specific
    resources from parts of the site, like the company''s logo or a site-wide help
    file. Such links are often found in user controls or web forms. In either case,
    you will require resources not linked to postings to be exported.


    One constraint the SDAPI has is that it does not export resources directly. Only
    resources that are used by postings modified between the last deployment times
    will be exported. The only way for site administrators to export specific resources
    is to manually create the package using the Site Deployment Manager. Not only
    does this place additional work on the administrator, he or she will also have
    to keep track of when resources get updated. Should the administrator fail to
    keep up, the production site won''t get the latest information on time.


    In this section, we present a solution that exports resources using the SDAPI,
    regardless of whether or not they have been used within a posting. Here''s the
    plan:


    +   - We know that resources will never be exported unless they are used by a
    posting that has been modified after the last deployment. Working along these
    lines, we programmatically create a service posting and create hyperlinks to all
    resources we wish to export in one of its placeholders.

    +   - Since the resources are now used within a posting that has been just created
    (and therefore modified since the last deployment), the export SDAPI script will
    create a package containing both the service posting and all resources linked
    to it.

    +   - Once the export package has been created, the service posting is deleted.


    # The SDAPIResourceExport Project


    To create the export package with resources and run the export process, let''s
    create a Visual C# Console Application project. Name the project SDAPIResourceExport
    and store it in a suitable location on your disk (such as c:\). Rename the generated
    class1.cs file to ResourceExport.cs.


    We will assume that the export process will be executed on the source MCMS server
    itself. Add a reference to the COM MSCMS Site Deployment (Server-side) library
    (note the ''S'' in ''MSCMS''). You can of course choose to run the script on the
    destination server. If you wish to do so, choose the MCMS Site Deployment (Client-side)
    library instead.


    In addition, add references to the following .NET libraries (found in the <install
    directory>/Microsoft Content Management Server/Server/bin/ directory):


    +   - Microsoft.ContentManagement.Common

    +   - Microsoft.ContentManagement.Publishing

    +   - Microsoft.ContentManagement.Publishing.Extensions.Placeholders


    Next, add the namespaces that are required for the solution as highlighted below:


    ```

    using System;

    using System.Diagnostics;

    using Microsoft.ContentManagement.Publishing;

    using Microsoft.ContentManagement.Publishing.Extensions.Placeholders;

    using SITEDEPLOYSERVERLib;

    ```'
  merge: -1
  img_proc: true
