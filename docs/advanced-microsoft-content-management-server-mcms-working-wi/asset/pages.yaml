- pgno: 500
  md: "```\nbool RecursiveExport = true;\n\n// Create new AppContext in update mode\n\
    CmsApplicationContext appContext = new CmsApplicationContext();\nappContext.AuthenticateAsCurrentUser(PublishingMode.Update);\n\
    ```\n\n# Collecting Resources\n\nNext, we get an instance of the resource gallery\
    \ that contains the resources we wish to export. We write a helper method named\
    \ CollectResources() that returns the HTML consisting of hyperlinks to the resources\
    \ in the gallery. Later on, we will store this HTML in the service posting.\n\n\
    ```\nstatic void Main(string[] args)\n{\n    . . . code continues . . .\n\n  \
    \  // Get an instance of the resource gallery\n    ResourceGallery rsg = appContext.Searches.GetByPath(StartResourceGallery)\n\
    \                               as ResourceGallery;\n\n    // Start the iteration\
    \ process\n    Console.Write(\"Collecting resources....\");\n    string imageString\
    \ = CollectResources(rsg, RecursiveExport);\n    Console.WriteLine(\"Done.\");\n\
    }\n```\n\nThe CollectResources() method accepts two input parameters. The first\
    \ is the resource gallery itself and the second is a Boolean indicating whether\
    \ or not the method should recursively search for resources in sub-galleries.\
    \ Each resource found is added as a hyperlink to the HTML. When the method finishes,\
    \ we will have a complete listing of hyperlinks to all resources that we would\
    \ like to export.\n\n```\nstatic string CollectResources(ResourceGallery gallery,\
    \ bool recurse)\n{\n    // The string containing a list of hyperlinks to each\
    \ resource\n    string resString = \"\";\n\n    // Call this function recursively\
    \ for each child gallery\n    // if the boolean is true\n    if (recurse)\n  \
    \  {\n        foreach (ResourceGallery rsg in gallery.ResourceGalleries)\n   \
    \     {\n            resString += CollectResources(rsg, recurse);\n        }\n\
    \    }\n\n    foreach (Resource item in gallery.Resources)\n    {\n        resString\
    \ += \"<a href=\\\"\" + item.Url + \"\\\">\" + item.Path + \"</a><br>\";\n   \
    \ }\n    return resString;\n}\n```\n\n# Creating the Service Posting\n\nNow that\
    \ we have an HTML string that contains the list of resources for export, we need\
    \ to store it in a service posting. The helper method that does this is the CreatePosting()\
    \ method. It accepts the CmsApplicationContext object and the HTML string value\
    \ as input parameters. It returns an instance of the service posting that has\
    \ been found or created."
  merge: -1
