- pgno: 328
  md: "+   - Replace any HtmlPlaceholderControl that requires validation with this\
    \ control and bind it to an HtmlPlaceholderDefinition.\n+   - Add the RequiredHTMLPHValidator\
    \ control and set its ControlToValidate property to the HtmlPHWithValidation control\
    \ you wish to validate. Give it an appropriate error message (such as Please enter\
    \ more than 50 characters). In addition, set the MinLength property to 50.\n\n\
    On the next save, notice that the placeholder content can't be saved unless you\
    \ have entered more than 50 characters of text (not inclusive of tags and non-breaking\
    \ spaces).\n\n# Canceling the Save Operation\n\nIn the example above, we validated\
    \ an HtmlPlaceholderControl and saved its contents only if it contained more than\
    \ 50 characters of text. However, did you notice that content from regular placeholder\
    \ controls continued to be saved? We have only prevented the HtmlPHWithValidation's\
    \ content from being saved. The rest of the page went on to be saved back to the\
    \ repository.\n\nWhat if you had chosen the Save and Exit option? Instead of canceling\
    \ the save of the entire page, the page toggles back to the AuthoringUnpublished\
    \ mode without informing the author that placeholder content has not been saved.\
    \ Clearly, authors won't be too pleased to find out that all their hard work has\
    \ disappeared simply because they left one placeholder blank.\n\nTo get around\
    \ these issues, we will modify all buttons that perform saves in the Web Author\
    \ Console to:\n\n+   - Check to see if there are validation controls on the page.\
    \ If there are, call for the page to be validated.\n+   - Raise an error should\
    \ the page contain invalid content, canceling the entire save operation.\n+  \
    \ - Display an error message on screen, informing authors that the save operation\
    \ has failed.\n\nLet's start by modifying the Save and Exit button. We will alter\
    \ the original behavior of the button by overriding the PerformActionBehavior()\
    \ method to check to see if the page contains invalid content. If it does, we\
    \ will cancel the save and display an error message in the Error Console. Otherwise,\
    \ we proceed with the save.\n\nIn the ValidatedReeditSaveAndExitAction.cs class\
    \ file, add the following overridden PerformActionBehavior() method directly below\
    \ the ActionJavascript property:\n\n```\nprotected override void PerformActionBehavior()\n\
    {\n    // Get the current CmsHttpContext\n    CmsHttpContext cmsContext = CmsHttpContext.Current;\n\
    \    // Get the current Web Author Context\n    WebAuthorContext wac = WebAuthorContext.Current;\n\
    \    // Check to see if there are validation controls on the page\n    if (Page.Validators.Count\
    \ > 0)\n    {\n        // Validation Controls exist. Validate the page.\n    \
    \    Page.Validate();\n        // Check to see if the page is valid.\n       \
    \ if (Page.IsValid)\n```"
