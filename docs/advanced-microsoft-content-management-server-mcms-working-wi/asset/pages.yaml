  md: "```\n```csharp\n{\n    url += cmsContext.RootChannel.QueryStringModeUpdate;\n\
    }\nreturn url;\n}\n```\n```\n\nThe next time a URL is requested from the ChannelItem.Url\
    \ property (or any of the properties that generate URLs), the querystring includes\
    \ the two additional parameters:\n\n```\n```text\nhttp://localhost/cmsexplorer/default.aspx?\n\
    CMSObject=Templates&\n\nNRMODE=Unpublished&\nFRAMELESS=true&\nCMSObjectGuid=%7b4D1912B-9DD3-11D1-B44E-\n\
    006097071264%7d&NRNODEGUID=%7bE4D19123-9DD3-11D1-B44E-006097071264%7d\n```\n```\n\
    \nPrepareUrl() will be used to generate URLs later as we work through the CMS\
    \ Explorer code.\n\n# Specifying the Parent Container\n\nIn this example we plan\
    \ to use a DataGrid to display a list of all the objects in the selected container.\
    \ However, before we can get the DataGrid to display a list of objects, we need\
    \ to specify a parent container. The parent container will be a channel, resource\
    \ gallery, or template gallery. We'll need this container to determine the objects\
    \ to be displayed in the DataGrid. If the user hasn't specified a parent container,\
    \ we use the root containers (i.e. the Channels channel, the Templates template\
    \ gallery, and the Resources resource gallery).\n\nAbove and within the Page_Load()\
    \ event handler, add the following code:\n\n```\n```csharp\n// the current CmsHttpContext\n\
    private CmsHttpContext cmsContext;\n\n// the parent container whose contents we\
    \ are displaying\nprivate HierarchyItem startItem;\nprivate void Page_Load(object\
    \ sender, System.EventArgs e)\n{\n    cmsContext = CmsHttpContext.Current;\n\n\
    \    // Get the URL of the current page\n    string currentUrl = HttpContext.Current.Request.Url.ToString();\n\
    \n    // Redirect if not in unpublished mode\n    if (cmsContext.Mode != PublishingMode.Unpublished\n\
