  md: "```\n/// <summary>\n/// Overridden render method that calls the\n/// GenerateRssXml\
    \ method and writes it to the output stream.\n/// </summary>\n/// <param name=\"\
    writer\"></param>\nprotected override void Render( HtmlTextWriter writer)\n{\n\
    \    // change the page response to XML instead of HTML\n    Response.ContentType\
    \ = \"text/xml; charset=utf-8\";\n\n    // Write the GenerateRssXml's response\
    \ to the response stream.\n    writer.Write(GenerateRssXml());\n}\n```\n\n# Defining\
    \ Global Settings in the Web.config\n\nFor flexibility, we need to define several\
    \ variables in the <appSettings> element of the Web.config for use by the methods\
    \ in rss.aspx.cs. The settings specified in the Web.config will apply to the entire\
    \ site.\n\nWithin the <configuration> element in the Web.config, add the <appSettings>\
    \ element and the following keys:\n\n```\n<configuration>\n  <appSettings>\n \
    \   <add key=\"RSS_Summary_PlaceholderName\" value=\"Summary\" />\n    <add key=\"\
    RSS_Title\" value=\"Tropical Green's Website\" />\n    <add key=\"RSS_WebsiteUrl\"\
    \ value=\"http://www.tropicalgreen.net\" />\n    <add key=\"RSS_Copyright\" value=\"\
    © Tropical Green 2005\" />\n    <add key=\"RSS_Description\" value=\"The latest\
    \ changes from the Tropical Green Website.\" />\n    <add key=\"RSS_ManagingEditor\"\
    \ value=\"content@tropicalgreen.net\" />\n    <add key=\"RSS_WebMaster\" value=\"\
    webmaster@tropicalgreen.net\" />\n    <add key=\"RSS_StartChannel\" value=\"/channels/www.tropicalgreen.net/\"\
    \ />\n    <add key=\"RSS_NumberOfDaysOld\" value=\"20\" />\n  </appSettings>\n\
    ... code continues ...\n```\n\nFor even more flexibility, this configuration data\
    \ could be stored in channel properties and the RSS feed could be generated by\
    \ a posting or a channel rendering script rather than a web form.\n\n# Testing\
    \ the RSS Feed\n\nTo test the feed we can load the page directly in a web browser\
    \ and see the response. To do this we will set rss.aspx as the start page and\
    \ start without debugging.\n\n+   1. Right-click on rss.aspx, and select Set as\
    \ Start Page.\n+   2. From the Debug menu, select Start Without Debugging.\n+\
    \   3. The page should now be loaded and the RSS should appear:"
