- pgno: 146
  md: 'Although we''re explaining how to create a content source both with the SearchSetup.exe
    utility and manually using the same content source names, you must choose only
    one method as it is not possible to create two content sources with the same name.


    Let''s start by creating an index of our Tropical Green website in our SharePoint
    portal:


    Refer to Appendix A for a walkthrough of the steps in creating a portal.


    +   1. Start the SharePoint Central Administration by pointing to Start | All
    Programs | SharePoint Portal Server | SharePoint Central Administration.

    +   2. Click List and manage portal site under the Portal Site and Virtual Server
    Configuration section.

    +   3. The Manage Portal Sites page contains a list of all portals in the SharePoint
    farm. Drag your mouse cursor over the right-hand side of the list and click the
    drop-down arrow that appears when the mouse cursor is over a portal and select
    Manage Portal Site Properties (as seen in the image below):

    +   4. Under the section Search Settings and Indexed Content, click the Configure
    search and indexing link.


