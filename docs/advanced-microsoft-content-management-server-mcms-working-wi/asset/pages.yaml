  md: "```\npublic void CopyPostingCustomProperties(Posting source, Posting destination)\n\
    {\n    string errorMessage = \"\";\n\n    // Copy all custom property values from\
    \ the source to the destination.\n    foreach(CustomProperty customProp in source.CustomProperties)\n\
    \    {\n        if(destination.CustomProperties[customProp.Name] != null)\n  \
    \      {\n            try\n            {\n                destination.CustomProperties[customProp.Name].Value\
    \ =\n                    customProp.Value;\n            }\n            catch\n\
    \            {\n                errorMessage += \"Failed to copy custom property\
    \ value for Custom\"\n                    + \"Property:\" + customProp.Name +\
    \ \"<br>\";\n            }\n        }\n\n        // Throw a summary of all failed\
    \ items\n        if (errorMessage != \"\")\n        {\n            throw(new Exception(errorMessage));\n\
    \        }\n    }\n}\n```\n\nA try-catch block surrounds the statement that sets\
    \ the custom property value. This traps any exceptions that may occur during the\
    \ copying process. There's a possibility of exceptions occurring as custom property\
    \ definitions are not versioned. For example, a template designer could have added\
    \ a new value to a selection type custom property definition. Trying to save a\
    \ value that is not part of the current list will generate an exception.\n\nThe\
    \ Page Revert dialog is now complete.\n\n# Adding the New Action to the Web Author\
    \ Console\n\nLet's put a button on the Web Author Console for authors to access\
    \ the Page Revert dialog that we have just built. When the user clicks on the\
    \ button, the dialog opens as a new window.\n\nAdd a class file named PageRevertButton.cs\
    \ to the project. If you are working with the downloaded Tropical Green project\
    \ from the book's companion website, add the file to the ConsoleButtons folder.\
    \ Otherwise, just add it to an appropriate location in your project.\n\nAdd the\
    \ following namespaces:\n\n```\nusing System;\nusing Microsoft.ContentManagement.Publishing;\n\
    using Microsoft.ContentManagement.WebControls.ConsoleControls;\n\nnamespace TropicalGreen.ConsoleButtons\n\
    {\n    - - - code continues - - -\n}\n```\n\nFor the author's convenience, the\
    \ Page Revert dialog will open as a new window. Therefore, our console action\
    \ will inherit from the BaseNewWindowAction class."
