  md: "4. For an object to be serialized, it must have a constructor that takes no\
    \ arguments. This default constructor is needed by the .NET Framework during serialization,\
    \ and is added by VS .NET when we create a class. However, we also need to add\
    \ the following constructor that accepts values for the public variables as its\
    \ arguments:\n\n```\n/// <summary>\n/// Instantiate the custom property setting\
    \ the Name and Current value.\n/// </summary>\n/// <param name=\"_Name\">The name\
    \ of the custom property</param>\n/// <param name=\"_Value\">The current value\
    \ of the custom property</param>\npublic LightweightCustomProperty(string _Name,\
    \ string _Value)\n{\n    this.Name = _Name;\n    this.Value = _Value;\n}\n```\n\
    \n5. The custom property values will be saved back to the relevant MCMS posting.\
    \ So let's create the Save() method, which sets the custom property's value for\
    \ the posting passed in as a parameter.\n\n```\n/// <summary>\n/// Save the custom\
    \ property value\n/// </summary>\n/// <param name=\"_Posting\">The posting to\
    \ be updated</param>\npublic void Save(Posting _Posting)\n{\n    // Get the custom\
    \ property of the posting and set the value\n    _Posting.CustomProperties[this.Name].Value\
    \ = this.Value;\n}\n```\n\nA posting may use a template with multiple custom properties\
    \ defined. To store this collection of custom properties, we will define a strongly\
    \ typed collection of LightweightCustomProperty objects called LightweightCustomPropertyCollection.\n\
    \n+   1. Create a new class in Visual Studio .NET and give it a name of LightweightCustomPropertyCollection.\
    \ Add the namespace Microsoft.ContentManagement.Publishing to it, and make it\
    \ extend System.Collections.CollectionBase.\n\n```\nusing System;\nusing Microsoft.ContentManagement.Publishing;\n\
    namespace McmsAuthoringWebService\n{\n    /// <summary>\n    /// Summary description\
    \ for LightweightCustomPropertyCollection.\n    /// </summary>\n    public class\
    \ LightweightCustomPropertyCollection\n        : System.Collections.CollectionBase\n\
    \    {\n        . . . code continues . . .\n    }\n}\n```\n\n+   2. As LightweightCustomPropertyCollection\
    \ is a strongly typed collection, the default property will be a LightweightCustomProperty.\n\
    \n```\n/// <summary>\n/// The indexed LightweightCustomProperty\n/// </summary>\n\
    public LightweightCustomProperty this[int index]\n```"
