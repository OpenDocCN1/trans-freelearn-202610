    symbols are deployed to the server.


    # Summary


    In this chapter, we''ve explored the basics of the Web Part Framework by building
    an MCMS Navigation Web Part that can display MCMS channel items from within a
    SharePoint site. In development, we utilized the Web Part templates for Visual
    Studio .NET to create our Web Part. This allows us to leverage Visual Studio .NET''s
    Server Control development architecture. Our Web Part generates an XML representation
    of the channel items and sub-channels that were found in a specified channel.
    The XML data was then transformed using a configurable XSLT stylesheet. Finally,
    we deployed our Web Part to the SharePoint server by creating a CAB file deployment
    project and running the SharePoint STSADM.EXE deployment tool.'
