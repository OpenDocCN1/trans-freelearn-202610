- pgno: 522
  md: '![](img/442e26bf28f2df81fbf8dff3478f88e3_522_0.png)


    You can download the MCMS Connector for SharePoint Technologies here:

    http://www.microsoft.com/downloads/details.aspx?FamilyID=6E9925C4-91DA-404A-86DD-78D51BCF0A51&displaylang=en


    The only question you are prompted to answer during installation (other than the
    license agreement and user information—the registration key is already provided)
    is whether to install the sample data, which includes a demo project and an SDO
    file. The SDO file will automatically be imported into your MCMS installation
    when the sample data is installed. The SDO file contains the necessary templates,
    channels, and postings used by the sample package to demonstrate the features
    of the Connector.


    # Leveraging SharePoint Portal Search within an MCMS Site


    The Connector includes three controls that enhance your MCMS templates. Two of
    these controls are used to collect search query information and to display the
    results of the query after it has been submitted to the SPS:


    +   - **SearchInputControl**: The SearchInputControl displays an input form where
    a user can enter keywords to search for.

    +   - **SearchResultControl**: The SearchResultControl is responsible for taking
    the keywords and advanced properties submitted in the SearchInputControl, constructing
    the query, and calling the SPS Search service. The control then takes the response
    from the Search Service web service and displays the search results.'
  merge: -1
  img_proc: true
- pgno: 523
  md: 'The third search control included in the Connector is:


    +   - **SearchMetaTagGenerator**: This control generates HTML META tag information
    for MCMS posting properties and custom properties. It is used in combination with
    an XML mapping file and a command-line utility to configure the SharePoint indexer.
    This allows users to implement a basic taxonomy for the search function.


    The standard and custom properties for which META tags are generated are managed
    using an XML file called SearchPropertyCollection.xml and a console application
    called SearchPropertiesSetup.exe, which configures SharePoint Portal Server search
    using the advanced properties defined by the XML file.


    The SearchPropertyCollection.xml file can be found in the following directory:

    C:\Program Files\Microsoft Content Management Server\Server\IIS_CMS\WssIntegration.


    The SearchPropertiesSetup.exe utility program can be found in the following directory:

    C:\Program Files\MCMS Connector for SharePoint Technologies\WSS\Bin.


    If SharePoint Portal Server and MCMS reside on separate physical servers, the
    SearchPropertyCollection.xml file needs to exist on both servers. The SearchInputControl
    uses this XML file on the MCMS server and the SearchPropertiesSetup.exe utility
    uses the file on the SharePoint Portal Server.


    Some configuration is necessary in order to use SPS as a search engine for your
    MCMS site. This involves creating a new content source, source group, and source
    scope within SPS. Fortunately Microsoft included another command-line utility
    program called SearchSetup.exe, which creates the new content source and site
    path rules within SPS for all top-level channels in your MCMS site.


    The SearchSetup.exe utility program can be found in the following directory: C:\Program
    Files\MCMS Connector for SharePoint Technologies\WSS\Bin.


    Refer to Chapter 5, Searching MCMS with SharePoint, for more information regarding
    MCMS and SharePoint Portal Server search integration.


    # Integrating MCMS Content into a Portal site


    By utilizing a single web part included in the Connector, you can display a list
    of postings in your SharePoint portal. The Page Listing Web Part displays the
    postings within a specified channel in one of six different list formats. The
    following three formats are hard coded in the web part:


    +   - **Page Summary List View**: This view shows all postings with a short title
    (or display name), description, last modified timestamp, and a summary image.
    This is the default view for the web part. Each item is linked to the posting''s
    published URL.


    +   - **Basic List View**: The Basic List View displays the postings as a list,
    each with an importance icon and its short title (or display name).'
  merge: -1
  img_proc: true
- pgno: 524
  md: '+   - **Detailed List View:** Very similar to the Page Summary List View, this
    view does not display a summary image but it does add the posting owner, the user
    who last modified the posting, and the status of the posting (if it''s published
    or not).


    The web part provides entries for three additional views, which are not shipped
    with the Connector. These views can be added by a site developer and completely
    tailored to his or her needs. Refer to Chapter 6, *Publishing Content Between
    MCMS and SharePoint*, for more information on creating a custom view for the Page
    Listing Web Part.


    # Publishing SharePoint Document Library Documents within an MCMS Site


    The last integration point Connector for SharePoint Technologies covers is publishing
    documents of a SharePoint (WSS or SPS) document library within an MCMS posting.
    The connector ships with a new placeholder definition and a new placeholder control:
    the **SharePointDocumentPlaceholder** definition and the **SharePointDocumentPlaceholderControl**.
    A developer can add a **SharePointDocumentPlaceholder** definition to a template
    definition and a **SharePointDocumentPlaceholderControl** to the template file
    to display files from a SharePoint document library.


    The placeholder displays the documents in a list of the document names, linked
    to the actual document. If the file type is registered within Microsoft Windows
    Server, the Connector will generate the icon. Otherwise a default icon for the
    file type is generated by the Connector. You can also override the icon used for
    the file type by specifying a value in a stylesheet.


    Presentation of the list is entirely customizable via XSLT stylesheets, which
    are used to transform the properties and contents of the documents in the SharePoint
    document libraries to HTML.


    Refer to Chapter 6, *Publishing Content Between MCMS and SharePoint*, for more
    information on the **SharePointDocumentPlaceholder** and **SharePointDocumentPlaceholderControl**.


    # Additional Utilities Included


    In addition to the SharePoint web parts, server controls, and MCMS placeholders
    provided by Connector for SharePoint Technologies to allow content integration,
    Microsoft included additional SharePoint web parts and command-line utilities
    to assist you with configuring SharePoint and managing your MCMS website.


    The following two administrative SharePoint web parts are included in the Connector
    to assist MCMS site Authors, Editors, and Moderators with maintaining their MCMS
    site:


    +   - **Pages in Production Web Part:** This web part displays all postings the
    current user is currently working on, but has not yet published, which is comparable
    to the "Production Manager" dialog in MCMS.

    +   - **Pages Waiting for Approval Web Part:** This web part displays all postings
    that are pending approval on the MCMS site, which is comparable to the "Approval
    Assistant" dialog in MCMS.'
  merge: -1
  img_proc: true
- pgno: 525
  md: 'The Pages in Production Web Part, Pages Waiting for Approval Web Part, and
    Page Listing Web Part are included in the CmsWebParts.CAB web part deployment
    file, which can be found in the following directory: C:\Program Files\MCMS Connector
    for SharePoint Technologies\WSS\Bin


    Previously we mentioned the two command-line utilities:


    +   - SearchPropertiesSetup.exe: This utility is used to add the advanced HTML
    META tags to the SPS Search Service.

    +   - SetupSearch.exe: This is used to automatically create SharePoint content
    sources and search groups for all top-level channels within an MCMS site.


    A third command-line utility, excludeCMS.exe, will add SharePoint managed path
    exclusion rules for all MCMS URL paths in a virtual server. It is necessary for
    all MCMS paths to be excluded from SharePoint''s ISAPI filters when SharePoint
    and MCMS are configured on the same virtual server within Internet Information
    Services (IIS) or MCMS will not operate correctly.


    All command-line utilities included in the MCMS Connector can be found in the
    following directory: C:\Program Files\MCMS Connector for SharePoint Technologies\WSS\Bin.


    # MCMS Connector Sample Data, Project, and Documentation


    If you choose to install the sample data when you install the Connector, the installation
    procedure will automatically import all data from an SDO file into your MCMS site.


    In addition, the CmsSharePointConnector sample project will be installed, which
    contains the MCMS templates and other controls necessary for the templates and
    postings in the sample data imported from the SDO.


    If you need to import the sample MCMS data later, you can find the SDO file in
    the same directory as the sample project: C:\Program Files\Microsoft Content Management
    Server\Sample Data\CmsSharePointConnector.


    Finally, a compiled help file containing technical details and documentation on
    the MCMS Connector will be installed in the following directory: C:\Program Files\MCMS
    Connector for SharePoint Technologies\Docs.


    # Summary


    This short appendix has covered the installation and use of Connector for SharePoint
    Technologies. We''ve looked at the tools and settings relevant to websites that
    wish to combine content from SharePoint and MCMS.'
  merge: -1
  img_proc: true
