  md: "```\nprivate static void ProcessPageAndGetAttachments(string encodingName,\n\
    \    ref byte[] buffer)\n{\n    // ... code continues ...\n    // Replace special\
    \ characters to make it easier to find\n    content = content.Replace(\"\\t\"\
    , \" \").Replace(\"\\n\", \" \").Replace(\"\\r\", \" \");\n    // Get attachments\n\
    \n    // Start searching for attachments!\n    FindAttachment(ref content, \"\
    base\", \"href\");\n    FindAttachment(ref content, \"a\", \"href\");\n    FindAttachment(ref\
    \ content, \"link\", \"href\");\n    FindAttachment(ref content, \"script\", \"\
    src\");\n    FindAttachment(ref content, \"xml\", \"src\");\n    FindAttachment(ref\
    \ content, \"img\", \"src\");\n    FindAttachment(ref content, \"frame\", \"src\"\
    );\n    FindAttachment(ref content, \"iframe\", \"src\");\n    FindAttachment(ref\
    \ content, \"embed\", \"src\");\n    FindAttachment(ref content, \"body\", \"\
    background\");\n    FindAttachment(ref content, \"td\", \"background\");\n   \
    \ FindAttachment(ref content, \"th\", \"background\");\n    FindAttachment(ref\
    \ content, \"table\", \"background\");\n    FindAttachment(ref content, \"layer\"\
    , \"background\");\n}\n```\n\nOf course, depending on the tags used by authors,\
    \ the list above may not be exhaustive. Feel free to add more tags and attributes\
    \ to the list.\n\nThe FindAttachment() method accepts three input parameters:\n\
    \n+   - **input**: The HTML of the page being scanned\n+   - **tagName**: The\
    \ tag to look for (e.g. <img>)\n+   - **attribute**: The attribute that stores\
    \ the attachment's URL (e.g. src)\n\nIt looks for all instances of the tag in\
    \ the content. For example, when it finds an <img> tag, it extracts the URL from\
    \ its src attribute using the ExtractUrlFromTag() method (defined later).\n\n\
    If a URL has been successfully extracted, it is added to the list of URLs using\
    \ the AddToUrlList() helper function (also defined later).\n\n<base> tags are\
    \ handled separately. Earlier, we discussed how <base> tags are injected into\
    \ all postings by the RobotMetaTag. The browser interprets all relative links\
    \ by pre-pending the value in its href attribute to them. If FindAttachment()\
    \ sees a <base> tag, it calls the SetBaseUrl() routine, which stores the extracted\
    \ URL in the m_LocalBaseUrl variable for use later when downloading relative links.\n\
    \nAdd the FindAttachment() method to the class:\n\n```\nprivate static void FindAttachment(ref\
    \ string input, string tagName,\n    string attribute)\n{\n    // Pattern that\
    \ extracts all tags with the specified tagName\n    string pattern = @\"<\\s*\"\
    \ + tagName + @\"\\b[^>]*>\";\n    // The regular expression that finds all the\
    \ tags\n    Regex findTags = new Regex(pattern, RegexOptions.IgnoreCase);\n  \
    \  foreach (Match tag in findTags.Matches(input))\n    {\n        // Extract the\
    \ URL from each tag based on the specified attribute\n        string url = ExtractUrlFromTag(tag.Value,\
    \ attribute);\n        // We have successfully extracted a URL\n```"
