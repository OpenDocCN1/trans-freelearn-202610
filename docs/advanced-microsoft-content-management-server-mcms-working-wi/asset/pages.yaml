- pgno: 503
  md: "In order for the service posting to be created, it needs a template, and before\
    \ a template can be created, it needs a template gallery. The template that we\
    \ are looking for is stored directly below the root template gallery and has the\
    \ name specified in the AdminTemplateGallery class variable. In this example,\
    \ that will be a gallery with the path /Templates/_Admin/.\n\nIf the template\
    \ gallery can't be found, the CheckAdminTemplate() method attempts to create it.\
    \ If the user does not have the rights to do so, an exception is thrown. Should\
    \ there be strong reasons not to give rights to channel managers running the script\
    \ to create template galleries under the root template gallery, you could either\
    \ create the template gallery beforehand or create the gallery somewhere else\
    \ apart from the root.\n\nOnce the template gallery is found, we look for the\
    \ template. The template is the one with the name specified in the AdminTemplateName\
    \ class variable. Again, if the script can't find the template, it attempts to\
    \ create it. The template contains a single HtmlPlaceholderDefinition with the\
    \ name specified in the AdminPhName class variable. Before the template can be\
    \ used, it has to be submitted. If for some reason, the template can't be submitted,\
    \ an exception is thrown.\n\nAdd CheckAdminTemplate() directly below the CheckChannel()\
    \ method.\n\n```\nstatic Template CheckAdminTemplate(CmsContext context)\n{\n\
    \    Template t = null;\n    TemplateGallery AdminGal = context.RootTemplateGallery\n\
    \        .TemplateGalleries[AdminTemplateGallery];\n\n    // Get an instance of\
    \ the admin template\n    if (AdminGal != null)\n    {\n        t = AdminGal.Templates[AdminTemplateName];\n\
    \    }\n\n    Console.Write(\"Check Template....\");\n\n    // Admin template\
    \ not found. Create it.\n    if (t == null)\n    {\n        // Get instance of\
    \ template gallery.\n        if (AdminGal == null)\n        {\n            if\
    \ (context.RootTemplateGallery.CanCreateTemplateGalleries == false)\n        \
    \    {\n                Exception myException = new Exception(\"Insufficient rights\
    \ to create \"\n                    + \"AdminTemplateGallery: /Templates/\"\n\
    \                    + AdminTemplateGallery);\n                throw myException;\n\
    \            }\n            AdminGal = context.RootTemplateGallery.CreateTemplateGallery();\n\
    \            if (AdminGal == null)\n            {\n                Exception myException\
    \ = new Exception(\"Failed to create \"\n                    + \"AdminTemplateGallery:\
    \ /Templates/\"+AdminTemplateGallery);\n                throw myException;\n \
    \           }\n            AdminGal.Name = AdminTemplateGallery;\n           \
    \ context.CommitAll();\n            Console.Write(\"TemplateGallery created....\"\
    );\n        }\n    }\n\n    // Look for admin template within template gallery.\n\
    \    t = AdminGal.Templates[AdminTemplateName];\n```"
