- pgno: 345
  md: '# The ASP.NET Stager Application


    In the previous section, we have seen how Site Stager works. It is a good tool
    for creating static snapshots of ASP-based sites. Obviously, we don''t want to
    take a huge step back and convert all our templates from ASP.NET to ASP. How,
    then, shall we stage sites that make use of the newer and improved ASP.NET? To
    get around this limitation of Site Stager, we will build our very own version
    of the staging tool. The good news is that we won''t start entirely from scratch:
    we will borrow some of the concepts and ideas behind Site Stager.


    Let''s build a console application that mimics what Site Stager does for MCMS
    2001 or ASP-based templates in MCMS 2002. Note that the application uses the MCMS
    PAPI and will need to be executed on a server that has MCMS installed.


    Here''s what the application will do:


    +   - Walk through the entire channel structure, starting from a specified start
    channel. For each posting and channel cover page found, a static HTML file is
    generated.


    +   - Scan through each channel cover page and posting for attachments and stage
    them.


    +   - Provide settings for administrators to change the behavior of the stager.
    For example, administrators can specify the start channel, whether or not hidden
    postings will be staged, and so on.


    We will make the assumption that the staged pages will be placed in the same folder
    structure as found in Site Manager. For relative links within pages to remain
    unbroken, the pages should not be nested within sub folders. For example, http://tropicalgreen1
    can be staged to http://tropicalgreen2 but not to http://servername/tropicalgreen3/.


    # The DotNetSiteStager Project


    Let''s start by creating a Visual C# Console Application project named DotNetSiteStager.
    Rename Class1.cs to Stager.cs.


    Add the following references to the project:


    +   - Microsoft.ContentManagement.Publishing.dll (located in the <install directory>/Microsoft
    Content Management Server/Server/bin/ directory)


    +   - System.Web


    The following namespaces are also required by the solution. Add them above the
    namespace declaration:


    ```

    using System;

    using System.IO;

    using System.Net;

    using System.Web;

    using System.Text;

    using System.Collections;

    using System.Text.RegularExpressions;

    using Microsoft.ContentManagement.Publishing;

    ```'
