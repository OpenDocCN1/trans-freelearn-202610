  md: "The RemoveTagPair() method removes the <a></a> tags but leaves the text between\
    \ them. For example, if the link is: <a href=\"/NR/rdonlyres/8C78AC41-591D-4626-AFC8-19AC8375914E/0/myresource.gif\"\
    >My Resource </a>, then running the text through the RemoveTagPair() method would\
    \ leave only the string, My Resource.\n\n```\nprivate static string RemoveTagPair(string\
    \ text, string tag, string endtag, string recursecompare)\n{\n    // Get the first\
    \ occurrence of the <a tag within the content\n    int start = text.ToLower().IndexOf(tag.ToLower());\n\
    \n    // Initialize the end point to -1\n    int end = -1;\n\n    while (start\
    \ >= 0)\n    {\n        // Find the end point\n        end = FindTag(text, endtag,\
    \ start, recursecompare);\n\n        // Got the end point. Remove the end tag,\
    \ </a>\n        if (end > start)\n        {\n            text = text.Remove(end,\
    \ endtag.Length);\n        }\n\n        // Remove the start tag <a>\n        text\
    \ = text.Remove(start, tag.Length);\n\n        // Continue the search for <a></a>\
    \ tags\n        start = text.ToLower().IndexOf(tag.ToLower());\n    }\n    return\
    \ text;\n}\n```\n\nThe FindTag() method handles nested anchor tags. We may have\
    \ a situation where one anchor tag is nested within another like this:\n\n<a href=\"\
    /NR/rdonlyres/8C78AC41-591D-4626-AFC8-19AC8375914E/0/myresource.gif\">My Resources\
    \ @ <a href=\"http://www.mywebsite.com\">MyWebSite</a>. Check it out now!</a>\n\
    \nWhile nesting anchor tags does not reflect good programming, it is still a possible\
    \ scenario, especially when authors use the built-in WYSIWYG editors and don't\
    \ get a chance to see how the code looks in HTML.\n\nFindTag() handles nested\
    \ tags by checking to see if there are multiple <a></a> tag pairs. If there are,\
    \ it continues its search until it finds the final ending tag, </a>, that matches\
    \ the first. Add FindTag() directly below the RemoveTagPair() method.\n\n```\n\
    private static int FindTag(string text, string tag, int start, string recursecompare)\n\
    {\n    // Get the position of the next </a> tag\n    int pos = text.ToLower().IndexOf(tag.ToLower(),\
    \ start);\n\n    // Check to see if there are nested hyperlinks\n    int check\
    \ = text.ToLower().IndexOf(recursecompare.ToLower(), start+1);\n\n    // Found\
    \ a nested <a></a> tag\n    if ((check >= 0) & (check < pos))\n    {\n```"
