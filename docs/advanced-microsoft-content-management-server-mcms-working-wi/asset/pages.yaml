  md: '# I''m working with the Telerik MCMS placeholder control. How can I use client-side
    scripts to access its content?


    The technique for using client-side scripts to access content in the Telerik MCMS
    placeholder control is similar. First, we need to get the ID of the object that
    contains the HTML. To do so, enter some text into the Telerik MCMS placeholder
    control and save the page. Go back to authoring mode and view the HTML source
    of the page using Notepad. Press Ctrl+F and search for the text that you have
    just entered. Take note of the ID of the `<div>` tag that holds the content, which
    in v2.12 of the control resembles this:


    ```

    `radEditorContainer_(ID of control)_AuthoringModeControlsContainer_Editor_(ID
    of Control)_AuthoringModeControlsContainer`

    ```


    For a placeholder control with the ID RadEditorPlaceholderControl1, the JavaScript
    that retrieves its content is as follows:


    ```

    ```html

    <script language="javascript">


    var content =

    document.all.radEditorContainerRadEditorPlaceholderControl1_AuthoringModeControlsContainer_EditorRadEditorPlaceholderControl1_AuthoringModeControlsContainer.innerHTML;


    </script>

    ```

    ```


    Note that in different versions of the control, the ID given to the `<div>` tag
    surrounding the content varies. You will have to check the generated source code
    to get the ID of `<div>` tag for the particular version you are working with.


    # Checking for an Empty HtmlPlaceholderControl


    Now that we know how to retrieve the current content of an HtmlPlaceholderControl,
    we can proceed to validate it. An HtmlPlaceholderControl is considered to be empty
    when one of the following conditions is met:


    +   - It contains an empty string.

    +   - It contains only invisible tags and spaces, like `<p>&nbsp;</p>`, or `<p><div>&nbsp;</div></p>`
    for example.


    Depending on your requirements, you may also need to check to see if the placeholder
    content contains default text.


    The JavaScript used to check for these conditions is covered in this section.
    The name of the control to be validated will be added to the name of the routine
    to ensure that if multiple validation controls have been placed on the same template
    file; they will each have their own client-side routines. The code makes use of
    the client-side `isEmpty()` method to check to see if the placeholder is empty.'
