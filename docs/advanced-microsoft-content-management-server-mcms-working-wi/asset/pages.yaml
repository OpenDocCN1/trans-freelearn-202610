  md: "```\n    - - - code continues - - -\n}\n}\n```\n\nThe code gets a reference\
    \ to the `HierarchyItem` whose properties you wish to view. For template galleries,\
    \ templates, resource galleries, and resources, this is obtained by getting the\
    \ GUID from the `CMSObjectGuid` querystring parameter and using the `Searches.GetByGuid()`\
    \ method. Channels and postings are obtained from the `CmsHttpContext.Current.ChannelItem`\
    \ property.\n\nIn Design view, drag and drop the `Styles.css` file and `DataGrid`\
    \ onto the `Properties.aspx` web form and give the `DataGrid` the following property\
    \ values:\n\n| Property | Value |\n|---|---|\n| Auto Format | Simple 3 |\n| Font-Size\
    \ | 10pt |\n| ID | DataGrid1 |\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_53_0.png)\n\
    \nBelow the Page_Load() event handler, add the `ListProperties()` method. The\
    \ method first creates a `DataTable` containing the following columns:\n\n+  \
    \ - The property name\n+   - The property value\n+   - Whether or not the property\
    \ can be written to\n\nWe use the `GetType.GetProperties()` method to retrieve\
    \ a collection of all properties associated with the hierarchy item. Next, iterate\
    \ through each property of the current `ChannelItem` and add each one as a row\
    \ to the `DataTable`. Notice that the property value is obtained by calling `PropertyInfo.GetValue()`\
    \ and passing in the hierarchy item as an input parameter. Finally, we bind the\
    \ `DataTable` to the `DataGrid`."
