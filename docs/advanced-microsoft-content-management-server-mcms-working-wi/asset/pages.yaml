  md: "```\n```csharp\nprivate string HandleImgAndAttPlaceholderTypes(string propValue)\n\
    {\n    if (propValue.ToLower().StartsWith(\"/nr/rdonlyres\"))\n    {\n       \
    \ if (IsResourceDeleted(propValue))\n        {\n            propValue = \"\";\n\
    \        }\n    }\n    return propValue;\n}\n```\n```\n\n# Removing Links from\
    \ HtmlPlaceholders\n\nAs HtmlPlaceholders contain attachments and images mixed\
    \ up in a mass of HTML tags, removing dead links from them is slightly more complex.\n\
    \n# Handling Images\n\nLet's start by dealing with images. Images are linked to\
    \ an HTML file using the image tag, `<img>`. An image tag typically contains several\
    \ attributes, like src, border, alt, etc. Here's an example of an `<img>` tag:\n\
    \n```\n```html\n<img src=\"/NR/rdonlyres/8C78AC41-591D-4626-AFC8-19AC8375914E/0/myresouce.gif\"\
    >\n```\n```\n\nA good way to grab the entire tag is to search for the starting\
    \ `<img` string and the closing angle bracket >. We check to see if it links to\
    \ an MCMS resource. If it does, we run it through the **IsResourceDeleted()**\
    \ method that we defined earlier. Images that show deleted resource gallery items\
    \ are deleted by removing the entire `<img>` tag.\n\nThe HandleImageTags() method\
    \ does the work. Add HandleImageTags() directly below the HandleImgAndAttPlaceholderTypes()\
    \ method.\n\n```\n```csharp\nprivate string HandleImageTags(string propValue)\n\
    {\n    // Look for <img> tags within the content\n    int start = propValue.ToLower().IndexOf(\"\
    <img \");\n\n    // Found an <img> tag.\n    while (start >= 0)\n    {\n     \
    \   // Get the closing angle bracket of the tag\n        int end = propValue.IndexOf(\"\
    >\", start);\n        if (end > start)\n        {\n            // Get the entire\
    \ <img> tag\n            string tag = propValue.Substring(start,end-start+1);\n\
    \n            // Get the link to the resource gallery item\n            int linkStart\
    \ = tag.ToLower().IndexOf(\"\\\"/nr/rdonlyres\");\n            if (linkStart >=\
    \ 0)\n            {\n                int linkEnd = tag.IndexOf(\"\\\"\", linkStart+1);\n\
    \                if (linkEnd > linkStart)\n                {\n               \
    \     string linkStr = tag.Substring(linkStart, linkEnd-linkStart+1);\n\n    \
    \                // Check to see if the link points to the deleted resource\n\
    \                    if (IsResourceDeleted(linkStr))\n                    {\n\
    \                        // Resource has been deleted. Remove the tag entirely\n\
    \                        propValue = propValue.Replace(tag,\"\");\n          \
    \              tag = \"\";\n                    }\n                }\n       \
    \     }\n        }\n    }\n}\n```\n```"
