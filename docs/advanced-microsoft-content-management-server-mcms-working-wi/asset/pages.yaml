  img_proc: true
- pgno: 173
  md: 'In some cases, an intranet implementation built upon both SPS and MCMS would
    facilitate online collaboration between employees by deploying multiple portals
    that aggregate content from hundreds or thousands of smaller WSS sites. Small
    teams use these team sites for projects, development of new products, procedures,
    and tasks. At the same time, the human resources department is using MCMS to maintain
    a tight hold on company policies, standards, rules, and procedures that are more
    content oriented and require a publishing workflow solution. The possibilities
    of how the two products could be leveraged to provide a single solution are endless.


    Aside from the single combined solution, SPT and MCMS can also be deployed in
    separate environments addressing different business challenges. For example, a
    company may implement its Internet site using MCMS and internal departmental sites
    using SPS or WSS. However, even though the two products are not combined, they
    can publish and pull content and data to and from each other. Consider a WSS site
    used by a product team to manage product-related events and documentation. The
    company Internet site could pull content from the events list Web Part in the
    WSS site to show upcoming events to non-employees. In addition, the WSS site could
    pull postings from the Internet site that contain product sales information for
    internal use. This eliminates duplication of content entry and management.


    > While the solution described above outlines the use of SharePoint internally
    within an organization where some content is published to the Internet, it is
    not a common scenario. The most common case of leveraging both MCMS and SharePoint
    Portal Server is where both products are used internally within a company, as
    in the intranet example, because making SharePoint data accessible to non-employees
    of the company requires the purchase of an External Connector License, which is
    a significant cost factor.


    These are just two examples of how you could use SPT and MCMS together to provide
    a solution to a business problem or challenge. Fortunately, Microsoft recognized
    the two products complement each other very well and has provided a free collection
    of tools and utilities for developers to get a jump start melding the two products
    together: the MCMS Connector for SharePoint Technologies (hereafter referred to
    as the Connector).


    # Joining MCMS and SharePoint in a Single Solution


    There is no one best way for joining the two products. As we''ve gone over previously,
    each product has strong areas that can complement the other. You''ll need to evaluate
    which best fits the needs presented in any particular business challenge. Before
    you make this decision, you need to understand how each product can be implemented.


    MCMS can be configured to serve content from one or more IIS websites configured
    as MCMS Web Entry Points. Regardless of the number of MCMS Web Entry Points on
    a single physical server, all MCMS Web Entry Points will use the same MCMS Repository
    as only one database can be configured per machine.'
  merge: -1
  img_proc: true
- pgno: 174
  md: "# Publishing Content Between MCMS and SharePoint\n\nthe case where SharePoint\
    \ and MCMS reside on the same physical server, you have the option of operating\
    \ them within separate virtual servers or in the same virtual server.\n\n> A virtual\
    \ server is also referred to as a website in Microsoft Internet Information Services.\n\
    \nAs you can see, you have quite a few options as to how the two products can\
    \ be implemented:\n\n+   1. Hosting MCMS and SharePoint on the same physical server\
    \ and the same virtual server\n+   2. Hosting MCMS and SharePoint on the same\
    \ physical server but different virtual servers\n+   3. Hosting MCMS and SharePoint\
    \ on different physical servers and thus different virtual servers\n\nDue to the\
    \ many options, one of the first things you need to decide is which of the two\
    \ products will serve as the primary entry point for your solution. If SharePoint\
    \ and MCMS reside on different physical servers or virtual servers, either could\
    \ serve the role of primary entry point. However, if MCMS and SharePoint Portal\
    \ Server are configured to operate on the same virtual server, SharePoint will\
    \ be the primary entry point if users are going to the root of the site (for instance\
    \ http://www.TropicalGreen.net).\n\n> Operating MCMS and SPS within the same virtual\
    \ directory requires some manual configuration within the SharePoint administration\
    \ to exclude certain URL paths from being managed by the SharePoint ISAPI filters.\
    \ This allows requests to be processed by the MCMS ISAPI filters. Unfortunately\
    \ SharePoint does not allow you to exclude the root of the portal. This means\
    \ any HTTP request made to the virtual server's root (such as http://www.TropicalGreen.net/default.aspx)\
    \ will be handled by the SharePoint ISAPI filter. Only subdirectories below the\
    \ root (for instance http://www.TropicalGreen.net/TropicalGreen/default.aspx)\
    \ can be excluded from SharePoint and therefore managed by MCMS.\n> \n> For more\
    \ information on how to set up MCMS and SharePoint on the same virtual server,\
    \ refer to Appendix A, _Setting up MCMS and SPS on the Same Virtual Server_.\n\
    \nThis chapter will address solutions that can cover both situations: MCMS and\
    \ SharePoint on the same virtual server and also on different servers (virtual\
    \ or physical). If you choose to operate the two products on different physical\
    \ servers, you will need to implement a custom solution to publish content between\
    \ the machines. The most common approach would be to use Web services.\n\n> SharePoint\
    \ ships with a long list of Web services that expose most of its content. These\
    \ Web services can be found in the `_vti_bin` web application in the root of the\
    \ site automatically created for each SharePoint portal and Windows SharePoint\
    \ Services site. For more information on creating Web services for MCMS, refer\
    \ to Chapter 11, _InfoPath with Web Services_, which covers Web services for MCMS.\
    \ The Web services you create in that chapter are consumed by Microsoft Office\
    \ InfoPath, but can also easily be consumed by custom code."
  merge: -1
  img_proc: true
