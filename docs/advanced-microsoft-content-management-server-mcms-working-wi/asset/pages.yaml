- pgno: 360
  md: "```\nprivate static void AddToUrlList(string url)\n{\n    ... code continues\
    \ ...\n    // Convert Relative URLs to Absolute URLs\n    if (!url.StartsWith(\"\
    /\"))\n    {\n        url = m_LocalBaseUrl + url;\n    }\n}\n```\n\nNext, we remove\
    \ host information from the URL. This makes it easier for us to process the rest\
    \ of the URL later, especially when attempting to check to see if the attachment\
    \ is a channel item.\n\n```\nprivate static void AddToUrlList(string url)\n{\n\
    \    ... code continues ...\n    // Remove host information from the URL\n   \
    \ if (url.StartsWith(m_SourceHost))\n    {\n        url = url.Remove(0, m_SourceHost.Length);\n\
    \    }\n}\n```\n\nWe will only add URLs that are valid. Valid URLs:\n\n+   - Will\
    \ not contain single or double quotes.\n+   - Will not link to other ports (such\
    \ as http://localhost:81/somepage.htm) or other domains. Since we have removed\
    \ host information earlier on (which leaves us with URLs such as :80/ or :80/somepage.htm),\
    \ we simply look for the presence of a colon to check for URLs that have a port\
    \ number.\n+   - Will not contain querystring parameters. We will enforce that\
    \ by ensuring that the URL does not contain a question mark. The reason for not\
    \ processing pages with querystrings is because they are likely to be dynamic\
    \ pages (*.aspx or *.asp) and static snapshots of these pages aren't able to process\
    \ querystring parameters.\n\n```\nprivate static void AddToUrlList(string url)\n\
    {\n    ... code continues\n    // Check URLs to see if they are valid\n    bool\
    \ isValidUrl = true;\n    string reason = \"\";\n    if ((url.IndexOf(\"'\") >=\
    \ 0 || url.IndexOf(\"\\\"\") >= 0)\n        || url.IndexOf(\":\") >= 0 || url.IndexOf(\"\
    ?\") >= 0)\n    {\n        // URL is invalid\n        isValidUrl = false;\n  \
    \      reason = \"Ignoring invalid url or url from external domain\";\n    }\n\
    }\n```\n\nWe will also check to see if the URL belongs to a posting or channel\
    \ cover page that will be staged by the CollectChannel() method defined earlier.\
    \ We could leave out this check and have the stager generate these pages as many\
    \ times as they appear, but remember that the smaller the number of files staged,\
    \ the faster the process!\n\nNotice that we used a helper function, EnhancedGetByUrl().\
    \ It basically does the same job as the Searches.GetByUrl() method, but includes\
    \ several improvements as we shall see later."
