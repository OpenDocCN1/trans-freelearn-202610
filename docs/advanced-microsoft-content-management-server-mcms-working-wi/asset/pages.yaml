  md: "```\nleft:-10px;\\\"> {0}</span><br>\".\n    posting.Description) );\n}\n//\
    \ add the last date the posting was modified\nhtml.Append(string.Format(\n   \
    \ \"<span style=\\\"margin-left:10px; font-style:italic;\\\"\n    + \">Last Modified:\
    \ {0}</span>\",\n    posting.LastModifiedDate.ToString(\"F\") )); \n// return\
    \ the built HTML string\nreturn html.ToString();\n}\n```\n\nAt this point the\
    \ coding is complete within our custom view. We still have to strongly name our\
    \ assembly, as required for any assembly running within the SharePoint environment.\n\
    \nIn order to strongly name an assembly, we first need a key. To create a key,\
    \ we'll run the Strong Name tool from a Visual Studio .NET Command Prompt:\n\n\
    +   1. Launch a command window by selecting Start | All Programs | Visual Studio\
    \ .NET 2003, Visual Studio .NET Tools | Visual Studio .NET 2003 Command Prompt.\n\
    \n+   2. We'll place the key in the root of the C: drive for simplicity. Create\
    \ a key by entering the following at the command prompt:\n+   \n+   sn -k c:\\\
    PlantCatalogCustomView.snk\n+   \n+   Now we need to tell the compiler to use\
    \ the key we just created to strongly name our assembly when we build it. To do\
    \ this, open the AssemblyInfo.cs file in our project and modify the version number\
    \ and key file attributes as shown in the code below:\n+   \n+   [assembly: AssemblyVersion(\"\
    1.0.0.0\")]\n+   [assembly: AssemblyKeyFile(\"c:\\\\PlantCatalogCustomView.snk\"\
    )]\n\n+   3. The final steps in creating a custom view involve building our assembly\
    \ in release mode and deploying it to the global assembly cache (GAC). To add\
    \ our assembly to the GAC, copy the release assembly version of our project, TropicalGreenPlantCatalogCustomView.dll,\
    \ and paste it in the GAC, located at C:\\Windows\\assembly\\.\n\n+   4. Let's\
    \ verify our custom assembly has been successfully installed to the GAC:\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_184_0.png)"
  merge: -1
  img_proc: true
- pgno: 185
  md: "> Take note of the Public Key Token listed for our assembly. We will need this\
    \ in a moment.\n\nWe have now built and deployed our first custom view for the\
    \ MCMS Page Listing Web Part. However, before we can use it, we need to register\
    \ it for use by modifying the Web.config of our MCMS application that we specified\
    \ as the Site Root URL when we added the MCMS Page Listing Web Part to the SharePoint\
    \ Web Part Page. In our case it is: `http://www.tropicalgreen.net/MCMS/`.\n\n\
    > The MCMS application is created by the Server Configuration Application (SCA)\
    \ when you set a virtual server as an MCMS Web Entry Point. You will find the\
    \ Web.config for this application in the following directory: `C:\\Program Files\\\
    Microsoft Content Management Server\\Server\\MCMS`.\n\nOpen the Web.config for\
    \ the web application specified as the Site Root URL in the MCMS Page Listing\
    \ Web Part, and add the following elements:\n\n```\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"utf-8\"?>\n<configuration>\n  <configSections>\n    <sectionGroup\
    \ name=\"CustomPageListingViews\">\n      <section name=\"CustomView1\" type=\"\
    Microsoft.ContentManagement.SharePoint.Dialogs.NameValueSectionHandler, Microsoft.ContentManagement.SharePoint.Dialogs,\
    \ Version=1.0.1000.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35\" />\n\
    \    </sectionGroup>\n  </configSections>\n\n  <CustomPageListingViews>\n    <CustomView1>\n\
    \      <add key=\"assembly\" value=\"TropicalGreenPlantCatalogCustomView, Version=1.0.0.0,\
    \ Culture=neutral, PublicKeyToken=82ea4ab22cc61fe4\" />\n      <add key=\"customListingType\"\
    \ value=\"TropicalGreenPlantCatalogCustomView.PlantCatalogCustomView\" />\n  \
    \  </CustomView1>\n  </CustomPageListingViews>\n\n  - - - code continues - - -\n\
    ```\n```\n\n> Note that the PublicKeyToken listed in the Web.config above is the\
    \ same as shown in the GAC.\n\nAn easy way to get the public key token is to copy\
    \ it from the property window of the assembly in the GAC.\n\nAnother way to obtain\
    \ the public key token is to enter the following command in a Visual Studio .NET\
    \ command window: `c:\\sn –T [path to Web Part]\\mywebpart.dll`.\n\nKeep in mind\
    \ that the Web.config, like any XML file, is case sensitive so double-check for\
    \ typos if you encounter any syntax errors."
  merge: -1
  img_proc: true
- pgno: 186
  md: "Now everything is in place: our custom view assembly has been deployed to the\
    \ GAC and has been registered as the first custom view option. Time to see if\
    \ it works!\n\nGo back to the portal, switch the page into edit mode by clicking\
    \ Edit Page in the left vertical navigation, and open the SharePoint Web Part\
    \ Tool Pane by selecting Modify Shared Web Part from the MCMS Page Listing Web\
    \ Part's drop-down menu (activated by clicking the down arrow in the upper right).\
    \ Expand the Custom Properties section for the Web Part, select Custom 1 for the\
    \ View and click Apply at the bottom. Be patient as it may take a moment for your\
    \ custom view to be loaded the first time. Once it loads, you should see something\
    \ similar to the following screenshot:\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_186_0.png)\n\
    \nCongratulations! You've now built your first custom view for the MCMS Page Listing\
    \ Web Part.\n\nWhile the custom views are helpful for creating your own presentation,\
    \ the MCMS Page Listing Web Part does not permit full control over the HTML output.\
    \ Unfortunately you only have access to the contents of the table cell for each\
    \ row, forcing a vertical list presentation. What if you wanted to show the postings\
    \ in a horizontal list? What if you wanted to show only channels? What if you\
    \ wanted to show subchannels and postings within a channel? The only way this\
    \ is possible is by creating a custom Web Part that references the list of postings\
    \ within a channel.\n\nLet's take a look at the other two Web Parts included with\
    \ the Connector.\n\n# The MCMS Pages in Production Web Part\n\nThe MCMS Pages\
    \ in Production Web Part displays a list of postings in an MCMS site that the\
    \ currently logged-in user has authored but that have not yet been published.\
    \ The postings shown are pulled from all channels in the MCMS site, not just a\
    \ specific channel. Let's take a look at this Web Part in action.\n\n> The Connector\
    \ does not support Forms Authentication because SharePoint only supports Windows\
    \ Authentication. This will affect the data retrieval of the MCMS Pages in Production\
    \ Web Part and the MCMS Pages Waiting for Approval Web Part.\n> \n> Due to this\
    \ limitation, our current configuration of the Tropical Green website will not\
    \ work with these two Web Parts. Regardless, we'll walk through the steps to implement\
    \ and configure the Web Parts if you have an MCMS site with Windows Authentication."
  merge: -1
  img_proc: true
- pgno: 187
  md: 'The first thing we need to do is add the Web Part to the Web Part Page. We''ll
    put it below the MCMS Page Listing Web Part we were previously working with. To
    add the Web Part, repeat the same steps we followed when adding the MCMS Page
    Listing Web Part:


    +   1. Navigate to a SharePoint portal in Internet Explorer:

    +   http://portal.tropicalgreen.net.

    +   2. Switch to edit mode by clicking the Edit Page link in the vertical left-hand
    Actions menu.

    +   3. Click the Modify Shared Page link in the upper left. Using the drop-down
    menu that appears, select Add Web Parts and then Browse.

    +   4. Switch to the Virtual Server Gallery to see our installed Web Parts for
    the current virtual server.

    +   5. Now that we have our Web Part on the page, we need to set its properties.
    Click the small down arrow in the upper-right corner of the MCMS Pages in Production
    Web Part we just added to our page and select Modify Shared Web Part.

    +   6. Expand the Custom Properties section by clicking the icon to the left of
    the Custom Properties section heading.

    +   7. We need to tell the Web Part the URL of our MCMS web application. Enter
    http://www.tropicalgreen.net/MCMS/ for the MCMS Site Root URL property. Click
    the Apply button at the bottom of the tool pane.


    # The MCMS Pages Waiting for Approval Web Part


    The MCMS Pages Waiting for Approval Web Part displays a list of postings that
    are pending the approval of the current user. This Web Part has exactly the same
    features, implementation steps, and configuration settings as the previous MCMS
    Pages in Production Web Part. The only difference between the two is the state
    of the postings. Since the two Web Parts are so similar, we won''t walk through
    the steps in adding and configuring this Web Part on a SharePoint Web Part Page.


    # Why does the MCMS Page Listings Web Part work with a guest-enabled Forms Authentication
    MCMS site but MCMS Pages in Production Web Part and MCMS Pages Waiting for Approval
    Web Part not work?


    When your site is configured for guest access, you have likely granted the account
    set as the MCMS Guest Login Account the Subscriber role in Site Manager. This
    is all the rights the guest account needs to enumerate through the postings within
    the specified channel and display them in the MCMS Page Listings Web Part. However,
    the MCMS Pages in Production Web Part and MCMS Pages Waiting for Approval Web
    Part require higher rights—such as author, editor, or moderator rights—than the
    Subscriber role provides, and thus, these Web Parts will display a permission
    error message: "The windows credentials provided could not be validated."


    If our Tropical Green MCMS site wasn''t set to guest access, we''d have the same
    problem with the MCMS Page Listings Web Part for the same reasons.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'If your MCMS site was set up to use Windows Authentication and you configured
    the MCMS Pages in Production Web Part and MCMS Pages Waiting for Approval Web
    Part to use this Windows Authenticated MCMS site, the two Web Parts would look
    something like this:


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_188_0.png)


    As we''ve demonstrated, the three Web Parts included with the Connector provide
    limited presentation (in the case of the MCMS Page Listing Web Part) and workflow
    administration (in the case of the MCMS Pages in Production and MCMS Pages Waiting
    for Approval Web Parts) of MCMS content. What if you need to display content from
    within a specific posting or a collection of channels and postings in a list?


    While the MCMS Page Listing Web Part displays the postings within a channel, the
    presentation is somewhat restrictive. As we saw previously, each posting is listed
    within a one-cell-per-row HTML table. We have control over what HTML we''ll put
    in the table cell. What if we need more control over the presentation? Or what
    if we wanted to show a tree-like organization of channels, sub channels, and postings?


    # Limitations of the MCMS Connector for SharePoint


    The Connector addresses some of the most common needs and uses when publishing
    content from an MCMS site to SharePoint. However, as the previous questions indicate,
    there are many more publishing possibilities. To satisfy these requirements, we
    have the option of building custom Web Parts that would pull content from MCMS
    into SharePoint in a much more configurable manner. In order to do this, we need
    access to the content. This can occur in one of three ways:


    +   1. Extend a virtual server as a SharePoint site and configure it as an MCMS
    Web Entry Point. This option would allow Web Parts in the SharePoint site to access
    the MCMS content directly via the MCMS PAPI. This is demonstrated in the Web Part
    we create in Chapter 7, Building SharePoint Web Parts.

    +   2. Configure MCMS and SharePoint to run on two separate virtual servers. The
    MCMS content you wish to publish can be exposed via Web Services on the MCMS site.
    A SharePoint Web Part could then consume those Web Services and present the data
    on the SharePoint Web Part Page. Building and leveraging Web Services to expose
    the MCMS postings and channels is covered in Chapter 11, InfoPath with MCMS Web
    Services.'
  merge: -1
  img_proc: true
