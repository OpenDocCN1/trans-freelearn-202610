    +   - Once we have the XML, we extract information about the attachment from the\
    \ tags and store them in the arrays that we have prepared.\n+   - Finally, we\
    \ load the content back into the table of all uploaded attachments.\n\n# Preparing\
    \ Arrays for Storing Information about the Attachments\n\nLet's prepare three\
