    We must also define the XSLT stylesheet that will be used to transform our XML
    into HTML.


    +   1. In Visual Studio .NET, right-click on the ExtensibleCMSPageListingWebPart
    project and select Add New Item.

    +   2. From the Categories pane, select Data and then select XSLT File.

