- pgno: 374
  md: "5. We also need to be able to save all the custom properties that are held\
    \ in the collection.\n\n```\n/// <summary>\n/// Save the collection of custom\
    \ properties\n/// </summary>\n/// <param name=\"_Posting\">\n/// Posting to save\
    \ the custom property value to\n/// </param>\npublic void Save(Posting _Posting)\n\
