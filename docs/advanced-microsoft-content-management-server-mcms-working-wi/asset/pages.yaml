- pgno: 190
  md: '> We have already explored all the controls and placeholders involved in implementing
    indexing and search capabilities in Chapter 5, Searching MCMS with SharePoint.


    The SharePoint Document Placeholder enables content owners to link a document
    managed by SharePoint Portal Server to be presented within an MCMS posting. The
    content owner can also display properties of the linked document in the MCMS page.
    The presentation of the document and properties are controlled using XSLT stylesheets,
    which can be centrally controlled or individually applied to where they are needed.
    Once a document is linked to an MCMS posting, users can access the document either
    via SharePoint Portal Server or an MCMS site, which provides a seamless user experience
    for users viewing the document contents, regardless of the environment they access
    it from.


    Any document stored within a SharePoint Document Library can be added to a posting
    via the SharePoint Document Placeholder. If the display view you choose includes
    an icon, the placeholder will use the icon associated with that document type
    on the MCMS Server. If the document type is a Microsoft Office InfoPath form or
    a Word Markup Language (WordML) document, you can have the contents of the document
    displayed in the placeholder Control. Conversely, all other document types are
    shown as attachments and/or the document properties. This is controlled by which
    XSLT options you choose to render the document library items.


    > If the document is an InfoPath form, you need to ensure the user (content consumer)
    has rights to the SharePoint site containing the form. This is due to the fact
    that the SharePoint Document Library contains the template used to display the
    form in InfoPath.


    When a document is added to an MCMS posting via the SharePoint Document Placeholder,
    the document is copied from the SharePoint Document Library into the MCMS repository
    as a local attachment. If the document is of type XML, such as an InfoPath or
    WordML document, the XML is saved in the MCMS placeholder as well (this content
    in the placeholder is set to readonly from within the MCMS site). Changes to the
    document in the SharePoint Document Library are not automatically reflected in
    MCMS. The Document Updater utility is included with the Connector to synchronize
    changes done in the document library into MCMS (if the "update automatically"
    checkbox has been checked in the SharePoint Document Placeholder control when
    creating the posting). The tool, WssDocumentUpdater.exe, can be found in the Connector''s
    installation directory, C:\Program Files\MCMS Connector for SharePoint Technologies\CMS\bin\.
    This command-line tool can be set to run at regular intervals using the Windows
    Task Scheduler.


    # Using the SharePoint Document Placeholder


    Let''s see the SharePoint Document Placeholder in action. First, we need to create
    and upload a document to a SharePoint Document Library:


    +   1. Create a new Microsoft Word document and enter the following text in the
    body of the document: This is content that is saved within a Microsoft Word file.

    +   2. Save the document to your desktop with the filename MCMS Published Document.

    +   3. Open Internet Explorer and browse to our SharePoint portal: http://portal.tropicalgreen.net/.'
  merge: -1
  img_proc: true
