    The code first gets a reference to the posting to be copied followed by the destination
    channel specified in the txtDestination textbox. The Posting.CopyTo() method accepts
    the destination channel object as an input parameter. Once the copy has been created,
    you can proceed to set its properties. The copy operation will only be persisted
    after a call to CommitAll() is made.


    In order to test the Copy Posting dialog, we first create a channel to which to
    copy the postings:


    +   1. Navigate to http://localhost/CmsExplorer.

    +   2. Select New | New Channel.

    +   3. Name the new channel MyNewChannel2. Click Create Channel and then click
    Close.

    +   4. Click MyNewChannel.

    +   5. Click the Edit button on the row for My New Posting.

    +   6. Click Copy. This will open a new browser window containing the Copy Posting
    dialog.

    +   7. In the Copy Posting dialog, enter /Channels/MyNewChannel2 in the Destination
    Channel textbox, click Copy Posting, and then click Close.


    Notice that a copy of My New Posting is created in MyNewChannel2. The copied posting
    has the same properties and placeholder content as the original posting with the
    following exceptions:


    +   - CreatedBy, LastModifiedBy, and OwnedBy; which hold the server account of
    the person who executed the copy

    +   - CreatedDate and LastModifiedDate; which contain the date and time that the
    copy operation was carried out


    After copying, the copied posting''s state is Saved. It has to be approved before
    it is published.


    # Moving Postings


    You can change the parent container of a posting by moving it. Postings can be
    moved in both the Web Author (using the Move Posting option) and Site Manager
    (dragging and dropping postings from one channel to another). Once moved, postings
    require moderator approval if any are assigned for the destination channel.


    The PAPI provides the Posting.MoveTo() method to move postings using code. One
    common application of the method is to automatically approve postings that are
    moved. When reorganizing large numbers of postings, it is often quicker to write
    a script to automate the move and to approve them immediately instead of performing
    these steps manually.


    To see how the Posting.MoveTo() method is used within code, we''ll create a Move
    Posting dialog for CMS Explorer:'
