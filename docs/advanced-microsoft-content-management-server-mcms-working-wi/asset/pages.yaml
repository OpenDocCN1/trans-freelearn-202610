  md: '# Summary


    In this chapter we presented nine essential how-tos for every MCMS website:


    +   - How to revert a posting to a previous version

    +   - How to change a posting''s template

    +   - How to build a recycle bin

    +   - How to deal with links to deleted resources

    +   - How to generate a resource dependency report

    +   - How to update a posting''s properties directly from a template file

    +   - How to rewrite unfriendly URLs to friendly URLs

    +   - How to export resource gallery items using the site deployment API

    +   - How to configure the position and size of the Web Author Console dialogs

    +   - How to get frames and IFRames to work correctly in a template file


    Be aware that applying hotfixes or service packs could replace the code files
    used internally by MCMS and break some of the tips. So if a tip calls for the
    alteration of any of these files, do keep a copy of the modified files and have
    them considered as part of your upgrade procedures.


    These tips provide solutions to the most requested features by developers from
    the community. If you have a solution of your own, do share it with everyone by
    uploading it to the MCMS community workspace at http://www.gotdotnet.com.'
