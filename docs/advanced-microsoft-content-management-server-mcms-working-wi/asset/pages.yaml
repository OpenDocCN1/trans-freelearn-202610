  md: "# Useful Placeholder Controls\n\nWith the DataGrid created, we are ready to\
    \ insert columns. The first column that we will add is the Edit/Update column.\
    \ In DataGrid speak, that is the EditCommandColumn. It contains an Edit link for\
    \ authors to select a row in the grid that they wish to modify. When it is clicked,\
    \ the row transforms into a series of textboxes. After authors have modified the\
    \ contents of the row, they click the Update link to save their work back to the\
    \ grid.\n\nOf course, the Edit and Update links won't perform the work of editing\
    \ and updating without our programming the necessary logic. We will do so by writing\
    \ the OnEditCommand() method for editing and the OnUpdateCommand() method for\
    \ updating, later on. Meanwhile, we register these methods to the DataGrid's EditCommand\
    \ and UpdateCommand events respectively.\n\n```\n```csharp\n// - - - code continues\
    \ - - -\nprotected override void CreateAuthoringChildControls(\n             \
    \                     BaseModeContainer authoringContainer)\n{\n    // Add a DataGrid\
    \ control to the authoring container\n    dg = new DataGrid();\n\n    // Add an\
    \ Edit/Update column to the DataGrid\n    EditCommandColumn c0 = new EditCommandColumn();\n\
    \    c0.EditText = \"Edit\";\n    c0.UpdateText = \"Update\";\n    dg.Columns.Add(c0);\n\
    \    dg.EditCommand += new DataGridCommandEventHandler(this.OnEditCommand);\n\
    \    dg.UpdateCommand += new DataGridCommandEventHandler(this.OnUpdateCommand);\n\
    \n    authoringContainer.Controls.Add(dg);\n}\n```\n```\n\nWe will also provide\
    \ a Delete button for authors to remove rows from the DataGrid. The column type\
    \ that automatically creates a button in a DataGrid is the ButtonColumn. Like\
    \ the edit and update links added earlier, we need to program the logic for deleting\
    \ the items. We do so in the OnDeleteCommand() event handler, which we will work\
    \ on later. For now, we will register the method to the DataGrid's DeleteCommand\
    \ event as another DataGridCommandEventHandler.\n\n```\n```csharp\n// - - - code\
    \ continues - - -\nprotected override void CreateAuthoringChildControls(\n   \
    \                               BaseModeContainer authoringContainer)\n{\n   \
    \ // - - - code continues - - -\n\n    // Add a Delete button to the DataGrid\n\
    \    ButtonColumn c1 = new ButtonColumn();\n    c1.CommandName = \"Delete\";\n\
    \    c1.Text = \"Delete\";\n    dg.Columns.Add(c1);\n    dg.DeleteCommand += new\
    \ DataGridCommandEventHandler(this.OnDeleteCommand);\n\n    authoringContainer.Controls.Add(dg);\n\
    }\n```\n```\n\nNext, we add a Label for error messages (if any) when loading and\
    \ saving content from the DataGrid. Remember to define the Label as a class-wide\
    \ variable so that it can be accessed by other methods within the class.\n\n```\n\
    ```csharp\n// - - - code continues - - -\nprivate Label lblMessage;\nprotected\
    \ override void CreateAuthoringChildControls(\n                              \
    \    BaseModeContainer authoringContainer)\n```\n```"
