    \ LoadPlaceholderContentForAuthoring(\n    PlaceholderControlEventArgs e)\n{\n\
    \    . . . code continues . . .\n    // Add the cell for the attachment's icon\n\
    \    htmlCode.Append(\"<td align=center id=\\\"MAPH_AttIcon_\" + sPhName\n   \
    \     + \"_\" + i.ToString() + \"\\\">\" + attIcon[i] + \"</td>\" + crlf;\n  \
    \  . . . code continues . . .\n}\n```\n\nThe icon is also stored in a hidden field\
    \ in the second column of the table. The hidden field has a name starting with\
    \ MAPH_AttIcon and, like the cell in the first column, will be populated with\
    \ the contents of the attIcon[] array.\n\n```\nprotected override void\nLoadPlaceholderContentForAuthoring(PlaceholderControlEventArgs\
    \ e)\n{\n    . . . code continues . . .\n    // Add a hidden form field to store\
    \ the icon\n    htmlCode.Append(\"<input type=\\\"hidden\\\" name=\\\"MAPH_AttIconUrl_\"\
    \ + sPhName\n        + \"_\"+i.ToString() + \"\\\" value=\\\"\" + attIcon[i] +\
    \ \"\\\">\");\n    . . . code continues . . .\n}\n```\n\nThe display text of the\
    \ attachment is shown in a textbox with a name that starts with MAPH_AttName.\
    \ We will set it to hold the contents of the attName[] array.\n\n```\nprotected\
    \ override void\nLoadPlaceholderContentForAuthoring(PlaceholderControlEventArgs\
    \ e)\n{\n    . . . code continues . . .\n    // Add the Text box to display the\
    \ attachment's display text\n    htmlCode.Append(\"<input type=\\\"text\\\" name=\\\
    \"MAPH_AttName_\" + sPhName\n        + \"_\" + i.ToString() + \"\\\" value=\\\"\
    \" + attName[i] + \"\\\">\");\n    . . . code continues . . .\n}\n```\n\nThe last\
