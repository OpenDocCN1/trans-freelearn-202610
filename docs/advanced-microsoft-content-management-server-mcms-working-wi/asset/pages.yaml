- pgno: 414
  md: '# MCMS and RSS


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_414_0.png)


    For postings to be included in the RSS feed, they must have been created or modified
    and published in the last 20 days, as this is the timeframe we configured in the
    Web.config.


    # Testing the RSS Feed in an Aggregator


    If you have an RSS aggregator on your computer, you can test the RSS feed by pointing
    your aggregator at `http://localhost/TropicalGreen/UtilityPages/rss.aspx`. Below
    is a screenshot of the feed being aggregated by RSS Bandit (www.rssbandit.org),
    which is one of the most popular of the free RSS aggregators.


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_414_1.png)'
