  md: "To fool the placeholder into accepting every tag, regardless of whether it's\
    \ a simple bold tag <b> or a script tag <script>, we will replace all less-than\
    \ (<) and greater-than (>) characters with the strings \"~LT~\" and \"~GT~\" respectively.\
    \ As a result, what gets saved to the placeholder is just funny looking text like\
    \ this:\n\n```\n```text\n~LT~script~GT~\nfunction Greet()\n{\n    alert(document.all.MyTextBox.value);\n\
    }\n~LT~/script~GT~\n```\n```\n\nThe converted text does not contain any restricted\
    \ tags. It is saved to the placeholder without any problems. Interestingly, the\
    \ popular Telerik r.a.d. editor uses the same technique to allow special tags.\n\
    \nSince the conversion process is done when the posting is saved, we will modify\
    \ the SavePlaceholderContent() method. Add the overridden SavePlaceholderContent()\
    \ method directly below the constructor. Within the save, we will call a method\
    \ named Escape() (defined right after this) that converts all tags to text.\n\n\
    ```\n```csharp\nprotected override void SavePlaceholderContent(PlaceholderControlSaveEventArgs\
    \ e)\n{\n    EnsureChildControls();\n    ((HtmlPlaceholder)(this.BoundPlaceholder)).Html\
    \ = Escape(this.Html);\n}\n```\n```\n\n# Escaping Tags\n\nThe Escape() method\
    \ simply replaces all less-than (<) characters with ~LT~ and all greater-than\
    \ characters (>) with ~GT~.\n\nIt is probably worth noting that only HTML markup\
    \ tags will contain the < and > characters. If an author enters these characters\
    \ as part of the main text within the placeholder, MCMS encodes the less-than\
    \ character to &lt; and the greater-than character to &gt;. Therefore we don't\
    \ have to worry about the Escape() routine messing up content entered by the author.\n\
    \n```\n```csharp\nprivate string Escape(string input)\n{\n    return input.Replace(\"\
    <\", \"~LT~\").Replace(\">\", \"~GT~\");\n}\n```\n```\n\n# UnEscaping Tags\n\n\
    The act of reverting the ~LT~ and ~GT~ characters back to the < and > characters\
    \ is done by the UnEscape() method. Add it directly below the Escape() method.\n\
    \n```\n```csharp\nprivate string UnEscape(string input)\n{\n    return input.Replace(\"\
    ~LT~\", \"<\").Replace(\"~GT~\", \">\");\n}\n```\n```\n\n# Loading Content for\
    \ Authoring and Presentation\n\nTo display the content, all we need to do is unescape\
    \ the ~LT~ and ~GT~ strings back to the < and > characters respectively."
  merge: -1
  img_proc: true
- pgno: 288
  md: "The first place where content is displayed is in authoring view when authors\
    \ update the placeholder's content. We only need to convert the text when the\
    \ placeholder is being edited, or when the Web Author is in the AuthoringReedit\
    \ mode. The UnEscape() method defined earlier does the conversion. Add the overridden\
    \ LoadPlaceholderContentForAuthoring() method shown below:\n\n```\nprotected override\
    \ void LoadPlaceholderContentForAuthoring(\n    PlaceholderControlEventArgs e)\n\
    {\n    EnsureChildControls();\n    if (WebAuthorContext.Current.Mode == WebAuthorContextMode.AuthoringReedit)\n\
    \    {\n        base.Html = UnEscape(((HtmlPlaceholder)(base.BoundPlaceholder)).Html);\n\
    \    }\n    else\n    {\n        base.LoadPlaceholderContentForAuthoring(e);\n\
    \    }\n}\n```\n\nUploaded content is, needless to say, also shown in presentation\
    \ view. Regardless of whether or not the content is displayed when viewing the\
    \ posting for preview or published modes, the ~LT~ and ~GT~ strings must be converted\
    \ back to < and > characters respectively. We will do the conversion in the overridden\
    \ LoadPlaceholderContentForPresentation() method. Append the method to the code:\n\
    \n```\nprotected override void LoadPlaceholderContentForPresentation(\n    PlaceholderControlEventArgs\
    \ e)\n{\n    EnsureChildControls();\n    base.Html = UnEscape(((HtmlPlaceholder)(base.BoundPlaceholder)).Html);\n\
    }\n```\n\nThe control is complete. Save and build the solution.\n\n# Using the\
    \ AllTagsHtmlPlaceholderControl\n\nTo use the AllTagsHtmlPlaceholderControl, copy\
    \ the UsefulPlaceholderControl.dll library file to the bin directory or add it\
    \ as a reference to the project. After adding the control to the Toolbox, drag\
    \ and drop it onto template files as you would with regular placeholder controls.\
    \ Set the PlaceholderToBind property of the control to an existing HtmlPlaceholderDefinition.\n\
    \nIn addition, if authors are planning to save restricted tags like <script> blocks\
    \ and <input> elements, you will need to set the AllowHtmlSourceEditing property\
    \ of the control to true. The WYSIWYG editor does not allow authors to copy and\
    \ paste the restricted tags in Design view. They will have to click on the HTML\
    \ button on the authoring toolbar before pasting the HTML code into the control."
