    \n7. Switch back to Design view and double-click on the btnYes button. In the\
    \ btnYes_Click() event handler, simply make a call to the HierarchyItem.Delete()\
    \ method and commit the delete:\n\n```\nprivate void btnYes_Click(object sender,\
    \ System.EventArgs e)\n{\n    try\n    {\n        deletedObject.Delete();\n  \
    \      cmsContext.CommitAll();\n        // display the success message\n     \
    \   lblErrorMessage.Text = \"Item deleted successfully!\";\n    }\n    catch(Exception\
    \ ex)\n    {\n        // rollback all changes\n        cmsContext.RollbackAll();\n\
    \        // the CMS context needs to be disposed of after a rollback\n       \
    \ cmsContext.Dispose();\n        // display error message\n        lblErrorMessage.Text\
    \ = ex.Message;\n    }\n}\n```\n\nIf any errors occur in the process, the delete\
    \ operation is rolled back and an error message displayed.\n\nYou need to be aware\
    \ of some key points when deleting objects using the PAPI:\n\n+   - A container\
    \ with objects cannot be deleted until all items within it are deleted as well.\n\
    +   - Objects with existing dependants cannot be deleted until all dependants\
    \ are removed. For instance, if there are postings based on a template, the template\
    \ cannot be deleted until those postings are also deleted.\n+   - Postings that\
    \ link to the resource will maintain a link to the resource even though the resource\
    \ has been deleted. This was designed to prevent broken links. However the file\
    \ will no longer be accessible by resource managers. Only administrators will\
    \ be able to view them. In Chapter 13, we suggest a way handle these links in\
    \ Tip #4: How to Deal with Links to Deleted Resources.\n+   - Unlike the Delete\
    \ option in Site Manager, where deleted objects are stored in the Deleted Items\
    \ bin and can be recovered, objects deleted using the PAPI are no longer accessible\
    \ once the delete has been committed. The MCMS background process will remove\
    \ all resources that aren't referenced by a posting. Resources referenced by a\
    \ posting can be recovered by requesting a stored procedure from Microsoft Support\
    \ (reference number: SOX040517700117)."
