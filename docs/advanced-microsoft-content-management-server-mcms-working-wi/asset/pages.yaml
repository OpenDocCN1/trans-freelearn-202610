- pgno: 520
  md: 'If you see our Tropical Green plant catalog page, MCMS is working. If you don''t
    see our plant catalog homepage, there''s likely an issue with the excluded managed
    paths. Verify the last step.


    You''ll notice the last URL we tested looks quite strange as it contains two domains.
    The code from the first book *Building Websites with Microsoft Content Management
    Server* (Packt Publishing, January 2005, ISBN 1-904811-16-7), which we''ll assume
    you''re using, contains two top level channels: **international.tropicalgreen.net**
    and www.**tropicalgreen.net**. The first book implemented the MCMS Map Channel
    Names to Host Header Names option, which is why these channels have domains for
    their names. Unfortunately the Map Channel Names to Host Header Names feature
    is not supported when MCMS and SharePoint are running on the same virtual server.
    Therefore we have to disable this option and then the name of the top level channel
    we need to test (www.**tropicalgreen.net**) needs to be included in the URL. Usually
    you would change the channel structure in such a situation so that the domain
    name is not included in the URL.


    If you continue to have problems, refer to Microsoft Knowledge Base article #835248:
    http://support.microsoft.com/?id=835248.


    # Summary


    In this appendix, we have explained how to successfully create a SharePoint portal
    and an MCMS Web Entry Point on the same virtual server. After configuring the
    virtual server, we showed how to modify the managed path exclusions in the SharePoint
    virtual server settings to ensure that the SharePoint ISAPI filter ignores HTTP
    requests that are to be handled by MCMS.'
  merge: -1
  img_proc: true
