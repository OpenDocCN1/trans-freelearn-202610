  md: "Note that the channel will not be permanently created until a call to `CommitAll()`\
    \ is made.\n\n> > Although we only set selected properties of the new channel,\
    \ you could easily expand the interface to include all writeable properties of\
    \ the channel object.\n\nWhen you are done, save and build the project.\n\n# Validating\
    \ Names\n\nMCMS applies the following rules when naming an object:\n\n+   - The\
    \ name may only contain the characters:\n+     - A-Z a-z 0-9 (alphanumeric only)\n\
    +     - _ (underscore)\n+     - - (hyphen)\n+     - (space)\n+     - () (opening\
    \ and closing parenthesis)\n+     - . (period)\n+   - The name cannot end with\
    \ a period.\n+   - The name cannot contain two consecutive periods.\n\nTo ensure\
    \ that all names given to channels, postings, template galleries, templates, and\
    \ resources are valid, we will define a custom method named `ValidateMCMSObjectName()`.\
    \ The method accepts the name of the object as an input parameter and returns\
    \ a Boolean. A return value of `true` means that the name provided by the user\
    \ meets all requirements by MCMS and is valid.\n\nSince we will be adding dialogs\
    \ to CMS Explorer that create all kinds of MCMS objects, we will add the `ValidateMCMSObjectName()`\
    \ method to a class file, `Utility.cs`. In this way, we can re-use the method\
    \ across all web forms within the project.\n\n+   1. Add a class file to the project.\
    \ Name the file `Utility.cs`.\n+   2. Above the namespace declaration, add `System.Text.RegularExpressions`.\n\
    \n```\nusing System;\nusing System.Text.RegularExpressions;\nnamespace CMSExplorer\n\
    {\n    - - - code continues - - -\n}\n```\n\n+   3. Directly below the `Utility()`\
    \ constructor, add the `ValidateMCMSObjectName()` method:\n\n```\npublic static\
    \ bool ValidateMCMSObjectName(string name)\n{\n    bool isValid;\n\n    // test\
    \ for other characters as the ones in the list\n    Regex regEx1 = new Regex(@\"\
    [^A-Z0-9 _\\-()\\.]\",\n                             RegexOptions.IgnoreCase);\n\
    ```"
