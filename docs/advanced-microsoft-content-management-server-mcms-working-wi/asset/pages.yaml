    \nSave and build the solution.\n\nThe code first gets an instance of the destination\
    \ channel specified in the `txtDestination` textbox. It then checks to see if\
    \ the user has rights to create postings in the destination channel by looking\
    \ at the value returned by the `Channel.CanCreatePostings` property value.\n\n\
    Once we have ascertained that the destination channel exists and that the user\
    \ has the appropriate rights to create the postings within the channel, we get\
    \ an instance of the connected template. The connected template's path is retrieved\
    \ from the `txtTemplate` textbox. We proceed only if:\n\n+   - The connected template\
    \ exists.\n+   - The current user has the rights to use the template to create\
    \ postings. This is checked by looking at the value returned by the `Template.CanUseForAuthoring`\
    \ property.\n\nTo create a connected posting, a call to `Channel.CreateConnectedPosting()`\
    \ is made. We pass in both the template and the original posting as input parameters.\
    \ After the connected posting has been created, we set its properties. Here, we've\
    \ set its Display Name based on the value entered in the `txtDisplayName` text\
    \ box. You can, of course, set any writable property of the posting (bear in mind\
    \ that it is permitted and changes to certain property definitions and values\
    \ may affect other connected postings).\n\nIf all goes well, a success message\
    \ is displayed on the screen. Otherwise, an error message is displayed instead\
    \ and the entire operation is rolled back."
