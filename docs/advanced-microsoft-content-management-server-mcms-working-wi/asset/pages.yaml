  md: "# Building SharePoint Web Parts\n\n+   3. Enter `NavigationWebPartMCMSIntegration`\
    \ as the name and click OK.\n+   \n+   4. Add a reference to `Microsoft.ContentManagement.Publishing.dll`.\
    \ As with other library files from the `Microsoft.ContentManagement` namespace,\
    \ this is found in the `<install directory>/Microsoft Content Management Server/server/bin`\
    \ directory.\n+   \n+   5. You should now have the empty `NavigationWebPartMCMSIntegration`\
    \ class on screen. Add the following namespaces to the new class file:\n+   \n\
    +   ```csharp\n+   using System;\n+   using Microsoft.ContentManagement.Publishing;\n\
    +   using System.Security.Principal;\n+   using System.Web;\n+   using System.Xml;\n\
    +   using System.IO;\n+   ```\n+   \n+   6. We will now add the `GetListing()`\
    \ method, which connects to MCMS and generates the XML listing all the ChannelItems:\n\
    \n```\n```csharp\npublic static System.Xml.XmlDocument GetListing(string StartChannelPath,\n\
    \                                                NavigationWebPart.enmSortBy sortBy)\n\
    {\n    // Get the channel from the searches object\n    Channel startChannel =\
    \ CmsHttpContext.Current.Searches.GetByPath(\n                               \
    \                 StartChannelPath) as Channel;\n\n    // Was the channel found?\n\
    \    if (startChannel != null)\n    {\n        // Get all Children from the Start\
    \ Channel\n        ChannelAndPostingCollection _Children = startChannel.AllChildren;\n\
    \n        // Sort the Items\n        _Children = SortMCMSChannelItems(sortBy,\
    \ _Children);\n\n        // Declare the string writer and the XmlTextWriter\n\
    \        StringWriter tw = new StringWriter();\n        XmlTextWriter _Writer\
    \ = new XmlTextWriter(tw);\n\n        // Write the <Channel> element\n       \
    \ _Writer.WriteStartDocument();\n        _Writer.WriteStartElement(\"Channel\"\
    );\n        _Writer.WriteAttributeString(\"path\", startChannel.Path);\n     \
    \   _Writer.WriteAttributeString(\"displayname\", startChannel.DisplayName);\n\
    \n        // Loop through all the channel items\n        foreach (ChannelItem\
    \ _ChannelItem in _Children)\n        {\n            // Write the ChannelItem\
    \ element and set its attributes\n            _Writer.WriteStartElement(\"ChannelItem\"\
    );\n            _Writer.WriteAttributeString(\"path\", _ChannelItem.Path);\n \
    \           _Writer.WriteAttributeString(\"url\", _ChannelItem.Url);\n       \
    \     _Writer.WriteAttributeString(\"displayname\",\n                        \
    \                _ChannelItem.DisplayName);\n\n            // Check what type\
    \ of Channel Item it is and set the type attribute\n            if (_ChannelItem\
    \ is Posting)\n            {\n                _Writer.WriteAttributeString(\"\
    type\", \"Posting\");\n            }\n            else\n            {\n      \
    \          _Writer.WriteAttributeString(\"type\", \"Channel\");\n            }\n\
    \            _Writer.WriteEndElement();\n        }\n```\n```"
