- pgno: 21
  md: '# Introduction


    Following on from *Building Websites with Microsoft Content Management Server*
    (Packt Publishing, January 2005, ISBN 1-904811-16-7), this book takes MCMS development
    to a higher level of both power and integration. Like its predecessor, this book
    is packed with code examples and never-before-seen secrets of MCMS.


    Microsoft Content Management Server 2002 is a dynamic web publishing system with
    which you can build websites quickly and cost-efficiently. MCMS provides the administration,
    authoring, and data-management functionality and you provide the website interface,
    logic, and workflow. Microsoft SharePoint Portal Server (SPS) also features in
    this book. SPS 2003 enables enterprises to deploy an intelligent portal that seamlessly
    connects users, teams, and knowledge so that people can take advantage of relevant
    information across business processes to help them work more efficiently.


    You''ve mastered the basics of MCMS, and have set up your own MCMS installation.
    But you''ve only scratched the surface. This book is your gateway to squeezing
    every penny from your investment in MCMS and SPS, and making these two applications
    work together to provide an outstanding richness of content delivery and easy
    maintainability.


    # What This Book Covers


    *Chapter 1* demonstrates the power of the MCMS Publishing API (PAPI) by building
    the **CMS Explorer** administration tool to manage an MCMS website. *Chapter 2*
    builds on the CMS Explorer by adding the ability to manage channels and postings.
    *Chapter 3* looks at the creation, submission, copying, moving, and deletion of
    templates, template galleries, and resources through the PAPI.


    In *Chapter 4*, you will learn how to prepare postings for search indexing. We
    look at several techniques that can improve the accuracy of search results and
    optimize your search engine.


    SharePoint Portal Technologies complement MCMS by providing collaboration, document
    libraries, and searching to the robust publishing workflow of MCMS. *Chapter 5*
    takes you through the process of adding searching to an MCMS Site using SharePoint
    Portal Server, either using the MCMS Connector for SharePoint Technologies or
    by building your own solution.


    *Chapter 6* demonstrates how you can use the MCMS Connector for SharePoint to
    build your own components to share content between MCMS and SharePoint. *Chapter
    7* shows how you can build Web Parts that integrate content from MCMS on a SharePoint
    portal site.


    *Chapter 8* discusses five custom placeholder controls that provide some frequently
    requested features that are not present in the default controls: a date-time picker
    placeholder control, a placeholder control that permits multiple attachments,
    an image-rotator placeholder control, a placeholder control to store all kinds
    of HTML tags, and a DataGrid placeholder control.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Validation of content is a key requirement in many MCMS implementations. Chapter
    9 looks at how you can apply ASP.NET validation techniques to each of the out-of-the
    box placeholder controls.


    Static pages are often used in direct mailers, help files, and even for archiving
    purposes. Chapter 10 discusses a couple of techniques that you can use to create
    static snapshots of postings.


    The authoring experience doesn''t always need to be through the browser. One author-friendly
    way of maintaining content is detailed in Chapter 11. In this chapter, we leverage
    the power of InfoPath to quickly create a GUI that allows authors to submit content
    directly from Microsoft Word, with the help of MCMS Web Services.


    Since the release of MCMS in 2002, a lot of technologies have changed. Syndication
    of websites using RSS is the norm, and to capitalize on this, Chapter 12 takes
    you through the steps involved in creating a dynamic RSS feed of your website''s
    recent changes.


    Finally, Chapter 13 provides many invaluable insider''s tips and tricks for MCMS,
    as well as solutions to common MCMS issues, including gems such as how to revert
    a posting to a previous version, change a posting''s template, build a recycle
    bin, and export resource gallery items using the Site Deployment API.


    # What You Need for This Book


    This book has been written for ASP.NET developers with a sound grasp of C#. To
    use this book, you need to have access to the following:


    +   - Visual Studio .NET Professional or higher (2002 or 2003 version).

    +   - Microsoft Content Management Server 2002 Developer or Enterprise edition.
    You can also use the Standard edition, but be aware that some features will not
    be available. A 120-day evaluation version of the Enterprise edition is available
    at http://www.microsoft.com/cmserver.


    To install and run Microsoft Content Management Server 2002, you will need the
    following:


    +   - The .NET Framework 1.0 or 1.1.

    +   - One of the following operating systems: Windows Server 2003, Windows 2000
    Professional, Windows 2000 Server, or Windows XP Professional.

    +   - An installation of SQL Server 2000 Developer or Enterprise edition.


    Some of the chapters utilize Microsoft SharePoint Portal Server 2003. For these
    chapters, you will need:


    +   - The .NET Framework 1.1.

    +   - Windows Server 2003.

    +   - An installation of SQL Server 2000 Developer or Enterprise editions.

    +   - An installation of SharePoint Portal Server 2003. A 120-day evaluation version
    is available at http://www.microsoft.com/sharepoint.'
  merge: -1
  img_proc: true
- pgno: 23
  md: "# Conventions\n\nIn this book, you will find a number of styles of text that\
    \ distinguish between different kinds of information. This section provides some\
    \ examples of these styles, and an explanation of their meaning.\n\nThere are\
    \ three styles for code. Code words in text are shown as follows: \"Pass the path\
    \ of any object as an input parameter of the Searches.GetByPath() method to retrieve\
    \ the requested object\".\n\nIf we have a block of code, it will be set as follows:\n\
    \n```\nHierarchyItem hlItem = cmsContext.Searches.GetByPath(\n\"/Channels/TropicalGreen/MysteryObject\"\
    );\n\nif (hlItem is Channel)\n{\n    // Object is a Channel\n}\nelse if (hlItem\
    \ is Posting)\n{\n    // Object is a Posting\n}\n```\n\nWhen we wish to draw your\
    \ attention to a particular part of a code block, the relevant lines will be made\
    \ bold:\n\n```\nprivate CmsHttpContext cmsContext;\nprivate void Page_Load(object\
    \ sender, System.EventArgs e)\n{\n    // Put user code to initialize the page\
    \ here\n    cmsContext = CmsHttpContext.Current;\n    if (!Page.IsPostBack)\n\
    \    {\n        GetPlantFactSheets();\n    }\n}\n```\n\n**New terms** and **important\
    \ words** are introduced in a bold-type font. Words that you see on the screen,\
    \ in menus, on dialog boxes, and so on, appear in our text like this: \"clicking\
    \ the Next button takes you to the next screen\".\n\nGeneral tips, suggestions,\
    \ or important notes appear in a box like this.\n\nTroubleshooting tips and suggestions\
    \ appear in the following format:\n\n# The option for the component I want to\
    \ install is grayed out and I can't select it.\n\nThat's because you do not have\
    \ the prerequisites required by that component. For example, if you did not install\
    \ Microsoft Visual Studio, you will not be able to install the Developer Tools.\
    \ To find out what's missing, click on the component and read the description\
    \ on the right-hand side of the dialog."
  merge: -1
  img_proc: true
