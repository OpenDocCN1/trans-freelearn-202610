- pgno: 255
  md: '# While the dialog works fine, I need a more portable control that can be used
    across projects without having to recreate the Web Form each time I use the control.
    What are my options?


    To deploy the control across multiple projects, consider one of the following
    options:


    +   1. Create a folder within the `/IIS_CMS/` folder and store the dialog there.
    As all MCMS web projects have a virtual directory named CMS mapped to the `IIS_CMS`
    folder, the path of the dialog would be `/CMS/SubFolder/datetimepicker.aspx`.

    +   2. You could follow the concept used by MCMS when deploying the `/nr/` folder
    across all websites on the same computer by adding the folder that contains the
    DateTimePicker control to each virtual website that uses it.

    +   3. Alternatively, use the technique MCMS uses when deploying the `/CMS/` folder
    to new MCMS template projects. Add the folder that contains the DateTimePicker
    control to each template project that requires it. When getting the path of the
    control from within the code, use the value returned from `Page.Request.ApplicationPath`.
    To automate this for new projects, you could create a new enterprise template
    for Visual Studio .NET. For more information about creating and editing enterprise
    templates, see `http://msdn.microsoft.com/Library/en-us/vsent7/html/vxoriEnterpriseTemplates.asp`.

    +   4. Rewrite the date time picker control so that the calendar, hour and minute
    drop down menus are generated on the control itself. You can embed them within
    a `<div>` tag and use client-side script to show them when the Pick Date button
    is clicked.


    # Adding the Placeholder Control to a Template File


    To add the control to an MCMS project, you will have to add the component to the
    Toolbox:


    +   - Right-click on the tab you wish to add the control to.

    +   - Select Add/Remove Items and choose to add a .NET Framework Component.

    +   - Select Browse… and select `UsefulPlaceholderControls.dll`. Click Open.

    +   - Click OK to close the dialog and add the control(s) to the Toolbox.


    Once the control has been added to the Toolbox, you can drag and drop it onto
    a template file and set its properties as you would with regular placeholder controls.'
  merge: -1
  img_proc: true
