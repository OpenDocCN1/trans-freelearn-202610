    the right-hand side. Give the HyperLink the ID aName (note that we have prefixed
    it with the letter ''a''), and set its Text property to be an empty string.


    Next, drag a DataGrid and drop it below the Available Revisions header. The DataGrid
    will list all revisions of the posting. Set the ID of the DataGrid to dgPageRevisionsList
    and the AutoGenerateColumns property to false. Switch to HTML view and add four
    columns to the grid. The first column displays the name of the posting for that
    particular version, the second shows the revision date, the third is a hyperlink
    that links to a preview page, and the fourth is a button that triggers the page
    reversion process.


