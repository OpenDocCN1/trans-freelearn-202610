- pgno: 362
  md: "Note that the \"Map Channel Names to Host Headers\" feature is not available\
    \ in MCMS Standard Edition.\n\nHowever, the Searches.GetByUrl() method does not\
    \ work reliably for sites where channel names are mapped to host header names.\
    \ When the Searches.GetByUrl() method is fed the URL of, say, the top-level channel,\
    \ http://tropicalgreen, we would expect it to return an instance of the tropicalgreen\
    \ channel. The trouble is it returns a null object instead. This is because an\
    \ issue with the Searches.GetByUrl() method causes it to expect the input URL\
    \ to be http://localhost/tropicalgreen regardless of whether the \"Map Channel\
    \ Names to Host Headers\" option is set to \"Yes\" or \"No\". We will create the\
    \ EnhancedGetByUrl() method to get around this problem.\n\nThe EnhancedGetByUrl()\
    \ method first checks to see if the \"Map Channel Names to Host Headers\" option\
    \ is set to \"Yes\" or \"No\". It does so by looking at the published URL of the\
    \ root channel. When \"Map Channel Names to Host Headers\" has been set to \"\
    Yes\", the root channel's URL will be http://Channels/. Otherwise, it will simply\
    \ be /Channels/.\n\nIf the \"Map Channel Names to Host Headers\" option is set\
    \ to \"Yes\", we will convert the input URL to a path and use the Searches.GetByPath()\
    \ method to retrieve an instance of the channel item. For example, if the URL\
    \ is http://tropicalgreen/plantcatalog, the routine converts it to the channel's\
    \ path: /Channels/tropicalgreen/plantcatalog. Add the following code to the class:\n\
    \n```\nstatic ChannelItem EnhancedGetByUrl(string url)\n{\n    if (IsMapChannelToHostHeaderEnabled())\n\
    \    {\n        // Remove \"http://\" from the URL and remove any trailing forward\
    \ slashes\n        string hostName = m_SourceHost.ToLower().Replace(\"http://\"\
    , \"\").Trim(new Char[] {'/'});\n        // Convert the URL to a path\n      \
    \  string Path = HttpUtility.UrlDecode(url);\n        Path = Path.Replace(\"http://\"\
    , \"/Channels/\");\n        if (!Path.StartsWith(\"/Channels/\"))\n        {\n\
    \            Path = \"/Channels/\"+hostName+Path;\n        }\n        if (Path.EndsWith(\"\
    .htm\"))\n        {\n            Path = Path.Substring(0,Path.Length - 4);\n \
    \       }\n        if (Path.EndsWith(\"/\"))\n        {\n            Path = Path.Substring(0,Path.Length\
    \ - 1);\n        }\n        return (ChannelItem)(cmsContext.Searches.GetByPath(Path));\n\
    \    }\n    else\n    {\n        return cmsContext.Searches.GetByUrl(url);\n \
    \   }\n}\nstatic bool IsMapChannelToHostHeaderEnabled()\n{\n    return (cmsContext.RootChannel.UrlModePublished\
    \ == \"http://Channels/\");\n}\n```"
  merge: -1
  img_proc: true
- pgno: 363
  md: "# Downloading the Attachments\n\nOnce we have collected a list of attachments\
    \ for each channel cover page or posting, we are ready to generate static copies\
    \ of them. To do so, we will call a helper function DownloadAttachments() at two\
    \ points in the CollectChannel() method:\n\n+   - After the channel's cover page\
    \ has been staged\n+   - After each posting has been staged\n\nAdd the calls to\
    \ the DownloadAttachments() method as shown in the highlighted portions of the\
    \ code below:\n\n```\nstatic void CollectChannel(Channel channel)\n{\n    // Download\
    \ the channel itself\n    WriteToLog(\"Info: Downloading Channel: \" + channel.Path);\n\
    \    Download(GetUrlWithHost(channel.Url), channel.Path.Replace(\n        m_StartChannel,\"\
    \"),\n        m_DefaultFileName, EnumBinary.ContentPage);\n\n    // Download all\
    \ attachments in the cover page or channel rendering script\n    DownloadAttachments();\n\
    \n    // Download all the postings within the channel\n    foreach (Posting p\
    \ in channel.Postings)\n    {\n        WriteToLog(\"Info: Downloading Posting:\
    \ \" + p.Path);\n        Download(GetUrlWithHost(p.Url), channel.Path.Replace(m_StartChannel,\"\
    /\"),\n            p.Name, EnumBinary.ContentPage);\n\n        // Download all\
    \ attachments in the posting\n        DownloadAttachments();\n    }\n    foreach\
    \ (Channel c in channel.Channels)\n    {\n        CollectChannel(c);\n    }\n\
    }\n```\n\nThe DownloadAttachments() method loops through each element of the m_AttachmentUrls\
    \ array and extracts the attachment's path and file name from its URL. The Download()\
    \ method that we defined earlier is called to stage each attachment as a static\
    \ file.\n\n```\nprivate static void DownloadAttachments()\n{\n    for (int i =\
    \ 0; i < m_AttachmentUrls.Count; i++)\n    {\n        string path = m_AttachmentUrls[i].ToString();\n\
    \        string[] arrPath = path.Split('/');\n        string fileName = arrPath[arrPath.Length\
    \ - 1];\n        path = \"\";\n        for (int j = 0; j < arrPath.Length - 1;\
    \ j++)\n        {\n            path += arrPath[j] + \"/\";\n        }\n      \
    \  Download(GetUrlWithHost(m_AttachmentUrls[i].ToString()), path, fileName,\n\
    \            EnumBinary.ContentBinary);\n    }\n    m_AttachmentUrls.Clear();\n\
    }\n```"
