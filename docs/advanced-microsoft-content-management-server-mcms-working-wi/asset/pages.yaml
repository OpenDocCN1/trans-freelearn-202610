  md: 'The final result looks something like this:


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_170_0.png)


    You''ll see that the description field may not have exactly what we''re looking
    for, but this technique lets us customize the search result list to our hearts''
    content. You could pull the description of the posting straight out of the indexed
    values, provided you exposed the page description using the SearchPropertyCollection.xml
    file. Or you could even have an HtmlPlaceholder called "Search Description" in
    all your templates that content owners could use to enter a description to show
    when the posting appears in search results.


    # Summary


    In this chapter we discussed a few of the options available to MCMS developers
    for adding search functionality to their sites. We proceeded to take an in-depth
    look at the searching features built into SharePoint Portal Server and how they
    can be leveraged as a back-end search workhorse for an MCMS site. Before we could
    start adding the search functionality, we had to make a few changes to our site
    and templates, as well as build an index using SharePoint to crawl our site.


    Once our site was configured for index crawls and SharePoint was configured to
    crawl our site and build an index, we explored in detail two options for adding
    search functionality to the Tropical Green site using the SharePoint crawler:


    +   - First we implemented search using the MCMS Connector for SharePoint Technologies,
    an out-of-the-box solution.

    +   - Then, we built our own solution using the SharePoint Query Service Web Service
    and custom full text T-SQL queries to provide search filters and customized results.'
