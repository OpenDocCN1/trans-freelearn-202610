- pgno: 232
  md: "As we are building the Web Part as a server control, we must declare our controls\
    \ and instantiate them by overriding the CreateChildControls method in NavigationWebPart.cs:\n\
    \n```\n#region declarations - Web controls\nprotected System.Web.UI.WebControls.Xml\
    \ XmlXsIWebControl;\n#endregion\n\n#region Preparing the controls\nprotected override\
    \ void CreateChildControls()\n{\n    XmlXsIWebControl = new System.Web.UI.WebControls.Xml();\n\
    \    this.Controls.Add(XmlXsIWebControl);\n}\n#endregion\n```\n\nThe System.Web.UI.WebControls.Xml\
    \ Web Control can transform XML using specified XSLT, which is more efficient\
    \ than developing the XML/XSLT by hand.\n\nThe RenderWebPart() method needs to\
    \ be overridden to ensure that the rest of our code is being executed. Let's add\
    \ the code to the RenderWebPart() method to generate the MCMS listing:\n\n```\n\
    #region Methods\nprotected override void RenderWebPart(HtmlTextWriter output)\n\
    {\n    // Check our child controls are created OK\n    EnsureChildControls();\n\
    \n    try\n    {\n        // Get the Page listing from MCMS\n        ExecuteMCMSListing(output);\n\
    \    }\n    catch(Exception ex)\n    {\n        // In production show only a short\
    \ message with no internal exception details\n        if (this.Mode == enumMode.Production)\n\
    \        {\n            // Suppress Exceptions\n            output.Write(\"An\
    \ Error Occurred in the Navigation Web Part.\");\n        }\n        else\n  \
    \      {\n            // Output detailed exception message (escape characters)\n\
    \            output.Write(SPEncode.HtmlEncode(ex.Message + \",\" + ex.Source +\
    \ \",\" + ex.StackTrace));\n        }\n    }\n}\n```\n\nThe next method, ExecuteMCMSListing(),\
    \ determines which mode the Web Part is running in and retrieves the channel listing\
    \ data. The channel listing data can be read from MCMS or can be loaded from the\
    \ test XML file on the file system."
  merge: -1
  img_proc: true
- pgno: 233
  md: "```\n/// <summary>\n/// Executes the MCMS listing code\n/// </summary>\nprivate\
    \ void ExecuteMCMSListing(HtmlTextWriter output)\n{\n    // Check the mode we\
    \ are in and perform the correct action\n    switch (this.Mode)\n    {\n     \
    \   case ennMode.Production:\n        case ennMode.DebugShowException:\n     \
    \       // Set up the Xml/Xsl Webcontrol and render its output to the\n      \
    \      // HtmlTextWriter\n            XmlXslWebControl.Transform = GetTransform();\n\
    \            XmlXslWebControl.Document = NavigationWebPartMCMSIntegration.GetListing(this.StartChannel,\
    \ this.SortBy);\n            XmlXslWebControl.RenderControl(output);\n       \
    \     break;\n\n        case ennMode.DebugShowXml:\n            System.Xml.XmlDocument\
    \ _Listing =\n                NavigationWebPartMCMSIntegration.GetListing(this.StartChannel,\
    \ this.SortBy);\n\n            // Output the escaped XML directly to the HtmlTextWriter\n\
    \            output.Write(SPEncode.HtmlEncode(_Listing.OuterXml));\n         \
    \   break;\n\n        case ennMode.DebugWithTestData:\n            // Get the\
    \ Test XML Data & load into an XmlDocument\n            System.Xml.XmlDocument\
    \ _DataDocument = new System.Xml.XmlDocument();\n            _DataDocument.LoadXml(this.TestXml);\n\
    \            // Setup XML/XSLT Web control and render its output to HtmlTextWriter\n\
    \            XmlXslWebControl.Transform = GetTransform();\n            XmlXslWebControl.Document\
    \ = _DataDocument;\n            XmlXslWebControl.RenderControl(output);\n    \
    \        break;\n\n        default:\n            throw new Exception(\"Invalid\
    \ Mode!\");\n    }\n}\n```\n\nTo retrieve the XsltTransform object, we will create\
    \ a helper method called GetTransform(). This method will return an XsltTransform\
    \ object by loading the XSLT stylesheet from the file system into an XmlDocument\
    \ object. The XmlDocument object is then loaded into an XsltTransform object and\
    \ returned:\n\n```\n/// <summary>\n/// Get the XSLT as a System.Xml.XslTransform\
    \ object\n/// </summary>\n/// <returns>The System.Xml.XslTransform object</returns>\n\
    private System.Xml.Xsl.XslTransform GetTransform()\n{\n    // Get the XSLT and\
    \ load it into an XML document\n    System.Xml.XmlDocument _TransformDoc = new\
    \ System.Xml.XmlDocument();\n    _TransformDoc.LoadXml(this.PresentationXsl);\n\
    \    System.Xml.Xsl.XslTransform _Transform = new System.Xml.Xsl.XslTransform();\n\
    \    // Load our XSLT\n    _Transform.Load(_TransformDoc.CreateNavigator(), null,\
    \ null);\n    return(_Transform);\n}\n#endregion\n```"
