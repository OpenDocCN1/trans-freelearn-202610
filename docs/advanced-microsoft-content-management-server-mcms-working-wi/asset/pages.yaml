    \ incremental number). This is a known bug with the PAPI.\n\nIn this example,\
    \ we added a simple text custom property definition. For the more complex selection\
    \ custom property definition, the technique is very similar. The code snippet\
    \ below shows how to create a custom property definition named MenuLocation with\
    \ four allowed values: Left, Right, Top, and Bottom. It specifies Top as the default\
    \ value.\n\n```\nCustomPropertyDefinition customPropSelection;\ncustomPropSelection\
    \ = new Template.CreateCustomPropertyDefinition();\ncustomPropSelection.Name =\
    \ \"MenuLocation\";\ncustomPropSelection.AddAllowedValue(\"Left\");\ncustomPropSelection.AddAllowedValue(\"\
    Right\");\ncustomPropSelection.AddAllowedValue(\"Top\");\ncustomPropSelection.AddAllowedValue(\"\
    Bottom\");\ncustomPropSelection.DefaultValue = \"Top\";\n```\n\n# Creating Placeholder\
    \ Definitions\n\nPlaceholder definitions can be created programmatically too,\
    \ thanks to the PAPI's Template.CreatePlaceholderDefinition() method. You can\
