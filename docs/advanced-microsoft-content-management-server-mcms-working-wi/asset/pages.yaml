- pgno: 311
  md: "```\nelse\n{\n    // content is valid\n    return true;\n}\n}\nfunction isEmpty(content)\n\
    {\n    // Add more tags to ignore in this list if you need to.\n    // Here, we\
    \ ignore <hr> and <img> tags\n    // Additional tags should be added and separated\
    \ with a \"|\" character.\n    var tagsToKeep = \"img|hr\";\n\n    // This regular\
    \ expression matches all <img> and <hr> tags\n    var regExpTagsToKeep = \"<[\\\
    \\s]*(\\\" + tagsToKeep + \")\\\\b[^>]*>\";\n    var reTagsToKeep = new RegExp(regExpTagsToKeep,\
    \ \"gim\");\n\n    // exit if one of the tags to keep is included.\n    if (content.match(reTagsToKeep))\n\
    \    {\n        // Placeholder is not empty.\n        return false;\n    }\n\n\
    \    // This regular expression gets all tags in the content\n    var regExpForAllTags\
    \ = \"<[ ^ ]*>\";\n    var reAllTags = new RegExp(regExpForAllTags,\"gim\");\n\
    \n    // Remove all tags by replacing with an empty string\n    content = content.replace(reAllTags,\
    \ \"\");\n\n    // Remove all spaces and non-breaking spaces (&nbsp;)\n    content\
    \ = content.replace(\" \",\"\");\n    content = content.replace(\"&nbsp;\",\"\"\
    );\n\n    if (content == \"\")\n    {\n        // if after removing all tags,\
    \ we are left with an empty string\n        // Placeholder is empty.\n       \
    \ return true;\n    }\n    else\n    {\n        // if after removing all tags,\
    \ we still have content.\n        // Placeholder is not empty.\n        return\
    \ false;\n    }\n}\n</script>\n```\n\n# Matching Tags with Regular Expressions\n\
    \nThe isEmpty() JavaScript function we've just seen makes use of two regular expressions.\
    \ The first checks the HTML for instances of <img> and <hr> tags. Recall that\
    \ as long as the HTML contains these single tagged items, it's not empty. Let's\
    \ take a closer look at the expression:\n\n<[\\s|/]*(img|hr)\\b[^>]*>\n\nThe first\
    \ and last characters, < and >, match the opening and closing angle brackets of\
    \ all HTML tags.\n\nAfter the opening angled bracket comes the escape sequence\
    \ for a space or a forward slash, followed by an asterisk (the Kleene star), \\\
    s*. This ensures that tags with spaces after the opening angle bracket (such as\
    \ < img>) and closing tags are included in the match."
