- pgno: 407
  md: "# The Structure of an RSS Feed\n\nAn RSS feed is an XML document that conforms\
    \ to a certain specification. We'll be using RSS version 2.0, as described at\
    \ `http://blogs.law.harvard.edu/tech/rss`. The following table outlines the elements\
    \ that an RSS feed contains.\n\n| Parent | Element | Description |\n|---|---|---|\n\
    | *(this is the root element)* | `rss` | The top level element of the RSS feed.\
    \ |\n| `rss` | `channel` | |\n| `channel` | `link` | The URL to the website. |\n\
    | `channel` | `title` | The title of the RSS Feed, such as Tropical Green. |\n\
    | `channel` | `copyright` | Copyright information pertaining to the RSS feed.\
    \ |\n| `channel` | `description` | The description of the RSS feed. |\n| `channel`\
    \ | `managingEditor` | The e-mail address for the person responsible for the content.\
    \ |\n| `channel` | `webMaster` | The e-mail address of the Webmaster. |\n| `channel`\
    \ | `generator` | The name of the application used to generate the feed. |\n|\
    \ `channel` | `item` | A repeating element for each article to be aggregated.\
    \ |\n| `item` | `title` | The title of the article. In this case we are using\
    \ the `DisplayName` property of the posting. |\n| `item` | `link` | The link to\
    \ the HTML version of the article (or more information). |\n| `item` | `pubDate`\
    \ | The date the item was published. |\n| `item` | `author` | The author's name\
    \ or e-mail address for the item. |\n| `item` | `guid` | A Globally Unique ID\
    \ for the item. This element maps perfectly to MCMS as postings already have GUIDs.\
    \ |\n| `item` | `description` | The content that will be included for this item.\
    \ |\n\nRemember that as the RSS feed is XML, all element names are case sensitive.\
    \ Below is a sample feed:\n\n```\n```xml\n<rss version=\"2.0\">\n  <channel>\n\
    \    <link>http://localhost</link>\n    <title>Tropical Green's website</title>\n\
    \    <copyright>© Tropical Green 2005</copyright>\n    <description>The latest\
    \ changes from the Tropical Green\n      website.</description>\n    <managingEditor>content@tropicalgreen.net</managingEditor>\n\
    \    <webMaster>webmaster@tropicalgreen.net</webMaster>\n    <generator>MCMS 2002\
    \ RSS Feed Generator</generator>\n    <item>\n      <title>A Walk Through Jenny's\
    \ Garden</title>\n      <link>http://localhost/www.tropicalgreen.net/Columns\n\
    \        /AWalkThroughJennysGarden.htm</link>\n      <pubDate>Thu, 17 Mar 2005\
    \ 13:07:31 GMT</pubDate>\n      <author>WinNT://DEVELOPERXP/Developer</author>\n\
    ```\n```"
  merge: -1
  img_proc: true
