  md: "![](img/442e26bf28f2df81fbf8dff3478f88e3_507_0.png)\n\nThis happens because\
    \ Web Author is trying to offset the dialogs by a few pixels to let the author\
    \ know that it's a new window that sits on top of the parent.\n\nA solution to\
    \ get around this problem is to change the JavaScript that sizes the window. For\
    \ ASP.NET-based solutions, the file to modify is the **Windows.js** file located\
    \ in the **<install directory>\\Microsoft Content Management Server\\Server\\\
    IIS_CMS\\WebAuthor\\Client\\** directory (gentle reminder: make a backup of the\
    \ file before you modify it).\n\nModify the WBC_UseDefaultSizing() function by\
    \ reducing the height and width of the window to ensure that the new window will\
    \ reside within the window of the parent.\n\n```\nfunction WBC_UseDefaultSizing(pWindow)\n\
    {\n    var lWidth = WBC_getWindowWidth(pWindow) - 2 * IDS_WIDTH_OFFSET;\n    var\
    \ lHeight = WBC_getWindowHeight(pWindow) - 2 * IDS_HEIGHT_OFFSET;\n    . . . code\
    \ continues . . .\n}\n```\n\nThe next time you click on a button that opens a\
    \ new window from the Web Author Console in maximized or Full Screen mode, the\
    \ window sits perfectly within the screen.\n\n# Tip #10: How to Get Frames and\
    \ IFrames to Work Correctly in a Template File\n\nFrames provide a convenient\
    \ way to keep portions of the site static as users jump from one page to another.\
    \ IFrames are often used as mini-windows within a page to display content from\
    \ other sites. While providing convenient solutions for sticky navigation issues,\
    \ the added level of complexity that frames bring to any web design often proves\
    \ to be a bane for many developers.\n\nThe same is true for MCMS websites. Frames\
    \ and IFrames do not work perfectly on template files. JavaScript errors occur\
    \ when toggling between Live and Edit Site views when:\n\n+   - The Frame or IFrame\
    \ embedded within the template file links to another site.\n+   - An MCMS page\
    \ that the author is working on is located within a Frame or IFrame of another\
    \ website.\n\nThe good news is that both issues can be fixed."
  merge: -1
  img_proc: true
