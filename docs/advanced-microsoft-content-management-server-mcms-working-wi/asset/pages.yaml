    \ pages to behave differently when they are requested by our staging tool. For\
    \ example, to include selected content on a generated static page, you would do\
    \ something like this:\n\n```\n```csharp\nif (Request.Header(\"DotNetSiteStager\"\
    ) != null)\n{\n    // The following line of code will only execute when the page\n\
    \    // is requested by the stager\n    Response.Write(\"Page generated by DotNetSiteStager.\"\
    );\n}\n```\n```\n\n# Getting Responses and Creating Files\n\nAfter issuing an\
    \ HTTP request, we call the HttpWebResponse.GetResponse() method to get the response.\
    \ If all goes well, we will get an HTTP 200 (OK) status code, which means that\
    \ the page was downloaded successfully.\n\nThe resulting byte-array is then converted\
    \ to a static file using a FileStream object.\n\n```\n```csharp\nstatic void Download(string\
    \ url, string path, string fileName,\n                     EnumBinary flag)\n\
    {\n    // Stage only postings\n    if (flag == EnumBinary.ContentPage)\n    {\n\
    \        try\n        {\n            . . . code continues . . .\n            //\
    \ Get the response;\n            HttpWebResponse response = request.GetResponse()\
    \ as HttpWebResponse;\n\n            // If all goes well, we will retrieve a status\
    \ code of 200 (OK)\n            if (response.StatusCode == HttpStatusCode.OK)\n\
    \            {\n                BinaryReader br = new BinaryReader(response.GetResponseStream());\n\
    \                int contentLength = (int)response.ContentLength;\n          \
    \      byte[] buffer = br.ReadBytes(contentLength);\n\n                // Process\
    \ page and download attachments\n                ProcessPageAndGetAttachments(response.ContentEncoding,\
    \ ref buffer);\n\n                Directory.CreateDirectory(filePath);\n     \
    \           if (fileName.IndexOf(\".\") < 0)\n                {\n            \
    \        fileName = fileName + \".\" + m_DefaultFileExtension;\n```\n```"
