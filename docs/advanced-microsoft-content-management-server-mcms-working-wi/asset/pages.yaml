- pgno: 359
  md: "The SetBaseUrl() routine handles <base> tags. <base> tags are typically embedded\
    \ between <head> tags. Here's an example of a <base> tag:\n\n```\n<base href=\"\
    http://tropicalgreen/TropicalGreen/Templates/Plant.aspx?NRMODE=Published&NRORIGINALURL=%2fPlantCatalog%2fAloeVera%2ehtm&NRNODEGUID=%7b569D1CCA-9A9D-4C43-B0C3-DB1AACD98684%7d&NRCACHEHINT=NoModifyGuest\"\
    >\n```\n\nNotice that the URL of the template file is stored in its href attribute.\
    \ Browsers add this href value to all relative links found within the page. In\
    \ the SetBaseUrl() method, we will extract the value of the href attribute of\
    \ the <base> tag and store it in the m_LocalBaseUrl variable. Later on, we will\
    \ use this value to construct the actual URLs of relative attachments found on\
    \ the page.\n\n```\nprivate static void SetBaseUrl(string url)\n{\n    if (url.IndexOf(\"\
    ?\") > -1)\n    {\n        url = url.Substring(0,url.IndexOf(\"?\"));\n    }\n\
    \    if (!url.EndsWith(\"/\"))\n    {\n        object o = cmsContext.Searches.GetByUrl(url);\n\
    \        if (o != null)\n        {\n            if (o is Channel)\n          \
    \  {\n                url += \"/\";\n            }\n        }\n    }\n    url\
    \ = url.Substring(0,url.LastIndexOf(\"/\")+1);\n    if (url.StartsWith(\"http://\"\
    ))\n    {\n        url = url.Remove(0,7);  // remove \"http://\"\n        url\
    \ = url.Remove(0,(url+\"/\").IndexOf(\"/\"));\n    }\n    m_LocalBaseUrl = url;\n\
    }\n```\n\n# Storing Information about the Attachments to a List\n\nOnce an attachment\
    \ is found, we record its URL and format type to an ArrayList. Before we do so,\
    \ we prepare the URL and run several checks to see if it's valid. We will do all\
    \ that in the AddToUrlList() method.\n\nFirst, bookmarks are removed. Examples\
    \ of bookmarks include \"Back To Top\"-type hyperlinks that typically look like\
    \ this: <a href=\"somepage.htm#Top\">. Since bookmarks are place markers that\
    \ point to locations within the page itself, we can shave them off the URL and\
    \ still be able to download the page. Add the AddToUrlList() method to the class:\n\
    \n```\nprivate static void AddToUrlList(string url)\n{\n    // Remove internal\
    \ bookmarks from the URL\n    string origUrl = url;\n    if (url.IndexOf(\"#\"\
    ) >= 0)\n    {\n        url = url.Substring(0, url.IndexOf(\"#\"));\n    }\n}\n\
    ```\n\nAll relative URLs have to be converted to absolute URLs so that they can\
    \ be downloaded and staged. We use the value stored in the <base> tag, if one\
    \ has been found."
