  md: "```\nMyObject.GetType().GetMethods();\n```\n\nand to get a list of its properties,\
    \ you could call:\n\n```\nMyObject.GetType().GetProperties();\n```\n\nAs you can\
    \ see, reflection is a powerful feature. In this example, instead of writing 40+\
    \ lines of code to list the properties of a ChannelItem object, we will simply\
    \ use reflection to iterate through each property and display its value.\n\nLet's\
    \ display the list of properties in a DataGrid. To start, add a new web form to\
    \ the CMSExplorer project. Name the new web form Properties.aspx. Toggle to HTML\
    \ view and add a couple of headings to the form to describe what it does:\n\n\
    ```\n<form>\n<h1>Properties of <asp:Literal Runat=\"server\" ID=\"litCurrentItem\"\
    /></h1>\n<h2>List of all Properties and their values</h2>\n</form>\n```\n\nIn\
    \ the web form's code-behind file, import the Microsoft.ContentManagement.Publishing\
    \ and System.Reflection namespaces and add the following code in the Page_Load()\
    \ event handler:\n\n```\n. . . code continues . . .\n// MCMS PAPI\nusing Microsoft.ContentManagement.Publishing;\n\
    \n// for reflection\nusing System.Reflection;\n\nnamespace CMSExplorer\n{\n  \
    \  /// <summary>\n    /// Summary description for Properties.\n    /// </summary>\n\
    \    public class Properties : System.Web.UI.Page\n    {\n        HierarchyItem\
    \ hlItem; // the current item\n\n        private void Page_Load(object sender,\
    \ System.EventArgs e)\n        {\n            CmsHttpContext cmsContext = CmsHttpContext.Current;\n\
    \            hlItem = null;\n\n            string cmsObjectGuid = \"\";\n    \
    \        if (Request.QueryString[\"CMSObjectGuid\"]!=null)\n            {\n  \
    \              // template gallery items and resource gallery items\n        \
    \        cmsObjectGuid = Request.QueryString[\"CMSObjectGuid\"];\n           \
    \     hlItem = cmsContext.Searches.GetByGuid(cmsObjectGuid);\n            }\n\
    \            else\n            {\n                // channels and postings\n \
    \               hlItem = cmsContext.ChannelItem;\n            }\n\n          \
    \  // list all properties and their values in the grid\n            if (hlItem!=null)\n\
    \            {\n                litCurrentItem.Text = hlItem.Path;\n         \
    \       ListProperties();\n            }\n        }\n    }\n```"
  merge: -1
  img_proc: true
