  md: "In the Page_Load() event handler, add code to read the Description of the current\
    \ hierarchy item and display it on the screen.\n\n```\nprivate void Page_Load(object\
    \ sender, System.EventArgs e)\n{\n    // Put user code to initialize the page\
    \ here\n    CmsHttpContext cmsContext = CmsHttpContext.Current;\n    hlItem =\
    \ null;\n\n    string cmsObjectGuid = \"\";\n    if (Request.QueryString[\"CMSObjectGuid\"\
    ] != null)\n    {\n        // template gallery items and resource gallery items\n\
    \        cmsObjectGuid = Request.QueryString[\"CMSObjectGuid\"];\n        hlItem\
    \ = cmsContext.Searches.GetByGuid(cmsObjectGuid);\n    }\n    else\n    {\n  \
    \      // channels and postings\n        hlItem = cmsContext.ChannelItem;\n  \
    \  }\n\n    // list all properties and their values in the grid\n    if (hlItem\
    \ != null)\n    {\n        litCurrentItem.Text = hlItem.Path;\n        if (!Page.IsPostBack)\n\
    \        {\n            txtDescription.Text = hlItem.Description;\n        }\n\
    \        ListProperties();\n    }\n}\n```\n\nToggle to Design mode and double-click\
    \ on the btnUpdate button. In the btnUpdate_OnClick() event handler, we will write\
    \ the code that updates the Description property value of the HierarchyItem based\
    \ on the text entered into the textbox.\n\n```\nprivate void btnUpdate_Click(object\
    \ sender, System.EventArgs e)\n{\n    try\n    {\n        // IMPORTANT: You must\
    \ be in update mode for the code to work\n\n        // update the description\n\
    \        hlItem.Description = txtDescription.Text;\n\n        // commit the change\n\
    \        CmsHttpContext.Current.CommitAll();\n\n        // refresh the page to\
    \ ensure that the change shows up in the\n        // datagrid\n        Response.Redirect(HttpContext.Current.Request.Url.ToString());\n\
    \    }\n    catch(Exception ex)\n    {\n        CmsHttpContext.Current.RollbackAll();\n\
    \n        // after a rollback the CMS context needs to be disposed.\n        CmsHttpContext.Current.Dispose();\n\
    \n        lblErrorMessage.Text = ex.Message;\n    }\n}\n```"
