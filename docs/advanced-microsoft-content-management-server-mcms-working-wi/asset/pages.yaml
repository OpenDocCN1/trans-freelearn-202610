- pgno: 120
  md: 'META tags are used by some search engines to implement a taxonomy. When the
    page is indexed, the search engine may add the contents of the Description META
    tag into a field called description. You could then use the search engine''s API
    to search all pages that contain certain keywords only in this description field.
    Combining multiple META tags then allows complex searches. For example you could
    program a search for pages where the description META tag contains the word "plant"
    and the location META tag contains "South America" to retrieve all pages about
    plants in South America.


    Note that not every search engine supports the use of META tags as they can be
    used to influence an index using information that may not be related to the content
    of the page. For example, engines like Google have their own internal mechanisms
    to generate the abstract for each page. Refer to the documentation of the search
    engine you are working with to find the list of META tags it recognizes.


    Most search engines are capable of performing an "incremental crawls", which is
    the process of only indexing pages that have been modified since the last index.
    Performing incremental crawls, as opposed to full crawls, optimizes the indexing
    process. A problem with MCMS driven websites is that the page content is dynamic
    and content can potentially be different with every request to the site. To the
    search indexer, these websites either will not return last modified date information
    or will always appear to have been modified. As a result, MCMS sites can''t be
    crawled incrementally. In this chapter we will develop a solution that outputs
    the last modified date into the HTTP response headers thus giving the search engines
    the ability to perform incremental crawls on MCMS sites.


    In addition search accuracy can be affected by navigation controls on the page
    and common header and footer elements. This can lead to excess noise in search
    results (if, say, the "Press Release" page is listed on a shared menu control,
    a search for it will yield all pages with this menu). Accuracy can be improved
    by hiding the navigation elements when the site is being indexed. We will demonstrate
    how to achieve this.


    Throughout this chapter, we will also explore several tips and tricks for getting
    the best and most accurate search engine results including the title, keywords,
    and description.


    # Influencing Search Engines with the ROBOTS META Tag


    Typically, the bulk of the index contains content from pages generated by channel
    rendering scripts and postings. They are after all, the parts of the site that
    are visible to the end users. To tell search engines which pages to index and
    which pages to ignore and whether to follow further links from the current page
    you can add a special META tag to your page named ROBOTS. Most (but not all) search
    engines honor this META tag and evaluate its content property to see if the page
    should be added to the index and if links from this page should be followed.


    To allow MCMS authors to benefit from this feature, channels and postings have
    two additional properties:


    +   - IsRobotIndexable

    +   - IsRobotFollowable


    These two properties can be used to generate the ROBOTS META tag. As already mentioned,
    be aware that some search engines choose to ignore the ROBOTS META tag.'
  merge: -1
  img_proc: true
- pgno: 121
  md: "The table below summarizes the behavior of the different property settings:\n\
    \n| IsRobotFollowable | IsRobotIndexable | META tag to render | Remarks |\n|---|---|---|---|\n\
    | False | False | <meta name=\"ROBOTS\" content=\"NOFOLLOW, NOINDEX\"> | Search\
    \ engines that recognize the robot META tag will not index the page nor follow\
    \ its hyperlinks. |\n| False | True | <meta name=\"ROBOTS\" content=\"NOFOLLOW,\
    \ INDEX\"> | Search engines that recognize the robot META tag will index the page\
    \ but not follow its hyperlinks. |\n| True | False | <meta name=\"ROBOTS\" content=\"\
    FOLLOW, NOINDEX\"> | Search engines that recognize the robot META tag will not\
    \ index the page but will follow its hyperlinks. |\n| True | True | <meta name=\"\
    ROBOTS\" content=\"FOLLOW, INDEX\"> | Search engines that recognize the robot\
    \ META tag will index the page and follow its hyperlinks. |\n\nFor more information\
    \ on the ROBOTS META tag, check out this resource:\n\nhttp://www.robotstxt.org/wc/exclusion.html#meta\n\
    \n# The RobotMetaTag Control and Channel Rendering Scripts\n\nMCMS ships with\
    \ a control named RobotMetaTag, which is automatically added to all template files\
    \ created from the Visual Studio .NET \"MCMS Template File\" template. The RobotMetaTag\
    \ control is used to generate the ROBOTS META tag based on the IsRobotFollowable\
    \ and IsRobotIndexable properties of the page.\n\nUnfortunately this control does\
    \ not work on channel rendering scripts. If you add the control to a channel rendering\
    \ script, despite setting the IsRobotFollowable and IsRobotIndexable properties\
    \ of the channel, the ROBOTS META tag does not get generated. To get around this\
    \ problem let's implement an enhanced version of this control that works with\
    \ both channel rendering scripts and templates.\n\n> In the WoodgroveNet sample\
    \ site that comes with MCMS, the RobotMetaTag control is wrapped in a user control\
    \ called HeadTags.ascx.\n\nFirst, open the Tropical Green solution. Add a new\
    \ class file to the TropicalGreenControlLib project with the name EnhancedRobotMetaTag.cs.\n\
    \nThe control requires the use of methods from the namespaces highlighted below,\
    \ so add them to the class file.\n\n```\nusing System;\nusing System.ComponentModel;\n\
    using System.Web.UI;\nusing Microsoft.ContentManagement.Common;\nusing Microsoft.ContentManagement.Publishing;\n\
    using Microsoft.ContentManagement.WebControls;\nnamespace TropicalGreenControlLib\n\
    {\n    ... code continues ...\n}\n```"
