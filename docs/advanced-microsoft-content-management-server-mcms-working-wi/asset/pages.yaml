    \ pool your MCMS site runs under, open Internet Information Services. Expand the\
    \ nodes for local computer | Application Pools. Look for the application pool\
    \ that your MCMS site is configured to use and view its properties. The identity\
    \ is listed under the Identity tab.\n\n+   6. After selecting the account, on\
    \ the Add User page, ensure that Search Only under the Step 2: Choose Site Groups\
    \ section is checked and click OK.\n+   \n+   7. On the last page, where SharePoint\
    \ asks you to confirm the details of the account you're adding, make sure the\
    \ Send the following e-mail to let these users know they have been added option\
    \ is unchecked, and click Finish.\n\nOur MCMS site now has the permissions needed\
    \ to log in to our portal and execute a search.\n\n# Adding a Search Page to the\
    \ MCMS Site\n\nWe have two options available to implement a search capability\
    \ for our Tropical Green site:\n\n+   - Leverage the ASP.NET Server Controls included\
    \ in the MCMS Connector for SharePoint Technologies that allow search queries\
    \ to be executed.\n+   - Create our own solution.\n\nThe MCMS Connector includes\
    \ the following three controls that assist you in implementing search functionality\
    \ for an MCMS site by leveraging SharePoint search scopes:\n\n+   - **SearchInputControl:**\
    \ Used to create the search form input for a search to be submitted."
