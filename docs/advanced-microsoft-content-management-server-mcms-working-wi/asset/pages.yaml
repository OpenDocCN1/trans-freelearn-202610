    # The DateTimePickerPlaceholderControl Class


    Let''s begin building the date-time picker placeholder control by adding a class
    file named DateTimePickerPlaceholderControl.cs to the UsefulPlaceholderControls
    project.


    The control requires the use of methods from the namespaces highlighted below,
    so add them to the class file.


    ```

    using System;

    using System.Web.UI.HtmlControls;

    using System.Web.UI.WebControls;

    using Microsoft.ContentManagement.Publishing;

    using Microsoft.ContentManagement.Publishing.Extensions.Placeholders;

    using Microsoft.ContentManagement.WebControls.Design;

    using Microsoft.ContentManagement.WebControls;

    ```'
