- pgno: 423
  md: "```\nHttpWebRequest request = (HttpWebRequest)WebRequest.Create(RssUrl);\n\n\
    // uncomment if you have a proxy\n// WebProxy proxy = null;\n// proxy = new WebProxy(\"\
    http://proxyserver:port\");\n// request.Proxy = proxy;\n\n// Get the Response\
    \ from the web request\nHttpWebResponse response = (HttpWebResponse)request.GetResponse();\n\
    ```\n\nThe response is then loaded into an XmlTextReader. We read the contents\
    \ of the XmlTextReader and generate the HTML for the different articles in the\
    \ feed, such as the author's name for instance:\n\n```\n// load the stream into\
    \ an XmlTextReader\nXmlTextReader rsReader = new XmlTextReader(response.GetResponseStream());\n\
    \nint actItem = 0;\n\n// Loop through the reader\nwhile (!rsReader.EOF)\n{\n```\n\
    \nA feed can serve many articles. We need to add a check to ensure that only the\
    \ configured number of articles is displayed:\n\n```\n// How many items are we\
    \ going to display?\nif (actItem >= this.ItemsToDisplay)\n    break;\n```\n\n\
    Now let's iterate through all XML tags of the current feed item and collect all\
    \ the data for the current item. As different feeds use different standards (like\
    \ RSS 1.0, 2.0, or Atom), the content we are looking for may be encoded in different\
    \ tags:\n\n```\n// What is the current element of the RSS Feed\nswitch (rsReader.Name.ToLower())\n\
    {\n```\n\nThe feed or channel element encloses the information about the current\
    \ RSS feed:\n\n```\ncase \"feed\":\ncase \"channel\":\n{\n    CurrentState = ennState.Channel;\n\
    \    rsReader.Read();\n    break;\n}\ncase \"title\":\n{\n    if (rsReader.NodeType\
    \ == XmlNodeType.Element)\n        Title = HttpUtility.HtmlDecode(rsReader.ReadInnerXml());\n\
    \    else\n        rsReader.Read();\n    break;\n}\ncase \"link\":\n{\n    if\
    \ (rsReader.NodeType == XmlNodeType.Element)\n    {\n        string Link1 = rsReader.GetAttribute(\"\
    href\");\n        string Link2 = rsReader.ReadInnerXml();\n        if (Link1 !=\
    \ null)\n            Link = Link1;\n        else\n            Link = Link2;\n\
    \    }\n```"
