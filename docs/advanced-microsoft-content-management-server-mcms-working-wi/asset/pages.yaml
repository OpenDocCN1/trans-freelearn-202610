  md: "# The MultipleAttachmentPlaceholderControl Class\n\nTo begin, we add a class\
    \ named MultipleAttachmentPlaceholderControl.cs to the UsefulCustomPlaceholders\
    \ project.\n\nThe class file uses the methods from the namespaces highlighted\
    \ below. Add them above the namespace declaration:\n\n```\nusing System;\n\nusing\
    \ System.Xml;\nusing System.Web;\nusing System.Text;\nusing System.Web.UI;\nusing\
    \ System.Web.UI.WebControls;\nusing Microsoft.ContentManagement.Publishing;\n\
    using Microsoft.ContentManagement.WebControls;\nusing Microsoft.ContentManagement.WebControls.Design;\n\
    using Microsoft.ContentManagement.Publishing.Extensions.Placeholders;\n\nnamespace\
    \ UsefulCustomPlaceholders\n{\n    ... code continues ...\n}\n```\n\nA good way\
    \ to manage lists like the one we are creating here is to store them as XML. XML\
    \ gives us the flexibility to present the attachments in a wide range of ways\
    \ later on. The control will therefore support XmlPlaceholderDefinition and be\
    \ built by inheriting from BasePlaceholder:\n\n```\n[SupportedPlaceholderDefinitionType(typeof(XmlPlaceholderDefinition))]\n\
    public class MultipleAttachmentPlaceholderControl : BasePlaceholderControl\n{\n\
    \    ... code continues ...\n}\n```\n\nThe control will provide three properties\
    \ for developers:\n\n+   - **MaxAttachments**. Specifies the maximum number of\
    \ attachments supported by the control. The initial value will be set to 10. Developers\
    \ can change this value at design time by adjusting the value in the control's\
    \ Properties dialog.\n+   - **DisplayAsIcon**. Specifies if the attachments are\
    \ to be displayed as icons or text. Similar to the UseGeneratedIcon property in\
    \ the HtmlPlaceholderDefinition class.\n+   - **ResourceGalleryOnly**. Specifies\
    \ if files from the author's computer can be uploaded as an attachment or if authors\
    \ must choose from resources within resource galleries.\n\nAdd the following three\
    \ properties below the class constructor:\n\n```\nprivate static int m_maxAttachments\
    \ = 10;\npublic int MaxAttachments\n{\n    get\n    {\n        return m_maxAttachments;\n\
    \    }\n\n    set\n    {\n        m_maxAttachments = value;\n    }\n}\n```"
