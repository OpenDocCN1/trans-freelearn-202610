  md: '# Creating a New MCMS Web Entry Point


    We now have a SharePoint portal created in our virtual server. Now we need to
    configure MCMS to use our virtual server as an MCMS Web Entry Point.


    +   1. Start the Server Configuration Application by pointing to Start | All Programs
    | Microsoft Content Management Server | Server Configuration Application.

    +   2. Click the Web tab to view all virtual servers and manage their MCMS configuration.


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_516_0.png)


    +   3. You can see that our new virtual server, portal.tropicalgreen.net, is not
    configured for MCMS. Click the Configure button to edit the virtual servers listed.

    +   4. Set the dropdown for our virtual server in the MCMS ? column to Yes – Read
    Write. Click OK through the dialog and the configure page.


    We now have a SharePoint portal and have configured our new virtual server to
    be an MCMS Web Entry Point. However MCMS will not currently receive any requests
    because SharePoint will consume all URLs destined for our virtual server.


    # Configuring SharePoint to Allow MCMS Requests


    As outlined above, the MCMS requests will not be processed correctly at this point
    because the SharePoint ISAPI filter consumes all requests coming into our virtual
    server. If a request can''t be processed by the SharePoint ISAPI filter, it will
    simply return an HTTP 404 – File Not Found response to the requestor.


    As an example of this, try navigating to a path that does not exist, such as http://portal.tropicalgreen.net/fakepath.
    As this response is sent directly by the'
  merge: -1
