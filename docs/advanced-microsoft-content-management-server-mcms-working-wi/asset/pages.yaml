- pgno: 145
  md: 'One common error, The address could not be found, is usually caused by links
    to empty channels that are not configured to use channel rendering scripts. Since
    we''d expect guests to receive this error when browsing the site, it''s not surprising
    the SharePoint gatherer ran into the same problem. This is not a problem with
    the SharePoint index, but rather with the structure or of our site: channels that
    could be empty should have channel rendering scripts or be hidden from the navigation.


    +   6. If there are no problems, we can test our index. Click the Home link in
    the portal navigation to get to the homepage. In the upper-right corner, select
    TropicalGreen.net (SearchSetup.exe) in the dropdown (the whole name may not appear
    due to design constraints on the width of the dropdown), enter ficus in the search
    box, and click the green arrow to execute the search. The search results should
    find the posting in the plant catalog.


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_145_0.png)


    Your search results may not match what is indicated in the image above as your
    postings may have been modified recently.


    We now have a SharePoint search scope created and indexing our Tropical Green
    site. While this search scope can be used within the portal to search our site,
    we will use it via the SPS Query Service Web Service from our MCMS site to provide
    search functionality to our users.


    # Creating a Content Source Manually


    Another option is to manually create the content source in SharePoint rather than
    allowing the SearchSetup.exe utility to create it for us. We''ll walk you though
    these steps so you will have an understanding of what''s involved in creating
    a content source and source group in a SharePoint portal.'
