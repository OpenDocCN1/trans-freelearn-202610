    # Tips for Search Engine Optimization


    Most search engines use proprietary algorithms for the crawling, indexing, and
    ranking of web pages. There is no way to guarantee a high ranking for your website
    but here are a few general tips that should help you.


    # Design and Navigation Considerations


    There are several issues that may cause your website to not be indexed correctly
    by search engines:


    # Frames


    If your website uses frames, the content within the frames may not be indexed.
    To overcome this issue, the content that needs to be indexed should be placed
    within the <NOFRAMES> tag.


    # Flash Content


    If your homepage is primarily Flash, the content and hyperlinks may not be correctly
    indexed. It is recommended to reproduce the content and hyperlinks that are in
    Flash in HTML and either detect when the request is coming from a crawler or include
    it on all pages but hidden.


    # Image Maps and JavaScript Navigation


    Image maps and navigation controls populated by JavaScript are great options for
    developers and users but search engines may not have the ability to parse links
    that are generated at run time. If your website is generating hyperlinks using
    image maps or JavaScript, it is recommended to reproduce the links in standard
    HTML.


    # Adding Details to the Title Tag


    The <title> tag is one of the most important tags for search engine optimization.
    You should make your title describe exactly what is on the page as it will be
    displayed as the window title on your web browser and also as the heading for
    a search result. It should be unique per page and each keyword should be visible
    on the page as content. In addition most search engines rate words in the title
    tags higher than if they show up in the body, so that when the word being searched
    for is in the title tag, that page will show up earlier in the list of search
    results.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Using META Tags


    META tags allow search engines to look for details about a page in a standard
    location. The META tags must be located within the <head> element.


    # Choosing your Keywords and Density


    It is recommended to add the <meta name="keywords" content="Your Keywords"> tag
    to your pages as some search engines use this element as they build their index.
    The content element contains a list of comma-separated keywords. You should use
    keywords that relate to the content that appears on the current page and not the
    entire website. An example of the keywords META tag for the Tropical Green website
    would be:


    ```

    <meta name="keywords" content="Gardening information, Gardening Columns, plants
    for sale Seattle, Plant reseller Seattle, Plant supplier Seattle, Garden Designers
    Seattle, Online Plant Database, Garden design">

    ```


    If you chose keywords that are too generic, such as Plant, Gardening, or Garden
    Design, they would have little value as they are not specific enough. By adding
    the location of Tropical Green (Seattle) to each keyword, people that are searching
    for a plant-related service in their local area (e.g. Seattle) are more likely
    to find Tropical Green’s website.


    # Description


    The contents of the description META tag should accurately describe the page contents
    for example: the description of the "A Walk in Jenny''s Garden" column page would
    be:


    ```

    <meta name="description" content="We take a look at Jenny''s Garden and her unique
    approach to garden design by combining the use of tall trees with small shrubs.">

    ```


    The keywords META tag should not exceed approximately 1000 characters or search
    engines may ignore or cut it off. For the best performance, you should try to
    keep the description META tag as short as possible (approximately 250 characters).


    # Summary


    Over the course of this chapter, we have looked at several ways to configure MCMS
    templates to get the best out of search engines. To allow MCMS postings and channel
    rendering scripts to be indexed and followed by search engines, the IsRobotFollowable
    and IsRobotIndexable properties should be set, and channel rendering scripts need
    to be modified to output these properties. We also explored how to enable incremental
    crawls for an MCMS website and how to reduce the noise in search results by rendering
    only relevant content and hiding navigational controls. Finally we looked at a
    few tips for search engine optimization by adding detail to META tags and also
    being cognizant of design issues that may cause the website to not be indexed
    correctly.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Searching MCMS with SharePoint


    For as long as content-centric websites have been around, the need for searching
    the content has been there. Many of the most successful dot-com businesses have
    been search sites such as Yahoo! and Google. Every few months a new search site
    opens its doors, many of which perform aggregate searches of multiple sites simultaneously.
    At the other end of the spectrum, many site owners require a search capability
    that returns only results for their specific site.


    Microsoft Content Management Server (MCMS), while a very robust content management
    solution, does not offer any search capabilities out of the box. However, just
    because you have an MCMS website doesn''t mean you are stuck without search capabilities.


    # MCMS Search Options


    There are quite a few ways to implement searching on an MCMS website, each with
    varying costs, implementation complexity, and limitations. As usual, each option
    has its advantages and disadvantages. Google (http://www.google.com) provides
    a Web Service API for you to submit queries against at no cost, but you are limited
    to 1,000 searches per day, and there are some licensing requirements regarding
    logo placement. Coveo (http://www.coveo.com) provides a free, no-expiration license
    for its Enterprise Search product, but it''s limited to searching 5,000 documents
    (searching more than 5,000 requires a license to be purchased from Coveo). Mondosoft''s
    (http://www.mondosoft.com) MondoSearch seamlessly integrates into MCMS and offers
    up a robust feature set, but it''s not free.


    Microsoft''s enterprise portal solution, SharePoint Portal Server 2003 (SPS),
    contains a powerful and customizable search engine. The indexes SPS creates are
    accessible for searches by submitting a Microsoft SQL Full-Text query via a Web
    Service. If your organization has already implemented, or plans to deploy SPS,
    then you could leverage it as your MCMS search engine. Do be aware, however, that
    if your site is publicly accessible, this solution may not be as compelling, as
    a SharePoint External Connector license would be required. For this reason, the
    SharePoint search solution we look at is typically only a viable option for intranet-based
    MCMS sites.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'In this chapter, we will leverage SPS''s search to provide a robust search
    capability for our Tropical Green MCMS site. On the way, we''ll configure SharePoint
    to index our Tropical Green site. We will also try out some free components you
    can use in your MCMS site to execute search queries against the SharePoint index.


    # Microsoft SharePoint Portal Server Search


    To fully leverage SharePoint Portal Server Search to your advantage, you need
    to understand how it works and how to configure it. Before we explain how it works,
    there are a few key components that need to be understood:


    +   - A **content source** contains the information that will be indexed. Content
    sources can be external websites, file shares, Windows SharePoint Services sites,
    Microsoft Exchange public folders, or other systems that provide a protocol handler
    for SharePoint Search such as Lotus Notes.

    +   - **Index files** contain crawled content from one or more content sources.
    Aggregating and cataloging content from disparate content sources enables future
    search queries to be much more efficient. Index files can also be copied or propagated
    to SharePoint Web servers for more efficient searching. Two indexes are created
    by default when you create a new portal: `Portal_Content` and `Non_Portal_Content`.
    As expected, the former contains all content stored in the portal while the latter
    contains content outside of the portal.

    +   - **Search scopes** are used to provide a logical grouping of content sources
    for end users to search. For example, a company may have multiple internal file
    shares and websites. An employee looking for a specific document doesn''t care
    if it''s in site A or file share B, they just know it''s out there. An administrator
    can create multiple content sources and group them together in a single search
    scope that the user can search against. In addition, search scopes can be configured
    to only include specific portions of a website, providing even more granular control
    over what content is indexed and searchable by your users.

    +   - The SharePoint **gatherer** is responsible for crawling all content sources,
    extracting content, removing noise words (such as ''and'', ''a'', ''the'', ''or''
    to name only a few... noise word files are customizable so you can add your own
    noise words), and creating index files that will be used when search queries are
    executed.


    The gatherer is part of the MSSearch service that performs the content crawling
    and creates the index files. This service runs on schedules that you can configure
    through the SharePoint Central Administration tool. The MSSearch service activates
    the gatherer, based on the specified scheduled timetable, which generates a master
    index for search queries.


    An end user uses a search scope to select a collection of content sources to query.
    SharePoint looks at the catalog containing the content sources and determines
    the best candidates that match the search query.'
  merge: -1
  img_proc: true
