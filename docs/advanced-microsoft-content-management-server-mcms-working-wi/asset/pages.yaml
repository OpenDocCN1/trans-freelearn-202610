- pgno: 250
  md: "# Useful Placeholder Controls\n\nFinally, we add a Label control to the authoring\
    \ container. The Label will be used to display error messages that may occur along\
    \ the way. Like the TextBox, we will make it a class-wide variable as we will\
    \ be using it within other methods.\n\n```\nprivate TextBox txtAuthoring;\nprivate\
    \ Label lblMessage;\n\nprotected override void CreateAuthoringChildControls\n\
    \        (BaseModeContainer authoringContainer)\n{\n    - - - code continues -\
    \ - -\n\n    // Add a label for displaying messages\n    lblMessage = new Label();\n\
    \    authoringContainer.Controls.Add(lblMessage);\n}\n```\n\n# Retrieving Saved\
    \ Content\n\nWhen the posting is opened for editing, the textbox of the date time\
    \ picker control shows the previously saved date and time value. For new postings,\
    \ there won't be a previous selection; we will just use the current date and time.\
    \ Override LoadPlaceholderContentForAuthoring():\n\n```\nprotected override void\
    \ LoadPlaceholderContentForAuthoring\n        (PlaceholderControlEventArgs e)\n\
    {\n    EnsureChildControls();\n    try\n    {\n        if (WebAuthorContext.Current.Mode\
    \ == WebAuthorContextMode.AuthoringNew)\n        {\n            // The default\
    \ value of the control is the current date and time\n            txtAuthoring.Text\
    \ = DateTime.Now.ToString(\"dd MMM yyyy HH:mm\");\n        }\n        else\n \
    \       {\n            txtAuthoring.Text = ((HtmlPlaceholder)this.BoundPlaceholder).Text;\n\
    \        }\n    }\n    catch(Exception ex)\n    {\n        lblMessage.Text = \"\
    Failed to load placeholder content: \" + ex.Message;\n    }\n}\n```\n\n# Saving\
    \ the Date and Time\n\nWhen the posting is saved, we read the value stored in\
    \ the TextBox and write it to the underlying HtmlPlaceholder. Any exceptions are\
    \ trapped using a try-catch block and the detailed error message appears on screen.\
    \ Add the overridden SavePlaceholderContent() method to the code:\n\n```\nprotected\
    \ override void SavePlaceholderContent(PlaceholderControlSaveEventArgs e)\n{\n\
    \    EnsureChildControls();\n    try\n    {\n        ((HtmlPlaceholder)this.BoundPlaceholder).Html\
    \ = txtAuthoring.Text;\n    }\n    catch(Exception ex)\n    {\n```"
  merge: -1
  img_proc: true
- pgno: 251
  md: "# Validating the Date and Time\n\nTo ensure that only valid dates are saved,\
    \ we will override the OnSavingContent() method. We check to see if the value\
    \ to be saved is a valid date by attempting to convert the string stored in the\
    \ TextBox to a DateTime object. If it is a valid date, we won’t get an exception.\
    \ Otherwise, we catch the exception and the save operation can be canceled.\n\n\
    ```\nprotected override void OnSavingContent(PlaceholderControlSavingEventArgs\
    \ e)\n{\n    try\n    {\n        DateTime.Parse(txtAuthoring.Text.Trim());\n \
    \       base.OnSavingContent(e);\n\n        // Clear any messages on the screen\n\
    \        lblMessage.Text = \"\";\n    }\n    catch(Exception ex)\n    {\n    \
    \    e.Cancel = true;\n        lblMessage.Text = ex.Message;\n    }\n}\n```\n\n\
    # Presenting the Selected Date and Time\n\nIn presentation mode, the selected\
    \ date and time are displayed on the screen in a Label control. Let’s override\
    \ the CreatePresentationChildControls() method and add a Label control to the\
    \ presentation container.\n\n```\nprivate Label lblPresentation;\n\nprotected\
    \ override void CreatePresentationChildControls(\n        BaseModeContainer presentationContainer)\n\
    {\n    lblPresentation = new Label();\n    presentationContainer.Controls.Add(lblPresentation);\n\
    }\n```\n\nThe previously saved date and time value in the underlying HtmlPlaceholder\
    \ is retrieved from the content repository and displayed in the Label control\
    \ loaded earlier. Add the overridden LoadPlaceholderContentForPresentation() method\
    \ as shown:\n\n```\nprotected override void LoadPlaceholderContentForPresentation\n\
    \        (PlaceholderControlEventArgs e)\n{\n    EnsureChildControls();\n    try\n\
    \    {\n        lblPresentation.Text = ((HtmlPlaceholder)this.BoundPlaceholder).Text;\n\
    \    }\n    catch(Exception ex)\n    {\n        lblPresentation.Text = ex.Message;\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 252
  md: 'The date-time picker placeholder control is complete. Next, let’s build the
    dialog for selecting the date and time.


    # The Date and Time Picker Dialog


    The Date and Time picker dialog contains:


    +   - An ASP.NET Calendar control for choosing the date

