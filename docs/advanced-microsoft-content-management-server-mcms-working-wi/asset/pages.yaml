- pgno: 114
  md: "# Managing Templates, Template Galleries, and Resources\n\nWe first retrieve\
    \ the name of the file to be uploaded and check to see if it is valid. After saving\
    \ the uploaded file to the Temp folder in the MCMS Server directory, we call the\
    \ Resource.SetContentFromFile() method, which accepts the path of a valid file\
    \ in the file system. Just as when creating resources, this file must reside on\
    \ the MCMS server. After the contents of the resource are updated, we commit the\
    \ changes to the content repository.\n\nSave and build the solution. Let's try\
    \ out the Replace Resource dialog:\n\n+   1. Open CMS Explorer.\n+   2. Click\
    \ Resources and navigate to the PlantCatalog resource gallery.\n+   3. Click the\
    \ Edit link next to the CoconutTree.JPG resource.\n+   4. Click Replace.\n+  \
    \ 5. In the Replace Resource dialog, browse to an existing JPG file.\n+   6. Click\
    \ Replace Resource.\n+   7. Click Close to close the dialog.\n\nThe content of\
    \ the resource is replaced with the newly uploaded file. Notice that you are only\
    \ allowed to replace the resource with a file of the same MIME Type. For example,\
    \ the CoconutTree.JPG resource could only be replaced with other *.JPG files.\
    \ Should you have chosen, say a *.XLS file, you would have gotten the following\
    \ error message:\n\nMIME Content-Types do not match. application/vnd.ms-excel\
    \ does not match image/jpg.\n\n# Deleting Objects\n\nThe PAPI has a Delete() method\
    \ for each channel, posting, template, template gallery, resource gallery, and\
    \ resource object. We have created quite a few test objects in the repository,\
    \ so let's write a Delete dialog so that CMS Explorer can remove them:\n\n+  \
    \ 1. Add a new web form to the CMSExplorer project and name it Delete.aspx.\n\
    +   2. In Design view, drag and drop styles.css from Solution Explorer onto the\
    \ web form.\n+   3. Toggle to HTML view and add a table with four rows:\n\n```\n\
    <table>\n<tr>\n  <td><h1>Confirm Delete</h1></td>\n</tr>\n<tr>\n  <td>\n    Click\
    \ YES to permanently delete\n    (Add literal to show the path of the item to\
    \ be deleted here)\n  </td>\n</tr>\n<tr>\n  <td align=\"right\">\n    (Add the\
    \ Yes button here)\n    <INPUT type=\"button\" value=\"No\" onclick=\"javascript:window.close();\"\
    \ style=\"width:120px\">\n  </td>\n</tr>\n<tr>\n  <td>(Add label for displaying\
    \ error messages here)</td>\n</tr>\n</table>\n```"
