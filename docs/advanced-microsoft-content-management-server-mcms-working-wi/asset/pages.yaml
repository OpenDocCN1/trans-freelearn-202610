  md: "5. In the Page_Load() event handler, we get an instance of the template to\
    \ be moved. In previous examples, we did a check to see if the user has rights\
    \ to work with an item only after the user has clicked on the button. Let's try\
    \ a different approach this time. Instead of returning an error message to users\
    \ who do not have the necessary permissions, we will enable or disable the button\
    \ accordingly.\nWe check to see if the user has rights to move the template by\
    \ checking the Template.CanMove property value. If Template.CanMove returns true,\
    \ it means that the user is either an administrator or assigned to a rights group\
    \ that belongs to a channel manager or template designer role of the current template\
    \ gallery. If the user has the rights to move the template, we keep the btnMove\
    \ button enabled; otherwise, it's disabled.\n\n```\nprivate CmsHttpContext cmsContext;\n\
    private Template originalTemplate;\n\nprivate void Page_Load(object sender, System.EventArgs\
    \ e)\n{\n    cmsContext = CmsHttpContext.Current;\n\n    // Clear all error messages,\
    \ if any.\n    lblErrorMessage.Text = String.Empty;\n\n    // Get an instance\
    \ of the original template\n    string cmsObjectGuid = String.Empty;\n    if (Request.QueryString[\"\
    CMSObjectGuid\"] != null)\n    {\n        cmsObjectGuid = Request.QueryString[\"\
    CMSObjectGuid\"];\n        originalTemplate = cmsContext.Searches.GetByGuid(cmsObjectGuid)\n\
    \            as Template;\n\n        if (originalTemplate != null)\n        {\n\
    \            // Display the template's path\n            litOriginalTemplate.Text\
    \ = originalTemplate.Path;\n\n            if (originalTemplate.CanMove)\n    \
    \        {\n                btnMove.Enabled = true;\n            }\n         \
    \   else\n            {\n                // we can't move this template.\n   \
    \             lblErrorMessage.Text = \"You do not have rights to \" +\n      \
    \              \"move this template.\";\n                btnMove.Enabled = false;\n\
    \            }\n        }\n        else\n        {\n            // Uh-oh we can't\
    \ get an instance of the template.\n            lblErrorMessage.Text = \"Original\
    \ Template not found!\";\n        }\n    }\n}\n```\n\n6. Next, we get an instance\
    \ of the destination template gallery. We perform the move operation only if the\
    \ user has rights to create templates in the destination template gallery. Once\
    \ we have ascertained that the destination template gallery is valid, we will\
    \ call the Template.MoveTo() method, passing the instance of the destination template\
    \ gallery as an input parameter. After moving a template, its state is Saved."
  merge: -1
  img_proc: true
