  md: "# The SavePosting() Web Method\n\nLet's create another Web method, SavePosting(),\
    \ which will accept a LightweightPosting object as a parameter and save its contents\
    \ to MCMS. Add the following code to the authoring.asmx.cs file and rebuild the\
    \ solution:\n\n```\n/// <summary>\n/// Save a lightweight posting object to MCMS\n\
    /// </summary>\n/// <param name=\"_Posting\">LightweightPosting object to save</param>\n\
    [WebMethod]\npublic void SavePosting(LightweightPosting _Posting)\n{\n    // Save\
    \ the posting\n    _Posting.Save();\n}\n```\n\nThe SavePosting() Web method cannot\
    \ be tested from the browser as we did for GetPosting() as it requires a complex\
    \ datatype (LightweightPosting) as a parameter. We will test SavePosting() via\
    \ the InfoPath form we will create shortly.\n\n# Preparing the InfoPath Environment\n\
    \nAt this point you need to have Microsoft InfoPath 2003 and Office 2003 Service\
    \ Pack 1 (SP1) installed on your computer. If your Office 2003 installation does\
    \ not have SP1 currently applied, you will be able to download it from:\n\nhttp://www.microsoft.com/downloads/details.aspx?FamilyID=9c51d3a6-7cb1-4f61-837e-5f938254fc47\n\
    \nYou should also download the InfoPath 2003 SDK for further reference from:\n\
    \nhttp://www.microsoft.com/downloads/details.aspx?FamilyId=351F0616-93AA-4FE8-9238-D702F1BFBAB4\n\
    \nTo verify Service Pack 1 has been installed, start InfoPath and click Help |\
    \ About Microsoft Office InfoPath. The name of the latest service pack is printed\
    \ next to the product's version number.\n\n# Creating the InfoPath Document\n\n\
    InfoPath documents require an InfoPath template (.xsn), designed in InfoPath,\
    \ before they can create an InfoPath form template and connect it to a Web service\
    \ for data retrieval and submission. Follow these steps to create an InfoPath\
    \ template that will connect to the Web service we just created:\n\n+   1. Launch\
    \ Microsoft InfoPath 2003.\n+   2. On the left-hand side of the Fill Out a Form\
    \ window, select Design a Form. If the Fill Out a Form window is not open, select\
    \ File | Design a Form.\n+   3. From the Task Pane on the right-hand side, select\
    \ New from Data Connection.\n+   4. In the Data Connection Wizard, select Web\
    \ Service and click Next.\n+   5. Select Receive and submit data and click Next."
