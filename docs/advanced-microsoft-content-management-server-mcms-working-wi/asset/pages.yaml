  img_proc: true
- pgno: 150
  md: '+   - **SearchResultControl:** Takes search criteria entered in the SearchInputControl,
    executes the search against the SPS search Web Service, and displays the results
    in list form.

    +   - **SearchMetaTagGenerator:** Creates HTML META tags based on the PropertyType
    setting. META tags generated can include standard page properties as well as custom
    properties.


    You can use these three controls on the same page or separate pages. This is very
    convenient as you may wish to include a small search keyword input box on all
    pages in your site that submits the search to a separate results page, but you
    might want to provide the search input on the search results page as well.


    Once we have created a working search page using the MCMS Connector controls,
    we''ll create a custom solution that won''t include anything provided in the MCMS
    Connector. Our solution will include an advanced search, specific to our site,
    and a customized search result listing.


    Both options have distinct advantages and disadvantages. Which one you''ll implement
    on your MCMS site will depend entirely upon your requirements, customization needs,
    and available development time. The following table outlines a few of the more
    prominent advantages and disadvantages of using the MCMS Connector controls as
    well as rolling your own solution:


    # Implementing search leveraging MCMS Connector controls:


    | Advantages | Disadvantages |

    |---|---|

    | Fast install and integration into pages & templates | No customization of search
    input controls |

    | Will work out of the box with minimal configuration | No customization of search
    result list |


    # Implementing search with a custom solution:


    | Advantages | Disadvantages |

    |---|---|

    | Complete control over layout of search input form | Requires extra development
    time and testing |

    | Complete control over search result list | |

    | Create special advanced search based on specific site requirements | |


    # Searching with the MCMS SharePoint Connector


    The first thing we''ll do for this is to create a new search page in our Tropical
    Green project. This page will not be a new MCMS template, but a regular ASP.NET
    page. You could make this a template, but there''s no real advantage in doing
    so because there will only be a single search page on our site with no extra content.


    +   1. In Visual Studio .NET, right-click on the Tropical Green project and select
    Add Web Form.

    +   2. Name the new ASPX page Search.aspx and click Open.

    +   3. If the page doesn''t load in Design mode, click Design in the lower left
    corner.'
  merge: -1
  img_proc: true
