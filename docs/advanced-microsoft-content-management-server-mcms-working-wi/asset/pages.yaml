- pgno: 72
  md: "# Managing Channels and Postings with the PAPI\n\nConnected postings are created\
    \ in a very similar way to creating a new posting. To create a connected posting,\
    \ call the `Channel.CreateConnectedPosting()` method. The method takes two parameters:\n\
    \n+   - The template the posting should be based on (the template needs to be\
    \ identical to the template of the original posting or it needs to be a connected\
    \ template of the original template).\n+   - The original posting.\n\n7. Switch\
    \ back to Design view. Double-click on the btnCreate button to get to the btnCreate_Click()\
    \ event handler. Add the code as shown:\n\n```\nprivate void btnCreate_Click(object\
    \ sender, System.EventArgs e)\n{\n    CmsHttpContext cmsContext = CmsHttpContext.Current;\n\
    \    Posting originalPosting;\n    originalPosting = cmsContext.Searches.GetByGuid(\n\
    \        Request.QueryString[\"CMSObjectGuid\"]) as Posting;\n\n    if ( originalPosting\
    \ != null )\n    {\n        try\n        {\n            // get the destination\
    \ channel\n            Channel destination;\n            destination = cmsContext.Searches.GetByPath(txtDestination.Text)\n\
    \                as Channel;\n\n            if ( destination != null )\n     \
    \       {\n                // check if the current user has permissions to\n \
    \               // create postings in the target channel\n                if (!destination.CanCreatePostings)\n\
    \                {\n                    throw new Exception(\"Current user does\
    \ not have permissions \"\n                        + \"to create postings in channel:\
    \ \"\n                        + destination.Path);\n                }\n\n    \
    \            // get the connected template\n                Template connectedT;\n\
    \                connectedT = cmsContext.Searches.GetByPath(txtTemplate.Text)\n\
    \                    as Template;\n                if ( connectedT != null )\n\
    \                {\n                    if ( connectedT.CanUseForAuthoring )\n\
    \                    {\n                        // create the connected posting\n\
    \                        Posting newConnectedPosting;\n                      \
    \  newConnectedPosting = destination.CreateConnectedPosting(\n               \
    \             connectedT, originalPosting);\n\n                        // set\
    \ the properties of the connected posting\n                        newConnectedPosting.DisplayName\
    \ = txtDisplayName.Text;\n\n                        // commit the changes\n  \
    \                      cmsContext.CommitAll();\n\n                        // display\
    \ the success message\n                        lblErrorMessage.Text = \"Connected\
    \ Posting created successfully!\";\n                    }\n                }\n\
    \            }\n        }\n    }\n}\n```"
