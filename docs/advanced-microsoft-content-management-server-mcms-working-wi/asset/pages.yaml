  md: "We will now save the placeholder content back to MCMS by overriding the SavePlaceholderContent()\
    \ method. We will retrieve the current settings using the GetSettingsAsXml() method\
    \ and set it to the XmlAsString property of the XmlPlaceholder:\n\n```\n/// <summary>\n\
    /// Save the placeholder content back to MCMS\n/// </summary>\n/// <param name=\"\
    e\"></param>\nprotected override void SavePlaceholderContent(PlaceholderControlSaveEventArgs\
    \ e)\n{\n    // check the child controls were created successfully\n    EnsureChildControls();\n\
    \n    // Set the Xml Placeholder\n    this.BoundXmlPlaceholder.XmlAsString = GetSettingsAsXml();\n\
    }\n#endregion\n```\n\n# Retrieving and Parsing the RSS Feed\n\nLet's now create\
    \ the LoadAndRenderRssFeed() method, which will retrieve an RSS feed via an HTTP\
    \ request and parse it. It will also output the items in the RSS feed depending\
    \ on the settings that have been saved into the XmlPlaceholder.\n\n> For the purposes\
    \ of this example, we are not coding for proxy server interaction but if you have\
    \ a proxy server you should store the address (and credentials if required) in\
    \ the Web.config.\n\n```\n#region Retrieving and Parsing the RSS Feed\n\n/// <summary>\n\
    /// Load the RSS feed by a WebRequest\n/// and then parse the input returning\
    \ a string\n/// </summary>\npublic string LoadAndRenderRssFeed()\n{\n```\n\nFirst,\
    \ we will load the setting from the XML Placeholder:\n\n```\n// Load the settings\
    \ from the Xml\nthis.LoadSettingsFromXml(this.BoundXmlPlaceholder.XmlAsString);\n\
    \nenmState CurrentState = enmState.none;\nstring Title = \"\";\nstring Link =\
    \ \"\";\nstring Author = \"\";\nstring PubDate = \"\";\nstring Descript = \"\"\
    ;\n\n// Declare and instantiate the string builder\n// that the HTML will be written\
    \ to.\nStringBuilder sb = new StringBuilder();\n```\n\nNext, we make a web request\
    \ using the WebRequest class. If you need to specify a proxy, uncomment the proxy\
    \ code and replace proxyserver with your proxy name.\n\n```\n// Create a new WebRequest\
    \ to the URL specified\n// in the <RssUrl> element stored in the XmlPlaceholder\n\
    ```"
