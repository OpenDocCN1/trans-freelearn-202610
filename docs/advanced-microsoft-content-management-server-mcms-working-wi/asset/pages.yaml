- pgno: 411
  md: "```\nXmlWriter.WriteElementString(\"author\", GetAccountFriendlyName(_Posting.LastModifiedBy.ClientAccountName));\n\
    \n// Set the GUID element to the posting's guid\n// Also set the isPermaLink attribute\
    \ to false.\nXmlWriter.WriteStartElement(\"guid\");\nXmlWriter.WriteAttributeString(\"\
    isPermaLink\",\"false\");\nXmlWriter.WriteRaw(_Posting.Guid);\nXmlWriter.WriteEndElement();\n\
    \n// Output the posting's summary as the description element\nXmlWriter.WriteElementString(\"\
    description\", GetPostingSummary(_Posting));\n\n// Close the </item> element\n\
    XmlWriter.WriteEndElement();\n}\n```\n\nNext, we close the XML elements, flush\
    \ the XmlWriter, and return the XML string.\n\n```\n// Close the <channel> element\n\
    XmlWriter.WriteEndElement();\n\n// Close the <rss> element\nXmlWriter.WriteEndElement();\n\
    \n// Flush the XmlWriter\nXmlWriter.Flush();\n\n// Reset the position of the memory\
    \ stream\n_MemoryStream.Position = 0;\n\n// create a new stream reader and read\
    \ the memory stream\nStreamReader _StreamReader = new StreamReader(_MemoryStream);\n\
    \n// Return the contents of the stream reader\nreturn (_StreamReader.ReadToEnd());\n\
    }\n```\n\nThe first helper method, GetPostingSummary(), must retrieve the description\
    \ or content for the posting that will be described by the RSS feed.\n\nGetPostingSummary()\
    \ uses a configuration variable called RSS_Summary_PlaceholderName, which will\
    \ be read from the Web.config file. RSS_Summary_PlaceholderName can store the\
    \ name of the placeholder that will be aggregated into the RSS feed in the description\
    \ element. If the value is empty or the placeholder is not found, the posting's\
    \ description property (Posting.Description) will be used instead.\n\nLet's add\
    \ the GetPostingSummary() method to the rss class.\n\n```\n/// <summary>\n///\
    \ Get the summary for a posting\n/// </summary>\n/// <param name=\" Posting\"\
