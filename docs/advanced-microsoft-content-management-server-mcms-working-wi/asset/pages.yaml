    <TD>Greet the world: </TD>

    <TD></TD>

    </TR>

    </TBODY>

    </TABLE>

    ```

    ```


    What happened? The HtmlPlaceholder object was designed to store only specific
    tags such as the `<table>`, `<tr>`, and `<td>` tags (note that these table tags
    are only accepted when full formatting is allowed). The full list can be obtained
    from the documentation.


    # Where can I find a full list of tags accepted by the HtmlPlaceholder?


    The full list of allowed tags is documented in the MCMS manual, in the chapter
    *Mapping HTML Placeholder Definition Properties to Content Authoring Behavior*.
    The online version can be found at `http://msdn.microsoft.com/library/en-us/sitedevl/htm/cms_sd_dev_vsnetintegration_lcua.asp`.


    Such restrictions are placed to prevent potentially dangerous tags from being
    entered and saved in placeholders. Such code could potentially cause infinite
    loops that open new browser windows, steal cookies, and even launch malicious
    applets or other controls.


    Nevertheless, there may be times when your authors need to contribute content
    that contains these prohibited tags. Authors may need to embed client-side script,
    IFRAMES, applets, or ActiveX controls within placeholder content. Usually, these
    objects are defined within the template file, but doing so requires the developer
    to insert the code. Tech-savvy authors may wish to manage such content themselves,
    bypassing potential workflow bottlenecks caused by busy developers.


    The default HtmlPlaceholder placeholder object does not allow all tags. To get
    around this, we will build a custom placeholder control. Let''s call it the AllTagsHtmlPlaceholderControl.
    The control will have the same look and feel as the HtmlPlaceholderControl but
    it will modify the content so that the underlying HtmlPlaceholder no longer detects
    the disallowed tags when the posting is saved.


    Here''s the completed AllTagsHtmlPlaceholderControl in authoring view. It looks
    exactly like the HtmlPlaceholderControl. Authors won''t even know the difference.


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_285_0.png)'
