    # Providing Content as an RSS Feed


    We will create a mechanism that will allow users to point their RSS aggregator
    to a page and retrieve the postings that have been updated within a set number
    of days. An RSS aggregator is a program that can retrieve items from one or more
    RSS feeds and display the items in a readable form.


    # Creating the RSS Feed


    For the purposes of this example, we will create a new web form in the Tropical
    Green sample site.


    Let''s jump right into the code:


    +   1. Launch the Tropical Green solution in Visual Studio .NET.

    +   2. Create a new folder to store our RSS web form by right-clicking on the
    TropicalGreen project and selecting Add | New Folder. Name the new folder UtilityPages.

    +   3. Create a new web form in the UtilityPages folder by right-clicking on UtilityPages
    and selecting Add | Add New Web Form.

    +   4. Name the item rss.aspx and click Open.

    +   5. We should now have a blank web form created and opened in Design view.


    The web form we are creating will return XML and not HTML, so we need to remove
    the generated elements from the rss.aspx file as they will not form part of our
    RSS XML document.


    +   1. At the bottom left of the screen, Click HTML to switch to HTML mode.

    +   2. Delete everything below the Page directive:

    +   <%@ Page language="c#" Codebehind="rss.aspx.cs" AutoEventWireup="false" Inherits="TropicalGreen.UtilityPages.rss"
    %>

    +   3. As many different aggregators can hit your feed in an automated manner,
    the impact of the feed on the overall site performance could be huge. The frequency
    with which aggregators will poll the feed for changes cannot be controlled by
    us as the setting is usually configurable on the aggregator itself. To minimize
    this impact on site performance, we will implement output caching for the web
    form serving the feed. Add the following directive just below the Page directive
    to set output caching to 300 seconds, or five minutes:

    +   <%@ OutputCache Duration="300" VaryByParam="none" %>

    +   4. Switch to code view for the web form, and we''ll start adding the code
    generates our RSS feed. Import the following namespaces:

    +   using System;

    +   using System.Collections;'
  merge: -1
  img_proc: true
- pgno: 409
  md: "```\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\n\
    using System.Web;\nusing System.Web.SessionState;\nusing System.Web.UI;\nusing\
    \ System.Web.UI.WebControls;\nusing System.Web.UI.HtmlControls;\nusing System.Configuration;\n\
    using Microsoft.ContentManagement.Publishing;\nusing Microsoft.ContentManagement.Publishing.Extensions.Placeholders;\n\
    using System.IO;\nusing System.Xml;\nusing System.Text;\n\nnamespace TropicalGreen.UtilityPages\n\
    {\n    /// <summary>\n    /// Summary description for rss.\n    /// </summary>\n\
    \    public class rss : System.Web.UI.Page\n    {\n        - - - code continues\
    \ - - -\n    }\n}\n```\n\nLet's create the GenerateRssXml() method, which returns\
    \ the latest updates from our MCMS website as a string in RSS format. First we\
    \ set up the temporary memory stream and XmlTextWriter needed to create the XML\
    \ stream for sending to the client:\n\n```\n/// <summary>\n/// Generate the RSS\
    \ feed xml\n/// </summary>\n/// <returns>RSS XML</returns>\nprivate string GenerateRssXml()\n\
    {\n    // Create the Memory Stream\n    MemoryStream _MemoryStream = new MemoryStream();\n\
    \n    // Create an XmlTextWriter to write to the memory stream\n    XmlTextWriter\
    \ XmlWriter = new XmlTextWriter(_MemoryStream, Encoding.UTF8);\n\n    // Create\
    \ the top element <rss>\n    XmlWriter.WriteStartElement(\"rss\");\n\n    // Set\
    \ the version attribute of the RSS Feed\n    XmlWriter.WriteAttributeString(\"\
    version\", \"2.0\");\n\n    // Create the Channel Element\n    XmlWriter.WriteStartElement(\"\
    channel\");\n```\n\nThe general information for the RSS feed, such as Link, title,\
    \ and copyright, will be read from the Web.config file, and we'll create these\
    \ Web.config entries later. GenerateRssXml() relies on two helper methods that\
    \ we will develop shortly, GetPostingSummary(), which will retrieve the summary\
    \ of a posting (either an HtmlPlaceholder or the Description property), and GetAccountFriendlyName(),\
    \ which is designed to return the author's full name.\n\n```\n// Get the general\
    \ info from the Web.config\nstring strFeed_Title = ConfigurationSettings.AppSettings.Get(\"\
    RSS_Title\");\nstring strWebsiteUrl = ConfigurationSettings.AppSettings.Get(\"\
    RSS_WebsiteUrl\");\nstring strFeed_Copyright = ConfigurationSettings.AppSettings.Get(\n\
    \    \"RSS_Copyright\");\n```"
  merge: -1
  img_proc: true
- pgno: 410
