- pgno: 476
  md: "# Essential How-Tos, Tips, and Tricks\n\n+   - Register the method that cleans\
    \ up links to deleted resources on every template file with the `WebAuthorContext.SavePostingEvent()`\
    \ event. However, doing so would mean repeating code on all template files in\
    \ the solution.\n+   - Add the logic required to clean up the dead links within\
    \ the `CmsPosting_PlaceholderPropertyChanging()` event handler in the `global.asax`\
    \ file.\n\nWhile both options are workable, let's choose to place the clean-up\
    \ code in the `CmsPosting_PlaceholderPropertyChanging()` event handler in the\
    \ `global.asax` file. This will ensure that any time placeholder content is changed,\
    \ the clean-up processes are triggered. You are guaranteed that there will be\
    \ no links to deleted resources for pages that are saved after the resource has\
    \ been removed.\n\nTo begin, let's register the `CmsPosting_PlaceholderPropertyChanging()`\
    \ event handler.\n\n+   1. Open the code-behind file of the `global.asax` file\
    \ (`global.asax.cs`).\n+   2. Add the following namespaces:\n+   \n+   ```csharp\n\
    +   using Microsoft.ContentManagement.Publishing;\n+   using Microsoft.ContentManagement.Publishing.Events;\n\
    +   using Microsoft.ContentManagement.Publishing.Extensions.Placeholders;\n+ \
    \  ```\n+   \n+   3. Below the `Global()` constructor, add the `CmsPosting_PlaceholderPropertyChanging()`\
    \ event handler:\n+   \n+   ```csharp\n+   protected void CmsPosting_PlaceholderPropertyChanging(\
    \ Object sender,\n+       PropertyChangingEventArgs e )\n+   {\n+   }\n+   ```\n\
    \nResources are typically linked to in three possible locations. They could be\
    \ used within:\n\n+   - An `ImagePlaceholder` as an image. Links to resources\
    \ are stored in the `Src` property value.\n+   - An `AttachmentPlaceholder` as\
    \ an attachment. Links to resources are stored in the `Url` property value.\n\
    +   - An `HtmlPlaceholder` as either images or attachments. They are mixed within\
    \ the content retrieved from the `Html` property value.\n\n> Links to resources\
    \ can also be found within XmlPlaceholders. Based on your specific XML schema,\
