    ```\n\nTo be able to load an XmlNode with HTML, we will convert the HTML into\
    \ well-formed XHTML. We will do this by using a publicly available tool called\
    \ SgmlReader, by Chris Lovett, who works for a small outfit known as the Microsoft\
    \ Corporation.\n\n> SGML stands for Standard Generalized Markup Language, the\
    \ precursor to XML. The SgmlReader suite of tools provides many ways to create\
    \ well-formed XML, but for the purposes of this example we will only need SgmlReader.dll.\n\
    \nTo set up and configure the SgmlReader, follow these steps:\n\n+   1. Download\
