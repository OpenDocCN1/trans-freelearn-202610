  md: "```\n```csharp\n// test for \".\" at the end\nRegex regEx2 = new Regex(@\"\
    [\\\\.]$\", RegexOptions.None);\n\n// test for double \".\"\nRegex regEx3 = new\
    \ Regex(@\"\\\\.{2}\", RegexOptions.None);\n\nMatch match1 = regEx1.Match(name);\n\
    Match match2 = regEx2.Match(name);\nMatch match3 = regEx3.Match(name);\n\n// valid\
    \ = no invalid chars, no double dot, and no dot at the end\nisValid = !match1.Success\
    \ && !match2.Success && !match3.Success;\n\nreturn isValid;\n}\n```\n```\n\nThe\
    \ ValidateMCMsObjectName() method uses three regular expressions to check the\
    \ validity of the name.\n\nThe first regular expression looks like this:\n\n```\n\
    ```text\n[^A-Z0-9 _\\\\ (.-]\n```\n```\n\nIt’s a pattern that finds all characters\
    \ in the name that are not alphanumeric, spaces, underscores, opening and closing\
    \ parenthesis, periods and hyphens (note that the backslash character is used\
    \ as an escape character), satisfying the first condition for a valid name.\n\n\
    The second regular expression tests to see if the name ends with a period:\n\n\
    ```\n```text\n[\\\\.]$\n```\n```\n\nAgain, the backslash has been used as an escape\
    \ character. The period between the square brackets indicates that we are looking\
    \ for periods. The dollar sign instructs the pattern to match the end of the string.\n\
    \nThe third and last regular expressions tests for double periods in the string:\n\
    \n```\n```text\n\\\\.{2}\n```\n```\n\nAs before, the backslash is used as an escape\
    \ character. The number 2, surrounded by curly braces, indicates that we are looking\
    \ for double occurrences of the period.\n\nFinally, we run all three regular expressions.\
    \ As long as there are no invalid characters, periods at the end of the name,\
    \ or consecutive periods, the name is considered to be valid.\n\nTo use the ValidateMCMsObjectName()\
    \ method within a dialog, we will simply call it from within the code. Here's\
    \ how it's done for the Create Channel dialog. Add the following code to the btnCreate_Click()\
    \ event handler:\n\n```\n```csharp\nprivate void btnCreate_Click(object sender,\
    \ System.EventArgs e)\n{\n    - - - code continues - - -\n\n    try\n    {\n \
    \       - - - code continues - - -\n\n        // get the name of the channel\n\
    \        string Name = txtName.Text.Trim();\n\n        // check to see if the\
    \ name is valid\n        if (!Utility.ValidateMCMsObjectName(Name))\n```\n```"
