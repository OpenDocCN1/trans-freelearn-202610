- pgno: 176
  md: '+   - MCMS and SharePoint are used by Tropical Green to provide a complete
    intranet solution. SharePoint is primarily used to host smaller team sites and
    offer a centralized search engine for the entire intranet while MCMS is leveraged
    in content-heavy portions of the intranet.


    In the scenarios above, you''ll notice one common factor: the solutions pull content
    from one environment (such as SharePoint or MCMS) for display in another environment.
    Note that the content is not duplicated and is read only (with the exception of
    the SharePointDocumentLibrary placeholder, which MCMS Templates use to display
    content from SharePoint document libraries); it''s simply pulled in thus reducing
    data duplication. Limiting data duplication reduces errors and the costs associated
    with managing and updating the information in two different products. However,
    the overall performance of the solution will decrease as it would perform better
    if it had a copy of the data rather than pulling it in real time from another
    product. The three scenarios above, while rather simple, should give you an idea
    of some of the possibilities in sharing content between SharePoint and MCMS.


    # The MCMS Connector for SharePoint Technologies


    In February 2004, Microsoft released the Connector, which contains a collection
    of SharePoint Web Parts, MCMS controls, and placeholders, and a few command-line
    utilities developers can use to leverage the strengths of SharePoint in MCMS and
    vice versa. The Connector is completely free, is supported by Microsoft and fully
    documented, and contains a sample project (with data) demonstrating the features
    included in the package.


    > Refer to Appendix B, MCMS Connector for SharePoint Technologies, for information
    on where to obtain the Connector, installation instructions, and details about
    what it includes.


    The first scenario we''ll look at involves the presentation of MCMS content from
    within SharePoint. The Connector provides three ways to view our postings within
    MCMS in a SharePoint site using Web Parts.


    +   - MCMS Page Listing Web Part: Displays a list of postings selecting an MCMS
    channel. The presentation of the list can be modified using different views. We
    will create a custom view for this Web Part later in this chapter.

    +   - MCMS Pages in Production Web Part: Displays a list of postings the current
    user is working on similar to the Production Manager in MCMS.

    +   - MCMS Pages Waiting for Approval Web Part: Displays a list of postings that
    can be approved by the current user similar to the Approval Assistant in MCMS.


    After installing the Connector, these three Web Parts are automatically installed
    on all portal sites. If you are going to create a portal after the Connector has
    been installed you need to install the three Web Parts, which are all contained
    in a single CAB file, manually. Unfortunately the documentation included with
    the Connector does not explain how to install the Web Parts. SharePoint requires
    you to use a command-line utility to install Web Parts and perform other administrative
    functions. This utility, stsadm.exe, can be found in the directory at C:\Program
    Files\Common Files\Microsoft Shared\web server extensions\60\BIN\.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Let''s go ahead and install the Connector''s Web Parts using STSADM.EXE, then
    we will look at each Web Part we have installed.


    # Installing the MCMS Connector Web Parts


    +   1. Click Start | Run (or hit Windows + R) and enter cmd in the dialog box
    to bring up the command-line window.


    +   2. Change directory to the location of the STSADM.EXE utility by entering
    cd c:\Program Files\Common Files\Microsoft Shared\web server extensions\60\BIN\.


    +   3. Before we install, let''s see what Web Parts are already installed on all
    portals on our site. We do this by using the enumwppacks option which will display
    a list of all Web Parts installed on each virtual server. Enter the following
    command at the prompt: STSADM.exe -o enumwppacks. If you haven''t installed anything
    into your portal, you should see something like the following:


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_177_0.png)


    +   4. Now let''s go ahead and install the Connector Web Parts to all SharePoint
    extended virtual servers on our server. You need to find the CAB file that contains
    the three Web Parts included with the Connector. If you installed the Connector
    in the default installation directory, you''ll find the CAB file at c:\Program
    Files\MCMS Connector for SharePoint Technologies\WSS\Bin\CmsWebParts.cab. Type
    the following into the command console: STSADM.exe -o addwppack -filename "C:\Program
    Files\MCMS Connector for SharePoint Technologies\WSS\Bin\CmsWebParts.cab". You
    should see the following response:


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_177_1.png)


