- pgno: 318
  md: 'The ID of the HtmlPlaceholderControl does not appear in the ControlToValidate
    dropdown list. Shouldn’t the dropdown list be populated with placeholder IDs that
    match the type of control being validated?


    In order for the ID of the control to be included in the dropdown, we have to
    make the HtmlPlaceholderControl compatible with the ASP.NET validation control
    architecture. We will do just this in the section, The HtmlPlaceholderControl
    with Validation.


    # Preventing Pages with Invalid Content from Being Saved


    There’s still a problem to be tackled. Although the custom validation control
    has all the necessary code, it won’t work unless someone clicks on an ASP.NET
    control, such as a Button, that has its Control.CausesValidation property set
    to true. Otherwise, the page will still be saved even if required placeholders
    are not filled in.


    If you looked at the way the controls on the Default Console are coded (in the
    DefaultConsole.ascx file), you will find that they are simply HTML anchor tags.
    HTML anchor tags are not buttons and therefore do not trigger page validations.
    As a result, clicking on any of the action links on the console will not fire
    our custom validation control.


    We need the validator to fire when the user clicks one of the following three
    action buttons:


    +   - Save New Page

    +   - Save

    +   - Save and Exit


    We will modify the behavior of each of the three buttons to cancel the save action
    when the page is not valid.


    To find out how to force each of these controls to validate the page when clicked,
    we will once again get clues from ASP.NET. Earlier, we saw how ASP.NET generates
    a Button control:


    ```

    <input type="submit"

    name="Button1"

    value="Button"

    onclick="if (typeof(Page_ClientValidate)==‘function’)

    Page_ClientValidate();"

    language="javascript"

    id="Button1" />

    ```


    The highlighted line shows the code used to ensure that client-side validation
    takes place before the form is submitted. It basically calls the Page_ClientValidation()
    client-side script of the WebUIValidation.js file. This line of code ensures our
    HTML anchors will exhibit the same behavior as a Button.


    We need to insert it before calling the client-side save methods, which means
    we should modify each of the three Console Action buttons, starting with the Save
    New Page control.'
  merge: -1
  img_proc: true
- pgno: 319
  md: "# # Save New Page with Validation\n\nAdd a class file named `ValidatedSaveNewAction.cs`\
    \ to the `MCMSValidators` project. Above the namespace declaration, add the following\
    \ required namespaces:\n\n```\nusing System;\nusing Microsoft.ContentManagement.Publishing;\n\
    using Microsoft.ContentManagement.WebControls;\nusing Microsoft.ContentManagement.WebControls.ConsoleControls;\n\
    namespace MCMSValidators\n{\n}\n```\n\nInstead of re-writing the Save New Page\
    \ action control from scratch, we will create it by inheriting from the AuthoringSaveNewAction\
    \ class:\n\n```\npublic class ValidatedSaveNewAction : AuthoringSaveNewAction\n\
    {\n}\n```\n\nThe only modification we need to make is to override the ActionJavascript\
    \ property. We first check to see if the control is available to the user. If\
    \ it is, we look for the presence of validation controls using the Page.Validators.Count\
    \ property. Once we have ascertained that there are validation controls present,\
    \ we inject the JavaScript statement to call the Page_ClientValidate() method.\n\
    \nBelow the ValidatedSaveNewAction() constructor, add the overridden ActionJavascript\
    \ property:\n\n```\npublic override string ActionJavascript\n{\n    get\n    {\n\
    \        string strReturn = null;\n        if (this.Available)\n        {\n  \
    \          // Check to see if we have any validation controls on this page\n \
    \           if (this.Page.Validators.Count > 0)\n            {\n             \
    \   strReturn += \"if (typeof(Page_ClientValidate) == 'function') \";\n      \
    \          strReturn += \"{\";\n                strReturn += \"if (!Page_ClientValidate())\
    \ return false;\";\n                strReturn += \"}\";\n            }\n     \
    \       strReturn += base.ActionJavascript;\n        }\n        return strReturn;\n\
    \    }\n}\n```\n\n# # Save and Exit with Validation\n\nThe next button that we\
    \ will modify is the Save and Exit button. Add a class file named `ValidatedReeditSaveAndExitAction.cs`\
    \ to the `MCMSValidators` project. Insert the required namespaces as shown below:\n\
    \n```\nusing System;\nusing Microsoft.ContentManagement.Publishing;\nusing Microsoft.ContentManagement.WebControls;\n\
    using Microsoft.ContentManagement.WebControls.ConsoleControls;\nnamespace MCMSValidators\n\
    {\n}\n```"
