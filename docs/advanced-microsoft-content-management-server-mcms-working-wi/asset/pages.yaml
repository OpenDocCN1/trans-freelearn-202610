- pgno: 463
  md: "```\nif (currentPosting != null && recycleBin != null)\n{\n    if (currentPosting.CanDelete\
    \ && recycleBin.CanCreatePostings)\n    {\n        isAvailable = true;\n    }\n\
    \    return isAvailable;\n}\n```\n\nMost of the action takes place in the overridden\
    \ PerformActionBehavior() method. When the user clicks on the Delete (Recycle)\
    \ button, he or she gets a prompt: \"Deleting this Page will remove it permanently\
    \ from the system. Continue?\" The answer given by the user is stored in a hidden\
    \ form field named __CMS_ConfirmedDelete (it starts with a double underscore)\
    \ found on the posting. Selecting OK will set __CMS_ConfirmedDelete to true and\
    \ Cancel sets it to false (the default value). To determine whether or not the\
    \ user has decided to proceed, we check the value of this hidden form field.\n\
    \n```\nprotected override void PerformActionBehavior()\n{\n    string confirmDelete\
    \ =\n        Page.Request.Form[\"__CMS_ConfirmedDelete\"].ToString();\n    if\
    \ (confirmDelete == \"true\")\n    {\n        // User has confirmed the delete\n\
    \    }\n}\n```\n\nOnce the user has confirmed the delete, we proceed to get an\
    \ instance of the posting to be deleted. From there, we obtain the URL of its\
    \ parent channel and redirect the user to this URL after the posting has been\
    \ deleted.\n\n```\nprotected override void PerformActionBehavior()\n{\n    string\
    \ confirmDelete =\n        Page.Request.Form[\"__CMS_ConfirmedDelete\"].ToString();\n\
    \    if(confirmDelete==\"true\")\n    {\n        // User has confirmed the delete\n\
    \n        // Get the current posting\n        Posting p = cmsContext.Posting;\n\
    \n        // Get the URL of the posting's parent\n        string returnURL = p.Parent.Url;\n\
    \n        // TODO: Enter code for performing the delete operation\n\n        //\
    \ Redirect the user to the Channel's URL\n        HttpContext.Current.Response.Redirect(returnURL);\n\
    \    }\n}\n```\n\n\"Deleting\" the posting is a four-step process. Rather than\
    \ delete it, we:\n\n+   1. Store the posting's original expiry date and parent\
    \ channel's GUID as part of an XML string within its description.\n+   2. Expire\
    \ the posting."
  merge: -1
  img_proc: true
- pgno: 464
  md: "+   3. Move it to the RecycleBin channel.\n+   4. Commit the changes.\n\nThe\
    \ posting's expiry date and parent channel's GUID will be stored as part of an\
    \ XML string within its description. We will use the channel's GUID instead of\
    \ its path so that the posting can be restored even if the parent channel has\
    \ moved. This information will come in useful later should we decide to restore\
    \ the deleted posting. The format of the XML string is:\n\n```\n<DeletedItem>\n\
    <ExpiryDate>1 Jan 3000 12:00:00 AM</ExpiryDate>\n<ChannelGuid>{7AF93078-5FF8-4963-A9F9-B1A0977258A7}</ChannelGuid>\n\
    </DeletedItem>\n```\n\nIt doesn't matter if the description holds other values.\
    \ We simply append the entire XML at the back of the description. The description\
    \ field can hold up to 500 characters. We will make the assumption that this limit\
    \ is never reached.\n\n> If hitting the 500 character limit of the Description\
    \ property is a concern, consider storing the extra information in a posting's\
    \ custom property (which requires each template to have the custom property defined\
    \ but has a higher character limit) or in an external database. Alternatively,\
    \ you could store the content in an XMLPlaceholder and use the PAPI to add the\
    \ definition to the template if it does not yet exist.\n\nWe wrap the entire operation\
    \ in a try-catch block. Should any error occur while \"deleting\" the posting,\
    \ we roll back all changes and the error message would be automatically shown\
    \ on the Error Console.\n\n```\nprotected override void PerformActionBehavior()\n\
    {\nstring confirmDelete =\n    Page.Request.Form[\"__CMS_ConfirmedDelete\"].ToString();\n\
    if(confirmDelete==\"true\")\n{\n// User has confirmed the delete\n\n// Get the\
    \ current posting\nPosting p = cmsContext.Posting;\n\n// Get the URL of the posting's\
    \ parent\nstring returnURL = p.Parent.Url;\n\ntry\n{\n// 1. Copy the expiry date\
    \ and posting's path to its description\n// in the following format:\n// <DeletedItem>\n\
    // <ExpiryDate></ExpiryDate>\n// <ChannelGuid></ChannelGuid>\n// </DeletedItem>\n\
    string deletedInfo = \"<DeletedItem>\";\ndeletedInfo += \"<ExpiryDate>\";\ndeletedInfo\
    \ += p.ExpiryDate.ToString(\"dd MMM yyyy hh:mm:ss tt\");\ndeletedInfo += \"</ExpiryDate>\"\
    ;\ndeletedInfo += \"<ChannelGuid>\";\ndeletedInfo += p.Parent.Guid;\ndeletedInfo\
    \ += \"</ChannelGuid>\";\ndeletedInfo += \"</DeletedItem>\";\n```"
  merge: -1
  img_proc: true
