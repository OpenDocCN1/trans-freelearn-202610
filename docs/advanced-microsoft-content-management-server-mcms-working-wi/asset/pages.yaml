    *Building Websites with Microsoft Content Management Server* (Packt Publishing,
    January 2005, ISBN 1-904811-16-7).


    # A Placeholder Control to Display SharePoint List Contents


    Since our placeholder control will retrieve all the items within a list, we need
    to determine how we''ll access the actual list in the SharePoint portal. One option
    is to use the SharePoint API, but there is a downside to this approach: our MCMS
    site and SharePoint portal must reside on the same server because the SharePoint
    API will only access the server it''s installed on, not a remote server. While
    this may be feasible in a test environment and some production environments, it''s
    quite limiting. Another option is to access the SharePoint list via the Web Services
    included with SharePoint. The List Service Web Service contains methods that return
    the schema of the list, add, update, and remove items, as well as retrieve the
    contents of the list. Each SharePoint site has a reference to this Web Service
    so all lists are exposed to external applications.


    Accessing the list via the Web Service is a better option than accessing it via
    the API. This solution can work on a server with both MCMS and SharePoint installed
    or if the two products are installed on separate servers.


    Our placeholder control, the `SharePointEventsPlaceholderControl`, will leverage
    the SharePoint List Service Web Service to retrieve the items in the SharePoint
    Event list. In authoring mode, it will require the author to enter the Web Service
    URL of the SharePoint site and the name of the Events list.


    Let’s get started. The first thing we need to do is create a new class for our
    placeholder control and add the necessary references to the project:


    +   1. Add a new class to the `TropicalGreenControlLib` project. Name the new
    class `SharePointEventsPlaceholderControl.cs`.

    +   2. Right-click the project and select Add Web Reference…

    +   3. Specify the List Service URL in the URL textbox and click the Go image.
    In our case, the address of the List Service is `http://portal.tropicalgreen.net/_vti_bin/lists.asmx`.
    Once it loads, accept the default Web reference name by clicking the Add Reference
    button.'
