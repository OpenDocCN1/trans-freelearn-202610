    \ destination placeholder is the one picked out by the author from the drop-down\
    \ lists. Add the CopyPostingContent() method directly below the SwitchTemplate()\
    \ method.\n\n```\npublic void CopyPostingContent(Posting source, Posting destination)\n\
    {\n    // Copy all placeholder content from the old version and create a new\n\
    \    // version with that content\n    foreach (Placeholder sourcePH in source.Placeholders)\n\
    \    {\n        // Look for the value in the corresponding DropDownList in the\
