  md: "# Publishing Content Between MCMS and SharePoint\n\nWith the authoring controls\
    \ and a posting to view our progress created, let's continue with adding some\
    \ functionality to our placeholder control. Regardless if the posting is in authoring\
    \ or presentation mode, we will need to retrieve the items from the SharePoint\
    \ Events list via the SharePoint List Service Web Service. In order to access\
    \ this Web Service, we need the URL of the service, the name of the list containing\
    \ the items we're interested in, and valid login credentials for the site.\n\n\
    > For simplicity, we're going to hard-code the credentials. However, we strongly\
    \ recommend you employ a more secure solution such as encrypting the username\
    \ and password in the Web.config of the site or allowing the content owner to\
    \ enter the credentials into the placeholder control with the URL and list name.\
    \ Microsoft recommends the data protection API (DPAPI) available in the .NET base\
    \ class library.\n\nSince we'll need this functionality in both modes, we'll create\
    \ a method called `GetSharePointListItems()` that requires the Web Service URL\
    \ and list name while returning an array of all items within the list. For each\
    \ item returned in the array, we want to know the following information regarding\
    \ the event:\n\n+   - Title\n+   - Description\n+   - Location\n+   - Start Date/Time\n\
    +   - End Date/Time\n\nThe best way to store these details is to create a new\
    \ class in the `TropicalGreenControlLib` project. Call it `SharePointEventListItem.cs`\
    \ and add the following code to define a business object to represent the items\
    \ within a SharePoint Event list:\n\n```\nusing System;\n\nnamespace TropicalGreenControlLib\n\
    {\n    public class SharePointEventListItem\n    {\n        private string _title;\n\
    \        private string _location;\n        private DateTime _startDateTime;\n\
    \        private DateTime _endDateTime;\n\n        // force callers to use the\
    \ Factory method below\n        private SharePointEventListItem() {}\n\n     \
    \   // Factory method used to create a new SharePointEventListItem\n        public\
    \ static SharePointEventListItem CreateItem(string title,\n            string\
    \ location, DateTime start, DateTime end)\n        {\n            SharePointEventListItem\
    \ li = new SharePointEventListItem();\n            li._title = title;\n      \
    \      li._location = location;\n            li._startDateTime = start;\n    \
    \        li._endDateTime = end;\n            return li;\n        }\n    }\n```"
