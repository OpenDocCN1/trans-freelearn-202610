- pgno: 336
  md: 'Examine the code and you will find that it is very similar to the previous
    two custom validation controls.


    +   - The JavaScript that checks to see if a file has been uploaded to the SingleAttachmentPlaceholderControl
    is injected into the template file within the OnPreRender() method.

    +   - The ControlPropertiesValid() method verifies that a control to be validated
    is indeed a SingleAttachmentPlaceholderControl.

    +   - Finally, the EvaluateIsValid() method performs a server-side check to see
    if the SingleAttachmentPlaceholderControl.AttachmentUrl property contains a path
    to a file. If it doesn’t, the method returns false. As in the previous examples,
    this method would probably not be triggered as we are relying on client-side checks
    for validation. If you need to perform server-side validation, you will have to
    create a custom placeholder control as described in the section Implementing Server-Side
    Validation.


    # Summary


    In this chapter, we explored how MCMS placeholder controls can be validated. We
    started by showing that the validation web controls shipped with ASP.NET can’t
    be used with MCMS placeholder controls. To get around this limitation, we built
    three validation controls, one for the HTMLPlaceholderControl, a second for the
    SingleImagePlaceholderControl, and a third for the SingleAttachmentPlaceholderControl.
    We demonstrated how simple checks for empty placeholders can be performed using
    client-side scripting techniques. We also illustrated that server-side validation
    is possible by building custom placeholder controls. The methods discussed in
    this chapter can be extended to cover more complex and rigorous validation requirements
    from checking to see if telephone numbers, zip codes or email addresses are in
    a valid format to validating against content stored in an external database.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# 10


    # Staging Static Pages


    Websites today are dynamic and versatile. Dynamic sites offer many advantages
    over static sites. Using MCMS, you get to personalize and work with the PAPI to
    create a truly interactive and personalized user experience. For example, we have
    seen how navigation structures can be hidden or shown based on an individual''s
    access rights. In fact, content gets updated so frequently and the demand for
    interactivity is so high that content management systems, like MCMS, assemble
    pages on the fly. At the very most, snapshots of pages are cached in memory or
    on the server''s hard disk to speed up the process of delivering pages. The cache
    is invalidated after a certain time period has elapsed or when the content changes.
    Nothing is ever frozen: only fresh content is served.


    In a book about creating dynamic sites, you may find it strange that this entire
    chapter is devoted to staging static pages. The truth is, despite the fast-paced
    demands of technology, there is a need to slow things down a little. Static copies
    of an entire website can be useful on occasions such as:


    +   - Creating pages to be packaged on offline media like CD ROMs. User guides
    and help files are often included with shrink-wrapped software in the form of
    electronic documents on CDs. Even Microsoft help files (or CHM files) are themselves
    built from static HTML files.

    +   - Taking a snapshot of the site for archival or back-up purposes.

    +   - Creating static files for indexing by Index Server or other search engines
    that require the presence of physical files.

    +   - Sharing content across multiple servers. Yes, you could install MCMS on
    the other servers, or even syndicate content using web services. However, sometimes,
    the best solution is the simplest—just make static copies of shared content and
    use a good file copy technique like FTP to transport them (and sidestep the need
    to acquire more production MCMS licenses).


    If you need to generate static versions of MCMS websites, there are two options
    available:


    +   - Use the Site Stager utility that ships with MCMS 2002.

    +   - Write a custom staging tool that generates a static snapshot of each page.


    > Important Note: Site Stager only stages static pages from postings based on
    ASP templates. It does not work for postings based on ASP.NET templates.'
  merge: -1
  img_proc: true
