  md: '| Argument | What it does |

    |---|---|

    | `strPostQueryString` | A querystring containing information about the posting
    in unpublished mode such as its GUID or, if it''s a new posting, the channel''s
    GUID. |

    | `strPhName` | The name of the placeholder. |

    | `strPhType` | The value here determines how the Insert Attachment dialog passes
    information about the attachment back to the calling control. When dealing with
    attachments, Web Author recognizes the following values:


    - **MultiPurpose.** Applies to controls that accept HTML with full formatting.

    - **SingleAttachment.** Used by the `SingleAttachmentPlaceholderControl` for single
    file uploads.

    - **ThinEditIE.** Similar to `MultiPurpose`. The difference is that insertions
    to the placeholder use the placeholder document object model (DOM) instead. We
    will use this option in this example. |

    | `bAllowUpload` | A Boolean to indicate if local attachments are allowed. A value
    of `false` means that only resource gallery items can be attached. |

    | `bAttachIcon` | A Boolean flag to indicate if the attachment should be rendered
    as an icon. When it is set to `true`, the attachment is added to the content as
    an icon. Otherwise, it will be displayed as a text link. |

    | `bAllowVideo` | The last Boolean indicates if video attachments are supported.
    This is a throwback to the previous version of MCMS where videos were supported.
    In MCMS 2002, this value should always be set to `false`. |


    Putting it all together, here''s the script that launches the Insert Attachment
    dialog. Of course, the GUIDs and the placeholder name are variables that will
    have to be dynamically generated. The following code snippet would allow local
    attachments and use icons to represent attachments:


    ```

    WBC_LaunchAttachmentGallery("wbc_purpose=Basic&NRMODE=Unpublished&WBCMODE=PresentationUnpublished&FRAMELESS=TRUE&CHANNELGUID=C40686DA-83CF-452F-AF24-3D990FA2BAC1}&NRNOGUID={7AF93078-5FF8-4963-A9F9-1BA0977258A7}&NewHtmlPlaceholderDefinition1",
    "ThinEditIE", true, true, false);

    ```


    The `GetAttachmentDialog()` method generates the required client-side script.
    The script gathers information about:


    +   - The channel''s and posting''s GUIDs.

    +   - The name of the placeholder the control is bound to.

    +   - Whether or not local attachments are allowed.

    +   - Whether the attachments should be displayed as icons or text. For this control,
    we will always set this parameter to `true` as we want icons to be displayed in
    the authoring table.


    Once it has collected the necessary data, it puts them together as arguments of
    the `WBC_LaunchAttachmentGallery()` function. Add the `GetAttachmentDialog()`
    method now:'
