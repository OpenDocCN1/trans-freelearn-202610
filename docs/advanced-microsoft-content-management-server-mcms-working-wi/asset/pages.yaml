  md: "```\n```csharp\nprotected override void Render( HtmlTextWriter writer )\n{\n\
    \    ChannelItem currentItem = CmsHttpContext.Current.ChannelItem;\n\n    if(\
    \ currentItem != null )\n    {\n        string followKey = (currentItem.IsRobotFollowable)?Follow:noFollow;\n\
    \        string indexKey = (currentItem.IsRobotIndexable)?Index:noIndex;\n\n \
    \       // write the robot META tag\n        writer.Write(\"<meta name=\\\"ROBOTS\\\
    \"\\n\"\n                   + \" content=\\\"\"+followKey+\",\"+indexKey+\"\\\"\
    >\\n\");\n\n        if( this.RenderBaseHref )\n        {\n            // write\
    \ the Base tag\n            writer.Write(\"<base href=\\\"\"+Page.Request.Url.AbsoluteUri+\"\
    \\\">\\n\");\n        }\n    }\n}\n```\n```\n\nSave and build the solution. Add\
    \ the control to the toolbar as you would other custom controls and it’s ready\
    \ to be dropped into channel rendering scripts or template files between the `<head>`\
    \ tags.\n\n# Outputting META Tags\n\nAs well as the ROBOTS META tag, you can emit\
    \ other META tags to help indexing by the particular search engine you are working\
    \ with. Common tags used by search engines include the `<title>` tag and the Description\
    \ and Keywords META tags.\n\nIn MCMS, channels and postings have Description and\
    \ DisplayName properties, which are often suitable for the Description META tag\
    \ and the `<title>` tag respectively.\n\n> > Custom properties can also be used\
    \ as META tags and rendered as `<meta`\n> > `name=\"CustomPropertyName\" content=\"\
    CustomPropertyValue\">`\n\nKeywords can be entered by authors and stored as custom\
    \ property values. What you will need to do then is to retrieve these values from\
    \ the repository and display them as META tags in the head region of the page.\n\
    \nThere are several ways you can go about this:\n\n+   - The fastest method is\
    \ to simply use `<%= %>` constructs or `Response.Write()` calls within the template\
    \ HTML code.\n+   - If content that resides in custom properties or placeholders,\
    \ you can retrieve it using code-behind files.\n\nLike regular controls, use a\
    \ web user control to share code among template files in the same project. If\
    \ you need to generate the same set of tags across pages stored in multiple projects,\
    \ consider writing a custom control as we did for the ROBOTS tag earlier."
