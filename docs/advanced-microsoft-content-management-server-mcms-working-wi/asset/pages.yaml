    > <install drive>:\Program Files\MCMS 2002 Connector for SharePoint Technologies\WSS\bin\.


    Go ahead and execute the SearchPropertiesSetup.exe utility as above because our
    custom search solution will use one of the META tags it generates.


    > If you change the SearchPropertyCollection.xml file, you will need to re-execute
    the SearchPropertiesSetup.exe utility.


    The MCMS Connector for SharePoint Technologies includes a help file with instructions
    on how to modify the XML file. Be aware that a Microsoft Support Knowledge Base
    article exists addressing an error in the help file instructions. The MSKB article
    A problem occurs when you add the SearchMetaTagGenerator control to a template
    in Content Management Server 2002 Connector for SharePoint Technologies (#872932)
