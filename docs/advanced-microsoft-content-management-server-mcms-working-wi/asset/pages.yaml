- pgno: 178
  md: 'Now that we have the Connector Web Parts installed, let''s take a look at each
    of them.


    # MCMS Page Listing Web Part


    The MCMS Page Listing Web Part displays the postings within a specified channel.
    Once this Web Part is added to a SharePoint Web Part Page, you specify the MCMS
    site root URL and channel path that contains the postings you wish to display.
    Users with appropriate permissions to modify the Web Part settings can also specify
    the number of postings to display per page, the sorting order of the postings,
    and how they wish to display or view the list.


    Let''s add the MCMS Page Listing Web Part to a SharePoint Web Part Page and see
    what we get.


    +   1. Navigate to a SharePoint portal in Internet Explorer. We''ll use the portal
    created in Appendix A and used for our search in Chapter 5: http://portal.tropicalgreen.net.

    +   2. Click the Edit Page link in the vertical left-hand Actions menu:

    +   3. Now that the page is in edit mode, click the Modify Shared Page link in
    the upper left. Using the dynamic drop-down menu that appears, select Add Web
    Parts and then Browse.


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_178_0.png)


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_178_1.png)'
  merge: -1
  img_proc: true
- pgno: 179
  md: '4. When the SharePoint Web Part Tool Pane loads on the right-hand side of the
    browser, it is set to list all Web Parts in the portal''s Web Part gallery (in
    our case, the Tropical Green Gallery). When you install Web Parts in a SharePoint
    site (SPS or WSS), they are added to the Virtual Server Gallery. Since we installed
    the Web Parts included with the Connector, we need to select the Virtual Server
    Gallery by clicking it.


    # What is the SharePoint Web Part Tool Pane?


    The SharePoint Web Part Tool Pane is a task pane on a SharePoint Web Part Page
    used to add Web Parts from Web Part galleries, and to modify custom and common
    Web Part properties.


    # Why are the Web Parts we installed in the Virtual Server Gallery?


    When you install a Web Part, you are installing it to a specific virtual server.
    Even when you elect to install it in all sites or in the Global Assembly Cache,
    the additions are made to each virtual server to tell the SharePoint portal (or
    site(s)) within that virtual server that it can use the Web Part.


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_179_0.png)


    5. You should now see the three Web Parts included in the Connector listed in
    the Add Web Parts Tool Pane as shown in the previous image. Select the MCMS Page
    Listing and drag it onto the page, placing it the top zone, as shown in the following
    image:


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_179_1.png)'
