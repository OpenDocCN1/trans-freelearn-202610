- pgno: 339
  md: '# Installing Site Stager


    The first step to using Site Stager is to install it. To find out if Site Stager
    has already been installed on your machine, select Start | Programs | Microsoft
    Content Management Server. See if an entry for Site Stager is listed.


    Otherwise, follow the steps below to install Site Stager:


    +   1. From the Control Panel, choose to Add/Remove Programs.

    +   2. Select Microsoft Content Management Server from the list of currently installed
    programs. Click Change.

    +   3. In the Program Maintenance dialog, choose to Modify the program features.

    +   4. In the Custom Setup dialog, select the Site Stager component.


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_339_0.png)


    +   5. Click Next to confirm your selection.

    +   6. Click Install to begin the installation process.

    +   7. When the installation completes, click Finish to close the dialog.


    An entry for Site Stager is now available in the Start menu. Click on it to start
    it.


    # Defining the Destination User


    When you first start Site Stager, you will be asked to specify the destination
    user, that is, the user whose credentials will be used to create folders and files
    on the target server. The user should have the following rights on the machine
    running Site Stager:


    +   - Member of the local computer''s administrators group.

    +   - "Log on locally" rights.

    +   - "Log on as a batch job" rights.'
