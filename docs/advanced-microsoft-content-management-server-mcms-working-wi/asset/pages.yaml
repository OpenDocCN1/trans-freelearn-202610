- pgno: 171
  md: '# Publishing Content Between

    MCMS and SharePoint


    Microsoft Content Management Server (MCMS) and SharePoint Products and Technologies
    (SPS and WSS) provide complementary feature sets. MCMS is a content publishing
    product that provides a robust publishing workflow engine. SharePoint is an online
    collaboration product providing users a platform to share information such as
    document libraries and lists. It also contains a centralized enterprise-strength
    search and indexing engine enabling users to search disparate content types within
    many smaller sites. Neither product can be seen as an alternative to each other
    because they have such specific and different uses. However the two products''
    primary features could benefit each other if leveraged correctly.


    In this chapter, we''ll explore publishing both MCMS and SharePoint content between
    the two products to demonstrate the many possibilities available for leveraging
    the power of each product from the other. We''ll first take a look at a few different
    scenarios of why, how, and when you would want to publish content from one product
    to the other. Then, we''ll look in detail at publishing content from MCMS into
    SharePoint and vice versa. Each analysis will examine what the MCMS Connector
    for SharePoint Technologies provides to accomplish these content-sharing tasks
    as well as discussing, and at times building, custom solutions to fill in gaps
    left by the Connector due to the latter''s limited customization.


    As you would expect, this chapter will not cover using SharePoint Portal Server
    as a search engine for an MCMS site, as this was covered in detail in Chapter
    5, *Searching MCMS with SharePoint*.


    In this chapter, we''ll look at further ways in which SharePoint and MCMS can
    work hand in hand to provide a robust content authoring and collaboration solution.'
  merge: -1
  img_proc: true
- pgno: 172
