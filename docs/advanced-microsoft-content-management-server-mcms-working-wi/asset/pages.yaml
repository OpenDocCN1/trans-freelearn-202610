  md: "Append the code highlighted below to the Main() routine:\n\n```\n[STAThread]\n\
    static void Main(string[] args)\n{\n    ... code continues ...\n    // Start the\
    \ iteration process\n    Channel rootChannel = cmsContext.Searches.GetByPath(m_StartChannel)\
    \ as Channel;\n    if (rootChannel != null)\n    {\n        CollectChannel(rootChannel);\n\
    \    }\n    else\n    {\n        WriteToLog(\"Error: Start Channel \" + m_StartChannel\
    \ + \" cannot be \" + \"found or user does not have sufficient rights!\");\n \
    \   }\n}\n```\n\n# Iterating Through the Channel Tree\n\nFrom the start channel,\
    \ the CollectChannel() method walks through the rest of the tree, looking for\
    \ channels and postings.\n\nWhen it sees a channel, it will create a static version\
    \ of the channel rendering script or default posting and all postings in its collection.\
    \ The method calls itself recursively until all channels in the tree have been\
    \ staged.\n\nThe Download() helper method will perform the task of downloading\
    \ the content and generating static pages as we will see later. Add the CollectChannel()\
    \ method to the code:\n\n```\nstatic void CollectChannel(Channel channel)\n{\n\
    \    // Download the channel rendering script or the default posting\n    Download(GetUrlWithHost(channel.Url),\
    \ channel.Path.Replace(m_StartChannel, \"\"), m_DefaultFileName, EnumBinary.ContentPage);\n\
    \    // Download all the postings within the channel\n    foreach (Posting p in\
    \ channel.Postings)\n    {\n        WriteToLog(\"Info: Downloading Posting: \"\
    \ + p.Path);\n        Download(GetUrlWithHost(p.Url), channel.Path.Replace(m_StartChannel,\
    \ \"/\"), p.Name, EnumBinary.ContentPage);\n    }\n    foreach (Channel c in channel.Channels)\n\
    \    {\n        CollectChannel(c);\n    }\n}\n```\n\nThe CollectChannel() method\
    \ uses a helper function, GetUrlWithHost(), which replaces any host names found\
    \ within the URL with the value stored in the m_SourceHost variable. The reason\
    \ we do this is to handle links that do not have the host name as part of the\
    \ URL, particularly for sites that do not have host header mapping turned on.\
    \ For such sites, Channel.Url will return a value without the host header, like\
    \ this: /plantcatalog/ficus.htm. To successfully issue the HTTP request that gets\
    \ the page, the host value (which in our case will be http://www.tropicalgreen.net)\
    \ has to be pre-pended to the URL."
