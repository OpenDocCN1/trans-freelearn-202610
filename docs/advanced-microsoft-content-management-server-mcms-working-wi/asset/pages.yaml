  md: "# Rendering the RSS Feed in Presentation Mode\n\nWe will now create the interface\
    \ for presenting the RSS feed. In unpublished mode, the RssReader placeholder\
    \ control will show Feed will be shown in published mode, and when the placeholder\
    \ is viewed in published mode, LoadAndRenderRssFeed() will be executed to retrieve\
    \ the feed and its output will be bound to the basePresentationControl.\n\nFirst\
    \ we override CreatePresentationChildControls() to create the presentation child\
    \ controls:\n\n```\n```csharp\n#region Presentation\n\n/// <summary>\n/// Create\
    \ the Presentation Controls\n/// </summary>\n/// <param name=\"presentationContainer\"\
    ></param>\nprotected override void CreatePresentationChildControls(\n    BaseModeContainer\
    \ presentationContainer)\n{\n    // Instantiate a literal control and\n    //\
    \ set the base presentation control\n    this.basePresentationControl = new LiteralControl();\n\
    \n    // Set the ID of the base presentation control\n```\n```\n\n```\n```csharp\n\
    // Date?\nif (this.ShowDate)\n{\n    // Append the Date\n    sb.Append(PubDate);\n\
    }\n\nsb.Append(\"</div>\\n\");\n\n// Are we showing the Open Article Link?\nif\
    \ (this.ShowOpenArticleLink)\n{\n    sb.Append(\" <div>\");\n    sb.Append(\"\
    <a target=\\\"_blank\\\" href=\\\"\" + Link\n        + \"\\\">[Open Article]</a>\"\
    );\n    sb.Append(\"</div>\\n\");\n}\n\nsb.Append(\"</div>\\n\");\nrsReader.Read();\n\
    break;\n}\ndefault:\n{\n    rsReader.Read();\n    break;\n}\n}\n}\n\n// return\
    \ the string builder contents\nreturn(sb.ToString());\n}\n\n#endregion\n```\n\
    ```"
