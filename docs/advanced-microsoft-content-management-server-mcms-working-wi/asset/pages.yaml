  md: "# Useful Placeholder Controls\n\n```\n```csharp\nprivate string GetAttachmentDialog(int\
    \ i)\n{\n    // Check to see if the NRCHANNELGUID querystring contains a value\n\
    \    // If it does, then it's most likely a new posting\n    string channelGUID\
    \ = Page.Request.QueryString[\"NRCHANNELGUID\"];\n    if (channelGUID != \"\"\
    )\n    {\n        channelGUID = \"&NRCHANNELGUID=\" + channelGUID;\n    }\n\n\
    \    // Get the GUID from the NRNODEGUID querystring parameter\n    string postingGUID\
    \ = Page.Request.QueryString[\"NRNODEGUID\"];\n\n    // Get the name of the placeholder\
    \ to bind\n    string placeholderName = this.PlaceholderToBind;\n\n    // Are\
    \ local attachments allowed?\n    string allowLocalAttachments = (!m_resourceGalleryOnly).ToString();\n\
    \n    StringBuilder script = new StringBuilder();\n\n    // Specify the name of\
    \ the placeholder that we are adding the attachment to\n    script.Append(\"MAPH_DestPH\
    \ = \\\"\" + placeholderName + \"_\" + i.ToString()\n                 + \"\\\"\
    ;\");\n\n    // Launch the Insert Attachment Dialog\n    script.Append(\"WBC_launchAttachmentGallery(\\\
    \"\"\n        + \"wbc_purpose=Basic&\"\n        + \"NRMODE=Unpublished&\"\n  \
    \      + \"WBCMODE=PresentationUnpublished&\"\n        + \"FRAMELESS=true\" +\
    \ channelGUID + \"&\"\n        + \"NRNODEGUID=\" + postingGUID + \"&\"\n     \
    \   + \"\\\" + placeholderName + \\\"\\\",\"\n        + \"ThinEditIE,\"\n    \
    \    + allowLocalAttachments.ToLower() + \",\"\n        + \"true,\"\n        +\
    \ \"false);\");\n\n    script.Append(\"return false\");\n\n    return script.ToString();\n\
    }\n```\n```\n\n# Returning Values from the Dialog\n\nThe Insert Attachment dialog\
    \ allows the author to specify the attachment and its display text. It's not a\
    \ modal dialog. Therefore, in order for content to be written back to the placeholder\
    \ control, the dialog accesses client-side functions within the calling window.\n\
    \nDepending on the chosen placeholder type, Web Author prepares different client-side\
    \ routines. The \"ThinEditE\" placeholder type used in this example calls the\
    \ WBC_setThinEditIEAttachment() method found within the AuthorFormClientIE.js\
    \ script (located in the `<install directory>\\Microsoft Content Management Server\\\
    IIS_CMS\\WebAuthor\\Client\\PlaceholderControlSupport\\` directory).\n\nWe need\
    \ to modify the WBC_setThinEditIEAttachment() routine to update the authoring\
    \ table with the attachment's icon, display text, and URL. The tricky part is\
    \ doing so without modifying the original code (or we will cross Microsoft support\
    \ boundaries, plus not modifying the original file safeguards the code from being\
    \ overwritten when future service packs are applied). As a workaround, we will\
    \ create a modified version of the method and add it to the page. When the"
