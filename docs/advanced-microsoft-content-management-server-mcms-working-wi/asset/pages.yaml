  md: "```\n_sgmlReader.Read();\n// loop through the SgmlReader until the end of the\
    \ stream\nwhile(!_sgmlReader.EOF)\n{\n    // add a node to the XML text writer\n\
    \    _xmlTextWriter.WriteNode(_sgmlReader, true);\n}\n\n// cleanup the XML text\
    \ writer\n_xmlTextWriter.Flush();\n_xmlTextWriter.Close();\n\n// Replace non-breaking\
    \ spaces (&nbsp;) with spaces\n// as InfoPath escapes these in placeholders.\n\
    string strCleanedXHTML = _stringWriter.ToString().Replace(\"&amp;nbsp;\", \" \"\
    );\n\n// Remove the surrounding <html> tag by using an XmlDocument\n// Create\
    \ a new XmlDocument and load in the clean XHTML\nXmlDocument _tempDocument = new\
    \ XmlDocument();\n_tempDocument.LoadXml(strCleanedXHTML);\n\n// Get the html node\
    \ and return the inner XML\nreturn _tempDocument.SelectSingleNode(\"/html\").InnerXml;\n\
    ```\n\n3. Now we are able to create well-formed XHTML from HTML stored in an HtmlPlaceholder,\
    \ we can populate the XmlNode property that the placeholder content will be stored\
    \ in for use by InfoPath.\n\n```\n/// <summary>\n/// Create an XHTML XmlNode from\
    \ \"badly formed\" HTML\n/// </summary>\n/// <param name=\"BadlyFormattedHtml\"\
    >The badly formed HTML string</param>\n/// <returns>XHTML XmlNode representation\
    \ of input HTML</returns>\npublic XmlNode LoadXHTML(string BadlyFormattedHtml)\n\
    {\n    // Create a temporary XmlDocument object to generate nodes\n    System.Xml.XmlDocument\
    \ tempDocument = new System.Xml.XmlDocument();\n\n    // Create a wrapper node\
    \ for the data so InfoPath will correctly detect\n    // the XHTML content\n \
    \   System.Xml.XmlElement theNode =\n        (System.Xml.XmlElement)tempDocument.CreateNode(\n\
    \            System.Xml.XmlNodeType.Element, \"theNode\", \"\");\n\n    // Create\
    \ a \"RichText\" element in the XHTML namespace\n    System.Xml.XmlElement theRichText\
    \ = (System.Xml.XmlElement)\n        tempDocument.CreateNode(System.Xml.XmlNodeType.Element,\
    \ \"RichText\",\n            \"http://www.w3.org/1999/xhtml\");\n\n    // Clean\
    \ the badly formed HTML and set the inner XML of the RichText node\n    theRichText.InnerXml\
    \ = CleanHtml(BadlyFormattedHtml);\n\n    // Append the RichText node to the wrapper\
    \ node\n    theNode.AppendChild( theRichText );\n\n    //Return the wrapper element.\n\
    \    return theNode;\n}\n```"
