    # Executing the Deployment


    Now that we have our cabinet file, let''s deploy it to our SharePoint server.


    > If you are developing on a remote workstation, copy the cabinet file to your
    server before following the steps below.


    We will deploy it using stsadm.exe, which you will find under <local_drive>\Program
    Files\Common Files\Microsoft Shared\Web Server Extensions\60\bin\.


    Start a DOS command prompt, and enter the following commands:


    ```

    cd "C:\Program Files\Common Files\Microsoft Shared\web server extensions\60\BIN"

    ```


    ```

    STSADM.EXE -o addwppack -filename "C:\Documents and Settings\Administrator\My
    Documents\Visual Studio Projects\ExtensibleMCM SPageListingWebPartDeployment\Debug\ExtensibleMCM
    SPageListingWebPartDeployment.cab" -globalinstall -force

    ```


    The Path C:\Documents and Settings\Administrator\My Documents\Visual Studio Projects\
    may need to change depending on where you have created the project.


    If the Web Part was successfully deployed, you should see:


    ```

    ExtensibleMCM SPageListingWebPartDeployment.cab: Deploying to http://server/.

    Operation completed successfully.

    ```


    > When you compile the deployment project in Release mode, the command line will
    change to:

    > STSADM.EXE -o addwppack -filename C:\Documents and Settings\Administrator\My
    Documents\Visual Studio Projects\ExtensibleMCM SPageListingWebPartDeployment\Release\ExtensibleMCM
    SPageListingWebPartDeployment.cab" -globalinstall -force'
