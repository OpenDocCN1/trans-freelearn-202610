- pgno: 415
  md: '![](img/442e26bf28f2df81fbf8dff3478f88e3_415_0.png)


    The feed we are generating is an RSS 2.0-compatible feed. If you want to transform
    the feed into another type, for instance a Podcast compatible feed, you can leverage
    FeedBurner (www.feedburner.com), which provides this sort of conversion functionality.


    # Aggregating an RSS Feed into MCMS


    For the next example, we will create a placeholder control that will allow users
    to enter the URL of an RSS feed and aggregate the contents into a posting.


    # Creating the Placeholder Control


    To create the RSS aggregation placeholder control, we will create a new placeholder
    in the TropicalGreenControlLib project.


    +   1. Load the Tropical Green solution in Visual Studio .NET.

    +   2. Right-click on the TropicalGreenControlLib project and select Add | Add
    Class.

    +   3. Name the new class RssReaderPlaceholderControl.cs and click OK.

    +   4. Import the following namespaces:


    ```

    using System;

    using System.Net;

    using System.Text;

    using System.Xml;

    using System.Web;

    using System.Web.UI;

    using System.Web.UI.WebControls;

    using Microsoft.ContentManagement.Publishing;

    using Microsoft.ContentManagement.Publishing.Extensions.Placeholders;

    using Microsoft.ContentManagement.WebControls.Design;

    using Microsoft.ContentManagement.WebControls;

    ```'
