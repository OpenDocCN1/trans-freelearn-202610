  md: "At the same time, we want to supply the URLs for hyperlinks surrounding channel\
    \ display names. For channels, the URLs point to `default.aspx?QueryStringModeUnpublished`,\
    \ and postings won't be clickable so the Href property of their surrounding `<A>`\
    \ tags will be left blank.\n\nWe could change our script to iterate through each\
    \ object one by one and add these additional columns to a DataTable before binding\
    \ it to the DataGrid. However, that would mean changing our code. The good news\
    \ is that we don't have to rewrite the code. We can implement the `DataGrid1_ItemDataBound`\
    \ event handler to populate columns with custom values depending on whether the\
    \ object is a channel or a posting.\n\nFirst, add a new TemplateColumn to the\
    \ DataGrid:\n\n```\n```aspx\n<Columns>\n  <asp:TemplateColumn>\n    <ItemTemplate></ItemTemplate>\n\
