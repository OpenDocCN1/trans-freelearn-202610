- pgno: 474
  md: '# Tip #4: How to Deal with Links to Deleted Resources


    In a typical organization, different teams work on different aspects of the same
    website. You could have a group of people whose responsibility lies in posting
    articles and stories (authors, editors, and moderators), and a different group
    in charge of graphics, pictures, and the overall design (resource managers and
    template designers). Inevitably, somewhere along the way, someone is going to
    delete a resource from a resource gallery. Should that resource be used by a posting
    on a production site, many problems occur.


    Earlier, we built a recycle bin to store deleted postings that can be recovered
    later. Why not build a similar solution for resources? Like postings and channels,
    resources deleted from the Resource Manager dialog on Web Author are permanently
    removed from the system. However, unlike postings, there is no immediate way to
    prevent anyone from deleting resources. There isn''t an event handler that you
    can capture. The PAPI does not provide any way to move resources between galleries.
    As a result, it is not possible to build a recycle bin for resources. The most
    you can do to prevent accidental deletes is to remove the Delete Resource button
    from the dialog altogether; a drastic action to correct the problem.


    One of our resource managers has accidentally deleted a resource. We know that
    the resource is still somewhere in the system, as our Administrator can view it
    from the posting. We can''t upload the resource again as that would mean creating
    a new resource with a new GUID and URL. Retrieving the content from backup is
    not possible. What can we do to recover it?


    Once deleted, a resource is typically not recoverable. Microsoft now provides
    a feasible option: if you need to recover deleted resources that have not been
    purged out of the system by the background process, you can open a support case
    (reference number: SOX040517700117) to obtain a stored procedure. The stored procedure
    will restore these deleted resources back to the Deleted Items bin in Site Manager.
    Administrators can then move them back to the appropriate resource galleries.


    # What Happens When Resources Used by Postings Get Deleted


    For starters, images will show up as broken. Links to attachments will lead to
    HTTP 404 Page Not Found or HTTP 401 Authentication Required errors. That''s not
    all! Authors will not be able to save pages with links to deleted resources. When
    they try to do so, they will get the following error:


    Save Placeholder Failed

    --------------------------------

    Error Details:

    The current user does not have rights to edit the requested item. If you are seeing
    this exception when a MCMS template is executing, it means that you have removed
    the CmsAuthorizationModule from the HttpModules section of your web.config. You
    can only remove this module if: 1. All requests for every MCMS template in the
    web application will only'
