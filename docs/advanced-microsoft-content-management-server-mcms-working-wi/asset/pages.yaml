- pgno: 126
  md: '# Preparing Postings for Search Indexing


    The MetaTags user control we have just created could also be enhanced to output
    the posting description and custom properties as META tags.


    > You can use the same technique to add placeholder content to META tags. The
    MCMS Connector for SharePoint Technologies contains the customizable SearchMetaTagGenerator
    server control to generate META tags from properties and custom properties. This
    control is discussed in Chapter 5.


    # Configuring Templates to Allow Postings to Return Accurate Last Modified Time


    Because postings are dynamically constructed, correct information about a posting''s
    last modified date would always reflect the current date and time. Therefore,
    search engines can''t perform incremental crawls of MCMS sites, and would always
    run a full crawl.


    Consider the case of a website that uses the search component of SharePoint Portal
    Server. When SharePoint Portal Server performs an incremental index crawl, it
    sends HTTP GET requests for every page on the site it comes in contact with. If
    it finds a page that has previously been indexed, SharePoint will update its entry
    in the index only if the page was modified since the last index job. To decide
    whether or not a page has been modified, SharePoint sends a conditional HTTP GET
    request, which is a request that includes an `If-Modified-Since` HTTP header with
    the date and time the page was last modified. If the page has not been modified,
    the response will be an HTTP status code 304 (not modified) and SharePoint will
    not index the page. Should the response be HTTP status code 200 (OK), it means
    that the page has been updated and SharePoint will proceed to index it. This concept
    works well for static websites made up of physical files, where the last modified
    date reflects the actual date the page was modified.


    However, because its pages are assembled on the fly, IIS will always assume that
    the last modified date of postings is the current date and time. Since the date
    stored in the `If-Modified-Since` HTTP header will always be an earlier date,
    IIS always returns a status code 200 (OK) without sending a last modified date.
    Therefore, the site will never be incrementally crawled by SharePoint Portal Server,
    and it will effectively undergo a full index every time. This behavior is seen
    in all search engines that make use of the `If-Modified-Since` HTTP Header to
    perform incremental crawls.


    Obviously this isn''t an ideal situation for the performance of a search engine''s
    indexing process, nor is it performance-friendly for the MCMS site. In the case
    of our Tropical Green site, the impact is minimal because the overall number of
    postings is very low. However, consider a site containing 10,000 postings in which
    only 10% have changed since the last crawl. Instead of crawling and indexing 1,000
    pages, SharePoint Portal Server indexes ten times more content than necessary.


    To solve this issue, we need to modify our templates to return the actual time
    the posting was modified with the HTTP status code of 200; if the posting hasn''t
    changed since the last crawl, we should return a HTTP status code of 304. Here''s
    how we''ll do this:


    +   1. Get the last modified date of the posting was modified.

    +   2. Get the time returned by the HTTP `If-Modified-Since` Header and convert
    it to UTC to negate any effect of time zones.'
  merge: -1
  img_proc: true
