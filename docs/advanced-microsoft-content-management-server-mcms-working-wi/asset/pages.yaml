  md: '![](img/442e26bf28f2df81fbf8dff3478f88e3_447_0.png)


    Click on the Revert Posting link and the Page Revert dialog that we have created
    opens. Select the Revert button on any revision to revert the posting. If all
    goes well, the following message appears on the screen: Page Revert Succeeded.
    It must be approved before changes take effect and the posting in the parent window
    refreshes to display the latest updates. Close the dialog. Go ahead and approve
    the posting to publish the changes.


    > Instead of automatically reverting all placeholder content, you could enhance
    the dialog to provide authors with the option of selecting which placeholders
    they would like to roll back.


    # Tip #2: How to Change a Posting''s Template


    The way to go about creating postings with MCMS out of the box is to first select
    the template, fill in the placeholder content of the posting and publish it. What
    happens should the author mistakenly select the wrong template? Some templates
    may look deceptively similar and the author, not knowing that the template wasn''t
    the right one to begin with, may well publish it anyway.


    Or perhaps requirements have changed. To minimize disruption to the current site,
    a new template co-existing with the current template was built. The time has come
    to re-launch the site and a sizable number of postings need to switch to the new
    template. How could the job be accomplished with minimal effort on the part of
    authors or developers?


    According to the documentation, you would have found that the Template property
    of the posting object is a read-only field. Once a posting has been created, the
    link between the template and the posting is immutable; there is no simple way
    to get the posting to use another template.


    To get around this constraint, we can choose to:


    +   - Continue using the current template but overwrite the existing placeholder
    definitions, custom property definitions, or template file values.


    Amending the existing template is the simplest solution and should be considered
    whenever possible. However, in the case of the author choosing the wrong template,
    you really need to get the posting to point to another template. It also means
    that any changes to the template will be seen immediately on the server—not a
    good scenario if you are updating the template on a production machine. In such
    cases, amending the existing template is probably not the best idea.'
