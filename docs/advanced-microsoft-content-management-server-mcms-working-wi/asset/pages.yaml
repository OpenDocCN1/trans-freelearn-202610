- pgno: 368
  md: 'The user will be able to launch a single InfoPath form and select the posting
    they wish to modify, which can be based on any MCMS template. A Web service call
    will then be made that loads the posting, placeholders, and custom properties
    from the MCMS repository, using the MCMS Publishing API (PAPI). The InfoPath form
    will then be populated with this data so the user can make their modifications
    to the content. Once the changes are complete they can then be sent back to the
    ASP.NET Web service and saved to MCMS.


    For simplicity the solution outlined in this chapter will only permit editing
    of HtmlPlaceholders and Text custom properties of existing postings, but it could
    be extended to create new postings, use different types of placeholders, and to
    set selection custom properties. For further enhancement ideas, see the Possible
    Enhancements to this Solution section at the end of the chapter.


    The form we will create retrieves and displays the posting and template details,
    and allows modifications to the custom properties and placeholders. The placeholders
    will use InfoPath''s rich text control that allows formatting of the content.
    A bonus of this solution is that all placeholder content will be transformed into
    XHTML (Extensible HyperText Markup Language, which at its most basic level is
    HTML that conforms to XML standards) as InfoPath''s data is stored in XML.


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_368_0.png)'
