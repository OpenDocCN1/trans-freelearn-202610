  md: "# Useful Placeholder Controls\n\n```\n```csharp\nprotected override void LoadPlaceholderContentForPresentation(\n\
    \                                      PlaceholderControlEventArgs e)\n{\n   \
    \ EnsureChildControls();\n\n    // Get the current CmsHttpContext\n    CmsHttpContext\
    \ cmsContext = CmsHttpContext.Current;\n\n    // Get an instance of the selected\
    \ resource gallery\n    string xml = ((XmlPlaceholder)this.BoundPlaceholder).XmlAsString;\n\
    \    m_resourceGalleryPath = GetResourceGalleryPath(xml);\n\n    ResourceGallery\
    \ rg = cmsContext.Searches.GetByPath(m_resourceGalleryPath)\n                \
    \             as ResourceGallery;\n}\n```\n```\n\nOnce we have an instance of\
    \ the resource gallery, a random number is generated. Again, we will write a helper\
    \ function, RandomNumberGenerator(), to pick a number from zero to one less than\
    \ the number of resources in the gallery:\n\n```\n```csharp\nprivate int RandomNumberGenerator(int\
    \ max)\n{\n    // generate a random number\n    int seed;\n    int index = 0;\n\
    \    seed = (int)System.DateTime.Now.Ticks % System.Int32.MaxValue;\n    System.Random\
    \ rand = new System.Random(seed);\n    index = rand.Next(0,max);\n\n    return\
    \ index;\n}\n```\n```\n\nNext, we get the resource that corresponds to the randomly\
    \ chosen index. Modify the LoadPlaceholderContentForPresentation() method as shown\
    \ below:\n\n```\n```csharp\nprotected override void LoadPlaceholderContentForPresentation(\n\
    \                                      PlaceholderControlEventArgs e)\n{\n   \
    \ . . . code continues . . .\n\n    if (rg != null)\n    {\n        // Randomly\
    \ select a resource from the gallery\n        int indexOfResource = RandomNumberGenerator(rg.Resources.Count);\n\
    \        Resource r = rg.Resources[indexOfResource];\n    }\n}\n```\n```\n\nTo\
    \ determine the file's type, we check its MIME type (Multipurpose Internet Mail\
    \ Extensions type). MIME types are used by the browser to determine how content\
    \ should be displayed. For example, a file with the MIME type `applications/x-shockwave-flash`\
    \ will be played within a Flash player instead of being displayed as an image\
    \ or text. The exact value returned by the Resource.MimeType property depends\
    \ on the server's registry."
