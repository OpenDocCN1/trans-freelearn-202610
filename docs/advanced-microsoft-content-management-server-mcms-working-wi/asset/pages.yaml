  md: "browser sees two JavaScript methods with the same name, one defined in within\
    \ the page and a second in a separate *.js file, the browser will choose to run\
    \ the one embedded within the page.\n\nTo begin, let's take a look at the original\
    \ WBC_setThinEditIEAttachment() routine shown below. It accepts three input parameters:\n\
    \n+   - The name of the placeholder that's accepting the attachment\n+   - The\
    \ URL of the uploaded attachment\n+   - The display name of the attachment\n\n\
    It uses the URL and display name of the attached file to construct an HTML anchor\
    \ tag. The anchor tag is added to the placeholder by calling the insertHtml()\
    \ method of the placeholder’s DOM. Don't worry about typing in the code for now.\
    \ We will be writing a server-side function to generate this script on the fly\
    \ later.\n\n```\nfunction WBC_setThinEditIEAttachment(strPhName, strURL, strDispText)\n\
    {\n    var strMyDispText = strDispText;\n    if (strMyDispText == \"\")\n    {\n\
    \        strMyDispText = strURL;\n    }\n\n    document.all[\"NCPHRICH_\" + strPhName].insertHtml(\"\
    <a href=\\\"\" + strURL\n                                             + \"\\\"\
    >\" + strMyDispText + \"</a>\");\n}\n```\n\nWhile the WBC_setThinEditIEAttachment()\
    \ method works perfectly for regular HtmlPlaceholderControls, in order for it\
    \ to function correctly within the MultipleAttachmentPlaceholderControl, we need\
    \ to make several modifications:\n\n+   - The method calls an object with an ID\
    \ of NCPHRICH_(PlaceholderName); our custom control has a different naming convention\
    \ and executing this line of code will result in an error.\n+   - Instead of inserting\
    \ an entire anchor tag in an HtmlPlaceholderControl, we need to pass information\
    \ about the attachment back to the appropriate hidden fields and cells within\
    \ the table in the multiple attachment placeholder control.\n\n# Client-Side Script\
    \ for All Types of Placeholder Controls\n\nLet's tackle the first problem. By\
    \ default, the WBC_setThinEditIEAttachment() method works only with the out-of-the-box\
    \ placeholder controls. Placeholder controls that ship with MCMS have IDs prepended\
    \ with the text NCPHRICH to differentiate them from custom controls that we build.\
    \ Our control does not have the ID of NCPHRICH_(PlaceholderName). As a result,\
    \ the following line of code will lead to \"document.all[...] is null or not an\
    \ object\" errors when the dialog is used with custom controls.\n\n```\ndocument.all[\"\
    NCPHRICH_\" + strPhName].insertHtml(\"<a href=\\\"\" + strURL\n              \
    \                           + \"\\\">\" + strMyDispText + \"</a>\");\n```\n\n\
    On the other hand, we can't remove the line of code entirely as there may be some\
    \ out-of-the-box placeholder controls on the same page that require it. To get\
    \ around this, we will wrap the line in a check to see if the object is undefined\
    \ (which will be the case for the multiple"
