  md: '# The Recycle Bin Dialog


    The Recycle Bin dialog lists all the postings that have been deleted. It''s a
    relatively simple form, consisting of a DataGrid and a few Label controls.


    Add a new web form named RestorePosting.aspx to the project (if you are working
    on the Tropical Green project, add it to the Dialogs folder). Set the Page Layout
    to FlowLayout.


    Open the form in HTML view and add a level-1 header that says Recycle Bin and
    a button that closes the dialog.


    ```

    <form id="RestorePosting" method="post" runat="server">

    <h1>Recycle Bin</h1>

    <input type="button" value="Close" onclick="window.close();">

    </form>

    ```


    Toggle to Design view. Drag and drop the following controls onto the form and
    arrange them as shown in the following diagram.


    | Control | Property | Property Value |

    |---|---|---|

    | DataGrid | ID | dgDeletedItems |

    |  | AutoGenerateColumns | False |

    | Label | ID | lblMessage |

    |  | Text | (empty string) |

    | Button | ID | btnEmpty |

    |  | Text | Empty Bin |


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_467_0.png)


    Switch back to HTML view and add three columns to the DataGrid. The first column
    contains the GUID of the deleted posting. The second column displays its name
    and hyperlinks it to its URL. The last column provides the Restore button to reinstate
    the posting.


    ```

    <form id="RestorePosting" method="post" runat="server">

    <h1>Recycle Bin</h1>

    <asp:datagrid id="dgDeletedItems" Runat="server" AutoGenerateColumns="False">

    ```'
