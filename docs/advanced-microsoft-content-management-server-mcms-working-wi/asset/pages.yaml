    \":0.5,\"\n            + \"\\\"urn:schemas-microsoft-com:sharepoint:portal:profile:PreferredName\\\
    \"\\\":0.2,contents:0.1,*\\\":0.05) \"\n            + \"AS #WeightedProps, \"\n\
    \            \"FREETEXT(#WeightedProps, \\\"\" + keywords.ToString().Trim() +\
    \ \"\\\")\"\n        );\n    }\n    #endregion\n\n    #region FILTER: sps source\
    \ group\n    // filter source group\n    whereClause.Add(string.Format(\"{0}\"\
    ,\n        \"(\\\"urn:schemas.microsoft.com:fulltextqueryinfo:Sourcegroup\\\"\
