  md: "# Hiding the Web User Control in Published Mode\n\nWe want the control to be\
    \ visible only in authoring mode. We first check the current Web Author Context\
    \ mode to see if it is either AuthoringNew or AuthoringReedit. If it is, we show\
    \ and enable the control, otherwise we hide it. Within the Page_Load() event handler,\
    \ add the code shown below.\n\n```\nprivate void Page_Load(object sender, System.EventArgs\
    \ e)\n{\n    ... code continues ...\n    // Get the current Web Author Context\
    \ mode\n    WebAuthorContextMode webauthorMode = WebAuthorContext.Current.Mode;\n\
    \    // Set the control to be visible only in authoring modes\n    bool displayControl\
    \ = false;\n    if (webauthorMode == WebAuthorContextMode.AuthoringNew\n    ||\
    \ webauthorMode == WebAuthorContextMode.AuthoringReedit)\n    {\n        displayControl\
    \ = true;\n    }\n    this.Visible = displayControl;\n}\n```\n\n# Capturing the\
    \ Posting's Save Event\n\nWhen the posting is saved, we want the contents of the\
    \ TextBox to be written to the DisplayName property of the posting. The tricky\
    \ part is capturing the save event. The good news is, you can make use of the\
    \ SavePostingEvent() event handler of the WebAuthorContext class. All we need\
    \ to do is to write our own event (named saveDisplayName(), which we will define\
    \ later) of type WebAuthorPostingEventHandler and register it with the SavePostingEvent()\
    \ handler. The following code shows how this is done within the OnInit() event\
    \ handler. Add the highlighted portion to OnInit(). You may have to expand the\
    \ region, Web Form Designer generated code, to see it.\n\n```\noverride protected\
    \ void OnInit(EventArgs e)\n{\n    InitializeComponent();\n    base.OnInit(e);\n\
    \    // Register new event being called during save\n    WebAuthorContext.Current.SavePostingEvent\
    \ += new\n    WebAuthorPostingEventHandler(saveDisplayName);\n}\n```\n\nFinally,\
    \ we write the saveDisplayName() method that saves the display name of the posting.\
    \ We simply set the posting's DisplayName property with the contents of the TextBox.\n\
    \nBeing an event of type WebAuthorPostingEventHandler, the saveDisplayName() method\
    \ accepts two arguments:\n\n+   - object sender contains the object that triggered\
    \ the save. In this case, the sender is either the Save, Save and Exit, or Save\
    \ New Page button, depending on which was clicked by the author.\n+   - WebAuthorPostingEventArgs\
    \ e contains the data about the event. The most significant piece of information\
    \ provided is the posting that is currently being saved.\n\nAdd saveDisplayName()\
    \ directly below the OnInit() event handler."
  merge: -1
  img_proc: true
- pgno: 492
  md: "```\n// The event handler that saves the contents of the TextBox to the posting's\n\
    // DisplayName property\nprivate void saveDisplayName(object sender, WebAuthorPostingEventArgs\
    \ e)\n{\n    e.Posting.DisplayName = txtDisplayName.Text.Trim();\n}\n```\n\nThe\
    \ control is complete. To use the control, simply drag and drop it onto any template\
    \ file that requires it. In this example, we have chosen to save only the display\
    \ name of the posting. You could easily extend the control to work with all other\
    \ properties and custom properties of the posting.\n\n> If you need to re-use\
    \ the code across projects, it is more efficient to use a server control instead\
    \ of a web user control. Here's an example of such a control:\n> \n> http://www.gotdotnet.com/Community/UserSamples/Details.aspx?SampleGuid=2A85D442-286F-4AD6-8A03-82436BF956A5\n\
    \n# Tip #7: How to Re-write Unfriendly URLs as Friendly URLs\n\nMCMS, as you probably\
    \ know, uses an internal system of \"unfriendly URLs\" in order to retrieve both\
    \ the template file and the posting. Visitors to the site typically don't see\
    \ these unfriendly URLs, except:\n\n+   - When toggling between Edit Site and\
    \ Live Site views.\n+   - After performing a postback to the server. For example,\
    \ the template file could have a button that refreshes certain labels on the page.\
    \ When the button is clicked, a postback occurs and the URL on the address bar\
    \ changes from a friendly URL to the unfriendly version.\n+   - When the site\
    \ has been configured to use unique ID-based URLs.\n+   - When displaying a page\
    \ within a frameset.\n\nUnfriendly URLs are a composition of the URL of the template\
    \ file and information about the posting appended in its querystring:\n\n```\n\
    http://localhost/TropicalGreen/Templates/Plant.aspx?NRMODE=Published&NRORIGINALURL=%2fNR%2fexeres%2f0E0047A0-1560-4BA8-859F-C012826391F0%2cframeless%2ehtm%3fNRMODE%3dPublished&FRAMELESS=true&NRNODEGUID=%7b0E0047A0-1560-4BA8-859F-C012826391F0%7d&NRCACHEHINT=ModifyLoggedIn\n\
    ```\n\nSometimes, it could appear in a slightly simpler form:\n\n```\nhttp://localhost/NR/exeres/0E0047A0-1560-4BA8-859F-C012826391F0,frameless.htm?NRMODE=Published\n\
    ```\n\nBut behind the scenes, MCMS still sees the complex version.\n\nBoth URLs\
    \ really point to the same page, say\n\n```\nhttp://localhost/tropicalgreen/plantcatalog/coconut.htm\n\
    ```\n\nbut you can't tell just by looking at them."
