- pgno: 197
  md: 'document properties, but only InfoPath and WordML files are XML and can be
    transformed with a content stylesheet. You specify the stylesheet you want to
    use in the transformation in the Placeholder Properties dialog we just encountered
    when adding a document. The Connector ships with default stylesheets that we''ve
    already used. These stylesheets are found at C:\Program Files\Microsoft Content
    Management Server\Server\IIS_CMS\WssIntegration\Dialogs\WssDocumentFinder\TemplateCatalog\.
    The default stylesheets included with the Connector are listed in the table below:


    | Stylesheet Name | Description |

    |---|---|

    | AttachmentIcon.xsl | Displays the document as an icon attachment. Available
    only if the file attached is a document. |

    | AttachmentIconProps.xsl | Displays the document as an icon attachment with its
    properties. Available only if the file attached is a document. |

    | ImageTagOnly.xsl | Displays the image inline. Available only if the file attached
    is an image. |

    | ImageAndProps.xsl | Displays the image inline with its properties. Available
    only if the file attached is an image. |


    The table above is based on documentation found in the Microsoft Content Management
    Server 2002 Connector for SharePoint Technologies help file, included with the
    Connector.


    The SharePoint Document Placeholder looks at a single XML file to determine what
    stylesheets are available for the different types of files that can be attached
    to the placeholder. This file, catalog.xml, can be found in the same directory
    as the stylesheets outlined above. The catalog.xml file contains the following
    information on each of the available styles:


    +   - Types of files the stylesheet can be applied to, such as jpg, gif, contentxml,
    or all (noted with an *)

    +   - Descriptive name shown in the dropdown of the Placeholder Properties dialog

    +   - Description of the stylesheet

    +   - URL specifying the location of the XSL stylesheet used in the transformation

    +   - A sample rendering URL, which is an XML file used to mimic the XML feed
    sent to the placeholder when a document is attached, giving the user a preview
    of the final rendering


    In addition, you can also use a specific library that the stylesheet can be applied
    to using the SpecificWebUrl and SpecificLibrary attributes in the type node of
    the catalog.xml file. Use the SpecificWebUrl attribute to indicate which WSS or
    SPS site and the SpecificLibrary attribute to indicate the name of the WSS or
    SPS library to which the stylesheet can be applied.


    You can create your own catalog.xml file for a specific SharePoint Document Placeholder
    implementation in order to restrict or provide certain rendering options for that
    library. Simply create a new XML file that conforms to the catalog.xsd schema
    definition file (found in the same directory as the catalog.xml and stylesheets)
    and specify this file in the HTML of your MCMS template that implements the SharePoint
    Document Placeholder using the'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'RenderingTemplateCatalogUrl attribute and specifying the virtual path to your
    catalog file. For example, if you created a new catalog called mycatalog.xml,
    the SharePoint Document Placeholder would look like this in the MCMS template
    file:


    ```

    <cc1:SharePointDocumentPlaceholderControl id="SharePointDocumentPlaceholderControl"
    runat="server" KeepSynchronized="False" PlaceholderToBind="SPDdocument" RenderingTemplateCatalogUrl="mycatalog.xml">

    </cc1:SharePointDocumentPlaceholderControl>

    ```


    # Limitations of the MCMS Connector for SharePoint


    Unfortunately the Connector only provides you one way to publish SharePoint content
    in an MCMS site: the SharePointDocumentPlaceholder, which we just covered. But
    SharePoint portals can contain much more content than just document libraries.
    Some of the most commonly used content elements in SharePoint are lists. SharePoint
    ships with many different types of configured lists such as Issues, Tasks, Links,
    Events, and also Custom Lists. These lists are very dynamic, powerful, and customizable
    as they can be built from the ground up. One of the biggest downsides of the Connector
    is it does not provide a method to publish SharePoint list data in an MCMS website.


    It would be useful to have an MCMS placeholder control that can display data from
    a SharePoint list. Since this isn''t included in the Connector, let''s build our
    own!


    We''ll continue with our previous examples using our Tropical Green MCMS Internet
    site http://www.tropicalgreen.net/TropicalGreen/ and the Tropical Green SharePoint
    Portal Server intranet portal http://portal.tropicalgreen.net/. Let''s say we
    have an Events Web Part list in our SharePoint portal intranet that employees
    maintain for all Tropical Green related events:


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_198_0.png)


    # How do I add items to my Events list?


    To add, edit, or view the items in your portal''s Events list, click Manage Content
    in the left-hand Actions menu from your portal homepage. On the Documents and
    Lists page, click the Events link. You may or may not have items listed in your
    list. To add items, click the New Item link in the list heading, enter the necessary
    information, and click the Save and Close link in the form heading. Repeat this
    process as many times as you like.


    Now, what we''d like to do is display all these events on our homepage. We''ll
    build a custom placeholder control that will retrieve these events from the SharePoint
    list. This custom'
