    In presentation view, the selected date and time appears on screen.


    15 Apr 2005 23:33


    To make it almost impossible for invalid dates to be saved in the database, the
    contents of date-time picker control are usually validated before being saved.


    MCMS does not ship with a date-time picker placeholder control, so let''s build
