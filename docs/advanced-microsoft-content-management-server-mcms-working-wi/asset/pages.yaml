- pgno: 427
  md: "```\nthis.basePresentationControl.ID = \"PresentationControl\";\n// Add the\
    \ base presentation control to\n// the presentation container\npresentationContainer.Controls.Add(this.basePresentationControl);\n\
    }\n```\n\nTo load the RSS feed and output the items using the placeholder control,\
    \ we will override the LoadPlaceholderContentForPresentation() method. The feed\
    \ will not be rendered in \"Presentation Unpublished\" mode for authoring efficiency.\n\
    \nTo minimize the hit to the feed provider, we will implement content caching\
    \ for our placeholder control. This means even if several users request the posting\
    \ containing the RssReaderPlaceholderControl within the configured timeframe,\
    \ only one web request will hit the feed site. This minimizes traffic and processing\
    \ overhead for the feed site and as well the website holding this placeholder\
    \ control.\n\nThe cache duration is currently hardcoded to five minutes. If you\
    \ need this to be more flexible, you can either store the cache duration in the\
    \ Web.config or add a textbox to the authoring mode that captures the cache duration\
    \ and saves it as additional configuration value for the XmlPlaceholder.\n\n```\n\
    /// <summary>\n/// Load and parse the RSS feed. Output the feed\n/// items to\
    \ the basePresentationControl\n/// </summary>\n/// <param name=\"e\"></param>\n\
    protected override void\nLoadPlaceholderContentForPresentation(PlaceholderControlEventArgs\
    \ e)\n{\n    // Verify the child controls have been created\n    EnsureChildControls();\n\
    \n    try\n    {\n        // Check the current mode\n        if (WebAuthorContext.Current.Mode\
    \ ==\n            WebAuthorContextMode.PresentationUnpublished)\n        {\n \
    \           this.basePresentationControl.Text =\n                \"Feed will be\
    \ shown in published mode\";\n        }\n        else\n        {\n           \
    \ // Load the settings from the XML\n            this.LoadSettingsFromXml(this.BoundXmlPlaceholder.XmlAsString);\n\
    \n            // Get the current Cache object from HttpContext\n            System.Web.Caching.Cache\
    \ cache = HttpContext.Current.Cache;\n\n            // we will vary the cache\
    \ entry by the content of the\n            // current placeholder object. This\
    \ will ensure that different\n            // feeds can be served from the same\
    \ website\n            string CacheKey = this.BoundXmlPlaceholder.XmlAsString;\n\
    \n            // check if content is already in Cache\n            string cacheXml\
    \ = cache[\"RssReader.\" + CacheKey] as string;\n            if (cacheXml == null)\n\
    \            {\n```"
