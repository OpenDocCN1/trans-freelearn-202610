- pgno: 215
  md: '# Building SharePoint Web Parts


    In the previous chapters, we have looked at some different ways of integrating
    MCMS and SharePoint by using custom code and by using the components shipped with
    the MCMS Connector for SharePoint Technologies. One important thing we haven''t
    yet covered is the creation of custom Web Parts for SharePoint to integrate MCMS
    content into a SharePoint site or portal. In this chapter, we will create a configurable
    Web Part that acts as a navigation component for the postings in a specified channel.
    But before we get into the detail of the MCMS Navigation Web Part we are going
    to build, let''s take a look at what Web Parts are.


    Microsoft SharePoint Portal Server (SPS) and Windows SharePoint Services (WSS)
    display content and interactive components within pages called **Web Part Pages**.
    The building blocks that make up these pages are **Web Part Zones** that can consist
    of one or more Web Parts. These Web Parts can be arranged on the Web Part Page
    as desired by a business user with the required privileges.


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_215_0.png)


    A Web Part is a single module that can be arranged on a Web Part Page to provide
    specific functionality such as a calendar. MCMS ships with only three placeholder
    controls whereas SPS and WSS ship with many Web Parts installed for handling announcements,
    contacts, tasks, events, data viewing, and XML. These Web Parts provide a good
    starting point and are easily configured to address most users'' requirements
    without developer intervention.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Building SharePoint Web Parts


    For a variety of reasons, including closer integration, more specific requirements,
    and performance or complexity issues, you may need to create a Web Part from the
    ground up. There are several avenues a developer can take during the early stages
    in the design of a Web Part:


    +   - Configure the out-of-the-box WSS/SPS lists and Web Parts to provide the
    required method of data storage, data input, and presentation

    +   - Develop the Web Part from scratch as an ASP.NET Server Control

    +   - Develop the business logic as a Web Service and use the XML Web Part or
    the DataView Web Part as the GUI

    +   - Develop a separate web form and use an IFrame to integrate the portal and
    your satellite application. Browser compatibility should be considered when using
    this approach

    +   - Design and develop your Web Part as a .NET User Control and leverage generic
    Web Parts such as ''SmartPart'' (http://www.smartpart.info) to host your .NET
    user control


    Each of these approaches has advantages and disadvantages that should be weighed
    up at design time such as ease of development, extensibility, scalability, interoperability,
    deployment, and security. The following table sums these up:


    | Method | Existing Web Parts | Using Web service as business layer with XML Web
    Part / DataView Web Part | User Control integrated with Smart Part | ASP.NET Server
    Control | IFrame to ASP.NET Web Form |

    |---|---|---|---|---|---|

    | Ease of Development | No development required | Simple | Requires knowledge
    of SmartPart but is simply ASP.NET User Control development | Complex | Simple
    |

    | Extensibility | Depends on the functionality provided by the specific Web Part
    | Developer has limited control over the UI but gains FrontPage 2003 as a development
    tool and a separate ASP.NET business layer. | Very Extensible | Very Extensible
    | Very Extensible |

    | Scalability | Scaled with the WSS/SPS server. | End point Web service must be
    scaled as necessary. | Scaled with the WSS/SPS server | Scaled with the WSS/SPS
    server | The framed ASP.NET application must be scaled as necessary. |'
  merge: -1
  img_proc: true
- pgno: 217
  md: '|  |  |  |  |  |

    |---|---|---|---|---|

    | **Interoperability** | Can easily interact with other parts of WSS/SPS | Interacting
    with WSS/SPS objects is more complex but still possible. | Can easily interact
    with other parts of WSS/SPS | Can easily interact with other parts of WSS/SPS
    | Interacting with WSS/SPS objects is more complex but still possible. |

    | **Deployment** | No deployment required for out-of-the-box Web Parts and very
    simple deployment for downloadable Web Parts | No deployment required | Installation
    of the Smart Part Web Part is required. | Complex | Simple |

    | **Security** | No security impact | No SPS/WSS security impact as security will
    be enforced by the ASP.NET Web service | No security impact | Security is enforced
    by SPS/WSS. | Enforced by the ASP.NET Web application |

    | **Notes** | Requires the least amount of development knowledge | Great for .NET
    developers that need to display data external to WSS/SPS in a Web Part Page |
    Allows you to run .NET User Controls as Web Parts. Allows development of a rich
    UI within the Web Part Framework. | Provides the most flexibility during development
    but requires manual definition of the UI. Is executed within the Web Part Framework.
    | Allows a separate ASP.NET Web application to be used via SharePoint |


    Throughout this chapter, we will focus on the ASP.NET Server Control method.


    # The SharePoint MCMS Navigation Control


    During the course of this chapter, we will develop a Web Part as a server control
    by building a Web Part that acts as an MCMS navigation component. The server control
    methodology has been selected as it is the most flexible method. End users with
    WSS/SPS Web Designer rights will be able to add the Web Part to a Web Part Page
    and configure the Web Part by specifying the MCMS Channel. The items in the configured
    MCMS Channel will be rendered in the Web Part using an XSLT (Extensible Stylesheet
    Language Transformations) stylesheet to produce the following display:'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/442e26bf28f2df81fbf8dff3478f88e3_218_0.png)


    To build this Web Part, we''ll perform the following steps:


    +   - Prepare the development environment

    +   - Create the Web Part Project

    +   - Create the Web Part

    +   - Define custom properties for the Web Part

    +   - Develop custom properties for the Web Part

    +   - Build the Data Layer

    +   - Build the Presentation Layer

    +   - Deploy the Web Part


    > The Web Part we are building will run under both SPS and WSS as we will not
    be using any features specific to Microsoft SharePoint Portal Server.


    # Preparing the Development Environment


    To most efficiently develop Web Parts as ASP.NET Server Controls, we need to install
    the Visual Studio .NET templates necessary for Web Parts. These templates don''t
    ship with Visual Studio .NET 2003, but are available for download from the Microsoft
    website at:


    http://www.microsoft.com/downloads/details.aspx?FamilyID=CAC3E0D2-BEC1-494C-A74E-75936B88E3B5&displaylang=en


    During installation of the Web Part templates, you will be prompted for the location
    of Microsoft.SharePoint.dll. This assembly is located in Program Files\Common
    Files\Microsoft Shared\Web Server Extensions\60\ISAPI\ on your SharePoint (WSS/SPS)
    Server. You might need to copy Microsoft.SharePoint.dll to your development PC
    from the server with SPS or WSS installed.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Creating the Web Part Project


    Web Parts should be built using the Web Part Library project. So let''s go ahead
    and create this project.


    +   1. In Visual Studio .NET, select Create New Project (Shift + Ctrl + N).

    +   2. Select the project type as Visual C# Projects, and choose the new Web Part
    Library template from the right-hand pane.

    +   3. Name the new project ExtensibleMCMSPageListingWebPart, and place the project
    directory under My Documents\Visual Studio Projects.

    +   4. Click OK.


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_219_0.png)


    Once our new project is created, we can see a variety of files and references
    that have been created by the template:


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_219_1.png)'
