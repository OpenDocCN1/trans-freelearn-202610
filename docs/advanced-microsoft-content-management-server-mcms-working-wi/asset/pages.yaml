- pgno: 404
  md: 'Update some placeholder values and custom properties from the toolbar at the
    top of the screen and press Submit. If you browse to http://www.tropicalgreen.net/PlantCatalog/AloeVera.htm,
    the updates should now be visible—you may need to switch into Unpublished Mode
    as the changes will require editor approval before going live. When you''re done,
    click Close Preview at the top of the screen and the form will return to design
    mode.


    # Saving the InfoPath Form


    Once development of the InfoPath template is complete, it can be distributed by
    publishing the finished form to a shared location such as SharePoint, a Web server,
    or a network share. Alternatively the template can be saved to the file system
    for modification later.


    To save the template to the local file system, select File | Save, and choose
    Save from the dialog. Then simply enter or browse to a suitable location and click
    Save.


    # Possible Enhancements to this Solution


    Here are some possible enhancements that could easily be incorporated into this
    solution:


    +   - The ability to create new postings by selecting a template.

    +   - Support for Selection Type Custom Properties.

    +   - Support for placeholder objects other than the HtmlPlaceholder.

    +   - Support for pasting images into the rich text box, which must be decoded
    and uploaded to the resource gallery.

    +   - An ability to save for later modification.

    +   - Another view in the InfoPath form that allows the user to list and select
    postings they want to modify.


    # Summary


    Over the course of this chapter, we''ve seen a lot of the power of Microsoft Office
    InfoPath 2003 as we quickly created a flexible content authoring solution utilizing
    its rich UI. At the same time, we were able to maintain a standard data representation
    between the tiers of the solution.


    Along the way, we explored ASP.NET Web services, in particular how to create a
    .NET object model that is serializable as XML so that it can be sent and received
    via ASP.NET Web services.


    We generated a form using InfoPath and bound this form to our ASP.NET Web service.
    The InfoPath form''s layout was generated automatically from the Web services
    definition, and it was a simple matter to rearrange the generated interface. Testing
    the form is also child''s play, as we saw when we retrieved a sample posting,
    made some modifications, and submitted the changes.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# 12


    # MCMS and RSS


    The Web has been changing over the past few years. Gone are the days when you
    must browse to a website to see it has changed. You may browse to a website to
    get an overall view of the content but instead of taking time out of your busy
    day to check each of your favorite websites, why not aggregate all the changes
    automatically so you can quickly scan for relevant content? Really Simple Syndication
    (RSS), an XML format, has been around for several years and it provides the foundation
    of providing content and updates to users.


    RSS already has wide adoption in the Weblog (blog) community and now corporate
    and community sites are catching on to this way of increasing content coverage
    through syndication. The effectiveness of a Content Management System can generally
    be gauged by the amount of time it takes to maintain content along with the time
    it takes users of the website to find the content changes. If users are notified
    of content changes without having to browse back to the website, we reduce the
    time it takes for users to view new information.


    # Looking Ahead


    In this chapter, we will create and configure an RSS feed that syndicates the
    latest content to users of the Tropical Green website. We will also create an
    RSS aggregator placeholder that can be configured by authors to consume RSS feeds
    and display their contents.


    Overleaf is a screenshot of the structure of the RSS feed we will be generating
    in this chapter.'
  merge: -1
  img_proc: true
