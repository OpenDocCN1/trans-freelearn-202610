    This code first accesses the parent channel, which is the channel in which the
    new posting will be created. Next, based on the template path entered, we use
    the Searches.GetByPath() method to get an instance of the template object the
    new posting should be based on. If the template object is accessible, we pass
    it as an input parameter to the Channel.CreatePosting() method, which creates
    the new posting.


    Once the posting has been created, we set its property values. In this example,
    we set the Name and Description properties to the values entered in the textboxes.
    You may wish to enhance this dialog to include input controls for setting all
    writable properties and placeholders of the posting.


    The new posting isn''t saved to the repository until a call to cmsContext.CommitAll()
    is made. If errors occur, a message is displayed in the lblErrorMessage label.


    Save and build the solution. To see it in action:


    +   1. Open http://localhost/CMSEXplorer.

    +   2. Click on MyNewChannel to see its contents. The channel is currently empty
    as we have not created any postings or channels in it.

    +   3. From the toolbar, select New | New Posting. This will open a new browser
    window containing the Create Posting dialog.

    +   4. In the Create Posting dialog, enter:


    | Property | Value |

    |---|---|

    | Name | My New Posting |

    | Description | This posting was created using the PAPI! |

    | Template Path | /Templates/TropicalGreen/PlantCatalog/Plant |


    +   5. Click Create Posting and then click Close.

    +   6. Click Refresh in the main window. The new posting is created in the channel!


