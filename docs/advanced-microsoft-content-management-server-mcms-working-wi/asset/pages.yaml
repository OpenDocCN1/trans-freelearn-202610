- pgno: 443
  md: "The `CopyPostingContent()` method copies content from the old version of the\
    \ posting to the current working version. Information is transferred from one\
    \ placeholder to another, matching them by their names. We are guaranteed of finding\
    \ a pair of matching placeholders because placeholder definitions are not versioned.\
    \ This means that the collection of placeholders will be identical in both the\
    \ working copy and the revision. For example, if a placeholder definition has\
    \ been renamed, the current working version and all previous revisions will share\
    \ the renamed placeholder definition.\n\n> One of our template designers has accidentally\
    \ deleted a placeholder definition. All our content is lost! What can we do?\n\
    \nBecause placeholder definitions are not versioned, should a template designer\
    \ delete a placeholder definition, content will be lost from both the current\
    \ posting and its revisions.\n\nYou can recover the content by re-creating a placeholder\
    \ definition of the same name and type. Nevertheless, it is always better to be\
    \ on the safe side and be cautious about deleting anything.\n\nOnce we find a\
    \ match, we copy the placeholder content from the previous version to the current\
    \ version. In this code sample, we will use `Placeholder.DataSource.RawContent`\
    \ to copy the content. This bypasses internal processing of the placeholder object\
    \ and is usually not recommended for retrieving placeholder content. In this situation,\
    \ where we are not interested in the content itself but only wish copy it to another\
    \ placeholder without inspection, `Placeholder.DataSource.RawContent` can be safely\
    \ used.\n\nAdd the `CopyPostingContent()` method directly below the `dgPageRevisionsList_ItemCommand()`\
    \ event handler within the `PageRevert.aspx.cs` file.\n\n```\npublic void CopyPostingContent(Posting\
    \ source, Posting destination)\n{\n    // Copy all placeholder contents from the\
    \ source to the destination\n    foreach (Placeholder sourcePH in source.Placeholders)\n\
    \    {\n        Placeholder destinationPH = destination.Placeholders[sourcePH.Name];\n\
    \n        // We don't worry about how the placeholder internally modifies content\n\
    \        // before it gets displayed. Even if it is encrypted or whatever—we just\n\
    \        // copy the content as-is from the previous version without modification.\n\
    \        destinationPH.DataSource.RawContent = sourcePH.DataSource.RawContent;\n\
    \    }\n}\n```\n\n# Copying Custom Property Values\n\nNext, we deal with custom\
    \ property values. Custom properties, like placeholder content, are versioned\
    \ by MCMS. This means that to revert their values, all we need to do is to copy\
    \ the value stored in the old version over to the working version.\n\nThe `CopyPostingCustomProperties()`\
    \ method loops through each custom property in the source and sets its value in\
    \ the corresponding custom property of the destination posting. Add `CopyCustomProperties()`\
    \ directly below the `CopyPostingContent()` method."
