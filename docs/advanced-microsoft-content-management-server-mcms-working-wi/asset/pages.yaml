  md: "The copied template will inherit all committed property values and custom property\
    \ and placeholder definition collections from the original template.\n\nUnlike\
    \ connected templates, copied templates are not linked in any way to the original\
    \ template. Updates to the original template do not change the properties, definition\
    \ collection, or state of the copied template.\n\nLet's attempt to make a copy\
    \ of the Plant template:\n\n+   1. In CMS Explorer, click Templates.\n+   2. Navigate\
    \ to TropicalGreen | PlantCatalog.\n+   3. Click the Edit link for the Plant template.\n\
    +   4. Click Copy.\n+   5. In the Destination Gallery field, enter /Templates/MyTemplateGallery/.\n\
    +   6. Click Copy Template.\n+   7. Click Close.\n+   8. Back at CMS Explorer,\
    \ navigate to MyTemplateGallery. A copy of the Plant template now resides there.\n\
    \n> The only way to copy template galleries is to use Site Manager. There isn't\
    \ a TemplateGallery.CopyTo() method in the PAPI.\n> \n> However, be careful when\
    \ using the \"Copy\" function for template galleries in Site Manager. If there\
    \ are connected templates within the source gallery, this relationship is not\
    \ preserved in the destination gallery.\n\n# Moving Template Galleries and Templates\n\
    \nTemplate galleries and templates are moved using Template Explorer or Site Manager\
    \ by dragging and dropping the object from one container into another. The PAPI\
    \ offers the TemplateGalleryItem.MoveTo() method to move these objects programmatically.\n\
    \nThe technique is similar to copying templates. Here's what we need to do:\n\n\
    +   - First, get a reference to the template gallery item that we wish to move.\n\
    +   - Next, get a reference to the destination template gallery that the template\
    \ gallery item is to be moved to.\n+   - Finally, call the TemplateGalleryItem.MoveTo()\
    \ method.\n\nLet's build a Move Template dialog for CMS Explorer.\n\nAdd a web\
    \ form named MoveTemplate.aspx to the project.\n\n+   1. Drag and drop styles.css\
    \ onto the web form.\n+   2. In HTML view, enter the following code:\n\n```\n\
    <table>\n<tr>\n<td colspan=\"2\">\n```"
