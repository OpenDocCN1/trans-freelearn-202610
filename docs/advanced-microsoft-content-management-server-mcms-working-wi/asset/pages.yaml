  md: "> In a real-world implementation, authors would appreciate an extra check by\
    \ the script to compare the placeholder and custom property definitions of the\
    \ new and current templates. If the new template is missing some definitions,\
    \ authors should be warned before the switch is performed. In addition, logic\
    \ on the new template may require some custom properties to be mandatory and not\
    \ left blank. Otherwise, you will get calls from irate authors wondering why the\
    \ application has erased precious content or why the posting ceased to display\
    \ correctly after the switch.\n\nIn *Tip #1: How to Revert a Posting to a Previous\
    \ Version*, we wrote a CopyPostingContent() method that copies the contents from\
    \ a source posting to a destination posting. In this case, our source is the original\
    \ posting whose template we want to change; the destination is the new posting\
