  md: "Add a class file named DeleteWithRecycle.cs to the MCMS project. If you are\
    \ working with the downloaded Tropical Green project, add the file to the ConsoleButtons\
    \ folder.\n\nThe class requires the use of the objects in the following namespaces:\n\
    \n```\nusing System;\nusing System.Web;\nusing Microsoft.ContentManagement.Publishing;\n\
    using Microsoft.ContentManagement.WebControls.ConsoleControls;\n\nnamespace TropicalGreen.Console.Buttons\n\
    {\n    - - - code continues - - -\n}\n```\n\nWe will make use of some of the features\
    \ available from the default Delete action, such as the Confirm Delete dialog.\
    \ To save the effort of recreating these features, our class will inherit from\
    \ the DeleteAction class:\n\n```\npublic class DeleteWithRecycle : DeleteAction\n\
    {\n    - - - code continues - - -\n}\n```\n\nWithin the DeleteWithRecycle() constructor,\
    \ we first get the current CmsHttpContext. We will use this same context throughout\
    \ the class. Next, we get an instance of the channel that acts as the recycle\
    \ bin. In our example, the recycle bin is located directly below the root channel.\
    \ You may have to adjust the path according to where you have decided to place\
    \ the channel.\n\nWe perform one last task within the constructor—and that is\
    \ to set the Text property of the action button. To differentiate it from the\
    \ regular Delete action, we add the word (Recycle) next to it.\n\n```\nChannel\
    \ recycleBin;\nCmsHttpContext cmsContext;\n\npublic DeleteWithRecycle()\n{\n \
    \   // Get the current CmsHttpContext\n    cmsContext = CmsHttpContext.Current;\n\
    \n    // Get a reference to the recycle bin\n    recycleBin = cmsContext.Searches.GetByPath(\"\
    /Channels/RecycleBin/\")\n        as Channel;\n\n    // Set the Text property\
    \ of the action button to be \"Delete (Recycle)\".\n    this.Text = \"Delete (Recycle)\"\
    ;\n}\n```\n\nThe action button will be made available to the user only if he or\
    \ she has rights to delete the current posting. We also check to see if he or\
    \ she is able to view and add content to the recycle bin. Otherwise, the Delete\
    \ (Recycle) button is hidden.\n\n```\npublic override bool Available\n{\n    get\n\
    \    {\n        bool isAvailable = false;\n\n        // Button is available only\
    \ if:\n        // 1. The user has the rights to delete the posting\n        //\
    \ 2. The user has the rights to move the posting to the Recycle bin\n        Posting\
    \ currentPosting = cmsContext.Posting;\n```"
