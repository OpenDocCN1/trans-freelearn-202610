    When rendered, any posting implemented with the Plant template will contain META
    tags in the <HEAD> portion of the page for each of the page''s custom properties
    and standard properties.


    One of the items available to us in the PropertyType field is PropertiesFromXMLFile.
    This option allows us to specify exactly which properties will be exported as
    META tags using an XML file located at Microsoft Content Management Server\Server\IIS_CMS\WssIntegration\SearchPropertyCollection.xml.


    Once you have specified which properties you want to use, including custom properties
    you''ve added, you need to tell SharePoint to index these properties in the crawl.
    The console application SearchPropertiesSetup.exe included with MCMS Connector
    will tell SharePoint about the updated XML file. Run it using the following syntax:


    ```

