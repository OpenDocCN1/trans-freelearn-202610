- pgno: 471
  md: "# Permanently Deleting Items from the Bin\n\nUnderstandably, as time goes by,\
    \ the number of items that are sent to the recycle bin will increase. Some websites\
    \ may even experience having thousands of postings sent to the bin in a single\
    \ week. With a huge collection of deleted items, displaying the list may become\
    \ painfully slow to the extent that the page can't be rendered within a reasonable\
    \ time frame. Before that happens, let's program the Empty Bin button to purge\
    \ all items in the recycle bin.\n\nToggle to Design view and double-click on the\
    \ Empty Bin button to get to the btnEmpty_Click() event handler. We will get all\
    \ postings in the bin and delete them one by one.\n\n```\nprivate void btnEmpty_Click(object\
    \ sender, System.EventArgs e)\n{\n    // Empty the items in the bin permanently\n\
    \    foreach(Posting deletedItem in bin.Postings)\n    {\n        deletedItem.Delete();\n\
    \        cmsContext.CommitAll();\n    }\n    dgDeletedItems.DataSource = bin.Postings;\n\
    \    dgDeletedItems.DataBind();\n}\n```\n\nThe dialog is complete!\n\n# Adding\
    \ the Recycle Bin Button to the Web Author Console\n\nWe have built the dialog\
    \ that displays the contents of the recycle bin. Let's add a Recycle Bin button\
    \ to the Web Author Console that opens it.\n\nAdd a new class file named RecycleBin.cs\
    \ to the project (add it to the ConsoleButtons folder if you are working with\
    \ the Tropical Green project).\n\nThe dialog opens up in a new window, so the\
    \ RecycleBin class will inherit from the BaseNewWindow class. Basically, it's\
    \ very much the same as the console action for the earlier tips (Tips #1 and #2).\
    \ The following code shows the complete implementation. The differences are:\n\
    \n+   - It carries the label Recycle Bin.\n+   - It opens the Recycle Bin dialog,\
    \ which in this example is located in /Dialogs/RestorePosting.aspx. You may have\
    \ to adjust this value according to the location of the web form in your site.\n\
    +   - It is available only when the user has access to the Recycle Bin channel.\n\
    \nHere's the completed code:\n\n```\nusing System;\nusing Microsoft.ContentManagement.Publishing;\n\
    using Microsoft.ContentManagement.WebControls.ConsoleControls;\n\nnamespace TropicalGreen.ConsoleButtons\n\
    {\n    public class RecycleBin: BaseNewWindowAction\n    {\n        private Channel\
    \ bin;\n        public RecycleBin()\n```"
