    SgmlReader\\SgmlReaderDll\\bin\\release\\SgmlReaderDll.dll file to the new folder.\n\
    \nWe are now ready to create the CleanHtml() method, which will convert HTML into\
    \ well-formed XHTML, for instance from <img src=\"theImage.jpg\"> into <img src=\"\
    theImage.jpg\"></img>. This method will utilize the SgmlReader assembly we previously\
    \ referenced. Before it is converted, the HTML must be wrapped in a single tag,\
    \ in this case <html>, so the SgmlReader will recognize it as one element. Once\
    \ it is returned from the SgmlReader, we will escape some characters that cannot\
    \ be escaped by InfoPath and we will remove the enclosing <html> element from\
    \ the content.\n\n+   1. Open the McmsAuthoringWebService project in Visual Studio\
    \ .NET, and add a reference to <local_drive>\\Program Files\\SgmlReader\\SgmlReaderDll.dll."
