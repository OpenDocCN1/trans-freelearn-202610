  img_proc: true
- pgno: 416
  md: "5. As the placeholder can be added to a template via the Visual Studio .NET\
    \ Toolbox and will be bound to an XmlPlaceholder, we need to add some attributes\
    \ to the class. We also need to inherit the BasePlaceholderControl class:\n\n\
    ```\n[ToolboxData(\"{0}:RssReaderPlaceholderControl runat=server></{0}:RssReaderPlaceholderControl>\"\
    ), SupportedPlaceholderDefinitionType(typeof(XmlPlaceholderDefinition))]\npublic\
    \ class RssReaderPlaceholderControl : BasePlaceholderControl\n{ \n. . . code continues\
    \ . . .\n```\n\n6. Now we have to declare the enumerators, variables, and controls\
    \ that will be used by the placeholder control. Add the following declarations\
    \ after the RssReaderPlaceholderControl() constructor:\n\n```\n#region Declarations\
    \ - Variables\n\nenum enmState { none, Channel, Item };\nprivate string RssUrl\
    \ = \"\";\nprivate int ItemsToDisplay = int.MaxValue;\nprivate bool ShowOpenArticleLink\
    \ = true;\nprivate bool ShowDescription = true;\nprivate bool ShowDate = true;\n\
    private bool ShowAuthor = true;\n\n#endregion\n\n#region Declarations - Controls\n\
    private LiteralControl basePresentationControl;\nprivate System.Web.UI.WebControls.PlaceHolder\
    \ baseAuthoringContainer;\nprivate TextBox txtRSSUrl;\nprivate DropDownList ddlItemsToDisplay;\n\
    private CheckBox chkShowOpenArticleLink;\nprivate CheckBox chkShowDescription;\n\
    private CheckBox chkShowDate;\nprivate CheckBox chkShowAuthor;\n\n#endregion\n\
    ```\n\n7. As a convenience in development, we will create the BoundXmlPlaceholder\
    \ property on the class. This property casts the inherited BoundPlaceholder property\
    \ to an XmlPlaceholder:\n\n```\n#region Properties\n\n/// <summary>\n/// Returns\
    \ the Strongly Typed\n/// Bound XmlPlaceholder\n/// </summary>\nprivate XmlPlaceholder\
    \ BoundXmlPlaceholder\n{\n    get\n    {\n        return (this.BoundPlaceholder\
    \ as XmlPlaceholder);\n    }\n}\n\n#endregion\n```"
