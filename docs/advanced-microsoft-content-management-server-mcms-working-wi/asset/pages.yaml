    \ search query\n    mssqlftQuery.Append(\"SELECT \");\n    mssqlftQuery.Append(\"\
    \\\"DAV:href\\\", \");\n    mssqlftQuery.Append(\"\\\"DAV:getlastmodified\\\"\"\
