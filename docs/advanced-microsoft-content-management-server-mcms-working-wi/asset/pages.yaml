    \ as LightweightCustomProperty); } set { this.InnerList[index] = value; } }\n\
    ```\n\n3. We will now define the Add() method that we will need in order to add\
    \ a LightweightCustomProperty to the collection.\n\n```\n/// <summary>\n/// Add\
    \ an item to the collection\n/// </summary>\n/// <param name=\"item\">The LightweightCustomProperty\
    \ to be added</param>\npublic void Add(LightweightCustomProperty item)\n{\n  \
    \  this.InnerList.Add(item);\n}\n```\n\n4. The LightweightCustomPropertyCollection\
    \ will be populated by a Microsoft.ContentManagement.Publishing.Posting object\
    \ so we will define the Load() method. The Load() method will enumerate the custom\
    \ properties of the posting and for each custom property it will instantiate a\
    \ LightweightCustomProperty and add it to the collection.\n\nFor the purposes\
    \ of this example we are only maintaining custom properties of type Text. This\
    \ code could be extended to support custom properties of type Selection.\n\n```\n\
    /// <summary>\n/// Load the lightweight custom property collection from a posting.\n\
    /// </summary>\n/// <param name=\"_Posting\">Posting to be loaded from</param>\n\
    public void Load(Posting _Posting)\n{\n    if (_Posting != null)\n    {\n    \
    \    // Loop through the custom properties\n        foreach (CustomProperty _CustomProperty\
    \ in _Posting.CustomProperties)\n        {\n            // Check if the ctsom\
    \ property is of type `text`\n            // (custom properties will have > 0\
    \ allowed values)\n            if (_CustomProperty.AllowedValues.Count == 0)\n\
    \            {\n                // Instantiate a lightweight custom property and\n\
    \                // add it to the collection\n                this.Add(new LightweightCustomProperty(_CustomProperty.Name,\
    \ _CustomProperty.Value));\n            }\n        }\n    }\n}\n```"
