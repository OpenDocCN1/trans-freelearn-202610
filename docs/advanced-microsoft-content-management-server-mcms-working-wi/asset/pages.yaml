    # Web Part Deployment


    Web Parts are compiled as .NET assemblies and can be reused many times in Windows
    SharePoint Services and SharePoint Portal Server. Web Parts are usually deployed
    using cabinet (.CAB) files. We will create a cabinet file project in Visual Studio
    .NET that will encapsulate the assemblies and metadata for our Web Part. This
    cabinet file must then be installed using the stsadm.exe utility that comes with
    WSS/SPS. To deploy the Web Part we will perform the following steps:


    +   1. Prepare the Web Part Description

    +   2. Prepare the Web Part Manifest

    +   3. Create a CAB file deployment project

    +   4. Execute the deployment'
  merge: -1
  img_proc: true
- pgno: 235
  md: "Another installation tool for packaging and deploying Web Parts, called WPPackager,\
    \ is available at http://www.microsoft.com/downloads/details.aspx?familyid=0fda5912-c136-4b44-911a-011adfcc66e3&displaylang=en.\
    \ WPPackager creates a Windows Installer File (MSI) for your Web Part, which performs\
    \ the necessary configuration of SPS/WSS during installation.\n\nFor more information\
    \ on this tool, see *Using WPPackager to Package and Deploy Web Parts for Microsoft\
    \ SharePoint Products and Technologies* at http://msdn.microsoft.com/library/default.asp?url=/library/en-us/odc_SP2003_ta/html/sharepoint_deployingwebparts_msi.asp.\n\
    \n# Preparing the Web Part Description (.DWP) File\n\nWhen deploying a Web Part\
    \ to SharePoint, several files should be populated during the deployment process.\
    \ One of these files is the Web Part Description (.DWP) file.\n\n+   1. In Visual\
    \ Studio .NET, right-click on the `ExtensibleMCMSPageListingWebPart` project and\
    \ choose Add New Item.\n+   2. In the Categories pane on the left, expand Local\
    \ Project Items and select Data.\n+   3. Select Web Part DWP.\n+   4. Enter the\
    \ name as `NavigationWebPart` and click OK.\n\nThe .DWP file describes our Web\
    \ Part, giving the default values for properties and any assemblies that the Web\
    \ Part requires. Let's create this file for our navigation Web Part:\n\n```\n\
    <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<WebPart xmlns=\"http://schemas.microsoft.com/WebPart/v2\"\
    \ >\n  <Title>Extensible MCMS Page Listing Web Part</Title>\n  <Description>\n\
    \    Displays MCMS Postings and Channels within a specified channel and\n    transforms\
    \ the display using XSLT.\n  </Description>\n  <Assembly>ExtensibleMCMSPageListingWebPart</Assembly>\n\
    \  <TypeName>ExtensibleMCMSPageListingWebPart.NavigationWebPart</TypeName>\n</WebPart>\n\
    ```\n\nThe values specified in this file allow Windows SharePoint Services to\
    \ generate metadata for the Web Part. The meanings of the elements are given in\
    \ the table below:\n\n| Element Name | Description |\n|---|---|\n| `Title` | Title\
    \ that the user will see in the Web Part Library and the default title of the\
    \ Web Part once it is added in a Web Part Zone. |\n| `Description` | Tooltip that\
    \ will appear over the Web Part title in the Web Part library. |\n| `Assembly`\
    \ | Assembly name. For this sample we are only using the assembly name but it\
    \ is also possible to use the complete Web Part assembly description like so:\
    \ `AssemblyName` (without the `.DLL` extension), `Version=VersionNumber`, `Culture=Culture`,\
    \ `PublicKeyToken=PublicKeyToken` |\n| `TypeName` | The namespace-qualified class\
    \ name. |"
  merge: -1
  img_proc: true
- pgno: 236
  md: "# Preparing the Web Part Manifest File\n\nWhen deploying a Web Part as a CAB\
    \ file, we must create a Web Part manifest file that gives the CAB file deployment\
    \ project the details of our Web Part and our Web Part description files.\n\n\
    +   1. In Visual Studio .NET, right-click on the ExtensibleMCMSPageListingWebPart\
    \ project and choose 'Add New Item'.\n+   2. In the Categories pane on the left,\
    \ expand Local Project Items and select Data.\n+   3. Select WPManifest.\n+  \
    \ 4. Enter the name as `Manifest` and click Open.\n\nEnter the following code\
    \ for this file to correspond to our Web Part:\n\n```\n```xml\n<?xml version=\"\
    1.0\"?>\n<WebPartManifest xmlns=\"http://schemas.microsoft.com/WebPart/v2/Manifest\"\
    >\n  <Assemblies>\n    <Assembly FileName=\"ExtensibleMCMSPageListingWebPart.dll\"\
    >\n      <ClassResources>\n        <ClassResource FileName=\"TestXml.xml\"/>\n\
    \        <ClassResource FileName=\"DefaultXsl.xslt\"/>\n      </ClassResources>\n\
    \      <SafeControls>\n        <SafeControl Namespace=\"ExtensibleMCMSPageListingWebPart\"\
    \n                     TypeName=\"*\" />\n      </SafeControls>\n    </Assembly>\n\
    \  </Assemblies>\n  <DwpFiles>\n    <DwpFile FileName=\"NavigationWebPart.dwp\"\
    />\n  </DwpFiles>\n</WebPartManifest>\n```\n```\n\n`Manifest.xml` allows us to\
    \ include multiple assemblies, resources, and Web Part description files in our\
    \ deployment CAB file. The elements are explained below:\n\n| Element Name | Description\
    \ |\n|---|---|\n| Assemblies | Allows us to include multiple assemblies in our\
    \ cabinet file. |\n| Assembly | Used to define an assembly by setting the `FileName`\
    \ attribute to the DLL name. |\n| ClassResources | Defines the resources used\
    \ by our classes. The paths to the resources must be relative to the project files.\
    \ Resources are supporting files such as images or data files. |\n| SafeControls\
    \ | Lists the safe controls that will be used by this Web Part (so they can be\
    \ added to the Web.config of the SharePoint site on deployment). |\n| DwpFiles\
    \ | Used to define the Web Part Description files used by this Web Part. |\n\n\
    # Creating the Deployment Project\n\nAt this point, we have a completed Web Part\
    \ project with the necessary deployment configuration files. Now we need to create\
    \ a deployment project to encapsulate the Web Part and other necessary files into\
    \ a single cabinet file for installation."
  merge: -1
  img_proc: true
