- pgno: 160
  md: "Now it's time to start coding our search logic. First, we need to add an event\
    \ handler for our advanced search button.\n\n+   1. In Design view, double-click\
    \ the btnAdvancedSearch button to create a click event handler. Visual Studio\
    \ .NET will add an event handler method to the code-behind file.\n+   2. Add the\
    \ following code to the btnAdvancedSearch_Click() event handler:\n\n```\nprivate\
    \ void btnAdvancedSearch_Click(object sender, System.EventArgs e)\n{\n    string\
    \ keywords = this.txtAdvancedSearch.Text;\n    keywords = HttpUtility.UrlEncode(keywords);\n\
    \    Response.Redirect(Request.ApplicationPath\n        + \"/SearchResults.aspx?keywords=\"\
    \n        + keywords);\n}\n```\n\nNext, we need to check the querystring in the\
    \ Page_Load() event handler to see if any keywords were passed from our SearchInput.ascx\
    \ control or the txtAdvancedSearch TextBox.\n\nAdd the following code to check\
    \ if there are any keywords supplied and execute the search if so:\n\n```\nprivate\
    \ void Page_Load(object sender, System.EventArgs e)\n{\n    if (Request.QueryString[\"\
    keywords\"] != null\n        && Request.QueryString[\"keywords\"] != String.Empty)\n\
    \    {\n        string keywords = Request.QueryString[\"keywords\"];\n       \
    \ DataSet ds = ExecuteSearch(keywords);\n        this.dgrSearchResults.Visible\
    \ = true;\n        this.dgrSearchResults.DataSource = ds;\n        this.dgrSearchResults.DataBind();\n\
    \n        // autofill the keyword input box with the search keywords\n       \
    \ this.txtAdvancedSearch.Text = keywords;\n    }\n    else\n    {\n        this.dgrSearchResults.Visible\
    \ = false;\n    }\n}\n```\n\nNow we need to create the method that will execute\
    \ the search against our SPS content index. This method will:\n\n+   - Create\
    \ an instance of the Query Service Web Service we just added to the project.\n\
    +   - Call a method that will build the MSQuery to submit to the Query Service.\n\
    +   - Execute the search.\n+   - Bind the search results to a DataGrid.\n\nImport\
    \ the following namespaces in the SearchResults.aspx.cs file:\n\n```\nusing System.Security.Principal;\n\
    using System.Runtime.InteropServices;\nusing System.Net;\nusing System.Text;\n\
    using System.Text.RegularExpressions;\nusing Microsoft.ContentManagement.Publishing;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 161
  md: "Add the following method to the SearchResults.aspx.cs file after the Page_Load()\
    \ event handler. This method will ensure the current thread is running under the\
    \ original security context regardless of any impersonations that may have been\
    \ invoked previously:\n\n```\n```csharp\n// Get reference to the RevertToSelf\
    \ method\n[DllImport(\"ADVAPI32.DLL\")]\npublic static extern int RevertToSelf();\n\
    \n/// <summary>\n/// Builds the appropriate MSQuery,\n/// submits the query to\
    \ the SPS Query Service,\n/// and returns the results as a DataGrid.\n/// </summary>\n\
    /// <param name=\"keywords\">String of keywords to search for.</param>\n/// <returns>DataSet\
    \ of search results.</returns>\nprivate DataSet ExecuteSearch(string keywords)\n\
    {\n    // decode the list of keywords\n    keywords = HttpUtility.UrlDecode(keywords);\n\
    \n    // create reference to the Query Service Web service\n    net.tropicalgreen.portal.QueryService\
    \ spsQueryService =\n        new net.tropicalgreen.portal.QueryService();\n\n\
    \    // use the current application pool identity to login\n    // to the SharePoint\
    \ Query Service Web service\n    WindowsIdentity CurrentUser = WindowsIdentity.GetCurrent();\n\
    \n    try\n    {\n        // use the Application Pool account to do access the\n\
    \        // SharePoint Search Services\n        RevertToSelf();\n        spsQueryService.Credentials\
    \ = CredentialCache.DefaultCredentials;\n    }\n    catch(System.Exception exception)\n\
    \    {\n        throw new System.Exception(exception.Message);\n    }\n    finally\n\
    \    {\n        // ensure that the original user is being impersonated again\n\
    \        CurrentUser.Impersonate();\n        CurrentUser = null;\n    }\n\n  \
    \  // build MSQuery XML string to send to the Query Service\n    // - change the\
    \ content source to \"CMSChannels\" if you used SearchSetup.exe\n    string msQuery\
    \ = BuildMSQuery(keywords, \"Tropical Green website\");\n\n    // execute the\
    \ query and return the dataset\n    return spsQueryService.QueryEx(msQuery);\n\
    }\n```\n```\n\n> If you used the SearchSetup.exe program to create your content\
    \ sources, you should use the content source group \"CMSChannels\" instead of\
    \ \"Tropical Green website\" in the code above.\n\nOur ExecuteSearch() method\
    \ calls another method, called BuildMSQuery(), which constructs the MSQuery for\
    \ sending to the QueryEx() web method. An MSQuery is composed of XML tags that\
    \ provide instructions to the Query Service, such as the number of results to\
    \ return in the request"
  merge: -1
  img_proc: true
- pgno: 162
  md: 'and a Microsoft SQL full-text (MSSQLFT) query. Building the MSSQLFT query and
    MSQuery is likely to be the most complicated task in implementing the SharePoint
    search. We''ll break it into two tasks: building the actual MSSQLFT query and
    building the MSQuery XML string. We''ll first build the full-text query that our
    MSQuery will use in the construction of the XML string we''ll send to the Query
    Service.


    # Building the Microsoft SQL Full-Text Query


    SPS''s search process uses full-text indexes and queries for fast keyword lookups
    in order to provide timely responses to the end user. Full-text queries are very
    similar to regular T-SQL queries in Microsoft SQL Server, but you have additional
    functions, or predicates, that you can use to give your query more power. One
    of these predicates that is useful when searching SharePoint indexes is FREETEXT.
    FREETEXT takes a list of words separated by spaces, determines which words and
    phrases are significant, and uses that information to build an internal query
    to search the targeted data in an efficient manner.


    First, you need to be aware of the various fields, or properties, available to
    you in your query. SharePoint provides a list with this information in the Site
    Settings administration page of your portal.


    +   1. Open a new instance of Internet Explorer and navigate to our portal: http://portal.tropicalgreen.net.

    +   2. Click on the Site Settings link in the upper right.

    +   3. Under the Search Settings and Indexed Content section, click on the Manage
    properties from crawled documents link.


    For each document crawled, the Manage Properties of Crawled Content page lists
    all properties that SharePoint could potentially contain indexed data on. For
    our purposes, we''re only going to look at the two fields below, as they contain
    information for our search results page:


    +   - DAV:href

    +   - DAV:getlastmodified


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_162_0.png)'
