    <input readonly type=\\\"text\\\" name=\\\"MAPH_AttLink_\"\n        + sPhName\
    \ + \"_\" + i.ToString()+\"\\\" value=\\\"\"+attUrl[i]+\"\\\">\");\n    . . .\
    \ code continues . . .\n}\n```"
