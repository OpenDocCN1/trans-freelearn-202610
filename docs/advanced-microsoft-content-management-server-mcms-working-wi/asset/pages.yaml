  md: "# Handling Attachments\n\nHandling attachments to deleted resources is similar\
    \ to handling images with one major difference. With attachments, we work with\
    \ not just one but a pair of anchor tags: <a> and </a>. Here's an example of how\
    \ anchor tags appear within HTML:\n\n```\n<a href=\"/NR/rdonlyres/8C78AC41-591D-4626-AFC8-19AC8375914E/0/myresource.gif\"\
    >\n    My Resource\n</a>\n```\n\nTo add to the complication, anchor tags could\
    \ be nested.\n\nWe will start as we did before, by looking for the starting <a>\
    \ and ending </a> tags. Once we get the entire anchor element, we check to see\
    \ if it contains links to MCMS resources. If it does, we use the IsResourceDeleted()\
    \ method to determine whether or not the resource has been deleted.\n\nThe code\
    \ that does this is the HandleAnchorTags() method. Add it directly below the HandleImageTags()\
    \ method. Should the attachment point to a resource that has been deleted, we\
    \ remove the pair of tags <a></a> but leave everything between them intact using\
    \ the RemoveTagPair() method described later.\n\n```\nprivate string HandleAnchorTags(string\
    \ propValue)\n{\n    // Get the index of the starting <a tag\n    int start =\
    \ propValue.ToLower().IndexOf(\"<a \");\n    while (start >= 0)\n    {\n     \
    \   // Get the closing angle bracket of the opening <a> tag\n        int end =\
    \ propValue.IndexOf(\">\",start);\n        if (end > start)\n        {\n     \
    \       string tag = propValue.Substring(start, end-start+1);\n            int\
    \ linkStart = tag.ToLower().IndexOf(\"\\\"/nr/rdonlyres\");\n            if (linkStart\
    \ >= 0)\n            {\n                int linkEnd = tag.IndexOf(\"\\\"\", linkStart+1);\n\
    \                if (linkEnd > linkStart)\n                {\n               \
    \     string linkStr = tag.Substring(linkStart, linkEnd-linkStart+1);\n      \
    \              if (IsResourceDeleted(linkStr))\n                    {\n      \
    \                  propValue = RemoveTagPair(propValue, tag, \"</a>\", \"<a\"\
    );\n                        tag = \"\";\n                    }\n             \
    \   }\n            }\n            start = propValue.ToLower().IndexOf(\"<a \"\
    , start+tag.Length);\n        }\n    }\n    return propValue;\n}\n```\n\n```\n\
    }\n    }\n    // Look for more <img> tags\n    start = propValue.ToLower().IndexOf(\"\
    <img \", start+tag.Length);\n}\n}\nreturn propValue;\n}\n```"
