- pgno: 488
  md: '# Generating the Report


    Let''s run the script to see what a generated report looks like. Press F5 on Visual
    Studio .NET''s tool bar to run the script. The file will be created in the same
    folder as the /bin/Debug folder of the FindResources project. As it is a comma
    separated variable file (*.csv), double-clicking it launches Microsoft Excel.


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_488_0.png)


    To get the postings that use a particular resource, simply sort the spreadsheet
    by resource paths by clicking on the Resource Path column and selecting Data |
    Sort from the menu bar. Once the data has been sorted, search for the resource
    you are looking for by pressing F5.


    ![](img/442e26bf28f2df81fbf8dff3478f88e3_488_1.png)


    You could also find the list of resources used in a particular posting by sorting
    on the posting''s path instead.


    Of course, searching within a spreadsheet isn''t as easy as querying a database.
    Instead of writing to a log file, you could have written the data to a database
    table or to an XML file. You could even write code within event handlers to update
    the list of resources each time a posting is published. In this way, you could
    provide a simple query interface for resource managers to find out the answers
    to their questions in real time.'
  merge: -1
  img_proc: true
- pgno: 489
  md: '# 多个Python框架


    Python是一种功能强大且易于学习的编程语言，广泛应用于Web开发、数据科学、人工智能等领域。Python拥有丰富的框架生态系统，每个框架都有其独特的优势和适用场景。


    +   - Django：Python最流行的Web框架之一，遵循“约定优于配置”原则，自带ORM、Admin后台、认证系统等众多内置功能，适合快速构建大型Web应用。


    +   - Flask：一个轻量级的Web框架，核心简单灵活，便于扩展，适合构建小型应用和API服务，常与SQLAlchemy、Jinja2等库配合使用。


    +   - PyTorch：由Facebook开发的深度学习框架，采用动态计算图，调试方便，广受科研人员与开发者的喜爱，适合模型研究和快速原型开发。


    +   - TensorFlow：由Google开发的深度学习框架，支持静态图和动态图，拥有强大的生产部署能力，适用于大规模机器学习和深度学习任务。


    选择合适的框架取决于项目的具体需求和开发者的偏好。对于需要快速开发完整功能网站的场景，Django是不错的选择；对于追求轻量化和灵活性的项目，Flask更加适合；而在人工智能领域，PyTorch和TensorFlow则各有所长。'
  merge: -1
  img_proc: true
