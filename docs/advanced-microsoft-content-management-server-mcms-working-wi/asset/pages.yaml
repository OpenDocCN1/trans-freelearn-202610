- pgno: 164
  md: "```\nmssqlftQuery.Append(\" WHERE \");\nint i=0;\nforeach (string s in whereClause)\n\
    {\n    if (i > 0)\n        mssqlftQuery.Append(\" AND \");\n    mssqlftQuery.Append(s);\n\
    \    i++;\n}\nreturn mssqlftQuery.ToString();\n```\n\nNotice we added a calculated\
    \ field, which we used to apply certain weight to some fields. This is how SharePoint\
    \ actually executes its own search. You could configure the property weighting\
    \ to give more emphasis to specific properties in your query. For example, you\
    \ may want to give more weight to the title of the page, or to the keywords stored\
    \ in the HTML META tags, than to the contents of the page.\n\nNow that we have\
    \ this method, let's move on to creating the MSQuery string. We'll use this method\
    \ in the construction of our MSQuery string.\n\n# Building the MSQuery XML String\n\
    \nWe know that the SPS Query Service Web Service accepts a single parameter: an\
    \ MSQuery string. This string is actually an XML document, but it's passed to\
    \ the Query Service as a string. The XML tags in this string tell the Query Service\
    \ the type of response it supports, how many records to return in the result,\
    \ and the result index to start the search results at. The <StartAt></StartAt>\
    \ element is what you can use in paging your result set. We won't be incorporating\
    \ paging into our site as it is small, but you can see how easy it would be to\
    \ do so.\n\nLet's get started, by creating our BuildMsQuery() method that returns\
    \ a complete MSQuery XML string containing all the information necessary to execute\
    \ a query against a SharePoint index. Add the following method at the end of the\
    \ SearchResults.aspx.cs page:\n\n```\n/// <summary>\n/// Builds an MSQuery with\
    \ an embedded MSSQLFT query embedded\n/// for submission to SharePointPS Query\
    \ Service.\n/// </summary>\n/// <param name=\"keywords\">Keywords submitted for\
    \ search.</param>\n/// <param name=\"searchScope\">SPS Search scope to filter.</param>\n\
    /// <returns>MSQuery</returns>\npublic string BuildMSQuery(string keywords, string\
    \ searchScope)\n{\n    StringBuilder msQuery = new StringBuilder();\n\n    //\
    \ create the main header of the XML string\n    msQuery.Append(\"<?xml version=\\\
    \"1.0\\\" encoding=\\\"utf-8\\\" ?>\"\n        + \"<QueryPacket xmlns=\\\"urn:Microsoft.Search.Query\\\
    \" \"\n        + \"Revision=\\\"1000\\\">\"\n        + \"<Query domain=\\\"QDomain\\\
    \">\"\n        + \"<SupportedFormats>\"\n        + \"<Format>urn:Microsoft.Search.Response.Document.Document</Format>\"\
    \n        + \"</SupportedFormats>\");\n\n    // create the actual full-text query\n\
    \    msQuery.Append(\"<Context>\"\n        + \"<QueryText language=\\\"en-US\\\
    \" type=\\\"MSSQLFT\\\">\"\n        + \"<![CDATA[\" + this.BuildMssqlftQuery(keywords,\
    \ searchScope)\n        + \"]]</QueryText></Context>\");\n\n    // create the\
    \ range, page, and number of results\n    // to return\n```"
