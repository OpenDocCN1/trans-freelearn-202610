- pgno: 165
  md: "```\nmsQuery.Append(\"<Range><StartAt>1</StartAt><Count>20</Count>\"\n    +\
    \ \"</Range></Query></QueryPacket>\");\nreturn msQuery.ToString();\n}\n```\n\n\
    The two nodes of an MSQuery after the opening QueryPacket node (Query, and SupportedFormats)\
    \ should not be modified. The Context node contains the actual search query, which\
    \ you can change to suit your requirements. The last node, Range, contains directives\
    \ used to tell the SPS Query Service Web Service how many results to return and\
    \ at what index to start the result set.\n\nFor example, if you displayed 20 results\
    \ per page and you wanted to show the third page of results, you'd set the StartAt\
    \ node to 41 and leave the Count node at 20.\n\nWe now have a complete MSQuery\
    \ string with an included full-text query.\n\nLet's see if our search will now\
