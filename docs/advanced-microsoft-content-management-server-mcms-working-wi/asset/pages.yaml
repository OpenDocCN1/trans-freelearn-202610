- pgno: 31
  md: "# How can I toggle to Update mode?\n\nTo toggle to Update mode, simply use\
    \ the ChannelItem.QueryStringModeUpdate property instead, like so:\n\n```\nif\
    \ (CmsContext.Mode != PublishingMode.Update)\n{\n    Response.Redirect(\"default.aspx?\"\
    \n        + CmsHttpContext.Current.RootChannel.QueryStringModeUpdate);\n}\n```\n\
    \n# Toggling Modes with CmsApplicationContext\n\nAnother popular method of toggling\
    \ between modes leverages the CmsApplicationContext object. This object is typically\
    \ used for stand-alone applications that run outside IIS, such as console and\
    \ desktop applications. In these cases, the CmsHttpContext is meaningless and\
    \ can't be used.\n\nYou can also use the CmsApplicationContext object within a\
    \ web application when you require additional CmsContext objects, especially when\
    \ working with different modes. You can maintain CmsHttpContext in Published mode,\
    \ and have a separate CmsApplicationContext in Update mode. Another advantage\
    \ to using CmsApplicationContext is that it reduces the number of client round\
    \ trips required.\n\nWe won't be using CmsApplicationContext in the CMS Explorer\
    \ application. Nevertheless, no lesson on mode switching is complete without introducing\
    \ the class.\n\n> The CmsApplicationContext class is covered extensively in Chapter\
    \ 13, *Essential How-Tos, Tips, and Tricks*.\n\nTo use the CmsApplicationContext\
    \ object, first create a new instance of it:\n\n```\n// Create a new CmsApplicationContext\n\
    CmsApplicationContext cmsContext = new CmsApplicationContext();\n```\n\nUnlike\
    \ CmsHttpContext, CmsApplicationContext must be authenticated with the MCMS server\
    \ using one of four authentication methods. Each authentication method accepts\
    \ an input parameter of type PublishingMode specifying the mode you wish to work\
    \ in.\n\n+   - **AuthenticateAsCurrentUser**  \n+     Authenticates using the\
    \ credentials of the currently logged-on user. This method does not work correctly\
    \ from within a web application. It is used only when running the application\
    \ outside of IIS, e.g. from a console application, because it uses the process\
    \ token. For web applications, using the process token means that the currently\
    \ logged on user is the user configured in the machine.config file (in IIS 5)\
    \ or the application pool account (in IIS 6) instead of the user that has been\
    \ authenticated in CmsHttpContext (which uses the thread token).\n+   \n+    \
    \ To authenticate as the current user:\n\n```\n// authenticate as the current\
    \ user\ncmsContext.AuthenticateAsCurrentUser(PublishingMode.Unpublished);\n```"
  merge: -1
  img_proc: true
