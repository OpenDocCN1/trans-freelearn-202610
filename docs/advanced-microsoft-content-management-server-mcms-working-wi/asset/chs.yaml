  \ to this Solution\n\n以下是一些可以轻松纳入此解决方案的可能增强功能：\n\n- 通过选择模板创建新帖子的能力。\n- 对 Selection\
  \ Type 自定义属性的支持。\n- 对 HtmlPlaceholder 以外的占位符对象支持。\n- 支持将图像粘贴到富文本框中，该图像必须解码并上传到资源库。\n\
  - 保存以便稍后修改的能力。\n- InfoPath 表单中的另一个视图，允许用户列出和选择他们想要修改的帖子。\n\n## Summary\n\n在本章的整个过程中，我们见证了\
  \ Microsoft Office InfoPath 2003 的强大功能，我们迅速创建了一个灵活的内容创作解决方案，利用其丰富的 UI。与此同时，我们能够在解决方案的各层之间保持标准的数据表示。\n\
  \n在这一过程中，我们探索了 ASP.NET Web 服务，特别是如何创建一个可序列化为 XML 的 .NET 对象模型，以便通过 ASP.NET Web 服务发送和接收。\n\
  \n我们使用 InfoPath 生成了一个表单，并将此表单绑定到我们的 ASP.NET Web 服务。InfoPath 表单的布局是从 Web 服务定义自动生成的，重新排列生成的界面非常简单。测试表单也易如反掌，正如我们在检索示例帖子、进行一些修改并提交更改时所看到的那样。\n\
  \n\n\n\n"
- "# 12 MCMS 与 RSS\n\n过去几年中，Web 发生了变化。浏览网站以查看其是否发生变化的日子已经一去不复返了。你可以浏览网站来获得内容的整体视图，但与其花时间在忙碌的一天中检查每个你喜爱的网站，不如自动聚合所有变化，以便快速扫描相关内容？Really\
  \ Simple Syndication（RSS），一种 XML 格式，已经存在了好几年，它提供了向用户提供内容和更新的基础。\n\nRSS 在 Weblog（博客）社区中已经得到广泛采用，现在企业和社区网站也开始采用这种通过聚合来增加内容覆盖率的方式。内容管理系统（Content\
  \ Management System）的有效性通常可以通过维护内容所需的时间以及网站用户查找内容变化所需的时间来衡量。如果用户无需返回网站浏览即可获知内容变化，我们就能减少用户查看新信息所需的时间。\n\
  \n### 展望未来\n\n在本章中，我们将创建并配置一个 RSS feed，将 Tropical Green 网站的最新内容聚合给用户。我们还将创建一个 RSS\
  \ 聚合占位符，可以由作者配置以消费 RSS feed 并显示其内容。\n\nOverleaf 是我们在本章中将生成的 RSS feed 结构的截图。\n\n\
  ![](img/442e26bf28f2df81fbf8dff3478f88e3_406_0.png)\n\n下图是我们将要构建的 RSS Aggregation\
  \ 控制的作者界面。它允许用户输入要显示的 RSS feed 的 URL，并配置呈现模式视图的各个方面。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_406_1.png)\n\
  \n在呈现模式下，我们的 RSS Aggregation 控制将显示 RSS feed 中的每篇文章，并且根据配置显示 Open Article 链接、描述、日期和作者，如以下截图中所示：\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_406_2.png)\n\n### RSS Feed 的结构\n\nRSS\
  \ feed 是一个符合特定规范的 XML 文档。我们将使用 RSS 版本 2.0，如 `http://blogs.law.harvard.edu/tech/rss`\
  \ 中所述。以下表格概述了 RSS feed 包含的元素。\n\n| Parent | Element | Description |\n|---|---|---|\n\
  | *(this is the root element)* | `rss` | RSS feed 的顶层元素。 |\n| `rss` | `channel`\
  \ |  |\n| `channel` | `link` | 网站的 URL。 |\n| `channel` | `title` | RSS Feed 的标题，例如\
  \ Tropical Green。 |\n| `channel` | `copyright` | 与 RSS feed 相关的版权信息。 |\n| `channel`\
  \ | `description` | RSS feed 的描述。 |\n| `channel` | `managingEditor` | 负责内容的人员的电子邮件地址。\
  \ |\n| `channel` | `webMaster` | Webmaster 的电子邮件地址。 |\n| `channel` | `generator`\
  \ | 用于生成 feed 的应用程序名称。 |\n| `channel` | `item` | 每个要聚合的文章的重复元素。 |\n| `item` | `title`\
  \ | 文章的标题。在此我们使用 postings 的 `DisplayName` 属性。 |\n| `item` | `link` | 文章的 HTML 版本的链接（或更多信息）。\
  \ |\n| `item` | `pubDate` | 项目发布的日期。 |\n| `item` | `author` | 项目的作者姓名或电子邮件地址。 |\n\
  | `item` | `guid` | 项目的全局唯一 ID。此元素完美映射到 MCMS，因为 postings 已有 GUID。 |\n| `item` |\
  \ `description` | 将包含在此项目中的内容。 |\n\n请记住，由于 RSS feed 是 XML，所有元素名称区分大小写。下面是一个示例 feed：\n\
  \n```xml\n<rss version=\"2.0\">\n  <channel>\n    <link>http://localhost</link>\n\
  \    <title>Tropical Green's website</title>\n    <copyright>© Tropical Green 2005</copyright>\n\
  \    <description>The latest changes from the Tropical Green website.</description>\n\
  \    <managingEditor>content@tropicalgreen.net</managingEditor>\n    <webMaster>webmaster@tropicalgreen.net</webMaster>\n\
  \    <generator>MCMS 2002 RSS Feed Generator</generator>\n    <item>\n      <title>A\
  \ Walk Through Jenny's Garden</title>\n      <link>http://localhost/www.tropicalgreen.net/Columns/AWalkThroughJennysGarden.htm</link>\n\
  \      <pubDate>Thu, 17 Mar 2005 13:07:31 GMT</pubDate>\n      <author>WinNT://DEVELOPERXP/Developer</author>\n\
  \      <guid isPermaLink=\"false\">{01C931CC-0AFC-4BF4-9CB7-FBA8F354D0C8}</guid>\n\
  \      <description>You can publish pages directly from Word to MCMS using Authoring\
  \ Connector</description>\n    </item>\n  </channel>\n</rss>\n```\n\n### 作为 RSS\
  \ Feed 提供内容\n\n我们将创建一个机制，允许用户将他们的 RSS aggregator 指向一个页面并检索在设定天数内已更新的 postings。RSS\
  \ aggregator 是一种可以从一个或多个 RSS feed 检索项目并以可读形式显示项目的程序。\n\n### 创建 RSS Feed\n\n为本示例的目的，我们将在\
  \ Tropical Green 示例站点中创建一个新的 web form。\n\n让我们直接进入代码：\n\n- 1. 在 Visual Studio .NET\
  \ 中启动 Tropical Green 解决方案。\n- 2. 通过右键单击 TropicalGreen 项目并选择 Add | New Folder 创建一个新文件夹来存储我们的\
  \ RSS web form。命名新文件夹为 UtilityPages。\n- 3. 通过右键单击 UtilityPages 并选择 Add | Add New\
  \ Web Form 在 UtilityPages 文件夹中创建一个新的 web form。\n- 4. 命名该项为 rss.aspx 并单击 Open。\n\
  - 5. 我们现在应该有一个空白的 web form 已创建并在 Design 视图中打开。\n\n我们创建的 web form 将返回 XML 而不是 HTML，因此我们需要从\
  \ rss.aspx 文件中删除生成的元素，因为它们不会成为我们 RSS XML 文档的一部分。\n\n- 1. 在屏幕左下角，单击 HTML 以切换到 HTML\
  \ 模式。\n- 2. 删除 Page 指令下方的所有内容：\n\n```aspx\n<%@ Page language=\"c#\" Codebehind=\"\
  rss.aspx.cs\" AutoEventWireup=\"false\" Inherits=\"TropicalGreen.UtilityPages.rss\"\
  \ %>\n```\n\n- 3. 由于许多不同的 aggregator 可以以自动方式访问你的 feed，feed 对整个站点性能的影响可能非常巨大。我们无法控制\
  \ aggregator 轮询 feed 查找变化的频率，因为该设置通常可以在 aggregator 本身进行配置。为了最大限度地减少对站点性能的影响，我们将为提供\
  \ feed 的 web form 实现输出缓存。在 Page 指令正下方添加以下指令，将输出缓存设置为 300 秒，即五分钟：\n\n```aspx\n<%@\
  \ OutputCache Duration=\"300\" VaryByParam=\"none\" %>\n```\n\n- 4. 切换到 web form\
  \ 的代码视图，我们将开始添加生成 RSS feed 的代码。导入以下命名空间：\n\n```csharp\nusing System;\nusing System.Collections;\n\
  using System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Web;\n\
  using System.Web.SessionState;\nusing System.Web.UI;\nusing System.Web.UI.WebControls;\n\
  using System.Web.UI.HtmlControls;\nusing System.Configuration;\nusing Microsoft.ContentManagement.Publishing;\n\
  using Microsoft.ContentManagement.Publishing.Extensions.Placeholders;\nusing System.IO;\n\
  using System.Xml;\nusing System.Text;\n\nnamespace TropicalGreen.UtilityPages\n\
  {\n    /// <summary>\n    /// Summary description for rss.\n    /// </summary>\n\
  \    public class rss : System.Web.UI.Page\n    {\n        - - - code continues\
  \ - - -\n    }\n}\n```\n\n让我们创建 GenerateRssXml() 方法，该方法以 RSS 格式的字符串形式返回我们 MCMS 网站的最新更新。首先我们设置临时内存流和\
  \ XmlTextWriter，以便创建发送给客户端的 XML 流：\n\n```csharp\n/// <summary>\n/// Generate the\
  \ RSS feed xml\n/// </summary>\n/// <returns>RSS XML</returns>\nprivate string GenerateRssXml()\n\
  {\n    // Create the Memory Stream\n    MemoryStream _MemoryStream = new MemoryStream();\n\
  \n    // Create an XmlTextWriter to write to the memory stream\n    XmlTextWriter\
  \ XmlWriter = new XmlTextWriter(_MemoryStream, Encoding.UTF8);\n\n    // Create\
  \ the top element <rss>\n    XmlWriter.WriteStartElement(\"rss\");\n\n    // Set\
  \ the version attribute of the RSS Feed\n    XmlWriter.WriteAttributeString(\"version\"\
  , \"2.0\");\n\n    // Create the Channel Element\n    XmlWriter.WriteStartElement(\"\
  channel\");\n```\n\nRSS feed 的一般信息，如 link、title 和 copyright，将从 Web.config 文件中读取，我们稍后将创建这些\
  \ Web.config 条目。GenerateRssXml() 依赖于两个我们将很快开发的辅助方法 GetPostingSummary()，它将检索 postings\
  \ 的摘要（要么是 HtmlPlaceholder 要么是 Description 属性），以及 GetAccountFriendlyName()，它旨在返回作者的全名。\n\
  \n```csharp\n// Get the general info from the Web.config\nstring strFeed_Title =\
  \ ConfigurationSettings.AppSettings.Get(\"RSS_Title\");\nstring strWebsiteUrl =\
  \ ConfigurationSettings.AppSettings.Get(\"RSS_WebsiteUrl\");\nstring strFeed_Copyright\
  \ = ConfigurationSettings.AppSettings.Get(\n    \"RSS_Copyright\");\n```\n\n\n\n\
  \n\nXmlWriter.WriteElementString(\"author\", GetAccountFriendlyName(_Posting.LastModifiedBy.ClientAccountName));\n\
  \n// Set the GUID element to the posting's guid\n// Also set the isPermaLink attribute\
  \ to false.\nXmlWriter.WriteStartElement(\"guid\");\nXmlWriter.WriteAttributeString(\"\
  isPermaLink\",\"false\");\nXmlWriter.WriteRaw(_Posting.Guid);\nXmlWriter.WriteEndElement();\n\
  \n// Output the posting's summary as the description element\nXmlWriter.WriteElementString(\"\
  description\", GetPostingSummary(_Posting));\n\n// Close the </item> element\nXmlWriter.WriteEndElement();\n\
  }\n\n接下来，我们关闭 XML 元素，刷新 XmlWriter，并返回 XML 字符串。\n\n```\n// Close the <channel> element\n\
  XmlWriter.WriteEndElement();\n\n// Close the <rss> element\nXmlWriter.WriteEndElement();\n\
  \n// Flush the XmlWriter\nXmlWriter.Flush();\n\n// Reset the position of the memory\
  \ stream\n_MemoryStream.Position = 0;\n\n// create a new stream reader and read\
  \ the memory stream\nStreamReader _StreamReader = new StreamReader(_MemoryStream);\n\
  \n// Return the contents of the stream reader\nreturn (_StreamReader.ReadToEnd());\n\
  }\n```\n\n第一个辅助方法 GetPostingSummary() 必须检索将由 RSS feed 描述的 posting 的描述或内容。\n\nGetPostingSummary()\
  \ 使用一个名为 RSS_Summary_PlaceholderName 的配置变量，该变量将从 Web.config 文件中读取。RSS_Summary_PlaceholderName\
  \ 可以存储将聚合到 RSS feed 的 description 元素中的占位符的名称。如果该值为空或未找到占位符，则将使用 posting 的 description\
  \ 属性（Posting.Description）。\n\n让我们将 GetPostingSummary() 方法添加到 rss 类中。\n\n```\n///\
  \ <summary>\n/// Get the summary for a posting\n/// </summary>\n/// <param name=\"\
  \ Posting\">Posting to get the summary for</param>\n/// <returns></returns>\nprivate\
  \ string GetPostingSummary(Posting _Posting)\n{\n    string _Summary = \"\";\n\n\
  \    // Get the Summary Placeholder's name from the Web.config\n    string SummaryPlaceholderName\
  \ =\n```\n\n```\n/// <summary>\n/// Overridden render method that calls the\n///\
  \ GenerateRssXml method and writes it to the output stream.\n/// </summary>\n///\
  \ <param name=\"writer\"></param>\nprotected override void Render( HtmlTextWriter\
  \ writer)\n{\n    // change the page response to XML instead of HTML\n    Response.ContentType\
  \ = \"text/xml; charset=utf-8\";\n\n    // Write the GenerateRssXml's response to\
  \ the response stream.\n    writer.Write(GenerateRssXml());\n}\n```\n\n## 在 Web.config\
  \ 中定义全局设置\n\n为了提高灵活性，我们需要在 rss.aspx.cs 中方法使用的 Web.config 的 <appSettings> 元素中定义几个变量。Web.config\
  \ 中指定的设置将应用于整个站点。\n\n在 Web.config 的 <configuration> 元素内，添加 <appSettings> 元素和以下键：\n\
  \n```\n<configuration>\n  <appSettings>\n    <add key=\"RSS_Summary_PlaceholderName\"\
  \ value=\"Summary\" />\n    <add key=\"RSS_Title\" value=\"Tropical Green's Website\"\
  \ />\n    <add key=\"RSS_WebsiteUrl\" value=\"http://www.tropicalgreen.net\" />\n\
  \    <add key=\"RSS_Copyright\" value=\"© Tropical Green 2005\" />\n    <add key=\"\
  RSS_Description\" value=\"The latest changes from the Tropical Green Website.\"\
  \ />\n    <add key=\"RSS_ManagingEditor\" value=\"content@tropicalgreen.net\" />\n\
  \    <add key=\"RSS_WebMaster\" value=\"webmaster@tropicalgreen.net\" />\n    <add\
  \ key=\"RSS_StartChannel\" value=\"/channels/www.tropicalgreen.net/\" />\n    <add\
  \ key=\"RSS_NumberOfDaysOld\" value=\"20\" />\n  </appSettings>\n... code continues\
  \ ...\n```\n\n为了获得更大的灵活性，这些配置数据可以存储在频道属性中，并且 RSS feed 可以由 posting 或频道渲染脚本而不是 Web\
  \ 表单生成。\n\n## 测试 RSS Feed\n\n要测试 feed，我们可以直接在 Web 浏览器中加载页面并查看响应。为此，我们将把 rss.aspx\
  \ 设置为起始页并在不调试的情况下启动。\n\n- 1. 右键单击 rss.aspx，并选择设为起始页。\n- 2. 从 Debug 菜单中，选择不调试启动。\n\
  - 3. 页面现在应该已加载，RSS 应该出现：\n\n## MCMS 和 RSS\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_414_0.png)\n\
  \n要包含在 RSS feed 中的 posting 必须在最近 20 天内创建或修改并发布，因为这是我们在 Web.config 中配置的时间范围。\n\n\
  ## 在聚合器中测试 RSS Feed\n\n如果你的计算机上有一个 RSS 聚合器，你可以通过将聚合器指向 `http://localhost/TropicalGreen/UtilityPages/rss.aspx`\
  \ 来测试 RSS feed。下面是 feed 被 RSS Bandit（www.rssbandit.org）聚合的屏幕截图，它是免费 RSS 聚合器中最受欢迎的之一。\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_414_1.png)\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_415_0.png)\n\
  \n我们生成的 feed 是一个 RSS 2.0 兼容的 feed。如果您想将 feed 转换为另一种类型，例如 Podcast 兼容的 feed，您可以利用\
  \ FeedBurner（www.feedburner.com），它提供了这种转换功能。\n\n## 将 RSS Feed 聚合到 MCMS\n\n对于下一个示例，我们将创建一个占位符控件，允许用户输入\
  \ RSS feed 的 URL 并将内容聚合到 posting 中。\n\n## 创建占位符控件\n\n要创建 RSS 聚合占位符控件，我们将在 TropicalGreenControlLib\
  \ 项目中创建一个新的占位符。\n\n- 1. 在 Visual Studio .NET 中加载 Tropical Green 解决方案。\n- 2. 右键单击\
  \ TropicalGreenControlLib 项目并选择添加 | 添加类。\n- 3. 将新类命名为 RssReaderPlaceholderControl.cs\
  \ 并单击确定。\n- 4. 导入以下命名空间：\n\n```\nusing System;\nusing System.Net;\nusing System.Text;\n\
  using System.Xml;\nusing System.Web;\nusing System.Web.UI;\nusing System.Web.UI.WebControls;\n\
  using Microsoft.ContentManagement.Publishing;\nusing Microsoft.ContentManagement.Publishing.Extensions.Placeholders;\n\
  using Microsoft.ContentManagement.WebControls.Design;\nusing Microsoft.ContentManagement.WebControls;\n\
  ```\n\n5. 由于占位符可以通过 Visual Studio .NET 工具箱添加到模板中，并且将绑定到 XmlPlaceholder，因此我们需要在类上添加一些属性。我们还需要继承\
  \ BasePlaceholderControl 类：\n\n```\n[ToolboxData(\"{0}:RssReaderPlaceholderControl\
  \ runat=server></{0}:RssReaderPlaceholderControl>\"), SupportedPlaceholderDefinitionType(typeof(XmlPlaceholderDefinition))]\n\
  public class RssReaderPlaceholderControl : BasePlaceholderControl\n{ \n. . . code\
  \ continues . . .\n```\n\n6. 现在我们必须声明占位符控件将使用的枚举器、变量和控件。在 RssReaderPlaceholderControl()\
  \ 构造函数之后添加以下声明：\n\n```\n#region Declarations - Variables\n\nenum enmState { none,\
  \ Channel, Item };\nprivate string RssUrl = \"\";\nprivate int ItemsToDisplay =\
  \ int.MaxValue;\nprivate bool ShowOpenArticleLink = true;\nprivate bool ShowDescription\
  \ = true;\nprivate bool ShowDate = true;\nprivate bool ShowAuthor = true;\n\n#endregion\n\
  \n#region Declarations - Controls\nprivate LiteralControl basePresentationControl;\n\
  private System.Web.UI.WebControls.PlaceHolder baseAuthoringContainer;\nprivate TextBox\
  \ txtRSSUrl;\nprivate DropDownList ddlItemsToDisplay;\nprivate CheckBox chkShowOpenArticleLink;\n\
  private CheckBox chkShowDescription;\nprivate CheckBox chkShowDate;\nprivate CheckBox\
  \ chkShowAuthor;\n\n#endregion\n```\n\n7. 为了开发方便，我们将在类上创建 BoundXmlPlaceholder 属性。此属性将继承的\
  \ BoundPlaceholder 属性强制转换为 XmlPlaceholder：\n\n```\n#region Properties\n\n/// <summary>\n\
  /// Returns the Strongly Typed\n/// Bound XmlPlaceholder\n/// </summary>\nprivate\
  \ XmlPlaceholder BoundXmlPlaceholder\n{\n    get\n    {\n        return (this.BoundPlaceholder\
  \ as XmlPlaceholder);\n    }\n}\n\n#endregion\n```\n\n8. 为了管理此占位符数据的存储和检索，我们将创建两个方法\
  \ LoadSettingsFromXml() 和 GetSettingsAsXml()：\n\n```\n#region Load/Set Settings\n\
  \n/// <summary>\n/// Load the settings of the placeholder from an XmlString\n///\
  \ </summary>\n/// <param name=\"strXml\"></param>\npublic void LoadSettingsFromXml(string\
  \ strXml)\n{\n    // Create a new xml Document\n    XmlDocument _doc = new XmlDocument();\n\
  \n    // Load the xml into the xml document\n    _doc.LoadXml(strXml);\n\n    //\
  \ Set the variables from the XML\n    this.RssUrl = _doc.SelectSingleNode(\"/Content/RssUrl\"\
  ).InnerText;\n    this.ItemsToDisplay = System.Convert.ToInt32(\n        _doc.SelectSingleNode(\"\
  /Content/ItemsToDisplay\").InnerText);\n    this.ShowOpenArticleLink = Boolean.Parse(\n\
  \        _doc.SelectSingleNode(\"/Content/ShowOpenArticleLink\").InnerText);\n \
  \   this.ShowDescription = Boolean.Parse(\n        _doc.SelectSingleNode(\"/Content/ShowDescription\"\
  ).InnerText);\n    this.ShowDate = Boolean.Parse(\n        _doc.SelectSingleNode(\"\
  /Content/ShowDate\").InnerText);\n    this.ShowAuthor = Boolean.Parse(\n       \
  \ _doc.SelectSingleNode(\"/Content/ShowAuthor\").InnerText);\n}\n```\n\n9. 要在 GetSettingsAsXml()\
  \ 方法中创建 XML 字符串，我们将使用 StringBuilder 类来构建 XML 字符串。我们同样可以使用 XmlTextWriter 对象。\n\n\
  ```\n/// <summary>\n/// Get the current set of settings as an Xml string\n/// </summary>\n\
  /// <returns></returns>\npublic string GetSettingsAsXml()\n{\n    // Create a new\
  \ string builder\n    StringBuilder sb = new StringBuilder();\n\n    // Create the\
  \ Content XML string and populate elements\n    sb.Append(\"<Content>\");\n    sb.Append(\"\
  \  <RssUrl>\" + HttpUtility.HtmlEncode(this.txtRSSUrl.Text)\n        + \"</RssUrl>\"\
  );\n    sb.Append(\"<ItemsToDisplay>\"\n        + this.ddlItemsToDisplay.Items[ddlItemsToDisplay.SelectedIndex].Value\n\
  \        + \"</ItemsToDisplay>\");\n    sb.Append(\"<ShowOpenArticleLink>\"\n  \
  \      + this.chkShowOpenArticleLink.Checked.ToString()\n        + \"</ShowOpenArticleLink>\"\
  );\n    sb.Append(\"<ShowDescription>\"\n        + this.chkShowDescription.Checked.ToString()\n\
  \        + \"</ShowDescription>\");\n    sb.Append(\"<ShowDate>\" + this.chkShowDate.Checked.ToString()\n\
  \        + \"</ShowDate>\");\n    sb.Append(\"<ShowAuthor>\" + this.chkShowAuthor.Checked.ToString()\n\
  \        + \"</ShowAuthor>\");\n    sb.Append(\"</Content>\");\n```\n\n\n\n\n\n\
  接下来，我们定义每一行并创建两个表格单元格。我们将标签和文本框 Web 控件添加到表格单元格中。对用户可指定的每个设置都重复此过程：\n\n```\n// 行：文本\n\
  tableCell = new TableCell();\ntableCell.Width = 130;\ntableRow.Cells.Add(tableCell);\n\
