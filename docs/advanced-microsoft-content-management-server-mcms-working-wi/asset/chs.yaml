  至此，我们的自定义视图中的编码已完成。我们仍然需要为程序集指定强名称，这是 SharePoint 环境中运行任何程序集所必需的。\n\n为了给程序集指定强名称，我们首先需要一个密钥。要创建密钥，我们将从\
  \ Visual Studio .NET 命令提示符中运行强名称工具：\n\n- 1. 通过选择“开始”|“所有程序”|“Visual Studio .NET\
  \ 2003”|“Visual Studio .NET 工具”|“Visual Studio .NET 2003 命令提示符”来启动命令窗口。\n\n- 2.\
  \ 为简单起见，我们将密钥放在 C: 驱动器的根目录下。在命令提示符下输入以下内容来创建密钥：\n\n  ```\n  sn -k c:\\PlantCatalogCustomView.snk\n\
  \  ```\n\n  现在我们需要告诉编译器，在构建程序集时使用刚刚创建的密钥来指定强名称。为此，请打开项目中的 AssemblyInfo.cs 文件，并按照下面的代码所示修改版本号和密钥文件属性：\n\
  \n  ```\n  [assembly: AssemblyVersion(\"1.0.0.0\")]\n  [assembly: AssemblyKeyFile(\"\
  c:\\\\PlantCatalogCustomView.snk\")]\n  ```\n\n- 3. 创建自定义视图的最后步骤包括以发布模式构建程序集并将其部署到全局程序集缓存（GAC）。要将程序集添加到\
  \ GAC，请复制项目的发布版程序集 TropicalGreenPlantCatalogCustomView.dll，并将其粘贴到 GAC 中，该 GAC 位于\
  \ C:\\Windows\\assembly\\。\n\n- 4. 让我们验证自定义程序集是否已成功安装到 GAC：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_184_0.png)\n\
  \n> 记下我们程序集列出的公钥令牌。稍后我们会用到它。\n\n我们现在已经为 MCMS 页面列表 Web 部件构建并部署了第一个自定义视图。但是，在使用之前，我们需要通过修改\
  \ MCMS 应用程序的 Web.config 来注册它，该应用程序是我们在将 MCMS 页面列表 Web 部件添加到 SharePoint Web 部件页面时指定为站点根\
  \ URL 的应用程序。在我们的案例中，它是：`http://www.tropicalgreen.net/MCMS/`。\n\n> MCMS 应用程序由服务器配置应用程序（SCA）在您将虚拟服务器设置为\
  \ MCMS Web 入口点时创建。您可以在以下目录中找到此应用程序的 Web.config：`C:\\Program Files\\Microsoft Content\
  \ Management Server\\Server\\MCMS`。\n\n打开在 MCMS 页面列表 Web 部件中指定为站点根 URL 的 Web 应用程序的\
  \ Web.config，并添加以下元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<configuration>\n\
  \  <configSections>\n    <sectionGroup name=\"CustomPageListingViews\">\n      <section\
  \ name=\"CustomView1\" type=\"Microsoft.ContentManagement.SharePoint.Dialogs.NameValueSectionHandler,\
  \ Microsoft.ContentManagement.SharePoint.Dialogs, Version=1.0.1000.0, Culture=neutral,\
  \ PublicKeyToken=31bf3856ad364e35\" />\n    </sectionGroup>\n  </configSections>\n\
  \n  <CustomPageListingViews>\n    <CustomView1>\n      <add key=\"assembly\" value=\"\
  TropicalGreenPlantCatalogCustomView, Version=1.0.0.0, Culture=neutral, PublicKeyToken=82ea4ab22cc61fe4\"\
  \ />\n      <add key=\"customListingType\" value=\"TropicalGreenPlantCatalogCustomView.PlantCatalogCustomView\"\
  \ />\n    </CustomView1>\n  </CustomPageListingViews>\n\n  - - - code continues\
  \ - - -\n```\n\n> 请注意，上面 Web.config 中列出的 PublicKeyToken 与 GAC 中显示的相同。\n\n获取公钥令牌的一种简单方法是从\
  \ GAC 中程序集的属性窗口复制它。\n\n另一种获取公钥令牌的方法是在 Visual Studio .NET 命令窗口中输入以下命令：`c:\\sn -T\
  \ [path to Web Part]\\mywebpart.dll`。\n\n请记住，Web.config 与任何 XML 文件一样区分大小写，因此如果您遇到任何语法错误，请仔细检查是否有拼写错误。\n\
  \n现在一切都已就绪：我们的自定义视图程序集已部署到 GAC，并已注册为第一个自定义视图选项。是时候看看它是否有效了！\n\n回到门户，通过单击左侧垂直导航中的“编辑页面”将页面切换到编辑模式，然后从\
  \ MCMS 页面列表 Web 部件的下拉菜单（通过单击右上角的下拉箭头激活）中选择“修改共享 Web 部件”以打开 SharePoint Web 部件工具窗格。展开该\
  \ Web 部件的“自定义属性”部分，为“视图”选择“自定义 1”，然后单击底部的“应用”。请耐心等待，因为您的自定义视图首次加载可能需要一点时间。加载后，您应该会看到与以下屏幕截图类似的内容：\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_186_0.png)\n\n恭喜！您现在已经为 MCMS 页面列表 Web\
  \ 部件构建了第一个自定义视图。\n\n尽管自定义视图有助于创建您自己的呈现方式，但 MCMS 页面列表 Web 部件不允许完全控制 HTML 输出。不幸的是，您只能访问每行的表格单元格内容，这迫使您采用垂直列表呈现方式。如果您想以水平列表显示帖子怎么办？如果您只想显示频道怎么办？如果您想显示频道中的子频道和帖子怎么办？实现这一点的唯一方法是创建一个自定义\
  \ Web 部件，该部件引用频道内的帖子列表。\n\n让我们看看连接器附带的另外两个 Web 部件。\n\n## MCMS 生产中的页面 Web 部件\n\n\
  MCMS 生产中的页面 Web 部件显示当前登录用户已创作但尚未发布的 MCMS 站点中的帖子列表。显示的帖子来自 MCMS 站点中的所有频道，而不仅仅是特定频道。让我们实际看看这个\
  \ Web 部件。\n\n> 连接器不支持表单身份验证，因为 SharePoint 仅支持 Windows 身份验证。这将影响 MCMS 生产中的页面 Web\
  \ 部件和 MCMS 等待审批的页面 Web 部件的数据检索。\n>\n> 由于此限制，我们当前对 Tropical Green 网站的配置将不适用于这两个 Web\
  \ 部件。尽管如此，如果您有一个使用 Windows 身份验证的 MCMS 站点，我们将逐步介绍实现和配置这些 Web 部件的步骤。\n\n\n\n\n我们需要做的第一件事是将\
  \ Web Part 添加到 Web Part 页面。我们将其放在之前使用的 MCMS 页面列表 Web Part 下方。要添加该 Web Part，请重复我们添加\
  \ MCMS 页面列表 Web Part 时执行的相同步骤：\n\n- 1. 在 Internet Explorer 中导航到 SharePoint 门户：\n\
  \  http://portal.tropicalgreen.net。\n- 2. 通过单击左侧垂直“操作”菜单中的“编辑页面”链接切换到编辑模式。\n- 3.\
  \ 单击左上角的“修改共享页面”链接。使用出现的下拉菜单，选择“添加 Web Part”，然后选择“浏览”。\n- 4. 切换到“虚拟服务器库”以查看当前虚拟服务器上已安装的\
  \ Web Part。\n- 5. 现在我们的页面上已经有了 Web Part，我们需要设置其属性。单击我们刚刚添加到页面上的“生产中的 MCMS 页面”Web\
  \ Part 右上角的小向下箭头，然后选择“修改共享 Web Part”。\n- 6. 单击“自定义属性”部分标题左侧的图标，展开“自定义属性”部分。\n- 7.\
  \ 我们需要告诉 Web Part 我们的 MCMS Web 应用程序的 URL。为“MCMS 站点根 URL”属性输入 http://www.tropicalgreen.net/MCMS/。单击工具窗格底部的“应用”按钮。\n\
  \n## 等待审批的 MCMS 页面 Web Part\n\n“等待审批的 MCMS 页面”Web Part 显示等待当前用户审批的发布项目列表。此 Web Part\
  \ 与之前的“生产中的 MCMS 页面”Web Part 具有完全相同的功能、实施步骤和配置设置。两者之间的唯一区别在于发布项目的状态。由于这两个 Web Part\
  \ 非常相似，我们就不在 SharePoint Web Part 页面上逐步演示添加和配置此 Web Part 的步骤了。\n\n## 为什么 MCMS 页面列表\
  \ Web Part 适用于启用了匿名访问的表单身份验证 MCMS 站点，而“生产中的 MCMS 页面”Web Part 和“等待审批的 MCMS 页面”Web\
  \ Part 却不适用？\n\n当您的站点配置为匿名访问时，您很可能已在 Site Manager 中为设置为 MCMS 匿名登录帐户的帐户授予了“订阅者”角色。这就是匿名访问帐户枚举指定频道中的发布项目并将其显示在\
  \ MCMS 页面列表 Web Part 中所需的全部权限。但是，“生产中的 MCMS 页面”Web Part 和“等待审批的 MCMS 页面”Web Part\
  \ 需要比“订阅者”角色提供的权限更高的权限（例如作者、编辑者或审核者权限），因此这些 Web Part 将显示一条权限错误消息：“提供的 Windows 凭据无法验证。”\n\
  \n如果我们的 Tropical Green MCMS 站点未设置为匿名访问，我们将因相同原因遇到与 MCMS 页面列表 Web Part 相同的问题。\n\n\
  如果您的 MCMS 站点设置为使用 Windows 身份验证，并且您将“生产中的 MCMS 页面”Web Part 和“等待审批的 MCMS 页面”Web Part\
  \ 配置为使用这个启用了 Windows 身份验证的 MCMS 站点，那么这两个 Web Part 的外观将类似于：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_188_0.png)\n\
  \n正如我们所展示的，连接器附带的三个 Web Part 提供了对 MCMS 内容的有限呈现（如 MCMS 页面列表 Web Part 的情况）和工作流管理（如“生产中的\
  \ MCMS 页面”和“等待审批的 MCMS 页面”Web Part 的情况）。如果您需要显示特定发布项目中的内容，或者以列表形式显示一系列频道和发布项目，该怎么办？\n\
  \n虽然 MCMS 页面列表 Web Part 可以显示频道内的发布项目，但其呈现方式有些受限。正如我们之前看到的，每个发布项目都列在一个每行一个单元格的 HTML\
  \ 表格中。我们可以控制放在表格单元格中的 HTML 内容。如果我们需要对呈现方式有更多控制怎么办？或者如果我们想显示频道、子频道和发布项目的树状组织，又该怎么办？\n\
  \n## MCMS 连接器用于 SharePoint 的局限性\n\n连接器解决了将内容从 MCMS 站点发布到 SharePoint 时的一些最常见需求和用途。然而，正如之前的问题所示，还有更多发布可能性。为了满足这些要求，我们可以选择构建自定义\
  \ Web Part，以更可配置的方式将内容从 MCMS 拉取到 SharePoint 中。为此，我们需要访问内容。这可以通过以下三种方式之一实现：\n\n-\
  \ 1. 将虚拟服务器扩展为 SharePoint 站点，并将其配置为 MCMS Web 入口点。此选项将允许 SharePoint 站点中的 Web Part\
  \ 通过 MCMS PAPI 直接访问 MCMS 内容。这将在第 7 章“构建 SharePoint Web Part”中我们创建的 Web Part 中进行演示。\n\
  - 2. 将 MCMS 和 SharePoint 配置为在两个独立的虚拟服务器上运行。您希望发布的 MCMS 内容可以通过 MCMS 站点上的 Web 服务公开。然后，SharePoint\
  \ Web Part 可以使用这些 Web 服务，并将数据呈现在 SharePoint Web Part 页面上。构建和利用 Web 服务来公开 MCMS 发布项目和频道的内容将在第\
  \ 11 章“InfoPath 与 MCMS Web 服务”中介绍。\n\n> 我们已经在第 5 章“使用 SharePoint 搜索 MCMS”中探讨了实现索引和搜索功能所涉及的所有控件和占位符。\n\
  \nSharePoint 文档占位符使内容所有者能够链接由 SharePoint Portal Server 管理的文档，并将其呈现在 MCMS 发布项目中。内容所有者还可以在\
  \ MCMS 页面中显示所链接文档的属性。文档及其属性的呈现方式由 XSLT 样式表控制，这些样式表可以集中控制，也可以单独应用于需要的位置。一旦文档链接到 MCMS\
  \ 发布项目，用户就可以通过 SharePoint Portal Server 或 MCMS 站点访问该文档，这为用户查看文档内容提供了无缝体验，无论他们从何种环境访问该文档。\n\
  \n存储在 SharePoint 文档库中的任何文档都可以通过 SharePoint 文档占位符添加到发布项目。如果您选择的显示视图包含图标，该占位符将使用与\
  \ MCMS 服务器上该文档类型关联的图标。如果文档类型是 Microsoft Office InfoPath 表单或 Word 标记语言 (WordML) 文档，您可以在占位符控件中显示文档内容。相反，所有其他文档类型将作为附件和/或文档属性显示。这取决于您选择用来呈现文档库项的\
  \ XSLT 选项。\n\n> 如果文档是 InfoPath 表单，您需要确保用户（内容消费者）对包含该表单的 SharePoint 站点具有权限。这是因为 SharePoint\
  \ 文档库包含用于在 InfoPath 中显示表单的模板。\n\n当通过 SharePoint 文档占位符将文档添加到 MCMS 发布项目时，该文档会从 SharePoint\
  \ 文档库复制到 MCMS 存储库中，作为本地附件。如果文档是 XML 类型，例如 InfoPath 或 WordML 文档，则 XML 也会保存在 MCMS\
  \ 占位符中（此占位符中的内容在 MCMS 站点内设置为只读）。对 SharePoint 文档库中文档所做的更改不会自动反映到 MCMS 中。连接器包含文档更新程序实用工具，用于将文档库中所做的更改同步到\
  \ MCMS（如果在创建发布项目时已在 SharePoint 文档占位符控件中选中了“自动更新”复选框）。该工具 WssDocumentUpdater.exe\
  \ 可以在连接器的安装目录 C:\\Program Files\\MCMS Connector for SharePoint Technologies\\CMS\\\
  bin\\ 中找到。可以使用 Windows 任务计划程序将此命令行工具设置为按固定时间间隔运行。\n\n## 使用 SharePoint 文档占位符\n\n\
  让我们看看 SharePoint 文档占位符的实际效果。首先，我们需要在 SharePoint 文档库中创建并上传一个文档：\n\n- 1. 创建一个新的 Microsoft\
  \ Word 文档，并在文档正文中输入以下文本：这是保存在 Microsoft Word 文件中的内容。\n- 2. 将文档以文件名 MCMS Published\
  \ Document 保存到您的桌面。\n- 3. 打开 Internet Explorer 并浏览到我们的 SharePoint 门户：http://portal.tropicalgreen.net/。\n\
  \n\n\n\n4. 在门户左侧的“操作”导航下，单击“上载文档”。\n\n   ![](img/442e26bf28f2df81fbf8dff3478f88e3_191_0.png)\n\
  \n5. 在“文档库：上载文档”页面上，单击“浏览”并选择我们刚创建的文档。在“所有者”文本框中输入您的姓名，在“状态”下拉列表中选择“最终”，确保选中“为此文档添加列表项”复选框，然后点击表单顶部的“保存并关闭”。\n\
  \n   ![](img/442e26bf28f2df81fbf8dff3478f88e3_191_1.png)\n\n6. 在“添加列表项”页面上，只需单击页面底部的“确定”按钮即可接受所有默认选项。\n\
  \n上载文档并创建新的列表项后，系统会自动将您带回门户主页。如果在“为您提供的链接”Web 部件下查看，您会看到我们的文档列在列表顶部：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_192_0.png)\n\
  \n我们现在已在 SharePoint 文档库中有了一个文档。接下来需要使用一个承载 SharePoint 文档占位符的模板，在 MCMS 中创建新的发布项。在这种情况下，我们将使用连接器自带的示例项目\
  \ CmsSharePointConnector 来演示此占位符。\n\n> 可以在 `C:\\Program Files\\Microsoft Content\
  \ Management Server\\Sample Data\\CmsSharePointConnector\\` 找到 CmsSharePointConnector\
  \ 项目。\n>\n> 有关安装连接器、示例项目和示例数据的更多信息，请参阅附录 B“用于 SharePoint 技术的 MCMS 连接器”。\n>\n> 我们建议您仔细研究\
  \ CmsSharePointConnector 示例代码，其中包含的控件和样式可用于使您的 MCMS 发布项具有与 SharePoint 门户网站相同的观感以及导航。\n\
  \n打开 Internet Explorer，浏览到位于 http://portal.tropicalgreen.net/CmsSharePointConnector/\
  \ 的 CmsSharePointConnector 项目。\n\n## 是否收到 404 未找到错误？\n\n如果收到了，很可能是 CmsSharePointConnector\
  \ Web 应用程序尚未被排除在 SharePoint 的托管路径之外。请参阅附录 A“在同一虚拟服务器上设置 MCMS 和 SPS”，添加排除路径。\n\n\
  CmsSharePointConnector 主页包含一些描述连接器、示例数据和有用链接的信息。我们有意使用 Internal 发布项和模板，因此请单击“Internal\
  \ 频道”链接。\n\n如您所见，Internal 频道中的主页看起来就像 SharePoint 门户网站。我们要使用 News 模板创建新发布项，因为它包含\
  \ SharePoint 文档占位符。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_193_0.png)\n\n1.\
  \ 单击“切换到编辑网站”链接，页面重新加载后，再单击“创建新页面”链接。\n\n2. 当提示选择模板时，单击“Internal 模板库”，然后选择 News\
  \ 模板。\n\n3. 新发布项显示后，在最顶部的 HtmlPlaceholder 中输入以下文本：我的第一个 SharePoint 文档占位符发布项。\n\n\
  ![](img/442e26bf28f2df81fbf8dff3478f88e3_193_1.png)\n\n4. 现在是将我们刚创建并上载到 SharePoint\
  \ 文档库的 Microsoft Word 文档添加进去的时候了。单击占位符容器内包含以下文本的占位符，激活“占位符属性”对话框：单击此处选择 SharePoint\
  \ 库文件...\n\n5. 在“占位符属性”对话框中，通过单击“MCMS Published Document.doc”链接选择我们上载的文档，并单击“下一步”按钮。\n\
  \n6. 现在您可以选择布局选项，这些选项可以是“无”、“带文件名的图标”或“带文件名和属性的图标”。这些布局选项可在 catalog.xml 文件中配置，可用的选项取决于文件类型。选择“带图标和属性的附件”选项，然后点击“完成”按钮。\n\
  \n## 占位符属性\n\n选择用于显示文件属性和文件内容的布局。\n\n使用以下方式显示文件属性：\n\n| 布局 | 说明 |\n| --- | --- |\n\
  | （无） | 不显示附件或文件的任何属性。 |\n| 带图标的附件 | 附加所选项，并使用图标及其文件名显示。 |\n| 带图标和属性的附件 | 附加所选项，并使用图标、文件名及其\
  \ SharePoint 库文件属性显示。 |\n\n使用以下方式显示文件内容：\n\n使用示例内容预览所选布局：\n\n单击“使用示例内容预览所选布局：”标签旁边的“确定”按钮将打开另一个窗口，允许您查看文档在发布项中的各种显示方式。\n\
  \n选择文档和显示选项后，对话框将关闭，发布项将重新加载，您将看到 SharePoint 文档占位符如何显示您的文档。\n\n让我们通过单击左侧导航中的“保存新页面”链接并为其指定名称和显示名称为“My\
  \ First SP Doc Placeholder Posting”来保存并发布该发布项。然后通过单击“批准”链接发布发布项。批准发布项后，单击“切换到实时网站”链接，查看发布项在发布后的实际外观：\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_196_0.png)\n\n之前我们提到，您可以使用可扩展样式表语言（XSL）样式表将文档属性和内容中的\
  \ XML 转换为 HTML。文档属性和内容分别使用单独的样式表。所有文档都包含用于其文档属性的 XML 文件，但只有 InfoPath 和 WordML 文件是\
  \ XML，可以使用内容样式表进行转换。您可以在添加文档时刚刚遇到的“占位符属性”对话框中指定要在转换中使用的样式表。连接器附带了我们已使用的默认样式表。这些样式表位于\
  \ `C:\\Program Files\\Microsoft Content Management Server\\Server\\IIS_CMS\\WssIntegration\\\
  Dialogs\\WssDocumentFinder\\TemplateCatalog\\`。下表列出了连接器附带的默认样式表：\n\n| 样式表名称 | 说明\
  \ |\n| --- | --- |\n| AttachmentIcon.xsl | 将文档显示为图标附件。仅当附加的文件是文档时可用。 |\n| AttachmentIconProps.xsl\
  \ | 将文档显示为带属性的图标附件。仅当附加的文件是文档时可用。 |\n| ImageTagOnly.xsl | 内联显示图像。仅当附加的文件是图像时可用。\
  \ |\n| ImageAndProps.xsl | 内联显示图像及其属性。仅当附加的文件是图像时可用。 |\n\n上表基于随连接器附带的“Microsoft\
  \ Content Management Server 2002 用于 SharePoint 技术的连接器”帮助文件中的文档。\n\nSharePoint 文档占位符通过单个\
  \ XML 文件来确定适用于可附加到占位符的不同文件类型的样式表。该文件 catalog.xml 与上面列出的样式表位于同一目录中。catalog.xml 文件包含有关每种可用样式的以下信息：\n\
  \n- 样式表可以应用到的文件类型，例如 jpg、gif、contentxml 或 all（以 * 表示）\n- 在“占位符属性”对话框的下拉列表中显示的描述性名称\n\
  - 样式表的说明\n- 指定用于转换的 XSL 样式表位置的 URL\n- 示例呈现 URL，该 URL 是一个 XML 文件，用于在附加文档时模拟发送到占位符的\
  \ XML 馈送，让用户预览最终呈现效果\n\n此外，您还可以通过 catalog.xml 文件 type 节点中的 SpecificWebUrl 和 SpecificLibrary\
  \ 属性，指定样式表可以应用到的特定库。使用 SpecificWebUrl 属性指定 WSS 或 SPS 站点，使用 SpecificLibrary 属性指定可应用样式表的\
  \ WSS 或 SPS 库的名称。\n\n您可以为特定的 SharePoint 文档占位符实现创建自己的 catalog.xml 文件，以限制或为该库提供特定的呈现选项。只需创建一个符合\
  \ catalog.xsd 架构定义文件（与 catalog.xml 和样式表位于同一目录中）的新 XML 文件，然后在使用 SharePoint 文档占位符的\
  \ MCMS 模板的 HTML 中指定该文件，使用\n\n\n\n`RenderingTemplateCatalogUrl` 属性并指定虚拟路径到你的目录文件。例如，如果你创建了一个名为\
  \ `mycatalog.xml` 的新目录，SharePoint 文档占位符在 MCMS 模板文件中的外观如下：\n\n```xml\n<cc1:SharePointDocumentPlaceholderControl\
  \ id=\"SharePointDocumentPlaceholderControl\" runat=\"server\" KeepSynchronized=\"\
  False\" PlaceholderToBind=\"SPDdocument\" RenderingTemplateCatalogUrl=\"mycatalog.xml\"\
  >\n</cc1:SharePointDocumentPlaceholderControl>\n```\n\n## MCMS SharePoint 连接器的局限性\n\
  \n不幸的是，连接器只提供了一种在 MCMS 站点中发布 SharePoint 内容的方式：`SharePointDocumentPlaceholder`，我们刚刚介绍过。但\
  \ SharePoint 门户可以包含的内容远不止文档库。SharePoint 中最常用的内容元素之一是列表。SharePoint 随附了许多不同类型的配置列表，例如问题、任务、链接、事件，以及自定义列表。这些列表非常动态、功能强大且可定制，因为它们可以从头构建。连接器最大的缺点之一是它没有提供在\
  \ MCMS 网站中发布 SharePoint 列表数据的方法。\n\n能够拥有一个可以显示 SharePoint 列表数据的 MCMS 占位符控件会很有用。由于连接器中未包含此功能，让我们自己构建一个！\n\
  \n我们将继续使用之前的示例，使用我们的 Tropical Green MCMS Internet 站点 http://www.tropicalgreen.net/TropicalGreen/\
  \ 和 Tropical Green SharePoint Portal Server Intranet 门户 http://portal.tropicalgreen.net/。假设我们在\
  \ SharePoint 门户 Intranet 中有一个事件 Web 部件列表，供员工维护所有与 Tropical Green 相关的事件：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_198_0.png)\n\
  \n## 如何向我的事件列表添加项目？\n\n要添加、编辑或查看门户事件列表中的项目，请从门户主页左侧操作菜单中单击管理内容。在文档和列表页面上，单击事件链接。你的列表中可能有也可能没有项目。要添加项目，请单击列表标题中的新建项目链接，输入必要的信息，然后单击表单标题中的保存并关闭链接。重复此过程任意多次。\n\
  \n现在，我们想要做的是在主页上显示所有这些事件。我们将构建一个自定义占位符控件，从 SharePoint 列表中检索这些事件。此自定义占位符控件将添加到现有的\
  \ `TropicalGreenControlLib` 项目中，并添加到 `Homepage.aspx` 模板中。`TropicalGreenControlLib`\
  \ 项目可以在 Tropical Green 下载中找到，并创建于书籍 *Building Websites with Microsoft Content Management\
  \ Server*（Packt Publishing，2005 年 1 月，ISBN 1-904811-16-7）中。\n\n## 一个用于显示 SharePoint\
  \ 列表内容的占位符控件\n\n由于我们的占位符控件将检索列表中的所有项目，因此我们需要确定如何访问 SharePoint 门户中的实际列表。一个选项是使用 SharePoint\
  \ API，但这种方法有一个缺点：我们的 MCMS 站点和 SharePoint 门户必须位于同一服务器上，因为 SharePoint API 只能访问安装它的服务器，而不能访问远程服务器。虽然这在测试环境和某些生产环境中是可行的，但限制很大。另一个选项是通过\
  \ SharePoint 随附的 Web 服务访问 SharePoint 列表。列表服务 Web 服务包含返回列表架构、添加、更新和删除项目以及检索列表内容的方法的函数。每个\
  \ SharePoint 站点都有对该 Web 服务的引用，因此所有列表都对外部应用程序可见。\n\n通过 Web 服务访问列表比通过 API 访问列表更好。此解决方案可以在同时安装\
  \ MCMS 和 SharePoint 的服务器上工作，也可以在两个产品安装在单独服务器上的情况下工作。\n\n我们的占位符控件 `SharePointEventsPlaceholderControl`\
  \ 将利用 SharePoint 列表服务 Web 服务来检索 SharePoint 事件列表中的项目。在创作模式下，它将要求作者输入 SharePoint 站点的\
  \ Web 服务 URL 和事件列表的名称。\n\n让我们开始吧。我们需要做的第一件事是为我们的占位符控件创建一个新类并向项目添加必要的引用：\n\n1. 向\
  \ `TropicalGreenControlLib` 项目添加一个新类。将新类命名为 `SharePointEventsPlaceholderControl.cs`。\n\
  2. 右键单击项目并选择添加 Web 引用…\n3. 在 URL 文本框中指定列表服务 URL，然后单击转到按钮。在我们的例子中，列表服务的地址是 `http://portal.tropicalgreen.net/_vti_bin/lists.asmx`。加载后，通过单击添加引用按钮接受默认的\
  \ Web 引用名称。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_200_0.png)\n\n现在我们的项目已设置了对\
  \ SharePoint 列表服务 Web 服务的引用，并且包含一个空代码文件，其中将包含我们的占位符控件。\n\n我们需要将新类从空壳转换为自定义占位符控件类，通过继承基类并重写必要的方法。为此，我们将添加对一些必要命名空间的引用，继承\
  \ BasePlaceholderControl 类，并重写基类中的五个方法（我们不需要为自定义占位符控件添加任何额外引用，因为我们使用的是 `TropicalGreenControlLib`\
  \ 项目，该项目已包含所有必要的引用，因为它包含其他自定义占位符控件）：\n\n```csharp\nusing System;\nusing Microsoft.ContentManagement.Publishing;\n\
  using Microsoft.ContentManagement.Publishing.Extensions.Placeholders;\nusing Microsoft.ContentManagement.WebControls;\n\
  using Microsoft.ContentManagement.WebControls.Design;\n\nnamespace TropicalGreenControlLib\n\
  {\n    [SupportedPlaceholderDefinitionType(typeof(XmlPlaceholderDefinition))]\n\
  \    public class SharePointEventsPlaceholderControl : BasePlaceholderControl\n\
  \    {\n        public SharePointEventsPlaceholderControl()\n        {\n       \
  \ }\n\n        protected override void CreateAuthoringChildControls\n          \
  \  (BaseModeContainer authoringContainer)\n        {\n        }\n\n        protected\
  \ override void CreatePresentationChildControls\n            (BaseModeContainer\
  \ presentationContainer)\n        {\n        }\n\n        protected override void\
  \ LoadPlaceholderContentForAuthoring\n            (PlaceholderControlEventArgs e)\n\
  \        {\n        }\n\n        protected override void LoadPlaceholderContentForPresentation\n\
  \            (PlaceholderControlEventArgs e)\n        {\n        }\n\n        protected\
  \ override void SavePlaceholderContent\n            (PlaceholderControlSaveEventArgs\
  \ e)\n        {\n        }\n    }\n}\n```\n\n我们的空类现在包含了 MCMS 自定义占位符控件的骨架。此时，让我们考虑在发布处于创作模式时，我们需要从用户那里获得哪些输入。此占位符控件的目标是检索\
  \ SharePoint 列表的内容。我们已经有了对 SharePoint 列表服务 Web 服务的引用，我们将使用它来检索列表内容，但我们需要知道 Web 服务的确切地址，以防此控件用于访问另一个\
  \ SharePoint 站点，而不仅仅是我们的门户。Web 服务包含十二个方法，但我们只对 `GetListItems()` 感兴趣。此方法接受一些参数，但我们唯一需要关心的是\
  \ `ListName`（我们将接受其他所有参数的默认值）。\n\n我们需要从用户那里收集以下两个值：\n\n- 包含我们要显示的列表的 SharePoint\
