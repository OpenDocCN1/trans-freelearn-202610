  \ |\n| Label | ID | lblTemplatePath |\n|  | Text | (empty string) |\n| TextBox |\
  \ ID | txtTemplatePath |\n| Button | ID | btnGetPlaceholderDefinitions |\n|  | Text\
  \ | Get Placeholders |\n| Button | ID | btnSwitch |\n|  | Text | Switch |\n|  |\
  \ Visible | false |\n| Placeholder | ID | phPlaceholderDefinitions |\n| Label |\
  \ ID | lblMessage |\n|  | Text | (empty string) |\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_450_0.png)\n\
  \n双击表单上的任意位置以打开其代码隐藏文件。在类的命名空间声明上方添加解决方案所需的三个命名空间。\n\n```csharp\n- - - code continues\
