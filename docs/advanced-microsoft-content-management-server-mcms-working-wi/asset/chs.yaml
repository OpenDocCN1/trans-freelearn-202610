  );\n\n    // Launch the Insert Attachment Dialog\n    script.Append(\"WBC_launchAttachmentGallery(\\\
  \"\"\n        + \"wbc_purpose=Basic&\"\n        + \"NRMODE=Unpublished&\"\n    \
  \    + \"WBCMODE=PresentationUnpublished&\"\n        + \"FRAMELESS=true\" + channelGUID\
  \ + \"&\"\n        + \"NRNODEGUID=\" + postingGUID + \"&\"\n        + \"\\\" + placeholderName\
  \ + \\\"\\\",\"\n        + \"ThinEditIE,\"\n        + allowLocalAttachments.ToLower()\
  \ + \",\"\n        + \"true,\"\n        + \"false);\");\n\n    script.Append(\"\
  return false\");\n\n    return script.ToString();\n}\n```\n\n# 从对话框返回值的\n\n插入附件对话框允许作者指定附件及其显示文本。它不是模态对话框。因此，为了将内容写回占位符控件，对话框会访问调用窗口中的客户端函数。\n\
  \n根据所选的占位符类型，Web Author 会准备不同的客户端例程。本示例中使用的“ThinEditIE”占位符类型调用位于 `<install directory>\\\
  Microsoft Content Management Server\\IIS_CMS\\WebAuthor\\Client\\PlaceholderControlSupport\\\
