  ## 编程触发页面还原过程的按钮\n\nDataGrid 上的 Revert 按钮触发页面还原过程。网格中列出的每个修订都有一个 Revert 按钮。作者将点击他们希望将帖子回滚到的版本的按钮。还原过程的工作方式如下：\n\
  \n- 首先，作者点击所选修订旁边的 Revert 按钮。\n- 当点击 Revert 按钮时，dgPageRevisionsList_ItemCommand()\
  \ 事件处理程序将被调用。在事件处理程序内部，我们将从修订集合中检索所选修订并调用几个关键过程：\n  - CopyPostingContent() 方法，将所选修订中的所有占位符内容复制到工作版本\n\
  \  - CopyCustomProperties() 方法，将所选修订中的所有自定义属性值复制到工作版本\n- 最后，我们刷新父窗口以显示具有最近还原内容的帖子。\n\
  \n## 访问 DataGrid 的 ItemCommand() 事件处理程序\n\n让我们开始通过编辑 ItemCommand() 事件处理程序来使用 DataGrid\
  \ 的标准 ASP.NET 行为。\n\n当点击 Revert 按钮时，dgPageRevisionsList DataGrid 的 ItemCommand()\
  \ 事件处理程序将被触发。这就是我们将添加执行页面还原过程的代码的地方。要访问此事件处理程序，请以设计视图打开 PageRevert.aspx。在 dgPageRevisionsList\
  \ DataGrid 对象的属性窗口中，单击事件按钮（它是带有黄色\n\n`CopyPostingContent()` 方法将帖子的旧版本内容复制到当前工作版本。信息从一个占位符传输到另一个占位符，按名称匹配。我们保证能找到匹配的占位符对，因为占位符定义不是版本化的。这意味着工作副本和修订中的占位符集合将是相同的。例如，如果占位符定义被重命名，则当前工作版本和所有先前的修订都将共享重命名的占位符定义。\n\
  \n> 我们的一位模板设计师不小心删除了一个占位符定义。我们的所有内容都丢失了！我们能做什么？\n\n由于占位符定义不是版本化的，如果模板设计师删除了占位符定义，当前帖子和其修订的内容都将丢失。\n\
  \n您可以通过重新创建相同名称和类型的占位符定义来恢复内容。尽管如此，始终最好谨慎行事，小心删除任何内容。\n\n一旦找到匹配项，我们就会将占位符内容从上一个版本复制到当前版本。在此代码示例中，我们将使用\
  \ `Placeholder.DataSource.RawContent` 来复制内容。这会绕过占位符对象的内部处理，通常不建议用于检索占位符内容。在这种情况下，我们对内容本身不感兴趣，只希望在不检查的情况下将其复制到另一个占位符，`Placeholder.DataSource.RawContent`\
  \ 可以安全使用。\n\n在 `PageRevert.aspx.cs` 文件中，将 `CopyPostingContent()` 方法直接添加到 `dgPageRevisionsList_ItemCommand()`\
  \ 事件处理程序下方。\n\n```\npublic void CopyPostingContent(Posting source, Posting destination)\n\
  {\n    // Copy all placeholder contents from the source to the destination\n   \
  \ foreach (Placeholder sourcePH in source.Placeholders)\n    {\n        Placeholder\
  \ destinationPH = destination.Placeholders[sourcePH.Name];\n\n        // We don't\
  \ worry about how the placeholder internally modifies content\n        // before\
  \ it gets displayed. Even if it is encrypted or whatever—we just\n        // copy\
  \ the content as-is from the previous version without modification.\n        destinationPH.DataSource.RawContent\
  \ = sourcePH.DataSource.RawContent;\n    }\n}\n```\n\n## 复制自定义属性值\n\n接下来，我们处理自定义属性值。自定义属性与占位符内容一样，由\
  \ MCMS 进行版本控制。这意味着要还原其值，我们所需要做的就是将旧版本中存储的值复制到工作版本。\n\n`CopyPostingCustomProperties()`\
  \ 方法遍历源中的每个自定义属性，并将其值设置在目标帖子的对应自定义属性中。将 `CopyCustomProperties()` 直接添加到 `CopyPostingContent()`\
  \ 方法下方。\n\n```\npublic void CopyPostingCustomProperties(Posting source, Posting\
  \ destination)\n{\n    string errorMessage = \"\";\n\n    // Copy all custom property\
  \ values from the source to the destination.\n    foreach(CustomProperty customProp\
  \ in source.CustomProperties)\n    {\n        if(destination.CustomProperties[customProp.Name]\
  \ != null)\n        {\n            try\n            {\n                destination.CustomProperties[customProp.Name].Value\
  \ =\n                    customProp.Value;\n            }\n            catch\n \
  \           {\n                errorMessage += \"Failed to copy custom property\
  \ value for Custom\"\n                    + \"Property:\" + customProp.Name + \"\
  <br>\";\n            }\n        }\n\n        // Throw a summary of all failed items\n\
  \        if (errorMessage != \"\")\n        {\n            throw(new Exception(errorMessage));\n\
  \        }\n    }\n}\n```\n\ntry-catch 块围绕设置自定义属性值的语句。这会捕获复制过程中可能发生的任何异常。由于自定义属性定义不是版本化的，可能会出现异常。例如，模板设计师可能向选择类型自定义属性定义中添加了新值。尝试保存不在当前列表中的值将生成异常。\n\
  \n页面还原对话框现已完成。\n\n## 向 Web Author 控制台添加新操作\n\n让我们在 Web Author 控制台上放置一个按钮，以便作者访问我们刚刚构建的页面还原对话框。当用户点击该按钮时，对话框将作为新窗口打开。\n\
  \n向项目添加一个名为 PageRevertButton.cs 的类文件。如果您使用的是来自本书配套网站的下载的 Tropical Green 项目，请将文件添加到\
  \ ConsoleButtons 文件夹。否则，只需将其添加到项目中的适当位置即可。\n\n添加以下命名空间：\n\n```\nusing System;\n\
  using Microsoft.ContentManagement.Publishing;\nusing Microsoft.ContentManagement.WebControls.ConsoleControls;\n\
  \nnamespace TropicalGreen.ConsoleButtons\n{\n    - - - code continues - - -\n}\n\
  ```\n\n为了方便作者，页面还原对话框将作为新窗口打开。因此，我们的控制台操作将继承自 BaseNewWindowAction 类。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_447_0.png)\n\
  \n点击 Revert Posting 链接，我们创建的页面还原对话框就会打开。选择任何修订上的 Revert 按钮即可还原帖子。如果一切顺利，屏幕上会出现以下消息：Page\
  \ Revert Succeeded。它必须在更改生效前得到批准，并且父窗口中的帖子会刷新以显示最新更新。关闭对话框。继续批准帖子以发布更改。\n\n> 而不是自动还原所有占位符内容，您可以增强对话框，为作者提供选择希望回滚哪些占位符的选项。\n\
  \n## 提示 #2：如何更改帖子的模板\n\n使用 MCMS 原生创建帖子的方法是首先选择模板，填写帖子的占位符内容并发布它。如果作者错误地选择了错误的模板会怎样？一些模板可能看起来非常相似，作者可能不知道模板一开始就不是正确的，仍然会发布它。\n\
  \n或者需求可能已经改变。为了最大限度地减少对当前站点的干扰，与当前模板并存的新模板已被构建。是时候重新启动站点了，需要大量帖子切换到新模板。如何以作者或开发人员付出最少努力的方式完成这项工作？\n\
  \n根据文档，您会发现帖子对象的 Template 属性是只读字段。一旦帖子被创建，模板与帖子之间的链接就是不可变的；没有简单的方法让帖子使用另一个模板。\n\n\
  为了规避这一限制，我们可以选择：\n\n- 继续使用当前模板，但覆盖现有的占位符定义、自定义属性定义或模板文件值。\n\n修改现有模板是最简单的解决方案，只要可能就应考虑。然而，在作者选择了错误模板的情况下，您确实需要让帖子指向另一个模板。这也意味着对模板的任何更改都会立即在服务器上看到——如果您在生产机器上更新模板，这不是一个好情况。在这种情况下，修改现有模板可能不是最好的主意。\n\
  \n\n\n\n\n在设计视图中，将以下控件拖放到表单上并按下方图所示排列。\n\n| Control | Property | Property Value\
