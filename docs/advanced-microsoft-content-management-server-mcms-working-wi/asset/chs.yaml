  \      \"NewTemplateGallery\");\n            ddlNewItem.Items.Add(li);\n       \
  \ }\n\n        // if the user has rights to create templates, add option to create\n\
  \        // a new template\n        if (templateGallery.CanCreateTemplates)\n```\n\
  \n```csharp\nMyObject.GetType().GetMethods();\n```\n\n要获取其属性列表，可以调用：\n\n```csharp\n\
  MyObject.GetType().GetProperties();\n```\n\n正如您所见，反射是一个强大的功能。在此示例中，而不是编写 40 多行代码来列出\
  \ ChannelItem 对象的属性，我们将简单地使用反射遍历每个属性并显示其值。\n\n让我们在 DataGrid 中显示属性列表。首先，向 CMSExplorer\
  \ 项目添加一个新的 Web 表单。将新 Web 表单命名为 Properties.aspx。切换到 HTML 视图并向表单添加几个标题以描述其功能：\n\n\
  ```html\n<form>\n<h1>Properties of <asp:Literal Runat=\"server\" ID=\"litCurrentItem\"\
  /></h1>\n<h2>List of all Properties and their values</h2>\n</form>\n```\n\n在 Web\
  \ 表单的代码隐藏文件中，导入 Microsoft.ContentManagement.Publishing 和 System.Reflection 命名空间，并在\
  \ Page_Load() 事件处理程序中添加以下代码：\n\n```csharp\n. . . code continues . . .\n// MCMS PAPI\n\
  using Microsoft.ContentManagement.Publishing;\n\n// for reflection\nusing System.Reflection;\n\
