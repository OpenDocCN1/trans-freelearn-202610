  \n## 在 MCMS 和 SharePoint 之间发布内容\n\n有了创作控件和一个用于查看我们进度的帖子，让我们继续为我们的占位符控件添加一些功能。无论帖子处于创作模式还是展示模式，我们都需要通过\
  \ SharePoint 列表服务 Web 服务检索 SharePoint 事件列表中的项目。为了访问此 Web 服务，我们需要服务的 URL、包含我们感兴趣的项目的列表的名称，以及该站点的有效登录凭据。\n\
  \n> 为简单起见，我们将对凭据进行硬编码。但是，我们强烈建议您采用更安全的解决方案，例如在站点的 Web.config 中加密用户名和密码，或允许内容所有者在占位符控件中与\
  \ URL 和列表名称一起输入凭据。Microsoft 建议使用 .NET 基类库中可用的数据保护 API（DPAPI）。\n\n由于我们需要在两种模式下都使用此功能，我们将创建一个名为\
  \ `GetSharePointListItems()` 的方法，它需要 Web 服务 URL 和列表名称，同时返回列表中所有项目的数组。对于返回数组中的每个项目，我们希望了解有关该事件的以下信息：\n\
  \n- Title\n- Description\n- Location\n- Start Date/Time\n- End Date/Time\n\n存储这些细节的最佳方式是在\
  \ `TropicalGreenControlLib` 项目中创建一个新类。将其命名为 `SharePointEventListItem.cs` 并添加以下代码以定义表示\
  \ SharePoint 事件列表中项目的业务对象：\n\n```\nusing System;\n\nnamespace TropicalGreenControlLib\n\
  {\n    public class SharePointEventListItem\n    {\n        private string _title;\n\
  \        private string _location;\n        private DateTime _startDateTime;\n \
  \       private DateTime _endDateTime;\n\n        // force callers to use the Factory\
  \ method below\n        private SharePointEventListItem() {}\n\n        // Factory\
  \ method used to create a new SharePointEventListItem\n        public static SharePointEventListItem\
  \ CreateItem(string title,\n            string location, DateTime start, DateTime\
  \ end)\n        {\n            SharePointEventListItem li = new SharePointEventListItem();\n\
  \            li._title = title;\n            li._location = location;\n        \
  \    li._startDateTime = start;\n            li._endDateTime = end;\n          \
  \  return li;\n        }\n    }\n```\n\n\n\n\n\n```csharp\n// title of the event\n\
  public string Title\n{\n    get\n    {\n        return _title;\n    }\n}\n\n// location\
  \ where the event will take place\npublic string Location\n{\n    get\n    {\n \
  \       return _location;\n    }\n}\n\n// datetime when the event will begin\npublic\
  \ DateTime StartDateTime\n{\n    get\n    {\n        return _startDateTime;\n  \
  \  }\n}\n\n// datetime when the event will end\npublic DateTime EndDateTime\n{\n\
  \    get\n    {\n        return _endDateTime;\n    }\n}\n}\n```\n\n现在我们已经有了包含列表中每个项目的对象，请将\
  \ GetSharePointEventListItems() 方法添加到占位符控件类的末尾，SharePointEventsPlaceholderControl.cs。此方法将使用指定的\
  \ URL 调用 SharePoint Web 服务，以检索指定列表中的所有项目。\n\n```csharp\nprivate ArrayList GetSharePointEventListItems(string\
  \ sharePointUrl,\n                                               string listName)\n\
  {\n    ArrayList wsResultArray = new ArrayList();\n\n    // make sure URL and list\
  \ name are provided\n    if ((sharePointUrl == string.Empty) || (listName == string.Empty))\n\
  \        return null;\n\n    // we hardcode the Web service credentials for simplicity\n\
  \    // You are strongly recommended to secure the login credentials\n    // in\
  \ the same way you'd secure any other credentials such\n    // as a database connection\
  \ string\n    // NOTE: You'll need to change the credentials to use an account on\
  \ your\n    // computer that has access to the SharePoint Web services and the\n\
  \    // specified list.\n    NetworkCredential nc = new\n        NetworkCredential(\"\
  administrator\", \"password\", \"MCMSBOOK\");\n\n    // create a reference to the\
  \ SharePoint List Service web service;\n    // assign the provided url and credentials\n\
  \    net.tropicalgreen.portal.Lists spWsList =\n        new TropicalGreenControlLib.net.tropicalgreen.portal.Lists();\n\
  ```\n\n```csharp\nresultItemNode.Attributes[\"ows_Location\"].Value.ToString(),\n\
  Convert.ToDateTime(resultItemNode.Attributes[\"ows_EventDate\"].Value.ToString()),\n\
  Convert.ToDateTime(resultItemNode.Attributes[\"ows_EndDate\"].Value.ToString())\n\
  );\nwsResultArray.Add(li);\n}\nreturn wsResultArray;\n}\n```\n\n在我们连接自定义占位符控件并预览事件之前，我们还需要一个最后的方法来渲染我们的\
  \ SharePoint 事件列表项。将以下方法添加到占位符控件类。此方法调用我们的 GetSharePointEventListItems() 方法以获取指定\
  \ SharePoint 列表中的所有项目。一旦获取到 SharePoint 列表的内容，它就会使用 HTML 将其渲染以供展示：\n\n```csharp\n\
  private void DisplaySharePointEventListItems(string spWsUrl, string spListName)\n\
  {\nSharePointEventListItem li;\n\n// make sure enough information provided in the\
  \ input boxes\nif ( (spWsUrl == string.Empty) || (spListName == string.Empty) )\n\
  return;\n\n// get the SharePoint items\nArrayList items = GetSharePointEventListItems(spWsUrl,\
  \ spListName);\n\n// verify results returned\nif (items == null)\nlitEventItemsLiteral.Text\
  \ = \"<p>No events at this time. Please check back later.</p>\";\nelse\n{\nlitEventItemsLiteral.Text\
  \ = string.Empty;\n\n// loop through each item in the list\nforeach (object o in\
  \ items)\n{\n// cast the object in the ArrayList as a SharePointEventListItem\n\
  li = o as SharePointEventListItem;\n\n// if the cast was successful, show the event\
  \ & increment the counter\nif (li != null)\n{\nlitEventItemsLiteral.Text += string.Format(\"\
  <p><b>{0}</b><br>{1}<br><em>{2} - {3}</em></p>\",\nli.Title, li.Location,\nli.StartDateTime.ToString(\"\
  MMM dd, yyyy h:ss tt\"),\nli.EndDateTime.ToString(\"MMM dd, yyyy h:ss tt\"));\n\
  }\n}\n}\n}\n```\n\n此时我们已经重写了 CreateAuthoringChildControls() 方法来创建我们的编辑控件，并创建了从 SharePoint\
  \ 事件列表检索和显示项目所需的所有方法。我们占位符控件编辑模式的最后两个任务是重写 LoadPlaceholderContentForAuthoring()\
  \ 方法，该方法从绑定到我们占位符控件的 XmlPlaceholder 对象检索先前保存的配置信息，以及重写 SavePlaceholderContent()\
  \ 方法，该方法将配置信息保存到底层的 XmlPlaceholder 对象中。\n\nLoadPlaceholderContentForAuthoring()\
  \ 方法将从绑定的 XmlPlaceholder 对象获取有关已配置 SharePoint 事件列表的信息，提取 SharePoint 列表服务 Web 服务\
  \ URL 和事件列表的名称，并调用我们的 DisplaySharePointEventListItems() 方法来显示列表的内容：\n\n```csharp\n\
  protected override void LoadPlaceholderContentForAuthoring(\n    PlaceholderControlEventArgs\
  \ e)\n{\n    EnsureChildControls();\n\n    XmlDocument placeholderContents = new\
  \ XmlDocument();\n    string sharePointUrl = string.Empty;\n    string spListName\
  \ = string.Empty;\n\n    // load the saved config from the posting\n    placeholderContents.LoadXml(((XmlPlaceholder)this.BoundPlaceholder)\n\
  \        .XmlAsString);\n\n    // extract the necessary information\n    sharePointUrl\
  \ = placeholderContents.DocumentElement.ChildNodes[0]\n        .Attributes[\"sharePointUrl\"\
  ].Value;\n    spListName = placeholderContents.DocumentElement.ChildNodes[0]\n \
  \       .Attributes[\"listName\"].Value;\n\n    // bind the config info to the text\
  \ boxes\n    txbSharePointUrl.Text = sharePointUrl;\n    txbListName.Text = spListName;\n\
  \n    // show the items\n    DisplaySharePointEventListItems(sharePointUrl, spListName);\n\
  }\n```\n\nSavePlaceholderContent() 方法将创建一个包含 Web 服务 URL 和列表名称的小型 XML 字符串并将其插入到绑定的占位符中：\n\
  \n```csharp\nprotected override void SavePlaceholderContent(PlaceholderControlSaveEventArgs\
  \ e)\n{\n    string config = string.Empty;\n\n    // make sure enough information\
  \ is provided in the input boxes\n    if ((txbSharePointUrl.Text == string.Empty)\n\
  \        || (txbListName.Text == string.Empty))\n        return;\n\n    // save\
  \ the config information\n    config = string.Format(\"<config><sharepointlist sharePointUrl=\\\
  \"{0}\\\"\"\n        + \" listname=\\\"{1}\\\" /></config>\",\n        txbSharePointUrl.Text,\
  \ txbListName.Text);\n\n    ((XmlPlaceholder)this.BoundPlaceholder).XmlAsString\
  \ = config;\n}\n```\n\n让我们看看我们的控件在编辑模式下是什么样子。构建 TropicalGreenControlLib 项目，打开浏览器并导航到\
  \ http://www.tropicalgreen.net/TropicalGreen/Events.htm。如果您尚未登录，请继续登录。登录后，单击 Web\
  \ Author Console 中的 Switch To Edit Site 链接，然后单击 Edit 以切换到帖子的编辑模式。输入以下内容到两个输入框中，然后在\
  \ Web Author Console 中单击 Save and Exit：\n\n| 名称 | 值 |\n|---|---|\n| SharePoint Portal\
  \ Site URL | http://portal.tropicalgreen.net |\n| SharePoint Event List Name | Events\
  \ |\n\n现在我们只需要连接另外两个方法，使用 `CreatePresentationChildControls()` 创建并填充我们占位符控件的展示控件，从绑定的占位符获取有关已配置\
  \ SharePoint 事件列表的信息，并调用 `DisplaySharePointEventListItems()` 来使用名为 `LoadPlaceholderContentForPresentation()`\
  \ 的方法显示项目：\n\n```csharp\nprotected override void CreatePresentationChildControls\n\
  \    (BaseModeContainer presentationContainer)\n{\n    litEventItemsLiteral = new\
  \ LiteralControl();\n    presentationContainer.Controls.Add(litEventItemsLiteral);\n\
  }\n\nprotected override void LoadPlaceholderContentForPresentation\n    (PlaceholderControlEventArgs\
