  \ enumwppacks 选项现在报告了什么（同时确认 Web 部件已安装）。输入 stsadm.exe -o enumwppacks。您应该会看到以下内容：\n\
  \n\n现在我们已经安装了连接器 Web 部件，让我们逐一了解它们。\n\n## MCMS 页面列表 Web 部件\n\nMCMS 页面列表 Web 部件显示指定频道中的帖子。将此\
  \ Web 部件添加到 SharePoint Web 部件页面后，您需要指定包含要显示的帖子的 MCMS 站点根 URL 和频道路径。拥有修改 Web 部件设置相应权限的用户还可以指定每页显示的帖子数、帖子的排序顺序以及他们希望如何显示或查看列表。\n\
  \n让我们将 MCMS 页面列表 Web 部件添加到 SharePoint Web 部件页面，看看效果如何。\n\n- 1. 在 Internet Explorer\
  \ 中导航至 SharePoint 门户。我们将使用附录 A 中创建并在第 5 章用于搜索的门户：http://portal.tropicalgreen.net。\n\
  - 2. 单击左侧垂直“操作”菜单中的“编辑页面”链接：\n- 3. 页面处于编辑模式后，单击左上角的“修改共享页面”链接。在出现的动态下拉菜单中，选择“添加\
  \ Web 部件”，然后选择“浏览”。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_178_0.png)\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_178_1.png)\n\
  \n- 4. 当 SharePoint Web 部件工具窗格在浏览器右侧加载时，它会列出门户 Web 部件库中的所有 Web 部件（在我们的例子中是 Tropical\
  \ Green 库）。当您在 SharePoint 站点（SPS 或 WSS）中安装 Web 部件时，它们会被添加到虚拟服务器库。由于我们安装了连接器附带的 Web\
  \ 部件，因此需要通过单击选择虚拟服务器库。\n\n### 什么是 SharePoint Web 部件工具窗格？\n\nSharePoint Web 部件工具窗格是\
  \ SharePoint Web 部件页面上的一个任务窗格，用于从 Web 部件库添加 Web 部件，以及修改自定义和通用 Web 部件属性。\n\n### 为什么我们安装的\
  \ Web 部件位于虚拟服务器库中？\n\n当您安装 Web 部件时，实际上是在将其安装到特定的虚拟服务器。即使您选择将其安装到所有站点或全局程序集缓存中，也会在每个虚拟服务器中添加记录，以告知该虚拟服务器中的\
  \ SharePoint 门户（或站点）可以使用该 Web 部件。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_179_0.png)\n\
  \n- 5. 现在，您应该会在“添加 Web 部件”工具窗格中看到连接器附带的三个 Web 部件，如前面的图像所示。选择 MCMS 页面列表，将其拖到页面上，放置在顶部区域，如下图所示：\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_179_1.png)\n\n```\nleft:-10px;\\\"> {0}</span><br>\"\
