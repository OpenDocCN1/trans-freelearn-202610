  \ ButtonType=\"LinkButton\" EditText=\"Edit\">\n<asp:EditCommandColumn>\n<asp:TemplateColumn></asp:TemplateColumn>\n\
  </Columns>\n```\n\n点击编辑按钮时，我们将 DataGrid1 的 EditItemIndex 设置为所选行的索引。在 DataGrid1 的事件属性窗口中，双击\
  \ EditCommand 以注册事件处理程序并添加以下代码：\n\n```csharp\nprivate void DataGrid1_EditCommand(object\
  \ source,\nSystem.Web.UI.WebControls.DataGridCommandEventArgs e)\n{\n    DataGrid1.EditItemIndex\
  \ = e.Item.ItemIndex;\n    BindData();\n}\n```\n\n同时，我们希望显示可在所选对象上执行的操作列表。这由 AddActionItems()\
  \ 方法完成。该方法为上表中定义的每个操作项创建超链接。AddActionItems() 方法接受两个输入参数：\n\n- 一个名为 actionCell 的\
  \ TableCell。这是要添加操作按钮的单元格。\n- 一个名为 hlItem 的 HierarchyItem。这是我们为其创建操作按钮的项目。\n\n确定传递给\
  \ AddActionItems() 方法的对象类型后，我们为当前对象添加类型特定的操作按钮。例如，如果传递了一个发布项，则会添加复制和移动按钮。\n\n除了类型特定的选项外，还会向菜单中添加一个适用于所有对象的属性按钮。最后，我们将检查用户是否有权限删除当前对象，如果有，则添加删除按钮。\n\
  \n请注意，我们使用 PrepareUrl() 方法生成的 URL 将其分配给每个操作按钮的 NavigateUrl 属性。在 DataGrid1_EditCommand()\
  \ 事件处理程序下方添加 AddActionItems() 方法：\n\n```csharp\nprivate void AddActionItems(TableCell\
  \ actionCell, HierarchyItem hlItem)\n{\n    if (hlItem is Posting)\n    {\n    \
  \    Posting currentPosting = hlItem as Posting;\n        // actions for postings\
  \ include:\n        // Copy, Move, Create Connected Posting.\n\n        // the copy\
  \ option\n        HyperLink hCopy = new HyperLink();\n        hCopy.Text = \"Copy<br>\"\
  ;\n        hCopy.Target = \"_blank\";\n        hCopy.NavigateUrl = PrepareUrl(hlItem,\
  \ PublishingMode.Update,\n            \"CopyPosting.aspx\");\n        actionCell.Controls.Add(hCopy);\n\
  \n        // the move option\n        if (currentPosting.CanMove)\n        {\n \
  \       }\n\n        // add shared options include:\n        // Properties and Delete.\n\
  \n        // the properties option\n        HyperLink hProperties = new HyperLink();\n\
  \        hProperties.Text = \"Properties<br>\";\n        hProperties.Target = \"\
  _blank\";\n        hProperties.NavigateUrl = PrepareUrl(hItem, PublishingMode.Update,\n\
  \                                    \"Properties.aspx\");\n\n        actionCell.Controls.Add(hProperties);\n\
  \n        // the delete option\n        if (hItem.CanDelete)\n        {\n      \
  \      HyperLink hDelete = new HyperLink();\n            hDelete.Text = \"Delete<br>\"\
  ;\n            hDelete.Target = \"_blank\";\n            hDelete.NavigateUrl = PrepareUrl(hItem,\
  \ PublishingMode.Update,\n                                     \"Delete.aspx\");\n\
  \n            actionCell.Controls.Add(hDelete);\n        }\n    }\n}\n```\n\n> 如果在测试上述代码时收到\
  \ JavaScript 错误消息，您可能需要将打开的表单标签中的 ID 更改为其他名称，例如 \"CMSExplorerDefault\"，因为浏览器可能不喜欢\
  \ Visual Studio .NET 分配给表单的 ID \"default\"。\n\n保存并构建解决方案，然后导航到 **http://localhost/CmsExplorer**。此时，您可以通过点击频道名称浏览频道，并查看我们的操作菜单。\n\
  \n接下来我们需要的是一个工具栏，用于从当前选择的父容器中向上移动一级层级、刷新页面，以及选择除频道之外的其他根路径，例如模板或资源。\n\n## 构建工具栏\n\
  \n网格顶部的灰色条是工具栏。它将由六个控件组成：\n\n- 将用户带回频道层级上一级的向上按钮\n- 更新显示的刷新按钮\n- 包含创建新频道、发布、模板、模板库或资源的选项的\
  \ DropDownList\n- 用于浏览可用频道和发布的 Channels 按钮\n- 用于浏览可用模板库和模板的 Templates 按钮\n- 用于浏览可用资源库和资源的\
