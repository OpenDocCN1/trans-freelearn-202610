  \n我们向 DataGrid 添加了两列新列，一列用于显示编辑按钮，另一列用于包含可能的动作列表。\n\n```xml\n<Columns>\n<asp:TemplateColumn>\n\
  <ItemTemplate></ItemTemplate>\n</asp:TemplateColumn>\n<asp:TemplateColumn HeaderText=\"\
