  \ LoadPlaceholderContentForAuthoring()：\n\n```\nprotected override void LoadPlaceholderContentForAuthoring\n\
  \        (PlaceholderControlEventArgs e)\n{\n    EnsureChildControls();\n    try\n\
  \    {\n        if (WebAuthorContext.Current.Mode == WebAuthorContextMode.AuthoringNew)\n\
  \        {\n            // The default value of the control is the current date\
  \ and time\n            txtAuthoring.Text = DateTime.Now.ToString(\"dd MMM yyyy\
  \ HH:mm\");\n        }\n        else\n        {\n            txtAuthoring.Text =\
  \ ((HtmlPlaceholder)this.BoundPlaceholder).Text;\n        }\n    }\n    catch(Exception\
  \ ex)\n    {\n        lblMessage.Text = \"Failed to load placeholder content: \"\
  \ + ex.Message;\n    }\n}\n```\n\n## 保存日期和时间\n\n当帖子保存时，我们读取存储在 TextBox 中的值，并将其写入底层的\
  \ HtmlPlaceholder。任何异常都会通过 try-catch 块捕获，并在屏幕上显示详细的错误消息。将重写的 SavePlaceholderContent()\
  \ 方法添加到代码中：\n\n```\nprotected override void SavePlaceholderContent(PlaceholderControlSaveEventArgs\
  \ e)\n{\n    EnsureChildControls();\n    try\n    {\n        ((HtmlPlaceholder)this.BoundPlaceholder).Html\
  \ = txtAuthoring.Text;\n    }\n    catch(Exception ex)\n    {\n```\n\n## 验证日期和时间\n\
  \n为了确保只保存有效的日期，我们将重写 OnSavingContent() 方法。我们通过尝试将 TextBox 中存储的字符串转换为 DateTime 对象来检查要保存的值是否为有效日期。如果是有效日期，就不会引发异常。否则，我们捕获异常，保存操作可以被取消。\n\
  \n```\nprotected override void OnSavingContent(PlaceholderControlSavingEventArgs\
  \ e)\n{\n    try\n    {\n        DateTime.Parse(txtAuthoring.Text.Trim());\n   \
  \     base.OnSavingContent(e);\n\n        // Clear any messages on the screen\n\
  \        lblMessage.Text = \"\";\n    }\n    catch(Exception ex)\n    {\n      \
  \  e.Cancel = true;\n        lblMessage.Text = ex.Message;\n    }\n}\n```\n\n##\
  \ 显示选中的日期和时间\n\n在展示模式下，选中的日期和时间显示在屏幕上的一个 Label 控件中。让我们重写 CreatePresentationChildControls()\
  \ 方法，并向展示容器中添加一个 Label 控件。\n\n```\nprivate Label lblPresentation;\n\nprotected override\
  \ void CreatePresentationChildControls(\n        BaseModeContainer presentationContainer)\n\
  {\n    lblPresentation = new Label();\n    presentationContainer.Controls.Add(lblPresentation);\n\
  }\n```\n\n存储在底层 HtmlPlaceholder 中的先前保存的日期和时间值会从内容仓库中检索出来，并显示在之前加载的 Label 控件中。添加重写的\
  \ LoadPlaceholderContentForPresentation() 方法，如下所示：\n\n```\nprotected override void\
  \ LoadPlaceholderContentForPresentation\n        (PlaceholderControlEventArgs e)\n\
  {\n    EnsureChildControls();\n    try\n    {\n        lblPresentation.Text = ((HtmlPlaceholder)this.BoundPlaceholder).Text;\n\
  \    }\n    catch(Exception ex)\n    {\n        lblPresentation.Text = ex.Message;\n\
  \    }\n}\n```\n\n日期时间选择器占位符控件已完成。接下来，让我们构建用于选择日期和时间的对话框。\n\n## 日期和时间选择器对话框\n\n\
