  }\n\n#endregion\n```\n\n现在我们已经定义了用于加载 MCMS 对象（如模板、占位符和自定义属性）的属性，我们将添加 Save() 方法以将属性值或集合的任何更改保存到\
  \ MCMS。Save() 方法会检查 DisplayName 或 Name 是否已更改，如果已更改则会覆盖 Posting 对象的相应值。然后它会在 Placeholders\
  \ 属性上调用 Save() 方法以保存每个占位符的值。然后提交发布并提交事务。\n\n```csharp\n#region Save\n/// <summary>\n\
  /// Save the Lightweight posting object's properties\n/// and collections to the\
  \ MCMS database.\n/// </summary>\npublic void Save()\n{\n    // Check if the display\
  \ name has changed\n    if (this.DisplayName != this.CmsPosting.DisplayName)\n \
  \   {\n        // it has changed - apply the change to the posting object\n    \
  \    this.CmsPosting.DisplayName = this.DisplayName;\n    }\n\n    // Check if the\
  \ posting name has changed\n    if (this.Name != this.CmsPosting.Name)\n    {\n\
  \        // it has changed - apply the change to the posting object\n        this.CmsPosting.Name\
  \ = this.Name;\n    }\n\n    // Save the placeholders collection passing in the\
  \ current posting\n    this.Placeholders.Save(this.CmsPosting);\n\n    // Can we\
  \ submit the posting?\n    if (this.CmsPosting.CanSubmit)\n    {\n        // Yes,\
  \ submit it\n        this.CmsPosting.Submit();\n\n        // Commit the transaction\n\
  \        this.CurrentCmsContext.CommitAll();\n    }\n\n    // Dispose of the current\
  \ CMS Context\n    this.CurrentCmsContext.Dispose();\n}\n#endregion\n```\n\nLightweightPosting\
  \ 对象现在应如下所示：\n\n5. 删除以下代码，因为我们不再需要它：\n\n```csharp\n// WEB SERVICE EXAMPLE\n// The\
  \ HelloWorld() example service returns the string Hello World\n// To build, uncomment\
  \ the following lines then save and build the project\n// To test this web service,\
  \ press F5\n\n//     [WebMethod]\n//     public string HelloWorld()\n//     {\n\
  //         return \"Hello World\";\n//     }\n```\n\n## The GetPosting() Web Method\n\
  \n现在让我们定义 GetPosting() Web 方法，它将从 MCMS 填充我们的自定义 LightweightPosting 对象之一。GetPosting()\
  \ 必须具有 [WebMethod] 属性才能通过 Web 服务访问。如果 strPath 参数为空字符串，我们将初始化一个空的 LightweightPosting\
  \ 对象，以便序列化完整的对象模型。\n\n```csharp\n/// <summary>\n/// Gets a Lightweight posting and\
  \ all the properties by path\n/// </summary>\n/// <param name=\"strPath\">Path of\
  \ the posting</param>\n/// <returns>LightweightPosting</returns>\n[WebMethod]\n\
  public LightweightPosting GetPosting(string strPath)\n{\n    // Did we pass in a\
  \ path?\n    if (strPath == \"\")\n    {\n        // Define a lightweight posting\
  \ object\n        LightweightPosting _lightweightPosting = new LightweightPosting();\n\
  \n        // Initialize the Custom Properties, Placeholders and Template\n     \
  \   _lightweightPosting.CustomProperties =\n            new LightweightCustomPropertyCollection();\n\
  \        _lightweightPosting.Placeholders =\n            new LightweightPlaceholderCollection();\n\
  \        _lightweightPosting.Template = new LightweightTemplate();\n\n        //\
  \ Create an empty placeholder\n        LightweightPlaceholder _placeholder = new\
  \ LightweightPlaceholder();\n\n        // Load an empty string into the Value property\n\
  \        _placeholder.Value = _placeholder.LoadXHTML(\"\");\n\n        // Add the\
  \ placeholder to the collection\n        _lightweightPosting.Placeholders.Add(_placeholder);\n\
  \n        // Return the posting object\n        return(_lightweightPosting);\n \
  \   }\n    else\n    {\n        // Declare a Posting object\n        Posting _posting\
  \ = null;\n\n        // Create the new application context\n        CmsApplicationContext\
  \ cmsContext = new CmsApplicationContext();\n\n        // We need to get the identity\
  \ of the current user\n        WindowsIdentity ident = System.Web.HttpContext.Current.User.Identity\n\
  \            as WindowsIdentity;\n\n        try\n        {\n            // Authenticate\
  \ into update mode\n            cmsContext.AuthenticateUsingUserHandle(ident.Token,\n\
  \                    PublishingMode.Update);\n        }\n        catch(Exception\
  \ ex)\n        {\n            // Dispose the CMS Context\n            cmsContext.Dispose();\n\
  \n            throw new Exception(\"Failed to Authenticate user by handle. \"\n\
  \                    + \"The user may not have author permissions.\", ex);\n   \
  \     }\n\n        // Get the MCMS Posting object by path\n        _posting = (Posting)cmsContext.Searches.GetByPath(strPath);\n\
  \n        // Verify the posting was found\n        if (_posting == null)\n     \
  \   {\n            // Dispose the CMS Context\n            cmsContext.Dispose();\n\
  \n            throw new Exception(\"The posting was not found at path \\\"\"\n \
  \                   + strPath + \"\\\";\");\n        }\n\n        // Instantiate\
  \ the Lightweight posting passing\n        // in the MCMS posting to the constructor.\n\
  \        LightweightPosting _LightweightPosting = new LightweightPosting(_posting);\n\
  \n        // Dispose the CMS Context\n        cmsContext.Dispose();\n\n        //\
  \ Return the Lightweight posting\n        return(_LightweightPosting);\n    }\n\
  }\n```\n\n## Configuring IIS Security\n\n由于我们使用当前用户的 Windows 身份来验证 CmsApplicationContext，我们应验证对该\
  \ Web 服务的匿名访问已禁用。\n\n1. 在 web.config 文件中，验证 authentication 元素是否设置为：`<authentication\
  \ mode=\"Windows\" />`\n2. 在 Internet Information Services (IIS) 管理控制台中，右键单击 McmsAuthoringWebService\
  \ 虚拟目录并选择 Properties。\n3. 选择 Directory Security 选项卡。\n4. 在 Anonymous access and\
  \ authentication control 下，选择 Edit。\n5. 取消选中 Anonymous access 并选中 Integrated Windows\
  \ authentication。\n6. 单击 OK 并关闭所有打开的对话框。\n7. 关闭 IIS 管理控制台。\n\n## Testing the Web\
  \ Service\n\n要进行测试，我们可以通过在 Solution Explorer 中右键单击 authoring.asmx 并选择 Set As Start\
  \ Page，将 Web 服务设置为项目的起始页。然后通过按 Control-F5 或从 Debug 菜单中选择 Start Without Debugging\
  \ 以不调试的方式启动。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_392_0.png)\n\n我们现在应该会看到\
  \ ASP.NET Web 服务测试页，列出 GetPosting 作为唯一可用的 Web 方法：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_392_1.png)\n\
  \n我们使用的示例站点是 Tropical Green 站点，可从 Packt 网站上本书的代码下载部分获取。\n\n如果现在单击 GetPosting，您将看到参数\
  \ strPath 的文本框。输入 `/channels/www.tropicalgreen.net/PlantCatalog/AloeVera` 到该框中并单击\
