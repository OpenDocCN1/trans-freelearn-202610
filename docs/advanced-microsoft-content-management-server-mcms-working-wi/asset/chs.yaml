  \n在 `Page_Load()` 事件处理程序下方，添加 `ListProperties()` 方法。该方法首先创建一个包含以下列的 `DataTable`：\n\
  \n+   - 属性名称\n+   - 属性值\n+   - 该属性是否可以写入\n\n我们使用 `GetType.GetProperties()` 方法检索与层次结构项关联的所有属性的集合。接下来，遍历当前\
  \ `ChannelItem` 的每个属性，并将每个属性作为一行添加到 `DataTable` 中。请注意，属性值是通过调用 `PropertyInfo.GetValue()`\
  \ 并将层次结构项作为输入参数传递来获取的。最后，我们将 `DataTable` 绑定到 `DataGrid`。\n\n在 `Page_Load()` 事件处理程序中，添加代码以读取当前层次结构项的\
  \ Description（描述）并将其显示在屏幕上。\n\n```\nprivate void Page_Load(object sender, System.EventArgs\
  \ e)\n{\n    // Put user code to initialize the page here\n    CmsHttpContext cmsContext\
  \ = CmsHttpContext.Current;\n    hlItem = null;\n\n    string cmsObjectGuid = \"\
  \";\n    if (Request.QueryString[\"CMSObjectGuid\"] != null)\n    {\n        //\
  \ template gallery items and resource gallery items\n        cmsObjectGuid = Request.QueryString[\"\
  CMSObjectGuid\"];\n        hlItem = cmsContext.Searches.GetByGuid(cmsObjectGuid);\n\
  \    }\n    else\n    {\n        // channels and postings\n        hlItem = cmsContext.ChannelItem;\n\
  \    }\n\n    // list all properties and their values in the grid\n    if (hlItem\
  \ != null)\n    {\n        litCurrentItem.Text = hlItem.Path;\n        if (!Page.IsPostBack)\n\
  \        {\n            txtDescription.Text = hlItem.Description;\n        }\n \
  \       ListProperties();\n    }\n}\n```\n\n切换到设计模式并双击 `btnUpdate` 按钮。在 `btnUpdate_OnClick()`\
  \ 事件处理程序中，我们将编写代码，根据在文本框中输入的文本更新 `HierarchyItem` 的 `Description` 属性值。\n\n```\nprivate\
  \ void btnUpdate_Click(object sender, System.EventArgs e)\n{\n    try\n    {\n \
  \       // IMPORTANT: You must be in update mode for the code to work\n\n      \
  \  // update the description\n        hlItem.Description = txtDescription.Text;\n\
  \n        // commit the change\n        CmsHttpContext.Current.CommitAll();\n\n\
  \        // refresh the page to ensure that the change shows up in the\n       \
  \ // datagrid\n        Response.Redirect(HttpContext.Current.Request.Url.ToString());\n\
  \    }\n    catch(Exception ex)\n    {\n        CmsHttpContext.Current.RollbackAll();\n\
  \n        // after a rollback the CMS context needs to be disposed.\n        CmsHttpContext.Current.Dispose();\n\
  \n        lblErrorMessage.Text = ex.Message;\n    }\n}\n```\n\n请注意，在调用 `CommitAll()`\
  \ 之前，频道不会被永久创建。\n\n> > 尽管我们只设置了新频道的选定属性，但您可以轻松扩展界面，以包含频道对象的所有可写属性。\n\n完成后，保存并生成项目。\n\
  \n## 验证名称\n\nMCMS 在命名对象时应用以下规则：\n\n+   - 名称只能包含以下字符：\n+     - A-Z a-z 0-9（仅字母数字）\n\
  +     - _（下划线）\n+     - -（连字符）\n+     - （空格）\n+     - ()（左括号和右括号）\n+     - .（句点）\n\
  +   - 名称不能以句点结尾。\n+   - 名称不能包含两个连续的句点。\n\n为了确保赋予频道、发布、模板库、模板和资源的所有名称都有效，我们将定义一个名为\
  \ `ValidateMCMSObjectName()` 的自定义方法。该方法接受对象的名称作为输入参数，并返回一个布尔值。返回值为 `true` 表示用户提供的名称满足\
  \ MCMS 的所有要求并且有效。\n\n由于我们将向 CMS Explorer 添加用于创建各种 MCMS 对象的对话框，因此我们将把 `ValidateMCMSObjectName()`\
  \ 方法添加到类文件 `Utility.cs` 中。这样，我们就可以在项目中的所有 Web 窗体之间重用该方法。\n\n+   1. 向项目添加一个类文件。将文件命名为\
  \ `Utility.cs`。\n+   2. 在命名空间声明上方，添加 `System.Text.RegularExpressions`。\n\n```\n\
  using System;\nusing System.Text.RegularExpressions;\nnamespace CMSExplorer\n{\n\
  \    - - - code continues - - -\n}\n```\n\n+   3. 在 `Utility()` 构造函数正下方，添加 `ValidateMCMSObjectName()`\
  \ 方法：\n\n```\npublic static bool ValidateMCMSObjectName(string name)\n{\n    bool\
  \ isValid;\n\n    // test for other characters as the ones in the list\n    Regex\
  \ regEx1 = new Regex(@\"[^A-Z0-9 _\\-()\\.]\",\n                             RegexOptions.IgnoreCase);\n\
  ```\n\n```\n// test for \".\" at the end\nRegex regEx2 = new Regex(@\"[\\\\.]$\"\
  , RegexOptions.None);\n\n// test for double \".\"\nRegex regEx3 = new Regex(@\"\\\
  \\.{2}\", RegexOptions.None);\n\nMatch match1 = regEx1.Match(name);\nMatch match2\
  \ = regEx2.Match(name);\nMatch match3 = regEx3.Match(name);\n\n// valid = no invalid\
  \ chars, no double dot, and no dot at the end\nisValid = !match1.Success && !match2.Success\
  \ && !match3.Success;\n\nreturn isValid;\n}\n```\n\n`ValidateMCMSObjectName()` 方法使用三个正则表达式来检查名称的有效性。\n\
  \n第一个正则表达式如下所示：\n\n```text\n[^A-Z0-9 _\\\\ (.-]\n```\n\n该模式用于查找名称中所有不属于字母数字、空格、下划线、左括号和右括号、句点和连字符的字符（请注意，反斜杠字符用作转义字符），从而满足有效名称的第一个条件。\n\
  \n第二个正则表达式测试名称是否以句点结尾：\n\n```text\n[\\\\.]$\n```\n\n同样，反斜杠用作转义字符。方括号之间的句点表示我们要查找句点。美元符号指示该模式匹配字符串的末尾。\n\
  \n第三个也是最后一个正则表达式测试字符串中是否有两个连续的句点：\n\n```text\n\\\\.{2}\n```\n\n和之前一样，反斜杠用作转义字符。大括号中的数字\
  \ 2 表示我们要查找连续出现两次的句点。\n\n最后，我们运行所有三个正则表达式。只要没有无效字符，名称末尾没有句点，也没有连续的句点，该名称就被视为有效。\n\
  \n要在对话框中使用 `ValidateMCMSObjectName()` 方法，我们只需在代码中调用它。以下是 Create Channel 对话框的实现方法。将以下代码添加到\
  \ `btnCreate_Click()` 事件处理程序中：\n\n```csharp\nprivate void btnCreate_Click(object\
  \ sender, System.EventArgs e)\n{\n    - - - code continues - - -\n\n    try\n  \
  \  {\n        - - - code continues - - -\n\n        // get the name of the channel\n\
  \        string Name = txtName.Text.Trim();\n\n        // check to see if the name\
  \ is valid\n        if (!Utility.ValidateMCMSObjectName(Name))\n```\n\n```\n{\n\
  \    throw new Exception(\"Specified channel name is not \"\n        + \"valid.\
  \ Must be only alphanumeric \"\n        + \"characters, open or close parens, \"\
  \n        + \"hyphens, underscores, periods, or \"\n        + \"spaces. No period\
  \ at the end and no \"\n        + \"consecutive periods are allowed.\");\n}\n\n\
  // create the new channel\nChannel newChannel;\nnewChannel = parentChannel.CreateChannel();\n\
  }\n    - - - code continues - - -\ncatch(Exception ex)\n{\n    - - - code continues\
  \ - - -\n}\n```\n\n如果 `ValidateMCMSObjectName()` 检测到名称无效，我们将抛出一个异常。保存并生成项目。\n\n\
