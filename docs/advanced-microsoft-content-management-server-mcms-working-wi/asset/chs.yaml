  \ make it easier to find\n    content = content.Replace(\"\\t\", \" \").Replace(\"\
  \\n\", \" \").Replace(\"\\r\", \" \");\n    // Get attachments\n\n    // Start searching\
  \ for attachments!\n    FindAttachment(ref content, \"base\", \"href\");\n    FindAttachment(ref\
  \ content, \"a\", \"href\");\n    FindAttachment(ref content, \"link\", \"href\"\
  );\n    FindAttachment(ref content, \"script\", \"src\");\n    FindAttachment(ref\
  \ content, \"xml\", \"src\");\n    FindAttachment(ref content, \"img\", \"src\"\
  );\n    FindAttachment(ref content, \"frame\", \"src\");\n    FindAttachment(ref\
  \ content, \"iframe\", \"src\");\n    FindAttachment(ref content, \"embed\", \"\
  src\");\n    FindAttachment(ref content, \"body\", \"background\");\n    FindAttachment(ref\
  \ content, \"td\", \"background\");\n    FindAttachment(ref content, \"th\", \"\
  background\");\n    FindAttachment(ref content, \"table\", \"background\");\n  \
  \  FindAttachment(ref content, \"layer\", \"background\");\n}\n```\n\n当然，根据作者使用的标签，上面的列表可能并不详尽。请随意向列表中添加更多标签和属性。\n\
  \nFindAttachment() 方法接受三个输入参数：\n\n- **input**: 正在扫描的页面的 HTML\n- **tagName**: 要查找的标签，例如\
  \ <img>\n- **attribute**: 存储附件 URL 的属性，例如 src\n\n它会在内容中查找该标签的所有实例。例如，当它找到一个 <img>\
  \ 标签时，它会使用 ExtractUrlFromTag() 方法从其 src 属性中提取 URL（稍后定义）。\n\n如果成功提取到 URL，则会使用 AddToUrlList()\
  \ 辅助函数将其添加到 URL 列表中（也稍后定义）。\n\n<base> 标签是单独处理的。之前我们讨论过，<base> 标签由 RobotMetaTag 注入到所有帖子中。浏览器通过在其\
  \ href 属性的值前加上前缀来解释所有相对链接。如果 FindAttachment() 看到 <base> 标签，它会调用 SetBaseUrl() 例程，该例程将提取的\
  \ URL 存储在 m_LocalBaseUrl 变量中，以便稍后在下载相对链接时使用。\n\n将 FindAttachment() 方法添加到类中：\n\n\
  ```\nprivate static void FindAttachment(ref string input, string tagName,\n    string\
  \ attribute)\n{\n    // Pattern that extracts all tags with the specified tagName\n\
  \    string pattern = @\"<\\s*\" + tagName + @\"\\b[^>]*>\";\n    // The regular\
  \ expression that finds all the tags\n    Regex findTags = new Regex(pattern, RegexOptions.IgnoreCase);\n\
  \    foreach (Match tag in findTags.Matches(input))\n    {\n        // Extract the\
  \ URL from each tag based on the specified attribute\n        string url = ExtractUrlFromTag(tag.Value,\
  \ attribute);\n        // We have successfully extracted a URL\n```\n\nSetBaseUrl()\
  \ 例程处理 <base> 标签。<base> 标签通常嵌入在 <head> 标签之间。以下是一个 <base> 标签的示例：\n\n```\n<base href=\"\
  http://tropicalgreen/TropicalGreen/Templates/Plant.aspx?NRMODE=Published&NRORIGINALURL=%2fPlantCatalog%2fAloeVera%2ehtm&NRNODEGUID=%7b569D1CCA-9A9D-4C43-B0C3-DB1AACD98684%7d&NRCACHEHINT=NoModifyGuest\"\
  >\n```\n\n请注意，模板文件的 URL 存储在其 href 属性中。浏览器会将此 href 值添加到页面中找到的所有相对链接中。在 SetBaseUrl()\
  \ 方法中，我们将提取 <base> 标签的 href 属性的值并将其存储在 m_LocalBaseUrl 变量中。稍后，我们将使用此值来构造页面上找到的相对附件的实际\
  \ URL。\n\n```\nprivate static void SetBaseUrl(string url)\n{\n    if (url.IndexOf(\"\
  ?\") > -1)\n    {\n        url = url.Substring(0,url.IndexOf(\"?\"));\n    }\n \
  \   if (!url.EndsWith(\"/\"))\n    {\n        object o = cmsContext.Searches.GetByUrl(url);\n\
  \        if (o != null)\n        {\n            if (o is Channel)\n            {\n\
  \                url += \"/\";\n            }\n        }\n    }\n    url = url.Substring(0,url.LastIndexOf(\"\
  /\")+1);\n    if (url.StartsWith(\"http://\"))\n    {\n        url = url.Remove(0,7);\
  \  // remove \"http://\"\n        url = url.Remove(0,(url+\"/\").IndexOf(\"/\"));\n\
  \    }\n    m_LocalBaseUrl = url;\n}\n```\n\n## 将附件信息存储到列表中\n\n一旦找到附件，我们就会将其 URL\
  \ 和格式类型记录到 ArrayList 中。在这样做之前，我们会准备 URL 并运行多个检查以查看其是否有效。我们将在 AddToUrlList() 方法中完成所有这些操作。\n\
  \n首先，删除书签。书签示例包括“返回顶部”类型的超链接，通常看起来像这样： <a href=\"somepage.htm#Top\">。由于书签是指向页面本身位置的定位标记，我们可以将其从\
  \ URL 中删除，仍然能够下载该页面。将 AddToUrlList() 方法添加到类中：\n\n```\nprivate static void AddToUrlList(string\
  \ url)\n{\n    // Remove internal bookmarks from the URL\n    string origUrl = url;\n\
  \    if (url.IndexOf(\"#\") >= 0)\n    {\n        url = url.Substring(0, url.IndexOf(\"\
  #\"));\n    }\n}\n```\n\n所有相对 URL 都必须转换为绝对 URL，以便可以下载和分期。我们使用在 <base> 标签中找到的值，如果找到的话。\n\
  \n```\nprivate static void AddToUrlList(string url)\n{\n    ... code continues ...\n\
  \    // Convert Relative URLs to Absolute URLs\n    if (!url.StartsWith(\"/\"))\n\
  \    {\n        url = m_LocalBaseUrl + url;\n    }\n}\n```\n\n接下来，我们从 URL 中删除主机信息。这使得我们稍后处理其余\
  \ URL 变得更容易，尤其是在尝试检查附件是否为频道项目时。\n\n```\nprivate static void AddToUrlList(string\
  \ url)\n{\n    ... code continues ...\n    // Remove host information from the URL\n\
  \    if (url.StartsWith(m_SourceHost))\n    {\n        url = url.Remove(0, m_SourceHost.Length);\n\
  \    }\n}\n```\n\n我们只会添加有效的 URL。有效 URL：\n\n- 不包含单引号或双引号。\n- 不会链接到其他端口（例如 http://localhost:81/somepage.htm）或其他域。由于我们之前已删除主机信息（这会使我们得到类似\
  \ :80/ 或 :80/somepage.htm 的 URL），因此我们只需查找冒号的存在即可检查具有端口号的 URL。\n- 不包含查询字符串参数。我们将通过确保\
  \ URL 不包含问号来强制执行这一点。不处理带查询字符串的页面的原因是它们很可能是动态页面（*.aspx 或 *.asp），而这些页面的静态快照无法处理查询字符串参数。\n\
  \n```\nprivate static void AddToUrlList(string url)\n{\n    ... code continues\n\
  \    // Check URLs to see if they are valid\n    bool isValidUrl = true;\n    string\
  \ reason = \"\";\n    if ((url.IndexOf(\"'\") >= 0 || url.IndexOf(\"\\\"\") >= 0)\n\
  \        || url.IndexOf(\":\") >= 0 || url.IndexOf(\"?\") >= 0)\n    {\n       \
  \ // URL is invalid\n        isValidUrl = false;\n        reason = \"Ignoring invalid\
  \ url or url from external domain\";\n    }\n}\n```\n\n我们还将检查 URL 是否属于将由前面定义的 CollectChannel()\
  \ 方法分期的帖子或频道封面页。我们可以省略此检查，让分期工具根据它们出现的次数生成这些页面，但请记住，分期文件越少，处理速度越快！\n\n请注意，我们使用了辅助函数\
  \ EnhancedGetByUrl()。它基本上与 Searches.GetByUrl() 方法执行相同的任务，但包括我们稍后将看到的几项改进。\n\n\n\n\
  \n\n请注意，“将频道名称映射到主机头”功能在 MCMS 标准版中不可用。\n\n然而，对于频道名称映射到主机头名称的站点，`Searches.GetByUrl()`\
  \ 方法并不能可靠地工作。例如，当 `Searches.GetByUrl()` 方法接收到顶级频道的 URL（如 `http://tropicalgreen`）时，我们期望它返回\
  \ `tropicalgreen` 频道的一个实例。问题在于它返回的是一个空对象。这是因为 `Searches.GetByUrl()` 方法存在一个问题，导致它期望输入的\
  \ URL 是 `http://localhost/tropicalgreen`，无论“将频道名称映射到主机头”选项设置为“是”还是“否”。我们将创建 `EnhancedGetByUrl()`\
  \ 方法来解决这个问题。\n\n`EnhancedGetByUrl()` 方法首先检查“将频道名称映射到主机头”选项是设置为“是”还是“否”。它通过查看根频道的已发布\
  \ URL 来实现这一点。当“将频道名称映射到主机头”设置为“是”时，根频道的 URL 将是 `http://Channels/`。否则，它将只是 `/Channels/`。\n\
  \n如果“将频道名称映射到主机头”选项设置为“是”，我们将把输入的 URL 转换为路径，并使用 `Searches.GetByPath()` 方法来检索频道项的实例。例如，如果\
  \ URL 是 `http://tropicalgreen/plantcatalog`，例程会将其转换为频道路径：`/Channels/tropicalgreen/plantcatalog`。将以下代码添加到类中：\n\
  \n```\nstatic ChannelItem EnhancedGetByUrl(string url)\n{\n    if (IsMapChannelToHostHeaderEnabled())\n\
  \    {\n        // Remove \"http://\" from the URL and remove any trailing forward\
  \ slashes\n        string hostName = m_SourceHost.ToLower().Replace(\"http://\"\
  , \"\").Trim(new Char[] {'/'});\n        // Convert the URL to a path\n        string\
  \ Path = HttpUtility.UrlDecode(url);\n        Path = Path.Replace(\"http://\", \"\
  /Channels/\");\n        if (!Path.StartsWith(\"/Channels/\"))\n        {\n     \
  \       Path = \"/Channels/\"+hostName+Path;\n        }\n        if (Path.EndsWith(\"\
  .htm\"))\n        {\n            Path = Path.Substring(0,Path.Length - 4);\n   \
  \     }\n        if (Path.EndsWith(\"/\"))\n        {\n            Path = Path.Substring(0,Path.Length\
  \ - 1);\n        }\n        return (ChannelItem)(cmsContext.Searches.GetByPath(Path));\n\
  \    }\n    else\n    {\n        return cmsContext.Searches.GetByUrl(url);\n   \
  \ }\n}\nstatic bool IsMapChannelToHostHeaderEnabled()\n{\n    return (cmsContext.RootChannel.UrlModePublished\
  \ == \"http://Channels/\");\n}\n```\n\n## 下载附件\n\n一旦我们为每个频道封面页或张贴收集了附件列表，我们就可以准备生成它们的静态副本了。为此，我们将在\
  \ `CollectChannel()` 方法中的两个位置调用辅助函数 `DownloadAttachments()`：\n\n-   在频道的封面页被暂存之后\n\
  -   在每个张贴被暂存之后\n\n按照下面代码中突出显示的部分，将对 `DownloadAttachments()` 方法的调用添加进去：\n\n```\n\
  static void CollectChannel(Channel channel)\n{\n    // Download the channel itself\n\
  \    WriteToLog(\"Info: Downloading Channel: \" + channel.Path);\n    Download(GetUrlWithHost(channel.Url),\
  \ channel.Path.Replace(\n        m_StartChannel,\"\"),\n        m_DefaultFileName,\
  \ EnumBinary.ContentPage);\n\n    // Download all attachments in the cover page\
  \ or channel rendering script\n    DownloadAttachments();\n\n    // Download all\
  \ the postings within the channel\n    foreach (Posting p in channel.Postings)\n\
  \    {\n        WriteToLog(\"Info: Downloading Posting: \" + p.Path);\n        Download(GetUrlWithHost(p.Url),\
  \ channel.Path.Replace(m_StartChannel,\"/\"),\n            p.Name, EnumBinary.ContentPage);\n\
  \n        // Download all attachments in the posting\n        DownloadAttachments();\n\
  \    }\n    foreach (Channel c in channel.Channels)\n    {\n        CollectChannel(c);\n\
  \    }\n}\n```\n\n`DownloadAttachments()` 方法遍历 `m_AttachmentUrls` 数组的每个元素，并从其 URL\
  \ 中提取附件的路径和文件名。调用之前定义的 `Download()` 方法将每个附件暂存为静态文件。\n\n```\nprivate static void\
  \ DownloadAttachments()\n{\n    for (int i = 0; i < m_AttachmentUrls.Count; i++)\n\
  \    {\n        string path = m_AttachmentUrls[i].ToString();\n        string[]\
  \ arrPath = path.Split('/');\n        string fileName = arrPath[arrPath.Length -\
  \ 1];\n        path = \"\";\n        for (int j = 0; j < arrPath.Length - 1; j++)\n\
  \        {\n            path += arrPath[j] + \"/\";\n        }\n        Download(GetUrlWithHost(m_AttachmentUrls[i].ToString()),\
  \ path, fileName,\n            EnumBinary.ContentBinary);\n    }\n    m_AttachmentUrls.Clear();\n\
  }\n```\n\n用户将能够启动单个 InfoPath 表单，并选择他们希望修改的张贴，该张贴可以基于任何 MCMS 模板。然后，将进行一个 Web 服务调用，使用\
  \ MCMS 发布 API（PAPI）从 MCMS 存储库加载张贴、占位符和自定义属性。随后，InfoPath 表单将被这些数据填充，以便用户可以对内容进行修改。一旦更改完成，它们就可以被发送回\
  \ ASP.NET Web 服务并保存到 MCMS。\n\n为简单起见，本章概述的解决方案仅允许编辑现有张贴的 `HtmlPlaceholder` 和 `Text`\
  \ 自定义属性，但可以扩展为创建新的张贴、使用不同类型的占位符以及设置选择自定义属性。有关更多增强思路，请参阅本章末尾的“此解决方案可能的增强”部分。\n\n\
  我们将创建的表单检索并显示张贴和模板详细信息，并允许修改自定义属性和占位符。占位符将使用 InfoPath 的富文本控件，该控件允许对内容进行格式化。此解决方案的一个额外好处是，所有占位符内容都将转换为\
  \ XHTML（可扩展超文本标记语言，其最基本形式是符合 XML 标准的 HTML），因为 InfoPath 的数据以 XML 存储。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_368_0.png)\n\
  \n## 什么是 ASP.NET Web 服务？\n\nASP.NET Web 服务允许软件开发人员为其应用程序创建一个支持跨应用程序域集成的接口。ASP.NET\
  \ Web 服务由一个或多个 Web 方法组成。Web 方法类似于常规 .NET 对象的方法，但通过网络调用并在托管 Web 服务的服务器上执行。这与远程过程调用（RPC）和\
  \ DCOM 对象调用类似。\n\n调用 Web 方法时，可以传递参数，并且可以检索任何返回值。由于方法调用使用 HTTP 发送到托管 Web 服务的机器，因此作为参数传递的对象会被转换为适合传输的格式。在这种情况下，采用\
  \ XML 序列化，这是将对象从内存中的二进制形式转换为 HTTP 安全的 XML 格式的过程。\n\n我们选择使用 ASP.NET Web 服务将 InfoPath\
  \ 与 MCMS 集成，因为它允许我们利用 .NET 的健壮性，同时保留在 InfoPath 中构建的灵活 GUI。Web 服务是平台无关的，也是 InfoPath\
  \ 的首选集成方法。另一种可能的解决方案是在 InfoPath 内部开发代码，通过编写对 MCMS 的查询脚本并手工制作 InfoPath 表单来实现，但那样我们会失去拥有一个集中式业务逻辑和处理存储的好处，从而降低我们扩展和支持解决方案的能力。\n\
  \n## 创建 MCMS Web 服务项目\n\nMCMS 创作 Web 服务将通过发布 API 访问 MCMS。一系列 Web 方法将允许开发人员检索模板详细信息和更新张贴。MCMS\
  \ 创作 Web 服务项目将从 Visual Studio .NET 2003 中的 MCMS Web 服务项目模板创建。MCMS Web 服务项目模板自动包含正确的引用和\
  \ `web.config` 条目，以便与 MCMS 通信。\n\n让我们继续创建这个 ASP.NET Web 服务应用程序：\n\n1.  启动 Visual\
  \ Studio .NET，从“文件”菜单中，选择“新建 | 项目”。\n2.  从“项目类型”窗格中，在“Content Management Server\
  \ Projects”下选择“Visual C# Projects”。\n3.  从“模板”窗格中，选择“MCMS Web Service”。\n4.  输入位置为\
  \ `http://localhost/McmsAuthoringWebService`，然后点击“确定”。\n\n\n\n\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_370_0.png)\n\
  \n现在应该已经创建了一个项目，并且您会注意到所有必需的 MCMS 引用都已自动创建。由于不需要 Console 文件夹，可以将其从项目中删除。\n\n## 创建业务层\n\
  \n现在我们已经创建了项目，接下来看一下业务层。业务层中的类将封装 MCMS 对象的关键属性，例如 Name、Path、Value 和 ID（等同于 MCMS\
  \ 的 Guid 属性）。我们对象模型中的所有对象都必须是可序列化的，也就是说，必须能够将它们转换为 XML，以便通过 Web 服务进行传输。我们无法直接通过\
  \ ASP.NET Web 服务传输标准的 PAPI 对象，因为目前还没有办法将其直接序列化为 XML。因此，我们将使用自己的类来重建部分 MCMS 对象模型，这些类支持序列化，以便\
  \ ASP.NET Web 服务能够发送和接收它们。\n\nPAPI 类不包含默认构造函数，因此无法序列化为 XML。有关 XML 序列化的更多信息，请参阅 http://msdn.microsoft.com/library/default.asp?url=/library/en-us/cpguide/html/cpconintroducingxmlserialization.asp。\n\
  \n我们将开发以下类：\n\n- LightweightPosting\n- LightweightTemplate\n- LightweightPlaceholderCollection\n\
  \  - LightweightPlaceholder\n- LightweightCustomPropertyCollection\n  - LightweightCustomProperty\n\
  \n- 4. 对象若要被序列化，它必须有一个不带参数的构造函数。.NET Framework 在序列化期间需要这个默认构造函数，并且在创建类时 VS .NET\
  \ 会自动添加。但是，我们还需要添加以下构造函数，该构造函数接受公共变量的值作为其参数：\n\n```csharp\n/// <summary>\n/// Instantiate\
  \ the custom property setting the Name and Current value.\n/// </summary>\n/// <param\
  \ name=\"_Name\">The name of the custom property</param>\n/// <param name=\"_Value\"\
  >The current value of the custom property</param>\npublic LightweightCustomProperty(string\
  \ _Name, string _Value)\n{\n    this.Name = _Name;\n    this.Value = _Value;\n}\n\
  ```\n\n- 5. 自定义属性值将保存回相关的 MCMS 发布项。因此，让我们创建 Save() 方法，该方法为作为参数传入的发布项设置自定义属性的值。\n\
  \n```csharp\n/// <summary>\n/// Save the custom property value\n/// </summary>\n\
  /// <param name=\"_Posting\">The posting to be updated</param>\npublic void Save(Posting\
  \ _Posting)\n{\n    // Get the custom property of the posting and set the value\n\
  \    _Posting.CustomProperties[this.Name].Value = this.Value;\n}\n```\n\n发布项可能使用定义了多个自定义属性的模板。为了存储这些自定义属性的集合，我们将定义一个强类型的\
  \ LightweightCustomProperty 对象集合，称为 LightweightCustomPropertyCollection。\n\n- 1.\
  \ 在 Visual Studio .NET 中创建一个新类，并将其命名为 LightweightCustomPropertyCollection。为其添加命名空间\
  \ Microsoft.ContentManagement.Publishing，并使其继承 System.Collections.CollectionBase。\n\
  \n```csharp\nusing System;\nusing Microsoft.ContentManagement.Publishing;\nnamespace\
  \ McmsAuthoringWebService\n{\n    /// <summary>\n    /// Summary description for\
  \ LightweightCustomPropertyCollection.\n    /// </summary>\n    public class LightweightCustomPropertyCollection\n\
  \        : System.Collections.CollectionBase\n    {\n        . . . code continues\
  \ . . .\n    }\n}\n```\n\n- 2. 由于 LightweightCustomPropertyCollection 是一个强类型集合，其默认属性将是一个\
  \ LightweightCustomProperty。\n\n```csharp\n/// <summary>\n/// The indexed LightweightCustomProperty\n\
  /// </summary>\npublic LightweightCustomProperty this[int index]\n{ get { // Cast\
  \ the list item to a LightweightCustomProperty return(this.InnerList[index] as LightweightCustomProperty);\
  \ } set { this.InnerList[index] = value; } }\n```\n\n- 3. 现在我们将定义 Add() 方法，以便向集合中添加一个\
  \ LightweightCustomProperty。\n\n```csharp\n/// <summary>\n/// Add an item to the\
  \ collection\n/// </summary>\n/// <param name=\"item\">The LightweightCustomProperty\
  \ to be added</param>\npublic void Add(LightweightCustomProperty item)\n{\n    this.InnerList.Add(item);\n\
  }\n```\n\n- 4. LightweightCustomPropertyCollection 将由 Microsoft.ContentManagement.Publishing.Posting\
  \ 对象填充，因此我们将定义 Load() 方法。Load() 方法将枚举发布项的自定义属性，并为每个自定义属性实例化一个 LightweightCustomProperty，然后将其添加到集合中。\n\
  \n  在本示例中，我们仅维护 Text 类型的自定义属性。可以扩展此代码以支持 Selection 类型的自定义属性。\n\n```csharp\n/// <summary>\n\
  /// Load the lightweight custom property collection from a posting.\n/// </summary>\n\
  /// <param name=\"_Posting\">Posting to be loaded from</param>\npublic void Load(Posting\
  \ _Posting)\n{\n    if (_Posting != null)\n    {\n        // Loop through the custom\
  \ properties\n        foreach (CustomProperty _CustomProperty in _Posting.CustomProperties)\n\
  \        {\n            // Check if the custom property is of type `text`\n    \
  \        // (custom properties will have > 0 allowed values)\n            if (_CustomProperty.AllowedValues.Count\
  \ == 0)\n            {\n                // Instantiate a lightweight custom property\
  \ and\n                // add it to the collection\n                this.Add(new\
  \ LightweightCustomProperty(_CustomProperty.Name, _CustomProperty.Value));\n   \
  \         }\n        }\n    }\n}\n```\n\n- 5. 我们还需要能够保存集合中持有的所有自定义属性。\n\n```csharp\n\
  /// <summary>\n/// Save the collection of custom properties\n/// </summary>\n///\
  \ <param name=\"_Posting\">\n/// Posting to save the custom property value to\n\
  /// </param>\npublic void Save(Posting _Posting)\n{\n    // Loop through the custom\
  \ properties in the collection\n    foreach (LightweightCustomProperty _LightweightCustomProperty\
  \ in this)\n    {\n        // Save the custom property against the posting\n   \
  \     _LightweightCustomProperty.Save(_Posting);\n    }\n}\n```\n\n现在我们已经定义了用于维护自定义属性的类，项目在类视图中应该如下所示：\n\
