  \n## 构建 CMS Explorer\n\n《使用 Microsoft Content Management Server 构建网站》一书（Packt Publishing，2005\
  \ 年 1 月，ISBN 1-904811-16-7）大量使用了 MCMS 的 Publishing Application Programming Interface（PAPI）。我们展示了如何使用它在模板文件中提供自定义功能、向工作流事件添加业务流程、定制\
  \ Web Author Console，以及为读者在阅读本书过程中构建的 Tropical Green 网站实现表单身份验证。\n\nPAPI 实际上是一个庞大的库。你可以用它编程数月，仍会发现从未知道的新技巧！这是三章中的第一章，旨在补充你从本书中获得的理解，并尝试将你对\
  \ PAPI 的理解提升到另一个层次。跟随我们演示几种非常有用的技术，并展示它们如何在真实场景中发挥作用，我们将把它们应用于 Tropical Green 网站。\n\
  \n> **我在哪里可以下载 Tropical Green 网站的副本？**\n> \n> 在此书下载页面上提供了在先前书籍过程中创建的 Tropical Green\
  \ 网站的代码文件作为下载包。前往 Packt 网站 `http://www.packtpub.com/support/`，并在下拉菜单中选择 Advanced\
  \ Microsoft Content Management Server Development。\n\n### 一个中央管理工具：CMS Explorer\n\
  \n我们在创建示例时进行了深入思考，这个示例不仅能让你全面掌握 PAPI 中更高级的方法，而且还能为你留下你在日常 MCMS 工作中会觉得方便的工具。从我们在软件行业的时间关键世界中作为\
  \ MCMS 开发人员的自身经验来看，我们发现一个定制的 MCMS 管理工具非常宝贵。在本书的前三章中，我们将带你逐步构建这样的工具，我们将它命名为 CMS Explorer。\n\
  \nCMS Explorer 完成后将如下所示：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_26_0.png)\n\
  \n界面由两个部分组成：\n\n- 在页面顶部（以防你没猜到，我们将把工具作为 Web 应用程序创建），你会看到一个工具栏。工具栏提供一个下拉列表，可创建新的\
  \ postings 和 channels。它还有三个按钮：一个用于切换到 channels 和 postings 列表，一个用于列出 template galleries\
  \ 和 templates，第三个用于 resource galleries 和 resources。\n- 页面的后半部分是一个 DataGrid。网格列出了当前容器中的项目。每行都有一个\
  \ Edit 按钮，点击时会显示每个对象的操作列表。\n\n对于导航，你可以向两个方向移动：点击容器的名称查看其内容，或使用工具栏上的 Up 按钮向上移动一级。\n\
  \n为什么要构建工具，而开箱即用的解决方案提供了不止一个、而是三个管理 MCMS 对象的工具？Site Manager 和 Web Author 以及 Visual\
  \ Studio .NET 中的 Template Explorer 已经可用。构建 CMS Explorer 工具值得做的原因有几个：\n\n- 首先当然是，你将亲身体验使用\
  \ PAPI 中许多更高级的方法。构建此工具后，你不仅会非常熟悉 PAPI，而且也将迈向成为其专家的道路！\n- 尽管 PAPI 包含大量类，但它并不涵盖所有内容。虽然希望\
  \ CMS Explorer 能做到与 MCMS 随附的工具一样多，但它不能超出 PAPI 中可用的范围。接下来几章的次要目标之一是突出 PAPI 的局限性。\n\
  \n### 如何切换到 Update 模式？\n\n要切换到 Update 模式，只需改用 ChannelItem.QueryStringModeUpdate\
  \ 属性，如下所示：\n\n```\nif (CmsContext.Mode != PublishingMode.Update)\n{\n    Response.Redirect(\"\
  default.aspx?\"\n        + CmsHttpContext.Current.RootChannel.QueryStringModeUpdate);\n\
  }\n```\n\n### 使用 CmsApplicationContext 切换模式\n\n另一种流行的切换模式方法利用 CmsApplicationContext\
  \ 对象。该对象通常用于在 IIS 外部运行的独立应用程序，例如控制台和桌面应用程序。在这些情况下，CmsHttpContext 无意义且无法使用。\n\n你也可以在\
  \ Web 应用程序中使用 CmsApplicationContext 对象，当你需要额外的 CmsContext 对象时，尤其是在处理不同模式时。你可以在 Published\
  \ 模式下维护 CmsHttpContext，并在 Update 模式下使用单独的 CmsApplicationContext。使用 CmsApplicationContext\
  \ 的另一个优点是它减少了所需的客户端往返次数。\n\n我们不会在 CMS Explorer 应用程序中使用 CmsApplicationContext。尽管如此，没有\
  \ CmsApplicationContext 类的介绍，关于模式切换的课程就不算完整。\n\n> CmsApplicationContext 类在第 13 章\
  \ *Essential How-Tos, Tips, and Tricks* 中有详细介绍。\n\n要使用 CmsApplicationContext 对象，首先创建它的一个新实例：\n\
  \n```\n// Create a new CmsApplicationContext\nCmsApplicationContext cmsContext =\
  \ new CmsApplicationContext();\n```\n\n与 CmsHttpContext 不同，CmsApplicationContext\
  \ 必须使用四种身份验证方法之一对 MCMS 服务器进行身份验证。每种身份验证方法都接受一个类型为 PublishingMode 的输入参数，指定你希望工作的模式。\n\
  \n- **AuthenticateAsCurrentUser**  \n  使用当前登录用户的凭据进行身份验证。此方法在 Web 应用程序内部无法正确工作。它仅在应用程序在\
  \ IIS 外部运行时使用，例如从控制台应用程序运行，因为它使用进程令牌。对于 Web 应用程序，使用进程令牌意味着当前登录的用户是 machine.config\
  \ 文件中配置的用户（在 IIS 5 中）或应用程序池账户（在 IIS 6 中），而不是在 CmsHttpContext 中经过身份验证的用户（它使用线程令牌）。\n\
  \  \n  要以当前用户身份进行身份验证：\n\n```\n// authenticate as the current user\ncmsContext.AuthenticateAsCurrentUser(PublishingMode.Unpublished);\n\
  ```\n\n\n\n## 示例 Markdown\n\n这是一个包含多行文本的**示例**段落。\n\n- 项目 A\n- 项目 B\n- 项目 C\n\n\
