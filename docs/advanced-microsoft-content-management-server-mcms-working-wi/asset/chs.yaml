  \            AddActionItems(actionCell, hItem);\n        }\n    }\n}\n```\n\n此方法确定正在绑定的\
  \ HierarchyItem 的类型，无论是频道、发布项、资源库、资源、模板库还是模板。然后，它将 DataGrid 每行中的图标设置为表示该对象类型的图像的\
  \ URL。如果对象是频道、模板库或资源库，则使用我们的 PrepareUrl() 方法链接对象名称，以重新加载页面并将其设置为 startItem。最后一部分调用\
  \ AddActionItems() 方法，我们将使用该方法为 DataGrid 中的每一行构建编辑操作菜单。让我们在下一节中看看这个方法。\n\n## 构建编辑菜单\n\
  \n我们需要向每一行添加一个“编辑”按钮。单击该按钮时，会显示可对该对象执行的操作列表。下表显示了每种对象类型的操作列表。\n\n\n\n\n\n| 对象类型\
  \ | 操作 |\n|---|---|\n| 通道、模板库、模板、资源库 | 属性<br>删除 |\n| 发布 | 复制<br>移动<br>创建关联发布<br>属性<br>删除\
  \ |\n| 模板 | 复制<br>移动<br>创建关联模板<br>属性<br>删除 |\n| 资源 | 替换<br>属性<br>删除 |\n\n完成后，DataGrid\
