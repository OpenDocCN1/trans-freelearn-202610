  ```\n\n为了能够加载包含 HTML 的 XmlNode，我们将把 HTML 转换为格式良好的 XHTML。我们将通过使用 Chris Lovett 创建的一个公开工具\
  \ SgmlReader 来实现此操作，Chris Lovett 供职于一家名为 Microsoft Corporation 的小型公司。\n\n> SGML\
  \ 代表 Standard Generalized Markup Language，即 XML 的前身。SgmlReader 工具套件提供了多种创建格式良好的\
  \ XML 的方法，但就本示例而言，我们只需要 SgmlReader.dll。\n\n要设置和配置 SgmlReader，请按照以下步骤操作：\n\n+   1.\
  \ 从 GotDotNet 下载该工具，网址为 http://www.gotdotnet.com/Community/UserSamples/Details.aspx?SampleGuid=b90fddce-e60d-43f8-a5c4-c3bd760564bc。\n\
  +   2. 将 ZIP 文件解压到 c:\\sgml\\SgmlReader。\n+   3. 在 <local_drive>\\Program Files\
  \ 下创建一个名为 SgmlReader 的目录，并将 C:\\SGML\\SgmlReader\\SgmlReaderDll\\bin\\release\\\
  SgmlReaderDll.dll 文件复制到新文件夹。\n\n我们现在准备创建 CleanHtml() 方法，该方法将把 HTML 转换为格式良好的 XHTML，例如将\
  \ <img src=\"theImage.jpg\"> 转换为 <img src=\"theImage.jpg\"></img>。此方法将使用我们之前引用的\
  \ SgmlReader 程序集。在转换之前，HTML 必须用单个标签包裹，在本例中为 <html>，这样 SgmlReader 才能将其识别为一个元素。转换后返回，我们将转义一些\
  \ InfoPath 无法转义的字符，并从内容中移除包围的 <html> 元素。\n\n+   1. 在 Visual Studio .NET 中打开 McmsAuthoringWebService\
  \ 项目，并添加对 <local_drive>\\Program Files\\SgmlReader\\SgmlReaderDll.dll 的引用。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_377_0.png)\n\
  \n2. 在 LightweightPlaceholder.cs 中创建以下方法：\n\n```\n/// <summary>\n/// Convert \"\
  badly formed\" HTML into well formed XHTML using the\n/// SgmlReader utility by\
  \ Chris Lovett, Microsoft Corporation\n/// </summary>\n/// <param name=\"BadlyFormedHtml\"\
  >The badly formed HTML</param>\n/// <returns>Well formed XHTML representation of\
  \ the HTML</returns>\npublic string CleanHtml(string BadlyFormedHtml)\n{\n    //\
  \ Wrap the entire HTML string in a single tag so the\n    // SGMLReader can process\
  \ the data as one element\n    BadlyFormedHtml = \"<html>\" + BadlyFormedHtml +\
  \ \"</html>\";\n\n    // Load the string reader with the badly formed HTML\n   \
  \ StringReader _stringReader = new StringReader(BadlyFormedHtml);\n\n    // instantiate\
  \ and set the badly formed HTML string reader\n    // as the input stream of the\
  \ SgmlReader\n    Sgml.SgmlReader _sgmlReader = new Sgml.SgmlReader();\n    _sgmlReader.InputStream\
  \ = _stringReader;\n\n    // Instantiate the string writer and xmlText writer\n\
  \    // that will be used to hold the well formed XHTML\n    StringWriter _stringWriter\
  \ = new StringWriter();\n    XmlTextWriter _xmlTextWriter = new XmlTextWriter(_stringWriter);\n\
  \n    // Read the stream\n```\n\n```\n_sgmlReader.Read();\n// loop through the SgmlReader\
  \ until the end of the stream\nwhile(!_sgmlReader.EOF)\n{\n    // add a node to\
  \ the XML text writer\n    _xmlTextWriter.WriteNode(_sgmlReader, true);\n}\n\n//\
  \ cleanup the XML text writer\n_xmlTextWriter.Flush();\n_xmlTextWriter.Close();\n\
  \n// Replace non-breaking spaces (&nbsp;) with spaces\n// as InfoPath escapes these\
  \ in placeholders.\nstring strCleanedXHTML = _stringWriter.ToString().Replace(\"\
  &amp;nbsp;\", \" \");\n\n// Remove the surrounding <html> tag by using an XmlDocument\n\
  // Create a new XmlDocument and load in the clean XHTML\nXmlDocument _tempDocument\
  \ = new XmlDocument();\n_tempDocument.LoadXml(strCleanedXHTML);\n\n// Get the html\
  \ node and return the inner XML\nreturn _tempDocument.SelectSingleNode(\"/html\"\
  ).InnerXml;\n```\n\n3. 现在我们能够从 HtmlPlaceholder 中存储的 HTML 创建格式良好的 XHTML，我们可以填充 XmlNode\
  \ 属性，该属性将用于 InfoPath 的占位符内容存储。\n\n```\n/// <summary>\n/// Create an XHTML XmlNode\
  \ from \"badly formed\" HTML\n/// </summary>\n/// <param name=\"BadlyFormattedHtml\"\
  >The badly formed HTML string</param>\n/// <returns>XHTML XmlNode representation\
  \ of input HTML</returns>\npublic XmlNode LoadXHTML(string BadlyFormattedHtml)\n\
  {\n    // Create a temporary XmlDocument object to generate nodes\n    System.Xml.XmlDocument\
  \ tempDocument = new System.Xml.XmlDocument();\n\n    // Create a wrapper node for\
  \ the data so InfoPath will correctly detect\n    // the XHTML content\n    System.Xml.XmlElement\
  \ theNode =\n        (System.Xml.XmlElement)tempDocument.CreateNode(\n         \
  \   System.Xml.XmlNodeType.Element, \"theNode\", \"\");\n\n    // Create a \"RichText\"\
  \ element in the XHTML namespace\n    System.Xml.XmlElement theRichText = (System.Xml.XmlElement)\n\
  \        tempDocument.CreateNode(System.Xml.XmlNodeType.Element, \"RichText\",\n\
  \            \"http://www.w3.org/1999/xhtml\");\n\n    // Clean the badly formed\
  \ HTML and set the inner XML of the RichText node\n    theRichText.InnerXml = CleanHtml(BadlyFormattedHtml);\n\
  \n    // Append the RichText node to the wrapper node\n    theNode.AppendChild(\
  \ theRichText );\n\n    //Return the wrapper element.\n    return theNode;\n}\n\
  ```\n\n4. 接下来我们将为 LightweightPlaceholder 类添加一个构造函数，该构造函数接受一个 Microsoft.ContentManagement.Publishing.Placeholder\
  \ 参数。Name 和 Type 属性连同 Value 属性一起设置。为了加载值，我们首先验证占位符是否为 HtmlPlaceholder，然后调用 LoadXHTML()\
  \ 方法并传入占位符的 HTML。LoadXHTML() 将把占位符的 HTML 转换为 XmlNode。\n\n```\n/// <summary>\n///\
  \ Instantiate and load a MCMS placeholder\n/// </summary>\n/// <param name=\"_Placeholder\"\
  >MCMS placeholder to load</param>\npublic LightweightPlaceholder(Placeholder _Placeholder)\n\
  {\n    // Set the name and the type of placeholder\n    this.Name = _Placeholder.Name;\n\
  \    this.Type = _Placeholder.GetType().ToString();\n\n    // Is this an HtmlPlaceholder?\n\
  \    if (_Placeholder is HtmlPlaceholder)\n    {\n        // Convert the contents\
  \ of the placeholder to XHTML\n        // and set the Value property\n        this.Value\
  \ = LoadXHTML(((HtmlPlaceholder)_Placeholder).Html);\n    }\n}\n```\n\n5. 占位符值将保存回相关帖子的\
  \ MCMS。因此让我们创建 Save() 方法。此解决方案目前仅适用于 HtmlPlaceholders，因此我们必须首先检查占位符是否为 HtmlPlaceholder，然后可以将\
  \ Html 属性设置为存储在 Value XmlNode 中的 XML。\n\n```\n/// <summary>\n/// Save the placeholder\
  \ contents to a posting\n/// </summary>\n/// <param name=\"_Posting\">Posting to\
  \ save against</param>\npublic void Save(Posting _Posting)\n{\n    // Set the placeholder\
  \ value for the current placeholder\n    // to the InnerXml of the Value property\n\
  \    // Note: This will only work with HtmlPlaceholders. If enhanced for\n    //\
  \ other placeholders we would check the placeholder type before\n    // casting.\n\
  \    if (_Posting.Placeholders[this.Name] is HtmlPlaceholder)\n    {\n        ((HtmlPlaceholder)_Posting.Placeholders[this.Name]).Html\
  \ =\n            this.Value.InnerXml;\n    }\n    else\n    {\n        throw new\
  \ Exception(\"The placeholder \" + this.Name\n            + \" is not an HtmlPlaceholder.\"\
  );\n    }\n}\n```\n\n## Maintaining Placeholder Collections\n\n让我们现在创建一个集合类来保存 LightweightPlaceholders，我们称之为\
