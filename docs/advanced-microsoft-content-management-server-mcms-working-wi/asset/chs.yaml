  \ GUID of the working container\n    string cmsObjectGuid = \"\";\n    if (Request.QueryString[\"\
  CMSObjectGuid\"] != null)\n    {\n        cmsObjectGuid = Request.QueryString[\"\
  CMSObjectGuid\"].ToString();\n    }\n\n    if (cmsObjectGuid == \"\")\n    {\n \
  \       // if not specified, we start with channels\n        startItem = cmsContext.Channel;\n\
  \    }\n    else\n    {\n        startItem = cmsContext.Searches.GetByGuid(cmsObjectGuid);\n\
  \    }\n\n    // no working container has been specified. Use the root containers\n\
  \    if (startItem == null)\n    {\n        switch(cmsObject)\n        {\n     \
  \       case \"Templates\":\n                // using the root template gallery\n\
  \                startItem = cmsContext.RootTemplateGallery;\n                break;\n\
  \            case \"Resources\":\n                // using the root resource gallery\n\
  \                startItem = cmsContext.RootResourceGallery;\n                break;\n\
  \            default:\n                // using the root channel\n             \
  \   startItem = cmsContext.RootChannel;\n                break;\n        }\n   \
  \ }\n}\n```\n\n将 **InitializeStartItem()** 方法直接添加到 Page_Load() 事件处理程序的下方：\n\n该代码首先确定您正在处理的对象类型：频道、模板库或资源库。它从\
  \ **CMSObject** 查询字符串参数中获取此信息。\n\n对于频道，逻辑很简单。有关频道的信息可从 **CmsHttpContext.Channel**\
  \ 属性获得。如果它不为 null，**DataGrid** 将使用它作为起始频道。否则，根容器被分配给 **startItem**。\n\n对于模板库和资源库，无法从当前\
  \ **CmsHttpContext** 获取当前库项目。对于这些对象，PAPI 从我们之前插入的 **CMSObjectGuid** 查询字符串参数中获取工作容器的\
  \ GUID。\n\n同时，我们需要提供频道显示名称周围超链接的 URL。对于频道，URL 指向 `default.aspx?QueryStringModeUnpublished`，而发布项不可点击，因此其周围\
  \ `<A>` 标签的 Href 属性将留空。\n\n我们可以修改脚本，逐一遍历每个对象，并在将 DataTable 绑定到 DataGrid 之前将这些额外的列添加到\
  \ DataTable。然而，那将意味着修改我们的代码。好消息是，我们不必重写代码。我们可以实现 `DataGrid1_ItemDataBound` 事件处理程序，根据对象是频道还是发布项，为列填充自定义值。\n\
  \n首先，向 DataGrid 添加一个新的 TemplateColumn：\n\n```aspx\n<Columns>\n  <asp:TemplateColumn>\n\
  \    <ItemTemplate></ItemTemplate>\n  </asp:TemplateColumn>\n  <asp:TemplateColumn\
  \ HeaderText=\"Name\">\n    <ItemTemplate>\n      <a id=\"aName\" runat=\"server\"\
  >\n        <%# DataBinder.Eval(Container.DataItem, \"Name\") %>\n      </a>\n  \
  \  </ItemTemplate>\n  </asp:TemplateColumn>\n  <asp:BoundColumn DataField=\"LastModifiedDate\"\
  \ ReadOnly=\"True\" HeaderText=\n    \"Last Modified Date\" DataFormatString=\"\
  {0:d MMM yyyy hh:mm}\"/>\n</Columns>\n```\n\n新的 TemplateColumn 将包含一个图像，指示绑定到此行的对象的类型。\n\
  \n接下来，我们实现 `DataGrid1_ItemDataBound()` 事件处理程序。注册该事件处理程序的一种快捷方式是选择 DataGrid1 属性窗口顶部的“事件”按钮（在“设计”视图中可用）。双击\
  \ ItemDataBound 字段，转到代码隐藏文件中的 DataGrid1_ItemDataBound 事件处理程序，并按下所示进行修改：\n\n```csharp\n\
  private void DataGrid1_ItemDataBound(object sender,\n    System.Web.UI.WebControls.DataGridItemEventArgs\
  \ e)\n{\n    if (e.Item.ItemType==ListItemType.EditItem\n        || e.Item.ItemType==ListItemType.Item\n\
  \        || e.Item.ItemType==ListItemType.AlternatingItem)\n    {\n        string\
  \ guid = DataGrid1.DataKeys[e.Item.ItemIndex].ToString();\n        HierarchyItem\
  \ hItem = cmsContext.Searches.GetByGuid(guid);\n\n        if (hItem is Channel)\n\
  \        {\n            // if the object is a channel, show the channel icon\n \
  \           // set the Name to be a hyperlink\n            // that points to default.aspx?{QueryStringModeUnpublished}\n\
  \            e.Item.Cells[0].Text=\"<img src='images/channel.gif'>\";\n        \
  \    HtmlAnchor aName;\n            aName=e.Item.Cells[1].FindControl(\"aName\"\
  ) as HtmlAnchor;\n            aName.HRef = \"default.aspx?\"\n                +\
  \ ((Channel)hItem).QueryStringModeUnpublished;\n        }\n        else if (hItem\
  \ is Posting)\n        {\n            // if the object is a posting, show the posting\
