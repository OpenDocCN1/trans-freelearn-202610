  ];\n        parentGallery = cmsContext.Searches.GetByGuid(cmsObjectGuid) as TemplateGallery;\n\
  \        if (parentGallery != null)\n        {\n            litParentGallery.Text\
  \ = parentGallery.Path;\n        }\n        else\n        {\n            lblErrorMessage.Text\
  \ = \"Parent Gallery not found!\";\n        }\n    }\n}\n```\n\n7. Toggle to Design\
  \ view and double-click on the btnCreate button. In the btnCreate_Click() event\
  \ handler, add the following code:\n\n```csharp\nprivate void btnCreate_Click(object\
  \ sender, System.EventArgs e)\n{\n    try\n    {\n        if (parentGallery.CanCreateTemplateGalleries)\n\
  \        {\n            // get the template gallery's name\n            string name\
  \ = txtName.Text.Trim();\n            if (!Utility.ValidateCMSObjectName(name))\n\
  \            {\n                throw new Exception(\"Specified template gallery\
  \ name is not \" +\n                    \"valid. Must be only alphanumeric \" +\n\
  \                    \"characters, open or close parens, \" +\n                \
  \    \"hyphens, underscores, periods, or \" +\n                    \"spaces. No\
  \ period at the end and no \" +\n                    \"consecutive periods are allowed.\"\
  );\n            }\n\n            // create the template gallery\n            TemplateGallery\
  \ newGallery;\n            newGallery = parentGallery.CreateTemplateGallery();\n\
  \            newGallery.Name = name;\n            newGallery.Description = txtDescription.Text;\n\
  \            cmsContext.CommitAll();\n\n            // display the success message\n\
  \            lblErrorMessage.Text = \"Template Gallery created successfully!\";\n\
  \        }\n        else\n        {\n            lblErrorMessage.Text = \"You do\
  \ not have rights to create a \" +\n                \"template gallery.\";\n   \
  \     }\n    }\n    catch (Exception ex)\n    {\n        // rollback all changes\n\
  \        cmsContext.RollbackAll();\n\n        // the CMS context needs to be disposed\
  \ of after a rollback\n        cmsContext.Dispose();\n\n        // display error\
  \ message\n        lblErrorMessage.Text = ex.Message;\n    }\n}\n```\n\nBefore creating\
  \ the template gallery, the code performs a couple of validation checks to see if:\n\
  \n- The user has the rights to create sub-template galleries in the parent template\
  \ gallery. This is done by checking that the TemplateGallery.CanCreateTemplateGalleries\
  \ property returns a Boolean true.\n- The name supplied by the user is a valid template\
  \ gallery name. A valid name contains only the characters, A-Z, a-z, 0-9, -, _,\
  \ (space), (), and periods. It should also not end with a period or contain two\
  \ or more consecutive periods. These checks are carried out by the ValidateCMSObjectName()\
  \ method defined in Utility.cs, which we created in Chapter 2.\n\nIf all validation\
  \ checks pass, the code uses the TemplateGallery.CreateTemplateGallery() method\
  \ to create a new template gallery object. We then set the gallery's Name and Description\
  \ properties to the values entered in the textboxes. As before, we call the CmsHttpContext.CommitAll()\
  \ method to save the new template gallery to the repository.\n\n\n\n\n\n保存并生成解决方案。让我们使用新的对话框创建一个模板库：\n\
  \n- 1. 在 CMS Explorer 界面中，单击“模板”。\n- 2. 选择“新建”|“新建模板库”。\n- 3. 在“新建模板库”对话框中，输入以下值：\n\
  \n| 属性 | 值 |\n|---|---|\n| 名称 | MyTemplateGallery |\n| 描述 | 此模板库是使用 PAPI 创建的 |\n\
  \n- 4. 单击“创建库”并关闭对话框。刷新 CMS Explorer，检查新模板库是否已在根模板库中创建。作为练习，你可以编写代码让对话框自动关闭并刷新父页面。\n\
  \n## 创建模板\n\nPAPI 的另一个有用功能是能够通过代码生成模板。当您需要基于某些预定义逻辑（例如，要从旧版应用程序迁移到 MCMS 的架构）生成许多包含占位符和自定义属性定义的模板时，此功能尤其有用。\n\
  \n在本练习中，我们将为 CMS Explorer 构建一个“创建模板”对话框：\n\n- 1. 向 CMS Explorer 项目添加一个新的 Web 窗体。将新窗体命名为\
  \ CreateTemplate.aspx。\n- 2. 在“设计”视图中，将 styles.css 从“解决方案资源管理器”拖放到 Web 窗体上。\n- 3.\
