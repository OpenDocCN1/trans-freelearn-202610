  ```\n\n我们将利用默认 Delete 操作中的一些可用功能，例如 Confirm Delete 对话框。为了节省重新创建这些功能的精力，我们的类将继承自\
  \ DeleteAction 类：\n\n```\npublic class DeleteWithRecycle : DeleteAction\n{\n   \
  \ - - - code continues - - -\n}\n```\n\n在 DeleteWithRecycle() 构造函数中，我们首先获取当前的 CmsHttpContext。我们将在整个类中使用该上下文。接下来，我们获取充当回收站的频道的实例。在我们的示例中，回收站直接位于根频道下方。你可能需要根据决定放置频道的位置对路径进行调整。\n\
  \n我们在构造函数中执行最后一个任务——即设置操作按钮的 Text 属性。为了将其与常规 Delete 操作区分开来，我们在其旁边添加了单词（Recycle）。\n\
  \n```\nChannel recycleBin;\nCmsHttpContext cmsContext;\n\npublic DeleteWithRecycle()\n\
  {\n    // Get the current CmsHttpContext\n    cmsContext = CmsHttpContext.Current;\n\
  \n    // Get a reference to the recycle bin\n    recycleBin = cmsContext.Searches.GetByPath(\"\
  /Channels/RecycleBin/\")\n        as Channel;\n\n    // Set the Text property of\
  \ the action button to be \"Delete (Recycle)\".\n    this.Text = \"Delete (Recycle)\"\
  ;\n}\n```\n\n操作按钮仅当用户有权删除当前发布时才对其可用。我们还会检查他/她是否能够查看并向回收站添加内容。否则，Delete (Recycle)\
  \ 按钮将被隐藏。\n\n```\npublic override bool Available\n{\n    get\n    {\n        bool\
  \ isAvailable = false;\n\n        // Button is available only if:\n        // 1.\
  \ The user has the rights to delete the posting\n        // 2. The user has the\
  \ rights to move the posting to the Recycle bin\n        Posting currentPosting\
  \ = cmsContext.Posting;\n```\n\n```\nif (currentPosting != null && recycleBin !=\
  \ null)\n{\n    if (currentPosting.CanDelete && recycleBin.CanCreatePostings)\n\
  \    {\n        isAvailable = true;\n    }\n    return isAvailable;\n}\n```\n\n\
  大部分操作发生在重写的 PerformActionBehavior() 方法中。当用户单击 Delete (Recycle) 按钮时，他/她会收到提示：“删除此页面将将其从系统中永久移除。是否继续？”用户的答案存储在发布上名为\
  \ __CMS_ConfirmedDelete 的隐藏表单字段中（此字段以双下划线开头）。选择确定会将 __CMS_ConfirmedDelete 设置为 true，取消则将其设置为\
  \ false（默认值）。为了确定用户是否决定继续，我们检查此隐藏表单字段的值。\n\n```\nprotected override void PerformActionBehavior()\n\
  {\n    string confirmDelete =\n        Page.Request.Form[\"__CMS_ConfirmedDelete\"\
  ].ToString();\n    if (confirmDelete == \"true\")\n    {\n        // User has confirmed\
  \ the delete\n    }\n}\n```\n\n一旦用户确认删除，我们继续获取要删除的发布的实例。然后，我们获取其父频道的 URL，并在发布被删除后将用户重定向到该\
  \ URL。\n\n```\nprotected override void PerformActionBehavior()\n{\n    string confirmDelete\
  \ =\n        Page.Request.Form[\"__CMS_ConfirmedDelete\"].ToString();\n    if(confirmDelete==\"\
  true\")\n    {\n        // User has confirmed the delete\n\n        // Get the current\
  \ posting\n        Posting p = cmsContext.Posting;\n\n        // Get the URL of\
  \ the posting's parent\n        string returnURL = p.Parent.Url;\n\n        // TODO:\
  \ Enter code for performing the delete operation\n\n        // Redirect the user\
  \ to the Channel's URL\n        HttpContext.Current.Response.Redirect(returnURL);\n\
  \    }\n}\n```\n\n“删除”该发布是一个四步流程。我们并不是删除它，而是：\n\n+   1. 将发布的原始过期日期和父频道的 GUID 作为其描述中\
  \ XML 字符串的一部分进行存储。\n+   2. 使发布过期。\n+   3. 将其移动到 RecycleBin 频道。\n+   4. 提交更改。\n\n\
  发布的过期日期和父频道的 GUID 将作为其描述中 XML 字符串的一部分存储。我们将使用频道的 GUID 而不是其路径，这样即使父频道已移动，也可以恢复该发布。如果我们决定恢复已删除的发布，这些信息以后将非常有用。XML\
  \ 字符串的格式为：\n\n```\n<DeletedItem>\n<ExpiryDate>1 Jan 3000 12:00:00 AM</ExpiryDate>\n\
  <ChannelGuid>{7AF93078-5FF8-4963-A9F9-B1A0977258A7}</ChannelGuid>\n</DeletedItem>\n\
  ```\n\n描述中是否包含其他值并不重要。我们只需将整个 XML 追加到描述的末尾。描述字段最多可容纳 500 个字符。我们将假设此限制永远不会达到。\n\n\
  > 如果担心达到 Description 属性的 500 字符限制，请考虑将额外信息存储在发布的自定义属性中（这要求每个模板都定义了自定义属性，但字符限制更高）或外部数据库中。或者，你可以将内容存储在\
  \ XMLPlaceholder 中，并使用 PAPI 将定义添加到模板中（如果尚不存在的话）。\n\n我们将整个操作包装在 try-catch 块中。如果在“删除”该发布时发生任何错误，我们将回滚所有更改，错误消息将自动显示在错误控制台上。\n\
  \n```\nprotected override void PerformActionBehavior()\n{\nstring confirmDelete\
  \ =\n    Page.Request.Form[\"__CMS_ConfirmedDelete\"].ToString();\nif(confirmDelete==\"\
  true\")\n{\n// User has confirmed the delete\n\n// Get the current posting\nPosting\
  \ p = cmsContext.Posting;\n\n// Get the URL of the posting's parent\nstring returnURL\
  \ = p.Parent.Url;\n\ntry\n{\n// 1. Copy the expiry date and posting's path to its\
  \ description\n// in the following format:\n// <DeletedItem>\n// <ExpiryDate></ExpiryDate>\n\
  // <ChannelGuid></ChannelGuid>\n// </DeletedItem>\nstring deletedInfo = \"<DeletedItem>\"\
  ;\ndeletedInfo += \"<ExpiryDate>\";\ndeletedInfo += p.ExpiryDate.ToString(\"dd MMM\
  \ yyyy hh:mm:ss tt\");\ndeletedInfo += \"</ExpiryDate>\";\ndeletedInfo += \"<ChannelGuid>\"\
  ;\ndeletedInfo += p.Parent.Guid;\ndeletedInfo += \"</ChannelGuid>\";\ndeletedInfo\
  \ += \"</DeletedItem>\";\n```\n\n\n\n\n## 回收站对话框\n\n回收站对话框列出了所有已删除的帖子。这是一个相对简单的窗体，由一个DataGrid和几个标签控件组成。\n\
  \n向项目添加一个名为RestorePosting.aspx的新Web窗体（如果你在Tropical Green项目中工作，请将其添加到Dialogs文件夹）。将页面布局设置为FlowLayout。\n\
