  \ btnYes_Click() 事件处理程序中，只需调用 HierarchyItem.Delete() 方法并提交删除操作：\n\n```\nprivate\
  \ void btnYes_Click(object sender, System.EventArgs e)\n{\n    try\n    {\n    \
  \    deletedObject.Delete();\n        cmsContext.CommitAll();\n        // display\
