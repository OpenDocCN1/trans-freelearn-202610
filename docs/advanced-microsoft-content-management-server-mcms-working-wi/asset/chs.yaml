  \    script += \"<script language=\\\"javascript\\\">\";\n    script += \"window.opener.location.href=\\\
  \"\" + url + \"\\\";\";\n    script += \"window.close();\";\n    script += \"</script>\"\
  ;\n    if (!Page.IsClientScriptBlockRegistered(\"RedirectToNewPosting\"))\n    {\n\
