  \ 中有效组织代码文件中的各部分。\n\n## Building the Data Layer\n\nWeb Part 将生成 XML，列出配置的 StartChannel\
  \ 中使用配置的 SortOrder 的所有 ChannelItems。XML 的使用促进了表现层与数据层的分离。我们的 数据层 将是 Web Part 项目中的另一个类，但它也可以放在完全不同的程序集中以实现进一步的抽象。\n\
  \n> 由于我们使用的是 MCMS Publishing API (PAPI)，此 Web Part 只能在安装了 MCMS 的 SPS/WSS 服务器上运行，因为\
  \ PAPI 无法连接到远程 MCMS 服务器。如果 SPS/WSS 和 MCMS 位于不同的服务器上，一个解决方案是使用 Web 服务调用从 Web Part\
  \ 到 MCMS 服务器。\n\n- 1. 在 Visual Studio .NET 中，右键单击 ExtensibleMCMSPageListingWebPart\
  \ 项目并选择 Add New Item。\n- 2. 在 Add 子菜单下，选择 Add New Class。\n\n## Building SharePoint\
  \ Web Parts\n\n- 3. 输入 `NavigationWebPartMCMSIntegration` 作为名称并单击 OK。\n- 4. 添加对\
  \ `Microsoft.ContentManagement.Publishing.dll` 的引用。与 `Microsoft.ContentManagement`\
  \ 命名空间中的其他库文件一样，它位于 `<install directory>/Microsoft Content Management Server/server/bin`\
  \ 目录中。\n- 5. 现在你应该在屏幕上看到空的 `NavigationWebPartMCMSIntegration` 类。向新类文件添加以下命名空间：\n\
  \  \n  ```csharp\n  using System;\n  using Microsoft.ContentManagement.Publishing;\n\
  \  using System.Security.Principal;\n  using System.Web;\n  using System.Xml;\n\
  \  using System.IO;\n  ```\n  \n- 6. 我们现在将添加 `GetListing()` 方法，该方法连接到 MCMS 并生成列出所有\
  \ ChannelItems 的 XML：\n\n```csharp\npublic static System.Xml.XmlDocument GetListing(string\
  \ StartChannelPath,\n                                                NavigationWebPart.enmSortBy\
  \ sortBy)\n{\n    // Get the channel from the searches object\n    Channel startChannel\
  \ = CmsHttpContext.Current.Searches.GetByPath(\n                               \
  \                 StartChannelPath) as Channel;\n\n    // Was the channel found?\n\
  \    if (startChannel != null)\n    {\n        // Get all Children from the Start\
  \ Channel\n        ChannelAndPostingCollection _Children = startChannel.AllChildren;\n\
  \n        // Sort the Items\n        _Children = SortMCMSChannelItems(sortBy, _Children);\n\
  \n        // Declare the string writer and the XmlTextWriter\n        StringWriter\
  \ tw = new StringWriter();\n        XmlTextWriter _Writer = new XmlTextWriter(tw);\n\
  \n        // Write the <Channel> element\n        _Writer.WriteStartDocument();\n\
  \        _Writer.WriteStartElement(\"Channel\");\n        _Writer.WriteAttributeString(\"\
  path\", startChannel.Path);\n        _Writer.WriteAttributeString(\"displayname\"\
  , startChannel.DisplayName);\n\n        // Loop through all the channel items\n\
  \        foreach (ChannelItem _ChannelItem in _Children)\n        {\n          \
  \  // Write the ChannelItem element and set its attributes\n            _Writer.WriteStartElement(\"\
  ChannelItem\");\n            _Writer.WriteAttributeString(\"path\", _ChannelItem.Path);\n\
  \            _Writer.WriteAttributeString(\"url\", _ChannelItem.Url);\n        \
  \    _Writer.WriteAttributeString(\"displayname\",\n                           \
  \             _ChannelItem.DisplayName);\n\n            // Check what type of Channel\
  \ Item it is and set the type attribute\n            if (_ChannelItem is Posting)\n\
  \            {\n                _Writer.WriteAttributeString(\"type\", \"Posting\"\
  );\n            }\n            else\n            {\n                _Writer.WriteAttributeString(\"\
  type\", \"Channel\");\n            }\n            _Writer.WriteEndElement();\n \
  \       }\n```\n由于我们将 Web Part 构建为服务器控件，我们必须声明控件并通过重写 NavigationWebPart.cs 中的 CreateChildControls\
  \ 方法来实例化它们：\n\n```\n#region declarations - Web controls\nprotected System.Web.UI.WebControls.Xml\
  \ XmlXsIWebControl;\n#endregion\n\n#region Preparing the controls\nprotected override\
  \ void CreateChildControls()\n{\n    XmlXsIWebControl = new System.Web.UI.WebControls.Xml();\n\
  \    this.Controls.Add(XmlXsIWebControl);\n}\n#endregion\n```\n\nSystem.Web.UI.WebControls.Xml\
  \ Web 控件可以使用指定的 XSLT 转换 XML，这比手工开发 XML/XSLT 更高效。\n\n需要重写 RenderWebPart() 方法以确保其余代码正在执行。让我们向\
  \ RenderWebPart() 方法添加代码以生成 MCMS 列表：\n\n```\n#region Methods\nprotected override\
  \ void RenderWebPart(HtmlTextWriter output)\n{\n    // Check our child controls\
  \ are created OK\n    EnsureChildControls();\n\n    try\n    {\n        // Get the\
  \ Page listing from MCMS\n        ExecuteMCMSListing(output);\n    }\n    catch(Exception\
  \ ex)\n    {\n        // In production show only a short message with no internal\
  \ exception details\n        if (this.Mode == enumMode.Production)\n        {\n\
  \            // Suppress Exceptions\n            output.Write(\"An Error Occurred\
  \ in the Navigation Web Part.\");\n        }\n        else\n        {\n        \
  \    // Output detailed exception message (escape characters)\n            output.Write(SPEncode.HtmlEncode(ex.Message\
  \ + \",\" + ex.Source + \",\" + ex.StackTrace));\n        }\n    }\n}\n```\n\n下一个方法\
  \ ExecuteMCMSListing() 确定 Web Part 运行的模式并检索频道列表数据。频道列表数据可以从 MCMS 读取，也可以从文件系统加载测试\
  \ XML 文件。\n\n```\n/// <summary>\n/// Executes the MCMS listing code\n/// </summary>\n\
  private void ExecuteMCMSListing(HtmlTextWriter output)\n{\n    // Check the mode\
  \ we are in and perform the correct action\n    switch (this.Mode)\n    {\n    \
  \    case ennMode.Production:\n        case ennMode.DebugShowException:\n      \
  \      // Set up the Xml/Xsl Webcontrol and render its output to the\n         \
  \   // HtmlTextWriter\n            XmlXslWebControl.Transform = GetTransform();\n\
  \            XmlXslWebControl.Document = NavigationWebPartMCMSIntegration.GetListing(this.StartChannel,\
  \ this.SortBy);\n            XmlXslWebControl.RenderControl(output);\n         \
  \   break;\n\n        case ennMode.DebugShowXml:\n            System.Xml.XmlDocument\
  \ _Listing =\n                NavigationWebPartMCMSIntegration.GetListing(this.StartChannel,\
  \ this.SortBy);\n\n            // Output the escaped XML directly to the HtmlTextWriter\n\
  \            output.Write(SPEncode.HtmlEncode(_Listing.OuterXml));\n           \
  \ break;\n\n        case ennMode.DebugWithTestData:\n            // Get the Test\
  \ XML Data & load into an XmlDocument\n            System.Xml.XmlDocument _DataDocument\
  \ = new System.Xml.XmlDocument();\n            _DataDocument.LoadXml(this.TestXml);\n\
  \            // Setup XML/XSLT Web control and render its output to HtmlTextWriter\n\
  \            XmlXslWebControl.Transform = GetTransform();\n            XmlXslWebControl.Document\
  \ = _DataDocument;\n            XmlXslWebControl.RenderControl(output);\n      \
  \      break;\n\n        default:\n            throw new Exception(\"Invalid Mode!\"\
  );\n    }\n}\n```\n\n为了检索 XsltTransform 对象，我们将创建一个名为 GetTransform() 的辅助方法。此方法将通过将\
  \ XSLT 样式表从文件系统加载到 XmlDocument 对象中来返回 XsltTransform 对象。然后将 XmlDocument 对象加载到 XsltTransform\
  \ 对象中并返回：\n\n```\n/// <summary>\n/// Get the XSLT as a System.Xml.XslTransform object\n\
  /// </summary>\n/// <returns>The System.Xml.XslTransform object</returns>\nprivate\
  \ System.Xml.Xsl.XslTransform GetTransform()\n{\n    // Get the XSLT and load it\
  \ into an XML document\n    System.Xml.XmlDocument _TransformDoc = new System.Xml.XmlDocument();\n\
  \    _TransformDoc.LoadXml(this.PresentationXsl);\n    System.Xml.Xsl.XslTransform\
  \ _Transform = new System.Xml.Xsl.XslTransform();\n    // Load our XSLT\n    _Transform.Load(_TransformDoc.CreateNavigator(),\
  \ null, null);\n    return(_Transform);\n}\n#endregion\n```\n\n\n\n\n由于我们正在动态地向\
  \ Controls 集合添加控件，RenderWebPart() 中的第一次调用应该是 EnsureChildControls()。EnsureChildControls()\
  \ 方法会在 ChildControlsCreated 属性为 false 时调用 CreateChildControls()。\n\n我们还必须定义将用于将我们的\
  \ XML 转换为 HTML 的 XSLT 样式表。\n\n- 1. 在 Visual Studio .NET 中，右键单击 ExtensibleMCMSPageListingWebPart\
  \ 项目并选择 Add New Item。\n- 2. 从 Categories 窗格中选择 Data，然后选择 XSLT File。\n- 3. 输入 DefaultXslt.xslt\
  \ 作为名称并单击 Open。 在代码面板中输入以下 XSLT：\n\n```xml\n<?xml version=\"1.0\" standalone=\"\
  no\"?>\n<xsl:stylesheet xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\" version=\"\
  1.0\">\n<xsl:template match=\"/\">\n<b>\n<a href=\"{@url}\">\n<xsl:value-of select=\"\
  /Channel/@displayname\" />\n</a>\n</b>\n<br />\n<ul>\n<xsl:apply-templates />\n\
  </ul>\n</xsl:template>\n\n<xsl:template match=\"//ChannelItem\">\n<li><a href=\"\
  {@url}\"><xsl:value-of select=\"@displayname\" /></a></li>\n<ul><xsl:apply-templates\
  \ /></ul>\n</xsl:template>\n</xsl:stylesheet>\n```\n\n此时让我们构建整个解决方案，看看是否有任何编译错误。\n\
  \n## Web Part 部署\n\nWeb Parts 编译为 .NET 程序集，可以在 Windows SharePoint Services 和 SharePoint\
  \ Portal Server 中多次重用。Web Parts 通常使用 cabinet (.CAB) 文件部署。我们将在 Visual Studio .NET\
  \ 中创建一个 cabinet 文件项目，该项目将封装我们的 Web Part 的程序集和元数据。然后必须使用随 WSS/SPS 提供的 stsadm.exe\
  \ 实用程序安装此 cabinet 文件。要部署 Web Part，我们将执行以下步骤：\n\n- 1. 准备 Web Part 描述\n- 2. 准备 Web\
  \ Part 清单\n- 3. 创建 CAB 文件部署项目\n- 4. 执行部署\n\n另一个用于打包和部署 Web Parts 的安装工具，名为 WPPackager，可在\
  \ http://www.microsoft.com/downloads/details.aspx?familyid=0fda5912-c136-4b44-911a-011adfcc66e3&displaylang=en\
  \ 获取。WPPackager 为您的 Web Part 创建 Windows 安装程序文件 (MSI)，在安装期间执行 SPS/WSS 的必要配置。\n\n\
  有关此工具的更多信息，请参阅 *Using WPPackager to Package and Deploy Web Parts for Microsoft SharePoint\
  \ Products and Technologies*，网址为 http://msdn.microsoft.com/library/default.asp?url=/library/en-us/odc_SP2003_ta/html/sharepoint_deployingwebparts_msi.asp。\n\
  \n## 准备 Web Part 描述 (.DWP) 文件\n\n将 Web Part 部署到 SharePoint 时，部署过程中应填充多个文件。其中一个文件是\
  \ Web Part 描述 (.DWP) 文件。\n\n- 1. 在 Visual Studio .NET 中，右键单击 `ExtensibleMCMSPageListingWebPart`\
  \ 项目并选择 Add New Item。\n- 2. 在左侧的 Categories 窗格中，展开 Local Project Items 并选择 Data。\n\
  - 3. 选择 Web Part DWP。\n- 4. 输入名称为 `NavigationWebPart` 并单击 OK。\n\n.DWP 文件描述了我们的 Web\
  \ Part，给出了属性的默认值以及 Web Part 所需的任何程序集。让我们为我们的导航 Web Part 创建此文件：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<WebPart xmlns=\"http://schemas.microsoft.com/WebPart/v2\"\
  \ >\n  <Title>Extensible MCMS Page Listing Web Part</Title>\n  <Description>\n \
  \   Displays MCMS Postings and Channels within a specified channel and\n    transforms\
  \ the display using XSLT.\n  </Description>\n  <Assembly>ExtensibleMCMSPageListingWebPart</Assembly>\n\
  \  <TypeName>ExtensibleMCMSPageListingWebPart.NavigationWebPart</TypeName>\n</WebPart>\n\
  ```\n\n此文件中指定的值允许 Windows SharePoint Services 为 Web Part 生成元数据。元素的含义在下表中给出：\n\n\
  | 元素名称 | 描述 |\n|---|---|\n| `Title` | 用户在 Web Part 库中看到的标题，以及 Web Part 添加到 Web Part\
  \ 区域后的默认标题。 |\n| `Description` | 在 Web Part 库中悬停在 Web Part 标题上时出现的工具提示。 |\n| `Assembly`\
  \ | 程序集名称。对于本示例，我们仅使用程序集名称，但也可以使用完整的 Web Part 程序集描述，如下所示：`AssemblyName`（不带 `.DLL`\
  \ 扩展名），`Version=VersionNumber`，`Culture=Culture`，`PublicKeyToken=PublicKeyToken`\
  \ |\n| `TypeName` | 命名空间限定的类名。 |\n\n## 准备 Web Part 清单文件\n\n将 Web Part 作为 CAB 文件部署时，我们必须创建一个\
  \ Web Part 清单文件，为 CAB 文件部署项目提供我们 Web Part 和 Web Part 描述文件的详细信息。\n\n- 1. 在 Visual\
  \ Studio .NET 中，右键单击 ExtensibleMCMSPageListingWebPart 项目并选择 'Add New Item'。\n- 2.\
  \ 在左侧的 Categories 窗格中，展开 Local Project Items 并选择 Data。\n- 3. 选择 WPManifest。\n- 4.\
  \ 输入名称为 `Manifest` 并单击 Open。\n\n为此文件输入以下代码以对应我们的 Web Part：\n\n```xml\n<?xml version=\"\
  1.0\"?>\n<WebPartManifest xmlns=\"http://schemas.microsoft.com/WebPart/v2/Manifest\"\
  >\n  <Assemblies>\n    <Assembly FileName=\"ExtensibleMCMSPageListingWebPart.dll\"\
  >\n      <ClassResources>\n        <ClassResource FileName=\"TestXml.xml\"/>\n \
  \       <ClassResource FileName=\"DefaultXslt.xslt\"/>\n      </ClassResources>\n\
  \      <SafeControls>\n        <SafeControl Namespace=\"ExtensibleMCMSPageListingWebPart\"\
  \n                     TypeName=\"*\" />\n      </SafeControls>\n    </Assembly>\n\
  \  </Assemblies>\n  <DwpFiles>\n    <DwpFile FileName=\"NavigationWebPart.dwp\"\
  />\n  </DwpFiles>\n</WebPartManifest>\n```\n\n`Manifest.xml` 允许我们在部署 CAB 文件中包含多个程序集、资源和\
  \ Web Part 描述文件。元素如下所述：\n\n| 元素名称 | 描述 |\n|---|---|\n| Assemblies | 允许我们在 cabinet\
  \ 文件中包含多个程序集。 |\n| Assembly | 用于通过将 `FileName` 属性设置为 DLL 名称来定义程序集。 |\n| ClassResources\
  \ | 定义我们的类使用的资源。资源路径必须相对于项目文件。资源是支持文件，例如图像或数据文件。 |\n| SafeControls | 列出此 Web Part\
  \ 将使用的安全控件（以便在部署时可以将它们添加到 SharePoint 站点的 Web.config 中）。 |\n| DwpFiles | 用于定义此 Web\
  \ Part 使用的 Web Part 描述文件。 |\n\n## 创建部署项目\n\n此时，我们拥有一个完成的 Web Part 项目，其中包含必要的部署配置文件。现在我们需要创建一个部署项目，将\
  \ Web Part 和其他必要文件封装到单个 cabinet 文件中以供安装。\n\n- 1. 在 Visual Studio .NET 中，右键单击 ExtensibleMCMSPageListingWebPart\
  \ 解决方案并选择 'Add New Project'。\n- 2. 在 Project Types 窗格中，选择 Setup and Deployment Projects，并在模板窗格中选择\
  \ Cab Project。\n- 3. 输入名称 ExtensibleMCMSPageListingWebPartDeployment 并单击 OK。\n-\
  \ 4. 右键单击 ExtensibleMCMSPageListingWebPartDeployment 项目并选择 Add 然后 Project Output。\n\
  - 5. 从项目下拉列表中选择 ExtensibleMCMSPageListingWebPart。\n- 6. 按住 Ctrl 键，选择 Primary Output\
  \ 和 Content Files 并单击 OK。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_237_0.png)\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_237_1.png)\n\n- 7. 在 ExtensibleMCMSPageListingWebPart\
  \ 项目中，右键单击 NavigationWebPart.dwp 并单击 Properties。\n- 8. 将 Build Action 属性设置为 Content。这将允许部署项目将文件添加到包中。\n\
  \n您的部署项目现在应如下所示：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_238_0.png)\n\n现在通过右键单击项目并选择\
  \ Build 来构建您的部署项目。\n\n## 执行部署\n\n现在我们有了 cabinet 文件，让我们将其部署到 SharePoint 服务器。\n\n\
  > 如果您在远程工作站上开发，请在执行以下步骤之前将 cabinet 文件复制到服务器。\n\n我们将使用 stsadm.exe 部署它，您可以在 <local_drive>\\\
  Program Files\\Common Files\\Microsoft Shared\\Web Server Extensions\\60\\bin\\\
  \ 下找到它。\n\n启动 DOS 命令提示符，并输入以下命令：\n\n```\ncd \"C:\\Program Files\\Common Files\\\
  Microsoft Shared\\web server extensions\\60\\BIN\"\n```\n\n```\nSTSADM.EXE -o addwppack\
  \ -filename \"C:\\Documents and Settings\\Administrator\\My Documents\\Visual Studio\
  \ Projects\\ExtensibleMCMSPageListingWebPartDeployment\\Debug\\ExtensibleMCMSPageListingWebPartDeployment.cab\"\
  \ -globalinstall -force\n```\n\n路径 C:\\Documents and Settings\\Administrator\\My\
  \ Documents\\Visual Studio Projects\\ 可能需要更改，具体取决于您创建项目的路径。\n\n如果 Web Part 成功部署，您应该会看到：\n\
  \n```\nExtensibleMCMSPageListingWebPartDeployment.cab: Deploying to http://server/.\n\
  Operation completed successfully.\n```\n\n> 当您以 Release 模式编译部署项目时，命令行将更改为：\n> STSADM.EXE\
  \ -o addwppack -filename \"C:\\Documents and Settings\\Administrator\\My Documents\\\
  Visual Studio Projects\\ExtensibleMCMSPageListingWebPartDeployment\\Release\\ExtensibleMCMSPageListingWebPartDeployment.cab\"\
  \ -globalinstall -force\n\n\n\n\n\n## 构建 SharePoint Web 部件\n\n- 9. 点击确定，再次点击确定，然后点击关闭。\n\
  - 10. 浏览到 `C:\\Documents and Settings\\Administrator\\My Documents\\Visual Studio\
  \ Projects\\ExtensibleMCMSPageListingWebPartDeployment\\Debug\\`，右键单击 `ExtensibleMCMSPageListingWebPartDeployment.cab`\
  \ 并选择安装 Web 部件以部署你的 Web 部件。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_240_0.png)\n\
  \n### 将我们的 Web 部件添加到页面\n\nWeb 部件现已部署到服务器。接下来需要将其添加到 Web 部件页面以查看所有组件的整合。\n\n- 1.\
  \ 启动 Internet Explorer 并浏览到你喜欢的 WSS 站点（确保你在该站点上具有设计者权限）。\n- 2. 点击修改共享页面链接并选择添加 Web\
  \ 部件 | 浏览：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_240_1.png)\n\n- 3. 你现在将看到工具窗格，其中列出了\
  \ Web 部件库。选择虚拟服务器库：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_241_0.png)\n\n-\
  \ 4. 点击可扩展 MCMS 页面导航 Web 部件并将其拖到屏幕左侧的任意 Web 部件区域。你应该会看到以下内容：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_241_1.png)\n\
  \n如果可扩展 MCMS 页面导航 Web 部件未出现在虚拟服务器库中，请使用 *执行部署* 中概述的方法重新部署 Web 部件到服务器，并验证 `stsadm.exe\
  \ -o addwppack` 命令期间未发生错误。\n\n如果出现错误消息“发生错误”，请验证 `Web.config` 中的信任级别设置是否足够。\n\n\
  另一个经常出现的错误是“此 Web 部件页面上的 Web 部件或 Web 表单控件无法显示或导入，因为它在此站点上未注册为安全。” 如果你看到此消息，请验证 `Manifest.xml`\
  \ 和 `NavigationWebPart.dwp` 文件的内容是否存在拼写错误。\n\n- 5. 要关闭工具窗格，请点击右上角的 X。\n\n### 配置\
  \ Web 部件\n\n我们现在已将 Web 部件添加到 Web 部件页面，并且它正在使用默认设置运行。在下一步中，我们将更改这些设置。\n\n- 1. 在 Web\
  \ 部件右上角，点击向下箭头以调出 Web 部件菜单并选择修改共享 Web 部件\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_242_0.png)\n\
  \n由于我们已将属性上的 `WebPartStorage` 属性设置为 `Storage.Shared`，因此我们只能修改共享视图，该视图适用于所有用户的此 Web\
  \ 部件实例。如果我们希望用户存储个性化的 Web 部件自定义属性值，则必须将属性上的 `WebPartStorage` 属性设置为 `Storage.Personal`。\n\
  \n- 2. 工具窗格现在将出现在屏幕右侧。\n- 3. 展开 MCMS 列表呈现组。\n- 4. 将 `DefaultXslt.xslt` 的内容复制到呈现\
  \ XSLT 文本框中（可通过点击文本框右侧的省略号 [...] 打开更大的文本框）。\n- 5. 将 `TestXml.xml` 的内容复制到测试 XML 文本框中。\n\
  - 6. 点击应用以在屏幕上查看设置，或点击确定以应用设置并关闭工具窗格。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_243_0.png)\n\
  \n页面应刷新，Web 部件将呈现 MCMS /Channels/ 路径中的项目列表。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_243_1.png)\n\
  \n### 调试 Web 部件\n\n由于我们的 Web 部件现在通过 WSS/SPS 运行，因此我们无法通过 Visual Studio .NET 开始调试选项直接调试\
  \ Web 部件。\n\n默认情况下，WSS/SPS 已关闭调试。要打开调试，请编辑 IIS 虚拟服务器的 Web.config 并将 debug 属性设置为\
  \ true。\n\n要使用 Visual Studio .NET 从 SPS/WSS 服务器调试我们的 Web 部件，我们必须将 Web 部件添加到 Web\
  \ 部件页面并执行以下操作：\n\n- 1. 在 Visual Studio .NET 中打开 ExtensibleMCMSPageListingWebPart\
  \ 项目。\n- 2. 在 NavigationWebPart.cs 中的 RenderWebPart() 方法上设置断点。\n- 3. 从工具菜单中选择调试进程（或按\
  \ Ctrl+Alt+P）。\n- 4. 选择 w3wp.exe 进程并点击附加。\n- 5. 验证是否已选中公共语言运行时，然后点击确定：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_244_0.png)\n\
  \n- 6. 点击进程对话框上的关闭并刷新 Web 部件页面。\n- 7. 你的断点现在应被选中，你应该能够逐步执行代码。\n\n你的 Web 部件必须以调试配置进行编译，以确保调试符号部署到服务器。\n\
  \n### 总结\n\n在本章中，我们通过构建一个 MCMS 导航 Web 部件来探索 Web 部件框架的基础，该部件可以从 SharePoint 站点中显示\
  \ MCMS 频道项目。在开发过程中，我们利用了 Visual Studio .NET 的 Web 部件模板来创建我们的 Web 部件。这使我们能够利用 Visual\
  \ Studio .NET 的服务器控件开发架构。我们的 Web 部件生成所发现频道中频道项目和子频道的 XML 表示。然后使用可配置的 XSLT 样式表转换\
  \ XML 数据。最后，我们通过创建 CAB 文件部署项目并运行 SharePoint STSADM.EXE 部署工具将 Web 部件部署到 SharePoint\
  \ 服务器。\n\n## 有用的占位符控件\n\nMCMS 最令人兴奋的功能之一是创建自定义占位符服务器控件的灵活性。你可以创建各种形状和大小的占位符控件，为任何组织的作者提供多种量身定制的解决方案。如果开箱即用不可用——就构建它！而且很有可能你甚至不必从头开始构建自定义占位符控件。世界各地的\
  \ MCMS 开发人员可能已经在自己的工作中构建了类似的控件。本章汇编了常用且非常有用的占位符控件集合。\n\n- **日期时间选择器占位符控件**  \n \
  \ 这为作者提供了按其选择的格式选择日期和时间值的选择器。告别格式错误和无效的日期，使用这个巧妙的控件。\n\n- **接受多个附件的占位符控件**  \n \
  \ 这使作者能够上传所需的文件数量，通过提供一个像多个 `SingleAttachmentPlaceholderControls` 协同工作一样的控件。我们还将探讨随\
  \ Web Author 提供的未记录的插入附件对话框，并展示如何在自定义占位符控件中重用它。\n\n- **图像旋转占位符控件**  \n  作者可以使用此控件通过从指定的资源库中随机选择图像来管理网络广告。每次在呈现视图中加载控件时都会显示随机图像。\n\
  \n- **存储各种 HTML 标签的占位符控件**  \n  如果你曾经想允许作者上传受限的 HTML 标签和 JavaScript，这个控件适合你。我们展示了需要进行的修改，以使\
  \ `HtmlPlaceholderControl` 接受所有 HTML 标签——包括 IFRAME、OBJECT 和 APPLET 标签以及表单元素！\n\n\
  - **DataGrid 占位符控件**  \n  这使用熟悉的 DataGrid 来管理 XML 内容。作者可以在无需了解其技术细节的情况下添加、编辑和删除\
  \ XML 内容的行。我们还展示了如何优雅地处理需要回发的占位符，而不会产生离开警告警报。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_247_0.png)\n\
  \n在呈现视图中，所选的日期和时间会显示在屏幕上。\n\n15 Apr 2005 23:33\n\n为了几乎不可能将无效日期保存到数据库中，日期时间选择器控件的内容通常在保存前进行验证。\n\
  \nMCMS 未随附日期时间选择器占位符控件，因此让我们从头开始构建一个。\n\n### DateTimePickerPlaceholderControl 类\n\
  \n让我们通过向 UsefulPlaceholderControls 项目添加一个名为 DateTimePickerPlaceholderControl.cs\
  \ 的类文件开始构建日期时间选择器占位符控件。\n\n控件需要使用下面突出显示的命名空间中的方法，因此将它们添加到类文件中。\n\n```\nusing System;\n\
