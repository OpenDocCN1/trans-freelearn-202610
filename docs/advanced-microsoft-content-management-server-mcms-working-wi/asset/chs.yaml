  \ by path\n\t\t\t\t_Posting = (Posting)CurrentCmsContext.Searches.GetByPath(this.Path);\n\
  \n\t\t\t\t// Verify the posting object was found\n\t\t\t\tif (_Posting == null)\n\
  \t\t\t\t{\n\t\t\t\t\tthrow new Exception(\"The posting could not be found at path\
  \ \" + this.Path + \"\");\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\n        // Return the posting\
  \ object\n        return(_Posting);\n    }\n    set\n    {\n        _Posting = value;\n\
  \    }\n}\n#endregion\n```\n\n为了访问当前 posting 的自定义属性，我们将向 LightweightPosting 类添加\
  \ CustomProperties 属性，该属性在必要时将加载一个 LightweightCustomPropertyCollection：\n\n```\n\
  #region Property - Custom Properties\n\n/// <summary>\n/// The lightweight custom\
