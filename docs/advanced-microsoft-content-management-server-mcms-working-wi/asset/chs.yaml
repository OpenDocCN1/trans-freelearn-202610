  ;\n    }\n    catch(Exception ex)\n    {\n        // rollback all changes\n    \
  \    cmsContext.RollbackAll();\n        // the CMS context needs to be disposed\
  \ of after a rollback\n        cmsContext.Dispose();\n        // display error message\n\
  \        lblErrorMessage.Text = ex.Message;\n    }\n}\n```\n\n如果在处理过程中发生任何错误，删除操作将被回滚，并显示错误消息。\n\
  \n使用 PAPI 删除对象时，需要注意以下几个要点：\n\n-   包含对象的容器只有在其中所有项目都被删除后才能删除。\n-   具有现有依赖项的对象只有在所有依赖项被移除后才能删除。例如，如果有基于模板的发布项，则必须先删除这些发布项，才能删除模板。\n\
  -   链接到资源的发布项即使资源已被删除，仍会保留到该资源的链接。这是为了防止链接断裂。但是，资源管理器将无法再访问该文件。只有管理员才能查看它们。在第 13\
  \ 章中，我们将在技巧 #4：如何应对指向已删除资源的链接 中提出处理这些链接的方法。\n-   与 Site Manager 中的“删除”选项（删除的对象存储在“已删除项目”回收站中并可恢复）不同，使用\
  \ PAPI 删除的对象在删除提交后将无法再访问。MCMS 后台进程将删除所有未被发布项引用的资源。被发布项引用的资源可以通过向 Microsoft 支持部门请求存储过程（参考编号：SOX040517700117）来恢复。\n\
  \n## 总结\n\n在本章中，我们学习了如何使用 PAPI 管理模板库、模板和资源。我们为 CMS Explorer 提供了几个增强功能，包括创建模板库、模板和资源的对话框。我们还展示了如何以编程方式提交（或签入）、复制和移动模板。我们探索的另一个功能是替换现有资源，即可以在保留资源的\
  \ GUID 和 URL 的同时替换其文件内容。最后，我们了解了如何使用 PAPI 从内容存储库中删除对象。\n\n正如您所看到的，PAPI 不仅为您提供了构建由\
  \ MCMS 管理的网站的基本工具，还允许您对其进行自定义，以满足各种独特的业务需求。\n\n某些搜索引擎使用 META 标签来实现分类法。当页面被索引时，搜索引擎可能会将\
  \ Description META 标签的内容添加到名为 description 的字段中。然后，您可以使用搜索引擎的 API 来搜索所有仅在此 description\
  \ 字段中包含特定关键字的页面。组合多个 META 标签可以实现复杂搜索。例如，您可以编程搜索 description META 标签包含单词“plant”且\
  \ location META 标签包含“South America”的页面，以检索所有关于南美洲植物的页面。\n\n请注意，并非每个搜索引擎都支持使用 META\
  \ 标签，因为它们可能会使用与页面内容无关的信息来影响索引。例如，Google 等引擎有自己内部的机制来为每个页面生成摘要。请参阅您所使用搜索引擎的文档，以查找其识别的\
  \ META 标签列表。\n\n大多数搜索引擎能够执行“增量抓取”，即只索引自上次索引以来被修改的页面。执行增量抓取（而不是完全抓取）可以优化索引过程。MCMS\
  \ 驱动的网站的一个问题是页面内容是动态的，每次访问站点时内容都可能不同。对于搜索索引器，这些网站要么不返回最后修改日期信息，要么总是看起来已被修改。因此，MCMS\
  \ 站点无法进行增量抓取。在本章中，我们将开发一个解决方案，将最后修改日期输出到 HTTP 响应头中，从而使搜索引擎能够对 MCMS 站点执行增量抓取。\n\n\
  此外，搜索准确性可能会受到页面上的导航控件以及常见的页眉和页脚元素的影响。这可能导致搜索结果中出现过多噪声（例如，如果“新闻稿”页面出现在共享菜单控件中，搜索该页面将产生所有带有此菜单的页面）。通过在站点被索引时隐藏导航元素，可以提高准确性。我们将演示如何实现这一点。\n\
  \n在本章中，我们还将探讨一些技巧和诀窍，以获得最佳、最准确的搜索引擎结果，包括标题、关键字和描述。\n"
- "## 使用 ROBOTS META 标签影响搜索引擎\n\n通常，索引的大部分内容来自频道渲染脚本和发布项生成的页面。毕竟，它们是站点中最终用户可见的部分。要告诉搜索引擎哪些页面需要索引、哪些页面需要忽略，以及是否从当前页面继续跟踪链接，您可以在页面中添加一个名为\
  \ ROBOTS 的特殊 META 标签。大多数（但不是所有）搜索引擎会遵循此 META 标签，并评估其 content 属性，以确定是否应将页面添加到索引中，以及是否应跟踪此页面中的链接。\n\
  \n为了让 MCMS 作者能够利用此功能，频道和发布项有两个额外的属性：\n\n- IsRobotIndexable\n- IsRobotFollowable\n\
  \n这两个属性可用于生成 ROBOTS META 标签。如前所述，请注意某些搜索引擎选择忽略 ROBOTS META 标签。\n\n下表总结了不同属性设置的行为：\n\
  \n| IsRobotFollowable | IsRobotIndexable | 要呈现的 META 标签 | 备注 |\n|---|---|---|---|\n\
  | False | False | <meta name=\"ROBOTS\" content=\"NOFOLLOW, NOINDEX\"> | 识别机器人 META\
  \ 标签的搜索引擎不会索引该页面，也不会跟踪其超链接。 |\n| False | True | <meta name=\"ROBOTS\" content=\"\
  NOFOLLOW, INDEX\"> | 识别机器人 META 标签的搜索引擎会索引该页面，但不会跟踪其超链接。 |\n| True | False | <meta\
  \ name=\"ROBOTS\" content=\"FOLLOW, NOINDEX\"> | 识别机器人 META 标签的搜索引擎不会索引该页面，但会跟踪其超链接。\
  \ |\n| True | True | <meta name=\"ROBOTS\" content=\"FOLLOW, INDEX\"> | 识别机器人 META\
  \ 标签的搜索引擎会索引该页面并跟踪其超链接。 |\n\n有关 ROBOTS META 标签的更多信息，请查看此资源：\n\nhttp://www.robotstxt.org/wc/exclusion.html#meta\n\
  \n## RobotMetaTag 控件和频道渲染脚本\n\nMCMS 附带一个名为 RobotMetaTag 的控件，它会自动添加到所有由 Visual Studio\
  \ .NET“MCMS 模板文件”模板创建的模板文件中。RobotMetaTag 控件用于根据页面的 IsRobotFollowable 和 IsRobotIndexable\
  \ 属性生成 ROBOTS META 标签。\n\n遗憾的是，此控件不适用于频道渲染脚本。如果将控件添加到频道渲染脚本中，即使设置了频道的 IsRobotFollowable\
  \ 和 IsRobotIndexable 属性，也不会生成 ROBOTS META 标签。为了解决这个问题，让我们实现此控件的一个增强版本，使其同时适用于频道渲染脚本和模板。\n\
  \n> 在 MCMS 附带的 WoodgroveNet 示例站点中，RobotMetaTag 控件被包装在一个名为 HeadTags.ascx 的用户控件中。\n\
  \n首先，打开 Tropical Green 解决方案。将一个新类文件添加到 TropicalGreenControlLib 项目中，名称为 EnhancedRobotMetaTag.cs。\n\
  \n该控件需要使用以下突出显示命名空间中的方法，因此请将它们添加到类文件中。\n\n```\nusing System;\nusing System.ComponentModel;\n\
  using System.Web.UI;\nusing Microsoft.ContentManagement.Common;\nusing Microsoft.ContentManagement.Publishing;\n\
  using Microsoft.ContentManagement.WebControls;\nnamespace TropicalGreenControlLib\n\
  {\n    ... code continues ...\n}\n```\n\n\n\n\n\n```csharp\nprotected override void\
  \ Render( HtmlTextWriter writer )\n{\n    ChannelItem currentItem = CmsHttpContext.Current.ChannelItem;\n\
  \n    if( currentItem != null )\n    {\n        string followKey = (currentItem.IsRobotFollowable)\
  \ ? \"Follow\" : \"noFollow\";\n        string indexKey = (currentItem.IsRobotIndexable)\
  \ ? \"Index\" : \"noIndex\";\n\n        // write the robot META tag\n        writer.Write(\"\
  <meta name=\\\"ROBOTS\\\"\\n\"\n                   + \" content=\\\"\" + followKey\
  \ + \",\" + indexKey + \"\\\">\\n\");\n\n        if( this.RenderBaseHref )\n   \
  \     {\n            // write the Base tag\n            writer.Write(\"<base href=\\\
  \"\" + Page.Request.Url.AbsoluteUri + \"\\\">\\n\");\n        }\n    }\n}\n```\n\
  \n保存并生成解决方案。像添加其他自定义控件一样，将该控件添加到工具栏中，然后就可以将其拖放到频道呈现脚本或模板文件中的`<head>`标签之间。\n\n##\
  \ 输出 META 标签\n\n除了 ROBOTS META 标签之外，你还可以输出其他 META 标签，以帮助你所使用的特定搜索引擎进行索引。搜索引擎常用的标签包括\
  \ `<title>` 标签以及 Description 和 Keywords META 标签。\n\n在 MCMS 中，频道和发布项具有 Description\
  \ 和 DisplayName 属性，这些属性通常分别适用于 Description META 标签和 `<title>` 标签。\n\n> 自定义属性也可以用作\
  \ META 标签，并呈现为 `<meta name=\"CustomPropertyName\" content=\"CustomPropertyValue\"\
  >`\n\n作者可以输入关键词并将其存储为自定义属性值。接下来，你需要从存储库中检索这些值，并将它们作为 META 标签显示在页面的 head 区域中。\n\n\
  有几种方法可以实现这一点：\n\n- 最快的方法是在模板 HTML 代码中直接使用 `<%= %>` 构造或 `Response.Write()` 调用。\n\
  - 如果内容位于自定义属性或占位符中，你可以使用代码隐藏文件来检索它。\n\n与常规控件一样，使用 Web 用户控件可以在同一项目的模板文件之间共享代码。如果你需要在多个项目中存储的页面间生成同一组标签，可以考虑像前面为\
  \ ROBOTS 标签所做的那样编写一个自定义控件。\n\n```csharp\nusing Microsoft.ContentManagement.Publishing;\n\
  ... code continues ...\n\nprivate void Page_Load(object sender, System.EventArgs\
  \ e)\n{\n    // Put user code to initialize the page here\n    Posting currentPosting\
  \ = CmsHttpContext.Current.Posting;\n\n    string keywords = \"\";\n    CustomProperty\
  \ cpKeywords = currentPosting.CustomProperties[\"Keywords\"];\n    if(cpKeywords!=null)\n\
  \    {\n        keywords = cpKeywords.Value;\n    }\n\n    litKeywords.Text = \"\
  <meta name=\\\"Keywords\\\" content=\\\"\" + keywords + \"\\\">\";\n}\n```\n\n###\
  \ 重写 Web 用户控件的 Render 方法\n\n这里有另一种方法：不用在 `<head>` 标签内使用 Literal 控件，你可以创建一个 Web 用户控件并重写其\
  \ Render() 方法。首先获取发布项的一个实例，然后获取其自定义属性值，最后创建 META 标签：\n\n```csharp\nnamespace TropicalGreen.UserControls\n\
  {\n    using System;\n    using System.Data;\n    using System.Drawing;\n    using\
  \ System.Web;\n    using System.Web.UI.WebControls;\n    using System.Web.UI.HtmlControls;\n\
  \n    // MCMS PAPI\n    using Microsoft.ContentManagement.Publishing;\n\n    //\
  \ Namespace for HtmlTextWriter\n    using System.Web.UI;\n\n    public abstract\
  \ class MetaTags : System.Web.UI.UserControl\n    {\n        private void Page_Load(object\
  \ sender, System.EventArgs e)\n        {\n            // Put user code to initialize\
  \ the page here\n        }\n\n        protected override void Render( HtmlTextWriter\
  \ writer )\n        {\n            CmsHttpContext cmsContext = CmsHttpContext.Current;\n\
  \n            Posting p = cmsContext.Posting;\n            string keywords = \"\"\
  ;\n            CustomProperty cpKeywords = p.CustomProperties[\"Keywords\"];\n \
  \           if (cpKeywords != null)\n            {\n                keywords = cpKeywords.Value;\n\
  \            }\n            writer.WriteLine(\"<meta name=\\\"keywords\\\" Content=\\\
  \"\"\n                           + keywords + \"\\\">\");\n        }\n\n       \
  \ #region Web Form Designer generated code\n        ... code continues ...\n   \
  \     #endregion\n    }\n}\n```\n\n## 为搜索索引准备发布项\n\n我们刚刚创建的 MetaTags 用户控件还可以进行增强，将发布项的描述和自定义属性作为\
  \ META 标签输出。\n\n> 你可以使用相同的技术将占位符内容添加到 META 标签中。MCMS Connector for SharePoint Technologies\
  \ 包含可自定义的 SearchMetaTagGenerator 服务器控件，可从属性和自定义属性生成 META 标签。该控件将在第 5 章中讨论。\n\n###\
  \ 配置模板以允许发布项返回准确的最后修改时间\n\n由于发布项是动态构建的，因此有关发布项最后修改日期的准确信息将始终反映当前日期和时间。因此，搜索引擎无法对\
  \ MCMS 站点执行增量抓取，而总是会进行完全抓取。\n\n考虑一个使用 SharePoint Portal Server 搜索组件的网站。当 SharePoint\
  \ Portal Server 执行增量索引抓取时，它会对所接触的站点上的每个页面发送 HTTP GET 请求。如果发现某个页面先前已被索引，则仅当该页面自上次索引作业以来被修改过时，SharePoint\
  \ 才会更新其在索引中的条目。为了确定页面是否被修改，SharePoint 会发送一个条件 HTTP GET 请求，该请求在 `If-Modified-Since`\
  \ HTTP 头中包含页面最后修改的日期和时间。如果页面未被修改，响应将是 HTTP 状态码 304（未修改），SharePoint 将不会对此页面进行索引。如果响应是\
  \ HTTP 状态码 200（正常），则表示页面已更新，SharePoint 将继续对其进行索引。这个概念对于由物理文件组成的静态网站很有效，因为其最后修改日期反映的是页面实际被修改的日期。\n\
  \n然而，由于其页面是即时组合的，IIS 将始终假定发布项的最后修改日期是当前日期和时间。由于存储在 `If-Modified-Since` HTTP 头中的日期总是更早的日期，IIS\
  \ 总是返回状态码 200（正常）而不发送最后修改日期。因此，SharePoint Portal Server 永远不会对站点进行增量抓取，实际上每次都会进行完全索引。所有使用\
  \ `If-Modified-Since` HTTP 头执行增量抓取的搜索引擎都具有这种行为。\n\n显然，这对于搜索引擎索引过程的性能来说并不理想，对 MCMS\
  \ 站点的性能也不友好。以我们的 Tropical Green 站点为例，影响很小，因为发布项的总数非常低。然而，考虑一个包含 10,000 个发布项的站点，其中自上次抓取以来只有\
  \ 10% 发生了变化。SharePoint Portal Server 索引的内容将是实际所需量的十倍，而不是抓取和索引 1,000 个页面。\n\n要解决此问题，我们需要修改模板，以返回发布项实际修改的时间以及\
  \ HTTP 状态码 200；如果发布项自上次抓取以来未更改，则应返回 HTTP 状态码 304。我们将按以下步骤操作：\n\n1. 获取发布项最后修改的日期。\n\
  2. 获取 HTTP `If-Modified-Since` 头返回的时间，并将其转换为 UTC 以消除时区的任何影响。\n\n```csharp\nreturn\
  \ reAllSearch.Match(CurrentUserAgent).Success;\n}\n// agents are not specified in\
  \ the web.config\nreturn(false);\n}\n```\n\n## 隐藏导航元素\n\n对于 Tropical Green 解决方案中的每个导航控件，我们需要在其加载或呈现期间添加一项检查，以确定页面是否正被抓取。\n\
  \n最简单的方法是在控件的 Page_Load() 或 Render() 方法中执行此操作。我们要检查当前请求是否来自爬虫程序，如果是则隐藏该控件，否则正常加载：\n\
  \n```csharp\nif (!TropicalGreen.Classes.SearchHelper.IsCrawler())\n{\n    // Bind\
  \ the Data\n}\nelse\n{\n    // Is being crawled so hide the user control\n    this.Visible\
  \ = false;\n}\n```\n\n### 创建“发布项/频道列表”用户控件\n\n既然我们已经隐藏了导航控件，仍然必须为爬虫程序提供一种遍历站点的机制。最简单的方法是构建一个用户控件，列出当前频道中的发布项和频道，但不包含其显示名称。\n\
  \n现在让我们构建 CrawlingNavigationControl 用户控件：\n\n1. 在 Visual Studio .NET 中打开 TropicalGreen\
  \ 项目。\n2. 在用户控件文件夹下，创建一个新的用户控件，并将其命名为 CrawlingNavigationControl。\n3. 切换到代码隐藏文件（CrawlingNavigationControl.ascx.cs）。\n\
  4. 导入以下命名空间：\n\n   ```csharp\n   using System.Text;\n   using Microsoft.ContentManagement.Publishing;\n\
  \   ```\n\n我们将在所有模板和频道呈现脚本的 Page_Load() 中添加逻辑，以创建一个包含超链接的新 literal 控件。超链接标签将是索引器忽略的文本（噪音词）。在此情况下，我们使用单词\"\
  and\"。\n\n```csharp\nprivate void Page_Load(object sender, System.EventArgs e)\n\
  {\n    // Is the site being crawled?\n    if(TropicalGreen.Classes.SearchHelper.IsCrawler())\n\
  \    {\n        // declare & instantiate a string builder to hold the hyperlinks\n\
  \        StringBuilder sb = new StringBuilder();\n        // loop through all the\
  \ channel items in the current channel\n        foreach(ChannelItem item in CmsHttpContext.Current.Channel.AllChildren)\n\
  \        {\n            // append the hyperlink creating a unique label\n```\n\n\
  \n\n\n```\nsb.Append(\"<a href=\\\"\" + item.Url + \"\\\">&and</a>\");\n}\n\n//\
  \ instantiate a new literal control\nLiteral litLinks = new Literal();\n\n// set\
  \ the literal controls text\n// to be the text from the string builder\nlitLinks.Text\
  \ = sb.ToString();\n\n// add the literal control to the control collection\nthis.Controls.Add(litLinks);\n\
  }\n}\n```\n\n要启用 CrawlingNavigationControl，你应将它添加到每个模板文件的底部。或者，如果你的站点在每个模板上都使用了页脚用户控件或页眉用户控件，你也可以将\
  \ CrawlingNavigationControl 放在其中。\n\n## 搜索引擎优化技巧\n\n大多数搜索引擎使用专有算法来对网页进行爬取、索引和排名。没有任何方法能保证你的网站获得高排名，但这里有一些通用的技巧可以帮到你。\n\
  \n## 设计与导航注意事项\n\n有几个问题可能导致你的网站无法被搜索引擎正确索引：\n\n## 框架\n\n如果你的网站使用框架，框架内的内容可能不会被索引。要解决此问题，需要被索引的内容应放在\
  \ <NOFRAMES> 标签内。\n\n## Flash 内容\n\n如果你的首页主要以 Flash 为主，其中的内容和超链接可能无法被正确索引。建议在 HTML\
  \ 中重现 Flash 中的内容和超链接，并且要么检测请求是否来自爬虫，要么把这些内容包含在所有页面中但将其隐藏。\n\n## 图像映射与 JavaScript\
  \ 导航\n\n图像映射和由 JavaScript 填充的导航控件对开发者和用户来说都是很好的选择，但搜索引擎可能无法解析运行时生成的链接。如果你的网站使用图像映射或\
  \ JavaScript 生成超链接，建议用标准 HTML 重现这些链接。\n\n## 为 Title 标签添加详细信息\n\n<title> 标签是搜索引擎优化中最重要的标签之一。你应该让标题准确描述页面内容，因为它会显示为\
  \ Web 浏览器中的窗口标题，也会显示为搜索结果的标题。每个页面的标题应当唯一，并且每个关键词都应作为内容在页面中可见。此外，大多数搜索引擎对 title 标签中的词语评分高于出现在正文中的词语，因此当被搜索的词出现在\
  \ title 标签中时，该页面会在搜索结果列表中出现得更靠前。\n\n## 使用 META 标签\n\nMETA 标签允许搜索引擎在标准位置查找页面的详细信息。META\
  \ 标签必须位于 <head> 元素内。\n\n## 选择关键词与关键词密度\n\n建议在你的页面中添加 <meta name=\"keywords\" content=\"\
  Your Keywords\"> 标签，因为一些搜索引擎在构建索引时会使用此元素。content 元素包含一个逗号分隔的关键词列表。你应该使用与当前页面内容相关而非整个网站相关的关键词。Tropical\
  \ Green 网站的关键词 META 标签示例为：\n\n```\n<meta name=\"keywords\" content=\"Gardening information,\
  \ Gardening Columns, plants for sale Seattle, Plant reseller Seattle, Plant supplier\
  \ Seattle, Garden Designers Seattle, Online Plant Database, Garden design\">\n```\n\
  \n如果你选择过于通用的关键词，如 Plant、Gardening 或 Garden Design，它们的价值就会很低，因为不够具体。通过将 Tropical\
  \ Green 的位置（西雅图）添加到每个关键词中，在本地（例如西雅图）搜索与植物相关服务的人更有可能找到 Tropical Green 的网站。\n\n##\
  \ 描述\n\ndescription META 标签的内容应准确描述页面内容。例如，“A Walk in Jenny's Garden”栏目页面的描述可以是：\n\
  \n```\n<meta name=\"description\" content=\"We take a look at Jenny's Garden and\
  \ her unique approach to garden design by combining the use of tall trees with small\
  \ shrubs.\">\n```\n\nkeywords META 标签不应超过大约 1000 个字符，否则搜索引擎可能会忽略或截断它。为了获得最佳效果，应尽量保持\
  \ description META 标签简短（大约 250 个字符）。\n\n## 本章小结\n\n在本章中，我们研究了几种配置 MCMS 模板以充分利用搜索引擎的方法。为了让\
  \ MCMS 帖子和频道呈现脚本能够被搜索引擎索引和跟踪，应设置 IsRobotFollowable 和 IsRobotIndexable 属性，并且需要修改频道呈现脚本以输出这些属性。我们还探讨了如何为\
  \ MCMS 网站启用增量爬取，以及如何通过仅呈现相关内容并隐藏导航控件来减少搜索结果中的噪声。最后，我们介绍了一些搜索引擎优化技巧，包括为 META 标签添加详细信息，以及注意可能导致网站无法被正确索引的设计问题。\n"
- "## 使用 SharePoint 搜索 MCMS\n\n自从以内容为中心的网站出现以来，搜索内容的需求就一直存在。许多最成功的互联网企业都是搜索网站，如 Yahoo!\
  \ 和 Google。每隔几个月就会有一个新的搜索网站上线，其中许多会同时对多个站点进行聚合搜索。在另一个极端，许多网站所有者需要的搜索能力是只返回其特定站点的结果。\n\
  \nMicrosoft Content Management Server (MCMS) 虽然是一个非常强大的内容管理解决方案，但并未内置任何搜索功能。然而，拥有\
  \ MCMS 网站并不意味着你就没有办法使用搜索功能。\n\n## MCMS 搜索选项\n\n在 MCMS 网站上实现搜索的方式相当多，每种方式都有不同的成本、实现复杂度和限制。与往常一样，每种选择都有其优缺点。Google\
  \ (http://www.google.com) 提供一个 Web Service API，供你免费提交查询，但每天限制为 1,000 次搜索，并且有一些关于徽标放置的许可要求。Coveo\
  \ (http://www.coveo.com) 为其 Enterprise Search 产品提供免费且永不过期的许可证，但仅限搜索 5,000 个文档（超过\
  \ 5,000 个文档需要从 Coveo 购买许可证）。Mondosoft (http://www.mondosoft.com) 的 MondoSearch 与\
  \ MCMS 无缝集成，并提供强大的功能集，但并非免费。\n\nMicrosoft 的企业门户解决方案 SharePoint Portal Server 2003\
  \ (SPS) 包含一个强大且可定制的搜索引擎。SPS 创建的索引可以通过 Web Service 提交 Microsoft SQL 全文查询来进行搜索。如果你的组织已经实施或计划部署\
  \ SPS，那么你可以将它用作 MCMS 搜索引擎。但请注意，如果你的站点可公开访问，此解决方案可能不太有吸引力，因为需要 SharePoint External\
  \ Connector 许可证。因此，我们讨论的 SharePoint 搜索解决方案通常只适用于基于 Intranet 的 MCMS 站点。\n\n在本章中，我们将利用\
  \ SPS 的搜索功能为我们的 Tropical Green MCMS 站点提供强大的搜索能力。在此过程中，我们将配置 SharePoint 来索引 Tropical\
  \ Green 站点。我们还将尝试一些免费组件，你可以在 MCMS 站点中使用这些组件来针对 SharePoint 索引执行搜索查询。\n\n## Microsoft\
  \ SharePoint Portal Server 搜索\n\n要充分利用 SharePoint Portal Server 搜索功能，你需要了解它的工作原理以及如何配置它。在解释其工作原理之前，需要先了解几个关键组件：\n\
  \n- **内容源（content source）**：包含将被索引的信息。内容源可以是外部网站、文件共享、Windows SharePoint Services\
  \ 站点、Microsoft Exchange 公用文件夹，或其他为 SharePoint 搜索提供协议处理程序的系统（如 Lotus Notes）。\n- **索引文件（Index\
  \ files）**：包含从一个或多个内容源爬取的内容。聚合和编录来自不同内容源的内容可以使未来的搜索查询更加高效。索引文件也可以复制或传播到 SharePoint\
  \ Web 服务器上，以实现更高效的搜索。创建新门户时会默认创建两个索引：`Portal_Content` 和 `Non_Portal_Content`。正如所料，前者包含存储在门户中的所有内容，后者包含门户之外的内容。\n\
  - **搜索范围（Search scopes）**：用于对内容源进行逻辑分组，供最终用户搜索。例如，一家公司可能有多个内部文件共享和网站。员工查找特定文档时，并不关心它是在站点\
  \ A 还是文件共享 B 中，他们只知道它就在那里。管理员可以创建多个内容源，并将它们分组到用户可搜索的单个搜索范围中。此外，搜索范围可以配置为仅包含网站的特定部分，从而更细致地控制哪些内容被索引并可供用户搜索。\n\
  - SharePoint **收集器（gatherer）**：负责爬取所有内容源、提取内容、删除干扰词（如 'and'、'a'、'the'、'or' 等，干扰词文件可自定义，因此你可以添加自己的干扰词），并创建用于执行搜索查询的索引文件。\n\
  \n收集器是 MSSearch 服务的一部分，该服务执行内容爬取并创建索引文件。此服务按计划运行，你可以通过 SharePoint 管理中心工具配置该计划。MSSearch\
  \ 服务会根据指定的计划时间表激活收集器，从而生成搜索查询的主索引。\n\n最终用户使用搜索范围来选择要查询的内容源集合。SharePoint 会查看包含内容源的目录，并确定与搜索查询匹配的最佳候选项。\n\
  \n\n\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_137_0.png)\n\n现在，我们需要为我们的 SearchCrawler\
  \ 帐户授予对整个 Tropical Green 网站的订阅者权限。\n\n> 我们假定你已经安装了 MCMS Connector for SharePoint\
  \ Technologies，因为其安装程序会在 Site Manager 中创建一个 MCMS Search 订阅者组，用于搜索你的 MCMS 频道结构。有关安装\
  \ MCMS Connector 的帮助，请参阅附录 B。\n\n1. 通过指向“开始 | 所有程序 | Microsoft Content Management\
  \ Server | Site Manager”启动 Site Manager。\n2. 在 Site Manager 的左侧面板中选择“用户角色”按钮。\n\
  3. 选择“订阅者”用户角色。\n4. 然后右键单击“MCMS Search User Subscribers”角色并选择“属性”。\n5. 单击“组权限”选项卡，查看\
  \ MCMS Search User 角色拥有权限的所有频道、模板和资源。所有频道、模板和资源都应处于勾选状态。\n6. 单击“组成员”选项卡，并单击“修改”按钮。\n\
  7. 输入我们上面添加的 `MCMSBOOK\\SearchCrawler` 用户作为 SharePoint 爬网帐户，然后点击“确定”。\n8. 再次点击“确定”以关闭属性窗口。\n\
  \n现在，我们已经配置 SharePoint 使用专用帐户爬网我们的站点，并授予该帐户访问 Tropical Green 站点内所有内容的权限。\n\n## 为\
  \ Tropical Green 启用来宾访问\n\n由于我们的站点将向公众开放，我们需要确保它不会要求访问者登录。要将我们的 Tropical Green 站点配置为允许来宾查看，我们需要启用来宾访问。如果你想了解如何完成此操作的完整详细信息，在第一本书《*使用\
  \ Microsoft Content Management Server 构建网站*》（Packt Publishing，2005 年 1 月，ISBN 1-904811-16-7）中给出了完整说明。另请参阅第\
  \ 18 章中的“*欢迎来宾访问站点*”一节。\n\n> 如果你已经为站点配置了来宾访问，则可以跳过此步骤。\n\n为了允许来宾进入我们的站点，我们需要：\n\n\
  1. 在域中或作为服务器上的本地用户创建一个新的 MCMS 来宾帐户。\n2. 使用 SCA 配置 MCMS，以允许来宾进入，并使用步骤 1 中创建的帐户作为来宾登录帐户。\n\
  3. 现在 MCMS 已配置为允许来宾进入站点，请将步骤 1 中创建的帐户添加到订阅者权限组，并授予该权限组访问站点中当前存在的所有频道、资源库和模板库的权限，但位于\
  \ Gardens 频道中的 Members 频道除外。\n\n> 为了简单起见，我们选择启用站点的来宾访问。不过，SharePoint 也可以使用 Forms\
  \ 或 Windows 身份验证来索引我们的站点。对于 Forms 身份验证，我们需要创建一个特殊的首页，该页面使用预定义帐户自动将用户登录，以便访问站点并让\
  \ SharePoint 开始爬网。我们必须授予 SharePoint 爬网帐户相应的订阅者权限组权限。\n>\n> 如果你选择创建一个备用首页，让 SharePoint\
  \ 自动登录到你的站点，请记住，任何用户都可以使用这个页面来访问你的站点。如果使用这种方法，应特别小心，例如向此页面添加 IP 限制，以便只有 SharePoint\
  \ 服务器才能访问它。\n\n## 发布项的输出缓存和 Last-Modified 日期\n\n在生成 HTTP 状态代码方面，ASP.NET 并不特别复杂，它只是为每个请求返回\
  \ HTTP 状态代码 200（OK），而不是发送 Last-Modified HTTP 头。当 SharePoint Portal Server 执行增量索引爬网时，它会向发现的站点上的每个页面发送\
  \ HTTP GET 请求。如果某个页面之前已被索引并返回了 Last-Modified 头，SharePoint Portal Server 会发送一个条件\
  \ HTTP GET 请求，其中包含 If-Modified-Since HTTP 头，其日期为之前 Last-Modified HTTP 头中返回的日期。如果响应是\
  \ HTTP 状态代码 304（未修改），SharePoint 将不会重新索引该页面。但是，由于 ASP.NET 总是返回状态代码 200，该站点将永远不会被\
  \ SPS 增量爬网，实际上每次执行采集器时都会进行一次完整索引。由于 MCMS 模板文件实际上是一种特殊的 ASP.NET Web 窗体，因此这也会影响基于这些模板文件的发布项。有关如何解决此问题的说明，请参阅第\
  \ 4 章“准备发布项以进行搜索索引”。\n\n需要考虑的一点是频道渲染脚本，以及包含指向其他发布项的链接的动态列表的发布项。虽然这些脚本和发布项自上次索引以来可能未发生变化，但这些脚本生成的内容可能会在发布项的不同调用之间发生变化。如果这些内容是你希望搜索的内容，则应确保包含此类控件的发布项始终被索引，方法是不返回\
  \ Last-Modified HTTP 头。\n\n## 使用 SharePoint 搜索 MCMS\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_140_0.png)\n\
  \n5. 由于 Visual Studio .NET 设计器不允许我们将控件拖放到页面的 `<head></head>` 部分，我们需要将 SearchMetaTagGenerator\
  \ 控件的代码声明从页面主体移动到 head 部分。切换到 HTML 视图，找到我们刚刚添加的 SearchMetaTagGenerator 控件，并将其向上移动到\
  \ `<head>` 和 `</head>` 标记之间。\n6. 与任何更改一样，我们现在应该重新生成 Tropical Green 项目。\n7. 打开浏览器，在站点中导航到该站点植物目录部分中的一个植物发布项。花点时间查看你导航到的发布项的源代码。请注意所有已添加的额外\
  \ META 标签。下面是一个示例：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_140_1.png)\n\n> 请注意\
  \ META 标签顶部列出的 FIRSTSAVEDBY 属性。这是已添加到发布项中的自定义属性。它会添加到 META 标签中，是因为我们在 SearchMetaTagGenerator\
  \ 控件中选择了 CustomAndStandardProperties 属性类型。其他 META 标签是 SearchMetaTagGenerator 控件生成的标准属性。\n\
  \n渲染后，任何使用 Plant 模板实现的发布项都将在页面的 `<HEAD>` 部分为页面的每个自定义属性和标准属性包含 META 标签。\n\nPropertyType\
  \ 字段中可供我们使用的选项之一是 `PropertiesFromXMLFile`。此选项允许我们使用位于 `Microsoft Content Management\
  \ Server\\Server\\IIS_CMS\\WssIntegration\\SearchPropertyCollection.xml` 的 XML 文件来精确指定哪些属性将作为\
  \ META 标签导出。\n\n一旦你指定了要使用的属性，包括你添加的自定义属性，就需要告诉 SharePoint 在爬网时索引这些属性。MCMS Connector\
  \ 附带的控制台应用程序 `SearchPropertiesSetup.exe` 会将更新后的 XML 文件告知 SharePoint。请使用以下语法运行它：\n\
  \n```\nSearchPropertiesSetup.exe -file \"<path to file>\\SearchPropertyCollection.xml\"\
  \n```\n\n> SearchPropertiesSetup.exe 实用工具可在以下位置找到：\n> `<install drive>:\\Program\
  \ Files\\MCMS 2002 Connector for SharePoint Technologies\\WSS\\bin\\`。\n\n请按上述方式执行\
  \ SearchPropertiesSetup.exe 实用工具，因为我们的自定义搜索解决方案将使用它生成的其中一个 META 标签。\n\n> 如果更改 SearchPropertyCollection.xml\
  \ 文件，则需要重新执行 SearchPropertiesSetup.exe 实用工具。\n\nMCMS Connector for SharePoint Technologies\
  \ 包含一个帮助文件，其中介绍了如何修改此 XML 文件。请注意，微软支持知识库中有一篇文章专门说明该帮助文件说明中的错误。MSKB 文章“在 Content\
  \ Management Server 2002 Connector for SharePoint Technologies 中向模板添加 SearchMetaTagGenerator\
  \ 控件时出现问题”（#872932）包含更正后的说明。\n\n我们的 Tropical Green 站点现已配置为允许来宾访问；我们的模板已经过修改，以便对\
  \ SPS 搜索更友好；并且我们已在所有渲染发布项的 `<HEAD>` 部分中包含了额外的元数据。现在，让我们继续在 SharePoint 中创建内容源来索引我们的站点。\n\
  \n## 配置 SharePoint Portal Server 搜索\n\n我们的 MCMS 站点已准备好进行索引，现在转向 SPS。首先，我们将配置 SharePoint\
  \ 为我们的 Tropical Green 站点建立索引。创建索引后，我们将创建一个源组，该源组将\n\n\n\n一个常见错误，地址无法找到，通常是由链接到未配置使用频道渲染脚本的空频道引起的。由于我们预计访客在浏览网站时会收到此错误，因此\
  \ SharePoint 收集器遇到相同问题也就不足为奇了。这不是 SharePoint 索引的问题，而是我们网站结构的问题：可能为空的频道应具有频道渲染脚本或从导航中隐藏。\n\
  \n- 6. 如果没有问题，我们可以测试我们的索引。点击门户导航中的 Home 链接进入主页。在右上角，选择下拉菜单中的 TropicalGreen.net (SearchSetup.exe)（由于下拉菜单宽度设计限制，全名可能不会全部显示），在搜索框中输入\
  \ ficus，然后点击绿色箭头执行搜索。搜索结果应能找到植物目录中的帖子。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_145_0.png)\n\
  \n您的搜索结果可能与上图所示不符，因为您的帖子可能最近已被修改。\n\n我们现在已创建了一个 SharePoint 搜索范围并对我们的 Tropical Green\
  \ 网站进行索引。虽然此搜索范围可在门户内用于搜索我们的网站，但我们将通过 MCMS 网站上的 SPS Query Service Web Service 使用它，为用户提供搜索功能。\n\
  \n## 手动创建内容源\n\n另一种选择是手动在 SharePoint 中创建内容源，而不是允许 SearchSetup.exe 实用程序为我们创建。我们将逐步指导您完成这些步骤，以便您了解在\
  \ SharePoint 门户中创建内容源和源组所涉及的内容。\n\n尽管我们解释了如何使用 SearchSetup.exe 实用程序和手动使用相同的内容源名称创建内容源，但您必须只选择一种方法，因为无法创建两个具有相同名称的内容源。\n\
  \n让我们开始在我们的 SharePoint 门户中创建我们 Tropical Green 网站的索引：\n\n请参阅附录 A，了解创建门户步骤的演练。\n\n\
  - 1. 通过指向 开始 | 所有程序 | SharePoint Portal Server | SharePoint 中央管理 来启动 SharePoint\
  \ 中央管理。\n- 2. 点击 门户站点和虚拟服务器配置 部分下的 列出并管理门户站点。\n- 3. 管理门户站点 页面包含 SharePoint 农场中所有门户的列表。将鼠标光标拖到列表的右侧，并在鼠标光标悬停在门户上方时出现的下拉箭头上点击，然后选择\
  \ 管理门户站点属性（如下图所示）：\n- 4. 在 搜索设置和索引内容 部分下，点击 配置搜索和索引 链接。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_146_0.png)\n\
  \n以下说明假定您尚未启用 SharePoint 的高级搜索管理模式。基本模式和高级模式的主要区别在于高级模式允许您直接使用内容索引。基本模式在创建内容源时创建内容索引。在我们的示例中，基本模式足以满足我们的需求。\n\
  \n现在我们将创建内容源。\n\n- 1. 在 通用内容设置和索引状态 部分下，点击 添加内容源 链接。\n- 2. 在 添加内容源 页面上，选择 Web 页面或网站\
  \ 并点击下一步。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_148_0.png)\n\n- 4. 一旦您在上一步中点击完成，SharePoint\
  \ 将创建内容源并向您展示确认页面。在 创建的 Web 页面或网站内容源 底部，在 开始更新 部分，勾选 开始完整更新 选项并点击确定。这将触发收集器开始构建\
  \ Tropical Green 网站的索引。\n\n手动创建内容源后，请按照 创建新的搜索范围 部分下的说明，使用以下表格中的设置创建新的源组：\n\n| 字段\
  \ | 值 |\n| --- | --- |\n| 名称： | TropicalGreen.net |\n| 主题和区域： | 在此范围内不包含任何主题或区域\
  \ |\n| 内容源组： | 将范围限制为以下内容源组：<br>Tropical Green 网站 |\n\n## MCMS 应用池帐户的搜索权限\n\nSharePoint\
  \ 门户通常不允许匿名用户访问站点，用户必须登录。随 MCMS Connector 提供的 SearchResultControl，我们稍后会使用它，使用触发搜索查询的\
  \ MCMS 站点所在的应用池标识帐户的帐户来访问 SharePoint 搜索服务。\n\n- 1. 通过打开 Internet Explorer 并导航到 http://portal.tropicalgreen.net\
  \ 浏览我们之前创建的门户。然后，点击右上角的 站点设置。\n- 2. 在 通用设置 部分下，选择 管理安全性和其他设置。\n- 3. 在 管理站点组 页面上，点击\
  \ 添加站点组。当提示输入新组的信息时，输入以下值：\n\n| 属性 | 值 |\n|---|---|\n| 站点组名称 | 仅搜索 |\n| 描述 | 此站点组授予用户查询搜索索引的权利\
  \ |\n| 权限 | 搜索 – 搜索门户站点及所有相关内容 |\n\n> 当您选择 搜索 – 搜索门户站点及所有相关内容 时，SharePoint 会自动勾选\
  \ 查看页面 – 在区域中查看页面 选项。在勾选搜索选项后取消勾选查看页面选项。\n\n- 4. 在 管理站点组 页面上，点击 Search Only，即我们新组的名称。\n\
  - 5. 在 “Search Only” 的成员 页面上，点击 添加成员。添加配置为您的 MCMS 站点运行的应用池标识的帐户。选择帐户后，点击确定。\n\n\
  > 要找到您的 MCMS 站点运行的应用池的标识，请打开 Internet Information Services。展开 本地计算机 | 应用池 节点。查找您的\
  \ MCMS 站点配置为使用的应用池并查看其属性。标识列在 标识 选项卡下。\n\n- 6. 选择帐户后，在 添加用户 页面上，确保在 步骤 2：选择站点组 部分下已勾选\
  \ Search Only，然后点击确定。\n- 7. 在最后一页，SharePoint 会要求您确认要添加的帐户的详细信息，确保未勾选 发送以下电子邮件以通知这些用户他们已被添加\
  \ 选项，然后点击完成。\n\n我们的 MCMS 站点现在具有登录我们的门户并执行搜索所需的权限。\n\n## 向 MCMS 站点添加搜索页面\n\n我们有两种可用的选项来实现我们\
  \ Tropical Green 站点的搜索功能：\n\n- 利用 MCMS Connector for SharePoint Technologies 中包含的\
  \ ASP.NET 服务器控件，允许执行搜索查询。\n- 创建我们自己的解决方案。\n\nMCMS Connector 包含以下三个控件，可帮助您通过利用 SharePoint\
  \ 搜索范围为 MCMS 站点实现搜索功能：\n\n- **SearchInputControl：** 用于创建要提交的搜索的搜索表单输入。\n- **SearchResultControl：**\
  \ 接收 SearchInputControl 中输入的搜索条件，对 SPS 搜索 Web 服务执行搜索，并以列表形式显示结果。\n- **SearchMetaTagGenerator：**\
  \ 根据 PropertyType 设置创建 HTML META 标签。生成的 META 标签可包括标准页面属性以及自定义属性。\n\n您可以在同一页面或不同页面上使用这三个控件。这非常方便，因为您可能希望在站点所有页面上包含一个小的搜索关键词输入框，将搜索提交到单独的结果页面，但您也可能希望在搜索结果页面上提供搜索输入。\n\
  \n一旦我们使用 MCMS Connector 控件创建了可工作的搜索页面，我们将创建一个不包含 MCMS Connector 提供的任何内容的自定义解决方案。我们的解决方案将包括针对我们站点的高级搜索和自定义搜索结果列表。\n\
  \n两种选项各有明显的优缺点。您在 MCMS 站点上实现哪一种将完全取决于您的需求、定制需求和可用的开发时间。以下表格概述了使用 MCMS Connector\
  \ 控件以及自行构建解决方案的一些更突出的优点和缺点：\n\n## 利用 MCMS Connector 控件实现搜索：\n\n| 优点 | 缺点 |\n|---|---|\n\
  | 快速安装并集成到页面和模板中 | 无法自定义搜索输入控件 |\n| 开箱即用，最小配置即可工作 | 无法自定义搜索结果列表 |\n\n## 使用自定义解决方案实现搜索：\n\
  \n| 优点 | 缺点 |\n|---|---|\n| 完全控制搜索输入表单的布局 | 需要额外的开发时间和测试 |\n| 完全控制搜索结果列表 | |\n|\
  \ 根据特定站点需求创建特殊高级搜索 | |\n\n## 使用 MCMS SharePoint Connector 进行搜索\n\n我们首先要做的就是在我们的\
  \ Tropical Green 项目中创建一个新的搜索页面。此页面不会是新的 MCMS 模板，而是一个普通的 ASP.NET 页面。您可以将其设为模板，但这样做没有实际优势，因为我们的网站上只有一个搜索页面且没有额外内容。\n\
  \n- 1. 在 Visual Studio .NET 中，右键点击 Tropical Green 项目并选择 添加 Web 表单。\n- 2. 将新的 ASPX\
  \ 页面命名为 Search.aspx 并点击打开。\n- 3. 如果页面未在设计模式下加载，请点击左下角的设计。\n\n\n\n\n\n+   4. 将页面布局更改为\
  \ **FlowLayout**。\n+   5. 从解决方案资源管理器将 /Styles/styles.css、/UserControls/TopMenu.ascx\
  \ 和 /UserControls/RightMenu.ascx 文件拖放到设计器上。\n+   6. 切换到 HTML 模式并按如下方式修改 body 标签：\n\
  +   `<body topmargin=\"0\" leftmargin=\"0\" rightmargin=\"0\">`\n+   7. 在 `<form>`\
  \ 和 `</form>` 标签之间添加以下代码，替换刚刚添加的两个用户控件：\n+   ```\n+   <form id=\"Form1\" method=\"\
  post\" runat=\"server\">\n+   <table width=\"100%\" border=\"0\" cellspacing=\"\
  0\" cellpadding=\"0\">\n+   <tr>\n+   <td width=\"100%\" colspan=\"2\" valign=\"\
  top\" bgcolor=\"#ffc00\">\n+   <img src=\"/tropicalgreen/images/Logo.gif\">\n+ \
  \  </td>\n+   <td vAlign=\"top\" rowSpan=\"10\">&nbsp;</td>\n+   </tr>\n+   <tr\
  \ bgColor=\"#66cc33\">\n+   <td colspan=\"2\"><uc1:TopMenu id=\"TopMenu1\" runat=\"\
  server\"></uc1:TopMenu></td>\n+   </tr>\n+   <tr>\n+   <td vAlign=\"top\" style=\"\
  PADDING-RIGHT:30px; PADDING-LEFT:30px; PADDING-BOTTOM:30px;\">\n+   <p>&nbsp;</p>\n\
  +   <table cellspacing=\"0\" cellpadding=\"10\" border=\"1\" bordercolor=\"#669900\"\
  >\n+   <tr vAlign=\"top\">\n+   <td>Tropical Green Search:</td>\n+   </tr>\n+  \
  \ <tr>\n+   <td vAlign=\"top\">\n+   </td>\n+   </tr>\n+   </table>\n+   </td>\n\
  +   <td class=\"RightMenuBar\" width=\"20%\" valign=\"top\" height=\"100%\" align=\"\
  center\" rowspan=\"2\" bgcolor=\"#669900\">\n+   <uc1:RightMenu id=\"RightMenu1\"\
  \ runat=\"server\"></uc1:RightMenu>\n+   </td>\n+   </tr>\n+   </table>\n+   </form>\n\
  +   ```\n\n## 为什么我们要将用户控件拖到页面上然后再替换生成的 HTML？\n\n将用户控件拖到页面上会为我们自动添加 ASPX 中的 `<%@\
  \ Register %>` 行，以及 HTML 中的用户控件 ASP.NET 标签。然后我们只需要修改 HTML 使其更美观即可。\n\n## 使用 SharePoint\
  \ 搜索 MCMS\n\n现在你在设计模式下查看的页面应该如下所示：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_152_0.png)\n\
  \n让我们保存新的搜索页面，构建 Tropical Green 项目，并在浏览器中导航到它，以确保一切正常，然后再添加搜索输入和结果控件。\n\n+   1.\
  \ 保存 search.aspx 页面的所有更改。\n+   2. 右键单击 TropicalGreen 项目并选择 Build。\n+   3. 如果构建没有错误，打开浏览器并导航到：http://www.tropicalgreen.net/TropicalGreen/Search.aspx。\n\
  +   4. 如果有任何问题，重新检查我们到目前为止采取的步骤，解决错误，然后重试该 URL。\n\n现在我们已经有一个可用的搜索页面，我们需要为其添加一些功能。我们将添加两个\
  \ MCMS Connector 服务器控件，进行一些配置更改，构建解决方案并测试我们的搜索页面。\n\n+   1. 如果尚未打开，请在 Visual Studio\
  \ .NET 中打开 search.aspx 页面，并切换到设计视图。\n+   2. 打开 Visual Studio .NET 工具箱并将 SearchInputControl\
  \ 和 SearchResultsControl 拖入 Tropical Green Search 单元格下方的表格单元格中。参考以下图片了解放置位置：\n\n\
  ![](img/442e26bf28f2df81fbf8dff3478f88e3_153_0.png)\n\n3. 选择我们添加到 search.aspx 的\
  \ SearchInputControl 并在 Visual Studio .NET 属性窗口中设置以下属性：\n\n| 属性 | 值 |\n|---|---|\n\
  | SearchMode | Simple |\n| SearchResultPage | /TropicalGreen/Search.aspx |\n\n4.\
  \ 选择我们添加到 search.aspx 页面的 SearchResultControl 并使用 Visual Studio .NET 属性窗口设置以下属性：\n\
  \n| 属性 | 值 |\n|---|---|\n| PortalUrl | http://portal.tropicalgreen.net/ |\n| SearchResultPageSize\
  \ | 10 |\n\n> 我们使用的是附录 A 中创建的门户的 URL。请用你在本章前面步骤中为内容源和搜索组配置的门户 URL 替换此 URL。\n\n##\
  \ 使用 SharePoint 搜索 MCMS\n\n让我们看看我们的搜索是否正常工作。保存 search.aspx 的所有更改，构建 Tropical Green\
  \ 项目，并在浏览器中访问 http://www.tropicalgreen.net/TropicalGreen/Search.aspx。你应该会看到如下类似的页面：\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_154_0.png)\n\n输入一个你知道会在网站上找到的词，例如 ficus。你会看到与在包含内容索引的门户中搜索同一字符串时返回的搜索结果列表相同。\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_154_1.png)\n\n如果收到错误消息“加载输入控件时出现问题。系统返回的错误是：找不到路径的一部分\
  \ c:\\inetpub\\wwwroot\\tropicalgreen\\cms\\wssintegration\\searchpropertycollection.xml”，请仔细检查你是否在\
  \ TropicalGreen Web 应用程序中添加了 CMS 虚拟目录。\n\n此时，我们的网站已通过 MCMS Connector 控件和 SPS 的搜索功能获得了搜索能力。但此解决方案非常有限，例如无法更改这些控件的外观和感觉，也无法配置结果页面中显示的属性，例如为返回的文档显示简短描述。\n\
  \n为了解决这个问题，我们现在将构建自己的搜索控件。\n\n## 构建自定义搜索实现\n\n如前所述，MCMS Connector 搜索控件有优点也有缺点。最明显的是\
  \ SearchResultControl 不允许我们配置 SPS 搜索返回的结果。我们现在将构建自己的搜索实现，该实现将利用 SPS 搜索 Web 服务，为用户提供高级和专门的搜索功能，并以可自定义的方式呈现结果。\n\
  \n### 关于 SharePoint Portal Server 查询服务\n\n我们即将构建的一切都依赖于 SPS 中包含的查询服务 Web 服务，该服务向远程客户端（如我们的网站）公开搜索功能。此\
  \ Web 服务接受 Microsoft.Search.Query XML 格式的请求，并以 Microsoft.Search.Response XML 格式返回响应。为了构建健壮的解决方案，我们提交的请求将使用\
  \ Microsoft SQL 语法进行全文搜索。查询服务提供的一种方法是 QueryEx，我们将使用它，因为它以 DataSet 的形式返回结果。\n\n>\
  \ 有关 Microsoft SharePoint Portal Server 查询服务 Web 服务的更多信息和文档，请参阅 MSDN 文档：\n> http://msdn.microsoft.com/library/default.asp?url=/library/en-us/spptsdk/html/cPSQueryService_SV01004360.asp。\n\
  \n### 构建搜索输入控件\n\n我们首先要做的是构建一个搜索输入控件，该控件将向页面提交搜索查询以进行处理。此实现将使我们能够快速地将小型搜索组件添加到所有模板中。在提交搜索查询后，我们的用户控件将把查询参数添加到查询字符串并将请求重定向到结果页面。\n\
  \n让我们先开始创建一个新的用户控件。\n\n+   1. 在 Visual Studio .NET 中，右键单击 Tropical Green 项目中的 User\
  \ Controls 文件夹，并选择 Add | Add Web User Control。\n+   2. 将新控件命名为 SearchInput.ascx。\n\
  +   3. 在设计视图中，从工具箱拖放控件到 Web 表单上并按如下所示排列：\n\n| 控件 | 属性 |\n|---|---|\n| TextBox |\
  \ ID = txtSearchInput |\n| Button | ID = btnExecuteSearch<br>Text = Go |\n| LinkButton\
  \ | ID = lnkAdvancedSearch<br>Text = advanced search options |\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_156_0.png)\n\
  \n4. 我们创建的 LinkButton 将把用户带到搜索结果页面，我们稍后将为其添加一些高级搜索功能。双击我们的 LinkButton。Visual Studio\
  \ .NET 将为 Click() 事件创建一个空事件处理程序。向此空事件处理程序添加一行代码以将用户重定向到搜索结果页面：\n\n```\nprivate void\
  \ lnkAdvancedSearch_Click(object sender, System.EventArgs e)\n{\n    Response.Redirect(Request.ApplicationPath\
  \ + \"/SearchResults.aspx\");\n}\n```\n\n5. 接下来，我们需要为用户单击 Go 按钮时创建一个事件处理程序。我们将获取\
  \ TextBox 中输入的关键字并将搜索请求发送到搜索结果页面。双击 Go 按钮并将以下代码添加到事件处理程序中：\n\n```\nprivate void\
  \ btnExecuteSearch_Click(object sender, System.EventArgs e)\n{\n    string keywords\
  \ = this.txtSearchInput.Text;\n    keywords = HttpUtility.UrlEncode(keywords);\n\
  \    Response.Redirect(Request.ApplicationPath\n        + \"/SearchResults.aspx?keywords=\"\
  \n        + keywords);\n}\n```\n\n让我们看看我们新的搜索输入控件是否一切正常。保存更改并构建项目。如果收到任何错误消息，请重新检查步骤并确保没有拼写错误。\n\
  \n在使用此控件之前，我们需要将其添加到现有模板中。虽然我们理想情况下希望在网站的所有页面上提供搜索功能（通常通过将其添加到全局页眉控件），但我们现在只将其添加到主页。\n\
  \n+   1. 打开 \\Templates\\HomePage.aspx 模板并将我们新的 SearchInput.ascx 拖到顶部单元格中，位于 logo\
  \ 的右侧。\n+   2. 切换到 HTML 视图并找到我们刚刚添加的控件。它很可能具有 uc1:SearchInput 的开始标签。用 HTML DIV 包裹此控件并将其对齐方式设置为右对齐，如以下代码所示：\n\
  \n```\n<td width=\"100%\" colspan=\"2\" valign=\"top\" bgcolor=\"#ffcc00\">\n  \
  \  <img src=\"/tropicalgreen/images/Logo.gif\">&nbsp;\n    <div align=\"right\"\
  >\n        <uc1:SearchInput id=\"SearchInput1\" runat=\"server\"></uc1:SearchInput>\n\
  \    </div>\n</td>\n```\n\n\n\n+   1. 右键单击项目并选择 Add | Add Web Form。\n+   2. 将新页面的名称设为\
  \ SearchResults.aspx。\n+   3. 在 Design 视图中，从 Solution Explorer 将 Styles.css 文件拖放到表单上以将样式表应用到页面。\n\
  +   4. 将页面布局更改为 FlowLayout。\n+   5. 将以下用户控件拖到设计器中：\n+      - \\UserControls\\TopMenu.ascx\n\
  +      - \\UserControls\\RightMenu.ascx\n+   6. 切换到 HTML 视图并按如下方式修改 body 标签：\n+\
  \      <body topmargin=\"0\" leftmargin=\"0\">\n+   7. 在 <form> 标签之间向页面添加以下 HTML\
  \ 代码，替换我们刚刚添加的两个控件：\n\n```\n<form id=\"Form1\" method=\"post\" runat=\"server\"\
  >\n<table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n<tr>\n\
  <td width=\"100%\" colspan=\"2\" valign=\"top\" bgcolor=\"#ffcc00\">\n<img src=\"\
  /tropicalgreen/images/Logo.gif\">\n</td>\n<td valign=\"top\" rowspan=\"10\">\n</td>\n\
  </tr>\n<tr bgcolor=\"#66cc33\">\n<td colspan=\"2\">\n<uc1:TopMenu id=\"TopMenu1\"\
  \ runat=\"server\">\n</uc1:TopMenu>\n</td>\n</tr>\n<tr>\n<td valign=\"top\" style=\"\
  PADDING-RIGHT:30px; PADDING-LEFT:30px; PADDING-BOTTOM:30px; PADDING-TOP:10px\">\n\
  <p>&nbsp;</p>\n<table cellspacing=\"0\" cellpadding=\"10\" border=\"1\" bordercolor=\"\
  #669900\">\n<tr valign=\"top\">\n<td>\n<b>Tropical Green Search:</b>\n</td>\n</tr>\n\
  <tr>\n<td valign=\"top\">\n<b>Advanced Search</b>\n<p>\n<b>Search Results</b>\n\
  </td>\n</tr>\n</table>\n</td>\n<td class=\"RightMenuBar\" width=\"20%\" valign=\"\
  top\" height=\"100%\" align=\"center\" rowspan=\"2\" bgcolor=\"#669900\">\n<uc1:RightMenu\
  \ id=\"RightMenu1\" runat=\"server\">\n</uc1:RightMenu>\n</td>\n</tr>\n</table>\n\
  </form>\n```\n\n我们现在有了高级搜索和搜索结果页面的基本布局，其外观与我们网站中的其他模板类似。让我们为高级搜索添加一些控件。\n\n+   1.\
  \ 在 Design 视图中，从 Toolbox 拖动一个 TextBox 并将其放置在 Advanced Search 文本下方。\n+   2. 在 Design\
  \ 视图中，从 Toolbox 拖动一个 Button 并将其放置在 TextBox 的右侧。\n+   3. 我们需要添加的下一件事是包含搜索结果的 DataGrid。在\
  \ Design 视图中，从 Toolbox 拖动一个 DataGrid 控件到 Add Search Results Here 文本正下方。我们稍后再担心格式化此控件，现在我们只需要一些东西来显示我们的数据。\n\
  +   4. 根据以下表格设置我们刚刚添加的控件的属性：\n\n| Property | Value |\n|---|---|\n| TextBox | ID\
  \ = txtAdvancedSearch |\n| Button | ID = btnAdvancedSearch<br>Text = Go |\n| DataGrid\
  \ | ID = dgrSearchResults |\n\n我们的高级搜索页面现在应该如下所示：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_159_0.png)\n\
  \n现在是开始编写搜索逻辑的时候了。首先，我们需要为高级搜索按钮添加一个事件处理程序。\n\n+   1. 在 Design 视图中，双击 btnAdvancedSearch\
  \ 按钮以创建单击事件处理程序。Visual Studio .NET 将在代码隐藏文件中添加一个事件处理程序方法。\n+   2. 将以下代码添加到 btnAdvancedSearch_Click()\
  \ 事件处理程序中：\n\n```\nprivate void btnAdvancedSearch_Click(object sender, System.EventArgs\
  \ e)\n{\n    string keywords = this.txtAdvancedSearch.Text;\n    keywords = HttpUtility.UrlEncode(keywords);\n\
  \    Response.Redirect(Request.ApplicationPath\n        + \"/SearchResults.aspx?keywords=\"\
  \n        + keywords);\n}\n```\n\n接下来，我们需要在 Page_Load() 事件处理程序中检查 querystring，以查看是否从\
  \ SearchInput.ascx 控件或 txtAdvancedSearch TextBox 传递了任何关键字。\n\n添加以下代码以检查是否提供了任何关键字并在提供时执行搜索：\n\
  \n```\nprivate void Page_Load(object sender, System.EventArgs e)\n{\n    if (Request.QueryString[\"\
  keywords\"] != null\n        && Request.QueryString[\"keywords\"] != String.Empty)\n\
  \    {\n        string keywords = Request.QueryString[\"keywords\"];\n        DataSet\
  \ ds = ExecuteSearch(keywords);\n        this.dgrSearchResults.Visible = true;\n\
  \        this.dgrSearchResults.DataSource = ds;\n        this.dgrSearchResults.DataBind();\n\
  \n        // autofill the keyword input box with the search keywords\n        this.txtAdvancedSearch.Text\
  \ = keywords;\n    }\n    else\n    {\n        this.dgrSearchResults.Visible = false;\n\
  \    }\n}\n```\n\n现在我们需要创建将对 SPS 内容索引执行搜索的方法。此方法将：\n\n+   - 创建我们刚刚添加到项目的 Query Service\
  \ Web Service 的实例。\n+   - 调用将构建要提交给 Query Service 的 MSQuery 的方法。\n+   - 执行搜索。\n\
  +   - 将搜索结果绑定到 DataGrid。\n\n在 SearchResults.aspx.cs 文件中导入以下命名空间：\n\n```\nusing System.Security.Principal;\n\
  using System.Runtime.InteropServices;\nusing System.Net;\nusing System.Text;\nusing\
  \ System.Text.RegularExpressions;\nusing Microsoft.ContentManagement.Publishing;\n\
  ```\n\n将以下方法添加到 SearchResults.aspx.cs 文件中 Page_Load() 事件处理程序之后。此方法将确保当前线程在任何可能之前调用的模拟下仍在原始安全上下文下运行：\n\
  \n```\n```csharp\n// Get reference to the RevertToSelf method\n[DllImport(\"ADVAPI32.DLL\"\
  )]\npublic static extern int RevertToSelf();\n\n/// <summary>\n/// Builds the appropriate\
  \ MSQuery,\n/// submits the query to the SPS Query Service,\n/// and returns the\
  \ results as a DataGrid.\n/// </summary>\n/// <param name=\"keywords\">String of\
  \ keywords to search for.</param>\n/// <returns>DataSet of search results.</returns>\n\
  private DataSet ExecuteSearch(string keywords)\n{\n    // decode the list of keywords\n\
  \    keywords = HttpUtility.UrlDecode(keywords);\n\n    // create reference to the\
  \ Query Service Web service\n    net.tropicalgreen.portal.QueryService spsQueryService\
  \ =\n        new net.tropicalgreen.portal.QueryService();\n\n    // use the current\
  \ application pool identity to login\n    // to the SharePoint Query Service Web\
  \ service\n    WindowsIdentity CurrentUser = WindowsIdentity.GetCurrent();\n\n \
  \   try\n    {\n        // use the Application Pool account to do access the\n \
  \       // SharePoint Search Services\n        RevertToSelf();\n        spsQueryService.Credentials\
  \ = CredentialCache.DefaultCredentials;\n    }\n    catch(System.Exception exception)\n\
  \    {\n        throw new System.Exception(exception.Message);\n    }\n    finally\n\
  \    {\n        // ensure that the original user is being impersonated again\n \
  \       CurrentUser.Impersonate();\n        CurrentUser = null;\n    }\n\n    //\
  \ build MSQuery XML string to send to the Query Service\n    // - change the content\
  \ source to \"CMSChannels\" if you used SearchSetup.exe\n    string msQuery = BuildMSQuery(keywords,\
  \ \"Tropical Green website\");\n\n    // execute the query and return the dataset\n\
  \    return spsQueryService.QueryEx(msQuery);\n}\n```\n```\n\n> 如果您使用 SearchSetup.exe\
  \ 程序创建了内容源，则应将代码中“ Tropical Green website”改为内容源组“CMSChannels”。\n\n我们的 ExecuteSearch()\
  \ 方法调用另一个名为 BuildMSQuery() 的方法，该方法构造要发送到 QueryEx() Web 方法的 MSQuery。MSQuery 由 XML\
  \ 标签组成，这些标签为 Query Service 提供指令，例如请求中返回的结果数\n\n和一个 Microsoft SQL 全文 (MSSQLFT) 查询。构建\
  \ MSSQLFT 查询和 MSQuery 可能是实现 SharePoint 搜索中最复杂的部分。我们将其分为两个任务：构建实际的 MSSQLFT 查询和构建\
  \ MSQuery XML 字符串。我们将首先构建 MSQuery 将在构造发送到 Query Service 的 XML 字符串时使用的全文查询。\n\n##\
  \ 构建 Microsoft SQL 全文查询\n\nSPS 的搜索过程使用全文索引和查询来快速查找关键字，以便及时响应最终用户。全文查询与 Microsoft\
  \ SQL Server 中的常规 T-SQL 查询非常相似，但您可以使用额外的函数或谓词来增强查询的功能。其中一个在搜索 SharePoint 索引时有用的谓词是\
  \ FREETEXT。FREETEXT 接受由空格分隔的单词列表，确定哪些单词和短语是重要的，并使用该信息构建内部查询以高效地搜索目标数据。\n\n首先，您需要了解查询中可用的各种字段或属性。SharePoint\
  \ 在门户的 Site Settings 管理页面中提供了此信息列表。\n\n+   1. 打开 Internet Explorer 的新实例并导航到我们的门户：http://portal.tropicalgreen.net。\n\
  +   2. 单击右上角的 Site Settings 链接。\n+   3. 在 Search Settings and Indexed Content 部分下，单击\
  \ Manage properties from crawled documents 链接。\n\n对于每个被抓取的文档，Manage Properties of\
  \ Crawled Content 页面列出了 SharePoint 可能包含索引数据的所有属性。对于我们的目的，我们只会查看以下两个字段，因为它们包含我们搜索结果页面的信息：\n\
  \n+   - DAV:href\n+   - DAV:getlastmodified\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_162_0.png)\n\
  \n\n\n\n请注意，urn:schemas.microsoft.com:htmlinfo:metainfo 组下列出的一些字段，与我们使用 MCMS Connector\
  \ 中的 SearchMetaTagGenerator 用户控件添加到模板 META 标签中的字段相同。\n\n我们还需要其他一些信息：我们创建的搜索范围名称、内容索引名称以及关键字。一旦获得了所有这些信息，为了可读性，最合理的做法是将\
  \ MSSQLFT 查询构建在独立的方法中。我们将这个方法命名为 BuildMssqlftQuery()，并向它传递包含搜索关键字和要查询的搜索范围的字符串。请在\
  \ SearchResults.aspx.cs 页面末尾添加以下方法：\n\n```csharp\n/// <summary>\n/// Builds the\
  \ Microsoft SQL FullText query based on the parms.\n/// </summary>\n/// <param name=\"\
  keywords\">Keywords submitted for search.</param>\n/// <param name=\"searchScope\"\
  >SPS Search scope to filter.</param>\n/// <returns>String of the MSSQLFT query.</returns>\n\
  private string BuildMssqlftQuery(string keywords, string searchScope)\n{\n    StringBuilder\
  \ mssqlftQuery = new StringBuilder();\n    ArrayList whereClause = new ArrayList();\n\
  \n    #region FILTER: keywords\n    // list of keywords to include\n    if (keywords\
  \ != null && keywords.Length >0)\n    {\n        // add the keyword filter, use\
  \ a calculated weighted field\n        // just as SPS does\n        whereClause.Add(string.Format(\"\
  {0} {{1}}\",\n            \"WITH (\\\"DAV:contentclass\\\":0,\"\n            + \"\
  \\\"urn:schemas.microsoft.com:fulltextqueryinfo:description\\\":0,\"\n         \
  \   + \"\\\"urn:schemas.microsoft.com:fulltextqueryinfo:sourcegroup\\\":0,\"\n \
  \           + \"\\\"urn:schemas-microsoft-com:office:office#Keywords\\\":1.0,\"\n\
  \            + \"\\\"urn:schemas-microsoft-com:office:office#Title\\\":0.9,\"\n\
  \            + \"\\\"DAV:displayname\\\":0.9,\"\n            + \"\\\"urn:schemas-microsoft-com:publishing:Category\\\
  \":0.8,\"\n            + \"\\\"urn:schemas-microsoft-com:office#Subject\\\":0.8,\"\
  \n            + \"\\\"urn:schemas-microsoft-com:office:office#Author\\\":0.7,\"\n\
  \            + \"\\\"urn:schemas-microsoft-com:office:office#Description\\\":0.5,\"\
  \n            + \"\\\"urn:schemas-microsoft-com:sharepoint:portal:profile:PreferredName\\\
  \":0.2,contents:0.1,*:0.05) \"\n            + \"AS #WeightedProps, \"\n        \
  \    + \"FREETEXT(#WeightedProps, \\\"\" + keywords.ToString().Trim() + \"\\\")\"\
  \n        );\n    }\n    #endregion\n\n    #region FILTER: sps source group\n  \
  \  // filter source group\n    whereClause.Add(string.Format(\"{0}\",\n        \"\
  (\\\"urn:schemas.microsoft.com:fulltextqueryinfo:Sourcegroup\\\" = \\\"\"\n    \
  \    + searchScope + \"\\\"))\"));\n    #endregion\n\n    //build search query\n\
  \    mssqlftQuery.Append(\"SELECT \");\n    mssqlftQuery.Append(\"\\\"DAV:href\\\
  \", \");\n    mssqlftQuery.Append(\"\\\"DAV:getlastmodified\\\"\");\n    mssqlftQuery.Append(\"\
  \ FROM Non_Portal_Content..SCOPE()\");\n    mssqlftQuery.Append(\" WHERE \");\n\
  \    int i=0;\n    foreach (string s in whereClause)\n    {\n        if (i > 0)\n\
  \            mssqlftQuery.Append(\" AND \");\n        mssqlftQuery.Append(s);\n\
  \        i++;\n    }\n    return mssqlftQuery.ToString();\n}\n```\n\n注意，我们添加了一个计算字段，用于为某些字段应用一定权重。SharePoint\
  \ 实际上就是这样执行其自身搜索的。您可以配置属性权重，以在查询中更加强调特定属性。例如，您可能希望赋予页面标题或存储在 HTML META 标签中的关键字比页面内容更高的权重。\n\
  \n现在我们已经有了这个方法，接下来继续创建 MSQuery 字符串。我们将在构造 MSQuery 字符串时使用这个方法。\n\n## 构建 MSQuery XML\
  \ 字符串\n\n我们知道，SPS 查询服务 Web 服务只接受一个参数：MSQuery 字符串。该字符串实际上是一个 XML 文档，但作为字符串传递给查询服务。这个字符串中的\
  \ XML 标签告诉查询服务它支持的响应类型、结果中返回的记录数以及开始搜索结果的起始结果索引。`<StartAt></StartAt>` 元素可用于对结果集进行分页。由于我们的站点较小，我们不会在其中加入分页功能，但您可以看到实现分页是多么容易。\n\
  \n让我们开始创建 BuildMSQuery() 方法，该方法返回一个完整的 MSQuery XML 字符串，其中包含针对 SharePoint 索引执行查询所需的全部信息。请在\
  \ SearchResults.aspx.cs 页面末尾添加以下方法：\n\n```csharp\n/// <summary>\n/// Builds an MSQuery\
  \ with an embedded MSSQLFT query embedded\n/// for submission to SharePoint Query\
  \ Service.\n/// </summary>\n/// <param name=\"keywords\">Keywords submitted for\
  \ search.</param>\n/// <param name=\"searchScope\">SPS Search scope to filter.</param>\n\
  /// <returns>MSQuery</returns>\npublic string BuildMSQuery(string keywords, string\
  \ searchScope)\n{\n    StringBuilder msQuery = new StringBuilder();\n\n    // create\
  \ the main header of the XML string\n    msQuery.Append(\"<?xml version=\\\"1.0\\\
  \" encoding=\\\"utf-8\\\" ?>\"\n        + \"<QueryPacket xmlns=\\\"urn:Microsoft.Search.Query\\\
  \" \"\n        + \"Revision=\\\"1000\\\">\"\n        + \"<Query domain=\\\"QDomain\\\
  \">\"\n        + \"<SupportedFormats>\"\n        + \"<Format>urn:Microsoft.Search.Response.Document.Document</Format>\"\
  \n        + \"</SupportedFormats>\");\n\n    // create the actual full-text query\n\
  \    msQuery.Append(\"<Context>\"\n        + \"<QueryText language=\\\"en-US\\\"\
  \ type=\\\"MSSQLFT\\\">\"\n        + \"<![CDATA[\" + this.BuildMssqlftQuery(keywords,\
  \ searchScope)\n        + \"]]</QueryText></Context>\");\n\n    // create the range,\
  \ page, and number of results\n    // to return\n    msQuery.Append(\"<Range><StartAt>1</StartAt><Count>20</Count>\"\
  \n        + \"</Range></Query></QueryPacket>\");\n    return msQuery.ToString();\n\
  }\n```\n\nMSQuery 在开头 QueryPacket 节点之后的两个节点（Query 和 SupportedFormats）不应修改。Context\
  \ 节点包含实际的搜索查询，您可以根据需求更改。最后一个节点 Range 包含指令，用于告诉 SPS 查询服务 Web 服务返回多少结果以及从哪个索引开始结果集。\n\
  \n例如，如果您每页显示 20 条结果，并且想要显示第三页结果，则应将 StartAt 节点设置为 41，并将 Count 节点保留为 20。\n\n现在，我们拥有了一个包含全文查询的完整\
  \ MSQuery 字符串。\n\n让我们看看搜索现在是否能够正常工作。构建 Tropical Green 项目并导航到 http://www.tropicalgreen.net/。在搜索框中输入\
  \ ficus，然后点击 Go。您应该会看到与下图类似的结果（稍后我们会考虑让它看起来更美观）：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_165_0.png)\n\
  \n每个好的搜索引擎提供的功能不仅仅是关键字搜索。有些站点按主题过滤，有些按产品过滤。就我们而言，我们可以将所有结果过滤为仅显示植物目录，排除站点的其余部分。使用\
  \ MCMS Connector 提供的控件，您无法以用户友好的方式做到这一点。虽然知识渊博的访客可能会意识到他们可以在高级搜索选项之一中输入部分 CMS 路径，但对于网站的普通访客来说，这并不直观。这正是您可以真正开始利用自定义搜索组件的地方。\n\
  \n- 4. 让我们看看过滤器是如何工作的。保存更改并构建 Tropical Green 项目。构建完成后，打开浏览器并导航到 http://www.tropicalgreen.net/TropicalGreen/SearchResults.aspx。在文本框中输入\
  \ ficus，选中“仅搜索植物目录”复选框，然后点击 Go 按钮：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_167_0.png)\n\
  \n太棒了！现在我们只看到 Tropical Green 植物目录中的记录！这让我们很好地了解了过滤带来的好处。我们可以按很多事情进行过滤，例如只显示最近一个月或一周内更新过的文章。可能性几乎是无穷无尽的。\n\
  \n让我们看看能否通过去掉 DataGrid 并用 Repeater 替换它来清理这些搜索结果。同时，我们将添加对搜索结果的过滤，以便用户只能看到他们有权访问的文章。\n\
  \n尽管我们在全文查询中列出了许多 SharePoint 索引属性，但在主结果页分析结果时，我们将只使用 DAV:href 属性来获取对指定 MCMS 频道或文章的引用，以确定用户是否有权浏览该资源，并确定和返回实际文章的名称和描述。\n\
  \n- 1. 在设计视图中打开 SearchResults.aspx 页面。删除 DataGrid。\n- 2. 将 Repeater 对象拖放到页面上原来放置\
  \ DataGrid 的位置。为 Repeater 分配 ID 为 rptSearchResults。\n- 3. 在设计视图中，选择新的 Repeater 并打开“属性”窗口。在窗口顶部，单击“事件”按钮以显示我们可以使用的所有事件。双击\
  \ ItemDataBound 右侧的框，创建一个空的事件处理程序，该处理程序将在每次将项目绑定到 Repeater 时触发。\n- 4. 切回到 SearchResults.aspx\
  \ 的 HTML 视图，滚动到新的 Repeater。\n\n\n\n\n\n```\nelse\n{\n    // try to get the object\
  \ via the URL\n    return CmsHttpContext.Current.Searches.GetByUrl(url);\n}\n//\
  \ if this point reached, unknown URL\nreturn null;\n}\ncatch\n{\n    return null;\n\
  }\n```\n\n3. 现在，找到 `rptSearchResults_ItemDataBound()` 事件处理程序。我们需要在 Repeater 中绑定到\
  \ `ItemTemplate` 或 `AlternatingItemTemplate` 时捕获该事件。然后，我们将获取正在绑定到模板的数据项的引用，在我们的例子中是一个\
  \ DataRow，并获取我们在模板中添加的 ASP.NET 对象的引用。最后，我们将使用 DataRow 中的数据来填充控件的属性。以下是我们完成的 `ItemDataBound()`\
  \ 事件处理程序的样子：\n\n```\nprivate void rptSearchResults_ItemDataBound(object sender,\n\
  \    System.Web.UI.WebControls.RepeaterItemEventArgs e)\n{\n    if ((e.Item.ItemType\
  \ == ListItemType.AlternatingItem)\n        || (e.Item.ItemType == ListItemType.Item))\n\
  \    {\n        // get a reference to the datarow being bound\n        DataRow row\
  \ = e.Item.DataItem as DataRow;\n        HierarchyItem hi = GetResult(row[0].ToString());\n\
  \n        // get references to all the ASP.NET objects\n        PlaceHolder resultContainer\
  \ = e.Item.FindControl(\"phdSearchResult\")\n                                  \
  \    as PlaceHolder;\n        HyperLink resultTitle = e.Item.FindControl(\"hlkResultTitle\"\
  )\n                                as HyperLink;\n        Literal resultDesc = e.Item.FindControl(\"\
  litResultDescription\")\n                             as Literal;\n\n        //\
  \ if the URL doesn't resolve to an MCMS resource,\n        // output it to the results\n\
  \        if (hi != null)\n        {\n            // user has rights to this item\
  \ so display it.\n            resultContainer.Visible = true;\n\n            //\
  \ use values in DataRow to populate objects\n            resultDesc.Text = hi.Description;\n\
  \            if (hi is ChannelItem)\n            {\n                resultTitle.Text\
  \ = (hi as ChannelItem).DisplayName;\n                resultTitle.NavigateUrl =\
  \ (hi as ChannelItem).Url;\n            }\n            else\n            {\n   \
  \             if (hi is Resource)\n                    resultTitle.NavigateUrl =\
  \ (hi as Resource).Url;\n                resultTitle.Text = hi.Name;\n         \
  \   }\n        }\n    }\n}\n```\n\n最终结果看起来像这样：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_170_0.png)\n\
  \n你会看到描述字段可能并不完全是我们想要的，但这种技术让我们可以随心所欲地自定义搜索结果列表。你可以直接从索引值中提取帖子的描述，前提是你使用 SearchPropertyCollection.xml\
  \ 文件公开了页面描述。或者，你甚至可以在所有模板中放置一个名为“Search Description”的 HtmlPlaceholder，让内容所有者输入在搜索结果中显示时要展示的描述。\n\
  \n## Summary\n\n在本章中，我们讨论了 MCMS 开发人员为其站点添加搜索功能可用的一些选项。我们深入研究了 SharePoint Portal\
  \ Server 内置的搜索功能，以及它们如何被用作 MCMS 站点的后端搜索主力。在开始添加搜索功能之前，我们必须对站点和模板进行一些更改，并使用 SharePoint\
  \ 构建一个索引来爬取我们的站点。\n\n一旦我们的站点配置为索引爬取，并且 SharePoint 配置为爬取我们的站点并构建索引，我们就详细探讨了使用 SharePoint\
  \ 爬虫为 Tropical Green 站点添加搜索功能的两种选项：\n\n- 首先，我们使用 MCMS Connector for SharePoint Technologies\
  \ 实现搜索，这是一个开箱即用的解决方案。\n- 然后，我们构建了自己的解决方案，使用 SharePoint Query Service Web Service\
  \ 和自定义全文 T-SQL 查询来提供搜索过滤器和自定义结果。\n"
- "## Publishing Content Between MCMS and SharePoint\n\nMicrosoft Content Management\
  \ Server (MCMS) 和 SharePoint Products and Technologies (SPS 和 WSS) 提供了互补的功能集。MCMS\
  \ 是一种内容发布产品，提供强大的发布工作流引擎。SharePoint 是一种在线协作产品，为用户提供共享信息（如文档库和列表）的平台。它还包含一个集中式的企业级搜索和索引引擎，使用户能够在许多较小的站点内搜索不同类型的内容。两者都不能被视为彼此的替代品，因为它们具有如此具体且不同的用途。然而，如果正确利用，这两种产品的核心功能可以相互受益。\n\
  \n在本章中，我们将探讨在两种产品之间发布 MCMS 和 SharePoint 内容，以展示利用两种产品各自强大功能所带来的诸多可能性。我们首先将研究一些不同的场景，说明为什么、如何以及何时希望从一种产品向另一种产品发布内容。然后，我们将详细研究从\
  \ MCMS 发布内容到 SharePoint 以及反之亦然的情况。每个分析都将检查 MCMS Connector for SharePoint Technologies\
  \ 为完成这些内容共享任务提供了什么，以及讨论并在某些时候构建自定义解决方案，以填补 Connector 因其定制能力有限而留下的空白。\n\n正如你所期望的，本章不会涵盖使用\
  \ SharePoint Portal Server 作为 MCMS 站点的搜索引擎，因为这已在第 5 章 *Searching MCMS with SharePoint*\
  \ 中详细讨论过。\n\n在本章中，我们将进一步探讨 SharePoint 和 MCMS 如何携手合作，提供强大的内容创作和协作解决方案。\n\n在某些情况下，建立在\
  \ SPS 和 MCMS 之上的内联网实现将通过部署多个门户来促进员工之间的在线协作，这些门户从数百个或数千个较小的 WSS 站点聚合内容。小团队使用这些团队站点进行项目、新产品、程序和任务的开发。与此同时，人力资源部门正在使用\
  \ MCMS 来严格控制公司政策、标准、规则和程序，这些内容更具导向性，需要发布工作流解决方案。两种产品如何被利用来提供单一解决方案的可能性是无穷无尽的。\n\n\
  除了单一的组合解决方案之外，SPS 和 MCMS 还可以部署在不同的环境中，以解决不同的业务挑战。例如，公司可能会使用 MCMS 实现其互联网站点，并使用 SPS\
  \ 或 WSS 实现内部部门站点。然而，即使两种产品未组合在一起，它们也可以相互发布和提取内容和数据。考虑一个由产品团队使用的 WSS 站点，用于管理产品相关的活动和文档。公司互联网站点可以从\
  \ WSS 站点中的活动列表 Web Part 中提取内容，以向非员工展示即将举行的活动。此外，WSS 站点可以从互联网站点中提取包含产品销售信息的帖子供内部使用。这消除了内容录入和管理的重复。\n\
  \n> 上述描述的解决方案概述了在组织内部使用 SharePoint 的情况，其中部分内容发布到互联网，但这并不是常见场景。利用 MCMS 和 SharePoint\
  \ Portal Server 的最常见情况是两种产品都在公司内部使用，如内联网示例中所述，因为使 SharePoint 数据可供公司非员工访问需要购买 External\
  \ Connector License，这是一个重大的成本因素。\n\n这些只是你如何将 SPS 和 MCMS 结合起来为业务问题或挑战提供解决方案的两个例子。幸运的是，微软认识到这两种产品非常互补，并提供了一套免费的工具和实用程序，供开发人员快速启动将两种产品融合在一起：MCMS\
  \ Connector for SharePoint Technologies（以下简称 Connector）。\n\n### Joining MCMS and\
  \ SharePoint in a Single Solution\n\n没有一种最佳的方式来连接这两种产品。正如我们之前所讨论的，每个产品都有强大的领域可以互补。你需要评估哪种方式最适合特定业务挑战的需求。在做出这一决定之前，你需要了解每个产品如何实现。\n\
  \nMCMS 可以配置为从一个或多个配置为 MCMS Web Entry Points 的 IIS 网站提供内容。无论单个物理服务器上有多少个 MCMS Web\
  \ Entry Points，所有 MCMS Web Entry Points 都将使用相同的 MCMS Repository，因为每台机器只能配置一个数据库。\n\
  \n\n\n\n## 在 MCMS 和 SharePoint 之间发布内容\n\n当 SharePoint 和 MCMS 位于同一台物理服务器上时，您可以选择在独立的虚拟服务器中运行它们，也可以在同一虚拟服务器中运行它们。\n\
  \n> 在 Microsoft Internet Information Services 中，虚拟服务器也称为网站。\n\n如您所见，对于这两个产品的部署方式，您有多种选择：\n\
  \n- 1. 将 MCMS 和 SharePoint 部署在同一台物理服务器和同一个虚拟服务器上\n- 2. 将 MCMS 和 SharePoint 部署在同一台物理服务器但不同的虚拟服务器上\n\
  - 3. 将 MCMS 和 SharePoint 部署在不同的物理服务器上，因而使用不同的虚拟服务器\n\n由于选项众多，您需要首先决定的事项之一是：这两个产品中哪一个将作为解决方案的主要入口点。如果\
  \ SharePoint 和 MCMS 位于不同的物理服务器或虚拟服务器上，则两者均可充当主要入口点。但是，如果 MCMS 和 SharePoint Portal\
  \ Server 配置为在同一虚拟服务器上运行，并且用户访问站点根目录（例如 http://www.TropicalGreen.net），则 SharePoint\
  \ 将是主要入口点。\n\n> 在同一虚拟目录中运行 MCMS 和 SPS 需要在 SharePoint 管理中进行一些手动配置，以排除某些 URL 路径不被\
  \ SharePoint ISAPI 筛选器管理。这允许请求由 MCMS ISAPI 筛选器处理。遗憾的是，SharePoint 不允许排除门户的根目录。这意味着任何发送到虚拟服务器根目录的\
  \ HTTP 请求（如 http://www.TropicalGreen.net/default.aspx）都将由 SharePoint ISAPI 筛选器处理。只有根目录以下的子目录（例如\
  \ http://www.TropicalGreen.net/TropicalGreen/default.aspx）可以排除在 SharePoint 之外，从而由\
  \ MCMS 管理。\n> \n> 有关如何在同一虚拟服务器上设置 MCMS 和 SharePoint 的更多信息，请参阅附录 A《_在同一虚拟服务器上设置 MCMS\
  \ 和 SPS_》。\n\n本章将介绍可覆盖两种情况的解决方案：MCMS 和 SharePoint 位于同一虚拟服务器上，以及位于不同服务器（虚拟或物理）上。如果您选择在不同的物理服务器上运行这两个产品，则需要实现一个自定义解决方案来在计算机之间发布内容。最常见的方法是使用\
  \ Web 服务。\n\n> SharePoint 附带一长串 Web 服务，可公开其大部分内容。这些 Web 服务位于站点根目录下的 `_vti_bin` Web\
  \ 应用程序中，该应用程序为每个 SharePoint 门户和 Windows SharePoint Services 站点自动创建。有关为 MCMS 创建 Web\
  \ 服务的更多信息，请参阅第 11 章《_与 Web 服务结合的 InfoPath_》，该章节涵盖了 MCMS 的 Web 服务。在该章节中创建的 Web 服务由\
  \ Microsoft Office InfoPath 使用，但也很容易被自定义代码使用。\n\n- Tropical Green 使用 MCMS 和 SharePoint\
  \ 来提供完整的 Intranet 解决方案。SharePoint 主要用于托管较小的团队站点，并为整个 Intranet 提供集中式搜索引擎，而 MCMS 则在\
  \ Intranet 中内容密集的部分被使用。\n\n在上述场景中，您会注意到一个共同点：解决方案从一个环境（例如 SharePoint 或 MCMS）提取内容，以在另一个环境中显示。请注意，内容不会被复制，并且是只读的（SharePointDocumentLibrary\
  \ 占位符除外，MCMS 模板使用它来显示 SharePoint 文档库中的内容）；内容只是被拉取进来，从而减少了数据重复。限制数据重复可以减少错误以及管理、更新两个产品中信息的成本。然而，解决方案的整体性能将会下降，因为如果它拥有数据的副本而不是从另一个产品实时拉取数据，性能会更好。上述三个场景虽然相当简单，但应该能让您了解在\
  \ SharePoint 和 MCMS 之间共享内容的一些可能性。\n\n## 用于 SharePoint 技术的 MCMS 连接器\n\n2004 年 2 月，Microsoft\
  \ 发布了该连接器，其中包含一组 SharePoint Web 部件、MCMS 控件和占位符，以及一些命令行实用程序，开发人员可以利用这些工具在 MCMS 中发挥\
  \ SharePoint 的优势，反之亦然。该连接器完全免费、由 Microsoft 提供支持并有完整文档，且包含一个示例项目（带数据），演示了该包中包含的功能。\n\
  \n> 有关从何处获取连接器、安装说明以及其所包含内容的详细信息，请参阅附录 B“用于 SharePoint 技术的 MCMS 连接器”。\n\n我们将要讨论的第一个场景涉及在\
  \ SharePoint 中呈现 MCMS 内容。连接器提供了三种使用 Web 部件在 SharePoint 站点中查看 MCMS 内发布项的方法。\n\n-\
  \ MCMS 页面列表 Web 部件：显示所选 MCMS 频道中的发布项列表。该列表的呈现可通过不同视图进行修改。本章稍后我们将为此 Web 部件创建一个自定义视图。\n\
  - MCMS 生产中的页面 Web 部件：显示当前用户正在处理的发布项列表，类似于 MCMS 中的生产经理。\n- MCMS 等待审批的页面 Web 部件：显示可由当前用户批准的发布项列表，类似于\
  \ MCMS 中的审批助手。\n\n安装连接器后，这三个 Web 部件会自动安装到所有门户站点上。如果您要在安装连接器之后创建门户，则需要手动安装这三个 Web\
  \ 部件，它们都包含在一个单独的 CAB 文件中。遗憾的是，连接器附带的文档并未说明如何安装 Web 部件。SharePoint 要求您使用命令行实用程序来安装\
  \ Web 部件并执行其他管理功能。此实用程序 stsadm.exe 位于目录 C:\\Program Files\\Common Files\\Microsoft\
  \ Shared\\web server extensions\\60\\BIN\\ 中。\n\n## 安装 MCMS 连接器 Web 部件\n\n- 1. 单击“开始”|“运行”（或按\
  \ Windows + R），在对话框中输入 cmd 以打开命令行窗口。\n\n- 2. 输入 cd c:\\Program Files\\Common Files\\\
  Microsoft Shared\\web server extensions\\60\\BIN\\，将目录更改为 STSADM.EXE 实用程序所在的位置。\n\
  \n- 3. 在安装之前，我们先查看一下我们站点上所有门户中已安装了哪些 Web 部件。我们使用 enumwppacks 选项来执行此操作，该选项将显示每个虚拟服务器上安装的所有\
  \ Web 部件的列表。在提示符下输入以下命令：STSADM.exe -o enumwppacks。如果您尚未向门户中安装任何内容，您应该会看到类似下面的信息：\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_177_0.png)\n\n- 4. 现在，让我们继续将连接器 Web 部件安装到我们服务器上所有已扩展\
  \ SharePoint 的虚拟服务器中。您需要找到包含连接器所附带的三个 Web 部件的 CAB 文件。如果您将连接器安装到了默认安装目录，您会在 c:\\\
  Program Files\\MCMS Connector for SharePoint Technologies\\WSS\\Bin\\CmsWebParts.cab\
  \ 找到 CAB 文件。在命令控制台中输入以下内容：STSADM.exe -o addwppack -filename \"C:\\Program Files\\\
  MCMS Connector for SharePoint Technologies\\WSS\\Bin\\CmsWebParts.cab\"。您应该会看到如下响应：\n\
