  \n## Replacing Resources\n\n更新资源时，最好替换其内容而不是删除后重新上传。替换意味着保留 GUID 和 URL，这样帖子中对该资源的超链接不仅会保持完整，而且会立即链接到更新后的内容。\n\
  \n使用 PAPI，资源通过 Resource.SetContentFromFile() 方法进行替换。在本示例中，我们将为 CMS Explorer 构建一个新的替换资源对话框：\n\
