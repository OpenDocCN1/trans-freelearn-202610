  \ 模式下检索当前用户的 CmsContext，我们将在类上定义一个辅助属性，该属性返回这样的 CmsContext。 你还会注意到，由于我们需要对象处于 Update\
  \ 模式，因此我们使用的是 CmsApplicationContext 类而不是 CmsHttpContext。\n\n```\n#region MCMS Current\
  \ Context\n\n/// <summary>\n/// Declare the cms context as a private variable so\
  \ we\n/// don't need to load it every time we access the property.\n/// </summary>\n\
  private CmsContext _CurrentCmsContext;\n\n/// <summary>\n/// Get the current MCMS\
  \ context in update mode.\n/// </summary>\nprivate CmsContext CurrentCmsContext\n\
  {\n    get\n    {\n        // Do we need to load the cmscontext?\n        if (_CurrentCmsContext\
