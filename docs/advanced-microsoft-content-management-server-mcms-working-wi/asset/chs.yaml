  \ name=\\\"MAPH_AttLink_\"\n        + sPhName + \"_\" + i.ToString()+\"\\\" value=\\\
  \"\"+attUrl[i]+\"\\\">\");\n    . . . code continues . . .\n}\n```\n\n\n\n\n# 有用的占位符控件\n\
  \n```csharp\nprotected override void LoadPlaceholderContentForPresentation(\n  \
  \                                    PlaceholderControlEventArgs e)\n{\n    EnsureChildControls();\n\
  \n    // Get the current CmsHttpContext\n    CmsHttpContext cmsContext = CmsHttpContext.Current;\n\
  \n    // Get an instance of the selected resource gallery\n    string xml = ((XmlPlaceholder)this.BoundPlaceholder).XmlAsString;\n\
  \    m_resourceGalleryPath = GetResourceGalleryPath(xml);\n\n    ResourceGallery\
  \ rg = cmsContext.Searches.GetByPath(m_resourceGalleryPath)\n                  \
  \           as ResourceGallery;\n}\n```\n\n获取到资源库实例后，会生成一个随机数。同样，我们将编写一个辅助函数 RandomNumberGenerator()，从零到资源库中资源数量减一的范围内选取一个数字：\n\
  \n```csharp\nprivate int RandomNumberGenerator(int max)\n{\n    // generate a random\
  \ number\n    int seed;\n    int index = 0;\n    seed = (int)System.DateTime.Now.Ticks\
  \ % System.Int32.MaxValue;\n    System.Random rand = new System.Random(seed);\n\
  \    index = rand.Next(0,max);\n\n    return index;\n}\n```\n\n接下来，获取对应于随机选择索引的资源。按如下所示修改\
  \ LoadPlaceholderContentForPresentation() 方法：\n\n```csharp\nprotected override void\
  \ LoadPlaceholderContentForPresentation(\n                                     \
  \ PlaceholderControlEventArgs e)\n{\n    . . . code continues . . .\n\n    if (rg\
  \ != null)\n    {\n        // Randomly select a resource from the gallery\n    \
  \    int indexOfResource = RandomNumberGenerator(rg.Resources.Count);\n        Resource\
  \ r = rg.Resources[indexOfResource];\n    }\n}\n```\n\n为了确定文件的类型，我们检查其 MIME 类型（多用途互联网邮件扩展类型）。MIME\
  \ 类型用于浏览器确定内容应如何显示。例如，MIME 类型为 `applications/x-shockwave-flash` 的文件将在 Flash 播放器中播放，而不是作为图像或文本显示。Resource.MimeType\
  \ 属性返回的确切值取决于服务器的注册表。\n\n```\n```html\n<TD>Greet the world: </TD>\n<TD></TD>\n</TR>\n\
  </TBODY>\n</TABLE>\n```\n```\n\n发生了什么？HtmlPlaceholder 对象设计为仅存储特定标签，如 `<table>`、`<tr>`\
  \ 和 `<td>` 标签（请注意，这些表格标签仅在允许完整格式时才被接受）。完整列表可以从文档中获得。\n\n## 我在哪里可以找到 HtmlPlaceholder\
  \ 接受的完整标签列表？\n\n允许的标签完整列表记录在 MCMS 手册中，章节为 *Mapping HTML Placeholder Definition Properties\
  \ to Content Authoring Behavior*。在线版本可在 `http://msdn.microsoft.com/library/en-us/sitedevl/htm/cms_sd_dev_vsnetintegration_lcua.asp`\
  \ 找到。\n\n设置此类限制是为了防止可能危险的标签被输入并保存在占位符中。此类代码可能导致无限循环，打开新的浏览器窗口，窃取 cookie，甚至启动恶意小程序或其他控件。\n\
  \n尽管如此，可能存在作者需要贡献包含这些禁止标签的内容的情况。作者可能需要在占位符内容中嵌入客户端脚本、IFRAMES、小程序或 ActiveX 控件。通常，这些对象在模板文件中定义，但这样做需要开发人员插入代码。技术熟练的作者可能希望自行管理此类内容，从而绕过因开发人员繁忙而造成的潜在工作流瓶颈。\n\
  \n默认的 HtmlPlaceholder 占位符对象不允许所有标签。为了解决这个问题，我们将构建一个自定义占位符控件。我们称之为 AllTagsHtmlPlaceholderControl。该控件的外观和感觉与\
  \ HtmlPlaceholderControl 相同，但它会修改内容，使底层 HtmlPlaceholder 在发布保存时不再检测到不允许的标签。\n\n以下是作者视图中完成的\
  \ AllTagsHtmlPlaceholderControl。它看起来与 HtmlPlaceholderControl 完全相同。作者甚至不会注意到区别。\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_285_0.png)\n\n为了欺骗占位符接受每个标签，无论是简单的粗体标签\
  \ <b> 还是脚本标签 <script>，我们将用字符串 \"~LT~\" 和 \"~GT~\" 分别替换所有小于号 (<) 和大于号 (>) 字符。结果是保存到占位符的内容只是像这样有趣的文本：\n\
  \n```text\n~LT~script~GT~\nfunction Greet()\n{\n    alert(document.all.MyTextBox.value);\n\
  }\n~LT~/script~GT~\n```\n\n转换后的文本不包含任何受限标签。它可以毫无问题地保存到占位符中。有趣的是，流行的 Telerik r.a.d.\
  \ 编辑器使用相同的技术来允许特殊标签。\n\n由于转换过程是在发布保存时完成的，我们将修改 SavePlaceholderContent() 方法。将重写的\
  \ SavePlaceholderContent() 方法添加到构造函数正下方。在保存时，我们将调用一个名为 Escape() 的方法（定义在之后），该方法将所有标签转换为文本。\n\
  \n```csharp\nprotected override void SavePlaceholderContent(PlaceholderControlSaveEventArgs\
  \ e)\n{\n    EnsureChildControls();\n    ((HtmlPlaceholder)(this.BoundPlaceholder)).Html\
  \ = Escape(this.Html);\n}\n```\n\n## 转义标签\n\nEscape() 方法只是用 ~LT~ 替换所有小于号 (<) 字符，用\
  \ ~GT~ 替换所有大于号 (>) 字符。\n\n值得注意的是，只有 HTML 标记标签才包含 < 和 > 字符。如果作者将这些字符作为占位符中正文的一部分输入，MCMS\
  \ 会将小于号编码为 &lt;，大于号编码为 &gt;。因此我们不必担心 Escape() 例程会搞乱作者输入的内容。\n\n```csharp\nprivate\
  \ string Escape(string input)\n{\n    return input.Replace(\"<\", \"~LT~\").Replace(\"\
  >\", \"~GT~\");\n}\n```\n\n## 反转义标签\n\n将 ~LT~ 和 ~GT~ 字符转换回 < 和 > 字符的操作由 UnEscape()\
  \ 方法完成。将其直接添加到 Escape() 方法下方。\n\n```csharp\nprivate string UnEscape(string input)\n\
  {\n    return input.Replace(\"~LT~\", \"<\").Replace(\"~GT~\", \">\");\n}\n```\n\
  \n## 加载用于编辑和展示的内容\n\n要显示内容，我们所需要做的就是将 ~LT~ 和 ~GT~ 字符串分别转换回 < 和 > 字符。\n\n内容显示的第一个位置是在作者视图中，作者更新占位符内容时。我们仅在编辑占位符时，或当\
  \ Web Author 处于 AuthoringReedit 模式时才需要转换文本。前面定义的 UnEscape() 方法执行转换。添加下面所示的重写 LoadPlaceholderContentForAuthoring()\
  \ 方法：\n\n```\nprotected override void LoadPlaceholderContentForAuthoring(\n    PlaceholderControlEventArgs\
  \ e)\n{\n    EnsureChildControls();\n    if (WebAuthorContext.Current.Mode == WebAuthorContextMode.AuthoringReedit)\n\
  \    {\n        base.Html = UnEscape(((HtmlPlaceholder)(base.BoundPlaceholder)).Html);\n\
  \    }\n    else\n    {\n        base.LoadPlaceholderContentForAuthoring(e);\n \
  \   }\n}\n```\n\n上传的内容，不用说，也会在展示视图中显示。无论是在查看发布内容的预览或已发布模式时是否显示内容，~LT~ 和 ~GT~ 字符串都必须分别转换回\
  \ < 和 > 字符。我们将在重写的 LoadPlaceholderContentForPresentation() 方法中执行转换。将该方法追加到代码中：\n\
  \n```\nprotected override void LoadPlaceholderContentForPresentation(\n    PlaceholderControlEventArgs\
  \ e)\n{\n    EnsureChildControls();\n    base.Html = UnEscape(((HtmlPlaceholder)(base.BoundPlaceholder)).Html);\n\
  }\n```\n\n控件已完成。保存并构建解决方案。\n\n## 使用 AllTagsHtmlPlaceholderControl\n\n要使用 AllTagsHtmlPlaceholderControl，将\
  \ UsefulPlaceholderControl.dll 库文件复制到 bin 目录，或将其作为引用添加到项目中。添加控件到工具箱后，像使用常规占位符控件一样将其拖放到模板文件上。将控件的\
  \ PlaceholderToBind 属性设置为现有的 HtmlPlaceholderDefinition。\n\n此外，如果作者计划保存受限标签，如 <script>\
  \ 块和 <input> 元素，则需要将控件的 AllowHtmlSourceEditing 属性设置为 true。WYSIWYG 编辑器不允许作者在设计视图中复制和粘贴受限标签。他们必须在作者工具栏上单击\
  \ HTML 按钮，然后将 HTML 代码粘贴到控件中。\n\n\n\n\n\n## 有用的占位符控件\n\nDataGrid 创建完成后，我们就可以开始插入列了。我们要添加的第一列是编辑/更新列。在\
  \ DataGrid 的术语中，这就是 EditCommandColumn。它包含一个 Edit 链接，供作者选择他们想要修改的网格行。点击后，该行会转变为一系列文本框。作者修改完行内容后，点击\
  \ Update 链接即可将工作保存回网格。\n\n当然，如果不编写必要的逻辑，Edit 和 Update 链接不会执行编辑和更新的工作。我们将在稍后编写 OnEditCommand()\
  \ 方法用于编辑，以及 OnUpdateCommand() 方法用于更新。与此同时，我们将这些方法分别注册到 DataGrid 的 EditCommand 和\
  \ UpdateCommand 事件。\n\n```\n// - - - code continues - - -\nprotected override void\
  \ CreateAuthoringChildControls(\n                                  BaseModeContainer\
  \ authoringContainer)\n{\n    // Add a DataGrid control to the authoring container\n\
  \    dg = new DataGrid();\n\n    // Add an Edit/Update column to the DataGrid\n\
  \    EditCommandColumn c0 = new EditCommandColumn();\n    c0.EditText = \"Edit\"\
  ;\n    c0.UpdateText = \"Update\";\n    dg.Columns.Add(c0);\n    dg.EditCommand\
  \ += new DataGridCommandEventHandler(this.OnEditCommand);\n    dg.UpdateCommand\
  \ += new DataGridCommandEventHandler(this.OnUpdateCommand);\n\n    authoringContainer.Controls.Add(dg);\n\
  }\n```\n\n我们还将为作者提供一个 Delete 按钮，以便从 DataGrid 中删除行。自动在 DataGrid 中创建按钮的列类型是 ButtonColumn。与之前添加的编辑和更新链接一样，我们需要为删除项目编写逻辑。我们在\
  \ OnDeleteCommand() 事件处理程序中执行此操作，将在稍后处理。现在，我们将该方法注册为另一个 DataGridCommandEventHandler\
  \ 到 DataGrid 的 DeleteCommand 事件。\n\n```\n// - - - code continues - - -\nprotected\
  \ override void CreateAuthoringChildControls(\n                                \
  \  BaseModeContainer authoringContainer)\n{\n    // - - - code continues - - -\n\
  \n    // Add a Delete button to the DataGrid\n    ButtonColumn c1 = new ButtonColumn();\n\
  \    c1.CommandName = \"Delete\";\n    c1.Text = \"Delete\";\n    dg.Columns.Add(c1);\n\
  \    dg.DeleteCommand += new DataGridCommandEventHandler(this.OnDeleteCommand);\n\
  \n    authoringContainer.Controls.Add(dg);\n}\n```\n\n接下来，我们添加一个 Label 用于在从 DataGrid\
  \ 加载和保存内容时显示错误信息（如果有）。请记住将 Label 定义为类级变量，以便类中的其他方法可以访问它。\n\n```\n// - - - code continues\
  \ - - -\nprivate Label lblMessage;\nprotected override void CreateAuthoringChildControls(\n\
  \                                  BaseModeContainer authoringContainer)\n```\n\n\
  ## 我正在使用 Telerik MCMS 占位符控件。如何使用客户端脚本访问其内容？\n\n使用客户端脚本访问 Telerik MCMS 占位符控件中的内容的技术是类似的。首先，我们需要获取包含\
  \ HTML 的对象的 ID。为此，在 Telerik MCMS 占位符控件中输入一些文本并保存页面。返回到编辑模式并使用 Notepad 查看页面的 HTML\
  \ 源代码。按 Ctrl+F 并搜索刚刚输入的文本。注意包含内容的 `<div>` 标签的 ID，在控件 v2.12 中类似于这样：\n\n```\n`radEditorContainer_(ID\
  \ of control)_AuthoringModeControlsContainer_Editor_(ID of Control)_AuthoringModeControlsContainer`\n\
  ```\n\n对于 ID 为 RadEditorPlaceholderControl1 的占位符控件，检索其内容的 JavaScript 如下：\n\n```html\n\
  <script language=\"javascript\">\n\nvar content =\ndocument.all.radEditorContainerRadEditorPlaceholderControl1_AuthoringModeControlsContainer_EditorRadEditorPlaceholderControl1_AuthoringModeControlsContainer.innerHTML;\n\
  \n</script>\n```\n\n请注意，在控件的不同版本中，包围内容的 `<div>` 标签的 ID 会有所不同。你必须检查生成的源代码以获取你正在使用的特定版本的\
  \ `<div>` 标签的 ID。\n\n## 检查 HtmlPlaceholderControl 是否为空\n\n现在我们知道了如何检索 HtmlPlaceholderControl\
  \ 的当前内容，就可以继续验证它了。当满足以下任一条件时，HtmlPlaceholderControl 被认为为空：\n\n- 它包含一个空字符串。\n- 它仅包含不可见标签和空格，例如\
  \ `<p>&nbsp;</p>`，或 `<p><div>&nbsp;</div></p>` 等。\n\n根据你的需求，你可能还需要检查占位符内容是否包含默认文本。\n\
  \n用于检查这些条件的 JavaScript 在本节中介绍。要验证的控件的名称将被添加到例程的名称中，以确保如果在同一模板文件中放置了多个验证控件；它们各自将拥有自己的客户端例程。代码使用了客户端的\
  \ `isEmpty()` 方法来检查占位符是否为空。\n\n```\nelse\n{\n    // content is valid\n    return\
  \ true;\n}\n}\nfunction isEmpty(content)\n{\n    // Add more tags to ignore in this\
  \ list if you need to.\n    // Here, we ignore <hr> and <img> tags\n    // Additional\
  \ tags should be added and separated with a \"|\" character.\n    var tagsToKeep\
  \ = \"img|hr\";\n\n    // This regular expression matches all <img> and <hr> tags\n\
  \    var regExpTagsToKeep = \"<[\\\\s]*(\\\" + tagsToKeep + \")\\\\b[^>]*>\";\n\
  \    var reTagsToKeep = new RegExp(regExpTagsToKeep, \"gim\");\n\n    // exit if\
  \ one of the tags to keep is included.\n    if (content.match(reTagsToKeep))\n \
  \   {\n        // Placeholder is not empty.\n        return false;\n    }\n\n  \
  \  // This regular expression gets all tags in the content\n    var regExpForAllTags\
  \ = \"<[ ^ ]*>\";\n    var reAllTags = new RegExp(regExpForAllTags,\"gim\");\n\n\
  \    // Remove all tags by replacing with an empty string\n    content = content.replace(reAllTags,\
  \ \"\");\n\n    // Remove all spaces and non-breaking spaces (&nbsp;)\n    content\
  \ = content.replace(\" \",\"\");\n    content = content.replace(\"&nbsp;\",\"\"\
  );\n\n    if (content == \"\")\n    {\n        // if after removing all tags, we\
  \ are left with an empty string\n        // Placeholder is empty.\n        return\
  \ true;\n    }\n    else\n    {\n        // if after removing all tags, we still\
  \ have content.\n        // Placeholder is not empty.\n        return false;\n \
  \   }\n}\n</script>\n```\n\n## 使用正则表达式匹配标签\n\n我们刚刚看到的 isEmpty() JavaScript 函数使用了两个正则表达式。第一个检查\
  \ HTML 中是否存在 <img> 和 <hr> 标签。 recall 只要 HTML 包含这些单标签项，就不为空。让我们更仔细地看看这个表达式：\n\n<[\\\
  s|/]*(img|hr)\\b[^>]*>\n\n第一个和最后一个字符 < 和 > 匹配所有 HTML 标签的开始和结束角括号。\n\n在开始的角括号之后是空格或正斜杠的转义序列，后跟一个星号（Kleene\
  \ 星），\\s*。这确保了在开始角括号后带有空格的标签（例如 < img>）和闭合标签都包含在匹配中。\n\n\n\n\n\n```csharp\nif (this.RenderUpLevel\
  \ && this.EnableClientScript)\n{\n    // Perform validation only in authoring mode.\n\
  \    if (WebAuthorContext.Current.Mode == WebAuthorContextMode.AuthoringNew\n  \
  \      || WebAuthorContext.Current.Mode == WebAuthorContextMode.AuthoringReedit)\n\
  \    {\n        writer.AddAttribute(\"evaluationfunction\", \"validate\"\n     \
  \       + this.ControlToValidate);\n    }\n}\n```\n\n## 重写 EvaluateIsValid() 方法\n\
  \n要完成代码，我们需要实现基类的 EvaluateIsValid() 方法，否则项目将无法编译。这里我们实现服务器端检查。目前，我们将 EvaluateIsValid()\
  \ 留空并使其始终返回 true。虽然这不是生产环境中应该做的事情，但不用担心。我们将在后面的 *实现服务器端验证* 部分填充此方法以提供服务器端验证。将 EvaluateIsValid()\
  \ 方法直接添加到 AddAttributesToRender() 方法下方。\n\n```csharp\nprotected override bool EvaluateIsValid()\n\
  {\n    bool valid = true;\n    return valid;\n}\n```\n\n自定义验证控件现已完成。保存并编译解决方案。\n\
  \n## 将自定义验证器添加到模板文件\n\n在使用自定义控件之前，我们首先需要将其复制到项目文件的 bin 目录，或将其作为引用添加到 MCMS Web 应用程序项目中。完成此操作后，通过选择\
  \ Add/Remove Items 选项（或 VS.NET 2002 的 Customize Toolbox 选项）将控件添加到 Visual Studio\
  \ .NET 工具箱。然后您可以将其拖放到模板文件上。为了使控件正常工作，您必须将 ControlToValidate 属性设置为要验证的 HtmlPlaceholderControl\
  \ 的 ID 值，并将 ErrorMessage 属性设置为作者友好的错误消息。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_317_0.png)\n\
  \nHtmlPlaceholderControl 的 ID 并未出现在 ControlToValidate 下拉列表中。下拉列表不应该填充与正在验证的控件类型匹配的占位符\
  \ ID 吗？\n\n为了使控件的 ID 包含在下拉列表中，我们必须使 HtmlPlaceholderControl 与 ASP.NET 验证控件架构兼容。我们将在\
  \ *带验证的 HtmlPlaceholderControl* 部分中完成此操作。\n\n## 防止包含无效内容的页面被保存\n\n还有一个问题需要解决。虽然自定义验证控件已包含所有必要代码，但除非有人点击其\
  \ Control.CausesValidation 属性设置为 true 的 ASP.NET 控件，例如 Button，否则它将无法工作。否则，即使必需的占位符未填写，页面仍会被保存。\n\
  \n如果您查看 Default Console 上的控件是如何编码的（在 DefaultConsole.ascx 文件中），您会发现它们只是简单的 HTML 锚点标签。HTML\
  \ 锚点标签不是按钮，因此不会触发页面验证。因此，点击控制台上的任何操作链接都不会触发我们的自定义验证控件。\n\n我们需要在用户点击以下三个操作按钮之一时触发验证器：\n\
  \n- Save New Page\n- Save\n- Save and Exit\n\n我们将修改每个按钮的行为，以便在页面无效时取消保存操作。\n\n要了解如何强制这些控件在点击时验证页面，我们再次从\
  \ ASP.NET 中获取线索。前面我们看到 ASP.NET 如何生成 Button 控件：\n\n```\n<input type=\"submit\"\n\
  name=\"Button1\"\nvalue=\"Button\"\nonclick=\"if (typeof(Page_ClientValidate)==‘function’)\n\
  Page_ClientValidate();\"\nlanguage=\"javascript\"\nid=\"Button1\" />\n```\n\n高亮的行显示了在表单提交前确保客户端验证发生的代码。它基本上调用了\
  \ WebUIValidation.js 文件中的 Page_ClientValidation() 客户端脚本。此行代码可确保我们的 HTML 锚点表现出与 Button\
  \ 相同的行为。\n\n我们需要在调用客户端保存方法之前插入它，这意味着我们应该修改三个控制台操作按钮中的每一个，从 Save New Page 控件开始。\n\
  \n## 带验证的 Save New Page\n\n向 `MCMSValidators` 项目添加一个名为 `ValidatedSaveNewAction.cs`\
  \ 的类文件。在命名空间声明上方，添加以下必需的命名空间：\n\n```\nusing System;\nusing Microsoft.ContentManagement.Publishing;\n\
  using Microsoft.ContentManagement.WebControls;\nusing Microsoft.ContentManagement.WebControls.ConsoleControls;\n\
  namespace MCMSValidators\n{\n}\n```\n\n与其从头重写 Save New Page 操作控件，我们将通过继承 AuthoringSaveNewAction\
  \ 类来创建它：\n\n```\npublic class ValidatedSaveNewAction : AuthoringSaveNewAction\n\
  {\n}\n```\n\n我们唯一需要做的修改是重写 ActionJavascript 属性。我们首先检查控件是否对用户可用。如果可用，我们使用 Page.Validators.Count\
  \ 属性查找验证控件的存在。一旦确定页面上存在验证控件，我们就注入 JavaScript 语句以调用 Page_ClientValidate() 方法。\n\n\
  在 ValidatedSaveNewAction() 构造函数下方，添加重写的 ActionJavascript 属性：\n\n```\npublic override\
  \ string ActionJavascript\n{\n    get\n    {\n        string strReturn = null;\n\
