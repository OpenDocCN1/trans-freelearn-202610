  \n## 移动模板库和模板\n\n模板库和模板是通过模板资源管理器或站点管理器将对象从一个容器拖放到另一个容器来移动的。PAPI 提供了 TemplateGalleryItem.MoveTo()\
  \ 方法以编程方式移动这些对象。\n\n该技术与复制模板类似。我们需要做的是：\n\n- 首先，获取我们希望移动的模板库项的引用。\n- 接下来，获取模板库项将被移动到的目标模板库的引用。\n\
  - 最后，调用 TemplateGalleryItem.MoveTo() 方法。\n\n让我们为 CMS Explorer 构建一个移动模板对话框。\n\n向项目添加一个名为\
  \ MoveTemplate.aspx 的 Web 表单。\n\n1. 将 styles.css 拖放到 Web 表单上。\n2. 在 HTML 视图中，输入以下代码：\n\
