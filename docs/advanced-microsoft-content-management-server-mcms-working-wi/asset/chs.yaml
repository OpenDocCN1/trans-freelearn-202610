  \ + ex.Message;\n    }\n}\n```\n\nDisplayListOfPHDefinitions() 方法以表格形式列出源模板和目标模板的占位符定义。源模板的占位符定义列在右侧。左侧我们有一个下拉列表，其中包含目标模板的所有占位符定义。作者可以从下拉列表中选择映射到源占位符定义的<|message|>\
