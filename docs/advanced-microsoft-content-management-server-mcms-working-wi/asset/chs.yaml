  \ continues - - -\n}\n}\n\n该代码获取对你要查看其属性的 `HierarchyItem` 的引用。对于模板库、模板、资源库和资源，这是通过从\
  \ `CMSObjectGuid` 查询字符串参数获取 GUID，并使用 `Searches.GetByGuid()` 方法获得的。频道和发布则从 `CmsHttpContext.Current.ChannelItem`\
  \ 属性获取。\n\n在设计视图中，将 `Styles.css` 文件和 `DataGrid` 拖放到 `Properties.aspx` Web 窗体上，并为\
