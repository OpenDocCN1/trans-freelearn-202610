  ```\n\n虽然对话框运行良好，但我需要一个更便携的控件，可以在项目之间使用，而无需每次使用该控件时都重新创建 Web 窗体。我有哪些选择？\n\n要在多个项目中部署此控件，请考虑以下选项之一：\n\
  \n1. 在 `/IIS_CMS/` 文件夹内创建一个文件夹，并将对话框存储在那里。由于所有 MCMS Web 项目都有一个名为 CMS 的虚拟目录映射到 `IIS_CMS`\
  \ 文件夹，因此对话框的路径将是 `/CMS/SubFolder/datetimepicker.aspx`。\n2. 您可以效仿 MCMS 在将 `/nr/`\
  \ 文件夹部署到同一台计算机上的所有网站时使用的概念，即把包含 DateTimePicker 控件的文件夹添加到每个使用该控件的虚拟网站。\n3. 或者，使用\
  \ MCMS 在将 `/CMS/` 文件夹部署到新的 MCMS 模板项目时使用的技术。将包含 DateTimePicker 控件的文件夹添加到需要它的每个模板项目。在代码中获取控件路径时，使用\
  \ `Page.Request.ApplicationPath` 返回的值。要为新项目实现自动化，您可以为 Visual Studio .NET 创建新的企业模板。有关创建和编辑企业模板的更多信息，请参阅\
  \ `http://msdn.microsoft.com/Library/en-us/vsent7/html/vxoriEnterpriseTemplates.asp`。\n\
  4. 重写日期时间选择器控件，使日历、小时和分钟下拉菜单在控件本身上生成。您可以将它们嵌入 `<div>` 标记中，并使用客户端脚本在点击“选择日期”按钮时显示它们。\n\
  \n## 将占位符控件添加到模板文件\n\n要将该控件添加到 MCMS 项目中，您必须将该组件添加到工具箱中：\n\n- 右键单击要将控件添加到的选项卡。\n\
  - 选择“添加/移除项”，然后选择添加“.NET Framework 组件”。\n- 选择“浏览…”，然后选择 `UsefulPlaceholderControls.dll`。单击“打开”。\n\
  - 单击“确定”关闭对话框，并将控件添加到工具箱。\n\n将控件添加到工具箱后，您可以像使用常规占位符控件一样，将其拖放到模板文件上并设置其属性。\n\n\n\n\
  \n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_256_0.png)\n\n继续；将日期时间选择器占位符控件添加到现有模板文件中。将\
  \ PlaceholderToBind 属性设置为合适的 HtmlPlaceholderDefinition。导航到使用该模板的帖子并编辑它。你应该会看到一个文本框和一个\
  \ Pick Date 按钮。点击 Pick Date 按钮并选择一个日期。保存帖子。注意文本框和按钮控件会被一个显示你所选日期和时间的单个标签所取代。\n\n\
  ## 用于多附件的占位符控件\n\n我们已经见识过 SingleImagePlaceholderControl 和 SingleAttachmentPlaceholderControl\
  \ 的工作方式。它们是管理单个文件的便捷控件。作者可以直接从本地计算机上传文件，或从资源库中的共享资源中选择。\n\n然而，这些控件的最大缺点是文件必须一次处理一个。更常见的情况是，作者需要附加多个图像或附件。他们可能有一份支持文章的文档列表，或是一系列伴随故事的图像。无论情况如何，单个附件槽可能并不总是足够。\n\
  \n你可以通过以下三种方式之一解决此单文件限制：\n\n- 为作者提供一个 HtmlPlaceholderControl。\n- 增加页面上的 SingleAttachmentPlaceholders\
  \ 和 SingleImagePlaceholderControls 的数量。提供作者所需的数量。\n- 构建一个自定义占位符控件，允许上传多个文件和图像。\n\
  \n让我们考虑第一个选项，它需要使用 HtmlPlaceholderControl。随着 WYSIWYG 编辑器，作者可以上传所需的任意数量的图像和附件。另一方面，他们也可以向占位符控件添加不需要的文本。虽然给予作者完全自由会让他们满意，但在作者沉迷于应用自己的样式和布局时可能会引起问题。更常见的是，网站所有者希望对上传内容的显示方式有更多控制，甚至可能限制图像和附件的数量——而这些都无法使用\
  \ HtmlPlaceholderControl 实现。\n\n第二个选项，即增加页面上的 SingleAttachmentPlaceholders 和 SingleImagePlaceholderControls\
  \ 的数量，如果所需附件和图像的数量可以准确估计，则是可行的。这种方法的一个主要缺点是，对于引入的每个占位符控件，都必须创建一个相应的占位符定义。如果估计的附件数量很大，则相应的占位符定义数量也会很大。帖子使用的占位符越多，数据库查询需要检索的信息就越多，可能损害网站的整体性能。\n\
  \n显然，这两种开箱即用的解决方案都不能完全满足此需求。为了弥补差距，让我们探索最后一个选项，构建我们自己的自定义占位符控件，使用友好的图形用户界面接受多个附件。\n\
  \n附件的最大数量将由开发者决定。作为一个占位符控件，它在展示和作者模式下会有不同的视图。在作者模式下，控件将显示为一个包含多行的表格，每行提供一个槽供作者上传附件。此控件的一个有趣方面是它将重用随\
  \ Web Author 一起提供的插入附件对话框。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_257_0.png)\n\
  \n在展示视图中，附件显示为超链接列表。开发者可以选择将链接显示为图标或文本。在这里，我们选择将它们显示为图标列表。当然，你可以增强代码以按任何你喜欢的方式排列它们，水平、垂直，甚至在表格内。\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_257_1.png)\n\n## MultipleAttachmentPlaceholderControl\
  \ 类\n\n首先，我们在 UsefulCustomPlaceholders 项目中添加一个名为 MultipleAttachmentPlaceholderControl.cs\
  \ 的类。\n\n类文件使用下面突出显示的命名空间中的方法。在命名空间声明上方添加它们：\n\n```\nusing System;\n\nusing System.Xml;\n\
  using System.Web;\nusing System.Text;\nusing System.Web.UI;\nusing System.Web.UI.WebControls;\n\
  using Microsoft.ContentManagement.Publishing;\nusing Microsoft.ContentManagement.WebControls;\n\
  using Microsoft.ContentManagement.WebControls.Design;\nusing Microsoft.ContentManagement.Publishing.Extensions.Placeholders;\n\
  \nnamespace UsefulCustomPlaceholders\n{\n    ... code continues ...\n}\n```\n\n\
  管理像我们在这里创建的这样的列表的一种好方法是将其存储为 XML。XML 为我们提供了以后以多种方式呈现附件的灵活性。因此，控件将支持 XmlPlaceholderDefinition\
  \ 并通过继承 BasePlaceholder 构建：\n\n```\n[SupportedPlaceholderDefinitionType(typeof(XmlPlaceholderDefinition))]\n\
  public class MultipleAttachmentPlaceholderControl : BasePlaceholderControl\n{\n\
  \    ... code continues ...\n}\n```\n\n控件将为开发者提供三个属性：\n\n- **MaxAttachments**。指定控件支持的最大附件数量。初始值将设置为\
  \ 10。开发者可以通过调整控件属性对话框中的值在设计时更改此值。\n- **DisplayAsIcon**。指定附件是显示为图标还是文本。与 HtmlPlaceholderDefinition\
  \ 类中的 UseGeneratedIcon 属性类似。\n- **ResourceGalleryOnly**。指定是否可以从作者的计算机上传文件作为附件，或作者必须从资源库中的资源中选择。\n\
  \n在类构造函数下方添加以下三个属性：\n\n```\nprivate static int m_maxAttachments = 10;\npublic int\
  \ MaxAttachments\n{\n    get\n    {\n        return m_maxAttachments;\n    }\n\n\
  \    set\n    {\n        m_maxAttachments = value;\n    }\n}\n```\n\n```\n}\nprivate\
  \ bool m_displayAsIcon = false;\npublic bool DisplayAsIcon\n{\n    get\n    {\n\
  \        return m_displayAsIcon;\n    }\n    set\n    {\n        m_displayAsIcon\
  \ = value;\n    }\n}\n\nprivate bool m_resourceGalleryOnly = false;\npublic bool\
  \ ResourceGalleryOnly\n{\n    get\n    {\n        return m_resourceGalleryOnly;\n\
  \    }\n    set\n    {\n        m_resourceGalleryOnly = value;\n    }\n}\n```\n\n\
  ## 生成附件表格\n\n作者的用户界面包括以下内容：\n\n- 一个包含多行的表格，每行对应一个附件。\n- 每行包含一个标记为 Change... 的按钮，用于调用\
  \ Web Author 的插入附件对话框，一个删除按钮用于从列表中移除附件，以及用于显示附件显示文本和 URL 的文本框。\n- 它还显示代表上传附件的图标。\n\
  \n以下是作者视图中的多附件占位符控件：\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_259_0.png)\n\n\
  ## 有用的占位符控件\n\n通常，在构建自定义占位符控件时，添加这些控件的逻辑是通过重写 `CreateAuthoringChildControls()` 方法来编码的。我们在这里不会这样做，因为我们将在控件中大量使用\
  \ JavaScript。添加所有客户端脚本最简单、最省事的方法是采用老式的方式：作为常规 HTML。\n\n因此，在重写的 `CreateAuthoringChildControls()`\
  \ 方法中，我们将只添加一个单一的 Literal Web 控件。稍后，我们将 HTML 代码附加到此 Literal 控件的 Text 属性。添加以下代码到\
  \ ResourceGalleryOnly 属性下方：\n\n```\nprivate System.Web.UI.WebControls.Literal baseAuthoringContainer;\n\
  \nprotected override void CreateAuthoringChildControls\n    (BaseModeContainer authoringContainer)\n\
  {\n    baseAuthoringContainer = new Literal();\n    authoringContainer.Controls.Add(baseAuthoringContainer);\n\
  }\n```\n\n现在，让我们创建表格。由于表格是动态生成的，其中混合了占位符内容和 HTML，我们将在重写的 `LoadPlaceholderContentForAuthoring()`\
  \ 方法中对其进行编码。\n\n表格包含五列：\n\n| Column 1 | Column 2 | Column 3 | Column 4 | Column\
