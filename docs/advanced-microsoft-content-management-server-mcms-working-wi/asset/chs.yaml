  \ Tropical Green 项目的 `global.asxc.cs` 文件中的工作流事件处理程序将不会被触发。\n\n## 连接的帖子\n\n连接的页面是两个不同的帖子对象的副本，它们共享相同的占位符值。由于连接的帖子共享占位符定义和值，因此对一个帖子的属性所做的任何更改都将反映在其所有连接的帖子中。\n\
