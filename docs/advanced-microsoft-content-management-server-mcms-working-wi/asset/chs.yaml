  \ 将通过加载一个 Microsoft.ContentManagement.Publishing.Posting 对象来填充，因此让我们创建 Load() 方法。\n\
  \n为本示例的目的，我们仅维护类型为 HtmlPlaceholder 的占位符。 代码可以很容易地扩展以维护不同类型的占位符。\n\n```\n/// <summary>\n\
  /// Load the lightweight Placeholder collection from a posting.\n/// </summary>\n\
