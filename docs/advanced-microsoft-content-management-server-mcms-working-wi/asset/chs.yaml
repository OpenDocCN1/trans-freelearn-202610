  \ method=\"post\" runat=\"server\">\n<h1>Recycle Bin</h1>\n<input type=\"button\"\
  \ value=\"Close\" onclick=\"window.close();\">\n</form>\n```\n\n切换到设计视图。将以下控件拖放到窗体上，并按如下图所示排列。\n\
  \n| 控件 | 属性 | 属性值 |\n|---|---|---|\n| DataGrid | ID | dgDeletedItems |\n|  | AutoGenerateColumns\
  \ | False |\n| Label | ID | lblMessage |\n|  | Text | （空字符串） |\n| Button | ID |\
