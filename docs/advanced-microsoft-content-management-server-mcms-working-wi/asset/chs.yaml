  \  - Name\n  - Display Name\n  - Posting Path\n  - Posting ID\n  - Template Name\n\
  \  - Template Path\n  - Template ID\n- 4. 选择单元格并将文本设置为粗体。\n- 5. 我们现在必须将生成的文本字段移动到其对应标签旁边。将\
  \ Name、Display Name、Posting Path 和 ID 标签下方的四个文本字段拖到表格右侧列的前四行中。然后删除多余的标签。\n- 6. 与模板属性相关的文本框已在表单底部生成，因为它们由另一个\
  \ XML 元素表示。将这些文本框拖到其对应标签旁边的列中。您可以通过选择它们并查看右侧的 Data Source 窗格来轻松验证属性与哪个对象相关。顶部表格现在应如下所示：\n\
