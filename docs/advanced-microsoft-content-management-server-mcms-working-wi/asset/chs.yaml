  \ 应用程序。当你创建 MCMS Web 应用程序时，它会向应用程序的 web.config 中添加 HttpModules。\n\n要将 ASP.NET Web\
  \ 应用程序转换为 MCMS Web 应用程序，请在 Visual Studio .NET 的项目菜单中选择 Enable as MCMS project。\n\
