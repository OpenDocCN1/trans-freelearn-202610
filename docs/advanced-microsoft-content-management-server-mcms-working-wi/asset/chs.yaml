- '## 创建新的 MCMS Web 入口点


  我们现在已在虚拟服务器上创建了 SharePoint 门户。现在需要配置 MCMS 以使用我们的虚拟服务器作为 MCMS Web 入口点。


  1. 通过指向 开始 | 所有程序 | Microsoft Content Management Server | Server Configuration Application
  启动服务器配置应用程序。

  2. 单击 Web 选项卡以查看所有虚拟服务器并管理其 MCMS 配置。


  ![](img/442e26bf28f2df81fbf8dff3478f88e3_516_0.png)


  3. 你可以看到，我们的新虚拟服务器 portal.tropicalgreen.net 未配置为 MCMS。单击 Configure 按钮以编辑列出的虚拟服务器。

  4. 将 MCMS 列中我们虚拟服务器的下拉菜单设置为 Yes – Read Write。单击对话框和配置页面的 OK。


  我们现在拥有一个 SharePoint 门户，并且已配置新的虚拟服务器作为 MCMS Web 入口点。然而 MCMS 目前不会接收任何请求，因为 SharePoint
  会消耗发往我们虚拟服务器的所有 URL。


  ## 配置 SharePoint 以允许 MCMS 请求


  如上所述，此时 MCMS 请求无法正确处理，因为 SharePoint ISAPI 过滤器会消耗进入我们虚拟服务器的所有请求。如果请求无法由 SharePoint
  ISAPI 过滤器处理，它将简单地向请求方返回 HTTP 404 – File Not Found 响应。


  例如，尝试导航到不存在的路径，例如 http://portal.tropicalgreen.net/fakepath。 该响应直接由


  如果你看到我们的 Tropical Green 植物目录页面，则 MCMS 正在工作。如果看不到我们的植物目录主页，则很可能存在排除的管理路径问题。请验证最后一步。


  你会注意到我们测试的最后一个 URL 看起来很奇怪，因为它包含两个域名。第一本书 *Building Websites with Microsoft Content
  Management Server*（Packt Publishing，2005 年 1 月，ISBN 1-904811-16-7）中的代码，我们假设你正在使用，其中包含两个顶级频道：**international.tropicalgreen.net**
  和 **www.tropicalgreen.net**。第一本书实现了 MCMS Map Channel Names to Host Header Names
  选项，这就是为什么这些频道对名称有域名的原因。不幸的是，当 MCMS 和 SharePoint 在同一虚拟服务器上运行时，不支持 Map Channel Names
  to Host Header Names 功能。因此我们必须禁用此选项，然后我们需要测试的顶级频道名称（**www.tropicalgreen.net**）需要包含在
  URL 中。通常在这种情况下，你会更改频道结构，以便域名不包含在 URL 中。


  如果继续出现问题，请参阅 Microsoft 知识库文章 #835248：http://support.microsoft.com/?id=835248。


  ## 摘要


  在本附录中，我们解释了如何在同一虚拟服务器上成功创建 SharePoint 门户和 MCMS Web 入口点。配置虚拟服务器后，我们展示了如何修改 SharePoint
  虚拟服务器设置中的托管路径排除项，以确保 SharePoint ISAPI 过滤器忽略应由 MCMS 处理的 HTTP 请求。


  ![](img/442e26bf28f2df81fbf8dff3478f88e3_522_0.png)


  你可以在此处下载 MCMS Connector for SharePoint Technologies：

  http://www.microsoft.com/downloads/details.aspx?FamilyID=6E9925C4-91DA-404A-86DD-78D51BCF0A51&displaylang=en


  安装过程中（除许可协议和用户信息外——注册密钥已提供）唯一提示你回答的问题是是否安装示例数据，其中包括演示项目和 SDO 文件。安装示例数据时，SDO 文件将自动导入到你的
  MCMS 安装中。SDO 文件包含示例包用于演示 Connector 功能所需的模板、频道和帖子。


  ## 在 MCMS 站点中利用 SharePoint Portal 搜索


  Connector 包含三个增强 MCMS 模板的控件。其中两个控件用于收集搜索查询信息并在提交到 SPS 后显示查询结果：


  - **SearchInputControl**：SearchInputControl 显示一个输入表单，用户可以在其中输入要搜索的关键字。

  - **SearchResultControl**：SearchResultControl 负责获取 SearchInputControl 中提交的关键字和高级属性，构建查询并调用
  SPS Search 服务。控件然后获取来自 Search Service Web 服务的响应并显示搜索结果。


  Connector 包含的第三个搜索控件是：


  - **SearchMetaTagGenerator**：此控件为 MCMS 帖子属性和自定义属性生成 HTML META 标签信息。它与 XML 映射文件和命令行实用程序结合使用来配置
  SharePoint 索引器。这允许用户为搜索功能实现基本分类法。


  用于生成 META 标签的标准和自定义属性使用名为 SearchPropertyCollection.xml 的 XML 文件和名为 SearchPropertiesSetup.exe
  的控制台应用程序进行管理，该应用程序使用 XML 文件定义的高级属性配置 SharePoint Portal Server 搜索。


  SearchPropertyCollection.xml 文件可在以下目录中找到：

  C:\Program Files\Microsoft Content Management Server\Server\IIS_CMS\WssIntegration.


  SearchPropertiesSetup.exe 实用程序程序可在以下目录中找到：

  C:\Program Files\MCMS Connector for SharePoint Technologies\WSS\Bin.


  如果 SharePoint Portal Server 和 MCMS 位于不同的物理服务器上，则 SearchPropertyCollection.xml 文件需要在两台服务器上都存在。SearchInputControl
  在 MCMS 服务器上使用此 XML 文件，而 SearchPropertiesSetup.exe 实用程序在 SharePoint Portal Server
  上使用该文件。


  为了使用 SPS 作为 MCMS 站点的搜索引擎，需要进行一些配置。这涉及在 SPS 中创建新的内容源、源组和源范围。幸运的是 Microsoft 包含另一个名为
  SearchSetup.exe 的命令行实用程序程序，该程序为 MCMS 站点中的所有顶级频道在 SPS 中创建新的内容源和站点路径规则。


  SearchSetup.exe 实用程序程序可在以下目录中找到：C:\Program Files\MCMS Connector for SharePoint Technologies\WSS\Bin.


  有关 MCMS 和 SharePoint Portal Server 搜索集成的更多信息，请参阅第 5 章，Searching MCMS with SharePoint。


  ## 将 MCMS 内容集成到门户站点


  通过利用 Connector 中包含的单个 Web 部件，你可以在 SharePoint 门户中显示帖子列表。Page Listing Web Part 以六种不同的列表格式显示指定频道中的帖子。以下三种格式在
  Web 部件中硬编码：


  - **Page Summary List View**：此视图显示所有帖子，带有简短标题（或显示名称）、描述、上次修改时间戳和摘要图像。这是 Web 部件的默认视图。每个项目都链接到帖子的发布
  URL。


  - **Basic List View**：Basic List View 以列表形式显示帖子，每个帖子都有重要性图标和简短标题（或显示名称）。


  - **Detailed List View：** 与 Page Summary List View 非常相似，此视图不显示摘要图像，但会添加帖子所有者、上次修改帖子的用户以及帖子的状态（是否已发布）。


  Web 部件为另外三个视图提供了条目，这些视图未随 Connector 提供。这些视图可以由站点开发人员添加并完全根据其需求定制。有关为 Page Listing
  Web Part 创建自定义视图的更多信息，请参阅第 6 章，*Publishing Content Between MCMS and SharePoint*。


  ## 在 MCMS 站点中发布 SharePoint 文档库文档


  Connector for SharePoint Technologies 涵盖的最后一个集成点是在 MCMS 帖子中发布 SharePoint（WSS 或 SPS）文档库的文档。连接器随附一个新的占位符定义和一个新的占位符控件：**SharePointDocumentPlaceholder**
  定义和 **SharePointDocumentPlaceholderControl**。开发人员可以将 **SharePointDocumentPlaceholder**
  定义添加到模板定义中，并将 **SharePointDocumentPlaceholderControl** 添加到模板文件中以显示来自 SharePoint
  文档库的文件。


  占位符以文档名称列表的形式显示文档，并链接到实际文档。如果文件类型在 Microsoft Windows Server 中注册，Connector 将生成图标。否则
  Connector 会为文件类型生成默认图标。你还可以通过在样式表中指定值来覆盖文件类型使用的图标。


  列表的呈现完全可通过 XSLT 样式表自定义，这些样式表用于将 SharePoint 文档库中文档的属性和内容转换为 HTML。


  有关 **SharePointDocumentPlaceholder** 和 **SharePointDocumentPlaceholderControl**
  的更多信息，请参阅第 6 章，*Publishing Content Between MCMS and SharePoint*。


  ## 包含的附加实用程序


  除了 Connector for SharePoint Technologies 提供的 SharePoint Web 部件、服务器控件和 MCMS 占位符以允许内容集成外，Microsoft
  还包含额外的 SharePoint Web 部件和命令行实用程序来帮助你配置 SharePoint 并管理你的 MCMS 网站。


  Connector 中包含以下两个管理 SharePoint Web 部件，以帮助 MCMS 站点作者、编辑和审核员维护其 MCMS 站点：


  - **Pages in Production Web Part：** 此 Web 部件显示当前用户正在处理但尚未发布的帖子，这与 MCMS 中的“Production
  Manager”对话框相当。

  - **Pages Waiting for Approval Web Part：** 此 Web 部件显示 MCMS 站点上等待批准的所有帖子，这与 MCMS
  中的“Approval Assistant”对话框相当。






  The Pages in Production Web Part, Pages Waiting for Approval Web Part, and Page
  Listing Web Part are included in the CmsWebParts.CAB web part deployment file, which
  can be found in the following directory: C:\Program Files\MCMS Connector for SharePoint
  Technologies\WSS\Bin


  Previously we mentioned the two command-line utilities:


  - SearchPropertiesSetup.exe: This utility is used to add the advanced HTML META
  tags to the SPS Search Service.

  - SetupSearch.exe: This is used to automatically create SharePoint content sources
  and search groups for all top-level channels within an MCMS site.


  A third command-line utility, excludeCMS.exe, will add SharePoint managed path exclusion
  rules for all MCMS URL paths in a virtual server. It is necessary for all MCMS paths
  to be excluded from SharePoint''s ISAPI filters when SharePoint and MCMS are configured
  on the same virtual server within Internet Information Services (IIS) or MCMS will
  not operate correctly.


  All command-line utilities included in the MCMS Connector can be found in the following
  directory: C:\Program Files\MCMS Connector for SharePoint Technologies\WSS\Bin.


  ## MCMS Connector Sample Data, Project, and Documentation


  If you choose to install the sample data when you install the Connector, the installation
  procedure will automatically import all data from an SDO file into your MCMS site.


  In addition, the CmsSharePointConnector sample project will be installed, which
  contains the MCMS templates and other controls necessary for the templates and postings
  in the sample data imported from the SDO.


  If you need to import the sample MCMS data later, you can find the SDO file in the
  same directory as the sample project: C:\Program Files\Microsoft Content Management
  Server\Sample Data\CmsSharePointConnector.


  Finally, a compiled help file containing technical details and documentation on
  the MCMS Connector will be installed in the following directory: C:\Program Files\MCMS
  Connector for SharePoint Technologies\Docs.


  ## Summary


  This short appendix has covered the installation and use of Connector for SharePoint
  Technologies. We''ve looked at the tools and settings relevant to websites that
  wish to combine content from SharePoint and MCMS.


  Now the guest account has been created, let''s assign it to an appropriate MCMS
  subscriber rights group.


  - 1. Open Site Manager and log in using an MCMS administrator account.

  - 2. Click the User Roles icon on the left panel.

  - 3. In the User Roles panel, click Subscribers.

  - 4. A subscriber rights group named Guests was imported as part of the import process
  earlier. Right-click on the Guests rights group and select Properties.

  - 5. Click on the Group Members tab and choose Modify....

  - 6. Add the new MCMSGuest account to the Guests rights group.

  - 7. Close all open dialogs, and close Site Manager.


  ## Checking the Server Configuration


  Ensure that the SCA (Server Configuration Application) is configured as follows:


  | General |  |

  |---|---|

  | URL Format | Hierarchical |

  | Map Channel Names to Host Header Names | Yes |

  | Security |  |

  | Allow Guests on Site | Yes |

  | Guest Login Account | ComputerName\MCMSGuest |


  ## Setting www.tropicalgreen.net to Execute Locally


  The URL of Tropical Green''s website is www.tropicalgreen.net. We need this address
  to work when running the MCMS web application from the local computer. To do so,
  we need to add the address to the computer''s hosts file.


  - 1. Use Notepad to open the hosts file in C:\Windows\system32\drivers\etc\.

  - 2. In the hosts file, enter www.tropicalgreen.net below localhost. Give it an
  IP address of 127.0.0.1. Doing so automatically loops www.tropicalgreen.net back
  to your computer.

  - 3. Save and close the hosts file.


  ```

  127.0.0.1    localhost

  127.0.0.1    www.tropicalgreen.net

  ```

