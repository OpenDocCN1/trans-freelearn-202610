  \ `true`，因为我们希望在作者表格中显示图标。\n\n收集必要数据后，它将它们作为 `WBC_LaunchAttachmentGallery()` 函数的参数组合在一起。现在添加\
  \ `GetAttachmentDialog()` 方法：\n\n# 有用的占位符控件\n\n```csharp\nprivate string GetAttachmentDialog(int\
