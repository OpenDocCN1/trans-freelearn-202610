  Let's see the move in action. First, if you haven't already done so, build the CMSExplorer\
  \ project, then:\n\n1. Open http://localhost/CMSExplorer.\n2. Click on MyNewChannel.\n\
  3. Click on the Edit button of the MyPosting posting and click Move.\n4. In the\
  \ Move Posting dialog, enter /Channels/MyNewChannel2/ as the destination channel.\
  \ Click Move Posting.\n\nAnd MyPosting gets moved from MyNewChannel to MyNewChannel2.\n\
  \nMoving postings does not modify any of their placeholder or property values. However,\
  \ if there are moderators assigned to the destination channel, the posting would\
  \ be in a \"Waiting For Moderator Approval\" state. At the same time, the LastModifiedBy\
  \ and LastModifiedDate properties of the moved posting are modified to indicate\
  \ the person who executed the move and the date and time that the operation was\
  \ performed.\n\n## Summary\n\nIn this chapter we used the MCMS Publishing API (PAPI)\
  \ to add additional functionality to our CMS Explorer management application. We\
  \ demonstrated how the PAPI can be used to create new channels and postings as well\
  \ as copying or moving postings from one channel to another channel. In the next\
  \ chapter, we will look at the ability to manage templates, template galleries,\
  \ resources, and resource galleries with the PAPI as we continue to enhance the\
  \ CMS Explorer.\n"
- "# 3 Managing Templates, Template Galleries, and Resources\n\nIn this chapter, we\
  \ turn our attention to three main MCMS object types—templates, template galleries,\
  \ and resources. We will enhance the CMS Explorer (developed in Chapter 1) to manage\
  \ these objects using the MCMS Publishing API (PAPI).\n\n### Managing Template Galleries\
  \ and Templates\n\nOut of the box, you can choose to manage template galleries and\
  \ templates using either Site Manager or Template Explorer, which might be OK if\
  \ you are using Visual Studio .NET as your development tool (as recommended). A\
  \ compelling reason to write an administrative module to manage template galleries\
  \ and templates is to work with them without having to open VS.NET. We have found\
  \ this particularly useful when attempting to work in an environment where VS.NET\
  \ is not installed such as on a production or a staging server. Or perhaps business\
  \ requirements call for certain actions to be performed when a template gallery\
  \ or template is created. Whatever the occasions may be, you may need to modify\
  \ template gallery and template properties, placeholder definition and custom property\
  \ collections through code.\n\nThe PAPI offers a wide range of methods and properties\
  \ to work with template galleries and templates. We explore the most frequently\
  \ used methods in this section, beginning with the creation of template galleries.\n\
  \n### Creating Template Galleries\n\nTemplate galleries can be created from both\
  \ Site Manager and Template Explorer. Now we will show you how we can create them\
  \ from code. Let's add a Create Template Gallery dialog to the CMS Explorer interface.\n\
  \n1. Add a new web form to the project with the name CreateTemplateGallery.aspx.\n\
  2. In Design view, drag and drop styles.css from Solution Explorer onto the web\
  \ form.\n3. Toggle to HTML view. Insert a table with five rows. Code it in the same\
  \ way as shown overleaf. A level-1 heading with the text Create Template Gallery\
  \ forms the first row. The rest of the table consists of text labels and temporary\
  \ markers indicating where the controls should go later.\n\n```html\n<table>\n<tr>\n\
  <td colspan=\"2\">\n<h1>Create Template Gallery</h1>\n<h2>Parent Template Gallery:\n\
  (Add Literal for displaying the path here)\n</h2>\n</td>\n</tr>\n<tr>\n<td>Name:</td>\n\
  <td>(Add the text box for the Name here)</td>\n</tr>\n<tr>\n<td>Description:</td>\n\
  <td>(Add the text box for the Description here)</td>\n</tr>\n<tr>\n<td colspan=\"\
  2\">\n(Add the Label for displaying error messages here)\n</td>\n</tr>\n<tr>\n<td\
  \ colspan=\"2\" align=\"right\">\n(Add the Create Gallery button here)\n<INPUT type=\"\
  button\" value=\"Close\" onclick=\"javascript:window.close();\">\n</td>\n</tr>\n\
  </table>\n```\n\n4. Switch back to Design view, drag the following controls from\
  \ the Web Forms section of the Toolbox onto the form and delete the text markers.\
  \ Arrange them as shown in the following diagram. Template galleries only have Name\
  \ and Description properties to modify.\n\n| Control | Property | Value |\n| ---\
  \ | --- | --- |\n| Literal | ID | litParentGallery |\n| TextBox | ID | txtName |\n\
  | TextBox | ID | txtDescription |\n|  | Rows | 3 |\n|  | TextMode | MultiLine |\n\
  | Label | ID | lblErrorMessage |\n|  | Text | (empty string) |\n| Button | ID |\
  \ btnCreate |\n|  | Text | Create Gallery |\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_83_0.png)\n\
  \n5. Add the Microsoft.ContentManagement.Publishing namespace to the code-behind\
  \ file:\n\n```csharp\n// MCMS API\nusing Microsoft.ContentManagement.Publishing;\n\
  \nnamespace CmsExplorer\n{\n    // ... code continues ...\n}\n```\n\n6. In the Page_Load()\
  \ event handler, we get the GUID of the parent template gallery from the CMSObjectGuid\
  \ querystring parameter, and pass it to the Searches.GetByGuid() method to get a\
  \ reference to the gallery itself.\n\n```csharp\nTemplateGallery parentGallery;\n\
  CmsHttpContext cmsContext;\n\nprivate void Page_Load(object sender, System.EventArgs\
  \ e)\n{\n    cmsContext = CmsHttpContext.Current;\n    lblErrorMessage.Text = String.Empty;\n\
  \    string cmsObjectGuid = String.Empty;\n    if (Request.QueryString[\"CMSObjectGuid\"\
