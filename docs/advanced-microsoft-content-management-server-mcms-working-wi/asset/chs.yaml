  \       CmsApplicationContext cmsContext = new CmsApplicationContext();\n\n    \
  \        // We need to get the identity of the current user\n            WindowsIdentity\
  \ ident = System.Web.HttpContext.Current.User.Identity as WindowsIdentity;\n\n \
  \           // Authenticate into update mode\n            cmsContext.AuthenticateUsingUserHandle(ident.Token,\
  \ PublishingMode.Update);\n\n            // Set the private variable\n         \
  \   _CurrentCmsContext = cmsContext;\n        }\n\n        // Return the private\
  \ variable\n        return(_CurrentCmsContext);\n    }\n}\n\n#endregion\n```\n\n\
  通过调用方法 AuthenticateUsingUserHandle() 对 CmsApplicationContext 进行身份验证的过程仅在使用 Windows\
  \ 身份验证时才有效。\n\n接下来我们将定义一个属性来加载 Microsoft.ContentManagement.Publishing.Posting 对象，该对象对应于当前的\
