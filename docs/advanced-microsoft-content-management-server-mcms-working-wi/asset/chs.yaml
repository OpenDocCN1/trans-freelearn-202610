  \n在 *Tip #1: How to Revert a Posting to a Previous Version* 中，我们编写了一个 `CopyPostingContent()`\
  \ 方法，用于将内容从源帖子复制到目标帖子。在本例中，我们的源是模板要更改的原始帖子；目标是基于新模板的新帖子。代码大致相同，只是这次目标占位符是作者从下拉列表中挑选出来的。将\
  \ `CopyPostingContent()` 方法直接添加到 `SwitchTemplate()` 方法下方。\n\n```csharp\npublic void\
  \ CopyPostingContent(Posting source, Posting destination)\n{\n    // Copy all placeholder\
  \ content from the old version and create a new\n    // version with that content\n\
  \    foreach (Placeholder sourcePH in source.Placeholders)\n    {\n        // Look\
  \ for the value in the corresponding DropDownList in the dialog\n        string\
  \ destinationPHName = Request.Form[\"ddl\" + sourcePH.Name];\n\n        // do not\
  \ copy placeholder if the user chose \"None\"\n        if (destinationPHName !=\
  \ \"\")\n        {\n            Placeholder destinationPH = destination.Placeholders[destinationPHName];\n\
  \n            // we do not bother about how the placeholder internally modifies\
  \ the\n            // content before it gets displayed. Even if it is encrypted\
  \ or\n            // whatever -- we just copy the content from the previous version\
  \ as is\n            if (destinationPH != null)\n            {\n               \
  \ destinationPH.Datasource.RawContent = sourcePH.Datasource.RawContent;\n      \
  \      }\n        }\n    }\n}\n```\n\n`CopyPostingCustomProperties()` 方法与我们在 *Tip\
  \ #1: How to Revert a Posting to a Previous Version* 中之前编写的完全相同。将它直接添加到 `CopyPostingContent()`\
  \ 方法下方。\n\n```csharp\npublic void CopyPostingCustomProperties(Posting source, Posting\
  \ destination)\n{\n    // Copy all custom property values from the source to the\
  \ destination.\n    foreach (CustomProperty customProp in source.CustomProperties)\n\
  \    {\n        if (destination.CustomProperties[customProp.Name] != null)\n   \
  \     {\n            try\n            {\n                destination.CustomProperties[customProp.Name].Value\
  \ =\n                    customProp.Value;\n            }\n            catch\n \
  \           {\n                throw (new Exception(\"Failed to copy custom property\
  \ value for \"\n                                    + \"Custom Property: \" + customProp.Name));\n\
  \            }\n        }\n    }\n}\n```\n\n对话框已完成。接下来，我们将在 Web Author Console 中添加一个\
  \ Change Template 按钮，以在新窗口中打开此对话框。\n\n## 向 Web Author Console 添加 Change Template\
  \ 按钮\n\n向 Web Author Console 添加新按钮已在 *Tip #1: How to Revert a Posting to a Previous\
  \ Version* 中详细说明。让我们为更改帖子模板创建一个类似的按钮。\n\n向你的 Web 项目添加一个名为 `SwitchTemplateButton.cs`\
  \ 的类文件（如果你正在使用 Tropical Green 项目，请将其添加到 `ConsoleButtons` 文件夹）。\n\n在命名空间声明上方，添加所需的命名空间。\n\
  \n```csharp\nusing System;\n\nusing Microsoft.ContentManagement.Publishing;\nusing\
  \ Microsoft.ContentManagement.WebControls.ConsoleControls;\n\nnamespace TropicalGreen.ConsoleButtons\n\
  {\n    . . . code continues . . .\n}\n```\n\n由于对话框以新窗口打开，按钮将继承自 `BaseNewWindowAction`\
  \ 类。\n\n```csharp\npublic class SwitchTemplateButton : BaseNewWindowAction\n{\n\
  }\n```\n\n在 `SwitchTemplateButton()` 构造函数中，将按钮的标签设置为 Switch Template。\n\n```csharp\n\
  public SwitchTemplateButton()\n{\n    // Set the text of the button\n    this.Text\
  \ = \"Switch Template\";\n}\n```\n\n接下来，我们将在重写的 `UrlNewWindow` 属性中设置 Switch Template\
  \ 对话框的 URL。在我们的示例中，对话框的 URL 为 `/Dialogs/ChangeTemplate.aspx`。你需要根据 ChangeTemplate.aspx\
  \ 文件在网站中的位置调整此值。将 `UrlNewWindow` 属性附加到代码中。\n\n```csharp\npublic override string\
  \ UrlNewWindow\n{\n    get\n    {\n        // Set the URL of the new window\n  \
  \      return Page.Request.ApplicationPath + \"/Dialogs/ChangeTemplate.aspx?\"\n\
  \             + CmsHttpContext.Current.Posting.QueryStringModelUpdate;\n    }\n\
  }\n```\n\n\n\n该按钮仅在作者有权在当前频道中创建新发布，且发布未连接时才应可用。在 UrlNewWindow 属性的正下方添加重写的 Available\
  \ 属性。\n\n```\npublic override bool Available\n{\n    get\n    {\n        Channel\
  \ currentChannel = CmsHttpContext.Current.Channel;\n        Posting currentPosting\
  \ = CmsHttpContext.Current.Posting;\n\n        if (currentPosting != null)\n   \
  \     {\n            return (currentChannel.CanCreatePostings && currentPosting.CanDelete\
  \ && !currentPosting.IsConnected);\n        }\n        else\n        {\n       \
  \     return false;\n        }\n    }\n}\n```\n\n> 在此示例中，我们假设发布不会在连接的模板之间切换。在连接的模板之间切换是一个直接的任务：只需基于你想要切换到的连接模板创建一个新的连接发布，然后删除原始发布即可。\n\
  \n最后，我们将重写 ActionJavascript 属性，以提供在新窗口中打开对话框的客户端脚本。在 Available 属性的下方添加 ActionJavascript\
  \ 属性。\n\n```\npublic override string ActionJavascript\n{\n    get\n    {\n     \
  \   if (this.Available)\n        {\n            return \"WBC_openWindowOnFocus('\"\
  \ + this.UrlNewWindow + \"', '\" + \"WBC_winChangePosting\", \" + \" WBC_UseDefaultSizing(window.top))\"\
  ;\n        }\n        else\n        {\n            return \"\";\n        }\n   \
  \ }\n}\n```\n\n控制台按钮已完成。保存并编译项目。\n\n在将按钮添加到控制台之前，我们需要确保页面顶部存在注册项目文件库（在我们的情况下，将是\
  \ tropicalgreen）的指令。否则，请添加它：\n\n```\n<%@ Register TagPrefix=\"TropicalGreenConsole\"\
  \ Namespace=\"TropicalGreen.ConsoleButtons\" Assembly=\"tropicalgreen\" %>\n```\n\
  \n将名为 DeleteWithRecycle.cs 的类文件添加到 MCMS 项目中。如果你正在使用下载的 Tropical Green 项目，请将该文件添加到\
  \ ConsoleButtons 文件夹中。\n\n该类需要使用以下命名空间中的对象：\n\n```\nusing System;\nusing System.Web;\n\
