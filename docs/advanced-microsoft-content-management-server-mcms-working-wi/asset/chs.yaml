  \n### 总结\n\n在本章中，我们探讨了如何验证 MCMS 占位符控件。我们首先说明了 ASP.NET 附带的验证 Web 控件不能用于 MCMS 占位符控件。为了克服这一限制，我们构建了三个验证控件：一个用于\
  \ HTMLPlaceholderControl，第二个用于 SingleImagePlaceholderControl，第三个用于 SingleAttachmentPlaceholderControl。我们演示了如何使用客户端脚本技术执行简单的空占位符检查。我们还说明了通过构建自定义占位符控件，服务器端验证是可行的。本章讨论的方法可以扩展，以满足更复杂和更严格的验证要求，从检查电话号码、邮政编码或电子邮件地址是否为有效格式，到根据外部数据库中存储的内容进行验证。\n"
- "# 10 暂存静态页面\n\n如今的网站动态且功能多样。动态站点相比静态站点具有许多优势。使用 MCMS，您可以个性化并配合 PAPI 工作，以创建真正交互式、个性化的用户体验。例如，我们已经看到了如何根据个人访问权限隐藏或显示导航结构。事实上，内容更新如此频繁，交互需求如此之高，以至于像\
  \ MCMS 这样的内容管理系统会即时组装页面。最多也只是将页面的快照缓存在内存或服务器硬盘上，以加速页面交付过程。缓存会在经过一定时间段后或内容发生变化时失效。没有任何东西会永远冻结：只会提供新鲜内容。\n\
  \n在一本关于创建动态站点的书中，你可能会觉得奇怪，这一整章都在讲述暂存静态页面。事实是，尽管技术需求日新月异，有时也需要稍微放慢脚步。整个网站的静态副本在以下情况下可能很有用：\n\
  \n-   创建页面以打包到 CD ROM 等离线媒体上。用户指南和帮助文件通常以电子文档的形式包含在盒装软件的 CD 中。甚至 Microsoft 帮助文件（或\
  \ CHM 文件）本身也是由静态 HTML 文件构建的。\n-   为存档或备份目的拍摄网站快照。\n-   创建静态文件，供 Index Server 或其他需要物理文件存在的搜索引擎建立索引。\n\
  -   在多台服务器之间共享内容。是的，您可以在其他服务器上安装 MCMS，甚至可以使用 Web 服务来联合内容。然而，有时最简单的解决方案就是最好的——只需制作共享内容的静态副本，并使用良好的文件复制技术（如\
  \ FTP）来传输它们（从而避免获取更多生产 MCMS 许可证的需要）。\n\n如果需要生成 MCMS 网站的静态版本，有两种可用选项：\n\n-   使用 MCMS\
  \ 2002 附带的 Site Stager 实用程序。\n-   编写一个自定义暂存工具，为每个页面生成静态快照。\n\n> **重要说明：** Site Stager\
  \ 仅基于 ASP 模板暂存来自发布的静态页面。它不适用于基于 ASP.NET 模板的发布。\n\n\n\n\n## 安装 Site Stager\n\n使用\
  \ Site Stager 的第一步是安装它。要查找 Site Stager 是否已安装在您的机器上，请选择 开始 | 程序 | Microsoft Content\
  \ Management Server。查看是否列出了 Site Stager 的条目。\n\n否则，请按照以下步骤安装 Site Stager：\n\n- 1.\
  \ 从控制面板中选择 添加/删除程序。\n- 2. 从当前已安装程序的列表中选择 Microsoft Content Management Server。单击更改。\n\
  - 3. 在程序维护对话框中，选择修改程序功能。\n- 4. 在自定义设置对话框中，选择 Site Stager 组件。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_339_0.png)\n\
  \n- 5. 单击下一步以确认您的选择。\n- 6. 单击安装以开始安装过程。\n- 7. 安装完成后，单击完成以关闭对话框。\n\n现在开始菜单中会出现 Site\
