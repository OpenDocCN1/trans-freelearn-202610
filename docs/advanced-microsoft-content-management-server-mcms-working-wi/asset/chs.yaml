  \     {\n```\n\n## 对 RSS Feed 生成器的增强\n\n- 作者姓名—该解决方案可以通过与 Active Directory 集成来检索作者的完整姓名，从而得到增强。\n\
  - 基于频道的 feed 生成—将频道属性设置为配置参数以供 feed 使用，并从帖子或频道渲染脚本生成它。\n- 存储历史记录—组织可能需要保留其网站上所有历史内容的副本。RSS\
  \ feed 目前每 5 分钟可能发生变化一次（当缓存过期时）。为了使 RSS feed 充当出现在页面修订历史记录中的内容，可以在保存时发出对 feed 的请求，并将生成的\
  \ HTML 保存到 HtmlPlaceholder 中。然后可以编写一个自动更新工具，在计划的时间，例如每 60 分钟，更新聚合的 feed。\n\n## 对\
  \ RSS 聚合占位符控件的增强\n\n- 设计—RSS 聚合控件仅具有基础的外观和感觉，可以通过向 div 元素添加 class 属性来轻松增强，以应用页面\
  \ CSS 样式表中定义的样式。\n\n## 总结\n\n我们现在已为 Tropical Green 网站提供了通过 RSS 同步和聚合内容的能力。内容作者将能够指定要在特定帖子上聚合和显示的\
  \ RSS feed。最终用户现在有机会订阅我们 MCMS 网站上的 RSS feed，以便在内容发生变化时自动收到通知，而无需浏览网站。此外，MCMS 网站现在可以从互联网上的其他服务器聚合\
  \ RSS feed 的内容并显示其自身网站的部分内容。\n\n在 Current Version 标题下方，我们将添加包含指向帖子工作版本的超链接的表格。切换到设计视图。从菜单栏中选择\
  \ Table | Insert | Table... 并插入一个包含一行两列的表格。在左侧列的表格单元格中，添加单词 Name。将 HyperLink 控件（来自工具箱的\
  \ Web Forms 部分）拖放到右侧单元格中。为 HyperLink 指定 ID aName（请注意，我们已在前面加上字母 'a'），并将其 Text 属性设置为空字符串。\n\
  \n接下来，将 DataGrid 拖动到 Available Revisions 标题下方。DataGrid 将列出帖子的所有修订。将 DataGrid 的 ID\
  \ 设置为 dgPageRevisionsList，并将 AutoGenerateColumns 属性设置为 false。切换到 HTML 视图并向网格添加四列。第一列显示该特定版本的帖子名称，第二列显示修订日期，第三列是链接到预览页面的超链接，第四列是触发页面还原过程的按钮。\n\
  \n```xml\n<asp:DataGrid ID=\"dgPageRevisionsList\" Runat=\"server\"\nAutoGenerateColumns=\"\
  False\">\n<Columns>\n<asp:BoundColumn DataField=\"Name\" HeaderText=\"Name\"></asp:BoundColumn>\n\
  <asp:BoundColumn DataField=\"RevisionDate\" HeaderText=\"Revision Date\">\n</asp:BoundColumn>\n\
  <asp:HyperLinkColumn Text=\"Preview\" Target=\"CMSPageRevertPreviewWindow\" DataNavigateUrlField=\"\
  Url\">\n</asp:HyperLinkColumn>\n<asp:ButtonColumn Text=\"Revert\" CommandName=\"\
  RevertTo\">\n</asp:ButtonColumn>\n</Columns>\n</asp:DataGrid>\n```\n\n切换到设计视图。将两个\
  \ CheckBox 控件拖动到 DataGrid 上方。将第一个 CheckBox 的 ID 设置为 chkRevertContent，其 Text 属性设置为\
  \ Revert Placeholder Content。第二个 CheckBox 的 ID 为 chkRevertCustomProperties，Text\
  \ 值为 Revert Custom Property Values。将两个 CheckBox 的 Checked 属性都设置为 true。\n\n拖动一个 Label\
  \ 控件并将其放置在 DataGrid 下方。将 Label 的 ID 设置为 lblMessage，其 Text 属性设置为空字符串。我们将在此处显示来自应用程序的消息（例如错误）。\n\
  \n您应该看到以下内容：\n\n\n\nrevision dates. 我们希望以降序显示列表，最新的修订排在最前，因此将布尔值设为 false。\n\n获取并排序修订集合后，我们将其绑定到\
  \ DataGrid，dgPageRevisionsList。所有这些操作都在 GetListOfRevisions() 方法中完成，该方法添加在 Page_Load()\
