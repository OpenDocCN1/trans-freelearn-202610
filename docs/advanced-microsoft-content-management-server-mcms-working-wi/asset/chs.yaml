  \n\n\n\n\n## The SavePosting() Web Method\n\n让我们再创建一个 Web 方法 SavePosting()，它将接受一个\
  \ LightweightPosting 对象作为参数并将其内容保存到 MCMS。将以下代码添加到 authoring.asmx.cs 文件中并重新生成解决方案：\n\
  \n```\n/// <summary>\n/// Save a lightweight posting object to MCMS\n/// </summary>\n\
  /// <param name=\"_Posting\">LightweightPosting object to save</param>\n[WebMethod]\n\
  public void SavePosting(LightweightPosting _Posting)\n{\n    // Save the posting\n\
  \    _Posting.Save();\n}\n```\n\nSavePosting() Web 方法不能像我们对 GetPosting() 所做的那样从浏览器进行测试，因为它需要一个复杂数据类型（LightweightPosting）作为参数。我们将在稍后创建的\
  \ InfoPath 表单中通过 InfoPath 表单来测试 SavePosting()。\n\n## Preparing the InfoPath Environment\n\
  \n此时，您需要在计算机上安装 Microsoft InfoPath 2003 和 Office 2003 Service Pack 1（SP1）。如果您的 Office\
  \ 2003 安装尚未应用 SP1，您可以从以下位置下载：\n\nhttp://www.microsoft.com/downloads/details.aspx?FamilyID=9c51d3a6-7cb1-4f61-837e-5f938254fc47\n\
  \n您还应从以下位置下载 InfoPath 2003 SDK 以供进一步参考：\n\nhttp://www.microsoft.com/downloads/details.aspx?FamilyId=351F0616-93AA-4FE8-9238-D702F1BFBAB4\n\
  \n要验证是否已安装 Service Pack 1，请启动 InfoPath 并单击 Help | About Microsoft Office InfoPath。最新服务包的名称会打印在产品版本号旁边。\n\
  \n## Creating the InfoPath Document\n\nInfoPath 文档在创建 InfoPath 表单模板并将其连接到 Web 服务以进行数据检索和提交之前，需要一个在\
  \ InfoPath 中设计的 InfoPath 模板（.xsn）。按照以下步骤创建一个将连接到我们刚刚创建的 Web 服务的 InfoPath 模板：\n\n\
  - 1. 启动 Microsoft InfoPath 2003。\n- 2. 在 Fill Out a Form 窗口左侧，选择 Design a Form。如果\
  \ Fill Out a Form 窗口未打开，请选择 File | Design a Form。\n- 3. 从右侧的任务窗格中，选择 New from Data\
  \ Connection。\n- 4. 在 Data Connection Wizard 中，选择 Web Service 并单击 Next。\n- 5. 选择\
  \ Receive and submit data 并单击 Next。\n\n现在让我们为此表单添加一个标题。单击 Click to add title 标签并输入\
  \ MCMS Authoring InfoPath Form。选择文本并使其加粗。\n\n最后，我们将在标题下方输入一些简要说明。单击 Click to add\
  \ form content 标签上的任意位置。在提供的空间中输入 This InfoPath form can retrieve and update existing\
  \ MCMS postings。\n\n## Creating the Controls in InfoPath\n\n通过从 XML Web 服务生成文档，InfoPath\
  \ 允许我们在几分钟内而不是在其他环境中花费数小时或数天创建一个功能齐全的用户界面。为了允许用户输入帖子的路径并查询 Web 服务，请按照以下步骤操作：\n\n\
  - 1. 在任务窗格中，选择 Data Source 类别。\n- 2. 展开 `myFields`、`queryFields` 和 `s0:GetPosting`。\n\
  - 3. 将 `strPath` 元素拖到表单上标记为 \"Drag query fields here.\" 的区域。\n- 4. 将标签 `strPath`\
  \ 更改为 \"Posting To Load\"（例如 `/Channels/www.TropicalGreen.net/PlantCatalog/AloeVera`）。\n\
  - 5. 将 Run Query 按钮拖到 `strPath` 文本框下方，并删除 Run Query 按钮之前多余的行中断。\n- 6. 选择布局表的底部边框并将其向上拖动以减小表的高度。\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_397_0.png)\n\n我们的表单现在允许用户输入帖子的路径，该路径传递给\
  \ ASP.NET Web 服务，后者返回一个序列化的 LightweightPosting 对象。\n\n让我们创建显示帖子属性并允许编辑的用户界面。\n\n\
  - 1. 在 Data Source 窗格中，展开 `dataFields` 和 `s0:GetPostingResponse`。\n- 2. 将 `GetPostingResult`\
  \ 节点拖到 \"Drag data fields here\" 标签上。\n- 3. 将出现一个上下文菜单，列出可以执行的操作。对于此节点，我们将创建带控件的部分，因此单击\
  \ Section with Controls。\n- 4. 现在已生成以下表单。现在不要担心布局，我们将在下一节中使其更易于使用。\n\n![](img/442e26bf28f2df81fbf8dff3478f88e3_398_0.png)\n\
  \n![](img/442e26bf28f2df81fbf8dff3478f88e3_398_1.png)\n\n## Cleaning Up the Generated\
  \ Form\n\n当我们选择 Section with Controls 时，InfoPath 生成的界面完全可用，但美观性不佳，也不包含所有正确的控件配置。我们可以通过简单地将控件拖放到不同区域来重新排列表单上的控件。\n\
  \n首先，让我们更好地排列所有常见的帖子和模板属性。\n\n- 1. 将光标放在最上面的 Name: 标签左侧（标题正下方的标签），从 Table 菜单中选择\
