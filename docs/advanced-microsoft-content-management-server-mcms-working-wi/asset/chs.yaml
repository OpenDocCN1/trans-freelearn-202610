  \n签入模板并构建 TropicalGreen 项目。我们需要做的最后一件事是使用新的 Events 模板创建一个新的帖子。虽然它不会做太多，但它将帮助我们在构建占位符控件的每个部分时看到我们的控件变得活跃起来。通过浏览到\
