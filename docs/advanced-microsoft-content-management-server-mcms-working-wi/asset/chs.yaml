  \ 例程，以使用附件的图标、显示文本和 URL 更新作者表格。棘手的部分是这样做而不修改原始代码（否则我们将跨越 Microsoft 支持边界，而且不修改原始文件可以防止代码在将来应用服务包时被覆盖）。作为变通方法，我们将创建一个修改版本的方法并将其添加到页面中。当\n\
  \n浏览器看到两个具有相同名称的 JavaScript 方法时，一个定义在页面内，另一个定义在单独的 *.js 文件中，浏览器将选择运行页面中嵌入的那个。\n\n\
  首先，让我们看一下下面所示的原始 WBC_setThinEditIEAttachment() 例程。它接受三个输入参数：\n\n- 正在接受附件的占位符的名称\n\
  - 已上传附件的 URL\n- 附件的显示名称\n\n它使用附件文件的 URL 和显示名称来构建 HTML 锚标记。锚标记通过调用占位符 DOM 的 insertHtml()\
  \ 方法添加到占位符中。现在不必担心输入代码。我们稍后将编写一个服务器端函数来动态生成此脚本。\n\n```\nfunction WBC_setThinEditIEAttachment(strPhName,\
  \ strURL, strDispText)\n{\n    var strMyDispText = strDispText;\n    if (strMyDispText\
  \ == \"\")\n    {\n        strMyDispText = strURL;\n    }\n\n    document.all[\"\
  NCPHRICH_\" + strPhName].insertHtml(\"<a href=\\\"\" + strURL\n                \
  \                             + \"\\\">\" + strMyDispText + \"</a>\");\n}\n```\n\
  \n虽然 WBC_setThinEditIEAttachment() 方法对于常规 HtmlPlaceholderControls 来说运行完美，但为了使其在\
