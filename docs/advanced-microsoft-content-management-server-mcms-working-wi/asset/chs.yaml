  \n## 引言\n\n继 *Building Websites with Microsoft Content Management Server*（Packt\
  \ Publishing，2005 年 1 月，ISBN 1-904811-16-7）之后，本书将 MCMS 开发提升到更高水平，无论是功能还是集成度。像其前作一样，本书包含大量代码示例和从未公开过的\
  \ MCMS 秘诀。\n\nMicrosoft Content Management Server 2002 是一个动态 Web 发布系统，可帮助您快速且经济地构建网站。MCMS\
  \ 提供管理、创作和数据管理功能，而您提供网站界面、逻辑和工作流。本书中还介绍了 Microsoft SharePoint Portal Server（SPS）。SPS\
  \ 2003 使企业能够部署智能门户，无缝连接用户、团队和知识，以便人们能够利用跨业务流程的相关信息，从而更高效地工作。\n\n您已经掌握了 MCMS 的基础知识，并搭建了自己的\
  \ MCMS 安装环境。但您只触及了表面。本书是您充分利用 MCMS 和 SPS 投资的门户，也是让这两个应用程序协同工作以提供卓越内容交付和易于维护性的途径。\n\
  \n### 本书涵盖内容\n\n*第 1 章* 通过构建 **CMS Explorer** 管理工具来管理 MCMS 网站，展示了 MCMS 发布 API（PAPI）的强大功能。*第\
  \ 2 章* 在 CMS Explorer 的基础上增加了管理频道和发布项的能力。*第 3 章* 通过 PAPI 查看模板、模板库和资源的创建、提交、复制、移动和删除。\n\
  \n在 *第 4 章* 中，您将学习如何为搜索索引准备发布项。我们探讨了几种可以提高搜索结果准确性并优化搜索引擎的技巧。\n\nSharePoint Portal\
  \ 技术通过提供协作、文档库和搜索功能来补充 MCMS，从而增强 MCMS 强大的发布工作流。*第 5 章* 指导您使用 SharePoint Portal Server\
  \ 为 MCMS 站点添加搜索功能，无论是通过 MCMS Connector for SharePoint Technologies 还是自行构建解决方案。\n\
  \n*第 6 章* 演示了如何使用 MCMS Connector for SharePoint 构建自己的组件，以在 MCMS 和 SharePoint 之间共享内容。*第\
  \ 7 章* 展示了如何构建 Web Parts，将 MCMS 内容集成到 SharePoint 门户站点中。\n\n*第 8 章* 讨论了五个自定义占位符控件，它们提供了默认控件中没有的、经常被请求的特性：日期时间选择器占位符控件、允许多个附件的占位符控件、图像轮播占位符控件、用于存储各种\
  \ HTML 标签的占位符控件，以及 DataGrid 占位符控件。\n\n内容验证是许多 MCMS 实现中的关键需求。第 9 章探讨了如何将 ASP.NET\
  \ 验证技术应用于每个开箱即用的占位符控件。\n\n静态页面通常用于直接邮件、帮助文件，甚至用于归档目的。第 10 章讨论了可用于创建发布项静态快照的几种技术。\n\
  \n创作体验并不总是需要通过浏览器进行。第 11 章详细介绍了维护内容的一种对作者友好的方式。在本章中，我们利用 InfoPath 的强大功能，快速创建 GUI，允许作者直接从\
  \ Microsoft Word 提交内容，并借助 MCMS Web Services。\n\n自 2002 年 MCMS 发布以来，许多技术已经发生了变化。使用\
  \ RSS 进行网站聚合已成为常态，为此，第 12 章指导您完成创建网站最近更改的动态 RSS Feed 的步骤。\n\n最后，第 13 章提供了大量关于 MCMS\
  \ 的内部技巧和窍门，以及常见 MCMS 问题的解决方案，包括如何将发布项恢复到以前版本、更改发布项的模板、构建回收站，以及使用站点部署 API 导出资源库项目等宝贵技巧。\n\
  \n### 阅读本书所需条件\n\n本书面向具备扎实 C# 基础的 ASP.NET 开发人员。要使用本书，您需要能够访问以下资源：\n\n- Visual Studio\
  \ .NET Professional 或更高版本（2002 或 2003 版本）。\n- Microsoft Content Management Server\
  \ 2002 Developer 或 Enterprise 版。您也可以使用 Standard 版，但请注意某些功能将不可用。Enterprise 版的 120\
  \ 天评估版可在 http://www.microsoft.com/cmserver 获取。\n\n要安装和运行 Microsoft Content Management\
  \ Server 2002，您需要以下条件：\n\n- .NET Framework 1.0 或 1.1。\n- 以下操作系统之一：Windows Server\
  \ 2003、Windows 2000 Professional、Windows 2000 Server 或 Windows XP Professional。\n\
  - SQL Server 2000 Developer 或 Enterprise 版的安装。\n\n部分章节使用了 Microsoft SharePoint Portal\
  \ Server 2003。对于这些章节，您需要：\n\n- .NET Framework 1.1。\n- Windows Server 2003。\n- SQL\
  \ Server 2000 Developer 或 Enterprise 版的安装。\n- SharePoint Portal Server 2003 的安装。120\
  \ 天评估版可在 http://www.microsoft.com/sharepoint 获取。\n\n\n\n\n\n## 约定\n\n在本书中，你会看到多种文本样式，用来区分不同类型的信息。本节提供了这些样式的示例，并解释了它们的含义。\n\
