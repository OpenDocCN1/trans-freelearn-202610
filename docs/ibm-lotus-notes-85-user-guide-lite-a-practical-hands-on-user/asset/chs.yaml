  当我们发送消息时，很多时候希望以特定方式对其进行格式化。Lotus Notes 中有多种格式选项。请注意，无论在邮件中可以进行的何种格式化，都可以在 Lotus
  Notes 应用程序中具有富文本字段的日历条目、待办事项和文档中执行。


