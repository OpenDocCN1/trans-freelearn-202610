  ## Shortcut keys in Lotus Notes


  ## Lotus Notes 中的快捷键


  The Ctrl key on our keyboard comes in quite handy when we are editing text within
  Lotus Notes. Following are some common usages of the Ctrl key within Lotus Notes:


  在 Lotus Notes 中编辑文本时，键盘上的 Ctrl 键非常实用。以下是 Lotus Notes 中 Ctrl 键的一些常见用法：


  | Keyboard shortcuts | Description |

  | :--- | :--- |

  | Ctrl+B | Selected text is made bold |

  | Ctrl+I | Selected text is made italics |

  | Ctrl+U | Selected text is underlined |

  | Ctrl+Z | Undo option |

  | Ctrl+C | Selected text is copied |

  | Ctrl+V | Selected text is pasted |

  | Ctrl+X | Selected text is cut |


  | 键盘快捷键 | 说明 |

  | :--- | :--- |

  | Ctrl+B | 所选文本设置为粗体 |

  | Ctrl+I | 所选文本设置为斜体 |

  | Ctrl+U | 为所选文本添加下划线 |

  | Ctrl+Z | 撤销选项 |

  | Ctrl+C | 复制所选文本 |

  | Ctrl+V | 粘贴所选文本 |

  | Ctrl+X | 剪切所选文本 |


  ## Further formatting options


  ## 更多格式选项


  If we click on the Create menu, we can see more formatting options. We can add pictures,
  page breaks, a horizontal rule (which is similar to a thick line), sections that
  collapse text under a heading, computed text that allows you to add animated text,
  hotspots that can link to URLs or file links, tables, images, and objects.


  如果单击 创建 菜单，可以查看更多格式选项。我们可以添加图片、分页符、水平线（类似于粗线）、在标题下折叠文本的章节、允许添加动画文本的计算文本、可链接到 URL
  或文件链接的热点、表格、图像和对象。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_47_0.png)


  When copying an Excel® spreadsheet into a message, use the Paste Special and select
  Paste link to source from the options presented. This will paste the spreadsheet
  into the message. Now if we double-click on the spreadsheet, it will activate Excel®.


  将 Excel® 电子表格复制到消息中时，使用“粘贴特制”，并在显示的选项中选择“粘贴链接到源”。这会将电子表格粘贴到消息中。现在，如果双击电子表格，它将激活
  Excel®。


  If we add a table into a message or Lotus Notes document, we can copy the table
  and paste it into Excel® — the cells will be maintained and the information copied
  across.


  如果在消息或 Lotus Notes 文档中添加表格，可以复制该表格并将其粘贴到 Excel® 中——单元格将被保留，信息将被复制过去。


  ## Attachments


  ## 附件


  Many times, the reason we send a message to someone is because we want to send them
  a particular file. To send a file, we must attach it to the message.


  很多时候，我们向某人发送消息的原因是想发送特定文件。要发送文件，必须将其附加到消息中。


  ## Adding attachments to messages or documents


  ## 向消息或文档添加附件


  There are four ways to add an attachment to a message or document:


  向消息或文档添加附件有四种方式：


  - Go to the menu and select File | Attach. A Create Attachments dialog box will
  open; browse here to select the attachment(s) we want to add and then click the
  Create button.

  - 转到菜单并选择 文件 | 附加。将打开“创建附件”对话框；在此处浏览以选择要添加的附件，然后单击 创建 按钮。

  - Click the Attach icon in the Toolbar or the Attach button below the Toolbar. Both
  actions will result in the opening of the Create Attachments dialog box as it does
  when we select File | Attach.

  - 单击工具栏中的 附加 图标或工具栏下方的 附加 按钮。这两种操作都会打开“创建附件”对话框，就像选择 文件 | 附加 时一样。

  - If we have Windows Explorer open, and our message or document is open in Lotus
  Notes, we can drag the attachment from Windows Explorer to the Lotus Notes icon
  in the Task bar, and then drop into the message or document we have open in Lotus
  Notes. If we resize the Windows Explorer dialog box to be smaller than the Lotus
  Notes window, we can simply drag from Windows Explorer straight to the message or
  document we have open in Lotus Notes.

  - 如果已打开 Windows 资源管理器，且消息或文档已在 Lotus Notes 中打开，可以将附件从 Windows 资源管理器拖到任务栏上的 Lotus
  Notes 图标，然后放入 Lotus Notes 中打开的消息或文档。如果将 Windows 资源管理器对话框的大小调整为小于 Lotus Notes 窗口，可以直接从
  Windows 资源管理器拖到 Lotus Notes 中打开的消息或文档。


  The following is a screenshot of the Create Attachments dialog box; refer to the
  number legend to understand each area:


  以下是“创建附件”对话框的截图；请参考数字图例以了解各个区域：


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_49_0.png)


  > We can also drag attachments from a message or document to a new message or document.
  Select attachment, drag to tabs, go to new message or new document, and then continue
  to drag to the position where we want to place it in the attachment.


  > 我们也可以将附件从一个消息或文档拖到新消息或新文档。选中附件，拖到选项卡，转到新消息或新文档，然后继续拖动到要在附件中放置的位置。


  ## Working with attachments


  ## 处理附件


  Now that we know how to add attachments, we need to explore what we can do with
  attachments.


  既然知道了如何添加附件，我们需要探索可以对附件执行哪些操作。


  When we double-click on the attachment, we will see the Open Attachment dialog box
  as shown in the next screenshot. From here we can select Open, Edit, View, Save,
  and Cancel. Alternatively if we right-click, we will see more available options.


  双击附件时，将如下一个截图所示看到“打开附件”对话框。在此处可以选择 打开、编辑、查看、保存和取消。或者，如果右键单击，将看到更多可用选项。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_50_0.png)


  ### Opening attachments: Open button


  ### 打开附件：打开按钮


  When we click the Open button, the attachment will be opened in the program it was
  created in. For example, if it is a Word attachment, it will launch Microsoft Word
  and open the attachment. When we click the Open button, it is similar to when we
  are opening a Microsoft document in "Read Only" mode. Any edits to the document
  will not be saved unless we select File | Save As. Use this option only when we
  want to view the attachment in the program it was created in.


  单击“打开”按钮时，附件将在创建它的程序中打开。例如，如果是 Word 附件，它将启动 Microsoft Word 并打开附件。单击“打开”按钮类似于以“只读”模式打开
  Microsoft 文档。除非选择 文件 | 另存为，否则对文档的任何编辑均不会保存。仅在想要在创建附件的程序中查看附件时使用此选项。


  ### Editing attachments: Edit button


  ### 编辑附件：编辑按钮


  When we click the Edit button, it allows us to open and edit attachments. An example
  of where we would use this option is if someone has sent a message with an attachment
  that they require us to update. We would select Reply with History & Attachments,
  which creates a new message with the history and a copy of the original attachment.
  Select the attachment we need to update and double-click or right-click and Edit;
  the attachment will open in the program it was created in. Update the attachment
  and then select the save option in the program it was created in. The attachment
  in the message has now been updated and we can send the message. This is the only
  place where the attachment edit has been saved so make sure we save the memo by
  either sending it or saving it as a draft. If we need to access the edited attachment,
  it can be found in the Sent and All Documents.


  单击“编辑”按钮时，允许我们打开和编辑附件。使用此选项的示例是，如果有人发送了一条带附件的消息，要求我们更新该附件。我们会选择“回复并包含历史记录和附件”，这会创建一条新消息，包含历史记录和原始附件的副本。选择需要更新的附件，双击或右键单击并选择“编辑”；附件将在创建它的程序中打开。更新附件，然后在创建附件的程序中选择保存选项。消息中的附件现已更新，我们可以发送消息。这是附件编辑被保存的唯一位置，因此请确保通过发送备忘录或将其保存为草稿来保存备忘录。如果需要访问已编辑的附件，可以在“已发送”和“所有文档”中找到。


  ### Viewing attachments: View button


  ### 查看附件：查看按钮


  The view option allows us to open the attachment in Lotus Notes rather than launching
  the program it was created in. This option is excellent for viewing the attachment
  quickly; previewing zipped files without unzipping them; or for viewing files of
  programs we do not have installed.


  查看选项允许我们在 Lotus Notes 中打开附件，而不是启动创建它的程序。此选项非常适合快速查看附件；在不解压缩的情况下预览压缩文件；或查看我们未安装程序的文件。






  ## 保存附件：保存按钮


  当我们单击 **保存** 按钮时，它会打开 Windows 资源管理器。我们可以浏览到要保存附件的位置，然后单击 **保存**。


  ## 使用多个附件


  如果在一条消息或文档中有多个附件，我们可以右键单击一个附件，然后从右键菜单中选择任何可用选项。


  - **全部保存**：此选项会将消息中的所有附件保存到我们选择的位置。

  - **全部保存并删除**：这允许我们不仅保存到 Windows 资源管理器，还可以删除消息中的附件，从而节省邮箱空间。它会留下文本指示您已删除文件，并给出被删除的文件名。

  - **全部删除**：这会从备忘录中删除附件。


  ## 打印附件


  我们可以通过选择 **查看** 按钮来打印附件，这将在 Lotus Notes（*不是*在它创建所在的应用程序中）中打开附件，然后从 **文件** 菜单中选择
  **打印** 或按 Ctrl+P。


  或者，若要在其原始应用程序中打印附件，请选择 **打开** 按钮，然后从 **文件** 菜单中选择 **打印**，或使用键盘快捷键 Ctrl+P。


  ## 查看邮件


  当我们打开邮件时，可以选择以不同方式显示邮件。例如，我们可以选择显示预览窗格，或者可能只想显示未读备忘录。在本节中，我们将探索这些不同选项。


  ## 预览窗格


  我们可以使用预览窗格预览邮件，这样就无需打开和关闭每条消息。预览允许我们查看文档内容，而无需打开实际文档。


  要访问预览窗格选项，请单击收件箱顶部的 **显示** 按钮。从此处，我们可以在底部或侧面预览邮件。要关闭预览窗格，请选择 **隐藏预览** 选项。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_52_0.png)


  > 我在预览窗格中打开时启用了“将文档标记为已读”首选项，该选项位于“首选项”>“基本 Notes 客户端配置”选项卡的“其他选项”区域中——它是列表中的第一个选项。正如首选项名称所暗示的，当我单击电子邮件进行预览时，该电子邮件会被标记为已读。我选择了此选项，因为我主要预览电子邮件，因此它帮助我跟踪已读内容。


  预览窗格是我们所在视图或文件夹中打开的单独框架，暴露所选文档的一部分。


  要调整预览窗格大小，请选择分隔两个窗格的栏，并拖动到我们偏好的大小。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_52_1.png)


  > 当我们预览消息时，如果已请求回执，将发送回执！


  ## 对话


  我们可以将消息及其所有回复分组查看，以便同时阅读消息和回复。将消息及其所有回复分组称为对话，对话使我们免去了在邮件中查找单个回复的麻烦。


  我们还可以一次对对话中的所有消息执行操作。例如，我们可以通过将对话移动到文件夹，将对话中的所有消息移动到文件夹。


  以下是对话示例。在此对话中，有两条消息。列出的第一条消息是原始消息，来自 Joanne，主题为信息请求。当前位于收件箱中。


  第二封电子邮件是 Karen Hooper 回复 Joanne 的邮件，内容为：谢谢。希望您喜欢。这是在备忘录正文中写入的。这是因为在对话中，列出的所有回复都显示回复的第一行，而不是主题。此消息位于“已发送”文件夹中。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_53_0.png)


  ## 查看对话


  要查看对话，请从“单个消息”（消息和回复分别显示和排序）切换到“对话”（消息及其回复分组在一起）。这些选项在“显示”按钮下可用——与您选择预览选项的同一位置。


  我们可以在收件箱、所有文档和个人文件夹中切换到对话模式。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_53_1.png)


  进入对话模式后，会话中最新的回复会显示出来，任何其他回复和原始消息都会折叠在最新回复下方。


  以下是未展开的对话示例；我们可以看到该对话中有两条消息。我们将单击箭头图标（称为 Twistie）以展开或打开对话：


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_54_0.png)


  当我们展开对话时，每条消息都显示在一行上。原始消息显示其主题，每条回复显示备忘录正文中的第一行文本。当我们展开对话时，收件箱的其余部分会变灰，要关闭对话，请单击收件箱中的一个区域。对话将折叠，收件箱将不再变灰。


  如果我们希望，可以保持在对话模式下。当收到属于特定对话的新消息时，该消息会出现在收件箱的顶部或底部（取决于我们选择如何显示新消息）。该消息显示为未读，对话中的消息数量会增加；我们还可以查看谁发送了回复，包括日期和时间。


  > **注意：** 对话只能按日期查看和排序。按发件人等其他列排序会自动将视图或文件夹切换回单个模式。


  以下表格说明了可与对话一起执行的不同操作。


  | 任务 | 说明 |

  | :--- | :--- |

  | 对折叠对话中的所有消息执行操作 | 单击对话将其选中，然后执行操作。例如，要删除对话中的所有消息，请单击对话，然后右键单击对话并选择 **删除**。 |

  | 对展开对话中的所有消息执行操作 | 如果对话中的所有消息均未选中，请单击对话标题以选中所有消息，然后执行操作。 |

  | 对对话中的一条消息执行操作 | 如有必要，展开对话。然后单击消息将其选中，并执行操作。例如，要删除对话中的一条消息，请单击消息将其选中，然后右键单击消息并选择
  **删除**。 |


  ## 删除对话


  当我们删除对话时，将如以下屏幕截图所示提示，确认个人知晓其删除该对话中所有消息的操作。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_55_0.png)


  ## 关闭对话


  要关闭对话模式，只需转到“显示”按钮并选择“单个消息”。或者，当我们处于对话模式时，将在收件箱顶部看到一条信息栏，告知我们正在以对话模式查看消息。要返回收件箱的原始格式，请单击“清除”按钮；这将带我们返回到单个消息。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_55_1.png)


  ## 查看未读邮件


  通常，如果我们可以只显示未读电子邮件，那将很有用。在 Lotus Notes 中，要执行此操作，可以转到“显示”按钮并选择“仅未读”。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_55_2.png)


  要返回显示已读和未读邮件，请转到“显示”按钮并选择“仅未读”，或者，当您查看“仅未读”时，将在收件箱顶部看到一条信息栏，告知您正在查看未读消息。有一个“清除”按钮也会带您返回到已读和未读消息。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_56_0.png)


  读取消息后，可以将其标记为未读，或选择多条消息并将其标记为未读。


  ## 如何将消息标记为未读或已读


  可以通过选择消息并然后执行以下操作，将已读消息标记为未读或反之：


  - 按键盘上的 Insert 键（可能缩写为 INS）

  - 右键单击并选择“标记为已读”或“标记为未读”


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_56_1.png)


  ## 使用文件夹管理邮件


  所有收件邮件都直接进入收件箱。过了一段时间，收件箱可能会变得非常大，协助管理收件箱以及对消息进行排序的一种方法是将它们归档到文件夹中。


  在本章前面，我们探讨了发送邮件和“发送并存档”选项，该选项允许我们发送消息的同时将其存档到相应文件夹中。


  在本节中，我们将探讨如何创建文件夹以及如何将接收到的消息归档到文件夹中。


  首先，让我们了解如何创建文件夹。


  ## 创建文件夹


  要创建文件夹，请执行以下步骤：


  - 打开邮件，单击收件箱顶部“文件夹”按钮右侧的下拉箭头。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_56_2.png)


  - 我们将看到以下选项：移动到文件夹、从文件夹移除、发现文件夹和创建文件夹——选择“创建文件夹”选项。






  - 3. 将打开“创建文件夹”对话框。光标将放置在“文件夹名称”字段中；在此字段中键入新文件夹的名称。请注意，文件夹在我们的邮件中按字母顺序列出。如果我们希望特定文件夹始终位于列表顶部，可以在文件夹名称前添加数字或字母。例如，要使“培训”文件夹列在我们的文件夹顶部，可以在名称开头添加数字“1”或字母“a”——1.
  Training 或 a.Training。


  - 4. 下一个选项是为新文件夹选择位置。该选项允许我们在另一个文件夹内创建文件夹或创建主文件夹。如果我们希望此文件夹成为另一个文件夹的子文件夹，可以选择要在其中创建新文件夹的文件夹；如果不选择文件夹，则新文件夹将是主文件夹。


  - 5. 单击“确定”按钮以关闭对话框并创建文件夹。


  > 创建文件夹时，可以通过拖动对话框右下角来调整“创建文件夹”对话框的大小。这样我们可以查看当前文件夹并最大限度地减少滚动。


  我们可能已经注意到，当收件箱中有未读邮件时，收件箱名称会加粗，未读邮件数量会显示在右侧，如下一个屏幕截图所示：


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_57_0.png)


  文件夹也是如此。当文件夹中有未读邮件时，文件夹名称会加粗，未读邮件数量会显示在右侧；如以下示例所示，Int Dealers 文件夹中有一封未读邮件：


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_57_1.png)


  有时我们创建文件夹后需要重命名或删除它，因为它已不再需要。以下部分介绍如何执行这两项任务。


  ## 重命名和删除文件夹


  我们经常会创建文件夹，但过一段时间后可能需要更改文件夹名称，或者在某些情况下将其删除。以下是执行这些任务的方法：


  - 1. 单击“文件夹”旁边的 + 图标展开文件夹。

  - 2. 选择要重命名或删除的文件夹，然后右键单击。

  - 3. 将出现如下屏幕截图所示的菜单。选择“重命名文件夹...”以重命名文件夹。系统将提示输入新名称；输入新名称，然后单击“确定”按钮。

  - 4. 要删除文件夹，请从菜单中选择“删除文件夹”。系统将显示一条通知，指出此操作无法撤销，是否要继续？选择“是”按钮继续，或选择“否”取消删除文件夹。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_58_0.png)


  我们还可以通过简单地将文件夹拖放到新位置，将文件夹从一个子文件夹移动到另一个文件夹，或从主文件夹移动到子文件夹。


  ## 选择邮件


  在管理邮件时，我们通常需要选择多封邮件，以便将选定的邮件归档、删除或转发给其他人。


  ## 选择一个或多个邮件或文档


  我们通常需要选择文档，以便对其进行归档、删除或将其转发给其他人。以下是可能的场景：


  - 一个或多个连续文档：单击一个文档，然后按住 Shift 键，再单击要选择的最后一个文档。

  - 一个或多个非连续文档：按住 Ctrl 键，然后单击每个文档。

  - 视图中的所有文档：单击“编辑 | 全选”，或“编辑 | 取消全选”，或 Ctrl+A。

  - 左侧边距中的勾选框：我们可以选择一个首选项：文件 | 首选项 | 基本 Notes 客户端配置 | 其他选项 | 为选定文档在边距中显示勾选标记。该首选项允许我们在边距中单击。我们还可以按空格键选择文档，并使用上下箭头键导航到不同的文档。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_59_0.png)


  在邮件中选中一条消息后，可以执行以下操作：删除、打印、归档、复制、转发或标记为未读/已读。


  ## 归档邮件


  如前所述，文件夹对于组织邮件很有用。我们可以将一条消息放入一个文件夹或多个文件夹中。当我们选择一条或多条消息，然后选择“移动到文件夹”选项时，会看到“移动”、“添加”或“取消”的选择。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_59_1.png)


  - 当我们将消息移动到文件夹时，Lotus Notes 会将消息从当前文件夹移除并放入目标文件夹。

  - 当我们将消息添加到文件夹时，Lotus Notes 会保留消息在当前文件夹中，并将消息添加到目标文件夹。

  - 当我们选择取消时，对话框将关闭且消息不会被移动。


  > 归档邮件时，如果我们使用 **移动到文件夹** 选项，**移动到文件夹** 对话框将打开。如果我们知道文件夹名称，可以开始输入文件夹名称，该文件夹将被选中并高亮显示。然后如果按
  Enter 键，消息将被归档到该文件夹中。通常，与滚动相比，这是一个更快的选项，尤其是当我们有多个文件夹时。


  > 只有一条消息。如果删除位于多个文件夹或视图中的消息，该消息将从所有文件夹和视图中删除。


  归档邮件的另一种方法是拖放。我们可以将邮件从收件箱拖动，然后将其放入文件夹中。要将消息移动到文件夹，请在导航窗格中显示目标文件夹，然后将消息或选定的消息拖入文件夹。


  现在我们已经学习了如何创建文件夹和归档邮件，希望我们的收件箱看起来更加井然有序。在下一节中，我们将学习如何查找邮件。


  ## 查找已归档的邮件


  有时我们可能会将一条消息归档，然后不记得将其归档到哪个文件夹中。其他时候，我们可能没有归档该消息，或者可能正在搜索我们发送的消息。下一节讨论所有文档，这是查找消息的绝佳位置。


  ## 所有文档


  所有文档包含收件箱、已发送和我们文件夹中的所有消息。事实上，它显示邮件中的每条消息（已删除消息除外），是搜索电子邮件的绝佳位置。如果我在收件箱中找不到一封电子邮件，我通常会去所有文档，按发件人排序，然后在那里查找该消息。要按发件人排序，请单击列标题。基本上所有列标题都可以排序；单击一次将其设为升序，然后再单击一次即可恢复默认排序。


  我们可以按如下所示在侧边导航器的“跟进”下访问所有文档：


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_61_0.png)


  在所有文档中，有一列显示消息已归档到哪个文件夹。在以下屏幕截图中，文件夹列被红圈圈出：


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_61_1.png)


  如果我们打开了侧边预览窗格，可能看不到文件夹列或任何列。这是因为没有足够的空间显示列。在下一节中，我们将了解，我们将看到的不是列，而是消息顶部的“按...排序”按钮（在列标题的位置）。我们可以单击“按...排序”按钮来访问不同的列，将出现一个带有不同排序选项的菜单，如下所示，请注意，文件夹列从此区域不可用。


  ## 发现文件夹工具


  查找消息归档位置的另一种方法是使用发现文件夹工具。以下是使用此工具的说明：


  - 1. 选择想要知道其文件夹位置的消息。

  - 2. 在操作栏中，单击文件夹图标，然后选择发现文件夹。

  - 3. 如果消息位于文件夹中，将出现一个对话框并显示文件夹名称。如果它在我们的收件箱或已发送文件夹中，如果需要，我们有“添加到文件夹”选项。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_62_0.png)


  - 4. 要关闭发现文件夹对话框，请单击退出按钮。


  ## 邮件图标


  以下是我们在邮件文件夹和视图中将看到的图标列表。还有其他图标，但这些通常与日历和待办事项有关，将在后续章节中介绍。


  | 图标 | 图标帮助 | 收件箱位置 | 说明 |

  |---|---|---|---|

  | ![Icon] | ![未读邮件] | 消息左侧 | 已接收的未读消息，未读消息为粗体，或可通过首选项下的 **字体和颜色** 选择为 **纯红色文本**。
  |

  | ![Icon] | ![高优先级] | 消息左侧 | 高优先级 – 当此人发送消息时，他们选择了高重要性的发送选项。 |

  | ![Icon] | ![已回复消息图标] | 消息右侧 | 绿色箭头表示消息已回复。如果打开消息，将看到历史记录部分。 |

  | ![Icon] | ![已转发消息图标] | 消息右侧 | 蓝色箭头表示消息已转发。如果打开消息，将看到历史记录部分。 |






  | 图标 | 图标帮助 | 收件箱位置 | 说明 |

  |:--- | :--- | :--- | :--- |

  | [Icon] | 已回复并转发的消息图标 | 消息右侧 | 绿色和蓝色箭头表示消息已被回复和转发。如果打开消息，将看到历史记录部分。 |

  | [Icon] | 回形针图标 | 消息右侧 | 回形针图标表示该消息带有附件。 |


  ## 拼写检查


  当我们输入消息并拼写错误单词时，会在该单词下方看到一条红色波浪线。如果右键单击该单词，将看到拼写替代建议，以及将单词添加到词典或跳过的选项。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_63_0.png)


  当我们发送备忘录时，如果有拼写错误的单词，将再次提示更正拼写。如果想跳过拼写检查，有一个**原样发送**按钮。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_63_1.png)


  在**首选项**中有一些用于拼写检查的绝佳选项。我发现，从事制造业或处理零件编号的人，选择**忽略包含数字的单词**选项会受益，因为他们处理的许多零件编号都包含数字和字母。


  启用**即时拼写检查**选项，可通过在单词下方添加红色波浪线，立即显示我们拼写错误的内容。


  | 部分 | 选项 |

  |:--- | :--- |

  | 英语默认设置 | |

  | | [x] 忽略包含数字的单词 |

  | | [ ] 忽略大写单词 |

  | | [ ] 在下一次语言标记更改前保存即时词典更改 |

  | | [x] 启用即时拼写检查 |

  | 即时更正 | |

  | | [x] 更正常见的输入错误（例如，将 teh 替换为 the） |

  | | [x] 将每个句子的首字母大写 |

  | | [x] 更正最初的两个大写字母 |


  **即时更正**选项不言自明，我已全部启用，因为它们是绝佳选项。


  > 每个国家/地区都提供词典，因此我们需要确保在**拼写检查**首选项中选择了所在国家/地区的词典。


  > 如果已设置签名，切勿忘记将签名中的姓名和其他详细信息**添加到词典**。


  ## 主题警告


  发送消息时，如果未输入主题，在尝试发送消息时会提示输入主题。出现提示时，可以输入主题并通过选择**是**重新发送。或者，可以选择**否**在不带主题的情况下发送消息。


  ## 将签名添加到消息


  在 Lotus Notes 中，与其他邮件产品一样，我们可以设置标识我们及我们详细信息的签名。可以添加公司徽标、电话详细信息、vCard 和甚至网址。我已将公司职位和相关详细信息添加到签名中。要设置签名，需遵循以下说明：


  - 打开邮件，然后单击消息顶部操作栏中的**更多**按钮。接着选择**首选项**…。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_65_0.png)


  - 选择**签名**选项卡。如果需要，选中**自动将签名附加到我的外发邮件底部**选项。如果不选择此选项，将需要通过消息中的**更多**按钮并选择**插入签名**来手动将签名添加到消息。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_65_1.png)


  - 如果要将 vCard 附件作为签名的一部分添加，请单击**附加我的 vCard**按钮。


  - 然后可以输入签名，并通过单击**T**再单击**文本**来对其进行格式化。还可以添加图形、粘贴图像或导入图像等。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_65_2.png)


  在**T**下提供的选项如下面的屏幕截图所示：


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_65_3.png)


  > 我已选择**自动将签名附加到我的外发邮件底部**选项。如果向某人发送消息且不希望附加签名，只需在备忘录中选中签名并将其删除即可。


  ## 删除消息并从垃圾箱恢复


  在 Lotus Notes 中删除消息非常简单。可以右键单击并从菜单中选择**删除**。也可以选择消息并按*删除*键。还可以单击消息顶部操作栏中的**删除**图标，如下所示：


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_66_0.png)


  删除消息后，消息会立即被移除并放入垃圾箱，直至到期。可以通过打开**垃圾箱**，选择要恢复的消息，然后选择**恢复**按钮来恢复已删除的消息。需要在消息到期前恢复，要确认垃圾箱何时会被删除，请转到**首选项
  | 邮件**并查看**我的垃圾箱文件夹中 # 小时后删除文档**。


  ![](img/dc4e954e82cbb69d6ea9b87ab543c676_66_1.png)


  ## 摘要


  在本章中，我们探讨了 Lotus Notes 邮件的许多方面。我们了解了创建、回复和寻址消息。我们还了解了编辑消息的不同方式。我们探讨了处理附件、文件夹、拼写检查和设置签名。


  在下一章中，我们将深入了解邮件工具，这些工具可以帮助我们更高效地处理邮件。

  '
- "# Lotus Notes 邮件工具\n\n在上一章中，我们了解了 Lotus Notes 邮件的基础知识。在本章中，我们将重点介绍可用的高级功能以及如何最佳利用它们来帮助我们高效管理邮件。\n\
  \n花些时间探索可用工具，你可能会惊讶地发现，一旦开始使用其中一些工具，可能会想以前怎么没有它们。我最喜欢的工具之一是信纸——这就像是我定期发送的电子邮件（如月度报告）的模板。我认识的许多同事都有信纸，他们设置信纸发送给旅行社，其中包含所有相关详细信息，如常旅客号码、护照详细信息等等。\n\
  \n另一个工具是“复制到新建……备忘录/日历/待办”，它将所选消息中的文本复制到新建备忘录、日历条目或待办事项中。我使用此工具将备忘录中的详细信息复制到日历条目，以便日历中直接包含备忘录中的所有信息，这意味着无需搜索原始电子邮件。\n\
  \n我也很喜欢查找可用时间工具，这是消息、日历条目和待办事项上可用的上下文菜单选项。选择一条消息（例如想与之会面的人的消息），顾名思义，它会自动找到我们双方都可用的第一个时间，并给我们创建会议邀请的选项。这比从零开始在日历中操作少几个步骤。\n\
  \n在本章中，我们将探讨以下主题：\n\n- 发件人颜色和收件人图标\n- 协作历史记录\n- 查找可用时间\n- 复制到新建……备忘录/日历/待办事项\n-\
  \ 后续功能（标记）\n- 信纸\n- 消息撤回\n- 拼写检查\n\n- 外出办公\n- 管理垃圾邮件\n- 规则\n- 邮件大小指示器\n- 归档\n- 邮件首选项\n\
  \n## 发件人颜色和收件人图标\n\n通常，我们需要快速识别收件箱中的特定电子邮件，特别是当电子邮件仅发送给我们、我们被抄送，或电子邮件来自某个特定人员时。我们可以指定文本和背景颜色，以识别特定发件人的消息。例如，可以使用一种颜色组合来识别重要项目上的同事，另一种颜色组合用于我们的经理，再用另一种组合用于朋友的个人消息。可以指定多种颜色组合。在下面的屏幕截图中，已为特定人员选择了红色和蓝色的背景颜色：\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_69_0.png)\n\n\n\n\n我们还可以显示图标，以标识在收件人（To）字段中我们是唯一收件人，或者我们的名字仅出现在抄送（Cc）字段中的消息。\n\
  \n## 指定用于标识发件人的颜色\n\n我们可以按照接下来的说明启用发件人颜色：\n\n- 1. 如果需要，打开您的电子邮件。\n- 2. 单击消息列表上方的更多按钮，然后单击首选项。\n\
  - 3. 选择发件人颜色选项卡。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_70_0.png)\n\n- 4. 在第一个发件人名称字段中，输入我们希望以第一种颜色组合显示其消息的人员的一个或多个姓名。按\
  \ Enter 键分隔姓名（而不是使用逗号作为分隔符）。要从目录中选择姓名，请单击字段旁边的向下箭头。\n\n- 5. 选择背景颜色和/或文本颜色。\n- 6.\
  \ 单击确定。\n- 7. 要删除所有颜色组合，请返回到首选项中的发件人颜色选项卡，单击恢复默认颜色，然后单击确定。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_70_1.png)\n\
  \n## 显示用于标识您的收件人级别的图标\n\n将某人抄送到一条消息中通常意味着该消息内容仅供参考，我们可能不需要回复或采取任何行动。电子邮件礼仪规定，如果我们希望某人对我们在电子邮件中包含的项目采取行动，我们会将其姓名添加到收件人字段中。因此，能够立即识别出我们被抄送的电子邮件或我们的姓名位于收件人字段中的电子邮件对我们来说非常方便。以下是启用此功能的说明：\n\
  \n- 1. 如果需要，打开邮件。\n- 2. 单击消息列表上方的 **更多** 按钮，然后单击 **首选项**。\n- 3. 转到 **收件人图标** 选项卡。\n\
  - 4. 选择一个或多个显示字段，以显示实心圆（如果 **仅发送给我的邮件**）、半圆（如果 **发送到收件人字段中不超过此数量收件人的邮件**，然后选择数量），或空心圆图标（如果\
  \ **作为抄送发送给我的邮件**）。\n- 5. 要在邮件使用备用电子邮件地址或群组名称地址给我们时显示所选图标，请在下方字段中指定一个或多个备用地址或群组名称，此步骤为可选。\n\
  - 6. 单击 **确定** 以保存设置。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_71_0.png)\n\n\
  ## 协作历史记录\n\n协作历史记录包含多种功能。我们可以查看与我们其中一位联系人之间的协作或通信历史记录，例如电子邮件、有时聊天记录（如果您已保存）或会议。协作历史记录包括选定联系人在过去两周内的所有活动。\n\
  \n## 查看某人的协作历史记录\n\n按照接下来的说明，查看协作历史记录中可用的选项：\n\n- 1. 在邮件中，选择来自要查看其协作历史记录的联系人的一条消息。\n\
  - 2. 右键单击该消息，我们将在菜单选项顶部看到所选联系人的姓名。这在以下屏幕截图中标记为步骤 1。\n- 3. 选择联系人的姓名，我们将看到扩展菜单。我们将看到扩展菜单。\n\
  - 4. 选择协作历史记录。这是以下屏幕截图中的步骤 2。\n- 5. 将出现一个包含协作列表的对话框；选择并双击以打开其中一条协作记录。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_72_0.png)\n\
  \n## 查找可用时间\n\n通常，当我们收到某人的消息并意识到需要与他们组织会议时，查找可用时间功能是一个很好的快捷方式，可以向我们显示我们自己和消息发件人的第一个可用时间，以便我们可以与他们创建会议。\n\
  \n- 1. 我们可以通过右键单击邮件中某人的姓名来选择上下文菜单；然后我们可以看到其姓名列在上下文菜单顶部。\n\n- 2. 当我们选择其姓名时，将出现扩展上下文菜单。\n\
  \n- 3. 选择查找可用时间以打开日程安排器并查看我们自己和所选联系人的第一个可用时间。如果我们选择的联系人是组织外部的人员，则日程安排器会显示灰色的时间段，因为信息不可用；但是，它确实会显示我们的第一个可用时间。\n\
  \n- 4. 从日程安排器窗口，我们可以创建会议，如以下屏幕截图所示：\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_73_0.png)\n\
  \n## 复制到工具\n\n通常，我们可能会收到一封电子邮件，其中包含需要粘贴到会议、备忘录或待办事项中的详细信息。复制到工具允许我们选择一条消息、日历条目或待办事项，然后将这些文档之一中的信息复制到新消息、日历条目或待办事项中。这样可以节省在消息和目标文档之间复制和粘贴信息的麻烦。此功能可从右键菜单和\
  \ **更多** 按钮下使用，如下所示：\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_74_0.png)\n\n>\
  \ 可以将消息拖放到日程概览时间段区域，以从该消息创建日历条目。\n\n## 后续处理功能\n\n“后续处理”功能，或在某些其他邮件应用程序中称为“标记”，是管理我们电子邮件的绝佳工具。很多时候，当我们收到一封无法立即回复的电子邮件时，我们通常会将其留在收件箱中，以便记得稍后处理；我们甚至可能将其标记为未读以进一步提醒自己。问题是，收件箱是为接收电子邮件而设计的，因此，随着新邮件不断涌入收件箱，我们需要跟进的电子邮件会被推得越来越靠后。\n\
  \n将电子邮件标记为跟进有助于我们管理需要回复的那些电子邮件，因为它会用图标标记消息，使其与其他消息区分开来；我们还可以设置提醒，并在特殊的跟进视图中查看标记的消息，以便更轻松地管理它们。\n\
  \n### 将消息标记为跟进\n\n将消息标记为跟进是个好主意。我们只需在文件夹或视图中选择一条或多条消息，并通过执行以下任一步骤来添加标记：\n\n- 1.\
  \ 单击消息列表上方的标记图标，选择 **添加或编辑标记**...\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_74_1.png)\n\
  \n- 2. 输入标记优先级以及跟进操作、日期、时间和提醒（如果需要）。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_75_0.png)\n\
  \n- 选择一条或多条消息，然后将其拖动到后续处理文件夹（这会将消息从收件箱中移出）。然后输入首选项。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_75_1.png)\n\
  \n- 右键单击并选择快速标记（这会应用在邮件首选项中设置的选项）。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_75_2.png)\n\
  \n- 3. 快速标记选项类似于标记消息的快捷方式。在了解快速标记选项之前，让我们先看看在选择添加或编辑标记选项时可以选择的几个选项。\n\n> > 当我们创建电子邮件时，可以选择添加标记。当我们想要标记正在发送的电子邮件以供跟进时，这很方便，并且可以避免在发送消息后必须进入“已发送”文件夹来执行该任务。\n\
  \n当我们添加或编辑标记时，我们将看到一系列选项，用于根据重要性以及我们希望如何接收通知来管理标记。我通常会使用此区域作为留言板，为那些需要更多细节的消息设置备注和提醒。如果我们已经添加了标记，并希望更改其中一些选项，可以选择用于添加标记的同一菜单——添加或编辑标记。\n\
  \n### 重要性\n\n我们拥有的第一个选项是选择将显示在我们为跟进所选消息旁边的标记优先级图标。有三个优先级可供选择：\n\n- 紧急\n- 普通\n- 低\n\
  \n如下一张屏幕截图所示，只需单击与我们为跟进所标记内容相关的优先级；在以下屏幕截图中，已选择普通优先级：\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_76_0.png)\n\
  \n### 可选跟进设置\n\n在“输入后续操作”中，我们可以添加与消息所需跟进相关的评论。我使用此区域的方式与便利贴相同，用于为我正在处理的事物添加一些评论或操作。当我们即将休假且无法处理完所有消息时，这非常有用。只需在“输入后续操作”中添加评论，在休假结束后，我们就可以查看评论以刷新对状态或所需操作的记忆。如果我们需要与他人分担工作或管理某个人的邮件，可以添加评论，让对方了解跟进的状态，并告知他们需要做什么，而无需为此单独发送一条消息。在我们忙碌的生活中，为那些无法立即处理的消息添加评论是一个巨大的优势。\n\
  \n可用的其他跟进设置包括：\n\n- **何时后续处理**：此选项可帮助我们指定后续处理日期，以及可选的后续处理时间——我喜欢提醒，并且经常使用此选项。我也喜欢查看每个后续处理的到期日期，以便我可以管理时间。这就像是我们需要处理的消息的“待办事项”列表或“优先级”列表。\n\
  \n\n\n\n- 播放声音：此选项适用于设置了闹钟的人。使用此选项，我们可以选择在闹钟响起时播放的声音。单击扬声器图标以测试所选声音。我们可能希望为不同优先级选择单独的声音，或设置专门用于后续跟进的声音。\n\
  \n- 带主题的电子邮件通知：此选项会在闹钟响起时发送电子邮件。如果我们想提醒其他人有事项需要跟进，这是一个绝佳选择。确保在“收件人”字段中输入我们希望接收通知的人员地址。单击地址簿图标从目录中选择姓名。我认识很多人，他们会给自己发一条消息，提醒自己需要跟进某条消息！\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_77_0.png)\n\n> 随时都可以编辑旗帜选项。我有时这样做是为了更改截止日期或在“输入后续跟进操作”字段中添加其他评论。例如，我可能已经打电话给那个人，被告知他们正在休假。我会将截止日期更改为他们返回后一两天，并添加评论，注明我打电话的日期以及他们目前正在休假。\n\
  \n## 快速旗帜\n\n快速旗帜选项允许我们快速添加带有预设选项的旗帜。要添加快速旗帜，我们有以下选项：\n\n- 选择一条或多条消息，然后单击消息列表上方的旗帜图标，如下所示：\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_77_1.png)\n\n- 选择一条或多条消息，然后单击消息列表上方的旗帜图标并选择快速旗帜：\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_78_0.png)\n\n- 选择一条或多条消息，然后右键单击并选择快速旗帜：\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_78_1.png)\n\n- 在消息内部，单击电子邮件标题上方按钮行中的旗帜图标。\n\
  \n## 设置快速旗帜选项的后续跟进首选项\n\n快速旗帜具有与添加旗帜时相同的可用选项。我们可以按照以下说明设置此首选项：\n\n1. 如有必要，打开邮件。\n\
  2. 单击消息列表上方的“更多”，选择“首选项”，然后选择“后续跟进”选项卡。\n3. 对于“优先级”，选择在标记消息时要显示的优先级。\n4. 勾选“设置后续跟进日期”，输入数字，并选择“天”、“月”或“年”以设置默认后续跟进日期。要添加后续跟进时间，请选择“设置后续跟进时间”并选择一天中的时间。\n\
  5. 勾选“设置触发闹钟”，然后输入数字。选择“天”、“小时”或“分钟”，并选择“之前”或“之后”以设置在后续跟进日期或时间之前或之后多长时间触发闹钟。然后执行以下任一操作：\n\
  \   - 要在使用快速旗帜功能时应用默认闹钟设置，请勾选“对快速旗帜使用闹钟设置”。\n   - 要在闹钟响起时播放声音，请勾选“播放声音”，并从下拉列表中选择要播放的声音。单击扬声器图标以测试所选声音。\n\
  \   - 要在闹钟响起时发送电子邮件，请勾选“发送电子邮件通知给”，并输入应接收通知的人员地址。单击地址簿图标从目录中选择姓名。\n6. 单击“确定”。\n\n\
  要使闹钟与后续跟进旗帜配合使用，我们必须首先在首选项中启用它们。转到“文件 | 首选项 | 日历和待办事项”，选择“闹钟”选项卡并勾选“显示闹钟通知”，然后单击“确定”。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_79_0.png)\n\n## 后续跟进视图和迷你视图\n\n后续跟进视图位于“已发送”下方。我们可以将消息拖动到此文件夹以添加后续跟进旗帜，也可以打开此视图来管理我们的后续跟进。从此区域，我们可以对列进行排序，打开或预览已标记的消息，编辑旗帜，并删除旗帜。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_80_0.png)\n\n后续跟进迷你视图始终在视线范围内，因为它显示在邮件文件左侧导航器的底部，这是一个非常宝贵的功能。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_80_1.png)\n\n从此区域，我们可以对列进行排序，打开已标记的消息，编辑旗帜，并删除旗帜：\n\
  \n- 可以通过将光标移动到消息上方来显示消息的所有列。或者，我们可以调整此窗口的大小。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_80_2.png)\n\
  \n- 可以通过双击消息来打开它。\n- 可以通过单击“删除旗帜”从迷你视图和后续跟进视图中删除消息（完成操作后）。消息保留在其他邮件视图或文件夹中，但不再带有后续跟进旗帜。\n\
  - 在迷你视图中，我们可以调整视图和列的大小：\n  - 通过拖动“后续跟进”字样上方的区域，垂直调整迷你视图的大小。\n  - 通过拖动其右边缘，水平调整迷你视图的大小。\n\
  \  - 通过拖动列分隔线，调整列的大小。\n  - 通过拖放列标题，重新排列列的顺序。\n\n使用迷你视图，我们可以选择显示会议通知和待办事项，如果不希望显示后续跟进消息，可以不显示。我们可以单击“后续跟进”字样旁边的向下箭头，切换到显示“新通知”（日历通知，例如邀请或接受等）或“待办事项”。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_81_0.png)\n\n在迷你视图中，有一个专门用于优先级旗帜图标的列。我们会在收件箱和邮件中其他可以看到优先级图标的视图中看到此列。然后，我们可以单击列标题将所有优先级分组在一起；这将把所有高优先级的后续跟进项放在列表的顶部。\n\
  \n## 允许代理人在管理我们的邮件时添加后续跟进旗帜\n\n我们可以授予代理人（通常是个人助理）代表我们在邮件中添加后续跟进旗帜的权限。此选项在“访问与代理\
  \ | 邮件首选项”中启用。代理人必须获得读取、编辑和创建任何文档、发送邮件、启用“外出办公”访问或更高权限。\n\n> 当我在收件箱中标记一条消息后，我会将其归入某个文件夹。我可以从后续跟进视图或迷你视图访问该消息，因此没有必要将其保留在收件箱中——这是保持收件箱大小最小化的绝佳选择。\n\
  \n> 当我们显示对话时，可以为对话标记后续跟进操作，这样做时，旗帜会添加到对话中的每条消息。\n\n## 删除旗帜\n\n有几种方法可以从电子邮件中删除旗帜。如果已完成后续跟进操作且不再需要该电子邮件，最明显的做法就是直接删除它！在迷你视图中，单击“删除旗帜”按钮。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_82_0.png)\n\n或者，从任何视图或文件夹，或从电子邮件内部，选择“后续跟进”按钮，然后选择“删除旗帜”，如下所示：\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_82_1.png)\n\n## 信纸\n\nLotus Notes 中的信纸概念类似于\
  \ Microsoft Word 中的模板，我们可以创建包含可重复使用信息的消息。例如，许多人力资源部门都有一个用于发布职位空缺的标准消息。IT 部门可能会发送一条宣布服务器中断的标准消息，等等。这些消息中的信息大部分都相同。例如，服务器中断备忘录会有不同的服务器名称和日期，但“收件人”和“主题”字段中的值等其他信息将保持不变。因此在这些情况下使用信纸可以避免我们每次都重新创建消息。我遇到过不少人，他们创建了信纸用于预订机票或住宿。信纸包括他们的常旅客信息以及护照详细信息等等。他们通常还会包含一个带有“日期”、“时间”、“出发地”、“抵达地”等标题的表格，这样在请求航班时，他们只需输入详细信息并在表格中制表键跳转即可。\n\
  \n我们可以创建带有文本或图形的信纸，并包含可重复使用的收件人列表。\n\n> 如果信纸包含附件，我们每次需要发送信纸时都可以编辑附件。\n\n\n\n\n\n\
  ## 创建信纸\n\n创建信纸非常简单。共有三个选项，如下所示：\n\n### 选项 1：\n\n- 1. 创建一条消息并添加所需文本、收件人列表（如有必要）、发送选项以及消息中需要的任何其他元素。\n\
  - 2. 从“更多”按钮中选择“另存为信纸”；我们将看到提示要求为信纸命名。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_83_0.png)\n\
  \n- 3. 输入名称并单击“确定”按钮（或按 Enter 键）。\n- 4. 信纸将保存在“信纸”文件夹中。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_83_1.png)\n\
  \n### 选项 2：\n\n- 1. 在邮件侧边导航器中，展开“工具”，然后选择“信纸”。\n- 2. 单击“新建信纸 | 消息”。\n- 3. 添加所需文本、收件人列表（如有必要）、发送选项以及消息中需要的任何其他元素。\n\
  - 4. 单击“保存”，输入信纸名称，然后单击“确定”。\n\n### 选项 3：\n\n- 1. 在邮件侧边导航器中，展开“工具”，然后选择“信纸”。\n-\
  \ 2. 单击“新建信纸 | 个人”。\n- 3. 在“标题”下方的第一组括号之间，插入要在消息顶部显示的任何文本或图形。请注意，导入是包含图形的最佳方式。\n\
  - 4. 在一组红色括号之间，插入要直接显示在消息正文之前的任何文本或图形。\n- 5. 在最后一组括号之间，插入要在页面底部显示的任何文本或图形。如果我们想在该字段中添加签名，可以将其插入到红色括号之间，然后剪切并粘贴到最后一组括号之间。\n\
  - 6. 单击“保存”，输入信纸名称，然后单击“确定”。\n\n在所有三个选项中，我个人更喜欢选项一。\n\n## 编辑、重命名或删除信纸\n\n通常我们需要调整已创建的信纸。我们可能需要更改收件人列表或在备忘录正文中添加新部分。有时，我们可能需要删除不再需要的信纸，或者需要重命名信纸。\n\
  \n编辑、重命名或删除信纸需要遵循以下步骤：\n\n- 1. 在邮件侧边导航器中，展开 **工具** 并选择 **信纸**。\n- 2. 选择要更改的信纸。\n\
  - 3. 执行以下任一操作：\n  - 单击 **编辑**，对信纸进行更改，然后单击 **保存**。\n  - 单击 **重命名**，输入信纸的新名称，然后单击\
  \ **确定**。\n  - 单击垃圾桶图标删除信纸。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_84_0.png)\n\
  \n## 如何使用信纸\n\n创建信纸后，我们会发现使用起来非常简单。信纸存储在 **信纸** 文件夹中。要使用信纸，可以进入 **信纸** 文件夹并双击所需的信纸。或者，如果我们在收件箱中，可以单击\
  \ **更多** 按钮并选择 **使用信纸的新消息**；这将打开一个提示框，列出 **信纸** 文件夹中存储的信纸，我们需要选择所需的信纸。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_85_0.png)\n\
  \n## 信纸书签\n\n最常用的信纸可以设为书签，以便轻松访问。我们可以打开信纸消息，然后将打开的信纸窗口选项卡拖到 **打开** 按钮或 **书签栏**。这将导致信纸列在\
  \ **打开** 按钮或 **书签栏** 中。以下截图显示，我已将 **差旅请求** 信纸设为书签。当我需要使用 **差旅请求** 信纸时，只需从 **打开**\
  \ 按钮或 **书签栏** 单击打开即可。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_85_1.png)\n\n\
  如果我们发现自己经常搜索发给某人（或某些人）的最后一封电子邮件，将内容复制到剪贴板，粘贴到新备忘录中，做一些小修改，然后定期发送，那么是时候考虑使用信纸了！\n\
  \n## 消息撤回\n\n有时我们会发送一封电子邮件，然后立即意识到要么发错了人，要么忘记附件，要么根本不应该发送！我们可以撤回已发送且已保存的消息。如果在消息尚未准备好发送时就发送了，或者想要编辑已发送消息的内容并重新发送，这非常有用。请注意，某些组织可能已禁用此功能，因此“撤回消息”按钮对我们不可用。\n\
  \n### 如何撤回消息\n\n如果发现已发送需要撤回的消息，请按照以下步骤操作：\n\n- 1. 在邮件中，打开“已发送”或“所有文档”。\n- 2. 选择要撤回的消息。\n\
  - 3. 在消息列表上方，单击“撤回消息”按钮，或者也可以单击“更多”按钮，然后选择“撤回消息...”选项。请记住，如果未显示此按钮，则 IT 部门可能已禁用此功能。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_86_0.png)\n\n- 4. 如果消息发送给了多个收件人，请选择要从中撤回消息的收件人，通过选中或取消选中显示的名称。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_86_1.png)\n\n- 5. 即使收件人已打开或预览了消息，也要从收件人处撤回消息，请选择“即使已读也撤回消息”。请注意，许多\
  \ IT 部门允许撤回未读消息，因此即使可以选择此选项，如果不允许，也不会撤回消息。这是一个可选步骤。\n- 6. （可选）要禁止撤回状态报告，请选中“向每个收件人发送撤回状态报告”选项。撤回状态报告会确认消息是否成功撤回。\n\
  - 7. 单击“确定”。\n\n要使消息撤回生效，我们和消息收件人都必须使用 Lotus Notes 8 客户端、邮件模板和邮件服务器。消息收件人必须选择基本邮件首选项“允许他人撤回发送给我的邮件”。如果消息正从我们的组织发送到外部，则无法撤回消息，因为消息撤回仅在组织内部有效。\n\
  \n如果单击“发送”按钮时系统提示保存消息，而我们选择了“否”，则无法撤回该消息，因为它未保存在“已发送”视图或“所有文档”中。\n\n## 拼写检查\n\n\
  拼写不是我的强项，我必须承认我非常喜欢拼写检查功能，并且一直在使用。有很多选项可以设置拼写检查功能的运行方式。首先，可以设置首选项来检查所有消息的拼写，然后可以设置默认词典、数字和大小写的处理方式，还可以选择其他词典。还有启用即时拼写检查的选项，可在输入时识别拼写错误的单词。\n\
  \n### 为消息启用拼写检查\n\n可以让 Lotus Notes 在发送前自动检查所有消息的拼写，或者也可以手动检查消息中的拼写错误。还可以启用即时拼写检查器，在输入时显示拼写错误的单词。我们在第\
  \ 5 章“掌握 Lotus Notes 邮件”中讨论了即时拼写检查；在本章中，我们将了解其他拼写检查选项。\n\n### 手动执行拼写检查\n\n创建一条消息来测试接下来的步骤：\n\
  \n- 1. 在消息打开时，选择消息正文中要检查拼写的文本。\n- 2. 选择“工具 | 拼写检查...”。当 Notes 不认识某个单词时，Notes 会显示“拼写检查”对话框。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_88_0.png)\n\n### 输入时执行拼写检查（即时拼写检查）\n\n\
  创建一条消息来测试接下来的步骤：\n\n- 1. 在消息打开时，选择“工具 | 即时拼写检查...”。当 Notes 不认识某个单词时，该单词下方会出现红色波浪线。\n\
  - 2. 右键单击拼写错误的单词；我们将看到拼写的替代建议，以及将单词添加到词典或跳过它的选项。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_88_1.png)\n\
  \n### 执行自动拼写检查\n\n在这种情况下，Notes 在发送消息时检查拼写。\n\n- 1. 选择“文件 | 首选项”，单击“邮件”，然后单击“基本”选项卡。\n\
  - 2. 选择“发送前检查邮件拼写”。\n- 3. 单击“确定”。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_88_2.png)\n\
  \n> > 我们可以启用即时拼写检查以及发送前自动检查消息的选项。这样，输入时会显示拼写错误的单词，并在发送消息时提示纠正遗漏的单词。\n\n\n\n\n\n\
  我们不应忘记将签名添加到词典中。如果不这样做，每当我们发送消息并启用了拼写检查选项时，它将拼写检查我们的名字以及我们添加到签名中的所有内容。如果拼写检查器捕获了签名的部分内容，请在拼写检查对话框中选择“添加到词典”按钮。\n\
  \n## 设置拼写检查首选项\n\n如前所述，我们可以选择不同的拼写检查选项来自定义拼写检查器。\n\n1. 单击“文件”|“首选项”。\n2. 单击“拼写检查”。\n\
  3. 设置以下任一选项：\n\n   - 从“主要词典”列表中选择语言词典，然后单击“设置为默认值”。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_89_0.png)\n\
  \n   - 选择“补充词典”选项，在此我们可以看到可选择的补充词典。这需要由我们的 IT 部门安装。\n   - “编辑用户词典”选项列出了我们添加到词典中的所有单词，例如我们的姓名、公司名称、产品名称以及我们使用的缩写。我们可以在“首选项”中或在提示时从拼写检查对话框中编辑此词典。在此区域内，我们可以在“新建/选定单词”字段中输入新单词，然后单击“添加”按钮来添加新单词。我们还可以选择诸如\
  \ Admin 之类的单词（如图所示），更改拼写，然后单击“更新”按钮。最后，我们可以通过在列表中选择单词，然后单击“删除”按钮来删除用户词典中的单词。\n \
  \  - 有一个“忽略包含数字的单词”选项。对于使用包含字母和数字的零件号或型号的产品的人来说，这是一个非常好的选项。我们还可以设置“忽略全大写单词”。\n \
  \  - 我们还有一个适用于多语言文档的选项——在下一次语言标记更改之前保持即时词典更改。\n   - 选择“启用即时拼写检查”选项将用下方的红色波浪线突出显示拼写错误的单词。\n\
  \   - 在“即时更正”下，我们可以选择希望自动更正的典型键入错误。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_90_0.png)\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_90_1.png)\n\n4. 单击“确定”。\n\n> 即时更正功能仅适用于\
  \ Lotus Notes 8.5.1 英语客户端。\n\n## 非在办公室\n\n每当我们休年假或不在办公室时，启用非在办公室功能非常重要。当同事或客户给我们发送电子邮件时，他们会收到通知，告知我们不在办公室，包括不在办公的日期，更重要的是，我们何时返回办公室。在\
  \ Lotus Notes 8.5 中，缺席通知会立即发送。\n\n我实际上不仅在休假时才使用我的非在办公室功能。如果我当天在参加培训，通常要到当天晚些时候或第二天才能查看电子邮件，因此我也会启用它。参加会议或其他商务外出时，我也会启用它。我们可以编辑非在办公室，为每次外出发送自定义消息。通知服务仅在我们指定的离开和返回时间之间发送回复，并且只向每个发件人发送一条回复。\n\
  \n### 启用非在办公室功能\n\n启用此功能的步骤如下：\n\n1. 在“邮件”或“日历”中，单击**更多**按钮，然后选择**非在办公室**…\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_91_0.png)\n\
  \n2. 输入**离开**日期和**返回**日期。如果外出时间少于一天，请选中**指定小时数**，并输入外出的小时数。具体取决于我们组织的服务器配置，我们可能可以选择小时数，也可能只能选择日期。选中**会议期间不可用**，以向他人显示我们在这些时间无法参加会议及其他相关活动。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_91_1.png)\n\n3. 在**标准通知**选项卡上，如有需要，编辑**主题**字段，并选择**在主题中追加返回日期**，以便发件人清楚地看到我们何时返回。在**其他正文文本**中，添加任何进一步详细信息，例如外出的原因或我们外出期间代替我们工作的人员的联系方式。要清除此字段，可以单击**主题**字段上方的**重置默认值**按钮，然后添加新详细信息。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_92_0.png)\n\n4. 如果要发送替代通知，请选择**替代通知**选项卡，向特定人员或来自特定域（如\
  \ @sampledomain.com）的人员发送替代的非在办公室通知。在**收件人**字段中指定人员和域。然后指定替代通知的内容。\n\n5. 如有需要，单击**排除**选项卡，以在满足特定条件时取消非在办公室通知。在相关字段中指定所需的条件。此处有一个选项可防止回复发送到从\
  \ Internet 接收的消息。如果这是我们的偏好，请选中**不自动回复来自 Internet 地址的邮件**。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_92_1.png)\n\
  \n6. 单击**启用并关闭**，或者，如果我们已启用非在办公室通知但更改了一些非在办公室设置，请单击**保存并关闭**。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_92_2.png)\n\
  \n### 如何禁用非在办公室功能（如有必要）\n\n默认情况下，非在办公室功能会自动禁用自身；但是，在某些组织中，我们需要手动禁用非在办公室，因为它未启用为服务运行。如果我们确实需要自己禁用它，非在办公室会向我们发送提醒。\n\
  \n1. 打开“邮件”或“日历”。\n2. 在消息列表上方，单击“更多”|“非在办公室”。\n3. 单击“禁用并关闭”。\n\n**缺席时长：**\n最短时间为一小时。最少天数为一天。不能设置\
  \ 1 天 4 小时。必须选择时间或日期之一。\n\n我们可以允许邮件代理启用非在办公室通知。在邮件文件首选项的**访问与委托**部分中，选择**邮件、日历、待办事项和联系人**组件，然后授予**读取、编辑和创建任何文档、发送邮件、启用非在办公室或更高权限**。\n\
  \n## 垃圾邮件\n\n我们经常收到不需要的电子邮件。可以通过将这些电子邮件添加到垃圾邮件中来阻止它们；此功能称为**阻止发件人邮件**。此功能允许我们筛选传入消息，并将特定发件人的消息直接移动到垃圾邮件中，以便它们绕过收件箱。除了**已发送、规则、信纸和跟进**之外，我们可以在所有邮件视图和文件夹中使用此功能。垃圾邮件中的邮件需要手动删除。\n\
  \n### 管理垃圾邮件\n\n按照以下步骤将邮件添加到垃圾邮件中。\n\n1. 打开“邮件”，选择要将其消息添加到垃圾邮件的发件人的一条消息。\n\n2. 在收件箱中，单击**更多**按钮，然后选择**将发件人邮件发送到垃圾邮件**。将打开垃圾邮件发件人列表对话框，如下一张屏幕截图所示。选择是要阻止来自单个发件人的邮件，还是阻止来自以发件人域结尾的任何地址的邮件。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_94_0.png)\n\n3. 单击“确定”。此发件人的消息现在将直接进入垃圾邮件，位于侧边导航器中，如下突出显示：\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_94_1.png)\n\n4. 要取消阻止，在垃圾邮件中，选择**管理垃圾邮件发件人列表**按钮；这将打开垃圾邮件发件人列表对话框，我们可以选择一个名称进行删除，或单击**全部删除**按钮。我们可以删除垃圾邮件中的电子邮件，但发件人详细信息将保留在垃圾邮件发件人列表中。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_94_2.png)\n\n> > 我们还可以从“规则”文件夹管理垃圾邮件，我们将在下一节中介绍。\n\
  \n\n\n\n\n## 规则\n\n我们的收件箱经常被大量消息淹没，这可能会让人感到不知所措。防止这种情况的一种方法是使用规则来管理邮件。我们可以使用邮件规则，对收到的符合特定条件的新消息自动执行操作。我们可以创建一条规则来检查来自特定发件人或包含特定主题的消息，并自动将消息移动到特定文件夹、将消息副本发送给某人，或在看到它们之前删除不需要的消息。例如，我订阅了几个网站，并设置了规则，将这些网站发来的新闻通讯直接移动到一个文件夹，以便它们绕过我的收件箱。\n\
  \n我们创建的邮件规则存储在邮件文件的 **规则** 文件夹中。我们可以前往该文件夹添加新规则，也可以编辑已创建的规则。我们可以编辑规则、更改其顺序以使一条规则优先于另一条规则、在不想使用时将其关闭，或将其彻底删除。\n\
  \n我们可以在侧边导航栏的 **工具** 下访问 **规则**。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_95_0.png)\n\
  \n有一个 **快速规则** 选项，它是最常用规则配置的简化集，可以快速应用——因此得名 **快速规则**。\n\n下表说明了一些 **快速规则** 和 **规则**\
  \ 设置，供我们参考：\n\n| 条件 | 定义 |\n| :--- | :--- |\n| 包含 | 包含查找部分匹配。例如，如果我们选择了规则来处理主题中包含\
  \ \"sales\" 的消息，它将处理主题字段中包含 \"sales conference\" 以及 \"sales enquiry\" 的消息。 |\n|\
  \ 不包含 | 我们需要小心，因为该设置与包含条件完全相反，通常与包含或等于连用。 |\n| 等于 | 等于查找完全匹配。在我们的销售示例中，它将仅处理主题中只有\
  \ \"sales\" 的消息。 |\n| 不等于 | 与不包含类似，但它查找完全匹配。 |\n\n### 创建快速规则\n\n按照以下步骤创建快速规则：\n\n\
  - 1. 打开邮件并选择要应用快速规则的消息。\n- 2. 选择 更多 | 创建快速规则。\n- 3. 由于快速规则基于所选消息中的信息，我们将在 **发件人**、**主题**\
  \ 和 **域** 字段中看到值。如有必要，我们可以编辑这些值。例如，如果我们选择的主题字段中没有文本，这些字段可能为空。\n- 4. 完成规则有三个步骤。对于每个条件，我们可以为每个字段值指定以下任意状态——**包含**、**不包含**、**等于**\
  \ 和 **不等于**。\n  - i. 首先，我们需要选择要匹配的条件。有三个条件需要配置——**发件人**、**域** 和 **主题**。我们可以选择其中一个条件或全部三个条件。\n\
  \n    | 条件 | 操作符 | 值 |\n    | :--- | :--- | :--- |\n    | 当发件人 | 包含 | specialoffer@myerone.com.au\
  \ |\n    | 当域 | 等于 | myerone.com.au |\n    | 当主题 | 包含 | 你的绝佳选择，尽享优惠与奖励 |\n\n  -\
  \ ii. 我们需要决定何时采取操作——针对一个或所有选定的条件。\n\n    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_96_0.png)\n\
  \n  - iii. 选择要执行的操作：\n    - **移动到文件夹**：我们需要选择要将消息移动到的文件夹。\n    - **将重要性更改为高**：此选项会在消息上添加红色感叹号图标，以指示消息为高重要性。\n\
  \    - **不接受消息**：这将删除消息。请注意，消息不会存储在 **垃圾箱** 中，且无法恢复。\n\n    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_96_1.png)\n\
  \n- 5. 单击确定保存配置。新的快速规则已创建并存储在 工具 | 规则 文件夹中。新的快速规则作用于传入消息，但收件箱中符合规则条件的现有消息不受影响。\n\
  \n如果快速规则提供的选项不够，我们可以创建一条规则。\n\n### 创建规则\n\n规则有更多选项可配置，功能非常强大，因为还有更多可选操作和包括异常在内的更多配置。\n\
  \n- 1. 在邮件的侧边导航窗格中，转到 工具 | 规则，或者单击 更多 按钮，然后选择 邮件规则。这将打开 规则 文件夹。\n- 2. 在 规则 文件夹中，单击\
  \ 新建规则。\n- 3. 在 新建规则 对话框中，有两个区域需要配置。在第一个区域中，我们需要指定条件。规则有多个可配置的条件。\n\n| 要检查的条件 |\
  \ 选项 | 其他选项 |\n| :--- | :--- | :--- |\n| 发件人 | 包含, 不包含, 等于 & 不等于 | |\n| 主题 | 包含,\
  \ 不包含, 等于 & 不等于 | |\n| 正文 | 包含, 不包含, 等于 & 不等于 | |\n| 重要性 | 包含, 不包含, 等于 & 不等于 | 高,\
  \ 正常, 低 |\n| 发送优先级 | 包含, 不包含, 等于 & 不等于 | 高, 正常, 低 |\n| 到, 抄送, 密件抄送 & 到和抄送 | 包含,\
  \ 不包含, 等于 & 不等于 | |\n| 正文或主题 | 包含, 不包含, 等于 & 不等于 | |\n| Internet 域 | 包含, 不包含, 等于\
  \ & 不等于 | |\n| 大小 | 小于, 大于, 等于, 不等于 | |\n| 窗体 | 包含, 不包含, 等于 & 不等于 | 注意：窗体的一个示例是备忘窗体\
  \ |\n| 黑名单, 白名单 | 包含, 不包含, 等于 & 不等于 | |\n| 所有文档 | 无可用选项 | |\n\n> **所有文档** 条件允许我们在规则启用时，对到达我们邮箱中的所有消息执行操作。例如，我们可以选择\
  \ **所有文档**，并指定在办公室外时将我们收到的所有电子邮件的副本发送到备用电子邮件地址。\n\n- 4. 添加一个条件后，我们可以添加更多条件和/或异常。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_98_0.png)\n\n- 5. 我们可以随时使用屏幕右侧的按钮 **删除**\
  \ 或 **全部删除** 条件。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_98_1.png)\n\n> 添加要检查的文本时，请勿使用引号。文本不区分大小写。\n\
  \n- 6. 输入条件后，下一步是 **指定操作**。规则有多个可用操作，我们可以添加多个操作。可用操作列表如下：\n\n| 操作 | 选项 | 其他选项 |\n\
  | :--- | :--- | :--- |\n| 移动到文件夹 | 选择要移动到的文件夹 | |\n| 复制到文件夹 | 选择要复制到的文件夹 | |\n|\
  \ 发送副本给 | 完整或仅标题 | 输入要发送到的姓名 |\n| 设置过期日期 | 数字 | 天, 周, 月, 年 |\n| 将重要性更改为 | 高, 正常,\
  \ 低 | |\n| 停止处理 | 无可用选项 | |\n| 删除 (不接受消息) | 无可用选项 | |\n\n> > **发送副本给** 是一个很好的选项，可在我们办公室外时允许另一个人管理我们的邮件。他们收到消息副本，而我们仍然收到原始邮件。\n\
  \n- 7. 单击 添加操作。\n- 8. 单击 确定 关闭对话框；规则现已启用。\n\n从选项可以看出，规则非常广泛。创建后，规则按其在 规则 文件夹中出现的顺序（从上到下）执行。我们可以通过使用\
  \ 规则 文件夹顶部的按钮将规则上移或下移来更改规则顺序。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_99_0.png)\n\
  \n我们可以随时编辑或禁用规则，如果不再需要，也可以删除规则。\n\n## 邮件大小指标和配额\n\n在某些组织中，邮件管理员可能会设置配额，以帮助管理用户邮件的大小。如果设置了配额且我们的邮件大小超过设定限制，我们将看到警告消息，告知我们已超过配额。此外，发送给我们的新邮件可能会被延迟，并且在我们将邮件大小减小到低于配额之前，可能无法保存已发送的邮件。如果启用了配额，我们将在邮件左上角看到一个指示器，如下面的屏幕截图所示。\n\
  \n当我们访问存储在服务器上的邮件时，邮件配额状态指示器显示为温度计。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_99_1.png)\n\
  \n当我们访问本地副本时，邮件配额状态指示器显示为被温度计重叠的信封：\n\n\n\n将鼠标悬停在任一指示器上，将显示一个摘要，其中包含温度计、当前邮件数据库大小和配额以及邮件服务器名称：\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_100_0.png)\n\n## 减小邮件大小的提示\n\n管理邮件可能是一项麻烦事。以下是一些可能有助于减小邮件大小的提示。\n\
  \n- **删除邮件：** 按大小对单个邮件文件夹和视图进行排序，以找出并删除不再需要的最大邮件。执行此操作的一个好位置是“所有文档”，因为它包含所有已发送、已归档和已接收的邮件。删除邮件后，请确保进入“垃圾箱”文件夹并清空垃圾箱。\n\
  \n- **存档邮件：** 如果启用了存档，请存档不再活动的邮件。存档将在本章后面讨论。\n\n- **更改保存已发送邮件的首选项：** 如果保存已发送邮件的首选项设置为“始终”，则我们可能不必要地保存许多已发送邮件，因为我们发送的每条邮件都会保存在我们的邮件中。考虑将设置更改为“始终提示”，这样每次发送邮件时都会提示我们是否要保存它。如果选择“否”，则该邮件将无法在我们的邮件中访问。如果在发送邮件时选择“发送并归档”选项，则该邮件将自动保存。\n\
  \n- **文件附件设置：**\n  - 回复包含文件附件的邮件时，使用“仅回复历史记录”选项，该选项会删除附件但保留原始文本。\n  - 为防止在邮件中接收大附件，我们可以创建一条规则，指定如果大小（字节）大于（我们选择的数字），则删除。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_100_1.png)\n\n## 存档\n\n如上所述，存档是减小邮件大小的一个绝佳解决方案。当我们设置存档时，它会创建当前邮件应用程序的副本，并将其本地存储在计算机上。它会在\
  \ Windows 资源管理器中创建一个名为 Archive 的新目录。如果我们需要备份存档应用程序，并且命名约定保持默认值，则可以在 Windows 资源管理器的\
  \ IBM\\Lotus Notes\\Data\\Archive 目录中找到它。\n\n我们可以从侧边导航器中的邮件文件访问存档数据库，如下所示：\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_101_0.png)\n\
  \n若要打开我们的存档，请在侧边导航器中展开“存档”，然后选择要打开的存档。在上述屏幕截图中，唯一可用的存档是 Mail 2008。打开后，存档应用程序几乎与我们当前的邮件相同（不含所有邮件）！它看起来略有不同，因为存档应用程序是黄色的，并且标题不同，如下一张屏幕截图所示：\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_101_1.png)\n\n在存档之前，我们必须配置存档设置（我们将稍后介绍）。我们可以拥有多个存档数据库。有些人每年都有一个存档数据库。其他人则倾向于只有一个存档数据库。决定存档数量的一个考虑因素是大小。如果我们想备份存档应用程序，可能需要控制大小，因此需要拥有多个存档。\n\
  \n### 设置存档\n\n设置存档非常简单，请按照以下步骤操作：\n\n1. 在“操作 | 存档 | 设置...”下访问存档菜单选项。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_102_0.png)\n\
  \n2. 单击右侧的“创建...”按钮。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_102_1.png)\n\n\
  3. 这将打开“创建存档条件”对话框。在此处，我们有四个部分需要完成：\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_102_2.png)\n\
  \n   i. 为存档数据库指定一个描述性名称，并选中 **启用此条件**。启用条件后，将在邮件侧边导航器中显示指向新存档的链接，如我们之前的示例所示，即 **邮件\
  \ 2008**。\n\n   ii. 单击 **选择条件...** 按钮，以确定我们想要存档的频率和文档。默认值为 **超过 365 天未修改**。我们可以更改这些选项。\n\
  \n   iii. 接下来，我们需要决定 **对所选文档应执行的操作**。默认值是 **将文档复制到我在此处指定的存档应用程序**，然后 **清理此应用程序**。另一个选项是\
  \ **仅清理此应用程序而不进行存档**，但不建议这样做，因为如果需要，无法检索已删除的文档。\n\n   iv. 最后，**要如何清理此应用程序中的文档**提供两个选项。第一个选项是从当前邮件中完全删除文档，这样我们就只能从存档应用程序访问该文档。第二个选项是在当前邮件应用程序中保留文档的子集或摘要。这可确保我们在当前邮件文件中看到归档文档，且归档文档上带有蓝色摘要图标，表示该文档已被存档，并且附件已被删除，或者附件已被删除且原始消息中保留\
  \ 40KB 文本。此选项的优点是，我们可以在当前邮件文件中打开归档文档，并选择 **操作 | 打开归档的文档**；这将打开包含所有原始数据的原始消息，这些数据现在存储在我们的存档应用程序中。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_103_0.png)\n\n4. 单击“确定”以关闭。随后，系统将提示我们，要使用启用的条件，必须通过在“操作\\\
  存档”菜单下选择 **立即存档** 选项，或单击 **是** 按钮来安排存档。计划将在我们分配的时间自动执行存档。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_104_0.png)\n\
  \n如果我们通过单击 **否** 按钮选择不安排存档，则在创建存档应用程序之前需要手动存档一些文档。\n\n存档有四种方式：\n\n- **操作 | 存档 |\
  \ 立即存档**：这将存档符合存档条件的文档。\n- **操作 | 存档 | 归档所选文档**：这将存档我们当前选定的任何文档。\n- 让计划存档根据存档条件进行存档。\n\
  - 将文档拖放到侧边导航器中的存档数据库。\n\n> **最近归档的文件夹**：我们可以通过在存档中打开 **最近归档** 文件夹，轻松找到最近存档的邮件。存档邮件的主题行显示\
  \ **（已归档）**，标题中包含存档邮件的日期，这非常方便。\n\n随时可以通过选择 **操作 | 存档 | 设置** 来 **编辑**、 **删除** 或\
  \ **禁用** 每个数据库的设置。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_104_1.png)\n\n在存档设置中，我们将看到“高级”选项卡，如下一张屏幕截图所示：\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_105_0.png)\n\n在此区域中，默认情况下，只有在能够删除所有回复的情况下，存档才会删除文档。响应的一个示例是对电子邮件的回复。保持此选项被选中后，我们将始终能够显示整个对话。\n\
  \n还有一个选项是“将所有存档活动记录到日志应用程序”。每次发生存档时，这都会生成一份报告，并可以包含指向实际存档文档的链接。日志是一个单独的应用程序，并存储在“高级”选项卡中列出的路径中。\n\
  \n## 邮件首选项\n\n在本章和前一章中，我们设置了许多邮件首选项，以特定方式配置我们的邮件。例如，我们可能已启用拼写检查，以便在发送备忘录时自动检查拼写。我们还可能设置了发件人颜色，因此特定人员的邮件将以不同颜色突出显示。邮件首选项可以从“文件\
  \ | 首选项 | 邮件”菜单访问，也可以在“邮件”中单击“更多”按钮并选择“首选项”。\n\n从“文件 | 首选项 | 邮件”选项访问邮件首选项，可让我们配置更多区域，因为我们可以设置\
  \ Internet 选项以及发送和接收首选项。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_105_1.png)\n\
  \n在“邮件”中使用“更多”按钮访问首选项，然后选择“首选项”，将为我们提供以下可选选项卡：\n\n\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_106_0.png)\n\
  \n## 信头\n\n本章中，如前所述，我们已了解如何配置上一张屏幕截图中每个选项卡上列出的大多数首选项。在“基本”选项卡中，我们有启用拼写检查以及查看和文件夹管理的选项。在“签名”选项卡中，我们可以设置签名以附加到我们发送的每个备忘录。“后续跟进”和“发件人颜色”选项卡允许我们配置快速标记选项，并对特定发件人的消息进行颜色编码。\n\
  \n我们尚未查看的首选项是信头。我们可能已经注意到，在创建消息时，备忘录的标题通常会包含一个图形，如下一个带有枫叶的示例所示：\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_106_1.png)\n\
  \n我们可以通过进入邮件首选项，单击信头选项卡并浏览不同的信头选项来更改此图形。对于我们选择的每个图形，右侧有一个预览屏幕。我最喜欢的之一是冲浪板。如果我们愿意，可以选择无信头。\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_106_2.png)\n\n信头仅在组织内部可见。当消息发送到外部时，信头会被删除或作为附件发送。如果我们不希望信头在发送给外部人员时变成附件，请不要忘记无信头选项。\n\
  \n## 上下文菜单（右键菜单）\n\n上下文菜单提供了常用功能的快捷方式，例如：\n\n- 快速标记：为消息添加标记\n- 移动到文件夹...：允许我们将消息归档到文件夹中\n\
  - 标记为：提供将消息标记为“已读”或“未读”的选项\n- 将发件人添加到联系人...：在我们的联系人中创建发件人联系人\n- 回复：提供回复消息发件人的选项\n\
  - 全部回复：提供回复消息发件人以及抄送和密件抄送字段中收件人的选项\n- 转发：转发包含历史记录和附件的消息\n- 复制到新建：提供将消息复制到另一条消息、日历条目或待办事项的选项\n\
  - 在新窗口中打开：在新窗口中打开当前选定的消息\n- 打印...：打开打印对话框\n- 删除：将消息移动到“垃圾邮件”\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_107_0.png)\n\
  \n## 添加表格和节\n\n表格可以添加到消息和文档中，节亦如是，如下文所述。\n\n## 表格\n\n表格是输入数据的绝佳工具。我们可以使用制表键在单元格之间移动。在\
  \ Mail 中创建信纸时，我经常使用表格，因为我发现它们更容易布局我的消息。\n\n以下是我们可以在 Lotus Notes 中创建的表格示例。创建表格时，我们可以看到“表格”菜单，从中可以选择表格属性。在表格属性中，我们可以为单元格选择颜色、单元格边框大小和样式，添加诸如投影阴影之类的边框效果，甚至可以创建动画表格。\n\
  \n| 产品 | 零件名称 | 零件编号 | 单位成本 |\n| :--- | :--- | :--- | :--- |\n| ![产品图片] | 巴克·罗杰斯棕色火箭\
  \ | 100-012-AA | $1,500.00 |\n| | 绿色星球 | 100-012-5B | $1,680.00 |\n| | 滑流粉色 | 100-012-CC\
  \ | $600,000.00 |\n| | 太空包 | 100-012-CC | $2,651,886.00 |\n\n## 节\n\n节有助于在文档中组织文本。例如，如果我要向\
  \ Lotus Notes 文档添加策略信息，我可能希望将文本组织成不同的段落。然后，我可以将这些段落添加到节中，这些节会将文本折叠为标题。当某人想要阅读该段落的内容时，他们单击标题，即可展开该节。这会总结文档，并让人们快速识别感兴趣的段落。\n\
  \n节可以是展开或折叠状态。我们还可以在节中创建节。以下屏幕截图显示了“Acme 清洁产品”节正在展开。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_108_0.png)\n\
  \n## 打印文档\n\n在 Lotus Notes 中，我们可以打印文档和视图。\n\n- 1. 要打印，首先我们需要选择要打印的文档，然后选择“文件 | 打印”或按\
  \ Ctrl+P。\n- 2. 选择打印机，单击“设置”按钮以选择双面选项等。\n- 3. 在“打印内容”窗口中，我们可以确定打印的显示方式。我建议选择每个选项并单击“预览”按钮进行查看。\n\
  - 4. “质量”选项卡允许我们选择首选项。\n- 5. “副本”选项允许我们选择要打印的副本数量。\n\n### 打印内容部分\n\n在打印对话框中有一个“打印内容”部分，如下图所示：\n\
  \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_109_0.png)\n\n可以选择以下任何选项：\n\n- **按屏幕显示的布局**：将打印屏幕上显示的所有内容。\n\
  - **选定的视图**：将按视图中列出的方式打印文档。如下例所示，将打印“日期”列和“主题”列：\n\n| 日期 | 主题 |\n| :--- | :--- |\n\
  | | v iPad (Karen Hooper) |\n| | 不认为它会销售 (Karen Hooper 14/04/2010) |\n| | 我们有了这个想法\
  \ (Karen Hooper 15/04/2010) |\n\n- **选定的文档**：将分别在单独页面上打印选定的每个文档。\n\n> 别忘了预览我们即将打印的内容。\n\
  \n## 摘要\n\n在本章中，我们探索了 Lotus Notes 中可用的邮件工具。其中许多工具旨在帮助我们更高效地工作。例如，为消息标记或标记为后续跟进可以帮助管理收件箱，使用信纸可以通过准备好现成的电子邮件模板来节省时间，在拼写检查器的个人词典中添加签名的简单技巧可以避免每次发送消息时都出现拼写检查提示，等等。规则也非常强大，是一个绝佳的工具。希望能充分利用这些工具并将它们投入使用！\n"
