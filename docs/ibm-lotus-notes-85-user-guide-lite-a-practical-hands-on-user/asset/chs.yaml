  Karen 拥有 13 多年 Lotus Notes 和 Domino 的经验，从 4 版到 8.5.1 版。Karen 参与过多个重大升级项目和公司范围的培训计划。她负责为多个组织定制并制作最终用户和帮助台培训材料。对
