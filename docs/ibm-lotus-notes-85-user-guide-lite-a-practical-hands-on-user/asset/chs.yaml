  我们之前提到，永久笔和高亮笔是回复消息时极佳的工具，因为它们能让我们以不同颜色显示文本，也能对文本进行高亮显示。工具栏中还有 文本颜色 图标；选中文本或将光标置于想要更改颜色的位置，然后单击此按钮以选择颜色。


