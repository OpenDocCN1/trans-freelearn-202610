    industries. Susan has a Bachelor''s degree in engineering and a Master''s degree
    in Information Technology. She holds certifications in all current Lotus Notes
    and Domino product releases, and is actively involved in quality testing Beta
    versions of new IBM products. Susan is a frequent speaker at technical conferences,
