- pgno: 14
  md: '# Preface


    Lotus Notes is quite a number of "things", including e-mail, calendar, To Dos
    (tasks), chat, RSS Feeder, an applications platform, and more. Many of us will
    use Lotus Notes for most of our working day; and being able to use it more efficiently
    is a gain in our hectic work life. Many of us want to use tools and features to
    save time, but often we are unsure of how to master those tools and features.


    This short, fast-paced book enables business users to master the Client Interface
    and Mail features of Lotus Notes simply and effectively. Using clear explanations
    and instructions with explicit screenshots, this book gives business users a deeper
    and clearer understanding of basic functionality, providing the answers to many
    questions that are encountered while sending mails and working with Lotus Notes
    applications.


    This book is a LITE edition of a longer book, IBM Lotus Notes 8.5 User Guide.
    The full edition provides comprehensive coverage of Lotus Notes.

    To find out more about upgrading to the full edition, visit www.packtpub.com/liteupgrade
    and log into your account for offers and help. If you don''t have an account on
    PacktPub.com, visit today and set one up!


    # What this book covers


    Chapter 1, First Impressions (The Client Interface), explores and explains what
    we first see and how we work with what we see when we open Lotus Notes.


    Chapter 2, Mastering Lotus Notes Mail, helps us understand mail in more detail.


    Chapter 3, Lotus Notes Mail Tools, focuses on the advanced features available
    in Mail and how we can best utilize them to assist us in being efficient with
    mail management.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# What you need for this book


    Lotus Notes is a multiplatform client application and is available in several
    languages. In this book, we have specifically covered the attributes of Lotus
    Notes 8.5 English client installed on a Windows operating system. As it is a client-server
    application, it works in conjunction with a Domino server. When we install and
    configure the client software, it will prompt us for our user name and home server.
    If we are performing these steps, we need to make sure we have these details,
    or we can contact our IT Department to determine what is required.


    # Who this book is for


    This book is suitable for anyone who uses Lotus Notes, from beginners to seasoned
    professionals who have used it for years. Often we are creatures of habit, even
    if those habits are the long way around of doing things. This book aims to cover
    the features and tools that enable us to work smarter. Also, there are significant
    changes from the earlier versions of Lotus Notes to the current version of 8.5.
    This book covers the new features in detail so that we will be able to take advantage
    of them as well; it also covers key features from earlier versions that have stood
    the test of time.


    # Conventions


    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles, and an
    explanation of their meaning.


    **New terms** and **important words** are shown in bold. Words that you see on
    the screen, in menus or dialog boxes for example, appear in our text like this:
    "We should see icons with a title for each icon such as **Mail**, **Calendar**,
    or **Contacts**."


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_15_0.png)


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_15_1.png)'
  merge: -1
  img_proc: true
