- pgno: 18
  md: '# # First Impressions


    (The Client Interface)


    First impressions always count and, when you start Lotus Notes, there is no exception.
    You might notice that Lotus Notes is much more than just e-mail! There are many
    feature-rich tools available – for example, there is a free office suite application
    called Lotus Symphony that can be used as an alternative to Microsoft Office for
    those who just need the basics with an office suite. You will see the ability
    to create documents, spreadsheets, and presentations if Symphony is selected while
    installing Lotus Notes. You can also export each of those documents to PDF, HTML,
    or JPEG format if required.


    Lotus Notes also has a Notebook application. This application allows you to create
    notes that can include pictures, attachments, ideas, and so on. It is a great
    place to store information that is just for you. It also has an inbuilt chat and
    presence capability called Sametime, along with an inbuilt RSS feed reader, a
    Widget panel, calendaring and scheduling capabilities, and applications if your
    organization has developed any or purchased them.


    In this chapter we will focus on the client and will explore the following:


    +   - Starting and shutting down Lotus Notes

    +   - Open List

    +   - Thumbnails

    +   - Home Page

    +   - Shortcuts

    +   - Window tabs

    +   - Toolbars

    +   - Sidebar

    +   - Lotus Notes Browser

    +   - Preferences'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Starting Lotus Notes—start your engines


    Starting Lotus Notes is similar to starting any application on your computer;
    simply go to Start | Programs | Lotus Notes. You may also have a shortcut to Lotus
    Notes in your taskbar or on your desktop.


    # Password prompt


    As Lotus Notes is starting up, in most cases we will be prompted for a password.
    Lotus Notes is a very secure program; it requires us to verify that we are who
    we say we are, the same as when we use our PIN number with our ATM card. There
    are variations that can occur with the security within Lotus Notes in some organizations.
    Lotus Notes may start without a password prompt but be assured the security is
    still just as strong.


    The following is an example of the password prompt dialog box. In the User name
    field, our name will be listed. Other names may be listed as well if there are
    multiple people using Lotus Notes on the PC. The At location field is where we
    select the location we are currently accessing Lotus Notes from. For example,
    we may be in the office or working remotely. If we have forgotten our password,
    we can expand the Forgot your password section as shown in the dialog box for
    instructions on what we need to do.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_19_0.png)


    # Closing Lotus Notes


    To close Lotus Notes, select either File | Exit or click the red X in the top
    right-hand side. Be aware that one needn''t close all the open window tabs before
    shutting down. For example, if we have our mail and calendar tabs open, we can
    leave these open; so, when we start Lotus Notes again, our e-mail and calendar
    tabs will be open ready for us. This option is controlled via a preference that
    is set by default; it can be turned off if one wishes. To turn off this preference,
    go to File | Preferences | Windows and Themes and uncheck the On restart, reopen
    any tabs that were open when I closed the client option.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '> When we close Lotus Notes and are in the middle of replying to an e-mail
    or creating a new calendar entry, Lotus Notes will prompt us to confirm if we
    want to send or save; so never fear, we won''t lose any work!


    # Exploring the interface—where, what, and how


    When we open Lotus Notes, we won''t just see mail; there is the homepage that
    points us to important applications such as our Mail, Calendar, and even a Notebook.

    There is the Sidebar which, if enabled, is a valuable resource for interfacing
    with our calendar, RSS feeds, and Sametime contacts. There are many options to
    explore, so let''s begin.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_20_0.png)


    # Window tabs


    When we open an application in Windows, we will see it in the taskbar at the bottom
    of our computer screen (unless we have changed that option). When we open our
    e-mail or a message in Lotus Notes, a window tab appears for each opened item
    at the top, just under our menu options.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'We can choose how we would like our window tabs to appear in Lotus Notes; these
    choices can be selected under File | Preferences | Window and Themes. The available
    choices are:


    +   - **Open each document in its own window**: This option ensures that these
    windows appear in the taskbar of Windows — same behavior as Microsoft Outlook.


    +   - **Open each document in its own tab**: This is the default setting in Lotus
    Notes.


    +   - **Group documents from each application in a tab**: This is a great option
    if we want to keep our tabs more organized. The following is an example of this
    option. For the calendar, there are two pages open — **Mary Johnson - Calendar**
    and the **Weekly Management Meeting** calendar entry. If we select this option,
    the new way to close window tabs is the red X icon at the far right side of the
    window tab bar.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_21_0.png)


    If we have selected to group our tabs, then we will have an option to close the
    group when we right-click on the tab.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_21_1.png)


    > To close all currently opened window tabs, select **File | Close All**. An alternative
    way to close an opened window tab is to press the **Esc** button on the keyboard.


    Window tabs can be rearranged by dragging them into a preferred position.


    We can switch to a different window tab by pressing **Alt+W**. This will display
    a number for each window tab currently opened; type the number of the window tab
    we want to open.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Open List—better known as the button that says "Open"


    As previously mentioned, Lotus Notes is more than just e-mail and calendar. A
    company can have several Lotus Notes applications that they use to track or store
    information. We might have created some applications of our own. So, how do we
    access these applications including mail, calendar, and so on? By clicking the
    Open button of course!


    If we have Lotus Notes open, why don''t we give it a try and click on the opened
    list? We should see icons with a title for each icon such as Mail, Calendar, or
    Contacts.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_22_0.png)


    If we wish to open mail, we can select Mail. We will see Mail highlight as shown
    next; we can then click the left mouse button to open.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_22_1.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The Open list can be customized in the following ways:


    +   * Right-click to select the **Dock the Open List** option. This will remove
    the Open List and instead show a bar called the Bookmark Bar positioned on the
    left-hand side of Lotus Notes with the icons but no title; we need to highlight
    each icon to see the title of the icon.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_23_0.png)


    +   * Right-click to select the **Use Large Icons** option; this will change the
    size of the icons to large.


    +   * If we wish to add a particular application, a message, or even stationary
    to our Open List, simply open the application or message and drag the window tab
    of the opened application or message to the Open List or the Bookmark Bar. This
    is similar to adding websites as Favorites in Internet Explorer. For example,
    to add the Notebook application to the Open List, open the **Notebook** application,
    click on the **Notebook** window tab as shown in the next screenshot, and then
    holding your left mouse button, drag to the Open List or Bookmark Bar.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_23_1.png)


    +   * We can also search the Open List, by simply typing what we are looking for
    in the **Type to find** field just below the **Open** button.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Thumbnails


    Thumbnails, when clicked, show a graphical presentation of what is currently open
    in Lotus Notes. A screen will open showing each window tab that is open. Thumbnails
    are located next to the Open List as shown in the next screenshot; the shortcut
    to open is Ctrl+Shift+T.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_24_0.png)


    The following screenshot represents what thumbnails look like when opened:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_24_1.png)


    # Homepage


    The Home page has links to open Mail, Calendar, Contacts, To Do, and the Notebook
    application. We may also see options to create new documents, presentations, and
    spreadsheets; these are available if we have Symphony installed.


    The following is a screenshot of the Home page:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_24_2.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'The Home page can be customized in a variety of ways. Select the option Click
    here for Home Page options, which is at the top of the Home page.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_25_0.png)


    > A cool feature of the Home page is the Notebook application. The name describes
    exactly what it is – a place where one can enter notes. No one else has access
    to our Notebook, so the information we enter is private. On the Home page, click
    on New to create the Notebook. Once the Notebook is created, the New button will
    create a document where we can enter notes in the Notebook.


    # Shortcuts


    On the Home page, you will see a shortcut to open a list of shortcuts!!!


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_25_1.png)


    The next screenshot shows the shortcut list:


    | Back | Alt+Left |

    |---|---|

    | Bold | Ctrl+B |

    | Break | Ctrl+Break |

    | Center Caret | Ctrl+Y |

    | Close | Esc |

    | Collapse All | - |

    | Collapse Selected Level | - |

    | Compose Mail | Ctrl+M |

    | Context Sensitive Help | F1 |

    | Copy | Ctrl+C |

    | Cut | Ctrl+X |


    My favorite shortcut is Ctrl+M which, when selected, creates a message from anywhere
    within Lotus Notes. This comes very handy and quick as we don''t always have to
    open our mail to create a message.


    For a more extensive list of shortcuts, select Help | Help Contents | Lotus Notes
    | Keyboard shortcuts.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# # Toolbars


    Toolbars are positioned under the window tabs and provide shortcuts to menu options.
    Toolbars within Lotus Notes can be repositioned, customized, and created. The
    following is an example of repositioning a toolbar:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_26_0.png)


    By default, many toolbars are context sensitive, which means they appear only
    when they are needed. For example, we see only the Editing Toolbar when we are
    typing text in a document. When we are in our Inbox, the Editing Toolbar is grayed
    out and not available to be selected. To see a list of available toolbars, right-click
    in the toolbar area. From this area we can select which toolbars we want to display
    in the toolbar area.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_26_1.png)


    To customize a toolbar, right-click in the toolbar area and select Toolbar Preferences;
    from within here we can customize and create our own toolbars. Alternatively we
    can access toolbar preferences under File | Preferences | Toolbar | Customize.


    # ## Search toolbar


    One toolbar which should be explored is the Search Toolbar. If we are in our mail
    and we want to search for a word within the subject, the body of the message,
    or the address fields, then simply type the word in the Search Toolbar and then
    select the Enter key or click the magnifying class icon. The search will occur
    on all documents in our Mail including our Inbox, Sent folder, Drafts, and personal
    folders.


    We can also search our Calendar and Contacts and even do a Yahoo or Google Search.
    Each search that we perform is saved under Recent Searches.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'To perform a search in our mail, type the words we are searching for in the
    Search All Mail toolbar. If we are in our Calendar, the search will be performed
    in the Calendar and so on. Once we have typed the word, click on the magnifying
    icon to start the search.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_27_0.png)


    Alternatively we can click the icon in the Search Toolbar to show the drop-down
    menu. This option allows us to choose different places to search. In the example
    shown in the following screenshot, the search would be performed in All Mail as
    this is the option selected:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_27_1.png)


    To perform the search, click the magnifying class icon or press the Enter key.
    A new window tab will open with the results of the search and it will also show
    all recent searches.


    # Search preferences


    We can change the preferences available for searching. Go to File | Preferences
    | Search. In this area we can enable Search History, which is ON by default. There
    is also a button that we can select to clear history.


    By default when we perform a web search, the results will be presented in the
    embedded browser in Lotus Notes. We can change this preference by deselecting
    Use embedded browser to display Search Center web search results. If this preference
    is not selected, the web search results will show in our default web browser.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'We can change what is displayed in the search list. Go to File | Preferences
    | Search | Search List. We will see a list of what we are able to select; we can
    then check or uncheck the available options.


    Finally, we can add our applications to the Search drop-down list. In the following
    screenshot, I have added Karen''s Training Resources application to the Search
    drop-down list. To do this I opened the application, clicked the Search drop-down
    list in the Search toolbar, and then selected the option to Always Show in Search
    List. I can now, from anywhere in Lotus Notes, perform searches in the application
    by selecting the option in the Search toolbar.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_28_0.png)


    > One of the search options listed is Windows Search. This option searches our
    local drives and returns to the search view in Lotus Notes, links to the files
    it has found.


    # SideBar


    The sidebar is located on the right-hand side of the Lotus Notes screen. It contains
    some of our key applications such as calendar, Sametime (which is IBM''s chat
    application), and our RSS Feeds as well as Widgets and Activities. The concept
    of the sidebar is that one can be in his/her inbox working and see on his/her
    right-hand side what is on the calendar today in the Day-At-A-Glance panel of
    the sidebar.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'What is available in our sidebar is determined by what has been made available
    in our organization. For example, our organization may not have enabled RSS Feeds;
    if this is the case, we will not see the Feeds panel in the sidebar. The following
    is a screenshot of the sidebar. This sidebar has three panels: Feeds, Day-At-A-Glance,
    and Sametime Contacts.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_29_0.png)


    The sidebar has three states or three ways it can be viewed – open, closed, and
    thin:


    +   - Open allows us to see all your sidebar options.

    +   - Closed means it is not visible. We will have to click the small white arrow
    shown in the next screenshot to open.

    +   - Thin means we see only available icons. We can click an icon to open the
    sidebar. The following screenshot shows the sidebar in the thin state:'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/dc4e954e82cbb69d6ea9b87ab543c676_30_0.png)


    Our sidebar can have the following components:


    +   * **Sametime Contacts**: Sametime is IBM''s chat application. From within
    the sidebar, we have all the Sametime capabilities available to us such as seeing
    our contacts and, if they are available, being able to chat with current contacts
    and add or remove contacts, along with many other features. We may not see this
    option in the sidebar if Sametime has not been enabled in our organization. The
    next is a screenshot of what Sametime looks like in the sidebar. Sametime is discussed
    in detail in the next chapter.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_30_1.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   • Day-At-A-Glance: This shows the current days calendar entries such as
    meetings, appointments, and so on. We can use the arrows to go back or forward
    through the days or click in the calendar below to select a different day to view.
    If we double-click any of the calendar entries, it will open that entry. Alternatively
    we can right-click and select the Open in New Window option.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_31_0.png)


    +   • Feeds: This shows RSS Feeds we have subscribed to. In this section, we can
    also manage and add new feeds. This is explained in detail in Chapter 3, Feeds.


    +   • Activities: This application helps organize our documents under categories.


    +   • Quicker: This is a document management application that integrates with
    Lotus Notes.


    We can change which of these applications is displayed in our sidebar. Each of
    the panels includes a panel menu that we can use to manipulate the panel (including
    floating or removing the panel), as well as context commands for the application.


    # Lotus Notes browser


    Within Lotus Notes, there is an inbuilt browser or embedded browser. The browser
    allows us to open and navigate web pages directly from within Lotus Notes.


    We can change which web search engine the embedded browser uses in its search
    bar by clicking File | Preferences | Search, and then clicking a search engine
    in the list.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/dc4e954e82cbb69d6ea9b87ab543c676_32_0.png)


    We can open the browser by:


    +   - Clicking the Open button and then clicking Web browser. We can repeat this
    step if we want to have more than one browser page open.

    +   - Typing a web address (URL) into the Address toolbar, and then clicking the
    Go button, which is to the left of the Print button. If the Address toolbar is
    not showing, right-click in the toolbar area and select Address. If we want to
    bookmark the page we have just opened, select Create | Bookmark.


    From within the embedded browser toolbar, we can:


    +   - Navigate to the previous page by clicking Back.

    +   - Navigate to the next page by clicking Forward.

    +   - Stop the web page from loading by clicking the Stop button.

    +   - Reload the web page by clicking the Refresh button.

    +   - Return to the page that is set as our Home page by clicking the Go home
    button.

    +   - Print the web page that is displayed by clicking the Print button.

    +   - Change the page settings for printing the displayed web page by selecting
    the down arrow next to the Print button and then clicking Page Setup.

    +   - Preview how the displayed web page will look printed by selecting the down
    arrow next to the Print button and then clicking Print Preview.


    The following is the browser toolbar:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_32_1.png)


    Lotus Notes uses the embedded browser by default. We can disable it by accessing
    File | Preferences, clicking Web Browser, and then checking the Use the browser
    I have set as the default for this operating system option. This will mean that
    Lotus Notes will use Internet Explorer or Firefox for browsing.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # Preferences


    There are many options that we can select to personalize Lotus Notes. Some preferences
    may be set on one''s behalf by the company''s IT department as they have a set
    of policies that they can set that determines almost all of the possible preferences
    and features that might be available. For example, the IT department can set a
    policy for whether or not to show the Open List as a button, or whether to show
    it as docked.


    We can customize Lotus Notes so that it operates and displays just the way we
    want it to. The following is an example of some of the available preferences:


    +   * Basic settings that determine the look and feel of our Lotus Notes client

    +   * Our Mail, Calendar, To Do, and Contacts applications

    +   * Replication

    +   * Lotus Sametime

    +   * The IBM Lotus Symphony such as Spreadsheets (if available)

    +   * Activities or Websphere Portal accounts (if an organization uses them)


    We have already explored some of the preferences available such as window and
    themes and toolbar preferences.


    To access preferences, select File | Preferences. There are numerous preferences
    that can be set; to simplify finding a particular preference, type the name in
    the field at the top of the preferences dialog box as shown in the following screenshot:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_33_0.png)


    An excellent preference to enable is the Document AutoSave, which is available
    under the Basic Notes Client Configuration option.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_33_1.png)


    To enable, just check the box next to the AutoSave every field and then select
    the minutes. The default time is 15 minutes; in the following screenshot I have
    changed the time to 8 minutes.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/dc4e954e82cbb69d6ea9b87ab543c676_34_0.png)


    Once enabled, Lotus Notes can automatically save documents we are working on to
    prevent loss of data due to a system crash or power outage.


    AutoSave is available within our mail file and any other databases that have been
    upgraded and the AutoSave options that have been enabled.


    If a crash has occurred, on restarting Lotus Notes we are prompted to recover
    documents; if we select Yes, we will then be prompted with the following choices:


    +   • **Recover**: This option will open the selected document and then close
    the dialog box.


    +   • **Recover All**: This option will open all documents listed and close the
    dialog box.


    +   • **Remove**: This option will remove the selected document from the AutoSave
    database.


    +   • **Remove All**: This will remove all documents listed from the AutoSave.


    There is a manual option to recover documents. If we choose to say **No** to the
    prompt received when we first open Lotus Notes after a crash, we can at any time
    select the option to recover documents by selecting **File | AutoSave | Recover
    AutoSaved Documents**.


    # ## Summary


    In this chapter, we have explored the client interface of Lotus Notes, including
    the Open List, the Home Page, and the Sidebar as along with many other options.
    We should now be familiar with:


    +   • Using the Open List and Thumbnails


    +   • Features of the Home Page


    +   • Available shortcuts (remember Ctrl+M creates a message)


    +   • Use of the Sidebar


    +   • Working with window tabs


    +   • Toolbar options


    +   • Preferences that assist you in customizing Lotus Notes to the way we want
    it


    In the following chapters we will explore preferences further.'
  merge: -1
  img_proc: true
- pgno: 35
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Mastering Lotus Notes Mail


    Electronic mail is one of the most important forms of communications important
    forms of communication corporately as well as socially. Known by many names such
    as mail, e-mail, a memo, or a message, it is a convenient way of communicating,
    sending files, and reaching many people with one action.


    Mail is a business tool that we typically use on a daily basis. When the mail
    system is down, many times work grinds to a halt! Because it is a tool that we
    count on, it is imperative that we understand all of its capabilities. It is like
    having a car that can save gas if we enable particular features; however, unless
    we know how to enable the gas saving features, we will get from destination A
    to destination B but won''t be able to save gas!


    This chapter helps us understand mail in more detail and will assist us with becoming
    more efficient in how we use Lotus Notes mail. Time saving features will be explored
    both in this chapter and the next chapter. In this chapter we will discuss the
    following topics:


    +   - Accessing mail in Lotus Notes

    +   - Creating and replying to messages

    +   - Addressing messages

    +   - Editing tools

    +   - Attachments

    +   - Viewing Mail

    +   - Folders

    +   - Mail icons

    +   - Instant Spell checking

    +   - Blank subject warning

    +   - Signatures

    +   - Deleting mail'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Accessing mail in Lotus Notes


    The first step in exploring mail is to open mail in Lotus Notes. There are a couple
    of ways that we can open mail:


    +   First, from the Home page by clicking the Mail icon as in the following screenshot.
    If we click the New button, it will create a new message.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_37_0.png)


    +   Also, by clicking Open and selecting Mail from the list.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_37_1.png)


    # Creating and replying to messages


    In the following sections we will discuss how to create and reply to messages
    including reviewing message actions including setting delivery options.


    # Creating a message


    Once we have opened mail, we can create a message by clicking on the New button
    and then selecting Message as shown next. As we can see from the message drop
    down list, there are other options available such as Meeting, Contact, and so
    on that we can create.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_37_2.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Another way to create a message is by using the keyboard shortcut Ctrl+M. This
    can be done from anywhere within Lotus Notes, not just when we have mail opened
    – for example, we can create a message when we are in our Calendar, from within
    Contacts, or from the Home page using the Ctrl+M option.


    # Message actions


    Now that we have created a message, we will explore some of the message actions.
    Along the top of the message, we can see buttons that enable us to do certain
    things. The following is a screenshot of the available options. We will briefly
    explore each of these options.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_38_0.png)


    +   * Send: This speaks for itself; when clicked the message is sent!


    +   * Send and File...: This is an excellent option when sending messages, as
    it allows us to not only send the message but also to file the message into our
    folders at the same time. When we click Send and File..., we will see the Folders
    dialog box with all our personal folders available. The following is a screenshot
    of the Folders dialog box that appears when we select the Send and File option.
    We would select the folder we want to file the message into and then click either
    the OK button or press the Enter key. The message will be filed in the folder;
    it will also be automatically filed into Sent and All Documents. Note that this
    does not mean we have three copies of the message filed in the three locations.
    There is only the one copy of the message in our personal folder; Sent and All
    Documents. This means if we delete the message from our personal folder, it will
    be deleted from the Sent and All Documents.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_38_1.png)'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'When the **Folders** dialog box opens, if we know the name of the folder, we
    can start typing the folder name and that folder will be highlighted. Then if
    we press the _Enter_ key, the message will be filed into that folder. Typically
    this is a quicker option than scrolling, especially if we have several folders.
    When you type the folder name you can see what you have typed in the Status bar,
    you can delete what you have typed if you have made a typing error.


    +   * **Save as Draft**: This option saves our message into the Drafts folder.


    +   * **Delivery Options**: Include options such as mood stamps and prevent copying
    (we will look at this separately in the next section).


    +   * **Flag**: We can flag a message before sending it. We will explore flagging
    in more detail in the next chapter.


    +   * **Attachment**: Clicking this icon will allow us to add an attachment to
    our message. Note that we can also drag an attachment into the body of the memo
    from Windows Explorer; we will go into more detail later in this chapter regarding
    this capability.


    +   * **Display**: When we click on this button, we can see further options regarding
    how we want our messages to be displayed. We can select if we want to show the
    BCC field, **Additional Mail Options**, or **Sender Information**. The following
    is a screenshot of what we can see when we enable the **Additional Mail Options**
    option:


    | High importance | Return receipt | Sign | Encrypt | Mark Subject Confidential
    |


    +   * **High Importance** is indicated to the sender by a red exclamation mark.


    +   * **Return receipt** sends us a notification when the recipient/s have read
    or previewed the message.


    +   * **Sign** adds an electronic signature to the message to ensure it has not
    been tampered with.


    +   * **Encrypt** marks the message secret and can be read by only those whose
    name appears in the To, CC, and BCC fields.


    +   * **Mark Subject Confidential** prepends "Mark Subject Confidential" to the
    subject field.


    +   * **More**: This is the last message action, from here we can access **Preferences...**,
    **Out of Office...**, and so on as shown in the screenshot. We will explore these
    actions in detail, later in this chapter as well as in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '![](img/dc4e954e82cbb69d6ea9b87ab543c676_40_0.png)


    # Delivery options


    When we click the Delivery Options button in a new message, a dialog box opens
    with two tabs.


    Basic tab:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_40_1.png)


    Note the difference between Return receipt and Delivery report – the Return receipt
    option sends us notification when the person has read or previewed the message,
    whereas the Delivery Report option tells us when the message failed to reach the
    recipient, which is the default option Only on failure. Other options available
    are Confirm delivery or Trace entire path; the later option shows us the server
    route taken to deliver the message.


    Take the time to check out the Mood Stamps. I prefer adding the Good Job mood
    stamp to a message when I am congratulating someone. I often use the Confident
    mood stamp when I am sending a sensitive message. I will also select the Encrypt
    option that allows only those in the To, Cc, and Bcc fields to read it as well
    as Prevent copying which prevents people from forwarding, printing, copying to
    the clipboard and replying with history. Combining these options ensures the message
    is kept secure. The signing option adds digital signature to the message to confirm
    to the recipient the authenticity of the individual who has sent the mail.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Note that all three of these options typically work only for a message sent
    within our organization and may not be applied to messages sent to people external
    to us such as someone at another company.


    # Advanced tab:


    On the Advanced tab, there are options that allow us to add a Please reply by
    date. We can also select that replies to the memo go to another person or several
    other people. We can also add our name. Some organizations have shared mail files
    such as Sales where messages sent to sales at the company name will go into a
    central mail file. It is preferable to add those addresses, along with my own,
    to the Replies to this memo should be addressed to field so that those we work
    with are kept in the loop with particular communications.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_41_0.png)


    # Replying to messages


    We can reply to a message from our inbox or from within the memo. The reply options
    are:


    +   • Reply with History Only (default) and Reply to All with History Only: This
    option includes the history of the original memo but does not include the attachment(s).
    Reply to all will include everyone in the To; CC and BCC fields, the reply option
    only includes those in the To field.

    +   • Reply with History & Attachments or Reply to All with History & Attachments:
    This option includes the history of the original memo and the attachment(s).

    +   • Reply and Reply to All: This option does not include any of the history
    of the original e-mails or attachments.


    > When replying to messages, use the permanent pen function that adds our comments
    in a color that is different from the original message. We can also use the highlighter
    pen to highlight text in the original message for emphasis. Access the Permanent
    Pen and the Highlight Pen from within the Editing Toolbar.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Addressing messages


    We can address a message by either selecting a recipient''s name from our contacts
    or the Corporate Directory. We can also type names directly into the To, Cc, and
    Bcc fields. If we type names directly, Lotus Notes uses a type-ahead feature that
    completes names based on the first few letters we type.


    # How to address a message


    It is as simple as typing a person''s name but there are some other options available
    as follows:


    +   1. When we create a message, our cursor will automatically go to the To field
    in the new message. If we know the person''s name, we just need to type it and
    we will see a list of names appear. This list shows our most Recent Contacts as
    Lotus Notes keeps track of the people that we communicate with most often and
    moves those names to the top of our type-ahead list. Note that the list is not
    in alphabetical order.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_42_0.png)


    +   2. Many people have more than one e-mail address. If a person in our contacts
    has an alternative e-mail address, we would see an arrow as circled in the next
    screenshot. When we click on the arrow, it shows the alternative e-mail addresses
    as here:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_42_1.png)


    +   3. If the person we want to send the e-mail to doesn''t appear in the list
    and we know that they exist in the Corporate Directory, click the option at the
    bottom of the list – Search Directory for. This option will show all the names
    in the Corporate Directory that start with whatever we have typed.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_42_2.png)'
  merge: -1
  img_proc: true
- pgno: 43
  md: '4. We can also select their name from our Contacts or the Corporate Directory
    by clicking To. This will open the Select Address dialog box and allow us to select
    the address book (directory) we want to search in ( step 1). Type the name in
    the Find names starting with field (step 2). As the final step, add those people
    whom we have searched to the To, Cc, or Bcc fields by clicking the appropriate
    button (step 3).


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_43_0.png)


    # Protecting names in To, Cc, and Bcc fields


    Often when we send a message, we are communicating with customers or suppliers,
    and there is a need to be discreet with what we allow to be seen in the To, and
    fields. We can utilize the Bcc field to allow only those people to see their own
    name. When the recipient receives the message, they will see only their name or
    Undisclosed recipient. Using this option allows privacy to be maintained.


    > > I use the Bcc field when I am sending e-mails to my son''s basketball team
    as this keeps the team members'' and parents'' e-mail addresses private.


    # Prevent the expansion of personal groups


    When sending a message, go to Delivery Options. Then on the Basics tab, check
    the Do not expand personal groups option. When the recipient receives the memo,
    they will see only the group name and not the individuals listed within the group.
    By default if this option is not selected, the group name will not be shown to
    the recipient, only the group members will be shown.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_43_1.png)'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# # Formatting messages


    Many times when we send a message, we want to format it in a particular way.

    There are several formatting options in Lotus Notes. Note that whatever formatting

    we can do in mail, we can also do in calendar entries, To Dos, and documents in

    Lotus Notes application which have rich text fields.


    We can access formatting options in the following different ways:


    +   • From the Toolbar

    +   • From the Text menu as shown here:

    +   • From Text properties, which can be accessed by the right-click menu or via

    +   the keyboard shortcut Ctrl+K

    +   • From the right click menu there is a subset of formatting options available

    +   • Using keyboard shortcuts such as Ctrl+B for bold


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_44_0.png)


    The following is a screenshot of the right-click menu, the formatting options

    are highlighted:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_44_1.png)'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'The Toolbar has several formatting options. The following is a legend of the
    Editing Toolbar for our reference:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_45_0.png)


    | 1 Font selection & size | 5 Bullets & Numbers | 9 Insert Table | 13 Ruler |

    |---|---|---|---|

    | 2 Bold & Italics | 6 Alignment | 10 Attach a file | 14 Context Help (F1) |

    | 3 Permanent Pen | 7 Spacing | 11 Import | |

    | 4 Indent & Outdent | 8 Styles | 12 Check Spelling | |


    Here is an example of the text properties dialog box, which has several tabs with
    options. The following screenshot shows the Font (a) tab with the Color options
    selected:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_45_1.png)


    We mentioned as a tip the Permanent Pen and the Highlighter Pen as great tools
    to use when replying to messages because of their ability to allow us to show
    our text in a different color and also to highlight text. There is also the Text
    Color icon in the Toolbar; highlight text or put your cursor in a position where
    you want to change to another color then click this button to select a color.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_45_2.png)


    # # Using the Permanent Pen and Highlighter Pen


    To use the Permanent Pen, simply click the Permanent Pen icon in the Toolbar and
    start typing. To turn it off, we just need to click the icon again. When using
    the Permanent Pen, our cursor will have a pen-like icon.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'To use the Highlight Pen, click the **Highlight Pen** icon and highlight text
    by dragging left to right over the text; to undo anything we have highlighted,
    drag right to left. To turn off the Highlighter Pen, click the **Highlighter Pen**
    icon again – basically it is toggle on and toggle off.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_46_0.png)


    # Changing the Permanent Pen font and color


    By default, the permanent pen font is red, bold, and Default Sans Serif. To change
    these options, follow these steps:


    +   1. Create a memo and put the cursor in the body of the memo.

    +   2. Click on the **Text** menu, then **Text Properties**. Alternatively right-click
    and select **Text Properties** from the menu.

    +   3. Click the Font (a) tab.

    +   4. Select a font, size, style, and/or color.

    +   5. Go to the **Text** menu and select **Permanent Pen - Set Permanent Pen**.

    +   6. Discard the memo.


    # Dragging and dropping text


    We can drag-and-drop text from within a document or message. We can also drag
    text from one document or message to another via the window tabs. We just need
    to highlight the text we want to move and then drag it to the desired location.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_46_1.png)


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_46_2.png)'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # Shortcut keys in Lotus Notes


    The Ctrl key on our keyboard comes in quite handy when we are editing text within
    Lotus Notes. Following are some common usages of the Ctrl key within Lotus Notes:


    | Keyboard shortcuts | Description |

    | :--- | :--- |

    | Ctrl+B | Selected text is made bold |

    | Ctrl+I | Selected text is made italics |

    | Ctrl+U | Selected text is underlined |

    | Ctrl+Z | Undo option |

    | Ctrl+C | Selected text is copied |

    | Ctrl+V | Selected text is pasted |

    | Ctrl+X | Selected text is cut |


    # ## Further formatting options


    If we click on the Create menu, we can see more formatting options. We can add
    pictures, page breaks, a horizontal rule (which is similar to a thick line), sections
    that collapse text under a heading, computed text that allows you to add animated
    text, hotspots that can link to URLs or file links, tables, images, and objects.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_47_0.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'When copying an Excel® spreadsheet into a message, use the Paste Special and
    select Paste link to source from the options presented. This will paste the spreadsheet
    into the message. Now if we double-click on the spreadsheet, it will activate
    Excel®.


    If we add a table into a message or Lotus Notes document, we can copy the table
    and paste it into Excel® — the cells will be maintained and the information copied
    across.


    # # Attachments


    Many times, the reason we send a message to someone is because we want to send
    them a particular file. To send a file, we must attach it to the message.


    # # Adding attachments to messages or documents


    There are four ways to add an attachment to a message or document:


    +   - Go to the menu and select File | Attach. A Create Attachments dialog box
    will open; browse here to select the attachment(s) we want to add and then click
    the Create button.


    +   - Click the Attach icon in the Toolbar or the Attach button below the Toolbar.
    Both actions will result in the opening of the Create Attachments dialog box as
    it does when we select File | Attach.


    +   - If we have Windows Explorer open, and our message or document is open in
    Lotus Notes, we can drag the attachment from Windows Explorer to the Lotus Notes
    icon in the Task bar, and then drop into the message or document we have open
    in Lotus Notes. If we resize the Windows Explorer dialog box to be smaller than
    the Lotus Notes window, we can simply drag from Windows Explorer straight to the
    message or document we have open in Lotus Notes.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'The following is a screenshot of the Create Attachments dialog box; refer to
    the number legend to understand each area:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_49_0.png)


    > > We can also drag attachments from a message or document to a new message or
    document. Select attachment, drag to tabs, go to new message or new document,
    and then continue to drag to the position where we want to place it in the attachment.


    # # Working with attachments


    Now that we know how to add attachments, we need to explore what we can do with
    attachments.


    When we double-click on the attachment, we will see the Open Attachment dialog
    box as shown in the next screenshot. From here we can select Open, Edit, View,
    Save, and Cancel. Alternatively if we right-click, we will see more available
    options.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/dc4e954e82cbb69d6ea9b87ab543c676_50_0.png)


    # Opening attachments: Open button


    When we click the Open button, the attachment will be opened in the program it
    was created in. For example, if it is a Word attachment, it will launch Microsoft
    Word and open the attachment. When we click the Open button, it is similar to
    when we are opening a Microsoft document in "Read Only" mode. Any edits to the
    document will not be saved unless we select File | Save As. Use this option only
    when we want to view the attachment in the program it was created in.


    # Editing attachments: Edit button


    When we click the Edit button, it allows us to open and edit attachments. An example
    of where we would use this option is if someone has sent a message with an attachment
    that they require us to update. We would select Reply with History & Attachments,
    which creates a new message with the history and a copy of the original attachment.
    Select the attachment we need to update and double-click or right-click and Edit;
    the attachment will open in the program it was created in. Update the attachment
    and then select the save option in the program it was created in. The attachment
    in the message has now been updated and we can send the message. This is the only
    place where the attachment edit has been saved so make sure we save the memo by
    either sending it or saving it as a draft. If we need to access the edited attachment,
    it can be found in the Sent and All Documents.


    # Viewing attachments: View button


    The view option allows us to open the attachment in Lotus Notes rather than launching
    the program it was created in. This option is excellent for viewing the attachment
    quickly; previewing zipped files without unzipping them; or for viewing files
    of programs we do not have installed.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Saving attachments: Save button


    When we click the **Save** button, it opens Windows Explorer. We can browse to
    where we want to save the attachment(s) and then click **Save**.


    # Working with multiple attachments


    If we have multiple attachments in a message or document, we can right-click one
    attachment and then select any of the available options from the right-click menu.


    +   \- **Save All**: This option will save all the attachments in the message
    to the location we select.\n\- **Save and Delete All**: This allows us to not
    only save to Windows Explorer but also to delete the attachments in the message,
    which will result in saving space in our mail. It will leave text indicating that
    you have deleted the file and give the file name deleted.\n\- **Delete All**:
    This deletes the attachments from the memo.


    # Printing attachments


    We can print an attachment by selecting the **View** button, which will open the
    attachment in Lotus Notes (*not* in the application it was created in) and then
    select **Print** from the **File** menu or Ctrl+P.


    Alternatively, to print the attachment in its original application, select the
    **Open** button and then select **Print** from the **File** menu, or use keyboard
    shortcut Ctrl+P.


    # Viewing mail


    When we open our mail, we can choose to show our mail in different ways. For example
    we might select to show the preview pane or we might also want to show only unread
    memos. In this section we will explore these different options.


    # Preview pane


    We can preview mail using the preview pane, which saves us from having to open
    and close each message. Previewing allows us to see the document''s contents without
    having to open the actual document.


    To access the preview pane options, click the **Show** button at the top of the
    inbox. From here we can preview mail on the bottom or from the side. To turn off
    the preview pane, select the **Hide Preview** option.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/dc4e954e82cbb69d6ea9b87ab543c676_52_0.png)


    > I enable the preference Mark documents as read when opened in the preview pane,
    which is available in Preferences on the Basics Notes Client Configuration tab
    in the Additional Options area—it is the first choice in the list. As the preference
    name implies, when I click on an e-mail to preview it, the e-mail is marked as
    being read. I have selected this option as I predominantly preview e-mails, so
    it assists me in keeping track of what I have read.


    The preview pane is a separate frame that opens in the view or folder we are in,
    exposing a part of the document that is selected.


    To resize the preview pane, select the bar that separates the two panes and drag
    to our preferred size.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_52_1.png)


    > When we preview messages, a Return Receipt will be sent if it has been requested!


    # Conversations


    We can view a message grouped with all of its replies so that we can read the
    message and replies at the same time. A message grouped with all of its replies
    is called a conversation and conversations save us the trouble of looking through
    our mail to find individual replies.


    We can also act on all of the messages in a conversation at one time. For example,
    we could move all of the messages in a conversation to a folder by simply moving
    the conversation to the folder.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'The following is an example of a conversation. In this conversation, there
    are two messages. The first message listed is the original, it is from Joanne,
    and the subject is request for information. Currently it is located in the inbox.


    The second e-mail is the reply to Joanne from Karen Hooper that reads: Thank you.
    Hope you enjoyed. This was written in the body of the memo. This is because in
    conversations all replies listed show the first line of the reply, not the subject.
    This message is in the Sent folder.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_53_0.png)


    # Viewing conversations


    To view conversations, switch from Individual Messages (in which messages and
    replies are displayed and sorted individually) to Conversations (in which messages
    and their replies are grouped together). These options are available under the
    Show button– the same place you selected the preview options.


    We can switch to conversations mode in our inbox, All Documents and our personal
    folders.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_53_1.png)


    Once in conversations mode, the most recent reply in a conversation is displayed,
    and any other replies and the original message are collapsed below the most recent
    reply.


    Following is an example of a conversation that has not been expanded; we can see
    that there are two messages in this conversation. We would click on the arrow
    head icon, which is called a Twistie, to expand or open the conversation:'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/dc4e954e82cbb69d6ea9b87ab543c676_54_0.png)


    When we expand the conversation, each message displays on one line. The original
    message displays its subject and each reply displays the first line of text in
    the body of the memo. When we expand the conversation the rest of our inbox is
    grayed out, to close the conversation click in an area in the inbox. The conversation
    will collapse and the inbox will no longer be grayed out.


    We can stay in Conversation mode if we wish to. When a new message is received
    that belongs to a particular conversation, that message appears at the top or
    bottom of the inbox (depending on how we choose to show new messages). The message
    shows as being unread and the number of messages in the conversation is increased;
    we can also see who sent the reply, including the date and time.


    > **Note:** Conversations can be viewed and sorted only by Date. Sorting by another
    column such as Sender automatically switches the view or folder back to individual
    mode.


    The following table explains different actions one can perform with conversation.


    | Task | Description |

    | :--- | :--- |

    | Act on all messages in a collapsed conversation | Click the conversation to
    select it and then perform the action. For example, to delete all messages in
    a conversation, click the conversation and then right-click the conversation and
    select **Delete**. |

    | Act on all messages in an expanded conversation | If all of the conversation''s
    messages are not selected, click the conversation header to select all of the
    messages and then perform the action. |

    | Act on one message in a conversation | If necessary, expand the conversation.
    Then click the message to select it, and perform the action. For example, to delete
    a message in a conversation, click the message to select it, then right-click
    the message and select **Delete**. |'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# # Deleting a conversation


    When we delete a conversation, we will be prompted as shown in the following screenshot,
    confirming that the individual is aware of his/her actions of deleting all messages
    within that conversation.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_55_0.png)


    # # Turning off conversations


    To turn off Conversation mode, simply go to the Show button and select Individual
    Messages. Or alternatively, when we are in Conversations mode, we will see at
    the top of the inbox, an information bar that tells us that we are seeing messages
    in conversation mode. To return to the original format of the inbox, click the
    Clear button; this will take us back to Individual messages.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_55_1.png)


    # # Viewing unread mail


    Often it is useful if we can show only our unread e-mails. To do this in Lotus
    Notes, we can go to the Show button and select Unread Only.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_55_2.png)


    To return to showing both read and unread, go to the Show button and select Unread
    Only, or alternatively when you are viewing Unread Only you will see at the top
    of the inbox an information bar that tells you that you are seeing messages in
    unread messages. There is a Clear button that will also take you back to read
    and unread messages.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '![](img/dc4e954e82cbb69d6ea9b87ab543c676_56_0.png)


    Once you have read a message you can mark it as being unread or select several
    messages and mark them as unread.


    # How to mark a message as Unread or Read


    We can mark a message that is read as unread or vice versa by selecting the message(s)
    and then:


    +   * Pressing the Insert key on your keyboard (it could be abbreviated as INS)

    +   * Right-clicking and selecting Mark as | Read or Mark as | Unread


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_56_1.png)


    # Managing mail with folders


    All incoming mail goes directly to our inbox. After a while, our inbox can become
    quite large and one way to assist in managing the inbox as well as sorting our
    messages is to file them into folders.


    Earlier in this chapter, we explored sending mail and the Send and File option,
    which allowed us to send a message and at the same time file it in its appropriate
    folder.


    In this section, we will explore how to create folders as well as how to file
    received messages into folders.


    First, let''s start with how to create a folder.


    # Creating a folder


    To create a folder, follow these steps:


    +   1. Open mail and click the down arrow to the right of the Folder button at
    the top of the inbox.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_56_2.png)


    +   2. We will see the following options: Move to Folders, Remove from Folder,
    Discover Folders, and Create Folder — select the Create Folder option.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   3. The Create Folder dialog box will be opened. The cursor will be placed
    in the Folder Name field; type the name of the new folder in this field. Note
    that folders are listed in our Mail alphabetically. If we want a particular folder
    to always be at the top of the list, we can prepend that folder with either numbers
    or letters. For example, to have the "Training" folder listed at the top of our
    folders, we can add either number "1" or letter "a" to the beginning of the name—1.
    Training or a.Training.


    +   4. The next option is Select a location for the new folder. This option allows
    us to create a folder within another folder or to create a main folder. If we
    want this folder to be a subfolder of another, we can select the folder we want
    the new folder to be created in; if we do not select a folder, then the new folder
    will be the main folder.


    +   5. Click the OK button to close the dialog box and create the folder.


    > When creating folders, we can resize the Create Folder dialog box by dragging
    the bottom right-hand corner of the dialog box. This allows us to see our current
    folders and minimizes scrolling.


    We may have noticed that when we have unread messages in our inbox, the Inbox
    name is bold and the number of unread messages appears to the right as shown in
    the next screenshot:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_57_0.png)


    Folders are the same. When there are unread messages in a folder, the name of
    the folder is bold and the number of unread shows to the right; as the following
    example shows there is one unread message in the Int Dealers folder:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_57_1.png)


    There are times when we create a folder and we need to rename the folder or remove
    it as it is no longer required. The following sections cover instructions on how
    to perform both tasks.


    # Renaming and removing folders


    Often we create a folder, and further down the track, we may need to change the
    name of the folder or in some cases delete it. The following is how we can perform
    these tasks:


    +   1. Expand Folders by clicking on the + icon next to Folders.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   2. Select the folder to rename or remove, and right-click.


    +   3. A menu will appear as shown in the following screenshot. Select Rename
    Folder... to rename the folder. We will then be prompted for the new name; enter
    the new name and then click the OK button.


    +   4. To remove the folder, select Remove Folder from the menu. We will be prompted
    with a notification saying this action cannot be undone, do you want to proceed?
    Select the Yes button to proceed or No to cancel removing the folder.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_58_0.png)


    We can also move a folder from one subfolder to another folder, or from a main
    folder to a subfolder, by simply dragging and dropping the folder to its new position.


    # Selecting messages


    Often when we are managing our mail, we want to select several messages so that
    we can file, delete, or forward the selected messages to another person.


    # Selecting one or more messages or documents


    We will often need to select documents so that we can file them, delete them,
    or forward them on to another person. The following are possible scenarios:


    +   • One or more consecutive documents: Click a document, then press and hold
    the Shift key, and then click the final document we want to select.


    +   • One or more non-consecutive documents: Press and hold the Ctrl key, and
    then click each document.


    +   • All of the documents in a view: Click Edit | Select All, or Edit | Deselect
    All, or Ctrl+A.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '+   Tick in left-hand margin: There is a preference that we can select: File
    | Preferences | Basic Notes Client Configuration | Additional options | Show check
    marks in margin for selected documents. This preference allows us to click in
    the margin. We can also press the spacebar to select documents and use up and
    down arrow keys to navigate to different documents.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_59_0.png)


    Once we have a message selected in mail, we can perform the following operations:
    delete, print, archive, copy, forward, or mark as unread/read.


    # Filing messages


    As we have discussed, folders are useful for organizing messages. We can put a
    message in one folder or multiple folders. When we select a message or several
    messages and then the Move to Folder option, we will see a choice to either Move,
    Add, or Cancel.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_59_1.png)


    +   - When we Move a message to a folder, Lotus Notes removes the message from
    its current folder and puts it in the target folder.

    +   - When we Add a message to a folder, Lotus Notes keeps the message in its
    current folder and adds the message to the target folder.

    +   - When we select Cancel, the dialog box is closed and the messages are not
    moved.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '> When filing messages, if we use the **Move to Folder** option, the **Move
    to Folder** dialog box opens. If we know the name of the folder, we can start
    typing the folder name and that folder will be selected and highlighted. Then
    if we press the Enter key, the message will be filed into that folder. Typically
    this is a quicker option than scrolling, especially if we have several folders.


    > There is only one message. If we delete a message that is in multiple folders
    or views, the message is deleted from all of the folders and views.


    The other way to file messages is to drag-and-drop. We can drag messages from
    our inbox and then drop them into a folder. To move a message to a folder, display
    the target folder in the navigation pane, and then drag the message or selected
    messages into the folder.


    So now that we have learned how to create folders and file our messages, hopefully
    our inbox is looking more organized. In the next section we will learn how to
    find messages.


    # Finding filed messages


    Sometimes we may file a message and then not remember which folder we filed it
    in. Other times, we may not have filed the message or we may be searching for
    a message that we sent. The next section discusses All Documents, which is a great
    place to find messages.


    # All Documents


    All Documents contains all messages that are in Inbox, Sent, and our folders.
    In fact it shows every message in our mail, excluding deleted messages and is
    the perfect place to search for e-mails. If I can''t find an e-mail in my inbox,
    I typically will go to All Documents, sort by sender, and look for the message
    there. To sort by sender, click on the column title. Basically all column titles
    are sortable; click once to put into ascending order and then click again to return
    to default sorting.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'We can access All Documents in the side navigator under Follow Up as shown
    here:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_61_0.png)


    In All Documents, there is a column that shows which folder the message is filed
    in. In the following screenshot, the Folder column is circled in red:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_61_1.png)


    If we have the side preview pane opened, we may not see the Folder column or any
    columns. This is because there is not enough space to display the columns. In
    the next section we will learn what we will see instead is a Sort by button at
    the top of the messages where the column name would be. We can access the different
    columns by clicking the Sort by button and a menu will appear with the different
    sorting options as shown here, note the Folder column is not available from this
    area.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_61_2.png)


    # Discover Folders tool


    Another way to find where we have filed a message is to use the Discover Folders
    tool. The following are the instructions on how to use this tool:


    +   1. Select the message about whose folder location we want to know.

    +   2. In the action bar, click Folder icon, and then select Discover Folders.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '3. A dialog box will appear if the message resides in a folder and it will
    show the name of the folder. If it is in our Inbox or Sent folder, we have the
    Add to Folder option if we desire.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_62_0.png)


    4. To close the Discover Folders dialog box, click the Exit button.


    # # Mail icons


    The following is a list of icons that we will see throughout our folders and views
    in mail. There are other icons but these typically are to do with Calendar and
    To Dos, and will be covered in later chapters.


    | Icon | Icon Help | Inbox Position | Description |

    |---|---|---|---|

    | ![Icon] | ![Unread Message] | Left of message | Unread Message received, unread
    messages are bold or via preferences under **Fonts and Colors** can be selected
    to be **Plain red text**. |

    | ![Icon] | ![High Priority] | Left of message | High Priority – when this person
    sent the message they selected the delivery option of High importance. |

    | ![Icon] | ![Message replied to Icon] | Right of message | The green arrow represents
    the message has been replied to. If we open the message, we will see a History
    section. |

    | ![Icon] | ![Message forwarded Icon] | Right of message | The blue arrow represents
    the message has been forwarded. If we open the message, we will see a History
    section. |'
  merge: -1
  img_proc: true
- pgno: 63
  md: '| Icon | Icon Help | Inbox Position | Description |

    | :--- | :--- | :--- | :--- |

    | [Icon] | Message replied to and forwarded Icon | Right of message | The green
    and blue arrow represent the message has been replied to and forwarded. If we
    open the message, we will see a History section. |

    | [Icon] | Paperclip Icon | Right of message | The paperclip icon represents that
    this message has an attachment. |


    # # Spell check


    When we are typing a message and we spell a word incorrectly, we will see a red
    squiggly line underneath the word in question. If we right-click on the word,
    we will see alternative suggestions for spelling as well as options to add the
    word to the dictionary or skip.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_63_0.png)


    When we send a memo, if there is a word that is spelt incorrectly, we will again
    be prompted to correct the spelling. There is a **Send As Is** button if we want
    to bypass performing a spell check.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_63_1.png)'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'There are some excellent options to select in **Preferences** for spelling
    checks. I have found that people who work in manufacturing, or those who deal
    with part numbers, benefit from selecting the **Ignore words containing numbers**
    option as many of the part numbers that they deal with include numbers and letters.


    The Enable **Instant Spell checking** option shows us instantly what we have spelled
    incorrectly by putting a red squiggly line underneath the word.


    | Section | Option |

    | :--- | :--- |

    | Defaults for English | |

    | | [x] Ignore words containing numbers |

    | | [ ] Ignore words in UPPERCASE |

    | | [ ] Keep on the fly dictionary changes until next language tag change |

    | | [x] Enable Instant Spell checking |

    | Instant Corrections | |

    | | [x] Correct common typing errors (for example, replace teh with the) |

    | | [x] Capitalize first letter of every sentence |

    | | [x] Correct TWo INitial CApitals |


    The **Instant Corrections** options speak for themselves and I have enabled them
    all as they are fantastic options.


    > Dictionaries are provided for each country, so we need to make sure that we
    have selected our county''s dictionary in the **Spell Check** preferences.


    > If we have set up our signatures, we shouldn''t forget to **Add to Dictionary**
    our name and other details that are in our signature.


    # Subject warning


    When sending a message, if we have not entered a subject, we are prompted to enter
    a subject when we attempt to send the message. When prompted, we can enter a subject
    and resend by selecting **Yes**. Alternatively, we can select **No** to send the
    message without a subject.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # Adding a signature to messages


    In Lotus Notes, as with other mail products, we can set up a signature that identifies
    us and our details. We can add our company logo, phone details, vCards, and even
    a web address. I have added my company title to my signature as well as my relevant
    details. To set up our signature, we need to follow these instructions:


    +   1. Open Mail and click on the **More** button in the action bar at the top
    of messages. Then select **Preferences**....


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_65_0.png)


    +   2. Select the **Signature** tab. Check the **Automatically append a signature
    to the bottom of my outgoing mail messages** option if we required. If we don''t
    select this option, we will need to manually add our signature to messages by
    the **More** button in the message and selecting **Insert Signature**.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_65_1.png)


    +   3. Click the **Append my vCard** button if we want to add a vCard attachment
    as part of our signature.


    +   4. We can then enter then our signature and format it by clicking on the **T**
    then **Text**. We can also add graphics, paste in an image, or import an image,
    among other things.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_65_2.png)


    The choices available under the **T** are as shown in the following screenshot:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_65_3.png)'
  merge: -1
  img_proc: true
- pgno: 66
  md: '> I have selected the **Automatically append a signature to the bottom of my
    outgoing mail messages** option. If I am sending a message to someone and I don''t
    want my signature appended, I can simply highlight the signature and delete it
    from within the memo.


    # # Deleting messages and restoring from Trash


    Deleting messages is very simple within Lotus Notes. We can right-click and select
    **Delete** from the menu. We can also select the message and press the *Delete*
    key. We can also click the **Delete** icon in the action bar at the top of our
    messages, as follows:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_66_0.png)


    When a message(s) is deleted it is immediately removed and placed into Trash until
    due to expire. We can restore deleted messages by opening **Trash**, selecting
    the messages we want to restore and then selecting the **Restore** button. We
    will need to restore before the message is due to expire, to confirm when Trash
    will be deleted go to **Preferences | Mail** and view **Delete documents in my
    Trash folder after # hours**.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_66_1.png)


    # ## Summary


    In this chapter we have explored many aspects of mail in Lotus Notes. We have
    learned about creating, replying, and addressing messages. We also looked at the
    different ways we can edit messages. We explored working with attachments, folders,
    spell checking, and setting up signatures.


    In the next chapter, we will delve into mail tools, which can assist us in being
    more efficient with the way we work with mail.'
  merge: -1
  img_proc: true
- pgno: 67
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # Lotus Notes Mail Tools


    In the previous chapter, we navigated the basics of Lotus Notes mail. In this
    chapter, we will focus on the advanced features available and how we can best
    utilize them to assist us in being efficient with mail management.


    Take the time to explore the available tools and you might be surprised to find
    that once we start using some of them, we might wonder how we ever lived without
    them. One of my favorite tools is Stationery – this is like a template for e-mails
    that I send on a regular basis such as a monthly report. Many colleagues I know
    have Stationery, which they have set up to send to their travel agent; it includes
    all their relative details such as frequent flyer numbers, passport details, and
    so on.


    Another tool is Copy Into New ... Memo/Calendar/To Do, which copies the text from
    a selected message into a new memo, calendar entry, or To Do. I use this to copy
    details within a memo into a calendar entry so that I have all the details of
    the information in the memo right there in the calendar, which means I needn''t
    search for the original e-mail.


    I also love the Find Available Time tool, which is a context menu option available
    on messages, calendar entries, and To Dos. You select a message, for example of
    someone that you would like to meet with, and as the name suggests, it automatically
    finds the first time we are both available and gives us the option to create a
    meeting invite. It is a few less steps than doing it from scratch in our calendar.


    In this chapter, we will explore the following topics:


    +   * Senders Colors and Recipient Icons

    +   * Collaboration history

    +   * Finding available time

    +   * Copying into Tool ... Memo/Calendar/To Do

    +   * Follow up Feature (flagging)

    +   * Stationery

    +   * Message recall

    +   * Spell check'
  merge: -1
  img_proc: true
- pgno: 69
  md: '+   - Out of Office

    +   - Managing Junk mail

    +   - Rules

    +   - Mail size indicators

    +   - Archiving

    +   - Mail Preferences


    # # Senders'' colors and recipient icons


    Often it is important for us to identify particular e-mails in our inbox quickly,
    specifically if they are sent only to us or we have been CCed, or if an e-mail
    has been received from a certain person. We can specify text and background colors
    to identify messages from particular senders. For example, we could use one color
    combination to identify co-workers on an important project, another color combination
    for our manager, and some other combination for personal messages from friends.
    We can specify several color combinations. In the following screenshot, background
    colors of red and blue have been selected for specific individuals:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_69_0.png)'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'We can also display icons that identify messages in which we are the only recipient
    in the To field or our name appears only in the Cc field.


    # Specifying colors that identify senders


    We can follow the instructions given next to enable Sender Colors:


    +   1. If necessary, open your e-mail.

    +   2. Click the More button above the message list, and then click Preferences.

    +   3. Select the Sender Colors tab.


    +   4. In the first Sender names field, enter one or more names of people whose
    messages we want to display in the first color combination. Separate names by
    pressing Enter (rather than using a comma as a separator). To select names from
    a directory, click the down arrow next to the field.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_70_0.png)


    +   5. Select a background color and or text color.

    +   6. Click OK.

    +   7. To remove all color combinations, return to the Senders Colors tab in Preferences,
    click Restore Default Colors, and then click OK.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_70_1.png)'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# # Displaying icons that identify your recipient level


    To Cc a person in a message typically means that the message content is for information
    and we may not need to respond or action anything. E-mail etiquette dictates that
    if we want a person to take action on an item we have included in the e-mail,
    we add their name into the To field. It is therefore handy for us to immediately
    identify an e-mail where we have been CCed or an e-mail where our name is in the
    To field. The following are the instructions on how to enable this feature:


    +   1. If necessary, open mail.

    +   2. Click the **More** button above the message list, and then click **Preferences**.

    +   3. Go to the **Recipient Icons** tab.

    +   4. Select one or more of the display fields to display solid-circle if **Mail
    sent to me only**, half-circle if **Mail sent to no more than this number of recipients
    in the To field** and then select the number, or empty-circle icons if **Mail
    sent to me as a cc**.

    +   5. To display the selected icons when mail is addressed to us with an alternate
    e-mail address or group name, specify one or more alternate addresses or group
    names in the field below, this step is optional.

    +   6. Click **OK** to save the settings.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_71_0.png)'
  merge: -1
  img_proc: true
- pgno: 72
  md: "# Collaboration history\n\nCollaboration history incorporates quite a few features.\
    \ We can view a history of collaborations or communications that we have had with\
    \ one of our contacts such as e-mail, Sometime chat transcripts (if you have saved\
    \ them), or meetings. Collaboration history includes all activity with a selected\
    \ contact for the previous two weeks.\n\n# Viewing collaboration history for a\
    \ person\n\nFollow the instructions given next to see the options available with\
    \ collaboration history:\n\n+   1. From within your mail select a message from\
    \ a person who you want to view collaboration history.\n+   \n+   2. Right-click\
    \ on the message and we will see the person's name that we have selected at the\
    \ top of the menu options. This is marked as step 1 in the following screenshot.\n\
    +   \n+   3. Select the person's name and then we will see an extended menu. We\
    \ will see an extended menu.\n+   \n+   4. Select Collaboration History. This\
    \ is step 2 in the following screenshot.\n+   \n+   5. A dialog box will appear\
    \ with a collaboration list; select and double-click to open one of the collaborations.\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_72_0.png)"
  merge: -1
