  md: '# IBM Lotus Notes 8.5 User Guide: LITE


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_123_0.png)


    IBM Lotus Notes is an integrated desktop client option providing security-rich
    ‘e-mail and calendar capabilities with a powerful platform for collaborative business
    applications. Lotus Notes enables you to take your business communications to
    a new level efficiently, quickly and productively. This exciting user guide enables
    business users to master the Client Interface and Mail features of Lotus Notes
    simply and effectively.


    This short book focuses on the important Client Interface and Mail features of
    Lotus Notes and at the same time gives business users a deeper and clearer understanding
    of basic functionality, providing the answers to many questions that are encountered
    working with mail.


    # Who this book is written for


    If you are a business user who wants to get the most out of Lotus Notes, then
    this book is for you. From beginners to seasoned professionals, this book aims
    to cover the Client Interface and Mail features, best practices, tips, tricks,
    and tools that enable you to work smarter—almost effortlessly—in Lotus Notes 8.5.


    # What you will learn from this book


    +   Become more productive by customizing Lotus Notes preferences


    +   Ease your way to efficient mail management by using new and advanced features


    +   Master Lotus Notes Mail Tools such as Rules, Stationary, and more


    +   Discover expert tips and best practices for using the client interface and
    business e-mail


