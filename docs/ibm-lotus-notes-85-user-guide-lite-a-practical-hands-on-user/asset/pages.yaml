- pgno: 85
  md: '# # How to use stationery


    Once we have created our stationery, we will find it very easy to use. Stationery
    is stored in the **Stationery** folder. To use stationery, we can go to the **Stationery**
    folder and double-click on the stationery we require. Alternatively, if we are
    in our inbox, we can click the **More** button and select **New Message with Stationery**;
    this will open a prompt box listing the stationery stored in the **Stationery**
    folder, we need to select the Stationery we require.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_85_0.png)


    # # Bookmarking stationery


    Stationery that is most often used can be bookmarked so it can be easily accessed.
    We can do this by opening the stationery message and then dragging the window
    tab of the opened stationery to the **Open** button or the **Bookmark Bar**. This
    will result in the stationery being listed in our **Open** button or the **Bookmark
    Bar**. The following screenshot shows that I have bookmarked the **Travel request**
    stationery. When I need to use the **Travel request** stationery, I simply click
    to open it from the **Open** button or the **Bookmark Bar**.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_85_1.png)


    If we find ourself searching for the last e-mail we sent to a person(s), copying
    the contents to the clipboard, pasting it into a new memo, making some slight
    changes and then sending it on a regular basis, it is time we think about using
    stationery!'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Message recall


    It happens at times that we send an e-mail and then immediately realize that we
    have either sent it to the wrong person, have forgotten the attachment, or just
    should not have sent it! We can recall a message that we have sent and saved.
    This is useful if we sent a message when it was still not ready to be sent, or
    if we want to edit the content of a sent message and resend it. Be aware that
    some organizations may have disabled this feature and the Recall Message button
    will not be available to us.


    # How to recall a message


    If we find that we have sent a message that we need to recall, follow the steps
    given here:


    +   1. In our mail, open Sent or All Documents.


    +   2. Select the message that we want to recall.


    +   3. Above the message list, click the Recall Message button or alternatively
    the recall option is available by clicking the More button and then Recall Message...option.
    Remember if this button does not get displayed, then the IT Department has potentially
    disabled this feature.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_86_0.png)


    +   4. If the message was sent to more than one recipient, select the recipients
    to recall the message from, by checking or unchecking the names displayed.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_86_1.png)


    +   5. To recall the message from a recipient even if the recipient has already
    opened or previewed it, select Recall the message even if it has been read. Note
    that many IT Departments allow messages that have not been read to be recalled,
    so that even though this option is available to be selected, it will not recall
    the message if this option is not allowed. This is an optional step.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '+   6. (Optional) To suppress recall status reports, check the Send me a recall
    status report for each recipient option. Recall status reports confirm whether
    or not a message is recalled successfully.


    +   7. Click OK.


    For a message recall to work, both we and the message recipient must be using
    Lotus Notes 8 client, mail template, and mail server. The message recipient must
    have the basic mail preference Allow others to recall mail sent to me selected.
    If messages are being sent externally from our organization, message recall is
    not possible as message recall only works internally within an organization.


    If we were prompted to save the message when we clicked the Send button and we
    selected No, we will not be able to recall that message as it has not been saved
    in our Sent view or All Documents.


    # Spell check


    Spelling is not my forte and I have to confess I love the spell check feature
    and use it all the time. There are quite a few options that we can set for how
    we want the spell check feature to operate. First, we can set a preference to
    spell check all our messages, we can then set our default dictionary, how we handle
    numbers and case, and we can select additional dictionaries. There is also the
    option to enable the instant spell check that identifies misspelled words as we
    type.


    # Enabling spell check for messages


    We can have Lotus Notes automatically spell check all messages before sending
    them, or we can alternatively manually check for spelling mistakes in a message.
    We can also enable the instant spell checker that shows misspelled words as we
    type. We discussed the Instant Spell check in Chapter 5, Mastering Lotus Notes
    Mail; in this chapter we will look at the other spell check options.


    # Performing a manual spell check


    Create a message to test the steps given next:


    +   1. With the message open, select the text in the body of the message that
    we want to check the spelling of.


    +   2. Select Tools | Spell Check.... When Notes doesn''t recognize a word, Notes
    displays the Spell Check dialog box.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/dc4e954e82cbb69d6ea9b87ab543c676_88_0.png)


    # # Performing spell check as we type (Instant Spell check)


    Create a message to test the steps given next:


    +   1. While the message is open, select Tools | Instant Spell Check.... When
    Notes doesn''t recognize a word, the word will be identified with a red squiggly
    line underneath.


    +   2. Right-click on the misspelled word; we will see alternative suggestions
    for spelling as well as options to add the word to the dictionary or skip it.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_88_1.png)


    # ## Performing an automatic spell check


    In this case, Notes checks the spelling when we send the message.


    +   1. Select File | Preferences, click Mail, and then click the Basics tab.


    +   2. Select Spell-check messages before sending.


    +   3. Click OK.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_88_2.png)


    > > We can enable the Instant Spell Check and the option to spell check messages
    before sending automatically. This will show us misspelled words as we type as
    well as prompts to correct any that we have missed when we send the message.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'We shouldn''t forget to add to our signature to the dictionary. If we don''t,
    every time we send a message and we have the spell check option enabled, it will
    spell check our name and whatever we have added to our signature. Select the button
    Add to Dictionary in the Spell Check dialog box if parts of your signature are
    picked up by the spell checker.


    # Setting spell check preferences


    As mentioned, there are different spell check options that we can select to customize
    the spell checker.


    +   1. Click File | Preferences.

    +   2. Click Spell Check.

    +   3. Set any of the following options:


    +   - Select the language dictionary from the Primary Dictionary list, and then
    click Set as Default.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_89_0.png)


    +   - Select the Supplemental Dictionaries option, wherein we may see supplementary
    dictionaries that we can select. This will need to be installed by our IT Department.

    +   - The Edit User Dictionary option lists all the words we have added to our
    dictionary such as our name, company name, product names, and abbreviations we
    use. We can edit this dictionary from within Preferences or from within the Spell
    Check dialog box when prompted. From within this area, we can Add a new word by
    typing in the New/Selected word field and then clicking the Add button. We can
    also select a word such as Admin in the diagram and change the spelling and then
    click the Update button. Finally, we can delete a word in our user dictionary
    by selecting a word in the list and then clicking the Delete button.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '![](img/dc4e954e82cbb69d6ea9b87ab543c676_90_0.png)


    +   There is an Ignore words that contain numbers option. This is a great option
    for those who work with part or model numbers for products where the part or model
    numbers that contain letters and numbers. We can also set Ignore words that are
    in uppercase.


    +   We also have an option for multi-language documents — Keep on the fly dictionary
    changes until next language tag change.


    +   Selecting Enable Instant Spell checking option highlights misspelled words
    with a red squiggly line underneath them.


    +   Under Instant Corrections, we can select the typical typing errors we want
    corrected automatically.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_90_1.png)


    +   4. Click OK.


    > The Instant Corrections is only available in Lotus Notes 8.5.1 English language
    clients.


    # Out of Office


    Whenever we take annual leave, or we are away from the office, it is important
    to enable our Out of Office. When a colleague or customer sends us an e-mail,
    they get notified that we are not available with dates of when we are away, and
    more importantly, when we will be back in the office. In Lotus Notes 8.5, the
    notification of our absence is sent immediately.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'I actually use my Out of Office not just for when I am on leave. I will enable
    it if I am training for the day as usually I can''t get to my e-mails until later
    that day or the next day. I also enable it when I go to conferences or other business
    outings. We can edit our Out of Office to send a customized message for each occasion
    that we are away. The notification service sends replies only between the leaving
    and returning times we specify and sends one reply to each sender.


    # # Enabling the Out of Office feature


    The following are steps to enable this feature:


    +   1. From within Mail or Calendar, click the **More** button and then select
    **Out of Office**...


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_91_0.png)


    +   2. Enter the **Leaving** date and the **Returning** date. If we are leaving
    for less than a day, check **Specify hours** and enter the hours that we will
    be away. Depending on our organization''s server configuration, we may or may
    not be able to select hours and may only be able to select dates. Check **I am
    unavailable for meetings** to show others that we are not available at these times
    for meetings and other related activities.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_91_1.png)'
  merge: -1
  img_proc: true
- pgno: 92
  md: '+   3. On the **Standard Notification** tab, edit the **Subject** field if
    required, and select **Append return date to subject** so the sender can clearly
    see when we are returning. In the **Additional body text**, add any further details
    such as the occasion for our absence or contact details of a person who is filling
    in for us while we are away. To clear this field, we can click the **Reset Defaults**
    button above the **Subject** field and add new details.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_92_0.png)


    +   4. If you want to send an alternative notification select the **Alternate
    Notification** tab to send an alternate out of office notification to certain
    people, or to people from certain domains (such as @sampledomain.com). Specify
    the people and domains in the **To** field. Then specify the contents of the alternate
    notification.


    +   5. Click the **Exclusions** tab to cancel the out of office notification when
    certain conditions are met if required. Specify the conditions we require in the
    relevant fields. There is an option here to prevent replies from going to messages
    received from the Internet. Check **Do not automatically reply to mail from Internet
    addresses** if this is our preference.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_92_1.png)


    +   6. Click **Enable and Close** or, if we have already enabled the out of office
    notification but changed some out of office settings, click **Save and Close**.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_92_2.png)'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# # How to disable the Out of Office feature (if necessary)


    By default the Out of Office feature will automatically disabled itself; however,
    in some organizations, we will be required to disable the Out of Office manually
    as it has not been enabled to run as a service. If we do need to disable it ourselves,
    the Out of Office will send us a reminder to do so.


    +   1. Open mail or calendar.

    +   2. Above the message list, click More | Out of Office.

    +   3. Click Disable and Close.


    **Duration of absence:**

    The shortest time is one hour. The minimum day is one. We cannot have 1 day and
    4 hours. We must select either time or dates.


    We can allow a delegate of our mail to enable the Out of Office notifications.
    In the **Access & Delegation** section of our mail file preferences, select the
    **Mail, Calendar, To Do and Contacts** components and then give access to **Read,
    edit, and create any document, send mail, enable Out-of-Office or higher.**


    # ## Junk mail


    Many times we receive unwanted e-mails. We can block these e-mails by adding them
    to the Junk; this function is called **Block Mail from Sender**. This feature
    allows us to filter incoming messages and move those from specific senders directly
    to Junk so that they bypass our inbox. We can use this function in all mail views
    and folders except for **Sent, Rules, Stationery, and Follow Up**. Mail in Junk
    will need to be deleted manually.


    # ## Managing junk mails


    Follow the steps below to add mail to Junk.


    +   1. Open mail, select a message from a sender whose messages we want to add
    to Junk.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '+   2. From within the inbox, click the **More** button and select **Deliver
    Sender''s Mail to Junk**. The Junk Mail Senders List dialog box will open as shown
    in the next screenshot. Select if we want to block the mail from the individual
    sender or mail from any address that ends with the sender''s domain.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_94_0.png)


    +   3. Click OK. The messages from this sender will now go directly to Junk located
    in the side navigator as highlighted here:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_94_1.png)


    +   4. To unblock, from within Junk, select the **Manage Junk Mail Senders List**
    button; this opens the Junk Mail Senders List dialog box and we can select a name
    to remove or click the **Remove All** button. We can delete the e-mail in Junk
    however the sender''s details will remain in the Junk Mail Senders List.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_94_2.png)


    > > We can also manage Junk mail from the Rules folder, which we will look at
    in the next section.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# # Rules


    Often our inboxes get inundated with messages and it can be quite overwhelming.
    A way to prevent this is to manage our mail with rules. We can use mail rules
    to act automatically on new messages we receive that meet certain conditions.
    We can create a rule that checks for messages from a certain sender or that contains
    a certain subject and automatically move the messages to a certain folder, send
    copies of the messages to someone, or delete unwanted messages before we ever
    see them in our inbox. For example, I subscribe to several websites and I have
    set up rules to move the incoming newsletters from these websites directly to
    a folder so that they bypass my inbox.


    The mail rules we create are stored in the **Rules** folder in our mail file.
    We can go there to add new rules as well as edit the ones we''ve created. We can
    edit rules, change their order so that one rule has priority over another, turn
    them off when we don''t want to use them, or delete them entirely.


    We can access **Rules** in the side navigator under **Tools**.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_95_0.png)


    There is a **Quick Rule** option, which is an abbreviated set of the most commonly
    used rule configurations that can quickly be applied — hence the name **Quick
    Rule**.


    The following table explains some of the **Quick Rules** and **Rules** settings
    for our reference:


    | Condition | Definition |

    | :--- | :--- |

    | Contains | Contains looks for a partial match. For example, if we have selected
    the rule to act on messages that contain sales in the subject, it will act on
    a message that has sales conference as well as sales enquiry in the subject field.
    |

    | Does not contain | We will need to be careful with this as the setting is the
    complete opposite to the contains condition and is usually used in conjunction
    with contains or is. |

    | Is | Is looks for an exact match. In our sales example, it will only act on
    messages with sales and sales only in the subject. |

    | Is not | Is similar to does not contain but it looks for an exact match. |'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# # Creating a quick rule


    Follow the steps next to create a quick rule:


    +   1. Open mail and select a message that we would like to apply a quick rule
    to.


    +   2. Select More | Create QuickRule.


    +   3. As the Quick Rule is based on information in the selected message, we will
    see values in the **Sender**, **Subject**, and **Domain** fields. We can edit
    these values if necessary. The fields could be empty if, for example, we select
    a message that doesn''t have text in the subject field.


    +   4. There are three steps to complete the rule. With each condition we can
    specify any of the following states for each field value—**contains**, **does
    not contain**, **is**, and **is not**.


    +   i. We first need to select the condition to match. There are three conditions
    to configure—**Sender**, **Domain**, and **Subject**. We can select one of these
    conditions or all three.


    | Condition | Operator | Value |

    | :--- | :--- | :--- |

    | When Sender | contains | specialoffer@myerone.com.au |

    | When Domain | is | myerone.com.au |

    | When Subject | contains | Your fantastic choice of offers and rewards |


    +   ii. We need to decide when to take action— on one or all selected conditions.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_96_0.png)


    +   iii. Choose an action to perform:


    +   • **Move to Folder**: We will need to select the folder we want the messages
    to be moved to.

    +   • **Change importance to High**: This option adds the red exclamation mark
    icon to messages to indicate the message is of high importance.

    +   • **Do not accept message**: This deletes the message. Note the message is
    not stored in **Trash** and cannot be restored.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_96_1.png)'
  merge: -1
  img_proc: true
- pgno: 97
  md: '5. Click OK to save the configurations. The new quick rule is created and stored
    in the Tools | Rules folder. The new quick rule acts on incoming messages, but
    existing messages in the inbox that meet the conditions of the rule are not affected.


    If the Quick Rules do not give enough options, we can create a rule.


    # Creating a rule


    Rules have many more options to configure and are quite powerful as there are
    further actions we can select from and more configurations including exceptions.


    +   1. In the side navigation pane of mail, go to Tools | Rules or alternatively
    click the More button and then select Mail Rule. This will open up the Rules folder.


    +   2. In the Rules folder, click New Rule.


    +   3. In the New Rule dialog box, there are two areas that we need to configure.
    In the first area, we need to specify conditions. Rules have several conditions
    that we can configure.


    | Condition to check | Options | Additional options |

    |---|---|---|

    | Sender | Contains, does not contain, ls & ls not | |

    | Subject | Contains, does not contain, ls & ls not | |

    | Body | Contains, does not contain, ls & ls not | |

    | Importance | Contains, does not contain, ls & ls not | High, normal, low |

    | Delivery priority | Contains, does not contain, ls & ls not | High, normal,
    low |

    | To, cc, bcc & To and cc | Contains, does not contain, ls & ls not | |

    | Body or Subject | Contains, does not contain, ls & ls not | |

    | Internet domain | Contains, does not contain, ls & ls not | |

    | Size | Is less than, is greater than, is, is not | |

    | Form | Contains, does not contain, ls & ls not | Note: an example of a form
    is the memo form |'
  merge: -1
  img_proc: true
- pgno: 98
  md: '| Condition to check | Options | Additional options |

    |---|---|---|

    | Blacklist, whitelist | Contains, does not contain, Is & Is not | |

    | All documents | None available | |


    > The **all documents** condition lets us perform an action on all messages that
    arrive in our mail while the rule is enabled. For example, we might select **all
    documents** and specify sending a copy of all e-mails we receive to an alternate
    e-mail address while we are out of the office.


    +   4. Once we have added one condition, we can add further conditions and/or
    exceptions.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_98_0.png)


    +   5. We can, at any time, **Remove** or **Remove All** conditions using the
    buttons on the right-hand side of the screen.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_98_1.png)


    > Do not use quotation marks when adding text we want to check against. Text is
    not case sensitive.


    +   6. Once we have entered the conditions, the next step is to **Specify Action**.
    Rules have several actions available and we can add more than one. The actions
    available are listed here:


    | Action | Options | Additional options |

    |---|---|---|

    | Move to folder | Select the folder to move to | |

    | Copy to folder | Select the folder to copy to | |

    | Send copy to | Full or header only | Enter names to send to |

    | Set expiry date | Number | Day(s), week(s), month(s), year(s) |'
  merge: -1
  img_proc: true
- pgno: 99
  md: '| Action | Options | Additional options |

    | :--- | :--- | :--- |

    | Change importance to | High, normal, low | |

    | Stop processing | None available | |

    | Delete (don''t accept message) | None available | |


    > > Send copy to is a great option for allowing another person to manage our mail
    while we are out of the office. They receive a copy of the message and we still
    receive the original mail.


    +   7. Click Add Action.


    +   8. Click OK to close the dialog box; the rule is now enabled.


    As we can see from the options, rules are quite extensive. Once created, rules
    act in the order they appear (top to bottom) in the Rules folder. We can change
    the order of the rules by using the buttons at the top of the Rules folder by
    moving them up or down.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_99_0.png)


    We can edit or disable a rule at any time as well as delete the rule if it is
    no longer required.


    # # Mail size indicators and quotas


    In some organizations, mail administrators may set a quota to assist in managing
    the size of people''s mail. If a quota is set and our mail becomes larger than
    the set limit, we will see warning messages letting us know we have exceeded our
    quota. In addition, new mail sent to us may be delayed, and we may not be able
    to save sent mails until we have reduced the size of our mail to below our quota.
    If quotas are enabled, we will see an indicator in the top left-hand side of our
    mail as shown in the next screenshots.


    When we access our mail stored on a server, the Mail Quota Status indicator is
    displayed as a thermometer.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_99_1.png)


    When we access a local replica, the Mail Quota Status indicator displays as an
    envelope overlapped by a thermometer:'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Hovering over either indicator displays a summary consisting of a thermometer,
    the current mail database size and quota, and the mail server name:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_100_0.png)


    # Hints on reducing the size of our mail


    Managing mail can be a chore. Following are some tips that may help reduce the
    size of our mail.


    +   • **Delete mail:** Sort individual mail folders and views by size to identify
    and delete the largest messages no longer required a great place to do this is
    in All Documents as it encompasses all Sent, filed and received messages. After
    deleting messages, make sure that you go to the Trash folder and empty the trash.


    +   • **Archive mail:** If archiving is enabled, archive messages that are no
    longer active. Archiving is discussed later in this chapter.


    +   • **Change preference for saving sent mail:** If our preference for saving
    sent mail is set to Always, we may be saving many sent messages unnecessarily
    as every message we send is saved in our mail. Consider changing the setting to
    Always prompt, so we will be prompted each time we send a message as to whether
    we want to save it. If we select No, the message will not be accessible in our
    mail. If we select the Send and File option when sending messages the message
    will automatically be saved.


    +   • **File attachment settings:**


    +     - Use the Reply with History only option that removes the attachments but
    keeps the original text when we reply to messages containing file attachments.


    +     - To prevent receiving large attachments in messages, we can create a rule
    to specify if the size (in bytes) is greater than (the number we choose) then
    delete.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_100_1.png)'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# # Archiving


    Archiving, as mentioned above, is a great solution for assisting in decreasing
    the size of our mail. When we set up archiving it creates a copy of our current
    mail application and stores it locally on our computer. It creates a new directory
    in Windows Explorer called Archive. If we ever need to take a backup of the archive
    application, we will find it in the IBM\\Lotus Notes\\Data\\Archive directory
    in Windows Explorer if the naming conventions have been kept as the default.


    We can access the archive database from our mail file in the side navigator as
    shown here:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_101_0.png)


    To open our archives, expand Archive in the side navigator and then select the
    archive we want to open. In the above screen shot the only archive available is
    Mail 2008. Once opened, the archive application is almost the same as our current
    mail excluding all the e-mails! It does look slightly different as the archive
    application is a yellow color and has a different title as we can see in the next
    screenshot:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_101_1.png)


    Before we can archive, we must configure the archive settings, which we will go
    through shortly. We can have more than one archive database. Some people have
    an archive database for each year. Others prefer to only have one archive database.
    A consideration for how many archives we have would be size. If we want to back
    up our archive applications, we might need to control the size, therefore requiring
    us to have more than one.


    # ## Setting up archiving


    Setting up archiving is quite simple, follow the steps given next:'
  merge: -1
  img_proc: true
- pgno: 102
  md: '1. Access the archive menu choices under Action | Archive | Settings....


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_102_0.png)


    2. Click the Create... button on the right-hand side.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_102_1.png)


    3. This will open the Create Archive Criteria dialog box. From within here, we
    have four sections that need to be complete:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_102_2.png)'
  merge: -1
  img_proc: true
- pgno: 103
  md: '+   i. Give a descriptive name for the archive database and check **Enable
    this criteria**. Enabling the criteria shows the link to the new archive in the
    mail side navigator as per our example, **Mail 2008** in the screen shot earlier.


    +   ii. Click the **Selection Criteria...** button to determine how often and
    which documents we want to archive. The default is **Not modified in more than
    365 days**. We can change these options.


    +   iii. We then need to decide **What should happen with the selected documents**.
    The default is to **Copy documents into my archive application specified here**,
    then **clean up this application**. The other option is to **Just clean up this
    application without archiving** however this is not recommended as there is no
    way to retrieve the deleted documents if there is a need to.


    +   iv. Finally, **How do you want to cleanup documents in this application**
    gives two opportunities. The first choice is to completely remove the document
    from our current mail so that we will be able to access the document only from
    the archive application. The second choice is to leave a subset or summary of
    the document in the current mail application. This ensures we will see the archived
    document in our current mail file with a blue summary icon on the archived document,
    which represents that the document has been archived, and either the attachment
    has been removed or the attachment has been removed and 40KB of text remains in
    the original message. The great feature about this option is that we can open
    the archived document in our current mail file and select **Actions | Open Archived
    Document**; this opens up the original message that has all the original data
    which is now stored in our Archive application.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_103_0.png)


    +   4. Click OK to close. We will then be prompted with the information that to
    use the enabled criteria we must archive either by selecting the option to **Archive
    Now** under the **Action\Archive** menu or clicking the **Yes** button to schedule
    archiving. A schedule will automate archiving at the time we allocate.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '![](img/dc4e954e82cbb69d6ea9b87ab543c676_104_0.png)


    If we select not to schedule archiving by clicking on the No button, then we will
    need to manually archive some documents before the archive application is created.


    There are four ways to archive:


    +   - **Actions | Archive | Archive Now**: This will archive documents that meet
    the archive criteria.

    +   - **Actions | Archive | Archive Selected Documents**: This archives any documents
    we currently have selected.

    +   - Let schedule archiving archive according to the archive criteria.

    +   - Drag-and-drop documents into the archive database in the side navigator.


    > **Recently Archived folder**: We can easily find our recently archived messages
    by opening the **Recently Archived** folder in our archives. An archived message''s
    subject line says **(Archived)** and the header includes the date on which the
    message was archived, which is very handy.


    At any time we can **Edit**, **Delete**, or **Disable** our settings for each
    database by selecting the **Actions | Archive | Settings**.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_104_1.png)'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'In the Archive settings, we will see an Advanced tab as shown in the next screenshot:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_105_0.png)


    In this area, by default, archiving will delete documents only if it can delete
    all responses as well. An example of a response is a reply to an e-mail. By keeping
    this option checked, we will always be able to show the whole conversation.


    There is also an option to Log all archiving activity into a log application option.
    This will give a report each time archiving occurs and can include links to the
    actual documents archived. The log is a separate application and is stored in
    the path listed in the Advanced tab.


    # ## Mail preferences


    Throughout this chapter and the chapter before, we have set many mail preferences
    to configure our mail in a particular way. For example, we may have enabled the
    spell check to automatically check spelling when we send a memo. We also may have
    set up Sender Colors so that messages from certain people will be highlighted
    in a different color. Mail preferences can be accessed from the File | Preferences
    | Mail menu or by clicking the More button from within Mail and selecting Preferences.


    Accessing mail preferences from the File | Preferences | Mail option gives us
    more areas to configure as we can set Internet options as well as Sending and
    Receiving preferences.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_105_1.png)


    Accessing preferences from within mail using the More button and then selecting
    Preferences gives us the following tabs to select from:'
  merge: -1
  img_proc: true
- pgno: 106
  md: '![](img/dc4e954e82cbb69d6ea9b87ab543c676_106_0.png)


    # # Letterhead


    Throughout the chapter, as I have mentioned, we have learned how to configure
    most of the preferences listed on each tab in the previous screenshot. On the
    **Basics** tab, we had options on to we enable the spell check along with view
    and folder management. On the **Signature** tab, we could set up our signature
    to append to each memo that we send. The **Follow Up** and **Sender Colors** tabs
    allowed us to configure our **Quick Flag** options and color code our messages
    from particular senders.


    The preference we have not looked at is the Letterhead. We may have noticed that
    when we create a message, the header of the memo will typically contain a graphic
    as in the following example that has the maple leaf:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_106_1.png)


    We can change this graphic by going to mail preferences and clicking on the **Letterhead**
    tab and browsing the different letterhead options. For each graphic that we select,
    to the right there is a preview screen. One of my favorites is the surfboards.
    We have an option to select **No Letterhead** if we prefer.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_106_2.png)


    Letterhead is visible only within our organization. When a message is sent externally,
    the letterhead is removed or sent as an attachment. Don''t forget the **No Letterhead**
    option if we prefer to not have the letterhead become an attachment when sending
    to external people.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Context menu (right-click menu)


    The context menu has shortcuts to often used features such as:


    +   * Quick Flag: Adds a flag to a message

    +   * Move to Folder...: Allows us to file messages into folders

    +   * Mark as: This gives the option to mark as Read or Unread

    +   * Add Sender to Contacts...: Creates a contact of the sender in our contacts

    +   * Reply: Provides reply options to the sender of the message

    +   * Reply to all: Provides reply options to the sender of the message as well
    as those in the cc as well as bcc fields

    +   * Forward: Forwards the message including history and attachments

    +   * Copy Into New: Gives the option to copy the message into another message,
    a calendar entry, or a To Do

    +   * Open in New Window: Opens the currently selected message in a new window

    +   * Print...: Opens the print dialog box

    +   * Delete: Moves the message to Trash


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_107_0.png)


    # Adding tables and sections


    Tables can be added to messages and documents as well as sections as described
    next.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Tables


    Tables can be a great tool to enter data into. We can use the tab key to move
    from one cell to another. When I create stationery in Mail, I often use tables
    as I find them easier to layout my message.


    The following is an example of a table that we can create in Lotus Notes. When
    we create a table, we can see a Table menu where we can select table properties.
    From within the table properties, we can select colors for the cells, cell border
    size and style, give a border effect such as the Drop Shadow, and even create
    animated tables.


    | Product | Part Name | Part # | Cost per unit |

    | :--- | :--- | :--- | :--- |

    | ![Product Image] | Buck Rogers Rocket Brown | 100-012-AA | $1,500.00 |

    | | Planet Green | 100-012-5B | $1,680.00 |

    | | Slip Stream Pink | 100-012-CC | $600,000.00 |

    | | Space Package | 100-012-CC | $2,651.886.00 |


    # Sections


    Sections help organize text within documents. For example if I was adding Policy
    information to a Lotus Notes document, I may want to organize the text into different
    paragraphs. I can then add those paragraphs to sections which will collapse the
    text into a heading. When the person wants to read the contents of that paragraph,
    they click on the heading, which expands the section. This summarizes the document
    and allows people to quickly identify the paragraph that is of interest to them.


    Sections are either expanded or collapsed. We can also create a section within
    a section. The following screenshot shows the Acme Cleaning Products section being
    expanded.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_108_0.png)'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Printing documents


    In Lotus Notes we can print documents and views.


    +   1. To print, first we need to select the documents we want to print, then
    select File | Print or press Ctrl+P.

    +   2. Select the printer and click the Settings button to select duplex options,
    among other things.

    +   3. In the What to Print window, we can determine how we want the print to
    be displayed. I recommend selecting each option and clicking the Preview button
    to view.

    +   4. The Quality tab allows us to select our preferred options.

    +   5. The Copies option lets us select the number of copies we wish to print.


    # What to Print section


    In the Print dialog box there is a What to Print section as shown in the following
    screenshot:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_109_0.png)


    You can select any of the following options:


    +   - **As laid out on screen**: This will print everything that you see on the
    screen.

    +   - **Selected view**: This will print the documents as they are listed in the
    view. As in the example below, the Date column and the Topic column will be printed:


    | Date | Topic |

    | :--- | :--- |

    | | v iPad (Karen Hooper) |

    | | don''t think it will sell'' (Karen Hooper 14/04/2010) |

    | | we''ve the idea'' (Karen Hooper 15/04/2010) |


    +   - **Selected documents**: This will print each document selected on individual
    pages.


    > Don''t forget to preview what we are about to print.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Summary


    In this chapter, we have explored the available mail tools in Lotus Notes. Many
    of these tools have been created to assist us in working more efficiently. For
    example, flagging or marking a message for follow up can assist with managing
    your inbox, using stationery can save time by having ready-made e-mail templates
    ready to go, the simple trick of adding our signature to our personal dictionary
    in the spell checker can save being prompted with the spell checker each time
    we send a message, and so on. Rules are also very powerful and are a great tool.
    Hopefully advantage of these tools and put them to work!'
  merge: -1
  img_proc: true
