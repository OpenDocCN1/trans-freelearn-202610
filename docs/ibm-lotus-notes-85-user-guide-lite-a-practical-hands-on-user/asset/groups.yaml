    \ 规则 文件夹顶部的按钮将规则上移或下移来更改规则顺序。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_99_0.png)\n\
    \n我们可以随时编辑或禁用规则，如果不再需要，也可以删除规则。\n\n## 邮件大小指标和配额\n\n在某些组织中，邮件管理员可能会设置配额，以帮助管理用户邮件的大小。如果设置了配额且我们的邮件大小超过设定限制，我们将看到警告消息，告知我们已超过配额。此外，发送给我们的新邮件可能会被延迟，并且在我们将邮件大小减小到低于配额之前，可能无法保存已发送的邮件。如果启用了配额，我们将在邮件左上角看到一个指示器，如下面的屏幕截图所示。\n\
