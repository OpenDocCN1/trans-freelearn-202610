    \ |\n| 黑名单, 白名单 | 包含, 不包含, 等于 & 不等于 | |\n| 所有文档 | 无可用选项 | |\n\n> **所有文档** 条件允许我们在规则启用时，对到达我们邮箱中的所有消息执行操作。例如，我们可以选择\
