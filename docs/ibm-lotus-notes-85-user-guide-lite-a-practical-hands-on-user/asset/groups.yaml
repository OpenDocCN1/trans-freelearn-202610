  mdcn: "\n\n- 播放声音：此选项适用于设置了闹钟的人。使用此选项，我们可以选择在闹钟响起时播放的声音。单击扬声器图标以测试所选声音。我们可能希望为不同优先级选择单独的声音，或设置专门用于后续跟进的声音。\n\
    \n- 带主题的电子邮件通知：此选项会在闹钟响起时发送电子邮件。如果我们想提醒其他人有事项需要跟进，这是一个绝佳选择。确保在“收件人”字段中输入我们希望接收通知的人员地址。单击地址簿图标从目录中选择姓名。我认识很多人，他们会给自己发一条消息，提醒自己需要跟进某条消息！\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_77_0.png)\n\n> 随时都可以编辑旗帜选项。我有时这样做是为了更改截止日期或在“输入后续跟进操作”字段中添加其他评论。例如，我可能已经打电话给那个人，被告知他们正在休假。我会将截止日期更改为他们返回后一两天，并添加评论，注明我打电话的日期以及他们目前正在休假。\n\
    \n## 快速旗帜\n\n快速旗帜选项允许我们快速添加带有预设选项的旗帜。要添加快速旗帜，我们有以下选项：\n\n- 选择一条或多条消息，然后单击消息列表上方的旗帜图标，如下所示：\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_77_1.png)\n\n- 选择一条或多条消息，然后单击消息列表上方的旗帜图标并选择快速旗帜：\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_78_0.png)\n\n- 选择一条或多条消息，然后右键单击并选择快速旗帜：\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_78_1.png)\n\n- 在消息内部，单击电子邮件标题上方按钮行中的旗帜图标。\n\
    \n## 设置快速旗帜选项的后续跟进首选项\n\n快速旗帜具有与添加旗帜时相同的可用选项。我们可以按照以下说明设置此首选项：\n\n1. 如有必要，打开邮件。\n\
    2. 单击消息列表上方的“更多”，选择“首选项”，然后选择“后续跟进”选项卡。\n3. 对于“优先级”，选择在标记消息时要显示的优先级。\n4. 勾选“设置后续跟进日期”，输入数字，并选择“天”、“月”或“年”以设置默认后续跟进日期。要添加后续跟进时间，请选择“设置后续跟进时间”并选择一天中的时间。\n\
    5. 勾选“设置触发闹钟”，然后输入数字。选择“天”、“小时”或“分钟”，并选择“之前”或“之后”以设置在后续跟进日期或时间之前或之后多长时间触发闹钟。然后执行以下任一操作：\n\
    \   - 要在使用快速旗帜功能时应用默认闹钟设置，请勾选“对快速旗帜使用闹钟设置”。\n   - 要在闹钟响起时播放声音，请勾选“播放声音”，并从下拉列表中选择要播放的声音。单击扬声器图标以测试所选声音。\n\
    \   - 要在闹钟响起时发送电子邮件，请勾选“发送电子邮件通知给”，并输入应接收通知的人员地址。单击地址簿图标从目录中选择姓名。\n6. 单击“确定”。\n\
    \n要使闹钟与后续跟进旗帜配合使用，我们必须首先在首选项中启用它们。转到“文件 | 首选项 | 日历和待办事项”，选择“闹钟”选项卡并勾选“显示闹钟通知”，然后单击“确定”。\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_79_0.png)\n\n## 后续跟进视图和迷你视图\n\n后续跟进视图位于“已发送”下方。我们可以将消息拖动到此文件夹以添加后续跟进旗帜，也可以打开此视图来管理我们的后续跟进。从此区域，我们可以对列进行排序，打开或预览已标记的消息，编辑旗帜，并删除旗帜。\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_80_0.png)\n\n后续跟进迷你视图始终在视线范围内，因为它显示在邮件文件左侧导航器的底部，这是一个非常宝贵的功能。\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_80_1.png)\n\n从此区域，我们可以对列进行排序，打开已标记的消息，编辑旗帜，并删除旗帜：\n\
    \n- 可以通过将光标移动到消息上方来显示消息的所有列。或者，我们可以调整此窗口的大小。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_80_2.png)\n\
    \n- 可以通过双击消息来打开它。\n- 可以通过单击“删除旗帜”从迷你视图和后续跟进视图中删除消息（完成操作后）。消息保留在其他邮件视图或文件夹中，但不再带有后续跟进旗帜。\n\
    - 在迷你视图中，我们可以调整视图和列的大小：\n  - 通过拖动“后续跟进”字样上方的区域，垂直调整迷你视图的大小。\n  - 通过拖动其右边缘，水平调整迷你视图的大小。\n\
    \  - 通过拖动列分隔线，调整列的大小。\n  - 通过拖放列标题，重新排列列的顺序。\n\n使用迷你视图，我们可以选择显示会议通知和待办事项，如果不希望显示后续跟进消息，可以不显示。我们可以单击“后续跟进”字样旁边的向下箭头，切换到显示“新通知”（日历通知，例如邀请或接受等）或“待办事项”。\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_81_0.png)\n\n在迷你视图中，有一个专门用于优先级旗帜图标的列。我们会在收件箱和邮件中其他可以看到优先级图标的视图中看到此列。然后，我们可以单击列标题将所有优先级分组在一起；这将把所有高优先级的后续跟进项放在列表的顶部。\n\
    \n## 允许代理人在管理我们的邮件时添加后续跟进旗帜\n\n我们可以授予代理人（通常是个人助理）代表我们在邮件中添加后续跟进旗帜的权限。此选项在“访问与代理\
    \ | 邮件首选项”中启用。代理人必须获得读取、编辑和创建任何文档、发送邮件、启用“外出办公”访问或更高权限。\n\n> 当我在收件箱中标记一条消息后，我会将其归入某个文件夹。我可以从后续跟进视图或迷你视图访问该消息，因此没有必要将其保留在收件箱中——这是保持收件箱大小最小化的绝佳选择。\n\
    \n> 当我们显示对话时，可以为对话标记后续跟进操作，这样做时，旗帜会添加到对话中的每条消息。\n\n## 删除旗帜\n\n有几种方法可以从电子邮件中删除旗帜。如果已完成后续跟进操作且不再需要该电子邮件，最明显的做法就是直接删除它！在迷你视图中，单击“删除旗帜”按钮。\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_82_0.png)\n\n或者，从任何视图或文件夹，或从电子邮件内部，选择“后续跟进”按钮，然后选择“删除旗帜”，如下所示：\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_82_1.png)\n\n## 信纸\n\nLotus Notes 中的信纸概念类似于\
    \ Microsoft Word 中的模板，我们可以创建包含可重复使用信息的消息。例如，许多人力资源部门都有一个用于发布职位空缺的标准消息。IT 部门可能会发送一条宣布服务器中断的标准消息，等等。这些消息中的信息大部分都相同。例如，服务器中断备忘录会有不同的服务器名称和日期，但“收件人”和“主题”字段中的值等其他信息将保持不变。因此在这些情况下使用信纸可以避免我们每次都重新创建消息。我遇到过不少人，他们创建了信纸用于预订机票或住宿。信纸包括他们的常旅客信息以及护照详细信息等等。他们通常还会包含一个带有“日期”、“时间”、“出发地”、“抵达地”等标题的表格，这样在请求航班时，他们只需输入详细信息并在表格中制表键跳转即可。\n\
    \n我们可以创建带有文本或图形的信纸，并包含可重复使用的收件人列表。\n\n> 如果信纸包含附件，我们每次需要发送信纸时都可以编辑附件。\n\n"
