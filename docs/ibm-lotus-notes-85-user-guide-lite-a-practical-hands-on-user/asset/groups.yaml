    \ | |\n| 发送副本给 | 完整或仅标题 | 输入要发送到的姓名 |\n| 设置过期日期 | 数字 | 天, 周, 月, 年 |\n| 将重要性更改为\
    \ | 高, 正常, 低 | |\n| 停止处理 | 无可用选项 | |\n| 删除 (不接受消息) | 无可用选项 | |\n\n> > **发送副本给**\
