    \ them to the Junk; this function is called **Block Mail from Sender**. This feature\
    \ allows us to filter incoming messages and move those from specific senders directly\
    \ to Junk so that they bypass our inbox. We can use this function in all mail\
    \ views and folders except for **Sent, Rules, Stationery, and Follow Up**. Mail\
    \ in Junk will need to be deleted manually.\n\n### Managing junk mails\n\nFollow\
    \ the steps below to add mail to Junk.\n\n1. Open mail, select a message from\
    \ a sender whose messages we want to add to Junk.\n\n2. From within the inbox,\
    \ click the **More** button and select **Deliver Sender's Mail to Junk**. The\
    \ Junk Mail Senders List dialog box will open as shown in the next screenshot.\
    \ Select if we want to block the mail from the individual sender or mail from\
    \ any address that ends with the sender's domain.\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_94_0.png)\n\
    \n3. Click OK. The messages from this sender will now go directly to Junk located\
    \ in the side navigator as highlighted here:\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_94_1.png)\n\
    \n4. To unblock, from within Junk, select the **Manage Junk Mail Senders List**\
    \ button; this opens the Junk Mail Senders List dialog box and we can select a\
    \ name to remove or click the **Remove All** button. We can delete the e-mail\
    \ in Junk however the sender's details will remain in the Junk Mail Senders List.\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_94_2.png)\n\n> > We can also manage\
    \ Junk mail from the Rules folder, which we will look at in the next section.\n"
  mdcn: "\n\n我们不应忘记将签名添加到词典中。如果不这样做，每当我们发送消息并启用了拼写检查选项时，它将拼写检查我们的名字以及我们添加到签名中的所有内容。如果拼写检查器捕获了签名的部分内容，请在拼写检查对话框中选择“添加到词典”按钮。\n\
    \n## 设置拼写检查首选项\n\n如前所述，我们可以选择不同的拼写检查选项来自定义拼写检查器。\n\n1. 单击“文件”|“首选项”。\n2. 单击“拼写检查”。\n\
    3. 设置以下任一选项：\n\n   - 从“主要词典”列表中选择语言词典，然后单击“设置为默认值”。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_89_0.png)\n\
    \n   - 选择“补充词典”选项，在此我们可以看到可选择的补充词典。这需要由我们的 IT 部门安装。\n   - “编辑用户词典”选项列出了我们添加到词典中的所有单词，例如我们的姓名、公司名称、产品名称以及我们使用的缩写。我们可以在“首选项”中或在提示时从拼写检查对话框中编辑此词典。在此区域内，我们可以在“新建/选定单词”字段中输入新单词，然后单击“添加”按钮来添加新单词。我们还可以选择诸如\
    \ Admin 之类的单词（如图所示），更改拼写，然后单击“更新”按钮。最后，我们可以通过在列表中选择单词，然后单击“删除”按钮来删除用户词典中的单词。\n\
    \   - 有一个“忽略包含数字的单词”选项。对于使用包含字母和数字的零件号或型号的产品的人来说，这是一个非常好的选项。我们还可以设置“忽略全大写单词”。\n\
    \   - 我们还有一个适用于多语言文档的选项——在下一次语言标记更改之前保持即时词典更改。\n   - 选择“启用即时拼写检查”选项将用下方的红色波浪线突出显示拼写错误的单词。\n\
    \   - 在“即时更正”下，我们可以选择希望自动更正的典型键入错误。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_90_0.png)\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_90_1.png)\n\n4. 单击“确定”。\n\n> 即时更正功能仅适用于\
    \ Lotus Notes 8.5.1 英语客户端。\n\n## 非在办公室\n\n每当我们休年假或不在办公室时，启用非在办公室功能非常重要。当同事或客户给我们发送电子邮件时，他们会收到通知，告知我们不在办公室，包括不在办公的日期，更重要的是，我们何时返回办公室。在\
    \ Lotus Notes 8.5 中，缺席通知会立即发送。\n\n我实际上不仅在休假时才使用我的非在办公室功能。如果我当天在参加培训，通常要到当天晚些时候或第二天才能查看电子邮件，因此我也会启用它。参加会议或其他商务外出时，我也会启用它。我们可以编辑非在办公室，为每次外出发送自定义消息。通知服务仅在我们指定的离开和返回时间之间发送回复，并且只向每个发件人发送一条回复。\n\
    \n### 启用非在办公室功能\n\n启用此功能的步骤如下：\n\n1. 在“邮件”或“日历”中，单击**更多**按钮，然后选择**非在办公室**…\n\n\
    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_91_0.png)\n\n2. 输入**离开**日期和**返回**日期。如果外出时间少于一天，请选中**指定小时数**，并输入外出的小时数。具体取决于我们组织的服务器配置，我们可能可以选择小时数，也可能只能选择日期。选中**会议期间不可用**，以向他人显示我们在这些时间无法参加会议及其他相关活动。\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_91_1.png)\n\n3. 在**标准通知**选项卡上，如有需要，编辑**主题**字段，并选择**在主题中追加返回日期**，以便发件人清楚地看到我们何时返回。在**其他正文文本**中，添加任何进一步详细信息，例如外出的原因或我们外出期间代替我们工作的人员的联系方式。要清除此字段，可以单击**主题**字段上方的**重置默认值**按钮，然后添加新详细信息。\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_92_0.png)\n\n4. 如果要发送替代通知，请选择**替代通知**选项卡，向特定人员或来自特定域（如\
    \ @sampledomain.com）的人员发送替代的非在办公室通知。在**收件人**字段中指定人员和域。然后指定替代通知的内容。\n\n5. 如有需要，单击**排除**选项卡，以在满足特定条件时取消非在办公室通知。在相关字段中指定所需的条件。此处有一个选项可防止回复发送到从\
    \ Internet 接收的消息。如果这是我们的偏好，请选中**不自动回复来自 Internet 地址的邮件**。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_92_1.png)\n\
    \n6. 单击**启用并关闭**，或者，如果我们已启用非在办公室通知但更改了一些非在办公室设置，请单击**保存并关闭**。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_92_2.png)\n\
    \n### 如何禁用非在办公室功能（如有必要）\n\n默认情况下，非在办公室功能会自动禁用自身；但是，在某些组织中，我们需要手动禁用非在办公室，因为它未启用为服务运行。如果我们确实需要自己禁用它，非在办公室会向我们发送提醒。\n\
    \n1. 打开“邮件”或“日历”。\n2. 在消息列表上方，单击“更多”|“非在办公室”。\n3. 单击“禁用并关闭”。\n\n**缺席时长：**\n最短时间为一小时。最少天数为一天。不能设置\
    \ 1 天 4 小时。必须选择时间或日期之一。\n\n我们可以允许邮件代理启用非在办公室通知。在邮件文件首选项的**访问与委托**部分中，选择**邮件、日历、待办事项和联系人**组件，然后授予**读取、编辑和创建任何文档、发送邮件、启用非在办公室或更高权限**。\n\
    \n## 垃圾邮件\n\n我们经常收到不需要的电子邮件。可以通过将这些电子邮件添加到垃圾邮件中来阻止它们；此功能称为**阻止发件人邮件**。此功能允许我们筛选传入消息，并将特定发件人的消息直接移动到垃圾邮件中，以便它们绕过收件箱。除了**已发送、规则、信纸和跟进**之外，我们可以在所有邮件视图和文件夹中使用此功能。垃圾邮件中的邮件需要手动删除。\n\
    \n### 管理垃圾邮件\n\n按照以下步骤将邮件添加到垃圾邮件中。\n\n1. 打开“邮件”，选择要将其消息添加到垃圾邮件的发件人的一条消息。\n\n2.\
    \ 在收件箱中，单击**更多**按钮，然后选择**将发件人邮件发送到垃圾邮件**。将打开垃圾邮件发件人列表对话框，如下一张屏幕截图所示。选择是要阻止来自单个发件人的邮件，还是阻止来自以发件人域结尾的任何地址的邮件。\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_94_0.png)\n\n3. 单击“确定”。此发件人的消息现在将直接进入垃圾邮件，位于侧边导航器中，如下突出显示：\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_94_1.png)\n\n4. 要取消阻止，在垃圾邮件中，选择**管理垃圾邮件发件人列表**按钮；这将打开垃圾邮件发件人列表对话框，我们可以选择一个名称进行删除，或单击**全部删除**按钮。我们可以删除垃圾邮件中的电子邮件，但发件人详细信息将保留在垃圾邮件发件人列表中。\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_94_2.png)\n\n> > 我们还可以从“规则”文件夹管理垃圾邮件，我们将在下一节中介绍。\n\
    \n"
