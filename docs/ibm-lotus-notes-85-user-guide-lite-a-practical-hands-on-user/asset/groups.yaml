    When we click the Open button, the attachment will be opened in the program it
    was created in. For example, if it is a Word attachment, it will launch Microsoft
    Word and open the attachment. When we click the Open button, it is similar to
    when we are opening a Microsoft document in "Read Only" mode. Any edits to the
    document will not be saved unless we select File | Save As. Use this option only
    when we want to view the attachment in the program it was created in.


    ### Editing attachments: Edit button


    When we click the Edit button, it allows us to open and edit attachments. An example
    of where we would use this option is if someone has sent a message with an attachment
    that they require us to update. We would select Reply with History & Attachments,
    which creates a new message with the history and a copy of the original attachment.
    Select the attachment we need to update and double-click or right-click and Edit;
    the attachment will open in the program it was created in. Update the attachment
    and then select the save option in the program it was created in. The attachment
    in the message has now been updated and we can send the message. This is the only
    place where the attachment edit has been saved so make sure we save the memo by
    either sending it or saving it as a draft. If we need to access the edited attachment,
    it can be found in the Sent and All Documents.


    ### Viewing attachments: View button


    The view option allows us to open the attachment in Lotus Notes rather than launching
    the program it was created in. This option is excellent for viewing the attachment
    quickly; previewing zipped files without unzipping them; or for viewing files
    of programs we do not have installed.


