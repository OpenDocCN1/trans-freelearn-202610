    # Accessing mail in Lotus Notes


    The first step in exploring mail is to open mail in Lotus Notes. There are a couple
    of ways that we can open mail:


    +   First, from the Home page by clicking the Mail icon as in the following screenshot.
    If we click the New button, it will create a new message.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_37_0.png)


    +   Also, by clicking Open and selecting Mail from the list.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_37_1.png)


    # Creating and replying to messages


    In the following sections we will discuss how to create and reply to messages
    including reviewing message actions including setting delivery options.


    # Creating a message


    Once we have opened mail, we can create a message by clicking on the New button
    and then selecting Message as shown next. As we can see from the message drop
    down list, there are other options available such as Meeting, Contact, and so
    on that we can create.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_37_2.png)'
  - '[PAGE 38]


    Another way to create a message is by using the keyboard shortcut Ctrl+M. This
    can be done from anywhere within Lotus Notes, not just when we have mail opened
    – for example, we can create a message when we are in our Calendar, from within
    Contacts, or from the Home page using the Ctrl+M option.


    # Message actions


    Now that we have created a message, we will explore some of the message actions.
    Along the top of the message, we can see buttons that enable us to do certain
    things. The following is a screenshot of the available options. We will briefly
    explore each of these options.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_38_0.png)


    +   * Send: This speaks for itself; when clicked the message is sent!


    +   * Send and File...: This is an excellent option when sending messages, as
    it allows us to not only send the message but also to file the message into our
    folders at the same time. When we click Send and File..., we will see the Folders
    dialog box with all our personal folders available. The following is a screenshot
    of the Folders dialog box that appears when we select the Send and File option.
    We would select the folder we want to file the message into and then click either
    the OK button or press the Enter key. The message will be filed in the folder;
    it will also be automatically filed into Sent and All Documents. Note that this
    does not mean we have three copies of the message filed in the three locations.
    There is only the one copy of the message in our personal folder; Sent and All
    Documents. This means if we delete the message from our personal folder, it will
    be deleted from the Sent and All Documents.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_38_1.png)'
