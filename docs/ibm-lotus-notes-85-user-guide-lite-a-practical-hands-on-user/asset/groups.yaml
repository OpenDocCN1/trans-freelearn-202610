    # # Formatting messages


    Many times when we send a message, we want to format it in a particular way.

    There are several formatting options in Lotus Notes. Note that whatever formatting

    we can do in mail, we can also do in calendar entries, To Dos, and documents in

    Lotus Notes application which have rich text fields.


    We can access formatting options in the following different ways:


    +   • From the Toolbar

    +   • From the Text menu as shown here:

    +   • From Text properties, which can be accessed by the right-click menu or via

    +   the keyboard shortcut Ctrl+K

    +   • From the right click menu there is a subset of formatting options available

    +   • Using keyboard shortcuts such as Ctrl+B for bold


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_44_0.png)


    The following is a screenshot of the right-click menu, the formatting options

    are highlighted:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_44_1.png)'
  - '[PAGE 45]


    The Toolbar has several formatting options. The following is a legend of the Editing
    Toolbar for our reference:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_45_0.png)


    | 1 Font selection & size | 5 Bullets & Numbers | 9 Insert Table | 13 Ruler |

    |---|---|---|---|

    | 2 Bold & Italics | 6 Alignment | 10 Attach a file | 14 Context Help (F1) |

    | 3 Permanent Pen | 7 Spacing | 11 Import | |

    | 4 Indent & Outdent | 8 Styles | 12 Check Spelling | |


    Here is an example of the text properties dialog box, which has several tabs with
    options. The following screenshot shows the Font (a) tab with the Color options
    selected:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_45_1.png)


    We mentioned as a tip the Permanent Pen and the Highlighter Pen as great tools
    to use when replying to messages because of their ability to allow us to show
    our text in a different color and also to highlight text. There is also the Text
    Color icon in the Toolbar; highlight text or put your cursor in a position where
    you want to change to another color then click this button to select a color.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_45_2.png)


    # # Using the Permanent Pen and Highlighter Pen


    To use the Permanent Pen, simply click the Permanent Pen icon in the Toolbar and
    start typing. To turn it off, we just need to click the icon again. When using
    the Permanent Pen, our cursor will have a pen-like icon.'
  - '[PAGE 46]


    To use the Highlight Pen, click the **Highlight Pen** icon and highlight text
    by dragging left to right over the text; to undo anything we have highlighted,
    drag right to left. To turn off the Highlighter Pen, click the **Highlighter Pen**
    icon again – basically it is toggle on and toggle off.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_46_0.png)


    # Changing the Permanent Pen font and color


    By default, the permanent pen font is red, bold, and Default Sans Serif. To change
    these options, follow these steps:


    +   1. Create a memo and put the cursor in the body of the memo.

    +   2. Click on the **Text** menu, then **Text Properties**. Alternatively right-click
    and select **Text Properties** from the menu.

    +   3. Click the Font (a) tab.

    +   4. Select a font, size, style, and/or color.

    +   5. Go to the **Text** menu and select **Permanent Pen - Set Permanent Pen**.

    +   6. Discard the memo.


    # Dragging and dropping text


    We can drag-and-drop text from within a document or message. We can also drag
    text from one document or message to another via the window tabs. We just need
    to highlight the text we want to move and then drag it to the desired location.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_46_1.png)


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_46_2.png)'
  - '[PAGE 47]


    # # Shortcut keys in Lotus Notes


    The Ctrl key on our keyboard comes in quite handy when we are editing text within
    Lotus Notes. Following are some common usages of the Ctrl key within Lotus Notes:


    | Keyboard shortcuts | Description |

    | :--- | :--- |

    | Ctrl+B | Selected text is made bold |

    | Ctrl+I | Selected text is made italics |

    | Ctrl+U | Selected text is underlined |

    | Ctrl+Z | Undo option |

    | Ctrl+C | Selected text is copied |

    | Ctrl+V | Selected text is pasted |

    | Ctrl+X | Selected text is cut |


    # ## Further formatting options


    If we click on the Create menu, we can see more formatting options. We can add
    pictures, page breaks, a horizontal rule (which is similar to a thick line), sections
    that collapse text under a heading, computed text that allows you to add animated
    text, hotspots that can link to URLs or file links, tables, images, and objects.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_47_0.png)'
  - '[PAGE 48]


    When copying an Excel® spreadsheet into a message, use the Paste Special and select
    Paste link to source from the options presented. This will paste the spreadsheet
    into the message. Now if we double-click on the spreadsheet, it will activate
    Excel®.


    If we add a table into a message or Lotus Notes document, we can copy the table
    and paste it into Excel® — the cells will be maintained and the information copied
    across.


    # # Attachments


    Many times, the reason we send a message to someone is because we want to send
    them a particular file. To send a file, we must attach it to the message.


    # # Adding attachments to messages or documents


    There are four ways to add an attachment to a message or document:


    +   - Go to the menu and select File | Attach. A Create Attachments dialog box
    will open; browse here to select the attachment(s) we want to add and then click
    the Create button.


    +   - Click the Attach icon in the Toolbar or the Attach button below the Toolbar.
    Both actions will result in the opening of the Create Attachments dialog box as
    it does when we select File | Attach.


    +   - If we have Windows Explorer open, and our message or document is open in
    Lotus Notes, we can drag the attachment from Windows Explorer to the Lotus Notes
    icon in the Task bar, and then drop into the message or document we have open
    in Lotus Notes. If we resize the Windows Explorer dialog box to be smaller than
    the Lotus Notes window, we can simply drag from Windows Explorer straight to the
    message or document we have open in Lotus Notes.'
  - '[PAGE 49]


    The following is a screenshot of the Create Attachments dialog box; refer to the
    number legend to understand each area:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_49_0.png)


    > > We can also drag attachments from a message or document to a new message or
    document. Select attachment, drag to tabs, go to new message or new document,
    and then continue to drag to the position where we want to place it in the attachment.


    # # Working with attachments


    Now that we know how to add attachments, we need to explore what we can do with
    attachments.


    When we double-click on the attachment, we will see the Open Attachment dialog
    box as shown in the next screenshot. From here we can select Open, Edit, View,
    Save, and Cancel. Alternatively if we right-click, we will see more available
    options.'
  - '[PAGE 50]


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_50_0.png)


    # Opening attachments: Open button


    When we click the Open button, the attachment will be opened in the program it
    was created in. For example, if it is a Word attachment, it will launch Microsoft
    Word and open the attachment. When we click the Open button, it is similar to
    when we are opening a Microsoft document in "Read Only" mode. Any edits to the
    document will not be saved unless we select File | Save As. Use this option only
    when we want to view the attachment in the program it was created in.


    # Editing attachments: Edit button


    When we click the Edit button, it allows us to open and edit attachments. An example
    of where we would use this option is if someone has sent a message with an attachment
    that they require us to update. We would select Reply with History & Attachments,
    which creates a new message with the history and a copy of the original attachment.
    Select the attachment we need to update and double-click or right-click and Edit;
    the attachment will open in the program it was created in. Update the attachment
    and then select the save option in the program it was created in. The attachment
    in the message has now been updated and we can send the message. This is the only
    place where the attachment edit has been saved so make sure we save the memo by
    either sending it or saving it as a draft. If we need to access the edited attachment,
    it can be found in the Sent and All Documents.


    # Viewing attachments: View button


    The view option allows us to open the attachment in Lotus Notes rather than launching
    the program it was created in. This option is excellent for viewing the attachment
    quickly; previewing zipped files without unzipping them; or for viewing files
    of programs we do not have installed.'
