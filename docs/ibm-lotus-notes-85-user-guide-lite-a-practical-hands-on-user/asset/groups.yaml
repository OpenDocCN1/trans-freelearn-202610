    window tab bar.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_21_0.png)


    If we have selected to group our tabs, then we will have an option to close the
    group when we right-click on the tab.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_21_1.png)


    > To close all currently opened window tabs, select **File | Close All**. An alternative
    way to close an opened window tab is to press the **Esc** button on the keyboard.


    Window tabs can be rearranged by dragging them into a preferred position.


    We can switch to a different window tab by pressing **Alt+W**. This will display
