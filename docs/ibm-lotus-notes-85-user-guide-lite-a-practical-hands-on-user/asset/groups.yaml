  mdcn: "\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_0_0.png)\n\n## 专业知识精粹\n\n##\
    \ IBM Lotus Notes 8.5 用户指南：LITE\n\n一本实用的实操用户指南，提供节省时间的技巧，以及关于如何高效、有效地使用 Lotus\
    \ Notes 客户端界面和邮件的全面说明\n\nKaren Hooper\n\n[PACKT] 企业\n\n## IBM Lotus Notes 8.5\
    \ 用户指南：LITE\n\n一本实用的实操用户指南，提供节省时间的技巧，以及关于如何高效、有效地使用 Lotus Notes 客户端界面和邮件的全面说明\n\
    \nKaren Hooper\n\n[PACKT] 企业\n出版\n专业知识精粹\n\n伯明翰 - 孟买\n\n## IBM Lotus Notes 8.5\
    \ 用户指南：LITE\n\n版权所有 © 2011 Packt Publishing\n\n版权所有。未经出版商事先书面许可，本书任何部分不得以任何形式或任何方式复制、存储在检索系统中或传输，除非用于批判性文章或评论中的简短引用。\n\
    \n在编写本书的过程中，已尽力确保所呈现信息的准确性。然而，本书中的信息是按现状出售的，不提供任何明示或暗示的担保。作者、Packt Publishing\
    \ 及其经销商和分销商对本书直接或间接造成或被指造成的任何损害概不承担责任。\n\nPackt Publishing 已努力通过适当使用大写字母提供书中提及的所有公司和产品的商标信息。但是，Packt\
    \ Publishing 不能保证此信息的准确性。\n\n首次出版：2011 年 4 月\n\n出版参考编号：1120411\n\n由 Packt Publishing\
    \ Ltd. 出版。\n32 林肯路\n奥尔顿\n伯明翰，B27 6PA，英国。\n\nISBN 978-1-849683-86-9\n\nwww.packtpub.com\n\
    \n封面图片由 Sandeep Babu (sandyjb@gmail.com) 提供\n\n## 致谢\n\n**作者**\nKaren Hooper\n\
    \n**审稿人**\nSusan Bulloch\nKaren Hobert\nMary Beth Raven\nKathy Staples\n\n**获购编辑**\n\
    Kerry George\n\n**技术编辑**\nArun Nadar\n\n**索引编制人**\nRekha Nair\n\n**制作协调员**\nArvindkumar\
    \ Gupta\n\n**封面制作**\nArvindkumar Gupta\n\n| 伦弗鲁郡议会 | |\n|---|---|\n| 183591921\
    \ | |\n| Bertrams | 31/10/2012 |\n| | £12.99 |\n| CEN | |\n\n## 关于作者\n\nKaren\
    \ Hooper 是 IBM 认证讲师，精通系统管理和开发。Karen 和她的丈夫 Steve 拥有并管理 Dr Notes Solutions，这是一家位于澳大利亚的顶级\
    \ IBM 商业合作伙伴和 IBM 授权培训合作伙伴。\n\nKaren 拥有 13 多年 Lotus Notes 和 Domino 的经验，从 4 版到\
    \ 8.5.1 版。Karen 参与过多个重大升级项目和公司范围的培训计划。她负责为多个组织定制并制作最终用户和帮助台培训材料。对 Karen 来说，最终用户培训是一项热情所在，因为她相信培训投资始终会为个人和组织带来回报。Karen\
    \ 也是 Domino 系统管理和开发方面的技术讲师。她的热情在于赋能人们，使他们提高生产力并使用可用的工具。Karen 已看到成千上万的人从她的培训风格中受益。\n\
    \nKaren 与她的丈夫 Steve 住在澳大利亚墨尔本一个美丽的海滨郊区。他们有两个孩子，Zac 和 Zoe，以及两只卡瓦普犬，Jess 和 Bella。\n\
    \n如需联系 Karen，她的电子邮件地址是 Karen.Hooper@drnotes.com.au。\n\n## 致谢\n\n有那么多人我需要感谢，感谢他们帮助我将这本书变为现实。首先是我的丈夫\
    \ Steve，他是我生命中的挚爱，也是“除此之外 Karen 必须完成你的书”的严厉督促者！我在写这本书期间有幸诞下我们美丽的小女儿 Zoe Grace，有时发现按时完成截止日期极其困难。如果没有\
    \ Steve，这一切都不会发生。我也要感谢 Zac，我生命中另一位英俊的男子汉。感谢你帮助我，并为我完成这本书祈祷。你的鼓励确实很有帮助——还有倒垃圾和打扫厨房\
    \ :) 。Dr Notes 的各位，你们都激励着我，你们简直都太棒了。感谢 Packt 的各位，你们忍受了我和我的激素变化。特别感谢 Ed Brill 向\
    \ Packt 推荐我——这是我职业生涯的一大亮点。还要感谢 Mary Beth Raven、Karen Hobert 和 Kathy Staples 的宝贵意见。你们都非常忙碌，我很感激也很荣幸你们抽出时间审阅本书。我只希望这本书能以最佳光彩展示\
    \ Lotus Notes；我相信这款产品及其背后的人们。\n\n## 关于审稿人\n\nSusan Bulloch 在 IBM Lotus Software\
    \ 软件支持和开发岗位工作了 10 年。Susan 目前担任 Lotus Products SWAT 团队的支持工程师，支持整个 Lotus 产品线，专注于\
    \ Lotus Notes 和 Domino。她自 1992 年起就在银行和公用事业行业担任管理员、讲师、开发人员和架构师，使用 Lotus Notes 和\
    \ Domino。Susan 拥有工程学学士学位和信息技术硕士学位。她持有所有当前 Lotus Notes 和 Domino 产品版本的认证，并积极参与新\
    \ IBM 产品 Beta 版本的质量测试。Susan 经常在技术会议上发表演讲，包括 Lotusphere、View Admin 会议以及全球各地的地区用户组会议。\n\
    \nKaren Hobert 是 Top Dog（一家位于加利福尼亚州洛杉矶的独立 IT 研究分析和咨询公司）的首席分析师。Karen 是一位面向企业的信息技术研究分析师、程序员、顾问和教育家，专长于通信、协作、社交软件、内容管理和企业数据管理技术。她也是基于\
    \ Web 的业务流程应用程序课程和研讨会的作者，以及协作战略公会的创始成员。\n\nMary Beth Raven 领导 Lotus Notes 的用户体验设计团队。她于\
    \ 2005 年加入 Notes 团队，开始着手开发 Lotus Notes 8。在此之前，她参与了五个版本 Lotus Sametime 的用户体验设计。Mary\
    \ Beth 在 IBM、FTP 软件和数字设备公司从事过用户体验设计工作。她拥有美国纽约州特洛伊 Rensselaer 理工学院的修辞与沟通博士学位。\n\
    \nKathy Staples 在 IT 行业拥有 20 多年的经验，担任过多种职务，包括帮助台官员、软件开发人员、网络工程师/管理员和技术销售。Kathy\
    \ 在 IBM 工作了过去 10 年，担任 Lotus 软件的技术销售职务，其中包括与 Linux 团队合作开发和维护 Linux 内核的一部分的一段短期经历。Kathy\
