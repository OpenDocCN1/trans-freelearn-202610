    | :--- | :--- | :--- |\n| Sender | Contains, does not contain, Is & Is not | |\n\
    | Subject | Contains, does not contain, Is & Is not | |\n| Body | Contains, does\
    \ not contain, Is & Is not | |\n| Importance | Contains, does not contain, Is\
    \ & Is not | High, normal, low |\n| Delivery priority | Contains, does not contain,\
    \ Is & Is not | High, normal, low |\n| To, cc, bcc & To and cc | Contains, does\
    \ not contain, Is & Is not | |\n| Body or Subject | Contains, does not contain,\
    \ Is & Is not | |\n| Internet domain | Contains, does not contain, Is & Is not\
    \ | |\n| Size | Is less than, is greater than, is, is not | |\n| Form | Contains,\
    \ does not contain, Is & Is not | Note: an example of a form is the memo form\
    \ |\n| Blacklist, whitelist | Contains, does not contain, Is & Is not | |\n| All\
    \ documents | None available | |\n\n> The **all documents** condition lets us\
    \ perform an action on all messages that arrive in our mail while the rule is\
    \ enabled. For example, we might select **all documents** and specify sending\
    \ a copy of all e-mails we receive to an alternate e-mail address while we are\
    \ out of the office.\n\n- 4. Once we have added one condition, we can add further\
    \ conditions and/or exceptions.\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_98_0.png)\n\
    \n- 5. We can, at any time, **Remove** or **Remove All** conditions using the\
    \ buttons on the right-hand side of the screen.\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_98_1.png)\n\
    \n> Do not use quotation marks when adding text we want to check against. Text\
    \ is not case sensitive.\n\n- 6. Once we have entered the conditions, the next\
    \ step is to **Specify Action**. Rules have several actions available and we can\
    \ add more than one. The actions available are listed here:\n\n| Action | Options\
    \ | Additional options |\n| :--- | :--- | :--- |\n| Move to folder | Select the\
    \ folder to move to | |\n| Copy to folder | Select the folder to copy to | |\n\
    | Send copy to | Full or header only | Enter names to send to |\n| Set expiry\
    \ date | Number | Day(s), week(s), month(s), year(s) |\n| Change importance to\
    \ | High, normal, low | |\n| Stop processing | None available | |\n| Delete (don't\
    \ accept message) | None available | |\n\n> > Send copy to is a great option for\
    \ allowing another person to manage our mail while we are out of the office. They\
    \ receive a copy of the message and we still receive the original mail.\n\n- 7.\
    \ Click Add Action.\n- 8. Click OK to close the dialog box; the rule is now enabled.\n\
    \nAs we can see from the options, rules are quite extensive. Once created, rules\
    \ act in the order they appear (top to bottom) in the Rules folder. We can change\
    \ the order of the rules by using the buttons at the top of the Rules folder by\
    \ moving them up or down.\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_99_0.png)\n\
    \nWe can edit or disable a rule at any time as well as delete the rule if it is\
    \ no longer required.\n\n## Mail size indicators and quotas\n\nIn some organizations,\
    \ mail administrators may set a quota to assist in managing the size of people's\
    \ mail. If a quota is set and our mail becomes larger than the set limit, we will\
    \ see warning messages letting us know we have exceeded our quota. In addition,\
    \ new mail sent to us may be delayed, and we may not be able to save sent mails\
    \ until we have reduced the size of our mail to below our quota. If quotas are\
    \ enabled, we will see an indicator in the top left-hand side of our mail as shown\
    \ in the next screenshots.\n\nWhen we access our mail stored on a server, the\
    \ Mail Quota Status indicator is displayed as a thermometer.\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_99_1.png)\n\
    \nWhen we access a local replica, the Mail Quota Status indicator displays as\
    \ an envelope overlapped by a thermometer:\n"
  mdcn: "\n\n## 规则\n\n我们的收件箱经常被大量消息淹没，这可能会让人感到不知所措。防止这种情况的一种方法是使用规则来管理邮件。我们可以使用邮件规则，对收到的符合特定条件的新消息自动执行操作。我们可以创建一条规则来检查来自特定发件人或包含特定主题的消息，并自动将消息移动到特定文件夹、将消息副本发送给某人，或在看到它们之前删除不需要的消息。例如，我订阅了几个网站，并设置了规则，将这些网站发来的新闻通讯直接移动到一个文件夹，以便它们绕过我的收件箱。\n\
