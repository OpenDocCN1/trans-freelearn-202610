    有时我们创建文件夹后需要重命名或删除它，因为它已不再需要。以下部分介绍如何执行这两项任务。


    ## 重命名和删除文件夹


    我们经常会创建文件夹，但过一段时间后可能需要更改文件夹名称，或者在某些情况下将其删除。以下是执行这些任务的方法：


    - 1. 单击“文件夹”旁边的 + 图标展开文件夹。

    - 2. 选择要重命名或删除的文件夹，然后右键单击。

    - 3. 将出现如下屏幕截图所示的菜单。选择“重命名文件夹...”以重命名文件夹。系统将提示输入新名称；输入新名称，然后单击“确定”按钮。

    - 4. 要删除文件夹，请从菜单中选择“删除文件夹”。系统将显示一条通知，指出此操作无法撤销，是否要继续？选择“是”按钮继续，或选择“否”取消删除文件夹。


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_58_0.png)


    我们还可以通过简单地将文件夹拖放到新位置，将文件夹从一个子文件夹移动到另一个文件夹，或从主文件夹移动到子文件夹。


    ## 选择邮件


    在管理邮件时，我们通常需要选择多封邮件，以便将选定的邮件归档、删除或转发给其他人。


    ## 选择一个或多个邮件或文档


    我们通常需要选择文档，以便对其进行归档、删除或将其转发给其他人。以下是可能的场景：


    - 一个或多个连续文档：单击一个文档，然后按住 Shift 键，再单击要选择的最后一个文档。

    - 一个或多个非连续文档：按住 Ctrl 键，然后单击每个文档。

    - 视图中的所有文档：单击“编辑 | 全选”，或“编辑 | 取消全选”，或 Ctrl+A。

    - 左侧边距中的勾选框：我们可以选择一个首选项：文件 | 首选项 | 基本 Notes 客户端配置 | 其他选项 | 为选定文档在边距中显示勾选标记。该首选项允许我们在边距中单击。我们还可以按空格键选择文档，并使用上下箭头键导航到不同的文档。


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_59_0.png)


    在邮件中选中一条消息后，可以执行以下操作：删除、打印、归档、复制、转发或标记为未读/已读。


