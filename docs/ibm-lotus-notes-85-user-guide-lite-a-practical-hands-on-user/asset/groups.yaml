    ## IBM Lotus Notes 8.5 用户指南：LITE


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_123_0.png)


    IBM Lotus Notes 是一个集成的桌面客户端选项，提供安全性丰富的“电子邮件和日历”功能，并具备强大的协作业务应用平台。Lotus Notes 能帮助您高效、快速且富有成效地将业务沟通提升到新水平。这本令人兴奋的用户指南能让业务用户简单高效地掌握
    Lotus Notes 的客户端界面和邮件功能。


    本书简短，聚焦于 Lotus Notes 的重要客户端界面和邮件功能，同时让业务用户对基本功能有更深入、更清晰的理解，为使用邮件时遇到的众多问题提供解答。


    ## 本书适用人群


    如果您是一位希望充分利用 Lotus Notes 的业务用户，那么这本书就是为您而写。无论是初学者还是资深专业人士，本书旨在涵盖客户端界面和邮件功能、最佳实践、技巧、窍门和工具，助您在
    Lotus Notes 8.5 中更智能地工作——几乎不费吹灰之力。


    ## 从本书中您将学到什么


    - 通过自定义 Lotus Notes 首选项，提高工作效率

    - 使用新功能和高级功能，轻松实现高效的邮件管理

    - 掌握 Lotus Notes 邮件工具，例如规则、信纸等

    - 发现使用客户端界面和商务电子邮件的专家提示和最佳实践


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_123_1.png)


    $19.99 US £12.99 UK ISBN 978-1-849683-86-7 51999


