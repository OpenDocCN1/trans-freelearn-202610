  md: "\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_106_0.png)\n\n## Letterhead\n\n\
    Throughout the chapter, as I have mentioned, we have learned how to configure\
    \ most of the preferences listed on each tab in the previous screenshot. On the\
    \ Basics tab, we had options to enable the spell check along with view and folder\
    \ management. On the Signature tab, we could set up our signature to append to\
    \ each memo that we send. The Follow Up and Sender Colors tabs allowed us to configure\
    \ our Quick Flag options and color code our messages from particular senders.\n\
    \nThe preference we have not looked at is the Letterhead. We may have noticed\
    \ that when we create a message, the header of the memo will typically contain\
    \ a graphic as in the following example that has the maple leaf:\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_106_1.png)\n\
    \nWe can change this graphic by going to mail preferences and clicking on the\
    \ Letterhead tab and browsing the different letterhead options. For each graphic\
    \ that we select, to the right there is a preview screen. One of my favorites\
    \ is the surfboards. We have an option to select No Letterhead if we prefer.\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_106_2.png)\n\nLetterhead is visible\
    \ only within our organization. When a message is sent externally, the letterhead\
    \ is removed or sent as an attachment. Don't forget the No Letterhead option if\
    \ we prefer to not have the letterhead become an attachment when sending to external\
    \ people.\n\n## Context menu (right-click menu)\n\nThe context menu has shortcuts\
    \ to often used features such as:\n\n- Quick Flag: Adds a flag to a message\n\
    - Move to Folder...: Allows us to file messages into folders\n- Mark as: This\
    \ gives the option to mark as Read or Unread\n- Add Sender to Contacts...: Creates\
    \ a contact of the sender in our contacts\n- Reply: Provides reply options to\
    \ the sender of the message\n- Reply to all: Provides reply options to the sender\
    \ of the message as well as those in the cc as well as bcc fields\n- Forward:\
    \ Forwards the message including history and attachments\n- Copy Into New: Gives\
    \ the option to copy the message into another message, a calendar entry, or a\
    \ To Do\n- Open in New Window: Opens the currently selected message in a new window\n\
    - Print...: Opens the print dialog box\n- Delete: Moves the message to Trash\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_107_0.png)\n\n## Adding tables and\
    \ sections\n\nTables can be added to messages and documents as well as sections\
    \ as described next.\n\n## Tables\n\nTables can be a great tool to enter data\
    \ into. We can use the tab key to move from one cell to another. When I create\
    \ stationery in Mail, I often use tables as I find them easier to layout my message.\n\
    \nThe following is an example of a table that we can create in Lotus Notes. When\
    \ we create a table, we can see a Table menu where we can select table properties.\
    \ From within the table properties, we can select colors for the cells, cell border\
    \ size and style, give a border effect such as the Drop Shadow, and even create\
    \ animated tables.\n\n| Product | Part Name | Part # | Cost per unit |\n| :---\
    \ | :--- | :--- | :--- |\n| ![Product Image] | Buck Rogers Rocket Brown | 100-012-AA\
    \ | $1,500.00 |\n| | Planet Green | 100-012-5B | $1,680.00 |\n| | Slip Stream\
    \ Pink | 100-012-CC | $600,000.00 |\n| | Space Package | 100-012-CC | $2,651,886.00\
    \ |\n\n## Sections\n\nSections help organize text within documents. For example\
    \ if I was adding Policy information to a Lotus Notes document, I may want to\
    \ organize the text into different paragraphs. I can then add those paragraphs\
    \ to sections which will collapse the text into a heading. When the person wants\
    \ to read the contents of that paragraph, they click on the heading, which expands\
    \ the section. This summarizes the document and allows people to quickly identify\
    \ the paragraph that is of interest to them.\n\nSections are either expanded or\
    \ collapsed. We can also create a section within a section. The following screenshot\
    \ shows the Acme Cleaning Products section being expanded.\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_108_0.png)\n\
    \n## Printing documents\n\nIn Lotus Notes we can print documents and views.\n\n\
    - 1. To print, first we need to select the documents we want to print, then select\
    \ File | Print or press Ctrl+P.\n- 2. Select the printer and click the Settings\
    \ button to select duplex options, among other things.\n- 3. In the What to Print\
    \ window, we can determine how we want the print to be displayed. I recommend\
    \ selecting each option and clicking the Preview button to view.\n- 4. The Quality\
    \ tab allows us to select our preferred options.\n- 5. The Copies option lets\
    \ us select the number of copies we wish to print.\n\n### What to Print section\n\
    \nIn the Print dialog box there is a What to Print section as shown in the following\
    \ screenshot:\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_109_0.png)\n\nYou can\
    \ select any of the following options:\n\n- **As laid out on screen**: This will\
    \ print everything that you see on the screen.\n- **Selected view**: This will\
    \ print the documents as they are listed in the view. As in the example below,\
    \ the Date column and the Topic column will be printed:\n\n| Date | Topic |\n\
    | :--- | :--- |\n| | v iPad (Karen Hooper) |\n| | don't think it will sell (Karen\
    \ Hooper 14/04/2010) |\n| | we've the idea (Karen Hooper 15/04/2010) |\n\n- **Selected\
    \ documents**: This will print each document selected on individual pages.\n\n\
    > Don't forget to preview what we are about to print.\n\n## Summary\n\nIn this\
    \ chapter, we have explored the available mail tools in Lotus Notes. Many of these\
    \ tools have been created to assist us in working more efficiently. For example,\
    \ flagging or marking a message for follow up can assist with managing your inbox,\
    \ using stationery can save time by having ready-made e-mail templates ready to\
    \ go, the simple trick of adding our signature to our personal dictionary in the\
    \ spell checker can save being prompted with the spell checker each time we send\
    \ a message, and so on. Rules are also very powerful and are a great tool. Hopefully\
    \ advantage of these tools and put them to work!\n\n## Index\n\n### A\n\n- archiving\n\
