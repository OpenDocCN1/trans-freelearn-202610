- raw:
  - '[PAGE 77]


    +   * Play sound: This option is for those who set an alarm. Using this option,
    we can select a sound to play when the alarm goes off. Click the speaker icon
    to test the selected sound. We might want to select a separate sound for different
    priorities or have a sound dedicated just for follow ups.


    +   * Send e-mail notification with subject: This option will send an e-mail when
    the alarm goes off. It is a great option if we want to remind someone else that
    something needs to be followed up. Make sure to type the addresses of those we
    want to receive the notification in the Recipients field. Click the address book
    icon to select names from a directory. I know lots of people who send a message
    to themselves to remind them that they have to follow up a message!


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_77_0.png)


    > > At any time, we can edit the flag options. I sometimes do this to change the
    due by date or to add additional comments in the Enter Follow Up Action field.
    For example, I might have rung the person and been told they are on leave. I would
    change the due date to be a couple of days after they return and add comments
    noting the date I rang and that they are currently on leave.


    # # Quick Flag


    The Quick Flag option allows us to quickly add a flag with preset options. To
    add a Quick Flag, we have the following options:


    +   * Select a message(s) then click the flag icon above the message list as shown
    next:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_77_1.png)'
  - '[PAGE 78]


    +   - Select a message(s) and then click the flag icon above the message list
    and select Quick Flag:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_78_0.png)


    +   - Select a message(s), and then right-click and select Quick Flag:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_78_1.png)


    +   - From within a message, click the flag icon in the row of buttons above the
    e-mail header.


    # # Setting Follow Up preferences for the Quick Flag option


    The Quick Flag has similar options available that we have when we add a flag.
    We can follow the instructions given next to set this preference:


    +   1. If necessary, open mail.

    +   2. Click on More above the message list, select Preferences, and then the
    Follow Up tab.

    +   3. For Priority, select a priority to display when we flag a message.

    +   4. Check Set follow-up date, type a number, and select day(s), month(s), or
    year(s) to set a default follow up date. To add a follow up time, select Set follow-up
    time and select a time of day.

    +   5. Check Set an alarm to go off and then type a number. Select Day(s), Hour(s),
    or Minute(s), and select Before or After to set the amount of time before or after
    the follow up date or time to trigger the alarm. Then do any of the following:

    +      o To apply the default alarm settings when we use the Quick Flag feature,
    check Use alarm settings for Quick Flag.'
  - "[PAGE 79]\n\n+   o To play a sound when the alarm goes off, check Play sound\
    \ and select a sound to play from the drop-down list. Click the speaker icon to\
    \ test the selected sound.\n+   \n+   o To send an e-mail when the alarm goes\
    \ off, check Send e-mail notification to and type the addresses of those who should\
    \ receive the notification. Click the address book icon to select names from a\
    \ directory.\n\n+   6. Click OK.\n\nFor alarms to work with follow up flags, we\
    \ must first enable them in our preferences. Go to File | Preferences | Calendar\
    \ and To Do, select the Alarms tab and check Display alarm notifications, and\
    \ then click OK.\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_79_0.png)\n\n# #\
    \ Follow Up view and Mini view\n\nThe Follow Up view is positioned under Sent.\
    \ We can drag messages to this folder to add a follow up flag or we can open this\
    \ view to manage our follow ups. From within this area, we can sort our columns,\
    \ open or preview the message(s) that have been flagged, edit the flag, and remove\
    \ the flag."
  - '[PAGE 80]


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_80_0.png)


    The Follow Up Mini view is always in the line of sight as it displays in the bottom
    of the navigator on the left-hand side of our mail file, which is an invaluable
    feature.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_80_1.png)


    From within this area, we can sort our columns, open the message that has been
    flagged, edit the flag, and remove the flag:


    +   * We can display all of the columns for a message by moving the cursor over
    the message. Alternatively, we can resize this window.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_80_2.png)


    +   * We can open the message by double-clicking it.


    +   * We can remove the message from the Mini View and Follow Up view (once you
    have completed the action) by clicking Remove Flag. The message stays in other
    mail views or folders, but no longer has a follow up flag.


    +   * In the Mini View we can resize the view and columns:

    +     * Resize the Mini View Vertically by dragging the area above the words Follow
    Up.

    +     * Resize the Mini View Horizontally by dragging its right edge.

    +     * Resize the Columns by dragging the column dividers.

    +     * Reorder the columns by dragging and dropping the column headers.'
  - '[PAGE 81]


    With the mini view we can choose to display meeting notices and To Dos, and not
    display Follow Up messages if we prefer. We can switch to the display New Notices
    (Calendar notices such as invites or acceptance and so on) or To Do by clicking
    the down arrow beside the words Follow Up.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_81_0.png)


    In the mini view, there is a column dedicated to the priority flag icon. We will
    see this column in our Inbox and other views in our mail, as well where we can
    see the priority icon. We can then click on the column header to group all our
    priorities together; this will group all our high priority follow ups to the top
    of the list.


    # Allowing delegates to add follow up flags when managing our mail


    We can give delegates (typically personal assistants) the ability to add follow
    up flags on our behalf within our mail. This option is enabled within Access &
    Delegation | Mail Preferences. Delegates must be given Read, edit, and create
    any document, send mail, enable Out-of-Office access or higher.


    > When I flag a message that is in my inbox I then file it into one of my folders.
    I can access the message from either the Follow Up view or the Mini view so it
    is not necessary to keep it in the inbox – a great option for keeping the size
    of one’s inbox to a minimum.


    > When we display conversations, we can flag conversations for follow up action
    and, when we do, the flag is added to each message in the conversation.


    # Removing flags


    There are several ways to remove a flag from an e-mail. The obvious action, if
    one has completed the follow up action and no longer requires the e-mail, is to
    simply delete it! In the Mini view, click the Remove Flag button.'
  - '[PAGE 82]


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_82_0.png)


    Alternatively from any view or folder or from within the e-mail, select the Follow
    Up button and then select Remove Flag as shown next:


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_82_1.png)


    # Stationery


    Stationery in Lotus Notes is a similar concept to templates in Microsoft Word,
    we can create a message that has information in it that we will reuse. For example
    many HR departments have a standard message they send to announce job vacancies.
    The IT department may send out a standard message announcing server outage, among
    other reasons. The information in these messages is predominantly the same. For
    example, the server outage memo would have a different server name and date but
    the other information such as the value in the To and Subject fields would remain
    the same. Therefore using stationery in these instances saves us from having to
    recreate the message each time. I have come across quite a few people who have
    created Stationery to send when they are booking flights or accommodation. The
    stationery includes their frequent flyer information as well as passport details
    and so on. They typically will also include a table with headings such as Date,
    Time, Depart From, Arrive At, and so on so that when they are requesting flights
    they simply just enter details and tab through the table.


    We can create stationery with text or graphics and include a recipient list that
    we can reuse.


    > If the Stationery includes an attachment, we can edit the attachment each time
    we need to send the stationery.'
