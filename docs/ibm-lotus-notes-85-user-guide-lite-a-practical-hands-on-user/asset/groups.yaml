    \n我们可以在侧边导航栏的 **工具** 下访问 **规则**。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_95_0.png)\n\
    \n有一个 **快速规则** 选项，它是最常用规则配置的简化集，可以快速应用——因此得名 **快速规则**。\n\n下表说明了一些 **快速规则** 和 **规则**\
