    # About the Author


    Karen Hooper is an IBM Certified Instructor in both System Administration and
    Development. Karen and her husband Steve own and manage Dr Notes Solutions, a
    Premier IBM Business Partner and IBM Authorized Training Partner, based in Australia.


    Karen has over 13 years of experience with Lotus Notes and Domino, from version
    4 to 8.5.1. Karen has been involved in several major upgrade projects and company-wide
    training initiatives. She has been responsible for customizing and producing end
    user and help desk training material for several organizations. End user training
    is a passion for Karen as she believes an investment in training will always give
    a return to both the individual and the organization. Karen is also a technical
    instructor in both Domino System Administration and Development. Her passion is
    to empower people so that they increase their productivity and use the tools available
    to them. Karen has seen thousands of people benefit from her style of training.


    Karen lives in a beautiful bayside suburb of Melbourne, Australia with her husband
    Steve. They are blessed with two children, Zac and Zoe, and two Cavoodles, Jess
    and Bella.


    If you wish to contact Karen, her e-mail ID is Karen.Hooper@drnotes.com.au.'
  - '[PAGE 6]


    # Acknowledgement


    There are so many people I need to thank for helping me bring this book into reality.

    First and foremost is my husband Steve who is the love of my life and the "above
    all

    else Karen do your book" disciplinarian! I had the wonderful joy of giving birth
    to

    our beautiful little daughter Zoe Grace during the writing of this book and at
    times

    found it incredibly tough to meet the deadlines. If it wasn''t for Steve it would
    not

    have happened. I need to also thank Zac, the other gorgeous man in my life. Thank

    you for helping me and praying for me to get the book done. Your encouragement

    really helped – plus putting out the rubbish and cleaning up the kitchen :). To
    the

    guys at Dr Notes, you all inspire me, you guys simply all rock. Thank you to the

    guys at Packt you did well to put up with me and my hormones. A big thank you
    to

    Ed Brill for recommending me to Packt– it was a highlight in my career. Also a
    big

    thank you to Mary Beth Raven, Karen Hobert, and Kathy Staples for their invaluable

    input. All of you are incredibly busy and I appreciated and was honored with you

    taking the time to review this book. I can only hope that this book represents
    Lotus

    Notes in its best light; I believe in the product and the people behind it.'
  - '[PAGE 7]


    # About the Reviewers


    Susan Bulloch has worked for IBM Lotus Software for 10 years in software support
    and development positions. Susan currently works as a Support Engineer on the
    Lotus Products SWAT Team, supporting the entire Lotus product line, specializing
    in Lotus Notes and Domino. She has worked with Lotus Notes and Domino since 1992
    as an administrator, instructor, developer, and architect in the banking and utility
    industries. Susan has a Bachelor''s degree in engineering and a Master''s degree
    in Information Technology. She holds certifications in all current Lotus Notes
    and Domino product releases, and is actively involved in quality testing Beta
    versions of new IBM products. Susan is a frequent speaker at technical conferences,
    including Lotusphere, the View Admin conferences, and at regional user group conferences
    worldwide.


    Karen Hobert is a Principal Analyst at Top Dog – an independent IT research analysis
    and consulting firm based in Los Angeles, CA. Karen is an enterprise-focused information
    technology research analyst, programmer, consultant, and educator with expertise
    in communication, collaboration, social software, content management, and enterprise
    data management technologies. She is also the author of courses and workshops
    on web-based business process applications and is a founding member of the Collaborative
    Strategy Guild.'
  - '[PAGE 8]


    Mary Beth Raven leads the user experience design team for Lotus Notes. She joined
    the Notes team in 2005 and started working on Lotus Notes 8. Prior to that, she
    worked on the user experience design of five versions of Lotus Sametime. Mary
    Beth has worked on user experience design at IBM, FTP software, and Digital Equipment
    Corporation. She has a Ph.D. in Rhetoric and Communication from Rensselaer Polytechnic
    Institute in Troy, NY, U.S.A.


    Kathy Staples has over 20 years of experience in the IT Industry and has been
    in many roles, including helpdesk officer, software developer, network engineer/administrator,
    and technical sales. Kathy has spent the last 10 years with IBM in a technical
    sales role for Lotus Software, which has included a short period working with
    the Linux team to develop and maintain part of the Linux Kernel. Kathy has gained
    full certification in a number of disciplines, those being Novell, Microsoft,
    and Lotus.'
