  - '[PAGE 95]


    # # Rules


    Often our inboxes get inundated with messages and it can be quite overwhelming.
    A way to prevent this is to manage our mail with rules. We can use mail rules
    to act automatically on new messages we receive that meet certain conditions.
    We can create a rule that checks for messages from a certain sender or that contains
    a certain subject and automatically move the messages to a certain folder, send
    copies of the messages to someone, or delete unwanted messages before we ever
    see them in our inbox. For example, I subscribe to several websites and I have
    set up rules to move the incoming newsletters from these websites directly to
    a folder so that they bypass my inbox.


    The mail rules we create are stored in the **Rules** folder in our mail file.
    We can go there to add new rules as well as edit the ones we''ve created. We can
    edit rules, change their order so that one rule has priority over another, turn
    them off when we don''t want to use them, or delete them entirely.


    We can access **Rules** in the side navigator under **Tools**.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_95_0.png)


    There is a **Quick Rule** option, which is an abbreviated set of the most commonly
    used rule configurations that can quickly be applied — hence the name **Quick
    Rule**.


    The following table explains some of the **Quick Rules** and **Rules** settings
    for our reference:


    | Condition | Definition |

    | :--- | :--- |

    | Contains | Contains looks for a partial match. For example, if we have selected
    the rule to act on messages that contain sales in the subject, it will act on
    a message that has sales conference as well as sales enquiry in the subject field.
    |

    | Does not contain | We will need to be careful with this as the setting is the
    complete opposite to the contains condition and is usually used in conjunction
    with contains or is. |

    | Is | Is looks for an exact match. In our sales example, it will only act on
    messages with sales and sales only in the subject. |

    | Is not | Is similar to does not contain but it looks for an exact match. |'
  - '[PAGE 96]


    # # Creating a quick rule


    Follow the steps next to create a quick rule:


    +   1. Open mail and select a message that we would like to apply a quick rule
    to.


    +   2. Select More | Create QuickRule.


    +   3. As the Quick Rule is based on information in the selected message, we will
    see values in the **Sender**, **Subject**, and **Domain** fields. We can edit
    these values if necessary. The fields could be empty if, for example, we select
    a message that doesn''t have text in the subject field.


    +   4. There are three steps to complete the rule. With each condition we can
    specify any of the following states for each field value—**contains**, **does
    not contain**, **is**, and **is not**.


    +   i. We first need to select the condition to match. There are three conditions
    to configure—**Sender**, **Domain**, and **Subject**. We can select one of these
    conditions or all three.


    | Condition | Operator | Value |

    | :--- | :--- | :--- |

    | When Sender | contains | specialoffer@myerone.com.au |

    | When Domain | is | myerone.com.au |

    | When Subject | contains | Your fantastic choice of offers and rewards |


    +   ii. We need to decide when to take action— on one or all selected conditions.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_96_0.png)


    +   iii. Choose an action to perform:


    +   • **Move to Folder**: We will need to select the folder we want the messages
    to be moved to.

    +   • **Change importance to High**: This option adds the red exclamation mark
    icon to messages to indicate the message is of high importance.

    +   • **Do not accept message**: This deletes the message. Note the message is
    not stored in **Trash** and cannot be restored.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_96_1.png)'
  - '[PAGE 97]


    5. Click OK to save the configurations. The new quick rule is created and stored
    in the Tools | Rules folder. The new quick rule acts on incoming messages, but
    existing messages in the inbox that meet the conditions of the rule are not affected.


    If the Quick Rules do not give enough options, we can create a rule.


    # Creating a rule


    Rules have many more options to configure and are quite powerful as there are
    further actions we can select from and more configurations including exceptions.


    +   1. In the side navigation pane of mail, go to Tools | Rules or alternatively
    click the More button and then select Mail Rule. This will open up the Rules folder.


    +   2. In the Rules folder, click New Rule.


    +   3. In the New Rule dialog box, there are two areas that we need to configure.
    In the first area, we need to specify conditions. Rules have several conditions
    that we can configure.


    | Condition to check | Options | Additional options |

    |---|---|---|

    | Sender | Contains, does not contain, ls & ls not | |

    | Subject | Contains, does not contain, ls & ls not | |

    | Body | Contains, does not contain, ls & ls not | |

    | Importance | Contains, does not contain, ls & ls not | High, normal, low |

    | Delivery priority | Contains, does not contain, ls & ls not | High, normal,
    low |

    | To, cc, bcc & To and cc | Contains, does not contain, ls & ls not | |

    | Body or Subject | Contains, does not contain, ls & ls not | |

    | Internet domain | Contains, does not contain, ls & ls not | |

    | Size | Is less than, is greater than, is, is not | |

    | Form | Contains, does not contain, ls & ls not | Note: an example of a form
    is the memo form |'
  - '[PAGE 98]


    | Condition to check | Options | Additional options |

    |---|---|---|

    | Blacklist, whitelist | Contains, does not contain, Is & Is not | |

    | All documents | None available | |


    > The **all documents** condition lets us perform an action on all messages that
    arrive in our mail while the rule is enabled. For example, we might select **all
    documents** and specify sending a copy of all e-mails we receive to an alternate
    e-mail address while we are out of the office.


    +   4. Once we have added one condition, we can add further conditions and/or
    exceptions.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_98_0.png)


    +   5. We can, at any time, **Remove** or **Remove All** conditions using the
    buttons on the right-hand side of the screen.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_98_1.png)


    > Do not use quotation marks when adding text we want to check against. Text is
    not case sensitive.


    +   6. Once we have entered the conditions, the next step is to **Specify Action**.
    Rules have several actions available and we can add more than one. The actions
    available are listed here:


    | Action | Options | Additional options |

    |---|---|---|

    | Move to folder | Select the folder to move to | |

    | Copy to folder | Select the folder to copy to | |

    | Send copy to | Full or header only | Enter names to send to |

    | Set expiry date | Number | Day(s), week(s), month(s), year(s) |'
  - '[PAGE 99]


    | Action | Options | Additional options |

    | :--- | :--- | :--- |

    | Change importance to | High, normal, low | |

    | Stop processing | None available | |

    | Delete (don''t accept message) | None available | |


    > > Send copy to is a great option for allowing another person to manage our mail
    while we are out of the office. They receive a copy of the message and we still
    receive the original mail.


    +   7. Click Add Action.


    +   8. Click OK to close the dialog box; the rule is now enabled.


    As we can see from the options, rules are quite extensive. Once created, rules
    act in the order they appear (top to bottom) in the Rules folder. We can change
    the order of the rules by using the buttons at the top of the Rules folder by
    moving them up or down.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_99_0.png)


    We can edit or disable a rule at any time as well as delete the rule if it is
    no longer required.


    # # Mail size indicators and quotas


    In some organizations, mail administrators may set a quota to assist in managing
    the size of people''s mail. If a quota is set and our mail becomes larger than
    the set limit, we will see warning messages letting us know we have exceeded our
    quota. In addition, new mail sent to us may be delayed, and we may not be able
    to save sent mails until we have reduced the size of our mail to below our quota.
    If quotas are enabled, we will see an indicator in the top left-hand side of our
    mail as shown in the next screenshots.


    When we access our mail stored on a server, the Mail Quota Status indicator is
    displayed as a thermometer.


    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_99_1.png)


    When we access a local replica, the Mail Quota Status indicator displays as an
    envelope overlapped by a thermometer:'
