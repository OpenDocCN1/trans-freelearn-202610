    \nTo open our archives, expand Archive in the side navigator and then select the\
    \ archive we want to open. In the above screen shot the only archive available\
    \ is Mail 2008. Once opened, the archive application is almost the same as our\
    \ current mail excluding all the e-mails! It does look slightly different as the\
    \ archive application is a yellow color and has a different title as we can see\
    \ in the next screenshot:\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_101_1.png)\n\
    \nBefore we can archive, we must configure the archive settings, which we will\
    \ go through shortly. We can have more than one archive database. Some people\
    \ have an archive database for each year. Others prefer to only have one archive\
    \ database. A consideration for how many archives we have would be size. If we\
    \ want to back up our archive applications, we might need to control the size,\
    \ therefore requiring us to have more than one.\n\n### Setting up archiving\n\n\
    Setting up archiving is quite simple, follow the steps given next:\n\n1. Access\
    \ the archive menu choices under Action | Archive | Settings....\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_102_0.png)\n\
    \n2. Click the Create... button on the right-hand side.\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_102_1.png)\n\
    \n3. This will open the Create Archive Criteria dialog box. From within here,\
    \ we have four sections that need to be complete:\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_102_2.png)\n\
    \n   i. Give a descriptive name for the archive database and check **Enable this\
    \ criteria**. Enabling the criteria shows the link to the new archive in the mail\
    \ side navigator as per our example, **Mail 2008** in the screen shot earlier.\n\
    \n   ii. Click the **Selection Criteria...** button to determine how often and\
    \ which documents we want to archive. The default is **Not modified in more than\
    \ 365 days**. We can change these options.\n\n   iii. We then need to decide **What\
    \ should happen with the selected documents**. The default is to **Copy documents\
    \ into my archive application specified here**, then **clean up this application**.\
    \ The other option is to **Just clean up this application without archiving**\
    \ however this is not recommended as there is no way to retrieve the deleted documents\
    \ if there is a need to.\n\n   iv. Finally, **How do you want to cleanup documents\
    \ in this application** gives two opportunities. The first choice is to completely\
    \ remove the document from our current mail so that we will be able to access\
    \ the document only from the archive application. The second choice is to leave\
    \ a subset or summary of the document in the current mail application. This ensures\
    \ we will see the archived document in our current mail file with a blue summary\
    \ icon on the archived document, which represents that the document has been archived,\
    \ and either the attachment has been removed or the attachment has been removed\
    \ and 40KB of text remains in the original message. The great feature about this\
    \ option is that we can open the archived document in our current mail file and\
    \ select **Actions | Open Archived Document**; this opens up the original message\
    \ that has all the original data which is now stored in our Archive application.\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_103_0.png)\n\n4. Click OK to close.\
    \ We will then be prompted with the information that to use the enabled criteria\
    \ we must archive either by selecting the option to **Archive Now** under the\
    \ **Action\\Archive** menu or clicking the **Yes** button to schedule archiving.\
    \ A schedule will automate archiving at the time we allocate.\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_104_0.png)\n\
    \nIf we select not to schedule archiving by clicking on the No button, then we\
    \ will need to manually archive some documents before the archive application\
    \ is created.\n\nThere are four ways to archive:\n\n- **Actions | Archive | Archive\
    \ Now**: This will archive documents that meet the archive criteria.\n- **Actions\
    \ | Archive | Archive Selected Documents**: This archives any documents we currently\
    \ have selected.\n- Let schedule archiving archive according to the archive criteria.\n\
    - Drag-and-drop documents into the archive database in the side navigator.\n\n\
    > **Recently Archived folder**: We can easily find our recently archived messages\
    \ by opening the **Recently Archived** folder in our archives. An archived message's\
    \ subject line says **(Archived)** and the header includes the date on which the\
    \ message was archived, which is very handy.\n\nAt any time we can **Edit**, **Delete**,\
    \ or **Disable** our settings for each database by selecting the **Actions | Archive\
    \ | Settings**.\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_104_1.png)\n\nIn the\
    \ Archive settings, we will see an Advanced tab as shown in the next screenshot:\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_105_0.png)\n\nIn this area, by default,\
    \ archiving will delete documents only if it can delete all responses as well.\
    \ An example of a response is a reply to an e-mail. By keeping this option checked,\
    \ we will always be able to show the whole conversation.\n\nThere is also an option\
    \ to Log all archiving activity into a log application option. This will give\
    \ a report each time archiving occurs and can include links to the actual documents\
    \ archived. The log is a separate application and is stored in the path listed\
    \ in the Advanced tab.\n\n## Mail preferences\n\nThroughout this chapter and the\
    \ chapter before, we have set many mail preferences to configure our mail in a\
    \ particular way. For example, we may have enabled the spell check to automatically\
    \ check spelling when we send a memo. We also may have set up Sender Colors so\
    \ that messages from certain people will be highlighted in a different color.\
    \ Mail preferences can be accessed from the File | Preferences | Mail menu or\
    \ by clicking the More button from within Mail and selecting Preferences.\n\n\
    Accessing mail preferences from the File | Preferences | Mail option gives us\
    \ more areas to configure as we can set Internet options as well as Sending and\
    \ Receiving preferences.\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_105_1.png)\n\
    \nAccessing preferences from within mail using the More button and then selecting\
    \ Preferences gives us the following tabs to select from:\n"
  mdcn: "\n\n将鼠标悬停在任一指示器上，将显示一个摘要，其中包含温度计、当前邮件数据库大小和配额以及邮件服务器名称：\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_100_0.png)\n\
    \n## 减小邮件大小的提示\n\n管理邮件可能是一项麻烦事。以下是一些可能有助于减小邮件大小的提示。\n\n- **删除邮件：** 按大小对单个邮件文件夹和视图进行排序，以找出并删除不再需要的最大邮件。执行此操作的一个好位置是“所有文档”，因为它包含所有已发送、已归档和已接收的邮件。删除邮件后，请确保进入“垃圾箱”文件夹并清空垃圾箱。\n\
    \n- **存档邮件：** 如果启用了存档，请存档不再活动的邮件。存档将在本章后面讨论。\n\n- **更改保存已发送邮件的首选项：** 如果保存已发送邮件的首选项设置为“始终”，则我们可能不必要地保存许多已发送邮件，因为我们发送的每条邮件都会保存在我们的邮件中。考虑将设置更改为“始终提示”，这样每次发送邮件时都会提示我们是否要保存它。如果选择“否”，则该邮件将无法在我们的邮件中访问。如果在发送邮件时选择“发送并归档”选项，则该邮件将自动保存。\n\
    \n- **文件附件设置：**\n  - 回复包含文件附件的邮件时，使用“仅回复历史记录”选项，该选项会删除附件但保留原始文本。\n  - 为防止在邮件中接收大附件，我们可以创建一条规则，指定如果大小（字节）大于（我们选择的数字），则删除。\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_100_1.png)\n\n## 存档\n\n如上所述，存档是减小邮件大小的一个绝佳解决方案。当我们设置存档时，它会创建当前邮件应用程序的副本，并将其本地存储在计算机上。它会在\
    \ Windows 资源管理器中创建一个名为 Archive 的新目录。如果我们需要备份存档应用程序，并且命名约定保持默认值，则可以在 Windows 资源管理器的\
    \ IBM\\Lotus Notes\\Data\\Archive 目录中找到它。\n\n我们可以从侧边导航器中的邮件文件访问存档数据库，如下所示：\n\n\
    ![](img/dc4e954e82cbb69d6ea9b87ab543c676_101_0.png)\n\n若要打开我们的存档，请在侧边导航器中展开“存档”，然后选择要打开的存档。在上述屏幕截图中，唯一可用的存档是\
    \ Mail 2008。打开后，存档应用程序几乎与我们当前的邮件相同（不含所有邮件）！它看起来略有不同，因为存档应用程序是黄色的，并且标题不同，如下一张屏幕截图所示：\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_101_1.png)\n\n在存档之前，我们必须配置存档设置（我们将稍后介绍）。我们可以拥有多个存档数据库。有些人每年都有一个存档数据库。其他人则倾向于只有一个存档数据库。决定存档数量的一个考虑因素是大小。如果我们想备份存档应用程序，可能需要控制大小，因此需要拥有多个存档。\n\
    \n### 设置存档\n\n设置存档非常简单，请按照以下步骤操作：\n\n1. 在“操作 | 存档 | 设置...”下访问存档菜单选项。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_102_0.png)\n\
    \n2. 单击右侧的“创建...”按钮。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_102_1.png)\n\n\
    3. 这将打开“创建存档条件”对话框。在此处，我们有四个部分需要完成：\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_102_2.png)\n\
    \n   i. 为存档数据库指定一个描述性名称，并选中 **启用此条件**。启用条件后，将在邮件侧边导航器中显示指向新存档的链接，如我们之前的示例所示，即\
    \ **邮件 2008**。\n\n   ii. 单击 **选择条件...** 按钮，以确定我们想要存档的频率和文档。默认值为 **超过 365 天未修改**。我们可以更改这些选项。\n\
    \n   iii. 接下来，我们需要决定 **对所选文档应执行的操作**。默认值是 **将文档复制到我在此处指定的存档应用程序**，然后 **清理此应用程序**。另一个选项是\
    \ **仅清理此应用程序而不进行存档**，但不建议这样做，因为如果需要，无法检索已删除的文档。\n\n   iv. 最后，**要如何清理此应用程序中的文档**提供两个选项。第一个选项是从当前邮件中完全删除文档，这样我们就只能从存档应用程序访问该文档。第二个选项是在当前邮件应用程序中保留文档的子集或摘要。这可确保我们在当前邮件文件中看到归档文档，且归档文档上带有蓝色摘要图标，表示该文档已被存档，并且附件已被删除，或者附件已被删除且原始消息中保留\
    \ 40KB 文本。此选项的优点是，我们可以在当前邮件文件中打开归档文档，并选择 **操作 | 打开归档的文档**；这将打开包含所有原始数据的原始消息，这些数据现在存储在我们的存档应用程序中。\n\
    \n![](img/dc4e954e82cbb69d6ea9b87ab543c676_103_0.png)\n\n4. 单击“确定”以关闭。随后，系统将提示我们，要使用启用的条件，必须通过在“操作\\\
    存档”菜单下选择 **立即存档** 选项，或单击 **是** 按钮来安排存档。计划将在我们分配的时间自动执行存档。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_104_0.png)\n\
    \n如果我们通过单击 **否** 按钮选择不安排存档，则在创建存档应用程序之前需要手动存档一些文档。\n\n存档有四种方式：\n\n- **操作 | 存档\
    \ | 立即存档**：这将存档符合存档条件的文档。\n- **操作 | 存档 | 归档所选文档**：这将存档我们当前选定的任何文档。\n- 让计划存档根据存档条件进行存档。\n\
    - 将文档拖放到侧边导航器中的存档数据库。\n\n> **最近归档的文件夹**：我们可以通过在存档中打开 **最近归档** 文件夹，轻松找到最近存档的邮件。存档邮件的主题行显示\
    \ **（已归档）**，标题中包含存档邮件的日期，这非常方便。\n\n随时可以通过选择 **操作 | 存档 | 设置** 来 **编辑**、 **删除**\
    \ 或 **禁用** 每个数据库的设置。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_104_1.png)\n\n\
    在存档设置中，我们将看到“高级”选项卡，如下一张屏幕截图所示：\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_105_0.png)\n\
    \n在此区域中，默认情况下，只有在能够删除所有回复的情况下，存档才会删除文档。响应的一个示例是对电子邮件的回复。保持此选项被选中后，我们将始终能够显示整个对话。\n\
    \n还有一个选项是“将所有存档活动记录到日志应用程序”。每次发生存档时，这都会生成一份报告，并可以包含指向实际存档文档的链接。日志是一个单独的应用程序，并存储在“高级”选项卡中列出的路径中。\n\
    \n## 邮件首选项\n\n在本章和前一章中，我们设置了许多邮件首选项，以特定方式配置我们的邮件。例如，我们可能已启用拼写检查，以便在发送备忘录时自动检查拼写。我们还可能设置了发件人颜色，因此特定人员的邮件将以不同颜色突出显示。邮件首选项可以从“文件\
    \ | 首选项 | 邮件”菜单访问，也可以在“邮件”中单击“更多”按钮并选择“首选项”。\n\n从“文件 | 首选项 | 邮件”选项访问邮件首选项，可让我们配置更多区域，因为我们可以设置\
    \ Internet 选项以及发送和接收首选项。\n\n![](img/dc4e954e82cbb69d6ea9b87ab543c676_105_1.png)\n\
    \n在“邮件”中使用“更多”按钮访问首选项，然后选择“首选项”，将为我们提供以下可选选项卡：\n\n"
