  \ 连接过程：三次握手、数据传输和拆除过程*\n\n在数据包282、283和284中，可以清楚地看到客户端和服务器正在尝试创建专用通道。客户端在数据包282中发送一个SYN数据包，SEQ设置为0，从而发起创建。由于服务器开放通信，服务器以SYN/ACK数据包回应，ACK设置为1，SEQ设置为0。随后，客户端在数据包284中发送确认，SEQ=1，ACK=1。这就是三次握手过程的样子。这可以在任何遵循TCP方法的实际数据传输之前看到。\n\
  \n通道创建成功后，客户端发送GET请求以访问web根目录的内容。服务器在数据包287中确认了这一点，并将请求的内容以200 OK状态消息发送到客户端的机器，客户端在下一个数据包中确认了该消息。再次在列表面板中看到，客户端正在请求一个新的资源，但服务器无法找到该资源，因此发送了404\
  \ Not Found状态消息，客户端在数据包295中确认了该消息。\n\n在所有数据传输完成后，当客户端没有内容可请求，或服务器没有内容可发送时，客户端发送FIN/ACK数据包以正确终止连接。服务器确认这一点，并发送自己的FIN/ACK数据包，客户端在数据包302中也确认了这些数据包。这种终止方式通常被称为拆除过程。看看\n\
  \n实际上，Wireshark使用了相对引用技术来简化编号系统，以方便用户。首先，您应该知道这些数字用于跟踪两个主机之间传输了多少数据。\n\n从数据包1开始，其中SEQ=0（实际序列号为704809601），服务器收到该数据包后，以自己的SEQ=0和ACK=1回应客户端的SEQ=0。在三次握手结束时，客户端以SEQ=1和ACK=1回复，由于此过程中没有数据传输，因此没有进一步增加。\n\
  \n然后，到第四个数据包时，客户端发送一个GET请求，SEQ=1，ACK=1，数据有效负载长度等于323（参见下图），服务器接收该请求并以SEQ=1和ACK=324确认。您看到刚才发生了什么吗？服务器通过将总数据有效负载长度添加到ACK中来回复，表示数据已成功接收。因此，它将请求的资源发送给客户端，数据有效负载长度等于451，客户端以ACK=452和SEQ=324确认。同样，传输继续进行，直到最后使用FIN/ACK数据包进行拆除。\n\
  \n![](img/da40f92928403866599198344271d63e_1202_0.png)\n\n## 优雅终止\n\n我们使用捕获的数据包和流图详细了解了TCP三次握手的过程，这使我们对过程有了深入了解。同样，我们也应该熟悉拆除过程，它表示两个主机之间会话的正确终止。\n\
  \n考虑到我们在此讨论的相同场景，让我向您展示为以标准格式终止连接而生成的数据包。请参阅以下截图：\n\n![](img/da40f92928403866599198344271d63e_1203_0.png)\n\
  \n在所有必需的数据包成功交付后，服务器发起了拆除过程（因为已没有内容可发送，或者客户端只是闲置着什么都不做）。一开始，服务器向客户端发送了自己的 `FIN`\
  \ 和 `ACK` 数据包，其中 `SEQ=452`（客户端用 `ACK` 确认了该包）和 `ACK=324`（这是数据传输完成时客户端的 `SEQ` 编号）。这些在下一个数据包中被客户端确认。按照同样的方式，客户端使用第二轮通信中使用的\
  \ `SEQ` 和 `ACK` 编号（当时客户端请求了某项不可用的内容；请参阅前面的流程图了解详情）发出自己的 `FIN` 和 `ACK` 数据包，以从自身一侧结束连接（因为连接是双向的），服务器接收并确认了这些数据包。客户端一收到服务器的\
  \ `ACK`，两台主机之间的连接就完全关闭，通信期间涉及的套接字和其他资源也随之释放。\n\n## RST（重置）数据包\n\n很多时候，会出现以下情况：服务器守护进程不可用、服务器因过载而无法处理你的请求、你被限制与服务器交互，或者你尝试连接的端口未开放（未关联任何服务）。你看到\
  \ `RST` 数据包的原因可能有很多。让我复现这个场景，并捕获我这里的客户端与服务器之间的流量，这肯定能让你更容易理解。`RST` 数据包基本上表示你试图发起的连接被突然关闭。\n\
  \n在这种情况下，服务器守护进程未运行，而客户端正在尝试通信；因此，客户端每发送一个 `SYN` 请求，都会收到返回的 `RST` 数据包。我只尝试访问了一次\
  \ Web 服务器，但你会注意到不止一个 `SYN` 和 `RST` 数据包，因为每个浏览器都会在特定时间间隔内针对无响应或已关闭的套接字进行不同次数的尝试。因此，在我们的案例中，我使用的是\
  \ Apple Safari 浏览器，它在最长 3-4 分钟内至少进行了三次重连尝试。我还尝试请求了 Google Chrome，它在短短 10 分钟内大约进行了\
  \ 7 次重连尝试（浏览器会按特定时间间隔继续发送请求）。请参考下面的截图，其中展示了在此过程中捕获到的数据包：\n\n![](img/da40f92928403866599198344271d63e_1204_0.png)\n\
  \n图5.2：捕获到的 RST 数据包\n\n## 相对序列号与绝对序列号\n\nWireshark 特意将真实的 `SEQ/ACK` 标志编号转换为更简单的格式，这使我们更容易跟踪通过网络发送的数据。例如，我有一个位于\
  \ `172.16.136.129` 的 Web 服务器和一个位于 `172.16.136.1` 的客户端。我将尝试使用 Web 浏览器访问该服务器，这将生成几个数据包，Wireshark\
  \ 会捕获这些数据包。请参考下面的截图，其中展示了为该会话生成的相应数据包。\n\n我在列表窗格中选择了为该会话生成的第一个数据包，并在其中查看了对应的详细信息。可以看到详细信息窗格和字节窗格如下高亮显示：\n\
  \n- **1**：在列表窗格中，可以看到为开始通信而分配给 `SYN` 数据包的 `SEQ` 编号是 `zero`。\n- **2**：在详细信息窗格中，可以看到数字\
  \ `0` 是一个相对序列号，并非真实的 `SEQ` 编号，而是 Wireshark 为方便我们查看而修改后的值。\n- **3**：在字节窗格中，可以看到 `SEQ=0`\
  \ 对应的十六进制值为 `0x2a028a81`，相当于十进制的 `704809601`。\n\n因此，真实的 `SEQ` 编号是 `704809601`，为了便于分析，它被转换成了\
  \ `0`。\n\n![](img/da40f92928403866599198344271d63e_1206_0.png)\n\n根据我们的分析，我们应该收到的\
  \ ACK 值应为 704809602（SEQ 值加 1）。让我们使用下一个数据包及其对应的相关信息，通过详细信息窗格和字节窗格来验证这一点。请参考下面的截图：\n\
  \n![](img/da40f92928403866599198344271d63e_1207_0.png)\n\n请参考以下列表，了解每个标注所指的含义：\n\
  \n- 我选择的第二个数据包是客户端从服务器收到的 `SYN, ACK` 数据包。它包含服务器的 `SEQ=0` 和 `ACK=1`（相对编号）。\n- 通信中第\
  \ 2 个数据包的相关信息显示在详细信息窗格和字节窗格中。如果观察详细信息窗格，服务器针对客户端请求发送的 `ACK` 是 `1`。\n- 收到的 `ACK`\
  \ 的十六进制值为 `0x2a028a82`，相当于十进制的 `704809602`。这正是我们预期的值。\n\n现在，你可以根据给定的十六进制值轻松查验绝对编号。还有一种更有趣的方式来定制编号系统，即可以直接在列表窗格和详细信息窗格中查看真实的绝对编号。按照以下步骤启用或禁用它：\n\
  \n1. 在菜单栏中导航到 **编辑 | 首选项**。\n2. 展开 **协议** 树并查找 TCP。\n3. 取消勾选 **相对序列号** 选项，如下图所示：\n\
  \n![](img/da40f92928403866599198344271d63e_1208_0.png)\n\n4. 导航到 应用 | 确定。就这样。参考下面的截图：\n\
  \n![](img/da40f92928403866599198344271d63e_1208_1.png)\n\n正如我们分析的，TCP 握手过程中的第一个数据包的\
  \ `SEQ` 编号为 `704809601`（十进制等效值）。现在，在停用 **相对序列号** 选项后，我们可以在列表窗格和详细信息窗格中观察到相同的结果。\n\
  \nTCP **协议首选项** 窗口中还有一些默认启用的选项，它们使分析更有条理、更高级。例如，尽可能验证校验和以及分析 TCP 序列号。\n\n校验和通常在传输过程中用于确保收发数据的完整性。如前所述，TCP\
  \ 头部中有一个额外字段。实际上，当发送方准备好需要传输的数据包时，它会计算包含数据的数据包的校验和，并与数据包一起发送。接收方收到数据包后，会使用发送方所用的相同算法重新计算校验和。如果数据包附带的校验和值与接收方计算的值一致，则接受该数据包；否则，包含错误（校验和不匹配）的数据包会被丢弃，而且甚至不会将发生的错误通知发送方。发送方应当自己知晓这一点。校验和的验证并非\
  \ 100% 可靠，而且这也会降低性能，因为 TCP 数据包的重组现在不会发生。\n\n校验和卸载（Checksum offloading）是只有新式网络驱动程序才支持的功能，它即将准备传输的数据包交给网络硬件处理，而这些数据包被\
  \ Wireshark 捕获时带有空的校验和字段，从而产生 `checksum offloading` 错误。原因是，即使在实际数据包传输之前，Wireshark\
  \ 也会捕获数据包（一旦实际传输发生，数据包将包含有效校验和）。这可能会导致一些困惑。因此，最佳做法是，如可用，在你的接口上关闭卸载功能，或者在 TCP 协议首选项中禁用\
  \ **验证校验和** 功能。请参考下面的图：\n\n![](img/da40f92928403866599198344271d63e_1210_0.png)\n\
  \n校验和无效的数据包以黑色背景和红色前景显示。查看详细信息窗格中红色高亮显示的错误；这说明校验和不正确，这可能是由于启用了校验和卸载功能。校验和无效的数据包无法重组，而且看起来也不美观（屏幕上出现大量无效错误），因此如果不需要，最好禁用此功能。\n\
  \n另一个你应该了解的选项是 **分析 TCP 序列号** 功能，它会跟踪 `SEQ` 和 `ACK` 编号，并让你了解传输过程中可能发生的各种类型错误，例如丢失帧、重复\
  \ `ACK`、重传、窗口缩放等。关闭此功能还会影响 **专家信息** 对话框，其中与传输错误相关的任何警告和其他有用信息都不会被填充。\n\n\n\n\n另一端端口扫描器显示统计信息。如果端口开放，恶意用户会收到\
  \ SYN 和 ACK 通知（参见以下截图），这表示我们的机器在端口 21 上开放连接，这可能成为恶意攻击的入口。\n\n![](img/da40f92928403866599198344271d63e_1212_0.png)\n\
  \n图 5.3：端口 21 开放，恶意攻击的入口点\n\n我们来看第 45 帧，客户端向服务器 172.16.136.1 发送了一个 SYN 请求。此时端口是开放的，因此我们的服务器发送了\
  \ SYN 和 ACK 数据包（第 46 帧），以积极确认连接尝试，表明服务器在端口 21 上开放连接。\n\n除了这种半开扫描之外，还可能有各种其他情况（前面截图中的扫描之所以称为半开扫描，是因为发起连接尝试的客户端永远不会通过发送服务器期望的\
  \ ACK 来完成连接）。如果你对数据包行为、连接建立与完成过程、TCP 头部、数据包中的标志以及 SEQ-ACK 序号等基础知识了解清楚，那么你就很容易发现周围流动的任何异常流量。除非你定制环境来应对或提醒此类流量异常，否则没有任何自动化工具能够指出这些异常。以下是一些你可能经常遇到的流量模式。\n\
  \n## 如何在 Wireshark 中检查不同的分析标志\n\n使用 Wireshark 分析 TCP 数据包中的标志非常简单。在每个 TCP 数据包的详细信息窗格中都有一个单独的区域。让我们从之前捕获的握手过程中选取一个\
  \ TCP 数据包，看看标志是如何在详细信息窗格中呈现的。然后，我们将尝试创建相应的显示过滤器。请参考以下截图说明：\n\n![](img/da40f92928403866599198344271d63e_1213_0.png)\n\
  \n现在，我们来看每个指针的含义：\n\n- 这里，在列表窗格中可以看到客户端发送给服务器以发起三次握手的 `SYN` 数据包。\n- 这里，与此数据包相关的标志已设置，`000000000010`\
  \ 的十六进制等效值为 `0x002`。\n- 对于相应的 TCP 数据包，`SYN` 标志位设置为 1；这可以在详细信息窗格中看到。其余标志位仍为 0。\n\n\
  现在，如果你希望创建一个显示过滤器，仅查看你已有的 `SYN` 数据包，\n\n## 用户数据报协议\n\n根据 RFC 768 的定义，UDP 是一种无连接协议，非常适合在主机之间传输实时数据，通常被认为是一种不可靠的通信形式。原因是\
  \ UDP 不关心数据包的交付，任何丢失的数据包都不会被恢复，因为发送方在传输过程中永远不会被告知数据包被丢弃或丢弃。然而，许多协议如 DHCP、DNS、TFTP、SIP\
  \ 等仅依赖于此。使用 UDP 作为传输机制的协议必须依赖其他技术来确保数据交付和错误检查能力。这些协议内置了此类功能，可以在传输过程中提供一定程度的可靠性。我们不应忘记的一点是，UDP\
  \ 提供更快的分组传输，因为它不关心 TCP 中看到的连接建立或正常终止。这就是为什么 UDP 也被称为面向事务的协议，而不是像 TCP 那样的面向消息的协议。\n\
  \n## UDP 头部\n\n通常一个 UDP 头部的大小是 8 字节；加上头部的数据理论上可以长达 65,535 字节（实际为 65,507 字节）。与 TCP\
  \ 头部相比，UDP 头部非常小；它只有四个常见字段：源端口、目的端口、数据包长度和校验和。请参考如下所示的 UDP 头部：\n\n| 源端口 | 目的端口 |\n\
  | 数据包长度 | 校验和 |\n| 应用程序数据 | |\n\n8 字节\n\n- **源端口**：这是发送方使用的端口号，用于在需要时接收任何回复。大多数情况下，在\
  \ TCP 和 UDP 中，被选为套接字一部分的端口号是临时的。在通信的另一端，端口号属于知名端口号类别。\n- **目的端口**：头部此字段标识服务器或接收方使用的端口号，所有数据将传输到此端口。IANA\
  \ 将此端口号分配给特定服务，并且肯定永久分配给同一个服务。例如，端口 53 用于 DNS，不能分配给任何其他服务（不建议）。\n- **数据包长度**：此字段指定从头部到数据末尾的数据包长度；你每次看到的最小长度将是\
  \ 8 字节，即 UDP 头部的长度。\n- **校验和**：如前所述，校验和对数据（即数据包的数据部分）进行计算以确保数据完整性，即发送方发送的内容与接收方接收到的内容相同；为了验证这一点，有几种校验和算法可以提供帮助。有时，在使用\
  \ UDP 时，你会看到我们收到的数据包中的校验和值为 0。这意味着不需要验证校验和。\n\n## 工作原理\n\n为了理解 UDP 的工作方式，让我们继续分析一些使用\
  \ UDP 作为交付协议的协议。首先，我想讨论 DHCP，然后我们也会看到 DNS 流量。实际上，我们在进行 VoIP 和 SIP 分析时也见过 UDP 流量。\n\
  \n出于分析目的，我将默认网关配置为 `192.168.1.1`，客户端配置为 `192.168.1.106`。我将使用客户端尝试生成 DHCP 和 DNS 流量，这些流量将被\
  \ Wireshark 捕获，然后我将尝试剖析每个协议的通信过程以及整个会话期间使用的不同组件。请参考我的以下网络架构：\n\n![](img/da40f92928403866599198344271d63e_1218_0.png)\n\
  \n### DHCP\n\n最常见的也是最重要的协议，它给设备分配 IP 地址并使其具备网络兼容性，这便是**动态主机配置协议（DHCP）**。现在，我将尝试从客户端释放客户端已持有的\
  \ IP 地址，这将生成一个 DHCP 数据包，并且该数据包将被我们的嗅探器捕获。请看下图来理解这一点：\n\n![](img/da40f92928403866599198344271d63e_1219_0.png)\n\
  \n在列表窗格中，我们可以看到客户端隐式生成的一个 DHCP 释放数据包，目的是释放当前 IP 地址（我在 Linux 终端上使用了 `dhclient -v\
  \ -r` 命令来释放 IP 地址，但使用此命令时要小心，因为它可能会将机器与网络断开，从而使其无法进行网络通信）。客户端从 IP 地址 192.168.1.106\
  \ 向服务器 192.168.1.1 发起请求。在 DHCP 中，客户端和服务器使用的端口号是固定的，除非手动配置，否则在你的情况下也不会更改。\n\nDHCP\
  \ 服务器端口号默认为 67，DHCP 客户端端口号默认为 68；你可以在上图中看到（突出显示为 3）。我还突出显示了第四个字段，即数据包长度字段，它指定从第一个字节到数据包中数据末尾的数据包长度。然而，在\
  \ 308 字节中，有 8 字节是 UDP 头部的长度，其余 300 字节表示附加的应用程序数据。有趣的是，如果机器重新通电，它会请求 DHCP 服务器分配一个\
  \ IP 地址。结果，这将生成一些与 DHCP 请求、释放和提供相关的数据包，以及其他各种也使用 UDP 作为传输机制的数据包。\n\n\n\n\n![](img/da40f92928403866599198344271d63e_1220_0.png)\n\
  \n我使用 `udp.port==67` 过滤器过滤了列出的数据包，以仅显示 DHCP 数据包；因此，列表窗格中将只列出 DHCP 数据包。\n\n## TFTP\n\
  \n简单文件传输协议（TFTP）是 FTP 的一个轻量级版本，用于在主机之间进行传输。与 FTP 协议不同，TFTP 不需要用户提供任何凭据。TFTP 使用 UDP\
  \ 作为传输机制。通常，TFTP 用于局域网环境；在处理可管理设备（如交换机和路由器）时，网络管理员会使用 TFTP 服务器来备份配置文件以及更新这些设备中运行的固件。安全专业人员也会使用\
  \ TFTP 将文件从其系统传输到你的系统，以提升权限（在被入侵的系统上获得更多权限）。\n\n我在 `192.168.1.106` 上运行了一个 TFTP 服务器，在\
  \ `192.168.1.104` 上运行了一个客户端。我在服务器上创建了一个文本文件 `abc.txt`，客户端将尝试下载该文件。我们部署好的嗅探器将捕获由此产生的流量。\n\
  \n![](img/da40f92928403866599198344271d63e_1221_0.png)\n\n两个主机之间进行事务处理所产生的流量已被成功捕获，与其对应的数据包如下图所示：\n\
  \n![](img/da40f92928403866599198344271d63e_1221_1.png)\n\n现在，让我们看看每个指针代表什么：\n\n\
  +   - 这表示当客户端请求 `abc.txt` 文件时，数据包的传输随即开始。在列表窗格中可以看到该请求帧。\n+   - 如前所述，TFTP 使用 UDP\
  \ 作为传输机制。请求的相关详细信息显示在详细信息窗格中，其中说明该请求是从客户端的临时端口号发起的，目的端口是服务器上的 `69` 端口（`69` 是 TFTP\
  \ 协议的知名端口）。\n+   - 该请求特定于 `abc.txt` 文件，该文件也显示在详细信息窗格的 TFTP 协议部分中。\n\n你一定很好奇两个主机之间传递的确认数据包。如前所述，UDP\
  \ 是一种不可靠的通信方式，那么为什么我们会在 UDP 中看到 ACK 呢？原因是我使用的 TFTP 服务器具有某种内置的可靠性特性。即使在客户端，通过标准控制台，在发起请求后，我收到了服务器返回的相当交互式的消息，例如“大小为\
  \ 3 字节的文件已成功传输”，并且消息中还列出了各种其他详细信息。这里值得注意的有趣之处在于，`69` 端口只参与第一个数据包，其余数据包都是由服务器内置的确认功能发送和接收的。因此，我们刚刚已经见证了一个事实：有些协议使用\
  \ UDP 作为传输协议，并有自己的内置功能来确保传输送达，这句话是正确的。\n\n## 不常见的 UDP 流量\n\n假设我们正在寻找的资源在服务器上不可用，那么此时的流量会是什么样子？请参考下面的截图来理解这一点：\n\
  \n![](img/da40f92928403866599198344271d63e_1223_0.png)\n\n如上面的截图所示，客户端请求了一个无效资源，服务器无法找到该资源，因此返回了一个错误代码和摘要消息\
  \ `File not found`。相同的消息也通过标准控制台显示给了客户端。\n\n有时，服务器守护进程可能未运行，而客户端可能请求某个资源。在这种情况下，客户端会收到\
  \ `ICMP destination unreachable` 错误，错误代码为 `3`。请参考下面的图：\n\n![](img/da40f92928403866599198344271d63e_1223_1.png)\n\
  \n现在，我们来看看每个指针代表什么：\n\n+   - 当 TFTP 服务器守护进程不可用时，服务器返回了 `ICMP destination unreachable`\
  \ 消息。\n+   - 客户端收到了类型为 `3` 的错误代码。\n+   - 关于请求的详细信息在回复中的 UDP 协议部分提到，其中说明请求被发送到了当前不可用的\
  \ `69` 端口。\n+   - 请求的资源显示在 TFTP 协议部分下。\n\n当客户端发起请求以查找与某个地址关联的名称服务器时，也经常会出现不常见的 DNS\
  \ 请求。其形式类似于下图所示：\n\n![](img/da40f92928403866599198344271d63e_1224_0.png)\n\n现在，我们来看看每个指针代表什么：\n\
  \n+   - **1：** 如列表窗格所示，位于 `192.168.1.106` 的客户端发起了一个查找地址 `8.0.0.0` 的请求，并在 `Frame\
  \ 2` 中收到了响应。\n+   - **2：** 该请求被发送到保存 DNS 缓存的默认网关。\n+   - **3：** 网关响应了一个 `No such\
  \ name` 错误。\n\n在多种场景下，你可能会看到与 UDP 相关的不常见流量。最重要的是关注 TFTP 流量，这可能是由于网络中的 TFTP 客户端产生的。这可能是你需要留意的恶意流量。\n\
  \n## 总结\n\nTCP 是一种可靠的通信方式，具有三次握手和拆除（tear down）过程等特性，可确保连接可靠且交互。\n\nTCP 报头长度为 20\
  \ 字节，包含各种字段，如源端口和目的端口、`SEQ` 和 `ACK` 序号、偏移量、窗口大小、标志位、校验和以及选项。各种标志位和报头字段的存在使发送方和接收方能够确保数据的交付以及所发送数据的完整性。\n\
  \n基于 TCP 的通信使用 `SEQ` 和 `ACK` 序号来跟踪参与主机之间发送了多少数据。\n\nUDP 是一种无连接协议，是 IP 之上的一种不可靠通信方式，丢失和丢弃的数据包永远不会被恢复。UDP\
  \ 确实为我们提供了更快的传输速度和更易于建立的会话。UDP 报头长度为 8 字节，字段很少，例如源端口和目的端口、数据包长度和校验和。在报头末尾，数据被附加。\n\
  \n常见的协议，如 DHCP、TFTP、DNS 和 RTP，大多使用 UDP 作为传输机制，这些服务是我们日常生活中处理的一些主要服务。为了使连接可靠，其中一些协议支持自带的内置确认功能。\n\
  \n在下一章中，你将学习无线流量的基础知识、如何解密无线流量，以及可能随之而来的异常情况。\n\n## 练习题\n\n+   1. **Q.1** 列出 TCP\
  \ 和 UDP 协议之间的至少五个区别。\n+   2. **Q.2** 使用你自己的 FTP 服务器捕获三次握手和拆除连接的数据包。\n+   3. **Q.3**\
  \ 解释窗口缩放（window scaling）和校验和卸载（checksum offloading）的目的，并说明它们在 TCP 通信中的相应重要性。\n+\
  \   4. **Q.4** TCP 通信如何从数据包丢失或意外终止中恢复？模仿任何可能生成此类流量的场景。\n+   5. **Q.5** 创建一个显示过滤器，使得在列表窗格中只显示从你的默认网关发送到你的机器的\
  \ TCP FIN 和 ACK 数据包。\n+   6. **Q.6** Wireshark 用于跟踪数据包的绝对编号和相对编号系统有什么区别？\n+   7.\
  \ **Q.7** TCP 报头末尾的选项字段的用途是什么？它包含哪些类型的参数？\n+   8. **Q.8** 还有另一种方法可以创建过滤器，以查看设置了特定标志的数据包。在不提供相应的\
  \ HEX 值的前提下，找出该方法是什么，以及如何使用相同技术过滤设置了 PSH 标志的数据包。\n+   9. **Q.9** 找出为什么在使用 UDP 时数据长度只能是\
  \ 65507 字节。\n+   10. **Q.10** 如果 TFTP 的服务器守护进程没有运行，你会在列表窗格中看到哪些种类的数据包？\n+   11.\
  \ **Q.11** 尝试在你本地配置的 DNS 上执行区域传送（zone transfer），并捕获流量进行分析。你注意到这些数据包有哪些有趣的事实？请简要解释。\n\
  \n\n\n\n"
- "## 理解 IEEE 802.11\n\n在**电气与电子工程师协会（IEEE）**中，有多个委员会共同推进多个项目，其中一个是802委员会，负责制定局域网（LAN）标准。基于802标准，可以从IEEE网站下载一份免费白皮书。具体而言，802.11包含了无线局域网（WLAN）标准。如果你想分析正常流量的特征，就应该了解802.11中的标准和现有的工作技术。\n\
  \n802.11标准有多个，但我们应该重点了解的是802.11b、802.11a、802.11g和802.11n，以下列表将对它们进行说明：\n\n- **802.11：**该标准仅支持1-2\
  \ Mbps的网络带宽。这也是许多802.11兼容设备被淘汰的原因。因此，开发其他802.11标准变得十分必要。\n\n- **802.11b：**该规格使用与802.11标准类似的2.4\
  \ GHz信令频率。使用b规格可在2.4 GHz频段上实现最高11 Mbit的传输速率。由于大多数家用电器（微波炉、无绳电话等）都在2.4 GHz频谱上工作，这会导致WLAN数据包传输过程中出现相当密集的干扰和拥塞。为避免干扰，无线接入点（AP）可以安装在合理距离的位置。802.11b频段被划分为14个重叠信道，其中每个信道宽度为22\
  \ MHz。在同一场景中，最多只能同时运行三个不重叠的信道。这种空间隔离对于让各信道独立工作是必要且必需的。一个设备一次只能属于一个信道；当你监听数据包时也是如此。实际上，现在可以同时嗅探多个信道，这得益于现在可用的各种工具；其中之一是Kismet，它可以每隔很短的时间间隔嗅探多达10个信道。\n\
  \n- **802.11a：**该标准基于**正交频分复用（OFDM）**，于1999年发布，支持最高54 Mbps的传输速率，这也使我们相对于802.11b拥挤频段具有优势。该规格是继802.11标准之后开发的第二个标准。它通常用于商业环境，但由于成本较高，b规格并不最适合家庭环境。虽然它支持比802.11b更高的速率（在5\
  \ GHz频谱附近），但如果配置了某规格，设备的覆盖范围会有所不足。其绕过途中障碍物的能力不如802.11b。802.11a中不会发生信道重叠。更高的受监管频率有助于防止工作在2.4\
  \ GHz频谱上的设备造成的干扰。\n\n- **802.11g：**大约在2002年年中，该规格问世，并尝试融合802.11a和802.11b的最佳特性。此处使用的信令频率为2.4\
  \ GHz，支持的带宽高达54 Mbps。由于使用2.4 GHz频率，此前受影响的范围参数得到了改善。802.11g还支持向后兼容，这意味着所有802.11g接入点都将支持使用802.11b的网络适配器，反之亦然。该规格的一个优点是：不容易被轻易阻挡。\n\
  \n- **802.11n：**为了进一步改进，引入了无线N。改进的关键领域是覆盖范围和传输速率。实现这一切的基础技术是**多输入多输出（MIMO）**通信。接入点内装有多个天线，用于发送、接收和反射信号。这使得信道频率可达40\
  \ MHz。该规格的最终版本于2007年发布，声称传输速率最高可达600 Mbps。它可以配置为2.4或5 GHz（如果接入点同时兼容两者）；它可以同时使用两种频率，从而实现对网络适配器的向后兼容。MIMO技术最多可以使用四个天线。一旦所有这些协同工作，用户就能体验到最快的速度和最大的信令范围，而且受其他工作在同一频段的设备影响不大。如果这种网络类型受到干扰，那么它也会影响到802.11b/g等其他规格。\n\
  \n## 无线通信中的各种模式\n\nWLAN使用**载波侦听多路访问/冲突避免（CSMA/CA）**协议来管理各站点发送数据，所有希望发送数据的主机都必须首先侦听信道，也就是说，如果信道空闲，则主机可以继续发送数据包；如果信道繁忙，则主机必须等待轮到自己。这是因为同一媒介被所有主机共享，从而避免了两台主机同时开始传输时可能发生的冲突，这种冲突会使网络性能变慢且更容易出错。802.11架构由多个组件组成，例如**站点（STA）**、无线**接入点（AP）**、**基本服务集（BSS）**、**扩展服务集（ESS）**、**独立基本服务集（IBSS）**和**分布式系统（DS）**。\n\
  \nSTA与AP之间存在四种常见的关联模式，如下所示：\n\n- **基础设施/管理模式：**一种无线网络环境，其中两个设备希望连接STA和AP以共享数据和网络资源，被称为基础设施模式。AP被定义了一个**服务集标识符（SSID）**，实际上就是给接入点起的一个名称，用于识别目的（出于安全原因，有时可以禁用SSID广播，这将防止你的无线网络被非预期用户发现）。例如，当你开始扫描周围可连接的Wi-Fi网络时，你会看到多个网络名称，你需要从中选择一个你认识的网络。所有这些网络名称都称为SSID。另一个有用的术语是**基本服务集标识符（BSSID）**，即接入点的MAC地址。默认情况下，每个接入点都应广播SSID并每秒发送10次信标帧，以让设备知道它们已准备好接受连接。请参阅下面的示意图，该图说明了此示例：\n\
  \n![](img/da40f92928403866599198344271d63e_1230_0.png)\n\n- **Ad Hoc模式：**在这种网络中，形成一种点对点网络，其中两个客户端直接相互连接。无线客户端发送和接收的数据包不会中继到接入点。参与通信的客户端此时负责处理发送信标和认证的过程，而在正常场景下这些工作由无线接入点（WAP）处理。\n\
  \n![](img/da40f92928403866599198344271d63e_1231_0.png)\n\n- **主模式：**当你的机器中的网卡（NIC）让你成为一个接入点时，这就是主模式的概念。高端设备具有充当接入点的能力，当NIC卡与特殊驱动程序协同工作时，这种能力就得以实现。\n\
  \n![](img/da40f92928403866599198344271d63e_1231_1.png)\n\n- **监听模式：**就本章而言，这种模式非常重要。此模式用于监听在周围空中传输的数据包；当激活监听模式时，你的设备将停止发送和接收任何数据包，而只会静默地嗅探实时流量。如果你想从无线网络中捕获与802.11协议相关的数据包，那么你的NIC和所使用的驱动程序必须支持监听模式。在诸如Linux和MAC等操作系统上，激活监听模式相当容易；但在Windows上，激活监听模式则相当麻烦。此模式通常被称为**射频监听模式（RFMON）**。\n\
  \n\n\n\n\n![](img/da40f92928403866599198344271d63e_1232_0.png)\n\n在学习了你可能会在生产环境中随意注意到的不同形式的无线网络基础设施的基础知识之后，根据你的需求在各种可用模式之间进行选择肯定会变得更容易一些。\n\
  \n## 无线干扰与信号强度\n\n为了更好地理解正常流量模式，我们应该了解影响无线网络性能的各种常见因素。例如，数据包、关联和解除关联、有无干扰时的信号强度。我们在分析上述参数时的目标是形成一个基线，在将流量模式与异常模式进行比较时，这个基线可以证明是有价值的。影响网络性能的最主要因素是不同形式的干扰，这些干扰由多种因素造成，例如厚墙、屋顶等物理障碍；以及微波炉、无绳电话等电子设备。\n\
  \n在处理无线网络时，数据的完整性变得更加重要，因为数据包只是在空中传输，任何拥有基本硬件和了解无线网络工作原理的人都可以轻松嗅探并捕获这些数据包。无线网络没有任何挽救措施来保护完整性，因此使用它们，你无法100%确保数据的安全。\n\
  \n例如，假设你在监听频谱中的某个特定信道。通常，你一次只能嗅探一个信道，但如果信道开始相互重叠，那么你很可能会在列表窗格中看到其他信道的数据包。根据无线频谱的正常运作，彼此靠近运行的网络应该选择不重叠的信道，如1、6、11、14，以避免任何问题。请参考下图，该图很好地说明了信道重叠（我使用了维基百科上的同一张图）：\n\
  \n![](img/da40f92928403866599198344271d63e_1233_0.png)\n\n无线网络的强度完全取决于承载流量的**射频（RF）**信号。一旦无线信号开始传播，随着传播距离的增加以及中间障碍物的影响，信号强度最终会减弱。在同一RF能量上工作的设备也会导致无线信号强度降低。如果你也遇到此类问题，那么仅使用Wireshark在监控模式下监听接口并不能解决问题。你需要一个频谱分析仪，例如Wi-Spy-Channelyzer，它与USB适配器配对（参考[http://metageek.com](http://metageek.com)），可以让你额外看到RF能量的形态；否则，你将无法看到它们。大多数情况下，发射高RF能量的设备可能是网络性能不佳的原因。\n\
  \n为了检查环境中的RF能量，你需要自带笔记本电脑并在办公室内走动，运行频谱分析仪，这样能够检测到可能影响无线网络性能的RF异常。这些分析仪的放置位置对于解决问题起着重要作用。如果你办公室中的某个主机无法连接，那么最佳选择是将分析仪尽可能靠近该主机，以便从主机的角度感知情况。如果你办公室中的多个主机遇到类似问题，那么最佳选择是将分析仪放在它们尝试连接的接入点附近。根据你处理的具体场景，你可以动态决定，甚至可以手动扫描办公室场所，以了解是否存在任何RF能量干扰。\n\
  \n我没有任何特殊硬件来向你展示RF能量，但我将使用Kali Linux操作系统中的一个内置工具，它将帮助我们获取关于我周围可用的不同WLAN以及所有连接到Wi-Fi的设备的各种精细细节（如果与用于频谱分析的硬件配对，这将非常有用）。该工具名为Kismet，它非常擅长以图形和各种可用的统计格式呈现细节，从而使我们能够更多地了解周边环境（请将其用于道德目的）。请按照以下步骤在Kali\
  \ Linux上使用Kismet工具：\n\n- 1. 首先，我使用`airmon-ng start wlan0`命令启用监控模式（`wlan0`是我的无线接口）。\n\
  - 2. 打开终端并输入`Kismet`。系统会要求你设置各种自定义选项——不要更改任何默认设置。\n- 3. 当系统要求你指定Kismet服务器捕获数据包的源（接口名称）时，请指定你在监控模式下运行的接口（在我的情况下是`mon0`。你可以使用`iwconfig`命令检查你的接口）。\n\
  - 4. 现在，让工具自动运行几分钟；渐渐地，你会开始注意到实时捕获的流量正在绘制成图。你会看到周围的各种无线网络以及大多数关联的设备。\n- 5. 在网络部分，你会看到无线网络的特定详细信息，例如BSSID、SSID、使用的加密算法等。\n\
  - 6. 客户端部分将显示与网络关联的各种设备。请参见下图中列出我的网络及连接到它的各种客户端的工具界面：\n\n| MAC地址 | 类型 | 频率 | 数据包数\
  \ | 大小 | 制造商 |\n|---|---|---|---|---|---|\n| D0:5B:A8:07:73:6C | 有线/AP | 2437 |\
  \ 47 | 4K | 未知 |\n| E8:4E:84:86:4A:21 | 无线 | ---- | 35 | 1K | SamsungE |\n| 64:6C:B2:ED:E6:A6\
  \ | 无线 | ---- | 11 | 1K | 未知 |\n| ! 48:74:6E:AB:34:91 | 无线 | 2437 | 178 | 22K |\
  \ 未知 |\n| D8:BB:2C:B9:53:EC | 无线 | ---- | 35 | 8K | 未知 |\n\n- - 在第三部分，有一个图表显示数据包在周围传输的当前速率，以及用红色条显示的数据包总数。\n\
  - - 在第四部分，我们可以看到列出的许多详细信息，例如主机名（Kali）、我的NIC能看到的总网络数、Kismet运行了多长时间、捕获的数据包总数，以及每秒看到的平均数据包速率。使用如此简单的工具，无需任何特殊配置，我们就能够收集到大量具体细节。\n\
  \n在窗口的右下角，显示了用于捕获详细信息的接口：mon0（一个已激活监控模式的接口）。通过此工具，我们无法捕获任何可能扭曲流量形态的RF能量，这会降低我们的网络性能。但同一工具在与Wi-Spy或Ubertooth硬件配对时，将显示RF能量频谱。如果你是需要日常处理Wi-Fi故障排除的专业人士之一，那么你应该使用它——如果不是现在，总有一天你会用到。\n\
  \n设备发出的RF能量并非每次都是问题所在；有时，你需要查看数据包级别，例如检查认证和关联数据包，也就是说，你可以将正常流量模式与你可能面临的异常进行匹配。\n\
  \n## IEEE 802.11 数据包结构\n\n数据包从一个主机传输到另一个主机所使用的介质目前已经改变，但在前面各层工作的基本协议仍然相同。正如我们已经讨论过的，第2层（数据链路层）在这里至关重要。详细了解传输中的数据包显然是一件好事；我们将讨论802.11数据包包含的各种帧类型、头部结构和信息。\n\
  \n在分析无线数据包时，你基本上会看到三种类型的帧。列出的所有数据包与我们之前看到的几乎相似；唯一的区别是由于802.11头部而附加的额外信息。以下是你将看到的头部类型：\n\
  \n- - **管理帧（Management）**：这些帧用于在数据链路层的主机之间建立连接。这些帧用于加入或离开网络、关联/解除关联/重新关联，以及广播信标帧和一些管理任务。管理帧负责主机之间建立连接期间发生的许多活动。\n\
  \  - **信标帧（The beacon frame）**：AP每十分之一秒发送一次信标帧，让STA知道AP可用于连接。\n  - **认证帧（The authentication\
  \ frame）**：这种类型的帧由STA发送给AP，包含其身份。如果AP采用开放系统认证，则STA只需发送一个认证帧，AP确认以了解连接是被接受还是拒绝。如果AP采用共享密钥认证，则STA向AP发送连接请求。然后，AP向STA发送一个质询文本。之后，STA完成质询，并使用与AP相同的算法对请求的质询文本进行加密，然后将其发送给AP。AP使用自己的密钥值接收并解密文本，无论结果如何，它都会决定连接请求的状态。\n\
  \  - **关联请求帧（The association request frame）**：该帧由STA发送到AP，用于提供资源分配的细节并用于同步。\n  -\
  \ **关联响应帧（The associate response frame）**：该帧由AP发送，作为对STA所发请求的响应。\n  - **解除认证帧（The\
  \ deauthentication frame）**：由STA发送，用于终止与AP/STA的连接。\n  - **解除关联帧（The disassociation\
  \ frame）**：该帧是一种优雅地终止连接的方式，以便AP可以释放为STA分配的资源。\n  - **探测请求帧（The probe request frame）**：该帧由STA发送到另一个STA/AP。\n\
  \n\n\n\n用于请求其详细信息；这主要用于发现附近的 AP。\n\n- **探测响应帧**：此帧用于响应 AP/STS 可能从网络中另一台设备收到的请求。\n\
  - **重关联（请求/响应）帧**：当 STA 与当前 AP 的关联被断开时，此帧被发送到新的 AP。作为响应，AP 确认接受或拒绝重关联请求。\n\n在应对高延迟时，监控主机发送的每个信标帧之间的时间间隔很有用。由于\
  \ AP 广播了这些信标数据包，设备便知道它们可供连接。\n\n- **控制帧**：用于确保主机之间数据包交付能管理信道中的拥塞级别，并使用清除发送（clear-to-send）和请求发送（request-to-send）等数据包。简而言之，这些帧用于维护任务。这些控制数据包确保了所传输数据包的完整性。同样，管理帧有好几种，而控制帧只有三种：\n\
  \  - **请求发送（RTS）**：此帧由 STA 发送，用于请求在特定时间内获得对介质的控制权。\n  - **清除发送（CTS）**：此帧由收到 RTS\
  \ 的 AP 发送，用于指定何时将介质分配给 STA 进行传输。此帧通常用于防止较旧的工作站再次尝试接入介质。\n  - **确认（ACK）**：此帧由接收 STA\
  \ 发送，用于告知发送站点数据包已成功接收。如果发送站点未收到此包，则在特定时间后，发送站点将向同一接收方重新发送数据包以确保其交付。\n- **数据帧**：这些帧包含主机之间实际发送的数据。它们是唯一在无线域和有线域之间传输的帧。\n\
  \n802.11 数据包与我们之前看到的有线网络数据包类似；术语上略有不同，但基本概念是相同的。让我们来看一个信标帧，参见以下截图：\n\n![](img/da40f92928403866599198344271d63e_1240_0.png)\n\
  \n让我们详细查看帧中的各个字段：\n\n这是帧头中的第一部分，其中列出了大量信息。\n\n- **帧控制**\n- `Protocol Version`：这是一个\
  \ 2 位值，用于验证当前所用协议的版本；撰写本文时当前版本为 0。\n- `Type`：用于标识帧的类型；在我们的案例中，我们处理的是管理帧（信标）。\n-\
  \ `Subtype`：表示帧头的子类型；对我们来说，这是一个信标帧，其数值代码为 8。\n- `DS Status`：表示数据帧是发往**分布式系统（DS）**还是工作在哪种模式。如果该位设置为\
  \ 1，则这一定是数据帧；如果设置为 0，则此帧可能是管理/控制帧。\n- `More Fragments`：如果该位设置为 1，表示帧已被分成若干部分并逐个发送。\n\
  - `Retry`：当需要重传帧时，该位设置为 1。\n- `PWR Management`：如果设置为 1，表示 STA 当前的电源管理状态，即处于 `active:\
  \ 0` 或 `power-save: 1` 模式。\n- `More Data`：如果 AP 试图告诉处于省电模式的 STA 它还有更多帧要发送，则该位设置为\
  \ 1。对于控制帧，此位始终为 0。\n- `Order`：如果该位设置为 1，表示帧被强制排队并按顺序发送。通常该位不会被设置，因为它可能影响传输性能。\n\
  - `Duration ID`：表示发送方进行帧交换可能需要的时间；这通常出现在**请求发送（RTS）**帧中，用于请求占用介质一定时间。\n- `Address\
  \ 1/2/3`：这是通信设备的物理地址（接收方、发送方和目的地址）。\n- `Sequence Control`：由两个子字段组成：一个 12 位的序列号和一个\
  \ 4 位的片段号。序列号字段用于标识到达帧的顺序，以便正确重组（范围在 0-4,095 之间）。片段号字段用于表示每个帧的片段数量（范围在 0-15 之间）。\n\
  - `Address 4`：表示发送方的物理地址，仅在无线分布式模式下存在。\n- `Data/Payload`：此字段不属于帧头，但当数据被发送时会附加在帧的末尾。该字段的大小最大可达\
  \ 2,324 字节。\n- `FCS`：帧校验序列字段用于执行数据完整性测试；你一定听说过**循环冗余校验（CRC）**，它有助于计算与接收数据相关的值。如果\
  \ FCS 值与计算出的值一致，则说明数据包无差错接收。\n\n## RTS/CTS\n\n它们是 WLAN 数据传输中避免冲突并确保发送数据完整性的关键组件之一。下图展示了实现\
  \ 100% 无差错交付的四步过程：\n\n![](img/da40f92928403866599198344271d63e_1242_0.png)\n\n首先，AP\
  \ 向 STA 发送请求以获得介质访问权；一旦 STA 批准 AP 的请求，AP 就开始发送数据。数据传输完成后，STA 立即发送 ACK 包以确认无差错交付。如果未发送\
  \ ACK，则 AP 会在一定时间后开始重传。\n\n## 常见与不常见的 WEP——开放/共享密钥通信\n\n在这里，我们将讨论两种类型的**有线等效保密（WEP）**认证过程：开放密钥和共享密钥。事实上，讨论\
  \ WEP 确实没有必要，但我们应该了解它的工作原理，因为你永远不知道何时会被要求排查一台固件尚未升级、仅支持 WEP 作为认证机制的旧路由器。\n\nWEP-open\
  \ 比 WEP-shared 好得多，因为即使你提供的密码是错误的，你仍然可以连接到网络；这样一来，它降低了路由器被暴力破解的风险。如果你使用 WEP-shared\
  \ 通信，那么一个有经验的黑客破解你最强密钥所需的时间不会超过 2 分钟，而且由于 WEP 支持的密钥池很小，你的密码坚持不了多久。\n\n那么，首先，我们需要搭建能够捕获\
  \ WEP-open 所需数据包的基础设施。这里需要注意的一个关键点是，我使用的基础设施由三台不同的机器组成：IP 为 192.168.1.1 的接入点、IP\
  \ 为 192.168.1.105 的工作站，以及 IP 为 192.168.1.104 上运行 Wireshark 的 Kali Linux。请参考下图理解这一点：\n\
  \n![](img/da40f92928403866599198344271d63e_1243_0.png)\n\n1. 首先，让我在接口上启用监控模式：\n\n\
  ![](img/da40f92928403866599198344271d63e_1244_0.png)\n\n在上一个截图的右下角，你可以看到消息显示监控模式已在\
  \ `mon0` 接口上启用。我们将使用这个接口从我们的 AP 和 STA 捕获 `802.11` 数据包。\n\n2. 接下来，为了确认我的信道工作在哪个频道上，我使用了\
  \ `airodump-ng mon0` 命令。\n\n![](img/da40f92928403866599198344271d63e_1244_1.png)\n\
  \n3. 现在，一旦我们确定信道是 6，我们就可以继续让接口专门监听这个信道，从而避免来自其他信道的干扰。为此，我使用了 `iwconfig mon0 channel\
  \ 6` 命令。\n\n```\nroot@kali:~# iwconfig mon0 channel 6\n```\n\n图 1：将 mon0 接口配置到信道\
  \ 6\n\n\n\n\n- 4. 完成所有这些步骤后，继续启动 Wireshark。如果您执行的命令输出出现任何错误，请在继续之前先纠正它。\n\n**关联请求/响应**\
  \ 是由 STA/AP 发送和接收的，用于重新关联之前客户端已参与的断开连接，并为 STA 在该信道上通信可能需要的资源进行分配。\n\n**QoS 数据**\
  \ 数据包是控制帧类型的一种子类型，它描述了服务质量和整体性能。\n\n**空函数** 数据包用于通知 AP STA 即将进入省电模式。此数据包不携带任何数据，仅包含一些标志信息。\n\
  \n对于主机之间共享的每一种信息，都会发送 **ACK** 数据包以确定通信中每个数据包的交付情况。\n\n## 共享密钥\n\n在我们开始配置之前，我想让你了解\
  \ WEP 共享密钥认证的过程，即整个会话中涉及的步骤。请参考以下插图来理解这一点：\n\n![](img/da40f92928403866599198344271d63e_1248_0.png)\n\
  \n简而言之，STA 通过发送认证请求尝试连接到 AP，AP 通过发送一段文本挑战来确认，STA 需完成该挑战并在发送前使用 AP 所知的密钥算法对其进行加密。一旦\
  \ STA 在其端完成了挑战过程，STA 就会发送挑战响应，由 AP 评估并确定连接的成功或失败。同样，AP 会在另一个认证帧中向 STA 确认。\n\n因此，对于一次正常的\
  \ WEP 认证会话，您至少会观察到四个认证帧。如果认证成功，则认证帧后面会跟随关联请求/响应以及一些数据传输。而如果认证不成功，则在四个认证帧之后，STA 与\
  \ AP 之间的会话将结束。请按照下一步捕获您 WLAN 中的 WEP 管理、控制和数据帧。\n\n如前所述，您会注意到捕获到的数据包模式相同。请参考以下屏幕截图，展示了由\
  \ Wireshark 捕获的成功 WEP 认证会话：\n\n![](img/da40f92928403866599198344271d63e_1249_0.png)\n\
  \n- 对于第四个认证帧，我已展开详细信息部分以确认连接尝试是否成功。从前面的屏幕截图中，我们可以验证它已成功。用于通信的认证类型也可以在此处看到。\n- 如我们所知，现在如果\
  \ STA 与 AP 之间的连接尝试失败，整个会话将在第四个认证帧后终止，我们将看到失败消息。为了验证这一点，我在 Wireshark 通过监控模式监听单个系统上的接口时尝试复制了该场景。\n\
  - 请参考以下图示说明一次失败的 WEP 连接尝试。在列表窗格中，我们可以看到相同的认证帧模式（仅四个认证帧），但 STA 从 AP 接收到的最后一个帧确认了连接状态。正如详细信息窗格中清楚可见的那样，由于\
  \ STA 发送的挑战响应文本不正确，连接尝试失败了。\n\n![](img/da40f92928403866599198344271d63e_1250_0.png)\n\
  \n我们见证了 WEP 支持的两种认证程序，但真正重要的是要知道 WEP 现在已过时，因此我绝不会推荐你们任何人将其用作认证协议。如果您有仅支持 WEP 的旧设备，请升级到最新硬件。\n\
  \n## WPA-Personal\n\n我们谈到了自无线网络诞生以来就一直使用的糟糕认证算法，但既然我们有更好的选择，为什么不用呢。我说的是 **Wi-Fi\
  \ Protected Access (WPA)** 安全算法，当我们添加所需的纠正措施时，它比 WEP 更强。2003 年，Wi-Fi 联盟推出了 WPA，旨在使\
  \ WLAN 通信比之前的协议 WEP 更强。如今，几乎每个 WNIC 都支持 WPA 认证机制，从而使您能够利用更好的安全协议。**Temporal Key\
  \ Integrity Protocol (TKIP)** 使现有旧硬件能够轻松升级以实现 WPA。WEP 使用的密钥大小为 40/104 位，而 WPA 使用\
  \ 256 位的密钥大小，有趣的是，在 AP 与 STA 之间传输的每个数据包都使用 256 位密钥进行加密，这使得恶意用户的情况相当困难。WPA 还做出了另一项改进，让设备在消息完整性方面更有保障地通信。\n\
  \n在 WEP 中，实现了传统的 CRC，但在 WPA 中，引入了流行的 Michael 64 位 **Message Integrity Check (MIC)**\
  \ 来解决该问题。WPA 也使用 RC4 算法基于动态加密密钥构建会话（您永远不会在两个主机之间使用相同的密钥对）。与 WEP 相比，其 IV 大小更大，为 48\
  \ 位。请参考以下插图，了解传输介质上形成的密文是如何形成的：\n\n![](img/da40f92928403866599198344271d63e_1251_0.png)\n\
  \n前面的插图描述了整个过程如何开始，先附加 IV 和动态生成的 256 位密钥。然后将其传递给 RC4 算法，该算法使用密钥加密数据包，然后将 resulting\
  \ 加密密钥流附加到数据上，瞧！我们得到了密文。现在，我将向您介绍 AP 与 STA 之间正常的认证会话。请参考以下图示：\n\n![](img/da40f92928403866599198344271d63e_1252_0.png)\n\
  \n在企业 WPA 配置的情况下，首先进行主密钥交换。我稍后会简要介绍它。目前，我们有一个 AP 向 STA 发送其 nonce（随机值）以启动连接，STA 将使用\
  \ AP 的 nonce 值和自己的 nonce，结合在初始连接过程中建立的 **Pre Shared Key (PSK)** 计算出成对瞬态密钥 Pairwise\
  \ Transient Key (PTK)。计算出的值将被发送到 AP。然后，AP 将在其端计算 PTK 并附加 MIC 和 **接收序列计数器 receive\
  \ sequence counter (RSC)**，有助于识别重放消息。结果值将传递给 STA。现在，STA 将首先验证消息中的 MIC 以确保完整性并安装密钥。然后，将状态响应发送给\
  \ AP。如果状态显示成功，AP 然后安装相同的密钥（动态密钥），这些密钥将在主机之间的进一步通信中使用。\n\n在我的 AP 上配置 WPA-Personal\
  \ 后，我从客户端发送了认证请求，对应的通信被 Wireshark 捕获，如以下屏幕截图所示：\n\n![](img/da40f92928403866599198344271d63e_1253_0.png)\n\
  \n### Note\n\n您需要与捕获 WEP 通信时使用的相同基础设施，即在单独机器上监听的监控模式接口。\n\n这就是正常的 WPA 成功握手（认证）过程的样子，即四个\
  \ EAPOL 数据包。为了具体分析 AP 与\n\n是随机选择的。\n\n- **Packet 2:** 成对主密钥和 MIC 标志已设置，STA 将其发送给\
  \ AP 以确认收到的请求，并附带其自己的 nonce 值附加到 AP 的 nonce 以及用于完整性检查的 MIC。\n- **Packet 3:** 成对主密钥、安装、密钥\
  \ ACK 和 MIC 标志已设置，AP 尝试将其发送给 STA。STA 将完成收到的挑战文本值，并连同加密的挑战文本向 AP 确认，AP 将对其进行交叉检查。\n\
  - **Packet 4:** 在这里，成对主密钥和 MIC 标志已设置，STA 将其发送给 AP 以完成连接。现在，AP 已相互准备好与 STA 进行数据传输。\n\
  \n我希望这些标志能以简单而现实的方式帮助您理解四次握手过程。\n\n接下来，我们将看看当 AP 从 STA 收到错误的挑战文本时会发生什么，列表窗格中的数据包看起来如何，以及捕获的数据包模式是否会有任何差异。\n\
  \nSTA 将尝试连接到 AP，AP 将请求挑战文本。这次 STA 不了解网络中其他客户端使用的密钥，因此最终得到一个错误的密码，AP 不会接受它，或请检查是否被\
  \ STA 确认。STA 将再次尝试发送挑战文本，同样过程继续进行。之后，您会在列表窗格中注意到几个相似的数据包。请参考以下图示：\n\n\n![](img/da40f92928403866599198344271d63e_1256_0.png)\n\
  \n图 2：WPA 认证失败\n\n正如你在上面的截图中所见，只能看到 **EAPOL 消息 1 和 2**，因为当 STA 提供质询文本响应时，AP 拒绝了它，然后该过程又重新开始。这种情况会持续几次，但这种报文模式表示连接尝试失败（可能是暴力破解攻击）。列出的数据包可以通过我们之前在密钥随机数（Key\
  \ Nonce）详细信息部分中看到的重放计数器字段相互关联。\n\n## WPA-企业模式\n\n我承诺过要简要讨论一下企业模式，所以现在就来介绍。在企业基础设施中，密钥和密码不保存在\
  \ AP 上，甚至 AP 也不负责与 **STA** 的认证。这里有一个额外的实体——**RADIUS** 服务器，负责处理认证。在四次握手发生之前，**RADIUS**\
  \ 服务器和接入点应该进行**主密钥交换**，这向两个通信设备保证对方是合法的。让我们看看下面的图：\n\n![](img/da40f92928403866599198344271d63e_1257_0.png)\n\
  \n之后，成对主密钥被创建并传递给 AP，这将引导并完成四次握手过程，从而完成认证会话。\n\n我向下滚动数据包列表，看看我为你发现了什么：我们的嗅探器捕获到了\
  \ **解除关联** 和 **解除认证** 数据包。所以，在结束之前，你应该看一下它们。\n\n无线站点/接入点使用解除关联数据包来通知接入点客户端即将下线，并且\
  \ AP 分配给无线客户端的资源现在可以被释放。请参考下图，该图说明了这一点：\n\n![](img/da40f92928403866599198344271d63e_1258_0.png)\n\
  \n正如你可以观察到的，首先，STA 发送一个 `disassociation` 帧，并收到针对该帧的 ACK（318,319）。现在，为了更好地理解这些数据包，我们可以查看详细信息窗格（先选中解除关联数据包），其中\
  \ `Reason Code` 参数表明 STA 正在离开或已经离开。这为我们提供了一个功能，可以高效地查看和理解数据包行为。\n\n无线站点或接入点使用 `deauthentication`\
  \ 帧来通知通信的另一端，另一个设备正在离开。这可能有多种原因。请参考下图来理解这一点：\n\n![](img/da40f92928403866599198344271d63e_1259_0.png)\n\
  \n首先，STA 向接入点发送一个解除认证帧，在接下来的数据包（467,468）中得到确认。展开解除认证数据包的详细信息部分后，我们可以很容易地注意到类型/子类型字段正在验证这一点。在底部，我们了解到解除认证数据包产生的原因。在我们的例子中，原因是“先前的认证不再有效”，STA\
  \ 试图将此通知 AP，如果他们将来希望再次通信，那么认证过程必须重新开始，从探测帧和关联帧开始，然后进行四次握手。\n\n![](img/da40f92928403866599198344271d63e_1261_0.png)\n\
  \n按照上面的截图设置好配置后，单击“解密密钥”旁边的“编辑”按钮（以添加 WEP/WPA 密钥）。请参考下面的截图：\n\n![](img/da40f92928403866599198344271d63e_1261_1.png)\n\
  \n单击“新建”，你将看到一个类似的对话框，可以在其中添加 WEP/WPA 密钥，以便解密我们之前看到的通信。完成所有更改后，在“应用”下单击“确定”。现在，你将看到解密后的流量，类似于下图所示：\n\
  \n![](img/da40f92928403866599198344271d63e_1262_0.png)\n\n图 6：解密后的 WLAN 流量\n\n我们在此节开头为此捕获文件看到的同一个列表窗格，现在以解密格式显示。在这里，我们能够看到\
  \ ICMP 和 DNS 数据包（正常网络流量）；这就是我之前谈到的正常流量。为了管理密钥，有一种更有效的方法，不需要从 IEEE 802.11 下的“首选项”部分打开“解密密钥”对话框。只需导航到“视图\
  \ | 无线工具栏”；这将在显示过滤器区域下方添加一个新的工具栏。\n\n![](img/da40f92928403866599198344271d63e_1262_1.png)\n\
  \n添加后，你可以轻松管理 WEP/WPA 密钥。显示 Wireshark 的下拉菜单非常有用，可以让你切换加密的开/关。如果你从列表中选择“无”，解密将被禁用，你的流量将恢复为仅\
  \ 802.11 无线流量。如果你像上面的截图那样选择 Wireshark，则将应用解密。\n\n## 总结\n\n我们在这里讨论的内容不会让你熟悉无线通信中可能出现的每一种场景，但绝对能让你快速上手。\n\
  \nIEEE 802.11 标准通过无线电频率进行通信。在 WLAN 背后运行的协议是 CSMA/CA，它提供无线基础设施所需的无冲突环境。在 802.11 下，已经开发了多种标准，这为不同的基于基础设施的需求提供了强大的解决方案。\n\
  \n有时，你还需要关注射频（RF）能量水平，它确实可以在性能提升中发挥重要作用。由于各种设备工作在相同的 2.4 GHz 频段上，你的 WLAN 信号可能会失真。在这种情况下，你需要的是频谱分析仪，它可以让你分析和监控周围流动的射频能量。为此，你需要特殊的硬件，可以从在线科技商店购买，并且需要将该硬件与相应的软件配对使用，例如，Metageek\
  \ 的 Wi-SPY 硬件与 Chanalyzer 搭配使用。\n\nKismet 是 Kali Linux 中提供的一个图形化工具，可以让你收集周围可用无线网络以及连接到这些网络的设备的各种高级详细信息。Kismet\
  \ 带有各种自定义选项，在你查找特定信息时会非常有帮助。Kismet 还为用户提供了多种图形功能，可以在特定时间段内绘制实时流量图。\n\n在传统的 WLAN\
  \ 环境中，有一个 AP 和一个 STA 相互通信。在实际数据传输之前，两个设备需要通过密钥（密码和加密算法）协商会话，通信双方将使用该密钥来维护发送数据的完整性。\n\
  \n在使用 Wireshark 时，你通常会看到三种类型的帧：管理帧、控制帧和数据帧。这些是选中某个数据包后，你可以在详细信息窗格中看到的数据包。管理帧控制连接的建立，控制帧控制管理帧的传输，而数据帧仅包含发送的实际数据。\n\
  \nWEP 和 WPA 等认证协议负责 AP 和 STA 之间如何协商以开始通信。\n\nEAP 用于实现主密钥的交换。如 RFC 3748 中所定义，EAP\
  \ 是一个支持多种认证方法的认证框架，执行 EAP 不需要 IP，因为它运行在数据链路层之上。\n\nEAP 与 LAN 结合就变成了 EAPOL，用于 802.11\
  \ 基础设施（RADIUS/AAA）中的主密钥交换。按照正常模式，AP 广播 STA 监听的信标帧。否则，STA 会自行发送探测请求以建立连接。然后，AP 和\
  \ STA 进行认证会话并进行协商，直到双方主机相互确认。一旦完成，AP 将向 STA 发送成功消息。\n\n使用 Wireshark，只需添加所用协议的无线网络密钥，并修改\
  \ IEEE 802.11 协议的首选项，就可以解密 WEP 通信。\n\n用于捕获相关数据包的监听模式可以在基于 Linux 的系统上轻松配置，并且对于 Wireshark\
  \ 802.11 分析至关重要。\n\n在 802.11 中，RTS/CTS 与 CSMA/CA 相对使用，这保持了介质无冲突且易于操作。\n\n使用哈希函数\
  \ **基于密码的密钥派生函数（PBKDF2）**，通过密码短语计算出 256 位预共享密钥。\n\n\n\n# 练习题\n\n- Q.1 阅读完本章中关于IEEE\
  \ 802.11的部分后，就这一协议以及你所理解的内容做一份详尽的笔记——如果需要，可以参考相应的RFC。\n- Q.2 在一台独立机器上安装任意基于Linux的live系统，并尝试使用本章中提到的命令启用监控模式。\n\
  - Q.3 首先在关闭监控模式并开启混杂模式的情况下捕获数据包，然后在开启监控模式和混杂模式下捕获。分析差异。\n- Q.4 在你的Windows机器上安装Aircrack工具，并尝试捕获周围的802.11流量。\n\
  - Q.5 802.11（b/a/g/n/i）中可用标准之间的区别是什么？\n- Q.6 假设你有一台路由器，路由器的一端连接着一台交换机，交换机进一步连接多个有线客户端。路由器的另一端连接着一个无线接入点，该接入点充当介质，使各种无线设备能够连接到公司网络。现在，从无线域向有线域发送一个数据包，并在数据包在域间传输时分析它们。802.11报头会有什么不同？\n\
  - Q.7 当你的无线网卡不支持监控模式或混杂模式时，会发生什么？解释每种模式的重要性。\n- Q.8 要查看你的设备发送给接入点的探查请求的可用性，你会使用哪个显示过滤器？\n\
  - Q.9 将你的接入点配置为WEP-Open认证，然后在捕获流量的同时尝试使用该AP连接到它，并使用WEP-Shared执行相同操作，分析出现的数据包模式的差异。\n\
  - Q.10 哪个更好：WEP-Open还是WEP-Shared密钥，为什么？\n- Q.11 使用捕获过滤器仅捕获来自你的主机、接入点和广播地址的流量。这是否有助于减少噪声？\n\
  - Q.12 将无线接口的监控模式配置到特定信道，然后捕获WLAN流量。\n- Q.13 WPA-Shared密钥和WPA-Enterprise认证协议之间有什么区别？请详细说明。\n\
  - Q.14 复制一个配置了WEP-Shared密钥接入点的场景，捕获相当大量的流量，并尝试使用WEP密钥解密你捕获的流量。\n- Q.15 为什么WEP-Open比WEP-Shared密钥认证机制更好？\n\
  - Q.16 你能想出一种方法，可以强制无线客户端与它当前连接的网络解除关联吗？\n- Q.17 对于取消认证数据包，你认为存在多少种类型？修改其着色规则以唯一地查看这些数据包。它们与解除关联数据包有何不同？\n\
  - Q.18 在分析WPA握手时，你是否在实际握手之前观察到任何基于开放系统的认证？如果存在，则分析流量并解释其作用？\n- Q.19 将你的接入点配置为WEP协议加密，捕获正常的802.11无线帧。然后，使用我们讨论过的相同方法，尝试使用你的网络密钥解密流量。\n\
  - Q.20 是否可以使用ASCII格式密钥解密流量，或者你也可以用HEX格式提及密钥？如果可以，在哪种情况下以HEX格式编写密钥会被证明有价值？\n"
- "# 第7章 网络安全分析\n\n本章将教你如何使用Wireshark分析网络安全问题，例如分析恶意软件流量和足迹探测尝试。你将学习如何使用Wireshark进行网络安全分析。本章将涵盖以下主题：\n\
  \n- 分析端口扫描、足迹探测和攻击活动\n- 实验——使用Nmap进行端口扫描\n- 分析暴力破解攻击\n- 实验——分析暴力破解攻击\n- 检查恶意流量\n\
  - 实验——检查恶意流量\n- 解决现实世界中的CTF挑战\n- 练习题\n\n到本章为止，我一直试图让你了解如何使用Wireshark分析周围流动的数据包。我们只关注了如何使用这款嗅探工具进行基本分析。然而，我要告诉你的是，在大多数情况下，Wireshark被用于安全分析目的，从基本的足迹探测攻击到高级的基于木马的攻击。\n\
  \n在我的虚拟实验室中，我将通过几个场景尝试复现最常见的攻击，同时捕获攻击者与受害者之间的实时流量。之后，我们将剖析跟踪文件，以了解恶意流量的样子。我们将利用这些知识库来创建IDS/IPS或防火墙签名，尝试通过分析Wireshark中显示的流量来保护我们内部的关键基础设施。\n\
  \n要实现这一切，你需要稍微改变一下视角。换句话说，你需要像负责公司网络的安全专业人员那样行动和思考，不断加固边界，使恶意用户的攻击过程变得更加复杂。我们可以通过分析日常流量中捕获的数据包以及复现某些场景来开始这一切。\n\
  \n## 信息收集\n\n利用过程的首要步骤是尽可能多地收集信息。在当今世界，收集关于个人或组织的具体且相关的信息并不那么困难（使用搜索引擎），而一切正是从这里开始的。许多安全专业人员会直接对目标发起攻击，这在开始时并不合适。例如，假设有一家ABC有限公司位于相邻街区，一个XYZ攻击者正计划在物理安全方面利用它（进入服务器机房或内部任何高价值目标）。要做到这一点，攻击者首先应该知道工作时间与非工作时间。然后，他们应该了解目标公司的工作日。攻击者还应了解公司所在建筑的物理布局，并且对安保政策有一些基本了解。有了所有这些信息，攻击者应该能够识别场所内部可能容易攻击的薄弱点，并可以访问到他们正在寻找的东西。你注意到前面的场景中发生了什么吗？我们假设攻击者正在收集有用的信息，然后计划并找出容易攻击的目标，因为遵循这种方法会提高成功的机会。足迹探测和侦察是术语“信息收集”的同义词。如果你遵循计划好的方法，成功的机会会更高。\n\
  \n让我们使用同样的方法来攻击使用网络的组织。第一步是识别组织的公共IP地址、它所属的子网以及分配给组织的IP地址范围。这些基本信息可以通过在线DNS查找服务被动收集（无需直接与公司网络交互）。我们可以尝试检查是否提供区域传输，这可以给出关于我们目标组织基础设施的一些有价值且详细的细节。在你收集了基本信息并绘制出基本布局之后，就可以进行**端口扫描**了。我更倾向于你先做一次**ping扫描**，它会告诉你网络上的活动主机，并从中了解更多网络信息（在执行ping扫描时，你可以修改TTL值以推测内部局域网架构）。\n\
  \n在我们继续尝试复现最常见的场景之前，我希望你先想象一下我为练习目的而创建的本地虚拟计算机基础设施。请参考下图：\n\n\n![](img/da40f92928403866599198344271d63e_1269_0.png)\n\
  \n希望现在你对我将要使用的内部网络有了一个大致的了解。位于 192.168.1.1 的接入点通过 DHCP 为所有这些设备分配 IP 地址（DHCP 范围从\
  \ 192.168.1.100 开始，一直到 192.168.1.110；这意味着我在同一时刻最多只能有 10 个 DHCP 客户端）。在本章中，我们攻击机的\
  \ IP 地址被静态分配为 192.168.1.106。\n\n## PING 扫描\n\n让我们从第一个场景开始，攻击者试图对子网执行 PING 扫描攻击，而我们的嗅探器通过其接口以混杂模式监听并捕获了所产生的流量。请参阅下图，该图展示了运行\
  \ bash 脚本后生成的流量模式（该脚本从 100 到 110 逐个 ping 每个 IP）：\n\n![](img/da40f92928403866599198344271d63e_1270_0.png)\n\
  \n图 7.1：PING 扫描\n\n从数据包 1–4 开始，Kali 主机因发出 ICMP `ping` 命令而开始生成 ARP 请求，但这些 IP 均未分配。因此，我们没有收到任何回复。在数据包\
  \ 5 中，Kali 主机向 105 发送了 `ping` 请求，并在数据包 14 中收到了回复，这意味着该设备处于开机状态。然后，在数据包 7 中，一个 ARP\
  \ 请求被发送到 103，但此 IP 在当前实例中可能也是未分配的，因此再次没有收到回复。在数据包 8–10 中，Kali 主机向 IP 102、101 和 100\
  \ 发送了 ICMP 请求数据包。相应的回复可以在数据包 13 和 15 中看到，分别来自 IP 101 和 100。对于 102，我们没有收到任何回复。可能是某个设备阻止了我们的\
  \ ping 探测，或者某些移动设备不响应 ping 探测。最后，在数据包 17 中，我们可以看到接入点正在将其物理地址告知 Kali 主机。如果你向下滚动跟踪文件，你会看到来自在线设备的各种回复，它们描述了各自的物理地址。\n\
  \n## 半开扫描（SYN）\n\n该过程的下一步是扫描你想要攻击的任何特定设备。假设我想攻击运行在 IP 192.168.1.105 的 Win7 机器。我的下一步应该是检查该主机上运行的可用的服务。所谓服务，我指的是\
  \ HTTP 守护进程、邮件服务器守护进程、FTP 服务器等等。你可能想知道什么是半开扫描？看看我们讨论过的 TCP 三次握手过程：如果服务器可用，客户端通过发送\
  \ SYN 数据包来发起连接；然后客户端收到 SYN, ACK 数据包，作为回应，客户端向服务器发送 ACK 数据包以完成握手过程。\n\n现在，如果 TCP\
  \ 握手最后一步中的 ACK 数据包从未发送到服务器，会发生什么？服务器会等待一段时间，然后终止客户端发起的握手过程，并且与特定 TCP 服务的连接将永远不会完成。这就是为什么这种扫描被称为半开扫描。这是一种非常常见的扫描技术，被大多数从事恶意活动的用户所使用，了解这种流量模式有助于我们识别未来的风险。我从\
  \ Kali 主机发起了针对 Win7 主机的半开扫描。我使用的是 Nmap，它是一个适用于所有平台的开源工具，可以从 http://nmap.org 免费下载（要使用该工具，你可以参考网上提供的各种教程）。由于\
  \ SYN 扫描而产生的流量被捕获并显示在以下截图中：\n\n![](img/da40f92928403866599198344271d63e_1271_0.png)\n\
  \n图 7.2：半开扫描\n\n扫描完成后，你可以看到三种类型的回复：开放、关闭和被过滤。现在要讨论的重点是这些状态的含义，以及这些状态与前面截图中显示的数据包有什么关系。让我们更详细地了解这些状态：\n\
  \n- **开放（Open）：** 如果服务是开放的，那么一个 `SYN, ACK` 数据包会被发送回你的机器，从而将 TCP 握手过程推进到下一步。在数据包\
  \ 26 中，Kali 向端口 135 发送了 `SYN` 请求，并在数据包 28 中收到了 `SYN, ACK` 回复。\n- **关闭（Closed）：**\
  \ 如果服务无法响应，那么你会收到一个 RST 数据包，它确认服务/守护进程当前未运行。在数据包 22 中，一个 `SYN` 请求被发送到端口 113。在数据包\
  \ 25 中，收到了对应的 RST 数据包。它表明该服务此刻不可用。\n- **被过滤（Filtered）：** 有时，在你和目标之间可能配置了防火墙，它会拦截你的请求并将其丢弃，而不会转发给目标。在这种情况下，你可能会看到端口状态，如\
  \ `open|filtered`、`closed|filtered`，或者仅仅是 `filtered`。\n- 假设你正试图扫描一个位于你的 VLAN 之外、并且被防火墙限制访问的\
  \ HTTP Web 服务器。那么握手过程永远不会进入第二步，也就是说，你永远不会收到任何形式的回复。你不会收到任何 `SYN, ACK` 或 `RST` 数据包。\n\
  \n使用这种扫描类型，你可以识别正在运行的服务的状态。然而，使用这种扫描类型也会产生大量的流量。我发起的扫描在 1.76 秒内完成，而在如此短的时间内，它在两台机器之间生成了\
  \ 2024 个数据包。这恰恰证明其不利之处。任何配置良好的 IDS/IPS 都能非常容易地发现此类活动，进而触发警报以通知安全管理员。Nmap 也有可配置的选项，在这些情况下也能帮助你。\n\
  \n## 操作系统指纹识别\n\n了解目标上运行的操作系统，会将扫描过程推进到方法论的下一个步骤。如果攻击者知道你所运行的操作系统、操作系统的补丁级别以及操作系统的版本，那么构建攻击过程就会相当简单，并且会提高成功的几率。\n\
  \nKali 中有一些工具可以让你识别目标的操作系统。这些工具并非 100% 准确，但在大多数时候是正确的。现在，你认为一个简单的工具是如何能够识别远程机器的操作系统的？我来告诉你其中的秘密。每个操作系统都有不同的方式来实现\
  \ TCP 协议栈。因此，从远程机器收到的数据包中会包含某些字段，例如 TTL、分片偏移量，以及最重要的窗口大小。通过将数据包中的值与我们所拥有的数据库进行比较，它就能告诉你操作系统类型。例如，如果你尝试\
  \ ping 一台 Windows 机器，返回的 TTL 值通常是 128；如果你 ping 一台 Linux 机器，大多数时候 TTL 值会是 64。很简单，不是吗？\n\
  \n指纹识别有两种类型：主动识别和被动识别。它们描述如下：\n\n- **主动指纹识别：** 当你直接与系统交互时，请求和响应会直接在你和目标之间进行。这种扫描可能非常危险，而且不具备隐蔽性。捕获的数据包会提供一些值，这些值可以与我们所拥有的签名进行匹配，从而识别远程机器上运行的操作系统。\n\
  - **被动指纹识别：** 当你只是监听发往目标或源自目标的数据包时，可以检查数据包中的值来识别运行的操作系统。被动扫描的一个缺点是它不如主动指纹识别准确。但该过程比主动扫描更具隐蔽性。\n\
  \n使用 `nmap` 扫描，我将尝试对 IP `192.168.1.109` 和 `192.168.1.104` 的机器进行指纹识别，并查看此类请求会产生什么样的流量。我们将看到的扫描类型是主动扫描，我们将直接与系统交互。我们不会仅仅依赖\
  \ Nmap 的输出来确认操作系统。返回给我们攻击机的数据包是所有必要信息的基础，为了让你更好地理解，我将尝试对其进行分析。\n\n我将使用 `nmap -O\
  \ 192.168.1.109,192.168.1.104` 命令进行主动操作系统指纹识别，其中 -O 选项用于检查操作系统及其版本。请参阅以下两个截图，比较它们呈现给我们的输出结果：\n\
  \n\n\n## ARP 欺骗\n\n众所周知，ARP 协议的功能是将 IP 地址翻译成对应的 MAC 地址。通过这样做，设备能够在基于 LAN 的网络中有效通信。任何希望与同一网络上其他设备连接的设备都需要其他主机的\
  \ MAC 地址。每个操作系统都维护一个通信设备列表，可以通过 `arp -a` 命令在终端窗口中填充。同一命令在每个平台上都使用。我们也见过 ARP 请求和回复数据包，它们被连接到本地网络的设备用来获取其他设备的\
  \ MAC 地址。\n\n例如，我也有一个本地网络，它由位于 `192.168.1.1` 的路由器（网关）管理，并且有 3 台设备连接到它。下表列出了连接到该网络的设备所特有的所有必要信息，我们稍后会用到：\n\
  \n| 设备 | IP 地址 | MAC 地址 |\n|---|---|---|\n| 路由器（默认网关） | 192.168.1.1 | D0:5B:A8:07:73:6C\
  \ |\n| Apple（受害者） | 192.168.1.103 | D8:BB:2C:B9:53:EC |\n| Windows 服务器（受害者） | 192.168.1.109\
  \ | 00:0C:29:B3:CB:B6 |\n| Kali Linux（攻击者） | 192.168.1.106 | 00:0C:29:5D:A7:F7 |\n\
  \n上述信息列在连接到本地网络的每个主机的 ARP 缓存中。你一定在想这是如何在本地缓存中填充的。每当任何设备打算与另一台设备通信时，请求设备会向整个子网发送广播。然后，拥有该\
  \ IP 地址的设备会使用单播数据包回复其 MAC 地址。\n\n例如，如果 Apple 机器希望与位于 `192.168.1.109` 的 Windows 机器通信，Apple\
  \ 将发送广播请求 Windows 的 MAC 地址，声明 `Who has 192.168.1.109? Tell 192.168.1.103`。然后，一旦\
  \ Windows 机器得知请求，ARP 回复单播数据包声明 `192.168.1.109 is at 00:0C:29:B3:CB:B6` 将被发送。这就是过程的工作方式。\n\
  \n上述数据包传输只有在 Apple 机器在其本地缓存中拥有 Windows MAC 地址时才会发生。搜索本地缓存后，请求将被发送到默认网关。如果默认网关知道它，网关本身将发送\
  \ ARP 回复数据包。如果不知道，则请求将被转发到子网，目的地 PC 将使用单播数据包回复物理地址。之后，可以使用 TCP/IP 进行对话。\n\nARP 欺骗用于污染受害者的本地缓存，从而使攻击者能够嗅探在两个受害者之间传输的数据。攻击者拦截流量然后将其转发到另一侧。参考以下插图：\n\
  \n![](img/da40f92928403866599198344271d63e_1277_0.png)\n\n我们可以污染两个受害者的本地 ARP 缓存并实现同样的效果。还有一件事你需要配置：在\
  \ Kali 上启用 IP 转发，这样你的攻击机器就能在不丢失的情况下来回传输流量，而不会让受害者产生怀疑。按照以下步骤实现 ARP 欺骗：\n\n- 首先，使用\
  \ `echo '1' > /proc/sys/net/ipv4/ip_forward` 命令配置 IP 转发。\n\n- 一旦配置完成，你就可以开始向两个受害者发送未经请求的\
  \ ARP 回复数据包以污染缓存。在我们污染它之前，让我们先看看它们在正常形式下是什么样的，对两个受害者机器而言：\n\n  ![](img/da40f92928403866599198344271d63e_1278_0.png)\n\
  \n  图 7.4：Windows 服务器缓存\n\n  要在 Linux ARP 缓存中填充条目，请使用类似命令；参考以下屏幕截图以供参考。\n\n  ![](img/da40f92928403866599198344271d63e_1278_1.png)\n\
  \n  图 7.5：Apple 缓存\n\n- 现在，让我们开始向 Windows 服务器机器发送未经请求的 ARP 回复数据包，声称 Apple 机器位于 00:0C:29:5D:A7:F7。相同的包将发送给\
  \ Apple 机器，声称 Windows 服务器机器位于 00:0C:29:5D:A7:F7。如果你注意一下，发送给 Windows 和 Apple 机器的数据包中指定的\
  \ MAC 地址属于 Kali（攻击者）。参考以下屏幕截图查看我用于欺骗虚假 MAC 地址的命令：\n\n  ![](img/da40f92928403866599198344271d63e_1278_2.png)\n\
  \n  图 7.6：代表 Apple 设备发送给 Windows 服务器的 ARP 回复数据包\n\n  ![](img/da40f92928403866599198344271d63e_1279_0.png)\n\
  \n  图 7.7：代表 Windows 服务器发送给 Apple 设备的 ARP 回复数据包\n\n  使用带少量参数的一行命令，我们通过发送大量 ARP 回复数据包成功污染了受害者的缓存。\n\
  \n- 由于上述命令产生的流量也在同时被捕获。让我们看看它是什么样子的。参考以下屏幕截图：\n\n  ![](img/da40f92928403866599198344271d63e_1279_1.png)\n\
  \n- 一旦两个受害者都收到了多个此类数据包，它们就会开始相信它并相应地更新缓存。让我们查看两台机器的缓存以验证这一点。参考以下屏幕截图：\n\n  ![](img/da40f92928403866599198344271d63e_1279_2.png)\n\
  \n  ![](img/da40f92928403866599198344271d63e_1280_0.png)\n\n- 现在，这两台设备之间发送的任何流量都将通过攻击盒转发。为了验证，我关闭了\
  \ Windows 服务器机器并尝试从 Apple 机器发送 ICMP 数据包。参考以下来自 192.168.1.106（Kali）的 ICMP 目标主机不可达回复的输出所示：\n\
  \n  ![](img/da40f92928403866599198344271d63e_1280_1.png)\n\n  上述输出确保数据包正在通过 192.168.1.106\
  \ 转发，从而使我们的 ARP 欺骗攻击成功。\n\n- 现在，问题是如何保护自己免受此类攻击。我建议最好的方法是为通信客户端的本地缓存中的设备 MAC 地址手动添加条目。这肯定会在修改本地缓存时忽略未经请求的\
  \ ARP 回复数据包。参考以下屏幕截图：\n\n  ![](img/da40f92928403866599198344271d63e_1280_2.png)\n\
  \n一旦你在网络中的每个可能主机中添加静态条目，就不可能再使用 `arp` 欺骗工具修改本地缓存。同样，对于 HTTPS 流量，你可以使用在线可用的 SSL strip\
  \ 工具来嗅探安全流量。\n\n### 分析暴力攻击\n\n你们大多数人都应该知道暴力攻击的流行程度。成功率并不高。然而，许多安全专业人员和恶意用户借助现代工具实施其密码猜测能力。暴力攻击只是一种方式，你尝试使用可能基于目标个人资料创建的密码字典登录到特定服务/应用程序。诸如\
  \ CeWL、Crunch 和 John 等工具可让你创建字典文件。甚至你可以对密码加盐。讨论如何为自己创建字典超出了本书的范围，但我建议你查看这些工具（它们都预装在\
  \ Kali Linux 中）。\n\n为了分析这些常见且恶意的攻击，我将尝试暴力破解两个重要服务：Telnet 和 FTP。你可能知道这两个服务以及它们在企业网络基础设施中被使用的程度。Telnet\
  \ 用于远程管理诸如路由器、交换机和不同类型的 Web 服务器等设备。FTP 用于高效传输文件，并确保数据完整性和确认交付。\n\n首先，看看最广泛用于远程管理的协议，它通常在安全方面被忽视。使用简单的暴力技术，任何脚本小子都可以获得对你网络的访问权限，其后果在金钱和服务可用性方面可能非常具有破坏性。如果涉及消费者，那么他们的记录可能价值数百万，导致管理系统的完全远程代码执行。\n\
  \n对于此说明，我有一台运行在 `192.168.1.109` 的 Windows 服务器机器，以及一台位于 `192.168.1.106` 的攻击者。攻击者首先准备其字典文件，然后将使用自动化工具攻击在\
  \ Windows 服务器机器上运行的 Telnet 管理服务。此类活动产生的流量将通过我们的出色嗅探器记录以供分析。我尝试像普通用户一样通过以下步骤连接到 Telnet\
  \ 服务：\n\n- 使用 Telnet 命令后跟 IP 地址，我能够连接到服务。作为回报，它为我打印了一个横幅：`Welcome to Microsoft Telnet\
  \ service.`\n\n- 然后，我提供了错误的用户名凭据，服务器未接受。因此，它显示了登录错误，显示 `bad username or password.`\n\
  \n- 然后，我提供了合法的凭据集，它被识别并\n\n\n被服务接受。\n\n- 用户授权后，会出现带有相应授权的 Windows 命令提示符，并伴随着一条横幅：`Welcome\
  \ to Microsoft Telnet Server.`\n- 连接成功后，我就可以直接从我的机器上发出（Windows）远程命令。\n- 最后，为了优雅地终止连接并释放为平稳运行而分配的所有资源，我发出了\
  \ `exit` 命令，系统返回消息 `connection closed by foreign host.`\n\n以下截图展示了 Microsoft Telnet\
  \ 服务器的正常运行：\n\n![](img/da40f92928403866599198344271d63e_1283_0.png)\n\n## 图 7.11：Telnet\
  \ 正常会话\n\n产生的流量也已被 Wireshark 捕获。我没有直接展示这些流量，而是决定以纯文本格式向你展示完整通信内容。只需右键单击列表窗格并选择显示\
  \ TCP 流（show TCP stream），即可整合 TCP 流并得到该文本（Telnet 服务器配置了回显选项，因此我们也许会看到一些从服务器回显到客户端的字符）。请参见以下截图：\n\
  \n```\n%.......W.#..........'.....'...Welcome to Microsoft Telnet Service\n\nlogin:\
  \ aannoonnyymmouuss\n\npassword: abc123\n\nLogon failure: unknown user name or bad\
  \ password.\n\nLogin Failed\n\nlogin: aaddmmiinniitt rr.....ssttrraattoorr ...\n\
  \npassword: chris\n........xterm-256color...........xterm-256color..\n\n*==============================================================================\n\
  Welcome to Microsoft Telnet Server.\n*==============================================================================\n\
  C:\\Documents and Settings\\Administrator>ddiirr\n\nVolume in drive C has no label.\n\
  Volume Serial Number is 98F1-FD57\n\nDirectory of C:\\Documents and Settings\\Administrator\n\
  \n02/01/2015  10:24 AM    <DIR>          .\n02/01/2015  10:24 AM    <DIR>      \
  \    ..\n02/01/2015  10:41 AM    <DIR>          Desktop\n02/01/2015  10:24 AM  \
  \  <DIR>          Favorites\n```\n\n## 图 7.12：Telnet 跟踪 TCP 流\n\n只需跟踪 TCP 流，我们所输入的所有内容以及服务器返回的响应都会以简单可读的纯文本形式显示出来。\n\
  \n现在，看完正常会话的样子后，如果你想学习如何执行暴力破解攻击，请按照以下步骤操作：\n\n- 创建一个至少包含两台机器的虚拟渗透测试实验室：其中一台是攻击机（Kali），另一台可以选择你喜欢的机器（请确保该机器上能安装\
  \ Telnet）。\n- 尝试 ping 目标主机以测试连通性。执行 Telnet 命令来创建一个正常会话，并测试一切是否正常。\n- 现在，打开 Kali，执行\
  \ `medusa -h <target ip> -U <usernames file> -P <password file> -M telnet` 命令。请参见以下截图：\n\
  \n![](img/da40f92928403866599198344271d63e_1285_0.png)\n\n图 7.13：暴力破解——Telnet\n\n\
  最后，通过使用不同的组合，我们成功对服务器进行了暴力破解。这些接连不断的尝试所产生的流量，对我们来说有着特殊的研究价值。\n\n- 文件中产生了大量 TCP 和\
  \ TELNET 流量，其中包括三次握手以及通过 Telnet 在服务器和客户端之间传输数据等流量模式。然而，所有内容并不都是我们感兴趣的。请参见以下截图：\n\
  \n![](img/da40f92928403866599198344271d63e_1286_0.png)\n\n图 7.14：服务器与我们的客户端之间的 Telnet\
  \ 和 TCP 流量\n\n- 为了只看恶意流量，我应用了另一个显示过滤器，它只显示两台主机之间的各种连接尝试。请参见以下截图：\n\n![](img/da40f92928403866599198344271d63e_1286_1.png)\n\
  \n- 现在，结合 Time 列观察显示过滤器 `telnet.data==Welcome to Microsoft Telnet Service`。我在过滤器中使用的字符串，与我们连接服务时收到的横幅相同。该横幅在大约\
  \ 100 秒（不到一分钟）的时间内打印了约 15 次。\n\n- 现在，这是否让你觉得可疑？如果是，你可以为相同的流量模式创建有效的特征签名，从而采取预防措施来保护你的基础设施，并帮助你及时获得警报。\n\
  \n接下来，我们来看看另一种流行的服务——FTP，前面的章节中已详细讨论过。让我们看看针对 FTP 服务的暴力破解攻击会是什么样。FTP 是一项非常关键的服务。如果受到任何形式的攻击，服务可能会崩溃或对合法用户不可用。这可能会给网络管理员带来严重的停机问题。为了应对日常运营中发生的此类活动，你需要做好准备，识别恶意流量模式，并与我们之前创建的基线流量模式进行比较。\n\
  \n出于测试和分析目的，我在一台 Windows 7 机器上配置了一个 FTP 服务器，地址为 192.168.1.108，攻击机在同一位置，IP 为 192.168.1.106。我使用\
  \ Kali Linux 操作系统来复现攻击和正常流量模式场景。如果你仅出于教育目的想复现此过程，请遵循以下步骤：\n\n- 使用最适合你需要的任何平台配置客户端和服务器，并确保\
  \ FTP 服务器与客户端之间的连接畅通无阻。\n- 现在，首先我们将使用一个合法用户访问服务器，并记录流量。之后，我们将使用 Wireshark 中的“Follow\
  \ TCP stream”选项，以易于理解的纯文本格式查看流量详情。\n- 请参见以下截图，我使用 Kali 平台上可用的 netcat 客户端发起了服务器和客户端之间的连接。然后我第一次尝试使用了错误的凭据登录，第二次使用了正确的凭据：\n\
  \n```\nroot@kali:~# nc -nv 192.168.1.108 21\n(UNKNOWN) [192.168.1.108] 21 (ftp)\
  \ open\n220-FileZilla Server version 0.9.32 beta\n220-written by Tim Kosse (Tim.Kosse@gmx.de)\n\
  220 Please visit http://sourceforge.net/projects/filezilla/\nuser charit\n331 Password\
  \ required for charit\npass abc\n530 Login or password incorrect!\nuser charit\n\
  331 Password required for charit\npass charit\n230 Logged on\nhelp\n214-The following\
  \ commands are recognized:\n    USER    PASS    QUIT    CWD     PWD     PORT   \
  \ PASV    TYPE\n    LIST    REST    CDUP    RETR    STOR    SIZE    DELE    RMD\n\
  \    MKD     RNFR    RNTO    ABOR    SYST    NOOP    APPE    NLST\n    MDTM    XPWD\
  \    XCUP    XMKD    XRMD    NOP     EPSV    EPRT\n    AUTH    ADAT    PBSZ    PROT\
  \    FEAT    MODE    OPTS    HELP\n    ALLO    MLST    MLSD    SITE    P@SW    STRU\
  \    CLNT    MFMT\n214 Have a nice day.\nquit\n221 Goodbye\n```\n\n- 成功登录后，我发出 `help`\
  \ 命令来查看可执行的命令。然后，我发出 `quit` 命令以优雅地终止连接。请参见前一张截图。\n- 我们的嗅探器捕获了整个会话。我们没有在列表窗格中查看流量，而是再次查看整合后的\
  \ TCP 流。请参见以下截图：\n\n## 流内容\n\n```\n220-FileZilla Server version 0.9.32 beta\n220-written\
  \ by Tim Kosse (Tim.Kosse@gmx.de)\n220 Please visit http://sourceforge.net/projects/filezilla/\n\
