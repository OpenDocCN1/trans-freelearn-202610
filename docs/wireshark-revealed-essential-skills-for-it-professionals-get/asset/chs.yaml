  首先，位于192.168.10.196的客户端和位于128.173.97.169的服务器开始通信。一开始，我们看到客户端和服务器之间进行了三次握手，但你注意到SYN/ACK数据包回来所花的时间了吗（超过0.36秒）？看看第39帧，这是你需要注意的地方。继续，我们在发出GET请求后看到了另一个类似事件，ACK数据包大约花了0.30秒才返回。如前所述，观察到的延迟并非由客户端或服务器造成。这里的延迟是由线路上的设备引起的。在这种情况下，最佳的故障排查方法是在排除源端和目的端问题上浪费更多时间，而是直接检查路由器、交换机或任何已实施的防火墙。


  正在运行的应用程序。我忘记关闭三个正在运行的虚拟机，它们占用了所有内存。我相信这是我在客户端（我的机器）遇到延迟的最重要原因之一。我希望通过这个实际示例，你能理解客户端延迟如何成为网络和互联网性能低下的原因之一。


  继续这个简单示例，让我们来了解服务器端延迟问题。我采用了同样的方法，一边用Wireshark抓包几分钟，一边浏览随机网站，然后分析列表窗格中可见的任何延迟原因。这次，我遇到了我的机器和一个网站之间的一个有趣会话。首先，我想让你看一下。请参考下面的截图：


  ![](img/da40f92928403866599198344271d63e_1336_0.png)


  正如你所看到的，我的机器（`192.168.10.96`）与服务器（`198.41.184.93`）之间的会话以平滑的三次握手开始，没有任何延迟迹象。接着，客户端发出一个网络请求，随后服务器发送了一个确认。到目前为止，一切都很顺利，没有延迟痕迹。然而，当服务器即将开始数据传输时，它停顿了一会儿，如你在第503帧看到的那样。服务器花了大约0.35秒才开始数据传输。这清楚地表明服务器可能经历了繁重的网络流量，或者服务器正在运行多个导致高CPU和内存消耗的应用程序。我们刚刚看到的延迟也可能有其他原因。观察这一切，我们可以得出结论：服务器是延迟的原因；在这种情况下，服务器无法在合理的时间内处理客户端的请求，最终形成了一个小延迟问题。


  你已经了解了在浏览互联网甚至内部局域网时，线路上的设备、客户端和服务端如何引起高延迟，你的内部局域网也可能成为同样的受害者。我们讨论了在收到服务器的SYN/ACK数据包之前出现的延迟。这些延迟可能由中间的设备（线路上）引起，也可能因为服务器响应时间长而出现。让我们通过一个关于识别高HTTP响应时间的小实际示例来让事情变得更有趣。这将帮助你识别高响应时间。请按照以下步骤操作，即可同步复现：


  - 1. 打开浏览器，访问一些网站，同时让Wireshark在后台运行并监听你的数据包。

  - 2. 一旦你访问了至少3-4个网站，就可以停止捕获过程。

  - 3. 现在，切换到Wireshark并做一些必要的更改。首先，禁用“允许子解析器重新组装TCP流”。在列表窗格中选择任意一个TCP数据包，然后在详细信息窗格中右键单击TCP部分，再点击“允许子解析器重新组装TCP流”选项以禁用它。请参考下面的截图：


  ![](img/da40f92928403866599198344271d63e_1337_0.png)


  图8.13：禁用“允许子解析器重新组装”设置


  - 4. 接下来，我们需要将http.time增量列添加到列表窗格中，以便更清楚地查看问题并轻松识别任何延迟痕迹。

  - 5. 从列表窗格中选择任意一个HTTP数据包，然后在详细信息窗格中展开HTTP协议部分。接着，右键点击“自请求以来的时间”参数，并点击“应用为列”选项。请参考下面的截图：


