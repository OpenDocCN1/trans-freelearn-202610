  | 10 | 0.1404520 | LiteonTe_fa:5e:b4 | Broadcast | ARP | 42 | Who has 192.168.1.107?\
  \ Tell 192.168.1.100 |\n| 11 | 0.1409980 | Apple_b9:53:ec | LiteonTe_fa:5e:b4 |\
  \ ARP | 42 | 192.168.1.107 is at d8:bb:2c:b9:53:ec |\n| 12 | 0.1620010 | 192.168.1.100\
  \ | 192.168.1.107 | TCP | 62 | 80->1340 [SYN, ACK] Seq=2258050522 Ack=30600 |\n\
  | 13 | 0.1622670 | 192.168.1.107 | 192.168.1.100 | TCP | 54 | 1340->80 [ACK] Seq=30660050876\
  \ Ack=2258050523 |\n| 14 | 0.1627790 | 192.168.1.107 | 192.168.1.100 | HTTP | 347\
  \ | GET /efg.exe HTTP/1.1 |\n\n图 7.27：在列表窗格中注意到的异常行为\n\n从数据包一开始的行为进行观察，首先是由 Windows\
  \ 机器发送的 ARP 请求，因为它试图查找本地配置的合法 Web 服务器。随后是三次握手，客户端在第 6 帧发起 GET 请求，服务器在下一个数据包中进行确认。然后，服务器表明客户端寻找的资源已被移动到另一个位置，客户端需要前往该位置。此后，客户端在第\
  \ 9 帧生成一个 SYN 请求。接着，命令与控制中心生成 ARP 数据包，询问客户端的物理地址，以便与它取得联系并传输文件。最后，在第 12 和第 13 帧中，三次握手完成，最终由受害机器生成\
  \ GET 请求，从而开始传输攻击利用代码，如第 14 帧所示。此类流量模式的后果可能是极具破坏性的。优秀的网络/安全管理员应该意识到此类流量模式，并可以利用这种流量行为来创建防火墙/IDS-IPS\
  \ 签名，从而快速产生警报。这些签名有助于避免攻击，并使他们的基础设施准备好对抗这些恶意流量。\n\n## 解决真实世界的 CTF 挑战\n\n夺旗（Capture\
  \ The Flag）赛事是安全会议上最常见的事情。其目标是学习和参与基于真实场景的挑战，这能很好地帮助你学习相关方法论。如果你有兴趣破解旗标（flag），可以搜索\
  \ DEF Con、PlaidCTF、CSAW、Codegate 等知名会议。参加这些挑战需要具备基本的编程、网络、取证知识和常识。\n\n我为你准备了一些挑战，我们将以逐步的方式一起解决它们。为了让你们了解\
  \ CTF 的运作方式以及应该遵循的方法，我已将它们设计得相当简单。那么，让我们开始吧，去捕获一些旗标。\n\n### 第一个 CTF：利用远程管理服务中的弱点\n\
  \n![](img/da40f92928403866599198344271d63e_1302_0.png)\n\n图 7.28：CTF1 跟踪文件\n\n**解决方案：**\
  \ 我们有一个 telnet-flag.pcap 文件，其中在列表窗格中列出了多个数据包。题目要求我们利用远程管理服务。我们知道有哪些服务用于远程管理？RDP、Telnet\
  \ 和 SSH。为了更好地理解该场景，让我们先在 Wireshark 中打开跟踪文件。请参见以下截图：\n\n![](img/da40f92928403866599198344271d63e_1303_0.png)\n\
  \n如你所见，我们的跟踪文件中有两千多个数据包。要滚动到底部逐个查看每个数据包实际上是不可能的。最好的做法是查看协议层次结构窗口，它会简要列出整个跟踪文件中涉及的所有协议。这样，我们就可以很容易地识别出远程管理服务。协议层次结构窗口可以从“统计”菜单访问。请参见以下截图：\n\
  \n![](img/da40f92928403866599198344271d63e_1304_0.png)\n\n在列出的所有协议中，我只看到一个用于远程管理的协议，我们可以利用它继续推进\
  \ CTF 流程。因此，我应用了显示过滤器 `telnet`，以便只查看相关流量。请参见以下截图：\n\n![](img/da40f92928403866599198344271d63e_1305_0.png)\n\
  \n图 7.30：Telnet 流量 CTF1\n\n下一步是跟踪这些数据包的 TCP 流，这将揭示有关 Telnet 会话的更多信息。\n\n这就是这道题目的核心：利用远程管理服务中的弱点。Telnet\
  \ 会话可以以纯文本格式查看，而我们最终正是利用了这一弱点，得以查看纯文本格式的会话信息。旗标（flag）就是用户登录 Windows 机器执行维护活动时使用的密码。\n\
  \nFLAG : Sup3rs3cr3t\n\n下面的截图展示了数据包组装完成后 TCP 流窗口的外观。此外，Telnet 会话的密码也可以清楚地看到。\n\n\
  ![](img/da40f92928403866599198344271d63e_1306_0.png)\n\n希望你已理解了 CTF 解题的基本方法。在解决后续的\
  \ CTF 挑战时，我们也会采用类似的方法。\n\n这一次，我设计了一个使用另一种常见协议的 CTF，让你学习 CTF 挑战方法的基础知识。\n\n### 第二个\
  \ CTF：图像魔法\n\n**解决方案**就藏在这个 CTF 的标题中，它非常简短且引人注目；虽然我们不知道要寻找什么，但可以肯定与图像有关。Wireshark\
  \ 每次都像在施展魔法；这就是我对这个挑战的看法。\n\n采用与第一个挑战类似的方法，我们将打开跟踪文件，了解与流量捕获相关的基本统计信息，从而大致了解会话期间使用的协议。请参见以下截图：\n\
  \n![](img/da40f92928403866599198344271d63e_1307_0.png)\n\n图 7.32：CTF2 跟踪文件\n\n跟踪文件以大量\
  \ DNS 数据包开头，这些数据包看起来对分析不太有用。查看 Wireshark 中以下状态栏，我们可以确定捕获了大约 4,800 帧。这个文件不可能逐元素检查，所以我们需要借助我们的最佳助手：协议层次结构对话框（现在我希望，不需要任何具体说明，你就能打开这个对话框）：\n\
  \n\n**图 7.33：CTF2 协议分层**\n\n在各类协议列表中，我发现了 JPEG——这是一种图片扩展名，并且它在对话框里被列在 HTTP 部分之下。由此我们可以推断，这两者之间存在某种关联，因此我们的显示过滤器可以设为\
  \ HTTP，这样我们就能沿着正确的方向继续前进。\n\n当我在显示过滤器框中输入 HTTP 并按回车后，只看到了四个数据包。其中有一个名为 flag 的 .jpg\
  \ 文件。请参考以下截图：\n\n**图 7.34：显示过滤器 HTTP——CTF2**\n\n帧编号 4696 显示了一个针对 flag.jpg 文件的 GET\
  \ 请求。通过查看该数据包的 TCP 流进一步调查，可以确认客户端 192.168.1.108 请求了一个 .jpg 文件。请参考以下截图：\n\n```\n\
  Stream Content\nGET /flag.jpg HTTP/1.1\nAccept: image/gif, image/x-xbitmap, image/jpeg,\
  \ image/pjpeg, */*\nAccept-Language: en-us\nUA-CPU: x86\nAccept-Encoding: gzip,\
  \ deflate\nUser-Agent: Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.2; SV1; .NET\
  \ CLR 1.1.432\nHost: 192.168.1.106\nConnection: Keep-Alive\n\nHTTP/1.1 200 OK\n\
  Date: Thu, 17 Sep 2015 09:05:24 GMT\nServer: Apache/2.2.22 (Debian)\nLast-Modified:\
  \ Thu, 17 Sep 2015 08:10:02 GMT\nETag: \"154002-12ef5-51fecf132d262\"\nAccept-Ranges:\
  \ bytes\nContent-Length: 77557\nKeep-Alive: timeout=5, max=100\nConnection: Keep-Alive\n\
  Content-Type: image/jpeg\n\n......JFIF......` `......\nC..........................................................................\n\
  C........................................................................9....\n\
  \"........................................................................\nEntire\
  \ conversation (78148 bytes)\n```\n\n**图 7.35：TCP 流——CTF2**\n\n客户端发起的请求现已得到确认和验证。下一步是从该流中导出此对象。转到\
  \ **文件 | 导出对象 | HTTP**。\n\n| 数据包编号 | 主机名 | 内容类型 | 大小 | 文件名 |\n|------------|----------|--------------|------|----------|\n\
  | 4761 | 192.168.1.106 | image/jpeg | 77 kB | flag.jpg |\n\nWireshark：HTTP 对象列表\n\
  帮助   另存为   全部保存   取消\n\n该窗口仅列出了一个 `flag.jpg` 文件。按照上述步骤导出该图片对象。首先选中显示该对象的那一行，然后点击\
  \ **另存为**，将文件保存到你想要的位置。完成后，打开该文件即可查看 flag 内容。请参考以下截图查看导出对象的内容。\n\n![](img/da40f92928403866599198344271d63e_1310_0.png)\n\
  \n**图 7.36：CTF2**\n\n这个挑战相当有趣，因为你了解了 CTF 挑战背后的另一种思路。\n\n我们的最后一项挑战也会让我们接触到 CTF 背后的一种新思路。\n\
  \n## 第三项 CTF：你够专业吗！！\n\n这项挑战的标题本身就颇具挑战性。不过，我们会一起解决它。那么，先打开跟踪文件吧。\n\n乍一看，它和我们见过的其他跟踪文件一样，里面充斥着大量无用的数据包。为了不被这些海量信息干扰，我们继续沿用此前一直采用的方法。请参考以下截图：\n\
  \n![](img/da40f92928403866599198344271d63e_1311_0.png)\n\n**图 7.37：数据包列表窗格——CTF3**\n\
  \n查看协议分层窗口，它可以帮助我们进一步了解当前面对的 CTF 挑战。请参考以下截图：\n\n![](img/da40f92928403866599198344271d63e_1312_0.png)\n\
  \n**图 7.38：协议分层——CTF3**\n\n不出所料，我们对跟踪文件有了新的认识：可以发现 UDP 流量占比约为 89%，这是一个相当高的比例。在它下列出了实时传输协议。因此，我们继续为\
  \ RTP 流量创建一个显示过滤器，这将帮助我们进入解决谜题的下一步。请参考以下截图：\n\n![](img/da40f92928403866599198344271d63e_1312_1.png)\n\
  \n**图 7.39：RTP 显示过滤器——CTF3**\n\n看起来 `192.168.1.107` 和 `192.168.1.105` 这两个主机之间正在进行一次通话会话。接下来，我将使用\
  \ Wireshark 的回放功能重新组装该流，并尝试播放。转到 **电话菜单 | VoIP 通话**，选择第 1 行中的 SIP 通话，然后点击 **播放器**。请参考以下截图：\n\
  \n![](img/da40f92928403866599198344271d63e_1313_0.png)\n\n**图 7.40：VoIP 通话对话框——CTF3**\n\
  \n通话会话可见后，选中它并点击播放器，此时系统会要求你输入抖动值。将值指定为 `200`，然后点击 **解码**：\n\n![](img/da40f92928403866599198344271d63e_1313_1.png)\n\
  \n现在，你应该可以看到已组装好的 VoIP 流可供回放。选择通信的第一部分并点击播放。A 方通信者说：“开始传输兔子”，而播放 B 方的部分时，我们可以观察到它只是对\
  \ A 方消息的回声。请参考以下截图：\n\n![](img/da40f92928403866599198344271d63e_1314_0.png)\n\n\
  **图 7.41：用于回放的重新组装 VoIP 通话——CTF3**\n\n我们并没有从这条消息中获得多少线索。让我们再次查看协议分层对话框，看看 TCP 部分有什么信息。除了\
  \ HTTP 协议之外，没有太多有用的信息。在 HTTP 树下有一个媒体类型，这意味着网络上主机之间传输了某些内容（正如 VoIP 通话中的人所说“开始传输”）。我们应用\
  \ HTTP 作为显示过滤器，得到以下截图：\n\n![](img/da40f92928403866599198344271d63e_1314_1.png)\n\
  \n可以清楚地看到，一个 `flag.rar` 文件被传输了。让我们将其导出为 `.rar` 文件以便解压。转到 **文件 | 导出对象 | HTTP**，选择第一行，然后点击\
  \ **另存为** 保存该 `.rar` 文件。文件已成功保存，但当我们尝试打开该文件时，它要求输入密码，而我们的没有。\n\n## 总结\n\n使用 Wireshark\
  \ 抵御最常见的入侵尝试，以保持网络安全。从安全角度分析数据包，你将获得处理恶意用户的新见解。\n\n端口扫描、足迹收集和各种主动信息收集等活动是攻击方法的基础，攻击者可能利用这些方法来绕过你的安全基础设施。\n\
  \n猜测合法服务的密码称为暴力破解攻击。如果将同样的攻击方式与包含数百万密码的字典结合起来，破解成功的机会就会更高。通过 Wireshark，你可以查看针对网络中某项服务发起的此类尝试。\n\
  \n恶意用户可以利用看起来合法的软件进入你的网络。如今，恶意软件传播最常见的途径是电子邮件。另一种攻击形式，如网络钓鱼，与恶意软件结合后会变得极其危险。\n\n\
  Wireshark 可以帮助你分析恶意软件行为，并利用分析出的行为，为现有的 IDS/IPS 防火墙创建必要的特征签名。\n\n夺旗（CTF）活动通常在安全会议上举办。参与者会获得多种教育性练习，以体验真实世界的场景。真正的\
  \ CTF 是 A 队尝试渗透 B 队的网络，同时 B 队也尝试渗透 A 队的网络。双方都要负责抵御对方发来的恶意攻击。CTF 活动有多种类别，例如逆向工程、协议分析、编程、密码分析等。掌握\
  \ Wireshark 可以让你在处理与协议分析相关的 CTF 时更加轻松。\n\n以安全专业人士的视角观察周围散落的事物，你会看到不同的景象。从企业基础设施内部的人来看，一切可能感觉良好；然而从外部来看，你可能非常脆弱。安全专业人士就像是\
  \ IT 行业的免疫系统，而使用 Wireshark 分析数据包正是他们武器库中的一件利器。\n\n\n\n\n\n## 练习题\n\n- 问题1：主动和被动信息收集技术之间有什么区别？\n\
  - 问题2：哪种信息收集技术更隐蔽？为什么？\n- 问题3：你对术语“横幅抓取”有什么理解？\n- 问题4：使用Linux中的netcat工具连接到一个正在运行的HTTP服务。\n\
  - 问题5：在nmap扫描中使用的`-sT`和`-sS`开关有什么区别？你能同时使用两者吗？\n- 问题6：使用nmap对机器执行操作系统指纹识别，然后将扫描输出重定向到文件以供以后使用。\n\
  - 问题7：不使用nmap，你能使用Wireshark对操作系统进行指纹识别吗？\n- 问题8：针对你的操作系统指纹识别尝试如何导致严重损害？\n- 问题9：找出使用nmap绕过公司环境中部署的防火墙的技术。\n\
