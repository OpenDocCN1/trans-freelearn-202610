  \ 记录层：握手协议：加密的握手消息\n\n- 高亮区域1显示客户端发送客户端密钥交换命令。此命令包含由客户端创建并使用服务器公钥加密的预主密钥。对称加密密钥由客户端和服务器根据客户端和服务器问候消息中交换的数据生成。\n\
