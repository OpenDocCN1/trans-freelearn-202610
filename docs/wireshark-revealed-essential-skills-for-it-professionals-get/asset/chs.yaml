  \n## 异常 DNS 流量\n\n名称解析问题可能对网络性能产生重大影响。你可能遇到的最常见 DNS 问题之一是查找 DNS 服务器数据库中不存在的内容。有时，你试图访问一个确实存在的网站，但你的\
  \ DNS 服务器无法解析你给出的域名。也可能是超时情况，即你的客户端等待 DNS 响应的时间超过了预期时间。\n\n在下面的图 4.3 中，我正在尝试检查 http://google.com\
  \ 域的 A 记录，这实际上是一种不正确的语法。希望它不会被解析：\n\n```text\nAnonymous:~ NotFound$ host -t a http://google.com\n\
  Host http://google.com not found: 3(NXDOMAIN)\n```\n\n图 4.3：http://google.com 的\
  \ A 记录\n\n正如预期，我们收到了“未找到”错误。我只尝试了一次，但客户端尝试了两次来解析给定的域名。捕获到的内容如图 4.4 所示：\n\n| 序号 |\
  \ 时间 | 源 | 目标 | 协议 | 长度 | 信息 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1\
  \ | 0.000000000 | 192.168.1.103 | 192.168.1.1 | DNS | 77 | 标准查询 0xcdc1 A http://google.com\
  \ |\n| 2 | 0.009283000 | 192.168.1.1 | 192.168.1.103 | DNS | 77 | 标准查询响应 0xcdc1\
  \ 无此名称 |\n| 3 | 0.053794000 | 192.168.1.103 | 192.168.1.1 | DNS | 77 | 标准查询 0xbb93\
  \ A http://google.com |\n| 4 | 0.056583000 | 192.168.1.1 | 192.168.1.103 | DNS |\
  \ 77 | 标准查询响应 0xbb93 无此名称 |\n\n图 4.4：DNS 响应 - 无此名称\n\n你可能会遇到多种情况而陷入困境。最好的选择是首先为自己的网络设定一个基准，然后尝试将你的问题与你创建的基准进行比较。例如，检查你尝试解析的名称，启动协议分析器，深入查看名称解析查询和响应。了解完成查询、响应过程等需要多长时间。网络上的每个设备都维护一个本地\
  \ DNS 缓存（hosts 文件），它最初用于解析你请求的任何域。如果本地 DNS 缓存没有该域的条目，则请求将被转发到本地网络的 DNS 服务器，由该服务器执行查找。如果找到，将发送其响应。否则，来自本地\
  \ DNS 服务器的请求将被转发到本地 DNS 服务器配置查找的外部 DNS 服务器。\n\n## 文件传输协议\n\n自从互联网出现以来，我们一直在使用 FTP。即使在互联网仍是政府和公司组织使用的封闭网络时，FTP\
  \ 也是备受关注的。\n\nFTP 使用 TCP 协议在指定通道上发起和传输文件。将创建两个通道：一个是命令通道，另一个是专门的数据通道。命令通道用于发送和接收命令及其响应。数据通道用于在客户端和服务器之间发送数据。\n\
  \n通常，FTP 服务器使用端口 21 监听连接，客户端使用任意随机端口发送和接收数据。按照标准，端口 21 用于命令通道，端口 20 用于数据通道。但是，你会观察到使用随机端口号来传输\
  \ TCP 数据段。\n\n### 剖析 FTP 通信\n\n客户端与服务器通信时使用两种模式：主动模式和被动模式。这两种模式在发送和接收数据时采用不同的方式。在早期版本中，默认使用主动模式，但现在，你会看到默认使用被动模式。我将使用自己的虚拟网络来讨论每种模式，其中我在\
  \ `172.16.136.129` IP 上配置了 FTP 服务器（VSFTPD），客户端位于 `172.16.136.1`。以下各节描述了流程，并展示了客户端和服务器在主动和被动模式下的行为。\n\
  \n### 被动模式\n\n- 客户端向运行在端口 21 的服务器发送 SYN 请求。\n- 客户端通过使用的临时端口从服务器接收 SYN/ACK。\n- 客户端向服务器发送\
  \ ACK，以确认该通道将用于发送命令。请参阅以下截图：\n\n![](img/da40f92928403866599198344271d63e_1155_0.png)\n\
  \n- 现在，客户端将看到欢迎横幅，并被要求输入分配的凭据：\n\n![](img/da40f92928403866599198344271d63e_1155_1.png)\n\
  \n图 4.5：服务器显示欢迎横幅并要求输入凭据\n\n- 通常，被动模式默认必须开启。执行目录列表会告诉你**扩展被动（EPSV）**模式正在使用中。在此模式下，客户端请求服务器在数据端口上监听并等待连接。作为回报，服务器告知客户端用于连接的\
  \ TCP 端口号。请参阅以下截图。\n\n![](img/da40f92928403866599198344271d63e_1156_0.png)\n\n图\
  \ 4.6：客户端向服务器发送 ACK\n\n在帧 42 中，服务器告知客户端在创建到服务器的任何数据连接时必须使用的 IP 地址和端口号。\n\n- 在帧 42\
  \ 中，服务器告知我们客户端在创建到服务器的任何数据连接时必须使用的 IP 地址和端口号。随后是一系列 `SYN`、`SYN/ACK` 和 `ACK` 数据包，这些数据包是在两个设备之间创建数据通道所必需的。之后，如帧\
  \ 46 所示，执行 `LIST` 命令。然后使用客户端和服务器双方使用的临时端口传输数据。\n\n- 数据传输一完成，发送主机就通过传输 `FIN` 数据包来关闭连接，接收方使用\
  \ `ACK` 数据包进行确认。接收方也会发送一个 `FIN` 数据包，该数据包也会被确认。如果两个设备想要共享更多数据，则将使用随机端口号创建新的数据通道。\n\
  \n### 主动模式\n\n- 客户端向运行在端口 21 的服务器发送 `SYN` 请求。\n- 客户端通过客户端使用的临时端口从服务器接收 `SYN/ACK`。\n\
  - 客户端向服务器发送 `ACK`，以确认该通道将用于发送命令。请参阅以下截图：\n\n![](img/da40f92928403866599198344271d63e_1156_1.png)\n\
