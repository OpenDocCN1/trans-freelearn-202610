  ## NetFlow、JFlow 和 SFlow 分析器


  **Cisco** 的 NetFlow（[www.cisco.com/go/netflow](http://www.cisco.com/go/netflow)）和
  **Juniper** 的 JFlow（[http://www.juniper.net/techpubs/software/erx/junose82/swconfig-ip-services/html/ip-jflow-stats-config2.html](http://www.juniper.net/techpubs/software/erx/junose82/swconfig-ip-services/html/ip-jflow-stats-config2.html)）提供了一种在路由设备上收集
  TCP/IP 流量统计数据的方法。


  SFlow（[http://en.wikipedia.org/wiki/Sflow](http://en.wikipedia.org/wiki/Sflow) 和
  [http://www.sflow.org/index.php](http://www.sflow.org/index.php)）是一种用于监控高速交换网络的行业标准技术。


  它们之间的区别如下：


  -   **NetFlow** 适用于 Cisco 路由器和三层交换机。在三层交换机上，请确保它们支持 NetFlow（这取决于软件版本和硬件）。在某些情况下，你需要额外的软件/硬件才能实现。它由
  RFC3954 标准化（[http://www.ietf.org/rfc/rfc3954.txt](http://www.ietf.org/rfc/rfc3954.txt)）。

  -   **JFlow** 适用于 Juniper 路由器和三层交换机。

  -   **SFlow** 是用于监控局域网交换机的标准，由 RFC3176 标准化（[http://tools.ietf.org/html/rfc3176](http://tools.ietf.org/html/rfc3176)）。

  -   **PFIX**（RFC 5101 和 5102）是基于 **NetFlow v9** 发展而来的标准，由 **IETF** 标准化。


  所有 Flow/IPFIX 技术都依赖于通信设备从接口收集流量数据，并将其发送到管理站。它们需要在路由器或交换机上进行简单配置，并需要软件来收集和呈现数据。


  这类软件可用于监控哪些用户对网络造成了负载（按 IP 地址或 DNS 名称显示）、哪些应用（HTTP、SMTP 等，按端口号显示）、哪些网页（按其 IP 地址显示，并可转换为
  DNS 名称），以及其他类似维度。Wireshark 通常用于短期监控（**Conversations** 功能），而这些工具同样可用于长期监控。


  一些常见的软件选项包括：


  -   [http://www.plixer.com/Scrutinizer-Netflow-Sflow/scrutinizer-flow-analyzer.html](http://www.plixer.com/Scrutinizer-Netflow-Sflow/scrutinizer-flow-analyzer.html)（来自
  **Plixer**）

  -   [http://www.sevone.com/technologies/NetFlow-analysis](http://www.sevone.com/technologies/NetFlow-analysis)（来自
  **SevOne**）


  有免费软件工具，也有提供功能受限免费版本的商业工具（通常受可监控接口数量的限制）；在商业 SNMP 平台中，你通常可以获得两到五个接口的免费许可。





  ## HTTP 调试器


  HTTP 调试器是提供有关 HTTP 的统计和详细数据的工具。以下是一些可用于此目的的工具：


  | 供应商 | 软件名称 | 下载地址 | 备注 |

  |---|---|---|---|

  | Eric Lawrence 和 Telerik | Fiddler | [http://fiddler2.com/](http://fiddler2.com/)
  | 最常见的免费 HTTP 调试工具，它是一款独立软件，用于捕获数据包并对其进行分析（如 Wireshark）。 |

  | Simtec Limited | HTTPWatch | [http://www.httpwatch.com/](http://www.httpwatch.com/)
  | 分为基础版、受限版和商业版。可作为 Firefox 或 Internet Explorer 的附加组件使用。文件可用 HTTP Watch Studio 打开。也适用于
  iPhone iOS。 |


  使用这些工具，您将获得 HTTP 统计和性能信息，例如打开网页所需的时间、延迟原因以及错误摘要。


  ## Syslog


  Syslog（https://tools.ietf.org/html/rfc5424）是一种用于消息日志记录的协议。通信设备上有许多可以配置的参数，因此当出现问题时，会向
  Syslog 服务器发送消息。这些问题通常是硬件和软件方面的，SNMP 并不总是能覆盖到。


  一个优秀的 Syslog 服务器（用于接收消息并呈现它们）可以在 http://www.kiwisyslog.com/free-edition.aspx 找到。还有许多其他工具，它们在许多管理平台中都是免费提供的。


  ## 其他工具


  您可能需要的一些其他网络工作工具如下：


  - 一个简洁的工具 **Xplico**，用于提取捕获文件中包含的应用程序数据：[http://www.xplico.org/about](http://www.xplico.org/about)（免费软件）

  - **Nmap** 安全扫描器：[http://nmap.org/](http://nmap.org/)

  - 适用于 Linux 的 **Netcat**（nc）：[http://nc110.sourceforge.net/](http://nc110.sourceforge.net/)


  ## 有趣的网站


  以下是我经常使用的一些有趣的网站：


