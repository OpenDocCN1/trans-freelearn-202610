  \ 整合流\n\n- 现在，我们已经看到了日常操作中会遇到的正常流量模式，是时候来看一些恶意的东西了，比如针对你的 FTP 服务器执行的暴力破解攻击尝试。我使用了另一个在同类工具中同样流行的暴力破解工具——THC-hydra。\n\
  - 在发出命令之前，请确保你拥有适合自己的目标的自制定字典文件（请参考 openwall 网站 http://www.openwall.com/wordlists/\
  \ 获取可用的最佳字典文件）。\n- 一旦你准备好了字典文件并让目标主机正常运行，请发出 hydra -l <username> -P <password file>\
  \ ftp://<you target's IP address> 命令。请参见以下截图：\n\n```\nroot@kali:~# hydra -l charit\
