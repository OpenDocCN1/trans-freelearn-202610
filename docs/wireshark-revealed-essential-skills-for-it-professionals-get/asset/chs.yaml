  在上面的截图中，位于192.168.1.103的客户端向位于216.58.220.36的服务器发送FIN和ACK。之后，客户端期望接下来收到一个ACK数据包。然而，客户端没有收到服务器的任何回复。现在，在RTO时间到期后，客户端在加倍的时间后开始发送相同的数据包，并且每隔一定时间发送TCP重传数据包的过程持续进行，直到客户端收到ACK数据包或达到最大重传尝试次数。观察RTO列，看看值如何开始加倍，直到达到最大限制。


