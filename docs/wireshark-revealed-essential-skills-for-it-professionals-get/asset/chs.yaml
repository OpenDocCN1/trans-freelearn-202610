  单位：高级...\n缩放：自动\n平滑：无过滤器\n\n帮助 复制 保存 关闭\n\n## 过滤 HTTP 流量\n\n可以在 HTTP 中配置很多过滤器。在本节中，我将重点介绍此场景中最常用的显示过滤器。\n\
  \n## 准备就绪\n\n按照前几节所述配置端口镜像，并快速查看[第 2 章](#)，使用捕获过滤器。\n\n## 操作步骤...\n\n要配置 HTTP 过滤器，可以直接在显示窗口栏中编写过滤表达式；打开表达式窗口，并通过右键单击数据包面板中的所需参数来选择\
  \ HTTP 参数（如第 3 章“使用显示过滤器”所述）。\n\n可以在 HTTP 上配置各种过滤器：\n\n-   基于名称的过滤器\n    -   对特定网站的请求：http.host\
  \ == \"www.packtpub.com\"\n    -   对包含单词 PacktPub 的网站的请求：http.host contains \"packt.pub\"\
  \n    -   从 PacktPub 转发的请求：http.referer == \"http://www.packtpub.com/\"\n-   请求方法过滤器\n\
  \    -   所有 GET 请求：http.request.method == GET\n    -   所有 HTTP 请求：http.request\n\
  \    -   所有 HTTP 响应：http.response\n    -   所有非 GET 的 HTTP 请求：http.request and not\
  \ http.request.method == GET\n-   错误代码过滤器\n    -   HTTP 错误响应（客户端错误代码 4xx，服务器错误代码\
  \ 5xx）：http.response.code >= 400\n    -   HTTP 客户端错误响应：http.response.code >= 400\
  \ and http.response.code <= 499\n    -   HTTP 服务器错误响应：http.response.code >= 500\
  \ and http.response.code <= 599\n    -   HTTP 响应代码 404（未找到）：http.response.code ==\
  \ 404\n\n### 提示\n\n当你配置一个简单的过滤器，例如 http.host == packtpub 时，不需要用 \"\" 字符将其括起来。如果你需要更复杂的字符串，例如\
  \ packtpub\\r\\n，或多个单词的字符串，则需要用 \"\" 括起来，例如 \"http.host == packtpub\\r\\n\"。\n\n\
  ## 工作原理...\n\n让我们看看 HTTP 的一些细节。\n\n### HTTP 方法\n\n主要的 HTTP 请求方法发布在 RFC 2616 中。随着时间推移，还标准化了其他一些\
  \ HTTP 方法。后来通过 RFC 2616 的更新（2817、5785、6266 和 6585）以及其他标准（RFC 2518、3252、5789）增加了更多方法。\n\
  \n以下是 RFC 2612 中描述的基本方法：\n\n-   **OPTIONS**：用于客户端请求以确定 Web 服务器的能力。\n-   **GET**：用于请求一个\
  \ URL。\n-   **HEAD**：类似于 `GET`，但服务器不应在响应中返回消息主体。\n-   **POST**：用于向服务器发送数据。例如，使用\
  \ Webmail 时，它将用于发送电子邮件命令。\n-   **DELETE**：用于请求服务器删除由 `Request-URI` 标识的资源。\n-   **PUT**：用于请求将所附实体存储在请求所附的\
  \ Request-URI 下。\n-   **TRACE**：用于请求对请求消息进行远程应用层环回。\n-   **CONNECT**：用于连接代理设备。\n\
  \n### 状态码\n\n以下是 HTTP 标准化的消息代码类别：\n\n| 类别 | 类别名称 | 用途 |\n|---|---|---|\n| 1xx |\
  \ 信息 | 提供一般信息，不指示失败或成功 |\n| 2xx | 成功 | 表示客户端请求的操作已被接收、接受并成功处理 |\n| 3xx | 重定向 | 表示用户代理需要采取进一步操作才能完成请求\
  \ |\n| 4xx | 客户端错误 | 表示客户端错误 |\n| 5xx | 服务器错误 | 表示服务器错误 |\n\n完整的 HTTP 状态码列表可在 http://www.iana.org/assignments/http-status-codes/http-status-codes.xhtml\
  \ 找到。\n\n## 更多内容...\n\n在某些情况下，你会在数据包详细信息面板中的 HTTP 行下方看到一行名为 **基于行的文本数据：text/html**\
  \ 的内容。如以下截图所示：\n\n![](img/da40f92928403866599198344271d63e_763_0.png)\n\n你会在数据包详细信息面板中看到\
  \ **基于行的文本数据** 紧靠在 HTTP 行下方（如前面的截图中的 1 标记）。在其下方，你会看到一些解释（如前面的截图中的 2 和 3 标记），说明错误的可能原因。\n\
  \n## 配置 HTTP 偏好设置\n\n使用 HTTP 时，你可以更改一些偏好设置。让我们看看它们是什么。\n\n## 操作步骤...\n\n1.  选择 **编辑\
  \ | 偏好设置**。\n2.  在 **协议** 下，选择 **HTTP**。你将看到以下窗口：\n\n![](img/da40f92928403866599198344271d63e_766_0.png)\n\
  \n-   默认情况下，上方四行处于选中状态。这些选项用于在低层发生分片时重组 HTTP 头和主体。\n-   在 **TCP 端口** 字段中，你将看到 Wireshark\
  \ 将其解析为 HTTP 的端口号列表。在此列表中，你会看到默认端口 80、通常用于代理的端口 8080 和 8088 等。如果你的应用程序使用 HTTP 但端口未列出，请在此处添加。\n\
  -   HTTPS 也是如此——默认是 443（用于安全 HTTP，即基于 SSL/TLS 的 HTTP）。如果你使用其他端口，请在此处添加。\n\n### 自定义\
  \ HTTP 头字段\n\n自定义 HTTP 头字段使我们能够在 `http.header` 过滤器下创建新的 HTTP 显示过滤器。\n\n让我们看以下截图中的示例：\n\
  \n![](img/da40f92928403866599198344271d63e_767_0.png)\n\n要在 `http.header` 过滤器下创建新的\
  \ HTTP 显示过滤器，请执行以下步骤：\n\n1.  在 HTTP 偏好设置窗口中（如下一个截图中的 1 标记），点击 **自定义 HTTP 头** 字段中的\
  \ **编辑** 按钮。\n2.  点击 **新建**（如前面的截图中的 2 标记）。\n3.  在 Header name 中，输入要用于 http.header\
  \ 扩展的过滤器名称（如前面的截图中的 3 标记）。\n\n例如，如果要对 Age 参数配置过滤器，请在 Header name 字段中输入名称 Age（区分大小写！）。\n\
  \n4.  在 Field desc 字段中，输入任何能提醒你已配置内容的描述。\n\n例如，输入 老化时间 ...（任何描述都可以，只是一个提示）。\n\n\
  5.  点击 **确定**。\n\n6.  在 **显示过滤器** 文本框中，你将能够使用 http.header.Age 过滤器。\n\n例如，你将能够配置包含\
  \ 88482 的显示过滤器 http.header.Age，它会显示所有 Age 字段包含该请求数字的数据包。\n\n### 提示\n\n此过滤器配置最常用于使用专有参数时。\n\
  \n\n\n\n\n### 如何工作...\n\n重组功能很重要，因为在某些情况下会使用 IP 分片，因此 TCP 消息也会被分割。标记重组选项只是告诉 Wireshark\
  \ 对监控的数据包进行重组（接收方正在做的事情，因此能够理解它）。\n\n### 还有更多...\n\n通常只有在 Wireshark 看到有效的 HTTP 头时，才会将端口\
  \ 80 的解剖数据包显示为 HTTP。如果您想将所有端口 80 的数据包都显示为 HTTP，请执行以下步骤：\n\n- 1. 进入 **Preferences**，并在\
  \ **Protocols** 中选择 **TCP**。\n- 2. 取消选中/禁用 **Allow dissector to reassemble TCP streams**。\n\
  \n## 分析 HTTP 问题\n\n归根结底，当然是如何分析 HTTP 问题。这正是本食谱要讲的内容。HTTP 问题可能是由于服务器或客户端缓慢、TCP 性能问题以及本食谱中将看到的其他原因造成的。\n\
  \n### 准备工作\n\n当您在浏览互联网时遇到性能不佳的情况时，将 Wireshark 通过端口镜像连接到出现问题的 PC；当整个网络都遭受性能不佳的影响时，对通往互联网的连接进行端口镜像。\n\
  \n### 如何操作...\n\n缓慢浏览问题可能有各种原因，我们将逐步找出原因。步骤如下：\n\n- 1. 首先，检查您是否只是互联网线路负载过高、通信线路错误率过高，或是这些导致大多数问题的明显问题（有关更多详细信息，请参阅\
  \ [Chapter 4]，使用基本统计工具 和 [Chapter 5]，使用高级统计工具）。\n- 2. 为排除 TCP 问题（在 [Chapter 9]，UDP/TCP\
  \ 分析 中有详细说明），请检查以下细节：\n    - 在 **Expert info** 窗口中，您不会得到太多重传和重复 ACK（最高 0.5-0.8%\
  \ 仍可容忍）。\n    - 确保 HTTP 连接上不会出现重置。这可能是由于防火墙或站点限制造成的。\n- 3. 确保您不会出现以下 DNS 问题：\n \
  \   - 响应时间缓慢，如本章前面所述\n    - 名称未找到、不正确等\n- 4. 如果以上情况均不适用，好吧，让我们深入研究 HTTP。\n\n###\
  \ 提示\n\n不要忘记整体审视网络和 IT 环境。您无法将 TCP 与 HTTP 分开，也无法将 DNS 问题与应用程序的缓慢浏览分开。可能是您有一个非常缓慢的\
  \ HTTP 服务器；由于其响应缓慢，您会得到 TCP 重传。或者，由于 DNS 服务器缓慢，您会在几秒钟后才打开网页。只需逐步进行并隔离问题即可。\n\n当您第一次打开网页时，可能需要几秒钟。在这种情况下，您应检查以下条件：\n\
  \n- 1. 检查线路是否未被占用。\n- 2. 检查线路延迟（ping 网站即可完成此操作）。\n- 3. 查找错误代码。通常您会在浏览器上看到错误原因，但并非总是如此。\n\
  - 4. 配置过滤器 `http.response >= 400` 并查看有多少错误。在以下各节中，我们将看到几个需要您注意的示例。\n\n### 信息代码\n\
  \n| Code | Status | Explanation | What to do |\n|---|---|---|---|\n| 100 | Continue\
  \ | Request completed successfully and the session can continue. | - |\n| 101 |\
  \ Switching protocols | The server is changing to a different HTTP version. It will\
  \ be followed by an `Upgrade` header. | - |\n\n### 成功代码\n\n| Code | Status | Explanation\
  \ | What to do |\n|---|---|---|---|\n| 200 | OK | Standard OK response. | - |\n\
  | 201 | Created | The request has been fulfilled and a new resource has been created.\
  \ | - |\n| 202 | Accepted | The request was accepted and is still in process. |\
  \ - |\n| 203 | Non-authoritative information | The request was received with content\
  \ from another server, and it was understood. | - |\n| 204 | No content | The request\
  \ was received and understood, and the answer that is sent back has no content.\
  \ | - |\n| 205 | Reset content | This is a server request to the client to reset\
  \ the data that was sent to it. | - |\n| 206 | Partial content | Response for a\
  \ partial document request. | - |\n\n### 重定向代码\n\n| Code | Status | Explanation\
  \ | What to do |\n|---|---|---|---|\n| 300 | Multiple choices | The requested address\
  \ refers to more than one file. It can happen, for example, when the resource has\
  \ been removed, and the response provides a list of potential locations for it.\
  \ | - |\n| 301 | Moved permanently | The requested resource has been moved permanently.\
  \ Future requests should be forwarded to the attached URI. | - |\n| 302 | Moved\
  \ temporarily (found) | Page has been moved temporarily, and the new URL is available.\
  \ Usually, you will be automatically forwarded. | Usually, you will see a Found\
  \ code, and then another GET to the URL indicated |\n| 303 | See other | The response\
  \ to the request can be found in a different URI. It should be retrieved using an\
  \ HTTP GET to that resource. | - |\n| 304 | Not modified | When a request header\
  \ includes an if modified since parameter, this code will be returned if the file\
  \ has not changed since that date. | - |\n| 305 | Use proxy | The requested resource\
  \ must be accessed through a proxy. | Check what proxy is required |\n\n### 客户端错误\n\
