  \   限制显示过滤器\n\n帮助   复制   跟踪流   图表 A→B   图表 B→A   关闭\n\n## 使用“统计”菜单中的“端点”工具\n\n在本节中，我们将学习如何获取捕获数据中端点信息的统计数据。\n\
  \n### 准备工作\n\n启动 Wireshark，单击 **统计**。\n\n### 操作步骤...\n\n要查看端点统计信息，请执行以下步骤：\n\n1.\
  \  在统计菜单中，单击“端点”。\n\n    ![](img/da40f92928403866599198344271d63e_460_0.png)\n\n\
  2.  将出现以下窗口：\n\n    ![](img/da40f92928403866599198344271d63e_460_1.png)\n\n3.  在此窗口中，你将能够看到第\
  \ 2、3 和 4 层的端点，即以太网、IP 以及 TCP 或 UDP。\n\n### 工作原理...\n\n它只是提供 Wireshark 发现的所有端点的统计信息。可能是以下几种情况之一：\n\
  \n-   少量以太网端点（即 MAC 地址）对应大量 IP 终端节点（即 IP 地址）：例如，当我们有一台路由器与许多远程设备发送/接收数据包时，就是这种情况；我们将看到的是路由器的\
  \ MAC 地址和众多经过它的 IP 地址。\n-   少量 IP 终端节点对应大量 TCP 终端节点：这种情况适用于每台主机有大量 TCP 连接。它可以是具有大量连接的服务器常规操作，也可能是通过网络发起的一种攻击（例如\
  \ SYN 攻击）。\n\n### 更多内容...\n\n这里你会看到一个来自网络中心的捕获文件示例，以及我们能从中获取的信息。\n\n在下面的截图中，我们看到一个内部网络，其中有四台\
  \ HP 服务器和一台 Cisco 路由器。我们可以从解析为厂商名称的 MAC 地址前缀看出这一点：\n\n![](img/da40f92928403866599198344271d63e_462_0.png)\n\
  \n当我们选择查看 **IPv4: 191** 下的端点时，会看到许多端点来自 **192.168.10.0**、**192.168.30.0** 网络，也来自其他网络。\n\
  \n**端点：25-1-2012 test 1.pcapng**\n\n**IPv4 端点**\n\n| 地址 | 数据包 | 字节 | 发送数据包 | 发送字节\
  \ | 接收数据包 | 接收字节 | 纬度 | 经度 |\n|---|---|---|---|---|---|---|---|---|\n| 192.168.30.50\
  \ | 2 194 | 374 650 | 1 173 | 173 137 | 1 021 | 201 513 | - | - |\n| 192.168.30.41\
