- '# 第 9 章 Wireshark v2 简介


  本章将向你介绍 Wireshark 最新版本带来的惊人特性。以下是用户将会注意到的部分显著变化，本章所有示例均使用版本 2：


  - - Wireshark v2（QT）与旧版框架（GTK）之间的比较

  - - 智能滚动条

  - - 翻译功能

  - - 图形改进

  - - 更新的 TCP 流

  - - USBPcap

  - - 小结

  - - 练习问题


  Wireshark 已经陪伴我们大约二十年了；在其生命周期中我们并没有看到任何重大更新。然而，在这段漫长的时间里，引入了一些小更新，使应用程序更加方便和健壮。但这一次，我们有了一个全新打造的
  Wireshark v2，功能令人惊叹。是的，我们真的很幸运，能够见证协议分析行业中最受欢迎和令人惊叹的工具进行这次重大更新。


  我真的很兴奋地讨论最新版本中引入的不同工具集，但在此之前，你需要熟悉 QT 和 GTK 框架的背景。你肯定得现在或在读完本章后去谷歌搜索一下。不过，请确保记下它们。


  为了方便你，我将简要介绍这些框架及其背景；我之所以强调两者之间的区别，是因为我们协议分析器新开发的版本 2 是使用 QT 框架开发的。QT 和 GTK 是用于开发诸如
  Wireshark 等跨平台 GUI 工具的框架。一般来说，从最终用户的角度来看，差异将纯粹基于图形变化；但在性能方面，GTK 比 QT 更经济。为了更好地理解，这些不仅仅是工具包和框架；相反，它们是开发人员用来为最终用户创建更好
  GUI 的库集合。基本上，它是在复用其他人已经做出的设计。复用设计的主要优势是，它能让新安装的程序看起来与你机器上其他已安装的程序更相似。例如，让我们并排查看该应用程序的新旧版本；请参阅以下截图：



  ![](img/da40f92928403866599198344271d63e_1359_0.png)


  图 9.1：GTK 与 QT 框架


  你肯定想知道如何让机器安装最新版本的 Wireshark。其实非常简单；只需访问 [http://wireshark.org](http://wireshark.org)，然后进入下载页面。在那里，你会找到最新版本。下载适合你操作系统的那一个。在安装过程中，有一个重要问题会询问你：是想要将旧版本与新版一同安装，还是只安装新版本（请注意，只有
  Windows 用户拥有这个选项；Mac 和 Linux 用户只能安装应用程序的最新版本）。


  你还会看到机器上安装另一个组件：USBpcap。我在本章中为这个特定主题专门安排了一节。就基本介绍而言，USBpcap 帮助用户捕获从机器 USB 端口进出的数据。该工具在
  Linux 用户中已经可用相当长一段时间了，但幸运的是，现在 Windows 用户也可以使用它了。


  对于初学者，我们先来看一下主屏幕，它与旧版本给人的感觉完全不同。请参考以下截图：


  ![](img/da40f92928403866599198344271d63e_1360_0.png)


  图 9.2：Wireshark v2 的主屏幕


  我希望你和我一样，对这种崭新而令人兴奋的外观感同身受。这个版本中的一切都排列得如此恰当、更简洁。即使是完全没有协议分析经验的新手用户，也能获得一个很好的起点，只因为现在的界面已经变得简单且富有吸引力。


  例如，只要观察工具栏区域即可。在这个版本中，开发人员似乎过滤掉了不需要的、不太常用的工具，最终使界面看起来相当舒适。在这个新版本中，我们可以快速访问基本工具集，比如开始和停止捕获按钮、接口自定义按钮、保存/打开/关闭当前捕获文件的按钮、一些导航工具，以及自动滚动和颜色标记启用/停用按钮。


  就在工具栏区域下方，有我们的老朋友——“显示过滤器”工具集，它经过精心重新设计。在显示过滤器文本框的最左侧，你会看到一个类似书签的图标（蓝色，位于左上角），它会显示默认和手动创建的过滤表达式。请参考下面的截图：


  ![](img/da40f92928403866599198344271d63e_1361_0.png)


  图 9.3：显示过滤器工具栏


  如你所见，所有过滤器都被列出，它们可能是你创建的，也可能是默认的。因此，现在只需单击一下即可激活其中任何一个，而不必像旧版本那样弹出一个窗口，再从其中选择和套用过滤器。这无疑加快了分析过程，也让
  IT 专业人员的工作更轻松。


  在显示过滤器工具栏的另一端，有一些经过重新设计、焕然一新的旧工具，同时功能也有所改进；请参考以下截图：


  ![](img/da40f92928403866599198344271d63e_1361_1.png)


  图 9.4：显示过滤器工具集


  现在要应用任何显示过滤器，只需点击箭头，旁边的下拉菜单就会让你访问常用过滤表达式（最近使用过的表达式历史记录）。然后是 **Expression**（表达式）按钮，它帮助你进入对话框，在那里你可以访问所有按协议分类的可能过滤表达式。接下来，在显示过滤器文本框的最右侧，有一个
  + 号；点击它，就可以创建过滤器按钮。让我帮你在新版本中创建一个属于自己的过滤器按钮，以便入门。


  例如，我想创建一个按钮，只查看 ARP 数据包，所以我将在显示过滤器区域输入 `arp`，并点击工具栏末端的 + 号。然后，你需要指定按钮的名称：


  ![](img/da40f92928403866599198344271d63e_1362_0.png)


  图 9.5：添加自定义显示过滤器表达式按钮


  这将在 + 号旁边添加一个实体按钮。当你经常需要较长的显示过滤器表达式时，这种技巧会非常有用和高效。因此，不必再次输入整个表达式，只需单击一下就能启用它们。结果，你会看到类似下图的内容。现在，只需单击一次，即可应用
  **arp** 作为显示过滤器：


  ![](img/da40f92928403866599198344271d63e_1362_1.png)


  图 9.6：创建的显示过滤器按钮


  接下来，在显示过滤器工具栏下方，你可以看到最近使用的文件；双击任何你想打开的文件即可。


  在 **Open**（打开）文件部分之后，是捕获过滤器工具栏，我想你不需要任何解释也能明白它是做什么的，以及如何使用它。


  现在到了主屏幕上你会看到的最大变化：接口名称后面跟着一个交互式图形。你看到的图形实际上是实时的，也就是说，你会看到波动，即线条上下起伏。接口名称后面的迷你图形代表该接口进出流量的多少。这些迷你图形的专业术语是“迷你走势图”（sparklines）。在较旧的旧版本中，我们是以数字形式查看实时统计信息。


  现在，如果你决定从某个特定接口捕获流量，只需双击图形区域，剩下的交给 Wireshark 就可以了。


  ## 智能滚动条


  这是最新版本发布的功能之一，你可能已经注意到滚动条区域有一些彩色部分/线条。如果没有，那就回到任意一个捕获文件，慢慢上下滚动，观察滚动条区域的颜色模式。猜猜这在分析过程中会带来什么不同？让我们通过一个例子来理解。


  我将使用一个之前捕获的文件进行演示，其中包含 HTTP 和 HTTPS 数据包，以及一些重传和重复帧。第一眼你看不出有什么不同，但一旦你开始滚动，滚动条区域就会显示颜色模式。这种模式基于你在应用程序中设置的着色规则。例如，根据默认的着色规则，重复和重传数据包通常以黑色背景、红色前景显示，HTTP
  数据包以绿色背景、黑色前景显示。现在，让我们在应用程序本身中验证这一点。请参考下图：


  ![](img/da40f92928403866599198344271d63e_1364_0.png)


  图 9.7：智能滚动条在工作


  列表窗格中数据包以不同颜色显示的方式，与滚动条表示列表窗格不同区域的方式类似。


  同样，蓝色线条表示选中的数据包，黑色线条表示重复 ACK 和重传，绿色部分表示在捕获文件底部有一些 HTTP 数据包被列出。通过观察滚动条区域的颜色模式，我们就能知道前面有什么类型的数据包，最重要的是，导航到你正在寻找的某个数据包区域现在更加容易和快速了。


  我们之前已经讨论过自定义着色规则；让我们再以同一个捕获文件为例，这次我要自定义 HTTP 数据包的着色规则。我们将把绿色背景改成黄色。让我们看看在滚动条区域会有什么不同，如下图所示：


  ![](img/da40f92928403866599198344271d63e_1365_0.png)


  图 9.8：访问着色规则对话框





  要访问着色规则，您需要从菜单栏中点击**视图**，然后在最底部角落选择**着色规则**，这将显示一个对话框，其中会列出所有着色规则。尝试将 HTTP 着色规则改为黄色。完成后，关闭对话框并重新打开捕获文件，以便看到变化。


  现在，尝试滚动同一文件，我希望您会看到滚动条和列表窗格中的着色模式有所差异，所有 HTTP 数据包都以黄色背景显示。请参考以下截图：


  ![](img/da40f92928403866599198344271d63e_1366_0.png)


