  \ | 192.168.1.104 | SMTP | 81 S: 250 发件人正常 - 请发送RCPT。 |\n| 11 1439081671.468558000\
  \ | 192.168.1.104 | 192.168.1.105 | TCP | 52 57073-25 [ACK] Seq=37 Ack=98 Win=29696\
  \ L |\n| 12 1439081686.949708000 | 192.168.1.104 | 192.168.1.105 | SMTP | 78 C:\
  \ rcpt to:<efg@charit.com> |\n| 13 4206566.333758000 | 192.168.1.105 | 192.168.1.104\
  \ | SMTP | 91 S: 250 收件人正常 - 请发送RCPT或DATA。 |\n| 14 1439081687.064346000 | 192.168.1.104\
  \ | 192.168.1.105 | TCP | 52 57073-25 [ACK] Seq=63 Ack=137 Win=29696 |\n| 15 1439081688.805525000\
  \ | 192.168.1.104 | 192.168.1.105 | SMTP | 57 C: data |\n| 16 4207044.779326000\
  \ | 192.168.1.105 | 192.168.1.104 | SMTP | 91 S: 354 好的，发送数据，以CRLF.CRLF结束。 |\n|\
  \ 17 2122359292.356797000 | 192.168.1.104 | 192.168.1.105 | TCP | 52 57073-25 [ACK]\
  \ Seq=68 Ack=176 Win=29696 |\n| 18 1439081690.221834000 | 192.168.1.104 | 192.168.1.105\
  \ | SMTP | 55 C: DATA片段，3字节 |\n| 19 1439081690.447964000 | 192.168.1.104 | 192.168.1.105\
  \ | SMTP | 55 TCP 重传DATA片段，3 |\n| 20 1439081690.454208000 | 192.168.1.105 | 192.168.1.104\
  \ | TCP | 52 25-57073 [ACK] Seq=176 Ack=71 Win=16314 |\n| 21 1439081690.455528000\
  \ | 192.168.1.105 | 192.168.1.104 | TCP | 64 [TCP Dup ACK 20#1] 25-57073 [ACK] Seq=17\
  \ |\n| 22 168258645.511998000 | 192.168.1.104 | 192.168.1.105 | SMTP | 54 C: DATA片段，2字节\
  \ |\n| 23 419451065.438925000 | 192.168.1.105 | 192.168.1.104 | SMTP | 75 S: 250\
  \ 数据接收成功。 |\n| 24 1439081690.858935000 | 192.168.1.104 | 192.168.1.105 | TCP | 52\
  \ 57073-25 [ACK] Seq=73 Ack=199 Win=29696 |\n| 25 168257924.091710000 | 192.168.1.104\
  \ | 192.168.1.105 | SMTP | 57 C: DATA片段，5字节 |\n| 26 1439081694.129351000 | 192.168.1.105\
  \ | 192.168.1.104 | SMTP | 95 S: 221 Charit’s.com 服务正在关闭通道 |\n| 27 850006670.085950000\
  \ | 192.168.1.105 | 192.168.1.104 | TCP | 52 25-57073 [FIN, ACK] Seq=242 Ack=78\
  \ Win=1 |\n| 28 850006670.085950000 | 192.168.1.104 | 192.168.1.105 | TCP | 52 57073-25\
  \ [ACK] Seq=78 Ack=242 Win=29696 |\n\n### 图4.19：SMTP会话\n\n数据包1-3是TCP握手包。握手发生在客户端和服务器之间。在第四个数包中，客户端收到一条消息，响应代码为220。这意味着服务器已准备好并能够响应客户端的请求。在第六个数包中，客户端使用HELO命令初始化标准SMTP会话（你可能在想为什么列表窗格中列出的大多数数据包以C或S开头。从客户端发送的请求以字符C标记，服务器响应以字符S标记。）。然后，输入发件人和收件人的电子邮件地址，服务器确认这些地址正确，并在数据包10和13中返回响应代码250。之后，使用DATA命令输入电子邮件正文，服务器在数据包23中成功接收。最后，用户通过发出QUIT命令优雅地关闭连接，服务器在数据包26中确认，从而发送FIN、ACK。\n\
  \n现在，我将向你们介绍SMTP的阴暗面，你可能已经亲眼见过，或者总有一天会遇到。所谓阴暗面，我指的是那些通常不应该出现在列表窗格中的数据包。然而，如果它们出现了，那么你必须检查你的协议配置。为此，我想向你们介绍一些你应该了解的相当常见的场景。\n\
  \n\n\n\n我首先想到的最重要的情况是服务器和客户端无法建立专用的通信通道；简而言之，TCP握手不成功。这可能有多种原因，例如邮件服务器守护进程未运行，邮件服务器未运行在默认端口上，邮件服务器守护进程已达到允许的最大同时客户端连接数，或者不允许来自特定子网的连接，还可能存在多种相关场景。下面的列表窗格描述了两种流量异常：\n\
  \n![](img/da40f92928403866599198344271d63e_1178_0.png)\n\n图4.20：SMTP异常流量\n\n前两个数据包是由于错误而生成的，该错误阻止了TCP握手的发生。此错误可能由多种因素引起，下面列出了一些因素：\n\
  \n- 邮件服务器守护进程未运行\n- 邮件服务器守护进程的默认端口已更改\n- 邮件服务器守护进程已达到最大同时连接数限制（DDoS攻击）。\n- 邮件服务器的配置已被篡改\n\
  \n现在假设客户端已经知道了连接应发起的正确端口号，但会话仍未成功建立。观察从数据包3到数据包10（最后一个数据包）的流量。TCP三次握手已发生，但随后客户端突然被踢出会话。服务器做出这种响应的可能原因是什么？也许是因为存在某些限制（如IP或MAC过滤）而不允许客户端连接。\n\
  \n![](img/da40f92928403866599198344271d63e_1179_0.png)\n\n图4.21：客户端因某些限制而无法连接\n\n\
  如今广泛可见的另一种异常流量是垃圾邮件发送者和在野外游荡的垃圾邮件僵尸网络收集电子邮件。垃圾邮件发送者试图从可公开访问的邮件服务器中收集电子邮件，以验证哪些电子邮件地址有效，哪些无效。例如，看下面的截图（图4.15），其中恶意用户试图使用**邮件发件人**字段验证电子邮件ID是否存在，也可以使用VRFY命令验证电子邮件地址。根据响应，用户将知道电子邮件是否有效。观察数据包13的服务器响应。这类攻击使用自制字典文件进行，该文件匹配当前域名的要求。一旦电子邮件被验证，垃圾邮件发送者就可以执行各种形式的社会工程攻击。SMTP协议中大于350的响应代码可能表示某种错误，这会降低网络性能，从而增加延迟。\n\
  \n## 会话发起协议与IP语音\n\nSIP是VOIP协议族的一部分，它只是一种信令协议，用于在网络环境中创建、管理和终止IP语音会话。SIP的示例可以是双向电话呼叫或会议呼叫，包括多个主机在场的多媒体会话。该协议通常讨论远程双方（即打算通信的主机/节点）之间会话的发起。发起完成后，数据通过专用信道传输，实时传输协议（RTP）在其中提供帮助。基本上，RTP协议族管理所有多媒体项目的传输和流量控制（RTCP控制流）。\n\
  \n在使用此协议时，最常用的两个工具是“统计”菜单，我们将在其中介绍“协议分层”、“数据包长度”和“流量图”，这些将让您了解两个主机之间来回传输的数据。在“电话”菜单下，您将看到“RTP”和“VOIP呼叫”选项，它们可以帮助我们组装VOIP呼叫流。然后我们可以回放这些呼叫流来收听对话，这正是让我对Wireshark感到兴奋的地方。\n\
  \nSIP运行在UDP协议之上，通常使用端口5060。所有这些在基于IP的环境中结合起来，使我们能够通过支持VoIP的设备即时拨打电话给朋友。SIP使VOIP电话服务器能够轻松确定用户位置。它为我们提供了不同的呼叫管理功能，例如发起呼叫、断开呼叫、将某人加入会议呼叫、转接呼叫等。SIP不会帮助您维持通话质量，但SIP是各种服务使用的最重要标准之一。在我们直接查看和收听流量之前，让我们先熟悉一下流量在IP语音呼叫中是如何流动的。\n\
  \n我们将考虑三个参与方：其中两个是客户端，一个是IP电话服务器，它负责在两个通信主机之间来回传输所需和必要的数据包。下图描绘了一个小型基础电话架构，并列出了所采取的各种步骤：\n\
  \n![](img/da40f92928403866599198344271d63e_1181_0.png)\n\n- **客户端1** 使用SIP发送**Invite**请求以发起会话。\n\
  - 中间的电话服务器将请求转发给**客户端2**。\n- 电话服务器通过**100 TRYING**数据包向**客户端1**确认。\n- 当**客户端2**开始振铃时，**客户端1**会收到**180\
  \ RINGING**数据包。当另一端的**客户端2**收到呼叫时，它发送**200 OK**数据包，该数据包被转发给**客户端1**。\n- 现在，客户端发送**ACK**数据包以确认收到**200\
  \ OK**数据包。\n- 现在，双方通过专用信道连接，RTP/RTCP数据包开始在信道上双向流动。\n- 一旦双方通话完成，通信主机将发送**BYE**数据包，并由另一端确认。\n\
  - 如果您观察，大多数数据包都通过电话服务器传递。因为电话服务器只知道所连接主机的确切位置。\n- 一旦连接成功建立，所有数据包均由客户端直接发送和接收，无需服务器干预。\n\
  \n我使用Asterisk PBX配置了一个小型VoIP电话基础设施，您可以从供应商网站免费下载。VOIP服务器位于192.168.1.107，客户端1位于192.168.1.104，客户端2位于192.168.1.107。然后，我下载了X-Lite\n\
  \n![](img/da40f92928403866599198344271d63e_1186_0.png)\n\n图4.27：RTP播放器\n\n如果要播放消息，请选中滚动条下方的复选框，然后点击**播放**。这里列出了与组装后的VOIP流相关的各种有用的详细信息。\n\
  \n## 异常流量模式\n\nWireshark拥有众多工具，可帮助用户维护特定网络基础设施的服务质量（QoS），还有一个工具可帮助识别各种日常流量异常。处理SIP服务器时，一种常见的流量类型是`INVITE`请求，该请求由一个客户端发送，用于发起与另一个客户端的连接。您可能已经知道，此过程是一个三次握手，发起请求的客户端应在会话创建完成后进行确认。如果请求的客户端不响应`ACK`，而是发送另一个`INVITE`请求，会发生什么？通常，服务器会尝试将客户端连接到所请求的客户端机器，同时等待前一个请求的`ACK`响应。现在，假设客户端通过网络上的不同客户端发送了100个`INVITE`请求，并且甚至懒得为所创建的任何会话发送`ACK`。这可能导致DoS攻击（`INVITE`洪水攻击），其中SIP服务器将无法处理任何进一步的请求（`INVITE`的缓冲区大小为100）。要解决此问题，您可以应用显示过滤器查看从客户端发送的`INVITE`请求，或应用状态码为`200:OK`的过滤器。\n\
  \n除了DoS攻击之外，您的网络还可能因数据包拥塞而变慢，或者您可能无法连接到网络上的另一个客户端。换句话说，如果呼叫建立出现延迟（平均呼叫建立时间较长），您的呼叫将无法接通。一旦您在生产环境中工作，您将遇到多种情况。因此，Wireshark及其包含的各种强大工具可以为我们提供帮助。\n\
  \n例如，如果某个客户端尝试拨打无效的分机号，他们将收到错误，并且呼叫无法接通。这种情况将生成如下所示的数据包：\n\n![](img/da40f92928403866599198344271d63e_1187_0.png)\n\
  \n我建议您过滤包含错误代码大于399的SIP数据包，并使用`sip.Status-Code > 399`创建显示过滤器。请参见以下截图，其中列出了客户端1尝试呼叫时生成的多个错误：\n\
  \n\n![](img/da40f92928403866599198344271d63e_1188_0.png)\n\n图 4.28：SIP 错误\n\n##\
  \ 解密加密流量（SSL/TLS）\n\n是的，你可以使用 Wireshark 将在线 TLS 流量解密为纯文本 SSL 流。Google Chrome 和 Firefox\
  \ 会查找一个存储 TLS 会话密钥的日志文件。按照以下步骤解密加密流量：\n\n- **1.** 创建一个名为 `SSLKEYLOGFILE` 的环境变量，指向一个文本文件。你的浏览器每次启动时都会查找该文件。要创建环境变量，右键单击“我的电脑”|\
  \ 进入“高级设置”| “环境变量”| “新建”| 指定名称：`SSLKEYLOGFILE`，值：`C:/Users/username/sslkeylog.txt`，然后点击“确定”。\n\
  \n- **2.** 我已创建一个空白文本文件 `C:/Users/username/sslkeylog.txt`（让你的新环境变量指向该文件）。\n\n- **3.**\
  \ 现在，打开浏览器并访问一个启用了 TLS/SSL 的网站。为了演示，我在 192.168.1.105 运行了自己的 SSL Web 服务器，客户端也位于 192.168.1.105。\n\
  \n![](img/da40f92928403866599198344271d63e_1189_0.png)\n\n我创建的证书是自签名的；这就是为什么你会在地址栏中看到\
  \ https 上有一条红色斜线。访问任何启用 SSL 的安全网站后，你的 `sslkeylog.txt` 将填入一些随机数，如下面的屏幕截图所示。如果没有，请在继续之前仔细检查你的设置：\n\
  \n```\nCLIENT_RANDOM 17999a56ea29e69bcb242b441b1b519e0b3b16e79b9a46bfdcb280fd4eb027e1786e3766c7313f1117b14\n\
  ```\n\n- **4.** 我在 Wireshark 中捕获了客户端和服务器之间的全部流量。现在，转到“编辑”|“首选项”|“协议”|“SSL”|“（预）主密钥日志文件名”|\
  \ /path/to/sslkeylog.txt |“确定”。然后，右键单击 SSL 数据包（确保选择“解密数据包数据”，该选项应出现在字节窗格中）并跟踪 SSL\
  \ 流。现在，你将看到类似图 4.29 的内容：\n\n![](img/da40f92928403866599198344271d63e_1190_0.png)\n\
  \n图 4.29：解密 SSL 流量\n\n这是最简单的方法之一，只需点击几下即可解密 SSL 流量。另一种方法是将服务器的 RSA 私钥输入 Wireshark\
  \ 的 SSL 首选项中，结果也是一样的。\n\n## 总结\n\n域名系统/服务（Domain Name System/Service）是一种用于将网站名称解析为\
  \ IP 地址的协议。借助这一域名服务，你的机器可以在基于 IP 的网络中进行通信。如果启用了区域传输（zone transfer），未经身份验证的恶意用户可以向名称服务器请求区域数据，这被认为是极具恶意且危险的。\n\
  \n自互联网诞生以来，文件传输协议（FTP）一直用于在机器之间传输文件，并且在当今的现代网络中仍在使用。FTP 最不安全的地方在于数据以纯文本形式传输，除非你使用某种加密形式的\
  \ FTP 客户端-服务器基础设施，否则很容易被协议分析器捕获。\n\nWeb 浏览器用于通过超文本传输协议（HTTP）呈现和来回传输基于 Web 的内容。它通常也被称为请求/响应模型，即主机请求某个资源，服务器以状态码以及资源（如果可用）作为响应。应密切关注大于\
  \ 399 的状态码；我建议应用不同的着色方案。\n\nSMTP 协议用于发送电子邮件。它是一种未加密的协议，通常不采用认证机制。每条 SMTP 命令及其对应的参数都以纯文本形式在线路上传输，使用\
  \ Wireshark 可以轻松嗅探到。\n\nVoIP 流量由两部分组成：用于数据传输的 RTP 和用于创建会话的 SIP 协议。信令协议创建并管理会话，而实时传输协议（RTP）则用于承载语音本身。使用\
  \ Wireshark，任何人都可以捕获并重组数据包，从而收听通信会话。在处理这些协议时，应注意拥塞、抖动、延迟和回声问题，以保持服务质量。\n\n## 练习题\n\
  \n- Q.1 当你在互联网上浏览时，DNS 协议有什么重要性？\n- Q.2 你如何定义区域传输和递归 DNS 查询？\n- Q.3 在 DNS 查询中，“期望递归”（recursion\
  \ desired）和“可用递归”（recursion available）之间有什么区别？\n- Q.4 存在多少种 DNS 记录类型？解释 AAAA 记录类型的用途，以及“非权威回答”（non-authoritative\
  \ answer）是什么意思？\n- Q.5 区分 FTP 的主动模式和被动模式。解释哪种模式更好。\n- Q.6 如果要求你加密 FTP 会话，你能提出什么解决方案？解释它会带来什么不同。\n\
  - Q.7 使用虚拟基础设施或物理基础设施，在其中任意一台机器上安装 FTP 服务器，然后在 Wireshark 中捕获实时数据包的同时尝试与它通信。\n- Q.8\
  \ 找出如何限制最大登录尝试次数。这种限制如何影响 FTP 服务器的整体安全性？\n- Q.9 为什么我们将 HTTP 通信称为请求/响应方式？在发起连接时，三次握手的目的是什么？\n\
  - Q.10 我们目前使用哪个 HTTP 版本？旧版本和新版本之间有什么区别？\n- Q.11 当你的浏览器发出 HTTP 请求时，请求中还会发送各种其他参数。为什么会这样？随请求发送的\
  \ Accept-Encoding 和 Accept-Language 参数有什么用途？\n- Q.12 访问你选择的网站并浏览几个页面，同时在 Wireshark\
  \ 中捕获所有数据包。然后创建一个显示过滤器，检查整个会话中是否存在任何重定向。\n- Q.13 客户端上的 SMTP 用于什么目的？是发送电子邮件还是接收电子邮件？通常使用哪些协议来接收电子邮件？\n\
  - Q.14 是否可以对 SMTP 服务器执行暴力破解攻击？如果可以，如何执行？你又如何识别这种流量模式？\n- Q.15 你如何理解电子邮件收集（e-mail\
  \ harvesting）？如何对 SMTP 服务器执行电子邮件收集攻击？你会寻找某种特定的响应吗？\n- Q.16 阅读有关各种电子邮件协议与 SMTP 之间差异的内容？\n\
  - Q.17 SIP 在 VOIP 会话中有什么重要性？你认为 SIP 在整个 VOIP 会话中会占多大比例的流量？\n- Q.18 RTP 和 RTCP 协议之间有什么区别？\n\
  - Q.19 从 Wireshark 网站下载一个 SIP 流量捕获文件（`sippcap`），并使用流程图分析该会话。你能看到我们讨论过的流程吗？\n- Q.20\
  \ 使用针对此类响应的特定代码过滤掉所有错误密码尝试，并应用不同的着色方案（使用 `aaa.pcap` 捕获文件）。\n"
- "## 第 5 章 分析传输层协议\n\n本章将帮助你理解 TCP 和 UDP 协议、它们如何通信、使用这些协议时可能遇到的问题，以及如何借助 Wireshark\
  \ 来协助处理这些问题。你还将学习如何分析 TCP 和 UDP 协议，并查找可能随之而来的任何异常。本章将涵盖以下主题：\n\n- 理解 TCP 头部及其通信方式\n\
  - 理解 TCP 分析标志\n- 动手实验——TCP\n- 如何在 Wireshark 中检查不同的分析标志\n- 理解 UDP 流量\n- 动手实验——UDP\n\
  - 练习题\n\n我们将通过各种实际示例讨论 TCP 和 UDP 协议，让你深入了解低层协议数据包如何在网络中通信和传输，以便成功传输数据。我们还将探讨一些你在日常运维中可能遇到的常见异常。\n\
  \n### 理解 TCP 头部及其各种标志\n\nTCP 头部通常为 20 字节长，但有时由于存在选项字段，TCP 头部的大小最多可变化到 60 字节。请参考下面的简化\
  \ TCP 头部示意图：\n\n![](img/da40f92928403866599198344271d63e_1196_0.png)\n\n现在，让我们熟悉一下头部字段，以便更牢固地掌握\
  \ TCP 的基础知识：\n\n- **源端口**：这是与通信发送方关联的端口号，也可以说是负责在发送方侦听的端口。\n- **目的端口**：这是与通信接收方关联的端口号，也可以说是负责接收所传输数据包的端口。\n\
  - **序列号**：这些是用于确保数据可靠交付的唯一值。TCP 使用序列号跟踪每个分段。\n- **确认号**：这些值由接收方作为确认过程的一部分发送，用于确认数据包已成功接收。\n\
  - **数据偏移**：这表示数据包从哪里开始，以及 TCP 头部的长度。由于选项字段的存在，大小可能会变化。\n- **标志**：存在多种类型的标志位；每个标志位都有其自身的意义。它们用于发起连接、承载数据以及拆除连接，我们根据其被分配的目的将其命名如下：\n\
  \  - **SYN（同步）**：这些是用于发起...\n\n\n通常被称为握手过程的连接。\n\n- **ACK（确认）：** 这些数据包用于确认数据包已被接收，同时也确认连接建立和拆除。\n\
  - **RST（重置）：** 这些数据包表示您尝试创建的连接已被关闭，或者我们尝试通信的应用程序不接受连接。\n- **FIN（结束）：** 这些数据包表示在数据包成功传输后正在拆除连接。发送方和接收方都会发送FIN数据包以优雅地终止连接。如果它们想要再次通信，则从头开始，即从三次握手过程开始。\n\
  - **PSH（推送）：** 这些数据包表示传入的数据应直接传递给应用程序，而不是被缓冲。简单来说，即对方主机应无需等待即可接收数据。\n- **URG（紧急）：**\
  \ 标记的数据包表示TCP协议栈应立即处理数据包携带的数据；如果设置了紧急指针字段，则应检查该字段。\n- **CWR（拥塞窗口减小）：** 发送方使用这些数据包告知接收方，由于传输，缓冲区即将溢出，而且由于拥塞，双方都应放慢传输速度，以避免可能发生的任何数据包丢失。\n\
  \n- **窗口大小：** 头部中的该字段表示发送方可以发送的数据量。该数量在握手过程中决定，通信双方在握手期间匹配适合传输的缓冲区大小。通过此字段可以实现流量控制。\n\
  - **校验和：** 此字段用于交叉检查所接收数据的完整性，验证TCP段的内容。\n- **紧急指针：** 此字段告诉我们紧急指针所包含的值。它具体指示位于数据之前的八位字节的序列号。\n\
  - **选项：** 由于存在各种选项，此字段长度可以变化。该字段包含三个部分：第一部分指定选项字段的长度，第二部分表示所使用的选项，第三部分实际包含正在使用的选项。重要选项之一**最大段大小（MSS）**也是该字段的一部分。\n\
  - **数据：** TCP头部中的最后一部分是传输的实际数据。\n\n前面的信息使我们对TCP头部以及头部各组成部分的重要性有了总体了解。在分析TCP会话时，了解这些细节变得非常重要。\n\
  \n## TCP如何通信\n\n为了实时理解和分析数据包，我配置了一个运行在172.16.136.129的服务器和一个运行在172.16.136.1的客户端，如下图所示。我将尝试使用Wireshark来说明三次握手过程（在实际数据传输之前发生）以及拆除过程（优雅终止）。三次握手确保服务器和客户端开放建立连接，并准备好资源以在彼此之间创建专用通道，从而可靠地传输数据包。\n\
  \n![](img/da40f92928403866599198344271d63e_1199_0.png)\n\n### 工作原理\n\n服务器在80端口运行HTTP服务器守护进程。在客户端，我将访问http://172.16.136.129上的默认网页，并捕获通信过程中参与的所有数据包。\n\
  \n```\nip.addr==172.16.136.129 and ip.addr==172.16.136.1\n```\n\n### 注意\n\n为了清晰和方便，我创建了一个显示过滤器，专门显示这两个主机之间的流量。\n\
