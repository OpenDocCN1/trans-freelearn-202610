  \ 地址外，还会显示 DNS 名称。\n\n![](img/da40f92928403866599198344271d63e_631_0.png)\n\n- 2.\
  \ 要查看统计信息，请从“统计 | 对话”菜单中选择，并在窗口左下角勾选“名称解析”，如下一个截图所示：\n\n对话：Microsoft: \\Device\\\
