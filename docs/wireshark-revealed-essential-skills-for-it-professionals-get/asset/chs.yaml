- '## 第 1 部分 模块 1


  ### Wireshark 基础知识


  使用 Wireshark 启动并运行，有效分析网络数据包和协议

  '
- '## 第 1 章 初识 Wireshark


  自 1997 年 Gerald Combs 为了在小型 ISP 解决网络问题而创建 Wireshark（最初名为 Ethereal）以来，它已成为用于网络和应用协议数据包级分析的最流行工具之一。这主要是因为它是一个开源解决方案，任何技术专业人士都可以免费使用，同时它功能广泛，支持超过
  1000 种协议，并且全球超过 800 名开发者的贡献使其得以持续支持和改进。


  本入门章节将帮助您通过在系统上安装 Wireshark 并进行一些有趣且有用的操作，快速熟练掌握它，然后再深入探讨更多细节和支持概念。


  在本章中，我们将讨论以下主题：


  -   安装 Wireshark

  -   执行数据包捕获

  -   Wireshark 用户界面要点

  -   使用显示过滤器隔离感兴趣的网络流量

  -   保存过滤后的数据包跟踪文件


  后续章节将在此基础上提供这些基本功能的支持概念，使您能够培养最适合您的技术角色和目标的 Wireshark 技能。






  ## 在 Windows 上安装 Wireshark


  在下面的屏幕截图中，Wireshark 下载页面已识别出 64 位 Windows 安装程序适用于此 Windows 工作站：


  ![](img/da40f92928403866599198344271d63e_46_0.png)


  点击突出显示的链接会下载一个 Wireshark-win64-1.10.8.exe 文件或类似的可执行文件，您可以将其保存到硬盘上。双击可执行文件即可开始安装过程。您需要按照以下步骤操作：


  - 1. 同意许可协议。

  - 2. 通过在每个提示中点击下一步来接受所有默认值，包括安装 WinPcap 的提示，WinPcap 是从工作站的网络接口卡 (NIC) 捕获数据包所需的库。

  - 3. 在 Wireshark 安装早期，进程会暂停并提示您在单独的窗口中点击安装和几个下一步按钮来安装 WinPcap。

  - 4. WinPcap 安装完成后，点击通过剩余的下一步提示完成 Wireshark 安装。


  ## 在 Linux/Unix 上安装 Wireshark


  在 Linux 或 Unix 平台上安装 Wireshark 的要求和流程可能因特定环境而有很大差异。Wireshark 通常可以通过您特定 Linux 发行版的包管理系统默认获得。有关在
  Linux 上安装 Wireshark 的指导可在 [第 2 章](Chapter 2)，网络数据包分析师，或 Wireshark 用户文档中找到，位于 [www.wireshark.org/docs/wsug_html_chunked/ChapterBuildInstall.html](http://www.wireshark.org/docs/wsug_html_chunked/ChapterBuildInstall.html)。


  ## 执行您的首次数据包捕获


  当您首次启动 Wireshark 时，会显示初始的 **开始页面**，如下图所示：


  ![](img/da40f92928403866599198344271d63e_50_0.png)


  不要对这个屏幕太过钟爱。虽然您每次启动 Wireshark 时都会看到它，但一旦您执行捕获、打开跟踪文件或在 Wireshark 中执行任何其他功能，此屏幕将被标准的
  Wireshark 用户界面取代，您要到下次启动 Wireshark 时才会再次看到它。因此，我们不会在这里花费太多时间。


  ### 选择网络接口


  如果您的机器上有多个网络接口，您可能不确定选择哪个接口来捕获数据包，但有一个相当简单的方法可以弄清楚。在 Wireshark 开始页面上，点击 **接口列表**（或者从
  **捕获** 菜单中点击 **接口**，或点击图标栏上的第一个图标）。


  打开的 **Wireshark 捕获接口** 窗口提供了机器上所有网络接口的列表和描述，每个接口分配的 IP 地址（如果已分配），以及几个计数器，例如自此窗口打开以来接口上看到的总数据包数和数据包/秒（每秒数据包数）计数器。如果接口分配了
  IPv6 地址（可能以 `fe80::` 开头并包含多个冒号）并且正在显示，您可以点击 IPv6 地址，它将切换为显示 IPv4 地址。这在下面的屏幕截图中显示：


  ![](img/da40f92928403866599198344271d63e_51_0.png)


  ### 注意


  在 Linux/Unix/Mac 平台上，您可能还会看到一个回环接口，可以选择它来捕获在同一台机器上应用程序之间发送的数据包。然而，在大多数情况下，您只会对从网络接口捕获数据包感兴趣。


  目标是识别当您打开浏览器并导航到网站时将用于与 Internet 通信的活动接口。如果您有有线局域网连接并且接口已启用，那很可能是活动接口，但您也可能有一个已启用的无线接口，它可能是也可能不是主要接口。活动网络接口最可靠的指标是它将具有不断增加的数据包数量，并且有相应的活动数据包/秒数（会随时间变化）。另一个可能的指标是如果一个接口分配了
  IP 地址而其他接口没有。如果您仍然不确定，请打开一个浏览器窗口并导航到您最喜欢的网站之一，观察数据包和数据包/秒计数器，以识别活动增加最多的接口。


  ### 执行数据包捕获


  一旦您识别出正确的接口，选择该接口左侧的复选框，然后点击捕获接口窗口底部的开始按钮。Wireshark 将开始捕获该接口上可以看到的所有数据包，包括发送到和来自您工作站的数据包。您会在屏幕顶部部分（称为数据包列表窗格）看到各种各样令人眼花缭乱的数据包经过；这是正常的。如果您没有看到，请尝试不同的接口。


  在典型的网络上，有多少后台流量令人惊讶，例如设备广播其名称、地址和服务的广播数据包，以及其他设备请求它们想要通信的站点的地址。同样，您自己的工作站为后台运行的应用程序和服务产生相当多的流量，而您之前并不知道它们会产生这么多噪音。您的
  Wireshark 数据包列表窗格可能看起来与以下屏幕截图类似；不过，我们现在可以忽略所有这些：


  ![](img/da40f92928403866599198344271d63e_53_0.png)


  我们准备生成一些我们感兴趣分析的流量。打开一个新的 Internet 浏览器窗口，在地址框中输入 www.wireshark.org，然后按 Enter。


  当 https://www.wireshark.org/ 主页加载完成时，通过从 **捕获** 菜单中选择 **停止** 或点击位于 **视图** 和 **转到**
  菜单标题之间的红色方块停止图标来停止 Wireshark 捕获。


  ### Wireshark 用户界面要点


  一旦您完成了首次捕获，您将看到正常的 Wireshark 用户界面主屏幕。因此，在我们继续进行更多操作之前，对此用户界面的主要部分进行快速介绍将有所帮助，这样您在我们继续分析过程时就知道所指的内容。


  默认 Wireshark 用户界面有八个重要部分或元素，如下图所示：


  ![](img/da40f92928403866599198344271d63e_55_0.png)


  让我们详细查看这八个重要部分：


  - **标题：** 此区域反映捕获所取自的接口或打开的数据包跟踪文件的名称

  - **菜单：** 这是 Wireshark 中标准的主功能和子功能行

  - **主工具栏（图标）：** 这些提供快速访问最有用的 Wireshark 功能的方式，值得熟悉并使用

  - **显示过滤器工具栏：** 这允许您快速创建、编辑、清除、应用和保存过滤器，以隔离感兴趣的数据包进行分析

  - **数据包列表窗格：** 此部分包含每个捕获数据包的摘要信息行，以及数据包编号和相对时间戳

  - **数据包详细信息窗格：** 此部分提供所选数据包的信息的层次结构显示，该数据包在数据包列表窗格中被选中，分为数据包中包含的各种协议的部分

  - **数据包字节窗格：** 此部分以十六进制字节或位形式显示所选数据包的内容，以及有助于的数据 ASCII 显示

  - **状态栏：** 此部分提供专家信息指示器、编辑捕获注释图标、跟踪文件路径名和大小信息、捕获和显示的数据包数量数据和其他信息，以及配置文件显示和选择部分






  ![](img/da40f92928403866599198344271d63e_58_0.png)


  我们想要对会话列表进行排序，以便将网络术语中称为 Top Talkers 的最繁忙会话置于列表顶部。点击 Bytes 列标题，然后再次点击它。你的列表应该看起来像前面的截图，如果你没有产生大量从你的工作站进出的其他背景流量，那么来自
  https://www.wireshark.org/ 的流量应该具有最大体积，因此位于列表顶部。


  在此示例中，IP地址 162.159.241.165 与 192.168.1.116 之间的会话具有最大的总体流量，并且查看 Bytes A->B 列，很明显大部分流量是从
  162.159.241.165 地址到 192.168.1.116 地址。然而，在这一点上，我们如何知道这真的是我们要找的会话呢？


  我们需要将列表中的 IP 地址解析为主机名或网站地址，这可以在 Wireshark 内部完成，通过打开网络名称解析并尝试使用反向 DNS 查询为这些 IP 地址解析主机名和/或网站地址（使用称为指针
  (PTR) DNS 记录类型）。如果你刚刚安装或启动了 Wireshark，名称解析选项可能默认未打开。


  这通常是一件好事，因为 Wireshark 在捕获过程中遇到所有 IP 地址时，通过发送 DNS 查询来创建自己的流量，你并不希望在捕获期间发生这种情况。然而，**名称解析**选项在捕获完成后将
  IP 地址解析为正确的主机名时非常有帮助。


  要启用 **名称解析**，导航到 **View | Name Resolution | Enable for Network Layer**（点击打开复选标记），并确保
  **Use External Network Name Resolver** 也已启用。Wireshark 将尝试将捕获中的所有 IP 地址解析为其主机名或网站地址，并且解析后的名称将出现在数据包列表以及
  **Conversations** 窗口中（替换之前的 IP 地址）。


  请注意，**Conversations** 窗口底部的 **名称解析**选项也必须启用（通常默认启用），并且此设置会影响在 **Conversations**
  窗口中显示解析后的名称还是 IP 地址（如果在 Wireshark 主屏幕中启用了 **名称解析**），如下图所示：


  ![](img/da40f92928403866599198344271d63e_59_0.png)


  此时，你应该在列表顶部或附近看到 **wireshark.org** 与你的工作站之间的会话对，如下图所示。当然，你的工作站将具有不同的名称或可能仅显示为 IP
  地址，但已成功识别到 **wireshark.org** 的会话。


  ![](img/da40f92928403866599198344271d63e_60_0.png)


  ## 应用显示过滤器


  你现在想要只查看工作站与 wireshark.org 之间的会话，并去掉所有多余的会话，以便专注于感兴趣的流量。这是通过创建仅显示所需流量的过滤器来实现的。


  右键单击包含 wireshark.org 条目的行并导航到 Apply as Filter | Selected | A<->B，如下图所示：


  ![](img/da40f92928403866599198344271d63e_61_0.png)


  Wireshark 将创建并应用一个显示过滤器字符串，将显示的流量隔离为仅 wireshark.org 与你的工作站 IP 地址之间的会话，如下图所示。请注意，如果你手动创建或编辑显示过滤器条目，你需要点击
  Apply 将过滤器应用于跟踪文件（或点击 Clear 清除它）。


  ![](img/da40f92928403866599198344271d63e_61_1.png)


  这种特定的显示过滤器语法使用 IP 地址而不是主机名，并使用 ip.addr==（IP 地址等于）语法为每个节点以及 &&（与）逻辑运算符构建一个字符串，表示显示包含该
  IP 地址 *和* 该 IP 地址的任何数据包。这是你在数据包分析中将大量使用的显示过滤器类型。


  你会注意到在 Packet List 窗格中上下滚动时，除了工作站与 wireshark.org 之间的数据包外，所有其他数据包都消失了。它们在严格意义上并没有消失，只是被隐藏了——你可以通过检查
  **Packet No.** 列来观察，编号序列中存在间隙；那些是隐藏数据包的编号。


  此外，默认情况下，Wireshark 会选择 All packets 选项，如果应用了显示过滤器（如本场景中），则会选择 Displayed 选项而不是无论是否应用过滤器都保存所有数据包的
  Captured 选项。输入文件名并确认所有保存选项正确后，你可以点击 Save 保存新的数据包跟踪文件。


  请注意，当你完成此跟踪文件保存活动后，Wireshark 仍在内存中保留捕获的原始所有数据包，并且可以通过点击 Display Filter Toolbar 菜单中的
  Clear 来查看它们。如果你想进一步处理刚刚保存的新跟踪文件，你需要通过点击 File 菜单中的 Open（或 File 菜单中的 Open Recent）来打开它。


  ## 总结


  恭喜！如果你完成了本章涵盖的所有活动，你已成功安装 Wireshark，执行了数据包捕获，创建了过滤器以从所有多余噪声中隔离并仅显示你感兴趣的数据包，并创建了仅包含这些数据包的新数据包跟踪文件，以便稍后分析。此外，在此过程中，你对
  Wireshark 用户界面获得了初步熟悉，并学会了使用其许多最有用和强大的功能。对于第一章来说，这已经很不错了。


  在下一章中，我们将回顾一些进行数据包级分析所需的基本网络概念。下一章的主要目标是帮助你建立一个适合数据包级分析的网络心理模型，而不会陷入不必要的细节中。

  '
- "## 第 2 章. 面向数据包分析师的网络\n\n数据包分析就是分析应用程序如何通过网络将有用数据从 A 点传输到 B 点。因此，了解网络如何运行至关重要。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 为什么七层 OSI 模型很重要\n- IP 网络和子网\n- 交换和路由数据包\n- 以太网帧和交换机\n- IP\
  \ 地址和路由器\n- WAN 链路\n- 无线网络\n\n七层 OSI 模型将被映射到最常见的网络术语，我们将回顾帧、交换、IP 地址、路由以及其他一些感兴趣的网络主题。目标是建立一个适合数据包级分析的网络心理模型。\n\
  \n## OSI 模型 – 为什么它很重要\n\n**开放系统互连 (OSI)** 参考模型是由 **国际标准化组织 (ISO)** 开发的行业公认标准，用于将网络功能划分为七个逻辑层，以支持并鼓励（相对）独立开发，同时在不同硬件/软件环境、平台和厂商之间提供（相对）无缝互连。还有一个稍微简单一些的四层\
  \ **国防高级研究计划局 (DARPA)** 模型，它映射到 OSI 模型，但 OSI 版本是最常被引用的。我在讨论各个层时将引用这两个模型。\n\n下图比较了\
  \ OSI 和 DARPA 参考模型：\n\n\n\n![](img/da40f92928403866599198344271d63e_69_0.png)\n\n\
  除非你从事协议编写工作，否则没有必要深入研究这七层中的每一层，但从概念上理解它们是有帮助的，因为业界和你的 IT 同行都会提及这些层。\n\n更重要的是，你必须知道这些层及其相关协议在\
  \ Wireshark 的 **数据包详细信息** 窗格中是如何呈现的，以及呈现在哪里。我们将从这个角度来介绍这些层，以帮助你记住它们，并从讨论中获得最大收益。\n\
  \n## 理解网络协议\n\n网络协议与 OSI 层一样，是一组行业标准规则和设计，用于在计算机和应用程序之间交换消息和数据。在任何关于 OSI 层的讨论中，你都直接或间接地提到与某一层相关的协议——最常用的协议是\
  \ IP、UDP、TCP、HTTP 等——以及它们所执行的重大功能。\n\n例如，你经常听到网络层和 IP 层这两个术语互换使用，并且人们会认为你所说的是该层及其相关协议，该协议包含并使用\
  \ IP 地址来将数据包从 A 点路由到网络中的 B 点。接下来的讨论将把 OSI 和 DARPA 层与其相关协议联系起来。\n\n## OSI 七层模型\n\n\
  当我们从第 1 层到第 7 层依次介绍 OSI 层时，我将概述每一层相关协议在 Wireshark 中如何显示，以及/或在网络硬件中如何使用。你通过这种方法形成的思维模型对于数据包分析来说应该是最准确、最有用的。\n\
  \n### 第 1 层 – 物理层\n\n物理层包含电气特性和机械标准，用于将数据位从计算机的网络接口卡（NIC）传输到交换机端口，或在交换机端口和路由器端口之间传输。你将在这一层遇到的最常见标准、术语和设备包括：\n\
  \n- **以太网**：这是一系列用于**局域网（LAN）** 的网络技术。\n- **RJ-45**：这是一种 8 针模块化连接器，位于铜质以太网电缆的两端，插入计算机上的\
  \ NIC、墙壁插座或交换机端口。\n- **Cat 5（Cat 5e 或 Cat 6）电缆**：这些是使用双绞铜线的以太网电缆。“Cat”代表电缆的类别，反映了其质量和数据传输速度能力。\n\
  - **100Base-T、1000Base-T 和 1000Base-LX**：这些代表特定的以太网标准。100Base-T 是使用 RJ-45 连接器的双绞线电缆上的\
  \ 100 Mbps，1000Base-LX 是光纤上的 1000 Mbps，依此类推。\n- **单模和多模光纤电缆**：它们使用固态 LED 或激光器发出的光脉冲来传输数据位。\n\
  \n用于将 NIC 连接到交换机的以太网标准也用于将交换机相互连接，以及将交换机连接到路由器或其他网络设备，尽管使用的电缆和连接器可能因电缆类型和速度而异。\n\
  \n还有其他常用的第 1 层标准，包括 802.11 无线、帧中继和 ATM；后两者用于长距离**广域网（WAN）**。\n\n### 第 2 层 – 数据链路层\n\
  \n数据链路层将来自物理层（通常是以太网）的原始比特组织成帧，这是你在 Wireshark 中看到的通常称为数据包的第一种表现形式。这一层是物理网络、电气/机械标准与用于在更高层中格式化、传输、接收和解码数据包数据的逻辑结构（协议）之间的分界线。\n\
  \n在 DARPA 参考模型中，OSI 的物理层和数据链路层合并为网络接口层。这一层（对于以太网 II 帧）的重要特性和功能包括：\n\n- **媒体访问控制（MAC）地址**：这些是\
  \ LAN 中使用的网络地址。它们是烧录在 NIC、交换机、路由器或其他网络设备端口/接口上的内存芯片中的 6 字节网络硬件地址：\n  - MAC 地址的前三个字节分配给了特定的制造商，并且可以与制造商关联。Wireshark\
  \ 有一个列表，可以将 MAC 地址显示为制造商代码和最后三个字节的组合。制造商为每个接口创建唯一的最后三字节地址，因此每个 MAC 地址在全球都是唯一的。（尽管\
  \ NIC 可能被编程为使用其他任意的 MAC 地址，这是为了恶意攻击而进行的 MAC 欺骗。但这是一个非常糟糕的主意，因为另一块网卡可能正在使用相同的地址，并可能导致数据丢失和一些非常混乱的数据包交换问题。）\n\
  \  - 以太网帧包含目标 MAC 地址和源 MAC 地址。MAC 地址用于在同一 LAN 上的计算机之间，或计算机与 LAN 上的路由器或其他设备端口之间交换（而非路由——我们稍后会做出区分）帧。\n\
  - **类型（或 EtherType）字段**：这表示下一个更高层协议（通常是 IP（0800）或 ARP（0806））。Wireshark 使用它来确定在数据包解码中应用的下一步协议解析器。\n\
  - **载荷**：这是以太网帧携带的数据包或数据报。\n- **帧校验序列**：这是一个 4 字节的**循环冗余校验（CRC）** 错误检测代码，根据帧中的所有位计算并添加到帧的末尾。它用于检测通常因电缆故障、外部电信号在电缆导线中引起的噪声等原因而损坏的帧。当接收到帧时，会根据收到的位重新计算此代码，并与\
  \ FCS 字段进行比较。然后丢弃坏帧。\n\n下图展示了以太网帧中各字段的布局：\n\n![](img/da40f92928403866599198344271d63e_74_0.png)\n\
  \n这里的一个关键点——这一点很重要——是以太网帧及其 MAC 地址只能在它们所属的局域网（LAN 和 IP 子网）上的设备之间传输帧。\n\n路由器通过其 IP\
  \ 子网（子网络）寻址形成 LAN 之间的边界。属于同一 IP 子网的所有设备都是同一 LAN 的一部分，而将数据包发送到不同子网或从不同子网接收数据包都需要路由器。\n\
  \n一旦帧进入路由器端口以路由到不同/远程网络，带有 MAC 地址和 FCS 的以太网帧就会被剥离并丢弃。帧内的载荷被路由到端口，并将离开该端口前往下一个设备；同时会创建另一个具有不同\
  \ MAC 地址和重新计算的 FCS 的帧来封装该数据包。然后该帧被传输到下一个目的地。\n\n在这一层工作的网络设备——通常是交换机——通常称为第 2 层设备或第\
  \ 2 层交换机。\n\n最后，你应该注意，第 2 层交换机可以支持多种网络增强功能，例如虚拟局域网（VLAN）和服务类别（CoS）标记，这是通过在 MAC 地址和\
  \ EtherType 字段之间添加一个 4 字节的 802.1Q 字段来实现的。你可能会在交换机之间看到这些帧（但不会在用户端口上看到）。\n\nVLAN 是一种第\
  \ 2 层解决方案，允许将交换机上的不同端口管理性地划分为独立的广播域。位于不同 VLAN 上的设备实际上彼此隔离，就像它们位于不同的物理网络上一样。如果交换机支持\
  \ VLAN 标记，VLAN 可以分散在多个交换机上，而无需为每个 VLAN 铺设单独的电缆。不同 VLAN 上的设备之间的通信通常需要使用路由器。\n\n在下面的\
  \ Wireshark 数据包详细信息截图中，以太网 II 帧的**目标**和**源** MAC 地址、**类型**（表示下一层协议为 IP）以及**帧校验序列**都被圈出，**帧**摘要也是如此。\n\
  \n### 注意\n\nWireshark 会显示每个帧的摘要，包括帧大小、捕获时间戳和帧间时间，以及其他有用的信息。这是 Wireshark 为帮助分析而计算的元数据，不属于捕获帧的一部分。\n\
  \n下面的截图突出显示了以太网帧的重要字段：\n\n![](img/da40f92928403866599198344271d63e_75_0.png)\n\n\
  ### 注意\n\nWireshark 在数据包详细信息窗格的任何区域提供的任何附加分析，如果是计算得出的或不是实际数据包内容的一部分，都将用方括号括起来。\n\
  \n### 第 3 层 – 网络层\n\n网络层（在 DARPA 模型中称为互联网层）主要根据目标 IP 地址处理数据包从源计算机到目标主机的路径上穿越网络或到达其他网络的路由。在这一层最常见的两种协议是互联网协议和地址解析协议。\n\
  \n#### 互联网协议\n\n这一层最常用的协议是 **互联网协议第 4 版（IPv4）**，它包含几个关键字段，用以完成数据包跨网络路由的任务。\n\n\n\
  \n\n\nnetworks:\n\n- **Differentiated Services (DiffServ):** 该字段支持对 IP 的一种增强，通常称为\
  \ **Quality of Service (QoS)**，允许对某些类型的流量（语音、视频等）进行分类，以便在网络拥塞时这些数据包可以获得优先处理。\n-\
  \ **Total length:** 这是数据包的总长度（不包括以太网 MAC 头）。\n- **Identification (IP ID):** 这是一个递增的数字，用于支持分片。\n\
  - **Flags:** 这些用于支持分片（将数据包分成两个或更多个较小的部分），以防大包需要被分成几个较小的包以穿越受数据包大小限制的链路。这些标志连同 IP\
  \ ID 字段值允许将分片的数据包正确重新组装成原始数据包。\n- **Fragment offset:** 如果 **Flag** 字段为 1（更多分片），则该字段中的值指示此分片数据包包含的片段相对于原始负载起始位置的偏移量，以字节为单位。\n\
  - **Time to Live (TTL):** 这是一个“跳数”或时间计数器，每当数据包经过路由器时都会递减。如果 TTL 达到零，数据包将被丢弃。主要目的是防止数据包永远存活并在发生意外路径环路时导致网络崩溃。\n\
  - **Protocol:** 这标识 IP 数据包负载中的协议。Wireshark 使用它来确定应用于数据包解码的下一个协议解剖器。\n- **Source\
  \ and destination IP addresses:** 这些是发送机器和最终目标机器的 IP 地址。IP 地址长 4 字节，以四个八位组（十进制编号\
  \ 0 到 255）用点分隔表示。\n\n在下面的屏幕截图中，重要的 IPv4 字段被圈出。这些是在该层进行数据包分析时你需要检查并熟悉的字段。\n\n![](img/da40f92928403866599198344271d63e_77_0.png)\n\
  \n## Address Resolution Protocol\n\n在网络层你还会看到的另一个协议是 Address Resolution Protocol\
  \ (ARP)，它用于设备在只知道另一设备的 IP 地址时获取该设备的 MAC 地址。\n\n在下面的 Wireshark 数据包详细信息屏幕截图中，请注意以太网帧目标\
  \ MAC 地址为广播（ff:ff:ff:ff:ff:ff），类型为 ARP（0x0806），并且该站已在其 ARP 协议发送方字段中提供了自己的 MAC 和\
  \ IP 地址（其他站监听并使用这些信息来构建 MAC 和 IP 地址表）。它提供目标设备的 IP 地址，并在目标 MAC 地址字段中填入全零。目标设备应返回一个类似的\
  \ ARP 数据包，地址指向请求方，并在发送方字段中包含其 MAC 地址。\n\n一个站只在以下情况下发送 ARP 请求：\n\n- 该站需要目标设备的 MAC\
  \ 地址，但未听到该站 MAC 地址的先前广播，或其 ARP 表已超时（ARP 条目仅保留一段时间）。\n\n- 该站需要目标设备的 MAC 地址，并且已根据目标的\
  \ IP 地址和自己的子网掩码计算出目标设备应在同一局域网上。否则，该站假设目标设备位于不同网络，并将第一个会话发起数据包发送到默认网关（路由器）。MAC 地址基于发送站默认网关配置设置中的条目。默认网关将把数据包转发到适当的出口端口以将其路由到目的地。\n\
  \n- 需要向远端网络发送数据包的站不知道其默认网关的 MAC 地址（例如，刚上电后）。\n\n下面的屏幕截图突出了 ARP 数据包的重要字段：\n\n![](img/da40f92928403866599198344271d63e_78_0.png)\n\
  \n该层使用的其他协议包括 Internet Control Message Protocol (ICMP)，它用于在设备之间发送网络错误消息，以及 Internet\
  \ Group Management Protocol (IGMP)，它用于主机和相邻路由器建立多播（一对多）组成员关系，以用于流媒体视频和游戏等网络应用。\n\
  \n## Layer 4 – the transport layer\n\n传输层，在 OSI 和 DARPA 模型中都如此称呼，负责通过端口号在应用程序之间或用户与应用程序之间在唯一会话中传输数据包。设备或用户的\
  \ IP 地址与其分配的端口号（称为套接字）的组合将与其他设备或用户的 IP 地址和端口号不同（在客户端）。\n\n如果数据包的源主机是服务器，则源端口很可能是标准应用程序和服务的众所周知的号码，例如\
  \ HTTP 的端口 80。\n\n传输层通常使用两种协议之一，User Datagram Protocol 或 Transmission Control Protocol，其中后者对大多数应用程序更为普遍。\n\
  \n## User Datagram Protocol\n\n**User Datagram Protocol (UDP)** 是一个相当简单的协议。它被认为是一种不可靠的传输，因为没有数据包交付或排序的保证，但它开销较低，并被时间敏感型应用如语音和视频流量以及网络服务应用如\
  \ DNS 所使用。\n\nUDP 头只有 8 字节长，由以下部分组成：\n\n- **Source and Destination port number:**\
  \ 各为 2 字节。\n- **Length:** 这是 UDP 头加上负载的长度。这是一个 2 字节字段。\n- **Checksum:** 这是用于检查 UDP\
  \ 头和数据的错误的 2 字节字段。如果发送方未生成校验和，则此字段为全零。\n\n下面的屏幕截图显示了 UDP 头中包含的字段：\n\n![](img/da40f92928403866599198344271d63e_79_0.png)\n\
  \n## Transmission Control Protocol\n\n与 UDP 不同，**Transmission Control Protocol (TCP)**\
  \ 通过检测丢失、重复或乱序的数据包、请求丢失数据的重传，或在交付给应用程序之前重新排列数据包的顺序来提供数据的可靠交付。TCP 还可以从应用程序接收一大块数据，并使用多个数据包可靠地处理数据的传输，并在另一端重新组装它们（UDP\
  \ 也可以，但不可靠；应用程序必须确定并从丢失的数据包中恢复）。\n\nTCP 头的内容和长度可能会根据使用的选项而变化，但在最简单的实现中，它由以下部分组成：\n\
  \n![](img/da40f92928403866599198344271d63e_81_0.png)\n\n## Layer 5 – the session\
  \ layer\n\n会话层处理在两个计算机之间的应用程序中设置、控制和结束会话。这不一定与例如 TCP 连接相同，尽管两者相关。应用程序会话可以跨越并存活多个网络连接。一个在该层运行的网络协议示例是\
  \ Network Basic Input/Output System (NetBIOS)。\n\n## Layer 6 – the presentation\
  \ layer\n\n表示层将传入和传出的数据从一种格式转换为另一种格式，并处理如果需要则进行加密/解密和/或压缩。表示层还负责向应用层交付和格式化信息以供进一步处理或显示。表示服务的示例是将\
  \ EBCDIC 编码的文本计算机文件转换为 ASCII 编码的文件。\n\n## Layer 7 – the application layer\n\n应用层可能（或可能不）执行与应用程序本身不同的功能，处理消息格式化、人机界面等。该层代表直接支持应用程序的服务，例如文件传输、数据库访问、电子邮件等的软件。\n\
  \n\n\n\n\n在许多广泛使用的应用中，表现层和应用层之间没有区分。例如，**超文本传输协议（HTTP）**通常被视为应用层协议，但它具有表现层方面的功能，例如能够识别字符编码以进行适当的转换，而该转换随后在应用层完成。\n\
  \n在 DARPA 模型中，OSI 模型的第 5-7 层被合并为应用层。从数据包分析的角度来看，顶层功能的特定表现形式和可见性（在 Wireshark 中）会根据所使用的应用和特定协议而有所不同。\n\
  \n下图总结了 OSI 和 DARPA 层，以及各种网络协议和服务如何与这些层以及彼此对齐：\n\n![](img/da40f92928403866599198344271d63e_82_0.png)\n\
  \n## 封装\n\n到目前为止，你可能已经注意到数据包将各种协议封装到连续的层中，就像剥洋葱一样。以太网帧包含数据报负载；该数据报是带有 IP 头部和负载的数据包。IP\
  \ 数据包负载由 TCP 头部和数据段组成，而数据段又可能包含 HTTP 头部和负载。这种封装在 Wireshark 的 **数据包详细信息** 面板中更容易可视化。\n\
  \n## IP 网络和子网\n\n在继续之前，对典型的 IP 子网术语和典型应用进行简要回顾，有助于澄清本书中使用的术语，并为已熟悉 IP 地址的人员提供复习。\n\
  \n在图表或设备配置中，在网络 IP 地址后放置的 /24 设计符是无类别域间路由（CIDR）设计符，表示如下：\n\n- 在 4 字节 IP 地址的 32 位中，前\
  \ 24 位代表该网络上任何 IP 地址的网络部分。该网络被指定为 10.1.1.0（下一个 /24 网络将是 10.1.2.0，然后是 10.1.3.0，依此类推）。\n\
  - 32 位地址的最后 8 位可用于为工作站、主机和其他设备分配 IP 地址，但有以下例外：\n  - 该网络上的第一个主机地址被保留为构建路由表的网络标识符：10.1.1.0（通常称为环回地址）\n\
  \  - 该网络上的最后一个主机地址被保留为 IP 广播地址：10.1.1.255\n\n  8 位二进制值等于 256 十进制，减去前述两个例外。这留下了 254\
  \ 个可用的 IP 地址供设备使用，从 10.1.1.1、10.1.1.2 开始，一直到 10.1.1.254。\n\n- 另一种表达子网掩码的方式是点分十进制格式，255.255.255.0，这再次表示\
  \ IP 地址的前 24 位是网络，后 8 位用于主机。\n- 有 A 类、B 类和 C 类地址范围，以及作为私有地址保留供组织内部使用的 IP 范围子集。\n\
  \n下表显示了三个主要类别中的 IP 地址范围：\n\n| IP 地址类别 | 起始 IP 地址 | 结束 IP 地址 |\n| --- | --- | ---\
  \ |\n| A | 1.0.0.0 | 126.255.255.255 |\n| B | 128.0.0.0 | 191.255.255.255 |\n| C\
  \ | 192.0.0.0 | 223.255.255.255 |\n\n下表显示了私有 IP 地址范围：\n\n| 私有 IP 地址类别 | 起始 IP 地址\
  \ | 结束 IP 地址 |\n| --- | --- | --- |\n| A | 10.0.0.0 | 10.255.255.255 |\n| B | 172.16.0.0\
  \ | 172.31.255.255 |\n| C | 192.168.0.0 | 192.168.255.255 |\n\n- 子网掩码可以配置为允许每个子网有更多或更少的主机，并相应地在大型组织内构建多个网络时进行网络地址数量的权衡。\n\
  \n对 IP 地址和子网划分的更深入回顾超出了本书的范围。如果你不熟悉这些概念，建议进行一些额外的学习，因为对 IP 子网划分的扎实理解对于大多数分析活动至关重要。\n\
  \n## 交换和路由数据包\n\n到目前为止，我们已经涵盖了讨论数据包如何从计算机 A 跨越局域网和/或广域网路由到主机 B 所需的主题，距离可能从房间内到全球各地。需要记住的重要概念是，以太网帧通过交换机工作，IP\
  \ 数据包通过路由器工作来实现这一壮举，我们将在下一节中介绍。\n\n### 以太网帧和交换机\n\n为了重申在第 2 层（数据链路层）讨论中概述的内容，以太网帧根据目标\
  \ MAC 地址从入口端口切换到适当的出口端口。网络交换机构建哪些 MAC 地址属于每个端口的表，将帧的目标 MAC 地址与这些表进行比较，如果目标在同一交换机上，则将帧切换到适当的出口端口，否则通过中继端口切换到另一台交换机或路由器。\n\
  \n请注意，交换机第一次看到不认识的目标 MAC 地址时，它会将数据包（通常是 ARP 数据包）发送到所有端口，直到有设备响应并将其新的 MAC 地址添加到其可内容寻址内存（CAM）表中，该表将\
  \ MAC 地址映射到特定端口。\n\n发往远程网络的数据包会被发送到默认网关端口 MAC 地址。如果你查看 Wireshark 中会话表以太网选项卡中的 MAC\
  \ 地址列表，并看到某个地址的流量量明显高于其他站点，这很可能是一个默认网关（路由器）端口 MAC 地址。该端口是进入/离开此局域网到/来自其他网络的通道。\n\
  \n在任何给定的局域网中，你都会看到工作站、服务器和路由器生成 ARP 和域名系统（DNS）请求：\n\n- ARP：用于将 IP 地址解析为 MAC 地址\n\
  - DNS：用于将主机名解析为 IP 地址\n\n在下图中，有两台用户工作站和一台服务器，它们连接在 10.1.1.0/24 IP 网络的局域网上。一台路由器连接到该网络，该路由器具有通往另一地点的广域网链路。\n\
  \n![](img/da40f92928403866599198344271d63e_88_0.png)\n\n以下两个场景利用此图示来展示 MAC 地址如何用于在局域网中交换以太网帧：\n\
  \n- MAC 地址为 B 的工作站想要使用刚刚加电，所有网络设备都不知道的服务器 Venus 上的应用程序。工作站知道 Venus 的 IP 地址，因为该 IP\
  \ 地址已预先配置在客户端应用程序中，但它不知道服务器的 MAC 地址。\n\n  工作站广播一个 ARP 数据包，其中发送方为其自己的 MAC 和 IP 地址，目标字段中为\
  \ Venus 服务器的 IP 地址和全部为零的 MAC 地址。Venus 服务器以包含其 MAC 地址 C 的 ARP 响应进行回复。\n\n  工作站随后使用服务器的\
  \ MAC 地址作为以太网帧中的目标 MAC 向服务器发送会话发起数据包。\n\n  这些以太网帧经过交换机 3，该交换机通过观察 ARP 会话学习了两个设备的\
  \ MAC 地址。局域网中的其他交换机在工作站 B 广播其 ARP 数据包时学习了工作站 B 的 MAC 地址（因为交换机 3 将此 ARP 数据包发送到所有端口），但未学习服务器的\
  \ MAC，因为服务器直接响应了 B。\n\n- MAC 地址为 A 的工作站现在也想使用服务器 Venus 上的应用程序。它也不知道服务器的 MAC 地址，因此也发送\
  \ ARP 请求，交换机 2 将其广播到所有端口，交换机 1 和交换机 3 也会这样做，因为交换机只查看 MAC 地址，而任何 ARP 请求的目标 MAC 地址都是\
  \ **ff:ff:ff:ff:ff:ff**，因此每个交换机都必须将广播帧发送到所有端口。\n\n  然而，当服务器 Venus 使用 A 的 MAC 地址响应\
  \ A 的 ARP 数据包时，路径中的每个交换机都已学习到它在哪个端口看到 A 的 MAC 地址进入。因此，每个交换机只将 Venus 的响应发送到返回工作站\
  \ A 的适当端口。对于已学习的非广播帧也是如此。如果交换机不识别非广播帧的目标 MAC 地址，则第一次也会将其发送到所有端口。\n\n随着交换机 CAM 表被\
  \ MAC 地址及其关联端口填充，必须发送到局域网中每个设备的帧数量以及所有这些设备的负载会显著减少。\n\n\n\n\n\n## IP 地址和路由器\n\n\
  当数据包需要离开局域网前往远程 IP 网络时，就需要路由器根据目的 IP 地址对数据包进行路由。以下场景（仍参考前面的截图）说明了在一种可能情况下涉及的一些细节。\n\
  \n工作站 A 现在想要使用位于与之前场景不同网络上的服务器 Mars 上的一个应用程序。在这种情况下，工作站 A 不知道服务器的 IP 地址；它只需要其名称。工作站\
  \ A 将向其网络设置中配置的 DNS 服务器 IP 地址发送一个 DNS 请求数据包，主机名为 Mars；DNS 服务器（此处未显示）将返回 Mars 的 IP\
  \ 地址 10.1.2.25。工作站 A 通过将其 IP 地址和子网掩码与 Mars 的 IP 地址进行比较，计算出该主机不在其自己的网络上，因此它将会话发起数据包发送到路由器\
  \ 1，该路由器在其网络设置中被配置为其默认网关。我们假设工作站 A 已经通过之前的 ARP 交换知道了路由器 1 端口的 MAC 地址，以便从给定的 IP 地址找到路由器\
  \ 1 的 MAC 地址。\n\n当路由器收到发送到路由器端口 MAC 地址的 A 的帧时，它会检查 IP 头部中的目的 IP 地址并查找适当的端口以转发数据包。此路由过程由路由器从其他路由器广播的路由信息构建的路由表条目支持；每个路由器都会告诉其他所有路由器它知道通往哪些网络的路由。\n\
  \n在这种情况下，围绕 A 数据包的以太网帧被剥离，剩余的有效载荷（数据包）通过广域网链路发送到路由器 2，后者也会检查 IP 头部目的 IP 地址并查找正确的端口以转发数据包。路由器\
  \ 2 将数据包封装在新的以太网帧中，其源 MAC 地址为其自身的 X，目的 MAC 地址为 Mars 服务器的 Y 地址（假设路由器已在其 MAC 表中已有服务器），并将数据包传输到局域网上，以便交换到\
  \ Mars 服务器，如下图所示：\n\n### WAN 链路\n\nRouter 2\nMAC X\nIntf Fa/0 IP 10.1.1.1/24\n\n\
  Switch 20\nMgmt IP 10.1.1.5\n\n### NETWORK\n10.1.1.0/24\n\nSwitch 25\nMgmt IP 10.1.2.10\n\
  \nHOST 'Mars'\nMAC Y\nIP 10.1.1.25\n\n![](img/da40f92928403866599198344271d63e_91_0.png)\n\
  \n## 无线网络\n\n无线网络利用一系列 802.11 规范，通过 2.4 或 5 GHz 频段以多种速度提供连接。无线帧与有线网络上的帧之间的显著区别如下：\n\
  \n- 无线网络采用载波侦听（每个站点都在监听）、多址接入（共享介质）和冲突避免（避免冲突而不仅仅是恢复冲突）技术，这会降低吞吐量\n- 除了转发到有线网络的数据帧外，无线帧类型还包括以下内容：\n\
  \  - **管理帧：** 用于身份验证和关联任务\n  - **控制帧：** 控制共享介质上的发送/接收功能以帮助避免冲突\n\nWireshark 可用于在无线网络上捕获和分析数据包。然而，为了分析控制和管理帧，以及在无需关联到特定频道的情况下选择要捕获的无线电频道，需要专用适配器。这些适配器可从各种网络供应商处获得。\n\
  \n这些无线适配器及其驱动程序使 Wireshark 能够在 **Packet Details** 窗格中帧头下方显示一个伪头部，其中包含有关以下内容的信息：\n\
  \n- **数据速率：** 这是无线电频道上可能的最大数据传输速率\n- **频道频率：** 这是站点正在使用的射频频道频率\n- **频道类型：** 这是使用的\
  \ 802.11 协议，常见类型为 a、b、g 和 n\n- **射频信号和噪声电平：** 这是接收到的射频信号强度和背景噪声电平；两者之间的差异越大，信号解码效果越好\n\
  \n请记住，在分析无线网络时，无线接入点利用有线局域网连接连接到网络的其余部分，这可能需要单独分析。接入点剥离 802.11 头部并将数据包封装在以太网帧中，然后在有线网络上传送数据包。\n\
  \n以下屏幕截图说明了典型的 **Radiotap Header** 和\n\n**IEEE 802.11 帧** 的内容；请注意 **Data Rate**、**Channel\
  \ frequency** 和 **Signal/Noise** 值：\n\n![](img/da40f92928403866599198344271d63e_94_0.png)\n\
  \n### Note\n\n有大量参考资料和书籍可供阅读，以了解有关网络和网络协议的更多信息。其中一个经典来源是 TCP/IP Illustrated Volumes\
  \ I, II, and III, W. Richard Stevens, Addison-Wesley Professional，可在线或以书籍格式获得。\n\
  \n## Summary\n\n本章涵盖的重要内容包括如何根据目的 MAC 地址将以太网帧交换到局域网上适当交换机端口，以及如何根据目的 IP 地址将数据包路由到远程网络，以及如何将发往远程网络的帧根据目的\
  \ IP 地址发送到默认网关端口 MAC 地址。\n\n我们还介绍了如何以及为什么较慢和/或距离更远的广域网链路会给数据包传输带来大量延迟，从而减慢应用程序数据交换并增加用户响应时间。我们通过讨论\
  \ Wireshark 如何使用专用适配器在 802.11 无线网络上捕获和分析数据包结束了本章。\n\n在下一章中，我们将详细介绍如何使用 Wireshark\
  \ 捕获和过滤数据包。\n"
- '## Chapter 3. Capturing All the Right Packets


  为了分析以排除连接、性能或安全问题，您必须成功捕获所有正确的数据包，然后识别并过滤掉与当前目标相关的仅数据包。


  在本章中，我们将涵盖以下主题：


  - Picking the best capture point

  - TAPs and switch port mirroring

  - Wireshark''s capture interfaces, filters, and options

  - Verifying a good capture

  - Isolating the conversation(s) of interest

  - Using the Wireshark Conversations window

  - Wireshark''s display filters

  - Filtering expression buttons

  - Following TCP/UDP/SSL streams

  - Marking and ignoring packets

  - Saving filtered traffic


  您会认识到，其中许多活动与我们在第 1 章《Getting Acquainted with Wireshark》中完成以执行捕获并过滤仅涉及加载网页的数据包的活动相同。在本章中，我们将扩展并完成在所有这些主题方面的技能。


  ## Picking the best capture point


  确定执行数据包捕获的最佳位置取决于以下几个因素：


  - 调查问题的性质

  - 在提供最高分析有用性的位置执行捕获的相对能力

  - 在给定位置执行捕获所需的技术难度、风险和时间


  ### User location


  如果您正在排查用户投诉，第一个捕获点应位于用户工作站，以从用户角度获得视图并验证/澄清用户报告的情况。从这个角度，您可以：


  - 确保基本网络服务如 ARP 和 DNS 正常工作

  - 如果用户身份验证涉及与目标应用程序服务器不同的设备，则分析初始登录过程

  - 测量从用户到目标主机（s）的网络往返时间

  - 确定 TCP 会话设置握手是否适合所访问的应用程序

  - 测量服务响应时间（如 HTTP 或 SMB 响应时间）

  - 确定用户是否遇到数据包丢失和重传、乱序数据包或其他网络相关异常

  - 捕获发送给用户的任何应用程序错误消息以及导致这些错误请求的请求


  从用户位置捕获在实践上通常要简单得多，并且流量要少得多，这使得捕获大小更小，过滤感兴趣的数据包更简单。断开用户以太网电缆几分钟以插入 TAP（我们将在下一节讨论这些）或在用户工作站上安装
  Wireshark 通常不需要特殊授权或准备，因为对其他用户的风险可以忽略不计。






  ## 服务器位置


  如果无法或不切实际地从投诉用户的 workstation 获取捕获，从服务器端获取捕获仍然是有用的，但可能有优势应用捕获过滤器来仅收集与用户 workstation
  之间（基于用户 IP 地址）的流量，以限制捕获文件大小。你仍然可以测量网络往返时间、服务器响应时间、分析 TCP 握手细节，并检测由丢包引起的重传，并且可能从此位置观察到登录/身份验证过程。


  从服务器位置捕获在分析后端服务响应时间时也是合适的。例如，如果用户与应用服务器交互，但该应用服务器为了满足用户请求而与后端数据库进行事务处理，并且存在响应时间缓慢的投诉，那么对应用服务器到数据库服务器交互的分析可以帮助将性能不佳的真正来源隔离到其中一台主机，以及导致缓慢或错误响应的请求类型。


  ![](img/da40f92928403866599198344271d63e_101_0.png)


  - **代理服务器和防火墙**：此类设备可以充当希望使用其他（通常是外部）服务器资源的客户端之间的中间人。这些设备最常部署在公司内部用户与通过互联网访问的外部（Web）服务之间。这些设备因其安全功能而被采用，允许对可以访问的内容和可以在两个网络之间中继的数据内容类型进行管理控制、恶意软件扫描等。从数据包分析的角度来看，你应该意识到，除了执行
  NAT/PAT 功能外，这些设备的某些实现实际上可能在一侧终止用户会话，并在另一侧代表用户在设备与外部主机之间发起完全不同的会话，使得 TCP 握手和会话参数、IP地址和端口号以及数据包大小在两侧都可能不同。

  - **使用通用路由封装的 IP 隧道**：这些用于连接两个否则没有原生路由路径的 IP 网络。原始数据包被封装在具有不同 IP 地址的包内，适用于它们将穿越的网络媒体。IP
  隧道最常见的用途是通过公共互联网连接将私有企业网络连接在一起，或通过传统的 IPv4 网络路径将 **Internet Protocol Version 6 (IPv6)**
  网络连接在一起。IP 隧道可以在路由器和高端交换机之间配置。


  尽管可能有必要（为了向其他支持团队验证问题）或更实际地在前面所述设备的接口处或附近进行捕获，但通常在用户和/或服务器位置进行捕获更容易且同样有效。除非你是网络支持团队的一员，否则你不必在如此高级和复杂的环境中进行分析。


  ## 测试访问端口和交换机端口镜像


  如果你从用户位置捕获并且无法或不希望在用户机器上安装 Wireshark，或你在网络中的其他位置捕获，你有两个选项来获取流经网络的数据包副本：测试访问端口或交换机端口镜像。


  ### 测试访问端口


  **Test Access Port (TAP)** 是一种设备，它将流经它的所有数据包复制到一个或多个监控端口。安装了 Wireshark 的工作站可以连接到其中一个监控端口以捕获数据包。


  你应选择一个支持所分析网络端口链路速度（通常为 100 Mbps 或 1 Gbps）的聚合 TAP，并且会复制并合并双向流动的数据包（来自用户工作站的发送数据和来自网络的接收数据）；聚合
  TAP 将流量汇聚到单个连接（发送到 Wireshark 工作站），以便你可以使用 Wireshark 工作站上的单个网络接口捕获双向流量。请注意，由于你将来自两个方向的数据包复制到
  Wireshark 工作站的一个管道中，如果流量速率极高，监控端口可能会过载。如果发生这种情况，多余的数据包将被丢弃。在用户工作站处过载通常不是问题，但对于交换机中继或其他高流量区域可能是问题。


  下图说明了 TAP 如何插入在用户工作站与其工作站交换机端口之间，以及 Wireshark 工作站如何连接以捕获数据包：


  ![](img/da40f92928403866599198344271d63e_104_0.png)


  ### 交换机端口镜像


  交换机端口镜像，也称为 **Switched Port Analyzer (SPAN)** 功能或跨接端口，是配置网络交换机执行与 TAP 相同功能的做法：复制指定端口进出的数据包并将其发送到一个通常未使用的监控端口，在该端口上连接
  Wireshark 工作站以捕获数据包。


  使用端口镜像的优点是无需中断连接以插入 TAP。监控端口可以由交换机管理员轻松配置，也可以同样轻松地禁用。


  此选项的潜在问题包括并非所有交换机都支持端口镜像，并且有证据表明使用此功能可能会影响交换机的性能，至少对于被监控的端口而言。端口镜像也存在监控端口因发送加接收流量水平过高而过载的可能性，就像使用
  TAP 时一样，这在监控到其他交换机的交换机中继时很可能发生，因为这些中继承载着多个用户的流量。


  下图是交换机上端口镜像场景的简单说明。工作站端口的进出数据包被复制到 Wireshark 工作站连接的端口。


  ![](img/da40f92928403866599198344271d63e_107_0.png)


  ## 在高流量速率链路上捕获数据包


  如果需要在高流量速率链路上捕获数据包，例如大型交换机之间的中继链路，Wireshark 可能不是最佳解决方案。它可能无法跟上繁忙链路的节奏。Wireshark
  实际上是一个调用名为 **dumpcap** 的命令行可执行文件的 GUI 工具，该工具捕获数据包并将其保存到磁盘文件。Wireshark 读取此文件并将处理后的数据包呈现给用户界面。Wireshark
  的替代方案是直接使用 dumpcap 或 **tcpdump** 可执行文件（这些在 [Chapter 8](Chapter 8) 中介绍，命令行和其他实用工具）或众多厂商提供的高速捕获设备。


  ## 捕获接口、过滤器和选项


  使用 Wireshark 捕获数据包包括选择正确的网络接口以从中捕获数据包，应用可能适当的捕获过滤器，并应用正确的选项以按所需方式完成捕获。我们将在以下各节中介绍这三个主题。


  ### 选择正确的网络接口


  如第 1 章《Getting Acquainted with Wireshark》中所述，如果你的机器上有多个网络接口，你需要确定并选择正确的接口来捕获数据包。在
  Wireshark 的捕获菜单中，单击接口或单击图标栏上的第一个图标。


  Wireshark 捕获接口窗口提供机器上网络接口的列表和描述、分配的 IP 地址，以及每个接口的总数据包和每秒数据包计数器。如果接口分配了 IPv6 地址并且正在显示，你可以单击该地址以切换并显示
  IPv4 地址。


  以下屏幕截图说明了典型的捕获接口窗口，列出了 LAN 和无线接口以及它们的 IP 地址和数据包计数器：


  ![](img/da40f92928403866599198344271d63e_109_0.png)


  捕获接口窗口提供以下两个选项：


  - 对任何列出的接口单击详细信息按钮将打开一个接口详细信息窗口，提供可用于验证接口操作的各种信息。链路和链路速度信息的状态显示在特性选项卡中，所选 NIC 的
  MAC 地址显示在 802.3（以太网）选项卡中。

  - 其余捕获选项在捕获选项窗口中配置，可通过在捕获接口窗口中单击选项按钮，或从捕获菜单中选择选项，或单击图标栏上的第二个图标来打开。


  以下屏幕截图说明了典型的捕获选项窗口，其中包含一个数字



  所指定的选项。您可以参考它以获取有关**捕获选项**主题的示例。


  ![](img/da40f92928403866599198344271d63e_110_0.png)


  如上面的截图所示，**捕获选项**窗口显示可用的接口及其 IP 地址，并允许您选择一个或多个这些接口来执行捕获。Wireshark 可以同时从多个接口以及虚拟接口进行捕获。从**捕获接口**窗口开始的主要优势在于可以使用数据包计数器来帮助识别活动接口，这是**捕获选项**窗口所不具备的功能。


  否则，如果您知道要使用哪个接口，则可以跳过**捕获接口**窗口，直接从这里开始。


  单击**捕获选项**窗口中的**管理接口**按钮，会打开**接口管理**窗口。在**本地接口**选项卡中，您可以选择隐藏不希望显示在**捕获接口**和**捕获选项**窗口中的接口。


  有一个选项可以快速启用**在所有接口上捕获**，还有一个默认启用的**在所有接口上使用混杂模式**选项。在大多数情况下，应保持启用此选项，以便所选接口能够捕获并保存所有可见的数据包。否则，只有发送到
  Wireshark 工作站 MAC 地址的数据包、广播数据包和/或多播数据包才会被看到并捕获，这基本上否定了它作为捕获设备的用途。**编译所选 BPF** 按钮提供编译后捕获过滤器的机器语言显示，但没有其他功能用途。


  ## 注意


  **捕获过滤器**字段具有高亮功能，用于指示过滤器语法是否有效。绿色背景表示有效的过滤器，红色背景表示无效或不完整的过滤器。


  ## 使用捕获过滤器


  捕获过滤器用于减少数据包捕获期间保存的流量数量。在实践中，捕获过滤器应尽量少用（如果确实要用的话），以确保不会因为数据包不在捕获过滤器参数范围内而无意中遗漏对分析重要的数据包。请记住，您随时可以从捕获中过滤掉不需要的流量，但一旦捕获完成，对于错过的数据包您就无能为力了。如果您对捕获没有把握，请使用更宽松的捕获过滤器或完全不使用过滤器重新执行捕获。


  适合使用捕获过滤器的一种场景是当您希望让捕获运行较长时间时。此时，您应尽可能过滤掉无关流量，以控制捕获文件的大小。但是，请注意确保您应用的捕获过滤器不会排除任何可能对分析有用的流量。


  在使用捕获过滤器时，通常最好先进行一些试捕获，以验证过滤器是否按预期工作，然后再进行您想要保留的正式捕获。


  ## 配置捕获过滤器


  Wireshark 提供了一个**捕获过滤器**窗口，可以轻松选择预配置的捕获过滤器，您也可以根据自己的需要配置自定义过滤器。


  单击**捕获选项**窗口中的**捕获过滤器**按钮，打开**捕获过滤器**窗口。在此窗口中，您可以从多个有用的预配置捕获过滤器中进行选择，根据自己的目的创建新的唯一捕获过滤器，或删除不需要或错误的过滤器。创建新过滤器只需为过滤器命名、输入捕获过滤器语法、单击**新建**保存过滤器，最后单击**确定**即可。或者，您可以单击现有过滤器，再单击**新建**，这将在列表底部创建该过滤器的副本，然后您可以根据自己的目的进行修改。


  以下截图展示了一个典型的**捕获过滤器**窗口。在本例中，选择了一个仅允许与特定以太网 MAC 地址进行通信的捕获过滤器：


  ![](img/da40f92928403866599198344271d63e_113_0.png)


  Wireshark 的捕获过滤器使用一种称为**伯克利数据包过滤器（BPF）**格式的语法，该格式起源于 Unix 领域，至今仍用于数据包级驱动程序。请注意，Wireshark
  中用于捕获过滤器的语法与用于显示过滤器的语法有很大不同。


  **捕获过滤器**窗口中的默认捕获过滤器选择有助于提供捕获过滤器语法的示例。下表列出了一些额外的捕获过滤器语法示例及相应示例：


  | 描述 | 语法 | 示例 |

  |---|---|---|

  | 按以太网 MAC 地址过滤 | `ether host xx:xx:xx:xx:xx:xx` | `ether host 00:1c:25:99:db:85`
  |

  | 仅捕获来自或发往某个 MAC 地址的流量 | `ether src or ether dst` | `ether src 00:1c:25:99:db:85`
  |

  | 按 IP 地址或主机名过滤 | `host xxx.xxx.xxx.xxx` | `host 192.168.1.115`<br>`host www.wireshark.org`
  |

  | 仅捕获两个 IP 地址之间的流量 | `src host and dst host` | `host 192.168.1.115 and host 10.1.1.125`
  |

  | 仅捕获两台主机之间单向的流量 | `src host ... and dst host ...` | `src host 192.168.1.115 and
  dst host 10.1.1.125` |

  | 按端口号过滤 | `port, dst port, and src port` | `port 53` |

  | 过滤 DNS 数据包 |  | `port 67` |

  | 过滤 DHCP 数据包 |  |  |

  | 按协议过滤 | `arp, icmp, ip, udp, tcp, http, ipv6, and icmp6` | `http` |

  | 仅过滤 HTTP 流量 |  |  |

  | 捕获过滤器逻辑运算符 | `=, !=, >, <, >=, <=, !, not, &&, and, ||, or` | `not arp and port
  not 53`<br>`! arp && port ! 53` |

  | 排除 ARP 和 DNS 数据包的过滤器 |  |  |


  更多关于捕获过滤器的信息和示例可以在 Wireshark 维基网站 [http://wiki.wireshark.org/CaptureFilters](http://wiki.wireshark.org/CaptureFilters)
  上找到，协议特定的捕获过滤器语法包含在 [http://wiki.wireshark.org/ProtocolReference](http://wiki.wireshark.org/ProtocolReference)
  的参考信息中。


  ## 捕获选项


  **Wireshark 捕获选项**窗口提供了多种控件，用于根据特定需求配置捕获。


  ### 捕获文件名和位置


  单击**文件**选项上的**浏览**按钮，您可以导航到选定的目录，在其中存储捕获文件，并为捕获文件输入文件名。


  使用**文件**选项时，Wireshark 会在您指定的文件名后附加文件编号和日期时间戳，并且不会提供文件扩展名。您应在文件名中指定 `.pcapng` 扩展名。通过示例可以更好地说明这一点。


  用户提供的目录和文件名为 `C:\Wireshark\long_capture.pcapng`，Wireshark 将以 `C:\Wireshark\long_capture_00001_20140724132952.pcapng`
  的格式创建并保存数据包文件。


  如果将 Wireshark 配置为捕获到多个文件（稍后将讨论），文件编号和日期时间戳将随着捕获的进行而相应递增，例如 `long_capture_00002_20140724133343.pcapng`
  和 `long_capture_00003_20140724133612.pcapng`。


  ### 多文件选项


  可以将 Wireshark 配置为将数据包保存到多个文件以进行长期捕获，并提供多个选项来控制如何实现这一点。


  选择**使用多个文件**选项后，随着特定选项的启用，相应的底层控件将变为活动状态。您可以选择在每个文件达到指定大小和/或经过可配置的时间段后开始一个新（下一个）文件。


  ### 注意


  当处理远大于 100 MB 的捕获文件时，Wireshark 可能会变得非常缓慢甚至崩溃，因此您应将此视为一个合理的最大文件大小。


  ### 环形缓冲区






  **Ring buffer** 选项与 **Next File every** 选项配合使用，可使 Wireshark 填充指定数量的文件，并在捕获继续进行时删除最旧的文件。


  此功能在等待某些间歇性问题或事件发生时很有用，在此之后捕获会手动停止。环形缓冲区文件提供了在停止捕获之前的某个时间段的历史捕获数据，而不会用过多的大型捕获文件填满硬盘。


  ## Stop capture options


  Wireshark 具有在达到指定数据包数、文件大小或时间段后自动停止捕获的选项。如果启用了 **Use multiple files** 选项，则可以使用在达到指定文件数后停止捕获的选项。否则，捕获可以在达到指定数据包数、文件大小或时间段后停止。


  ## Display options


  **Update list of packets in real time** 选项指定 Wireshark 在捕获过程中定期读取正在写入的捕获文件并相应地更新
  **Packet List** 内容。否则，在捕获期间 Wireshark 用户界面将被置灰。


  **Automatically scroll during live capture** 选项指定 Wireshark 更新并在 **Packet List**
  面板中显示最新捕获的数据包，使得数据包在列表更新时似乎向上滚动。此选项需要启用 **Update list of packets in real time**
  选项才能发挥作用。


  这两个选项都有处理时间成本，可能导致数据包丢失和/或显示迟缓，如果在非常繁忙的链路上进行捕获，应将其禁用。但是，在捕获期间查看和确认预期的包流是否正在发生的能力将会丢失。


  **Hide capture info dialog** 选项（默认启用）控制在捕获期间是否显示一个简单的窗口，该窗口按协议显示数据包计数和百分比。除非特别需要，最好将此窗口保持隐藏。


  ## Name resolution options


  如果启用了 **Resolve MAC addresses** 选项，则会导致 Wireshark 使用分配的制造商代码显示 MAC 地址，而不是前三个八位字节。例如，Wireshark
  将显示 **CiscoCon_21:b7:ec** 而不是 **c8:d7:19:21:b7:ec**。制造商代码列表保存在 Wireshark 安装目录的 `manuf`
  文件中。


  **Resolve network-layer names** 选项与 **Use external network name resolver** 配合使用，以确定捕获的
  IP 地址如何解析为主机名，具体如下：


  - **Resolve network-layer names** 选项指定 Wireshark 应尝试将 IP 地址解析为主机名。如果启用了 **Use external
  network name resolver** 选项，Wireshark 将对每个唯一的 IP 地址执行反向 DNS 查找。这会导致 Wireshark 生成自己的流量。

  - 如果禁用了 **Use external network name resolver** 选项，Wireshark 将尝试使用用户提供的 `hosts` 文本文件解析
  IP 地址（使用典型的 IP 地址 `<tab>` 主机名语法），该文件位于使用默认配置文件时的 Wireshark 安装目录中，或使用自定义配置文件时位于相应的配置文件目录中。


  在捕获期间，最好将 **Resolve network-layer names** 选项保持禁用状态，以便 Wireshark 在捕获期间尝试解析 IP 地址时不会创建额外的网络流量。此功能在捕获完成后始终可以临时启用（通过从菜单导航到
  **View | Name Resolution | Enable for network layer**）。


  如果启用了 **Resolve transport-layer name** 选项，则会导致 Wireshark 在 **Packet List** 面板的 Info
  显示字段中显示人类可读的、端口和协议特定的服务名称，而不是端口号。例如，TCP 端口 80 将显示为 HTTP。端口号服务的列表保存在 Wireshark 安装目录中的
  `services` 文件中。


  本节开头的屏幕截图说明了一个设置为使用 LAN 接口的 **Capture Option** 窗口，使用过滤器仅捕获到特定以太网 MAC 地址和来自该地址的流量，以在环形缓冲区场景中保存最多五个每个
  100 MB 的文件，并将这些文件保存到提供的目录中，使用特定的前导文件名和扩展名。**Display Options** 和 **Name Resolution**
  选项已保持其默认设置。


  一旦选择了所有所需的 **Capture Options**，单击 **Start** 按钮将开始捕获。


  在涵盖了所有最有用的 **Capture Options** 功能之后，现在可能是告诉你正确的时候，对于你进行的许多捕获，尤其是从相对低流量量的位置（如用户工作站）进行的捕获，你不需要也不需要设置任何捕获选项（除捕获的适当接口外），并且可以通过单击图标栏上的第三个（绿色鲨鱼鳍形）图标或从
  **Capture** 菜单中选择 **Start** 来使用所有默认值直接开始捕获。不使用捕获过滤器允许你捕获所有相关数据包——不会遗漏任何内容——并在捕获完成后使用显示过滤器过滤掉不需要的流量。


  ## Verifying a good capture


  捕获完成后，你应该滚动并检查 **Packet List** 面板中的数据包，以确保你看到的是预期的流量——通常是到特定主机和来自特定主机的流量。


  你还应确保没有丢弃的数据包，这将在 Wireshark 用户界面底部中央的 **Status Bar** 中的 **Packet Information** 部分显示。丢弃的数据包表明
  Wireshark 或所选的 NIC 无法跟上流量量，不得不丢弃数据包，这当然会影响分析的质量。如果出现丢弃的数据包，你可能需要使用性能更高的工作站进行捕获或选择较低流量量的捕获位置。


  ## Saving the bulk capture file


  在完成并验证了良好的捕获后，你应该将批量（所有捕获的数据包）捕获文件（假设为单个文件捕获）保存到你选择的目录。你稍后将过滤并将数据包子集保存到较小的文件中，但能够在以后分析时重新加载原始捕获文件是有利的，如果你发现自己可能无意中过滤掉了比想要更多的包。


  使用 **File** 菜单中的 **Save As** 选项，导航到你选择的目录并为文件命名。如果未指定文件扩展名，Wireshark 将根据所选的 **Save
  as type** 选项附加文件扩展名；默认是 `.pcapng` 格式。但是，如果你打算与使用不同协议分析工具的人共享捕获文件，你可以将文件保存为几种其他流行的特定于供应商的格式。


  如果使用多个文件和/或环形缓冲区捕获选项保存了多个文件，请导航到 **File | File Set | List Files** 以选择并打开其中一个文件。


  ## Using the Conversations window


  使用 **Conversations** 窗口的基础知识已在 [Chapter 1](Chapter 1) 的第一次捕获中介绍，Getting Acquainted
  with Wireshark。在本节中，我们将介绍 **Conversations** 窗口的几个其他便捷功能。


  ### The Ethernet tab


  **Conversations** 窗口在 **Ethernet** 选项卡中表现出特定的行为，具体取决于可用的 **Name Resolution** 设置。如果在
  **View** 菜单中可以找到的 **Name Resolution** 菜单中启用了 **Enable for Network Layer**，并且 **Conversations**
  窗口中也启用了 **Name Resolution**，则与给定设备的 MAC 地址关联的 IP 地址将显示为 IP 地址而不是 MAC 地址。在这种情况下切换
  **Name Resolution** 选项对于轻松关联设备的 IP 地址与其 MAC 地址很有用。


  如果未启用 **Enable for Network Layer** 选项，则 **Conversations** 窗口中的 **Name Resolution**
  选项控制 MAC 地址是使用制造商前缀显示还是作为基本 6 八位字节 MAC 地址显示。






  ## WLAN 选项卡


  由于 **Conversations** 窗口的选项卡按字母顺序排列，**WLAN** 选项卡位于最后。该选项卡显示无线站点的 MAC 地址，以及 **Bytes**、**Packets**
  和其他选项卡中提供的其他列。


  ## Wireshark 显示过滤器


  Wireshark 提供了非常广泛的特定于协议的显示过滤器，通过允许您根据自己定义的标准专注于特定数据包，这些过滤器对于分析活动非常有用。您可以仅过滤要查看的流量，或将不需要的流量从视图中过滤掉。显示过滤器是
  Wireshark 最有帮助的功能之一，因此值得非常熟悉。


  显示过滤器可以通过以下几种方式创建：


  - 通过从 **Display Filter** 窗口应用显示过滤器

  - 通过在显示过滤器语法中输入（使用自动完成功能）

  - 通过从 **Conversations**（或 **Endpoints**）窗口应用显示过滤器

  - 通过从 Filter Expression Buttons 应用已保存的显示过滤器

  - 使用 **Expressions** 按钮协助创建过滤器

  - 在特定数据包字段上使用右键菜单


  ### Note


  请记住，显示过滤器使用专有的 Wireshark 过滤器格式，该格式依赖于协议，并且与捕获过滤器语法有很大不同。


  ## 显示过滤器窗口


  您可以通过从 **Analyze** 菜单中选择 **Display Filters**，点击工具栏上的 **Edit/apply display filter**
  图标，或直接点击显示过滤器栏上显示过滤器文本框旁边的 **Filters** 按钮来打开 **Display Filter** 窗口。


  **Display Filter** 窗口的外观和功能与捕获过滤器窗口类似，如以下屏幕截图所示。您可以通过输入过滤器名称和适当的语法然后点击 **New**，或点击现有过滤器来创建新的自定义显示过滤器以添加到此窗口。点击
  **New** 并根据需要修改/重命名。


  ![](img/da40f92928403866599198344271d63e_129_0.png)


  此窗口中列出的显示过滤器已保存在 Wireshark 安装目录中默认配置文件的 `dfilters` 文件中，并在使用自定义配置文件时保存在适当的 **Personal
  configuration** 目录中。


  当您应用显示过滤器时，Wireshark 用户界面屏幕底部的 **Status Bar** 会反映数据包总数和显示的数据包数量，如以下屏幕截图所示：


  Packets: 423 · Displayed: 71 (16.8%) · Load time: 0:00.030


  ## 输入显示过滤器


  您可以直接在显示过滤器栏中的 **Filter** 文本框中输入显示过滤器语法，然后点击 **Apply** 应用过滤器或点击 **Clear** 清除过滤器并重新开始。


  在文本框中输入显示过滤器语法的有帮助功能是自动完成功能。在输入协议名称后跟一个句点（.）时，文本框会显示可用的协议相关扩展列表，可供选择，然后添加适当的比较运算符和值，然后点击
  **Apply**。


  文本框还具有指示显示过滤器语法状态的颜色编码背景。如果语法不正确或不完整，背景为红色，正确的过滤器则背景为绿色。黄色背景表示警告，输入的语法可能无法按预期工作。


  ## 从 Conversations 或 Endpoints 窗口的显示过滤器


  从 **Conversations** 窗口应用显示过滤器已有所介绍。相同的功能也可从 **Endpoints** 窗口使用，可通过从 **Statistics**
  菜单中选择 **Endpoint List** 并选择其中一种列出的协议来打开。


  ## Filter Expression Buttons


  Filter Expression Buttons 是基于显示过滤器创建的按钮；可用于快速将先前保存的显示过滤器应用于捕获数据，以识别网络和应用程序问题。


  例如，要创建一个 **Filter Expression Button** 选项，仅显示 **TCP SYN, SYN/ACK, FIN,** 或 **RST**
  数据包以分析 TCP 会话设置参数、网络往返延迟时间和会话终止：


  - 1. 在 **Display Filter Bar** 上的 **Filter** 文本框中输入以下显示过滤器字符串：


  ```

  (tcp.flags&02 && tcp.seq==0) ||  (tcp.flags&12 && tcp.seq==0) ||

  (tcp.flags.ack && tcp.seq==1 && !tcp.nxtseq > 0 && !tcp.ack >1)

  || tcp.flags.fin == 1 || tcp.flags.reset ==1

  ```


  - 2. 点击 **Apply** 将此过滤器应用于您加载的捕获，以便确认其正常工作。


  - 3. 然后，点击 **Save** 并为按钮命名，例如 `TCP Handshake`（如以下屏幕截图所示）。然后，点击 **OK**：


  ![](img/da40f92928403866599198344271d63e_134_0.png)


  您创建的过滤器表达式按钮将出现在显示过滤器栏初始控件右侧，如以下屏幕截图所示：


  ![](img/da40f92928403866599198344271d63e_134_1.png)


  过滤器表达式按钮定义存储在您正在使用的配置文件的首选项文件中。您可以在 Wireshark 的 Preferences 窗口中编辑按钮显示顺序、编辑名称或过滤器语法，或删除按钮。


  ## 使用 Expressions 窗口按钮


  在显示过滤器工具栏上文本框右侧是 **Expression** 按钮。点击此按钮会打开一个 **Filter Expression** 窗口，允许您选择协议和该协议的扩展、其中一个适当的关联（比较）运算符，并分配比较值。点击
  **OK** 将生成的显示过滤器语法填充到显示过滤器文本框中，然后点击 **Apply** 应用过滤器。


  ## 特定数据包字段上的右键菜单


  如果您在 **Packet List** 或 **Packet Details** 窗格中右键点击特定字段，可以选择 **Apply as Filter** 或
  **Prepare a Filter** 选项以及所需的子菜单选项来创建显示过滤器语法，如以下屏幕截图所示。这是一种创建显示过滤器语法的非常快速的方法：


  ![](img/da40f92928403866599198344271d63e_137_0.png)


  如果您选择一个字段并使用右键功能创建显示过滤器语法，通常最好使用 **Prepare a Filter** 选项，这将允许您在点击 **Apply** 应用过滤器之前编辑语法。


  ### Note


  在 **Packet Details** 窗格中点击协议字段会使该字段和反映该字段的显示过滤器语法显示在左下角的 **Status** 栏字段中。这对于开始使用特定字段的显示过滤器字符串非常有帮助。


  ## 跟踪 TCP/UDP/SSL 流


  选择对话中的数据包，右键点击并从菜单中选择 Follow TCP Stream、Follow UDP Stream 或 Follow SSL Stream 选项（视情况而定）会提供一个显示窗口，其中包含对话中所有数据包的有效载荷数据的文本描述。这是在无需选择和检查多个数据包的情况下检查流内容的一种极佳方式。查看客户端和服务器之间的交换对于故障排除非常有帮助。


  当为给定数据包选择 Follow Stream 选项时，会自动创建并应用显示过滤器以支持此窗口的创建。以下屏幕截图说明了 Follow TCP Stream 窗口。此外，请注意创建并应用的显示过滤器语法（tcp.stream
  eq 15），当选择此流时：


  ![](img/da40f92928403866599198344271d63e_138_0.png)






  ### 标记和忽略数据包


  您可以通过Wireshark的**编辑**菜单切换**标记/取消标记数据包**或**忽略/取消忽略数据包**，也可以在**数据包列表**窗格中右键点击数据包并选择**标记数据包（切换）**或**忽略数据包（切换）**。


  在**数据包列表**窗格中右键点击数据包后显示的菜单如下截图所示：


  ![](img/da40f92928403866599198344271d63e_140_0.png)


  Wireshark允许您在**数据包列表**窗格中标记一个或多个数据包，通过为数据包条目设置黑底白字，以便日后更容易找到这些数据包。这种标记可以按数据包逐个切换开启或关闭。标记数据包对显示或数据包上下文没有其他影响。


  您还可以忽略一个或多个数据包。不过，当您对某个数据包启用忽略功能后，该数据包条目会从**数据包列表**、**数据包详情**和**数据包字节**窗格中消失，并且实际上（暂时）不再属于捕获文件的一部分。请注意，忽略数据包可能导致Wireshark报告因缺失数据包而引发的重传或其他错误状况。


  被忽略的数据包实际上并未从捕获文件中删除，因为您可以使用**视图**菜单中的**重新加载**选项，或点击图标栏上的**重新加载**图标来恢复被忽略的数据包。


  ### 保存过滤后的流量


  在分析过程中或分析完成后，您可能希望将一组过滤后的数据包保存到新的捕获文件中。将批量捕获数据中的过滤子集保存下来，并在Wireshark中打开这个更小的新文件，有助于减少分析过程中在清除显示过滤器、使用会话窗口等操作时显示的干扰性背景噪声数据包。最后，完成分析后，您将需要一个过滤后的捕获文件，它代表了分析证据和结论，并且可以在日后快速加载以供审阅。


  使用**文件**菜单中的**导出指定数据包**选项，即可将仅包含过滤后数据包的新捕获文件保存。导航到目标目录；输入文件名（Wireshark会提供相应的文件扩展名）；做出适当的选择以保存所有显示的数据包、标记的数据包，和/或移除被忽略的数据包；然后点击**保存**。请记得也使用**文件**菜单中的**另存为**选项保存完整的捕获文件，因为您可能再次需要该文件。


  以下截图展示了典型的**导出指定数据包**窗口及其选项：


  ### 小结


  本章涵盖的重点包括：选择最佳的捕获点，在TAP和镜像/SPAN端口之间做出选择，Wireshark的捕获过滤器和选项，验证捕获质量，使用Wireshark的**会话**窗口和显示过滤器来隔离感兴趣的数据包，创建过滤器表达式按钮，标记和忽略数据包，以及保存过滤后的流量以供后续或更详细的分析。


  在下一章中，我们将介绍Wireshark其余的基本数据包分析功能。

  '
- "## 第4章 配置Wireshark\n\nWireshark提供了许多可配置的功能，以提高数据包分析活动的准确性和便捷性，例如排查功能或性能问题。选择最佳格式来测量数据包之间的经过时间是一个重要因素。还有许多特定于协议的选项会影响Wireshark显示时间相关信息的方式，这些选项也同样有用。着色规则、首选项设置和配置文件让您可以根据自己的特定分析风格以及可能工作的不同环境来定制Wireshark。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 处理数据包时间戳\n- 着色与着色规则\n- Wireshark首选项\n- Wireshark配置文件\n\n\
  这些主题将为我们对Wireshark最基本、最实用的功能和选项的介绍画上句号。\n\n### 处理数据包时间戳\n\n理解Wireshark如何处理时间，并使用恰当的数据包时间戳显示形式，对于正确分析数据包流和识别与时间相关的异常至关重要。\n\
  \n### Wireshark如何保存时间戳\n\n当捕获数据包时，Wireshark会根据执行捕获的机器的系统时钟为每个数据包分配一个时间戳。该时间戳会根据捕获机器的时区设置和适用的夏令时（DST）规则计算出的偏移量转换为协调世界时（UTC），然后再转换为纪元编号（自1970年1月1日以来基于UTC的秒数）。这就是保存到捕获文件中每个数据包的时间值。当Wireshark读取捕获文件时，它会将纪元编号转换回熟悉的日期和时间显示，并根据您所在机器的时区和夏令时偏移量进行调整。\n\
  \n这意味着，如果在洛杉矶（UTC偏移量为-8小时）的机器上进行数据包捕获，而您在柏林（UTC+1小时，总体差异为9小时，再加上任何夏令时差异）的机器上查看同一捕获文件，那么在洛杉矶当地时间上午10点捕获的数据包，在柏林将显示为晚上7点的时间戳。\n\
  \n不同时区的时间戳显示示例如下表所示：\n\n|  | 洛杉矶 | 伦敦 | 柏林 | 班加罗尔 |\n|---|---|---|---|---|\n| 捕获文件时间（UTC）\
  \ | 10:00 | 10:00 | 10:00 | 10:00 |\n| 本地相对于UTC的偏移 | -8 | 0 | +1 | +5:30 |\n| 显示时间（本地时间）\
  \ | 02:00 | 10:00 | 11:00 | 17:30 |\n\n如果您要查看别人发送给您的数据包捕获文件，并且某个事件发生的绝对时间对分析很重要，那么您需要知道或询问捕获是在哪个时区进行的，确定您的时区与捕获所在地时区之间的偏移量，并在心里对Wireshark显示的时间戳进行时差调整。否则，这种差异并不重要，因为您通常更关心经过的时间或捕获中特定事件之间的时间间隔。\n\
  \n### Wireshark时间显示选项\n\nWireshark中提供了多种多样的数据包时间显示方式。默认情况下，Wireshark会在**数据包列表**窗格中提供一个**时间**列，该列配置为以微秒分辨率（123.123456）显示每个数据包的**自捕获开始以来的秒数**。\n\
  \n不过，可以通过在**视图**菜单中选择所需的**时间显示格式**选项来更改此列中时间的显示方式，如下截图所示：\n\n![](img/da40f92928403866599198344271d63e_148_0.png)\n\
  \n如果使用了**自捕获开始以来的秒数**选项，捕获中的第一个数据包将显示时间值**0.000000**；所有其他数据包都以该第一个数据包为参考进行计时，从而显示自捕获开始以来的经过时间。\n\
  \n时间显示菜单选项均提供了格式示例，也相当不言自明，只是**自上一个捕获数据包以来的秒数**和**自上一个显示数据包以来的秒数**这两个选项可能需要额外说明。**自上一个捕获数据包以来的秒数**选项提供每个捕获数据包之间的经过时间，而**自上一个显示数据包以来的秒数**选项则显示应用显示过滤器后可见的前一个数据包以来的经过时间。\n\
  \n**显示数据包**选项的工作方式如下截图所示。您可以看到**捕获数据包**的时间戳持续递增，而**显示数据包**的时间戳显示自上一个显示数据包以来的时间。\n\
  \n| 捕获数据包 | 显示数据包 |\n|---|---|\n| 0.000000 | 0.000000 |\n| 0.001000 | 0.001000 |\n\
  | 0.002000 | ----------- |\n| 0.003000 | 0.002000 |\n| 0.004000 | ----------- |\n\
  | 0.005000 | ----------- |\n| 0.006000 | ----------- |\n| 0.007000 | 0.004000 |\n\
  \n**时间显示格式**菜单中的时间显示精度选项也附带了显示格式示例，同样不言自明，唯独**自动（文件格式精度）**设置需要说明一下。\n\nWireshark依赖网卡驱动程序和捕获设备的系统时钟来获取数据包时间戳。这些时间戳在精度和亚秒位数（毫秒、微秒和纳秒）方面的准确性会有所不同，但通常可以提供毫秒级分辨率。该精度值会保存在捕获文件中。**自动（文件格式精度）**设置指示Wireshark使用此精度值显示时间戳。\n\
  \n使用**纳秒精度**设置的能力取决于是否有支持这种精度级别的网卡驱动程序。如果您选择此选项，而捕获文件不包含更高的分辨率，则每个时间戳的最后三位数字将全部为零。\n\
  \n\n\n\n\n## 添加时间列\n\n在**数据包列表**窗格中设置两个（或更多）时间列通常很有用，这样可以提供多种时间显示类型，而无需反复更改单个时间列的格式。你可以使用以下两种方法之一添加新的时间列。\n\
  \n第一种方法为“首选项”设置方法：\n\n- 1. 从**编辑**菜单中选择**首选项**，或单击**首选项**图标打开**首选项**窗口。\n- 2. 选择**列**。\n\
  - 3. 单击**添加**在列表底部添加一个新条目。\n- 4. 单击新条目的**标题**区域，为列命名。\n- 5. 确保新条目处于高亮状态，并从下拉的**字段类型**框中选择所需的时间显示格式。\n\
  - 6. 单击并将新条目在列表中向上拖动，以选择其在**数据包列表**窗格中的相对位置。\n- 7. 最后，单击**确定**。\n\n**字段类型**框中用于时间显示列的可选选项包括：\n\
  \n- **绝对日期，格式为 YYYY-MM-DD，和时间**：这是基于捕获设备时区的实际捕获日期和时间。\n- **绝对日期，格式为 YYYY/DOY，和时间**：这是另一种基于捕获设备时区显示日期和时间的方式。\n\
  - **相对时间**：这是从捕获文件中的第一个数据包开始计算的时间。类似于**自捕获开始以来的秒数**选项。\n- **相对时间（会话）**：这是会话的跟踪文件中从第一个数据包开始的时间（此功能无效）。\n\
  - **增量时间**：这是从前一个数据包到当前数据包所经过的时间。\n- **增量时间（会话）**：这是会话中从前一个数据包到当前数据包所经过的时间（此功能无效）。\n\
  - **显示的增量时间**：这只是从一个数据包结束到下一个显示数据包结束的时间。\n- **自定义**：**相对时间（会话）**和**增量时间（会话）**选项（在首选项设置中也列出了）在撰写本文时当前可用的\
  \ Wireshark 版本（v1.12）中已不再有效。你可以使用以下方式实现这些选项以前提供的功能：\n\n![](img/da40f92928403866599198344271d63e_152_0.png)\n\
  \n以下步骤展示了第二种方法，即通过右键单击添加列的方法：\n\n- 1. 在**数据包列表**窗格中选择一个合适的数据包。\n- 2. 在**数据包详细信息**窗格中，展开**帧**头，或者如果适用，展开**传输控制协议**头。\n\
  - 3. 在**帧**或**TCP**部分中找到所需的时间值字段（这些字段用方括号括起来）。如果要在 TCP 部分中选择时间值，则需要展开**[时间戳]**部分才能看到这些值。\n\
  - 4. 右键单击所需的时间字段，然后从菜单中选择**应用为列**。\n- 5. 新列将出现在**数据包列表**窗格中**信息**列的旁边。单击并将新列拖到所需位置。\n\
  - 6. 你可以右键单击新列标题，选择**编辑列详细信息**，如果需要，可以为列指定一个更短的名称。\n\n正如之前在首选项设置方法中所讨论的，你必须启用**首选项**设置中**TCP**协议选项下的**计算会话时间戳**，才能查看和使用**TCP**部分中的时间值。\n\
  \n## 会话时间与显示的数据包时间选项\n\n会话的时间显示与显示的数据包时间选项之间的差异可能很微妙，但却很重要。\n\n如前所述，如果你使用显示的数据包时间选项之一，则对于给定数据包，显示的时间值将是自上一个数据包在**数据包列表**窗格中显示以来所经过的时间。此时间值选项在应用显示过滤器之前没有实际用处；应用后，你可以轻松看到所显示的每个数据包之间的经过时间，无需其他心算或调整。如果你使用例如**tcp.stream==xx**显示过滤器设置来依次过滤、清除和查看多个会话，这将非常有用。\n\
  \n然而，如果你未使用显示过滤器，则**数据包列表**窗格中可能会显示来自多个会话的数据包。如果你使用会话时间显示之一，则对于给定数据包，显示的时间值将是该会话中自上一个数据包以来所经过的时间，而不论当前查看的数据包与该会话中上一个数据包之间可能穿插显示的其他数据包。这允许你快速浏览会话数据包的时间，而无需应用显示过滤器。\n\
  \n## 选择最佳 Wireshark 时间显示选项\n\n可用的时间显示选项如此之多，可能很难确定在何时何地使用某个选项。在 Wireshark 时间列中选择最佳时间显示在很大程度上取决于分析目标：\n\
  \n- 如果你需要知道捕获中事件发生的具体日期和时刻，例如当你试图查找数据包并将其与用户报告的事件或日志条目相关联时，则应使用**绝对时间**格式之一。\n-\
  \ 如果你正在寻找在捕获开始后某个已知时间发生的事件，请使用**相对时间**格式之一。\n- 另一方面，如果你只需要测量某些数据包之间的时间，例如测量请求和响应之间的时间，那么**增量时间**格式之一将是最有用的。\n\
  \n## 使用时间参考选项\n\nWireshark 的另一个有用功能是**时间参考**菜单选项，它可用于在捕获文件中间测量从一个数据包到另一个数据包的时间。你可以单击某个特定数据包，并使用**编辑**菜单中的**设置/取消设置时间参考**选项，或通过右键单击并从弹出菜单中选择**设置时间参考（切换）**选项，为该数据包启用或禁用此选项。该数据包将在第一个时间列中标记为*REF*指示符，并且**时间参考**数据包之后的任何相对时间戳都将相对于该数据包显示。\n\
  \n**时间参考**设置是临时的，不会保存到捕获文件中，如果你重新加载文件，它将消失。\n\n## 着色与着色规则\n\n在**数据包列表**窗格中对数据包进行着色可以有效地识别和突出显示感兴趣的数据包，尤其是包含或指示某种错误状态的数据包。\n\
  \nWireshark 具有默认启用的预定义着色规则，这些规则可能导致**数据包列表**窗格中出现五颜六色的数据包。如果这让你觉得眼花缭乱，你可以通过从“视图”菜单中选择**为数据包列表着色**，或单击图标栏中的**为数据包列表着色**图标来启用或禁用着色规则。\n\
  \n你还可以通过从**视图**菜单中选择**着色规则**，或单击图标栏中的**编辑着色规则**图标，来查看、启用/禁用、添加、删除、重新排序和编辑着色规则。有一个**清除**按钮，可以移除你对规则所做的所有更改，并在需要时将其恢复为默认设置。\n\
  \n下图展示了**着色规则**窗口：\n\n![](img/da40f92928403866599198344271d63e_156_0.png)\n\n着色规则采用具有特定值的显示过滤器格式来标识应着色的数据包。规则从列表顶部的规则开始向下与数据包进行比较。仅应用与数据包条件匹配的第一条规则，因此如果有多个规则匹配某个数据包，规则的排序决定了应用哪条规则。如果你创建或修改规则，必须检查顺序以确保获得所需的行为。\n\
  \n单击某条规则，再单击**编辑**，即可修改该规则的前景色和背景色，也可以根据需要更改过滤器字符串。\n\n如果你想与他人共享着色规则，还可以导出/导入着色规则。着色规则存储在一个名为`colorfilters`的文件中，该文件位于你的个人配置目录之一中，具体取决于当前使用的配置。\n\
  \n\n\n\n\n### 数据包着色\n\n您还可以通过选择会话中的一个数据包，从**视图**菜单中选择**着色会话**，并从相邻菜单中选择一种颜色，或者右键单击数据包，从菜单中选择**着色会话**，选择特定于协议的选项之一，然后选择所需的颜色，来暂时为会话中的一系列数据包着色。重新加载捕获文件后，此着色将消失，或者您可以从**视图**菜单中选择**重置着色\
  \ 1-10**。\n\n## Wireshark 首选项\n\n在“添加时间列”一节中，我们使用**编辑**菜单中的**首选项**或单击图标栏中的**首选项**图标打开了**首选项**窗口，以配置时间显示列选项。您应该了解相当多的**首选项**选项，并可能希望进行调整以自定义您的\
  \ Wireshark 环境：\n\n- **布局**：用于选择数据包列表、数据包详情和数据包字节窗格的顺序。\n- **列**：用于在数据包列表窗格中添加、删除和移动列。\n\
  - **捕获**：用于设置默认的捕获选项。\n- **过滤器表达式**：用于添加、删除或移动过滤器表达式按钮。\n- **名称解析**：用于设置 MAC、传输和网络（IP）解析选项。\n\
  - **协议**：可以为 Wireshark 支持的所有协议设置选项；其中一些最重要和最有用的选项包括：\n    - **HTTP**：用于添加环境中应识别为\
  \ HTTP 流量的任何其他 TCP 端口。\n    - **IEEE 802.11**：用于在需要解码加密无线会话时添加/编辑无线解密密钥。\n    -\
  \ **IPv4**：如果可能，您可能需要禁用“验证 IPv4 校验和”，以避免由称为校验和卸载的 NIC 选项引起的意外错误消息，该校验在数据包发送到 Wireshark\
  \ 之后检查校验和。\n    - **RTP**：启用“允许子解析器重组 RTP 流”以支持从 VoIP 捕获中解码音频。\n    - **SMB**：启用“重组\
  \ SMB 事务负载”以支持从数据包捕获中的 SMB 流导出文件对象。\n    - **SSL**：如果您有私钥文件，Wireshark 可以解密 SSL/TLS\
  \ 流量。要将密钥添加到 Wireshark，请转到**首选项**窗口，单击“RSA 密钥列表”的“编辑”按钮。然后，在“SSL 解密”窗口中，单击“新建”并填写“SSL\
  \ 解密：新建”字段（SSL 服务器的 IP 地址；端口，对于 HTTP 通常为 443；协议，如 HTTP；以及密钥文件，用于选择 RSA 私钥的路径（如果密钥文件是\
  \ PKCS#12 密钥库（通常具有 .pfx 或 .p12 扩展名），则必须填写密码字段）），最后单击**确定**关闭每个后续窗口。\n- **TCP**：这为您提供了多个选项，如下所示：\n\
  \    - **如果可能，验证 TCP 校验和**：禁用此选项以避免由校验和卸载引起的意外错误消息。\n    - **允许子解析器重组 TCP 流**：启用此选项以支持从\
  \ TCP 流导出文件对象。\n    - **相对序列号**：启用此选项可以更轻松地读取和跟踪捕获文件中的 TCP 序列号。\n    - **跟踪在途字节数**：这是在**数据包详情**窗格的\
  \ TCP 协议头中计算并显示的一个值，对于性能分析很有用。\n    - **计算会话时间戳**：这是前面讨论过的设置，用于支持**tcp.time_relative**和**tcp.time_delta**时间显示。\n\
  \n还有许多其他首选项设置可能与您的个人偏好或分析环境相关；您必须调查大部分或所有这些选项。如果您不确定某个特定设置，可以单击**首选项**窗口底部的**帮助**按钮获取更多信息。\n\
  \n首选项设置存储在名为`preferences`的文件中，该文件位于您的其中一个**个人配置**目录中，具体取决于使用的配置方案。\n\n## Wireshark\
  \ 配置方案\n\n由于我们已经介绍了许多 Wireshark 配置选项，这些选项保存在特定文件中，例如用于**捕获过滤器**的`cfilters`、用于**显示过滤器**的`dfilters`、用于**着色规则**的`colorfilters`以及用于首选项设置的`preferences`，之前提到这些文件保存在您的其中一个**个人配置**目录中，但我一直没有完整解释配置方案和这些配置目录，直到现在，以便您更好地理解配置方案的组成以及它们为何有用。\n\
  \n配置方案是根据您的特定需求和偏好定制的 Wireshark 配置文件集合，包括捕获和显示过滤器、着色规则、列和布局等，适用于您所处的特定环境。您可以创建一个或多个配置方案，并通过选择适当的配置方案快速重新配置\
  \ Wireshark 以在不同环境中最佳工作。\n\n首次安装 Wireshark 时，它使用一组默认配置文件运行，这些文件位于**全局配置**目录中，该目录通常与\
  \ Wireshark 程序文件所在的**系统**目录相同。当您更改任何默认设置时，更改将保存在存储在**个人配置**目录中的新配置文件中，该目录的位置因安装而异。您可以通过单击**帮助**菜单中的**关于\
  \ Wireshark** 选项并单击**文件夹**选项卡，从 Wireshark 中确定并快速打开您的安装的**个人配置**目录。此选项卡中列出了 Wireshark\
  \ 使用的所有目录，如以下截图所示：\n\n![](img/da40f92928403866599198344271d63e_162_0.png)\n\n您可以双击\
  \ Wireshark 目录链接以打开该目录的窗口。\n\n双击**文件夹**选项卡中的**个人配置**链接将打开存储您的自定义配置文件（在`profiles`子目录下）的目录。每个配置方案都存储在单独的目录中，该目录反映您为配置方案指定的名称，如以下截图所示：\n\
  \n![](img/da40f92928403866599198344271d63e_162_1.png)\n\n每个自定义的`profile`目录都包含所有\
  \ Wireshark 配置文件，这些文件决定了该配置方案如何控制 Wireshark 的功能。您可以与其他 Wireshark 用户复制和共享这些自定义配置方案目录；将`profile`目录复制到他们的**个人配置**目录中即可使该配置方案可供选择。\n\
  \n### 创建 Wireshark 配置方案\n\n要创建新的 Wireshark 配置方案，请按照以下步骤操作：\n\n1. 右键单击 Wireshark\
  \ 用户界面底部的**状态栏**中的**配置方案**部分（在右侧窗格），并单击**新建**，或者导航到菜单栏中的**编辑 | 配置方案 | 新建**。\n2.\
  \ 在出现的**新建配置方案**窗口中，您可以给配置方案命名。您还可以通过从**创建自**下拉列表中选择现有配置方案的设置作为起点来创建配置方案，或者从零开始创建。**新建配置方案**窗口如下截图所示：\n\
  3. 单击**确定**将新配置方案保存到自己的目录中，该目录位于**个人配置**目录下的`Profiles`目录中，名称与配置方案相同。\n\n![](img/da40f92928403866599198344271d63e_164_0.png)\n\
  \n## 选择 Wireshark 配置方案\n\n您可以通过从**编辑**菜单中选择**配置方案**，单击列出的配置方案之一，再单击**确定**来选择您的自定义配置方案之一。更快的方法是单击**状态栏**的**配置方案**部分，然后从弹出菜单中选择一个配置方案，如以下截图所示：\n\
  \n![](img/da40f92928403866599198344271d63e_165_0.png)\n\n\n\n\n\n## Summary\n\n\
  本章涵盖的主题包括使用 Wireshark 的时间显示、着色和着色规则、为特定分析环境选择合适的 Wireshark 首选项，以及将所有这些设置保存到可按需选择的配置文件中。\n\
  \n在下一章中，我们将介绍现代网络中常见使用的网络层、传输层和应用层协议的选择，这将帮助你为后续章节中更高级的数据包分析活动做好准备。\n\n## The OSI\
  \ and DARPA reference models\n\n我们在第 2 章《Networking for Packet Analysts》中回顾了 OSI\
  \ 和 DARPA 参考模型的目的。它们各层的视觉描绘在以下图表中重复出现，作为参考并总结了一些主要协议以及它们在各自层中的位置：\n\n![](img/da40f92928403866599198344271d63e_168_0.png)\n\
  \n## Network layer protocols\n\n网络层协议，也称为 DARPA 参考模型中的 Internet 层协议，提供基本网络连接和互联网络通信服务。在这一层，你主要会发现\
  \ IP 协议用于在网络间传输数据包，以及 ARP、IGMP 和 ICMP。\n\n我们在第 2 章《Networking for Packet Analysts》中介绍了\
  \ IP 和 ARP 协议数据包报头结构和字段，因此此处不再重复。然而，基本 Wireshark 捕获和显示过滤器在此提供，也为以下各节中的剩余协议提供：\n\n\
  ### Wireshark IPv4 filters\n\nCapture filter(s): `ip`\n\nDisplay filter(s): `ip\
  \ ip.addr==192.168.1.1 ip.src== ip.dst== ip.id > 2000`\n\n### Wireshark ARP filters\n\
  \nCapture filter(s): `arp`\n\nDisplay filter(s): `arp arp.opcode==1 arp.src.hw_mac==00:1c:25:99:db:85`\n\
  \n## Internet Group Management Protocol\n\n**Internet Group Management Protocol\
  \ (IGMP)** 由主机用于通知相邻路由器已建立的组播（一对多）组成员关系。换句话说，IGMP 使提供内容（例如视频流）的计算机能够使用一组组播地址范围向分布式的用户组提供此类内容（在\
  \ `224.0.0.0` 到 `239.255.255.255` 的类 D 组播范围内）。这种组播能力取决于能够并配置为支持此服务的路由器；客户端必须加入组播组。当主机想要启动组播时，它会向\
  \ `224.0.0.2`（所有组播路由器）地址发送 **IGMP Membership Report** 消息，指定此特定组的组播 IP 地址。希望加入或离开该组（以便接收组播内容）的客户端会向路由器发送\
  \ IGMP 加入或离开消息。以下表格显示了地址的各种范围：\n\n| Starting address range | Ending address range\
  \ | Description |\n|---|---|---|\n| `224.0.0.0` | `224.0.0.255` | These are reserved\
  \ for special well-known multicast addresses |\n| `224.0.1.0` | `238.255.255.255`\
  \ | These are globally-scoped (Internet-wide) multicast addresses |\n| `239.0.0.0`\
  \ | `239.255.255.255` | These are locally-scoped and administered multicast addresses\
  \ |\n\n以下屏幕截图显示了 IGMP 协议报头中的重要字段：\n\nIGMP 协议有多个版本且相当复杂。请参阅本章开头提供的协议参考以获取更多信息。\n\n\
  ### Wireshark IGMP filters\n\n**Capture filter(s):** `igmp`\n\n**Display filter(s):**\
  \ `igmp igmp.type==0x22 igmp.record_type==4`\n`igmp.maddr==244.0.1.60`\n\npacket\
  \ was received, the traceroute utility can build and display a progressive list\
  \ of router interface IP addresses in the path and the RTT delay to each router.\n\
  \n## ICMP control message types\n\n以下表格提供了最常见 ICMP 控制消息类型的采样，包括其类型和代码（子类型）编号：\n\n\
  | Type | Code | Description |\n|------|------|-------------|\n| 0 | 0 | This indicates\
  \ echo reply (ping) |\n| 3 | 0 | This indicates destination network unreachable\
  \ |\n| 3 | 1 | This indicates destination host unreachable |\n| 3 | 4 | This indicates\
  \ fragmentation required and do not fragment bit set |\n| 3 | 6 | This indicates\
  \ destination network unknown |\n| 3 | 7 | This indicates destination host unknown\
  \ |\n| 5 | 0 | This indicates redirect datagram for the network |\n| 5 | 1 | This\
  \ indicates redirect datagram for the host |\n| 8 | 0 | This indicates echo request\
  \ (ping) |\n| 11 | 0 | This indicates TTL expired in transit (seen in traceroutes)\
  \ |\n\n以下屏幕截图中说明的 ICMP 数据包的 Wireshark 数据包详细信息字段描绘了在典型 traceroute 捕获中看到的 Time-to-live\
  \ exceeded 消息：\n\n![](img/da40f92928403866599198344271d63e_175_0.png)\n\n分析此数据包的重要点如下：\n\
  \n- IPv4 报头摘要中看到的源 IP 地址为 **10.192.128.1**，这是发送 ICMP 消息给源地址 **192.168.1.115** 的路由器接口的\
  \ IP 地址\n- ICMP 数据包为 **Type 11, Code 0**（TTL exceeded in transit）\n\n在第一个 IPv4 和\
  \ ICMP 报头之后跟随的第二个 IPv4 和 ICMP 报头集是发送方原始传输数据包的副本。此副本被返回以允许确定导致 ICMP 消息的数据包。此 ICMP\
  \ 消息副本的数据包详细信息中的重要点包括：\n\n- 目标目的 IP 地址，即 echo request 数据包 intended to be sent 的地址（如果\
  \ TTL 值未被更改则会发送）为 **205.251.242.51**。\n- 当此数据包到达 **10.192.128.1** 路由器接口时，TTL 值为\
  \ **1**。\n\n此数据包无法被转发，导致 TTL exceeded 消息被发送回发送方。\n\n- 原始 ICMP 数据包为 **Type 8, Code\
  \ 0** echo request 消息。\n- ICMP 数据包 echo 请求和回复的 **Header Data** 部分将包括 16 位标识符和 16\
  \ 位序列号，用于将 echo 回复与其请求匹配。\n\n## ICMP redirects\n\nICMP 的另一个常见用途是重定向客户端使用不同的默认网关（路由器）来到达主机或网络，而不是它最初尝试使用的网关。在以下屏幕截图中描绘的\
  \ ICMP **Redirect** 数据包中，应注意多个数据包字段：\n\n- ICMP 重定向数据包的源 IP 地址为 `192.168.1.1`，这是客户端的默认网关；这是将重定向数据包发送回客户端的路由器。\n\
  - ICMP **Type is 5 (Redirect)** 且 **Code is 1 (Redirect for host)**。\n- 路由器 `192.168.1.1`\
  \ 告诉客户端用于到达所需目标主机的网关 IP 地址为 `192.168.1.2`。\n- 目标主机的 IP 地址为 `10.1.1.125`。\n\n以下屏幕截图显示了\
  \ ICMP **Redirect** 数据包：\n\n![](img/da40f92928403866599198344271d63e_177_0.png)\n\
  \n### Wireshark ICMP filters\n\n**Capture filters(s):** `icmp`\n\n**Display filter(s):**\
  \ `icmp icmp.type==8 || icmp.type==0 (pings) icmp.type==5 && icmp.code==1 (host\
  \ redirects)`\n\n## Internet Protocol Version 6\n\nInternet Protocol Version 6 (IPv6)\
  \ 是 Internet 协议的最新版本，虽然它仍处于采用的早期阶段，但其目的是最终取代 IPv4——主要是为了解决可分配给网络设备的 IP 地址短缺问题。IPv4\
  \ 具有 32 位地址空间，提供大约 43 亿个地址，其中几乎全部已被分配给全球的公司和私人利益。\n\nIPv6 使用 128 位地址空间，允许 2¹²⁸ 或大约\
  \ 3.4 x 10³⁸ 个地址；该数字为 340,282,366,920,463,463,374,607,431,768,211,456 个唯一地址。\n\n\
  ## IPv6 addressing\n\nIPv6 地址的 128 位表示为八组每组 16 位，以四个十六进制数字由冒号 (:) 分隔书写。IPv6 地址的示例为\
  \ 2001:0db8:0000:0000:0000:ff00:0042:8329。\n\n为方便起见，IPv6 地址可通过应用以下规则在可能的情况下缩短为较短的表示法：\n\
  \n- 从任何一组十六进制数字中删除一个或多个前导零；这通常对所有或无前导零执行。例如，十六进制组 0042 可转换为仅 42。\n- 将连续的零段替换为双冒号\
  \ (::)。双冒号在一个地址中只能使用一次，因为多次使用会使地址不确定。双冒号不得用于表示单个被省略的零段。\n\n将这些规则应用于 IPv6 地址的示例如下：\n\
  \n- **Initial address**: 2001:0db8:0000:0000:0000:ff00:0042:8329\n- **After removing\
  \ all leading zeroes**: 2001:db8:0:0:0:ff00:42:8329\n- **After omitting consecutive\
  \ sections of zeroes**: 2001:db8::ff00:42:8329\n\nIPv6 地址的 128 位在逻辑上分为网络前缀和主机标识符。Class\
  \ Inter-Domain Routing (CIDR) 表示法用于表示 IPv6 网络前缀，例如，2001:DB8:0:CD30::/64 表示网络 2001:DB8:0000:CD30::\n\
  \n\n\n\n\n## IPv6 地址类型\n\nIPv6 地址有三种基本类型：\n\n- **单播（Unicast）**：这是一对一设备之间使用单一接口地址发送的数据包。单播地址可以是以下三种类型之一：\n\
  \  - **全球单播（Global Unicast）**：此类地址可在互联网上及通过互联网路由。全球单播地址通常以 `2xxx` 开头（如 `2000::/3`）。\n\
  \  - **链路本地（Link-local）**：此类地址自动分配给接口，并用于本地网络链路；它不能路由到互联网，与 MAC 地址类似。链路本地单播地址以 `FE80`（`FE80::/10`）开头。当接口初始化时，会使用一种算法，将网卡\
  \ 48 位 MAC 地址的重排版本放入 IPv6 地址中，从而自动分配该地址，用于本地链路上的通信。这些地址不可路由。IPv6 使用链路本地地址进行邻居发现功能。\n\
  \  - **唯一本地（Unique local）**：此类地址不可路由到互联网，但可在企业内路由（类似于 IPv4 私有地址）。唯一本地单播地址以 `FC00`（`FC00::/7`）开头。该地址块保留用于私有\
  \ IPv6 网络中。\n- **组播（Multicast）**：这是一对多设备之间发送的数据包。组播地址以 `FFxx` 开头。组播地址的一个示例是 `FF01:0:0:0:0:0:0:101`，可缩写为\
  \ `FF01::101`。IPv6 中没有广播地址；组播用作替代。一些众所周知的组播地址如下表所示：\n\n  | 地址 | 描述 | 范围 |\n  |---|---|---|\n\
  \  | ff01:0:0:0:0:0:0:1 | 所有节点地址 | 接口本地（仅覆盖节点上的单个接口，仅用于组播数据包的环回传输） |\n  | ff02:0:0:0:0:0:0:1\
  \ | 所有节点地址 | 链路本地（本地网段上的所有节点） |\n  | ff01:0:0:0:0:0:0:2 | 所有路由器地址 | 接口本地 |\n  |\
  \ ff02:0:0:0:0:0:0:2 | 所有路由器地址 | 链路本地 |\n  | ff05:0:0:0:0:0:0:2 | 所有路由器 | 站点本地（覆盖单个站点）\
  \ |\n  | ff02:0:0:0:0:0:1:2 | DHCPv6 服务器/代理 | 链路本地 |\n  | ff05:0:0:0:0:0:1:3 | DHCPv6\
  \ 服务器/代理 | 站点本地 |\n\n- **任播（Anycast）**：这是从一台设备发送到一组接口中最近的一个接口的数据包。任播地址没有特殊的地址方案；它们与单播地址类似。当一个单播地址被分配给多个接口时，会自动创建一个任播地址。任播地址可用于设置一组设备，使该组中的任何一台设备都可以响应发送到单个\
  \ IPv6 地址的请求。\n\n关于 IPv6 寻址的进一步讨论将涵盖相当多的附加功能，这些超出了本书的范围。建议读者在线进一步研究 IPv6 寻址，和/或阅读请求评论（RFC）4291（IP\
  \ 版本 6 寻址架构）。\n\n## IPv6 头部字段\n\nIPv6 协议头部示例如以下截图所示：\n\n![](img/da40f92928403866599198344271d63e_180_0.png)\n\
  \nIPv6 头部字段与许多 IPv4 头部相似，字段包括：\n\n- **版本（Version）**：这是 IP 版本号，IPv6 为 6。\n- **流量类别（Traffic\
  \ class）**：这与 IPv4 的 **DiffServ** 字段类似；用于标识 IPv6 数据包的不同类别或优先级。\n- **流标签（Flow label）**：用于标识标记为一组的数据包序列。IPv6\
  \ 流由 20 位 **流标签** 字段以及源和目的 IPv6 地址字段定义。\n- **负载长度（Payload length）**：这是 IPv6 负载的长度，不包括任何数据包填充。\n\
  - **下一个头（Next header）**：此字段指示数据包中接下来的内容。这相当于 IPv4 的 **协议** 字段。在前面的示例中，下一层是正常的 **TCP（6）**\
  \ 头部。\n- **跳数限制（Hop limit）**：此字段大致相当于 IPv4 中的**生存时间（Time To Live）** 字段；每台转发 IPv6\
  \ 数据包的设备都会将其减 1。当该值达到 1 时，数据包不能再被转发。\n- **源地址和目的地址（Source and Destination addresses）**：这些是\
  \ 128 位的 IPv6 源地址和目的地址。\n\nIPv6 支持扩展头部，可提供附加信息字段，并扩展 IPv6 头部的长度。有一个特定的 **下一个头**\
  \ 代码用于指示此附加功能的存在。\n\n## IPv6 过渡方法\n\n作为向 **IPv6** 过渡的一部分，当前 TCP/IP 设备支持双协议栈（IPv4\
  \ 和 IPv6 同时运行）以及将 IPv6 数据包封装和隧道传输到 IPv4 数据包内，以便 IPv4 网络可以路由这些数据包。三种最流行的封装方法是：\n\n\
  - **6to4 隧道**：在这种隧道方法中，IPv6 头部跟在 IPv4 头部之后；IPv4 头部的 **协议** 字段将包含 41（IPv6），并且 IPv6\
  \ 头部中的源 IPv6 地址将以 `2002` 开头。\n- **Teredo**：在这种隧道方法中，IPv6 头部被封装在 UDP 数据包内。开发此方法是为了适应不处理协议\
  \ 41 的 NAT 设备。Teredo 隧道可以通过 UDP 数据包头部中的目的端口 `3544` 来识别。\n- **ISATAP**：此隧道方法使用本地分配的\
  \ IPv4 地址来创建 64 位接口标识符。例如，在 ISATAP 中，IPv4 地址 `24.6.173.220` 变为 `::0:5EFE:1806:ADDC`。ISATAP\
  \ 与 6to4 隧道一样，将 IPv6 头部封装在 IPv4 中。\n\n## Wireshark IPv6 过滤器\n\n**捕获过滤器：** `ip6 host\
  \ fe80::1 ip proto 41`（捕获 IPv6-over-IPv4 隧道流量）\n\n**显示过滤器：** `ipv6.addr == fe80::f61f:c2ff:fe58:7dcb\
  \ || ipv6.addr == ff02::1`\n\n## 互联网控制消息协议第 6 版\n\n**互联网控制消息协议第 6 版（ICMPv6）** 是\
  \ IPv6 不可分割的一部分，每个 IPv6 节点都必须完整实现基础协议。ICMPv6 为 IPv6 环境提供了在 IPv4 环境中由其他不同协议提供的服务，例如用邻居请求（Neighbor\
  \ Solicitation）替代 ARP。\n\n下表包含一些常见的 ICMPv6 数据包类型：\n\n| ICMPv6 数据包类型 | ICMPv6 类型\
  \ | 用途 |\n|---|---:|---|\n| 回显请求 | 128 | Ping 请求 |\n| 回显响应 | 129 | Ping 响应 |\n|\
  \ 组播侦听器查询 | 130 | 由组播路由器发送，轮询网段中的组成员 |\n| 组播侦听器报告 | 131 | 主机加入组播组时发送，或响应路由器发送的组播侦听器查询\
  \ |\n| 组播侦听器完成 | 132 | 主机离开组播组并可能是该网段上该组最后一个成员时发送 |\n| 路由器请求 | 133 | 发现本地路由器 |\n\
  | 路由器通告 | 134 | 响应路由器请求消息，以及在初始化后和之后周期性地发送此数据包 |\n| 邻居请求 | 135 | 首先用于重复地址检测（使用源地址\
  \ ::），然后用于获取本地路由器的 MAC 地址；此功能取代了 ARP |\n| 邻居通告 | 136 | 响应邻居请求消息 |\n| 重定向消息 | 137\
  \ | 将设备重定向到正确的路由器，以发送数据包到特定网络或主机 |\n\n邻居请求 ICMPv6 数据包的一个示例见以下截图：\n\n![](img/da40f92928403866599198344271d63e_184_0.png)\n\
  \n此数据包中的重要字段包括：\n\n- **下一个头：** 此字段包含 **58**，表示下一个协议头是 ICMPv6。\n- **IPv6 源地址：** 存在未指定地址（::）表示这是\
  \ **重复地址检测** 数据包。\n- **IPv6 目的地址：** 这基本上是一个组播地址。\n- **ICMPv6 类型：** 这是邻居请求消息，使用类型\
  \ **135**。\n- **ICMPv6 代码：** 这是邻居请求消息的子类型；将为 **0**。\n- **ICMPv6 目标地址：** 这是主机想要使用的地址。如果网络上的另一个节点已经在使用此地址，它们将相应地进行响应。\n\
  \n### 组播侦听器发现\n\n**组播侦听器发现（MLD）** 是 IPv6 套件的另一个组件，IPv6 路由器使用它来发现在直接连接的链路上的组播侦听器。MLD\
  \ 是 ICMPv6 协议的一部分，它取代了 IPv4 网络上的 IGMP。\n\n### Wireshark ICMPv6 过滤器\n\n\n\n\n\n**捕获过滤器：**\
  \ `icmp6`\n\n**显示过滤器：** `icmpv6 icmpv6.type==135 && icmpv6.code==0 (Neighbor Solicitation)`\n\
  \n## 传输层协议\n\n传输层协议包括用于传输应用协议的 TCP 和 UDP。\n\n### 用户数据报协议\n\n用户数据报协议（UDP）被认为是一种不可靠的传输。在此，没有数据包交付或排序的保证，但它开销较低，并被用于对时间敏感的应用，例如语音和视频流量。\n\
  \n以下屏幕截图显示了 UDP 头部包含的字段：\n\n![](img/da40f92928403866599198344271d63e_187_0.png)\n\
  \nUDP 头部仅为 8 字节长，由以下部分组成：\n\n- **源端口和目的端口**：每个为 2 字节。\n- **长度**：这是 UDP 头部加上负载的长度。这是一个\
  \ 2 字节字段。\n- **校验和**：这是一个 2 字节字段，用于检查 UDP 头部和数据的错误。如果发送方未生成校验和，则此字段为全零。\n\n### Wireshark\
  \ UDP 过滤器\n\n捕获过滤器：udp udp port 2222\n\n显示过滤器：udp udp.srcport == 161 (SNMP response)\
  \ udp.length > 256\n\n### 传输控制协议\n\n传输控制协议（TCP）通过检测丢失、重复或乱序的数据包、请求重传丢失的数据，或在交付给应用程序之前重新排列数据包的顺序，从而提供数据的可靠交付。TCP\
  \ 还可以从应用程序接收大量数据，并使用多个数据包处理将数据可靠地传输到另一端，并在另一端重新组装它们。\n\n以下屏幕截图突出显示了基本 TCP 头部的显著字段：\n\
  \n![](img/da40f92928403866599198344271d63e_188_0.png)\n\nTCP 头部的内容和长度可能因所使用的选项而异，但在最简单的实现中它由以下部分组成：\n\
  \n- 源端口和目的端口：这些是众所周知且已注册的端口，用于（在服务器上）访问标准应用程序服务，如 HTTP、FTP、SMTP、数据库等。分配给客户端/用户会话的端口号通常在较高的数字范围内并按顺序分配。\n\
  - 序列号：这是一个代表任何给定段中第一个八位字节的数字。序列号在新会话开始时初始化为随机数，然后随着数据字节的发送而递增。\n- 确认号：当 ACK 标志位被设置时，此字段包含从发送方期望的下一个序列号，这反过来确认收到到该点为止的所有字节。\n\
  \n### 注意\n\n序列号和确认号的使用是 TCP 通过跟踪接收到的字节的数量和顺序来确保数据可靠交付的方式。\n\n序列号和确认号很大，人类难以跟踪。Wireshark\
  \ 可以将它们转换为相对值，并在会话开始时从 0 开始显示，以便更轻松地检查它们并将值与传输和接收的字节数相关联。\n\n- **标志：** 这些位用于控制连接设置、终止和流量控制机制。\n\
  - **窗口大小：** 此字段指示此主机上用于存储接收数据直到可以移交给接收应用程序的缓冲区的当前大小。此信息使发送主机能够在网络或主机拥塞的情况下调整数据流速率。\n\
  \n### TCP 标志\n\n下表列出了 TCP 头部中最常用的标志：\n\n| 标志字段名称 | 描述 |\n|---|---|\n| URG (紧急) |\
  \ 这指示应检查的 **紧急指针** 字段（在 TCP 头部校验和之后）。此标志通常为 0；只有当此位被设置时，才会检查 **紧急指针** 字段。 |\n| ACK\
  \ (确认) | 这是确认数据包。 |\n| PSH (推送) | 这指示发送节点的 TCP 堆栈是否应绕过任何缓冲并将数据直接传递到网络并传递给接收应用程序。\
  \ |\n| RST (重置) | 这用于显式关闭连接。 |\n| SYN (同步) | 这用于同步序列号并用于三向 TCP 会话初始化握手过程。 |\n| FIN\
  \ (结束) | 这在事务结束时使用。这并不意味着连接要显式关闭，但在会话结束时通常可见。 |\n\n### TCP 选项\n\nTCP 还支持许多额外的选项，其中一些在现代网络中很常见，你应该了解。以下屏幕截图中说明的\
  \ TCP 头部片段描绘了其中最受欢迎的几个选项：\n\n![](img/da40f92928403866599198344271d63e_190_0.png)\n\
  \n前述屏幕截图中突出显示的 TCP 选项包括：\n\n- **最大段大小**：此选项允许你指定可在 TCP 头部后跟随的字节数。此选项存在是为了允许调整以适应\
  \ VLAN 标记或 **多协议标签交换（MPLS）**。\n- **窗口缩放**：此选项克服了标准 TCP 头部中 **窗口大小** 字段无法指定大于 65,535\
  \ 字节的窗口大小的能力。窗口缩放允许你指定一个因子来乘以 advertised 窗口大小以实现更大的窗口大小。会话的两端都必须能够支持此选项才能应用；这是在会话设置期间确定的。\n\
  - **TCP SACK 允许选项：** 此选项指示此节点支持选择性确认，这允许节点在仍请求特定丢失数据包的同时确认正在进行和传入的数据包。恢复过程仅需要重传丢失的数据包，而不是丢失的数据包及其后的所有数据包。会话的两端都必须能够支持此选项才能应用，如会话设置期间所确定。\n\
  \n### Wireshark TCP 过滤器\n\n**捕获过滤器：** `tcp tcp port 80`\n\n**显示过滤器：** `tcp tcp.port\
  \ == 80 tcp.dstport == 8080 tcp.stream == 2`\n\n## 应用层协议\n\n最常见的应用层协议包括用于获取客户端 IP\
  \ 地址和配置信息的 DHCP，用于主机名解析的 DNS，HTTP、SMB、POP/SMTP，以及用于最常见网络服务的 FTP，和用于 VoIP 和视频会议的\
  \ SIP、RTP 和 RTCP。\n\n对所有上层协议的广泛覆盖超出了本书的范围。将提供 DHCP 和 DNS 的简要概述，因为这些协议普遍支持网络操作，以及\
  \ HTTP 作为最常见的应用层协议之一的示例。鼓励读者根据其兴趣范围和满足所解决的分析任务的需求，进一步研究这些协议中的任何一个或全部。\n\n### 动态主机配置协议\n\
  \n**动态主机配置协议（DHCP）** 允许客户端从 DHCP 服务器管理的池中租用 IP 地址。客户端还可以接收其他配置选项，例如默认网关、子网掩码和一个或多个\
  \ DNS 服务器地址。DHCP 源自较旧的 BOOTP 协议；Wireshark 在显示过滤器语法中使用 bootp。DHCP 通过客户端使用 UDP 源端口\
  \ 67 向 UDP 目的端口 68 发送广播数据包来工作。DHCP 服务器将使用 UDP 源端口 68 向请求者的 IP 地址响应，使用 UDP 目的端口 67。\n\
  \nDHCP 服务器不一定必须与客户端位于同一本地网络段。诸如路由器的中继代理可以转发 DHCP 请求并响应/来自 DHCP 服务器所在的另一个网络。\n\n\
  ### Wireshark DHCP 过滤器\n\n**捕获过滤器：** port 67 (DHCP is between ports 67 and 68; filtering\
  \ on port 67 is sufficient to get both sides of the conversations)\n\n**显示过滤器：**\
  \ `bootp bootp.option.value == 0` (DHCP Discover message)\n\n\n\n\n\n## 动态主机配置协议第6版\n\
  \n**动态主机配置协议第6版（DHCPv6）** 是 DHCP 的 IPv6 版本。由于 IPv6 不使用广播，DHCPv6 客户端使用多播地址 `All_DHCP_Relay_Agents_and_Servers\
  \ (ff02::1:2)` 来定位 DHCPv6 服务器或中继代理。\n\n### Wireshark DHCPv6 过滤器\n\n**捕获过滤器：** `port\
  \ 546`（DHCPv6 位于端口 `546` 和 `547` 之间；两者均可）\n\n**显示过滤器：** `dhcpv6 dhcpv6.msgtype ==\
  \ 1`（DHCPv6 Solicit 消息）\n\n## 域名服务\n\n域名服务（DNS）用于将主机名（例如 www.wireshark.org）转换为 IP\
  \ 地址。DNS 还可用于识别与 IP 地址关联的主机名（反向或指针（PTR）查询），以及其他一些网络信息服务。这是一个值得熟悉的好协议，因为它在企业内和互联网上都广泛用于通过主机名定位节点。\n\
  \n### Wireshark DNS 过滤器\n\n捕获过滤器：port 53\n\n显示过滤器：dns dns.flags.response == 0（DNS\
  \ 查询）\ndns.flags.response == 1（DNS 响应）dns.flags.rcode != 0（DNS 响应包含错误）\n\n## 超文本传输协议\n\
  \n超文本传输协议（HTTP）是人们在互联网上浏览（非安全）网站时使用的应用层协议，还有其安全版本（HTTPS）。HTTP/1.1 是当前版本，尽管 HTTP/2.0\
  \ 开始在部分环境中出现。请注意，某些网络设备（如代理服务器和网关）可能尚不支持 HTTP/2.0。\n\n下面截图展示了向 Web 服务器发送 GET 请求的\
  \ HTTP 数据包示例：\n\n![](img/da40f92928403866599198344271d63e_196_0.png)\n\nHTTP 协议最常见的特性和字段包括\
  \ HTTP 方法、Host 和请求修饰符。\n\n在上述截图中，HTTP 标头包括：\n\n- 请求方法：GET\n- 请求 URI：/Orion（Web 服务器上的主页）\n\
  - 请求版本：HTTP/1.1\n\n### HTTP 方法\n\n下表列出并描述了一些常见的 HTTP 方法：\n\n| 方法 | 描述 |\n|---|---|\n\
  | GET | 检索由 **统一资源标识符（URI）** 字段定义的信息 |\n| HEAD | 检索与所需 URI 相关的元数据 |\n| POST | 向\
  \ HTTP 服务器/应用程序发送数据 |\n| OPTIONS | 确定与资源关联的选项 |\n| PUT | 向 HTTP 服务器/应用程序发送数据 |\n\
  | DELETE | 删除由 URI 定义的资源 |\n| CONNECT | 用于连接到代理设备 |\n\n### Host\n\n**Host** 字段用于标识所请求资源的目标主机和端口号。在上述截图中，**Host**\
  \ 是 `pktiqsvr1`，端口为 `8080`。\n\n### 请求修饰符\n\nHTTP 请求和响应使用请求修饰符来提供请求的详细信息。在上述截图中，请求修饰符包括：\n\
  \n- **Connection：** 表示对持久连接（keep-alive）的偏好。\n- **Accept：** 可接受的数据格式列表（`text/html`\
  \ 和 `application/xhtml` 以及 `xml`）。\n- **User-agent：** 发起请求设备的浏览器和操作系统参数列表（Mozilla/5.0\
  \ (Windows NT 6.1; WOW64) AppleWebKit）。\n- **Accept-encoding：** 可接受的 HTTP 压缩方案列表（gzip、deflate\
  \ 和 sdch）。\n- **Accept-language：** 可接受的语言（en-US 和 en; q=0.8），其中 q=0.8 是一个相对质量因子，表示用户偏好的语言级别，范围为\
  \ 0 到 1。\n- **Cookie：** 这是一个会话 ID cookie（ASP.NET_SessionId=sidsruxjbm4eaed4d3dgg4zd），此前已存储在用户浏览器的\
  \ cookie 中，现正提供给网站。\n\n下表列出了一些更常用的修饰符：\n\n| 请求修饰符 | 描述 |\n|---|---|\n| Accept |\
  \ 可接受的内容类型 |\n| Accept-charset | 可接受的字符集 |\n| Accept-encoding | 可接受的编码 |\n| Accept-language\
  \ | 可接受的语言 |\n| Accept-ranges | 服务器可以接受范围请求 |\n| Authorization | 用于 HTTP 身份验证的凭据\
  \ |\n| Cache-control | 缓存指令 |\n| Connection | 用户代理偏好的连接类型 |\n| Cookie | HTTP cookie（一种由网站发送并存储在用户浏览器中的小数据，在用户下次访问时发送回网站，包含会话信息）\
  \ |\n| Content-length | 请求正文的长度（以字节为单位） |\n\n| 标头 | 描述 |\n|---|---|\n| Content-type\
  \ | 正文的 MIME 类型（用于 `POST` 和 `PUT` 请求） |\n| Date | 消息发送的日期和时间 |\n| Expect | 定义客户端期望的服务器行为\
  \ |\n| If-match | 如果客户端提供的信息匹配，则执行操作 |\n| If-modified-since | 提供缓存数据的日期/时间；如果缓存数据仍然是最新的，则返回\
  \ **304 Not Modified** |\n| If-range | 请求缺失信息的范围 |\n| IF-unmodified-since | 仅在提供的日期/时间之后未修改才发送\
  \ |\n| Max-forwards | 限制通过代理或网关转发的次数 |\n| Proxy-authorization | 代理连接的授权凭据 |\n| Range\
  \ | 仅请求实体的一部分 |\n| TE | 接受的传输编码 |\n| User-agent | 包含浏览器和操作系统信息的字符串 |\n| Via | 所经过的代理\
  \ |\n\n### Wireshark HTTP 过滤器\n\n**捕获过滤器：** `tcp port http tcp port https`\n\n**显示过滤器：**\
  \ `http http.request.method == \"GET\" or http.request.method == \"POST\" http.response.code\
  \ > 399`（标识客户端或服务器错误数据包）\n\n## 附加信息\n\n要覆盖所有最常见的上层协议，或对它们进行深入的介绍，显然超出了本书篇幅所能包含的内容。我鼓励你花一些时间研究那些出于个人或工作原因感兴趣的协议。你投入的时间将获得丰厚的回报。\n\
  \n本章讨论的任何协议以及所有未涉及的协议的附加信息都可以在网上找到。\n\n### Wireshark wiki\n\n如果你正在 Wireshark 的**数据包详细信息**窗格中检查某个协议，可以右键单击协议头或协议头中的字段，然后从菜单中选择**Wiki\
  \ 协议页面**，即可进入 Wireshark wiki 上包含该协议信息的特定页面。更多信息请参见 [http://wiki.wireshark.org/ProtocolReference](http://wiki.wireshark.org/ProtocolReference)。\n\
  \n你也可以通过选择协议头或协议头中的字段，右键单击，然后选择**过滤器字段参考**来获取特定协议的 Wireshark 显示过滤器完整列表。\n\n### Wikipedia\
  \ 上的协议\n\n你可以在 Wikipedia 上找到各种协议的一般信息。从互联网协议开始。还提供了整个互联网协议套件的附加链接：[http://en.wikipedia.org/wiki/Internet_Protocol](http://en.wikipedia.org/wiki/Internet_Protocol)。\n\
  \n### 请求评议（RFC）\n\n**请求评议（RFC）** 文档包含所有互联网协议的详细信息。这些文档由**互联网工程任务组（IETF）**维护，是关于协议应如何实现和运行的最终依据（[http://www.ietf.org/rfc.html](http://www.ietf.org/rfc.html)）。如果你想按标题或关键字搜索特定\
  \ RFC，请使用链接 [http://www.rfc-editor.org/search/rfc_search.php](http://www.rfc-editor.org/search/rfc_search.php)。\n\
  \n## 总结\n\n本章涵盖的主题包括：网络层协议 IPv4、ARP、IGMP、ICMP、IPv6 和 ICMPv6 的协议和字段；传输层协议 UDP 和 TCP；应用层协议\
  \ DHCP、DHCPv6 和 DNS 的概述；以及对 HTTP 的更深入探讨。\n\n在下一章中，我们将充分利用目前已涵盖的所有主题，使用 Wireshark\
  \ 排查功能和性能问题。\n\n\n\n\n"
- "## 第 6 章. 故障排除与性能分析\n\n在本章中，我们将讨论 Wireshark 的主要用途——排除网络和应用程序的连接、功能和性能问题。\n\n将涵盖的主题包括：\n\
  \n- 故障排除方法\n- 排除连接问题\n- 排除功能问题\n- 性能分析方法\n- 应用性能不佳的五大原因\n- 检测和确定延迟优先级\n- 服务器处理时间事件\n\
  - 应用往返延迟\n- 网络路径延迟\n- 带宽拥塞\n- 数据传输问题\n\n这些主题涵盖了你在分析工作中会遇到的绝大多数问题。\n\n### 故障排除方法\n\
  \n进行数据包分析的两个基本原因如下：\n\n- 排除连接或功能问题（用户无法连接、应用程序无法工作或工作不正常），我们将其称为故障排除\n- 分析性能问题（应用程序可以工作但很慢），我们将其称为性能分析\n\
  \n第三个灰色地带是应用程序基本可以工作但很慢且偶尔超时，这可能涉及导致性能问题的潜在功能问题，也可能只是性能非常差。\n\n排除连接或功能问题，只需将正常工作的情况与你正在处理的情况进行比较即可。\n\
  \n另一方面，性能问题则需要确定特定事务完成所需的大部分时间花费在何处，测量延迟并将该延迟与正常或可接受的情况进行比较。过量延迟的来源和类型通常会指向下一步需要进一步调查或解决的领域。\n\
  \n无论如何，你需要收集信息以确定这是一个连接、功能还是性能问题，并根据其性质来处理问题。\n\n### 收集正确的信息\n\n在处理问题时，你能做的最重要的事情就是确定真正的問題是什么，以便你可以解决正确的问题或问题的正确方面。为了确定真正的问题，或至少接近它，你需要提问并解释答案。这些问题可能包括根据投诉情况从以下列表中选择合适的项目：\n\
  \n- 定义问题：\n  - 你试图做什么（连接到服务器、登录、发送/接收电子邮件、通用应用程序使用、上传/下载文件，以及特定事务或功能）？\n  - 是什么都不工作，还是只是特定应用程序或多个应用程序的问题？\n\
  \  - 你试图/连接到哪个网站/服务器/应用程序？你知道用于访问应用程序的主机名、URL 和/或 IP 地址和端口吗？\n  - 问题/症状的性质是什么？此应用程序或功能/特性以前是否工作过，还是这是你第一次尝试使用它？\n\
  \  - 你是否收到任何错误消息或其他问题指示？\n  - 问题是一致的还是间歇性的？取决于什么？\n  - 这已经发生多久了？\n  - 是否有最近的变化可能产生影响？\n\
  \  - 到目前为止已确定或怀疑了什么？为解决此问题已采取了什么措施？这有帮助或改变了什么吗？\n  - 是否有其他相关因素、症状或用户环境最近的变化需要考虑？\n\
  - 确定问题的范围：\n  - 这个问题是单个用户还是用户组遇到？\n  - 这个问题是发生在特定办公室、地区，还是整个公司范围内？\n  - 这个问题是否对不同类型的用户产生不同影响？\n\
  - 收集系统、应用程序和路径信息。对于更深入的分析（超出单个用户或小用户组问题），根据投诉情况，可能还需要从以下列表中收集并分析适用的问题（其中一些信息可能需要从网络或应用程序支持组获取）：\n\
  \  - 客户端的浏览器类型和版本（针对 Web 应用）？这与正常工作的客户端不同吗？\n  - 客户端和服务器的操作系统类型和版本是什么？\n  - 正确的（厂商）应用程序名称和版本是什么？应用程序是否存在与这些症状相匹配的已知问题（检查厂商的错误报告）。\n\
  \  - 应用程序服务器背后的数据库类型和服务器环境是什么？\n  - 是否涉及其他后端支持的数据源，例如在线数据服务或 Documentum 和 SharePoint\
  \ 服务器？\n  - 客户端与服务器之间的网络路径是什么？路径中是否有防火墙、代理服务器、负载均衡器和/或 WAN 加速器？它们是否配置正确并正常工作？\n\
  \  - 你能否通过 traceroute 确认预期的网络路径（以及涉及的任何 WAN 链路）并验证带宽可用性？\n  - 你能否通过 ping 或 TCP 握手完成时间测量从用户到应用程序服务器的\
  \ **往返时间 (RTT)** 路径延迟？\n\n### 确定问题的一般性质\n\n到目前为止，你应该能够在以下三种基本类型中识别出问题的一般性质：\n\n\
  - 确定这是否是连接问题\n  - 用户无法连接到任何东西\n  - 用户无法连接到特定服务器/应用程序\n- 确定这是否是功能或配置问题\n  - 用户可以连接（获得登录屏幕或应用程序服务器的其他响应）但无法登录（或获得预期响应）\n\
  \  - 用户可以连接并登录但某些或所有功能失败（例如，无法发送/接收电子邮件）\n- 确定这是否是性能问题\n  - 用户可以连接、登录并正常使用应用程序；但速度很慢\n\
  \  - 应用程序正常工作但有时会停滞和/或超时\n\n### 二分法故障排除和其他逻辑\n\n在我职业生涯早期从事电子设备组件级维修时，我学会了使用“二分法”故障排除方法，在几乎每一种情况下都效果很好。二分法故障排除是通过在系统大约中途注入或测量信号，将问题域（在我例子中是一台无线电设备）一分为二的过程。想法是看看哪一半工作正常，哪一半不正常，然后将重点转移到不工作的那一半，分析其一半，依此类推。重复此过程，直到将问题缩小到其源头。\n\
  \n在网络和应用程序世界中，同样可以以一般意义上应用二分法故障排除方法。如果用户抱怨网络很慢，尝试确认或排除网络：\n\n- 靠近服务器的用户是否也遇到类似的缓慢？其他远程位置的用户呢？\n\
  - 如果某个远程用户的某个应用程序很慢，该用户是否也对其他应用程序很慢？\n- 如果用户无法连接到某个服务器，他们能否连接到附近或其他位置的其他服务器？\n\n\
  通过对什么能工作和什么不能工作的逻辑检查，你可以消除很多猜测，并将分析缩小到少数几个合理的可能性。\n\n如果你有一个一切正常工作的环境与一个不工作的情况进行比较，通常更容易确定连接或功能问题的来源。可以比较工作与非工作场景的数据包捕获，看看有什么不同以及这些差异是否重要。\n\
  \n即使你处理的问题看起来与之前修复过的问题相同，也不要对问题做出太多假设。始终验证问题以及你应该能够应用的解决方案，并移除修复措施，观察问题是否可靠地消失/重现。否则，你应该质疑自己是否找到了问题的真正来源，还是只是影响了症状。\n\
  \n除非报告的问题明显是系统范围或特定服务器问题，否则最好在投诉用户处或尽可能靠近投诉用户的位置进行至少初步分析\n\n尽可能在工作站上进行。这样做的好处是能够执行以下操作：\n\
  \n-   查看并验证用户所报告的实际问题\n-   测量到目标服务器的往返时间\n-   在会话建立时捕获并查看 TCP 握手过程\n-   捕获并调查登录及任何其他后台进程和流量\n\
  -   查找用户设备所经历的网络问题（丢包和重传）的迹象\n-   在数据下载期间测量到用户工作站的表观网络吞吐量\n-   无需使用捕获过滤器；单个工作站的进出流量不应过大\n\
  \n在用户工作站、服务器或其他设备上进行捕获时，应使用聚合型**测试访问点（TAP）**，而不是使用交换机的 SPAN 端口（如[第 3 章](Chapter\
  \ 3)“捕获所有正确的数据包”中所述），或者作为最后手段，在用户的工作站或服务器上安装 Wireshark（如果获得授权）。\n\n## 排查连接问题\n\n\
  单个用户或小群体的连接问题可以通过确认用户工作站访问本地和远程网络资源所需的网络功能是否正常运作来解决。需要确认的基本要求或项目包括：\n\n-   启用正确的网络接口（工作站配置）\n\
  -   确认第 1 层（物理）连接\n-   获取每个接口的 IP 地址、子网掩码和默认网关（DHCP）\n-   获取默认网关或其他本地网络服务的 MAC 地址（ARP）\n\
  -   获取网络服务的 IP 地址（DNS）\n-   连接到网络服务（TCP 握手或 UDP 响应）\n\n我们将按顺序简要讨论每一项；虽然前两步不涉及使用\
  \ Wireshark，但它们是故障排除方法中必要的组成部分。如果连接问题影响到一组用户或整个办公室，第一步可能不适用。\n\n### 启用网络接口\n\n虽然启用网络接口似乎是显而易见的，但认为接口在设备启动时默认自动启用（尤其是无线连接）的假设可能是错误的。\n\
  \n在 Windows 上，你可以使用命令行工具 `ipconfig` 查看网络接口的状态和基本配置（IP 地址、子网掩码和默认网关）；在 Linux 或 Mac\
  \ 设备上，等效命令是 `ifconfig` 或 `ip`。\n\n### 确认物理连接\n\n如果连接问题仅限于单个用户的工作站，则应怀疑物理连接。需要检查几个项目，可以采取的故障排除步骤如下：\n\
  \n-   如果从工作站到墙上插座的以太网电缆有问题，你需要换一根不同的电缆。\n-   如果从用户墙上插座到交换机端口的布线有问题，你需要将用户的以太网电缆临时插入另一个（已知正常的）墙上插座。\n\
  -   如果交换机、交换机端口或端口配置有问题，你需要将用户的端口电缆临时插入另一个（已知正常的）端口。请注意，某些网络安全策略要求禁用交换机端口，直到需要使用时才启用，或将端口配置为与单个特定\
  \ MAC 地址关联。如果是这样，端口在插入时可能无法工作，尽管物理上没有问题。\n\n### 获取工作站 IP 配置\n\n除非工作站是手动配置的，否则它需要从\
  \ DHCP 服务器获取 IP 地址、子网掩码、默认网关和 DNS 服务器设置。如果这看起来无法正常工作（在使用 `ipconfig`（Windows）或 `ifconfig`（Linux\
  \ 或 Mac OS X）检查配置之后），你需要使用 TAP 或 SPAN 端口在工作站初始化/启动过程中执行数据包捕获，并调查 DHCP 请求和响应。\n\n\
  共有八种 DHCP 消息类型（不要与两种引导协议类型混淆，即引导请求和引导应答）：\n\n| 消息类型编号 | 消息类型 | 描述 |\n|---|---|---|\n\
  | 1 | DHCP 发现 | 客户端广播以定位可用的 DHCP 服务器 |\n| 2 | DHCP 提供 | 服务器对 DHCP 发现的响应，以提供配置参数\
  \ |\n| 3 | DHCP 请求 | 客户端发送给 DHCP 服务器的消息，用于以下任一情况：<br>- 向一台服务器请求提供的参数并拒绝其他 DHCP 服务器的报价<br>-\
  \ 重新启动后确认先前分配的地址的正确性<br>- 延长 IP 地址的租约 |\n| 4 | DHCP 拒绝 | 客户端发送给 DHCP 服务器的消息，表示所提供的地址不可接受\
  \ |\n| 5 | DHCP 确认 | 服务器向客户端发送配置参数，包括已分配的网络地址 |\n| 6 | DHCP 否定确认 | 服务器向客户端表示客户端的地址不正确或已过期\
  \ |\n| 7 | DHCP 释放 | 客户端向服务器释放网络地址并取消租约 |\n| 8 | DHCP 信息 | 客户端向服务器仅请求本地配置参数 |\n\n\
  对于正在启动且之前已在网络上正常工作的工作站，你通常会看到 DHCP 请求和确认数据包，以验证工作站仍可使用先前租用的地址。在完全冷启动时，前两个 DHCP 数据包将是\
  \ DHCP 发现和 DHCP 提供数据包，随后是请求和确认数据包。\n\n在 DHCPv6 环境中，典型的数据包序列是 DHCPv6 请求、DHCPv6 通告、DHCPv6\
  \ 请求和 DHCPv6 应答。\n\n在 DHCP 响应数据包（或 DHCPv6 通告数据包中的类似字段）中需要验证的字段包括以下四个字段：\n\n-   **您的（客户端）IP\
  \ 地址：** 这是为此工作站提供的 IP 地址\n-   **子网掩码：** 这是在此网络上使用的子网掩码\n-   **域名服务器：** 这是 DNS 服务器\
  \ IP 地址\n-   **路由器：** 这是要使用的默认网关的 IP 地址\n\n这是任何网络通信所需的最少数据；下面的屏幕截图说明了在 DHCP 应答数据包中提供这些字段的示例：\n\
  \n```\nBootstrap Protocol (ACK)\n\nMessage type: Boot Reply (2)\nHardware type:\
  \ Ethernet (0x01)\nHardware address length: 6\nHops: 0\nTransaction ID: 0x28a0655c\n\
  \nSeconds elapsed:\n[Expert Info (Note/Protocol): Seconds elapsed appears to be\
  \ encoded as little-endian]\n[Severity level: Note]\n[Group: Protocol]\n\nBootp\
  \ flags: 0x8000 (Broadcast)\n1... .... .... .... = Broadcast flag: Broadcast\n\n\
  Client IP address: 0.0.0.0 (0.0.0.0)\nYour (client) IP address: 192.168.1.115 (192.168.1.115)\n\
  \nNext server IP address: 192.168.1.1 (192.168.1.1)\nRelay agent IP address: 0.0.0.0\
  \ (0.0.0.0)\nClient MAC address: 00:1c:25:99:d8:85 (00:1c:25:99:d8:85)\nClient hardware\
  \ address padding: 00000000000000000000\nServer host name: ecosystem.home.cisco.com\n\
  Boot file name not given\nMagic cookie: DHCP\n\nOption: (53) DHCP Message Type (ACK)\n\
  Length: 1\nDHCP: ACK (5)\n\nOption: (54) DHCP Server Identifier\nLength: 4\nDHCP\
  \ Server Identifier: 192.168.1.1 (192.168.1.1)\n\nOption: (51) IP Address Lease\
  \ Time\nLength: 4\nIP Address Lease Time: (86400s) 1 day\n\nOption: (58) Renewal\
  \ Time Value\nLength: 4\nRenewal Time Value: (43200s) 12 hours\n\nOption: (59) Rebinding\
  \ Time Value\nLength: 4\nRebinding Time Value: (75600s) 21 hours\n\nOption: (1)\
  \ Subnet Mask\nLength: 4\nSubnet Mask: 255.255.255.0 (255.255.255.0)\n\nOption:\
  \ (28) Broadcast Address\nLength: 4\nBroadcast Address: 192.168.1.255 (192.168.1.255)\n\
  \nOption: (81) Client Fully Qualified Domain Name\nLength: 15\nFlags: 0x03\n0000\
  \ .... = Reserved flags: 0x00\n.... 0... = Server DDNS: Some server updates\n....\
  \ .0.. = Encoding: ASCII encoding\n.... ..1. = Server overrides: override\n....\
  \ ...1 = Server: Server\nA-RR result: 255\nPTR-RR result: 255\nClient name: ThinkPadW500\n\
  \nOption: (6) Domain Name Server\nLength: 4\nDomain Name Server: 192.168.1.1 (192.168.1.1)\n\
  \nOption: (3) Router\nLength: 4\nRouter: 192.168.1.1 (192.168.1.1)\n\nOption: (255)\
  \ End\nOption End: 255\n```\n\n你可以使用 Wireshark 显示过滤器来筛选出 DHCP 数据包；过滤器为 `bootp`，因为这是\
  \ DHCP 的旧称：\n\n- **DHCP 显示过滤器：** `bootp bootp.option.dhcp == 5 (DHCP Message Type\
  \ 'ACK')`\n- **DHCPv6 显示过滤器：** `dhcpv6 dhcpv6.msgtype == 2 (DHCPv6 'Advertise')`\n\
  \n在**显示过滤器**工具栏的文本框中输入过滤器字符串，点击**保存**，并为按钮分别命名为 `DHCP Pkts` 和 `DHCPv6 Pkts` 之后，你就可以将基本的\
  \ `bootp` 和 `dhcpv6` 显示过滤器保存为**过滤器表达式按钮（FEB）**。或者，你也可以使用 `or (||)` 将这两个过滤器合并到一个按钮中，如以下截图所示：\n\
  \n![](img/da40f92928403866599198344271d63e_216_0.png)\n\n你可能还想保存另一个 FEB，使用以下显示过滤器字符串来显示\
  \ DHCP 异常状态数据包，并将该按钮命名为 **DHCP 错误**或类似名称，如下所示：\n\n```\nbootp.option.dhcp == 4 ||\
  \ bootp.option.dhcp == 6 || bootp.option.dhcp == 7\n```\n\n类似的 DHCPv6 异常事件显示过滤器可以包括：\n\
  \n```\ndhcpv6.msgtype == 8 || dhcpv6.msgtype == 9 || dhcpv6.msgtype == 10\n```\n\
  \n如果你需要更详细地分析这些内容，可以在网上或其他来源进一步研究 DHCP、DHCPv6 以及各种 DHCPv6 消息类型。\n\n## 获取 MAC 地址\n\
  \n工作站会使用 ARP 协议，为其已知 IP 地址对应的网络服务（例如默认网关，或位于同一网段的 DNS 服务器）获取 MAC 地址。ARP 协议及其典型工作方式已在第\
  \ 2 章“面向数据包分析师的网络知识”中介绍过。\n\n你可能希望使用 `arp` 显示过滤器语法创建一个 ARP FEB，以便快速、轻松地检查这些数据包。\n\
  \n## 获取网络服务 IP 地址\n\n客户端工作站向 DNS 服务器发送查询，以获取给定主机名的 IP 地址；DNS 服务器直接返回信息，或代表客户端向其他\
  \ DNS 服务器询问这些信息。\n\nWireshark **数据包详细信息**窗格中显示的 DNS 查询和响应数据包字段格式相当直观。下面的截图展示了一个\
  \ DNS 响应数据包示例，其中包含 `time.windows.com` 的已解析 IP 地址；该响应实际上为别名 `time.microsoft.akadns.com`\
  \ 提供了 IP 地址 `(137.170.185.211)`：\n\n![](img/da40f92928403866599198344271d63e_218_0.png)\n\
  \n## 基本网络连通性\n\n几个简单的测试就可以确认基本网络连通性是否正常，或者发现需要由网络支持团队处理的路由问题或其他问题。\n\n在以下测试中，捕获并分析发送和接收的\
  \ ICMP 数据包可能会很有启发；尽管测试结果本身往往也已足够说明问题：\n\n- 使用 `ipconfig /all`（Windows）或 `ip addr\
  \ show`（Linux）获取默认网关 IP 地址，然后 ping 用户的默认网关，以确认用户工作站具备本地网络上的基本连通性。\n- ping 目标服务器的主机名或\
  \ URL。如果失败（出现请求超时消息），请尝试 ping 其他主机或 URL。如有必要，请在这些测试的数据包捕获中检查 DNS 和/或 ICMP 响应，以确定失败的性质。否则，请记录平均往返时间。\n\
  - 如果 ping 默认网关成功，但 ping 其他目标失败，则对目标服务器执行 traceroute 可以揭示网络路径中连通性在何处中断或受阻。\n\n###\
  \ 注意\n\nWindows 中的 traceroute 命令行工具是 `tracert`，而在 Linux/Unix 和 Mac OS X 机器上，该命令是\
  \ `traceroute`。在 Windows 中执行 traceroute 时，请打开命令提示符（CMD）窗口并输入 `tracert <hostname\
  \ or IP Address of target>`。在大多数其他环境中，请打开终端窗口并输入 `traceroute <hostname or IP address\
  \ of target>`。\n\n如果你能 ping 通目标服务器，且网络连通性正常，就可以进入故障排除流程的下一步。如果不能，请注意，某些主机可能配置为不响应\
  \ ICMP ping 请求，和/或出于安全原因，ICMP 被用户与服务器之间的防火墙阻止。因此，无法 ping 通某台设备并不一定意味着网络有问题。Traceroute\
  \ 结果应有助于确定在通往目标服务器的路径上，网络连通性在多大范围内仍然有效；对其他目标进行测试也会有所启发。\n\n下面的截图展示了先 ping 默认网关、再\
  \ ping URL，最后对目标 URL 执行 traceroute 的示例：\n\n```\nC:\\>ping 192.168.1.1\nPinging 192.168.1.1\
  \ with 32 bytes of data:\nReply from 192.168.1.1: bytes=32 time<1ms TTL=64\nReply\
  \ from 192.168.1.1: bytes=32 time<1ms TTL=64\nReply from 192.168.1.1: bytes=32 time<1ms\
  \ TTL=64\nReply from 192.168.1.1: bytes=32 time<1ms TTL=64\n\nPing statistics for\
  \ 192.168.1.1:\n    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),\nApproximate\
  \ round trip times in milli-seconds:\n    Minimum = 0ms, Maximum = 0ms, Average\
  \ = 0ms\n\nC:\\>\nC:\\>\nC:\\>ping www.wireshark.org\n\nPinging www.wireshark.org\
  \ [162.159.241.165] with 32 bytes of data:\nReply from 162.159.241.165: bytes=32\
  \ time=19ms TTL=54\nReply from 162.159.241.165: bytes=32 time=19ms TTL=54\nReply\
  \ from 162.159.241.165: bytes=32 time=19ms TTL=54\nReply from 162.159.241.165: bytes=32\
  \ time=28ms TTL=54\n\nPing statistics for 162.159.241.165:\n    Packets: Sent =\
  \ 4, Received = 4, Lost = 0 (0% loss),\nApproximate round trip times in milli-seconds:\n\
  \    Minimum = 19ms, Maximum = 28ms, Average = 21ms\n\nC:\\>\nC:\\>\nC:\\>\nC:\\\
  >tracert www.wireshark.org\n\nTracing route to www.wireshark.org [162.159.241.165]\n\
  over a maximum of 30 hops:\n\n  1     <1 ms     <1 ms     <1 ms  Cisco24973 [192.168.1.1]\n\
  \  2      8 ms      8 ms      8 ms  10.192.128.1\n  3     10 ms     21 ms      8\
  \ ms  72-31-193-94.net.bhntampa.com [72.31.\n  4     12 ms      9 ms     10 ms \
  \ ten0-0-0-7.orl d13-ser1.bhn.net [72.31.\n  5     12 ms     11 ms     13 ms  72-31-188-178.net.bhntampa.com\
  \ [72.31.\n  6     13 ms     14 ms     12 ms  10.bu-ether15.orl df1jo0w-bcr00.tbone.\n\
  \  7     22 ms     23 ms     20 ms  bu-ether18.atlngamq47w-bcr01.tbone.rr.\n  8\
  \     21 ms     18 ms     23 ms  bu-ether21.atlngamq46w-bcr00.tbone.rr.\n  9   \
  \  22 ms     19 ms     18 ms  ae-1-0.pr0.atl20.tbone.rr.com [66.109.\n 10     21\
  \ ms     28 ms     21 ms  66.109.10.62\n 11     28 ms     30 ms     36 ms  as13335.xe-7-0-7.ar1.atl1.us.nlayers.ne\n\
  \ 12     19 ms     18 ms     31 ms  162.159.241.165\n\nTrace complete.\n\nC:\\>_\n\
  ```\n\n## 连接到应用程序服务\n\n如果从用户工作站到目标服务器的网络连通性正常（以能够 ping 通主机为证），那么连接到该服务器上托管的特定应用程序时出现问题可能由多种因素导致：\n\
  \n## 排查功能问题\n\n如果用户能够连接到应用程序服务器并建立 TCP 会话，但应用程序无法正常运行或无法正确运行，那么可以从多个方面展开调查。这些方面可以结合数据包级分析、错误报告，以及与其他用户机器上的捕获结果和配置进行对比来调查：\n\
  \n- **用户凭据：** 应用程序功能出现特定用户问题的最常见原因是缺少适当的凭据、授权、权限等。这是首先要检查的事项，以确认其他用户是否正常工作。\n- **用户机器上的应用程序设置：**\
  \ 某些应用程序要求将特定的配置文件放置在用户机器的特定位置。应用程序还可能要求特定版本的应用程序专用工具、Java、.NET 框架等。通常，应用程序会提供一条错误消息，至少指出配置问题的大致性质。\n\
  - **应用程序报告的错误：** 你可以在响应数据包中或用户屏幕上查找可能揭示应用程序错误性质的错误代码：\n  - HTTP、FTP 或 SIP 响应数据包中大于\
  \ 400 的状态码\n  - SMB 响应数据包中的错误代码\n  - 其他应用程序特定的异常、错误代码和消息\n- **Web 浏览器的差异：** 某些 Web\
  \ 应用程序专为特定浏览器（Chrome、Internet Explorer、Firefox、Opera 等）设计，在其他浏览器上可能无法正常运行，甚至根本无法运行，而且可能没有任何错误消息提示这种情况。将浏览器类型和版本与其他正常工作的用户进行比较，可能会有所发现。\n\
  \n网络连通性和应用程序功能问题的原因可能千差万别，因此不可能为每种可能性都绘制出一条清晰的路线图。成功解决这些问题的最佳方法，不是在没有通过系统、逻辑化的故障排除步骤证明这些假设正确之前就做出太多假设，而是尝试找到或创建一个系统（或至少部分系统）能正常工作的场景，并将正常环境与不正常环境中的相关数据包级细节进行比较。\n\
  \n\n\n\n## 性能分析方法论\n\n分析应用程序的性能问题基本上就是确定特定任务完成时大部分时间花费在何处，并将该时间与该类型任务的正常和/或可接受时间进行测量/比较。\n\
  \n## 应用程序性能不佳的五大原因\n\n总体而言，性能问题可归因于以下五个领域，按可能性递减的顺序排列：\n\n- 服务器处理时间延迟\n- 应用程序转弯延迟\n\
  - 网络路径延迟\n- 带宽拥塞\n- 数据传输（TCP）问题\n\n客户端处理时间通常是整体响应时间中相对较小的一部分——除非是某些计算密集型桌面应用程序，否则重点放在网络和服务器环境以及任何影响性能的应用程序设计特征上。\n\
  \n### 准备工具和方法\n\n与准备排查连接或功能问题时一样，您需要收集有关应用程序环境和问题域的正确信息。您还希望确定分析过程中可能需要使用的工具：Wireshark、用于促进数据包捕获的\
  \ TAP 以及任何其他分析工具。\n\n您还需要确定在哪里进行第一次数据包捕获：\n\n- 客户端捕获是开始性能分析工作的最佳位置。从这个角度，您可以查看并验证用户抱怨的内容，查看向用户呈现的任何错误消息或在数据包捕获中明显的错误消息，测量网络往返时间，并捕获可在数据包捕获中研究性能特征，而无需使用捕获过滤器，因此您知道不会遗漏任何内容。\n\
  - 服务器端捕获可能需要，因为对于距离很远的用户，客户端捕获可能无法实现，或者为了分析到后端数据库或其他数据源的服务器到服务器事务。\n- 在网络路径中的某个中间点进行数据包捕获可能需要以隔离\
  \ excessive 数据包丢失/错误以及相关的重传的来源。\n\n请记住，使用聚合 TAP 比使用 SPAN 端口更可取，或者您可以将 Wireshark\
  \ 安装在客户端工作站或服务器上作为最后的手段，但无论如何都要完成捕获。\n\n## 执行、验证和保存良好的数据包捕获\n\n执行捕获并保存大容量捕获文件后，请确认以下内容：\n\
  \n- 1. 检查文件以确保 Wireshark **Expert Info** 菜单中的 **Warnings** 选项卡中没有带有 **ACKed Unseen\
  \ Segment** 消息的数据包，这意味着 Wireshark 看到了一个被确认的数据包，但没有看到原始数据包；表明 Wireshark 由于 TAP 或\
  \ SPAN 端口配置不良或流量水平过高而丢失数据包。在任何情况下，如果出现的不止几个，您希望在确认捕获设置后再次进行捕获。\n- 2. 接下来，您希望在 **Conversations**\
  \ 窗口中查看捕获的 **IPv4** 对话并对 **Bytes** 列进行排序。用户与应用程序服务器之间的 IP 对话应位于顶部或附近，以便您可以选择此对话，右键单击它，然后在\
  \ **Selected** 菜单中选择 **A <-> B**。\n- 3. 在查看过滤后的数据以确保其包含您所期望的内容后，从 **File** 菜单中选择\
  \ **Export Specified Packets** 并保存过滤后的捕获文件，文件名应反映这是大容量捕获文件的过滤子集。\n- 4. 最后，打开您刚刚保存的过滤文件，以便您使用一个更小、更快的没有与分析无关的其他对话的干扰数据包的文件工作。\n\
  \n## 初始错误分析\n\n在分析开始时，您应该查看 Wireshark 的 **Expert Info** 窗口（**Analyze | Expert Info**）的\
  \ **Errors**、**Warnings** 和 **Notes** 选项卡，以查找诸如 excessive 重传、Zero Window 条件或应用程序错误之类的重大错误。这些对于提供报告的性能不佳来源的线索非常有帮助。\n\
  \n尽管在大多数数据包捕获中，少数丢失的数据包和重传是正常且影响很小的，但在路径中用户和服务器之间发生网络拥塞、数据包被丢弃，并且从这些丢失的数据包中恢复可能需要花费相当多的时间时，\
  \ excessive 的数量就表明了这一点。\n\n在 **Expert Info Notes** 窗口中看到大量 Duplicate ACK 数据包的计数可能令人担忧，但可能具有误导性。在下面的屏幕截图中，对于一个丢失的数据包，Duplicate\
  \ ACKs 最多达到 69 个，对于第二个丢失的数据包，计数上升到 89 个（未在下面的屏幕截图中显示）：\n\n![](img/da40f92928403866599198344271d63e_227_0.png)\n\
  \n然而，在使用 **Edit** 菜单中的 **Set/Unset Time Reference** 功能在 Wireshark 中标记第一个 Duplicate\
  \ ACK 发生的时间，然后通过单击 **Expert Info** 屏幕中的数据包编号转到此系列中的最后一个 Duplicate ACK 并检查 **Packet\
  \ List** 窗格中的 **Relative time** 列，只有 30 毫秒的时间过去了。这不是一个显著的时间量，特别是如果启用了 **Selective\
  \ Acknowledgment**（正如本例中那样）并且在此期间其他数据包正在被传递和确认。在更长延迟的网络路径上，Duplicate ACK 计数可能会更高；只有当丢失的数据包总数和所需重传变得\
  \ excessive 时，延迟才可能被用户注意到。\n\n在 **Expert Info Notes** 窗口中要查找的另一个条件包括 **TCP Zero\
  \ Window** 报告，这是由客户端或服务器上的接收缓冲区已满，无法再接受更多数据，直到应用程序有时间检索和处理数据并在缓冲区中腾出更多空间所引起的。这不一定是错误条件，但如果缓冲区缓解所需的时间很长，则可能导致数据传输出现实质性延迟。\n\
  \n您可以通过标记 TCP Zero Window 数据包并查看相对时间直到发送 **TCP Window Update** 数据包的时间来测量此时间，这表明接收方已准备好接收更多数据。如果这种情况经常发生，或者\
  \ Zero Window 和 Window Update 数据包之间的延迟很长，您可能需要检查正在经历缓冲区满条件的宿主机，以查看是否有任何后台进程对您正在分析的应用程序产生不利影响。\n\
  \n### Note\n\n如果您尚未添加，您需要在 **Packet List** 窗格中添加 **Relative time** 和 **Delta time**\
  \ 列。导航到 **Edit | Preferences | Columns** 以添加这些。添加时间列也在第 4 章《配置 Wireshark》中进行了说明。\n\
  \n您可能会在 **Warnings** 选项卡中看到连接重置（RST）消息。如果它们发生在客户端-服务器交换或会话结束时，它们不是错误条件的指标；它们是会话终止的正常指标。\n\
  \n一个非常方便的 **Filter Expression** 按钮，您可能希望添加到 Wireshark 中，是使用以下显示过滤器字符串的 **TCP Issues**\
  \ 按钮，如下所示：\n\n```\ntcp.analysis.flags && !tcp.analysis.window_update &&\n!tcp.analysis.keep_alive\
  \ && !tcp.analysis.keep_alive_ack\n```\n\n这将过滤并显示您将在 **Expert Info** 窗口中看到消息的大多数数据包，并提供任何重大问题的快速概览。\n\
  \n## 检测和优先处理延迟\n\n由于我们正在处理应用程序性能，第一步是识别数据包流中的任何延迟，以便我们可以专注于周围的数据包以识别延迟的来源和性质。\n\n\
  识别延迟事件的最快方法之一是对 **TCP Delta time** 列进行排序（通过单击列标题），以便最高延迟的数据包排列在\n\n\n\ntop of the\
  \ packet list. You can then inspect the Info field of these packets to determine\
  \ which, if any, reflect a valid performance affecting the event as most of them\
  \ do not.\n\nIn the following screenshot, a TCP Delta time column is sorted in order\
  \ of descending inter-packet times:\n\n![](img/da40f92928403866599198344271d63e_229_0.png)\n\
  \nLet's have a detailed look at all the packets:\n\n- The first two packets are\
  \ the TCP Keep-Alive packets, which do just what they're called. They are a way\
  \ for the client (or server) to make sure a connection is still alive (and not broken\
  \ because the other end has gone away) after some time has elapsed with no activity.\
  \ You can disregard these; they usually have nothing to do with the user experience.\n\
  - The third packet is a Reset packet, which is the last packet in the conversation\
  \ stream and was sent to terminate the connection. Again, it has no impact on the\
  \ user experience so you can ignore this.\n- The next series of packets listed with\
  \ a high inter-packet delay were GETs and a POST. These are the start of a new request\
  \ and have occurred because the user clicked on a button or some other action on\
  \ the application. However, the time that expired before these packets appear were\
  \ consumed by the user think time—a period when the user was reading the last page\
  \ and deciding what to do next. These also did not affect the user's response time\
  \ experience and can be disregarded.\n- Finally, Frame # 3691, which is a HTTP/1.1\
  \ 200 OK, is a response from the server to a previous request; this is a legitimate\
  \ response time of 1.9 seconds during which the user was waiting. If this response\
  \ time had consumed more than a few seconds, the user may have grown frustrated\
  \ with the wait and the type of\n\nrequest and reason for the excessive delay would\
  \ warrant further analysis to determine why it took so long.\n\nThe point of this\
  \ discussion is to illustrate that not all delays you may see in a packet trace\
  \ affect the end user experience; you have to locate and focus on just those that\
  \ do.\n\nYou may want to add some extra columns to Wireshark to speed up the analysis\
  \ process; you can right-click on a column header and select Hide Column or Displayed\
  \ Columns to show or hide specific columns:\n\n- **TCP Delta (tcp.time_delta)**:\
  \ This is the time from one packet in a TCP conversation to the next packet in the\
  \ same conversation/stream\n- **DNS Delta (dns.time)**: This is the time between\
  \ DNS requests and responses\n- **HTTP Delta (http.time)**: This is the time between\
  \ the HTTP requests and responses\n\n## Note\n\nYou should ensure that **Calculate\
  \ conversation timestamps** is enabled in the **TCP** option, which can be found\
  \ by navigating to **Edit | References | Protocols**, so that the delta time columns\
  \ will work properly.\n\nWhile you're adding columns, the following can also be\
  \ helpful during a performance analysis:\n\n- **Stream # (tcp.stream)**: This is\
  \ the TCP conversation stream number. You can right-click on a stream number in\
  \ this column, and select **Selected** from the **Apply as a filter** menu to quickly\
  \ build a display filter to inspect a single conversation.\n- **Calc Win Size (tcp.window_size)**:\
  \ This is the calculated TCP window size. This column can be used to quickly spot\
  \ periods within a data delivery flow when the buffer size is decreasing to the\
  \ point where a Zero Window condition occurred or almost occurred.\n\n## Server\
  \ processing time events\n\nOne of the most common causes of poor response times\
  \ are excessively long server processing time events, which can be caused by processing\
  \ times on the application server itself and/or delays incurred from long response\
  \ times from a high number of requests to backend databases or other data sources.\n\
  \nConfirming and measuring these response times is easy within Wireshark using the\
  \ following approach:\n\n1. Having used the sorted **Delta Time** column approach\
  \ discussed in the previous section to identify a legitimate response time event,\
  \ click on the suspect packet and then click on the **Delta Time** column header\
  \ until it is no longer in the sort mode. This should result in the selected packet\
  \ being highlighted in the middle of the **Packet List** pane and the displayed\
  \ packets are back in their original order.\n2. Inspect the previous several packets\
  \ to find the request that resulted in the long response time. The pattern that\
  \ you'll see time and again is:\n   1. The user sends a request to the server.\n\
  \   2. The server fairly quickly acknowledges the request (with a [**ACK**] packet).\n\
  \   3. After some time, the server starts sending data packets to service the request;\
  \ the first of these packets is the packet you saw and selected in the sorted **Delta\
  \ Time** view.\n\nThe time that expires between the first user request packet and\
  \ the third packet when the server actually starts sending data is the **First Byte**\
  \ response time. This is the area where you'll see longer response times caused\
  \ by server processing time. This effect can be seen between users and servers,\
  \ as well as between application servers and database servers or other data sources.\n\
  \nIn the following screenshot, you can see a **GET** request from the client followed\
  \ by an ACK packet from the server 198 milliseconds later (**0.198651** seconds\
  \ in the **Delta Time Displ** column); **1.9** seconds after that the server sends\
  \ the first data packet (**HTTP/1.1 200 OK** in the **Info** field) followed by\
  \ the start of a series of additional packets to deliver all of the requested data.\
  \ In this illustration, a **Time Reference** has been set on the request packet.\
  \ Looking at the **Rel Time** column, it can be seen that **2.107481** seconds transpired\
  \ between the original request packet and the first byte packet:\n\n| Rel Time (formatted)\
  \ | Delta Time Displ | WS Stream # | Source Address | Destination Addr | Info |\n\
  |---|---|---|---|---|---|\n| *REF* | *REF* | 2 | 192.168.1.115 | 10.1.1.125 | GET\
  \ /Orion/NetPerfMon/... |\n| 0.198651 | 0.198651 | 2 | 10.1.1.125 | 192.168.1.115\
  \ | 8080→60351 [ACK] Seq=... |\n| 2.107481 | 1.908830 | 2 | 10.1.1.125 | 192.168.1.115\
  \ | HTTP/1.1 200 OK (PNG) |\n| 2.107671 | 0.000190 | 2 | 10.1.1.125 | 192.168.1.115\
  \ | 8080→60351 [ACK] Seq=... |\n\nIt should be noted that how the First Byte data\
  \ packet is summarized in the **Info** field depends upon the state of the **Allow\
  \ subdissector to reassemble TCP streams** setting in the **TCP** menu, which can\
  \ be found by navigating to **Edit | Preferences | Protocols,**\n\nas follows:\n\
  \n- If this option is disabled, the First Byte packet will display a summary of\
  \ the contents of the first data packet in the Info field, such as HTTP/1.1 200\
  \ OK shown in the preceding screenshot, followed by a series of data delivery packets.\
  \ The end of this delivery process has no remarkable signature; the packet flow\
  \ just stops until the next request is received.\n- If the Allow subdissector to\
  \ reassemble TCP streams option is enabled, the First Byte packet will be summarized\
  \ as simply a TCP segment of a reassembled PDU or similar notation. The HTTP/1.1\
  \ 200 OK summary will be displayed in the Info field of the last data packet in\
  \ this delivery process, signifying that the requested data has been delivered.\
  \ An example of having this option enabled is illustrated in the following screenshot.\
  \ This is the same request/response stream as shown in the preceding screenshot.\
  \ It can be seen in the Rel Time column that the total elapsed time from the original\
  \ request to the last data delivery packet was 2.1097 seconds:\n\n![](img/da40f92928403866599198344271d63e_232_0.png)\n\
  \n## Note\n\nThe Reassemble SMB Transaction payload setting in the SMB protocol\
  \ preferences will affect how SMB and SMB2 responses are summarized in the Info\
  \ field in like fashion to the related setting in the TCP protocol preferences.\n\
  \nIn either case, the total response time as experienced by the user will be the\
  \ time that transpires from the client request packet to the end of the data delivery\
  \ packet plus the (usually) small amount of time required for the client application\
  \ to process the received data and display the results on the user's screen.\n\n\
  In summary, measuring the time from the first request to the First Byte packets\
  \ is the server response time. The time from the first request packet to the final\
  \ data delivery packet is a good representation of the user response time experience.\n\
  \n## Application turn's delay\n\nThe next, most likely source of poor response times—especially\
  \ for remote users accessing applications over longer distances—is a relatively\
  \ high number of what is known as application turns. An app turn is an instance\
  \ where a client application makes\n\n\n\n一个请求以及除此之外没有任何事情发生，直到响应被接收，之后又可以进行另一个请求/响应循环，如此往复。\n\
  \n每个客户端/服务器应用程序都受应用程序轮转效应影响，每次请求/响应循环都会产生一次该效应。一个由于设计不良而在完成任务时施加大量应用轮转的应用程序——通常是由于设计不良——会让终端用户在延迟较高的网络路径上承受较差的响应时间，因为等待这些多次请求和响应在网络中来回传输所花费的时间会累积起来，而且累积得很快。\n\
  \n例如，如果一个应用程序需要 100 次应用程序轮转来完成一个任务，而用户与应用程序之间的**往返时间 (RTT)** 为 50 毫秒（典型的跨国值），则应用轮转延迟将为\
  \ 5 秒：\n\n```\n100 App Turns x 50 ms RTT network latency = 5 seconds\n```\n\n这种应用轮转效应是在任何服务器处理和网络传输延迟之上的额外等待（响应）时间，是\
  \ 5 秒完全浪费的时间。由此产生的更长时间不可避免地会被归咎于网络；网络支持团队断言网络工作正常，而应用程序团队指出应用程序在网络介入之前工作正常。就这样继续下去，因此了解应用轮转效应很重要，了解其原因以及如何衡量和核算它们。\n\
  \nWeb 应用程序由于需要下载一个或多个 CSS 文件、JavaScript 文件以及多个图像来填充页面，因此可能会产生相对较高的应用轮转计数。Web 设计师可以使用技术来减少应用轮转和下载时间，并且现代浏览器允许同时使用多个连接，以便同时处理多个请求，但在更长的网络路径上，其影响仍然可能很显著。许多旧的、遗留的应用程序和微软的\
  \ **Server Message Block (SMB)** 协议也已知会施加较高的应用轮转计数。\n\n除非你知道应用程序轮转存在并且知道如何识别和计数它们，否则在数据包捕获中应用程序轮转的存在和影响并不会直观地显现。你可以在\
  \ Wireshark 中对客户端捕获使用显示过滤器来做到这一点：\n\n```\nip.src == 10.1.1.125 && tcp.analysis.ack_rtt\
  \ > .008 && tcp.flags.ack == 1\n```\n\n你需要将 `ip.src` IP 地址替换为你的服务器地址，并将 `tcp.analysis.ack_rtt`\
  \ 值调整为用户与服务器之间网络路径的 RTT。应用过滤器后，你将看到代表应用程序轮转的数据包显示，并且你可以在 Wireshark 用户界面底部的 **Status\
  \ Bar** 选项中心部分的 **Displayed** 字段中看到总的应用轮转计数。\n\n如果你测量完成任务所需的总时间（第一个请求数据包到最后一个数据交付数据包）并将该时间除以应用程序轮转所花费的时间（应用程序轮转次数\
  \ X 网络 RTT），你就可以得出近似的应用轮转时间百分比：\n\n```\n5 seconds app turns delay / 7.5 seconds\
  \ total response time = 66% of RT\n```\n\n任何超过 25% 的百分比都值得进一步调查，可以采取什么措施来减少 RTT\
  \ 延迟（服务器放置）或应用程序轮转次数（应用程序设计）。\n\n## 网络路径延迟\n\n导致高响应时间的下一个主要原因是网络路径延迟，这会加剧前面章节中讨论的应用轮转效应，并影响数据传输吞吐量以及从丢包中恢复和随后的重传所需的时间。\n\
  \n你可以使用 ICMP ping 数据包来测量客户端和服务器之间的网络路径延迟，但你也可以通过数据包捕获来确定此延迟，通过测量 TCP 三次握手过程中客户端\
  \ SYN 数据包到服务器 SYN、ACK 响应的时间，如以下客户端捕获图所示：\n\n![](img/da40f92928403866599198344271d63e_234_0.png)\n\
  \n在服务器端捕获中，从 SYN、ACK 到客户端 ACK 的时间（三次握手中的第三个数据包）也反映了 RTT。实际上，从任何捕获点来看，从第一个 SYN 数据包到第三个\
  \ ACK 数据包的时间也是 RTT 的良好表示，前提是握手过程中客户端和服务器的响应时间很小。请注意，服务器对 SYN 数据包的响应时间虽然通常很短，但在高负载期间可能比正常情况更长，并会影响此测量。\n\
  \n高网络路径延迟本身并不是错误条件，但显然会像前面讨论的那样对应用程序通过网络的运行产生不利影响。\n\n## 带宽拥塞\n\n带宽拥塞通过延长在网络路径上传输给定数据量所需的时间来影响应用程序的性能；对于通过繁忙的\
  \ WAN 链路访问应用程序服务器的用户来说，这些影响可能变得很显著。网络支持团队应该能够为路径中的 WAN 链路生成带宽使用和可用性报告以检查这种可能性，但你也可以通过使用正确配置的\
  \ Wireshark IO Graph 在较大数据传输期间查看网络吞吐量来寻找带宽拥塞的证据。\n\n以下屏幕截图说明了一个受限带宽影响的数据传输；在 2.5\
  \ Mbps 标记处出现平坦化（此示例中的总带宽可用性），因为没有更多带宽可用以支持更快的传输，这一点清晰可见：\n\n![](img/da40f92928403866599198344271d63e_236_0.png)\n\
  \n你可以通过按如下方式配置图表，从 IO Graph 中以 **每秒比特数 (bps)** 确定峰值数据传输速率：\n\n- **X Axis Tick interval:**\
  \ 1 sec\n- **Y Axis Unit:** Bits/tick\n- **Graph 2 Filter:** `ip.dst == <IP address\
  \ of server>`\n- **Graph 4 Filter:** `ip.src == <IP address of server>`\n\n这些设置会在客户端到服务器（红色）和服务器到客户端（蓝色）方向上生成准确的每秒比特数网络吞吐量显示。**X\
  \ Axis** 面板中的 **Pixels per tick** 选项、**Y Axis** 面板中的 **Scale** 选项和其他设置可以根据需要进行修改以获得最佳显示，而不会影响测量的准确性。\n\
  \n请注意，大多数现代应用程序可以在短时间内产生数兆比特的峰值带宽需求（在不受限制的链路上）。网络路径上的 WAN 链路应具有足够的空闲容量来满足这些短期需求，否则响应时间将相应受损。这是重要的性能考虑因素。\n\
  \n## 数据传输\n\n有一些 TCP 数据传输效应会影响应用程序性能；这些可以在 Wireshark 中进行分析。\n\n### TCP StreamGraph\n\
  \nWireshark 提供 TCP StreamGraphs 来分析几个关键的数据传输指标，包括：\n\n- **Round-trip time**: 此图绘制从数据包到相应\
  \ ACK 数据包的 RTT。\n- **Throughput**: 这些以每秒字节数绘制吞吐量。\n- **Time/sequence (Stevens-style)**:\
  \ 这可视化随时间推移的基于 TCP 的数据包序列号（以及传输的字节数）。理想的图表以平滑的方式从左下角流向右上角。\n- **Time/sequence (tcptrace)**:\
  \ 这与 Stevens 图类似，但提供更多信息。数据包以 I-bar 显示表示，其中 I-bar 越高，表示发送的数据越多。还显示了一个灰色条，表示接收窗口大小。当灰色条更接近\
  \ I-bar 时，接收窗口大小减小。\n- **Window Scaling**: 此图绘制接收窗口大小。\n\n### Note\n\nTCP StreamGraphs\
  \ 是单向的。你需要为传输数据的方向选择一个数据包以获得正确的视图。\n\n这些分析图可以通过在数据包列表窗格中选择 TCP 流中的一个数据包，然后从 Statistics\
  \ 菜单中选择 TCP StreamGraph，然后选择 Time-Sequence Graph（tcptrace）等选项来使用。\n\n所选图表和控制窗口将从控制窗口的\
  \ Graph type 选项卡出现，你可以在其中选择其他类型的分析图表，如以下屏幕截图所示：\n\n\n\n![](img/da40f92928403866599198344271d63e_238_0.png)\n\
  \n以下截图中显示的 **Time/Sequence Graph (tcptrace)** 会随着数据传输的进行绘制序列号的增长情况，以及灰色的接收窗口大小线：\n\
  \n![](img/da40f92928403866599198344271d63e_239_0.png)\n\n你可以通过在图表上点击并拖动鼠标来放大特定区域，或按\
  \ + 键放大、按 - 键缩小。在任意图表上点击一个点会跳转到 Wireshark 的 Packet List 窗格中对应的数据包。\n\n## IO Graph\n\
  \n你还可以通过将 TCP 分析显示过滤器字符串应用到 Wireshark 的 IO Graph 来分析 TCP 问题对网络吞吐量的影响，例如：\n\n```\n\
  tcp.analysis.flags && !tcp.analysis.window_update\n```\n\n在以下慢速 SMB 数据传输的截图中，可以看到红色线条中的多个\
  \ TCP 问题（本例中为丢包、重复 ACK 和重传）对应于吞吐量（黑色线条）的下降：\n\n![](img/da40f92928403866599198344271d63e_240_0.png)\n\
  \n在 IO Graph 上点击一个点会跳转到 Wireshark 的 **Packet List** 窗格中对应的数据包，以便你调查该问题。\n\n## IO\
  \ Graph – Wireshark 2.0\n\nWireshark 2.0，也称为 Wireshark Qt，是 Wireshark 版本历史中的一个重大变化，因为它从\
  \ GTK+ 用户界面库过渡到 Qt，以提供对所支持平台更好的持续 UI 覆盖。大多数 Wireshark 功能和用户界面控件基本保持不变，但 IO Graph\
  \ 发生了变化。\n\n下图显示了这些变化，其中显示了与前一张截图中相同的 TCP 问题：\n\n![](img/da40f92928403866599198344271d63e_241_0.png)\n\
  \n新的 IO Graph 窗口具有添加任意多条线条的能力（使用 + 键），以及放大图表线条的能力，还可以保存图表为图像或 PDF 文档。\n\n## Summary\n\
  \n本章涵盖的主题包括故障排除方法，如何使用 Wireshark 排除连接性和功能性问题，性能分析方法，以及导致应用性能不佳的五大主要原因以及如何使用 Wireshark\
  \ 分析这些原因。\n\n在下一章中，我们将回顾一些常见的恶意流量类型和来源，并介绍安全专业人员如何使用 Wireshark 检测这些威胁。\n\n## Security\
  \ analysis methodology\n\n在数据包层面的安全分析基于检测和分析可疑流量，即由于存在不寻常的协议类型或端口，或不寻常的请求、响应或数据包频率而不符合正常模式的流量。可疑流量可能包括侦察（发现）扫描、回连行为、拒绝服务攻击、僵尸网络命令，或来自直接攻击或病毒/僵尸网络代理的其他类型行为。\n\
  \nWireshark 捕获网络中的战略位置，以调查来自特定主机的可疑数据包，或在网络段和出口点上的数据包，这也可以补充可能已部署以提醒 IT 人员注意可疑流量的任何\
  \ **Intrusion Detection System (IDS)** 系统。\n\n## The importance of baselining\n\n\
  如果你拥有正常情况的基线，就能更容易识别出需要调查的异常流量模式与由行为不佳的应用、配置错误或故障设备引起的流量。基线是与主要应用和服务器的典型会话以及它们所在网络段上的背景流量的快照捕获。在潜在的安全入侵情况下，你可以将基线中的正常协议、流量模式和用户会话与当前捕获进行比较，过滤掉正常流量，然后检查差异。\n\
  \n为了在安全分析中允许基线比较，你需要定期捕获并存储数据包跟踪文件，覆盖足够长的时间以提供典型用户和背景流量模式的良好样本，同时保持文件大小在 Wireshark\
  \ 中可管理，例如每个文件 100 MB 到 1 GB。你可以在 Wireshark 的 Capture Options 窗口中配置 Ring Buffer 选项，以保存一系列合理大小的文件用于更长时间的捕获或更繁忙的网络段。\n\
  \n尽管你的基线需求和实践取决于你的环境，但应检查的一些流量方面包括：\n\n- Broadcast and multicast types and rates:\n\
  \  - What devices and applications are using broadcasts and multicasts?\n  - What\
  \ are the typical broadcast and multicast packet rates?\n- Applications and protocols:\n\
  \  - What applications are running over the network?\n  - What protocols and ports\
  \ are they using?\n  - Application launch sequences and typical tasks\n  - Are application\
  \ sessions encrypted?\n  - Are all users forced to use encryption? Any exceptions?\n\
  \  - What are the login/logout sequences and dependencies?\n- Routing protocol(s)\
  \ and routing updates\n- ICMP traffic\n- Boot-up sequences\n- Name resolution sessions\n\
  - Wireless connectivity includes normal management, control, and data frame contents\n\
  - VoIP and video communications\n- Idle time traffic is the host communicating with\
  \ other hosts when there are no users\n- What backup processes are running at night\
  \ and for how long?\n- Are there any suspect protocols or broadcasts/scans taking\
  \ place?\n\n在检查基线捕获时，有助于查看正在使用的协议摘要，可通过从 Wireshark 的 **Statistics** 菜单中选择 **Protocol\
  \ Hierarchy** 来实现。例如在以下截图中，你可以看到存在一些 **Internet Relay Chat (IRC)** 流量，以及 **Trivial\
  \ File Transfer Protocol (TFTP)** 流量，这两者在你的网络上可能并不正常，可能表明与外部实体的非法通信：\n\n![](img/da40f92928403866599198344271d63e_246_0.png)\n\
  \n分析正常流量水平和模式的基线也是熟悉你的网络环境及其典型数据包流和协议的绝佳方式，这能更好地帮助你发现异常流量。\n\n## Security assessment\
  \ tools\n\n安全专业人员用于执行安全评估和漏洞测试的流行工具有几种。由于这些工具可以生成与黑客和恶意代理可能使用的扫描、指纹识别和其他利用活动相同类型的活动，因此它们对数据包分析人员很有用，可以使用\
  \ Wireshark 分析它们生成的数据包，以熟悉不同类型活动在数据包跟踪中的表现，并构建显示过滤器来检测它们。\n\n其中最受欢迎的工具之一是 **Network\
  \ Mapper (Nmap)**，这是一款用于网络发现和安全审计的免费开源实用程序。Nmap 运行于所有主要计算机操作系统，并提供命令行和 GUI 版本（**Zenmap**）。\n\
  \n### Note\n\n你可以在 http://nmap.org 找到有关 Nmap 的更多信息，有关其他顶级安全工具的信息可以在 http://sectools.org\
  \ 找到。\n\n## Identifying unacceptable or suspicious traffic\n\nWireshark 可用于识别网络流量中的不寻常模式或数据包内容，包括网络扫描、格式错误的数据包，以及不应在你的网络上运行的不寻常协议、应用和/或会话。以下是可能不可接受和/或需要调查以验证其在你的环境中合法性的流量类型的一般列表：\n\
  \n- **MAC or IP address scans**: 这些尝试识别网络上的活动主机\n- **TCP or UDP port scans**: 这些尝试识别活动应用和服务\n\
  \nIP 地址和端口扫描可以由网络管理应用程序生成，以构建或维护其要监控/管理的设备和应用列表，但这通常是这些类型流量的唯一合法来源。\n\n- **Clear\
  \ text passwords**: 这些是你可以在 Wireshark 的 Packet Details 或 Packet Bytes 字段中看到的密码。这些对于\
  \ File Transfer Protocol (FTP) 登录是典型的，但在其他地方则不典型或不可接受。\n- **Clear text data**: 这是可在数据包负载中读取的数据。这对于\
  \ HTTP 请求和响应是典型的，并在应用服务器到数据库的请求和响应中常见，但这些数据库交换应在隔离的非公共网络段之间进行，并且在物理上安全的环境中。\n- **Password\
  \ cracking attempts**: 这些是从单个设备发出的重复、系统的尝试以发现有效的密码。\n- **Maliciously formed packets**:\
  \ 这些是协议字段中包含故意无效或格式不正确的数据的包，旨在利用应用中的漏洞。\n- **Phone home traffic**: 这是可能驻留在服务器或工作站上的\
  \ rogue 代理发出的流量，会定期与远程（通常在网络外）主机进行检查。\n- **Flooding or Denial of Service (DOS) attacks**:\
  \ 这是以非常高的每秒数据包速率故意发送到一个或多个主机的流量，试图用大量流量淹没主机或网络，以至于其他人无法访问其服务。\n- **Subversive activities**:\
  \ 这些包括为准备和\n\n\n促成中间人攻击，即设备被诱骗将数据包发送到恶意主机，以截获数据。\n\n这只是你可能会在网络上看到的恶意流量类型的一个示例；网络安全是一个不断演变的攻防过程，攻击手段日益复杂，随之而来的对抗措施也在不断升级。\n\
  \n随着你安全分析技能的提升，你可能会想在 Wireshark 中构建一个特殊的安全配置文件，其中包含基于显示过滤器的数据包着色规则，以帮助识别可疑或畸形数据包，以及一组**过滤表达式按钮**，用于隔离并显示你可能正在寻找的各种可疑流量。\n\
  \n以下是一些用于隔离和检查可疑数据包的显示过滤器示例：\n\n| 过滤器描述 | 显示过滤字符串 |\n|---|---|\n| 检测 ICMP ping 及可能的\
  \ ping 扫描 | `icmp.type == 8 || icmp.type == 0` |\n| ICMP 目标不可达过滤器（包含重定向） | `(icmp.type\
  \ >= 3 && icmp.type <= 5) || icmp.type == 11 || (icmpv6.type >= 1 && icmpv6.type\
  \ <= 4)` |\n| 异常的 ICMP 回显请求 | `(icmp.type == 8) && !(icmp.code == 0x00)` |\n| TCP\
  \ 握手可用于检测 TCP 扫描，也可检查正常的会话建立/拆除/重置 | `(tcp.flags&02 && tcp.seq==0) || (tcp.flags&12\
  \ && tcp.seq==0) || (tcp.flags.ack && tcp.seq==1 && !(tcp.nxtseq > 0 && !tcp.ack\
  \ >1)) || tcp.flags.fin == 1 || tcp.flags.reset ==1` |\n| 检测 Xmas 扫描（设置了 URG、FIN\
  \ 和 PUSH 标志） | `tcp.flags == 0x029` |\n| 其他可疑的 TCP 设置：TCP SYN/ACK 且窗口大小大于 1025，设置了\
  \ SYN、FIN、PSH、URG 位，未设置 TCP 标志，TCP 最大分段大小小于 1460 | `((tcp.flags == 0x02) && (tcp.window_size\
  \ < 1025)) || tcp.flags == 0x2b || tcp.flags == 0x00 || tcp.options.mss_val < 1460`\
  \ |\n| **互联网中继聊天（IRC）**流量（这在你的网络中正常吗？） | `tcp.port == 194 || (tcp.port >= 6660 &&\
  \ tcp.port <= 6669) || tcp.port == 7000` |\n| 大量 DNS 应答（可能是命令与控制服务器列表） | `dns.count.answers\
  \ > 5` |\n\n## 扫描与探测\n\n恶意程序和流氓进程可能会在发起攻击之前，使用各种扫描手段探查网络环境中的可用端口和主机。识别这些侦察过程的存在，可以在攻击发起之前加以阻止，并能够追踪和/或阻断恶意活动的来源——尤其是当来源位于公司内部时（这种情况确实存在）。\n\
  \n### ARP 扫描\n\nARP 扫描（也称为 ARP 探测）用于发现网段中的活动主机。除非你应用显示过滤器，并观察到来自同一设备的稳定、递增的扫描，否则\
  \ ARP 探测很难被察觉，如下图所示：\n\n![](img/da40f92928403866599198344271d63e_252_0.png)\n\n\
  由于 ARP 数据包无法穿过路由器，因此发起 ARP 探测的源设备必须与观察到 ARP 数据包的网段处于同一网段。\n\n### ICMP ping 探测\n\n\
  ICMP ping 探测用于发现本地或远程网段中的活动主机（因为 ICMP 使用 IP 且可路由），其原理是对一段 IP 地址范围发送 ICMP Type 8\
  \ 回显请求并接收 Type 0 回显应答。你可以使用显示过滤器 `icmp.type == 8 || icmp.type == 0` 轻松检测 ping 探测。\n\
  \n### TCP 端口扫描\n\nTCP 端口扫描使恶意代理能够发现目标主机上哪些 TCP 端口处于开放状态。网络端口是服务器或工作站的入口点；监听特定端口的服务能够处理来自客户端的请求。恶意代理有时会利用服务器代码中的漏洞来获取敏感数据或在机器上执行恶意代码，这就是为什么在所有安全验证中，测试所有活动端口是必不可少的原因。\n\
  \n一些用于 TCP 服务的最常见端口包括：\n\n- 80 HTTP\n- 443 HTTPS\n- 8080 HTTP 代理\n- 8000 HTTP 备用\n\
  - 21 FTP\n- 22 SSH\n- 23 Telnet\n- 3389 Microsoft 远程桌面\n- 5900 VNC\n- 25 SMTP\n\
  - 110 POP3\n- 143 IMAP\n- 3306 MySQL\n- 1433 Microsoft SQL Server\n- 1720 H.323\n\
  - 5060 SIP\n\nTCP 端口扫描设备会向目标主机的某个端口发送 TCP SYN 数据包，目标主机将做出响应：如果端口开放，则返回 SYN 或 ACK；如果端口关闭，则返回\
  \ RST。与 ARP 扫描类似，TCP 扫描可以通过来自单一 IP 地址、发往目标 IP 地址、覆盖一系列端口号的多个 SYN 数据包来检测。使用显示过滤器可以更轻松地检测此类扫描：\n\
  \n```\nip.dest == <IP Address of target host> && tcp.flags.syn\n```\n\n前面所述的 OS\
  \ 检测活动的一个 Wireshark 抓包示例中，包含一个运行的 OS 指纹识别脚本，该脚本向目标设备（172.20.0.1）发送了一个伪造的 HTTP 请求，请求路径为\
  \ /nice%20ports%2C/Tri%6Eity.txt%2ebak，以查看生成的错误响应具体是什么类型，从而帮助确定 OS 版本：\n\n| 编号 |\
  \ 时间 | 源 | 目的 | 源端口 | 目的端口 | 协议 | 长度 | 信息 |\n|---|---|---|---|---|---|---|---|---|\n\
  | 2693 | 16.260887 | 172.20.14.246 | 172.20.0.1 | 2403 | 8080 | HTTP | 107 | GET\
  \ /nice%20ports%2C/Tr%6Eity.txt%2Ebak HTTP/1.0 |\n| 2694 | 16.262351 | 172.20.0.1\
  \ | 172.20.14.246 | 8080 | 2403 | TCP | 60 | 8080->2403 [ACK] Seq=1 Ack=54 win=13080\
  \ Len=0 |\n| 2695 | 16.262403 | 172.20.0.1 | 172.20.14.246 | 8080 | 2403 | TCP |\
  \ 206 | [TCP 段（已重组的 PDU）] |\n| 2697 | 16.263793 | 172.20.0.1 | 172.20.14.246 | 8080\
  \ | 2403 | HTTP | 990 | HTTP/1.0 200 OK (text/html) |\n\n从前述请求返回的 HTML 响应的确切格式可用于识别\
  \ OS 和/或 Web 服务器版本，如以下 Wireshark 数据包详细信息截图所示：\n\n```\nLine-based text data: text/html\n\
  <html>\\r\\n<head>\\r\\n<title>Error</title>\\r\\n</head>\\r\\n<body topmargin=1\
  \ leftmargin=1 marginheight=1 marginwidth=1 bgcolor=\"orange\" text=\"black\">\\\
  r\\n<font size=\"+2\">An error occurred. <br> </font>\\r\\n<font size=\"+1\">\\\
  r\\nThis http server can only serve URL requests for ufdBGuard <br>\\r\\nredirection\
  \ messages and does not understand the URL. <br>\\r\\nURL: <tt>/nice%20ports%2C/Tr%6Eity.txt%2Ebak</tt>\
  \ <br>\\r\\nMost likely the configuration of \"redirect\" statements is incorrect.\
  \ It should include \"/cgi-bin/URLblocked.cgi\". <br>\\r\\n</font>\\r\\n</body>\\\
  r\\n</html>\\r\\n<!-- Long comment to disable MSIE and chrome so-called friendly\
  \ error page -->\\r\\n\n```\n\n分析这类 OS 指纹识别请求和响应的数据包捕获，将更容易发现来自恶意实体的类似活动。\n\n##\
  \ 畸形数据包\n\n恶意构造的畸形数据包通过有意篡改网络协议中数据字段的内容，利用操作系统和应用程序的漏洞。这些漏洞可能导致系统崩溃（一种拒绝服务形式），或强制系统执行任意代码。\n\
  \n畸形数据包漏洞的一个示例是 Cisco 安全公告 cisco-sa-20140611-ipv6，其中某个系列路由器在解析畸形 IPv6 数据包时存在漏洞，可能导致承载网络流量的某块板卡重载（重启），从而间歇性造成服务中断。\n\
  \n此类漏洞的另一个示例是某些未打补丁的 Windows 或 Linux 系统，如果它们收到一系列分片相互重叠的数据包，系统将会崩溃。\n\n畸形数据包的类型和可能性无穷无尽，但漏洞通常会在被发现时公布，有些漏洞公告还会提供数据包详情。你可以在\
  \ Wireshark 中构建显示过滤器和/或着色规则来检测这些数据包。同时，学习和了解不同协议字段正常且合法的取值范围，以及 TCP 和其他协议序列的正常样态，也有助于你在数据包流中发现可疑内容。\n\
  \n\n\n\n## 密码破解流量\n\n密码破解流量可以通过观察目标主机发出的大量错误消息来检测，这些消息指向一个客户端，该客户端反复且不成功地尝试登录。密码破解尝试大致有两种类型：\n\
  \n- 字典攻击使用常见单词、姓名和数字的列表\n- 暴力破解攻击使用字符、数字和键值的序列\n\n这两种类型通常都会被登录安全措施所挫败，这些措施会在短时间内多次登录失败后锁定账户。\n\
  \n## 异常流量\n\n虽然很难预料黑客可能使用何种方法来渗透网络或主机，但有一些事情在正常健康的网络上几乎不应该发生。由于 ICMP 数据包在测试和传达错误条件方面很有用，因此它们很可能是恶意重定向的目标。由于\
  \ TCP 是大多数应用程序使用的主要传输协议，因此您应该注意 TCP 头或负载中的异常情况，这可能是恶意意图的迹象。\n\n以下表格中讨论了一些需要留意的异常示例：\n\
  \n| 可疑内容 | 描述 |\n|---|---|\n| TCP 错误标志 | TCP 标志的非法或不太可能的组合。SYN、SYN/ACK、ACK、PSH、FIN\
  \ 和 RST 标志在适当位置使用时是正常的；其他情况都值得调查。 |\n| SYN 数据包包含数据 | 初始 TCP SYN 数据包绝不应该包含负载数据；它仅用于建立会话。注意，TCP\
  \ 中的第三个 ACK 数据包可以包含数据。 |\n| 可疑数据报负载内容 | 对操作系统或其他非应用程序目录的引用、奇怪的可执行文件，或其他似乎与用于发送数据的应用程序目的不符的负载数据。\
  \ |\n| 可疑 ping 负载文本 | 用于填充 ICMP Echo Request 数据包负载的文本通常是无害的字母和数字的顺序序列或类似无意义的文本。如果此文本似乎携带命令或有意义的数据，则值得调查。\
  \ |\n| FTP 或 Telnet 会话中的明文密码 | 看到使用 FTP 传输敏感业务数据，或使用 Telnet 管理交换机和路由器，并不是黑客的恶意意图。这是员工的疏忽做法，因为这两种协议按设计会通过网络以明文形式传输登录\
  \ ID 和密码，使得即使是不 sophisticated 的黑客也很容易捕获它们。Web 上为所有平台提供了安全 FTP（sftp）和安全 Shell（SSH）（Telnet\
  \ 替代方案）解决方案。 |\n\n## 总结\n\n本章关于安全分析的主题包括检测扫描和探测以识别计划攻击的目标、操作系统指纹识别、检测畸形数据包、以及可疑地分片或乱序发送的数据包、恶意代理的回连流量、识别密码破解尝试，以及识别其他异常数据包和负载。\n\
  \n在下一章中，我们将回顾 Wireshark 安装中提供的多个关键命令行实用程序，以及一些可以补充您工具集的其他数据包分析工具。\n"
- "## 第 8 章 命令行和其他实用程序\n\nWireshark 包含许多命令行实用程序，用于操作数据包跟踪文件并提供无需 GUI 的数据包捕获，还有一些其他工具可以帮助完善您的分析工具集。\n\
  \n本章将涵盖的主题包括：\n\n- 使用 Dumpcap 和 Tshark 捕获流量\n- 使用 Editcap 编辑跟踪文件\n- 使用 mergecap\
  \ 合并跟踪文件\n- 其他有用的工具\n\n## Wireshark 命令行实用程序\n\n安装 Wireshark 时，还会安装一系列命令行工具，包括：\n\
  \n- `capinfos.exe`：此命令打印跟踪文件的信息\n- `dumpcap.exe`：此命令捕获数据包并保存为 libpcap 格式文件\n- `editcap.exe`：此命令拆分跟踪文件、更改时间戳并删除重复数据包\n\
  - `mergecap.exe`：此命令将两个或多个数据包文件合并为一个文件\n- `rawshark.exe`：此命令读取数据包流并打印字段描述\n- `text2pcap.exe`：此命令读取\
  \ ASCII 十六进制转储并写入 libpcap 文件\n- `tshark.exe`：此命令捕获网络数据包或显示保存的跟踪文件中的数据\n\n`Wireshark.exe`\
  \ 文件启动您熟悉的 GUI 版本，但您也可以使用多个参数从命令行启动 Wireshark；输入 `Wireshark -h` 查看选项列表和/或创建快捷方式以使用这些选项中的任何一个启动\
  \ Wireshark。\n\n### Note\n\n将 Wireshark 程序目录添加到系统的 `PATH` 语句中非常有帮助，这样您就可以从任何工作目录执行任何命令行实用程序。\n\
  \n## 使用 Tshark 捕获流量\n\nTshark 可用于捕获网络数据包和/或显示来自捕获或先前保存的数据包跟踪文件的数据；数据包可以显示在屏幕上或保存到新的跟踪文件。\n\
  \n使用 Dumpcap 执行基本捕获时使用的相同语法也适用于 Tshark，因此我们在此不重复。然而，Tshark 提供了非常广泛的额外功能，相应的命令行选项数量很多，可以像所有\
  \ Wireshark 实用程序一样，通过在命令提示符中输入 `tshark -h` 来查看。\n\n许多 Tshark 选项用于查看统计信息；以下屏幕截图说明了命令语法示例以及从捕获中获得的统计结果（在按\
  \ Ctrl + C 结束捕获后）：\n\n![](img/da40f92928403866599198344271d63e_267_0.png)\n\n##\
  \ 使用 Mergecap 合并跟踪文件\n\n您可以使用 Mergecap 将两个或多个跟踪文件合并为一个文件。基本语法如下：\n\n```\nmergecap\
  \ -w <outfile.pcapng> infile1.pcapng infile2.pcapng …\n```\n\n例如：\n\n```\nmergecap\
  \ -w merged.pcap source1.pcapng source2.pcapng\nsource3.pcapng\n```\n\n一个有时可能想要在\
  \ Mergecap（以及其他几个命令行实用程序）中使用的有用选项是 -s <snaplen>。这将在每个帧开始后的指定长度处截断数据包，从而生成更小的文件；<snaplen>\
  \ 的典型值为 128 字节：\n\n```\nmergecap -w merged_trimmed.pcapng -s 128 source1.pcapng\n\
  source2.pcapng\n```\n\n## Mergecap 批处理文件\n\n如果要合并的捕获文件具有多种命名格式，您可以创建一个 `MergeTraces.bat`\
  \ 文件，其中包含以下 Windows 批处理命令：\n\n```\n```bat\n@echo off\ncls\necho MergeTraces.bat\n\
  echo.\necho Merges multiple packet trace files with a .pcapng extension into one\
  \ .pcapng file\necho.\necho Usage: Copy MergeTraces.bat into the directory with\
  \ the .pkt files and execute\necho The utility will generate a 'MergedTraces.pcap'\
  \ file\necho and a 'MergedFileList.txt' file which lists the .pcapng files processed.\n\
  echo.\necho.\necho IMPORTANT!! You must type 'CMD /V:ON' from this window which\
  \ enables\necho 'Delayed environment variable expansion' in order to properly execute\n\
  echo this batch utility.\necho.\necho You must also add the path to Wireshark's\
  \ mergecap.exe to your path statement.\necho.\necho If you've not done this, Type\
  \ Ctrl-C to exit; Otherwise pause\necho.\necho Deleting old MergedFileList.txt...\n\
  if exist \"MergedFileList.txt\" del MergedFileList.txt\nfor %%f in (*.pcap-ng) do\
  \ echo \"%%f\" >> MergedFileList.txt\necho Deleting old MergedTraces.pcapng...\n\
  if exist \"MergedTraces.pcapng\" del MergedTraces.pcapng\necho Preparing to merge:\n\
  echo.\ntype MergedFileList.txt\necho.\necho Merging..........\nset FILELIST=\nfor\
  \ %%f in (*.pcap-ng) do set FILELIST=!FILELIST! %%f\n:: DEBUG\n:: echo %FILELIST%\n\
  ```\n```\n\n```\n mergecap -w MergedTraces.pcapng %FILELIST%\n echo.\n if exist\
  \ MergedTraces.pcapng @echo Done!\n if NOT exist MergedTraces.pcapng @echo Error!!\
  \ -- Check your\n settings.\n echo.\n```\n\n将批处理文件复制到仅包含要合并的数据包跟踪文件的目录中并执行它。批处理文件将把所有\
  \ .pcapng 文件合并为一个名为 `MergedTraces.pcapng` 的文件。这比尝试在命令行中指定一长串唯一的源文件要容易得多，特别是如果文件名包含日期时间戳。如果需要处理\
  \ .pcap 文件，请在批处理命令中将所有 .pcapng 实例更改为 .pcap；您也可以按需更改输出文件名。\n\n### Note\n\n您也可以通过将文件点击并拖放到\
  \ Wireshark 桌面上来合并跟踪文件。文件将在选择 Wireshark **File** 菜单中的 **Merge** 后根据其时间戳按时间顺序合并。只要总文件大小不超过\
  \ 1GB，此方法效果相当不错。\n\n您可以在 https://www.wireshark.org/docs/man-pages/mergecap.html\
  \ 获取更多 Mercgecap 选项的信息和示例。\n\n\n\n\n\n## 其他有用的工具\n\nWireshark 是一个极其通用且有用的工具。然而，有些事情它做起来并不容易，甚至完全无法完成，因此我们将讨论一些你可能希望加入分析工具集的其他工具。\n\
  \n### HttpWatch\n\nHttpWatch 是一款基于数据包的性能分析工具，可与 Internet Explorer 和 Firefox 浏览器集成，以图形化方式显示浏览器与网站之间\
  \ HTTP 交互的统计值。这类工具使用户能够轻松发现和测量重大延迟发生的时间及其来源。\n\n以下截图展示了通过加载 www.wireshark.org 主页获得的\
  \ HttpWatch 可视化和数值分析结果：\n\n![](img/da40f92928403866599198344271d63e_275_0.png)\n\
  \n你可以从 http://www.httpwatch.com/ 获取有关 HttpWatch 的更多信息。此外，Fiddler 也是一款类似的性能分析工具，可在\
  \ http://www.telerik.com/fiddler 找到。\n\n### SteelCentral Packet Analyzer 个人版\n\n\
  SteelCentral Packet Analyzer（以前称为 Cascade Pilot）提供标准版和个人版两个版本。与 Wireshark 不同，该工具能够打开并分析数\
  \ GB 大小的跟踪文件；你可以快速隔离感兴趣的会话，右键单击该会话，将其保存为单独的报文跟踪文件，或者直接从同一菜单启动 Wireshark 并将该会话传递给它。\n\
  \n此外，该工具还提供了多种称为**视图**的网络分析屏幕，可从各种性能角度提供图形显示和报告。以下截图展示了一组**MAC 概览**视图：\n\n![](img/da40f92928403866599198344271d63e_278_0.png)\n\
  \n有关 SteelCentral Packet Analyzer 产品的更多信息，请访问 [http://www.riverbed.com/products/performance-management-control/network-performance-management/packet-analysis.html](http://www.riverbed.com/products/performance-management-control/network-performance-management/packet-analysis.html)。\n\
  \n### AirPcap 适配器\n\n如果你使用 Wireshark 分析无线网络，就需要一个无线适配器，它能够查看所有可用信道，并提供 Radiotap\
  \ 报头，该报头为每个帧提供附加信息，例如无线电信道和信噪比强度。\n\n在 Windows 平台上，与 Wireshark 或 SteelCentral Packet\
  \ Analyzer 配合使用的主流无线适配器是 **Riverbed AirPcap 适配器**，可从 Riverbed 网站获取。AirPcap 适配器插入\
  \ USB 端口，并包含与 Wireshark 集成并提供 Radiotap 报头信息的驱动程序。有多种产品型号可供选择，覆盖范围逐步扩展至不同 WLAN 频段；其中\
  \ AirPcap Nx 覆盖范围最广。下图展示了其中两款适配器：\n\n![](img/da40f92928403866599198344271d63e_279_0.png)\n\
  \n有关 Riverbed AirPcap 适配器的更多信息，请访问 http://www.riverbed.com/products/performance-management-control/network-performance-management/wireless-packet-capture.html。\n"
- '## 第 2 部分 模块 2


  ### 使用 Wireshark 进行网络分析实战手册


  超过 80 个使用 Wireshark 分析和排查网络问题的实战方案

  '
- "### 第 1 章 认识 Wireshark\n\n在本章中，你将学习：\n\n- 定位 Wireshark\n- 启动数据捕获\n- 配置启动窗口\n- 使用时间值和摘要\n\
  - 配置着色规则和导航技术\n- 保存、打印和导出数据\n- 在**首选项**菜单中配置用户界面\n- 配置协议首选项\n\n#### 简介\n\n在本章中，我们将介绍与\
  \ Wireshark 相关的基本任务。在本书的前言中，我们讨论了网络故障排除以及在该过程中可以提供帮助的各种工具。在得出需要使用 Wireshark 协议分析器的结论后，现在是时候在网络中定位它，进行基本配置，并使其更加用户友好。\n\
  \n虽然将 Wireshark 设置为基本数据捕获被认为非常简单直观，但在特殊情况下我们可以使用许多选项；例如，当我们通过连接连续捕获数据并希望将捕获文件拆分为多个小文件时，或者当我们希望查看参与连接的设备名称而不仅仅是\
  \ IP 地址时，等等。在本章中，我们将学习如何为这些特殊情况配置 Wireshark。\n\n另一个重要问题是在哪里放置 Wireshark 来捕获数据。应该在防火墙之前还是之后？应该连接到路由器的哪一侧？在局域网侧还是广域网侧？在每一侧我们应该预期收到什么？所有这些问题以及更多内容都将在本章的“定位\
  \ Wireshark”方案中介绍，并附上如何操作的建议。\n\n本章将涉及的另一个重要问题是如何配置时间值，即你希望 Wireshark 如何呈现捕获数据包的到达时间。当我们捕获对时间敏感的应用程序的数据时，这一点非常重要，此时查看\
  \ TCP 连接或 UDP 流中数据包的时序至关重要。\n\n下一个方案将介绍文件操作，即如何保存捕获的数据，无论是保存全部还是部分数据、仅保存过滤后的数据、将数据导出为各种格式、合并文件（例如，当你想要合并两个不同路由器接口上的捕获文件时）等等。\n\
  \n本章还将讨论的一个问题是如何配置着色规则。也就是说，如何配置 Wireshark 以不同的颜色呈现不同的数据包和协议。虽然 Wireshark 默认具有自己的着色方案，但我们可能希望针对特殊情况进行配置，例如，为我们监控的特定协议或预期的特定错误或事件赋予特殊颜色。“配置着色规则和导航技术”方案将讨论这些问题。\n\
  \n本章的最后两个方案将介绍 Wireshark 首选项的配置。这些方案讨论如何配置用户界面，即配置 Wireshark 窗口、列以及每个列中显示的内容、文本格式等，同时还包括特定的协议配置；例如，默认应将哪些\
  \ TCP 端口解析为代理服务、是否验证协议校验和、是否计算 TCP 时间戳、如何解码协议头中的字段等。\n\n#### 定位 Wireshark\n\n在理解问题并决定使用\
  \ Wireshark 之后，第一步将是决定将其放置在哪里。为此，我们需要一份精确的网络拓扑图（至少是与我们的测试相关的网络部分）。\n\n其原则是找到你想要监控的设备，将你的笔记本电脑连接到该设备所连接的同一台交换机，并为被监控设备配置端口镜像或端口监控。此操作使您能够看到进出被监控设备的所有流量。\n\
  \n你可以监控局域网端口、广域网端口、服务器或路由器端口，或连接到网络的任何其他设备。\n\n![](img/da40f92928403866599198344271d63e_285_0.png)\n\
  \n在上图中，Wireshark 软件（安装在左侧的 PC 上）和端口镜像（也称为端口监控，按图中方向配置在交换机上）将监控进出服务器 S2 的所有流量。当然，我们也可以直接将\
  \ Wireshark 安装在服务器本身上，这样我们就能够直接在服务器上查看流量。\n\n一些局域网交换机供应商还支持其他功能，例如：\n\n- **监控整个\
  \ VLAN**：我们可以监控服务器的 VLAN、电话 VLAN 等。在这种情况下，你将看到特定 VLAN 上的所有流量。\n- **将多个端口监控到单个分析器**：我们可以同时监控服务器\
  \ **S1** 和 **S2** 上的流量。\n- **过滤**：过滤是指选择并相应配置是监控入站流量、出站流量，还是两者都监控。\n\n\n\n\n\n###\
  \ 准备工作\n\n要开始使用 Wireshark，请前往 Wireshark 网站，并下载该工具的最新版本。\n\nWireshark 的更新版本可在网站 http://www.wireshark.org/\
  \ 上找到，位于 **Download** 标题下。下载 http://www.wireshark.org/download.html 上可用的最新 Wireshark\
  \ 稳定版。\n\n每个 Wireshark Windows 安装包都附带最新稳定版的 WinPcap，该组件对于实时数据包捕获是必需的。WinPcap 驱动程序是用于流量捕获的\
  \ UNIX Libpcap 库的 Windows 版本。\n\n### 如何操作...\n\n让我们来看看典型的网络架构和网络设备，它们的工作原理，如何在需要时配置它们，以及\
  \ Wireshark 的位置。\n\n![](img/da40f92928403866599198344271d63e_288_0.png)\n\n让我们来看一下前述图表中的简单且常见的网络架构。\n\
  \n#### 监控服务器\n\n这将是我们最常见的需求之一。它可以通过将端口监控配置到服务器（在前述图表中编号为 1），或直接在服务器本身上安装 Wireshark\
  \ 来实现。\n\n#### 监控路由器\n\nconfigure，但为您提供额外的监控功能，例如 **Simple Network Management Protocol\
  \ (SNMP)**。当您排查网络时，最好有一个可用的托管 LAN 交换机，即使是简单的交换机也行。\n\n- **Hubs:** 您只需将集线器并联连接到您想要监控的链路即可，由于集线器是半双工设备，路由器和\
  \ SP 设备之间发送的每个数据包都将在您的 Wireshark 上被监视。这种方法最大的缺点是集线器本身会减慢流量，从而影响测试。在许多情况下您还想监控 1\
  \ Gbps 端口，而由于没有适用于此的集线器，您将不得不将速度降至 100 Mbps，这同样会影响流量。因此，集线器并不常用。\n\n#### 监控防火墙\n\
  \n监控防火墙时，取决于您监控的是内部端口（图表中编号为 3）还是外部端口（图表中编号为 4）。在内部端口上，您将看到所有内部地址以及由内部网络中的用户发起的所有流量，而在外部端口上，您将看到我们发出的外部地址（由\
  \ NAT 从内部地址转换而来）；您将看不到被防火墙阻止的来自内部网络的请求。如果有人从互联网攻击防火墙，您（希望）只能在外部端口上看到它。\n\n### 工作原理...\n\
  \n要了解端口监控的工作原理，首先要了解 LAN 交换机的工作方式。LAN 交换机转发数据包的方式如下：\n\n- 1. LAN 交换机持续学习连接到它的设备的\
  \ MAC 地址。\n- 2. 现在，如果数据包发送到目标 MAC 地址，它将只转发到交换机知道该 MAC 地址来自的物理端口。\n- 3. 如果发送广播，它将被转发到交换机的所有端口。\n\
  - 4. 如果发送多播并且 Cisco Group Management Protocol (CGMP) 或 Internet Group Management\
  \ Protocol (IGMP) 被禁用，它将被转发到交换机的所有端口（CGMP 和 IGMP 是使多播数据包仅转发到特定多播组上的设备的协议）。\n- 5.\
  \ 如果数据包发送到交换机不认识的 MAC 地址（这是一个非常罕见的情况），它将被转发到交换机的所有端口。\n\n因此，当您将端口监控配置到特定端口时，您将看到进出该端口的所有流量。如果您将笔记本电脑连接到网络，而不进行任何配置，您将只看到进出您笔记本电脑的流量，以及来自网络的广播和多播。\n\
  \n### 还有更多...\n\n在捕获数据时，有一些棘手的情况您应该注意。\n\n其中一种情况是监控 VLAN。监控 VLAN 时，您应该注意几个重要问题。第一个问题是，即使您监控一个\
  \ VLAN，数据包也必须物理上通过您所连接的交换机，才能看到它。例如，如果您监控在网络中配置的 VLAN-10，而您连接到楼层交换机，您将看不到从其他交换机到中央交换机上服务器的流量。\n\
  \n这是因为在构建网络时，用户通常连接到楼层交换机，在楼层的一个或多个位置，这些交换机连接到建筑物中央交换机（或两个冗余交换机）。要监控 VLAN 上的所有流量，您必须连接到所有\
  \ VLAN 流量都经过的交换机，这通常是中央交换机。\n\n![](img/da40f92928403866599198344271d63e_292_0.png)\n\
  \n### 另请参阅\n\n有关如何配置端口镜像的信息，请参阅厂商的说明。它可以称为 **port monitor**、**port mirror** 或 **SPAN**（**Switched\
  \ Port Analyzer** 来自 Cisco）。\n\n还有高级功能，例如远程监控（监控未直接连接到您交换机的端口）、高级过滤（例如过滤特定 MAC 地址）等。还有一些高级交换机本身具有捕获和分析功能。也可以监控虚拟端口（例如\
  \ LAG 或 Ether channel 组）。对于所有情况，请参阅厂商的规格。\n\n## 开始捕获数据\n\n在本教程中，我们将学习如何开始捕获数据，以及在我们已在网络中定位\
  \ Wireshark 后，在各种捕获场景下会得到什么。\n\n### 准备工作\n\n在计算机上安装 Wireshark 后，您唯一需要做的就是从桌面、程序文件或快速启动栏启动分析器。\n\
  \n这样做后，将打开以下窗口（版本 1.10.2）：\n\n![](img/da40f92928403866599198344271d63e_296_0.png)\n\
  \n### 如何操作...\n\n您可以从顶部栏 **Capture** 菜单开始捕获，或从带有捕获符号的快速启动栏开始，或从 Wireshark 主屏幕左中部的捕获窗口开始。有您可以选择的选项。\n\
  \n#### 如何选择要开始捕获的接口\n\n如果您简单地点击 Wireshark 中第三个靠右的绿色图标并开始捕获，Wireshark 将在软件中配置的默认接口上开始捕获（本章后面在\
  \ Preferences 菜单中配置用户界面的教程中会解释）。要选择您想要捕获的接口，请点击 **List the available capture interfaces**\
  \ 符号，**Wireshark Capture Interfaces** 窗口将打开。\n\n![](img/da40f92928403866599198344271d63e_297_0.png)\n\
  \n查看哪个接口处于活动状态的最佳方法就是简单地查看接口窗口右侧的流量运行情况。在那里您将看到 Wireshark 看到的每个接口的总 **Packets**\
  \ 数，以及每个接口的 **Packets/sec** 数。\n\n#### 如何配置您从其捕获数据的接口\n\n要配置您从其捕获数据的接口，请从 Capture\
  \ 菜单中选择 Options。以下窗口将出现：\n\n![](img/da40f92928403866599198344271d63e_299_0.png)\n\
  \n在前述窗口中您可以配置以下参数：\n\n- 1. 在窗口的上方，选择您想要从其捕获数据的接口。\n- 2. 在窗口的左侧，您有复选框 Use promiscuous\
  \ mode on all interfaces。选中后，Wireshark 将捕获计算机接收到的所有数据包。取消选中它将只捕获 intended for the\
  \ computer 的数据包。\n- 3. 在某些情况下，选中此复选框时，Wireshark 将不会在无线接口上捕获数据；因此，如果您在无线接口上开始捕获数据却看不到任何内容，请取消选中它。\n\
  \n\n\n\n\n4. 在窗口的左中部，你有 **Capture Files** 字段。你可以在此处写入文件名，Wireshark 将在此处指定的路径下以此名称保存捕获的文件，并加上\
  \ 0001、0002 等扩展名。此功能在捕获大量数据时非常重要；例如，在负载很重的接口上捕获数据，或在较长时间内捕获数据时。你可以让软件在经过特定时间间隔、文件大小或数据包数量后打开新文件。\n\
  \n5. 在窗口的左下部，你有前面截图中标记为 **Stop Capture Automatically** 的区域。在此区域，你可以让软件在经过特定时间间隔、文件大小或数据包数量后停止捕获数据。\n\
  \n6. 在窗口的右中部，你可以更改 **Display** 选项并选择复选框 **Update list of packets in real time**、**Automatically\
  \ scroll during live capture** 和 **Hide capture info dialog**，后者可关闭烦人的捕获窗口（在你开始捕获时出现的弹出窗口）。在大多数情况下你无需在此处更改任何内容。\n\
  \n7. 在窗口的右下部，你可以配置 MAC 地址、IP DNS 名称以及 TCP/UDP 端口号的解析选项。最后一个复选框 **Use external network\
  \ name resolver** 使用系统配置的名称解析器（在大多数情况下为 DNS）来解析网络名称。\n\n## There's more...\n\n在捕获时间很重要，且你希望在一個或多个接口上捕获数据并与所监控的服务器进行时间同步的情况下，你可以使用\
  \ **Network Time Protocol (NTP)** 将你的 Wireshark 和被监控的服务器与中央时间源同步。\n\n当你希望并行查看 Wireshark\
  \ 捕获文件和服务器日志文件，并查找在两者中都显示的事件时，这一点很重要。例如，如果你在捕获文件中看到重传，同时在被监控的服务器上出现服务器或应用程序错误，你就会知道重传是由于服务器错误而不是网络问题造成的。\n\
  \nWireshark 软件从操作系统时钟（Windows、Linux 等）获取时间。要配置操作系统以使用时间服务器，请参阅你所使用的操作系统的相关手册。\n\n\
  在 Microsoft Windows7 中，按如下方式配置：\n\n- 1. 进入 **Control Panel**。\n- 2. 选择 **Clock,\
  \ Language, and Region**。\n- 3. 在 **Date and Time** 下，选择 **Set the time and date**\
  \ 并切换到 **Internet time** 选项卡。\n- 4. 点击 **Change Settings** 按钮。\n- 5. 更改服务器名称或 IP\
  \ 地址。\n\n### Note\n\n在 Microsoft Windows7 及更高版本中，时间服务器有一个默认设置。只要所有设备都调谐到它，你就可以像使用其他任何时间服务器一样使用它。\n\
  \nNTP 是一种用于时间同步的网络协议。当你将网络设备（路由器、交换机、FW 等）和服务器配置为使用同一时间源时，它们将与该源进行时间同步。同步的准确性取决于时间服务器的准确性，该准确性以等级或层级衡量。等级越高，准确性越高。等级\
  \ 1 为最高。通常你会有 2 到 4 级。\n\nNTP 最初在 RFC 1059（NTPv1）中标准化，然后在 RFC 1119（NTPv2）中标准化；近几年常用的版本是\
  \ NTPv3（RFC1305）和 NTPv4（RFC 5905）。\n\n你可以在多个网站上获取 NTP 服务器列表，其中包括 http://support.ntp.org/bin/view/Servers/StratumOneTimeServers\
  \ 和 http://wpollock.com/AUnix2/NTPstratum1PublicServers.htm。\n\n## See also\n\n\
  你可以在以下位置获取有关 Pcap 驱动程序的更多信息：\n\n- For WinPcap visit: http://www.winpcap.org\n- For\
  \ Libpcap visit: http://www.tcpdump.org\n\n## Configuring the start window\n\n在本菜谱中，我们将看到启动窗口的一些基本配置。我们将讨论主窗口、文件格式和查看选项的配置。\n\
  \n- Status Bar\n\n## Main Toolbar\n\n在主工具栏中，你有以下截图中显示的图标：\n\n![](img/da40f92928403866599198344271d63e_307_0.png)\n\
  \n最左边的五个符号用于捕获操作，然后是文件操作、缩放和“转到数据包”操作、着色和自动滚动、缩放和调整大小、过滤器、首选项和帮助的符号。\n\n## Display\
  \ Filter Toolbar\n\n在过滤器工具栏中，你有以下字段：\n\n![](img/da40f92928403866599198344271d63e_308_0.png)\n\
  \n## Status Bar\n\n在 Wireshark 窗口下方的状态栏中，你可以看到以下截图中显示的数据：\n\n![](img/da40f92928403866599198344271d63e_308_1.png)\n\
  \n在前面的截图中你可以看到以下内容：\n\n- Errors in the expert system\n- The option to add a comment\
  \ to the file\n- The name of the captured file（在捕获期间，它会显示软件分配的临时名称）\n- Total number\
  \ of captured packets, displayed packets（那些实际显示在屏幕上的数据包），and marked packets（你标记过的数据包）。\n\
  \n## How to do it...\n\n在这部分我们将逐步配置主菜单。\n\n### Configuring toolbars\n\n通常对于常规数据包捕获，你无需更改任何内容。当你想要通过网络捕获无线数据（不仅仅来自你的笔记本电脑）时则不同；你将必须启用无线工具栏，这可以通过在视图菜单下点击它来完成，如以下截图所示：\n\
  \n![](img/da40f92928403866599198344271d63e_309_0.png)\n\n### Configuring the main\
  \ window\n\n要配置捕获的主菜单，你可以配置 Wireshark 显示以下窗口：\n\n![](img/da40f92928403866599198344271d63e_310_0.png)\n\
  \n在大多数情况下你无需在此处更改任何内容。在某些情况下，你可以取消数据包字节的显示，当你不需要查看它们时，你将获得更多“空间”用于数据包列表和详细信息。\n\n\
  ## Name Resolution\n\n**Name Resolution** 是将第 2 层（MAC 地址）、第 3 层（IP 地址）和第 4 层（端口号）转换为有意义信息的翻译。\n\
  \n![](img/da40f92928403866599198344271d63e_311_0.png)\n\n在前面的截图中，我们看到 MAC 地址 **60:d8:19:c7:8e:73**（来自\
  \ **Hon Hai Precision Ind.**, 由 Lenovo 使用），网站（即 [Packtpub.com](https://Packtpub.com)），以及\
  \ HTTP 端口号（即 80）。\n\n## Colorizing the packet list\n\n通常你开始捕获是为了建立网络上正常流量是什么样子的基线配置文件。在捕获期间，你查看捕获的数据，你可能会发现可疑的\
  \ TCP 连接、IP 或以太网连接，并希望以另一种颜色查看它们。\n\n为此，右键单击属于你想要着色的对话的数据包，选择 Ethernet、IP 或 TCP/UDP（TCP\
  \ 或 UDP 的外观取决于数据包），并为该对话选择颜色。\n\n在示例中你可以看到我们想要为 **Transport Layer Security (TLS)**\
  \ 对话着色。\n\n![](img/da40f92928403866599198344271d63e_312_0.png)\n\n要取消着色规则：\n\n-\
  \ 1. 进入 **View** 菜单。\n- 2. 在菜单的下部，选择 **Reset Coloring 1-10** 或简单地按 Ctrl + 空格键。\n\
  \n## Auto scrolling in live capture\n\n要配置 Wireshark 在捕获数据包时自动滚动，请执行以下操作：\n\n- 1.\
  \ 进入 **View** 菜单。\n- 2. 标记 **Auto Scroll in Live Capture** 项目。\n- 3. Zoom\n\n缩放进出：\n\
  \n- 1. 进入 **View** 菜单。\n- 2. 点击 **Zoom In** 或按 Ctrl + + 放大。\n- 3. 点击 **Zoom Out**\
  \ 或按 Ctrl + - 缩小。\n\n## Using time values and summaries\n\n时间格式配置是关于时间列（默认配置下从左数第二列）将如何呈现。在某些场景中，这一点非常重要；例如，在你想要查看\
  \ TCP 连接中数据包之间的时间间隔时，当你从多个源捕获数据并希望查看每个数据包的确切时间时，等等。\n\n\n\n\n\n### 准备工作\n\n要配置时间格式，请转到“查看”菜单，然后在“时间显示格式”下，您将看到以下窗口：\n\
  \n![](img/da40f92928403866599198344271d63e_315_0.png)\n\n### 如何操作...\n\n您可以从以下选项中进行选择：\n\
  \n- **日期和时间（前两个选项）**：这在排查与时间相关的网络事件时很有用，例如，当您知道某个事件发生在特定时间，并且想要查看网络在同一时间发生了什么时。\n\
  - **自纪元以来的秒数**：自 1970 年 1 月 1 日起的秒数。纪元是作为系统参考时间而选定的任意日期，而 1970 年 1 月 1 日被选为 Unix\
  \ 和类 Unix 系统的纪元。\n- **自捕获开始以来的秒数**：默认配置。\n- **自上一个捕获数据包以来的秒数**：这也是一个常见功能，可让您查看数据包之间的时间差。当监控对时间敏感的流量时，这很有用（数据包之间的时间差很重要），例如\
  \ TCP 连接、实时视频流、VoIP 呼叫等。\n- **自上一个显示数据包以来的秒数**：这是一个很有用的功能，可在您配置显示过滤器且仅呈现捕获数据的一部分时使用（例如\
  \ TCP 流）。在这种情况下，您将看到数据包之间的时间差，这在某些应用中很重要。\n- **UTC 日期和时间**：提供相对的 UTC 时间。\n\n子菜单的下半部分提供了时间显示的格式。仅在需要更精确的测量时才更改它。\n\
  \n您也可以使用 Ctrl + Alt + 键盘上的任意数字键来选择各种选项。\n\n### 工作原理...\n\n这很简单。Wireshark 基于系统时钟工作，并按系统中的时间呈现时间。默认情况下，您会看到自捕获开始以来的时间。\n\
  \n## 配置着色规则和导航技术\n\n着色规则定义了 Wireshark 如何对捕获数据中的协议和事件进行着色。使用着色规则将极大地帮助您进行网络故障排除，因为您可以以不同颜色查看不同协议，并且还可以为不同事件配置不同颜色。\n\
  \n着色规则使您能够根据各种过滤器配置新的着色规则。它可以帮助您为不同场景配置不同的着色方案并将其保存在不同的配置文件中。这样，您就可以为解决 TCP 问题配置着色规则，为解决\
  \ SIP 和电话问题配置规则，等等。\n\n### 提示\n\n您可以配置 Wireshark 配置文件以保存 Wireshark 配置；例如，预定义的颜色、过滤器等。要执行此操作，请从\
  \ **编辑** 菜单中导航到 **配置配置文件**。\n\n### 准备工作\n\n要开始使用着色规则，请按以下步骤操作：\n\n1. 转到 **查看** 菜单。\n\
  2. 在菜单的下半部分，选择 **着色规则**。您将看到以下窗口：\n\n![](img/da40f92928403866599198344271d63e_319_0.png)\n\
  \n### 如何操作...\n\n我们现在将继续介绍着色规则：\n\n单击“新建”按钮，您将看到以下窗口：\n\n![](img/da40f92928403866599198344271d63e_320_0.png)\n\
  \n要配置新的着色规则，请按照以下步骤操作：\n\n1. 在“名称”字段中，填写规则的名称。例如，为网络时间协议填写 NTP。\n2. 在“字符串”字段中，填写过滤器字符串，即您希望规则显示的内容（我们将在第\
  \ 3 章《使用显示过滤器》中讨论显示过滤器）。您可以单击“表达式”按钮并获取预配置的过滤器列表。\n3. 单击“前景色”按钮并为规则选择前景色。这将是数据包列表中数据包的前景色。\n\
  4. 单击“背景色”按钮并为规则选择背景色。这将是数据包列表中数据包的背景色。\n5. 如果要编辑现有规则，请单击 **编辑** 按钮。您也可以单击 **导入**\
  \ 按钮导入现有着色方案，或单击 **导出** 规则导出当前方案。\n\n### 提示\n\n着色规则的顺序很重要。请确保着色规则的顺序是实现的顺序。例如，应用层协议应排在\
  \ TCP 或 UDP 之前，以便 Wireshark 以其颜色着色它们，而不是常规的 TCP 或 UDP 颜色。\n\n### 工作原理...\n\n与 Wireshark\
  \ 中的许多操作一样，您可以对过滤后的数据配置各种操作。着色规则机制只是将着色规则应用于预定义的过滤器。\n\n### 另请参阅\n\n您可以在 http://wiki.wireshark.org/ColoringRules\
  \ 上找到各种类型的着色方案，以及许多其他示例，通过简单的互联网搜索即可找到。\n\n## 保存、打印和导出数据\n\n在本教程中，我们将讨论文件操作，例如保存、导出、打印等。\n\
  \n### 准备工作\n\n启动 Wireshark 或打开已保存的文件。\n\n### 如何操作...\n\n我们可以保存整个文件，并以各种格式和文件类型导出特定数据。在以下段落中，我们将看到如何操作。\n\
  \n要保存包含捕获数据的整个文件，请执行以下步骤：\n\n1. 在 **文件** 菜单中，单击 **保存**（或按 Ctrl + S）以使用其自己的名称保存文件。\n\
  2. 在 **文件** 菜单中，单击 **另存为**（或按 Shift + Ctrl + S）以使用新名称保存文件。\n\n要保存文件的一部分，例如仅显示的数据：\n\
  \n1. 在 **文件** 菜单下导航到 **导出指定数据包**。您将看到以下窗口：\n2. 在窗口的左下角，您会看到可以选择要保存的数据部分。\n3. 要保存所有捕获的数据，请选择“所有数据包”和“已捕获”。\n\
  4. 要仅保存显示的数据，请选择“所有数据包”和“已显示”。\n5. 要仅保存文件中的选定数据包（选定数据包只是您在数据包列表窗口中单击的数据包），请选择“选定数据包”。\n\
  6. 要保存标记的数据包（即通过在数据包列表窗口中右键单击它并从菜单中选择“标记数据包切换”而标记的数据包），请选择“标记数据包”。\n7. 要保存两个标记数据包之间的数据包，请选择“从第一个到最后一个标记”选项。\n\
  8. 要保存一系列数据包，请选择“范围”并指定要保存的数据包范围。\n9. 在数据包列表窗口中，您可以手动选择忽略数据包。在“导出”窗口中，您可以选择忽略这些数据包而不保存它们。\n\
  \n在所有上述选项中，您可以选择来自整个捕获文件的数据包，或来自屏幕上显示的数据包（在应用显示过滤器后在数据包列表中显示的数据包）。\n\n### 以各种格式保存数据\n\
  \n您可以以各种格式保存 Wireshark 捕获的数据，以便使用其他工具进行进一步分析。\n\n您可以将文件保存为以下格式：\n\n- **纯文本** (*.txt)：将数据包数据导出为纯文本\
  \ ASCII 文件。\n- **PostScript** (*.ps)：将数据包数据导出为 PostScript 格式。\n- **逗号分隔值：数据包摘要**\
  \ (*.csv)：将数据包摘要导出为 CSV 文件格式，以便与电子表格程序（如 Microsoft Excel）一起使用。\n- **C 数组到数据包字节**\
  \ (*.c)：将数据包字节导出为 C 数组，以便 C 程序导入。\n- **PSML 或 XML 数据包摘要** (*.psml)：将数据包数据导出为 PSML，这是一种仅包含数据包摘要的基于\
  \ XML 的格式。有关此格式的更多详细信息，请参阅 http://www.nbee.org/doku.php?id=netpdl:psml_specification。\n\
  - **PDML - XML 数据包详细信息** (*.pdml)：将数据包数据导出为 PDML，这是一种包含数据包详细信息的基于 XML 的格式。有关此格式的更多详细信息，请参阅\
  \ http://www.nbee.org/doku.php?id=netpdl:pdml_specification。\n\n要保存文件，请从“文件”菜单中选择“导出数据包分解”，您将看到以下窗口：\n\
  \n\n\n![](img/da40f92928403866599198344271d63e_329_0.png)\n\n在前面的截图中，左侧标记的框里，你选择要保存的数据包。过程与上一节配方相同。右侧标记的框里，你选择要保存的文件格式。\n\
  \n# 如何打印数据\n\n要打印数据，请从 File 菜单中点击 Print 按钮，你将得到以下窗口：\n\n![](img/da40f92928403866599198344271d63e_330_0.png)\n\
  \n在 Wireshark **Print** 窗口中，你有以下选择：\n\n- 在上部窗口中，你选择要打印的文件格式\n- 在左下部窗口中，你选择要打印的数据包（与\
  \ Export 窗口类似）\n- 在右下部窗口中，你选择打印数据的格式，以及从 Wireshark 窗口打印的数据窗格：\n  - **Packet Summary**\
  \ 窗格\n  - **Packet Details** 窗格\n  - **Packet Byte** 窗格\n\n## How it works...\n\n\
  数据可以以文本格式、postscript（用于支持 postscript 的打印机）或保存到文件的方式打印。配置完此窗口并点击打印后，常规的打印窗口将会出现，你可以選擇打印机。\n\
  \n# 在 Preferences 菜单中配置用户界面\n\n在 **Preferences** 窗口中，你可以更改大量参数，包括呈现的数据、文件默认保存位置、Wireshark\
  \ 默认捕获数据的接口等等。\n\n本章中我们将提及的是在各种捕获场景下更改后会有所帮助的常用参数。\n\n## Getting ready\n\n要配置 **User\
  \ Interface**，我们将从 **Edit** 菜单中选择 **Preferences** 选项。你将得到以下窗口：\n\n![](img/da40f92928403866599198344271d63e_333_0.png)\n\
  \n我们将查看以下参数的配置：\n\n- **Columns**\n- **Capture**\n- **Name Resolution**\n\n## How\
  \ to do it...\n\n在本节中，我们将了解如何更改参数以帮助使用 Wireshark。\n\n### 更改和添加列\n\n我们在数据包窗格中看到的默认列是编号、时间、源和目标地址、协议、长度和信息列，如以下截图所示：\n\
  \n![](img/da40f92928403866599198344271d63e_334_0.png)\n\n要向数据包窗格添加新列：\n\n1. 你可以从\
  \ **Field type** 中选择其中一个预定义参数作为新列添加。其中这些参数包括时间增量、IP DSCP 值、端口号等。\n\n2. 当你在字段类型中填写\
  \ **Custom** 时，会出现一个非常重要的功能。在这种情况下，你可以为 **Field name** 填写任何过滤器字符串。例如，你可以添加以下内容：\n\
  \n- 添加字符串 `tcp.window_size` 以查看 TCP 窗口大小（影响性能）。\n- 添加字符串 `ip.ttl` 以查看每个数据包的 IP **TTL\
  \ (Time-To-Live)** 参数。\n- 添加 `rtp.marker` 以查看 RTP 数据包中设置的每个标记的实例。\n- 正如我们在后面的章节中将看到的，此功能将有助于我们快速解决网络问题。\n\
  \n# 更改捕获配置\n\n在捕获数据之前可以配置一些参数。在 **Preferences** 窗口中选择 **Capture** 菜单，以下窗口将会出现：\n\
  \n![](img/da40f92928403866599198344271d63e_335_0.png)\n\n要更改捕获开始时默认的接口，只需点击 **Edit**\
  \ 按钮，并标记你希望设为默认的接口。当然，你每次开始新捕获时都可以更改它，这只是默认值。\n\n# 配置名称解析\n\nWireshark 在三层支持 **Name\
  \ Resolution**：\n\n- **Layer 2**：通过将 MAC 地址的第一部分解析为厂商名称。例如，**14:da:e9** 将显示为 AsusTeckC\
  \ (ASUSTeK Computer Inc.)。\n- **Layer 3**：通过将 IP 地址解析为 DNS 名称。例如，**157.166.226.46**\
  \ 将解析为 www.edition.cnn.com。\n- **Layer 4**：通过将 TCP/UDP 端口号解析为端口名称。例如，端口 80 将解析为\
  \ HTTP，端口 53 解析为 DNS。\n\n![](img/da40f92928403866599198344271d63e_336_0.png)\n\n\
  # Tip\n\n在 TCP 和 UDP 中，只有客户端最初打开会话的目标端口才有意义。连接打开的源端口是一个随机数（高于 1024），因此将其翻译为端口名称没有意义。\n\
  \nWireshark 默认解析第 2 层 MAC 地址和第 4 层 TCP/UDP 端口号。解析 IP 地址可能会因大量 DNS 查询而减慢 Wireshark\
  \ 的速度；因此请谨慎使用。\n\n## How it works...\n\n非常简单。这是 Wireshark 的配置菜单。在这里你可以配置本配方中描述的参数以及一些其他参数。你可以参考\
  \ Wireshark 手册 www.wireshark.org 获取更多信息。\n\n## 配置协议首选项\n\n配置协议首选项使我们能够更改 Wireshark\
  \ 捕获和呈现常见协议的方式。在本配方中我们将学习如何配置最常见的协议。\n\n## Getting ready\n\n1. 进入 **Edit** 菜单下的\
  \ **Preferences**，你将看到以下窗口：\n\n![](img/da40f92928403866599198344271d63e_339_0.png)\n\
  \n2. 点击协议左侧的 + 号，协议列表将被打开。在协议列表下你会找到常见和不太常见的协议。在本部分我们将讨论常见配置，我们将在协议章节中深入协议细节，即第\
  \ 7 章 Ethernet、LAN Switching、和 Wireless LAN 到第 14 章 Understanding Network Security。\n\
  \n## How to do it...\n\n在本配方中，我们将讨论以下基本协议（基本是指它们无处不在，而非简单）：\n\n- IPv4 和 IPv6\n-\
  \ TCP 和 UDP\n\n# 配置 IPv4 和 IPv6 首选项\n\n当你选择配置 IPv4 或 IPv6 参数时，你将得到以下窗口：\n\n![](img/da40f92928403866599198344271d63e_340_0.png)\n\
  \n你可以更改的参数有：\n\n- **Decode IPv4 ToS field as DiffServ Field**：原始 IP 协议带有一个名为 **Type\
  \ Of Service (ToS)** 的字段，用于在网络中实现 IP 服务质量。90 年代初，**Differentiated Services (DiffServ)**\
  \ 标准改变了 IP 设备对该字段的查看方式。取消选中此复选框将按原始 IP 标准显示该字段。\n- **Enable GeoIP lookups**：GeoIP\
  \ 是一个数据库，使 Wireshark 能够将 IP 地址呈现为地理位置。在 IPv4 和 IPv6 中启用此功能将启用此呈现。此功能涉及名称解析，因此可能减慢实时数据包捕获速度。\n\
  \n# 配置 TCP 和 UDP\n\n在 UDP 中，没有太多可更改的内容。非常简单的协议，具有非常简单的配置。而在 TCP 中，则有一些可以更改的参数。\n\
  \n你在 TCP 首选项中可以做的多数更改是在 Wireshark 解析捕获数据的方式上。\n\n- **Validate the TCP checksum if\
  \ possible**：在某些 NIC 中，你可能会看到许多“校验和错误”。这是由于 TCP 校验和卸载通常在某些 NIC 上实现。问题可能是 NIC 实际上在\
  \ Wireshark 捕获数据包后才添加校验和，因此如果你看到许多 TCP 校验和错误，第一件事就是禁用此复选框并验证这是否不是问题。\n- **Analyze\
  \ TCP Sequence numbers**：必须选中此复选框才能使 Wireshark 提供 TCP 分析，这是其主要也是最重要的功能之一。\n- **Relative\
  \ Sequence Numbers**：当 TCP 打开连接时，它从一个随机序列号开始。选中此复选框时，Wireshark 会将其规范化为“0”，因此你看到的不是真实数字，而是从“0”开始递增的数字。在大多数情况下，相对数字更容易处理。\n\
  - **Calculate conversations timestamps**：选中此复选框时，TCP 解析器将在每个数据包中显示自连接开始以来的时间。这在连接非常快、时间至关重要的情况下会有所帮助。\n\
  \n\n\n\n\n### 工作原理...\n\n使用**首选项**菜单中的**协议**功能，可以为 Wireshark 软件增加更多的分析功能。但这里要小心，不要添加太多功能，以免拖慢数据包捕获和分析速度。\n\
  \n### 更多内容...\n\n你可以通过 http://wiki.wireshark.org/HowToUseGeoIP 获取有关 GeoIP 的更多信息。\n"
- "## 第 2 章 使用捕获过滤器\n\n本章将涵盖以下主题：\n\n- 配置捕获过滤器\n- 配置以太网过滤器\n- 配置主机和网络过滤器\n- 配置 TCP/UDP\
  \ 和端口过滤器\n- 配置复合过滤器\n- 配置字节偏移和负载匹配过滤器\n\n### 简介\n\n在第一章节中，我们讨论了如何安装 Wireshark、如何将其配置为基本操作，以及如何在网络中定位它。在本章和下一章中，我们将讨论捕获过滤器（第\
  \ 2 章，使用捕获过滤器）和显示过滤器（第 3 章，使用显示过滤器）。\n\n区分这两种过滤器非常重要：\n\n- 捕获过滤器是在我们开始捕获数据之前配置的，因此只有符合过滤器的数据才会被捕获。所有其他数据都将丢失。本章将介绍这些过滤器。\n\
  - 显示过滤器是在数据捕获之后对数据进行过滤的过滤器。在这种情况下，所有数据都会被捕获，然后你配置希望显示的数据。这些过滤器将在第 3 章，使用显示过滤器中介绍。\n\
  \n**提示**\n\n捕获过滤器基于 `libpcap/WinPcap` 库中提供的 `tcpdump` 语法，而显示过滤器的语法是几年后提出的。因此，请记住，显示过滤器和捕获过滤器具有不同的语法！\n\
  \n在某些情况下，你需要配置 Wireshark 仅捕获接口上看到的部分数据，例如：\n\n- 当监控链路上有大量数据在传输，而你只想捕获自己关心的数据时\n\
  - 当你只想捕获所监控 VLAN 上特定服务器进出数据时\n- 当你只想捕获特定应用程序或应用（例如，你怀疑网络中 DNS 存在问题，只想分析与互联网之间进出的\
  \ DNS 查询和响应）时\n\n还有许多其他情况，你希望只捕获特定数据，而不是捕获网络上运行的所有数据。使用捕获过滤器时，只会捕获预定义的数据，所有其他数据包将被忽略，因此你将只得到所需的数据。\n\
  \n**提示**\n\n使用捕获过滤器时务必小心。在网络环境中，许多情况下不同应用程序和服务器之间存在依赖关系，而这些依赖关系并不总是被你所察觉；因此，当你使用带捕获过滤器的\
  \ Wireshark 进行网络故障排查时，请确保不要过滤掉那些可能导致问题“消失”的连接。一个常见且简单的例子是，仅过滤 TCP 端口 80 上的流量以监控疑似缓慢的\
  \ HTTP 响应，而问题可能出在你无法看到的响应缓慢或无响应的 DNS 服务器上。\n\n在本章中，我们将介绍如何配置简单、结构化、字节偏移和负载匹配的捕获过滤器。\n\
  \n### 配置捕获过滤器\n\n我们建议在配置捕获过滤器之前，仔细设计你想要捕获的内容，并为此准备好过滤器。别忘了——未通过过滤器的内容将会丢失。\n\nWireshark\
  \ 提供了一些预定义的过滤器供你使用，你也可以按照下一个技巧中的描述自行配置。\n\n### 准备工作\n\n要配置捕获过滤器，请打开 Wireshark，然后按照本技巧中的步骤操作。\n\
  \n### 操作步骤...\n\n要在开始捕获之前配置捕获过滤器，请执行以下步骤：\n\n1. 要配置捕获过滤器，请点击左侧第二个按钮，即 **显示捕获选项…**\
  \ 按钮，如下面的截图所示：\n\n![](img/da40f92928403866599198344271d63e_349_0.png)\n\n2. 将打开\
  \ **Wireshark：捕获选项** 窗口，如下面的截图所示：\n\n![](img/da40f92928403866599198344271d63e_349_1.png)\n\
  \n3. 双击要在其上配置捕获过滤器的接口（你可以按照第 1 章，介绍 Wireshark 中的描述验证哪个接口是活动接口）。\n\n4. 将打开 **编辑接口设置**\
  \ 窗口，如下面的截图所示：\n\n![](img/da40f92928403866599198344271d63e_350_0.png)\n\n5. 现在，我们可以通过在“Wireshark：捕获过滤器”窗口中直接编写过滤器字符串来配置捕获过滤器，或者点击“捕获过滤器：”按钮；将打开以下窗口：\n\
  \nWireshark 捕获过滤器 - 配置文件：新建\n\n编辑\n\n捕获过滤器\n\n- 以太网类型 0x0806 (ARP)\n- 不包含广播和多播\n\
  - 不使用 ARP\n- 仅 IP\n- IP 地址 192.168.0.4\n- 仅 IPX\n- 仅 TCP\n- 仅 UDP\n- TCP 或 UDP 端口\
  \ 80 (HTTP)\n- HTTP TCP 端口 (80)\n\n新建\n\n删除\n\n属性\n\n过滤器名称：\n\n过滤器字符串：\n\n帮助\n\n\
  确定\n\n取消\n\n输入捕获过滤器名称\n\n输入捕获过滤器字符串\n\n### 工作原理...\n\n**Wireshark：捕获过滤器**窗口使你可以根据**伯克利数据包过滤器（BPF）**配置过滤器。编写过滤器字符串后，你可以点击\
  \ **编译 BPF** 按钮，BPF 编译器将检查你的语法，如果语法错误，你将收到错误消息。\n\n此外，当你在捕获过滤器文本框中输入过滤器字符串时，如果过滤器字符串正确，它会变成绿色；如果错误，则会变成红色。\n\
  \nBPF 过滤器仅检查语法是否正确，不检查条件是否正确。例如，如果你输入字符串 `host` 而不带任何参数，将会收到错误，字符串变为红色；但如果你输入 `host\
  \ 192.168.1.1000`，它将通过，窗口变为绿色。\n\n**提示**\n\nBPF 是源自 1992 年 12 月 Steven McCanne 和\
  \ Van Jacobson 在加州大学伯克利分校劳伦斯伯克利实验室发表的论文《The BSD Packet Filter: A New Architecture\
  \ for User-level Packet Capture》中的一种语法。该文档可见于：http://www.tcpdump.org/papers/bpf-usenix93.pdf。\n\
  \n捕获过滤器由包含过滤表达式的字符串组成。该表达式选择哪些数据包将被捕获，哪些数据包将被忽略。过滤表达式由一个或多个原语组成。原语通常由一个标识符（名称或编号）后跟一个或多个限定词组成。限定词有三种不同类型：\n\
  \n- **Type（类型）**：这些限定词说明标识符名称或编号所指的内容类型。可能的类型有 `host`（主机名或地址）、`net`（网络）、`port`（TCP/UDP\
  \ 端口），等等。\n- **Dir（方向）**：这些限定词指定传输到 ID 和/或从 ID 传输的特定方向。例如，`src` 表示源，`dst` 表示目标，等等。\n\
  - **Proto（协议）**：这些限定词将匹配限制到特定协议。例如，`ether` 表示以太网，`ip` 表示互联网协议，`arp` 表示地址解析协议，等等。\n\
  \n标识符是我们测试的实际条件。标识符可以是地址 10.0.0.1、端口号 53 或网络地址 192.168.1（这是针对网络 192.168.1.0/24 的标识符）。\n\
  \n例如，在过滤器 `tcp dst port 135` 中：\n\n- `dst` 是方向限定词\n- `port` 是类型限定词\n- `tcp` 是协议限定词\n\
  \n### 更多内容...\n\n你可以在不同接口上配置不同的捕获过滤器：\n\n![](img/da40f92928403866599198344271d63e_354_0.png)\n\
  \n当你在一个设备的两个接口上捕获流量，并希望检查两侧的不同数据包时，可以使用此功能。\n\n捕获过滤器存储在 Wireshark 目录下名为 cfilters\
  \ 的文件中。在此文件中，你可以找到预定义的过滤器以及你已配置的过滤器，并且可以将该文件复制到其他计算机。该目录的位置将根据 Wireshark 的安装方式和运行平台而有所不同。\n\
  \n\n\n\n\n## 另请参阅\n\n1. Wireshark 捕获过滤器基于 `tcpdump` 程序。你可以在 http://www.tcpdump.org/tcpdump_man.html\
  \ 上找到参考资料。\n2. 你也可以在 http://wiki.wireshark.org/CaptureFilters 上 Wireshark 手册页找到有用的信息。\n\
  \n## 准备工作\n\n基本 Layer 2 过滤器如下：\n\n- `ether host <Ethernet host>`: 获取以太网地址\n- `ether\
  \ dst <Ethernet host>`: 获取以太网目的地址\n- `ether src <Ethernet host>`: 获取以太网源地址\n- `ether\
  \ broadcast`: 捕获所有以太网广播数据包\n- `ether multicast`: 捕获所有以太网多播数据包\n- `ether proto <protocol>`:\
  \ 仅过滤协议标识符中指示的协议类型\n- `vlan <vlan_id>`: 仅通过特定 VLAN 的数据包，该 VLAN 在标识符字段中指示\n\n要否定过滤规则，只需在原语前输入\
  \ `not` 或 `!` 即可。例如：\n\n`Not ether host <Ethernet host>` 或 `! Ether host <Ethernet\
  \ host>` 将捕获不是来自/发往标识符字段中指定的以太网地址的数据包。\n\n## 如何做...\n\n让我们看一下下面的图表，其中我们有一个服务器、PC\
  \ 和路由器，连接到一个 LAN 交换机。Wireshark 在连接到 LAN 交换机的笔记本电脑上运行，并对整个交换机进行端口镜像（到 VLAN1）。\n\n\
  图中 /24 表示法指的是 24 位的子网掩码，即二进制中 11111111.11111111.11111111.00000000 或十进制中 255.255.255.0。\n\
  \n![](img/da40f92928403866599198344271d63e_358_0.png)\n\n按照《配置捕获过滤器》配方中的说明进行操作，并按如下方式配置过滤器：\n\
  \n1. 要仅捕获来自/发往特定 MAC 地址的数据包，例如前一图像中的 PC3，配置 `ether host 00:24:d6:ab:98:b6`。\n2.\
  \ 要捕获发往目的 MAC 地址的数据包，例如前一图像中的 PC3，配置 `ether dst 00:24:d6:ab:98:b6`。\n3. 要捕获来自源 MAC\
  \ 地址的数据包，例如前一图像中的 PC3，配置 `ether src 00:24:d6:ab:98:b6`。\n4. 要捕获广播数据包，配置 `ether broadcast`\
  \ 或 `ether dst ff:ff:ff:ff:ff:ff`。\n5. 要捕获多播数据包，配置 `ether multicast`。\n6. 要捕获特定的\
  \ Ether Type（十六进制值中的数字），配置 `ether proto 0800`。\n\n## 其工作原理...\n\n捕获过滤器与源主机和目的主机的工作方式很简单——捕获引擎只需将条件与实际\
  \ MAC 地址进行比较，并仅通过相关内容。\n\n广播地址是目的地址全为 1 的地址，即 ff:ff:ff:ff:ff:ff，因此当你配置广播过滤器时，只有这些地址会通过过滤器。广播地址可以是：\n\
  \n- L3 IPv4 广播转换为 L2 广播；例如，发送到 10.0.0.255 的 IP 数据包（类 C 子网，如前例所示），将被转换为目的 MAC 字段中的\
  \ L2 广播。\n- 与网络相关的广播；例如，IPv4 ARP（地址解析协议）在网络操作的一部分中发送广播。\n\n**提示**\n\n与网络相关的广播是为网络的常规操作而发送的广播。其中包括\
  \ ARP、路由更新、发现协议等。\n\n在多播过滤器中，有 IPv4 和 IPv6 多播：\n\n- 在 IPv4 中，多播 MAC 地址在 MAC 地址以字符串\
  \ 01:00:5e 开头时传输。所有 MAC 地址以此字符串开头的包将被视为多播。\n- 在 IPv6 中，多播地址在 MAC 地址以字符串 33:33 开头时传输。所有\
  \ MAC 地址以此字符串开头的包将被视为多播。\n\n以太网协议指的是以太网数据包中 ETHER-TYPE 字段，表示将是上层协议。常见的数值有 IPv4 的\
  \ 0800、IPv6 的 86dd 和 ARP 的 0806。\n\n## 还有更多...\n\n- 要为特定 VLAN 配置过滤器，使用 `vlan <vlan\
  \ number>`\n- 要在多个 VLAN 上配置过滤器，使用 `vlan <vlan number> and vlan <vlan number> and\
  \ vlan <vlan number>...`\n\n## 另请参阅\n\n大约有一百个 ETHER-TYPE 代码，其中大多数未使用。你可以参考 http://www.mit.edu/~map/Ethernet/Ethernet.txt\
  \ 获取更多代码，或简单地在互联网上浏览以太网代码。\n\n## 配置主机和网络过滤器\n\n谈到主机和网络过滤器时，我们指的是基于 IP 地址的 Layer\
  \ 3 过滤器。在本配方中，我们将参考这些过滤器以及我们可以用它们做什么。\n\n## 准备工作\n\n基本的 Layer 3 过滤器如下：\n\n- `ip\
  \ or ip6`: 捕获 IP 或 IPv6 数据包。\n- `host <host>`: 获取主机名或地址。\n- `dst host <host>`: 获取目的主机名或地址。\n\
  - `src host <host>`: 获取源主机名或地址。\n\n**提示**\n\n主机可以是 IP 地址或与该数字相关的主机名。你可以例如输入过滤器 host\
  \ www.packtpub.com，它将显示与 Packt 网站相关 IP 地址的所有数据包。\n\n- `gateway <Host name or address>`:\
  \ 它捕获到或来自硬件地址但不至 IP 地址的流量。此过滤器捕获通过指定路由器的流量。此过滤器需要一个主机名，该主机名可被本地系统的名称解析过程使用并找到（例如，DNS）。\n\
  - `net <net>`: 所有到或来自指定 IPv4/IPv6 网络的数据包。\n- `dst net <net>`: 所有到指定 IPv4/IPv6 目的网络的数据包。\n\
  - `src net <net>`: 所有来自指定 IPv4/IPv6 源网络的数据包。\n- `net <net> mask <netmask>`: 所有到/来自特定网络和掩码的数据包。此语法不适用于\
  \ IPv6 网络。\n- `dst net <net> mask <netmask>`: 所有到/来自特定网络和掩码的数据包。此语法不适用于 IPv6 网络。\n\
  - `src net <net> mask <netmask>`: 所有到/来自特定网络和掩码的数据包。此语法不适用于 IPv6 网络。\n- `net <net>/<len>`:\
  \ 所有到/来自 <net> 网络且 <len> 位长度的数据包。\n- `dst net <net>/<len>`: 所有到/来自 <net> 网络且 <len>\
  \ 位长度的数据包。\n- `src net <net>/<len>`: 所有到/来自 <net> 网络且 <len> 位长度的数据包。\n- `broadcast`:\
  \ 所有广播数据包。\n- `multicast`: 所有多播数据包。\n- `ip proto <protocol code>`: 它捕获 IP 协议字段等于\
  \ <protocol> 标识符的数据包。可以有各种协议，例如 TCP（代码 6）、UDP（代码 17）、ICMP（代码 1）等。\n- `ip6 proto\
  \ <protocol>`: 它捕获 IPv6 数据包，其协议如类型字段所示。请注意，此原语不遵循 IPv6 扩展头链。\n\n**提示**\n\n在 IPv6\
  \ 头中，头中有一个字段可以指向可选的扩展头，该扩展头指向下一个扩展头，依此类推。在当前版本中，Wireshark 捕获过滤器不遵循此结构。\n\n- `icmp[icmptype]==<identifier>`:\
  \ 它捕获 ICMP 数据包，其中标识符为 ICMP 代码，例如 `icmp-echo` 和 `icmp-request`。\n\n## 如何做...\n\n\
  按照《配置捕获过滤器》配方中提到的说明进行操作，并按如下方式配置过滤器：\n\n1. 要捕获到/来自主机 10.10.10.1 的数据包，配置 `host 10.10.10.1`。\n\
  2. 要捕获到/来自主机 www.cnn.com 的数据包，配置 `host www.cnn.com`。\n3. 要捕获到主机 10.10.10.1 的数据包，配置\
  \ `dst host 10.10.10.1`。\n4. 要捕获来自主机 10.10.10.1 的数据包，配置 `src host 10.10.10.1`。\n\
  5. 要捕获到/来自网络 192.168.1.0/24 的数据包，配置 `net 192.168.1` 或 `net 192.168.1.0 mask 255.255.255.0`\
  \ 或 `net 192.168.1.0/24`。\n6. 要捕获所有数据而不包括广播或不包括多播，配置 `not broadcast` 或 `not multicast`。\n\
  7. 要捕获到/来自 IPv6 网络 2001::/16 的数据包，配置 `net 2001::/16`。\n8. 要捕获到 IPv6 主机 2001::1 的数据包，配置\
  \ `host 2001::1`。\n9. 要仅捕获 ICMP 数据包，配置 `ip proto 1`。\n10. 要仅过滤 ICMP Echo 的 ping，你可以使用\
  \ ICMP 消息或消息代码。配置 `icmp[icmptype]==icmp-echo` 或 `icmp[icmptype]==8`。\n\n\n\n\n\n\
  ## 工作原理...\n\n对于主机过滤，当你输入主机名时，Wireshark 会将该名称转换为 IP 地址，并捕获与该地址相关的数据包。例如，如果你配置了过滤器\
  \ host www.cnn.com，名称解析服务（通常是 DNS）会将其转换为 IP 地址，并显示与该地址往来通信的所有数据包。请注意，在这种情况下，如果 CNN\
  \ 网站将你重定向到位于其他地址的其他网站，则只会捕获发往第一个地址的数据包。\n\n## 更多内容...\n\n更多有用的过滤器：\n\n- `ip multicast`：IP\
  \ 组播数据包\n- `ip broadcast`：IP 广播数据包\n- `ip[2:2] == <number>`：IP 数据包大小\n- `ip[8] ==\
  \ <number>`：TTL（生存时间）值\n- `ip[9] == <number>`：协议值\n- `(ip[12:4] == ip[16:4])`：IP\
  \ 源地址等于 IP 目的地址\n- `ip[2:2] == <number>`：IP 数据包总长度\n- `ip[9] == <number>`：协议标识符\n\
  \n这些过滤器将在本章末尾的“配置字节偏移和负载匹配过滤器”小节中进一步说明。如下面的示意图所示，其原理是：方括号中的第一个数字表示从协议头起始处开始的字节数，第二个数字表示要检查的字节数。\n\
  \n![](img/da40f92928403866599198344271d63e_368_0.png)\n\n## 另请参阅\n\n更多过滤器请参考 tcpdump\
  \ 手册页：http://www.tcpdump.org/tcpdump_man.html。\n\n## 配置 TCP/UDP 和端口过滤器\n\n在本小节中，我们将介绍第\
  \ 4 层 TCP/UDP 端口过滤器，以及如何在捕获过滤器中使用它们。\n\n## 准备工作\n\n基本的第 4 层过滤器如下：\n\n- `port <port>`：当数据包是第\
  \ 4 层协议（如 TCP 或 UDP）时，此过滤器将捕获发往或来自标识符字段中指定端口的数据包\n- `dst port <port>`：当数据包是第 4 层协议（如\
  \ TCP 或 UDP）时，此过滤器将捕获发往标识符字段中指定目的端口的数据包\n- `src port <port>`：当数据包是第 4 层协议（如 TCP\
  \ 或 UDP）时，此过滤器将捕获来自标识符字段中指定源端口的数据包\n\n端口范围匹配过滤器如下：\n\n- `tcp portrange <p1>-<p2>`\
  \ 或 `udp portrange <p1>-<p2>`：端口范围在 p1 到 p2 之间的 TCP 或 UDP 数据包\n- `tcp src portrange\
  \ <p1>-<p2>` 或 `udp src portrange <p1>-<p2>`：源端口范围在 p1 到 p2 之间的 TCP 或 UDP 数据包\n\
  - `tcp dst portrange <p1>-<p2>` 或 `udp src portrange <p1>-<p2>`：目的端口范围在 p1 到 p2\
  \ 之间的 TCP 或 UDP 数据包\n\n## 操作步骤...\n\n按照“配置捕获过滤器”小节中的说明操作，并按如下方式配置过滤器：\n\n- 1. 要捕获发往端口\
  \ 80（HTTP）的数据包，请配置 `dst port 80` 或 `dst port http`。\n- 2. 要捕获发往或来自端口 5060（SIP）的数据包，请配置\
  \ `port 5060`。\n- 3. 要捕获发往或来自端口 5060（SIP）的数据包，请配置 `port 5060`。\n- 4. 要捕获所有 TCP 连接的开始（SYN\
  \ 标志）和结束（FIN 标志）数据包，请配置 `tcp[tcpflags] & (tcp-syn|tcp-fin) != 0`。\n\n### 提示\n\n\
  在 `tcp[tcpflags] & (tcp-syn|tcp-fin) != 0` 中，务必注意这是一个按位与运算，而不是逻辑与运算。例如，010 或 101\
  \ 等于 111，而不是 000。\n\n- 5. 要捕获所有 RST（复位）标志设置为 1 的 TCP 数据包，请配置 `tcp[tcpflags] & (tcp-rst)\
  \ != 0`。\n- 6. 长度过滤器按如下方式配置：\n  - `less <length>`：仅捕获长度小于或等于 length 标识符的数据包。这相当于\
  \ `len <= <length>`。\n  - `greater <length>`：仅捕获长度大于或等于 length 标识符的数据包。这相当于 `<len\
  \ >= length>`。\n\n例如，\n\n- `tcp portrange 2000-2500`\n- `udp portrange 5000-6000`\n\
  \n端口范围过滤器可用于那些使用一段端口范围而非特定端口的协议。\n\n## 工作原理…\n\n第 4 层协议（主要是 TCP 和 UDP）是连接终端应用程序的协议。一端的终端节点（例如\
  \ Web 客户端）向另一端（例如 Web 服务器）发送消息，请求与其建立连接。发送请求的进程和接收请求的进程的代码称为端口号。第 9 章“UDP/TCP 分析”将进一步讨论此问题。\n\
  \n在 TCP 和 UDP 中，端口号都表示应用程序的代码。它们之间的区别在于，TCP 是面向连接的可靠协议，而 UDP 是无连接的不可靠协议。还有一个名为**流控制传输协议（SCTP）**的附加第\
  \ 4 层协议，你可以将其视为 TCP 的高级版本，它也使用端口号。\n\nTCP 标志在数据包中发送，用于建立、维持和关闭连接。当数据包中的特定位被设置为 1\
  \ 时，即会发出一个信号。最常用的标志如下：\n\n- **SYN**：用于打开连接的信号\n- **FIN**：用于关闭连接的信号\n- **ACK**：用于确认已接收数据的信号\n\
  - **RST**：用于立即关闭连接的信号\n- **PSH**：用于将数据推送给终端进程（应用程序）处理的信号\n\n使用捕获过滤器，你可以过滤与特定应用程序往来通信的数据包，以及过滤开启了特定标志的数据包。\n\
  \n## 更多内容...\n\n一些有问题的场景（大多是攻击...）如下：\n\n- `tcp[13] & 0x00 = 0`：未设置任何标志（空扫描）\n-\
  \ `tcp[13] & 0x01 = 1`：设置**FIN**且未设置**ACK**\n- `tcp[13] & 0x03 = 3`：设置**SYN**和**FIN**\n\
  - `tcp[13] & 0x05 = 5`：设置**RST**和**FIN**\n- `tcp[13] & 0x06 = 6`：设置**SYN**和**RST**\n\
  - `tcp[13] & 0x08 = 8`：设置**PSH**且未设置**ACK**\n\n在下面的示意图中，你可以看到其工作原理。`tcp[13]` 表示从协议头起始处开始的字节数，其中\
  \ 0、1、3、5、6 和 8 这些值对应标志的位置。\n\n![](img/da40f92928403866599198344271d63e_374_0.png)\n\
  \n## 另请参阅\n\n第 9 章“UDP/TCP 分析”对 UDP 和 TCP 进行了更深入的描述。\n\n## 准备工作\n\n结构化过滤器按以下格式编写：\n\
  \n```\n[not] primitive [and|or [not] primitive ...]\n```\n\n以下修饰符常用于 Wireshark 捕获过滤器：\n\
  \n- `!` 或 `not`\n- `&&` 或 `and`\n- `||` 或 `or`\n\n## 操作步骤...\n\n要配置结构化过滤器，只需根据前面小节中学到的内容编写条件，使条件满足你的需求即可。\n\
  \n一些常用的过滤器如下：\n\n- 1. 要仅捕获单播数据包，请配置 `not broadcast and not multicast`。\n- 2. 要捕获发往\
  \ www.youtube.com 的 HTTP 数据包，请配置 `host www.youtube.com and port 80`。\n- 3. 要捕获与特定主机之间往来通信的\
  \ telnet 流量，请配置 `tcp port 23 and host 192.180.1.1`。\n- 4. 要捕获所有并非来自 192.168.1.1\
  \ 的 telnet 流量，请配置 `tcp port 23 and not src host 192.168.1.1`。\n\n## 工作原理...\n\n\
  结构化过滤器的一些示例：\n\n要捕获从源端口范围 5000-6000 发往 tcp 端口 23（Telnet）的数据，请配置 `tcp dst port 23\
  \ and tcp src portrange 5000-6000`。\n\n## 更多内容...\n\n一些有趣的示例如下：\n\n- `host www.mywebsite.com\
  \ and not (port 80 or port 23)`\n- `host 192.168.0.50 and not tcp port 80`\n- `host\
  \ 10.0.0.1 and not host 10.0.0.2`\n\n## 准备工作\n\n要配置字节偏移和负载匹配过滤器，请启动 Wireshark，并按照本章开头的“配置捕获过滤器”小节中的说明进行操作。\n\
  \n## 操作步骤...\n\n- 1. 字符串匹配过滤器用于检查数据包头中的特定字符串。其格式如下：\n  \n  `proto [Offset: bytes]`\n\
  \  \n  使用此过滤器，我们可以针对 IP、TCP 和 UDP 中的字符串创建过滤器。\n- 2. 对于 IP 字符串匹配过滤器，你可以创建以下过滤器：\n\
  \  \n  `ip [Offset:Bytes]`\n- 3. 要匹配应用数据，即查看 TCP 或 UDP 承载的应用数据，最常见的用法是：`tcp[Offset:Bytes]`\
  \ 或 `udp[Offset:Bytes]`。\n\n\n\n\n\n### 工作原理...\n\n偏移量过滤器的一般结构如下：\n\n```\nproto\
  \ [Offset in bytes from the start of the header : Number of bytes to check]\n```\n\
  \n字符串匹配过滤器的常见示例如下：\n\n1. 要过滤目标 TCP 端口在 50 到 100 之间的数据包，请配置 (tcp[2:2] > 50 and tcp[2:2]\
  \ < 100)。\n\n这里我们从 TCP 头部起始处开始偏移两个字节，然后检查接下来的两个字节，要求其小于 100 且大于 50。\n\n![](img/da40f92928403866599198344271d63e_385_0.png)\n\
  \n2. 要检查 TCP 窗口大小小于 8192，请配置 tcp[14:2] < 8192。\n\n这里我们从 TCP 头部起始处偏移两个字节，然后检查接下来的两个字节（窗口大小）是否小于\
  \ 8192。\n\n![](img/da40f92928403866599198344271d63e_385_1.png)\n\n在 http://www.wireshark.org/tools/string-cf.html\
  \ 中有一个很好用的字符串匹配捕获过滤器生成器。\n\n### 更多内容...\n\n你还可以在 `tcpdump` 手册页中查看更多过滤器：\n\n1. 要打印进出端口\
  \ 80 的所有 IPv4 HTTP 数据包（即只打印包含数据的数据包，而不是例如仅含 SYN、FIN 或 ACK 的数据包），请配置以下过滤器：`tcp port\
  \ 80 and ((ip[2:2] - ((ip[0]&0xf)<<2)) - ((tcp[12]&0xf0)>>2)) != 0`。\n2. 要打印每个涉及非本地主机的\
  \ TCP 会话的起始和结束数据包（SYN 和 FIN 数据包），请配置 `tcp[tcflags] & (tcp-syn|tcp-fin) != 0 and\
  \ not src and dst net <localnet>`。\n3. 要打印未通过以太网广播或多播发送的 IP 广播或多播数据包，请配置 `ether[0]\
  \ & 1 = 0 and ip[16] >= 224`。\n4. 要打印所有不是回显请求/应答（即不是 ping 数据包）的 ICMP 数据包，请配置 `icmp[icmptype]\
  \ != icmp-echo and icmp[icmptype] != icmp-echoreply`。\n"
- "## 第 3 章 使用显示过滤器\n\n在本章中，你将学习以下内容：\n\n- 配置显示过滤器\n- 配置以太网、ARP、主机和网络过滤器\n- 配置 TCP/UDP\
  \ 过滤器\n- 配置特定协议过滤器\n- 配置子字符串操作符过滤器\n- 配置宏\n\n### 简介\n\n在本章中，我们将学习如何使用显示过滤器。显示过滤器是我们在捕获数据之后（无论是否经过捕获过滤器过滤）应用的过滤器，用于只显示部分数据。\n\
  \n实现显示过滤器可以定位各种类型的数据：\n\n- 参数，如 IP 地址、TCP 或 UDP 端口号、URL 和服务器名称\n- 条件，如“数据包长度小于...”和\
  \ TCP 端口范围\n- 现象，如 TCP 重传、重复及其他类型的 ACK、各种协议错误代码和标志位存在性\n- 各种应用程序参数，如短消息服务（SMS）的源和目的号码，以及服务器消息块（SMB）服务器名称\n\
  \n任何通过网络发送的数据都可以被过滤，过滤后，你可以根据它创建统计信息和图表。\n\n正如我们将在本章的操作步骤中描述的那样，配置显示过滤器有多种方式：从预定义菜单中配置、从数据包面板中配置，或者直接编写语法。\n\
  \n### 提示\n\n使用显示过滤器时，不要忘记所有数据都已被捕获，显示过滤器仅决定显示哪些数据。因此，在过滤数据之后，捕获文件仍包含已捕获的原始数据。你可以稍后保存完整数据，或仅保存显示的数据。\n\
  \n### 配置显示过滤器\n\n要配置显示过滤器，你可以选择以下几种选项之一：\n\n- 从过滤器菜单中选择\n- 直接在显示过滤器窗口中编写语法（使用 Wireshark\
  \ 时，过一段时间这将成为你的最爱）\n- 在数据包面板中选择一个参数并将其定义为过滤器\n- 在命令行中使用 `tshark` 或 `wireshark`；这将在[附录](#)中讨论\n\
  \n本章讨论前三个选项。\n\n你可以在参数和运算符之间插入一个空格，或者不加空格。\n\n每当你对组合表达式（如 eth.addr、ip.addr、tcp.port\
  \ 和 udp.port）使用 != 运算符时，Wireshark 会将显示过滤器区域标为黄色，但由于以下原因，这将无法正常工作。\n\n当你输入诸如 ip.addr\
  \ != 192.168.1.100 这样的过滤器表达式时，你会看到 **数据包包含的字段 ip.addr 的值不同于 192.168.1.100。** 由于一个\
  \ IP 数据报同时包含源地址和目的地址，只要这两个地址中至少有一个不同于 192.168.1.100，该表达式就会求值为真。因此，你应该写成 !(ip.addr\
  \ == 192.168.1.100)；这会显示 **所有不满足“字段 ip.addr 的值为 1.2.3.4”的数据包。**\n\n有几种运算符，如下所示：\n\
  \n| C 语言风格语法 | 简写 | 描述 | 示例 |\n|---|---|---|---|\n| && | and | 逻辑与 | ip.src==10.0.0.1\
  \ and tcp.flags.syn==1<br>实际上，来自 IP 地址 10.0.0.1 的所有 SYN 标志以及从该地址打开（或尝试打开）的所有连接。\
  \ |\n| \\|\\| | or | 逻辑或 | ip.addr==10.0.0.1 or ip.addr==10.0.0.2<br>进出这两个 IP 地址的所有数据包。\
  \ |\n| ! | not | 逻辑非 | not arp and not icmp<br>既不是 ARP 也不是 ICMP 的所有数据包。 |\n\n###\
  \ 操作步骤...\n\n要配置显示过滤器，你可以选择前面提到的任何一种方法。\n\n### 从过滤器菜单中选择\n\n要从过滤器菜单中选择，请导航到窗口上方的显示过滤器面板，然后点击“表达式...”按钮，如下面的截图所示：\n\
  \n![](img/da40f92928403866599198344271d63e_394_0.png)\n\n当你点击“表达式...”按钮时，将打开以下窗口：\n\
  \n**Wireshark：过滤器表达式 - 配置文件：New**  \n字段名  \n关系  \n值（协议）  \n预定义值：  \n范围（偏移量:长度） \
  \ \n确定  \n取消\n\n过滤器菜单中有五个重要的面板：\n\n- **字段名**：在此面板中，你配置过滤器参数。你可以通过输入协议名称跳转到该协议，并通过点击列表左侧的\
  \ + 号获取协议参数。\n\n  一个例子是：输入 `ipv4` 跳转到 **IPv4** 协议，点击 + 号展开协议参数（或按两次 Enter），然后选择\
  \ **ip.addr** 来过滤特定的 IP 地址。\n\n  另一个例子是：输入 `tcp` 跳转到 **TCP** 协议，点击协议参数左侧的 + 号，然后选择\
  \ **tcp.port** 作为源或目的端口号。\n\n- **关系**：这是你选择操作符的面板。你可以选择 == 表示等于，!= 表示不等于，等等。\n\n\
  \  一个例子是：输入 `sip` 跳转到 **SIP** 协议，选择 **sip.Method**，然后在 **关系** 面板中选择 ==。在 **值**（协议）面板中输入\
  \ `invite`。这将过滤所有 SIP INVITE 方法。\n\n- **值：** 在这里，你输入之前选择的字段的值。\n\n  一个例子是：输入 `tcp`\
  \ 跳转到 **TCP** 协议，点击 + 号进入协议参数，选择 **tcp.flags.syn** 作为 TCP SYN 标志，并在 **值** 字段中输入\
  \ 1。\n\n- **预定义值：** 当你选择的字段值不是布尔值时，此字段中可能会有一个选项列表。\n\n  一个例子是：在 **TCP** 下有一个名为 **tcp.option_kind**\
  \ 的选项。此选项与 **TCP 选项** 相关（更多详情，请参阅[第9章](#)，UDP/TCP 分析）。你将获得一个可能值的列表。\n\n- **范围（偏移量:长度）：**\
  \ 此字段以 `offset:length` 格式提供字符串的长度。\n\n### 直接在显示过滤器窗口中编写语法\n\n等你熟悉了显示过滤器语法后，你可能会发现直接在过滤器窗口中输入过滤器字符串会更简单：\n\
  \n![](img/da40f92928403866599198344271d63e_396_0.png)\n\n在这种情况下，当你在窗口中输入过滤器字符串时，窗口会以以下三种颜色之一亮起：\n\
  \n- **绿色：** 表示过滤器正确，你可以应用它。\n- **红色：** 表示字符串有误。在应用之前请先修正字符串。\n- **黄色：** 每当你使用 `!=`\
  \ 操作符时，显示过滤器区域会变为黄色。这并不意味着你的过滤器不会工作，只是一个警告，提示它可能无法工作。\n\n### 在数据包面板中选择参数并将其定义为过滤器\n\
  \n\n\n\n\n这是一个非常方便的选项。你可以从捕获文件中数据包详情窗格中选择任何字段；右键单击它，你会得到一些选项，如以下屏幕截图所示：\n\n![](img/da40f92928403866599198344271d63e_397_0.png)\n\
  \n其中一些选项如下：\n\n- **Apply as Filter**：这将根据你选择的字段设置一个过滤器并将其应用于捕获的数据。\n- **Prepare\
  \ a Filter**：这将准备一个过滤器但不应用它。它将在你点击过滤器窗口右侧的 Apply 按钮时应用。\n\n在这两种选项中，你都可以选择配置过滤器：\n\
  \n- **Selected**：这将选择所选的字段和参数\n- **Not Selected**：这将选择未选择的字段和参数\n\n例如，右键单击字段 http.request.method\
  \ 并选择 Selected 将得到过滤器字符串 http.request.method == GET；而选择 Not Selected 将得到字符串 `!(http.request.method\
  \ == \"GET\")`。\n\n你还可以选择选项 **... and selected**、**... or selected**、**... and not\
  \ selected** 或 **... or not selected** 来进行结构化过滤。\n\n## How it works...\n\n显示过滤器是一种专有的\
  \ Wireshark 语言。显示过滤器可以在许多地方使用，这将在后面的章节中讨论。本章接下来的配方中将介绍额外的过滤器。\n\n你始终可以使用自动完成功能来完成过滤器字符串。例如，如果你输入\
  \ `tcp.f`，如以下屏幕截图所示，自动完成功能会列出可以从 `tcp.f` 开始创建的可能显示过滤器值，即 TCP 标志（SYN、FIN、RST 等）。\n\
  \n![](img/da40f92928403866599198344271d63e_399_0.png)\n\n## There's more...\n\n\
  现在我们将介绍一些额外的有帮助功能。\n\n## What is the parameter we filter?\n\n只要你在数据包详情窗格中标记特定字段，你就会在\
  \ Wireshark 窗口左下角的状态栏中看到相关的过滤器字符串。\n\n![](img/da40f92928403866599198344271d63e_400_0.png)\n\
  \n## Adding a parameter column\n\n你也可以右键单击数据包窗格中的参数并选择 Apply as Column。这将添加一个包含特定参数的列。例如，你可以选择参数\
  \ tcp.window_size_value 并将其作为列添加到数据包列表窗格中，这样你就可以在线监视 TCP 窗口大小。这会影响 TCP 性能，我们将在第\
  \ 9 章 UDP/TCP Analysis 中学习。\n\n## Saving the displayed data\n\n要保存显示的数据，你可以导航到 File\
  \ | Export Specified Packets... 并选择要保存的数据包。\n\n## Configuring Ethernet, ARP, host,\
  \ and network filters\n\n在本配方中，我们将讨论如何配置第 2 层和第 3 层的过滤器，即基于以太网和基于 IP 的过滤器。我们还将讨论地址解析协议（ARP）过滤器。\n\
  \n## Getting ready\n\n在第 2 层我们将配置基于以太网的过滤器，而在第 3 层我们将配置基于 IP 的过滤器。在以太网中，我们有基于以太网帧和\
  \ MAC 地址的过滤器，而在 IP 中，我们有基于 IP 数据包和地址的过滤器。\n\n常见的帧增量过滤器如下：\n\n- `frame.time_delta`：这用于当前帧和之前捕获帧之间的时间增量；这将在\
  \ [Chapter 5](#) 中显示的统计图表中使用，Using Advanced Statistics Tools\n- `frame.time_delta_displayed`：这用于当前帧和之前显示帧之间的时间增量；这将在\
  \ [Chapter 5](#) 中显示的统计图表中使用，Using Advanced Statistics Tools\n\n由于帧之间的时间可能会显著影响\
  \ TCP 性能，我们将在用于监视 TCP 性能的统计图表中使用 `frame.time_delta` 参数。\n\n常见的第 2 层（以太网）过滤器如下：\n\
  \n- `eth.addr == <MAC Address>`：这用于显示特定的 MAC 地址\n- `eth.src == <MAC Address>`：这用于获取源\
  \ MAC 地址\n- `eth.dst == <MAC Address>`：这用于获取目标 MAC 地址\n- `eth.type == <Protocol\
  \ Type (Hexa)>`：这用于获取以太网协议类型\n\n常见的 ARP 过滤器如下：\n\n- `arp.opcode == <value>`：这用于\
  \ ARP 请求/响应\n- `arp.src.hw_mac == <MAC Address>`：这用于捕获发送者的 ARP 地址\n\n常见的第 3 层（IP）过滤器如下：\n\
  \n- `ip.addr == <IP Address>`：这用于获取源或目标 IP 地址\n- `ip.src == <IP Address>`：这用于获取源\
  \ IP 地址\n- `ip.dst == <IP Address>`：这用于获取目标 IP 地址\n- `ip.ttl == <value>, ip.ttl\
  \ < <value>, or ip.ttl > <value>`：这用于获取 IP TTL（生存时间）值\n- `ip.len = <value>, ip.len\
  \ > <value>, or ip.len < <value>`：这用于获取 IP 数据包长度值\n- `ip.version == <4/6>`：这用于获取\
  \ IP 协议版本（版本 4 或版本 6）\n\n## How to do it...\n\n这里我们将看到第 2 层和第 3 层过滤器的一些常见示例。\n\n\
  | Address format | Syntax | Example |\n|---|---|---|\n| Ethernet (MAC) address |\
  \ `eth.addr == xx:xx:xx:xx:xx:xx`<br><br>Here, x = 0 to f.<br><br>`eth.addr == xx-xx-xx-xx-xx-xx`<br><br>Here,\
  \ x = 0 to f.<br><br>`eth.addr == xxxx.xxxx.xxxx`<br><br>Here x = 0 to f. | `eth.addr\
  \ == 00:50:7f:cd:d5:38`<br><br>`eth.addr == 00-50-7f-cd-d5-38`<br><br>`eth.addr\
  \ == 0050.7fcd.d538` |\n| Broadcast MAC address | `Eth.addr == ffff.ffff.ffff` |\
  \ |\n| IPv4 host address | `ip.addr == x.x.x.x`<br><br>Here, x = 0 to 255. | `ip.addr\
  \ == 192.168.1.1` |\n| IPv4 network address | `ip.addr == x.x.x.x/y`<br><br>Here\
  \ x = 0 to 255, y = 0 to 32. | `ip.addr == 192.168.200.0/24`<br><br>This covers\
  \ all the addresses in the network 192.168.200.0 mask 255.255.255.0. |\n| IPv6 host\
  \ address | `ipv6.addr == x:x:x:x:x:x:x:x`<br><br>`ipv6.addr == x:x:x:x:x:x`<br><br>Here\
  \ in the format of nnnn, n = 0 to f (Hex). | `ipv6.addr == fe80::85ab:dc2e:ab12:e6c7`\
  \ |\n| IPv6 network address | `ipv6.addr == x::/y`<br><br>Here x = 0 to f (Hex)\
  \ and y = 0 to 128. | `ipv6.addr == fe80::/16`<br><br>This covers all the addresses\
  \ that start with the 16 bits `fe80`. |\n\n该表指的是 `ip.addr` 和 `ipv6.addr` 过滤器字符串。任何具有\
  \ IP 地址值的字段的值都可以以相同的方式编写。\n\n## Ethernet filters\n\n这些分为两类：\n\n- 要仅显示从特定 MAC 地址发送或发往特定\
  \ MAC 地址的数据包，使用类似以下内容：`eth.src == 10:0b:a9:33:64:18 and eth.dst == 10:0b:a9:33:64:18`\n\
  - 要仅显示广播，使用 `Eth.dst == ffff.ffff.ffff`\n\n## ARP filters\n\n这些分为两类：\n\n- 要仅显示 ARP\
  \ 请求，使用 `arp.opcode == 1`\n- 要仅显示 ARP 响应，使用 `arp.opcode == 2`\n\n## IP and ICMP\
  \ filters\n\n- 要仅显示来自特定 IP 地址的数据包，使用类似以下内容：`ip.src == 10.1.1.254`\n- 要仅显示不是来自特定地址的数据包，使用类似以下内容：`!ip.src\
  \ == 64.23.1.1`\n- 要仅显示两个主机之间的数据包，使用类似以下内容：`ip.addr == 192.168.1.1 and ip.addr ==\
  \ 200.1.1.1`\n- 要仅显示发送到多播 IP 地址的数据包，使用类似以下内容：`ip.dst == 224.0.0.0/4`\n- 要仅显示来自网络\
  \ 192.168.1.0/24（掩码 255.255.255.0）的数据包，使用 `ip.src==192.168.1.0/24`\n- 要仅显示到/来自特定地址的\
  \ IPv6 数据包，使用类似以下内容：\n  - `ipv6.addr == ::1`\n  - `ipv6.addr == 2008:0:130F:0:0:09d0:666A:13ab`\n\
  \  - `ipv6.addr == 2006:0:130f::9c2:876a:130b`\n  - `ipv6.addr == ::`\n\n## Complex\
  \ filters\n\n- 要检查从网络 10.0.0.0/24 发送到包含单词 packt 的网站的数据包，使用 `ip.src == 10.0.0.0/24\
  \ and http.host contains \"packt\"`\n- 要检查从网络 10.0.0.0/24 发送到以\n\n\n\n\n\n## 工作原理...\n\
  \n以下是对本教程“操作步骤...”部分中我们所见过滤器的一些说明。\n\n### 以太网广播\n\n在以太网中，广播是发送到目的地址字段全为1的地址的数据包，因此，要查找网络中的所有广播，我们使用过滤器\
  \ `eth.dst == ffff.ffff.ffff`。\n\n### IPv4 多播\n\nIPv4 多播是发送到地址范围为 224.0.0.0 至 239.255.255.255\
  \ 的地址的数据包，其二进制地址范围为 11100000.00000000.00000000.00000000 至 11101111.11111111.11111111.11111111。\n\
  \n如果查看二进制表示，目的多播地址是以三个1和一个0开头的地址，因此，针对 IPv4 多播目的地址的过滤器将是 `ip.dst == 224.0.0.0/4`。也就是说，以四个1（即224）开头且子网掩码为4位（`/4`）的地址，将指示从224到239的网络地址范围，从而过滤多播地址。\n\
  \n### IPv6 多播\n\nIPv6 多播是发送到以 ff 开头（前两个十六进制数字为 ff）的地址的数据包，后面跟一位标志和范围。因此，当我们编写过滤器\
  \ `ipv6.dst == ff00::/8` 时，它表示显示所有发送到以字符串 ff 开头的地址的 IPv6 数据包，即 IPv6 多播。\n\n## 另请参阅\n\
  \n- 有关以太网的更多信息，请参阅[第7章](#)，以太网、局域网交换和无线局域网\n\n## 配置 TCP/UDP 过滤器\n\nTCP 和 UDP 是第4层中提供端到端应用程序连接的主要协议。当你从一端向另一端启动应用程序时，会话从源端口开始——通常是一个大于或等于1024的随机数——并连接到目的端口，另一端是一个等待会话的知名或已注册端口。这些端口号标识了该会话上运行的应用程序。\n\
  \n其他类型的过滤器涉及 UDP 和 TCP 报头中的其他字段。UDP 的报头非常简单，只包含非常基本的数据；而 TCP 报头则更复杂，从中我们可以获取更多信息。\n\
  \n在本教程中，我们将重点介绍配置 TCP 和 UDP 显示过滤器时的各种可能性。\n\n### 准备工作\n\n如前所述，我们应该精确规划想要显示的内容，并据此准备好过滤器。\n\
  \n对于 TCP 或 UDP 端口号，请使用以下显示过滤器：\n\n- `tcp.port == <value>` 或 `udp.port == <value>`：用于指定\
  \ TCP 或 UDP 端口（源或目的）。\n- `tcp.dstport == <value>` 或 `udp.dstport == <value>`：用于指定\
  \ TCP 或 UDP 目的端口。\n- `tcp.srcport == <value>` 或 `udp.srcport == <value>`：用于指定 TCP\
  \ 或 UDP 源端口。\n\nUDP 的报头结构非常简单：包含源端口、目的端口、数据包长度和校验和。因此，这里唯一重要的信息就是端口号。\n\n另一方面，TCP\
  \ 更复杂，使用了连接和可靠性机制，Wireshark 可以监控这些机制。使用 `tcp.flags`、`tcp.analysis` 和其他智能过滤器将帮助你解决性能问题（重传、重复\
  \ ACK、零窗口等）以及协议操作问题（如重置、半开连接等）。\n\n此类别中常见的显示过滤器如下：\n\n- `tcp.analysis`：用于 TCP 分析条件，如重传、重复\
  \ ACK 或窗口问题。此过滤器的示例如下（你可以使用自动补全功能获取可用过滤器的完整列表）：\n  - `tcp.analysis.retransmission`：用于显示被重传的数据包。\n\
  \  - `tcp.analysis.duplicate_ack`：用于显示被多次确认的数据包。\n  - `tcp.analysis.zero_window`：用于显示连接端设备发送零窗口消息（告知发送方停止在该连接上发送数据，直到窗口大小再次增大）时的数据包。\n\
  \n**提示：**\n\n`tcp.analysis` 过滤器不分析 TCP 报头；它们通过 Wireshark 专家系统提供协议分析。\n\n- `tcp.flags`：用于判断某个或多个标志是否被设置。此过滤器的示例如下：\n\
  \  - `tcp.flags.syn == 1`：用于检查 SYN 标志是否被设置。\n  - `tcp.flags.reset == 1`：用于检查 RST\
  \ 标志是否被设置。\n  - `tcp.flags.fin == 1`：用于检查 FIN 标志是否被设置。\n\n**提示：**\n\n对于 TCP 标志，`tcp.flags`\
  \ 过滤器用于判断特定标志是否被设置。\n\n- `tcp.window_size_value < <value>`：用于查找较小的 TCP 窗口大小，在某些情况下这些窗口大小表示设备性能较慢。\n\
  \n### 操作步骤...\n\n以下是一些 TCP/UDP 过滤器示例：\n\n- 要过滤发送到 HTTP 服务器的所有数据包，请使用 `tcp.dstport\
  \ == 80`。\n- 要过滤从 10.0.0.0/24 网络发送到 HTTP 服务器的所有数据包，请使用 `ip.src==10.0.0.0/24 and\
  \ tcp.dstport == 80`。\n- 要过滤特定 TCP 连接中的所有重传，请使用 `tcp.stream eq 16 && tcp.analysis.retransmission`。\n\
  \n要隔离特定连接，请将鼠标放在要观察的连接中的某个数据包上，右键单击它，然后选择**跟踪 TCP 流**。TCP 流是在连接建立到连接拆除之间，连接两端传输的数据。字符串\
  \ `tcp.stream eq <value>` 将出现在显示过滤器窗口中。这就是你现在可以操作的流。在前面的示例中，它是流16，但也可以是任何流编号（捕获文件中的编号从流1开始）。\n\
  \n重传是再次发送的 TCP 数据包。可能是由多种原因导致的，如第9章“UDP/TCP 分析”中所述。\n\n**提示：**\n\n在监控影响性能的现象（如重传、重复\
  \ ACK 等）时，务必记住这些现象是针对特定 TCP 连接的。\n\n其他类型的 TCP 过滤器示例如下：\n\n- 要过滤特定连接中的所有窗口问题：\n \
  \ - `tcp.stream eq 0 && (tcp.analysis.window_full || tcp.analysis.zero_window)`\n\
  \  - `tcp.stream eq 0 and (tcp.analysis.window_full or tcp.analysis.zero_window)`\n\
  - 要过滤从 10.0.0.5 发送到 DNS 服务器的所有数据包：`ip.src == 10.0.0.5 && udp.port == 53`\n- 要过滤\
  \ TCP 中所有包含字符串 cacti（区分大小写）的数据包或协议（例如 HTTP）：`tcp contains \"cacti\"`\n- 要检查从 10.0.0.3\
  \ 重传的所有数据包：`ip.src == 10.0.0.3 and tcp.analysis.retransmission`\n- 要过滤发送到任意 HTTP\
  \ 服务器的所有数据包：`tcp.dstport == 80`\n- 要检查从特定主机发起的连接（如果以扫描形式出现，可能是蠕虫！）：`ip.src==10.0.0.5\
  \ && tcp.flags.syn==1 && tcp.flags.ack==0`\n- 要检查发送自客户端以及发送给客户端的所有 Cookie：`ip.src==10.0.0.3\
  \ && (http.cookie || http.set_cookie)`\n\n### 工作原理...\n\n下面分别是 IP 和 TCP 报头结构的示意图。UDP\
  \ 非常简单，只有源端口号、目的端口号、长度和校验和。在下图中，我们看到了 IP 报头结构：\n\n![](img/da40f92928403866599198344271d63e_415_0.png)\n\
  \nIP 数据包中的一些重要字段如下：\n\n- **版本：** 版本可以是4或6。\n- **报头长度（HL）：** 报头长度为20到24字节，包含选项。\n\
  - **服务类型（ToS）：** 通常通过**差异化服务（DiffServ）**实现，为优先服务提供优先级。\n\n**提示：**\n\nIP 标准（1981年9月的\
  \ RFC 791）将该字段命名为服务类型（ToS）并定义了其结构。差异化服务的标准后来发布（1998年12月的 RFC 2474、RFC 2475 等），并在大多数应用程序中用于实现\
  \ ToS 字节。\n\n- **长度：** 此字段指示以字节为单位的总数据报长度。\n- **16位标识符、标志和分片偏移：** 每个数据包都有自己的数据包\
  \ ID。当与标志和偏移一起分片时，这些信息使接收方能够重新组装数据报。\n- **生存时间（TTL）：** 初始值为64、128或256（取决于发送数据包的操作系统），路径上的每个路由器将值减1。这是为了防止数据包在网络中无休止地传输。路由器看到数据包中的值为1时，将其减为0并丢弃数据包。\n\
  - **上层：** 此字段包含上层协议，如 TCP、UDP 和 ICMP。\n- **校验和：** 此字段表示数据包校验和。这里的原理是发送方使用错误检查机制计算数据包上的一个值，并将该值设置在校验和字段中；数据包接收方再次计算它。如果发送的值与接收到的值不相等，则视为校验和错误。\n\
  - **32位源和目的 IP 地址：** 顾名思义，即源 IP 地址和目的 IP 地址。\n- **选项：** 此字段在 IPv4 中通常不使用。在下图中，你可以看到\
  \ TCP 报头：\n\n\n扩展。**最大分段大小（MSS）**是 TCP 载荷的最大大小。该字段对此进行了标识。关于这一点的进一步讨论将在[第9章](Chapter\
  \ 9)UDP/TCP 分析中进行。\n\n#### 更多内容...\n\nIP 中的 TTL 字段是一个非常有用的字段。在检查 TTL 值时，它明确地指示了数据包已经经过了多少个路由器。由于操作系统的默认值是\
  \ 64、128 或 256，而数据包在互联网上穿越的最大跳数为 30（在私有网络中则要少得多）。例如，如果看到值为 120，则数据包经过了 8 个路由器；值为\
  \ 52 则表示数据包经过了 12 个路由器。\n\n#### 另请参阅\n\n- 有关 TCP/IP 协议栈的更多信息，请参阅[第9章](Chapter 9)UDP/TCP\
  \ 分析\n\n### 配置特定协议过滤器\n\n在本操作中，我们将查看为常见协议（如 DNS、HTTP 和 FTP）配置显示过滤器的说明和示例。\n\n本操作的目的是学习如何配置过滤器，以帮助我们进行网络故障排除。我们将在接下来的章节中学习网络故障排除。\n\
  \n#### 准备工作\n\n要执行本操作，你需要一个正在运行的 Wireshark 软件捕获；没有其他先决条件。\n\n#### 操作步骤...\n\n在本操作中，我们将了解一些常见协议的显示过滤器。\n\
  \n#### HTTP 显示过滤器\n\n以下是一些常见的 HTTP 显示过滤器：\n\n- 要显示发送到<\"主机名\">的所有 HTTP 数据包，请使用 `http.request.method\
  \ == <\"Request methods\">`\n- 要显示使用 HTTP GET 方法的数据包，请使用 `http.request.method ==\
  \ \"GET\"`\n- 要显示客户端请求的 URI，请使用 `http.request.method == <\"Full request URI\">`；例如，`http.request.uri\
  \ == \"/v2/rating/mail.google.com\"`\n- 要显示包含特定字符串的客户端请求的 URI（例如上述所有发送到 Google 的请求），请使用\
  \ `http.request.uri contains \"URI String\"`；例如，`http.request.uri contains \"mail.google.com\"\
  `\n- 要检查通过网络发送的所有 cookie 请求（请注意，cookie 总是从客户端发送到服务器），请使用 `http.cookie`\n- 要检查从服务器发送到客户端的所有\
  \ cookie 设置命令，请使用 `http.set_cookie`\n- 要检查 Google 服务器发送到你的 PC 的所有 cookie，请使用 `(http.set_cookie)\
  \ && (http contains \"google\")`\n- 要检查包含 ZIP 文件的所有 HTTP 数据包，请使用 `http matches \"\
  \\.zip\" && http.request.method == \"GET\"`\n\n#### DNS 显示过滤器\n\n在这里，我们将了解一些常见的\
  \ DNS 显示过滤器。\n\n要显示 DNS 查询和响应，请使用：\n\n- `dns.flags.response == 0` 用于 DNS 查询\n- `dns.flags.response\
  \ == 1` 用于 DNS 响应\n\n要仅显示包含四个或更多答案的 DNS 响应，请使用 `dns.count.answers >= 4.`\n\n####\
  \ FTP 显示过滤器\n\n#### 工作原理...\n\nWireshark 用于显示过滤器的正则表达式语法与 Perl 中的正则表达式语法相同。\n\n\
  一些常见的修饰符如下：\n\n- `^`：用于匹配行的开头\n- `$`：用于匹配行的结尾\n- `|`：用于表示或（选择）关系\n- `()`：用于分组\n\
  - `*`：用于匹配 0 次或多次\n- `+`：用于匹配 1 次或多次\n- `?`：用于匹配 1 次或 0 次\n- `{n}`：用于精确匹配 n 次\n\
  - `{n,}`：用于匹配至少 n 次\n- `{n,m}`：用于匹配至少 n 次但不超过 m 次\n\n你可以使用这些修饰符来配置更复杂的过滤器。请看以下示例：\n\
  \n- 要查找包含 ZIP 文件的 HTTP `GET` 命令，请使用：\n\n  ```\n  http.request.method == \"GET\"\
  \ && http matches \"\\\\.zip\" && !\n  (http.accept_encoding == \"gzip, deflate\"\
  )\n  ```\n\n- 要查找包含以 `.com` 结尾的网站的 HTTP 消息，请使用：\n\n  ```\n  http.host matches \"\
  \\\\.com$\"\n  ```\n\n#### 另请参阅\n\n- Perl 正则表达式语法列表可在 http://www.pcre.org/ 找到，手册页可在\
  \ http://perldoc.perl.org/perlre.html 找到\n\n### 配置子串运算符过滤器\n\n偏移过滤器是这样一种过滤器：你实际上是在说“转到协议头中的字段\
  \ x，并检查接下来的 y 个字节是否等于……”。\n\n这些过滤器可用于许多场景：当已知的字符串字节出现在数据包的某个位置，而你想要显示包含该字符串字节的数据包时。\n\
  \n#### 准备工作\n\n要逐步完成本操作，你需要正在运行的 Wireshark 软件和正在运行的捕获；没有其他先决条件。偏移过滤器的一般表示形式为：\n\n\
  ```\nProtocols[x:y] == <value>\n```\n\n其中，x 指从头部开头算起的字节位置，y 指要检查的字节数。\n\n#### 操作步骤...\n\
  \n使用子串运算符的过滤器示例如下：\n\n- **发往 IPv4 组播地址的数据包：** `eth.dst[0:3] == 01:00:5e`（RFC 1112\
  \ 第 6.4 节将 01-00-5E-00-00-00 到 01-00-5E-FF-FF-FF 的 MAC 地址空间分配用于组播寻址）\n- **发往 IPv6\
  \ 组播地址的数据包：** `eth.dst[0:3] == 33:33:00`（RFC 2464 第 7 节将以 33-33 开头的 MAC 地址空间分配用于组播寻址）\n\
  \n#### 工作原理...\n\nWireshark 允许你查看协议并搜索其中的特定字节。这对于协议中的已知字符串特别实用，例如给定示例中的以太网。\n\n\
  ### 配置宏\n\n显示过滤器宏用于为复杂的显示过滤器创建快捷方式，你可以一次性配置，之后反复使用。\n\n#### 准备工作\n\n要配置显示过滤器宏，请导航到**分析\
  \ | 显示过滤器宏 | 新建**。\n\n你将看到以下窗口：\n\n![](img/da40f92928403866599198344271d63e_432_0.png)\n\
  \n#### 操作步骤...\n\n1. 要配置宏，请为它命名，并在文本框中填写过滤器字符串。\n2. 要激活宏，只需编写 `$(macro_name:parameter1;parameter2;parameter3\
  \ ...)`。\n3. 让我们配置一个简单的过滤器名称 `test01`，它接受以下参数作为值：\n   - `ip.src == <value>`\n  \
  \ - `tcp.dstport == <value>`\n\n   这将是一个查找来自特定源网络并前往 HTTP 端口的数据包的过滤器。\n\n   一个接受这两个参数的宏将是：`ip.src==$1\
  \ && tcp.dstport==$2.`\n4. 现在，要获取参数 `ip.src == 10.0.0.4` 和 `tcp.dstport == 80` 的过滤结果，我们应该在显示窗口栏中写入字符串\
  \ `${test01:10.0.0.4;80}`。\n\n#### 工作原理...\n\n宏的工作方式很简单；你在每个位置参数前面写上 $ 符号来编写过滤器字符串。运行宏时，它将按顺序接受这些参数。\n"
- "## 第 4 章 使用基本统计工具\n\n在本章中，你将学习：\n\n- 使用**统计**菜单中的**摘要**工具\n- 使用**统计**菜单中的**协议分级**工具\n\
  - 使用**统计**菜单中的**会话**工具\n- 使用**统计**菜单中的**端点**工具\n- 使用**统计**菜单中的**HTTP**工具\n- 配置**流量图**以查看\
  \ TCP 流\n- 创建基于 IP 的统计信息\n\n### 简介\n\nWireshark 的优势之一在于其统计工具。在使用 Wireshark 时，我们有各种类型的工具，从用于列出终端节点和会话的简单工具，到诸如流量图和\
  \ IO 图等更复杂的工具。\n\n在接下来的两章中，我们将学习如何使用这些工具。在本章中，我们将了解一些为我们提供基本网络统计信息的简单工具；也就是说，谁在网络中与谁通信、哪些设备是“话痨”、网络中传输的数据包大小如何；而在下一章中，我们将介绍\
  \ IO 图和流图等工具，这些工具为我们提供更多关于网络行为的信息。\n\n有些工具我们不会讨论；包括那些显而易见的（例如**数据包大小**）以及那些不太常见的（例如**ANSP、BACnet**\
  \ 等）。\n\n要使用**统计**工具，请启动 Wireshark，并从主菜单中选择**统计**。\n\n\n\n\n# 使用“统计”菜单中的“摘要”工具\n\
  \n在本节中，我们将学习如何获取网络中运行数据的一般信息。\n\n# 准备工作\n\n启动 Wireshark，点击**统计**。\n\n![](img/da40f92928403866599198344271d63e_441_0.png)\n\
  \n# 显示\n\n显示过滤器：无  \n忽略的数据包：0（0.000%）\n\n| 流量 | 已捕获 | 已显示 | 显示百分比 | 已标记 | 标记百分比\
  \ |\n|---|---:|---:|---:|---:|---:|\n| 数据包 | 104645 | 104645 | 100.000% | 0 | 0.000%\
  \ |\n| 第一个和最后一个数据包之间的时间 | 225.452 秒 |  |  |  |  |\n| 平均数据包/秒 | 464.157 |  |  | \
  \ |  |\n| 平均数据包大小 | 971.401 字节 |  |  |  |  |\n| 字节 | 101652223 | 101652223 | 100.000%\
  \ | 0 | 0.000% |\n| 平均字节/秒 | 450882.842 |  |  |  |  |\n| 平均兆比特/秒 | 3.607 |  |  |\
  \  |  |\n\n帮助                                                                              \
  \ 确定       取消\n\n# 工作原理...\n\n此菜单只是收集所有已捕获的数据，当定义了过滤器时，它会显示过滤后的数据。当问题是“如何简单地使用 Wireshark\
  \ 来了解平均每秒的数据包或字节数？”时，这就是答案。\n\n# 使用“统计”菜单中的“协议分级”工具\n\n在本节中，我们将学习如何获取网络中运行数据的协议分级信息。\n\
  \n# 准备工作\n\n启动 Wireshark，点击**统计**。\n\n# 操作步骤...\n\n要使用统计菜单中的“协议分级”工具，请执行以下步骤：\n\n\
  - 1. 在统计菜单中选择“协议分级”。\n\n![](img/da40f92928403866599198344271d63e_446_0.png)\n\n\
  - 2. 这里你将获得关于捕获文件中协议分布的数据。你将看到捕获数据的协议分布，如下面的截图所示：\n\n![](img/da40f92928403866599198344271d63e_446_1.png)\n\
  \n- 3. 你将在“协议分级”窗口中看到以下字段：\n\n  - 协议：此字段指定协议名称\n  - 数据包百分比：此字段指定协议数据包占捕获总数据包的百分比\n\
  \  - **数据包**：此字段指定协议数据包在捕获总数据包中的数量\n  - **字节百分比**：此字段指定协议字节占捕获总数据包的百分比\n  - **字节**：此字段指定协议字节在捕获总数据包中的数量\n\
  \  - **兆比特/秒**：此字段指定该协议相对于捕获时间的带宽\n  - **结束数据包**：此字段指定该协议的数据包总数（针对解码文件中最高层的协议）\n\
  \  - **结束字节**：此字段指定该协议的绝对字节数（针对解码文件中最高层的协议）\n  - **结束兆比特/秒**：此字段指定该协议相对于捕获数据包和时间的带宽（针对解码文件中最高层的协议）\n\
  \n# 提示\n\n**结束数据包**、**结束字节**和**结束兆比特/秒**列是那些该行协议为数据包中最后一个协议的列（即当该协议位于数据包末尾，且没有更高层信息时）。例如，这些可以是带有\
  \ TCP 负载的 TCP 数据包（例如 SYN 数据包），它们不携带任何上层信息。这就是为什么你会看到 Ethernet、IPv4 和 UDP 的结束数据包计数为\
  \ **0**，因为没有帧将这些协议作为帧中的最后一个协议。\n\n# 工作原理...\n\n简而言之，它会对捕获的数据进行统计计算。需要注意的一些重要事项是：\n\
  \n- 百分比始终指同一层协议。例如，在前面的示例中，我们看到 IPv4 占数据包的 81.03%，IPv6 占数据包的 8.85%，ARP 占数据包的 10.12%；第二层以上协议总计为\
  \ 100%。\n- 另一方面，我们看到 TCP 占数据的 75.70%，而在 TCP 中，只有 12.74% 的数据包是 HTTP，且几乎没有其他内容。这是因为\
  \ Wireshark 只统计带有 HTTP 头的数据包。它不统计例如确认数据包或不带 HTTP 头的数据包。\n\n# 扩展内容...\n\n为了确保 Wireshark\
  \ 也会统计数据包，例如 TCP 数据包中的 HTTP 数据包，请禁用**允许子解析器**选项以重组 TCP 流。你可以从**首选项**菜单中执行此操作，或在**数据包详情**窗格中右键单击\
  \ TCP。\n\n# 使用“统计”菜单中的“会话”工具\n\n在本节中，我们将学习如何获取网络中运行的会话信息。\n\n# 准备工作\n\n启动 Wireshark，点击**统计**。\n\
  \n# 操作步骤...\n\n要使用**统计**菜单中的**会话**功能，请执行以下步骤：\n\n- 1. 在统计菜单中选择**会话**。\n\n![](img/da40f92928403866599198344271d63e_452_0.png)\n\
  \n- 2. 将出现以下窗口：\n\n![](img/da40f92928403866599198344271d63e_452_1.png)\n\n- 3. 你可以在第二层以太网统计、第三层\
  \ IP 统计或第四层 TCP 或 UDP 统计之间进行选择。\n- 4. 你可以使用这些统计工具：\n  - **在第二层（以太网）：** 查找并隔离广播风暴，或\n\
  \  - **在第三层或第四层（TCP/IP）：** 与互联网路由器端口并行连接，检查谁在占用到 ISP 的线路。\n\n# 提示\n\n如果你看到大量流量发往互联网上某个特定\
  \ IP 地址的 80 端口（HTTP），只需将该地址复制到浏览器中，即可查看哪个网站对你的用户来说最“热门”。\n\n如果没有任何结果，只需访问一个标准的 DNS\
  \ 解析网站（例如 Google DNS lookup），找出是哪个流量占用了你的互联网线路。\n\n- 5. 你还可以通过选中窗口左下方的**限制为显示过滤器**复选框，将会话统计限制为显示过滤器。这样，统计信息将显示在通过显示过滤器的所有数据包上。\n\
  - 6. 要将 IP 地址显示为名称，你可以选中**名称解析**复选框。要查看名称解析，你需要先通过导航到**视图 | 名称解析 | 为网络层启用**来启用它。\n\
  - 7. 对于 TCP 或 UDP，你可以在**数据包列表**中标记特定数据包，然后从屏幕上出现的菜单中选择**跟踪 TCP 流**或**跟踪 UDP 流**（取决于它是\
  \ UDP 还是 TCP 数据包）。这将定义一个显示过滤器，向你显示特定的数据流。\n\n# 扩展内容...\n\n在使用**会话**列表时，许多网络问题会直接“浮现”出来。\n\
  \n# 以太网会话统计\n\n在以太网会话统计中，查找以下问题：\n\n- 大量广播：你可能正在观察广播风暴（轻微的风暴。在严重的风暴中，你可能什么都看不到。）\n\
  \n# 提示\n\n在严重的广播风暴中，通常发生的情况是，由于 Wireshark 每秒发送和接收数千甚至数万个数据包，软件会直接停止显示数据，屏幕冻结。只有当你将\
  \ Wireshark 从网络中断开时，你才能看到它。\n\n- 如果你看到大量流量来自某个特定 MAC 地址，查看会话的第一部分；这是供应商 ID，它会给你一些关于问题设备的提示。\n\
  \n# 提示\n\n尽管 MAC 地址的前半部分标识供应商，但它不一定标识 PC 本身。这是因为 MAC 地址属于安装在 PC 或笔记本电脑主板上的以太网芯片供应商，而不一定来自\
  \ PC 制造商。如果你无法识别流量到达的地址，你可以 ping 可疑设备并通过 ARP 获取其 MAC 地址，在交换机中找到 MAC 地址，如果你有管理系统，使用简单的\
  \ `find` 命令来定位它。\n\n# IP 会话统计\n\n在 IP 会话统计中，查找以下问题：\n\n- 查找进出流量很大的 IP 地址。如果它是一个你已知的服务器（可能你记得服务器的地址或地址范围），那么没问题；但可能是有人扫描了网络，或者只是一台\
  \ PC 产生了太多流量。\n- 查找扫描模式（详见第 14 章“理解\n\n\n网络安全）。它可以是良性扫描，例如发送 ping 以发现网络的 SNMP 软件，但网络中的扫描通常不是良性的。\n\
  \n-   你可以在下面的截图中看到一种典型的扫描模式：\n\n  ![](img/da40f92928403866599198344271d63e_456_0.png)\n\
  \n在此示例中，存在一种扫描模式。单个 IP 地址 **192.168.110.58** 向 **192.170.3.44、192.170.3.45、192.170.3.46、192.170.3.47**\
  \ 等发送 ICMP 数据包（在截图中我们只看到扫描的极小一部分）。在这个案例中，我们遇到了一种感染了网络上所有 PC 的蠕虫；它一旦感染一台 PC，就会开始生成\
  \ ICMP 请求并将其发送到网络。这种窄带链路（例如 WAN 连接）很容易被阻塞。\n\n## TCP/UDP 会话统计：\n\n-   查找打开 TCP 连接过多的设备。每台\
  \ PC 有 10 到 20 个连接是合理的，数百个则不合理。\n-   查找并尝试找出无法识别的端口号。这可能是正常的，但也可能意味着麻烦。在下面的截图中，你可以看到一次典型的\
