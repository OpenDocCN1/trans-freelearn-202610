  观察6027帧，其SEQ = 1920，数据载荷大小为46，正从一个主机发送到另一个主机。接下来，在响应帧6070中，一个具有随机SEQ值的畸形数据包被发送作为响应。因此，位于192.168.1.103的主机生成一个重复ACK数据包，并将其发送给另一侧的主机，其SEQ和ACK值与帧6027相似。这一次，在响应中，位于216.58.220.46的主机发送一个有效的ACK帧6115，ACK递增到1966（1920+46），如预期那样，然后通信继续进行。






