  \ 140 | 421 646 | 1 144 | 174 119 | 996 | 247 527 | - | - |\n| 192.168.30.52 | 1\
  \ 466 | 223 536 | 788 | 107 200 | 678 | 116 336 | - | - |\n| 192.168.30.30 | 2 018\
  \ | 320 600 | 1 082 | 162 276 | 936 | 158 324 | - | - |\n| 192.168.10.15 | 349 |\
  \ 56 918 | 192 | 30 936 | 157 | 25 982 | - | - |\n| 192.168.30.159 | 469 | 66 504\
  \ | 245 | 25 833 | 224 | 40 671 | - | - |\n| 192.168.30.25 | 2 496 | 369 426 | 1\
  \ 325 | 184 463 | 1 171 | 184 963 | - | - |\n| 192.168.30.99 | 1 301 | 191 873 |\
  \ 688 | 89 799 | 613 | 102 074 | - | - |\n| 192.168.30.12 | 1 444 | 255 848 | 778\
