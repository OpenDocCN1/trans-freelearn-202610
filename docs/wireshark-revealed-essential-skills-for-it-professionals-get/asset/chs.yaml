  \   关闭\n\n以太网：21   光纤通道   FDDI   IPv4: 191   IPv6: 6   IPX   JXTA   NCP   RSVP \
  \  SCTP   TCP: 7428   令牌环   UDP: 22   USB   WLAN\n\n## 使用“统计”菜单中的 HTTP 工具\n\n在本节中，我们将学习如何使用网络中传输数据的\
  \ HTTP 统计信息。\n\n### 准备工作\n\n启动 Wireshark，单击 **统计**。\n\n### 操作步骤...\n\n要查看 HTTP 统计信息，请执行以下步骤：\n\
  \n从“统计”菜单中选择“HTTP”。将出现以下窗口：\n\n![](img/da40f92928403866599198344271d63e_466_0.png)\n\
  \n在 HTTP 子菜单中，我们有以下选项：\n\n-   数据包计数器（在上一个截图中标记为 1）：它为我们提供发往每个网站的数据包数量。这将帮助我们确定有多少个请求和响应。\n\
  -   请求（在上一个截图中标记为 2）：用于查看对网站的请求分布。\n-   负载分布（在上一个截图中标记为 3）：用于查看网站之间的负载分布。\n\n我们将执行以下步骤来查看数据包计数器统计信息：\n\
  \n1.  导航到“统计”|“HTTP”|“数据包计数器”。\n2.  将打开以下过滤器窗口：\n\n    ![](img/da40f92928403866599198344271d63e_467_0.png)\n\
  \n3.  在此窗口中，你可以配置一个过滤器，以查看针对这些过滤器的统计信息。如果你想查看整个捕获文件的统计信息，请将其留空。这将显示基于 IP 的统计信息，即所有\
  \ HTTP 数据包。\n\n4.  单击“创建统计”按钮，你将看到以下窗口：\n\n    ![](img/da40f92928403866599198344271d63e_467_1.png)\n\
  \n为了查看特定节点的 HTTP 统计信息，你可以使用显示过滤器格式为其配置过滤器。\n\n\n\n\n我们将执行以下步骤来查看 HTTP 请求统计信息：\n\n\
  1. 导航到统计 | HTTP | 请求。将出现以下窗口：\n\n![](img/da40f92928403866599198344271d63e_468_0.png)\n\
  \n2. 选择你需要的过滤器。对于所有数据，请留空。\n\n3. 点击创建统计按钮，将出现以下窗口：\n\n![](img/da40f92928403866599198344271d63e_468_1.png)\n\
  \n4. 要获取特定 HTTP 主机的统计信息，你可以设置过滤器 http.host contains <host_name> 或 http.host==<host_name>（取决于你需要的是具有特定名称的主机名，还是包含特定字符串的主机名），这样你就会看到针对该特定主机的统计信息。\n\
  \n5. 例如，通过配置过滤器 http.host contains ndi-com.com，你将获得网站 www.ndi-com.com 的统计信息（如以下截图所示）：\n\
  \n![](img/da40f92928403866599198344271d63e_469_0.png)\n\n6. 你将得到的是：\n\n![](img/da40f92928403866599198344271d63e_469_1.png)\n\
  \n要查看 Web 或特定网站上的负载分布：\n\n1. 导航到统计 | HTTP | 数据包计数器。\n2. 将出现以下窗口：\n\n![](img/da40f92928403866599198344271d63e_469_2.png)\n\
  \n3. 选择你需要的过滤器。对于所有数据，请将其留空。\n4. 点击**创建统计**按钮，将出现以下窗口：\n\n![](img/da40f92928403866599198344271d63e_470_0.png)\n\
  \n### 工作原理...\n\n当我们打开一个网站时，它通常会向多个 URL 发送请求。在本例中，我们打开的其中一个网站是 [www.cnn.com](http://www.cnn.com)，它带我们跳转到\
  \ [edition.cnn.com](http://edition.cnn.com)，我们向该网站发送了多个请求：向根 URL、向 `breaking_news`\
  \ URL，以及向主页上的另外两个位置。\n\n### 更多内容...\n\n要进行更深入的 HTTP 分析，你可以使用专用工具。其中最常见的是 **Fiddler**。你可以从\
  \ [http://www.fiddler2.com/fiddler2/](http://www.fiddler2.com/fiddler2/) 找到它。\n\n\
  Fiddler 是一款专为 HTTP 故障排查而开发的软件工具，因此它为 HTTP 提供了更多数据，并具有更好的用户界面。\n\n## 配置流图以查看 TCP\
  \ 流\n\n在本节中，我们将学习如何使用流图功能。\n\n### 准备工作\n\n打开 Wireshark，从**统计**菜单中选择**流图**。将打开以下窗口：\n\
  \n![](img/da40f92928403866599198344271d63e_474_0.png)\n\n### 操作步骤...\n\n你可以在**流图**窗口中选择多个选项，例如：\n\
  \n- 查看内容：\n  - 选择**全部数据包**：用于查看所有已捕获的数据包\n  - 选择**已显示的数据包**：用于仅查看筛选后的数据包\n- 流类型：\n\
  \  - 常规流将显示所有已捕获或已显示的数据包（即你之前选择的内容）。\n  - TCP 流将仅显示 TCP 标志、序号和 ACK 编号。该图仅提供流的非常局部的视图。\n\
  \n### 工作原理...\n\n只需根据捕获文件创建简单的统计信息即可：这里没有什么特别的要说明。\n\n### 更多内容...\n\n理解 TCP 问题有时相当复杂。大多数时候，最好的方法是使用具有更好图形界面的图形化软件，或者干脆拿一张纸和不同颜色的笔自己画出来。\n\
  \n一款很好用的软件是 Wireshark 开发人员推出的 **Cascade Pilot** 软件包，可以在 http://www.riverbed.com/us/products/cascade/wireshark_enhancements/cascade_pilot_\
  \ 找到。\n\n你可以在下图中看到一个自己绘制的图表示例：\n\n![](img/da40f92928403866599198344271d63e_477_0.png)\n\
  \n在绘制几张图之后，你就会对它们了如指掌。\n\n## 创建基于 IP 的统计信息\n\n在本节中，我们将学习如何创建一些基于 IP 的统计信息。我们将讨论以下统计工具：\n\
  \n- IP 地址\n- IP 目标\n- IP 协议类型\n\n### 操作步骤...\n\n要获取 IP 地址统计信息，请执行以下步骤：\n\n1. 导航到\
  \ **统计 | IP 地址**。\n2. 在出现的窗口中，点击**过滤器**按钮选择要使用的过滤器：\n3. 如果要查看整个捕获文件的统计信息，请将其留空，系统将显示所有\
  \ IP 数据包的统计信息。\n4. 如果只想查看特定 IP 地址的统计信息，请以显示过滤器语法输入过滤器。例如，过滤器 `ip.addr==10.0.0.2`\
  \ 将仅显示发送到该地址或从该地址发出的 IP 数据包。\n5. 输入过滤器后，你将得到以下统计信息：\n\n![](img/da40f92928403866599198344271d63e_480_0.png)\n\
  \n![](img/da40f92928403866599198344271d63e_480_1.png)\n\n![](img/da40f92928403866599198344271d63e_481_0.png)\n\
  \n要获取 IP 和 TCP/UDP 目标统计信息，请执行以下步骤：\n\n1. 导航到统计 | IP 目标。\n2. 在以下窗口中，选择要使用的过滤器：\n\n\
  ![](img/da40f92928403866599198344271d63e_481_1.png)\n\n3. 此窗口将显示所有已向其目标 IP 发送数据包的\
  \ IP 地址，以及所使用的协议。\n4. 你将得到以下统计信息：\n\n![](img/da40f92928403866599198344271d63e_482_0.png)\n\
  \n5. 在此统计表中，你可以看到主机 **10.0.0.5** 已向端口 **80、443 和 5222** 发送了 TCP 数据包，并向端口 **53**\
  \ 和其他一些端口发送了 UDP 数据包。\n\n这是一个能够暴露可疑问题的工具；例如，当你发现某个可疑端口收到了过多的数据包时，就可以开始查找原因。要获取 IP\
  \ 协议类型：\n\n1. 导航到 **统计 | IP 协议类型**。\n2. 在以下窗口中，选择要使用的过滤器：\n\n![](img/da40f92928403866599198344271d63e_482_1.png)\n\
  \n3. 你将获得运行在 IP 之上的协议统计信息，这些协议主要是 TCP 和 UDP。\n\n| 主题/项目 | 计数 | 速率（毫秒） | 百分比 |\n\
  |---|---:|---:|---:|\n| IP 协议类型 | 61925 | 0.024468 | |\n|   TCP | 60650 | 0.023964\
  \ | 97.94% |\n|   UDP | 1265 | 0.000500 | 2.04% |\n|   无 | 10 | 0.000004 | 0.02%\
  \ |\n\n### 更多内容...\n\nWireshark 中还有多种选项可以提供非常相似的统计信息，包括**会话**、**协议分层**和**端点**，这些都在本章开头讨论过。你可以将它们与本节学到的方法结合使用。\n"
- "## 第 5 章 使用高级统计工具\n\n在本章中，我们将学习以下内容：\n\n- 使用过滤器配置 IO 图，以测量网络性能问题\n- 使用 IO 图测量吞吐量\n\
  - 使用高级 Y 轴参数进行高级 IO 图配置\n- 通过 TCP 流图获取信息 – 时间序列（Stevens）窗口\n- 通过 TCP 流图获取信息 – 时间序列（tcp-trace）窗口\n\
  - 通过 TCP 流图获取信息 – 吞吐量图窗口\n- 通过 TCP 流图获取信息 – 往返时间窗口\n- 通过 TCP 流图获取信息 – 窗口缩放图窗口\n\n\
  ### 简介\n\n在[第 4 章](#)（使用基本统计工具）中，我们讨论了基本统计工具，例如终端用户列表、会话、捕获汇总等。在本章中，我们将了解高级统计工具，例如\
  \ IO 图、TCP 流图，以及简要介绍 UDP 组播流。\n\n我们在这里要讨论的工具能够让我们更好地观察网络。这里有两个主要工具：\n\n- IO 图工具让我们能够查看任意预定义过滤器的统计图；例如，单个\
  \ IP 地址上的吞吐量、两个或多个主机之间的负载、应用吞吐量、TCP 现象分布等等\n- 我们将使用 TCP 流图更深入地查看单个 TCP 连接，从而能够隔离\
  \ TCP 问题及其原因\n\n在本章中，我们将学习如何使用这些工具，在接下来的章节中，我们将使用它们来隔离并解决网络问题。\n\n\n\n\n\n# 使用过滤器配置\
  \ IO 图表以测量网络性能问题\n\n在本教程中，我们将学习如何使用 IO 图表工具以及如何将其配置用于网络故障排除。\n\n# 如何操作...\n\n运行\
  \ IO 图表工具，你将得到以下窗口：\n\n![](img/da40f92928403866599198344271d63e_490_0.png)\n\n在窗口的上部，你会看到突出显示为区域\
  \ 1 的图表。在左下部，突出显示为区域 2 的位置，你会看到可用于配置显示过滤器的过滤器，这些过滤器将启用特定的图表。在窗口右侧，突出显示为区域 3 和 4\
  \ 的位置，你会看到 **X-Axis** 和 **Y-Axis** 配置。让我们看看我们可以配置什么以及如何操作。\n\n## 过滤器配置\n\n1. 在过滤器窗口中，填写符合显示过滤器格式的过滤器。只有通过此过滤器的报文才会被计入此图表。你可以在此配置五个可选过滤器。\n\
  \n2. 选择你想要呈现的图表类型：**Line**、**Impulse**、**FBar** 或 **Dot**。\n\n3. 点击 **Graph** 按钮。这是为了激活过滤器图表而必需的。不要忘记它。\n\
  \n# X-Axis 配置\n\n1. 选择要输入 **Tick interval:** 的值。刻度范围可以在 0.001 秒到 10 分钟之间。\n\n# 提示\n\
  \n例如，如果当 X 轴刻度间隔配置为 1 秒间隔时，我们得到 1,000 packets/second 的峰值，这意味着在过去一秒内我们捕获了 1,000 个报文。当我们将\
  \ X 轴刻度间隔更改为 0.1 秒间隔时，峰值会不同，因为现在我们看到的是在过去 0.1 秒内捕获了多少报文。\n\n2. 选择 **Pixels per tick:**\
  \ 值以配置每个刻度间隔的像素数。\n\n3. 标记 **View as time of day** 按钮以选择时间格式而不是从捕获开始的时间。\n\n# Y-Axis\
  \ 配置\n\n1. 从 **Packets/Tick**、**Bytes/Tick**、**Bits/Tick** 或 **Advanced...** 中选择\
  \ **Unit:** 的值以选择 Y 轴刻度。\n\n2. 为 Y 轴选择 **Scale:**。你可以将其选择为 **Linear** 或更改为 **Logarithmic**。你也可以将其保留为\
  \ **Automatic** 或在需要时更改为手动值。\n\n3. 如果你想看到移动平均值，请选择 **Smooth:** 的值；也就是说，在每个刻度间隔中，你将看到过去刻度的平均值。你可以选择\
  \ 4 到 1,024 之间的值来平滑图表。\n\n![](img/da40f92928403866599198344271d63e_493_0.png)\n\n\
  在第二个图表中，我们看到以 bits/sec 为单位的流量。这里，我们看到在使用网络连接到互联网时网络所需的带宽；也就是说，当大部分流量在下载方向时，非对称带宽。\n\
  \n# 还有更多...\n\n让我们再看一个例子。这里是一个 FTP 文件下载的例子，当 10.0.52.164 下载文件时。同样，你可以看到为了在网络上获取流量，我们将\
  \ Y 轴下的 Unit: 更改为 Bits/Tick。Packets/Tick 也很重要，我们将在本书后面的应用章节（第 7-14 章）中看到其实现。\n\n\
  ![](img/da40f92928403866599198344271d63e_494_0.png)\n\n# 使用 IO Graph 进行吞吐量测量\n\n\
  IO Graph 是测量网络吞吐量的便捷工具。使用它，我们可以测量任何预定义过滤器的流量和吞吐量。在本教程中，我们将看到一些测量网络吞吐量的示例。\n\n# 准备工作\n\
  \n将你的笔记本电脑通过 Wireshark 连接到一个网络，该网络将端口镜像到你想要测量的链路，如你在第 1 章《介绍 Wireshark》中所学。启动新的捕获或打开现有文件，并从\
  \ **Statistics** 菜单打开 **IO Graphs** 工具。\n\n在测量吞吐量时，我们可以测量端设备之间通信链路上的吞吐量（PC 到服务器、手机到手机、PC\
  \ 到互联网等）或特定应用程序的吞吐量。\n\n![](img/da40f92928403866599198344271d63e_496_0.png)\n\n\
  隔离网络问题的过程始于在端设备之间的链路上测量单连接的流量并查看其来源。\n\n一些典型的测量包括主机到主机的流量、到特定服务器的所有流量、到特定服务器上特定应用程序的所有流量、特定服务器上的所有\
  \ TCP 性能现象等等。\n\n# 如何操作...\n\n在本教程中，我们将提供一些用于测量网络流量的基本过滤器。\n\n## 测量端设备之间的吞吐量\n\n\
  要测量端设备之间的吞吐量，只需在它们的 IP 地址之间配置一个显示过滤器。\n\n例如，要查看 10.2.10.101 和 10.2.10.240 之间的流量，配置过滤器：\n\
  \n```\nip.addr eq 10.2.10.240 and ip.addr eq 10.2.10.240.\n```\n\n你可以在 IO Graph\
  \ 的 Filter: 框中输入过滤器，也可以通过以下步骤操作：\n\n- 1. 将光标放在特定连接中的一个报文上。\n- 2. 右键单击它并导航到 Conversation\
  \ filter | IP。过滤器字符串将出现在上方的显示过滤器框中。\n- 3. 将过滤器字符串从上方的显示过滤器框复制到其中一个 IO Graph Filter:\
  \ 框中。\n- 4. 点击 IO Graphs 窗口中的过滤器图表按钮以激活它。\n\n![](img/da40f92928403866599198344271d63e_498_0.png)\n\
  \n## 测量应用程序吞吐量\n\n为了配置特定应用程序的性能测量，你可以配置一个包含特定端口号或特定连接的过滤器。\n\n有几种方法可以隔离应用程序图表。以下是一种方法：\n\
  \n- 1. 在捕获的数据中，单击属于流量流的任意一个报文。在 TCP 中它将是一个特定连接；在 UDP 中它将只是两个 IP/Port 对之间的流。\n- 2.\
  \ 右键单击它并选择 **Follow TCP stream** 或 **Follow UDP stream**。你将得到 `tcp.streameq<number>`\
  \ 或 `udp.streameq<number>`。`<number>` 只是捕获文件中的流编号。\n- 3. 将字符串复制到 **IO Graphs** 窗口中的过滤器窗口，你将得到特定流的图表。\n\
  \n![](img/da40f92928403866599198344271d63e_499_0.png)\n\n如果你想要流中特定数据的图表，请向过滤器添加信息。例如（在前面的插图中）：\n\
  \n- `tcp.streameq 2 and tcp.analysis.retransmissions` 将给出特定流上的所有 TCP 重传（例如指示网络缓慢、错误或丢包）\n\
  - `tcp.streameq 2 and tcp.analysis.zero_window` 将给出特定流上的所有 TCP 零窗口现象（指示终端设备缓慢）\n\
  \n# 其工作原理...\n\nIO Graph 工具的强大之处在于你可以配置任何显示过滤器并以各种形状和配置将其显示为图表。报文中的任何参数都可以以这种方式进行过滤和监控。\n\
  \n# 还有更多...\n\n本节解释了一些可以监控的参数示例。\n\n## 图表 SMS 使用情况 – 查找特定订户发送的短信\n\n- 1. 要配置过滤器，请选择使用命令\
  \ `Submit_SM` 的 **SMPP (Short Message Peer to Peer protocol)** 报文。这是发送 SMS 的 SMPP\
  \ 命令。\n- 2. 在过滤器中输入 `smpp.destination_addr == \"phone number\"`。在示例中配置了过滤器 `smpp.destination_addr\
  \ == \"972527098241\"`。\n\n## 图表访问 Google 网页的次数\n\n- 1. 打开 **IO Graphs** 窗口。你可以在捕获期间打开以查看在线统计信息，或打开已保存的捕获文件。\n\
  - 2. 配置过滤器 `http.host contains \"<name>\"`，在我们的例子中为 `http.host contains \"google\"\
  `。\n- 3. 在报文列表中，你将看到（在配置相同过滤器时）以下屏幕截图中显示的信息：\n\n![](img/da40f92928403866599198344271d63e_501_0.png)\n\
  \n- 4. 在 **IO Graphs** 窗口中，你将看到以下图表：\n\n\n\n## 使用高级 Y 轴参数配置高级 IO 图形\n\n在使用 IO 图形工具进行标准测量时，我们以数据包/秒、字节/秒或位/秒为单位来衡量网络性能。有些类型的数据无法通过这些参数进行测量，这就是我们在\
  \ **Y 轴** 选项中提供 **高级...** 功能的原因。\n\n### 准备工作\n\n从 **Y 轴** 下的 **单位：** 下拉菜单中选择 **高级...**\
  \ 功能，会打开一个更宽的 IO 图形窗口，并提供以下选项：\n\n- **SUM (*)**：根据刻度间隔内参数的汇总值绘制图形。\n- **COUNT FRAMES\
  \ (*)**：统计刻度间隔内过滤帧出现的次数并绘制图形。\n- **COUNT FIELDS (*)**：统计刻度间隔内过滤字段出现的次数并绘制图形。\n-\
  \ **MAX (*)**：根据刻度间隔内参数的最大值绘制图形。\n- **MIN (*)**：根据刻度间隔内参数的最小值绘制图形。\n- **AVG (*)**：根据刻度间隔内参数的平均值绘制图形。\n\
  - **LOAD (*)**：用于响应时间图形。\n\n### 操作步骤...\n\n要开始使用带有 **高级** 功能的 **IO 图形** 窗口，请执行以下步骤：\n\
  \n1. 从 **统计** 菜单启动 **IO 图形** 窗口。\n2. 在 **Y 轴** 下的 **单位：** 下拉菜单中，选择 **高级...** 选项。您将看到以下窗口：\n\
  \n![](img/da40f92928403866599198344271d63e_505_0.png)\n\n3. 您将看到带有 **SUM(*)** 字符串的新下拉菜单。\n\
  4. 选择 **SUM(*)/COUNT FRAMES (*)/COUNT FIELDS (*)/MAX(*)/MIN(*)/AVG(*)/LOAD(*)**，并配置相应的过滤器。在接下来的操作步骤中，我们将看到一些有用的示例。\n\
  \n### 如何监控帧间时间增量统计\n\n帧之间的时间增量会影响 TCP 性能，在某些情况下，我们希望将这些时间增量与从网络获得的性能关联起来。\n\n让我们看看以下捕获文件：\n\
  \n![](img/da40f92928403866599198344271d63e_507_0.png)\n\n我们在屏幕截图中看到的是帧间时间增量的最小值、平均值和最大值的图形。我们该如何处理它，以及如何使用它进行网络调试？这将在[第10章]\
  \ HTTP 和 DNS 中介绍。\n\n### 如何监控流中的 TCP 重传次数\n\nTCP 事件可以有很多类型：重传、滑动窗口事件、ACK（或缺少 ACK）以及其他事件。要查看\
  \ TCP 事件随时间变化的数量，我们可以使用带有 **高级...** 功能和 **COUNT(*)** 参数的 IO 图形工具。\n\n为此，请执行以下步骤：\n\
  \n1. 从 **统计** 菜单打开 **IO 图形**。\n2. 在 **Y 轴** 下，为 “单位：” 选择 **高级...**。\n3. 按如下方式配置过滤器：\n\
  \    - 在 **过滤器：** 按钮旁边的字段中配置 IP 源地址和目标地址过滤器\n    - 在 **样式：** 左侧的字段中配置 TCP 事件\n \
  \   - 在 “计算：” 字段中选择 **COUNT FRAMES (*)**，并在过滤器字段中输入 `tcp.analysis.retransmissions`\n\
  \n在此示例中，过滤器被配置为监控三个不同 TCP 流上的 TCP 重传。\n\n![](img/da40f92928403866599198344271d63e_508_0.png)\n\
  \n在上一个屏幕截图的图形中，您可以看到每个 TCP 流的重传以不同颜色呈现。\n\n### 如何监控字段出现次数\n\n在各种网络协议（主要是基于 TCP 运行的协议）中，帧间时间变化（即帧时间增量过滤器）会显著影响性能。IO\
  \ 图形窗口中用于查看这些变化的工具之一是 “高级...” 配置。\n\n为此，请执行以下步骤：\n\n1. 右键单击可疑 TCP 流中的数据包，然后导航到 “会话过滤器\
  \ | TCP”。主过滤器框中将出现一个过滤器。\n2. 从 **统计** 菜单打开 **IO 图形**。\n3. 在 Y 轴下，为 “单位：” 选择 “高级...”。\n\
  4. 按如下方式配置过滤器：\n    - 将过滤器定义从右侧上方的过滤器框复制到左侧的 IO 图形过滤器框\n    - 在左侧输入过滤器 frame.time_delta\n\
  \    - 选择 AVG(*) 以查看平均增量\n5. 选择适当的 X 轴分辨率。\n\n这里有一个示例。在以下屏幕截图中，我们看到一个包含时间的数据包列表：\n\
  \n![](img/da40f92928403866599198344271d63e_510_0.png)\n\n如您所见，帧之间存在时间变化。在本书的后面，我们将了解是什么导致这些问题以及如何解决它们。\n\
  \n### 工作原理...\n\nIO 图形工具是 Wireshark 中最强大、最高效的工具之一。标准的 IO 图形统计可用于基本统计，而 **高级...**\
  \ 功能可用于深入监控响应时间、对单个流或多个流进行 TCP 分析等。\n\n当我们在左侧配置过滤器时，我们将过滤主机之间的流量、连接中的流量、服务器上的流量等。**高级...**\
  \ 功能为我们提供有关流量的更多详细信息。以下是一些示例：\n\n- 左侧可以看到 TCP 流；右侧可以看到该流中帧之间的时间增量\n- 左侧可以看到视频/RTP\
  \ 流；右侧可以看到标记位的出现\n\n### 更多内容...\n\n您可以随时单击 **IO 图形**，它将带您到数据包面板中的参考数据包。\n\n## 通过\
  \ TCP 流图获取信息 – 时间序列（Stevens）窗口\n\nWireshark 中能够让我们更深入地了解应用程序行为的工具之一是 TCP 流图。正如我们将在接下来的操作步骤中看到的，这些图形使我们能够了解应用程序行为，并有可能定位其中的问题。\n\
  \n### 准备工作\n\n打开现有的捕获文件或开始新的捕获。单击捕获文件中的特定数据包。尽管您可以在正在进行的捕获中使用此功能，但它并非用于在线统计；因此建议您先启动捕获，然后停止捕获，再使用此工具。\n\
  \n该图形实际上显示了字节传输随时间的推进过程。在此示例中，我们看到一条连续的斜线，这表明文件传输状况良好。\n\n要测量文件传输的吞吐量，只需计算单位时间内传输的字节数，如下面的屏幕截图所示：\n\
  \n![](img/da40f92928403866599198344271d63e_516_0.png)\n\n我们可以看到传输速率为 100 秒内传输 1,200,000\
  \ 字节，即 12,000 字节/秒或 95 千位/秒。\n\n3. 使用滚动条单击图形上的某个点，将放大该点周围的图形。\n4. 右键单击图形上的某个点，将把我们带到捕获文件中的数据包面板。\n\
  5. 要更改图形参数，我们会有一个与图形并行打开的小窗口，如下面的屏幕截图所示：\n\n![](img/da40f92928403866599198344271d63e_517_0.png)\n\
  \n6. 要从放大切换到缩小，请单击 **in** 或 **out** 按钮。\n\n### 工作原理...\n\n时间序列图（Stevens）是一种简单的图形，用于统计随时间变化的\
  \ TCP 序列号。由于 TCP 序列号统计的是 TCP 发送的字节数，因此这些字节实际上是从一端发送到另一端的应用程序字节（包括应用程序标头）。\n\n该图形（正如我们将在\
  \ TCP 和应用程序章节中学到的）可以很好地指示应用程序的行为。例如，一条斜线表示文件传输良好，而有中断的斜线则表示传输存在问题。斜率较高的斜线表示数据传输速度快，而斜率较低的斜线表示传输速率低（当然取决于刻度）。\n\
  \n\n\n\n## 更多内容...\n\n在图表中左键单击某个点，将跳转到数据包列表窗格中的对应数据包。当你发现问题时，放大该点，左键单击它，并检查数据包出了什么问题。\n\
  \n查看图表时，了解正在运行的应用程序类型非常重要。某个应用程序图表中显示为问题的情况，对于另一个应用程序来说可能正是正常的网络行为。\n\n## 通过 TCP\
  \ 流图获取信息——时间序列（tcp-trace）窗口\n\n基于 UNIX `tcpdump` 命令的 TCP 时间序列图为我们提供了所监控连接的补充数据。除了\
  \ Time-Sequence (Stevens) 中标准的序列/秒外，我们还能获得已发送的 ACK、重传、窗口大小等信息，以及更多能够帮助我们分析连接问题的细节。\n\
  \n## 准备工作\n\n打开现有的捕获文件，或开始新的捕获。在捕获文件中单击某个特定数据包。尽管你也可以在实时捕获中使用此功能，但它并非为实时统计而设计；因此建议你完成一次捕获并停止后，再使用此工具。\n\
  \n## 操作步骤...\n\n要查看 TCP 流图统计信息，请执行以下步骤：\n\n- 1. 单击要监控的流中的一个数据包。\n\n### 提示\n\nTCP\
  \ 流图是一个方向性图表，因此当你单击数据包时，该数据包应位于你想要查看统计信息的方向。例如，如果你下载一个文件并想查看下载统计信息，请单击下载方向上的数据包。\n\
  \n- 2. 从统计菜单导航到 TCP 流图 | 时间序列图（tcp-trace）。将打开以下窗口：\n\n![](img/da40f92928403866599198344271d63e_522_0.png)\n\
  \n该图表下方黑色曲线表示字节传输随时间的变化，上方灰色曲线表示窗口大小。当两条曲线之间有间隙时，说明还有一定的 TCP 缓冲空间，TCP 将继续传输字节。一旦它们彼此接近并接触，就会形成窗口已满现象，从而无法继续传输数据。\n\
  \n3. 当我们放大到特定区域时，会得到以下截图：\n\n![](img/da40f92928403866599198344271d63e_523_0.png)\n\
  \n4. 当我们放大到图中的特定区域时，会得到以下捕获的数据包：\n\n![](img/da40f92928403866599198344271d63e_523_1.png)\n\
  \n你可以看到，在捕获的数据包中，时间 1,273（捕获开始后的秒数）处有一帧，然后中断，时间 1,386 处有一个数据包，中断后，1499 处又有一个数据包。\n\
  \n在 TCP 流图中，你可以看到传输中的中断，当我们返回数据包列表窗格时，可以查找其中断的原因。\n\n## 工作原理...\n\n**时间序列**（TCP-trace）图源自\
  \ UNIX 的 `tcpdump` 命令，该命令还会检查接收方发布的窗口大小（即接收方为进程分配的缓冲区大小），以及重传的数据包和 ACK。\n\n使用该图表可以为我们提供大量信息，稍后我们将用这些信息进行网络调试。从窗口被填充的速度快于预期，到大量重传等现象，都会通过该图表可视化地展现出来，帮助我们解决这些问题。\n\
  \n## 更多内容...\n\n我们放大得越多，看到的细节就越多，如下面的截图所示：\n\n![](img/da40f92928403866599198344271d63e_526_0.png)\n\
  \n一个条形表示一个承载数据的包，其序列号范围在初始序列号和最终序列号之间。偏离常规图形、看起来像是“逃离”的条形表示重传，灰色条形表示重复 ACK。我们将在第\
  \ 9 章（UDP/TCP 分析）中了解这些现象。\n\n## 通过 TCP 流图获取信息——吞吐量图窗口\n\nTCP 流图中的**吞吐量图**窗口使我们能够查看连接的吞吐量并检查其不稳定性。\n\
  \n## 准备工作\n\n打开现有的捕获文件，或开始新的捕获。在捕获文件中单击某个特定数据包。尽管你也可以在实时捕获中使用此功能，但它并非为实时统计而设计；因此建议你完成一次捕获并停止后，再使用此工具。\n\
  \n## 操作步骤...\n\n要查看 TCP 流图统计信息，请执行以下步骤：\n\n- 1. 单击要监控的流中的一个数据包。\n- 2. 从统计菜单导航到 TCP\
  \ 流图 | 吞吐量图。\n\n将打开以下窗口：\n\n![](img/da40f92928403866599198344271d63e_529_0.png)\n\
  \n在图表中，我们看到吞吐量并不稳定，在大约 20,000 字节/秒到 1000 字节/秒之间波动。这可能是因为文件传输不稳定（本例是在 HSUPA 蜂窝连接上进行\
  \ FTP 下载时的情况），也可能只是因为应用程序本身就是这样的工作方式（例如浏览互联网）。\n\n## 工作原理...\n\n吞吐量图只是计算 TCP 序列号随时间的变化，由于序列号实际上是应用程序的数据，因此这给出了应用程序的吞吐量（以字节/秒为单位）。\n\
  \n## 更多内容...\n\n稳定的文件传输应该看起来几乎是一条实线，如下图所示：\n\n![](img/da40f92928403866599198344271d63e_531_0.png)\n\
  \n这里，MB 是兆字节，Mb 是兆比特。\n\n## 准备工作\n\n打开现有的捕获文件，或开始新的捕获。在捕获文件中单击某个特定数据包。尽管你也可以在实时捕获中使用此功能，但它并非为实时统计而设计；因此建议你完成一次捕获并停止后，再使用此工具。\n\
  \n## 工作原理...\n\n我们在图中看到的是 TCP 序列号与确认这些序列号所需时间的对应关系。实际上，这是从发送数据包到收到该数据包的 ACK 之间的时间。\n\
  \n## 更多内容...\n\n当你看到显示不稳定的图表时，这并不一定表示有问题。这也可能只是应用程序的工作方式。你会看到某个数据包花费了很长时间才被确认，这可能是因为存在问题，也可能是因为服务器正在等待响应，或者客户端正在浏览\
  \ Web 服务器，而用户在两次点击新链接之间等待。\n\n## 通过 TCP 流图获取信息——窗口缩放图窗口\n\nTCP 流图中的窗口缩放图使我们能够查看接收方发布的窗口大小，这是接收方处理数据能力的一个指标。结合其他图表，它让我们能够直观了解连接的性能。\n\
  \n## 操作步骤...\n\n要查看 TCP 流图统计信息，请执行以下步骤：\n\n- 1. 单击要监控的流中的一个数据包。\n- 2. 从**统计**菜单导航到**TCP\
  \ 流图 | 窗口缩放图**。将打开以下窗口：\n\n![](img/da40f92928403866599198344271d63e_539_0.png)\n\
  \n在此图中，我们可以看到由其中一端引起的不稳定性。这可能表示服务器或客户端处理速度较慢，无法处理其接收到的所有数据，因此它通过减小接收窗口大小来通知对端减少发送数据。\n\
  \n## 工作原理...\n\n这里的软件只是监视连接上的窗口大小并绘制它。在[第 9 章](#)（UDP/TCP 分析）中，我们将深入探讨其中的细节。\n\n\
  ### 更多内容...\n\n当窗口大小减小时，应用程序吞吐量也应随之下降。  \n窗口大小完全由连接的两端控制，例如客户端和服务器；窗口大小的变化与网络性能无关。\n"
- "## 第 6 章：使用专家信息窗口\n\n在本章中，我们将讨论以下内容：\n\n- **专家信息**窗口及其在网络故障排查中的使用方法\n- 错误事件及其理解\n\
  - 警告事件及其理解\n- 备注事件及其理解\n\n\n\n\n## Introduction\n\nWireshark 最强大的功能之一是能够分析网络现象并为其提供可能的原因。\
  \ 除了其他工具之外，它还能为我们提供有关网络性能和问题的详细信息。 在本章中，我们将学习专家系统。 它是一个工具，可为我们提供对网络现象（包括事件和问题）的更深入分析。\
  \ 在本书后面，我们将提供有关如何使用 **Expert Infos** 窗口以及其他工具来查找和解决网络问题的详细配方。\n\n在第一个配方中，我们将学习如何使用\
  \ **Expert Infos** 窗口。 在接下来的配方中，我们将了解您可能遇到的大多数事件的可能原因。\n\n## The Expert Infos window\
  \ and how to use it for network troubleshooting\n\n**Expert Infos** 窗口为我们提供了 Wireshark\
  \ 发现的事件和网络问题的列表。 在本配方中，我们将学习如何启动 **Expert Infos** 窗口以及如何引用各种事件。\n\n### Getting ready\n\
  \n启动 Wireshark，并开始实时捕获或打开现有文件。\n\n### How to do it...\n\n要启动 **Expert Infos** 窗口，请执行以下步骤：\n\
  \n导航到 **Analyze** 菜单并单击 **Expert Info**。 以下窗口将打开：\n\n![](img/da40f92928403866599198344271d63e_546_0.png)\n\
  \n现在您可以选择任意一个上部栏： **Errors:**、 **Warnings:**、 **Notes:**、 **Chats:**、 **Details:**\
  \ 或 **Packet Comments:**。\n\n### Tip\n\n栏右侧的数字显示此类别中的事件数量。\n\n上部栏为您提供以下信息：\n\n-\
  \ **Errors:** 这些是严重问题，主要是畸形数据包或协议头中缺少字段。 这些可以是各种类型的畸形数据包，例如畸形 SPOOLSS、GTP 或其他。 这些也可以是校验和错误，例如\
  \ IPv4 校验和错误。\n\n  在以下屏幕截图中，您可以看到畸形的 TCP 和 SSL 数据包：\n\n  ![](img/da40f92928403866599198344271d63e_547_0.png)\n\
  \n  在以下屏幕截图中，您可以看到另一种类型的错误，即协议（在本例中为 **BOOTP/DHCP**）选项错误，即 Wireshark 识别出数据包中缺少字段时：\n\
  \n  ![](img/da40f92928403866599198344271d63e_547_1.png)\n\n- **Warnings:** 警告表示应用程序或通信中的问题，例如\
  \ TCP 零窗口、TCP 窗口已满、先前段未捕获、乱序段等，这些都是协议行为不自然的情况。 您可以在以下屏幕截图中看到一个示例：\n\n  ![](img/da40f92928403866599198344271d63e_548_0.png)\n\
  \n- **Notes:** 当 Wireshark 指示可能导致问题但仍在协议正常行为范围内的事件时，就会显示注释。 例如，TCP 重传将显示在这里，因为尽管它是一个会减慢网络速度的严重问题，但它仍属于\
  \ TCP 的正常行为。 此处的其他事件有重复 ACK、快速重传等。\n\n- **Chats:** 此选项卡提供有关常规工作流程的信息，例如 TCP 连接开始（SYN）、连接结束（FIN）、连接重置（RST）、HTTP\
  \ POST、HTTP 代码等。\n\n- **Details:** 此选项卡按有序列表提供所有事件。 在旧版本的 Wireshark 中，这直接位于 **Analyze**\
  \ 菜单下。\n\n- **Packet Comments:** 您可以手动为每个数据包添加注释。 此列将显示捕获文件中的所有注释。\n\n要为数据包添加注释，请右键单击它并选择\
  \ **Packet Comment…**。 将打开一个窗口，您可以在其中添加或更改注释。 您可以在以下屏幕截图中看到这一点：\n\n![](img/da40f92928403866599198344271d63e_549_0.png)\n\
  \n要转到数据包捕获窗格中的事件，只需单击 Expert Infos 窗口中事件下的该数据包即可，它会带您前往该位置。\n\n### Note\n\n需要注意的是，虽然警告事件可能无关紧要，但注释事件可能会严重影响网络。\
  \ 始终深入了解问题细节，查看其来源以及其含义。\n\n### There's more...\n\n专家信息严重性也可以通过显示过滤器进行过滤并在数据包窗格中显示。\
  \ 要根据显示过滤器查看事件，请执行以下步骤：\n\n1. 单击显示过滤器窗口右侧的 **Expression...**。\n2. 向下滚动以获取 **Expert**\
  \ 消息（您只需输入单词 `expert` 即可到达）。\n\n如以下屏幕截图所示，您将获得以下过滤器：\n\n```\nexpert.message, expert.group,\
  \ and expert.severity:\n```\n\n![](img/da40f92928403866599198344271d63e_551_0.png)\n\
  \n- `expert.group` 指专家消息组。 此过滤器根据其类型对问题进行分类，例如校验和问题、TCP 序列相关问题等。 请看以下屏幕截图，您将看到这些问题的列表：\n\
  \n  expert.group 中的主要类别如下：\n\n  - **Checksum**: 表示校验和无效。\n  - **Sequence**: 表示 TCP\
  \ 序列相关问题。\n  - **Response**: 表示应用程序响应代码问题（4xx 响应代码）。\n  - **Request**: 表示应用程序请求。\n\
  \  - **Undecoded**: 表示解剖器无法解码的数据。\n  - **Reassemble**: 表示在重新组装时出现问题（通常是片段丢失时）。\n\
  \  - **Malformed**: 表示畸形数据包或解剖器问题，并且该数据包的解剖被中止。\n  - **Debug**: 表示调试（不应出现在发布版本中）。\n\
  \  - **Protocol**: 表示违反协议规范（例如缺少字段、长度错误等），该数据包的解剖可能仍会继续。\n  - **Comment**: 表示已为其添加注释的数据包（可以通过右键单击数据包并选择\
  \ Packet Comment … 选项来添加注释）。\n\n- `expert.message` 指特定的消息。 在这里，例如，您可以配置一个过滤器来显示包含或匹配特定字符串的消息。\n\
  - `expert.severity` 指具有特定严重性的消息，即错误、警告、注释等。\n\n您还可以选择在 **Expert Info** 窗口上显示事件严重性。\n\
  \n1. 导航到 **Edit | Preferences…**。\n2. 选择 **User Interface**。\n3. 在右窗格的下半部分，标记 **Display\
  \ LEDs in the Expert Infos dialog tab labels:** 复选框，如以下屏幕截图所示：\n\n   ![](img/da40f92928403866599198344271d63e_553_0.png)\n\
  \n4. 单击 **OK**。\n5. 打开 **Expert Infos** 窗口，严重性 LED 将出现在每个栏上。\n\n![](img/da40f92928403866599198344271d63e_553_1.png)\n\
  \n严重性级别 LED 也将出现在 Wireshark 主窗口的左下角。\n\n## Error events and understanding them\n\
  \n在本配方中，我们将深入了解错误和事件类型、校验和错误、畸形数据包和其他类型的错误，以及我们可以从中了解的内容。\n\n### How to do it...\n\
  \n1. 从 **Analyze** 菜单打开 **Expert Infos**，单击 **Expert Info**。\n2. 单击 **Errors:**\
  \ 栏（应默认打开）。 您将获得以下窗口（所有事件均为示例）：\n\n   ![](img/da40f92928403866599198344271d63e_558_0.png)\n\
  \n在前面的窗口中，您可以看到以下两种类型的错误：\n\n- **Checksum errors:** 这些可能出现在以太网、IP 或其他协议中。 在这种情况下，这可能是由于真实错误或卸载造成的。\n\
  - **Malformed packets:** 这些通常出现在应用程序协议中。 在这种情况下，也可能是由于真实问题或解剖器错误造成的。\n\n\n\n\n\n\
  ### There's more...\n\n格式错误的包可能是 Wireshark 的错误，也可能是真正的格式错误包。使用其他工具来隔离问题。怀疑的错误可以在\
  \ Wireshark 网站上报告。\n\n> **提示：** 当你看到大量格式错误的包或校验和错误时，这很可能是由于卸载或解码器错误造成的。错误率超过 1-2%\
  \ 的网络会出现许多其他事件（例如重传），并且会比预期慢得多，因此，功能正常的网络不可能有很高的错误率！\n\n### See also\n\n- [第 9 章](Chapter\
  \ 9)，UDP/TCP 分析\n\n## Warning events and understanding them\n\n如前所述，警告事件表示应用程序或通信中存在问题。在本配方中，我们将描述此类事件中的主要事件。\n\
  \n### Getting ready\n\n开始捕获或打开现有文件，并启动 **Expert Infos** 窗口。\n\n### How it works...\n\
  \nWireshark 监控被监控数据包的参数如下：\n\n- 它监控 TCP 窗口大小并检查窗口大小是否减少到零\n- 它查找乱序的 TCP 数据包（段），即它们是在预期时间之前或之后发送的\n\
  - 它查找未发送的 TCP 数据包的 ACK\n\n这些参数以及许多其他参数为你提供了一个良好的起点来查找网络问题。我们将在 [第 9 章](Chapter 9)，UDP/TCP\
  \ 分析中详细介绍。\n\n### There's more...\n\n不要忘记警告事件是 Wireshark 认为重要的事件，但不一定如此。例如，如果你有未捕获的先前段，它们将显示在警告中，但这可能是由于捕获问题造成的。\n\
  \n### See also\n\n- [第 9 章](Chapter 9)，UDP/TCP 分析\n\n## Notes events and understanding\
  \ them\n\n如前所述，当 Wireshark 指出某个事件可能导致问题但仍在协议的正常行为范围内时，它将显示在 **Notes** 栏下。例如，TCP\
  \ 重传将显示在 **Notes** 栏下，因为尽管它是减慢网络的关键问题，但它仍属于 TCP 的正常行为。\n\n### Getting ready\n\n\
  开始捕获或打开现有文件并启动 **Expert Infos** 窗口。\n\n### How it works...\n\nWireshark 监控被监控数据包的参数。它监控\
  \ TCP 序列号和确认号，同时检查重传和其他排序问题。它查找来自远程网络的 IP **生存时间 (TTL)** 值为 1 的情况，并告诉你这是一个问题。它查找可能处于正常状态但也可能指示问题的保活。\n\
  \n这些参数以及许多其他参数为你提供了一个良好的起点来查找网络性能问题。\n\n### See also\n\n- 你可以在 [第 9 章](Chapter 9)，UDP/TCP\
  \ 分析 中阅读更多关于 TCP 性能问题的内容。它包括 TCP 重传、快速重传以及它们发生的原因、ACK 和重复 ACK 是什么、零窗口、窗口更改和其他 TCP\
  \ 滑动窗口问题等。\n"
- "## Chapter 7. Ethernet, LAN Switching, and Wireless LAN\n\n在本章中我们将涵盖以下主题：\n\n-\
  \ 发现广播风暴和错误风暴\n- 分析生成树协议\n- 分析 VLAN 和 VLAN 标记问题\n- 分析无线（Wi-Fi）问题\n\n## Introduction\n\
  \n在本章中，我们将重点介绍如何查找和解决基于第 2 层的网络问题，重点关注以太网相关问题，例如广播事件和错误以及如何找出它们的来源。我们还将重点关注 LAN\
  \ 协议，例如生成树、VLAN 和无线局域网。\n\n这些问题必须在我们进入第 3 层、第 4 层和应用层之前解决，因为第 2 层问题会反映在上层协议中。例如，第\
  \ 2 层的丢包会导致 TCP 重传，而 TCP 是第 4 层协议，这可能导致上层应用响应时间变慢。\n\n## Discovering broadcast and\
  \ error storms\n\n通信网络中最棘手的问题之一是 **广播** 和 **错误风暴**。这些问题可能是由于第 2 层环路、第 2 层攻击、有问题的网络适配器或向网络发送数据包的服务造成的。\n\
  \n在本章中，我们将提供一些基本配方，说明如何查找、隔离和解决这些类型的问题。\n\n> **提示：** 广播风暴是指每秒获得数千甚至数万次广播。在大多数情况下，这将完全锁定网络。\n\
  \n### Getting ready\n\n在这种类型的问题中，你通常会被要求解决网络非常慢或网络已停止工作的问题。\n\n需要记住的几个重要事实是：\n\n\
  - 广播不会被路由器转发。\n- 广播不会在 VLAN 之间转发（这就是 VLAN 被称为 **广播域** 的原因），因此每个 VLAN 都是一个单一的广播域。\n\
  - 错误数据包不会被局域网交换机转发（至少不是通过好的交换机）。\n- 多播会通过交换机转发，除非另有配置。\n- 多播仅在路由器配置为这样做时才会被路由器转发。\n\
  - 每个网络中都会传输合理数量的广播。这是网络的工作方式。过多的广播可能是个问题。\n\n> **提示：** 过多的广播和广播风暴之间存在区别。过多的广播（例如每秒几百个）会占用网络，但在大多数情况下，用户不会注意到。广播风暴会完全锁定网络。\n\
  \n### How to do it...\n\n要找出问题来源，请按以下步骤操作：\n\n1. 由于“网络缓慢”是用户感知的問題，请先提出以下问题：\n  \
  \ - 这个问题在总部吗？\n   - 在单个分支机构？\n   - 整个网络还是特定 VLAN？\n\n当然不要问用户关于 VLAN 的问题；用户不是网络专家。询问他们所在组、所在部门运行的应用程序等。\n\
  \n> **提示：** 在组织网络中，VLAN 通常按部门（或多个部门）和地理区域（或多个区域）甚至按组织功能配置；例如，HR VLAN、财务 VLAN、特定软件用户的\
  \ VLAN 等。通过询问问题是否按其中一个特征出现，你将能够缩小需要查找问题范围。\n\n2. 下一个问题应该是显而易见的：“网络是否仍在工作？” 在广播风暴中，网络会变得非常慢；在大多数情况下，应用程序会停止运行。在这种情况下，你有以下典型问题：\n\
  \   - 生成树问题\n   - 生成广播的设备\n   - 路由环路（将在第 8 章 ARP 和 IP 分析 中讨论）\n\n> **提示：** 我总是被问到的问题是：“多少广播算太多？”\
  \ 嗯，当然对此有几个答案。这取决于网络设备正在做什么以及在它们上运行的协议。\n\n合理数量的广播应为每台设备每分钟 1 到 2 个到 4 到 5 个。例如，如果你的网络由单个\
  \ VLAN 上的 100 台设备组成，你应该期望不超过每秒 5-10 次广播（5 次广播 x 100 台设备等于每分钟 500 次广播，即大约每秒 9-10\
  \ 次）。超过这个数量也是合理的，只要它们不是成千上万地到来，并且你知道它们是什么。\n\n### Spanning Tree Problems\n\n在生成树问题中，你会每秒获得数千甚至数万次广播（请参阅本配方中\
  \ How it works... 部分以了解原因）。在这种情况下，你的 Wireshark，甚至你的笔记本电脑都会冻结。关闭 Wireshark，断开电缆以隔离问题，并检查交换机中的\
  \ STP 配置。\n\n### A device that generates Broadcasts\n\n由特定设备生成的典型广播风暴具有以下特征：\n\n\
  - 每秒大量广播（数千个以上）\n- 在大多数情况下，广播来自单个源；但在攻击情况下，它们可能来自多个源\n- 通常以恒定的包/秒速率，即帧之间的间隔几乎相等\n\
  \n我们可以看到如何根据前述列表中提到的参数找到广播风暴，在接下来的三个屏幕截图中。\n\n在下面的屏幕截图中，我们看到大量广播数据包从源 MAC（HP 网络适配器）发送到\
  \ ff:ff:ff:ff:ff:ff。\n\n\n\n\n\n![](img/da40f92928403866599198344271d63e_580_0.png)\n\
  \n在前面的屏幕截图中我们看到时间列配置为自上一个显示数据包以来的秒数。您可以通过导航到 **View | Time Display Format** 来配置它。\n\
  \n下面的屏幕截图显示了 IO Graph 上的流量；我们看到每秒的总数据包数为 5,000：\n\n![](img/da40f92928403866599198344271d63e_582_0.png)\n\
  \n在前一种情况下，问题是一个名为 SMB Mailslot Protocol 的服务。通过简单的试错找到该服务是什么，并在导致问题的站点上禁用它就解决了问题。\n\
  \n> **Tip:** 需要注意的是，当您禁用服务（尤其是属于操作系统的服务）时，请确保系统继续正常运行并在一段时间内保持稳定。不要在您验证之前就离开现场！\n\
  \n## Fixed pattern broadcasts\n\n您也可以有固定模式的广播，例如每隔固定时间，如以下屏幕截图所示：\n\n![](img/da40f92928403866599198344271d63e_583_0.png)\n\
  \n图表配置为 **Tick interval**（在 **X Axis** 下）为 1 分钟，以及以下过滤器：\n\n- 红色过滤器用于网络中的所有广播（`eth.addr\
  \ == ff:ff:ff:ff:ff:ff`）\n- 绿色过滤器用于 ARP 请求广播（`arp.opcode == 1`）\n\n我们在这里看到的是，大约每五分钟，就会有一波\
  \ ARP 请求（绿色点）。如果我们点击图表中的一个点，它会带我们到捕获窗格中的数据包。在下面的屏幕截图中，我们看到每五分钟发生的扫描模式：\n\n![](img/da40f92928403866599198344271d63e_584_0.png)\n\
  \n在前面的屏幕截图中，我们可以看到是 D-Link 路由器扫描内部网络。这可能是好事也可能是坏事，我们将在第 14 章《理解网络安全》中详细介绍。在任何情况下，检查我们网络中正在运行的内容都是一个好主意。\n\
  \n### How it works...\n\n在 IPv4 网络中，广播相当常见，这些第 3 层广播将通过第 2 层广播发送。每当第 3 层设备向网络发送广播（以全\
  \ 1 结尾的 IP 地址，参考第 8 章，ARP 和 IP 分析）时，它将被转换为第 2 层全 f 目的地址。\n\n在基于 IP 的网络中，您会看到几种广播族。一些如下：\n\
  \n- TCP/IP 基于网络协议，如 ARP 请求、DHCP 请求等\n- 网络协议如 **NetBIOS Name Service (NBNS)** 查询、**NetBIOS\
  \ Server Message Block (SMB)**  announcements、**Network Time Protocol (NTP)** 等\n\
  - 发送广播的应用程序，如 Dropbox、Microsoft Network Load Balancing 等\n\n在 IPv6 中，我们没有广播，但我们有单播、多播和任播。由于该协议使用多播进行发现机制、公告和其他机制，因此我们会看到很多。\n\
  \n### See also\n\n- 有关 IPv4 的更多信息，请参阅 [第 8 章](Chapter 8)，ARP 和 IP 分析\n\n## Analyzing\
  \ Spanning Tree Protocols\n\n我们所有人都使用过，或至少听说过 **STP (Spanning Tree Protocol)**。我称此配方为分析生成树协议的原因是它有三个主要版本如下：\n\
  \n- **Spanning Tree Protocol (STP)**：这是 1998 年的 IEEE 802.1D 标准，称为 802.1D-1998\n\
  - **Rapid Spanning Tree Protocol (RSTP)**：这是 2001 年的 IEEE 802.1W 标准，后来添加到 802.1D，称为\
  \ 802.1D-2004\n- **Multiple Spanning Tree (MST)**：最初在 IEEE 802.1S 中定义，后来合并到 IEEE\
  \ 802.1Q\n\n还有来自 Cisco 和其他厂商的一些专有版本。在本配方中，我们将专注于标准版本，并学习如何在 STP/RSTP/MST 操作期间可能出现的问题进行故障排除。\n\
  \n### How to do it...\n\n在网络中，有几件事需要注意 STP：\n\n- 网络上运行的是哪个 STP 版本？\n- 是否有任何拓扑变化？\n\
  \n### Which STP version is running on the network?\n\nWireshark 会通过查看 **Bridge Protocol\
  \ Data Units (BPDUs)** 来提供网络上运行的 STP 类型（STP、RSTP 或 MST）的版本。BPDU 是在交换机之间多播的更新帧。\n\
  \n协议版本为：\n\n- 对于 STP，协议版本 ID 等于 0\n- 对于 RSTP/MST，协议版本 ID 等于 3\n\n> **Tip:** 在标准中您找不到“switch”一词；它总是“bridge”或“multiport\
  \ bridge”。在本書中，我们将桥和交换机互换使用。\n\n### Are there too many topology changes?\n\n当您监控\
  \ STP 操作时，当您看到许多拓扑变化时可能会担心。STP 中的拓扑变化是正常的，但太多可能会影响网络性能。\n\n拓扑变化发生在新设备连接到网络时。您可以在以下屏幕截图中看到拓扑变化：\n\
  \n![](img/da40f92928403866599198344271d63e_591_0.png)\n\n当您看到太多拓扑变化时，请配置连接到不支持 STP\
  \ 的主机的 LAN 交换机端口，这些端口通常是用户经常开关机的终端站，使用 portfast 功能（适用于 Cisco 交换机；对于其他厂商，请查看厂商手册）。\n\
  \n> **Tip:** 在旧的 STP（IEEE 802.1D）中，连接设备到交换机端口后，交换机需要大约一分钟才能开始并转发数据包。当客户端在此期间尝试登录到网络服务器时，这可能成为一个问题。portfast\
  \ 功能强制端口在几秒钟内开始转发（通常为 8 到 10 秒），以防止此类问题。\n\n如果拓扑变化继续，请检查可能出现的问题以及谁导致了它。\n\n故障后恢复服务。\n\
  \n在下面的图中，我们看到最初如何将所有交换机用它们之间的多个连接连接起来，以及 STP 如何创建树：\n\n![](img/da40f92928403866599198344271d63e_593_0.png)\n\
  \nBPDU 是在 LAN 交换机之间通过多播发送的更新帧。\n\n首先，在以太网级别，如以下屏幕截图所示，数据包将从发送更新的交换机的源 MAC 多播：\n\n\
  ![](img/da40f92928403866599198344271d63e_594_0.png)\n\nBPDU 由以太网 802.3 帧承载，其格式如下一个图所示：\n\
  \n![](img/da40f92928403866599198344271d63e_594_1.png)\n\n在下面的表中，您可以看到 STP 帧中的字段：\n\
  \n| Field | Bytes | What is it | Values | Display filter |\n| Hello Time | 2 | Time\
  \ between BPDUs. | Usually 2 seconds | `stp.hello` |\n| Forward Delay | 2 | The\
  \ Forward Delay field indicates the length of time that bridges should wait before\
  \ transitioning to a new state after a topology change. | Usually 15 seconds | `stp.forward`\
  \ |\n\n请注意，在 MST 的情况下，将为 MST 参数添加额外的头。\n\n### Port states\n\n在 STP 中，端口状态如下：\n\n\
  - **Disabled**: 在此状态下不转发帧也不接收 BPDU\n- **Blocking**: 在此状态下不转发帧，但会接收 BPDU\n- **Listening**:\
  \ 在此状态下不转发帧，但端口会监听帧\n- **Learning**: 在此状态下不转发帧，但会捕获 MAC 地址\n- **Forwarding**: 在此状态下转发帧，并捕获\
  \ MAC 地址\n\n当您将设备连接到 LAN 交换机时，端口会经历这些阶段，所花费的时间如下：\n\n- 从 Blocking 到 Listening 需要\
  \ 20 秒\n- 从 Listening 到 Learning 需要 15 秒\n- 从 Learning 到 Forwarding 需要 15 秒\n\n\
  在 RSTP 和 MST 中，端口状态如下：\n\n- **Discarding**: 在此状态下丢弃帧\n- **Learning**: 在此状态下不转发帧，并捕获\
  \ MAC 地址\n- **Forwarding**: 在此状态下转发帧，并捕获 MAC 地址\n\n从 Discarding 到 Forwarding 的整个端口状态转换应需要几秒钟，具体取决于网络拓扑和复杂性。\n\
  \n\n\n\n\n## 更多内容...\n\n对于生成树（Spanning Tree）调试，最好的方法是直接从局域网交换机获取数据。一个配置良好的 SNMP\
  \ 陷阱（trap）发送到管理系统也能对此有所帮助。\n\n以下是一些 STP 数据包的示例：\n\n- 在下面的截图中，你会看到一个 STP 帧。可以看到源\
  \ MAC 地址是北电（Nortel）地址，在 BPDU 本身中，你会看到根网桥标识和网桥标识相等；这是因为发送该数据包的网桥是根网桥。端口 ID 是 8003，这表示在北电交换机中对应端口号\
  \ 3。\n\n![](img/da40f92928403866599198344271d63e_597_0.png)\n\n- 在下面的截图中，你会看到一个快速\
  \ STP（Rapid STP）BPDU。这里可以看到协议标识符等于 2，端口状态为指定（designated）。\n\n![](img/da40f92928403866599198344271d63e_598_0.png)\n\
  \n- 在上一个截图中，你会看到一个 MST（多生成树）的示例。这里我们在标准 STP 帧之后立即看到 MST 扩展。\n\n![](img/da40f92928403866599198344271d63e_598_1.png)\n\
  \n## 分析 VLAN 与 VLAN 标记问题\n\n**VLAN**，或**虚拟局域网**（Virtual LAN），是一种将局域网划分为彼此之间没有任何连接的独立局域网的机制，“虚拟”这个名字正由此而来。在本节中，我们将介绍监控\
  \ VLAN 流量的方案。\n\n本方案旨在向读者概括介绍如何使用 Wireshark 处理 VLAN 问题。解决相关问题的一个更简单的方法是使用厂商的命令行界面（CLI）（如\
  \ Cisco IOS、Juniper JUNOS 等）。\n\n## 准备工作\n\n在本方案中，我们将讨论两个问题：\n\n- 如何监控 VLAN 内部的流量\n\
  - 如何查看经过 VLAN 标记端口的带标记帧\n\n在第一种情况下，需要进行简单的配置。在第二种情况下，有一些需要注意的地方。\n\n在 VLAN 上抓包时，你不一定会在数据包中看到\
  \ VLAN 标记。你是否能看到 VLAN 标记实际上取决于你运行的操作系统，以及你的网络接口卡（NIC）和 NIC 驱动程序是否支持此功能。\n\n# 注意\n\
  \n你的操作系统和 NIC 是否支持 VLAN 标记完全取决于操作系统和 NIC 的厂商。请查看厂商手册或通过 Google 搜索来查明。\n\n在下图中，你可以看到一个典型的\
  \ VLAN 拓扑。上层交换机通过两条 trunk 端口（这些端口会对以太网帧进行标记）连接到下层交换机。在该网络上，你拥有 VLAN 10、20 和 30，而连接到各个\
  \ VLAN 的 PC 将无法看到其他 VLAN 中的 PC。\n\n![](img/da40f92928403866599198344271d63e_600_0.png)\n\
  \n## 如何操作...\n\n将 Wireshark 连接到你要监控的交换机。我们来看看上述配置（如前面的图所示）。\n\n### 监控 VLAN 内部的流量\n\
  \n要监控整个 VLAN 上的流量：\n\n1. 将笔记本电脑连接到中心交换机，并连接到其中一个端口。\n2. 配置端口镜像，从被监控的 VLAN 镜像到你连接的端口。例如，如果你将笔记本电脑连接到\
  \ SW1 的 4 号端口，并希望监控 VLAN10 的流量，命令如下（在 Cisco 中）：\n\n```\nSwitch(config)#monitor session\
  \ 1 source vlan 10\nSwitch(config)#monitor session 1 destination interface\nfastethernet\
  \ 0/4\n```\n\n这将显示通过中心交换机 SW1 转发的 VLAN10 流量。\n\n#### 提示\n\n有关如何在不同厂商的网站上配置端口镜像的更多信息，请搜索\
  \ `SPAN`（Cisco）、`port mirror` 或 `mirroring`（HP、DELL、Juniper 等）。在刀片中心监控流量时，通常只能监控物理端口上的流量；不过，有些应用程序可以让你仅监控刀片上某个特定服务器的流量（例如\
  \ Cisco Nexus 1000V）。\n\n### 查看经过 VLAN 标记端口的带标记帧\n\n监控带标记的流量并非一件简单的事。你在用 Wireshark\
  \ 抓包时是否能看到 VLAN 标记，取决于你使用的网卡、其上运行的驱动程序，以及它们对 VLAN 标记的处理方式。\n\n验证你的笔记本电脑能否捕获带标记帧的最简单方法如下：\n\
  \n1. 通过端口镜像开始捕获带标记端口上的流量。如果你看到了标记，就可以继续你的工作。\n2. 如果看不到任何标记，请进入网卡配置。在 Windows 7 中，你可以通过单击“开始”按钮，然后依次导航到\
  \ **控制面板 | 网络和**\n\nInternet | 查看网络状态和任务 | 更改适配器设置 | 本地连接。接下来，按照下面截图所示的步骤操作：\n\n\
  ![](img/da40f92928403866599198344271d63e_603_0.png)\n\n3. 将适配器配置为禁用优先级和 VLAN（Priority\
  \ & VLAN Disabled）。这样会将标记传递给 WinPcap 驱动程序和 Wireshark。\n\n# 注意\n\n在上一张截图中，我们看到了一个带有\
  \ Realtek 网卡的联想笔记本电脑的示例。该示例展示的是常见设备，但在其他笔记本电脑或服务器上可能有所不同。原理应当相同：通过提取 VLAN 标记来禁用适配器对该标记的处理，以便将其转发给\
  \ WinPcap 驱动程序并在 Wireshark 中显示。\n\n## 工作原理...\n\n标记（tag）是添加到数据包中的一小段数据，用于为其添加 VLAN\
  \ 信息。该标记是一个 4 字节长的字符串（32 位），如下面的某个图所示。\n\n大多数网卡及其驱动程序只会将 VLAN 标记直接传递给上层进行处理。在这种情况下，Wireshark\
  \ 会看到 VLAN 标记并显示它们。\n\n在更复杂的网卡和驱动程序中，VLAN 标记将由网卡本身处理。这包括一些最常见的采用 Intel 和 Broadcom\
  \ 千兆芯片组的网卡。在这些情况下，你必须禁用 VLAN 功能。\n\n![](img/da40f92928403866599198344271d63e_604_0.png)\n\
  \n在配置 NIC 驱动程序以确保它不会处理 VLAN 标记时，数据包将被简单地转发给 WinPcap 驱动程序，并由 Wireshark 显示。\n\n![](img/da40f92928403866599198344271d63e_605_0.png)\n\
  \n## VLAN 标记\n\n在下面的截图中，你会看到一个带标记帧的示例；该帧被标记为 VLAN ID = 20。\n\n![](img/da40f92928403866599198344271d63e_605_1.png)\n\
  \n## 更多内容...\n\nWireshark 也会捕获双重标记，就像 802.1ad 标准一样。这些标记被称为服务标记（service tags），在服务提供商边缘添加，用于区分提供商标记和客户标记。提供商标记称为\
  \ **S-Tag**（802.1ad），客户标记称为 **C-Tag**（802.1Q）。这也被称为 QinQ 机制。\n\n## 另请参阅\n\n- 有关\
  \ WinPcap 的更多信息，请访问 WinPcap 主页 http://www.winpcap.org/\n- 有关 UNIX/Linux 库的更多信息，请参考\
  \ tcpdump 主页 http://www.tcpdump.org/\n\n## 分析无线（Wi-Fi）问题\n\n无线局域网（Wi-Fi）在过去十年中变得非常流行，从早期的\
  \ 802.11b，到 802.11g，再到支持高带宽无线通信的最新 802.11n 标准。\n\n还有新兴的标准，例如 IEEE 802.11ac，相关产品已进入市场，同时\
  \ 802.11ad 仍在开发中。\n\n在本方案中，我们将学习如何解决 Wi-Fi 问题，以及如何使用 Wireshark 捕获 Wi-Fi 帧并进行基本的流量分析。\n\
  \n## 准备工作\n\n当用户抱怨通过 Wi-Fi 连接时性能不佳时，请尽量带着笔记本电脑靠近用户所在位置，并确认你的 Wi-Fi 适配器已启用。\n\n##\
  \ 如何操作...\n\n基本工具就在笔记本电脑中（如下面的截图所示），在这里你可以获得以下第一手信息：\n\n- 信号强度，即接收信号强度指示（RSSI）。在某些情况下，你只会看到信号质量；在其他情况下，你还会看到\
  \ dBm 数值。\n\n- 接入点 ID，即服务集标识（SSID）\n\n- 所使用的安全协议\n\n- 无线类型（如下面的截图所示，为 802.11n）\n\
  \n![](img/da40f92928403866599198344271d63e_610_0.png)\n\n你也可以使用专用软件（其中许多是免费软件）来发现可用的\
  \ Wi-Fi 网络和信道（有些来自笔记本厂商，有些来自其他厂商）。在下面的截图中，你可以看到由名为 WIFI Locator（http://tcpmonitor.altervista.org/）的软件发现的一组无线网络列表；但是，还有许多其他软件也提供基本的发现功能：\n\
  \n\n![](img/da40f92928403866599198344271d63e_612_0.png)\n\n+   1. 尝试找出以下问题：\n+ \
  \     - 在同一区域内工作在同一信道上的不同接入点（AP）\n+      - 较低的 RSSI 值（以低于 -90dBm 的 RSSI 数值表示）\n\
  +   2. 下一步是使用频谱分析仪检查你所在区域使用了哪些频率。在机场、海港和军事区域等地，你可能会遇到频率干扰。Fluke Networks、Agilent\
  \ 和 Anritsu 等多家供应商都提供频谱分析仪。\n+   3. 可以使用 Wireshark 分析 Wi-Fi 控制帧。首先要查看的是 AP 是否在发送信标帧。在下面的截图中，你可以看到这些帧：\n\
  \n![](img/da40f92928403866599198344271d63e_613_0.png)\n\n工作站可以发送信标探测请求帧来查找附近的接入点。\n\
  \n## 提示\n\n当工作站想要从另一个 Wi-Fi 设备获取信息时，例如确定范围内的接入点，它会发送探测请求帧。\n\n工作站也可以确认来自接入点的信标帧，以便注册到该\
  \ AP。\n\n## 提示\n\n接入点定期发送信标帧，以通告其存在并传递信息。这些信息包括时间戳、SSID 以及与接入点相关的其他参数。无线网卡会持续扫描所有\
  \ 802.11 无线信道并侦听信标，以便选择最佳的接入点进行关联。\n\n+   4. 在接受并确认信标帧后，将开始标准的 DHCP 过程，如第8章“ARP与IP分析”所述。\n\
  \n## 工作原理...\n\n无线局域网标准以 IEEE 802.11 委员会为基础。这些标准从 802.11a、802.11b、802.11g、802.11n\
  \ 开始，最近又加入了用于更高带宽的 802.11ac 和 802.11ad。\n\n如下图所示，无线局域网基于接入点（AP）构建，无线客户端通过连接到接入点来接入网络。\n\
  \n![](img/da40f92928403866599198344271d63e_614_0.png)\n\n目前最常见的无线标准是 802.11n，它使用先进的多输入多输出（MIMO）调制技术，可搭配最多四根天线，并辅以其他技术来提升带宽。\n"
- "## 第8章 ARP 与 IP 分析\n\n在本章中，我们将介绍以下内容：\n\n+   - 使用 ARP 分析连通性问题\n+   - 使用 IP 流量分析工具\n\
  +   - 使用 GeoIP 查找 IP 地址的物理位置\n+   - 发现分片问题\n+   - 分析路由问题\n+   - 发现重复的 IP\n+   -\
  \ 分析 DHCP 问题\n\n## 简介\n\n在本章中，我们将学习如何分析第3层（IP）以及从第3层到第2层的解析（ARP）。我们将讨论互联网协议（IP）、地址解析协议（ARP）、动态主机配置协议（DHCP）、路由问题等，以及在排查这些协议时可能遇到的问题。\n\
  \n我们将首先介绍各种协议的正常行为，然后说明可能出现的问题以及如何解决。\n\n通常，在分析网络问题时，我们会自下而上进行排查：如果无法建立连接，请按以下顺序查找问题：\n\
  \n+   1. **第1层**：检查电缆是否已连接，交换机和你 PC 上的链路 LED 是否亮起。此步骤需要手动执行。\n+   2. **第2层**：检查\
  \ ARP 是否已发现目的 MAC 地址。如果是远程位置，请检查沿途每两个节点/路由器之间的连通性。这可以通过命令行完成（参见后面的 ARP 技巧）。\n+ \
  \  3. **第3层**：使用 `ping` 命令检查目的地，如果没有收到响应，则对其进行路由追踪。这可以通过命令行完成，在某些情况下也可以使用 Wireshark。\n\
  +   4. **第4层**：检查对端的进程/服务器是否有响应。此步骤需要使用 Wireshark 执行。\n+   5. **第5-7层**：检查应用程序问题。此步骤需要使用\
  \ Wireshark 执行。\n\n在第7章“以太网、局域网交换和无线局域网”中，我们讨论了第1层和第2层。在本章中，我们将讨论第3层（即 IP）以及第3层与第2层之间的解析过程（即\
  \ ARP）。在第9章“UDP/TCP分析”中，我们将讨论第4层（即 TCP 和 UDP），并在本书其余部分讨论应用层。\n\n## 使用 ARP 分析连通性问题\n\
  \nIP 使用 ARP 来根据目标设备的 IP 地址解析出目的 MAC 地址。当我们向目的地发送数据包时，第一个数据包是 ARP 请求，用于查找目的地的 MAC\
  \ 地址。我们从目的地获取该地址，然后向它发送其他数据包。\n\n## 提示\n\nARP 操作仅在本地进行，也就是说，作为广播的 ARP 请求只会在局域网内发送。当你向\
  \ IP 网络（具有相同的 IP 网络和掩码）中的设备发送数据包时，ARP 将尝试找到其地址。当你向网络之外的主机发送数据包时，会发送 ARP 来查找默认网关的\
  \ MAC 地址。\n\n## 准备工作\n\n我们将使用三种方法来查找基本的连通性问题：\n\n+   - 标准命令行（在 MS-Windows 中，转到**开始**，并在命令窗口中输入\
  \ `run`。在 Linux 中使用任何可用的 Shell）\n+   - Wireshark\n+   - 直接连接到局域网交换机或路由器，并从那里获取信息\n\
  \n## 提示\n\n要连接到通信设备（路由器、交换机等），首先需要使用控制台电缆（在 Cisco 中，这是浅蓝色扁平电缆）进行连接；为设备配置 IP 地址后，就可以通过\
  \ Telnet、HTTP 或 SNMP 软件访问该设备。通过所有这些方法，你可以读取设备计数器，从而获得流量、错误、CPU 利用率等信息。\n\n在接下来的每个操作步骤中，我们将确切地看到使用什么以及在哪里使用。\n\
  \n## 操作步骤...\n\n在本节中，我们将看到几个连通性问题以及如何处理它们。让我们看看下图中这个非常简单的网络。在这里，我们可以看到一个典型的网络，并讨论可能出现的某些连通性问题。\n\
  \n![](img/da40f92928403866599198344271d63e_619_0.png)\n\n在网络中，我们可以看到两台 PC——PC1 和\
  \ PC2——分别连接到交换机的 16 和 20 端口；一台服务器连接到交换机的 24 端口；一台路由器连接到交换机的 3 端口，将我们连接到远程办事处；一台防火墙连接到交换机的\
  \ 5 端口，将我们连接到互联网。我们安装了 Wireshark 的笔记本电脑连接到 2 端口。\n\n让我们看看这里可能发生的一些问题以及如何解决它们。\n\n\
  让我们考虑情况1：PC 无法连接到服务器时：\n\n+   1. 从 PC1 和 PC2 ping 服务器。\n+   2. 如果没有响应，请在命令行中输入 ARP\
  \ -a。在 ARP 表中，你应该能看到服务器的 IP 地址及其 MAC 地址。\n+   3. 如果你看到了服务器的 MAC 地址，那么很可能是服务器上运行的防火墙阻止了\
  \ ICMP 请求。为了测试，请禁用防火墙并再次测试。\n\n## 提示\n\n防火墙、VPN 客户端或带有某些防火墙功能的防病毒软件都可能阻止 ICMP 请求。在测试网络连通性问题时，请不要忘记这一点。\n\
  \n4. 如果你已经 ping 通了，但你的应用程序仍然无法工作，请参阅第9章“UDP/TCP分析”，并从那里继续排查。\n\n你已完成情况1中的步骤1到3，但仍然没有收到\
  \ ping 响应（显示请求超时）。\n\n+   5. 连接到局域网交换机，获取交换机已学习的 MAC 地址列表。\n\n## 提示\n\n在每台可管理的交换机中，你都可以查看交换机已学习的\
  \ MAC 地址列表，以及交换机是在哪些端口上学习到这些地址的。\n\n在 Cisco 中，相应的命令是 `show mac-address-table` 或\
  \ `show mac address table`（取决于 IOS 版本）。\n\n+   6. 如果你没有看到 PC 和服务器的地址，请检查物理问题，例如电缆故障、适配器问题和交换机端口问题。为此，你可以简单地更换电缆，或在测试时更换交换机、更换交换机上的端口等。\n\
  \n现在让我们看看如何使用 Wireshark 来解决这个问题。\n\n+   7. 当客户端抱怨无法连接到某个特定设备（服务器、打印机等）时，你可以将 Wireshark\
  \ 连接到该端口（通过端口镜像），然后你会看到大量 ARP 请求且没有响应。你可以在下图中看到这样的示例：\n\n![](img/da40f92928403866599198344271d63e_620_0.png)\n\
  \n\n\n\n- 8. 在此示例中，我们看到 **172.30.116.100** 和 **172.30.116.253** 都在查找 **172.30.116.254**\
  \ 的 MAC 地址，但没有收到任何回复。\n- 9. 在这种情况下，请在交换机中检查 MAC 地址是否已被学习；若没有，则检查物理问题。\n\n## ARP\
  \ 欺骗与中间人攻击\n\n中间人攻击的一种类型是，攻击者将自己以太网网卡的 MAC 地址注入其想监听设备的 ARP 缓存。一旦 ARP 缓存被成功毒化，每个受害设备在与另一台设备通信时，都会将所有数据包发送给攻击者。当然，攻击者在读取数据后会将其重新转发给它们。\n\
  \n这被称为中间人攻击，因为攻击者被置于两个受害设备之间通信路径的中间。这也被称为 ARP 欺骗，因为攻击者实际上用错误信息毒化了受害者的 ARP 缓存。\n\n\
  在下图中，我们看到了一个中间人攻击的示例：\n\n![](img/da40f92928403866599198344271d63e_621_0.png)\n\n\
  以下截图展示了 Wireshark：\n\n![](img/da40f92928403866599198344271d63e_622_0.png)\n\n##\
  \ 免费 ARP（Gratuitous ARP）\n\n免费 ARP 发生在设备想要验证是否有其他设备使用自己的 IP 地址时。在这种情况下，你会看到一个源地址字段和目标地址字段相同的\
  \ ARP 报文。免费 ARP 并无不妥。有些设备就是以这种方式工作的，例如，扫描已连接设备的家用路由器。\n\n![](img/da40f92928403866599198344271d63e_622_1.png)\n\
  \n## ARP 扫描\n\n当出于某种原因，我们看到某台设备使用 ARP 请求或响应来扫描网络，以获取信息或攻击网络时，就会用到 ARP 扫描。\n\n在观察\
  \ ARP 扫描时，只需检查以下内容：\n\n## 工作原理\n\n当我们在局域网内从自己的 IP 地址向目的 IP 地址发送数据包时，数据是被封装在以太网帧中的\
  \ IP 数据包。\n\n![](img/da40f92928403866599198344271d63e_625_0.png)\n\n例如，我们在同一局域网内从\
  \ 192.168.1.1 向 192.168.1.3 发送一个 Ping（ICMP 请求）。要发送数据包，我们需要目的地的 IP 地址和 MAC 地址，但我们只有它的\
  \ IP 地址。我们知道这个 IP 地址，因为这就是我们的目的地。\n\n为了找出目的地的 MAC 地址，我们只需向局域网发送一个 ARP 广播，询问连接在局域网上的所有设备：谁拥有\
  \ IP 地址 192.168.1.3？如果目的主机在线，它会发送一个带有目的 MAC 地址的 ARP 响应。\n\n从此刻起，源主机会将数据保存在一个缓存中，即\
  \ ARP 缓存，下次要发送数据时，它会直接将数据发送到目的地址。\n\nARP 缓存在主机缓冲区中保留数分钟（具体时间取决于操作系统）。当最后一个数据包发送到目的地后，ARP\
  \ 条目会在几分钟后被清除。\n\nARP 请求将是发送到局域网的广播，如下面的截图所示：\n\nARP 响应将是一个由我们查找的目的地发送给源主机的数据包，其中包含所需的\
  \ MAC 地址，如下面的截图所示：\n\n任何不符合标准且属于已知例外的情况（例如，免费 ARP、路由器发起的 ARP 扫描）都应该被检查！\n\n## 更多内容\n\
  \n这里有一个简短示例，帮助理解 ARP 的工作原理。在下图中，我们看到了一个有趣的情况：两台设备连接到同一局域网，但位于不同的子网，并且默认网关配置为各自自身的\
  \ IP 地址。问题是：它们之间的 Ping（或任何通信）能正常工作吗？\n\n![](img/da40f92928403866599198344271d63e_627_0.png)\n\
  \n凭直觉，你可能会回答不行，因为这是两台处于不同子网的设备，因此它们之间需要一台路由器。但让我们看看实际在线路上发生了什么：\n\n- **192.168.1.10**\
  \ 想要向 **192.168.2.20** 发送数据包。由于默认网关配置为其自身地址，它认为目的地与它在同一局域网，于是发送 ARP 请求。\n- 由于我们与目的地处于同一局域网，目的地会收到\
  \ ARP 请求（因为这是广播），并以自己的 MAC 地址回复 **192.168.1.10**。\n- 现在，源主机拥有了目的地的 MAC 地址。它向该地址发送数据包，尽管两台设备不在同一\
  \ IP 子网，目的地仍然能收到数据包。\n\n另一个重要问题是代理 ARP（Proxy ARP）。通信中的代理是代表他人执行某项操作的设备，而代理 ARP 则是一种技术，在这种技术中，一台主机（通常是路由器）会应答本应发给另一台机器的\
  \ ARP 请求。\n\n代理 ARP 概念在多种场景中得以应用，例如：\n\n- 当在路由器前面放置一台设备时，例如广域网加速/优化设备。当你将该设备配置为桥接（或透明）模式时，它会应答本应发给路由器的\
  \ ARP 请求。\n- 防火墙、网页过滤器以及以透明模式工作并位于服务器前方的其他设备。\n- 当某款软件除了其安装所在服务器的 IP 地址外，还需要另一个\
  \ IP 地址时。\n\n## 使用 IP 流量分析工具\n\nIP 是 TCP/IP 协议栈中的网络层协议，承载着所有上层信息。无论是 HTTP、视频、IP\
  \ 电话还是其他应用，IP 都是它们的第 3 层协议。在本节中，我们将了解一些有助于分析 IP 流量的工具。\n\n### 准备工作\n\n只需打开 Wireshark，将其连接到网络，为目标测试设备配置端口镜像，然后启动即可。\n\
  \n### 操作步骤\n\n有几种工具和配置可以帮助你分析 IP 流量，其中包括：\n\n- IP 统计\n- IP 名称解析\n\n### IP 统计工具\n\
  \n当你在监控通信线路、与服务器的连接、上网流量或任何其他类型的流量时，有几种工具可用于监控源 IP 和目的 IP。\n\n以下是查看源 IP 和目的 IP 的步骤：\n\
