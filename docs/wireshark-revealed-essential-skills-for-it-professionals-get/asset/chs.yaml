  \ 命令关闭被动模式。扩展端口（EPRT）用于指定可用于数据连接的扩展地址。该命令接受三个参数：网络协议、网络地址和端口号。\n\n- 现在，每当客户端尝试发起连接时，它必须发送到\
  \ EPRT 命令指定的特定地址。在此之前，每次数据连接服务器都会告知客户端要使用的临时端口。\n\n你已经了解了 FTP 服务器支持的主动和被动通信模式，也了解了它们的行为方式。在对任何\
  \ FTP 连接进行故障排查时，检查模式将会很有用，并且可以节省时间。\n\n## 剖析 FTP 数据包\n\n通常，客户端发送的每个请求都是一个特定的命令集，服务器会以数字值后跟文本消息的方式进行响应。请参见以下截图：\n\
  \n![](img/da40f92928403866599198344271d63e_1159_0.png)\n\n如你所见，服务器要求输入密码，客户端提供了密码。在列表窗格中就可以看到它以明文形式在网络上传输。一旦服务器收到并验证密码正确，就会显示相应的消息。在我们的例子中，密码是正确的，因此客户端收到\
  \ `230` 作为响应代码，后跟 `Login Successful`（登录成功）消息。\n\n客户端发出的命令可以带参数，也可以不带参数，设备之间流动的数据可以简单地通过数据包的\
  \ TCP 头部看到。请参见下面的图 4.9：\n\n![](img/da40f92928403866599198344271d63e_1159_1.png)\n\
  \n图 4.9：返回的 FTP-DATA\n\n帧 43 显示客户端发出了 LIST 命令，该命令由服务器处理，并且有 262 字节的数据返回给我们。选择帧 50\
  \ 以进一步查看 TCP 头部的內容。使用 FTP 的最大缺点之一是所有数据都以明文传输，包括用户名和密码。\n\n重新组装 FTP 数据流很容易，因为除了数据本身，没有其他内容在传输。没有附加到传输数据包上的代码或命令，这使得\
  \ Wireshark 和用户都能轻松理解。要重新组装 FTP 数据包的 TCP 流，只需右键单击选中的数据包，选择 **Follow TCP Stream**（跟踪\
  \ TCP 流）选项，然后以原始形式查看。请参见下面的图 4.10：\n\n![](img/da40f92928403866599198344271d63e_1160_0.png)\n\
  \n图 4.10：FTP 流\n\n客户端与服务器之间通过数据通道和命令通道进行的整个通信都被转换为人类可读的格式。红色文本是客户端发送的内容，蓝色文本是客户端接收的内容。如今，我们有一些高级协议可以创建加密通道。其中之一是**安全文件传输协议（SFTP）**。\n\
  \n下载或上传某些内容。让我举一个例子来说明。我在 192.168.1.105 运行一台 Kali Linux 机器，在 192.168.1.104 运行一台\
  \ Windows 机器。通过 Kali，我创建了一个小恶意软件，受害者（Windows）下载并安装了它。一旦执行，我们就会获得该设备的 shell。然后，我们可以在\
  \ shell 中启动 FTP，连接我们的 Kali 机器以进行权限提升。\n\n请参见以下捕获攻击者与受害者之间 FTP 流量的截图：\n\n![](img/da40f92928403866599198344271d63e_1163_0.png)\n\
  \n图 4.12：受害者的 FTP 捕获\n\n如你清晰所见，攻击者连接到 FTP 服务器并下载了 payload.txt 文件，该文件可能被用来获取该机器的\
  \ root 权限。\n\n如果此类性质的东西能够绕过你的防火墙和其他安全设备，那么请考虑改进你创建的配置，并尽量避免将来出现这些情况。有时，这类活动也可能是合法的，但这不应该阻止你进一步调查。一个几\
  \ KB 的小文件就足以危及你的整个网络。\n\n## 超文本传输协议\n\n网络上的数据使用 HTTP 应用层协议进行传输。HTTP 中的正常通信是一种请求/响应模型，其中客户端和服务器之间的通信由一组规则协调。客户端向服务器请求某个资源，然后收到一个状态码，该状态码指定了所请求资源的当前状态。如果资源可用，那么资源也会随状态码一起发送。HTTP\
  \ 是最流行、使用最广泛的协议之一，用于将浏览器请求的数据从相应的服务器传输过来。互联网世界主要由运行在传输层之上的 HTTP 支配。\n\n### 工作原理——请求/响应\n\
  \n每次你访问一个网站时，这个智能协议都会负责你的网页浏览体验。Web 服务器利用 HTTP 协议将其包含的网页提供给请求的客户端。在每次 HTTP 会话开始时，都会进行\
  \ TCP 三次握手。它在通信主机之间创建一个专用通道，随后是 HTTP 和数据包，它们在会话活动期间被发送和接收。例如，你正在访问位于 http://172.16.136.129\
  \ 的 Web 服务器，客户端位于 172.16.136.1。使用我们的客户端-服务器基础设施，我们将尝试捕获发送的请求和接收的响应。\n\n我将尝试访问前面提到的服务器上的主页，并捕获整个会话期间生成的流量，即发送的请求和接收的响应。请按照此处提到的操作来复现该场景。\n\
  \n\n\n\n\n这三个数据包是TCP三次握手的数据包，其中我们的客户端请求服务器创建一个专用通道。在我们的例子中，连接成功了。但是，如果服务器守护进程没有运行，或者由于任何原因服务器没有接受我们的请求，那么我们可能会看到类似下面这样的RST\
  \ ACK数据包：\n\n| 1 0.000000000 | 172.16.136.1 | 172.16.136.129 | TCP | 64 59783-80\
  \ [SYN] Seq=0 |\n| 2 0.000315000 | 172.16.136.129 | 172.16.136.1 | TCP | 40 80-59783\
  \ [RST, ACK] |\n\n图4.14：RST和ACK数据包，因为服务器未接受请求\n\n这个错误表明服务器已停止服务，或者服务器本不应响应我们的请求。\n\
  \n- 在TCP数据包之后，你可以看到我们的客户端发送的第一个HTTP请求。每个请求都包含发送到服务器的几个元素：\n\n```\nGET / HTTP/1.1\\\
  r\\n\nHost: 172.16.136.129\\r\\n\nIf-None-Match: \"12625d-bc-51c6ab45063d1\"\\r\\\
  n\nAccept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8\\r\\\
  n\nIf-Modified-Since: Mon, 03 Aug 2015 16:31:40 GMT\\r\\n\nUser-Agent: Mozilla/5.0\
  \ (Macintosh; Intel Mac OS X 10_10_3) AppleWebKit/600.6.3\nAccept-Language: en-us\\\
  r\\n\nAccept-Encoding: gzip, deflate\\r\\n\nConnection: keep-alive\\r\\n\n```\n\n\
  图4.15：HTTP请求\n\n- 这就是请求的样子。在第一行中，有三个东西作为参数传递给服务器，分别是HTTP方法和请求的资源位置“/”（根目录）。\n- 第二行指定了HTTP/1.1协议请求所必需的Host参数。该字段的值是你在浏览器地址栏中输入的Web服务器地址。\n\
  - 第四行是ACCEPT参数，它说明请求方客户端在响应中可以接受哪些类型的内容。\n- `If-modified-since`参数从客户端发送到服务器，其中包含你上次向服务器发出请求的日期和时间。如果自上次请求以来服务器内容已更改，你将收到新的更新页面。否则，你的系统将显示本地缓存的页面，从而节省一些资源。\n\
  - 下一个字段是`User-Agent`，它指定你用来访问网页的浏览器相关信息。服务器将使用此信息向你呈现与浏览器兼容的内容。\n- 诸如`Accept-Language`和`Accept-Encoding`之类的参数被传递给服务器，以告知客户端可接受的内容类型。因此，当服务器准备响应内容时，应考虑这些因素。\n\
  - `Connection-Alive`参数指定客户端希望在此特定请求处理完毕之后保持连接有效。\n\n所有HTTP数据包通常发送到Web服务器的80端口（其他常见的Web服务器端口包括8080、3132、8088等，Wireshark会根据HTTP协议首选项对这些端口进行解析）。\n\
  \n## 响应\n\n- 正如你所看到的，在第四个数据包之后，服务器确认了客户端访问服务器Web根目录的请求。服务器开始传输客户端请求的资源。列表窗格中的第六个数据包是客户端收到的内容，它包含一个状态码和一条简短消息，以及所请求资源的内容。请参见下面图4.16中的HTTP响应：\n\
  \n![](img/da40f92928403866599198344271d63e_1169_0.png)\n\n图4.16：HTTP响应\n\n- 作为TCP通信的一部分，客户端将确认服务器发送的每个数据包。在第七个数据包中可以看到，客户端试图为它收到的资源发送一个ACK。\n\
  - 让我们解析第六个数据包的响应元素。第一行包含响应中发送的三个参数。它们表示所用的HTTP协议版本、状态码（在我们的例子中是304，它表示所请求的资源自Date参数中指定的时间以来没有变化），最后是状态码的简要说明（在我们的例子中是“Not\
  \ Modified”（未修改））。\n- 在第三行中，Server参数指明了正在运行的Web服务器的名称和版本。我们可以看到Apache/2.2.22是位于172.16.136.129的服务器。\n\
  - 第四行和第五行表示服务器希望保持连接存活。服务器希望保持该连接的时间长度也体现在响应给我们的下一行参数中。其余内容在接下来的几行中，是一些配置参数。\n\n\
  这是一个非常基础的例子，用于检查客户端和服务器之间交换的请求与响应。然而，这种基础操作实际上就是你每次访问网站时都会发生的事情。如前所述，我们会收到一个状态码以及一段简短的描述作为响应。你在浏览器中每打开一个标签页，就会在通过IP地址和Web服务器运行的端口号连接的客户端与服务器之间创建一个新的套接字。\n\
  \n## 不寻常的HTTP流量\n\n前面提到的所有细节都属于正常流量模式的一部分。接下来我们即将看到的是在处理HTTP时可能遇到的一些不寻常的流量模式。我会尝试提及一些注意事项，这些内容在故障排除和分析HTTP时可能对你有所帮助。大多数HTTP问题都围绕诸如404、某种重定向、DNS解析问题和服务器相关错误等。让我逐一详细说明每种情况。\n\
  \n例如，你在访问一个Web服务器，正在寻找当前不可用的内容，或者所请求资源的地址已更改。在这种情况下，你会收到一个404状态码，表示服务器上找不到所请求的资源。请参见下面的截图，我尝试在一个Web服务器上请求一个名为abc.txt的文件，但该文件不存在：\n\
  \n![](img/da40f92928403866599198344271d63e_1171_0.png)\n\n图4.17：HTTP 404\n\n在列表窗格中，你可以看到所请求的资源不可用。因此，我们得到404\
  \ Not Found错误。如果有人试图对你的Web服务器执行目录列表操作，这类错误也可能是恶意的。将此类404数据包的着色规则更改为不同于普通HTTP数据包规则的样式，可以让我们迅速注意到。正如你所看到的，第八个数据包是一个HTTP数据包，应用了不同的着色方案。\n\
  \n用户请求的重定向通常在某个所请求资源的地址已更改到另一个地址或资源不可用时进行。现在，为了让你理解重定向，我对我们的基础设施做了一些修改，可以很容易地在下面所示的图中看到：\n\
  \n![](img/da40f92928403866599198344271d63e_1172_0.png)\n\n现在，从客户端发送到位于192.168.1.104的原始服务器的请求将被重定向到位于192.168.1.103的新服务器，客户端无需再做任何操作。要配置重定向，你必须修改服务器的配置文件。以下捕获的数据包描述了发生的重定向。请参见图4.18中的下一个列表窗格：\n\
  \n![](img/da40f92928403866599198344271d63e_1173_0.png)\n\n图4.18：HTTP重定向\n\n正如你所看到的，首先与104处的旧服务器发起了一次TCP握手，随后发送了一个HTTP\
  \ GET请求。104处的服务器在第21个数据包中以302 Found响应，这是重定向的提示。我们的请求被发送到位于103的新服务器，我们再次与它发起TCP三次握手（第31个数据包）。在第31个数据包之后，目标字段已改为新服务器的地址。\n\
  \n进一步调查第21个数据包，我们可以看到将我们的请求重定向到新服务器的内容。展开详细信息窗格中HTTP部分下的“Line-based text data”部分。请参见下面的截图：\n\
  \n```\nLine-based text data: text/html\n<!DOCTYPE HTML PUBLIC \"-//IETF//DTD HTML\
  \ 2.0//EN\">\\n\n<html><head>\\n\n<title>302 Found</title>\\n\n</head><body>\\n\n\
  <h1>Found</h1>\\n\n<p>The document has moved <a href=\"http://192.168.1.103\">here</a>.</p>\\\
  n\n<hr>\\n\n<address>Apache/2.2.22 (Debian) Server at 192.168.1.104 Port 80</address>\\\
  n\n</body></html>\\n\n```\n\n\n\n\n我们已在DNS协议部分讨论了DNS解析问题。例如，如果请求的Web服务器无法使用内部DNS服务器以及其他外部服务器解析你的请求，那么你将无法访问网站。即使DNS服务器工作正常而你无法访问网站，那么问题可能是拥塞，即服务器无法同时处理多个请求。这将导致诸如`408\
  \ Request Timeout`、`429 Too Many Requests`甚至`404 Not Found`等错误。HTTP的世界极为庞大，日常遇到的情况因人而异。你应该牢记的最重要事实是，如果所有基础概念都清晰，那么完成分配给你的任务才会容易。没有什么能胜过常识加上开箱即用的参数。为了理解协议的真实运作方式，我将使用以下架构。\n\
  \n![](img/da40f92928403866599198344271d63e_1175_0.png)\n\n## 常见的与不常见的SMTP流量\n\n\
  使用来自Kali Linux的netcat客户端，我将尝试连接运行在Windows机器上的SMTP邮件服务。一旦在服务器和客户端之间创建了专用通道，服务器就会表明它已准备好接受任何传入的命令。同时，服务器会以带简短摘要的数字代码进行响应。我按照以下步骤连接并发送了一封电子邮件：\n\
  \n- 1. 使用netcat打开连接 `nc -nv 192.168.1.105 25`。\n- 2. 使用 `HELO testmail` 命令初始化SMTP会话。\n\
  - 3. 使用 `MAIL FROM:<abc@charit.com>` 命令指定发件人地址。\n- 4. 使用 `RCPT TO:<efg@charit.com>`\
  \ 命令指定收件人地址。\n- 5. 要在邮件正文中输入数据，请键入 `DATA` 并按回车。现在，输入你希望发送的消息。完成邮件编写后，键入一个 `.` 表示结束并按回车。\n\
  - 6. 现在，你的消息将被发送。如果你想发送更多邮件，请遵循相同流程；否则，你可以关闭与邮件服务器的连接。键入 `QUIT` 即可。\n\n我执行的这些命令生成了若干数据包，这些数据包以非常细粒度的形式包含了会话细节。我还创建了一个捕获过滤器，只捕获与客户端和服务器相关的数据包，这有助于我仔细分析与会话相关的数据包；并阻止其他数据包进入列表窗格。只有在服务器配置为允许明文消息通信且无需任何身份验证时，上述所有命令才会生效，请参考以下截图描述以了解类似行为。\n\
  \n|  |  |  |  |  |\n|---|---|---|---|---|\n| 1 0.00000000 | 192.168.1.104 | 192.168.1.105\
  \ | TCP | 60 57073-25 [SYN] Seq=0 Win=29200 Len=0 MSS |\n| 2 1439081651.426767000\
  \ | 192.168.1.105 | 192.168.1.104 | TCP | 60 25-57073 [SYN, ACK] Seq=0 Ack=1 Win=1638\
  \ |\n| 3 -41448.227586000 | 192.168.1.104 | 192.168.1.105 | TCP | 52 57073-25 [ACK]\
  \ Seq=1 Ack=1 Win=29696 Len |\n| 4 4205130.997054000 | 192.168.1.105 | 192.168.1.104\
  \ | SMTP | 90 S: 220 Charit’s.com ESMTP 服务器就绪。 |\n| 5 1439081652.1437351000 | 192.168.1.104\
  \ | 192.168.1.105 | TCP | 52 57073-25 [ACK] Seq=1 Ack=39 Win=29696 Le |\n| 6 -287363963.384218000\
  \ | 192.168.1.104 | 192.168.1.105 | SMTP | 61 C: helo abc |\n| 7 1744899513.488830000\
  \ | 192.168.1.105 | 192.168.1.104 | SMTP | 82 S: 250 Charit’s.com 你好，abc。 |\n| 8\
  \ 1439081657.529807000 | 192.168.1.104 | 192.168.1.105 | TCP | 52 57073-25 [ACK]\
  \ Seq=10 Ack=69 Win=29696 L |\n| 9 1744901809.636862000 | 192.168.1.104 | 192.168.1.105\
