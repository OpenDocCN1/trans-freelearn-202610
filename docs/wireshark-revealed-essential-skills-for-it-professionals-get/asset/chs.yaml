  \ 令牌环 UDP：180 USB WLAN\n\n\n## 它是如何工作的...\n\n这非常简单。Wireshark 使用笔记本电脑上配置的 DNS 服务器来将\
  \ IP 地址翻译成名称。在某些情况下，了解有问题的流量模式会非常有帮助。这些可以例如是：\n\n- 违反公司政策的不允许访问网站的流量。\n- 自动软件更新，例如，反病毒网站和\
  \ Microsoft 更新。解决办法是中央服务器下载软件，而所有公司 PC 都从该服务器获取软件和更新。\n- 如果在组织设备上安装了工具栏，工具栏流量可能会导致大量流量（想想你公司每台设备额外增加\
  \ 50-100 个打开的连接，加上常规流量）。\n\n## 还有更多...\n\n例如，你可以看到一个安装了 Conduit 工具栏的浏览器。一旦运行它，你就会看到许多连接到你知道的网站，以及你不知道的网站的连接。在这里，例如，你可以看到连接到\
  \ Conduit 网站的连接，也连接到 **内容分发网络 (CDN)** 供应商。\n\n![](img/da40f92928403866599198344271d63e_634_0.png)\n\
  \n要查看确切的网站和页面，当然可以，选择 **Statistics | HTTP** 并选择相关功能（以 IP 配置为过滤器）。\n\n高效使用工具栏的一些规则：\n\
  \n- 制定关于使用什么和不使用什么的政策，并阻止用户安装不允许的工具栏\n- 监控你到互联网的线路，并确保流量去向何处\n\n## 使用 GeoIP 查找 IP\
  \ 地址的物理位置\n\nWireshark 1.1.2 及更高版本可以使用 GeoIP（商业版）和 GeoLite（免费版）数据库来查找 Wireshark\
  \ 发现的 IP 地址的城市、国家、AS 编号和其他信息。\n\n## 准备工作\n\n1. 前往以下网站：http://dev.maxmind.com/geoip/geolite.\n\
  2. 对于 IPv4，下载以下文件（二进制文件）：\n   - GeoLite Country\n   - GeoLite City\n   - GeoLite\
  \ ASN\n3. 对于 IPv6，下载以下文件：\n   - GeoLite Country (IPv6)\n   - GeoLite City (IPv6)\n\
  \   - GeoLite ASN (IPv6)\n\n### 提示\n\n**自治系统 (AS)** 是在 **外部网关协议 (EGPs)** 中使用的术语，用于标识由同一网络运营商控制的所有路由器。当你通过两个不同的\
  \ **互联网服务提供商 (ISPs)** 连接到互联网时，你将拥有自己的 AS，而两个 ISP 各自拥有其 AS。在使用两个不同的 **互联网服务提供商 (ISPs)**\
  \ 配置到互联网的连接时，AS 会与 EGP 路由协议一起配置。EGP 协议的市场标准是 **边界网关协议版本 4 (BGPv4)**。\n\n你将获得包含国家、城市和自治系统\
  \ (AS) 编号的二进制文件。\n\n## 如何操作...\n\n下载文件后，请按照以下步骤操作：\n\n1. 将所有文件放在同一目录中（你也可以将它们放在不同目录中，但会不方便）。\n\
  2. 现在，你必须告诉 Wireshark 文件在哪里。前往 **Edit | Preferences | Name Resolution** 并选择 **GeoIP\
  \ database directories**。\n3. 添加 GeoIP 目录的完整路径，如以下屏幕截图所示：\n\n![](img/da40f92928403866599198344271d63e_637_0.png)\n\
  \n4. 点击 **Apply** 并关闭窗口并重新启动 Wireshark。\n5. 现在，启动 Wireshark（或打开已保存的文件），选择 **Statistics\
  \ | Endpoints**，并在包含 IP 地址的任何选项卡中查看 GeoIP 信息：\n\n![](img/da40f92928403866599198344271d63e_637_1.png)\n\
  \n6. 你也可以在 IP 数据包详细树中查看 GeoIP 数据。要启用此功能，请前往 Edit | Preferences | Protocols | IP\
  \ 并确保已勾选 Enable GeoIP lookup。\n\n5129 64.355772000 yoras m-ndi d2n6o0n31iqeta.cloudfront.net\
  \ TCP 54 55780 > http [ACK] Seq=\n\nInternet Protocol Version 4, Src: yoras m-ndi\
  \ (192.168.43.191), Dst: d2n6o0n31iqeta.cloudfront.net (:\n\nVersion: 4\nHeader\
  \ Length: 20 bytes\n\nSource: yoras m-ndi (192.168.43.191)\n\nDestination: d2n6o0n31iqeta.cloudfront.net\
  \ (54.240.162.90)\n\n[Source GeoIP: unknown]\n\n[Destination GeoIP: United States,\
  \ AS16509 Amazon.com, Inc., Seattle, WA, 47.634399, -122.342201]\n[Destination GeoIP\
  \ Country: United States]\n[Destination GeoIP AS Number: AS16509 Amazon.com, Inc.]\n\
  [Destination GeoIP City: Seattle, WA]\n[Destination GeoIP Latitude: 47.634399]\n\
  [Destination GeoIP Longitude: -122.342201]\n\nIP and DNS Information\n\nGeoIP Information\n\
  \n## 它是如何工作的...\n\nIP 地址由 **互联网号码分配机构 (IANA)** 提供，IANA 是互联网标准组织 (ISO) 的一个下属组织，分配给称为区域互联网注册管理机构的区域组织（RIPE-NCC、APNIC、AFRINIC、LACNIC\
  \ 和 ARIN），然后它们分配给国家 ISP，国家 ISP 再分配给个人客户。GeoIP 只是这些位置的数据库，因此它根据此数据库解析 Wireshark 捕获的\
  \ IP 地址。\n\nGeoLite 文件是免费的 IP 地理位置数据库，每月更新一次。它可以在 http://dev.maxmind.com/geoip/geolite#IP_Geolocation-1\
  \ 找到。\n\n## 还有更多...\n\nGeoIP 可以用于多种原因：\n\n- 查看组织中的人员正在连接的站点（网站、FTP 服务器等）\n- 解析来自世界各地到你组织的连接的源\
  \ IP 地址\n- 娱乐\n\n## 查找分片问题\n\n分片是 IP 中的常见机制，它将大型 IP 数据包分成更小的尺寸数据包，以便适应第 2 层以太网帧。在大多数情况下，该机制不应有任何问题，但由于该机制可能会出现性能问题。\n\
  \n## 准备工作\n\n只需打开 Wireshark，将其连接到网络，将端口镜像配置到你要测试的设备，然后启动它。分片主要会影响交互式应用程序，例如数据库，这些是我们应该寻找问题的地方。\n\
  \n## 如何操作...\n\n当分片发生时，你会看到 UDP 或 TCP 数据包以及分片的 IP 协议数据包，如以下屏幕截图所示：\n\n![](img/da40f92928403866599198344271d63e_643_0.png)\n\
  \n在怀疑性能问题时，例如，数据库客户端与服务器的连接缓慢，请按照以下步骤操作以查看问题是否由于分片引起：\n\n1. 测试客户端和服务器之间的连接，以验证没有其他问题。\n\
  2. 查找客户端和服务器之间的分片。分片将显示为前一个屏幕截图中的情况（IPv4 分片）。\n3. 如果你怀疑分片是问题的原因，请联系一位优秀的数据库管理员（DBA），他将调整数据库以发送不会导致网络分片的数据包。\n\
  4. 以太网中推荐的数据包大小不超过 1460 字节减去 TCP 头部大小。因此，从接口传出的段大小应为 1420-1440 字节。\n\n在我们需要更多字节用于头部的情况下，例如，当我们使用隧道机制和\
  \ TCP 选项时，DBA 将不得不进一步减小此大小。最好的方法就是简单地将其减小到你不会看到任何分片的大小。\n\n## 它是如何工作的...\n\n了解定义通过网络发送的数据单元大小的两个术语很重要，如下图所示：\n\
  \n- **最大传输单元 (MTU)：** 这是包括头部和数据的 IP 数据包大小\n- **最大段大小 (MSS)：** 这是 TCP 有效载荷的最大大小，即上层协议和数据的大小\n\
  \n![](img/da40f92928403866599198344271d63e_645_0.png)\n\nIPv4 中使用的分片机制如下图所示：\n\n\
  ![](img/da40f92928403866599198344271d63e_645_1.png)\n\n\n\n\n\n- 1. 一个原始的大数据包进入\
  \ NIC 或路由器，其数据包大小需要进行分片。\n- 2. 数据包根据原始大小被分片成几个部分。\n- 3. 对于分片，我们有以下字段：\n  - **ID**：这与原始数据包的\
  \ ID 相同\n  - **Bit 0**：始终为 0\n  - **Bit 1 (DF 位)**：0 = 可分片，1 = 不分片。\n  - **Bit 2\
  \ (MF 位)**：0 = 最后分片，1 = 还有更多分片\n  - **分片偏移**：这表示从原始数据包开头开始的字节数\n\n在 IPv4 中，NIC 本身可以对数据包进行分片，以及通往目的地的途中每台路由器都可以进行分片。\n\
  \n在 IPv6 中，分片只能由发送方完成，而不能由通往目的地的路由器完成。在 IPv6 中，分片由扩展头实现。\n\nwhich is the first fragment\
  \ leaving the NIC, we see:\n\n![](img/da40f92928403866599198344271d63e_648_0.png)\n\
  \n在前面的屏幕截图中，我们看到数据包 443 和 444 (1) 都是原始数据包的分片。在数据包 443 中，我们看到总长度为 1500 字节 (2)，ID\
  \ 为 0x89a8 (3)，更多分片标志已设置 (4)，意味着后面还有更多分片要跟随，并且分片偏移为 0 (5)，意味着这是流中的第一个分片。\n\n在下一张屏幕截图中，我们看到下一个分片，即捕获文件中的数据包\
  \ 444：\n\n![](img/da40f92928403866599198344271d63e_648_1.png)\n\n在数据包 444 中，我们看到总长度为\
  \ 212 字节 (2)，ID 为 0x89a8 (3)，与数据包 443 相同，更多分片标志未设置 (4) 意味着这是来自原始数据包的最后一个分片，并且分片偏移为\
  \ 1480 (5)，意味着这是来自原始数据包的第二个分片。\n\n## 分析路由问题\n\n网络中最关键的问题之一是路由。这些包括路由环路、无法到达目的地以及更多。大多数路由问题在解决时不需要使用\
  \ Wireshark。在大多数情况下，一些路由原理和协议的知识加上常识就能解决问题。在本配方中，我们将尝试提供一些基本提示以及一些基本问题，以便 Wireshark\
  \ 可以提供帮助。\n\n### 准备工作\n\n首先，确保你熟悉非常基本的命令，`Ping` 和 `Tracert`（或 `Traceroute`）。在大多数情况下，这些命令加上登录路由器将帮助你解决这些问题。\n\
  \n在本配方中，我们将展示捕获文件中可以指示路由问题的一些重要内容。\n\n### 如何操作...\n\n在本节中，我们不会像通常那样给出要做什么的配方，而是提及需要关注和注意的事情。\n\
  \n在你应该注意的事情中，最关键的是：\n\n- 第一个也是最重要的，**生存时间 (TTL)** 消息。TTL 值为 0 应该引起警报，因为在大多数情况下，这意味着环路。Wireshark\
  \ 不会告诉你环路来自哪里，但看到这些消息是出了问题的警报。典型的消息将是：TTL 在传输中过期。\n- 以下 ICMP 消息应指示路由器或多个路由器中的配置问题：\n\
  \  - **目标网络不可达**：它通常表示其中一个网络路由器中缺少路由\n  - **目标主机不可达**：它通常表示目的地网络上的设备（例如 PC）未连接到网络或其上未配置默认网关\n\
  - 另一个应该引起注意的问题是，当你看到数据包从源 IP 地址到目的地，反向到源，反向到目的地，等等，而 TTL 值在每个数据包中减少一时，这明显表明存在环路。\n\
  \n### 还有更多...\n\n典型的路由问题可以在以下插图中看到。在此网络中，我们有一个中央数据中心和两个远程办公室。该网络是这样构建的，以便从远程办公室到中央数据中心提供冗余。\n\
  \n![](img/da40f92928403866599198344271d63e_654_0.png)\n\nEIGRP 在路由器中运行，另外还有到 Internet\
  \ 的静态路由。以下部分（且与案例相关）的路由表如下所示（仅表示与示例相关的路由）：\n\n| 路由器 | 目标网络 | 下一跳 | 管理成本 | 发现协议 |\n\
  |---|---|---|---|---|\n| R_DC | 10.10.0.0/16 | R1 | 5 | EIGRP |\n| R_DC | 10.20.0.0/16\
  \ | R2 | 5 | EIGRP |\n| R_DC | 0.0.0.0/0 | FW | 1 | Static |\n| R1 | 10.50.0.0/16\
  \ | R_DC | 5 | EIGRP |\n| R1 | 0.0.0.0/0 | R_DC | 1 | Static |\n| R2 | 10.50.0.0/16\
  \ | R_DC | 5 | EIGRP |\n| R2 | 0.0.0.0/0 | R_DC | 1 | Static |\n| FW | 10.10.0.0/16\
  \ | R_DC | 1 | Static |\n| FW | 10.20.0.0/16 | R_DC | 1 | Static |\n| FW | 0.0.0.0/0\
  \ | ISP | 1 | Static |\n\n问题是，我们曾遇到一个非常罕见的情况，即通往中心的两个线路，R1 到 R_DC 和 R2 到 R_DC，都被切断了（最后一公里被一台拖拉机切断）。\n\
  \n当然，两个办公室立即断开连接。问题是为什么拥有数百台 PC 另外还有数据中心的中央办公室变得非常缓慢，尤其是在 Internet 上。\n\n当我将 Wireshark\
  \ 连接到中央交换机并对整个交换机进行端口镜像时（端口镜像到 VLAN1），我看到了环路。数据包在服务器和防火墙之间传输，每个数据包的 TTL 递减。这是一个环路。\n\
  \n发生了什么？\n\n- 1. 两条线路被切断的瞬间，EIGRP 在路由器 R_DC 中停止看到 R1 和 R2。\n- 2. 当服务器向网络 10.10.0.0/16\
  \ 或 10.20.0.0/16 发送数据包时，服务器将其发送到其默认网关；即 R_DC。\n- 3. 当数据包到达它时，R_DC 将其发送到防火墙。这是当 EIGRP\
  \ 变得非活动时生效的到 0.0.0.0 的路由。\n- 4. 防火墙收到数据包并将其发送回 R_DC。这是他在路由表中的内容。\n- 5. 数据中心中所有服务器发送到远程位置的数据包开始在服务器和防火墙之间乒乓，这足以减慢服务器和访问\
  \ Internet 的速度。\n\n## 查找重复 IP\n\nIP 网络中最令人讨厌的问题之一是重复的 IP 地址。有趣的是，如果你熟悉问题的原因以及如何找到它，它就成为最简单的问题之一来解决。\n\
  \n### 准备工作\n\n当你怀疑网络中存在重复地址时，首先要做的是使用简单的 CLI 命令——ARP 和 Ping。如果找不到问题，将 Wireshark\
  \ 连接到交换机并在大型网络中连接到网络中的每个 VLAN，然后逐步移动直到找到问题。\n\n### 如何操作...\n\n我们从现象开始，例如访问服务器或另一台设备缓慢，访问\
  \ Internet 缓慢，以及你收不到回复的所有 ping。\n\n- 1. 当你访问网络设备缓慢时，可能会出现的问题之一是该设备的 IP 地址与另一个地址冲突。为验证这一点，ping\
  \ 该 IP 地址。\n\n  **提示：** 在某些设备中，当其地址与相同地址冲突时，驱动程序将简单地关闭（Windows 操作系统屏幕左下角的小符号）。在其他设备中，你不会收到冲突的任何通知，这就是问题出现的地方。\n\
  \n- 2. 在命令行界面 (CLI) 中输入 `arp -a`。在 Windows 中使用 `cmd` 命令（或 Linux 中的任何 shell）。如果对于你\
  \ ping 的 IP 地址你得到两行且 MAC 地址不同，这就是重复的。\n\n- 3. 在 Google 上搜索两个设备的 MAC 地址，地址的第一部分将告诉你厂商是谁。这将引导你找到麻烦制造者。\n\
  \n- 4. 如果你需要设备的位置，登录你的 LAN 交换机（当然当你有托管交换机时），从交换机 MAC 地址表中，你将看到你连接到的交换机端口。\n\n  **提示：**\
  \ 有一种软件会显示连接到每个交换机的设备列表以及它们的 MAC 地址、IP 地址、DNS 名称等。在 Google 上搜索 switch port mapper\
  \ 或 switch port mapping tools，你会找到很多。\n\n- 5. 如果 Ping 和 ARP 没有得到任何结果，只需启动 Wireshark\
  \ 并端口镜像网络 VLAN。Wireshark 将显示重复地址错误以及相关详细信息。\n\n- 6. 你将收到的错误消息如下图所示：\n\n\n\n![](img/da40f92928403866599198344271d63e_660_0.png)\n\
  \nIn this case due to gratuitous ARP ...\n\nDuplicate IP address detected for 149.49.32.134\
  \ (00:40:0d:8a:74:bd) - also in use by 00:40:0d:8a:74:d7 (frame 1)\n\nFrame showing\
  \ earlier use of IP address: 1\n\nDuplicate IP discovered\n\nWhich is also used\
  \ in another MAC address\n\n## How it works...\n\nWhen you ping an IP address that\
  \ appears twice on your local network, the two devices (or more) that have the same\
  \ IP address will answer to the ARP request that you sent, and your ARP cache will\
  \ have two entries for the same IP address.\n\nIn many cases, your device will indicate\
  \ it by closing its IP driver and notify you by a pop-up window or any other type\
  \ of notification that you will be aware of.\n\nIn other cases, the colliding devices\
  \ will not notify the conflict, and then you will find a problem only with Pinging\
  \ and ARP, as described before.\n\nIn any case, when you connect Wireshark to the\
  \ network and see duplicate IP messages, don't ignore it.\n\n## There's more...\n\
  \nDuplicate IP usually happens when there are two identical addresses in the network,\
  \ but it becomes even more interesting when you have three identical addresses.\n\
  \nYou can see a funny example for this in the upcoming screenshot:\n\n![](img/da40f92928403866599198344271d63e_662_0.png)\n\
  \nIn this customer network, they've internal network of around 150 devices with\
  \ connectivity to the Internet through a firewall. The problem was a very slow connection\
  \ to the Internet.\n\nWhen they did a ping to a server on the Internet (any server),\
  \ they got the following responses:\n\n```\nReply from 173.194.35.148: bytes=32\
  \ time=98ms TTL=51\nRequest timed out.\nReply from 173.194.35.148: bytes=32 time=124ms\
  \ TTL=51\nRequest timed out.\nReply from 173.194.35.148: bytes=32 time=134ms TTL=51\n\
  Request timed out.\nReply from 173.194.35.148: bytes=32 time=582ms TTL=51\nRequest\
  \ timed out.\n```\n\nThe customer made some changes to the network, the network\
  \ became even slower, and pinging the same server on the Internet got them the following\
  \ response:\n\n```\nReply from 173.194.35.148: bytes=32 time=98ms TTL=51\nRequest\
  \ timed out.\nRequest timed out.\nReply from 173.194.35.148: bytes=32 time=124ms\
  \ TTL=51\nRequest timed out.\nRequest timed out.\nReply from 173.194.35.148: bytes=32\
  \ time=134ms TTL=51\nRequest timed out\nRequest timed out...\n```\n\nWhen I came\
  \ into the picture, the first thing I did was to ping the server on the Internet\
  \ and type ARP -a to see what I got. And what I saw was the IP address 10.10.10.200\
  \ with three different MAC addresses. Of course, it was a three-time duplicate address,\
  \ and digging into the problem showed me what actually happened there, as illustrated\
  \ in the following figure:\n\n![](img/da40f92928403866599198344271d63e_663_0.png)\n\
  \nWhat happened was that the network default gateway to the Internet was not actually\
  \ the firewall, but a web-filtering device that was located between the network\
  \ and the firewall with the address 10.10.10.200, while the network between it and\
  \ the firewall was 172.16.1.2/30.\n\nWhat actually happened is explained as follows:\n\
  \n+   1. In the first place, they configured the DHCP server on the network to exclude\
  \ addresses 10.10.10.201-254, so the FW address was not excluded.\n\n## Getting\
  \ ready\n\nWhen you have a DHCP server on your network, and PCs are not able to\
  \ receive IP addresses automatically, just connect Wireshark with port mirror to\
  \ the device that doesn't receive the address, connect and disconnect the device\
  \ from the network, or simply use the `ipconfig /release` and `ipconfig /renew`\
  \ commands. Now, we will have a look at what can go wrong.\n\n## How to do it...\n\
  \nHave a look at the DHCP procedure described in the How it works ... section. Anything\
  \ that is not going according to this procedure is wrong, so check for the following:\n\
  \n+   1. Did the client send the `DHCP Discover` packet?\n+   2. If it did, the\
  \ client works fine.\n+   3. If it didn't:\n+      - Something is wrong with the\
  \ client. Check if the client is configured with DHCP (obtain an IP address automatically\
  \ as marked in the TCP/IP configuration window).\n+      - It can be that the client\
  \ is physically not connected to the network. It happens a lot with wireless communications\
  \ (WiFi), where the client does not have connectivity to the network and therefore,\
  \ does not send the `DHCP Discover` packet since it doesn't have a network to send\
  \ it over.\n+   4. The client sends `DHCP Discover` and receives `DHCP Offer` from\
  \ a single server. This is ok; continue watching the wire.\n+   5. The client sends\
  \ `DHCP Discover` and receives `DHCP Offer` from two or more servers. This is a\
  \ problem. You have more than one DHCP server on your LAN, and you might get different\
  \ address allocations to clients on the LAN. Turn off one of the servers (at least\
  \ the DHCP service on it).\n+   6. You receive DHCP Discover and send DHCP Request;\
  \ this is fine.\n+      - If you immediately receive `DHCP Ack` with the IP parameters,\
  \ everything is fine.\n+      - If you don't receive anything, and you send another\
  \ `DHCP Request`, it can be a slow or non-responsive server. Check it.\n+   7. If\
  \ you receive a DHCP Decline message, it is the server that has refused your request.\n\
  +      1. It can be that the server does not have available addresses. In this case,\
  \ extend your address range.\n+      2. It can be also that the server has allocated\
  \ your previous IP address to someone else. This is a server configuration issue;\
  \ so if you need this feature, configure the server to save IP addresses per clients.\n\
  \n## How it works...\n\nDHCP is considered to be a simple protocol, but actually\
  \ it is very complex. When you connect a client to the network, it will go through\
  \ the following steps:\n\n+   1. `DHCP Discover`: The client initializes a limited\
  \ version of TCP/IP and broadcasts a request looking for a DHCP server. The request\
  \ is sent from UDP port 68 to UDP port 67.\n+   2. `DHCP Offer`: DHCP servers listen\
  \ on UDP port 67, and if a server receives the request, it answers with a DHCP offer,\
  \ that is offering to provide the service of address assignment.\n+   3. `DHCP Request`:\
  \ The client receives the DHCP offer and sends back a request to receive information.\
  \ The request will be, for example, the IP address that we requested before (because\
  \ we had it before), for our MAC address so that the server will recognize us as\
  \ a prior client with a saved IP address and other parameters.\n+   4. `DHCP Ack`:\
  \ Here the server sends the requested information, including the IP address, subnet\
  \ mask, default gateway, DNS servers, and other parameters that are configured on\
  \ the server.\n\nIn the next screenshot, we see a standard procedure of DHCP that\
  \ works properly:\n\n![](img/da40f92928403866599198344271d63e_668_0.png)\n\n## There's\
  \ more...\n\nA very common problem is when you connect a device to your network,\
  \ you receive an IP address and you don't have any idea where it came from. Usually,\
  \ this is because someone has connected a DHCP server to your LAN without telling\
  \ you. In most of the cases, it will be a small Internet router. This is very simple\
  \ to find out:\n\n+   1. If you type `ipconfig` and get an address that you don't\
  \ know, it might be a problem.\n+   2. Since the router we suspect is connected\
  \ to the network, assign your IP address, subnet mask, and a default gateway. When\
  \ you ping your default gateway, you actually ping the router, which is likely to\
  \ be the troublemaker.\n+   3. Type `ARP -a` to give you the troublemaker's MAC\
  \ address. This will tell you two things:\n+      - Who is the vendor? When you\
  \ know who is the vendor is (D-Link, Edimax, Netgear, and many others), you can\
  \ simply go and look for it.\n+      - By logging into the LAN switch, the MAC address\
  \ will also tell you which port it is connected to. Go to your communications room\
  \ and disconnect it.\n+   4. Of course, while listening to the port with Wireshark,\
  \ you will see the vendor MAC address easily.\n\n\n\n"
- "## 第9章 UDP/TCP 分析\n\n本章包含以下操作指南：\n\n- 配置 TCP 和 UDP 偏好设置以进行故障排查\n- TCP 连接问题\n- TCP\
  \ 重传——它们来自哪里以及为什么\n- 重复 ACK 和快速重传\n- TCP 乱序数据包事件\n- TCP 零窗口、窗口满、窗口变化和其他窗口指示器\n-\
  \ TCP 重置及其发生原因\n\n### 简介\n\n**传输控制协议（TCP）**和**用户数据报协议（UDP）**的目标是在终端应用之间传递信息，例如，从\
  \ Web 客户端到 Web 服务器、邮件客户端到邮件服务器，等等。这是通过为终端应用提供标识并在它们之间转发数据包来实现的。这些标识称为端口号，端口号及其 IP\
  \ 地址合称为套接字。在下图中，你可以看到当从浏览器打开到 Web 服务器的连接时会发生什么。Web 服务器在端口 80 上监听，而你将从例如端口 1024 打开一个连接。\n\
  \n因此，服务器在端口 80 上监听请求，并将响应发送到你的端口 1024。\n\n![](img/da40f92928403866599198344271d63e_671_0.png)\n\
  \nTCP 是一种可靠的、面向连接的协议，而 UDP 不支持连接和可靠性，只是在两个终端进程之间传输数据报。\n\n#### 提示\n\n还有一个额外的第 4\
  \ 层协议，称为 SCTP（流控制传输协议）。该协议可以看作是 TCP 的改进版本，主要用于服务提供商的网络。SCTP 不在本书的讨论范围之内。\n\n在本章中，我们将重点关注\
  \ TCP、其行为、各种问题，以及如何使用 Wireshark 来定位和解决这些问题。\n\n### 配置 TCP 和 UDP 偏好设置以进行故障排查\n\n\
  在大多数情况下，你可以使用 Wireshark 默认的 TCP 和 UDP 网络分析参数，但也有一些更改可以配置。这些更改将在**偏好设置**窗口中进行配置。\n\
  \n#### 操作步骤...\n\n在本节中，我们将看到如何配置 TCP 和 UDP 偏好设置。\n\n##### UDP 参数\n\n让我们看看一些可能影响\
  \ UDP 捕获的参数：\n\n![](img/da40f92928403866599198344271d63e_675_0.png)\n\n你可以在 UDP\
  \ 中配置以下参数：\n\n- **在协议树中显示 UDP 摘要**：如果希望协议树中显示 UDP 摘要行，请勾选此按钮（默认已设置）\n- **首先尝试启发式子解析器**：在使用注册到特定端口的子解析器之前，先尝试使用启发式方法对数据包进行解码\n\
  - **如果可能，验证 UDP 校验和**：验证 UDP 校验和\n- **收集进程流信息**：收集进程流信息\n\n默认情况下，只设置了第一个参数。在大多数情况下，这已经足够了。\n\
  \n##### TCP 参数\n\n![](img/da40f92928403866599198344271d63e_676_0.png)\n\n你可以在 TCP\
  \ 中配置以下参数：\n\n- **在协议树中显示 TCP 摘要**：如果希望协议树中显示 TCP 摘要行，请勾选此按钮（默认已设置）。\n- **如果可能，验证\
  \ TCP 校验和**：此功能可能会降低性能。在大多数情况下，这不是必需的。\n- **允许子解析器重组 TCP 流**：此选项用于流分析（默认已设置）。\n\
  - **分析 TCP 序列号**：设置此选项后，Wireshark 会分析序列号并跟踪重传、重复 ACK 等现象，这是 Wireshark 的重要功能之一。\n\
  - **相对序列号**：设置此选项后，Wireshark 将显示每个从 seq=0 开始的 TCP 连接。\n- **跟踪在途字节数**：此设置使 Wireshark\
  \ 能够跟踪网络中未确认字节的数量（默认已设置）。\n- **计算会话时间戳**：此功能启用 TCP 时间戳选项的计算。\n- **首先尝试启发式子解析器**：在使用注册到特定端口的子解析器之前，先尝试使用启发式方法对数据包进行解码。\n\
  - **在摘要中忽略 TCP 时间戳**：忽略 TCP 头中的时间戳选项。\n- **对错误数据包不调用子解析器**：此选项不分析错误的 TCP 数据包。\n\n\
  #### 工作原理...\n\nTCP 偏好设置中有一些参数我想多说几句。\n\n关于**相对序列号**，当你查看一个 TCP 连接时，你会发现它总是以等于零的序列号开始。这些是\
  \ Wireshark 归零后的相对数字。真实数字是 TCP 进程选取的 0 到 2^32 之间的数字，这些数字难以跟踪。TCP 标准没有为此数字的选取设定任何规则。\n\
  \n**计算会话时间戳**指的是 TCP 数据包的时间戳选项。TCP 时间戳选项携带两个 4 字节的时间戳字段，如下图所示：\n\n![](img/da40f92928403866599198344271d63e_678_0.png)\n\
  \n时间戳选项要解决的问题是 TCP 对延迟变化的敏感性。解决方案（如 RFC 1323 所述）是以下列方式使用 TCP 选项（对于每个 TCP 连接）：\n\n\
  - 发送方在每个发送的数据段中放置一个时间戳（Tsval 字段）\n- 接收方在 ACK 段中反映这些时间戳（Tsecr 字段）\n\n然后，通过一次减法，发送方即可为每个\
  \ ACK 段获得准确的 RTT 测量值（对于一个合理的接收方，这将对应于每隔一个数据段）。这种机制称为**往返时间测量（RTTM）**。\n\n#### 更多内容...\n\
  \nUDP 是一种非常简单的协议，其头部也非常简单，只包含四个字段：源端口、目的端口、数据包长度和校验和。接收方使用校验和来检查是接受数据包还是丢弃它。如果数据包被丢弃，则没有恢复机制。在某些情况下，应用程序会恢复它（例如，DNS\
  \ 会再次发送请求），而在某些情况下则不会。\n\nTCP 则更复杂。它是一种面向连接的可靠协议，具有排序机制、流量控制和拥塞控制。这些主题将在本章后面讨论。\n\
  \nSCTP 是一种可靠的、面向连接的协议，允许每个连接传输多个流，可选地将多个用户消息捆绑到单个 SCTP 数据包中，支持 cookie、多归属和其他机制。它最初是为在蜂窝网络中传输信令消息而开发的，后来与其他应用协议一起实现。\n\
  \n## TCP 连接问题\n\n当两个 TCP 进程希望通信时，它们会打开连接，发送数据，然后关闭连接。当你打开浏览器访问互联网、从邮件客户端连接到邮件服务器，或通过\
  \ Telnet 连接到路由器或任何其他基于 TCP 工作的应用程序时，都会发生这种情况。\n\n当 TCP 打开连接时，它会从源端口向目的端口发送一个打开连接的请求。\n\
  \n在应用程序的建立或关闭过程中可能会出现一些问题。使用 Wireshark 来定位和解决这些问题是本操作指南的目标。\n\n### 准备工作\n\n如果你遇到以下问题之一，请使用\
  \ Wireshark 来找出原因。\n\n这些问题可能有很多类型。其中包括：\n\n- 你尝试运行一个应用程序，但它不工作。你尝试浏览互联网，但没有得到任何响应。\n\
  - 你尝试使用邮件，但无法连接到邮件服务器。\n- 问题可能由简单的原因导致，例如服务器宕机、应用程序未在服务器上运行，或者通往服务器的网络在某处中断。\n-\
  \ 问题也可能由更复杂的原因导致，例如 DNS 问题、服务器内存不足导致无法连接（例如，由于应用程序占用内存过高）、IP 地址重复，以及许多其他原因。\n\n\
  在本操作指南中，我们重点关注这些通常很容易解决的“可行/不可行（GO/NO-GO）”问题。\n\n\n\n\n## 如何操作...\n\n在这里你将看到一些指示，以及当你使用\
  \ Wireshark 调试 TCP 连接问题时可以看到的内容。通常这些问题表现为尝试运行一个应用程序却得不到任何结果。\n\n当你尝试运行一个应用程序时，例如数据库客户端、邮件客户端、观看摄像机服务器等等，并且没有得到任何输出，请按照以下步骤操作：\n\
  \n- 1. 验证服务器和应用程序是否正在运行。\n- 2. 验证你的客户端是否正在运行，你是否已配置 IP 地址（手动或通过 DHCP），并且已连接到网络。\n\
  - 3. Ping 服务器并验证你是否能够连接到它。\n\n## 提示\n\n在某些情况下，你无法 Ping 到服务器，但仍然可以连接到应用程序。这可能是因为防火墙阻止了\
  \ ICMP 消息，因此如果你无法 Ping 到某个目标，并不一定意味着有问题。防火墙可能是网络中的专用设备，也可能是安装在终端设备上的 Windows（或 Linux/UNIX）防火墙。\n\
  \n- 4. 在捕获文件中，查找以下其中一种模式：\n  - 三个 SYN 消息且没有响应（在下面的截图中）\n  - SYN 消息收到重置（RST）响应\n\n\
  在两种情况下都可能是防火墙阻止了特定应用程序，或应用程序未运行。\n\n在下面的截图中，我们看到一个简单的案例，我们根本无法访问 web 服务器 81.218.31.171（数据包\
  \ 61、62 和 63）。这可能是因为防火墙不允许访问，或服务器本身存在问题。我们也可以看到我们已连接到另一个网站（108.160.163.43，数据包 65、66\
  \ 和 67），因此连接问题仅针对 81.218.31.171。\n\n![](img/da40f92928403866599198344271d63e_683_0.png)\n\
  \n在下一张截图中，我们看到同一种情况的稍微复杂一些的案例。在这种情况下，我们有一个客户想要登录并在远程站点观看摄像机的摄像机服务器。摄像机服务器的 IP 地址为\
  \ 135.82.12.1，问题是客户能够获取服务器的主网页和登录窗口，但无法登录系统。在下面的截图中，我们可以看到我们打开了到 IP 地址 135.82.12.1\
  \ 的连接。我们看到 TCP 连接已打开到 HTTP 服务器，一开始看起来没有连接问题：\n\n![](img/da40f92928403866599198344271d63e_683_1.png)\n\
  \n问题出现时我们过滤所有发往 IP 地址 135.82.12.1 的流量，也就是摄像机服务器。\n\n在这里我们看到，当我们尝试连接到 TCP 端口 6036\
  \ 时，我们收到 RST/ACK 响应，这可能是：\n\n- - 阻止端口 6036 的防火墙（这里就是这种情况）\n- - 当配置了端口地址转换（PAT）时，我们仅转换端口\
  \ 80\n\n而不是 6036\n\n- - 用户名和密码的身份验证在 TCP 端口 6036 上进行，防火墙仅允许端口 80，身份验证被阻止，应用程序无法工作\n\
  \n![](img/da40f92928403866599198344271d63e_684_0.png)\n\n总之，当你无法连接到服务器时，请检查服务器和客户端是否已在整个网络中转发所有\
  \ TCP/UDP 端口，以及是否存在你不知道的端口。\n\n## 提示\n\n在某些情况下，当你在网络中安装新应用程序时，最好在客户端和服务器上连接 Wireshark，并检查它们之间实际运行了什么。软件公司并不总是告诉你他们在网络上传输了什么（有时是因为他们自己也不知道！），防火墙可能会阻止你并不知情的信息。\n\
  \n服务器收到的窗口大小。\n\n在 TCP 头部的选项字段中，我们有以下主要选项：\n\n- - **最大报文段长度（MSS）**：这是 TCP 数据报的最大大小，即从\
  \ TCP 头部开始到整个数据包末尾的字节数。\n- - **窗口大小（WSopt）**：该因子与 TCP 头部中的窗口大小字段相乘，以通知接收方更大的缓冲区大小。由于头部中的最大窗口大小为\
  \ 64 KB，因子为 4 时可得到 64 KB 乘以 4，即 256 KB 的窗口大小。\n- - **SACK**：选择性确认是一种选项，使连接的双方能够确认特定数据包，因此当单个数据包丢失时，只会重新发送该数据包。连接建立时，双方必须就\
  \ SACK 达成一致。\n- - **时间戳选项（TSopt）**：该参数已在本章前面解释过，指的是客户端与服务器之间延迟的测量。\n\n到此阶段，双方：\n\
  \n- - 同意建立连接\n- - 知道对方的初始序列号\n- - 知道对方的窗口大小\n\n## 提示\n\n在建立连接时，任何不是完整的三次握手的情况都应被视为问题。这包括\
  \ SYN 没有响应、SYN 然后 SYN/ACK 但没有最后的 ACK、SYN 被重置（RST 标志等于 1）应答等等。\n\n## TCP 重传 – 它们来自哪里以及为什么\n\
  \n当 TCP 发送一个数据包或一组数据包（请参阅后面的“工作原理…”部分）时，它会等待确认以确认这些数据包已被接受。重传显然是由于数据包未到达，或确认未及时到达而发生的。这可能有各种原因，找到原因就是本菜谱的目标。\n\
  \n## 准备工作\n\n当你发现网络变慢时，重传可能是原因之一。将 Wireshark 连接到可疑客户端或服务器的端口镜像上，并观察结果。\n\n在本菜谱中，我们将看到使用\
  \ Wireshark 遇到的一些常见问题，以及它们所表示的含义。\n\n## 如何操作...\n\n让我们开始：\n\n- 1. 在相关接口上开始捕获数据。\n\
  - 2. 进入 **Analyze | Expert Info** 菜单。\n- 3. 在 **Notes** 下，查找 **Retransmissions**。\n\
  - 4. 你可以点击 (+) 标志，重新传输列表将会打开。单击每一行，数据包捕获窗格中将显示重传。\n- 5. 现在是重要的问题：如何定位问题。\n\n###\
  \ 提示\n\n当你通过通信线路、服务器接口、互联网链路或任何其他线路捕获数据包时，你可能会有来自许多 IP 地址、许多应用程序的流量，甚至每个应用程序上的特定过程，例如访问数据库应用程序中的特定表。这里重要的是要定位发生重传的\
  \ TCP 连接。\n\n- 6. 你可以通过以下方式查看重传来自哪里：\n  - 在 **Expert Info** 窗口中逐个移动数据包，并查看它在数据包捕获窗格中带你到哪些数据包（适合有经验的用户）\n\
  \  - 在数据包窗格中，配置显示过滤器 `expert.message == \"Retransmission (suspected)\"`，你将获得捕获文件中的所有重传\n\
  \  - 应用过滤器后，然后在 **Statistics à Conversations** 窗口的右下角检查 **Limit to display filter**\
  \ 部分\n\n### 案例 1 – 对多个目标的重传\n\n在下面的截图中，你可以看到我们有许多重传，分散在多个服务器之间，目标端口为 80（HTTP）。我们还可以从这里看到\
  \ `10.0.0.5` 端口发送了重传，因此数据包在前往互联网的途中丢失了，或来自 web 服务器的确认未及时返回。\n\n![](img/da40f92928403866599198344271d63e_691_0.png)\n\
  \n好吧，显然互联网线路上出了问题。我们怎么知道是什么问题？\n\n- 1. 从 **Statistics** 菜单打开 **IO Graph**。\n- 2.\
  \ 在这种情况下（案例 1），我们看到线路几乎是空的。可能是一个错误，或前往互联网的另一条负载线路。\n- 3. 你可以通过登录通信设备或使用任何 SNMP 浏览器（当设备上配置了\
  \ SNMP 代理时）来检查导致数据包丢失的丢包和错误。参考以下截图：\n\n\n\n![](img/da40f92928403866599198344271d63e_692_0.png)\n\
  \n## 案例 2 – 单个连接上的重传\n\n如果所有重传都发生在单个 IP 和单个 TCP 端口号上，则说明这是一个运行缓慢的应用。我们可以在下面的截图中看到这一点：\n\
  \n对于单连接上的重传，请执行以下步骤：\n\n- 1. 我们也可以通过从“统计”菜单打开“会话”，并勾选“限制为显示过滤器”复选框来验证这一点；这样我们将获得所有存在重传的会话，在本例中是一个单独的会话。\n\
  - 2. 如下面的截图所示，选择 IPv4 选项卡，我们将看到重传来自哪些 IP 地址：\n- 3. 如下面的截图所示，选择 TCP 选项卡，我们将看到重传来自哪些端口号（或应用）：\n\
  \n![](img/da40f92928403866599198344271d63e_693_0.png)\n\n![](img/da40f92928403866599198344271d63e_693_1.png)\n\
  \n![](img/da40f92928403866599198344271d63e_694_0.png)\n\n要隔离问题，请执行以下步骤：\n\n- 1.\
  \ 查看 IO 图，并确保线路不繁忙。\n\n### 提示\n\n通信线路繁忙的迹象是，线路的 IO 图呈现一条非常接近线路最大带宽的直线。例如，如果你有一条\
  \ 10 Mbps 的通信线路，你对其进行端口镜像，并在 IO 图中看到一条接近 10 Mbps 的直线，这就是线路负载过重的明显迹象。一条不繁忙的通信线路会有许多起伏、峰值和空闲间隔。\n\
  \n- 2. 如果线路不繁忙，那么问题可能出在 IP 地址 10.1.1.200 的服务器上（10.90.30.12 正在发送大部分重传，因此可能是 10.1.1.200\
  \ 响应缓慢）。\n- 3. 从数据包窗格中我们看到该应用是 FTP-DATA。FTP 服务器可能以主动模式工作。因此，我们在一个端口（2350）上打开了连接，而服务器将端口更改为\
  \ 1972，所以这可能是一个缓慢且无响应的 FTP 软件（最终这里的问题正是如此）。\n\n## 案例 3 – 重传模式\n\n在 TCP 重传中，需要注意的一个重要事项是，重传是否具有你可以看到的某种模式。\n\
  \n在下面的截图中，我们看到所有重传都来自单个连接，即单个客户端与服务器上的 NetBIOS 会话服务（TCP 端口 139）之间。\n\n这看起来像一个简单的服务器/应用问题，但当我们查看数据包捕获窗格时，会看到一些有趣的现象（参见下面的截图）：\n\
  \n总共 251 次重传\n\nNetBIOS – SSN（会话服务）\n\n所有重传都在单个连接上\n\n重传之间相隔 30-35 毫秒\n\n有趣的是，当我们查看重传的模式时，会发现它们每\
  \ 30 毫秒周期性地发生。这里的时间格式是秒，因为前面是通信线路延迟的信息。请参阅“工作原理……”一节，了解其应有的样子。\n\n- 2. 检查延迟变化，延迟变化可能由以下原因导致：\n\
  \n  - 延迟可能由不稳定的或繁忙的通信线路导致。在这种情况下，使用 Ping 命令会看到延迟变化。通常这种情况会发生在带宽较窄的线路上，在某些情况下也会发生在蜂窝线路上。\n\
  \  - 延迟可能由负载过重或效率低下的应用导致。在这种情况下，你只会看到该特定应用上出现大量重传。\n  - 延迟可能由负载过重的通信设备（CPU 负载、缓冲区负载等）导致。你可以通过直接访问通信设备来检查这一点。\n\
  - 3. 使用第 13 章“排查带宽和延迟问题”中介绍的 Wireshark 工具。\n\n### 提示\n\n关于 TCP 重传，最重要的是：只要重传数量不是太多，重传就是\
  \ TCP 的一种自然行为。当重传率在 0.5% 左右时，性能开始下降；当重传率在 5% 左右时，开始出现断开连接。这还取决于应用及其对重传的敏感程度。\n\n\
  ## 找出问题所在\n\n当你在通信链路（到互联网、服务器上、站点之间或任何其他链路）上看到重传时，请执行以下操作：\n\n- 1. 定位问题——是特定的 IP\
  \ 地址、特定的连接、特定的应用，还是其他问题。\n- 2. 检查问题是否由通信链路、数据包丢失、服务器或 PC 缓慢导致。检查应用是否运行缓慢。\n- 3.\
  \ 如果并非由上述任何原因导致，请检查延迟变化。\n\n## 工作原理……\n\n让我们看看 TCP 的正常运行方式，以及可能出现的问题的原因。\n\n## TCP\
  \ 序列/确认机制的常规操作\n\nTCP 内置的机制之一是重传机制。该机制能够恢复损坏、丢失、重复或乱序传送的数据。\n\n这是通过为每个传输的字节分配一个序列号，并期望接收方返回确认（ACK）来实现的。如果在超时间隔内未收到\
  \ ACK，则重传数据。\n\n在接收端，使用序列号来验证信息是否按发送顺序到达。如果不是，则将其重新排列到原来的状态。\n\n该机制的工作方式如下：\n\n\
  - 1. 在建立连接时，双方告知对方自己的初始序列号。\n- 2. 发送数据时，每个数据包都有一个序列号。序列号表示 TCP 负载中第一个字节的编号。发送的下一个数据包将具有前一个数据包的序列号加上前一个数据包中的字节数，再加一（见下一个截图）。\n\
  - 3. 当发送数据包时，RTO（重传超时）计数器开始从发送时刻起计时。\n\n### 提示\n\n重传超时定时器基于 Van Jacobson 拥塞避免和控制算法，该算法基本上说明\
  \ TCP 能够容忍高延迟，但不能容忍快速的延迟变化。\n\n- 4. 当接收方收到数据包时，它会回复一个 ACK（确认）数据包，告诉发送方发送下一个数据包。在下面的截图中，你将看到其工作方式：\n\
  \  1. 你可以从这里看到，10.0.0.7 正在从 62.219.24.171 下载文件。该文件通过 HTTP 下载（Wireshark 窗口已配置为从“编辑\
  \ | 首选项”的列配置中显示 tcp.seq 和 tcp.ack，如第 1 章“Wireshark 简介”中所述）。\n\n![](img/da40f92928403866599198344271d63e_699_0.png)\n\
  \n- 2. 你可以从这里看到，`62.219.24.171` 发送一个序列号为 `120185105` 的数据包，然后发送一个序列号为 `120186557`\
  \ 的数据包。当收到这两个数据包时，客户端 `10.0.0.7` 告诉服务器发送下一个数据包，ACK = `120188009`，之后服务器发送序列号为 `120188009`\
  \ 的数据包，再下一个数据包的序列号为 `120189461`，依此类推。\n\n你可以看到它的示意图。\n\n![](img/da40f92928403866599198344271d63e_699_1.png)\n\
  \n## 什么是 TCP 重传，它们会导致什么\n\n当数据包确认丢失，或 ACK 未按时到达时，发送方将执行两件事：\n\n- 1. 按照本方案前面所述，再次发送数据包。\n\
  - 2. 降低吞吐量。\n\n在下一个截图中，我们看到了重传会降低发送方吞吐量的示例（为清晰起见添加了红色细线）：\n\n![](img/da40f92928403866599198344271d63e_700_0.png)\n\
  \n## 更多内容……\n\nTCP 能够容忍高延迟，只要这些延迟相当稳定即可。定义 TCP 在延迟变化下的行为（除其他作用外）的算法被称为 Van Jacobson\
  \ 算法（以其发明者的名字命名）。Van Jacobson 算法允许容忍高达平均延迟 3-4 倍的延迟，因此例如，如果你的延迟为 100 毫秒，TCP 将容忍高达\
  \ 300-400 毫秒的延迟，只要这些延迟不频繁变化。\n\n\n\n\n\n## 参见\n\n你可以查看 Van Jacobson 算法，网址为 http://ee.lbl.gov/papers/congavoid.pdf。\n\
  \n## 重复 ACK 与快速重传\n\n你会在 TCP 中看到的另一个现象是所谓的重复 ACK 和快速重传。这一现象同样由性能问题引发，在本节中，我们将重点讨论如何发现它们以及它们所指示的问题。\n\
  \n### 准备工作\n\n当你发现网络变慢时，重复 ACK 可能是原因之一。将 Wireshark 连接到端口镜像上，将其接入可疑的客户端或服务器，然后查看结果。\n\
  \n### 操作步骤...\n\n在大多数情况下，重复 ACK 的产生是因为高延迟、延迟抖动，或某个端点响应缓慢，根本未对 ACK 请求作出回应。\n\n在查找通信缓慢的原因时，重复\
  \ ACK 可能是原因之一。\n\n- 1. 当你看到数量合理的重复 ACK（例如 1% 或 2%）时，这可能不是你的问题。\n- 2. 当你看到大量重复 ACK（比如十个）时，你可能遇到了：\n\
  \  - 一条非常繁忙的通信线路，导致延迟变化\n  - 无响应的服务器或客户端（取决于谁未响应）\n- 3. 快速重传是针对重复 ACK 而发送的数据包。\n\
  - 4. 在下面的截图中，你会看到该问题的一个示例。在该示例中，你可以看到在收到 51 个 DupACK（重复 ACK）后发送了一个快速重传数据包：\n\n![](img/da40f92928403866599198344271d63e_705_0.png)\n\
  \n- 5. 以下是解决该问题的方法：\n  - 如果重复 ACK 和重传的数量较少（低于 1%），则可以容忍。\n  - 当这种情况发生在蜂窝网络或无线网络中，或发生在互联网连接上时，延迟和延迟变化在这些网络中很常见，因此你实际上无能为力。\n\
  \  - 如果这种情况发生在你所在组织的网络中，则可能是一个问题。如果是在局域网中，请检查严重问题，例如交换机缓冲区和 CPU 负载。\n\n### 工作原理...\n\
  \n当检测到某个数据包丢失（未收到预期的序列号）或收到意外的序列号时，就会产生重复 ACK。在这种情况下，接收方会生成一个 ACK，指示它希望接收的下一个预期序列号。接收方将持续生成\
  \ ACK 请求缺失的报文段，直到收到它为止。\n\n在发送端，当它收到三个具有相同值的相同 ACK（原始 ACK 和两个重复 ACK）时，它会假定发生了数据包丢失，并重新发送丢失的数据包，无论\
  \ RTO 是否已过期。重新发送的数据包称为快速重传。\n\n重复 ACK 还会降低网络上传输的吞吐量。吞吐量降低多少取决于 TCP 版本。在早期版本的 TCP（即\
  \ Tahoe、Reno 和 New-Reno）中，其思路是：一旦出现重复 ACK，发送方就将吞吐量降低到之前的一半。如果出现大量 DupACK，吞吐量将降至最低。\n\
  \n在下面的截图中，你会看到由重复 ACK 和重传所导致问题的典型示例：\n\n![](img/da40f92928403866599198344271d63e_708_0.png)\n\
  \n在此截图中，我们看到首先重复 ACK 将吞吐量降低到之前的大约 40%，然后重传将其降至最低。\n\n### 扩展阅读...\n\n重复 ACK 中使用的机制称为快速恢复。近年来，出现了一些高级\
  \ TCP 版本，尤其是针对蜂窝网络的版本，以改善 TCP 在高延迟和变化延迟条件下的行为。在这些示例中，你可能会看到发送方和接收方行为的一些差异，例如性能下降较轻、恢复速度较快等。尽管如此，TCP\
  \ 的特征行为仍然得以保留。\n\n## TCP 乱序数据包事件\n\n你会在网络中看到的另一个现象是**前一段丢失**和**乱序报文段**。两者都与数据包乱序到达有关，在某些情况下表明存在问题。\n\
  \n当你在网络连接上看到此现象时，可能是由网络问题或捕获中断引起的。在本节中，我们将重点讨论这一问题及其可能导致的后果。\n\n### 准备工作\n\n启动 Wireshark，并将其连接到镜像端口上。本节中我们要重点关注的三个现象是：\n\
  \n- - **前一段丢失**：当一个数据包到达时，其序列号高于该连接上预期的下一个序列号，表明被标记的数据包之前的一个或多个数据包未到达。\n- - **乱序数据包**：当一个数据包的序列号低于该连接上先前收到的数据包时，就会出现此情况。\n\
  - - **前一段未捕获**（Wireshark 1.8.x 及更高版本）：这与前一段丢失类似。\n\n### 操作步骤...\n\n#### 何时会发生？\n\
  \n你可能会在以下事件中看到这些情况：\n\n- - **在捕获开始时：** 当你在一个已建立的连接上开始捕获时，会发生此事件。在这种情况下，你会在连接上看到没有\
  \ SYN/SYN-ACK/ACK 的数据包，因此 Wireshark 会认为出现了问题。\n- - **真实的数据包丢失：** 在这种情况下，你还会看到丢失数据包的重传和/或重复\
  \ ACK，告知发送方重新发送丢失的数据包。\n\n![](img/da40f92928403866599198344271d63e_712_0.png)\n\n\
  在上面的截图中，我们看到了一个严重数据包丢失的典型示例。这里我们看到 10.0.0.6 正在尝试浏览网站 62.90.90.210。在此期间，1420 字节的\
  \ TCP 报文段被发送到 Web 服务器，我们看到在报文段 334 和 336 之间丢失了三个数据包，在报文段 338 和 340 之间丢失了两个数据包。在这两种情况下，Wireshark\
  \ 都会提示：**TCP 的前一报文段未被捕获。**\n- - **延迟变化：** 这可能是由于数据包从源到目的地经过不同路由所致。要检查这一点，请使用 Tracert，并查看源和目的地之间的路由变化（如果发生在组织网络中），例如，你可以在路由器上配置陷阱，以便在发生这种情况时通知你。\n\
  - - **数据捕获问题：** 数据包可能已被正确发送和接收，但 Wireshark 未能捕获到它们。这可能是由各种原因导致的：\n  - 由于流量非常大，Wireshark\
  \ 可能会在高比特率（超过 150-180 Mbps）下丢失数据包。为避免此问题，请使用其他工具（大多是商业工具）。\n  - 如果你的笔记本电脑性能不够强，内存或\
  \ CPU 不足会导致 Wireshark 无法足够快地工作。这一点很容易发现，而且你可能已经意识到了。\n\n- - 当局域网交换机上的端口缓冲区过小时，数据包可能会被丢弃。连接到交换机（通过控制台或\
  \ Telnet 连接），并使用交换机命令行检查该问题。\n- - 在无线网络上捕获数据时，由于某种原因，你无法看到所有已发送的数据包。请参阅[第 7 章](Chapter\
  \ 7)，以太网、局域网交换和无线局域网。\n\n### 工作原理...\n\n在这种情况下，事情很简单。TCP 发送方将数据包发送给接收方。这些数据包按字节编号。当一个数据包未按顺序到达时，Wireshark\
  \ 就会注意到这是一个问题。我们可能有两个原因：\n\n- - **真实问题**：在这种情况下，你会看到重传和重复 ACK，这是 TCP 对乱序接收数据包的响应\n\
  - - **捕获问题**：在这种情况下，你只会看到乱序数据包，并且由于你看不到对疑似丢失和乱序数据包的任何响应，它们可能实际上并未丢失\n\n\n\n\n\n\
  ## 准备工作\n\n使用端口镜像将 Wireshark 连接到可疑的链路或服务器，并开始捕获。\n记录捕获窗口中出现的每个窗口消息。\n\n## 如何操作...\n\
  \n有几种类型的窗口消息你应该注意：\n\n### TCP Zero Window、Zero Window Probe 和 Zero Window Violation\n\
  \nTCP Zero Window 在接收方通告的接收窗口大小为零时发生（在 TCP 头部的 window 字段中）。这告诉发送方停止发送数据，因为接收方的缓冲区已满。这表明接收方存在问题，可能是：\n\
  \n- 内存分配不足的弱服务器\n- 应用程序未接收到足够缓冲区的问题，因此 TCP 必须告诉发送方停止发送数据\n- 应用程序消耗内存过多，导致操作系统限制应用程序资源\n\
  \nTCP **Zero Window Probe** 是发送方发送的消息，用于查看接收方的 Zero Window 条件是否仍然存在。该消息通过向接收方发送下一个数据字节来工作。如果接收方仍以窗口为零作出回应，发送方会在再次探测前将计时器加倍。\n\
  \n发送方忽略接收方的 Zero Window 条件并发送额外的字节数据。TCP Zero Window Violation 可以指示 TCP 错误或协议栈中的\
  \ bug。\n\n为了检查问题所在，请检查这些事件是否来自：\n\n- 特定的终端设备（服务器或客户端），这将表明终端设备存在问题。\n- 特定应用程序中的问题，这将表明存在通用应用程序问题。\n\
  - 当你在应用程序中执行特定操作时出现问题，例如打开特定表、向打印机发送文件、创建报表或应用程序中的任何其他操作。在这种情况下，当然是应用程序问题。\n\n###\
  \ TCP Window Update\n\nTCP 向连接的另一端发送 Window Update，以指示其已更改缓冲区大小，并且准备好接受更高或更低的数据速率（缓冲区大小决定发送方被允许发送的吞吐量）。这可能发生在以下情况：\n\
  \n- TCP 接收方从 Zero Window 条件中恢复，并要求发送方重新开始发送数据。在这种情况下，你无需做任何事，只需检查导致第一次 Zero Window\
  \ 的问题即可。\n- TCP 接收方频繁更改窗口大小。在这种情况下，检查是什么干扰了接收方。它可能是应用程序问题、内存问题，或终端设备上的任何其他性能问题。\n\
  \n如果你看到这种现象，无需担心。这是 TCP 的工作方式。\n\n## TCP Window Full\n\n此消息表明发送的数据包将完全填满接收方的接收缓冲区。这会在接收方尚未发送任何确认先前数据接受的\
  \ ACK 的情况下发生，因此这将是发送方在接受接收方 ACK 之前发送的最后一个数据包。\n\n在接收方，收到此数据包的瞬间，它将向发送方发送 Zero Window\
  \ 消息，从而停止发送数据。\n\n此事件触发的原因与触发 Zero Window 的原因相同。它只是对无响应的服务器或应用程序的指示。一个典型示例显示在以下屏幕截图中：\n\
  \n![](img/da40f92928403866599198344271d63e_718_0.png)\n\n在前面的屏幕截图中我们看到：\n\n- 1.\
  \ 数据包 183816，192.168.2.138 告诉 192.168.1.58 发送方窗口是\n\n## 它是如何工作的...\n\nTCP Sliding\
  \ Window 机制的工作方式如下：\n\n- 1. 连接建立后，发送方向接收方发送数据，填满接收方窗口。\n- 2. 发送若干数据包后，接收方向发送方发送\
  \ ACK，确认其已接受发送的字节。发送 ACK 会清空接收方窗口。\n- 3. 当发送方填满窗口时，接收方清空窗口并发送信息确认，此过程是连续的。\n- 4.\
  \ 增加接收方窗口大小会告诉发送方提高吞吐量，减少它会告诉发送方降低吞吐量。它根据以下 WS/RTT 规则工作（根据 TCP 版本有所变化）：\n\n![](img/da40f92928403866599198344271d63e_720_0.png)\n\
  \n## 更多内容...\n\n你也可以使用 TCP 吞吐量图和 IO 图来查看这些问题。在 TCP 吞吐量图中，使用 TCP trace 图，其中上线表示窗口大小，其与下线的距离表示窗口左侧的内容。两者之间没有距离表示\
  \ Zero Window。\n\n![](img/da40f92928403866599198344271d63e_721_0.png)\n\n线条之间固定的距离（如前面的屏幕截图所示）表示接收方正常运行。当线条越来越靠近时，表示发送方压倒了接收方。只要线条不重叠，TCP\
  \ 将继续发送数据。\n\n## TCP 重置及其发生原因\n\n在正常操作期间，TCP 将使用 SYN 信号打开连接，并使用 FIN 信号关闭连接。TCP 的一个特点是由于问题或为了提高效率，可以更快地关闭连接。\n\
  \n在本配方中，我们将描述这些情况，以及如何准确理解发生了什么，以及它是否属于正常情况或出了问题。\n\n## 准备工作\n\n使用端口镜像将 Wireshark\
  \ 连接到可疑的链路或服务器，并开始捕获。记录捕获窗口中出现的每个窗口消息。TCP 重置可以在多种情况下发送。有些指向协议的正常工作，有些则表明存在故障或问题。在本配方中，我们将了解其原因，并尝试指出问题以及如何解决它们。\n\
  \n## 如何操作...\n\nReset 是 TCP 发送的信号，用于告诉接收方中断连接。Reset 是通过将 RST 标志设置为 1 发送的。\n\n##\
  \ 重置不是问题的案例\n\nTCP 中关闭连接的标准方式是通过 FIN 和 FIN-ACK 信号。问题是，为了关闭连接，你需要四个数据包：来自一方的 FIN/ACK\
  \ 和 ACK，以及来自另一方的相同数据包。例如，当你打开一个标准网页时，可能打开数十个连接（主页面、新闻栏、广告、定期更新的图片等），为了关闭所有这些连接，你将需要数百个\
  \ FIN 和 FIN-ACK 数据包的标准方式。为了防止这种情况发生，Web 服务器在许多情况下会向你发送请求的数据，然后通过重置中断连接。这是标准做法，取决于应用程序。\n\
  \n## 重置可能表明问题的案例\n\n在某些情况下，重置可能表明存在问题（不一定是通信问题）：\n\n- 由防火墙发送的重置：当你尝试打开到远程服务器的连接且未得到任何响应时，你可能会看到返回的\
  \ RST 信号。这是防火墙阻止连接。在下一个屏幕截图中，你可以看到每个发送的 SYN 都被 RST 回复。\n\n![](img/da40f92928403866599198344271d63e_724_0.png)\n\
  \n- 由于某一方出现问题而发送的重置：这里可能有许多原因。其中一些如下：\n\n- 一个原因是连续五次重传未被 ACK 回复。当发送方对重传没有任何回复时，它将向另一方发送重置信号，告诉其中断连接。\n\
  - 另一个原因是连接在几分钟内没有任何流量（几分钟是多少取决于操作系统的默认值）。通常打开连接的一方会发送重置（通常但不总是，取决于实现）。\n\n\n\n\n\
  \n## 如何工作...\n\n这里很简单。Reset 是一个用于断开连接的信号。这里需要记住的是，一切都取决于应用程序。如果程序员选择在特定情况下发送 RST，那么这就是你在捕获文件中会看到的内容。对于你看到的每个重置，尝试弄清楚导致它的原因，你就能从重置发送前的包中理解它。\n"
- "## 第10章. HTTP 和 DNS\n\n在本章中，我们将学习以下配方：\n\n- 过滤 DNS 流量\n- 分析常规 DNS 操作\n- 分析 DNS\
  \ 问题\n- 过滤 HTTP 流量\n- 配置 HTTP 首选项\n- 分析 HTTP 问题\n- 导出 HTTP 对象\n- HTTP 流程分析和 Follow\
  \ TCP Stream 窗口\n- 分析 HTTPS 流量 – SSL/TLS 基础\n\n### 引言\n\n**域名系统 (DNS)** 是一种用于将名称解析为\
  \ IP 地址的协议。它在你浏览网站时通过互联网使用，然后 DNS 将 Web 服务器名称解析为 IP 地址。它也在企业网络中使用，用于查找服务器名称并将其翻译为\
  \ IP 地址。\n\n**超文本传输协议 (HTTP)** 和 **安全 HTTP (HTTPS)** 都用于浏览互联网，或连接到组织内部或云中托管的其他软件。HTTPS\
  \ 在使用 SSL/TLS 保护 HTTP 以隐藏明文数据交换不被黑客窃取时使用。它在连接你的银行、网络邮件账户（例如 Gmail 或 Hotmail）或任何其他安全应用程序时使用。\n\
  \n在本章中，我们将讨论这些协议，它们的工作原理，以及如何使用 Wireshark 来查找其中的常见错误和问题。\n\n### 过滤 DNS 流量\n\nDNS\
  \ 是一种负责将名称解析为 IP 地址的协议。在本配方中，我们将学习如何过滤与 DNS 服务相关的<|message|>重要参数。\n\n#### 准备工作\n\
  \n当怀疑网络问题时，对怀疑的服务器进行端口镜像或在服务器上安装 Wireshark，然后开始捕获数据。\n\n#### 如何操作...\n\n有一些常见的过滤器可以帮助你排查\
  \ DNS 问题。常见的显示过滤器如下所示：\n\n- 基本过滤器仅用于过滤 DNS 流量。过滤器为 `dns`。\n  - 用于仅过滤 DNS 查询，我们有\
  \ `dns.flags.response == 0`\n  - 用于仅过滤 DNS 响应，我们有 `dns.flags.response == 1`\n\n\
  ![](img/da40f92928403866599198344271d63e_731_0.png)\n\n- 用于过滤错误代码，我们有以下过滤器：\n  -\
  \ 无错误 (rcode—回复代码)，我们有 `dns.flags.rcode == 0`，在以下截图中标记\n  - 无此名称，我们有 `dns.flags.rcode\
  \ == 3`\n\n![](img/da40f92928403866599198344271d63e_732_0.png)\n\n- 用于搜索问题，我们有以下过滤器：\n\
  \  - **当查找特定 URL 时：** 例如，当你不确定你的 PC 是否发送了 DNS 查询时，使用 `dns.qry.name == \"URL Name\"\
  `\n  - 当查找包含特定 URL 的查询时：对于这种情况我们有 `dns.qry.name contains \"URL Name\"`\n- 用于过滤 DNS\
  \ 操作码（标准查询或其他请求或通知），我们有以下过滤器：\n  - 仅过滤标准查询：`dns.flags.opcode == 0`\n  - 仅过滤反向查询：`dns.flags.opcode\
  \ == 1`\n  - 过滤服务器状态请求：`dns.flags.opcode == 2`\n  - 过滤区域更改通知：`dns.flags.opcode ==\
  \ 4`\n  - 过滤动态更新：`dns.flags.opcode == 5`\n\n![](img/da40f92928403866599198344271d63e_733_0.png)\n\
  \n- 用于查询查询类型（递归/非递归）：\n  - 对于递归查询我们有 `dns.flags.recdesired == 1`\n  - 对于非递归查询我们有\
  \ `dns.flags.recdesired == 0`\n\n![](img/da40f92928403866599198344271d63e_733_1.png)\n\
  \n所有其他显示过滤器可以通过单击 Wireshark 窗口顶部显示过滤器窗口右侧的表达式按钮找到。\n\n#### 如何工作...\n\n显示过滤器在 [第\
  \ 3 章](#) 中有深入描述，*使用显示过滤器*。如 [第 3 章](#) 中所述，*使用显示过滤器*，你可以执行以下操作之一来过滤 DNS 参数：\n\n\
  - 单击显示过滤器窗口右侧的表达式按钮，并从 DNS 中选择所需的过滤器\n- 进入数据包详细信息，右键单击所需字段，然后选择 **应用过滤器** 或 **准备过滤器**\n\
  - 直接在 Wireshark 窗口顶部的过滤器窗口中写入过滤器字符串\n\n#### 还有更多...\n\nDNS 是一个相当复杂的协议，本章的目的是提供解决此协议和实现中常见问题的方法。这里没有提到所有过滤器；完整的\
  \ DNS 过滤器列表可以在 [http://www.wireshark.org/docs/dfref/d/dns.html](http://www.wireshark.org/docs/dfref/d/dns.html)\
  \ 找到。\n\n### 分析常规 DNS 操作\n\n在本配方中，我们将了解如何判断 DNS 是否正常工作。我们将看到一些 DNS 操作的场景，以及可能出现什么问题。\n\
  \n#### 准备工作\n\n打开 Wireshark 并开始捕获数据。你应该镜像使用 DNS 的设备，或 DNS 服务器本身。\n\n#### 如何操作...\n\
  \n将 Wireshark 连接到所监控设备附带的 LAN 交换机，并将端口镜像配置到你怀疑问题来自的设备。按以下步骤操作：\n\n1. 在用户投诉的情况下，为监控用户设备配置端口镜像。\n\
  2. 在网络中出现一般问题的情况下，将端口镜像配置到 DNS 服务器：\n   - 当 DNS 服务器配置在内部服务器上时，在服务器上配置端口镜像\n   -\
  \ 当 DNS 服务器配置在外部服务器上时，将端口镜像配置到连接你到互联网的链路\n\n#### 如何工作...\n\nDNS 是用于名称解析的主要协议，它在浏览互联网时使用。它也用于在组织网络中工作。DNS\
  \ 标准描述了三种功能：\n\n- 命名空间，即 DNS 名称的外观以及它们如何分配\n- 名称注册过程，即我们如何注册 DNS 名称以及它们如何通过 DNS\
  \ 服务器网络转发\n- 解析过程，即名称如何解析为 IP 地址\n\n在本配方中，我们将重点关注第三个主题，即当我们浏览互联网、发送或接收电子邮件，或访问组织内部服务器时会发生什么。基本的\
  \ DNS 操作如以下图所示：\n\n#### DNS 操作\n\n用户程序（Web 浏览器、邮件客户端等）通过解析器与 DNS 服务器交互，解析器也是操作系统的一部分。解析器与提供所需\
  \ IP 的外部名称服务器交互（名称服务器可以是本地或远程；它对解析器来说是外部的）。用户查询 DNS 服务器的方式特定于操作系统。DNS 查询和响应在解析器和名称服务器之间发送和接收。\n\
  \n![](img/da40f92928403866599198344271d63e_740_0.png)\n\n本地名称服务器通常位于组织网络中，并与你的 ISP\
  \ 的 DNS 服务器交互。在家庭或小型办公室网络的情况下，你的 DNS 服务器可以配置在连接你到互联网的路由器上，或直接连接到你的 ISP 的 DNS 服务器：\n\
  \n- 当 DNS 服务器位于路由器上时，你查询路由器上的 DNS，路由器查询你的 ISP DNS\n- 当你的 DNS 服务器位于 ISP 网络中时，你直接查询\
  \ DNS 服务器\n\n#### DNS 命名空间\n\nDNS 命名空间基于分层树结构，如下图所示。结构如下：\n\n- 根服务器网络 (http://www.iana.org/domains/root/servers)。\n\
  - 顶级域名服务器网络 (TLDs) (http://www.iana.org/domains/root/db)。\n- 每个顶级域名都有类似于 IANA 管理的名称服务器。顶级域名包含二级域名。TLD\
  \ 是最高级别的服务器，例如下图所示的国家服务器。\n- 二级域名 (SLDs) 包含组织和国家的域名和名称。二级域名中的名称由指定的组织或国家管理。\n\n\
  ![](img/da40f92928403866599198344271d63e_741_0.png)\n\n有一些重要定义，如下图所示：\n\n- 域：它构成\
  \ ndi-com.com 下的所有分支，在本例中为二级域名\n- 区域：它是 DNS 命名空间中 DNS 域的连续部分，其数据库记录存在并在特定 DNS 数据库文件中管理\n\
  \n\n\non one or multiple DNS servers\n\n![](img/da40f92928403866599198344271d63e_742_0.png)\n\
  \n## The resolving process\n\nThere are two reasons for using DNS servers:\n\n-\
  \ The first reason is that it is used for internal communication in your organization.\
  \ In this case, you have a DNS server in your organization, which resolves the IP\
  \ addresses to names in your organization.\n- It is used for connecting to the Internet,\
  \ browsing, sending mails, and so on.\n\nWhen both services are used, you will send\
  \ the DNS query to your organization server, which will send the query to the Internet.\
  \ For example, when you want to get to a local server in your organization, you\
  \ will send a DNS query to the local DNS, and you will get the server IP. When you\
  \ browse a website on the Internet, your local DNS server forwards the request to\
  \ the external DNS, for example, the ISP DNS.\n\nIs it the correct DNS server you\
  \ have configured? Theoretically, when you connect to the Internet, you can configure\
  \ any DNS server in the world. Usually, the best DNS server to use is the nearest\
  \ one. In your organization, you should configure your local DNS as first priority,\
  \ and then the DNS servers of your ISP.\n\nThere are various utilities to check\
  \ the DNS response. Some of them are as follows:\n\n- **Namebench** from Google\
  \ ([http://code.google.com/p/namebench/downloads/detail?name=namebench-1.3.1-Windows.exe&can=2&q=](http://code.google.com/p/namebench/downloads/detail?name=namebench-1.3.1-Windows.exe&can=2&q=))\n\
  - **DNS Benchmark** from GRC ([https://www.grc.com/dns/benchmark.htm](https://www.grc.com/dns/benchmark.htm))\n\
  \n## There's more...\n\nWhen a process on the end device is looking for the IP address\
  \ of a specific name, it interacts with the local resolver that goes out to the\
  \ DNS servers. When the DNS server does not find the entry you are looking for in\
  \ its database, it can respond in two ways—**recursive** or **iterative**:\n\n-\
  \ **Recursive mode**: In this mode, when the application (for example, a web browser)\
  \ wants to resolve the name of the website [www.packtpub.com](http://www.packtpub.com),\
  \ it sends a DNS request to the local DNS server (marked as **1** in the following\
  \ diagram). The local DNS server sends the request to a root server (marked as **2**\
  \ and **3** in the following diagram), then to the TLD (marked as **3** and **4**\
  \ in the following diagram), and finally to the authoritative server of [www.packtpub.com](http://www.packtpub.com),\
  \ which gives us the required address (marked as **6** and **7** in the following\
  \ diagram). Then, the local DNS server sends us the required address (marked as\
  \ **8** in the following diagram). In each one of the responses, the resolver gets\
  \ the DNS to query in the next step.\n\n![](img/da40f92928403866599198344271d63e_744_0.png)\n\
  \n- **Iterative mode**: In this mode, a DNS client can receive a response from the\
  \ DNS server that will tell the client where to look for the requested name. When\
  \ the application (for example, a web browser) wants to browse the website [www.packtpub.com](http://www.packtpub.com),\
  \ it sends a DNS request to the local DNS server (marked as **1** in the following\
  \ diagram). The local server forwards the request to a root DNS server (marked as\
  \ **2** in the following diagram). If it doesn’t know the answer, it forwards the\
  \ request to the TLD (marked as **3** in the following diagram) and the authoritative\
  \ DNS (marked as 4 in the following diagram). Then, the answer is sent all the way\
  \ back to the client (marked as 5, 6, 7, and 8 in the following diagram):\n\n![](img/da40f92928403866599198344271d63e_745_0.png)\n\
  \n## Analysing DNS problems\n\nIn the previous recipe, we saw how to identify a\
  \ normal operation of DNS. In this recipe, we will learn how to discover problematic\
  \ behavior of DNS, and how to figure out its source.\n\n## Getting ready\n\nA DNS\
  \ problem can result in bad performance while browsing the Internet, slow network\
  \ while working inside the organization network, or any other performance issues.\
  \ We will see how to isolate these problems and how to find out whether it is a\
  \ DNS issue or not.\n\nThe DNS consecutive queries: In this case, the DNS server\
  \ simply does not answer. This is illustrated in the following screenshot:\n\n![](img/da40f92928403866599198344271d63e_750_0.png)\n\
  \nWhen you right-click on one of the packets in the preceding screenshot and choose\
  \ Follow UDP Stream, you will see that the DNS resolver on your PC sends several\
  \ queries (with increasing time intervals between them), and then stops. This is\
  \ shown in the next screenshot:\n\n![](img/da40f92928403866599198344271d63e_750_1.png)\n\
  \n![](img/da40f92928403866599198344271d63e_750_2.png)\n\n## DNS slow responses\n\
  \nHow will you know that this is the problem?\n\n- 1. When you are browsing the\
  \ Internet and getting very slow responses, perform the following steps:\n  - 1.\
  \ Port mirror the connection to the Internet, and check if you have any bottleneck\
  \ on the way to the Internet. You can use the IO graphs for this purpose, as described\
  \ in Chapter 5, Using Advanced Statistics Tools.\n  - 2. Verify that you don't have\
  \ a significant number of retransmissions or duplicate ACK's indicating a connection\
  \ problem.\n  - 3. Verify that you don't have any window-related problem, such as\
  \ zero window or window full.\n- 2. If answers are no for the preceding checks,\
  \ it might be a DNS problem. You can have DNS problems in two cases:\n  - When working\
  \ in your organization\n  - When connecting to the Internet\n- 3. These issues can\
  \ be resolved in two ways:\n  - When facing problems in your organization, port\
  \ mirror the switch port that is connected to the DNS server\n  - When facing problems\
  \ with the Internet, port mirror the switch port that connects your organization\
  \ to the Internet\n- 4. Watch the DNS response time that you get. There are several\
  \ ways to locate the problem, and they are given as follows:\n  - The simplest way\
  \ is to right-click on a packet from a DNS query stream, choose Follow UDP Stream,\
  \ and then check the time between the query and response.\n  - Another way is to\
  \ use IO graphs for this purpose. In the IO Graphs window, choose Advanced in the\
  \ Y Axis configuration and configure the filter dns.time with AVG(*) in the Graph\
  \ lines. Refer the following screenshot:\n\n![](img/da40f92928403866599198344271d63e_752_0.png)\n\
  \nYou will get a graph of the DNS response times throughout the capture time.\n\n\
  In this graph, you will see that most of the response times fall below 100mSec,\
  \ which is quite reasonable. We have two peaks that indicate a probable problem,\
  \ one at the beginning of the capture with 300 ms, and one at the end of the capture\
  \ with 450 ms.\n\n### Tip\n\nReasonable times inside the organization (in a local\
  \ site) should be not more than tens of milliseconds. When browsing the Internet,\
  \ a good response time should be less than 100 ms, while up to 200 ms is still tolerant.\n\
  \n## How it works...\n\nThere are six basic types of DNS response codes defined\
  \ in RFC 1035. Additional error codes (up to 21) were defined in later standards\
  \ (RFC 2136, RFC 2671, RFC 2845, and RFC 2930). Error codes can be found at http://tools.ietf.org/html/rfc2929#section-2.3.\n\
  \nThe most common codes are shown in the following table:\n\n| Error code | Name\
  \ | What is it (RFC 1035) | Why it happens | What to do |\n|---|---|---|---|---|\n\
  | 0 | No error condition | No error, everything works fine. | This signifies that\
  \ everything is working. | Be happy. |\n| 1 | Format error | The DNS server couldn't\
  \ interpret the query. | This error code is usually shown when the DNS server does\
  \ not support DNS extensions, for example, EDNS0 (RFC 2671). | In most cases, there\
  \ is nothing to do. The DNS request will be sent again without the extension. If\
  \ the problem still exists, change the DNS server. |\n| 2 | Server failure | The\
  \ DNS server was not able to process the query due to a problem with the name server.\
  \ | This error code signifies that there is a problem in the DNS server. | Configure\
  \ another DNS server and check again. |\n| 3 | Name error | This is meaningful only\
  \ for responses that are coming from authoritative name servers. | This error code\
  \ signifies that the domain name requested in the query does not exist. | Check\
  \ the domain name. |\n| 4 | Not Implemented | The DNS server does not support the\
  \ requested type of query. |  |  |\n| 5 | Refused | The DNS server refuses to perform\
  \ the specified operation due to policy reasons. | A name server may not wish to\
  \ provide the information to the particular requester. A name server may not wish\
  \ to | This occurs due to connectivity problems, if the forward DNS is not configured,\
  \ or if there is a problem in one of the DNS servers on the way. |\n\n\n\n\n\n执行特定操作。\n\
  \n![](img/da40f92928403866599198344271d63e_756_0.png)\n\n它首先对 www.cisco.com 的 A\
  \ 记录发起 DNS 查询（如前面的截图中的 1 标记），然后依次查询 ap.ff.avast.com（如前面的截图中的 2 标记），这是 Avast 杀毒软件的网页防护服务器；接着查询\
  \ www.static-cisco.com（如前面的截图中的 3 标记）、ciscosystems.tt.omtrdc.net（如前面的截图中的 4 标记）、news（如前面的截图中的\
  \ 5 标记）、products（如前面的截图中的 6 标记）和 newsroom（如前面的截图中的 7 标记）站点。\n\n当我们查看响应时间图（如下一个截图所示）时，可以看到\
