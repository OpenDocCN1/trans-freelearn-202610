  ## 流量控制机制


  这是 TCP 协议使用的另一个特性，用于避免传输过程中的任何数据丢失。通过流量控制，发送方将传输速率与接收方的缓冲区空间同步，以避免将来的任何数据丢失。考虑这样一种场景：接收方在某时刻有
  1,000 字节的缓冲区空间，而发送方每帧最多能发送 5,000 字节。现在，利用这些信息，两个主机都必须将窗口大小同步为 1,000 字节，以避免任何数据丢失。请参考下图，该图展示了这一特性：


  ![](img/da40f92928403866599198344271d63e_1327_0.png)


  上图描绘了通信双方为传输目的协商窗口大小的方式。观察从 SEQ 1 帧开始的行为，主机 2 以 ACK 2 响应，表示该帧已成功接收。


  接下来，**主机 1** 尝试将传输速率提高到两个帧，并以 **SEQ 2** 和 **3** 发送它们。**主机 2** 以 **ACK 4** 响应，表示两个帧都已成功接收。同样，我们成功地将速率提高到了三个帧。


  接下来，**主机 1** 将速率提高到 4，并尝试发送带有 **SEQ 7、8、9** 和 **10** 的数据包。这一次，**主机 2** 以 **ACK 10**
  响应，这意味着**主机 2** 的接收窗口大小一次最多只能容纳 3 个帧，发送方应据此进行调整。


  下一次，当**主机 1** 发送时，窗口大小将设置为 3 个帧，这是接收方能够处理的数量。窗口大小并不是一个固定值；它可以一直变化，直到整个传输完成，整个过程称为
  **TCP 滑动窗口**机制，用于避免传输过程中的数据丢失。


  想一想，如果接收方没有缓冲区空间（即 0 字节）会发生什么？在传输过程中的某个时刻，它可能无法处理。TCP 在这种情况下会怎么做呢？通信信道会断开，还是 TCP
  会提出更可靠的方案？


  是的，TCP 有另一个数据丢失恢复特性，称为**零窗口**通知。此时，接收方发送一个设置为 0 字节的窗口更新数据包，要求发送方暂停发送帧。作为响应，发送方会理解这种情况，并以**保活**数据包回应，该数据包在等待客户端的下一个窗口更新数据包期间按特定时间间隔发送。请参考图
  8.6，其中说明了这一点。


  **主机 1** 在三次握手过程完成后开始通信。在成功传输几个数据包后，接收方的缓冲区空间被其他资源占满，因此**主机 2** 以零窗口数据包响应，告诉**主机
  1** 暂停发送数据包，直到另行通知。**主机 1** 接受**主机 2** 的零窗口数据包后，开始发送**保活**数据包以保持连接活跃，并等待进一步通知。一旦**主机
  1** 收到新窗口大小以及已发送帧的 ACK，它将根据接收方的缓冲区空间重新开始发送数据包。


  ## 排查网络速度慢和网络延迟问题


  我们在列表窗格中观察到的延迟可以归为两类：正常/可接受的延迟和不可接受的延迟。是的，你没听错，有些延迟是可以接受的，你不需要浪费宝贵的时间去排查这些情况。


  根据你从客户端站点获得的测试结果（尝试从投诉客户端的角度捕获嗅探数据包），将当前场景归入以下类别之一：线路延迟、客户端延迟和服务器延迟。从其中一个案例的角度看待你的场景，将有助于你以更面向流程的方法解决问题，从而使任务不那么复杂，最终以更少的时间和更少的资源解决。


  在你开始排查此类场景之前，我强烈建议你通过自定义现有的时间列来更改默认的列表窗格视图（将时间值自定义为 `seconds since Previous Displayed
  Packet`），该列可用于找出延迟问题，也就是说，它会显示序列中两个相关数据包之间的总时间。请参考下图来自定义时间列。


  为了进一步阐述所遵循的最佳实践，我将讨论一种逐步排查的方法，你可以将其用作检查清单的一部分。请确保你清楚理解一件事：在服务器端跟踪问题可能非常关键，因为你每秒可能会看到成千上万个数据包飞入飞出。这会非常混乱，只会让整个问题变得更复杂。查看数千个数据包来找出网络连接缓慢的原因听起来并不可行。因此，最好的做法是过滤出重点、确定优先级，并首先从客户端角度查看问题。


  ![](img/da40f92928403866599198344271d63e_1331_0.png)


