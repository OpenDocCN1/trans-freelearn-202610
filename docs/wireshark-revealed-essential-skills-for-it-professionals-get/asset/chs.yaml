  \n拒绝服务是指对网络资源发起攻击。分布式拒绝服务（Distributed DoS）则是指攻击来自多个来源。\n\n# 更多内容...\n\nDoS/DDoS\
  \ 攻击有时很难被发现，因为它们可以模拟真实情况。例如：\n\n+   1. Ping 扫描也可能来自管理系统。\n+   2. HTTP GET 请求，即 Web\
  \ 服务器接收的正常请求。\n+   3. SNMP GET 请求。\n\n为了发现问题，需要对上述及其他类似流量的数量和来源进行监控。在下图中，我们可以看到在追踪特定\
  \ TCP 流时获得的信息。\n\n![](img/da40f92928403866599198344271d63e_989_0.png)\n\n# 定位狡猾的\
  \ TCP 攻击\n\n另一种攻击方式是发送未知的 TCP 数据包，希望被攻击设备不知道如何处理它们，从而将其放行。这类攻击广为人知，如今网络中部署的大多数现代防火墙都会拦截它们；尽管如此，我还是会简要介绍一下。\n\
  \n# 准备工作\n\n当我进入一个新网络时，通常会把笔记本电脑连接到网络上，观察网络上有哪些流量。首先，我会连接到几个交换机上，查看广播流量。然后，我会对关键服务器和通信线路配置端口镜像，再观察上面的流量。\n\
  \n为了查找异常流量，需要对通信链路和核心服务器进行端口镜像，并检查是否出现异常的流量模式。\n\n# 操作步骤...\n\n你应该留意的流量模式包括：\n\n\
  +   - **ACK 扫描：** 通常会向多个端口发送大量 ACK 数据包，以破坏现有的 TCP 连接。\n\n![](img/da40f92928403866599198344271d63e_992_0.png)\n\
  \n+   - **异常标志位组合：** 这指的是带有 URG 标志、FIN 与 RST、SYN-FIN 等的任何组合。异常标志组合并不是常见的带或不带 ACK\
  \ 的 SYN、FIN 或 RST。在下面的截图中，你可以看到这种情况的一个示例。FIN/PSH/URG 这些操作组合在一起被称为 Xmas 扫描。\n\n![](img/da40f92928403866599198344271d63e_992_1.png)\n\
  \n所有标志位都设置为“0”的 TCP 扫描称为 Null 扫描。\n\n![](img/da40f92928403866599198344271d63e_993_0.png)\n\
  \n+   - 大规模 FIN-ACK 扫描：大量 FIN 和 ACK 标志位设置为“1”的数据包被发送到多个端口，目的是使端口关闭或仅仅是为了淹没网络。\n\n\
  ![](img/da40f92928403866599198344271d63e_993_1.png)\n\n# 工作原理...\n\nTCP 扫描有多种类型，其假设是：当我们向目标发送\
  \ RST 或 FIN 标志（带或不带 ACK）以扫描不同端口号时，会使目标关闭连接；而当我们向目标发送异常的标志组合时，会使目标忙于处理，从而导致其速度变慢并断开现有连接。\n\
  \n这些扫描大多广为人知，并且防火墙和入侵检测/防御系统都能很好地防范。\n\n# 更多内容...\n\n你也可以配置预定义过滤器来捕获这些类型的攻击，但在怀疑发生此类事件时，最好的做法是检查捕获的数据，寻找异常的数据模式。\n\
  \n# 另请参阅\n\n关于扫描类型，请访问 [Nmap.org](http://nmap.org) 网页：\n\n[http://nmap.org/book/man-port-scanning-techniques.html](http://nmap.org/book/man-port-scanning-techniques.html)\n\
  \n# 发现暴力破解和应用攻击\n\n网络攻击的下一步是了解各种类型的暴力破解攻击。暴力破解攻击是一种试错方法，用于从受害者那里获取信息，例如试图查找组织服务器、用户目录和破解密码。\n\
  \n### 准备工作\n\n暴力破解攻击通常不会在网络中产生非标准负载，发现它们的方式通常是依靠 IDS 系统，或者当怀疑有人试图入侵网络时发现。在本节中，我们将学习如何识别典型的暴力破解攻击。\n\
  \n2. 另外，留意是否有过多 HTTP 错误消息。下面的截图展示了一些示例。选择 统计 | HTTP | 数据包计数 | PC。如果收到过多错误消息，请检查其来源。\n\
  \n![](img/da40f92928403866599198344271d63e_1000_0.png)\n\n![](img/da40f92928403866599198344271d63e_1000_1.png)\n\
  \n# 工作原理...\n\n暴力破解攻击是一种试错攻击，向目标发送请求，希望其中一些请求能得到响应。由于这些请求大部分都会被拒绝（如果你的服务器配置正确的话），因此大量的\
  \ **未找到** 消息、禁止消息和其他错误代码可能就是此类攻击的某些症状。\n\n# 更多内容...\n\n要发现 HTTP 错误码，请配置显示过滤器 `http.response.code\
