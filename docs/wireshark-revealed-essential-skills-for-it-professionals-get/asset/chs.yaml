  ```\n\n\n\n- 我们的嗅探器也捕获了所产生的流量。为了不显示所有流量，我使用了显示过滤器 `ftp.request.command==PAS`，以便只查看可能恶意的流量。下面的截图展示了我用来查询恶意重复数据包的显示过滤器。\n\
  \n![](img/da40f92928403866599198344271d63e_1290_0.png)\n\n图 7.16：FTP 暴力破解攻击流量模式\n\
  \n- 很容易识别出该流量是恶意的，因为在最多 85 秒的时间跨度内（根据时间列计算），大约有 10 次密码尝试。这看起来确实很危险，应密切监控此类活动，以保护面向互联网的资源。\n\
  \n还有另一种方法可以指出此类流量模式。使用 Wireshark 时，最值得推荐的方法是使用我们之前用来指出恶意流量的相同显示过滤器表达式，创建不同的着色方案，从而更快地发现恶意流量。请参考下面的截图，我为\
  \ TELNET 和 FTP 流量分别创建了不同的着色方案：\n\n![](img/da40f92928403866599198344271d63e_1290_1.png)\n\
  \n图 7.17：恶意流量的着色方案\n\n还有其他各种应用层协议（HTTP、SSH、SMTP 等）也容易受到这些暴力破解技术的影响，并可能给企业基础设施造成重大损失。为了使这些服务更安全，您可以对正在配置的服务强制启用加密，并使用强密码策略，例如最小长度的字母数字密码。您还可以定期强制实施密码更改策略，例如每\
  \ 30 天或其他周期。最后但同样重要的是，您可以让员工了解此类活动。针对员工实施的任何形式的社会工程攻击，都可能使攻击者更容易获得对基础设施的访问权限。\n\n\
  ## 检查恶意流量\n\n在前面提到的一些主题中，我们目睹了一些生成恶意流量的场景。在列表窗格中看到的一些常见协议，如 HTTP、DNS、ARP、IRC，都可能携带恶意流量。因此，了解恶意流量分析无疑是每位网络和安全专业人员都应该熟练掌握的重要技能。在当今数字世界中，已经取得了各种进步。然而，包括恶意软件感染在内的威胁仍然存在。每个组织都应将这些性质的威胁视为关键问题。为了说明由各种恶意流量引起的威胁，我在虚拟实验室中配置了一些内容。由于客户端和服务器之间的活动而产生的流量将被并行捕获，我们稍后将使用这些流量进行分析。请参考下面的截图：\n\
  \n![](img/da40f92928403866599198344271d63e_1292_0.png)\n\n恶意软件一旦安装在受害者的机器上，就会执行多项任务，例如将机密内容传递给指挥者、接收来自服务器的命令，以及感染和破坏系统。即使您的基础设施中安装了最好的安全解决方案，您仍然面临广泛的攻击向量，包括恶意软件感染。\n\
  \n现在，我们已经了解了恶意流量是如何生成的基础知识，并且对将要使用的基础设施也有了清晰的认识。所以，不要再浪费一秒钟，让我们开始这个过程吧。如果您想在您自己的虚拟实验室中重现此场景，请按照以下步骤操作：\n\
  \n- 您需要三台连接到同一 LAN 的机器。确保它们能够相互通信，即验证连通性。\n- 在 IP 地址 `192.168.1.106` 上有一个合法网站，客户端习惯访问它。然而，这一次，客户端并不知道会导致重定向到另一个\
  \ Web 服务器的感染。请参考合法服务器的以下截图：\n\n![](img/da40f92928403866599198344271d63e_1293_0.png)\n\
  \n图 7.18：合法网站\n\n- 为了模拟重定向，我在 106 上配置了 Apache 服务器，将发送到 IP `192.168.1.100` 的所有请求重定向，并从那里下载恶意软件\
  \ `efg.exe`。\n- 因此，下次客户端访问运行在 `192.168.1.106` 的网站时，它会被重定向到一个新的 Web 服务器地址，该地址直接要求客户端运行名为\
  \ `efg.exe` 的文件。请参考下面的截图：\n\n图 7.19：客户端被重定向到 IP 192.168.1.100，并被要求运行该应用程序。\n\n-\
  \ 如果客户端点击**运行**，他们可能不会意识到恶意软件可能对客户端机器以及客户端所属网络造成的危险影响。该应用程序的发布者未经验证，因此浏览器无法验证它。这会导致出现未知发布者错误。如果客户端仍然继续并点击**运行**，恶意软件将被安装。请参考下面的截图：\n\
  \n![](img/da40f92928403866599198344271d63e_1294_0.png)\n\n![](img/da40f92928403866599198344271d63e_1294_1.png)\n\
  \n# 图 7.20：未知发布者错误\n\n- 现在，让我们假设，如果客户端点击运行，那么恶意软件将下载到客户端的机器上。它将在以后执行，从而创建回到命令和控制中心的连接。\n\
  - 如果与攻击者的连接建立成功，那么在客户端不知情的情况下，攻击者可以复制文件、删除文件、截屏、拍摄摄像头照片、通过麦克风录制语音、破坏系统文件等等。您可能听说过各种恶意软件，如勒索软件、间谍软件和广告软件。\n\
  - 由于所有这些活动而产生的所有流量都被捕获。让我们来看一看。我没有直接向您展示流量，而是首先组装了客户端和合法服务器之间的 TCP 流。\n- 要了解我们的恶意软件的工作方式，我们需要查看更多详细信息，这些信息可以由\
  \ Wireshark 呈现给我们。请参考下面的截图，其中显示了组装的 TCP 流：\n\n![](img/da40f92928403866599198344271d63e_1295_0.png)\n\
  \n# 图 7.21：客户端与真实（受损）服务器之间的 TCP 流\n\n正如您清晰所见，客户端正在尝试访问 Web 服务器，请求通过 HTTP 重定向被转发到新地址\
  \ `192.168.1.100`，并尝试下载恶意文件。\n\n- 一旦客户端收到重定向响应，客户端就会再次与新的服务器发起三次握手，并尝试下载文件。在后续帧中主机之间交换了少量数据包之后，客户端收到了\
  \ `200 OK` 状态消息，表明恶意软件下载成功。\n\n![](img/da40f92928403866599198344271d63e_1296_0.png)\n\
  \n在下面的截图中，您可以看到任何部署的 `IDS/IPS` 都可以轻松识别恶意软件签名：\n\n![](img/da40f92928403866599198344271d63e_1297_0.png)\n\
  \n图 7.22：恶意软件签名\n\n客户端发起了 `GET` 请求以搜索 cfg.exe，服务器以 `200 OK` 状态消息响应。随后，您可以看到已知的恶意软件签名以字符\
  \ `MZ` 开头，后面跟着一些随机字符。快速用谷歌搜索一下，就会揭示其行为和模式。我们的搜索还显示，它是一个可执行文件，正如维基百科所述，16/32 位 DOS\
  \ 可执行文件可以通过文件开头 ASCII 中的字母 `MZ` 来识别。请参考下面的截图：\n\n到目前为止，很明显这是一个 Windows 可执行文件，可能具有恶意性。\n\
  \n继续我们对恶意文件的调查，我想使用 Wireshark 导出 `efg.exe` 文件。\n\n1. 转到**文件 | 导出对象 | HTTP**。您将看到一个类似于此处显示的对话框：\n\
  \n![](img/da40f92928403866599198344271d63e_1298_0.png)\n\n图 7.23：导出 HTTP 对象\n\n\
  2. 现在，要导出文件，您需要选择带有文件名的对话。然后点击**另存为**，将文件保存到您选择的位置。\n\n3. 最好的选择是将此文件上传到诸如此类的网站：[http://www.virustotal.com](http://www.virustotal.com)，它会在线使用众多防病毒软件交叉检查\
  \ PE 可执行文件，并向您展示详细的分析报告。请参考下面的截图：\n\n\n图 7.24：将 efg.exe 上传到 virustotal.com\n\n4.\
  \ 现在，点击“Scan it!”让网站检查该文件，并等待结果：\n\n图 7.25：efg.exe 检查完成\n\n56 款杀毒软件中有 31 款将该可执行文件检测为恶意文件，这相当令人警惕。\n\
  \n5. 接下来，我通过查看以下 TCP 流窗口中的十六进制转储，手动检查受感染机器与命令与控制中心之间的通信。我观察到了一些情况。请参见以下截图：\n\n![](img/da40f92928403866599198344271d63e_1300_0.png)\n\
  \n图 7.26：TCP 流对话框中的十六进制转储\n\n似乎已控制受害机器的服务端机器发出了一些命令，以快速收集关于该机器的信息。窗口右侧突出显示的内容包含一些字符串，如\
  \ Get File Information（获取文件信息）、Get full PC name（获取完整 PC 名称）、Get Current directory（获取当前目录）、Adjust\
  \ token Privileges（调整令牌权限）等。\n\n根据我的分析，安装到 Windows 机器上的文件绝对是恶意的。它可能对单台机器以及网络造成了严重破坏。最明智的建议是，除非使用专门的工具对其进行消毒处理，否则将该机器与网络隔离。\n\
  \n在结束本节之前，我还有一个内容要借助 Wireshark 中的列表窗格来展示。请参见以下截图：\n\n| 序号 | 时间 | 源 | 目的 | 协议 | 长度\
  \ | 信息 |\n|---|---|---|---|---|---|---|\n| 1 | 0.0000000 | Apple_b9:53:ec | Broadcast\
  \ | ARP | 42 | Who has 192.168.1.106? Tell 192.168.1.107 |\n| 2 | 0.0002370 | Apple_b9:53:ec\
  \ | Vmware_b3:cb:b6 | ARP | 42 | 192.168.1.106 is at d8:bb:2c:b9:53:ec (dupl |\n\
  | 3 | 0.0004100 | 192.168.1.107 | 192.168.1.106 | TCP | 62 | 1339->80 [SYN] Seq=2857922741\
  \ Win=64240 Len= |\n| 4 | 0.0005120 | 192.168.1.106 | 192.168.1.107 | TCP | 62 |\
  \ 80->1339 [SYN, ACK] Seq=2114108500 Ack=28579 |\n| 5 | 0.0006600 | 192.168.1.107\
