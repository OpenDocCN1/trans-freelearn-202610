  - 可以在 http://perldoc.perl.org/perlre.html 找到一些 Perl 相关内容，Perl 正则表达式可以在 http://perldoc.perl.org/perlre.html#Regular-Expressions
  和 http://www.regular-expressions.info/perl.html 找到。


