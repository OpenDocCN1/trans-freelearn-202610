- '## 第3部分 模块3


  ### 精通 Wireshark


  通过精通 Wireshark，像专业人士一样分析数据网络——从 0 到 1337

  '
- "### 第1章 欢迎来到使用 Wireshark 进行数据包分析的世界\n\n本章向您介绍 TCP/IP 模型的基础知识，并通过一个示例数据包捕获让您熟悉 Wireshark\
  \ 的图形用户界面（GUI）。您将了解以下主题：\n\n- 什么是 Wireshark？\n- 它是如何工作的？\n- TCP/IP 模型简要概述\n- 数据包分析简介\n\
  - 为什么使用 Wireshark？\n- 了解 Wireshark 的 GUI\n- 首次数据包捕获\n\n### Wireshark 简介\n\nWireshark\
  \ 是最先进的数据包捕获软件之一，它让系统/网络管理员的工作变得轻松，并证明了它在安全倡导者群体中的价值。Wireshark 又被称为协议分析器，可帮助 IT\
  \ 专业人员调试网络层问题。该工具在优化网络性能方面非常有用。\n\nWireshark 的核心工作是剖析网络层数据包，并根据用户的需求向其展示数据包详细信息。如果您每天都需要处理数据包级网络问题，那么\
  \ Wireshark 非常适合您，它可用于多种故障排查目的。\n\n### TCP/IP 模型简要概述\n\n接下来，我们来讨论网络世界中最重要的主题。为了理解所有这些内容如何联系在一起，我们需要了解\
  \ TCP/IP 模型的基础知识。即使是计算机世界也需要一套通信规则和条例，而这由网络协议负责处理，这些协议管理数据包/段/帧在主机之间专用信道上的传输。\n\n\
  TCP/IP 模型最初被称为 DoD 模型，该项目由美国国防部监管。TCP/IP 模型负责数据包生命周期的方方面面，即：数据包如何生成，单个数据包如何附加所需的信息集合（PDU），数据包如何传输，如何开始运作，如何通过中间节点路由到目的地，如何与其他数据包重新整合以得到完整信息，等等。\n\
  \n如果您对网络协议的基础知识有任何疑惑，我建议您先快速回顾一下再继续阅读，因为本书需要您熟悉 TCP/UDP 协议。等您回来后，您将能够自己设想并回答所有这些问题。\n\
  \n第二层是**传输层**。该层的唯一目的是创建套接字，使两台主机能够通过它们进行通信（您可能已经知道网络套接字的重要性），这对于在两台设备之间建立单独连接至关重要。\n\
  \n同一时刻，两台主机之间可能存在多个连接。IP 地址和端口号共同实现了这一点。当我们讨论基于 WAN 的通信时，需要 IP 地址（在基于 LAN 的通信中，实际数据传输通过\
  \ MAC 地址进行）。如今，单个系统可以借助端口号通过多个信道与多个设备进行通信。除了受限制的端口号范围外，每个系统都可以自由指定一个随机端口用于通信。\n\n\
  该层也是两台主机之间通信的骨干。工作在该层的最常见协议是 TCP 和 UDP，具体说明如下：\n\n- **TCP：**这是一种面向连接的协议，通常被称为可靠协议。首先，在两台主机之间建立专用信道，然后传输数据。接着，发送方通过专用信道发送均分的数据块，接收方对收到的每个数据块发送确认。最常见的情况是，发送方会等待特定时间，然后再次发送相同的数据块以确保传输。例如，如果您正在下载某些内容，TCP\
  \ 会负责确保每个比特都成功传输。\n- **UDP：**这是一种无连接协议，通常被称为不可靠的通信形式。但它很简单，因为没有创建专用信道，发送方只关心将数据块发送到目的地，无论是否被接收。这种通信形式实际上不会影响通信质量；将比特从发送方传输到接收方这一唯一目的已经实现。例如，如果您正在玩基于局域网的游戏，丢失几个字节不会破坏您的游戏体验，因此用户体验不会受到损害。\n\
  \n第三层是**互联网层**，负责数据的往返传输。该层工作的主要协议是 **IP（互联网协议）**，这是该层最重要的协议。IP 提供路由功能，使得特定数据包能够到达其目的地。该层包含的其他协议还有\
  \ ICMP 和 IGMP。\n\n\n\n最后一层是**链路层**（通常也称为网络接口层），它紧邻网络硬件。TCP/IP 并未在这一层指定协议；然而，有若干协议被实现，例如**地址解析协议（ARP）**和**点对点协议（PPP）**。该层关注的是信息比特如何在真实的线路中传输。它建立和终止连接，并负责将信号从模拟转换为数字，反之亦然。网桥和交换机等设备在这一层工作。\n\
  \n客户端和服务器的 IP 地址与 MAC 地址的组合是通信过程的核心，其中 IP 地址由网关分配给设备，或者通过静态方式分配，而 MAC 地址来自**网卡（NIC）**，每个与其他主机通信的设备都应具备网卡。当数据从应用层向链路层传输时，一些信息比特会以头部或尾部的形式附加到数据比特上，这使得\
  \ TCP/IP 模型的各层能够相互协调。添加这些额外比特的过程称为数据封装，在此过程中，会在网络模型的末端生成一个**协议数据单元（PDU）**。\n\nPDU\
  \ 由正在发送的信息以及作为头部或尾部一部分附加的各种协议信息组成。当 PDU 到达最底层时，它已经嵌入了实际传输所需的全部信息。一旦到达目的地，随着 PDU\
  \ 在 TCP/IP 模型中逐层向上传递，所嵌入的头部和尾部 PDU 元素会被一层一层地剥离。\n\n下图描述了封装的过程：\n\n![](img/da40f92928403866599198344271d63e_1029_0.png)\n\
  \n图 1.1：数据封装\n\n## 使用 Wireshark 进行数据包分析简介\n\n数据包分析（也称为数据包嗅探或协议分析）用于在网络（以太网或 Wi-Fi）上传输时拦截并捕获实时数据，以了解网络中正在发生的事情。数据包分析由诸如\
  \ Wireshark 之类的协议分析器完成，这些分析器可在互联网上获得。其中一些是免费的，一些用于商业用途则需要付费。在本书中，我们将使用 Wireshark\
  \ 来执行网络分析；Wireshark 是一款开源软件，也是互联网上最好的免费网络分析器。\n\n在当今的网络环境中，可能会出现许多问题；为此，我们需要随时配备最新的工具集，以便在任何情况下都能轻松进行故障排查。这些问题中的每一个都从数据包层面开始，并可能逐渐升级为严重的网络停机。即使系统中运行的最好的协议和服务也可能出错并表现出恶意行为。为了找到问题的根源，我们需要深入数据包层面以更好地理解它。如果你需要维护你的网络，那么你绝对需要关注数据包层面。数据包分析可用于以下方面：\n\
  \n- 通过检查数据包及其具体细节来分析网络问题，从而使你能够更好地掌控网络。\n- 检测网络入侵企图，以及是否存在试图进入你的网络的恶意用户，或者他们已经访问了你网络中的某些内容。\n\
  - 通过在安全设备中建立防火墙规则，然后通过 Wireshark 监控每条规则，来检测内部或外部用户对网络的滥用。\n- 隔离已被利用的系统，使受影响的系统不会成为恶意用户攻击你网络的跳板。\n\
  - 监控数据在网络中实时传输的动态，以便更好地控制允许和受限的数据类别。例如，假设你想为防火墙创建一条规则来阻止访问 BitTorrent 站点。从你可管理的路由器上就可以阻止这些访问，但要了解请求来自何处，则可以通过\
  \ Wireshark 轻松审计。\n- 通过根据你的需求过滤最具体的数据包，并创建特定的捕获过滤器供你参考，从而收集和报告网络统计信息，这从长远来看对你很有帮助。\n\
  - 了解谁在网络中以及他们在做什么，是否有他们不被允许做的事情，是否有人在尝试绕过网络限制。所有这些简单的日常任务都可以通过 Wireshark 轻松完成。\n\
  - 调试客户端/服务器通信，以便可以审计网络中节点之间通信的所有请求和响应，从而维护网络的完整性。\n- 查找隐藏在你网络角落并占用带宽的应用程序。它们可能使你的网络不安全，或者使其对公共网络可见。通过这些不被注意的应用程序，各种形式的网络流量可以在没有任何限制的情况下进入。\n\
  - 调试网络协议实现以及当前运行设备中各种错误配置导致的任何异常。\n\n识别你的网络可能遭受的可能攻击或恶意攻击，分析它们，控制/监督它们，并为任何可能的恶意活动做好准备。\n\
  \n在执行数据包分析时，你应注意以下事项：哪些协议可以被解析，根据你的专业知识可以使用哪些最佳软件，哪种协议分析器最适合你的网络需求。在这个领域，经验确实很重要；一旦你开始使用\
  \ Wireshark，你会逐渐产生新的想法，以更高级的方式排查和分析你的数据包。\n\n数据包嗅探器可以解析常见的网络协议（如 IP 和 ICMP）、传输层协议（如\
  \ TCP 和 UDP）以及应用层协议（如 DNS 和 HTTP）。\n\n由于 Wireshark 的图形用户界面（GUI）呈现的信息量过于庞大，对某些用户来说它可能显得复杂，这也可被视为其缺点之一。有一些\
  \ CUI/GUI 工具可以解决这个问题。它们使用起来非常简单，界面也更简洁，例如 TShark、tcpdump、Fiddler 等。\n\n## 如何进行数据包分析\n\
  \n当捕获流量时，要么捕获所有原始数据，要么只捕获头部数据而不捕获数据包的完整内容。捕获的信息会从原始数据解码为人类可读的形式，使用户能够更精确地理解网络之间交换的数据。\n\
  \n## 什么是 Wireshark？\n\nWireshark 是一款数据包嗅探软件，全世界的 IT 专业人士都将其用于分析目的。你可以从 [https://www.wireshark.org/download.html](https://www.wireshark.org/download.html)\
  \ 免费下载。\n\nWireshark 可以安装在多种平台上，包括 Linux、Mac 和 Windows（大多数版本）。这是一款开源软件，这意味着该软件的代码及其所需的库可以从我们之前提到的同一网站下载。\n\
  \n数据包嗅探的一个重要关键方面是，将数据包嗅探器放置在物理网络中的什么位置，才能最大限度地发挥其作用；数据包嗅探通常被称为接入线路。\n\n接入线路不仅仅是让你在系统上启动\
  \ Wireshark；在启动嗅探器之前，人们还需要了解一些事情。例如，将嗅探器放置在组织基础设施中的适当位置，具备不同网络设备的工作知识，因为每种网络设备（集线器、交换机、路由器和防火墙）的行为都不同。了解它们各自的工作方式以及网络设备如何处理网络流量也很重要。将嗅探器放置在正确的位置会以细致的方式影响你的数据包分析体验，如果操作正确，最终可能会带来显著的效果。\n\
  \n放置好嗅探器后，你应确认你的网卡（NIC）支持混杂模式。启用该模式后，你的接口卡将开始获取那些并非发往你的机器或经由你的机器路由的数据包。网络中的广播流量可以被同一网络中的每个客户端捕获并分析。网络设备广播多种类型的流量，支持混杂模式的接口可以侦听这些流量。\n\
  \nARP 协议的流量是广播的。地址解析协议负责将 MAC 地址解析为 IP 地址，反之亦然。交换机等设备会向所有设备发送 ARP 数据包，要求正确的设备用其\
  \ MAC 地址进行响应。渐渐地，交换机会维护一张 MAC 地址及其对应 IP 地址的列表，这甚至被称为 CAM 表（内容可寻址存储器）。现在，每当任何主机想要在局域网（LAN）中与其对应的其他对等节点通信时，传输所需的信息（如\
  \ IP 和 MAC 地址）就会从交换机传达给发送方。\n\n\n\n\n通过 ARP 流量，可以轻松捕获和记录不同设备的信息。\n\n## 工作原理\n\n\
  Wireshark 自带 libcap/Winpcap 驱动，可让您将网卡切换到混杂模式；只有在数据包是直接、有意发送到您设备的情况下，才不需要在混杂模式下嗅探。在基于\
  \ Windows 的系统中，您需要拥有管理员权限才能嗅探和分析数据包。每个协议分析器通常都遵循三个步骤：收集、转换和分析。具体描述如下：\n\n- **收集**：这是第一步，您需要选择一个特定的接口进行监听，通过该接口可以从网络中获取一定量的原始数据。这可以通过将接口切换到混杂模式来实现，这样在捕获网络中广播的所有流量后，就可以在\
  \ Wireshark 图形界面中显示出来。\n- **转换**：这一步旨在提高所收集二进制数据的可读性。Wireshark 等协议分析器可以将网络数据包转换为更简单、更易读的格式，从而让我们这些使用者能够更好地理解数据包，并轻松解决日常问题。\n\
  - **分析**：在最后这个步骤中，完成网络数据包的收集和转换后，便开始逐步分析数据，我们会查看协议的具体细节及其特定配置信息。然后，我们继续查看主机和目的地址以及它们所共享的信息类型。其余的分析工作则取决于用户自己，以及他们如何过滤和审查所收集的数据。\n\
  \n如果您想深入了解数据包捕获和分析的过程，就需要精通网络协议及其工作原理，因为网络上发生的所有通信都由各种协议所控制，例如 ARP、**动态主机配置协议 (DHCP)**、**域名服务\
  \ (DNS)**、**传输控制协议 (TCP)**、**互联网协议 (IP)**、HTTP 等。\n\n协议是管理两个网络设备之间通信过程并控制其运行环境的规则和条例。每种协议根据其实现方式和应用场景，具有不同的复杂程度。大多数协议的工作方式基本相同：它们发送请求并等待确认，收到确认后，便允许设备进行通信。\n\
  \n数据成功传输后，为了确保通信成功且不丢失任何一位数据，连接需要被优雅地终止。在数据传输过程中，协议还需要维护通信的完整性，也就是说，如果发送方发送了 `abc`\
  \ 信息，接收方应按照相同的顺序和方式接收到该信息。如果数据位在传输过程中被篡改，则说明所使用的协议并不可靠。分析所有这些任务是任何网络协议分析器的基础工作职责。\n\
  \n## 捕获方法\n\n网络数据包可以通过多种技术进行捕获。根据需求，协议分析器会以特定的配置方式部署在网络中的特定位置。\n\n**集线器分流 (Hubbing\
  \ out)** 在您的交换机不支持端口镜像时是可行的。要使用此技术，您需要将目标电脑从交换网络中拔出，然后将集线器连接到交换机，再将分析器和目标设备连接到集线器上，使其成为同一网络的一部分。\n\
  \n现在，协议分析器和目标设备处于同一个广播域中。您的分析器将轻松捕获发生目标设备或源自目标设备的每个数据包。但请确保目标设备知晓在您创建集线器分流进行分析时可能发生的数据丢失。下图将帮助我们更精确地理解这一概念：\n\
  \n![](img/da40f92928403866599198344271d63e_1040_0.png)\n\n图 1.3：集线器分流\n\n## ARP\
  \ 欺骗\n\n这是一种不道德的捕获网络流量的方式，我们试图在双方之间模仿另一台设备。例如，假设我们的默认网关位于 192.168.1.1，客户端位于 192.168.1.2。这两台设备都必须维护一个本地\
  \ ARP 缓存，以便它们在局域网内发送数据包时无需额外开销。现在的问题是，ARP 缓存中保存了什么类型的信息，以及以何种形式保存。让我告诉您，查看 ARP 缓存的命令是\
  \ `arp -a`，它会显示与特定 IP 地址关联的 MAC 地址。执行 `arp -a` 命令（该命令在大多数平台上都适用）后，会生成一个包含设备 IP 地址及其\
  \ MAC 地址的表格。请看下面的图，它展示了 ARP 欺骗的正常场景：\n\n```\nARP 缓存（之前）\n\n192.168.1.1 - (服务器)\n\
  192.168.1.2 - AA:BB:EE\n192.168.1.3 - AA:BB:DD\n\n192.168.1.2 - (客户端)\n192.168.1.1\
  \ - AA:BB:CC\n192.168.1.3 - AA:BB:DD\n\n192.168.1.3 - (攻击者)\n192.168.1.1 - AA:BB:CC\n\
  192.168.1.2 - AA:BB:EE\n```\n\n既然我们已经了解了 ARP 缓存中存储的内容，接下来让我们尝试欺骗它。\n\n```\nARP 缓存（之后）\n\
  \n192.168.1.1 - (服务器)\n192.168.1.2 - AA:BB:DD\n192.168.1.3 - AA:BB:DD\n\n192.168.1.2\
  \ - (客户端)\n192.168.1.1 - AA:BB:DD\n192.168.1.3 - AA:BB:DD\n\n192.168.1.3 - (攻击者)\n\
  192.168.1.1 - AA:BB:CC\n192.168.1.2 - AA:BB:EE\n```\n\n# 图 1.4：ARP 欺骗（正常场景）\n\n\
  现在您已经理解了 ARP 协议的重要性及其工作原理，我们可以尝试用攻击者的 MAC 地址来欺骗默认网关和客户端的 ARP 缓存。简单来说，我们将用攻击者的 MAC\
  \ 地址替换默认网关 ARP 缓存中客户端的 MAC 地址。同样，我们也会在客户端中执行相同操作，用攻击者的 MAC 地址替换默认网关的 MAC 地址。因此，从默认网关发往客户端以及从客户端发往默认网关的每个数据包，都将被发送到攻击者的机器上。\n\
  \n如果攻击者已配置了端口转发，收到的数据包将被转发到真正的目的地址，而不会向客户端和默认网关透露任何数据包被嗅探的迹象。\n\n![](img/da40f92928403866599198344271d63e_1042_0.png)\n\
  \n![](img/da40f92928403866599198344271d63e_1043_0.png)\n\n图 1.5：ARP 欺骗（被欺骗后的场景）\n\
  \n除了这两种技术之外，市场上还有各种硬件设备，通常称为分流器 (tap)，可以放置在任意两台设备之间来嗅探和分析流量。尽管在某些场景下这种技术能有效捕获网络流量，但应在受控环境中实践或部署，因为它可能对企业内部网络造成恶意影响。\n\
  \n## 穿越路由器\n\n在处理路由环境时，数据包分析的主要方面是将嗅探器放置在正确的位置，以便从中收集所需信息。处理路由结构需要更多技能，因为有时您需要重新考虑嗅探器的放置位置。考虑一个包含三个路由器的路由环境：\n\
  \n路由器 1、路由器 2 和路由器 3 协同工作；每个路由器各连接 2-3 台 PC。路由器 1 充当根节点，控制其子网络节点（路由器 2 和路由器 3）。路由器\
  \ 3 的客户端无法连接到路由器 1 的客户端。为了解决这个问题，组织的管理员已将嗅探器放置在路由器 3 区域内。\n\n一段时间后，管理员收集了相当多的数据包，但仍然无法检测到网络中的异常。因此，他/她决定将嗅探器移动到网络中的另一个区域。将嗅探器放置在路由器\
  \ 1 区域后，管理员看到了之前一直寻找的非常有用的数据包流。这是一个相当简单的移动嗅探器的示例，在某些情况下可能会有所帮助。关键在于，将嗅探器放置在您的网络基础设施中是一项非常重要的任务。\n\
  \n读完这些内容后，我希望您现在想看看 Wireshark 的实际界面，那么让我们来看一下该软件的图形用户界面，以及我们如何初始化网络数据包的捕获过程。\n\n\
  如果您尚未安装 Wireshark，可以从 https://www.wireshark.org/download.html 免费获取副本。要了解本书中的插图，您还需要熟悉该界面。\n\
  \n\n\n\n\n## 为什么使用 Wireshark？\n\n我希望我不是唯一一个痴迷于 Wireshark 为我们带来的数据包捕获场景的简洁性的人。我将简要指出大多数人之所以青睐\
  \ Wireshark 而非其他嗅探器的原因：\n\n- **用户友好**：对于我们所见过或用过的每一个 GUI，选项呈现得有多容易、使用起来有多方便，这一点确实很重要（我想，即使是那些不懂数据包分析的人，也可以在没有任何专业知识的情况下开始在\
  \ Wireshark 中捕获数据包）。\n- **健壮性**：Wireshark 可以处理的信息量非常惊人；我这么说的实际意思是，这类软件在试图显示网络中传输的数据包时，可能会因为每秒捕获和显示的数千个数据包而挂起或崩溃。然而，Wireshark\
  \ 不会——这要大大归功于 Wireshark 的创建者，他们把它构建得非常好。\n- **跨平台**：是的，这一条绝对在列表上。这款免费软件可以安装在管理员如今用于计算目的的任何平台上，无论是基于\
  \ Linux、Windows 还是 Macintosh 的平台。\n- **过滤器**：Wireshark 中有两种过滤选项：\n  - 选择要捕获的内容（捕获过滤器）\n\
  \  - 选择捕获后要显示的内容（显示过滤器）\n- **成本**：Wireshark 是免费的，由一个专注的社区开发和维护。Wireshark 也提供一些付费的专业工具。更多详情请参阅\
  \ Wireshark 官网。\n- **支持**：Wireshark 由一群遍布全球的贡献者非常积极地开发。我们可以注册 Wireshark 的邮件列表，或者通过\
  \ GUI 本身访问在线文档来获得帮助；还有各种在线论坛可供使用以获得最有效的帮助；要去 Google 搜索付费的 Wireshark 支持以了解更多信息。\n\
  \n## Wireshark 图形用户界面\n\n在我们讨论它的强大功能之前，让我借此机会解释一下 Wireshark 的历史以及它是如何诞生的。\n\nWireshark\
  \ 诞生于上世纪 90 年代末。来自堪萨斯城的年轻大学毕业生 Combs 开发了 Ethereal（Wireshark 的基础版本），而在他完成这一惊人发明时，他已经找到了一份工作，并签署了正式合同。服务几年后，Combs\
  \ 决定辞职，并通过进一步开发 Ethereal 来追求自己的梦想。不幸的是，根据法律条款，Combs 的发明属于公司的专有软件。尽管如此，Combs 还是离开了工作岗位，开始开发\
  \ Ethereal 的新版本，并将其命名为 Wireshark。自 2006 年以来，Wireshark 一直在积极开发中，并在全球范围内使用。它支持当今实际部署的大多数协议（超过\
  \ 800 种）。\n\n### 安装过程\n\n按照以下步骤在您的系统上安装 Wireshark：\n\n- 1. 在本书中，我将使用 Mac 电脑；对于其他平台，安装过程是一样的。有些操作系统，如\
  \ Kali Linux，预装了 Wireshark。\n- 2. 因此，如果你使用的是 Macintosh，首先需要下载 X11 Quartz（XQuartz-2.7.7），它将模拟一个运行\
  \ Wireshark 的环境（对于 Windows，只需下载与你的处理器兼容的相应可执行文件）。\n- 3. 现在，你可以安装我们之前在本书中下载的 Wireshark（Wireshark\
  \ 1.12.6 Intel 64）。\n- 4. 两者都成功安装后，我们需要重启计算机。\n- 5. 重启电脑后，启动 Wireshark。数据包分析器一打开，你就会看到\
  \ X11 服务器会自动启动。你无需担心它，只需让它留在后台即可。\n- 6. 完全打开后，它将如下图所示：\n\n![](img/da40f92928403866599198344271d63e_1047_0.png)\n\
  \n# 图 1.6：Wireshark 屏幕\n\n在我们继续并开始第一次捕获之前，我们需要对可用的选项和菜单有所了解。\n\nWireshark GUI 中有六个主要部分，具体说明如下：\n\
  \n- **菜单栏**：这以通用形式表示组织在“应用程序”菜单中的工具。\n- **主工具栏**：包含经常使用的工具，可以高效利用软件。\n- **数据包列表窗格**：该窗口区域显示\
  \ Wireshark 捕获的各种数据包。\n- **数据包详细信息窗格**：该窗口显示与数据包列表窗格中所选数据包相关的详细信息。例如，我们可以查看源 IP\
  \ 地址和目的 IP 地址，以及用于通信的不同协议，这些协议按自下而上的方式（从链路层到应用层）排列。数据包信息按不同的协议类别列出，可展开以获取所选数据包的更多详细信息。\n\
  - **字节窗格**：该窗格以十六进制字节及其 ASCII 字符的形式显示数据包中的数据。\n- **状态栏**：显示已捕获数据包总数等详细信息。\n\n下面的截图将帮助你识别应用程序中的不同部分，请在继续阅读后续章节之前确保自己熟悉所有这些部分。\n\
  \n![](img/da40f92928403866599198344271d63e_1048_0.png)\n\n在工具栏区域，我们有一些有用的工具。我想简要介绍其中一些：\n\
  \n- ![接口选择图标](image)：这让你可以选择要监听的接口\n- ![捕获自定义图标](image)：通过它，你可以自定义捕获过程\n- [开始/停止/重新启动图标]：这些用于开始/停止/重新启动捕获过程\n\
  - [打开图标]：用于打开已保存的捕获文件\n- [保存图标]：用于将当前捕获保存到文件中\n- [重新加载图标]：用于重新加载当前捕获文件\n- [关闭图标]：用于关闭当前捕获文件\n\
  - [后退图标]：用于返回最近访问过的数据包\n- [前进图标]：此图标用于前进到最近访问过的数据包\n- [跳转到数据包图标]：用于转到特定的数据包编号\n\
  - [颜色编码切换图标]：打开/关闭数据包的颜色编码\n- [自动滚动切换图标]：用于打开/关闭自动滚动\n- [缩放图标]：用于放大、缩小和重置缩放为默认值\n\
  - [颜色编码配置图标]：用于根据需求更改颜色编码\n- [数据包过滤器图标]：用于缩小窗口范围以捕获数据包\n- [图标]：这用于配置显示过滤器，只查看所需内容\n\
  \n即使选择了可用的接口，有时你也无法在数据包列表窗格中看到任何数据包。造成这种情况的原因可能有很多，其中一些列举如下：\n\n- 你没有任何网络流量\n- 网络中传输的数据包不是发往你的设备的\n\
  - 你没有激活混杂模式，或者没有混杂模式的选项\n\n启动 Wireshark 应用程序后，你会看到类似下面的截图出现在屏幕上。虽然第一眼看上去并不那么有趣，但让它有趣的是那些正在流动的数据包。是的，我指的就是捕获数据包。\n\
  \n![](img/da40f92928403866599198344271d63e_1050_0.png)\n\n图 1.7：Wireshark 捕获屏幕\n\
  \n## 开始我们的第一次捕获\n\n既然你已经了解了 Wireshark 的基础知识，并且学会了如何安装 Wireshark，我认为你已经准备好开始你的第一次捕获了。我将通过以下一系列步骤指导你开始/停止/保存你的第一次\
  \ Wireshark 捕获：\n\n- 1. 打开 Wireshark 应用程序。\n- 2. 选择一个要监听的接口。\n\n![](img/da40f92928403866599198344271d63e_1052_0.png)\n\
  \n图 1.8：接口窗口\n\n- 3. 在点击“开始”之前，我们有“选项”按钮，它给了我们自定义捕获过程的优势；但到目前为止，我们将使用默认配置。\n\n#\
  \ 提示\n\n确保激活了混杂模式，这样我们就能捕获不是发往我们机器的流量。\n\n\n\n\n\n**图 1.9：** 捕获自定义屏幕\n\n4. 点击开始按钮以启动捕获过程。\n\
  5. 打开你的浏览器。\n6. 访问你想要的任何网站。\n\n![](img/da40f92928403866599198344271d63e_1054_0.png)\n\
  \n**图 1.10：** Wireshark 网站\n\n7. 切回 Wireshark 屏幕；如果一切顺利，你应该能在 Wireshark GUI 的数据包列表窗格内看到大量正在被捕获的数据包。\n\
  \n要停止捕获，你只需点击工具栏区域中的停止捕获按钮，或点击 **捕获** 菜单栏下的 **停止**。\n\n![](img/da40f92928403866599198344271d63e_1055_0.png)\n\
  \n**图 1.11：** 停止捕获\n\n8. 我知道到现在你会看到大量的信息，但不用担心。我在这里是为了让你简单化。\n9. 数据包分析的真正过程始于你捕获了数据包——我的意思是数据包过滤。我们将在即将到来的章节中详细讨论数据包过滤。\n\
  10. 现在，最后一步是为以后使用保存捕获文件：\n\n![](img/da40f92928403866599198344271d63e_1056_0.png)\n\
  \n11. 使用默认的 .pcapng 扩展名将你的文件保存在你的文件夹中。\n\n如果你已经读完所有步骤到这里，我鼓励你创建你的第一个捕获文件。\n\n##\
  \ 摘要\n\n本章奠定了基础网络概念的基础，并介绍了 Wireshark GUI。Wireshark 是一种协议分析器，被全球的 IT 专业人员用于捕获和分析网络层数据包。\n\
  \nTCP/IP 模型有四层：应用层、传输层、网络层和链路层。数据在从一层传递到另一层时会被封装；底部产生的最终数据包称为完整的 PDU，它实际上在信道上传输。\n\
  \n要安装 Wireshark，你只需访问 http://www.wireshark.org 然后下载此开源软件的适当版本。Wireshark 社区由现实世界的极客管理；这可以成为学习和故障排除的好来源。\n\
  \nWireshark GUI 用户友好、功能强大且平台独立；即使是新的 IT 专业人员也能轻松适应该工具。\n\n协议分析的一个重要方面是将嗅探器放置在正确的位置；每个组织的架构都不同，我们可能需要应用不同技术以获取正确的数据包来使用。\n\
  \nHubbing out、端口镜像、ARP 欺骗和窃听是一些可用于在不同情况下监控和分析流量的有用技术。\n\nWireshark 工具窗口共有六个主要部分：菜单栏、主工具栏、数据包列表窗格、数据包详细信息窗格、字节窗格和状态栏。\n\
  \n在数据包分析场景中使用后退/前进键会非常有用。应该了解主工具栏区域显示的所有工具。\n\n在下一章中，你将学习如何在 Wireshark 中使用不同类型的过滤器。\n\
  \n### 练习题\n\n1. **Q.1** TCP/IP 中有多少层？请列出它们。\n2. **Q.2** TCP/IP 模型中哪一层处理第 2 层地址？\n\
  3. **Q.3** 链路层也称为？\n4. **Q.4** HTTP 协议使用 TCP 还是 UDP？\n5. **Q.5** IP、ICMP 和 __________\
  \ 是互联网层中的协议。\n6. **Q.6** 你知道 Wireshark 窗口有多少个部分？\n7. **Q.7** ARP 是第 3 层协议——真/假？\n\
  8. **Q.8** TCP 协议是否遵循三次握手？\n9. **Q.9** 端口镜像技术只能通过交换机实现——真/假？\n10. **Q.10** Hubbing\
  \ out 技术使用路由器将一台 PC 与其对等设备隔离——真/假？\n11. **Q.11** TCP 是不可靠的协议——真/假？\n12. **Q.12**\
  \ 安装 Wireshark 并使用你的无线接口开始一次示例捕获。将你的捕获文件保存在桌面上，名称为 `first.pcap`，并关闭 Wireshark。\n\
  13. **Q.13** 在 Wireshark 中打开你的 `first.pcap` 捕获文件并检查你总共捕获了多少个数据包。\n14. **Q.14** 哪个窗格以\
  \ HEX 和 ASCII 形式显示我们捕获的每个数据包的信息？\n15. **Q.15** 从捕获选项窗口关闭混杂模式，并观察你是否仍能从其他设备接收数据包。\n"
- "## 第 2 章. 在 Wireshark 中过滤\n\n本章将讨论 Wireshark 中可用的不同过滤选项，即捕获过滤器和显示过滤器。我们还将了解如何创建和使用不同的配置文件。以下是本章将涵盖的主题：\n\
  \n- 捕获过滤器的介绍\n- 为什么以及如何使用捕获过滤器\n- 实验——捕获过滤器\n- 显示过滤器的介绍\n- 为什么以及如何使用显示过滤器\n- 实验——显示过滤器\n\
  - 彩色化流量\n- 创建新的 Wireshark 配置文件\n- 实验——配置文件\n\n我希望你准备好使用 Wireshark 中存在的不同过滤选项来分析数据包，并重用我们在用户定义配置文件中之前创建的过滤器。我将指导你使用一种技术，根据某些表达式过滤数据包，我们将使用可用的不同原语创建这些表达式。\n\
  \n在我们继续创建出色的过滤器之前，我想提到另一个用于查找数据包的有趣工具：查找实用程序。\n\n### 过滤器的介绍\n\n在 Wireshark 的世界里，有两种过滤器可以用于实时流量和已保存的捕获文件。过滤器增强了数据包分析的灵活性，其中特定用户被赋予查看他/她想要查看的内容以及捕获他们想要捕获内容的特权。\n\
  \n这两种过滤器是捕获过滤器和显示过滤器。现在，让我们详细看看它们中的每一个。\n\n### 捕获过滤器\n\n这使你能够捕获你想要捕获的内容——其他内容将被丢弃。捕获数据包是一项处理器密集型任务，Wireshark\
  \ 也会占用相当多的主内存。因此，有时我们需要为其他进程节省资源，这些资源可用于分析数据包，在某些情况下，我们只想捕获符合我们表达式的数据——其余的将被丢弃。\n\
  \nWireshark 提供了一些有趣的选项来配置接口，它将捕获仅符合特定表达式的流量，这可以通过 **捕获选项** 窗口实现，如以下屏幕截图所示：\n\n![](img/da40f92928403866599198344271d63e_1061_0.png)\n\
  \n**图 2.1：** 捕获选项对话框\n\n这里，以下要点列出了各种捕获选项对话框相关细节：\n\n- **捕获**：在此窗口中，你可以选择要从中捕获数据包的接口，甚至可以同时选择多个接口以监听所有接口。每个接口的详细信息列在单独的列下，例如\
  \ **捕获**、**接口**、接口名称、是否启用混杂模式等。在 **捕获** 对话框下，你会看到一个复选框来切换混杂模式，你甚至可以选择 **在所有接口上启用混杂**\
  \ 选项，以便只需一次点击即可激活你所需的功能。\n- **管理接口**：此按钮便于添加或删除新的监听接口。你甚至可以添加远程机器接口，在这种情况下，你需要具有\
  \ root 级别权限。\n  - **捕获过滤器**：点击此 **捕获过滤器** 按钮后，你将能够看到类似此处所示的对话框。已配置的捕获过滤器默认列出，在这里，我们也可以创建和保存自定义捕获过滤器。\n\
  \n![](img/da40f92928403866599198344271d63e_1062_0.png)\n\n**图 2.2：** 默认捕获过滤器\n\n\
  \n\n\n首先，用户可以使用这些默认的过滤配置文件，了解如何创建自定义过滤字符串。一旦你熟练掌握了基础知识，就可以继续使用同一个窗口创建自己的自定义过滤器，但务必确保你遵循了**伯克利数据包过滤（BPF）**语法。BPF\
  \ 语法是一种行业标准，被多种协议分析器使用，这使得你的过滤器配置文件具有可移植性。\n\n让我们一起来创建一个过滤器，以便更好地掌握它；考虑这样一个场景：我们需要捕获位于\
  \ `192.168.1.1`（将此 IP 地址更改为你所监控的 Web 服务器的地址）的 Web 服务器发出的数据包，然后按照以下步骤操作：\n\n- 1.\
  \ 打开**捕获选项**对话框。\n- 2. 点击**捕获过滤器**。\n- 3. 点击**新建**。\n- 4. 在**过滤器名称**文本框中写入 `Web\
  \ server 192.168.1.1`。\n- 5. 在过滤器字符串文本框中写入 `host 192.168.1.1 and port 80`。\n\n##\
  \ Wireshark：捕获过滤器 - 配置文件：默认\n\n### 编辑\n\n### 捕获过滤器\n\n- - 仅 IPX\n- - 仅 TCP\n- -\
  \ 仅 UDP\n- - TCP 或 UDP 端口 80（HTTP）\n- - HTTP TCP 端口（80）\n- - 无 ARP 且无 DNS\n- - 与\
  \ www.wire 之间的非 HTTP 和非 SMTP 流量\n- - Web 服务器 192.168.1.1\n\n新建\n\n删除\n\n### 属性\n\
  \n过滤器名称：Web 服务器 192.168.1.1\n\n过滤器字符串：host 192.168.0.1 and port 80\n\n帮助\n\n取消\n\
  \n确定\n\n6. 完成上述操作后，点击**确定**；如果一切输入正确，捕获过滤器按钮旁边的文本框将显示为绿色背景，如下面的截图所示：\n\n捕获过滤器：host\
  \ 192.168.0.1 and port 80\n\n图 2.4：创建示例捕获过滤器\n\n- - **捕获文件**：此选项使你能够灵活地将捕获的数据包保存到系统中已存在的文件中。如果你不选择任何文件，捕获的数据包将被添加到你所选的文件中。系统将创建一个临时文件，并将数据写入其中，之后可以将其保存到用户指定的位置。为此，请写入使用绝对路径引用的文件名，或点击**文件**文本框旁边的**浏览**来选择位置。\n\
  \n如果选择多个文件选项，则可以将数据包保存到多个文件中，此时我们可以自定义更多选项，具体如下：\n\n- - **下一个文件每隔**：在捕获一定量的数据后，Wireshark\
  \ 将创建一个新文件，并将你的数据添加到其中。例如，我希望在 Wireshark 捕获 2 MB 数据后创建一个新文件。\n- - **下一个文件每隔**：经过一定时间后，Wireshark\
  \ 将创建一个新文件，并将你的数据包添加到其中。例如，我希望在捕获过程每进行 5 分钟后创建一个新文件。\n- - **环形缓冲区**：使用此选项，你可以限制新文件的创建。Wireshark\
  \ 使用**先进先出（FIFO）**选项将数据写入多个文件集。例如，你已经选择了**环形缓冲区**选项，并将文件数增加到 5，并且配置了每捕获 5 MB 数据就创建一个新文件。\n\
  \n现在，根据此配置，一旦你开始捕获数据包，每捕获 5 MB 数据，就会创建一个新文件并将数据包写入其中。一旦超过了你在**环形缓冲区**区域中指定的限制，Wireshark\
  \ 将不再创建新文件，而是会回退到第一个文件并向其追加数据。下面的截图显示了类似的配置：\n\n![](img/da40f92928403866599198344271d63e_1065_0.png)\n\
  \n图 2.5：捕获文件选项\n\n- - **停止捕获设置**：此选项允许你在触发特定条件后停止捕获过程；我们有四种不同类型的触发器。激活这些触发器可以阻止\
  \ Wireshark 捕获新的数据包，具体如下：\n\n- - **数据包**：在达到特定数据包数量后停止捕获。\n- - **文件**：在创建一定数量的文件后停止捕获。\n\
  - - **兆字节**：在捕获一定量的数据后停止捕获。\n- - **分钟**：在运行一定时间后停止捕获。\n\n你可能想问一个问题：如果我们同时选择多个选项会怎样？比如，如下图所示。\n\
  \n你可以同时激活多个选项；Wireshark 将在满足任一条件时立即停止捕获。\n\n![](img/da40f92928403866599198344271d63e_1066_0.png)\n\
  \n图 2.6：停止捕获选项\n\n- - **显示选项**：此部分中有几个选项可用来限制数据包及其相应信息在**数据包列表窗格**选项和**协议分级**窗口中的显示方式。请参阅下图。\n\
  \n如果选择**实时更新数据包列表**，你将观察到**数据包列表窗格**会在 Wireshark 捕获到新数据包时立即更新，并且窗格会自动向上滚动。根据需要选择这些选项；否则，这两个任务所占用的资源可用于其他进程。\n\
  \n如果勾选**隐藏捕获信息对话框**复选框，显示统计信息（以百分比表示）的**协议分级**窗口将被隐藏。如果你没有特定用途，我建议你取消勾选所有这些选项。\n\
  \n![](img/da40f92928403866599198344271d63e_1067_0.png)\n\n图 2.7：显示选项\n\n- - **名称解析**：如果选中，此功能可以将第\
  \ 2 层、第 3 层和第 4 层地址解析为对应的名称；为了更好理解，请参阅下面的截图：\n\n![](img/da40f92928403866599198344271d63e_1067_1.png)\n\
  \n图 2.8：名称解析\n\n## 为什么使用捕获过滤器\n\n当周围有大量数据包流动时，只捕获满足你需求的流量非常有用。在分析生产环境时，创建自定义捕获过滤器会非常方便。捕获过滤器在实际捕获过程开始之前应用。通常，Wireshark\
  \ 捕获的每个数据包都会传递给捕获引擎，以便将其转换为人类可理解的格式，但如果你应用了捕获过滤器，Wireshark 将丢弃不符合你表达式的数据包。所有被丢弃的数据包都不会传递给捕获引擎。相比之下，显示过滤器更加具体和强大；在使用捕获过滤器时，你应该小心，因为不符合你所创建表达式的数据包一旦被丢弃，就无法恢复。\n\
  \n**伯克利数据包过滤器（BPF）**语法用于创建捕获过滤器，并且多种协议分析器也使用它，从而保持了行业标准。学习和练习起来都相当容易，只需使用基本格式来构建表达式即可。\n\
  \n## 如何使用捕获过滤器\n\n使用前面提到的 BPF 语法，我们通过捕获过滤器对话框创建了一个简单的捕获过滤器；让我们详细讨论一下，因为了解 BPF 非常重要，它被多种分析器使用。\n\
  \n如果你使用 BPF 语法，则必须遵循特定的格式结构，该结构由两个参数组合而成：标识符和限定符，具体说明如下：\n\n- - **标识符**：这是你希望在数据包中查找的值。例如，如果你要过滤某个\
  \ IP 地址的数据包，那么你的捕获过滤器将类似于 `host 192.168.1.1`，其中值 `192.168.1.1` 是标识符。\n- - **限定符**：限定符分为三个不同的类别：\n\
  \  - - **类型**：类型限定符有三种：`host`、`port` 和 `net`。简而言之，类型限定符指的是你的标识符所指向的名称或数字。例如，在你的\
  \ `host 192.168.1.1` 过滤器中，`host` 就是类型限定符。\n  - - **方向**：有时，当你需要从特定目的地或源捕获数据包时，我们也可以指定方向限定符。例如，在\
  \ `src host 192.168.1.1` 捕获过滤器中，`src` 指定我们仅捕获来自特定主机的数据包。同样，如果你指定 `dst host 192.168.1.1`，则只会捕获发往\
  \ `host 192.168.1.1` 的数据包。\n  - - **协议**：这指的是协议限定符，它使我们能够指定要在表达式中包含的特定协议，用于捕获目的。例如，如果你想捕获来自你的主机\
  \ `192.168.1.1` 的 `http` 流量，那么你的表达式将类似于 `src host 192.168.1.1 and tcp port 80`。\n\
  \n在前面的示例中，我们使用连接运算符（&/and）将两个表达式组合在一起。类似地，我们还有选择运算符（|/or）和否定运算符（!/not），可以用来组合并创建复杂的过滤器。\n\
  \n例如，根据我们之前创建的过滤器 `src host 192.168.1.1 and tcp port 80`，所有源自 `192.168.1.1` 且发往端口\
  \ 80 的数据包都将被捕获。\n\n如果你在 `src host 192.168.1.1` 和 `tcp port 80` 之间添加 `or` 运算符，那么\n\
  \n\n\n\n\n## 一个示例捕获过滤器\n\n虽然 Wireshark 本身提供了多种过滤器，可以让你对 BPF 语法有一个概览，但要访问默认提供的过滤器，请前往**捕获\
  \ | 捕获过滤器**，或点击主工具栏中的**捕获选项**按钮，然后点击**捕获过滤器**。在同一个窗口中，我们还可以选择创建新过滤器，这一点我们已经讨论过了。\n\
  \n请参考下表了解示例捕获过滤器：\n\n| 过滤器 | 描述 |\n|---|---|\n| host 192.168.1.1 | 与主机 192.168.1.1\
  \ 关联的所有流量 |\n| port 8080 | 与端口 8080 关联的所有流量 |\n| src host 192.168.1.1 | 源自主机 192.168.1.1\
  \ 的所有流量 |\n| dst host 192.168.1.1 | 发往主机 192.168.1.1 的所有流量 |\n| src port 53 | 源自端口\
  \ 53 的所有流量 |\n| dst port 21 | 发往端口 21 的所有流量 |\n| src 192.168.1.1 and tcp port 21\
  \ | 源自 192.168.1.1 且与端口 21 关联的所有流量 |\n| dst 192.168.1.1 or dst 192.168.1.2 | 发往\
  \ 192.168.1.1 或发往主机 192.168.1.2 的所有流量 |\n| not port 80 | 与端口 80 无关的所有流量 |\n| not\
  \ src host 192.168.1.1 | 非源自主机 192.168.1.1 的所有流量 |\n| not port 21 and not port 22\
  \ | 与端口 21 或端口 22 无关的所有流量 |\n| tcp | 所有 TCP 流量 |\n| Ipv6 | 所有 IPv6 流量 |\n| tcp or\
  \ udp | 所有 TCP 或 UDP 流量 |\n| host www.google.com | 所有进出 Google IP 地址的流量 |\n| ether\
  \ host 07:34:aa:b6:78:89 | 与指定 MAC 地址关联的所有流量 |\n\n### 注意\n\n了解 BPF 语法至关重要。当你更深入地使用\
  \ Wireshark 时，你会感受到它的重要性。我建议你在熟悉语法后练习一次。\n\n## 使用协议头值的捕获过滤器\n\n捕获过滤器可以根据协议头字段中的偏移值来创建。创建此类过滤器的语法类似于\
  \ `proto[offset:size(optional)]=value`。其中，`proto` 是你要过滤的任何协议，`offset` 是对应值在头部中的位置，`size`\
  \ 是你所查找数据的长度，`value` 是你要查找的数据。\n\n例如，假设我们只想捕获 ICMP 回复包；现在，如果你观察下面的图，会注意到 ICMP 头部类型位于第一个位置，偏移计数从\
  \ 0 开始。因此，在这种情况下偏移值为 0，该字段大小为 1 字节。我们已经拥有了创建捕获过滤器所需的全部信息，所以最终表达式将类似于 `icmp[0:1]=0`。\n\
  \n![](img/da40f92928403866599198344271d63e_1073_0.png)\n\n图 2.9：ICMP 回复\n\n让我们尝试在\
  \ Wireshark 中应用相同设置；然后我们会 ping www.google.com 来检查它是否有效。\n\n![](img/da40f92928403866599198344271d63e_1074_0.png)\n\
  \n图 2.10：ICMP 捕获过滤器\n\n让我们 ping www.google.com，看看它是否有效。\n\n```\ncharits-MacBook-Pro:~\
  \ NotFound$ ping www.google.com\nPING www.google.com (74.125.130.104): 56 data bytes\n\
  64 bytes from 74.125.130.104: icmp_seq=0 ttl=40 time=350.085 ms\n64 bytes from 74.125.130.104:\
  \ icmp_seq=1 ttl=40 time=559.549 ms\n64 bytes from 74.125.130.104: icmp_seq=2 ttl=40\
  \ time=282.911 ms\n64 bytes from 74.125.130.104: icmp_seq=3 ttl=40 time=420.467\
  \ ms\n64 bytes from 74.125.130.104: icmp_seq=4 ttl=40 time=311.638 ms\n64 bytes\
  \ from 74.125.130.104: icmp_seq=5 ttl=40 time=539.921 ms\n```\n\n图 2.11：浏览 google.com\n\
  \n因此，Wireshark 将只捕获 ICMP 回复包。使用同样的技术，你可以根据协议头值过滤流量：\n\n![](img/da40f92928403866599198344271d63e_1075_0.png)\n\
  \n下表列出了一些基于字节的 TCP 和 ICMP 捕获过滤器示例；也请尝试练习一下：\n\n| 过滤器 | 描述 |\n|---|---|\n| icmp[0]\
  \ = 0 | ICMP 请求包 |\n| icmp[0:1] = 8 | ICMP 回复包 |\n| icmp[0:1] = 3 | ICMP 目标主机不可达包\
  \ |\n| tcp[13] = 2 | 仅 TCP SYN 标志包 |\n| tcp[13] = 18 | 仅 TCP SYN/ACK 标志包 |\n| tcp[13]\
  \ = 32 | 仅设置了 TCP URG 标志的包 |\n\n## 显示过滤器\n\n与捕获过滤器相比，显示过滤器更加灵活和强大。显示过滤器不会丢弃任何数据包；相反，数据包会被隐藏，以便于查看。丢弃数据包并不是一种非常有效的做法，因为一旦数据包被丢弃，就无法恢复。当你应用显示过滤器时，只会显示符合过滤器规范的数据包。在\
  \ Wireshark 窗口状态栏的第二列中，应用过滤器后你会看到显示的数据包数量。\n\n在**数据包列表窗格**上方的**过滤器**对话框中，可以对捕获文件使用显示过滤器。显示过滤器比捕获过滤器更受欢迎。显示过滤器所使用的语法可以轻松地调整和应用。对于新用户来说，显示过滤器就像一种超能力，让你能够在运行时隐藏那些不符合当前场景需求的数据包。\n\
  \n显示过滤器可以基于多种不同的约束条件创建，例如 IP 地址、协议、端口号以及特定协议中的头部值。有大量的条件工具和连接运算符可以用来创建复杂的表达式。你可以组合不同的表达式集合，以得到我们正在寻找的更具体的数据包集合。**数据包列表窗格**中显示的每一个数据包都可以根据数据包包含的字段进行过滤。\n\
  \n显示过滤器不会删除数据；相反，数据包会被隐藏，一旦清除列表窗格上方**过滤器**对话框中的过滤器，它们就会再次可见。例如，要仅显示 ICMP 数据包，只需在过滤器对话框中输入\
  \ `ICMP`，然后点击**应用**；这真的很简单，不是吗？如果你想再次查看所有数据包，只需点击**清除**按钮，一切就会恢复正常。\n\nWireshark\
  \ 有一个非常棒的功能，可以在你创建过滤器时提供帮助。只需点击**过滤器**对话框末尾的**表达式**按钮，选择要过滤的协议，如果有值的话再指定该值。\n\n\
  使用**过滤器表达式**对话框真的很容易，如果你是初学者，这对你来说是一大福音。让我们学习如何使用表达式对话框。\n\n![](img/da40f92928403866599198344271d63e_1077_0.png)\n\
  \n### 图 2.12：过滤器表达式\n\n- 1. 如前面的截图所示，点击“表达式”按钮。\n- 2. 此时，你将看到一个“表达式”窗口，如下面的截图所示：\n\
  \n![](img/da40f92928403866599198344271d63e_1078_0.png)\n\n- 3. 例如，如果你只想查看与 ip:192.168.1.1\
  \ 关联的数据包，只需在“字段名称”中向下滚动找到 IPv4，然后展开该部分并选择 ip.addr 选项。\n- 4. 然后，在旁边的“关系”框中，选择要添加到表达式中的运算符。\n\
  - 5. 最后，在“值（IPv4 地址）”框中写入你要查找的 IP。\n- 6. 最后，只需点击“确定”。如果你正确完成了以上所有步骤，你将能够看到来自你所指定\
  \ IP 的数据包（将 192.168.1.1 改为你的 IP 地址）。\n- 7. 在“值”框下方有一个“预定义值”框，当某个协议限制我们只能使用一组特定的值时，就会用到它。你可以在这里选择一个值。\n\
  - 8. 在“预定义值”框下方有一个“范围”框，如果协议允许，我们可以输入一个值范围，例如 1-78、0-5、120-255。\n\n这是创建显示过滤器最简单的方法之一；还有另一种方法也可以创建此类过滤器。手动输入过滤器可以极大地提高你的工作效率，但这需要比新手用户更多的技巧。\n\
  \n在我们开始深入手动创建过滤器之前，我想让你了解一些其他内容，例如比较运算符和逻辑运算符。它们可以用来为 Wireshark 创建简单乃至最复杂的过滤器。\n\
  \n下表列出了用于创建显示过滤器的比较运算符：\n\n| 运算符 | 描述 |\n|---|---|\n| ==/eq | 等于 |\n| !=/ne | 不等于\
  \ |\n| </lt | 小于 |\n| <=/le | 小于等于 |\n| >/gt | 大于 |\n| >=/ge | 大于等于 |\n\n接下来，让我们看看用于将不同条件组合在一起的逻辑运算符。下表列出了所有这些运算符：\n\
  \n| 运算符 | 描述 |\n|---|---|\n| AND/&& | AND 逻辑运算符用于我们希望表达式的两个部分都为真时。例如，ip.src==192.168.1.1\
  \ and tcp 过滤器只会显示源自 IP 192.168.1.1 且与 TCP 协议关联的数据包。只有匹配这两个表达式的数据包才会显示。 |\n| OR/\\\
  |\\| | OR 逻辑运算符用于当我们一次只关注一个条件为真时；即使两个条件都为真，那也没关系。例如，port 53 or port 80 过滤器会显示所有与\
  \ |\n\n\n\n\n\n## 保留过滤器以备后用\n\n有时候，你会遇到这样的需求：能够访问之前创建的过滤器会让你的工作变得既简单又快捷。Wireshark\
  \ 提供了这样的功能，你可以通过保存的名称来保留显示过滤器，并在以后需要时随时使用。此选项将为你节省大量输入复杂显示过滤器所需的时间和精力。要为自己创建一个，请按照以下步骤操作：\n\
  \n- 1. 转到 **分析 | 显示过滤器**；这将为你打开一个窗口，如下面的截图所示：\n\n![](img/da40f92928403866599198344271d63e_1081_0.png)\n\
  \n图2.13：添加显示过滤器\n\n## 使用查找对话框搜索数据包\n\n如果你想根据特定条件查找数据包，可以使用“查找”对话框。它提供了几种有用的搜索技术，可以轻松有效地应用于已捕获的文件或实时运行的捕获。你可以通过导航到\
  \ **编辑 | 查找数据包** 或使用快捷键 Ctrl + F 来访问查找工具。\n\n![](img/da40f92928403866599198344271d63e_1083_0.png)\n\
  \n图2.15：查找数据包对话框\n\n让我们看看其中一些可配置的选项：\n\n- **显示过滤器**：捕获流量后，在分析时，如果你只想查看基于特定 IP/端口/协议的某些特定数据包，那么满足特定条件的数据包将显示在列表中，例如：\n\
  \  - `The ip.addr == 192.168.1.1`（基于 IP 地址）\n  - `The port 8080`（基于端口号）\n  - `http`（基于协议）\n\
  - **十六进制值**：如果你正在查找的某个数据包有十六进制值，则可以选此选项。只需输入用冒号分隔的物理地址，例如：\n  - `0A:C4:22:90:45:00`\n\
  \  - `AA:BB:CC`\n\n**字符串**：下一个也是最后一个选项是基于文本字符串的搜索，你可以输入 DNS 服务器名称、机器名称以及任何你已知的已解析名称（输入任何字符串或单词），例如：\n\
  \n- Cisco\n- 管理员\n- Web 服务器\n- Google\n\n**搜索范围**：此功能使我们能够在特定窗格中搜索。例如，如果你正在 **字节**\
  \ 窗格中查找与值 **Google**（将与数据包字节窗格中的 ASCII 值匹配）相匹配的数据包，那么我们可以继续，首先选择 **字符串** 选项，然后勾选\
  \ **搜索范围** 复选框并选择 **数据包字节**。\n\n**字符串选项**：要使用此功能，首先选择 **字符串** 选项，然后选择 **区分大小写**，然后如果需要，还可以选择字符宽度（但我建议除非你有特定原因，否则不要更改此设置）。\n\
  \n- **方向**：最后一个选项更改搜索方向；你可以将其更改为向上或向下。\n\n一旦你自定义了选项，输入文本并点击 **查找**。这将给你第一个符合条件的确切捕获。要在匹配的数据包之间来回移动，可以使用\
  \ Ctrl + N（下一个）和 Ctrl + B（上一个）。\n\n## 为流量着色\n\n为了获得更好、更便捷的查看体验，Wireshark 为我们提供了一项功能，我们可以为想要突出显示的特定类型的流量着色。流量着色的目的是区分不同的流量集合。使用不同于默认规则的颜色来标记特定的流量集合，就像大海捞针一样。\n\
  \n大多数协议的默认配置文件已经创建，因此我们能够在数据包列表窗格中以不同颜色看到流量。你可以通过导航到 **视图 | 编辑着色规则** 或单击主工具栏上的 **编辑着色规则**\
  \ 按钮来打开一个窗口，如下面的截图所示：\n\n![](img/da40f92928403866599198344271d63e_1085_0.png)\n\n\
  当前作为全局配置文件的一部分保存的、用于以特定前景色和背景色为流量着色的所有规则都会列在此对话框中。每个\n\n图2.17：运行在 172.16.136.1 上的\
  \ Web 服务器\n\n来自 Linux 访问 Web 服务器的正常流量如下图所示：\n\n| 编号 | 时间 | 源 | 目的 | 协议 | 长度 | 信息\
