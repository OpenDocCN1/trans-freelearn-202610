  \ (443)，目的端口：62900 (62900)，序列号：1936，确认号：331，长度：226\n安全套接层\nTLSv1 记录层：握手协议：新会话票据\n\
  TLSv1 记录层：更改密码规范协议：更改密码规范\nTLSv1 记录层：握手协议：加密的握手消息\n\n## 更多内容...\n\n多次有人问我，是否可以解密经过\
  \ SSL/TLS 加密的会话。如果你拥有私钥，那么是可能的；该私钥由你所连接的服务器提供，而要获得它并非易事。\n\n有一些方法可以劫持此密钥，在某些情况下这些方法会奏效。但这并非显而易见，而且无论如何都不属于本书的目标范围。如果你获得了私钥，只需在首选项窗口的协议列表中添加该密钥，然后继续操作。有关此功能的更多详细信息，可从\
  \ [http://wiki.wireshark.org/SSL](http://wiki.wireshark.org/SSL) 以及许多其他网站和博客获取。\n"
- "## 第11章 分析企业应用的行为\n\n在本章中，我们将介绍以下主题：\n\n- 发现网络上运行了什么\n- 分析 FTP 问题\n- 分析电子邮件流量并排查电子邮件问题——POP、IMAP\
  \ 和 SMTP\n- 分析 MS-TS 与 Citrix 通信问题\n- 分析 NetBIOS 协议中的问题\n- 分析数据库流量和常见问题\n\n## 简介\n\
  \nWireshark 的重要用途之一就是应用分析和故障排除。当应用变慢时，可能是由于局域网（在有线局域网中相当少见）、广域网服务（由于带宽不足或高延迟而常见），或服务器/客户端缓慢（我们将在\
  \ TCP 窗口问题中看到）。也可能是由于应用本身缓慢或存在问题。\n\n本章的目的是深入研究应用程序的工作方式，并提供一些指导和解决方案来隔离和解决这些问题。在第一个方案中，我们将学习如何发现并分类运行在我们网络上的应用程序。然后，我们将介绍各种类型的应用程序，了解它们的工作方式、网络如何影响其行为，以及可能出现的问题。\n\
  \n在本章中，我们将学习如何使用 Wireshark 来解析和排查企业网络中常用的应用程序。这些应用程序包括 FTP、各种电子邮件协议、Microsoft 终端服务器和\
  \ Citrix、数据库、NetBIOS 协议等。\n\n## 发现网络上运行的内容\n\n监控一个新网络时，首先要做的事情就是找出网络上运行了哪些内容。网络上有各种类型的应用程序和网络协议，当它们全部在网络上运行时，可能会相互影响和干扰。\n\
  \n在某些情况下，你会拥有不同的 VLAN、不同的**虚拟路由转发（VRFs）**，或者连接到**刀片服务器**中虚拟端口的服务器。最终，所有内容都运行在相同的基础设施上，它们之间可能会相互影响。\n\
  \n### 提示\n\nVRF 和 VLAN 之间经常存在混淆。尽管它们的用途非常相似，但配置的位置不同。VLAN 在局域网中配置，以提供 OSI 第 1 层和第\
  \ 2 层的网络隔离；而 VRF 是路由表的多个实例，使它们可以在同一台路由器中共存。这是一种第 3 层操作，用于分隔不同客户的网络。VRF 用于**多协议标签交换（MPLS）**，通过同一路由器网络为不同客户提供第\
  \ 3 层连接，使任何客户都无法看到其他客户的网络。\n\n### 提示\n\n术语**刀片服务器**指的是一种服务器机箱，前面是服务器架，后面是 LAN 交换机。它有几个不同的缩写；例如，IBM\
  \ 称之为**刀片中心**，HP 称之为**刀片系统**。\n\n\n\n\n## 准备工作\n\n进入新网络后，第一件事就是连接 Wireshark 嗅探网络上的流量。请确保遵循以下几点：\n\
  \n- 当需要监控服务器时，对服务器端口做端口镜像，查看其网络连接上的流量。\n- 当需要监控远程办公室时，对连接 WAN 的路由器端口做端口镜像，然后检查其上的流量。\n\
  - 当需要监控到互联网的慢速连接时，对该连接做端口镜像，查看发生了什么。\n\n在本节中，我们将学习如何使用 Wireshark 工具分析正在运行的流量以及可能导致问题的原因。\n\
  \n## 如何做...\n\n要分析谁在通信，请执行以下步骤：\n\n1. 使用上一节提到的选项之一连接 Wireshark。\n2. 可以使用以下工具：\n\
  \   - 导航到 **统计 | 协议分层** 查看网络上运行的协议及其在总流量中的百分比\n   - 导航到 **统计 | 会话** 查看谁在通信以及使用了哪些协议\n\
  3. 在 **协议分层** 功能中，会弹出一个窗口，帮助您分析谁在网络中通信。如下图所示：\n\n![](img/da40f92928403866599198344271d63e_812_0.png)\n\
  \n4. 在屏幕截图中可以看到协议分布：\n   1. **以太网**：IP、逻辑链路控制（LLC）和配置测试协议（回环）\n   2. **互联网协议版本 4**：用户数据报协议（UDP）、传输控制协议（TCP）、协议无关组播（PIM）、互联网组管理协议（IGMP）和通用路由封装协议（GRE）\n\
  5. 如果单击 + 号，将显示所有底层协议。\n6. 要查看特定协议的吞吐量，请按下图所示向下单击到协议。您将看到捕获期间应用程序的平均吞吐量（本例中为 HTTP）：\n\
  \n7. 单击 HTTP 左侧的 + 号，将打开通过 HTTP 运行的协议列表（XML、MIME、JavaScript 等）及其在捕获期间的平均吞吐量。\n\n\
  ## 更多内容...\n\n在某些情况下（尤其是需要准备管理报告时），需要提供网络统计的图形化视图。有多种可用来源，例如：\n\n- **Etherape（适用于\
  \ Linux）**：http://etherape.sourceforge.net/\n- **Compass（适用于 Windows）**：http://download.cnet.com/Compass-Free/3000-2085_4-75447541.html?tag=mncol:1（来自\
  \ Wildpackets）\n\n## 准备工作\n\n使用 FTP 时，如果怀疑存在连接或响应缓慢的问题，请将端口镜像配置到以下任一位置：\n\n- FTP\
  \ 服务器端口\n- 客户端端口\n- 流量经过的链路\n\n如有必要，配置捕获或显示过滤器。\n\n## 如何做...\n\n要检查 FTP 性能问题，请执行以下步骤：\n\
  \n1. 首先，如前几章所述，检查是否存在以太网、IP 或 TCP 问题。在许多情况下，响应缓慢是由网络问题引起的，而不一定是应用程序问题。\n2. 检查 TCP\
  \ 重传和重复 ACK。检查这些问题是否出现在整个流量中，还是仅出现在 FTP 连接上。\n3. 在 FTP 文件传输中复制单个文件时，IO 图中应出现一条直线，TCP\
  \ 流图（时间序列）中应出现一条直线梯度。\n4. 在下图中，我们可以看到在 TCP 流图（时间序列）中，一个糟糕的 FTP 是什么样子：\n\n如果在多个连接上遇到此问题，可能是因为网络缓慢影响了整个流量。\n\
  \n如果仅在到同一服务器或客户端的 FTP 连接上遇到此问题，则可能是服务器或客户端缓慢。\n\n![](img/da40f92928403866599198344271d63e_818_0.png)\n\
  \n5. 在下图中，我们可以看到它在 IO 图（配置了过滤器）中的样子：\n\n![](img/da40f92928403866599198344271d63e_819_0.png)\n\
  \n6. 在下面的屏幕截图所示的捕获文件中，我们可以看到 TCP 窗口问题。这些问题列举如下：\n\n- 1. 服务器 `15.216.111.13` 向客户端发送\
  \ **TCP 窗口已满** 消息，表示服务器发送窗口已满（数据包 `5763`）。\n- 2. 客户端 `10.0.0.2` 向服务器发送 **TCP 零窗口**\
  \ 消息，告知服务器停止发送数据（数据包 `5778`）。\n- 3. 服务器继续向客户端发送 **TCP 零窗口探测** 消息，询问客户端窗口是否仍为零窗口（即告诉服务器不要再发送数据）。客户端以\
  \ **TCP 零窗口探测确认** 回复这些消息，表示情况仍然如此（数据包 `5793` 到 `5931`）。\n- 4. 过了一段时间，客户端向服务器发送 **TCP\
  \ 窗口更新** 消息，告诉服务器开始提高 FTP 吞吐量（数据包 `5939`）。\n\n![](img/da40f92928403866599198344271d63e_820_0.png)\n\
  \n7. 在上述情况下，只是客户端缓慢。我们通过处理并删除一些不必要的进程解决了问题。\n\n如果遇到连接问题，可能是由于服务器无法正常工作、防火墙在途中阻止了连接，或者服务器或客户端上安装的软件阻止了连接。在这种情况下，请执行以下步骤：\n\
  \n- 1. TCP 连接是否通过 `SYN/SYN-ACK/ACK` 数据包正确建立？如果没有，可能是由于：\n  - 防火墙阻止了通信。请与系统管理员核实。\n\
  \  - 服务器未运行。请在服务器上检查——进程表、FTP 服务器管理等。\n  - 服务器上的软件阻止了连接。可能是带有额外防火墙的防病毒软件、VPN 客户端或任何其他安全或保护软件阻止了连接。\n\
  \  - 也请检查客户端的连接。可能是 VPN 客户端、客户端上的防火墙等阻止了连接。\n\n- 2. 在主动模式下，客户端打开到服务器的连接，然后服务器再打开另一个连接。请确保途中的防火墙支持此操作，或使用被动模式。\n\
  \n## 工作原理...\n\nFTP 有两种模式：主动和被动。在主动模式下，服务器向客户端打开另一个连接；而在被动模式下，是客户端向服务器打开第二个连接。让我们看看它是如何工作的。\n\
  \n在被动模式下，操作如下图所示：\n\n![](img/da40f92928403866599198344271d63e_821_0.png)\n\n- 1.\
  \ 客户端从随机端口 P（示例中为 1024）向服务器端口 21 打开一个控制连接。\n- 2. 服务器从端口 21 应答客户端端口 1024。\n- 3. 现在，客户端从端口\
  \ P+1（示例中为 1025）向服务器已打开并通知客户端的某个数据端口（示例中为端口 2000）打开一个数据连接。\n- 4. 服务器从数据端口（示例中为 2000）应答发起连接的客户端端口，即数据端口\
  \ P+1（示例中为 1025）。\n\n在主动模式下，操作略有不同：\n\n- 1. 客户端从随机端口 P（示例中为 1024）向服务器端口 21 打开一个控制连接。\n\
  - 2. 服务器从端口 21 应答客户端端口 1024。\n- 3. 服务器从端口 20 向客户端端口 P+1（示例中为 1025）打开数据连接。\n- 4.\
  \ 客户端从数据端口 P+1（示例中为 1025）应答服务器端口 20。\n\n![](img/da40f92928403866599198344271d63e_822_0.png)\n\
  \n## 更多内容...\n\nFTP 是一个非常简单的应用程序；在大多数情况下，FTP 问题有非常简单的解决方案。例如：\n\n- **问题 1：** 我监控了一条国际连接，网络一侧有\
  \ FTP 客户端，另一侧有 FTP 服务器。客户抱怨性能缓慢，并归咎于国际服务提供商。与服务提供商核实后，他们说该连接几乎未加载（10 Mbps 线路的 20%），这一点我在检查线路时也确认了。当我查看\
  \ TCP 问题（重传、窗口问题等）时，发现没有问题。为了验证，我移除了 FTP 服务器并安装了另一个（有很多免费的），然后就开始正常工作了。这只是一个低效 FTP\
  \ 服务器的简单问题。\n- **问题 2：** 客户抱怨连接到 FTP 服务器时，每 5 或 6 次尝试后连接就会被拒绝。当我用 Wireshark 检查时，看到了\
  \ FTP 连接被拒绝的消息（并且我已经从客户的投诉中知道了这一点），所以看起来像是走进了死胡同。为了验证，我开始停止服务器上运行的服务，问题就出现了。是一款防病毒软件干扰了这个特定的\
  \ FTP 服务器。\n\n底线是：即使使用 Wireshark（以及其他软件），有时常识会对你更有帮助。\n\n\n\n\n\n## 分析电子邮件流量并排查电子邮件问题\
  \ – POP、IMAP 和 SMTP\n\n邮件客户端到服务器以及服务器到服务器通信的常见邮件协议是**邮局协议第3版（POP3）**、**简单邮件传输协议（SMTP）**和**互联网消息访问协议第4版（IMAP4）**。\n\
  \n另一种常见的访问电子邮件的方法是网页访问邮件，你可以使用 Gmail、Yahoo! 和 Hotmail 等常见邮件服务器。其中一些示例包括来自微软及其他公司的\
  \ Outlook Web 客户端的 **Outlook Web Access（OWA）** 和 **RPC over HTTPS**。\n\n在本方案中，我们将讨论最常见的客户端-服务器和服务器-服务器协议：POP3\
  \ 和 SMTP。我们还将通过其他方法来看一些典型问题。\n\n## 准备工作\n\n当用户抱怨邮件问题时，首先检查是否存在任何明显的问题，例如错误的用户名、错误密码和未配置的认证协议。如果没有，请通过端口镜像将\
  \ Wireshark 连接到投诉的客户端；如果有许多此类客户端，请将端口镜像配置到公共服务器或连接到它的通信线路上（当存在远程服务器时）。\n\n![](img/da40f92928403866599198344271d63e_827_0.png)\n\
  \n5. 在邮件传输期间，请注意邮件客户端很容易占满窄带通信线路。你可以通过配置带有 POP 过滤器的 I/O 图轻松检查这一点。\n\n6. 始终检查常见的\
  \ TCP 指示：重传、零窗口、窗口满等。它们可能表示通信线路繁忙、服务器缓慢，以及来自通信线路或终端节点和服务器的其他问题。这些问题大多会导致连接速度缓慢。\n\
  \n## SMTP 通信\n\nSMTP 通常用于以下目的：\n\n- 服务器到服务器的通信，其中 SMTP 是服务器之间运行的邮件协议\n- 在某些客户端中，POP3\
  \ 或 IMAP4 被配置用于接收消息（从服务器到客户端的消息）；而 SMTP 被配置用于发送消息（从客户端到服务器的消息）\n\n当你怀疑服务器到服务器的通信缓慢时，请按照以下步骤解决问题。\n\
  \n- 1. 检查服务器是否位于同一站点：\n  - 如果它们位于同一站点，则可能是服务器缓慢或另一个应用程序问题。在大多数情况下，局域网不会引起任何问题——尤其是当两台服务器位于同一数据中心时。\n\
  \  - 如果它们不在同一站点（当服务器通过广域网连接位于远程站点时），请检查广域网连接的负载。发送大型邮件时，它们很容易阻塞这些线路——尤其是当它们是窄带（几\
  \ Mbps）时。\n- 2. 首先，查找 TCP 问题；并检查你是在 SMTP 上看到这些问题，还是在所有其他应用程序上看到这些问题。例如，在下面的截图中，你可以看到许多\
  \ TCP 重传：\n\n![](img/da40f92928403866599198344271d63e_828_0.png)\n\n3. 检查这些问题是否是由\
  \ SMTP 服务器缓慢引起的。这是邮件问题吗？查看下面的截图，你会看到我使用了 TCP 会话统计。在勾选“限制为显示过滤器”复选框并点击窗口顶部的“数据包”选项（以获取数据包数量较多的列表）后，我们可以看到，在重传的数据包中，只有\
  \ 793 个数据包是 SMTP 数据包。在 172.16.30.247 和 172.16.30.2 之间的端口 445（Microsoft DS）上有 9014\
  \ 个数据包被重传，在 172.16.30.180 和 192.5.11.198 之间的端口 80（HTTP）上有 2319 个数据包被重传，等等。\n\n![](img/da40f92928403866599198344271d63e_828_1.png)\n\
  \n4. 在这种情况下，SMTP 仅受通信不良的影响。这不是 SMTP 问题。\n\n5. 检查 SMTP 错误。在下面的截图中，你会看到错误代码 451，它也被称为处理服务器错误时的本地错误。此外，还列出了错误列表。\n\
  \n## 提示\n\n当出现问题时，在大多数情况下服务器或客户端会告诉你。你只需查看消息并在 Google 上搜索它们。稍后我们会看到许多这样的例子。\n\n\
  你还可以在 RFC 1893（http://www.ietf.org/rfc/rfc1893.txt）中找到 SMTP 状态代码列表。\n\n![](img/da40f92928403866599198344271d63e_829_0.png)\n\
  \n- 1. 当你想知道双方发送了哪些错误时，请按下面的截图所示配置一个过滤器：\n\n![](img/da40f92928403866599198344271d63e_829_1.png)\n\
  \n- 2. 在这里你可以看到各种事件：\n  - **代码 421：** 这表示邮件服务可能不可用（1）。\n  - **代码 452：** 这表示服务器无法响应，并告诉你稍后重试。这是由于服务器负载或服务器问题导致的（2）。\n\
  \  - **代码 451：**（截图中显示的是代码 250，请参见下面的注释）这表示用户超出配额（3）。\n  - **代码 452：** 这表示邮箱大小限制已超出（4）。\n\
  \  - **代码 450：**（截图中显示的是代码 250，请参见下面的注释）这表示未找到主机（5）。\n\n## 提示\n\n在 SMTP（与许多其他协议一样）中，你可以在同一条消息中获得多个错误代码。你在\
  \ Wireshark 的数据包列表中看到的可能是第一个错误代码，也可能只是部分列表。要查看 SMTP 消息中的完整错误列表，请转到数据包详细信息并打开特定的数据包，如下面的截图所示。\n\
  \n当你看到太多代码时，这表示服务器不可用。请与服务器管理员核实。\n\n![](img/da40f92928403866599198344271d63e_830_0.png)\n\
  \n## 其他一些方法和问题\n\n我之前提到的一些其他常见方法是网页邮件和 RPC over HTTP：\n\n- 在网页邮件中，我们通过 HTTPS 连接到服务器；因此这完全就像使用\
  \ HTTPS 一样，如[第10章](#)（HTTP 和 DNS）所述。登录服务器后，如果出现任何问题，都将是 HTTPS 问题。\n- RPC over HTTPS\
  \ 也是一样。由于 RPC 是一种通常会加载网络的协议，它被认为对高延迟和抖动敏感。微软提出了一种解决方案，让其 Outlook 客户端通过 HTTPS 工作，而不是使用标准\
  \ RPC。同样，由于通信通过 HTTPS 运行，问题将是 HTTPS 问题。\n\n## 工作原理...\n\n邮件客户端大多使用 POP3 与服务器进行通信。在某些情况下，它们也会使用\
  \ SMTP。当需要对服务器进行操作时，例如，当你需要查看远程服务器上存在的消息而无需下载到客户端时，会使用 IMAP4。服务器到服务器的通信通常由 SMTP\
  \ 实现。\n\n## 提示\n\nIMAP 和 POP 之间的区别在于，在 IMAP 中，邮件始终存储在服务器上。如果你删除它，它将无法从任何其他设备访问。在\
  \ POP 中，删除已下载的电子邮件可能会或可能不会删除服务器上的该电子邮件。\n\n一般来说，SMTP 状态代码分为三类，其结构有助于你理解到底出了什么问题。SMTP\
  \ 状态代码的方法和细节将在下一节中讨论。\n\n## POP3\n\nPOP3 是一种应用层协议，邮件客户端使用它从服务器检索电子邮件消息。一个典型的 POP3\
  \ 会话如下面的截图所示：\n\n![](img/da40f92928403866599198344271d63e_832_0.png)\n\n- 1. 客户端打开到服务器的\
  \ TCP 连接。\n- 2. 服务器向客户端发送一条 OK 消息（**OK Messaging Multiplexor**）。\n- 3. 用户发送用户名和密码。\n\
  - 4. 协议操作开始。**NOOP**（无操作）是发送以保持连接打开的消息，**STAT**（状态）由客户端发送到服务器以查询消息状态。服务器以消息数量及其总大小作为响应（在数据包\
  \ 1042 中，**OK 0 0** 表示没有消息，总大小为零）。\n- 5. 当服务器上没有邮件消息时，客户端发送 **QUIT** 消息（1048），服务器确认它（数据包\
  \ 1136），然后 TCP 连接关闭（数据包 1137、1138 和 1227）。\n\n在加密连接的情况下，它看起来几乎相同（见下面的截图）。在连接建立（1）之后，会有几条\
  \ POP 消息（2），TLS 连接建立（3），然后是加密的应用数据。\n\n![](img/da40f92928403866599198344271d63e_833_0.png)\n\
  \n### SMTP 和 SMTP 错误代码（RFC3463）\n\nSMTP 状态代码的结构如下：\n\n```\nclass . subject . detail\n\
  ```\n\n例如，当你看到状态代码 450 时，它表示以下内容：\n\n- **类 4** 表示这是一个临时问题\n\n\n- **主题 5** 表示这是一个邮件投递状态\n\
  - **详情 0** 表示未定义错误（RFC 3463，第 3.6 节）\n\n下表列出了各个类别：\n\n| 状态代码 | 含义 | 原因 |\n|---|---|---|\n\
  | 2.x.xxx | 成功 | 操作成功 |\n| 4.x.xxx | 持久临时失败 | 临时条件阻止了服务器发送邮件。可能是由于服务器负载或网络瓶颈所致。通常，重新发送邮件会成功。\
  \ |\n| 5.x.xxx | 永久失败 | 永久性问题阻止了服务器发送邮件。通常是服务器错误或兼容性问题。 |\n\n下表列出了各个主题：\n\n| 状态代码\
  \ | 它是什么 | 可能的原因 |\n|---|---|---|\n| x.0.xxx | 其他或未定义状态 | - |\n| x.1.xxx | 寻址状态\
  \ | - |\n| x.2.xxx | 邮箱状态 | - |\n| x.3.xxx | 邮件系统状态 | - |\n| x.4.xxx | 网络和路由状态 |\
  \ - |\n| x.5.xxx | 邮件投递协议状态 | - |\n| x.6.xxx | 邮件内容或媒体状态 | - |\n| x.7.xxx | 安全或策略状态\
  \ | - |\n\n状态详情的列表太长，无法在此一一列出。完整列表可在标准页面 [http://tools.ietf.org/html/rfc3463](http://tools.ietf.org/html/rfc3463)\
  \ 中找到。\n\n下表列出了一些常见的状态代码：\n\n| 状态代码 | 它是什么 | 可能的原因 |\n|---|---|---|\n| 220 | 服务就绪\
  \ | 服务正在运行并准备好执行邮件操作。 |\n| 221 | 服务关闭传输通道 | 通常正常。这是服务器在不再需要服务时关闭服务的方式。 |\n| 250\
  \ | 请求的邮件操作已完成 | 邮件投递成功。 |\n| 251 | 非本地用户，邮件将被转发 | 一切正常。 |\n| 252 | 无法验证用户 | 服务器无法验证该用户。邮件仍将被投递。\
  \ |\n| 421 | 服务不可用 | 邮件传输服务不可用，并且由于临时事件无法处理传入邮件。这可能是由于服务器问题（服务未运行）或服务器限制导致的。 |\n\
  | 422 | 邮件大小问题 | 收件人邮箱已超出配额或对传入邮件有限制。 |\n| 431 | 内存不足或磁盘已满 | 服务器磁盘已满或内存不足。请检查服务器。\
  \ |\n| 432 | 传入邮件队列已停止 | 可能是由于服务器错误（某项服务已停止）导致的。 |\n| 441 | 接收服务器无响应 | 发送邮件的服务器表明目标服务器没有响应。\
  \ |\n| 442 | 连接错误 | 与目标服务器的连接存在问题。 |\n| 444 | 无法路由 | 服务器无法确定邮件的下一跳。 |\n| 445 | 邮件系统拥塞\
  \ | 邮件服务器暂时拥塞。 |\n| 447 | 投递时间已过期 | 拒绝系统认为邮件已过旧。这通常是由于排队或传输问题导致的。 |\n| 450 | 未执行请求的操作\
  \ | 邮件无法传输。这通常是由于远程服务器上的邮件服务出现问题。 |\n| 451 | 无效命令 | 这表示命令不受支持或顺序错误。接收服务器已中止该操作。这主要是由于发送或接收服务器上的负载过高。\
  \ |\n| 452 | 未执行请求的操作 | 接收服务器存储空间不足。 |\n| 500 | 语法错误 | 服务器发送的命令未被识别为有效的 SMTP 或 ESMTP\
  \ 命令。 |\n| 512 | DNS 错误 | 无法定位作为已发送邮件目标的主机服务器。 |\n| 530 | 身份验证问题 | 接收服务器要求进行身份验证，或者您的服务器已被接收服务器加入黑名单。\
  \ |\n| 542 | 收件人地址被拒绝 | 该消息表示您的服务器地址已被接收服务器拒绝。这通常是由于反垃圾邮件系统、IDS/IPS 系统、智能防火墙或其他安全系统所致。\
  \ |\n\n## 更多内容...\n\n电子邮件有时被称为网络“无声杀手”之一，尤其是在使用非对称线路接入互联网的小型企业中。发送文本消息时，它们几乎不会消耗网络带宽；但当你通过窄带上行链路向\
  \ ISP 发送一个几兆甚至几十兆的大文件时，办公室里的其他用户将遭受持续数秒甚至数分钟的网络变慢。我在许多小型办公室中见过这个问题。\n\n邮件客户端的另一个问题是，在某些情况下（可配置），邮件客户端被设置为在启动时从服务器下载所有新数据。如果您的客户抱怨所有员工在办公室开始一天工作的时间段网络变慢，那可能是因为数十或数百个客户端同时打开了邮件客户端，而邮件服务器位于广域网（WAN）上。\n\
  \n## 分析 MS-TS 和 Citrix 通信问题\n\n**Microsoft 终端服务器（MS-TS）** 使用 **远程桌面协议（RDP）** 和 **Citrix\
  \ Metaframe 的独立计算架构（ICA）** 协议，广泛用于 PC 和瘦客户端的本地及远程连接。关于这类应用需要记住的重要一点是：它们通过网络传输屏幕变化。如果变化很少，只需要低带宽；如果变化很多，则需要高带宽。\n\
  \n另一点是，这些应用的流量完全是非对称的。下行流量从几十 Kbps 到几 Mbps 不等，而上行流量最多只有几 Kbps。在使用这些应用时，别忘了据此设计网络。\n\
  \n在本节中，我们将了解这些应用的一些典型问题以及如何定位它们。为方便叙述，我们将使用 Microsoft TS 来指代；每当我们写到 MS-TS，都指的是这一类应用中的所有程序，例如\
  \ Citrix Metaframe。\n\n### 准备工作\n\n当怀疑 MS-TS 性能缓慢时，首先与用户确认具体问题是什么。然后将 Wireshark\
  \ 连接到网络，对投诉的客户端或服务器进行端口镜像。\n\n### 操作步骤...\n\n要定位涉及 MS-TS 的问题，首先需要前往用户处询问问题。请按照以下步骤操作：\n\
  \n- 1. 当用户抱怨网络缓慢时，问他们一个简单的问题：他们看到的是屏幕上显示的数据变慢，还是切换窗口时变慢？\n- 2. 如果他们说窗口切换非常快，那就不是\
  \ MS-TS 的问题。MS-TS 问题会导致窗口变化缓慢、画面冻结、图形文档滚动缓慢等。\n- 3. 如果他们说他们正在尝试生成一份报告（当软件运行在 MS-TS\
  \ 上时），但报告需要很长时间才生成，这是数据库问题，而不是 MS-TS 或 Citrix 的问题。\n- 4. 当用户通过高延迟通信线路使用 MS-TS 并快速输入时，可能会遇到字符延迟。这是因为\
  \ MS-TS 正在传输窗口变化，在高延迟下这些窗口变化的传输会变慢。\n- 5. 使用 Wireshark 测量通信线路时：\n    - 使用 IO 图监控线路\n\
  \    - 使用过滤器监控上行和下行方向\n    - 在 y 轴上配置“位/刻度”\n- 6. 您将得到以下截图：\n\n![](img/da40f92928403866599198344271d63e_841_0.png)\n\
  \n- 7. 在上面的截图中，您可以看到一个典型的下行流量高、上行流量极低的流量模式。注意 **Y 轴** 被配置为 **位/刻度**。在 485 秒到 500\
  \ 秒之间，您会看到吞吐量达到最大值。这时应用会变慢，用户开始感觉到画面冻结、菜单移动非常缓慢等现象。\n\n### 提示\n\n当 Citrix ICA 客户端连接到演示服务器时，它使用\
  \ TCP 端口 2598 或 1494。\n\n- 8. 在监控 MS-TS 服务器时，别忘了客户端通过 MS-TS 访问服务器，而服务器通过安装在服务器上的另一个客户端访问应用程序。性能问题可能来自\
  \ MS-TS，也可能来自应用程序。\n- 9. 如果问题确实是 MS-TS 的问题，则有必要弄清楚是网络问题还是系统问题：\n    - 使用 Wireshark\
  \ 检查网络是否出现负载。诸如前一张截图所示的负载，只需增加通信线路即可解决。\n\n\n\n\n- 检查服务器的性能。诸如 MS-TS 之类的应用程序大多消耗内存，因此请主要检查内存（RAM）问题。\n\
  \n## 工作原理...\n\nMS-TS、Citrix Metaframe 以及各类应用程序只是通过网络传输窗口变化。从你的客户端（装有软件客户端的 PC 或瘦客户端）连接到终端服务器；终端服务器再运行各种客户端，用于从它连接到其他服务器。在下图中，你可以看到终端服务器操作的原理：\n\
  \n![](img/da40f92928403866599198344271d63e_843_0.png)\n\n## 分析 NetBIOS 协议中的问题\n\n\
  **网络基本输入/输出系统（NetBIOS）** 是一套于 20 世纪 80 年代初为局域网通信开发的协议。几年后，微软将其用于局域网上的网络通信，随后又将其迁移到\
  \ TCP/IP 上运行（NetBIOS over TCP/IP，RFC 1001 和 1002）。\n\n在当今网络中，NetBIOS 提供三种服务：\n\n\
  - **名称服务**（端口 137）：用于名称注册以及名称到 IP 地址的解析。\n- **数据报分发服务**（端口 138）：用于客户端和服务器发布服务通告。\n\
  - **会话服务**（端口 139）：用于主机之间的会话协商。该服务用于访问文件、打开目录等。\n\n在本章中，我们将探讨 NetBIOS 协议套件的一些常见问题，并学习如何尝试解决它们。由于\
  \ NetBIOS 协议集相当复杂，可能出现问题的场景数以百计，因此我们将提供一些指南，说明如何查找常见问题以及可能出错的地方。\n\n### 准备工作\n\n\
  NetBIOS 协议在 Windows 环境中运行，同时 MAC 和 Linux 机器也通过它与 Windows 通信。当这些环境中出现不稳定、响应缓慢、断连等问题时，NetBIOS\
  \ 问题可能是原因之一。面对这些问题时，用于解决它们的工具是 Wireshark。它会显示网络上的流量，而 Windows 工具则会显示客户端和服务器中运行的内容。\n\
  \n### 操作步骤...\n\n为了尝试找出可能的问题，请将安装有 Wireshark 的笔记本连接到网络，并按下文所述对可疑客户端或服务器进行端口镜像。在接下来的章节中，我们将看到几种问题场景。\n\
  \n有许多与 NetBIOS 一起使用的预定义过滤器。你可以通过单击 **显示过滤器** 窗口右侧的 **表达式** 按钮找到它们。\n\n1. 常规 NetBIOS\
  \ 命令以 `netbios` 开头。\n2. NetBIOS 名称服务以 `nbns` 开头。\n3. NetBIOS 数据报服务以 `nbds` 开头。\n\
  4. NetBIOS 会话服务以 `nbss` 开头。\n5. SMB 以 `smb` 开头。\n\n#### 常规测试\n\n首先，全面查看一下网络。然后，寻找可疑的模式：\n\
  \n1. 将 Wireshark 连接到网络。只要与出现问题的客户端处于同一广播域，任何一个端口都可以。\n2. 配置显示过滤器 `nbns.flags.response\
  \ == 0`。它会给出 NBNS 请求。你会看到许多广播，如下图所示：\n\n![](img/da40f92928403866599198344271d63e_847_0.png)\n\
  \n3. 正如你在上图中看到的，在捕获文件中你会看到以下内容：\n    - **NBNS 注册数据包 (1)：** 在示例中，有名为 WORKGROUP 和\
  \ ETTI 的注册。NBNS 服务器将通过向请求节点发出肯定或否定的名称注册响应来接受或拒绝名称注册。如果没有收到任何响应，请求节点将假定注册成功。\n  \
  \  - NBNS 查询（2、3 和 4）：针对指定名称发送查询。如果存在 NBNS 服务器（即域控制器），你将看到以下响应之一：\n        - 请求的名称不存在（代码\
  \ 3）\n        - 无错误（代码 0）\n\n4. 确保没有来自以 169.254 开头的地址的注册或任何其他请求 (5)。这些是自动专用 IP 寻址（APIPA）地址。这实际上意味着该\
  \ PC 被配置为自动接受地址（通过 DHCP），但没有收到地址。\n5. 还有很多公告数据包。它们将通过 UDP 端口 138 广播。在这里，你会看到每个工作站都会通告其功能：工作站、服务器、打印服务器等。例如，你可以在这里看到：\n\
  \    - 172.16.100.10 的名称为 FILE-SRV，它具备工作站、服务器和 SQL 服务器的功能 (1)\n    - 172.16.100.204\
  \ 的名称为 GOLF，它具备工作站、服务器和打印队列服务器的功能 (2)\n\n![](img/da40f92928403866599198344271d63e_848_0.png)\n\
  \n6. 有些蠕虫和病毒会利用 NetBIOS 名称服务扫描网络。请注意异常模式，如大规模扫描、高广播速率等。\n7. 确认广播不要太多。每台设备每分钟 5 到\
  \ 10 次广播是合理的。超过这个数量通常意味着出现了问题。\n\n#### 提示\n\n你在这里可以看到数百种消息场景。可以使用 Wireshark 专家系统、Google\
  \ 和常识来发现问题。\n\n#### 特定问题\n\n以下是一些在常规操作中可能会遇到的问题：\n\n1. 使用服务器消息块（SMB）协议（该协议用于在网络上浏览目录、复制文件和其他操作）时，你可能会看到一些错误代码。错误代码的完整列表见\
  \ Microsoft MSDN：http://msdn.microsoft.com/en-us/library/ee441884.aspx。\n2. 代码 0\
  \ 表示 STATUS_OK，即一切正常且没有问题。任何其他代码都应进行检查。\n3. 在下面的示例中，你会看到一条 STATUS_ACCESS_DENIED\
  \ 消息。这是你应该留意的众多错误代码之一。在示例中，访问 IP 地址以 203 开头的服务器上的 \\\\NAS01\\HOMEDIR（出于安全原因隐藏完整地址）被拒绝。\n\
  4. 当你尝试通过浏览来查看主目录时，Windows 通常会显示“拒绝访问”（ACCESS DENIED）消息或类似提示。当应用程序试图访问某个目录但无法访问时，就可能出现此问题。在这种情况下，你可能会看到“拒绝访问”消息、通信问题的软件消息，或程序员为你设计的任何其他消息。此时使用\
  \ Wireshark 可以定位确切的错误，而 Google 会告诉你错误原因。\n\n![](img/da40f92928403866599198344271d63e_849_0.png)\n\
  \n5. 在下一个示例中，我们看到了在 `\\\\NAS01\\SAMM (3)` 上进行会话设置 (1) 时出现的状态 `STATUS_MORE_PROCESSING_REQUIRED\
  \ (2)`。\n    - 查看前面提到的链接，我们会发现这是因为在指定的命名管道上还有更多数据可读取。\n    - 在 Google 上快速搜索会告诉我们，这可能表明存在凭据问题。请与系统管理员核实。\n\
  \n![](img/da40f92928403866599198344271d63e_850_0.png)\n\n6. 要查看所有 SMB 错误消息，请键入过滤器\
  \ `smb.nt_status != 0x0`。你将看到所有错误响应，如下图所示：\n\n![](img/da40f92928403866599198344271d63e_850_1.png)\n\
  \n### 工作原理...\n\n正如我们在本节引言中所见，NetBIOS 提供三种服务：**NetBIOS 名称服务（NBNS）**、**NetBIOS 数据报分发服务（NBDS）**\
  \ 和 **NetBIOS 会话服务（NBSS）**。\n\nNBNS 是负责注册名称并将名称转换为 IP 地址的服务。当客户端在域控制器中注册其名称时，注册就发生了。客户端发送注册请求，然后会收到响应，告知注册是否成功或该名称是否已被另一台设备注册。微软环境曾使用\
  \ WINS 实现该服务，但当时大多数网络并未使用它，后来它被 DNS 取代。该服务通过 UDP 端口 137 工作。\n\nNBDS 用于客户端和服务器发布服务通告。借助该服务，网络上的设备会通告自己的名称、能够向网络中的其他设备提供的服务，以及如何连接到这些服务。该服务通过\
  \ UDP 端口 138 工作。\n\nNBSS 用于在主机之间建立会话、打开或保存文件，以及在网络上执行远程文件和其他会话操作。该服务通过 TCP 端口 139\
  \ 工作。\n\n还有其他协议，例如**服务器消息块（SMB）**，它通过 NBSS 运行以进行事务操作，通过 NBDS 运行以发布服务通告；**SPOOLS**\
  \ 用于打印机请求，以及若干其他协议。深入讨论 NetBIOS 的细节超出了本书的范围。如果你需要排查 NetBIOS 协议问题，请遵循本节中的说明——特别注意错误消息和注意事项。\n\
  \n\n\n\n\n# 更多内容……\n\n在本节中，我将展示一些示例，以帮助您更好地理解NetBIOS协议。\n\n## 示例1 – 应用程序冻结\n\n在下面的截图中，我们看到应用程序冻结的原因：\n\
  \n![](img/da40f92928403866599198344271d63e_852_0.png)\n\n在该示例中，我们观察到以下几点：\n\n- 1.\
  \ 一个IP地址以203开头的客户端，正尝试连接到IP地址为`10.1.70.95`的服务器上的`\\\\NAS01\\SAM1M`共享，并收到了`STATUS_ACCESS_DENIED`错误。\n\
  - 2. 客户端注销，服务器确认了该操作。\n- 3. 由于应用程序在等待，TCP通过keep-alive消息保持连接。\n- 4. 过了一段时间，客户端发送断开请求，服务器批准了该请求。\n\
  - 5. 应用程序继续等待，TCP通过keep-alive保持连接。\n- 6. TCP以`RST`（重置）关闭连接。\n\n客户在这里看到的是应用程序冻结。\n\
  \n## 示例2 – 由SMB引起的广播风暴\n\n在我某个客户的网络中，我接到一个紧急电话，说一个远程办事处与总部断开了连接。一些网络细节如下：\n\n- 远程办事处的地址位于子网172.30.121.0/24，默认网关为172.30.121.254。\n\
  - 总部的地址位于子网172.30.0.0/24。远程办事处与中心之间的连接通过MPLS网络上的L3 IP-VPN建立。\n\n为了解决这个问题，我执行了以下操作：\n\
  \n- 1. 我尝试ping总部中的服务器，但没有收到响应。\n- 2. 我联系了为中心提供线路的服务提供商，他们说在他们的监控系统上没有看到线路上的任何负载。\n\
  - 3. 我ping了本地路由器172.30.121.254，但没有收到响应。这意味着局域网中的PC无法访问它们的本地路由器，即默认网关。\n- 4. 我将Wireshark通过端口镜像连接到路由器端口，看到了类似下面的截图：\n\
  \n![](img/da40f92928403866599198344271d63e_853_0.png)\n\n- 5. 我看到一个IP地址为172.30.121.1的主机在微秒级时间内(1)生成了大量数据包。这些数据包是广播包(3)，生成它们的服务是Write\
  \ Mail Slot(5)，由SMB Mailslot协议(4)发送。\n- 6. 为了了解数据包的数量，我使用了IO Graphs功能。我得到了每秒5000个数据包，产生了10\
  \ Mbps的流量，这阻塞了那个老旧的路由器端口（将路由器端口改为100 Mbps或1 Gbps也无济于事。它同样会被阻塞）。\n- 7. 当我在Google或微软网站上没有找到任何相关信息时，我开始停止我不了解的服务，并跟踪广播发生了什么。\n\
  \n最终，导致问题的服务名为LS3Bcast.exe。我停止了它，并确保它不会再次运行，就这样解决了。\n\n![](img/da40f92928403866599198344271d63e_854_0.png)\n\
  \n## 分析数据库流量和常见问题\n\n有些人可能会疑惑我为什么在这里添加本节内容。毕竟，数据库被认为是IT环境中完全不同的分支。一边是数据库和应用程序，另一边是网络和基础设施。确实如此，因为不应该是我们来调试数据库；那是DBA的工作。但通过网络中传输的信息，我们可以看到一些有助于DBA解决问题的问题。\n\
  \n在大多数情况下，IT人员会先来找我们，因为人们会把一切都归咎于网络。我们必须确保问题不是来自网络，仅此而已。在少数情况下，我们会在捕获文件中看到一些细节，这些细节可以帮助DBA完成他们的工作。\n\
  \n## 准备工作\n\n当IT团队来找我们抱怨“网络慢”时，需要进行一些检查以确认事实并非如此。请按照下面一节中的说明操作，以确保我们避免“网络慢”的问题。\n\
  \n## 操作步骤……\n\n在遇到数据库问题时，请按以下步骤操作：\n\n- 1. 当你收到“网络响应缓慢”的投诉时，开始提出以下问题：\n  - 问题是局部的还是全局的？只发生在远程办事处，还是中心也有？当问题出现在整个网络时，这不是广域网带宽问题。\n\
  \  - 所有客户端都遇到同样的情况吗？如果不是，可能存在只影响部分用户的特定问题，因为只有这些用户在运行某个导致问题的特定应用程序。\n  - 客户端和服务器之间的通信线路负载高吗？是哪个应用程序导致了负载？\n\
  \  - 是所有应用程序都运行缓慢，还是只有使用特定数据库的应用程序慢？也许是一些PC老旧且不堪重负，或者是一台资源耗尽的服务器？\n- 2. 完成上述问题排查后，让我们开始工作：\n\
  \  1. 打开Wireshark并开始捕获数据包。您可以将端口镜像配置到特定PC、服务器、VLAN或连接远程办事处的路由器上，以便获取客户端数据。\n  2.\
  \ 查看TCP事件（专家信息）。它们发生在整个通信链路上，还是特定的IP地址上，还是特定的TCP端口号上？这将帮助您隔离问题，并确认问题是否出在特定链路、服务器或应用程序上。\n\
  - 3. 如果您在网络中发现问题，请按照前几章学到的方法解决它们。但是，有些网络问题会影响数据库行为。在下面的示例中，我们看到一个客户端通过一条往返延迟为35至40毫秒的通信线路与服务器通信时的行为。\n\
  \  1. 我们查看TCP流编号8(1)，连接开始于\n\n### 提示\n\n在测量到互联网的连接流量时，您会看到到网站、邮件服务器等的大量重传和重复ACK。这就是互联网。在一个组织中，您应该预期重传率为0.1%至0.5%。连接到互联网时，重传率可能会高得多。\n\
  \nTCP SYN/SYN-ACK/ACK。我已将其设置为参考(2)。我们可以看到整个连接占用了371个数据包(3)。\n\n![](img/da40f92928403866599198344271d63e_858_0.png)\n\
  \n2. 连接继续进行，我们看到数据库请求和响应之间的时间间隔约为35毫秒。\n\n![](img/da40f92928403866599198344271d63e_858_1.png)\n\
  \n- 3. 由于我们有371个数据包来回传输，371*35毫秒大约为13秒。再加上可能发生的一些重传和一些低效情况，这会导致用户等待10到15秒甚至更长时间才能得到数据库查询结果。\n\
  - 4. 在这种情况下，您应该与DBA协商如何显著减少网络中传输的数据包数量；或者您可以改用其他访问方式，例如终端服务器或Web访问。\n\n4. 另一个可能发生的问题是，您会遇到软件问题，这会在捕获文件中反映出来。如果您查看下面的截图，您会看到有五次重传(1)，然后客户端打开了一个新连接(3)。这看起来像TCP问题，但它只发生在软件的某个特定窗口期。这仅仅是软件中的一个进程停止了处理，从而阻止了TCP对客户端做出响应(2)。\n\
  \n![](img/da40f92928403866599198344271d63e_859_0.png)\n\n## 工作原理……\n\n嗯，数据库的工作原理对我来说一直是个谜。我们的任务是找出它们如何影响网络，这正是我们在本节中学到的内容。\n\
  \n## 更多内容……\n\n当您右键单击数据库客户端到服务器会话中的一个数据包时，会打开一个包含会话信息的窗口。这对于DBA查看网络上正在传输的内容很有帮助。\n\
  \n当您遇到延迟问题时，例如通过蜂窝线路或国际连接访问互联网时，数据库客户端到服务器的通信可能并不总是足够高效。您可能需要改用Web或终端方式访问数据库。\n\n\
  一个重要的方面是数据库的工作方式。如果客户端访问数据库服务器，而数据库服务器使用另一台服务器共享的文件，那么客户端-服务器之间的工作可能很好；但问题可能出在数据库服务器到文件服务器共享文件之间的通信上。在开始测试之前，请确保您了解所有这些依赖关系。\n\
  \n最重要的是，确保您的朋友中有非常专业的DBA。总有一天您会需要他们的。\n\n\n\n\n"
- "## 第12章 SIP、多媒体与IP电话\n\n在本章中，我们将学习如何使用 Wireshark 来解决和排查 IP 电话、语音和视频通话、视频流以及其他类型的多媒体会话问题。本章包含以下操作步骤：\n\
  \n- 使用 Wireshark 的功能进行电话与多媒体分析\n- 分析 SIP 连接\n- 分析 RTP/RTCP 连接\n- 视频和监控应用的故障排查场景\n\
  - IPTV 应用的故障排查场景\n- 视频会议应用的故障排查场景\n- RTSP 的故障排查\n\n### 简介\n\n各类多媒体应用在现代通信网络中占据了相当大的比重。这些应用包括电话、视频会议、监控系统、远程教学系统等等。\n\
  \n多媒体应用对网络的要求与其他企业应用不同。诸如 HTTP、电子邮件和文件共享等应用需要高带宽，而电话呼叫例如只需要不到 100 Kbps，但对延迟敏感，并且对抖动（延迟变化）非常敏感。大多数应用要求向远程办公室的客户端提供高下行带宽，而监控系统则需要上行方向，因为它们在总部监控器上被观看，因此监控器实际上是从远程站点下载视频。\n\
  \n在本章中，我们将重点讨论这些语音、视频和多媒体应用，它们在网络连接上的行为方式，以及当它们无法正常工作时如何用 Wireshark 排查问题。\n\n在本章中，我们将重点讨论**会话初始协议（SIP）**、**实时传输协议\
  \ / 实时传输控制协议（RTP/RTCP）**、**实时流协议（RTSP）**以及其他常见多媒体协议。\n\n我们将首先介绍 Wireshark 为排查语音和多媒体会话提供的可用工具。我们将重点讨论如何解决\
  \ SIP 问题以及如何排查 RTP/RTCP 会话，然后学习如何排查视频系统，包括视频会议和监控系统。\n\n### 使用 Wireshark 的功能进行电话与多媒体分析\n\
  \n首先，让我们看看 Wireshark 为监测语音、视频和多媒体提供了哪些工具。\n\n#### 准备工作\n\n在遇到语音通话、视频会议通话或其他多媒体会话问题时，请将装有\
  \ Wireshark 的笔记本电脑连接到网络，并对以下设备之一进行端口镜像，如下面的拓扑图所示：\n\n![](img/da40f92928403866599198344271d63e_865_0.png)\n\
  \n按照以下步骤使用 Wireshark 的功能进行电话与多媒体分析：\n\n1. 在怀疑特定客户端出现问题时，监测本地或远程客户端 **(1)**。\n2.\
  \ 在怀疑存在影响整个 IP 电话网络的核心问题时，监测本地或远程 **IP PBX** 系统 **(2)**。\n3. 在怀疑跨办公地点连接出现问题时，监测到路由器\
  \ **(3 和 4)** 的连接。\n4. 监测防火墙的 LAN 端口 **(5)** 或到服务提供商的连接 **(6)**。该连接通常通过互联网，但也可能是到服务商的直连线路。\n\
  \n#### 操作步骤...\n\n在 Wireshark 窗口中，打开 **Telephony**（电话）菜单，如下面的截图所示：\n\n![](img/da40f92928403866599198344271d63e_866_0.png)\n\
  \n对于电话网络，请使用以下菜单：\n\n1. 要查看 RTP 信息，请导航到 **RTP | Show All Streams**（RTP | 显示所有流），如下面的截图所示：\n\
  \n   ![](img/da40f92928403866599198344271d63e_867_0.png)\n\n2. 将打开以下窗口：\n\n   ![](img/da40f92928403866599198344271d63e_867_1.png)\n\
  \n3. 在 RTP 流窗口中，您将看到以下详细信息：\n   - 源 IP 地址和 UDP 端口\n   - 目的 IP 地址和 UDP 端口\n   - 同步源标识符（SSRC），即\
  \ RTP 流标识符\n   - RTP 负载类型（通常是编解码器类型）\n   - 流数据，即捕获的数据包总数、丢包数、数据包之间的最大间隔时间、最大抖动和平均抖动\n\
  \   - 问题? 用于指示流中是否存在一般性问题\n\n   在窗口底部，您会看到以下按钮：\n   - **Unselect**（取消选择）：当您通过单击选择流后，“取消选择”按钮将取消该选择。\n\
  \   - **Find reverse**（查找反向流）：在语音或多媒体通话中，反向流是相反方向的流（将以浅灰色高亮显示）。\n   - **Save as**（另存为）：此按钮可用于以\
  \ `rtpdump` 格式保存流。有关该格式的信息，请访问 http://www.cs.columbia.edu/irt/software/rtptools/。\n\
  \   - **Mark packets**（标记数据包）：无法使用。\n   - **Prepare filter**（准备过滤）：在显示过滤窗口中准备一个显示过滤器。\n\
  \   - **Copy**（复制）：此选项可将 RTP 流复制到文本文件中。要执行此操作，请单击 **Copy**，打开文本编辑器，然后将内容粘贴到文本文件中。\n\
  \   - **Analyze**（分析）：当您单击某个流，然后点击 **Analyze** 按钮时，将打开 **RTP Stream Analysis**（RTP\
  \ 流分析）窗口。也可以通过单击某个 RTP 数据包并导航到 **Telephony | RTP | Stream Analysis** 菜单来打开同一窗口。\n\
  \   - **Close**（关闭）：单击此按钮将关闭窗口。\n\n4. 要查看 SIP 信息，请导航到 **Telephony | SIP**。在打开的 **SIP\
  \ Packet Counter**（SIP 数据包计数器）窗口中输入 `ip`（或 `udp` 或 `sip`），将打开 **SIP statistics with\
  \ filter: ip**（带过滤器 ip 的 SIP 统计）窗口，如下面的截图所示：\n\n   ![](img/da40f92928403866599198344271d63e_868_0.png)\n\
  \n   在该窗口中，您将获得以下 SIP 统计信息：\n   - 使用 SIP 响应码发送的数据包数量（在上一张截图中编号为 1）\n   - 每种 SIP\
  \ 方法（即 SIP 命令）发送的总数（在上一张截图中编号为 2）\n   - 会话建立时间的最小值、最大值和平均值（在上一张截图中编号为 3）\n\n5. 要获取\
  \ RTSP 统计信息，请导航到 **Telephony | RTSP | Packet Counter**，在弹出的窗口中输入 `ip`、`rtsp`，或者直接留空，然后点击\
  \ **Create Stat**，将打开一个窗口，如下面的截图所示：\n\n   ![](img/da40f92928403866599198344271d63e_869_0.png)\n\
  \n6. 要查看捕获了哪些电话呼叫，请导航到 **Telephony | VoIP Calls**。将打开一个窗口，如下面的截图所示：\n\n   ![](img/da40f92928403866599198344271d63e_870_0.png)\n\
  \n7. 在 VoIP 通话中，您会看到以下参数：\n   - 会话的开始和结束时间，用于给出呼叫时长（在上一张截图中编号为 1）\n   - 会话起始来源的\
  \ IP 地址（在上一张截图中编号为 2）\n   - 会话起始来源的 SIP 地址（在上一张截图中编号为 3）\n   - 会话目标的 SIP 地址（在上一张截图中编号为\
  \ 4）\n   - 会话协议（通常是 SIP）、协议数据包数量以及会话状态（在上一张截图中编号为 5）\n\n#### 工作原理...\n\n要传输语音、视频或多媒体，我们需要实现两个功能。第一个是承载媒体流（主要是语音或视频），第二个是信令，即建立和终止呼叫、邀请参与者加入呼叫等。多年来，针对信令提出了两套协议：\n\
  \n- **ITU-T** 协议族，包括作为整套协议总协议的 **H.323**，用于注册和地址解析的 **H.225**，用于控制的 **H.245**，以及其他一些协议。\n\
  - **IETF** 协议族，包括作为信令协议的 SIP（RFC 3261 及其后续更新）和描述会话参数的**会话描述协议（SDP）**（RFC 4566）。\n\
  \nITU-T 协议族在过去几年中逐渐被淘汰，如今大多数应用都使用 IETF 协议族，这也是我们在本章关注的重点。在下图中，您可以看到 IETF 协议族的结构。\n\
  \n对于媒体流传输，两套协议族都使用 RTP 和 RTCP（RFC 3550 及其后续更新）。RTP 用于媒体传输，RTCP 用于控制流的质量。\n\n有几种协议可用于通过基于\
  \ IP 的网络传输多媒体会话，如下面的拓扑图所示：\n\n![](img/da40f92928403866599198344271d63e_871_0.png)\n\
  \n\n\n**SIP** 用于在终端客户端之间发送的结构化数据包进行信令控制。**SDP** 数据由 SIP 消息承载，用于描述会话。RTSP 用于控制流，通常是视频传输（典型如\
  \ IPTV 流）。\n\n**RTP** 用于承载媒体。在 **RTP** 之上，我们有各种语音和视频压缩的编解码器类型。\n\n**RTCP** 用于控制流的质量，而\
  \ RSVP 是一种通过网络建立服务质量的协议。\n\n所有这些协议都由 TCP/IP 协议族承载，如前面的图所示。在本章后面，你将看到其中大多数协议的详细描述。\n\
  \n## 更多内容...\n\nSIP 使用固定的端口号；因此，Wireshark 总是会将这些端口视为 SIP 会话——SIP 使用端口 5060，而 SIP\
  \ over TLS（即通过 TLS 加密的 SIP）使用端口 5061。标准允许通过 TCP 或 UDP 使用 SIP，但在大多数情况下，它会通过 UDP 使用。\n\
  \n另一方面，RTP 和 RTCP 不使用标准的固定端口。RTP 使用偶数端口号，相应的 RTCP 流使用下一个更高的奇数端口号。例如，如果 RTP 在一端使用端口\
  \ 5004，在另一端使用端口 2006，那么 RTCP 将分别使用端口 5005 和 2007。这就是为什么 Wireshark 默认不会解析 RTP、RTCP\
  \ 等，而是会显示 UDP 流量。\n\n要解析它，你可以执行以下操作：\n\n- 1. 右键单击 RTP 流中的一个数据包（当前看起来像 UDP），然后点击**解码为**。在打开的窗口中，选择\
  \ **RTP**。\n- 2. 你可以转到**编辑 | 首选项**，从协议列表中选择 **RTP**。在 RTP 窗口中，选择**尝试在会话之外解码 RTP**，在大多数情况下，RTP\
  \ 将以此方式自动解码。对于 RTCP 也可以这样做。\n\n## 分析 SIP 连通性\n\n正如我们在上一个秘籍中所学的，**SIP**（RFC 3261\
  \ 及各种扩展）是一种信令协议，用于在一个或多个参与者之间创建、修改和终止用户会话。在发送 SIP 请求时，会话参数通过 **SDP**（**SDP**，RFC\
  \ 4566）发送，使用户能够在彼此之间就一组兼容的媒体类型达成一致。当会话创建后，语音或视频由 RTP 承载，并可选地由 **RTCP** 控制（RTCP 是可选的，可由多媒体应用程序使用，但它不是强制性的协议）。\n\
  \nSIP 将端点定义为**用户代理（UA）**，创建会话的过程涉及 UA 协商，以便就它们希望创建的会话特征达成一致。对于其他服务，如定位会话参与者、注册、呼叫转接等，SIP\
  \ 定义了称为**服务器**的网络主机，UA 可以向其发送注册、会话邀请和其他请求。\n\n在本秘籍中，我们将讨论协议族中信令部分，即 SIP，以及如何使用 Wireshark\
  \ 来排查信令问题，而在下一个秘籍中，我们将学习 **RTP** 和 **RTCP**。\n\nIP 语音和视频的问题可分为两类：\n\n- - **呼叫建立、修改和终止的问题**：这类问题包括拿起电话却听不到拨号音、听到拨号音但无法拨号、拨号后对方没有收到呼叫等情况。这类问题通常由信令问题引起。\n\
  - - **质量问题**：这些是与质量相关的问题，例如语音质量、通话期间的干扰（如噪音）、视频冻结等，通常由网络问题、RTP 问题或各种媒体问题引起。\n\n\
  在本秘籍中，我们将讨论第一类问题，在下一个秘籍中讨论第二类问题。\n\n### 提示\n\n需要注意的是，并非该领域的所有问题都是网络问题，在许多情况下，它们将是设备（例如电话交换机或终端设备）配置不当的结果。\n\
  \n## 准备工作\n\n当面临第一类问题时，大多数情况下你遇到的是信令问题。将 Wireshark 连接到网络，然后按照本秘籍中的步骤来解决它。\n\nSIP\
  \ 中有两大类消息：**方法**和**响应**。方法是由会话一方发起的命令，响应是作为答复生成的。\n\n在排查 SIP 会话时，请跟踪响应及其内容。这里只列出了主要类型。\n\
  \n## 操作步骤...\n\n将 Wireshark 连接到网络后，请按照以下步骤操作：\n\n- 1. 当 UA 希望建立多媒体会话时，它会向远端 UA 发送\
  \ **INVITE** 方法。在下图中，你可以看到一个基本呼叫流程的示例。\n\n![](img/da40f92928403866599198344271d63e_877_0.png)\n\
  \n### 提示\n\nSIP 中的终端设备称为**用户代理（UA）**。用户代理可以发起或接收呼叫。UA 可以是 IP 电话、摄像机、软件客户端，或任何参与\
  \ SIP 会话的设备或软件。\n\n- 2. 在下面的截图中，你看到一个电话呼叫流程的示例：\n\n![](img/da40f92928403866599198344271d63e_877_1.png)\n\
  \n- 3. 要查看详细的呼叫流程，请导航到**统计 | 流量图**，并勾选以下选项：\n- - 显示的数据包\n- - 通用流\n- - 标准源/目标地址\n\
  \n**图形分析**窗口如下所示，供参考：\n\n![](img/da40f92928403866599198344271d63e_878_0.png)\n\n\
  - 4. 在 **INVITE** 之后，你应该会看到来自对端的 **Trying**、**Session Progress**、**Ringing** 或其组合。\n\
  - 5. 我们可以在这里看到会话如何在发起方 **93.172.121.146** 和响应方 **192.168.3.2** 之间进行：\n  1. 会话发起方发送\
  \ **INVITE** 方法；这始终是开始对话的第一个数据包。\n  2. 响应方以 **Trying**（代码 100）、**Session progress**（代码\
  \ 183）回复，并在三秒后以 **Ringing**（代码 180）回复。然后它以 **OK**（代码 200）回复，表示电话听筒已拿起。\n\n  **提示**\n\
  \n  并非所有这些消息都必须存在，在某些情况下，你只会看到其中一些，这也是正常的。在本章后面，我们将了解如何判断这是问题还是只是标准的协议行为。\n\n  3.\
  \ 发起方发送 ACK，会话即建立。\n\n- 6. 如果在此阶段收到错误消息，则连接将无法建立。\n\n### 提示\n\n### 提示\n\n不要忘记 SIP\
  \ 通过 UDP 工作，由于 UDP 在发送请求之前不会向对端打开任何连接，因此请求可能仅仅因为网络可达性问题而无法到达目的地。因此，当你没有收到响应时，很可能是因为网络问题导致\
  \ INVITE 根本没有到达目的地。\n\n7. 当用户客户端之间有电话交换机时，会话将如下面的截图所示。你会听到 IP 电话交换机、呼叫管理器、IP PBX\
  \ 等术语。它们都指处理设备之间信令的电话交换机。SIP 术语共同组成了一个代理，我们将在本秘籍的“工作原理...”部分讨论它。\n\n![](img/da40f92928403866599198344271d63e_879_0.png)\n\
  \n8. 在这里你可以看到交换机有两个接口——第一个在内网（10.179.236.162），第二个在外网（212.179.236.162）：\n\n- 1. 左侧的客户端\
  \ 10.219.62.150 向交换机发送 INVITE 请求（在上面的截图中编号为 1）。\n- 2. 交换机回复说正在 Trying（在上面的截图中编号为\
  \ 2）。\n- 3. 交换机向右侧的客户端发送 INVITE（在上面的截图中编号为 3）。\n- 4. 客户端发送 Trying（代码 100），然后会话进展（代码\
  \ 183）到交换机（在上面的截图中编号为 4）。\n- 5. 过了一段时间，交换机发现客户端没有响应，并且为了通知\n\n\n发起方会收到代码 **488**，表示无效或不可接受，并附带未接受原因的说明（在上面的截图中编号为\
  \ 5）。\n\n- 6. 交换机向右边的客户端发送 **Cancel** 消息（在上面的截图中编号为 6）。\n\n- 9. 要对 SIP 中的问题进行排查，请执行以下操作：\n\
  \  - 1. 绘制包含所有组件的网络拓扑。\n  - 2. 检查错误代码。\n  - 3. 找出错误的原因。\n\n- 10. SIP 错误代码及其可能的原因如下表所示。除非另有说明，代码均定义于\
  \ RFC 3261。\n\n## 1xx 代码 – 临时/信息响应\n\n1xx 代码，即临时或信息响应代码，表示已收到的请求仍在处理中，接收方向发送方通知当前状态。具体如下表所示：\n\
  \n| 代码 | 事件名称 | 原因 |\n|---|---|---|\n| 100 | 尝试中 | 请求已被服务器接收并接受，正在为这次呼叫采取行动。 |\n\
  | 180 | 振铃 | 接收到呼叫的 UA 正在提醒终端用户。这是在此过程中发送回客户端的消息。 |\n| 181 | 呼叫转发 | 呼叫正在被转发到另一个目的地。\
  \ |\n| 182 | 排队中 | 被叫方暂时不可用，服务器保存消息以便稍后投递。 |\n| 183 | 会话进度 | 会话正在由接收服务器处理。关于呼叫进度的更多细节可以在消息头中传递。\
  \ |\n\n## 2xx 代码 – 成功\n\n2xx 代码，即成功响应代码，表示操作已成功接收、理解并被接受。具体如下表所示：\n\n| 代码 | 事件名称\
  \ | 原因 |\n|---|---|---|\n| 200 | 成功 | 请求已被接受、处理并成功完成。 |\n| 202 | 已接受 | 请求已被接受进行处理，但处理尚未完成（RFC\
  \ 3265）。 |\n\n## 3xx 代码 – 重定向\n\n3xx 代码表示需要执行重定向操作才能完成请求。具体如下表所示：\n\n| 代码 | 事件名称\
  \ | 原因 |\n|---|---|---|\n| 300 | 多种选择 | 请求中的地址解析出了多个选择，接收服务器可以将其转发到其中之一。UA 可以使用\
  \ contact 头字段中的地址进行自动重定向，也可以在重定向消息之前与发送方确认。 |\n| 301 | 永久移动 | 在 Request-URI 中的地址处无法找到该用户，请求客户端应尝试\
  \ contact 头字段中提供的地址。发送方应更新其本地目录以反映此变更。 |\n| 302 | 临时移动 | 请求客户端应重试 contact 头字段中提供的新地址。\
  \ |\n| 305 | 使用代理 | 必须通过代理访问所请求的资源，代理地址由 contact 字段给出。 |\n| 380 | 替代服务 | 呼叫未成功，因此接收方发送此响应，以便在接收方提供替代服务。这些服务在消息体中描述。\
  \ |\n\n## 4xx 代码 – 客户端错误\n\n4xx 代码，即客户端错误代码，表示请求包含错误的语法或无法在此服务器上完成。具体如下表所示：\n\n\
  | 代码 | 事件名称 | 原因 |\n|---|---|---|\n| 400 | 错误请求 | 由于语法错误，请求无法被处理。 |\n| 401 | 未授权\
  \ | 收到的请求需要用户认证。通常客户端会向用户请求认证信息。 |\n| 402 | 需要付费 | 保留供将来使用。 |\n| 403 | 禁止 | 服务器已理解请求，但拒绝执行。客户端不应再次尝试。\
  \ |\n| 404 | 未找到 | 服务器通知客户端，在 Request URI 指定的域中该用户不存在。 |\n| 405 | 方法不允许 | 客户端发送的方法不允许其使用。响应中会包含一个\
  \ `allow` 头字段，以通知发送方允许使用哪些方法。 |\n| 406 | 不可接受 | 请求标识的资源只能生成响应实体，其内容特征不符合请求中发送的 `accept`\
  \ 头字段的要求。 |\n| 407 | 需要代理认证 | 客户端必须通过代理服务器进行认证。 |\n| 408 | 请求超时 | 服务器无法在预期时间内响应。客户端可以在一段时间后重新发送请求。\
  \ |\n| 410 | 已消失 | 请求的资源在服务器上不再可用，且转发地址未知。此状况被认为是永久性的。 |\n| 413 | 请求实体过大 | 服务器拒绝处理请求，因为请求实体的主体大于服务器能够或愿意处理的大小。\
  \ |\n| 414 | Request-URI 过长 | 服务器拒绝处理请求，因为 Request URI 的长度超过了服务器能够或愿意解释的范围。 |\n\
  | 415 | 不支持的媒体类型 | 服务器拒绝处理请求，因为请求的消息体格式不受服务器支持。 |\n| 416 | 不支持的 URI 方案 | Request\
  \ URI 对服务器而言是未知的，因此服务器无法处理该请求。 |\n| 420 | 错误扩展 | 服务器无法理解从客户端收到的协议扩展。 |\n| 421 |\
  \ 需要扩展 | 接收到请求的 UA 需要特定的扩展才能处理该请求，但此扩展未列在请求的 supported 头字段中。 |\n| 423 | 间隔过短 | 服务器拒绝请求，因为请求所刷新的资源的过期时间太短。\
  \ |\n| 424 | 位置信息错误 | 此响应代码表示由于位置内容而拒绝请求。这表明位置信息格式错误或不令人满意（RFC6442）。 |\n| 428 |\
  \ 使用 Identity 头 | 当验证者收到缺少 Identity 头的 SIP 请求时发送此响应，以表示请求应附带 Identity 头重新发送（RFC4474）。\
  \ |\n| 429 | 提供引用者身份 | 此响应提供引用者身份（RFC3892）。 |\n| 433 | 不允许匿名 | 表示服务器拒绝满足请求，因为请求者是匿名的（RFC5079）。\
  \ |\n| 436 | 身份信息错误 | 当 Identity-Info 头中存在错误信息时使用此响应（RFC4474）。 |\n| 437 | 不支持的证书\
  \ | 当验证者无法验证 Identity-Info 头中 URI 引用的证书时使用此响应（RFC4474）。 |\n| 438 | 无效的身份头 | 当验证者（接收方\
  \ UA）收到带有 Identity 签名的消息，但该签名与验证者计算的摘要字符串不符时使用此响应（RFC4474）。 |\n| 470 | 需要同意 | 这是对包含\
  \ URI 列表的请求的响应，列表中至少有一个 URI 使得中继没有访问权限（RFC5360）。 |\n| 480 | 暂时不可用 | 被叫方的终端系统已成功联系，但被叫方当前不可用。\
  \ |\n| 481 | 呼叫/事务不存在 | 接收 UA 收到的请求与任何现有事务或对话框都不匹配。 |\n| 482 | 检测到环路 | 服务器检测到了环路。\
  \ |\n| 483 | 跳数过多 | 服务器收到的请求中 Max-Forwards 头字段的值为零。 |\n| 484 | 地址不完整 | 服务器收到的请求包含不完整的\
  \ Request-URI。 |\n| 485 | 有歧义 | Request-URI 不明确。响应中可以在 Contact 头字段中列出可能的地址。 |\n\
  | 486 | 此处忙 | 被叫方的终端系统已成功联系，但被叫方当前无法或不愿意通过此终端系统接听更多呼叫。 |\n| 487 | 请求已终止 | 请求已被 BYE\
  \ 或 CANCEL 请求终止。 |\n| 488 | 此处不可接受 | 不对 Request-URI 指定的特定资源进行接受。 |\n| 491 | 请求待处理\
  \ | 接收 UA 有一个待处理的请求。 |\n| 493 | 无法解密 | 请求包含加密的 MIME 消息体，接收方无法解密。 |\n\n## 5xx 代码\
  \ – 服务器错误\n\n5xx 代码，即服务器错误代码，表示服务器未能完成一个明显有效的请求。具体如下表所示：\n\n| 代码 | 事件名称 | 原因 |\n\
  |---|---|---|\n| 500 | 服务器内部错误 | 意外状况导致服务器无法完成请求。 |\n| 501 | 未实现 | 服务器不支持完成请求所需的功能。\
  \ |\n| 502 | 坏网关 | 网关或代理在尝试完成请求时，从所访问的下游服务器收到了无效响应。 |\n\n\n\n\n\n### 工作原理...\n\n\
  SIP 是一种应用层控制协议，用于在两个或多个终端节点之间建立、维护和终止通话。\n\nSIP 定义了两类基本的网络实体——客户端和服务器：\n\n- 客户端是发送\
  \ SIP 请求的实体（或应用程序）\n- 服务器是响应这些请求的实体（或应用程序）\n\n为了实现与其他网络类型的连接，我们使用网关。网关连接 SIP 与**公共交换电话网络（PSTN）**，或连接\
  \ SIP 与 H.323。\n\n如下图所示，客户端由**用户代理客户端（UAC）**和**用户代理服务器（UAS）**组成，每个客户端都可以发起或响应请求。\n\
  \n![](img/da40f92928403866599198344271d63e_886_0.png)\n\nSIP 服务器可以有多种类型：\n\n- **代理服务器：**\
  \ 它从用户代理或另一个代理接收 SIP 请求，并将请求转发或代理到另一个位置\n- **重定向服务器：** 它从用户代理或代理接收请求，并返回重定向响应（3xx），指明请求应发送到哪里\n\
  - **注册服务器：** 它接收 SIP 注册请求，并将用户代理信息更新到位置服务或其他数据库\n\n在下图中，你可以看到它们是如何协同工作的：\n\n![](img/da40f92928403866599198344271d63e_887_0.png)\n\
  \nIP 电话向注册服务器注册（1）。注册服务器与组织服务器核对（2），如果一切正常，则向提供商的代理发送 SIP 请求（3）。提供商的代理通过 DNS 服务器查询请求客户端域名的\
  \ IP 地址（4），然后将请求转发到目的地代理（5）。目的地代理发现客户端不在其位置，便向位置服务器查询其位置（6）。找到后，SIP 请求被转发到目的客户端（7）。目的客户端向发送方确认接受请求（8）。当一切就绪时，RTP\
  \ 会话在会话建立时 SDP 描述的 UDP 端口上打开（9）。\n\nSIP 消息的构建方式如下图所示：\n\n![](img/da40f92928403866599198344271d63e_888_0.png)\n\
  \n第一部分是请求行，其中包含：\n\n- 方法；本例中为 INVITE\n- 请求的 URI\n\n第二部分是消息头，其中包含：\n\n- Call-ID：提供通话的唯一\
  \ ID\n- From：指示通话的发起方\n- To：指示通话的接收方\n- CSeq：包含序列号，序列号由一个整数后跟请求方法组成。通话期间每个连续的请求都会有更高的\
  \ CSeq 序号，呼叫方和被叫方各自维护独立的 CSeq 计数。\n- Via：指示请求到目前为止所经过的路径，并指示响应路由时应遵循的路径。\n- Contact：包含一个或多个\
  \ SIP URI，向会话中的另一方提供联系发起用户所需的信息\n- **Allow**：指示允许哪些方法\n- **Supported**：指示是否支持诸如定时器之类的参数\n\
  - **Max-Forwards**：到达目的地所允许的最大跳数\n- **Content-Length**：消息体的字节数\n- **Message Body**：包含发送方支持的编解码器信息；例如，支持的定时器\n\
  \n## 分析 RTP/RTCP 连接\n\n在前一篇操作指南中，我们讨论了信令，即 SIP 和 RTP。在本篇中，我们将学习如何使用语音或视频呼叫本身，以及可能出现的问题。\n\
  \n问题总是始于用户抱怨语音或视频质量差、语音清晰度低、噪音等。\n\n另外，别忘了，在 Wireshark 中可能一切看起来正常，但应该进一步调整 IP PBX，例如增大传输音量。\n\
  \n### 准备工作\n\n当特定客户端出现问题时，使用端口镜像将 Wireshark 连接到客户端端口。当连接到同一链路的所有客户端都出现问题时，使用端口镜像将\
  \ Wireshark 连接到该链路。\n\n### 操作步骤...\n\n要定位性能问题，请执行以下步骤：\n\n- 1. 使用端口镜像连接 Wireshark\
  \ 后，开始捕获。\n- 2. 确保有正在进行的通话。\n- 3. 从**电话**菜单中，导航到 **RTP | 显示所有流**。这将显示你正在监控的端口上运行的所有\
  \ RTP 流。\n- 4. 将打开以下窗口：\n\n  ![](img/da40f92928403866599198344271d63e_893_0.png)\n\
  \n- 5. 需要重点关注的参数包括丢失的数据包、**最大差值（ms）**、**最大抖动（ms）**和**平均抖动（ms）**。\n\n#### 提示\n\n\
  对于 IP 上的交互式语音和视频，延迟值高于 300 ms（RTT）和抖动值高于 50 ms 被认为是有问题的。有关此主题的进一步讨论见本操作指南中的“工作原理...”部分。\n\
  \n出现延迟时，请按照以下步骤定位问题：\n\n- 1. 使用简单的 ping 测试检查网络两端之间的延迟：\n  - 1. 如果看到高延迟，请检查它是否对于您正在测量的通信线路是典型的（参见本操作指南中“更多内容...”部分的典型延迟列表）。\n\
  \  - 2. 如果是典型延迟，您无需在此处处理。请与电话和交换机提供商联系，寻求其设备的优化方案。\n  - 3. 如果延迟超出预期，请从您的笔记本电脑 ping\
  \ 这两部电话，并检查延迟来自何处。\n  - 4. 当您定位到延迟较高的链路时，沿链路逐步 ping，以查看延迟来自何处。\n  - 5. 同时，使用 Wireshark\
  \ 检查线路负载。延迟可能由负载引起，而且大多数情况下会伴随抖动出现。\n- 2. 延迟也可能来自以下来源：\n  - **拥塞链路：** 使用 Wireshark\
  \ 检查该情况。\n  - **路由器负载：** 使用提供商工具、SNMP 工具或路由器 CLI 来测量这些设备上的负载（请参阅提供商手册）。可能是 CPU 负载、内存负载等。\n\
  \  - **路由器缓冲区中的排队延迟：** 请查阅供应商手册。\n\n出现抖动时，请按照以下步骤定位问题：\n\n- 1. 使用与延迟测量相同的方法，尝试找出抖动来自何处。\n\
  - 2. 抖动可能来自多个来源：\n  - **线路拥塞：** 使用 `ping` 命令检查线路，看看是否存在问题\n  - **路由器负载（CPU/内存）：**\
  \ 请查阅供应商手册，了解如何监控这些参数\n\n出现数据包丢失时，请按照以下步骤定位问题：\n\n- 1. 使用 `ping` 命令检查链路上是否存在数据包丢失。\n\
  - 2. 如果是，请检查沿线设备是否有数据包丢失。\n- 3. 您也可以在数据包列表窗口中点击特定的 RTP 数据包，然后导航到 **RTP | 流分析**。它将显示该数据包所属流的各项参数。将打开以下窗口：\n\
  \n  ![](img/da40f92928403866599198344271d63e_895_0.png)\n\n- 4. 在窗口中，您将看到已打开流的以下参数：\n\
  \  - Packet：此参数表示捕获文件中的数据包数量。\n  - Sequence：此参数表示 RTP 序列号。\n  - Delta (ms)：这是流中当前数据包与上一数据包之间的时间差。\n\
  \  - Filtered Jitter (ms)：此参数表示真实到达时间与 RTP 时间戳参数之间的差。该值应尽可能低，最好为零。\n  - Skew (ms)：此参数表示数据包相对于其应有时间点是提前（或延迟）了多少。例如，如果数据包速率为每秒\
  \ 20 个数据包，则数据包之间应有 50 ms 间隔；如果一个数据包在上一个数据包之后 49 ms 到达，则偏斜为 -1 ms。\n  - IP BW (kbps)：此参数表示\
  \ IP 层的带宽消耗，即包含直到第 3 层的所有报头。\n  - Marker：此参数指示标记是否已设置（SET=1，UNSET=0）。标记指示各种现象，例如静默周期结束和视频帧结束，并由应用程序添加。\n\
  \  - Status：此参数允许您检查状态是否正常。\n\n- 5. 从摘要信息窗口中，我们可以看到最大抖动为 2.89\n\n\n\nms；这个值非常低，因此我们不应该在此处预期任何问题。\n\
  \n6. 在 RTP 流分析窗口下部中间位置单击 Graph 按钮，将会打开以下 IO 图表：\n\n![](img/da40f92928403866599198344271d63e_896_0.png)\n\
  \n7. 在这种情况下，我们可以看到网络看起来很好——抖动小于 2.500 ms。\n\n8. 当我们使用 Wireshark 且之前各点中测量的所有参数看起来都正常时，连接性问题很可能就是设备本身的配置问题。\n\
  \n9. 你可能会看到一些问题，例如序列号错误和时间戳错误（见以下截图）。这些错误通常是由于抖动和延迟问题引起的。\n\n![](img/da40f92928403866599198344271d63e_896_1.png)\n\
  \n## How it works...\n\nRTP 与 RTCP 结合使用（两者最初在 RFC 3550 中标准化）。RTP 用于承载媒体流（音频和视频），而\
  \ RTCP 用于监控传输统计信息和服务质量。在建立会话时，RTP 使用偶数端口，而 RTCP 使用下一个对应的奇数端口（高一位）。\n\nRTP 提供了定时恢复、丢失检测和纠正、负载和源标识以及媒体同步的机制。\n\
  \nRTCP 指定了在会话的源和目的地之间交换的报告。报告包含诸如发送的 RTP-PDU 数量、丢失的 RTP-PDU 数量、到达抖动等统计信息。这些报告可由应用程序用于修改发送方的传输速率，并用于诊断目的。\n\
  \n### RTP principles of operation\n\nRTP 位于 UDP 之上，UDP 位于 IP 之上。在下图中，你可以看到 RTP 数据包结构：\n\
  \n![](img/da40f92928403866599198344271d63e_899_0.png)\n\n头部中的字段如下：\n\n- **Version\
  \ (V)：** 此字段指示 RTP 版本\n- **Padding (P)：** 此字段指示数据包末尾包含一个或多个额外的填充字节，这些字节不属于负载\n-\
  \ **Extension bit (X)：** 此字段指示在标准头部之后跟随头部扩展\n- **CSRC count (CC)：** 此字段包含在固定头部之后跟随的\
  \ CSRC 字段的数量\n- **Marker (M)：** 此字段用于指示应用程序事件，例如视频帧边界\n- **Payload type：** 此字段标识\
  \ RTP 负载的格式，以便接收应用程序进行解释\n- **Sequence number：** 此字段在发送的每个 RTP 数据包时递增一。接收方用它来检测数据包丢失\n\
  - **Timestamp：** 此字段反映 RTP 数据流中八位字节的采样率\n- **Synchronization source (SSRC)：** 此字段是随机选择的流标识符，因此在同一\
  \ RTP 会话中不会有两个同步源具有相同的 SSRC 标识符\n- **Contributing source identifiers list (CSRC)：**\
  \ 此字段标识包含在此数据包中的负载的贡献源（即流源）\n\n在下图中，你可以看到序列号和时间戳机制的工作方式：\n\n![](img/da40f92928403866599198344271d63e_900_0.png)\n\
  \n正如我们在图中看到的，每个传输的 RTP 数据包的序列号都会增加一，而时间戳则按数据包所覆盖的时间增加。例如，数据包 1 的序列号和时间戳都设为 1；数据包\
  \ 2 的序列号为 2，时间戳为 12；其他数据包也以这种方式继续。接收方会收到序列号以告知数据包的顺序，以及时间戳以告知它们离开发送方的时间。接收方将同时使用这两者来回放接收到的数据。\n\
  \n### The RTCP principle of operation\n\nRTCP 有几种报告类型，其中发送方和接收方会相互更新已发送和接收的数据。在下图中，你可以看到一个示例，其中我们看到一个发送方报告，告诉接收方发送了多少个数据包和八位字节、时间戳信息以及接收方可用于的其他参数。\n\
  \n```\nFile Edit View Go Capture Analyze Statistics Telephony Tools Internals Help\n\
  Filter:\nExpression... Clear Apply Save SIP RTP\nNo. Time Source Destination Protocol\
  \ Info\n13014 89.845598 212.179.237.161 37.26.146.90 RTCP Sender Report Source\n\
  Frame 13014: 138 bytes on wire (1104 bits), 138 bytes captured (1104 bits)\nEthernet\
  \ II, Src: AcmePack_fa:60:80 (00:08:25:fa:60:80), Dst: All-HSRP-routers_1f\nInternet\
  \ Protocol Version 4, Src: 212.179.237.161 (212.179.237.161), Dst: 37.26.146.90\n\
  User Datagram Protocol, Src Port: 60131 (60131), Dst Port: 43555 (43555)\nReal-time\
  \ Transport Control Protocol (Sender Report)\n[Stream setup by SDP (frame 12022)]\n\
  10.. .... = Version: RFC 1889 Version (2)\n..0. .... = Padding: False\n...0 0001\
  \ = Reception report count: 1\nPacket type: Sender Report (200)\nLength: 12 (52\
  \ bytes)\nSender SSRC: 0x49424f58 (1229082456)\nTimestamp, MSW: 3550373021 (0xd39e649d)\n\
  Timestamp, LSW: 1766374618 (0x6948bcda) Timestamp information\n[MSW and LSW as NTP\
  \ timestamp: Jul 4, 2012 06:43:41.411266000 UTC]\nRTP timestamp: 87538356\nSender's\
  \ packet count: 246\nSender's octet count: 4920 Packets/Octets information\nSource\
  \ 1\nReal-time Transport Control Protocol (Source description)\nReal-time Transport\
  \ Control Protocol (Goodbye)\n```\n\n## There's more...\n\n延迟可能来自多个来源：\n\n- **Coding\
  \ delay：** 这是数字处理语音信号产生的延迟。\n- **Handling delay (packetization)：** 这是构建数据包并将语音信息插入其中的所需时间。\n\
  - **Serialization delay：** 这是在通信线路上传送数据包时产生的固定延迟。该延迟取决于数据包大小和线路速度。\n- **Typical\
  \ delays (round trip)：** 这是在通信线路上 ping 时可预期的延迟（以下所有点均指未加载的线路）：\n  - **Over a LAN：**\
  \ 延迟小于 1 ms。\n  - **Over a WAN connection：** 在短距离连接中延迟为 1–2 ms（最长 250–300 km / 150–190\
  \ 英里），在长距离连接中约为 15–20 ms（例如美国海岸到海岸）。在旧网络中，你可以再加上几十毫秒。\n  - **For home connections,\
  \ usually xDSL or CaTV：** 延迟在 10 到 25 ms 之间。\n  - **For inter-continent connections：**\
  \ 延迟在 100 到 200 ms 之间。\n  - **For cellular connections：** 延迟在旧的 2.5G 网络（GPRS 或 CDMA\
  \ 1X）中为 300 ms 至 600 ms，3.0G（UMTS 或 EVDO）为 120 至 150 ms，HSDPA、HSUPA 和 HSPA+ 为 60\
  \ 至 100 ms，LTE 网络则降至 20 至 50 ms。\n  - **For satellite communications：** 延迟为 500\
  \ 至 600 ms。\n\n### Tip\n\n通信线路上的延迟是光信号穿越距离所需的时间与服务提供商网络上的交换或路由延迟所消耗的时间之和。虽然自 2000\
  \ 年代初以来的技术（例如 MPLS 或运营商以太网）已在快速交换机和路由器中实现，但 2000 年之前的旧技术（如帧中继或 ATM）交换时间较慢，因此延迟会更高。\n\
  \n## Troubleshooting scenarios for video and surveillance applications\n\n在过去的 10\
  \ 到 12 年里，安全和监控系统在通信网络中扮演了更大、更重要的角色。我们在这些类型的网络中可能会看到的问题通常始于由于带宽不足导致的视频冻结，但也可能更复杂，正如本菜谱中所讨论的那样。在本菜谱中，我们将讨论这些系统的一些问题以及如何处理和解决它们。\n\
  \n### Getting ready\n\n通常，你会被叫去解决用户观看安防摄像头时遇到的问题。在这种情况下，你可以端口镜像特定的摄像头（1）、远程站点的通信线路（2）以及摄像头服务器（3），或者你可以使用过滤器监控到远程网络的中心线路（4）。\n\
  \n![](img/da40f92928403866599198344271d63e_904_0.png)\n\n\n\n\n\n## 操作步骤...\n\n\
  要识别此网络中的问题，请按照以下步骤操作：\n\n- 1. 首先，如果可能的话，在查看器与本地连接的摄像头（通过局域网）之间配置端口镜像。这样做时，你将能够记下所尝试的每种画面分辨率所需的带宽。\n\
  \n**提示：** 观看视频时，带宽最低可为 128 Kbps（用于低分辨率的极简单黑白电影），对于分辨率合理的黑白或彩色视频流，平均约为 0.5 到 1.0\
  \ Mbps，而高清流媒体（通常为 6 到 8 Mbps）则可达每秒数兆比特。\n\n- 2. 作为基本要求——确保你的带宽充足。\n  - 当画面冻结时，使用\
  \ I/O 图监控带宽。确保带宽充足且线路未完全占满。\n  - 为了确保你只查看摄像头或摄像头服务器所消耗的带宽，请配置一个过滤器，指向其 IP 地址。\n\n\
  **提示：** 视频流可以通过 UDP 和 RTP，或通过 TCP 传输。UDP 主要用于交互式应用，而 TCP 主要用于观看远程摄像头。\n\n- 3. 确保没有数据包丢失、明显延迟或抖动。\n\
  \  - 对于数据包丢失，请登录通信设备或使用 SNMP。\n  - 对于延迟和抖动，可以使用 `ping` 命令或图形工具（其中许多是免费的，例如来自 Colasoft\
  \ 的工具）。\n- 4. 在监控远程摄像头视频流时，如果出现短暂冻结，请导航到统计 | TCP 流图 | 时间序列（Stevens）。确保所有 I 帧和 P\
  \ 帧都按固定间隔接收。\n\n![](img/da40f92928403866599198344271d63e_906_0.png)\n\n- 5. 这里的问题是，客户现场有摄像头将视频传输到中央服务器，中央服务器再将视频传输到监视器。我们在上图中看到的是服务器延迟了部分\
  \ P 帧，这就是导致该情况下短暂冻结的原因。结果证明是服务器上的软件问题。\n- 6. 尝试登录摄像头服务器时，可能有多个端口正在使用，你可能无法看到画面；或者可能出现你获得了画面但其他内容不显示的情况。要验证所有\
  \ TCP 端口号都已开放，可以执行以下操作：\n  - 检查防火墙（如果你与摄像头服务器之间存在防火墙），确认连接是否被阻止。\n  - 在 Wireshark\
  \ 中，确保没有出现三次 SYN，这表明有某种东西阻止了你对服务器的访问。\n- 7. 在下面的截图中，你可以看到 HTTP 会话（1）如何在内部办公地址 10.0.0.3\
  \ 与网络摄像机的外部地址 82.82.182.182 之间运行（不要使用这些地址；它们只是示例值）。在第 2614 行，你会看到一个 SYN 数据包从 10.0.0.3\
  \ 发送到 82.82.182.182；该数据包在第 2615 个数据包中通过 TCP RST（重置）PDU（2）被阻止。相同事件还会再出现两次（3 和 4）。你看到一个已建立的连接并不表示没有其他连接正在尝试建立。\n\
  \n![](img/da40f92928403866599198344271d63e_907_0.png)\n\n- 8. 在这种情况下，HTTP 连接可以连接到\
  \ Web 服务器。要登录，需要打开另一个连接。由于登录连接被阻止，因此可以看到摄像头服务器，但无法登录并观看视频。\n\n## 工作原理...\n\n视频流由\
  \ **I 帧**（帧内编码帧）、**P 帧**（预测帧）和 **B 帧**（双向预测帧）组成。I 帧是包含完整画面的帧，而 P 帧包含相对于前一帧的变化。还有\
  \ B 帧，它也使用对下一帧的预测机制。\n\n在 TCP 中，每个视频帧（I、P 或 B）都被分散到多个 TCP 数据包中；因此，当你遇到 TCP 问题（重传等）时，会直接影响视频流。\n\
  \n## 更多内容...\n\n视频传输质量取决于你使用的编解码器、每秒传输的帧数、帧之间的时间间隔，以及可在摄像头或摄像头服务器上配置的更多参数。请确保所有参数都设置正确，以获得良好的画面。\n\
  \n## IPTV 应用的故障排查场景\n\nIPTV 应用在过去几年中变得越来越流行，同时越来越多的电视台正在转向互联网。在线学习应用以及其他各种类型的应用也越来越受欢迎。\n\
  \n基本上，IPTV 应用使用 TCP，你会遇到的问题大多是 TCP 问题，例如重传。在本方案中，我们将看到一些示例。\n\n### 准备工作\n\n当收到关于视频质量、画面冻结等问题的投诉时，请将\
  \ Wireshark 实例连接到设备或链路的端口镜像上。\n\n### 操作步骤...\n\n开始捕获，然后执行以下步骤：\n\n- 1. 打开 I/O 图，并确认存在缓冲类型的流量，如下面的截图所示：\n\
  - 2. 如果看到线路在顶部被阻塞，请检查你的互联网带宽并相应调整查看器（通常会自动完成）。\n- 3. 检查 TCP 重传、重复 ACK 和 TCP 窗口问题，如果发现任何问题，请逐一排查以找出干扰传输的原因。\n\
  \n![](img/da40f92928403866599198344271d63e_912_0.png)\n\n### 工作原理...\n\n从网络角度来看，IPTV\
  \ 只不过是一个在 TCP 连接上运行的简单应用程序。\n\n### 更多内容...\n\n在对它进行故障排查时，请按照[第 9 章](#)（UDP/TCP 分析）中介绍的常规\
  \ TCP 故障排查流程进行操作。\n\n## 视频会议应用的故障排查场景\n\n视频会议使用与标准电话相同的协议，但有一个区别：在电话中，每个方向只有一个数据流；而在视频会议中，每个方向有一个数据流和一个视频流。当你在终端设备上捕获数据时，会看到四个数据流：两个是你发送给对端的，另外两个是对端发回给你的。\n\
  \n另一个区别是，某些视频会议应用仍在使用 H.323 协议族，因此你需要排查的是 H.225 和 H.245 连接问题，而不是 SIP 问题。由于大多数应用使用\
  \ SIP 和 IETF 协议栈，因此我们只关注这些。\n\n## RTSP 故障排查\n\nRTSP 是一种应用层控制协议，用于控制一个或多个时间同步的连续媒体流（如音频和视频）。RTSP\
  \ 的目的是提供对远程媒体服务器的控制。当我们点击 **播放**、**暂停**等按钮时，就会使用它；它也可以用于邀请新的媒体服务器在屏幕上显示内容，例如用于会议。虽然\
  \ RTSP 是控制协议，但流媒体本身通常由 RTP（承载数据）和 RTCP（用于监控数据传输）来执行。\n\nRTSP 标准（RFC 2326）没有定义任何传输协议，但大多数实现使用\
  \ TCP。RTSP 在观看 IPTV 时通常会被用到。在本方案中，我们将学习如何监控和排查这些流。\n\n### 准备工作\n\n在遇到传输干扰的情况下，应使用\
  \ RTSP 监控；例如，媒体播放器控制出现问题，或者与服务器连接出现问题。RTSP 的工作方式如下图所示：\n\n![](img/da40f92928403866599198344271d63e_920_0.png)\n\
  \n在监控流时，我们可能会遇到 RTP/RTCP 问题（本章前面已讨论）、HTTP 问题（第 10 章 HTTP 和 DNS 中讨论），甚至 TCP 问题（第\
  \ 9 章 UDP/TCP 分析中讨论）。在本方案中，我们将讨论 RTSP（上图中带有长划线的中心线）。\n\nWeb 服务器和媒体服务器可以位于单个或多个物理服务器上，也可以位于不同的虚拟机上。无论哪种情况，功能均如图中所示。\n\
  \n\n\n\n\n## 如何操作...\n\n要查找RTSP问题，请将Wireshark实例通过端口镜像连接到遇到问题的客户端；如果有多个客户端，则将其连接到公共链路或服务器。\n\
  \n- 1. 要查看所有RTSP流量，请使用TCP端口554过滤数据包；对应的过滤器是`tcp.port==554`。\n\n### 提示\n\n过滤器`tcp.port\
  \ == 554`会显示该端口上的所有流量，而过滤器`rtsp`只显示Wireshark识别为RTSP头的数据包。\n\n- 2. 要查看RTSP请求和响应，请按本章前文所述，从**统计**菜单中选择**RTSP\
  \ | 数据包计数器**。错误响应是代码值高于400的响应。\n\n![](img/da40f92928403866599198344271d63e_921_0.png)\n\
  \n- 3. 查找4xx或更高的RTSP响应代码。为此，可以配置显示过滤器`rtsp.status >= 400`。\n\n## 工作原理...\n\n与SIP（用于信令，而RTP用于媒体传输）一样，RTSP控制的流可以使用任何传输协议；在许多情况下，它们也使用RTP。该协议在语法和操作上故意与HTTP相似，并使用相同的语法。\n\
  \n最常见的RTSP方法（命令）如下（C-客户端，S-服务器）：\n\n| 命令 | 方向 | 功能 |\n|---|---|---|\n| OPTIONS |\
  \ C到S或S到C | 确定服务器/客户端的能力 |\n| DESCRIBE | C到S | 获取媒体流的描述 |\n| ANNOUNCE | C到S或S到C\
  \ | 宣布新会话的描述 |\n| SETUP | C到S | 创建媒体会话 |\n| PLAY | C到S | 开始媒体传输 |\n| RECORD | C到S\
  \ | 开始媒体录制 |\n| PAUSE | C到S | 暂停媒体传输 |\n| REDIRECT | S到C | 重定向到另一台服务器 |\n| TEARDOWN\
  \ | S到C | 立即执行拆除 |\n\n响应类别如下：\n\n| 代码系列 | 类型 | 含义 |\n|---|---|---|\n| 1xx | 信息性\
  \ | 请求已收到，继续处理 |\n| 2xx | 成功 | 操作已成功接收、理解并被接受 |\n\n## 更多内容...\n\n在下面的截图中，您可以看到一个典型的RTSP流：\n\
  \n![](img/da40f92928403866599198344271d63e_925_0.png)\n\n典型的RTSP流按以下顺序处理：\n\n- 1.\
  \ 向服务器发送**DESCRIBE**请求，要求从该服务器检索请求URL所标识的演示或媒体对象的描述，服务器回复**200 OK**。\n- 2. **GET_PARAMETER**请求检索URI中指定的演示或流的参数值。\n\
  - 3. 发送**SETUP**请求以打开音频流，并用**200 OK**确认。\n- 4. 发送**SETUP**请求以打开音频流，并用**200 OK**确认。\n\
  - 5. 向服务器发送**PLAY**请求以开始播放流。\n- 6. 向服务器发送**SET_PARAMETER**请求，以设置URI指定的演示或流的参数值。\n\
  - 7. 流开始使用RTP播放。\n\n在下面的截图中，我们看到了流的分解过程：\n\n![](img/da40f92928403866599198344271d63e_925_1.png)\n\
  \n流的分解过程如下：\n\n- 1. 向服务器发送**SET_PARAMETER**，以设置URI指定的演示或流的参数值。\n- 2. 向服务器发送第二个**SET_PARAMETER**请求。\n\
  - 3. 发送**TEARDOWN**命令以关闭连接。\n"
- "## 第13章 排除带宽和延迟问题\n\n本章包含以下方案：\n\n- - 测量通信链路上的总带宽\n- - 通过网络连接测量每个用户和每个应用的带宽和吞吐量\n\
  - - 使用Wireshark监控抖动和延迟\n- - 发现与延迟/抖动相关的应用问题\n\n## 简介\n\n在测量通信线路时，我们应该注意四个主要参数：**带宽**、**延迟**、**抖动**和**数据包丢失**。虽然有些应用需要高带宽，但也有其他应用对延迟和抖动更敏感。数据包丢失会影响所有类型的应用，但有些应用对其更敏感，有些则不那么敏感。\n\
  \n在本章中，我们将学习如何测量这些参数，如何检查由此引起的网络问题，以及如何在可能的情况下解决它们。\n\n## 测量通信链路上的总带宽\n\n在本方案中，我们将了解如何测量通信线路上的总带宽。首先当然是要与服务提供商核实通信线路。检查它是对称线路还是非对称线路；如果是非对称线路，请检查两个方向上的带宽是多少。\n\
  \n## 准备工作\n\n您可能需要测试两种情况：\n\n- - 当您测量两个办公室之间的通信线路时：在这种情况下，将您的笔记本电脑（或网络上的任何PC）连接到局域网，并确认线路另一端是否有服务器或另一台PC\n\
  - - 当您测量到互联网的通信线路时，请确保您在**服务提供商（SP）**端或**互联网服务提供商（ISP）**端有一台测试服务器\n\n## 如何操作...\n\
  \n要检查通信线路上的带宽，请按照以下步骤操作：\n\n- 1. 询问以下详细信息：\n  1. 询问SP线路带宽是多少。\n  2. 如果是到互联网的线路，除了前一步外，还要询问ISP到互联网的带宽是多少。\n\
  - 2. 在远程位置找到服务器、PC或笔记本电脑。\n\n### 提示\n\n使用PC或笔记本电脑进行测试时，请不要忘记PC本身应足够强大以生成流量。一台标准的Windows\
  \ 7机器每个TCP连接大约能生成200 Mbps；当打开多个连接时，可能会遇到其他限制，如磁盘性能等。因此，建议先在局域网上试传输（实际上没有带宽限制），然后再测试SP或ISP线路。如果使用FTP，请使用高效的FTP工具（例如FileZilla）。当然，最好的方法是使用测试设备（如果可用）。专门的测试设备可从许多供应商处获得，例如VeEX、Fluke\
  \ Networks和IXIA。\n\n- - 如果您想测试两个站点之间的带宽，请在编号为1和2或编号为1和3的节点之间下载然后上传一个大文件。足够大的文件应能在线路上加载一段可观的时间，即一分钟或更长时间。例如，如果您想测试10\
  \ Mbps（兆比特每秒）的线路，请使用至少10/8 = 1.25 MB（兆字节）的文件。\n- - 如果您想测试到互联网的连接，通常可以先在服务提供商（下图中编号为1到4）上进行测试，然后再到互联网服务提供商（下图中编号为1到5）上进行测试。\n\
  \n### 提示\n\n如果可能，最好使用IP或UDP测试，因为复制文件是通过TCP进行的，所以可能会遇到影响测试的TCP问题。为此，请使用Iperf或其他可以生成IP或UDP流量的测试工具。\n\
  \n在下图中，您可以看到两个通过服务提供商（SP）线路连接的本地网络。左侧站点通过防火墙连接到互联网。到互联网的连接通过服务提供商（SP，服务器4）到达互联网服务提供商（ISP，服务器5）。\n\
  \n![](img/da40f92928403866599198344271d63e_932_0.png)\n\n按照以下步骤测量通信线路上的带宽：\n\n-\
  \ 1. 使用Wireshark的“统计 | IO 图”进行测试。\n\n### 提示\n\n不要忘记Wireshark在处理高带宽线路时有其自身的局限性。在这种情况下，您可以将其配置为使用多个文件。就我个人而言，在监控200-300\
  \ Mbps及更高带宽的线路时，我更喜欢使用其他工具（例如Omnipeek）。\n\n- 2. 测试企业网络时，您可以使用诸如Iperf（http://sourceforge.net/projects/iperf/）之类的软件工具。\n\
  \n\n\n\n\n以下是使用 IPerf 测量网络带宽的步骤：\n\n+   1. 在连接的两端都安装 Iperf。\n+   2. 将其中一侧配置为客户端，另一侧配置为服务器。\n\
  +   3. 开始测试并使用 I/O Graphs 验证您是否具有稳定的带宽。\n\n## Tip\n\n下载或上传文件时，请使用单个大文件而不是多个文件的目录。当传输许多小尺寸文件时，打开和传输每个文件都需要时间，因此测试结果不会很好。\n\
  \n当获得的带宽低于预期时，请执行以下步骤：\n\n+   1. 当获得的值比预期高或低约 5% 时，可能是由于本食谱中 There's more... 部分提到的原因。检查配置以及线路运行的技术（SDH/SONet、Carrier\
  \ Ethernet 等）\n+   2. 如果您使用文件复制测试线路，并在 IO 图表中看到锯齿状，可能线路上存在错误。检查 TCP 重传，然后检查连接到服务提供商的交换机/路由器端口的错误。\n\
  \n## Tip\n\n要检查交换机或路由器端口统计信息，您可以使用控制台或 telnet 连接到它并使用交换机或路由器命令（例如 Cisco 中的 **show\
  \ interface** 命令）。您也可以使用 SNMP 管理软件或任何 MIB 浏览器并浏览 `IfInErrors` 和 `InOutErrors` 对象。\n\
  \n+   3. 如果您看到降级为预期值的 80 到 90 百分比（例如，您测试 100 Mbps 的线路，得到 10 到 20 Mbps）；在大多数情况下，这是\
  \ **duplex-mismatch** 问题。如本食谱的 How it works... 部分所示。\n\n并不常见，但也可能是您的服务提供商存在配置问题。请与他们核实。如果以上情况均不成立，则可能是原因。\n\
  \n## How it works...\n\n首先，有两种不同的定义；区分它们很重要：\n\n+   - **Bandwidth**：这是在通信线路上可以传输的总比特每秒\n\
  +   - **Throughput**：这是连接两端之间传输的有效应用字节每秒\n\n要检查通信线路的带宽，您可以向服务提供商索取线路详细信息，或者您只需在上面传输一些流量，使用\
  \ Wireshark 或 SNMP 工具，看看您得到什么。\n\n大多数双工不匹配问题发生的情况是，当您在一侧使用以太网以 100 Mbps 全双工连接，而另一侧配置为自动协商时。\n\
  \n![](img/da40f92928403866599198344271d63e_934_0.png)\n\n正如您在图中看到的，当您将设备（本例中为路由器）连接到交换机时，当两侧都手动配置时，例如配置为\
  \ 100 Mbps 全双工（FDX），预期配置将会生效（前述图中编号为 1）。\n\n当将两侧都配置为自动协商时（前述图中编号为 4），也将正常，并且将自动设置为\
  \ 1 Gbps（在千兆适配器的情况下）。\n\n在其中一侧配置为 100 FDX 而另一侧配置为自动协商的情况下，自动协商将自动设置为 100 Mbps 半双工（HDX）。在这种情况下，当一侧设置为\
  \ HD 而另一侧设置为 FD 时，会丢失许多数据包，您\n\n## There's more...\n\n当我们在特定带宽下购买一条线路时，可能会得到比我们购买的略多或略少。例如，当我们购买\
  \ 10 Mbps 线路，且线路通过 **Synchronous Digital Hierarchy (SDH)** 或 **Synchronous Optical\
  \ Network (SONet)** 线路运行；10 Mbps 由 5 个 VC-12 组成，即 5*2.176 Mbps，因此总带宽将为 10.88 Mbps。\n\
  \n另一方面，如果例如我们通过互联网使用站点到站点 VPN，且线路为 10 Mbps，即使我们有非常好的互联网连接（例如两端连接到同一 ISP），VPN 本身的加密机制也会占用线路的\
  \ 5 到 10%，并且在测量时，您将得到大约 9.0 到 9.5 Mbps。在这种情况下，例如，当您通过线路传输文件时，您会看到线路以 10 Mbps 加载（即带宽），而文件复制可用的通常在\
  \ 9.0 到 9.5 Mbps 之间（即吞吐量）。\n\n## Measuring bandwidth and throughput per user and\
  \ per application over a network connection\n\n在许多情况下，我们不仅需要知道连接的总带宽（通信线路或服务器端口），还需要知道确切的消费者，即流量来自哪些\
  \ IP 地址和端口号。在本食谱中，我们将看到如何测量它。\n\n为了看到这一点，您可以使用从交换机收集数据的专有工具（**RMON1, RMON2, sFlow**）或路由器（**Cisco\
  \ Netflow** 或 **Juniper Jflow**），或使用 Wireshark 并将端口镜像到通信链路，这就是本食谱将要学习的内容。\n\n##\
  \ How to do it...\n\n要获取有关使用通信链路的用户和应用程序的基本统计信息，请执行以下步骤：\n\n+   - 对于总体统计：\n+   \
  \  1. 从 **Statistics** 菜单中选择 **Conversations**。\n+     2. 在 **Conversations** 窗口中，您可以看到迄今为止捕获的总数据包数统计信息。\n\
  +     3. 您也可以使用图形工具，例如 **Compass**（[Chapter 11](Chapter 11)，Analyzing Enterprise\
  \ Applications, Behavior）。\n+   - 对于流分析，使用带有 IP 地址和/或端口号过滤器的 IO 图表：\n+     1. 从\
  \ **Statistics** 菜单中选择 **IO Graphs**。\n+     2. 在 **IO graphs** 窗口（[Chapter 5](Chapter\
  \ 5)，Using Advanced Statistics Tools）中，配置 IP 和端口号以及您希望监控的应用程序的显示过滤器。\n+   - 对于持续监控，使用具有环形缓冲区的多个文件的\
  \ Wireshark，或使用 Netflow 或 Jflow 等工具进行路由器监控。\n\n## How it works...\n\n使用 Wireshark，正如我们在\
  \ [Chapter 1, Introducing Wireshark](#) 中学习的那样，我们捕获数据并分析它。\n\n在 Netflow、Jflow 以及从路由器收集数据的应用程序中，路由器会定期将收集的数据发送到分析它的管理控制台。\n\
  \n在 **Remote Monitoring 1 (RMON1)** 和 **Remote Monitoring 2 (RMON2)** 中，当终端交换机支持时，您可以使用读取\
  \ RMON1/RMON2 MIB 的 SNMP 软件访问数据。虽然 RMON1 为您提供第 1 层到第 2 层统计信息，但 RMON2 在实现时为您提供第 3\
  \ 层到第 4 层统计信息。RMON 的主要标准发布在 RFCs 2613、2819、3577 和 4502 中。在各种应用程序和设备中，例如防火墙、**Intrusion\
  \ Detection Systems (IDS)**、**Deep Packet Inspection (DPI)** 设备和 WAN 加速器，您将从受监控设备获取数据。\n\
  \n## Monitoring jitter and delay using Wireshark\n\n抖动和延迟是可能显著影响各种网络应用程序的特性。为了监控通信线路上的抖动和延迟，您可以使用简单的或图形化的\
  \ Ping 工具来显示线路特性。另一方面，Wireshark 不测量端到端延迟，但它对网络流量的影响，即帧间延迟以及它如何影响应用程序。\n\n在本食谱中，我们将看到如何使用\
  \ Wireshark 工具监控这些参数，并在下一个食谱中看到如何发现由它们引起的问题。\n\n## Getting ready\n\n为了监控通信线路上的延迟，首先使用\
  \ `ping` 命令来感受线路，然后将端口镜像配置到您要监控的端口。\n\n## How to do it...\n\n要监控帧间延迟：\n\n+   1.\
  \ 从 **Statistics** 中选择 **IO Graph**。\n+   2. 要监控特定数据流中帧之间的时间：\n+      1. 在 TCP 或\
  \ UDP 流中单击一个数据包。\n+      2. 单击 **Follow TCP Stream** 或 **Follow UDP stream**。\n\
  +      3. 复制显示的过滤器字符串（在下一张截图中编号为 1）。\n+   3. 从统计信息打开 **IO Graph**。\n+   4. 在 **IO\
  \ Graph** 中，在 **Y Axis** 部分（窗口右下角），选择 **Advanced...**（在以下图中编号为 2）。\n+   5. 将 **TCP\
  \ stream number**（在以下图中编号为 1）复制到 IO Graph 中的 **Filter** 字段（在以下图中编号为 3）。\n+   6.\
  \ 选择 **AVG(*)**（在前述图中编号为 4）。\n+   7. 配置过滤器 `frame.time_delta_displayed`（在前述图中编号为\
  \ 5）。\n+   8. 在图表中（在前述图中编号为 6），您可以看到帧间时间为毫秒。\n+   9. 通过导航到 **Statistics | TCP Stream\
  \ Graph | Round Trip Time Graph**，您\n\n![](img/da40f92928403866599198344271d63e_944_0.png)\n\
  \n\n\n\n\n## How it works...\n\n该软件只需在链路上捕获数据包，并显示它们之间的时间差。需要注意的是存在延迟或抖动，但我们看不到其来源。\n\
  \n**Delay** 是数据包从网络一端到另一端所需的时间。通常称为 RTT。延迟可以用简单的 Ping 或图形化 Ping 工具进行测量。延迟以秒为单位测量\
  \ – 毫秒（ms）、微秒（µs）等。\n\nIP 网络中的 **Jitter** 衡量延迟的变化。例如，如果我们平均延迟为 100 ms，且在 80 ms 到\
  \ 120 ms 之间变化，则抖动为 20%。\n\n## There's more...\n\n许多网站上都免费提供图形化 Ping 工具。你可以使用，例如，http://www.colasoft.com/download/products/download_ping_tool.php。\n\
  \n## Discovering delay/jitter-related application problems\n\n抖动和延迟会影响各种类型的应用程序。在运行于\
  \ TCP 上的应用程序中，高延迟会降低可以发送的有效吞吐量，而高抖动会导致数据包丢失和重传。在运行于 RTP 上的多媒体应用程序中，RTP 运行于 UDP 之上，高抖动和延迟会引起语音和视频质量的严重干扰。\n\
  \n在本配方中，我们将深入探讨：行为对 TCP 的影响，以及它如何影响应用程序行为。RTP over UDP 的行为已在第 12 章 SIP、多媒体和 IP 电话中讨论。\n\
  \n## Getting ready\n\n当你 ping 远程站点并得到高延迟，而在 Wireshark 中看到许多重传时，这可能是由于网络或应用程序延迟过高。将\
  \ Wireshark 连接到网络并将端口镜像配置到你要测试的链路。\n\n本配方的目的是检查 TCP 重传和重复 ACK 是否由于延迟和抖动或其他问题引起。\n\
  \n## How to do it...\n\n在遇到大量 TCP 重传时，执行以下测试：\n\n- 1. 检查重传是否来自同一应用程序或同一 IP 地址。在这种情况下，这是慢速应用程序或慢速设备，很可能不是网络延迟问题。\n\
  \n如果重传分布在各种应用程序和设备之间，则可能是由于不稳定的线路导致网络延迟。\n\n- 2. 配置显示过滤器 tcp.analysis.retransmissions（在下图中编号为\
  \ 1）。数据包列表中将出现所有重传的列表。\n\n![](img/da40f92928403866599198344271d63e_950_0.png)\n\n\
  - 3. 在数据包详细信息窗格下方，展开 TCP Analysis Flags，你将得到：\n  - 原始数据包被重传的时间（在前一图中编号为 2）。在本例中，为\
  \ 0.225003000 秒。\n  - 被重传的数据包（在前一图中编号为 3）。在本例中，为数据包编号 1779。\n\n- 4. 通常，重传超时（RTO）计时器对于本地连接约为\
  \ 0.2 秒，对于国际连接则高达 0.3 到 0.4 秒。先假设为 0.2 秒。参考本配方中的 How it works... 部分\n\n了解 RTO 机制的解释。\n\
  \n## 5. 要检查连接上的 TCP 延迟，请使用 IO Graphs 并使用以下过滤器，如下图所示：\n\n- `tcp.stream eq <the stream\
  \ number>` 要获取流号，右键单击数据包并选择 **Follow TCP stream**。\n- `frame.time_delta` 查看 TCP\
  \ 流中帧之间的时间差。此参数实际上显示第 2 层中的帧间 delta，但由于它仅针对流显示，因此它将向我们显示特定 TCP 流中的帧间 delta。\n\n\
  ![](img/da40f92928403866599198344271d63e_951_0.png)\n\n你得到一个显示非常稳定的连接的图表，延迟低于 20\
  \ ms，除了在时间 250s（捕获开始后 250 秒）时的两次延迟增加外，这导致了重传。\n\n## 6. 当我们在同一连接上添加 tcp.analysis.ack_rtt\
  \ 过滤器时，我们可以看到 TCP 数据包和 ACK 之间的延迟。\n\n![](img/da40f92928403866599198344271d63e_952_0.png)\n\
  \n在下图中，你可以看到一个图表，它是延迟并非由于线路延迟问题而导致的示例：\n\n![](img/da40f92928403866599198344271d63e_952_1.png)\n\
  \n7. 你可以在这里看到我已配置：\n\n- Y 轴中的 Advance 选项\n- Filter 字段：tcp.stream eq 0（在前一图中编号为 1）以呈现单个流\n\
  - 计算 AVG(*) 以查看平均值（2）\n- 你还可以配置 MAX(*) 和过滤器 tcp.analysis.ack_rtt 以查看\n\n确认每个 TCP\
  \ 序列所需的时间\n\n我们得到的是确认每个 TCP 数据包所需的时间。\n\n- 8. 现在，让我们配置 **IO Graphs** 以查看是否存在 TCP\
  \ 重传，以及它们为何发生：\n  - 使用相同的 IO Graph 并在 Y 轴中使用 **Advance**，并配置第二条线。\n  - **Filter**\
  \ 字段：**tcp.stream eq 0**（在前一图中编号为 1）以呈现单个流。\n  - 计算 **COUNT FRAMES(*)** 以查看平均值。\n\
  \  - 过滤器 `tcp.analysis.retransmissions` 以查看确认每个 TCP 数据包所需的时间。\n\n![](img/da40f92928403866599198344271d63e_953_0.png)\n\
  \n- 9. 我们可以从这里看出，所有重传都发生在延迟显著增加时，因此这是一个延迟问题。我们无法从这里判断延迟来自网络、终端设备还是应用程序，因此为了隔离问题，请检查重传的分布情况（参见\
  \ _第 9 章，UDP/TCP Analysis_）。\n- 10. 不是由于 RTT 增加而导致的重传很可能是由于数据包丢失。\n\n## How it works...\n\
  \nTCP 使用重传机制来确保在没有来自远程数据接收者的任何反馈的情况下进行数据交付。此计时器的持续时间称为 **Retransmission Time Out\
  \ (RTO)**。该机制首次在 RFC1122 中标准化，该规范规定 RTO 应按 Jacobson V. 和 M. Karels 的 Congestion\
  \ Avoidance and Control 文章（1988 年）中概述的方式计算。对此 RFC 的更新于 2000 年 11 月在 RFC 2988 中发布，后来在\
  \ RFC 6298 Computing TCP's Retransmission Timer，2011 年 6 月中发布。\n\n## There's more...\n\
  \n对于延迟变化，你还可以导航到 **Statistics | TCP Stream Graph | Round Trip Time Graph.**\n\n\
  在遇到高延迟时，它也会影响你从网络中获得的吞吐量。这就是所谓的带宽延迟乘积，如下图所示：\n\n![](img/da40f92928403866599198344271d63e_955_0.png)\n\
  \n从这里我们可以看出，延迟越高，吞吐量越低。在具有高延迟的网络中，例如旧的蜂窝网络、卫星线路和长距离国际线路，我们有几种方法可以提高应用程序的吞吐量。其中这些方法包括使用每个应用程序多个连接的应用程序，使用\
  \ TCP 增加窗口大小（作为默认在 Window Vista 及更高版本以及各种 Linux 版本中提供）。\n"
- "## Chapter 14. Understanding Network Security\n\n在本章中，我们将介绍以下配方：\n\n- Discovering\
  \ unusual traffic patterns\n- Discovering MAC- and ARP-based attacks\n- Discovering\
  \ ICMP and TCP SYN/Port scans\n- Discovering DoS and DDoS attacks\n- Locating smart\
  \ TCP attacks\n- Discovering brute-force and application attacks\n\n## Introduction\n\
  \n信息安全是信息系统中最迷人的领域之一，其目的是保护组织的系统免受可能以各种模式出现的内部和外部攻击。这些攻击可能来自互联网或内部网络，因此，它们都通过网络传输，因此，可以使用\
  \ Wireshark（以及后面提到的其他工具）进行监控。\n\n为了监控网络免受恶意流量，我们必须首先了解什么是正常流量。然后我们可以尝试找出恶意流量与正常流量有何不同。在异常流量中，我们可能会看到\
  \ ARP、IP 或 TCP 扫描、没有查询的 DNS 响应、异常 TCP 标志、未知 IP 地址或端口号，其用途我们不了解，等等。\n\n了解安全问题和网络问题之间的区别并区分它们也很重要。例如，ICMP\
  \ 扫描可能是恶意软件扫描网络，也可能是发现网络的管理软件，而 TCP SYN 扫描可能是蠕虫，也可能是软件错误。我们将在每个配方中详细阐述这些内容。\n\n\
  在本章中，我们将首先区分正常和异常网络流量，然后了解各种类型的攻击，它们来自何处以及如何隔离和解决它们。\n\n\n\n\n\n## 发现异常流量模式\n\n\
  在本教程中，我们将了解什么是正常和异常流量模式，以及如何区分它们。\n\n### 准备工作\n\n第一件事是定位 Wireshark。有如下几个选项（见下图）：\n\
  \n1. 当你怀疑攻击来自互联网时，将 Wireshark 放在防火墙之后（1）；当你怀疑攻击穿过了防火墙时，将其放在防火墙之前（2）。\n2. 当你怀疑恶意流量来自远程办公地点时，在路由器之前（3）或之后（4）对中心线路上的流量进行端口镜像。在这种情况下，你可以使用\
  \ IP 网络过滤可疑流量，查看来自不同办公地点的流量模式，以隔离有问题的办公地点。\n3. 你也可以在远程办公地点的路由器之前（7）或之后（6）对流量进行端口镜像。\n\
  4. 当一台 PC 或服务器成为怀疑对象时，在交换机上对其端口进行端口镜像（5）或（8）。\n\n![](img/da40f92928403866599198344271d63e_959_0.png)\n\
  \n现在，我们将尝试了解我们应该关注哪些类型的流量、哪些类型的流量是正常的，以及哪些流量应该被跟踪。\n\n在开始测试之前，请确保你拥有最新的网络拓扑，其中包含：\n\
  \n- 服务器的 IP 地址和局域网的 IP 地址范围\n- 路由器、交换机和其他通信设备的 IP 地址和拓扑\n- 安全设备——防火墙、**入侵检测系统/入侵防御系统（IDSs/IPSs）**、**Web\
  \ 应用防火墙（WAF）**、数据库和应用防火墙、防病毒系统，以及任何其他拥有 IP 地址并生成、过滤或转发网络流量的设备\n- 网络上运行的应用程序有哪些，包括\
  \ TCP/UDP 端口号和软件的 IP 地址\n\n### 如何操作...\n\n当你监控组织内部流量时，应检查以下内容：\n\n1. 来自已知地址（组织内）的流量：\n\
  \   - **正常：** 来自已知地址和地址范围的流量\n   - **可疑：** 来自/前往你不知道的地址的流量\n2. 应用程序和端口号：\n   - **正常：**\
  \ 包括标准端口号，80（HTTP）、137/8/9（NetBIOS）、3389（RDP）、20/21（FTP）、25、110（邮件）、53（DNS）等。要确定网络上运行的应用程序，并验证这些是你看到的唯一端口号。\n\
  \   - **可疑：** 包括不常见的端口号，即不属于服务器上运行的应用程序的端口号（例如，发往 Web 服务器的 RDP 数据包）。\n3. TCP 模式：\n\
  \   - **正常：** TCP SYN/SYN-ACK/ACK 表示连接建立，单个重置（RST）表示快速连接拆除，FIN/FIN-ACK 数据包表示正常连接拆除，以及标准数据包和确认\n\
  \   - **可疑：** 大量发往单个或多个目标或来自多个来源的 SYN 数据包（通常是以扫描模式出现，本章后面会介绍）、异常的标志组合（RST/FIN、URG）等\n\
  4. 大量发往你不知道的单个或多个站点的流量：\n   - **正常：** 流量模式通常不是固定带宽。当你保存或打开文件、浏览互联网、发送或接收邮件，或通过 RDP\
  \ 访问服务器时，你会看到流量有升有降。\n   - **可疑（某些情况下）：** 固定带宽模式可能表明有人连接到了你的设备，但也可能表明有人在通过互联网收听广播（100-150\
  \ Kbps）、观看视频（某些情况下）等。当你看到固定带宽的流量模式时，请检查它是什么。下面的截图展示了一种固定带宽模式：\n\nWireshark IO Graphs:\
  \ Tel Hashomer station warm 1-JAN-2013 Test 02 --- LS38cast-EXE.pcapng\n\n5. 广播：\n\
  \   - **正常：** NetBIOS 广播、ARP 广播（不太多）、DHCP（不太多）、应用程序广播（通常每隔几秒或更长时间一次）等\n   - **可疑：**\
  \ 每台设备每秒数十、数百、数千甚至更多的广播\n6. DNS 查询和响应：\n   - **正常：** 偶尔每个客户端每秒最多几十次的标准查询-响应模式\n\
  \   - **可疑：** 大量 DNS 查询和/或响应、没有查询的响应等\n\n### 工作原理...\n\n网络取证与你在电视上看到的警匪剧非常相似。出现了问题；于是，你前往犯罪现场（即你的网络）寻找证据（即网络中留下的痕迹）。\n\
  \n你要寻找的是与犯罪现场（你的网络）不匹配的东西、遗留的东西（异常流量模式）、指纹和 DNA（能够识别攻击者的模式）。\n\n在接下来的教程中，我们将详细了解可能表明发生犯罪的各种攻击和异常，并学习如何隔离和解决这些问题。\n\
  \n一些可能来自网络的常见攻击包括：\n\n- **病毒：** 这些是攻击你的计算机并试图造成损害的小程序。病毒应由防病毒软件发现并清除。\n- **蠕虫：**\
  \ 这些通常是试图在网络中自我复制的程序。它们对资源消耗有重大影响，例如带宽消耗和 CPU 负载。重要的是，一旦你解决了问题，一切就会恢复正常。\n- **拒绝服务（DoS）和分布式拒绝服务（DDoS）：**\
  \ 这些攻击会拒绝网络资源的访问。这类攻击通常很容易发现，因为它们具有容易定位的独特行为。\n- **中间人攻击：** 在这种攻击中，攻击者拦截消息，然后重新发送它们。这样，攻击者可以窃听流量或在流量到达目的地之前修改它。\n\
  - **扫描：** 有多种类型的扫描，从通常属于 DDoS 形式的简单 ICMP 扫描，到 TCP 扫描（例如，向各种端口号发送 SYN 请求，试图建立与服务器上运行的服务的连接），再到试图连接到你服务器上运行应用程序的应用扫描。\n\
  - **应用层攻击：** 这些攻击通过在服务器操作系统或应用程序中故意制造故障，针对你服务器上的应用程序。\n\n在接下来的教程中，我们将逐一介绍它们（以及更多）。\n\
  \n### 更多内容...\n\n一个重要的异常迹象是，网络中的服务器、PC、通信链路或任何其他实体无缘无故变得缓慢。例如：\n\n- 当服务器变慢时，检查硬件和软件问题，检查网络问题，同时还要检查是否有人正在攻击它\n\
  - 当从远程办公地点到中心的链路变慢时，可能是由于负载（持续或突然），但也可能是因为攻击（通常是 DoS/DDoS）导致其阻塞\n- 当 PC 变慢时，可能是因为它在执行你已知的某些操作，但不止一种可能性，要检查你未知的情况\n\
  \n这里需要提到的是，有多种系统可以保护我们免受攻击；下面列出了其中一些：\n\n- **防火墙：** 它们阻止未经授权的流量进入特定区域。防火墙可以位于互联网连接处、组织服务器之前、组织区域之间，甚至可以作为每台\
  \ PC 上的个人防火墙。\n- **网络访问控制（NAC）：** 这些系统只允许授权用户连接到网络。当未经授权的设备连接到网络时，你会看到该设备上的链路会被开启并立即关闭，未授权设备将在\
  \ MAC 层被阻止。\n- **IDS/IPS：** 这些系统可以识别入侵模式并阻止它们。这里通常有两道防线——一道在 ISP 网络，一道在客户场所。IDS/IPS\
  \ 可以是位于防火墙和互联网之间的专用设备，也可以是防火墙上的附加软件。\n- **Web 应用防火墙（WAF）、应用防火墙、数据库防火墙和其他应用保护设备：**\
  \ 这类产品是第 7 层保护设备，它们检查应用程序内部并转发或阻止应用层攻击。\n- **Web 过滤器和邮件过滤器：** 这些设备扫描邮件和/或 Web 内容，只转发允许的消息和流量。\n\
  \n上述功能可以以不同设备的形式出现，可以作为虚拟机（VM）上的软件，也可以作为同一设备上的功能。\n\n\n\n\n\n## 另见\n\n在本方案中，我们讨论了一些安全组件。下面是一些示例：\n\
  \n- **防火墙**：Checkpoint（[www.checkpoint.com](www.checkpoint.com)）、Juniper SSG 系列（[http://www.juniper.net/us/en/products-services/security/ssg-series/](http://www.juniper.net/us/en/products-services/security/ssg-series/)）、Cisco\
  \ ASA 系列（[http://www.cisco.com/en/US/products/ps5708/Products_Sub_Category_Home.htm](http://www.cisco.com/en/US/products/ps5708/Products_Sub_Category_Home.htm)）以及其他许多产品。\n\
  - **NAC**：这一类中，例如有 Forescout（[http://www.forescout.com/solutions/network-access-control/](http://www.forescout.com/solutions/network-access-control/)）和\
  \ Enterasys（[http://www.enterasys.com/company/literature/nac-ds.pdf](http://www.enterasys.com/company/literature/nac-ds.pdf)）。\n\
  - **IDS/IPS**：这一类中，例如有 Juniper IDP 设备系列（[http://www.juniper.net/us/en/products-services/security/idp-series/](http://www.juniper.net/us/en/products-services/security/idp-series/)）和\
  \ Check Point 防火墙软件刀片（[http://www.checkpoint.com/products/ips-software-blade/](http://www.checkpoint.com/products/ips-software-blade/)）。\n\
  - **WAF**：这里例如有 Imperva（[http://www.imperva.com/products/wsc_web-application-firewall.html](http://www.imperva.com/products/wsc_web-application-firewall.html)）和\
  \ F5（[http://www.f5.com/glossary/web-application-firewall/](http://www.f5.com/glossary/web-application-firewall/)）。数据库防火墙也可用，例如来自\
  \ Imperva（[http://www.imperva.com/products/dsc_database-firewall.html](http://www.imperva.com/products/dsc_database-firewall.html)）和\
  \ Oracle（[http://www.oracle.com/us/products/database/security/audit-vault-database-firewall/overview/index.html](http://www.oracle.com/us/products/database/security/audit-vault-database-firewall/overview/index.html)）。\n\
  - **Web 和邮件过滤**：这里例如有 McAfee（[http://www.mcafee.com/au/products/email-and-web-security/index.aspx](http://www.mcafee.com/au/products/email-and-web-security/index.aspx)）、Blue\
  \ Coat（[http://www.bluecoat.com/security-policy-enforcement-center](http://www.bluecoat.com/security-policy-enforcement-center)）和\
  \ Websense（[http://www.websense.com/content/Home.aspx](http://www.websense.com/content/Home.aspx)）。\n\
  \n## 发现基于 MAC 和 ARP 的攻击\n\nWireshark 可以轻松发现多种类型的基于 MAC 的第 2 层攻击以及第 2/3 层 ARP 攻击。这些攻击通常由扫描器（在下一个方案中介绍）和中间人攻击（在第\
  \ 8 章“ARP 和 IP 分析”的“使用 ARP 分析连接问题”方案中介绍）引起。在本方案中，我们将看到一些典型的攻击模式及其含义。\n\n### 准备工作\n\
  \n当在网络中看到过多的 ARP 请求或非标准的 MAC 地址时，将 Wireshark 通过端口镜像连接到它们的来源，然后开始捕获。\n\n### 操作步骤...\n\
  \n若要查找基于 ARP/MAC 的攻击，请按以下步骤操作：\n\n1. 将 Wireshark 连接到网络上的任意端口。\n2. 查找大量的 ARP 广播。由于\
  \ ARP 请求是广播，它们会分布在整个第 2 层网络中（即单个 VLAN 内）。在下面的截图中，你可以看到典型的 ARP 扫描模式。需要注意的是，这种 ARP\
  \ 扫描可能是一个以这种方式工作的应用程序，例如，用于发现网络的 SNMP 软件，以及使用免费 ARP 的路由器。只有当它来自无法识别的来源时，才说明存在问题。\n\
  \n   ![](img/da40f92928403866599198344271d63e_970_0.png)\n\n3. 还有一些可疑的 MAC 模式。当你看到以下情况时，可以识别出它们：\n\
  \   - 两个相同的 MAC 地址对应不同的 IP 地址。这可能是同一网络适配器上配置了两个 IP 地址，这是正常的；但也可能是一种攻击模式，即有人将其 MAC\
  \ 地址改成了服务器的 MAC 地址（这可以在任何适配器上实现）。\n   - 上述情况也可能表示中间人攻击，如第 8 章“ARP 和 IP 分析”中“ARP\
  \ 欺骗和中间人攻击”一节所述。\n\n### 工作原理...\n\nARP 向网络发送广播，询问某个特定 IP 目的地的 MAC 地址。任何不符合此模式的行为都应被视为恶意行为。\n\
  \n### 补充说明...\n\nARP 请求也可能来自发现网络的 SNMP 软件（自动发现功能）、发送免费 ARP 的 DHCP 服务器等。每当你看到 ARP\
  \ 在扫描某些内容时，这不一定是问题；关键在于谁发送了这些请求。关于 ARP 过程的更多信息，请参阅第 8 章“ARP 和 IP 分析”。\n\n## 发现 ICMP\
  \ 和 TCP SYN/端口扫描\n\n扫描是将数据包发送到网络设备的过程，目的是查看谁在响应 ping 请求、查找正在监听的 TCP/UDP 端口，并发现网络上有哪些类型的共享资源，包括系统和应用程序资源。\n\
  \n### 准备工作\n\n扫描攻击通常通过以下方式被发现：用户抱怨网络响应缓慢、管理系统发现服务器或通信线路上的异常负载，以及攻击进行时，识别可疑使用模式的**安全信息和事件管理系统（SIEM）**也会检测到攻击。在这些情况下，将带有端口镜像的\
  \ Wireshark 部署在尽可能靠近你怀疑受到感染的区域，然后开始捕获。\n\n### 操作步骤...\n\n要发现问题，请按以下步骤操作：\n\n1. 在靠近问题的接口上启动\
  \ Wireshark 并开始捕获：\n   - 如果通往互联网的线路变慢，就对这条线路进行端口镜像；\n   - 如果服务器变慢，就对服务器进行端口镜像；\n\
  \   - 如果远程办事处变慢，就对通往它们的线路进行端口镜像。\n2. 如果你发现 Wireshark 没有响应，这很可能是因为你遇到了一次非常猛烈的攻击，每秒产生数千甚至更多数据包，导致\
  \ Wireshark（或你的笔记本电脑）无法处理。在这种情况下，停止 Wireshark（如有必要，在 Windows 中按 Ctrl+Alt+Del，或在\
  \ Unix 中使用 kill 命令），并将其配置为捕获多个文件（参见第 1 章“Wireshark 入门”中的“开始捕获数据”方案）。\n3. 你可能会看到各种模式，它们都有相同的行为——在大多数情况下是大规模扫描、ICMP\
  \ 或 TCP，但也有其他类型。理解它们的最好方式是通过一些示例来观察。\n4. 在下图中，你会看到一个遭受攻击的网络。来自所有远程站点的用户都抱怨网络非常慢。他们都在访问图中左侧的中心服务器。\n\
  \n   ![](img/da40f92928403866599198344271d63e_975_0.png)\n\n   当我将 Wireshark 连接到某个远程站点时（如下图所示），我看到了大量\
  \ ICMP 请求（3），它们来自 LAN 192.168.110.0（1），发往随机目标（2）。这是随机的吗？\n\n   ![](img/da40f92928403866599198344271d63e_976_0.png)\n\
  \n   另外，请注意数据包之间的时间间隔。如果是扫描行为，这个间隔通常非常短。\n\n   当你进入“统计 | 会话”时，会看到一些有趣的现象：\n\n  \
  \ ![](img/da40f92928403866599198344271d63e_976_1.png)\n\n   当我们按地址 A（1）对表格排序时，会看到一种\
  \ ICMP 请求模式，这些请求来自网络 192.168.110.0 上的不同地址（这里只显示其中很小一部分，即 192.168.110.12 正在扫描网络）。\n\
  \n   这种蠕虫只是用 ICMP 请求扫描网络。一旦有人响应，蠕虫也会感染该主机；几分钟后，所有通信线路都会被从远程办事处发出的 ICMP 请求阻塞。\n\n\
  ### 提示\n\n### 结论\n\n当你在通信信道或链路上看到大量 ping 扫描，也就是数千甚至更多个 ping 时，应检查是否存在问题。可能是 SNMP\
  \ 软件在发现网络，但也可能是蠕虫，它会淹没你的通信线路或服务器链路（或两者）。\n\n5. 另一种常见的扫描类型是 TCP-SYN 扫描。在这种情况下，攻击者使用\
  \ TCP-SYN 包扫描随机 TCP 端口，等待某个主机以 SYN-ACK 响应。一旦发生这种情况，攻击者有两种选择：\n   - 攻击者继续发送 SYN 包并接收\
  \ SYN-ACK，从而在被攻击设备上留下大量半开连接；\n   - 攻击者以 ACK 回应，从而建立连接，并像在 DoS/DDoS 攻击中那样让连接保持打开，或试图利用这条连接危害被攻击设备。\n\
  6. TCP-SYN 扫描会呈现为以下截图中的某种模式：\n   - 你会看到大量 SYN 包，而受攻击节点没有返回任何响应。\n\n   ![](img/da40f92928403866599198344271d63e_977_0.png)\n\
  \n   - 你会看到大量 SYN 包，并且每个 SYN 包都会收到一个 TCP RST 包作为响应。这通常发生在你为正在遭受攻击或即将遭受攻击的设备配置了防火墙时。\n\
  \n\n\n\n\n![](img/da40f92928403866599198344271d63e_978_0.png)\n\n- 您也可以看到连续的 SYN\
  \ 和 RST 数据包。当有端口号处于开启状态时，您会看到扫描器与受害主机建立连接时完整的 SYN/SYN-ACK/ACK 过程，如下图所示：\n\n![](img/da40f92928403866599198344271d63e_978_1.png)\n\
  \n- 7. 始终留意异常的流量模式。例如，过多的 ICMP 请求就是扫描的一个明显迹象。注意是否有针对客户端的多个 ICMP 请求、ICMP 时间戳请求、按升序或降序排列的\
  \ ICMP 请求等。这些模式可能表明存在恶意扫描。\n  - 当您怀疑有扫描时，点击目标（地址）列标题，即可按目标地址对数据包列表排序。这样更容易看出扫描模式。\n\
  \  - 下面的截图展示了这种情况的一个示例：\n\n![](img/da40f92928403866599198344271d63e_979_0.png)\n\
  \n8. 对于应用层扫描，可能存在多种类型：\n\n- **NetBIOS 扫描**：寻找对 NetBIOS 端口的大规模扫描\n- **HTTP**：寻找对\
  \ HTTP 80 端口的 SYN 请求，以及后续的 HTTP 请求\n- **SMTP**：寻找对 TCP 25 端口的大规模扫描\n- **SIP**：寻找对\
  \ 5060 端口的大量请求\n\n其他类型的应用根据其端口号被扫描。\n\n## 工作原理...\n\n大多数扫描器分几个步骤工作：ARP 扫描、ICMP，然后是\
  \ TCP 或 UDP。其原理很简单：\n\n- 如果扫描器位于局域网内，它会向整个局域网发送 ARP 广播。\n- 扫描器发送 ICMP 请求，部分 ICMP\
  \ 请求会得到应答。\n- 当有人应答 ARP 或 ICMP 请求时，扫描器会上升到 TCP 和 UDP 层，开始扫描第 4 层端口。当扫描器发现某个端口开放时，便会开始应用层扫描。\n\
  - 在应用层扫描中，扫描器向应用程序发送命令，试图让应用程序回应，从而尝试攻破它。\n\n## 补充内容...\n\n近年来，大多数现代入侵检测/防御系统（IDS/IPS）都知道如何处理\
  \ ICMP 扫描、TCP SYN 扫描以及各种产生大量标准、已知攻击模式流量的扫描类型。如果您拥有此类系统，并且您通过具备相应系统的 ISP 连接互联网，那么您可能已经免受这些简单类型的攻击。\n\
  \n这些系统通常以两种方式工作：\n\n- 基于 NetFlow/Jflow 的 IDS/IPS，可识别来自多个源的大量流量；通过阻止或修改路由表来使这些数据包无法到达\
  \ ISP 网络，从而中和攻击。\n- 基于内容的 IDS/IPS，检查流量模式，并据此决定是否转发。\n\n来自内部网络的攻击不会被外部设备过滤，因此更为常见。本章后面的“定位智能\
  \ TCP 攻击”配方中会讨论更复杂的攻击类型。\n\n防止来自互联网攻击的方法是，通过具有高效 IDS/IPS 系统的 ISP 连接，同时使用自己的防护系统。防止来自内部网络攻击的方法是，实施组织安全策略，并配合适当的防护软件，如防病毒软件和个人防火墙。\n\
  \n## 另请参阅\n\n在上一节中，我提到了组织安全策略的问题，即如何实施一套规则来保护您的组织。有关此主题的更多信息，在互联网上广泛可得。一些涵盖此领域的有趣网站包括：\n\
  \n- http://www.cert.org/work/organizational_security.html\n- http://www.praxiom.com/iso-17799-4.htm\n\
  - http://www.sans.org/reading-room/whitepapers/policyissues/1331.php\n- http://www.sans.org/security-resources/policies/\n\
  \n## 发现 DoS 和 DDoS 攻击\n\n**拒绝服务（DoS）** 和 **分布式拒绝服务（DDoS）** 是旨在拒绝用户访问网络服务的攻击。可能被拒绝的服务包括：\n\
  \n- **通信线路**：这通常通过产生大量流量来淹没和阻塞通信线路实现。\n- **应用程序和服务（Web 服务、邮件服务等）**：这通常通过将服务器加载到无法处理客户端请求的程度来实现。\n\
  \nDoS/DDoS 攻击可能是我们之前配方中讨论的扫描的结果。区别在于，DoS/DDoS 是一种以拒绝用户访问的方式拖慢服务器或网络的扫描。\n\n在本配方中，我们将看到一些常见的\
  \ DoS/DDoS 模式，并学习如何识别和阻止它们。\n\n## 准备就绪\n\nDoS/DDoS 通常在某个网络资源（即通信线路或服务器）变得非常缓慢且无法正常工作时被发现。\n\
  \n当您识别到此类资源时，使用端口镜像将 Wireshark 连接到该设备并开始数据包捕获。在本配方中，我们将介绍一些常见的 DoS/DDoS 攻击及其特征。\n\
  \n## 操作步骤...\n\n将 Wireshark 连接到网络，对您怀疑遭受 DoS/DDoS 攻击的资源端口进行端口镜像。通常，这可能是变得非常慢的服务器、负载过重的通信线路，或任何其他停止运行或变得非常慢的资源。\n\
  \n- 1. 当通信线路（例如互联网连接）变得非常慢时，使用端口镜像将 Wireshark 连接到该线路。\n- 1. 尝试定位流量来自哪里。\n- 2. 我对服务器做了端口镜像，然后得到了以下结果：\n\
  \n![](img/da40f92928403866599198344271d63e_985_0.png)\n\n- 3. 我们看到源地址按升序排列，向互联网地址\
  \ 94.23.71.12 产生流量。\n\n### 提示\n\n当您查看配置为“相对前一个显示数据包的时间”的时间列时，您会看到帧与帧之间只有 11-12 微秒。当您看到\
  \ TCP-SYN 以这种速率到达时，肯定有问题。检查一下！\n\n- 4. 由于源地址未知，我检查了它们的 MAC 地址。得到的结果是：\n\n![](img/da40f92928403866599198344271d63e_986_0.png)\n\
  \n5. 问题是所有源地址都来自同一个 MAC 地址；所以我检查了它们的 MAC 地址，所有 IP 地址都来自同一个 MAC 地址，即服务器的 MAC 地址。\n\
