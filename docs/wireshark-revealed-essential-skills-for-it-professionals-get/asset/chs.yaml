  ## 翻译


  我认为这一令人惊叹且相当酷的功能并未得到应有的关注，所以我想让您知道，Wireshark 允许您将语言更改为您选择的任何其他语言，例如西班牙语、日语、中文（实际上是普通话）、波兰语、法语等等，而且此功能从
  1.99 版本开始就已存在。


  赋予用户将应用的默认语言更改为其母语的权利，完全是为了在使用应用时个性化用户体验。如果用户感觉与应用更贴近、更舒适，那么他们一定会变得更高效。


  让我们通过一个示例来看看如何将系统的默认语言更改为日语（该功能随 2.0 版本推出）。请按照以下步骤操作：


