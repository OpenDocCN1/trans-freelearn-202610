- "## 第4章 检查应用层协议\n\n本章将带你了解常见的应用层协议，并让你更容易发现任何异常。你将通过研究最常见的协议来理解和分析应用层协议的正常行为，并了解它们常见和不常见的行为。\n\
  \n- DNS——正常与异常\n- 实验——DNS\n- FTP——正常与异常\n- 实验\n- HTTP——正常与异常\n- 实验——HTTP\n- SMTP——正常与异常\n\
  - 实验——SMTP\n- SIP——正常与异常\n- 实验——SIP\n- VoIP——正常与异常\n- 实验——VoIP\n- 解密加密流量\n- 练习题\n\
  \n我们将介绍一些最常见的应用层协议，这些协议支配着当今大大小小的网络。我不想花费太多时间，直接带你踏上这段精彩的协议之旅。\n\n## 域名系统\n\n想象一个互联网世界，你必须输入一串随机的数字值（IP\
  \ 地址）而不是名称来访问网站。同时，假设每个数字都不同。那么，你能记住多少个 IP 地址呢？5 个？10 个？也许最多 50 个？因此，你只能访问 50 个网站。这听起来确实不可行。\n\
  \n假设你不只是记住 IP 地址，而是将每个地址记下来，并在后面写上你想给该网站起的名称，以便弄清楚哪个网站有什么用途。这样，你可以为自己创建一个 Excel\
  \ 文件，其中 IP 地址写在你为网站起的名称旁边。通过这种方式，你或许可以收集超过一千个网站地址供以后使用。\n\n为了让你拥有不受限制的网络体验，DNS 会来拯救你，它所做的事情与你在上一个例子中做的完全一样。DNS\
  \ 创建一个包含网站及其 IP 地址以及域名的数据库。区域文件中的一行记录通常被称为资源记录。区域文件中的每条记录都被称为资源记录。DNS 默认在端口 53 上分别使用\
  \ TCP 和 UDP 来实现不同目的。\n\n作为客户端，当你尝试从局域网环境访问网站时，你的请求会通过内部 DNS 服务器发送，该服务器会查找它所包含的资源记录。这个请求被称为\
  \ DNS 查询。如果你的 DNS 服务器已经保存了你所查找域名的 IP 地址，你的客户端机器将收到来自内部 DNS 服务器的回复，其中包含你正尝试访问的网站的\
  \ IP 地址。这样，你就可以构建 IP 数据包并开始通信。这个回复被称为 DNS 响应。\n\n### 剖析 DNS 数据包\n\n一个 DNS 数据包由几个独特的字段组成，下面简要介绍：\n\
  \n- **事务 ID**：这是一个数字，用于将特定域名查询与其对应的响应连接起来。\n- **查询/响应**：每个 DNS 数据包根据其包含的内容被标记为查询或响应。\n\
  - **标志位**：每个查询和响应都设置了不同的标志位，如下所示。\n  - **响应**：该消息是查询还是响应。\n  - **操作码**：这决定了所包含查询的类型。操作码范围在\
  \ 0–15 之间。请参考下表：\n\n| 操作码 | 描述 |\n|---|---|\n| 0 | 标准查询 |\n| 1 | 反向查询 |\n| 2 | 服务器状态请求\
  \ |\n| 3 | 未分配 |\n| 4 | 通知 |\n| 5 | 更新 |\n| 6–15 | 未分配 |\n\n- **截断**：这决定数据包在尺寸较大（大于\
  \ 512 字节）时是否被截断。\n- **期望递归**：如果你要查找的资源记录不存在，你的客户端发送的查询预计会从一个 DNS 服务器到另一个 DNS 服务器进行递归搜索过程。\n\
  - **可用递归**：如果该位被设置，则表示你的客户端请求的递归是可用的，并且如果你在一个服务器上找不到所需内容，你的查询将被转移到另一个 DNS 进行查找过程。\n\
  \n- 保留（z）：如 RFC 1035 所定义；保留供将来使用，所有查询和响应都必须设置为零。\n- 响应码：此字段中的值表示响应。\n\n- 响应码：此字段用于表示是否存在错误以及错误的类型。以下是你可能收到的可能代码值：\n\
  \n| 代码 | 描述 |\n|------|-------------|\n| 0 | 无错误 |\n| 1 | 格式错误 |\n| 2 | 服务器故障 |\n\
  | 3 | 名称错误 |\n| 4 | 未实现 |\n| 5 | 拒绝 |\n\n- 问题数：表示数据包中存在的查询数量。\n- 回答数：表示对发送查询的响应中答案的数量。\n\
  - 权威资源记录数：表示作为响应发送的权威资源记录数量。\n- 附加资源记录数：表示作为响应发送的附加资源记录数量。\n- 查询区：发送到 DNS 服务器的查询，在收到的响应中也应相同。\n\
  - 回答区：作为对我们查询的响应而来的答案。响应也可以有多个。答案基本上由响应我们查询的资源记录组成。\n- 类型：此字段表示发送的查询类型。常见查询类型请参考下表。\n\
  \n| 类型 | 描述 |\n|------|-------------|\n| A | 主机地址 |\n| NS | 名称服务器 |\n| MX | 邮件交换\
  \ |\n| SOA | 起始授权机构 |\n| PTR | 指针记录 |\n| AAAA | IPv6 地址 |\n| AXFR | 全区域传输 |\n| IXFR\
  \ | 增量区域传输 |\n\n- **附加信息**：此字段包含包含资源记录的附加信息。它不是回答查询所必需的。\n\n### 剖析 DNS 查询/响应\n\n\
  客户端向拥有名称解析信息的 DNS 服务器发送查询。利用这些信息，客户端可以开始基于 IP 的通信。有时，客户端查找的信息在它所请求的 DNS 服务器上不可用。在这种情况下，如果期望递归，DNS\
  \ 服务器本身会将查询传输到它知道的任何邻居 DNS。整个查询和响应过程仅通过两个数据包完成。请参考下面的图 4.1，我正在尝试访问 https://www.google.co.in。来自我位于\
  \ 192.168.1.103 的客户端的请求被发送到位于 192.168.1.1 的默认网关。该网关会将我的查询转发到它所知道的 DNS 服务器：\n\n![](img/da40f92928403866599198344271d63e_1149_0.png)\n\
  \n图 4.1：DNS 查询\n\n如果你注意到，这里 DNS 使用 UDP 作为底层协议。如果你想了解更多关于生成的 DNS 查询的信息，只需展开标志部分。该部分将列出各种详细信息，例如递归是否可用、是否期望递归、查询是否被截断、响应码是什么、查询的操作码是什么等等。请参考以下截图。\n\
  \n\n\n\n\n```text\n▼ Flags: 0x0100 Standard query\n    0.... .... .... .... = Response:\
  \ Message is a query\n    .000 0.... .... .... = Opcode: Standard query (0)\n  \
  \  .... ..0. .... .... = Truncated: Message is not truncated\n    .... ....1 ....\
  \ .... = Recursion desired: Do query recursively\n    .... .... .0.. .... = Z: reserved\
  \ (0)\n    .... .... ....0 .... = Non-authenticated data: Unacceptable\n```\n\n\
  展开的 Flags 部分表明该 DNS 数据包的类型是查询，数据包未被截断，并且如果可用，则期望进行递归查询。\n\n针对此查询，你将看到另一个具有相同事务 ID\
  \ 的数据包，它表示特定查询的关联。这就是响应数据包。对我们查询的响应通常包含我们要查找的域的 IPv4 地址。我们会收到一个 IP，或者可能收到多个可用 IP。如果我们查找的域不可用，那么可能会返回其可能的\
  \ CNAME。\n\n请参阅图 4.2 来理解这一点：\n\n```text\n▷ Frame 10: 154 bytes on wire (1232 bits),\
  \ 154 bytes captured (1232 bits) on interface 0\n▷ Ethernet II, Src: Zte_07:73:6c\
