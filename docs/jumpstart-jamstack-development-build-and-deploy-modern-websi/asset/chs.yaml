- "## 前言\n\nJamstack（JavaScript、API 和标记）通过利用 Gatsby、Sanity 和 Netlify 等工具，使 Web 开发人员能够创建和发布以速度、安全性和可访问性为核心的现代且易于维护的网站和\
  \ Web 应用。使用 Jamstack 工作的开发人员将通过这份关于静态站点生成和内容管理的实用指南，很好地利用他们的知识。这本 Jamstack 书籍采用实践方法，介绍实施和相关方法论，让您迅速掌握现代\
  \ Web 开发。\n\n通过逐步解释核心概念、实用示例和自测问题，您将从构建活动和场地模式结构开始，然后扩展功能，探索 Jamstack 所提供的所有内容。您将学习如何构建一个示例\
  \ Jamstack，如何使用模式构建结构化内容，如何使用 GraphQL 公开内容，以及如何使用 Gatsby 通过页面和模板组件构建活动网站。最后，您将把网站部署到\
  \ Netlify 服务器。\n\n读完本书后，您将获得使用 Jamstack 安装、配置、构建、扩展和部署简单活动网站所需的知识和技能。\n\n### 本书面向读者\n\
  \n本书面向希望实际实施 Jamstack 的 Web 开发人员。希望构建现代、快速且安全的 Web 应用的 JavaScript 开发人员也会发现本书很有用。假设读者熟悉\
  \ JavaScript 和数据库编程。\n\n### 本书内容\n\n*第 1 章，Jamstack 的历史*，为您提供 Web 设计和开发历史的概览，以及后端驱动网站面临的问题，即安全性、速度、可访问性、托管和部署问题。\n\
  \n*第 2 章，Sanity 简介*，教您如何使用基于网络的示例项目创建工具创建 Sanity.io 网站。\n\n第 3 章，探索 Sanity Studio，向您介绍\
  \ Sanity Studio，一个结构化内容管理工具。然后，您将学习如何配置网站以及创建、修改和删除内容。\n\n第 4 章，Sanity 配置与模式，帮助您理解\
  \ Sanity.io 内容模式的术语和语法，以及它们如何定义内容结构。您还将学习如何定义实体之间的一对一关系和一对多关系。\n\n第 5 章，Sanity 的\
  \ GROQ 语言，向您介绍 GROQ，即 Sanity.io 查询其数据的专有方式。将展示它与标准 SQL 的相似之处和不同之处，并详细说明各种示例。\n\n\
  第 6 章，Sanity 的 GraphQL 游乐场，向您介绍 Sanity.io 的 GraphQL 游乐场，如何启动它，以及它与标准 GraphQL 有何不同。您将学习如何获取单条记录类型或多条记录。\n\
  \n第 7 章，Gatsby – 简介，向您介绍 Jamstack 的 J 部分。您将了解 GatsbyJS，一个基于 ReactJS 的静态生成器，它被创建的原因，它是如何构建的，以及它解决的问题。最后，您将了解涉及的相关配置文件和关键文件（如\
  \ ssr 和 node）。\n\n第 8 章，Gatsby 与 GraphQL，向您介绍 Gatsby 的 GraphQL 工具，以及它与标准 GraphQL\
  \ 有何不同。本章将帮助您理解如何通过 Gatsby 源代码使用 GraphQL 将源内容连接并服务于静态站点生成器。\n\n第 9 章，Gatsby 源插件，将向您介绍由\
  \ Jamstack 社区构建的各种插件，这些插件允许 GatsbyJS 连接到各种类型的知名后端系统，从文件系统到现有的 CMS 框架，如 Drupal。\n\
  \n第 10 章，构建 Gatsby 组件，将向您介绍 Jamstack 的 M 部分，即标记，以及 Gatsby 的构建块：组件，同时学习页面、模板和部分的结构以及它们之间的差异。您将学习如何创建、编辑和扩展组件。\n\
  \n第 11 章，API – 扩展 Gatsby，向您介绍 Jamstack 的 A 部分，即 API，以及如何在编译 Web 页面的动态部分中使用它们，以重现\
  \ Web 开发人员在传统基于服务器的 Web 开发中熟悉的功能。\n\n\n\n\n第 12 章，API – Alexa 技能，将教你如何构建 Jumpstart\
  \ Jamstack Alexa 技能。作为一个示例，你可以询问即将到来的五个事件。通过这个示例，你可以通过检索过去的事件或所有事件来扩展当前的技能，你还可以为任何其他应用程序创建一个新的技能。\n\
  \n第 13 章，整合所有部分，将教你如何修改 CSS 以及网站的最终元素，以及如何配置和发布 GatsbyJS 生产构建。\n\n第 14 章，使用 Netlify\
  \ 和 Azure 部署，将介绍 Netlify 无服务器持续部署托管服务。你将学习如何将网站的仓库连接到 Netlify，以及 Netlify 如何准备和组合各种文件，以形成一个快速、高效执行的单一静态文件。\n\
  \n第 15 章，结论，将总结全书所学的概念，讨论各个部分如何结合在一起，并探讨 Jamstack 社区如何发展。本章将讨论各种外部项目以及如何为它们做贡献。\n\
