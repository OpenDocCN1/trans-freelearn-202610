- "# 4 Sanity Configuration and Schemas\n\n在上一章中，我们学习了如何使用 Sanity Studio。在本章中，我们将学习如何从\
  \ GitHub 克隆项目，安装其依赖项，学习如何启动本地开发环境，并检查文件结构。然后，我们将学习模式是如何构建的，以及如何修改它们，学习关系。这将使您能够轻松地修改模式，通过在浏览器中查看托管版本来在本地测试模式。\n\
  \n本章将涵盖的主要主题如下：\n\n- Modeling content with schemas\n- Schema relationships\n- Extending,\
  \ modifying, and deploying the schema\n\n这在以下屏幕截图中显示：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_61_0.png)\n\
  \nFigure 4.1 – The GitHub Code clone modal – SSH mode\n\n- 第二种方法使用 HTTPS，其中 username\
  \ 是 GitHub 用户名，repository 是实际仓库。请注意与 SSH 方法略有不同的格式：\n\n```text\ngit clone https://github.com/username/repository.git\n\
  ```\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_61_1.png)\n\nFigure 4.2 – The GitHub\
  \ Code clone modal – HTTPS mode\n\n这两种方法都将在同一文件系统级别创建以仓库名称命名的文件夹。SSH 方法允许使用受密码保护的\
  \ SSH 密钥，因此是首选方法。\n\n## Exploring the project's folders\n\n在本节中，我们将检查项目的文件夹和文件的内容。有几个重要文件和几个文件夹。我们将检查的第一个文件是\
  \ `sanity.json` 文件。该文件位于项目的 `studio` 文件夹中。\n\n### Examining the sanity.json file\n\
  \n以下是 `sanity.json` 文件的前几行：\n\n```json\n{\n  \"root\": true,\n  \"project\": {\n\
  \    \"name\": \"Hands On JAMstack\"\n  },\n  \"api\": {\n    \"projectId\": \"\
  abc123d4\",\n    \"dataset\": \"production\"\n  },\n}\n```\n\n该文件包含两个重要值：`projectId`\
  \ 和 `dataset` 名称：\n\n- `projectId`：`projectId` 值唯一定义项目，意味着没有其他人会拥有此 ID。`projectId`\
  \ 由字母和数字组成。\n\n- `dataset`：然而，`dataset` 值不是唯一的，将用于标识此 Sanity Studio 实例当前使用的是哪个数据集。例如，可以选择\
  \ `production` 来表示模式和数据的最终版本，而 `development` 则表示即将进行的更改。模式和实际内容都包含在数据集中。每个数据集都是完全独立的，Sanity\
  \ Studio 可以加载其中任何一个数据集，但一次只能加载一个模式。\n\n此外，`root` 设置为 `true` 以指定此文件是项目的主要 `sanity.json`\
  \ 文件，因为插件可能有自己的 `sanity.json` 文件。插件中找到的 `sanity.json` 文件将 `root` 设置为 `true`。\n\n\
  \n\n\n\n## 检查 schemas 文件夹\n\n接下来，我们将检查 `studio` 文件夹中的 `schemas` 文件夹。在两个子文件夹——`documents`\
  \ 和 `objects` 中，我们会找到一组文件，每个 schema 一个。每个文件都是一个 JavaScript 文件，包含一个对象。以下代码示例展示了具有最少字段的\
  \ schema 文件格式：\n\n```javascript\nexport default {\n    name: 'siteSettings',\n \
  \   type: 'document',\n    title: 'Site Settings',\n}\n```\n\n文件以 `export` 关键字开始。`export`\
  \ 关键字意味着此 JavaScript 模块可通过使用 `import` 语句在调用文件中被使用。下一个关键字是 `default`。此关键字意味着将使用此单个对象。最后，对象本身随后出现，使用打开和关闭的括号。对象中三个基本属性，即键值属性对，是\
  \ `name`、`title` 和 `type`。\n\n## name\n\n在 schemas 中使用的 `name` 属性始终代表一个单一实体。`name`\
  \ 值必须是单个单词，并且按惯例应与文件名称匹配，但当然不带扩展名。\n\n**驼峰命名法**，因其最像的动物而得名，被使用。标准格式如下：第一个单词以小写表示，第二个单词及之后的单词首字母大写。例如，正确的\
  \ `name` 属性值将是 `siteSettings`。\n\n## title\n\n下一个重要属性是 `title`。此属性旨在作为 schema 实体的可读描述，可以包含空格和其他特殊字符。它在\
  \ Sanity Studio 中显示。因此，它应是一个清晰定义其所代表内容的词。例如，对应的标题可以是 `Site Settings`。\n\n## type\n\
  \n接下来，schema 类型决定 schema 是文档还是对象。文档将在 Sanity Studio 的主导航中列出。对象是对实体的更抽象表示，例如两个文档之间的关系，或用作文档内的构建块，例如包含地址、城市和邮政编码等多个字段的地址块。\n\
  \n自动创建的默认项目使用两个目录——documents 和 objects，以帮助通过按类型对 schemas 进行分组来组织项目。\n\n## Author\
  \ schema\n\n对于下一步，检查 documents 目录中 `author.js` 文件的结构。\n\n## Schema 定义\n\n如以下代码示例所示，fields\
  \ 属性是一个数组。方括号的使用是一种表示列表或项目集合的语法。一开始，项目列表是空的。它将被填充以包含字段列表：\n\n```javascript\nexport\
  \ default { \n    name: 'author',\n    type: 'document',\n    title: 'Author',\n\
  \    fields: [\n    ],\n}\n```\n\n所有实体必须至少包含一个字段。fields 数组中的每个对象都遵循与实体本身相同的格式，至少包括\
  \ name、title 和 type。\n\n## Schema 字段\n\n最简单的示例可能是 name 字段，表示作者的姓和名：\n\n```javascript\n\
  export default { \n    name: 'author',\n    type: 'document',\n    title: 'Author',\n\
  \    fields: [\n      {\n        name: 'name',\n        type: 'string',\n      \
  \  title: 'Name'\n      },\n    ]\n}\n```\n\n在前面的代码示例中，我们已将 name 属性放在 `fields` 数组内。此数组为\
  \ string 类型，这基本上意味着一个简短的短语或标签，没有任何关联的格式，如粗体斜体。\n\n> **注意**\n> \n> `title` 属性应代表内容编辑者可以识别的词或短语，并在\
  \ Sanity Studio 中显示。\n\n每个字段还可以使用另外三个属性：\n\n- `description` 是关于字段应如何使用的更长描述。\n-\
  \ `readOnly` 禁用 Sanity Studio 中的编辑。\n- `hidden` 将字段从 Sanity Studio 中隐藏。\n\nreadOnly\
  \ 和 hidden 字段将以编程方式修改，而不是由使用界面的人员修改。\n\n## Schema 字段类型\n\n有多种类型可供使用。截至撰写时，除 document\
  \ 外，以下类型可用：\n\n- Array\n- Block\n- Boolean\n- Date\n- Datetime\n- File\n- Geopoint\n\
  \n在此示例中，此 schema 的类型为 address，因此 author 将通过 address reference 链接到 address，如下所示：\n\
  \n```javascript\nexport default {\n    name: 'author',\n    type: 'document',\n\
  \    title: 'Author',\n    fields: [\n    {\n        name: 'name',\n        type:\
  \ 'string',\n        title: 'Name'\n    },\n    {\n        name: 'address',\n  \
  \      type: 'reference',\n        to: {type: 'address'}\n    }\n    ]\n}\n```\n\
  \n在 Sanity schema 中，我们使用 reference 类型和一个额外的属性 to。to 属性接受指定类型的对象。\n\n## 一对多关系\n\n\
  同样，schema 可以与许多 schema 相关，甚至是各种类型。一个简单示例是作者为多个出版机构撰稿：\n\n```javascript\n{\n    name:\
  \ 'publishers',\n    title: 'Publishers',\n    type: 'array',\n    of: [\n    {\n\
  \        type: 'reference',\n        to: '[{type: 'publisher'}]'\n    }\n    ]\n\
  }\n```\n\n在此示例中，type 字段为 array，因此在 Sanity Studio 内部，可以从出版商列表中选择一个或多个出版商。请注意，此字段被命名为\
  \ \"publishers\" 以显示该字段代表多个出版商，然而关系是到类型为 publisher 的 schema，而 schema 名称始终是单数。\n\n\
  在本章的第一部分，我们学习了 schema 的结构。在下一节中，我们将学习如何修改 schemas。\n\n## 扩展、修改和部署 schema\n\n对于本书中使用的示例，我们将创建一个新闻和活动网站。此过程中的第一步是在\
  \ document 目录中创建一个名为 event.js 的文件，它将代表我们的 event schema。\n\n## The event schema\n\
  \n以下代码段是 event 的 schema，展示了其各个字段：\n\n```javascript\nexport default {\n    name:\
  \ 'event',\n    type: 'document',\n    title: 'Event',\n    fields: [\n        {\n\
  \            name: 'name',\n            type: 'string',\n            title: 'Name'\n\
  \        },\n        {\n            name: 'dateAndTime',\n            type: 'datetime',\n\
  \            title: 'Date and Time'\n        },\n        {\n            name: 'venue',\n\
  \            type: 'reference',\n            to: {type: 'venue'}\n        },\n \
  \       {\n            name: 'virtual',\n            type: 'boolean',\n        \
  \    title: 'Virtual Event'\n        },\n        {\n            name: 'eventUrl',\n\
  \            type: 'url',\n            title: 'Event URL'\n        },\n        {\n\
  \            name: 'location',\n            type: 'geopoint',\n            title:\
  \ 'Location'\n        },\n        {\n            name: 'telephone',\n          \
  \  type: 'string',\n            title: 'Telephone'\n        },\n        {\n    \
  \        name: 'email',\n            type: 'string',\n            title: 'Email'\n\
  \        },\n        {\n            name: 'website',\n            type: 'url',\n\
  \            title: 'Website'\n        }\n    ]\n}\n```\n\nvenue schema 还包含一些有用的字段类型，例如\
  \ geopoint，它将允许我们利用 Google Maps API 自动完成地址，以及提供输入验证的 URL。\n\nschemas 文件夹现在应具有以下文件：\n\
  \n```text\nschemas\n    documents\n        author.js\n        category.js\n    \
  \    event.js\n        post.js\n        siteSettings.js\n        venue.js\n```\n\
  \n## The schema file\n\n为了使 Sanity 能够识别新的 schema，该 schema 必须添加到 studio/schemas 文件夹中的\
  \ schema.js 文件中。让我们看看如何操作：\n\n1. 在文件顶部通过 import 语句添加文件，位于以 import siteSettings 开始的行之后：\n\
  \n```javascript\n// document schemas\nimport siteSettings from './documents/siteSettings'\n\
  //insert these two rows\nimport event from './documents/event'\nimport venue from\
  \ './documents/venue'\n```\n\n2. 将导入的 schema 添加到 schema 类型列表中：\n\n```javascript\n\
  types: schemaTypes.concat([\n// The following are document types which will appear\n\
  // in the studio.\nsiteSettings,\n//insert two rows here\nevent,\nvenue,\n...\n\
  ])\n```\n\n## 部署 schema\n\n要查看 schema 更改，必须部署它们。当我们部署某物时，我们将其从一个环境移动或复制到另一个环境，通常是生产环境，在那里可以被其他人员和事物使用。在这里，我们将把\
  \ schema 的更改推送到可在浏览器中查看的环境中。在项目目录的根目录下，使用 npm 或 yarn 安装依赖项。\n\n通过在终端中输入以下命令之一并按\
  \ Enter 执行：\n\n```bash\nyarn install\n```\n\n或\n\n```bash\nnpm install\n```\n\n\n\
  \n现在可以按照上一章中的方法查看**添加新事件**屏幕。\n\n下图是**添加新事件**屏幕的示例。请注意**虚拟活动**的单选按钮，它是从模式（schema）中指定的布尔值自动创建的：\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_75_0.png)\n"
- "# 5 Sanity 的 GROQ 语言\n\n在本章中，我们将探索 GROQ，这是 Sanity 的一个开源查询语言。我们将学习 GROQ 的创建原因，以及如何使用\
  \ GROQ 和 Vision 插件与我们的 Sanity Studio 数据集进行交互。我们还将比较 GROQ 和 SQL，然后使用 GROQ 执行基本和高级查询。\n\
  \n通过学习 GROQ 是什么以及如何使用它，我们可以迅速开始用它来编写自定义查询，以获取经过筛选和排序的数据。\n\n本章将涵盖以下主题：\n\n- 为什么选择\
  \ GROQ？\n- GROQ 与 SQL 的比较\n- 使用 GROQ 进行基本查询\n- 高级 GROQ\n\n### 技术要求\n\n本章需要一个网络浏览器和终端仿真器。\n\
  \n本章的代码文件位于 https://github.com/PacktPublishing/Jumpstart-Jamstack-Development/tree/chapter_five。\n\
  \n### 为什么选择 GROQ？\n\n数据存储是定义 Sanity 的最重要部分。Sanity 是为结构化内容而构建的，其丰富程度超过简单的二维表格。同样，GROQ\
  \ 旨在比用于查询数据库的传统 SQL 更强大且更易用。GROQ 代表图导向查询语言（Graph Oriented Query Language），因此，正如名称所暗示的那样，它是一种用于查询图的语言，而图能够表示更复杂的数据结构。\n\
  \nGROQ 有四个主要特性：\n\n- **富有表现力的筛选：** 这允许我们使用可读的语法构建查询。如果我们正在查找名为 Will's Pub 的场所，那么我们只需使用以下表达式，它等同于：类型为场所且场所名称为\
  \ Will's Pub：\n\n  ```\n  _type == \"venue\" && name == \"Will's Pub\"\n  ```\n\n\
  - **连接（Joins）：** GROQ 可以连接多个文档，并将结果组合在一起。\n- **整形（Shaping）：** 你可以决定包含哪些内容字段，或者重命名字段名称，重新格式化结果数据结构，甚至可以使用父文档的值在投影内进行额外的筛选。\n\
  \n  尽管这种获取信息的方式对于许多熟悉 SQL 数据库的数据库开发人员来说是一种相当大的范式转变，但随着经验的积累，GROQ 可以变得非常容易使用。此外，由于\
  \ GROQ 是开源的，所有代码都可以被检查。\n- **简洁性：** 与标准 SQL 相比，GROQ 更简洁，冗词更少。在大多数情况下，语法更简练——就像 ES6\
  \ 比 ES5 更简练一样。\n\n在终端中位于 studio 目录下输入以下命令，即可在 http://localhost:3333 找到的页面顶部显示 Sanity\
  \ Studio 的工具栏：\n\n```\nsanity start\n```\n\n两个主要工具——**仪表板**和**工作台**会自动安装。为了能够针对实际数据集尝试\
  \ GROQ 查询，我们将安装第三个工具，称为**Vision**。Vision 为我们提供了一种输入查询并即时查看结果数据集（可选地经过筛选和排序）的方式。这将帮助我们在代码中使用\
  \ GROQ。\n\n### 安装 Vision\n\n要安装 Vision，请按照以下步骤使用终端命令行：\n\n1. 在 `studio` 文件夹内，输入以下命令：\n\
  \n   ```\n   sanity install @sanity/vision\n   ```\n\n   安装成功后，**Vision** 图标应与本地\
  \ Sanity Studio 应用程序中的其他工具一起显示：\n\n   ![](img/97ab031f38e2174e2f1b51da18dfa1d0_79_0.png)\n\
  \n   图 5.1 – 顶部导航栏\n\n2. 点击**Vision** 图标，将出现一个允许用户执行 GROQ 查询的屏幕：\n\n   ![](img/97ab031f38e2174e2f1b51da18dfa1d0_79_1.png)\n\
  \n   图 5.2 – 用于 GROQ 查询的 Vision 屏幕\n\n在顶部导航栏中，**DATASET**（数据集）选择器允许用户选择使用哪个数据集。浅蓝色的**Run\
  \ query**（运行查询）按钮将执行查询。**Listen**（监听）按钮将激活一种模式，在该模式下，来自 GROQ 查询筛选部分的文档变更将在**RESULT**（结果）部分实时输出。\n\
  \n屏幕的主体部分分为三个部分。很容易想象每个部分的用途：\n\n- **QUERY**（查询）是输入 GROQ 查询的地方。\n- **PARAMS**（参数）是输入传递给\
  \ GROQ 查询的参数集的地方。\n- **RESULT**（结果）是以 JSON 格式显示结果的地方。结果随后可以展开或折叠，以便用户既能看到概览也能看到细节。\n\
  \n我们已经学习了如何安装 Vision GROQ 工具以及如何使用它。在下一节中，我们将审视 GROQ 并将其与 SQL 进行比较。\n\n### GROQ\
  \ 与 SQL\n\nGROQ 的简洁性使用初始星号表示`选择所有文档`，而在标准 SQL 中默认选择的是单个表。虽然 SQL 是一种传统的关系型数据库，这意味着你需要预先决定数据库的结构，并将其划分为表。在存储任何数据之前，程序员必须定义表、列名以及该表内列的类型。当向关系型数据库添加数据时，程序员必须以每列声明的格式传递数据；任何多余的数据或不匹配格式的数据都不会存储在数据库中。\n\
  \nSanity 的内容模型是一个无模式数据库，这意味着你不需要定义表和列。系统以键/值对或 JSON 的形式存储数据，基本上是一列的表。程序员能够将任何格式的数据添加到数据库中，更改现有数据，例如从布尔值改为字符串，并在不声明新列的情况下添加新的数据类型。\n\
  \n现在让我们探索查询 SQL 和 GROQ 时的差异：\n\n| SQL | GROQ |\n| --- | --- |\n| `select * from\
  \ table;` | `*` |\n| `select * from content_table where type=\"movie\";` | `*[_type\
  \ == \"movie\"]` |\n\n传统的基于 SQL 的数据库查询应包含以下语法：\n\n```\nselect * from table;\n```\n\
  \n让我们看看 GROQ：\n\n```\n*\n```\n\n```\n\"name\": \"IT Conference\",\n\"venue\": {\n\
  \  \"_ref\": \"65929c5e-f2df-4483-b2e4-4f10a654adf8\",\n  \"_type\": \"reference\"\
  \n},\n1: { ... },\n2: { ... }\n]\n```\n\n请注意，结果被包裹在 `result` 中。它们由基于零的数组表示，共有三个结果，因此是\
  \ 0、1 和 2。\n\n请注意，id 是一个通用唯一标识符（UUID）。这使得文档在整个数据集中都是唯一的，这与数据库表索引不同，后者从 1 开始索引，且仅在单个表内唯一。\n\
  \n`_rev` 键是该文档修订版或版本的标识符。\n\n由于 `venue` 是相关文档，`_ref` 是对该文档 `_id` 的引用。请注意，`venue`\
  \ 是嵌套的，并且代表一个完整的文档。\n\n### 选择所有即将举行的活动\n\n在此查询中，我们将通过添加 `dateAndTime` 条件来选择所有即将举行的活动：\n\
  \n```\n*[_type == \"event\" && dateAndTime >= now()] | order(dateAndTime asc)\n\
  ```\n\n我们使用 `now()` 函数传递当前日期值，该函数返回当前日期。我们也可以将 `dateAndTime` 值作为 YYYY-MM-DD 格式的字符串传递。\n\
  \n我们还按日期对结果进行排序。我们将显示所有即将举行的活动，从最近的活动开始。\n\n### 选择所有过去的活动\n\n对于即将举行的活动，我们使用 `now()`\
  \ 函数获取当前日期值，并获取所有过去的活动：\n\n```\n*[_type == \"event\" && dateAndTime < now()] | order(dateAndTime\
  \ asc)\n```\n\n它将按日期对结果进行排序，从最近的活动开始。\n\n### 选择即将举行的虚拟会议和非虚拟会议\n\n我们之前的查询按日期返回了所有活动，但并未按虚拟会议字段进行筛选。我们在活动模式中的虚拟会议字段是一个布尔值。我们可以向\
  \ GROQ 查询添加条件，如果活动是虚拟的则设置 `virtual == true`，如果活动不是虚拟的则设置 `virtual == false`：\n\n\
  - 选择虚拟活动：\n\n  ```\n  *[_type == \"event\" && dateAndTime >= now() && virtual ==\
  \ true] | order(dateAndTime asc)\n  ```\n\n- 选择非虚拟活动：\n\n  ```\n  *[_type == \"\
  event\" && dateAndTime >= now() && virtual == false] | order(dateAndTime asc)\n\
  \  ```\n\n我们已经看到了如何从数据集中选择所有字段。接下来，我们将学习如何选择特定字段以减小结果的大小。\n\n### 选择特定活动字段\n\n结果取决于我们在哪里显示内容。我们可能不需要所有字段，而只需要某些字段。通过此查询，我们仅获取所有即将举行的活动的\
  \ `name`、`dateAndTime` 和 `body` 字段。\n\n我们在投影中传递字段名称：\n\n```\n*[_type == \"event\"\
  \ && dateAndTime >= now()] | order(dateAndTime asc) | {name, dateAndTime, body}\n\
  ```\n\n\n\n结果如下：\n\n```\n```json\n\"result\": [\n  0: {\n    \"body\": [\n     \
  \ 0: {...} 5 items\n    ]\n    \"dateAndTime\": \"2020-04-24T23:30:00.000Z\"\n \
  \   \"name\": \"The Appleseed Cast\"\n  }\n]\n```\n```\n\n我们已经学习了如何从简单查询中选择字段。接下来，我们将学习在使用一个模式与另一个模式之间的关系时如何处理字段。\n\
  \n## 从关系中选择特定字段\n\n在之前的查询中，我们从事件内容中检索了某些字段。在此示例中，我们将从场馆内容中检索场馆名称和网站。\n\n在此查询中，我们将在投影中添加场馆字段：\n\
  \n```\n```groq\n*[_type == \"event\" && dateAndTime >= \"2020-04-24\"] | order(dateAndTime\
  \ asc) | {name, dateAndTime, body, venue->{name,website}}\n```\n```\n\n结果如下：\n\n\
  ```\n```json\n\"result\": [\n  0: {\n    \"body\": [\n      0: {...}\n    ]\n  \
  \  \"dateAndTime\": \"2020-04-24T23:30:00.000Z\"\n    \"name\": \"The Appleseed\
  \ Cast\"\n    \"venue\": {\n      \"name\": \"Will's Pub\"\n      \"website\": \"\
  https://willspub.com\"\n    }\n  }\n]\n```\n```\n\n现在我们已经涵盖了一些基本查询，让我们进入更高级的 GROQ\
  \ 查询。\n\n## 高级 GROQ\n\n在本节中，我们将了解如何从关系中获取字段，如何创建我们自己的格式化响应，最后，我们将探索一些内置函数。\n\n###\
  \ 按场馆获取事件\n\n在场馆页面上，我们想要选择该特定场馆的所有事件：\n\n```\n```groq\n*[_type == \"event\" && venue->name\
  \ == \"Will's Pub\"]{\n  name,\n  venue->{name}\n}\n```\n```\n\n结果如下：\n\n```\n```json\n\
  [\n  {\n    \"name\": \"The Appleseed Cast\",\n    \"venue\": {\n      \"name\"\
  : \"Will's Pub\"\n    }\n  },\n  {\n    \"name\": \"Friday Drinks\",\n    \"venue\"\
  : {\n      \"name\": \"Will's Pub\"\n    }\n  }\n]\n```\n```\n\n注意场馆 Will's Pub\
  \ 显示了两个事件的结果。\n\n## 总结\n\n在本章中，我们学习了如何使用 GROQ 以及它是如何以简洁、紧凑的方式查询数据集的。我们学习了它与 SQL\
  \ 的不同之处，以及它如何展平和塑造查询结果。\n\n在下一章中，我们将开始进入 GraphQL 的旅程，GraphQL 是一种更通用的方式来*公开*或*呈现*\
  \ Sanity 的数据集作为 API，这意味着许多不同的静态站点生成器可以轻松与其交互。\n"
- "# 6\nSanity 的 GraphQL Playground\n\n本章介绍 GraphQL，一种强大的查询语言。Sanity 的 GraphQL API\
  \ 使外部程序能够在遵循其提供的标准的同时与结构化内容交互。这使开发人员能够利用开发社区中可用的丰富的 GraphQL 工具和实践生态系统。GraphQL 和\
  \ GROQ，即 Sanity 的专有查询语言，都是开源的，可以用来与 Sanity 交互。然而，虽然 GROQ 特定于 Sanity，但 GraphQL 被许多应用程序普遍使用。\n\
  \n在本章中，我们将解释 GraphQL 是什么，检查一些基本查询及其格式，介绍 Sanity 的 GraphQL Playground，并学习如何使用它来创建和测试\
  \ GraphQL 查询。本章将涵盖以下主题：\n\n- GraphQL 简介\n- GROQ 与 GraphQL\n- Sanity.io 的 GraphQL\
  \ playground 基础\n\n### 技术要求\n\n需要一个网络浏览器和一个终端程序。\n\n## GraphQL 简介\n\n首先，让我们开始了解\
  \ GraphQL。从 GraphQL 网站上，我们了解到 GraphQL 允许其用户描述数据。这意味着定义数据结构应如何形成。考虑以下示例：\n\n```\n\
  type Event {\n  name: String\n  date: Date\n}\n```\n\n在这里，我们定义了事件的结构。使用 GraphQL，我们可以按如下方式查询数据结构：\n\
  \n```\n{\n  event(name: \"Saturday Night Party\") {\n    date\n  }\n}\n```\n\n请注意，基本结构看起来几乎相同。我们要求数据以与定义时相同的格式返回。返回的数据将具有以下格式：\n\
  \n```\n{\n  \"event\" {\n    date: \"2020-10-01\"\n  }\n}\n```\n\n> **注意：**\n> 有关\
  \ GraphQL 语法和规范的更多信息，请访问 http://spec.graphql.org/draft/。\n\nGraphQL 的优势在于它使用户能够请求特定信息并获得可预测的结果，这些结果与请求相镜像。\n\
  \n在以下各节中，我们将了解 GraphQL 为什么是一种紧凑高效的标准，使其可用于从许多数据源（如 Sanity）获取数据。\n\n我们将通过部署 GraphQL\
  \ 模式并使用 Sanity 的命令行部署工具，继续我们进入 GraphQL 世界的旅程。\n\n## 部署 GraphQL API\n\n由于 Sanity\
  \ 内部使用 GROQ，如果 Sanity 的数据集被其他应用程序使用，则需要部署可选的 GraphQL API。为此，我们需要返回到项目 `studio` 目录中的命令行。\n\
  \n以下命令需要在终端中输入：\n\n```\n```bash\nsanity graphql deploy\n```\n```\n\n我们需要安装 Sanity\
  \ 命令行程序。如果尚未安装，请在命令行中输入以下内容：\n\n```\n```bash\nnpm install -g @sanity/cli\n```\n\
  ```\n\n系统会要求您以下问题：\n\n```\n```\nDo you want to enable a GraphQL playground? (Y/N)\n\
  ```\n```\n\n在此提示下，只需按 *Enter* 键，或输入 Y，即可启用 playground。输出的最后一行应显示 playground 的浏览器：\n\
  \n```\n```\nGraphQL API deployed to:\nhttps://abcd1234.api.sanity.io/v1/graphql/production/default\n\
  ```\n```\n\n此 URL 可以在网络浏览器中打开。让我们检查格式。\n\n请注意，URL 由以下部分组成：项目 ID（此处显示为 `abcd1234`），后跟\
  \ `api.sanity.io`，`v1`（版本一），`graphql`，数据集名称（在此示例中为 `production`），最后是模式名称（在本例中为 `default`）。\n\
  \n在下一节中，我们将探索 GraphQL 的基本语法。\n\n### 基本 GraphQL 语法\n\n虽然 Sanity 的 GROQ 使用更紧凑的语法，但其目标是有效地从数据集合中获取所需内容。GraphQL\
  \ 的目标是允许请求服务以表达且类型化的方式指定数据的格式以返回，然后以相同的格式返回。我们现在来看 GraphQL 查询的基本语法以及它可能如何有用地轻松获取数据。\n\
  \n有两种基本类型的查询：\n\n- all 前缀后跟模式名称，如下所示，用于返回多条记录。\n- 单记录查询，它将只返回一条记录。\n\n让我们开始学习 all\
  \ 查询格式。\n\n## GraphQL 的 all 查询\n\n考虑以下示例查询：\n\n```\n{\n  allEvent {\n    name\n\
  \  }\n}\n```\n\n前面的查询将返回我们数据集中所有事件的名称。这里使用的是 event 的单数形式而不是复数形式。结果将与查询相同的格式。注意结果被包装在\
  \ data 对象中。此外，allEvent 查询在结果中重复，结果与查询格式相同：\n\n```\n{\n  \"data\": {\n    \"allEvent\"\
  : [\n      {\n        \"name\": \"IT Conference\"\n      },\n      ...\n    ]\n\
  \  }\n}\n```\n\n接下来，让我们学习单记录 GraphQL 查询。\n\n## GraphQL 的单记录查询\n\n第二种 GraphQL 查询将只返回一条记录。以下片段是这种第二种查询的示例：\n\
  \n```\n{\n  Event(id: \"6ddd2730-9aca-46dd-a7fd-850ab306f7fb\") {\n    name\n  }\n\
  }\n```\n\n请注意，这种单记录查询需要一个参数来标识记录。在此情况下，使用事件的 id 参数。\n\n这将返回一个事件。结果与查询格式相同。请注意，Event\
  \ 查询在结果中重复：\n\n```\n{\n  \"data\": {\n    \"Event\": {\n      \"name\": \"IT Conference\"\
  \n    }\n  }\n}\n```\n\n现在我们已经学习了 GraphQL 的基本语法，让我们更深入地研究它。在下一节中，我们将查看 GROQ 与 GraphQL\
  \ 之间的差异。\n\n## GROQ 与 GraphQL\n\n在第 5 章 Sanity 的 GROQ 语言中，在高级 GROQ 部分，我们编写了一个 GROQ\
  \ 查询，返回特定场馆的所有事件。现在我们将 GROQ 与 GraphQL 进行比较。\n\n回忆 GROQ 语法，所期望的场馆名为 Will's Pub：\n\
  \n```\n*[_type == \"event\" && venue->name == \"Will's Pub\"] {\n  name,\n  venue->{name}\n\
  }\n```\n\n\n\n接下来，让我们编写对应的 GraphQL 中的 GROQ 查询：\n\n```graphql\n{\n  allEvent(where:\n\
  \    { venue:\n      { name:\n        { eq:\n          \"Will's Pub\"\n        }\n\
  \      }\n    }\n  )\n    {\n      name\n      venue {\n        name\n      }\n\
  \    }\n}\n```\n\nGROQ 的 type == \"event\" 等价于 allEvent，它是一个函数。请注意 GraphQL 使用了 SQL\
  \ 熟悉的 where 关键字，它是一个参数。随后是一个作为参数的对象，即 venue。venue 的 name 参数嵌套在 venue 内部。然后，eq 是\
  \ equals 的两个字母缩写。\n\n至此，函数-参数-括号的集合结束。然后，在大括号之间，我们列出我们感兴趣返回的字段。请注意 GraphQL 在每个值之间不使用逗号，而\
  \ GROQ 使用。我们返回事件名称（name），同时也返回场馆名称，同样是嵌套的。\n\n结果如下：\n\n```json\n{\n  \"data\": {\n\
  \    \"allEvent\": [\n      {\n        \"name\": \"The Appleseed Cast\",\n     \
  \   \"venue\": {\n```\n\n```\n\"name\": \"Will's Pub\"\n}\n},\n{\n\"name\": \"Friday\
  \ Drinks\",\n\"venue\": {\n\"name\": \"Will's Pub\"\n}\n}\n]\n}\n}\n```\n\n正如你所见，返回了两个事件。如果只应返回名为\
  \ The Appleseed Cast 的事件，可以向 where 关键字添加一个额外的参数。会有逗号分隔符。请注意，这是事件名称，而不是场馆名称，因为两个字段具有相同的名称：\n\
  \n```\n{\n  allEvent(where: { venue: { name: { eq: \"Will's Pub\" } },\n    name:\
  \ { eq: \"The Appleseed Cast\" } }\n  ) {\n    name\n    venue {\n      name\n \
  \   }\n  }\n}\n```\n\n结果仍然会是一个列表（即数组），因为使用了 allEvent；然而，该列表将只有一个值：\n\n```\n{\n\"\
  data\": {\n\"allEvent\": [\n{\n\"name\": \"The Appleseed Cast\",\n\"venue\": {\n\
  ```\n\n```\n\"name\": \"Will's Pub\"\n}\n}\n]\n}\n}\n```\n\n这将在后面很重要，因为结果将被处理为好像有不止一个结果。\n\
  \n在下一节中，我们将使用 Sanity.io playground 对我们的 Studio 应用程序运行 GraphQL 查询。\n\n## GraphQL\
  \ playground 基础\n\n在第 5 章 Sanity 的 GROQ 语言中，在安装 Vision 部分，使用了 Sanity 的 Vision 工具来测试\
  \ GROQ 查询。同样，Sanity 使用 GraphQL playground 让我们可以测试 GraphQL 并与其数据集交互。\n\nGraphQL playground\
  \ 允许用户创建和运行 GraphQL 查询，这些查询稍后可用于从 GraphQL API 获取信息。在以下部分，我们将学习其基本功能。\n\n以下是 GraphQL\
  \ playground 的截图：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_96_0.png)\n\n图 6.1\
  \ – GraphQL playground\n\nGraphQL playground 的界面易于使用。与 Vision GROQ 工具类似，查询输入到左侧窗口，并在界面中间点击播放图标执行。\n\
  \n如预期，GraphQL 结果显示在右侧窗口。查询变量可以输入到底部窗口。\n\n右侧有一个绿色标签，标记为 **SCHEMA**。点击它将显示各种 GraphQL\
  \ 起始点，例如 allEvent。通过此模式导航是一种方便的方式来确定在 Sanity 中输入 `graphql deploy` 命令后 GraphQL 是否已正确部署。在\
  \ Sanity 中对模式进行任何更改后都需要此命令。\n\n如果模式或模式字段在此不可见，则任何使用此 API 的外部服务都无法访问它，因此这是一种方便的方式来检查模式是否反映数据集的实际状态。在以下代码块中，显示了基本查询格式，以及每个参数期望的值类型：\n\
  \n```\nallEvent(\n  where: EventFilter\n  sort: [EventSorting!]\n  limit: Int\n\
  \  offset: Int\n): [Event!]!\n```\n\n点击 `allEvent` 链接后，它可能在屏幕上看起来像这样：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_98_0.png)\n\
  \n图 6.2 – allEvent 详情\n\n## 查询参数\n\nGraphQL playground 最重要的功能之一是它允许用户添加参数。这是因为在大多数实际应用中，查询参数经常被用来获得正确的结果。将\
  \ **QUERY VARIABLES** 窗口展开，通过鼠标拖动。然后，你可以输入键值对，如下所示：\n\n```\n{ \"name\": \"Will's\
  \ Pub\"}\n```\n\n## 总结\n\n在本章中，我们学习了 GraphQL 的构成方式，GraphQL 与 GROQ 的区别，以及如何使用 where\
  \ 过滤结果。最后，我们学习了如何使用 Sanity 的 GraphQL playground 来构建和验证模式，并查看了示例。GraphQL 将成为所有希望连接\
  \ Sanity 的程序以标准且紧凑的方式轻松实现连接的手段。在接下来的章节中，GraphQL 将很重要，因为静态站点生成器将专门使用它。\n\n在下一章中，我们将介绍\
  \ Gatsby，这是 Jamstack 的另一部分。我们将使用此处显示的一些 GraphQL 示例，以便将 Sanity 的数据集连接到 Gatsby。\n"
- "# 7 Gatsby – 简介\n\nGatsby 是本书中使用的三部分 Jamstack 系统的第二部分。Gatsby 对自己的定义如下：\n\n> \"\
  *一个基于 React 的免费开源框架，帮助开发者构建极速的网站和应用。*\"\n\n由于它是一个免费开源框架，所有代码都很容易检查和修改。其次，Gatsby\
  \ 生产的网站和应用速度极快，因为它创建的 HTML 页面是实际文件，而不是仅通过后端进程在服务器端语言中生成。\n\n首先，我们将学习 React 是什么，然后，我们将查看\
  \ Gatsby 基础项目的结构，检查其文件和文件夹结构。\n\n本章将涵盖的主要主题如下：\n\n- 基于 React 的 Gatsby\n- Gatsby\
  \ 基础项目结构\n- gatsby develop 命令\n\n### 技术要求\n\n对于本章，需要安装 Gatsby 应用程序，并需要一个终端程序和一个网页浏览器。\n\
  \n## 基于 React 的 Gatsby\n\n**React** 是一个用于创建用户界面的 JavaScript 库。它使用声明式语法，并且还使用模块化组件系统。由于\
  \ Gatsby 建立在 React 之上，你在学习 Gatsby 时会很快发现许多 React 的部分。Gatsby 生态系统中的另一个部分 **JSX**\
  \ 也被 Gatsby 使用。JSX 允许 Gatsby 页面元素使用熟悉的 HTML 标签格式编写，并允许使用属性向其传递参数。每个 JSX 标签可以是一个项目的单一单元。由于\
  \ JSX 标签也是 JavaScript，它们可以与 JavaScript 编程逻辑集成。\n\n由于 React 是众多 JavaScript 库和框架之一，例如\
  \ Angular 和 Vue，框架本身相当庞大，具有健康的生态系统，并且需要大量学习才能熟练掌握。幸运的是，如果你想更深入地学习如何使用它，有许多专门针对 React\
  \ 的培训课程。虽然学习 React 超出了本书的范围，但学习 Gatsby 会间接让你接触到 React 的一些做法。\n\n## Gatsby 基础项目结构\n\
  \n在此项目中，项目的 files 是通过 `https://create.sanity.io` 创建的。在创建过程中，Gatsby 的项目文件结构和配置已自动安装在\
  \ `/web` 文件夹中，这大致等同于使用 Gatsby 的新项目创建命令安装的内容。\n\n如果 Gatsby 使用 `-g` 标志创建，表示全局，它会被安装并在用户系统范围内可用：\n\
  \n```\n`npm install -g gatsby`\n```\n\n否则，Gatsby 命令可以根据 `package.json` 文件在安装的目录中运行。\n\
  \n也可以通过在终端中输入以下命令创建新项目：\n\n```\n`gatsby new projectname`\n```\n\n\n\n\n\n在前面的示例中，`projectname`\
  \ 是你所选项目的名称，也将成为在输入命令的任何位置创建的文件夹的名称。\n\n我们将在接下来的章节中更详细地查看我们项目的目录结构。\n\n## gatsby-config.js\n\
  \n我们要学习的第一個文件是 `gatsby-config.js`。该文件安装在 /web 文件夹中。\n\n接下来，我们将查看该文件的三个主要要点：\n\n\
  - 它的结构\n- 它的语法\n- Gatsby 的 Sanity 安装\n\n让我们开始吧。\n\n## Structure\n\n文件以 `module.exports`\
  \ 开始，这是 Node.js 中允许大括号内容被暴露并在应用程序的其他部分中使用（即导出到）的 一种方式：\n\n```\nmodule.exports =\
  \ {}\n```\n\n文件的主要部分是 `siteMetadata`，它保存应用程序的元数据，例如 `title` 和 `description`，以及 `plugins`，它是一个插件数组，以方括号在语法上表示。`gatsby-config.js`\
  \ 文件的摘录如下所示：\n\n```\nmodule.exports = {\n  siteMetadata: {\n    title: `Gatsby Default\
  \ Starter`,\n    description: `Kick off your next, great Gatsby project with this\
  \ default starter...`,\n    author: `@gatsbyjs`,\n  },\n  plugins: [\n    `gatsby-plugin-react-helmet`,\n\
  \    {\n      resolve: `gatsby-source-filesystem`,\n```\n```\noptions: {\n    name:\
  \ `images`,\n    path: `${__dirname}/src/images`,\n  },\n  },\n  ...\n],\n}\n```\n\
  \n接下来，我们将查看文件的语法。\n\n## Syntax\n\n你可能不熟悉 Gatsby 在整个过程中使用的语法：\n\n```\npath: `${__dirname}/src/images`,\n\
  ```\n\n这种语法称为 **模板字面量**，是 ECMAScript 2015，即 ES6，最新 JavaScript 规范的一部分。这里使用了反引号字符，而以前通常会使用单引号。\n\
  \n单引号的一个缺点是它们不是多行的，因此例如，需要加号来连接或顺序组合两个短语。以下是一个示例：\n\n```\nvar multilineString =\
  \ 'This is an example of a ' +\n' multi-line string that is more than one line long.';\n\
  ```\n\n在 ES6 中，可以通过以下方式实现等效功能：\n\n```\nlet multilineString = `This is an example\
  \ of a\nmulti-line string that is more than one line long.`\n```\n\n此外，`let` 关键字被用作\
  \ `var` 关键字的替代。以前只能声明变量（var），现在可以使用 let 分配可以更改的值。`const` 关键字可用于指定不可更改的值，即不可变。\n\n\
  此外，字符串插值是通过将变量括在大括号（也称为花括号）中，然后前面加上美元符号（$）来实现的。这允许在同一表达式中使用变量和简单字符串，如下所示：\n\n```\n\
  path: `${__dirname}/src/images`,\n```\n\n在这里，`__dirname` 变量将被目录名称替换。参见以下示例：\n\n\
  ```\npath: `/home/chris/src/images`\n```\n\n最后，让我们学习如何配置 Gatsby 以与 Sanity 配合使用。\n\
  \n## Sanity's Gatsby installation\n\n由于本书中使用的 Gatsby 版本是根据 https://www.sanity.io/create\
  \ 上的说明安装和配置的，因此它预先配置为与 Sanity 配合使用，即使 Gatsby 可能会从许多不同类型的信息源获取和使用信息。这是通过 Gatsby 的源插件完成的，其名称格式如下：\n\
  \n```\ngatsby-source-name\n```\n\n前一段代码片段中的 name 值可以用 Sanity（gatsby-source-sanity）、WordPress（gatsby-source-wordpress）、Drupal（gatsby-source-drupal）或写作本书时存在的数百种不同类型的数据源中的任何一种来替换。默认的\
  \ Gatsby 源是 gatsby-source-filesystem。在第 9 章 Gatsby 源插件中，我们将更详细地讨论这个问题。\n\n这是 gatsby-source-sanity\
  \ 插件的一个示例。它有一系列选项：\n\n```\n{\n    resolve: \"gatsby-source-sanity\",\n    options:\
  \ {\n        ...clientConfig.sanity,\n        token: process.env.SANITY_READ_TOKEN,\n\
  \        watchMode: !isProd,\n        overlayDrafts: !isProd\n    }\n}\n```\n\n\
  首先要注意的是以下行：\n\n```\n...clientConfig.sanity,\n```\n\n三重句点在 JavaScript 中用作展开运算符，它将所有对象属性分配到单独的变量中。但首先，让我们看看之前发生了什么。\n\
  \n此配置文件的前几行很重要：\n\n```\n// Load variables from `.env` as soon as possible\nrequire('dotenv').config({\n\
  \  path: `.env.${process.env.NODE_ENV || 'development'}`\n})\nconst clientConfig\
  \ = require('./client-config')\nconst isProd = process.env.NODE_ENV === 'production'\n\
  ```\n\n这些行很重要，因为它们确定 Gatsby 的环境变量并设置 Sanity 集成。环境变量是其值可能根据使用它的环境而变化的变量。\n\n例如，在生产环境中，完成表单后可能会发送电子邮件，而在开发环境中则不会发送。\n\
  \n## dotenv\n\ndotenv 文件是一种用于存储配置值的约定。它通常不会提交到源代码控制，GitHub 在本例中，以便凭据和密码可以保持私密：\n\
  \n```\nrequire('dotenv').config({\n  path: `.env.${process.env.NODE_ENV || 'development'}`\n\
  })\n```\n\n/web 目录中有一个此文件的示例，即 .env.production，其格式如下：\n\n```\nGATSBY_SANITY_PROJECT_ID=\"\
  abcd1234\"\nGATSBY_SANITY_DATASET=\"production\"\n```\n\nprocess.env.NODE_ENV 用于确定当前使用的是哪个环境。development\
  \ 是如果未指定则使用的默认环境，因此要启用此文件，它必须以正确的格式存在。复制 .env.production 并将其命名为 env.development。.env.production\
  \ 文件将用于生产部署。\n\n## Client configuration\n\n下一行需要加载 client-config 文件的内容，这意味着它必须将内容带入当前代码。\n\
  \n以下是该文件的内容。它用于设置两个值，projectId 和 dataset。它从 .env 文件中分配值（如果存在），否则分配创建项目时提供的实际名称：\n\
  \n```\nmodule.exports = {\n  sanity: {\n    projectId: process.env.GATSBY_SANITY_PROJECT_ID\
  \ || 'abcd1234',\n    dataset: process.env.GATSBY_SANITY_DATASET || 'production'\n\
  \  }\n}\n```\n\n这些值被设置到 clientConfig 变量中，然后内容被展开到 gatsby-source-sanity 选项中，在那里它们用于连接到\
  \ Sanity GraphQL API：\n\n```\noptions: {\n  ...clientConfig.sanity,\n```\n\nconst\
  \ clientConfig = require('./client-config'),\n```\n\n此时，clientConfig 常量保存 Sanity\
  \ 配置。\n\n接下来，让我们了解 Gatsby 的关键文件。\n\n## Key Gatsby files\n\n任何 Gatsby 项目中的三个关键文件都是\
  \ gatsby-ssr.js、gatsby-node.js 和 gatsby-browser.js。它们共同属于 Gatsby API。每个文件都有特定的用途。有趣的是，每个文件都是可选的，因此可以根据需要创建并添加到项目中。\n\
  \n了解构建过程的工作方式很重要。请记住，由于静态站点生成器实际上只生成文件，一旦网页生成，就无法再执行服务器端代码。所有服务器端代码执行都将在名为 `gatsby-ssr.js`\
  \ 的文件中发生。\n\n让我们详细查看这三个关键文件。\n\n- `gatsby-ssr.js`：**SSR** 是 **服务器端渲染** 的缩写，因此很快就会清楚该文件的用途。该文件允许你在\
  \ Gatsby 在服务器上生成（渲染）页面时修改页面的内容。从该文件内部可以调用的函数将在构建时与页面交互，因为它们正在被渲染。\n- `gatsby-node.js`：由于\
  \ Gatsby 使用 Node.js，因此该文件中的函数允许 Gatsby 深入整个过程。\n- `gatsby-browser.js`：这是网页渲染后实际页面交互发生的\
  \ 文件。\n\n## Gatsby folders\n\n以下是主要 Gatsby 文件夹的列表。\n\n### src\n\n此文件夹包含 Gatsby 源文件，包括用于设置网站样式的图像和级联样式表。此外，`src`\
  \ 文件夹中还包含以下文件夹。\n\n- **Components**：在此目录中是用于网站构建的构建块。在此目录内，将有在多个页面中使用的内容片段。\n- **Pages**：此目录的内容用于单个页面；例如，*关于我们*\
  \ 页面，它是其类型的唯一页面。另一个示例是 404 页面，当用户在浏览器地址栏中输入不存在的网址或单击指向网站上不存在的页面的链接时使用。每个页面应具有独特的布局。如果页面过于相似，则应使用模板，其中存在许多相同类型的页面，例如博客文章。\n\
  - **Templates**：如前所述，模板用于创建许多相同类型的页面，其中单个模板的所有页面几乎具有完全相同的格式和布局，例如，仅页面标题、标题和正文内容不同。\n\
  \n\n\n\n\n## public\n\n该文件夹位于`src`目录之外，当在命令行中运行`gatsby build`时，如果部署网站页面尚不存在，则会在此文件夹中创建它们。当首次使用`gatsby\
  \ serve`命令查看Gatsby网站时，这些文件也将作为文档根目录被引用。`public`目录的内容可以随时删除并重新创建，因为运行`gatsby build`总会重新生成它们。\n\
  \n完整的Gatsby文档可在 https://www.gatsbyjs.com/docs/ 找到，内容如下：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_109_0.png)\n\
  \n图7.1 – Gatsby网站文档\n\n现在我们已经了解了Gatsby的文件和文件夹结构，接下来将继续学习如何使用Gatsby。要启动Gatsby，我们需要使用命令行。以开发模式启动Gatsby。\n\
  \n## gatsby develop命令\n\n在命令行中使用Gatsby可为各个项目阶段提供多种不同功能。最初，`gatsby develop`命令会以开发模式启动Gatsby，这样就能实时查看更改。该命令会持续运行，直到你按下`Ctrl\
  \ + C`。这个组合键在UNIX操作系统中用于终止（杀死）进程。\n\n在`/web`目录内输入`gatsby develop`，这将使Gatsby开发环境（.env.development）运行，使用的是开发配置，而非生产配置（.env.production）。此外，它还会创建一个名为**GraphiQL**（发音类似*graphical*）的GraphQL游乐场。这将使我们能够真正与Sanity的GraphQL接口交互，并开始编写、测试和查看创建活动网站所需的查询结果。\n\
  \n## 总结\n\n在本章中，我们了解了Gatsby是什么，以及它如何使用JavaScript和React构建。接着，我们学习了它的配置文件是如何创建的，以及其主要组成部分是什么。我们还学习了如何配置`gatsby-source`插件以与Sanity交互。此外，我们还学习了`gatsby\
  \ develop`命令以及如何启动一个项目。\n\n在下一章中，我们将开始使用GraphiQL（一个GraphQL游乐场）的旅程，并进一步接近创建网站。这将使我们能够在Gatsby上下文中设计、执行和测试GraphQL查询。\n"
- "# 8\nGatsby与GraphQL\n\n在本章中，我们将开始通过GraphQL将内容引入Gatsby。GraphQL是学习Gatsby工作原理的一个很好的起点，因为Gatsby使用GraphQL来获取内容。正如我们在第6章“Sanity的GraphQL游乐场”中所学到的，Sanity通过GraphQL应用程序接口（API）暴露其信息，因此Gatsby可以轻松地通过GraphQL使用Sanity的内容。\n\
  \n以下是本章将涵盖的主要主题：\n\n- GatsbyJS中的GraphQL\n- GraphiQL，一个GraphQL导航器\n\n### 技术要求\n\n\
  对于本章，需要安装Gatsby应用程序，并需要一个终端程序。此外，还需要一个Web浏览器。\n\n## GatsbyJS中的GraphQL\n\n在本节中，我们将了解GraphQL在Gatsby上下文中是如何使用的。我们还将学习Gatsby使用GraphQL的方式与Sanity的GraphQL\
  \ API暴露GraphQL的方式之间的主要区别。\n\nGatsby对GraphQL的使用与Sanity不同，因为它使用图（graph）的概念来构建其GraphQL查询。让我们了解什么是图。\n\
  \n在下图中，图形由节点和边组成：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_112_0.png)\n\n图8.1\
  \ – 图\n\n在Gatsby对GraphQL的实现中，就图而言，每个Sanity文档都表示为一个节点。回顾第6章“Sanity的GraphQL游乐场”中用于返回所有事件的GraphQL查询，该查询非常简单，如以下代码片段所示：\n\
  \n```\n{\n  allEvent {\n    name\n  }\n}\n```\n\n在Gatsby中，我们发现返回所有事件对应的查询有两个主要区别，如下所示：\n\
  \n- 使用`allSanityEvent`代替`allEvent`。Sanity的开发者创建并正式维护了`gatsby-source-sanity`插件。他们选择添加此前缀以区分Sanity文档与其他文档，这种技术有时称为命名空间（namespacing）。Gatsby认可这是一种良好实践。显然，在Sanity端使用GraphQL游乐场意味着只获取Sanity的内容，而在Gatsby中，可以同时使用许多不同的内容源。\n\
  \n- 查询需要指定`edges`和`node`部分才能返回每个事件，如以下代码示例所示：\n\n```\nquery MyQuery {\n  allSanityEvent\
  \ {\n    edges {\n      node {\n        name\n      }\n    }\n  }\n}\n```\n\n同样，由于GraphQL不仅指定了请求格式，还指定了结果格式，因此结果会以边（edges）数组和每个文档的节点（node）形式封装返回，如下所示：\n\
  \n```\n{\n  \"data\": {\n    \"allSanityEvent\": {\n```\n\n同样，查询结果也包含边和节点，如以下代码片段所示：\n\
  \n```\n{\n  \"data\": {\n    \"allSanityEvent\": {\n      \"edges\": [\n       \
  \ {\n          \"node\": {\n            \"name\": \"The Appleseed Cast\"\n     \
  \     }\n        },\n        {\n          \"node\": {\n            \"name\": \"\
  Friday Drinks\"\n          }\n        }\n      ],\n    }\n  }\n```\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_115_0.png)\n\
  \n### 图8.2 – GraphiQL\n\n在左侧，我们可以看到GraphQL资源管理器。它通过向用户显示所有可用模式（schema）的视图，帮助我们自动创建GraphQL查询。因此，通过展开每个模式，会显示过滤和排序的选项，以及可作为查询结果返回的字段（包括它们的嵌套元素）。让我们详细看一下与之前在第6章“Sanity的GraphQL游乐场”中讨论类似的示例。\n\
  \n单击所需的起始查询——例如`allSanityEvent`——就会看到可用于过滤选项的各种实体字段，基本查询将在中间部分创建。当选择各个字段时，GraphiQL会自动将这些字段添加到GraphQL查询中。\n\
  \n接下来，让我们查看以下展开的`allSanityEvent`部分截图：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_116_0.png)\n\
  \n图8.3 – 带示例查询的GraphiQL\n\n当展开`allSanityEvent`部分，然后展开`filter`时，会显示过滤选项。`virtual\
  \ eq false`根据以下条件过滤结果：只选择非虚拟（eq false）的事件。以下截图显示了左侧导航的详细信息，该导航允许过滤和选择要从查询中返回的字段：\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_117_0.png)\n\n图8.4 – 查询选项\n\n然后，在展开`edges`后，从节点字段列表中选择`name`。\n\
  \n查询会自动创建，如下所示：\n\n```\n```graphql\nquery MyQuery {\n  allSanityEvent(filter: {virtual:\
  \ {eq: false}}) {\n    edges {\n      node {\n        name\n      }\n    }\n  }\n\
  }\n```\n```\n\n要执行查询，请点击**Play**按钮。\n\n结果显示在右侧的第三个面板中。另外两个功能是**History**和**Prettify**。**Prettify**用于适当格式化代码。\n\
  \n```\n```\nname\n}\n}\n}\n}\n~export default ComponentName\n```\n```\n\n让我们检查生成的代码。第一行导入React。第二行从gatsby导入graphql，用于执行查询。接下来，我们通过创建匿名函数并将其赋值给常量来定义名为ComponentName的组件，因为该函数不会改变。在这种情况下，ComponentName是一个有效的名称，但意为占位符，应予以更改。\n\
  \n接下来，让我们查看单个事件查询的样式。我们不再使用`allSanityEvent`（它会从Sanity端返回所有事件给Gatsby），而是使用单个`sanityEvent`事件查询，该查询只返回一条记录，接受来自Sanity端的事件的`id`，用下划线表示。以下代码片段展示了这一概念的示例：\n\
  \n```\n```\nquery MyQuery {\n sanityEvent(_id: {eq: \"6ddd2730-9aca-46dd-a7fd-850ab306f7fb\"\
  }) {\n name\n }\n}\n```\n```\n\n接下来，让我们查看结果。请注意，在以下代码片段中，结果被包裹在一个`data`对象中：\n\n\
  ```\n```\n{\n \"data\": {\n \"sanityEvent\": {\n \"name\": \"IT Conference\"\n }\n\
  \ }\n}\n```\n```\n\n\n\n同样地，我们可以使用场地名称查询事件，如下面的代码片段所示。这与*第6章“Sanity的GraphQL Playground”*中的示例类似：\n\
  \n```\nquery MyQuery {\n  sanityEvent(venue: {name: {eq: \"Will's Pub\"}}) {\n \
  \   name\n  }\n}\n```\n\n同样，结果将如前面代码片段的`name`字段所请求的那样，显示事件的名称，如下所示：\n\n```\n\"data\"\
  : {\n    \"sanityEvent\": {\n      \"name\": \"The Applesead Cast\"\n    \"venue\"\
  : {\n      \"name\": \"Will's Pub\"\n    }\n  }\n}\n```\n\n这两个示例清楚地展示了GraphQL如何在Gatsby中使用，提供了一种通过GraphQL查询Sanity来源的简便方法。\n\
  \n## 总结\n\n在本章中，我们了解了Gatsby Sanity来源插件，以及它如何使用GraphQL与Sanity交互并从中导入内容。我们学习了如何在Gatsby环境中使用基于Web的GraphQL应用程序来测试和编写GraphQL查询。我们还学习了GraphQL如何通过其GraphQL\
  \ API获取Sanity的内容。\n\n在下一章中，我们将学习Gatsby如何从文件系统和**内容管理系统**（CMS）等来源获取额外内容，因为我们距离使用Gatsby构建网站的目标越来越近。\n"
- "# 9\n\n## Gatsby来源插件\n\n在本章中，我们将解释如何通过使用插件来扩展Gatsby的功能。我们将首先探讨插件的基础知识，然后了解如何安装和维护插件。我们将探索在哪里可以找到插件，以及Gatsby如何管理其插件。在本章末尾，我们将为Gatsby应用程序安装并配置两个新插件。\n\
  \n本章将涵盖以下主题：\n\n- 了解插件\n- 搜索、安装和配置插件\n\n### 技术要求\n\n为了透彻理解本章，我们需要以下内容：\n\n- 一个终端应用程序\n\
  - npm\n- 已安装的Gatsby应用程序。\n\n本章的代码文件可以在 https://github.com/PacktPublishing/Jumstart-Jamstack-Development/tree/chapter_nine\
  \ 找到。\n\n> 注意：\n> 仅当您拥有Drupal网站时，Drupal部分才相关。GitHub链接：https://github.com/PacktPublishing/Jumstart-Jamstack-Development/tree/chapter_nine_drupal。\n\
  \n启用了以下模块的Drupal应用程序：\n\n- RESTful Web Services\n- JSON:API\n- Serialization\n\n\
  ### 了解插件\n\n在本节中，我们将探讨插件的基础知识、什么是插件，以及为什么项目中需要插件。我们将探索npm这个开源代码的公共集合。我们将解释语义化版本控制如何工作以及为什么它很重要。然后我们将看到如何安装和维护插件。\n\
  \n**Gatsby插件**是Node.js包，是一组JavaScript和**超文本标记语言/层叠样式表（HTML/CSS）**文件，用于扩展Gatsby的**应用程序编程接口（API）**，并为应用程序添加新功能。您可以通过安装插件来启用某项功能，也可以通过卸载插件来禁用它。\n\
  \nGatsby的可扩展特性允许您以可复用包的形式组织自定义业务逻辑，从而创建自己的插件，这将在下一节中讨论。\n\n### Node包管理器\n\n开发人员可以从npm下载插件，npm是GatsbyJS等JavaScript框架的开源代码公共集合。开发人员可以上传他们的插件，并让其他开发人员复用相同的代码。其他开发人员也可以通过修复错误或添加功能来为所使用的插件做出贡献。您还可以上传私有包到npm。\n\
  \n您可以通过以下网站上的搜索工具在npm上搜索插件：\n\n```\nhttps://www.npmjs.com\n```\n\n在上述网站的**包**页面上，您可以找到包的描述，以及安装说明、依赖项和版本。在下一节中，我们将探讨使用语义化版本的包版本控制方法。\n\
  \n### 语义化版本\n\n在软件开发中，开发人员为软件的每个唯一状态分配一个唯一的版本号。对软件进行版本控制有助于开发人员选择实现其软件所需的正确版本。这也适用于软件包。\n\
  \n当创建一个包并添加到npm时，推荐的第一个版本是1.0.0。随着进一步的实现和错误修复，版本号会根据所引入更改的类型而递增。\n\n包必须遵循主版本号.次版本号.修订号（major.minor.patch）的语义化版本规则，详细说明如下：\n\
  \n- 当开发人员引入不兼容的API更改时，*主版本号*递增一。版本从1.0.0变为2.0.0。\n- 当开发人员引入向后兼容的新功能时，*次版本号*递增一。版本从1.0.0变为1.1.0。\n\
  - 当开发人员引入向后兼容的错误修复时，*修订号*递增一。版本从1.0.0变为1.0.1。\n\n接下来，我们将看到如何从npm安装包。\n\n### 从npm安装包\n\
  \n要从npm安装包，请在终端中运行以下命令：\n\n```\nnpm i <package_name>\n```\n\n在这里，<package_name>是包的名称。例如，如果您想从npm安装一个名为birdie-hop的包，可以在终端中运行以下命令：\n\
  \n```\nnpm i birdie-hop\n```\n\n使用上述命令，npm将把birdie-hop包的最新稳定版本安装到您的应用程序中。\n\n如果在版本前不加任何字符，如果您从未在应用程序中安装过该插件，则会下载该确切版本；否则会将包更新到该相同版本。现在，请看这个代码片段：\n\
  \n```\nnpm i birdie-hop@~1.2.3\n```\n\n波浪号（~）告诉npm它可以安装或更新包到可用的最新修订版本。在这种情况下，版本将大于1.2.3且小于1.3.0。接下来，请看下面的代码片段：\n\
  \n```\nnpm i birdie-hop@^1.2.3\n```\n\n插入符号（^）告诉npm它可以安装或更新包到可用的最新次版本。在这种情况下，版本将大于1.2.3且小于2.0.0。现在，请看这个代码片段：\n\
  \n```\nnpm i birdie-hop@*1.2.3\n```\n\n星号（*）告诉npm它可以安装或更新包到任何可用的主版本。在这种情况下，版本将大于1.2.3，并且对更新没有限制。让我们继续了解如何更新插件。\n\
  \n默认情况下，包会进入dependencies数组中，并在生产环境中被您的应用程序需要。您还可以设置仅在本地开发环境或测试环境中需要的包，例如自动化测试包。该包将进入package.json文件中的devDependencies数组，并可通过添加--save-dev标志来添加，如下所示：\n\
  \n```\nnpm i birdie-hop --save-dev\n```\n\n### 更新插件\n\n当插件发布更新时，我们可以通过npm更新插件。要更新package.json文件中列出的所有包，请运行以下命令：\n\
  \n```\nnpm update\n```\n\n要更新单个包，请运行以下命令：\n\n```\nnpm update <package_name>\n```\n\
  \n在这里，<package_name>是您想要更新的包的名称。如果您想更新`birdie-hop`包，可以运行以下命令：\n\n```\nnpm update\
  \ birdie-hop\n```\n\n在更新或安装过程中，npm将检查`package.json`文件，并下载或更新插件到允许的版本。\n\n## package.lock文件\n\
  \n当您在团队中工作时，您希望团队中的所有开发人员使用相同的包版本。在这种情况下，`package.lock`文件就派上了用场。当您修改`package.json`文件或`node_modules`文件夹时，它会自动生成。它列出了应用程序应使用的所有包的精确版本。`package.lock`文件将避免同一团队中两个开发人员在同一项目上使用不同版本的`birdie-hop`包的情况。\n\
  \n在本节中，我们探讨了包的主要组成部分。我们学习了在哪里可以找到包以及如何安装它们。我们学习了包版本控制，以及如何将特定包安装或更新到特定版本。我们还探讨了`package.json`和`package.lock`文件在确保您的应用程序获得正确版本的正确包方面所发挥的重要作用。\n\
  \n在下一节中，我们将为Gatsby应用程序安装一个包。\n\n## 搜索、安装和配置插件\n\n在本节中，我们将探索Gatsby公共插件库。我们将了解如何安装Gatsby插件，以及在哪里可以找到要安装插件的配置。\n\
  \n我们将安装并配置`gatsby-source-filesystem`和`gatsby-source-drupal`插件，并了解如何使用它们。\n\n## Gatsby插件库\n\
  \nGatsby还提供了一个插件库，这是一个带有*Gatsby*关键字标记的npm包的集合。在这个库中，可以找到大多数站点都会使用的标准插件，与**搜索引擎优化（SEO）**、**真正简单的聚合（RSS）**（Really\
  \ Simple Syndication，RSS）、社交媒体按钮、第三方评论服务、电子商务集成等相关。\n\n\n\n\n> **重要提示**  \n> 在开始编写自定义插件之前，请确保该插件在\
  \ Gatsby 插件库中尚不存在。\n\n使用 Gatsby 插件库中的插件有诸多好处。这里列出其中的一些：\n\n- **节省时间：** 如果一个插件能完全实现你的任务，你可以直接安装、配置并开始使用。如果一个插件只能部分实现你的任务，你也可以在其基础上添加自定义功能进行扩展。\n\
  - **修复 Bug：** 你或其他开发者可以修复 Bug 并将信息发布到 npm，然后通过更新应用中的插件来获取这些修复。\n- **改进功能：** 与修复\
  \ Bug 类似——你或其他开发者可以为插件添加新功能并发布到 npm。\n- **安全性：** 你或其他开发者可能会发现插件中的代码或依赖存在安全问题；更新到最新的安全版本并发布到\
  \ npm。\n\n要查找 Gatsby 插件，请访问位于 `https://www.gatsbyjs.org/plugins/` 的 Gatsby 插件库。\n\
  \n下面的页面提供了一个 **Search Gatsby Library** 文本框，让你可以在 2000 多个插件中导航搜索！文本框位于页面左上方，如下图所示：\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_127_0.png)\n\n*图 9.1 – Gatsby 插件库页面*\n\
  \n每个 Gatsby 插件都附带了如何安装、配置和使用的详细说明。Gatsby Source 插件允许 Gatsby 从数据库、文件、RESTful API（其中\
  \ **REST** 代表 **Representational State Transfer**）等来源获取内容。\n\n我们在*第 2 章，Sanity 简介*中安装的\
  \ `Starter` 项目已经预装并配置了 `gatsby-source-sanity` 插件。通过 `gatsby-source-sanity` 插件，我们能够从\
  \ Sanity 应用中获取内容。\n\n在下一节中，我们将说明如何在 Gatsby 插件库中搜索插件。作为示例，我们将安装并配置两个源插件：`gatsby-source-filesystem`\
  \ 和 `gatsby-source-drupal` 插件。\n\n## 搜索插件\n\n所有 Gatsby 插件都可以在位于 https://www.gatsbyjs.org/plugins/\
  \ 的 Gatsby 插件库中找到。\n\n在页面左侧有一个插件搜索工具。开始输入要查找的插件的潜在关键词。\n\n例如，如果你正在查找 Google Analytics\
  \ 插件，可以输入 `google analytics`。\n\n在我们的示例中，我们将查找 `gatsby-source-filesystem` 插件，因此可以输入\
  \ `source filesystem`，如下面的截图所示：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_128_0.png)\n\
  \n图 9.2 – Gatsby 插件库页面\n\n在页面左侧，会返回包含该关键词的所有结果。每个结果包含插件名称、描述、下载次数和插件类型。当你点击插件结果时，你将看到插件的描述以及如何安装的说明。\n\
  \n### 安装插件\n\n插件通过命令行使用 npm 安装。当你找到所需的插件后，请在插件页面的 Install 部分查看安装命令，如下面的截图所示：\n\n\
  ### 安装\n\n```\nnpm install gatsby-source-filesystem\n```\n\n图 9.4 – gatsby-source-filesystem\
  \ 插件页面的 Install 部分\n\n在项目 `web` 文件夹内的终端中，输入上面截图所示的命令，然后按 Enter 键。\n\n该命令会将插件及其依赖项下载到\
  \ `node_modules` 文件夹中，并将 gatsby-source-filesystem 插件及要下载的版本添加到 `package.json` 文件的\
  \ Dependencies 部分。\n\n### 配置插件\n\n现在，插件文件已经在自己的应用中了，但为了启用插件，我们需要将其添加到位于 Gatsby 项目根目录下的\
  \ gatsby-config.js 文件中——在我们的示例中，该文件位于 `web` 文件夹内。\n\ngatsby-config.js 文件是应用中最重要的文件之一。它包含以下配置：\n\
  \n- siteMetadata（对象）\n- plugins（数组）\n- pathPrefix（字符串）\n- polyfill（布尔值）\n- mapping（对象）\n\
  - proxy（对象）\n- developMiddleware（函数）\n\n要启用插件，只需在 gatsby-config.js 文件的 plugins 数组中添加插件名称，如下所示：\n\
  \n```\nmodule.exports = {\n  plugins: [\n    ...\n    'gatsby-plugin-name',\n  \
  \  ...\n  ]\n}\n```\n\n一些其他插件可能还需要配置选项，这些选项也可以添加到 gatsby-config.js 文件的 plugins 数组中，如下面的代码片段所示：\n\
  \n```\nmodule.exports = {\n  plugins: [\n    ...\n    {\n      resolve: 'plugin-name',\n\
  \      options: {\n        // Options list, if any\n      },\n    },\n    ...\n\
  \  ]\n}\n```\n\n既然我们知道了如何启用插件，现在让我们启用 gatsby-source-filesystem 插件，并告诉 Gatsby 在哪里可以找到我们的内容。在\
  \ Gatsby 插件页面的 How to use 部分，有如何在应用中配置该插件的详细说明。\n\ngatsby-source-filesystem 插件可以接受三个选项，如下所示：\n\
  \n- name：GraphQL 查询使用的名称（必填）\n- path：实际文件所在的文件夹（必填）\n- ignore：需要忽略的文件扩展名列表（可选）\n\
  \n在我们的示例中，可以这样添加配置：\n\n```\nmodule.exports = {\n  plugins: [\n    ...\n    {\n \
  \     resolve: 'gatsby-source-filesystem',\n      options: {\n        path: '${__dirname}/src/data',\n\
  \        name: 'md-files',\n        ignore: ['**/\\.*'],\n      },\n    },\n   \
  \ ...\n  ]\n}\n```\n\n通过上述代码，我们启用了 gatsby-source-filesystem 插件，并告诉 Gatsby 在哪里找到文件、内容的名称，以及忽略所有以点开头的文件。现在，重新启动你的应用。在命令行中按\
  \ Ctrl + C，然后运行以下命令：\n\n```\nnpm run dev\n```\n\n作为示例，我们将从一个 Markdown 文件中查询数据。我们将在\
  \ `web/src` 应用文件夹下创建一个名为 `data` 的文件夹。在 `data` 文件夹内，我们创建所有需要的 Markdown 文件。文件按子文件夹组织，系统会自动找到它们。为此，我们需要\
  \ gatsby-transformer-remark 插件，将在下一节中安装。\n\n## 安装和配置 gatsby-transformer-remark 插件\n\
  \n该插件解析并编译 Markdown 文件，并将其转换为 HTML。它还支持 frontmatter，这样你就可以定义 title、slug、date、image、excerpt\
  \ 等字段。\n\n让我们安装并配置该插件。\n\n### 安装插件\n\n由于这是一个 Gatsby 插件，因此可以在插件库中找到它，并附带安装和配置说明。\n\
  \n在你的 Gatsby 文件夹中，运行以下命令来安装插件：\n\n```\nnpm install --save gatsby-transformer-remark\n\
  ```\n\n### 配置插件\n\n插件下载完成后，我们只需在 gatsby-config.js 文件中添加插件名称即可启用它，如下面的代码块所示：\n\n\
  ```\nmodule.exports = {\n  plugins: [\n    ...\n    'gatsby-transformer-remark',\n\
  \    ...\n  ]\n}\n```\n\n就这么简单！现在，重新启动你的应用，我们已准备好创建第一个内容！\n\n## 创建内容文件\n\n在本节中，我们将在一个\
  \ Markdown 文件中创建内容。如上所述，gatsby-transformer-remark 允许你在 Markdown 文件中添加字段。让我们开始添加\
  \ frontmatter，如下所示：\n\n1. 在 `web/src/data` 中创建一个名为 `hello-world.md` 的文件。在文件的开头和结尾添加三条短横线。在这两行之间，你可以定义你的\
  \ frontmatter，如下所示：\n\n```\n---\n// Define your frontmatter.\n---\n```\n\n2. frontmatter\
  \ 中的字段可以定义为键/值对。我们可以添加想要的信息。在本例中，我们将按以下方式添加 title、date 和 excerpt：\n\n```\n---\n\
  title: Hello World\ndate: \"2020-07-12T09:01:00\"\nexcerpt: Hi! This is my first\
  \ content from a markdown file! I will fill with James Joyce's poem.\n---\n```\n\
  \n\n\n\n\n3. 现在我们有了字段，让我们添加正文并保存文件，如下所示：\n\n```\n---\ntitle: Hello World\ndate:\
  \ \"2020-07-20T09:01:00\"\nexcerpt: Hi! This is my first content from a markdown\
  \ file! I will fill with a James Joyce's poem.\n---\n## Lean out of the window\n\
  \n> Lean out of the window,\n> Goldenhair,\n> I hear you singing\n> A merry air.\n\
  > ...\n> Singing and singing\n> A merry air,\n> Lean out of the window,\n> Goldenhair.\n\
  ```\n\n我们的文件现在可以被 GraphiQL 查询了！\n\n## 使用 GraphiQL 查询文件系统\n\n现在我们已经把所有插件、配置和内容文件都放在了正确的位置，让我们开始从\
  \ GraphiQL 查询内容。\n\n前往 http://localhost:8000/___graphql 并运行以下查询：\n\n```\nquery MyQuery\
  \ {\n  allMarkdownRemark {\n    edges {\n      node {\n        frontmatter {\n \
  \         title\n          date\n          excerpt\n        }\n        html\n  \
  \    }\n    }\n  }\n}\n```\n\n```\nresolve: 'gatsby-source-drupal',\n  options:\
  \ {\n    baseUrl: 'site-url', //for example https://example.com\n  },\n},\n... \n\
  ],\n}\n```\n\n通过上面的代码，我们告诉 Gatsby 启用了 gatsby-source-drupal 插件，并且我们指定了 Drupal 应用的统一资源定位符（URL）。\n\
  \n现在我们已经安装并配置了插件，可以开始通过 GraphQL 查询我们的 Drupal 应用了。\n\n## 使用 GraphQL 查询 Drupal\n\n\
  配置好插件后，我们可以通过 GraphiQL 查询 Drupal 应用来测试它。\n\n前往 http://localhost:8000/___graphql\
  \ 并运行以下查询：\n\n```\nquery MyQuery {\n  allNodeArticle {\n    edges {\n      node\
  \ {\n        title\n        body {\n          value\n        }\n      }\n    }\n\
  \  }\n}\n```\n\n此查询将返回以下结果：\n\n```\n```\n{\n    \"data\": {\n      \"allNodeArticle\"\
  : {\n        \"edges\": [\n          {\n            \"node\": {\n              \"\
  title\": \"Hello world\",\n              \"body\": {\n                \"value\"\
  : \"<p>Lean out of the window,<br />\\r\\nGoldenhair,<br />\\r\\nI hear you singing<br\
  \ />\\r\\nA merry air.</p>\\r\\n<p>My book was closed,<br />\\r\\nI read no more,<br\
  \ />\\r\\nWatching the fire dance<br />\\r\\nOn the floor.</p>\\r\\n<p>I have left\
  \ my book,<br />\\r\\nI have left my room,<br />\\r\\nFor I heard you singing<br\
  \ />\\r\\nThrough the gloom.</p>\\r\\n<p>Singing and singing<br />\\r\\nA merry\
  \ air,<br />\\r\\nLean out of the window,<br />\\r\\nGoldenhair.</p>\\r\\n\"\n \
  \             }\n            }\n          }\n        ]\n      }\n    }\n}\n```\n\
  ```\n\n在本节中，我们安装并配置了 `gatsby-source-drupal` 插件。我们还查询了一个 Drupal 应用并从应用中检索了数据。\n\n\
  在下一节中，我们将了解如何在一个查询中同时查询 `gatsby-source-filesystem` 和 `gatsby-source-drupal` 插件。\n\
  \n# ### 同时查询文件系统和 Drupal 插件\n\n可以在同一个查询中查询两个内容源，这在构建包含来自不同来源的内容的列表页面时非常有利。\n\n我们的查询将包含属于两个插件的调用和字段。我们将得到一个单一的响应，其中包含来自两个来源的结果，按其根名称分隔。在这种情况下，Drupal\
  \ 内容将包含在 `allNodeArticle` 数组下，而文件系统内容将包含在 `AllMarkdownRemark` 数组下。\n\n正如我们已经看到的，我们可以前往\
  \ `http://localhost:8000/___graphql` 并运行以下查询：\n\n```\nquery MyQuery {\n  allNodeArticle\
  \ {\n    edges {\n      node {\n        title\n        body {\n          value\n\
  \        }\n      }\n    }\n  }\n  allMarkdownRemark {\n    edges {\n      node\
  \ {\n        frontmatter {\n          title\n          date\n          excerpt\n\
  \        }\n        html\n      }\n    }\n  }\n}\n```\n\n此查询将返回以下结果：\n\n```\n```\n\
  {\n  \"data\": {\n    \"allNodeArticle\": {\n      \"edges\": [\n        {\n   \
  \       \"node\": {...}\n        }\n      ],\n    \"allMarkdownRemark\": {\n   \
  \   \"edges\": [\n        {\n          \"node\": {...}\n        }\n      ]\n   \
  \ }\n  }\n}\n```\n```\n\n正如我们所见，我们在同一个查询结果中同时获得了来自 Drupal 和文件系统的两个不同来源的内容。\n\n#\
  \ ## 总结\n\n在本章中，我们学习了如何使用插件扩展 Gatsby 以丰富应用的功能。我们学习了以下内容：什么是插件；npm；如何使用语义化版本控制；以及如何安装和更新插件。我们还学习了\
  \ Gatsby 插件库的结构以及如何安装和配置 Gatsby 插件。我们安装并配置了 `gatsby-source-filesystem` 和 `gatsby-transform-remark`\
  \ 插件，并使用 GraphQL 查询 Markdown 文件中的内容。我们还安装并配置了 `gatsby-source-drupal` 插件，并使用 GraphQL\
  \ 查询 Drupal 应用中的内容。\n\n当我们需要从其他来源获取内容时，这些插件很有用，特别是当我们需要构建一个从不同来源聚合内容的应用时。\n\n在下一章中，我们将讨论\
  \ Gatsby 组件以及页面、模板和局部组件的结构，以及它们之间的区别。\n\n## 进一步阅读\n\n+   - 在 https://semver.org/\
  \ 阅读更多关于语义化版本控制的内容。\n+   - 在 https://www.gatsbyjs.org/packages/gatsby-transformer-remark/\
  \ 阅读更多关于 gatsby-transformer-remark 插件的内容。\n+   - 在 https://www.gatsbyjs.org/packages/gatsby-source-drupal\
  \ 阅读更多关于 gatsby-source-drupal 插件的内容。\n+   - 在 https://www.gatsbyjs.org/packages/gatsby-source-filesystem/\
  \ 阅读更多关于 gatsby-source-filesystem 插件的内容。\n"
- "# 10\n构建 Gatsby 组件\n\n本章介绍 Jamstack 的 M 组件；即标记。标记最常用于渲染或生成最终用户将在浏览器中查看的内容，并附带一些格式。Gatsby\
  \ 中的代码模块化是通过使用组件实现的，这是其构建块。每个使用 JavaScript 和 JSX 构建的组件构建块将接受输入并向浏览器返回 HTML 和网络内容。在本章中，我们将学习如何创建、编辑和扩展这些组件——网站的构建块。\n\
  \n组件存在多种形式，因此我们还将了解它们如何生成单个页面，作为页面模板存在，以及页面局部组件的结构，以及三者之间的区别。\n\n本章将涵盖的主要主题如下：\n\
  \n+   - React 组件\n+   - 理解组件的类型\n\n### 技术要求\n\n本章需要一个终端程序和一个源代码编辑器程序。\n\n本章的代码文件可以在以下链接找到：https://github.com/PacktPublishing/Jumpstart-Jamstack-Development/tree/chapter_ten。\n\
  \n## React 组件\n\nGatsby 在底层使用 React，因此可以利用 React 的所有功能。React 组件大多是一个返回某些内容的 JavaScript\
  \ 函数。通过利用 GraphQL，开发人员可以使用 Gatsby 的源插件将数据传递到页面。属性通常发送到组件，然后事件向上传递。这些模式——props 向下，事件向上，或数据向下，动作向上——在多个\
  \ JavaScript 框架中使用，并且非常容易理解。一旦创建了 React 组件，它可以被导入到另一个组件中以便轻松重用。\n\n## 标签约定\n\n如前一节所述，一旦创建了组件，就可以在\
  \ Gatsby 中像使用自己的 HTML 标签一样调用或使用它，因此对于熟悉 HTML 标签工作的人来说使用起来很熟悉。这对于可读性很有用，因为输出看起来像\
  \ HTML 而不是 JavaScript 代码。使用 React 组件的约定是将组件名称封装在 HTML 标签中。它必须以大写字母开头。\n\n为了说明这个概念，例如，如果我们有一个名为\
  \ books 的组件，我们可以按如下方式将其包含在项目中：\n\n```\n<Books />\n```\n\n让我们开始查看 Gatsby 中使用的各种组件类型。\n\
  \n## 理解组件的类型\n\n本项目中使用了三种主要类型的 Gatsby 组件：页面组件、模板和局部组件。让我们分别查看每种类型，因为它们都服务于不同的目的。\n\
  \n\n\n\n\n### Gatsby 页面组件\n\nGatsby 中使用的最简单组件类型之一是页面组件。Gatsby 页面组件仅用于单个、唯一的页面，例如索引（主页）、404\
  \ 页面或“关于我们”页面。此页面只会生成一次。\n\n#### 构建和修改 Gatsby 页面组件\n\n如前所述，页面是唯一的。通过创建一个页面组件并将其放置在\
  \ `/web/src/pages` 文件夹中，Gatsby 将自动生成该页面。\n\nGatsby 中页面组件的内容可以像下面的示例一样简单，它将整个页面内容放在一个字符串中：\n\
  \n```\n// Does not require React because there is no JSX\nconst AboutUsPage = ()\
  \ => (\n  `Who we are: .......`\n)\nexport default AboutUsPage\n```\n\n下面是编写上述代码的一种更简短方式：\n\
  \n```\nconst AboutUsPage = () => {\nreturn `Who we are: .......`\n}\n```\n\n通过使用\
  \ JSX 增强此示例，我们可以创建如下示例：\n\n```\n//Requires React because this example uses JSX tags.\n\
  import React from 'react'\n\nconst AboutUsPage = () => (\n  <html>\n    <body>\n\
  \      <h1>Who we are:</h1>\n        <p>.......</p>\n    </body>\n  </html>\n)\n\
  export default AboutUsPage\n```\n\n如果我们将文件命名为 `about-us.js`，并将其放置在 `/web/src/pages/`\
  \ 目录中，那么运行 Gatsby 后将显示以下屏幕截图：\n\n我们是谁：......\n\n图 10.1 – “关于我们”页面的屏幕截图\n\n此 AboutUsPage\
  \ 示例将在浏览器中渲染为 HTML。\n\n## Gatsby 模板组件\n\n顾名思义，Gatsby 模板组件就是模板。这些组件用作页面的模板，例如文章页面，其中页面的某些部分将填充唯一内容。这些模板会根据需要处理多次，以生成所需的全部内容。\n\
  \n### 构建和修改模板组件\n\n为了说明这一概念，我们将为网站上的活动创建一个模板。我们需要处理的第一个文件是 `/web/src/gatsby-node.js`。此文件包含使用模板显示博客文章的代码。\n\
  \n在 `gatsby-node.js` 文件的底部，相关代码如下：\n\n```\nexports.createPages = async ({graphql,\
  \ actions}) => {\n  await createBlogPostPages(graphql, actions)\n}\n```\n\n现在，我们将添加另一个函数，通过\
  \ GraphQL 生成来自 Sanity 的活动：\n\n```\nexports.createPages = async ({graphql, actions})\
  \ => {\n  await createBlogPostPages(graphql, actions)\n  await createEventPages(graphql,\
  \ actions)\n}\n```\n\n接下来，我们将复制 createBlogPostPages 的内容。整个函数都应该复制。不过，为节省篇幅，函数中间的部分被省略了。以下是一个片段：\n\
  \n```\nasync function createBlogPostPages (graphql, actions) {\n  const {createPage}\
  \ = actions\n  const result = await graphql(`\n  .....\ncreatePage({\n    path,\n\
  \    component:\n        require.resolve('./src/templates/blog-post.js'),\n    context:\
  \ {id}\n    })\n})\n```\n\n下面是新创建的 createEventPages 函数的结构：\n\n```\nasync function\
  \ createEventPages(graphql, actions) {\n    const {createPage} = actions\n    const\
  \ result = await graphql(`\n    {\n        allSanityEvent {\n            ...\n \
  \       }\n    }\n`)\n    ...\n    if (result.errors) throw result.errors\n\n  \
  \  const eventEdges = (result.data.allSanityEvent || {}).edges || []\n    ...\n\
  \    eventEdges\n    .forEach((edge, index) => {\n        ...\n    })\n```\n\n现在，让我们检查这段代码。使用\
  \ graphql 和 actions 参数创建一个异步函数。该函数始终会返回一个 promise：\n\n```\nasync function createEventPages(graphql,\
  \ actions) {\n```\n\n从 actions 中提取 createPage 方法，将其声明为常量，或者说对其进行解构：\n\n```\nconst\
  \ {createPage} = actions\n```\n\n声明常量 result，用于保存 GraphQL 查询的结果。JavaScript 函数会等待查询完成后再继续执行。查询包含在反引号运算符（`）中：\n\
  \n```\nconst result = await graphql(`\n{\n```\n\n下面几行与 GraphQL 查询类似，它通过 `gatsby-source-sanity`\
  \ 从 `allSanityEvent` 返回 Gatsby 的 id 和 `dateAndTime`：\n\n```\nallSanityEvent {\n\
  \  edges {\n    node {\n      id\n      dateAndTime\n    }\n  }\n}\n`\n```\n\n如果存在任何错误，则抛出异常：\n\
  \n```\nif (result.errors) throw result.errors\n```\n\n接下来，我们查看下面这行代码：\n\n```\nconst\
  \ eventEdges = (result.data.allSanityEvent || {}).edges || []\n```\n\n声明一个名为 `eventEdges`\
  \ 的常量。如果查询的 edges 不为空，则将查询结果中的 edges 赋给它。否则，如果没有结果，则为 `eventEdges` 实例化一个空数组。请记住，GraphQL\
  \ 查询的结果封装在 data 中。\n\n使用 forEach 对所有 edges 进行迭代或循环，为 GraphQL 查询中的每条 edge 使用一个 edge\
  \ 变量：\n\n```\neventEdges\n.forEach((edge, index) => {\n```\n\n从 edge 的 node 对象中解构\
  \ `id` 和 `dateAndTime`：\n\n```\nconst {id, dateAndTime} = edge.node\n```\n\n使用 `date-fns`\
  \ 中的 `format` 函数格式化 `dateAndTime`。该函数包含在 Gatsby 的 `package.json` 文件中，可以将原本会打印为 `2020-04-10T15:30:00.000Z`\
  \ 的日期转换为更易接受的四位数年份、正斜杠、两位数月份格式（YYYY/MM），并将结果赋给名为 `dateSegment` 的常量：\n\n```\nconst\
  \ { format } = require('date-fns')\nconst dateSegment = format(dateAndTime, 'YYYY/MM')\n\
  ```\n\n创建实际作为单页面 URL 并在浏览器中显示的路径。这里使用的是 Gatsby 创建的 ID，而不是 Sanity 的 ID；Sanity 的 ID\
  \ 可以在 GraphQL 查询中通过 `_id` 访问：\n\n```\nconst path = `/event/${dateSegment}/${id}/`\n\
  ```\n\n以下是 URL 路径示例：\n\n```\n/event/2021/09/dd88fc6c-10c5-572e-8c58-696add54a14a/\n\
  ```\n\n最后，调用 `createPage` 函数，传入路径，为每个页面指定 `event.js` 模板文件，并将 `id` 作为 `context` 参数传入：\n\
  \n```\ncreatePage({\n  path,\n  component:\n    require.resolve('./src/templates/event.js'),\n\
  \  context: {id}\n})\n```\n\n`event.js` 文件的内容将用于 `createPage` 方法的 `component` 属性，并且会被解析，将页面内容与其模板结合起来，从而生成一个单独的页面。\n\
  \n### 构建 event.js 模板\n\n`event.js` 是每个单独活动页面所使用的模板，因此让我们看看它是如何构建的：\n\n1. 首先，我们需要使用一些\
  \ import 语句引入必要的功能：\n\n```\nimport React from 'react'\nimport {graphql} from 'gatsby'\n\
  import Container from '../components/container'\nimport GraphQLErrorList from '../components/graphql-error-list'\n\
  import Event from '../components/event'\nimport SEO from '../components/seo'\nimport\
  \ Layout from '../containers/layout'\nimport {toPlainText} from '../lib/helpers'\n\
  ```\n\n2. 接下来，我们需要执行一个 GraphQL 查询，以获取页面的每个元素：\n\n```\nexport const query = graphql`\n\
  \  query EventTemplateQuery($id: String!) {\n    event: sanityEvent(id: {eq: $id})\
  \ {\n      name\n      _rawBody\n      venue {\n        name\n      }\n    }\n \
  \ }\n`\n```\n\n要生成活动页面，至少需要活动的名称、`_rawBody` 以及相关场地的名称。\n\n3. 接下来，使用 props（属性）作为参数定义\
  \ `EventTemplate`，并最终将其导出：\n\n```\nconst EventTemplate = props => {\n...\n}\n\n\
  export default EventTemplate\n```\n\n4. 接下来，从 props 参数中解构 data 和 errors 对象。然后，如果存在\
  \ data，则实例化 `event` 常量以保存 data 对象中的 event：\n\n```\nconst {data, errors} = props\n\
  const event = data && data.event\n```\n\n5. 接下来，在 `SEO` 组件和 `Event` 组件中调用 `Layout`\
  \ 组件。为避免造成干扰，错误处理代码已被移除，但如果存在错误，这里也会显示错误。布局会生成页面布局和标签（例如页眉和页脚），并为活动提供一个包装器：\n\n\
  ```\nreturn (\n  <Layout>\n    {event && <SEO title={event.name || 'Untitled'} />}\n\
  \    {event && <Event {...event} />}\n  </Layout>\n)\n```\n\n> 注意\n> 请注意，这里使用了 JavaScript\
  \ ES6 展开语法，将 Event 对象的每个值分别赋给供 Event 组件使用的独立值。\n\n\n\n\n\n## 第 10 章（续）\n\n这个 Event\
  \ 标签代表了一种可以轻松插入到众多上下文环境中的组件示例。在图 10.2 中，我们可以看到一个示例事件在页面上的显示方式：\n\n我的新博客\n\nIT 大会\
  \ @ Agora\n\nLorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod\
  \ tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis\
  \ nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.\
  \ Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu\
  \ fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in\
  \ culpa qui officia deserunt mollit anim id est laborum.\n\n图 10.2 – 一个事件\n\n在下一节中，我们将探讨示例页内组件或部分组件是如何构建的。\n\
  \n### Gatsby 部分组件\n\n部分组件（Partials，一些前端系统对其的称呼）是非页面组件，例如页眉或页面中可以被嵌入并在整个网站中多次重用的元素。\n\
  \n### 构建和修改 Gatsby 部分组件\n\nGatsby 部分组件的格式与其他组件相似。然而，存在一些差异。主要的区别在于它们不是完整的页面，因此不能直接渲染。此外，它们将通过导入的方式嵌入到文件中。\n\
  \n让我们看看部分组件文件是如何构建的：\n\n1. 首先，几条导入语句引入了一些库以增强功能和辅助功能：\n\n```javascript\nimport React\
  \ from 'react'\nimport {buildImageObj} from '../lib/helpers'\nimport {imageUrlFor}\
  \ from '../lib/image-url'\nimport PortableText from './portableText'\nimport Container\
  \ from './container'\n```\n\n2. 首先，我们将继续使用来自博客文章的层叠样式表：\n\n```javascript\nimport\
  \ styles from './blog-post.module.css'\n```\n\n3. 接下来，定义 Event 函数，并通过 props 参数将单个事件的属性传入函数。该函数在末尾导出：\n\
  \n```javascript\nfunction Event (props) { ... }\nexport default Event\n```\n\n_rawBody、name\
  \ 和 venue 对象从 props 参数中解构，因为它们是页面内容所必需的：\n\n```javascript\nconst { _rawBody, name,\
  \ venue } = props\n```\n\n4. 最后，生成并返回页面的内容：\n\n```javascript\nreturn ( ... )\n```\n\
  \n5. article 标签是 HTML5 中的标准语义标签，在这里用作最外层标签，包裹内容：\n\n```html\n<article className={styles.root}>\n\
  \  <Container>\n    <div className={styles.grid}>\n      <div className={styles.mainContent}>\n\
  ```\n\n6. 在这里，我们使用点表示法打印事件名称和场地名称，因为场地名称包含在 venue 对象内。请注意，动态元素用大括号括起来，以便用实际值替换：\n\
  \n```html\n<h1 className={styles.name}>{name} @ {venue.name}</h1>\n```\n\n7. 最后，这里采用了一种技巧，指示\
  \ Gatsby 如果 _rawBody 存在则显示它，使用逻辑与运算。双 ampersand（&&）用于表示“与”。格式是如果 a 和 b。在这里，如果 a\
  \ 为 false，意味着 _rawBody 没有内容，那么 <PortableText> 标签及其内容 _rawBody 将不会被显示。\n\nPortableText\
  \ 是一个将 Sanity 的内容 _rawBody 转换为 React 内容的组件，以便正确显示：\n\n```html\n{_rawBody && <PortableText\
  \ blocks={_rawBody} />}\n      </div>\n    </div>\n  </Container>\n</article>\n\
  ```\n\n下图是该页面显示方式的示例：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_154_0.png)\n\n\
  图 10.3 – 示例 Gatsby 页面\n\n## 总结\n\n在本章中，我们学习了页面、模板和部分组件。页面组件代表一个独特的页面，模板用于生成许多相似类型的页面，而部分组件是可以用于其他页面中的内容片段。Gatsby\
  \ 中使用的每种组件都基于 React，因此它重用了基于 JavaScript 的健壮系统。这些组件是 Gatsby 的构建块，因此知道如何创建和使用它们对于所有\
  \ Gatsby 开发都是必不可少的。\n\n在下一章中，我们将开始探索 Jamstack 缩写字母中的 A 部分 – API。\n"
- "# 11\n\n## API – 扩展 Gatsby\n\n在本章中，您将了解 Jamstack 中的 A 部分——即**应用程序编程接口（API）**。我们将学习如何在编译后网页的动态部分中使用它们，以重现\
  \ web 开发者在传统基于服务器的 web 开发中熟悉的函数。我们将使用 Netlify 表单创建一个自定义的**提议活动**表单，并通过 Netlify 函数管理提交内容。我们还将了解如何将第三方服务连接到我们的\
  \ Gatsby 应用程序。\n\n本章将涵盖以下主题：\n\n- API 简介\n- Gatsby – API\n\n### 技术要求\n\n要彻底理解本章内容，我们需要以下应用程序：\n\
  \n- 终端（Terminal）\n- 已安装的 Gatsby 应用程序\n- 一个 Netlify 账户\n\n本章的代码文件可以在 `https://github.com/PacktPublishing/Jumpstart-Jamstack-Development/tree/chapter_eleven`\
  \ 找到。\n\n### API 简介\n\nAPI 几乎从我们开始编程起就存在了。现代 API 在 21 世纪初开始成为我们现在的样子，当时像亚马逊这样的公司开始通过**超文本传输协议（HTTP）**请求提供对其数据的访问。这些公司改变了我们在网上做生意的方式。开发人员现在可以从\
  \ Salesforce 等服务获取和发布用户信息，并使用 API 在其应用程序上提供完整的电子商务体验。\n\n2004 年，随着社交网络的引入，我们改变了使用互联网的方式。Facebook\
  \ 和 Twitter 等公司开始开发自己的 API。类似于电子商务体验，开发人员现在可以从社交网络应用程序中获取用户的个人资料信息、事件和图片。\n\n几年后，新一代智能手机问世。人们开始通过手机浏览互联网，开发人员开始开发可以安装在智能手机上的应用程序，而\
  \ API 是连接这些服务的正确方式。Instagram 改变了我们在互联网上分享照片的方式，并在几年后提供了自己的 API。\n\n大约在 2010 年，我们拥有桌面和智能手机设备通过\
  \ Web 应用程序和移动应用程序消费 API 并依赖第三方 Web 服务，而在 2015 年左右，更多设备变得更加*智能*。任何能够连接到互联网的设备都可以访问\
  \ Web 服务的 API 资源。智能音箱、恒温器、手表和许多其他设备开始消费 API。\n\nAmazon Alexa、Google Nest、Fitbit\
  \ 和 Apple Watch 只是我们现在每天使用的众多设备中的少数几个，它们可以从 API 获取数据。\n\n让我们在下节中探索 Gatsby API。\n\
  \n### Gatsby – API\n\n在本节中，我们将探索如何在 Gatsby 内部使用 API。在本章我们将构建的示例中，我们将创建一个活动表单，匿名用户可以在其中提议他们的活动。当用户提交表单时，我们将通过\
  \ API 将提交内容添加到 Sanity。\n\n为了实现这一点，我们将执行以下操作：\n\n- 在我们的活动应用程序的主页上创建一个 Netlify 表单。\n\
  - 配置一个来自 Sanity 的令牌，以便我们可以通过 API 提交表单。\n- 配置一个 Netlify 函数在提交时发送数据。\n\n### 创建 Netlify\
  \ 表单\n\n作为我们的第三方服务，我们将使用 Netlify Forms，这是 Netlify 提供的内置表单处理功能。当代码部署到 Netlify 时，系统会自动检测表单并在您的\
  \ Netlify 站点管理面板中创建一个表单提交页面。\n\n要创建 Netlify 表单，只需在 `<form>` 标签中添加 `netlify=\"true\"\
  ` 属性数据，并添加 `<input type=\"hidden\" name=\"form-name\" value=\"YOUR_ VALUE\" />`\
  \ 隐藏字段，您就可以开始了。\n\n我们的表单将包含以下字段：\n\n- **全名**\n- **电子邮件**\n- **活动标题**\n- **日期**\n\
  - **场地**\n- **虚拟**\n- **活动 URL**\n- **描述**\n\n我们将表单添加到主页，就在页脚之前，如下所示：\n\n1. 打开位于\
  \ `/web/src/pages/` 下的 `index.js` 文件。\n2. 在闭合容器标签（`</Container>`）之前，我们可以像这样添加我们的表单：\n\
  \n```html\n<form name=\"propose-event\" method=\"POST\" data-netlify=\"true\" >\n\
  \    <input type=\"hidden\" name=\"form-name\" value=\"propose-event\" />\n</form>\n\
  ```\n\n\n\n\n\n如您所见，我们添加了将表单提交到 Netlify 所需的两个参数。\n\n3. 让我们继续添加其他字段，如下所示：\n\n```\n\
  <form name='propose-event' method='POST' data-netlify='true' >\n    <input type='hidden'\
  \ name='form-name' value='propose-event' />\n    <div className='field'>\n     \
  \   <label className='label'>Full name:\n            <input className='input' type='text'\
  \ name='name'/>\n        </label>\n    </div>\n    <div className='field'>\n   \
  \     <label className='label'>Email:\n            <input className='input' type='email'\
  \ name='email'/>\n        </label>\n    </div>\n    ...\n    <div className='field'>\n\
  \        <label className='label'>Message:\n            <textarea className='textarea'\
  \ name='message'></textarea>\n        </label>\n    </div>\n    <div className='field'>\n\
  \        <button className='button' type='submit'>Send</button>\n    </div>\n</form>\n\
  ```\n\n场地（Venue）字段将从我们的站点获取场地信息。让我们添加查询以获取所有场地。\n\n+   4. 在我们的 index.js 页面中，在 `IndexPageQuery`\
  \ 查询内，我们可以添加一个查询以获取所有场地的 ID 和名称，如下所示：\n\n```\nQuery IndexPageQuery {\n    ...\n\
  \    venues: allSanityVenue {\n        edges {\n            node {\n           \
  \     _id\n                name\n            }\n        }\n    }\n}\n...\n```\n\n\
  +   5. 将数据映射到一个名为 `venueNodes` 的常量中，如下面的代码片段所示：\n\n```\nconst venueNodes = (data\
  \ || {}).venues\n    ? mapEdgesToNodes(data.venues)\n    : []\n```\n\n+   6. 将我们的场地字段添加到表单中，如下所示：\n\
  \n```jsx\n<div className=\"field\">\n    <label className=\"label\">Venue:\n   \
  \     <select className=\"select\" name=\"venue\">\n            {\n            \
  \    venueNodes && venueNodes.map((venue) => (\n                    <option id={venue._id}>{venue.name}</option>\n\
  \                ))\n            }\n        </select>\n    </label>\n</div>\n```\n\
  \n现在我们的 HTML 表单已经就绪，它应该看起来像这样：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_160_0.png)\n\
  \n图 11.1 – Gatsby 应用程序主页下的表单\n\n我们准备好将其推送到 GitHub。\n\n### 将表单部署到 Netlify\n\n如我们所知，当我们将代码推送到\
  \ GitHub 时，它会自动部署到 Netlify，如下面的步骤所示：\n\n+   1. 一旦部署到 Netlify，我们就能看到表单位于我们 Netlify\
  \ 站点管理面板的“表单”选项卡下，如下面的截图所示：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_160_1.png)\n\
  \n图 11.2 – 表单选项卡\n\n+   如果你点击 **表单**，你将看到 **提交内容**，如下面的截图所示：\n\n#### 已验证的提交\n\n\
  #### 没有剩余的已验证提交\n\n此表单的已验证提交已全部被删除或标记为垃圾邮件。\n\n图 11.3 – Netlify 表单页面\n\n让我们添加一个新的提交。\n\
  \n+   转到你在 Netlify 上的 Gatsby 在线站点并填写表单。当你点击 **发送** 后，你会收到以下确认消息：\n\n#### 谢谢！\n\n\
  您的表单提交已收到。\n\n← 返回我们的网站\n\n图 11.4 – Netlify 提交成功页面\n\n4. 现在，让我们回到 Netlify 表单管理面板以查看我们的提交，如下面的截图所示：\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_162_0.png)\n\n图 11.5 – Netlify 提交列表\n\
  \n如您所见，我们在 Netlify 上有我们的表单提交。\n\n现在，让我们扩展我们的表单并使用 Sanity API 来获取和插入信息。\n\n### 在\
  \ Sanity 中配置令牌表单\n\n当提交新表单时，我们需要在 Sanity 应用程序中添加一个新事件。为了做到这一点，我们创建一个令牌，授予我们的函数访问\
  \ Sanity 并创建事件的权限。\n\n我们还需要在我们的事件中添加一个新的 'approved'（已批准）字段，以避免在我们的 Sanity 应用程序上发布不需要的活动。\n\
  \n#### 创建 approved 字段\n\n我们将创建一个布尔字段，用于定义活动是否已获批准。\n\n打开位于 `studio/schemas/documents.index.js`\
  \ 下的事件架构文件，并在 `fields` 数组中添加新字段，如下所示：\n\n```\nexport default {\n  name: 'event',\n\
  \  type: 'document',\n  title: 'Event',\n  fields: [\n    ...\n    {\n      name:\
  \ 'approved',\n      type: 'boolean',\n      title: 'Approved'\n    },\n    ...\n\
  \  ]\n}\n```\n\n保存文件并重启你的本地应用程序。现在，你应该能在本地 Sanity 应用程序中看到该字段。\n\n要将该字段部署到生产环境，请在终端中进入\
  \ `/studio` 文件夹并输入以下命令：\n\n```\nsanity graphql deploy\n```\n\n#### 部署 Sanity 令牌\n\
  \n首先，我们将专门为此表单生成一个新令牌。为此，请进入你的 **Manage Sanity**（管理 Sanity）管理面板 (`https://manage.sanity.io/`)\
  \ 并点击你的项目。然后，按以下步骤操作：\n\n+   1.  转到 **站点设置 | API** 并向下滚动到 **令牌**。现有令牌被 Gatsby 用于从\
  \ Sanity 检索内容。现在，我们需要生成一个新令牌以向 Sanity 写入数据。\n\n2. 点击蓝色的 **添加新令牌** 按钮，如下面的截图所示：\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_164_0.png)\n\n图 11.6 – 令牌\n\n3. 输入标题，然后选择\
  \ **权限** 为 **写入**。此权限赋予用户读取、写入和删除数据的权限。现在，点击绿色的 **添加新令牌** 按钮，如下面的截图所示：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_164_1.png)\n\
  \n图 11.7 – 添加新令牌\n\n生成一个新令牌并提示给你。\n\n4. 复制该令牌，然后回到你的 Netlify 项目并点击 **设置 | 构建与部署\
  \ | 环境变量**。\n\n在设置的这一部分中，可以将令牌安全地存储为环境变量，如下面的截图所示：\n\n#### 环境变量\n\n为你的构建脚本和附加组件设置环境变量。\n\
  \nSANITY_DEPLOY_STUDIO_TOKEN      skOhxPmPlPUmb2WGJhXVppW...\n\n在文档中了解更多信息关于环境变量\
  \ ↗\n\n编辑变量\n\n图 11.8 – Netlify 环境变量设置页面\n\n+   5. 点击 编辑变量 | 新变量。\n\n+   6. 添加你的新令牌，名为\
  \ SANITY_STUDIO_PROPOSE_EVENT，并点击保存，如下面的截图所示：\n\n#### 环境变量\n\n为你的构建脚本和附加组件设置环境变量。\n\
  \n键\nSANITY_DEPLOY_STUDIO_TOKEN\n\n值\nskSlzHAEqvWdtWYww4vqM2Lw73qb9dynPyJlek\n\n\
  SANITY_STUDIO_PROPOSE_EVENT\n\nskR9qwePUzIz4nyGCjv43NV1eff84ux3Zdo5X1tb\n\n新变量\n\
  \n在文档中了解更多信息关于环境变量 ↗\n\n保存   取消\n\n图 11.9 – Netlify 环境变量设置页面\n\n6. 一旦 netlify-cli\
  \ 工具安装完毕，从终端进入 /web 目录并输入以下命令：\n\n```\nnetlify link\n```\n\n7. 出现以下提示时，通过选择之前在 GitHub\
  \ 创建的项目来选择正确的项目：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_167_0.png)\n\n图 11.10\
  \ – 终端\n\n8. 选择 Gatsby 应用程序（即那个以 web 结尾的应用程序）；在我们的案例中是 hands-on-jamstack-web，如下面的截图所示：\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_167_1.png)\n\n图 11.11 – 终端\n\n现在，链接已完成。\n\
  \n9. 一旦链接完成，在 web 目录内输入以下命令：\n\n```\nnetlify dev\n```\n\n此命令将启动你的 Gatsby 项目并设置一个\
  \ AWS Lambda 服务器，并在端口 8888 上启动一个服务器。\n\n10. 现在，你可以从 http://localhost:8888 访问你的本地站点，并从\
  \ http://localhost:8888/.netlify/functions/hello-world 查看你的函数输出，如下面的截图所示：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_168_0.png)\n\
  \n图 11.12 – 我们 Gatsby 应用程序上的 Netlify 函数\n\n在本节中，我们在 Gatsby 主页上创建了一个新的 Netlify 表单，在\
  \ Sanity 上创建了一个令牌以允许 Netlify 插入一个新的提议事件，并配置了我们的 Netlify 函数文件夹。\n\n在下一节中，我们将创建一个函数，将新的提议事件插入到我们的\
  \ Sanity 数据集中。\n\n### 创建 submission-created.js 文件\n\nNetlify 表单提交会触发一个 submission-created\
  \ 事件。请执行以下步骤来创建 .js 文件：\n\n+   1. 在 web/functions 内部创建一个名为 submission-created.js\
  \ 的文件。此函数将处理来自 Netlify 表单的提交。\n+   2. 接下来，为此函数创建 export .handler，如下所示：\n\n```\n\
  exports.handler = async (event, context, callback) => {\n}\n```\n\n此 handler 接收一个\
  \ event 对象，其中包含 path、httpMethod、headers、queryStringparameters、body 和 isBase64Encoded。\n\
  \ncontext 参数包含诸如用户身份信息等信息。callback 参数类似于 AWS Lambda 函数中的 callback 参数。代码可以在下面的片段中看到：\n\
  \n```\nexports.handler = function(event, context, callback) {\n    callback(null,\
  \ {\n    statusCode: 200,\n    body: \"Hello, World\"\n    });\n}\n```\n\nSanity\
  \ 提供 Client API 通过 API 添加内容。\n\n\n\n\n3.  在我们的 `submission-created.js` 文件中，让我们在文件顶部添加客户端，如下所示：\n\
  \n```\nconst sanityClient = require('@sanity/client')\nexports.handler = function(event,\
  \ context, callback) {\n    callback(null, {\n        statusCode: 200,\n       \
  \ body: \"Hello, World\"\n    });\n}\n```\n\n4.  要初始化客户端，我们需要提供 Sanity 项目 ID、数据集名称和访问令牌。在我们的\
  \ Sanity 应用主页中，我们的本地环境位于 http://localhost:3333。从你的 Sanity 管理控制台获取项目 ID 和使用的数据集。\n\
  \n5.  我们已经在上一节中创建了访问令牌，现在可以像下面这样复用它：\n\n```\nconst sanityClient = require('@sanity/client')\n\
  const client = sanityClient({\n    projectId: 'my_project_id',\n    dataset: 'my_dataset',\n\
  \    token: process.env.SANITY_STUDIO_ADD_EVENT\n})\nexports.handler = function(event,\
  \ context, callback) {\n    callback(null, {\n        statusCode: 200,\n       \
  \ body: \"Hello, World\"\n    });\n}\n```\n\n6.  现在，我们可以使用 `create(doc)` 方法向 Sanity\
  \ 添加新事件。\n\n7.  客户端方法需要一个表示文档的普通 JavaScript 对象。它必须包含 `_type` 属性。\n\n让我们开始构建文档。我们的事件的字段如下：\n\
  \n-   标题\n-   日期\n-   事件 URL\n-   地点\n-   虚拟\n-   描述\n\n8.  在我们的 handler 内部，我们必须获取事件的\
  \ body，如下所示：\n\n```\nexports.handler = async function(event, context,\n        callback)\
  \ {\n    const { payload } = JSON.parse(event.body)\n...\n}\n```\n\n9.  现在，我们可以映射\
  \ payload 中的字段，像这样：\n\n```\nconst doc = {\n    _type: 'event',\n    name: payload.data.eventTitle,\n\
  \    dateTime: payload.data.date,\n    virtual: payload.data.virtual === 'on',\n\
  \    eventUrl: payload.data.eventUrl,\n    venue: {\n        _ref: payload.data.venue,\n\
  \        _type: 'reference'\n    },\n    body: [{\n        _type: 'block',\n   \
  \     'children': [{\n            _type: 'span',\n            'text': payload.data.message\n\
  \        }]\n    }],\n    approved: false\n}\n```\n\n10.  现在我们的文档已经准备好了，我们可以将它传递给\
  \ `create(doc)` 函数，如下所示：\n\n```\nconst sanityClient = require('@sanity/client')\n\
  const client = sanityClient({\n  projectId: 'my_project_id',\n  dataset: 'my_dataset',\n\
  \  token: process.env.SANITY_STUDIO_ADD_EVENT\n})\n\nexports.handler = async function(event,\
  \ context, callback) {\n  const { payload } = JSON.parse(event.body)\n  const doc\
  \ = {\n    ...\n  }\n\n  // Create document\n  await client.create(doc)\n    .then(res\
  \ => {\n      callback(null, {statusCode: 200})\n    })\n}\n```\n\n完成了。现在，将代码添加到\
  \ Git 并推送到 master 分支。部署完成后，我们可以在生产环境中进行测试。\n\n在你的在线 Gatsby 应用程序中，填写表单并按下发送，如图 11.1\
  \ 所示。一个新的提交将被添加到 Netlify Forms，内容将从 Gatsby 通过 Netlify 函数添加到 Sanity。\n\n## 总结\n\n\
  在本章中，我们学习了如何使用 Netlify Forms 来使创建和管理表单提交变得顺畅。我们使用 Netlify 函数的力量，扩展了 Netlify 表单，并在提交时添加了我们自己的操作。最后，我们使用了\
  \ Sanity API，通过 Netlify 函数从 Netlify 表单创建新的事件内容。\n\n在下一章中，我们将创建一个 Alexa 技能，从我们的 Sanity\
  \ 数据集中读取事件。\n"
- "# 12 API – Alexa 技能\n\nAlexa 是亚马逊的虚拟助手，可以为个人执行任务或服务，它使用自然语言处理和机器学习将语音输入转换为可执行命令。Alexa\
  \ 可以提供多种服务，从音乐播放到创建待办事项列表、播放有声读物，以及提供天气、交通和新闻。Alexa 还能够控制许多智能设备，允许你为家庭构建自动化系统。亚马逊用户可以通过\
  \ Alexa 技能商店安装技能（功能，类似于应用程序），以扩展 Alexa 的能力。\n\n在本章中，我们将构建 Jumpstart Jamstack Alexa\
  \ 技能。用户将能够询问接下来的五个事件。通过这个示例，你将能够通过检索过去的事件或所有事件来扩展现有技能，并且你还可以为其他任何应用创建新技能。\n\n我们将涵盖以下主题：\n\
  \n-   Alexa 技能生命周期\n-   创建技能\n\n### 技术要求\n\n要开发 Alexa 技能，你必须通过 https://developer.amazon.com/alexa\
  \ 创建账户来访问 Alexa 开发者控制台。此外，你需要在系统上安装 Sanity Studio。\n\n本章的代码可在 `https://github.com/PacktPublishing/Jumpstart-Jamstack-Development/tree/chapter_twelve`\
  \ 获取。\n\n### Alexa 技能生命周期\n\n用户通过说出触发词 *Alexa*，后面跟技能名称和要执行的意图（命令）来激活特定技能。例如，*Alexa，问\
  \ jumpstart jamstack 告诉我接下来的活动。*\n\nAmazon Echo 设备将请求发送到 Alexa 控制台，控制台将通过联系我们的 Sanity\
  \ 应用来处理请求，并将结果发送回 Amazon Echo 设备，向用户提示消息。\n\n要构建 Alexa 技能，我们将使用 Alexa 开发者控制台。Alexa\
  \ 技能的两个组件是技能界面和技能服务。\n\n#### 技能界面\n\n**技能界面** 是亚马逊提供的软件，用户可以通过一个美观干净的 UI 来开发 Alexa\
  \ 技能。我们将使用技能界面来创建和修改技能的每个组件。\n\n#### 技能服务\n\n**技能服务** 是 Alexa 技能的业务逻辑所在。代码将执行意图，并向界面返回一个\
  \ JSON 响应，界面会给用户一个可理解的自然语言句子作为响应。\n\n在本章中，我们的服务将在 AWS Lambda 函数内的 Node.js 中执行。\n\
  \n既然我们知道了技能界面和技能服务是什么，我们将继续为 Alexa 创建技能。\n\n### 创建技能\n\n如前所述，我们将通过 **Alexa 开发者控制台**\
  \ 创建一个技能，该技能将从我们的活动网站检索五个即将举办的活动。\n\n3. 点击标有 Create Skill 的蓝色按钮：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_176_0.png)\n\
  \n图 12.3 – Amazon Alexa Skills 概览\n\n4. 选择一个技能名称，这也将是你的调用名称。对于这个示例，我们将写 jumpstart\
  \ jamstack：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_176_1.png)\n\n图 12.4 – Amazon\
  \ Alexa Skills 创建页面\n\n在 Alexa 范式中，模型是定义技能使用方式的意图和话语的集合。在这个示例中，我们将使用 **自定义** 模型。\n\
  \n5. 如前所述，我们将使用 Alexa 托管的宿主，因此使用默认选中的 **Alexa 托管（Node.js）**：\n\n> **2. 选择一种托管技能后端资源的方法**\n\
  >\n> 你可以自己配置后端资源，或者让 Alexa 为你托管。如果你决定让 Alexa 托管你的技能，你将可以使用我们的代码编辑器，从而可以从开发者控制台直接部署代码到\
  \ AWS Lambda。\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_177_0.png)\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_177_1.png)\n\
  \n在右上角，如果你愿意，可以更改托管技能的区域。我将其保留为默认的 **美国东部（弗吉尼亚北部）**。\n\n6. 然后，点击右上角的 **创建技能** 蓝色按钮来创建技能：\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_177_2.png)\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_177_3.png)\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_179_0.png)\n\n图 12.8 – Alexa 技能界面顶部菜单\n\
  \n由于这是一个示例技能，本章我们将探讨 **构建**、**代码** 和 **测试**。**分发**、**认证** 和 **分析** 选项卡在技能添加到市场时使用。\n\
  \n### 构建\n\n**构建** 部分是我们可以在其中设置调用名称、配置交互模型、设置槽位和设置端点的位置：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_179_1.png)\n\
  \n图 12.9 – Alexa 技能界面构建菜单\n\n\n\n\n\n## 调用\n\n调用名称是我们与技能交互时需要使用的关键词。我们的调用名称是 `jumpstart\
  \ jamstack`，因此我们可以说：Alexa，打开 jumpstart jamstack：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_180_0.png)\n\
  \n图 12.10 – Alexa 技能界面：调用选项卡\n\n## 交互模型\n\n在交互模型中，我们可以设置意图（intent）和话语（utterance）。任何\
  \ Alexa 技能都会创建以下四个默认的内置意图：\n\n- `CancelIntent`\n- `HelpIntent`\n- `StopIntent`\n\
  - `NavigateHomeIntent`\n\n`CancelIntent` 和 `StopIntent` 类似，当你想停止交互时会被调用。例如，当 Alexa\
  \ 正在为你朗读新闻时，你可以说“Alexa，停止”，Alexa 就会停止朗读新闻；或者当你通过 Alexa 听音乐时，想停止播放时，就会调用 `StopIntent`\
  \ 和 `CancelIntent`。\n\n当你想了解更多关于某个技能以及有哪些可用话语时，会使用 `HelpIntent`。\n\n当你使用一个多层级技能并想返回该技能的顶层菜单时，会使用\
  \ `NavigateHomeIntent`。\n\n在我们的意图列表中，还有默认的 HelloWorldIntent，它包含七个话语。现在让我们添加 GetUpcomingEventIntent：\n\
  \n1. 点击意图列表上方的蓝色“添加意图”（Add Intent）按钮：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_181_0.png)\n\
  \n2. 在我们的 **创建自定义意图** 部分，将意图名称添加为 GetUpcomingEventsIntent。然后，点击蓝色的 **创建自定义意图** 按钮：\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_182_0.png)\n\nAmazon 还提供了一组可用于特定技能的意图，例如天气、视频和音频。\n\
  \n既然我们已经创建了自定义意图，就可以开始添加话语了。\n\n用户可能会问：*Alexa，询问 jumpstart jamstack 即将发生的事件*，或者\
  \ *Alexa，让 jumpstart jamstack 告诉我即将发生的事件*。\n\n我们可以添加任意数量的话语。对于这个示例，让我们添加以下话语：\n\n\
  - 列出即将发生的事件\n- 告诉我即将发生的事件\n- 有哪些即将发生的事件\n\n要添加话语，请执行以下步骤：\n\n1. 在 **示例话语** 文本框中写入话语，然后按下文本框右侧的\
  \ **+** 按钮。如果不点击 **+** 按钮，话语就不会被添加：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_183_0.png)\n\
  \n图 12.13 – Alexa 技能界面：意图页面\n\n现在你的意图中应该已经添加了三个话语。\n\n2. 点击 **意图** 表单上方的 **保存模型**\
  \ 按钮，然后点击 **保存模型** 按钮旁边的 **构建模型** 按钮：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_183_1.png)\n\
  \n图 12.14 – Alexa 技能界面：意图页面\n\n现在，我们的意图已添加，模型也已构建，可以在我们的 Alexa 服务中使用。\n\n在本节中，我们创建了一个新意图来检索事件，并重新构建了模型以激活新意图。在下一节中，我们将查看意图历史。\n\
  \n## 意图历史\n\n点击左侧菜单中的“意图历史”（Intent History）链接，你可以查看最近 30 天内对你的技能进行的所有频繁意图请求。你可以查看“未解决的话语”（Unresolved\
  \ Utterances）和“已解决的话语”（Resolved Utterances）。从这里，你可以改进你的意图话语：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_184_0.png)\n\
  \n图 12.15 – Alexa 技能“意图历史”页面\n\n## 话语冲突\n\n点击左侧菜单中的“话语冲突”（Utterance Conflicts），你可以查看意图之间是否存在话语冲突：\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_184_1.png)\n\n图 12.16 – Alexa 技能“话语冲突”页面\n\
  \n## JSON 编辑器\n\n点击左侧菜单中的“JSON 编辑器”（JSON Editor），你也可以通过 JSON 代码创建意图。当你想要快速从另一个技能导入现有意图时，这非常有用：\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_185_0.png)\n\n### 槽位类型\n\n槽位（Slot）可以接收通过话语传递的变量。默认情况下，Amazon\
  \ 提供了许多槽位类型，例如数字（number）、城市（city）和国家（country），Alexa 可以识别这些类型。你也可以创建自定义槽位类型，并方便地处理它。\n\
  \n槽位类型的一个例子可以在天气技能中找到，当你查询某个特定城市的天气时。\n\n在你的 WeatherByCity 意图中，你不需要为世界上的每个城市添加话语，你可以将其作为变量传递：\n\
  \n### 槽位类型\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_186_0.png)\n\n图 12.18 – Alexa\
  \ 技能“槽位类型”页面\n\n## 端点\n\n**端点** 将接收 JSON 负载请求。由于我们使用的是 AWS Lambda 函数，这里可以保留默认设置。\n\
  \n如果你想在 AWS 之外的其他地方托管 Alexa 服务，可以选择 **HTTPS** 选项：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_187_0.png)\n\
  \n图 12.19 – Alexa 技能“端点”页面\n\n## 代码\n\n现在我们已经探索了“构建”（Build）部分，让我们跳到 Alexa 服务部分，也就是我们的\
  \ Node.js 代码：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_188_0.png)\n\n图 12.20\
  \ – Alexa 技能“代码”页面\n\n如你所见，该界面提供了一个代码编辑器，我们可以在其中实现我们的 Alexa 服务。\n\n在我们的 `index.js`\
  \ 文件中，我们可以为意图创建处理程序。我们添加的任何新意图都可以在这里实现。Alexa 提供了一个 API 来处理请求，它被称为 ask-sdk-core API。请求位于\
  \ handlerInput JSON 对象内部。\n\n处理程序将处理我们的意图，并由此对 Sanity 数据集发出 Sanity 调用。\n\n在我们 `index.js`\
  \ 文件的顶部，我们引入 ask-sdk-core：\n\n```\nconst Alexa = require('ask-sdk-core');\n```\n\
  \n处理程序包含两个函数：`canHandle()` 函数通过检查请求类型来判断该处理程序是否能处理此请求；`handle()` 函数将处理请求并返回响应：\n\
  \n```\nconst MyCustomHandler = {\n    canHandle(handlerInput) {\n        return\
  \ Alexa.getRequestType(handlerInput.requestEnvelope) === 'MyRequestType' && Alexa.getIntentName(handlerInput.requestEnvelope)\
  \ === 'MyIntent';\n    }\n};\n```\n\n在我们的 `canHandle()` 函数中，我们使用 `ask-sdk-core`\
  \ API 获取请求类型和请求名称。\n\n如果两个条件都为真，则意味着该处理程序可以处理这个请求，因此我们实现 `handle()` 函数：\n\n```\n\
  const MyCustomHandler = {\n    canHandle(handlerInput) {\n        return Alexa.getRequestType(handlerInput.requestEnvelope)\
  \ === 'MyRequestType' && Alexa.getIntentName(handlerInput.requestEnvelope) === 'MyIntent';\n\
  \    },\n    handle(handlerInput) {\n        const speakOutput = 'This is my custom\
  \ text response';\n        return handlerInput.responseBuilder\n            .speak(speakOutput)\n\
  \            .getResponse();\n    }\n};\n```\n\n在这个简单的示例中，我们只是返回一个文本。我们使用 `responseBuilder()`\
  \ 函数构建响应，将文本传递给 `speak()` 函数，然后由 `getResponse()` 函数构建最终响应。\n\n我们在文件中遇到的第一个处理程序是\
  \ LaunchRequestHandler。当你使用命令 *Alexa，打开 jumpstart jamstack* 打开技能时，会调用该处理程序：\n\n\
  ```javascript\nconst LaunchRequestHandler = {\n    canHandle(handlerInput) {\n \
  \       return Alexa.getRequestType(handlerInput.requestEnvelope) === 'LaunchRequest';\n\
  \    },\n    handle(handlerInput) {\n        const speakOutput = 'Welcome, you can\
  \ say Hello or Help. Which would you like to try?';\n        return handlerInput.responseBuilder\n\
  \            .speak(speakOutput)\n            .reprompt(speakOutput)\n         \
  \   .getResponse();\n    }\n};\n```\n\n它将返回消息：*欢迎，你可以说 Hello 或 Help。你想尝试哪一个？*\n\n\
  让我们更改这条消息，使其与我们的技能相关。将其替换为：欢迎使用 jumpstart jamstack 技能，你可以说“告诉我即将发生的事件”或“帮助”。你想尝试哪一个？\n\
  \n因此，我们的 LaunchRequest 处理程序如下：\n\n```javascript\nconst LaunchRequestHandler = {\n\
  \    canHandle(handlerInput) {\n        return Alexa.getRequestType(handlerInput.requestEnvelope)\
  \ === 'LaunchRequest';\n    },\n    handle(handlerInput) {\n        const speakOutput\
  \ = 'Welcome to the jumpstart jamstack skill, you can say tell me the upcoming events\
  \ or Help. Which would you like to try?';\n\n        return handlerInput.responseBuilder\n\
  \            .speak(speakOutput)\n            .reprompt(speakOutput)\n         \
  \   .getResponse();\n```\n\n\n点击编辑器上方的**保存**按钮：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_191_0.png)\n\
  \n图 12.21 – Alexa 技能代码页面\n\n之后，我们找到 `HelloWorldIntentHandler`。这是处理 `HelloWorldIntent`\
  \ 的自定义处理器，该意图默认包含在我们的技能中：\n\n```\nconst HelloWorldIntentHandler = {\n    canHandle(handlerInput)\
  \ {\n        return Alexa.getRequestType(handlerInput.requestEnvelope) === 'IntentRequest'\n\
  \            && Alexa.getIntentName(handlerInput.requestEnvelope) === 'HelloWorldIntent';\n\
  \    },\n    handle(handlerInput) {\n        const speakOutput = 'Hello World!';\n\
  \        return handlerInput.responseBuilder\n            .speak(speakOutput)\n\
  \            //.reprompt('add a reprompt if you want to keep the session open for\
  \ the user to respond')\n            .getResponse();\n    }\n};\n```\n\n`HelpIntentHandler`\
  \ 向用户提供该技能的说明：\n\n```\nconst HelpIntentHandler = {\n    canHandle(handlerInput)\
  \ {\n        return Alexa.getRequestType(handlerInput.requestEnvelope) === 'IntentRequest'\n\
  \            && Alexa.getIntentName(handlerInput.requestEnvelope) === 'AMAZON.HelpIntent';\n\
  \    },\n    handle(handlerInput) {\n        const speakOutput = 'You can say hello\
  \ to me! How can I help?';\n\n        return handlerInput.responseBuilder\n    \
  \        .speak(speakOutput)\n            .reprompt(speakOutput)\n            .getResponse();\n\
  \    }\n};\n```\n\n`CancelAndStopIntent` 会停止该技能。在此示例中，两种意图都以相同方式处理，但如果需要返回不同的消息，你可以将它们拆分为两个单独的处理器：\n\
  \n```\nconst CancelAndStopIntentHandler = {\n    canHandle(handlerInput) {\n   \
  \     return Alexa.getRequestType(handlerInput.requestEnvelope) === 'IntentRequest'\n\
  \            && (Alexa.getIntentName(handlerInput.requestEnvelope) === 'AMAZON.CancelIntent'\n\
  \                || Alexa.getIntentName(handlerInput.requestEnvelope) === 'AMAZON.StopIntent');\n\
  \    },\n    handle(handlerInput) {\n        const speakOutput = 'Goodbye!';\n \
  \       return handlerInput.responseBuilder\n            .speak(speakOutput)\n \
  \           .getResponse();\n    }\n};\n```\n\n在文件末尾，我们使用 ask-sdk-core API 导出该处理器：\n\
  \n```\n// The SkillBuilder acts as the entry point for your skill, routing all request\
  \ and response\n// payloads to the handlers above. Make sure any new handlers or\
  \ interceptors you've defined are included below. The order matters - they're processed\
  \ top to bottom.\nexports.handler = Alexa.SkillBuilders.custom()\n  .addRequestHandlers(\n\
  \    LaunchRequestHandler,\n    HelloWorldIntentHandler,\n    HelpIntentHandler,\n\
  \    CancelAndStopIntentHandler,\n    SessionEndedRequestHandler,\n  )\n  .addErrorHandlers(\n\
  \    ErrorHandler,\n  )\n  .lambda();\n```\n\n现在，点击编辑器上方的 **Deploy** 按钮来部署我们的更改：\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_194_0.png)\n\n图 12.22 – Alexa 技能代码页面\n\
  \n## 构建我们的处理器\n\n现在，我们需要构建处理器以从 Sanity Studio 数据集获取事件。我们将使用 Sanity Client npm 插件，正如我们在*第\
  \ 11 章，API - 扩展 Gatsby*中所做的那样：\n\n- 前往 npm 获取该软件包的最新版本：`https://www.npmjs.com/package/@sanity/client`。你可以查看页面右侧的版本号。撰写本书时，最新的稳定版本是\
  \ **1.150.1**：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_195_0.png)\n\n- 在 Alexa\
  \ 控制台中的**代码**编辑器里，打开 `package.json` 文件，并将 Sanity Client npm 插件添加到依赖项数组中：\n\n```\n\
  {\n  \"name\": \"hello-world\",\n  \"version\": \"1.1.0\",\n  \"description\": \"\
  alexa utility for quickly building skills\",\n  \"main\": \"index.js\",\n  \"scripts\"\
  : {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n \
  \ \"author\": \"Amazon Alexa\",\n  \"license\": \"ISC\",\n  \"dependencies\": {\n\
  \    \"ask-sdk-core\": \"^2.6.0\",\n    \"ask-sdk-model\": \"^1.18.0\",\n    \"\
  aws-sdk\": \"^2.326.0\"\n  }\n}\n```\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_195_1.png)\n\
  \n- 现在，点击**保存**按钮，然后点击**部署**按钮。我们的软件包将被自动添加。\n\n4. 在 index.js 页面中，在 `HelloWorldIntentHandler`\
  \ 之后，我们可以添加 `GetUpcomingEventsIntentHandler`：\n\n5. 让我们从 `canHandle()` 函数开始。我们知道请求类型必须是\
  \ `IntentRequest`，且我们的意图名称是 `GetUpcomingEventsIntent`，因此我们编写如下代码：\n\n```\nconst\
  \ GetUpcomingEventsIntentHandler = {\n    canHandle(handlerInput) {\n        return\
  \ Alexa.getRequestType(handlerInput.requestEnvelope) === 'IntentRequest'\n     \
  \       && Alexa.getIntentName(handlerInput.requestEnvelope) === 'GetUpcomingEventsIntent';\n\
  \    },\n};\n```\n\n6. 现在我们可以实现 `handle()` 函数。由于 Sanity Client 返回一个 Promise，因此 `handle()`\
  \ 函数必须是异步的。\n\n第一步是初始化 Sanity Client：\n\n```\nconst GetUpcomingEventsIntentHandler\
  \ = {\n    canHandle(handlerInput) {\n        ...\n    }\n    async handle(handlerInput)\
  \ {\n        const sanityClient = require('@sanity/client')\n        const client\
  \ = sanityClient({\n            projectId: 'your-project-id',\n            dataset:\
  \ 'your-dataset',\n            useCdn: true\n        });\n    }\n};\n```\n\n7. 现在，我们可以使用\
  \ Sanity Client API 中的 `fetch()` 函数来获取数据。\n\n`fetch()` 函数需要一个**面向图的查询 (GROQ)**。在我们的情况下，我们要获取类型为\
  \ event 的五篇文档，且事件日期大于当前日期。我们还准备了 `list` 数组，用于添加结果，以及 `speakOutput` 变量，用于添加消息。然后，我们使用\
  \ `fetch()` 函数获取结果：\n\n```javascript\nconst GetUpcomingEventsIntentHandler = {\n\
  \    canHandle (handlerInput) {\n        ...\n    }\n    async handle (handlerInput)\
  \ {\n        const sanityClient = require('@sanity/client')\n        const client\
  \ = sanityClient({\n            projectId: 'your-project-id',\n            dataset:\
  \ 'your-dataset',\n            useCdn: true\n        });\n        const query =\
  \ '*[_type == \"event\"]'\n        let speakOutput\n        let list = [];\n   \
  \     await client.fetch(query).then(events => {\n            events.forEach(event\
  \ => {\n                list.push(event.name)\n            })\n        })\n    }\n\
  };\n```\n\n现在，如果有即将发生的事件，它们将被添加到 `list` 数组中。\n\n- 8. 现在我们可以构建响应：\n\n```javascript\n\
  const GetUpcomingEventsIntentHandler = {\n    canHandle (handlerInput) {\n     \
  \   ...\n    }\n    async handle (handlerInput) {\n        const sanityClient =\
  \ require('@sanity/client')\n        const client = sanityClient({\n```\n\n```\n\
  projectId: 'your-project-id',\n    dataset: 'your-dataset',\n    useCdn: true\n\
  \  });\n  ...\n    if (list.length > 0) {\n      speakOutput = `I have found ${list.length}\n\
  \      events: ${list.join(', ')}`;\n    }\n    else {\n      speakOutput = ` I\
  \ am sorry, there are not\n      upcoming events`;\n    }\n    return handlerInput.responseBuilder\n\
  \      .speak(speakOutput)\n      .getResponse();\n  }\n}\n};\n```\n\n9. 最后一部分是将我们的新处理器\
  \ `GetUpcomingEventsIntentHandler` 导出到文件底部的 `exports.handler` 中：\n\n```\nexports.handler\
  \ = Alexa.SkillBuilders.custom()\n  .addRequestHandlers(\n    ...\n    GetUpcomingEventsIntentHandler,\n\
  \    ...\n  )\n  .addErrorHandlers(\n    ErrorHandler,\n  )\n  .lambda();\n```\n\
  \n10. 现在，点击编辑器上方的保存和部署按钮。\n\n至此，我们已经创建了一个新技能，配置了意图，并创建了意图的处理器。我们现在可以测试我们的技能了。\n\n\
  ## 测试\n\n如果你想测试你的技能，请点击顶部菜单栏上的 Test 链接：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_199_0.png)\n\
  \n图 12.25 – Alexa 技能测试页面\n\n在 Alexa 模拟程序标签的左侧，你可以说出或输入你的意图。每个技能都有一个启动请求，可以通过命令 Alexa,\
  \ open 调用名称来调用。在我们的情况下，这将是 Alexa, open jumpstart jamstack：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_199_1.png)\n\
  \n图 12.26 – Alexa 技能测试页面\n\n\n\n\n\n如图所示，我们收到了启动请求的响应。在“技能调用”部分，你可以看到从技能接口到技能服务的\
  \ JSON 输入。\n\n现在，按以下方式输入语音命令：ask jumpstart jamstack to tell me the upcoming events，然后检查响应。\n\
  \nAlexa 将提示包含五个即将举办活动的消息：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_200_0.png)\n\
  \n## 本章小结\n\n在本章中，我们完成了 Alexa 技能的创建。我们了解了技能接口与技能服务之间的区别。我们学习了 Alexa 技能的组成部分，并通过新命令扩展了其功能。我们还将技能与\
  \ Sanity Studio 集成。这意味着我们的活动现在可以通过 Web 应用和 Alexa 访问！\n\n在下一章中，我们将回到 Gatsby 应用，探索\
  \ Tailwind CSS 框架，它将帮助我们改善应用的视觉呈现。\n"
- "## Gatsby.js 布局修改\n\n有多种不同的方式可以将样式融入网页，以更改默认字体、颜色、背景和布局。虽然也可以逐一创建样式和类，但更简单高效的方法是使用框架来利用预先构建的思路和设计模式。在撰写本书时，最热门的级联框架之一就是\
  \ Tailwind CSS。让我们认识一下 Tailwind，并了解为什么要在 Gatsby 中使用它。\n\n### 认识 Tailwind CSS\n\n\
  Tailwind CSS 是一个优秀的 CSS 框架，易于学习和使用。它旨在不预设立场，让设计者能够从更小的部件构建样式。让我们先安装该框架，以便使用它。\n\n\
  ### 安装 Tailwind CSS 框架\n\n我们将安装它，并用它来改善网站的外观：\n\n- 1. 第一步是使用 Node 包管理器安装 Tailwind\
  \ CSS。在终端中，输入以下命令：\n```\nnpm install tailwindcss --save-dev\n```\n`--save-dev` 参数会将其添加到项目的开发依赖中。此外，由于我们想改进表单的外观，我们将添加一个由\
  \ Tailwind Labs 构建的名为 custom-forms 的额外包。\n- 2. 同样，我们会将其添加到项目的开发依赖中。在终端中输入以下命令：\n\
  ```\nnpm install @tailwindcss/custom-forms --save-dev\n```\n- 3. 最后，在终端中输入以下命令，配置文件将自动创建：\n\
  ```\nnpx tailwindcss init\n```\n\ntailwind.config.js 文件会在 Gatsby 的主文件夹中的 /web 目录下创建。该文件包含\
  \ Tailwind 配置。文件内容如下：\n\n```\nmodule.exports = {\n  purge: [],\n  theme: {\n   \
  \ extend: {}\n  },\n  variants: {},\n  plugins: [require('@tailwindcss/custom-forms')]\n\
  }\n```\n\n大多数配置项使用默认设置，因此它们是空的。唯一使用到的配置项是插件列表。此处，插件列表仅包含我们之前安装的 custom-forms 插件。\n\
  \n### 使用 Tailwind CSS 框架\n\n接下来，我们将 Tailwind 框架集成到项目中。首先从 web/src/styles/layout.css\
  \ 文件开始，我们需要插入以下代码行。以下代码行将 Tailwind 的样式引入项目：\n\n```\n@tailwind base;\n@tailwind components;\n\
  @tailwind utilities;\n```\n\n### 设置活动提案表单的样式\n\n重新审视我们项目网站的活动提案表单，很明显它完全没有样式。那么，让我们先回顾表单的代码。以下是活动标题输入框和标签的\
  \ HTML 源代码片段：\n\n```\n<div className='field'>\n  <label className='label'>Event\
  \ Title:\n    <input className='input' type='text' name='eventTitle'/>\n  </label>\n\
  </div>\n```\n\n使用 Tailwind CSS，表单的样式效果如下图所示：\n\n## 添加活动\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_204_0.png)\n\
  \n图 13.1 – 使用 Tailwind 设置样式的活动提案表单\n\n> **注意**\n> Tailwind CSS 的完整文档可在 https://tailwindcss.com\
  \ 找到。\n\n就本书而言，我们将看以下示例，它只是 Tailwind CSS 全部能力的一小部分。这里，我们之前的 HTML 代码块已使用 Tailwind\
  \ 设置样式：\n\n```\n```html\n<div className='mt-10 block'>\n  <label className='label'>Event\
  \ Title:\n    <input className='form-input mt-1 block w-full' type='text' name='eventTitle'/>\n\
  \  </label>\n</div>\n```\n```\n\n首先，在每个表单元素周围添加了间距。让我们快速回顾一下，在元素周围添加间距都有哪些选项。HTML\
  \ **文档对象模型（DOM）** 中的每个元素都有三个外围组成部分：边框、外边距和内边距。简单来说，外边距是元素周围的间距，内边距是元素内部的间距。而边框正如其名称所示，是在视觉上划定\
  \ HTML 元素边界的几种方式之一。\n\n我们要查看的第一个样式是 mt-10。这种命名方式与其他 CSS 框架略有不同，因为 m 和 t 都具有原子化的含义。\n\
  \nTailwind 中 m 代表外边距（margin）。同样，p 用于内边距（padding），t 代表顶部（top），显然，b 代表底部（bottom），r\
  \ 代表右侧（right），l 代表左侧（left）。此外，y 同时代表顶部和底部，x 同时代表右侧和左侧。如果单独使用 m 和 p（例如 m-10），这种用法表示整个元素，因此会在所有边上提供间距。这使得记住该使用哪个属性变得非常简单，也正因如此，该框架广受欢迎。\n\
  \n-10 代表 10 像素。这将在每个表单元素的顶部提供 10 像素的所需间距，使其外观更整洁。\n\n此外，还使用了 Tailwind CSS 的 block\
  \ 样式来设置块级布局。\n\n对于表单输入元素，本例中是一个文本框，使用了 Tailwind 的 form-input 样式。该样式应用了以下 CSS 规则：\n\
  \n- `background-color: #fff;`：白色\n- `border-color: #e2e8f0; border-width: 1px; border-radius:\
  \ 0.25rem;`：浅色的 1 像素输入框边框，带有轻微圆角\n- `padding-right: 0.75rem; padding-left: 0.75rem;`：文字两侧有更多间距\n\
  - `padding-top: 0.5rem; padding-bottom: 0.5rem;`：文字顶部和底部有更多间距\n- `line-height: 1.5;`：设置垂直文字间距\n\
  - `font-size: 1rem;`：设置文字大小\n\nw-full 表单输入样式指示表单元素占据其容器的完整宽度。如表单中所示，**您的全名**和**您的电子邮件地址**字段为半宽。由于表单应该是响应式的，当表单处于小尺寸时，例如浏览器水平缩小，比如使用智能手机浏览时，这些元素会使用完整宽度。以下两个样式共同协作实现这一效果：sm:w-full\
  \ 和 md:w-1/2。\n\n当表单容器处于小尺寸模式时，元素的宽度为完整宽度；当表单至少为中等尺寸（即浏览器宽度大于 768 像素）时，宽度为一半（1/2）。\n\
  \n### 改进活动列表并设置其样式\n\n在上一节中，我们为活动提案表单添加了 Tailwind 样式。接下来，我们可以为网站上的活动列表添加样式。在下面的*图\
  \ 13.2* 中，活动列表同样应用了 Tailwind CSS 样式：\n\n## 活动\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_206_0.png)\n\
  \n图 13.2 – 使用 Tailwind 设置样式的活动列表\n\n通过对活动查询添加排序，活动按时间顺序排列。以下代码演示了如何实现这一点。排序被添加到\
  \ dateAndTime 字段上，使用 ASC（升序）：\n\n```\nevents: allSanityEvent(\n  sort: {\n    fields:\
  \ [dateAndTime]\n\n    order: ASC\n  },\n) {\n  ...\n```\n\n如图 13.2 所示，过去发生的事件（在本例中为\
  \ 2020 年 9 月 1 日之前的事件）使用比未来事件更深的背景色显示。让我们了解这种效果是如何实现的。\n\n首先，node.dateAndTime 通过作为参数传递给\
  \ new Date() 函数而被转换为日期。当前时间通过实例化不带参数的日期对象获得。比较的布尔（真/假）结果——如果事件日期小于当前日期——被赋值给 pastEvent\
  \ 变量：\n\n```\nlet pastEvent =\nnew Date(node.dateAndTime) < new Date() ? true :\
  \ false;\n```\n\n接下来，根据 pastEvent 的值是否设置为 True 来设置背景色：\n\n```\n(${pastEvent ? 'bg-gray-600'\
  \ : 'bg-gray-100'}):\nreturn (\n  <div className={`max-w-full shadow-sm mt-3 p-3\
  \ ${pastEvent ? 'bg-gray-600' : 'bg-gray-100'}`}>\n  ...\n```\n\n现在我们已经处理了样式，接下来，我们将探讨如何提高代码质量。我们将首先清理源代码，为部署做准备。\n\
  \n## 为部署做准备\n\n在本节中，我们将对代码进行几处改进，使其更加整洁。此外，我们还将改进表单的功能。\n\n\n\n\n## 清理代码\n\n由于事件列表和事件表单的源代码最终可能在网站的多处复用，我们可以通过为各自创建单独的组件来重构代码。\n\
  \n在 `web/src/components` 文件夹中，创建两个文件：`event-list.js` 和 `event-form.js`。这两个文件的格式相似。\n\
  \n事件列表模块的基本格式如下面的代码块所示：\n\n```\nimport { Link } from \"gatsby\";\nimport React from\
  \ \"react\";\nconst { format } = require('date-fns')\n\nfunction EventList(props)\
  \ {\n\n    return (\n      ...\n    )\n}\n\nEventList.defaultProps = {\n    title:\
  \ '',\n    eventNodes: [],\n}\n\nexport default EventList\n```\n\n事件表单模块的基本格式如下所示：\n\
  \n```\nimport React from \"react\";\n\nfunction EventForm(props) {\n    return (\n\
  \      ...\n    )\n}\n```\n\n```\nEventForm.defaultProps = {\n  title: '',\n  venueNodes:\
  \ [],\n}\n\nexport default EventForm\n```\n\n事件表单和事件列表的源代码将被插入到 return 中。由于 JSX\
  \ 需要一个根节点，因此添加了开始和结束的 `<div>` 标签：\n\n```\nreturn (\n  <div>\n    <h2 className='font-serif\
  \ text-4xl font-bold text-gray-800 bb-10'>{props.title}</h2>\n    <div className='max-w-full'>\n\
  \      ...\n    </div>\n  )\n```\n\n要使用这两个新创建的组件，需要导入它们：\n\n```\nimport EventList\
  \ from '../components/event-list'\nimport EventForm from '../components/event-form'\n\
  ```\n\n现在，事件列表和事件表单可以用这些组件替换。节点和标题将作为属性传递给这些组件：\n\n```\n<EventList\n  eventNodes={eventNodes}\n\
  \  title='Events'\n/>\n\n<EventForm\n  venueNodes={venueNodes}\n  title='Add an\
  \ Event'\n/>\n```\n\n```\n</label>\n</div>\n\n<div className='mt-10 block'>\n  {isVisible\
  \ && <label className=''>Event Venue:\n    <select className='form-select block\
  \ w-full mt-1' name='venue' id={`venue`}>\n      {props.venueNodes &&\n        props.venueNodes.map((venue)\
  \ => (\n          <option value={venue._id}>{venue.name}</option>\n        ))}\n\
  \    </select>\n  </label>\n}\n</div>\n```\n\nHTML 的 onClick 事件属性被添加到切换输入上，传入 isVisible\
  \ 布尔变量的相反值（！）：\n\n```\nonClick={() => toggleVisible(!isVisible)}\n```\n\n如果 isVisible\
  \ 的值为 true，则显示事件场地选择和标签；否则，它们会被隐藏。\n\n## 总结\n\n在本章中，我们学习了如何使用 Tailwind CSS 框架为现代设计和响应式布局设置网站样式，与从传统\
  \ CSS 开始相比节省了时间和精力。接下来，我们学习了如何将页面片段提取为单独的组件。最后，我们为表单本身添加了动态功能。\n\n为用户体验添加样式和打磨是一个深奥的主题，因此超出了本书的范围。你可以随意阅读\
  \ Tailwind CSS 文档，以了解更多改进外观的方法。此外，即使使用 Gatsby 可以充分利用的其他 React 元素，也可能帮助将这个原型构建成一个完整的网站——你已拥有所需的全部工具。\n\
  \n在下一章中，我们将使用 Netlify 部署网站，并了解它在自动化许多以前需要手动执行的任务方面的实用性。\n"
- "# 14 使用 Netlify 和 Azure 进行部署\n\n在上一章中，我们为部署准备了网站。我们使用 Tailwind CSS 为组件添加了样式。最后，我们清理了布局并将代码重构为组件。现在，我们可以更仔细地了解本书中使用的\
  \ Jamstack 的最后一个组件：**Netlify**。Netlify 被用作在 [https://sanity.io/create](https://sanity.io/create)\
  \ 创建的 *使用 Gatsby 的博客*示例的默认平台。在撰写本书时，Microsoft 已添加 Static Web Apps 服务，为部署提供了另一种选择。由于\
  \ GitHub 和 Azure 均归 Microsoft 所有，Static Web Apps 服务与 GitHub 之间有极佳的集成。\n\n本章首先介绍\
  \ Netlify 无服务器持续部署托管服务，它自动化了许多以前需要开发或手动执行的任务，然后演示 Azure Static Web Apps，作为可能已在使用\
  \ Azure 或想要尝试这项新服务的开发者的另一种选择。\n\n我们将在本章中介绍的主要主题如下：\n\n- Netlify 简介\n- Netlify 插件\n\
  - 通过 netlify.toml 文件进行高级配置\n- 通过命令行部署 Netlify\n- Azure Static Web Apps 部署\n\n###\
  \ 技术要求\n\n要在 Netlify 上部署项目，你必须在 https://www.netlify.com/ 拥有一个账户。要在 Azure 上部署项目，你必须在\
  \ https://azure.microsoft.com/en-us/ 创建一个账户。\n\n此外，还需要一个终端程序。\n\n### Netlify 简介\n\
  \n对于刚接触 Web 开发的人来说，Netlify 最初看起来只是一个部署和托管平台。\n\n事实上，Netlify 网站可以是一个简单的静态文件 Web 主机。使用\
  \ Netlify 的拖放功能，只需几秒钟即可将包含 Web 文件的文件夹部署为一个真实、可运行且已托管的网站，如下所示：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_214_0.png)\n\
  \n图 14.1 – Netlify 的拖放部署界面\n\n然而，虽然它是托管网站的地方，但其功能远不止于此。\n\n首先，在幕后，当我们最初创建 Sanity\
  \ 和 Gatsby 生成的网站时，Sanity 和 Gatsby 博客模板提供的代码会自动运行它，从而在 Sanity 和 Netlify 之间建立集成。\n\
  \nSanity Studio 和 Gatsby 生成的网站都被立即构建并托管在 Netlify 的服务器上，并且我们可以在需要时轻松自动地部署网站的新版本。通过连接\
  \ Sanity 的管理工具和 Netlify 的集成，当我们在 Sanity 中更改内容时，就可以构建新版网站。此外，通过 GitHub 设置了一个钩子或触发器，每当\
  \ Gatsby 源代码被推送到 GitHub 时，它都会自动部署新版网站。\n\n其次，Netlify 是构建在 Amazon Web Services（AWS）之上的无服务器持续交付服务。这意味着\
  \ AWS 提供的所有基础设施都会自动融入 Netlify 的托管能力。也就是说，Netlify 在世界各地都有服务器（也称为云），以尽可能快的方式向所有网站用户提供内容。\n\
  \n然而，这两个方面只是故事的开始。在构建过程中，Netlify 可以通过脚本以多种语言运行许多不同类型的代码来增强你的网站，如以下截图所示：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_215_0.png)\n\
  \n图 14.2 – Netlify 构建输出的摘录\n\n当需要预构建的代码片段来构建静态页面时，这非常有用。例如，可以使用 PHP 编程语言提取或预处理格式化数据，甚至静态生成网站。因此，JavaScript\
  \ 编程语言并不是部署期间的唯一选择。\n\n重要的是要记住，代码只能在部署时在 Netlify 上运行。因此，像 WordPress 这样的传统内容管理系统无法在\
  \ Netlify 上运行，因为它需要服务器端代码在每次页面请求时运行。\n\n一个不错的功能是能够进行 A/B 测试。这可以通过在 GitHub 中使用两个分支来实现。假设你想测试特定颜色对网站访问者需要点击的按钮性能的影响。你可以在\
  \ GitHub 中设置两个不同的分支，让 Netlify 随机选择其中一个。\n\nNetlify 提供的另一个功能是一种将代码片段插入页面头部或正文的简单方法。这种用途的一个示例是粘贴\
  \ Google Analytics 在页面中正常工作所需的代码片段。\n\n接下来，让我们了解如何利用 Netlify 通过其插件提供的各种功能。\n\n\n\
  \n\n\n### Netlify 插件\n\nNetlify 的插件库将许多手动流程自动化，免去了开发者自行开发内部解决方案的麻烦。这个不断增长的库中包含许多插件。例如，一个插件可以获取并整合\
  \ RSS 订阅等外部资源；另一个插件还可以生成站点地图，甚至为网站内容建立索引以提供搜索功能。\n\n### HTML 压缩\n\n在本书中，我们要研究的这个插件会压缩\
  \ HTML，通过移除不必要的页面或代码内容，或者用单字符替换变量名来减小文件体积。这个过程称为**压缩**。\n\n我们希望尽可能压缩 HTML 代码，因此可以使用\
  \ Netlify 的 `netlify-plugin-minify-html` 插件来压缩文件内容。当 Gatsby 构建静态页面时，它会压缩 HTML 文件的内容。\n\
  \n下面是一个示例，展示压缩前可读源代码的样子：\n\n```html\n<h1 hidden=\"\">\n  Welcome to <!-- -->My new\
  \ blog\n</h1>\n<div class=\"blog-post-preview-list-module--root--2LgdR\">\n  <h2\
  \ class=\"blog-post-preview-list-module--headline--3j8kB\">\n    Latest blog posts\n\
  \  </h2>\n....\n```\n\n执行压缩后，文件总大小会减小。以下是压缩后 HTML 代码的样子：\n\n```html\n<h1 hidden=\"\
  \">Welcome to <!-- -->My new blog</h1><div class=\"blog-post-preview-list-module--root--2LgdR\"\
  ><h2 class=\"blog-post-preview-list-module--headline--3j8kB\">Latest blog posts</h2>\n\
  ```\n\n额外的空格已被移除，但 `netlify-plugin-minify-html` 插件还能让文件大小变得更小。每个字符都会计入需要通过互联网传输的页面数据总量，所以这是一个很棒的功能。\n\
  \n以下步骤将启用 Netlify Minify 插件：\n\n- 1. 登录 `https://netlify.com`。在网站名称下方的水平菜单中，点击**插件**链接：\n\
  \  \n  图 14.3 – 水平菜单\n\n- 2. 找到 Minify HTML 插件，点击灰色的**安装**按钮。\n\n- 3. 然后，选择项目网站（名称通常以\
  \ `~web` 结尾）：\n  \n  图 14.4 – Netlify Minify 插件安装界面\n\n- 4. 当被询问**“是否确定要安装 Minify\
  \ HTML？”**时，点击绿色的**安装**按钮。\n  \n  此时，Netlify Web 界面应该会带你回到该网站的插件页面，并显示 **Minify\
  \ HTML**。\n\n- 5. 接下来，在网站名称下方的水平菜单中，点击**部署**链接。\n\n- 6. 在界面右侧，点击灰色的**触发部署**按钮，此时会显示一个菜单，然后点击**部署站点**菜单项，如*图\
  \ 14.5*所示：\n  \n  图 14.5 – 触发部署菜单\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_217_0.png)\n\
  \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_217_1.png)\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_217_2.png)\n\
  \n这将构建并部署新版本的网站。**部署进行中**页面会显示一个日志，输出内容将显示在其中。\n\n日志输出对于了解部署期间执行的操作以及是否存在任何警告或错误非常有用。如果出现任何错误，Netlify\
  \ 部署将停止，以确保不会部署任何网站。\n\n以下是执行 Netlify Minify HTML 后的代码：\n\n```\n<h1 hidden>Welcome\
  \ to My new blog</h1><div class=blog-post-preview-list-module--root--2LgDr><h2 class=blog-post-preview-list-module--headline--3j8kB>Latest\
  \ blog posts</h2>\n```\n\n请将其与本章前面的压缩代码进行比较。Netlify Minify HTML 会在 HTML 标签属性为连续字符串（不含空格）时移除引号，同时也会删除注释，因此\
  \ `<!-- -->` 会被移除。最终结果是文件更小。这只是 Netlify 插件众多用途中的一个例子：通过使用 Netlify 插件，我们可以改进生成的静态内容并增强其功能。探索插件将带来许多新的可能性。\n\
  \n接下来，我们将开始更深入地探索 Netlify 功能可用的配置选项。\n\n## 通过 netlify.toml 文件进行高级配置\n\nNetlify Web\
  \ 界面虽然易于使用，但为了对部署过程进行更多控制，可以使用 `netlify.toml` 文件，该文件使用 Tom's Obvious, Minimal Language\
  \ 格式。\n\n现在，让我们学习如何创建和使用此配置文件，以访问 Netlify 的高级功能。\n\n在项目的根目录中创建一个名为 `netlify.toml`\
  \ 的文件。以下是文件内容示例：\n\n```toml\n[[plugins]]\n  package = \"netlify-plugin-minify-html\"\
  \n\n  # Specify which deploy contexts we'll minify HTML in.\n  # Supports any Deploy\
  \ Contexts available in Netlify.\n  # https://docs.netlify.com/site-deploys/overview/#deploy-contexts\n\
  \  [plugins.inputs]\n    contexts = [\n'production',\n'branch-deploy',\n'deploy-preview'\n\
  ]\n\n[plugins.inputs.minifierOptions]\n    removeComments = false\n    collapseInlineTagWhitespace\
  \ = false\n```\n\n每个插件都使用 `[[plugins]]` 注解。接下来，`[[plugins.inputs]]` 用于确定插件将在哪些上下文中被激活。例如，在本地开发时，通常不需要压缩，因此插件只会在生产上下文和预览上下文中触发。\n\
  \n接下来，插件配置中的 `[plugins.inputs.minifierOptions]` 部分允许我们进一步自定义插件。由于默认情况下 `removeComments`\
  \ 设置为 `true`，因此可以通过 `removeComments = false` 选项将其设置为 `false`。\n\n我们可以再次使用 Netlify\
  \ 命令行工具，但这次需要在项目的根目录中键入以下命令：\n\n```shell\nnetlify build\n```\n\n上述命令会在本地触发构建，将 `netlify.toml`\
  \ 配置与网站在 Netlify 插件列表中配置的插件结合起来。\n\n以下是 `netlify build` 输出的相关片段：\n\n```text\n┌──────────────────────────────────────────────────────────────┐\n\
  │ 2. onSuccess command from netlify-plugin-minify-html         │\n└──────────────────────────────────────────────────────────────┘\n\
  \nMinifying HTML in the deploy context: production\nMinifying HTML with these options:\
  \ { removeComments: false }\n\n(netlify-plugin-minify-html onSuccess completed in\
  \ 259ms)\n\n┌───────────────────────────────┐\n│       Netlify Build Complete  │\n\
  └───────────────────────────────┘\n\n(Netlify Build completed in 19.8s)\n```\n\n\
  在本节中，我们学习了如何使用 Netlify 配置文件。接下来，我们将学习如何使用命令行构建和部署 Netlify。\n\n## 通过命令行部署 Netlify\n\
  \n运行 `netlify build` 命令后，Netlify 命令行工具还提供了一种很好的方式，无需部署即可预览网站。\n\n在终端中，键入以下命令：\n\n\
  `netlify deploy`\n\n输出将类似于以下内容：\n\n```\nDeploy path:\t/home/chris/jumpstart-jamstack/web/public\n\
  Configuration path: /home/chris/jumpstart-jamstack /netlify. toml\n\nDeploying to\
  \ draft URL...\nFinished hashing 49 files\nCDN requesting 0 files\nFinished uploading\
  \ 0 assets\nDraft deploy is live!\n\nLogs:\t\thttps://app.netlify.com/sites/jumpstart-\
  \ jamstack-web/deploys/5f3cad51bdd06713f5250887\nWebsite Draft URL: https://5f3cad51bdd06713f5250887--jumpstart-\
  \ jamstack-web.netlify.app\n\nIf everything looks good on your draft URL, deploy\
  \ it to your main site URL with the --prod flag.\nnetlify deploy --prod\n```\n\n\
  正如命令输出所示，会提供一个草稿部署预览 URL，以便无需实际部署就能预览生产网站。在示例中，该 URL 为 `https://5f3cad51bdd06713f5250887--jumpstart-jamstack-web.netlify.app`。\n\
  \n`--open` 是另一个可以添加的有用标志。它会在默认浏览器中打开该 URL。相关命令如下：\n\n`netlify deploy --open`\n\n\
  \n\n\n\n最后，如输出所示，添加 `--prod` 标志后，如果部署成功，`deploy` 命令将部署并替换生产环境中的当前版本。\n\n```\nnetlify\
  \ deploy --prod\n```\n\n此外，若要在浏览器中打开 URL，请像之前一样添加 `--open` 标志：\n\n```\nnetlify deploy\
  \ --prod --open\n```\n\n此命令的输出将类似于以下内容：\n\n```\nDeploy path:          /home/chris/jumpstart-jamstack/hands-on-jamstack/web/public\n\
  Configuration path: /home/chris/jumpstart-jamstack/hands-on-jamstack/netlify.toml\n\
  Deploying to main site URL...\nFinished hashing 1 files\nCDN requesting 0 files\n\
  Finished uploading 0 assets\nDeploy is live!\nLogs:                 https://app.netlify.com/sites/jumpstart-jamstack-web/deploys/5f3cb84fbdd067963e250875\n\
  Unique Deploy URL: https://5f3cb84fbdd067963e250875--jumpstart-jamstack-web.netlify.app\n\
  Website URL:         https://jumpstart-jamstack-web.netlify.app\n```\n\nUnique Deploy\
  \ URL 提供了一种将来回滚到该特定部署的方法，而 Website URL 顾名思义，就是新部署的网站版本。\n\n在本节中，我们学习了如何使用命令行在 Netlify\
  \ 上构建和部署。接下来，我们将学习使用 Azure 部署 Jamstack 网站的另一种方式。\n\n## Azure 静态 Web 应用部署\n\nAzure\
  \ 静态 Web 应用服务的预览版已经推出，这为 Jamstack 托管和部署领域又增添了一位竞争对手。体验该服务的 URL 可以在 https://azure.microsoft.com/en-us/services/app-service/static/\
  \ 找到。\n\n### 创建静态 Web 应用\n\n要使用 Azure 创建静态 Web 应用，请按以下顺序执行步骤：\n\n- 1. 首先创建一个 Azure\
