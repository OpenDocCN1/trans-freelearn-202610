- pgno: 40
  md: 'There are five sections to be explored. Let''s take a look at each one in turn.


    # Usage


    In this section of the page, the resource usage presented as bandwidth in **kilobytes
    (KB)**, **megabytes (MB)**, or **gigabytes (GB)** for this project is shown.


    There are currently seven charts available, with the following data:


    +   - **Resource Usage:**

    +     **Document used** (a donut chart)

    +     **Assets used** (a donut chart)

    +   - **Usage this month:**

    +     **Bandwidth** (an area graph)

    +     **API Requests** (an area graph)

    +     **API CDN Requests** (an area graph)

    +   - **Asset and document history:**

    +     **Documents** (an area graph)

    +     **Assets** (an area graph)


    Bandwidth, document, and request statistics are updated once every hour. Asset
    statistics are updated once a day.


    # Members


    On the **Members** page, all members of the current project are displayed. Here,
    users may invite and remove members, depending on their role. When adding a new
    member, they may choose the type of access level for this member.


    There are three permissions that can be set, as follows:


    +   - **Administrator**: A user with this role can fully manage the current project
    and its aspects.

    +   - **Read + Write**: A user with this role can read from and write to all datasets
    of the current project.

    +   - **Read**: A user with this role can only read from all datasets of the current
    project.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# ## Datasets


    From this section, you may view and remove datasets. Datasets are where data is
    stored. A project may have more than one dataset, depending on the project''s
    needs. The *Developer* account is limited to two accounts.


    # ## Settings


    From this section, you can manage the **General settings** and **API** of the
    current project.


    **General settings** include the following:


    +   - **Organization**

    +   - **Project Name**

    +   - **Project Color**

    +   - **Custom Studio URL**


    You can also disable or delete a project. When you disable a project, it can be
    re-enabled at any time without data loss.


    When you delete a project, all the documents, assets, and users related to the
    project will be removed. **Note that this action cannot be undone.**


    From this section, you may also view and modify your current plan. Depending on
    your needs, you can choose a different plan. For this project, though, the free
    plan *Developer* is amply sufficient, providing up to three users.


    Let''s explore the **API** settings, in the following subsections.


    # ### CORS Origins


    In this subsection, you can add and remove hosts that can connect to the project
    API. The `localhost:3333` host is automatically added. `localhost:3333` is our
    local development environment URL. The Gatsby application URL and Sanity Studio
    application URL hosted on Netlify are also automatically added to the **CORS Origins**
    list.


    In this way, we allow our local development environment and the applications hosted
    on Netlify to access our Sanity API.'
  merge: -1
