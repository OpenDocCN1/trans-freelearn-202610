- pgno: 89
  md: '# 6

    Sanity''s GraphQL Playground


    This chapter introduces GraphQL, a powerful query language. Sanity''s GraphQL
    API enables external programs to interact with its structured content while following
    the standard that it provides. This allows developers to leverage the rich GraphQL
    ecosystem of tools and practices that are available in the development community.
    Both GraphQL and GROQ, which is Sanity''s proprietary query language, are open
    source and can be used to interact with Sanity. However, while GROQ is specific
    to Sanity, GraphQL is universally used by many applications.


    In this chapter, we will explain what GraphQL is, examine some of the basic queries
    and their format, introduce Sanity''s GraphQL Playground, and learn how to use
    it to create and test GraphQL queries. In this chapter, we will cover the following
    topics:


    +   - An introduction to GraphQL

    +   - GROQ versus GraphQL

    +   - Sanity.io''s GraphQL playground basics


    # Technical requirements


    A web browser and a Terminal program are required.'
  merge: -1
  img_proc: true
- pgno: 90
  md: "# An introduction to GraphQL\n\nFirst, let's start by learning about GraphQL.\
    \ From the GraphQL website, we learn that GraphQL allows its user to describe\
    \ the data. This means defining how a data structure should be formed. Consider\
    \ the following example:\n\n```\ntype Event {\n  name: String\n  date: Date\n\
    }\n```\n\nHere, we define the structure of an event. Using GraphQL, we could query\
    \ the data structure as follows:\n\n```\n{\n  event(name: \"Saturday Night Party\"\
    ) {\n    date\n  }\n}\n```\n\nNotice that the basic structure looks almost the\
    \ same. We are asking for the data to be in the same format as it is defined.\
    \ The returned data would be in the following format:\n\n```\n{\n  \"event\" {\n\
    \    date: \"2020-10-01\"\n  }\n}\n```\n\n> **Note:**\n> For more information\
    \ on GraphQL's syntax and specification, please visit http://spec.graphql.org/draft/.\n\
    \nGraphQL's strength is that it gives its users the ability to request specific\
    \ information and to obtain predictable results that mirror those requests.\n\n\
    In the following sections, we will learn about why GraphQL is a compact and efficient\
    \ standard making it useful to obtain data from many data sources such as Sanity.\n\
    \nWe will continue our journey into the world of GraphQL by deploying the GraphQL\
    \ schema and using Sanity's command-line deployment tool."
  merge: -1
  img_proc: true
- pgno: 91
  md: '# # Deploying the GraphQL API


    Since Sanity uses GROQ internally, the optional GraphQL API needs to be deployed
    if Sanity''s dataset is used by other applications. To perform this, we need to
    return to the command line in the project''s `studio` directory.


    The following command needs to be typed into the Terminal:


    ```

    ```bash

    sanity graphql deploy

    ```

    ```


    We need to install the Sanity command-line program. Please type the following
    into the command line if it has not been installed already:


    ```

    ```bash

    npm install -g @sanity/cli

    ```

    ```


    You will be asked the following question:


    ```

    ```

    Do you want to enable a GraphQL playground? (Y/N)

    ```

    ```


    At this prompt, simply pressing the *Enter* key, or typing in Y, will enable the
    playground. The last line of the output that is produced should display the playground''s
    browser:


    ```

    ```

    GraphQL API deployed to:

    https://abcd1234.api.sanity.io/v1/graphql/production/default

    ```

    ```


    This URL can be opened in the web browser. Let''s examine the format.


    Notice that the URL is composed of the following: the project ID (which is shown
    here as `abcd1234`), followed by `api.sanity.io`, `v1` (version one), `graphql`,
    the dataset name (in this example, `production`), and, finally, the schema name
    (in this case, `default`).


    In the next section, we will explore the basic syntax of GraphQL.


    # ## Basic GraphQL syntax


    While Sanity''s GROQ uses a more compact syntax, its aim is to effectively get
    what you need from a collection of data. GraphQL''s aim is to allow the requesting
    service to specify the format of the data in an expressive and typed way to be
    returned, and then return it in that same format. We will now look at the basic
    syntax of a GraphQL query and how useful it might be to obtain data easily.'
  merge: -1
  img_proc: true
- pgno: 92
  md: "There are two basic types of queries:\n\n+   - The all prefix followed by the\
    \ schema, name, as shown in the following, is used to return multiple records.\n\
    +   - The single-record query, which will return only one record.\n\nLet's start\
    \ by learning about the all query format.\n\n# GraphQL's all query\n\nConsider\
    \ the following example query:\n\n```\n{\n  allEvent {\n    name\n  }\n}\n```\n\
    \nThe preceding query will return the name for all of the events in our dataset.\
    \ The singular form of event is used here instead of the plural form. The result\
    \ will be in the same format as the query. Notice that the results are wrapped\
    \ in a data object. Additionally, the allEvent query is repeated in the result,\
    \ and the result is in the same format as the query:\n\n```\n{\n  \"data\": {\n\
    \    \"allEvent\": [\n      {\n        \"name\": \"IT Conference\"\n      },\n\
    \      ...\n    ]\n  }\n}\n```\n\nNext, let's learn about the single-record GraphQL\
    \ query."
  merge: -1
  img_proc: true
- pgno: 93
  md: "# GraphQL's single-record query\n\nThe second type of GraphQL query will return\
    \ only one record. The following snippet is an example of this second type of\
    \ query:\n\n```\n{\n  Event(id: \"6ddd2730-9aca-46dd-a7fd-850ab306f7fb\") {\n\
    \    name\n  }\n}\n```\n\nNotice that this type of single-record query needs an\
    \ argument to identify the record. In this case, the id parameter of the event\
    \ is used.\n\nThis will return a single event. The result is in the same format\
    \ as the query. Notice that the Event query is repeated in the results:\n\n```\n\
    {\n  \"data\": {\n    \"Event\": {\n      \"name\": \"IT Conference\"\n    }\n\
    \  }\n}\n```\n\nNow that we have learned about the basic syntax of GraphQL, let's\
    \ delve more deeply into it. In the next section, we'll view the difference between\
    \ GROQ and GraphQL.\n\n# GROQ versus GraphQL\n\nIn Chapter 5, Sanity's GROQ Language,\
    \ in the Advanced GROQ section, we wrote a GROQ query that returned all of the\
    \ events for a particular venue. Now we will compare GROQ with GraphQL.\n\nRecalling\
    \ the GROQ syntax, the desired venue was named Will's Pub:\n\n```\n*[_type ==\
    \ \"event\" && venue->name == \"Will's Pub\"] {\n  name,\n  venue->{name}\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 94
  md: "Next, let's write the corresponding GROQ query in GraphQL:\n\n```\n```graphql\n\
    {\n  allEvent(where:\n    { venue:\n      { name:\n        { eq:\n          \"\
    Will's Pub\"\n        }\n      }\n    }\n  )\n    {\n      name\n      venue {\n\
    \        name\n      }\n    }\n}\n```\n```\n\nGROQ's type == \"event\" equates\
    \ to allEvent, which is a function. Note that the GraphQL uses SQL's familiar\
    \ where keyword, which is a parameter. This is then followed by an object as an\
    \ argument, which is venue. The venue's name parameter is nested within venue.\
    \ Then, eq is the two-letter abbreviation for equals.\n\nThis concludes the function-argument-parentheses\
    \ set. Then, between curly braces, we list the fields that we are interested in\
    \ returning. Notice that GraphQL does not use commas between each value, while\
    \ GROQ does. We return the event name (name) and also the venue name, which, again,\
    \ is nested.\n\nThe result is as follows:\n\n```\n```json\n{\n  \"data\": {\n\
    \    \"allEvent\": [\n      {\n        \"name\": \"The Appleseed Cast\",\n   \
    \     \"venue\": {\n```\n```"
  merge: -1
  img_proc: true
- pgno: 95
  md: "```\n\"name\": \"Will's Pub\"\n}\n},\n{\n\"name\": \"Friday Drinks\",\n\"venue\"\
    : {\n\"name\": \"Will's Pub\"\n}\n}\n]\n}\n}\n```\n\nAs you can see, two events\
    \ are returned. If only the event, named The Appleseed Cast, should be returned,\
    \ an additional argument to the where keyword can be added. There will be a comma\
    \ separator. Note that this is the event name, not the venue name, as both fields\
    \ had the same name:\n\n```\n{\n  allEvent(where: { venue: { name: { eq: \"Will's\
    \ Pub\" } },\n    name: { eq: \"The Appleseed Cast\" } }\n  ) {\n    name\n  \
    \  venue {\n      name\n    }\n  }\n}\n```\n\nThe result will now still be a list\
    \ (that is, an array) because allEvent is used; however, the list will only have\
    \ one value:\n\n```\n{\n\"data\": {\n\"allEvent\": [\n{\n\"name\": \"The Appleseed\
    \ Cast\",\n\"venue\": {\n```"
