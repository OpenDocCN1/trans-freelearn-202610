  md: '# # 7


    # Gatsby – An


    # Introduction


    Gatsby is the second part of the three-part Jamstack system used in this book.
    The definition that Gatsby gives for itself is as follows:


    > "*A free and open source framework based on React that helps developers build
    blazing fast websites and apps.*"


    Since it is a free and open source framework, all of the code is easily examined
    and modifiable. Secondly, the websites and apps that Gatsby produces are blazing
    fast because the HTML pages that it creates are actual files, and not just produced
    through backend processes written in server-side languages.


    First, we’ll learn what React is, then, we will look at how Gatsby’s basic project
    is structured, examining its file and folder structure.


    The main topics that we will cover in this chapter are as follows:


    +   - Gatsby, built on React

    +   - Gatsby basic project structure

    +   - The gatsby develop command'
