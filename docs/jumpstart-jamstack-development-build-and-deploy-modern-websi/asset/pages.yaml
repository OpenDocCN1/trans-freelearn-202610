    # Migration and integration


    Integrating Sanity with other code bases is easy, thanks to a set of tools available
    to present portable text in different usable formats, such as hyperscript and
    Markdown and libraries for PHP and .NET: https://www.sanity.io/docs/presenting-block-text.'
