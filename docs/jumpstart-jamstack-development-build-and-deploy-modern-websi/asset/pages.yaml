    ```javascript

    }

    var result = multiplyTwoNumbers(2, 3);

    </javascript>

    ```

    ```


    Minified JavaScript looks like this:


    ```

    ```javascript

    <javascript>

    function a (b, c) {return b*c;} var d=a (2, 3);

    </javascript>

    ```

    ```


    # ## Less error-prone


    Most Jamstack systems have a build process that checks all of the HTML, JavaScript,
    and CSS for correctness during the process that builds the pages, so a serious
    coding error will cause the build to fail, not allowing the error to actually
    make it into production.


    # ## Security


    Using the safe **HyperText Transfer Protocol Secure (HTTPS)** instead of the older
    **HyperText Transfer Protocol (HTTP)** means that all information transmitted
    will be secure, as it is encrypted from end to end.


    Also, since static pages are served through *serverless* hosting services, there
    is no chance that any backend systems or databases could be compromised. No longer
    is there a need to spend valuable time keeping the server, libraries, login access,
    and mail services secure and always on the latest version, or even worrying about
    conflicts between the various versions.


    # ## Developer experience


    Developing in the Jamstack means using popular and modern programming languages,
    such as JavaScript, TypeScript, and **ECMAScript 6 (ES6)** variants. Jamstack
    developers may also take advantage of modern query languages such as GraphQL,
    and libraries and frameworks such as ReactJS and VueJS. They may also use static
    site generators such as Hugo and GatsbyJS.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Our Jamstack


    As should be clear by now, the Jamstack is not a stack, but rather a web development
    paradigm. Any combination of the various components of the Jamstack ecosystem
    may be used. For this book, we will use three of the most popular software applications
    and services to produce a Jamstack website: GatsbyJS, Sanity.io, and Netlify.
    We will also provide several examples, using other Jamstack tools for comparison.


    # GatsbyJS


    One of the most popular parts of the Jamstack that is actually a static site generator
    is GatsbyJS.


    **GatsbyJS** (referred to as Gatsby) is open source and uses the React JavaScript
    library to compile and build static pages from various sources. These sources
    may be as simple as a filesystem; a collection of Markdown files; a traditional
    CMS such as WordPress or Drupal; or a headless CMS such as Contentful or Sanity.


    # Sanity.io


    Since the *Jamstack way* of doing web development eschews a single, monolithic
    CMS, the actual content that a website needs is separate from the tools that will
    format it and deliver it.


    **Sanity.io** (referred to as Sanity) is a platform for structured content. There
    is an open source CMS called Sanity Studio, which enables content producers such
    as writers, editors, and photographers to easily create rich content that is flexible
    and modular, without the need to understand programming and markup languages.


    # Netlify


    The actual *hosting* of the website will be done on a serverless system.


    **Netlify** is a service that enables a developer to enjoy fully automated compilation
    and deployment onto Netlify''s CDN, pushing content out quickly and safely to
    servers throughout the world.


    # Getting started with the Jamstack


    Now that we have learned about the history of the Jamstack and its advantages,
    we will next look at the tools necessary to use the Jamstack in the context of
    this book.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Installation


    Installing all of the pieces of a Jamstack development environment and configuring
    everything to work properly will be daunting for developers who are new to the
    technology, so the best approach is to refer to each of the components'' websites
    for up-to-date installation and configuration documentation.


    This book has an accompanying GitHub repository with all of the code necessary
    to perform all of the examples. Therefore, the first tool that needs to be installed
    will be the Git version control system. Users who are new to Git will find a vast
    amount of information, cheat sheets, and help forums for its usage, but most of
    the basic operations are performed with only four or five commands. Many code
    editors, such as WebStorm, have the commands built into the user interface.


    To ensure that the installation process is up to date, the README.md file in the
    provided repository will provide installation instructions and links to each project''s
    current documentation.


    # Prerequisites


    Several web development tools are necessary to work with the examples in this
    book, and these are listed here:


    +   - Terminal

    +   - Node.js and **node package manager** (`npm`)

    +   - Git

    +   - An **Integrated Development Environment** (**IDE**) or text editor


    A Terminal environment will be needed to execute commands. Which Terminal application
    should be used will vary depending on the operating system used.


    Node.js allows JavaScript to be run in the Terminal, not only in the browser.


    npm is necessary for the installation of both Sanity and Gatsby. This allows many
    packages that are groups of JavaScript functionality to be installed.


    The Git command-line version control system is essential for the installation
    of Gatsby and also to download the examples in this book.


    Finally, an IDE that provides code syntax highlighting and linting, which continually
    analyzes the code for correctness, is needed. If this is not possible, a text
    editor is needed to modify the source code files. As of this writing, Visual Studio
    Code and WebStorm are two popular IDE choices.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Optional tools


    Optionally, Yarn may be used for the examples in this book. Yarn is an npm-compatible
    replacement for npm and while it is suggested, it is not required.


    # Summary


    In this chapter, we learned about how the World Wide Web grew from simple pages
    with markup and links, to become massively slow and insecure web applications.
    We learned how the Jamstack combines various aspects of the past and present to
    form a truly modern, decoupled, and enjoyable paradigm to work with for web developers
    and web designers wishing to learn more.


    In the next chapter, we''ll begin our journey into the construction of a real,
    working Jamstack application. We''ll become familiar with Sanity and a web-based
    tool to quickly create a sample application, using one of several templates.


    We will introduce Sanity and its features and show how to modify its schemas.
    We will show how to use Sanity to design and build the structured content needed
    to create a website with news and events.'
  merge: -1
  img_proc: true
