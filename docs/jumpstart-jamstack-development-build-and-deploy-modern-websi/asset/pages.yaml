- pgno: 102
  md: '# Technical requirements


    For this chapter, the Gatsby application needs to be installed, and a Terminal
    program and a web browser are required.


    # Gatsby, built on React


    **React** is a JavaScript library used to create user interfaces. It uses declarative
    syntax and also a modular component-based system. Since Gatsby is built on top
    of React, you will quickly discover many pieces of React as you learn more about
    Gatsby. Another part of the Gatsby ecosystem called **JSX** is also used by Gatsby.
    JSX allows Gatsby page elements to be written using the familiar HTML tag format
    and allows the use of attributes to pass parameters to them. Each JSX tag can
    be a single unit of a project. Since JSX tags are also JavaScript, they may be
    integrated with JavaScript programming logic.


    Since React is one of many JavaScript libraries and frameworks, such as Angular
    and Vue, the framework itself is quite large, with a healthy ecosystem, and much
    learning is required to develop proficiency. Luckily, there are many training
    courses specific to React should you want to more deeply learn how to use it.
    While learning React is outside of the scope of this book, learning Gatsby will
    indirectly expose you to some of React''s ways of doing things.


    # Gatsby basic project structure


    In this project, the project''s files were created through `https://create.sanity.io`.
    During the creation process, Gatsby''s project file structure and configuration
    were automatically installed directly in the `/web` folder, and this is roughly
    equivalent to what would be installed using Gatsby''s new project creation command.


    If Gatsby was created using the `-g` flag, which signifies globally, it gets installed
    and becomes available system-wide to the user:


    ```

    `npm install -g gatsby`

    ```


    Otherwise, Gatsby commands can be run in the directory where it was installed
    according to the `package.json` file.


    A new project can be created, alternatively, by typing the following command in
    the Terminal:


    ```

    `gatsby new projectname`

    ```'
  merge: -1
  img_proc: true
- pgno: 103
  md: "In the preceding example, `projectname` is the name of your chosen project\
    \ and will also become the name of the folder created wherever the command is\
    \ typed.\n\nWe'll take a closer look at the file structure of our project in the\
    \ following sections.\n\n# gatsby-config.js\n\nThe first file that we will learn\
    \ about is `gatsby-config.js`. This file is installed in the /web folder.\n\n\
    Next, we'll look at the three main points of the file:\n\n+   - Its structure\n\
    +   - Its syntax\n+   - Gatsby's Sanity installation\n\nLet's begin.\n\n# Structure\n\
    \nThe file begins with `module.exports`, which is a Node.js way of allowing the\
    \ contents of the curly braces to be exposed and used in (that is, exported to)\
    \ other parts of the application:\n\n```\nmodule.exports = {}\n```\n\nThe main\
    \ part of the file is `siteMetadata`, which holds the application's metadata,\
    \ such as `title` and `description`, and `plugins`, which is an array of plugins,\
    \ represented syntactically by square parentheses. An excerpt of the `gatsby-config.js`\
    \ file is shown:\n\n```\nmodule.exports = {\n  siteMetadata: {\n    title: `Gatsby\
    \ Default Starter`,\n    description: `Kick off your next, great Gatsby project\
    \ with this default starter...`,\n    author: `@gatsbyjs`,\n  },\n  plugins: [\n\
    \    `gatsby-plugin-react-helmet`,\n    {\n      resolve: `gatsby-source-filesystem`,\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 104
  md: "```\noptions: {\n    name: `images`,\n    path: `${__dirname}/src/images`,\n\
    \  },\n  },\n  ...\n],\n}\n```\n\nNext, we'll look at the syntax of the file.\n\
    \n# Syntax\n\nYou may not be familiar with the syntax used throughout Gatsby:\n\
    \n```\npath: `${__dirname}/src/images`,\n```\n\nThis syntax, called a **template\
    \ literal**, is part of ECMAScript 2015, or ES6, the latest JavaScript specification.\
    \ The backtick character is used here, where previously, single quotation marks\
    \ would often have been used.\n\nOne disadvantage to single quotation marks is\
    \ that they are not multi-line, so for example, a plus sign is needed to concatenate,\
    \ or combine sequentially, the two phrases. Here is an example:\n\n```\nvar multilineString\
    \ = 'This is an example of a ' +\n' multi-line string that is more than one line\
    \ long.';\n```\n\nIn ES6, the equivalent can be achieved with the following:\n\
    \n```\nlet multilineString = `This is an example of a\nmulti-line string that\
    \ is more than one line long.`\n```\n\nAdditionally, the let keyword is used in\
    \ place of the var keyword. Whereas previously, only a variable (var) could be\
    \ declared, now let can be used to assign a value that can change. The constant\
    \ (const) keyword can be used to designate a value that cannot change, meaning\
    \ that it is immutable."
  merge: -1
  img_proc: true
- pgno: 105
  md: "Additionally, string interpolation is achieved by enclosing a variable in curly\
    \ braces (also called curly brackets) and then preceding it with a dollar sign\
    \ ($). This allows using both variables and simply strings within the same expression\
    \ as shown:\n\n```\npath: `${__dirname}/src/images`,\n```\n\nHere, the __dirname\
    \ variable will be replaced with the name of the directory. See the following\
    \ example:\n\n```\npath: `/home/chris/src/images`\n```\n\nFinally, let's learn\
    \ how to configure Gatsby to work with Sanity.\n\n# Sanity's Gatsby installation\n\
    \nSince the version of Gatsby used in the book was installed and configured based\
    \ on the instructions at https://www.sanity.io/create, it is preconfigured to\
    \ work with Sanity, even though Gatsby may obtain and use information from many\
    \ different types of information sources. This happens through Gatsby's source\
    \ plugins, which are named in the following format:\n\n```\ngatsby-source-name\n\
    ```\n\nThe name value in the preceding snippet could be replaced with Sanity (gatsby-source-sanity),\
    \ WordPress (gatsby-source-wordpress), Drupal (gatsby-source-drupal), or any of\
    \ hundreds of different types of data sources at the time of writing this book.\
    \ The default Gatsby source is gatsby-source-filesystem. In Chapter 9, Gatsby\
    \ Source Plugins, we will discuss this in more detail.\n\nThis is an example of\
    \ the gatsby-source-sanity plugin. It has a list of options:\n\n```\n{\n    resolve:\
    \ \"gatsby-source-sanity\",\n    options: {\n        ...clientConfig.sanity,\n\
    \        token: process.env.SANITY_READ_TOKEN,\n        watchMode: !isProd,\n\
    \        overlayDrafts: !isProd\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 106
  md: "The first thing to notice is the following line:\n\n```\n...clientConfig.sanity,\n\
    ```\n\nThe triple period is used in JavaScript as the spread operator, which assigns\
    \ all the object attributes into separate variables. But first, let's examine\
    \ what happens beforehand.\n\nThe first few lines of this configuration file are\
    \ important:\n\n```\n// Load variables from `.env` as soon as possible\nrequire('dotenv').config({\n\
    \  path: `.env.${process.env.NODE_ENV || 'development'}`\n})\nconst clientConfig\
    \ = require('./client-config')\nconst isProd = process.env.NODE_ENV === 'production'\n\
    ```\n\nThese lines are important because they determine Gatsby's environment variables\
    \ and set up the Sanity integration. An environment variable is a variable whose\
    \ value can vary depending on the environment in which it is used.\n\nFor example,\
    \ in production, an email may be sent after completing a form, whereas in the\
    \ development environment, it would not be sent.\n\n# dotenv\n\nThe dotenv file\
    \ is a convention used to store configuration values. It is usually not committed\
    \ to source code control, GitHub in this case, so that credentials and passwords\
    \ may be kept private:\n\n```\nrequire('dotenv').config({\n  path: `.env.${process.env.NODE_ENV\
    \ || 'development'}`\n})\n```\n\nThere is an example of this file in the /web\
    \ directory, namely .env.production, with the following format:\n\n```\nGATSBY_SANITY_PROJECT_ID=\"\
    abcd1234\"\nGATSBY_SANITY_DATASET=\"production\"\n```"
  merge: -1
  img_proc: true
- pgno: 107
  md: "process.env.NODE_ENV is used to determine which environment is currently being\
    \ used. development is the default environment used if none is specified, so to\
    \ enable this file to be used, it must exist in the correct format. Create a copy\
    \ of .env.production and name it env.development. The .env.production file will\
    \ be used for production deployments.\n\n# Client configuration\n\nThe next line\
    \ requires loading the contents of the client-config file, meaning that it must\
    \ bring its contents into the current code.\n\nHere are the contents of the file.\
    \ This is used to set two values, projectId and dataset. It assigns the values\
    \ from the .env file, if present, or else the actual names provided when the project\
    \ was created:\n\n```\nmodule.exports = {\n  sanity: {\n    projectId: process.env.GATSBY_SANITY_PROJECT_ID\
    \ || 'abcd1234',\n    dataset: process.env.GATSBY_SANITY_DATASET || 'production'\n\
    \  }\n}\n```\n\nThese values get set into the clientConfig variable, and then\
    \ the contents are spread into the gatsby-source-sanity options where they are\
    \ used to connect to the Sanity GraphQL API:\n\n```\noptions: {\n  ...clientConfig.sanity,\n\
    \nconst clientConfig = require('./client-config'),\n```\n\nAt this point, the\
    \ clientConfig constant holds the Sanity configuration.\n\nNext, let's learn about\
    \ Gatsby's key files.\n\n# Key Gatsby files\n\nThree key files in any Gatsby project\
    \ are gatsby-ssr.js, gatsby-node.js, and gatsby-browser.js. They collectively\
    \ belong to the Gatsby API. Each file has a particular purpose. Interestingly,\
    \ each of these files is optional, so they can be created and added to the project\
    \ as needed."
  merge: -1
  img_proc: true
- pgno: 108
  md: 'It’s important to learn how the build process works. Remember that since a
    static site generator literally produces only files, once a web page is produced,
    it can no longer execute server-side code. All the server-side code execution
    will occur in a file called `gatsby-ssr.js`.


    Let’s look at the three key files in detail.


    +   - `gatsby-ssr.js`: **SSR** is an acronym for **server-side rendering**, so
    it soon becomes clear what the purpose of this file is. This file allows you to
    modify the content of the pages as they are being generated (rendered) on the
    server by Gatsby. The functions that can be called from inside of this file will
    interact with the pages at build time as they are rendered.

    +   - `gatsby-node.js`: Since Gatsby uses Node.js, the functions in this file
    allow Gatsby to tap into the entire process.

    +   - `gatsby-browser.js`: This is the file where the actual interaction on the
    page will occur after the web pages are rendered.


    # # Gatsby folders


    Here is a list of the main Gatsby folders.


    # ## src


    This folder contains the Gatsby source files, including images and the cascading
    style sheets that are used to style the website. Additionally, the following folders
    are contained within the `src` folder.


    +   - **Components**: In this directory are the building blocks that will be used
    for website construction. Inside of this directory, there will be pieces of content
    used across multiple pages.

    +   - **Pages**: The contents of this directory are used for single pages; for
    example, an *about us* page, where it is the only page of its type. Another example
    is a 404 page, used when a user enters a web address into the browser address
    bar that doesn’t exist, or clicks a link to a page on the website that doesn’t
    exist either. Each page should have a unique layout. If the pages are too similar,
    then templates should be used where many of the same types exist, such as for
    blog articles.

    +   - **Templates**: As mentioned previously, a template is used to create many
    pages of the same type, where all of the pages for a single template have almost
    the exact same format and layout, for example, with just the page title, headline,
    and body content differing.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# public


    Located outside of the `src` directory, this folder is where the deployed website
    pages will be created if they do not already exist when `gatsby build` is run
    in the command line. This is also where the files will be referenced as the document
    root when a Gatsby website is first viewed using the `gatsby serve` command. The
    contents of the public directory may be deleted and recreated at any time since
    running `gatsby build` will always recreate them.


    The complete Gatsby documentation may be found at https://www.gatsbyjs.com/docs/,
    and looks as follows:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_109_0.png)


    Figure 7.1 – Gatsby website documentation


    Now that we''ve learned about Gatsby''s file and folder structure, we will move
    on to learn how to use Gatsby. To start up Gatsby, we''ll need to use the command
    line. Start Gatsby in development mode.


    # The gatsby develop command


    Using Gatsby at the command line provides many different types of functionality
    for the various project stages. Initially, the `gatsby develop` command will start
    up Gatsby in development mode. This allows changes to be viewed in real time.
    The command won''t stop running until you press `Ctrl + C`. This key combination
    is used in the UNIX operating system to terminate (kill) a process.'
