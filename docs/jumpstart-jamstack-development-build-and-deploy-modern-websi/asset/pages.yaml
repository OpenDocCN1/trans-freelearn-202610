- pgno: 97
  md: "The GraphQL playground's interface is easy to use. Similar to the Vision GROQ\
    \ tool, the queries are typed into the left-side window and are executed by clicking\
    \ on the play icon in the middle of the interface.\n\nAs expected, the GraphQL\
    \ results are displayed in the right window. Query variables may be entered into\
    \ a bottom window.\n\nOn the right, there is a green-colored tab, labeled **SCHEMA**.\
    \ Clicking on this will reveal the various GraphQL starting points, such as allEvent.\
    \ Navigating through this schema is a convenient way to determine whether the\
    \ GraphQL was deployed correctly after typing in the Sanity `graphql deploy` command.\
    \ This command is required after any changes to the schema are made in Sanity.\n\
    \nIf a schema or schema field is not viewable here, then it will not be accessible\
    \ to any external service that uses this API, so it's a convenient way to check\
    \ that the schema reflects the actual state of the dataset. In the following code\
