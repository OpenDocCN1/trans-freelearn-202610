    # Summary


    In this chapter, we learned about page, template, and partial components. The
    page component represents a unique page, a template is used to produce many similar
    types of pages, and partials are pieces of content that can be used within other
    pages. Each type of component used in Gatsby is based on React, so it reutilizes
    a robust JavaScript-based system. These components are the building blocks of
    Gatsby, so knowing how to create and work with them is essential to all Gatsby
    development.


    In the next chapter, we will begin our journey into the A part of the Jamstack
    acronym – the API.'
