  md: "3. In our submission-created.js file, let's add the client at the top of the\
    \ file, like this:\n\n```\nconst sanityClient = require('@sanity/client')\nexports.handler\
    \ = function(event, context, callback) {\n    callback(null, {\n        statusCode:\
    \ 200,\n        body: \"Hello, World\"\n    });\n}\n```\n\n4. To initialize the\
    \ client, we need to provide the Sanity project ID, dataset name, and an access\
    \ token. In our Sanity application home page, our local is under http://localhost:3333.\
    \ Get the project ID and the dataset used from your Sanity manager console.\n\n\
    5. We have created the access token in the previous section, and we can now reuse\
    \ it, as follows:\n\n```\nconst sanityClient = require('@sanity/client')\nconst\
    \ client = sanityClient({\n    projectId: 'my_project_id',\n    dataset: 'my_dataset',\n\
    \    token: process.env.SANITY_STUDIO_ADD_EVENT\n})\nexports.handler = function(event,\
    \ context, callback) {\n    callback(null, {\n        statusCode: 200,\n     \
    \   body: \"Hello, World\"\n    });\n}\n```\n\n6. Now, we can use the create(doc)\
    \ method to add a new event to Sanity.\n\n7. The client method requires a plain\
    \ JavaScript object representing the document. It must include a _type attribute."
