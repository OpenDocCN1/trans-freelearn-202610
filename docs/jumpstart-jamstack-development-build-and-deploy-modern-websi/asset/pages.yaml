  md: 'Next, let''s examine the following screenshot of the expanded allSanityEvent
    section:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_116_0.png)


    Figure 8.3 – GraphiQL with an example query


    As the allSanityEvent section is expanded, followed by filter, the filter options
    are shown. virtual eq false filters results based on the following criteria: only
    the events that are not virtual (eq false) are selected. The following screenshot
