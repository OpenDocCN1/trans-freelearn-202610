    tool we have created a new application hosted on Netlify using the Sanity user
    interface, and we have hosted our code base on GitHub. We explored how to manage
    a Sanity application and Sanity Studio''s **Dashboard** capabilities.


    In the next chapter, we will explore the example content, and learn how to delete,
    modify, and create new content using the Sanity Studio **Desk**.'
