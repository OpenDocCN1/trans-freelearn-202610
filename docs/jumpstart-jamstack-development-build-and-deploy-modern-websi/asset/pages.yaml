- pgno: 5
  md: '# Foreword


    Innovation is often driven by people who expect more and challenge the status
    quo. Instead of making small improvements to what is, they invent new paths that
    over time become inevitable. We reach a point where we can''t imagine going back
    to where we came from.


    The most common solutions for building web pages today were created in the early
    2000s. What was once state of the art is now limiting digital projects and content
    collaboration, frustrating developers and content editors and leaving product
    and business owners with infrastructure that creates poor digital customer experiences
    and harms their capacity for digital transformation.


    We are now finally seeing a reinvention of the way we approach content and digital
    experiences on the web, and the frameworks and services commonly known as Jamstack
    are a big part of this revolution. They have emerged as a response to the constraints
    of traditional monolithic web architectures: organizations need more security,
    scalability, and to service their audience''s demand for better content at an
    ever-increasing rate of delivery.


    Jamstack fulfills these needs in ways that monolithic systems simply cannot. These
    tools are redefining what''s possible on the web – and this book is the primer
    you need to make the leap into this new way of building. Christopher Pecoraro
    and Vincenzo Gambino provide a step-by-step process for building your own blazing-fast
    website and real-time backend by combining three innovative and industry-leading
    tools:


    +   - **GatsbyJS**: the highly popular React-based static site generator

    +   - **Netlify**: the industry-leading Jamstack web host and content delivery
    network

    +   - **Sanity.io**: the real-time content platform that lets you treat content
    as data


    In addition to making fast websites, this book shows you how these tools can be
    used to present content to any application or device, as exemplified by powering
    an Amazon Alexa skill from the same content that drives your website.'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'This is the true promise of the tools you are introduced to in this book –
    they’re capable of so much more than websites. This API-enabled constellation
    of microservices, structured content, and serverless computing also supports a
    higher goal of content velocity. Forward-thinking teams are embracing the fact
    that great websites are just the first step towards running unified content projects.
    They’re ushering in a new way of working – where product and marketing content
    and workflows converge around a single source of truth, and shipping amazing omni
    channel experiences is no longer a pipedream.


    Since you are reading this book, you’re probably a person who expects more, challenges
    the status quo, and the one who explores the bleeding edge. Together we are creating
    a paradigm shift, not only on how the web is built, but in the approach we take
    to content, and to building digital experiences at large.


    See you on the other side...


    *Magnus Kongsli Hillestad*


    *CEO @ Sanity.io*'
