- pgno: 117
  md: "![](img/97ab031f38e2174e2f1b51da18dfa1d0_117_0.png)\n\nFigure 8.4 – Query options\n\
    \nThen, name is chosen from the list of node fields after expanding edges.\n\n\
    The query is automatically created, as follows:\n\n```\n```graphql\nquery MyQuery\
    \ {\n  allSanityEvent(filter: {virtual: {eq: false}}) {\n    edges {\n      node\
    \ {\n        name\n      }\n    }\n  }\n}\n```\n```\n\nTo execute the query, click\
    \ on the **Play** button.\n\nThe results are shown in the third panel, on the\
    \ right-hand side. Two other features are **History** and **Prettify**. **Prettify**\
    \ is used to properly format the code."
