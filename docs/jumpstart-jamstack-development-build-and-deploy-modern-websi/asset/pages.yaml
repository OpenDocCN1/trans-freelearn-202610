  md: '![](img/97ab031f38e2174e2f1b51da18dfa1d0_115_0.png)


    # Figure 8.2 – GraphiQL


    On the left-hand side, we can see the GraphQL Explorer. This helps us to automatically
    create GraphQL queries by providing the user with a view of all of schemas available
    for use. So, by expanding each of the schemas, options for filtering and sorting
    are shown, along with the fields (including their nest elements) that are available
