- pgno: 62
  md: "# Exploring the project's folders\n\nIn this section, we shall examine the\
    \ contents of the project's folders and files. There are several important files\
    \ as well as several folders. The first file that we will examine is the `sanity.json`\
    \ file. This file is located in the project's `studio` folder.\n\n# Examining\
    \ the sanity.json file\n\nHere are the first few lines of the `sanity.json` file:\n\
    \n```\n\n{\n  \"root\": true,\n  \"project\": {\n    \"name\": \"Hands On JAMstack\"\
    \n  },\n  \"api\": {\n    \"projectId\": \"abc123d4\",\n    \"dataset\": \"production\"\
    \n  },\n```\n```\n\nThis file contains two important values: `projectId` and the\
    \ `dataset` name:\n\n+   *   `projectId`: The `projectId` value uniquely defines\
    \ the project, meaning that no one else will have this ID. The `projectId` consists\
    \ of letters and numbers.\n+   *   `dataset`: The `dataset` value, however, is\
    \ not unique, and will be used to identify which dataset this instance of Sanity\
    \ Studio is currently using. For example, one might select `production` to represent\
    \ a final version of a schema and data, and `development` to represent the upcoming\
    \ changes. Both the schema and the actual content are contained within the dataset.\
    \ Each dataset is completely separate, and Sanity Studio may load any one of the\
    \ datasets, but only one schema at a time.\n\nAdditionally, the `root` is set\
    \ to `true` to specify that this file is the project's main `sanity.json` file,\
    \ since plugins may have their own `sanity.json` files. The `sanity.json` files\
    \ found in plugins will have `root` set to `true`."
  merge: -1
  img_proc: true
- pgno: 63
  md: "# Examining the schemas folder\n\nNext, we shall examine the `schemas` folder\
    \ in the `studio` folder. In the two subfolders – `documents` and `objects`, we\
    \ will find a collection of files, one per schema. Each one is a JavaScript file\
    \ with a single object. The following code example shows a schema file format\
    \ with minimal fields:\n\n```\nexport default {\n\tname: 'siteSettings',\n\ttype:\
    \ 'document',\n\ttitle: 'Site Settings',\n}\n```\n\nThe file begins with the `export`\
    \ keyword. The `export` keyword means that this JavaScript module may be used\
    \ in the calling file by using the `import` statement. The next keyword is `default`.\
    \ This keyword means that this single object will be used. Finally, the object\
    \ itself follows, using the opened and closed parentheses. The three essential\
    \ attributes in the object, which are key and value attribute pairs, are `name`,\
    \ `title`, and `type`.\n\n# name\n\nThe `name` attribute used in schemas always\
    \ represents a single entity. The `name` value must be a single word, and per\
    \ convention should match the name of the file, but without the extension, of\
    \ course.\n\n**Camel case**, named as such because of the animal that it most\
    \ looks like, is used. The standard format is as follows: the first word is represented\
    \ as lowercase, and the second word and words that follow are capitalized. For\
    \ example, a correct `name` attribute value would be `siteSettings`.\n\n# title\n\
    \nThe next important attribute is `title`. This attribute is meant to be a human-readable\
    \ description of the schema entity and may contain spaces and other special characters.\
    \ It is displayed inside Sanity Studio. Therefore, it should be a word that clearly\
    \ defines what it represents. For example, the corresponding title could be `Site\
    \ Settings`."
  merge: -1
  img_proc: true
- pgno: 64
  md: "# type\n\nNext, the schema type determines whether the schema is a document\
    \ or object. A document is what will be listed in the main navigation of Sanity\
    \ Studio. An object is a more abstract representation of an entity, such as a\
    \ relationship between two documents or a building block to be used within a document,\
    \ such as an address block containing several fields, such as address, city, and\
    \ postal code.\n\nThe default project that is automatically created uses the two\
    \ directories – documents and objects, to help organize the project by grouping\
    \ the schemas by type.\n\n# Author schema\n\nFor the next step, examine the structure\
    \ of the `author.js` file in the documents directory.\n\n# Schema definition\n\
    \nAs shown in the following code sample, the fields attribute is an array. The\
    \ use of square brackets is a syntax to denote a list or collection of items.\
    \ To begin with, the list of items is empty. It will be filled to contain a list\
    \ of fields:\n\n```\nexport default { \n    name: 'author',\n    type: 'document',\n\
    \    title: 'Author',\n    fields: [\n    ],\n    }\n\n```\n\nAll entities must\
    \ contain at least one field. Each object within the fields array follows the\
    \ same format as the entity itself, at a minimum name, title, and type.\n\n# Schema\
    \ fields\n\nPossibly the simplest example of this would be a name field, which\
    \ represents the first and last name of the author:\n\n```\nexport default { \n\
    \    name: 'author',\n    type: 'document',\n    title: 'Author',\n\n```"
  merge: -1
  img_proc: true
- pgno: 65
  md: "```\n```javascript\nfields: [\n  {\n    name: 'name',\n    type: 'string',\n\
    \    title: 'Name'\n  },\n]\n}\n```\n```\n\nIn the preceding code example, we\
    \ have placed the name attributes inside of the `fields` array. This array is\
    \ of a string type, which basically means a short phrase or label without any\
    \ associated formatting such as bold italics.\n\n> **Note**\n> \n> The `title`\
    \ attribute should represent a word or phrase that a content editor could recognize\
    \ and will be displayed in Sanity Studio.\n\nThere are three other attributes\
    \ that can be used in each field:\n\n+   - `description` is a longer description\
    \ of how the field should be used.\n+   - `readOnly` disables editing in Sanity\
    \ Studio.\n+   - `hidden` hides the field from Sanity Studio.\n\nThe readOnly\
    \ and hidden fields would be modified programmatically and not by the person using\
    \ the interface.\n\n# Schema field types\n\nThere is a wide range of types available\
    \ for use. At the time of writing, the following types, other than document, are\
    \ available:\n\n+   - Array\n+   - Block\n+   - Boolean\n+   - Date\n+   - Datetime\n\
    +   - File\n+   - Geopoint"
  merge: -1
  img_proc: true
- pgno: 66
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 67
  md: "```\ntype: 'document',\ntitle: 'Address',\nfields: [\n{\n  name: 'street',\n\
    \  type: 'string',\n  title: 'Street'\n},\n{\n  name: 'city',\n  type: 'string',\n\
    \  title: 'City'\n},\n{\n  name: 'postalCode',\n  type: 'string',\n  title: 'Postal\
    \ Code'\n},\n{\n  name: 'country',\n  type: 'string',\n  title: 'Country'\n},\n\
    ]\n}\n```\n\nIn this example, this schema is of type address, so author will link\
    \ to address through the address reference as shown:\n\n```\nexport default {\n\
    \  name: 'author',\n  type: 'document',\n  title: 'Author',\n  fields: [\n  {\n\
    \    name: 'name',\n    type: 'string',\n```"
  merge: -1
  img_proc: true
- pgno: 68
  md: "```\n    title: 'Name'\n},\n{\n    name: 'address'\n    type: 'reference'\n\
    \    to: {type: 'address'}\n}\n],\n}\n```\n\nIn the Sanity schema, we use the\
    \ reference type and an additional attribute, to. The to attribute accepts an\
    \ object specifying the type.\n\n# A one-to-many relationship\n\nIn the same way,\
    \ a schema can be related to many schemas, even of various types. A simple example\
    \ is an author that writes for multiple publishing houses:\n\n```\n{\n    name:\
    \ 'publishers',\n    title: 'Publishers',\n    type: 'array',\n    of: [\n   \
    \ {\n        type: 'reference',\n        to: '[{type: 'publisher'}]',\n    }\n\
    \    ]\n},\n```\n\nIn this example, the type field is an array so that inside\
    \ Sanity Studio, one or more publishers could be chosen from a list of publishers.\
    \ Note that the name \"publishers\" is given to this field to show that this field\
    \ represents multiple publishers, however, the relationship is to a schema of\
    \ type publisher, and schema names are always singular.\n\nIn the first part of\
    \ this chapter, we learned about the structure of a schema. In the next section,\
    \ we will learn how to modify schemas."
  merge: -1
  img_proc: true
- pgno: 69
  md: "# Extending, modifying, and deploying the schema\n\nFor the example used in\
    \ this book, we will be creating a news and events website. The first step in\
    \ this process is to create a file named event.js in the document directory, which\
    \ will represent our event schema.\n\n# The event schema\n\nThe following code\
    \ segment is the schema for an event, illustrating its various fields:\n\n```\n\
    export default {\n  name: 'event',\n  type: 'document',\n  title: 'Event',\n \
    \ fields: [\n    {\n      name: 'name',\n      type: 'string',\n      title: 'Name'\n\
    \    },\n    {\n      name: 'dateAndTime',\n      type: 'datetime',\n      title:\
    \ 'Date and Time'\n    },\n    {\n      name: 'venue',\n      type: 'reference',\n\
    \      to: {type: 'venue'}\n    },\n    {\n      name: 'virtual',\n      type:\
    \ 'boolean',\n      title: 'Virtual Event'\n    },\n    {\n      name: 'eventUrl',\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 70
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 71
  md: "```\n{\n    name: 'location',\n    type: 'geopoint',\n    title: 'Location'\n\
    },\n{\n    name: 'telephone',\n    type: 'string',\n    title: 'Telephone'\n},\n\
    {\n    name: 'email',\n    type: 'string',\n    title: 'Email'\n},\n{\n    name:\
    \ 'website',\n    type: 'url',\n    title: 'Website'\n},\n]\n}\n```\n\nThe venue\
    \ schema also contains some useful field types, such as geopoint, which will allow\
    \ us to take advantage of the Google Maps API to automatically complete an address,\
