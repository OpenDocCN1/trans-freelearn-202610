- pgno: 213
  md: '# # 14 Deployment Using Netlify and Azure


    In the last chapter, we prepared our website for deployment. We added style to
    the components using Tailwind CSS. Lastly, we cleaned up the layout and refactored
    the code to components. Now, we can look more closely at the last component of
    the Jamstack used in this book: **Netlify**. Netlify is used as the default platform
    for the *Blog with Gatsby* example that was created at [https://sanity.io/create](https://sanity.io/create).
    At the time of writing this book, Microsoft has added the Static Web Apps service,
    providing yet another option for deployment. Since GitHub and Azure are both owned
    by Microsoft, there is an excellent integration between the Static Web Apps service
    and GitHub.


    This chapter first introduces the Netlify serverless continuous deployment hosting
    service, which automates many of the tasks that previously either needed to be
    developed or performed manually, and then demonstrates Azure Static Web Apps as
    an alternative for developers who may already be using Azure or who want to try
    this new service.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'The main topics that we will cover in this chapter are the following:


    +   - Introduction to Netlify

    +   - Netlify plugins

    +   - Advanced configuration through the netlify.toml file

    +   - Netlify deployment via the command line

    +   - Azure Static Web Apps deployment


    # Technical requirements


    To deploy the project on Netlify, you must have an account at https://www.netlify.com/.
    To deploy the project on Azure, you must create an account at https://azure.microsoft.com/en-us/.


    Additionally, a Terminal program is needed.


    # Introduction to Netlify


    Netlify, to someone who is new to web development, initially looks like a deployment
    and hosting platform.


    In fact, a Netlify website can be a simple static file web host. Using Netlify''s
    drag and drop feature, a folder of web files can be deployed as a real, functional,
    and hosted website in seconds, as shown:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_214_0.png)


    Figure 14.1 – Netlify''s drag and drop deployment interface


    However, while it is a place to host your website, it is so much more than that.


    Firstly, behind the scenes, when we initially created our Sanity and Gatsby-generated
    website, the code provided by Sanity and Gatsby Blog Template automatically runs
    it, thereby creating an integration between Sanity and Netlify.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Both Sanity Studio and the Gatsby-generated website were immediately built
    and hosted on Netlify’s server, and new versions of the website could be easily
    and automatically deployed as often as we wish. Through integration connecting
    Sanity’s management tool and Netlify, a new version of the website can be built
    when we change the contents within Sanity. Also, there is a hook or a trigger
    set up through GitHub that will automatically deploy a new version of the website
    whenever the Gatsby source code is pushed to GitHub.


    Secondly, Netlify is a serverless continuous delivery service built on top of
    Amazon Web Services (AWS). This means that all the infrastructure provided by
    AWS is automatically built into Netlify’s hosting ability. This means that there
    are servers located throughout the world, also referred to as the cloud, that
    deliver content in the fastest way possible to all website users.


    However, these two aspects are just the beginning of the story. Netlify can run
    many different types of code together through scripts, in several languages, during
    the build process to enhance your website, as shown in the following screenshot:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_215_0.png)


    Figure 14.2 – An excerpt of Netlify’s build output


    This is useful when there are pre-built pieces of code that are needed to build
    the static pages. For example, the PHP programming language can be used to extract
    or preprocess format data or even generate websites statically. Hence, the JavaScript
    programming language is not the only option during deployment.


    It is important to remember that code can only be run on Netlify at the time of
    deployment. Hence, a traditional content management system such as WordPress cannot
    run on Netlify since it requires server-side code to run on each page request.


    One nice feature is the ability to do an A/B test. This is accomplished by using
    two branches in GitHub. Let’s imagine that you would like to test the effect a
    particular color has on the performance of a button that website visitors need
    to click. You could have two different branches in GitHub configuring Netlify
    to randomly select one or the other.


    Another feature that Netlify provides is an easy way to insert code snippets into
    the header or body of a page. One example of this usage would be pasting the code
    snippet required for Google Analytics to work properly in the page.


    Next, let’s learn about ways to take advantage of what Netlify has to offer though
    their plugins.'
  merge: -1
  img_proc: true
- pgno: 216
  md: "# # Netlify plugins\n\nNetlify's plugin library automates many manual processes\
    \ and saves developers the effort of having to develop in-house solutions. This\
    \ growing library includes many plugins. For example, one plugin can fetch and\
    \ incorporate external resources such as RSS feeds. Another plugin can also generate\
    \ a sitemap or even index the website content to create a search functionality.\n\
    \n# ## HTML Minify\n\nThe plugin that we'll examine for the purpose of this book\
    \ compresses the HTML, reducing the file size by removing unnecessary page or\
    \ code contents, or substituting variable names with single-character replacements.\
    \ This process is called **minification**.\n\nWe would like to Minify the HTML\
    \ code as much as possible, so we could use Netlify's plugin called `netlify-plugin-minify-html`\
    \ to compress the file contents. When Gatsby builds the static pages, it minimizes\
    \ the content of the HTML files.\n\nThe following is an example of how the readable\
    \ source code would appear prior to minification:\n\n```\n```html\n<h1 hidden=\"\
    \">\n  Welcome to <!-- -->My new blog\n</h1>\n<div class=\"blog-post-preview-list-module--root--2LgdR\"\
    >\n  <h2 class=\"blog-post-preview-list-module--headline--3j8kB\">\n    Latest\
    \ blog posts\n  </h2>\n....\n```\n```\n\nOnce minification is performed, the total\
    \ file size is reduced. Here is how the HTML code appears following minification:\n\
    \n```\n```html\n<h1 hidden=\"\">Welcome to <!-- -->My new blog</h1><div class=\"\
    blog-post-preview-list-module--root--2LgdR\"><h2 class=\"blog-post-preview-list-module--headline--3j8kB\"\
    >Latest blog posts</h2>\n```\n```\n\nExtra spaces have been removed, but the `netlify-plugin-minify-html`\
    \ file is able to make the file size even smaller. Every character counts toward\
    \ the total amount of data on the page that needs to be transferred over the internet,\
    \ so this is a wonderful feature."
  merge: -1
  img_proc: true
- pgno: 217
  md: "The following steps will activate the Netlify Minify plugin:\n\n+   1.  Log\
    \ in to `https://netlify.com`. In the horizontal menu underneath the website name,\
    \ click on the **Plugins** link:\n+   \n+       Figure 14.3 – The horizontal menu\n\
    +   \n+   2.  Locate the Minify HTML plugin and click on the gray **Install**\
    \ button.\n+   \n+   3.  Then, choose the project website (the name usually ends\
    \ in `~web`):\n+   \n+       Figure 14.4 – The Netlify Minify plugin installation\
    \ screen\n+   \n+   4.  When asked **Are you sure you want to install Minify HTML**,\
    \ click the green **Install** button.\n+       Now, at this point, the Netlify\
    \ web interface should return you to the plugins page for the website. **Minify\
    \ HTML** should be displayed.\n+   \n+   5.  Next, in the horizontal menu underneath\
    \ the website name, click on the **Deploys** link.\n+   \n+   6.  On the right\
    \ side of the interface, click on the gray **Trigger deploy** button, which will\
    \ display a menu, and then the **Deploy site** menu item, as shown in *Figure\
    \ 14.5*:\n+   \n+       Figure 14.5 – The Trigger deploy menu\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_217_0.png)\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_217_1.png)\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_217_2.png)\n\
    \nThis will build and deploy a new version of the website. The **Deploy in Progress**\
    \ page will display a log where the output will be displayed."
  merge: -1
  img_proc: true
- pgno: 218
  md: "The log output is extremely useful for learning about what is performed during\
    \ deployment and whether there are any warnings or errors. The Netlify deployment\
    \ will be stopped if there are any errors to ensure that no website will be deployed.\n\
    \nThe following is the code once Netlify Minify HTML is executed:\n\n```\n<h1\
    \ hidden>Welcome to My new blog</h1><div class=blog-post-preview-list-module--root--2LgDr><h2\
    \ class=blog-post-preview-list-module--headline--3j8kB>Latest blog posts</h2>\n\
    ```\n\nCompare this to the minified code earlier in this chapter. Netlify Minify\
    \ HTML removes the quotation marks when the HTML tag attribute is a continuous\
    \ string (without spaces) and also removes comments, so <!-- --> is removed. The\
    \ final result is a smaller file. This is just one example of the many ways whereby,\
    \ as a result of using Netlify plugins, we can improve the resultant static content\
    \ and enhance its functionality. Exploring the plugins will open up many new possibilities.\n\
    \nNext, we will begin to explore, more deeply, the configuration options available\
    \ for Netlify's features.\n\n# Advanced configuration through the netlify.toml\
    \ file\n\nWhile the Netlify web interface is easy to use, for more control over\
    \ the deployment process, a netlify.toml file can be used, which uses Tom's Obvious,\
    \ Minimal Language format.\n\nLet's now learn how to create and use this configuration\
    \ file to access the advanced features of Netlify.\n\nCreate a file in the project's\
    \ root directory named netlify.toml. Here is an example of the file contents:\n\
    \n```\n[[plugins]]\n  package = \"netlify-plugin-minify-html\"\n\n  # Specify\
    \ which deploy contexts we'll minify HTML in.\n  # Supports any Deploy Contexts\
    \ available in Netlify.\n  # https://docs.netlify.com/site-deploys/overview/#deploy-contexts\n\
    \  [plugins.inputs]\n    contexts = [\n```"
  merge: -1
  img_proc: true
- pgno: 219
  md: "```\n```toml\n'production',\n'branch-deploy',\n'deploy-preview'\n]\n\n[plugins.inputs.minifierOptions]\n\
    \    removeComments = false\n    collapseInlineTagWhitespace = false\n```\n```\n\
    \nThe [[plugins]] annotation is used for each plugin. Next, [[plugins.inputs]]\
    \ is used to determine the contexts for which the plugin will be activated. For\
    \ example, when developing locally, Minify is usually not required, so the plugin\
    \ will only be triggered in just the production and preview contexts.\n\nNext,\
    \ the [plugins.inputs.minifierOptions] section of the plugin configuration allows\
    \ us to customize the plugin even more. Since, by default, removeComments is set\
    \ to true, this option can be set to false by using the removeComments = false\
    \ option.\n\nWe may use the Netlify command-line tool once again, but this time\
    \ by typing the following command in the project's root directory:\n\n```\n```shell\n\
    netlify build\n```\n```\n\nThe preceding command triggers the build locally, combining\
    \ the netlify.toml configuration and the plugins that are configured in Netlify's\
    \ plugin list for the website.\n\nHere is the relevant excerpt from the output\
    \ of netlify build:\n\n```\n```text\n┌──────────────────────────────────────────────────────────────┐\n\
    │ 2. onSuccess command from netlify-plugin-minify-html         │\n└──────────────────────────────────────────────────────────────┘\n\
    \nMinifying HTML in the deploy context: production\nMinifying HTML with these\
    \ options: { removeComments: false }\n\n(netlify-plugin-minify-html onSuccess\
    \ completed in 259ms)\n\n┌───────────────────────────────┐\n│       Netlify Build\
    \ Complete  │\n└───────────────────────────────┘\n\n(Netlify Build completed in\
    \ 19.8s)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 220
  md: "In this section, we've learned how to use the Netlify configuration file. Next,\
    \ we will learn how to build and deploy Netlify using the command line.\n\n# ##\
    \ Netlify deployment via the command line\n\nNetlify's command-line tool also\
    \ provides a nice way to preview the site without deploying it once the `netlify\
    \ build` command is run.\n\nIn the Terminal, type the following command:\n\n```\n\
    `netlify deploy`\n```\n\nThe output will be similar to the following:\n\n```\n\
    ```\nDeploy path:\t/home/chris/jumpstart-jamstack/web/public\nConfiguration path:\
    \ /home/chris/jumpstart-jamstack /netlify. toml\n\nDeploying to draft URL...\n\
    Finished hashing 49 files\nCDN requesting 0 files\nFinished uploading 0 assets\n\
    Draft deploy is live!\n\nLogs:\t\thttps://app.netlify.com/sites/jumpstart- jamstack-web/deploys/5f3cad51bdd06713f5250887\n\
    Website Draft URL: https://5f3cad51bdd06713f5250887--jumpstart- jamstack-web.netlify.app\n\
    \nIf everything looks good on your draft URL, deploy it to your main site URL\
    \ with the --prod flag.\nnetlify deploy --prod\n```\n```\n\nAs the command's output\
    \ reveals, a Draft deploy preview URL is made available so that the production\
    \ website may be viewed without deploying it. In the example, this is `https://5f3cad51bdd06713f5250887--jumpstart-jamstack-web.\
    \ netlify.app`.\n\n`--open` is another useful flag that can be added. This will\
    \ open the URL in the default browser. The relevant command would be as follows:\n\
    \n```\n`netlify deploy --open`\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Finally, as the output also states, by adding the --prod flag, deploy will
    be deployed and replace the current version in production if the deployment succeeds.


    ```

    netlify deploy --prod

    ```


    Additionally, in order to open the URL in the browser, add the --open flag as
    before:


    ```

    netlify deploy --prod --open

    ```


    The output from this command will be similar to the following:


    ```

    Deploy path:          /home/chris/jumpstart-jamstack/hands-on-jamstack/web/public

    Configuration path: /home/chris/jumpstart-jamstack/hands-on-jamstack/netlify.toml

    Deploying to main site URL...

    Finished hashing 1 files

    CDN requesting 0 files

    Finished uploading 0 assets

    Deploy is live!

    Logs:                 https://app.netlify.com/sites/jumpstart-jamstack-web/deploys/5f3cb84fbdd067963e250875

    Unique Deploy URL: https://5f3cb84fbdd067963e250875--jumpstart-jamstack-web.netlify.app

    Website URL:         https://jumpstart-jamstack-web.netlify.app

    ```


    Unique Deploy URL provides a way to rollback to this particular deployment in
    the future, while Website URL, as expected, is the newly deployed version of the
    website.


    In this section, we have learned how to build and deploy on Netlify using the
    command line. Next, we will learn another way to deploy Jamstack websites using
    Azure.


    # Azure Static Web Apps deployment


    A preview of the Azure Static Web Apps service was introduced, placing yet another
    competitor in the Jamstack hosting and deployment space. The URL to try out this
    service can be found at https://azure.microsoft.com/en-us/services/app-service/static/.'
  merge: -1
  img_proc: true
