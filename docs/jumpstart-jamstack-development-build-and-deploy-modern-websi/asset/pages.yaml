- pgno: 125
  md: 'Adding the version with no character before the version will download that
    exact version if you have never installed the plugin in your app, or it will update
    the package to that very same version. Now, have a look at this code snippet:


    ```

    npm i birdie-hop@~1.2.3

    ```


    The tilde (~) tells npm that it can install or update the package to the latest
    patch release available. In this case, the version will be >1.2.3 and <1.3.0.
    Next, have a look at the following code snippet:


    ```

    npm i birdie-hop@^1.2.3

    ```


    The caret (^) tells npm that it can install or update the package to the latest
    minor release available. In this case, the version will be >1.2.3 and <2.0.0.
    Now, have a look at this code snippet:


    ```

    npm i birdie-hop@*1.2.3

    ```


    The asterisk (*) tells npm that it can install or update the package to any major
    version available. In this case, the version will be >1.2.3 and there is no limit
    on updates. Let''s move on to understanding how to update a plugin.


    By default, the packages are going under the dependencies array and will be required
    by your application in production. You can also set up packages that are only
    needed in your local development environment or on your testing environment, such
    as automated testing packages. This package will go under the devDependencies
    array in the packages.json file and can be added by adding the --save-dev flag,
    as follows:


    ```

    npm i birdie-hop --save-dev

    ```


    # Updating a plugin


    When a plugin releases an update, we can update our plugin via npm. To update
    all packages listed in the package.json file, run the following command:


    ```

    npm update

    ```


    To update a single package, run the following command:


    ```

    npm update <package_name>

    ```'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Here, <package_name> is the name of the package you want to update. If you
    want to update the `birdie-hop` package, you can run the following command:


    ```

    ```n

    pm update birdie-hop

    ```

    ```


    During updating or installation, npm will check the `package.json` file and download
    or update a plugin to the allowed version.


    # # The package.lock file


    When you are working in a team, you want all the developers in your team to use
    the same package versions. In this situation, the `package.lock` file comes in
    handy. It is automatically generated when you modify the `package.json` file or
    the `node_modules` folder. It lists all the exact versions of the packages the
    application should use. The `package.lock` file will avoid a situation where two
    developers in the same team working on the same project use two different versions
    of the `birdie-hop` package.


    In this section, we have explored the main components of a package. We learned
    where to find the packages and how to install them. We learned about package versioning
    and how to install and update a specific package to a specific version. We have
    also explored how `package.json` and `package.lock` files play an important role
    in making sure your application gets the right package with the right version.


    In the next section, we will install a package in our Gatsby application.


    # # Searching, installing, and configuring plugins


    In this section, we will explore the Gatsby public plugin repository. We will
    look at how to install a Gatsby plugin and where to find the configuration for
    the plugins you would like to install.


    We will install and configure the `gatsby-source-filesystem` and `gatsby-source-drupal`
    plugins and see how we can use them.


    # # The Gatsby Plugin Library


    Gatsby also provides a plugin library, a collection of npm packages tagged with
    the *Gatsby* keyword. In this library, it is possible to find standard plugins
    that will be used on most sites, related to **Search Engine Optimization (SEO)**,
    **Really Simple Syndication (RSS)**, social media buttons, third-party comment
    services, e-commerce integration, and more.'
