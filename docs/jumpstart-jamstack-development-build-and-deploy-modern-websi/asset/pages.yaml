- pgno: 205
  md: 'First, a space was added around each form element. Let’s quickly review what
    types of options exist to add space around an element. Each element in the HTML
    **Document Object Model (DOM)** has three surrounding components: the border,
    the margin, and the padding. In the simplest terms, margin is the spacing around
    an element and padding is the spacing inside of an element. border, as the name
    would suggest, is any of several ways to visually delineate an HTML element.


    The first of the styles we’ll examine is mt-10. This nomenclature is a bit different
    than in other CSS frameworks since both the m and the t have an atomic meaning.


    The m in Tailwind represents margin. Likewise, p is used for padding, t represents
    top, and so obviously, b represents bottom, r is right, and l is left. Additionally,
    y represents both the top and bottom, and x represents both the right and left
    sides. If m and p are used alone (m-10, for example), this usage represents the
    entire element, so space would be provided on all sides. This makes remembering
    which attribute to use quite easy, lending to the framework’s popularity.


    -10 represents 10 pixels. This will provide 10 pixels of needed space at the top
    of each form element to provide a cleaner appearance.


    Additionally, the Tailwind CSS block style is used to set a block-style layout.


    For the form input element, a text box, in this case, with the Tailwind form-input
    style, is used. This applies the following styles:


    +   - `background-color: #fff;`: White

    +   - `border-color: #e2e8f0; border-width: 1px; border-radius: 0.25rem;`: A lightly
    colored, 1-pixel input border with slightly rounded edges

    +   - `padding-right: 0.75rem; padding-left: 0.75rem;`: More space around the
    sides of the text

    +   - `padding-top: 0.5rem; padding-bottom: 0.5rem;`: More space around the top
    and bottom of the text

    +   - `line-height: 1.5;`: Sets the vertical text spacing

    +   - `font-size: 1rem;`: Sets the text size


    The w-full form input style instructs the form element to be at the full width
    of its container. As shown in the form, the **Your Full Name** and **Your Email
    Address** fields are half-width. Since the form should be responsive, the full
    width is used for these elements when the form is small, for example, when the
    browser is minimized horizontally, such as when a smartphone is used for viewing
    it. The following two styles work together to make this happen: sm:w-full and
    md:w-1/2.'
  merge: -1
  img_proc: true
