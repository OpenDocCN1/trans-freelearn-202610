- pgno: 78
  md: "# Technical requirements\n\nA web browser and terminal emulator are needed\
    \ for this chapter.\n\nThe code files for this chapter are placed at https://github.com/PacktPublishing/Jumpstart-Jamstack-Development/tree/chapter_five.\n\
    \n# Why GROQ?\n\nThe datastore is the most important part of what defines Sanity.\
    \ Sanity is built for structured content, which is richer than simple two-dimensional\
    \ tables. Likewise, GROQ is meant to be more powerful and easier to use than traditional\
    \ SQL, used to query a database. GROQ stands for Graph Oriented Query language,\
    \ so, as the name suggests, it is a query language used to query graphs, which\
    \ are able to represent more complex data structures.\n\nGROQ has four main features:\n\
    \n+   - **Expressive filtering:** This allows us to build the query using a speakable\
    \ syntax. If we are looking for a venue within our venues named Will's Pub, then\
    \ we will simply use the following expression, which equates to where the type\
    \ is venue and the (venue) name is Will's Pub:\n+   \n+     `_type== \"venue\"\
    \ && name==\"Will's Pub\"`\n+   - **Joins:** GROQ can join together several documents,\
    \ combining the result together.\n+   - **Shaping:** You can decide which content\
    \ fields to include or also rename the field names, reformat the resulting data\
    \ structure, and even do additional filters within a projection using the values\
    \ of the parent document.\n+   \n+     Even though this way of obtaining information\
    \ is quite a paradigm shift for many database developers who are familiar with\
    \ SQL databases, with experience GROQ can become very easy to use. Additionally,\
    \ since GROQ is open source, all the code can be examined.\n+   - **Compactness:**\
    \ GROQ is more compact and less verbose than standard SQL. The syntax is terser\
    \ in most cases – just as ES6 is terser than ES5.\n\n```\n_type== \"venue\" &&\
    \ name==\"Will's Pub\"\n```\n\nSanity Studio's toolbar is displayed at the top\
    \ of the page found at http://localhost:3333 by typing the following command in\
    \ the terminal while in the studio directory:\n\n```\nsanity start\n```"
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Two of the main tools – the **Dashboard** and **Desk** are automatically installed.
    To be able to try out GROQ with actual queries against a dataset, we will install
    a third tool, called **Vision**. Vision gives us a way to type in queries and
    instantly view the resulting dataset, optionally filtered and sorted. This will
    help us use GROQ inside of code.


    # Installing Vision


    To install Vision, take the following steps and use the terminal command line:


    +   1. Inside the `studio` folder, type the following command:


    ```

    sanity install @sanity/vision

    ```


    Upon successful installation, the **Vision** icon should be visible together with
    the other tools in your local Sanity Studio application:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_79_0.png)


    Figure 5.1 – The top navigation


    +   2. Click on the **Vision** icon and a screen will appear that will allow the
    user to execute GROQ queries:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_79_1.png)


    Figure 5.2 – The Vision screen for GROQ queries


    In the top navigation, the **DATASET** selector allows the user to select which
    dataset to use. The light-blue **Run query** button will perform the query. The
    **Listen** button will activate a mode where changes in the documents from the
    filter part of your GROQ query are output in real time in the **RESULT** section.'
