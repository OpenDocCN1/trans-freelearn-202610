  md: '# # 5


    # Sanity''s GROQ Language


    In this chapter, we are going to explore GROQ, Sanity''s open source query language.
    We will learn why GROQ was created and how to use GROQ and the Vision plugin to
    interact with our Sanity Studio dataset. We will also do a comparison between
    GROQ and SQL, and after that, we will run basic and advanced queries with GROQ.


    By learning what GROQ is and how to use it, we can then quickly begin to use it
    to write custom queries to obtain filtered and sorted data.


    We will cover the following topics in this chapter:


    +   - Why GROQ?

    +   - GROQ versus SQL

    +   - Basic queries with GROQ

    +   - Advanced GROQ'
  merge: -1
