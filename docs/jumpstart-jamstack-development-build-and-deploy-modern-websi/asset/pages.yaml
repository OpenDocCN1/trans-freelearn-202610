    \ on Sanity to let Netlify insert a new proposed event, and configured our Netlify\
    \ function folder.\n\nIn the next section, we are going to create a function that\
    \ inserts a new proposed event into our Sanity dataset.\n\n# Creating the submission-created.js\
    \ file\n\nNetlify form submission triggers a submission-created event. Execute\
    \ the following steps to create the .js file:\n\n+   1. Create a file inside web/functions\
    \ called submission-created.js. This function will handle submissions from the\
    \ Netlify form.\n+   2. Next, create export .handler for this function, as follows:\n\
    \n```\nexports.handler = async (event, context, callback) => {\n}\n```\n\nThis\
    \ handler receives an event object that contains path, httpMethod, headers, queryStringparameters,\
    \ body, and isBase64Encoded.\n\nThe context parameter includes information such\
    \ as user identity information. The callback parameter is similar to the callback\
    \ parameter in an AWS Lambda function. The code can be seen in the following snippet:\n\
    \n```\nexports.handler = function(event, context, callback) {\n    callback(null,\
    \ {\n    statusCode: 200,\n    body: \"Hello, World\"\n    });\n}\n```\n\nSanity\
    \ provides the Client API to add content via the API."
