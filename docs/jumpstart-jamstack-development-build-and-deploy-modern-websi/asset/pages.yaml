- pgno: 112
  md: "# GraphQL in GatsbyJS\n\nIn this section, we'll learn about how GraphQL is\
    \ used in the context of Gatsby. We will learn what the major difference is between\
    \ how GraphQL is used by Gatsby and how it is exposed by Sanity's GraphQL API.\n\
    \nGatsby's use of GraphQL is different from Sanity's since it uses the concept\
    \ of a graph to formulate its GraphQL queries. Let's learn what a graph is.\n\n\
    In the following diagram, the figure consists of nodes and edges:\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_112_0.png)\n\
    \nFigure 8.1 – A graph\n\nIn Gatsby's implementation of GraphQL, in reference\
    \ to the graph, each Sanity document is represented as a node. Recalling the GraphQL\
    \ query that was used in Chapter 6, Sanity's GraphQL Playground, to return all\
    \ events, this query was quite simple, as highlighted in the following code snippet:\n\
    \n```\n{\n  allEvent {\n    name\n  }\n}\n```\n\nIn Gatsby, we find that the corresponding\
    \ query to return all events has two main differences, as follows:\n\n+   - allSanityEvent\
    \ is used in place of allEvent. Sanity's developers created and officially maintain\
    \ the gatsby-source-sanity plugin. They have chosen to add this prefix to differentiate\
    \ Sanity documents from others, a technique sometimes called namespacing. Gatsby\
    \ endorses this as a good practice. Obviously, using GraphQL Playground on the\
    \ Sanity side means that only Sanity's content is being sourced, whereas in Gatsby\
    \ it is possible to use many different content sources at the same time."
  merge: -1
  img_proc: true
- pgno: 113
  md: "+   - The query needs to specify the edges and node parts to be able to return\
    \ each event, as shown in the following code example:\n\n```\nquery MyQuery {\n\
    \  allSanityEvent {\n    edges {\n      node {\n        name\n      }\n    }\n\
    \  }\n}\n```\n\nLikewise, since GraphQL is specifying not only the request format\
    \ but also the result format, results are returned encapsulated in an array of\
    \ edges and a node for each document, as follows:\n\n```\n{\n  \"data\": {\n \
    \   \"allSanityEvent\": {\n```\n\nLikewise, the results of the query also contain\
    \ the edges and nodes, as shown in the following code snippet:\n\n```\n{\n  \"\
    data\": {\n    \"allSanityEvent\": {\n      \"edges\": [\n        {\n        \
    \  \"node\": {\n            \"name\": \"The Appleseed Cast\"\n          }\n  \
    \      },\n        {\n          \"node\": {\n            \"name\": \"Friday Drinks\"\
    \n          }\n        }\n      ],\n    }\n  }\n```"
  merge: -1
  img_proc: true
