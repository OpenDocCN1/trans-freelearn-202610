  img_proc: true
- pgno: 189
  md: "The handler includes two functions: the `canHandle()` function checks whether\
    \ this handler can process this request by checking the type of request, and the\
    \ `handle()` function will process the request and return a response:\n\n```\n\
    ```\nconst MyCustomHandler = {\n    canHandle(handlerInput) {\n        return\
    \ Alexa.getRequestType(handlerInput.\nrequestEnvelope) === 'MyRequestType' &&\
    \ Alexa.\ngetIntentName(handlerInput.requestEnvelope) === 'MyIntent';\n    }\n\
    };\n```\n```\n\nIn our `canHandle()` function, we get the request type and the\
    \ request name using the `ask-sdk-core` API.\n\nIf both conditions are true, it\
    \ means that this handler can handle the request, so we implement the `handle()`\
    \ function:\n\n```\n```\nconst MyCustomHandler = {\n    canHandle(handlerInput)\
    \ {\n        return Alexa.getRequestType(handlerInput.\nrequestEnvelope) === 'MyRequestType'\
    \ && Alexa.\ngetIntentName(handlerInput.requestEnvelope) === 'MyIntent';\n   \
    \ },\n    handle(handlerInput) {\n        const speakOutput = 'This is my custom\
    \ text response';\n        return handlerInput.responseBuilder\n            .speak(speakOutput)\n\
    \            .getResponse();\n    }\n};\n```\n```\n\nIn this simple example, we\
    \ are just returning a text. The response we built using the `responseBuilder()`\
    \ function passes the text to the `speak()` function and the `getResponse()` function\
    \ will build the response."
  merge: -1
  img_proc: true
