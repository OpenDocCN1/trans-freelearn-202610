    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_39_1.png)


    Figure 2.7 – Sanity.io Manage landing page


    Click on the project''s rectangular block, and let''s have a look at the project
    pages.


    # Sanity.io project pages


