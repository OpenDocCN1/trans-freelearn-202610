- pgno: 238
  md: 'Also, a set of tools for importing HTML content from other content management
    systems into Sanity may be used to convert it into a format that Sanity will use
    as portable text at https://www.npmjs.com/package/@sanity/block-tools.


    # Plugins


    Sanity also has a series of plugins, both official and community contributed,
    located at https://www.sanity.io/plugins:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_238_0.png)


    Figure 15.2 - Gatsby plugins


    Plugins should be tested, uploaded as a package to https://www.npmjs.com, and
    then shared in #I-made-this channel in Sanity''s Slack.


    # The future


    Sanity Studio has added a feature called presence, which shows the document modification
    history, which allows users to compare any revision and revert any field.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'Here is a screenshot of this new functionality:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_239_0.png)


    Figure 15.3 – Presence in Sanity Studio


    # Contributing to Gatsby


    Next, we''ll show how to contribute to Gatsby. Gatsby is the most open source
    product in this version of the Jamstack.


    # The Gatsby community


    The Gatsby community uses several means of communication.


    DEV, a software developer community, has a Gatsby community located at https://dev.to/t/gatsby,
    as well as a hashnode URL, https://hashnode.com/n/gatsby, and there is a Gatsby
    Discord located at https://gatsby.dev/discord, which is very full and active.


    # Gatsby repositories


    Gatsby''s GitHub URL is located at https://github.com/gatsbyjs.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'Contributing to the Gatsby community has an added incentive: if a pull request
    gets accepted, the Gatsby community currently gives points that may be redeemed
    for swag such as a t-shirt or a water bottle.


    There are many separate repositories. For example, starter themes similar to the
    theme used for the example in this book have names beginning with **gatsby-starter**
    and are located at https://github.com/gatsbyjs/gatsby-starter-theme.


    These are good starting points to learn how Gatsby can be used with different
    parts of the Jamstack ecosystem.


    # Gatsby plugins


    Gatsby plugins were discussed earlier in this book. Plugins can be created for
    Gatsby by the community.


    # Contributing to Netlify


    Lastly, let''s look at how to contribute to Netlify.


    # The Netlify community


    Netlify is one of the largest parts of the Jamstack ecosystem. The Netlify community
    is found at https://community.netlify.com. The Netlify GitHub is located at https://github.com/netlify.


    # Netlify plugins


    Netlify plugins, similar to the plugin that we tested in *Chapter 14, Deployment
    Using Netlify and Azure*, may be created and contributed following the guidance
    provided in the repository located at https://github.com/netlify/plugins.


    # Final thoughts


    We are proud to have added this book to the Jamstack ecosystem and hope that it
    will be remembered as one of the first books to be released on the topic. We encourage
    you to add to the growing ecosystem and await contributions. Thank you immensely
    for having participated in our project and we wish you the best of fortune during
    your learning adventure and career.'
  merge: -1
  img_proc: true
