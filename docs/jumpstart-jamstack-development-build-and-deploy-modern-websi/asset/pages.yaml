- pgno: 156
  md: 'The code files for this chapter can be found at `https://github.com/PacktPublishing/Jumpstart-Jamstack-Development/tree/chapter_eleven`.


    # Introduction to APIs


    APIs have been around almost since we started programming. Modern APIs started
    to become as we know them now in the early 2000s, when companies such as Amazon
    started to provide access to their data through **HyperText Transfer Protocol
    (HTTP)** requests. These companies changed the way we did business online. Developers
    could now get and post user information from services such as Salesforce and provide
    a full e-commerce experience on their application using APIs.


    In 2004, with the introduction of social networks, we changed the way we were
    using the internet. Companies such as Facebook and Twitter started developing
    their own APIs. Similar to the e-commerce experience, developers could now get
    a user''s profile information, events, and pictures from social networking applications.


    A few years later, the new generation of smartphones came out. People started
    navigating the internet through their mobile phones and developers started developing
    applications that could be installed on a smartphone, and APIs were the right
    way to connect to these services. Instagram changed the way we were sharing photos
    on the internet and provided their own API a few years later.


    Around 2010, we had desktop and smartphone devices consuming APIs and relying
    on third-party web services through web applications and mobile applications and,
    around 2015, more devices got *smarter*. Every device that could connect to the
    internet could access the API resources of a web service. Smart speakers, thermostats,
    watches, and many other devices started consuming APIs.


    Amazon Alexa, Google Nest, Fitbit, and Apple Watch are just a few of many devices
    we now use every day that can get data from APIs.


    Let''s explore the Gatsby API in the next section.


    # Gatsby – APIs


    In this section, we are going to explore how to use APIs inside Gatsby. In the
    example that we will build in this chapter, we will create an event form whereby
    anonymous users can propose their event. When the user submits the form, we will
    add the submission to Sanity via an API.'
  merge: -1
  img_proc: true
