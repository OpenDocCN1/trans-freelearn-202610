    \ content from the two different sources, in the same query result.\n\n# ## Summary\n\
    \nIn this chapter, we learned how to extend Gatsby using plugins to enrich the\
    \ functionality of the application. We learned about the following: what a plugin\
    \ is; npm; how to use semantic versioning; and how to install and update a plugin.\
    \ We also learned about the structure of the Gatsby Plugin Library and how to\
