    \ code segment is the schema for an event, illustrating its various fields:\n\n\
    ```\nexport default {\n  name: 'event',\n  type: 'document',\n  title: 'Event',\n\
    \  fields: [\n    {\n      name: 'name',\n      type: 'string',\n      title:\
    \ 'Name'\n    },\n    {\n      name: 'dateAndTime',\n      type: 'datetime',\n\
    \      title: 'Date and Time'\n    },\n    {\n      name: 'venue',\n      type:\
    \ 'reference',\n      to: {type: 'venue'}\n    },\n    {\n      name: 'virtual',\n\
    \      type: 'boolean',\n      title: 'Virtual Event'\n    },\n    {\n      name:\
    \ 'eventUrl',\n```"
