  - "[PAGE 63]\n\n# Examining the schemas folder\n\nNext, we shall examine the `schemas`\
    \ folder in the `studio` folder. In the two subfolders – `documents` and `objects`,\
    \ we will find a collection of files, one per schema. Each one is a JavaScript\
    \ file with a single object. The following code example shows a schema file format\
    \ with minimal fields:\n\n```\nexport default {\n\tname: 'siteSettings',\n\ttype:\
    \ 'document',\n\ttitle: 'Site Settings',\n}\n```\n\nThe file begins with the `export`\
    \ keyword. The `export` keyword means that this JavaScript module may be used\
    \ in the calling file by using the `import` statement. The next keyword is `default`.\
    \ This keyword means that this single object will be used. Finally, the object\
    \ itself follows, using the opened and closed parentheses. The three essential\
    \ attributes in the object, which are key and value attribute pairs, are `name`,\
    \ `title`, and `type`.\n\n# name\n\nThe `name` attribute used in schemas always\
    \ represents a single entity. The `name` value must be a single word, and per\
    \ convention should match the name of the file, but without the extension, of\
    \ course.\n\n**Camel case**, named as such because of the animal that it most\
    \ looks like, is used. The standard format is as follows: the first word is represented\
    \ as lowercase, and the second word and words that follow are capitalized. For\
    \ example, a correct `name` attribute value would be `siteSettings`.\n\n# title\n\
    \nThe next important attribute is `title`. This attribute is meant to be a human-readable\
    \ description of the schema entity and may contain spaces and other special characters.\
    \ It is displayed inside Sanity Studio. Therefore, it should be a word that clearly\
    \ defines what it represents. For example, the corresponding title could be `Site\
    \ Settings`."
  - "[PAGE 64]\n\n# type\n\nNext, the schema type determines whether the schema is\
    \ a document or object. A document is what will be listed in the main navigation\
    \ of Sanity Studio. An object is a more abstract representation of an entity,\
    \ such as a relationship between two documents or a building block to be used\
    \ within a document, such as an address block containing several fields, such\
    \ as address, city, and postal code.\n\nThe default project that is automatically\
    \ created uses the two directories – documents and objects, to help organize the\
    \ project by grouping the schemas by type.\n\n# Author schema\n\nFor the next\
    \ step, examine the structure of the `author.js` file in the documents directory.\n\
    \n# Schema definition\n\nAs shown in the following code sample, the fields attribute\
    \ is an array. The use of square brackets is a syntax to denote a list or collection\
    \ of items. To begin with, the list of items is empty. It will be filled to contain\
    \ a list of fields:\n\n```\nexport default { \n    name: 'author',\n    type:\
    \ 'document',\n    title: 'Author',\n    fields: [\n    ],\n    }\n\n```\n\nAll\
    \ entities must contain at least one field. Each object within the fields array\
    \ follows the same format as the entity itself, at a minimum name, title, and\
    \ type.\n\n# Schema fields\n\nPossibly the simplest example of this would be a\
    \ name field, which represents the first and last name of the author:\n\n```\n\
    export default { \n    name: 'author',\n    type: 'document',\n    title: 'Author',\n\
    \n```"
  - "[PAGE 65]\n\n```\n```javascript\nfields: [\n  {\n    name: 'name',\n    type:\
    \ 'string',\n    title: 'Name'\n  },\n]\n}\n```\n```\n\nIn the preceding code\
    \ example, we have placed the name attributes inside of the `fields` array. This\
    \ array is of a string type, which basically means a short phrase or label without\
    \ any associated formatting such as bold italics.\n\n> **Note**\n> \n> The `title`\
    \ attribute should represent a word or phrase that a content editor could recognize\
    \ and will be displayed in Sanity Studio.\n\nThere are three other attributes\
    \ that can be used in each field:\n\n+   - `description` is a longer description\
    \ of how the field should be used.\n+   - `readOnly` disables editing in Sanity\
    \ Studio.\n+   - `hidden` hides the field from Sanity Studio.\n\nThe readOnly\
    \ and hidden fields would be modified programmatically and not by the person using\
    \ the interface.\n\n# Schema field types\n\nThere is a wide range of types available\
    \ for use. At the time of writing, the following types, other than document, are\
    \ available:\n\n+   - Array\n+   - Block\n+   - Boolean\n+   - Date\n+   - Datetime\n\
    +   - File\n+   - Geopoint"
