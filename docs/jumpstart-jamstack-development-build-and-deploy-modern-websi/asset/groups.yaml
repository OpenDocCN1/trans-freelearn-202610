    Using the basic instructions located at https://www.sanity.io/docs/starter-templates,
    we easily created https://github.com/chrispecoraro/sanity-template-jigsaw-blog,
    which uses Jigsaw, a popular Static Site Generator (SSG) created by Tighten, and
    is based on the Laravel modern PHP Framework, and the Blade templating system.


    The Sanity create page can be called by using the following format, where template
    is a parameter and chrispecoraro/sanity-template-jigsaw-blog is the GitHub repository:
    https://www.sanity.io/create?template=chrispecoraro/sanity-template-jigsaw-blog.


    The community templates are located at this page near the bottom: https://www.sanity.io/create:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_237_0.png)


    Figure 15.1 – Sanity starter kits


    # Migration and integration


    Integrating Sanity with other code bases is easy, thanks to a set of tools available
    to present portable text in different usable formats, such as hyperscript and
    Markdown and libraries for PHP and .NET: https://www.sanity.io/docs/presenting-block-text.'
  - '[PAGE 238]


    Also, a set of tools for importing HTML content from other content management
    systems into Sanity may be used to convert it into a format that Sanity will use
    as portable text at https://www.npmjs.com/package/@sanity/block-tools.


    # Plugins


    Sanity also has a series of plugins, both official and community contributed,
    located at https://www.sanity.io/plugins:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_238_0.png)


    Figure 15.2 - Gatsby plugins


    Plugins should be tested, uploaded as a package to https://www.npmjs.com, and
    then shared in #I-made-this channel in Sanity''s Slack.


    # The future


    Sanity Studio has added a feature called presence, which shows the document modification
    history, which allows users to compare any revision and revert any field.'
