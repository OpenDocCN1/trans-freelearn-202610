  mdcn: "\n第 12 章，API – Alexa 技能，将教你如何构建 Jumpstart Jamstack Alexa 技能。作为一个示例，你可以询问即将到来的五个事件。通过这个示例，你可以通过检索过去的事件或所有事件来扩展当前的技能，你还可以为任何其他应用程序创建一个新的技能。\n\
