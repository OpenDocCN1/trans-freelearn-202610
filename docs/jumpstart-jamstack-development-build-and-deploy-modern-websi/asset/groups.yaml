    ```

    "name":"IT Conference"

    "venue":{

    "_ref":"65929c5e-f2df-4483-b2e4-4f10a654adf8"

    "_type":"reference"

    }

    }

    1:{...}

    2:{...}

    ]

    ```


    Note that the results are wrapped in result. They are represented by a zero-based
    array and there are three results, so 0, 1, and 2.


    Notice that the id is a Universally Unique Identifier (UUID). This allows for
    the document to be unique throughout the entire dataset, unlike a database table
    index, which gets indexed starting with 1, but it is only unique within that single
    table.


    The _rev key is the identifier of the revision, or version, of this document.


    Since venue is a related document, the _ref is the reference to the _id of the
    document. Note that venue is nested and represents a complete document.


    # Selecting all upcoming events


    In this query, we are going to select all upcoming events by adding the dateAndTime
    condition:


    ```

    *[_type == "event" && dateAndTime >= now()] | order

    (dateAndTime asc)

    ```


    We pass the current date value using the now() function, which returns the current
    date. We could also have passed the dateAndTime value as a string with the YYYY-MM-DD
    format.


    We are also ordering the result by date. We will show all upcoming events starting
    from the closest event.'
  - '[PAGE 84]


    # Selecting all past events


    As for upcoming events, we are using the now() function to get the current date
    value and get all past events:


    ```

    *[_type == "event" && dateAndTime < now()] | order (dateAndTime asc)

    ```


    It will order the results by date starting from the closest.


    # Selecting upcoming virtual conference and non-virtual conferences


    Our previous query returned all events by date but was not filtered by the Virtual
    Conference field. Our Virtual Conference field in the Event schema is a Boolean.
    We can add the condition to our GROQ query setting virtual == true if the event
    is virtual or virtual == false if the event is not virtual:


    +   - Select virtual events:


    ```

    *[_type == "event" && dateAndTime >= now() && virtual == true] | order (dateAndTime
    asc)

    ```


    +   - Select non-virtual events:


    ```

    *[_type == "event" && dateAndTime >= now() && virtual == false] | order (dateAndTime
    asc)

    ```


    We have seen how to select all of the fields from the dataset schema. Next, we
    will learn how to select specific fields to make the result size smaller.


    # Selecting specific event fields


    The results will depend on where we show the content. We may not need all the
    fields, but rather only certain fields. With this query, we receive only the name,
    dateAndTime, and body fields for all upcoming events.


    We pass the field names in the projection:


    ```

    *[_type == "event" && dateAndTime >= now()] | order (dateAndTime asc) | {name,
    dateAndTime, body}

    ```'
