    \ as weather, video, and audio.\n\nNow that we have created our custom intent,\
    \ we can start adding our utterances.\n\nA user may ask, *Alexa, ask jumpstart\
    \ jamstack for the upcoming events*, or *Alexa, ask jumpstart jamstack to tell\
    \ me the upcoming events*.\n\nWe can add as many utterances as we would like.\
    \ For this example, let’s add the following utterances:\n\n- list me the upcoming\
    \ events\n- tell me the upcoming events\n- what are the upcoming events\n\nTo\
    \ add an utterance, execute the following steps:\n\n1. Write it in the **Sample\
    \ Utterances** textbox and then press the **+** button on the right of the textbox.\
    \ If you don't click on the **+** button, the utterance will not be added:\n\n\
    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_183_0.png)\n\nFigure 12.13 - Alexa skill\
    \ interface Intents page\n\nNow you should have three utterances added to your\
    \ intent.\n\n2. Click on the **Save Model** button above the **Intents** form\
    \ and then click on **Build Model** beside the **Save Model** button:\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_183_1.png)\n\
    \nFigure 12.14 - Alexa skill interface Intents page\n\nNow our Intent has been\
    \ added and the model has been built and is ready to be used in our Alexa service.\n\
    \nIn this section, we have created a new intent to retrieve our events and we\
    \ have rebuilt the model to activate the new intent. In the next section, we will\
    \ check the intent history.\n\n## Intent history\n\nClicking on the Intent History\
    \ link on the left-hand side menu, you can check all the frequent intent requests\
    \ done to your skill in the last 30 days. You can check Unresolved Utterances\
    \ and Resolved Utterances. From here, you can improve your intent utterances:\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_184_0.png)\n\nFigure 12.15 – Alexa\
    \ skill Intent History page\n\n## Utterance conflicts\n\nClicking on Utterance\
    \ Conflicts on the left-hand side menu, you can see whether there are conflicting\
    \ utterances between intentions:\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_184_1.png)\n\
    \nFigure 12.16 – Alexa skill Utterance Conflicts page\n\n## JSON Editor\n\nClicking\
    \ on JSON Editor on the left-hand side menu, you can also create intents via JSON\
    \ code. This is useful when you want to import an existing intent quickly from\
    \ another skill:\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_185_0.png)\n\n##\
    \ Slot types\n\nSlots can see a variable passed via an utterance. By default,\
    \ Amazon provides many slot types, such as number, city, and country, that are\
    \ recognized by Alexa. You can also create a custom slot type and process it at\
    \ your convenience.\n\nAn example of a slot type can be found in a weather skill\
    \ when you enquire about the weather in a particular city.\n\nIn your WeatherByCity\
    \ intents, you don't need to add an utterance for each city in the world, and\
    \ you can pass it as a variable:\n\n### Slot Types\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_186_0.png)\n\
    \nFigure 12.18 – Alexa skill Slot Types page\n\n## Endpoint\n\n**Endpoint** will\
    \ receive the JSON payload request. We can leave the default here as we are using\
    \ an AWS Lambda function.\n\nIf you want to host your Alexa service somewhere\
    \ other than AWS, you can select the **HTTPS** option:\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_187_0.png)\n\
    \nFigure 12.19 – Alexa skill Endpoint page\n\n## Code\n\nNow that we have explored\
    \ the Build section, let's jump to the Alexa service part, which is our Node.js\
    \ code:\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_188_0.png)\n\nFigure 12.20\
    \ – Alexa skill Code page\n\nAs you can see, the interface provides a code editor\
    \ where we can implement our Alexa service.\n\nIn our index.js file, we can create\
    \ the handlers for our intent. Any new intent we add can be implemented here.\
    \ Alexa provides an API to handle the request. It's called the ask-sdk-core API.\
    \ The requests are inside the handlerInput JSON object.\n\nThe handler will process\
    \ our intent and, from here, will make the Sanity call to our Sanity dataset.\n\
    \nAt the top of our index.js file, we require ask-sdk-core:\n\n```\nconst Alexa\
    \ = require('ask-sdk-core');\n```\n\nThe handler includes two functions: the `canHandle()`\
    \ function checks whether this handler can process this request by checking the\
    \ type of request, and the `handle()` function will process the request and return\
    \ a response:\n\n```\nconst MyCustomHandler = {\n    canHandle(handlerInput) {\n\
    \        return Alexa.getRequestType(handlerInput.requestEnvelope) === 'MyRequestType'\
    \ && Alexa.getIntentName(handlerInput.requestEnvelope) === 'MyIntent';\n    }\n\
    };\n```\n\nIn our `canHandle()` function, we get the request type and the request\
    \ name using the `ask-sdk-core` API.\n\nIf both conditions are true, it means\
    \ that this handler can handle the request, so we implement the `handle()` function:\n\
    \n```\nconst MyCustomHandler = {\n    canHandle(handlerInput) {\n        return\
    \ Alexa.getRequestType(handlerInput.requestEnvelope) === 'MyRequestType' && Alexa.getIntentName(handlerInput.requestEnvelope)\
    \ === 'MyIntent';\n    },\n    handle(handlerInput) {\n        const speakOutput\
    \ = 'This is my custom text response';\n        return handlerInput.responseBuilder\n\
    \            .speak(speakOutput)\n            .getResponse();\n    }\n};\n```\n\
    \nIn this simple example, we are just returning a text. The response we built\
    \ using the `responseBuilder()` function passes the text to the `speak()` function\
    \ and the `getResponse()` function will build the response.\n\nThe first handler\
    \ we found in our file is LaunchRequestHandler. This handler is called when you\
    \ open the skill with the command *Alexa, open jumpstart jamstack:*\n\n```javascript\n\
    const LaunchRequestHandler = {\n    canHandle(handlerInput) {\n        return\
    \ Alexa.getRequestType(handlerInput.requestEnvelope) === 'LaunchRequest';\n  \
    \  },\n    handle(handlerInput) {\n        const speakOutput = 'Welcome, you can\
    \ say Hello or Help. Which would you like to try?';\n        return handlerInput.responseBuilder\n\
    \            .speak(speakOutput)\n            .reprompt(speakOutput)\n       \
    \     .getResponse();\n    }\n};\n```\n\nIt will return the message, *Welcome,\
    \ you can say Hello or Help. Which would you like to try?*\n\nLet's change the\
    \ message to make it related to our skill. Replace it with Welcome to the jumpstart\
    \ jamstack skill, and you can say, tell me the upcoming events or Help. Which\
    \ would you like to try?\n\nSo, our LaunchRequest handler will be as follows:\n\
    \n```javascript\nconst LaunchRequestHandler = {\n    canHandle(handlerInput) {\n\
    \        return Alexa.getRequestType(handlerInput.requestEnvelope) === 'LaunchRequest';\n\
    \    },\n    handle(handlerInput) {\n        const speakOutput = 'Welcome to the\
    \ jumpstart jamstack skill, you can say tell me the upcoming events or Help. Which\
    \ would you like to try?';\n\n        return handlerInput.responseBuilder\n  \
    \          .speak(speakOutput)\n            .reprompt(speakOutput)\n         \
    \   .getResponse();\n```\n"
  mdcn: "\n\n## 调用\n\n调用名称是我们与技能交互时需要使用的关键词。我们的调用名称是 `jumpstart jamstack`，因此我们可以说：Alexa，打开\
    \ jumpstart jamstack：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_180_0.png)\n\
    \n图 12.10 – Alexa 技能界面：调用选项卡\n\n## 交互模型\n\n在交互模型中，我们可以设置意图（intent）和话语（utterance）。任何\
    \ Alexa 技能都会创建以下四个默认的内置意图：\n\n- `CancelIntent`\n- `HelpIntent`\n- `StopIntent`\n\
    - `NavigateHomeIntent`\n\n`CancelIntent` 和 `StopIntent` 类似，当你想停止交互时会被调用。例如，当 Alexa\
    \ 正在为你朗读新闻时，你可以说“Alexa，停止”，Alexa 就会停止朗读新闻；或者当你通过 Alexa 听音乐时，想停止播放时，就会调用 `StopIntent`\
    \ 和 `CancelIntent`。\n\n当你想了解更多关于某个技能以及有哪些可用话语时，会使用 `HelpIntent`。\n\n当你使用一个多层级技能并想返回该技能的顶层菜单时，会使用\
    \ `NavigateHomeIntent`。\n\n在我们的意图列表中，还有默认的 HelloWorldIntent，它包含七个话语。现在让我们添加 GetUpcomingEventIntent：\n\
    \n1. 点击意图列表上方的蓝色“添加意图”（Add Intent）按钮：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_181_0.png)\n\
    \n2. 在我们的 **创建自定义意图** 部分，将意图名称添加为 GetUpcomingEventsIntent。然后，点击蓝色的 **创建自定义意图**\
    \ 按钮：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_182_0.png)\n\nAmazon 还提供了一组可用于特定技能的意图，例如天气、视频和音频。\n\
    \n既然我们已经创建了自定义意图，就可以开始添加话语了。\n\n用户可能会问：*Alexa，询问 jumpstart jamstack 即将发生的事件*，或者\
    \ *Alexa，让 jumpstart jamstack 告诉我即将发生的事件*。\n\n我们可以添加任意数量的话语。对于这个示例，让我们添加以下话语：\n\
    \n- 列出即将发生的事件\n- 告诉我即将发生的事件\n- 有哪些即将发生的事件\n\n要添加话语，请执行以下步骤：\n\n1. 在 **示例话语** 文本框中写入话语，然后按下文本框右侧的\
    \ **+** 按钮。如果不点击 **+** 按钮，话语就不会被添加：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_183_0.png)\n\
    \n图 12.13 – Alexa 技能界面：意图页面\n\n现在你的意图中应该已经添加了三个话语。\n\n2. 点击 **意图** 表单上方的 **保存模型**\
    \ 按钮，然后点击 **保存模型** 按钮旁边的 **构建模型** 按钮：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_183_1.png)\n\
    \n图 12.14 – Alexa 技能界面：意图页面\n\n现在，我们的意图已添加，模型也已构建，可以在我们的 Alexa 服务中使用。\n\n在本节中，我们创建了一个新意图来检索事件，并重新构建了模型以激活新意图。在下一节中，我们将查看意图历史。\n\
    \n## 意图历史\n\n点击左侧菜单中的“意图历史”（Intent History）链接，你可以查看最近 30 天内对你的技能进行的所有频繁意图请求。你可以查看“未解决的话语”（Unresolved\
    \ Utterances）和“已解决的话语”（Resolved Utterances）。从这里，你可以改进你的意图话语：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_184_0.png)\n\
    \n图 12.15 – Alexa 技能“意图历史”页面\n\n## 话语冲突\n\n点击左侧菜单中的“话语冲突”（Utterance Conflicts），你可以查看意图之间是否存在话语冲突：\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_184_1.png)\n\n图 12.16 – Alexa 技能“话语冲突”页面\n\
    \n## JSON 编辑器\n\n点击左侧菜单中的“JSON 编辑器”（JSON Editor），你也可以通过 JSON 代码创建意图。当你想要快速从另一个技能导入现有意图时，这非常有用：\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_185_0.png)\n\n## 槽位类型\n\n槽位（Slot）可以接收通过话语传递的变量。默认情况下，Amazon\
    \ 提供了许多槽位类型，例如数字（number）、城市（city）和国家（country），Alexa 可以识别这些类型。你也可以创建自定义槽位类型，并方便地处理它。\n\
    \n槽位类型的一个例子可以在天气技能中找到，当你查询某个特定城市的天气时。\n\n在你的 WeatherByCity 意图中，你不需要为世界上的每个城市添加话语，你可以将其作为变量传递：\n\
    \n### 槽位类型\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_186_0.png)\n\n图 12.18 –\
    \ Alexa 技能“槽位类型”页面\n\n## 端点\n\n**端点** 将接收 JSON 负载请求。由于我们使用的是 AWS Lambda 函数，这里可以保留默认设置。\n\
    \n如果你想在 AWS 之外的其他地方托管 Alexa 服务，可以选择 **HTTPS** 选项：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_187_0.png)\n\
    \n图 12.19 – Alexa 技能“端点”页面\n\n## 代码\n\n现在我们已经探索了“构建”（Build）部分，让我们跳到 Alexa 服务部分，也就是我们的\
    \ Node.js 代码：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_188_0.png)\n\n图 12.20\
    \ – Alexa 技能“代码”页面\n\n如你所见，该界面提供了一个代码编辑器，我们可以在其中实现我们的 Alexa 服务。\n\n在我们的 `index.js`\
    \ 文件中，我们可以为意图创建处理程序。我们添加的任何新意图都可以在这里实现。Alexa 提供了一个 API 来处理请求，它被称为 ask-sdk-core\
    \ API。请求位于 handlerInput JSON 对象内部。\n\n处理程序将处理我们的意图，并由此对 Sanity 数据集发出 Sanity 调用。\n\
    \n在我们 `index.js` 文件的顶部，我们引入 ask-sdk-core：\n\n```\nconst Alexa = require('ask-sdk-core');\n\
    ```\n\n处理程序包含两个函数：`canHandle()` 函数通过检查请求类型来判断该处理程序是否能处理此请求；`handle()` 函数将处理请求并返回响应：\n\
    \n```\nconst MyCustomHandler = {\n    canHandle(handlerInput) {\n        return\
    \ Alexa.getRequestType(handlerInput.requestEnvelope) === 'MyRequestType' && Alexa.getIntentName(handlerInput.requestEnvelope)\
    \ === 'MyIntent';\n    }\n};\n```\n\n在我们的 `canHandle()` 函数中，我们使用 `ask-sdk-core`\
    \ API 获取请求类型和请求名称。\n\n如果两个条件都为真，则意味着该处理程序可以处理这个请求，因此我们实现 `handle()` 函数：\n\n```\n\
    const MyCustomHandler = {\n    canHandle(handlerInput) {\n        return Alexa.getRequestType(handlerInput.requestEnvelope)\
    \ === 'MyRequestType' && Alexa.getIntentName(handlerInput.requestEnvelope) ===\
    \ 'MyIntent';\n    },\n    handle(handlerInput) {\n        const speakOutput =\
    \ 'This is my custom text response';\n        return handlerInput.responseBuilder\n\
    \            .speak(speakOutput)\n            .getResponse();\n    }\n};\n```\n\
    \n在这个简单的示例中，我们只是返回一个文本。我们使用 `responseBuilder()` 函数构建响应，将文本传递给 `speak()` 函数，然后由\
    \ `getResponse()` 函数构建最终响应。\n\n我们在文件中遇到的第一个处理程序是 LaunchRequestHandler。当你使用命令 *Alexa，打开\
    \ jumpstart jamstack* 打开技能时，会调用该处理程序：\n\n```javascript\nconst LaunchRequestHandler\
    \ = {\n    canHandle(handlerInput) {\n        return Alexa.getRequestType(handlerInput.requestEnvelope)\
    \ === 'LaunchRequest';\n    },\n    handle(handlerInput) {\n        const speakOutput\
    \ = 'Welcome, you can say Hello or Help. Which would you like to try?';\n    \
    \    return handlerInput.responseBuilder\n            .speak(speakOutput)\n  \
    \          .reprompt(speakOutput)\n            .getResponse();\n    }\n};\n```\n\
    \n它将返回消息：*欢迎，你可以说 Hello 或 Help。你想尝试哪一个？*\n\n让我们更改这条消息，使其与我们的技能相关。将其替换为：欢迎使用 jumpstart\
    \ jamstack 技能，你可以说“告诉我即将发生的事件”或“帮助”。你想尝试哪一个？\n\n因此，我们的 LaunchRequest 处理程序如下：\n\
    \n```javascript\nconst LaunchRequestHandler = {\n    canHandle(handlerInput) {\n\
    \        return Alexa.getRequestType(handlerInput.requestEnvelope) === 'LaunchRequest';\n\
    \    },\n    handle(handlerInput) {\n        const speakOutput = 'Welcome to the\
    \ jumpstart jamstack skill, you can say tell me the upcoming events or Help. Which\
    \ would you like to try?';\n\n        return handlerInput.responseBuilder\n  \
    \          .speak(speakOutput)\n            .reprompt(speakOutput)\n         \
    \   .getResponse();\n```\n\n"
