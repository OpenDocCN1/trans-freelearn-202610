  mdcn: '


    ## 数据集


    在本部分中，你可以查看和删除数据集。数据集是数据的存储位置。一个项目可以根据需要拥有多个数据集。*开发者*（Developer）账户仅限于两个账户。


    ## 设置


    在本部分中，你可以管理当前项目的**常规设置**和**API**。


    **常规设置**包括以下内容：


    - **组织**

    - **项目名称**

    - **项目颜色**

    - **自定义 Studio URL**


    你还可以禁用或删除项目。当你禁用项目时，可以随时重新启用，不会丢失数据。


    当你删除项目时，与该项目相关的所有文档、资源和用户都将被移除。**请注意，此操作无法撤销。**


    在本部分中，你还可以查看和修改当前套餐。你可以根据自己的需求选择其他套餐。不过，对于本项目来说，免费套餐*开发者*（Developer）已绰绰有余，最多支持三个用户。


    接下来，让我们在以下小节中探索**API**设置。


    ### CORS Origins


    在本小节中，你可以添加和移除能够连接项目 API 的主机。`localhost:3333` 主机是自动添加的。`localhost:3333` 是本地开发环境的
    URL。托管在 Netlify 上的 Gatsby 应用 URL 和 Sanity Studio 应用 URL 也会自动添加到 **CORS Origins**
    列表中。


    这样，我们就允许本地开发环境和托管在 Netlify 上的应用访问我们的 Sanity API。


    每当我们想让一个新应用与 Sanity API 通信时，只需将该应用的 URL 添加到我们的 **CORS Origins** 列表中，如下所示：


    - **Token**：令牌用于机器人查询项目 API。

    - **Webhooks**：当某个操作被触发时，就会调用 Webhooks。例如，内容发生变化时，我们可以调用给定的 URL 执行操作，例如发送通知。


    既然我们已经知道如何更改应用程序的配置，接下来让我们看看如何通过 Sanity Studio 添加内容。


    # Sanity Studio 概述


    入门项目是一个博客网站，用户可以添加以下内容：


    - 博客文章

    - 作者

    - 分类


    在本书中，我们将通过创建一个新闻和活动网站来扩展此功能，添加新的内容类型和新的字段类型。


    我们将通过 Sanity Studio 管理应用程序设置和内容。


    在顶级菜单下方的 Sanity Studio 详细信息部分中，单击 **Studio** 链接。


    第一个屏幕包含 Sanity Studio 的 **Dashboard**（仪表板），其中有一些有用的小部件，我们现在就来探索它们。


    ## 导航


    从 **导航**菜单中，可以访问 Sanity Studio 的所有部分，如下面的屏幕截图所示：


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_42_0.png)


    单击铅笔标志将打开一个弹出窗口，你可以在其中选择添加**博客文章**、**作者**或**分类**。


    从 **搜索**字段中，你可以查找任何**博客文章**、**作者**和**分类**。


    **Dashboard** 和 **Desk** 是应用程序的两个主要部分。让我们详细讨论这些内容。


    ## Dashboard


    在 **Dashboard** 部分中，我们有分块显示的快捷方式，链接到 Sanity Studio 中包含的所有部分。


    ## 编辑你的内容


    通过此快捷方式，用户可以访问 **Desk** 部分的子页面，例如：


    - **设置**

    - **博客文章**

    - **作者**

    - **分类**


    ## Netlify 站点


    此块列出了为项目创建的 Netlify 站点。我们可以单击**查看**或**管理**来对我们的应用执行操作。如果任何网站内容发生更改，则可以单击**部署**按钮触发部署。


    **Sanity Studio** 是我们当前使用的应用程序，**博客网站**（Blog Website）是我们的博客应用程序。


    ## 项目信息


    此块列出了与 Sanity 项目相关的所有信息，如下所示：


    - 项目 ID

    - 数据集

    - 前端

    - GROQ

    - GraphQL

    - GitHub 仓库


    ## 项目用户


    与 **Sanity Manage** 页面的 **团队**部分类似，**项目用户**列出了当前项目的所有用户。


    ## 最近博客文章


    如块标题所示，这里将显示最近五篇博客文章的列表。单击每个博客文章标题将带你进入该特定博客文章的**编辑**页面。


    ## Desk


    在 Sanity Studio 的 **Desk** 部分中，可以管理设置和内容。


    ## 设置


    应用程序带有一些基本设置，我们将在本书中扩展这些设置。


    基本设置包括以下内容：


    - **标题**

    - **描述**

    - **关键字**

    - **作者**


    ## 博客文章


    **博客文章**是由作者创建的一段内容。它带有一些预配置的字段，例如：


    - **标题**

    - **Slug**

    - **发布于**

    - **主图**

    - **摘要**

    - **作者**

    - **分类**

    - **正文**


    ## 作者


    **作者**是内容（例如博客文章）的创建者。与**博客文章**类似，此部分具有预配置的字段，例如：


    - **姓名**

    - **Slug**

    - **图像**

    - **个人简介**


    ## 分类


    **分类**用于对内容进行分类。分类也可以用于在搜索时过滤内容。


    与**博客文章**和**作者**部分一样，它有一些预定义字段，即**标题**和**描述**。


    ## 总结


    在本章中，我们了解了 Sanity.io。通过 Sanity 的 **Create** 工具，我们使用 Sanity 用户界面创建了一个托管在 Netlify
    上的新应用程序，并将代码库托管在 GitHub 上。我们探索了如何管理 Sanity 应用程序以及 Sanity Studio 的 **Dashboard**
    功能。


    在下一章中，我们将探索示例内容，并学习如何使用 Sanity Studio 的 **Desk** 删除、修改和创建新内容。


    # 修改示例作者


    上一章中创建的示例作者仅仅是一个示例，因此我们将把作者修改并个性化设置为自己的姓名。请跟着我们使用 Sanity Studio 修改作者的每一步操作。


    ## 修改现有作者


    按照以下步骤了解如何完成此任务：


    1. 单击顶部导航栏中的 Desk 图标，如图所示：


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_48_0.png)


    图 3.1 – Sanity Studio


    Dashboard 提供了内容的广泛概览，而 Desk 提供了一种查看、创建、修改和删除项目内容的方式。


    2. 单击**内容**导航菜单（位于左侧）中的**作者**，如图所示：


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_49_0.png)


    图 3.2 – 作者导航菜单项


    3. 单击示例作者，本例中为**我的名字**（My Name）。


    4. 将**姓名**改为你的真实姓名。这里以 **Christopher John Pecoraro** 为例。


    5. 单击**生成**按钮生成新的 slug。这将是用于作者个人资料页面的 URL。


    6. 单击**上传**按钮上传新图像。


    7. 根据需要修改说明文字和替代文本。


    8. 根据需要修改个人简介。


    此时，文章应显示草稿状态。此作者尚未保存：


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_49_1.png)


    图 3.3 – 草稿状态


    9. 单击**发布**按钮：


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_49_2.png)


    图 3.4 – 发布按钮


    此时，作者资料已发布，并且应显示**已发布**状态。其最新版本将可供使用：


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_50_0.png)


    请注意，**内容**菜单像手风琴一样折叠起来，如以下屏幕截图所示。文本垂直显示：


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_50_1.png)


    单击**内容**栏将再次在 **Desk** 中显示最顶层的菜单。


    ## 创建另一位作者


    此时，我们只有一位作者；然而，大多数新闻网站都有不止一位作者，因此请按照以下步骤创建第二位作者：


    1. 单击**内容**导航菜单（位于左侧）中的**作者**，如图所示：


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_50_2.png)


    2. 单击铅笔图标以创建另一位作者，如图所示：


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_50_3.png)


