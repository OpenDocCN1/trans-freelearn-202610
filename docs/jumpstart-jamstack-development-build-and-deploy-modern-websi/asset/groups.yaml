    # Jamstack advantages


    Now, let''s learn about the advantages of the Jamstack.


    ## Speed


    As mentioned before, one of the advantages of static pages is that each page is
    actually a file on the filesystem. As in the early days of web design, each file
    is loaded through a web server. The only bottleneck is the speed of accessing
    the file, reading it, and then sending its contents through the web server.


    A **Content Delivery Network (CDN)** is a network of many servers placed all over
