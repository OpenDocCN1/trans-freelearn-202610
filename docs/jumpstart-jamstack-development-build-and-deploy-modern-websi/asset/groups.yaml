    \n```\n```\nDeploy path:\t/home/chris/jumpstart-jamstack/web/public\nConfiguration\
    \ path: /home/chris/jumpstart-jamstack /netlify. toml\n\nDeploying to draft URL...\n\
    Finished hashing 49 files\nCDN requesting 0 files\nFinished uploading 0 assets\n\
    Draft deploy is live!\n\nLogs:\t\thttps://app.netlify.com/sites/jumpstart- jamstack-web/deploys/5f3cad51bdd06713f5250887\n\
    Website Draft URL: https://5f3cad51bdd06713f5250887--jumpstart- jamstack-web.netlify.app\n\
    \nIf everything looks good on your draft URL, deploy it to your main site URL\
    \ with the --prod flag.\nnetlify deploy --prod\n```\n```\n\nAs the command's output\
    \ reveals, a Draft deploy preview URL is made available so that the production\
    \ website may be viewed without deploying it. In the example, this is `https://5f3cad51bdd06713f5250887--jumpstart-jamstack-web.\
    \ netlify.app`.\n\n`--open` is another useful flag that can be added. This will\
