    \ for the website. **Minify HTML** should be displayed.\n+   \n+   5.  Next, in\
    \ the horizontal menu underneath the website name, click on the **Deploys** link.\n\
    +   \n+   6.  On the right side of the interface, click on the gray **Trigger\
    \ deploy** button, which will display a menu, and then the **Deploy site** menu\
    \ item, as shown in *Figure 14.5*:\n+   \n+       Figure 14.5 – The Trigger deploy\
    \ menu\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_217_0.png)\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_217_1.png)\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_217_2.png)\n\nThis will build and deploy\
    \ a new version of the website. The **Deploy in Progress** page will display a\
