    # 2

    Introduction

    to Sanity


    Throughout this book, we will build a news and events website and make use of
    Sanity.io as a structured content framework. We will explore how to create and
    manage content and new types of content by adding custom fields, defining validation
    rules for the fields, and customizing Sanity Studio. We will also learn how to
    source our content to a frontend framework through the Graph-Relational Object
    Queries (GROQ) Sanity.io query language and GraphQL.


    We will make use of JavaScript React-based Gatsby as our frontend framework and
    we will run through the components of the framework, showing how to manage routes,
    pages, and single components such as images, calendars, forms, listings, and more.


    We will host the application on Netlify, which is a platform for automating the
    deployment of web projects. We will manage our code through the GitHub distributed
    source code versioning system and connect it to Netlify, in order to trigger automated
    deployment every time we add a new feature to our code repository.


    This chapter will cover the following main topics:


    +   - Account setup

    +   - Introduction to Sanity.io

    +   - Creating a project'
