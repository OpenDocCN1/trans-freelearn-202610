    图 15.3 – Sanity Studio 中的存在感\n\n## 为 Gatsby 做贡献\n\n接下来，我们将展示如何为 Gatsby 做贡献。Gatsby\
    \ 是此版本 Jamstack 中最开源的产品。\n\n### Gatsby 社区\n\nGatsby 社区使用多种沟通方式。\n\nDEV 是一个软件开发者社区，其\
    \ Gatsby 社区位于 https://dev.to/t/gatsby，同时还有一个 hashnode URL：https://hashnode.com/n/gatsby。此外，还有一个\
    \ Gatsby Discord，地址为 https://gatsby.dev/discord，该社区非常充实且活跃。\n\n### Gatsby 仓库\n\
    \nGatsby 的 GitHub URL 位于 https://github.com/gatsbyjs。\n\n为 Gatsby 社区做贡献还有一个额外激励：如果拉取请求被接受，Gatsby\
    \ 社区目前会提供积分，这些积分可兑换 T 恤或水瓶等周边商品。\n\n这里有许多独立的仓库。例如，与本书示例所使用的主题类似的主题模板，其名称以 **gatsby-starter**\
    \ 开头，位于 https://github.com/gatsbyjs/gatsby-starter-theme。\n\n这些是学习 Gatsby 如何与\
    \ Jamstack 生态系统的不同部分配合使用的良好起点。\n\n### Gatsby 插件\n\n本书前面已经讨论过 Gatsby 插件。社区可以为 Gatsby\
    \ 创建插件。\n\n## 为 Netlify 做贡献\n\n最后，让我们看看如何为 Netlify 做贡献。\n\n### Netlify 社区\n\n\
    Netlify 是 Jamstack 生态系统中最大的组成部分之一。Netlify 社区位于 https://community.netlify.com。Netlify\
    \ 的 GitHub 位于 https://github.com/netlify。\n\n### Netlify 插件\n\n与我们在*第 14 章，使用\
    \ Netlify 和 Azure 进行部署*中测试的插件类似，Netlify 插件可以按照位于 https://github.com/netlify/plugins\
    \ 的仓库提供的指南来创建和贡献。\n\n## 最后感想\n\n我们很自豪能将这本书加入 Jamstack 生态系统，并希望它能被铭记为该主题最早发布的书籍之一。我们鼓励您为这个不断成长的生态系统贡献力量，并期待您的加入。衷心感谢您参与我们的项目，祝您在学习和职业生涯中一帆风顺。\n\
    \n## 您可能还喜欢其他书籍\n\n如果您喜欢这本书，您可能还会对 Packt 出版的以下书籍感兴趣：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_242_0.png)\n\
    \n### Drupal 9 模块开发 – 第三版\n\nDaniel Sipos\n\nISBN：978-1-80020-462-1\n\n- 为您的应用程序开发自定义\
    \ Drupal 9 模块\n- 掌握不同的 Drupal 9 子系统和 API\n- 建模、存储、操作和处理数据，以实现有效的数据管理\n- 使用主题系统以清晰、安全的方式显示数据和内容\n\
    - 测试您的业务逻辑以防止回归\n- 通过实施最佳实践，保持领先地位并编写 PHP 代码\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_243_0.png)\n\
    \n### WordPress 5 菜谱\n\nRakitha Nimesh Ratnayake\n\nISBN：978-1-83898-650-6\n\n\
    - 安装并自定义 WordPress 主题和插件以构建网站\n- 无需编写任何代码即可开发现代网页设计\n- 探索 WordPress 5 中引入的新 Gutenberg\
    \ 内容编辑器\n- 使用现有的 WordPress 插件添加自定义功能并实现网站盈利\n- 通过简单技巧改善网站的用户交互和可访问性\n- 发现维护和保护网站的强有力技术\n\
    - 扩展内置的 WordPress 功能以进行高级网站管理\n\n### Packt 正在寻找像您这样的作者\n\n如果您有兴趣成为 Packt 的作者，请访问\
    \ `authors.packtpub.com` 并立即申请。我们与成千上万的开发人员和技术专业人士（就像您一样）合作，帮助他们与全球技术社区分享见解。您可以进行一般申请，申请我们正在招募作者的具体热门主题，或提交您自己的想法。\n\
    \n## 留下评论 – 让其他读者了解您的想法\n\n请通过您购买本书的网站留下评论，与他人分享您对本书的看法。如果您从亚马逊购买了本书，请在本书的亚马逊页面上留下真诚的评论。这一点至关重要，这样其他潜在读者就能看到并利用您的客观意见做出购买决定；我们也能了解客户对我们产品的看法；我们的作者也能看到您对他们与\
    \ Packt 合作创作的这本书的反馈。这只需要您几分钟时间，但对其他潜在客户、我们的作者和 Packt 来说都很有价值。谢谢！\n\n## 索引\n\n\
