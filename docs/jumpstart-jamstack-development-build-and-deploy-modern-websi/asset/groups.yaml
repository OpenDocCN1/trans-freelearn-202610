  - '[PAGE 109]


    # public


    Located outside of the `src` directory, this folder is where the deployed website
    pages will be created if they do not already exist when `gatsby build` is run
    in the command line. This is also where the files will be referenced as the document
    root when a Gatsby website is first viewed using the `gatsby serve` command. The
    contents of the public directory may be deleted and recreated at any time since
    running `gatsby build` will always recreate them.


    The complete Gatsby documentation may be found at https://www.gatsbyjs.com/docs/,
    and looks as follows:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_109_0.png)


    Figure 7.1 – Gatsby website documentation


    Now that we''ve learned about Gatsby''s file and folder structure, we will move
    on to learn how to use Gatsby. To start up Gatsby, we''ll need to use the command
    line. Start Gatsby in development mode.


    # The gatsby develop command


    Using Gatsby at the command line provides many different types of functionality
    for the various project stages. Initially, the `gatsby develop` command will start
    up Gatsby in development mode. This allows changes to be viewed in real time.
    The command won''t stop running until you press `Ctrl + C`. This key combination
    is used in the UNIX operating system to terminate (kill) a process.'
  - '[PAGE 110]


    From inside the /web directory, type gatsby develop, as this will cause the Gatsby
    development environment (.env.development) to run, using the development configuration,
    as opposed to the production configuration (.env.production). Also, it will create
    a GraphQL playground called **GraphiQL** (pronounced like *graphical*). This will
    allow us to actually interact with Sanity''s GraphQL interface and to begin to
    write, test, and view the results of the queries needed to create our events website.


    # Summary


    In this chapter, we learned about what Gatsby is and how it is built using JavaScript
    and React. Next, we learned how its configuration file is created, and what its
    main parts are. We also learned how to configure the gatsby-source plugin to interact
    with Sanity. We also learned about the gatsby develop command and how to start
    up a project.


    In the next chapter, we''ll begin our journey with GraphiQL, a GraphQL playground,
    and move closer to creating a website. This will allow us to design, execute,
    and test GraphQL queries within the Gatsby context.'
