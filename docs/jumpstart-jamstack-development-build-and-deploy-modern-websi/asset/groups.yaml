    # Technical requirements


    You will require the following things to understand this chapter:


    +   - A GitHub account

    +   - A Sanity Studio account

    +   - A Netlify account


    The code for this chapter can be found at https://github.com/PacktPublishing/Jumpstart-Jamstack-Development/tree/chapter_two.


    # Account setup


    The first step required is to create an account on the Sanity.io website (https://www.sanity.io).
    A Sanity account may be set up at the start of the project creation. The three
    different methods for creating an account are with a Google account, a GitHub
    account, or simply with an email and password. Next, we create an account on the
    Netlify website (https://app.netlify.com/signup). There are four methods that
    may be used for account creation: GitHub, GitLab, a Bitbucket account, or email
    and password. We will be using GitHub as it is the most convenient option. Finally,
    if not already created, create an account on the GitHub website (https://github.com/join).
    A username, email address, and password are required.


    At the time of writing, all three services use the freemium model and thus provide
    a generous free plan for use with small projects.


    # Introduction to Sanity.io


    > "Sanity.io is the platform for structured content."


    - https://www.sanity.io/docs'
  - '[PAGE 35]


    Sanity.io is a data storage service where you can manage content, making use of
    Sanity''s **Application Programming Interfaces (APIs)**, tools, and libraries.
    You can easily build a centralized content repository for your projects.


    Sanity at its core is the data store and its query language is GROQ.


    Since Sanity Studio is an open source single-page application, it can be freely
    modified and themed. Built using the *JavaScript language*, you can easily define
    your content structure. Then, using the ReactJS library, you are able to extend
    Sanity Studio''s functionality with your own ReactJS components. Also, Sanity
    Studio enables workflow personalization for a project''s content editors. Since
    Sanity Studio uses npm, you may contribute a plugin by creating a public package
    hosted on `https://www.npmjs.com/`, to extend its functionality.


    Sanity''s content is stored and accessed via its data store, which is accessible
    using either the Sanity.io client library or via a **HyperText Transfer Protocol
    (HTTP)** API call. Sanity. io manages the data store, which is cloud-hosted.


    # ## What is GROQ?


    **GROQ** is a query language created by Sanity. It is used to retrieve information
    from the data store. GROQ is easy to learn and powerful—for example, different
    sets of documents can be queried into a single response.


    Now that we have a high-level overview of Sanity.io, we will create our first
    project.


    # # Creating a project


    After you have successfully created accounts on Sanity.io, GitHub, and Netlify,
    we can begin with the project creation, using the Sanity.io **Blog with Gatsby**
    starter project.


    The **Uniform Resource Locator (URL)** for Sanity.io project creation is `https://www.
    sanity.io/create`.'
