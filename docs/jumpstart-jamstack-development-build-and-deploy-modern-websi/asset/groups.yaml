    \    canHandle(handlerInput) {\n        return Alexa.getRequestType(handlerInput.\n\
    requestEnvelope) === 'LaunchRequest';\n    },\n    handle(handlerInput) {\n  \
    \      const speakOutput = 'Welcome, you can say Hello or\nHelp. Which would you\
    \ like to try?';\n        return handlerInput.responseBuilder\n            .speak(speakOutput)\n\
    \            .reprompt(speakOutput)\n            .getResponse();\n    }\n};\n\
    ```\n```\n\nIt will return the message, *Welcome, you can say Hello or Help. Which\
    \ would you like to try?*\n\nLet's change the message to make it related to our\
    \ skill. Replace it with Welcome to the jumpstart jamstack skill, and you can\
    \ say, tell me the upcoming events or Help. Which would you like to try?\n\nSo,\
    \ our LaunchRequest handler will be as follows:\n\n```\n```javascript\nconst LaunchRequestHandler\
    \ = {\n    canHandle(handlerInput) {\n        return Alexa.getRequestType(handlerInput.\n\
    requestEnvelope) === 'LaunchRequest';\n    },\n    handle(handlerInput) {\n  \
    \      const speakOutput = 'Welcome to the jumpstart jamstack\nskill, you can\
    \ say tell me the upcoming events or Help. Which\nwould you like to try?';\n\n\
    \        return handlerInput.responseBuilder\n            .speak(speakOutput)\n\
    \            .reprompt(speakOutput)\n            .getResponse();\n```\n```"
