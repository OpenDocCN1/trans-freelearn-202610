  mdcn: "\n\n## 2 Sanity 简介\n\n在本书中，我们将构建一个新闻和活动网站，并使用 Sanity.io 作为结构化内容框架。我们将探讨如何通过添加自定义字段、为字段定义验证规则以及自定义\
    \ Sanity Studio 来创建和管理内容和新型内容。我们还将学习如何通过 Graph-Relational Object Queries（GROQ）Sanity.io\
    \ 查询语言和 GraphQL 将内容源到前端框架。\n\n我们将使用基于 JavaScript React 的 Gatsby 作为前端框架，并将介绍该框架的组件，展示如何管理路由、页面以及图像、日历、表单、列表等单个组件。\n\
    \n我们将在 Netlify 上托管应用程序，Netlify 是一个用于自动化 Web 项目部署的平台。我们将通过 GitHub 分布式源代码版本控制系统管理代码并将其连接到\
    \ Netlify，以便在每次向代码仓库添加新功能时触发自动部署。\n\n本章将涵盖以下主要主题：\n\n- Account setup\n- Introduction\
    \ to Sanity.io\n- Creating a project\n- Introducing Sanity Manage\n- Sanity Studio\
    \ overview\n\n## Technical requirements\n\n要理解本章，您需要以下内容：\n\n- A GitHub account\n\
    - A Sanity Studio account\n- A Netlify account\n\n本章的代码可在 https://github.com/PacktPublishing/Jumpstart-Jamstack-Development/tree/chapter_two\
    \ 获取。\n\n## Account setup\n\n首先需要做的步骤是在 Sanity.io 网站（https://www.sanity.io）上创建账户。Sanity\
    \ 账户可在项目创建开始时设置。创建账户的三种不同方法是通过 Google 账户、GitHub 账户，或仅使用电子邮件和密码。接下来，我们在 Netlify\
    \ 网站（https://app.netlify.com/signup）上创建账户。可用于账户创建的方法有四种：GitHub、GitLab、Bitbucket\
    \ 账户，或电子邮件和密码。我们将使用 GitHub，因为它是最高效的选择。最后，如果尚未创建，请在 GitHub 网站（https://github.com/join）上创建账户。需要用户名、电子邮件地址和密码。\n\
    \n截至撰写时，全部三个服务均采用 Freemium 模式，因此为小型项目提供慷慨的免费计划。\n\n## Introduction to Sanity.io\n\
    \n> \"Sanity.io is the platform for structured content.\"\n> - https://www.sanity.io/docs\n\
    \nSanity.io 是一个数据存储服务，您可以在其中管理内容，并使用 Sanity 的 **Application Programming Interfaces\
    \ (APIs)**、工具和库。您可以轻松为项目构建集中式内容存储库。\n\nSanity 的核心是数据存储，其查询语言为 GROQ。\n\n由于 Sanity\
