    \n# Jamstack 的演变\n\n通过查看万维网的演变，从其最核心的组件 **超文本标记语言 (HTML)** 开始，可以很容易地解释 Jamstack\
    \ 的演变。\n\n# HTML\n\n最初的网页仅由带有 HTML 标签的文本组成，提供标记指令并具备将页面链接在一起的能力。事实上，普通人常误以为 HTML\
    \ 是一种编程语言，但从根本上说，它只是一系列代表格式指令的符号。它仍然被包含在编程语言列表中，与 C 和 Java 等实际编程语言并列。尽管它迅速演变，现在包含了可访问性和语义功能，但它仍然仅仅是一种标记语言。这意味着它不过是标记而已。然而，在其最早版本中，它只提供一般的格式说明。\n\
    \n例如，我们可以使用 h1 标签来表示页面的页眉，这会使文本显得更大，或者使用 bold 标签使文本加粗。每个页面由文本、链接和 HTML 标签组成。\n\
    \n以下代码片段提供了这样一个示例：\n\n```html\n<html>\n<head>\n<title>My Webpage</title>\n</head>\n\
    <body>\n<h1>Welcome to my webpage.</h1>\n</body>\n</html>\n```\n"
