    # Summary


    In this chapter, we went through the creation of an Alexa skill. We saw the difference
    between the skill interface and the skill service. We went through the component
    of an Alexa skill, and we have extended its functionality with a new command.
    We have also integrated our skill with our Sanity Studio. This means that our
    events are now reachable via a web application and via Alexa!


    In the next chapter, we will return to our Gatsby application and explore the
    Tailwind CSS framework, which will help us to improve the visual aspect of our
    application.'
