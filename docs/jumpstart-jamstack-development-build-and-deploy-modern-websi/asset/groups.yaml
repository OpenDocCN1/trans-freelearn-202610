    \n# 1\n\n# Jamstack 的历史\n\n欢迎来到 **Jamstack**。这种全新的 Web 开发范式激发了信息技术行业的兴奋，并变得越来越流行，不断有围绕它成立的新公司。本书是少数专注于\
