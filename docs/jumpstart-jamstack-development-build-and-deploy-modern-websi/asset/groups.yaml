    # ## Less error-prone


    Most Jamstack systems have a build process that checks all of the HTML, JavaScript,
    and CSS for correctness during the process that builds the pages, so a serious
    coding error will cause the build to fail, not allowing the error to actually
    make it into production.


    # ## Security


    Using the safe **HyperText Transfer Protocol Secure (HTTPS)** instead of the older
    **HyperText Transfer Protocol (HTTP)** means that all information transmitted
    will be secure, as it is encrypted from end to end.


    Also, since static pages are served through *serverless* hosting services, there
    is no chance that any backend systems or databases could be compromised. No longer
    is there a need to spend valuable time keeping the server, libraries, login access,
    and mail services secure and always on the latest version, or even worrying about
    conflicts between the various versions.


    # ## Developer experience


    Developing in the Jamstack means using popular and modern programming languages,
    such as JavaScript, TypeScript, and **ECMAScript 6 (ES6)** variants. Jamstack
    developers may also take advantage of modern query languages such as GraphQL,
    and libraries and frameworks such as ReactJS and VueJS. They may also use static
    site generators such as Hugo and GatsbyJS.'
