    \n## 5 Sanity's GROQ Language\n\nIn this chapter, we are going to explore GROQ,\
    \ Sanity's open source query language. We will learn why GROQ was created and\
    \ how to use GROQ and the Vision plugin to interact with our Sanity Studio dataset.\
    \ We will also do a comparison between GROQ and SQL, and after that, we will run\
    \ basic and advanced queries with GROQ.\n\nBy learning what GROQ is and how to\
    \ use it, we can then quickly begin to use it to write custom queries to obtain\
    \ filtered and sorted data.\n\nWe will cover the following topics in this chapter:\n\
    \n- Why GROQ?\n- GROQ versus SQL\n- Basic queries with GROQ\n- Advanced GROQ\n\
    \n### Technical requirements\n\nA web browser and terminal emulator are needed\
    \ for this chapter.\n\nThe code files for this chapter are placed at https://github.com/PacktPublishing/Jumpstart-Jamstack-Development/tree/chapter_five.\n\
    \n### Why GROQ?\n\nThe datastore is the most important part of what defines Sanity.\
    \ Sanity is built for structured content, which is richer than simple two-dimensional\
    \ tables. Likewise, GROQ is meant to be more powerful and easier to use than traditional\
    \ SQL, used to query a database. GROQ stands for Graph Oriented Query Language,\
    \ so, as the name suggests, it is a query language used to query graphs, which\
    \ are able to represent more complex data structures.\n\nGROQ has four main features:\n\
    \n- **Expressive filtering:** This allows us to build the query using a speakable\
    \ syntax. If we are looking for a venue within our venues named Will's Pub, then\
    \ we will simply use the following expression, which equates to where the type\
    \ is venue and the venue name is Will's Pub:\n\n  ```\n  _type == \"venue\" &&\
    \ name == \"Will's Pub\"\n  ```\n\n- **Joins:** GROQ can join together several\
    \ documents, combining the result together.\n- **Shaping:** You can decide which\
    \ content fields to include or also rename the field names, reformat the resulting\
    \ data structure, and even do additional filters within a projection using the\
    \ values of the parent document.\n\n  Even though this way of obtaining information\
    \ is quite a paradigm shift for many database developers who are familiar with\
    \ SQL databases, with experience GROQ can become very easy to use. Additionally,\
    \ since GROQ is open source, all the code can be examined.\n- **Compactness:**\
    \ GROQ is more compact and less verbose than standard SQL. The syntax is terser\
    \ in most cases – just as ES6 is terser than ES5.\n\nSanity Studio's toolbar is\
    \ displayed at the top of the page found at http://localhost:3333 by typing the\
    \ following command in the terminal while in the studio directory:\n\n```\nsanity\
    \ start\n```\n\nTwo of the main tools – the **Dashboard** and **Desk** are automatically\
    \ installed. To be able to try out GROQ with actual queries against a dataset,\
    \ we will install a third tool, called **Vision**. Vision gives us a way to type\
    \ in queries and instantly view the resulting dataset, optionally filtered and\
    \ sorted. This will help us use GROQ inside of code.\n\n### Installing Vision\n\
    \nTo install Vision, take the following steps and use the terminal command line:\n\
    \n1. Inside the `studio` folder, type the following command:\n\n   ```\n   sanity\
    \ install @sanity/vision\n   ```\n\n   Upon successful installation, the **Vision**\
    \ icon should be visible together with the other tools in your local Sanity Studio\
    \ application:\n\n   ![](img/97ab031f38e2174e2f1b51da18dfa1d0_79_0.png)\n\n  \
    \ Figure 5.1 – The top navigation\n\n2. Click on the **Vision** icon and a screen\
    \ will appear that will allow the user to execute GROQ queries:\n\n   ![](img/97ab031f38e2174e2f1b51da18dfa1d0_79_1.png)\n\
    \n   Figure 5.2 – The Vision screen for GROQ queries\n\nIn the top navigation,\
    \ the **DATASET** selector allows the user to select which dataset to use. The\
    \ light-blue **Run query** button will perform the query. The **Listen** button\
    \ will activate a mode where changes in the documents from the filter part of\
    \ your GROQ query are output in real time in the **RESULT** section.\n\nThe main\
    \ body of the screen is divided into three sections. It is very easy to imagine\
    \ what each section is used for:\n\n- **QUERY** is where the GROQ query will be\
    \ entered.\n- **PARAMS** is where parameter sets that will be passed into the\
    \ GROQ query can be entered.\n- **RESULT** is where the result will be displayed\
    \ in JSON format. The results may then be expanded or collapsed so that the user\
    \ can see the overview as well as details.\n\nWe have learned how to install the\
    \ Vision GROQ tool and how to use it. In the next section, we will examine GROQ\
    \ and compare it to SQL.\n\n### GROQ versus SQL\n\nThe compactness of GROQ simply\
    \ uses an initial asterisk sign to denote `select all documents`, and not a single\
    \ table by default as in standard SQL. While SQL is a traditional schema database,\
    \ which means you have to decide the structure of your database in advance, divided\
    \ into tables. Before storing any data, a programmer must define a table, names,\
    \ and types of columns inside that table. When adding data to a schema database,\
    \ a programmer must pass the data in the format declared on each column; any extra\
    \ data or data not matching the format will not be stored in the database.\n\n\
    Sanity's content model is a schema-less database which means you don't need to\
    \ define tables and columns. The system stores data as key/value pairs or JSON,\
    \ basically a one-column table. A programmer will be able to add any data in any\
    \ format into the database, change the existing data, from a Boolean to a string,\
    \ for example, and add new data types without declaring a new column.\n\nNow let's\
    \ explore the differences when querying SQL and GROQ:\n\n| SQL | GROQ |\n| ---\
    \ | --- |\n| `select * from table;` | `*` |\n| `select * from content_table where\
    \ type=\"movie\";` | `*[_type == \"movie\"]` |\n\nA traditional SQL-based database\
    \ query should have the following syntax:\n\n```\nselect * from table;\n```\n\n\
    Let's look at GROQ:\n\n```\n*\n```\n\n```\n\"name\": \"IT Conference\",\n\"venue\"\
    : {\n  \"_ref\": \"65929c5e-f2df-4483-b2e4-4f10a654adf8\",\n  \"_type\": \"reference\"\
    \n},\n1: { ... },\n2: { ... }\n]\n```\n\nNote that the results are wrapped in\
    \ `result`. They are represented by a zero-based array and there are three results,\
    \ so 0, 1, and 2.\n\nNotice that the id is a Universally Unique Identifier (UUID).\
    \ This allows for the document to be unique throughout the entire dataset, unlike\
    \ a database table index, which gets indexed starting with 1, but it is only unique\
    \ within that single table.\n\nThe `_rev` key is the identifier of the revision,\
    \ or version, of this document.\n\nSince `venue` is a related document, the `_ref`\
    \ is the reference to the `_id` of the document. Note that `venue` is nested and\
    \ represents a complete document.\n\n### Selecting all upcoming events\n\nIn this\
    \ query, we are going to select all upcoming events by adding the `dateAndTime`\
    \ condition:\n\n```\n*[_type == \"event\" && dateAndTime >= now()] | order(dateAndTime\
    \ asc)\n```\n\nWe pass the current date value using the `now()` function, which\
    \ returns the current date. We could also have passed the `dateAndTime` value\
    \ as a string with the YYYY-MM-DD format.\n\nWe are also ordering the result by\
    \ date. We will show all upcoming events starting from the closest event.\n\n\
    ### Selecting all past events\n\nAs for upcoming events, we are using the `now()`\
    \ function to get the current date value and get all past events:\n\n```\n*[_type\
    \ == \"event\" && dateAndTime < now()] | order(dateAndTime asc)\n```\n\nIt will\
    \ order the results by date starting from the closest.\n\n### Selecting upcoming\
    \ virtual conference and non-virtual conferences\n\nOur previous query returned\
    \ all events by date but was not filtered by the Virtual Conference field. Our\
    \ Virtual Conference field in the Event schema is a Boolean. We can add the condition\
    \ to our GROQ query setting `virtual == true` if the event is virtual or `virtual\
    \ == false` if the event is not virtual:\n\n- Select virtual events:\n\n  ```\n\
    \  *[_type == \"event\" && dateAndTime >= now() && virtual == true] | order(dateAndTime\
    \ asc)\n  ```\n\n- Select non-virtual events:\n\n  ```\n  *[_type == \"event\"\
    \ && dateAndTime >= now() && virtual == false] | order(dateAndTime asc)\n  ```\n\
    \nWe have seen how to select all of the fields from the dataset schema. Next,\
    \ we will learn how to select specific fields to make the result size smaller.\n\
    \n### Selecting specific event fields\n\nThe results will depend on where we show\
    \ the content. We may not need all the fields, but rather only certain fields.\
    \ With this query, we receive only the `name`, `dateAndTime`, and `body` fields\
    \ for all upcoming events.\n\nWe pass the field names in the projection:\n\n```\n\
    *[_type == \"event\" && dateAndTime >= now()] | order(dateAndTime asc) | {name,\
    \ dateAndTime, body}\n```\n"
  mdcn: "\n现在可以按照上一章中的方法查看**添加新事件**屏幕。\n\n下图是**添加新事件**屏幕的示例。请注意**虚拟活动**的单选按钮，它是从模式（schema）中指定的布尔值自动创建的：\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_75_0.png)\n\n## 5 Sanity 的 GROQ 语言\n\
    \n在本章中，我们将探索 GROQ，这是 Sanity 的一个开源查询语言。我们将学习 GROQ 的创建原因，以及如何使用 GROQ 和 Vision 插件与我们的\
    \ Sanity Studio 数据集进行交互。我们还将比较 GROQ 和 SQL，然后使用 GROQ 执行基本和高级查询。\n\n通过学习 GROQ 是什么以及如何使用它，我们可以迅速开始用它来编写自定义查询，以获取经过筛选和排序的数据。\n\
    \n本章将涵盖以下主题：\n\n- 为什么选择 GROQ？\n- GROQ 与 SQL 的比较\n- 使用 GROQ 进行基本查询\n- 高级 GROQ\n\
    \n### 技术要求\n\n本章需要一个网络浏览器和终端仿真器。\n\n本章的代码文件位于 https://github.com/PacktPublishing/Jumpstart-Jamstack-Development/tree/chapter_five。\n\
    \n### 为什么选择 GROQ？\n\n数据存储是定义 Sanity 的最重要部分。Sanity 是为结构化内容而构建的，其丰富程度超过简单的二维表格。同样，GROQ\
    \ 旨在比用于查询数据库的传统 SQL 更强大且更易用。GROQ 代表图导向查询语言（Graph Oriented Query Language），因此，正如名称所暗示的那样，它是一种用于查询图的语言，而图能够表示更复杂的数据结构。\n\
    \nGROQ 有四个主要特性：\n\n- **富有表现力的筛选：** 这允许我们使用可读的语法构建查询。如果我们正在查找名为 Will's Pub 的场所，那么我们只需使用以下表达式，它等同于：类型为场所且场所名称为\
    \ Will's Pub：\n\n  ```\n  _type == \"venue\" && name == \"Will's Pub\"\n  ```\n\
    \n- **连接（Joins）：** GROQ 可以连接多个文档，并将结果组合在一起。\n- **整形（Shaping）：** 你可以决定包含哪些内容字段，或者重命名字段名称，重新格式化结果数据结构，甚至可以使用父文档的值在投影内进行额外的筛选。\n\
    \n  尽管这种获取信息的方式对于许多熟悉 SQL 数据库的数据库开发人员来说是一种相当大的范式转变，但随着经验的积累，GROQ 可以变得非常容易使用。此外，由于\
    \ GROQ 是开源的，所有代码都可以被检查。\n- **简洁性：** 与标准 SQL 相比，GROQ 更简洁，冗词更少。在大多数情况下，语法更简练——就像\
    \ ES6 比 ES5 更简练一样。\n\n在终端中位于 studio 目录下输入以下命令，即可在 http://localhost:3333 找到的页面顶部显示\
    \ Sanity Studio 的工具栏：\n\n```\nsanity start\n```\n\n两个主要工具——**仪表板**和**工作台**会自动安装。为了能够针对实际数据集尝试\
    \ GROQ 查询，我们将安装第三个工具，称为**Vision**。Vision 为我们提供了一种输入查询并即时查看结果数据集（可选地经过筛选和排序）的方式。这将帮助我们在代码中使用\
    \ GROQ。\n\n### 安装 Vision\n\n要安装 Vision，请按照以下步骤使用终端命令行：\n\n1. 在 `studio` 文件夹内，输入以下命令：\n\
    \n   ```\n   sanity install @sanity/vision\n   ```\n\n   安装成功后，**Vision** 图标应与本地\
    \ Sanity Studio 应用程序中的其他工具一起显示：\n\n   ![](img/97ab031f38e2174e2f1b51da18dfa1d0_79_0.png)\n\
    \n   图 5.1 – 顶部导航栏\n\n2. 点击**Vision** 图标，将出现一个允许用户执行 GROQ 查询的屏幕：\n\n   ![](img/97ab031f38e2174e2f1b51da18dfa1d0_79_1.png)\n\
    \n   图 5.2 – 用于 GROQ 查询的 Vision 屏幕\n\n在顶部导航栏中，**DATASET**（数据集）选择器允许用户选择使用哪个数据集。浅蓝色的**Run\
    \ query**（运行查询）按钮将执行查询。**Listen**（监听）按钮将激活一种模式，在该模式下，来自 GROQ 查询筛选部分的文档变更将在**RESULT**（结果）部分实时输出。\n\
    \n屏幕的主体部分分为三个部分。很容易想象每个部分的用途：\n\n- **QUERY**（查询）是输入 GROQ 查询的地方。\n- **PARAMS**（参数）是输入传递给\
    \ GROQ 查询的参数集的地方。\n- **RESULT**（结果）是以 JSON 格式显示结果的地方。结果随后可以展开或折叠，以便用户既能看到概览也能看到细节。\n\
    \n我们已经学习了如何安装 Vision GROQ 工具以及如何使用它。在下一节中，我们将审视 GROQ 并将其与 SQL 进行比较。\n\n### GROQ\
    \ 与 SQL\n\nGROQ 的简洁性使用初始星号表示`选择所有文档`，而在标准 SQL 中默认选择的是单个表。虽然 SQL 是一种传统的关系型数据库，这意味着你需要预先决定数据库的结构，并将其划分为表。在存储任何数据之前，程序员必须定义表、列名以及该表内列的类型。当向关系型数据库添加数据时，程序员必须以每列声明的格式传递数据；任何多余的数据或不匹配格式的数据都不会存储在数据库中。\n\
    \nSanity 的内容模型是一个无模式数据库，这意味着你不需要定义表和列。系统以键/值对或 JSON 的形式存储数据，基本上是一列的表。程序员能够将任何格式的数据添加到数据库中，更改现有数据，例如从布尔值改为字符串，并在不声明新列的情况下添加新的数据类型。\n\
    \n现在让我们探索查询 SQL 和 GROQ 时的差异：\n\n| SQL | GROQ |\n| --- | --- |\n| `select * from\
    \ table;` | `*` |\n| `select * from content_table where type=\"movie\";` | `*[_type\
    \ == \"movie\"]` |\n\n传统的基于 SQL 的数据库查询应包含以下语法：\n\n```\nselect * from table;\n\
    ```\n\n让我们看看 GROQ：\n\n```\n*\n```\n\n```\n\"name\": \"IT Conference\",\n\"venue\"\
    : {\n  \"_ref\": \"65929c5e-f2df-4483-b2e4-4f10a654adf8\",\n  \"_type\": \"reference\"\
    \n},\n1: { ... },\n2: { ... }\n]\n```\n\n请注意，结果被包裹在 `result` 中。它们由基于零的数组表示，共有三个结果，因此是\
    \ 0、1 和 2。\n\n请注意，id 是一个通用唯一标识符（UUID）。这使得文档在整个数据集中都是唯一的，这与数据库表索引不同，后者从 1 开始索引，且仅在单个表内唯一。\n\
    \n`_rev` 键是该文档修订版或版本的标识符。\n\n由于 `venue` 是相关文档，`_ref` 是对该文档 `_id` 的引用。请注意，`venue`\
    \ 是嵌套的，并且代表一个完整的文档。\n\n### 选择所有即将举行的活动\n\n在此查询中，我们将通过添加 `dateAndTime` 条件来选择所有即将举行的活动：\n\
    \n```\n*[_type == \"event\" && dateAndTime >= now()] | order(dateAndTime asc)\n\
    ```\n\n我们使用 `now()` 函数传递当前日期值，该函数返回当前日期。我们也可以将 `dateAndTime` 值作为 YYYY-MM-DD 格式的字符串传递。\n\
    \n我们还按日期对结果进行排序。我们将显示所有即将举行的活动，从最近的活动开始。\n\n### 选择所有过去的活动\n\n对于即将举行的活动，我们使用 `now()`\
    \ 函数获取当前日期值，并获取所有过去的活动：\n\n```\n*[_type == \"event\" && dateAndTime < now()] |\
    \ order(dateAndTime asc)\n```\n\n它将按日期对结果进行排序，从最近的活动开始。\n\n### 选择即将举行的虚拟会议和非虚拟会议\n\
    \n我们之前的查询按日期返回了所有活动，但并未按虚拟会议字段进行筛选。我们在活动模式中的虚拟会议字段是一个布尔值。我们可以向 GROQ 查询添加条件，如果活动是虚拟的则设置\
    \ `virtual == true`，如果活动不是虚拟的则设置 `virtual == false`：\n\n- 选择虚拟活动：\n\n  ```\n \
    \ *[_type == \"event\" && dateAndTime >= now() && virtual == true] | order(dateAndTime\
    \ asc)\n  ```\n\n- 选择非虚拟活动：\n\n  ```\n  *[_type == \"event\" && dateAndTime >=\
    \ now() && virtual == false] | order(dateAndTime asc)\n  ```\n\n我们已经看到了如何从数据集中选择所有字段。接下来，我们将学习如何选择特定字段以减小结果的大小。\n\
    \n### 选择特定活动字段\n\n结果取决于我们在哪里显示内容。我们可能不需要所有字段，而只需要某些字段。通过此查询，我们仅获取所有即将举行的活动的 `name`、`dateAndTime`\
    \ 和 `body` 字段。\n\n我们在投影中传递字段名称：\n\n```\n*[_type == \"event\" && dateAndTime >=\
    \ now()] | order(dateAndTime asc) | {name, dateAndTime, body}\n```\n\n"
