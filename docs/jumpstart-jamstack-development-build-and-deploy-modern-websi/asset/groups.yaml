  md: "\n## Gatsby page components\n\nOne of the simplest types of components used\
    \ in Gatsby is a page component. Gatsby page components are used only once for\
    \ single, unique pages, such as the index (home) page, 404 page, or an about us\
    \ page, for example. This page will only be generated once.\n\n### Building and\
    \ modifying Gatsby page components\n\nAs mentioned previously, pages are unique.\
    \ By creating a page component and placing it in the `/web/src/pages` folder,\
    \ Gatsby will automatically generate the page.\n\nThe content of a page component\
    \ in Gatsby can be as simple as the following example, which contains the entire\
    \ page contents inside a string:\n\n```\n// Does not require React because there\
    \ is no JSX\nconst AboutUsPage = () => (\n  `Who we are: .......`\n)\nexport default\
    \ AboutUsPage\n```\n\nThe following is a shorter way to write the preceding code:\n\
    \n```\nconst AboutUsPage = () => {\nreturn `Who we are: .......`\n}\n```\n\nEnhancing\
    \ this example by using JSX would allow us to create the following example:\n\n\
    ```\n//Requires React because this example uses JSX tags.\nimport React from 'react'\n\
    \nconst AboutUsPage = () => (\n  <html>\n    <body>\n      <h1>Who we are:</h1>\n\
    \        <p>.......</p>\n    </body>\n  </html>\n)\nexport default AboutUsPage\n\
    ```\n\nIf we were to name the file `about-us.js` and place it in the `/web/src/pages/`\
    \ directory, then running Gatsby would display the following screenshot:\n\nWho\
    \ we are: ......\n\nFigure 10.1 – Screenshot of the About Us page\n\nThis AboutUsPage\
    \ example will be rendered in the browser as HTML.\n\n## Gatsby template components\n\
    \nGatsby template components are, as the name implies, templates. These are used\
    \ as a template for pages, such as articles, where certain parts of the page will\
    \ be filled with unique content. These templates will be processed as many times\
    \ as necessary to produce all the content needed.\n\n### Building and modifying\
    \ template components\n\nTo illustrate this concept, we will create a template\
    \ for the events on our website. The first file that we need to work with is `/web/src/gatsby-node.js`.\
    \ This file contains the code used to display blog posts using a template.\n\n\
    At the bottom of the `gatsby-node.js` file, the relevant code is as follows:\n\
    \n```\nexports.createPages = async ({graphql, actions}) => {\n  await createBlogPostPages(graphql,\
    \ actions)\n}\n```\n\nWe will now add another function to generate events sourced\
    \ from Sanity through GraphQL:\n\n```\nexports.createPages = async ({graphql,\
    \ actions}) => {\n  await createBlogPostPages(graphql, actions)\n  await createEventPages(graphql,\
    \ actions)\n}\n```\n\nNext, we'll copy the content of createBlogPostPages. The\
    \ entire function should be copied. However, the middle of the function was omitted\
    \ for space. Here is an excerpt:\n\n```\nasync function createBlogPostPages (graphql,\
    \ actions) {\n  const {createPage} = actions\n  const result = await graphql(`\n\
    \  .....\ncreatePage({\n    path,\n    component:\n        require.resolve('./src/templates/blog-post.js'),\n\
    \    context: {id}\n    })\n})\n```\n\nHere is the structure of the newly created\
    \ createEventPages function:\n\n```\nasync function createEventPages(graphql,\
    \ actions) {\n    const {createPage} = actions\n    const result = await graphql(`\n\
    \    {\n        allSanityEvent {\n            ...\n        }\n    }\n`)\n    ...\n\
    \    if (result.errors) throw result.errors\n\n    const eventEdges = (result.data.allSanityEvent\
    \ || {}).edges || []\n    ...\n    eventEdges\n    .forEach((edge, index) => {\n\
    \        ...\n    })\n```\n\nNow, let's examine this code. An asynchronous function\
    \ is created with the graphql and actions parameters. This will always return\
    \ a promise:\n\n```\nasync function createEventPages(graphql, actions) {\n```\n\
    \nThe createPage method is extracted as a constant, or destructured from actions:\n\
    \n```\nconst {createPage} = actions\n```\n\nThe constant result is declared to\
    \ hold the result of the GraphQL query. The JavaScript function will wait for\
    \ this to complete before moving on. The query is enclosed in backtick operators\
    \ (`):\n\n```\nconst result = await graphql(`\n{\n```\n\nThe following lines are\
    \ similar to the GraphQL query, which returns Gatsby's id and `dateAndTime` from\
    \ `allSanityEvent` via `gatsby-source-sanity`:\n\n```\nallSanityEvent {\n  edges\
    \ {\n    node {\n      id\n      dateAndTime\n    }\n  }\n}\n`\n```\n\nIf there\
    \ are any errors, throw an exception:\n\n```\nif (result.errors) throw result.errors\n\
    ```\n\nNext, we'll examine the following line of code:\n\n```\nconst eventEdges\
    \ = (result.data.allSanityEvent || {}).edges || []\n```\n\nDeclare a constant\
    \ named `eventEdges` and assign the results of the query's edges to it if they\
    \ are not empty. Otherwise, if there are no results, then instantiate an empty\
    \ array to `eventEdges`. Remember that the result of the GraphQL query is wrapped\
    \ in data.\n\nIterate, or loop through (using forEach) all of the edges, using\
    \ an edge variable for each single edge of the GraphQL query:\n\n```\neventEdges\n\
    .forEach((edge, index) => {\n```\n\nDestructure `id` and `dateAndTime` from the\
    \ edge's node object:\n\n```\nconst {id, dateAndTime} = edge.node\n```\n\nUse\
    \ the `format` function from `date-fns`, which is included in the Gatsby `package.json`\
    \ file to format `dateAndTime`, which otherwise would print as `2020-04-10T15:30:00.000Z`,\
    \ into a more acceptable four-digit year, forward slash, double-digit numeric\
    \ month format, (YYYY/MM), assigning it to a constant named `dateSegment`:\n\n\
    ```\nconst { format } = require('date-fns')\nconst dateSegment = format(dateAndTime,\
    \ 'YYYY/MM')\n```\n\nCreate the path that will actually be the single page's URL\
    \ and be seen in the browser. Here, we are using Gatsby's ID, which is created,\
    \ and not Sanity's ID, which can be accessed in the GraphQL query as `_id`:\n\n\
    ```\nconst path = `/event/${dateSegment}/${id}/`\n```\n\nHere is an example of\
    \ the URL path:\n\n```\n/event/2021/09/dd88fc6c-10c5-572e-8c58-696add54a14a/\n\
    ```\n\nFinally, the `createPage` function is called, passing in the path, specifying\
    \ the `event.js` template file for each page, and passing in `id` as the `context`\
    \ parameter:\n\n```\ncreatePage({\n  path,\n  component:\n    require.resolve('./src/templates/event.js'),\n\
    \  context: {id}\n})\n```\n\nThe contents of the `event.js` file will be used\
    \ in the `component` attribute of the `createPage` method and will be resolved,\
    \ combining the contents of the page and its template to produce a single page.\n\
    \n### Building the event.js template\n\n`event.js` is the template used for each\
    \ individual event page, so let's look at how it is constructed:\n\n1. First,\
    \ we need a few import statements to bring in the necessary features:\n\n```\n\
    import React from 'react'\nimport {graphql} from 'gatsby'\nimport Container from\
    \ '../components/container'\nimport GraphQLErrorList from '../components/graphql-error-list'\n\
    import Event from '../components/event'\nimport SEO from '../components/seo'\n\
    import Layout from '../containers/layout'\nimport {toPlainText} from '../lib/helpers'\n\
    ```\n\n2. Next, we need to perform a GraphQL query to obtain each element of the\
    \ page:\n\n```\nexport const query = graphql`\n  query EventTemplateQuery($id:\
    \ String!) {\n    event: sanityEvent(id: {eq: $id}) {\n      name\n      _rawBody\n\
    \      venue {\n        name\n      }\n    }\n  }\n`\n```\n\nAt a minimum, to\
    \ produce the event's page, we need its name, `_rawBody`, and the name of the\
    \ event's related venue.\n\n3. Next, `EventTemplate` is defined with props (properties)\
    \ as its parameter and eventually exported:\n\n```\nconst EventTemplate = props\
    \ => {\n...\n}\n\nexport default EventTemplate\n```\n\n4. Next, the data and errors\
    \ (if present) objects are destructured from the props parameter. Then, if data\
    \ is present, the `event` constant is instantiated to hold the data object's event:\n\
    \n```\nconst {data, errors} = props\nconst event = data && data.event\n```\n\n\
    5. Next, the `Layout` component is called inside the `SEO` component and the `Event`\
    \ component. The error handling code has been removed to remove any distraction,\
    \ but errors would be displayed here as well if they existed. The layout produces\
    \ the page layout, tags, such as the header and footer, and provides a wrapper\
    \ for the event:\n\n```\nreturn (\n  <Layout>\n    {event && <SEO title={event.name\
    \ || 'Untitled'} />}\n    {event && <Event {...event} />}\n  </Layout>\n)\n```\n\
    \n> Note\n> Notice how the JavaScript ES6 spread syntax is used to assign each\
    \ of the Event object's values to separate values to be used with the Event component.\n"
  mdcn: "\n\n## Gatsby 页面组件\n\nGatsby 中使用的最简单组件类型之一是页面组件。Gatsby 页面组件仅用于单个、唯一的页面，例如索引（主页）、404\
    \ 页面或“关于我们”页面。此页面只会生成一次。\n\n### 构建和修改 Gatsby 页面组件\n\n如前所述，页面是唯一的。通过创建一个页面组件并将其放置在\
    \ `/web/src/pages` 文件夹中，Gatsby 将自动生成该页面。\n\nGatsby 中页面组件的内容可以像下面的示例一样简单，它将整个页面内容放在一个字符串中：\n\
    \n```\n// Does not require React because there is no JSX\nconst AboutUsPage =\
    \ () => (\n  `Who we are: .......`\n)\nexport default AboutUsPage\n```\n\n下面是编写上述代码的一种更简短方式：\n\
    \n```\nconst AboutUsPage = () => {\nreturn `Who we are: .......`\n}\n```\n\n通过使用\
    \ JSX 增强此示例，我们可以创建如下示例：\n\n```\n//Requires React because this example uses JSX\
    \ tags.\nimport React from 'react'\n\nconst AboutUsPage = () => (\n  <html>\n\
    \    <body>\n      <h1>Who we are:</h1>\n        <p>.......</p>\n    </body>\n\
    \  </html>\n)\nexport default AboutUsPage\n```\n\n如果我们将文件命名为 `about-us.js`，并将其放置在\
    \ `/web/src/pages/` 目录中，那么运行 Gatsby 后将显示以下屏幕截图：\n\n我们是谁：......\n\n图 10.1 – “关于我们”页面的屏幕截图\n\
    \n此 AboutUsPage 示例将在浏览器中渲染为 HTML。\n\n## Gatsby 模板组件\n\n顾名思义，Gatsby 模板组件就是模板。这些组件用作页面的模板，例如文章页面，其中页面的某些部分将填充唯一内容。这些模板会根据需要处理多次，以生成所需的全部内容。\n\
    \n### 构建和修改模板组件\n\n为了说明这一概念，我们将为网站上的活动创建一个模板。我们需要处理的第一个文件是 `/web/src/gatsby-node.js`。此文件包含使用模板显示博客文章的代码。\n\
    \n在 `gatsby-node.js` 文件的底部，相关代码如下：\n\n```\nexports.createPages = async ({graphql,\
    \ actions}) => {\n  await createBlogPostPages(graphql, actions)\n}\n```\n\n现在，我们将添加另一个函数，通过\
    \ GraphQL 生成来自 Sanity 的活动：\n\n```\nexports.createPages = async ({graphql, actions})\
    \ => {\n  await createBlogPostPages(graphql, actions)\n  await createEventPages(graphql,\
    \ actions)\n}\n```\n\n接下来，我们将复制 createBlogPostPages 的内容。整个函数都应该复制。不过，为节省篇幅，函数中间的部分被省略了。以下是一个片段：\n\
    \n```\nasync function createBlogPostPages (graphql, actions) {\n  const {createPage}\
    \ = actions\n  const result = await graphql(`\n  .....\ncreatePage({\n    path,\n\
    \    component:\n        require.resolve('./src/templates/blog-post.js'),\n  \
    \  context: {id}\n    })\n})\n```\n\n下面是新创建的 createEventPages 函数的结构：\n\n```\n\
    async function createEventPages(graphql, actions) {\n    const {createPage} =\
    \ actions\n    const result = await graphql(`\n    {\n        allSanityEvent {\n\
    \            ...\n        }\n    }\n`)\n    ...\n    if (result.errors) throw\
    \ result.errors\n\n    const eventEdges = (result.data.allSanityEvent || {}).edges\
    \ || []\n    ...\n    eventEdges\n    .forEach((edge, index) => {\n        ...\n\
    \    })\n```\n\n现在，让我们检查这段代码。使用 graphql 和 actions 参数创建一个异步函数。该函数始终会返回一个 promise：\n\
    \n```\nasync function createEventPages(graphql, actions) {\n```\n\n从 actions 中提取\
    \ createPage 方法，将其声明为常量，或者说对其进行解构：\n\n```\nconst {createPage} = actions\n```\n\
    \n声明常量 result，用于保存 GraphQL 查询的结果。JavaScript 函数会等待查询完成后再继续执行。查询包含在反引号运算符（`）中：\n\
    \n```\nconst result = await graphql(`\n{\n```\n\n下面几行与 GraphQL 查询类似，它通过 `gatsby-source-sanity`\
    \ 从 `allSanityEvent` 返回 Gatsby 的 id 和 `dateAndTime`：\n\n```\nallSanityEvent {\n\
    \  edges {\n    node {\n      id\n      dateAndTime\n    }\n  }\n}\n`\n```\n\n\
    如果存在任何错误，则抛出异常：\n\n```\nif (result.errors) throw result.errors\n```\n\n接下来，我们查看下面这行代码：\n\
    \n```\nconst eventEdges = (result.data.allSanityEvent || {}).edges || []\n```\n\
    \n声明一个名为 `eventEdges` 的常量。如果查询的 edges 不为空，则将查询结果中的 edges 赋给它。否则，如果没有结果，则为 `eventEdges`\
    \ 实例化一个空数组。请记住，GraphQL 查询的结果封装在 data 中。\n\n使用 forEach 对所有 edges 进行迭代或循环，为 GraphQL\
    \ 查询中的每条 edge 使用一个 edge 变量：\n\n```\neventEdges\n.forEach((edge, index) => {\n\
    ```\n\n从 edge 的 node 对象中解构 `id` 和 `dateAndTime`：\n\n```\nconst {id, dateAndTime}\
    \ = edge.node\n```\n\n使用 `date-fns` 中的 `format` 函数格式化 `dateAndTime`。该函数包含在 Gatsby\
    \ 的 `package.json` 文件中，可以将原本会打印为 `2020-04-10T15:30:00.000Z` 的日期转换为更易接受的四位数年份、正斜杠、两位数月份格式（YYYY/MM），并将结果赋给名为\
    \ `dateSegment` 的常量：\n\n```\nconst { format } = require('date-fns')\nconst dateSegment\
    \ = format(dateAndTime, 'YYYY/MM')\n```\n\n创建实际作为单页面 URL 并在浏览器中显示的路径。这里使用的是 Gatsby\
    \ 创建的 ID，而不是 Sanity 的 ID；Sanity 的 ID 可以在 GraphQL 查询中通过 `_id` 访问：\n\n```\nconst\
    \ path = `/event/${dateSegment}/${id}/`\n```\n\n以下是 URL 路径示例：\n\n```\n/event/2021/09/dd88fc6c-10c5-572e-8c58-696add54a14a/\n\
    ```\n\n最后，调用 `createPage` 函数，传入路径，为每个页面指定 `event.js` 模板文件，并将 `id` 作为 `context`\
    \ 参数传入：\n\n```\ncreatePage({\n  path,\n  component:\n    require.resolve('./src/templates/event.js'),\n\
    \  context: {id}\n})\n```\n\n`event.js` 文件的内容将用于 `createPage` 方法的 `component`\
    \ 属性，并且会被解析，将页面内容与其模板结合起来，从而生成一个单独的页面。\n\n### 构建 event.js 模板\n\n`event.js` 是每个单独活动页面所使用的模板，因此让我们看看它是如何构建的：\n\
    \n1. 首先，我们需要使用一些 import 语句引入必要的功能：\n\n```\nimport React from 'react'\nimport {graphql}\
    \ from 'gatsby'\nimport Container from '../components/container'\nimport GraphQLErrorList\
    \ from '../components/graphql-error-list'\nimport Event from '../components/event'\n\
    import SEO from '../components/seo'\nimport Layout from '../containers/layout'\n\
    import {toPlainText} from '../lib/helpers'\n```\n\n2. 接下来，我们需要执行一个 GraphQL 查询，以获取页面的每个元素：\n\
    \n```\nexport const query = graphql`\n  query EventTemplateQuery($id: String!)\
    \ {\n    event: sanityEvent(id: {eq: $id}) {\n      name\n      _rawBody\n   \
    \   venue {\n        name\n      }\n    }\n  }\n`\n```\n\n要生成活动页面，至少需要活动的名称、`_rawBody`\
    \ 以及相关场地的名称。\n\n3. 接下来，使用 props（属性）作为参数定义 `EventTemplate`，并最终将其导出：\n\n```\nconst\
    \ EventTemplate = props => {\n...\n}\n\nexport default EventTemplate\n```\n\n\
    4. 接下来，从 props 参数中解构 data 和 errors 对象。然后，如果存在 data，则实例化 `event` 常量以保存 data 对象中的\
    \ event：\n\n```\nconst {data, errors} = props\nconst event = data && data.event\n\
    ```\n\n5. 接下来，在 `SEO` 组件和 `Event` 组件中调用 `Layout` 组件。为避免造成干扰，错误处理代码已被移除，但如果存在错误，这里也会显示错误。布局会生成页面布局和标签（例如页眉和页脚），并为活动提供一个包装器：\n\
    \n```\nreturn (\n  <Layout>\n    {event && <SEO title={event.name || 'Untitled'}\
    \ />}\n    {event && <Event {...event} />}\n  </Layout>\n)\n```\n\n> 注意\n> 请注意，这里使用了\
