    # ## Summary


    In this chapter, we learned how to deploy websites through Netlify. We also learned
    how to install and use Netlify plugins, as well as how to use the `netlify.toml`
    configuration file and command-line utilities.


    Additionally, we learned how to create and manage a Jamstack web application through
    the Static Web Apps service on Azure and also how to manage app redeployments
    through GitHub.


    Having multiple options for Jamstack deployment demonstrates its decoupled nature.
    Multiple services can be easily leveraged for the same application, as needed.


    In the next chapter, we will conclude our journey into the world of Jamstack and
    discuss the present and future state of the Jamstack community, other tools and
    alternative components of the ecosystem, and upcoming technologies and companies
    that are writing the future.'
  - '[PAGE 230]


    <!-- no content -->'
  - '[PAGE 231]


    # 15


    # Conclusion


    This closing chapter summarizes the concepts learned throughout the book and how
    the Jamstack community is evolving. The chapter will discuss the various external
    projects and how to contribute to them. The main topics that we will cover in
    this chapter are as follows:


    +   - The Jamstack''s future

    +   - The Jamstack community resources

    +   - Contributing to Jamstack projects


    # Summary of concepts


    We began with an outline of the history of web development, showing how dynamic
    technology, such as *Server Side Includes*, eventually worked its way into static
    pages, adding functionality. These techniques, while adding more dynamicity, eventually
    led to server-side heaviness, increasing load time. Next, we introduced Sanity,
    a content delivery platform, and Sanity Studio, as a decoupled way to manage content,
    abandoning the monolithic approach that was pervasive for many years. Then we
    showed how its proprietary query language, GROQ, created an easy and terse way
    to interact with content and Sanity schemas.'
  - '[PAGE 232]


    Next, we compared GROQ with the familiar **Standard Query Language (SQL)**. We
    introduced GraphQL, as a new way to query content as a specification, breaking
    away from RESTful. We introduced the GraphQL Playground as a way to easily and
    quickly create GraphQL queries and visualize results.


    Next, we introduced Gatsby, a framework for creating websites and apps, showing
    how, through its extensive collection of plugins, it is able to source multiple
    pieces of data, such as files on the filesystem, Sanity, and other headless content
    management systems such as Drupal. We showed how Gatsby can use GraphQL to source
    content from the content source, such as with Sanity. We learned how to create
    parts of pages using underlying React framework components and how they work together
    to generate pages. We learned how Gatsby integrates cascading style sheets using
    CSS frameworks such as Tailwind. We also showed how Alexa can integrate with Sanity,
    enabling speech-to-text on Amazon devices.


    Lastly, we learned how to use the powerful Netlify continuous delivery cloud-based
    hosting platform. We learned how it connects to GitHub and can automatically deploy
    a website whenever updates are made to its source code and how to use its collection
    of plugins to minify content, generate site maps, and even launch testing tools,
    such as Lighthouse.

    Now, let''s take a quick look at the Jamstack ecosystem, and learn about a few
    of the exciting upcoming events and features on its various platforms.


    # # The Jamstack''s future


    The growth of the Jamstack, at the time of writing, is very evident. In the next
    section, we''ll learn about some of the new technologies and trends emerging within
    the community.


    # # Jamstack, JAMstack, and JAM Stack


    We hope that you have enjoyed reading this book. There are many topics we would
    have liked to have covered, because the Jamstack is a constantly evolving concept.
    Many of the code examples may be improved upon as the various frameworks mature
    and newer versions are released. We wrote this book split between two time zones,
    one in the United States and one in Europe. We also wrote this book during a difficult
    time in the history of the world, when a pandemic caused massive lockdowns.


    Despite these difficulties, we have shown that technical collaboration is possible
    in any situation. In fact, the state of the art regarding cloud-based and networking
    technology has been pushed to its limits. It has, in a way, been brought to the
    forefront, both in the news and in many industries. The time for the Jamstack
    arrived—digital consumers want responsive and adaptive content as fast as possible.'
  - '[PAGE 233]


    <!-- no content -->'
  - '[PAGE 234]


    # The future of Sanity


    Sanity Studio has evolved tremendously during the writing of this book, so the
    screenshots in this book reflect the latest version of the Studio user experience.
    Sanity will continue to focus on content as being similar to a fluid substance
    that fills its container, and not the container itself, which has, for many years,
    been the traditional web page. Knut Melvaer, head of developer relations and support
    at Sanity, writes the following:


    > "Our position is that the future of Jamstack should embrace structured content
    and move away from the page approach to content modeling. That is, tooling should
    better allow for the reuse of content and design based on rules rather than manual
    editorial work."


    We are excited to see what will come as Sanity continues to grow at a very rapid
    pace. Next, we will look at the exciting evolution of GraphQL''s tools.


    # The future of GraphiQL


    **Graphiql 2** will be the next version of Graphiql, the tool used for designing
    GraphQL queries. It will eventually merge features of the GraphiQL experience
    with the GraphQL Playground experience. Prisma, the company that developed GraphQL
    Playground, has donated it to the official GraphQL Foundation. Currently, the
    maintainer, Rikki Schulte, is focusing on reducing the need for GraphiQL or web-based
    IDEs entirely, by improving its language server and its reference implementation,
    which is the vscode-graphql extension, with many installations, and is preparing
    it to become the official GraphQL extension for the VSCode editor.


    That project is located at `https://github.com/graphql/graphiql`.


    # The Jamstack community resources


    Unfortunately, there are not enough books yet written on the Jamstack, as it is
    an emerging technology, but there are several that will be coming soon.


    Here is a very short list of ways to learn more about the Jamstack community:


    +   - **Websites:** There is a growing number of websites that compare *Jamstack
    compatible* content management systems. Here are two examples:

    +     - **CMS Comparison:** `https://cms-comparison.io`

    +     - **Headless CMS:** `https://headlesscms.org`'
