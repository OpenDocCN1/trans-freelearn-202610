  - '[PAGE 40]


    There are five sections to be explored. Let''s take a look at each one in turn.


    # Usage


    In this section of the page, the resource usage presented as bandwidth in **kilobytes
    (KB)**, **megabytes (MB)**, or **gigabytes (GB)** for this project is shown.


    There are currently seven charts available, with the following data:


    +   - **Resource Usage:**

    +     **Document used** (a donut chart)

    +     **Assets used** (a donut chart)

    +   - **Usage this month:**

    +     **Bandwidth** (an area graph)

    +     **API Requests** (an area graph)

    +     **API CDN Requests** (an area graph)

    +   - **Asset and document history:**

    +     **Documents** (an area graph)

    +     **Assets** (an area graph)


    Bandwidth, document, and request statistics are updated once every hour. Asset
    statistics are updated once a day.


    # Members


    On the **Members** page, all members of the current project are displayed. Here,
    users may invite and remove members, depending on their role. When adding a new
    member, they may choose the type of access level for this member.


    There are three permissions that can be set, as follows:


    +   - **Administrator**: A user with this role can fully manage the current project
    and its aspects.

    +   - **Read + Write**: A user with this role can read from and write to all datasets
    of the current project.

    +   - **Read**: A user with this role can only read from all datasets of the current
    project.'
