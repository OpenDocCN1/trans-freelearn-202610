    \ 1.0.0 to 2.0.0.\n- The *minor* version increments by one when a developer introduces\
    \ a backward-compatible new functionality. The version changes from 1.0.0 to 1.1.0.\n\
    - The *patch* version increments by one when a developer introduces a backward-compatible\
    \ bug fix. The version changes from 1.0.0 to 1.0.1.\n\nNext, we will see how to\
    \ install a package from npm.\n\n### Installing a package from npm\n\nTo install\
    \ a package from npm, from your Terminal, run the following command:\n\n```\n\
    npm i <package_name>\n```\n\nHere, <package_name> is the name of the package.\
    \ For example, if you would like to install a package from npm called birdie-hop,\
    \ you can run the following command on your Terminal:\n\n```\nnpm i birdie-hop\n\
    ```\n\nWith the preceding command, npm will get the latest stable release of the\
    \ birdie-hop package into your application.\n\nAdding the version with no character\
    \ before the version will download that exact version if you have never installed\
    \ the plugin in your app, or it will update the package to that very same version.\
    \ Now, have a look at this code snippet:\n\n```\nnpm i birdie-hop@~1.2.3\n```\n\
    \nThe tilde (~) tells npm that it can install or update the package to the latest\
    \ patch release available. In this case, the version will be >1.2.3 and <1.3.0.\
    \ Next, have a look at the following code snippet:\n\n```\nnpm i birdie-hop@^1.2.3\n\
    ```\n\nThe caret (^) tells npm that it can install or update the package to the\
    \ latest minor release available. In this case, the version will be >1.2.3 and\
    \ <2.0.0. Now, have a look at this code snippet:\n\n```\nnpm i birdie-hop@*1.2.3\n\
    ```\n\nThe asterisk (*) tells npm that it can install or update the package to\
    \ any major version available. In this case, the version will be >1.2.3 and there\
    \ is no limit on updates. Let's move on to understanding how to update a plugin.\n\
    \nBy default, the packages are going under the dependencies array and will be\
    \ required by your application in production. You can also set up packages that\
    \ are only needed in your local development environment or on your testing environment,\
    \ such as automated testing packages. This package will go under the devDependencies\
    \ array in the packages.json file and can be added by adding the --save-dev flag,\
    \ as follows:\n\n```\nnpm i birdie-hop --save-dev\n```\n\n### Updating a plugin\n\
    \nWhen a plugin releases an update, we can update our plugin via npm. To update\
    \ all packages listed in the package.json file, run the following command:\n\n\
    ```\nnpm update\n```\n\nTo update a single package, run the following command:\n\
    \n```\nnpm update <package_name>\n```\n\nHere, <package_name> is the name of the\
    \ package you want to update. If you want to update the `birdie-hop` package,\
    \ you can run the following command:\n\n```\nnpm update birdie-hop\n```\n\nDuring\
    \ updating or installation, npm will check the `package.json` file and download\
    \ or update a plugin to the allowed version.\n\n## The package.lock file\n\nWhen\
    \ you are working in a team, you want all the developers in your team to use the\
    \ same package versions. In this situation, the `package.lock` file comes in handy.\
    \ It is automatically generated when you modify the `package.json` file or the\
    \ `node_modules` folder. It lists all the exact versions of the packages the application\
    \ should use. The `package.lock` file will avoid a situation where two developers\
    \ in the same team working on the same project use two different versions of the\
    \ `birdie-hop` package.\n\nIn this section, we have explored the main components\
    \ of a package. We learned where to find the packages and how to install them.\
    \ We learned about package versioning and how to install and update a specific\
    \ package to a specific version. We have also explored how `package.json` and\
    \ `package.lock` files play an important role in making sure your application\
    \ gets the right package with the right version.\n\nIn the next section, we will\
    \ install a package in our Gatsby application.\n\n## Searching, installing, and\
    \ configuring plugins\n\nIn this section, we will explore the Gatsby public plugin\
    \ repository. We will look at how to install a Gatsby plugin and where to find\
    \ the configuration for the plugins you would like to install.\n\nWe will install\
    \ and configure the `gatsby-source-filesystem` and `gatsby-source-drupal` plugins\
    \ and see how we can use them.\n\n## The Gatsby Plugin Library\n\nGatsby also\
    \ provides a plugin library, a collection of npm packages tagged with the *Gatsby*\
    \ keyword. In this library, it is possible to find standard plugins that will\
    \ be used on most sites, related to **Search Engine Optimization (SEO)**, **Really\
    \ Simple Syndication (RSS)**, social media buttons, third-party comment services,\
    \ e-commerce integration, and more.\n"
  mdcn: "\n\n同样地，我们可以使用场地名称查询事件，如下面的代码片段所示。这与*第6章“Sanity的GraphQL Playground”*中的示例类似：\n\
    \n```\nquery MyQuery {\n  sanityEvent(venue: {name: {eq: \"Will's Pub\"}}) {\n\
    \    name\n  }\n}\n```\n\n同样，结果将如前面代码片段的`name`字段所请求的那样，显示事件的名称，如下所示：\n\n```\n\"\
    data\": {\n    \"sanityEvent\": {\n      \"name\": \"The Applesead Cast\"\n  \
    \  \"venue\": {\n      \"name\": \"Will's Pub\"\n    }\n  }\n}\n```\n\n这两个示例清楚地展示了GraphQL如何在Gatsby中使用，提供了一种通过GraphQL查询Sanity来源的简便方法。\n\
    \n## 总结\n\n在本章中，我们了解了Gatsby Sanity来源插件，以及它如何使用GraphQL与Sanity交互并从中导入内容。我们学习了如何在Gatsby环境中使用基于Web的GraphQL应用程序来测试和编写GraphQL查询。我们还学习了GraphQL如何通过其GraphQL\
    \ API获取Sanity的内容。\n\n在下一章中，我们将学习Gatsby如何从文件系统和**内容管理系统**（CMS）等来源获取额外内容，因为我们距离使用Gatsby构建网站的目标越来越近。\n\
    \n## 9\n\n## Gatsby来源插件\n\n在本章中，我们将解释如何通过使用插件来扩展Gatsby的功能。我们将首先探讨插件的基础知识，然后了解如何安装和维护插件。我们将探索在哪里可以找到插件，以及Gatsby如何管理其插件。在本章末尾，我们将为Gatsby应用程序安装并配置两个新插件。\n\
    \n本章将涵盖以下主题：\n\n- 了解插件\n- 搜索、安装和配置插件\n\n## 技术要求\n\n为了透彻理解本章，我们需要以下内容：\n\n- 一个终端应用程序\n\
    - npm\n- 已安装的Gatsby应用程序。\n\n本章的代码文件可以在 https://github.com/PacktPublishing/Jumstart-Jamstack-Development/tree/chapter_nine\
    \ 找到。\n\n> 注意：\n> 仅当您拥有Drupal网站时，Drupal部分才相关。GitHub链接：https://github.com/PacktPublishing/Jumstart-Jamstack-Development/tree/chapter_nine_drupal。\n\
    \n启用了以下模块的Drupal应用程序：\n\n- RESTful Web Services\n- JSON:API\n- Serialization\n\
    \n### 了解插件\n\n在本节中，我们将探讨插件的基础知识、什么是插件，以及为什么项目中需要插件。我们将探索npm这个开源代码的公共集合。我们将解释语义化版本控制如何工作以及为什么它很重要。然后我们将看到如何安装和维护插件。\n\
    \n**Gatsby插件**是Node.js包，是一组JavaScript和**超文本标记语言/层叠样式表（HTML/CSS）**文件，用于扩展Gatsby的**应用程序编程接口（API）**，并为应用程序添加新功能。您可以通过安装插件来启用某项功能，也可以通过卸载插件来禁用它。\n\
    \nGatsby的可扩展特性允许您以可复用包的形式组织自定义业务逻辑，从而创建自己的插件，这将在下一节中讨论。\n\n### Node包管理器\n\n开发人员可以从npm下载插件，npm是GatsbyJS等JavaScript框架的开源代码公共集合。开发人员可以上传他们的插件，并让其他开发人员复用相同的代码。其他开发人员也可以通过修复错误或添加功能来为所使用的插件做出贡献。您还可以上传私有包到npm。\n\
    \n您可以通过以下网站上的搜索工具在npm上搜索插件：\n\n```\nhttps://www.npmjs.com\n```\n\n在上述网站的**包**页面上，您可以找到包的描述，以及安装说明、依赖项和版本。在下一节中，我们将探讨使用语义化版本的包版本控制方法。\n\
    \n### 语义化版本\n\n在软件开发中，开发人员为软件的每个唯一状态分配一个唯一的版本号。对软件进行版本控制有助于开发人员选择实现其软件所需的正确版本。这也适用于软件包。\n\
    \n当创建一个包并添加到npm时，推荐的第一个版本是1.0.0。随着进一步的实现和错误修复，版本号会根据所引入更改的类型而递增。\n\n包必须遵循主版本号.次版本号.修订号（major.minor.patch）的语义化版本规则，详细说明如下：\n\
    \n- 当开发人员引入不兼容的API更改时，*主版本号*递增一。版本从1.0.0变为2.0.0。\n- 当开发人员引入向后兼容的新功能时，*次版本号*递增一。版本从1.0.0变为1.1.0。\n\
    - 当开发人员引入向后兼容的错误修复时，*修订号*递增一。版本从1.0.0变为1.0.1。\n\n接下来，我们将看到如何从npm安装包。\n\n### 从npm安装包\n\
    \n要从npm安装包，请在终端中运行以下命令：\n\n```\nnpm i <package_name>\n```\n\n在这里，<package_name>是包的名称。例如，如果您想从npm安装一个名为birdie-hop的包，可以在终端中运行以下命令：\n\
    \n```\nnpm i birdie-hop\n```\n\n使用上述命令，npm将把birdie-hop包的最新稳定版本安装到您的应用程序中。\n\n\
    如果在版本前不加任何字符，如果您从未在应用程序中安装过该插件，则会下载该确切版本；否则会将包更新到该相同版本。现在，请看这个代码片段：\n\n```\nnpm\
    \ i birdie-hop@~1.2.3\n```\n\n波浪号（~）告诉npm它可以安装或更新包到可用的最新修订版本。在这种情况下，版本将大于1.2.3且小于1.3.0。接下来，请看下面的代码片段：\n\
    \n```\nnpm i birdie-hop@^1.2.3\n```\n\n插入符号（^）告诉npm它可以安装或更新包到可用的最新次版本。在这种情况下，版本将大于1.2.3且小于2.0.0。现在，请看这个代码片段：\n\
    \n```\nnpm i birdie-hop@*1.2.3\n```\n\n星号（*）告诉npm它可以安装或更新包到任何可用的主版本。在这种情况下，版本将大于1.2.3，并且对更新没有限制。让我们继续了解如何更新插件。\n\
    \n默认情况下，包会进入dependencies数组中，并在生产环境中被您的应用程序需要。您还可以设置仅在本地开发环境或测试环境中需要的包，例如自动化测试包。该包将进入package.json文件中的devDependencies数组，并可通过添加--save-dev标志来添加，如下所示：\n\
    \n```\nnpm i birdie-hop --save-dev\n```\n\n### 更新插件\n\n当插件发布更新时，我们可以通过npm更新插件。要更新package.json文件中列出的所有包，请运行以下命令：\n\
    \n```\nnpm update\n```\n\n要更新单个包，请运行以下命令：\n\n```\nnpm update <package_name>\n\
    ```\n\n在这里，<package_name>是您想要更新的包的名称。如果您想更新`birdie-hop`包，可以运行以下命令：\n\n```\nnpm\
    \ update birdie-hop\n```\n\n在更新或安装过程中，npm将检查`package.json`文件，并下载或更新插件到允许的版本。\n\
    \n## package.lock文件\n\n当您在团队中工作时，您希望团队中的所有开发人员使用相同的包版本。在这种情况下，`package.lock`文件就派上了用场。当您修改`package.json`文件或`node_modules`文件夹时，它会自动生成。它列出了应用程序应使用的所有包的精确版本。`package.lock`文件将避免同一团队中两个开发人员在同一项目上使用不同版本的`birdie-hop`包的情况。\n\
    \n在本节中，我们探讨了包的主要组成部分。我们学习了在哪里可以找到包以及如何安装它们。我们学习了包版本控制，以及如何将特定包安装或更新到特定版本。我们还探讨了`package.json`和`package.lock`文件在确保您的应用程序获得正确版本的正确包方面所发挥的重要作用。\n\
    \n在下一节中，我们将为Gatsby应用程序安装一个包。\n\n## 搜索、安装和配置插件\n\n在本节中，我们将探索Gatsby公共插件库。我们将了解如何安装Gatsby插件，以及在哪里可以找到要安装插件的配置。\n\
    \n我们将安装并配置`gatsby-source-filesystem`和`gatsby-source-drupal`插件，并了解如何使用它们。\n\n##\
    \ Gatsby插件库\n\nGatsby还提供了一个插件库，这是一个带有*Gatsby*关键字标记的npm包的集合。在这个库中，可以找到大多数站点都会使用的标准插件，与**搜索引擎优化（SEO）**、**真正简单的聚合（RSS）**（Really\
    \ Simple Syndication，RSS）、社交媒体按钮、第三方评论服务、电子商务集成等相关。\n\n"
