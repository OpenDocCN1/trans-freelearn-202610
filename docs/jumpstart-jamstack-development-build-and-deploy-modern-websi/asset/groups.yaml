  - '[PAGE 180]


    # Invocation


    The invocation name is the keyword we need to interact with our skill. Our invocation
    name is `jumpstart jamstack`, so we can say Alexa, open jumpstart jamstack:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_180_0.png)


    Figure 12.10 – Alexa skill interface: Invocation tab


    # Interaction model


    In the interaction model, we can set out intents and utterances. The following
    four default built-in intents are created with any Alexa skill:


    +   - `CancelIntent`

    +   - `HelpIntent`

    +   - `StopIntent`

    +   - `NavigateHomeIntent`


    `CancelIntent` and `StopIntent` are similar and are called when you want to stop
    an interaction. For example, when Alexa is reading a set of news for you, you
    can say, Alexa stop and Alexa will stop reading the news, or while you are listening
    to music through Alexa, `StopIntent` and `CancelIntent` are called when you want
    to stop the playback.


    `HelpIntent` is used when you would like to know more about a skill and what utterances
    are available.'
  - '[PAGE 181]


    NavigateHomeIntent is used when you are using a multi-level skill and you would
    like to go back to the top menu of the skill.


    In our list of intent, we also have our default HelloWorldIntent, which contains
    seven utterances. Let’s now add GetUpcomingEventIntent:


    +   1. Click on the Add Intent blue button above the intent list:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_181_0.png)'
  - '[PAGE 182]


    2. In our **Create custom intent** section, add the name of the intent as GetUpcomingEventsIntent.
    Then, click the blue **Create custom intent** button:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_182_0.png)


    Amazon also provides a set of intents that can be used for certain skills such
    as weather, video, and audio.


    Now that we have created our custom intent, we can start adding our utterances.


    A user may ask, *Alexa, ask jumpstart jamstack for the upcoming events*, or *Alexa,
    ask jumpstart jamstack to tell me the upcoming events*.


    We can add as many utterances as we would like. For this example, let’s add the
    following utterances:


    +   - list me the upcoming events

    +   - tell me the upcoming events

    +   - what are the upcoming events


    To add an utterance, execute the following steps:'
  - '[PAGE 183]


    1. Write it in the **Sample Utterances** textbox and then press the **+** button
    on the right of the textbox. If you don''t click on the **+** button, the utterance
    will not be added:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_183_0.png)


    Figure 12.13 - Alexa skill interface Intents page


    Now you should have three utterances added to your intent.


    2. Click on the **Save Model** button above the **Intents** form and then click
    on **Build Model** beside the **Save Model** button:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_183_1.png)


    Figure 12.14 - Alexa skill interface Intents page


    Now our Intent has been added and the model has been built and is ready to be
    used in our Alexa service.'
  - '[PAGE 184]


    In this section, we have created a new intent to retrieve our events and we have
    rebuilt the model to activate the new intent. In the next section, we will check
    the intent history.


    # Intent history


    Clicking on the Intent History link on the left-hand side menu, you can check
    all the frequent intent requests done to your skill in the last 30 days. You can
    check Unresolved Utterances and Resolved Utterances. From here, you can improve
    your intent utterances:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_184_0.png)


    Figure 12.15 – Alexa skill Intent History page


    # Utterance conflicts


    Clicking on Utterance Conflicts on the left-hand side menu, you can see whether
    there are conflicting utterances between intentions:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_184_1.png)


    Figure 12.16 – Alexa skill Utterance Conflicts page'
  - '[PAGE 185]


    # JSON Editor


    Clicking on JSON Editor on the left-hand side menu, you can also create intents
    via JSON code. This is useful when you want to import an existing intent quickly
    from another skill:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_185_0.png)'
  - '[PAGE 186]


    # Slot types


    Slots can see a variable passed via an utterance. By default, Amazon provides
    many slot types, such as number, city, and country, that are recognized by Alexa.
    You can also create a custom slot type and process it at your convenience.


    An example of a slot type can be found in a weather skill when you enquire about
    the weather in a particular city.


    In your WeatherByCity intents, you don''t need to add an utterance for each city
    in the world, and you can pass it as a variable:


    # Slot Types


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_186_0.png)


    Figure 12.18 – Alexa skill Slot Types page


    # Endpoint


    **Endpoint** will receive the JSON payload request. We can leave the default here
    as we are using an AWS Lambda function.'
  - '[PAGE 187]


    If you want to host your Alexa service somewhere other than AWS, you can select
    the **HTTPS** option:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_187_0.png)


    Figure 12.19 – Alexa skill Endpoint page'
  - '[PAGE 188]


    # Code


    Now that we have explored the Build section, let''s jump to the Alexa service
    part, which is our Node.js code:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_188_0.png)


    Figure 12.20 – Alexa skill Code page


    As you can see, the interface provides a code editor where we can implement our
    Alexa service.


    In our index.js file, we can create the handlers for our intent. Any new intent
    we add can be implemented here. Alexa provides an API to handle the request. It''s
    called the ask-sdk-core API. The requests are inside the handlerInput JSON object.


    The handler will process our intent and, from here, will make the Sanity call
    to our Sanity dataset.


    At the top of our index.js file, we require ask-sdk-core:


    ```

    const Alexa = require(''ask-sdk-core'');

    ```'
  - "[PAGE 189]\n\nThe handler includes two functions: the `canHandle()` function\
    \ checks whether this handler can process this request by checking the type of\
    \ request, and the `handle()` function will process the request and return a response:\n\
    \n```\n```\nconst MyCustomHandler = {\n    canHandle(handlerInput) {\n       \
    \ return Alexa.getRequestType(handlerInput.\nrequestEnvelope) === 'MyRequestType'\
    \ && Alexa.\ngetIntentName(handlerInput.requestEnvelope) === 'MyIntent';\n   \
    \ }\n};\n```\n```\n\nIn our `canHandle()` function, we get the request type and\
    \ the request name using the `ask-sdk-core` API.\n\nIf both conditions are true,\
    \ it means that this handler can handle the request, so we implement the `handle()`\
    \ function:\n\n```\n```\nconst MyCustomHandler = {\n    canHandle(handlerInput)\
    \ {\n        return Alexa.getRequestType(handlerInput.\nrequestEnvelope) === 'MyRequestType'\
    \ && Alexa.\ngetIntentName(handlerInput.requestEnvelope) === 'MyIntent';\n   \
    \ },\n    handle(handlerInput) {\n        const speakOutput = 'This is my custom\
    \ text response';\n        return handlerInput.responseBuilder\n            .speak(speakOutput)\n\
    \            .getResponse();\n    }\n};\n```\n```\n\nIn this simple example, we\
    \ are just returning a text. The response we built using the `responseBuilder()`\
    \ function passes the text to the `speak()` function and the `getResponse()` function\
    \ will build the response."
  - "[PAGE 190]\n\nThe first handler we found in our file is LaunchRequestHandler.\
    \ This handler is called when you open the skill with the command *Alexa, open\
