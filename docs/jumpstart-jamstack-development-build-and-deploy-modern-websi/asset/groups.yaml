    illustrated in the following screenshot:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_42_0.png)


    Clicking on the Pencil sign will open a pop-up where you can choose to add a **Blog
    post**, an **Author**, or a **Category**.


    From the **Search** field, you can look for any **Blog post**, **Author**, and
    **Category**.'
