  - '[PAGE 17]


    Chapter 12, APIs – Alexa Skills, teaches you how to build the Jumpstart Jamstack
    Alexa skill. As an example, you would be able to ask for the upcoming five events.
    Through this example, you will be able to extend the current skill by retrieving
    past events, or all events, and you will also be able to create a new skill for
    any other application you have.


    Chapter 13, Tying It All Together, teaches you how to modify the CSS and the final
    elements of the website, and how to configure and release a GatsbyJS production
    build.


    Chapter 14, Deployment Using Netlify and Azure, will introduce the Netlify serverless
    continuous deployment hosting service. You will learn how to connect your websites''
    repositories to Netlify and how Netlify prepares and combines the various files
    into a fast, efficiently performing, single static file.


    Chapter 15, Conclusion, will summarize the concepts learned throughout the book,
    discuss how the pieces fit together, and explore how the Jamstack community is
    evolving. The chapter will discuss various external projects and how to contribute
    to them.


