  mdcn: "\n## 清理代码\n\n由于事件列表和事件表单的源代码最终可能在网站的多处复用，我们可以通过为各自创建单独的组件来重构代码。\n\n在 `web/src/components`\
    \ 文件夹中，创建两个文件：`event-list.js` 和 `event-form.js`。这两个文件的格式相似。\n\n事件列表模块的基本格式如下面的代码块所示：\n\
    \n```\nimport { Link } from \"gatsby\";\nimport React from \"react\";\nconst {\
    \ format } = require('date-fns')\n\nfunction EventList(props) {\n\n    return\
    \ (\n      ...\n    )\n}\n\nEventList.defaultProps = {\n    title: '',\n    eventNodes:\
    \ [],\n}\n\nexport default EventList\n```\n\n事件表单模块的基本格式如下所示：\n\n```\nimport React\
    \ from \"react\";\n\nfunction EventForm(props) {\n    return (\n      ...\n  \
    \  )\n}\n```\n\n```\nEventForm.defaultProps = {\n  title: '',\n  venueNodes: [],\n\
    }\n\nexport default EventForm\n```\n\n事件表单和事件列表的源代码将被插入到 return 中。由于 JSX 需要一个根节点，因此添加了开始和结束的\
    \ `<div>` 标签：\n\n```\nreturn (\n  <div>\n    <h2 className='font-serif text-4xl\
    \ font-bold text-gray-800 bb-10'>{props.title}</h2>\n    <div className='max-w-full'>\n\
    \      ...\n    </div>\n  )\n```\n\n要使用这两个新创建的组件，需要导入它们：\n\n```\nimport EventList\
    \ from '../components/event-list'\nimport EventForm from '../components/event-form'\n\
    ```\n\n现在，事件列表和事件表单可以用这些组件替换。节点和标题将作为属性传递给这些组件：\n\n```\n<EventList\n  eventNodes={eventNodes}\n\
    \  title='Events'\n/>\n\n<EventForm\n  venueNodes={venueNodes}\n  title='Add an\
    \ Event'\n/>\n```\n\n```\n</label>\n</div>\n\n<div className='mt-10 block'>\n\
    \  {isVisible && <label className=''>Event Venue:\n    <select className='form-select\
    \ block w-full mt-1' name='venue' id={`venue`}>\n      {props.venueNodes &&\n\
    \        props.venueNodes.map((venue) => (\n          <option value={venue._id}>{venue.name}</option>\n\
    \        ))}\n    </select>\n  </label>\n}\n</div>\n```\n\nHTML 的 onClick 事件属性被添加到切换输入上，传入\
    \ isVisible 布尔变量的相反值（！）：\n\n```\nonClick={() => toggleVisible(!isVisible)}\n```\n\
    \n如果 isVisible 的值为 true，则显示事件场地选择和标签；否则，它们会被隐藏。\n\n## 总结\n\n在本章中，我们学习了如何使用 Tailwind\
    \ CSS 框架为现代设计和响应式布局设置网站样式，与从传统 CSS 开始相比节省了时间和精力。接下来，我们学习了如何将页面片段提取为单独的组件。最后，我们为表单本身添加了动态功能。\n\
    \n为用户体验添加样式和打磨是一个深奥的主题，因此超出了本书的范围。你可以随意阅读 Tailwind CSS 文档，以了解更多改进外观的方法。此外，即使使用\
    \ Gatsby 可以充分利用的其他 React 元素，也可能帮助将这个原型构建成一个完整的网站——你已拥有所需的全部工具。\n\n在下一章中，我们将使用\
    \ Netlify 部署网站，并了解它在自动化许多以前需要手动执行的任务方面的实用性。\n\n## 14 使用 Netlify 和 Azure 进行部署\n\
    \n在上一章中，我们为部署准备了网站。我们使用 Tailwind CSS 为组件添加了样式。最后，我们清理了布局并将代码重构为组件。现在，我们可以更仔细地了解本书中使用的\
    \ Jamstack 的最后一个组件：**Netlify**。Netlify 被用作在 [https://sanity.io/create](https://sanity.io/create)\
    \ 创建的 *使用 Gatsby 的博客*示例的默认平台。在撰写本书时，Microsoft 已添加 Static Web Apps 服务，为部署提供了另一种选择。由于\
    \ GitHub 和 Azure 均归 Microsoft 所有，Static Web Apps 服务与 GitHub 之间有极佳的集成。\n\n本章首先介绍\
    \ Netlify 无服务器持续部署托管服务，它自动化了许多以前需要开发或手动执行的任务，然后演示 Azure Static Web Apps，作为可能已在使用\
    \ Azure 或想要尝试这项新服务的开发者的另一种选择。\n\n我们将在本章中介绍的主要主题如下：\n\n- Netlify 简介\n- Netlify\
    \ 插件\n- 通过 netlify.toml 文件进行高级配置\n- 通过命令行部署 Netlify\n- Azure Static Web Apps 部署\n\
    \n### 技术要求\n\n要在 Netlify 上部署项目，你必须在 https://www.netlify.com/ 拥有一个账户。要在 Azure 上部署项目，你必须在\
    \ https://azure.microsoft.com/en-us/ 创建一个账户。\n\n此外，还需要一个终端程序。\n\n### Netlify 简介\n\
    \n对于刚接触 Web 开发的人来说，Netlify 最初看起来只是一个部署和托管平台。\n\n事实上，Netlify 网站可以是一个简单的静态文件 Web\
    \ 主机。使用 Netlify 的拖放功能，只需几秒钟即可将包含 Web 文件的文件夹部署为一个真实、可运行且已托管的网站，如下所示：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_214_0.png)\n\
    \n图 14.1 – Netlify 的拖放部署界面\n\n然而，虽然它是托管网站的地方，但其功能远不止于此。\n\n首先，在幕后，当我们最初创建 Sanity\
    \ 和 Gatsby 生成的网站时，Sanity 和 Gatsby 博客模板提供的代码会自动运行它，从而在 Sanity 和 Netlify 之间建立集成。\n\
    \nSanity Studio 和 Gatsby 生成的网站都被立即构建并托管在 Netlify 的服务器上，并且我们可以在需要时轻松自动地部署网站的新版本。通过连接\
    \ Sanity 的管理工具和 Netlify 的集成，当我们在 Sanity 中更改内容时，就可以构建新版网站。此外，通过 GitHub 设置了一个钩子或触发器，每当\
    \ Gatsby 源代码被推送到 GitHub 时，它都会自动部署新版网站。\n\n其次，Netlify 是构建在 Amazon Web Services（AWS）之上的无服务器持续交付服务。这意味着\
    \ AWS 提供的所有基础设施都会自动融入 Netlify 的托管能力。也就是说，Netlify 在世界各地都有服务器（也称为云），以尽可能快的方式向所有网站用户提供内容。\n\
    \n然而，这两个方面只是故事的开始。在构建过程中，Netlify 可以通过脚本以多种语言运行许多不同类型的代码来增强你的网站，如以下截图所示：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_215_0.png)\n\
    \n图 14.2 – Netlify 构建输出的摘录\n\n当需要预构建的代码片段来构建静态页面时，这非常有用。例如，可以使用 PHP 编程语言提取或预处理格式化数据，甚至静态生成网站。因此，JavaScript\
    \ 编程语言并不是部署期间的唯一选择。\n\n重要的是要记住，代码只能在部署时在 Netlify 上运行。因此，像 WordPress 这样的传统内容管理系统无法在\
    \ Netlify 上运行，因为它需要服务器端代码在每次页面请求时运行。\n\n一个不错的功能是能够进行 A/B 测试。这可以通过在 GitHub 中使用两个分支来实现。假设你想测试特定颜色对网站访问者需要点击的按钮性能的影响。你可以在\
    \ GitHub 中设置两个不同的分支，让 Netlify 随机选择其中一个。\n\nNetlify 提供的另一个功能是一种将代码片段插入页面头部或正文的简单方法。这种用途的一个示例是粘贴\
    \ Google Analytics 在页面中正常工作所需的代码片段。\n\n接下来，让我们了解如何利用 Netlify 通过其插件提供的各种功能。\n\n"
