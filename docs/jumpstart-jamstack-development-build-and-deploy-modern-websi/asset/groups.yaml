    Finally, as the output also states, by adding the --prod flag, deploy will be
    deployed and replace the current version in production if the deployment succeeds.


    ```

    netlify deploy --prod

    ```


    Additionally, in order to open the URL in the browser, add the --open flag as
    before:


    ```

    netlify deploy --prod --open

    ```


    The output from this command will be similar to the following:


    ```

    Deploy path:          /home/chris/jumpstart-jamstack/hands-on-jamstack/web/public

    Configuration path: /home/chris/jumpstart-jamstack/hands-on-jamstack/netlify.toml

    Deploying to main site URL...

    Finished hashing 1 files

    CDN requesting 0 files

    Finished uploading 0 assets

    Deploy is live!

    Logs:                 https://app.netlify.com/sites/jumpstart-jamstack-web/deploys/5f3cb84fbdd067963e250875

    Unique Deploy URL: https://5f3cb84fbdd067963e250875--jumpstart-jamstack-web.netlify.app

    Website URL:         https://jumpstart-jamstack-web.netlify.app

    ```


    Unique Deploy URL provides a way to rollback to this particular deployment in
    the future, while Website URL, as expected, is the newly deployed version of the
    website.


    In this section, we have learned how to build and deploy on Netlify using the
    command line. Next, we will learn another way to deploy Jamstack websites using
    Azure.


