  - "[PAGE 218]\n\nThe log output is extremely useful for learning about what is performed\
    \ during deployment and whether there are any warnings or errors. The Netlify\
    \ deployment will be stopped if there are any errors to ensure that no website\
    \ will be deployed.\n\nThe following is the code once Netlify Minify HTML is executed:\n\
    \n```\n<h1 hidden>Welcome to My new blog</h1><div class=blog-post-preview-list-module--root--2LgDr><h2\
    \ class=blog-post-preview-list-module--headline--3j8kB>Latest blog posts</h2>\n\
    ```\n\nCompare this to the minified code earlier in this chapter. Netlify Minify\
    \ HTML removes the quotation marks when the HTML tag attribute is a continuous\
    \ string (without spaces) and also removes comments, so <!-- --> is removed. The\
    \ final result is a smaller file. This is just one example of the many ways whereby,\
    \ as a result of using Netlify plugins, we can improve the resultant static content\
    \ and enhance its functionality. Exploring the plugins will open up many new possibilities.\n\
    \nNext, we will begin to explore, more deeply, the configuration options available\
    \ for Netlify's features.\n\n# Advanced configuration through the netlify.toml\
    \ file\n\nWhile the Netlify web interface is easy to use, for more control over\
    \ the deployment process, a netlify.toml file can be used, which uses Tom's Obvious,\
    \ Minimal Language format.\n\nLet's now learn how to create and use this configuration\
    \ file to access the advanced features of Netlify.\n\nCreate a file in the project's\
    \ root directory named netlify.toml. Here is an example of the file contents:\n\
    \n```\n[[plugins]]\n  package = \"netlify-plugin-minify-html\"\n\n  # Specify\
    \ which deploy contexts we'll minify HTML in.\n  # Supports any Deploy Contexts\
    \ available in Netlify.\n  # https://docs.netlify.com/site-deploys/overview/#deploy-contexts\n\
    \  [plugins.inputs]\n    contexts = [\n```"
  - "[PAGE 219]\n\n```\n```toml\n'production',\n'branch-deploy',\n'deploy-preview'\n\
    ]\n\n[plugins.inputs.minifierOptions]\n    removeComments = false\n    collapseInlineTagWhitespace\
    \ = false\n```\n```\n\nThe [[plugins]] annotation is used for each plugin. Next,\
    \ [[plugins.inputs]] is used to determine the contexts for which the plugin will\
    \ be activated. For example, when developing locally, Minify is usually not required,\
    \ so the plugin will only be triggered in just the production and preview contexts.\n\
    \nNext, the [plugins.inputs.minifierOptions] section of the plugin configuration\
    \ allows us to customize the plugin even more. Since, by default, removeComments\
    \ is set to true, this option can be set to false by using the removeComments\
    \ = false option.\n\nWe may use the Netlify command-line tool once again, but\
    \ this time by typing the following command in the project's root directory:\n\
    \n```\n```shell\nnetlify build\n```\n```\n\nThe preceding command triggers the\
    \ build locally, combining the netlify.toml configuration and the plugins that\
    \ are configured in Netlify's plugin list for the website.\n\nHere is the relevant\
    \ excerpt from the output of netlify build:\n\n```\n```text\n┌──────────────────────────────────────────────────────────────┐\n\
    │ 2. onSuccess command from netlify-plugin-minify-html         │\n└──────────────────────────────────────────────────────────────┘\n\
    \nMinifying HTML in the deploy context: production\nMinifying HTML with these\
    \ options: { removeComments: false }\n\n(netlify-plugin-minify-html onSuccess\
    \ completed in 259ms)\n\n┌───────────────────────────────┐\n│       Netlify Build\
    \ Complete  │\n└───────────────────────────────┘\n\n(Netlify Build completed in\
    \ 19.8s)\n```\n```"
