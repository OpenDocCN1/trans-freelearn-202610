    \nThe Sanity create page can be called by using the following format, where template\
    \ is a parameter and chrispecoraro/sanity-template-jigsaw-blog is the GitHub repository:\
    \ https://www.sanity.io/create?template=chrispecoraro/sanity-template-jigsaw-blog.\n\
    \nThe community templates are located at this page near the bottom: https://www.sanity.io/create:\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_237_0.png)\n\nFigure 15.1 – Sanity\
    \ starter kits\n\n### Migration and integration\n\nIntegrating Sanity with other\
    \ code bases is easy, thanks to a set of tools available to present portable text\
    \ in different usable formats, such as hyperscript and Markdown and libraries\
    \ for PHP and .NET: https://www.sanity.io/docs/presenting-block-text.\n\nAlso,\
    \ a set of tools for importing HTML content from other content management systems\
    \ into Sanity may be used to convert it into a format that Sanity will use as\
    \ portable text at https://www.npmjs.com/package/@sanity/block-tools.\n\n### Plugins\n\
    \nSanity also has a series of plugins, both official and community contributed,\
    \ located at https://www.sanity.io/plugins:\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_238_0.png)\n\
    \nFigure 15.2 - Gatsby plugins\n\nPlugins should be tested, uploaded as a package\
    \ to https://www.npmjs.com, and then shared in #I-made-this channel in Sanity's\
    \ Slack.\n\n### The future\n\nSanity Studio has added a feature called presence,\
    \ which shows the document modification history, which allows users to compare\
    \ any revision and revert any field.\n"
  mdcn: "\n\n## 本章摘要\n\n在本章中，我们学习了如何通过 Netlify 部署网站。我们还学习了如何安装和使用 Netlify 插件，以及如何使用\
    \ `netlify.toml` 配置文件与命令行工具。\n\n此外，我们学习了如何通过 Azure 上的 Static Web Apps 服务创建和管理\
    \ Jamstack Web 应用，以及如何通过 GitHub 管理应用重新部署。\n\n拥有多种 Jamstack 部署方案充分体现了其解耦特性。需要时，同一应用可以轻松利用多种服务。\n\
    \n在下一章中，我们将结束 Jamstack 世界的探索之旅，并讨论 Jamstack 社区的现在与未来、生态系统的其他工具与替代组件，以及正在书写未来的新兴技术与公司。\n\
    \n# 15 结语\n\n本章将总结全书涉及的概念，并介绍 Jamstack 社区的发展情况。本章将讨论各种外部项目以及如何为其做贡献。我们将涉及的主要主题如下：\n\
    \n- Jamstack 的未来\n- Jamstack 社区资源\n- 为 Jamstack 项目做贡献\n\n### 概念总结\n\n我们首先概述了 Web\
    \ 开发的历史，展示了诸如 *Server Side Includes* 等动态技术如何最终融入静态页面，增加功能。这些技术在增加动态性的同时，最终也导致了服务端负担过重，加载时间变长。接下来，我们介绍了\
    \ Sanity，一个内容交付平台，以及 Sanity Studio，一种以解耦方式管理内容的工具，摒弃了多年来普遍存在的单体架构。然后，我们展示了其专有的查询语言\
    \ GROQ 如何以简洁而紧凑的方式与内容和 Sanity 模式进行交互。\n\n接下来，我们将 GROQ 与熟悉的 **结构化查询语言（SQL）** 进行了比较。我们介绍了\
    \ GraphQL，作为一种以规范方式查询内容的新途径，突破了 RESTful 的局限。我们介绍了 GraphQL Playground，作为一种轻松快捷地创建\
    \ GraphQL 查询并可视化结果的方式。\n\n接下来，我们介绍了 Gatsby，一个用于创建网站和应用框架，展示了如何通过其丰富的插件集合获取多种数据源，例如文件系统中的文件、Sanity，以及其他诸如\
    \ Drupal 等无头内容管理系统。我们展示了 Gatsby 如何利用 GraphQL 从内容源获取内容，例如与 Sanity 的集成。我们学习了如何使用底层\
    \ React 框架组件创建页面部分，以及它们如何协同工作生成页面。我们了解了 Gatsby 如何通过 Tailwind 等 CSS 框架集成层叠样式表。我们还展示了\
    \ Alexa 如何与 Sanity 集成，从而在亚马逊设备上实现语音转文本功能。\n\n最后，我们学习了如何使用强大的 Netlify 持续交付云托管平台。我们了解了它如何连接到\
    \ GitHub，并能在源代码更新时自动部署网站，以及如何使用其插件集合进行内容压缩、生成站点地图，甚至启动诸如 Lighthouse 等测试工具。\n\n\
    现在，让我们快速浏览一下 Jamstack 生态系统，了解其各个平台上一系列令人兴奋的新兴事件与功能。\n\n### Jamstack 的未来\n\n在写这本书时，Jamstack\
    \ 的发展势头已经非常明显。在下一节中，我们将了解社区中出现的一些新技术与趋势。\n\n### Jamstack、JAMstack 与 JAM Stack\n\
    \n我们希望你喜欢阅读这本书。我们有太多主题想要涵盖，因为 Jamstack 是一个不断演进的概念。随着各种框架日趋成熟并发布新版本，许多代码示例都可能得到改进。我们是在两个时区之间撰写这本书的，一个在美国，一个在欧洲。我们写作这本书时，正值世界历史上的艰难时期，一场疫情导致了大规模的封锁。\n\
    \n尽管困难重重，我们证明了在任何情况下技术协作都是可能的。事实上，基于云和网络的技术现状已经被推向了极限。从某种意义上说，它已被推到了前台，既出现在新闻中，也出现在许多行业中。Jamstack\
    \ 的时代已经到来——数字消费者希望以最快的速度获取响应式和适应性的内容。\n\n### Sanity 的未来\n\n在本书写作期间，Sanity Studio\
    \ 已经发生了巨大的演变，因此本书中的截图反映的是 Studio 用户体验的最新版本。Sanity 将继续专注于将内容视为一种像液体一样填充容器的物质，而不是容器本身——而容器正是传统网页多年来的形态。Sanity\
    \ 开发者关系与支持负责人 Knut Melvaer 写道：\n\n> “我们的立场是，Jamstack 的未来应该拥抱结构化内容，并摆脱以页面为核心的内容建模方式。也就是说，工具应更好地允许基于规则的复用内容和设计，而不是人工编辑工作。”\n\
    \n我们很高兴看到 Sanity 将继续高速发展。接下来，我们将看看 GraphQL 工具令人兴奋的演进。\n\n### GraphiQL 的未来\n\n\
    **Graphiql 2** 将是 Graphiql（用于设计 GraphQL 查询的工具）的下一个版本。它最终将把 GraphiQL 体验的功能与 GraphQL\
    \ Playground 的体验合并。开发 GraphQL Playground 的公司 Prisma 已将其捐赠给官方 GraphQL 基金会。目前，维护者\
    \ Rikki Schulte 正专注于通过改进其语言服务器及参考实现（即安装量很大的 vscode-graphql 扩展）来减少对 GraphiQL 或基于\
    \ Web 的 IDE 的依赖，同时正将其准备为 VSCode 编辑器的官方 GraphQL 扩展。\n\n该项目位于 `https://github.com/graphql/graphiql`。\n\
    \n### Jamstack 社区资源\n\n遗憾的是，由于 Jamstack 是新兴技术，目前专门介绍它的书籍还不多，但很快会有几本问世。\n\n这里列出了一些了解\
    \ Jamstack 社区的途径：\n\n- **网站：** 越来越多的网站致力于比较*兼容 Jamstack* 的内容管理系统。这里有两个例子：\n  -\
    \ **CMS 对比：** `https://cms-comparison.io`\n  - **无头 CMS：** `https://headlesscms.org`\n\
    \n使用位于 https://www.sanity.io/docs/starter-templates 的基本说明，我们轻松创建了 https://github.com/chrispecoraro/sanity-template-jigsaw-blog，该项目使用了\
    \ Jigsaw——一个由 Tighten 创建的流行静态站点生成器（SSG），它基于 Laravel 现代 PHP 框架和 Blade 模板系统。\n\n\
    可以通过以下格式调用 Sanity 的创建页面，其中的 template 是参数，而 chrispecoraro/sanity-template-jigsaw-blog\
    \ 是 GitHub 仓库：https://www.sanity.io/create?template=chrispecoraro/sanity-template-jigsaw-blog。\n\
    \n社区模板位于此页面靠近底部的位置：https://www.sanity.io/create：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_237_0.png)\n\
    \n图 15.1 – Sanity 入门套件\n\n### 迁移与集成\n\n将 Sanity 与其他代码库集成很容易，这要归功于一组工具，它们可以以不同可用格式呈现可移植文本，例如\
    \ hyperscript、Markdown，以及用于 PHP 和 .NET 的库：https://www.sanity.io/docs/presenting-block-text。\n\
    \n此外，还可以使用一组工具将来自其他内容管理系统的 HTML 内容导入 Sanity，并将其转换为 Sanity 可用作可移植文本的格式，相关工具位于 https://www.npmjs.com/package/@sanity/block-tools。\n\
    \n### 插件\n\nSanity 还拥有一系列插件，既有官方的，也有社区贡献的，位于 https://www.sanity.io/plugins：\n\n\
    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_238_0.png)\n\n图 15.2 - Gatsby 插件\n\n\
    插件应经过测试，打包上传到 https://www.npmjs.com，然后在 Sanity 的 Slack 中 #I-made-this 频道分享。\n\n\
    ### 未来\n\nSanity Studio 新增了一项名为 presence（在场）的功能，它显示文档的修改历史，允许用户比较任何修订版本并还原任意字段。\n\
    \n"
