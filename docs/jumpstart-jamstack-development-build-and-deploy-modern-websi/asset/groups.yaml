    +   1.  Log in to `https://netlify.com`. In the horizontal menu underneath the\
    \ website name, click on the **Plugins** link:\n+   \n+       Figure 14.3 – The\
    \ horizontal menu\n+   \n+   2.  Locate the Minify HTML plugin and click on the\
    \ gray **Install** button.\n+   \n+   3.  Then, choose the project website (the\
    \ name usually ends in `~web`):\n+   \n+       Figure 14.4 – The Netlify Minify\
    \ plugin installation screen\n+   \n+   4.  When asked **Are you sure you want\
    \ to install Minify HTML**, click the green **Install** button.\n+       Now,\
