  - '[PAGE 21]


    # 1


    # History of the Jamstack


    Welcome to the **Jamstack**. This completely new web development paradigm has
    excited the information technology industry and is becoming steadily more popular,
    with new companies constantly forming around it. This book is one of the first
    of a few tutorials available focused on practical and hands-on experience with
    the Jamstack.


    A technology *stack* represents a specific collection of languages, databases,
    and operating systems, such as the LAMP stack. The acronym **LAMP** stands for
    **Linux**, an operating system; **Apache**, a web server; **MySQL**, a database;
    and **PHP**, a programming language. The Jamstack is actually not a stack in this
    sense, but rather a new methodology and toolset to produce websites and web applications.


    In this chapter, we''re going to first look at the history of the web, introduce
    the Jamstack, and discuss its advantages. To understand how the Jamstack evolved
    into what it is today, we need to look back at the more-than-two-decade history
    of the World Wide Web. Web design and web development, the two main industries
    that evolved from the World Wide Web, developed into two very popular and lucrative
    occupations, but it wasn''t always that way.'
  - '[PAGE 22]


    These are the main topics that we will cover in this chapter:


    +   - The evolution of the Jamstack

    +   - The rise of the Jamstack

    +   - Our Jamstack

    +   - Getting started with the Jamstack


    # The evolution of the Jamstack


    The evolution of the Jamstack can be easily explained by looking at how the World
    Wide Web evolved, starting with its most central component, **HyperText Markup
    Language (HTML)**.


    # HTML


    The very first web pages were simply comprised of text with HTML tags, providing
    markup instructions with the ability to link pages together. In fact, HTML is
    often mistaken by the average person as a programming language, but it was, at
    the most fundamental level, a series of symbols that represented formatting instructions.
    It still gets included in programming language lists, together with actual programming
    languages such as C and Java. It is merely a markup language, though, despite
    having evolved rapidly to now include accessibility and semantic features. This
    means that it is not much more than markup. In its earliest versions, however,
    it simply provided general formatting instructions.


    For example, we could use an h1 tag to represent the header of a page, which would
    make the text appear larger, or a bold tag to make the text bold. Each page would
    consist of text, links, and HTML tags.


    The following code snippet provides an example of this:


    ```

    <html>

    <head>

    <title>My Webpage</title>

    </head>

    <body>

    <h1>Welcome to my webpage.</h1>

    </body>

    </html>

    ```'
