    \ Sanity 的 GraphQL Playground，并学习如何使用它来创建和测试 GraphQL 查询。本章将涵盖以下主题：\n\n- GraphQL\
    \ 简介\n- GROQ 与 GraphQL\n- Sanity.io 的 GraphQL playground 基础\n\n## 技术要求\n\n需要一个网络浏览器和一个终端程序。\n\
    \n## GraphQL 简介\n\n首先，让我们开始了解 GraphQL。从 GraphQL 网站上，我们了解到 GraphQL 允许其用户描述数据。这意味着定义数据结构应如何形成。考虑以下示例：\n\
    \n```\ntype Event {\n  name: String\n  date: Date\n}\n```\n\n在这里，我们定义了事件的结构。使用\
    \ GraphQL，我们可以按如下方式查询数据结构：\n\n```\n{\n  event(name: \"Saturday Night Party\")\
    \ {\n    date\n  }\n}\n```\n\n请注意，基本结构看起来几乎相同。我们要求数据以与定义时相同的格式返回。返回的数据将具有以下格式：\n\
    \n```\n{\n  \"event\" {\n    date: \"2020-10-01\"\n  }\n}\n```\n\n> **注意：**\n\
    > 有关 GraphQL 语法和规范的更多信息，请访问 http://spec.graphql.org/draft/。\n\nGraphQL 的优势在于它使用户能够请求特定信息并获得可预测的结果，这些结果与请求相镜像。\n\
    \n在以下各节中，我们将了解 GraphQL 为什么是一种紧凑高效的标准，使其可用于从许多数据源（如 Sanity）获取数据。\n\n我们将通过部署 GraphQL\
    \ 模式并使用 Sanity 的命令行部署工具，继续我们进入 GraphQL 世界的旅程。\n\n## 部署 GraphQL API\n\n由于 Sanity\
    \ 内部使用 GROQ，如果 Sanity 的数据集被其他应用程序使用，则需要部署可选的 GraphQL API。为此，我们需要返回到项目 `studio`\
    \ 目录中的命令行。\n\n以下命令需要在终端中输入：\n\n```\n```bash\nsanity graphql deploy\n```\n```\n\
    \n我们需要安装 Sanity 命令行程序。如果尚未安装，请在命令行中输入以下内容：\n\n```\n```bash\nnpm install -g @sanity/cli\n\
    ```\n```\n\n系统会要求您以下问题：\n\n```\n```\nDo you want to enable a GraphQL playground?\
    \ (Y/N)\n```\n```\n\n在此提示下，只需按 *Enter* 键，或输入 Y，即可启用 playground。输出的最后一行应显示 playground\
    \ 的浏览器：\n\n```\n```\nGraphQL API deployed to:\nhttps://abcd1234.api.sanity.io/v1/graphql/production/default\n\
    ```\n```\n\n此 URL 可以在网络浏览器中打开。让我们检查格式。\n\n请注意，URL 由以下部分组成：项目 ID（此处显示为 `abcd1234`），后跟\
    \ `api.sanity.io`，`v1`（版本一），`graphql`，数据集名称（在此示例中为 `production`），最后是模式名称（在本例中为\
    \ `default`）。\n\n在下一节中，我们将探索 GraphQL 的基本语法。\n\n### 基本 GraphQL 语法\n\n虽然 Sanity\
    \ 的 GROQ 使用更紧凑的语法，但其目标是有效地从数据集合中获取所需内容。GraphQL 的目标是允许请求服务以表达且类型化的方式指定数据的格式以返回，然后以相同的格式返回。我们现在来看\
    \ GraphQL 查询的基本语法以及它可能如何有用地轻松获取数据。\n\n有两种基本类型的查询：\n\n- all 前缀后跟模式名称，如下所示，用于返回多条记录。\n\
    - 单记录查询，它将只返回一条记录。\n\n让我们开始学习 all 查询格式。\n\n## GraphQL 的 all 查询\n\n考虑以下示例查询：\n\n\
    ```\n{\n  allEvent {\n    name\n  }\n}\n```\n\n前面的查询将返回我们数据集中所有事件的名称。这里使用的是 event\
    \ 的单数形式而不是复数形式。结果将与查询相同的格式。注意结果被包装在 data 对象中。此外，allEvent 查询在结果中重复，结果与查询格式相同：\n\
    \n```\n{\n  \"data\": {\n    \"allEvent\": [\n      {\n        \"name\": \"IT\
