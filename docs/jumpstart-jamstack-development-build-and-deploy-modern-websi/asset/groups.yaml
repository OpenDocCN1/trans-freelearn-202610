    \ GROQ 使用。我们返回事件名称（name），同时也返回场馆名称，同样是嵌套的。\n\n结果如下：\n\n```json\n{\n  \"data\"\
    : {\n    \"allEvent\": [\n      {\n        \"name\": \"The Appleseed Cast\",\n\
    \        \"venue\": {\n```\n\n```\n\"name\": \"Will's Pub\"\n}\n},\n{\n\"name\"\
