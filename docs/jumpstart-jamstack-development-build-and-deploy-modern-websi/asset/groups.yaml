  - "[PAGE 62]\n\n# Exploring the project's folders\n\nIn this section, we shall examine\
    \ the contents of the project's folders and files. There are several important\
    \ files as well as several folders. The first file that we will examine is the\
    \ `sanity.json` file. This file is located in the project's `studio` folder.\n\
    \n# Examining the sanity.json file\n\nHere are the first few lines of the `sanity.json`\
    \ file:\n\n```\n\n{\n  \"root\": true,\n  \"project\": {\n    \"name\": \"Hands\
    \ On JAMstack\"\n  },\n  \"api\": {\n    \"projectId\": \"abc123d4\",\n    \"\
    dataset\": \"production\"\n  },\n```\n```\n\nThis file contains two important\
    \ values: `projectId` and the `dataset` name:\n\n+   *   `projectId`: The `projectId`\
    \ value uniquely defines the project, meaning that no one else will have this\
    \ ID. The `projectId` consists of letters and numbers.\n+   *   `dataset`: The\
    \ `dataset` value, however, is not unique, and will be used to identify which\
    \ dataset this instance of Sanity Studio is currently using. For example, one\
    \ might select `production` to represent a final version of a schema and data,\
    \ and `development` to represent the upcoming changes. Both the schema and the\
    \ actual content are contained within the dataset. Each dataset is completely\
    \ separate, and Sanity Studio may load any one of the datasets, but only one schema\
    \ at a time.\n\nAdditionally, the `root` is set to `true` to specify that this\
    \ file is the project's main `sanity.json` file, since plugins may have their\
    \ own `sanity.json` files. The `sanity.json` files found in plugins will have\
    \ `root` set to `true`."
