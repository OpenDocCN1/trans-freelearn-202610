    ## Datasets


    From this section, you may view and remove datasets. Datasets are where data is
    stored. A project may have more than one dataset, depending on the project''s
    needs. The *Developer* account is limited to two accounts.


    ## Settings


    From this section, you can manage the **General settings** and **API** of the
    current project.


    **General settings** include the following:


    - **Organization**

    - **Project Name**

    - **Project Color**

    - **Custom Studio URL**


    You can also disable or delete a project. When you disable a project, it can be
    re-enabled at any time without data loss.


    When you delete a project, all the documents, assets, and users related to the
    project will be removed. **Note that this action cannot be undone.**


    From this section, you may also view and modify your current plan. Depending on
    your needs, you can choose a different plan. For this project, though, the free
    plan *Developer* is amply sufficient, providing up to three users.


    Let''s explore the **API** settings, in the following subsections.


    ### CORS Origins


    In this subsection, you can add and remove hosts that can connect to the project
    API. The `localhost:3333` host is automatically added. `localhost:3333` is our
    local development environment URL. The Gatsby application URL and Sanity Studio
    application URL hosted on Netlify are also automatically added to the **CORS Origins**
    list.


    In this way, we allow our local development environment and the applications hosted
    on Netlify to access our Sanity API.


    Every time we want to let a new application communicate with the Sanity API, we
    do this by simply adding the application URL to our **CORS Origins** list, which
    is as follows:


    - **Token**: A token is used by robots to query the project API.

    - **Webhooks**: Webhooks are called when an action is triggered. For example,
    when content is changed, we can call a given URL to perform an action such as
    a notification.


    Now that we know how to change the configuration of our application, let’s see
    how we can add content through Sanity Studio.


    # Sanity Studio overview


    The starter project is a blog site where a user may add the following:


    - Blog posts

    - Authors

    - Categories


    Throughout this book, we are going to extend this functionality by creating a
    news and events website, adding new types of content and new types of fields.


    We will manage the application settings and content from Sanity Studio.


    Click on the **Studio** link from the Sanity Studio details section given below
    the top-level menu.


    The first screen contains the Sanity Studio **Dashboard**, where there are some
    useful widgets that we are going to explore now.


    ## Navigation


    From the **Navigation** menu, all sections of Sanity Studio may be accessed, as
    illustrated in the following screenshot:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_42_0.png)


    Clicking on the Pencil sign will open a pop-up where you can choose to add a **Blog
    post**, an **Author**, or a **Category**.


    From the **Search** field, you can look for any **Blog post**, **Author**, and
    **Category**.


    **Dashboard** and **Desk** are the two main sections of the application. Let''s
    discuss these in detail.


    ## Dashboard


    In the **Dashboard** section, we have shortcuts divided in blocks that link to
    all the sections included in Sanity Studio.


    ## Edit your content


    From this shortcut, the user has access to subpages of the **Desk** section, such
    as the following:


    - **Settings**

    - **Blog posts**

    - **Authors**

    - **Categories**


    ## Netlify sites


    This block lists the Netlify sites created for a project. We can click **View**
    or **Admin** to perform operations on our application. If any website content
    is changed, a deployment may be triggered by clicking on the **Deploy** button.


    **Sanity Studio** is the application we are currently using, and **Blog Website**
    is our blog application.


    ## Project info


    This block lists all information relating to Sanity projects, as follows:


    - Project ID

    - Dataset

    - Frontend

    - GROQ

    - GraphQL

    - GitHub repository


    ## Project users


    Similar to the **Team** section of the **Sanity Manage** page, **Project users**
    lists all the current project’s users.


    ## Recent blog posts


    As the block title indicates, a list of five recent blog posts will be shown here.
    Clicking on each blog post title will bring you to the **Edit** page for that
    specific blog post.


    ## Desk


    From the **Desk** section of Sanity Studio, the settings and content may be managed.


    ## Settings


    The application comes with some basic settings that we will extend during this
    book.


    Basic settings include the following:


    - **Title**

    - **Description**

    - **Keywords**

    - **Author**


    ## Blog posts


    A **blog post** is a piece of content created by an author. It comes with some
    preconfigured fields, such as the following:


    - **Title**

    - **Slug**

    - **Published at**

    - **Main image**

    - **Excerpt**

    - **Authors**

    - **Categories**

    - **Body**


    ## Authors


    **Authors** are the creators of a piece of content, such as a blog post. Similar
    to **Blog post**, this section has preconfigured fields, such as the following:


    - **Name**

    - **Slug**

    - **Image**

    - **Biography**


    ## Categories


    **Categories** are used to categorize a piece of content. A category may be also
    used to filter content during a search.


    As with the **Blog posts** and **Authors** sections, it has a few predefined fields,
    namely **Title** and **Description**.


    ## Summary


    In this chapter, we were introduced to Sanity.io. Through Sanity''s **Create**
    tool we have created a new application hosted on Netlify using the Sanity user
    interface, and we have hosted our code base on GitHub. We explored how to manage
    a Sanity application and Sanity Studio''s **Dashboard** capabilities.


    In the next chapter, we will explore the example content, and learn how to delete,
    modify, and create new content using the Sanity Studio **Desk**.


    # Modifying the example author


    The sample author created in the previous chapter is simply an example, so we
    will modify and personalize the author to our own name. Follow along with each
    step as we use Sanity Studio to modify the author.


    ## Modifying the existing author


    Follow these steps in order to learn how to do this task:


    1. Click the Desk icon in the top navigation bar, as shown:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_48_0.png)


    Figure 3.1 – Sanity Studio


    While Dashboard provides a broad overview of the contents, Desk provides a means
    to view, create, modify, and delete the project''s contents.


    2. Click **Authors** in the **Content** navigation menu (located on the left),
    as shown:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_49_0.png)


    Figure 3.2 – Authors navigation menu item


    3. Click on the example author, **My Name**, in this case.


    4. Change **Name** to your actual name. Here, the name **Christopher John Pecoraro**
    is used as an example.


    5. Click the **Generate** button to generate a new slug. This will be the URL
    used for the author''s profile page.


    6. Click the **Upload** button to upload a new image.


    7. Modify the caption and alternative text as appropriate.


    8. Modify the biography as appropriate.


    At this point, the article should be showing a draft status. This author is not
    saved yet:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_49_1.png)


    Figure 3.3 – Draft status


    9. Click the **Publish** button:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_49_2.png)


    Figure 3.4 – Publish button


    At this point, the author profile is published and should be displaying a **Published**
    status. The latest version of it will be available for use:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_50_0.png)


    Notice that the **Content** menu is collapsed like an accordion, as shown in the
    following screenshot. The text is displayed vertically:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_50_1.png)


    Clicking on the **Content** bar will display the topmost menu again in **Desk**.


    ## Creating an additional author


    At this point, we only have one author; however, most news websites have more
    than one author, so follow these steps to create a second author:


    1. Click **Authors** in the **Content** navigation menu (located on the left),
    as shown:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_50_2.png)


    2. Click on the pencil icon to create an additional author, as shown:


    ![](img/97ab031f38e2174e2f1b51da18dfa1d0_50_3.png)

