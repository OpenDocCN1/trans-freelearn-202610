    \ used in Gatsby is a page component. Gatsby page components are used only once\
    \ for single, unique pages, such as the index (home) page, 404 page, or an about\
    \ us page, for example. This page will only be generated once.\n\n# Building and\
    \ modifying Gatsby page components\n\nAs mentioned previously, pages are unique.\
    \ By creating a page component and placing it in the /web/ src/pages folder, Gatsby\
    \ will automatically generate the page.\n\nThe content of a code page in Gatsby\
    \ can be as simple as the following example, which contains the entire page contents\
    \ inside a string:\n\n```\n// Does not require React because there is no JSX\n\
    const AboutUsPage = () => (\n  `Who we are: .......`\n)\nexport default AboutUsPage\n\
    ```\n\nThe following is a shorter way to write the preceding code:\n\n```\nconst\
    \ AboutUsPage = () => {\nreturn `Who we are: .......`\n}\n```\n\nEnhancing this\
    \ example by using JSX would allow us to create the following example:\n\n```\n\
    //Requires React because this example uses JSX tags.\nimport React from 'react'\n\
    \nconst AboutUsPage = () => (\n  <html>\n    <body>\n      <h1>Who we are:</h1>\n\
    \        <p>.......</p>\n    </body>\n  </html>\n)\nexport default AboutUsPage\n\
    ```"
