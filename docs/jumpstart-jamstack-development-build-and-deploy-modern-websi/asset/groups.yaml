    # Gatsby partial components


    Partials, as some frontend systems refer to them, are non-page components, such
    as a header or an element of a page that can be embedded and reused many times
    throughout the website.


    # Building and modifying Gatsby partial components


    Gatsby partials have a format similar to other components. However, there are
    several differences. The main difference is that they are not complete pages,
    so they cannot be rendered as such. Also, they will be embedded in files by importing
    them.


    Let''s look at how a partial component file is constructed:


    +   1. First, a few import statements bring in a few libraries for added functionality
    and auxiliary:


