    \ or a building block to be used within a document, such as an address block containing\
    \ several fields, such as address, city, and postal code.\n\nThe default project\
    \ that is automatically created uses the two directories – documents and objects,\
    \ to help organize the project by grouping the schemas by type.\n\n## Author schema\n\
    \nFor the next step, examine the structure of the `author.js` file in the documents\
    \ directory.\n\n## Schema definition\n\nAs shown in the following code sample,\
    \ the fields attribute is an array. The use of square brackets is a syntax to\
    \ denote a list or collection of items. To begin with, the list of items is empty.\
    \ It will be filled to contain a list of fields:\n\n```javascript\nexport default\
    \ { \n    name: 'author',\n    type: 'document',\n    title: 'Author',\n    fields:\
    \ [\n    ],\n}\n```\n\nAll entities must contain at least one field. Each object\
    \ within the fields array follows the same format as the entity itself, at a minimum\
    \ name, title, and type.\n\n## Schema fields\n\nPossibly the simplest example\
    \ of this would be a name field, which represents the first and last name of the\
    \ author:\n\n```javascript\nexport default { \n    name: 'author',\n    type:\
    \ 'document',\n    title: 'Author',\n    fields: [\n      {\n        name: 'name',\n\
    \        type: 'string',\n        title: 'Name'\n      },\n    ]\n}\n```\n\nIn\
    \ the preceding code example, we have placed the name attributes inside of the\
    \ `fields` array. This array is of a string type, which basically means a short\
    \ phrase or label without any associated formatting such as bold italics.\n\n\
    > **Note**\n> \n> The `title` attribute should represent a word or phrase that\
    \ a content editor could recognize and will be displayed in Sanity Studio.\n\n\
    There are three other attributes that can be used in each field:\n\n- `description`\
    \ is a longer description of how the field should be used.\n- `readOnly` disables\
    \ editing in Sanity Studio.\n- `hidden` hides the field from Sanity Studio.\n\n\
    The readOnly and hidden fields would be modified programmatically and not by the\
    \ person using the interface.\n\n## Schema field types\n\nThere is a wide range\
    \ of types available for use. At the time of writing, the following types, other\
    \ than document, are available:\n\n- Array\n- Block\n- Boolean\n- Date\n- Datetime\n\
    - File\n- Geopoint\n\nIn this example, this schema is of type address, so author\
    \ will link to address through the address reference as shown:\n\n```javascript\n\
    export default {\n    name: 'author',\n    type: 'document',\n    title: 'Author',\n\
    \    fields: [\n    {\n        name: 'name',\n        type: 'string',\n      \
    \  title: 'Name'\n    },\n    {\n        name: 'address',\n        type: 'reference',\n\
    \        to: {type: 'address'}\n    }\n    ]\n}\n```\n\nIn the Sanity schema,\
    \ we use the reference type and an additional attribute, to. The to attribute\
    \ accepts an object specifying the type.\n\n## A one-to-many relationship\n\n\
    In the same way, a schema can be related to many schemas, even of various types.\
    \ A simple example is an author that writes for multiple publishing houses:\n\n\
    ```javascript\n{\n    name: 'publishers',\n    title: 'Publishers',\n    type:\
    \ 'array',\n    of: [\n    {\n        type: 'reference',\n        to: '[{type:\
    \ 'publisher'}]'\n    }\n    ]\n}\n```\n\nIn this example, the type field is an\
    \ array so that inside Sanity Studio, one or more publishers could be chosen from\
    \ a list of publishers. Note that the name \"publishers\" is given to this field\
    \ to show that this field represents multiple publishers, however, the relationship\
    \ is to a schema of type publisher, and schema names are always singular.\n\n\
    In the first part of this chapter, we learned about the structure of a schema.\
    \ In the next section, we will learn how to modify schemas.\n\n## Extending, modifying,\
    \ and deploying the schema\n\nFor the example used in this book, we will be creating\
    \ a news and events website. The first step in this process is to create a file\
    \ named event.js in the document directory, which will represent our event schema.\n\
    \n## The event schema\n\nThe following code segment is the schema for an event,\
    \ illustrating its various fields:\n\n```javascript\nexport default {\n    name:\
    \ 'event',\n    type: 'document',\n    title: 'Event',\n    fields: [\n      \
    \  {\n            name: 'name',\n            type: 'string',\n            title:\
    \ 'Name'\n        },\n        {\n            name: 'dateAndTime',\n          \
    \  type: 'datetime',\n            title: 'Date and Time'\n        },\n       \
    \ {\n            name: 'venue',\n            type: 'reference',\n            to:\
    \ {type: 'venue'}\n        },\n        {\n            name: 'virtual',\n     \
    \       type: 'boolean',\n            title: 'Virtual Event'\n        },\n   \
    \     {\n            name: 'eventUrl',\n            type: 'url',\n           \
    \ title: 'Event URL'\n        },\n        {\n            name: 'location',\n \
    \           type: 'geopoint',\n            title: 'Location'\n        },\n   \
    \     {\n            name: 'telephone',\n            type: 'string',\n       \
    \     title: 'Telephone'\n        },\n        {\n            name: 'email',\n\
    \            type: 'string',\n            title: 'Email'\n        },\n       \
    \ {\n            name: 'website',\n            type: 'url',\n            title:\
    \ 'Website'\n        }\n    ]\n}\n```\n\nThe venue schema also contains some useful\
    \ field types, such as geopoint, which will allow us to take advantage of the\
    \ Google Maps API to automatically complete an address, and a URL that provides\
    \ input validation.\n\nThe schemas folder should now have the following files:\n\
    \n```text\nschemas\n    documents\n        author.js\n        category.js\n  \
    \      event.js\n        post.js\n        siteSettings.js\n        venue.js\n\
    ```\n\n## The schema file\n\nFor Sanity to be able to recognize a new schema,\
    \ that schema must be added to the schema.js file, which is in the studio/schemas\
    \ folder. Let’s see how to do so:\n\n1. Add the files via import statements at\
    \ the top of the file, after the line starting with import siteSettings:\n\n```javascript\n\
    // document schemas\nimport siteSettings from './documents/siteSettings'\n//insert\
    \ these two rows\nimport event from './documents/event'\nimport venue from './documents/venue'\n\
    ```\n\n2. Add the imported schema to the list of schema types:\n\n```javascript\n\
    types: schemaTypes.concat([\n// The following are document types which will appear\n\
    // in the studio.\nsiteSettings,\n//insert two rows here\nevent,\nvenue,\n...\n\
    ])\n```\n\n## Deploying the schema\n\nTo view the schema changes, they must be\
    \ deployed. When we deploy something, we move or copy it from one environment\
    \ to another, usually a production environment where it can be used by other people\
    \ and things. Here, we will push our changes to the schema into an environment\
    \ where they may be viewed in the browser. In the root of the project directory,\
    \ use either npm or yarn to install the dependencies.\n\nExecute one of the following\
    \ commands by typing it in the Terminal and pressing Enter:\n\n```bash\nyarn install\n\
    ```\n\nor\n\n```bash\nnpm install\n```\n"
