  mdcn: '


    随着网站上的网页数量增长，每周甚至每天的任务都涉及手动更新多达 50 个页面。每当需要在网页的共享部分（如页眉、页脚或导航窗格）进行更改时，这些重复的操作被证明相当繁琐。


    让我们研究一下为此问题设计的一些解决方案。


    ## 服务器端包含


    一种试图补救这种重复手工工作的方法被称为 **服务器端包含**，或 **SSI**。该标记元素被创建以允许网页设计师包含页面的片段（例如页眉），而无需重复内容和标记。然后，在页面生成时，该标签将被替换为产生的
    HTML 输出。


    例如，网页上的三个链接，Home、About Us 和 Contact Us，将具有以下标记：


    ```

    <a href="home.html">Home</a>

    ```


    ```

    <a href="about_us.html">About Us</a>

    ```


    ```

    <a href="contact_us.html">Contact Us</a>

    ```


    此 HTML 可以放在名为 navigation.ssi 的文件中。包含将按如下方式调用：


    ```

    <!--#include virtual="navigation.ssi" -->

    ```


    在 Web 服务器处理之后，页面上显示的结果与前面的示例所示相同。接下来，又使用了另一种类似的方法来允许生成动态内容。


    ## 通用网关接口


    **通用网关接口** 或 **CGI**，允许用 Perl 等语言编写的程序包含在网页中，提供附加功能，例如页面计数器。HTML 页面中调用此代码的实际位置再次将被替换为产生的
    HTML 输出。


    一个计算页面访问者数量的 Perl 脚本被放置在 cgi-bin 目录中并按如下方式调用：


    ```

    <p>This page has been visited

    ```


    ```

    <!--#exec cgi="/cgi-bin/counter.pl"--> times.</p>

    ```


    这将在网页上产生以下结果：


    ```

    `<p>This page has been visited 5349 times.</p>`

    ```


    数字 5349 由此代码产生并显示在页面上。


    ## 表单


    Web 开发历史中另一个重要部分是 **表单**。表单允许简单的网页转变为实际的 Web 应用程序。Web 表单复制了桌面应用程序中传统表单的功能。Web
    表单还使终端用户，而不是网站管理员，能够添加内容——例如，在论坛中，使用提交表单。


    在网站的公开部分，这些表单的提交随着网站规模的快速增长而增加了更多内容。网站很快就有效地成为软件应用程序，而不仅仅是带有标记的文件集合。很快，除了提供简单的页面之外，Web
    服务器模块被创建来预处理整个页面作为程序。


    ## 网页预处理器


    现代 Web 开发演进的另一个有趣部分是使用整个页面预处理器的能力，例如 PHP。事实上，这种语言递归地称为 **PHP: Hypertext Preprocessor**，解释了它所做的工作。这些文件具有不同的文件扩展名，Web
    服务器（如 Apache）可以将整个页面作为实际程序进行处理并输出为 HTML 标签和内容。


    接下来，让我们进入现代时代：**内容管理系统（CMS）。**


    ## 内容管理系统


    很快，MySQL 等数据库被包含在经济实惠的 Web 主机计划中，以便网站管理员可以轻松使用它们。可以查询数据库表，结果将丰富并为许多动态生成的页面增添意义。这为第一个
    CMS 奠定了基础。


    通过允许网站管理员和历史上称为 *webmasters* 的人管理数据库中的内容，*dashboards* 或 *control panels* 被创建。这些管理工具是与实际网站完全分开的基于
    Web 的软件应用程序，允许网站内容从网站本身轻松创建、编辑和删除。


    再次，这导致网站在规模和复杂性方面迅速增长。


    ## WordPress


    **WordPress** 迅速成为使用最广泛的 CMS。扩展 WordPress 功能的插件集合被开发出来，任何人都可以开发和安装插件。这意味着在任何时候，WordPress
    网站可能同时安装了数百个不同的插件。


    其中大多数由雄心勃勃的志愿者维护，新功能被快速添加。这种现象导致了快速的发布周期，并且每个插件同时使用许多不同版本。


    ## Ajax


    另一个主要创新是 Ajax 的创建，或 *Asynchronous JavaScript and XML*。Ajax 允许页面从远程源获取信息，然后使用结果更新该页面的内容、布局或样式，而无需重新加载页面。这种
    *instant update* 使仍需要重新加载页面的网站显得笨重缓慢。网站再次缓慢演变为更接近成为软件应用程序，类似于桌面应用程序或单页应用程序。


    ## JavaScript 框架


    随着这种动态页面操作的复杂性增长，**JavaScript 框架** 诞生了。这些有助于减少开发时间并强制执行最佳实践。它们还提供了可以在尽可能多的浏览器版本中发挥功能的
    JavaScript 代码。仍有高达 100 种变体的浏览器，如 Internet Explorer、Firefox、Opera 和 Google Chrome
    运行在台式电脑、平板电脑和移动设备上。


    ## 云的兴起


    随着网络的普及，Web 主机成本下降。非常低成本的 Web 主机可用性迅速增加，因为许多公司进入了市场。网站托管公司和云提供商看到了这一机会，使几乎任何技术技能很少的人都能以非常低的成本创建网站。


    正如历史所表明的那样，就像汽车一样，有时最好的发明也会带来许多问题。就像汽车的发明和演变导致了碰撞、交通堵塞以及安全和安全问题一样——网站也是如此！由于互联网上大多数网站是由业余爱好者创建并托管在安全性不足的服务器上，服务器上的漏洞很快被发现然后被利用。


    使用过时或不安全的 WordPress 插件、不安全的 JavaScript 以及 Web 服务器的一般错误配置的组合，被入侵的网站随后可被用于通过利用 **简单邮件传输协议（SMTP）**
    发送垃圾邮件。这些利用者将电子邮件地址和电子邮件内容插入数据库表，然后以自动方式每小时发送数千封电子邮件，希望说服人们花钱。通过限制用户可以访问服务器上的哪些工具、锁定目录、不允许重复登录尝试以及其他技术来确保服务器安全，以减少安全风险。


    然而，确保网站的所有插件都是最新的开销很快变得难以承受。诸如某个插件的版本 3.12.26 与另一个插件的版本 6.8.14 不兼容的情况变得司空见惯。网络慢慢变得像西部荒野一样！


    ## 高速访问


    随着高速互联网变得普遍，连接速度增加到家庭电脑上接近 50-100 **兆比特每秒（Mbps）**，通过 **数字用户线路（DSL）** 和有线互联网。网页设计师在单个网页上放置的信息量、图像、媒体文件、JavaScript
    以及任何其他内容方面获得了更大的自由度。这导致了以前快速加载的网站变慢。


    此外，页面需要多个步骤才能实际动态生成。实时运行的代码和数据库查询需要在每个请求上进行解释。由于交付单个网页所需的步骤太多，页面时间变慢了。正如历史所示，新的解决方案总会出现以解决新问题。这个解决方案被称为
    **Jamstack**。


    让我们开始剖析它是什么。


    ## Jamstack 的兴起


    Jamstack 代表了 Web 设计初期所有美好的东西，以及现代 Web 开发所有美好的东西。静态站点生成，有时也称为静态站点生成，简单地意味着生成一个由页面组成的网站，这些页面本质上只是文件，仅此而已。没有后端预处理器，也没有数据库，所有的服务器复杂性都被抽象掉了。


    '
