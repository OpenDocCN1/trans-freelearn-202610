    # ## Understanding plugins


    In this section, we will explore the basics of a plugin, what a plugin is, and
    why it is needed in a project. We will explore the public collection of open source
    code, npm. We will explain how semantic versioning control works and why it is
    important. We will then see how to install and maintain plugins.


    **Gatsby plugins** are Node.js packages, a set of JavaScript and **HyperText Markup
    Language/Cascading Style Sheets (HTML/CSS)** files that extend the Gatsby **application
    programming interfaces (APIs)** and add new functionalities to the application.
    You can enable a feature by installing a plugin, and you can disable it by uninstalling
    the plugin.


    The extensible nature of Gatsby allows you to create your plugins in a way that
    allows you to organize your customized business logic into reusable packages,
    discussed in the next section.


    # ## Node Package Manager


    A developer can download plugins from npm, which is a public collection of open
    source code for JavaScript frameworks such as GatsbyJS. Developers can upload
    their plugins and let other developers reuse the same code. Other developers can
    also contribute back to the plugin they have used by fixing bugs or adding functionalities.
    You can also upload private packages to npm.'
