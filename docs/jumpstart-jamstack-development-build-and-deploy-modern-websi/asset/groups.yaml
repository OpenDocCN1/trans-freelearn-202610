    # ## Datasets


    From this section, you may view and remove datasets. Datasets are where data is
    stored. A project may have more than one dataset, depending on the project''s
    needs. The *Developer* account is limited to two accounts.


    # ## Settings


    From this section, you can manage the **General settings** and **API** of the
    current project.


    **General settings** include the following:


    +   - **Organization**

    +   - **Project Name**

    +   - **Project Color**

    +   - **Custom Studio URL**


    You can also disable or delete a project. When you disable a project, it can be
    re-enabled at any time without data loss.


    When you delete a project, all the documents, assets, and users related to the
    project will be removed. **Note that this action cannot be undone.**


    From this section, you may also view and modify your current plan. Depending on
    your needs, you can choose a different plan. For this project, though, the free
    plan *Developer* is amply sufficient, providing up to three users.


    Let''s explore the **API** settings, in the following subsections.


    # ### CORS Origins


    In this subsection, you can add and remove hosts that can connect to the project
    API. The `localhost:3333` host is automatically added. `localhost:3333` is our
    local development environment URL. The Gatsby application URL and Sanity Studio
    application URL hosted on Netlify are also automatically added to the **CORS Origins**
    list.


    In this way, we allow our local development environment and the applications hosted
    on Netlify to access our Sanity API.'
  - '[PAGE 42]


    Every time we want to let a new application communicate with the Sanity API, we
    do this by simply adding the application URL to our **CORS Origins** list, which
    is as follows:


    +   - **Token**: A token is used by robots to query the project API.

    +   - **Webhooks**: Webhooks are called when an action is triggered. For example,
    when content is changed, we can call a given URL to perform an action such as
    a notification.


    Now that we know how to change the configuration of our application, let’s see
    how we can add content through Sanity Studio.


