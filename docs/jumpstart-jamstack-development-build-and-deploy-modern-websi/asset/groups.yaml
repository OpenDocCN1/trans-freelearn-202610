    \ events.*\n\nThe Amazon Echo device will send the request to the Alexa console,\
    \ which will then process the request by contacting our Sanity application and\
    \ will send the results back to the Amazon Echo device, prompting a message to\
    \ the user.\n\nTo build an Alexa skill, we will use the Alexa Developer console.\
    \ The two components of an Alexa skill are the skill interface and the skill service.\n\
    \n#### Skill interface\n\nThe **Skill interface** is the software provided by\
    \ Amazon where the user can develop an Alexa skill through a nice and clean UI.\
    \ We will use the skill interface to create and modify each component of the skill.\n\
    \n#### Skill service\n\nThe **Skill service** is where the business logic of an\
    \ Alexa skill resides. The code will execute the intent and return a JSON response\
    \ to the interface that will give the user an understandable human sentence as\
    \ a response.\n\nIn this chapter, our service will be executed in Node.js inside\
    \ an AWS Lambda function.\n\nNow that we know what the skill interface and skill\
    \ service are, we will move on to creating the skill for Alexa.\n\n### Creating\
    \ the skill\n\nAs mentioned earlier, we are going to create a skill through the\
    \ **Alexa Developer Console**, which will retrieve five upcoming events from our\
    \ event website.\n\n3. Click on the blue button that says Create Skill:\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_176_0.png)\n\
    \nFigure 12.3 – Amazon Alexa Skills overview\n\n4. Choose a skill name that will\
    \ also be your invocation name. For this example, we will write jumpstart jamstack:\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_176_1.png)\n\nFigure 12.4 – Amazon\
    \ Alexa Skills creation page\n\nModels in the Alexa paradigm are sets of intents\
    \ and utterances that define the usage of your skill. In this example, we will\
    \ use the **Custom** model.\n\n5. As mentioned previously, we will use the Alexa-hosted\
    \ host, so use the default selected **Alexa-Hosted (Node.js)**:\n\n> **2. Choose\
    \ a method to host your skill’s backend resources**\n>\n> You can provision your\
    \ own backend resources or you can have Alexa host them for you. If you decide\
    \ to have Alexa host your skill, you'll get access to our code editor, which will\
    \ allow you to deploy code directly to AWS Lambda from the developer console.\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_177_0.png)\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_177_1.png)\n\
    \nIn the top-right corner, if you want, you can change the region where the skill\
    \ is hosted. I left it as the default **US East (N. Virginia)**.\n\n6. Then, click\
    \ on the **Create skill** blue button in the top-right corner to create the skill:\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_177_2.png)\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_177_3.png)\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_179_0.png)\n\nFigure 12.8 – Alexa skill\
    \ interface top menu\n\nSince this is an example skill, we will be exploring **Build**,\
    \ **Code**, and **Test** in this chapter. The **Distribution**, **Certification**,\
    \ and **Analytics** tabs are used when the skill is added to the marketplace.\n\
    \n### Build\n\nThe **Build** section is where we can set the invocation name,\
    \ configure the interaction model, set slots, and set the endpoint:\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_179_1.png)\n\
    \nFigure 12.9 – Alexa skill interface build menu\n\n"
