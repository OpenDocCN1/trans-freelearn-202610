    ```\n\n正如你所见，返回了两个事件。如果只应返回名为 The Appleseed Cast 的事件，可以向 where 关键字添加一个额外的参数。会有逗号分隔符。请注意，这是事件名称，而不是场馆名称，因为两个字段具有相同的名称：\n\
    \n```\n{\n  allEvent(where: { venue: { name: { eq: \"Will's Pub\" } },\n    name:\
