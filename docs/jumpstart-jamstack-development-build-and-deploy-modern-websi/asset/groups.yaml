  - '[PAGE 202]


    # Gatsby.js layout modifications


    There are many different ways to incorporate styles into a web page to change
    the default fonts, colors, backgrounds, and layout. While style and classes can
    also be created one by one, an easier and more efficient approach is to use a
    framework to leverage pre-built ideas and design patterns. One of the hottest
    cascading frameworks at the time of writing is Tailwind CSS. Let''s introduce
    Tailwind and learn why it is used within Gatsby.


    # Introducing Tailwind CSS


    Tailwind CSS is a nice CSS framework that is easy to learn and use. It aims to
    be unopinionated and is driven toward allow the designer to construct styles from
    smaller pieces. Let''s start by installing the framework so that we can use it.


    # Installing the Tailwind CSS framework


    We will install it and use it to improve the visual appearance of the website:


    +   1. The first step is to use the Node package manager to install Tailwind CSS.
    In the terminal, type the following command:

    +   ```

    +   npm install tailwindcss --save-dev

    +   ```

    +   The --save-dev argument will add it to the project''s development dependencies.
    Additionally, since we want to improve the appearance of the form, we will add
    an additional package built by Tailwind Labs called custom-forms.

    +   2. Again, we''ll add this to the project''s development properties. Type the
    following command into the terminal as well:

    +   ```

    +   npm install @tailwindcss/custom-forms --save-dev

    +   ```

    +   3. Finally, by typing the following command in to the terminal, the configuration
    file is automatically created:

    +   ```

    +   npx tailwindcss init

    +   ```'
  - "[PAGE 203]\n\nThe tailwind.config.js file gets created in Gatsby's main folder,\
    \ in the /web directory. This file contains the Tailwind configuration. The contents\
    \ of the file are composed as follows:\n\n```\nmodule.exports = {\n  purge: [],\n\
    \  theme: {\n    extend: {}\n  },\n  variants: {},\n  plugins: [require('@tailwindcss/custom-forms')]\n\
