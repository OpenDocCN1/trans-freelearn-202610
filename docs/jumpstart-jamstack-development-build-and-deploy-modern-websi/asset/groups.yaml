- raw:
  - "[PAGE 216]\n\n# # Netlify plugins\n\nNetlify's plugin library automates many\
    \ manual processes and saves developers the effort of having to develop in-house\
    \ solutions. This growing library includes many plugins. For example, one plugin\
    \ can fetch and incorporate external resources such as RSS feeds. Another plugin\
    \ can also generate a sitemap or even index the website content to create a search\
    \ functionality.\n\n# ## HTML Minify\n\nThe plugin that we'll examine for the\
    \ purpose of this book compresses the HTML, reducing the file size by removing\
    \ unnecessary page or code contents, or substituting variable names with single-character\
    \ replacements. This process is called **minification**.\n\nWe would like to Minify\
    \ the HTML code as much as possible, so we could use Netlify's plugin called `netlify-plugin-minify-html`\
    \ to compress the file contents. When Gatsby builds the static pages, it minimizes\
    \ the content of the HTML files.\n\nThe following is an example of how the readable\
    \ source code would appear prior to minification:\n\n```\n```html\n<h1 hidden=\"\
    \">\n  Welcome to <!-- -->My new blog\n</h1>\n<div class=\"blog-post-preview-list-module--root--2LgdR\"\
    >\n  <h2 class=\"blog-post-preview-list-module--headline--3j8kB\">\n    Latest\
    \ blog posts\n  </h2>\n....\n```\n```\n\nOnce minification is performed, the total\
    \ file size is reduced. Here is how the HTML code appears following minification:\n\
    \n```\n```html\n<h1 hidden=\"\">Welcome to <!-- -->My new blog</h1><div class=\"\
    blog-post-preview-list-module--root--2LgdR\"><h2 class=\"blog-post-preview-list-module--headline--3j8kB\"\
    >Latest blog posts</h2>\n```\n```\n\nExtra spaces have been removed, but the `netlify-plugin-minify-html`\
    \ file is able to make the file size even smaller. Every character counts toward\
    \ the total amount of data on the page that needs to be transferred over the internet,\
    \ so this is a wonderful feature."
