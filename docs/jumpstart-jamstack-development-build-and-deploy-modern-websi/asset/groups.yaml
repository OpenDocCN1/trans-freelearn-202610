  mdcn: "\n\n# 第 10 章（续）\n\n这个 Event 标签代表了一种可以轻松插入到众多上下文环境中的组件示例。在图 10.2 中，我们可以看到一个示例事件在页面上的显示方式：\n\
    \n我的新博客\n\nIT 大会 @ Agora\n\nLorem ipsum dolor sit amet, consectetur adipiscing\
    \ elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut\
    \ enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip\
    \ ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate\
    \ velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat\
    \ non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.\n\
    \n图 10.2 – 一个事件\n\n在下一节中，我们将探讨示例页内组件或部分组件是如何构建的。\n\n## Gatsby 部分组件\n\n部分组件（Partials，一些前端系统对其的称呼）是非页面组件，例如页眉或页面中可以被嵌入并在整个网站中多次重用的元素。\n\
    \n## 构建和修改 Gatsby 部分组件\n\nGatsby 部分组件的格式与其他组件相似。然而，存在一些差异。主要的区别在于它们不是完整的页面，因此不能直接渲染。此外，它们将通过导入的方式嵌入到文件中。\n\
    \n让我们看看部分组件文件是如何构建的：\n\n1. 首先，几条导入语句引入了一些库以增强功能和辅助功能：\n\n```javascript\nimport\
    \ React from 'react'\nimport {buildImageObj} from '../lib/helpers'\nimport {imageUrlFor}\
    \ from '../lib/image-url'\nimport PortableText from './portableText'\nimport Container\
    \ from './container'\n```\n\n2. 首先，我们将继续使用来自博客文章的层叠样式表：\n\n```javascript\nimport\
    \ styles from './blog-post.module.css'\n```\n\n3. 接下来，定义 Event 函数，并通过 props 参数将单个事件的属性传入函数。该函数在末尾导出：\n\
    \n```javascript\nfunction Event (props) { ... }\nexport default Event\n```\n\n\
    _rawBody、name 和 venue 对象从 props 参数中解构，因为它们是页面内容所必需的：\n\n```javascript\nconst {\
    \ _rawBody, name, venue } = props\n```\n\n4. 最后，生成并返回页面的内容：\n\n```javascript\n\
    return ( ... )\n```\n\n5. article 标签是 HTML5 中的标准语义标签，在这里用作最外层标签，包裹内容：\n\n```html\n\
    <article className={styles.root}>\n  <Container>\n    <div className={styles.grid}>\n\
    \      <div className={styles.mainContent}>\n```\n\n6. 在这里，我们使用点表示法打印事件名称和场地名称，因为场地名称包含在\
    \ venue 对象内。请注意，动态元素用大括号括起来，以便用实际值替换：\n\n```html\n<h1 className={styles.name}>{name}\
    \ @ {venue.name}</h1>\n```\n\n7. 最后，这里采用了一种技巧，指示 Gatsby 如果 _rawBody 存在则显示它，使用逻辑与运算。双\
    \ ampersand（&&）用于表示“与”。格式是如果 a 和 b。在这里，如果 a 为 false，意味着 _rawBody 没有内容，那么 <PortableText>\
    \ 标签及其内容 _rawBody 将不会被显示。\n\nPortableText 是一个将 Sanity 的内容 _rawBody 转换为 React 内容的组件，以便正确显示：\n\
    \n```html\n{_rawBody && <PortableText blocks={_rawBody} />}\n      </div>\n  \
    \  </div>\n  </Container>\n</article>\n```\n\n下图是该页面显示方式的示例：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_154_0.png)\n\
    \n图 10.3 – 示例 Gatsby 页面\n\n## 总结\n\n在本章中，我们学习了页面、模板和部分组件。页面组件代表一个独特的页面，模板用于生成许多相似类型的页面，而部分组件是可以用于其他页面中的内容片段。Gatsby\
    \ 中使用的每种组件都基于 React，因此它重用了基于 JavaScript 的健壮系统。这些组件是 Gatsby 的构建块，因此知道如何创建和使用它们对于所有\
    \ Gatsby 开发都是必不可少的。\n\n在下一章中，我们将开始探索 Jamstack 缩写字母中的 A 部分 – API。\n\n# 11\n\n#\
    \ API – 扩展 Gatsby\n\n在本章中，您将了解 Jamstack 中的 A 部分——即**应用程序编程接口（API）**。我们将学习如何在编译后网页的动态部分中使用它们，以重现\
    \ web 开发者在传统基于服务器的 web 开发中熟悉的函数。我们将使用 Netlify 表单创建一个自定义的**提议活动**表单，并通过 Netlify\
    \ 函数管理提交内容。我们还将了解如何将第三方服务连接到我们的 Gatsby 应用程序。\n\n本章将涵盖以下主题：\n\n- API 简介\n- Gatsby\
    \ – API\n\n## 技术要求\n\n要彻底理解本章内容，我们需要以下应用程序：\n\n- 终端（Terminal）\n- 已安装的 Gatsby 应用程序\n\
    - 一个 Netlify 账户\n\n本章的代码文件可以在 `https://github.com/PacktPublishing/Jumpstart-Jamstack-Development/tree/chapter_eleven`\
    \ 找到。\n\n## API 简介\n\nAPI 几乎从我们开始编程起就存在了。现代 API 在 21 世纪初开始成为我们现在的样子，当时像亚马逊这样的公司开始通过**超文本传输协议（HTTP）**请求提供对其数据的访问。这些公司改变了我们在网上做生意的方式。开发人员现在可以从\
    \ Salesforce 等服务获取和发布用户信息，并使用 API 在其应用程序上提供完整的电子商务体验。\n\n2004 年，随着社交网络的引入，我们改变了使用互联网的方式。Facebook\
    \ 和 Twitter 等公司开始开发自己的 API。类似于电子商务体验，开发人员现在可以从社交网络应用程序中获取用户的个人资料信息、事件和图片。\n\n\
    几年后，新一代智能手机问世。人们开始通过手机浏览互联网，开发人员开始开发可以安装在智能手机上的应用程序，而 API 是连接这些服务的正确方式。Instagram\
    \ 改变了我们在互联网上分享照片的方式，并在几年后提供了自己的 API。\n\n大约在 2010 年，我们拥有桌面和智能手机设备通过 Web 应用程序和移动应用程序消费\
    \ API 并依赖第三方 Web 服务，而在 2015 年左右，更多设备变得更加*智能*。任何能够连接到互联网的设备都可以访问 Web 服务的 API 资源。智能音箱、恒温器、手表和许多其他设备开始消费\
    \ API。\n\nAmazon Alexa、Google Nest、Fitbit 和 Apple Watch 只是我们现在每天使用的众多设备中的少数几个，它们可以从\
    \ API 获取数据。\n\n让我们在下节中探索 Gatsby API。\n\n## Gatsby – API\n\n在本节中，我们将探索如何在 Gatsby\
    \ 内部使用 API。在本章我们将构建的示例中，我们将创建一个活动表单，匿名用户可以在其中提议他们的活动。当用户提交表单时，我们将通过 API 将提交内容添加到\
    \ Sanity。\n\n为了实现这一点，我们将执行以下操作：\n\n- 在我们的活动应用程序的主页上创建一个 Netlify 表单。\n- 配置一个来自\
    \ Sanity 的令牌，以便我们可以通过 API 提交表单。\n- 配置一个 Netlify 函数在提交时发送数据。\n\n## 创建 Netlify 表单\n\
    \n作为我们的第三方服务，我们将使用 Netlify Forms，这是 Netlify 提供的内置表单处理功能。当代码部署到 Netlify 时，系统会自动检测表单并在您的\
    \ Netlify 站点管理面板中创建一个表单提交页面。\n\n要创建 Netlify 表单，只需在 `<form>` 标签中添加 `netlify=\"\
    true\"` 属性数据，并添加 `<input type=\"hidden\" name=\"form-name\" value=\"YOUR_ VALUE\"\
    \ />` 隐藏字段，您就可以开始了。\n\n我们的表单将包含以下字段：\n\n- **全名**\n- **电子邮件**\n- **活动标题**\n- **日期**\n\
    - **场地**\n- **虚拟**\n- **活动 URL**\n- **描述**\n\n我们将表单添加到主页，就在页脚之前，如下所示：\n\n1. 打开位于\
    \ `/web/src/pages/` 下的 `index.js` 文件。\n2. 在闭合容器标签（`</Container>`）之前，我们可以像这样添加我们的表单：\n\
    \n```html\n<form name=\"propose-event\" method=\"POST\" data-netlify=\"true\"\
    \ >\n    <input type=\"hidden\" name=\"form-name\" value=\"propose-event\" />\n\
    </form>\n```\n\n"
