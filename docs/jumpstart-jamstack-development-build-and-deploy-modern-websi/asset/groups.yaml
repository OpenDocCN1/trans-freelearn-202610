    # # Deploying the GraphQL API


    Since Sanity uses GROQ internally, the optional GraphQL API needs to be deployed
    if Sanity''s dataset is used by other applications. To perform this, we need to
    return to the command line in the project''s `studio` directory.


    The following command needs to be typed into the Terminal:


    ```

    ```bash

    sanity graphql deploy

    ```

    ```


    We need to install the Sanity command-line program. Please type the following
    into the command line if it has not been installed already:


    ```

    ```bash

    npm install -g @sanity/cli

    ```

    ```


    You will be asked the following question:


    ```

    ```

    Do you want to enable a GraphQL playground? (Y/N)

    ```

    ```


    At this prompt, simply pressing the *Enter* key, or typing in Y, will enable the
    playground. The last line of the output that is produced should display the playground''s
    browser:


    ```

    ```

    GraphQL API deployed to:

    https://abcd1234.api.sanity.io/v1/graphql/production/default

    ```

    ```


    This URL can be opened in the web browser. Let''s examine the format.


    Notice that the URL is composed of the following: the project ID (which is shown
    here as `abcd1234`), followed by `api.sanity.io`, `v1` (version one), `graphql`,
    the dataset name (in this example, `production`), and, finally, the schema name
    (in this case, `default`).


    In the next section, we will explore the basic syntax of GraphQL.


    # ## Basic GraphQL syntax


    While Sanity''s GROQ uses a more compact syntax, its aim is to effectively get
    what you need from a collection of data. GraphQL''s aim is to allow the requesting
    service to specify the format of the data in an expressive and typed way to be
    returned, and then return it in that same format. We will now look at the basic
    syntax of a GraphQL query and how useful it might be to obtain data easily.'
