  md: "\n> **Important note**  \n> Before you start writing your custom plugin, please\
    \ make sure it does not already exist in the Gatsby Plugin Library.\n\nThere are\
    \ multiple benefits to using a plugin from the Gatsby Plugin Library. Some of\
    \ them are listed here:\n\n- **Time-saving:** If a plugin fully accomplishes your\
    \ task, you can install it, configure it, and start using it. If a plugin partially\
    \ accomplishes your task, you can extend it by adding your custom functionality\
    \ on top of it.\n- **Bug fixing:** You or other developers may fix bugs and publish\
    \ the information on npm, and get these fixes by updating the plugin in your application.\n\
    - **Improvement:** Same as bug fixing—you or other developers may add new functionality\
    \ to the plugin and publish it on npm.\n- **Security:** You or other developers\
    \ may find security issues with the code or dependencies in a plugin; update the\
    \ plugin with the latest security release and publish it on npm.\n\nTo find a\
    \ Gatsby plugin, visit the Gatsby Plugin Library at `https://www.gatsbyjs.org/plugins/`.\n\
    \nThe following page provides a **Search Gatsby Library** textbox that lets you\
    \ navigate through more than 2,000 plugins! The textbox is on the top left-hand\
    \ side of the page, as illustrated in the following screenshot:\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_127_0.png)\n\
    \n*Figure 9.1 – The Gatsby Plugin Library page*\n\nEach Gatsby plugin comes with\
    \ detailed instructions on how to install, configure, and use it. The Gatsby Source\
    \ plugins allow Gatsby to get the content from a source such as a database, file,\
    \ RESTful API (where **REST** stands for **Representational State Transfer**),\
    \ and so on.\n\nThe `Starter` project that we installed in *Chapter 2, Introduction\
    \ to Sanity* comes with the `gatsby-source-sanity` plugin already installed and\
    \ configured. Throughout the `gatsby-source-sanity` plugin, we are able to get\
    \ content from our Sanity application.\n\nIn the following section, we are going\
    \ to explain how to search for a plugin in the Gatsby Plugin Library. As an example,\
    \ we are going to install and configure two source plugins: the `gatsby-source-filesystem`\
    \ and `gatsby-source-drupal` plugins.\n\n## Searching for a plugin\n\nAll Gatsby\
    \ plugins can be found in the Gatsby Plugin Library at https://www.gatsbyjs.org/plugins/.\n\
    \nOn the left-hand side of the page, there is a search tool for a plugin. Start\
    \ typing the name of a potential keyword for the plugin you are looking for.\n\
    \nFor example, if you are looking for the Google Analytics plugin, you can type\
    \ `google analytics`.\n\nIn our example, we will look for the `gatsby-source-filesystem`\
    \ plugin, so we can type `source filesystem`, as shown in the following screenshot:\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_128_0.png)\n\nFigure 9.2 – The Gatsby\
    \ Plugin Library page\n\nOn the left-hand side of the page, it will return all\
    \ the results containing that keyword. Each result contains the name of the plugin,\
    \ a description, the number of downloads, and type of plugin. When you click on\
    \ the plugin result, you will be able to see a description of the plugin and instructions\
    \ on how to install it.\n\n## Installing the plugin\n\nPlugins are installed through\
    \ npm via the command line. When you have found the plugin you are looking for,\
    \ see the installation command on the plugin page, under the Install section,\
    \ as illustrated in the following screenshot:\n\n### Install\n\n```\nnpm install\
    \ gatsby-source-filesystem\n```\n\nFigure 9.4 – The gatsby-source-filesystem plugin\
    \ page Install section\n\nType the command shown in the preceding screenshot in\
    \ your Terminal inside the web folder of your project, and press Enter.\n\nThis\
    \ command will download the plugin and its dependencies inside the node_modules\
    \ folder and add the gatsby-source-filesystem plugin and version to download in\
    \ the package.json file, under the Dependencies section.\n\n## Configuring the\
    \ plugin\n\nNow, the plugin files are in their own application, but in order to\
    \ enable a plugin, we need to add it to the gatsby-config.js file located in the\
    \ root folder of the Gatsby project—in our case, inside the web folder.\n\nThe\
    \ gatsby-config.js file is one of the most important files of the application.\
    \ It contains configuration for the following:\n\n- siteMetadata (object)\n- plugins\
    \ (array)\n- pathPrefix (string)\n- polyfill (Boolean)\n- mapping (object)\n-\
    \ proxy (object)\n- developMiddleware (function)\n\nTo enable a plugin, simply\
    \ add the plugin name in the plugins array in the gatsby-config.js file, like\
    \ this:\n\n```\nmodule.exports = {\n  plugins: [\n    ...\n    'gatsby-plugin-name',\n\
    \    ...\n  ]\n}\n```\n\nSome other plugins may also take configuration options\
    \ that can be added in the plugins array in the gatsby-config.js file, as illustrated\
    \ in the following code snippet:\n\n```\nmodule.exports = {\n  plugins: [\n  \
    \  ...\n    {\n      resolve: 'plugin-name',\n      options: {\n        // Options\
    \ list, if any\n      },\n    },\n    ...\n  ]\n}\n```\n\nNow that we know how\
    \ to enable a plugin, let's enable the gatsby-source-filesystem plugin and tell\
    \ Gatsby where to find our content. On the Gatsby Plugin page, under the How to\
    \ use section, there are detailed instructions on how to configure the plugin\
    \ in your application.\n\nThe gatsby-source-filesystem plugin can take three options,\
    \ as follows:\n\n- name: The name used by GraphQL queries (required)\n- path:\
    \ The folder where the actual files live (required)\n- ignore: A list of file\
    \ extensions to be ignored (optional)\n\nIn our case, we can add the configuration\
    \ in this way:\n\n```\nmodule.exports = {\n  plugins: [\n    ...\n    {\n    \
    \  resolve: 'gatsby-source-filesystem',\n      options: {\n        path: '${__dirname}/src/data',\n\
    \        name: 'md-files',\n        ignore: ['**/\\.*'],\n      },\n    },\n \
    \   ...\n  ]\n}\n```\n\nWith the preceding code, we enabled the gatsby-source-filesystem\
    \ plugin, and we tell Gatsby where to find the files, the name of our content,\
    \ and to ignore all files starting with a dot. Now, restart your application.\
    \ From the command line, press Ctrl + C and then run the following command:\n\n\
    ```\nnpm run dev\n```\n\nAs an example, we are going to query data from a Markdown\
    \ file. We will create a folder called data under our web/src application folder.\
    \ Inside the data folder, we create all the Markdown files we need. The files\
    \ are organized in subfolders, and the system will automatically find them. To\
    \ do that, we need the gatsby-transformer-remark plugin, which we are going to\
    \ install in the next section.\n\n## Installing and configuring the gatsby-transformer-remark\
    \ plugin\n\nThis plugin parses and compiles the Markdown file and converts it\
    \ to HTML. It also supports frontmatter so that you can define fields such as\
    \ title, slug, date, image, excerpt, and so on.\n\nLet's install and configure\
    \ the plugin.\n\n### Installing the plugin\n\nAs this is a Gatsby plugin it can\
    \ be found in the plugin library, along with installation and configuration instructions.\n\
    \nInside your Gatsby folder, run the following command to install the plugin:\n\
    \n```\nnpm install --save gatsby-transformer-remark\n```\n\n### Configuring the\
    \ plugin\n\nOnce the plugin has been downloaded, we are able to enable it by adding\
    \ only the plugin name in the gatsby-config.js file, as shown in the following\
    \ code block:\n\n```\nmodule.exports = {\n  plugins: [\n    ...\n    'gatsby-transformer-remark',\n\
    \    ...\n  ]\n}\n```\n\nThat's it! Now, restart your application, and we are\
    \ ready to create our first content!\n\n## Creating the content file\n\nIn this\
    \ section, we are going to create our content inside a Markdown file. As we said,\
    \ gatsby-transformer-remark lets you add fields into the Markdown file. Let's\
    \ start adding the frontmatter, as follows:\n\n1. Create a file inside web/src/data\
    \ called hello-world.md. At the top and the end of the file, add three dashes.\
    \ Between those two lines, you can define your frontmatter, as follows:\n\n```\n\
    ---\n// Define your frontmatter.\n---\n```\n\n2. The fields in the frontmatter\
    \ can be defined as a key/value pair. We can add the information we want. In this\
    \ case, we will add title, date, and excerpt in the following way:\n\n```\n---\n\
    title: Hello World\ndate: \"2020-07-12T09:01:00\"\nexcerpt: Hi! This is my first\
    \ content from a markdown file! I will fill with James Joyce's poem.\n---\n```\n"
  mdcn: "\n> **重要提示**  \n> 在开始编写自定义插件之前，请确保该插件在 Gatsby 插件库中尚不存在。\n\n使用 Gatsby 插件库中的插件有诸多好处。这里列出其中的一些：\n\
    \n- **节省时间：** 如果一个插件能完全实现你的任务，你可以直接安装、配置并开始使用。如果一个插件只能部分实现你的任务，你也可以在其基础上添加自定义功能进行扩展。\n\
    - **修复 Bug：** 你或其他开发者可以修复 Bug 并将信息发布到 npm，然后通过更新应用中的插件来获取这些修复。\n- **改进功能：** 与修复\
    \ Bug 类似——你或其他开发者可以为插件添加新功能并发布到 npm。\n- **安全性：** 你或其他开发者可能会发现插件中的代码或依赖存在安全问题；更新到最新的安全版本并发布到\
    \ npm。\n\n要查找 Gatsby 插件，请访问位于 `https://www.gatsbyjs.org/plugins/` 的 Gatsby 插件库。\n\
    \n下面的页面提供了一个 **Search Gatsby Library** 文本框，让你可以在 2000 多个插件中导航搜索！文本框位于页面左上方，如下图所示：\n\
    \n![](img/97ab031f38e2174e2f1b51da18dfa1d0_127_0.png)\n\n*图 9.1 – Gatsby 插件库页面*\n\
    \n每个 Gatsby 插件都附带了如何安装、配置和使用的详细说明。Gatsby Source 插件允许 Gatsby 从数据库、文件、RESTful API（其中\
    \ **REST** 代表 **Representational State Transfer**）等来源获取内容。\n\n我们在*第 2 章，Sanity\
    \ 简介*中安装的 `Starter` 项目已经预装并配置了 `gatsby-source-sanity` 插件。通过 `gatsby-source-sanity`\
    \ 插件，我们能够从 Sanity 应用中获取内容。\n\n在下一节中，我们将说明如何在 Gatsby 插件库中搜索插件。作为示例，我们将安装并配置两个源插件：`gatsby-source-filesystem`\
    \ 和 `gatsby-source-drupal` 插件。\n\n## 搜索插件\n\n所有 Gatsby 插件都可以在位于 https://www.gatsbyjs.org/plugins/\
    \ 的 Gatsby 插件库中找到。\n\n在页面左侧有一个插件搜索工具。开始输入要查找的插件的潜在关键词。\n\n例如，如果你正在查找 Google Analytics\
    \ 插件，可以输入 `google analytics`。\n\n在我们的示例中，我们将查找 `gatsby-source-filesystem` 插件，因此可以输入\
    \ `source filesystem`，如下面的截图所示：\n\n![](img/97ab031f38e2174e2f1b51da18dfa1d0_128_0.png)\n\
    \n图 9.2 – Gatsby 插件库页面\n\n在页面左侧，会返回包含该关键词的所有结果。每个结果包含插件名称、描述、下载次数和插件类型。当你点击插件结果时，你将看到插件的描述以及如何安装的说明。\n\
    \n## 安装插件\n\n插件通过命令行使用 npm 安装。当你找到所需的插件后，请在插件页面的 Install 部分查看安装命令，如下面的截图所示：\n\n\
    ### 安装\n\n```\nnpm install gatsby-source-filesystem\n```\n\n图 9.4 – gatsby-source-filesystem\
    \ 插件页面的 Install 部分\n\n在项目 `web` 文件夹内的终端中，输入上面截图所示的命令，然后按 Enter 键。\n\n该命令会将插件及其依赖项下载到\
    \ `node_modules` 文件夹中，并将 gatsby-source-filesystem 插件及要下载的版本添加到 `package.json`\
    \ 文件的 Dependencies 部分。\n\n## 配置插件\n\n现在，插件文件已经在自己的应用中了，但为了启用插件，我们需要将其添加到位于 Gatsby\
    \ 项目根目录下的 gatsby-config.js 文件中——在我们的示例中，该文件位于 `web` 文件夹内。\n\ngatsby-config.js\
    \ 文件是应用中最重要的文件之一。它包含以下配置：\n\n- siteMetadata（对象）\n- plugins（数组）\n- pathPrefix（字符串）\n\
    - polyfill（布尔值）\n- mapping（对象）\n- proxy（对象）\n- developMiddleware（函数）\n\n要启用插件，只需在\
    \ gatsby-config.js 文件的 plugins 数组中添加插件名称，如下所示：\n\n```\nmodule.exports = {\n  plugins:\
    \ [\n    ...\n    'gatsby-plugin-name',\n    ...\n  ]\n}\n```\n\n一些其他插件可能还需要配置选项，这些选项也可以添加到\
    \ gatsby-config.js 文件的 plugins 数组中，如下面的代码片段所示：\n\n```\nmodule.exports = {\n  plugins:\
    \ [\n    ...\n    {\n      resolve: 'plugin-name',\n      options: {\n       \
    \ // Options list, if any\n      },\n    },\n    ...\n  ]\n}\n```\n\n既然我们知道了如何启用插件，现在让我们启用\
    \ gatsby-source-filesystem 插件，并告诉 Gatsby 在哪里可以找到我们的内容。在 Gatsby 插件页面的 How to use\
    \ 部分，有如何在应用中配置该插件的详细说明。\n\ngatsby-source-filesystem 插件可以接受三个选项，如下所示：\n\n- name：GraphQL\
    \ 查询使用的名称（必填）\n- path：实际文件所在的文件夹（必填）\n- ignore：需要忽略的文件扩展名列表（可选）\n\n在我们的示例中，可以这样添加配置：\n\
    \n```\nmodule.exports = {\n  plugins: [\n    ...\n    {\n      resolve: 'gatsby-source-filesystem',\n\
    \      options: {\n        path: '${__dirname}/src/data',\n        name: 'md-files',\n\
    \        ignore: ['**/\\.*'],\n      },\n    },\n    ...\n  ]\n}\n```\n\n通过上述代码，我们启用了\
    \ gatsby-source-filesystem 插件，并告诉 Gatsby 在哪里找到文件、内容的名称，以及忽略所有以点开头的文件。现在，重新启动你的应用。在命令行中按\
    \ Ctrl + C，然后运行以下命令：\n\n```\nnpm run dev\n```\n\n作为示例，我们将从一个 Markdown 文件中查询数据。我们将在\
    \ `web/src` 应用文件夹下创建一个名为 `data` 的文件夹。在 `data` 文件夹内，我们创建所有需要的 Markdown 文件。文件按子文件夹组织，系统会自动找到它们。为此，我们需要\
    \ gatsby-transformer-remark 插件，将在下一节中安装。\n\n## 安装和配置 gatsby-transformer-remark\
    \ 插件\n\n该插件解析并编译 Markdown 文件，并将其转换为 HTML。它还支持 frontmatter，这样你就可以定义 title、slug、date、image、excerpt\
    \ 等字段。\n\n让我们安装并配置该插件。\n\n### 安装插件\n\n由于这是一个 Gatsby 插件，因此可以在插件库中找到它，并附带安装和配置说明。\n\
    \n在你的 Gatsby 文件夹中，运行以下命令来安装插件：\n\n```\nnpm install --save gatsby-transformer-remark\n\
    ```\n\n### 配置插件\n\n插件下载完成后，我们只需在 gatsby-config.js 文件中添加插件名称即可启用它，如下面的代码块所示：\n\n\
    ```\nmodule.exports = {\n  plugins: [\n    ...\n    'gatsby-transformer-remark',\n\
    \    ...\n  ]\n}\n```\n\n就这么简单！现在，重新启动你的应用，我们已准备好创建第一个内容！\n\n## 创建内容文件\n\n在本节中，我们将在一个\
    \ Markdown 文件中创建内容。如上所述，gatsby-transformer-remark 允许你在 Markdown 文件中添加字段。让我们开始添加\
    \ frontmatter，如下所示：\n\n1. 在 `web/src/data` 中创建一个名为 `hello-world.md` 的文件。在文件的开头和结尾添加三条短横线。在这两行之间，你可以定义你的\
    \ frontmatter，如下所示：\n\n```\n---\n// Define your frontmatter.\n---\n```\n\n2. frontmatter\
    \ 中的字段可以定义为键/值对。我们可以添加想要的信息。在本例中，我们将按以下方式添加 title、date 和 excerpt：\n\n```\n---\n\
    title: Hello World\ndate: \"2020-07-12T09:01:00\"\nexcerpt: Hi! This is my first\
    \ content from a markdown file! I will fill with James Joyce's poem.\n---\n```\n\
    \n"
