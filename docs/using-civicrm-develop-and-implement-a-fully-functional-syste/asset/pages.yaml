- pgno: 427
  md: '# Report Settings


    **Report Settings** control the title of the report, the header and footer text
    (which will be displayed when the report is printed or exported as a PDF), e-mail
    settings, permissioning options, and navigation settings. Let''s take a minute
    to understand each of the options in this panel, as they are common to all reports.


    The title and description appears in the report listing page and should help users
    understand the criteria you configured for the specific report. When completing
    these fields, be specific about the purpose and criteria selected. For example,
    rather than using a generic title such as "Contribution Report", use a more descriptive
    title, such as "Donations Received, Year to Date".


    The header and footer fields contain the HTML code that is inserted into reports
    when they are printed or published to PDF. The default content may be sufficient,
    but is very generic. You may wish, for example, to replace the `<title>` tag with
    the actual title of the report. You may also want to include images and CSS styles
    to customize the look of your report. You do need to have at least a basic understanding
    of HTML in order to work with these fields. Be sure that your footer closes any
    tags that were opened in the header (such as the `<html>` and `<body>` tags).


    The report instances may be generated as a PDF file and e-mailed on a periodic
    basis. For example, you could have a report e-mailed to staff management every
    Monday that provides an overview of the recently received contributions. The membership
    services director could receive a report with upcoming lapsed memberships to make
    phone calls in order to solicit renewals of the same. Use the fields in this section
    to determine the recipients of the report (comma-separated lists) and the subject
    line of the report.'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'Note that the e-mail reports functionality requires setup of a cron job to
    control the reports that should be e-mailed, and the delivery frequency. Simply
    completing the fields present within the report settings will not actually trigger
    the report delivery. The cron job should invoke a URL using the following format
    (using wget or curl), where the instanceID value for your report is replaced with
    the corresponding report ID in your system:


    +   - Drupal: <yourwebsite>/sites/all/modules/civicrm/bin/CiviReportMail.php?instanceId=3&reset=1&sendmail=1&<name>=username&<pass>=password&<key>=sitekey

    +   - Joomla!: <yourwebsite>/administrator/components/com_civicrm/civicrm/bin/CiviReportMail.php?instanceId=3&reset=1&sendmail=1&<name>=username&<pass>=password&<key>=sitekey


    For a full discussion of cron jobs in CiviCRM, refer to Chapter 3, Installation,
    Configuration, and Maintenance.


    After creating a new report, you may view it on the Reports Listing page under
    the main Reports menu item. This page will always display the complete list of
    report instances active on your system. Additionally, you may choose to add a
    report instance to the navigation menu in a specified location. This ability is
    not restricted to the Reports menu item. For example, if you create a standard
    bookkeeping report that displays contributions received over the previous seven
    days, you can add that to the Contributions menu item.


    Under the Other settings section of Report Settings, click on the checkbox and
    select the parent menu item your report should fall under. Leave the parent menu
    field empty (set to - Select -) if you want the report added as a top-level menu
    item.


    Drupal users may restrict a report to certain permission(s) using the next field
    in the display. For example, you may decide that your contribution-related reports
    should not be accessible to the data entry staff who would have no need to review
    potentially sensitive financial data.


    The last option in this section provides the ability to enable the report to be
    included in the CiviCRM home page dashboard. Recall that when you first enter
    CiviCRM, you are presented with a dashboard page which displays a number of reports.
    The dashboard is fully configurable on a user-basis, meaning each user may choose
    different reports to include on that display. CiviCRM includes several special
    reports that are available as dashlets, and you may enable any other report created
    through the reports tool to be a dashlet. Very wide reports generally do not make
    good dashlets.'
  merge: -1
  img_proc: true
- pgno: 429
  md: 'Note that enabling a report as a dashlet does not automatically include it
    in your dashboard—it simply makes it available as an option. It is up to each
    user to configure their dashboard as they desire.


    The following screenshot is a sample Report Settings panel:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_429_0.png)'
  merge: -1
  img_proc: true
- pgno: 430
  md: '# Report workflows


    While working with reports, you will typically do one of the following:


    +   - Review an existing report instance

    +   - Review and modify an existing report instance on a temporary basis

    +   - Review and modify an existing report instance, choosing to update the saved
    report with your new criteria and settings

    +   - Create a new report from a template


    As mentioned earlier, you may visit **Reports | Reports Listing** to see a list
    of all the existing saved report instances, or if available, select your report
    from the appropriate menu item. Note that not all reports will necessarily be
    found on the **Reports** menu, as menu assignment happens on an individual-report
    basis. If you are working with an existing report and alter any of the criteria
    or settings, a button entitled **Update Report** will be displayed.


    Understand that clicking this button will save your settings to the report instance
    you are currently working with. Be sure you intend to do this, as it may alter
    the original intent of the report and affect other users. If you are only altering
    the criteria for temporary use, do not update the report; simply choose to preview
    the report, which allows you to view and take action on the report without saving
    it.


    > Depending on how you have configured CiviCRM, you may have already noticed that
    certain report types are not visible in your system. CiviCRM categorizes reports
    according to the component they work with, and will only display available reports
    for those components that you have enabled. For example, if you are not using
    the **Membership** component, you will not see any reports that display membership
    records.


    You create a new report instance by going to **Reports | Create Reports from Templates**
    or **Administer | CiviReport | Create Reports from Templates**. From this tool,
    you select the report template that will generate the report, choose your criteria
    and options, and name the report. Once it is named and saved, it can be retrieved
    and your criteria and options will be preserved.


    When creating a new report, you must first select your desired criteria and preview
    the report before you are given the additional report settings options. This is
    done to ensure you have valid criteria before saving the report.'
  merge: -1
  img_proc: true
- pgno: 431
  md: 'As noted earlier, completed reports may be printed, published as a PDF, or
    exported as a csv file. Some reports may be displayed in graphical format, such
    as a bar or pie chart. Constituent reports may have the option of adding the resulting
    contacts to a group.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_431_0.png)


    > You may run into difficulties printing very long reports as a PDF file. The
    PDF generation engine is very resource-intensive. Depending on the quality of
    your hosting environment, you may experience server timeouts while creating large
    PDF files. If you find this happening, consider restricting your criteria to generate
    smaller subsets of your report for PDF generation, or consider upgrading your
    hosting environment to a more robust solution.


    # Available templates


    CiviCRM ships with over 25 report templates covering everything from constituent
    lists, bookkeeping reports, event participation, memberships, and case review.
    The following list, organized by CiviCRM component, provides a brief description
    of each template available at the time of writing this book.


    > Note that new report templates are continuously added to the system; review
    the list on the Create Reports from Templates page for a description of reports
    available with your current version.


    # Contact report templates


    The contact report templates are as follows:


    +   - **Constituent Report (Summary)**: Provides a list of address and contact
    information for constituent records.

    +   - **Constituent Report (Detail)**: Provides contact-related information on
    contributions, memberships, events, and activities.

    +   - **Activity Report**: Provides a list of constituent activity, including
    activity statistics for one or all contacts during a given date range (required).'
  merge: -1
  img_proc: true
- pgno: 432
  md: '+   - **Walk/Phone List Report**: A basic contact report with layout options
    designed for use in a phone bank or as a walk list. This report has additional
    use with the CiviEngage toolset. Originally designed as a Drupal module geared
    toward political campaign support, CiviCampaign and elements of CiviEngage will
    be included in core CiviCRM as part of v3.3.

    +   - **Current Employer Report**: Provides a basic report detailing contacts
    in an employer/employee relationship. The report includes details about the relationships,
    such as the relationship start date (employed since).

    +   - **Relationship Report**: Filters constituents by relationship type for either
    side of the relationship, and by groups, tags, and address fields.

    +   - **Database Log Report**: A log of contact and activity records created or
    updated in a given date range (changelog data).

    +   - **Activity Report (Summary)**: Shows activity statistics by type/date, filtered
    by status or priority.


    # Contribution report templates


    The contribution report templates are as follows:


    +   - **Donor Report (Summary)**: Shows contribution statistics by month/week/year,
    country/state, and type.

    +   - **Donor Report (Detail)**: Lists detailed contribution(s) for one/all contacts.
    Contribution summary report points to this report for specific details.

    +   - **Donation Summary Report (Repeat)**: Given two date ranges, shows contacts
    (and their contributions) who contributed in both the date ranges with percentage
    increase/decrease.

    +   - **Donation Summary Report (Organization)**: Displays a detailed contribution
    report for organization relationships with contributors. This includes the contribution
    record from an employee of some organization or from that organization itself.

    +   - **Donation Summary Report (Household)**: Provides a detailed report of contributions
    made by contributors (or the household itself) who have a relationship with the
    household. For example, a contributor is the head of household for some households,
    or is a member of the household.

    +   - **Top Donors Report**: Provides a list of the top donors during a time period
    you define. You can include as many donors as you want (for example, top 100 of
    your donors).

    +   - **SYBUNT Report**: "SYBUNT" stands for "Some year(s) but not this year".
    It provides a list of constituents who donated at some time in the history of
    your organization, but did not donate during the time period you specify.'
  merge: -1
  img_proc: true
- pgno: 433
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 434
  md: '# Pledge report templates


    The pledge report templates are as follows:


    +   - **Pledge Report**: Displays pledge details filtered by date, amount, or
    status.

    +   - **Pledged But not Paid Report**: Displays contacts who have pledged, but
    have outstanding or overdue payments.


    # Case report templates


    The case report templates are as follows:


    +   - **Case Summary Report**: Provides a summary of cases and their duration
    by date range, status, staff member and/or case role.

    +   - **Case Time Spent Report**: Aggregates the time spent on case and/or non-case
    activities by activity type and contact.

    +   - **Contact Demographics Report**: Displays demographic breakdown for case
    clients (and/or non-case contacts) in your database. It also includes custom contact
    fields.


    # Grant report templates


    The grant report templates are as follows:


    +   - **Grant Report**: Generates report filterable by any of the grant data fields,
    including date range options.


    > A few report templates come in a disabled state. Visit **Administer** | **CiviReport**
    | **Manage Templates** to view and manage the status of report templates registered
    in your system.'
  merge: -1
  img_proc: true
- pgno: 435
  md: 'FPAGM staff members deal with several levels of leadership and key stakeholders
    who expect to receive reports on a regular basis. This includes the Executive
    Director, who is concerned with membership numbers and total donations, the Marketing
    Committee chair, who requires monthly membership status reports, and the Development
    Committee Chair, who wants to see total contributions of major donors over specified
    periods of time.


    During system configuration, for each requested report, they review the list of
    templates and select and configure the one they believe will be most appropriate
    for their needs. Since the Executive Director has much on his/her plate, he/she
    look for reports that support bar and pie charts, as it provides a visual snapshot
    of the organization''s activity that can be interpreted quickly.


    The Marketing Committee chair wants to receive reports on a monthly basis. The
    staff members use the **Membership Report (Summary)** template to construct a
    report that breaks down membership by type, grouped by month, and displays data
    for the previous 12 months. The e-mail settings are configured and a cron job
    is set up to have this report e-mailed to the chairperson on the last day of the
    month, freeing staff from the responsibility of generating and sending the report.


    Likewise, a "Top Donors" report is constructed, displaying the activity for the
    previous six months. Since this report is only provided as requested, staff members
    save it to the **Contributions** menu for easy access.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_435_0.png)


    # Customizing and building your own templates


    Though the reports that ship with CiviCRM seek to anticipate the bulk of your
    potential reporting needs, it is possible that you may have needs not addressed
    by existing report templates.


    While it is beyond the scope of this book to delve into specific details regarding
    the development of new report templates, it is important to note that the report
    tools anticipate these needs. The code to build templates is very self-contained,
    modularized, and somewhat more accessible to beginner programmers than other areas
    of the software. You still need some familiarity with PHP and the MySQL database
    in order to build your own report template, but you may find it easier to work
    with than other areas of the CiviCRM codebase.


    If you are interested in exploring this further, visit the following online documentation
    for guidance on customizing or creating a template: http://wiki.civicrm.org/confluence/display/CRMDOC/Custom+Reports+(How+to).'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# Summary


    Let''s circle back to the original premise set forth at the beginning of this
    chapter:

    *A report is primarily about telling a story—it is data with a message.*


    We began this chapter thinking about what a report truly is, and guarding ourselves
    against missing the forest while staring at trees. After having reviewed the mechanics
    of creating and working with reports and outlining the various report templates
    available, it would be easy to lose sight of this broader context.


    The reporting tools covered in this chapter are a means toward an end. You will
    select your report fields, define data filters, and choose your display options
    with the goal of communicating to other staff, organization leaders, or yourself,
    about the story of your constituents. This story takes shape through the lens
    of activities, contributions, pledges, memberships, events, cases, grants, or
    other windows into your data.


    In this chapter, we:


    +   - Set the context for working with reports and understanding the goal of reporting

    +   - Defined key terminology used in CiviCRM reporting tools, including report
    templates and report instances

    +   - Reviewed available report settings common to all reports

    +   - Outlined the use of report criteria, which will be report-specific

    +   - Summarized available report templates that are included with a base installation
    of CiviCRM

    +   - Reviewed the core purpose and goal of reporting'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# # Customization, Community, and Cooperation


    In this closing chapter, we want to tie up some loose ends and point you forward
    in your implementation of CiviCRM. We will learn about the following:


    +   - Future versions and project roadmap

    +   - Customizing and extending

    +   - Community and cooperation


    # ## Future versions and project roadmap


    When we began writing this book, the current stable version of CiviCRM was 3.1.4
    and 3.2 alpha was just being released to the community. Since then, v3.2 stable
    has been released and gone through several revisions, and 3.3 is now a stable
    release. By the time book production is finished, v3.4 will be nearing an alpha
    release. Needless to say, the CiviCRM development cycle typically follows the
    open source mantra of "Release early, release often".


    This book is based on the v3.2 series. At times, we''ve provided comments where
    new v3.3 functionality impacts or expands the existing v3.2 toolset. However,
    for the most part we''ve focused on functionality present in the v3.2 release.'
  merge: -1
  img_proc: true
- pgno: 438
  md: '# New functionality


    If you are new to CiviCRM and are introduced to a more recent version than v3.2,
    this book will still be of value to you, as the vast bulk of functionality is
    the same. The following represents key new features in v3.3 that we''ve not covered
    in this book:


    +   - CiviCampaign is introduced as a new component in a somewhat beta version.
    The functionality is geared toward advocacy organizations and political campaigns,
    providing tools for canvassing, petitions, and surveys.

    +   - **Advanced Search** can now be used to retrieve related records (not just
    contact records). Recall that when we reviewed search tools, we distinguished
    the different "lenses" through which records could be searched and retrieved.
    **Basic Search** and **Advanced Search** retrieve contacts (no duplicates) and
    component searches retrieve the related records (such as contributions). In v3.3,
    **Advanced Search** can now be used to retrieve these related records. For example,
    you can specify search criteria across contributions, memberships, and events,
    and retrieve contribution records.

    +   - The dedupe/merge engine has been significantly reworked to improve performance.
    In previous versions, this tool could take significant time or would timeout if
    run across a large database. It will now scale quite well for large datasets.

    +   - CiviMail has also received some scalability improvements and now supports
    multi-threaded sending. While dependent on the capabilities of your SMTP service,
    this can significantly increase throughput for large mailings. Several new reports
    have also been created to provide tools for searching across multiple mailings.

    +   - A number of new reports for CiviCase and CiviGrant have been added, expanding
    the types of data that can be retrieved from these components.

    +   - CiviEvent price sets now support a maximum value for field options. This
    was primarily intended to restrict the number of attendees signing up for breakout
    sessions. Many conferences have concurrent breakout sessions with a maximum number
    of attendees based on the size of the room. Each set of sessions will be a price
    set field, and each concurrent session an option value displayed as radio buttons
    with associated prices (if applicable) and maximum number of attendees.

    +   - Do you recall the ability to share a household address with individuals
    discussed earlier in this book? In v3.3, this structure is extended to any contact
    type. For example, an individual could have their work address set to share the
    address of their employer.'
  merge: -1
  img_proc: true
- pgno: 439
  md: '+   - One existing weakness in CiviCRM is the limited change tracking mechanism.
    While v3.2 and prior do a good job of tracking who made the most recent change
    and when, they offer little information about the nature of the change. V3.3 introduces
    a first effort at a full audit trail in which any and every change made to the
    database is logged and can be accessed. The tools for reviewing, interacting with,
    and restoring from those changes are initially limited. However, the raw data
    will be there, protecting you from unintended deletions. At some point, we may
    see quality assurance and moderation functionality allowing supervisors to monitor
    and approve self-service and front-line staff changes.

    +   - On more of the developer side of the discussion, v3.3 includes upgraded
    versions of jQuery and jQuery UI, as well as a new mechanism for installing CiviCRM
    extensions for reports, custom searches, payment processors, and other tools.
    The CiviCRM community is rapidly broadening, bringing with it many new audiences
    who are involved in developing and extending the software to meet their organizational
    needs. This extension framework provides more flexibility for packaging and disseminating
    tools for specific needs. It enables specialized functionality to be developed
    and supported by the community without requiring it to be included in the core
    download.


    As with every release, there are numerous minor improvements throughout the software
    seeking to increase performance, create more efficient workflows, and expand functionality.


    # Upcoming versions


    It''s not possible to accurately identify exactly what will be part of the next
    release. However, there are a few key pieces which are clearly on the radar screen.


    Chief among those will be compatibility with the latest CMS releases: Drupal 7
    and Joomla! 1.6.


    The timeline for those releases is likely to dictate the version numbering used.
    CiviCRM v4.0 will most likely be reserved for a version fully (and exclusively)
    compatible with the new CMS releases.


    Apart from the CMS compatibility issue, these versions are likely to include some
    degree of code restructuring with the goal of improving performance and upgrading
    core libraries to new offerings that will provide a better toolset moving forward.
    For a more detailed and current list of features planned for upcoming releases,
    visit http://wiki.civicrm.org/confluence/display/CRM/CiviCRM+Roadmap.


    Be sure to monitor the CiviCRM blog (http://blog.civicrm.org) to learn more about
    these new releases and how to be engaged in the process.'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# Customizing and extending


    Early in this book, we presented CiviCRM''s open source licensing as one of the
    chief selling points of the software. Open source means the source code is readily
    available and can be altered or added to without infringing on the license. In
    short, it means you can open up the hood and tinker with it to your heart''s content.


    Of course, "tinkering" isn''t really what benefits you. It''s the ability to truly
    customize, expand, add-on, restructure, or do whatever you need to, in order to
    make sure this software suits the needs of your organization. Then, you can share
    with the community so that you benefit from their efforts to improve, document,
    support, and extend the software. That is the true value of open source. Unlike
    proprietary closed-source software, you''re not wholly dependent on the roadmap
    plans of the company who owns the software (crossing your fingers in the hope
    they build your desired functionality), nor are you required to work through their
    support desk to achieve software modifications. Open source means you can modify
    the code yourself, or hire a developer to help achieve your needs.


    While it''s beyond the scope of this book to delve fully into CiviCRM customization,
    we want to leave you with some best practices and general direction for effectively
    pursuing your own customization efforts.


    # Built to be customized


    Realize first of all that CiviCRM was built to be customized. If you were to have
    a conversation with the core team, they would tell you that they built the software
    with the express purpose of making it as easily extendable as possible. They don''t
    want you to be hamstrung by the code. They want to help you achieve your customization
    needs quickly and efficiently. There are several ways in which this is realized.


    # Hooks and overrides


    The first way the software supports customization is through code management assistance.
    Hooks provide tools for injecting your code into existing processes and are the
    cleanest (and generally most upgrade-friendly) path to customization.


    If you''re familiar with Drupal''s hook structure, you will find CiviCRM''s structure
    to be patterned in a similar way. You insert your own code into the executed process
    when particular events occur, without having to modify anyone else''s code. In
    Drupal, you implement hooks via modules; in Joomla!, they are handled through
    a single hook file that can be stored in your PHP override directory (as described
    in the following section). In either case, your hook implementation will consist
    of calling the hook function, limiting its scope (if appropriate), and altering
    or adding to the code behavior as needed. For example, you can use the buildForm
    hook to alter default values on a profile form displayed on your site.'
  merge: -1
  img_proc: true
- pgno: 441
  md: 'For a list of available books and specific guidance on implementing them, visit
    `http://wiki.civicrm.org/confluence/display/CRM DOC/CiviCRM+hook+specification.`


    Hooks are clean and are generally preferred because you are typically working
    with and impacting only the code that pertains to your specific needs. In the
    preceding example where you are altering a default form value, the hook allows
    you to zero in on the specific form and alter just the desired field, without
    touching or impacting any other field or process in the form class. Your customization
    "footprint" is kept to a minimum.


    However, you will at times have more significant customizations that cannot be
    accomplished with a hook, or for which no hook is currently available. In those
    cases, CiviCRM provides the ability to define override directories for both PHP
    and template (`.tpl`) files. It''s often easier to modify the layout of a page
    by overriding a `.tpl` file than it is to modify the PHP code that determines
    what will be displayed.


    An override directory, as the name suggests, is a location distinct from the core
    code in which you place modified versions of files which will "override" the core
    files. Before using override directories, you must define them in your global
    settings. Visit **Administer | Configure | Global Settings | Directories** to
    set those locations, taking note of the recommended settings found in the help
    text (depending on your CMS). Once configured, you will place your modified copy
    of the original core file in the corresponding folder path inside the override
    directory.


    For example, suppose your PHP override directory for a Drupal installation of
    CiviCRM is `/var/www/domain.com/public_html/sites/domain.com/files/civicrm/custom_php/`.
    To override the form file used to create a new case, you would place your modified
    file in `/var/www/domain.com/public_html/sites/domain.com/files/civicrm/custom_php/CRM/Case/Form/Case.php`.


    In Joomla!, the standard location to place the override files will be in your
    media directory. For example: `/var/www/domain.com/public_html/media/civicrm/custom_php/CRM/Case/Form/Case.php`.


    > Files for specific profiles, contribution pages, and events can be overridden
    separately from those for other profiles, contribution pages, and events. Insert
    an extra directory level with the ID of the profile, contribution page, or event
    to override. For example, `/var/www/domain.com/public_html/sites/domain.com/files/civicrm/custom_tpl/CRM/Contribute/Form/Contribution/11/Main.tpl`
    will override the contribution page with an ID of 11.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_441_0.png)'
  merge: -1
  img_proc: true
- pgno: 442
  md: 'There are several important things to note when using override files:


    +   - PHP override folders must be built from the CRM directory, as exemplified
    previously. Template overrides will be built from the `/templates/CRM/` directory.
    In other words, the structures are built from the `civicrm/` package subfolder
    (in your core files).

    +   - The override file itself should be a modified form of the original file.
    Even if you are only altering a small portion of the file, the entire file will
    replace the corresponding core file and thus must include all necessary code.
    This is the key difference between hooks and override files—whereas hooks may
    alter code at the line level, override files alter at the file level.

    +   - Be sure to work with the correct version of the core file and maintain updates
    in both your core and override files. For example, if your site is running v3.2.4,
    don''t use the core file from v3.2.5 as the basis for an override customization.
    The newer revision may include additional changes that break your site functionality.
    When upgrading your site to a newer version or revision, you should plan to carefully
    compare code in your override files and re-implement your modifications using
    the new core version.


    Both of these customization methods help you achieve an important principle in
    development: don''t mess with the core files. Wherever possible, you should avoid
    altering core code files. Failing to do so will impede your ability to cleanly
    upgrade the code base and leave you vulnerable to overlooking (and losing) important
    modifications.


    # APIs


    If your customizations take place within the CiviCRM environment, you can easily
    access and make use of the classes and methods throughout the code. However, if
    you are extending CiviCRM outside of that environment (such as a Joomla! extension
    or Drupal module), you may want to make use of CiviCRM''s public API.


    You can view a list of APIs online at `http://wiki.civicrm.org/confluence/display/CRMDO/CiviCRM+Public+APIs`
    or through the (relatively) new API documentation at `http://api.civicrm.org`.


    APIs can be invoked through the PHP code in your site, the CiviCRM REST interface,
    in JavaScript or AJAX, through Smarty templates, through the Drush module in Drupal,
    or even by creating standardized wrappers in other languages like Perl. Depending
    on your access method, you will adapt the function calls with associated parameters
    accordingly. For more details about implementing the API through these various
    methods, visit the API link provided above.'
  merge: -1
  img_proc: true
