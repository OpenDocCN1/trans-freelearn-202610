- pgno: 223
  md: '# Joomla!


    If you are already a Joomla! user, you are aware that the primary method for creating
    page links is through menu items. In addition to providing an interface for selecting
    various configuration options for pages, menu items also provide access to module
    configuration. Modules are the blocks of content and functionality that are found
    in various positions (as defined in your template) around the page. They may include
    menus, footer text, login forms, recent content items list, and other such tools.


    As a result of the connection between menu items and modules, you will often want
    to create links to CiviCRM resources through the menus. To do this, select your
    desired menu from the admin navigation bar and click on New to create a menu item.
    After selecting CiviCRM, you are given a number of sub-options for the type of
    page you wish to create. Our focus will be on the Profile options.


    > If you want the benefit of building links to CiviCRM resources through menus
    but don''t actually want the menu visible on your website, create a new menu called
    "Link Setting Menu" and leave the corresponding module in the Joomla Module Manager
    disabled. In Joomla!, the menu configuration is separate from its visibility/display
    on your site - which is handled through the Module Manager. Your menu may exist
    and have valid, accessible links, but not actually be visible on your website.
    In this way, the menu manager serves more as an internal-link manager.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_223_0.png)'
  merge: -1
  img_proc: true
- pgno: 224
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 225
  md: '+   - **Edit:** `index.php?option=com_civicrm&task=civicrm/profile/edit&reset=1&gid=N`

    +   - **Search:** `index.php?option=com_civicrm&task=civicrm/profile&reset=1&gid=N`

    +   - **View:** `index.php?option=com_civicrm&task=civicrm/profile/view&reset=1&gid=N`


    For example, our FPAGM directory search page could be accessed at http://fpagm.usingcivicrm.com/index.php?option=com_civicrm&task=civicrm/profile&reset=1&gid=8.


    After constructing your link, be sure to test it on your website and confirm that
    it is displaying as expected.


    Joomla!''s native **search engine friendly (SEF)** option will correctly handle
    the initial link to a CiviCRM resource (subsequent pages are rebuilt as standard
    URL strings). If you are using a third-party SEF extension, be sure to test your
    CiviCRM pages thoroughly to ensure compatibility.


    # Drupal


    Links to CiviCRM profiles within Drupal will always be constructed through URL
    links to CiviCRM. These may be added as menu items or as links from within the
    content of a node. You can use either absolute or relative addressing for links.
    For absolute links, append one of the following relative URLs to the base URL
    of your Drupal site including a trailing slash (for example, http://yourdomain.org/),
    replacing "N" with the ID of your profile (visible in the profile list):


    +   - **Create:** `civicrm/profile/create&reset=1&gid=N`

    +   - **Edit:** `civicrm/profile/edit&reset=1&gid=N`

    +   - **Search:** `civicrm/profile&reset=1&gid=N`

    +   - **View:** `civicrm/profile/view&reset=1&gid=N`


    Drupal users may also configure permissions for accessing profiles. Use Drupal''s
    **Access Control** tools to determine which roles can access profile pages and
    other CiviCRM forms (such as contribution pages and event registrations):


    +   - If you want **Anonymous** (not logged in) visitors to access profile pages,
    grant the profile listings and forms permission to the **Anonymous** role

    +   - If you are using custom fields in your profiles and want anonymous visitors
    to access the form or page, you also need to grant **Custom Data Access** to the
    **Anonymous** role'
  merge: -1
  img_proc: true
- pgno: 226
  md: "If you are using a profile for user account signups, you will need to configure\
    \ permissioning as described previously. However, if you do not need anonymous\
    \ access, you can restrict profiles to specific roles, as needed.\n\nYou can further\
    \ control access to specific profiles for subsets of your users using CiviCRM's\
    \ **Access Control Lists (ACLs)**.\n\nAdditional fine-grained access (for example,\
    \ exposing profiles to anonymous users by default, but restricting access for\
    \ specific profiles) can be accomplished with functions added to your Drupal theme.\
    \ Visit the CiviCRM online documentation for more examples and sample code: `http://wiki.civicrm.org/confluence/display/CRMDOC/Linking+Profiles`.\n\
    \n# # Additional options through URL variables\n\nCiviCRM provides several additional\
    \ options for refining profile display using URL variables. These parameters should\
    \ be appended to the create/edit/search/view URL you've selected.\n\n+   - `&force=1`:\
    \ If your profile is configured to limit results to a group, this option will\
    \ display the group list when the profile search page is first opened (by default,\
    \ search pages open to just the search form). This option only applies to search\
    \ profiles.\n+   \n+   - `&search=0`: This option will hide the search form for\
    \ search page profiles. Used in conjunction with the previous option, you can\
    \ create a profile page that displays members of a group with no searching options.\n\
    +   \n+   - `&field_name=value`: Use this option in conjunction with the `&force=1`\
    \ option to return a filtered list of results for your search and listing page.\
    \ Multiple filters may be applied, if desired. For example, to return a list of\
    \ records in New York, append: `&state_province-Primary=1031`. Note that the field\
    \ must be present in your profile definition as a public user and listing field.\
    \ If you are uncertain what the field name is you wish to filter on, view the\
    \ search page source in your browser and identify the form field name. You can\
    \ also retrieve the field value for select/checkbox/radio button fields, such\
    \ as the numeric value of states in the example above.\n+   \n+   - `&map=1`:\
    \ Use this option to display a map by default for the result set. Note that you\
    \ must have the profile configured to have mapping enabled (under **Advanced Settings**)."
  merge: -1
  img_proc: true
- pgno: 227
  md: 'If you are using CiviMail to conduct broadcast e-mails from the system, there
    is a special `checksum` token that can be used while sending links to profile
    pages. Tokens are used in CiviMail to replace values unique to each contact record
    when the e-mail is sent. In essence, they allow you to do merge mailings with
    e-mails. The checksum token is a unique value created for each contact when the
    mailing is sent out. By appending the checksum token to your profile URL string,
    recipients can click the link and have the profile form loaded with their contact
    information pre-filled, even if they are not logged in to the site. We will cover
    CiviMail capabilities in more detail later in the book.


    When using the checksum feature, the profile URL should have the following appended
    to it: `&id={contact.contact_id}&{contact.checksum}`. When CiviMail sends the
    e-mail it inserts the user''s contact ID and unique checksum value.


    If you find that your constituents are not accustomed to logging in to your website
    to update their contact information through a profile edit form, you may find
    it useful to e-mail them with the link to the edit form. They can access the page
    without logging in and can interact directly with their contact record. Note that
    the checksum value expires seven days after sending the e-mail for security reasons.
    While this improves security, there remain certain risks while using this feature.
    The link constructed by the checksum provides a gateway to the user''s data (controlled
    by the profile) without requiring them to log in. That means if they forward the
    e-mail to someone, the recipient would gain access to their contact record (within
    the seven-day access window).


    # Importing contact and activity data


    Profiles provide excellent tools for empowering constituents to work with their
    own record or to construct simplified data entry forms for your organization staff.
    However, quite often you are working with a large number of contact records that
    must be added to your system, which may be too many to efficiently enter manually
    through a profile form.


    It''s also very likely that your CiviCRM implementation project will involve some
    migration of data from an existing legacy system. Even if you''re a startup not-for-profit,
    you are likely to have some contact records obtained from an external source that
    will seed your CRM database.


    CiviCRM provides some powerful interface tools to import records from comma separated
    values (CSV), files, or from a recordset specified by an SQL query. Even with
    a very powerful interface, there will be some work to do with your existing data
    to prepare it for import.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Collecting, Organizing, and Importing Data


    Let''s take a moment to review the import interface and then retrace our steps
    to understand the data preparation concerns involved in importing. CiviCRM provides
    tools for importing contacts, activities, contributions, membership, and event
    registration records. Our concern in this section will be contacts and activities.


    # Contacts import


    To access the contact import tool, browse to **Contacts | Import Contacts**. This
    tool consists of a four-step wizard where you will upload your file, map the import
    file to the existing CiviCRM fields, review the mapping and choose to add contacts
    to a group or tag, and then complete the import with any subsequent notifications
    about the data.


    In the first step you will choose to upload either a CSV file or connect to a
    database through an SQL query. In most cases you will be working with a CSV file.
    If you choose to construct an SQL query for retrieving the data, the database
    must reside on the same server and the database user configured in your CiviCRM
    installation must have sufficient permissions on that database. In either case,
    CiviCRM will retrieve the data and allow you to map the fields to CiviCRM fields.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'If you are importing from a csv file there are a few things to keep in mind:


    +   - There will be a maximum upload file size depending on the configured PHP
    settings for your server. The file size limit will be listed in the notes under
    the upload box.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '+   - The number of records CiviCRM will be able to upload and process through
    this tool will largely depend on the resources and settings of your server. If
    you are on shared hosting or a low resource VPS, you may find that you need to
    split your import file into smaller chunks (less than 1000 records) in order to
    process the import. If you have your own server or high-resource VPS, you may
    want to increase the PHP timeout and memory limit significantly. If the site is
    not live or you are not experiencing much site traffic, you could consider setting
    the timeout value to zero, which will prevent it from timing out altogether. Be
    sure to return it to a proper setting after conducting your import.

    +   - The best format for importing data is UTF-8. If your data has special characters,
    this format is required. If you need to import data from a different format you
    should visit **Administer | Configure | Global Settings | Localization**, where
    you can configure an alternate **Legacy Encoding**. By default, CiviCRM will have
    the Windows-1252 format configured for this setting (used by MS Excel). Wherever
    possible, use UTF-8 as it provides the greatest data integrity.


    Before you proceed with the import process, back up your data. Should the import
    script run into problems, timeout, or you inadvertently assign data to an incorrect
    field, you will want to have a reliable backup for restoring your existing data
    and re-implementing the import:


    +   1. After browsing to select the file for upload, indicate if the first row
    of your data contains column headers. You will want to use column headers when
    possible as it will greatly assist your field mapping step. Then review the import
    options.

    +   2. When importing contacts, you may only import a single contact type at a
    time. In other words, your import file is not allowed to have a mixture of organization
    and individual records, or individual and household records. If your data has
    mixed contact types, you will need to separate the records into different files
    or queries for each type represented.

    +   3. Select how duplicate records should be handled on import. CiviCRM will
    use the default **Strict** rule for the appropriate contact type found in **Contacts
    | Find and Merge Duplicate Contacts**. There are four options available; give
    some thought to your existing data and import data before you select your option.
    The options are as follows:

    +      - **Skip**: The default behavior, **Skip**, will alert you about any matching
    records, produce a report which can be downloaded, and when processing the records,
    will completely skip the matched record.'
  merge: -1
  img_proc: true
- pgno: 231
  md: "+   - **Update:** When a duplicate match is found, the data in the import file\
    \ will update (overwrite) the existing data or fill the fields if no existing\
    \ data is present. The update option will not affect the fields not included in\
    \ the import file. Note that this option will not overwrite existing data with\
    \ blank data from the import file—it preserves the existing data in such cases.\n\
    +   - **Fill:** The import data will only write to a field if no existing data\
    \ is present. If the field has a value, it will be skipped during import.\n+ \
    \  - **No Duplicate Checking:** Records are imported, irrespective of the existence\
    \ of matching records.\n\n+   4. If your import file contains date fields, select\
    \ the format for the fields. Note that all the date fields in your import file\
    \ must be formatted in the same way and the data must be consistent throughout.\
    \ This is often an area where you must do some scrubbing with your existing data\
    \ before importing.\n+   \n+   5. For sites configured for geocode mapping, you\
    \ may choose to do a mapping lookup on import. This option should only be used\
    \ for small data sets as it takes significant time for your server to communicate\
    \ with your mapping provider for each address imported. If you are importing a\
    \ large set of data, you will need to run the `/civicrm/bin/UpdateAddress.php`\
    \ script from the command line or URL after importing. That script is better suited\
    \ for large scale mapping lookups.\n+   \n+   6. In the second step of the **Import**\
    \ wizard, you will map the import fields to CiviCRM fields and will be given the\
    \ option of saving the import mapping for future use. Using a saved mapping is\
    \ particularly helpful if you've had to slice your data file into smaller chunks\
    \ in order to process the import, if you regularly import records from a common\
    \ source, or if your data is dirty and the import might fail or need to be rerun.\
    \ Once one mapping is saved in the system, you will see an option available for\
    \ selecting that mapping on the first step of the import wizard. Don't worry;\
    \ if your import file differs slightly from a previous mapping, you will still\
    \ have opportunity to review and modify the mapping before proceeding with the\
    \ import."
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Collecting, Organizing, and Importing Data


    7. After completing this form, proceed to step two, where you will map import
    fields with CiviCRM fields. The following screenshot demonstrates a sample mapping:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_232_0.png)


    8. When CiviCRM first loads the file, it attempts to map the fields for you. You''ll
    need to review and complete the mapping. In the following step you''ll have opportunity
    to review the mapping and be notified if there are any initial errors in the import
    file. If there are errors, CiviCRM will provide a link to download a csv file
    containing the rows with errors and a description of the error. In most cases,
    the errors will be due to an invalid value, such as a malformed e-mail address
    or a value that does not match an option for a field.


    9. After reviewing the errors file, you may choose to correct the errors, return
    to the first step, reload it and continue, or proceed with the import and handle
    the errors separately. This step also provides the option of adding the contacts
    to a new or existing group, or a new or existing tag.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Import Contacts


    ✓1. Choose Data Source   ✓2. Match Fields   ×3. Preview   4. Summary


    # Preview (step 3 of 4)


    The information below previews the results of importing your data in CiviCRM.
    Review the totals to ensure that they represent your expected results. Click ''Import
    Now'' if you are ready to proceed.


    << Previous   Import Now >>   Cancel


    | Total Rows | 3 | Total number of rows in the imported data. |

    | Valid Rows | 3 | Total rows to be imported. |


    # Saved Field Mapping: Basic Import


    | Column Names | Import Data (row 1) | Import Data (row 2) | Matching CiviCRM
    Field |

    | Fname | John | Janis | First Name |

    | Lname | Markhardt | Jones | Last Name |

    | City | Metrotown | Metrotown | Home -City |

    | State |  |  | Home -State |

    | Zip | 10257 | 10257 | Home -Postal Code |

    | Phone | 123-123-4567 | 123-234-5678 | Home -Phone -Phone |


    +   > Add imported records to a new group

