- pgno: 110
  md: '# Maintaining a good e-mail server reputation


    Any broadcast e-mails sent by your system will be monitored by various spam detection
    systems operating on the Internet. While you do not have direct control over those
    systems, you do have the ability and responsibility to construct and manage your
    broadcast e-mail systems in such a way so as to minimize the likelihood that you
    will be flagged as a spammer. This process of reputation management involves domain
    record configuration, including sender details in your e-mails, providing unsubscribe
    and opt-out tools, and processing bounced e-mails so that you are not repeatedly
    mailing to bad e-mail addresses, and so on. Each of these things will help contribute
    toward lower spam scores and ensure you are able to continue reaching your constituents
    effectively through broadcast e-mails. In this section we will take a look at
    DNS (domain record) related considerations.


    The first step is to set up an SPF record in the DNS for your domain, and ensure
    that it is correctly configured whenever you move servers. The Sender Policy Framework
    (SPF) identifies to the world the hosts that are specifically allowed to send
    e-mail from your domain, those not allowed, and others about which nothing can
    be said. Your CiviCRM server and domain''s outbound mail server (if different),
    should both be identified in the SPF as "allowed to send (pass)". The more specific
    and limited your SPF record is, the more effective it will be in contributing
    toward reducing CiviMail deliverability issues. Unfortunately, users who travel
    with laptops through various IPs while sending e-mails may make it difficult to
    lock down the sender policy framework tightly.


    A second useful approach to improving your server''s reputation is to set up a
    reverse DNS. In the Sending Email section, you should have configured and successfully
    tested your outbound e-mail settings. In order to determine if everything is really
    working correctly, use CiviCRM to send an e-mail to an account you can access
    that is not on your server, for example a Gmail or a Hotmail account. Then, examine
    the e-mail header for a couple of things. In Gmail and Google Apps, you can do
    this by:


    +   1. Opening the message.

    +   2. Clicking on the other actions dropdown beside Reply or Reply to all.

    +   3. Selecting Show original.


    Look for a Received-SPF header record. It should indicate either neutral or pass.
    You may also find other records such as Authentication-Results: spf=neutral.


    If you are having trouble with SPF, the issue can sometimes be traced to the identity
    that is provided by or about your server when it sends e-mails. Check through
    the Received: From header records until you get to your originating server, and
    perhaps beyond it, to your domain on a localhost. Raise any issues or questions
    you have with the tech support at your ISP.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Reverse DNS is the process of translating IP addresses to hostnames, the opposite
    of the forward DNS process, which takes the commonly used domain name and translates
    it to an IP address. Setting up a reverse DNS record (if not done so already)
    can help improve your e-mail reputation as the sending IP is validated as a legitimate
    sender for your domain. If your server has multiple domains sharing a single IP,
    it may be worthwhile to spend the small amount of money necessary to purchase
    a dedicated IP (useful for SSL certificates for CiviContribute, as well) so that
    you can set up the reverse DNS for your domain. A shared IP environment may result
    in your domain being scored poorly if it resides in the same bank of IPs as spammers
    or other accounts that are not as careful with their e-mail reputation management.


    The third approach to improving your server''s reputation is to monitor DNS blacklists
    and to request organizations that maintain these lists to remove your server from
    the list, if it is present. You may find yourself listed for a variety of reasons,
    legitimate or not, including: you haven''t been processing bounces properly, recipients
    of your e-mail may make mistakes in their complaints, or other sites have affected
    your reputation. It is important to respond to blacklisting promptly as it typically
    propagates from one service to another.


    # Configuring the e-mail processor


    To process the inbound e-mails, you must have an e-mail account to receive the
    inbound e-mails and configure a cron job to periodically process the e-mails received
    (addressed later in this chapter).


    Although not required, you will typically want the e-mail account used for bounce
    processing to be dedicated for this purpose. You also would not typically want
    it to be a publicized account that constituents would send e-mails to. It should
    be created and configured solely for the purpose of bounce mail handling.


    CiviMail uses Variable Envelop Return Path (VERP) processing as the method for
    tracking bounces. The method adds a unique sender address to every outbound message.
    When a bounce is returned, this unique sender address is used to determine which
    message, e-mail address, and contact record generated the bounce. Bounces are
    classified by type (whenever possible) and processed based on the rules configured
    in the system. Different bounce types will trigger a temporary or permanent hold
    placed on the e-mail, or record the delivery attempt for future processing, should
    there be additional bounces on the address.


    The preferred setup for VERP is called sub-addressing, which uses a local part
    format. If your invisible bounce processing e-mail address is `civimail@example.org`,
    then the VERP address appends a unique value after the separator but before the
    domain, such as `civimail+12.234ka.241123@example.org`. While this is the preferred
    method, some ISPs deliberately prevent sub-addressing on their servers because
    of its prevalent use in broadcast mailing.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'In order to test if you can use this approach, try sending an e-mail to the
    account you have set up, appending +test or -test to the account before the @
    symbol (myemail+test@mydomain.org). If you receive the message successfully, then
    you''ve confirmed support for local part handling and are ready to set up the
    account for inbound message processing.


    If sub-addressing/local part handling is not supported or you prefer not to use
    that method, you may still be able to process bounced e-mails using a catch-all
    e-mail account. A catch-all account is configured to receive all the e-mails not
    addressed to the other mail accounts set up on your domain—it "catches" any e-mails
    not "caught" by the other mail accounts. In general, catch-all accounts are less
    desirable as they will typically "catch" quite a bit of spam e-mails, which may
    be processed along with legitimate bounces. To determine if your hosting environment
    supports a catch-all account, log in to the system that administers your e-mail
    accounts and look for the option to designate an e-mail as the catch-all, or contact
    the hosting support to determine system capabilities. If your system supports
    catch-all addresses but not sub-addressing, you''ll have a slightly higher load
    on your server, but the system should function fine.


    Many CiviCRM installations run on virtual private servers. In most cases, the
    administrators of VPSs have the authority to configure their e-mail systems to
    their own needs and preferences. If you don''t have the technical skills yourself,
    it''s worth putting in a support request to have things set up the way you want.


    The final way to support VERP if your e-mail system can''t support either sub-addressing
    or catch-all addressing is to use a third-party account such as Gmail. The processing
    time and resource load to support processing remote e-mail stores is higher, and
    there may be a slight hit to your reputation if the sender domain is different
    from the FROM e-mail domain; but this is still a viable and effective solution.
    Note that depending on the system used, you may need to configure filters so that
    bounced e-mails are not flagged and filed as spam. For example, Gmail accounts
    should have a filter created that redirects anything flagged as spam back into
    the inbox so it can be processed by CiviCRM.


    Configure CiviMail with the bounce processing account you have set up as follows:


    +   1. Click on **Administer | CiviMail | Mail Accounts**.

    +   2. Click on the **Edit** link on the default account row.

    +   3. Alter the **Name** as desired and leave **Return-Path** empty.

    +   4. Enter the **Server**, **Username**, **Password**, and **Email Domain**
    for the account.

    +      - You should be able to configure a web or a desktop e-mail client to retrieve
    the mail with these settings.'
  merge: -1
  img_proc: true
- pgno: 113
  md: "+   5. If the account supports sub-addressing, enter the e-mail address \"\
    name+\" in the \"Localpart\" field (include the plus sign, such as \"civimail+\"\
    ).\n+   \n+   6. If possible, configure the system to use IMAP in the **Protocol**\
    \ field (preferred over POP3 or other options).\n+      - Again, use your e-mail\
    \ client to test whether the account is working properly before expecting CiviMail\
    \ to talk to it.\n+   \n+   7. If possible, set up SSL to improve the security.\
    \ A locally issued certificate should be fine.\n\nOnce the account is configured,\
    \ manually check if the mail processor script is working by entering the following\
    \ URL in your browser address bar, where the values in ?name=<username>&pass=<password>&key=<sitekey>\
    \ are the ones explained in the Setting up Cron Jobs section below. For example:\n\
    \n+   - Drupal: `http://example.org/sites/all/modules/civicrm/bin/EmailProcessor.php?name=<username>&pass=<password>&key=<sitekey>`\n\
    +   - Joomla!: `http://example.org/administrator/components/com_civicrm/civicrm/bin/EmailProcessor.php?name=<username>&pass=<password>&key=<sitekey>`\n\
    \nYou should receive a message in the browser window stating that the account\
    \ was successfully accessed and whether any e-mails were processed. Continue testing\
    \ by creating a contact record in CiviCRM with an intentionally incorrect e-mail\
    \ address. Add the e-mail to a mailing list group, send a test e-mail through\
    \ CiviMail, and then run the script again. This time, you should see a message\
    \ that one e-mail was processed and if you review the contact record, you should\
    \ see the e-mail placed on hold.\n\nAfter you have confirmed that bounce processing\
    \ is functioning properly, **don't forget to configure a cron job** as detailed\
    \ later in the chapter to automate the regular processing functions.\n\nNote that\
    \ the configuration guidance outlined above covers the standard setup options\
    \ for bounce processing. Other configuration options are available, such as return-path\
    \ headers and alternate protocol options, which may be used if your server setup\
    \ is non-standard. For more details on how these options may be used, review the\
    \ online documentation or search for guidance in the forums.\n\n# Online payment\
    \ processors\n\nIt's likely that one of the reasons you've decided to implement\
    \ CiviCRM is to benefit from the ability to process payments through your website,\
    \ and have it immediately recorded in your contact management system. Whether\
    \ you are collecting donations, campaign contributions, sponsorship commitments,\
    \ pledges, membership fees, or even registration fees, all of those transactions\
    \ will flow through CiviContribute."
  merge: -1
  img_proc: true
- pgno: 114
  md: 'However, before you can collect and process payments through CiviCRM, you must
    configure a payment processor. Your payment processor, also referred to as the
    payment gateway, is a service you purchase to allow credit card processing either
    directly through your site or through redirection to the processor''s site. The
    processor receives the credit card, authorizes the payment, and transfers the
    funds to your bank (either manually or automatically, depending on the service).


    Choosing what service(s) you will use can be challenging as there are many options
    available. You will want to make sure that whatever service you choose has a corresponding
    CiviCRM payment processor plugin available; otherwise, you may need to develop
    a new plugin to integrate with your selected service.


    At the time of writing this book, the following plugins were available:


    +   - Authorize.net AIM

    +   - Click and Pledge

    +   - DPS Payment Express

    +   - Elavon Payment Processor

    +   - eWAY (Single Currency)

    +   - FirstData (Linkpoint)

    +   - Google Checkout

    +   - Moneris

    +   - Payflow Pro

    +   - PayJunction

    +   - PayPal – Express

    +   - PayPal – Website Payments Pro

    +   - PayPal – Website Payments Standard

    +   - Realex Payment


    A few additional processors, including Chase Paymentech and Quickbooks, have been
    created or partially created, but for one reason or another, they are not fully
    integrated or packaged with the core software.


    Not all payment processors are created equal. Some are only available in limited
    regions or have limitations on what currencies can be used. The structure and
    model for what fees are charged will also differ significantly. If you are planning
    to use recurring contributions, be sure to investigate if the processor will allow
    such functionality and ensure that it has been built into the CiviCRM plugin.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '> For an updated list of supported processors with details about the functionality
    they provide, visit http://wiki.civicrm.org/confluence/display/CRMDOC/CiviContribute+Payment+Processor+Configuration.
    Note that not all processor plugins are officially supported by the CiviCRM project.
    Some have been contributed by the community and rely on community support for
    ongoing updates.


    # Integrated versus redirection processors


    There are two basic types of payment processors, namely those that allow you to
    collect and process credit cards directly from your site (integrated), and those
    that will direct you to the processor''s site to handle the transaction (redirection).
    There are pros and cons to both:


    +   - Those that allow credit card collection directly from your site provide
    a more attractive and branded solution. The user never leaves your site and the
    transaction process flows seamlessly from the collection form, to a confirmation
    page, and a final thank you/receipt page. However, the fees charged by the processing
    service are typically higher and you must have a dedicated IP with SSL installed
    in order to sufficiently secure the transaction.

    +   - Those that direct you to the processing site (such as PayPal Standard and
    Google Checkout) do not require SSL (as the security is handled by the processing
    site), and can typically be implemented very quickly and may charge lower total
    fees. However, the redirection to the processing site means that visitors must
    leave your website to complete the transaction. That may discourage or confuse
    people from finalizing the payment.


    > CiviCRM will not work with a shared SSL (commonly offered on many shared hosting
    environments). You must have the SSL installed on your domain in order for CiviCRM
    to work correctly. If you implement SSL on your site, be sure to visit: Administer
    | Configure | Global Settings | Resource URLs and enable the Force Secure URLs
    (SSL) option. This will redirect the contribution pages and the CiviCRM administration
    pages to SSL.


    If you are new to online payments and are unsure how much your constituents will
    respond to the new functionality, consider starting with the off-site solution
    where you are directed to the processor''s site to complete the transaction. At
    some point, you may reach a threshold where the additional cost for handling the
    transaction directly through your site is justified.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'SSL certificates are domain-form-specific. A certificate purchased for www.yoursite.com
    will not validate for yoursite.com, as the root form of your domain and the www
    form are not considered the same.

    In addition, CiviCRM references some resources through the site URL, and may not
    function consistently if the root and www form are used interchangeably. The easiest
    way to address this is by adding Apache directives to an .htaccess file in your
    public website directory. For example, if you wish to redirect from the root form
    to the www form, add the following (with your domain name):


    ```

    RewriteEngine On

    # Redirect root domain to www. form

    RewriteCond %{HTTP_HOST} ^yoursite\.com$ [NC]

    RewriteRule ^(.*)$ http://www.yoursite.com/$1 [R=301,L]

    ```


    Then, make sure all references to resources in your CiviCRM configuration use
    the www form of the domain. In addition to ensuring proper function of CiviCRM
    and your SSL certificate, this will help create consistent domain branding of
    your website.


    # Configuring the payment processor


    Once you''ve decided what payment processor to use and have gone through the necessary
    application process with the company you are using, you may set up the account
    in CiviCRM. From the configuration checklist, select Payment Processors.


    The fields you must complete will depend on which processor you use. In almost
    all cases, CiviCRM will let you configure the credentials for your live processor
    and a sandbox (test) account. The sandbox credentials will be used when you use
    the test drive option in contribution pages. See your payment processor for details
    about creating a sandbox account.


    If you do not yet have a payment processor account but would like to begin setting
    up and testing contribution pages or other payment handling forms, use the Dummy
    Payment Processor option. You may then configure your forms and enable contribution
    handling (including events and membership forms). No transaction is triggered
    when a dummy processor is used — it should only be created for temporary testing
    purposes.


    CiviCRM supports configuration of multiple processors. At the time you create
    a contribution page or event registration page you will be asked to select your
    desired processor to be used by this form.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'After configuring your payment processor, be sure to test it by generating
    a live contribution record. Don''t rely on the sandbox/testing tools alone; always
    run a live transaction with a real credit card to test the system before exposing
    live donation/pledge/event/membership forms that will process payments to the
    public.


    # System workflow templates


    After completing the setup of your payment processor, return to the configuration
    checklist and visit the **System Workflow Templates** page. As people visit the
    CiviCRM forms on your site and you, as an administrator, work with contact records,
    there are various e-mails generated by the system and sent to your contacts. Each
    of these e-mails can be customized through this page.


    If you edit any of these e-mails and save the changes, you will have the option
    of viewing or reverting to the original version.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_117_0.png)


    The templates contain tokens that are placeholders for contact and record-specific
    field values. For example, if you want the e-mail to be addressed to "Dear First
    Name," you would insert the **First Name** token. When editing the template text,
    you may use the **Insert Tokens** button to insert basic contact fields.


    Take care when editing templates. Most of these contain a number of conditional
    clauses (`if/else` statements) in order to ensure that the resulting e-mail is
    customized to the specific transaction. After making edits, make sure you test
    it with various options to confirm that it is functioning properly.


    > CiviCRM uses the Smarty template engine (http://www.smarty.net) to render pages,
    including workflow e-mails. You may insert basic logic and make use of other Smarty
    functions when creating your e-mail template.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Organization, customization, and components


    At this point you''ve completed the most essential steps in your initial site
    configuration. The Configuration Checklist includes additional sections that we
    will briefly review here and cover in more detail later while walking through
    the full implementation of their respective functions. These additional sections
    are Organize your contacts, Customize Data, Forms and Screens, and Components.


    # Organize your contacts


    As you begin importing and entering contacts, you will begin looking for ways
    to organize and categorize them. There are many ways to do this in CiviCRM, but
    the two primary methods are with tags and groups. Tags are a hierarchal categorization
    tree you create in order to classify contacts, or a running list of freeform text
    (tagset). Groups are collections of records that may be dynamically created (Smart
    Groups, the equivalent of a saved search) or manually collected (for example,
    an opt-in mailing list). We discuss configuration and implementation of these
    in Chapter 4, CiviCRM Basics: Moving through the System and Working with Contacts.


    # Customize Data, Forms and Screens


    CiviCRM''s core data fields cover all the basic contact and communication fields
    you would expect. Inevitably, you will have additional pieces of data specific
    to your organization that you want to record in the database. CiviCRM''s Custom
    Data tool allows you to attach additional fields to almost any existing type of
    record. For example, you can add fields to a contact record, contribution record,
    event registration, relationship type, and so on. We will look at creating custom
    fields in Chapter 5, Collecting, Organizing, and Importing Data.


    In many, but not in every case, the data fields you''ve created will be included
    in online forms and exposed to your site visitors. We use Profiles to select core
    and custom fields for inclusion in specific forms. We will begin to look at constructing
    and using profiles in Chapter 6, Communicating Better.


    # Components


    As noted earlier in this chapter, CiviCRM components represent the major functional
    areas of the software. Your first configuration step was to enable/disable the
    components you plan to use. This last block in the Configuration Checklist lets
    you access settings and options specific to each component. As we explore each
    of these functionality areas throughout this book, we will examine the configuration
    options specific to each.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Option Lists


    Although we have completed a review of the configuration checklist, there are
    several additional settings we want to explore. You may choose to configure these
    areas now, or simply make note of them and return to modify them later in your
    implementation process as the need arises.


    As you work with CiviCRM, you''ll quickly find that there are numerous option
    lists providing selection choices for fields. These include location types, phone
    types, individual prefixes and suffixes, activity types, and many more. A full
    list of configurable options is found on the Administration Console, and a partial
    list of the most frequently modified options is available in Administer | Option
    Lists, as shown in the following screenshot:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_119_0.png)


    The available settings for each of the options will be specific to the option
    type. In most cases it will be self-explanatory; and most are documented with
    inline help text. If the option contains both a name and a label field, the name
    field is used for the unique option value, and the label field is what will display
    in the option list.


    # Synchronization with CMS users


    If your Joomla! or Drupal website has been in operation for some time, you likely
    have an existing list of website user accounts. These user accounts will not immediately
    have corresponding CiviCRM contact records unless the user has logged into the
    site and visited a CiviCRM page. As part of your initial system configuration,
    it is best to synchronize those CMS users with CiviCRM. Access this option by
    visiting Administer | Manage | Synchronize Users to Contacts.


    Triggering this tool will create a linked contact record for each CMS user in
    your website. It should only be necessary to initiate this synchronization once.
    Thereafter, new CMS users will be linked to CiviCRM as they are created or visit
    a CiviCRM resource.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '> There are various ways this will occur depending on whether you are using
    Joomla! or Drupal, and based on what account creation tools you have implemented.
    We will review some of the available options later in this book.


    Let''s take a moment and understand exactly how CiviCRM contacts relate to CMS
    users.


    Your website (CMS) users are individuals having the permission to log in to the
    site using a username and password. CiviCRM contacts are records residing in your
    constituent database. CiviCRM creates a link between the CMS user and its corresponding
    CiviCRM contact record. When the user logs in to your site, you can then expose
    the data fields specific to that contact. For example, you could enable your logged
    in contacts to edit their address and phone details.


    While every CMS user should have a corresponding CiviCRM contact record, the reverse
    is generally not true. You will typically maintain the contact records for individuals
    (and certainly organizations and households) that do not have a corresponding
    user account.


    As you configure and plan your site, begin thinking through who exactly should
    have access to the site; what data fields might you expose to your website users
    for editing and updating, and what workflow you prefer for creating and granting
    permissions to new users.


    # Drupal access control for CiviCRM


    Drupal has an effective fine-grained permissioning system built in to its core
    that can be extended in numerous ways through specific modules. CiviCRM extends
    the Drupal access control system to allow control over specific functions within
    CiviCRM. We will assume a basic understanding of the Drupal access control system
    throughout this section (visit `http://drupal.org/node/22275`).


    > CiviCRM does not currently support access control permissioning with Joomla!
    v1.5, primarily due to the access group/ level limitations of the CMS. With the
    release of Joomla! v1.6, which includes a robust permissioning system, the CiviCRM
    v4.0 release will include full access control integration. The list of Drupal
    permissions found below will be identical to those available in the Joomla 1.6
    compatible release.


    Access is provided to users based on their roles and can be added or removed as
    a person takes on, or gives up responsibilities for accessing and administering
    functionality and content in CiviCRM.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Drupal sites always have two built-in roles: anonymous user (anyone who is
    not signed in, including those who do not have user accounts), and authenticated
    user (anyone who is currently signed in). Additional roles are typically created
    for system administrators and for groups of people who need to be allowed to do
    some things that others are not permitted to do, for example, moderating comments
    or other user-generated content.


    We don''t recommend creating an overly complex set of roles for CiviCRM. Ideally,
    you will set up permissions so that people are always allowed to do what they
    need to do, and aren''t allowed to do things that are dangerous to the system,
    its data, or the organization''s reputation for preserving the privacy of the
    personal data it holds. Often you can get by with a single role called CiviCRM
    administrator, and perhaps another one allowing users to view and edit financial
    information.


    Here are the permissions that can be selectively enabled or disabled by role in
    Drupal at Administer | User management | Permissions:


    +   - access CiviCRM

    +   - access CiviContribute

    +   - access CiviEvent

    +   - access CiviMail

    +   - access CiviMail subscribe/unsubscribe pages

    +   - access CiviMember

    +   - access CiviPledge

    +   - access CiviReport

    +   - access Contact Dashboard

    +   - access Report Criteria

    +   - access all custom data

    +   - access deleted contacts

    +   - access uploaded files

    +   - add contacts

    +   - administer CiviCRM

    +   - administer Reports

    +   - administer Tagsets

    +   - administer dedupe rules

    +   - administer reserved tags

    +   - delete activities'
  merge: -1
  img_proc: true
- pgno: 122
  md: '+   - delete contacts

    +   - delete in CiviContribute

    +   - delete in CiviEvent

    +   - delete in CiviMail

    +   - delete in CiviMember

    +   - delete in CiviPledge

    +   - edit all contacts

    +   - edit all events

    +   - edit contributions

    +   - edit event participants

    +   - edit groups

    +   - edit memberships

    +   - edit pledges

    +   - import contacts

    +   - make online contributions

    +   - merge duplicate contacts

    +   - profile create

    +   - profile edit

    +   - profile listings

    +   - profile listings and forms

    +   - profile view

    +   - register for events

    +   - translate CiviCRM

    +   - view all activities

    +   - view all contacts

    +   - view event info

    +   - view event participants


    As you can see, these permissions fall into different sorts of groups:


    +   - Accessing components of CiviCRM (for example, accessing CiviMember)

    +   - Performing certain operations on certain types of objects (for example,
    adding contacts)

    +   - Accessing administrative interfaces (for example, administering dedupe rules)'
  merge: -1
  img_proc: true
- pgno: 123
  md: '+   - Accessing non-administrative functions (for example, making online contributions
    and registering for events)


    Drupal permissioning is cumulative — if a user is assigned three roles, the combined
    permissions from all three roles will determine what the user can do in the system.
    Because permissioning explicitly allows the specified access, if any of the three
    roles have been granted permission it will impact the users''s access.


    Three Drupal modules are included in CiviCRM that allow information about contacts
    in CiviCRM to be used in ways that interact usefully with the Drupal access control
    system.


    # CiviGroup Roles Sync


    This module allows all the users in a particular Drupal role to be placed in a
    CiviCRM group, and vice versa. This allows CiviCRM to put contacts into groups
    and have that result in additional access privileges in Drupal. Signups on CiviCRM
    profile forms can be automatically added to groups, which could then be used to
    enable access to parts of your website. Smart groups can also be created for all
    donors, or other criteria like geography, to provide differential access to parts
    of your site.


    In order to enable CiviGroup Roles Sync, follow these steps:


    +   1. In Drupal, click on **Administer | Site building | Modules**.

    +   2. Click to enable the **CiviGroup Roles Sync** module in the **CiviCRM modules**
    fieldset.

    +   3. Click on the **Save Configuration** button.


    In order to configure CiviGroup Roles Sync, follow these steps:


    +   1. Create one or more non-default Drupal roles as follows:

    +      - In Drupal, click on **Administer | User management | Roles**.

    +      - Enter a name for the new role, and then click on the **Add role** button.

    +      - Assign one or more users to the new role, for example:

    +      - In Drupal, click on **User management | Users**.

    +      - Click on **edit** beside a username.

    +      - Under **Roles**, enable the checkbox beside the new role.

    +      - Click on **Save**.

    +   2. Create one or more CiviCRM roles as follows:

    +      - In CiviCRM, click on **Administer | Manage | Access Control**.

    +      - Click on **Manage ACL Roles**.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '+   - Click on **Add ACL Role**.

    +   - Enter a name for the role in the **Label** field. You can also optionally
    enter a **Description**, increase or lower the **Weight** of the role to make
    it appear lower or higher on lists with respect to other roles, or uncheck the
    **Enabled?** field to disable the role.

    +   - Click on **Save**.


    3. Create a group of users to assign to CiviCRM roles if necessary under **Contacts
    | Manage Groups**.


    > Access Control must be enabled as the Group Type in the Settings for the group.


    4. Assign users in an access control group to each CiviCRM role:


    +   - Click on **Administer | Manage | Access Control**.

    +   - Click on **Assign Users** to assign users to CiviCRM ACL Roles.

    +   - Click on **Add Role Assignment**.

    +   - Select an ACL Role and a group of users in **Assigned To**.

    +   - Optionally uncheck **Enabled?** in order to disable the assignment.

    +   - Click on **Save**.


    5. In Drupal, click on **Administer | Site configuration | CiviGroup Roles Sync**.

    6. Click on **Add Association** Rule.

    7. Select a CiviCRM group and a Drupal role from the selection lists.

    8. Click on the **Add association** rule.


    # CiviMember Roles Sync


    This module provides two-way synchronization between specific membership types
    with specific membership status and Drupal roles. For example, this allows you
    to provide all the current members with access to a site, and have that automatically
    removed if they don''t pay their membership renewal fee.


    In order to enable the CiviMember Roles Sync module, follow these steps:


    +   1. In Drupal, click **Administer | Site building | Modules**.

    +   2. Click to enable **CiviMember Roles Sync** module in the **CiviCRM** modules
    fieldset.

    +   3. Click on the **Save Configuration** button.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'In order to configure CiviMember Roles Sync, follow these steps:


    +   1. Create one or more non-default Drupal roles as follows:

    +      - In Drupal, click **Administer | User management | Roles**.

    +      - Enter a **Name** for a new role, and then click on the **Add role** button.

    +      - Assign one or more users to the new role, for example:

    +      - In Drupal, click on **User management | Users**.

    +      - Click **edit** beside a **Username**.

    +      - Under **Roles**, enable the checkbox beside the new role.

    +      - Click on **Save**.

    +   2. Create and configure CiviCRM membership types and statuses at **Administer
    | CiviMember | Membership Types** and **Administer | CiviMember | Membership Status
    Rules** (see *Chapter 8, Growing Your Membership and Interacting with Members*
    for more details).

    +   3. In Drupal, click on **Administer | Site Configuration | CiviMember Roles
    Sync**.

    +   4. Click on the **Add Association Rule** tab.

    +   5. Select a CiviMember membership type and select a Drupal role in order to
    implement that every contact with a current status for that membership type has
    that Drupal role assigned to it.

    +   6. Click to enable the appropriate statuses for both **Current Status** and
    **Expired Status**. If you are using the default CiviCRM membership status rules,
    you''ll probably want to enable **New**, **Current**, and **Grace** for **Current
    Status**, and **Expired**, **Pending**, **Cancelled**, and **Deceased** for **Expired
    Status**. When the membership type for a contact is changed, these lists will
    be checked to determine if the selected Drupal role should be assigned to or unassigned
    from the contact''s Drupal account.

    +   7. Click on **Add association rule**.


    # CiviCRM OG Sync


    This module can ensure that changes in the contacts in CiviCRM groups are reflected
    in associated Drupal organic groups. However, as the organic groups module does
    not provide an appropriate way to notify CiviCRM of changes in membership of organic
    groups, we find this module to be of limited usefulness.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# CiviCRM access control under Drupal


    In addition to the permissions that CiviCRM exposes to the Drupal access control
    permissioning system we saw above, CiviCRM has its own access control capabilities
    that provide finer-grained control. In general, you can control more types of
    operations through CiviCRM''s interface. Also, you can specify subsets of data
    to receive permissions; for example, you can restrict editing fields on a group
    contact by a group of users.


    > The limitations of Joomla! 1.5 preclude CiviCRM from providing its own access
    control when installed under Joomla! CiviCRM v4.0, with support for Joomla 1.6,
    will provide these capabilities.


    To simplify configuring your access control system in both Drupal and CiviCRM,
    you may want to consider using the CiviGroup Roles Sync module. The same users
    can then be in the same CiviCRM roles, as in the Drupal roles used for Drupal
    access control. Giving the same names to CiviCRM and Drupal roles is a very good
    practice when you are adopting this approach.


    A Drupal permission that can be assigned to a role tends to combine two concepts
    — an operation and a set of data. For example, "access comments" includes the
    operation of "access" and "comments" as the data to be operated on. Permissions
    in CiviCRM access control formalize and split these notions apart. As a result,
    they include three elements as follows, instead of Drupal''s two:


    +   - CiviCRM role

    +   - Operations (View, Edit, Create, Delete, Search, All)

    +   - Data


    Though this makes it a bit more cumbersome to specify permissions, it provides
    a very flexible structure for controlling access.


    In the discussion on CiviGroup Roles Sync and CiviMember Roles Sync in the preceding
    section, we reviewed how to create CiviCRM access control roles (at Administer
    | Manage | Access Control, Manage Roles) and how to assign users to those roles
    (at Administer | Manage | Access Control, Assign Users to CiviCRM ACL Roles).
    Now it is time to put it all together and create the CiviCRM access control lists:


    +   1. Click on Administer | Manage | Access Control.

    +   2. Click on Manage ACLs.

    +   3. Click on Add ACL.'
  merge: -1
  img_proc: true
- pgno: 127
