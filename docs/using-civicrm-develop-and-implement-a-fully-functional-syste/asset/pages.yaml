    You plan to develop appropriate metrics as your next step in developing FPAGM''s
    CRM plan.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_64_0.png)


    # Creating a project plan


    Create a preliminary project plan as follows:


    +   1. Determine the project scope.

    +   2. Estimate a timeline for software release(s), major stakeholder communication,
    training, and other project milestones.

    +   3. Estimate the monetary, human, and technical resources required, providing
    the basis for a preliminary budget of the total cost of ownership for all phases
    of the project, including both the implementation and ongoing annual costs.'
