- pgno: 256
  md: 'To create a simple newsletter subscription profile in CiviCRM and display it
    on pages or in blocks in either a Drupal or Joomla! site, follow these steps:


    +   1. Create publicly visible **Groups** as per the recipe in the prevision subsection.

    +   2. Click on **Administer | Customize | CiviCRM Profile**.

    +   3. Click on **Add Profile**.

    +   4. Enter an appropriate **Profile Name**.

    +   5. Leave **Profile** checked in **Used For**.

    +   6. Enter help text if desired.

    +   7. Click to open the **Advanced Settings**.


