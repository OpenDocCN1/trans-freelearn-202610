- pgno: 404
  md: 'Consider the following diagram to better understand how the reference-related
    fields are defined. In this case, our Follow up activity is defined to start at
    an offset of five days after the Open Case activity. In our configuration file,
    we reference the newest instance of the Open Case activity. As Open Case is present
    only once, either newest or oldest would yield the same result.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_404_0.png)


    FPAGM is uncertain whether their Grant Application process will warrant a fully
    defined timeline. As a result of the involvement of outside organizations in the
    process, they will not be able to reliably set firm deadlines for each step. However,
    they do want to make sure that staff stays on top of the application process,
    particularly in the early stages when the grant opportunity is identified and
    a case record is opened. Consequently, they create a standard timeline with a
    single Follow up activity scheduled for five days from when the case is opened.
    This will help ensure that some action is taken on the application within a relatively
    short period of time. The <ActivitySets> block from their XML file is shown in
    the following screenshot.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_404_1.png)


    At this point, you should have a good sense of the concepts involved in the timeline
    construction and understand the basic idea of defining multiple steps that are
    separated by a certain number of days. However, you may still be unclear as to
    how this will work out in the system.'
  merge: -1
  img_proc: true
- pgno: 405
  md: 'Later in this chapter, we will open and work with a case record. When inside
    a case, you will see a list of all activities associated with the case. If you''ve
    defined a case timeline, the list of activities will be pre-populated when you
    open a case with these scheduled activities using due dates defined by your offset
    values. What does that achieve? It creates your case task list--the list of actions
    that must be taken by you and other staff to begin the process of investigating
    and resolving the case record.


    # Who are your key players?


    One of the other benefits of using a case is the ability to define case roles
    for the key players involved in resolving and managing your cases. A case role
    represents an individual *directly involved* in case resolution (usually your
    staff), whereas an individual activity record may have assignees; the case roles
    function goes further by defining the nature (role) of the person''s involvement
    in the case. By attaching them to the case itself (and not just individual activities),
    we provide another level of management control over the case process.


    Case roles are relationship types that your configuration file defines as applying
    to a specific case type. In order to implement them, you must first create the
    relationship types through: **Administer | Option Lists | Relationship Types**.
    Create the type as you would any other, but take note of the text used for **Relationship
    Label-B to A**, as that is the text that will be referenced in your configuration
    file.


    When creating your case role relationship types, ask the following questions:


    +   - Who will be involved in the case resolution process?

    +   - Are there clear lines of responsibility that can be defined?

    +   - How will I want to track and report on cases? For example, will I need to
    pull reports to determine which staff members are involved in what cases and in
    what capacity?

    +   - Do different roles translate to different levels (and amounts of time) of
    engagement, such that I can determine staff resource allocation based on their
    roles?


    > FPAGM determines that there are three clear roles with regard to case management
    — **Case Manager**, charged with overseeing the progress of the case and managing
    resources, **Case Coordinator**, who is the primary day-to-day person working
    on a specific case, and **Support Staff**, who will occasionally be assigned to
    a case based on their expertise and the nature of the case. They use the **Relationship
    Types** tool to construct these three case roles.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# Interacting with Constituents: Managing Cases


    Once you''ve created the relationship types, return to the configuration file
    to add them as case roles. They will reside inside the `<CaseRoles>` tag, and
    each will be defined in a `<RelationshipType>` tag. Within that tag, you define
    the following:


    +   - `<name>`: The name of the relationship type using the **Relationship Label-B
    to A** noted previously

    +   - `<creator>`: If set to a value of 1, the current logged in user who opens
    the case will be assigned this role

    +   - `<manager>`: If set to a value of 1, the role will be designated as the
    case manager


    The third option above, `<manager>`, may be a bit confusing. If I have a case
    role (relationship type) defined as **Case Manager**, what is the significance
    of flagging a role as **Manager** in the configuration file? CiviCase assumes
    there is always one person primarily responsible for overseeing every case, regardless
    of what relationship types have been defined or how they are labeled. You flag
    the appropriate relationship as the case manager in order to have it easily displayed
    in the case listings and other views.


    Your XML file will contain content similar to the following:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_406_0.png)


    At this point, you have finished configuring your case type XML configuration
    file. As displayed in the preceding screenshot, be sure to include the `</CaseType>`
    closing tag.'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# What outside relationships are involved?


    Along with case roles (people directly involved in case resolution), you will
    generally have additional contacts that are *indirectly* involved in the case
    process. These may be outside agencies, government bodies, consultants, or other
    organizations that assist you and are a general resource for your organization.
    We call them **Case Resources** and collect them as a directory of contacts available
    to the case.


    To set them up in the system, first copy the `Settings.xml` file that was included
    in the `configuration.sample` directory to your configuration directory, open
    it, and locate the line containing `<group name="Case_Resources" />`. The name
    corresponds to a group you must create in your system that will contain the directory
    of resources. Use **Contacts | New Group** to create your `Case_Resources` group.
    You may, of course, name it differently. If you do, be sure to alter the `Settings.xml`
    file appropriately, replacing any spaces in the label with underscores as in the
    preceding example.


    Any contacts you add to this group will appear in the case management page for
    easy reference when people are working with the case.


    When we begin looking at a case record, we will also see that any existing relationship
    the contact has (employer, spouse, household, and so on) will be listed within
    the case relationships panel. This is all for the purpose of putting the most
    pertinent and useful information at your fingertips while you are working on the
    case.


    # Additional options and testing


    At this point, your case types have been configured, you have created any activity
    and relationship type that will be part of the case process, and you''ve created
    a **Case Resources** group and populated it as desired. Before testing your configuration,
    let''s take one more look at the `Settings.xml` file.


    While working with this file to configure the **Case Resources** group, you may
    have noticed there are several other settings listed in this file. Let''s review
    them:


    +   - `<RedactActivityEmail>`: If set to **1**, the **send copy of activity via
    email** feature within the case activities will be redacted. In other words, your
    redaction rules will be run against the activity before it is sent.


    +   - `<AllowMultipleCaseClients>`: By default, each case is associated with a
    single contact record. If you potentially need to associate multiple contacts
    with a single case, enable this option.'
  merge: -1
  img_proc: true
- pgno: 408
  md: '+   - `<ActivityTypes>`: If desired, you may list activity types you wish to
    make uneditable. As you can see from the default file that ships with CiviCRM,
    the Change Case Status and Change Case Start Date activities are marked as uneditable.
    Why would you want to do that? The primary reason is to provide an auditable record
    of the case. The case record represents an ongoing list of actions taken in an
    effort to resolve the case. If that status changes at any time, it should be recorded
    as a point in time (an activity record). If the status changes five times over
    the life of the case, we would expect five time-stamped activities so that the
    history of what had transpired is retained. Consequently, those activity types
    should generally not be editable lest the history be manipulated or lost.


    Once you''ve reviewed and made any changes to the Settings.xml file, it''s time
    to test your case types and confirm that they are configured correctly.


    Enter a contact record, navigate to the Cases tab, and create a new case. Alternatively,
    you could use the contact Actions button or Create New button to create a new
    case.


    > You should create a new record for each case type you have defined in the system
    to make sure each one is configured correctly.


    You will know immediately if the configuration is correct. If there are any typos
    or misconfigured elements, CiviCRM will display an error message indicating that
    it was not able to create the case successfully. If the case is successfully opened,
    you should still review the list of available activities, case roles, and any
    activities auto-generated via a timeline to make sure it is constructed as expected.


    If you do receive an error, review the following troubleshooting tips and common
    problems:


    +   - Ensure that all activity types defined in your configuration files exist
    in your system.

    +   - Ensure that all relationship types defined as case roles in your configuration
    files exist in your system.

    +   - Check spellings carefully.

    +   - Make sure that your case configuration files are titled and labeled accurately.
    Remember that they must match the case type defined in the system with title case
    text and no spaces.

    +   - If you have renamed an activity or relationship after creating it, the configuration
    file may have difficulty recognizing the new name. Rather than renaming the types,
    it is safer to delete and recreate them to ensure that the name recorded in the
    database matches what is configured in the XML file.'
  merge: -1
  img_proc: true
- pgno: 409
  md: 'If you continue to have problems, focus on a single case type configuration
    file and remove sections to isolate the problem. For example, you don''t need
    the CaseRoles and ActivitySets sections in order to have a functioning case type.
    Try removing them, running the case, and then adding each back in and re-testing
    to isolate the issue.


    # Tracking, managing, and resolving cases


    Once fully tested, you''re ready to begin working with cases. This will involve
    creating case records, working within them toward resolution, and searching/ reporting
    on them.


    # Creating and managing case records


    When you first open a new case, CiviCRM collects general details including the
    type of case you are creating, the status, the subject, and various details that
    will be stored in the open case activity. Once you''ve created the case, you will
    enter the Manage Case screen, where you will spend most of your case-management
    time.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_409_0.png)'
  merge: -1
  img_proc: true
- pgno: 410
  md: '# Interacting with Constituents: Managing Cases


    The screen is roughly divided into five sections:


    +   - **Case Summary** and management tools

    +   - **Case Roles**

    +   - **Other Relationships**

    +   - **Case Tags** (not present in the preceding screenshot)

    +   - **Case Activities**


    The summary includes the case client, type, status, start date, and reference
    ID. From this section, you can create a new activity, add a timeline to the case,
    merge the case with another case record, assign it to another client, print a
    summary report, or run a QA Audit/Redaction report.


    Most of these tools are self-explanatory or have been described earlier. However,
    the QA Audit/Redaction report deserves further explanation. The dual-title indicates
    multiple purposes for the same tool. By "QA Audit", we refer to the ability to
    run a report in which we compare a defined target timeline against the recorded
    activities. This is useful if you have duration-defined workflows and want to
    see if the resolution process kept up with the target deadlines for various activities.


    The redaction aspect of this report means the case redaction rules are processed
    when generating the report. Since the redaction rules can be used to remove or
    obfuscate sensitive information where there are privacy concerns, this ensures
    the ability to create a "sanitized" report that can be disseminated beyond the
    primary case managers.


    As one might expect, the **Case Roles** panel displays a list of the roles you
    have defined in your case and allows you to assign people to those roles or create
    new role-relationships. Note that although the list is pre-populated with the
    roles defined in your configuration file, you may add additional roles if needed.
    For example, you are not limited to having a single person assigned to the **Case
    Coordinator** role.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_410_0.png)'
  merge: -1
  img_proc: true
- pgno: 411
  md: 'The **Other Relationships** panel contains two pieces of information: a list
    of any existing relationships attached to the record (such as employer, spouse,
    and so on), and the list of contacts found in the **Case Resources** group defined
    in your `Settings.xml` file. As mentioned earlier, these are included in the **Case
    Management** screen for the sake of convenience.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_411_0.png)


    A **Case Tags** panel and button for adding them to the record will appear once
    you have created a tag at **Contacts | New Tag** with **Used For** set to **Cases**,
    or constructed a tagset for use with cases. A popup then lets you select from
    a drop-down list or tagset field to attach one or more tags to the case, as shown
    in the following screenshot:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_411_1.png)


    The final panel, **Case Activities**, is where you are likely to spend most of
    your time. Since a case is primarily a collection of activities that may be ordered
    in a timeline, it makes sense that most of your work with cases will involve creating
    and editing activities.


    Anything and everything you do as you work to resolve the case should be tracked
    as an activity. Whether you are making phone calls, receiving e-mails, changing
    the status, or even just reviewing the case history, you will benefit from taking
    the time to track each activity in the system. If someone else becomes involved
    in the case resolution, they will have a history of all communication that transpired
    with regard to the case. This will allow them to quickly jump in and begin working
    toward resolution.'
  merge: -1
  img_proc: true
- pgno: 412
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 413
  md: 'These lists of cases can be expanded to display scheduled and completed activities.
    In addition, the **All Cases** and **My Cases** lists are available as special
    dashlet reports on the site **Dashboard**. If you are overseeing case management,
    it will be useful to have those dashlets configured for your dashboard so you
    can quickly gain a snapshot of case activities when you first enter the system.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_413_0.png)


    The **Find Cases** tool is very straightforward. You can search by client name,
    e-mail, case type, status, whether the logged-in user is involved in the case
    (**Search All Cases** or **Only My Cases**), and tags.


    Note the option to search for deleted cases. Similar to the trash function that
    stores deleted contact records, deleting a case does not permanently remove the
    record, but rather moves it to the trash. By opting to search for deleted cases,
    you may restore them should you determine they were mistakenly deleted.


    In addition to the single-case detail report that can be generated from within
    the **Manage Case** screen, CiviCRM includes three reports related to cases that
    can be accessed at **Reports | Create Reports from Templates**. The reports are:


    +   - **Case Summary Report**: Displays a summary of cases, listing the client,
    start/end date, status, duration, and other details.

    +   - **Case Time Spent Report**: Geared toward tracking activities associated
    with cases and summarizing the total amount of time (duration) spent on them.
    This report can also be used to report on non-case activities.

    +   - **Contact Demographics Report**: Displays demographics for constituents
    and includes access to custom contact fields.


    Using the dashboard, search, and report tools, you can easily maintain oversight
    of cases as they are worked on and gradually resolved.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# Summary


    In this chapter, we took a look at cases by first understanding what they are,
    reviewing potential use cases that may not be immediately obvious, and contrasting
    their benefits/drawbacks/purpose compared to standard activities. We then:


    +   - Defined the key terminology and concepts related to cases, namely case activities,
    timelines, case roles, and case resources

    +   - Walked through the construction of a case configuration XML file

    +   - Tested and began using the newly configured case type, reviewing potential
    troubleshooting steps if your configuration did not fully function

    +   - Reviewed the tools available for monitoring and managing cases through the
    dashboard, search, and reporting tools


    In the next chapter, we will turn attention toward CiviCRM''s grant management
    tools that can be used for organizations disseminating grants and those that need
    to track details for grantees.'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# 11

    Providing Support: Grant Management


    We''ve covered a lot of ground so far, and have now come to the last chapter dealing
    directly with constituent-record data tools. In this chapter, we will discuss
    grant management. If you are an organization that manages and disseminates grants,
    CiviCRM provides some basic tools to help you collect and track details related
    to the grant management process. If your organization is typically on the other
    side of the equation, that is, applying for grants, rather than disseminating
    them, then you may still find the CiviGrant tool useful for managing that process.
    Toward the end of this chapter we will offer some suggestions for reconfiguring
    the CiviGrant component in a few small ways so that you can use it to track the
    grants you are applying for.


    In this chapter, we will cover:


    +   - Defining the grant application process

    +   - Managing grantees

    +   - Tracking grant applications

    +   - Applying for grants


    Using these tools helps you integrate this process with your other constituent
    management activities, making your organization a more efficient and productive
    financial support provider and/or recipient.


    # Defining the grant application process


    CiviCRM''s grant management tools are admittedly basic. However, in the broader
    context of CiviCRM''s other constituent management tools, they provide a very
    useful set of functions.'
  merge: -1
  img_proc: true
- pgno: 416
  md: 'Before configuring the grant tools, let''s first understand the basic process
    assumed by CiviCRM as it relates to grant workflows. The following diagram helps
    visually communicate the workflow for organizations giving or receiving grants:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_416_0.png)


    The grant application process basically consists of receiving applications, processing
    them to determine if they are to be approved or denied (that is, granted or accepted),
    and then tracking the progress as funds are transferred and reports are received
    from the grantee.


    Grant records, like most other areas of CiviCRM, can have custom fields created
    and attached to them. In this way you can set up as many additional fields as
    desired to help in the grant-making or grant-seeking process. The ability to attach
    documents to records in CiviCRM is particularly useful when it comes to grant
    application documents. It is also useful for attaching scanned copies of official
    correspondence.


    Grants are categorized by type allowing you to search for and track the status
    of different grants organized by type. Before beginning the grant management process
    you should review the existing grant types configured by default and add/edit/delete
    as necessary. You can access them at Administer | CiviGrant | Grant Types.


    If the CiviGrant submenu is not visible, make sure you have the CiviGrant component
    enabled. Visit Administer | Configure | Global Settings | Enable CiviCRM Components.
    By default, the CiviGrant component is disabled. Enabling it will restore the
    CiviGrant submenu under Administer, and also the main Grants submenu (under Other).


    Once you''ve thought through the grant types, created any custom fields you want
    associated with grants, and reviewed the general grant workflow, you can begin
    managing your grant applications.'
  merge: -1
  img_proc: true
- pgno: 417
  md: '# Managing grantees


    As with most areas of CiviCRM, your grant management tools will be available through
    the main menu and a corresponding tab will be displayed on contact records. By
    default, the Grants menu is a submenu under Other. If you expect to be a heavy
    user of the grant tools, you may want to move it to the main menu. Visit Administer
    | Customize | Navigation Menu to edit the main horizontal menu.


    Let''s begin by visiting a contact and creating a new grant record.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_417_0.png)


    As you can see, the grant record follows the flowchart workflow pretty closely.
    You select the desired status, type, and complete the other fields as appropriate.'
  merge: -1
  img_proc: true
- pgno: 418
  md: '# Providing Support: Grant Management


    Grant records are a little different from other areas of CiviCRM in that you are
    likely to return to edit the record multiple times over the course of the grant
    process. As the grant moves through the application, approval, fund dissemination,
    and reporting stages, you will return and edit the record to update the dates
    and record notes or add attachments pertaining to the grant.


    As with other related record areas, contacts may have more than one grant record
    associated with them.


    > FPAGM received a significant donation from a local philanthropist to help food
    pantries develop new healthy eating programs. The programs will educate clients
    regarding healthy eating and provide guidance on simple recipes using ingredients
    rather than processed, prepared foods.

    > The donation will support five programs at food pantries in the area. FPAGM
    decides to use CiviCRM to track the grant application and management process.
    They begin by sending out an e-mail to Regular members through CiviCRM with application
    guidelines. As the applications are received, a new grant record is created.

    > The application requires food pantries to report details regarding their geographic
    demographics, and to describe how many people they plan to reach through this
    program. All of this data is tracked using custom fields, and the hard copy application
    is scanned and attached to the grant record. In this way, FPAGM ensures that all
    the details of the process are stored in a centralized location.


    The following screenshot shows the grant records as viewed through the contact''s
    Grants tab:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_418_0.png)'
  merge: -1
  img_proc: true
- pgno: 419
  md: '# # Tracking grant applications


    Let''s take a look at the tools available in the **Grant** submenu for tracking
    grant records. As you might expect, **Grants** follow a similar pattern as other
    areas by having a dashboard summary of grant statistics, a **Find Grants** tool,
    and a link to quickly create a new grant record.


    The dashboard summarizes the number of grants by status (with each cell hyperlinked
    to display a filtered list of records), and a list of recent grant records created.


    **Find Grants** provides access to each of the relevant data fields, including
    ranges for the grant amount and date fields, as shown in the following screenshot:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_419_0.png)


    The date range fields provide the additional option of searching by an empty value.
    For example, if you are looking for an updated list of applicants who have not
    yet received a funds disbursement, you can select a status of **Granted** and
    **Money Sent Date** of "not set", and run your search.


    Grant records may be exported to a CSV file after running your search.'
  merge: -1
  img_proc: true
- pgno: 420
  md: '# Other side of the coin: Applying for grants


    Although the CiviGrant component is primarily intended for the grant administration
    process, presuming that the organization implementing CiviCRM is the grantor disseminating
    funds, it''s worth noting that the grant tools can be adapted easily to manage
    your organization''s applications for grants from other entities.


    In this alternate case, the contact record you are working with is the grantor,
    rather than the grant applicant and potential grantee. You are using CiviGrant
    to track your application to the organization and subsequent communication transpiring
    over the course of the process.


    Since the workflow is essentially identical regardless of which direction you
    are coming from in the process, we simply need to alter terminology throughout
    the interface to better communicate your role as a grant applicant. There are
    two ways this can be accomplished — by modifying the CiviCRM template files, or
    using the word replacement tool. As a general rule, it is better to use the word
    replacement tool to the extent possible, as it is more dynamic and avoids having
    to maintain custom versions of template files. Use the tool to define existing
    text and replacement text; wherever the existing text is found in the system,
    it will be replaced. At times you may find text that is not easily isolated (for
    example it is too generic or used elsewhere in the system) and cannot be replaced
    universally. CiviCRM uses the Smarty Templating System to present content and
    provides the ability to define an override directory in which replacement template
    files are stored. Using template overrides you have full control over the text
    and layout of your pages. Refer to *Chapter 3, Customization, Community, and Cooperation*
    for more tips on customizing the interface in this way.


    +   - Using word replacements, we see several places in the interface that would
    benefit from being changed to better communicate this alternate grant application
    perspective. Visit **Administer | Option Lists | Word Replacements**, and then
    enter the following:'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# Word Replacements


    Use Word Replacements to change all occurrences of a word or phrase in CiviCRM
    screens (e.g. replace all occurrences of ''Contribution'' with ''Donation'').


    | Enabled | Original | Replacement | Exact Match? |

    | --- | --- | --- | --- |

    | ☑ | Application Received | Application Submitted | ☑ |

    | ☑ | Grant Report Received? | Grant Report Submitted? | ☑ |

    | ☑ | App. Received Date | App. Submitted Date | ☐ |

    | ☑ | Grant report received? | Grant report submitted? | ☑ |


    +   - After you have entered the changes, click on Save. Check if the interface
    has changed correctly by navigating to Other | Grants | New Grant and Other |
    Grants | Find Grants.


    If you regularly apply for grants to different organizations and find the tools
    available through the grant component to be too limiting, consider using CiviCRM''s
    Case Management tools by creating a case type to track communication with the
    grantor.


    As covered earlier in this book, case records consist of a collection of activity
    records grouped together around a common issue. Since a grant application is primarily
    a series of communications and reports passing between the grantor and grantee,
    a case may serve as a suitable alternative to the grant component.


    # Summary


    The opportunity to support other organizations through financial assistance is
    coupled with the responsibility to administer those funds and application details
    carefully. Your funders will expect that you will take as great care administering
    funds as your grantees do expending them. Using CiviCRM, you have effective tools
    to handle this process as a part of your overall constituent management program.


    In this chapter, we:


    +   - Reviewed the grant management workflow and discussed how it translates to
    the CiviCRM model.


    +   - Created new grant records and saw how each step in the process is tracked.


    +   - Searched for grants and noted the various field options unique to these
    records.'
  merge: -1
  img_proc: true
