- pgno: 292
  md: '# Configuring CiviPledge


    CiviPledge is a CiviCRM component that supports non-enforceable commitments for
    recurring payments. This is different from recurring contributions that are also
    supported by CiviCRM, but which actually create an authorization record with the
    payment processor to automatically transfer funds on a recurring basis. In contrast,
    pledges are promises to pay a fixed amount through multiple periodic payments.


    For example, your organization might encourage existing donors to increase their
    total annual contribution by committing to a monthly payment which you associate
    with a corresponding monthly need. A homeless shelter might create a campaign
    to "provide five meals a month" for the year. The total annual donation is $240,
    consisting of $20 monthly payments.


    When a pledge record is created, it consists of the total committed donations
    and the terms of payment, that is, number of payments and frequency (12 payments
    of $20). It is, however, only a promise to pay. CiviCRM provides useful tools
    for tracking payments, sending out reminders, and providing online payment forms.
    As the constituent fulfills their commitment through periodic contributions, you
    log the payment against the pledge record and track their progress. Once all payments
    are received, the pledge record can be closed.


    Before implementing pledge signups, you must enable the component (it is disabled
    by default). Click on Administer | Configure | Global Settings | Enable CiviCRM
    Components and move CiviPledge from the left column to the right.


    You may configure automated pledge reminder e-mails that will be sent to constituents
    prior to the due date for their next payment. Enabling this feature is done through
    the Contribution Page setup, where you also indicate the form that will be used
    for pledges. However, you must also configure a cron job to periodically check
    the status and due date of individual pledge records, and trigger the e-mail.
    See Chapter 3, Installation, Configuration, and Maintenance for a full discussion
    of configuring cron jobs.


    # Recording a contribution manually


    Now that we have configured CiviContribute and have a working knowledge of the
    key functionality options, we are in a position to look at recording a contribution
    record. Part of the reason for learning how to record a contribution manually
    at this point is that it will provide a better sense of the wealth of information
    that is stored about a donation. This will lay the groundwork for a better understanding
    of the automation that occurs when online contribution pages automatically record
    contributions.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'The simplest way to record offline contributions is to record them manually.
    The term "offline" may be a bit misleading or confusing; it is used to distinguish
    between payments received and processed directly online (for example, credit card
    payments) and payments received through other offline means. This includes donations
    of any sort that are not processed by an online payment processor. Examples include
    cash, in-kind goods, and services received at the office, checks received by mail,
    credit and debit card donations outside the website such as those received by
    a call centre that are processed through a point of sale (POS) device, or electronic
    fund transfers (ETFs) conducted at a bank branch.


    To record a contribution manually, click on **Contributions | New Contribution**
    from the main menu or the **Create New** button. From within the contact record
    you can click on **Actions | Add Contribution**, or click on the **Contributions**
    tab then click on **Record Contribution (check, Cash, EFT...)**. If an integrated
    payment processor is configured for your site, you will see the option to **Submit
    Credit Card Contribution**. That form is almost identical, except that it will
    include the required credit card related fields and will trigger an actual payment
    transaction.


    Fill in the fields as follows:


    +   1. If the method of adding the contribution has not resulted in a read-only
    name beside **Contributor**, then begin typing part of a name or e-mail in the
    **Select Contact** field. Select a contact from the resulting list that is automatically
    populated.

    +   2. If the contact that made the contribution cannot be found from the contact
    search, click on **Create new contact** and choose one of the contact type options.
    This will open a popup form where you enter basic information about the contact
    and save the record.

    +   3. Select the appropriate **Contribution Type**.

    +   4. Enter the **Total Amount** and currency type. If you have previously created
    a price set, you will be given the option of selecting it in order to choose from
    the available options.

    +   5. Optionally enter a **Source**. This is intended to help you trace where
    the donor/donation came from. If left blank, CiviCRM will populate it with a few
    relevant pieces of data, such as who entered the contribution.


    > The modal popup form that appears when you select a contact type is controlled
    by the reserved profile. You may modify the fields you wish to collect whenever
    this **Create New** contact option is selected throughout CiviCRM. After going
    to **Administer | Customize | CiviCRM Profile**, click **Fields** beside one of
    **New Household**, **New Individual**, or **New Organization**.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '+   6. Beside **Received**, enter a date and a **Time**. To remove the date
    received, click on the **Clear** link to the right of the **Time** field. If left
    blank, CiviCRM will populate the field with the current date.

    +   7. Select the appropriate value for **Paid By**, or leave blank for an in-kind
    donation.

    +   8. If **Paid By** is set to **Check**, enter the **Check Number**.

    +   9. In **Transaction ID**, enter a unique transaction identifier if one exists,
    such as a bank transfer number; otherwise leave blank.

    +   10. If an e-mail exists on file for the constituent, you will have the option
    of sending them a receipt by e-mail. If left unchecked, or if no e-mail is on
    file, you may enter a **Receipt** date and **Time**. These values are automatically
    filled if the receipt is sent by e-mail.

    +   11. Select the appropriate **Contribution Status**, such as **Pending** if
    a promised check has not been received.

    +   12. In **Soft Credit To**, enter part or all of a name or e-mail and select
    a contact from the resulting list. The concept of a soft credit is to recognize
    another constituent''s role in soliciting and obtaining this contribution. For
    example, if you know that John Doe decided to contribute to your organization
    through conversation with Jane Johnson, you could credit Jane using this field.
    If the contact is owed soft credit for the contribution and is not yet in the
    database, create the contact in a different tab and then return and conduct a
    search in this field.


    At this point, you''ve completed the most essential elements of the contribution
    record. If you have created any custom fields associated with contributions, they
    will appear below these opening fields and can be expanded by clicking on the
    title panel. Click **Additional Details** to open additional field options.


    +   1. Enter **Notes** about the donation, if any. For example, "**Contact him
    again in December to see if he wants to make another tax-deductible donation before
    year-end**".

    +   2. Enter the **Non-deductible Amount** of the donation. For example, if you
    are entering an auction payment of $500 for a bottle of wine with a fair market
    value of $350, the non-deductible amount in Canada is $350.

    +   3. Enter the **Fee Amount**, if any. For example, a $-1.25 bank charge to
    process an ETF.

    +   4. Enter the **Net Amount** as calculated from **Total Amount – Fee Amount**.

    +   5. Enter the **Invoice ID**, if any. This could be a generated invoice number
    from your accounting software.

    +   6. Enter the date and approximate **Time** for a **Thank-you Sent**.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'CiviCRM supports honoree/in memory of contributions. Click **Honoree Information**
    to open the fieldset. When a contribution is made in honor of or memory of another
    person, a contact record is created for the honoree and the contribution will
    display in their record (as in honor/memory of them).


    +   1. Click on either **In Honor of** or **In Memory of**. If one was incorrectly
    selected, click on **Clear** to erase it.

    +   2. Enter the **First Name, Last Name, Email** and **Prefix** of the honoree.


    If you have created premiums, you will have a **Premium Information** panel that
    may be opened:


    +   1. If appropriate, select a **Premium** requested by the donor.

    +   2. If there are options for the **Premium**, select the one preferred by the
    donor.

    +   3. If the premium has been shipped or delivered to the donor, enter the date
    it was **Fulfilled**.


    Once you''ve completed the form to your satisfaction, click on **Save** to store
    the contribution, **Save and New** to store it and immediately bring up the same
    form to enter another contribution, or **Cancel** to abandon the record without
    saving.


    # Importing contributions


    As with other areas of CiviCRM, you can import contribution data to the system
    directly through the interface. Access this tool through **Contributions | Import
    Contributions** from the main menu. We won''t take the time to walk through the
    process, as it closely follows the steps outlined in *Chapter 5, Collecting, Organizing,
    and Importing Data* where we imported contacts. However, there are a few nuances
    when importing contributions that you should understand:


    +   - The import mode allows two options—**insert** contributions or **update**
    contributions. These are mutually exclusive—if inserting, all records will be
    new; if updating, you must include a contribution ID column in your .csv file
    that matches existing records in the system. The update option will not simply
    create new records if no match is found.

    +   - If inserting new records, you should have sufficient contact data in your
    import file to ensure the contacts match and merge with existing contact records
    wherever possible.

    +   - Certain fields relevant to contributions are required, including contribution
    type and total amount.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'As with contact imports, we recommend importing a small subset of your data
    and reviewing carefully before importing very large sets. Field mappings may be
    saved and reused, facilitating this import, test, and full import process. Also
    be aware of server resource limitations that may restrict how many records you
    can successfully import in a single step. If your import file is very large, you
    may need to split it into smaller sections for importing.


    # Manually creating a pledge


    As reviewed earlier, a pledge in CiviCRM is a promise to make one or more payments
    in the future. A pledge is Pending until the first payment is received, at which
    point its status changes to In Progress. Once all payments have been received,
    its status changes to Completed. If one or more of the promised payments is late,
    no change occurs in the status of the pledge. In this way, think of a pledge as
    a container for multiple, promised, distinct contribution records.


    If a person promises $360 to be paid in 12 monthly installments, spaced one month
    apart, CiviCRM considers this to be one pledge with twelve payments (contributions)
    of $30.


    To manually create a pledge, click on CiviContribute | Pledges | New Pledge, or
    use Create New | Pledge. Alternatively, from a Contact Summary page, click on
    Actions | Add Pledge, or click on the Pledges tab and click on the Add Pledge
    button or link.


    +   1. If the method of adding the pledge has not resulted in a read-only name
    beside Select Contact, then begin typing part of a name or e-mail in that field.
    Select a contact from the resulting list that is automatically populated.

    +   2. If the contact making the pledge cannot be found from the contact search,
    click on Create new contact and choose one of the contact type options. This will
    open a popup form where you enter basic information about the contact and save
    the record.

    +   3. Enter a value representing the sum of all of the payments to be made in
    the Total Pledge Amount field.

    +   4. Enter the number of periods (pledge installments) and the length of each
    period (daily, weekly, monthly, or yearly) between payments, for example, every
    1 month, every 2 weeks. After entering the total pledge amount and installment
    period, CiviCRM will calculate how much is due for each installment.

    +   5. If desired, change Payments are due on the [] day of the period to a value
    other than 1, for example, to 15 if monthly payments will be made mid-month.'
  merge: -1
  img_proc: true
- pgno: 297
  md: "+   6. If the pledge was made before it is being recorded, backdate **Pledge\
    \ Made** appropriately.\n+   \n+   7. If the payments start on a day other than\
    \ the date the pledge is being recorded, adjust the **Payments Start** date.\n\
    +   \n+   8. If the contact has an e-mail on file, click on **Send Acknowledgement**\
    \ to e-mail them details of the pledge. If you choose to send an acknowledgement\
    \ by mail, use the **Acknowledgement Date** field to record when that was sent.\
    \ The date will be filled automatically if the e-mail option is used.\n+   \n\
    +   9. Click **- select -** beside **Self-service Payments Page** and click on\
    \ an appropriate contribution page if one is available. If selected, a link to\
    \ this contribution page will be included in the pledge reminder e-mails. The\
    \ user can then use the page to submit an online payment and have the contribution\
    \ attributed to the pledge. This is very valuable and important as it provides\
    \ a direct way for the end user to associate a payment with a pledge.\n\nAs with\
    \ contribution records, the donor may provide the pledge in honor or memory of\
    \ someone. As with contribution records, any custom fields associated with pledges\
    \ will appear in their own fieldset panel for completion at this time.\n\nClick\
    \ on the **Payment Reminders** header to expand the fieldset panel and configure\
    \ reminder e-mails. Recall that this functionality is dependent on the configuration\
    \ of a cron job that should run nightly and manages both the pledge status updates\
    \ and e-mail reminders.\n\n+   1. Configure when to send initial reminder: **Send\
    \ Initial Reminder [] Days prior to each scheduled payment due date.**\n+   \n\
    +   2. If you wish to send multiple reminders, set the **Send up to [] reminders\
    \ for each scheduled payment** to a value greater than one.\n+   \n+   3. Set\
    \ **Send additional reminders [] days after the last one sent** up to the maximum\
    \ number of reminders.\n\nPledge reminders are only sent if it is possible to\
    \ send to someone who has pledged a donation. If no e-mail is present for the\
    \ contact, the e-mail becomes invalid, or if they have been marked either by administrators\
    \ or themselves as **Do not e-mail**, then no reminders will be sent.\n\nOnce\
    \ you've reviewed and completed the record, click on **Save** or **Save and New**.\
    \ Click on **Cancel** to exit the record without saving."
  merge: -1
  img_proc: true
- pgno: 298
  md: 'After saving, take a moment to review how CiviCRM constructs and displays the
    pledge record. As mentioned, the pledge itself is a container for individual pledge
    payments. This is reflected in the contact''s **Pledges** tab by a single pledge
    row expanding to display the individual scheduled and completed pledge payments.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_298_0.png)


    As you receive contributions associated with pledges, it is important to log them
    through this interface and not the primary contributions tab (CiviCRM places a
    reminder on the **Contributions** tab to provide guidance). Since the essence
    of tracking the pledge progress and status involves reviewing actual payments
    received for pledged payment records, you need to ensure that the contribution
    is associated with the pledge appropriately.


    If the constituent is late providing payment, submits a payment that is different
    from what is scheduled, or requests altered terms for the payment (such as extending
    the payment period), use the **Edit Scheduled Payment** link to modify the record.


    # Searching, examining, and working with contributions


    So far we have focused our energy on understanding the key configuration options
    related to fundraising and working with single contact and pledge records within
    the contact record. In this section, we will work with contribution records in
    bulk and review "recipes" for implementing fundraising techniques through CiviCRM.
    While working through this section, we will also highlight noteworthy features
    or places where you may see unexpected results if they are not handled correctly.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Finding contributions


    While you will often be working with contributions directly through the contact
    record, it is likely that much of your time will also be spent searching for and
    reporting on contribution records in bulk. For example, you will periodically
    need to know how many contributions were received over a period of time, such
    as the last month or year to date. You may need to export all contributions of
    the type "Donations" in order to send end-of-the-year statements for tax purposes.
    Alternatively, you may want to isolate donors who have given amounts over a certain
    threshold and classify them as Major Donors, targeting them in unique ways through
    postal mailings and e-mails.


    As with other functionality areas in CiviCRM, you can conduct these searches using
    the component search at **Contributions | Find Contributions** or through the
    **Contributions** panel in **Advanced Search**. The field options are the same,
    but the results are quite different. Component searches will always return component
    records, whereas **Advanced Search** returns contact records by default. This
    means that if John Doe has three contributions matching my criteria, I will see
    three records in the CiviContribute component search (as distinct contribution
    records are returned) and only one in **Advanced Search** (representing the contact
    record). Further, actions, such as export and bulk update using profiles will
    reflect the source. In the **Find Contributions** tool, for example, you will
    be able to export contribution details.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_299_0.png)


    > In CiviCRM v3.3, the **Advanced Search** tool is extended to allow you to retrieve
    related records through this interface. Using the **Display Results As** drop-down,
    you can choose to retrieve contacts (default), activities, contributions, or event
    registration records. The benefit over using component searches is the ability
    to add criteria across multiple types of data, but retrieve the contact''s related
    records in a different area. For example, I could retrieve all contributions for
    individuals with an **Employee of** relationship who have been members since 2004.'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'The following screenshot demonstrates the options available in the Find Contributions
    tool:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_300_0.png)


    For the most part, these options are fairly intuitive and self-explanatory. We
    will review them briefly:


    +   - **Contributor Name or Email**: It can be just a partial match.

    +   - **Contribution Dates – From and To**: This will search the date on which
    the contribution was received (usually the date recorded).

    +   - **Contribution Amounts From and To**: Criteria treated as equal to or greater
    than in the From field, and less than or equal to in the To Field.

    +   - **Contribution Status**: Choose one or more of Completed, Pending, Cancelled,
    and Failed.

    +   - **Paid By, Check Number or Transaction ID**: If you specify a value for
    Check Number, make sure that the Paid By field is either left empty, or has Check
    selected; otherwise no results will be returned.

    +   - **Receipt Not Sent?**: This is convenient when generating a list of contributors
    to receive receipts.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '+   - **Thank-you date not set?**: If checked, contributions with **Thank-you
    date** set are not returned, providing results that need to be sent "thank-you''s".
    If unchecked, results are returned regardless of the value in **Thank-you date**.

    +   - **Find Pay Later Contributions?**: If checked, only "pay later" contributions
    are returned. If unchecked, results are returned regardless of the value in **Pay
    Later?**.

    +   - **Find Recurring Contributions?**: If checked, only recurring contributions
    are returned. If unchecked, results are returned regardless of whether the contribution
    is a recurring one or not.

    +   - **Find Test Contributions?**: If checked, any contributions generated through
    the contribution page test form will be returned. By default, all test records
    will be excluded from the search results. Selecting this option is the only way
    to locate those records.

    +   - **Contribution Type**: Provides a convenient way to search for payments
    for events, memberships, donations, or other contributions types that have been
    configured.

    +   - **Contribution Page**: Provides a convenient way to search for memberships
    in a particular organization (or subscription), or donations to appeals that used
    specialized contribution pages (campaigns).

    +   - **In Honor Of**: Provides a way to search for honorees by name.


    > Unlike most free text searches for contacts in CiviCRM, the **In Honor of**
    search field does *not* find contacts based on their part or complete name, or
    e-mail address by default. To get around this constraint, you can explicitly include
    wildcards (%) in what you are searching for. Wherever you put one, it will match
    any text. For example, %John% will match John Doe as well as well as Jane Johnson.


    +   - **Contribution Source**: Must be an exact match unless using wildcards.

    +   - **Personal Campaign Page**. Can be used to determine how well a campaigner
    is doing.

    +   - **Display In Roll?**: If **Yes** is selected, only contributions to personal
    campaign pages which had "Show my contribution" in the public honor roll checked
    are returned. If **No** is selected, only contributions to personal campaign pages
    which had **Show my contribution** in the public honor roll unchecked are returned.
    If neither **Yes** nor **No** is selected, then contributions are returned regardless
    of this setting, whether they were made through a personal campaign page or not.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '+   - **Currency Type:** If your CiviCRM implementation has more than one available
    currency (see **Administer | Configure | Global Settings | Localization, Available
    Currencies**), then users can select the currency in which they would like to
    contribute. Specifying a currency type here returns only contributions in that
    currency.

    +   - **Custom data fields for Contributions:** You can filter search results
    on custom data fields.


    # Examining contributions


    After conducting a search for contributions, you are given a list of results with
    key details. From this list, you can directly access the contact or contribution
    record.


    Each column in the search results – name, amount, type, source, received, thank-you
    sent, status, and premium – can be sorted in ascending or descending order. You
    also have the familiar View/Edit/Delete action links on the right of each row.


    Clicking on the contact name in any contribution row takes us to their summary
    record. We can see the number of contributions and pledges as well as other tabbed
    items. By clicking on the Contributions tab, we get a good capsule summary of
    their donation history that encompasses recency, frequency, and monetary amount
    in three lines. The first shows Total Amount, # Contributions, and Average Amount
    for Current Year-to-Date. The total for all the years is in the second one. Specific
    donations follow in reverse chronological order. Note that these totals only take
    into consideration completed contributions (pending, canceled, and so on are excluded).
    Once again, the columns can be sorted, facilitating quick access to donations
    in multiple ways.


    Before rushing off, it''s also worth pointing out that fundraisers can record
    the receipt of an offline payment or view, edit, or delete a contribution for
    this contact using links right on the page.


    # Taking action on contributions


    After conducting a search for contributions, you can select some or all of the
    records and take action on them in bulk. The options available are different from
    what we saw in the contact search action list, as they are tailored to the needs
    of contribution records.


    In this section, we will review those bulk actions, consider typical use cases
    for them, and walk-through how to make better use of the functionality available.


    First conduct a search, select some or all records, and select the actions drop-down
    to review your options. After selecting an action to take on the selected records,
    click on Go to initiate it. The following subsections explain the various actions.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Update Pending Contribution Status


    This tool is one way to update contributions from online "pay-later" contributions,
    or offline direct mail/telemarketing campaigns that have been received and entered
    manually by the administrative staff.


    "Pay-later" contributions are left in a Pending status until the contribution
    is received (such as a check mailed in after the form was submitted). At a certain
    point, they may also be deemed to be failed donations if there is no longer any
    hope of collecting payment. The Update Pending Contribution Status action presents
    a batch update form optimized for dealing with this situation. It allows the Fee
    Amount, Paid By, Check #, Transaction ID and Transaction Date to be updated in
    a much quicker fashion than finding and editing these fields each individually.
    Once you have entered data for those fields and selected a new Contribution Status
    for the displayed records, click on Update Pending Status to save all the changes.


    Note that all contributions selected by your search must have a status of pending
    in order to use this tool; else, an error message is displayed.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_303_0.png)


    # Print or E-mail Contribution Receipts


    One excellent use of this action is to follow-up on records that have just had
    their contribution status updated from Pending to Completed. After clicking Done
    following any action you are returned to the search results and can proceed with
    additional actions. Select Print or E-mail Contribution Receipts from the list
    and click on Go.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# PDF or e-mail receipts


    **PDF receipts** creates a PDF file of receipts that can be printed and mailed,
    while **E-mail Receipts** sends receipts to donors of all selected records via
    e-mail. After clicking to **Process Receipt(s)** you will be returned to the search
    results (if you e-mailed receipts) or be prompted to save the PDF file (if you
    are generating PDF receipts). Note that receipts are generated using the **Contribution
    - Receipt (on-line)** template (see **Administration | Configure | Message Templates,
    System Workflow Messages** for more details).


    # Sending e-mails to contacts


    Working the same as the corresponding contact search action, this tool allows
    you to generate and send an e-mail activity to search results. One possible use
    of this action is to send thank-you e-mails to donors who will be receiving signed
    hard-copies of receipts where jurisdictions do not accept e-mail receipts for
    tax purposes.


    Complete the standard **Send E-mail** activity form, selecting the **From** e-mail,
    **CC**, and **BCC** as appropriate; entering a **Subject** line; and providing
    the content of the e-mail. As with other uses of this tool you can choose to **Use
    Template**, and supply either/ both **HTML Format** and **Plain-Text Format**
    content as desired. The e-mail content may be saved as a new template or if an
    existing template was used, it may be updated. If you''ve enabled attachments
    in your **Global Settings**, you may add them here.


    # Batch Update Contributions Via Profile


    Also based on the contact search equivalent tool, this option allows you to update
    up to 100 records at once in a grid-style layout using a predefined profile to
    define the columns/fields that will be edited. For the purposes of illustrating
    the usefulness of this action, we will create a profile with contribution fields,
    and then use it to alter the status and several other contribution fields. Like
    batch update actions carried out on other records, you will be able to edit the
    fields exposed in the contribution profile in a much quicker fashion than finding
    and editing each contribution record individually.


    Create a profile at **Administer | Custom | CiviCRM Profile** and select a few
    contribution-type fields, such as the thank-you date, payment instrument, and
    check number. It''s not necessary to add contact-related fields as profiles with
    only contribution fields display the name, e-mail, and address of the donor automatically.
    After saving the profile, return to your search results or reinitialize them,
    select one or more contributions, and choose the **Batch Update Contributions
    Via Profile** action. You will be presented with a list of profiles that can be
    used for this purpose. Select the profile you just created and click **Continue**.'
  merge: -1
  img_proc: true
- pgno: 305
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 306
  md: 'However, we strongly discourage deleting financial data transactions and will
    suggest some ways to prevent any users from having permission to delete financial
    transactions. A better practice is to post reversing transactions or use the status
    to communicate why the original transaction has changed (for example, by marking
    as cancelled and providing an explanation for the action).


    One exception may be when you clean out test records from your system. In general,
    test records are well-hidden from the interface. You must explicitly choose to
    include them from the Find Contributions tool (check Find Test Contributions?);
    otherwise, they will be excluded by default.


    However, it is reasonable to want to periodically search for these test records
    and use the bulk Delete Contributions action to remove them from the system. Be
    sure you have a recent backup of your database before performing any bulk deletion
    of this sort.


    As you can see, CiviCRM provides a number of powerful tools for working with contribution
    records in bulk. Take time to explore the features available so that you know
    your options when you are working with records and have a clear understanding
    of what they do.


    # Searching, examining, and taking action on pledges


    When compared to contributions, fewer options related to pledge management are
    available. As described earlier, a pledge is a collection of contribution records
    (pledge payments) defined by the encompassing pledge options.


    # Searching pledges


    To search for pledges, click on Search | Find Pledges or Contributions | Pledges
    | Find Pledges. The following criteria are available when searching pledges. We
    will note any particularly useful, interesting, or possibly unexpected behavior
    when using the criteria:


    +   - **Pledger Name or Email**: Search using a partial string for the pledger
    name or e-mail.

    +   - **Payment Scheduled – From and To**: Enter a range, or just a start or end
    date. Like other fields, not entering a value here will return records regardless
    of the value in this field.

    +   - **Pledge Payment Status**: One or more of Completed, Pending, Cancelled,
    Overdue.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '+   - **Pledge Amounts – From and To:** These amount ranges are inclusive –
    it will include pledge amounts equal to or greater than **From** and equal to
    or lesser than the **To** amount. When using any of the range based fields, you
    do not need to provide a value for both. For example, entering **50** in the **Pledge
    Amount From** field will return all pledges greater than or equal to 50.

    +   - **Pledge Status:** One or more **Completed, Pending, Cancelled, In Progress,**
    or **Overdue** statuses. Understand the difference between the **Pledge Payment
    Status**, which tracks individual payment records, and the **Pledge Status**,
    which tracks the overall status of the pledge record.

    +   - **Pledge Made – From and To:** These are inclusive – pledge amounts equal
    to or greater than From and less than or equal to **To**.

    +   - **Payments Start Date – From and To:** These are inclusive of pledge amounts
    equal to or greater than **From** and less than or equal to **To**.

    +   - **Payments Ended Date – From and To:** These are inclusive of pledge amounts
    equal to or greater than **From** and less than or equal to **To**.

    +   - **Contribution Type:** Enter one or more contribution types.

    +   - **Contribution Page:** Note that this list may include contribution pages
    that are not currently configured to allow pledges. For example, there may have
    been a time when they allowed pledges and pledges were made against them.

    +   - **In Honor Of:** Note that it searches all or part of first and last name,
    but does not search the e-mail address.

    +   - **Find Test Pledges?** If selected, only test pledges are returned. If unselected,
    only non-test pledges are returned.

    +   - **Pledge Frequency Every [duration] [frequency]:** Retrieves pledges defined
    by the selected frequency options.


    The search results return the "container" pledge record, but you may click the
    arrow to the left of the record to expand and view the associated pledge payment
    schedule.


    # Examining pledges


    Pledges are more complex than single contribution records. In essence, they are
    groups of contributions bound and managed as a single unit (with distinct elements).
    The creation of the pledge defines the contribution records; the status of the
    individual pledge payments controls the status of the overall pledge record.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'After conducting a search, the pledge search results page allows easy drill-down
    access into the schedule of payments, both pending and completed, that collectively
    make up the pledge record. In addition to View/Edit/Delete links, a Cancel action
    is available for pledges. Canceling, unlike deleting, doesn''t remove the records
    of payments received. It is the preferred way of managing pledge records that
    have been stopped mid-payment.


    Each payment revealed in the drill-down has action links on the right that allow
    a payment to be recorded by the administrator and also allow easy editing of the
    payment schedule when there is an issue with a payment. For example, if a payment
    has to be reduced or the due date extended, a single pledge payment record can
    be adjusted and the remaining payments will be adjusted accordingly.


    # Taking action on pledges


    There are two actions available as operations on search pledge results: pledges
    can be exported or deleted. The interface and workflow are very similar to those
    for contributions described above and for other objects such as contacts, events,
    and memberships described elsewhere. After conducting your search, select some
    or all pledge records, choose an action, and click on Go.


    # Export Pledges


    Select Export PRIMARY fields and click on Continue to save a .csv file containing
    primary contact and contribution fields to your local hard drive. The export can
    be used for importing into your accounting system, sending mails, or whatever
    other needs you have.


    If you want more control over what fields are exported, choose Select fields for
    export and click on Continue to advance to the field selection page. From this
    page, you will be able to specify fields to be exported and, if desired, save
    the field mapping for future use. Once you have selected your fields, click on
    Export to generate and download the export file. Refer to your accounting system
    documentation for the fields it can make use of through its .csv import functionality.


    If you have previously saved an Export field mapping, it will be available for
    selection and re-use when you choose the Select fields for export option. After
    selecting an existing field mapping and clicking on Continue, you will be able
    to review and modify the list of exported fields, and be provided the option to
    Update this field mapping or Save as a new field mapping. Selecting the former
    updates the field mapping when Export is clicked. Selecting the latter allows
    you to provide a Name and Description, and then saves the mapping as well as exports
    the data when Export is clicked. You can leave both unselected and just click
    Export to export the data without modifying the existing field mapping.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Delete Pledges


    As the action title suggests, initiating this option on pledge search results
    will remove them along with their associated contribution records from the system.
    This is a dangerous function, particularly when working with contribution records
    which have certain data integrity and retention obligations.


    To reiterate, we strongly discourage deleting financial data transactions, and
    even suggest ways to prevent any users from having permission to delete financial
    transactions. If a payment (or pledge) has been made, it is better to cancel the
    record (retaining its history) or post reverse transactions (indicating that the
    funds were returned) than to delete it from your system. Deleting it altogether
    results in loss of historical data — the details and information about what transpired
    with the transaction. That is a poor business practice and may not adhere to generally
    accepted accounting principles.


    The one exception to this rule is with test records that were generated solely
    for the purpose of testing functionality, and whose financial charges (if any)
    have been reversed. In the pledge search tool, select Find Test Pledges to retrieve
    them and use the Delete Pledges action to remove them.


    # Reporting


    You can create contributions and pledges, manage existing records, conduct robust
    searches, and take bulk action on the results; but how do you translate the wealth
    of data in the system into a meaningful report for organization leadership? How
    do you turn raw data into a story that tells people where the organization is
    and where it is headed? In this section, we will translate some of the search
    tools described above into meaningful examples of how you might use them to extract
    important statistics and report summaries.


    # Counting prospects with Advanced Search


    When trying to determine the number of prospects for different segments, you need
    to make sure to count contacts rather contributions. For example, if you want
    to find the number of people who have given a donation between $100 and $500,
    you would not use Contributions | Find Contributions or Search | Find Contributions
    because it may return duplicate contact records if the contact has given more
    than one donation within that range.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '**Advanced Search** returns contact records by default, not the related records
    (such as contributions) and includes a count of their number, so it is one useful
    way to count prospects for fundraising segments:


    +   1. Click **Search | Advanced Search**.

    +   2. Click the **Contributions** panel to open it. Note that this form is almost
    identical to the **Find Contributions** tool (it excludes the contact name/e-mail
    field, which is handled in the **Basic Criteria** panel).

    +   3. Choose your desired criteria and run the search.


    At this point, your search will return all contributors who have at least one
    contribution matching the criteria selected. One additional advantage of using
    the **Advanced Search** is the ability to add criteria *outside* of the contribution
    panel. For example, if you want to restrict your search to only those contacts
    who are also members in good standing, you can expand the **Membership** panel
    and add criteria.


    The following table outlines how certain constituent segments would translate
    into specific search criteria:


    | Segment | Field | Enter the following value |

    |---|---|---|

    | Those who gave one or more contributions greater than or equal to $100 and less
    than or equal to $500 | **Contribution Amounts From** | 100 |

    |  | **Contribution Amounts To** | 500 |

    | Those who gave in 2009 | **Contribution Dates - From** | Jan 1, 2009 |

    |  | **Contribution Dates - To** | Dec 31, 2009 |

    | Recurring contributors | **Find Recurring Contributions?** | Checkmark |

    | Tribute contributors | **In Honor Of** | % (the percent character is a wildcard
    that tells CiviCRM to match any non-empty value. In this case, we simply want
    all the contributors who have donated in honor of someone else) |

    | Paid-event participants | **Contribution Type** | **Event Fee** (assuming your
    events use the standard **Event Fee** contribution type) |'
  merge: -1
  img_proc: true
- pgno: 311
  md: '| Segment | Field | Enter the following value |

    |---|---|---|

    | Paid members or subscribers | **Contribution Type** | **Member Dues** (assuming
    your memberships use the standard **Member Dues** contribution type) |

    | Contributor to a specific online campaign | **Contribution Page** | Select the
    page that accepted donations for the campaign. |


    After you have entered your criteria and clicked on **Search**, you are presented
    with a page that includes the total number of contributors that match the criteria,
    and the first page of results (by default the first 50). After you have reviewed
    the results, you can change your search criteria and rerun the search easily by
    clicking **Edit Search Criteria** to expand the criteria panel.


    Note that if you enter more than one criterion, you will return fewer results
    because all the criteria must be true in order to be returned in the results;
    in other words, search criteria are restrictive (AND joins the criteria). You
    may use other tools, such as the **Search Builder** described below, if you are
    interested in returning results that match one or another criteria. Another way
    to achieve this is to run your individual sets of restrictive criteria and save
    them in a group, and then conduct a search that combines the groups (multiple
    groups selected in through **Advanced Search** are inclusive—the search will return
    records matching any of the groups).


    Since criteria specified on the **Advanced Search** page are restrictive, we caution
    you against entering criteria for both contributions and pledges at the same time.
    If you aren''t careful, you might end up asking for those who gave a completed
    donation and who also pledged, which are distinct groups generally handled very
    differently.


    The **Advanced Search** is a very powerful tool, but it has several limitations.
    Most notably, the interface does not let you specify NOT criteria. For example,
    there is no way to say "Search for every contact that has contributed with a contribution
    type that is *not* **Event Fee**."


    # Additional segmentation suggestions and tools


    CiviCRM''s search and reporting mechanisms, potentially supplemented with custom
    searches and reports, can provide you with:


    +   - The number of existing prospects for initial gifts (for example, the number
    who have subscribed to a newsletter, attended an event, e-mailed a concern, signed
    a petition, and so on).'
  merge: -1
  img_proc: true
- pgno: 312
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 313
  md: 'As with other search tools, you may conduct the search and take action on bulk
    results. The available options will depend on the nature of the records returned.


    # Researching with profile questionnaires


    For many organizations, surveys and profile questionnaires provide an important
    basis for understanding existing and potential constituents, and may help form
    your strategies for fundraising.


    CiviCRM''s custom fields and profiles can be used to conduct surveys (see Chapter
    5, Collecting, Organizing, and Importing Data for a full discussion of custom
    data and profiles). General results regarding market attitudes to your mission
    and case for donating are most important during the development of the fundraising
    plan. However, individual answers to survey questions during the development of
    the plan may provide data useful for targeting fundraising appeals. You may find
    that your contact base has distinct groups that respond to different elements
    of your mission. For example, some may be primarily interested in supporting immediate
    relief efforts, others primarily in supporting systemic and preventative change
    efforts.


    > CiviCRM v3.3 introduced a new Campaign component that uses activities as a structure
    for surveys and petitions. While the tools were originally developed for political
    and issue-oriented campaigns, they can also be used for mission and fundraising-based
    surveys. If you are using this version, investigate how those tools are structured
    to see if they provide an effective avenue for your needs.


    # Contribution reports


    CiviCRM has built in reporting tools that include a number of excellent report
    templates geared toward donor/contribution/fundraising information needs. The
    following is a list of report templates currently available. You should expect
    this list to be supplemented in coming versions:


    +   - **Donor Report (Summary)**

    +   - **Donation Summary Report (Organization)**

    +   - **Donation Summary Report (Household)**

    +   - **Donor Report (Detail)**

    +   - **Donation Summary Report (Repeat)**

    +   - **SYBUNT Report**: This means "Donors who contributed Some Year But Not
    This Year"'
  merge: -1
  img_proc: true
- pgno: 314
  md: '+   - **LYBUNT Report**: This means "Donors who contributed Last Year But Not
    This Year"

    +   - **Soft Credit Report**: Soft credits represent donations that a contact
    has solicited but not made themselves

    +   - **Top Donors Report**

    +   - **Pledge Summary Report**

    +   - **Pledged But not Paid Report**

    +   - **Bookkeeping Report**


    A full discussion of CiviCRM''s reporting tools is found in *Chapter 12, Telling
    Your Story: Building Reports*. We won''t take the time to walk through the concepts
    and available features here, as they are covered in depth in that later chapter.
    Take the time to review the core concepts and available reports so that you know
    where to turn when you need to begin assembling reports.


    # Implementing an appeal


    As we have seen, fundraising plans generally include several different fundraising
    programs, such as converting one-time givers into pre-authorized monthly donors,
    holding a fundraising dinner, or prospecting for new donors. In this section,
    we will use CiviCRM to deliver an appeal across many channels: online, direct
    mail, telemarketing, and direct contact.


    # Planning


    An appeal is a targeted message to constituents encouraging them to donate for
    a specific purpose – such as a project or new initiative. Standard elements of
    a simple fundraising appeal plan may include:


    +   - **Segment**: Who is to be asked to donate?

    +   - **Goal**: What total amount of giving is the appeal aiming to raise, and
    what will the funds be used for?

    +   - **Case**: What reasons are to be provided to donate? This should be a refinement
    of the general case for giving in the overall fundraising plan. It is usually
    best if there is an emotional component and a sense of urgency in the communications.

    +   - **Ask**: What is the specific thing to be asked for? (For example, a one-time
    gift larger than last year''s, any gift, an increase in the monthly pledge, and
    so on.)

    +   - **Face**: Who is the face of the campaign? What name will the letters and
    e-mails come from?'
  merge: -1
  img_proc: true
- pgno: 315
  md: '+   - **Message:** What is the key message of the appeal, boiled down to a
    phrase or a sentence or two?

    +   - **Creative:** The text, images, graphic design, and layout of the materials
    used in the appeal, including production. This includes e-mails, landing pages,
    thank-you pages and e-mails, direct mail packages and response mechanisms, telephone
    scripts, brochures, sign-up sheets, and so on. Don''t forget the training and
    support materials for those helping to implement the appeal as volunteers or staff.

    +   - **Team:** Who are the people who will be planning the appeal, preparing
    the materials, making the solicitations, following up, and so on?

    +   - **Events:** Will there be a kick-off, closing, or other event(s)?

    +   - **Schedule:** When do tasks and activities in the appeal start and end?

    +   - **Closing:** When does soliciting for the appeal end and supporting materials
    like web pages and posters get taken down, and call sheets and off-line donations
    received by solicitors get collected for review?

    +   - **Appreciation:** How will donors, volunteers, and staff be recognized and
    appreciated for their contributions? Will there be a party in addition to thank-you
    e-mails and letters?

    +   - **Follow-up:** Reporting on how well the appeal achieved its goal, what
    lessons were learned for future efforts, sending pledge reminders, communicating
    with donors and others on how the funds were spent.


    With this plan and creative materials in place, you can begin using CiviCRM tools
    to construct your online elements.


    # Creating an online contribution page


    CiviCRM **Contribution Pages** are online forms used to collect contributions.

    They include a vast array of configuration options which you may choose from.

    To create a new page that donors can use to pledge or contribute online, click
    on **Administer | CiviContribute | New Contribution Page** or **Contributions
    | New Contribution Page**. You can view existing contribution pages by visiting
    **Administer | CiviContribute | Manage Contribution Pages** or **Contributions
    | Manage Contribution Pages**, and can click **Add Contribution Page** to create
    a new form from this page.'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'This brings up a nine-step wizard that will walk you through setting up all
    of the options associated with a contribution page. Each step groups together
    settings of a particular type. You can see which step you are on by noting which
    of the nine text boxes representing the different stages is in bold (the title
    of the current page is sometimes a bit different from the short text used in the
    steps list). The wizard lets you move forward and back or cancel at any point
    using buttons conveniently located at the top and bottom of each page. Note that
    after advancing past the first page, your contribution page is saved in a partial-state
    of completion. Clicking cancel on later wizard steps returns you to the contribution
    page dialog and does not save settings from the current form you were on. However,
    the contribution page has already been created, and changes to other steps in
    the wizard will have been saved.


    If you do navigate away before completing the wizard, you can complete the configuration
    of the page by editing its configuration as follows:


    +   1. Click on **Administer | CiviContribute | Manage Contribution Pages** or
    **Contributions | Manage Contribution Pages**, and click **Configure** for the
    desired page. This brings up a page that lists the nine steps in the wizard with
    a description of what is configured on each one, as well as two other options
    that we will deal with below: **Test-drive** and **Live Contribution Page**.

    +   2. From this page you can jump to any step that needs to be configured or
    re-configured:

    +      - **Title and Settings**

    +      - **Contribution Amounts**

    +      - **Membership Settings**

    +      - **Include Profiles**

    +      - **Thank-you and Receipting**

    +      - **Tell a friend**

    +      - **Personal Campaign Pages**

    +      - **Contribution Widget**

    +      - **Premiums**


    Each of these pages displays the same configurations as seen in the wizard. After
    entering or editing the values in the fields, you are presented with the option
    to **Save** or **Cancel**. Both return you to the page listing all of the configuration
    options for that contribution page.


    Let''s review each configuration step in turn.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Title and settings


    The **Title** of your contribution page should be related to the message of your
    appeal. If you are going to have a single page for donations on your site, you
    should make the title fit with the style your site uses for pages and menu items,
    such as **Donate** or **Help the Children!**


    Select an appropriate **Contribution Type** for the page. If its name doesn''t
    make it clear, you may want to verify that the type you are selecting has the
    right tax-deductible status and accounting code by opening a different browser
    tab. If you have a mouse with a right button and are using Firefox, you can click
    on **Administer | CiviContribute**, hover over **Contribution Types**, right-click
    then select **Open Link** in **New** tab.


    If you want to allow organizations to make donations on the current page, click
    to select **Allow individuals to contribute and/or signup for membership on behalf
    of an organization?** This adds fields to the contribution page that allow the
    user to specify the name and contact information of the organization on whose
    behalf they are contributing. These fields appear when the user clicks a select
    box labeled with whatever text you put in **On behalf of Label**. Enabling this
    option will record the contribution record with the organization contact. If the
    contacts don''t exist in the system, completion of the form will create a new
    organization and new individual contact, and construct an employer/employee of
    relationship between them.


    If the page you are configuring is intended for a corporate campaign, you can
    check **''Required'' to force ALL users to contribute/signup on behalf of an organization**.
    The contribution page functionality is used for membership signups as well as
    donations, and this feature is commonly used in that context when only organizations
    are eligible to purchase the memberships on a certain page.


    Enter any creative material such as text and images that you want displayed at
    the top or bottom of the page in the **Introductory Message** and **Footer Message**
    fields.


    If the appeal has a fundraising goal, you may fill it in and it will be used to
    calculate how close you are to meeting the goal. As we will see below, CiviCRM
    provides thermometer-style widgets that can be used to promote your goal-based
    campaign. These indications of progress are a time-tested way of motivating participation
    in offline and online campaigns.


    These CiviContribute widgets are small blocks of content about the contribution
    page''s appeal that can be placed elsewhere on the site or by your supporters
    on their sites. They explain the appeal and display the current progress towards
    meeting its goal. They also allow users of your supporters'' sites displaying
    the widget to click through to the contribution page on your site to make a donation.
    We''ll see what they look like, below. At this point, what''s important is that
    the fundraising goal you set here determines the top level of the widget thermometers.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'One issue to be aware of when using widgets is that you may not have control
    over them if you have encouraged your supporters to integrate them on their own
    websites. Once the campaign associated with your appeal is over and the appeal
    is closed, widgets about the campaign may still exist on your supporters'' sites.
    The **Start Date** and **Time**, and **End Date** and **Time** fields can be used
    to make the widgets point to a page displaying a "Campaign is over" message, which
    can help prevent unintended donations to a completed campaign.


    Certain types of fundraising appeals benefit from having donors indicate that
    a donation is made in honor of someone else or in memoriam to someone. For example,
    an organization raising funds to fight breast cancer might encourage people to
    donate in honor of loved ones who are cancer survivors, or in memory of someone
    whose fight with the disease has ended. Donations received as a result of funeral
    notices directing donations in lieu of flowers to the organization can then be
    tracked, public listings of such donations displayed if desired, and families
    notified if appropriate to allow them to express their thanks.


    If desired, click to select **Honoree Section Enabled**. You can optionally provide
    a title for the Honoree section of the page and a description to put above the
    honoree field. The latter might explain how such gifts are given special treatment.


    By default, newly created contribution pages are active. This means that navigating
    to the right URL will display the page in whatever state of configuration it is.
    If you want to disable the page until it is fully configured, or if other elements
    in your fundraising program are ready, or its scheduled launch date has arrived,
    click to deselect **Is this Online Contribution Page Active?**.


    # Contribution amounts


    This page contains settings associated with how payments are to be made as well
    as the pre-defined levels for donations.


    As mentioned above, not all contribution pages need to submit a live transaction
    to online payment processors. Perhaps you want to set up a page that handles only
    in-kind contributions with custom profile fields appropriate to that use case,
    or perhaps you are just getting going with CiviCRM and though you haven''t yet
    managed to get all of your merchant and payment processor approvals yet, you''d
    like to start accepting pledges for later payment by check. In these cases, you
    should uncheck **Execute real-time monetary transactions**.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'If you have configured more than one payment processor, checking **Execute
    real-time monetary transactions** brings up a **Payment Processor** select box.
    Your organization may have more than one payment processor account if your site
    accepts contributions on behalf of sub-organizations with their own accounts,
    or to provide complete separation of the accounting for charitable and non-charitable
    donations. Version 3.2 requires the same processor to be used for all contributions
    through a page, including immediate and recurring pledge payments (with the exception
    of membership signup forms, as discussed earlier). Select the appropriate payment
    processor from the drop-down select box.


    In *Chapter 8, Growing Your Membership and Interacting with Members*, we will
    discuss the option of turning off the ability to donate when purchasing a membership
    or subscription. For standard contribution pages, ensure that **Contribution Amounts
    section enabled** is checked.


    In some countries, it might be unclear why there should be an option to send in
    a payment later by check on an online donation form. Either people donate online,
    or they send in checks, or they phone in a contribution. Why would anyone want
    to do part of the transaction online and part offline? Why would an organization
    want to facilitate that? The reason is that some people can''t or won''t pay with
    a credit card or PayPal account online, perhaps because they don''t have them
    (for example, wealthy old donors) or because they don''t trust the security of
    online payment systems. They will respond to an e-mail appeal and fill in all
    of the information about themselves and their donation, but the payment itself
    will be done by mail, phone, or in person at a later date. They may also want
    to make the donation but not have sufficient available funds. Organizations benefit
    from reduced data entry and encouraging the commitment to donate, which allows
    them to follow up if the donation is not received within a reasonable period.
    There may also be cases where an organization''s infrastructure doesn''t support
    online payments—for example, on-going monthly payments with certain payment processors.
    In some countries like New Zealand and parts of Europe, electronic funds transfers
    are common and can be facilitated by providing banking details that are used when
    later paying from a bank site.


    If you find one of these cases applies to you, enable the **Pay later option**
    and enter text to be displayed to users who want to pay later in the **Pay later**
    label. Then provide instructions such as an address, phone number, and payment
    grace period in **Pay later instructions**. This text is displayed on the thank-you
    page and is also included in the e-mail sent to the donor.


    If you have configured a price set that you want to use, select it from the **Price
    Set** drop down. If you do not select a Price Set, then you can allow users to
    pledge to make donations by checking **Pledges**. Configure the pledge options
    displayed to donors as follows:'
  merge: -1
  img_proc: true
- pgno: 320
  md: '1. Select one or more of the Supported pledge frequencies.


    > In many cases, you will optimize your return by only providing the option of
    monthly donations. As a rule of thumb, more fields to be filled in leads to more
    abandonment before completion. Unneeded options may detract from the user experience.


    2. Checking Allow frequency intervals will present users with a field so they
    can enter a number for how often the selected pledge frequency will result in
    a donation. For example, they will be able to enter 3 if they want to donate every
    three months.


    > If you think your users really need this option, try testing two contribution
    pages, one with and one without this enabled, to see which yields better results.


    3. Automated payment reminders for pledged payments can be set up using the Send
    payment reminder, Send up to, and Send additional reminders fields. For monthly
    pledges, good numbers might be either two days or none prior to the payment due
    date, three reminders in total, and 10 days between reminders. For annual payments,
    which are likely to be larger and more unexpected, 14 days'' notice and three
    reminders 14 days apart might be appropriate. Procedures to ensure manual follow-up
    in cases of non-payment usually provide good return on investment.


    Depending on what payment processor you are using, you may have the option of
    enabling recurring contributions. If enabled, you select the frequency options
    (units and intervals) available to users, similar to how pledges are constructed.


    Pledges and recurring contributions provide similar, but different, functionality.
    It''s important to understand the difference:


    +   - A pledge is a promise to pay a total amount in fixed, scheduled intervals.
    It''s only a promise though. The donor must send payment by phone/mail or using
    the online payment form when each scheduled pledge payment comes due.

    +   - Recurring contributions are actual payment authorizations. Your payment
    processor will receive and record the recurring authorization. When the next payment
    comes due, they will automatically initiate the transaction and send notification
    back to your CiviCRM installation (so that the contribution record is generated).'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'In general, recurring contributions are preferred, as you (and your donor)
    do not need to actually do anything to trigger the future payments. The contributor
    will receive receipts from both your CiviCRM installation and the payment processor
    which includes a link where they can visit and cancel the recurring contribution.


    Though pledges require more work (to follow up with late payments) and are more
    susceptible to abandonment (since the donor must take action each time the pledge
    payment is due), it may still have an important place in your fundraising strategy,
    such as in multi-year capital campaigns.


    Note that many payment processors don''t support recurring contributions. If yours
    does not, the pledge tool may become a more important element of your fundraising
    plan.


    Check **Allow other amounts** if you would like to give potential donors the option
    of entering a donation value of their choice, rather than being forced to select
    from the price set or simple list of donation levels. You may enter minimum and
    maximum amounts accepted for this field. One reason to enter a **Minimum amount**
    could be to help ensure you don''t lose money given the cost of processing a donation.
    In our view, this is likely to be shortsighted given the lifetime value of a new
    donor and the cost of acquiring a new donor. In jurisdictions with limits on donations
    to political campaigns, entering a **Maximum amount** can improve compliance while
    lowering compliance-adherence costs.


    **Fixed Contribution Amounts** are suggested gift levels presented to users as
    radio button options. You can provide an **Amount** for each level or both an
    amount and a **Contribution Label**. If desired, a default amount can be selected
    when users land on the page.


    The number, amount, and default value of these options can significantly impact
    your revenue as they steer donors to giving less/more or abandoning their decision
    to donate. Consider using multiple pages that vary these amounts and the default
    value, and use it for comparison testing within the same segment. Consider setting
    up additional pages with appropriate suggested amounts when trying to upgrade
    donors to higher levels of giving. Vary the link inserted into direct mail and
    e-mail messages so that donors land on an appropriate page based on their segmentation.


    # Membership settings


    Leave **Membership Section Enabled** unchecked for contribution pages. *Chapter
    8, Growing Your Membership and Interacting with Members* will explain how to configure
    contribution pages for membership signup and renewal.'
  merge: -1
  img_proc: true
- pgno: 322
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 323
  md: 'By default, **E-mail Receipt to Contributor?** is checked. Generally speaking
    you will always use this feature as an automated way to send receipt and an additional
    channel for thanking the donor. You may want to fill in the **Receipt From Name**
    with the organization name or individual most associated with contribution giving.
    It''s best if the **Receipt From E-mail** reflects the **Receipt From Name**.
    Thank-yous coming from `info@ mydomain.org` don''t have a terribly strong impact.
    It is good practice to ensure that the FROM address is monitored since some people
    will reply to the e-mail. You may also want to include an e-mail address and phone
    number in the **Receipt Message** for an administrative person to contact if there
    are any questions. Details of the contribution are automatically inserted into
    the e-mail body. The template used to construct it can be reviewed by visiting
    **Administer | Configure | Message Templates.**


    Use the **CC Receipt To** and **BCC Receipt To** fields to enter one or more comma
    separated e-mail addresses to receive copies of the receipt messages. This can
    be useful if there are premiums or price set options that require manual fulfillment,
    such as setting up a membership or subscription, or sending out thank you gifts.


    # Tell a Friend


    A person who has just finished donating to your cause is the best advocate you
    can have for encouraging their friends and colleagues to donate. They can speak
    with authority about making a donation, and they are often highly motivated as
    they have just made their own donation.


    To encourage viral marketing of your cause, CiviCRM includes functionality to
    enable donors to tell their friends to donate via e-mail. Check **Tell a Friend
    enabled?** to reveal available options.


    The first two fields, **Title** and **Introduction**, control what appears if
    users go from the donation thank-you page to the **Tell a Friend** form. **Suggested
    Message** is text that these users can modify, so that the text they want will
    be sent to their friends or colleagues. An **Info Page Link** can also be included
    in messages sent to these friends. This provides a longer case for giving to the
    campaign and more information about your organization and its mission. The **Thank-you
    Title** and **Thank-you Message** are the title and text that will be displayed
    to people who do tell their friends.


    # Personal Campaign Pages


    A stronger kind of viral networking than **Tell a Friend** is appropriate in cases
    where the donor is making or would be willing to make more of a commitment and
    sacrifice to the appeal and organization than just a few clicks and a few dollars.
    If your supporter base includes highly motivated and engaged individuals, such
    as people willing to participate in a run-a-thon or bike-a-thon, then you might
    want to enable and put some effort into personal campaign pages for these volunteer
    campaigners.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'Check **Enable Personal Campaign Pages (for this contribution page)?**. This
    reveals a number of settings to configure. The first two help to protect the reputation
    of your organization from Spam bots and malicious users. Check **Approval required?**
    to require administrator approval before new personal campaign pages are activated.
    Enter a **Notify** e-mail to ensure that the administrator is notified as soon
    as there are pages awaiting approval on the site. Once the page is approved, its
    creator will be notified and they will be able to start their campaign.


    You and the system need to know who is setting up a campaign page. Use a profile
    to collect key information about the constituent, such as their name and contact
    details. "Once this profile is specified in **Supporter profile**, it will be
    used as supporters create their campaign page. We recommend allowing approved
    supporters to use **Tell a friend** functionality by checking that field, and
    setting the "**Tell a friend**" **Maximum recipients limit** to **5** or **10**.
    The latter setting allows personal campaigners sufficient flexibility while not
    risking unduly loading the system or endangering it in being labeled a spammer.


    Your appeal message should be consulted to help you determine what to enter in
    **Create Personal Campaign Page** link text. This text will appear on the donor
    thank-you page and on each Personal Campaign Page to encourage donors and visitors
    to personal campaign pages to create their own. It is good communication policy
    to use the same text on any menu or other links to the same functionality. For
    example, if you have an article on your website about a fundraising campaign,
    use the same text for a link in the article to the donation page as you use for
    it in your site''s menu system.


    When people create a personal campaign page, they have the option of allowing
    donors to their page to leave information that will be scrolled through on an
    honor roll on their personal campaign page.


    While Personal Campaign Pages can be powerful ways to transmit the message about
    your site''s contribution page, they are potentially dangerous as strangers are
    allowed to create content on your site and send e-mail messages from your site
    with links back to that content. We saw that it was possible to require prior
    administrator approval of Personal Campaign Pages before they were allowed to
    become active. Administrators can also click on **Contributions | Personal Campaign
    Pages** or **Administer | CiviContribute | Personal Campaign Pages** to get to
    an interface to manage these pages.


    To review the content of a Personal Campaign Page and confirm it is (still) appropriate,
    click on its **Page Title**. If the page content is inappropriate, go back to
    Personal Campaign Pages and click on either **Reject** or **Delete**.


    Campaigners who get others to donate are extremely valuable to your organization.
    CiviCRM automatically gives a soft credit to the creator of a Personal Campaign
    Page for all the money raised through it.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# # Contribution widget


    As described in the preceding sections, contribution widgets are code snippets
    that can easily be added to any web page to help motivate and drive potential
    donors to the contribution page. Contribution widgets are a different form of
    viral marketing than Personal Campaign Pages or Tell a Friend. Instead of having
    supporters reach out one-on-one to their friends via e-mail, it enables supporters
    with their own sites or web pages to easily publicize the donation page to their
    own site visitors. Contribution widgets can also be used on your own site. They
    can be placed in Drupal blocks or Joomla! modules to draw attention to ongoing
    fundraising campaigns you are conducting.


    To enable contribution widgets for a contribution page, check **Enable Widget**?
    This reveals settings that can be configured to affect the appearance of the widget.
    The following screenshot shows the two tabs of a sample widget:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_325_0.png)


    The **Info** tab displays the graphical thermometer as well as text indicating
    the target amount, total raised so far, and the current number of donations.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_325_1.png)'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'The **About** tab displays a short bit of text. Note that the space available
    for content is limited as this is a widget and not a full page. You should use
    a short, boiled-down version of the campaign''s ask or appeal, rather than a neutral
    reporting description of what the campaign is about.


    You must enter **Title** text and **About** text in the appropriate fields. You
    may also specify a logo image by providing **URL to logo image**. You can enter
    **Contribute!** or alternative appropriate text for the **Button Title**. You
    must enter your **URL to home page**. You can optionally adjust the colors of
    each visual element of the widget by clicking to open the **Widget Colors** panel.
    Hexadecimal color codes can be found at `http://en.wikipedia.org/wiki/Web_colors#Color_table`.


    Once you have entered this information, click **Save and Preview**. Once you are
    satisfied with the appearance of your widget, click **Select Code**, paste it
    into any web page desired, and make it available through your CMS to visitors
    to copy to their own sites (if desired). If you have a list of webmasters who
    are interested in your organization''s mission, that would be a good place to
    post a request to use the code.


    # ## Premiums


    Premiums are a way of encouraging donors to donate more than they would otherwise.
    It incentivizes giving by offering a gift at various donation levels.


    Premiums must be configured before they can be used on a particular contribution
    page. Review the Configure Premiums section found earlier in this chapter. To
    enable the premium section for a contribution page, click on **Premium Section
    Enabled?**


    As with all other text and content for contribution pages, the **Title** and **Introductory
    Message** for the Premium section should be developed in order to support the
    case for giving and overall message of the appeal. The title appears as a section
    heading on the contribution page, and the Introductory message, which can contain
    images and other html graphical elements, appears below it but above the list
    of premiums available to donors on the page.


    We recommend providing an office administrator **Contact e-mail** and **Contact
    phone** number for any donor with questions about premium fulfillment and shipping.


    You can disable the automatic display of the minimum contribution amount after
    the description of each premium by unchecking **Display Minimum Contribution Amount?**'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Test-drive


    After completing configuration of your contribution page, we strongly recommend
    you test the new contribution page using the Test-drive functionality. Try to
    test all options, which may require going through the confirmation, thank-you,
    and other optionally enabled pages a few times. Review e-mails that are generated
    as well as on-screen content. Once you have done this yourself, you should get
    another staff person or friend to review it before you enable the page.


    # Live Contribution Page


    Once you are satisfied with the configuration of your new contribution page using
    test drive mode, we strongly recommend testing the live contribution page. This
    is an essential step if this is the first page configured to use a new or changed
    payment processor, or for pages using new optional features.


    If you have an organizational credit card or PayPal account, the service charges
    on the amounts on your pages shouldn''t be that problematic. You can try configuring
    a test contribution of $1 or $10 or some other small amount in order to reduce
    any costs incurred by your processor. Don''t forget to disable or delete the option
    for the small test amount before putting the page into your menu system or advertising
    it through an e-mail blast.


    Many times, we want to send out a broadcast appeal to a large group immediately
    after enabling a new contribution page. To avoid embarrassment and more importantly,
    loss of revenue and respect from your donor base, make sure you send the message
    first to a small group who will review and test all elements of your campaign,
    including automated e-mails.


    # Publicize the page


    The URL generated by CiviCRM for a contribution page is pretty ugly and hard to
    remember. It may look something like https://mydomain.org/civicrm/contribute/transact?reset=1&id=1.


    Both Drupal and Joomla! provide tools for creating search-engine-friendly links
    that will disguise the standard CiviCRM link, turning it into something like https://mydomain.org/donateNow.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Fundraising: Money for Your Mission


    In Drupal, you can enable the core Path module, then navigate in Drupal to **Site
    building | URL aliases | Add alias**. In Joomla!, you can enable the native SEF
    rewriting tool through **Site | Global Configuration**, and select the Site tab.
    In the **SEO** fields on the right select **Yes** beside **Search Engine Friendly
    URLs**, and preferably enable the `htaccess` option (being sure to change the
    filename that ships with Joomla! as per the instructions provided). Then create
    a link using **Menu Manager** and in the **Menu Items Details** group enter a
    friendly URL in the **Alias** field. Note that enabling SEF URLs will have broader
    impact on your entire site. While it is a significant and highly recommended improvement
    over non-SEF URLs, you should make sure you test thoroughly before enabling in
    a live environment.


    To avoid getting split statistics by search engines due to having two links to
    the same page, it is also a good idea to set up and configure the **Global Redirect**
    module in Drupal so that there is only ever a single URL for a page.


    # Sending direct mail


    CiviCRM functionality supporting offline contribution management is mostly covered
    elsewhere in this book, and there is little to add that is specific to fundraising.
    As a result, the next few sections will present short summaries describing how
    to use that functionality in a coherent approach to address fundraising objectives,
    rather than the detailed instructions necessary to walk through administering
    and using various forms and pages in CiviCRM.


    A direct mail appeal involves preparing mail packages, handling the returns of
    undeliverable mail, and inputting responses. The simplest mail packages have address
    labels on the outside of the envelope and unaddressed "Dear Supporter" letters
    inside. A different approach is to use envelopes with windows revealing the addressee
    and address at the top of the first page of the letter. Even the smallest non-profits
    can produce these packages in-house using CiviCRM''s support for labels and personalized
    letters.


    Once volumes are no longer small, it may be more cost effective to out-source
    the production of the packages. At a certain point, different techniques which
    are only cost effective with larger scale volumes become appropriate. In particular,
    printing addresses and personalized salutations onto a single sheet which is cut,
    folded, stuffed with inserts or response mechanisms on different paper stock,
    and sealed to produce the envelope and its contents, can all be accomplished more
    efficiently using large scale services.


    When volumes are small, you might print labels and letters directly from CiviCRM.
    As the volumes increase, CiviCRM contact information will be exported into a file
    that is delivered to the mail-house for processing.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'Post offices provide volume and other discounts that significantly affect the
    return on direct mail fundraising programs. If an organization can prove that
    the proportion of undeliverable addresses in a mailing is low enough, they may
    receive a reduced rate. If they can ensure that the mail is bundled into groupings
    that correspond to delivery routes, they may also receive a reduction. At present,
    CiviCRM supports the US Postal Service''s address verification software. Apart
    from that, files exported from CiviCRM need to be processed by external services
    in order for CiviCRM users to qualify for postal delivery discounts.


    Some postal services and private services have change of address files that can
    be used to update the addresses in direct mail databases. Though mail is deliverable
    to properly formatted but out of date addresses, this is a poor use of valuable
    resources, and communication with valuable donors is lost. It pays to periodically
    cleanse a donor file against a National Change of Address or similar file.


    The cost effective way to deal with undelivered returns and to process significant
    volumes of positive responses is to put barcodes on the envelopes and response
    devices. This allows a barcode reader to quickly input the information without
    retyping or conducting manual, time-consuming lookups. There is an initial specification
    for adding barcode support to CiviCRM, but it is awaiting community funding (http://wiki.civicrm.org/confluence/display/CRM/CiviCRM+for+Canvassing+and+GOTV).
    In the meantime, printing the contact ID as part of the envelope addresses and
    response materials reduces data entry costs.


    # Running a telemarketing appeal


    At its simplest, an outbound telemarketing appeal requires campaigners to speak
    with prospects on the phone, record whether they will donate, discuss how much
    they will donate, and record how they will pay including details such as their
    credit card information.


    To make this happen, you will begin by getting a list of qualified prospects with
    phone numbers. This may involve appending phone numbers through a data broker.
    The quality of the phone canvassers'' training and abilities makes a big difference
    to the response rate and level of donations received. Low-end call centre technology
    can improve the productiveness of human callers by using predictive dialing. Employing
    Voice over IP (VoIP) phones can reduce long-distance costs without significant
    loss of call quality. Internet based solutions start with inbound click to call
    solutions, which are now closely related to virtual call centre technology. In
    this setup, Internet-based phone canvassers are connected to qualified prospects
    by a website or web service, and they enter the responses they receive into website
    forms without having to see or dial a phone number.'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'The link cited previously includes some rough estimates of the cost to implement
    much of this in CiviCRM. Simpler approaches are readily available.


    The simplest of all is to search for prospects that have appropriate phone numbers.
    Print-outs can form the basis of a call sheet, with response data entered at a
    later point.


    Lists of prospects without phone numbers or whose numbers are now NIS (not-in-service)
    can be exported and sent to a data broker and the results imported to overwrite
    existing stale data.


    Moving up a notch in sophistication, custom fields can be set up for activities
    to represent typical activities in a phone canvass, such as responses to questions
    in a script (for example, are you willing to make a donation of $50?), and call
    disposition (no answer, not home, and so on). This can be used to filter prospects
    that have not yet been reached and to target those whose pledged donations have
    not yet been received.


    CiviEngage is a new Drupal module that aims to address a large number of grassroots
    organizing activities through customizations of CiviCRM features like custom fields,
    groups, and activities. It aims to implement a particular organizing model that
    has had success in a number of contexts. A bit of its functionality is oriented
    towards supporting call lists along the lines just mentioned. If you are uncomfortable
    setting up custom fields and specifying search criteria and want to use CiviCRM
    in telemarketing, then it will be a very good starting point. You will still need
    to modify the fields and the generic responses CiviEngage creates in order for
    it to be useful. However, it is usually easier to modify something that does much
    of what is desired than to start from scratch. The installation procedures for
    CiviEngage are available at http://wiki.civicrm.org/confluence/display/CRMDOC/CiviEngage+Installation.
    Note that CiviEngage and CiviCampaign may merge at some point.


    # Direct contact


    Direct contact fundraising involves activities like soliciting donations from
    passers-by on busy streets. It can also encompass staffing a kiosk at a conference
    or mall. Choosing locations where the street traffic is likely to be well disposed
    to your cause and able and willing to donate is important. Canvasser personality
    and skills are critical.


    Donors from this channel can be entered into CiviCRM from cards or sheets used
    on clipboards. They tend not to renew as frequently as donors from other channels.


    Another traditional approach enjoying some success is door-to-door canvassing.
    Once again, the neighborhood targeted will have an immense impact on whether this
    form of prospecting breaks even and pays dividends over the long term.'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'If your organization''s qualified prospect list is dense enough in some neighborhoods,
    then it can make sense to use walk lists for canvassers. CiviEngage provides some
    support in this area. It relies on core CiviCRM address parsing to pull out street
    numbers from civic addresses in order to produce a walk list report. Once apartment
    and suite numbers are reliably parsed, then it will be more effective at serving
    urban needs.


    # Other types of donations


    Major one-time donations and planned gifts tend to come from contacts that have
    a good long-term relationship with your organization or key individuals in it,
    a strong alignment with your mission or some part of it, trust that your organization
    will successfully deliver on commitments, and resources that enable them to make
    a major gift. Custom fields in CiviCRM can be used to track specific interests
    and demographic information related to ability to give. During the cultivation
    of the relationship, personal face-to-face relationships developed through CiviEvent
    and board activities can be important. Tracking of relationships among high net
    worth individuals, or cross-linked board memberships of other organizations can
    be important in identifying prospects for major donor campaigns and the best person
    to contact for the request. Once the ask has been made it can be useful to track
    meetings and phone calls regarding the negotiations about the terms of the gift,
    tax implications, and so on. These can be stored in generic Activities, or a more
    structured workflow can be created using CiviCase.


    # Permissions


    While the broader issue of permissions is covered elsewhere, we want to take a
    moment to re-emphasize an important concern when working with contributions. We
    strongly discourage deleting financial data transactions as these records have
    tax and financial auditing implications. Drupal installations can disable the
    "delete in CiviContribute" and "delete in CiviPledge" permission from all roles
    to prevent intentional or unintentional deletions.


    Joomla 1.6 will have access control capabilities and work is already being done
    to integrate those tools with CiviCRM''s permissioning. If access control is a
    critical requirement for your organization and you are using Joomla!, begin by
    looking into what it will take to upgrade your site to Joomla! 1.6 and implement
    CiviCRM.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Summary


    In this chapter, we learned how to use CiviCRM for fundraising. In particular,
    we discussed:


    +   - The basics of developing a fundraising plan

    +   - Factors to consider when selecting an online payment processor

    +   - How to configure CiviContribute and CiviPledge

    +   - Manually recording donations and pledges

    +   - Finding, examining, and acting on contributions and pledges

    +   - Implementing a fundraising appeal


    In the next chapter, we will discuss how your organization can track memberships
    and subscriptions using CiviCRM, and how to use contribution pages to enable your
    constituents to purchase and renew them online.'
  merge: -1
  img_proc: true
- pgno: 333
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Defining membership types


    Membership types equate to the different categories of membership your organization
    maintains. Each type will have an amount and dues period associated with it. So,
    if your membership structure has sublevels or you allow alternate payment periods,
    you may need to define a type for each sublevel or payment arrangement.


    For example, consider an "Affiliate Membership" category that is broken down into
    three sublevels — small, medium, and large, in which the volume of annual sales
    generated by the member company determines its membership sublevel. To achieve
    this, you would create three membership types — Affiliate (small), Affiliate (medium),
    Affiliate (large), or some similar naming convention.


    After naming the type and entering an optional description, you search and identify
    the organization to which the membership is attached. This means that at the very
    least, your database must contain one organization record representing your organization,
    to which these membership types will be attached.


    This membership-defining structure, as attached to an organization record, helps
    support more complex systems where you may have memberships with both the state
    organization and regional districts, or some other sub-entity. Memberships are
    also a good way to implement paid subscriptions (such as a monthly magazine).
    Organizations that have both memberships and paid subscription products can attach
    the membership types to different organizational entities (such as departments)
    for management and reporting purposes.


    Proceed with the form; enter in the membership amount and contribution type to
    which the payments should be assigned. If your membership type is free, simply
    enter 0 in the amount field.


    Next, you determine the membership period. The period is the length of the membership
    from starting point to ending point. CiviCRM supports two models — fixed and rolling
    periods. Rolling membership types begin on the signup date and extend for the
    configured length of the membership. Fixed periods, as the name suggests, have
    a fixed starting point, for example, January 1.


    Fixed memberships with duration in months always start on the beginning of the
    calendar month a person signs up. For example, if a person signs up for a fixed
    period membership of six months on July 7, their membership begins on July 1 and
    ends on December 31. If you have selected a fixed period of one or more years,
    you must select the start date for the period and the rollover date. The rollover
    date is the point after which a new membership record will cover both the current
    and coming year. Consider the following example.'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'FPAGM configures three membership types in the system **Regular** and **Affiliate**
    each have a fixed membership period for one year starting on January 1, while
    **Supporting** members have a one-year rolling membership. For the two fixed period
    membership types, they set a rollover date of November 1. This means that any
    new memberships created between November 1 and December 31 will be valid from
    the time created until December of the following year. This feature recognizes
    that it would not be appropriate to assess a full year''s membership dues for
    only two months of benefit.


    One of the most powerful features of CiviCRM''s membership tools is the ability
    to configure membership inheritance through relationships. If a relationship is
    selected in the membership type configuration, any contact record with that relationship
    to the "primary" member is automatically granted a membership.


    A common use of this feature is to automatically consider employees of organizations
    as members. To do this, select **Employer of** in the relationship type field.
    When an organization becomes a member, a corresponding membership record will
    be generated for each employee of the organization. The related or inherited records
    will not be editable; only the primary owner of the membership will have an editable
    record.


    Identifying which side of the relationship you should select can be tricky. For
    instance, in the preceding example, should you select **Employer of** or **Employee
    of** as the relationship type? For help selecting the right relationship type
    and to see some examples of how the inheritance works, click on the help icon
    by this field.


    Other relationships that are commonly used for membership inheritance are **Household
    Member is**, **Parent of**, and **Spouse of.**'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'FPAGM''s Regular and Affiliate membership types are both organization-based
    (the membership is owned by organizations, such as food pantries and businesses
    supplying to the pantries). The Association will configure both to have Employer
    of inheritance. By doing this, the organization can develop saved searches for
    current members for use in mailing and broadcast e-mails.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_336_0.png)


    # Reviewing status rules


    At any given point in time, you will view your members as having a certain status.
    For example, when they first join, you may view them as new members. If the current
    date falls within their membership period, they are current members. At some point,
    if they choose not to renew, they will be considered expired or past members.


    CiviCRM provides a mechanism for defining the rules by which you determine the
    status of members and which can be configured to periodically calculate the status
    of members based on those rules. Navigate to Administer | CiviMember | Membership
    Status Rules to review and modify them.


    Before we look at the rules themselves, let''s understand a few important concepts
    and review the intended purpose of the default rules.


    The first concept to grasp is the importance of the status rule order. As CiviCRM
    processes membership records against these rules, it will assign the first matching
    rule based on the order displayed. This is important, as some membership records
    may match multiple rules.


    For example, in most status configurations a New member would also match the Current
    member rule. Since the New status rule is listed first (in the default configuration),
    this is the status that will be assigned.'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'CiviCRM ships with seven pre-configured rules. Let''s briefly review their
    intended use:


    +   - **New members**: These are members who have just joined the organization.
    Perhaps you want to recognize them by sending them special communications or recognize
    their "newness" with a flag on their conference nametag. Whatever your use, this
    status will help you quickly identify new members.

    +   - **Current members**: These are members for whom the current date falls within
    their membership period start and end dates.

    +   - **Grace**: This status provides a way to give members some flexibility if
    they have not renewed their memberships prior to their end date. Let''s be honest
    — most members wait until after their end date to renew their membership. You
    don''t necessarily want to cut them off right away; so you configure a grace period
    in which their member benefits continue, but they are not considered a **Current**
    member. This can also be helpful for your membership director or membership committee.
    You can use the **Grace** status to quickly generate a list of members who have
    not yet renewed for the current year, and start reaching out to encourage renewal.

    +   - **Expired**: Once a member is past the end date and past the grace period
    allowance, their membership expires. The **Expired** status tells you that they
    let their membership lapse without renewing.

    +   - **Pending**: The **Pending** status is a special use case when allowing
    membership signups with the "pay later" option. The "pay later" option can be
    enabled for member signup pages as an alternative to collecting real-time credit
    card payments. In effect, it is a promise to pay by check, cash, or whatever other
    options you provide to members. When a membership record is generated through
    pay later, both the membership and contribution record is flagged as **Pending**.
    Once the payment is received, you will record it in the contribution record and
    mark it as **Complete**. After saving the completed contribution record, its corresponding
    pending membership will be updated to the **New** or **Current** status.

    +   - **Cancelled**: The first four status types are all date-based rules. Depending
    on the current date and configured rules, the membership record will be assigned
    the first matching status. The fifth one (**Pending**) is a payment-based rule.
    In contrast, the **Cancelled** status is generally only handled on a manual basis.
    For example, a person may join your advocacy organization and at a later point
    find that they disagree with certain positions taken by the organization, prompting
    them to contact you and cancel their membership. There is no date or payment-based
    calculation triggering the cancelation; you simply change their status to **Cancelled**
    in the membership record.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Growing Your Membership and Interacting with Members


    +   - **Deceased:** The last default status type, **Deceased**, may be manually
    applied to the record or will be triggered by the contact''s "deceased" field.


    Most organizations will find the basic functionality afforded by these default
    rules to be sufficient for their needs (though they will certainly want to review
    them and may find a need to tweak the rules configuration, such as adjusting the
    duration of their grace period). If the default rules do not meet your needs,
    you may add, edit, remove, or reorder the rules as needed. For example, you may
    construct a multi-tiered grace period structure before members expire—grace (one
    month), limited (two months), last chance (three months), in which you gradually
    restrict the user from certain member benefits and communicate with them in different
    ways.


    While creating a new rule or editing an existing one, you have several configuration
    options available. These options can be easily misunderstood or misconfigured,
    so let''s take a moment to review them:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_338_0.png)'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'Each status rule will define a trigger (**Start Event**) that indicates when
    the rule is activated, and an optional ending point (**End Event**). Each of these
    may be offset by an adjustment value. Both events are measured from one of three
    dates—join date (the initial date the individual joined the organization), start
    date (the date when the membership period began), and the end date (the date the
    membership period will end or has ended).


    It can be a little confusing to think through how the start/end events, associated
    with the join/start/end date, translate to your desired status. One way to think
    through this is to build a simple timeline representing each status:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_339_0.png)


    Let''s take a closer look at how our timeline grid in the preceding diagram impacts
    the grace status settings. As you recall, the grace status is intended to represent
    the period after the membership end date, but before we regard the record as expired.


    +   - **Start Event:** End Date, no adjustment

    +   - **End Event:** End Date, 2 months


    What does this mean? Starting with the membership''s end date, the record will
    be flagged as grace status for two months. After that period, it will be changed
    to the expired status, or whatever other rule then applies.


    > 💡 Be sure to designate one status as the default one. It will be assigned to
    a membership record in the absence of another matching rule.


    In addition to setting the start and end events, you may consider marking a status
    as "administrator only" in the **Administrator Only?** flag. Flagging it thus
    means the status will never be assigned through rule matching. It can only be
    assigned if an administrator overrides the calculated membership status and assigns
    it. You may, for example, create an **On hold** status which administrators use
    to flag members who must submit credentials or other paperwork before being considered
    **Current** members.'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'The **Current Membership?** flag indicates which status types should be counted
    as current members in the dashboard grid displaying membership totals.


    After setting up your rules, you may want to run some test records, changing the
    join, start, and end dates to match the various statuses you expect will be assigned.


    > Be sure to set up the cron job, as outlined in the *Configuring cron jobs* section,
    to trigger automated membership status updates. When run nightly, or on a periodic
    basis, it will review all membership records against the status rules and change
    them as necessary. If you do not set up the cron, your membership statuses will
    only be updated when a membership record is created or manually updated.


    # Setting up renewal reminders


    By now, you should have your membership types set up, and be planning to create
    membership join and renewal forms to encourage new and existing members to work
    directly with the system through your website. Also, you will need to generate
    your periodic member renewal invoices to retain existing members.


    Wouldn''t it be great if CiviCRM could know when a membership record is nearing
    its end date and send the member a reminder e-mail, encouraging them to renew?
    Well, the good news is that CiviCRM provides just that type of capability! You
    may have noticed a section entitled **Renewal Reminders** at the bottom of the
    membership type configuration page. We use that to set up reminder e-mail options.
    Note that this feature is membership type-specific — you can choose not to enable
    renewal reminders for certain membership types or to configure different e-mail
    templates for use with different types.


    There are two very important steps that must take place in order to use this feature
    — you must create your message template(s) and you must set up the cron job script
    (detailed in the *Configuring cron jobs* section). Assuming you are configuring
    these options for the first time, you may see a yellow message box informing you
    that no message templates currently exist and directing you to the appropriate
    page to set those up. You can access them through the menu by visiting **Administer
    | Configure | Message Templates.**


    The message template, as the name suggests, will have the body text for the reminder
    e-mail to members and may also contain tokens — placeholders for contact record
    data. The **Message Templates** page has two tabs — **User-driven Messages** and
    **System Workflow Messages**. The latter is used for e-mails sent by the system
    in conjunction with core functions, such as receipt e-mails for contributions.
    Our concern at this time is **User-driven Messages.**'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'Create a new message and provide an appropriate title, subject line, and body
    text. Remember that your message should be generic enough to apply to all members
    within the membership type(s) it will be sent to.


    > Be direct. Renewal messages are sent to constituents who already have demonstrated
    a level of interest and commitment to your organization. While you want to make
    the case for continuing their membership, you are primarily reminding them to
    renew. Keep the message direct and succinct.


    Notice that above and to the right of the body text area is a link to insert tokens.
    A token is a placeholder representing a field in the system. When the e-mail is
    processed, the token will be replaced with the value for the field for each recipient.
    Using tokens allows you to customize the e-mail for each constituent, such as
    addressing each e-mail to "Dear First name".


    Once you''ve finished creating your renewal reminder e-mail template(s), return
    to **Administer | CiviMember | Membership Types**, select a membership type for
    which you want to enable renewal reminders, and scroll to the bottom of the form.
    You now have the option of selecting the desired reminder e-mail template and
    indicating when you would like it sent (measured in days prior to the membership
    period end date).


    > You must set up the cron job, as detailed in the following section, to complete
    the configuration of the renewal reminder tool.


    The e-mail template you''ve drafted is not limited for use in the automated reminder
    function alone. You may choose to send additional copies of that e-mail to individual
    members or to groups of members using CiviMail. The template functions as any
    other e-mail template and will be available throughout the system.


    # Configuring cron jobs


    In the sections just covered, we reviewed two functions that require automated
    functionality—an action taken on the system that is not triggered by a user, but
    by a regular, time-based schedule. To accomplish this, we must set up a cron job.


    As the name suggests, a cron job is a time-based action (chronological job) performed
    by the server. It basically consists of a reference to a script and the frequency
    with which it should be run. For a full discussion of cron scripts included with
    CiviCRM, refer to *Chapter 3, Installation, Configuration, and Maintenance*.'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'Our immediate concern is the `UpdateMembershipRecord.php` script located in
    the `civicrm/bin/` subdirectory. This script is initially found as `UpdateMembershipRecord.php.txt`
    in your installation files. You must rename it to remove the `.txt` extension
    before setting up the cron. This is also done to remind you to review the contents
    of the file, as there is a variable within the script that must be manually configured.
    Open the file in your preferred text editor and locate the text `EMAIL@FIXME.ORG`.
    As the text suggests, this must be changed to your desired FROM e-mail address,
    which will be used when the renewal reminder messages are sent.


    > As of version 3.3, this file is no longer shipped with the `.txt` extension
    and the FROM address does not need to be configured directly in the file, as it
    now uses the default FROM address configured in the system.


    Before setting up the cron, let''s review the two purposes of this script discussed
    previously. The script first cycles through all membership records, comparing
    the existing status against the membership status rules, and updating the status
    appropriately. Secondly, the script checks the membership type and end date to
    see if a renewal reminder e-mail has been configured and should be sent out. If
    so, it sends the renewal e-mail and resets the reminder date.


    Given the nature of this script, it is sufficient to configure the cron job to
    run once a day. Depending on the size of your membership, the script may require
    a significant amount of server resources to complete. Consequently, it is best
    to schedule it during a normal downtime in site traffic, such as in the middle
    of the night.


    Depending on your server setup, you may be able to configure the cron job through
    a control panel interface, by connecting to the server through `ssh` to use the
    command line `crontab` command, or by placing a script in the `/etc/cron.daily/`
    directory that will invoke the `UpdateMembershipRecord.php` script. Refer to your
    hosting service documentation for details on your options.


    When referencing the location of the `UpdateMembershipRecord.php` script in the
    `wget` or a similar command in your cron job, you must append three URL variables
    that serve as an authentication mechanism. This helps to prevent unauthorized
    users from running the script.


    ```

    ?name=<username>&pass=<password>&key=<sitekey>

    ```


    For a full discussion of these variables, refer to the *Setting up cron jobs*
    section in *Chapter 3, Installation, Configuration, and Maintenance.*


    When setting up your cron, be sure to test the script with the configured variables
    in a web browser to confirm that it is working correctly. You should also enable
    cron logging or configure e-mail-based logging to ensure that the cron runs correctly.'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'Once successfully running, you will see your membership records updated as
    their status shifts from one type to another.


    # Working with memberships and daily management tools


    As you work with membership records, you will want to easily access a snapshot
    of how your members are trending, search for members by specific type, status,
    or other criteria, and work with individual contacts and their membership details.
    CiviCRM provides a host of tools to do these things.


    From the main navigation bar, do a quick review of the Membership menu:


    +   - **Dashboard**: Provides a summary of current members by type and date range

    +   - **New Membership**: Lets you create a new membership record quickly

    +   - **Find Members**: Provides tools for searching through the member records

    +   - **Import Memberships**: Allows you to take records created in your previous
    system or other source and import them into the system


    We won''t review each of these tools in depth, but will take some time to highlight
    key features and considerations.


    The Dashboard is a great way to quickly achieve a system snapshot of members.
    Remember when we configured membership status rules and there was an option to
    flag a status as considered current? Well here is where that option plays out
    – the grid on the Dashboard page will display current members as defined by that
    option, broken out by current/renewals for the last two months and year to date.


    Notice that much of that summary grid is hyperlinked. For example, you can click
    to quickly see members who renewed or joined in the previous or current month
    within a specific category or across all categories.


    The New Membership menu item quickly creates a new membership record. Using this
    option, you enter the new member form and then search to select a contact (or
    create a new contact). Most of the time, you will first search for and view the
    contact record to ensure that it is the correct one before generating the membership
    from within it. However, this type of "alternate" workflow is common throughout
    CiviCRM.'
  merge: -1
  img_proc: true
- pgno: 344
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 345
  md: '![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_345_0.png)


    Notice that the membership listing may be split into two sections: Active Memberships
    and Pending and Inactive Memberships. The latter will include expired, canceled,
    or pending membership records.


    The button to Add Membership is present above the membership listing. If you have
    a credit card payment processor configured in your site, you will see a second
    button to create a membership and process the credit card payment (Submit Credit
    Card Membership).


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_345_1.png)'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'After selecting the desired membership type, review the other fields and complete
    them as necessary. Note that you do not need to manually set the start and end
    date, unless they should be different from the defaults that would be calculated
    as described in the **Membership Type** configuration section.


    The **Status Override?** flag is used for manually forcing a certain membership
    status on the record. This should be used carefully and sparingly. Once you indicate
    that a status is overridden, the periodic membership update script and any edits
    to the record will not calculate the status. This is typically only used for instances
    where you have a special contact in the system who should be handled within an
    existing membership category but is not charged the associated fee or required
    to renew. This option should also be used when marking a membership as canceled,
    in which case you are purposely removing it from the status rule structure. Take
    care when using this option as you lose the ability to manage your contacts through
    rule-based status types.


    > If you are using status override to mark a membership as permanently current
    because they are a lifetime member, consider setting up a lifetime membership
    type with duration set to one lifetime, as this may be a more appropriate way
    to manage such contacts.


    **Record Membership Fee** provides fields for entering payment details connected
    to the membership. Completing the fields will result in the creation of an associated
    contribution record. It is important to make use of this option whenever possible,
    rather than handling the contribution record separately, as it creates a connection
    between the membership and contribution record that can be referenced later. It
    also streamlines the process significantly as you process the membership and payment
    in a single form.


    As the label suggests, **Send Confirmation and Receipt** will generate an e-mail
    to the user with details about the membership and contribution records created.


    Returning to the membership tab listing, let''s understand how CiviCRM handles
    membership records and renewals. As outlined earlier, there are three dates associated
    with memberships: join date, start date, and end date. The **Join Date** is the
    date when the membership record is first created. The **Start Date** is the date
    the membership period begins. For fixed period membership types, that may actually
    precede the join date. For example, if a membership type runs for a fixed period
    of one year, starting January 1, a new membership created on February 12 will
    have a join date of February 12, but a start date of January 1. Rolling period
    membership types will typically have the same date for the join and start date
    fields. The **End Date** is calculated based on the membership type configuration
    and start date value.


    The idea of renewing a membership record involves extending the end date by the
    membership period. A membership from January 1, 2009 through December 31, 2009
    that is renewed for one year will simply have the end date changed to December
    31, 2010.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'Many organizations are used to thinking about membership history as a series
    of separate records. Using the preceding example, you would see a record for 2009,
    and a second record for 2010. If you are used to that structure, take some time
    to think through how this alternate format impacts your workflow. Rather than
    thinking of membership records as distinct periods, you must view them as an ongoing,
    linear record. After adjusting the way you think of membership to fit this model,
    you will find that the structure can be very powerful when seeking to conduct
    effective searches on member history.


    CiviCRM facilitates the renewal process by including a **Renew** and **Renew-Credit
    Card** option in the **More** drop-down menu.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_347_0.png)


    The renewal form only requests information about the renewal date, payment, and
    receipting. Since a renewal extends an existing record, all the other values are
    fixed or calculated based on existing data.


    Note that the membership records that are inherited via relationships will not
    have options available to edit or renew the record, but instead will have a link
    to the primary or owner''s membership record where those functions can take place.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_347_1.png)


    One common area of confusion is with regard to membership renewals for expired
    memberships. If a certain record exists, but is expired, how should the record
    be handled if a renewal is triggered? CiviCRM processes these records by retaining
    the original join date, but re-setting the start and end dates to new values based
    on the date the renewal took place.


    Depending on how you prefer to track membership history, this structure may not
    be ideal as you lose some of that older data. You may prefer, for example, to
    create a new membership record for expired members in order to retain the older
    historical data separate from the new record. Doing so allows you to note the
    membership lapse that took place between the old and new records.


    At this point, we''ve covered the major functions involved in configuring and
    working with membership records through the administrative tools. Let''s see how
    this translates to the frontend of your website.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Forms to solicit new members and retain the existing ones


    Having great administrative tools is wonderful, but we also want to be able to
    expose membership signup and renewal pages on our website in order to solicit
    new members and retain existing members. In CiviCRM, we do this through a contribution
    page.


    Contribution pages are used to solicit funds from site visitors. This may be for
    general donations, sponsorships, pledges, campaigns, or in our case, memberships.
    Begin by visiting the **Contributions | New Contribution** page.


    CiviCRM will walk you through a nine-step wizard to configure your page. We will
    not review all of the options available, but focus on the key elements pertinent
    to membership signup pages.


    In the first step of the wizard, you will see a **Contribution Type** field. Its
    use, for our purposes, can be a bit misleading. As you recall, when we defined
    membership types, we assigned a contribution type to each. When processing memberships
    through a contribution page, whatever contribution type was assigned to the membership
    type will be used for the respective transaction. However, you may construct your
    contribution page so that you collect memberships and also allow additional donations
    to be made. In this scenario, whatever contribution type you choose will be used
    for the additional non-membership contribution.


    Notice that there is an option that allows individuals to sign up on behalf of
    an organization. By default, CiviCRM will treat users interacting with your website
    as individual type contacts. After all, people use computers, and not organizations.
    However, if your membership categories are connected to organizations, you should
    select this option and indicate if the "on behalf of" functionality should be
    optional or required. Note that you may still collect information about the individual
    completing the form; the signup form will treat this individual as a related contact
    (employee) of the member organization.


    In the second step, you configure the options related to the payment, such as
    what processor to use, whether you want to allow the "pay-later" capability, and
    whether the user may contribute money beyond the membership fee. Consider this
    last option carefully—do you want your signup form to focus entirely on the membership
    options, or is your membership structure closely linked to a broader donation-solicitation
    effort?'
  merge: -1
  img_proc: true
- pgno: 349
  md: '> If the "pay-later" option is enabled, visitors will have the option of clicking
    a box to indicate intent to submit payment at a later date. After the form is
    submitted, their membership and corresponding contribution record will be marked
    as pending. When you receive the payment, simply update the contribution record
    – enter the payment method, details, and mark the status as complete. Doing so
    will also mark the membership as complete and set the join date to the date the
    payment was received.


    The third step is where you enable and configure membership signup capability.
    This single contribution page can be used for both membership signup and renewal
    forms, and consequently includes a title and description field for both purposes.
    The renewal title and description will only display if the user is logged into
    the website and CiviCRM recognizes an existing membership record. Otherwise, the
    membership join text is used.


    However, this does not mean that CiviCRM will always treat the membership record
    as a new one. If a non-authenticated user (someone who is not logged in to the
    site) completes this form in its membership join version, CiviCRM still attempts
    to match them with an existing record in the system. If it finds a match and the
    contact has an existing membership record, it will renew the record instead of
    creating a new one.


    Toward the bottom of this form, you determine which membership types will be available
    (you may choose to organize your membership types into multiple forms), whether
    membership signup is required, if the membership fee should be processed separately
    from other contributions received (if configured on the previous screen), and
    if membership fees should be visible.


    Note that the separate membership fee option is not available for Google Checkout
    and PayPal Standard payment processing, as they do not support multiple transactions
    in a single submission process. This option should be selected if you want the
    contribution associated with the membership and the additional contribution amount
    to be assigned different contribution types, as noted earlier. For example, you
    may want the membership fee to be processed as a Member Dues Contribution type,
    and any additional amount to be processed as a Donation Contribution type.


    The next step of the wizard provides options for configuring the Thank You screen
    and e-mail receipts your contact will receive. Step five configures the Tell-A-Friend
    feature, which is more common for fundraising campaigns than membership signups.
    If enabled, contacts completing the membership form will be encouraged to tell
    their friends about your organization using the suggested text that you provide.
    If you rely on word-of-mouth networking to get your message out, this feature
    may be useful to you.'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'In step six, you have the option of selecting up to two profiles for inclusion
    in the form. Recall that a profile is a collection of fields. By default, the
    membership signup form will only have one required field — the e-mail address.
    Most of the time, you will want to collect additional information about your members,
    such as their name, address, phone, and so on. You may first need to create a
    custom profile or edit one of the existing ones such as **Supporter Profile**
    or **Name and Address** at **Administer | Customize | CiviCRM Profile.**


    If you have come to this step and have not yet created your custom profile, don''t
    worry — you can proceed with the contribution page wizard and return at a later
    time to select your desired profile.


    > If you have enabled the option to allow individuals to sign up on behalf of
    an organization, any profile you assign to the form in this step can only be used
    for individual fields. The information collected for organizations is not configurable
    through the interface at this time.


    Premiums (step seven) are gifts that you offer to members if they contribute at
    a certain threshold. For example, you might advertise that a $50 donation will
    receive a travel umbrella with your organization''s logo. This is generally oriented
    toward donation pages rather than membership signup forms, but may still apply
    if you tier your memberships to encourage higher levels of giving with extra benefits.
    Before configuring this step you must have created a premium set (accessible through
    **Contributions | Premiums (Thank-you Gifts)** or **Administer | CiviContribute
    | Premiums (Thank-you Gifts)**).


    If your membership form is part of a larger campaign, you can create a thermometer-style
    widget in step eight to track contributions. For example, let''s say you initiated
    a member-get-a-member campaign seeking to raise $20,000 by the end of the year.
    After enabling and configuring your widget options, you add the code generated
    to your site homepage, encouraging people to join. Any members who join through
    this contribution page will have their fee added to the campaign total and reflected
    in the widget. This goal-oriented campaign model is more common for donation-based
    solicitation, but could still be creatively used for membership-based purposes.


    The final step in the wizard is for personal campaign pages, which also may be
    more relevant to non-membership contribution pages. A personal campaign page,
    or PCP, empowers your constituents (such as existing members) to solicit funds
    on behalf of your organization. In doing so, they receive a "soft credit" for
    their role in raising funds. Using the example from the widget discussion, you
    could go one step further and let each of your existing members create and customize
    their own membership promotion page to use for their correspondence with friends
    and colleagues.'
  merge: -1
  img_proc: true
- pgno: 351
  md: "> FPAGM is excited to offer online membership signup and renewal forms. They\
    \ look at this as an opportunity to streamline the member signup process such\
    \ that more businesses and organizations will be inclined to join.\n> \n> The\
    \ website administrator creates a membership contribution page focusing primarily\
    \ on the key configuration elements for membership. Since their **Regular** and\
    \ **Affiliate** membership types are organization-based, they choose to require\
    \ signup on behalf of an organization and only expose those two membership types.\
    \ At a later time, they will create another contribution page for the **Supporter**\
    \ membership type, which is geared more toward individual donations.\n> \n> While\
    \ membership is organization-based, they want to collect details regarding the\
    \ primary contact (individual) they will interface with at the business or organization.\
    \ Using an existing profile as a basis, they use the **Copy Profile** option and\
    \ adjust the fields to collect name, address, and other key details. After completing\
    \ the configuration, they test the page and enable it as a menu item on their\
    \ site.\n\n# Searching and reporting\n\nWe mentioned earlier the **Find Members**\
    \ tool on the **Membership** menu. Let's take a few moments to explore the options\
    \ available and review membership reports.\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_351_0.png)"
  merge: -1
  img_proc: true
- pgno: 352
  md: 'Most of the search options here are self-explanatory — you may search by a
    contact name or e-mail, membership types, and membership status. For these types
    and statuses, selecting multiple options is inclusive: the result will yield records
    matching any of the selections.


    Below the membership status field is a set of important options if you are making
    use of membership inheritance via relationships. Recall that you can configure
    a membership type to extend the membership to other contacts based on the selected
    relationship(s). If ACME Corp. is a member and the employer/employee relationship
    is selected for their membership type, all employees of the business will receive
    a membership record as well.


    While this functionality is useful, it may be confusing to understand how you
    calculate members. If ACME has three employees, a membership search would yield
    four results for this one membership record. That may be useful when you are sending
    out a broadcast e-mail and want all members to receive it, but if you are seeking
    to count the number of actual membership records that were purchased, your numbers
    will be inaccurate.


    The three options on this form help you control your search as it relates to membership
    inheritance. Do you want to view all the members, just the membership record owners
    (primary members), or just those who are members through inheritance?


    As one would expect, the three date fields associated with membership records
    are searchable as date ranges. With some creative thinking, these date range search
    fields can generate some powerful tools for understanding your membership. Consider
    the following examples:


    +   - You want to know who did not renew in the previous year (2010) for a membership
    type that has a fixed period of January 1 through December 31: Set the **End Date
    – From** and **End Date – To** fields to December 31, 2010. All members who joined
    or renewed in 2010, but did not renew for 2011 will be included.

    +   - You want a list of members who joined in the last few years: Set **Join
    Date – From** to January 1, 2008. Any join date occurring after that date will
    be provided in the result.

    +   - You want a list of members who joined sometime in 2006 to 2010, but did
    not renew in 2011: Set **Join Date – From** to January 1, 2006, and **End Date
    – To** to December 31, 2010.


    These example searches illustrate the benefits of the date structures in membership
    records.'
  merge: -1
  img_proc: true
