- pgno: 68
  md: 'Ideally, business processes are designed so that whenever the organization
    or one of its constituents is likely to initiate an interaction, the interaction
    is likely to be of value to both the parties. For example, the newsletters should
    be edited to provide useful and interesting information for their target audience
    within the constraints of available resources. By providing this information,
    the organization comes to be trusted in various ways associated with its mission,
    for example, spending wisely on deserving initiatives. This hopefully leads a
    large enough proportion of subscribers to deeper involvement with the organization,
    for example, attending one of its events or donating to one of its projects or
    programs. In return, the constituent benefits from the content of the event, and
    from feeling that they have helped support a worthy initiative.


    In many cases, constituent interests will not be aligned so neatly, but that should
    remain the ideal. For example, permission-based marketing tries to ensure that
    people do not receive e-mails, phone calls, or letters that they do not want.
    While unscrupulous marketers may spam and not respect do-not-call requests and
    lists, those that follow the best practices will find that there are efficiency
    gains: eliminating contacts from lists which are likely to be poor prospects increases
    the relative yield and lowers the marginal costs.


    # Warning


    Be very careful when deliberately designing processes that make it hard for constituents
    to do something they want to do, but the organization doesn''t want them to do.
    The processes which are designed to make it difficult for a constituent to get
    something from an organization (usually expensive, like staff time) need to make
    sense, given your business model. Voice-mail hell, and the damage it does to an
    organization''s brand and its ability to deliver to its constituents and partners
    in collaboration, is an example of a misguided or a poorly-executed effort to
    reduce the cost of providing information. In contrast, a purely online service,
    with online forums and contact forms that does not purport to offer phone support
    may better meet constituent expectations while providing "lower" service levels.
    If your organization is devoting large amounts of resources to activities that
    do not significantly advance its core mission, consider ways to leverage that
    activity to better achieve your mission, re-engineering it to require fewer resources,
    or even eliminating it. Rationing a service by making it hard to access is not
    the first alternative to consider, but one of the last.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_68_0.png)'
  merge: -1
  img_proc: true
