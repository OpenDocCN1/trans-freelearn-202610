    # Sending a bulk e-mail


    Now that we have set up a group to which we can send a mass e-mail and provided
    ways for site visitors to subscribe to our newsletter and other bulk e-mail subscriptions,
    it''s time to send a bulk e-mail with CiviMail to all the group members who have
    subscribed to it.


    The construction of a bulk e-mail message involves a five-step wizard in which
    you select the recipients, mailing options, develop content, preview/test, and
    then schedule the mailing. Before we work through those steps, let''s look at
    a few additional tools and options you may want to review and configure first.


    # Configuring the header and footer


    CiviCRM supports the creation of multiple headers and footers for insertion in
    your mailing. These can be used in conjunction with or in lieu of message templates.
    The footer, in particular, can be a very useful element in your mailing.


    In order to comply with the US CAN-SPAM Act, and in accordance with generally
    accepted mailing practices worldwide, every mail sent using CiviCRM must include
    two special mailing tokens: the domain address and the opt-out URL or e-mail token.
    We also recommend that you include the group-unsubscribe URL or e-mail token.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'It is important to understand the difference between opt-out and unsubscribe:
    opt-out means that the user has chosen to completely remove themselves from receiving
    all e-mails from your organization; unsubscribe means they choose to no longer
    receive a certain newsletter (they are removed from the associated group). If
    both links are included in your e-mail, be certain to craft the language carefully
    and accurately. Wherever possible, you will want to encourage people to simply
    unsubscribe from a certain list rather than completely opting out of all e-mails.
    If the latter is selected, you may be legally bound to respect the contact''s
    request.


    The footer comes into play by providing a useful way to collect these required
    tokens and make sure they are consistently inserted in your mail. We recommend
    constructing a single default footer that is generic enough in its layout to be
    used in conjunction with any template. The footer should generally include the
    organization''s name, domain address token, phone/e-mail/website, and opt-out/unsubscribe
    tokens.


    Optional elements mentioned earlier in the chapter are your organization''s tagline/mission,
    and perhaps a featured call to action that you change regularly. Note that the
    opt-out/unsubscribe tokens may be included as a URL link (which directs people
    to your website where they confirm the action) or as an e-mail address which is
    processed by the CiviMail EmailProcessor. script (see *Chapter 3, Installation,
    Configuration, and Maintenance* for more details). We recommend using the URL
    form unless there''s clear reason to do otherwise. By using the URL, you force
    people to visit your website before taking action, which provides an opportunity
    to remind them about who you are, what you do, and perhaps cause them to rethink
    their removal request.


    To construct and edit headers and footers, carry out the following steps:


    +   1. Click on either **Administer | CiviMail | Headers, Footers and Automated
    Messages** or **Mailings | Headers, Footers and Automated Messages**.

    +   2. Click on the **Edit** link on the right of the **Mailing Header** row (you
    could also click on **New Mailing Component** button).

    +   3. Customize the contents of the **Body – TEXT Format** and **Body – HTML
    Format** fields as appropriate, specifically including visual formatting for the
    latter.

    +   4. If you use a header/footer pair to layout your entire page, in the **Body
    – HTML Format** field for the header, include the `<html>`, `<head>`, `</head>`
    and `<body>` tags. Then close those tags (`</body>` and `</html>`) in the associated
    footer. Doing so will frame your e-mail in the appropriate HTML tags and will
    allow you to use the body region for your content.

    +   5. Consider defining `<style type="text/css" media="screen">` in the body
    to define inline CSS for formatting.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '+   6. To include an image in the e-mail, use an absolute path to a publicly
    accessible location, for example:

    +   ```

    +   td.footer {

