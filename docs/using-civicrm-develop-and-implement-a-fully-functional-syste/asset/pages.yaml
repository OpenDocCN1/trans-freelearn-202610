- pgno: 61
  md: '# Getting started


    At the beginning of a CRM project you''ll need to do some planning, whether this
    means creating a feature backlog for the discovery phase of an Agile process,
    pre-planning for an iterative process, or the initial work in the planning phase
    for a Waterfall process. What planning you should do and when you do it will vary
    depending on the process adopted for your CRM project, the general management
    practices for approving and analyzing projects in your organization, and possibly
    the requirements of external funders such as foundations and other grant-giving
    organizations.


    The following outline of preliminary activities includes some items that may not
    be required by less formal and less structured organizations. Even if, despite
    our advice to the contrary, you''re treating your CRM project as limited exclusively
    to the technical implementation of one or more CiviCRM components like online
    donation processing, we''d encourage you to review this section for ways to make
    it a success.


    While the list is arranged according to the general order it should be done, you
    should expect and plan for iteration. The later sections will expand on certain
    items, particularly the ones associated with requirements for specific components
    of CiviCRM, but it''s better to start at a broader, higher level.


    # Creating a baseline


    Assuming that improvements are desired, develop an inventory of the current state
    of customer relationship management in your organization:


    +   - Create a list of the main types of constituents that interact with your
    organization such as volunteers, donors, attendees, board members, staff members,
    website visitors, and so on.

    +   - For each type of constituent, list the important types of interactions that
    can occur with your organization.

    +   - Identify actionable metrics that measure the quantity and quality of relationships.
    Wherever possible, collect information for each metric or put in place ways of
    collecting the information in order to create a baseline of information about
    constituent relationships. Ideally, these metrics should provide meaningful ideas
    on what you should do. The trend revealed by the number of new twitter followers
    per week is better than the total number of twitter followers, since the former
    will help you perceive spikes more clearly that will help you identify effective
    message language or key influencers to reach out to.

    +   - Create a technical inventory of all systems that interact with constituents.
    At a more detailed level, perhaps in later phases, create a data dictionary of
    all tables, fields, and their meanings related to constituent information, transactions,
    and interactions.'
  merge: -1
  img_proc: true
