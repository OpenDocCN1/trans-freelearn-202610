- pgno: 400
  md: '# Interacting with Constituents: Managing Cases


    It''s likely that a number of your general activity types will apply to case records
    and there are a number of standard case management activity types that should
    be included with all cases (such as change case status). In addition to these,
    you will need to create any activity type that will be used specifically for one
    or more case types. Create these by visiting **Administer | Option Lists | Activity
    Types**.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_400_0.png)


    Note that if this activity is specific to cases and you do not want it visible
    and available as a standard activity, you should select **CiviCase** from the
    **Component** drop-down field.


    > Don''t forget that specific activity types may be extended through custom data.
    You may want to plan on collecting additional information when creating certain
    types of activities.


    Once these are defined in the system, you may add them to your configuration file.
    The full list will reside inside the `<ActivityTypes>` tag and each type will
    be inside its own `<ActivityType>` tag. Within that, you will add a `<name>` tag
    in which the exact name of the tag, as created in your system, will be placed.'
  merge: -1
  img_proc: true
- pgno: 401
  md: "As part of its Grant Application case type, FPAGM anticipates a number of activity\
    \ types unique to this case type. It creates the following activity types in the\
    \ system:\n\n+   - Initial Inquiry/Notification\n+   - Permission to Submit/Application\
    \ Received\n+   - Scope Definition\n+   - Internal Draft Submitted for Review\n\
    +   - Final Internal Approval\n+   - Grant Proposal Submitted\n+   - Denied/Case\
    \ Closed\n+   - Accepted\n+   - Thank You Letter\n+   - Report\n\nThe list of\
    \ case activity types, in conjunction with several general use activity types,\
    \ should accommodate the various steps or decision results in the grant application\
    \ process.\n\nEach type may have an optional <max_instances> value which limits\
    \ how many times the activity may be added to the case record:\n\n```\n<ActivityTypes>\n\
    \  <ActivityType>\n    <name>Open Case</name>\n    <max_instances>1</max_instances>\n\
    \  </ActivityType>\n  <ActivityType>\n    <name>Follow up</name>\n  </ActivityType>\n\
    \  <ActivityType>\n    <name>Change Case Type</name>\n  </ActivityType>\n```\n\
    \nNote that the Open Case activity type has a max_instance of one. This makes\
    \ sense as a case record can only be opened once, and thus this activity should\
    \ only be present once in a single case.\n\nWhen constructing your configuration\
    \ file, make every effort to retain the indentation structure as found in the\
    \ sample files and previous screenshot. Doing so will help you ensure that each\
    \ tag closes properly and you don't get lost in the structural hierarchy.\n\n\
    As you define your activity types, you may want to have your configuration file\
    \ open and ready for editing so that you can copy and paste the values from your\
    \ browser to the XML file or vice-versa and thus ensure that the values match\
    \ exactly."
  merge: -1
  img_proc: true
- pgno: 402
  md: 'After you have finished adding all activity types that apply to this case type,
    be sure to add a closing </ActivityTypes> tag in your XML file.


    The next configuration block is where you define your timeline(s). It is labeled
    ActivitySets in the configuration file. Before we construct it, let''s review
    exactly what a timeline is and what it does.


    The purpose of a timeline is to establish a series of activities that happen in
    a defined order and are targeted for a period of time relative to other activities
    (dependencies). In addition:


    +   - Timelines are optional. If your case type is primarily used for grouping
    activities and not to establish a defined workflow, you may not need to define
    a timeline beyond the initial Open Case activity.

    +   - Timelines may be implemented automatically when a case is opened or made
    available as an option that can be applied to an already open case. In the first
    scenario, the activities defined in the timeline are automatically added to the
    case when it is opened. In the latter, the option of adding the timeline is available
    within the Manage Case screen.

    +   - More than one timeline can be defined for a single case type. With the ability
    to make timelines optional and manually applied, this can allow for fairly complex
    workflow branching. For example, in our Grant Application use case, we could construct
    an initial timeline that takes us through the application process, and then create
    manually-applied timelines that address the workflow requirements based on our
    decision tree, whether the application is accepted, declined, or more information
    is required.

    +   - Timelines can be used for audit reporting. The concept of an audit report
    is to track the progress of case resolution against a defined standard. For example,
    if you''ve defined a certain step in the process that needs to be completed within
    five days, you may want to run analysis on actual completion dates to determine
    if that window is too short (case workers are chronically late completing the
    task) and make adjustments to the workflow.


    Let''s look at the construction of our XML configuration file and the options
    available to better understand how timelines work.


    The timelines will be grouped together inside the <ActivitySets> tag and each
    timeline will reside inside an <ActivitySet> tag (note the use of plurals and
    singulars to define the containing group and individual sets). Each set consists
    of the following tags:


    +   - <name>: Unique name for the timeline. This should not contain spaces or
    other special characters. For example, you can name your initial timeline as standard_timeline.'
  merge: -1
  img_proc: true
