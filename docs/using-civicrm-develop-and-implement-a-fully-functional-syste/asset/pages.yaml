- pgno: 197
  md: '# 5

    Collecting, Organizing, and Importing Data


    It’s all about the data, right? You can have the latest and greatest software
    tools available, perfectly customized to meet the needs of your organization;
    but if your data is incomplete, virtually non-existent, or just plain lousy, all
    of those wonderful tools will mean nothing.


    In the previous chapter, we walked through the ins and outs of the CiviCRM interface,
    understanding the different types of records that will be attached to contacts.
    However, how do we collect data, organize it, and import it into the system?


    In this chapter we will:


    +   - Create custom data fields to store data

    +   - Organize data fields in profiles for the purpose of creating online forms
    and other tools

    +   - Integrate profile forms with membership, event, and contribution pages

    +   - Update multiple contact records at once

    +   - Import contact records and activities from an external source


    # Custom data fields


    Out of the box (or more accurately, off the website), the fields included in CiviCRM
    to store your data are pretty basic. They include standard communication fields
    (phone, e-mail, website, and so on), address fields (street, city, state/province,
    country), demographics (gender, birth date, and so on), and a few additional miscellaneous
    fields.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Collecting, Organizing, and Importing Data


    Whether you are migrating from an existing database or starting from scratch,
    you will inevitably have additional data you need to store in fields. CiviCRM
    provides for this need through its custom data tools.


    Custom data consists of **groups** and **fields**. You first define a group and
    assign it to an existing data object; you then create fields within that group.


    By data object, we mean an existing type of record. Your custom fields will extend
    some type of record in your system, such as individual contacts, membership records,
    or groups. You configure what record type will be extended, along with any associated
    subtypes or options, when you create the custom data group.


    Let''s take a look at the custom data interface and walk through the creation
    of new custom fields to get a better sense of how this works. We can access custom
    data through **Administer | Customize | Custom Data.**


    Begin by clicking **Add Set of Custom Fields**. Enter a name for the group and
    select how it will be used (what record type it will extend). This is the most
    important step in the process — once you begin collecting data in these fields,
    you will not be able to change the type of data it is connected to. Many of the
    options available will provide additional sub-options. For example, if you create
    a custom data group attached to events, you may then specify one or more event
    types that the data set will be used for (select **-Any-** to expose the custom
    fields to all event types).


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_198_0.png)


    Let''s briefly review the uses available:


    +   - **Activities**: Available when creating or editing an activity record. You
    may further restrict its use to one or more activity types.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '+   - **Contacts**: Available to all contact types. Use the **Individual/Household/Organization**
    options if you wish the fields to only be available to a single contact type or
    subtype.

    +   - **Contributions**: Attached to contribution records and may be restricted
    to one or more contribution types.

    +   - **Events**: Available when creating an event and may be restricted to one
    or more event types. Note that this is used for tracking information *about* events,
    and not for collecting information from registrants. Use one of the participant
    options for registration data.

    +   - **Grants**: Available when working with a grant record.

    +   - **Groups**: Available when working with a group.

    +   - **Household**: Used with **Household** contact types and may be restricted
    to one or more **Household** subtypes if defined in the system.

    +   - **Individual**: Used with **Individual** contact types and may be restricted
    to one or more **Individual** subtypes if defined in the system.

    +   - **Memberships**: Attached to membership records and may be restricted to
    one or more membership types.

    +   - **Organization**: Used with organization contact types and may be restricted
    to one or more organization subtypes, if defined in the system.

    +   - **Participants**: Available to all participant (that is, registration) records.

    +   - **Participants (Event Name)**: Available to participant records for the
    event(s) selected.

    +   - **Participants (Event Type)**: Available to participant records for the
    event types selected.

    +   - **Participants (Role)**: Available to participant records for the roles
    selected.

    +   - **Pledges**: Attached to pledge records.

    +   - **Relationships**: Attached to relationship records and may be restricted
    to the relationship types selected.


    At the risk of being repetitive, we want to underscore the importance of thinking
    through exactly how your data will be used and where it should be attached before
    creating your custom data set. Once defined and in use, you cannot change the
    way the custom data group is used.


    > Note that you are not limited to one custom data set per used-by type. You may
    create as many custom data sets as you wish and may create multiple sets attached
    to the same record type for the purpose of organizing your fields into different
    tabs or inline collapsible sets.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'After naming your group and choosing how it will be used, you can set the order
    (helpful if you have multiple groups used for the same record type), add descriptive
    text before and after the fields, and choose from several configuration options.
    These include:


    +   - Whether the field set should be collapsed when the record is first opened,
    or expanded so that the fields are visible

    +   - Whether the field set should be collapsed when viewed in the advanced search
    or expanded by default

    +   - Whether the group is active


    If your group is attached to one of the contact record options (**Contacts**,
    **Individual**, **Household**, or **Organization**):


    +   - **Display Style**: The fields may be presented inline (**Inline**), appearing
    in the contact''s summary and edit screens, or in their own tab (**Tab**) in the
    contact record.

    +   - **Multiple records**: This is used for collecting multiple sets of records
    for a contact. By default, the fields you create will have a one-to-one relationship
    with the contact record. Selecting this option allows multiple records for the
    contact. This is helpful, for example, if you want to track education records
    for individuals where each record will have details about a single educational
    experience. A contact might have multiple records indicating their secondary school,
    undergraduate, and graduate education.


    > There are currently some limitations when using the multiple-record options,
    most notably that there is no way to expose those fields to website forms (profiles)
    without custom coding. Multiple-record sets must be displayed in a tab, not inline,
    and only the first of multiple records will be exported. In addition, be aware
    that once you flag a custom group for use with multiple records, you cannot undo
    that setting and change it back to a single-record structure. This is because
    you may have added multiple data records and CiviCRM would have no way of determining
    which of the multiple records should be retained as the single set of data.


    Save your custom data set and advance to the form for creating your first custom
    field associated with this set. You may return at any time to adjust the settings
    for your group or add/delete/modify settings for fields.'
  merge: -1
  img_proc: true
- pgno: 201
  md: <!-- no content -->
