  img_proc: true
- pgno: 50
  md: '+   - **Over-customizing, causing:**

    +     - The costs of the system to escalate

    +     - The best practices incorporated in the base functionality to be overridden
    in some cases

    +     - User forms to become overly complex

    +     - User experiences to become off-putting

    +   - **No strategy for dealing with the technical challenges associated with
    developing, extending, and/or integrating the CRM software system, leading to:**

    +     - Cost overruns

    +     - Poorly designed and built software

    +     - Poor user experiences

    +     - Incomplete or invalid data


    However, this does not mean that project failure is inevitable or common. These
    clearly identifiable causes of failure can be overcome through effective project
    planning.


    # Perfection is the enemy of the good


    CRM systems and their functional components such as fundraising, ticket sales,
    communication with subscribers and other stakeholders, membership management,
    and case management are essential for the core operations of most non-profits.
    This can lead to a legitimate fear of project failure when changing them. However,
    this fear can easily create a perfectionist mentality, where the project team
    attempts to overcompensate by creating too much oversight, too much contingency
    planning, and too much project discovery time in an effort to avoid missing any
    potentially useful feature that could be integrated into the project. While planning
    is good, perfection may not be good, since perfection is often the enemy of the
    good.


    CRM implementations risk erring on the side of what is known, somewhat tongue-in-cheek,
    as the MIT Approach. The MIT approach believes in, and attempts to design, construct,
    and deploy, the "Right Thing" right from the start. Its big-brain approach to
    problem solving leads to correctness, completeness, and consistency in the design.
    It values simplicity in the user interface over simplicity in the implementation
    design. The other end of the spectrum is captured with aphorisms like "Less is
    More," "KISS" (Keep it simple, stupid), and "Worse is Better". This alternate
    view willingly accepts deviations from correctness, completeness, and consistency
    in design in favor of general simplicity, or simplicity of implementation over
    simplicity of user interface. The reason that such counter-intuitive approaches
    to developing solutions have become respected and popular is the problems and
    failures that can result from trying to do it all perfectly from the start.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Neither end of the spectrum is healthier. Handcuffing the project to an unattainable
    standard of perfection, or over-simplifying in order to artificially reduce complexity
    will both lead to project failure.


    There is no perfect antidote to these two extremes. As a project manager it will
    be your responsibility to set the tone, determine priorities, and plan the implementation
    and development process. Although it is not a perspective on project management,
    one rule that will help achieve balance and move the project forward is "Release
    early, release often." This is commonly embraced in the open source community
    where collaboration is essential to success. This motto:


    +   - Captures the intent of catching errors earlier

    +   - Allows users to capture value from the system sooner

    +   - Allows users to better imagine and articulate what the software should do
    through ongoing use and interaction with a working system early in the process


    # Development methodologies


    Whatever approach your organization decides to take for developing and implementing
    its CRM strategy, it''s usually good to have an agreed upon process and methodology.
    Your processes define the steps to be taken as you implement the project. Your
    methodology defines the rules for the process, that is, the methods to be used
    throughout the course of the project. The spirit of the problem solving approaches
    just reviewed can be seen in the **Traditional Waterfall Development** model and
    in the contrasting **Iterative and Incremental Development** model.


    > Projects naturally change and evolve over time. You may find that you embrace
    one of these methodologies for initial implementation, and then migrate to a different
    method or mixed-method for maintenance and future development work. By no means
    should you feel restricted by the definitions provided, but rather adjust the
    principles to meet your changing needs throughout the course of the project. That
    being said, it''s important that your team understands the project rules at a
    given point in time, so that the project management principles are respected.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# The conventional Waterfall Development methodology


    The traditional Waterfall method of software development is sometimes thought
    of as "big design upfront". It employs a sequential approach to development, moving
    from needs analysis and requirements, to architectural and user experience, detailed
    design, implementation, integration, testing, deployment, and maintenance. The
    output of each step or phase flows downward, like water, to the next step in the
    process, as illustrated by the arrows in the following figure:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_52_0.png)


    The Waterfall model tends to be more formal, more planned, includes more documentation,
    and often has a stronger division of labor. This methodology benefits from having
    clear, linear, and progressive development steps in which each phase builds upon
    the previous one. However, it can suffer from inflexibility if used too rigidly.
    For example, if during the verification and quality assurance phase, you realize
    a significant functionality gap resulting from incorrect (or changing) specification
    requirements, then it may be difficult to interject those new needs into the process.
    The "release early, release often" iterative principle mentioned earlier can help
    overcome that inflexibility. If the overall process is kept tight and the development
    window short, you can justify delaying the new functionality or corrective specifications
    for the next release.


    # Iterative development methodology


    Iterative development models depart from this structure by breaking the work up
    into chunks that can be developed and delivered separately. The Waterfall process
    is used in each phase or segment of the project, but the overall project structure
    is not necessarily held to the same rigid process. As one moves farther away from
    the Waterfall approach, there is a greater emphasis on evaluating incrementally
    delivered pieces of the solution, and incorporating feedback on what has already
    been developed into the planning of future work, as illustrated in the loop in
    the following figure:'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_53_0.png)


    This methodology seeks to take what is good in the traditional Waterfall approach
    — structure, clearly-defined linear steps, a strong development/quality assurance/roll
    out process — and improve it through shorter development cycles that are centered
    on smaller segments of the overall project. Perhaps the biggest challenge in this
    model is the project management role, as it may result in many moving pieces that
    must be tightly coordinated in order to release the final working product.


    # Agile development methodology


    Agile development methodologies are an effective derivative of the iterative development
    model that moves one step further away from the Waterfall model. They are characterized
    by requirements and solutions evolving together, requiring work teams to be drawn
    from all the relevant parts of the organization. They organize themselves to work
    in rapid one to four-week iteration cycles. Agile centers on time-based release
    cycles, and in this way, differs from the other methodologies discussed, which
    are oriented more toward functionality-based releases.


    The following figure illustrates the implementation of an Agile methodology that
    highlights short daily Scrum status meetings, a product backlog containing features
    or user stories for each iteration, and a sprint backlog containing revisable
    and re-prioritizable work items for the team during the current iteration.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 金工实习安全操作规范培训


    金工实习是机械类专业学生必修的实践课程，安全操作是保证实习顺利进行的前提。本培训材料旨在帮助同学们了解金工实习中常见的安全隐患及应对措施，牢固树立安全意识。


    # 一、经典安全事故案例


    以下是实习过程中曾发生过的典型案例，希望能引起大家的高度警惕：


    +   1. **手套卷入事故**：某学生在操作车床时未严格遵守规程，戴手套进行旋转件加工，手套瞬间被卷入主轴，导致手指严重受伤。

    +   2. **铁屑飞溅伤人**：某学生在未佩戴护目镜的情况下进行铣削作业，高速飞出的铁屑击伤眼部，造成视力永久损伤。

    +   3. **触电事故**：某学生在检查电气设备时，因手部潮湿且未关闭电源，导致触电，幸得同学及时切断电源，避免更严重后果。

    +   4. **焊接灼伤**：某学生在进行电弧焊操作时未正确使用面罩，弧光灼伤面部，造成皮肤脱落。


    # 二、金工实习安全操作规程


    进入车间必须穿戴好规定的防护用品，严禁穿拖鞋、凉鞋、高跟鞋，女生必须戴好工作帽，长发不得外露。


    +   1. **防护用品穿戴规范**：必须穿工作服，袖口扎紧，戴好安全帽及护目镜。

    +   2. **设备检查与维护**：操作前检查设备防护装置、夹具及砂轮等是否完好，确认无误后方可操作。

    +   3. **规范操作流程**：严禁用手或棉纱直接清理铁屑，应使用专用工具；操作旋转机床时严禁戴手套。

    +   4. **用电安全**：电器发生故障时不得私自检修，应拉闸断电并报告指导老师。

    +   5. **防火安全**：易燃物品应远离热源，焊接区域周围不得放置易燃物，消防器材存放位置必须熟悉。

    +   6. **实习纪律**：实习期间严禁追逐打闹，不得擅离工作岗位，不得私自操作未经允许的设备。


    > > 安全无小事，责任重于山。多一点安全意识，少一分生命危险。'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'FPAGM envisions a community where no one suffers from hunger. Its mission is
    to provide cost-effective shared services to food pantries in the region. Operationally,
    FPAGM does the following:


    +   - Provides wholesale food pickup from business donors, storage at a depot,
    and regular delivery of needed supplies to pantries

    +   - Shares best practices amongst food pantries and food pantry donors

    +   - Begins assisting pantries in dealing with problematic individuals who abuse
    the system or staff

    +   - Represents the concerns of the pantries to local and state advocacy efforts,
    often by undertaking research and developing policy submissions


    The FPAGM Board of Directors consists of four officers and five members-at-large.
    Your boss, the Executive Director, oversees the work of five full-time staff.
    In addition, the organization receives regular volunteer support to assist with
    daily operations.


    As before, most staff resources are taken up with providing food distribution
    services for the pantries. Affiliate members and other food providers contact
    the FPAGM when they have surplus food available for pickup. The association owns
    three vans for transporting food from the providers to a warehouse attached to
    the FPAGM offices, and then distributing it to the pantries.


    The FPAGM staff also handles distribution. The pantries place requests for food
    and the costs (measured by weight) are tracked against their accounts.


    This system allows the pantries in the region to focus on providing food and services
    to clients, poor members of the community, without much need to identify food
    supply sources. The association also benefits from economies of scale, particularly
    with warehouse space, staff, and vehicles required to distribute food to the pantries.


    The association hosts two training events and an annual conference that draws
    attendees from the entire state who are involved in food pantry support.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Right-sizing the process


    It''s important to ensure that the process and methodology you adopt for your
    CRM initiative is appropriate to your organization''s culture and size, the complexity
    of its existing systems, and the scale of your CRM effort. This goal of "right-sizing"
    the process to fit your needs is essential, both for you as the project manager/decision
    maker, and for any consultants you engage in the process. Besides having familiarity
    with your methodology of choice, the project team (organization leaders, staff,
    and consultants) should understand and appreciate how you have right-sized the
    project. For example, if you represent a small organization with two to five staff
    members, a volunteer board and committee structure, and 3,000 contact records,
    building too much structure and process into your project will impede efficient
    progress rather than helping it. You need enough structure to make sure that the
    project is well-defined, well-managed, effectively tested, and implemented on
    time and within budget; but not so much structure that you spend all your time
    managing the methods instead of implementing a CRM.


    Other things being equal, larger, older, and more hierarchical, formal and bureaucratic
    organizations tend to need a more formal approach with more documents, more approvals,
    and so on. Smaller, newer, flatter, matrix-managed, and more flexible organizations
    will find it easier to move along the spectrum towards the Agile methods.


    Tiny organizations or initiatives may not need to iterate because the scope of
    work is too small. A project intending to replace a single existing CRM system
    with CiviCRM may find it better to proceed in a single product rollout to reduce
    the effort involved in running old and new systems in parallel. By contrast, replacing
    a number of separate siloed systems with CiviCRM can be grouped into one or more
    iterations for each system being replaced.


    Sometimes, it can be useful to pilot CiviCRM in an important, urgent, or easy
    area. You might want to reach for a low-hanging fruit by automating event registration
    for the first time. Another strategy would be to tackle the toughest area first,
    so that you don''t get half-way down a path of converting to a new CRM before
    you realize there are some aspects of your needs that will require more customization
    than originally envisioned. By tackling the elephant in the room first, you can
    reallocate resources to ensure your critical functionality areas are fully addressed.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Building the team


    A critical factor in the success of your CRM initiative will be deciding who is
    on your strategy and implementation team. The size of the team will obviously
    vary between organizations; those with three staff members will have to do things
    differently than those with 300. While this section is oriented towards larger
    organizations, the principles apply to any size.


    The implementation team includes the people who will play a direct role in the
    ongoing project development. Not everyone affected by the CRM initiative needs
    to be on this core team tasked with driving the strategy and implementation. A
    good working group seldom is larger than six to eight people, and very often,
    a smaller group can be more effective. What is most important is that this team
    should be representative of the different voices of the project – organization,
    leadership, end users, developers/implementers, important stakeholders, and so
    on.


    Usually, it is immediately clear that the involvement and cooperation of some
    individuals in the organization will be necessary for the success of the initiative.
    In addition, it is important to have a variety of people representing different
    roles on the team. The team members must bring the right mix of expertise and
    experience to the project, be willing to work together to effectively accomplish
    what needs to be done, and work in order to ensure that the perspectives and needs
    of all the affected parts of the organization are heard and weighed appropriately.
    If you have tight links to external stakeholders, involving them in your CRM strategy
    development and testing before roll-out can dramatically improve the success of
    your initiative.


    From a human resource perspective, a transformational initiative such as this
    one is a great opportunity to provide emerging leaders with a stretch assignment
    for their talent and ambition, experience in matters beyond their current job
    responsibilities, and exposure across the organization. The senior team members
    can evaluate and provide feedback to them as they stretch their wings.


    As representatives for the initiative inside and outside the organization, the
    team members are ideally placed with the goal to advocate and evangelize for their
    own sub-constituencies in support of the overall CRM vision. What do we mean by
    that? Each member of the team should represent a voice in your organization –
    management, front line staff, communication, accounting/bookkeeping, event coordination,
    advocacy, end user constituents, developers, different kinds of external stakeholders,
    and so on, each with their own expectations, goals, and concerns with the CRM
    implementation. The combined diversity of perspective is essential in order to
    achieve a well-balanced and effective team.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'You''ll need to judge whether people who are likely to be resistant to change,
    or to the initiative in general, should be brought into the tent early or late.
    Their opposition or reluctance may be due to their personality, a pattern of conflict
    with a team member, institutional factors such as loss of control of data or budget,
    or perceived criticism, as systems and work in their area of responsibility are
    targeted for improvement. Our experience is that it is usually better to bring
    them in early so that their voices can be heard and their concerns addressed during
    the implementation. Obtain their buy-in to the project early in order to reduce
    the likelihood of them poisoning the perception when it''s time for organization-wide
    adoption. This also makes it less likely that they will be taking pot-shots at
    the initiative from the sidelines, and will be unable to legitimately claim at
    their end that their concerns were not given due consideration. Acknowledge and
    incorporate as many positive aspects from the existing ways of doing things as
    possible and ensure that there is adequate opportunity for familiarization and
    training with the new system in order to encourage that buy-in. Skeptical voices
    are valuable when they help to provide a reality check on optimistic ambitions,
    but can become poisonous if they veer towards unreasonable negativity.


    The ideal team may include:


    +   - An executive or board sponsor of the initiative who is able to:

    +     - Articulate the vision

    +     - Allocate adequate resources

    +     - Resolve issues that may arise between departments

    +   - One or more key functional managers with the following functions:

    +     - Communication, including newsletters

    +     - Events, which may include different parts of the organization such as
    those responsible for annual conferences, educational programs, outreach events,
    a speaker''s bureau, and fundraising dinners

    +     - Volunteering recruitment and management

    +     - Case management including intake, assignment, and follow-through

    +     - Membership management

    +   - One or more key staff users, especially administrative staff, who operate
    the existing system(s) and know how normal transactions and exceptions are actually
    handled. It includes individuals with deep institutional knowledge about how and
    why the processes and workflows developed will be particularly helpful.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '+   - Technical expertise, in-house and/or consultant, covering:

    +     - CiviCRM

    +     - Your CMS, either Drupal or Joomla!

    +     - Software systems to be integrated into CiviCRM, if any

    +     - Legacy software systems to be replaced by CiviCRM, if any

    +   - External stakeholders, especially when their stake in your organization''s
    success is significant.


    > Your Executive Director at FPAGM, Mojan Ahmed, undertook a systematic review
    of the organization and its processes, three months into her tenure. The six-month
    exercise has included the board of directors, staff, key players from the food
    pantries (also known as food banks), food donors, volunteers, staff from local
    politicians'' offices, and a bureaucrat from the city. A key outcome of the review
    was the decision to invest in a new information system. Her judicious selection
    of stakeholder representatives has resulted in early assurances that the city
    government and a local philanthropic foundation will provide grants that will
    cover the anticipated cost of the CRM implementation and associated training together.


    While not necessary on the core team, it can be quite useful to involve representative
    users at various points in the process:


    +   - For feedback on the existing system, and how it could be improved

    +   - For feedback on the design of the new system

    +   - As testers of the user experience

    +   - As testers of functionality in the system


    Factors to consider while selecting users is to ensure that there is:


    +   - Good coverage of the functionality in the system by selecting users who
    play diverse roles, such as:

    +     - General public

    +     - Members of the organization

    +     - Events administrator

    +     - Volunteer

    +   - Testing by users with different levels of technical sophistication and appropriate
    interfaces as expected by their role:

    +     - Techno-phobes'
