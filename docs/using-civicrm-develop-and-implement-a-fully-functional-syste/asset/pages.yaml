- pgno: 83
  md: 'Increases in load from more concurrent users can be handled by shifting to
    a dedicated server, moving the database instance to a different server, changing
    the frontend to a cluster of web servers, and upgrading the database server. Adding
    a fail-over slave database server can assist in improving performance as well,
    as reads can be made against the slave while writes are sent to the master. Scenarios
    with heavy report processing are likely to benefit significantly from this topology.


    As the number of contacts in the database goes from thousands to hundreds of thousands,
    CiviCRM''s MySQL database instance will require significantly greater resources
    in terms of CPU and RAM. Moving it to a different VPS or server than the web server
    is advisable.


    Cloud computing technologies and techniques are becoming more pervasive in commercial
    web hosting and in-house hosting. It''s becoming quite easy and common to run
    CiviCRM on a virtual machine image that can be reconfigured easily and quickly
    to reboot within minutes with a different number of processor cores and different
    memory allocations. This can be particularly cost effective when your organization
    faces large changes in usage, for example, during an election campaign.


    The **Payment Card Industry Data Security Standard** also recognizes that moving
    mail services and database services off a web server is a good idea for security
    as well as performance.


    # # Implementation plan


    After conducting interviews and soliciting input through surveys and other means
    with key users and stakeholders you should be in a good position to develop a
    phased implementation plan that schedules the delivery of chunks of functionality
    over the life of the CRM initiative. Depending on your process and methodology,
    you might start working on some easy low-hanging fruit with users in one area
    while the scope and requirements in other areas remain vaguely stated in a one-page
    plan. Alternatively, you might choose to have a multi-year plan with significant
    specifications for all phases in a set of documents.


    In any case, your organization should recognize that its CRM initiative is not
    just a technology project. For each segment of constituents, the CRM plan should
    have a strategy targeting the number of constituents involved, the level of their
    involvement, the quality of their experience in the organization, and a clear
    sense of how this will help achieve the mission of your organization. Ideally
    it will specify 10 to 15 metrics that will be used to measure how well the initiative
    assists in realizing the organization''s objectives.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'As part of this process, the organizational structure should be examined and
    possible organization restructuring plans and processes considered. The engagement
    strategy for each segment of the constituents will be translated into work processes
    for Communications, Membership, Events, Fundraising, Volunteer Organizing, Grant
    Management, and Case Management. Where processes are automated, use cases will
    ensure that strategic objectives of the organization are kept in focus as user
    experiences are optimized.


    The people side of the project should ensure that staff and volunteers are communicated
    with effectively in light of your organization''s culture. Engagement and involvement
    mechanisms should be used to address inevitable fear, uncertainty and doubt, and
    assist with initial and on-going matters of motivation. Where job responsibilities
    change and people need to begin using new systems like CiviCRM, appropriate initial
    training and ongoing reinforcement training should be planned. Your goal over
    time should be to encourage consistent use of the most essential areas of the
    system, and progressive growth with the more advanced and scenario-specific needs.


    The technology side of the project will include more or less formal plans covering:


    +   - Installation

    +   - Configuration

    +   - Customization

    +   - Data migration

    +   - Graphic design

    +   - Theming

    +   - Testing

    +   - Deployment

    +   - Verification of the new system


    The deployment plans may involve a phased rollout of new features or a big bang
    introduction to the new way of doing things. Particularly in the case of financial
    systems, consideration should be given to operating the old and new systems in
    parallel for a reporting period or two in order to make sure that the new system
    is operating correctly, and to determine the ways in which old and new reports
    differ in terms of the data they present.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Summary


    This chapter outlines how to create a successful CiviCRM implementation project.


    It lists common barriers to the success of CRM initiatives that arise because
    of either people issues in an organization or technical issues getting systems
    and tools supporting disparate business functions that provide integrated functionality.


    We advocate a pragmatic approach to implementing a CRM strategy for your organization.
    We encourage the adoption of a change in approach and associated processes and
    methodologies that works for your organization: wide ranges in the level of structure,
    formality, and planning all work in different organizations. Your implementation
    plan should include a schedule and a realistic budget including ongoing costs.


    Choosing the right people for your team is crucial to the success of the endeavor.
    Ideally you''ll include an executive or board sponsor, one or more key functional
    managers, one or more key staff users, and appropriate technical expertise for
    your team, all with good personal effectiveness and an ability to get along.


    Start your planning by segmenting your constituents into groups, listing the important
    interactions each group has with your organization, and identifying actionable
    metrics that measure those interactions. Create an inventory of existing systems
    involved in these interactions and their data. Develop a shared CRM vision for
    the organization, and then articulate how it would be translated into the user
    experiences at various levels in the funnel(s) of prospects for high-value constituents.


    For requirements, iterate between a broad and tight focus. Use existing systems
    and paper forms to solicit feedback in interviews from executive, management,
    and staff perspectives. User surveys also provide good quantitative results.


    In each functional area, list the known pain points, important new functionality,
    deadwood or cruft to be eliminated, and possible quick wins. Recurrent and important
    functional requirements include custom fields, organizationally specific groups
    for mailing lists and access control, fields required for forms in different processes,
    user permissions, and custom activities and workflows. Take time to brainstorm
    how to be more efficient in internal processes and accomplish your mission in
    new ways.


    In our next chapter, we''ll start getting our hands dirty with technical matters
    on installation and maintenance of CiviCRM.'
  merge: -1
  img_proc: true
- pgno: 86
  md: <!-- no content -->
  merge: -1
