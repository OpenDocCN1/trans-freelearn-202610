- pgno: 262
  md: '> Puzzled why the URL and e-mail constructed by the opt-out tokens appear as
    long, seemingly meaningless values? When CiviCRM generates the e-mails, it assigns
    a unique value to the opt-out tokens. This provides a connection back to the e-mail
    and contact record if the user chooses to opt-out.


    +   12. If you plan to use the layout/structure or content of this e-mail for
    future communications, you may save it as a new template. If the e-mail was based
    on an existing template, you may update it by clicking the appropriate option.
    This step in the wizard is also where you select your header/footer and any attachments.

    +   13. Click on **Next**.

    +   14. It is highly recommended that you always send a **Test Mailing** and carefully
    review it before mass mailing. A test can be sent to a single address or to a
    predefined group. For example, you may want to create an e-mail test group of
    people who will regularly review e-mails before they are sent out. It is especially
    useful to check the message when new or changed bulk e-mail formatting is first
    used. These checks should include viewing the message in both HTML and text as
    it comes directly from CiviMail in a variety of e-mail clients and browser-based
    e-mail services (for example, Outlook, Gmail, Hotmail, and so on), as well as
    after it has been forwarded.

    +   15. Enter your e-mail in the **Send to This Address** field and/or select
    an appropriate test group from the **Send to this Group** list.

    +   16. Click on **Send a Test Mailing**.

    +   17. When you are satisfied with the test mailing, click on **Next**.

    +   18. Select to send either immediately or schedule the mailing to go out at
    a later date/time. In both cases, a cron job must run for the mail to be sent.

    +   19. Note that you must unselect **Send** immediately for the scheduled mailing
    time to be noticed.

    +   20. Click on **Submit Mailing**.


    At this point, the mailing enters the CiviMail queue. It won''t actually be sent
    until the mailing script (`civicmail.cronjob.php`) is run. Normally, this will
    be set up as a cron job on your server and scheduled to poll the queue at regular
    intervals and start mailings. Understand that it will take time for the mailing
    to be processed. Initially, there will be a delay as the mailing won''t begin
    until the next cron job is run. Thereafter CiviCRM will process the mailings as
    fast as your hosting environment and resources permit.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Managing mailings in process


    After initiating a mailing, you can monitor its status by doing the following:


    +   1. Click on **Mailings | Scheduled and Sent Mailings**.

    +   2. Click on the **Report** link to the right of the row for the mailing of
    interest.


    You can cancel or delete a mailing that is in the process of being delivered by
    doing the following:


    +   1. Click on **Mailings | Scheduled and Sent Mailings**.

    +   2. Click on the **- more -** link to the right of the row for the mailing
    of interest, and click on either **Cancel** or **Delete**.

    +   3. Cancelling will stop further sending. There is no ability to recall e-mails
    already sent out; it simply halts the mailing process at the time when you cancel
    it.

    +   4. Deleting stops further sending and removes existing data about the mailing
    from CiviCRM.


    As soon as the actual mailing process initiates, you can begin to review the mailing
    report. It will periodically get updated with new information as the mailing proceeds.
    The metrics for click-opens and click-throughs will generally change for several
    days after a mailing is sent. Constituents may receive the e-mail, take note of
    it, but may not follow up by clicking on links inside it for a few days after
    receiving it.


    The report itself provides a snapshot of the key metrics and details of the mailing.
    This includes the number of successful deliveries, bounces, click-opens, click-throughs
    (including a list of each link and whether it was a unique click), and links to
    the list of contacts to whom the mailing was sent. It also provides a copy of
    the message and record of the mailing options you chose.'
  merge: -1
  img_proc: true
