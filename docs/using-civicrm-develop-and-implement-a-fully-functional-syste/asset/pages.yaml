- pgno: 44
  md: '# Documentation


    Extensive administrator, user, and developer documentation available at http://wiki.civicrm.org
    is updated for each version of CiviCRM before it is released. In addition, *Understanding
    CiviCRM: A Comprehensive Guide* is available for free at http://en.flossmanuals.net/civicrm.
    Often when an issue arises, others have tried to tackle the same challenge, and
    a record of how they were helped to solve their issue can be found by searching
    in the community forums at http://forum.civicrm.org.


    # Responsive community support


    One of the challenges faced by users of some open source software compared to
    proprietary software has been the difficulty of assuring that support will be
    available when needed. In addition to the paid support offerings from numerous
    professional CiviCRM consultants mentioned previously, the CiviCRM community and
    core team are renowned for their quick and generous replies to questions in the
    forums. For those developing in CiviCRM, there is also a #civicrm irc channel
    on http://freenode.net, where one can usually find the core team and other knowledgeable
    community members responding to more challenging inquiries.


    # How CiviCRM will help your organization


    Good CRM implementations facilitate better outcomes and improved relationships
    with your constituents shown by, for example, more donations and volunteer time.
    They also improve staff efficiency and automate workflows, reducing the average
    cost and time involved in interactions with the constituents. This allows you
    and your organization to do more. CiviCRM will improve the relationship your constituents
    have with your organization through various features, including:


    +   - Easier online event registration

    +   - Self-serve membership renewal

    +   - More complete record of history of interactions available to the entire
    qualified staff

    +   - Automated workflow improvements for case management

    +   - Personalized e-mails

    +   - Anti-spam options to ensure all e-mail communications are permission-based'
  merge: -1
