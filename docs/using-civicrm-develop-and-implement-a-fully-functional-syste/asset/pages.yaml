    \ If you are still having trouble, visit the CiviCRM upgrade forum at http://forum.civicrm.org/index.php/board,8.0.html.\n\
    \nAfter you have finished your upgrade, you should consider whether you need to\
    \ enable any new components or configure any new CiviCRM permissions."
