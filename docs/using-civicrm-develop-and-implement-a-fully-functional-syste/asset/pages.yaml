- pgno: 249
  md: '+   3. Select **Mailing Labels** on the **- actions -** button.

    +   4. Click on the **Go** button, and then configure mailing label options as
    follows.

    +   5. Beside **Select Label**, choose the Avery label type that you will be printing
    on (typically indicated on the packaging). If you are not using an Avery product,
    look for an indication showing which Avery number the labels are compatible with,
    as many companies use the same dimensions. You can also look up the dimensions
    for the available labels on the Avery site for your country (for example, http://www.avery.com
    site does not list the A4-sized products that begin with L, and http://www.avery.fr
    does not list the North American 8.5 x 11 ones).

    +   6. Choose the mailing **Location** for each contact. Every contact must have
    one of its addresses marked as **Primary**.

    +   7. Choose whether you want to remove contacts with the "Do Not Mail" communication
    preference selected.

    +   8. Depending on how you have decided to enter and store your data in CiviCRM,
    you may want to reduce postage charges either by choosing to merge labels for
    contacts belonging to the same household, or by choosing to merge labels for all
    contacts with the same address (a common need for organizations that do not use
    **Household** contacts).

    +   9. Click on **Make Mailing Labels** and save the resulting PDF download file
    to your hard drive.

    +   10. Print the file. If you have a big printout, you might want to initially
    print only one page to check the alignment of the text with the labels.


    # Recording a postal mailing


    Normally, when you print a list of mailing labels, you''re about to communicate
    with those contacts. The process of generating mailing labels does not automatically
    record the fact that you will be using it for a mailing. As a best practice, we
    recommend creating an activity for your mailing recipients after generating mailing
    labels as an effective way to retain a history of communication. The default installation
    of CiviCRM does not include an activity type appropriate to postal mailings, so
    the first step is to create such a type. Here are the steps to record mailings
    at the same time mailing labels are printed:


    +   1. Create a Postal Mailing Activity:

    +      - Click on Administer | Option Lists | Activity Types

    +      - Click on Add Activity Type

    +      - Enter a suitable **Label**, such as **Postal Mailing**

    +      - Enter a suitable **Description**, such as **Postal Mailing**'
  merge: -1
  img_proc: true
- pgno: 250
  md: '+   - Select **Contact** as the **Component**

    +   - Click on the **Save** button


    2. Record a **Postal Mailing** activity for each contact included:


    +   - Find the contacts using exactly the same method and criteria as used to
    creating the mailing labels. If you have just run the mailing labels, you can
    click on the **Cancel** button or **Search Results** from the breadcrumbs to immediately
    return to your result list and perform a follow up action.

    +   - Select the **Record Activity for Contacts** on the **– actions –** button.

    +   - Select **Postal Mailing** as the **Activity Type**.

    +   - Enter a name for the mailing in the **Subject** field, perhaps also a description
    in the **Details** field.

    +   - Open the **Attachments** fieldset, and **Browse** to upload the file(s)
    you mailed, such as a Word document letter.

    +   - If appropriate, open the **Schedule Follow-up** fieldset and enter a follow-up
    activity, like a phone call in 10 days.


    # Printing a PDF letter


    Most organizations will be familiar with the idea of a merge letter. Rather than
    creating a generic letter addressed to "Dear Supporter," you want a personalized
    greeting that includes the individual''s first name, such as "Dear Sofia".


    Sending a letter with a personalized greeting and other personalized content inside
    an envelope with the correct address on it is no small challenge when hundreds
    or thousands are being produced. Large direct mail houses will often have special
    machines that print a personalized letter and its personalized envelope at the
    same time, and then insert the included content and seal the envelope, all within
    a strictly defined workflow that eliminates the possibility of mismatched elements.
    Small organizations may have envelope stuffing "parties" where letters are folded,
    address labels are applied, the folded letters are stuffed in the envelopes, perhaps
    a reply envelope or postcard, and the package is sealed and mailed. With all of
    that activity going on, it''s all too easy for a single envelope or letter to
    get missed or mismatched unless there''s lots of checking going on.


    An easier way to handle things that are less prone to mix-ups is to use window
    envelopes. The letter is laid out and folded in such a way that the mailing address
    is displayed through the window.'
  merge: -1
  img_proc: true
