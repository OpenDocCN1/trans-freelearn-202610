- pgno: 393
  md: '# 10

    Interacting with Constituents:

    Managing Cases


    We now come to a chapter which may not appear at first glance to apply to many
    not-for-profit organizations. The concept of "case management" is often used with
    reference to human service agencies such as those within the health care industry.
    That is, in fact, where the original functionality of CiviCRM''s case tools was
    born.


    However, the concept of case management extends to many other industries and organizations
    as well. In essence, it is the management of a multi-step process surrounding
    a single theme, issue, or project.


    In this chapter we will:


    +   - Thinking through your case management system

    +   - Configuring cases

    +   - Tracking, managing, and resolving cases


    Even if you do not initially think CiviCRM''s case management tools are something
    you would need to use in your organization, consider reviewing this chapter to
    better understand the core concepts and potential use cases. You may be surprised
    by the possibilities case tools offer.'
  merge: -1
  img_proc: true
- pgno: 394
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 395
  md: 'The two tools are very similar. In fact, the primary make-up of a case record
    is the ongoing series of case activities. However, while a contact''s basic list
    of activities will grow and be created from multiple sources (both manually created
    activities and auto-generated ones), the case record will help manage multiple
    pieces of communication surrounding a common topic by grouping them together.
    In this sense, think of a case as an upgraded activity.


    Cases don''t replace activities. You will still have periodic general communications
    to and from constituents that you track as activities directly on their contact
    record. However, if your relationship with a constituent surrounding a single
    issue, problem, project, or other matter begins to involve multiple steps, multiple
    pieces of communication, or multiple people in distinct roles, then it''s time
    to upgrade to a case.


    # Making it real


    If you''re still struggling to see the potential application to your organization,
    consider the following use cases:


    +   - **Human services/service delivery**: This is where the case tools were first
    born, and is the most obvious application. If you interact with constituents by
    helping them resolve issues (as a counselor, consultant, or advocate) or providing
    direct support to them (onsite care, delivery services, transportation, and so
    on), you may manage these service and support requests/tickets with a case.

    +   - **Membership/affiliation processes**: If your membership or affiliation
    application process involves multiple steps in which the applicant must complete
    forms and interviews, provide supporting documentation, and go through a formal
    approval process, you could manage those steps in a case. While the case record
    won''t directly connect to the membership records, the process and record-keeping
    involved with the application and approval could be handled here.

    +   - **Donor courting**: While low-end donors may simply have a one-touch relationship
    with your organization through a contribution page, high-end donors typically
    involve a longer "courting" process where key leaders in the organization will
    meet the donor, discuss specific needs, and perhaps negotiate the recognition
    that will be received for donation or sponsorship. The ongoing communication surrounding
    a specific donation or sponsorship solicitation could be grouped in a case record.

    +   - **Grant application**: CiviCRM''s built-in grant tools are geared toward
    organizations disseminating grants and managing communication with grantees. However,
    if your organization regularly *applies* for grants, you could construct a case
    type to manage that process, including grant writing, internal review, application
    submission, response, report tracking, and payment schedule.'
  merge: -1
  img_proc: true
- pgno: 396
  md: 'These examples are just a few ways in which CiviCRM''s case management tools
    are currently being used and may stimulate your thinking to find ways in which
    it could be used in your organization.


    However, are there times when a case record should not be used? Perhaps a better
    question to ask is, what are some potential drawbacks to using case tools over
    simple activity records or other tools?


    While considering the use of cases, one should understand that it does add a process
    layer to the record. That is, of course, the whole point of the tool. That extra
    layer means the individual activities – your records of communication and interaction
    surrounding an issue – are one step removed from the contact record. If I visit
    John Doe''s record, I will need to first enter the relevant case record to see
    those activities.


    CiviCRM provides some excellent tools for exposing case details and activities
    to the system dashboard, so it''s not as though the information and data is buried.
    However, you are adding a layer of "middle management", and if the volume and
    nature of your record keeping doesn''t warrant it, it may be more cumbersome than
    helpful.


    # Configuring cases


    At this point, you should have a good idea where you want to go with the case
    management tools and be ready to begin the configuration process. As alluded to
    earlier, CiviCRM''s case configuration is more involved (and a bit more complicated)
    than other components. This is because each case type is highly customized to
    the types of activities, workflows, and roles involved in the resolution process.
    That customization, and the flexibility CiviCRM provides, adds a level of complication.


    Your first step will be to define a case type and construct a corresponding configuration
    file specific to that type. Each case type will have its own configuration file,
    distinct from all others.


    Define your case type by going to **Administer** | **CiviCase** | **Case Types**.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_397_0.png)


    Take careful note of the Label you are giving to the case type. You will need
    to match it exactly while constructing the configuration file.


    > FPAGM periodically applies for grants to assist with capital purchases, training
    programs, or direct support for food pantries in the area. The Association decides
    to formalize the application and grant tracking process internally by using CiviCRM''s
    case management tools. While they could have re-labeled the CiviGrant tool to
    reflect the grant application requirements (instead of its normal grant-dissemination
    orientation), their workflow needs and multi-step processes were better handled
    through CiviCase.

    > They begin by constructing a Grant Application case type that collects all communication
    and other activity records surrounding the grant process.


    You may have noticed two other menu options when you navigated to the Administer
    | CiviCase menu: Case Statuses and Redaction Rules. Your case record will always
    have a status assigned to it. By default, CiviCRM ships with three statuses preconfigured:
    Ongoing (that is, open), Urgent, and Resolved (that is, closed). If you require
    additional statuses for your workflows, you can create them here.


    A redaction is a correction or alteration to data. Redaction rules will match
    and replace text in a way similar to the system-wide word replacement tool at
    Administer | Option Lists | Word Replacements. The differences are that these
    redactions will only happen within the context of cases and the match definition
    may be constructed using regular expressions.'
  merge: -1
  img_proc: true
