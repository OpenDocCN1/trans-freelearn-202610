- pgno: 63
  md: '# # Developing the vision


    Develop a shared vision for the desired state of your CRM and its place in your
    organization:


    +   - The vision can be the basis of planning goals and metrics for measuring
    success.

    +   - During this work, focus on the mission of the organization, and how it is
    realized through relationships with constituents.

    +   - List CRM functionality and features that helped motivate the project, for
    example, online events registration, including payments.

    +   - List possible ways of overcoming current pain points, for example, data
    silos between staff or departments.

    +   - Focus on the user experience of your organization in the typical interactions
    that your constituents have with you. Alternate between big picture identification
    and examination of constituent segments (either analytically through data analysis
    or anecdotally through staff and expert exposition), and close up details of specific
    users and incidents.

    +   - Pay attention to the funnel(s) of prospects for high-value types of constituents.
    Depending on your organization and mission, these may be volunteers, activists,
    donors, new members, or others such as the public your organization is trying
    to educate about something. Clarify the steps on the ladder of engagement for
    these types of constituents (for example, website visitor, newsletter subscriber,
    online activist, event attendee, donor, in person volunteer, or board member),
    and the value proposition at each step. Consider new business activities such
    as creating a free monthly newsletter to acquire prospects, or premium members-only
    pre-event meet and greet gatherings to help with volunteer recruitment.

    +   - Put specific energy into brainstorming:

    +     - Ways to reduce time-consuming and repetitive tasks of staff and volunteers,
    for example, making more processes self-serve online

    +     - Eliminating some tasks altogether if they do not adequately help the organization
    to realize its mission

    +     - Imagining new ways to accomplish your mission, for example, beginning
    to use viral marketing and social media

    +     - Optimizing business processes for external experience, internal efficiency,
    and general usefulness before automating them

    +   - You may want to consider articulating the desired goals and metrics using
    SMART (Specific, Measurable, Attainable, Relevant, Time-bound) project management
    criteria for more controlling and formal organizations or DUMB ones (Doable, Understandable,
    Manageable, Beneficial) for less management-heavy ones (visit http://en.wikipedia.org/wiki/SMART_criteria).'
  merge: -1
  img_proc: true
- pgno: 64
