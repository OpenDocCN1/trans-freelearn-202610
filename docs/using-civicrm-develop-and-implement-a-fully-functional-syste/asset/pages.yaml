- pgno: 43
  md: 'Over 2,000 new posts appeared on the forum per month in 2010, continuing the
    gradual growth of previous years for this metric.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_43_0.png)


    This relevant new content supported a steady and larger growth in page views,
