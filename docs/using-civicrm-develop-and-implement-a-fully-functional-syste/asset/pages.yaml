- pgno: 141
  md: '# Moving an installation to a new server


    If you are planning to move your website to a new hosting environment or from
    a development server to a live server, you will need to follow several steps in
    order to ensure that CiviCRM is configured properly in the new environment. The
    following content represents the key issues to consider and address when moving
    your site; a full discussion of steps to move a site can be found online: http://wiki.civicrm.org/confluence/display/CRMDOC/Moving+an+Existing+Installation+to+a+New+Server+or+Location.


    After transferring your site''s files and database to the new location, you must
    update several files to reflect the changes. CiviCRM references the root directory
    for your files and the full URL for the site in several locations. Follow these
    steps:


    +   1. Modify civicrm.settings.php with the new directory and URL locations. In
    Drupal installations, this is most often found at /sites/default/civicrm.settings.php.
    Joomla! maintains two versions of this file, both of which must be updated (and
    which have slightly different references). You can find them at: /administrator/components/com_civicrm/civicrm.settings.php
    and /components/com_civicrm/civicrm_settings.php.

    +   2. Delete the cached template files which will be found at:

    +      - Drupal: <drupal-root>/sites/default/files/civicrm/templates_c/*

    +      - Joomla!: <joomla-root>/media/civicrm/templates_c/*

    +   3. Log in to your site as an administrator and reset the base URL and resource
    directory configured in your system. For Drupal installations, browse to http://<drupal_site>/index.php?q=civicrm/admin/setting/updateConfigBackend&reset=1.
    For Joomla! installations, browse to http://<joomla_site>/administrator/index2.php?option=com_civicrm&task=civicrm/admin/setting/updateConfigBackend&reset=1.

    +   4. Joomla! installations must also manually alter /administrator/components/com_civicrm/civicrm/civicrm.config.php
    to correctly reference the location of civicrm.settings.php in the administrator
    folder.

    +   5. Rebuild the CiviCRM menus, which may include full URLs and must now reflect
    the new location:

    +      - Drupal: http://<drupal_site>/index.php?q=civicrm/menu/rebuild&reset=1

    +      - Joomla!: http://<joomla_site>/administrator/index2.php?option=com_civicrm&task=civicrm/menu/rebuild&reset=1'
  merge: -1
  img_proc: true
- pgno: 142
  md: '+   6. If any of the resources in your site reference the full URL or file
    location, you may need to update these (for example, if your Drupal navigation
    menu has links to profiles).


    +   7. If you are using override directories (`PHP` or `.tpl`), you will need
    to reset them to reflect the new file location. Go to **Administer CiviCRM | Configure
    | Global Settings | Directories**. Also visit the **Resource URLs** configuration
    page to confirm that the values are set correctly.


    After completing the move, be sure to test the site! Click through CiviCRM and
    confirm that the pages load as expected, and the URL remains on your new site
    (if any outdated links exist, it may send you to your old domain or subdirectory).


    # System maintenance


    As with any database system, there will be ongoing maintenance steps that should
    be performed on a periodic basis. Our focus in this section will be on basic maintenance
    steps specific to CiviCRM. It is outside the scope of this chapter to address
    the broader topic of server and MySQL database maintenance. Depending on the size
    of your database and whether you are using a managed hosting service, you should
    be aware of basic maintenance steps with your database and hosting environment.
    Also, we will not address scalability-related issues and maintenance. However,
    as your system grows, you should be aware of the impact on your MySQL database
    performance and size.


    The most important maintenance step with your system is to keep it updated to
    the latest revision, and not fall too far behind in major version upgrades. As
    the steps for doing that have been addressed earlier in this chapter, we won''t
    go into detail here; we repeat it only because of its importance:


    +   - Revision releases may contain security-related patches which are critical
    for maintaining a secure and safe database.


    +   - Revision releases may contain bug-fix patches which are critical for maintaining
    a stable and fully operational system.


    +   - Major version releases contain new features and functionality. If the new
    features are not something you will need or use, you may decide not to upgrade
    when it is first released. That''s fine, and certainly not uncommon. But the core
    development team will only actively develop and patch the current stable version,
    which means there may be security or bug issues found in older versions which
    are not addressed. As a general rule, you should avoid falling too far behind
    in the upgrade cycle for major revisions. Besides, there''s lots of great functionality
    available in the new releases you''ll want to benefit from!'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Another important periodic maintenance step is dealing with duplicate contact
    records that have a sinister way of creeping into your system. This is particularly
    true if you have multiple forms collecting information from your public website
    such as event registrations and contribution forms.


    Duplicate records usually result from existing contacts completing online forms
    using an alternative e-mail address or nickname. As a result of the alternate
    data, the record does not match the existing record, thus causing a duplicate.


    Fortunately, CiviCRM has some excellent tools for deduping and merging your database,
    found under **Contacts | Find and Merge Duplicate Contacts**. The full range of
    these tools is detailed later in this book. For the purpose of maintenance considerations,
    you should schedule periodic deduplication of your entire database. Size and usage
    of your system will determine how frequently that maintenance should take place.
    After implementing your system, schedule an initial de-dupe/merge for one month
    from the go-live date. Depending on how many potential duplicates your dedupe
    rules uncover, you can schedule the next maintenance review accordingly.


    > New functionality for the dedupe/merge tools are currently in development which
    include performance improvements, whitelist management, and automated processing
    (running a dedupe rule and auto-merging across your entire database). Follow the
    CiviCRM blog and release notes for more information.


    When covering the initial system configuration, we walked through the creation
    of cron jobs on your server to trigger automated events and actions. In most cases,
    these will continue to operate without the need for any intervention or maintenance.
    However, it is a good idea to periodically check in order to ensure that they
    are, in fact, running properly and the scripts are completing. While creating
    the cron job, you may choose to have a log sent to an e-mail address. The log
    does not contain much by way of detail, but will provide a verification that the
    script has completed successfully. You should make a habit of periodically checking
    the configured e-mail to confirm that your scripts are running properly.


    These basic maintenance steps should be all you need to keep your system running
    smoothly.


    # Developing a backup policy and procedure


    No chapter on maintenance would be complete without bringing up the topic of backup
    policies and procedures.'
  merge: -1
  img_proc: true
- pgno: 144
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 145
  md: "+   - **In general, the database backup is far more important than the filesystem:**\
    \ Why? All your data, which is likely to be changing and worked on daily, is stored\
    \ in the database. Your filesystem, primarily the application code, rarely changes.\
    \ Understand that this is a general statement. If your website and CiviCRM makes\
    \ regular use of the file upload tools, you will want to ensure those are backed\
    \ up regularly as well. This statement is not to say that you shouldn't have a\
    \ policy for backing up the filesystem; we are simply suggesting that you may\
    \ not need the filesystem backed up as frequently as the database is.\n+   - **Back\
    \ up to multiple locations:** Just as you don't want to rely on your hosting provider\
    \ as the sole backup solution, you don't want to trust your office intranet or\
    \ hosting server as the sole repository for backups. Wherever possible, create\
    \ a system that will maintain regular backups in at least two locations.\n\nUse\
    \ these basic rules and invest your time and resources to ensure that your data\
    \ is preserved in the case of accidental loss.\n\n> Both Joomla! and Drupal have\
    \ several extensions that will generate a periodic database dump, save it to the\
    \ server, and send the compressed file as an attachment to a configured e-mail\
    \ address. For smaller CiviCRM implementations, this provides an easy way to automatically\
    \ generate a backup and send it \"off-site\" via e-mail. Consider creating a Gmail\
    \ account (which provides ample storage space) to catch and store the backup.\
    \ While you should periodically download backups to your local server or other\
    \ off-site space, this can provide an inexpensive and easy-to-implement backup\
    \ plan. One caveat to this solution is that you may not be able to e-mail an encrypted\
    \ version of the database, which means you have a certain level of exposure. This\
    \ should be considered and factored into your overall policy and procedure. A\
    \ few available extensions are:\n> \n> - Drupal (db): Backup and migrate module:\
    \ `http://drupal.org/project/backup_migrate`\n> - Drupal (files): Backup and migrate\
    \ files module: `http://drupal.org/project/backup_migrate_files`\n> - Joomla!\
    \ (db and files): Akeeba backup: `http://extensions.joomla.org/extensions/access-a-security/site-security/backup/1606`\n\
    \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_145_0.png)"
  merge: -1
  img_proc: true
- pgno: 146
  md: <!-- no content -->
