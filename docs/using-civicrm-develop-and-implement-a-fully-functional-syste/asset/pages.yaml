- pgno: 128
  md: '# Dashboard


    When you first log in to your CMS and visit CiviCRM, you land at the Dashboard
    page. This page can be configured to display reports from your system in two columns.
    It is configured directly from this page using the Configure Your Dashboard button.


    Clicking displays a visual representation of two columns and a list of available
    reports. Simply drag and drop from the available reports block to one of the two
    columns and click on Done to save your settings.


    The available reports, or dashlets, come from the main reports list (Reports menu).
    You must configure a report to be available as a dashlet before it will appear
    in the Dashboard configuration page.


    # Navigation


    Throughout our review of CiviCRM, we have referenced the default location of tools
    and options in the horizontal navigation bar. However, you may add, move, remove,
    or rename the menu options in your site. For example, if your organization is
    a heavy user of activities (used to track communications with constituents) you
    may want to move the Activity Search and New Activity menu items to the main header.


    You modify the navigation menu by going to Administer | Customize | Navigation
    Menu. The menu is displayed as an expandable tree. Click on the New Menu Item
    button to create a new option, right-click on an existing option to modify it,
    and drag and drop items to move them to a new location.


    While creating or editing an option, you enter the URL for the page. Pages found
    within the site can be referenced using relative URLs. However, you also have
    the flexibility to create menu options to non-CiviCRM locations and links outside
    of your site using a full URL (including http://). Drupal sites will use the Permission
    selection tool to determine which users may see and access the menu item.


    After making modifications to the menu, a notification block will appear at the
    top of the page. Click on the Click here link to reload the menu and review your
    changes.


    # Setting up cron jobs


    A cron job is a time-based trigger configured on your hosting server. You set
    up cron jobs to automatically run scripts on a periodic basis. CiviCRM ships with
    several optional scripts that can be run through a cron, providing automated batch
    record processing for various functions.'
  merge: -1
  img_proc: true
- pgno: 129
  md: <!-- no content -->
