    \ are any problems, go to the appropriate CiviCRM forum for help: `http://forum.civicrm.org/index.php/board,8.0.html`.\n\
    +   - If there are no problems, click on **Return to CiviCRM home page** to rebuild\
    \ CiviCRM menus and go to the dashboard."
