- pgno: 147
  md: '# 4


    # CiviCRM Basics: Moving through the System and Working with Contacts


    At this point, you will have worked through the important steps of analyzing your
    organization''s structure and processes as they relate to constituent management.
    You will also have installed and configured CiviCRM in your preferred CMS environment.
    In addition, you have been introduced to the case study that will be used throughout
    this book. It is now time to gain familiarity with the CiviCRM interface and begin
    working with the contact records.


    Whether you are already in the process of implementing CiviCRM, simply seeking
    to learn more about the software, or seeking a more in-depth understanding of
    the tools it provides, you are ultimately here because you represent some type
    of organization with constituents. Those constituents may be members, volunteers,
    donors, event participants, or just people and organizations you come in contact
    with. However, at the core of your purpose and the heart of CiviCRM are contacts
    with which you interact and record information.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'The contact record forms the central hub from which all related records are
    generated. You will collect, retrieve, and report on these related records in
    various ways, but ultimately, they all connect back to a contact.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_148_0.png)


    In this chapter, we will do the following:


    +   - Become familiar with the CiviCRM interface and navigation tools

    +   - Discover the contact record, understand how to work with contact data, and
    begin to organize and categorize our records

    +   - Learn about the powerful search functions available

    +   - Take action on multiple contacts from search results

    +   - Review alternate workflow options and perform maintenance on records


    # Introduction to the interface


    Before we dig into the contact record, let''s briefly review the CiviCRM interface.
    Navigate to your own installation of CiviCRM in Drupal or Joomla!, or use the
    online demos available at demo.civicrm.org, and begin exploring.


    The CiviCRM interface consists of three primary regions, namely the horizontal
    navigation menu, the left sidebar, and the main content region. Depending on whether
    you are using Drupal or Joomla!, these three regions will look slightly different,
    though they are fundamentally the same and provide identical functionality.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'The screenshots in this chapter are taken from a Joomla! installation. Drupal
    users may note the following differences:


    +   - The horizontal navigation menu will be located at the top of the screen,
    replacing the standard Drupal admin menu bar (unless your installation has moved
    it from this default screen location).

    +   - The left sidebar consists of configurable blocks. Depending on your settings,
    you may not see all of the blocks present in the Joomla! screenshots.

    +   - Joomla! has a consistent administrative interface, whereas the Drupal interface
    inherits the website theme by default. Consequently, the colors, fonts, width,
    and other design and layout elements in your installation will reflect your Drupal
    theme.


    If you want to have a different theme for your administrative interface, you can
    select one for the Drupal admin area using the Administration theme module (http://drupal.org/project/admin_theme)
    and for the CiviCRM admin area using the CiviCRM Theme module (http://drupal.org/project/civicrm_theme).


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_149_0.png)


    The horizontal navigation bar (labeled A in the screenshot) is configurable (from
    Administer | Customize | Navigation Menu) and will reflect which CiviCRM components
    you have enabled. The leftmost part of the bar contains a quick search box that
    will populate record selections as you begin typing. Depending on your configuration
    settings, it may search on names, nicknames, or e-mail.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_150_0.png)


    The left sidebar (labeled as **B**) will include a drop-down list to create new
    records, a list of recent items you''ve visited, your contact dashboard link,
    and a short form for creating a new individual record. For those using Drupal,
    these configurable blocks can be accessed through the Drupal **Administer** menu.
    The main contact region (labeled as **C**) is where all the action takes place
    as you navigate through the system.


    If you''re new to CiviCRM, take time to explore the navigation menu and familiarize
    yourself with the options available. You''ll quickly see that this software is
    loaded with features. The quicker you become familiar with the terminology and
    tools, the more you''ll be able to take advantage of the powerful functionality
    it offers.


    # ## Contacts


    Simply put, a contact is any entity you interact with. It may be people, businesses,
    government institutions, households, organization chapters, regional districts,
    or anyone else you are collecting data for in your system.


    # ## Individuals, organizations, and households


    Since all contact entities are not the same and the nature of how you interact
    with them will be different from one to the other, CiviCRM segments contacts into
    three main types, with the option of further segmenting them into subtypes:


    +   - **Individual contacts:** These contacts represent people. As you work with
    the contact record, you will record things like first name, last name, date of
    birth, gender, and other types of data that is relevant only for interaction with
    people. In addition, individuals are the only contact type that may have a corresponding
    user account within your Joomla! or Drupal website; after all, "businesses" don''t
    log in to websites, people who work for the business do. CiviCRM provides tools
    to allow sufficiently permissioned individuals to act on an organization record
    they are connected with, which we will discuss later. However, it''s important
    to understand this unique aspect of the individual contact type.

    +   - **Organization contacts:** These may represent a non-profit, business, community
    organization, regional chapter of your organization, or any other "organized"
    entity. While working with organizations, you are recording the organization name,
    legal name, and other such data unique to this type.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '+   - **Household contacts:** These contacts are perhaps the most obscure,
    as they are intended to provide the ability to group individual records together
    under a single umbrella and track information that may apply to the group as a
    whole. The clearest benefit of this type is the ability to share a single address
    with multiple individuals. For example, if the contacts move, the shared address
    needs to be updated only once. If a married couple, along with their three children,
    are tracked in your system, you will want to create a household record with their
    home address. Also, each of the family member''s individual contact record will
    indicate that they are sharing the household address. In addition to reducing
    how many times you fill out the address fields and limiting the potential for
    typographical errors, you also will have the ability to combine the individuals
    under a single household record when you print mailing labels or export the list.
    This can be a significant cost saving as you reduce the number of mailing pieces
    to be delivered from five to one, as seen in the preceding example.


    # Contact subtypes


    In most cases, the three main contact types we just described are sufficient for
    organizational needs. When you need to collect and store different information
    about subgroups within these types or define relationships specific to a subgroup,
    you may consider further segmenting your record types into contact subtypes. Each
    subtype inherits its basic "entity identity" from one of the three main types,
    but otherwise, it can be treated as unique.


    > The Food Pantry Association of Greater Metropolis (FPAGM) provides services
    and support for food pantries within the city of Metropolis and the surrounding
    area. On a daily basis, they interact with 30 to 40 food pantries that are members
    of the organization. In addition, they interact with restaurants, grocery stores,
    and convenience stores that donate food from their surplus for distribution to
    the food pantries.

    > It is clear that the food pantries and businesses donating food are distinctly
    different entities. The nature of the data they collect, interaction through mail
    and e-mail, and types of reports that will be run will be different, depending
    on whether the organization is a pantry or food supplier. Consequently, FPAGM
    has decided to create two contact subtypes under the main organization type.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Contact subtypes are created and managed through: **Administer | Option Lists
    | Contact Types**. From this screen, as seen in the following screenshot, you
    can rename the existing types (including the three primary types), create new
    types, and assign icons to each type in order to help visually distinguish them
    while reviewing the records.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_152_0.png)


    # Planning your contact types


    It is important to give a careful thought as to how you work with different types
    of contacts when you configure and build out your CiviCRM implementation. Contact
    types may be viewed as the highest level of categorization in your system and
    the choices you make will have implications throughout the rest of the system.


    Consider the following as you plan your contact types:


    +   - Don''t overuse contact subtypes. There will be a plenty of other ways to
    categorize and segment your records. The subtypes are best used when you have
    distinct differences between contacts that strike at the core nature and role
    of the entity.

    +   - Contacts can be assigned only a single contact type; don''t create a structure
    where there may be confusion or overlap between subtypes. In the food pantry example,
    you would not want to create subtypes for food supplier, grocery store, and convenient
    store because the grocery store and convenient store are both food suppliers,
    and having those three subtypes will create uncertainty about where a certain
    business best fits. It would be better to create a single subtype for food supplier
    and use other means (such as tags or a custom field) to further categorize within
    that one type of entity.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '+   - If you are planning to migrate data from an existing database, be sure
    you take the time to organize your existing records into the types and subtypes
    you plan to use in CiviCRM. The contact import tools provided by CiviCRM require
    you to import a single contact type at a time. You will want to make sure you''ve
    settled on your contact structure and prepared your import data accordingly before
    you begin importing.

    +   - One of the primary benefits of contact subtypes is the ability to create
    sets of custom data fields for one or more types. The custom data fields are those
    fields which you create to extend the core fields supplied by CiviCRM out of the
    box. This is a useful way to think through the planning process: Do I plan to
    collect data for this one type of organization that I don''t need or clearly does
    not apply to another type? If so, it may warrant creating a subtype.


    You assign contact subtypes when you create contact records. If an existing contact
    does not have a subtype selected, you may specify one when editing. However, if
    you''ve selected a subtype and stored any custom data associated with that type,
    you will no longer be able to change the subtype (unless all custom field sets
    for that subtype have been permanently deleted). For example, FPAGM creates a
    custom data field to track the daily average of the number of clients a food pantry
    services. This field is attached to the Food Pantry subtype, as it is only relevant
    to those contacts. If we create a new organization record, assign the Food Pantry
    subtype to it, and save the organization contact, the record is now locked on
    that subtype; we cannot decide to change the record to the Food Supplier subtype
    at a later date. This system behavior ensures protection against unintended data
    loss or orphaned data. If at a later time you decide to completely delete the
    custom data fields associated with the subtype, you will once again be able to
    reassign a contact to a different subtype. Basically, CiviCRM locks the subtype
    in order to prevent data loss — if there is no subtype-specific data stored for
    a record, you can change the value without risk.


    While we are discussing contact types, there is another important consideration
    to think through, particularly if you have a complex organization with multiple
    administrative users who will be working with CiviCRM.


    As we will see shortly, a large part of working with CiviCRM involves connecting
    related records with the contact record. For example, you may track phone calls
    and meetings held with an individual, donations contributed by a business, membership
    from a household, or open a case for any of these contacts. Very often, there
    are connections built between related contacts and in each instance, you must
    decide where the contribution, membership, or other records should be attached.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'John Smith, the proprietor of ACME Convenient Store, calls FPAGM to arrange
    the donation of 50 lbs. of bread for distribution to food pantries. FPAGM staff
    will track this as an in-kind donation in CiviCRM. The question asked is should
    the contribution be recorded with John Smith (after all, he is the owner and primary
    contact), or with ACME Convenient Store?


    In most cases, it is very clear where the associated record should be attached.
    However, where there is potential for confusion and ambiguity, you will want to
    establish clear policies and procedures to help staff determine the proper location
    for the data.


    Consider the following questions:


    +   - Where is the official "source" of the data? If you receive similar data
    in the future, where will it be tracked? In the preceding example, we would record
    the donation with the organization (ACME Convenient Store), not with John Smith.
    It is really the business that is contributing, not the individual.

    +   - Who is actually involved in the activity? For example, who will be attending
    the event, or whom will the official tax receipt be made out to? One common area
    of confusion is an organization that hosts trade shows as part of a conference.
    Are your exhibitors the businesses themselves or the individuals representing
    the business? This can be tricky, because "businesses" don''t attend events, people
    do, and yet a good argument could be made for recording the exhibit-related details
    with the organization record.


    Regardless of how you resolve those potential areas of confusion, it is important
    to strive for consistency. How you enter your data will have a direct impact on
    what you are able to pull from the system.


    Once you''ve defined your contact subtypes (if any) and thought through the policies
    you will put in place for the staff, take the time to manually create a few records
    with real data to test your structure and policies. This may help you identify
    and correct any unanticipated consequences of your configurations.


    # Core information fields


    Let''s get into a contact record and begin to see how this idea of a contact with
    related records takes shape in CiviCRM. If this is your first time in CiviCRM,
    place your cursor in the search box to the left of the CiviCRM menu bar, as seen
    in the following screenshot, and then click on Enter to view all the records:'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'At a minimum, you should see one record corresponding to your website user
    account (you may also have seen that record in the left sidebar recent items list).
    Enter this record, or any other one, to view the contact details.


    As you can see, the contact record is displayed through a series of tabs corresponding
    to the different types of data you may be collecting.


    > The tabs displayed in a contact record depend on configuration settings in two
    places: **Enable Components** (Administer | Configure | Global Settings | Enable
    CiviCRM Components) and Site Preferences (Administer | Configure | Global Settings
    | Site Preferences). If you do not see an expected tab, make sure that the component
    is enabled, and that you have indicated that it should be viewable on the contact
    record page.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_155_0.png)


    We will not discuss all of the available tabs at this point, but only cover those
    that are directly related to the contact record itself, including communication
    tracking, relationships/connections with other records, and core categorization
    tools.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# CiviCRM Basics: Moving through the System and Working with Contacts


    The default summary tab is perhaps the most important tab, as it tracks the contact
    name, communication details and preferences, addresses, and demographics (if it
    is an individual contact type). Click on the Edit button at the top of the tab
    to view all the available fields for your contact. You will notice that the edit
    screen is broken into grouped panes of fields corresponding to the different types
    of information you are collecting.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_156_0.png)'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Contact details


    The contact details pane contains basic information about an entity, including
    the following:


    +   - Contact name, including the nickname, which may be useful as an alternative
    value for searching. For example, if the name of a certain not-for-profit organization
    in your database typically goes by an acronym, you may wish to spell out the full
    name for formal purposes and place the acronym in the Nick Name field. It can
    then be easily exported with the record and found when using the search bar.

    +   - Notice that if any contact subtypes have been configured, they will be available
    for selection in this area (Contact Type drop-down). Once you''ve selected a subtype
    and saved data to any of the custom fields associated with the subtype, the ability
    to change the type will be locked. Only those subtypes corresponding to the primary
    type are listed. For example, if you are looking at an individual record, only
    the individual subtypes will be available.

    +   - Individual records have a special Current Employer field that creates a
    relationship between the individual and organization with whom they are employed.
    The current employer field is displayed prominently in the contact summary tab
    and can easily be exported with the individual record. Note that if you enter
    the name of an organization that does not exist in this field, an organization
    contact record will be created. You can take advantage of this to reduce the data
    entry.

    +   - Communication options include e-mail, phone, instant messenger, website,
    and Open ID. Each of these fields allows you to add multiple values and categorize
    them. For example, a person may have a phone and mobile number for home, and a
    phone, mobile, and a fax number for work. Alternatively, someone may have a work
    e-mail and personal e-mail recorded with their record. If your site does not require
    tracking Open ID, you may remove it from the interface through Administer | Configure
    | Global Settings | Site Preferences.

    +   - If multiple communication values are entered, one of them will be marked
    as the primary one. The primary value can be more easily exported, regardless
    of its type. For example, some of your contacts may wish to have their home phone
    marked as primary, while the others prefer their work or mobile to be marked as
    such. The primary flag is not concerned with the source or type of the record;
    it simply indicates which their preferred option is.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   - The e-mail field has two additional checkboxes unique to its function
    — **On Hold** and **Bulk Mailings**. An e-mail address marked as **On Hold** indicates
    that it may be a faulty address. While you can manually mark an address as such,
    it is more likely that the field was flagged this way as a result of the CiviMail
    return mail processor. The mail processor is an optional tool that can be set
    up to retrieve any bounced (returned as undeliverable) e-mails and flag them as
    **On Hold**. This provides you with an opportunity to review the records and determine
    the source of the problem. While they are tagged as **On Hold**, they will be
    excluded from any future CiviMail mailings. The bulk mailings flag designates
    one e-mail address as the preferred mailing address for any bulk e-mails generated
    through CiviMail. For example, a person may want their work e-mail designated
    as the primary address as they want to receive direct communication immediately.
    However, weekly e-mail newsletters generated to all members of your organization
    should be sent to the person''s home e-mail so as not to clutter their work inbox.

    +   - The source field may be used to record how this particular contact came
    to be involved in your organization, or how they were added to the system. This
    may be particularly useful if your organization''s growth is primarily due to
    word-of-mouth networking. For example, you might record that Jane Doe was introduced
    to the organization through outreach from one of your board members.

    +   - External ID records a unique ID from some external source. If you are importing
    records from another database such as MS Access, you may want to import the key
    ID field for the contact into this field. While you won''t typically use it once
    you are working exclusively in CiviCRM, it provides a useful way to trace the
    record back to its original source in the previous database system. This may also
    be used for data integrity analysis after the initial import process. In larger
    organizations with more complex IT infrastructure, it may enable easier on-going
    data synchronization with other software tools.


    # Custom data


    As we''ll see in *Chapter 6, Communicating Better*, CiviCRM allows you to create
    sets of custom fields and indicate whether they should be displayed inline or
    in their own tab on the Contact form. If some custom inline fields have been defined
    for all contacts or the specific contact type you are editing, these fields will
    appear directly under the contact details pane.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Address


    Similar to communication options, you may create multiple address sets, categorize
    them (home, work, and so on), and flag one of them as the primary address. There
    are a few important things to note:


    +   - An existing address may be flagged as the billing address or you may create
    a new address and use the **Location Type** option to designate it as a billing
    address. The former is useful if a single address is used for multiple purposes.
    The billing address will be used if the contact makes any online credit card payments
    for donations, events, or membership.

    +   - Individual contacts have the option of choosing a household record''s address
    for an address set. In order to do so, begin typing the household name and select
    it from the drop-down list. If the household record does not exist, you can create
    a new one by typing in the desired name of the household record. A contact may
    have only one associated household address.

    +   - Each record may only have one address set for each address type. In other
    words, you can''t designate three addresses as **Work** in a single contact record.
    This may seem somewhat limiting, as it would not be uncommon for an individual
    to have two work locations, or a home and second home address. However, the usefulness
    of this limitation becomes apparent when you export records, as you have the option
    of exporting a single address type with the record. Having multiple address sets
    with the same type would either require duplicate records or duplicate field columns,
    either of which will be difficult to work with. If you have the need for tracking
    multiple addresses of a similar type, consider adding option values labeled as
    **Home1**, **Home2**, **Home3**, and so on (**Administer | Option Lists | Location
    Types**).


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_159_0.png)


    > When you first install CiviCRM, the address pane contains all of the available
    fields, including some you may not want to display. Visit **Administer | Configure
    | Global Settings | Address Settings** to turn off elements in this pane. For
    example, you may only want to track two address lines, and so you would disable
    **Additional Address 2**. Likewise, it is unlikely that you would need to manually
    edit the latitude and longitude values for records, as that will typically be
    handled automatically if you have enabled address geocoding for your site.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'We can see the **Address** pane in the following screenshot:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_160_0.png)


    # Communication preferences


    Now that you have your contact record in place and have recorded all the various
    ways you might be communicating with them, CiviCRM provides tools for further
    classifying (and limiting) your communication methods. These preferences are broken
    into four areas:


    +   - Greeting preferences are used when e-mailing, generating labels, or exporting
    contacts, and can use fields from the record (tokens) or be fully customized.

    +   - **Privacy settings** reveal if the person prefers not to be contacted through
    a certain method. The **Privacy** settings do not lock access to the communication
    details; they are simply a tool allowing CiviCRM users to quickly see that the
    contact has requested not to be contacted in the selected way. If selected, the
    privacy settings generate an eye-catching "stop" icon next to the respective method
    in the **Contact Summary** tab.

    +   - Similarly, the **Preferred Method(s)** are used for your internal purposes
    in order to facilitate and improve communication with contacts.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '+   - The e-mail settings provide an opt-out flag and format preference:

    +     - The opt-out flag (**NO BULK EMAILS (User Opt Out)**) complies with the
    **CAN-SPAM Act** in the United States and is typically only used if a contact
    specifically states they do not wish to receive bulk e-mails. Bulk e-mails generated
    through CiviMail are required to have an opt-out token (either by directing the
    user to a web-page where they can choose to opt-out, or providing an e-mail address
    for automated processing). It is likely that you will very rarely select that
    option through the interface. If you do, be aware that it will automatically remove
    that user from any e-mails generated from CiviCRM.

    +     - The **Email Format** field determines whether the user prefers to receive
    Text or **HTML**-based e-mails. The default is **Both**, which means e-mails generated
    with HTML and text versions will both be sent to the contact. Note that the user''s
    e-mail client settings will determine which one is actually displayed. You may
    want to periodically monitor this field to determine if users have explicitly
    requested receiving e-mails via text, as it will require you to generate two forms
    of e-mails for sending via CiviMail.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_161_0.png)


    # Demographics


    Individual contact records will have a **Demographics** pane where the **Gender**,
    **Date of birth**, and **Deceased date** can be recorded. When conducting a search
    to export contacts for a mailing list, you can exclude contacts of people who
    are deceased in order to ensure that they don''t receive the mailing.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_161_1.png)'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Deleting contacts


    When in the contact summary view, you will notice a **Delete** button above and
    to the right of the tabbed interface. CiviCRM has a contact trash function; when
    you click on this button to delete a contact, it does not completely remove it,
    or any related records from the system, but rather marks it as trashed. Trashed
    records can be searched for using the Advanced Search tool; an option to **Search
    in Trash (deleted contacts)** is found toward the bottom of the **Basic Criteria**
    pane. After searching for trashed contacts, you can delete it permanently or restore
    it.


    This functionality is a powerful way to protect your data against inadvertent
    deletion. However, as with any safety net, you should not over-rely on it. Never
    trash a record with the intent of later restoring it. Trashed records should be
    viewed as fully deleted (and will appear as if they were actually deleted by the
    system when searches and reports are generated).


    Note that you may disable the trash function on your system through **Administer
    | Configure | Global Settings | Miscellaneous**.


    # Tags and Groups


    You may have noticed that we skipped the **Tags and Groups** pane found at the
    bottom of the contact summary edit screen. These records are also found in their
    own dedicated tabs on the **View Contact** screen, and so we''ll take a look at
    the functionality they provide in the context of their own tabs.


    The **Tags and Groups** tab provides two powerful mechanisms for categorizing
    and organizing your contacts. However, it is not always readily apparent which
    of the two mechanisms is best suited for a specific need.


    # Tags


    Tags provide a hierarchal categorization mechanism across all contact types. They
    are a *categorization* mechanism—you use tags to record information about the
    nature of your contacts, such as the type of services they provide, skills they
    have, areas of interest, or other such information. They can be hierarchal; you
    can build out your tag structure with categories and subcategories. When viewing
    and selecting tags from the contact summary edit screen, they appear in a simple
    list with indentations to visualize the hierarchy. Viewing them in the dedicated
    tab displays a similar structure, but uses an expandable/collapsible tree tool
    to better reveal the hierarchy and allows you to quickly navigate through the
    structure.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Tags are applied across all the contact types, which means that you cannot
    create sets of tags specific to a single contact type (for example, organizations).
    Keep this in mind, as you may want to consider other categorization tools such
    as groups or custom fields, if your available options need to be contact type
    or subtype-specific. Tags can also be created and applied to contacts, activities,
    and cases; at the time the tag is created, you choose how the tag will be used.


    In addition to the hierarchal tagging structure, CiviCRM provides tools for creating
    freeform tagsets. This tag feature differs from the hierarchal tree in several
    ways, as follows:


    +   - The hierarchal tree displays the full list of available options, which you
    navigate through and select using checkboxes.

    +   - Tags available in the tag tree must be created using the **Manage Tags**
    tool before you can navigate through and select them in a contact record.

    +   - Tagsets present a single text box which you use to create tags as you assign
    them to a contact/activity/case, or use to search for existing tags and assign.
    As you begin typing in a tagset field, CiviCRM will dynamically search for partial
    matches with the existing tags, which you can then select. If there isn''t an
    existing tag, you will create the new tag on the fly. For example, if I start
    typing "trans" it may pull up an existing tag called "transit"; if I continue
    typing "transp", I can proceed to create a new tag called "transportation", and
    so on.

    +   - Freeform tagset tags can be created and managed using the **Manage Tag**
    tool as well; you would simply treat the tagset as the parent tag. Typically,
    you would not use the tag management tool to create new tags for a tagset, as
    the primary benefit of freeform tags is the ability to dynamically create new
    tags as you are working in a record. However, you may find it helpful to clean
    up these tags at times, as they are more susceptible to clutter.

    +   - In general, the hierarchal tags are better at classifying records in a very
    structured and orderly way, whereas tagsets are useful when you want to quickly
    and easily list keywords or other flat-list attributes about a record.


    As indicated earlier, before using hierarchal tags with your records, you must
    define them in the system: **Administer | Option Lists | Tags (Categories)**.
    Use the **New Tag** button to create new tags, and the **Edit/Delete** links to
    manage your existing tags. Note that while the administrative page lists all the
    tags alphabetically, the **Parent ID** column will help you track the hierarchy
    of the structure.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '> FPAGM uses tags to track the types of services and nature of the contact
    entity. This includes several subcategories to further refine the information
    gathered about a contact. They define a single "keywords" tagset to further classify
    records beyond the hierarchal structure.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_164_0.png)


    The **Tags** tab in the contact record presents the most user-friendly interface
    for tag selection. While you may optionally manage a contact''s tags using the
    **Contact Edit** screen, the interface is a bit more limiting because of the other
    elements on the page. This is especially true if you have a long list of hierarchal
    tags in your system. The **Tags** tab represents the hierarchal form in a more
    visually appealing way and allows you to dynamically expand/collapse the parent
    tags to view the child options.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_164_1.png)


    To help you easily get a glimpse of how a contact has been tagged, CiviCRM provides
    a comma-separated list of all the selected tags on the **Summary** screen, as
    shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 165
  md: '![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_165_0.png)


    # Groups


    Groups are simply a collection of records that may be defined statically or dynamically.
    Static groups are sometimes referred to as regular groups or simply groups, and
    dynamic criteria-based groups are called smart groups.


    Think of a static group as a container in which you manually place your records.
    There are no specific criteria by which people become part of a static group –
    they are added or removed based on their or your preference. For example, you
    might create a "Board of Directors" group and add the nine contacts in your system,
    who currently are members of the group. Another example of a common use for static
    groups is opt-in mailing lists. As people visit your website, you might provide
    the option of signing up to receive a periodic e-mail newsletter. The signup form
    (and unsubscribe tools) will empower visitors to add or remove themselves from
    your newsletter group.


    In contrast, smart groups are generated based on the criteria you have defined,
    and thus are dynamic in nature. For example, you may have a group that retrieves
    all contacts in a certain area where the criteria you''ve defined is a specific
    city, state, or zip code proximity range. Smart groups store the criteria and
    not the static list of contacts at a given point in time, and thus serve as a
    saved query in your database. If you return at a later date to view the contacts
    in a smart group, CiviCRM will pull a fresh list of contacts that meet the defined
    criteria.


    Although you typically will create a static group and then add your records to
    this container, smart groups are generated from search results. After running
    a search for contacts, you may take certain actions on the results, including
    saving them to a smart group that can easily and quickly be retrieved at a later
    date. While retrieving a saved smart group later, you are given an opportunity
    to adjust the criteria and update the settings. Smart groups also have the flexibility
    to manually add and remove contacts. Hence, those who may not fit the criteria
    can be added and others who do can be excluded.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Using groups


    It is great that you have tools to collect and organize your contacts into groups,
    but how will you actually use them in the system? Here are some of the most common
    uses for groups:


    +   - Static groups are useful for groups of records you wish to isolate and reuse,
    but do not meet specific criteria, such as the Board of Directors and mailing
    list examples. Static groups can also be created when importing records, which
    may prove a useful way to track the source of your records. For example, if you
    receive a list of potential donors from a third party organization, you might
    import them and add them to a group with the organization''s name and import date.


    +   - Smart groups will typically be created for saved searches that you conduct
    on a regular basis. Why go through the process of selecting several criteria options
    in Advanced Search for a set of records you review regularly? Run your search,
    save the results to a smart group, and any time you need to retrieve the records,
    you will be pulling an accurate, real-time list of records meeting your defined
    criteria.


    +   - Drupal and standalone implementations may use groups for Access Control
    lists (ACL). CiviCRM provides a number of fine-grained controls to limit who may
    view, edit, delete, or access certain functions in the system. These are controlled
    in part through ACL-type groups. Note that ACL capabilities are not yet available
    to Joomla! implementations due to limitations in the CMS, though this is expected
    to be developed sometime in the future with the release of Joomla! 1.6.


    +   - When defining a group, you may designate it as a mailing list, which means
    it will be made available to the broadcast mailing tools in CiviCRM. The bulk
    mailing process relies heavily on groups to generate the recipient list, providing
    the ability to include or exclude contacts based on their group status.


    +   - Profiles, which are a collection of fields that can be exposed to your website
    visitors as search/listing forms, data collection/edit forms, or view-only pages,
    can restrict the records they display based on group status. For example, you
    may create a search and listing profile as a membership directory on your website.
    However, you want to ensure that only members in good standing are part of the
    search results, so you first create a smart group with the criteria membership
    status = current in order to dynamically retrieve your members. While configuring
    your profile, you limit the search results to this group and thereby create your
    online member directory.'
  merge: -1
  img_proc: true
