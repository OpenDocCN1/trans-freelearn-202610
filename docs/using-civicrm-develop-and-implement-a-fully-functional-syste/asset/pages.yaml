- pgno: 202
  md: '+   - **Integer**: The size of numbers that can be stored depends on your server,
    but is likely to be about plus or minus two billion on 32-bit operating systems,
    and about plus or minus 9E18 on 64-bit operating systems.

    +   - **Number**: This should be used for values requiring decimals.

    +   - **Money**: Used for monetary values. It will be displayed according to the
    default currency selected in your global settings.

    +   - **Note**: This field is used for longer text strings, such as lengthy descriptions
    or comments.

    +   - **Date**: You are given the option of selecting what date and time format
    will be used, including using only parts of the date. For example, if you want
    only the year and month, you may choose from several options displaying those
    values. When configuring dates, you also decide how many years in the future and
    past will be available to the calendar widget.

    +   - **Yes or No**: While alphanumeric checkbox fields can be used for yes/no
    functionality (where checked equates to Yes), this field may be more useful when
    you need to easily search for explicit "no" values. You could make this field
    required and set a default value of 0 (that is, No) to ensure all records have
    a value recorded, thereby improving your control over searches through this field.

    +   - **State/Province**: This will populate with a list of states and provinces
    enabled in your site.

    +   - **Country**: This will populate with a list of countries enabled in your
    site.


    > CiviCRM silently rounds integer values entered outside the allowable range to
    the minimum or maximum value without displaying an error.


    > Currently, all date fields make use of a popup widget to select the date. While
    this is helpful for ensuring accurate data storage (the widget constructs the
    value from the selection and places it in the required database format), it means
    partial date fields (such as selecting year only) will still operate by selecting
    a specific month/day/year. This is unfortunately non-intuitive from a data-entry
    standpoint. It also impacts searches on these custom date fields, and may yield
    unexpected results. If you need month or year-only fields, you may find it easier
    to use an alphanumeric select box field as it provides more control over the display
    and searching.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   - **File:** Browse button to upload a file. Files will be stored in the
    upload directory defined in global settings. A link to access the file will be
    presented in the custom data display. When you return to edit a record for which
    an existing file has been attached you will have the option of replacing the file
    with another upload or deleting the existing file.

    +   - **Link:** Hyperlink, which will be hot-linked when in view mode.

    +   - **Contact Reference:** Used to link to another contact record. The field
    will render as an auto complete field and will allow you to begin typing to locate
    another contact in the database.


    > > By default, the contact reference type field will pull contact matches from
    the entire database. In most cases, you will not want to do this, as it would
    expose all your contact records to whoever is using the form. CiviCRM provides
    a hook for customizing the list of records available to the auto complete field:
    `hook_civicrm_contactListQuery`. For more details about using hooks to customize
    CiviCRM, visit `http://wiki.civicrm.org/confluence/display/CRMDOC/CiviCRM+hook+specification`.


    After selecting your field type, choose your preferred display format. The options
    available depend on the field type, and several field types have only one option
    value. We will list and describe all of the display types that may be available.


    When choosing a display type that includes a list of options (such as select /
    checkbox / radio buttons), you will be provided a form for creating the option
    labels and values. You can enter up to 10 options initially; after saving them,
    you can add more. You are also given the option of reusing a list previously created
    for another field. The label is what will appear in the forms; the value is what
    will be recorded in the database and exported from the system.


    > > Label text should be descriptive and meaningful to the person completing the
    form. Most of the times you will enter the same value for both label and value,
    unless you have a good reason to make them different.


    The display types that appear are as follows:


    +   - **Text:** Basic text field.

    +   - **Select:** Drop-down box; select one option.

    +   - **Radio:** Radio buttons allow you to select one option from the list available.
    If the field is not required, a link to unselect any options will be included
    in the display. You may decide how many options will be listed per line.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '+   - **CheckBox**: Checkbox list allows you to select or deselect any of the
    options. You may decide how many options will be listed per line. Note that one
    weakness of checkbox options is the inability to easily search for unchecked values.
    If that option is important to you, consider creating yes/no type fields for each
    option and make it required. That will result in explicit values for both options.

    +   - **Multi-Select**: List of options, allowing the user to select one or more
    option. Use the *Shift* key to select multiple consecutive options, or the *Ctrl*
    key to select multiple independent options. This is useful for larger option lists,
    where checkboxes would require too much space.

    +   - **Advanced Multi-Select**: Displays two columns of options – the left column
    displays all the available options, and the right column displays the selected
    options. Use the arrows between the two columns to move options to or from the
    selected list. This overcomes the primary weakness of standard multi-select boxes
    – the tendency to accidentally de-select your options while working with the field.

    +   - **Autocomplete Select**: This is similar to the **Select** box drop-down,
    but you begin typing a value to have it search for possible matches among the
    option list. This is useful for single-select fields that have a large number
    of options.

    +   - **TextArea**: Displays a multi-line box for entering longer text. It will
    store the content as plain text with no HTML. You may decide the height and width
    of the box, though it will be expandable by the user.

    +   - **RichTextEditor**: Displays a multi-line box for entering longer text:
    with the WYSIWYG editor toolbar, as configured in **Global Settings**.

    +   - **Select Date**: Popup calendar widget for selecting a specific date.

    +   - **Select State/Province**: Select one state or province from the list enabled
    at **Administer | Configure | Global Settings | Localization**.

    +   - **Multi-Select State/Province**: Select one or more states or provinces.

    +   - **Select Country**: Select one country from the list enabled at **Administer
    | Configure | Global Settings | Localization**.

    +   - **Multi-Select Country**: Select one or more countries.

    +   - **Select File**: Provide a browse/upload file field.

    +   - **Link**: Hyperlinked URL field.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'Proceed with completing the field creation form, entering a default value (if
    desired and available), providing help text, and determining if the field is required.
    Note that if you designate the field as required it will impact all administrative
    forms—not simply forms exposed to the front of your site. When creating frontend
    forms you will have another opportunity to designate which fields are required
    (during profile construction).


    If you would like this field included in the advanced search tool, designate it
    as searchable. Typically you will want most of your fields to be searchable, though
    it''s worth considering the question. For fields that are unlikely to be searched,
    keeping this option off streamlines the advanced search interface.


    The last option on the field creation form is to mark a field as view-only. There
    are two situations where this can be helpful:


    +   - If you are importing data from a legacy system, you may have some fields
    which you would like to retain in the new system, but would not want to maintain
    on an ongoing basis. Most often this happens because the legacy fields find a
    different expression in CiviCRM, such as becoming part of the tags or groups structure.
    After creating the fields and importing the data you would return and mark this
    field as View Only. In this way you ensure that the data is available for reference,
    but users will not add to or edit it.

    +   - **View Only** fields are also helpful if you wish to populate the field
    with values calculated by hooks or other code. We will discuss hooks toward the
    end of the book, but for our immediate purposes, understand that they are a way
    for developers to run custom code at certain times. For example, you might create
    a custom field called "age" which calculates the age of the contact based on the
    birth date (a standard field), and the current date. You want the value updated
    automatically with code every time it is displayed rather than relying on users
    to manually record the value.


    > Note that you cannot import data into a field designated as **View Only** using
    the **Import Contacts** tool. You should leave the field as editable, import your
    data, and then return and mark it as view-only.


    On the subject of importing legacy data, you may also find it useful to initially
    import and then later completely hide some fields (not just mark as view-only).
    As with most tools in CiviCRM, you can easily disable custom fields. Doing so
    retains whatever data is stored in the fields, but completely removes it from
    the interface.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Are you interested in understanding how CiviCRM handles custom fields in the
    MySQL database? Open up your database in phpMyAdmin, SSH, or your preferred database
    management tool. The creation of a custom group adds a record to the `civicrm_custom_group`
    table containing your configuration options, and creates a new table called `civicrm_value_[unique
    text based on group name and id]`. Each custom field adds a record to `civicrm_custom_field`
    and creates a new column in the appropriate table.


    The table created by the custom group will always have an `entity_id` column that
    is a foreign key to the object''s table it extends. For example, a custom group
    used for individuals will use the `entity_id` to link the custom data record to
    the `civicrm_contact` table''s ID field.


    This is helpful to know should you ever need to run custom queries on your data.
    The structure makes it very easy to build relationship diagrams and queries between
    custom data tables and the records they extend.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_206_0.png)


    Custom data sets and fields are a powerful tool in your CRM strategy. You are
    likely to find the need to construct them during your initial implementation to
    meet defined data recording needs, to import legacy data, and throughout your
    ongoing use of the system as data needs continually evolve.


    FPAGM will use custom fields to collect information about the food pantries they
    serve and businesses supplying food to the organization. Since the information
    collected for these two types of contacts are significantly different, the association
    will define two custom field sets and designate them for use with each contact
    subtype respectively. This is done by selecting **Organization** as the **Used
    For** value and choosing the appropriate contact subtype in the multi-select box
    that appears.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_206_1.png)


    One important thing to keep in mind as it relates to the impact of custom fields
    on your database structure is that if you migrate your site to a new server, you
    will need to make sure the additional tables created by custom groups are migrated.
    In other words, it is not sufficient to export only your data; you must also export
    the database structure. Importing only the data into a clean installation of CiviCRM
    on the new server is insufficient as you will be missing the custom data tables
    from your old database.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Creating online forms with profiles


    Until this point, most of our attention has been spent understanding CiviCRM''s
    administrative interface and customizing/configuring the system to meet your organization''s
    needs. However, the power of CiviCRM isn''t fully realized until you begin to
    collect and expose data to your website.


    It''s not uncommon for organizations to have very disjointed systems collecting
    and maintaining their constituent data. Perhaps you have a central database, such
    as MS Access, that is used by staff to track your members or donors and is stored
    on your office network. Several staff people may be maintaining spreadsheets with
    information relevant to their job functions and which they need access to while
    traveling (when they are unable to connect to the office network). Perhaps your
    current website has a database where user login access accounts are stored and
    a list of members is periodically updated in order to have an online directory.


    CiviCRM provides an opportunity to bring these disparate data sources together
    — those used internally on your office network, those which must be accessible
    remotely, and those which should be exposed on your public or user-accessed website.
    In doing so, you streamline workflows and improve data integrity.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_207_0.png)


    In CiviCRM, you collect and expose data using profiles. Profiles are basically
    a collection of fields. You choose settings for the profile and its fields based
    on how you plan to use it. Profiles may be used to:


    +   - Create forms where you collect information from users, either as a standalone
    form or as part of a contribution or event registration form'
  merge: -1
  img_proc: true
- pgno: 208
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 209
  md: '+   - **Search Results**: Used for advanced search results and batch updates

    +   - **Drupal User Registration**: Fields will be added to the user account registration
    form (Drupal only)

    +   - **View/Edit Drupal User Account**: Fields will be added to the user account
    form (Drupal only)


    You may return at any time to adjust these settings. As you can see, a single
    profile could potentially be used for multiple purposes. For the sake of reducing
    system clutter, it is best to initially only select those options you know you
    will be using.


    Click at the bottom of this form to expand the **Advanced Settings** panel. The
    options listed here significantly expand the functionality of your profile. Remember
    that not all options will be applicable for every use of the profile. CiviCRM
    simply ignores options that don''t apply to a specific instance of the profile
    on your site.


    By "instance", we mean the use of a profile for a specific purpose. For example,
    you might create a profile containing contact address fields that is used for
    a profile view page on your site and is also used as a search results view on
    the administrative side. Settings related to search, such as what columns will
    be in the result list, will be ignored by the first use of this profile. Typically,
    you are creating a profile for a single use, and in general, this is a good way
    to think about the process. However, there is no actual limitation in the software
    as to the number of ways in which a single profile can be used.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_209_0.png)'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'Let''s review the options:


    +   - **Limit listings to a specific Group?**: This only applies to profiles used
    as search forms. Selecting a group from this list will limit the contacts searched
    to only those included in the group. For example, if you are creating an online
    member directory, you will first create a smart group for current members and
    then limit your search profile to this group, so that only members in good standing
    will be returned in any search using this profile.

    +   - **Add new contacts to a Group?**: This applies to profiles used as contact
    signup or edit forms, including those used in conjunction with contribution pages
    and event registrations. When a user completes the form, they will be added to
    the group you''ve selected. This provides a great way to trace the source of your
    contacts or manage mailing lists.

    +   - **Notify when profile form is submitted?**: You can choose to have one or
    more persons e-mailed when a profile **Create** or **Edit** form is submitted.
    For multiple e-mails, separate each one with a comma.

    +   - **Redirect URL**: After the form is submitted, you can choose where the
    user will be redirected. To use this field enter a fully qualified URL (including
    `http://`). If the field is left empty, the user will be directed back to the
    profile form with a message indicating a successful submission.

    +   - **Cancel Redirect URL**: Similar to the last field, this is used to redirect
    the person if they cancel the form. Leaving the field blank returns the user to
    the profile form and clears the fields.

    +   - **Include reCAPTCHA?**: Captcha is a method for discouraging spam and robots
    from completing your online forms. The tool displays a graphical representation
    of letters and numbers, requiring the user to successfully type the characters
    before the form can be submitted. Before enabling captcha on a profile form, you
    must first obtain an account at `http://www.recaptcha.net` (you will be directed
    through Google to create the account). After setting up an account and obtaining
    a private and public key, enter those values in: **Administer | Configure | Global
    Settings | Miscellaneous**. Once you''ve configured reCAPTCHA in the global settings,
    it will be available to any profile form.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '+   - **Joomla/Drupal user account registration option?**: Earlier in this
    section we mentioned that a profile can be inserted into a Drupal user account
    form. The reverse is also available for both Drupal and Joomla! — you can create
    and expose a profile form and have the user account fields (username and password)
    included. You may make user signup optional or required, depending on your needs.
    This is particularly useful for including in contribution pages and event registrations.
    For example, you may want to encourage people who are registering for your annual
    meeting to create a user account for future access to the site. Note that your
    profile form must include an e-mail address field and user account registration
    must be enabled in your CMS settings (Joomla!/Drupal).

    +   - **What to do upon duplicate match**: What happens if someone already in
    your database completes a form on your site? Should a new contact be created?
    Should the fields be ignored if there is already data in them or should the new
    data update and overwrite the existing data? Use this option to decide if duplicate
    contacts should receive a warning, be updated using the existing record, or if
    a new duplicate record should be created. Note that CiviCRM will use the default
    Strict rule defined in the Find and Merge Duplicate Contacts tool (Administer
    | Manage) for the appropriate contact type to identify matching contacts. Also
    note that CiviCRM will always update existing contact records for profile forms
    embedded in contribution and event registration pages.

    +   - **Proximity search**: If a profile is used for searching, you can enable
    searches from it for contacts based on how proximate (close) they are to an address.
    If set to required, users must complete the proximity search fields in order to
    use the tool.

    +   - **Enable mapping for this profile**: If mapping is enabled and CiviCRM has
    successfully geocoded the address for a contact, a link to view the location on
    a map will be included in the search results and on the record''s detail view.

    +   - **Include profile edit links in search results?**: This option is a powerful
    (but dangerous) way to empower sufficiently permissioned users to edit other records
    in the system through a profile. Since the access to edit contacts is funneled
    through a profile, you can easily control what records and what fields the user
    can edit. In Drupal, you will need to permission the user appropriately to access
    and edit records for this profile. In Joomla!, the user must be an administrative
    user. When enabled, the search result list will have an Edit link added to each
    record''s row.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '+   - **Include Joomla/Drupal user account links in search results?**: Enabling
    this option inserts a link to the user''s website account page (view only) in
    the search results. For websites seeking to build a social community, this can
    help people connect with other users.


    After completing the **Settings** form you will be directed to a form where you
    can define fields for the profile. Remember that your options for **Profile**
    fields are somewhat independent of the original custom field definition. For example,
    you can flag a field as **Required** in the profile that is not required in the
    original definition, or you can add custom text before or after the field to help
    explain its usage in this particular context.


    Profile field settings can be a bit confusing as the options can impact the field
    display significantly depending on your use of the profile.


    The first concept to grasp is the types of fields you can combine together in
    a profile based on your planned use. As with other parts of CiviCRM, the field
    selection process involves selecting the type, the field, and then any sub-options
    relevant to that field. You may add contact, activity, participant (event registrants),
    membership, and contribution fields to your profile. However, your use of the
    profile will dictate what combination of field types are allowed. In particular,
    there are two primary rules dictating usage:


    +   - **Different contact type fields cannot be mixed**. This is the most common
    mistake for new users. The limitation means you can''t construct a profile that
    includes both Individual and Organization-specific fields, or other such combinations.


    +   - **Participant/Membership/Contribution fields may only be used in profiles
    used within the associated type of page**. In other words, you can''t use these
    fields with profile view/create/edit/search pages. Profiles containing these fields
    can only be used within event registration or contribution pages.


    If you fail to respect these rules, your profile page will render an error indicating
    that you have mixed-type fields and you will need to correct them before proceeding.


    > The field type list contains a **Contacts** option, as well as options for specific
    contact types and subtypes (**Individual**, **Organization**, and so on). The
    **Contacts** option includes fields common to all contact types, such as the **Address**,
    **Phone**, and **Communication preference** fields. The contact type fields are
    specific to only that type.


    After selecting a field, you may proceed to complete the other fields, such as
    the field label, whether the field is required, view-only, and help text. Note
    that **View Only** fields will not be included in profile search pages.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'One very important field to configure is the visibility field, which determines
    how the field data will be controlled. There are three options available:


    +   - **User and User Admin Only**: This is the default option and can be used
    for fields found in all profile create/edit/view and component pages (events and
    contributions). It essentially states that the only contact using the form will
    be the current user (whether they are logged in or not), or in the case of component
    and profile create forms, whoever the form is being completed on behalf of. For
    profile edit and view pages where you may be accessing existing data in the system,
    this option states that the logged in user may only view their own information
    (and not other contact records). Consequently, this option is the most restrictive
    and also the most secure. There generally is no need to change this field value
    unless your profile will be used as a search form.


    +   - **Public Pages**: This option should be selected if you want to expose this
    field to a search profile either through the search form itself or as part of
    the resulting records'' detail views. This includes profiles used for search results
    in administrative pages and batch updates. As the name suggests, it indicates
    that the contact record data may be viewed by contacts other than the logged-in
    user. For example, John Doe may use a profile search form to look up the address
    for Janis Smith.


    +   - **Public Pages and Listings**: This option works the same as the previous
    one, but also includes the ability to hotlink values in the detail view. This
    is a great way to encourage follow-up searches from your resulting records. For
    example, let''s say you have a custom field called "service types" that is attached
    to organization records. The field is displayed as a list of checkboxes from which
    the user selects one or more. After conducting a search and viewing a record,
    you see that they are associated with three of the services. In the profile form,
    this field was assigned the **Public Pages and Listings** visibility, which means
    the three services for this record are displayed and hyperlinked on the detail
    page. Clicking on one of the services generates a follow-up search based on that
    value. In this way the user can easily conduct multiple follow-up searches. Later
    in this chapter we will construct a profile which uses this field and point out
    how it is displayed and used.


    The visibility option for profile fields is not the only way you control access
    to data through your website, but it is one important way to limit profile field
    use and should be considered carefully as you build your profile. As a general
    rule, you can leave the setting as **User and User Admin** unless you are using
    the profile in a search capacity.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'If you have chosen either **Public Pages** or **Public Pages and Listings**
    for your visibility option, you will see two additional options appear in the
    form:


    +   - **Searchable**: Checking this option indicates that the field should be
    available on search forms. Give some thought to the type of field you''re working
    with when building out search forms. You typically will want only a small number
    of fields on the search form and several more fields included in the profile for
    display in the detail view.

    +   - **Results Column**: After conducting a profile search, the user is given
    a paginated list of all records matching the selected search criteria. From that
    list, they can click to view the record details or map the contact (if enabled).
    Select this option to include the field in the result list table. Keep in mind
    that your horizontal screen real estate is likely to be limited based on the website
    template/theme you are using. You will only want to include a handful of fields
    in the search result view.


    After completing the form, you may save it and return to the list of profile fields
    or click on **Save and New** to add additional fields.


    Once you''ve completed adding your profile fields and have returned to the field
    listing, you can edit, preview, disable, delete, or reshuffle the order of the
    fields. Returning to the main profile page where each of your available profiles
    is listed, you''ll notice several actions that can be taken with regard to them.
    In addition to links providing access to the profile fields and profile settings,
    you may:


    +   - **Preview** the profile in create view.

    +   - **Use Profile-Create Mode**, which sends you to the live profile page in
    **Create** mode (for collecting new information from users).

    +   - **Disable** or **Delete** the profile.

    +   - Access an **HTML Form Snippet**, which provides code for using the profile
    in the **Create** view outside the traditional means. The code generated is completely
    independent of your website, which means it could be used on other websites. Let''s
    say your trade association has a sister foundation established that is used for
    disseminating scholarships to students interested in the organization''s field
    of study. The two entities (the association and foundation) are separate, but
    are closely related. You publish a weekly e-mail newsletter and wish to encourage
    subscriptions through both websites, so you create a profile for this purpose
    and use the **HTML Form Snippet** code to insert the signup form on the foundation
    site while creating a standard menu link to the form on your main association
    site.

    +   - **Copy the Profile**, which facilitates the configuration process when you
    need to create a new profile that is similar in construction to an existing one.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'If you''ve read through this section for the first time without having a clear
    vision for how you want to use profiles, you may be overwhelmed. The challenge
    with profiles is that they are very flexible and can be used in many different
    ways, not all of which are immediately clear when you are new to the system. When
    setting up a profile, you shouldn''t be surprised if you need to return to the
    profile settings several times to tweak the options as you build and test it in
    various uses.


    # Profiles in action


    Let''s take some time now to look at profiles in action. We''ll return to our
    Food Pantry case study (FPAGM) to see how they make use of profiles to meet several
    data collection and management needs.


    # Empowering users to update information


    As with many organizations, one of the reasons FPAGM chose to implement a web-based
    constituent relationship management system is to expose real-time data to their
    members and allow them to edit those details without staff intervention.


    Employees of food pantries and food suppliers will have website user accounts
    that provide them with access to resources unavailable to the general public.
    Each of these employees will also have a contact record in CiviCRM where their
    contact details and event registrations are recorded.


    Once a user logs into the website, FPAGM wants to provide a link to allow them
    to review and update their contact details, including the address, phone, and
    newsletter subscriptions. They begin by constructing a profile with the desired
    fields. Each of the fields will be pulled from the Contacts and Individual field
    lists and will have visibility set to User and User Admin since the only person
    accessing the fields will be the logged-in user.


    FPAGM sets several fields as View Only, as they do not want the user to be able
    to modify their value. This will include the first name and last name fields.
    Locking these down ensures the contact doesn''t transfer the record to another
    user (for example, if an employee leaves a supplier and hands the login details
    to the new person replacing them), and helps ensure that each record is preserved
    for historical integrity. If new employees replace existing ones, we want to retain
    the old record and create a new one rather than rename the existing contact.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Collecting, Organizing, and Importing Data


    Several fields will also be designated as required to ensure that the association
    collects and maintains as much complete data as possible. The resulting field
    list is shown in the following screenshot. Care is taken to ensure the field order
    presents a logical display of information.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_216_0.png)


    Take note of the highlighted values in the Required and View Only columns. Also
    note that in many cases we have modified the default label for fields to make
    them more user friendly and context appropriate. For example, Postal Code is changed
    to Zip Code, and the address fields do not contain the location value as inserted
    by default when you select the field. The Mailing Lists field is actually the
    Groups list. You may recall that groups are commonly used to manage mailing list
    subscriptions. Any groups assigned with a Public Pages visibility will be listed
    when this profile is displayed.


    Before proceeding, FPAGM takes a moment to preview the profile and ensure that
    it is configured as desired. Note that the preview displays the profile in Create
    mode, which will exclude the View Only fields (Create mode displays a clean form,
    unfilled with existing data, and consequently, there is no View Only information
    to display).'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'FPAGM''s website is built in Joomla!, so they will add a link to this profile
    to the existing user menu which displays when a user logs in, and set the access
    level to **Registered** to ensure only authenticated users may access it. We will
    discuss the various options for exposing profile pages later in this chapter.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_217_0.png)


    The particular user displayed here (**John Doe**) is missing some required information
    (**Phone**). By using this form, along with the required fields, we will be able
    to encourage him (and other constituents) to provide a full set of contact details
    for their record.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Searching an online directory


    As a member of FPAGM, food pantries are primarily looking for two things: support
    and exposure. The Association exists to serve the needs of the food pantries by
    serving as a clearinghouse of information and a community to connect food pantries
    to each other and their suppliers. Pantries also want the community at large to
    know more about who they are, where they are located, and whom they serve. FPAGM
    will help achieve this through an online searchable directory.


    The directory should only list food pantry members in good standing. It should
    allow users to search based on address and service fields. To ensure that the
    profile searches current members, we first create a smart group to retrieve current
    food pantry members. While creating the profile, we use the **Advanced Settings**
    to limit the profile to this group.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_218_0.png)


    We then proceed to define and configure the profile fields. The following field
    list is created:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_218_1.png)


    Note that only a few fields are designated as **Searchable?**, and only a few
    are configured for **Public Pages and Listings** visibility (creating hotlinked
    results).'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'After conducting some testing, FPAGM adds the directory link to the main menu
    as a publicly accessible search tool.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_219_0.png)


    Notice that the Average Daily Clients field is searchable as a value range. This
    was an option available in the custom field definition.


    After conducting a search, we click on View to look at the contact details for
    one of the records returned by the search:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_219_1.png)'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Take a minute to review the original field settings for this example and compare
    how the selected options resulted in different searchable fields, result list
    columns, and the detailed view. For example, note how the **Public Pages and Listings**
    visibility for the **City** field resulted in a hyperlinked value in the detail
    view. Clicking that link would trigger a new search based on that value – all
    contacts in Metroville. While using that option, give a careful thought regarding
    the usefulness of enabling the follow-up hyperlink. You wouldn''t generally hyperlink
    a phone number or e-mail address, for example, as those are very likely to be
    unique to each contact record. General address fields such as city, state, and
    postal code would be good candidates for that feature, while street address would
    not (as it would only return contacts with the exact same address).


    # Including profiles in component pages


    As discussed earlier in this section, one important use of profiles is in conjunction
    with event registration and contribution pages (which includes membership sign
    up pages). By default, both of these types of pages will only require the e-mail
    address as part of the registration/contribution process. Generally, you will
    want to include other important fields such as the individual''s name, address,
    and communication details.


    We won''t walk through the creation of a profile for this purpose, but as you
    create one, keep in mind that you may include **Participant**, **Membership**,
    and **Contribution** fields (depending on its usage), in addition to **Contact
    Details**.


    When configuring the event or creating a contribution page you will be given the
    option of inserting two profile forms in the page; one will appear toward the
    top of the page, and the other toward the bottom. If you have enabled the multiple
    contact registration capability for event registrations, you may assign different
    profiles for these additional registrants to help streamline and simplify the
    registration process for the end user.


    # Search result views and batch updates


    Most of the time your use of profiles will result in some kind of form or other
    display on the public side of your website. However, there are two important uses
    that impact the backend administration of the site.


    When conducting a contact search in CiviCRM, the resulting list of contacts contain
    the contact name, address, e-mail, and phone number by default. Sometimes you
    may want different sets of fields displayed in the search result list. You can
    do this by creating a profile to serve as a search result view.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'You may select a profile when conducting an advanced search, or select one
    as the default search view by visiting **Administer | Configure | Global Settings
    | Search Settings | Default Contact Search Profile**. While using **Advanced Search**,
    use the **Search Views** drop-down to select your desired profile.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_221_0.png)


    Note that in order to be available as a search view, your profile must have the
    **Search** option selected in the profile settings.


    FPAGM wants an alternative search view that removes the **Country** column and
    includes the **Current Employer** field. When creating the profile for this purpose,
    they must select **Public Pages** visibility and indicate the fields which should
    be in the result column. After conducting a search for individuals located in
    the city of Metroville and choosing this profile view, users see the following:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_221_1.png)


    FPAGM also wants to make use of profiles for batch updating address fields and
    communication preferences. Batch updates let you edit selected fields for multiple
    records at once (up to 100 at a time), and include the ability to copy values
    from the first record to all subsequent records.'
  merge: -1
  img_proc: true
