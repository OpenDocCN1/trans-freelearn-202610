- pgno: 270
  md: 'Once you''ve confirmed that the e-mail is processing correctly, you should
    set up a cron job to process the URL on a regular basis. Once that is in place
    and tested, anyone can have their e-mails automatically filed in CiviCRM by CCing
    or BCCing the activefiler@example.com e-mail address.


    > When e-mails are processed by the script, the match to the contact is made based
    on the e-mail address. If the e-mail address does not exist in the system, a new
    contact record will be created. This has the potential to create partially complete
    contact records in your system very easily. Consequently, you should only use
    this e-mail address with staff; and never publicly expose the e-mail address lest
    you risk populating your database with bad records.


    # Summary


    This chapter outlined how to use CiviCRM to improve how you communicate with your
    organization''s constituents. The first section focused on the broader topic of
    how communications should be aligned with the organization''s overall CRM strategy.


    Subsequent sections gradually built from sending an e-mail to one or a few constituents
    to sending out bulk e-mails to hundreds or thousands. Not all of the focus was
    on e-mail communications. We also looked at using CiviCRM to print labels for
    postal mailings, recording those mailings as activities for all the recipients
    including a softcopy of the letter, and printing personalized letters.


    We then looked at strategies for list building using CiviCRM profiles to enable
    users to subscribe to bulk e-mail products like newspapers. While implementing
    profiles in recipe-style format, we took into consideration the differences and
    options present in Drupal and Joomla! installations.


    As lists are being built and constituents are communicated with, the role of CiviCRM
    groups become clearer. To that end, we reviewed basic strategies for organizing
    constituents into groups used for communication efforts.


    The chapter wrapped up with some loose end topics that are important for your
    overall communications branding and effectiveness. We reviewed automated messages
    generated by CiviCRM and briefly looked at how Smarty templating is used to construct
    them.


    Using a script that ships with CiviCRM we set up an e-mail box that can be polled
    by the system and have e-mails processed as activities in contact records (based
    on the FROM, To, and CC fields). This is a powerful way to connect your staff''s
    desktop e-mail client software (and daily communication) with the CRM.


    In our next chapter, we''ll look at a number of ways to use CiviCRM to support
    fundraising in the non-profit sector.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# 7


    # Fundraising: Money for Your Mission


    To accomplish their mission, non-profits need money to pay their operating expenses,
    (salaries, rent, office and other expenses), and support projects and programs
    that advance the purpose of the organization. This chapter will focus on using
    CiviCRM to raise funds through donations to support this work. In addition, we
    will touch on other forms of revenue generation, such as grant-writing, membership
    development, and sales of products or services.


    The need to actively raise funds is a necessity many in the non-profit and advocacy
    world wish they could ignore. Part of the reason they work or volunteer in the
    non-profit world is because of its orientation toward mission-based work rather
    than a profit-based bottom line. Nonetheless, your organization needs money to
    accomplish its mission and raising some or all of those funds through donations
    is generally essential. Thankfully, CiviCRM is good at helping organizations fundraise.


    This chapter is oriented towards fundraisers, those who support them with IT,
    communications and other services, and those to whom they report such as Executive
    Directors. To help you raise money better with CiviCRM, this chapter is generously
    sprinkled with sections and tips on fundraising approaches as well as on how to
    use CiviCRM. When marketing your organization and its services and products for
    fundraising purposes you will also find other chapters useful, particularly those
    that discuss contact targeting, communication, and outreach techniques.


    In this chapter, we will cover:


    +   - Developing a fundraising plan

    +   - Selecting an online payment processor

    +   - Initial configuration of CiviContribute and CiviPledge

    +   - Manually recording donations and pledges'
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   - Finding, examining, and acting on contributions and pledges

    +   - Implementing a fundraising appeal


    In the first section of this chapter, we provide an overview of how to create
    a fundraising plan and how CiviCRM plays a role in developing and executing the
    plan. If your interest is focused on learning more about how to administer and
    operate CiviCRM in fundraising activities, feel free to skip the opening section.
    If you are looking to quickly get online contributions up and running, start with
    the section on choosing a payment processor, then proceed directly to the last
    section on creating an online contribution page. Getting your payment processor
    account created and approved may take days or weeks while the rest of the configuration
    is a matter of minutes or hours. If you''re using CiviCRM for offline fundraising
    only, you will not need a payment processor but will still need to configure CiviCRM
    for fundraising as discussed in the third section.


    # Developing a fundraising plan


    Larger non-profits can benefit from hiring a staff person or two with a degree
    or diploma in fundraising and development who know how to develop and deliver
    a fundraising plan appropriate to the organization. Smaller ones may benefit from
    hiring a fundraising specialist as a consultant to help with their planning. The
    unfortunate reality is that many small and even medium sized non-profits place
    this responsibility on those without specialized training, and often aren''t able
    to provide adequate training budgets for them, given the competing priorities.
    If that describes your organization, plan on buying a fundraising book or spend
    a few evenings Googling how to develop a fundraising plan.


    Templates for fundraising plans will vary by author and type of organization.
    The common elements include:


    +   - A version of the organization''s mission

    +   - An analysis of the historical and current fundraising situation of the organization

    +   - A statement summarizing the case to give to the organization

    +   - Short and long term goals for fundraising, usually broken down by type of
    giving or fundraising program


    High-level plans for one to three years will be translated into work plans by
    laying out tasks with specific timelines for implementing programs and appeals
    across different channels.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'CiviCRM''s reporting and analysis tools can help in your analysis. The case
    for giving will undergird the creative material (such as text, graphics, and others),
    that will be developed for various programs and included in CiviCRM''s public-facing
    fundraising pages.


    # Segmenting by category


    Market segmentation is the process of dividing your potential donor audience based
    on certain characteristics and attributes. Doing so allows you to customize your
    message and method of communication to more effectively reach each subset of your
    market. In fundraising parlance, common ways of segmenting donor revenue by (slightly
    overlapping) categories are:


    +   - One-time gifts

    +   - Pre-authorized monthly gifts

    +   - Major gifts and planned giving

    +   - Legacy or bequest giving

    +   - Tribute gifts (in memoriam or in honor of)

    +   - Events (often sub-divided by event, such as Run for the Cure, an auction,
    or dinner)

    +   - Memberships and subscriptions

    +   - Corporate sponsorships, memberships, and partnerships


    Other forms of fundraising may be important to your organization, including grant-writing
    to foundations or government, or contests. In addition, some non-profits have
    fundraising revenue from merchandise sales of branded products such as T-shirts
    or mugs.


    This chapter focuses on fundraising segments that raise the most money for not-for-profit
    organizations, and touches on how to support other fundraising categories with
    CiviCRM.


    Capital campaigns and special appeals may receive donations that fall into any
    of the segments listed above. However, it is often useful to separate the revenue
    for those campaigns into separate line items in your fundraising plan and accounts
    since the method used to raise those funds and their stated purpose is generally
    different than on-going fundraising for normal operations.


    We will look at practical ways to count prospects in your existing donor and contact
    database in the Counting prospects with Advanced Search section.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Segmenting by channel


    The major channels (methods) of fundraising are:


    +   - Direct mail

    +   - Telemarketing

    +   - Online

    +   - Direct dialog or face-to-face


    CiviCRM can assist in all four of these channels. Different activities in CiviCRM
    are used in these channels and we will be devoting sections to each one.


    Cultivating prospects is essential for good CRM and fundraising strategies. Excellent
    prospect development channels exist in the offline world, including media events,
    advertisements, and brochure leave-behinds. You should consider giving a prominent
    role to the other channels in your CRM and fundraising plans. CiviCRM can assist
    in targeting via these channels. However, make sure that your CRM and fundraising
    plans are not centrally about how to use CiviCRM, rather they are about underlying
    development strategies.


    Some minor channels such as direct response television and kiosks will not be
    discussed. Supporting them with CiviCRM can be understood as variations of telemarketing
    (inbound rather than outbound) and direct dialog. SMS messaging is touched on
    as an extension of online fundraising.


    # Programs


    A fundraising program is usually defined by the primary objective of getting a
    segment of donors to take some action. Each program may have one or more campaigns,
    where a campaign may involve several communications centered on a single appeal,
    such as e-mails, direct mail, and telemarketing calls to renew a membership before
    it expires.


    Common types of programs you may want to include in your fundraising plan are
    listed below. Only a large development office with a big staff would be able to
    do a good job on many separate programs. Smaller and newer operations should have
    fewer. We believe a prospecting program is essential for all fundraising plans,
    and we''d encourage those who have renewal but not monthly giving programs to
    consider starting the latter.


    Below each type of program, we''ve indented typical strategic considerations or
    suggested approaches for developing or improving the program. These suggestions
    are not going to be appropriate for everyone, but may help you brainstorm ones
    that are appropriate for your organization''s fundraising plan:'
  merge: -1
  img_proc: true
- pgno: 275
  md: '+   - **Prospecting** (acquiring new donors, usually a break-even activity
    at best): Extra stewardship in the form of a special "thank you" and additional
    communication about what your organization does with the money donated will help
    to develop these relationships.

    +   - **First time renewals**: First time givers deserve extra attention to encourage
    the second gift and cement an on-going giving relationship.

    +   - **On-going renewals** (getting a new donation from those who gave last year):
    Encourage donation upgrades from the previous gift.

    +   - **Conversion of one-time donors to monthly donors**: Multi-givers (more
    than one donation in the last year) and multi-year givers are good prospects for
    this kind of program.

    +   - **Upgrading monthly donors**: After a year of monthly donations and regular
    communication about what the organization is doing with the donations, consider
    asking for an upgrade to a higher level.

    +   - **Prospecting for large donor clubs** (for example, a President''s Circle
    for those giving over $1000 per year): Investing the time and resources to set
    up large donor clubs with special access privileges for VIPs, events and so on
    is a good way to reward and motivate higher levels of giving. Total annual giving
    in the past as well as intelligence about ability to give are good ways to create
    this prospect segment.

    +   - **Upgrading between large donor** clubs: An end-of-year appeal for additional
    one-time donations to take contacts who are close to the next level of club up
    to it can be effective. Using the club benefits to encourage larger monthly donations
    is also a standard practice.

    +   - **Special appeals**: Special appeals may be useful when there is extensive
    news coverage of an event or chance to respond to an important opportunity/threat.
    If used too frequently, they can become ineffective.

    +   - **Capital programs**: These programs should be researched and planned to
    ensure that the project costs will be covered and the fundraising targets reached.
    Capital programs are often multi-year efforts and multi-faceted.

    +   - **Renewal of lapsed monthly donors**: This is a high-yield activity that
    helps address issues like expiry of credit cards and donors moving their bank
    accounts.

    +   - **Renewal of lapsed donors**: Another program with good long-term yield.
    You may find it cost-effective to telemarket lapsed donors in order of their most
    recent year of giving and ending when the cost per renewed donor reaches the cost
    of acquiring a new donor.

    +   - **Acknowledgement programs**: Demonstrating appreciation for donations through
    thank you calls and gifts may prove a good investment.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Money, donors, and prospects


    Given the goal amount for a fundraising program, industry standards can be used
    to develop the number of donors at different levels and the number of required
    prospects. This amounts to a pyramid with a few donors at the top giving the bulk
    of the money and many at the bottom giving a smaller portion of the total; typically,
    80 percent of the money raised in a campaign is given by 20 percent of the donors.
    This inverse curve holds across many organizations and levels of giving, and is
    likely to be evidenced for total donations by donor to your organization. For
    example, 25 percent of Canadian charitable donors gave 82 percent of the total
    donation (http://www.statcan.gc.ca/daily-quotidien/090608/dq090608a-eng.htm).


    Googling for "gift range calculator" yields several good results in the top 10
    results. The single top-level donation may be 10 to 25 percent of the total amount
    to be raised in the campaign. Generally, as the gift size halves, the number of
    expected gifts doubles or triples. It can be convenient to segment levels by reducing
    the donation amount by a quarter or a third rather than a half, with a corresponding
    reduction in the number of expected gifts.


    Well-established fundraising programs can expect to receive a larger percentage
    from larger gifts, and newer programs can expect to depend on smaller donations
    for a larger percentage of their goal.


    In traditional capital and major gift fundraising, you need about four prospects
    (contacts for whom you have some reason to believe that they can give at that
    level) for each donation at a certain level. More sophisticated gift range calculators
    factor in the likelihood of prospects at one level ending up giving at a lower
    level; this reduces the number of prospects expected to be required at lower levels
    in the gift range pyramid.


    A range of communications and outreach activities are deployed to convert the
    campaign prospects to donors such as e-mails, letters, phone calls, meetings,
    and so on. Each of these appeals has a much lower conversion rate than 25 percent.
    The plan for the type, number, and order of the communications often varies by
    segment, with higher value segments getting higher touch communications like personal
    visits, meetings, and telemarketing. Successfully raising significant amounts
    of money from low-value contributions usually involves greater automation and
    less paid time by humans. Volunteer time is often a precious commodity for non-profits
    that is best spent on higher value activities.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# # Benchmarking


    As you develop your fundraising plan or review your existing one, it is useful
    to compare it with benchmarks and surveys. Direct mail remains the mainstay of
    fundraising at large established non-profits, bringing in over 80 percent of donations
    according to a recent study (http://www.slideshare.net/artzeinteractive/artez-interactive-from-donor-acquisition-to-fundraising-performance-benchmarks-for-nonprofits).
    However, it is notable that the average online donation received and the five-year
    value to the organization of online donors is greater than direct mail donors.


    Assumptions in your plan about the size of lists that need to be contacted in
    order to generate a certain number of donations can be calibrated against benchmarks.
    Generally, the lower touch/lower cost communication channels have lower conversion
    rates. For example, one recent survey found that e-mail fundraising conversion
    rates were 0.13 percent (http://www.e-benchmarksstudy.com/2010.html), while the
    conversion rate for a direct mail donor solicitation to a list of previous donors
    tends to average around one to two percent. Good surveys provide actionable recommendations,
    such as this one''s advice to focus on improving click-through rates in order
    to join the top-performing group of e-mail fundraisers.


    So far in this section, we''ve been focusing on a top-down approach for planning
    your fundraising, moving from fundraising goals down to the number of prospects
    required in each segment. CiviCRM has a number of reports that provide an analysis
    of how your organization has been doing in its own fundraising, as we''ll see
    below in the *Reporting* section and in reports described in other parts of this
    book such as the chapters on events, membership, and communications. These reports
    provide a bottom-up analysis of historical data for your organization that should
    be integrated with the results of the top-down planning in two ways:


    +   - First, you should compare your organization''s metrics against benchmarks
    like those mentioned above to help identify areas of strength and weakness. Larger
    surveys tend to have more reliable data while ones for your sector and region
    may provide more appropriate comparisons despite their smaller sample. These comparisons
    should help provide elements of a more general SWOT analysis (internal strengths
    and weaknesses, and external opportunities and threats) to inform your fundraising
    plan. Where have we done better or worse in the past compared to standard metrics?
    Do we know why? How can we address our weaknesses and leverage our strengths?'
  merge: -1
  img_proc: true
- pgno: 278
  md: '+   - Second, you should review your existing donor base by segment to determine
    whether the number of prospects presumed by your plan can feasibly be attained.
    Your plan may need to be adjusted to include actions to improve the size of prospect
    lists through list rentals, prospect development activities like asking board
    members to review their contact lists, or research into high net worth individuals
    in your area or with interests in your sector. When all those options are considered,
    you may decide your fundraising goals need to be raised or lowered for particular
    segments or programs.


    The rest of this chapter will explain how CiviCRM, and particularly its CiviContribute
    component, can be used to implement your fundraising plan. As a result of the
    particularities associated with raising funds via events and through memberships
    and subscriptions, and the special support that the CiviEvent and CiviMember components
    provide, later chapters will be devoted to using CiviCRM for those types of fundraising.


    # Selecting a payment processor


    CiviCRM may be used for fundraising with or without processing online contributions.
    For example, you could use CiviCRM to support a direct mail and telemarketing
    operation and require online donors to mail in checks. You can also accept in-kind
    donations online without setting up a payment processor. However, the power and
    potential of the software is better realized when you implement a fully integrated
    online payment system.


    Some organizations continue to use external online donation systems as they begin
    to use CiviCRM, which involves transferring the transactions to CiviCRM in order
    to use it as their centralized CRM for segmentation and reporting. This is a cumbersome
    approach given the ease of using CiviContribute to process online donations.


    Most organizations doing online donations, event registrations, and membership
    and subscription payments will find it worthwhile to set up online payment processing
    in CiviCRM.


    Payment processors, sometimes known as payment gateways, assist in transferring
    payments from payers to you, the payee receiving the funds. CiviCRM relies on
    the processor to do the complicated work of connecting banks and credit card/
    debit card companies together to make sure money is properly moved from the donor''s
    account to yours. The CiviCRM core team and the CiviCRM community have worked
    to create plugins for about a dozen payment processors. Information on each, and
    links to configuration pages for some of them, can be found at http://wiki.civicrm.org/confluence/display/CRMDOC32/CiviContribute+Payment+Processor+Configuration.
    In order to use CiviCRM for online financial transactions, you''ll need to choose
    one of these payment processors, set up an account with them, and configure CiviCRM
    to work with it.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'If you are just starting out and trying to decide among several processors
    available to you, the number of considerations to take into account when choosing
    a payment processor can be bewildering. We recommend starting your decision by
    determining which ones are available in your country. For most CiviCRM users,
    you will have a variety of options.


    You may also find that none are available in your country or that you would like
    to use one that is not yet supported. For example, you may be using a payment
    processor for your point-of-sale terminal or check processing, and would like
    to add online payment processing to your existing account with them. There are
    instructions available for developing new payment processor plugins for CiviCRM
    (visit http://wiki.civicrm.org/confluence/display/CRMDOCT2/Creating+Additional+Payment+Processor+Plugins).


    Most payment processors provide technical documentation to assist developers in
    creating a plugin for packages like CiviCRM, since it increases their volume of
    business. A variety of consultants are available to assist you and the community
    in creating and supporting a plugin for other payment processors (http://civicrm.org/professional).
    If you find that there are compelling reasons for using a different one, others
    might want to use it as well.


    E-commerce websites, including sites that accept donations to non-profits, interact
    with payment processors in two common ways as illustrated in the following two
    diagrams:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_279_0.png)


    In the first architecture, the e-commerce website itself securely handles the
    credit card or other financial account information by talking to the payment processor
    behind the scenes, while the user waits for payment to be processed.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_279_1.png)'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Fundraising: Money for Your Mission


    The second approach, is a low-end one in which the e-commerce website interacts
    with an external payment processor that serves its own user-facing pages. In this
    method, your e-commerce website calculates what needs to be paid, then sends the
    user to the payment processor''s secure website where the payment is handled,
    after which the payment processor site sends the user back to the e-commerce site.


    If configured properly, both systems will transmit sensitive information like
    credit card numbers in securely encrypted methods. Since CiviCRM does not store
    sensitive information regarding the transaction, both the methods offer good e-commerce
    security.


    While both approaches are viable and effective, there are pros and cons to both:


    |  | External Hosting | Internal Hosting |

    |---|---|---|

    | SSL certificate purchase and setup required | No | Yes |

    | Potential security risk to credit card data | Extremely low | Very low |

    | Available on low-end shared hosting | Yes | No |

    | Need to keep your server secure | High | Very high |

    | Loss of your visual branding | Yes | No |

    | Donors exposed to possibly irritating payment processor messaging | Yes | No
    |

    | Usability | Poorer | Better |


    We recommend using a payment processor that offers internal hosting for all but
    the lowest volume sites. If you are new to online payments and don''t yet know
    what kind of volume your constituents will generate, consider implementing the
    simpler external hosting solution until you can gauge the response and determine
    if internal hosting is worth the additional cost.


    Internal hosting requires you to obtain and set up an SSL certificate because
    your site must communicate securely with your users'' browsers to process their
    credit card details. External e-commerce hosting, where your users are transferred
    to your payment processor''s site to process the transaction, is secured using
    their SSL certificate.


    SSL is a communications protocol that allows your users'' browsers to talk to
    your server without anyone listening in. It does this by securely encrypting the
    information that goes back and forth using special keys. Internet users are becoming
    familiar with the fact that pages with `http://` at the start of their address
    are not secure, while those with `https://` can be secure. Browsers also display
    a small lock icon when displaying secure pages:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_280_0.png)'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'The cost of SSL certificates continues to come down as they are commoditized,
    and the ease of installing them continues to increase. Hosting providers like
    **RimuHosting** remarket **RapidSSL** certificates for as little as USD$40 including
    installation. Security companies continue their efforts to create demand for higher-priced
    SSL products with more features, such as dynamic "Certified by" logos for your
    site, having your organization name appear in the browser address line, and higher
    levels of warrantee. Try shopping around for a good price on whatever certificate
    you select (http://www.namecheap.com/ssl-certificates is a good source at the
    time of writing this book).


    While considering different payment processors, other factors come into play as
    well, such as which credit cards are supported, the cost of different options,
    and whether they support advanced features such as recurring contributions. In
    our view, it rarely makes sense to save money on payment processors at the expense
    of usability since just a few lost donations are generally more "expensive" than
    the savings. However, there are often significant differences in the cost of payment
    processors that provide the same level of usability. These differences are highly
    dependent on the number and size of donations and what credit card or other payment
    instrument is used.


    One factor that can play a significant role in cost is the payment processor and
    whether it requires you to have a merchant account. These usually involve separate
    charges for your bank, though sometimes they may be bundled into the payment processor''s
    charges. Automatic transfers into your merchant account instead of requiring regular
    manual interventions to get money out of your account at your payment processor
    can prove useful and worthwhile for higher volume organizations.


    Here are some of the charges you should ask about when comparing the cost of different
    options, even though they may be minimal for some processors and/or merchant accounts:


    +   - Initial payment processor account setup charge

    +   - Initial merchant account setup charge

    +   - Consulting or staff time to deal with payment processor and merchant account
    for setup and approval

    +   - Fixed monthly and/or annual costs for payment processor and merchant account

    +   - Commissions as a percentage of charges for payment processor and merchant
    account, sometimes with discounts for higher volumes

    +   - Per transaction charges for payment processors and merchant accounts

    +   - SSL certificate cost for the first year and annual renewal costs

    +   - SSL installation cost for new and renewed certificates'
  merge: -1
  img_proc: true
- pgno: 282
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 283
  md: 'Organizations claiming non-profit or a charitable status seem to have additional
    security scrutiny. Further, if your bank account name does not exactly match your
    PayPal account name, you may have difficulty getting your money out as PayPal
    will not release funds from a PayPal account in the name of John Smith to a bank
    account under Judy and John Smith''s name. Obviously, having your funds frozen
    or unavailable for undetermined periods can cause significant issues in your normal
    operations.


    We recommend getting started early on setting up a payment processor account and
    a merchant account, if necessary. This can take days or weeks to complete, and
    may involve providing the founding documents of your organization, which may be
    in a safety deposit box, and official certification of non-profit status.


    # Initial fundraising configuration


    Two components in CiviCRM are addressed solely to fundraising matters: CiviContribute,
    which handles donations, and CiviPledge, which is designed for pre-authorized
    payments or promises to make future payments. This section describes how to configure
    them.


    As CiviContribute supports the financial aspects of the CiviEvent and CiviMember
    components, you will need to configure it to record or accept payments for event
    registrations, memberships, and subscriptions, even if your organization does
    not accept pure contributions but only payments in exchange for such things.


    # Configuring CiviContribute


    The first task in configuring CiviContribute is to turn on the component if it
    is not yet enabled:


    +   1. Click on **Administer | Configure | Global Settings | Enable CiviCRM Components**.

    +   2. If **CiviContribute** appears in the left column, highlight it, and then
    click on **Enable**.

    +   3. Click on **Save**.


    Next, make sure that information about contributions is displayed in appropriate
    places throughout the system:


    +   1. Click on **Administer | Configure | Global Settings | Site Preferences**.

    +   2. Ensure that **Contributions** is checked for **Viewing Contacts**, **Contact
    Search**, and **Contact Dashboard**.

    +   3. Click on **Save**.'
  merge: -1
  img_proc: true
- pgno: 284
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 285
  md: '![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_285_0.png)


    CiviCRM is also currently limited in the fact that it can only attribute a single
    contribution payment to memberships or event registrations. However, work is currently
    being done to extend the data model to accommodate partial payments and other
    bookkeeping and accounting enhancements. This could potentially be used to record
    multiple distinct payments, each with their own contribution type, against a single
    "purchase", such as an event registration. Watch the CiviCRM blog for more information
    as this functionality is developed.


    # Configuring payment instruments


    CiviCRM stores information about how payments are made as payment instrument information.
    Payment instruments are the method of payment, such as checks, cash, EFTs (electronic
    funds transfers), credit cards, and debit cards. Your organization most likely
    does not support all of these default instruments for accepting payments.


    To review and adjust payment instruments:


    +   1. Click on **Administer | CiviContribute | Payment Instruments**.

    +   2. To **Disable**, or **Delete** a payment instrument, click the respective
    link to the right of the relevant payment instrument.

    +   3. To edit a payment instrument, click the **Edit** link to the right of its
    name, then enter or adjust the values in each field, and click on **Save**.


    # Configuring accepted credit cards


    There is a separate interface for specifying what credit cards may be accepted
    (for example, Visa, Amex). Do not confuse payment instruments with individual
    types of credit cards. In particular, do not create a separate payment instrument
    for each one. Instead, do the following:


    +   1. Click on **Administer | CiviContribute | Accepted Creditcard Options**.

    +   2. To **Disable**, or **Delete** a credit card option, such as Amex, click
    on the respective link to the right of the relevant credit card option.

    +   3. To add a type, click on the **Add Accept Creditcard** button and enter
    the relevant information.


    Be sure to review your payment processor options and limitations when setting
    up your system to confirm which card types they accept.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Configuring a payment processor


    In order to accept payments online, CiviCRM requires you to configure a payment
    processor, as discussed earlier in this chapter. Different payment processors
    have different parameters, options, and setup instructions. To determine how to
    set up and test your account with specific payment processors, visit http://wiki.civicrm.org/confluence/display/CRM
    DOC32/CiviContribute+Payment+Processor+Configuration, click on the name of your
    payment processor, and follow the relevant instructions, or contact the processing
    company for more guidance.


    > In future versions, payment processor integration will be handled through an
    extension mechanism. You may need to search elsewhere on http://wiki.civicrm.org
    for the name of your payment processor as that system is implemented.


    For configuring CiviCRM to work with the payment processor, follow these steps:


    +   1. Click on **Administer | Configure | Global Settings | Payment Processors.**

    +   2. Enter a **Name**, perhaps a **Description**, and the **Processor Details**
    for the **Live** and **Test Payments** as per the instructions for your payment
    processor.

    +   3. Click on **Save.**


    If you have chosen a payment processor that requires your site to have an SSL
    certificate, you will need to purchase and install one. If you are using a hosting
    provider, they are likely to suggest preferred certificates and offer installation
    services for a fee. If you do not have a managed hosting arrangement that provides
    this service, you will need to have someone with system administration skills
    and sufficient server access install it. The technical procedures vary between
    operating systems and by certificate issuing authority, and are non-trivial for
    those lacking system administration experience.


    Low cost and mid-range SSL certificates support only a single domain or sub-domain.
    This includes distinguishing between the root and www form of a domain. For example,
    a certificate for https://www.mydomain.org will not work for https://mydomain.org
    and vice-versa. You can purchase and install certificates for both domains, or
    buy a higher priced wildcard certificate that covers both.'
  merge: -1
  img_proc: true
- pgno: 287
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 288
  md: '+   1. Run a test payment or two for a small amount on a contribution page
    which can be configured as described in the *Creating an online contribution page*
    section towards the end of this chapter.

    +   2. Ensure that the payments are received by the payment processor.

    +   3. Verify that the funds are deposited properly in your bank account, either
    automatically or manually as the case may be.


    Note that PayPal and some other payment processors have sandboxes that are more
    difficult to use than their production systems, so it can be faster and less problematic
    to just configure and test using real payments against their live servers.


    It is also a good idea to have your bookkeeper review things at this point to
    make sure they can properly integrate online payments into your accounting procedures.
    Sometimes, there are issues with how payment processors batch transactions from
    online payments with those from point of sale terminals that can make things difficult
    to track. You may need to review how specific transactions stored in CiviCRM can
    reliably be correlated with deposits in your bank account and vice-versa. To review
    a report that may prove helpful in this regard, click on **Reports | Bookkeeping
    Transactions Report.**


    # Configuring premiums


    Premiums are thank-you gifts that may be provided to donors to encourage them
    to donate. They are often used as an incentive to give more. For example, anyone
    giving $50 can receive a coffee mug with your organization''s logo, while those
    giving $100 can choose to get a T-shirt with the logo. All premiums are specified
    on a site-wide basis before being enabled for particular CiviContribute pages.
    Constituents donating through premium-enabled contribution pages will always have
    the option of declining premiums. By making these gifts optional, you reduce wasted
    resources on unwanted premiums.


    There is no need to configure premiums in order to use CiviCRM for fundraising,
    and if you are just getting started, you should likely focus on more essential
    basic functions. As particular appeals begin to make use of premiums or new premiums,
    you will need to configure or reconfigure your site-wide premium options before
    they can be enabled for particular pages. Here is how to add a premium:


    +   1. Click on **Administer | CiviContribute | Premiums (Thank You Gifts)** or
    **Contributions | Premiums (Thank You Gifts)**.

    +   2. Click on **Add Premium**.

    +   3. Enter information in the fields as it should be displayed to potential
    donors, starting with **Name**.

    +   4. **Description** can be promotional text or just an explanatory description.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '+   5. **SKU** is useful if the item is for sale elsewhere on your site.

    +   6. For **Premium Image**, use the display image and thumbnail from these locations
    on the web option to display product images from your own site (for example, in
    a Drupal Ubercart store), as this will prevent them from getting out of sync when
    the store images are updated.

    +   7. **Minimum Contribution Amount:** CiviCRM will enforce this minimum wherever
    the premium is enabled, displaying an error message if someone asks for the premium
    but doesn''t contribute at or above this amount. You can create another premium
    for the same item if you would like to set a different minimum contribution amount
    for it on a different contribution page.

    +   8. **Market Value:** Some jurisdictions require tax-deductible charitable
    receipts to be issued only for amounts that exclude the fair market value of any
    premiums provided. If that applies to your organization, and this premium will
    be used on pages accepting tax-deductible payments, enter a value here.

    +   9. **Actual Cost of Product:** Enter a value here to improve the calculation
    of the net return from offering the premium and also the overall appeal.

    +   10. **Options:** Provide a comma-separated list of options, such as size or
    color. The comma-separated list ignores line breaks, so text after the last comma
    on one line is put together with text at the beginning of the next until a comma
    is encountered. If you want to provide options for two aspects of a product, such
    as both color and size, you either must enter every combination as a separate
    option or do some custom programming.

    +   11. **Subscription or Service Settings.** Custom programming can allow the
    information collected here to be used to provide temporary access to downloadable
    files such as reports or songs in your CMS or to memberships or subscriptions
    managed by CiviCRM. Alternatively, staff can manually administer such benefits
    once they receive an e-mail or other notification of a donation.

    +   12. Click on **Save**.


    You can return to add, modify, disable, or delete premiums at any time. If premiums
    are shared across multiple contribution pages, be sure to understand the impact
    of any modifications before you begin editing them.


    # Configuring price sets


    Price sets are used to construct more complex sets of donation-level options.
    In most cases, you will create a simple list of donation levels and include the
    option for donors to enter their own custom amount. However, if you require multiple
    sets of options, or quantity-based purchasing, price sets can be used.'
  merge: -1
  img_proc: true
