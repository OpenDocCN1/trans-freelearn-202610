- pgno: 70
  md: '# Rethinking organizational processes


    We''ve already underlined the centrality of orienting analysis and discussion
    of business processes towards accomplishing the mission of your organization.
    We''ve also emphasized on putting the constituent at the centre of thinking about
    business processes. Throughout, we''ve tried to communicate the benefits of brainstorming
    new ways to do the same things and reaching outside the box to consider new ideas.
    We''ve also touched on the important but painful topic of ceasing to do some of
    the things that have always been done. Resistance to change is strongest when
    existing processes are removed and the least when new ones merely supplement the
    old.


    There isn''t space in this book to adequately cover all of the issues involved
    in organizational design and business process re-engineering. We''d like to just
    touch on a few topics at the process and content levels. First, the cost of organizational
    change means that there needs to be significant benefits before deciding to proceed.
    In any reorganization, there will be disruption as people worry about what the
    change will mean to them, as teams work through all the details, and as people
    are reassigned to learn new responsibilities.


    Second, ensure you set the objectives — responsiveness, cost efficiency, meeting
    new needs, and so on—and the criteria for evaluating the organizational change
    before evaluating the alternatives and selecting a solution. There will always
    be winners and losers in terms of budgets and desirable assignments. These will
    affect the perceptions and behavior of participants in the process, even among
    those with the best of intentions.


    Aim to design the organization so that the business units can be responsible for
    delivering sizable chunks of the CRM strategy and be accountable for the metrics
    under their control. Every organizational design has its pros as well as cons.
    Problems often arise when there isn''t a good alignment between functional units
    that cross organizational unit boundaries. The processes here need particular
    attention. Mismatched or inappropriate metrics on either side of the boundary
    may result in unnecessary friction in the prospect funnel, with constituents falling
    off the ladder of engagement due to poor experiences.


    For example, every additional field and every additional required field on a sign-up
    form reduces the number of users who will complete it. Tensions may develop if
    one unit designs a signup form with only name and e-mail fields in order to optimize
    the number of signups. This wouldn''t provide sufficient information to the staff
    responsible for mapping the contacts to cities or regions, or eliminating duplicates
    in the database. Inter-organizational tension along these lines is common; creating
    a clear system for addressing competing interests is unfortunately, less common.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'The second content-related issue meriting attention is the need for changes
    in roles, training, compensation, and so on as part of the transition. Specifically,
    there may be some new online organizing as well as CRM administration responsibilities
    that require skill sets not currently found in the organization. The ability to
    administer various aspects of CiviCRM is not so different than what is required
    for other information management systems. However, online organizing for fundraising,
    events, membership, volunteer recruitment, or just broadcast communications like
    blast e-mails is different from the more traditional forms of these activities.
    Social media outreach, if a part of your CRM strategy, has very specific needs
    for effective and timely decision making, as well as skill in projecting both
    personal tone and organizational themes. Your organizational plan should include
    not only initial training, but also ongoing training to reinforce the skills after
    they have been used.


    After your plan is in place, you will need to pay attention to implementing the
    more organizational side of CRM strategy. We will not be discussing that in detail,
    but some important points include the need to communicate the plan and intentions
    behind it clearly and repeatedly. Discussion and response to difficult questions
    will be required, including incorporation of valuable suggestions into the plan.


    While trying to make your constituents the focal point of your CRM strategy, we''ve
    deliberately discussed the technology that CiviCRM provides, but only indirectly.
    While it is true that technology solutions should generally follow rather than
    lead, it is also true that organizational maturity and resource constraints may
    mean that your organization will best benefit from using the processes that are
    well supported by CiviCRM.


    In many areas, CiviCRM provides great flexibility in how it can be used. It supports
    a wide range of business processes and the challenge is more in simplifying and
    standardizing how it will be used, rather than in devising new ways to customize
    it. CiviCRM processes are based on requirements from leading civic sector organizations
    and usually are the result of extensive community consultation. That''s not to
    say there is no room for improvement or that your organizational needs will not
    require alternate process structures. However, the time-tested effectiveness of
    CiviCRM''s workflows will warrant consideration as you consider your own organizational
    processes.


    If you find that you have a business process that does not seem well-supported
    by CiviCRM after reviewing CiviCRM documentation, it is usually best to post a
    question into an appropriate CiviCRM forum at http://forum.civicrm.org/. You may
    find you just missed something obvious, or that there is a different but better
    way to accomplish your objective. Alternatively, you may find yourself advised
    to adopt a work-around or to help in developing new features, if you have available
    resources.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Determining your needs


    Depending on your process – Agile, or more traditional – you will determine your
    needs in a less or more formal way. Whatever your process, some approaches are
    always appropriate.


    First of all, it''s useful to review the functionality, data structures, and data
    in your existing systems. Functionality is the easiest to discuss. It provides
    a sense of the sets of fields – custom data and profiles in CiviCRM''s terminology
    – that may be needed in the new system. When analyzing existing systems, don''t
    be limited to your primary contact database alone. For example, if you use paper
    sign-up sheets at events or have other paper, e-mail, or web-based data collection
    forms that are not part of your primary system, be sure to include them in the
    discovery analysis. With data structures, you''ll be able to start mapping out
    how to migrate data from the existing to the new system. As part of this, you''ll
    be able to identify the custom fields that may be needed, and others that are
    no longer needed. Enduring information such as constituent interests is worth
    keeping, while transient information such as their food preferences at an event
    is less useful.


    Resist the urge to just dump everything into the new system thinking that it will
    be sorted out later. Clutter appears on every system over time, bogging down the
    system, its interface and its users. Now is the time to pare back unnecessary
    complications, making the system easier to use and easier to train people to use.
    It will also help to reduce the scope of the data migration effort, which is often
    a costly part of a CRM initiative.


    Looking at the data will often provide a sense of the scope required in the cleanup
    effort. You''ll need to do some cleanup just to get the data into the new system
    (for example, dates have to all be in the same format), and removing garbage in
    your system while you''re at it is usually a good idea. You''ll find when you
    are looking at the data and deciding how to clean it up, that it can be useful
    to have some standards in place. For example, how addresses are entered, whether
    honorifics like Ms. or Mrs. are used, and standardizing values in some free form
    fields so the data can be more easily retrieved and entered from a select widget.
    To reduce the scope of work, it''s best to start by deciding what tables and records
    can be thrown away.


    Interviewing users at the data entry, operational reporting, and executive levels
    gives a useful and diverse insight into the most important data and process needs.
    You''ll benefit from knowing the strategy in the Executive Director''s head, the
    important and unnecessary elements in reports, and the workarounds regarding use
    and data entry currently employed by front-line staff. When people experienced
    with CiviCRM do these interviews, there can also be good tradeoffs negotiated,
    such as balancing what is easy or hard to implement against its relative importance
    to users.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Using the existing system as a reference helps to ground solicitation of other
    needs. We like to ask users about the important new things the new system should
    do, what they would like to be included in the new system, and what is really
    problematic and irritating about the old system. Some "nice to have" features
    can be included with little effort in CiviCRM. Identifying "pain points" in using
    the current system provides valuable information on how the new system will be
    evaluated.


    To get organizational buy-in for the CRM initiative and create project momentum,
    plan to provide short-term deliverables. This could include wire frames, screenshots,
    and flow diagrams that demonstrate how the functionality discussed in the discovery
    and specification phase will (roughly) translate to forms, pages, and workflows.
    Important new functionality, nice-to-have features, and eliminated pain points
    are all fertile quick-win areas where you can demonstrate a commitment to improving
    user experience.


    Asking everyone for feedback on possible implementation timelines is also useful
    – though be cautious about inadvertently making implied time-based commitments
    without first gaining a complete picture of the project scope. Reporting deadlines
    to funders, having functionality in place for certain events, and knowing crunch
    periods when it would be problematic to run old and new systems in parallel are
    all needs that should be reflected in your plans.


    # Functional requirements


    In this section, we''re going to delve more deeply into the functional areas supported
    by CiviCRM. We''ll be reviewing the kinds of questions to ask, often of a more
    technical nature, that will help in planning your implementation.


    # Contact record management


    CiviCRM has three basic types of contacts: Individuals, Households, and Organizations.
    The fields and kinds of relationships that can be created may vary by the type
    of contact. For example, individuals have first and last names, current employer
    and job title, while organizations have an organization name, a legal name, and
    current employees. CiviCRM''s rich model for storing address, phone, and e-mail
    information is shared by all three types of contacts.'
  merge: -1
  img_proc: true
- pgno: 74
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 75
  md: '# # e-Newsletters and bulk e-mails


    Your organization probably sends or could benefit from sending blast or bulk e-mails,
    such as newsletters and appeals. CiviCRM is good at sending e-mails to lists and
    tracking which ones are opened, clicked through, and forwarded. Ask the following
    questions about your bulk e-mail needs:


    +   - What bulk e-mail lists exist and are planned?

    +   - How are contacts added to the list? Ensure that appropriate authorization
    is being acquired for every bulk e-mail sent to every e-mail address. Also, make
    sure there are appropriate mechanisms in terms of prominent website blocks and
    subscription enticements so that you have enough list growth to feed your contact
    funnel.

    +   - How many custom templates with graphics are required for each e-mail list?
    Sometimes different communication products are mailed to the same list with each
    requiring its own template.

    +   - How big is each list and how often is it mailed? This may affect server
    sourcing in terms of CPU resources, bandwidth, or perhaps e-mail caps.

    +   - How important are high deliverability rates and white listing? Paid services
    not included in CiviCRM can be set up to assist in monitoring whether various
    hosts and domains like AOL, Hotmail, Gmail, or Sympatico are blocking your e-mails.
    Issues can be resolved either by using tools to assist in making your e-mail content
    more compliant with their ever-changing anti-spam rules, and/or through discussions
    with them. Monitoring whether your domain or server gets included on various spammer
    blacklists and promptly dealing with issues in this area may also be important
    for your organization.


    # # Fundraising


    Will your CiviCRM installation need to accept online payments? If you want to
    accept online payments for events, memberships, or donations you''ll need to set
    up arrangements with an online payment processor such as PayPal, Google Checkout,
    or Authorize.net. Some of these require your users to go to pages on a different
    site. These are generally easier to set up and potentially reduce your risk and
    liability, though they provide a poorer user experience and will cheapen the feel
    of your site. CiviCRM also supports fully integrated processing where the user
    never leaves your site while processing payment. While generally a better experience
    for the end user, there are additional costs and PCI compliance responsibilities
    you accept when using these methods.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Getting donors to set up recurring monthly payments provides a steadier and
    generally larger donation revenue stream. Not every payment processor supports
    them. Some processors have discounted packages that exclude that functionality.
    If recurring support is something you require, be sure to research the processor
    options available with regard to this feature. You also need to check that the
    popular payment methods in your area are supported (for example, Amex and MasterCard
    are not supported by some payment processors).


    There are a number of different service charge models employed by different payment
    processors. You will be able to compare and shop better if you know the average
    number and amount of transactions you process. You may be able to get a better
    deal if you consolidate payment processing with a single provider. For example,
    including a PoS (Point of Sale) terminal already used and potentially dealing
    with a credit union or bank that handles your checks may result in significant
    savings.


    > If you are just moving into electronic payment processing, be clear about your
    needs for accepting payment at the door of events. You may need a PoS terminal
    if there is no Internet connectivity.


    Development and fundraising staff will be pleased to know that CiviCRM supports
    pledges of future gifts. When soliciting CRM requirements from staff, make sure
    to determine how they view their prospect funnel and what their needs are for
    segmenting contacts into different groups. They will probably have the most sophisticated
    needs in these areas in your organization, and may have techniques that can be
    deployed successfully for volunteer recruitment and event marketing.


    Larger and older organizations are more likely to have direct mail and telemarketing
    campaigns. Gather information on the data export and import requirements for their
    systems and external providers.


    # Memberships and subscriptions


    A membership can be defined as time-defined access to organization benefits. In
    traditional member-based organizations, a contact demonstrates support for the
    organization and alliance with the organization through membership, and will generally
    receive benefits and services as a result of that relationship. However, the CiviCRM
    membership model can also be used in organizations that sell subscriptions or
    other service-type offerings where the "member" receives access for a defined
    period of time.'
  merge: -1
  img_proc: true
- pgno: 77
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Drupal or Joomla! for registrants to an event.


    # Grant management


    Does your organization provide grants or disbursements to individuals or organizations?
    Examples could be a grant for first and last month''s rent to help a homeless
    person get stable housing, fellowships for artists, or program grants to organizations
    working in an environmental policy. The CiviGrant component helps organizations
    like yours by recording when applications are received, the decision to approve
    or turn down the application, when payments are made, and whether follow-up reports
    on the grant have been received.


    You''ll need to know what information is tracked about your grants. The fields
    in the application form are the best starting place; they are supplemented by
    internal forms, such as fields to record reviewers'' ratings.


    Although the CiviGrant component was not designed for tracking your organization''s
    applications for grants, some CiviCRM users have found it can be used for this
    purpose with only a minor tweaking of field names. If your organization needs
    to track its grant applications, review the typical fields that are tracked, starting
    with application closing dates. Some may need to be supported through custom fields.
    If your needs extend beyond the structures provided in CiviGrant, consider using
    the CiviCase tools for this purpose.


    # Activities


    CiviCRM uses the term "activity" to indicate any communication that transpires
    with constituents or other actions related to your interaction with the contact.
    CiviCRM automatically records a number of activities, including donations received,
    registrations for events, memberships purchased, and e-mails sent. You can also
    use it to record interactions such as meetings, phone calls, and e-mails sent
    from your normal e-mail client. While the full use of activities may add some
    administrative burden, the benefits are significant as you will be creating a
    history of interactions with a contact that can be consulted later. Being able
    to pull up details of a call taken a few months ago by a different staff person
    can help quickly resolve an issue rather than forcing it to be addressed from
    scratch.


    Are there other kinds of activities you would like to record about your constituents
    beyond the types preconfigured in the system? For example, will you use Activities
    to track mail correspondence, or speeches given by legislators on topics of concern
    to your organization, media stories published by particular journalists or outlets,
    or create some integration with Twitter to record tweets including hash tags of
    interest?'
  merge: -1
  img_proc: true
