- pgno: 423
  md: '# 12

    Telling Your Story: Building Reports


    We''ve spent the last 11 chapters exploring the many ways we can capture and store
    information about constituents, work with contact records, perform bulk actions
    on records, create forms and expose data on our site, and build multi-dimensional
    depth in our organization''s data.


    With this increasing breadth of information, our next goal is to retrieve and
    display our data through reports. In this chapter, we will:


    +   - Discuss the purpose, terminology, and basic concepts of CiviCRM reports

    +   - Review the tools available for generating and publishing reports

    +   - Put these tools in context within your organization


    # Getting to the bottom line


    What is a report?


    Ok, that may seem like a trite question. However, we ask it with sincerity: What
    is a report? When the Executive Director, Membership Committee Chair, Fundraising
    consultant, Board Secretary, or staff supervisor in the next cubicle asks you
    for a report, what are they expecting to receive? What makes a report different
    from a set of records exported from search results?


    Reports present *data with a message*. More than raw data and more than just a
    subset of records, reports are meant to tell a story. We can begin to understand
    their purpose by comparing them to search results. They are similar, but differ
    in several important ways:'
  merge: -1
  img_proc: true
- pgno: 424
  md: '+   - Reports are more specialized in the types of data that can be filtered
    and the way in which that data is rendered.

    +   - Reports are intended for more visual uses, whereas a search result yields
    a simple list of data which can be exported or acted upon in other ways. A report
    may present results with a header, footer, and more visually appealing layout
    which can be printed, published to PDF, e-mailed, or otherwise distributed.

    +   - Reports may group data and display summary calculations (sums, counts, and
    so on) or graphical representations of the results (such as pie and bar charts).

    +   - Occasionally, reports are more like data to be acted upon, such as a walk
    list of contacts or a report for the bookkeeper listing every online transaction
    within a period.


    These practical differences help us better understand and distinguish reports
    from a raw set of data. However, what drives a report ultimately is its goal to
    transfer knowledge and communicate a message.


    In this sense, a report is all about the bottom line. When we build a report,
    we want to see the change over time, depth of constituent involvement, breadth
    of impact with various campaigns, and other metrics that tell us how well we are
    serving our constituents, reaching our audience, building a network, and generating
    support.


    As we begin looking at specific tools, don''t lose sight of the forest through
    the trees. The tools are a means to an end; they are meant to help you communicate
    your message to stakeholders (members, donors, and active participants), and decision
    makers (board of directors, management, and committees). However, the heart of
    what you''re communicating is the message, and not the PDF file or hardcopy document
    which we call a "report".


    # Toolsets and timing


    Reports are accessed from the main navigation menu. Within the reporting tool,
    we have report **templates** and report **instances**:


    +   - **Report template**: This defines the features of a report. This includes
    what fields are available to the report, options for grouping and filtering, display
    choices (tabular, bar/pie chart), and any other options available.

    +   - **Report instance**: This selects and saves specific criteria and options
    you wish to view. For example, you may want to view a constituent summary report
    displaying all contacts in Group A. At a later time, you may create a second instance
    of the constituent summary report displaying all contacts in Group A and Group
    B.'
  merge: -1
  img_proc: true
- pgno: 425
  md: 'A template will be reused many times as different criteria and display options
    are selected to meet specific needs. After generating a report, you may print
    it, export as `.csv`, or publish as `.pdf`. It is common to refer to a report
    instance as simply a report, but you should make sure that the distinction between
    the template and instance is clear.


    CiviCRM is packaged with a number of report templates covering all the major data
    types and purposes you would expect. The construction of a template does require
    programming skill, though the structure, design, and method of registering them
    in the system are all designed for extensibility. If you create a report that
    may have value to a broader audience, or extend an existing one by programming
    in more features, consider contributing it back to the project for inclusion in
    core.


    In contrast, the process of selecting criteria and options for a report instance
    are designed to be easily managed by non-technical staff.


    While creating a new report or editing an existing one, you will be presented
    with **Report criteria**, **Report settings**, and a **Preview** of the report,
    each of which is contained in an expandable panel. In order to create a new report
    from a template, visit **Reports | Create Report from Template** and select your
    desired template. Select **Reports | Report Listings** to view all saved report
    instances.


    # Report Criteria


    **Report Criteria** will include options such as what fields may be included in
    the report, how they will be grouped, what filtering criteria may be applied,
    and how the results should be ordered. These settings are defined in the template
    code and will be specific to the nature and purpose of each template. For example,
    contribution reports will have contribution-related fields and options that the
    constituent report does not have. While creating and editing a report, most of
    your time will be spent adjusting these options to meet your needs.


    For some of the more complicated reports, certain display fields and grouping
    options are dependent on each other, or are mutually exclusive of each other.
    For example, the donor report (summary) cannot be grouped by the received date
    if the contact name column is included. These limitations are generally due to
    the nature of the data being retrieved and grouped.


    When adjusting the criteria for an existing report or setting criteria for a new
    report, you will often need to do some testing and tweaking before the report
    displays exactly as you desire. This is easily done by adjusting the criteria
    and clicking to preview the report, and then continuing to adjust and preview
    as needed.'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# Telling Your Story: Building Reports


    The following screenshot displays the criteria options for the Constituent Report.
    Note that some reports support inclusion of custom data fields and filtering on
    them too, as seen with the Food Pantry fields in the following example:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_426_0.png)'
