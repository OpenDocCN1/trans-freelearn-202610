    +   $ mysqldump -uCivicrmDbUser -pCivicrmDbPassword -h localhost --databases yourDomain_dru\
    \ yourDomain_civ > yourDomain.backup.mysql\n+   ```\n+   \n+   - Backup your CiviCRM\
    \ files:\n+   - For example, from a command line,\n+   \n+   ```bash\n+   $ cd\
    \ /path_to_docroot/sites/; tar -czf civicrm.files.old.tgz all/modules/civicrm\
    \ yourDomain/files/civicrm\n+   ```\n+   \n+   - Delete the CiviCRM core files:\n\
    +   \n+   ```bash\n+   $ cd all/modules\n+   $ rm -rf civicrm\n+   ```\n\n+  \
    \ 8. Untar the files by replacing `3.2.0` with the appropriate filename from above:\n\
    +   \n+   ```bash\n+   $ tar -xzf civicrm-3.2.0-drupal.tar.gz\n+   ```\n\n+  \
    \ 9. Verify that the permissions are still correct for the files directory in\
