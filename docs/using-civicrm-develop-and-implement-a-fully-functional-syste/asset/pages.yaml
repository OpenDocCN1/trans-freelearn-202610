- pgno: 265
  md: '# Creating a bulk e-mail template


    If you have already scheduled or sent a bulk e-mail similar to what you need to
    send, then you can copy and modify it. This effectively uses it as a template
    for both the mailing settings and the message content and formatting. Do this
    by clicking on **Mailings | Scheduled and Sent Mailings**, then clicking on the
    **Re-use** link to the right of the row for the mailing of interest.


    You can create a template based on the message content and formatting during the
    third step in the mailing process, as noted earlier. Templates may also be constructed
    independent of the mailing wizard by visiting **Mailings | Message Templates**.
    Note the difference between reusing a past mailing and creating a mailing from
    a template. The former will copy all settings, including the recipient selections
    and mailing settings, while the latter only pre-populates the mailing subject
    and body regions.


    Begin creating a bulk e-mail template by either re-using an existing bulk mailing
    or creating a new one using the steps outlined above. Then proceed as follows:


    +   1. On step 3 of the wizard entitled **Mailing Content (step 3 of 5)**, make
    sure that **I want to Compose On-screen** is selected.

    +   2. At the bottom of the **Compose On-screen** field, click to select **Save
    As New Template**. In the **Template Title** field that appears, enter an appropriate
    name for the template. If your e-mail was based on an existing template, you may
    also choose to update it rather than creating a new one.


    You can manage existing templates using the **Mailings | Message Templates** tool.
    Notice that these templates will be available to both the CiviMail bulk e-mail
    and basic send e-mail activities.


    # Customizing system workflow messages


    In *Chapter 3, Installation, Configuration, and Maintenance* we outlined how to
    set up CiviCRM to send e-mails. Once that is done, CiviCRM sends a number of messages
    automatically as part of its workflow. The text and formatting of these messages
    provided in the standard installation is basic and serviceable. During your initial
    configuration, you should consider customizing these messages to fit with your
    organization''s communication style. Alternatively, it is easier though a bit
    less professional to wait until you see problems before changing default automated
    message templates. When you or your users start to see workflow messages that
    don''t have quite the right tone or polish of the rest of your organization''s
    communications, you can find the message template at issue and modify it.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'The process begins by noting the text that is problematic, working out what
    should replace it, finding the text in the appropriate template, and then replacing
    it with the new text.


    We reviewed the basic workflow template tools earlier in this book. However, it''s
    worth reviewing again at this juncture because those automated messages are certainly
    part of your overall communication strategy. On one hand, they serve the primary
    purpose of providing details about an event registration, online pledge, or case
    record, for example, and so it is natural for the content to primarily focus relaying
    the necessary details. However, as stated earlier, these messages also provide
    an opportunity to share your message in different ways with people who clearly
    have a level of commitment to the organization. Further, the essence of branding
    is consistency. If all the e-mails generated from your system have a certain look
    and feel except for the automated response e-mails, you risk compromising the
    brand you''ve established.


    Workflow message templates are accessed through Mailings | Message Templates,
    from the System Workflow Templates tab. The templates are pretty clearly titled;
    click on Edit in the appropriate row to access the content.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_266_0.png)


    After editing and saving a template, the row will have two additional action options:
    Revert to Default and View Default. As a result of the automated function of these
    templates, it''s important that they should be constructed properly and should
    include the necessary fields. If you edit a template and find it is no longer
    working correctly, you may view the default version (for comparison) or revert
    to it and re-implement your edits.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'The edits we are about to describe benefit from a higher level of technical
    expertise than needed for most other material in this book. The good thing is
    that it is easy to fix anything you break by reverting to the default. Still,
    you might want to have a communications wordsmith, a graphic designer, and a technically
    skilled HTML coder work together on this if you want to do more complicated changes
    than what we describe.


    The template content may appear overwhelming at first as it contains many conditional
    statements ({if/else}), HTML, and field variables. Workflow e-mails use the Smarty
    templating system to render field values and perform operations and calculations
    on the content.


    Smarty has much more power than the basic token replacement we saw in the user-driven
    e-mails. These system templates take advantage of that power in many cases. In
    order to edit the more complex system templates, it helps to know how to recognize
    things that are safe to change, things that may break the system template if you
    change them, and how to revert back to the default template if things start going
    wrong. We''re not aiming to learn how to use the more programming-like functions
    in Smarty, but just to learn how to edit the text strings mixed in among the programming
    constructs.


    Let''s take a brief look at a frequently used message template that often benefits
    from editing: **Contributions – Receipt (on-line)**. If we click on its **Edit**
    link, we can use the first 15 or 20 lines of content in the **Plain-Text** Format
    field to illustrate how to approach customizing these files. We see the following:


    ```

    {if $receipt_text}

    {$receipt_text}

    {/if}

    {if $is_pay_later}

    ==================================================

    {$pay_later_receipt}

    ==================================================

    {else}

    {ts}Please print this receipt for your records.{/ts}

    {/if}

    {if $amount}

    ==================================================

    {ts}Contribution Information{/ts}

    ```'
  merge: -1
  img_proc: true
