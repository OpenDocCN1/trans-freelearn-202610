- pgno: 47
  md: '# 2

    Planning Your CRM Implementation


    So now, you think that your organization will better accomplish its mission with
    CiviCRM. This chapter will help you plan your implementation of CiviCRM, so that
    your CRM initiative has the best chance to enable greater organization success.


    In this chapter, we will do the following:


    +   - Identify potential barriers to success and learn how to overcome them

    +   - Select an appropriate development methodology

    +   - Build a balanced team

    +   - Get started by measuring baseline metrics, creating a vision, and creating
    a plan

    +   - Focus your CRM strategy first on your constituents and mission, and then
    on operational efficiency

    +   - Review effective ways to gather requirements

    +   - Identify specific types of requirements to be examined in each of the major
    areas of CiviCRM functionality

    +   - Itemize elements of a good implementation plan

    +   - Review how to calculate the total cost of ownership of CRM systems and their
    alternatives

    +   - Plan for success'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'This chapter speaks to people who have the responsibility for initiating, scoping,
    and managing development and implementation for the CRM strategy. The initial
    sections of the chapter especially are management-oriented. The material on improving
    constituent relationships is often non-technical, and not specific to CiviCRM.
    We have written it so that it primarily addresses executives, directors, and managers
    at medium and large-sized organizations. The personnel in smaller organizations
    should also benefit, even though they may need to scale down the suggestions.
    For readers who are technical and/or do not have managerial or executive responsibilities,
    this section should provide a good context for your work, and may help you advise
    managers and executives who do not have experience with CRM strategy development
    and implementation.


    The latter parts of the chapter focus on identifying your organization''s requirements
    for CRM functionality in different areas such as communication, membership, fundraising,
    and events. These sections are intended to help with brainstorming techniques
    that could be a part of your organization''s overall CRM strategy. Although executives
    and managers of these areas are responsible for deciding which techniques they
    will use, technical staff wanting to elicit requirements from them will find numerous
    suggested questions.


    Of course, you might be a semi-technical person who''s trying to solve the database
    problem at a small non-profit with a three-member staff. If this is sounds more
    like your situation, then the initial parts of this chapter may provide inspiration
    on where you would like to aim, while the latter parts will provide useful ideas
    and suggestions that will be more immediately and practically relevant as you
    plan your work.


    If you already have CiviCRM or another CRM operating in-house without a CRM strategy,
    it''s not too late to be more methodical in your approach. The steps below can
    be used to plan to re-invigorate and re-focus the use of CRM within your organization
    as much as to plan a first implementation.


    # Barriers to success


    Constituent Relationship Management initiatives can be difficult. At their best,
    they involve changing external relationships and internal processes and tools.
    Externally, the experiences that the constituents have of your organization need
    to change, so that they provide more value and fewer barriers to involvement.
    Internally, business processes and supporting technological systems need to change
    in order to break down departmental operations'' silos, increase efficiencies,
    and enable more effective targeting, improved responsiveness, and new initiatives.
    The success of the CRM projects often depends on changing the behavior and attitudes
    of individuals across the organization, and replacing, changing, and/or integrating
    many IT systems used across the organization.'
  merge: -1
  img_proc: true
- pgno: 49
  md: <!-- no content -->
