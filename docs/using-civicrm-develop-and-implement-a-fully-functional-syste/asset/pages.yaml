    +   9. Customize the contents of the **Body – TEXT Format** and **Body – HTML
    Format** fields as appropriate, specifically including visual formatting for the
    latter.

    +   10. The footer is the best place to put text and tokens to allow users to
    unsubscribe from the mailing list and/or from all of your communications.

    +   11. For the **Body – HTML Format**, don''t forget the `</body>` and `</html>`
    tags.

    +   12. Click on **Save**.


    # Configuring and sending bulk e-mails


    As introduced earlier, the actual construction of a bulk e-mail consists of walking
    through a five-step wizard as follows:


    +   1. Click on **Mailings | New Mailing**.

    +   2. Enter a value in **Name Your Mailing**.

    +   3. Use the advanced multi-select tool to include/exclude groups and include/exclude
    recipients of past mailings as appropriate. The tool works by moving selections
    from the left column to the right by either double-clicking on them, or selecting
    and clicking on the nearby **Add** button.

    +   4. Click on **Next**.


    > Don''t see a group listed that you are confident exists in your system? Remember
    that only groups flagged as a mailing list in the group settings will be available
    in the mailing interface.'
  merge: -1
  img_proc: true
- pgno: 261
  md: "+   5. Optionally, change the **Tracking** and **Responding** selections. These\
    \ options cover several important functions. Enabling **Track Click-throughs?**\
    \ will rewrite any website links found in the content of your e-mail and route\
    \ them through CiviCRM. The system can then record when a user visits a link and\
    \ provide details in the mailing report. This can be an important metric for determining\
    \ the effectiveness of your mailings. **Enabling Track Opens?** will record whether\
    \ the recipient opened the e-mail. Note that this is an imperfect metric, but\
    \ still helpful in gauging the overall success of your mailing efforts. Enabling\
    \ the **Track Replies?, Forward Replies,** and **Autorespond to Replies?** will\
    \ similarly track follow-up actions taken by recipients.\n+   \n+   6. Click **Next**.\n\
    +   \n+   7. Select **From Email Address**. These can be added or updated at **Mailings\
    \ | From Email Addresses** or **Administer | CiviMail | From Email Addresses**.\n\
    +   \n+   8. If desired, select a template from the pull down list. Doing so will\
    \ populate the subject and content fields which you can then edit as desired.\n\
    +   \n+   9. Enter the subject line that will appear in your e-mail in the **Mailing\
    \ Subject** field.\n+   \n+   10. Either compose on-screen by entering content\
    \ into the **HTML Format** and **Plain-Text Format** fields or click on **Upload\
    \ Content** and **Browse** to upload files.\n+   \n+   11. As noted earlier, ensure\
    \ that the `{domain.address}` and either `{action.optOutUrl}` or `{action.optOut}`\
    \ tokens are included in your content. CiviCRM requires this in order to ensure\
    \ that CiviMail is not inadvertently used in a way that is sure to get your site\
    \ blacklisted as a spammer and thus unable to get much of your e-mail delivered.\
    \ If you've not included them in a standard footer as recommended, they must appear\
    \ in the body content (generally in both the HTML and Text versions). In your\
    \ HTML version, you are likely to want to embed the opt-out URL/e-mail token in\
    \ a hyperlink (a) tag with user-friendly text.\n\n> Note that the track replies\
    \ and forwards functionality requires the proper functioning of CiviCRM's `EmailProcessor`\
    \ script. See *Chapter 3, Installation, Configuration, and Maintenance* for a\
    \ full discussion of cron job scripts that ship with CiviCRM and how to configure\
    \ them to your needs. Also note that you can turn these two options to default\
    \ enabled by altering the constant defined in your `civicrm.settings.php` file.\
    \ If you plan to use these options regularly, you will want to do that to avoid\
    \ manually turning them on for each mailing."
  merge: -1
