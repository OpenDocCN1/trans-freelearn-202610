- pgno: 80
  md: '# Roles and permissions


    Roles and permissions, also referred to as access control lists (ACL), determine
    who gets to do what in your system. They are critical for data integrity, confidentiality,
    and privacy. Privileges to do things, or permissions, are not granted directly
    to individual users. Instead, permissions to do things are granted to or revoked
    from roles (for example, staff or volunteer coordinators), and users are assigned
    roles


    CiviCRM running under Drupal has a rich model for controlling the functionality
    exposed to users in different roles, as well as read, update, and delete permissions
    on contacts. These permissions can be configured for sets of fields and sets of
    contacts. Unfortunately, limitations in the current stable version of Joomla do
    not support the same level of access control available in Drupal. There are often
    ways to work around Joomla!''s limitations in this area in order to approximate
    the power and flexibility available under Drupal. However, if fine-grained permission
    control is important to your organization you should pay particular attention
    to this factor when selecting the CMS to use with CiviCRM. Joomla! v1.6 will include
    improved access control and current expectations are that CiviCRM will integrate
    support in CiviCRM v4.0.


    In order to create appropriate roles, groups of users that have permission to
    do specific things in CiviCRM need to be identified; for example, you may want
    to limit the ability to edit financial information to bookkeeping staff, and to
    view financial information to the other staff. Volunteer organizers may need to
    do things like add Activities, while education program staff may need the ability
    to add new events. Remember that individuals can belong to more than one group
    and will be granted all of the permissions that are available to any of their
    groups. General guidelines in this area are as follows:


    +   - Give names to roles that capture a user''s job function with respect to
    CiviCRM. For example, name it as "Event coordinators" rather than "Jake and Sandra"
    or "Can edit event info".

    +   - Don''t multiply the number of groups unnecessarily since it makes it harder
    to administer. For example, use a single "Staff" role rather than all eight titles
    on your organization chart if everyone is getting the same permissions.

    +   - Use permissions to protect the privacy of personal information according
    to your privacy policy. Make sure your privacy policy reflects the permissions
    available to different users. For example, don''t give "view" permission on any
    contact information to general users if your privacy policy says personal information
    will not be shared.

    +   - Protect your data from being modified by users who might make inadvertent
    mistakes or malicious deletions and changes.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# CMS integration


    Integration between CiviCRM and Drupal or Joomla! involves people and content.


    Not all contacts in CiviCRM need to have user accounts in the CMS used to power
    your website. For example, your CRM may include all voters in a jurisdiction and
    your website may not provide extra functionality requiring logins except to the
    site administrators. In many cases, however, actions in CiviCRM such as buying
    a membership will lead to login access and extra permissions in your CMS, such
    as gaining access to members-only pages of content or discussion forums.


    Try to identify groups of contacts that have different permissions. These contacts
    will need to have user accounts in your CMS and be members of groups that are
    assigned different roles.


    You should anticipate possible content crossover between your CMS and CiviCRM.
    The most common case is sending newsletters with CiviMail containing teasers of
    articles in your CMS with links driving people to the full articles on your site.
    There have been some attempts to standardize this process so that the newsletters
    can be rendered automatically using a CiviCRM Smarty template or a Drupal Content
    Template implementation. While manual cutting and pasting is the best approach
    for the moment, you may want to think about opportunities to take advantage of
    information in your CRM, such as constituent interests, by linking it with data
    in your CMS, like content tagged pertaining to their interests.


    CRM systems are good at managing contacts and relationships. CMSes are good at
    managing content. In a few cases the strengths of CMS content management need
    to be applied to CRM contacts. For example, members of visual arts, music, or
    video artist organizations may need to have rich media associated with those contacts
    as well as have all of their dues and grant application transactions tracked.
    In these cases the CRM contacts will need CMS user accounts and those accounts
    will have CMS profiles with rich media associated with them.


    The growing number of Drupal modules and Joomla extensions that integrate with
    CiviCRM, particularly those that expose CiviCRM data to the CMS, provide increasing
    opportunities to develop cost effective custom websites based on contact and relationship
    data. For example, an activist organization may want to display a mash up of contact
    information, such as their photos, quotes on a topic, or a map, in which case
    the information is all coming from the CRM and the functionality driving it is
    coming from the CMS. In-house or external consultant resources will be able to
    assist in gathering your custom CRM requirements in these areas.'
  merge: -1
  img_proc: true
