- pgno: 131
  md: '+   - `UpdateMembershipRecord.php`: This is used by CiviMember to update membership
    statuses based on the status rules defined in your system and initiate renewal
    reminder e-mails. This is a very important script if you are a CiviMember user.
    Member status rules define when a membership record is considered new, current,
    in-grace period, or expired (or any other statuses you define). This script must
    be run in order to process the records against those rules and update them when
    they pass from one status to the next. It is sufficient to run this once a day,
    preferably during low traffic times (such as the middle of the night), as it can
    be a resource-demanding script depending on the size of your database. If you
    are using the renewal reminder e-mail feature (where a reminder e-mail is sent
    out to current members a fixed number of days prior to the membership end date),
    you must create an e-mail template for use by the membership type. This will be
    discussed in more detail later in this book.

    +   - `UpdatePledgeRecord.php`: This is used by CiviPledge to process pledge reminders
    and update pledge statuses. When a user pledges donations to your organization,
    they determine the total value of their pledge and the frequency of their giving.
    If configured, this script will send pledge reminder e-mails as the date for their
    next donation draws near. It will also update the status of pledge commitments.
    It is sufficient to run this script once a day.

    +   - `UpdateAddress.php`: CiviCRM''s geocoding functionality generates a latitude
    and longitude value for addresses when they are created or edited. If you have
    existing addresses that are not geocoded, or have recently imported new address
    records, use this script to batch-generate geocode values. You can run this script
    as and when needed from a browser (after an address import, for example). If you
    are importing records on a regular basis, it may be useful to configure the script
    as a cron job on a periodic (for example, weekly) basis, or more frequently as
    your needs require. Note that both Google and Yahoo have placed limits on how
    many addresses may be geocoded via API per day. You may need to run this script
    over several days to complete full geocoding of your data when initially imported
    to the system.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '+   - `UpdateGreeting.php`: Each contact record has greeting values which can
    be used for e-mails, mailings, and other forms of address, such as exports for
    merge letters. When records are created through the administrative interface,
    the default greeting values are constructed (for example, Dear Mr. Smith). If
    you change the default greeting, or have recently imported contacts with no existing
    greeting values, run this script to update the value for all contacts in your
    database. It is generally not necessary to run this script through a cron job
    unless you are importing new contact records on a regular basis. There are several
    variables that must be appended to the script in order to control what records
    and fields are impacted (for example, the script running on a Drupal installation
    may look like `http://<drupal_root>/sites/all/modules/civicrm/bin/UpdateGreeting.php?ct=Individual&gt=addressee&name=<username>&pass=<password>&key=<sitekey>`):

    +     - `&ct=Individual/Organization/Household` (select one, required): Determines
    which contact type will be updated.

    +     - `&gt=email_greeting/postal_greeting/addressee` (select one, required):
    Determines which greeting value will be updated.

    +     - `&id=N`: Selects the option value for the greeting or addressee format.
    This is optional, and would only be used if you want to populate the field with
    a greeting format different from the configured default one.

    +     - `&force=1`: Updates all the records using the default greeting format,
    even if a value already exists.

    +     - `&force=2`: Updates only those records that have a greeting ID set, but
    the value of which has not been constructed. This is useful for contact record
    imports that may have had the default ID assigned, but need to have the greeting
    text constructed.

    +   - `EmailProcessor.php`: Use this script to configure one or more e-mail boxes
    (POP3/IMAP) to be polled on a regular basis for bounce processing and e-mail activity
    processing. The e-mail account configured as the default will be used for bounce
    processing as described earlier in this chapter, and will also include processing
    e-mail-based user actions such as unsubscribe/resubscribe/optout. Bounced e-mails
    will follow rules configured in the system to put the e-mail account on hold,
    giving you the opportunity to review and correct the e-mail through the system.
    E-mail activity processing will poll the inbox and attach e-mails as an activity
    record to existing contact records (if the e-mail is found in the system) or have
    new contact records created (if the e-mail is not in the system). This is a powerful
    way to automate communication tracking. For example, you might create a special
    e-mail account that your staff can optionally CC while sending e-mails to constituents,
    thus attaching a record of the communication with the contact.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'To identify accounts that should be polled for e-mails to attach as activities,
    append `&emailactivity=1` to the cron job. The frequency of this cron job will
    depend on how often you send broadcast e-mails, and how quickly you expect to
    see e-mails display as activities. In most cases, running it on an hourly basis
    is sufficient. This script is expected to undergo some revisions in future versions
    to facilitate management of multiple e-mail accounts for the two distinct purposes.
    Please check the online documentation for the latest updates on script usage.


    +   - `CiviReportMail.php`: CiviCRM reports can be configured to be e-mailed on
    a periodic basis. For example, you may want a contribution report with the last
    week''s summary of payments e-mailed to your staff bookkeeper every Monday morning,
    or your Membership Committee Chair may want a membership overview report on a
    monthly basis. Use this cron job to initiate mailings and configure the frequency
    in which they should be sent. This cron job works differently from others—you
    will configure a cron job for each report instance. The parameters are passed
    in the cron URL (in addition to the user, password, and key values): `.../bin/CiviReportMail.php?sendmail=true&instanceId=3&reset=1`.
    To determine the report''s `instanceId`, visit the report and note the value after
    `/instance/` in the URL.


    Note that some of the scripts require certain values be configured in the code
    before they can be run. Those that require configuration are saved as `.txt` files.
    You will see the section that must be configured clearly delineated with commented
    code. After modifying the file, remove the `.txt` extension so they are recognized
    as `.php` files, and then configure your cron. For example, the `UpdateMembershipRecord.php`
    file requires that you determine the FROM e-mail address used for sending out
    renewal reminders.


    > As of v3.3, this script uses the default FROM e-mail address defined in the
    system and consequently does not require you to manually configure the address.


    Scripts can be run via cron using curl or wget. Check with your hosting provider
    for their preferred method and any specific requirements for configuring the cron.
    The following examples may be helpful:


    +   - **Drupal:** `curl http://<drupal_root>/sites/all/modules/civicrm/bin/UpdateMembershipRecord.php?name=<username>&pass=<password>&key=<sitekey>`

    +   - **Joomla!:** `curl http://<joomla_root>/administrator/components/com_civicrm/civicrm/bin/UpdateMembershipRecord.php?name=<username>&pass=<password>&key=<sitekey>`'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Installation, Configuration, and Maintenance


    +   - Drupal: `wget http://<drupal_root>/sites/all/modules/civicrm/bin/UpdateMembershipRecord.php?name=<username>&pass=<password>&key=<sitekey>`

    +   - Joomla!: `wget http://<joomla_root>/administrator/components/com_civicrm/civicrm/bin/UpdateMembershipRecord.php?name=<username>&pass=<password>&key=<sitekey>`


    > The wget method creates logfiles by default on your server every time the cron
    is run. For scripts such as `civimail.cronjob.php`, which may be run very frequently,
    this will quickly result in huge amounts of files (albeit small in size) saved
    to your server. Once you''ve confirmed that the cron job is running correctly,
    use the `-O - ''URL'' > /dev/null` switch (for example, `wget -O - ''http://...''
    > /dev/null`) to disable logging.


    Note that all of the scripts can be run through the browser. If you are running
    into problems configuring the cron jobs, first confirm that the URLs, with username,
    password, and key values, are functioning correctly by entering them into your
    browser address bar. CiviCRM will render errors if any of those parameters are
    incorrect. Once you are confident that you have the correct URL, continue with
    the cron job configuration.


    > The cron job setup we just described is processed through the web server using
    wget/curl. This is generally the easier way to configure the cron, as it does
    not require command line/SSH access, and is generally more widely supported. However,
    running the cron through the web server creates overhead to your site load and
    is more susceptible to PHP timeouts if you have a large database. Several cron
    job scripts support processing through the shell in addition to the web server
    option we have just covered. If you are comfortable working in the shell, have
    a large database, or experience performance decline as a result of running the
    cronjobs, you should configure the crons to run through the shell interface. For
    a full discussion of how to handle this, refer to the following documentation:
    `http://en.flossmanuals.net/CiviCRM/SystemConfiguration`.


    This part of the configuration process is admittedly more technical than most
    other areas. However, if you take the time to understand the concepts and seek
    assistance where necessary to wade through the technical pieces, you will find
    the resulting functionality very rewarding.


    As with anything else, be sure to test it thoroughly. Cron jobs can generate logs
    that are sent to an e-mail address, which is a great way to ensure that they are
    functioning properly. You should also schedule periodic system reviews in order
    to confirm that your crons are running as expected.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# # Upgrades and maintenance


    As with any actively developed software project, you should anticipate the need
    to upgrade to latest revisions and versions on a periodic basis, and perform regular
    maintenance on your system. Anticipating these needs and planning accordingly
    will greatly improve your long-term experience with CiviCRM.


    # ## Version and revision upgrades


    The CiviCRM project follows conventional terminology for software releases:


    +   - **Versions:** Represents significant software releases with new functionality

    +   - **Revisions:** Represents minor releases and addresses bug, security, and
    functionality fixes


    The core development team aggressively releases two to three major versions each
    year, and three to four minor revisions in between the major releases. The version
    number follows the conventional format as well: 3.2.4 = version 3.2, revision
    4. You may track bugs and issues reported for a certain version through the CiviCRM
    website.


    Since revisions typically correct bugs or address security issues, you should
    ideally implement them as soon as they are released. Revisions generally require
    minimal modifications to your database structure or data; so the potential risk
    of running into any issues is less.


    Before conducting any revision upgrade, back up your database and file system
    and test to ensure the integrity of the backup files. It is particularly important
    to have a reliable backup of your database, as you will need to restore the database
    to the previous version should there be any problems during the database upgrade
    script. It is also recommended that you perform upgrades on a development server
    before implementing on your live server. We consider it essential to use a development
    or staging server for sites that have custom templates and code.


    Finally, if you have made any modifications to CiviCRM files, including template
    (.tpl) and CSS files, be sure to have a good record of your changes. You will
    need to review the changes against the new codebase and may need to adjust them.
    This is particularly true for major version upgrades, as the files are more likely
    to have significant changes.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'CiviCRM provides some helpful tools for maintaining custom development work:


    +   - **Hooks**: Hooks are placeholders in the CiviCRM code where you can inject
    your own custom code. The benefit of hooks is that you are not actually modifying
    core files — your custom code is maintained separately and is injected into the
    code in the appropriate place. For more details on using hooks, visit: http://wiki.civicrm.org/confluence/display/CRMDOC/CiviCRM+hook+specification.

    +   - **Override Directories**: Override directories are folders located outside
    of the core files where you can have modified versions of core files. CiviCRM
    first looks to see if the file exists in the override directory, and if so, uses
    it. Override directories can be used for both PHP and .tpl (template) files. The
    override directories are configured in: **Administer | Configure | Global Settings
    | Directories**.

    +   - **extras.css**: The ../civicrm/css/ folder contains all of the CSS files
    used by CiviCRM. The extras.css (empty by default) file will override the other
    CSS files, allowing you to maintain style modifications separate from the core
    file.


    # Joomla! upgrades


    Version and revision upgrades for Joomla! follow the same steps as an initial
    installation, with the addition of one step – an upgrade of the database to the
    current CiviCRM version. You must upload the new version to a location on your
    server (we recommend using the /tmp/ directory), unpack it, and use the **Install
    from Directory** option in the **Extensions | Install/Uninstall** tool (refer
    to the Joomla! installation steps above for a more detailed walk-through).


    After triggering the installation, you should receive a notification that the
    database must be updated to the current version. After clicking to upgrade, you
    should see a successful upgrade message, a link to visit the CiviCRM dashboard
    page where the menu will be rebuilt, and possibly a message about any configuration
    changes that could impact your site.


    If the upgrade did not complete successfully, you will need to do some troubleshooting
    to determine the cause.


    One possible problem may be restrictive permissioning on your filesystem that
    prohibited the installation script from overwriting existing files. This is generally
    easy to notice because the database upgrade script will not report a change from
    the previous version to the current, and the versioning in the footer region and
    Joomla! extension manager will not reflect the new version. If this happens, you
    will need to address the permissioning on your filesystem, or first uninstall
    CiviCRM and then reinstall it. Note that uninstalling/reinstalling will preserve
    your data, but you will need to review your configuration settings and must reset
    any menu items pointing to CiviCRM pages.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'It is also possible that you may run into problems during the database upgrade
    step. For large databases or lower-end server environments, the script could potentially
    timeout in the middle of processing, resulting in a half-upgraded database. If
    this happens, you will need to restore the database from your backup and reinitiate
    the upgrade. If the problem persists, you may need to manually implement the SQL
    scripts through PHPMyAdmin or the command line interface. You can find the scripts
    in the `/civicrm/sql/` folder in the installation package.


    If the database upgrade script yields an error with the backtrace logs, it is
    likely there is a problem with the structure or foreign key relationships in your
    current database. The backtrace error will provide some guidance as to the source
    of the problem. You will need to resolve the problem in the current database before
    retrying the installation process.


    If you continue to have trouble with the database upgrade, complete the following
    steps to ensure the database schema for your current (pre-upgrade) version is
    structured correctly:


    +   1. Back up the data (only) for your current version of the database. This
    may require you to re-import the backup you made at the beginning of this process,
    and then export with just the data (no structure).

    +   2. Create a new, empty database.

    +   3. Import the database structure from your current version of CiviCRM, as
    found in the installation package. This is found in the location `.../civicrm/sql/civicrm.mysql`.
    Importing this to a clean database ensures you have the correct structure for
    your current version.

    +   4. Import the data from your current version to this clean database. You should
    now have your current site''s data in a clean structure.

    +   5. Now use this new database containing a clean structure and current site
    data to rerun the upgrade process. That may require dumping the tables in your
    current live database and replacing them with the tables in this new database.

    +   6. Proceed with the installation and database upgrade.


    > Note that if your site contained custom data, these will be stored in their
    own tables and not included in the clean structure imported in the previous step.
    You will need to import the structure and data for custom tables.


    These steps should ensure that the CiviCRM database upgrade script is working
    with an accurate structure in your current database.


    After completing the upgrade, open your `civicrm.settings.php` file and confirm
    that the site key value is intact (used for cron jobs, as described above).'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Drupal upgrades


    The upgrade process for Drupal requires a number of steps to complete successfully.
    As in the Installation in Drupal subsection of the Installing CiviCRM section,
    we will describe how to upgrade in two ways: with a browser and FTP, and using
    Drush:


    +   1. Take the site offline by following these steps:

    +      - Log in as user 1.

    +      - Go to **Administer | Site Configuration | Site Maintenance**.

    +      - Click on **Off-line**. Review and edit the **Site off-line message**
    as appropriate.

    +      - Click on **Save configuration**.

    +   2. If your home page is a CiviCRM page:

    +      - Click on **Administer | Site Configuration | Site Information**.

    +      - Note the **Default front page**, so that it can be restored later in
    the upgrade, perhaps by taking a screenshot.

    +      - Change the **Default front page** to **node**.

    +      - Click **Save configuration**.

    +   3. If you are using any CiviCRM integration or extension modules:

    +      - Click on **Administer | Site Building | Modules**.

    +      - Note the integration or extension modules being used, perhaps by taking
    a screenshot.

    +      - Uncheck the **Enabled?** box for all relevant modules (for example, **CiviMember
    Roles Sync**).

    +      - Click on **Save configuration**.

    +   4. List and take note of the command-line scripts that are currently enabled:

    +      ```

    +      $ ls /path_to_docroot/sites/all/modules/civicrm/bin/*.php > /path_to_safe_dir/SavedListOfEnableScripts.txt

    +      ```

    +   5. Download the new CiviCRM files:

    +      - You can use a browser to download the files from http://sourceforge.net/project/showfiles.php?group_id=177914,
    and then use SFTP or FTP to upload to /path_to_docroot/sites/all/modules on the
    server.

    +      - Alternatively, use a browser to download the files from http://sourceforge.net/project/showfiles.php?group_id=177914
    to find the name of the current version, and then execute the following on a command
    line:'
  merge: -1
  img_proc: true
