- pgno: 103
  md: '**Domain Information** is used to configure the name of your organization,
    the **FROM Email Address**, mailing address, and other contact details. The settings
    here are important as they will be used as the default FROM address for system-generated
    and CiviMail e-mails sent from CiviCRM. Note that the e-mail address used needs
    to be a valid user on your hosting server in order for CiviCRM to send e-mails
    properly (this requirement will depend on your hosting environment configuration).


    If you are planning to use CiviMail for broadcast e-mail capabilities from your
    site, be sure to complete the domain address fields so that it can be included
    in bulk e-mails. This is a good practice for any legitimate broadcast e-mailer,
    and is required by anti-spam legislation in some jurisdictions (for example, the
    American CAN-SPAM Act), and CiviMail itself.


    # # Viewing and Editing Contacts


    The next configuration section, **Viewing and Editing Contacts**, handles settings
    related to contacts, including the contact record page, search settings, contact
    types, and address settings. We will walk through each of these areas.


    **Site Preferences** controls what content areas are visible in different parts
    of the system. For example, if you are not planning to use tags as a categorization
    tool, you should remove it from your views. Don''t need to have immediate access
    to the changelog (which records a running list of when edits to a contact record
    was made, with the name of the user and timestamp)? Remove it from your views.


    The preferences are broken into four areas:


    +   - **Viewing Contacts**: Controls the tabs that appear across the top of the
    contact record.

    +   - **Editing Contacts**: Controls elements that will appear in the contact
    edit view (accessed from the contact summary tab).

    +   - **Contact Search**: This advanced search tool groups fields by their type.
    You expand a group panel in order to access its respective fields. Use the options
    here to disable panels you don''t want to be displayed.

    +   - **Contact Dashboard**: CiviCRM has a special page, which can be exposed
    to logged-in website users called the **Contact Dashboard**. The dashboard summarizes
    the user-related records, including their membership history, event registration
    history, donation history, and pledge history. In addition, users may see related
    contacts that they are permissioned to view.


    As you initially configure this section, you may be uncertain what options to
    select. Remember that you can always return at a later time to modify your settings.
    You will find whether you need or don''t need certain elements listed here as
    you progress through the site implementation and begin working in the system.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'The final option on this page lets you set your preferred **WYSIWYG editor**.
    The editor toolbar will appear on any HTML text area in your site. We recommend
    using the same one your CMS uses, if possible. For Joomla! users, future versions
    of CiviCRM will provide support for integrating the system default and user-specified
    WYWSIWYG editor (beginning in v3.3).


    **Address Settings** provides similar functionality, allowing you to choose what
    is available for mailing label generation and the contact''s address block.


    Common changes to this page include removing **{contact.supplemental_address_2}**
    from the mailing label (most organizations operate with two line addresses), and
    hiding the **Addt''l Address 2**, **Latitude** and **Longitude** values. Generally,
    you will rely on the geocoding function to populate these values without the need
    for user involvement.


    If you are interested in producing reports that are sorted by address, such as,
    walk lists for foot canvassing, then you should turn on **Street Address Parsing**.
    This enables a functionality that attempts to automatically parse the street number,
    street name, and unit number from the street addresses entered into the system.
    As of version 3.3, American, Canadian English, and Canadian French street addresses
    are supported.


    The last setting on this page handles address standardization. CiviCRM will integrate
    with the USPS web tools API to validate the address entered. Note that the tool
    only checks if the address is valid; it does not determine if the contact name
    is on record at that address. Before completing this section and enabling the
    tool, you must apply to the USPS and receive an ID and URL. This can be done at:
    http://www.usps.com/webtools/address.htm.


    The next configuration item in our checklist is **Mapping and Geocoding**. CiviCRM
    supports automated geocoding of addresses through Google and Yahoo!. First, visit
    your preferred service and obtain a key. Then, select the provider and enter your
    key on this page. CiviCRM will geocode the addresses as they are created or edited.
    When viewing a single contact record or search result list you can view a map
    of the address or multiple addresses (if you are looking at search results), while
    taking advantage of other functionality provided by Google/Yahoo!, such as plotting
    directions to the location.


    Keys can be obtained from:


    +   - Google: http://code.google.com/apis/maps/signup.html

    +   - Yahoo!: http://api.search.yahoo.com/webservices/register_application'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Moving on, the **Search Settings** controls which fields are searchable using
    the simple search tool, and how the search functions operate and display results.
    The options include:


    +   - **Automatic Wildcard**: This enables the users to enter partial text and
    have search results return any matches in which that text appears, assuming wildcards
    before and after the search string. Larger databases may want to disable this
    option as it will slow the search performance and return a larger resultset.

    +   - **Include Email**: This will search both contact names and e-mail addresses
    for the search text.

    +   - **Include Nickname**: This will search contact names and nicknames for the
    search text. If you are a heavy user of nicknames, this is a very valuable feature.
    If not, you might consider disabling it as it slows down the search processing
    if you have a large number of contacts.

    +   - **Include Alphabetical Pager** and **Include Order By Clause**: These are
    useful features that facilitate navigation through search results. However, they
    both can impact performance on large databases. If you are experiencing poor response
    times while searching, consider turning one or both of these off.

    +   - **Default Contact Search Profile**: After conducting a search, the result
    list table displays the contact name, address, phone, and e-mail. If you would
    like to set an alternative set of fields to be displayed by default, you must
    first build a profile (a collection of fields) and then select it from the **Default
    Contact Search Profile** option.

    +   - **Smart group cache timeout**: This controls how frequently the contact
    records in a smart group are cleared from the cache. A smart group is a saved
    search; caching improves performance when one is pulling the list of records from
    the search. By default, the cache is cleared every time a contact record is added
    or edited. This ensures that any changes to records are reflected in the dynamic
    search results. Recreating the cache each time it is cleared takes time, especially
    if you have a large number of contacts in smart groups. If you don''t need up-to-the-second
    accuracy on smart groups, you can improve page load times on contact saves by
    increasing this value (five minutes is recommended).

    +   - **Autocomplete Contact Search**: At the top left of the horizontal navigation
    bar is a quick search field. As you type in the field, the system will display
    possible matches for the value typed. The possible match display will always include
    the contact name, but may also include e-mail, phone, and address fields. Use
    the **Autocomplete Contact Search** option to select what fields should be included.
    Adding options can be helpful as you can distinguish between contacts with the
    same name based on their e-mail, or any other value. Don''t select too many options,
    however, as it will clutter the result drop-down and make it difficult to read
    the list.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '+   - **Miscellaneous**: The next configuration page in our checklist, **Miscellaneous**,
    contains various options for system operations.

    +   - **Dashboard cache timeout**: The dashboard is the CiviCRM home page displayed
    when you first enter the system. You may configure the dashboard to display reports,
    or "dashlets," providing a helpful summary of system data on a single page. Since
    the dashlet reports may pull from just about any data in the system depending
    on how you''ve configured it, it may take some time for the page to load. System
    caching improves this by taking a static snapshot of the report data, and only
    reloading from live data on a periodic basis. You can control how frequently the
    cache is emptied with the **Dashboard cache timeout** option.

    +   - **Contact Trash & Undelete**: This is a useful option for organizations
    that need to have stricter control over the deletion of contact records, including
    their contribution information. It can be disabled to simplify workflows and improve
    performance. When enabled, contacts deleted through the contact record, search
    result tasks, or as a result of a merge, will be "trash" – marked as deleted but
    retained in the database. You may later use advanced search to find these contacts
    and delete permanently or restore them.

    +   - **Version Check & Statistics Reporting**: This helps you, as an implementer,
    to keep track of the latest release of CiviCRM. If your installed version is older
    than the current stable release, CiviCRM will place a notification at the top
    of administration pages to alert you. If this option is turned on, basic statistics
    will be sent back to CiviCRM so the core development team has a basic sense of
    what version people are using, what environment it''s being hosted on, and the
    size of databases. These statistics do not contain any data from your site – they
    only include aggregate statistics of your data and system environment information.
    Wherever possible, leave this turned on, as it is very helpful for the core team
    to understand how the community is using the software; often it will inform the
    direction of future development.

    +   - **Maximum Attachments**: When generating e-mails or creating activities,
    users are allowed to attach files. Set the **Maximum Attachments** here to prevent
    too many from being attached at a time.

    +   - **reCAPTCHA**: Lastly, you may enable anti-spam tools for your online forms
    using reCAPTCHA. reCAPTCHA helps ensure the form is completed by a human and not
    a computer. It presents words or an alphanumeric string in a graphical form, usually
    with some kind of warping or other visual obstruction that is hard for computers
    to decipher. If you plan to have publicly available forms on your site allowing
    users to enter data you should consider implementing this.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'First, sign up at http://recaptcha.net/ to obtain a public and private key.
    Then return to this page to complete the form. Once configured, you enable **reCAPTCHA**
    on a form-by-form basis in the **Advanced Settings** panel of your profile''s
    **Settings** page. We will discuss this further when we cover profile forms and
    the process of exposing data to your website.


    +   - **Contact Types**: The last configuration page in this section is for **Contact
    Types**. CiviCRM has three primary contact types – **Organization**, **Individual**,
    and **Household**. Contact types are used to distinguish the types of contact
    records you maintain. Each type will have some unique data fields, in addition
    to fields common to all. For example, the first name and last name fields are
    appropriate for individual records, but not for organization records, such as
    a business. In contrast, address fields are common to all.


    Beyond the three primary contact types, you may create additional subtypes to
    categorize your records. You may also rename the existing primary types using
    this configuration tool. There are a few important things to remember when thinking
    through contact subtypes:


    +   - There are several benefits to using subtypes to organize your records, but
    chief among them is the ability to create custom fields assigned to one or more
    subtypes. Consider a school that is using CiviCRM to track both parents and teachers.
    These are both individual contact types, but the data collected for each would
    be very different. The school may want to know the skill sets for parents who
    wish to volunteer, or track if either parent is an alumnus of the school; teacher
    records, on the other hand, would track information about their educational experience,
    history of classes taught, and employment-relevant human resource data. Creating
    subtypes allows you to segment the data you are collecting.

    +   - Subtypes are patterned after one of the three primary contact types. When
    creating your subtypes, first think through which of the three main types the
    subtype should be based on.

    +   - A contact record may currently only be assigned one contact type. Consequently,
    be sure that your subtypes are mutually exclusive. In other words, don''t create
    subtypes such that a new contact could potentially fit into more than one subtype
    or there could be ambiguity about the best place for the contact to fit. There
    are many other ways to categorize your contacts; subtypes should only be used
    for high-level categorization where there is a fundamental difference between
    the nature of the contacts.


    For a more complete review of contact subtypes and additional guidance on how
    to think through your system structure, refer to Chapter 4, *CiviCRM Basics: Moving
    through the System and Working with Contacts.*'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Sending e-mails


    Having addressed core configuration and contact-related settings, we now turn
    our attention to e-mails generated from the system. CiviCRM may be configured
    to automatically generate e-mails for end user actions, such as registering for
    an event or making a donation. Additionally, administrators can send e-mails to
    one or more contacts using activities or CiviMail, the mass e-mail distribution
    tool. Though you are not required to use e-mail sending capabilities in order
    to use CiviCRM, you will miss out on a significant functionality if you choose
    not to.


    First, set up your **Outbound Email** configuration at **Administer | Configure
    | Global Settings | Outbound Email (SMTP/Sendmail)**, and then choose **mail()**,
    **sendmail**, or **SMTP**-based mailing mechanisms. **SMTP** may provide more
    complete bounce headers for return mail processing, though the default **mail()**
    option is generally sufficient. Your hosting provider may also have a preference,
    or may only support certain options. Regardless of which option you choose and
    configure, be sure to use the built-in testing function and confirm receipt of
    the e-mail. This quickly and easily ensures that the outbound e-mail is working.


    > If you plan to use CiviCRM for large broadcast e-mails, be aware of the responsibilities
    involved in maintaining a good sender reputation with ISPs and organizations that
    maintain whitelists/blacklists. Also be aware of the potential server load caused
    by large mailings. You may want to consider a third-party SMTP provider if you
    plan to use CiviMail on a large scale.


    Once you have tested outbound e-mail, configure the settings at **Administer |
    Configure | From Email Addresses**. When sending e-mails from CiviCRM, the logged
    in user''s e-mail will be the default FROM address. However, you may configure
    additional addresses available to the system and select them while sending an
    e-mail.


    For example, your organization might have service-based generic e-mails, such
    as `events@my.org`, `questions@my.org`, and `membership@my.org`. Depending on
    your hosting setup, the FROM e-mail addresses used may need to exist in your mail
    server as mailboxes or forwards.


    # Handling return e-mail traffic


    The CiviMail component provides important functionality for processing the inbound
    e-mails. These e-mails are received and processed by the system for three purposes:'
  merge: -1
  img_proc: true
