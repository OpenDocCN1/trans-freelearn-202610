- pgno: 140
  md: "11. Re-enable CiviCRM integration and extension modules:\n  - Click **Administer\
    \ | Site Building | Modules**.\n  - Check **Enabled** beside the appropriate integration\
    \ and extension modules that you noted as you disabled them previously.\n  - Click\
    \ **Save configuration**.\n  - If you have re-enabled Views integration:\n   \
    \ Click on **Administer | Site Building | Views | Tools**.\n    Click on **Clear\
