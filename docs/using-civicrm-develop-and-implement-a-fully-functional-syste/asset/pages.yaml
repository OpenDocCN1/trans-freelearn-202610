- pgno: 171
  md: 'The relationships tab in the contact record lists all the active (current)
    and inactive relationships. An inactive relationship may occur if an existing
    relationship is manually disabled (for example, if an employee of a company is
    on a leave of absence or laid off, and you manually mark the relationship as disabled),
    or if an end date is recorded for the relationship (for example, you create a
    board member relationship and record the start and end date based on a two-year
    term). By default, relationships are assumed to have no set end date.


    Entering end dates or disabling relationships rather than deleting them provides
    a useful way of tracking the contact''s history of involvement in various capacities.
    For example, it may be useful to see the employment history of an individual by
    reviewing current and inactive **Employee of** relationships. You might use this
    information to identify influencers for major donors or to find social networks
    that could facilitate potential strategic partnerships.


    Before working with relationships in a contact record, you should review the existing
    relationships types that are created when CiviCRM is first set up and determine
    if there are any other types you will need to create.


    To do this, go to **Administer | Option Lists | Relationship Types.**


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_171_0.png)


    | Relationship A to B | Relationship B to A | Contact Type A | Contact Type B
    |

    |---|---|---|---|

    | Case Coordinator is | Case Coordinator | Individual | Individual |

    | Case Manager is | Case Manager | All Contacts | All Contacts |

    | Child of | Parent of | Individual | Individual |

    | Employee of | Employer of | Individual | Organization |

    | Head of Household for | Head of Household is | Individual | Household |

    | Household Member of | Household Member is | Individual | Household |

    | Sibling of | Sibling of | Individual | Individual |

    | Spouse of | Spouse of | Individual | Individual |

    | Supervised by | Supervisor | Individual | Individual |

    | Support Staff is | Support Staff | All Contacts | All Contacts |

    | Volunteer for | Volunteer is | Individual | Organization |'
  merge: -1
  img_proc: true
- pgno: 172
  md: "This table lists relationship labels for each direction (from **A to B** and\
    \ **B to A**), and whether there are restrictions on the types of contacts allowed\
    \ for each side of the connection.\n\nIf this structure is confusing, use the\
    \ following statements when reviewing and creating relationships, replacing A\
    \ and B with your labels:\n\n+   - [Contact Type A] is a/an [Relationship A to\
    \ B] a/an [Contact Type B]\n+   - [Contact Type B] is a/an [Relationship B to\
    \ A] a/an [Contact Type A]\n\nIt may also be useful to review a very clear existing\
    \ relationship type, such as employer/employee, to understand how the label text\
    \ is used. Using the preceding statements with the employer/employee relationship,\
    \ we would see:\n\n+   - [an Individual] is an [Employee of] an [Organization]\n\
    +   - [an Organization] is an [Employer of] an [Individual]\n\nNote that if you\
    \ select one of the primary contact types (Individual/Organization/Household)\
    \ when creating a relationship, the relationship will be available to all associated\
    \ subtypes. However, if you select a subtype for one side of the relationship,\
    \ it will only be available to that specific subtype.\n\n# Adding relationships\n\
    \nOnce you have your relationship types configured, you may begin to build connections\
    \ between contacts. Navigate to the contact record's **Relationship** tab to view,\
    \ create, and edit their connections.\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_172_0.png)\n\
    \n> Two types of relationships may be constructed from an individual record's\
    \ summary edit screen:\n> \n> - An **Employee** of relationship will be constructed\
    \ when you complete the current employer field\n> - A **Household Member** of\
    \ relationship will be constructed when you indicate that an individual should\
    \ share a household record's address\n\nThe relationship creation process consists\
    \ of two steps, namely, selecting the related record based on the type chosen,\
    \ and filling out the relationship details."
  merge: -1
  img_proc: true
- pgno: 173
  md: 'In addition to the basic start/end dates, description, and notes, there is
    a basic permissioning function handled through relationships. Using the two options
    presented, you can allow either side of the relationship to view and modify the
    other side''s contact details.


    Where does this come into play? CiviCRM has a special contact summary page called
    the Contact Dashboard, which can be exposed to website users. The dashboard provides
    a snapshot of the user''s interactions with your organization, including membership
    history, event registrations, contribution history, and group membership. In addition,
    the dashboard may contain a list of relationships defined for the individual and
    if permissioned through this form, it will allow the logged in user to edit details
    for the related record(s).


    One common use case for this functionality is when you want certain administrative
    contacts (individuals) to have the ability to edit their employer''s records.
    Since organizations don''t visit websites (people do), you would need to allow
    certain individuals the permission to edit the organization record. Other examples
    include allowing parents to edit their children''s records, teachers to edit their
    students'' records, or household members to edit the household record.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Activities


    Up to this point, we have primarily focused on recording data that describes our
    contact records. However, the power of a CRM is fully realized with the ability
    to track and build an ongoing relationship with contacts. We want more than a
    glorified address book — we want tools that will help write a story about our
    constituents: what kinds of communication we''ve had with them, how they''ve chosen
    to support the organization financially or through active participation, how long
    they''ve been a member, how we''ve helped resolve issues and concerns they have
    brought to us, and other such interactions.


    One critical way this story is preserved is through activities – recorded communication
    to and from constituents, or actions taken on behalf of constituents.


    Activity records will be created in one of two ways: automatically by the system
    in conjunction with some other process, or manually by staff working with records.


    Certain activity records, automated e-mails in particular, are created when other
    parts of the system trigger communication with the contact. For example, if a
    member renews his membership online, the form will send them a receipt by e-mail,
    detailing the membership record renewal, payment, and any other data fields completed
    as part of the process. In addition to the membership and contribution records
    created by this transaction, CiviCRM records the e-mailed receipt as an activity,
    providing you a complete picture of every piece of communication sent to the contact.
    Other examples of automated activities include:


    +   - Contribution receipts

    +   - Pledge receipts

    +   - Membership status updates

    +   - Membership renewal reminder e-mails

    +   - Bulk e-mails


    Users with appropriate permission can create certain activity records manually.
    The most commonly used are records of phone conversations, meetings, or manually
    generated e-mails (in other words e-mails generated outside of the system). When
    creating an activity record, you may mark it as complete (a record of a past communication),
    or schedule it for the future, in which case it becomes a calendared to-do list.
    In addition, activities may be assigned to other users, providing a useful tool
    for managing communication among staff members within an office while linking
    assignments directly to the constituent record.'
  merge: -1
  img_proc: true
- pgno: 175
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Notes


    Inevitably, your interaction with constituents will include collecting personal
    details about their lives, running into unique situations or circumstances that
    impact how records were kept, or general information concerning their ongoing
    involvement with your organization. All of this information is easily stored in
    notes.


    Accessible through a tab on the contact''s record, notes provide a simple way
    to log general information about constituents. Each note includes a subject line,
    description, and is time-stamped at the time of its creation.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_176_0.png)


    > Be careful not to use notes as a catch-all for information better stored elsewhere.
    In particular, make sure your users understand that activities should be used
    for communication records with constituents, whereas notes are better used for
    miscellaneous information about the contact, such as personal details that don''t
    fit into existing contact fields.


    # Search


    As important as it is to understand and become familiar with the contact record
    interface, we also need to be able to quickly find records in the system. We started
    our exploration of CiviCRM by looking at the quick search field in the navigation
    bar. Search | Find Contacts extends this to allow filtering by contact type, group,
    or tag. Beyond this basic search, CiviCRM provides four power tools for searching
    and additional diverse functionality through the reporting system.


    # Quick search


    Quick search is found in the navigation menu, and is best used when you are looking
    for a specific contact. The text entered into this field will search e-mail addresses
    (by default) and the contact name (sorted by name for individuals, household name
    for households, and organization name for organizations). The search will return
    results for partial matches as you begin typing. You have the option of configuring
    the tool to use full wildcard searches or only ending wildcards (Administer |
    Configure | Global Settings | Search Settings).'
  merge: -1
  img_proc: true
- pgno: 177
  md: '![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_177_0.png)


    Full wildcard searches will look for the entered text in any part of the name
    or e-mail fields. For example, entering "john" would find both John Smith and
    Mark Johnson. With wildcard search turned off, a search for "john" would only
    find Mark Johnson, as the sort name field is constructed as "lastname, firstname"
    by default. Full wildcard search is very useful in small datasets as it provides
    greater flexibility. For large databases, you will typically want to turn this
    off as the result sets will become long and cumbersome.


    If the full wildcard option is turned off, you may still initiate a wildcard search
    using the percent symbol (%). You may even use the wildcard value in the middle
    of a search term; for example, J%on will yield John as well as Jones. This "%"
    character matches any number of characters wherever it appears in your search
    strings.


    # Basic search


    Clicking on Search | Find Contacts brings up a form that allows you to search
    by name or e-mail and filter the results by contact type, group, and tag. Entering
    more criteria reduces the number of matches, as the results must match all of
    the criteria entered. As with the contact quick search, you may use wildcards
    to extend how the search is conducted.


    # Advanced Search


    Don''t let the term "advanced" scare you away – it''s a commentary on the powerful
    capabilities of this tool, not a statement about how much experience with CiviCRM
    is required. In fact, the power of advanced search lies in both its flexibility
    and ease of use. To access this tool, navigate to Search | Advanced Search.


    Advanced search provides a window into just about every field in your system,
    grouped by their type. Using the paneled interface you can build search criteria
    across address fields, contributions, membership, events, custom fields, and any
    other type of data you are managing.


    The only significant limitation of the advanced search tool is that multiple criteria
    across the fields are always joined by the AND operator. If you are familiar with
    any form of query building, you will recognize the difference between joining
    multiple criteria with AND versus with OR. AND joins are exclusive – as you add
    more criteria, your result list becomes smaller as more records are excluded because
    the records must meet all of the criteria provided. OR joins are inclusive – adding
    criteria expands the result list as any record meeting any of the individual criteria
    will be included.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'The only exception to this rule in advanced search is the fields presented
    as a multi-select option list (including a set of grouped checkboxes). These will
    be joined with OR within that field. For example, selecting multiple tags will
    yield results matching any of those tags.


    Be aware that a few special fields reverse the normal selection logic. For example,
    selecting any of the privacy options will exclude records meeting that criterion
    rather than including them (reflecting the normal use of those fields). If you
    are looking to retrieve a list of contacts who have a certain privacy setting,
    check the option titled Include contacts who have these privacy option(s) in order
    to reverse the default effect.


    As always, inline help text (question mark icon) will provide an explanation and
    example for non-standard or potentially confusing fields.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_178_0.png)'
  merge: -1
  img_proc: true
- pgno: 179
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 180
  md: "# CiviCRM Basics: Moving through the System and Working with Contacts\n\nThe\
    \ builder lets you construct multiple sets of criteria. The criteria within each\
    \ set is joined by AND. The sets are combined together with OR. That allows you\
    \ to create exclusive (AND) criteria and join it with inclusive (OR) sets of criteria.\n\
    \nThe search builder is accessed through **Search | Search Builder.**\n\n> FPAGM\
    \ plans to do more regional outreach to food suppliers in the outlying areas of\
    \ Metropolis and suburban areas surrounding the city. The outreach will be focused\
    \ on soliciting more commitments for food donation support during the difficult\
    \ winter months, when demand at the food pantries increases significantly.\n>\
    \ \n> The Executive Director has identified the following criteria to be used\
    \ for the initial outreach letters:\n> \n> - All food supplier businesses in Metroville\n\
    > - Food suppliers in Metropolis with a postal code of 10255 who have donated\
    \ more than $500 at one point\n> - Affiliate members with a postal code of 10254\n\
    \nThe resulting configuration in the search builder will look as shown in the\
    \ following screenshot (the OR and AND text has been added for illustration):\n\
    \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_180_0.png)"
  merge: -1
  img_proc: true
- pgno: 181
  md: 'As you can see, our selection consists of three sets of criteria, which are
    joined together to yield the result. A food supplier or organization meeting *any*
    of the three criteria sets (two of which have multiple restrictive criteria) will
    be included in the results.


    There are several things to keep in mind when working with the search builder:


    +   - Search criteria can be built based on contact (including type and subtype-specific
    fields), contribution, membership, event participant, pledge, membership, case,
    activity, and grant fields.

    +   - The following comparison operators are used for building criteria statements.
    Operators define the logical rules for the criteria, determining how the value
    you enter will be processed using the field selected.

    +     - `=` means "equal to", and represents an exact match.

    +     - `!=` means "not equal to".

    +     - `>` means "greater than" and should only be used with number value fields,
    such as a contribution amount.

    +     - `<` means "less than", and should only be used with number value fields.

    +     - `>=` means "greater than or equal to", and should only be used with number
    value fields.

    +     - `<=` means "less than or equal to", and should only be used with number
    value fields.

    +     - `IN` is used for groups, tags, and other lists of IDs. The value field
    may have a comma-separated list (with no spaces) of IDs, surrounded by parentheses,
    for example, `(1,3,9)`. To retrieve the ID values, visit **Contacts | Manage Groups/Manage
    Tags** and note the ID column value. When working in a group or tag (such as in
    edit mode), you may also retrieve the ID from the URL by looking for the ID or
    GID number.

    +     - **LIKE** means "equal to", but unlike the equal sign, you may use wildcards
    with **LIKE** to create fuzzy criteria.

    +     - **IS NULL** indicates that the field is empty, containing no value.

    +     - **IS NOT NULL** indicates that the field is not empty.

    +   - Several fields require unique formatting:

    +     - The **State** and **Country** fields may accept either the full state/country
    name (such as **United States**), or the ID for the option value (**1228**).

    +     - Dates should use the following format: `YYYYMMDD`. Note there are no spaces
    or symbols, for example, March 16, 2010 = `20100316`.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '+   - **Yes/No fields should have values of 1/0, respectively (Yes = 1; No
    = 0)**.

    +   - Multiple choice custom fields should use the value of the option that was
    specified when the field was created as the search criteria rather than its label.
    The value, stored in the database, may be different from your label, which is
    displayed to users on the screen. If necessary, revisit your custom data configuration
    in order to ensure that you are retrieving the correct value.

    +   - Some fields, such as **Membership Type**, require the ID value for the type,
    and not the type name. If you try to run a search and receive a warning message
    to enter a valid value, it is likely to have happened because the field requires
    an option ID number.


    # Understanding contact versus component searches


    All of the search tools we''ve reviewed so far are contact-based. Regardless of
    what criteria you choose, the search will return a list of contacts.


    What if I need a list of all contributions over $500 made within the last six
    months? If John Doe has donated more than $500 three times over that period, I
    would expect to see him listed three times; the fact that he is a regular donor
    is important information to see in this context. However, searching through the
    **Advanced Search** (where I have access to the contribution fields) or the **Search
    Builder** (which likewise can use contribution fields) would yield a list of contacts
    with no duplicate values.


    Throughout CiviCRM, there are typically two "lenses", or perspectives, through
    which you can search and view records—you can search for contacts, or you can
    search for their related records. We call the "related record" search a component
    search. These tools can be accessed through the main **Search** menu (designated
    in the second block of options) or in the respective main menu item (for example,
    **Find Participants** is found under **Events**).'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_183_0.png)


    Considering the preceding example, searching for this criterion under **Advanced
    Search** would yield one record per contact. Conducting this search using the
    **Find Contributions** form would yield three records, one per contribution.


    We will investigate these tools further when we work with some of the components.
    For now, it is important to understand the difference in how you search and what
    type of results are being returned.


    # Custom search


    If you still find that you need to conduct a complex search that cannot be accomplished
    using one of the tools above, review the custom searches found in **Search | Custom
    Searches....**


    The custom search structure was created as a way for developers to build customized,
    complex search options and result lists that could not easily be accomplished
    through the generalized forms. Let''s face it—not every possible search option
    can be squeezed into a single interface without creating complexity and confusion
    that will render the tool unusable for the average user. Rather than leaving you
    to work directly in the database, CiviCRM created the custom search structure
    to provide an interface for developers to meet these specialized needs.


    Existing custom search forms are often being improved and new ones are added to
    the system by the CiviCRM development community. Understand that to actually *create*
    a custom search form, one must have development skills (and access to the database
    and code). However, once built, sufficiently permissioned users may access the
    forms and run searches. If you build a custom search form, consider contributing
    it back to the project for inclusion in future releases.'
  merge: -1
  img_proc: true
- pgno: 184
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Search result actions


    At this point, we have our arms around the contact record, can navigate through
    the system, and now can conduct crazy searches to our heart''s content. However,
    now that you''ve triggered a search and have the records you''re looking for,
    what do you do next?


    Sometimes, you''ll conduct a search to find a specific record, and then navigate
    to the contact and perform some work on their data. However, more often you are
    searching for groups of records and want to perform bulk actions on either the
    full or partial result list.


    CiviCRM accomplishes this through the action drop-down options. After conducting
    a search, select the All X records radio button or Selected records only (if you
    want to manually choose records from the result to take action on). This will
    enable the actions drop-down list. Choose your desired action and click on Go
    to continue.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_185_0.png)


    As you can see from the list of options, there is no shortage of actions you may
    take. We will review them briefly, grouped according to the type of the action
    rather than in alphabetical order.


    # Mail actions


    CiviCRM provides two actions that are useful for postal mail, and two that are
    useful for e-mail:


    +   - Mailing Labels: Print contacts to PDF using the mailing label options set
    at Administer | Configure | Global Settings | Address Settings.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '### CivicCRM Basics: Moving through the System and Working with Contacts


    +   - **Print PDF Letter for Contacts:** Use this option to generate merge letters
    directly from the system. You will want to create a basic template that mimics
    the layout in your word processor. Once created, you can generate letters, insert
    placeholder tokens as merge fields, save letters as templates, and print them
    to a PDF file.

    +   - **Schedule/Send a Mass Mailing:** If CiviMail is enabled and configured,
    you may generate a bulk mailing directly from the search results. Choosing this
    option will trigger the bulk mailing wizard and walk you through each step.

    +   - **Send Email to Contacts:** If you have a small set of records you''re working
    with and don''t need the full functionality of CiviMail bulk mailing, you may
    simply send the contacts a basic e-mail using this option.


    # ## Groups and tags actions


    After finding and selecting a number of contacts, you may want to make it possible
    to conveniently retrieve or act on the records later.


    +   - **Add Contacts to Group:** Adds selected contacts to a group

    +   - **Remove Contacts from Group:** Removes the selected contacts from a group

    +   - **New Smart Group:** Saves your search to a dynamic smart group so it can
    be retrieved later using the same criteria

    +   - **Tag Contacts:** Adds a tag to the selected records

    +   - **Untag Contacts:** Removes a tag from the selected records


    # ## Add relationship actions


    CiviCRM allows you to add two types of relationships to contacts from the standard
    search results listing:


    +   - **Add Contacts to Household:** Creates relationship with the selected household
    record using one of the relationship types defined for households

    +   - **Add Contacts to Organization:** Creates relationship with the selected
    organization using one of the relationship types defined for organizations


    # ## Add related record actions


    A couple of actions on multiple contacts involve creating related records for
    each of the selected contacts:'
  merge: -1
  img_proc: true
- pgno: 187
  md: '+   - **Record Activity for Contacts:** Creates an activity record and associates
    it with multiple contacts at once. One helpful use of this option is to record
    mailings. Let''s say you run your search and want to export the records for delivery
    to a mail house. After running the export, add an activity to the same result
    list to record the details of the mailing, for example, "Volunteer Solicitation
    Letter", with an attached copy of the document used for mailing.

    +   - **Add Contacts to Event:** Registers the selected contacts for an event.
    The only limitation of this action is that you have to select a single set of
    registration options to apply to all contacts selected. You are also not able
    to record payment details in bulk.


    # # Update contact actions


    Several actions operate directly on the contact records, allowing you to merge,
    update, delete, or undelete them:


    +   - **Batch Update via Profile:** Profiles are collections of fields that you''ve
    defined in the system. You may use profiles to edit up to 100 contact records
    simultaneously.

    +   - **Merge Contacts:** Trigger the deduplication / merge tool using the selected
    records. You will be redirected to a page where you can review the records and
    choose the fields that will be merged from one record to the other.

    +   - **Delete Contacts:** Move the contacts to the trash (if this system is enabled).

    +   - **Delete Permanently:** Completely remove the contacts from the system.

    +   - **Restore Contacts:** If you''ve searched for deleted (trashed) contacts,
    you may use this option to restore them in bulk.

    +   - **Unhold Emails:** Remove the **On hold** e-mail status for selected records.


    # # Export/map actions


    The following two actions support doing something with contact records, rather
    than changing them:


    +   - **Map Contacts:** If geocoding is enabled on your site, you may create a
    map with the selected records pin-pointed on it.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# CiviCRM Basics: Moving through the System and Working with Contacts


    +   - **Export Contacts**: Inevitably, you will need to conduct searches and export
    the results to a `.csv` file (comma-separated values) to be used for various purposes—sending
    to a mail house, conducting calculations on the data, merging letters, transferring
    to someone via e-mail, and so on. The export records process consists of two steps:

    +     - Choose the export type—default primary fields or your own selection of
    fields. You may save export mappings (collections of fields) for reuse at a later
    time.

    +     - If you''ve chosen to select your own fields, you will be shown a grid
    where you choose the contact type, field, and relevant field parameters. At the
    bottom of the page, you can save the export mapping, update an existing one, and
    export the list to `.csv`. When defining your field selections, remember that
    the field will only export data if it is appropriate to the contact types in your
    search results. For example, if your search results contain only individuals,
    any household fields defined in your export will be empty. Also note that there
    are options to export related records. For example, if I would like to retrieve
    the State value for the organizations associated with people through the employer
    relationship, I can do so using the "related contact info" options toward the
    bottom of the field list.

    +     - When exporting records, you may merge records with the same address or
    merge household records. The former option will identify contacts with the same
    address and merge them into a single record. The latter option will look for records
    in your result list that are part of a household, and export the household record
    instead of the individual contact records. Both of these options will help prevent
    sending multiple mailing pieces to the same address, reducing your mailing costs.
    Note that these options do not impact the records themselves; they only impact
    how the export file is generated.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Subsequent actions on the same selection


    You will find in many cases that after triggering an action, you can return to
    the search result list and trigger a follow-up action. The record activity example
    above is a good example of where this can be helpful—after exporting your records
    for a mailing, perform a second activity action to record the mailing details.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_189_0.png)


    > FPAGM has an upcoming Board Meeting and must notify the Board members about
    the logistical details. They use the simple search to retrieve all contacts which
    are a part of the existing Board of Directors static group. From the action list,
    they choose to send an e-mail to all the records in the result list. The e-mail
    contains information about the location, time, parking details, and a copy of
    the agenda as an attachment. In addition to the direct benefit of reminding the
    Board about the meeting, FPAGM values the fact that a record of the e-mail is
    attached to each contact as a completed activity. This provides a historical record
    of communication with the Board, and may be helpful should one of the Board members
    claim that they did not receive the reminder.


    # Working with contact records


    Throughout this chapter, we''ve covered a lot of ground with regard to contacts.
    However, our emphasis has been on understanding the types of data collected, navigating
    through the system, and working with search tools and results. Let''s wrap this
    chapter up by looking at alternate workflows and record maintenance through deduping
    tools.


    # Alternate workflows


    We are working within a CRM, a Constituent, or Contact relationship management
    tool. So it''s natural to view your data through the lens of contacts. Just about
    everything we''ve covered thus far has done this; we''ve either been working inside
    a single contact record or we''ve conducted a search to take action on a group
    of contact records.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'However, sometimes it may seem more natural to start with the action instead
    of the contact record. CiviCRM provides several options for this type of alternate
    workflow.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_190_0.png)


    On the left sidebar, you will see a **Create New** button and a drop-down menu.
    This button is always visible in Joomla!; and is a **default-enabled** block in
    Drupal. Drupal users may configure it through the Drupal **Administer | Site building
    | Blocks** tool. In addition to options for creating contacts, there are options
    available for creating an activity, contribution, e-mail, event registration,
    membership, pledge, group, or tag.


    Many of these options are also listed under the appropriate main menu item (for
    example, **New Contribution** is listed under the **Contributions** menu).


    Choices that will create records attached to a contact will have a contact field
    on the form where you can begin typing an existing contact name or choose to create
    a new contact from the drop-down.


    Creating a new record "on-the-fly" causes a pop up window to appear with a few
    contact fields. This form is configurable through **Administer | Customize | CiviCRM
    Profile**. By default, it contains only a few required fields. You may want to
    expand what fields are included in order to ensure that the system users collect
    more information when they are entering records into the system.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'The profiles used for "on-the-fly" contact creation are entitled **New Household**,
    **New Individual**, and **New Organization**. Notice in the CiviCRM profile listing
    page, that these are marked as **Reserved**. Throughout CiviCRM, any records marked
    as **Reserved** cannot be deleted, and will be used for special purposes in the
    system. It is recommended that you do not make any radical modifications to reserved
    records, as it may have unintended consequences in the system. For example, we
    advise against renaming the **New Individual** profile, and then using it as a
    contact signup form.


    # Eliminating duplicates


    Data is king. Even the most advanced CRM tools will be virtually useless if the
    data it is handling is incorrect, messy, or outdated. Your system will live or
    die based on the principle of garbage in/garbage out.


    What steps can you take to improve the quality and reliability of your data? One
    important way is to reduce record duplication.


    Record duplication is an unavoidable reality, especially once you begin to expose
    forms to the front of your website and invite constituents and site visitors to
    submit their own data. Fortunately, CiviCRM has several ways of dealing with record
    duplication.


    # Strategies for dealing with duplicates


    There are three strategies we will use in the fight against duplicates:


    +   - **Policies and procedures:** Yes, the first tactic is a human resource and
    management strategy. Anyone who is working in CiviCRM as an administrator must
    understand the importance of reducing duplication. You can start this is by enforcing
    a policy where every time a user is going to work on a contact record, they begin
    by doing a search for the contact. Simple, right? How many times do people enter
    the system and immediately begin by creating a new record? CiviCRM''s auto-fill
    search tools will help significantly, but they will only benefit you if they are
    used.


    +   - **Inline deduping:** While creating or editing a contact record, CiviCRM
    does a lookup to see if there is a potential match with an existing record. If
    so, you are given the option of visiting the potential duplicate record or continuing
    to save your current record. CiviCRM uses deduping rules (discussed in the following
    point) to define what potentially constitutes a match. The default fuzzy rules
    are used for inline deduping. You may also trigger a dedupe check with the **Check
    for matching contacts** button.'
  merge: -1
  img_proc: true
- pgno: 192
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 193
  md: 'FPAGM recently hosted their annual conference, drawing over 350 people from
    the state to learn more about food pantry management best practices and hear about
    other homeless action initiatives happening throughout the country. A majority
    of the participants registered online. While this significantly eased the amount
    of data entry work required by staff, it did generate duplicate records in the
    system as many participants were not careful while filling out the forms.

    A majority of the Association''s existing contact records (prior to the conference)
    did not have an e-mail address, so the default matching rules were too strict
    for their needs. They decided to create a new fuzzy individual rule to match on
    first name and last name.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_193_0.png)


    # Finding duplicates


    The matching rules configuration form consists of three columns that may be configured:
    Field, Length, and Weight.


    +   - **Field**: This indicates the data to be tested as a potential match.

    +   - **Length**: This indicates how many characters in the field value should
    be measured. A lower value will result in more matches, as more records are likely
    to find a match if a shorter value is used. For example, a length of four in the
    last name field would match Johnson and Johnston, whereas a length of six would
    not match (Johnso != Johnst). In the preceding example, we are seeking to have
    a fairly fuzzy match, so we''ve defined a short length. Leaving the field blank
    will require a match on the entire field value.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '+   - **Weight**: This is used to calculate the likelihood of a match. Using
    the preceding rule, a match on both first name (10) and last name (10) yields
    a total score of 20, which meets the threshold value at the bottom of that column.
    The example above is very basic; we are simply requiring a match on all fields
    for the system to consider the contact a potential match. Consider an alternate
    configuration:

    +     - First name (10), Last name (10), E-mail (5), City (5), Total threshold
    = 25

    +     - In this configuration, a match on first name, last name, and e-mail, OR
    first name, last name, and city, would both meet the threshold and return a potential
    match


    You will want to think carefully through your settings for dedupe rules. Rules
    that are too strict may result in missing some valid duplicates, and rules that
    are too fuzzy will yield long result lists that are cumbersome to work with. In
    particular, review the default **Strict** rules, as these impact deduplication/
    merging in hands-off environments (online forms and imports).


    Once you''ve configured your rule, click on **Save** to return to the rule list
    and click to use the rule. By default, a rule will be run against the entire database
    (with the contact types appropriate to the rule). However, you can also choose
    to restrict the process to a group. This is helpful if you have a very large database
    and want to process deduplication in smaller chunks of targeted records.


    # Merging duplicates


    After triggering (running) a rule, CiviCRM provides a list of potential duplicate
    contacts. The two potential matches are listed, along with the total weight (higher
    weighted matches are first), and a link to merge the records.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_194_0.png)


    The merge function is where the real power of this tool is realized. Both records
    are presented in a grid, and you decide which fields will be moved from the duplicate
    on the left to the main contact on the right. In this way, you can choose exactly
    what fields will be merged. The tool will also combine any related records, such
    as activities, contributions, membership, and so on. This is important, as you
    would not want the historical data contained in those records lost as a result
    of the merging process.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# ## 多晶硅生产配套用碳化硅制品


    碳化硅陶瓷制品具有优异的高温力学性能、热导率、抗热震性、抗氧化性能、耐磨损性能以及化学稳定性，特别适合在 1200°C 以上氧化性或腐蚀性气氛中作为结构部件长期使用。在光伏多晶硅生产领域，碳化硅陶瓷是目前多晶硅氢化炉、还原炉用高品质石墨部件(如钟罩、底盘、加热器等)的最佳替代品。


    我公司生产的碳化硅陶瓷制品根据使用温度区间和工况环境要求，分为常压烧结碳化硅陶瓷和反应烧结碳化硅陶瓷两大类，产品具有以下主要特征:


    +   - **使用温度高**：最高可达 1600°C(常压烧结碳化硅)

    +   - **热导率高**：最高可达 125 W/mk(常压烧结碳化硅)

    +   - **耐酸碱腐蚀**：化学惰性，耐酸碱侵蚀

    +   - **纯度高**：常压烧结碳化硅纯度可达 99% 以上，避免对多晶硅的污染

    +   - **热稳定性好**：抗热震性能优异，不易开裂

    +   - **使用寿命长**：显著延长设备检修周期，降低运行成本


    碳化硅陶瓷材料与石墨材料主要性能对比


    | 性能指标 | 单位 | 常压烧结碳化硅 | 反应烧结碳化硅 | 高纯石墨 |

    | :--- | :--- | :--- | :--- | :--- |

    | 体积密度 | g/cm³ | 3.10 | 3.02 | 1.85 |

    | 最高使用温度 | °C | 1600 | 1380 | 2500 |

    | 热导率(20°C) | W/mK | 120 | 125 | 90-130 |

    | 热膨胀系数(20-1000°C) | 10⁻⁶/K | 4.5 | 4.3 | 2.0-3.5 |

    | 抗弯强度(20°C) | MPa | 380 | 250 | 40-60 |

    | 抗弯强度(1200°C) | MPa | 400 | 280 | 20-30 |

    | 弹性模量 | GPa | 410 | 330 | 8-12 |

    | 硬度 | GPa | 27.5 | 25 | 1-2(肖氏) |

    | 灰分含量 | ppm | <50 | <500 | <500 |'
