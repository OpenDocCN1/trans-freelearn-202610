- pgno: 4
  md: '# Foreword


    Donald Lobo, Michal Mach, and I started CiviCRM almost six years ago. Back then,
    open source software had gained traction in the operating system arena, but the
    idea of an open source application designed from the ground up to meet the needs
    of non-profits and other civic sector organizations was pretty radical. We were
    convinced that there was a natural affinity between the principals of open source
    development, namely peer production, collaboration, and transparency, and the
    goals and culture of many civic sector organizations.


    As I see it, the chief benefit of open source software is that the capabilities
    of the software grow and expand to meet the needs of the organizations that are
    sponsoring and using it. This has been called "fitness for purpose", and differentiates
    CiviCRM from other CRM software, which often is more like an ill-fitting "hand-me-down"
    from the enterprise sector.


    CiviCRM has grown to become the CRM software of choice for thousands of organizations
    around the globe. We''ve built a talented and dedicated team of developers, and
    met the challenges of building software which addresses the diverse needs of organizations
    ranging from community arts groups to national membership associations, grassroots
    organizations, political campaigns, religious organizations, foundations, and
    government agencies.


    Along the way, we''ve struggled with finding the right processes and tools for
    nurturing a supportive and welcoming community, improving the quality and usability
    of the software while responding to the never-ending stream of requests for more
    (and more complex) functionality, and developing a revenue stream to sustain the
    project. This is an ongoing journey, and the advent of the first commercially
    published guide to CiviCRM is another milestone.


    This book is a power tool of sorts. As a "manual of possibility", it will ignite
    new thinking as to how you can maximize returns to your organization that have
    not been possible before based on prior technologies you may have used (or lacked).
    If you''re a current CiviCRM user, you will find ways to streamline workflows
    and leverage the data you have more effectively. Regardless of your situation,
    this book has been designed with YOU in mind.'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'The authors, Brian Shaughnessy and Joseph Murray, have been active in the CiviCRM
    community for several years, and have implemented CiviCRM-based solutions for
    a wide variety of organizations. This has given them insight into what CiviCRM
    is all about, and how it can be used for optimal return.


    When I see new and creative CiviCRM-based campaigns come across my Twitter feed,
    new local Civi meet-ups announced, or patches submitted by a newly up-to-speed
    developer, or watch a non-profit staff person''s eyes light up when they see the
    power of having all their constituent information in one centralized place, I
    feel confident in the future of CiviCRM.


    Ultimately, that strength of any open source project is the strength of the community
    behind it. I urge all of you who use CiviCRM to participate actively in the community.
    Sponsor new features and improvements, submit patches, share case studies, and
    help others who are getting started! You can do it all at http://civicrm.org/.


    David Greenberg


    Co-Founder of CiviCRM'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# About the Authors


    **Joseph Murray, PhD**, is the owner and principal of JMA Consulting, specialists
    in e-Advocacy, e-Consultation, and Citizen Engagement for progressive organizations.
    He has extensive experience on non-profit boards, at senior levels of government,
    and running electoral, referendum, and advocacy campaigns. JMA Consulting has
    provided CRM systems to hundreds of political campaigns tracking interactions
    with tens of millions of voters, as well as providing Drupal and CiviCRM strategy,
    implementation, development and training services to numerous non-profit and advocacy
    groups.


    Joe has served on the CiviCRM Community Advisory Group, and is a Director of the
    Toronto Drupal Users Group.


    I''d like to thank my life partner, Lisa Austin, for her patience, love, and support;
    and our sons, Calum and Rafe, for the wrestling matches and tickle fights. Thanks
    also to my clients, for their CRM challenges, patronage, and thoughtful and passionate
    efforts to make the world a better place , to Dave, Lobo, Kurund, and the rest
    of the core team for their leadership, vision, and hard work; to Brian for shouldering
    so much work in this wonderful collaboration; and to Steven Wilding and rest of
    Packt crew for their support and assistance in making this book a reality. Finally,
    I''d like to thank all the CiviCRM community developers, wiki authors, forum posters,
    and users around the world - you''re the inspiration for this book and the people
    who really make our open source project prosper.


    JPM'
  merge: -1
  img_proc: true
- pgno: 7
  md: '**Brian P. Shaughnessy** is the owner and principal of Lighthouse Consulting
    & Design, a web development firm specializing in Joomla! and CiviCRM implementations.
    Brian previously worked with an association management company for over 10 years,
    providing services to not-for-profit professional, trade, and charitable organizations.
    After starting his own business, he channeled that experience into effective implementations
    of CiviCRM for not-for-profits. He has worked with organizations around the world,
    helping to achieve greater efficiencies and expand functionality through CiviCRM.


    Brian has served on the CiviCRM Community Advisory Group and helped author the
    first edition of *Understanding CiviCRM* (later renamed *CiviCRM: A Comprehensive
    Guide*). He has worked with the core development team to provide end-user training
    and maintains a strong working relationship with the project leaders. Brian has
    also been active in the Joomla! project, serving on the Google Summer of Code
    program as a Joomla! mentor. He has provided professional Joomla! training through
    http://technicallead.com/.


    I''d like to thank my family for their support while writing this book, and to
    Joe for helping spearhead the project and partnering as my co-author. I''d also
    like to give particular thanks to the core development team and CiviCRM community
    for helping make a terrific piece of software. Lobo, Dave, Kurund, and the developers
    spread around the world — thanks for bringing the power of an open source CRM
    to the not-for-profit community.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# About the Reviewers


    **Alan Dixon** has been helping non-profits with their contact databases since
    1989. He works as an independent website developer, is based in Toronto, Canada,
    and has been building websites with CiviCRM since 2006. He maintains the site
    http://community.civicrm.ca.


    **David Geilhuf e**, born and raised in Silicon Valley, focuses on the intersection
    of technology and social change. He has founded non-profits and for-profits, built
    the operations of corporate citizenship organizations and private foundations,
    developed venture-funded enterprise software systems, brought together open source
    communities, and mentored at-risk youth into high-tech employment. He''s always
    looking to create and execute a big idea that will do a little good for the world.


    David currently runs http://netsuite.org/, NetSuite''s corporate citizenship program
    focused on delivering an ultra-low-cost back office solution to charities and
    social enterprises worldwide.


    **Mohamed M. Hagag** is a Unix/Linux system engineer with free open source software
    passion. He likes research and development on FOSS, and is working independently
    and with teams on FOSS R&D since 2004. His current and past employers are small
    and medium-scale companies working in the IT market in general with some level
    of UNIX/Linux specialization. Though he hasn''t officially worked on any book,
    he has worked on translating some technical books to Arabic language.


    I want to first thank God for everything good in my life, and then thank my parents,
    sisters and my wife for making my life that nice, so that I can move ahead.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '**Rico Landman** is a web developer from Zwolle, the Netherlands. After working
    for several companies as a web developer, he started his own company Futurix.
    He mainly works with PHP and is a devoted open source partisan, excelling in the
    use of Magento, Drupal, vTiger, and so on.


    In the last few years he has tended to seek cooperation with other open-source-oriented
    companies. Most of his projects reside under Simourix (co-owner) or Trinfinity,
    an international network of specialists working in the high-end Internet industry.


    Dedicated to Marja, Carmen, and Ralph, and also to my business partners Marcello
    and Hans.


    **Eileen McNaughton** lives in Wellington, New Zealand where she divides her time
    between CiviCRM consulting, accounts for the family automotive business, two pre-school
    super-heroes, and the occasional bit of sleep. She first became involved in CiviCRM
    while setting up online class registrations for Wellington Circus Trust (for which
    she is a Trustee) and has been involved in a number of CiviCRM and Drupal implementations
    for Fuzion since then. She has contributed numerous patches to the Core codebase
    including payment processors, a custom search, and enhancements to invoices. She
    has also been working on integration with Xero accounts package and a CiviCRM
    extension to the popular Drupal Migrate module.


    She is a regular voice on the forums and CiviCRM blog, and is driving the Make-it-Happen
    initiative. She serves on the CiviCRM API and CiviAccounts team, appointments
    to which are an honor on some days, and bring the word "sucker" to mind on others.
    Eileen was part of the team that wrote the original CiviCRM Floss manual in the
    book sprint.


    I would like to thank Donald Lobo and the rest of the CiviCRM core team for making
    such a great CRM available to the world and for the huge effort they put into
    helping people use it.'
  merge: -1
  img_proc: true
