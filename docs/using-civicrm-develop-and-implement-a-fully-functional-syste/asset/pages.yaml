    +   > Create a new tag and assign it to imported records

    +   > Tag imported records


    << Previous   Import Now >>   Cancel


    10. Adding your imported records to a tag or group is an excellent way of tracking
    when the import took place or what was the source of the data. It can also prove
    useful for post-import data integrity comparison or to identify what records were
    imported during a partial/failed import.


    11. If you are ready to proceed, click on Import Now to begin the import and monitor
    its progress. Depending on which option you chose for the duplicate record setting,
    you might receive a message indicating that there were duplicate records skipped
    during the import. You will be provided a downloadable csv file where you can
    review the duplicate records.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Activities import


    The activities import is accessed through the Contacts menu and will walk you
    through a similar four-step wizard. The most significant difference is that your
    imported records must connect with existing contact records. In other words, you
    cannot create associated contact records as part of the activity import; the activities
    must be imported to existing contact records.


    The connection to existing contacts can be made by including the internal contact
    ID or external identifier in your activity import file. Using those fields ensures
    the most reliable connection with contact records, as both must be unique values
    in the system. CiviCRM can also connect records using the default strict dedupe
    rules (which by default will be the e-mail address).


    > The External Identifier field is intended for storing unique IDs from the database
    system you are migrating from. It can be particularly useful when you have core
    contact data as well as related record data (such as activities) that you are
    importing from that legacy system.


    Imported activity data must also include a column containing the activity type,
    which must correspond to one of the types configured in CiviCRM. If you have not
    done so, visit Administer | Option Lists | Activity Types to review the existing
    types and add new ones as needed.


    Activity imports must be done with csv files (the SQL option we saw with the contact
    import is not available to activity import), and you will not have any dedupe
    processing. If an import errors file is returned, it is likely to contain unmatched
    records as well as invalid values. Unmatched records are those for which no matching
    contact was found within the existing contact records.


    # Tips for preparing your data


    While CiviCRM may facilitate the actual import process, the hard work comes with
    preparing your data for import.


    You should begin by taking time to scrub your data. That will involve removing
    old records you don''t want to clutter your new system with, ensuring valid values
    for fields such as e-mail and website, creating consistent values for any fields
    using option values, and generally reviewing your data to ensure it is as clean
    and well-ordered as possible.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Depending on how your legacy system handled individuals, households, and organizations,
    you may need to do some work to split your data into subsets of records based
    on their contact type. Remember that you can only import a single contact type
    at once when using the CiviCRM import tool. That being said, there are some exceptions,
    or rather clarifications, to that rule.


    When mapping your contact import, note the series of **Related contact info**
    fields toward the bottom of the field list. These fields will allow you to import
    data to the primary contact type (for example, **Individuals**) while inserting
    data into related records. If the related record does not exist, CiviCRM will
    create it and then build the relationship.


    This is not the most efficient way to handle imports, and if you''re not careful,
    can inadvertently create unintentional related records. However, for imports with
    only a few fields to be inserted in the related record, it may be useful. Also
    be aware that if your imported data has empty values for the related record fields,
    CiviCRM may create the related record anyway (with empty data). This will require
    some cleanup in the system after the import.


    The preferred method is to import records for one contact type and then import
    the related record. For example, you might import all your organization records
    and then import individuals using the related fields to match on the organization
    name.


    After completing your contact imports, you may want to run a dedupe search and
    merge duplicate records. Despite your best efforts, duplicate records are bound
    to show up, especially after an import. What is great about the CiviCRM merge
    function is that you can easily combine related records. For example, if ACME
    Company and ACME Co. are the same firm, each may have related records in your
    legacy system (for example, contributions, activities, and relationships). When
    you merge the two records, those related records will be combined together in
    the resulting merged contact. Handling the data merge from within CiviCRM can
    reduce the pain and annoyance of trying to track down and merge the various related
    records in your previous system.


    As noted above, take database backups before you begin importing and at regular
    intervals throughout the process. You will want a path for reverting to a previous
    dataset should something go wrong.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Migrating to a production server


    One common question involves how to best migrate your data from a development
    or staging server to your production server. Unfortunately, there''s no "one-size-fits-all"
    answer to that question. Your internal workflows and the general nature of your
    system will dictate the best method available.


    Understand that currently there is no convenient way to merge two CiviCRM databases.
    If you are doing a large import into a staging server, you will need to identify
    and export any changes to your production database before deploying from your
    staging server. The change logging that is being introduced in version 3.3 may
    provide some support for these types of needs.


    The CiviCRM tables found in your database are very portable. There are really
    only two that may need to be reset or cleared out when moving the database: the
    civicrm_domain table that contains directory and URL settings that may change
    once you''ve migrated to a new server, and the civicrm_uf_match table that connects
    your CMS users to CiviCRM contacts. With the domain table, you may need to set
    the config_backend field to null in order to force CiviCRM to reset the values,
    and the uf_match table may need to be emptied in order to force new matches with
    the existing CMS users. In addition, you should truncate the various cache tables
    to ensure that new content is being generated from the new location.


    For a full discussion of migration steps and troubleshooting tips, see: http://wiki.civicrm.org/confluence/display/CRMDOC/Moving+an+Existing+Installation+to+a+New+Server+or+Location.


    # Summary


    In this chapter we:


    +   - Configured custom data sets/fields and began to understand their many uses

    +   - Created profiles in order to collect fields for various uses

    +   - Implemented a profile search and edit form, demonstrating the capabilities
    for exposing CiviCRM data to your website visitors and users

    +   - Reviewed the contact and activity import process, helping you migrate data
    from previous legacy systems to your CiviCRM database

    +   - Touched on key considerations when migrating from one server to another


    Looking ahead to the next chapter, we will look at communicating more effectively
    using CiviMail, CiviCRM''s broadcast e-mail system, and looking holistically at
    the tools available for managing your contacts with a view toward communicating
    better with them.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# 6

    Communicating Better


    Central to the success of your organization is its ability to communicate effectively.
    Though CiviCRM doesn''t replace the hard work of crafting content and strategies,
    it does provide powerful tools to facilitate your communication efforts. This
    chapter begins by briefly reviewing how your communication efforts can improve
    your constituent relationships. We then outline how to:


    +   - Communicate better

    +   - Send e-mails to one or more constituents

    +   - Print address labels

    +   - Organize constituents into groups for bulk mailing

    +   - Send a bulk e-mail

    +   - Set up a template for bulk e-mails

    +   - Customize the templates for system workflow messages

    +   - Record e-mails sent to constituents from your normal e-mail client


    If you''re just interested in the mechanics of how to use CiviCRM to communicate
    with constituents, feel free to skip the next section where we discuss principles
    and concepts of effective communication.


    # How to communicate better


    CiviCRM can assist your organization in sending, receiving, and tracking online
    and offline communications, but it is up to you to create an appropriate communication
    plan that fits your CRM strategy. Ideally, you will communicate in ways that will:


    +   - Effectively and efficiently achieve your organization''s mission

    +   - Respond to the interests of the different types of constituents in terms
    of topic, treatment, tone, and timing'
  merge: -1
  img_proc: true
- pgno: 238
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 239
  md: 'Perhaps the most common form of communication by non-profits today, and our
    focus in this chapter, is bulk-email products that constituents may subscribe
    to. These could be monthly newsletters, daily updates, time-sensitive communication
    such as urgent action alerts, notifications of new publications, or other content
    of interest to users. As constituents move up the ladder of engagement, your CiviCRM
    system will know more about them, providing you tools to more effectively target
    contact segments and personalize the communication content and calls to action
    they receive.


    The kind of material you distribute will determine who signs up and remains on
    your list. Make sure that the content of your communications and its "voice" is
    appropriate: Is it analytical or anecdotal? Is it authoritative or casual? You
    may publish dry announcements for an organization that is a clearing house on
    changes in labor law, narratives from an opinionated person for a homeless shelter,
    or a quirky gossip column for a creative sector association. Each speaks in a
    tone and with content that may resonate with its intended audience.


    Repurposing content for different channels helps stretch your resources further.
    Let''s say your organization puts out a few major research reports a year. You
    might want to:


    +   - Distribute a press release

    +   - Author a blog entry about it

    +   - Mention it on your own social media channels

    +   - Post about it into allied channels

    +   - Include a summary or a couple of extracts in your newsletter(s)

    +   - Hold an event where the authors present the work and have a discussion


    All this could be done in addition to sending out an announcement to people who
    have specifically asked to receive notifications of new publications. Find ways
    to extend the reach of your work through multi-purposing content.


    Take advantage of automated communications to cross-market your organization''s
    activities, services, and news. There are a number of places where CiviCRM automatically
    sends out messages in response to a user''s action, such as an event registration
    confirmation e-mail or donation receipt. You can customize the templates used
    to produce automated messages. These include confirming event sign-ups, thanking
    people for contributions, and notifying them when their volunteer sign-up preferences
    have been received with thanks.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'Tokens, which are merge field placeholders for a contact''s data, can be used
    to ensure that personalized information such as names and addresses are included
    in receipts. By crafting these messages beyond the default version that ships
    with CiviCRM, you can use them to tell your organization''s story, seek further
    involvement, or solicit more support. Make sure the voice and tone in these messages
    are appropriate. The primary purpose of these automated messages should be to
    continue providing details to constituents in direct response to their action
    (for example, a receipt). Without hijacking their primary purpose, you can build
    secondary messaging into these messages to build your brand and impart your story.
    For example, you can put your organization''s tag line or this month''s featured
    call to action into the footer of all automated messages.


    As mentioned above for all of your communications, the writing style or voice
    of these automated messages should suit your organization’s persona. A professional
    business tone, for example, might result in: “Thank you for your contribution.
    Your official tax receipt will be issued in January for all charitable contributions
    received this year." For a youth-oriented organization, a more casual style is
    likely better: "Thanks for helping to deck the Dumbo Corporation. Tweet #deckdumbo
    with other oddball campaign ideas."


    CiviCRM provides support for several proven best practices in online viral communications.
    For example, "forward to a friend" functionality may be enabled and will appear
    just after a constituent has signed up for an event or completed a donation. By
    offering this opportunity to invite others, you take advantage of "motivation-inertia"
    and extend your organization''s reach through constituent networks. Besides, most
    people would be happy if some colleagues or friends were at the event with them,
    or want to tell others about a cause they''ve just donated to. Similarly, a good
    moment to invite people to start their own personal campaign to raise money for
    your organization is just after they have completed their own donation.


    The essence of what we''re getting at is the need to be intentional and strategic
    about what you say, when you say it, and how you say it, while remaining on the
    lookout for serendipitous opportunities to link communications and extend your
    message.


    # Call to action


    Many for-profit marketing and sales techniques work well in the non-profit sector
    when asking for donations, volunteer time, event attendance, signing petitions,
    and so on. One simple but important communication technique to improve response
    rates is to have a clear, compelling call to action.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Making the link between the action and a concrete desirable outcome improves
    response rates. For example, an emergency relief organization might communicate
    that every dollar you contribute will buy a child in the earthquake zone one day''s
    worth of food. Increasing the urgency of the call improves response rates: "If
    you act now, then [fill in the blank with a desirable outcome]" or "If you don''t
    act now, then [fill in the blank with an undesirable outcome]."


    Engaging respondents'' emotions such as through graphic pictures, anecdotes, and
    personal stories usually greatly increases response rates. They are the star actors
    in the show. By contrast, compelling rational cases using statistics and telling
    factoids are like supporting cast. They are best used to fill out the performance
    and help the stars shine.


    The surrounding communication—text, graphics, music, and video—should all build
    the case for taking the action. Repeating the call to action several times in
    visually appealing and different ways helps, such as bold text links as well as
    buttons. By making it easier to complete the action, you improve response rates.
    "Click here" works better than expecting people to print a form, find their check
    book, get an envelope and stamp, and post the letter containing a donation.


    # Reinforcing your brand


    Whether you are aware of it or not, everything your organization does while interacting
    with the world contributes to its reputation. Do people trust that your research
    is solid, come to you for innovative policy suggestions, or refer volunteers to
    you? Are they worried you''ll waste their donations on administration? Can they
    count on you to get media attention for the issue? Are they uncomfortable with
    your approach because it is too confrontational or too cozy with the villains?
    Your brand is the sum of all these perceptions.


    While knowing how you are perceived is one part of the story, the more important
    part is what is yet to happen. How does your organization want to be thought of?
    Could changing the organization''s brand improve how well it achieves its goals?
    Would a sunnier, more playful visual identity help? A grittier, low-cost one?
    What about a more conservative, slicker one?


    Communication activities are an important part of your brand. More people will
    typically receive bulk or broadcast communications than will interact directly
    with your organization through the programs and services you offer.


    Everyone communicating with constituents on behalf of your organization should
    understand how their work fits into achieving the objectives of the organization.
    That way, they''ll be able to strike the right tone in the messages, words, images,
    colors, and style they use. Communicating with constituents through CiviCRM, either
    one-on-one or in a broadcast manner, should always be done in a way that is intune
    with your organization''s overall brand and visual identity.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Sending e-mails to one or more constituents


    CiviCRM provides tools for sending e-mails directly from the system, both to small
    sets of contacts (a single constituent or small group of constituents) as well
    as to large volumes of contacts. Later in this chapter, we will look at broadcasting
    e-mails using CiviMail in more detail. The line dividing easier, simpler, lower
    volume e-mailing and bulk, mass, or broadcast e-mailing is not always clear. Broadcast
    e-mailing is clearly appropriate when you are sending messages to thousands of
    recipients regularly as you need to know the open and click-through rates and
    segment based on that behavior, and you do not want to manually process invalid
    e-mails from the list or deal with temporarily unavailable accounts.


    To keep things relatively clear, we''ll call sending a non-broadcast e-mail e-mailing
    and follow CiviMail''s terminology of referring to a broadcast e-mail as a mailing,
    and will always refer specifically to CiviMail rather than CiviCRM when dealing
    with bulk or broadcast e-mailing.


    # E-mailing using an external client


    The simplest way to use CiviCRM to assist with communicating is to just click
    on any e-mail link it displays. For example, the Contact Summary page displays
    a contact''s e-mails as clickable links. This will launch your e-mail client,
    placing the contact''s e-mail into the TO: line. While this allows you to easily
    send an e-mail when looking at a contact''s record, it may not be ideal from an
    overall CRM perspective as the e-mail will not be saved in CiviCRM. Fortunately,
    CiviCRM provides several tools to improve your ability to record e-mails directly
    in the system.


    The question of what to retain and what not to retain in the system is important
    for your overall CRM strategy. Not all communications with all constituents need
    to go into CiviCRM. You must weigh the pros and cons of collecting and having
    too much information versus too little information. The former may create extra
    work ensuring the communications are stored and create a clutter of material to
    wade through in the system. The latter may result in other disconnected offline
    data sources being used to store and retrieve key information, or having insufficient
    history about interactions with a constituent. Once you''ve navigated these waters,
    develop a policy and procedure statement to guide staff which includes clear examples
    of what should definitely be included in or generated from the system, and what
    should not.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'Many CiviCRM sites, perhaps the majority, just track auto-generated messages
    sent to constituents and broadcast e-mails. Some may choose to record a few manually
    generated types of official communications to their system, such as e-mails notifying
    grant winners in CiviGrant. Others may try to collate all e-mails, in-person meetings,
    and phone call records that are related to one another through CiviCRM, particularly
    in the area of case management.


    Articulating an appropriate policy where just important and useful e-mails are
    tracked can be challenging. We''ve all seen e-mail threads with 14 entries just
    trying to set the time, date, and place for a meeting. These communications may
    be voluminous and have no enduring interest or significance. Document retention
    policies usually distinguish between different types of communications that have
    appropriately shorter or longer retention periods depending on whether it has
    continued relevancy or legal liability.


    Your policy on what to put into CiviCRM needn''t include all e-mails just because
    it is relatively easy to capture them, nor should it exclude phone and face-to-face
    conversations in advancing a file because of the extra work involved in documenting
    those interactions. Will the constituent expect the organization to "remember"
    an interaction? If so, it likely belongs in CiviCRM.


    To make the system useful, and avoid significant wastage of time when something
    should be in the system but isn''t, the policy needs to be clear and followed
    consistently.


    # E-mailing using CiviCRM


    As alluded to earlier, in addition to providing hotlinked e-mail addresses that
    will open in your preferred e-mail client, CiviCRM provides tools to e-mail one
    or more constituents directly from the system. Assuming you are about to e-mail
    something to a constituent that should be kept in CiviCRM, there are several ways
    to invoke e-mailing contacts in CiviCRM without using its broadcast e-mail component,
    CiviMail.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'To e-mail a single contact on a Search Results page that has an e-mail displayed,
    select Send an Email on the More link at the right end of the row.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_244_0.png)


    To e-mail multiple contacts from a Search Results page:


    +   1. Select one or more contacts, or choose the All Records radio button.

    +   2. Select Send Email to Contacts from the alphabetical listing on the - actions
    - button.

    +   3. Click on the Go button.


    Third, from a Contact Summary page, you can click on Actions | Send an Email.
    Note that if the contact does not have an e-mail or their privacy options are
    indicating they should not be e-mailed, then the Send an Email action is not displayed
    as an option.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_244_1.png)


    Finally, from any page in the system, you can click on the Create New button in
    the left sidebar (default block location) and select Email.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'All four approaches will bring up the following form for e-mailing via CiviCRM:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_245_0.png)


    While it seems like a fairly standard e-mail form, let''s go through it field-by-field
    to learn about its special features:


    +   - **From**: This defaults to the primary e-mail of the currently logged in
    user but also allows you to select from other e-mails set up in **Administer |
    Configure | FROM Email Addresses**. This is particularly useful for situations
    where there are departmental or functional e-mails (for example, `info@example.org`,
    `volunteering@example.org`, `events@example.org`) or where one staff member sends
    e-mails on another''s behalf (for example, `ExecutiveDirector@example.org`). The
    e-mail will be logged as an activity for all contacts specified in the **From,
    To, CC, and BCC** fields.

    +   - **To**: The primary e-mail address of the contact(s) to be e-mailed. If
    you arrived at this form through the contact record or search results, the field
    will be populated with the originating contact(s) e-mail address. If you arrived
    using the **Create New** button, you will need to search for the contact(s) you
    wish to send to. You can add additional e-mails using the standard auto-completion
    search functionality (name and e-mail).'
  merge: -1
  img_proc: true
- pgno: 246
  md: '+   - **Add CC | Add BCC**: These links provide auto-completion search fields
    and ensure that the e-mail activity is added to the record of the relevant contacts.

    +   - **Subject**: In addition to providing text that will appear unchanged on
    the subject line in people''s inboxes, you can use the Insert Token link to include
    information from a contact''s record that should be looked up and inserted into
    the subject line. This can include either core fields such as a person''s first
    name, or contact-type custom fields that are specific to your installation of
    CiviCRM. The latter are included in the alphabetized drop-down list of field names
    as **Custom Field Name :: Custom Data Group Name**.

    +   - **Use Template**: E-mail templates are used in slightly different ways in
    different parts of CiviCRM:

    +     - Unlike automated message templates generated from event signups, contribution
    pages, and other public facing forms, templates selected when manually sending
    an e-mail will pre-populate the content field and provide you an opportunity to
    manually edit the content before it is sent out. As a result, the process is more
    like making and editing a copy of a Word file than auto-generating a letter from
    a Word mail merge template.

    +     - Since it populates the field and then provides access to further edit
    the content, you can take advantage of the tool by creating e-mail templates containing
    just your design/layout branding, and also use it to create standardized responses
    for common queries received by phone or mail. When creating your template, take
    the time to test it thoroughly and ensure cross-client compatibility, including
    reviewing how it will appear in web-based e-mail tools (Gmail, Hotmail, and so
    on). It can take significant fiddling to get HTML-formatted e-mails to look consistent
    in different e-mail clients, especially when you are trying to do sophisticated
    formatting. By investing the time to create a well-constructed template, you will
    save time for end users creating the e-mails and help ensure effective visual
    branding.

    +   - **HTML Format**: CiviCRM ships with two popular WYSIWYG (what you see is
    what you get) editors which support standard formatting tools when constructing
    your e-mail. We find that Drupal users will typically use **CKEditor**, and Joomla!
    users will select **TinyMCE**, as they are more commonly used in those respective
    CMSs. Note that in CiviCRM v3.3, Joomla! users will be able to use the default
    or user-specified editor installed in Joomla! and selected in **Global Configuration**,
    which will significantly extend the options available. The following screenshot
    refers to CKEditor. Some standard caveats apply:'
  merge: -1
  img_proc: true
- pgno: 247
  md: '+   - While visually well-designed HTML e-mails tend to improve readability,
    click-through, and response rates, it is important to test and periodically retest
    how the e-mails are appearing in popular desktop and web-based e-mail clients.
    Invalid HTML markup, such as unclosed tags are red flags to spam checking software;
    so beware of inadvertently creating deliverability problems by having someone
    who is not familiar with HTML doing anything fancy in the HTML source view.

    +   - CSS used in your e-mail should always be inserted directly in the HTML tags.
    Most e-mail clients don''t support style declarations inserted in tags through
    class and ID values.

    +   - Don''t cut and paste directly from Microsoft Word because it uses non-standard
    markup code. Invisible to you when pasting, this markup code will often prevent
    your messages from appearing correctly in your recipients'' inboxes because it
    references Microsoft-specific elements that are not widely supported. If you need
    to copy something from a Word document, the easiest way to remove the problematic
    markup code is to paste using the special Paste from Word or the Paste as Text
    icon. Paste as Word will attempt to retain structural elements, such as bullet
    lists, whereas Paste as Text more thoroughly strips all design and layout elements.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_247_0.png)


    +   - For an image to appear in your constituents'' browsers properly, it needs
    to be available on the Web somewhere. Generally, it is best to upload any image
    you need in your e-mail to a publicly accessible part of your website, making
    note of the URL that displays the image.

    +   - When referencing pages on your website or inserting images, be sure to use
    the full URL (http://...), not a relative path. Remember that the e-mail received
    by your constituents will not be directly connected to your website, so relative
    path resources will be meaningless.

    +   - There are a number of good resources (many of them free) for obtaining e-mail
    templates that are compatible with most e-mail clients. Consider obtaining some
    as the basis for your template and then modify to suit your organizational branding.'
  merge: -1
  img_proc: true
