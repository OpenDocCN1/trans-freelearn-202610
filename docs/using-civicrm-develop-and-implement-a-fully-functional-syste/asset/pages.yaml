- pgno: 368
  md: '# Managing Events


    In either case, registrants remain on the waitlist until space becomes available,
    at which point they are sent an e-mail inviting them to register. We will see
    one additional option impacting this process on the **Online Registration** form
    — the ability to define an expiration period for their **Pending** status. Let''s
    review how the process works through an example:


    +   1. While attempting to register, an individual is informed that the maximum
    number of registrants has been met.

    +   2. The person chooses to go on the waitlist, and then enters his/her name
    and e-mail address.

    +   3. After three days, your organization decides to move the event to a new
    venue that accommodates 10 more people. After altering the settings in the system,
    the first 10 people on the waitlist (first come first served) receive an e-mail,
    inviting them to register. CiviCRM automatically changes the status of their registration
    from **On waitlist** to **Pending from waitlist**. If they have not registered
    after the expiration period is over, then their registration status changes to
    **Expired**.

    +   4. During the period when the status of these 10 registrations is **Pending
    from waitlist**, only those waitlisted contacts may register. New visitors to
    your website will not be able to register, as preference is given to waitlisted
    people. Waitlisted individuals beyond the first 10 (who were invited to register)
    remain on the list. As these waitlisted individuals respond to the invitation
    to register or allow the invitation window to expire, new people are invited to
    register (if there are additional individuals on the waitlist) or the registration
    form becomes publicly available.


    While the assumption is that those 10 invited people on the waitlist will sign-up
    in a timely fashion, that''s not always the reality of the situation. Some of
    those people may drag their feet or simply lose interest in the event. In either
    case, your ability to successfully fill the event to capacity and give fair opportunities
    to others on the waitlist to attend is compromised.


    The expiration period option improves this by limiting the window of time during
    which places are held for waitlisted invitees to register for the event. We will
    review how to configure it in the **Online Registration** section. There are a
    few things to consider when using this feature:'
  merge: -1
  img_proc: true
- pgno: 369
  md: '+   - Other sorts of pending registrations, that is, **Pending from pay later**,
    **Pending from incomplete transaction**, and **Pending from approval** also expire
    based on the same expiration period. "Pay later" transactions usually require
    a few weeks before a check is received in the mail, so your expiration period
    for "pay later" events may need to balance quite different lengths of appropriate
    periods. You may decide not to provide the option of paying later for events you
    expect will reach capacity. Alternatively, if you''re monitoring the event carefully,
    you could initially enable "pay later", and then disable it when the initial capacity
    limit is reached.

    +   - When you define the expiration time in the event settings, the cron job
    triggers the script that runs analysis on your records and determines if and when
    any e-mails should be distributed. If your cron job is configured to run nightly,
    expiration periods less than a couple of days may have undesirable effects, as
    the actual window during which the individual may register could be too short.
    Also be aware of the fact that many people do not get around to reading, never
    mind responding to, e-mails over the weekend. This leads to undesirable impacts
    on waitlisted users if you have an expiration period of less than 72 hours.


    If you are new to CiviCRM but are interested in this functionality, it may be
    worth setting up a test event and running through the various scenarios with test
    records to understand how the behavior works.


    After completing this form, click on **Continue/Save**. Now, click on the **Location**
    tab to proceed to the next step.


    If you are creating a new event, notice that you are only given the option of
    continuing or canceling after filling out this form. After continuing, the full
    five-step tabbed interface appears and you may navigate between the form pages
    as desired. Note that you must save each page separately as you complete or edit
    it. For example, if you proceed to the second step and then want to return to
    the first tab, you must save the second form before proceeding to the first tab.
    In other words, the **Save** button only impacts the form you are on; it does
    not impact the other tabs. After the initial save, you will have the option of
    **Save**, which saves the information but keeps you in the event configuration
    form, **Save and Done**, which saves and returns you to the event management screen,
    and **Cancel**, which returns you to the event management screen without saving.'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# # Event Location


    The second tab is used to enter the location of the event. Note that this is intended
    for the actual physical location of the event, and not the location of your organization.
    It will be included in the event information page, and if you''ve enabled mapping
    in the first step, it will include a Google or Yahoo! map.


    Once you''ve created your first event and entered a location, that location will
    be available as a selection option for future events. At the top of the form will
    be an option to enter a new location or use an existing one. This is very useful
    if your organization uses various training or event locations on a regular basis.
    However, be aware that any changes to the location will affect all instances where
    that location is used.


    You may enter one or more phone and e-mail address associated with the event.
    The person who answers at this number should be knowledgeable about the event,
    how to register for it, and how to get to it. In some cases, it may be a number
    in your organization, and at other times it might be a number associated with
    a venue. For example, the phone number might be the hotel''s phone number where
    your convention is being held, and where attendees should call to make overnight
    accommodations.


    The last field controls whether the event location should be visible on public-facing
    pages.


    After entering the information, click on **Save** and advance to the next tab.


    # # Fees


    If your event requires payment of fees for people to attend, enable this option
    and begin completing the fields.


    If you have set up a payment processor in your site to handle real-time credit
    card transactions, you may select the processor from the drop-down list. If you
    are not accepting credit card payments on your site, or do not wish to enable
    that for this specific event, you may still collect fees by clicking on **Enable
    Pay Later option?**. The idea behind "pay later" is to ask people to commit to
    payment, which will be made outside the real-time context of the registration
    process. For example, you might allow people to pay with check, to call and pay
    by credit card, or to pay onsite with cash.


    "Pay later" may be used in conjunction with payment by credit card or each option
    may be used independently. However, if you have enabled fees for your event, you
    must have at least one option activated. If both credit card and "pay later" options
    are enabled, the registrant will be given the option of selecting "pay later,"
    which hides and disables the credit card fields from the public-facing registration
    form.'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'After enabling "pay later", you must complete two additional fields. **Pay
    Later Label** is the text to display beside the **Pay Later** checkbox on the
    registration form. **Pay Later Instructions** is a field that can contain a sentence
    or two of instructions on how to pay later. It will be included in both the thank-you
    page and the receipt sent to registrants. We recommend including in your instructions:
    who the check should be made out to, where the payment should be sent, and when
    it needs to be received. For example:


    > *Payments should be made out to "FPAGM" and mailed to 123 Main St, Metropolis,
    ThisState, 12345. Payments must be received within 30 days or at the convention,
    whichever is earlier, or your registration may be cancelled without further notice.*


    The **Contribution Type** field determines how the fees will be categorized when
    the contribution record is created. Your selection is used for the public-facing
    registration form and will set the default value for registrations created through
    the administrative interface. Enter a **Fee Label** to determine the text displayed
    on the public facing information and registration pages.


    At this point, you must configure your fees. There are two ways to construct fee
    options — **Price Sets** or **Regular (basic) Fees**. The **Regular Fees** presents
    a basic list of fee options from which the registrant may select one option. **Price
    Sets** allow the construction of more complex series of options. A **Price Set**
    is a collection of fee fields which may include radio button options (user selects
    one from a list), checkbox options (user may select more than one from the list),
    select field (user selects one from a list), or a text field (user enters a quantity
    which is calculated against the configured per item rate to determine the total
    cost).


    While **Price Sets** provide you with much more control and flexibility when constructing
    your fee options, there are two benefits only available when using the **Regular
    Fees** — the simplicity of the structure makes it easier to use (when searching
    and reporting on the events), and **Regular Fees** may have date-based discounts
    configured through the interface.


    Let''s review the **Regular Fees** with discounts first, then return to discuss
    the configuration of **Price Sets**.


    Use the **Fee Label** and **Amount** columns to define your fee options. You may
    select one option to appear as the **Default**. Once you have your fees configured,
    click to enable **Discounts by Signup Date**. The date-based discount tool consists
    of one or more discount sets with associated fees. Because you can define multiple
    discount sets, you can create a tiered structure for your discounts. For example,
    let''s say your event will take place on March 15. You might construct the following:'
  merge: -1
  img_proc: true
- pgno: 372
  md: "# Managing Events\n\n+   - **Early Registration:** Now through January 15\n\
    +   - **Standard Registration:** January 16 to February 15\n+   - **Late Registration:**\
    \ February 16 to March 14\n\nWhat we've defined as late registration will be entered\
    \ as your **Regular Fee** options. You'll then create two discount sets which\
    \ have the appropriate date ranges to handle the early and standard registration\
    \ fees. After naming the discount sets and entering the date ranges, click on\
    \ **Add Discount Set to Fee Table** to create those sets.\n\nOnce saved, two new\
    \ fee option tables will be added to this form, pre-filled with the **Fee Labels**\
    \ you defined in your **Regular Fees** grid. In most cases, your fee options will\
    \ remain the same; only the fee amounts will change. However, you can restructure\
    \ the discount fees as you wish. For example, you might have a preconference program\
    \ registration that is only available for people who register before January 15,\
    \ which you only add to the first discount set.\n\nThe end user visiting your\
    \ site to register will only see the fees appropriate to the time in which they\
    \ register. CiviCRM takes care of determining what options are listed, ensuring\
    \ that you don't have people trying to register at the discount rate past the\
    \ associated date window.\n\n> **Coupon discounts**\n> \n> While not fully available\
    \ through the interface, CiviCRM is \"prepped\" for handling coupon-type discounts.\
    \ In this model, you disseminate a code to selected contacts, who may enter it\
    \ into the event registration form in order to have a discount applied. Using\
    \ this functionality requires implementation of some custom code, but is not beyond\
    \ the grasp of a beginner programmer. For more information, see the blog post\
    \ online outlining how to set this up at `http://civicrm.org/node/566`.\n\nAs\
    \ just described, price sets allow more advanced options for configuring event\
    \ fees. The one downside of using price sets is that they do not currently accommodate\
    \ date-based discounting through the interface.\n\nPrice sets must be created\
    \ in the price set management tool before assigning them to a specific event.\
    \ While we are still on the event fee configuration page, note the message concerning\
    \ price sets. If you already have at least one price set configured, a select\
    \ box will display allowing you to select one. Doing so will hide the **Regular\
    \ Fee** sections, as you must choose one system or the other when configuring\
    \ fees."
  merge: -1
  img_proc: true
- pgno: 373
  md: 'To construct a price set, visit Events | New Price Set, or Manage Price Sets
    to view the existing sets. Each set will consist of a series of fee fields. The
    set may be reused any number of times, so you may want the name to be general
    enough for use in multiple events. For example, if your organization holds a monthly
    breakfast seminar series with standard rates for each event, name your price set
    "Monthly Seminar Fees" rather than "March, 2011 Seminar". Be sure to indicate
    that the price set will be used for events.


    > The price set functionality may be used for both events and contribution pages.
    In the context of a contribution page, it allows you to have different levels
    and types of donation options.


    Each fee field will use one of the following display/format types:


    +   - **Text/Numeric quantity**: The registrant is given a text field where they
    enter a quantity value. The unit price is set by you and the total is calculated
    during the registration process. You might use this when selling banquet tickets
    at a conference where registrants may invite their spouse or colleagues to attend.

    +   - **Select**: List of options displayed in a select form field.

    +   - **Radio**: List of options displayed in a list of radio buttons where the
    user may only select one option.

    +   - **Checkbox**: List of options displayed in a list of checkboxes where the
    user may select/unselect any of the available choices.


    For each field, you may choose if the fee amounts are visible and whether the
    field is required. The required field option means the registrant must select
    an option from this one field. It does not impact how this field relates to other
    fields. Radio and checkbox type of fields will have an additional option where
    you indicate how many options should be displayed on a single line.


    You may optionally allow a price set field to impact the total registrant count
    calculated by CiviCRM to ensure that the maximum number of participants for the
    event has not been exceeded. For example, let''s say one of your fee options is
    a checkbox indicating that the registrant will bring his or her spouse. You are
    not charging the full registration fee if a spouse attends, which is why it is
    handled as a fee option for the main registrant. However, your event space has
    a firm capacity limit of 250 people and you need to make sure any spouses attending
    do not cause you to exceed that limit. You enter 250 in the Max Participants field
    (step 1 of the event creation wizard) and enter 1 in the Participant Count field.
    If a registrant selects this option, a count of 2 will be logged against the max
    participant value (one for the registrant, one for the spouse). This functionality
    is also useful if you are selling bulk options, such as the ability to purchase
    a table (seating eight people) at a banquet.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '> Version 3.3 extends the max participant concept to price set field options,
    which can be used for managing session attendance. For example, you might create
    a price set field called "Afternoon Breakout Sessions" with three options. Each
    of these breakout sessions will be in different rooms, with different space capacity.
    You can set a maximum value for each option, and thereby control how many people
    sign up for each session.


    Toward the end of this form is the option to make the field publicly visible or
    admin only. As the option suggests, a publicly visible field will appear on your
    public-facing registration form, while an admin-only field will only appear when
    you are registering people through the backend administrative tools. An admin-only
    field may be useful for structuring discount rates that only administrative staff
    may apply, or for registering speakers and guests for which special rates are
    available.


    > Price set fields may be configured using a negative value which could be used
    to allow discounting options. For example, your organization may offer a $25 discount
    if people agree to arrive an hour early and provide volunteer assistance with
    the event setup.


    The image below displays a price set that contains two fields—radio buttons for
    the registration fee (required) and a $10 discount for FPAGM members:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_374_0.png)


    After configuring all your fields and saving them, you can return to your event
    configuration and select the price set for use in your event. Save the form and
    continue to the next tab to proceed with your event setup.


    # Online Registration


    **Online Registration** is where the power of CiviCRM is realized in the event
    management realm. No longer do you need to rely solely on processing paper-based
    registrations or to migrate data from a third-party event registration system
    into your contact database. Everything happens in real-time, directly integrated
    with your constituent management software. As people register for the event, you
    see current statistics at any given point of time summarizing attendees by status
    and role.'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'The first few fields in this page control various options for how the form
    functions. After entering the text for how the registration form should be labeled
    when accessed from the event''s information page, you specify the time period
    when the form will be available. You may, for example, want to cut off online
    registration a few days prior to the event in order to calculate total registrants,
    finalize numbers with your caterer, and begin preparing attendee packets. Once
    the end date has passed, site visitors who try to access the registration form
    will be redirected back to the event information page with a notice informing
    them that registration is closed.


    The next two fields control multi-registrant capabilities. When **Register multiple
    participants?** is enabled, registrants will have the option of indicating a number
    of people besides themselves that they wish to register. Based on the number indicated,
    they will be given a separate form to complete for each registrant. The confirmation
    page will detail each registrant and the total amount charged will reflect all
    registrants. This is particularly useful for organizations whose constituents
    consist of businesses that may send multiple people to a conference, exhibit show,
    or a political party that allows a certain number of delegates from each region
    to attend a convention. The second of these options makes the e-mail field on
    the additional registrant forms optional (by default, each registrant must have
    a unique e-mail address).


    **Require participant approval?** is used if you want the administrative staff
    to review registrants before they are allowed to complete their registration and
    pay. Enabling this will mark each registrant as pending approval in the participant
    status field and exposes an approval message field where you provide guidance
    to the registrant regarding this function.


    Before using the participant approval functionality you need to enable the **Awaiting
    approval**, **Pending from approval**, and **Rejected** statuses at **Administer
    | CiviEvent | Participant Statuses**, and configure the `ParticipantProcessor.php`
    cron job, as described in the *Waitlisting* section.


    If you are using either the waitlist or approval functionality, you may optionally
    configure a **Pending participant expiration (hours)** duration, as reviewed earlier.
    This value determines how long approved/accepted waitlisted registrants are given
    to complete their registration after CiviCRM sends them an e-mail inviting them
    to register. For more discussion on this functionality, refer to the *Waitlisting*
    section.


    The rest of this form handles the page titles and text that will be displayed
    on each of the three steps of the registration process – the registration form,
    confirmation page, and the thank you page. Note that the registration form section
    has the ability to include a profile on the top and/or the bottom of the registration
    form.'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'A **profile** is a collection of fields, both basic system fields (first name,
    last name, and so on) and custom fields that you have configured in the system.
    A standard event registration form with no profile configured will only include
    the event fees and e-mail address fields. That is the minimum requirement of CiviCRM
    to complete a registration. However, in almost every case, you will want to collect
    additional fields for the registrant, including name, address, phone, fax, and
    perhaps some options specific to the event (meal choice, special needs, session
    attendance, and so on). These will need to be gathered together in one or two
    profiles and included in your form.


    If you have enabled multiple-registrant capability, you have the option of selecting
    a different set of profiles for use with the additional registrants. Let''s say
    you are hosting an exhibit show in which businesses frequently send multiple representatives.
    Your first registrant form should include details about the exhibit display, such
    as display size, special needs (such as electricity), and preferred location.
    However, you only need the name and contact information for all subsequent registrants.
    So you create a profile for the first registrant, which contains the exhibit-related
    details, and another for all additional registrants containing the name and contact
    information.


    Profiles are an important part of the event registration tool. If you are not
    familiar with how they are used, please refer to *Chapter 5, Collecting, Organizing,
    and Importing Data* for a full discussion of how they are configured. Also review
    the Custom data section in that chapter, taking particular note of the different
    ways in which custom fields for event participants can be created. For example,
    you can create custom participant fields that are role-specific, event type-specific,
    event-specific, or available for participants in all events. Keep in mind that
    the creation of a custom field does not itself impact whether it''s visible in
    your registration form; you must also add the desired fields to the profile that
    will be used in your form.


    Another consideration you should review in relation to profiles is how CiviCRM
    interacts with contact records as people register for events. When unauthenticated
    people register for events (that is, they have not logged in to the site but are
    anonymous users at the time they complete the form), CiviCRM will attempt to match
    them to existing contacts in the system using the default strict **Individual**
    rule defined in **Contacts | Find and Merge Duplicate Contacts**. Be sure to review
    that rule to ensure that it is sufficient for your purposes.


    Consequently, make sure that the fields in the default strict **Individual** rule
    are included in your profile or you may find more duplicates created than desired.
    For example, if your rule matches the first name, last name, and e-mail address,
    but you do not assign a profile that includes the first and last name, every registrant
    will be entered as a new contact, as there will be insufficient data to ensure
    a reliable match.'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'Of course, you could require your users to log in to the site in order to register
    for your event. Doing so would ensure that you''re always interacting with the
    right contact record. However, your organization model and website structure may
    not support that option, and requiring that people log in before registering will
    inevitably result in some abandoned registrations.


    The final section in this form controls e-mail-based confirmation and receipting.
    When registrants complete the form, you generally want them to receive an e-mail
    confirming that they are registered, detailing the options they selected, and
    serving as their payment receipt for paid events. In this section, you may add
    an event-specific message that will appear at the top of the e-mail, specify who
    the e-mail is from (name and e-mail), and indicate whether it should be CC/BCCed
    to anyone (such as your event director on staff).


    The event and receipt-related fields are inserted by CiviCRM and may be configured
    through Administer | Configure | Message Templates. Note that several event-related
    templates exist there by default. The one impacting the online registration form
    is titled Events - Registration Confirmation and Receipt (on-line). Depending
    on what options you selected, other templates may be used as well. In general,
    the default templates are basic but sufficient, laying out the fields in a table
    grid format.


    After completing the configuration of this form, click on Save and advance to
    the final tab by clicking on Tell a Friend.


    # Tell a Friend


    The final tab enables a social networking feature, providing tools for registrants
    to tell others about your organization and event. When enabled, registrants will
    be given a button on the event Thank You page, inviting them to share the event
    with others. The button directs them to a form where they may customize a default
    message and enter the names and e-mail addresses of those they wish to invite
    (up to three people).


    You configure the page title, message given to registrants on the Thank You page
    encouraging them to tell others, the suggested (default) message that registrants
    may then customize, and the link provided to recipients. Typically, you will direct
    people to the event information or registration page, but you have the flexibility
    to send them anywhere.


    After registrants complete the Tell a Friend form, they will be directed to a
    Thank You page that you can configure, as desired in the last two fields on this
    form.'
  merge: -1
  img_proc: true
- pgno: 378
  md: 'Click on **Save** or **Save and Done** to complete the event configuration.
    The following screenshot shows the options presented in the **Tell a Friend**
    configuration:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_378_0.png)


    # Testing and promoting


    At this point, your event is configured and ready to go. The next and very important
    step is to test your registration form. This is particularly important when you
    are working with events for the first time and are not fully familiar with the
    various features. Test the information page and registration form; make sure you
    are comfortable with how the fees and fields are structured, and how messages
    are displayed in each step of the process. Be sure to walk through a complete
    registration so that you can receive and review the receipt e-mail. If you have
    both credit card and pay later options enabled, exercise both workflows to ensure
    that you have crafted your text appropriately for all pages and e-mails.


    To access event-related links for testing and promotion, use the **Event Links**
    button from within the event configuration form or the pop-up link in the **Event
    Management** listing. There are three link options you will review:


    +   - **Event Info:** Displays the live information page about the event.

    +   - **Registration (test-drive):** Displays the registration form in test drive
    mode. Test drive mode will not actually process a credit card and the registration
    will be flagged as a test record for exclusion in your registrant counts.


    > While searching for test registrations at **Events | Find Participants**, you
    might be confused if your test transactions don''t show up. Make sure you check
    **Find Test Participants?** to explicitly include test registrations in the result
    list.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '+   - **Registration (live)**: Displays the live registration form:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_379_0.png)


    > Although CiviCRM does provide a test-drive option, we recommend testing with
    the live registration link until you are comfortable with the configuration options.
    You may want to temporarily add a small-value registration fee option for live
    testing with a credit card in order to avoid the cost of issuing a refund.


    The live links above (**Event Info** and **Registration (live)**) can be used
    in your website content, e-mails, and other promotional methods. Joomla! users
    may also construct links to these pages through the creation of a CiviCRM menu
    item.


    In addition to direct links to your event pages, you may want to provide access
    to lists of upcoming events. There are several ways to do that using native CiviCRM
    methods. From the **Manage Events** page, you will find four icons in the top-right
    region of the **Find Events** block:


    +   - HTML listing of events

    +   - RSS feed of events

    +   - iCalendar file download of events

    +   - iCalendar feed of events


    Each link publishes a list of current and future events that are designated as
    public. Recall that in the first page of the event setup process, we had the option
    of setting an event as public; the primary use of that function is to control
    what appears in these listing pages.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_379_1.png)


    CiviCRM provides Drupal with a block to display events. You can enable it within
    a Drupal theme at **Site Building | Blocks | List | ThemeName** by specifying
    a region for the **CiviCRM Upcoming Events** block and clicking **Save blocks**.
    Additional configuration options for **Link name to display** and **Max number
    of events to display** are available by downloading and enabling the CiviCRM Event
    Block module from http://drupal.org/project/civicrm_eventblock.'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'Advanced Drupal users interested in more control over the formatting and display
    of CiviCRM Event information within Drupal should use Views. Views provides extensive
    customization of how you display event information on pages, blocks, and feeds.
    In Drupal, click on Site building | Views | Add, provide a View name, select CiviCRM
    Events as the View type, and click Next. You can see the CiviCRM Events fields
    available for display by clicking on the "plus" sign beside Fields, and then selecting
    CiviCRM Events in the Groups selector. For more information on using views, refer
    to Advanced Help on your site, or use a good Drupal book on the topic.


    An events listing module is also available for Joomla! at the CiviCRM website
    and Joomla! Extension Directory at http://wiki.civicrm.org/confluence/display/CRMDOC/CiviEvent+Joomla+Module.
    The module has numerous options for controlling what is displayed in the list
    of events, including whether it links to the information page or registration
    page, whether a Register now link is included, the event summary, and how you
    want the list filtered (event type, date range, all current/future, specific events,
    and so on). For Joomla! users, this presents many useful options for promoting
    your events.


    Now that you''ve constructed your event and tested it, get out there and tell
    people about it!


    # Breakfast seminar example


    One of FPAGM''s goals for the year is to provide more training resources for food
    pantries in the region. Many of these pantries are volunteer-run and managed by
    churches, community organizations, and other small local groups who are seeking
    to support their neighborhood. To achieve this goal, they have constructed a series
    of breakfast workshops where volunteers and pantry workers can come together and
    discuss a predefined topic. FPAGM will invite speakers to facilitate the discussion
    around topics such as financial management, volunteer solicitation and coordination,
    food storage and distribution, and support resources for clients.


    Each breakfast seminar will charge a nominal fee to cover the cost of the food
    provided. FPAGM would like all registrations to go through the website (no mail
    or phone-based registrations), though they will enable the "pay later" option
    for people who wish to pay by cash on-site.


    Since they anticipate hosting other types of events, they begin by creating a
    "Breakfast Seminar" event type to categorize these monthly meetings. They also
    construct an event template, as each of these meetings will be nearly identical.
    Since the fee structure is very basic and the template will replicate from one
    event to the next, they choose not to construct a price set. They will offer two
    basic fee options: standard and supporter. The standard fee will cover the cost
    of the breakfast and incidentals associated with hosting the event, while supporter
    will add an additional amount as a way of encouraging people to go beyond the
    basic cost and help support the association.'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'Space is limited, as the meetings will take place in the association''s conference
    room that holds about 30 people. FPAGM sets a max participants value and enables
    the waitlisting features. They also include a profile to capture basic details
    such as the individual''s name, organization name, and phone number. They choose
    not to enable the multi-participant option, as they prefer each person signing
    up on their own. Once complete, they promote the events through blog-style announcements
    and provide direct links to the registration form.


    # Processing and managing participants


    You''ve configured your event, tested it, and publicly promoted the online information
    page and registration form. Before you know it, event registrations start rolling
    in. Now what?


    As with so many other areas of CiviCRM, these records may be viewed collectively
    through search tools or on an individual-contact basis. In this section, we''ll
    walk through the event registration as it is viewed through the contact''s record
    and then briefly review importing participant records.


    # Working with event registrations


    A contact''s history of event attendance will appear in their **Events** tab.
    From this tab, you can view, edit, or delete an existing registration, or create
    a new registration for the contact.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_381_0.png)'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# Managing Events


    Notice that there are two buttons above the event history listing, namely, **Add
    Event Registration** and **Submit Credit Card Event Registration**. The first
    is used for registrations that do not involve real time credit card processing
    through the system. This may include free events, payments by check, cash, EFT,
    or a credit card that was processed outside of the system. The second button should
    be used if you will be processing a credit card directly through CiviCRM. If you
    have not configured a payment processor, or your payment processor does not handle
    integrated payments (for example, PayPal Standard or Google Checkout, which redirect
    you to an external site to process the payment), then that button will not be
    visible.


    The new registration form allows you to select the event you wish to register
    the individual for, the fees and fields specific to the event, payment options,
    and receipting options. The following screenshot shows the top half of the form:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_382_0.png)


    There are several things to note about this form:


    +   - The event drop-down list will only show current and future events. If you
    wish to register someone for an event in the past, you must click the **Include
    past event(s) in this select list** link, which will reload the form with the
    full list of events. This is done to reduce any confusion and simplify the event
    selection process.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '+   - If you have created any custom data fields attached to participants,
    they will appear and be available only when the selections match their "used for"
    criteria. For example, if you have created custom fields for the participant role
    **Guest**, they will only appear when you change the role on this form. If you
    have custom fields attached to the event type **Conference**, they will only appear
    if the event selected is associated with that event type. If you are expecting,
    but not seeing a certain custom field, make sure your selections match how that
    field is configured to be used.


    Directly below the event fee block is an option to record a payment with this
    registration. Checking the box reveals a series of contribution-related fields,
    as shown in the following screenshot:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_383_0.png)


    It is important to understand that an event registration in which fees are collected
    involves both an event participant record and an associated contribution record.
    While you could process these separately, we strongly advise that you manage them
    through this single interface. In addition to being easier than entering them
    separately (since you may handle both records at once), doing so creates a link
    between the two records. If you return at a later date to view this event registration,
    you will see the related contribution record summarized below it. Likewise, if
    you enter the associated contribution record, you will see the event record summarized
    below it. Revenue totals for the event in reports will also reflect the linked
    records. Entering them separately will not build that connection.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# Handling expected payments


    Inevitably, you will receive event registrations by mail, fax, or phone, in which
    payment has not been submitted with the event registration. Though you have not
    actually received the payment, there is an *expected* payment and consequently,
    the best practice is to enter the payment as a **pending** contribution. Use the
    **Record Payment** option to log the contribution, but do not complete the **Paid
    By** field, and change the **Payment Status** field to **Pending**.


    Why is this recommended? For two reasons: first, it captures the reality of the
    data better. You have received a registration that implies a commitment to pay.
    This is different from a registration for a guest, speaker, or other VIP attendee
    for whom you do not plan to charge a fee. Secondly, it provides better tools for
    tracking payments due. If each registrant in the above scenario has a pending
    contribution payment, you can easily run a search to find out the total due and
    process invoices or follow-up communication accordingly. In essence, it gives
    you a better overview of your actual financial position, and a clear data path
    to those who owe you payment.


    Registrations received through your public-facing event registration page will
    also have both an event and contribution record created. Pay later registrations
    will have contribution records with a status of **Pending**, indicating that a
    payment has not yet been received. When you receive payment, first record the
    details in the contribution record and change the status to **Completed**. Doing
    so will automatically change the status of the associated event registration record
    to reflect that the payment has been received. Note that the reverse action does
    not have the same effect: changing the status of a *registration* to completed
    does not likewise change the status of its associated *contribution* record. This
    supports situations where you want to allow people to attend the event (marked
    completed) even though they will pay after the event (marked pending).


    Before leaving the event record displayed within the contact record, we want to
    point out one additional feature. From the event tab, click on **View** to see
    the registration details. From this screen, you''ll notice a button to create
    a name badge. Clicking on this option will direct you to a form where you select
    the template to be used and trigger the creation of a PDF file with the name badge.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_385_0.png)


    In the following Tracking, searching, and reporting section, we will review how
    to create name badges for all event participants in bulk. For now, it''s useful
    to see how an individual name badge can be created.


    # Importing participant records


    As with other areas of CiviCRM, the event functions include a tool for importing
    event registrations. This is particularly useful when you are initially migrating
    data from an external database such as MS Access or MS SQL Server. It may come
    in handy at times depending on your organization structure and how CiviCRM is
    being used.


    Let''s say your organization consists of five chapters geographically oriented
    to cover the entire state. Each chapter hosts local events and handles all onsite
    management through volunteers. The registration process is centralized through
    the state-wide organization using CiviCRM, so the contact participant list is
    generated and e-mailed to the chapter coordinator the day before the event.


    Suppose some of these events allow walk-in registrations and others include continuing
    education credits that must have verified attendance in order to be earned. In
    other words, the organization must not only track if people have registered, but
    must also track whether they actually attended.


    You choose to handle this by sending a .csv (comma-separated) export file the
    evening before the event to the chapter coordinator. The coordinator welcomes
    people as they arrive at the event and uses spreadsheet software to mark each
    person who attends in the .csv file. They add new rows for walk-ins. That file
    is sent back to the main office at the conclusion of the event and is imported
    into CiviCRM in two steps: existing registrants are imported using the Update
    option, where the participant status value reflects who attended; and the new
    registrants are imported using the Insert option, and then are matched with existing
    records using their name and e-mail.'
  merge: -1
  img_proc: true
- pgno: 386
  md: "# Managing Events\n\nThe import tool is very similar to what we saw in other\
    \ areas. The four-step wizard consists of loading a file and configuring the import\
    \ settings, mapping the file's fields to CiviCRM fields, previewing the results,\
    \ and completing the import. An error file will be generated and will be available\
    \ for download if any problems are discovered with any records.\n\nTo access the\
    \ import tool, visit **Events | Import Participants**. There are a few things\
    \ to note that are specific to importing events:\n\n+   - Participant import only\
    \ accepts `.csv` files. You cannot connect to a MySQL database as with the contact\
    \ import.\n+   \n+   - The most significant difference between importing participants\
    \ and importing contacts is the behavior of the **Update** option for handling\
    \ duplicates. The Update option *requires* the presence of an existing participant\
    \ record, which *must* be identified using the unique participant ID value. Consequently,\
    \ you will only use it in scenarios similar to the one we just discussed, where\
    \ the participant list is exported from the system, changes are made, and it is\
    \ then imported back into the system. If the **Update** option is used, CiviCRM\
    \ will not process new registration records. In this way, it differs from the\
    \ contact import that matches and updates existing records *and* creates new records\
    \ for those that do not match.\n+   \n+   - As one might expect, the field mapping\
    \ options available for the participant import include a number of registration-related\
    \ fields. Take note of those in red, as they are required in order to successfully\
    \ import these records. They include the Event ID and Participant Status. The\
    \ former can be obtained from the **Manage Events** page. Several of the fields\
    \ highlighted in red are used for matching to the contact record. Not all of these\
    \ are required; only ones sufficient for making a valid match are required. For\
    \ example, you do not need the internal contact ID and the first/last name. Either\
    \ of these is sufficient for making a match.\n\n# Tracking, searching, and reporting\n\
    \nIn the last section, we worked with an individual contact record to see how\
    \ the registration is created with an associated contribution record. In this\
    \ section, we will begin working with multiple participant records.\n\n# Tracking\
    \ registrations using the dashboard\n\nOne of the most important things for you\
    \ as an event manager is the ability to quickly see how many people have registered\
    \ for a given event. CiviCRM provides you with a snapshot to these details on\
    \ the **Events | Dashboard** page."
  merge: -1
  img_proc: true
- pgno: 387
  md: 'Similar to other areas of CiviCRM, the **Dashboard** provides a snapshot into
    key data in a summarized fashion. For events, this consists of a listing of upcoming
    events with registrant counts broken down into various categories, and a list
    of recent registrations received.


    The registrant counts are very useful and bear some explanation. Review the following
    screenshot:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_387_0.png)


    CiviCRM helps you *understand* your participant records by breaking them down
    into categories. We begin with the number of **Counted** registrants, in contrast
    to those **Not Counted**. Counted participants include those who have registered,
    including both those who have paid and those who will pay later. **Not Counted**
    is broken up by status and role. By default, registrants with a status of **no-show**,
    **cancelled**, **pending from incomplete transaction**, **on waitlist**, **rejected**,
    and **expired**, will all be excluded from the registrant count. Why? This is
    because they are not expected to attend or are confirmed to not have attended.
    In a similar way, participant roles may be configured to be included or excluded
    from the total counts. In the example we saw earlier, we had created a participant
    role entitled "Staff" which should not be included in the count.


    Settings for the participant statuses and roles can be configured through **Administer
    | CiviEvent**, and were discussed earlier in this chapter. What we see in this
    section is the impact of those settings and how they are used to help you understand
    the nature of your participants.


    The **Registered**, **Pending from Pay Later**, and **Cancelled** counts you see
    in the screenshot reflect the various participant statuses represented by the
    records. If other statuses were present, they would be listed as well.


    Note that each of these counts is a live hyperlink; selecting the link displays
    the relevant registrants in that count. This is, by far, the fastest way to view
    and work with a segment of your participant records.'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# Managing Events


    # Searching for participants


    While the dashboard provides a quick window into a single event, you will undoubtedly
    want to search for records based on more refined criteria or across multiple events.
    We do this through **Events | Find Participants**, as shown in the following screenshot:


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_388_0.png)


    The fields available through this tool are fairly self-explanatory. You have options
    to search within a single event, across multiple events within an event type category,
    by date ranges, or fee ranges. The search fields are restrictive; all criteria
    must be matched in order to return results. Entering a large number of criteria
    will result in a smaller number of records returned. The two exceptions are the
    multi-select fields, **Participant Status**, and **Participant Role**. Multiple
    selections within that field are inclusive, though its interaction with other
    fields remains restrictive.


    Similar to CiviCRM''s other search tools, you may take action on bulk records
    after running a search. First select all records or choose selected records and
    then initiate your action from the drop-down menu.


    ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_388_1.png)'
  merge: -1
  img_proc: true
