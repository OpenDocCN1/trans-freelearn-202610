- pgno: 66
  md: '# Total cost of ownership


    We just mentioned in the previous section the need to calculate the total cost
    of ownership in order to provide a sense of the expected return on investment
    in a CRM initiative. The initial cost of acquiring and deploying software systems
    is usually a fraction of their total cost of ownership. This is especially true
    for enterprise systems like CRMs that tend to have longer effective lives.


    Although CiviCRM, Drupal, and Joomla! are free open source software projects,
    they do have costs associated with them. In addition to training for users, administrators,
    and any in-house developers you may have, there is a need for on-going maintenance
    and support of your software and data.


    Security upgrades or patches need to be applied regularly to your CMS software.
    CiviCRM includes security fixes in its general releases. We recommend upgrading
    at least a few times a year as new versions are released (for example, 3.2), but
    not necessarily for each point release (for example, 3.2.2). One advantage of
    this is the ability to take advantage of new features as they are released. If
    you have customized or overridden CiviCRM functionality, you should expect there
    to be some costs associated with modifying the custom templates and software on
    your site during upgrades.


    A major reason why software costs are ongoing for organizations is that organizations
    are not static. What your organization does and how it does it, will change, both
    as you implement your CRM initiative and after it is put to bed. The interlinked
    nature of work processes and software systems means that you will need to continue
    to adapt, reconfigure, and re-customize CiviCRM for as long as your organization
    uses it.


    A second area where organizations need to plan for ongoing resources for a CRM
    system is keeping their data clean. Depending on the nature of your constituents
    and the ways you collect data directly from those constituents, you may find issues
    with incomplete, incorrect, and duplicated constituent information. Automated
    merging and elimination of duplicates can lead to problematic results. Manual
    work reviewing potential duplicate records is time consuming, but essential.


    A properly conceived CRM initiative will yield benefits that more than cover the
    total cost of the system in terms of improved relations with constituents and
    cost efficiencies realized from labor-saving automation.'
  merge: -1
  img_proc: true
