  和 beta 测试期间。社区成员被鼓励下载、安装和测试预生产版本，以便在新版本发布前提供有关功能、可用性、升级便捷性以及缺陷的反馈。这一举措非常成功，并导致提交的补丁数量激增，如下图所示，使该版本变得更好、缺陷更少。2010
  年期间，他们一直努力让顾问和资源更充足的用户贡献补丁，以便核心团队专注于新版本的增强功能。


