  \ 10 到 15 个指标，用于衡量该计划在帮助实现组织目标方面的效果。\n\n作为此过程的一部分，应检查组织结构并考虑可能的组织重组计划和流程。每个利益相关者群体的参与策略将被转化为通讯、会员、活动、筹款、志愿者组织、资助管理和案例管理的业务流程。在流程实现自动化的地方，用例将确保在优化用户体验的同时保持组织战略目标的关注。\n\
  \n项目的人性化方面应确保在您组织文化的基础上，有效地与员工和志愿者进行沟通。应使用参与和参与机制来应对不可避免的恐惧、不确定性和怀疑，并协助解决初始和持续的动机问题。在工作职责发生变化且人们需要开始使用\
  \ CiviCRM 等新系统时，应计划适当的初始培训和持续强化培训。您长期的目标应是鼓励一致地使用系统的最基本区域，并随着更高级和特定场景的需求而逐步增长。\n\
  \n项目的技术方面将包括或多或少正式的计划，涵盖：\n\n- 安装\n- 配置\n- 定制\n- 数据迁移\n- 图形设计\n- 主题\n- 测试\n- 部署\n\
  - 新系统验证\n\n部署计划可能涉及新功能的分阶段推出或对新工作方式的大爆炸式引入。特别是在财务系统的情况下，应考虑在报告期或两个报告期内同时运行旧系统和新系统，以确保新系统正常运行，并确定旧报告和新报告在所呈现数据方面的差异。\n\
  \n## 总结\n\n本章概述了如何创建成功的 CiviCRM 实施项目。\n\n它列出了 CRM 计划成功的常见障碍，这些障碍源于组织中的人员问题或技术问题，导致支持不同业务功能的系统和工具无法提供集成功能。\n\
  \n我们提倡对组织实施 CRM 战略采取务实的方法。我们鼓励采用适合您组织的变化方法以及相关的流程和方法论：不同组织中结构、正式程度和规划的广泛范围都有效。您的实施计划应包括时间表和现实的预算，包括持续成本。\n\
  \n为团队选择合适的人对项目的成功至关重要。理想情况下，您将包括一名高管或董事会赞助人、一名或多名关键职能经理、一名或多名关键员工用户以及团队所需的适当技术专业知识，所有人员都具有良好的个人效能和相处能力。\n\
  \n通过将您的利益相关者细分为群体，列出每个群体与您组织的重要互动，并确定衡量这些互动的可操作指标来开始您的规划。创建涉及这些互动的现有系统的清单及其数据。制定组织的共同\
  \ CRM 愿景，然后阐明它将如何转化为高价值利益相关者潜在客户漏斗各层级用户体验。\n\n对于需求，在广泛和紧密的关注之间迭代。使用现有系统和纸质表格从高管、管理和员工的角度在访谈中征求反馈。用户调查也提供了良好的定量结果。\n\
  \n在每个职能领域，列出已知的痛点、重要的新功能、需要消除的冗余或累赘，以及可能的快速胜利。反复出现且重要的功能需求包括自定义字段、组织特定的邮件列表和访问控制组、不同流程中表单所需的字段、用户权限以及自定义活动和工作流。花时间集思广益，如何在内部流程中提高效率并以新的方式实现您的使命。\n\
  \n在下一章中，我们将开始深入研究 CiviCRM 的安装和维护方面的技术问题。\n\n\n\n\n"
- "# 3 安装、配置与维护\n\n现在，你应该已经很好地理解了CiviCRM和支持者关系管理工具能为你所在组织做些什么。你也应该花时间规划你的实施工作，包括思考现有数据源以及如何将它们映射到CiviCRM中。不要低估规划过程的重要性——尽管你可能急于安装CiviCRM并开始使用它，但如果你在前期规划上投入更多时间，你的项目将更有可能成功。\n\
  \n在本章中，我们将：\n\n- 安装CiviCRM\n- 逐步完成系统的初步配置\n- 讨论你需要了解的进阶配置选项，包括Drupal下的访问控制权限\n-\
  \ 回顾升级过程\n- 概述推荐的维护流程\n- 规划备份策略\n\n由于CiviCRM可以在Joomla!或Drupal内容管理系统（CMS）中实施，本章某些内容将针对每种环境而有所不同。我们已尽量明确指出哪些指导是特定于环境的。在阅读本章时，请务必注意与你实施相关的上下文。\n\
  \n本章的某些部分可能更具技术性，因为我们提供了基本的故障排除步骤并讨论了托管环境注意事项；不要被技术讨论吓倒。对于大多数实施来说，安装和配置过程是快速且轻松的。同样值得注意的是，CiviCRM的安装、配置和升级是使用CiviCRM过程中最技术性的部分。如果需要，你可以将部分或全部工作外包给专业服务，例如列在\
  \ http://civicrm.org/professional 和 http://civicrm.org/moreprofessionals 上的服务。\n\
  \n### 安装CiviCRM\n\n> 以下说明假设你已经有了可正常运行的Joomla!或Drupal安装。如果你尚未设置好CMS环境，应在继续本节之前完成设置。\n\
  \n首先访问CiviCRM网站 http://civicrm.org/download ，或直接访问 http://sourceforge.net/projects/civicrm/files/\
  \ 选择要安装的CiviCRM版本。我们建议始终在生产站点使用稳定版本。对于Joomla!安装以及Drupal的浏览器/FTP安装方法，你需要将安装包下载到本地机器，然后上传到服务器。针对Drupal讨论的高级命令行安装方法允许你直接下载包到服务器，从而跳过此步骤。\n\
  \n在实施新的CiviCRM安装时，请务必始终访问下载站点，因为该项目会定期发布小版本修订，你需要确保使用最新（且无缺陷）的代码库。\n\n根据你的环境，CiviCRM有三种可用的安装包：\n\
  \n- Drupal\n- Joomla!\n- Joomla!-alt\n\nCiviCRM 2.0-3.1版本提供了独立的CiviCRM版本，可以在CMS之外运行，或可能集成到其他CMS中。独立版本的支持在v3.2中被移除。如果你使用的不是Joomla!/Drupal内容管理系统，或有其他原因需要研究独立实施，请考虑联系核心开发团队以确定独立支持的最新状态。许多不使用Joomla!/Drupal环境的实施者发现，创建一个用于托管CiviCRM的Joomla!/Drupal“外壳”站点，然后将各种前端页面和表单集成到他们的主网站中更容易。\n\
  \nJoomla!-alt包与标准Joomla!包的不同之处在于它不包含嵌入式压缩文件。如果你检查标准Joomla!安装包，会发现它包含一系列安装文件和一个大的.zip包。相比之下，解压-alt版本会显示所有应用程序文件（即主包内没有子包）。\n\
  \n那么你应该使用哪一个？标准包之所以如此构建，是为了改善Joomla!扩展安装器中的处理；一般来说，你会希望使用那个包。如果安装遇到任何困难，请尝试使用替代包。具体来说，如果你收到一条错误消息，提示PHP缺少.zip功能，则需要使用-alt版本。\n\
  \n除了上面列出的三个版本外，你还会看到语言包文件（-l10n）和可用于验证包完整性的MD5哈希文件（MD5SUMS）。\n\nCiviCRM具有强大的多语言支持。语言包包含当前CiviCRM版本支持的所有语言的翻译文件。\n\
  \n请注意，其中一些翻译并不完整，在投入真实环境之前应彻底审查和测试。通常，面向公众用户页面中的字符串会首先被翻译，管理字符串和较少使用功能的翻译则相对滞后。\n\
  \n在某些情况下，你可能会发现可以合并不同地区的现有语言资源文件以扩展其覆盖范围。例如，加拿大法语和法国法语的独立翻译工作被合并到一个新的加拿大法语文件中，当两个语言文件中都有可用翻译时，该文件使用加拿大术语。这使得“State/Province”被渲染为“Province”而不是“Département”。\n\
  \n有关CiviCRM翻译和本地化工作的更多详情，请访问：\n\n- 本地化指南：http://wiki.civicrm.org/confluence/display/CRMDOC/CiviCRM+Localisation\n\
  - 在线翻译工具（Transifex）：http://translations.civicrm.org\n- 本地化论坛：http://forum.civicrm.org/index.php/board,10.0.html\n\
  \n在撰写本书时，CiviCRM提供以下语言的翻译（可能仅为部分翻译）：\n\n南非荷兰语、阿尔巴尼亚语、保加利亚语、加泰罗尼亚语、中文（中国-简体）、中文（台湾-繁体）、捷克语、丹麦语、荷兰语、英语（澳大利亚）、英语（英国）、爱沙尼亚语、芬兰语、法语、法语（加拿大）、德语、希腊语、希伯来语、印地语、匈牙利语、印尼语、意大利语、日语、高棉语、挪威语、波兰语、葡萄牙语、葡萄牙语（巴西）、罗马尼亚语、俄语、斯洛伐克语、斯洛文尼亚语、卡斯蒂利亚西班牙语、墨西哥西班牙语、瑞典语、泰卢固语、泰语、土耳其语和越南语。\n\
  \n还有针对阿拉伯语、波斯尼亚语、加泰罗尼亚语、英语（加拿大）、挪威博克马尔语、波斯语、泰米尔语和乌克兰语的额外翻译团队。这通常意味着该语言在早期版本中已有翻译，这可能为新翻译提供一些有用的材料。如果你对多语言支持感兴趣，请考虑使用前述工具参与翻译。\n\
  \n> 在继续安装之前，请确保你的托管环境满足前一章列出的最低要求。尽管你可能在不满足这些基本技术要求的环境中成功安装CiviCRM，但如果这些要求未得到满足，你可能会发现某些功能无法正常工作。\n\
  \n### 在Joomla!中安装\n\nCiviCRM是使用Joomla!的扩展工具**安装/卸载**安装的，该工具可从Joomla!网站管理界面的**扩展**菜单中获取。然而，与大多数Joomla!扩展不同，你将无法使用**上传包文件**选项安装该软件。这是为什么呢？这仅仅是因为CiviCRM是一款非常庞大的软件——大小是Joomla!本身的两倍多，而且大多数托管环境并未配置为在单个进程中容纳上传包并运行安装脚本所需的资源（如**浏览并安装**选项那样）。因此，我们必须使用Joomla!可用的替代工具。\n\
  \n\n\n\n\n请仔细遵循安装说明，因为它们与许多其他 Joomla! 扩展的安装流程不同。\n\n按以下步骤在 Joomla! 中安装 CiviCRM：\n\
  \n- 1. 使用 FTP 软件将安装包上传到您的网站。我们建议您将包上传到 /YOUR_JOOMLA_ROOT/tmp/。该文件夹由 Joomla! 创建，是存放安装包最合适的位置。\n\
  - 2. 解压安装包。您可以使用命令行或托管在服务器上的基于 Web 的文件浏览器（如 cPanel 文件管理器）来完成此操作。Joomla! 中有各种扩展可让您在\
  \ Joomla! 内操作文件系统，这也可能有所帮助。如果您在网上解压安装包时遇到困难，您可能需要在本地计算机上解压它，然后使用 FTP 软件将解压后的文件集上传到\
  \ /YOUR_JOOMLA_ROOT/tmp/ 目录。上传并解压后，您应该在 /YOUR_JOOMLA_ROOT/tmp/ 目录内看到一个 /com_civicrm/\
  \ 文件夹。\n- 3. 在 Joomla! 管理界面中浏览至 Extensions | Install/Uninstall。使用 Install from Directory\
  \ 选项，输入解压后的 /com_civicrm/ 目录的完整文件位置。在大多数情况下，Joomla! 会预先填充该字段为 /YOUR_JOOMLA_ROOT/tmp/\
  \ 目录的正确位置，您只需添加 com_civicrm 即可。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_91_0.png)\n\
  \n- 4. 单击 **Install** 后，您应被引导至确认安装成功的页面。单击提供的链接进入 CiviCRM 并确认其已安装并正常工作。\n\n如果您在安装\
  \ CiviCRM 时遇到问题，请查阅 *Installation troubleshooting* 部分，以对可能的服务器和环境相关问题进行总体回顾。对于 Joomla!\
  \ 安装，最常见的问题源于对我们刚刚描述的 **Install from Directory** 方法不熟悉。大多数 Joomla! 用户习惯于更常见的 **Browse\
  \ and Install** 方法来安装扩展。\n\n需要记住的两个关键事项如下：\n\n- CiviCRM 安装包必须在服务器上解压。您应引用文件夹位置——而不是从\
  \ www.civicrm.org 下载的 `.zip` 文件。\n- 文件夹位置必须是完整的系统路径——而不是相对于您 Web 目录的路径。例如，它可能看起来像\
  \ `/home/user/public_html/tmp/com_civicrm/`。如果您收到以下错误消息：**Please enter a package\
  \ directory**，则是因为您未引用解压后安装文件的正确路径。\n\n如果您在安装过程中仍继续遇到问题，请访问专门用于 Joomla! 安装的 CiviCRM\
  \ 论坛：`http://forum.civicrm.org/index.php/board,7.0.html`。\n\n## Installation in\
  \ Drupal\n\nCiviCRM 使用自动安装程序来配置软件以在 Drupal 中使用。以下说明涉及在现有 Drupal 安装中设置 CiviCRM 实现的过程。\n\
  \nDrupal 支持使用单个代码库来运行多个网站（请参阅 `http://drupal.org/getting-started/6/install/multi-site`）。站点特定数据存储在\
  \ `/path_to_docroot/sites/` 下的站点特定目录中，每个站点的域名通常用作其子目录的名称。此站点特定信息包括数据库名称，每个站点唯一，以及存储在\
  \ `/path_to_docroot/sites/yoursite.org/settings.php` 文件中的其他连接信息。CiviCRM 在安装过程中对这种多站点共享代码库和独立数据库的方法提供透明支持。在开始安装过程之前，请确保为每个站点创建单独的\
  \ CiviCRM 数据库。\n\n尽管这种多站点方法仍然非常流行，但也有一些相反的趋势倾向于单站点安装。在尝试同时升级共享代码库的多个站点时，会出现依赖、复杂性和时序问题。更重要的是，Drush\
  \ (http://drupal.org/project/drush) 和 Aegir (http://groups.drupal.org/hostmaster2)\
  \ 已使使用多个相同代码文件副本管理多个单站点安装的单个代码库变得越来越容易。\n\n以下各节中的 CiviCRM 安装程序适用于您的 Drupal 站点是单站点还是我们刚刚描述的多站点配置。如果您想使用高级技术在不同的\
  \ Drupal 站点之间共享数据库表以提供单点登录功能（访问 http://thedrupalblog.com/setting-multi-site-drupal-6-installation-shared-databases-and-single-sign）或在多个\
  \ CiviCRM 站点之间共享数据库以在站点之间共享联系人和/或管理员（访问 http://wiki.civicrm.org/confluence/display/CRMDOC/Multi+Site+Installation），则需要不同的程序。\n\
  \n根据您的技能和舒适程度，您可以选择以下两种方式之一安装 CiviCRM。第一种使用浏览器和 FTP 客户端应用程序。第二种使用 SSH，即安全命令行 shell，对于具备基本\
  \ Linux 技能的人来说可能更快、更方便。\n\n### Browser/FTP procedure\n\n在开始安装过程之前，请注意您 Drupal 安装的数据库设置。如果您不知道这些值，可以在\
  \ /path_to_docroot/sites/default/settings.php（默认位置）找到它们。\n\n找到 $db_url 变量：\n\n```\n\
  $db_url = 'mysqli://dbuser:dbpassword@localhost/drupal_dbname';\n```\n\n这里：\n\n\
  - Database server: localhost\n- Drupal database name: drupal_dbname\n- Database\
  \ user name: dbuser\n- Database user password: dbpassword\n\n较旧的站点可能仍在使用 mysql 驱动程序，而不是\
  \ mysqli：\n\n```\n$db_url = 'mysql://dbuser:dbpassword@localhost/drupal';\n```\n\
  \n如果您的站点包含此项，您应 definitely 考虑升级到 mysqli。mysqli 最初引入是为了支持 MySQL 4.1 功能，现在在 PHP 5.x\
  \ 中非常稳定且得到良好支持，并且相对于 mysql 驱动程序提供了性能改进。只需将 $db_url 中的驱动程序规范从 mysql 更改为 mysqli，Drupal\
  \ 即可获得这些好处。\n\n您现在可以开始安装过程。按照以下步骤操作：\n\n- 1. 如果您尚未这样做，请从 http://sourceforge.net/projects/civicrm/files/（使用\
  \ Download Now! 按钮是确保您获得正确 tarball 的最佳方式）下载最新稳定版的 Drupal CiviCRM 安装 tarball 到您的本地机器。\n\
  - 2. 将 CiviCRM 安装包从本地机器上传到 Drupal 安装中的 /path_to_docroot/sites/all/modules/ 目录。将\
  \ CiviCRM 和其他模块安装在此目录下将使文件与核心 Drupal 模块分离，并促进任何未来的 Drupal 核心升级。（如果您不希望 CiviCRM 可用于运行此代码库的其他站点，您可以在站点目录下创建\
  \ modules 子目录，例如 /path_to_docroot/sites/default 或 /path_to_docroot/sites/yourdomain.org，并在那里安装它。）如果需要，调整\
  \ /path_to_docroot/sites/ 目录的权限，以为运行 Web 服务器进程的帐户提供写入权限（完成后将其恢复为原始权限）。这通常可以使用您的\
  \ FTP 或 SFTP 客户端应用程序完成，也可以使用以下命令：\n\n  ```\n  $ cd /path_to_docroot/sites/ ; chmod\
  \ -R 666 ./*\n  ```\n\n- 3. 解压安装包。您现在应该在站点中拥有以下目录：/path_to_docroot/sites/all/modules/civicrm/，其中包含其他子目录。\n\
  - 4. 使用适当的工具（如 phpMyAdmin 或您的托管面板）为 CiviCRM 创建单独的 MySQL 数据库。如果您在下一步中输入一个在数据库服务器上尚不存在的数据库名称，并且您输入的数据库用户具有创建数据库的权限，安装程序将自动为\
  \ CiviCRM 创建新数据库。我们不建议授予不需要该权限的数据库帐户（如用于 Drupal 站点的帐户）创建数据库的权限。\n\n\n\n\n\n> 通常认为，出于备份和升级的目的，最好将\
  \ Drupal 和 CiviCRM 放在不同的数据库中。可以考虑使用以域名作为数据库用户名的命名约定，并在其后附加 `dru` 和 `civ`，以分别表示 Drupal\
  \ 和 CiviCRM 数据库。对于同一域名的暂存站点，你可以将数据库命名为 `domainname_staging_dru` 和 `domainname_staging_civ`。这样做的好处是，在创建数据库用户时，可以一次性轻松地为所有这些数据库设置权限。\n\
  >\n> 请注意，如果你打算使用 Drupal Views 模块在 Drupal 页面中显示 CiviCRM 数据，并且打算为 Drupal 和 CiviCRM\
  \ 使用不同的数据库用户，则需要确保你的 Drupal 数据库用户对 CiviCRM 数据库具有 SELECT 权限。按照上述说明，为 Drupal 和 CiviCRM\
  \ 使用同一个数据库用户即可满足这一要求。\n\n5. 下一步是运行安装程序，它将确认你已下载正确版本的 CiviCRM，并确保你的服务器满足软件要求。安装程序会在你的数据库中创建必要的表，并使用所需的变量配置\
  \ `civicrm.settings.php` 文件。要运行安装程序，请以具有管理员权限的用户身份登录 Drupal，并将浏览器指向以下 URL：`http://yourdomain.org/sites/all/modules/civicrm/install/index.php`。\n\
  \n6. 这将打开 CiviCRM 安装工具。使用你之前记下的 Drupal 数据库详细信息以及你为 CiviCRM 数据库创建的信息填写表单，然后点击重新检查配置和要求。如果有任何系统设置不满足要求，你会收到通知，并有机会解决这些问题。返回此页面并重新检查，直到所有问题都得到解决。你还可以选择安装示例数据（这有助于快速了解系统）以及选择备选语言（如果你已获取翻译文件并将其上传到\
  \ CiviCRM 目录）。\n\n7. 单击**检查要求并安装 CiviCRM**按钮以继续安装。如果安装脚本成功完成，你将看到绿色进度条和成功通知。在安装过程中，CiviCRM\
  \ 为匿名用户和已认证用户配置了访问 CiviCRM 工具和表单的标准权限。你需要检查这些设置，以确认它们符合你网站的需求。我们将在本书后面讨论与 CiviCRM\
  \ 相关的 Drupal 角色和权限。\n\n> 请注意，在安装过程中，Drupal 会在 /path_to_docroot/sites/ 子目录下为你的站点创建一个文件目录，并使其可写。默认情况下，CiviCRM\
  \ 将在此目录下为临时文件创建文件夹，例如 /path_to_docroot/sites/yoursite.org/files/civicrm。\n\n安装脚本应自动启用\
  \ CiviCRM 模块，并在你的菜单中显示 CiviCRM 链接。单击 CiviCRM 菜单项进入，确认安装成功。\n\n如果你以管理员身份登录后在主菜单中看不到\
  \ CiviCRM 链接，请浏览到“管理 | 站点构建 | 模块”，确认 CiviCRM 模块已启用。如果模块已启用但仍看不到 CiviCRM 链接，请访问专门讨论在\
  \ Drupal 下安装 CiviCRM 的论坛以进一步排查问题：http://forum.civicrm.org/index.php/board,6.0.html。\n\
  \n## Drush 过程\n\nDrush（Drupal shell）是一个 Linux shell 工具，可用于对你的 Drupal 安装执行操作，包括多站点管理。在\
  \ 2010 年，社区开始努力通过 Drush 为 CiviCRM 提供支持。在使用之前，你必须先安装 Drush 和 CiviCRM 支持文件（详见下文）。使用\
  \ Drush 需要 PHP 5.2+。截至 CiviCRM 3.2 版本，Drush CiviCRM 命令如下：\n\n| 命令 | 描述 |\n|---|---|\n\
  | `civicrm-cache-clear` | 清除整个 CiviCRM 数据库和 Smarty 缓存。 |\n| `civicrm-install` |\
  \ 安装一个新的 CiviCRM 实例。 |\n| `civicrm-rest` | 用于访问 CiviCRM API 的 REST 接口。它可以返回 XML\
  \ 或 JSON 格式的数据。 |\n| `civicrm-restore` | 从指定的备份目录恢复 CiviCRM 代码库和数据库。 |\n| `civicrm-sql-cli`\
  \ | 使用 CiviCRM 的凭据打开 SQL 命令行界面。 |\n| `civicrm-sql-conf` | 打印 CiviCRM 数据库连接详细信息。\
  \ |\n| `civicrm-sql-connect` | 连接 CiviCRM 数据库的字符串。 |\n| `civicrm-sql-dump` | 使用\
  \ mysqldump 将 CiviCRM 数据库导出为 SQL。 |\n| `civicrm-sql-query` | 对 CiviCRM 数据库执行查询。\
  \ |\n| `civicrm-update-cfg` | 更新 config_backend 以修正配置设置，尤其是在 CiviCRM 站点被克隆/迁移后。\
  \ |\n| `civicrm-upgrade` | 用新指定的 tar 文件替换 CiviCRM 代码库，并通过执行 CiviCRM 升级过程 `civicrm/upgrade?reset=1`\
  \ 升级数据库。 |\n| `civicrm-upgrade-db` | 从命令行执行 `civicrm/upgrade?reset=1` 过程。 |\n\n\
  如果你尚未安装 Drush，请按以下步骤操作：\n\n1. 将当前版本的 Drush 下载到服务器上的主目录。\n2. 对于初学者，最简单的方法是在 http://drupal.org/project/drush\
  \ 页面点击推荐版本的下载链接下载到本地计算机，然后使用 SCP、SFTP 或 FTP 上传到服务器上的主目录。\n3. 对于更高级的用户，一个更简单的方法是将鼠标悬停在\
  \ http://drupal.org/project/drush 页面推荐版本的下载链接上，记下下载 URL，然后在 SSH 命令中使用该 URL：\n  \
  \ ```\n   $ cd ~; wget http://ftp.drupal.org/files/projects/drush-6.x-3.3.tar.gz\n\
  \   ```\n4. 解压文件：\n   ```\n   $ tar -xzf drush-6.x-3.3.tar.gz\n   ```\n5. 重命名 drush\
  \ 目录：\n   ```\n   $ mv drush .drush\n   ```\n6. 使解压后的 drush 目录中的 drush 文件可执行：\n\
  \   ```\n   $ chmod u+x ~/.drush/drush\n   ```\n7. 确保该目录在你的路径中。\n8. 检查以下命令的输出，确保\
  \ /usr/local/bin 或某个其他可用目录位于你的 `$PATH` 中：\n   ```\n   $ set\n   ```\n9. 在你的路径中的某处（如\
  \ /usr/local/bin）创建一个指向 drush 可执行文件的符号链接：\n   ```\n   $ ln -s ~/.drush/drush /usr/local/bin/drush\n\
  \   ```\n10. 检查 Drush 是否正常工作：\n    - 切换到站点的文档根目录：\n      `$ cd /path_to_docroot/`\n\
  \    - 执行 Drush：\n      `$ drush -l http://mysite.org help`\n\n现在，按如下方式为 CiviCRM\
  \ 安装 Drush 支持：\n\n1. 在 CiviCRM 的 Subversion 代码库中找到最新版本的 Drush / CiviCRM 包含文件：在浏览器中导航到\
  \ http://svn.civicrm.org/tools/branches/，并记下最新版本，例如 v3.2。\n2. 在命令 shell 中，将命令中的\
  \ v3.2 替换为你刚刚记下的最新版本，然后执行以下命令：\n   ```\n   $ cd ~/.drush/includes\n   $ wget http://svn.civicrm.org/tools/branches/v3.2/drupal/drush/civicrm.drush.inc\n\
  \   ```\n   现在 Drush 已安装并带有 CiviCRM 支持，安装 CiviCRM 就很容易了。\n3. 如果目录尚不存在，请在 `/path_to_docroot/sites/all/modules`（推荐）或此站点的目录中（例如\
  \ `/path_to_docroot/sites/yourdomain.org/modules`）为 Drupal 模块创建一个目录，以防止 CiviCRM\
  \ 被运行在此代码库上的其他站点使用：\n   ```\n   $ mkdir -p /path_to_docroot/sites/all/modules\n\
  \   ```\n4. 通过在浏览器中导航到 http://sourceforge.net/projects/civicrm/files/ 找到要安装的 tar\
  \ 包，并选择正确的版本来替换以下命令中的 3.2.0（注意版本号在 URL 中出现两次）：\n   ```\n   $ wget -O /path_to_docroot/sites/all/modules/civicrm.tar.gz\
  \ http://sourceforge.net/projects/civicrm/files/civicrm-stable/3.2.0/civicrm-3.2.0-drupal.tar.gz/download\n\
  \   ```\n5. 现在，使用以下命令通过 Drush 安装 CiviCRM，并将 yourDbUser、localhost、yourCivicrmDbName\
  \ 和 3.2.0 替换为适当的值：\n   ```\n   $ drush civicrm-install --dbuser=yourDbUser --dbpass=yourDbPassword\
  \ --dbhost=localhost --dbname=yourCivicrmDbName --tarfile=sites/all/modules/civicrm-3.2.0-drupal.tar.gz\
  \ --destination=sites/all/modules\n   ```\n\n\n\n\n\n- 6. 在浏览器中以 Drupal 管理员身份登录到您的网站。\n\
  - 7. 浏览至 **Administer | Site building | Modules** 以确认 CiviCRM 模块已启用。\n- 8. 您现在应该在菜单中看到\
  \ CiviCRM 的链接。点击 CiviCRM 菜单项以进入并确认安装成功。\n\n如果在 CiviCRM 模块启用时仍未在主菜单上看到 CiviCRM 链接，请访问\
  \ CiviCRM 专门用于在 Drupal 下安装的论坛：http://forum.civicrm.org/index.php/board,6.0.html。\n\
  \n## 安装故障排除\n\n大多数安装问题都是由于未满足托管服务器要求、托管环境资源不足或对上述安装步骤理解有误造成的。让我们逐一回顾这些情况。\n\n如前所述，CiviCRM\
  \ 对托管环境有特定的要求，其中包括所使用的 Apache/MySQL/PHP 版本、MySQL 的 InnoDB 支持，以及各种功能所需的特定 PHP 扩展。在某些情况下，如果您在未满足基本要求的情况下尝试安装软件，CiviCRM\
  \ 会显示错误并提供指导。然而，有时您可能能够在没有描述性错误的情况下安装 CiviCRM，并且可能要到后来才会注意到问题。请务必在安装前查看并确认符合服务器要求。\n\
  \n如果您不确定托管环境运行的是哪个版本的 Apache/MySQL/PHP，请在文档根目录中创建一个名为 `phpinfo.php` 的文件，其中仅包含 `<?php\
  \ phpinfo(); ?>`。确保其可被您的 Web 服务器读取，然后导航至 `http://yoursite.org/phpinfo.php`。在 Joomla!\
  \ 中，可以通过 **Help | System Info | PHP Information** 页面查看此信息，无需单独的 `phpinfo` 文件。创建并查看\
  \ `phpinfo.php` 文件后，请将其从 Web 服务器上删除，因为它通过暴露系统详细信息而带来一定的安全风险。\n\n第二个常见的安装问题原因是托管资源不足。CiviCRM\
  \ 是一个资源消耗相对较大的应用程序，您在系统中的安装和操作能力将直接与 Web 主机上可用的资源相关。因此，我们强烈建议在虚拟专用服务器或专用托管上运行 CiviCRM\
  \ 安装。虽然可能在共享托管环境中运行 CiviCRM，但它更容易出现资源相关问题。\n\n**Domain Information** 用于配置组织的名称、**FROM\
  \ Email Address**、邮寄地址和其他联系人详细信息。此处的设置很重要，因为它们将被用作从 CiviCRM 发送的系统生成邮件和 CiviMail\
  \ 邮件的默认发件人地址。请注意，用于发送邮件的电子邮件地址需要在您的托管服务器上是一个有效用户，以便 CiviCRM 能够正常发送邮件（此要求取决于您的托管环境配置）。\n\
  \n如果您计划使用 CiviMail 从网站进行群发邮件，请务必填写域名地址字段，以便其包含在批量邮件中。这是对任何合法群发邮件者的良好做法，并且在某些司法管辖区（例如美国的\
  \ CAN-SPAM 法案）以及 CiviMail 本身中是强制要求的。\n\n## 查看和编辑联系人\n\n下一个配置部分 **Viewing and Editing\
  \ Contacts** 处理与联系人相关的设置，包括联系人记录页面、搜索设置、联系人类型和地址设置。我们将逐一介绍这些区域。\n\n**Site Preferences**\
  \ 控制系统不同部分中可见的内容区域。例如，如果您不打算将标签用作分类工具，则应将其从视图中移除。是否不需要立即访问变更日志（记录联系人记录何时被编辑、由谁编辑以及时间戳的运行列表）？将其从视图中移除。\n\
  \n首选项分为四个区域：\n\n- **Viewing Contacts**：控制联系人记录顶部出现的标签。\n- **Editing Contacts**：控制联系人编辑视图中会出现哪些元素（可从联系人摘要标签访问）。\n\
  - **Contact Search**：此高级搜索工具按类型对字段进行分组。您展开组面板以访问其各自的字段。在此处使用选项来禁用您不想显示的面板。\n- **Contact\
  \ Dashboard**：CiviCRM 有一个特殊页面，可向已登录网站用户公开，称为 **Contact Dashboard**。仪表板汇总了与用户相关的记录，包括其会员历史、活动注册历史、捐赠历史和认捐历史。此外，用户还可以查看他们有权查看的相关联系人。\n\
  \n在您最初配置此部分时，可能不确定要选择哪些选项。请记住，您可以随时返回稍后修改设置。随着您逐步实施网站并开始在系统中工作，您会发现此处列出的某些元素是否需要。\n\
  \n此页面的最后一个选项让您设置首选的 **WYSIWYG editor**。编辑器工具栏将出现在网站中的任何 HTML 文本区域。我们建议尽可能使用与您的 CMS\
  \ 相同的编辑器。对于 Joomla! 用户，未来的 CiviCRM 版本将提供集成系统默认和用户指定的 WYSIWYG 编辑器的支持（从 v3.3 开始）。\n\
  \n**Address Settings** 提供类似的功能，允许您选择用于邮件标签生成和联系人地址块的内容。\n\n对此页面的常见更改包括从邮件标签中移除 **{contact.supplemental_address_2}**（大多数组织使用两行地址），以及隐藏\
  \ **Addt'l Address 2**、**Latitude** 和 **Longitude** 值。通常，您将依赖地理编码功能在无需用户参与的情况下填充这些值。\n\
  \n如果您有兴趣生成按地址排序的报告，例如用于步行拉票的名单，那么您应该打开 **Street Address Parsing**。这启用了一个功能，尝试自动解析输入系统中的街道地址的街道号码、街道名称和单元号码。从版本\
  \ 3.3 开始，支持美国、加拿大英语和加拿大法语街道地址。\n\n此页上的最后一个设置处理地址标准化。CiviCRM 将集成 USPS 网络工具 API 以验证输入的地址。请注意，该工具仅检查地址是否有效；它不会确定联系人姓名是否在该地址有记录。在完成本节并启用该工具之前，您必须向\
  \ USPS 申请并获得 ID 和 URL。这可以在以下位置完成：http://www.usps.com/webtools/address.htm。\n\n我们清单中的下一个配置项目是\
  \ **Mapping and Geocoding**。CiviCRM 通过 Google 和 Yahoo! 支持地址的自动地理编码。首先，访问您首选的服务并获取密钥。然后，在此页面上选择提供商并输入您的密钥。CiviCRM\
  \ 将在地址创建或编辑时对其进行地理编码。在查看单个联系人记录或搜索结果列表时，您可以查看地址或多个地址的地图（如果您正在查看搜索结果），同时利用 Google/Yahoo!\
  \ 提供的其他功能，例如绘制到该位置的路线。\n\n密钥可以从以下位置获取：\n\n- Google: http://code.google.com/apis/maps/signup.html\n\
  - Yahoo!: http://api.search.yahoo.com/webservices/register_application\n\n继续，**Search\
  \ Settings** 控制哪些字段可通过简单搜索工具进行搜索，以及搜索功能如何运行和显示结果。选项包括：\n\n- **Automatic Wildcard**：这使用户能够输入部分文本并返回包含该文本的任何匹配的搜索结果，假设在搜索字符串之前和之后使用通配符。较大的数据库可能希望禁用此选项，因为它会减慢搜索性能并返回更大的结果集。\n\
  - **Include Email**：这将同时搜索联系人姓名和电子邮件地址以查找搜索文本。\n- **Include Nickname**：这将搜索联系人姓名和昵称以查找搜索文本。如果您大量使用昵称，这是一个非常有价值的功能。如果不是，您可能考虑禁用它，因为如果您有大量联系人，它会减慢搜索处理速度。\n\
  - **Include Alphabetical Pager** 和 **Include Order By Clause**：这些是有用的功能，可促进搜索结果的导航。然而，它们都可能影响大型数据库的性能。如果您在搜索时遇到响应时间差，请考虑关闭其中一个或两个。\n\
  - **Default Contact Search Profile**：进行搜索后，结果列表表显示联系人姓名、地址、电话和电子邮件。如果您希望设置默认显示的替代字段集，您必须先构建一个配置文件（字段集合），然后从\
  \ **Default Contact Search Profile** 选项中选择它。\n- **Smart group cache timeout**：这控制智能组中的联系人记录何时从缓存中清除的频率。智能组是保存的搜索；缓存可提高从搜索中提取记录列表时的性能。默认情况下，每次添加或编辑联系人记录时都会清除缓存。这可确保对记录的任何更改都反映在动态搜索结果中。每次清除时重新创建缓存需要时间，尤其是如果您在智能组中有大量联系人。如果您不需要智能组实时准确，可以通过增加此值来提高联系人保存时的页面加载时间（建议五分钟）。\n\
  - **Autocomplete Contact Search**：在水平导航栏左上方有一个快速搜索字段。当您在字段中输入时，系统会显示可能与输入值匹配的结果。可能匹配的显示始终包括联系人姓名，但也可能包括电子邮件、电话和地址字段。使用\
  \ **Autocomplete Contact Search** 选项选择应包含哪些字段。添加选项可能有所帮助，因为您可以根据电子邮件或其他值区分同名联系人。然而，不要选择太多选项，因为它会使结果下拉列表变得杂乱，难以阅读列表。\n\
  \n\n\n\n\n- **杂项**：我们清单中的下一页配置页，**杂项**，包含各种系统操作选项。\n- **仪表盘缓存超时**：仪表盘是您首次进入系统时显示的\
  \ CiviCRM 主页。您可以配置仪表盘以显示报表，或“小部件”，在一个页面上提供系统数据的有帮助摘要。由于小部件报表可能根据您的配置从系统中几乎任何数据中提取，因此页面加载可能需要一些时间。系统缓存通过对报表数据进行静态快照，并在定期基础上才从实时数据重新加载来改善这一点。您可以使用\
  \ **仪表盘缓存超时** 选项控制缓存清空的频率。\n- **联系人回收站与恢复**：对于需要更严格控制联系人记录删除（包括其捐赠信息）的组织而言，这是一个有用的选项。它可以被禁用以简化工作流程并提高性能。启用后，通过联系人记录、搜索结果任务或合并结果删除的联系人将被“放入回收站”——标记为已删除但保留在数据库中。您以后可以使用高级搜索找到这些联系人并永久删除或恢复它们。\n\
  - **版本检查与统计报告**：这有助于您作为实施者跟踪 CiviCRM 的最新版本。如果您安装的版本早于当前稳定版本，CiviCRM 将在管理页面的顶部放置通知以提醒您。如果此选项打开，基本统计信息将被发送回\
  \ CiviCRM，以便核心开发团队对人们使用的是什么版本、在什么环境中托管以及数据库的大小有一个基本概念。这些统计信息不包含您网站的任何数据——它们仅包括您的数据和系统环境信息的汇总统计信息。在可能的情况下，请保持此选项开启，因为这对核心团队了解社区如何使用软件非常有帮助；这通常会指导未来开发的方向。\n\
  - **最大附件数**：在生成电子邮件或创建活动时，用户可以附加文件。在此处设置 **最大附件数** 以防止一次附加太多。\n- **reCAPTCHA**：最后，您可以使用\
  \ reCAPTCHA 为在线表单启用反垃圾邮件工具。reCAPTCHA 有助于确保表单由人类而非计算机完成。它以图形形式呈现单词或字母数字字符串，通常带有某种扭曲或其他视觉障碍，使计算机难以破译。如果您计划在网站上提供公开表单供用户输入数据，您应考虑实施此功能。\n\
  \n首先，在 http://recaptcha.net/ 注册以获取公钥和私钥。然后返回此页面完成表单。配置完成后，您可以在个人资料的 **设置** 页面 **高级设置**\
  \ 面板中按表单逐个启用 **reCAPTCHA**。我们在介绍个人资料表单和向网站公开数据的过程时将进一步讨论此问题。\n\n- **联系人类型**：本节的最后一页配置页是\
  \ **联系人类型**。CiviCRM 有三种主要联系人类型——**组织**、**个人** 和 **家庭**。联系人类型用于区分您维护的联系人记录类型。每种类型将具有一些独特的数据字段，以及所有类型共有的字段。例如，名字和姓氏字段适用于个人记录，但不适用于组织记录，例如企业。相比之下，地址字段是通用的。\n\
  \n除了三种主要联系人类型之外，您还可以创建额外的子类型来对记录进行分类。您还可以使用此配置工具重命名现有的主要类型。思考联系人子类型时，有几件重要的事情需要记住：\n\
  \n- 使用子类型组织记录有几个好处，其中最主要的是能够创建分配给一个或多个子类型的自定义字段。考虑一所使用 CiviCRM 跟踪家长和教师的学校。这些都是个人联系人类型，但为每种类型收集的数据会非常不同。学校可能希望了解希望志愿服务的家长的技能，或跟踪父母是否也是该校校友；另一方面，教师记录会跟踪其教育经历、授课历史以及与就业相关的\
  \ 人力资源数据。创建子类型允许您对收集的数据进行细分。\n- 子类型是基于三种主要联系人类型之一的。在创建子类型时，首先考虑子类型应基于哪三种主要类型之一。\n\
  - 联系人记录目前只能分配一种联系人类型。因此，请确保您的子类型是互斥的。换句话说，不要创建子类型，使得新联系人可能同时适合多个子类型，或对联系人最佳放置位置存在歧义。还有许多其他方式可以对联系人进行分类；子类型应仅用于高层分类，其中联系人的性质存在根本差异。\n\
  \n有关联系人子类型的更完整回顾以及如何思考系统结构的额外指导，请参阅第 4 章，*CiviCRM 基础：浏览系统和处理联系人*。\n\n## 发送电子邮件\n\
  \n在解决了核心配置和联系人相关设置后，我们现在将注意力转向系统生成的电子邮件。CiviCRM 可以配置为自动为终端用户操作生成电子邮件，例如注册活动或进行捐赠。此外，管理员可以使用活动或\
  \ CiviMail（批量电子邮件分发工具）向一个或多个联系人发送电子邮件。虽然您不使用电子邮件发送功能也可以使用 CiviCRM，但如果您选择不使用，您将错过一项重要的功能。\n\
  \n首先，在 **Administer | Configure | Global Settings | Outbound Email (SMTP/Sendmail)**\
  \ 设置您的 **外发电子邮件** 配置，然后选择基于 **mail()**、**sendmail** 或 **SMTP** 的邮件机制。**SMTP** 可能为退回邮件处理提供更完整的退回头信息，尽管默认的\
  \ **mail()** 选项通常已足够。您的托管提供商也可能有偏好，或仅支持某些选项。无论您选择并配置哪个选项，请务必使用内置测试功能并确认收到电子邮件。这可以快速轻松地确保外发电子邮件正常工作。\n\
  \n> 如果您计划使用 CiviCRM 进行大规模群发电子邮件，请注意维护与 ISP 以及维护白名单/黑名单的组织良好的发送者声誉所涉及的责任。还要注意大规模邮件发送可能造成的潜在服务器负载。如果您计划大规模使用\
  \ CiviMail，您可能需要考虑第三方 SMTP 提供商。\n\n在测试外发电子邮件后，在 **Administer | Configure | From\
  \ Email Addresses** 配置设置。在从 CiviCRM 发送电子邮件时，登录用户的电子邮件将是默认的发件人地址。但是，您可以配置系统可用的额外地址，并在发送电子邮件时选择它们。\n\
  \n例如，您的组织可能有基于服务的通用电子邮件，例如 `events@my.org`、`questions@my.org` 和 `membership@my.org`。根据您的托管设置，所使用的发件人电子邮件地址可能需要在您的邮件服务器中作为邮箱或转发存在。\n\
  \n## 处理退回电子邮件流量\n\nCiviMail 组件为处理传入电子邮件提供了重要功能。这些电子邮件由系统接收和处理，目的有三：\n\n\n\n## 维护良好的电子邮件服务器声誉\n\
  \n系统发送的任何群发电子邮件都将被互联网上运行的各种垃圾邮件检测系统监控。虽然你无法直接控制这些系统，但你有能力也有责任构建和管理你的群发电子邮件系统，以最大程度地降低被标记为垃圾邮件发送者的可能性。这一声誉管理流程涉及域名记录配置，包括在电子邮件中提供发件人详细信息，提供退订和选择退出工具，以及处理退回的电子邮件，以便你不会反复向错误的电子邮件地址发送邮件，等等。所有这些都有助于降低垃圾邮件评分，并确保你能够通过群发电子邮件有效地继续触达你的受众。在本节中，我们将查看与\
  \ DNS（域名记录）相关的注意事项。\n\n第一步是在你的域名的 DNS 中设置 SPF 记录，并在移动服务器时确保其正确配置。发件人策略框架（SPF）向世界标识出被明确允许从你的域名发送电子邮件的主机、不允许的主机，以及无法对其做出判断的主机。你的\
  \ CiviCRM 服务器和域名的外发邮件服务器（如果不同），都应在 SPF 中被标识为“允许发送（通过）”。你的 SPF 记录越具体、越有限，它在有助于减少\
  \ CiviMail 投递问题方面的效果就越好。不幸的是，携带笔记本电脑在不同 IP 之间旅行的用户在发送电子邮件时，可能会使锁定发件人策略框架变得困难。\n\n\
  改善服务器声誉的第二种有用方法是设置反向 DNS。在《发送电子邮件》部分，你应该已经配置并成功测试了外发电子邮件设置。为了确定一切是否真的正常工作，请使用 CiviCRM\
  \ 向你可以在服务器外部访问的账户发送一封电子邮件，例如 Gmail 或 Hotmail 账户。然后，检查电子邮件头中的几项内容。在 Gmail 和 Google\
  \ Apps 中，你可以这样做：\n\n1. 打开该消息。\n2. 点击 Reply 或 Reply to all 旁边的其他操作下拉菜单。\n3. 选择 显示原文。\n\
  \n查找 Received-SPF 头记录。它应指示 neutral 或 pass。你也可能会找到其他记录，例如 Authentication-Results:\
  \ spf=neutral。\n\n如果你在 SPF 上遇到问题，问题有时可以追溯到服务器在发送电子邮件时提供的身份。检查 Received: From 头记录，直到找到你的源服务器，也许还要追溯到你的域名的\
  \ localhost。将你遇到的任何问题或疑问向你的 ISP 的技术支持提出。\n\n反向 DNS 是将 IP 地址翻译为主机名的过程，与正向 DNS 过程相反，正向\
  \ DNS 将常用的域名翻译为 IP 地址。设置反向 DNS 记录（如果尚未设置）可以帮助改善你的电子邮件声誉，因为发送 IP 被验证为你域名的合法发件人。如果你的服务器有多个域名共享一个\
  \ IP，那么花少量资金购买一个专用 IP（对 CiviContribute 的 SSL 证书也很有用）可能是值得的，以便你可以为你的域名设置反向 DNS。共享\
  \ IP 环境可能会导致你的域名评分不佳，如果它与垃圾邮件发送者或其他在电子邮件声誉管理方面不够谨慎的账户位于同一 IP 段中。\n\n改善服务器声誉的第三种方法是监控\
  \ DNS 黑名单，并请求维护这些列表的组织在你的服务器出现在列表中时将其移除。你可能因各种原因被列入名单，无论是正当的还是不正当的，包括：你没有正确处理退信，你的电子邮件收件人可能在投诉时出现错误，或其他网站影响了你的声誉。及时响应黑名单非常重要，因为它通常会从一个服务传播到另一个服务。\n\
  \n## 配置电子邮件处理器\n\n要处理传入电子邮件，你必须有一个电子邮件账户来接收传入电子邮件，并配置一个 cron 作业定期处理收到的电子邮件（本章后面会介绍）。\n\
  \n虽然不是必需的，但你通常希望用于退信处理的电子邮件账户专门用于此目的。你通常也不希望它是一个公开的账户，供受众向其发送电子邮件。它应仅为退信处理目的而创建和配置。\n\
  \nCiviMail 使用可变信封返回路径（VERP）处理作为跟踪退信的方法。该方法为每封外发消息添加一个唯一的发件人地址。当退信返回时，此唯一发件人地址用于确定哪条消息、哪个电子邮件地址和联系人记录产生了退信。退信按类型分类（在可能的情况下），并根据系统中的规则进行处理。不同的退信类型会触发对电子邮件的临时或永久保留，或记录交付尝试以供将来处理，如果该地址有额外的退信。\n\
  \nVERP 的首选设置称为子地址，它使用本地部分格式。如果你的隐形退信处理电子邮件地址是 `civimail@example.org`，那么 VERP 地址会在分隔符之后、域名之前附加一个唯一值，例如\
  \ `civimail+12.234ka.241123@example.org`。虽然这是首选方法，但一些 ISP 故意在其服务器上阻止子地址，因为它在群发邮件中被广泛使用。\n\
  \n为了测试你是否可以使用此方法，尝试向你设置的账户发送一封电子邮件，在 @ 符号之前向账户附加 +test 或 -test（myemail+test@mydomain.org）。如果成功收到消息，则确认支持本地部分处理，并且可以准备设置账户以处理传入消息。\n\
  \n如果不支持子地址/本地部分处理或你不希望使用该方法，你仍然可以使用 catch-all 电子邮件账户来处理退信电子邮件。Catch-all 账户配置为接收未发送到你域上设置的其它邮件账户的所有电子邮件——它“捕获”未被其它邮件账户“捕获”的任何电子邮件。一般来说，catch-all\
  \ 账户不太理想，因为它们通常会“捕获”大量垃圾邮件，这些邮件可能会与合法的退信一起处理。要确定你的托管环境是否支持 catch-all 账户，请登录管理你的电子邮件账户的系统并查找指定电子邮件为\
  \ catch-all 的选项，或联系托管支持以确定系统功能。如果你的系统支持 catch-all 地址但不支持子地址，你的服务器负载会略高，但系统应该能正常运行。\n\
  \n许多 CiviCRM 安装运行在虚拟专用服务器上。在大多数情况下，VPS 的管理员有权根据自己的需求和偏好配置其电子邮件系统。如果你自己没有技术技能，值得提出支持请求来按你想要的方式设置。\n\
  \n如果你的电子邮件系统无法同时支持子地址或 catch-all 地址，支持 VERP 的最后一种方法是使用第三方账户，例如 Gmail。处理远程电子邮件存储的处理时间和资源负载更高，如果发件人域名与\
  \ FROM 电子邮件域名不同，你的声誉可能会受到轻微影响；但这仍然是一个可行且有效的解决方案。请注意，根据所使用的系统，你可能需要配置过滤器，以便退信不会被标记并归档为垃圾邮件。例如，Gmail\
  \ 账户应创建过滤器，将任何被标记为垃圾邮件的内容重新定向回收件箱，以便 CiviCRM 处理。\n\n按如下方式使用你设置的退信处理账户配置 CiviMail：\n\
  \n1. 点击 **Administer | CiviMail | Mail Accounts**。\n2. 点击默认账户行的 **Edit** 链接。\n3.\
  \ 按需更改 **Name**，并将 **Return-Path** 留空。\n4. 输入该账户的 **Server**、**Username**、**Password**\
  \ 和 **Email Domain**。\n   - 你应该能够使用这些设置配置 Web 或桌面电子邮件客户端来检索邮件。\n\n\n\n\n\n5. 如果账户支持子地址，请在“Localpart”字段中输入电子邮件地址“name+”（包含加号，例如“civimail+”）。\n\
  \n6. 如果可能，请在**Protocol**字段中配置系统使用 IMAP（优于 POP3 或其他选项）。\n   - 再次，使用你的电子邮件客户端测试账户是否正常工作，然后再期望\
  \ CiviMail 能与其通信。\n\n7. 如果可能，请设置 SSL 以提高安全性。本地颁发的证书应该可以。\n\n配置好账户后，通过在浏览器地址栏输入以下\
  \ URL 手动检查邮件处理器脚本是否正常工作，其中 ?name=<username>&pass=<password>&key=<sitekey> 中的值与下面“设置\
  \ Cron 作业”部分中解释的值相同。例如：\n- Drupal: `http://example.org/sites/all/modules/civicrm/bin/EmailProcessor.php?name=<username>&pass=<password>&key=<sitekey>`\n\
  - Joomla!: `http://example.org/administrator/components/com_civicrm/civicrm/bin/EmailProcessor.php?name=<username>&pass=<password>&key=<sitekey>`\n\
  \n你应该在浏览器窗口中收到一条消息，说明账户已成功访问以及是否处理了任何电子邮件。通过在 CiviCRM 中创建一条联系人记录并故意使用错误的电子邮件地址继续测试。将电子邮件添加到邮件列表组，通过\
  \ CiviMail 发送测试电子邮件，然后再次运行脚本。这次，你应该会看到一条消息，说明已处理一封电子邮件，如果你查看联系人记录，你应该会看到该电子邮件被置于保留状态。\n\
  \n在确认退信处理功能正常工作后，**不要忘记配置 cron 作业**，如本章后面所述，以自动化常规处理功能。\n\n请注意，上面概述的配置指导涵盖了退信处理的标准设置选项。还有其他配置选项可用，例如\
  \ return-path 头和替代协议选项，如果你的服务器设置是非标准的，则可以使用这些选项。有关这些选项如何使用的更多详细信息，请查看在线文档或在论坛中搜索指导。\n\
  \n## 在线支付处理器\n\n你决定实施 CiviCRM 的原因之一很可能是为了受益于通过网站处理付款并立即在联系人管理系统中记录的能力。无论你是在收集捐款、竞选捐款、赞助承诺、认捐、会员费，甚至是注册费，所有这些交易都将通过\
  \ CiviContribute 进行。\n\n然而，在你可以通过 CiviCRM 收集和处理付款之前，必须配置一个支付处理器。你的支付处理器，也称为支付网关，是你购买的一项服务，允许直接通过你的网站或通过重定向到处理器的网站进行信用卡处理。处理器接收信用卡，授权付款，并将资金转入你的银行（手动或自动，具体取决于服务）。\n\
  \n选择要使用哪些服务可能具有挑战性，因为有许多选项可用。你需要确保你选择的任何服务都有相应的 CiviCRM 支付处理器插件可用；否则，你可能需要开发一个新的插件来与你选择的服务集成。\n\
  \n在撰写本书时，以下插件可用：\n- Authorize.net AIM\n- Click and Pledge\n- DPS Payment Express\n\
  - Elavon Payment Processor\n- eWAY (Single Currency)\n- FirstData (Linkpoint)\n\
  - Google Checkout\n- Moneris\n- Payflow Pro\n- PayJunction\n- PayPal – Express\n\
  - PayPal – Website Payments Pro\n- PayPal – Website Payments Standard\n- Realex\
  \ Payment\n\n一些额外的处理器，包括 Chase Paymentech 和 Quickbooks，已经创建或部分创建，但由于某种原因，它们尚未完全集成或打包到核心软件中。\n\
  \n并非所有支付处理器都一样。有些仅在有限的地区可用，或对可用货币有限制。收取费用的结构和模式也会有很大差异。如果你计划使用定期捐款，请确保调查处理器是否允许此类功能，并确保它已构建到\
  \ CiviCRM 插件中。\n\n> 要获取提供其功能详细信息的受支持处理器的最新列表，请访问 http://wiki.civicrm.org/confluence/display/CRMDOC/CiviContribute+Payment+Processor+Configuration。请注意，并非所有处理器插件都得到\
  \ CiviCRM 项目的官方支持。有些是由社区贡献的，并依赖社区支持进行持续更新。\n\n## 集成与重定向处理器\n\n有两种基本的支付处理器类型，即允许你直接从网站收集和处理信用卡（集成）的处理器，以及将你重定向到处理器的网站来处理交易（重定向）的处理器。两者各有利弊：\n\
  - 允许直接从网站收集信用卡的处理器提供了更具吸引力和品牌化的解决方案。用户永远不会离开你的网站，交易流程从收集表单无缝流向确认页面，最后到感谢/收据页面。然而，处理服务收取的费用通常更高，你必须拥有专用\
  \ IP 并安装 SSL 才能充分保护交易。\n- 将你重定向到处理网站的处理器（例如 PayPal Standard 和 Google Checkout）不需要\
  \ SSL（因为安全性由处理网站处理），并且通常可以非常快速地实施，并且可能收取较低的总费用。然而，重定向到处理网站意味着访客必须离开你的网站才能完成交易。这可能会阻止或使人们对完成付款感到困惑。\n\
  \n> CiviCRM 不会与共享 SSL 配合使用（通常在许多共享托管环境中提供）。你必须在你的域名上安装 SSL 才能使 CiviCRM 正常工作。如果你为你的网站实施\
  \ SSL，请务必访问：Administer | Configure | Global Settings | Resource URLs 并启用 Force Secure\
  \ URLs (SSL) 选项。这将把捐款页面和 CiviCRM 管理页面重定向到 SSL。\n\n如果你是网上支付的新手，并且不确定你的支持者会对新功能做出何种反应，请考虑从离站解决方案开始，在该解决方案中你会被重定向到处理器的网站来完成交易。在某个时候，你可能会达到一个阈值，即直接通过你的网站处理交易的额外成本是合理的。\n\
  \nSSL 证书是特定于域名的。为 www.yoursite.com 购买的证书将不会验证 yoursite.com，因为域名的根形式和 www 形式不被视为相同。\n\
  此外，CiviCRM 通过站点 URL 引用一些资源，如果根形式和 www 形式被互换使用，可能无法一致地运行。最简单的方法是通过在公共网站目录中的 .htaccess\
  \ 文件中添加 Apache 指令来解决。例如，如果你希望从根形式重定向到 www 形式，请添加以下内容（使用你的域名）：\n\n```\nRewriteEngine\
  \ On\n# Redirect root domain to www. form\nRewriteCond %{HTTP_HOST} ^yoursite\\\
  .com$ [NC]\nRewriteRule ^(.*)$ http://www.yoursite.com/$1 [R=301,L]\n```\n\n然后，确保你在\
  \ CiviCRM 配置中对资源的引用都使用域名的 www 形式。除了确保 CiviCRM 和你的 SSL 证书正常运行之外，这还有助于创建你网站的一致域名品牌。\n\
  \n## 配置支付处理器\n\n一旦你决定使用哪个支付处理器并完成了与你使用的公司必要的申请流程，你可以在 CiviCRM 中设置账户。从配置清单中选择 Payment\
  \ Processors。\n\n你必须填写的字段取决于你使用的处理器。在几乎所有情况下，CiviCRM 都允许你为实时处理器和沙箱（测试）账户配置凭据。当你使用捐款页面中的测试驱动选项时，将使用沙箱凭据。有关创建沙箱账户的详细信息，请参阅你的支付处理器。\n\
  \n如果你尚未拥有支付处理器账户，但希望开始设置和测试捐款页面或其他支付处理表单，请使用 Dummy Payment Processor 选项。然后你可以配置你的表单并启用捐款处理（包括活动和会员表单）。使用虚拟处理器时不会触发任何交易——它应仅用于临时测试目的。\n\
  \nCiviCRM 支持配置多个处理器。在你创建捐款页面或活动注册页面时，将要求你选择要由此表单使用的所需处理器。\n\n\n\n\n\n配置好支付处理器后，务必通过生成一条真实的捐助记录来测试它。不要仅依赖沙盒/测试工具；在使用会向公众处理付款的捐赠/承诺/活动/会员表单之前，务必使用真实信用卡运行一次真实交易来测试系统。\n\
  \n## 系统工作流模板\n\n完成支付处理器的设置后，返回配置清单并访问 **System Workflow Templates** 页面。当人们访问您网站上的\
  \ CiviCRM 表单，以及您作为管理员处理联系人记录时，系统会生成各种电子邮件并发送给您的联系人。所有这些电子邮件都可通过此页面进行自定义。\n\n如果您编辑其中任何一封电子邮件并保存更改，您将有选项查看或恢复到原始版本。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_117_0.png)\n\n模板包含占位符令牌，用于联系人和记录特定字段值。例如，如果您希望电子邮件以“Dear\
  \ First Name”开头，您将插入 **First Name** 令牌。在编辑模板文本时，您可以使用 **Insert Tokens** 按钮插入基本联系人字段。\n\
  \n编辑模板时请谨慎。大多数模板都包含许多条件子句（`if/else` 语句），以确保生成的电子邮件针对特定交易进行定制。进行编辑后，请务必使用各种选项进行测试，以确认其正常运行。\n\
  \n> CiviCRM 使用 Smarty 模板引擎（http://www.smarty.net）来渲染页面，包括工作流电子邮件。在创建电子邮件模板时，您可以插入基本逻辑并使用其他\
  \ Smarty 函数。\n\n## 组织、自定义和组件\n\n此时，您已完成了初始站点配置中最为关键的步骤。配置清单中包含我们将在此处简要回顾，并在后续详细介绍其各自功能完整实现时进一步讲解的额外部分。这些额外部分为\
  \ Organize your contacts、Customize Data、Forms and Screens，以及 Components。\n\n###\
  \ Organize your contacts\n\n当您开始导入和录入联系人时，您会开始寻找组织和分类他们的方法。CiviCRM 中有多种方法可以做到这一点，但两种主要方法是使用标签和组。标签是您创建的分层分类树，用于对联系人进行分类，或是一份自由文本的运行列表（tagset）。组是记录集合，可以是动态创建的（Smart\
  \ Groups，相当于保存的搜索）或手动收集的（例如， opt-in 邮件列表）。我们将在第 4 章 CiviCRM Basics: Moving through\
  \ the System and Working with Contacts 中讨论这些的配置和实现。\n\n### Customize Data, Forms\
  \ and Screens\n\nCiviCRM 的核心数据字段涵盖了您所期望的所有基本联系人和通信字段。不可避免地，您将拥有特定于您组织的额外数据片段，希望将其记录在数据库中。CiviCRM\
  \ 的 Custom Data 工具允许您向几乎任何现有类型的记录附加额外字段。例如，您可以向联系人记录、捐助记录、活动注册、关系类型等添加字段。我们将在第 5\
  \ 章 Collecting, Organizing, and Importing Data 中查看创建自定义字段。\n\n在许多，但并非所有情况下，您创建的数据字段都将包含在在线表单中并向网站访客公开。我们使用\
  \ Profiles 来选择核心和自定义字段以包含在特定表单中。我们将在第 6 章 Communicating Better 中开始了解如何构建和使用配置文件。\n\
  \n### Components\n\n如本章前面所述，CiviCRM 组件代表软件的主要功能区域。您的首次配置步骤是启用/禁用计划使用的组件。配置清单中的最后一个区块可让您访问每个组件特定的设置和选项。当我们在本書中探索每个功能区域时，我们将检查每个组件特定的配置选项。\n\
  \n## 选项列表\n\n虽然我们已完成了配置清单的回顾，但仍有几个额外的设置值得我们探索。您可以选择现在配置这些区域，或简单地记下它们，并在实施过程中需要时再返回修改。\n\
  \n在使用 CiviCRM 的过程中，您会很快发现有许多选项列表为字段提供选择。这些包括位置类型、电话类型、个人前缀和后缀、活动类型等等。可配置选项的完整列表可在\
  \ Administration Console 上找到，最常修改的部分列表可在 Administer | Option Lists 中获得，如以下屏幕截图所示：\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_119_0.png)\n\n每个选项的可用设置将特定于选项类型。在大多数情况下它是不言自明的；大多数都附带内联帮助文本。如果选项同时包含名称和标签字段，则名称字段用于唯一选项值，标签字段是选项列表中显示的内容。\n\
  \n## 与 CMS 用户同步\n\n如果您的 Joomla! 或 Drupal 网站已运行一段时间，您可能已有现有的网站用户账户列表。除非用户已登录网站并访问过\
  \ CiviCRM 页面，否则这些用户账户不会立即拥有对应的 CiviCRM 联系人记录。作为初始系统配置的一部分，最好将这些 CMS 用户与 CiviCRM\
  \ 同步。访问此选项的方法是访问 Administer | Manage | Synchronize Users to Contacts。\n\n触发此工具将为网站中的每个\
  \ CMS 用户创建关联的联系人记录。通常只需启动一次同步即可。此后，新 CMS 用户将在创建或访问 CiviCRM 资源时与 CiviCRM 关联。\n\n\
  > 这将以多种方式发生，具体取决于您使用的是 Joomla! 还是 Drupal，以及您实施了哪些账户创建工具。我们将在本书后面回顾一些可用选项。\n\n让我们花点时间准确了解\
  \ CiviCRM 联系人与 CMS 用户之间的关系。\n\n您的网站（CMS）用户是拥有使用用户名和密码登录网站权限的个人。CiviCRM 联系人是驻留在您捐助者数据库中的记录。CiviCRM\
  \ 在 CMS 用户与其对应的 CiviCRM 联系人记录之间创建链接。当用户登录您的网站时，您就可以公开该联系人特定的数据字段。例如，您可以让已登录的联系人编辑其地址和电话详细信息。\n\
  \n虽然每个 CMS 用户都应有一个对应的 CiviCRM 联系人记录，但反之通常不成立。您通常会维护没有对应用户账户的个人（以及组织和家庭）的联系人记录。\n\
  \n在配置和规划站点时，开始思考谁应该有权访问站点；您可能希望向网站用户公开哪些数据字段以供编辑和更新，以及您希望为创建和授予新用户权限采用的工作流程。\n\n\
  ## Drupal 对 CiviCRM 的访问控制\n\nDrupal 具有内置于其核心的有效的细粒度权限系统，可通过特定模块以多种方式扩展。CiviCRM 扩展了\
  \ Drupal 访问控制系统，以允许控制 CiviCRM 内的特定功能。我们将在本节中假设对 Drupal 访问控制系统有基本了解（访问 `http://drupal.org/node/22275`）。\n\
  \n> CiviCRM 目前不支持 Joomla! v1.5 的访问控制权限，主要由于 CMS 的访问组/级别限制。随着 Joomla! v1.6 的发布，其中包含强大的权限系统，CiviCRM\
  \ v4.0 版本将包含完整的访问控制集成。下面找到的 Drupal 权限列表将与 Joomla 1.6 兼容版本中可用的权限相同。\n\n访问是基于用户角色提供的，并且可以根据个人承担或放弃对\
  \ CiviCRM 中功能和内容的访问和管理的责任而添加或删除。\n\n\n\n\n\nDrupal 站点始终具有两个内置角色：匿名用户（任何未登录的人，包括没有用户账户的人），以及已认证用户（当前已登录的任何人）。通常还会为系统管理员以及需要被允许执行他人不被允许执行的操作的人群创建额外的角色，例如审核评论或其他用户生成内容。\n\
  \n我们不建议为 CiviCRM 创建过于复杂的角色集。理想情况下，您将设置权限，使人们始终能够执行他们需要执行的操作，并且不能执行对系统、其数据或组织保护其持有的个人隐私声誉有害的操作。通常您只需使用一个名为\
  \ CiviCRM 管理员的角色即可，或许再加一个允许用户查看和编辑财务信息的角色。\n\n以下是可在 Drupal 中通过 管理 | 用户管理 | 权限 按角色选择性启用或禁用的权限：\n\
  \n- access CiviCRM\n- access CiviContribute\n- access CiviEvent\n- access CiviMail\n\
  - access CiviMail subscribe/unsubscribe pages\n- access CiviMember\n- access CiviPledge\n\
  - access CiviReport\n- access Contact Dashboard\n- access Report Criteria\n- access\
  \ all custom data\n- access deleted contacts\n- access uploaded files\n- add contacts\n\
  - administer CiviCRM\n- administer Reports\n- administer Tagsets\n- administer dedupe\
  \ rules\n- administer reserved tags\n- delete activities\n- delete contacts\n- delete\
  \ in CiviContribute\n- delete in CiviEvent\n- delete in CiviMail\n- delete in CiviMember\n\
  - delete in CiviPledge\n- edit all contacts\n- edit all events\n- edit contributions\n\
  - edit event participants\n- edit groups\n- edit memberships\n- edit pledges\n-\
  \ import contacts\n- make online contributions\n- merge duplicate contacts\n- profile\
  \ create\n- profile edit\n- profile listings\n- profile listings and forms\n- profile\
  \ view\n- register for events\n- translate CiviCRM\n- view all activities\n- view\
  \ all contacts\n- view event info\n- view event participants\n\n正如您所见，这些权限可分为不同类型的组：\n\
  \n- 访问 CiviCRM 的组件（例如，访问 CiviMember）\n- 对特定类型的对象执行某些操作（例如，添加联系人）\n- 访问管理界面（例如，管理重复数据删除规则）\n\
  - 访问非管理功能（例如，网上捐款和注册活动）\n\nDrupal 权限是累积的——如果用户被分配了三个角色，则来自所有三个角色的组合权限将决定用户在系统中的操作权限。由于权限明确允许指定的访问，如果三个角色中的任何一个已被授予权限，它将影响用户的访问。\n\
  \nCiviCRM 中包含三个 Drupal 模块，允许 CiviCRM 中的联系人信息以与 Drupal 访问控制系统有用交互的方式使用。\n\n## CiviGroup\
  \ Roles Sync\n\n此模块允许将特定 Drupal 角色中的所有用户放置到 CiviCRM 组中，反之亦然。这允许 CiviCRM 将联系人放入组中，并使该结果在\
  \ Drupal 中产生额外的访问权限。CiviCRM 个人资料表单上的注册可以自动添加到组中，然后可用于启用对您网站部分的访问。还可以为所有捐赠者或其他标准（如地理位置）创建智能组，以提供对您网站部分的差异化访问。\n\
  \n要启用 CiviGroup Roles Sync，请按以下步骤操作：\n\n- 1. 在 Drupal 中，点击 **Administer | Site building\
  \ | Modules**。\n- 2. 在 **CiviCRM modules** 字段集中，点击启用 **CiviGroup Roles Sync** 模块。\n\
  - 3. 点击 **Save Configuration** 按钮。\n\n要配置 CiviGroup Roles Sync，请按以下步骤操作：\n\n- 1.\
  \ 创建一个或多个非默认 Drupal 角色，如下所示：\n  - 在 Drupal 中，点击 **Administer | User management |\
  \ Roles**。\n  - 输入新角色的名称，然后点击 **Add role** 按钮。\n  - 将一个或多个用户分配给新角色，例如：\n  - 在 Drupal\
  \ 中，点击 **User management | Users**。\n  - 点击用户名旁边的 **edit**。\n  - 在 **Roles** 下，启用新角色旁边的复选框。\n\
  \  - 点击 **Save**。\n- 2. 创建一个或多个 CiviCRM 角色，如下所示：\n  - 在 CiviCRM 中，点击 **Administer\
  \ | Manage | Access Control**。\n  - 点击 **Manage ACL Roles**。\n  - 点击 **Add ACL Role**。\n\
  \  - 在 **Label** 字段中输入角色名称。您还可以选择性地输入 **Description**，增加或降低角色的 **Weight** 以使其在相对于其他角色的列表中显示得更低或更高，或取消选中\
  \ **Enabled?** 字段以禁用该角色。\n  - 点击 **Save**。\n- 3. 在 **Contacts | Manage Groups**\
  \ 下根据需要创建一组用户以分配给 CiviCRM 角色。\n\n> 访问控制必须在组的设置中启用为组类型。\n\n- 4. 将访问控制组中的用户分配给每个 CiviCRM\
  \ 角色：\n  - 点击 **Administer | Manage | Access Control**。\n  - 点击 **Assign Users**\
  \ 以将用户分配给 CiviCRM ACL 角色。\n  - 点击 **Add Role Assignment**。\n  - 在 **Assigned To**\
  \ 中选择一个 ACL 角色和一组用户。\n  - 可选择取消选中 **Enabled?** 以禁用该分配。\n  - 点击 **Save**。\n- 5. 在\
  \ Drupal 中，点击 **Administer | Site configuration | CiviGroup Roles Sync**。\n- 6.\
  \ 点击 **Add Association** Rule。\n- 7. 从选择列表中选择一个 CiviCRM 组和一个 Drupal 角色。\n- 8. 点击\
  \ **Add association** rule。\n\n## CiviMember Roles Sync\n\n此模块在特定会员类型与特定会员状态和 Drupal\
  \ 角色之间提供双向同步。例如，这允许您为所有当前会员提供对站点的访问，并在他们未支付会员续费时自动移除该访问。\n\n要启用 CiviMember Roles\
  \ Sync 模块，请按以下步骤操作：\n\n- 1. 在 Drupal 中，点击 **Administer | Site building | Modules**。\n\
  - 2. 在 **CiviCRM** 模块字段集中，点击启用 **CiviMember Roles Sync** 模块。\n- 3. 点击 **Save Configuration**\
  \ 按钮。\n\n要配置 CiviMember Roles Sync，请按以下步骤操作：\n\n- 1. 创建一个或多个非默认 Drupal 角色，如下所示：\n\
  \  - 在 Drupal 中，点击 **Administer | User management | Roles**。\n  - 输入新角色的 **Name**，然后点击\
  \ **Add role** 按钮。\n  - 将一个或多个用户分配给新角色，例如：\n  - 在 Drupal 中，点击 **User management\
  \ | Users**。\n  - 点击 **Username** 旁边的 **edit**。\n  - 在 **Roles** 下，启用新角色旁边的复选框。\n\
  \  - 点击 **Save**。\n- 2. 在 **Administer | CiviMember | Membership Types** 和 **Administer\
  \ | CiviMember | Membership Status Rules** 处创建和配置 CiviCRM 会员类型和状态（有关更多详细信息，请参阅 *Chapter\
  \ 8, Growing Your Membership and Interacting with Members*）。\n- 3. 在 Drupal 中，点击\
  \ **Administer | Site Configuration | CiviMember Roles Sync**。\n- 4. 点击 **Add Association\
  \ Rule** 选项卡。\n- 5. 选择一个 CiviMember 会员类型并选择一个 Drupal 角色，以便为具有该会员类型当前状态的每个联系人分配该\
  \ Drupal 角色。\n- 6. 为 **Current Status** 和 **Expired Status** 启用适当的身份验证状态。如果您使用的是默认的\
  \ CiviCRM 会员状态规则，您可能希望为 **Current Status** 启用 **New**、**Current** 和 **Grace**，为\
  \ **Expired Status** 启用 **Expired**、**Pending**、**Cancelled** 和 **Deceased**。当联系人的会员类型更改时，将检查这些列表以确定是否应将所选\
  \ Drupal 角色分配给或从联系人的 Drupal 账户中取消分配。\n- 7. 点击 **Add association rule**。\n\n## CiviCRM\
  \ OG Sync\n\n此模块可确保 CiviCRM 组中联系人的更改反映在关联的 Drupal 组织组中。然而，由于组织组模块没有提供适当的方式通知 CiviCRM\
  \ 组织组成员身份的更改，我们发现此模块的实用性有限。\n\n\n\n\n\n## Drupal 下的 CiviCRM 访问控制\n\n除了上面我们看到的 CiviCRM\
  \ 暴露给 Drupal 访问控制权限系统的权限之外，CiviCRM 还有自己的访问控制功能，提供更细粒度的控制。一般来说，你可以通过 CiviCRM 的界面控制更多类型的操作。此外，你还可以指定接收权限的数据子集；例如，你可以限制一组用户对组成员联系人字段的编辑权限。\n\
  \n> Joomla! 1.5 的限制使得 CiviCRM 在安装在 Joomla! 下时无法提供自己的访问控制。CiviCRM v4.0 将支持 Joomla\
  \ 1.6，并提供这些功能。\n\n为了简化在 Drupal 和 CiviCRM 中配置你的访问控制系统，你可能想要考虑使用 CiviGroup Roles Sync\
  \ 模块。这样，相同的用户就可以同时拥有相同的 CiviCRM 角色，就像用于 Drupal 访问控制的 Drupal 角色一样。当你采用这种方法时，给 CiviCRM\
  \ 和 Drupal 角色使用相同的名称是非常好的做法。\n\n可以分配给角色的 Drupal 权限往往结合了两个概念——操作和数据集。例如，“访问评论”包括“访问”操作和“评论”作为操作对象的数据。CiviCRM\
  \ 访问控制中的权限将这些概念形式化并分开。因此，它们包括以下三个元素，而不是 Drupal 的两个：\n\n- CiviCRM 角色\n- 操作（查看、编辑、创建、删除、搜索、全部）\n\
  - 数据\n\n尽管这使得指定权限变得有点繁琐，但它提供了一个非常灵活的结构来控制访问。\n\n在前一节关于 CiviGroup Roles Sync 和 CiviMember\
  \ Roles Sync 的讨论中，我们回顾了如何创建 CiviCRM 访问控制角色（在 管理员 | 管理 | 访问控制，管理角色）以及如何将用户分配给这些角色（在\
  \ 管理员 | 管理 | 访问控制，将用户分配给 CiviCRM ACL 角色）。现在是时候把所有东西整合起来并创建 CiviCRM 访问控制列表了：\n\n\
  1. 点击 管理员 | 管理 | 访问控制。\n2. 点击 管理 ACL。\n3. 点击 添加 ACL。\n\n## 仪表盘\n\n当你首次登录你的 CMS 并访问\
  \ CiviCRM 时，你会进入仪表盘页面。此页面可以配置为以两列显示来自系统的报告。它可直接从此页面使用 配置你的仪表盘 按钮进行配置。\n\n点击后会显示两列的视觉表示以及可用报告的列表。只需从可用报告块中拖放至两列之一，然后点击\
  \ 完成 以保存你的设置。\n\n可用报告，或称小部件，来自主报告列表（报告菜单）。你必须先将报告配置为可作为小部件使用，然后它才会出现在仪表盘配置页面中。\n\
  \n## 导航\n\n在我们对 CiviCRM 的回顾中，我们引用了工具和选项在水平导航栏中的默认位置。然而，你可以添加、移动、删除或重命名站点中的菜单选项。例如，如果你的组织是活动（用于跟踪与支持者的沟通）的重度用户，你可能希望将\
  \ 活动搜索 和 新活动 菜单项移至主标题。\n\n你可以通过前往 管理员 | 自定义 | 导航菜单 来修改导航菜单。菜单以可展开的树形显示。点击 新菜单项 按钮创建新选项，右键点击现有选项以修改它，并拖放项目以将其移动到新位置。\n\
  \n在创建或编辑选项时，你输入页面的 URL。站点内的页面可以使用相对 URL 引用。然而，你也可以使用完整 URL（包括 http://）创建指向非 CiviCRM\
  \ 位置和站点外部链接的菜单选项。Drupal 站点将使用 权限 选择工具来确定哪些用户可以查看和访问菜单项。\n\n对菜单进行修改后，页面顶部会出现一个通知块。点击\
  \ 点击此处 链接重新加载菜单并查看你的更改。\n\n## 设置 cron 作业\n\ncron 作业是配置在你的托管服务器上的基于时间的触发器。你设置 cron\
  \ 作业以定期自动运行脚本。CiviCRM 附带了几个可选脚本，可通过 cron 运行，提供各种功能的自动化批量记录处理。\n\n- `UpdateMembershipRecord.php`：此脚本由\
  \ CiviMember 使用，用于根据系统中定义的规则更新会员状态并启动续费提醒邮件。如果你是 CiviMember 用户，这是一个非常重要的脚本。会员状态规则定义了会员记录何时被视为新、当前、宽限期或过期（或你定义的任何其他状态）。必须运行此脚本才能根据这些规则处理记录，并在它们从一个状态转换到下一个状态时更新它们。每天运行一次就足够了，最好在低流量时段（例如午夜）运行，因为它可能是一个资源密集型脚本，具体取决于数据库的大小。如果你使用续费提醒邮件功能（在会员到期日前固定天数向当前会员发送提醒邮件），你必须为会员类型创建邮件模板以供使用。这将在本书后面更详细地讨论。\n\
  - `UpdatePledgeRecord.php`：此脚本由 CiviPledge 使用，用于处理捐赠承诺提醒并更新捐赠承诺状态。当用户向你的组织承诺捐赠时，他们确定其承诺的总价值和捐赠频率。如果已配置，此脚本将在下一次捐赠日期临近时发送捐赠提醒邮件。它还会更新捐赠承诺的状态。每天运行此脚本一次就足够了。\n\
  - `UpdateAddress.php`：CiviCRM 的地理编码功能会在地址创建或编辑时生成纬度和经度值。如果你有尚未地理编码的现有地址，或最近导入了新的地址记录，请使用此脚本批量生成地理编码值。你可以根据需要从浏览器运行此脚本（例如在地址导入后）。如果你定期导入记录，将脚本配置为按周期（例如每周）运行的\
  \ cron 作业可能很有用，或根据需要更频繁地运行。请注意，Google 和 Yahoo 都对每天可通过 API 地理编码的地址数量设置了限制。当数据首次导入系统时，你可能需要运行此脚本数天才能完成全部地理编码。\n\
  - `UpdateGreeting.php`：每个联系人记录都有可用于邮件、邮件发送和其他形式的称呼的问候语值，例如合并信件的导出。当记录通过管理界面创建时，会构造默认问候语值（例如\
  \ 尊敬的史密斯先生）。如果你更改了默认问候语，或最近导入了没有现有问候语值的联系人，请运行此脚本以更新数据库中所有联系人的值。一般来说，除非你定期导入新的联系人记录，否则没有必要通过\
  \ cron 作业运行此脚本。必须将几个变量附加到脚本以控制受影响的记录和字段（例如，在 Drupal 安装上运行的脚本可能如下所示 `http://<drupal_root>/sites/all/modules/civicrm/bin/UpdateGreeting.php?ct=Individual&gt=addressee&name=<username>&pass=<password>&key=<sitekey>`）：\n\
  \    - `&ct=Individual/Organization/Household`（选择其一，必填）：确定将更新哪个联系人类型。\n    - `&gt=email_greeting/postal_greeting/addressee`（选择其一，必填）：确定将更新哪个问候语值。\n\
  \    - `&id=N`：选择问候语或称呼格式的选项值。这是可选的，仅在你希望将字段填充为与配置的默认值不同的问候语格式时使用。\n    - `&force=1`：即使已存在值，也使用默认问候语格式更新所有记录。\n\
  \    - `&force=2`：仅更新那些已设置问候语 ID 但尚未构造值的记录。这对于可能已分配默认 ID 但需要构造问候语文本的联系人记录导入非常有用。\n\
  - `EmailProcessor.php`：使用此脚本配置一个或多个电子邮件邮箱（POP3/IMAP）以定期轮询进行退信处理和电子邮件活动处理。配置为默认的电子邮件账户将用于如本章前面所述的退信处理，并将包括处理基于电子邮件的用户操作，如退订/重新订阅/选择退出。退回的电子邮件将遵循系统配置的规则，将电子邮件账户置于保留状态，让你有机会通过系统审查和更正电子邮件。电子邮件活动处理将轮询收件箱并将电子邮件作为活动记录附加到现有联系人记录（如果系统中找到该电子邮件）或创建新联系人记录（如果系统未找到该电子邮件）。这是一种强大的自动化通信跟踪方式。例如，你可以创建一个特殊的电子邮件账户，让员工在向支持者发送电子邮件时选择性地抄送，从而将与联系人的通信记录附加起来。\n\
  \n\n\n要识别应轮询以将电子邮件作为活动附加的账户，请在 cron 任务后追加 `&emailactivity=1`。此 cron 任务的频率取决于您发送群发电子邮件的频率，以及您希望电子邮件显示为活动的速度。在大多数情况下，按每小时运行一次就足够了。预计该脚本在未来版本中会进行一些修订，以便为两种不同的用途管理多个电子邮件账户。请查看在线文档以了解脚本使用的最新更新。\n\
  \n- `CiviReportMail.php`：CiviCRM 报告可以配置为定期通过电子邮件发送。例如，您可能希望每周一早上将包含上周付款汇总的捐款报告通过电子邮件发送给您的员工会计，或您的会员委员会主席可能希望每月收到一次会员概览报告。使用此\
  \ cron 作业启动邮件发送并配置其发送频率。此 cron 作业与其他作业的工作方式不同——您将为每个报告实例配置一个 cron 作业。参数通过 cron URL\
  \ 传递（除用户、密码和密钥值外）：`.../bin/CiviReportMail.php?sendmail=true&instanceId=3&reset=1`。要确定报告的\
  \ `instanceId`，请访问该报告并记下 URL 中 `/instance/` 后的值。\n\n请注意，其中一些脚本需要在运行前在代码中配置某些值。需要配置的脚本以\
  \ `.txt` 文件保存。您会看到必须配置的部分用注释代码清晰地分隔开。修改文件后，删除 `.txt` 扩展名，使其被识别为 `.php` 文件，然后配置您的\
  \ cron。例如，`UpdateMembershipRecord.php` 文件要求您确定用于发送续费提醒的 FROM 电子邮件地址。\n\n> 自 v3.3\
  \ 起，此脚本使用系统中定义的默认 FROM 电子邮件地址，因此无需手动配置地址。\n\n脚本可以通过 cron 使用 curl 或 wget 运行。请向您的托管服务提供商咨询其首选方法和配置\
  \ cron 的任何特定要求。以下示例可能有所帮助：\n\n- **Drupal:** `curl http://<drupal_root>/sites/all/modules/civicrm/bin/UpdateMembershipRecord.php?name=<username>&pass=<password>&key=<sitekey>`\n\
  - **Joomla!:** `curl http://<joomla_root>/administrator/components/com_civicrm/civicrm/bin/UpdateMembershipRecord.php?name=<username>&pass=<password>&key=<sitekey>`\n\
  \n## 安装、配置和维护\n\n- Drupal: `wget http://<drupal_root>/sites/all/modules/civicrm/bin/UpdateMembershipRecord.php?name=<username>&pass=<password>&key=<sitekey>`\n\
  - Joomla!: `wget http://<joomla_root>/administrator/components/com_civicrm/civicrm/bin/UpdateMembershipRecord.php?name=<username>&pass=<password>&key=<sitekey>`\n\
  \n> wget 方法默认会在每次运行 cron 时在您的服务器上创建日志文件。对于 `civimail.cronjob.php` 等可能频繁运行的脚本，这将很快导致大量文件（尽管大小很小）保存在您的服务器上。确认\
  \ cron 作业运行正常后，使用 `-O - 'URL' > /dev/null` 开关（例如，`wget -O - 'http://...' > /dev/null`）来禁用日志记录。\n\
  \n请注意，所有脚本都可以通过浏览器运行。如果您在配置 cron 作业时遇到问题，请先通过在浏览器地址栏中输入包含用户名、密码和密钥值的 URL 来确认其是否正常工作。如果任何参数不正确，CiviCRM\
  \ 将显示错误。一旦您确信拥有正确的 URL，请继续进行 cron 作业配置。\n\n> 我们刚刚描述的 cron 作业设置是通过 Web 服务器使用 wget/curl\
  \ 处理的。这通常是配置 cron 的更简单方法，因为它不需要命令行/SSH 访问，并且通常得到更广泛的支持。然而，通过 Web 服务器运行 cron 会增加站点负载的开销，并且如果您有大型数据库，更容易受到\
  \ PHP 超时的影响。几个 cron 作业脚本除了我们刚刚介绍的 Web 服务器选项外，还支持通过 shell 处理。如果您熟悉在 shell 中工作、拥有大型数据库，或因运行\
  \ cron 作业而导致性能下降，您应该配置 crons 通过 shell 接口运行。有关如何处理此问题的完整讨论，请参阅以下文档：`http://en.flossmanuals.net/CiviCRM/SystemConfiguration`。\n\
  \n此配置过程的一部分确实比其他大多数区域更技术化。然而，如果您花时间理解概念并在需要时寻求帮助来处理技术细节，您会发现 resulting 功能非常有回报。\n\
  \n与任何事情一样，请务必彻底测试。Cron 作业可以生成发送到电子邮件地址的日志，这是一种确保其正常运行的好方法。您还应安排定期系统审查，以确认您的 crons\
  \ 按预期运行。\n\n## 升级和维护\n\n与任何积极开发的软件项目一样，您应预期需要定期升级到最新修订版和版本，并对系统进行定期维护。提前预测这些需求并相应规划将极大地改善您与\
  \ CiviCRM 的长期体验。\n\n### 版本和修订升级\n\nCiviCRM 项目遵循软件发布的常规术语：\n\n- **Versions:** 代表具有新功能的重要软件发布\n\
  - **Revisions:** 代表次要发布并解决错误、安全和功能修复\n\n核心开发团队每年积极发布两到三个主要版本，并在主要版本之间发布三到四个次要修订。版本号也遵循常规格式：3.2.4\
  \ = 版本 3.2，修订版 4。您可以通过 CiviCRM 网站跟踪特定版本报告的错误和问题。\n\n由于修订通常会纠正错误或解决安全问题，您应理想地在发布后尽快实施。修订通常对数据库结构或数据需要最少的修改；因此遇到问题的潜在风险较小。\n\
  \n在进行任何修订升级之前，请备份您的数据库和文件系统并测试以确保备份文件的完整性。拥有可靠的数据库备份尤其重要，因为如果数据库升级脚本出现任何问题，您需要将数据库恢复到上一个版本。还建议您在实时服务器上实施之前先在开发服务器上执行升级。我们认为对于具有自定义模板和代码的站点，使用开发或暂存服务器是必不可少的。\n\
  \n最后，如果您对 CiviCRM 文件（包括模板 .tpl 和 CSS 文件）进行了任何修改，请确保对您的更改有良好的记录。您需要将更改与新代码库进行比较，可能需要进行调整。这对于主要版本升级尤其正确，因为文件更可能发生重大更改。\n\
  \nCiviCRM 为维护自定义开发工作提供了一些有用的工具：\n\n- **Hooks**: Hooks 是 CiviCRM 代码中的占位符，您可以在其中注入自己的自定义代码。Hooks\
  \ 的好处是您实际上并未修改核心文件——您的自定义代码单独维护并在适当位置注入到代码中。有关使用 hooks 的更多详细信息，请访问：http://wiki.civicrm.org/confluence/display/CRMDOC/CiviCRM+hook+specification。\n\
  - **Override Directories**: Override 目录是位于核心文件外部的文件夹，您可以在其中拥有核心文件的修改版本。CiviCRM 首先检查文件是否存在于\
  \ override 目录中，如果存在，则使用它。Override 目录可用于 PHP 和 .tpl（模板）文件。Override 目录在 **Administer\
  \ | Configure | Global Settings | Directories** 中配置。\n- **extras.css**: `../civicrm/css/`\
  \ 文件夹包含 CiviCRM 使用的所有 CSS 文件。extras.css（默认为空）文件将覆盖其他 CSS 文件，使您能够将样式修改与核心文件分开维护。\n\
  \n### Joomla! 升级\n\nJoomla! 的版本和修订升级遵循与初始安装相同的步骤，并增加一个步骤——将数据库升级到当前 CiviCRM 版本。您必须将新版本上传到服务器上的某个位置（我们建议使用\
  \ /tmp/ 目录），解压它，并使用 **Extensions | Install/Uninstall** 工具中的 **Install from Directory**\
  \ 选项（请参阅上面的 Joomla! 安装步骤以获取更详细的演练）。\n\n触发安装后，您应收到数据库必须更新到当前版本的通知。点击升级后，您应看到升级成功消息、访问\
  \ CiviCRM 仪表板页面的链接（菜单将在此处重建），以及可能有关可能影响您站点的任何配置更改的消息。\n\n如果升级未成功完成，您将需要进行故障排除以确定原因。\n\
  \n一个可能的问题可能是文件系统上的权限限制禁止安装脚本覆盖现有文件。这通常很容易注意到，因为数据库升级脚本不会报告从上一个版本到当前版本的更改，并且页脚区域和\
  \ Joomla! 扩展管理器中的版本信息不会反映新版本。如果发生这种情况，您将需要解决文件系统上的权限问题，或先卸载 CiviCRM 然后重新安装。请注意，卸载/重新安装会保留您的数据，但您需要查看配置设置并必须重置指向\
  \ CiviCRM 页面的任何菜单项。\n\n\n\n\n在数据库升级步骤中，您也可能会遇到问题。对于大型数据库或低端服务器环境，脚本可能会在处理过程中超时，导致数据库只升级了一半。如果发生这种情况，您需要从备份中恢复数据库并重新启动升级。如果问题仍然存在，您可能需要通过\
  \ PHPMyAdmin 或命令行界面手动执行 SQL 脚本。您可以在安装包的 `/civicrm/sql/` 文件夹中找到这些脚本。\n\n如果数据库升级脚本产生带有回溯日志的错误，则很可能是当前数据库中的结构或外键关系存在问题。回溯错误将为问题的来源提供一些指导。您需要在重试安装过程之前解决当前数据库中的问题。\n\
  \n如果您在数据库升级方面仍然遇到问题，请完成以下步骤，以确保当前（升级前）版本的数据库模式结构正确：\n\n- 1. 仅备份当前版本数据库的数据。这可能要求您重新导入在此过程开始时所做的备份，然后仅导出数据（不含结构）。\n\
  - 2. 创建一个新的空数据库。\n- 3. 从安装包中导入当前 CiviCRM 版本的数据库结构。该结构位于 `.../civicrm/sql/civicrm.mysql`。将其导入到干净的数据库可确保您拥有当前版本的正确结构。\n\
  - 4. 将当前版本的数据导入到该干净数据库中。现在，您应该拥有当前站点数据，且结构干净。\n- 5. 现在，使用这个包含干净结构和当前站点数据的新数据库重新运行升级过程。这可能需要在当前生产数据库中转储表，并用这个新数据库中的表替换它们。\n\
  - 6. 继续执行安装和数据库升级。\n\n> 请注意，如果您的站点包含自定义数据，这些数据将存储在自己的表中，不会包含在上一步导入的干净结构中。您需要导入自定义表的结构和数据。\n\
  \n这些步骤应能确保 CiviCRM 数据库升级脚本在当前数据库中使用准确的结构运行。\n\n完成升级后，打开您的 `civicrm.settings.php`\
  \ 文件，并确认站点密钥值完好无损（用于 cron 作业，如前所述）。\n\n## Drupal 升级\n\nDrupal 的升级过程需要多个步骤才能成功完成。与“安装\
  \ CiviCRM”部分中的“在 Drupal 中安装”小节一样，我们将介绍两种升级方式：使用浏览器和 FTP，以及使用 Drush：\n\n- 1. 按照以下步骤将站点设为离线：\n\
  \  - 以用户 1 身份登录。\n  - 转到 **管理 | 站点配置 | 站点维护**。\n  - 点击 **离线**。根据需要查看并编辑 **站点离线消息**。\n\
  \  - 点击 **保存配置**。\n\n- 2. 如果您的首页是 CiviCRM 页面：\n  - 点击 **管理 | 站点配置 | 站点信息**。\n  -\
  \ 记下 **默认首页**，以便在升级后可以恢复，或许可以通过截图方式记录。\n  - 将 **默认首页** 更改为 **node**。\n  - 点击 **保存配置**。\n\
  \n- 3. 如果您正在使用任何 CiviCRM 集成或扩展模块：\n  - 点击 **管理 | 站点构建 | 模块**。\n  - 记下正在使用的集成或扩展模块，也许可以通过截图方式。\n\
  \  - 取消选中所有相关模块的 **已启用？** 复选框（例如，**CiviMember 角色同步**）。\n  - 点击 **保存配置**。\n\n- 4.\
  \ 列出并记下当前启用的命令行脚本：\n\n   ```bash\n   $ ls /path_to_docroot/sites/all/modules/civicrm/bin/*.php\
  \ > /path_to_safe_dir/SavedListOfEnableScripts.txt\n   ```\n\n- 5. 下载新的 CiviCRM\
  \ 文件：\n  - 您可以使用浏览器从 http://sourceforge.net/project/showfiles.php?group_id=177914\
  \ 下载文件，然后使用 SFTP 或 FTP 上传到服务器上的 /path_to_docroot/sites/all/modules 目录。\n  - 或者，使用浏览器从\
  \ http://sourceforge.net/project/showfiles.php?group_id=177914 下载文件以查找当前版本的名称，然后在命令行执行以下操作：\n\
  \n    ```bash\n    $ wget -O /path_to_docroot/sites/all/modules/civicrm.tar.gz http://sourceforge.net/projects/civicrm/files/civicrm-stable/3.2.0/civicrm-3.2.0-drupal.tar.gz/download\n\
  \    ```\n\n- 6. 使用 Drush：\n\n   ```bash\n   $ cd /path_to_docroot/\n\n   $ drush\
  \ civicrm-upgrade --tarfile=sites/all/modules/civicrm-3.2.0-drupal.tar.gz\n   ```\n\
  \n- 7. 使用非 Drush 方法：\n  - 备份您的 CiviCRM 和 Drupal 数据库。\n  - 例如，在命令行中执行，\n\n    ```bash\n\
  \    $ mysqldump -uCivicrmDbUser -pCivicrmDbPassword -h localhost --databases yourDomain_dru\
  \ yourDomain_civ > yourDomain.backup.mysql\n    ```\n\n  - 备份您的 CiviCRM 文件：\n  -\
  \ 例如，在命令行中执行，\n\n    ```bash\n    $ cd /path_to_docroot/sites/; tar -czf civicrm.files.old.tgz\
  \ all/modules/civicrm yourDomain/files/civicrm\n    ```\n\n  - 删除 CiviCRM 核心文件：\n\
  \n    ```bash\n    $ cd all/modules\n    $ rm -rf civicrm\n    ```\n\n- 8. 解压文件，将\
  \ `3.2.0` 替换为上面相应的文件名：\n\n   ```bash\n   $ tar -xzf civicrm-3.2.0-drupal.tar.gz\n\
  \   ```\n\n- 9. 验证默认或 yourDomain.org 站点目录中的文件目录权限是否仍然正确（视情况而定）：\n\n   ```bash\n\
  \   $ chmod -R 777 /path_to_docroot/sites/yourDomain.org/files\n   ```\n\n- 10.\
  \ 通过浏览器运行升级，如下所示：\n  - 以管理员身份登录您的站点：\n  - 如果启用了简洁 URL，请访问 `http://yourDomain.org/civicrm/upgrade?reset=1`；如果未启用简洁\
  \ URL，请访问 `http://yourDomain.org/?q=civicrm/upgrade&reset=1`。\n  - 点击 **立即升级**。\n\
  \  - 如果出现任何问题，请前往相应的 CiviCRM 论坛寻求帮助：`http://forum.civicrm.org/index.php/board,8.0.html`。\n\
  \  - 如果没有问题，点击 **返回 CiviCRM 首页** 以重建 CiviCRM 菜单并进入仪表盘。\n\n- 11. 重新启用 CiviCRM 集成和扩展模块：\n\
  \  - 点击 **管理 | 站点构建 | 模块**。\n  - 在您之前禁用时记下的相应集成和扩展模块旁边勾选 **已启用**。\n  - 点击 **保存配置**。\n\
  \  - 如果您已重新启用 Views 集成：\n    - 点击 **管理 | 站点构建 | Views | 工具**。\n    - 点击 **清除 Views\
  \ 缓存** 按钮。\n\n- 12. 如果合适，将 CiviCRM 恢复为首页：\n  - 点击 **管理 | 站点配置 | 站点信息**。\n  - 在 **默认首页**\
  \ 中，将值更改为升级过程中早先保存的值。\n\n- 13. 将站点恢复为生产状态：\n  - 点击 **管理 | 站点配置 | 站点维护**\n  - 勾选\
  \ **在线**\n  - 点击 **保存配置**\n\n- 14. 检查 CiviCRM 功能，确保其正常运行。\n\n- 15. 重新启用您在升级过程中之前使用并保存的脚本：\n\
  \n   ```bash\n   $ cd /path_to_docroot/sites/all/modules/civicrm/bin\n   $ cat /path_to_safe_dir/SavedListOfEnableScripts.txt\n\
  \   ```\n\n- 16. 对于列出的每个脚本文件，运行类似以下命令行中的命令，删除 .txt 扩展名以重新启用脚本：\n\n   ```bash\n \
  \  $ mv scriptName.php.txt scriptName.php\n   ```\n\n- 17. 如果您遇到困难，请查看 http://wiki.civicrm.org/confluence/display/CRMDOC/Upgrade+Drupal+Sites+to+3.2#UpgradeDrupalSitesTo3.2-UpgradeTroubleshooting\
  \ 上的故障排除建议。如果您仍然遇到问题，请访问 CiviCRM 升级论坛：http://forum.civicrm.org/index.php/board,8.0.html。\n\
  \n完成升级后，您应该考虑是否需要启用任何新组件或配置任何新的 CiviCRM 权限。\n\n\n\n\n## 将安装迁移到新服务器\n\n如果您计划将网站迁移到新的托管环境或从开发服务器迁移到生产服务器，您需要遵循几个步骤，以确保\
  \ CiviCRM 在新环境中正确配置。以下内容代表了迁移网站时需要考虑和处理的重点问题；有关迁移网站的完整步骤讨论可在网上找到：http://wiki.civicrm.org/confluence/display/CRMDOC/Moving+an+Existing+Installation+to+a+New+Server+or+Location。\n\
  \n将网站的文件和数据库传输到新位置后，您必须更新多个文件以反映更改。CiviCRM 在多个位置引用文件根目录和网站的完整 URL。请按照以下步骤操作：\n\n\
  - 1. 使用新的目录和 URL 位置修改 civicrm.settings.php。在 Drupal 安装中，该文件通常位于 /sites/default/civicrm.settings.php。Joomla!\
  \ 维护此文件的两个版本，两者都必须更新（并且引用略有不同）。您可以在以下位置找到它们：/administrator/components/com_civicrm/civicrm.settings.php\
  \ 和 /components/com_civicrm/civicrm_settings.php。\n- 2. 删除缓存的模板文件，其位置为：\n  - Drupal：<drupal-root>/sites/default/files/civicrm/templates_c/*\n\
  \  - Joomla!：<joomla-root>/media/civicrm/templates_c/*\n- 3. 以管理员身份登录您的网站并重置系统配置中的基本\
  \ URL 和资源目录。对于 Drupal 安装，请浏览至 http://<drupal_site>/index.php?q=civicrm/admin/setting/updateConfigBackend&reset=1。对于\
  \ Joomla! 安装，请浏览至 http://<joomla_site>/administrator/index2.php?option=com_civicrm&task=civicrm/admin/setting/updateConfigBackend&reset=1。\n\
  - 4. Joomla! 安装还必须手动修改 /administrator/components/com_civicrm/civicrm/civicrm.config.php，以正确引用管理员文件夹中\
  \ civicrm.settings.php 的位置。\n- 5. 重建 CiviCRM 菜单，其中可能包含完整 URL，现在必须反映新位置：\n  - Drupal：http://<drupal_site>/index.php?q=civicrm/menu/rebuild&reset=1\n\
  \  - Joomla!：http://<joomla_site>/administrator/index2.php?option=com_civicrm&task=civicrm/menu/rebuild&reset=1\n\
  - 6. 如果网站中的任何资源引用完整 URL 或文件位置，您可能需要更新这些资源（例如，如果您的 Drupal 导航菜单包含指向个人资料的链接）。\n- 7.\
  \ 如果您使用覆盖目录（`PHP` 或 `.tpl`），您将需要重置它们以反映新的文件位置。转到 **Administer CiviCRM | Configure\
  \ | Global Settings | Directories**。同时访问 **Resource URLs** 配置页面以确认值设置正确。\n\n完成迁移后，请务必测试网站！点击浏览\
  \ CiviCRM 并确认页面按预期加载，并且 URL 保持在您的新网站上（如果存在过时的链接，可能会将您发送到旧域名或子目录）。\n\n## 系统维护\n\n\
  与任何数据库系统一样，需要定期执行一些维护步骤。本节的重点是 CiviCRM 特定的基本维护步骤。本章不涉及服务器和 MySQL 数据库维护的更广泛主题。根据数据库的大小以及是否使用托管托管服务，您应该了解数据库和托管环境的基本维护步骤。此外，我们不会涉及与可扩展性相关的问题和维护。但是，随着系统的增长，您应该意识到对\
  \ MySQL 数据库性能和大小的影响。\n\n对系统最重要的维护步骤是将其保持更新到最新版本，并且不要在主要版本升级方面落后太多。由于本章前面已讨论了执行此操作的步骤，因此我们在此不详细介绍；我们只是因为其重要性而重复：\n\
  \n- - 修订版发布可能包含与安全相关的补丁，这对于维护安全可靠的数据库至关重要。\n- - 修订版发布可能包含错误修复补丁，这对于维护稳定且完全运行的系统至关重要。\n\
  - - 主要版本发布包含新功能和功能。如果新功能不是您需要或使用的，您可以决定在首次发布时不升级。这是可以的，也很常见。但核心开发团队只会积极开发和修补当前稳定版本，这意味着旧版本中发现的安全或错误问题可能得不到解决。一般来说，您应避免在主要版本升级周期中落后太多。此外，新版本中有大量优秀功能，您会希望从中受益！\n\
  \n另一个重要的定期维护步骤是处理重复的联系人记录，这些记录会以一种险恶的方式悄悄进入您的系统。如果您有多个表单从公共网站收集信息，例如活动注册和捐款表单，则尤其如此。\n\
  \n重复记录通常是由于现有联系人使用替代电子邮件地址或昵称完成在线表单而导致的。由于替代数据，记录与现有记录不匹配，从而导致重复。\n\n幸运的是，CiviCRM\
  \ 提供了一些出色的去重和合并数据库的工具，位于 **Contacts | Find and Merge Duplicate Contacts** 下。这些工具的完整范围将在本书后面详细介绍。就维护考虑而言，您应安排定期对整个数据库进行去重。系统的大小和用途将决定维护应多频繁进行。实施系统后，从上线日期起一个月安排一次初始去重/合并。根据去重规则发现的潜在重复数量，您可以相应地安排下一次维护审查。\n\
  \n> 去重/合并工具的新功能目前正在开发中，其中包括性能改进、白名单管理以及自动化处理（在整个数据库中运行去重规则并自动合并）。请关注 CiviCRM 博客和发布说明以获取更多信息。\n\
  \n在介绍初始系统配置时，我们介绍了在服务器上创建 cron 作业以触发自动事件和操作。在大多数情况下，这些作业将继续运行而无需任何干预或维护。然而，定期检查以确保它们确实正常运行并且脚本已完成是个好主意。在创建\
  \ cron 作业时，您可以选择将日志发送到电子邮件地址。日志的详细信息不多，但会提供脚本已成功完成的验证。您应养成定期检查配置的电子邮件的习惯，以确认脚本正常运行。\n\
  \n这些基本维护步骤应该足以让您的系统平稳运行。\n\n## 制定备份策略和程序\n\n没有关于维护的章节是不完整的，如果不提及备份策略和程序的话。\n\n-\
  \ - **总体而言，数据库备份比文件系统备份更重要：** 为什么？所有您的数据，很可能每天都在更改和处理，都存储在数据库中。文件系统，主要是应用程序代码，很少更改。请理解这是一个一般性陈述。如果您的网站和\
  \ CiviCRM 定期使用文件上传工具，您也希望确保这些工具也能定期备份。这并不是说您不应该制定文件系统备份策略；我们只是建议您可能不需要像数据库那样频繁地备份文件系统。\n\
  - - **备份到多个位置：** 正如您不想仅依赖托管提供商作为唯一的备份解决方案一样，您也不想将办公室局域网或托管服务器作为备份的唯一存储库。在可能的情况下，建立一个系统以至少在两个位置维护定期备份。\n\
  \n使用这些基本规则并投入您的时间和资源，以确保在意外丢失的情况下您的数据得到保存。\n\n> Joomla! 和 Drupal 都有多个扩展程序可生成定期数据库转储，将其保存到服务器，并将压缩文件作为附件发送到配置的电子邮件地址。对于较小的\
  \ CiviCRM 实施，这提供了一种自动生成备份并通过电子邮件“异地”发送的简便方法。考虑创建一个 Gmail 帐户（提供充足的存储空间）来捕获和存储备份。虽然您应定期将备份下载到本地服务器或其他异地空间，但这可以提供一种经济且易于实施的备份计划。此解决方案的一个警告是，您可能无法通过电子邮件发送数据库的加密版本，这意味着您有一定的暴露风险。这应被考虑并纳入您的整体策略和程序中。一些可用的扩展程序是：\n\
  > \n> - Drupal（db）：Backup and migrate 模块：`http://drupal.org/project/backup_migrate`\n\
  > - Drupal（files）：Backup and migrate files 模块：`http://drupal.org/project/backup_migrate_files`\n\
  > - Joomla!（db 和 files）：Akeeba backup：`http://extensions.joomla.org/extensions/access-a-security/site-security/backup/1606`\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_145_0.png)\n\n\n\n\n\n## 第4章：CiviCRM\
  \ 基础：浏览系统和处理联系人\n\n# CiviCRM 基础：浏览系统和处理联系人\n\n到目前为止，你已经完成了分析组织结构和流程与 constituent\
  \ 管理相关的关键步骤。你也已在首选的 CMS 环境中安装并配置了 CiviCRM。此外，你已经了解了本书中将贯穿使用的案例研究。现在是时候熟悉 CiviCRM\
  \ 界面并开始处理联系人记录了。\n\n无论你是否正在实施 CiviCRM，只是想了解更多关于该软件的信息，还是希望更深入地了解其提供的工具，你最终来到这里是因为你代表某种拥有\
  \ constituent 的组织。那些 constituent 可能是会员、志愿者、捐赠者、活动参与者，或是你接触到的个人和组织。然而，在你的核心目的和 CiviCRM\
  \ 的核心中，都是你互动并记录信息的联系人。\n\n联系人记录构成了所有相关记录生成的中心枢纽。你将以各种方式收集、检索和报告这些相关记录，但最终，它们都连接到一个联系人。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_148_0.png)\n\n在本章中，我们将执行以下操作：\n\n- 熟悉\
  \ CiviCRM 界面和导航工具\n- 发现联系人记录，了解如何处理联系人数据，并开始组织和分类我们的记录\n- 了解可用的强大搜索功能\n- 从搜索结果中对多个联系人采取行动\n\
  - 审查替代工作流程选项并对记录进行维护\n\n## 界面介绍\n\n在深入联系人记录之前，让我们简要回顾一下 CiviCRM 界面。导航到你在 Drupal\
  \ 或 Joomla! 中的 CiviCRM 安装，或使用 demo.civicrm.org 提供的在线演示，开始探索。\n\nCiviCRM 界面由三个主要区域组成，即水平导航菜单、左侧边栏和主要内容区域。根据你使用的是\
  \ Drupal 还是 Joomla!，这三个区域看起来会略有不同，但它们本质上是相同的，并提供相同的功能。\n\n本章中的屏幕截图取自 Joomla! 安装。Drupal\
  \ 用户可能会注意到以下差异：\n\n- 水平导航菜单将位于屏幕顶部，取代标准的 Drupal 管理菜单栏（除非你的安装已将其从此默认屏幕位置移开）。\n- 左侧边栏由可配置的块组成。根据你的设置，你可能看不到\
  \ Joomla! 屏幕截图中存在的所有块。\n- Joomla! 具有一致的管理界面，而 Drupal 界面默认继承网站主题。因此，你安装中的颜色、字体、宽度和其他设计和布局元素将反映你的\
  \ Drupal 主题。\n\n如果你希望为管理界面使用不同的主题，你可以使用 Administration theme 模块（http://drupal.org/project/admin_theme）为\
  \ Drupal 管理区域选择一个主题，并使用 CiviCRM Theme 模块（http://drupal.org/project/civicrm_theme）为\
  \ CiviCRM 管理区域选择一个主题。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_149_0.png)\n\n\
  水平导航栏（屏幕截图中标记为 A）是可配置的（来自 Administer | Customize | Navigation Menu），并将反映你已启用的 CiviCRM\
  \ 组件。栏的最左侧部分包含一个快速搜索框，当你开始输入时将填充记录选择。根据你的配置设置，它可能搜索姓名、昵称或电子邮件。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_150_0.png)\n\
  \n左侧边栏（标记为 **B**）将包括一个用于创建新记录的下拉列表、你最近访问的项目的列表、你的联系人仪表板链接，以及一个用于创建新个人记录的简短表单。对于使用\
  \ Drupal 的用户，这些可配置的块可以通过 Drupal **Administer** 菜单访问。主联系人区域（标记为 **C**）是你浏览系统时所有操作发生的地方。\n\
  \n如果你是 CiviCRM 的新手，花时间探索导航菜单并熟悉可用的选项。你会很快发现该软件功能丰富。越快熟悉术语和工具，你就越能利用其提供的强大功能。\n\n\
  ## 联系人\n\n简单来说，联系人是你互动的任何实体。它可能是个人、企业、政府机构、家庭、组织分会、地区或你在系统中收集数据的任何其他人。\n\n### 个人、组织和家庭\n\
  \n由于所有联系人实体并不相同，你与它们互动的方式也会有所不同，因此 CiviCRM 将联系人分为三种主要类型，并可进一步细分为子类型：\n\n- **个人联系人：**\
  \ 这些联系人代表个人。在你处理联系人记录时，你将记录诸如名字、姓氏、出生日期、性别以及仅与个人互动相关的其他类型数据。此外，个人是唯一可能在你的 Joomla!\
  \ 或 Drupal 网站内拥有对应用户账户的联系人类型；毕竟，“企业”不会登录网站，为企业工作的个人才会登录。CiviCRM 提供了工具，允许具有足够权限的个人对他们关联的组织记录采取行动，我们将在后面讨论。然而，了解个人联系人类型的这一独特方面很重要。\n\
  - **组织联系人：** 这些可能代表非营利组织、企业、社区组织、你组织的地区分会或任何其他“有组织的”实体。在处理组织时，你记录的是组织名称、法定名称以及此类型特有的其他数据。\n\
  - **家庭联系人：** 这些联系人也许是最不明显的，因为它们旨在提供将个人记录组合在单一伞下并跟踪可能适用于整个组的信息的能力。这种类型最明显的好处是能够让多个个人共享一个地址。例如，如果联系人搬家，共享地址只需更新一次。如果已婚夫妇及其三个孩子在你的系统中被跟踪，你将希望创建一个家庭记录并录入他们的家庭地址。此外，每个家庭成员的个人联系人记录将表明他们共享家庭地址。除了减少填写地址字段的次数并限制拼写错误的可能性外，你在打印邮件标签或导出列表时还能够将个人组合在单一家庭记录下。这可以节省大量成本，因为你将邮件件数从五个减少到一个，如前例所示。\n\
  \n### 联系人子类型\n\n在大多数情况下，我们刚才描述的三种主要联系人类型足以满足组织需求。当你需要收集和存储这些类型内子组的不同信息或为子组定义特定关系时，你可以考虑将记录类型进一步细分为联系人子类型。每个子类型从三种主要类型之一继承其基本“实体身份”，但在其他方面可以被视为独特。\n\
  \n> 大都会大区食品储藏室协会（FPAGM）为大都会市及其周边地区的食品储藏室提供服务和支持。每天，他们与组织成员的 30 到 40 个食品储藏室互动。此外，他们还与捐赠剩余食品供食品储藏室分发的餐馆、杂货店和便利店互动。\n\
  > 很明显，食品储藏室和捐赠食品的企业是截然不同的实体。他们收集的数据性质、通过邮件和电子邮件的互动方式，以及将运行的报告类型将取决于组织是储藏室还是食品供应商。因此，FPAGM\
  \ 决定在主要组织类型下创建两个联系人子类型。\n\n\n\n\n\n联系人子类型是通过以下路径创建和管理的：**Administer | Option Lists\
  \ | Contact Types**。从此屏幕中，如以下屏幕截图所示，您可以重命名现有类型（包括三个主要类型），创建新类型，并为每种类型分配图标，以便在查看记录时在视觉上区分它们。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_152_0.png)\n\n## 规划您的联系人类型\n\n在配置和构建您的\
  \ CiviCRM 实现时，仔细考虑您如何处理不同类型的联系人非常重要。联系人类型可以被视为系统中最高级别的分类，您所做的选择将在整个系统的其余部分产生影响。\n\
  \n在规划联系人类型时，请考虑以下几点：\n\n- 不要过度使用联系人子类型。您将有大量其他方式对记录进行分类和细分。子类型最适合在联系人之间存在明显差异且触及实体核心性质和角色时使用。\n\
  - 联系人只能分配一个联系人类型；不要创建可能导致子类型之间混淆或重叠的结构。在食品储藏室的示例中，您不希望为食品供应商、杂货店和便利店创建子类型，因为杂货店和便利店都是食品供应商，而这三种子类型会造成不确定性，无法确定某个企业最适合放在哪里。最好为食品供应商创建一个单一的子类型，并使用其他方式（例如标签或自定义字段）在此一种实体类型内进一步分类。\n\
  - 如果您计划从现有数据库迁移数据，请务必花时间将现有记录整理到您计划在 CiviCRM 中使用的类型和子类型中。CiviCRM 提供的联系人导入工具要求您一次导入一种联系人类型。您希望在开始导入之前确定联系人结构并相应地准备导入数据。\n\
  - 联系人子类型的主要好处之一是能够为一种或多种类型创建一组自定义数据字段。自定义数据字段是您创建的用于扩展 CiviCRM 原始提供的核心字段的字段。这是一种有用的规划思路：我是否计划为这种类型的组织收集数据，而我不需要或这些数据明显不适用于另一种类型？如果是这样，可能值得创建一个子类型。\n\
  \n您在创建联系人记录时分配联系人子类型。如果现有联系人未选择子类型，您可以在编辑时指定一个子类型。但是，如果您已选择子类型并存储了与该类型关联的任何自定义数据，您将无法再更改子类型（除非该子类型的全部自定义字段集已被永久删除）。例如，FPAGM\
  \ 创建了一个自定义数据字段来跟踪食品储藏室服务的客户日均数量。该字段附加到食品储藏室子类型，因为它仅与这些联系人相关。如果我们创建一个新的组织记录，将其分配为食品储藏室子类型并保存组织联系人后，该记录现在就锁定在该子类型上；我们不能在以后决定将记录更改为食品供应商子类型。这种系统行为可确保防止意外数据丢失或孤立数据。如果在以后您决定完全删除与子类型关联的自定义数据字段，您将再次能够将联系人重新分配给不同的子类型。基本上，CiviCRM\
  \ 会锁定子类型以防止数据丢失——如果记录中没有存储子类型特定的数据，您可以无风险地更改该值。\n\n在讨论联系人类型时，还有另一个重要的考虑因素需要思考，特别是如果您有一个复杂的组织，有多个管理用户将使用\
  \ CiviCRM。\n\n正如我们很快就会看到的，使用 CiviCRM 的很大一部分工作涉及将相关记录与联系人记录连接起来。例如，您可能会跟踪与个人的电话和会议、企业的捐赠、家庭的会员资格，或为这些联系人中的任何一个开立案件。非常经常地，会在相关联系人之间建立连接，并且在每种情况下，您都必须决定捐赠、会员资格或其他记录应附加到何处。\n\
  \nJohn Smith 是 ACME 便利店的业主，他致电 FPAGM 安排捐赠 50 磅面包供食品储藏室分发。FPAGM 员工将在 CiviCRM 中将其跟踪为实物捐赠。提出的问题是，捐赠应记录在\
  \ John Smith 名下（毕竟他是业主和主要联系人），还是记录在 ACME 便利店名下？\n\n在大多数情况下，相关记录应附加的位置非常明确。然而，在存在混淆和模糊可能性的地方，您希望建立明确的政策和程序来帮助员工确定数据的正确位置。\n\
  \n考虑以下问题：\n\n- 数据的官方“来源”在哪里？如果将来收到类似数据，它将在何处被跟踪？在前面的示例中，我们会将捐赠记录在组织（ACME 便利店）名下，而不是\
  \ John Smith 名下。真正做出贡献的是企业，而不是个人。\n- 谁实际参与了该活动？例如，谁将参加活动，或正式的税务收据应开具给谁？一个常见的混淆领域是组织主办贸易展作为会议的一部分。您的参展商是企业本身还是代表企业的个人？这可能很棘手，因为“企业”不会参加活动，参加的是人，而且可以为将展览相关细节记录在组织记录中提出很好的论据。\n\
  \n无论您如何解决这些潜在的混淆领域，都应努力保持一致性。您输入数据的方式将直接影响您能够从系统中提取的内容。\n\n一旦您定义了联系人子类型（如果有）并思考了将为员工制定的政策，请花时间手动创建几条包含真实数据的记录来测试您的结构和政策。这可能有助于您识别并纠正配置的任何意外后果。\n\
  \n## 核心信息字段\n\n让我们进入一个联系人记录，开始了解这种联系人及其相关记录的理念在 CiviCRM 中是如何体现的。如果这是您第一次使用 CiviCRM，请将光标放在\
  \ CiviCRM 菜单栏左侧的搜索框中，如以下屏幕截图所示，然后单击 Enter 以查看所有记录：\n\n至少，您应该看到一条对应于您网站用户账户的记录（您可能也在左侧边栏最近项目列表中看到过该记录）。进入该记录，或任何其他记录，以查看联系人详细信息。\n\
  \n如您所见，联系人记录通过一系列选项卡显示，对应于您可能收集的不同类型的数据。\n\n> 联系人记录中显示的选项卡取决于两个地方的配置设置：**Enable\
  \ Components**（Administer | Configure | Global Settings | Enable CiviCRM Components）和站点首选项（Administer\
  \ | Configure | Global Settings | Site Preferences）。如果您没有看到预期的选项卡，请确保该组件已启用，并且您已指示它应在联系人记录页面上可见。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_155_0.png)\n\n我们此时不会讨论所有可用的选项卡，而只涵盖那些直接与联系人记录本身相关的选项卡，包括通信跟踪、与其他记录的关系/连接以及核心分类工具。\n\
  \n\n\n\n\n## CiviCRM 基础：系统导航与联系人管理\n\n默认的摘要标签页可能是最重要的标签页，因为它跟踪联系人姓名、通信详情和偏好、地址以及人口统计信息（如果是个人联系人类型）。点击标签页顶部的编辑按钮即可查看联系人所有可用的字段。你会注意到编辑屏幕被划分为字段分组面板，对应于你收集的不同类型的信息。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_156_0.png)\n\n### 联系人详情\n\n联系人详情面板包含有关实体的基本信息，包括以下内容：\n\
  \n- 联系人姓名，包括昵称，这可能作为搜索的替代值很有用。例如，如果你数据库中某家非营利组织的名称通常使用缩写，你可能希望为正式用途拼写出全名，并将缩写放在昵称字段中。它可以随记录一起轻松导出，并在使用搜索栏时找到。\n\
  - 请注意，如果已配置任何联系人子类型，它们将在此区域可供选择（联系人类型下拉菜单）。一旦你选择了子类型并将数据保存到与该子类型关联的任何自定义字段中，更改类型的能力将被锁定。仅列出与主类型对应的子类型。例如，如果你正在查看个人记录，则只有个人子类型可用。\n\
  - 个人记录有一个特殊的当前雇主字段，可在个人与其受雇的组织之间创建关系。当前雇主字段在联系人摘要标签页中突出显示，并且可以轻松地与个人记录一起导出。请注意，如果你在此字段中输入一个不存在的组织名称，将会创建该组织联系人记录。你可以利用这一点来减少数据录入。\n\
  - 通信选项包括电子邮件、电话、即时通讯、网站和 OpenID。这些字段中的每一个都允许你添加多个值并对其进行分类。例如，一个人可能在家有座机和手机号码，在工作有座机、手机和传真号码。或者，某人的记录中可能记录了工作电子邮件和个人电子邮件。如果你的网站不需要跟踪\
  \ OpenID，你可以通过 管理 | 配置 | 全局设置 | 网站偏好 从界面中将其移除。\n- 如果输入了多个通信值，其中一个将被标记为主要值。主要值可以更轻松地导出，无论其类型如何。例如，你的一些联系人可能希望将家庭电话标记为主要，而其他人则希望将工作电话或手机标记为主要。主要标记与记录的来源或类型无关；它只是表示其首选选项。\n\
  - 电子邮件字段有两个额外的复选框是其功能独有的 — **暂停** 和 **批量邮件**。标记为 **暂停** 的电子邮件地址表示它可能是一个有问题的地址。虽然你可以手动将地址标记为此类，但更可能的是该字段因\
  \ CiviMail 退信邮件处理器而被标记为此方式。邮件处理器是一个可选工具，可以设置以检索任何退回（被退回为无法投递）的电子邮件并将其标记为 **暂停**。这为你提供了审查记录并确定问题来源的机会。在标记为\
  \ **暂停** 期间，它们将被排除在任何未来的 CiviMail 邮件之外。批量邮件标志指定一个电子邮件地址作为通过 CiviMail 生成的任何批量电子邮件的首选邮件地址。例如，一个人可能希望将其工作电子邮件指定为主要地址，因为他们希望立即收到直接通信。然而，发送给组织所有成员的每周电子邮件通讯应发送到该人的家庭电子邮件，以免\
  \ clutter 他们的收件箱。\n- 来源字段可用于记录此特定联系人如何参与你的组织，或如何被添加到系统中。如果你的组织的增长主要归功于口碑网络，这可能特别有用。例如，你可能会记录\
  \ Jane Doe 是通过你的董事会成员之一的外联而被介绍给该组织的。\n- 外部 ID 记录来自某个外部来源的唯一 ID。如果你从另一个数据库（如 MS Access）导入记录，你可能希望将联系人的主键\
  \ ID 字段导入此字段。虽然一旦你完全在 CiviCRM 中工作时通常不会使用它，但它提供了一种将记录追溯到先前数据库系统中的原始来源的有用方法。这也可在初始导入过程后用于数据完整性分析。在拥有更复杂\
  \ IT 基础设施的大型组织中，它可能使与其他软件工具的持续数据同步变得更容易。\n\n### 自定义数据\n\n正如我们在 *第 6 章，更好的沟通* 中将看到的，CiviCRM\
  \ 允许你创建自定义字段集并指示它们应内联显示还是在联系人表单的自己的标签页中显示。如果为所有联系人或你正在编辑的特定联系人类型定义了一些自定义内联字段，这些字段将直接出现在联系人详情面板下方。\n\
  \n### 地址\n\n与通信选项类似，你可以创建多个地址集，对其进行分类（家庭、工作等），并将其中一个标记为主要地址。有几件重要的事情需要注意：\n\n- 现有地址可被标记为账单地址，或你可以创建新地址并使用\
  \ **位置类型** 选项将其指定为账单地址。前者如果单个地址用于多种用途则很有用。账单地址将在联系人通过在线信用卡支付捐赠、活动或会员费时使用。\n- 个人联系人可以选择家庭记录的地址作为地址集。为此，开始输入家庭名称并从下拉列表中选择它。如果家庭记录不存在，你可以通过输入所需家庭记录的名称来创建新记录。联系人只能有一个关联的家庭地址。\n\
  - 每个记录对于每种地址类型只能有一个地址集。换句话说，你不能在单个联系人记录中将三个地址指定为 **工作**。这看起来可能有些限制，因为个人拥有两个工作地点或家庭和第二家庭地址并不罕见。然而，当你导出记录时，这种限制的用处变得明显，因为你可以选择仅导出记录的一种地址类型。具有相同类型的多个地址集将需要重复记录或重复字段列，这两种方式都难以处理。如果你需要跟踪多种相似类型的地址，请考虑添加标记为\
  \ **Home1**、**Home2**、**Home3** 等的选项值（**管理 | 选项列表 | 位置类型**）。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_159_0.png)\n\
  \n> 当你首次安装 CiviCRM 时，地址面板包含所有可用字段，包括你可能不希望显示的一些字段。访问 **管理 | 配置 | 全局设置 | 地址设置** 以关闭此面板中的元素。例如，你可能只想跟踪两行地址，因此你将禁用\
  \ **附加地址 2**。同样，你不太可能需要手动编辑记录的经纬度值，因为如果已为你的网站启用地址地理编码，这通常会自动处理。\n\n我们可以在以下屏幕截图中看到\
  \ **地址** 面板：\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_160_0.png)\n\n### 通信偏好\n\
  \n现在你已建立联系人记录并记录了与他们沟通的各种方式，CiviCRM 提供了进一步分类（和限制）你的通信方法的工具。这些偏好分为四个区域：\n\n- 问候语偏好在发送电子邮件、生成标签或导出联系人时使用，可以使用记录中的字段（令牌）或完全自定义。\n\
  - **隐私设置** 显示个人是否更喜欢不通过某种方式被联系。**隐私** 设置不会锁定对通信详情的访问；它们只是允许 CiviCRM 用户快速看到联系人已请求不以所选方式被联系的工具。如果被选中，隐私设置会在\
  \ **联系人摘要** 标签页中相应方法旁边生成一个醒目的“停止”图标。\n- 同样，**首选方法** 用于你的内部目的，以便促进和改善与联系人的沟通。\n\n\
  \n\n\n\n-   电子邮件设置提供了一个退出选项标志和格式偏好：\n    -   退出选项标志（**禁止群发邮件（用户选择退出）**）符合美国的**反垃圾邮件法案（CAN-SPAM\
  \ Act）**，通常仅在联系人明确表示不希望接收群发邮件时使用。通过 CiviMail 生成的群发邮件必须包含退出代币（要么将用户引导至一个可供其选择退出的网页，要么提供一个用于自动处理的电子邮件地址）。您很可能很少会通过界面选择该选项。如果您这样做了，请注意，这将自动将该用户从\
  \ CiviCRM 生成的任何邮件中移除。\n    -   **电子邮件格式**字段用于确定用户偏好接收文本还是基于 **HTML** 的电子邮件。默认值为**两者**，这意味着使用\
  \ HTML 和文本版本生成的电子邮件都将发送给联系人。请注意，用户的电子邮件客户端设置将决定实际显示哪一个版本。您可能需要定期监控此字段，以确定用户是否明确要求通过文本接收电子邮件，因为这将要求您生成两种形式的电子邮件以便通过\
  \ CiviMail 发送。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_161_0.png)\n\n## 人口统计信息\n\
  \n个人联系记录将包含一个**人口统计信息**窗格，其中可以记录**性别**、**出生日期**和**逝世日期**。在进行搜索以导出邮件列表联系人时，您可以排除已故联系人，以确保他们不会收到邮件。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_161_1.png)\n\n## 删除联系人\n\n在联系人摘要视图中，您会注意到选项卡式界面上方和右侧有一个**删除**按钮。CiviCRM\
  \ 具有联系人回收站功能；当您单击此按钮删除联系人时，它并不会将其或任何相关记录从系统中完全移除，而是将其标记为已删除。已删除的记录可以使用高级搜索工具进行搜索；在**基本条件**窗格底部附近可以找到**在回收站中搜索（已删除的联系人）**选项。搜索到已删除的联系人后，您可以将其永久删除或恢复。\n\
  \n此功能是保护数据免遭意外删除的有效方式。但是，与任何安全网一样，您不应过度依赖它。切勿在删除记录时怀有稍后恢复它的意图。已删除的记录应被视为完全删除（并且在生成搜索和报告时，它们看起来就像被系统实际删除了一样）。\n\
  \n请注意，您可以通过**管理 | 配置 | 全局设置 | 其他设置**禁用系统中的回收站功能。\n\n## 标签和分组\n\n您可能已经注意到，我们跳过了联系人摘要编辑屏幕底部的**标签和分组**窗格。这些记录在**查看联系人**屏幕上也有自己专门的选项卡，因此我们将结合其各自的选项卡来了解它们提供的功能。\n\
  \n**标签和分组**选项卡提供了两种强大的机制来对联系人进行分类和组织。但是，这两种机制中哪一种最适合特定需求，并不总是显而易见的。\n\n### 标签\n\n\
  标签提供了一种跨所有联系人类型的层级分类机制。它们是一种*分类*机制——您使用标签来记录有关联系人性质的信息，例如他们提供的服务类型、拥有的技能、感兴趣的领域或其他此类信息。它们可以是分层的；您可以构建带有类别和子类别的标签结构。在联系人摘要编辑屏幕上查看和选择标签时，它们会以简单的列表形式出现，并带有缩进以可视化层次结构。在专用选项卡中查看它们会显示类似的结构，但使用可展开/折叠的树形工具来更好地揭示层次结构，并允许您快速浏览该结构。\n\
  \n标签应用于所有联系人类型，这意味着您不能创建特定于单一联系人类型（例如组织）的标签集。请记住这一点，因为如果您可用的选项需要特定于联系人类型或子类型，您可能需要考虑其他分类工具，例如分组或自定义字段。标签也可以创建并应用于联系人、活动和案例；在创建标签时，您可以选择标签的用途。\n\
  \n除了层级标签结构之外，CiviCRM 还提供了创建自由格式标签集的工具。此标签功能与层级树在以下几个方面有所不同：\n\n-   层级树显示所有可用选项的完整列表，您可以通过复选框进行浏览和选择。\n\
  -   标签树中可用的标签必须使用**管理标签**工具创建，然后您才能在联系人记录中浏览和选择它们。\n-   标签集提供一个文本框，您可以在将标签分配给联系人/活动/案例时创建标签，或者用于搜索现有标签并分配。当您在标签集字段中开始输入时，CiviCRM\
  \ 将动态搜索与现有标签的部分匹配，然后您可以选择这些标签。如果不存在现有标签，您将即时创建新标签。例如，如果我开始输入“trans”，它可能会拉出一个名为“transit”的现有标签；如果我继续输入“transp”，我可以继续创建一个名为“transportation”的新标签，依此类推。\n\
  -   自由格式的标签集标签也可以使用**管理标签**工具创建和管理；您只需将标签集视为父标签即可。通常，您不会使用标签管理工具为标签集创建新标签，因为自由格式标签的主要优点是在处理记录时能够动态创建新标签。但是，您可能会发现有时清理这些标签很有帮助，因为它们更容易变得杂乱。\n\
  -   总的来说，层级标签更适合以非常有条理的方式对记录进行分类，而标签集则在您想要快速轻松地列出关于记录的关键词或其他平面列表属性时非常有用。\n\n如前所述，在将层级标签用于记录之前，您必须在系统中定义它们：**管理\
  \ | 选项列表 | 标签（类别）**。使用**新建标签**按钮创建新标签，使用**编辑/删除**链接管理现有标签。请注意，虽然管理页面按字母顺序列出所有标签，但**父\
  \ ID**列将帮助您跟踪结构的层次。\n\n> FPAGM 使用标签来跟踪联系实体的服务类型和性质。这包括几个子类别，以进一步细化所收集的关于联系人的信息。他们定义了一个单一的“关键词”标签集，以在层级结构之外进一步对记录进行分类。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_164_0.png)\n\n联系人记录中的**标签**选项卡提供了最用户友好的标签选择界面。虽然您也可以选择使用**联系人编辑**屏幕来管理联系人的标签，但由于页面上的其他元素，该界面会受到更多限制。如果您的系统中有很长的层级标签列表，这一点尤其明显。**标签**选项卡以更具视觉吸引力的方式呈现层级表单，并允许您动态展开/折叠父标签以查看子选项。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_164_1.png)\n\n为了帮助您轻松了解联系人如何被打上标签，CiviCRM\
  \ 在**摘要**屏幕上提供了所有已选标签的逗号分隔列表，如下面的截图所示：\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_165_0.png)\n\
  \n### 分组\n\n分组只是记录的集合，可以静态或动态定义。静态分组有时被称为常规分组或简称为分组，而基于动态条件的组则称为智能分组。\n\n将静态分组想象为一个容器，您可以手动将记录放入其中。没有特定标准来决定哪些人成为静态分组的一部分——他们是根据自己或您的偏好被添加或移除的。例如，您可以创建一个“董事会”分组，并将系统中当前为该组成员的九个联系人添加进去。静态分组另一个常见用途是选择加入邮件列表。当人们访问您的网站时，您可以提供注册接收定期电子邮件简报的选项。注册表单（和取消订阅工具）将使访问者能够自行添加或移除他们自己的简报分组。\n\
  \n相比之下，智能分组是根据您定义的条件生成的，因此本质上是动态的。例如，您可能有一个分组，检索特定区域内的所有联系人，而您定义的条件是特定的城市、州或邮政编码邻近范围。智能分组存储的是条件，而不是某个时间点的静态联系人列表，因此它们在您的数据库中充当已保存的查询。如果您稍后返回查看智能分组中的联系人，CiviCRM\
  \ 将拉取一份符合所定义条件的最新联系人列表。\n\n虽然您通常会创建一个静态分组，然后将记录添加到这个容器中，但智能分组是从搜索结果生成的。在运行联系人搜索后，您可以对结果执行某些操作，包括将其保存到智能分组中，以便日后轻松快速地检索。稍后检索已保存的智能分组时，您将有机会调整条件并更新设置。智能分组还具有手动添加和删除联系人的灵活性。因此，可以将不符合条件的人添加进来，也可以将符合条件的人排除在外。\n\
  \n\n\n\n\n## 使用分组\n\n很高兴你拥有将联系人收集并组织到分组中的工具，但你如何在系统中实际使用它们呢？以下是分组最常见的用途：\n\n- 静态分组对于你希望隔离并重复使用但不符合特定条件的记录组很有用，例如董事会和邮件列表示例。静态分组也可以在导入记录时创建，这可能是一种跟踪记录来源的有用方法。例如，如果你从第三方组织收到一份潜在捐赠者名单，你可能会导入它们并将它们添加到带有组织名称和导入日期的分组中。\n\
  \n- 智能分组通常会为你定期进行的保存搜索而创建。为什么要为你定期审查的记录集在高级搜索中反复选择多个条件选项呢？运行你的搜索，将结果保存到智能分组中，每当你需要检索记录时，你获取的就是符合你定义条件的准确、实时记录列表。\n\
  \n- Drupal 和独立实现可能会将分组用于访问控制列表（ACL）。CiviCRM 提供了大量精细的控制来限制谁可以查看、编辑、删除或访问系统中的某些功能。这些部分通过\
  \ ACL 类型的分组来控制。请注意，由于 CMS 的限制，Joomla! 实现目前尚不提供 ACL 功能，尽管预计在 Joomla! 1.6 发布时未来会开发此功能。\n\
  \n- 在定义分组时，你可以将其指定为邮件列表，这意味着它将可供 CiviCRM 中的群发邮件工具使用。批量邮件流程在很大程度上依赖于分组来生成收件人列表，提供根据联系人的分组状态包含或排除联系人的能力。\n\
  \n- 配置文件，即可向网站访客公开为搜索/列表表单、数据收集/编辑表单或只读页面的字段集合，可以根据分组状态限制其显示的记录。例如，你可以在网站上创建一个搜索和列表配置文件作为会员目录。然而，你希望确保只有状态良好的会员才属于搜索结果，因此你首先创建一个智能分组，其条件为会员状态\
  \ = 当前，以便动态检索你的会员。在配置配置文件时，你将搜索结果限制为该分组，从而创建你的在线会员目录。\n\n联系人记录中的关系标签列出了所有活动（当前）和非活动关系。非活动关系可能发生在现有关系被手动禁用时（例如，如果公司的员工休假或被解雇，并且你手动将关系标记为禁用），或为关系记录结束日期时（例如，你创建董事会成员关系并根据两年任期记录开始和结束日期）。默认情况下，假设关系没有设定的结束日期。\n\
  \n输入结束日期或禁用关系而不是删除它们，提供了一种跟踪联系人在各种身份中的参与历史的有用方法。例如，通过查看当前和非活动的 **Employee of** 关系，可能有助于了解个人的就业历史。你可能会使用此信息来识别主要捐赠者的影响者，或找到可能促进潜在战略合作伙伴关系的社交网络。\n\
  \n在联系人记录中处理关系之前，你应查看 CiviCRM 首次设置时创建的现有关系类型，并确定是否需要创建其他类型。\n\n为此，请前往 **Administer\
  \ | Option Lists | Relationship Types.**\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_171_0.png)\n\
  \n| Relationship A to B | Relationship B to A | Contact Type A | Contact Type B\
  \ |\n|---|---|---|---|\n| Case Coordinator is | Case Coordinator | Individual |\
  \ Individual |\n| Case Manager is | Case Manager | All Contacts | All Contacts |\n\
  | Child of | Parent of | Individual | Individual |\n| Employee of | Employer of\
  \ | Individual | Organization |\n| Head of Household for | Head of Household is\
  \ | Individual | Household |\n| Household Member of | Household Member is | Individual\
  \ | Household |\n| Sibling of | Sibling of | Individual | Individual |\n| Spouse\
  \ of | Spouse of | Individual | Individual |\n| Supervised by | Supervisor | Individual\
  \ | Individual |\n| Support Staff is | Support Staff | All Contacts | All Contacts\
  \ |\n| Volunteer for | Volunteer is | Individual | Organization |\n\n此表列出了每个方向的关系标签（从\
  \ **A to B** 和 **B to A**），以及连接每一侧允许的联系人类型的限制。\n\n如果此结构令人困惑，请在查看和创建关系时使用以下语句，将 A\
  \ 和 B 替换为你的标签：\n\n- [Contact Type A] is a/an [Relationship A to B] a/an [Contact\
  \ Type B]\n- [Contact Type B] is a/an [Relationship B to A] a/an [Contact Type A]\n\
  \n同时，查看一个非常清晰的现有关系类型，例如雇主/雇员，以了解标签文本的使用方式也可能很有用。使用上述语句与雇主/雇员关系，我们将看到：\n\n- [an Individual]\
  \ is an [Employee of] an [Organization]\n- [an Organization] is an [Employer of]\
  \ an [Individual]\n\n请注意，如果你在创建关系时选择了其中一个主要联系人类型（Individual/Organization/Household），该关系将可用于所有相关子类型。然而，如果你为关系的一侧选择了子类型，它将仅可用于该特定子类型。\n\
  \n## 添加关系\n\n一旦你配置了关系类型，你就可以开始在联系人之间建立连接。导航到联系人记录的 **Relationship** 标签以查看、创建和编辑其连接。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_172_0.png)\n\n> 可以从个人记录的摘要编辑屏幕构建两种关系：\n\
  > \n> - **Employee** of 关系将在你填写当前雇主字段时构建\n> - **Household Member** of 关系将在你指示个人应共享家庭记录地址时构建\n\
  \n关系创建过程包括两个步骤，即根据所选类型选择相关记录，并填写关系详细信息。\n\n除了基本的开始/结束日期、描述和备注外，还有一个通过关系处理的 basic\
  \ 权限功能。使用提供的两个选项，你可以允许关系的任一侧查看和修改另一侧的联系人详细信息。\n\n这在何处发挥作用？CiviCRM 有一个特殊的联系人摘要页面，称为联系人仪表板，可以向网站用户公开。仪表板提供了用户与组织互动的快照，包括会员历史、活动注册、捐赠历史和分组成员资格。此外，仪表板可能包含为个人定义的关系列表，如果通过此表单获得权限，它将允许已登录用户编辑相关记录的详细信息。\n\
  \n此功能的一个常见用例是当你希望某些管理联系人（个人）能够编辑其雇主记录时。由于组织不会访问网站（人会），你需要允许某些个人有权编辑组织记录。其他示例包括允许父母编辑其子女的记录、教师编辑其学生的记录，或家庭成员编辑家庭记录。\n\
  \n\n\n\n\n## Activities\n\n到目前为止，我们主要关注记录描述联系人记录的数据。然而，CRM 的强大之处在于能够跟踪并建立与联系人的持续关系。我们需要的不仅仅是一个华丽的地址簿——我们需要能够帮助讲述我们捐助者故事的工具：我们与他们进行过何种沟通，他们选择了以何种方式在财务上或通过积极参与来支持组织，他们已成为成员多久，我们如何帮助解决他们向我们提出的问题和疑虑，以及其他此类互动。\n\
  \n这种故事得以保存的一个关键方式是通过活动——与捐助者之间的往来通信记录，或代表捐助者采取的行动。\n\n活动记录将以两种方式创建：由系统在与其他流程结合时自动创建，或由与记录一起工作的员工手动创建。\n\
  \n某些活动记录，特别是自动电子邮件，是在系统的其他部分触发与联系人通信时创建的。例如，如果会员在线续费会员资格，表单将通过电子邮件向他们发送收据，详细说明会员记录续费、付款以及作为流程一部分完成的任何其他数据字段。除了此交易创建的会员和捐款记录之外，CiviCRM\
  \ 还将电子邮件收据记录为活动，为您提供发送给联系人的每一次通信的完整图景。其他自动活动示例包括：\n\n- Contribution receipts\n-\
  \ Pledge receipts\n- Membership status updates\n- Membership renewal reminder e-mails\n\
  - Bulk e-mails\n\n具有适当权限的用户可以手动创建某些活动记录。最常用的是电话交谈、会议或手动生成的电子邮件记录（即在系统外部生成的电子邮件）。创建活动记录时，您可以将其标记为已完成（过去通信的记录），或将其安排在未来，在这种情况下它会成为日历待办事项。此外，活动可以分配给其他用户，这为在办公室内部管理员工之间的通信提供了有用的工具，同时将分配直接链接到捐助者记录。\n\
  \n## Notes\n\n不可避免地，您与捐助者的互动将包括收集他们生活中的个人细节，遇到影响记录保存方式的独特情况或环境，或有关他们与组织持续参与的一般信息。所有这些信息都可轻松存储在备注中。\n\
  \n通过联系人记录上的选项卡访问，备注提供了记录捐助者一般信息的简单方法。每条备注都包括主题行、描述，并在创建时加上时间戳。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_176_0.png)\n\
  \n> 请注意不要将备注用作信息的大杂烩，而这些信息更适合存储在其他地方。特别是，请确保您的用户理解活动应用于与捐助者的通信记录，而备注更适合用于有关联系人的杂项信息，例如不适合现有联系人字段的个人细节。\n\
  \n## Search\n\n了解并熟悉联系人记录界面固然重要，但我们也需要能够快速在系统中找到记录。我们在探索 CiviCRM 时首先查看了导航栏中的快速搜索字段。Search\
  \ | Find Contacts 扩展了此功能，允许按联系人类型、组或标签进行筛选。除了这种基本搜索之外，CiviCRM 还提供了四种强大的搜索工具，以及通过报告系统提供的额外多样化功能。\n\
  \n### Quick search\n\n快速搜索位于导航菜单中，最适合在您查找特定联系人时使用。输入到此字段中的文本将搜索电子邮件地址（默认）和联系人姓名（个人按姓名排序，家庭按家庭名称排序，组织按组织名称排序）。在您开始输入时，搜索将返回部分匹配的结果。您可以选择配置该工具以使用完全通配符搜索或仅末尾通配符（Administer\
  \ | Configure | Global Settings | Search Settings）。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_177_0.png)\n\
  \n完全通配符搜索将在姓名或电子邮件字段的任何部分查找输入的文本。例如，输入“john”将同时找到 John Smith 和 Mark Johnson。关闭通配符搜索后，搜索“john”将仅找到\
  \ Mark Johnson，因为排序姓名字段默认构造为“lastname, firstname”。完全通配符搜索在小型数据集中非常有用，因为它提供了更大的灵活性。对于大型数据库，您通常希望将其关闭，因为结果集会变得冗长且难以处理。\n\
  \n如果关闭了完全通配符选项，您仍可使用百分号（%）启动通配符搜索。您甚至可以在搜索词中间使用通配符值；例如，J%on 将产生 John 以及 Jones。此“%”字符与搜索字符串中出现的任何位置的任意数量字符匹配。\n\
  \n### Basic search\n\n单击 Search | Find Contacts 会弹出一个表单，允许您按姓名或电子邮件搜索并按联系人类型、组和标签筛选结果。输入的筛选条件越多，匹配数越少，因为结果必须满足所有输入的筛选条件。与联系人快速搜索一样，您可以使用通配符来扩展搜索方式。\n\
  \n### Advanced Search\n\n不要让“高级”这个词吓到你——它是对该工具强大功能的评论，而不是对使用 CiviCRM 所需经验的陈述。事实上，高级搜索的强大之处在于其灵活性和易用性。要访问此工具，请导航到\
  \ Search | Advanced Search。\n\n高级搜索提供了进入系统中几乎每个字段的窗口，按其类型分组。使用分面板界面，您可以在地址字段、捐款、会员、活动、自定义字段以及您管理的任何其他类型数据之间构建搜索条件。\n\
  \n高级搜索工具的唯一重要限制是，跨字段的多个条件始终由 AND 运算符连接。如果您熟悉任何形式的查询构建，您将认识到使用 AND 与使用 OR 连接多个条件之间的区别。AND\
  \ 连接是排他的——随着您添加更多条件，结果列表会变小，因为记录必须满足所有提供的条件，因此更多记录被排除。OR 连接是包容性的——添加条件会扩展结果列表，因为满足任何单个条件的记录都将被包含。\n\
  \n高级搜索中对此规则的唯一例外是作为多选选项列表呈现的字段（包括一组分组复选框）。这些将在该字段内使用 OR 连接。例如，选择多个标签将产生匹配其中任何标签的结果。\n\
  \n请注意，少数特殊字段会反转正常的选择逻辑。例如，选择任何隐私选项将排除满足该标准的记录，而不是包含它们（反映了这些字段的正常使用）。如果您希望检索具有特定隐私设置的联系人列表，请选中标题为\
  \ Include contacts who have these privacy option(s) 的选项以反转默认效果。\n\n一如既往，内联帮助文本（问号图标）将为非标准或可能令人困惑的字段提供解释和示例。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_178_0.png)\n\n## CiviCRM Basics: Moving\
  \ through the System and Working with Contacts\n\n构建器让您可以构建多个条件集。每个集合内的条件由 AND 连接。集合之间用\
  \ OR 组合。这使您可以创建排他性（AND）条件并将其与包容性（OR）条件集连接。\n\n搜索构建器可通过 **Search | Search Builder**\
  \ 访问。\n\n> FPAGM 计划在 Metropolis 周边地区和城市周边的郊区对食品供应商进行更多区域外展。外展将重点放在在困难的冬季月份，当食品储藏室的需求显著增加时，争取更多的食品捐赠支持承诺。\n\
  > \n> 执行董事已确定以下标准用于初始外展信函：\n> \n> - All food supplier businesses in Metroville\n\
  > - Food suppliers in Metropolis with a postal code of 10255 who have donated more\
  \ than $500 at one point\n> - Affiliate members with a postal code of 10254\n\n\
  搜索构建器中的 resulting 配置将如下图所示（OR 和 AND 文本已添加以作说明）：\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_180_0.png)\n\
  \n\n\n\n\n正如你所见，我们的筛选条件由三组标准组成，这些标准组合在一起得出结果。只要满足其中任意一组标准（其中两组包含多个限制性标准）的食品供应商或组织都将被包含在结果中。\n\
  \n使用搜索构建器时需要注意以下几点：\n\n- 搜索条件可以基于联系人（包括类型和子类型特定字段）、捐赠、会员、活动参与者、承诺、会员、案例、活动和资助字段构建。\n\
  - 以下比较运算符用于构建条件语句。运算符定义了条件的逻辑规则，决定了输入的值将如何使用所选字段进行处理。\n  - `=` 表示“等于”，代表完全匹配。\n\
  \  - `!=` 表示“不等于”。\n  - `>` 表示“大于”，仅应与数值字段一起使用，例如捐赠金额。\n  - `<` 表示“小于”，仅应与数值字段一起使用。\n\
  \  - `>=` 表示“大于或等于”，仅应与数值字段一起使用。\n  - `<=` 表示“小于或等于”，仅应与数值字段一起使用。\n  - `IN` 用于组、标签和其他\
  \ ID 列表。值字段可能包含用逗号分隔（无空格）的 ID 列表，并用括号括起来，例如 `(1,3,9)`。要检索 ID 值，请访问 **Contacts |\
  \ Manage Groups/Manage Tags** 并记下 ID 列的值。在组或标签中工作时（例如编辑模式），您也可以通过在 URL 中查找 ID 或\
  \ GID 数字来检索 ID。\n  - **LIKE** 表示“等于”，但与等号不同，您可以使用通配符与 **LIKE** 创建模糊条件。\n  - **IS\
  \ NULL** 表示该字段为空，不包含任何值。\n  - **IS NOT NULL** 表示该字段不为空。\n- 若干字段需要独特的格式：\n  - **State**\
  \ 和 **Country** 字段可接受完整的州/国家名称（例如 **United States**），或选项值的 ID（**1228**）。\n  - 日期应使用以下格式：`YYYYMMDD`。注意没有空格或符号，例如\
  \ 2010 年 3 月 16 日 = `20100316`。\n- **Yes/No 字段的值应分别为 1/0（Yes = 1；No = 0）**。\n- 多选自定义字段应使用在创建字段时指定的选项值作为搜索条件，而不是其标签。存储在数据库中的值可能与显示给用户的标签不同。如果需要，请重新访问您的自定义数据配置，以确保您检索到正确的值。\n\
  - 一些字段，例如 **Membership Type**，需要类型 ID 值，而不是类型名称。如果您尝试运行搜索并收到输入有效值的警告消息，很可能是因为该字段需要选项\
  \ ID 号。\n\n## 理解联系人搜索与组件搜索的区别\n\n到目前为止我们审查过的所有搜索工具都是基于联系人的。无论您选择什么条件，搜索都会返回联系人列表。\n\
  \n如果我需要一份过去六个月内超过 $500 的所有捐赠清单怎么办？如果 John Doe 在该期间捐赠了三次超过 $500，我希望看到他被列出三次；他是常客这一事实在此上下文中是很重要的信息。然而，通过\
  \ **Advanced Search**（我可以在其中访问捐赠字段）或 **Search Builder**（同样可以使用捐赠字段）进行搜索将产生一份没有重复值的联系人列表。\n\
  \n在整个 CiviCRM 中，通常有两种“镜头”或视角来搜索和查看记录——您可以搜索联系人，也可以搜索其相关记录。我们将“相关记录”搜索称为组件搜索。这些工具可通过主\
  \ **Search** 菜单访问（在第二个选项块中指定）或在各自的主菜单项中访问（例如，**Find Participants** 位于 **Events**\
  \ 下）。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_183_0.png)\n\n考虑到前面的示例，在 **Advanced\
  \ Search** 下搜索此条件将产生每个联系人一条记录。使用 **Find Contributions** 表单进行此搜索将产生三条记录，每笔捐赠一条。\n\
  \n当我们使用一些组件时，我们将进一步研究这些工具。现在，重要的是要理解搜索方式的差异以及返回的结果类型。\n\n## 自定义搜索\n\n如果您仍然发现需要进行复杂的搜索，而上述工具无法完成，请查看\
  \ **Search | Custom Searches....** 中的自定义搜索。\n\n自定义搜索结构是为开发人员创建的，以便构建定制化、复杂的搜索选项和结果列表，这些列表无法通过通用表单轻松实现。说实话——并非所有可能的搜索选项都能挤进单一界面，而不造成平均用户无法使用的复杂性和混乱。CiviCRM\
  \ 创建了自定义搜索结构，为开发人员提供了一个界面，以满足这些特殊需求，而不是让您直接在数据库中工作。\n\n现有的自定义搜索表单经常在改进，并且 CiviCRM\
  \ 开发社区会不断添加新的表单。请理解，要实际*创建*自定义搜索表单，必须具备开发技能（以及数据库和代码的访问权限）。然而，一旦构建，具有足够权限的用户可以访问表单并运行搜索。如果您构建了自定义搜索表单，请考虑将其贡献回项目，以便纳入未来版本。\n\
  \n## 搜索结果操作\n\n到目前为止，我们已经掌握了联系人记录，可以在系统中导航，现在可以尽情进行疯狂的搜索。然而，现在您已触发搜索并获得了所需记录，下一步该做什么？\n\
  \n有时，您会进行搜索以查找特定记录，然后导航到联系人并对其数据进行一些操作。然而，更常见的是您搜索一组记录，并希望对全部或部分结果列表执行批量操作。\n\n\
  CiviCRM 通过操作下拉选项实现这一点。进行搜索后，选择 All X records 单选按钮或 Selected records only（如果您想手动从结果中选择要操作的记录）。这将启用操作下拉列表。选择所需操作并单击\
  \ Go 继续。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_185_0.png)\n\n从选项列表中可以看出，您可以采取的操作不胜枚举。我们将简要回顾它们，按操作类型分组，而不是按字母顺序排列。\n\
  \n### 邮件操作\n\nCiviCRM 提供了两个对邮寄有用的操作，两个对电子邮件有用的操作：\n\n- Mailing Labels: 使用 Administer\
  \ | Configure | Global Settings | Address Settings 中设置的邮件标签选项将联系人打印到 PDF。\n\n###\
  \ CivicCRM Basics: Moving through the System and Working with Contacts\n\n- **Print\
  \ PDF Letter for Contacts:** 使用此选项可直接从系统中生成合并信件。您需要创建一个基本模板，模仿您文字处理软件中的布局。创建后，您可以生成信件，插入占位符标记作为合并字段，将信件保存为模板，并打印为\
  \ PDF 文件。\n- **Schedule/Send a Mass Mailing:** 如果 CiviMail 已启用并配置，您可以直接从搜索结果生成批量邮件。选择此选项将触发批量邮件向导，引导您完成每个步骤。\n\
  - **Send Email to Contacts:** 如果您处理的是少量记录且不需要 CiviMail 批量邮件的全部功能，您可以使用此选项简单地向联系人发送基本电子邮件。\n\
  \n## 组和标签操作\n\n在找到并选择了若干联系人后，您可能希望能够方便地稍后检索或操作这些记录。\n\n- **Add Contacts to Group:**\
  \ 将所选联系人添加到组中\n- **Remove Contacts from Group:** 从组中删除所选联系人\n- **New Smart Group:**\
  \ 将您的搜索保存为动态智能组，以便以后使用相同条件检索\n- **Tag Contacts:** 向所选记录添加标签\n- **Untag Contacts:**\
  \ 从所选记录中删除标签\n\n## 添加关系操作\n\nCiviCRM 允许您从标准搜索结果列表中向联系人添加两种类型的关系：\n\n- **Add Contacts\
  \ to Household:** 使用为家庭定义的其中一种关系类型创建与所选家庭记录的关系\n- **Add Contacts to Organization:**\
  \ 使用为组织定义的其中一种关系类型创建与所选组织的关系\n\n## 添加相关记录操作\n\n对多个联系人的几个操作涉及为每个所选联系人创建相关记录：\n\n\n\
  - **为联系人记录活动：** 创建一条活动记录，并同时关联多个联系人。该选项的一个有用用途是记录邮件发送。假设您运行搜索并想要导出记录以交付给邮件处理机构。运行导出后，向相同的结果列表添加一条活动，以记录邮件的详细信息，例如“志愿者募捐信”，并附上用于邮寄的文档副本。\n\
  - **将联系人添加到活动：** 为选定的联系人注册一个活动。此操作的唯一限制是，您必须选择一组注册选项来应用于所有选定的联系人。您也无法批量记录付款详情。\n\
  \n## 更新联系人操作\n\n有几种操作直接作用于联系人记录，允许您合并、更新、删除或取消删除它们：\n\n- **通过配置文件批量更新：** 配置文件是您在系统中定义的字段集合。您可以使用配置文件同时编辑多达100条联系人记录。\n\
  - **合并联系人：** 使用选定的记录触发去重/合并工具。您将被重定向到一个页面，在那里您可以查看记录并选择将从一条记录合并到另一条记录的字段。\n- **删除联系人：**\
  \ 将联系人移至回收站（如果系统启用了此功能）。\n- **永久删除：** 从系统中彻底移除联系人。\n- **恢复联系人：** 如果您搜索了已删除（已放入回收站）的联系人，可以使用此选项批量恢复它们。\n\
  - **解除电子邮件暂停：** 移除选定记录的“暂停”电子邮件状态。\n\n## 导出/映射操作\n\n以下两个操作支持对联系人记录进行某些处理，而不是更改它们：\n\
  \n- **映射联系人：** 如果您的站点启用了地理编码，您可以创建一张地图，并将选定的记录标记在上面。\n\n## CiviCRM 基础知识：在系统中导航和处理联系人\n\
  \n- **导出联系人：** 不可避免地，您需要进行搜索并将结果导出为 `.csv` 文件（逗号分隔值），以用于各种目的——发送给邮件处理机构、对数据进行计算、合并信件、通过电子邮件传送给他人等等。导出记录的过程包括两个步骤：\n\
  \  - 选择导出类型——默认主要字段或您自己选择的字段。您可以保存导出映射（字段集合）以供以后重用。\n  - 如果您选择了自己选择字段，将显示一个网格，您可以在其中选择联系人类型、字段和相关字段参数。在页面底部，您可以保存导出映射、更新现有映射，并将列表导出为\
  \ `.csv`。在定义字段选择时，请记住，只有字段适合搜索结果中的联系人类型时，才会导出数据。例如，如果您的搜索结果仅包含个人，则您导出中定义的任何家庭字段都将为空。还要注意，有些选项可以导出相关记录。例如，如果您想通过雇主关系获取与个人相关联的组织所在的州值，可以使用字段列表底部附近的“相关联系人信息”选项实现。\n\
  \  - 导出记录时，您可以合并具有相同地址的记录，或合并家庭记录。前者将识别具有相同地址的联系人并将它们合并为单条记录。后者将查找结果列表中属于某个家庭的记录，并导出家庭记录而不是单个联系人记录。这两个选项都将有助于防止向同一地址发送多件邮寄品，从而降低邮寄成本。请注意，这些选项不会影响记录本身；它们只会影响导出文件的生成方式。\n\
  \n## 对同一选择后续操作\n\n您会发现，在许多情况下，触发一个操作后，您可以返回搜索结果列表并触发后续操作。上面的记录活动示例就是一个很好的例子——在为邮件发送导出记录后，执行第二个活动操作来记录邮寄详情。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_189_0.png)\n\n> FPAGM 即将召开董事会会议，必须将后勤细节通知董事会成员。他们使用简单搜索检索属于现有董事会静态组的所有联系人。从操作列表中，他们选择向结果列表中的所有记录发送电子邮件。电子邮件包含地点、时间、停车详情以及议程副本作为附件。除了提醒董事会会议的直接好处外，FPAGM\
  \ 还重视这样一个事实：电子邮件的记录作为已完成的活动附加到每个联系人上。这提供了与董事会沟通的历史记录，并且如果某位董事会成员声称他们没有收到提醒，这可能会有所帮助。\n\
  \n## 处理联系人记录\n\n在本章中，我们已经涵盖了很多关于联系人的内容。然而，我们的重点一直放在理解收集的数据类型、在系统中导航以及使用搜索工具和结果上。让我们通过查看替代工作流程和通过去重工具维护记录来结束本章。\n\
  \n## 替代工作流程\n\n我们是在 CRM、选民或联系人关系管理工具中工作。因此，通过联系人的视角来查看数据是很自然的。到目前为止，我们涵盖的几乎所有内容都是这样做的；我们要么在单个联系人记录内工作，要么进行了搜索以对一组联系人记录采取行动。\n\
  \n然而，有时从操作而不是联系人记录开始可能看起来更自然。CiviCRM 为此类替代工作流提供了几个选项。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_190_0.png)\n\
  \n在左侧边栏中，您会看到一个**新建**按钮和一个下拉菜单。此按钮在 Joomla! 中始终可见；在 Drupal 中是一个**默认启用**的块。Drupal\
  \ 用户可以通过 Drupal 的**管理 | 站点构建 | 块**工具进行配置。除了创建联系人的选项外，还有用于创建活动、贡献、电子邮件、活动注册、成员资格、承诺、分组或标签的选项。\n\
  \n其中许多选项也列在相应的主菜单项下（例如，**新建贡献**列在**贡献**菜单下）。\n\n选择创建附加到联系人的记录时，表单上会有一个联系人字段，您可以在其中开始输入现有联系人姓名，或从下拉菜单中选择创建新联系人。\n\
  \n“即时”创建新记录会弹出一个包含几个联系人字段的窗口。此表单可通过**管理 | 自定义 | CiviCRM 配置文件**进行配置。默认情况下，它只包含几个必填字段。您可能希望扩展包含的字段，以确保系统用户向系统中输入记录时收集更多信息。\n\
  \n用于“即时”创建联系人的配置文件名为**新家庭**、**新个人**和**新组织**。请注意在 CiviCRM 配置文件列表页面中，这些被标记为**保留**。在整个\
  \ CiviCRM 中，任何标记为**保留**的记录都不能被删除，并且将用于系统中的特殊目的。建议您不要对保留记录进行任何重大修改，因为这可能会在系统中产生意想不到的后果。例如，我们建议不要重命名**新个人**配置文件，然后将其用作联系人的注册表单。\n\
  \n## 消除重复\n\n数据为王。如果处理的数据不正确、混乱或过时，即使是最先进的 CRM 工具也几乎毫无用处。您的系统将根据垃圾进/垃圾出的原则而生或死。\n\
  \n您可以采取哪些步骤来提高数据的质量和可靠性？一个重要的方法是减少记录重复。\n\n记录重复是不可避免的现实，尤其是一旦您开始在前台暴露表单，并邀请选民和网站访问者提交他们自己的数据。幸运的是，CiviCRM\
  \ 有几种处理记录重复的方法。\n\n## 处理重复的策略\n\n我们将使用三种策略来对抗重复：\n\n- **政策和程序：** 是的，第一种策略是人力资源和管理策略。任何在\
  \ CiviCRM 中作为管理员工作的人都必须理解减少重复的重要性。您可以通过强制执行一项政策来开始：每次用户打算处理联系人记录时，他们首先搜索该联系人。简单，对吧？有多少次人们进入系统后立即开始创建新记录？CiviCRM\
  \ 的自动填充搜索工具将有很大帮助，但只有被使用时才会对您有益。\n- **内联去重：** 在创建或编辑联系人记录时，CiviCRM 会进行查找，看是否与现有记录存在潜在匹配。如果存在，您可以选择访问潜在重复记录或继续保存当前记录。CiviCRM\
  \ 使用去重规则（在下面一点中讨论）来定义什么可能构成匹配。默认的模糊规则用于内联去重。您也可以使用**检查匹配联系人**按钮触发重复检查。\n\n\n\n\n\
  \nFPAGM 最近举办了他们的年度会议，吸引了来自该州的 350 多人，以了解食品储藏室管理的最佳实践，并听取全国各地正在开展的其他无家可归者行动倡议。大多数参与者是在线注册的。虽然这大大减少了工作人员所需的数据录入工作量，但由于许多参与者在填写表单时不够仔细，系统中确实产生了重复记录。\n\
  \n该协会现有的大部分联系人记录（会议之前）没有电子邮件地址，因此默认的匹配规则对于他们的需求来说过于严格。他们决定创建一条新的个人模糊匹配规则，以匹配名字和姓氏。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_193_0.png)\n\n## 查找重复项\n\n匹配规则配置表单由三个可配置的列组成：字段、长度和权重。\n\
  \n- **字段**：指示要作为潜在匹配进行测试的数据。\n- **长度**：指示应测量字段值中的多少个字符。值越低，匹配结果越多，因为如果使用较短的值，更多记录可能会找到匹配。例如，姓氏字段中长度为\
  \ 4 可以匹配 Johnson 和 Johnston，而长度为 6 则无法匹配（Johnso != Johnst）。在前面的示例中，我们希望进行相当模糊的匹配，因此我们定义了一个较短的长度。将该字段留空将要求对整个字段值进行匹配。\n\
  - **权重**：用于计算匹配的可能性。使用上述规则，名字（10）和姓氏（10）都匹配会产生总分 20，达到该列底部的阈值。上面的示例非常简单；我们只是要求所有字段都匹配，系统才会将联系人视为潜在匹配。考虑一个替代配置：\n\
  \  - 名字 (10)、姓氏 (10)、电子邮件 (5)、城市 (5)，总阈值 = 25\n  - 在此配置中，匹配名字、姓氏和电子邮件，或者匹配名字、姓氏和城市，都能达到阈值并返回潜在匹配。\n\
  \n您需要仔细考虑去重规则的设置。过于严格的规则可能会导致漏掉一些有效的重复项，而过于模糊的规则会产生冗长的结果列表，不便于处理。尤其要检查默认的**严格**规则，因为这些规则会影响在无人工干预环境（在线表单和导入）中的去重/合并。\n\
  \n配置好规则后，单击**保存**返回规则列表，再单击以使用该规则。默认情况下，规则将针对整个数据库运行（使用该规则适用的联系人类型）。但是，您也可以选择将处理过程限制为一个群组。如果您的数据库非常大，并且希望按较小的目标记录块来处理去重，这将很有帮助。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_194_0.png)\n\n## 合并重复项\n\n触发（运行）规则后，CiviCRM\
  \ 会提供潜在重复联系人的列表。列表中会显示两个潜在匹配项、总权重（权重较高的匹配项排在前面），以及一个用于合并记录的链接。\n\n合并功能才是真正体现这款工具强大之处的地方。两条记录会显示在一个网格中，由您决定哪些字段将从左侧的重复记录移动到右侧的主联系人中。这样，您可以精确选择要合并的字段。该工具还会合并任何相关记录，例如活动、贡献、会员资格等。这一点很重要，因为您不希望这些记录中包含的历史数据因合并过程而丢失。\n\
  \n## 合并重复项说明\n\n碳化硅陶瓷制品具有优异的高温力学性能、热导率、抗热震性、抗氧化性能、耐磨损性能以及化学稳定性，特别适合在 1200°C 以上氧化性或腐蚀性气氛中作为结构部件长期使用。在光伏多晶硅生产领域，碳化硅陶瓷是目前多晶硅氢化炉、还原炉用高品质石墨部件(如钟罩、底盘、加热器等)的最佳替代品。\n\
  \n我公司生产的碳化硅陶瓷制品根据使用温度区间和工况环境要求，分为常压烧结碳化硅陶瓷和反应烧结碳化硅陶瓷两大类，产品具有以下主要特征:\n\n- **使用温度高**：最高可达\
  \ 1600°C(常压烧结碳化硅)\n- **热导率高**：最高可达 125 W/mK(常压烧结碳化硅)\n- **耐酸碱腐蚀**：化学惰性，耐酸碱侵蚀\n-\
  \ **纯度高**：常压烧结碳化硅纯度可达 99% 以上，避免对多晶硅的污染\n- **热稳定性好**：抗热震性能优异，不易开裂\n- **使用寿命长**：显著延长设备检修周期，降低运行成本\n\
  \n碳化硅陶瓷材料与石墨材料主要性能对比\n\n| 性能指标 | 单位 | 常压烧结碳化硅 | 反应烧结碳化硅 | 高纯石墨 |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| 体积密度 | g/cm³ | 3.10 | 3.02 | 1.85 |\n| 最高使用温度 | °C |\
  \ 1600 | 1380 | 2500 |\n| 热导率(20°C) | W/mK | 120 | 125 | 90-130 |\n| 热膨胀系数(20-1000°C)\
  \ | 10⁻⁶/K | 4.5 | 4.3 | 2.0-3.5 |\n| 抗弯强度(20°C) | MPa | 380 | 250 | 40-60 |\n|\
  \ 抗弯强度(1200°C) | MPa | 400 | 280 | 20-30 |\n| 弹性模量 | GPa | 410 | 330 | 8-12 |\n\
  | 硬度 | GPa | 27.5 | 25 | 1-2(肖氏) |\n| 灰分含量 | ppm | <50 | <500 | <500 |\n"
- "# 5 收集、整理和导入数据\n\n一切都是关于数据的，对吧？你可以拥有最新、最强大的软件工具，并根据组织的需求量身定制；但如果你的数据不完整、几乎不存在或糟糕透顶，那么所有这些出色的工具都将毫无意义。\n\
  \n在上一章中，我们详细了解了 CiviCRM 界面的方方面面，理解了将附加到联系人上的不同类型记录。但是，我们如何收集数据、组织数据并将其导入系统呢？\n\n\
  在本章中，我们将：\n\n- 创建自定义数据字段以存储数据\n- 在配置文件中组织数据字段，用于创建在线表单和其他工具\n- 将配置文件表单与会员资格、事件和贡献页面集成\n\
  - 一次更新多个联系人记录\n- 从外部来源导入联系人记录和活动\n\n## 自定义数据字段\n\n开箱即用（更准确地说，从网站下载后），CiviCRM 中包含的用于存储数据的字段非常基础。这些字段包括标准的通信字段（电话、电子邮件、网站等）、地址字段（街道、城市、州/省、国家）、人口统计字段（性别、出生日期等），以及一些额外的杂项字段。\n\
  \n无论您是从现有数据库迁移，还是从零开始，都不可避免地会有需要存储在字段中的额外数据。CiviCRM 通过其自定义数据工具满足了这一需求。\n\n自定义数据由**数据组**和**字段**组成。您首先定义一个数据组，并将其分配给现有的数据对象；然后在该数据组内创建字段。\n\
  \n所谓数据对象，我们指的是现有类型的记录。您的自定义字段将扩展系统中的某些记录类型，例如个人联系人、会员记录或群组。在创建自定义数据组时，您需要配置要扩展的记录类型，以及任何关联的子类型或选项。\n\
  \n让我们看一下自定义数据界面，并逐步创建新的自定义字段，以更好地理解其工作原理。我们可以通过**管理 | 自定义 | 自定义数据**访问自定义数据。\n\n\
  首先单击**添加自定义字段集**。为数据组输入名称，并选择其用途（将扩展哪种记录类型）。这是过程中最重要的一步——一旦您开始在这些字段中收集数据，您将无法更改其连接的数据类型。许多可用选项还会提供额外的子选项。例如，如果您创建附加到事件的自定义数据组，则可以随后指定该数据集将用于的一个或多个事件类型（选择\
  \ **-任意-** 以向所有事件类型公开自定义字段）。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_198_0.png)\n\
  \n让我们简要回顾一下可用的用途：\n\n- **活动**：在创建或编辑活动记录时可用。您可以进一步将其用途限制为一种或多种活动类型。\n- **联系人**：可用于所有联系人类型。如果您希望字段仅对单一联系人类型或子类型可用，请使用**个人/家庭/组织**选项。\n\
  - **贡献**：附加到贡献记录，可限制为一种或多种贡献类型。\n- **事件**：在创建事件时可用，可限制为一种或多种事件类型。请注意，这用于跟踪*关于*事件的信息，而不是从注册者那里收集信息。注册数据请使用参与者选项之一。\n\
  - **拨款**：在处理拨款记录时可用。\n- **群组**：在处理群组时可用。\n- **家庭**：用于**家庭**联系人类型，如果系统中定义了**家庭**子类型，则可限制为一个或多个**家庭**子类型。\n\
  - **个人**：用于**个人**联系人类型，如果系统中定义了**个人**子类型，则可限制为一个或多个**个人**子类型。\n- **会员资格**：附加到会员资格记录，可限制为一种或多种会员资格类型。\n\
  - **组织**：用于组织联系人类型，如果系统中定义了组织子类型，则可限制为一个或多个组织子类型。\n- **参与者**：可用于所有参与者（即注册）记录。\n\
  - **参与者（事件名称）**：可用于所选事件的参与者记录。\n- **参与者（事件类型）**：可用于所选事件类型的参与者记录。\n- **参与者（角色）**：可用于所选角色的参与者记录。\n\
  - **认捐**：附加到认捐记录。\n- **关系**：附加到关系记录，可限制为所选的关系类型。\n\n尽管这可能显得重复，我们仍要强调：在创建自定义数据集之前，务必仔细思考您的数据将如何被使用以及应附加到何处。一旦定义并投入使用，您就无法更改自定义数据组的使用方式。\n\
  \n> 请注意，每种用途类型不限于一个自定义数据集。您可以根据需要创建任意数量的自定义数据集，并且可以为同一记录类型创建多个数据集，以便将字段组织到不同的选项卡或内联可折叠集合中。\n\
  \n\n\n\n\n在命名您的组并选择其用途后，您可以设置顺序（如果您有多个组用于同一记录类型，这将很有帮助），在字段前后添加描述性文本，并从几个配置选项中进行选择。这些选项包括：\n\
  \n- 首次打开记录时，字段集是应折叠还是展开以显示字段\n- 在高级搜索中查看时，字段集是应折叠还是默认展开\n- 该组是否处于活动状态\n\n如果您的组附加到联系人记录选项之一（**联系人**、**个人**、**家庭**或**组织**）：\n\
  \n- **显示样式**：字段可以内联（**内联**）显示，出现在联系人的摘要和编辑屏幕中，或者在联系人记录中显示在自己的选项卡（**选项卡**）中。\n- **多条记录**：用于为联系人收集多组记录。默认情况下，您创建的字段将与联系人记录建立一对一的关系。选择此选项允许为联系人保存多条记录。例如，如果您想跟踪个人的教育记录，其中每条记录将包含单个教育经历的详细信息，这将非常有用。一个联系人可能有多个记录，分别表示其中学、本科和研究生教育。\n\
  \n> 使用多条记录选项目前存在一些限制，最明显的是，如果不进行自定义编码，就无法将这些字段暴露给网站表单（个人资料）。多条记录集必须显示在选项卡中，而不能内联显示，并且多条记录中只有第一条会被导出。此外，请注意，一旦您将自定义组标记为用于多条记录，就无法撤销该设置并改回单条记录结构。这是因为您可能已经添加了多条数据记录，而CiviCRM无法确定多条记录中的哪一条应保留为单组数据。\n\
  \n保存您的自定义数据集，然后进入用于创建与此数据集关联的第一个自定义字段的表单。您可以随时返回调整组的设置，或添加/删除/修改字段的设置。\n\n- **整数**：可存储的数字大小取决于您的服务器，但在32位操作系统上可能约为正负20亿，在64位操作系统上约为正负9E18。\n\
  - **数字**：此类型应用于需要小数的值。\n- **货币**：用于货币值。它将根据您在全局设置中选择的默认货币显示。\n- **备注**：此字段用于较长的文本字符串，例如冗长的描述或评论。\n\
  - **日期**：您可以选择使用哪种日期和时间格式，包括仅使用日期的部分。例如，如果您只想使用年和月，可以从多个显示这些值的选项中进行选择。配置日期时，您还可以决定日历组件将提供未来和过去多少年。\n\
  - **是或否**：虽然字母数字复选框字段可用于是/否功能（选中即表示“是”），但当您需要轻松搜索明确的“否”值时，此字段可能更有用。您可以将此字段设为必填，并将默认值设置为0（即“否”），以确保所有记录都记录了值，从而更好地控制通过此字段进行的搜索。\n\
  - **省/州**：此字段将填充您站点中启用的州和省列表。\n- **国家**：此字段将填充您站点中启用的国家列表。\n\n> CiviCRM会将超出允许范围的整数值静默舍入为最小值或最大值，而不会显示错误。\n\
  \n> 目前，所有日期字段都使用弹出窗口组件来选择日期。虽然这有助于确保准确的数据存储（该组件根据选择构造值并将其放入所需的数据库格式），但这意味着部分日期字段（例如仅选择年份）仍将通过选择特定的月/日/年来操作。遗憾的是，从数据录入的角度来看，这并不直观。它还会影响对这些自定义日期字段的搜索，并可能产生意外结果。如果您需要仅包含月份或年份的字段，您可能会发现使用字母数字选择框字段更容易，因为它可以更好地控制显示和搜索。\n\
  \n- **文件**：用于上传文件的浏览按钮。文件将存储在全局设置中定义的上传目录中。访问文件的链接将显示在自定义数据展示中。当您返回编辑已附加现有文件的记录时，您可以选择用另一个上传文件替换该文件或删除现有文件。\n\
  - **链接**：超链接，在查看模式下将变为热链接。\n- **联系人引用**：用于链接到另一个联系人记录。该字段将呈现为自动完成字段，允许您开始输入以在数据库中查找另一个联系人。\n\
  \n> 默认情况下，联系人引用类型字段将从整个数据库中提取匹配的联系人。在大多数情况下，您不会希望这样做，因为这将把您所有的联系人记录暴露给使用该表单的任何人。CiviCRM提供了一个钩子，用于自定义自动完成字段可用的记录列表：`hook_civicrm_contactListQuery`。有关使用钩子自定义CiviCRM的更多详细信息，请访问`http://wiki.civicrm.org/confluence/display/CRMDOC/CiviCRM+hook+specification`。\n\
  \n选择字段类型后，选择您偏好的显示格式。可用的选项取决于字段类型，某些字段类型只有一个选项值。我们将列出并描述所有可能可用的显示类型。\n\n当选择包含选项列表的显示类型（如选择框/复选框/单选按钮）时，将为您提供一个用于创建选项标签和值的表单。您最初最多可以输入10个选项；保存后，您可以添加更多。您还可以选择复用先前为另一个字段创建的列表。标签是显示在表单中的内容；值将记录在数据库中并从系统导出。\n\
  \n> 标签文本应具有描述性，并对填写表单的人有意义。大多数情况下，您会为标签和值输入相同的值，除非有充分的理由让它们不同。\n\n出现的显示类型如下：\n\n\
  - **文本**：基本文本字段。\n- **选择框**：下拉框；选择一个选项。\n- **单选按钮**：单选按钮允许您从可用列表中选择一个选项。如果该字段不是必填项，显示中将包含一个取消选择任何选项的链接。您可以决定每行列出多少个选项。\n\
  - **复选框**：复选框列表允许您选择或取消选择任何选项。您可以决定每行列出多少个选项。请注意，复选框选项的一个弱点是难以轻松搜索未选中的值。如果该选项对您很重要，请考虑为每个选项创建是/否类型字段并将其设为必填。这将为两个选项都产生明确的值。\n\
  - **多选**：选项列表，允许用户选择一个或多个选项。使用*Shift*键选择多个连续选项，或使用*Ctrl*键选择多个独立选项。这对于较大的选项列表非常有用，因为复选框需要太多空间。\n\
  - **高级多选**：显示两列选项——左列显示所有可用选项，右列显示所选选项。使用两列之间的箭头将选项移入或移出所选列表。这克服了标准多选框的主要弱点——在操作字段时意外取消选择选项的倾向。\n\
  - **自动完成选择**：这与**选择框**下拉框类似，但您可以开始输入一个值，让它在选项列表中搜索可能的匹配项。这对于具有大量选项的单选字段非常有用。\n-\
  \ **文本区域**：显示一个多行框，用于输入较长的文本。它将内容存储为纯文本，不含HTML。您可以决定框的高度和宽度，但用户可将其展开。\n- **富文本编辑器**：显示一个多行框，用于输入较长的文本，带有WYSIWYG编辑器工具栏，按**全局设置**中的配置显示。\n\
  - **选择日期**：用于选择特定日期的弹出日历组件。\n- **选择省/州**：从**管理 | 配置 | 全局设置 | 本地化**中启用的列表中选择一个州或省。\n\
  - **多选省/州**：选择一个或多个州或省。\n- **选择国家**：从**管理 | 配置 | 全局设置 | 本地化**中启用的列表中选择一个国家。\n- **多选国家**：选择一个或多个国家。\n\
  - **选择文件**：提供浏览/上传文件字段。\n- **链接**：超链接URL字段。\n\n\n\n\n\n继续完成字段创建表单，输入默认值（如需要且可用），提供帮助文本，并确定该字段是否必填。请注意，如果将字段指定为必填，它将影响所有管理表单——不仅仅是向站点前端公开的表单。在创建前端表单时，您将在构建配置文件期间有另一个机会指定哪些字段是必填的。\n\
  \n如果您希望此字段包含在高级搜索工具中，请将其指定为可搜索。通常您希望大多数字段都是可搜索的，尽管值得考虑这个问题。对于不太可能被搜索的字段，关闭此选项可以简化高级搜索界面。\n\
  \n字段创建表单上的最后一个选项是将字段标记为只读。有两种情况这会很有帮助：\n\n- 如果您从旧系统导入数据，您可能有一些字段希望在新系统中保留，但不想持续维护。最常见的情况是旧字段在\
  \ CiviCRM 中有不同的表达方式，例如成为标签或组结构的一部分。创建字段并导入数据后，您会返回并将此字段标记为只读。这样可以确保数据可供参考，但用户不会添加或编辑它。\n\
  - **只读**字段在您希望使用钩子或其他代码填充字段值时也很有帮助。我们将在本书末尾讨论钩子，但就目前而言，请理解它们是开发人员在特定时间运行自定义代码的一种方式。例如，您可能会创建一个名为“age”的自定义字段，该字段根据出生日期（标准字段）和当前日期计算联系人的年龄。您希望该值在每次显示时通过代码自动更新，而不是依赖用户手动记录该值。\n\
  \n> 请注意，您不能使用**导入联系人**工具将数据导入到指定为**只读**的字段。您应将字段保持为可编辑状态，导入数据，然后返回并将其标记为只读。\n\n\
  关于导入旧数据的主题，您可能还会发现最初导入然后完全隐藏某些字段（不仅仅是标记为只读）很有用。与 CiviCRM 中的大多数工具一样，您可以轻松禁用自定义字段。这样做会保留存储在字段中的任何数据，但会将其完全从界面中移除。\n\
  \n您是否有兴趣了解 CiviCRM 如何在 MySQL 数据库中处理自定义字段？在 phpMyAdmin、SSH 或您首选的数据库管理工具中打开您的数据库。创建自定义组会在\
  \ `civicrm_custom_group` 表中添加一条记录，其中包含您的配置选项，并创建一个名为 `civicrm_value_[基于组名称和 id 的唯一文本]`\
  \ 的新表。每个自定义字段都会在 `civicrm_custom_field` 中添加一条记录，并在适当的表中创建一个新列。\n\n自定义组创建的表将始终具有\
  \ `entity_id` 列，该列是扩展其的对象表的外键。例如，用于个人的自定义组将使用 `entity_id` 将自定义数据记录链接到 `civicrm_contact`\
  \ 表的 ID 字段。\n\n如果您将来需要对数据运行自定义查询，了解这一点会很有帮助。该结构使构建自定义数据表与其扩展的记录之间的关系图和查询变得非常容易。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_206_0.png)\n\n自定义数据集和字段是您 CRM 策略中的强大工具。在初始实施期间以满足定义的数据记录需求、导入旧数据以及在系统持续使用过程中数据需求不断演变时，您可能会发现需要构建它们。\n\
  \nFPAGM 将使用自定义字段收集有关其服务的食品储藏室和向组织供应食品的企业的信息。由于收集这两种类型联系人的信息差异很大，因此该协会将定义两个自定义字段集，并分别指定它们用于每个联系人子类型。这是通过选择\
  \ **Organization** 作为 **Used For** 值并在出现的多选框中选择适当的联系人子类型来完成的。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_206_1.png)\n\
  \n与自定义字段对数据库结构的影响相关的一个重要事项是，如果您将站点迁移到新服务器，您需要确保由自定义组创建的附加表已迁移。换句话说，仅导出您的数据是不够的；您还必须导出数据库结构。仅将数据导入新服务器上\
  \ CiviCRM 的干净安装是不够的，因为您将缺少旧数据库中的自定义数据表。\n\n## 使用配置文件创建在线表单\n\n到目前为止，我们的大部分注意力都集中在了解\
  \ CiviCRM 的管理界面以及自定义/配置系统以满足您组织的需求上。然而，直到您开始收集数据并将其公开到您的网站，CiviCRM 的强大功能才得以充分发挥。\n\
  \n组织拥有非常分散的系统来收集和维护其组成员数据的情况并不少见。也许您有一个中央数据库，例如 MS Access，由员工用来跟踪会员或捐赠者，并存储在您的办公网络上。几名员工可能维护着与他们的工作职能相关的信息电子表格，并且在旅行时（无法连接到办公网络时）需要访问这些信息。也许您当前的网站有一个数据库，其中存储了用户登录访问帐户，并且会员列表会定期更新以拥有在线目录。\n\
  \nCiviCRM 提供了将这些不同的数据源整合在一起的机会——那些在办公网络上内部使用的、必须远程访问的以及应在公共或用户访问网站上公开的。在此过程中，您可以简化工作流程并提高数据完整性。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_207_0.png)\n\n在 CiviCRM 中，您使用配置文件收集和公开数据。配置文件基本上是一组字段。您根据计划如何使用它来为配置文件及其字段选择设置。配置文件可用于：\n\
  \n- 创建表单以从用户收集信息，作为独立表单或作为捐赠或活动注册表单的一部分\n- **搜索结果**：用于高级搜索结果和批量更新\n- **Drupal 用户注册**：字段将被添加到用户帐户注册表单中（仅限\
  \ Drupal）\n- **查看/编辑 Drupal 用户帐户**：字段将被添加到用户帐户表单中（仅限 Drupal）\n\n您可以在任何时候返回以调整这些设置。如您所见，单个配置文件可能用于多种用途。为了减少系统混乱，最好最初只选择您知道会使用的选项。\n\
  \n单击此表单底部以展开 **高级设置** 面板。此处列出的选项显著扩展了配置文件的功能。请记住，并非所有选项都适用于配置文件的每种用途。CiviCRM 只会忽略不适用于站点上配置文件特定实例的选项。\n\
  \n在此，我们所说的“实例”是指配置文件用于特定目的的使用。例如，您可能会创建一个包含联系人地址字段的配置文件，该配置文件用于站点上的配置文件查看页面，也用作管理侧的搜索结果视图。与搜索相关的设置，例如结果列表中将包含哪些列，将被此配置文件的第一次使用所忽略。通常，您是为单一用途创建配置文件，通常这是一种很好的思考方式。然而，软件在单个配置文件可用于的方式数量上实际上没有任何限制。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_209_0.png)\n\n\n\n\n\n让我们回顾一下选项：\n\n\
  - **Limit listings to a specific Group?**：这仅适用于用作搜索表单的个人资料。 从此列表中选择一个组将限制搜索的联系人仅限于该组中的联系人。\
  \ 例如，如果你要创建一个在线会员目录，你将首先为当前会员创建一个智能组，然后将搜索个人资料限制为该组，这样使用该个人资料进行的任何搜索都只会返回名下良好的会员。\n\
  - **Add new contacts to a Group?**：这适用于用作联系人报名或编辑表单的个人资料，包括与捐款页面和活动注册一起使用的表单。 当用户完成表单后，他们将被添加到你选择的组中。\
  \ 这提供了一种很好的方式来追踪联系人的来源或管理邮件列表。\n- **Notify when profile form is submitted?**：你可以选择在个人资料**Create**或**Edit**表单提交时通过电子邮件通知一个或多个人员。\
  \ 对于多个电子邮件，用逗号分隔每个电子邮件。\n- **Redirect URL**：表单提交后，你可以选择用户将被重定向到的位置。 要使用此字段，请输入完全限定的\
  \ URL（包括 `http://`）。 如果该字段为空，用户将被导回个人资料表单，并显示一条成功提交的消息。\n- **Cancel Redirect URL**：与上一个字段类似，此字段用于在用户取消表单时重定向人员。\
  \ 留空该字段将使用户返回个人资料表单并清除字段。\n- **Include reCAPTCHA?**：Captcha 是一种阻止垃圾邮件和机器人完成你的在线表单的方法。\
  \ 该工具会显示字母和数字的图形表示，要求用户在表单提交前成功输入字符。 在个人资料表单上启用 captcha 之前，你必须先在 `http://www.recaptcha.net`\
  \ 获取一个帐户（你将被引导通过 Google 创建帐户）。 在设置帐户并获得私有和公钥后，将这些值输入到：**Administer | Configure |\
  \ Global Settings | Miscellaneous**。 一旦你在全局设置中配置了 reCAPTCHA，它将可用于任何个人资料表单。\n\n-\
  \ **Joomla/Drupal user account registration option?**：在本节前面我们提到个人资料可以插入到 Drupal\
  \ 用户帐户表单中。 反向操作也适用于 Drupal 和 Joomla！——你可以创建并公开一个个人资料表单，并包含用户帐户字段（用户名和密码）。 你可以根据需要使用户注册为可选或必需。\
  \ 这对于包含在捐款页面和活动注册中特别有用。 例如，你可能希望鼓励注册年度会议的人创建用户帐户以便将来访问网站。 请注意，你的个人资料表单必须包含电子邮件地址字段，并且你的\
  \ CMS 设置中必须启用用户帐户注册（Joomla!/Drupal）。\n- **What to do upon duplicate match**：如果网站上已有数据库中的某人完成表单会怎样？\
  \ 是否应创建新的联系人？ 如果已有数据，是否应忽略字段，还是应使用新数据更新并覆盖现有数据？ 使用此选项来决定重复联系人应收到警告、使用现有记录更新，还是应创建新的重复记录。\
  \ 请注意，CiviCRM 将使用在查找和合并重复联系人工具（Administer | Manage）中为适当联系人类型定义的默认 Strict 规则来识别匹配的联系人。\
  \ 还请注意，CiviCRM 将始终更新嵌入在捐款和活动注册页面中的个人资料表单的现有联系人记录。\n- **Proximity search**：如果个人资料用于搜索，你可以启用从中基于联系人与地址的接近程度（接近）进行搜索。\
  \ 如果设置为必需，用户必须完成邻近搜索字段才能使用该工具。\n- **Enable mapping for this profile**：如果启用了映射并且\
  \ CiviCRM 已成功对联系人的地址进行地理编码，则搜索结果和记录的详细视图中将包含一个链接以在地图上查看位置。\n- **Include profile\
  \ edit links in search results?**：此选项是一种强大（但危险）的方式，使具有足够权限的用户能够通过个人资料编辑系统中的其他记录。\
  \ 由于对联系人的编辑访问是通过个人资料进行的，因此你可以轻松控制用户可以编辑哪些记录和哪些字段。 在 Drupal 中，你需要适当授权用户以访问和编辑此个人资料的记录。\
  \ 在 Joomla！中，用户必须是管理员用户。 启用后，搜索结果列表将在每条记录的行中添加一个 Edit 链接。\n\n- **Include Joomla/Drupal\
  \ user account links in search results?**：启用此选项会在搜索结果中插入指向用户网站帐户页面（仅查看）的链接。 对于寻求建立社交社区的网站，这可以帮助人们与其他用户建立联系。\n\
  \n完成 **Settings** 表单后，你将被引导至一个表单，在其中可以为个人资料定义字段。 请记住，你对 **Profile** 字段的选项在某种程度上独立于原始自定义字段定义。\
  \ 例如，你可以将个人资料中标记为 **Required** 的字段，而在原始定义中该字段不是必需的，或者你可以在字段前后添加自定义文本以帮助解释其在此特定上下文中的用途。\n\
  \n个人资料字段设置可能有点令人困惑，因为选项会根据你对个人资料的使用情况显著影响字段显示。\n\n首先要掌握的概念是，你可以根据计划的使用情况将哪些类型的字段组合在一起在个人资料中使用。\
  \ 与 CiviCRM 的其他部分一样，字段选择过程涉及选择类型、字段，然后与该字段相关的任何子选项。 你可以将联系人、活动、参与者（活动注册者）、会员和捐款字段添加到你的个人资料中。\
  \ 然而，你对个人资料的使用将决定允许的字段类型组合。 特别是，有两条主要规则决定了使用方式：\n\n- **Different contact type fields\
  \ cannot be mixed**。 这是新用户最常见的错误。 该限制意味着你不能构建一个包含个人和组织特定字段或此类其他组合的个人资料。\n- **Participant/Membership/Contribution\
  \ fields may only be used in profiles used within the associated type of page**。\
  \ 换句话说，你不能将这些字段与个人资料视图/创建/编辑/搜索页面一起使用。 包含这些字段的个人资料只能在活动注册或捐款页面中使用。\n\n如果你未能遵守这些规则，你的个人资料页面将呈现错误，指出你混合了类型字段，你需要在继续之前更正它们。\n\
  \n> 字段类型列表包含一个 **Contacts** 选项，以及特定联系人类型和子类型的选项（**Individual**、**Organization**\
  \ 等）。 **Contacts** 选项包括所有联系人类型共有的字段，例如 **Address**、**Phone** 和 **Communication preference**\
  \ 字段。 联系人类型字段仅特定于该类型。\n\n选择字段后，你可以继续完成其他字段，例如字段标签、字段是否必需、只读以及帮助文本。 请注意，**View Only**\
  \ 字段将不包含在个人资料搜索页面中。\n\n一个非常重要的字段需要配置的是可见性字段，它决定了字段数据将如何被控制。 有三个选项可用：\n\n- **User\
  \ and User Admin Only**：这是默认选项，可用于所有个人资料创建/编辑/查看和组件页面（活动和捐款）中的字段。 它本质上说明使用表单的唯一联系人将是当前用户（无论是否登录），或在组件和个人资料创建表单的情况下，为表单正在代表其完成的人员。\
  \ 对于个人资料编辑和查看页面，在你可能访问系统中的现有数据时，此选项说明登录用户只能查看自己的信息（而不是其他联系人记录）。 因此，此选项是最严格的，也是最安全的。\
  \ 通常没有必要更改此字段值，除非你的个人资料将用作搜索表单。\n- **Public Pages**：如果要将此字段公开给搜索个人资料，无论是通过搜索表单本身还是作为结果记录的详细视图的一部分，都应选择此选项。\
  \ 这包括用于管理页面和批量更新的搜索结果的个人资料。 顾名思义，它表示联系人记录数据可以被除登录用户之外的联系人查看。 例如，John Doe 可以使用个人资料搜索表单查找\
  \ Janis Smith 的地址。\n- **Public Pages and Listings**：此选项的工作方式与前一个选项相同，但还包括在详细视图中热链接值的能力。\
  \ 这是鼓励从结果记录进行后续搜索的好方法。 例如，假设你有一个名为“service types”的自定义字段，附加到组织记录。 该字段显示为复选框列表，用户从中选择一个或多个。\
  \ 进行搜索并查看记录后，你会看到它们与其中三项服务相关联。 在个人资料表单中，此字段被分配了 **Public Pages and Listings** 可见性，这意味着该记录的三个服务在详细页面上显示并超链接。\
  \ 单击其中一项服务会基于该值生成后续搜索。 这样用户可以轻松进行多次后续搜索。 本章后面我们将构建一个使用此字段的个人资料，并指出其显示和用法。\n\n个人资料字段的可见性选项并不是你通过网站控制数据访问的唯一方式，但它是限制个人资料字段使用的重要方式之一，应在构建个人资料时仔细考虑。\
  \ 作为一般规则，除非你将个人资料用于搜索功能，否则可以将设置保留为 **User and User Admin**。\n\n\n\n\n\n如果你在可见性选项中选择了**公共页面**或**公共页面和列表**，你会在表单中看到两个额外的选项：\n\
  \n- **可搜索**：勾选此选项表示该字段应出现在搜索表单中。在构建搜索表单时，请考虑你正在处理的字段类型。通常你只希望在搜索表单中放置少量字段，并在个人资料中包含更多字段以在详情视图中显示。\n\
  - **结果列**：进行个人资料搜索后，用户会得到一个分页列表，列出所有符合所选搜索条件的记录。用户可以从该列表中点击查看记录详情或定位联系人（如果启用）。选择此选项可将该字段包含在结果列表表格中。请记住，基于你使用的网站模板/主题，屏幕的横向空间可能有限。你只希望在搜索结果视图中包含少量字段。\n\
  \n完成表单后，你可以保存并返回个人资料字段列表，或点击**保存并新建**以添加更多字段。\n\n添加完个人资料字段并返回字段列表后，你可以编辑、预览、禁用、删除或重新排列字段顺序。返回列出所有可用个人资料的主个人资料页面时，你会注意到可以对其执行多项操作。除了提供访问个人资料字段和个人资料设置链接之外，你还可以：\n\
  \n- 在创建视图中**预览**个人资料。\n- 使用**个人资料创建模式**，该模式会将你带到实时个人资料页面的**创建**模式（用于从用户那里收集新信息）。\n\
  - **禁用**或**删除**个人资料。\n- 访问**HTML 表单片段**，该片段提供了通过传统方式之外的方式在**创建**视图中使用个人资料的代码。生成的代码完全独立于你的网站，这意味着它可以在其他网站上使用。假设你的行业协会设立了一个姊妹基金会，用于向对该组织研究领域感兴趣的学生发放奖学金。这两个实体（协会和基金会）是独立的，但关系密切。你每周发布一封电子邮件通讯，并希望通过两个网站鼓励订阅，因此你为此创建了一个个人资料，并使用**HTML\
  \ 表单片段**代码将注册表单插入基金会网站，同时在你的主要协会网站上创建指向该表单的标准菜单链接。\n- **复制个人资料**，当需要创建与现有个人资料结构相似的新个人资料时，这可以简化配置过程。\n\
  \n如果你是第一次通读本节，对于如何使用个人资料还没有清晰的构想，你可能会感到不知所措。个人资料的挑战在于它们非常灵活，可以通过许多不同的方式使用，而当你刚开始接触该系统时，并不是所有方式都能立即一目了然。在设置个人资料时，如果需要在构建和测试不同用途时多次返回个人资料设置来调整选项，不必感到惊讶。\n\
  \n## 实际应用中的个人资料\n\n现在让我们花些时间来了解实际应用中的个人资料。我们将回到我们的食品储藏室案例研究（FPAGM），看看他们如何利用个人资料来满足多项数据收集和管理需求。\n\
  \n### 使用户能够更新信息\n\n与许多组织一样，FPAGM 选择实施基于网络的成员关系管理系统的原因之一是向成员展示实时数据，并允许他们在无需工作人员干预的情况下编辑这些详细信息。\n\
  \n食品储藏室和食品供应商的员工将拥有网站用户帐户，使他们能够访问一般公众无法访问的资源。这些员工中的每一位还将在 CiviCRM 中拥有一个联系记录，其中记录了他们的联系信息和活动报名信息。\n\
  \n一旦用户登录网站，FPAGM 希望提供一个链接，允许他们查看和更新他们的联系信息，包括地址、电话和通讯订阅。他们首先构建一个包含所需字段的个人资料。每个字段都将从联系人字段列表和个人字段列表中提取，并将可见性设置为用户和用户管理员，因为访问这些字段的唯一人将是登录用户。\n\
  \nFPAGM 将多个字段设置为只读，因为他们不希望用户能够修改其值。这将包括名字和姓氏字段。锁定这些字段可确保联系人不会将记录转移给另一个用户（例如，如果一名员工离开供应商并将登录详细信息交给接替他们的新员工），并有助于确保每条记录为保持历史完整性而保留。如果新员工取代现有员工，我们希望保留旧记录并创建新记录，而不是重命名现有联系人。\n\
  \n### 收集、整理和导入数据\n\n一些字段也将被指定为必填，以确保协会收集并维护尽可能完整的数据。生成的字段列表如下面的截图所示。我们会注意确保字段顺序呈现出逻辑性的信息展示。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_216_0.png)\n\n请注意“必填”和“只读”列中突出显示的值。另请注意，在许多情况下，我们修改了字段的默认标签，使其更加用户友好且符合上下文。例如，将“Postal\
  \ Code”改为“Zip Code”，地址字段不包含选择字段时默认插入的位置值。邮件列表字段实际上是群组列表。你可能还记得，群组通常用于管理邮件列表订阅。当此个人资料显示时，任何被分配了“公共页面”可见性的群组都将被列出。\n\
  \n在继续之前，FPAGM 花一点时间预览个人资料，确保其配置符合预期。请注意，预览会在创建模式下显示个人资料，这将排除只读字段（创建模式显示一个干净的表单，没有填充现有数据，因此没有只读信息可显示）。\n\
  \nFPAGM 的网站基于 Joomla! 构建，因此他们将把此个人资料的链接添加到登录用户可见的现有用户菜单中，并将访问级别设置为**已注册**，以确保只有经过身份验证的用户才能访问它。我们将在本章后面讨论公开个人资料页面的各种选项。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_217_0.png)\n\n这里显示的特定用户（**John Doe**）缺少一些必填信息（**电话**）。通过使用此表单以及必填字段，我们将能够鼓励他（以及其他联系人）为其记录提供完整的联系信息。\n\
  \n### 搜索在线目录\n\n作为 FPAGM 的成员，食品储藏室主要寻求两件事：支持和曝光。该协会的存在是为了满足食品储藏室的需求，充当信息交换所和将食品储藏室与彼此及其供应商联系起来的社区。食品储藏室还希望整个社区更多地了解它们是谁、位于何处以及服务对象。FPAGM\
  \ 将通过一个可搜索的在线目录来帮助实现这一目标。\n\n该目录应仅列出信誉良好的食品储藏室成员。它应允许用户根据地址和服务字段进行搜索。为确保个人资料搜索当前成员，我们首先创建一个智能群组来检索当前的食品储藏室成员。在创建个人资料时，我们使用**高级设置**将个人资料限制为此群组。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_218_0.png)\n\n然后我们继续定义和配置个人资料字段。创建以下字段列表：\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_218_1.png)\n\n请注意，只有少数字段被指定为**可搜索？**，只有少数字段被配置为**公共页面和列表**可见性（创建带热链接的结果）。\n\
  \n\n\n\n\n在进行了一些测试后，FPAGM 将目录链接添加到主菜单中，作为一个公开可访问的搜索工具。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_219_0.png)\n\
  \n请注意，平均每日客户字段是可以按值范围进行搜索的。这是在自定义字段定义中可用的选项。\n\n进行搜索后，我们点击 View 查看搜索结果中其中一条记录的联系人详情：\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_219_1.png)\n\n花一点时间回顾一下此示例的原始字段设置，并比较所选选项如何导致不同的可搜索字段、结果列表列和详细视图。例如，注意到\
  \ **City** 字段的 **Public Pages and Listings** 可见性导致了详细视图中的超链接值。点击该链接将触发基于该值的新搜索——所有位于\
  \ Metroville 的联系人。在使用该选项时，请仔细考虑启用后续超链接的实用性。例如，你通常不会为电话号码或电子邮件地址创建超链接，因为它们很可能对每个联系人记录都是唯一的。诸如城市、州和邮政编码之类的通用地址字段是该功能的良好候选，而街道地址则不是（因为它只会返回具有完全相同地址的联系人）。\n\
  \n## 在组件页面中包含个人资料\n\n如本节前面所述，个人资料的一个重要用途是与活动注册和捐赠页面（包括会员注册页面）结合使用。默认情况下，这两种类型的页面在注册/捐赠过程中仅需要电子邮件地址。通常，你希望包含其他重要字段，例如个人的姓名、地址和通信详情。\n\
  \n我们不会逐步介绍为此目的创建个人资料的过程，但在创建时请记住，除了 **Contact Details** 之外，你还可以包含 **Participant**、**Membership**\
  \ 和 **Contribution** 字段（取决于其用途）。\n\n在配置活动或创建捐赠页面时，你将有机会在页面中插入两个个人资料表单；一个将出现在页面顶部，另一个出现在页面底部。如果你已为活动注册启用了多个联系人注册功能，你可以为这些额外注册者分配不同的个人资料，以帮助简化并简化最终用户的注册流程。\n\
  \n## 搜索结果视图和批量更新\n\n大多数情况下，你对个人资料的使用将在网站的公共端产生某种形式的表单或其他显示。然而，有两种重要用途会影响网站的后端管理。\n\
  \n在 CiviCRM 中进行联系人搜索时， resulting 联系人列表默认包含联系人姓名、地址、电子邮件和电话号码。有时你可能希望在搜索结果列表中显示不同的字段集。你可以通过创建一个用作搜索结果视图的个人资料来实现这一点。\n\
  \n你可以在进行高级搜索时选择一个个人资料，或通过访问 **Administer | Configure | Global Settings | Search\
  \ Settings | Default Contact Search Profile** 将其选为默认搜索视图。在使用 **Advanced Search**\
  \ 时，使用 **Search Views** 下拉菜单选择所需的个人资料。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_221_0.png)\n\
  \n请注意，为了作为搜索视图可用，你的个人资料必须在个人资料设置中选中 **Search** 选项。\n\nFPAGM 希望有一个替代搜索视图，该视图删除 **Country**\
  \ 列并包含 **Current Employer** 字段。在为此目的创建个人资料时，他们必须选择 **Public Pages** 可见性并指示应包含在结果列中的字段。在为位于\
  \ Metroville 城市的个人进行搜索并选择此个人资料视图后，用户会看到以下内容：\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_221_1.png)\n\
  \nFPAGM 还希望利用个人资料进行地址字段和通信偏好的批量更新。批量更新让你一次编辑多个记录的选定字段（每次最多 100 条），并包括将第一个记录的值复制到所有后续记录的功能。\n\
  \n## Joomla!\n\n如果你已经是 Joomla! 用户，你知道创建页面链接的主要方法是通过菜单项。除了提供用于选择页面各种配置选项的界面外，菜单项还提供对模块配置的访问。模块是页面周围（按模板定义的位置）找到的内容和功能块。它们可能包括菜单、页脚文本、登录表单、最近内容项目列表等此类工具。\n\
  \n由于菜单项与模块之间的连接，你通常希望通过菜单创建指向 CiviCRM 资源的链接。要执行此操作，请从管理导航栏中选择所需的菜单并点击 New 以创建菜单项。在选择\
  \ CiviCRM 后，你会得到多个子选项，用于你希望创建的页面类型。我们的重点将放在 Profile 选项上。\n\n> 如果你希望通过菜单构建指向 CiviCRM\
  \ 资源的链接的好处，但实际上并不希望菜单在你的网站上可见，请创建一个名为“Link Setting Menu”的新菜单，并在 Joomla 模块管理器中禁用相应的模块。在\
  \ Joomla! 中，菜单配置与其在网站上的可见性/显示是分开的——后者通过模块管理器处理。你的菜单可能存在并且具有有效、可访问的链接，但实际上并不在你的网站上可见。以这种方式，菜单管理器更像是一个内部链接管理器。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_223_0.png)\n\n- **Edit:** `index.php?option=com_civicrm&task=civicrm/profile/edit&reset=1&gid=N`\n\
  - **Search:** `index.php?option=com_civicrm&task=civicrm/profile&reset=1&gid=N`\n\
  - **View:** `index.php?option=com_civicrm&task=civicrm/profile/view&reset=1&gid=N`\n\
  \n例如，我们的 FPAGM 目录搜索页面可以通过 http://fpagm.usingcivicrm.com/index.php?option=com_civicrm&task=civicrm/profile&reset=1&gid=8\
  \ 访问。\n\n构造链接后，请务必在你的网站上测试它并确认其按预期显示。\n\nJoomla! 原生的 **search engine friendly (SEF)**\
  \ 选项将正确处理对 CiviCRM 资源的初始链接（后续页面重建为标准 URL 字符串）。如果你使用第三方 SEF 扩展，请务必彻底测试你的 CiviCRM\
  \ 页面以确保兼容性。\n\n## Drupal\n\nDrupal 中对 CiviCRM 个人资料的链接将始终通过 URL 链接到 CiviCRM 构造。这些可以作为菜单项添加，也可以作为节点内容中的链接添加。你可以使用绝对或相对寻址进行链接。对于绝对链接，将以下相对\
  \ URL 附加到你的 Drupal 站点的基 URL 包括尾部斜杠（例如，http://yourdomain.org/），将“N”替换为你的个人资料的 ID（在个人资料列表中可见）：\n\
  \n- **Create:** `civicrm/profile/create&reset=1&gid=N`\n- **Edit:** `civicrm/profile/edit&reset=1&gid=N`\n\
  - **Search:** `civicrm/profile&reset=1&gid=N`\n- **View:** `civicrm/profile/view&reset=1&gid=N`\n\
  \nDrupal 用户还可以配置访问个人资料的权限。使用 Drupal 的 **Access Control** 工具来确定哪些角色可以访问个人资料页面和其他\
  \ CiviCRM 表单（例如捐赠页面和活动注册）：\n\n- 如果你希望 **Anonymous**（未登录）访客访问个人资料页面，请向 **Anonymous**\
  \ 角色授予个人资料列表和表单权限\n- 如果你在个人资料中使用自定义字段并且希望匿名访客访问表单或页面，你还需要向 **Anonymous** 角色授予 **Custom\
  \ Data Access**\n\n\n\n\n\n如果您使用配置文件进行用户账户注册，您将需要按之前所述配置权限。然而，如果您不需要匿名访问，您可以根据需要将配置文件限制为特定角色。\n\
  \n您可以使用 CiviCRM 的 **访问控制列表 (ACLs)** 进一步控制用户子集对特定配置文件的访问。\n\n可以通过添加到 Drupal 主题中的函数实现额外的细粒度访问控制（例如，默认情况下将配置文件公开给匿名用户，但限制特定配置文件的访问）。访问\
  \ CiviCRM 在线文档以获取更多示例和示例代码：`http://wiki.civicrm.org/confluence/display/CRMDOC/Linking+Profiles`。\n\
  \n## 通过 URL 变量的附加选项\n\nCiviCRM 提供了使用 URL 变量来细化配置文件显示的多个附加选项。这些参数应附加到您选择的创建/编辑/搜索/查看\
  \ URL 上。\n\n- `&force=1`：如果您的配置文件配置为将结果限制为某个组，此选项将在首次打开配置文件搜索页面时显示组列表（默认情况下，搜索页面仅打开搜索表单）。此选项仅适用于搜索配置文件。\n\
  - `&search=0`：此选项将隐藏搜索页面配置文件的搜索表单。与上一个选项结合使用时，您可以创建一个配置文件页面，以显示组的成员且不提供搜索选项。\n-\
  \ `&field_name=value`：将此选项与 `&force=1` 选项结合使用，以返回搜索和列表页面的过滤结果列表。如果需要，可以应用多个过滤器。例如，要返回纽约的记录列表，请附加：`&state_province-Primary=1031`。请注意，该字段必须作为公共用户和列表字段存在于您的配置文件定义中。如果您不确定要过滤的字段名称是什么，请在浏览器中查看搜索页面源代码并识别表单字段名称。您还可以检索选择/复选框/单选按钮字段的字段值，例如上述示例中各州的数值。\n\
  - `&map=1`：使用此选项可默认显示结果集的地图。请注意，您必须将配置文件配置为启用映射（在 **高级设置** 下）。\n\n如果您使用 CiviMail\
  \ 从系统中发送群发电子邮件，则在发送配置文件页面的链接时可以使用特殊的 `checksum` 令牌。令牌在 CiviMail 中用于在发送电子邮件时替换每个联系人记录特有的值。实质上，它们允许您使用电子邮件进行合并邮件。校验和令牌是在发送邮件时为每个联系人创建的唯一值。通过将校验和令牌附加到您的配置文件\
  \ URL 字符串，收件人可以点击链接并在未登录网站的情况下加载已预填其联系信息的配置文件表单。我们将在本书后面更详细地介绍 CiviMail 的功能。\n\n\
  使用校验和功能时，应将以下内容附加到配置文件 URL：`&id={contact.contact_id}&{contact.checksum}`。当 CiviMail\
  \ 发送电子邮件时，它会插入用户的联系人 ID 和唯一的校验和值。\n\n如果您发现您的联系人并不习惯登录您的网站通过配置文件编辑表单更新其联系信息，您可能会发现通过电子邮件向他们发送编辑表单链接很有用。他们无需登录即可访问页面并可直接与其联系记录交互。请注意，出于安全原因，校验和值在发送电子邮件后七天到期。虽然这提高了安全性，但使用此功能仍存在某些风险。校验和构建的链接提供了访问用户数据的网关（由配置文件控制），而无需他们登录。这意味着如果他们将电子邮件转发给他人，收件人将在七天的访问窗口期内获得其联系记录的访问权限。\n\
  \n## 导入联系人和活动数据\n\n配置文件为授权联系人处理自己的记录或为组织员工构建简化的<|message|> 数据录入表单提供了出色的工具。然而，很常见的是您需要将大量联系人记录添加到系统中，这可能太多而无法通过配置文件表单高效手动输入。\n\
  \n您的 CiviCRM 实施项目也非常可能涉及从现有旧系统迁移数据。即使您是一家初创非营利组织，您也可能拥有从外部来源获得的一些联系人记录，这些记录将作为您的\
  \ CRM 数据库的种子。\n\nCiviCRM 提供了一些强大的界面工具，可从逗号分隔值 (CSV) 文件、文件或由 SQL 查询指定的记录集中导入记录。即使拥有非常强大的界面，您仍需要对现有数据进行一些工作以准备导入。\n\
  \n## 收集、组织和导入数据\n\n让我们花点时间回顾导入界面，然后重新追溯我们的步骤，以了解导入中涉及的数据准备问题。CiviCRM 提供了导入联系人、活动、捐赠、会员和活动注册记录的工具。本节我们关注的是联系人和活动。\n\
  \n### 联系人导入\n\n要访问联系人导入工具，请浏览到 **Contacts | Import Contacts**。该工具由四步向导组成，您将在其中上传文件、将导入文件映射到现有的\
  \ CiviCRM 字段、查看映射并选择将联系人添加到组或标签，然后完成导入并处理有关数据的后续通知。\n\n在第一步中，您可以选择上传 CSV 文件或通过 SQL\
  \ 查询连接到数据库。在大多数情况下，您将使用 CSV 文件。如果您选择构建 SQL 查询来检索数据，数据库必须位于同一服务器上，并且 CiviCRM 安装中配置的数据库用户必须对该数据库具有足够的权限。在任何一种情况下，CiviCRM\
  \ 都会检索数据并允许您将字段映射到 CiviCRM 字段。\n\n如果您从 csv 文件导入，有几点需要注意：\n\n- 最大上传文件大小取决于服务器的 PHP\
  \ 设置配置。文件大小限制将在上传框下的注释中列出。\n- CiviCRM 通过此工具能够上传和处理记录的数量在很大程度上取决于服务器的资源和设置。如果您使用的是共享主机或资源较低的\
  \ VPS，您可能需要将导入文件拆分为较小的块（少于 1000 条记录）以便处理导入。如果您拥有自己的服务器或资源充足的 VPS，您可能需要大幅增加 PHP 超时和内存限制。如果网站尚未上线或您没有经历太多网站流量，您可以考虑将超时值设置为零，这将完全防止其超时。请务必在进行导入后将其恢复到适当的设置。\n\
  - 导入数据的最佳格式是 UTF-8。如果您的数据包含特殊字符，则需要此格式。如果您需要从不同格式导入数据，您应访问 **Administer | Configure\
  \ | Global Settings | Localization**，在其中可以配置替代的 **Legacy Encoding**。默认情况下，CiviCRM\
  \ 将为此设置配置 Windows-1252 格式（由 MS Excel 使用）。在可能的情况下，使用 UTF-8，因为它提供了最大的数据完整性。\n\n在继续导入过程之前，请备份您的数据。如果导入脚本出现问题、超时或您不小心将数据分配到错误的字段，您将希望拥有可靠的备份来恢复现有数据并重新实施导入：\n\
  \n1. 在浏览选择上传文件后，指示您的数据第一行是否包含列标题。尽可能使用列标题，因为它将极大地帮助您的字段映射步骤。然后查看导入选项。\n2. 导入联系人时，您一次只能导入一种联系人类型。换句话说，您的导入文件不允许混合组织和个人记录，或个人和家庭记录。如果您的数据包含混合联系人类型，您需要将记录分离到每个类型表示的不同文件或查询中。\n\
  3. 选择导入时应如何处理重复记录。CiviCRM 将使用在 **Contacts | Find and Merge Duplicate Contacts**\
  \ 中找到的适当联系人类型的默认 **Strict** 规则。有四个选项可用；在选择选项之前请考虑您现有的数据和导入数据。选项如下：\n   - **Skip**：默认行为\
  \ **Skip** 将提醒您任何匹配的记录，生成可下载的报告，并在处理记录时完全跳过匹配的记录。\n\n\n\n\n\n- **更新：** 当找到重复匹配时，导入文件中的数据将更新（覆盖）现有数据，如果不存在现有数据则填充字段。更新选项不影响导入文件中未包含的字段。请注意，此选项不会用导入文件中的空白数据覆盖现有数据——在这种情况下会保留现有数据。\n\
  - **填充：** 仅当字段中没有现有数据时，导入数据才会写入该字段。如果字段已有值，则在导入期间跳过。\n- **不进行重复检查：** 无论是否存在匹配记录，都会导入记录。\n\
  \n4. 如果导入文件包含日期字段，请选择这些字段的格式。请注意，导入文件中的所有日期字段必须以相同方式格式化，并且整个文件中的数据必须保持一致。这通常是导入前需要对现有数据进行清理的地方。\n\
  \n5. 对于配置了地理编码映射的站点，您可以选择在导入时执行映射查找。此选项仅适用于小型数据集，因为服务器与映射提供商就每个导入地址进行通信需要花费大量时间。如果要导入大型数据集，则需要在导入后从命令行或\
  \ URL 运行 `/civicrm/bin/UpdateAddress.php` 脚本。该脚本更适合大规模映射查找。\n\n6. 在 **导入** 向导的第二步中，您将把导入字段映射到\
  \ CiviCRM 字段，并可以选择保存导入映射以供将来使用。如果您为了处理导入而必须将数据文件拆分成更小的块，如果您定期从常用来源导入记录，或者如果数据不干净且导入可能失败或需要重新运行，使用已保存的映射尤其有用。一旦系统中保存了一个映射，您将在导入向导的第一步看到可用于选择该映射的选项。不用担心；如果导入文件与之前的映射略有不同，您仍然有机会在继续导入之前查看和修改映射。\n\
  \n## 收集、整理和导入数据\n\n7. 填写此表单后，进入第二步，您将在其中将导入字段与 CiviCRM 字段进行映射。以下屏幕截图演示了一个示例映射：\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdf8b1c_232_0.png)\n\n8. 当 CiviCRM 首次加载文件时，它会尝试为您映射字段。您需要查看并完成映射。在下一步中，您将有机会检查映射，如果导入文件中存在任何初始错误，系统会通知您。如果有错误，CiviCRM\
  \ 将提供一个链接，用于下载包含错误行和错误描述的 CSV 文件。在大多数情况下，错误是由于无效值引起的，例如格式错误的电子邮件地址或与字段选项不匹配的值。\n\
  \n9. 查看错误文件后，您可以选择更正错误、返回第一步、重新加载并继续，或者继续导入并单独处理错误。此步骤还提供将联系人添加到新组或现有组，或新标签或现有标签的选项。\n\
  \n## 导入联系人\n\n✓1. 选择数据源   ✓2. 匹配字段   ×3. 预览   4. 摘要\n\n## 预览（步骤 3，共 4 步）\n\n以下信息预览了将您的数据导入\
  \ CiviCRM 的结果。查看总计，确保它们符合您的预期结果。如果准备继续，请单击“立即导入”。\n\n<< 上一步   立即导入 >>   取消\n\n|\
  \ 总行数 | 3 | 导入数据中的总行数 |\n| 有效行数 | 3 | 将要导入的总行数 |\n\n## 已保存的字段映射：基本导入\n\n| 列名 | 导入数据（第\
  \ 1 行） | 导入数据（第 2 行） | 匹配的 CiviCRM 字段 |\n| Fname | John | Janis | 名 |\n| Lname |\
  \ Markhardt | Jones | 姓 |\n| City | Metrotown | Metrotown | 家庭 - 城市 |\n| State |\
  \  |  | 家庭 - 州/省 |\n| Zip | 10257 | 10257 | 家庭 - 邮政编码 |\n| Phone | 123-123-4567\
  \ | 123-234-5678 | 家庭 - 电话 - 电话 |\n\n- > 将导入的记录添加到新组\n- > 将导入的记录添加到现有组\n- > 创建新标签并将其分配给导入的记录\n\
  - > 标记导入的记录\n\n<< 上一步   立即导入 >>   取消\n\n10. 将导入的记录添加到标签或组中，是跟踪导入时间或数据来源的绝佳方式。它还可用于导入后的数据完整性比较，或识别部分/失败导入期间导入了哪些记录。\n\
  \n11. 如果准备好继续，请单击“立即导入”开始导入并监控其进度。根据您为重复记录设置选择的选项，您可能会收到一条消息，指示导入期间跳过了重复记录。系统将提供一个可下载的\
  \ CSV 文件，您可以在其中查看重复记录。\n\n## 活动导入\n\n活动导入通过“联系人”菜单访问，并将引导您完成类似的四步向导。最显著的区别是，您导入的记录必须与现有的联系人记录关联。换句话说，您不能在活动导入过程中创建相关联的联系人记录；活动必须导入到现有的联系人记录中。\n\
  \n可以通过在活动导入文件中包含内部联系人 ID 或外部标识符来建立与现有联系人的连接。使用这些字段可确保与联系人记录最可靠地连接，因为两者都必须是系统中的唯一值。CiviCRM\
  \ 也可以使用默认的严格去重规则（默认情况下为电子邮件地址）来连接记录。\n\n> 外部标识符字段用于存储您迁移来源数据库系统中的唯一 ID。当您从旧系统导入核心联系人数据以及相关记录数据（如活动）时，它尤其有用。\n\
  \n导入的活动数据还必须包含一个包含活动类型的列，该类型必须与 CiviCRM 中配置的类型之一相对应。如果尚未完成，请访问 管理 | 选项列表 | 活动类型\
  \ 查看现有类型并根据需要添加新类型。\n\n活动导入必须使用 CSV 文件完成（我们在联系人导入中看到的 SQL 选项不适用于活动导入），并且不会进行任何去重处理。如果返回导入错误文件，该文件很可能包含不匹配的记录和无效值。不匹配记录是指在现有联系人记录中找不到匹配联系人的记录。\n\
  \n## 数据准备提示\n\n虽然 CiviCRM 可以简化实际的导入过程，但真正的工作在于准备要导入的数据。\n\n您应该首先花时间清理数据。这包括删除不想让新系统变得杂乱无章的旧记录，确保电子邮件和网站等字段具有有效值，为任何使用选项值的字段创建一致的值，并全面检查数据以确保其尽可能干净、有序。\n\
  \n根据旧系统处理个人、家庭和组织的方式，您可能需要做一些工作，将数据按联系人类型划分为记录子集。请记住，使用 CiviCRM 导入工具时，一次只能导入一种联系人类型。话虽如此，这条规则也有一些例外，或者更确切地说是澄清。\n\
  \n在映射联系人导入时，请注意字段列表底部的一系列 **相关联系人信息** 字段。通过这些字段，您可以将数据导入主要联系人类型（例如 **个人**），同时将数据插入相关记录。如果相关记录不存在，CiviCRM\
  \ 将创建它，然后建立关系。\n\n这不是处理导入的最有效方式，如果不小心，可能会无意中创建非预期的相关记录。但是，对于只需要在相关记录中插入几个字段的导入，这可能很有用。另请注意，如果导入数据的相关记录字段值为空，CiviCRM\
  \ 仍可能会创建相关记录（数据为空）。这需要在导入后对系统进行一些清理。\n\n更可取的方法是先导入一种联系人类型的记录，然后再导入相关记录。例如，您可以先导入所有组织记录，然后使用相关字段按组织名称匹配来导入个人。\n\
  \n完成联系人导入后，您可能需要运行去重搜索并合并重复记录。尽管您尽了最大努力，重复记录仍必然会出现，尤其是在导入之后。CiviCRM 合并功能的优点在于，您可以轻松合并相关记录。例如，如果\
  \ ACME Company 和 ACME Co. 是同一家公司，它们可能在旧系统中各有相关记录（例如捐款、活动和关系）。合并这两条记录时，这些相关记录将合并到最终的联系人中。在\
  \ CiviCRM 内部处理数据合并可以减少在旧系统中寻找和合并各种相关记录的痛苦和烦恼。\n\n如上所述，在开始导入之前以及整个过程中定期进行数据库备份。您需要一条在出现问题时回退到先前数据集的途径。\n\
  \n\n\n\n\n## 迁移到生产服务器\n\n一个常见的问题是如何最好地将数据从开发或暂存服务器迁移到生产服务器。不幸的是，对这个问题没有“一刀切”的答案。你的内部工作流程和系统的总体性质将决定最佳可用方法。\n\
  \n请理解，目前没有方便的方法来合并两个 CiviCRM 数据库。如果你正在向暂存服务器进行大量导入，在从暂存服务器部署之前，你需要识别并导出对生产数据库的任何更改。版本\
  \ 3.3 中引入的更改日志可能会为这类需求提供一些支持。\n\n你在数据库中找到的 CiviCRM 表非常便携。实际上只有两个表在移动数据库时可能需要重置或清空：包含目录和\
  \ URL 设置的 civicrm_domain 表，这些设置在迁移到新服务器后可能会发生变化，以及将你的 CMS 用户连接到 CiviCRM 联系人的 civicrm_uf_match\
  \ 表。对于域表，你可能需要将 config_backend 字段设置为 null 以强制 CiviCRM 重置值，并且 uf_match 表可能需要清空以强制与现有\
  \ CMS 用户进行新的匹配。此外，你应该截断各种缓存表，以确保从新位置生成新内容。\n\n有关迁移步骤和故障排除提示的完整讨论，请参阅：http://wiki.civicrm.org/confluence/display/CRMDOC/Moving+an+Existing+Installation+to+a+New+Server+or+Location。\n\
  \n## 摘要\n\n在本章中我们：\n\n- 配置了自定义数据集/字段并开始了解其多种用途\n- 创建了配置文件以收集用于各种用途的字段\n- 实施了配置文件搜索和编辑表单，展示了向网站访客和用户公开\
  \ CiviCRM 数据的能力\n- 回顾了联系人和活动导入流程，帮助你将数据从之前的旧系统迁移到你的 CiviCRM 数据库\n- 涉及了从一台服务器迁移到另一台服务器时的关键注意事项\n\
  \n展望下一章，我们将使用 CiviMail，即 CiviCRM 的群发电子邮件系统，更有效地进行沟通，并从整体上审视管理联系人的可用工具，以便更好地与他们沟通。\n"
- "# 第6章：更好地沟通\n### 更好地沟通\n\n组织成功的核心在于其有效沟通的能力。虽然 CiviCRM 不能替代制作内容和策略的艰苦工作，但它确实提供了强大的工具来促进你的沟通工作。本章首先简要回顾你的沟通工作如何改善与支持者的关系。然后我们概述如何：\n\
  \n- 更好地沟通\n- 向一个或多个支持者发送电子邮件\n- 打印地址标签\n- 将支持者组织成用于批量邮寄的组\n- 发送批量电子邮件\n- 为批量电子邮件设置模板\n\
  - 自定义系统工作流消息的模板\n- 记录从你的普通电子邮件客户端发送给支持者的电子邮件\n\n如果你只对 CiviCRM 用于与支持者沟通的机制感兴趣，可以随意跳过下一节，我们在其中讨论有效沟通的原则和概念。\n\
  \n### 如何更好地沟通\n\nCiviCRM 可以帮助你的组织发送、接收和跟踪在线和离线通信，但制定适合你的 CRM 策略的适当沟通计划由你决定。理想情况下，你将以以下方式进行沟通：\n\
  \n- 有效且高效地实现组织的使命\n- 根据主题、处理方式、语气和时机等因素回应不同类型支持者的兴趣\n\n非营利组织今天最常见的沟通形式之一，也是本章的重点，是支持者可能订阅的批量电子邮件产品。这些可能是月度通讯、每日更新、时效性强的沟通，如紧急行动警报、新出版物通知，或用户感兴趣的其他内容。随着支持者提升参与度，你的\
  \ CiviCRM 系统将更了解他们，为你提供更有效地定位联系人细分并个性化他们收到的沟通内容和行动号召的工具。\n\n你分发的内容类型将决定谁会订阅并留在你的名单上。确保你的沟通内容及其“声音”合适：它是分析性的还是轶事性的？是权威的还是随意的？你可能会为劳动法变更的清算组织发布枯燥的公告，为无家可归者收容所发布有个人观点的叙述，或为创意行业协会发布古怪的八卦专栏。每一种都以可能与目标受众产生共鸣的语气和内容说话。\n\
  \n重新利用内容用于不同渠道有助于进一步发挥你的资源。假设你的组织每年发布几份主要研究报告。你可能希望：\n\n- 分发新闻稿\n- 就此撰写博客文章\n- 在你自己的社交媒体渠道上提及\n\
  - 发布到盟友渠道\n- 在你的通讯中包含摘要或几段摘录\n- 举办活动，让作者展示作品并进行讨论\n\n所有这些都可以除了向那些专门要求接收新出版物通知的人发送公告之外进行。找到通过多用途内容扩展工作影响力的方法。\n\
  \n利用自动化通信来交叉推广你的组织的活动、服务和新闻。CiviCRM 会在用户采取行动时自动发送多条消息，例如活动注册确认电子邮件或捐赠收据。你可以自定义用于生成自动消息的模板。这些包括确认活动报名、感谢人们的捐款，以及在收到志愿者报名偏好时通知他们并表示感谢。\n\
  \n令牌，即联系人数据的合并字段占位符，可用于确保个性化信息如姓名和地址包含在收据中。通过将这些消息制作得超出随 CiviCRM 一起提供的默认版本，你可以利用它们讲述你的组织故事，寻求进一步参与，或争取更多支持。确保这些消息中的声音和语气合适。这些自动消息的主要目的应该是继续直接响应支持者的行动提供详细信息（例如收据）。在不劫持其主要目的的情况下，你可以将次要信息构建到这些消息中，以建立品牌并传达你的故事。例如，你可以将组织的标语或本月特色行动号召放入所有自动消息的页脚。\n\
  \n如上所述针对所有沟通，这些自动消息的写作风格或声音应适合你的组织的形象。例如，专业的商业语气可能会导致：“感谢您的捐款。您今年收到的所有慈善捐款的正式税务收据将在一月份发出。”对于面向青年的组织，更随意的风格可能更好：“感谢你帮助装饰大象公司。用\
  \ #deckdumbo 在推特上分享其他古怪的活动创意。”\n\nCiviCRM 为在线病毒式传播的几种经过验证的最佳实践提供了支持。例如，“转发给朋友”功能可以启用，并在支持者报名参加活动或完成捐赠后立即出现。通过提供邀请他人的机会，你利用了“动机-惯性”并通过支持者网络扩展组织的覆盖面。此外，大多数人如果同事或朋友能和他们一起参加活动会很高兴，或者想告诉他人他们刚刚捐赠给的事业。同样，在他们完成自己的捐赠后邀请人们为你的组织发起自己的个人筹款活动是一个很好的时机。\n\
  \n我们要表达的本质是需要有意且战略性地考虑你说什么、何时说、如何说，同时保持警惕以捕捉将沟通联系起来并扩展你的信息的偶然机会。\n\n### 行动号召\n\n\
  许多营利性营销和销售技巧在非营利部门请求捐赠、志愿者时间、活动出席、签署请愿书等方面效果很好。一种简单但重要的沟通技巧来提高响应率是拥有清晰、有说服力的行动号召。\n\
  \n\n\n\n\n将行动与具体的理想结果联系起来可以提高响应率。例如，一家紧急救援组织可能会传达，每一美元的捐款都能为地震灾区的一个孩子提供一天的食物。提高呼吁的紧迫性也能提高响应率：“如果你现在行动，那么[填入理想的结果]”或“如果你不现在行动，那么[填入不理想的结果]”。\n\
  \n通过图文并茂的图片、轶事和个人故事来调动受众的情感通常能极大地提高响应率。它们是演出中的主角。相比之下，使用统计数据和事实轶闻构建令人信服的理性论据则像是配角。它们最好用来丰富演出并帮助主角发光。\n\
  \n周围的沟通——文本、图形、音乐和视频——都应共同为采取行动构建论据。多次以视觉上吸引人且不同的方式重复行动呼吁会有帮助，例如粗体文本链接以及按钮。通过让完成行动变得更容易，你可以提高响应率。“点击这里”比让人们打印表格、找到支票簿、拿信封和邮票、然后寄出包含捐款的信件要有效得多。\n\
  \n## 强化你的品牌\n\n无论你是否意识到，你的组织在与世界互动时所做的一切都会影响其声誉。人们是否信任你的研究是扎实的，会向你寻求创新政策建议，或向你推荐志愿者？他们是否担心你会把捐款浪费在行政开销上？他们能否指望你为该议题争取媒体关注？他们是否对你的做法感到不舒服，因为它过于对抗或与反派过于亲近？你的品牌就是所有这些认知的总和。\n\
  \n了解人们如何看待你只是故事的一部分，更重要的部分是尚未发生的事情。你的组织希望被如何看待？改变组织的品牌能否提高其实现目标的效果？更明亮、更活泼的视觉形象会有帮助吗？更粗犷、低成本的形象呢？更保守、更精致的形象呢？\n\
  \n沟通活动是品牌的重要组成部分。通常会有更多人接收批量或广播式沟通，而不是直接通过你提供的项目和服务与你的组织互动。\n\n代表你的组织与利益相关者沟通的每个人都应了解他们的工作如何契合组织的整体目标。这样，他们就能在信息使用的语气、词语、图像、颜色和风格上把握好分寸。通过\
  \ CiviCRM 与利益相关者沟通，无论是一对一还是广播式，都应始终与组织的整体品牌和视觉形象保持一致。\n\n## 向一个或多个利益相关者发送电子邮件\n\n\
  CiviCRM 提供了直接从系统中发送电子邮件的工具，既可发送给少量联系人（单个利益相关者或少量利益相关者），也可发送给大量联系人。本章后面我们将更详细地介绍使用\
  \ CiviMail 广播电子邮件。简单、低量电子邮件与批量、大规模或广播电子邮件之间的界限并不总是清晰。广播电子邮件在你定期向数千名收件人发送信息时显然是合适的，因为你需要了解打开率和点击率，并根据该行为进行细分，而且你不希望手动处理列表中的无效电子邮件或处理暂时不可用的账户。\n\
  \n为了保持相对清晰，我们将非广播式电子邮件发送称为电子邮件发送，并遵循 CiviMail 的术语，即将广播电子邮件称为邮件发送，并且在处理批量或广播式电子邮件时始终明确指代\
  \ CiviMail 而非 CiviCRM。\n\n## 使用外部客户端发送电子邮件\n\n使用 CiviCRM 协助沟通最简单的方法就是直接点击它显示的任何电子邮件链接。例如，联系人摘要页面会将联系人的电子邮件显示为可点击的链接。这将启动你的电子邮件客户端，并将联系人的电子邮件填入收件人行。虽然这允许你在查看联系人记录时轻松发送电子邮件，但从整体\
  \ CRM 角度来看可能并不理想，因为电子邮件不会保存在 CiviCRM 中。幸运的是，CiviCRM 提供了多种工具来提高你在系统中直接记录电子邮件的能力。\n\
  \n系统内保留什么、不保留什么的问题对你的整体 CRM 策略很重要。并非所有与所有利益相关者的沟通都需要进入 CiviCRM。你必须权衡收集和拥有过多信息与过少信息之间的利弊。前者可能会造成额外的存储工作，并在系统中产生大量需要筛选的材料。后者可能导致使用其他脱线的离线数据源来存储和检索关键信息，或缺乏与利益相关者互动的历史记录。一旦你理清了这些问题，就制定政策和程序声明来指导员工，其中应包含明确的示例，说明什么应\
  \ definitely 从系统中包含或生成，什么不应包含。\n\n许多 CiviCRM 网站，也许是大多数，只跟踪发送给利益相关者的自动生成消息和广播电子邮件。有些可能会选择将少数手动生成的官方沟通记录到系统中，例如在\
  \ CiviGrant 中通知获奖者的电子邮件。其他人可能会尝试通过 CiviCRM 将所有电子邮件、面对面会议和电话记录汇集在一起，特别是案例管理领域。\n\n\
  制定只跟踪重要且有用的电子邮件的适当政策可能具有挑战性。我们都见过为安排会议的时间、日期和地点而产生的 14 条电子邮件往来。这些沟通可能内容庞大且没有持久的兴趣或意义。文件保留政策通常会区分不同类型的沟通，根据其是否具有持续的相关性或法律责任，规定适当较短或较长的保留期限。\n\
  \n你的关于将什么放入 CiviCRM 的政策不必因为相对容易捕获而包含所有电子邮件，也不应因为记录这些互动的工作量较大而排除电话和面对面交谈。利益相关者是否期望组织“记住”一次互动？如果是，它很可能属于\
  \ CiviCRM。\n\n为了使系统有用，并避免因本应存在于系统中却不存在而浪费大量时间，政策需要清晰且始终如一地执行。\n\n## 使用 CiviCRM 发送电子邮件\n\
  \n如前所述，除了提供可点击以在首选电子邮件客户端中打开的热链接电子邮件地址外，CiviCRM 还提供了直接从系统中向一个或多个利益相关者发送电子邮件的工具。假设你即将向应保存在\
  \ CiviCRM 中的利益相关者发送某物，有几种方法可以在不使用其广播电子邮件组件 CiviMail 的情况下调用 CiviCRM 中的联系人电子邮件。\n\n\
  要在显示电子邮件的搜索结果页面上向单个联系人发送电子邮件，请在该行的最右侧的更多链接上选择发送电子邮件。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_244_0.png)\n\
  \n要从搜索结果页面向多个联系人发送电子邮件：\n- 1. 选择一个或多个联系人，或选择全部记录单选按钮。\n- 2. 从 - 操作 - 按钮上的字母列表中选择向联系人发送电子邮件。\n\
  - 3. 点击前往按钮。\n\n第三，从联系人摘要页面，你可以点击操作 | 发送电子邮件。请注意，如果联系人没有电子邮件或其隐私选项表明不应向其发送电子邮件，则发送电子邮件操作不会显示为选项。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_244_1.png)\n\n最后，从系统中的任何页面，你都可以点击左侧边栏（默认块位置）中的新建按钮，然后选择电子邮件。\n\
  \n\n\n\n\nAll four approaches will bring up the following form for e-mailing via\
  \ CiviCRM:\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_245_0.png)\n\nWhile it seems\
  \ like a fairly standard e-mail form, let's go through it field-by-field to learn\
  \ about its special features:\n\n- **From**: This defaults to the primary e-mail\
  \ of the currently logged in user but also allows you to select from other e-mails\
  \ set up in **Administer | Configure | FROM Email Addresses**. This is particularly\
  \ useful for situations where there are departmental or functional e-mails (for\
  \ example, `info@example.org`, `volunteering@example.org`, `events@example.org`)\
  \ or where one staff member sends e-mails on another's behalf (for example, `ExecutiveDirector@example.org`).\
  \ The e-mail will be logged as an activity for all contacts specified in the **From,\
  \ To, CC, and BCC** fields.\n- **To**: The primary e-mail address of the contact(s)\
  \ to be e-mailed. If you arrived at this form through the contact record or search\
  \ results, the field will be populated with the originating contact(s) e-mail address.\
  \ If you arrived using the **Create New** button, you will need to search for the\
  \ contact(s) you wish to send to. You can add additional e-mails using the standard\
  \ auto-completion search functionality (name and e-mail).\n- **Add CC | Add BCC**:\
  \ These links provide auto-completion search fields and ensure that the e-mail activity\
  \ is added to the record of the relevant contacts.\n- **Subject**: In addition to\
  \ providing text that will appear unchanged on the subject line in people's inboxes,\
  \ you can use the Insert Token link to include information from a contact's record\
  \ that should be looked up and inserted into the subject line. This can include\
  \ either core fields such as a person's first name, or contact-type custom fields\
  \ that are specific to your installation of CiviCRM. The latter are included in\
  \ the alphabetized drop-down list of field names as **Custom Field Name :: Custom\
  \ Data Group Name**.\n- **Use Template**: E-mail templates are used in slightly\
  \ different ways in different parts of CiviCRM:\n  - Unlike automated message templates\
  \ generated from event signups, contribution pages, and other public facing forms,\
  \ templates selected when manually sending an e-mail will pre-populate the content\
  \ field and provide you an opportunity to manually edit the content before it is\
  \ sent out. As a result, the process is more like making and editing a copy of a\
  \ Word file than auto-generating a letter from a Word mail merge template.\n  -\
  \ Since it populates the field and then provides access to further edit the content,\
  \ you can take advantage of the tool by creating e-mail templates containing just\
  \ your design/layout branding, and also use it to create standardized responses\
  \ for common queries received by phone or mail. When creating your template, take\
  \ the time to test it thoroughly and ensure cross-client compatibility, including\
  \ reviewing how it will appear in web-based e-mail tools (Gmail, Hotmail, and so\
  \ on). It can take significant fiddling to get HTML-formatted e-mails to look consistent\
  \ in different e-mail clients, especially when you are trying to do sophisticated\
  \ formatting. By investing the time to create a well-constructed template, you will\
  \ save time for end users creating the e-mails and help ensure effective visual\
  \ branding.\n- **HTML Format**: CiviCRM ships with two popular WYSIWYG (what you\
  \ see is what you get) editors which support standard formatting tools when constructing\
  \ your e-mail. We find that Drupal users will typically use **CKEditor**, and Joomla!\
  \ users will select **TinyMCE**, as they are more commonly used in those respective\
  \ CMSs. Note that in CiviCRM v3.3, Joomla! users will be able to use the default\
  \ or user-specified editor installed in Joomla! and selected in **Global Configuration**,\
  \ which will significantly extend the options available. The following screenshot\
  \ refers to CKEditor. Some standard caveats apply:\n- While visually well-designed\
  \ HTML e-mails tend to improve readability, click-through, and response rates, it\
  \ is important to test and periodically retest how the e-mails are appearing in\
  \ popular desktop and web-based e-mail clients. Invalid HTML markup, such as unclosed\
  \ tags are red flags to spam checking software; so beware of inadvertently creating\
  \ deliverability problems by having someone who is not familiar with HTML doing\
  \ anything fancy in the HTML source view.\n- CSS used in your e-mail should always\
  \ be inserted directly in the HTML tags. Most e-mail clients don't support style\
  \ declarations inserted in tags through class and ID values.\n- Don't cut and paste\
  \ directly from Microsoft Word because it uses non-standard markup code. Invisible\
  \ to you when pasting, this markup code will often prevent your messages from appearing\
  \ correctly in your recipients' inboxes because it references Microsoft-specific\
  \ elements that are not widely supported. If you need to copy something from a Word\
  \ document, the easiest way to remove the problematic markup code is to paste using\
  \ the special Paste from Word or the Paste as Text icon. Paste as Word will attempt\
  \ to retain structural elements, such as bullet lists, whereas Paste as Text more\
  \ thoroughly strips all design and layout elements.\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_247_0.png)\n\
  \n- For an image to appear in your constituents' browsers properly, it needs to\
  \ be available on the Web somewhere. Generally, it is best to upload any image you\
  \ need in your e-mail to a publicly accessible part of your website, making note\
  \ of the URL that displays the image.\n- When referencing pages on your website\
  \ or inserting images, be sure to use the full URL (http://...), not a relative\
  \ path. Remember that the e-mail received by your constituents will not be directly\
  \ connected to your website, so relative path resources will be meaningless.\n-\
  \ There are a number of good resources (many of them free) for obtaining e-mail\
  \ templates that are compatible with most e-mail clients. Consider obtaining some\
  \ as the basis for your template and then modify to suit your organizational branding.\n\
  \n- 3. Select **Mailing Labels** on the **- actions -** button.\n- 4. Click on the\
  \ **Go** button, and then configure mailing label options as follows.\n- 5. Beside\
  \ **Select Label**, choose the Avery label type that you will be printing on (typically\
  \ indicated on the packaging). If you are not using an Avery product, look for an\
  \ indication showing which Avery number the labels are compatible with, as many\
  \ companies use the same dimensions. You can also look up the dimensions for the\
  \ available labels on the Avery site for your country (for example, http://www.avery.com\
  \ site does not list the A4-sized products that begin with L, and http://www.avery.fr\
  \ does not list the North American 8.5 x 11 ones).\n- 6. Choose the mailing **Location**\
  \ for each contact. Every contact must have one of its addresses marked as **Primary**.\n\
  - 7. Choose whether you want to remove contacts with the \"Do Not Mail\" communication\
  \ preference selected.\n- 8. Depending on how you have decided to enter and store\
  \ your data in CiviCRM, you may want to reduce postage charges either by choosing\
  \ to merge labels for contacts belonging to the same household, or by choosing to\
  \ merge labels for all contacts with the same address (a common need for organizations\
  \ that do not use **Household** contacts).\n- 9. Click on **Make Mailing Labels**\
  \ and save the resulting PDF download file to your hard drive.\n- 10. Print the\
  \ file. If you have a big printout, you might want to initially print only one page\
  \ to check the alignment of the text with the labels.\n\n## Recording a postal mailing\n\
  \nNormally, when you print a list of mailing labels, you're about to communicate\
  \ with those contacts. The process of generating mailing labels does not automatically\
  \ record the fact that you will be using it for a mailing. As a best practice, we\
  \ recommend creating an activity for your mailing recipients after generating mailing\
  \ labels as an effective way to retain a history of communication. The default installation\
  \ of CiviCRM does not include an activity type appropriate to postal mailings, so\
  \ the first step is to create such a type. Here are the steps to record mailings\
  \ at the same time mailing labels are printed:\n\n- 1. Create a Postal Mailing Activity:\n\
  \  - Click on Administer | Option Lists | Activity Types\n  - Click on Add Activity\
  \ Type\n  - Enter a suitable **Label**, such as **Postal Mailing**\n  - Enter a\
  \ suitable **Description**, such as **Postal Mailing**\n\n\n\n- 选择 **Contact** 作为\
  \ **Component**\n- 点击 **Save** 按钮\n\n2. 为每个包含的联系人记录一次 **Postal Mailing** 活动：\n\n\
  \   - 使用与创建邮件标签时完全相同的方法和标准查找联系人。如果您刚刚运行了邮件标签，可以点击面包屑中的 **Cancel** 按钮或 **Search Results**\
  \ 立即返回结果列表并执行后续操作。\n   - 在 **- actions -** 按钮上选择 **Record Activity for Contacts**。\n\
  \   - 选择 **Postal Mailing** 作为 **Activity Type**。\n   - 在 **Subject** 字段中输入邮件的名称，也许还在\
  \ **Details** 字段中添加描述。\n   - 打开 **Attachments** 字段集，并 **Browse** 上传您寄出的文件，例如 Word\
  \ 文档信件。\n   - 如有必要，打开 **Schedule Follow-up** 字段集并输入后续活动，例如 10 天后的一次电话。\n\n## Printing\
  \ a PDF letter\n\n大多数组织都熟悉合并信件的概念。与其创建一封写给“尊敬的支持者”的通用信件，您希望有一个个性化的问候语，其中包含个人的名字，例如“尊敬的\
  \ Sofia”。\n\n当成百上千封信件被制作时，发送一封带有个性化问候语和其他个性化内容、并装在上面有正确地址的信封中的信件绝非易事。大型直邮公司通常会有专门的机器同时打印个性化信件及其个性化信封，然后插入包含的内容并密封信封，所有这些都在严格定义的流程中进行，以消除元素不匹配的可能性。小型组织可能会举办信封填充“派对”，在那里信件被折叠，地址标签被贴上，折叠好的信件被装入信封，也许还有回邮信封或明信片，然后包装被密封并寄出。在所有这些活动进行的同时，如果没有大量的检查，很容易出现单个信封或信件被遗漏或不匹配的情况。\n\
  \n一种更容易处理且不易混淆的方法是使用窗口信封。信件以这样的方式排版和折叠，使得邮寄地址可以通过窗口显示。\n\n当标记插入到您的文档中时，它们将以方括号显示，并包含实际的数据类型和字段名称。您可以移动文档中的标记，但请确保不要更改方括号内的文本，否则字段引用将被破坏。\n\
  \n插入后，带有标记的页面可能如下所示：\n\n```\nDear {contact.first_name},\nI want to invite you to\
  \ our ...\n```\n\n经过 CiviCRM 处理后，标记将在信件的每份副本中被接收信件的每个联系人的名字所替换。例如：\n\n```\nDear\
  \ Josephine,\nI want to invite you to our...\n```\n\n以下是一些在组装信件时将具有特定用途和意义的标记：\n\
  \n- Display Name：为每个联系人记录生成，具体取决于记录类型。对于组织和家庭记录，组织/家庭名称用作显示名称。对于个人，显示名称默认计算为“first_name\
  \ last_name”。如果您的邮件包含多种联系人类型，则可以使用此字段来引用联系人而不管其类型。\n- Postal Greeting：这也是一个构造字段，旨在作为信件中的问候行。每个联系人类型都存在默认公式，并且会自动为每条记录创建并保存。您可以通过通信偏好面板逐个记录地更改此值。最常见的值是“Dear\
  \ name”。\n- Addressee：这也可在联系人的通信偏好面板中找到，表示联系人在地址块中将如何列出的计算值。\n- 以下标记允许您根据需要自定义信件的地址块：\n\
  \n  ```\n  {contact.addressee}\n  {contact.street_address}\n  {contact.supplemental_address_1}\n\
  \  {contact.supplemental_address_2}\n  {contact.city}{, }{contact.state_province}{\
  \ }{contact.postal_code}\n  {contact.country}\n  ```\n\n无论您是创建将多次使用的标准信件，还是想要一个带有标准字段的布局框架，很可能在某个时候您会想要将内容保存为可重用的模板。\n\
  \n您需要通过 Mailings | Message Templates 或 Administer | Configure | Message Templates\
  \ 创建模板。使用 User-Driven Messages 选项卡创建新模板。一旦在此处创建，它们将可用于 PDF Letter 工具。\n\n完成信件内容的撰写后，点击\
  \ Make PDF Letters 按钮生成 PDF 文件。务必彻底检查它，并确保您的标记已按预期呈现字段值。如果它们没有正确显示，请访问搜索结果中的其中一条记录，并确保这些字段实际上包含数据。然后，尝试使用弹出工具重新插入标记。\n\
  \n## Organizing groups for communication\n\n我们在本章中多次提到，为定期用于不同目的的联系人集合构建组是多么方便。第\
  \ 5 章 Collecting, Organizing, and Importing Data 解释了静态组和智能组之间的区别。对于静态组，成员要么由管理员明确添加或删除（例如董事会组），要么由他们自己添加或删除（例如选择加入的邮件列表）。对于智能或动态组，搜索标准定义了该组。随着与联系人相关的数据发生变化，它可能会根据定义的标准被添加到组中或从组中移除。智能组可能包含所有在下个月到期的会员，或在过去两年中总捐赠超过\
  \ $2500 的联系人。\n\n创建组的主要目的之一是轻松管理您正在沟通的记录段落。从功能上看，可以将此视为思考通信人员需要反复查找和选择的联系人。如果您的通信工作围绕定期发布的产品，例如月度新闻通讯，您将围绕接收这些产品的联系人列表来构建组。CiviCRM\
  \ 中存储的每个此类列表都是成为组的良好候选者。\n\n组织的其他部分也可能与一组利益相关者进行沟通，并且需要自己的 CiviCRM 组。志愿者管理、发展/筹款、会员、教育或活动都需要为他们处理的每个列表设置\
  \ CiviCRM 组。\n\n组对于 CiviMail 也是必不可少的，CiviMail 是 CiviCRM 的批量电子邮件工具。我们强烈建议批量电子邮件只能发送给选择加入该特定邮件的联系人，这使得这些列表的成员资格必须是自管理的。在某些司法管辖区，这正在成为法律。在从搜索生成智能组时，您可以轻松地适应移除选择退出联系人。其他形式的通信，如直邮和电话营销，也正朝着至少允许退出的许可模式发展。\n\
  \n## Communicating Better\n\n关于如何在 CiviCRM 中为通信实施组，有两个一般的经验法则。首先，使用选择加入的静态组订阅常规通信产品，如新闻通讯效果很好。这些自助订阅非常适合将人们带入漏斗的宽端。\n\
  \n其次，使用基于细分标准的智能组来针对某些利益相关者进行从漏斗一层到另一层的转化工作效果很好。例如，针对主要捐赠者的高接触、高成本方法应针对一组严格筛选的潜在客户。\n\
  \n要查看组当前是否已设置以便可用于电子邮件发送，或人们可以查看和控制其成员资格，请按照以下步骤操作：\n\n1. 点击 **Contacts | Manage\
  \ Group**。\n2. 在 **Group Type** 下，查看组是否设置为 **Mailing List**。只有配置为 **Mailing List**\
  \ 的组才会显示在 CiviMail 批量电子邮件界面中。\n3. 在 **Visibility** 下，查看组是否配置为出现在 **Public Pages**\
  \ 上。此可见性选项决定了该组是否会出现在包含组(s) 字段的个人资料页面中，以及是否会出现在 **Mailing List Subscription** 页面中。\n\
  4. 如果您想更改现有组的其中一个参数，请点击其行右侧的 **Settings** 按钮并进行所需更改。\n\n偶尔，为通信目的创建组层次结构会很方便。例如，一个按章节管理的组织在本地级别管理新闻通讯订阅，可能有一个发送给所有本地订阅者订阅者的中央通信产品。如果有数百个本地分会，例如政党中的选民协会，那么如果选择加入消息表明将向订阅者发送中央和本地新闻通讯，则将每个本地新闻通讯订阅者组设置为中央组的子组将非常优雅。用户将能够选择单个列表，员工无需担心列表不同步。\n\
  \n在如上所述编辑组的设置时，可以一次添加一个父组，方法是选择 **Add Parent** 字段中的组并点击 **Save**。同样，可以通过在 **Remove\
  \ Parent** 下选择组然后点击 **Save** 来删除父组。\n\n\n\n\n# 分页情况说明\n\n| 单位名称 |  |\n| --- | ---\
  \ |\n| 毕业设计/专题名称 |  |\n| 分页情况说明 | 请说明分页情况及原因 |\n\n要在CiviCRM中创建一个简单的新闻通讯订阅配置文件，并将其显示在Drupal或Joomla!网站的页面或区块中，请按照以下步骤操作：\n\
  \n- 1. 按照上一小节的说明，创建公开可见的**群组**。\n- 2. 点击**管理 | 自定义 | CiviCRM配置文件**。\n- 3. 点击**添加配置文件**。\n\
  - 4. 输入适当的**配置文件名称**。\n- 5. 在**用途**中保持勾选**配置文件**。\n- 6. 如果需要，输入帮助文本。\n- 7. 点击打开**高级设置**。\n\
  \n> 请注意，可以使用**将新联系人添加到群组？**功能将注册用户添加到邮件列表群组。但是，这样做将绕过双重选择加入功能。如果你选择使用此选项，请务必在页面帮助文本中说明用户将被添加到你的邮件列表中。\n\
  \n- 8. 将**Drupal用户账户注册选项？**更改为**不创建账户选项**。\n- 9. 将**发现重复匹配时如何处理**更改为**更新匹配的联系人**。\n\
  - 10. 点击**保存**按钮。\n- 11. 查看浏览器地址栏中的URL，并记下`gid=N`键值对中N的值。这是该配置文件的群组ID。\n- 12. 在**添加字段**表单中，对于**字段名称**，选择**联系人、电子邮件**和**主要**。\n\
  - 13. 我们倾向于将**字段标签**从**电子邮件（主要）**更改为**电子邮件**。\n- 14. 点击**必填？**复选框，使其处于勾选状态。\n- 15.\
  \ 将**可见性**从**仅限用户和用户管理员**更改为**公开页面**。\n- 16. 点击**保存并新建**按钮。\n- 17. 在新的**添加字段**表单中，对于**字段名称**，选择**联系人、群组**。\n\
  - 18. 将**字段标签**从**群组**更改为**订阅**。\n- 19. 将**可见性**从**仅限用户和用户管理员**更改为**公开页面**。\n- 20.\
  \ 点击**保存并新建**按钮以添加其他字段，如**名字、姓氏**和**邮政编码**，或点击**保存**按钮完成表单。\n- 21. 点击**管理 | 自定义\
  \ | CiviCRM配置文件**。\n- 22. 在新创建的配置文件所在行的最右侧，点击**更多**链接，然后选择**使用配置文件-创建模式**。此表单的URL可以添加到菜单中，以提供新闻通讯订阅页面。\n\
  - 23. 在Drupal中，确保**管理 | 用户管理 | 权限**中为**匿名用户**启用了**配置文件列表和表单**。\n- 24. 在Drupal中，如果你已向配置文件添加了自定义字段，请确保**管理\
  \ | 用户管理 | 权限**中为**匿名用户**启用了**访问所有自定义数据**。\n- 25. 在Joomla!中，创建一个新的CiviCRM菜单链接，选择**配置文件创建**选项，并从参数下拉列表中选择你的配置文件。\n\
  \n要创建一个小型表单区块而不是整页表单，请执行以下操作：\n\n- 1. 返回**管理 | 自定义 | CiviCRM配置文件**。\n- 2. 在新创建的配置文件所在行的最右侧，点击**更多**链接，然后选择**HTML表单代码片段**。\n\
  - 3. 点击**选择HTML代码**按钮，然后将所选内容复制到剪贴板。\n\n然后，如果你使用的是Drupal，请执行以下操作：\n\n- 1. 点击**管理\
  \ | 站点构建 | 区块**。\n- 2. 点击表单顶部的**添加区块**。\n- 3. 将剪贴板中的内容粘贴到**区块正文**文本区域。\n- 4. 可选：删除此区块中不需要的订阅相关HTML。\n\
  - 5. 可选：通过将隐藏的**postURL**输入字段的**值**更改为另一个有效的URL，来更改用户成功提交表单后跳转到的页面。\n- 6. 可选：通过向代码片段中添加`<input\
  \ type=\"hidden\" name=\"errorURL\" value=\"http://www.example.com/subscription_errors.html\"\
  >`，将错误显示位置从同页面的区块内更改为其他页面。\n- 7. 提供适当的**区块描述**和**区块标题**。\n- 8. 点击打开**输入格式**。\n-\
  \ 9. 选择**完整HTML**。\n- 10. 可选：更改**可见性设置**。\n- 11. 点击**保存区块**按钮。\n- 12. 在**已禁用**部分，找到你刚创建的区块所在行，然后将其区域从**<none>**更改为适当的区域。\n\
  \n或者，如果你使用的是Joomla!：\n\n- 1. 在上面**选择HTML代码**按钮生成的文本中，将操作URL更改为**使用配置文件-创建模式**表单的URL。\n\
  - 2. 可选：删除此区块中不需要的订阅相关HTML。\n- 3. 如果你使用**省/州**字段，请将`<option value=\"\">- select\
  \ -</option>`更改为在值中包含零：`<option value=\"0\">- select -</option>`。\n- 4. 在插入代码之前，确保将编辑器切换到查看源代码模式。\n\
  - 5. 根据需要在你Joomla!网站中使用该代码片段，例如在自定义HTML类型模块中。\n\n> Joomla!用户还可以使用Joomla!扩展目录（http://extensions.joomla.org/extensions/extension-specific/civicrm）中的CiviNews模块扩展。该模块包含新闻通讯（群组）注册所需的核心字段。\n\
  \n## 发送批量电子邮件\n\n既然我们已经设置了一个可以发送群发邮件的群组，并为网站访问者提供了订阅我们的新闻通讯和其他批量电子邮件订阅的方法，那么是时候使用CiviMail向所有已订阅的群组成员发送批量电子邮件了。\n\
  \n构建批量电子邮件消息涉及一个五步向导，你可以选择收件人、邮件选项、开发内容、预览/测试，然后安排邮件发送。在我们逐步完成这些步骤之前，先看看你可能需要审查和配置的一些额外工具和选项。\n\
  \n## 配置页眉和页脚\n\nCiviCRM支持创建多个页眉和页脚，用于插入到你的邮件中。它们可以与消息模板结合使用，也可以替代消息模板。尤其是页脚，在邮件中可能非常有用。\n\
  \n为了遵守美国CAN-SPAM法案，并遵循全球公认的邮件发送惯例，使用CiviCRM发送的每封邮件都必须包含两个特殊的邮件令牌：域名地址和选择退出（opt-out）URL或电子邮件令牌。我们还建议你包含群组取消订阅URL或电子邮件令牌。\n\
  \n理解“选择退出”（opt-out）和“取消订阅”（unsubscribe）之间的区别非常重要：选择退出意味着用户选择完全不再接收来自你组织的所有电子邮件；取消订阅则意味着他们选择不再接收某一特定的新闻通讯（他们将从相关群组中移除）。如果你的电子邮件中包含这两个链接，请务必精心准确地编写措辞。尽可能鼓励人们简单地从某个列表中取消订阅，而不是完全退出所有电子邮件。如果选择了后者，你可能在法律上有义务尊重联系人的请求。\n\
  \n页脚的作用在于提供一种有用的方式来收集这些必需的令牌，并确保它们一致地插入到你的邮件中。我们建议构建一个单一的默认页脚，其布局足够通用，可以与任何模板结合使用。页脚通常应包括组织名称、域名地址令牌、电话/电子邮件/网站以及选择退出/取消订阅令牌。\n\
  \n本章前面提到的可选元素包括你组织的标语/使命，以及可能定期更改的精选行动号召。请注意，选择退出/取消订阅令牌可以以URL链接的形式包含（将人们引导到你的网站，让他们确认操作），也可以以电子邮件地址的形式包含，由CiviMail的EmailProcessor脚本处理（更多详情请参见*第3章“安装、配置和维护”*）。我们建议使用URL形式，除非有明确的理由不这样做。通过使用URL，你可以强制人们在采取行动之前访问你的网站，这提供了一个机会来提醒他们你是谁、你做什么，并可能促使他们重新考虑退订请求。\n\
  \n要构建和编辑页眉和页脚，请执行以下步骤：\n\n- 1. 点击**管理 | CiviMail | 页眉、页脚和自动消息**或**邮件 | 页眉、页脚和自动消息**。\n\
  - 2. 点击**邮件页眉**行右侧的**编辑**链接（你也可以点击**新建邮件组件**按钮）。\n- 3. 根据需要自定义**正文 – 文本格式**和**正文\
  \ – HTML格式**字段的内容，特别是为后者包含视觉格式。\n- 4. 如果你使用页眉/页脚对来布局整个页面，请在页眉的**正文 – HTML格式**字段中包含`<html>`、`<head>`、`</head>`和`<body>`标签。然后在关联的页脚中关闭这些标签（`</body>`和`</html>`）。这样做将使用适当的HTML标签来框架你的电子邮件，并允许你将正文区域用于内容。\n\
  - 5. 考虑在正文中定义`<style type=\"text/css\" media=\"screen\">`，以定义用于格式化的内联CSS。\n\n\n\n\
  \n\n+   6. 要在电子邮件中包含图片，请使用指向公开可访问位置的绝对路径，例如：\n+   ```\n+   td.footer {\n+   background-image:url(\
  \ 'http://example.org/sites/example.org/themes/example/images/newsletter-footer-bg.gif');\n\
  +   }\n+   ```\n+   7. 单击 **Save**。\n+   8. 单击 **Mailing Footer** 行右侧的 **Edit**\
  \ 链接（你也可以单击 **New Mailing Component** 按钮）。\n+   9. 视情况自定义 **Body – TEXT Format**\
  \ 和 **Body – HTML Format** 字段的内容，特别是为后者添加视觉格式。\n+   10. 页脚是放置文本和令牌以允许用户退订邮件列表和/或您所有通讯的最佳位置。\n\
  +   11. 对于 **Body – HTML Format**，不要忘记 `</body>` 和 `</html>` 标签。\n+   12. 单击 **Save**。\n\
  \n## Configuring and sending bulk e-mails\n\n如前所述，实际构建群发电子邮件的过程是按照以下五步向导进行的：\n\n\
  +   1. 单击 **Mailings | New Mailing**。\n+   2. 在 **Name Your Mailing** 中输入值。\n+ \
  \  3. 使用高级多选工具根据需要包含/排除组以及包含/排除过去邮件的收件人。该工具通过双击或选择后单击附近的 **Add** 按钮，将选择项从左列移动到右列来工作。\n\
  +   4. 单击 **Next**。\n\n> 看不到您确信系统内存在的组？请记住，只有在组设置中标记为邮件列表的组才会在邮件界面中可用。\n\n+   5.\
  \ 可选地更改 **Tracking** 和 **Responding** 选择。这些选项涵盖了多个重要功能。启用 **Track Click-throughs?**\
  \ 将重写电子邮件内容中发现的任何网站链接，并将其路由通过 CiviCRM。系统随后可以记录用户何时访问链接，并在邮件报告中提供详细信息。这对于确定邮件的有效性是一个重要指标。**启用\
  \ Track Opens?** 将记录收件人是否打开了电子邮件。请注意，这是一个不完美的指标，但在衡量邮件工作的整体成功方面仍有帮助。启用 **Track Replies?,\
  \ Forward Replies,** 和 **Autorespond to Replies?** 将同样跟踪收件人采取的后续操作。\n+   \n+   6.\
  \ 单击 **Next**。\n+   \n+   7. 选择 **From Email Address**。这些可以在 **Mailings | From Email\
  \ Addresses** 或 **Administer | CiviMail | From Email Addresses** 中添加或更新。\n+   \n\
  +   8. 如有需要，从下拉列表中选择一个模板。执行此操作将填充主题和内容字段，您可以按需编辑。\n+   \n+   9. 在 **Mailing Subject**\
  \ 字段中输入电子邮件中将出现的主题行。\n+   \n+   10. 要么通过在 **HTML Format** 和 **Plain-Text Format**\
  \ 字段中输入内容来在屏幕上撰写，要么单击 **Upload Content** 并 **Browse** 上传文件。\n+   \n+   11. 如前所述，请确保在内容中包含\
  \ `{domain.address}` 和 `{action.optOutUrl}` 或 `{action.optOut}` 令牌之一。CiviCRM 要求这样做，以确保\
  \ CiviMail 不会被无意中以一种肯定会让您的网站被列入垃圾邮件黑名单，从而无法交付大部分电子邮件的方式使用。如果您未将其包含在推荐的标准页脚中，则它们必须出现在正文内容中（通常在\
  \ HTML 和文本版本中）。在 HTML 版本中，您可能希望将退订 URL/电子邮件令牌嵌入到带有用户友好文本的超链接 (a) 标签中。\n\n> 请注意，跟踪回复和转发功能需要\
  \ CiviCRM 的 `EmailProcessor` 脚本正常运行。请参阅 *Chapter 3, Installation, Configuration,\
  \ and Maintenance*，以全面了解随 CiviCRM 提供的 cron 作业脚本以及如何将其配置以满足您的需求。另请注意，您可以通过更改 `civicrm.settings.php`\
  \ 文件中定义的常量，将这两个选项设为默认启用。如果您计划定期使用这些选项，您将希望这样做，以避免为每次邮件手动打开它们。\n\n> 对退订令牌构建的 URL\
  \ 和电子邮件为何显示为长而看似毫无意义的值感到困惑？当 CiviCRM 生成电子邮件时，它会为退订令牌分配一个唯一值。这在用户选择退订时提供了回溯到电子邮件和联系人记录的连接。\n\
  \n+   12. 如果您计划将此电子邮件的布局/结构或内容用于未来的通讯，您可以将其保存为新模板。如果电子邮件基于现有模板，您可以通过单击相应选项来更新它。向导的此步骤也是您选择页眉/页脚和任何附件的位置。\n\
  +   13. 单击 **Next**。\n+   14. 强烈建议您始终发送 **Test Mailing** 并在群发前仔细检查。测试可以发送到单个地址或预定义的组。例如，您可能希望创建一个电子邮件测试组，由人员定期在发送前审查电子邮件。当首次使用新的或更改的群发电子邮件格式时，特别有用进行检查。这些检查应包括在各种电子邮件客户端和基于浏览器的电子邮件服务中查看消息的\
  \ HTML 和文本版本，如直接来自 CiviMail 的那样（例如 Outlook、Gmail、Hotmail 等），以及转发后查看。\n+   15. 在\
  \ **Send to This Address** 字段中输入您的电子邮件地址，和/或从 **Send to this Group** 列表中选择适当的测试组。\n\
  +   16. 单击 **Send a Test Mailing**。\n+   17. 当您对测试邮件满意时，单击 **Next**。\n+   18. 选择立即发送或安排邮件在稍后的日期/时间发出。在这两种情况下，都必须运行\
  \ cron 作业才能发送邮件。\n+   19. 请注意，您必须取消选择 **Send** 才能注意到计划的邮件发送时间。\n+   20. 单击 **Submit\
  \ Mailing**。\n\n此时，邮件进入 CiviMail 队列。它不会在邮件脚本 (`civicmail.cronjob.php`) 运行之前实际发送。通常，这将作为服务器上的\
  \ cron 作业设置，并安排在定期间隔轮询队列并启动邮件。理解邮件的处理需要时间。最初会有延迟，因为邮件不会在下一次 cron 作业运行之前开始。此后，CiviCRM\
  \ 将根据您的托管环境和资源允许的速度处理邮件。\n\n## Managing mailings in process\n\n启动邮件后，您可以通过以下方式监控其状态：\n\
  \n+   1. 单击 **Mailings | Scheduled and Sent Mailings**。\n+   2. 单击感兴趣的邮件行右侧的 **Report**\
  \ 链接。\n\n您可以通过以下方式取消或删除正在交付过程中的邮件：\n\n+   1. 单击 **Mailings | Scheduled and Sent\
  \ Mailings**。\n+   2. 单击感兴趣的邮件行右侧的 **- more -** 链接，然后单击 **Cancel** 或 **Delete**。\n\
  +   3. 取消将停止进一步发送。无法召回已发送的电子邮件；它只是在您取消时停止邮件进程。\n+   4. 删除会停止进一步发送并从 CiviCRM 中删除有关邮件的现有数据。\n\
  \n一旦实际邮件进程启动，您就可以开始查看邮件报告。它会随着邮件的进行定期更新新信息。点击打开和点击通过的指标通常会在邮件发送后几天内发生变化。组成员可能会收到电子邮件，注意到它，但在收到几天后才可能通过点击其中的链接进行后续操作。\n\
  \n报告本身提供了邮件的关键指标和详细信息的快照。这包括成功投递数、退信数、点击打开数、点击通过数（包括每个链接的列表以及是否为唯一点击），以及发送邮件的联系人列表的链接。它还提供了消息的副本和您选择的邮件选项记录。\n\
  \n\n\n\n\n## 沟通更佳\n\n以下截图来自一封实际的邮件（部分组织特定信息已做模糊处理）。请注意，**Delivery Summary** 部分中的分类项目全部是超链接。例如，你可以点击点击链接查看在你的邮件中至少点击了一个链接的邮件联系人列表。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_264_0.png)\n\n## 创建批量电子邮件模板\n\n如果你已经安排或发送过一封与你需要发送的类似的批量电子邮件，那么你可以复制并修改它。这实际上将其用作邮件设置和消息内容及格式的模板。方法是点击\
  \ **Mailings | Scheduled and Sent Mailings**，然后点击感兴趣的邮件所在行右侧的 **Re-use** 链接。\n\n\
  你可以在邮件流程的第三步中根据消息内容和格式创建模板，如前所述。模板也可以独立于邮件向导构建，方法是访问 **Mailings | Message Templates**。请注意重用过去的邮件与从模板创建邮件之间的区别。前者会复制所有设置，包括收件人选择和邮件设置，而后者仅预填充邮件主题和正文区域。\n\
  \n开始创建批量电子邮件模板，可以通过重用现有的批量邮件或使用上述步骤创建新的邮件。然后按如下操作：\n\n- 1. 在向导第 3 步 **Mailing Content\
  \ (step 3 of 5)** 中，确保已选择 **I want to Compose On-screen**。\n- 2. 在 **Compose On-screen**\
  \ 字段底部，点击选择 **Save As New Template**。在出现的 **Template Title** 字段中，输入模板的适当名称。如果你的电子邮件基于现有模板，你也可以选择更新它而不是创建新模板。\n\
  \n你可以使用 **Mailings | Message Templates** 工具管理现有模板。请注意，这些模板将同时可用于 CiviMail 批量电子邮件和基本发送电子邮件活动。\n\
  \n## 自定义系统工作流消息\n\n在 *Chapter 3, Installation, Configuration, and Maintenance* 中，我们概述了如何设置\
  \ CiviCRM 发送电子邮件。一旦完成，CiviCRM 会作为其工作流程的一部分自动发送大量消息。标准安装中提供的这些消息的文本和格式基本且可用。在初始配置期间，你应考虑自定义这些消息以符合你组织的沟通风格。或者，虽然更不专业但更容易的做法是等到出现问题后再更改默认的自动消息模板。当你或你的用户开始看到工作流消息的语气或润色与组织其余通信不完全一致时，你可以找到有问题的消息模板并对其进行修改。\n\
  \n流程始于记录有问题的文本，确定应替换的内容，找到适当模板中的文本，然后将其替换为新文本。\n\n我们本书记载了基本工作流模板工具。然而，在此节点上再次回顾是值得的，因为这些自动消息无疑是你的整体沟通策略的一部分。一方面，它们的主要目的是提供有关活动注册、在线承诺或案例记录等事件的详细信息，因此内容自然主要集中于传达必要细节。然而，正如前面所述，这些消息也提供了与对组织明显有承诺的人以不同方式分享你的信息机会。此外，品牌的核心是一致性。如果从系统中生成的所有电子邮件都有某种外观和感觉，除了自动回复电子邮件，你就有损耗你所建立的品牌的风险。\n\
  \n工作流消息模板通过 Mailings | Message Templates，从 System Workflow Templates 选项卡访问。模板的标题非常清晰；点击相应行的\
  \ Edit 以访问内容。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_266_0.png)\n\n编辑并保存模板后，该行将多出两个操作选项：Revert\
  \ to Default 和 View Default。由于这些模板的自动化功能，它们应构建正确并包含必要的字段非常重要。如果你编辑模板后发现它不再正常工作，你可以查看默认版本（以便比较）或恢复到它并重新实施你的编辑。\n\
  \n我们即将描述的编辑需要比本书大多数其他材料更高的技术专业知识。好消息是，通过恢复到默认设置，很容易修复你破坏的任何东西。尽管如此，如果你想进行比我们描述的更复杂的更改，你可能希望让一名沟通文字润色者、平面设计师和技术熟练的\
  \ HTML 编码员共同合作。\n\n模板内容乍一看可能令人不知所措，因为它包含许多条件语句（{if/else}）、HTML 和字段变量。工作流电子邮件使用 Smarty\
  \ 模板系统来呈现字段值并对内容执行操作和计算。\n\nSmarty 的功能远超我们在用户驱动电子邮件中看到的基本令牌替换。这些系统模板在许多情况下利用了这种功能。为了编辑更复杂的系统模板，了解如何识别安全更改的内容、更改可能破坏系统模板的内容以及如果出现问题如何恢复到默认模板是有帮助的。我们的目标不是学习如何在\
  \ Smarty 中使用更具编程性的功能，而是学习如何编辑编程结构中混合的文本字符串。\n\n让我们简要查看一个经常受益于编辑的常用消息模板：**Contributions\
  \ – Receipt (on-line)**。如果我们点击其 **Edit** 链接，我们可以使用 **Plain-Text** 格式字段中的前 15 或 20\
  \ 行内容来说明如何定制这些文件。我们看到以下内容：\n\n```\n{if $receipt_text}\n{$receipt_text}\n{/if}\n\
  {if $is_pay_later}\n==================================================\n{$pay_later_receipt}\n\
  ==================================================\n{else}\n{ts}Please print this\
  \ receipt for your records.{/ts}\n{/if}\n{if $amount}\n==================================================\n\
  {ts}Contribution Information{/ts}\n```\n\n一旦确认电子邮件处理正确，你应设置一个 cron 作业定期处理该 URL。一旦就位并测试通过，任何人只需抄送或密送\
  \ activefiler@example.com 电子邮件地址，即可让其电子邮件自动归档到 CiviCRM。\n\n> 当脚本处理电子邮件时，联系人的匹配是基于电子邮件地址进行的。如果电子邮件地址在系统中不存在，将创建新的联系人记录。这很容易在你的系统中创建不完整的联系人记录。因此，你应仅将此电子邮件地址用于员工；切勿公开暴露该电子邮件地址，以免风险将不良记录填充到你的数据库中。\n\
  \n## 总结\n\n本章概述了如何使用 CiviCRM 改善你与组织利益相关者的沟通方式。第一部分关注的是沟通应如何与组织的整体 CRM 战略保持一致的更广泛主题。\n\
  \n后续部分逐步从向一个或少数几个利益相关者发送电子邮件，到向数百或数千人发送批量电子邮件。重点并非全部在于电子邮件沟通。我们还研究了如何使用 CiviCRM\
  \ 打印邮寄用的标签、将这些邮件记录为所有收件人的活动（包括信件的软拷贝），以及打印个性化信件。\n\n我们随后研究了使用 CiviCRM 配置文件构建列表的策略，以使用户能够订阅批量电子邮件产品，如报纸。在以食谱式格式实施配置文件时，我们考虑了\
  \ Drupal 和 Joomla! 安装中存在的差异和选项。\n\n随着列表的建立和与利益相关者的沟通，CiviCRM 分组的角色变得更加清晰。为此，我们回顾了将利益相关者组织成用于沟通工作的群组的基本策略。\n\
  \n本章以一些对整体沟通品牌和有效性很重要的松散主题结束。我们回顾了 CiviCRM 生成的自动消息，并简要介绍了 Smarty 模板如何用于构建它们。\n\n\
  使用随 CiviCRM 提供的脚本，我们设置了一个电子邮件邮箱，可由系统轮询并将电子邮件作为联系人记录中的活动处理（基于 FROM、To 和 CC 字段）。这是一种将员工的桌面电子邮件客户端软件（以及日常沟通）与\
  \ CRM 连接起来的强大方式。\n\n在下一章中，我们将研究使用 CiviCRM 支持非营利部门筹款的多种方式。\n\n\n\n\n"
- "# 7 筹款：为您的使命筹集资金\n\n为了完成其使命，非营利组织需要资金来支付运营费用（工资、租金、办公室及其他费用），并支持推动组织宗旨的项目和计划。本章将重点介绍如何使用CiviCRM通过捐款筹集资金以支持这项工作。此外，我们还将涉及其他形式的收入来源，例如撰写拨款申请、会员发展和产品或服务的销售。\n\
  \n积极筹集资金的需求对于非营利和倡导领域的许多人来说，是希望可以忽略的。他们在非营利领域工作或志愿服务的原因是这一领域以使命为导向，而非以利润为底线。尽管如此，您的组织需要资金来实现其使命，而通过捐款筹集部分或全部资金通常至关重要。幸运的是，CiviCRM擅长帮助组织筹款。\n\
  \n本章面向筹款人、为其提供IT、通信和其他服务支持的人员，以及他们的上级如执行董事。为了帮助您更好地使用CiviCRM筹款，本章大量穿插了有关筹款方法以及如何使用CiviCRM的章节和提示。在为筹款目的而营销您的组织及其服务和产品时，您也会发现其他章节很有用，尤其是那些讨论联系人定向、沟通和外联技术的章节。\n\
  \n在本章中，我们将介绍：\n\n- 制定筹款计划\n- 选择在线支付处理器\n- CiviContribute和CiviPledge的初始配置\n- 手动记录捐款和认捐\n\
  - 查找、检查和处理捐款及认捐\n- 实施筹款呼吁\n\n在本章的第一节中，我们概述了如何制定筹款计划以及CiviCRM在制定和执行该计划中的作用。如果您只对了解如何在筹款活动中管理和操作CiviCRM感兴趣，可以跳过开头部分。如果您希望快速让在线捐款上线运行，请从选择支付处理器的部分开始，然后直接进入关于创建在线捐款页面的最后一节。创建并获批支付处理器账户可能需要几天或几周的时间，而其余配置只需几分钟或几小时。如果您仅将CiviCRM用于线下筹款，则不需要支付处理器，但仍需按照第三节中的讨论配置CiviCRM进行筹款。\n\
  \n### 制定筹款计划\n\n较大的非营利组织可以受益于聘请一两名拥有筹款与发展学位或文凭的员工，他们知道如何制定和实施适合组织的筹款计划。较小的组织则可能受益于聘请筹款专家作为顾问来帮助进行规划。不幸的现实是，许多中小型非营利组织将这一责任交给未受过专门培训的人员，并且由于优先事项相互竞争，往往无法为他们提供足够的培训预算。如果这正是您组织的写照，那么请计划购买一本筹款书籍，或花几个晚上在谷歌上搜索如何制定筹款计划。\n\
  \n筹款计划的模板会因作者和组织类型而异。常见要素包括：\n\n- 组织使命的一个版本\n- 对组织历史和当前筹款情况的分析\n- 一份总结捐赠理由的陈述\n\
  - 筹款的短期和长期目标，通常按捐赠类型或筹款计划细分\n\n为期一到三年的高层计划将被转化为工作计划，通过布置任务并设定具体时间表，在不同的渠道实施项目和呼吁。\n\
  \nCiviCRM的报告和分析工具可以帮助您进行分析。捐赠的理由将支撑为各种计划开发的创意材料（如文本、图形等），这些材料将包含在CiviCRM面向公众的筹款页面中。\n\
  \n### 按类别细分\n\n市场细分是根据某些特征和属性将潜在捐赠者受众进行划分的过程。这样做使您能够定制信息和沟通方式，从而更有效地触达市场的每个细分群体。用筹款术语来说，按（略有重叠的）类别划分捐赠收入的常见方式有：\n\
  \n- 一次性捐赠\n- 预先授权的每月捐赠\n- 大额捐赠和计划性捐赠\n- 遗产或遗赠捐赠\n- 纪念性捐赠（悼念或致敬）\n- 活动（通常按活动细分，例如“Run\
  \ for the Cure”、拍卖会或晚宴）\n- 会员资格和订阅\n- 企业赞助、会员资格和合作伙伴关系\n\n其他形式的筹款对您的组织可能也很重要，包括向基金会或政府撰写拨款申请，或举办竞赛。此外，一些非营利组织还通过销售品牌商品（如T恤或杯子）获得筹款收入。\n\
  \n本章重点介绍为非营利组织筹集最多资金的筹款细分领域，并涉及如何使用CiviCRM支持其他筹款类别。\n\n资本募捐活动和特别募捐呼吁可能会收到属于上述任何类别的捐款。然而，将这些活动的收入在筹款计划和账户中单独列项通常很有用，因为筹集这些资金的方法及其既定目的通常与正常运营的持续筹款不同。\n\
  \n在“使用高级搜索统计潜在支持者”一节中，我们将探讨在现有捐赠者和联系人数据库中统计潜在支持者的实用方法。\n\n### 按渠道细分\n\n筹款的主要渠道（方式）有：\n\
  \n- 直邮\n- 电话营销\n- 在线\n- 直接对话或面对面\n\nCiviCRM可以在所有这些渠道中提供帮助。这些渠道中会用到CiviCRM的不同活动，我们将逐一用专门章节介绍。\n\
  \n培养潜在支持者对于良好的CRM和筹款策略至关重要。线下世界存在着优秀的潜在支持者发展渠道，包括媒体活动、广告和宣传册留件。您应该考虑在CRM和筹款计划中赋予其他渠道重要角色。CiviCRM可以协助通过这些渠道进行定向。但是，请确保您的CRM和筹款计划不是以如何使用CiviCRM为核心，而是以根本的发展战略为核心。\n\
  \n一些次要渠道，如直接响应电视和自助服务终端，将不予讨论。用CiviCRM支持它们可以被理解为电话营销（呼入而非呼出）和直接对话的变体。短信消息将作为在线筹款的延伸进行简要介绍。\n\
  \n### 项目\n\n筹款项目通常定义为让某一细分捐赠者群体采取某种行动的主要目标。每个项目可能包含一个或多个活动，其中一项活动可能围绕单一呼吁展开多次沟通，例如通过电子邮件、直邮和电话营销在会员资格到期前提醒续费。\n\
  \n您可能希望在筹款计划中包括的常见项目类型如下。只有拥有庞大人员的大型发展办公室才能在许多独立项目上做得很好。较小和较新的运营机构应该少一些项目。我们认为，潜在支持者发掘项目对于所有筹款计划都至关重要，并且我们鼓励那些已有续费项目但没有月度捐赠项目的机构考虑启动后者。\n\
  \n在每种项目类型下方，我们缩进列出了典型的战略考虑或建议方法，用于拟定或改进项目。这些建议并不适用于所有人，但可能有助于您集思广益，找到适合您组织筹款计划的方法：\n\
  \n\n\n- **开发潜在捐赠者**（获取新捐赠者，通常最多只能收支平衡）：通过特别的“感谢”以及额外沟通，告知组织如何使用捐赠款项，有助于培养这些关系。\n\
  - **首次续捐**：首次捐赠者应得到额外关注，以鼓励第二次捐赠并巩固持续捐赠关系。\n- **持续续捐**（从去年捐赠者处获得新的捐赠）：鼓励捐赠者升级捐赠金额，超过上次的捐赠。\n\
  - **将一次性捐赠者转化为月捐者**：多次捐赠者（过去一年内捐赠超过一次）和多年捐赠者是此类项目的良好潜在对象。\n- **升级月捐者**：在一年月捐和定期沟通组织如何使用捐赠款项之后，可考虑请求升级到更高级别。\n\
  - **开发大型捐赠者俱乐部潜在对象**（例如，为每年捐赠超过 1000 美元的人设立的总统俱乐部）：投入时间和资源设立大型捐赠者俱乐部，为 VIP 提供特殊访问权限、活动等，是奖励和激励更高捐赠水平的好方法。过去的年度总捐赠额以及关于捐赠能力的情报是创建此潜在对象细分的好方法。\n\
  - **在大型捐赠者俱乐部之间升级**：年底为额外一次性捐赠发起的呼吁，将接近下一俱乐部级别的联系人提升至该级别是有效的。利用俱乐部福利鼓励更大额的月捐也是标准做法。\n\
  - **特别呼吁**：当有事件得到广泛新闻报道或有机会应对重要机会/威胁时，特别呼吁可能很有用。如果使用过于频繁，它们会变得无效。\n- **资本项目**：这些项目应经过研究和规划，以确保项目成本得到覆盖并达到筹款目标。资本项目通常是多年、多方面的努力。\n\
  - **续捐流失的月捐者**：这是一项高收益活动，有助于解决信用卡到期和捐赠者变更银行账户等问题。\n- **续捐流失捐赠者**：另一项长期收益良好的项目。您可能会发现按最近捐赠年份顺序电话营销流失捐赠者是划算的，直到每位续捐捐赠者的成本达到获取新捐赠者的成本为止。\n\
  - **致谢项目**：通过感谢电话和礼物表达对捐赠的感激，可能是一项良好的投资。\n\n## 资金、捐赠者和潜在对象\n\n根据筹款项目的目标金额，可使用行业标准来制定不同层级的捐赠者数量和所需的潜在对象数量。这形成了一个金字塔，顶端少数捐赠者提供大部分资金，底端众多捐赠者提供总量的较小部分；通常，活动中\
  \ 80% 的资金由 20% 的捐赠者提供。这种反向曲线在许多组织和捐赠层级中都存在，并且很可能体现在您组织中按捐赠者计算的总捐赠中。例如，加拿大 25% 的慈善捐赠者提供了\
  \ 82% 的总捐赠额（http://www.statcan.gc.ca/daily-quotidien/090608/dq090608a-eng.htm）。\n\
  \n在 Google 上搜索“gift range calculator”会得到前 10 个结果中几个不错的结果。单笔最高捐赠额可能是活动筹集总金额的 10%\
  \ 到 25%。通常，随着捐赠额减半，预计捐赠次数会翻倍或增加三倍。将捐赠额减少四分之一或三分之一而不是减半来划分层级，并相应减少预计捐赠次数，是一种方便的做法。\n\
  \n成熟的筹款项目可以预期从较大捐赠中获得更高比例，而较新的项目可以预期更依赖较小捐赠来满足其目标的更大比例。\n\n在传统的资本和主要礼物筹款中，您需要大约四名潜在对象（您有理由相信他们可以在该层级捐赠的联系人）对应于某一层级的每笔捐赠。更复杂的礼物范围计算器会考虑潜在对象在某一层级最终以较低层级捐赠的可能性；这会降低礼物范围金字塔中较低层级预计所需的潜在对象数量。\n\
  \n一系列沟通和外联活动被部署以将活动潜在对象转化为捐赠者，例如电子邮件、信件、电话、会议等。这些呼吁的转化率都远低于 25%。沟通的类型、数量和顺序计划通常因细分而异，高价值细分会获得更高接触的沟通方式，如个人拜访、会议和电话营销。从低价值捐赠中筹集大量资金通常需要更多自动化和更少的人力投入。志愿者时间对于非营利组织来说往往是宝贵的资源，最好用于更高价值的活动。\n\
  \n## 基准测试\n\n在制定筹款计划或审查现有计划时，将其与基准和调查进行比较很有用。直接邮件仍然是大型成熟非营利组织筹款的主力，根据最近的一项研究，带来了超过\
  \ 80% 的捐赠（http://www.slideshare.net/artzeinteractive/artez-interactive-from-donor-acquisition-to-fundraising-performance-benchmarks-for-nonprofits）。然而值得注意的是，平均在线捐赠额以及在线捐赠者对组织的五年价值都大于直接邮件捐赠者。\n\
  \n关于需要联系多少名单以产生一定数量捐赠的计划假设，可以根据基准进行校准。通常，低接触/低成本的沟通渠道转化率较低。例如，一项最近的调查发现，电子邮件筹款转化率为\
  \ 0.13%（http://www.e-benchmarksstudy.com/2010.html），而向以前捐赠者名单发送的直接邮件捐赠征集的转化率平均约为一到两个百分点。好的调查提供可操作的建议，例如该调查建议专注于提高点击率以加入表现最佳的电子邮件筹款者行列。\n\
  \n到目前为止，本节主要关注筹款规划的自上而下方法，从筹款目标向下推算到每个细分所需的潜在对象数量。CiviCRM 有许多报告可分析贵组织在筹款方面的表现，正如我们将在下面的\
  \ *Reporting* 部分以及本书其他部分所述的报告中看到的那样，例如活动、会员和沟通章节中的章节。这些报告提供了贵组织历史数据的自下而上分析，应以两种方式与自上而下规划的结果相结合：\n\
  \n- 首先，您应将贵组织的指标与上述提到的基准进行比较，以帮助识别优势和劣势领域。规模较大的调查往往数据更可靠，而针对您所在行业和地区的调查尽管样本较小，但可能提供更合适的比较。这些比较应有助于提供更一般的\
  \ SWOT 分析（内部优势和劣势，以及外部机会和威胁）的要素，以指导您的筹款计划。我们过去在标准指标上表现更好或更差了吗？我们知道原因吗？我们如何解决我们的弱点并利用我们的优势？\n\
  - 其次，您应按细分审查现有捐赠者基础，以确定计划中假设的潜在对象数量是否可行。您的计划可能需要调整，以包括通过名单租赁、潜在对象开发活动（如要求董事会成员审查他们的联系人名单）或研究您所在地区或对您所在行业感兴趣的高净值个人来改善潜在对象名单规模的行动。在考虑所有这些选项后，您可能会决定需要提高或降低特定细分或项目的筹款目标。\n\
  \n本章的其余部分将解释如何使用 CiviCRM，特别是其 CiviContribute 组件来实现您的筹款计划。由于通过活动和会员及订阅筹集资金的特殊性，以及\
  \ CiviEvent 和 CiviMember 组件提供的特殊支持，后续章节将专门讨论如何使用 CiviCRM 进行这些类型的筹款。\n\n## 选择支付处理器\n\
  \nCiviCRM 可用于有或无在线捐赠处理的筹款。例如，您可以使用 CiviCRM 支持直接邮件和电话营销运营，并要求在线捐赠者邮寄支票。您也可以在不设置支付处理器的情况下在线接受实物捐赠。然而，当您实施完全集成的在线支付系统时，软件的强大功能和潜力才能更好地实现。\n\
  \n一些组织在开始使用 CiviCRM 时继续使用外部在线捐赠系统，这涉及将交易转移到 CiviCRM，以便将其用作细分和报告的集中式 CRM。鉴于使用 CiviContribute\
  \ 处理在线捐赠的便捷性，这种方法很麻烦。\n\n大多数进行在线捐赠、活动注册以及会员和订阅付款的组织都会发现，在 CiviCRM 中设置在线支付处理是值得的。\n\
  \n支付处理器，有时称为支付网关，有助于将付款从付款人转移到您，收款人。CiviCRM 依赖处理器完成将银行和信用卡/借记卡公司连接起来的复杂工作，以确保资金从捐赠者账户正确转移到您的账户。CiviCRM\
  \ 核心团队和 CiviCRM 社区已为约十几个支付处理器创建了插件。每个处理器的信息以及其中一些的配置页面链接可在 http://wiki.civicrm.org/confluence/display/CRMDOC32/CiviContribute+Payment+Processor+Configuration\
  \ 上找到。为了使用 CiviCRM 进行在线财务交易，您需要选择其中一个支付处理器，为其开设账户，并配置 CiviCRM 与其配合使用。\n\n\n\n\n\n\
  如果你刚开始入门，正在尝试在多个可用的支付处理器中做出选择，选择支付处理器时需要考虑的因素之多可能会让人感到困惑。我们建议从确定哪些处理器在你的国家可用开始做出决定。对于大多数\
  \ CiviCRM 用户来说，你会有多种选择。\n\n你也可能会发现没有任何处理器在你的国家可用，或者你想使用一个尚未得到支持的处理器。例如，你可能正在使用支付处理器用于你的销售点终端或支票处理，并希望将在线支付处理添加到你与他们的现有账户中。开发新的\
  \ CiviCRM 支付处理器插件的说明是可用的（访问 http://wiki.civicrm.org/confluence/display/CRMDOCT2/Creating+Additional+Payment+Processor+Plugins）。\n\
  \n大多数支付处理器都会提供技术文档来帮助开发人员为 CiviCRM 等软件包创建插件，因为这会增加他们的业务量。有各种顾问可以帮助你和社区为其他支付处理器创建和支持插件（http://civicrm.org/professional）。如果你发现使用不同的处理器有令人信服的理由，其他人也可能想使用它。\n\
  \n电子商务网站，包括接受非营利组织捐赠的网站，以以下两种图表所示的两种常见方式与支付处理器交互：\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_279_0.png)\n\
  \n在第一种架构中，电子商务网站本身通过在后台与支付处理器通信来安全地处理信用卡或其他财务账户信息，同时用户等待付款处理。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_279_1.png)\n\
  \n## 筹款：为你的使命筹集资金\n\n第二种方法是一种低端方法，其中电子商务网站与提供自己的用户[content]\n\n如果你刚开始入门，正在尝试在多个可用的支付处理器中做出选择，选择支付处理器时需要考虑的因素之多可能会让人感到困惑。我们建议从确定哪些处理器在你的国家可用开始做出决定。对于大多数\
  \ CiviCRM 用户来说，你会有多种选择。\n\n你也可能会发现没有任何处理器在你的国家可用，或者你想使用一个尚未得到支持的处理器。例如，你可能正在使用支付处理器用于你的销售点终端或支票处理，并希望将在线支付处理添加到你与他们的现有账户中。开发新的\
  \ CiviCRM 支付处理器插件的说明是可用的（访问 http://wiki.civicrm.org/confluence/display/CRMDOCT2/Creating+Additional+Payment+Processor+Plugins）。\n\
  \n大多数支付处理器都会提供技术文档来帮助开发人员为 CiviCRM 等软件包创建插件，因为这会增加他们的业务量。有各种顾问可以帮助你和社区为其他支付处理器创建和支持插件（http://civicrm.org/professional）。如果你发现使用不同的处理器有令人信服的理由，其他人也可能想使用它。\n\
  \n电子商务网站，包括接受非营利组织捐赠的网站，以以下两种图表所示的两种常见方式与支付处理器交互：\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_279_0.png)\n\
  \n在第一种架构中，电子商务网站本身通过在后台与支付处理器通信来安全地处理信用卡或其他财务账户信息，同时用户等待付款处理。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_279_1.png)\n\
  \n## 筹款：为你的使命筹集资金\n\n第二种方法是低端方法，其中电子商务网站与提供自己面向用户页面的外部支付处理器交互。在这种方法中，你的电子商务网站计算需要支付的金额，然后将用户发送到支付处理器的安全网站，在那里处理付款，之后支付处理器网站将用户发送回电子商务网站。\n\
  \n如果配置正确，两个系统都会以安全加密的方式传输信用卡号码等敏感信息。由于 CiviCRM 不存储有关交易的敏感信息，因此这两种方法都提供了良好的电子商务安全性。\n\
  \n虽然两种方法都可行且有效，但两者各有利弊：\n\n| | 外部托管 | 内部托管 |\n|---|---|---|\n| 需要购买和设置 SSL 证书 |\
  \ 否 | 是 |\n| 信用卡数据存在潜在安全风险 | 极低 | 很低 |\n| 可在低端共享主机上使用 | 是 | 否 |\n| 需要保持服务器安全 | 高\
  \ | 很高 |\n| 失去你的视觉品牌 | 是 | 否 |\n| 捐赠者可能暴露于可能令人讨厌的支付处理器信息 | 是 | 否 |\n| 易用性 | 较差 |\
  \ 更好 |\n\n我们建议除最低交易量网站外，使用提供内部托管的支付处理器。如果你是在线支付新手，还不知道你的支持者会产生多少交易量，请考虑在你能够评估响应并确定内部托管是否值得额外成本之前实施更简单的外部托管解决方案。\n\
  \n内部托管要求你获得并设置 SSL 证书，因为你的网站必须与用户的浏览器安全通信以处理他们的信用卡详细信息。外部电子商务托管，即将用户转移到支付处理器的网站以处理交易，使用他们的\
  \ SSL 证书进行保护。\n\nSSL 是一种通信协议，允许用户的浏览器与你的服务器通信而无需任何人窃听。它通过使用特殊密钥安全地加密往返的信息来实现这一点。互联网用户越来越熟悉这样一个事实：地址开头为\
  \ `http://` 的页面不安全，而以 `https://` 开头的页面可以是安全的。浏览器在显示安全页面时也会显示一个小锁图标：\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_280_0.png)\n\
  \n随着 SSL 证书商品化，SSL 证书的成本继续下降，安装的便捷性也在不断提高。像 **RimuHosting** 这样的托管提供商重新销售 **RapidSSL**\
  \ 证书，最低仅为 40 美元，包括安装。安全公司继续努力创造对具有更多功能的高价 SSL 产品的需求，例如用于你网站的动态“由...认证”徽标、在浏览器地址栏中显示你的组织名称，以及更高级别的担保。尝试为你选择的证书物色一个好价格（http://www.namecheap.com/ssl-certificates\
  \ 在撰写本书时是一个不错的来源）。\n\n在考虑不同的支付处理器时，还有其他因素需要考虑，例如支持哪些信用卡、不同选项的成本，以及是否支持诸如定期捐款等高级功能。我们认为，以牺牲可用性为代价来节省支付处理器的费用很少有意义，因为仅仅几个丢失的捐款通常比节省的费用更“昂贵”。然而，提供相同可用性水平的支付处理器的成本往往存在显著差异。这些差异高度取决于捐款的数量和规模以及使用的是哪种信用卡或其他支付工具。\n\
  \n可能在成本中发挥重要作用的一个因素是支付处理器是否要求你拥有商户账户。这些通常涉及银行的单独费用，尽管有时它们可能捆绑到支付处理器的费用中。自动将资金转入你的商户账户，而不是要求定期手动干预从支付处理器的账户中取出资金，对于交易量较高的组织来说可能很有用且物有所值。\n\
  \n以下是比较不同选项成本时应询问的一些费用，即使对于某些处理器和/或商户账户来说它们可能很小：\n\n- 初始支付处理器账户设置费\n- 初始商户账户设置费\n\
  - 设置和批准支付处理器和商户账户所需的咨询或员工时间\n- 支付处理器和商户账户的固定月费和/或年费\n- 支付处理器和商户账户按收费金额百分比收取的佣金，有时对更高交易量有折扣\n\
  - 支付处理器和商户账户的每笔交易费用\n- SSL 证书第一年的费用和年度续费费用\n- 新证书和续订证书的 SSL 安装费用\n\n声称具有非营利或慈善地位的组织似乎会受到额外的安全审查。此外，如果你的银行账户名称与你的\
  \ PayPal 账户名称不完全匹配，你可能难以提取资金，因为 PayPal 不会将以 John Smith 名义的 PayPal 账户中的资金释放到 Judy\
  \ 和 John Smith 名下的银行账户。显然，资金被冻结或在不确定的时间内无法使用可能会对你的正常运营造成重大问题。\n\n我们建议尽早开始设置支付处理器账户和商户账户（如有必要）。这可能需要几天或几周才能完成，并且可能需要提供组织的成立文件，这些文件可能存放在保险箱中，以及非营利地位的官方认证。\n\
  \n### 初始筹款配置\n\nCiviCRM 中有两个组件专门用于筹款事务：CiviContribute，处理捐款；以及 CiviPledge，设计用于预授权付款或承诺未来付款。本节描述如何配置它们。\n\
  \n由于 CiviContribute 支持 CiviEvent 和 CiviMember 组件的财务方面，因此你需要配置它以记录或接受活动注册、会员资格和订阅的付款，即使你的组织不接受纯捐款而只接受作为此类事项交换的付款。\n\
  \n### 配置 CiviContribute\n\n配置 CiviContribute 的第一项任务是如果尚未启用则打开该组件：\n\n1. 点击 **Administer\
  \ | Configure | Global Settings | Enable CiviCRM Components**。\n2. 如果 **CiviContribute**\
  \ 出现在左侧列中，突出显示它，然后点击 **Enable**。\n3. 点击 **Save**。\n\n接下来，确保有关捐款的信息在整个系统中的适当位置显示：\n\
  \n1. 点击 **Administer | Configure | Global Settings | Site Preferences**。\n2. 确保\
  \ **Contributions** 已为 **Viewing Contacts**、**Contact Search** 和 **Contact Dashboard**\
  \ 选中。\n3. 点击 **Save**。\n\n\n\n\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_285_0.png)\n\
  \nCiviCRM 目前还存在一个限制：它只能将会员资格或活动报名归因于单笔贡献付款。不过，目前正在扩展数据模型，以支持部分付款以及其他簿记和会计增强功能。这有可能用于针对单个“购买”（例如活动报名）记录多笔不同付款，每笔付款都有自己的贡献类型。随着该功能的开发，请关注\
  \ CiviCRM 博客以获取更多信息。\n\n## 配置付款工具\n\nCiviCRM 将有关付款方式的信息存储为付款工具信息。付款工具即支付方式，例如支票、现金、EFT（电子资金转账）、信用卡和借记卡。您的组织很可能不会支持所有这些默认工具来接收付款。\n\
  \n要查看和调整付款工具：\n\n- 1. 点击 **管理 | CiviContribute | 付款工具**。\n- 2. 要**禁用**或**删除**某个付款工具，请点击相应付款工具右侧的对应链接。\n\
  - 3. 要编辑付款工具，请点击其名称右侧的**编辑**链接，然后在各字段中输入或调整值，并点击**保存**。\n\n## 配置可接受的信用卡\n\n有一个单独的界面用于指定可接受的信用卡（例如\
  \ Visa、Amex）。不要将付款工具与个别信用卡类型混淆。尤其是，不要为每种信用卡创建单独的付款工具。相反，请执行以下操作：\n\n- 1. 点击 **管理\
  \ | CiviContribute | 可接受的信用卡选项**。\n- 2. 要**禁用**或**删除**某个信用卡选项（如 Amex），请点击相应信用卡选项右侧的对应链接。\n\
  - 3. 要添加类型，请点击**添加可接受信用卡**按钮并输入相关信息。\n\n在设置系统时，请务必查看您的支付处理器的选项和限制，以确认他们接受哪些卡类型。\n\
  \n## 配置支付处理器\n\n为了在线接收付款，CiviCRM 要求您配置一个支付处理器，如本章前面所述。不同的支付处理器具有不同的参数、选项和设置说明。要确定如何使用特定的支付处理器设置和测试您的账户，请访问\
  \ http://wiki.civicrm.org/confluence/display/CRM_DOC32/CiviContribute+Payment+Processor+Configuration，点击您的支付处理器的名称，并按照相关说明操作，或联系处理公司以获得更多指导。\n\
  \n> 在未来版本中，支付处理器集成将通过扩展机制来处理。随着该系统的实施，您可能需要在 http://wiki.civicrm.org 上的其他地方搜索您的支付处理器的名称。\n\
  \n要配置 CiviCRM 以配合支付处理器工作，请按照以下步骤操作：\n\n- 1. 点击 **管理 | 配置 | 全局设置 | 支付处理器**。\n- 2.\
  \ 根据您的支付处理器的说明，为**在线**和**测试付款**输入**名称**，或许还有**描述**和**处理器详细信息**。\n- 3. 点击**保存**。\n\
  \n如果您选择的支付处理器要求您的网站拥有 SSL 证书，您需要购买并安装一个。如果您使用的是托管服务提供商，他们很可能会推荐首选证书并提供收费的安装服务。如果您没有提供此项服务的托管安排，您需要让具备系统管理技能和足够服务器访问权限的人员来安装它。技术流程因操作系统和证书颁发机构而异，对于缺乏系统管理经验的人来说并非易事。\n\
  \n低端和中端 SSL 证书仅支持单个域名或子域名。这包括区分域名的根形式和 www 形式。例如，用于 https://www.mydomain.org 的证书不适用于\
  \ https://mydomain.org，反之亦然。您可以购买并安装两个域名的证书，或者购买价格更高、涵盖两者的通配符证书。\n\n- 1. 在一个贡献页面上运行一两笔小额测试付款，该页面可以按照本章末尾*创建在线贡献页面*部分所述进行配置。\n\
  - 2. 确保付款被支付处理器接收。\n- 3. 验证资金是否正确存入您的银行账户，无论是自动还是手动方式（视情况而定）。\n\n请注意，PayPal 和其他一些支付处理器的沙盒环境比其生产系统更难使用，因此直接在其真实服务器上使用真实付款进行配置和测试可能更快、问题更少。\n\
  \n此时让您的簿记员检查相关事项也是个好主意，以确保他们能够将在线付款正确整合到您的会计流程中。有时，支付处理器将在线付款与销售点终端的付款进行批处理的方式可能会存在问题，从而难以跟踪。您可能需要审查如何将\
  \ CiviCRM 中存储的特定交易与银行账户中的存款可靠地关联起来，反之亦然。要查看可能对此有所帮助的报告，请点击**报告 | 簿记交易报告**。\n\n##\
  \ 配置赠品\n\n赠品是可以提供给捐助者以鼓励他们捐款的感谢礼物。它们通常被用作激励更多人捐款的手段。例如，任何捐赠 50 美元的人都可以获得一个带有您组织标志的咖啡杯，而捐赠\
  \ 100 美元的人可以选择获得一件带有标志的 T 恤。所有赠品都在站点范围内指定，然后才能在特定的 CiviContribute 页面上启用。通过启用赠品的贡献页面捐款的捐助者始终可以选择不接受赠品。通过使这些礼物成为可选项，您可以减少在不想要的赠品上浪费资源。\n\
  \n使用 CiviCRM 进行筹款并不需要配置赠品，如果您刚刚开始，您可能应该专注于更基本的核心功能。当特定的募捐活动开始使用赠品或新的赠品时，您需要配置或重新配置站点范围内的赠品选项，然后才能为特定页面启用它们。以下是添加赠品的方法：\n\
  \n- 1. 点击 **管理 | CiviContribute | 赠品（感谢礼物）** 或 **贡献 | 赠品（感谢礼物）**。\n- 2. 点击**添加赠品**。\n\
  - 3. 在各字段中输入应显示给潜在捐赠者的信息，从**名称**开始。\n- 4. **描述**可以是促销文字，也可以只是解释性说明。\n- 5. 如果该商品在您网站的其他地方有售，**SKU**\
  \ 会很有用。\n- 6. 对于**赠品图片**，使用“从以下网址使用显示图片和缩略图”选项来显示您自己网站上的产品图片（例如，在 Drupal Ubercart\
  \ 商店中），这样可以防止商店图片更新时这些图片不同步。\n- 7. **最低捐款金额：** CiviCRM 将在启用赠品的任何地方强制执行此最低金额，如果有人索取赠品但捐款未达到此金额，则会显示错误消息。如果您想在不同的贡献页面上为同一商品设置不同的最低捐款金额，您可以为该商品创建另一个赠品。\n\
  - 8. **市场价值：** 某些司法管辖区要求仅对排除所提供任何赠品的公平市场价值后的金额开具可抵税的慈善收据。如果这适用于您的组织，并且此赠品将用于接受可抵税付款的页面，请在此处输入一个值。\n\
  - 9. **产品实际成本：** 在此处输入一个值，以改进对提供赠品的净回报以及整体吸引力的计算。\n- 10. **选项：** 提供逗号分隔的选项列表，例如尺寸或颜色。逗号分隔的列表会忽略换行符，因此一行中最后一个逗号之后的文本会与下一行开头的文本连接在一起，直到遇到逗号。如果您想为产品的两个方面（例如颜色和尺寸）提供选项，则必须将每个组合作为单独选项输入，或者进行一些自定义编程。\n\
  - 11. **订阅或服务设置。** 自定义编程可以利用此处收集的信息，在您的 CMS 中提供对可下载文件（如报告或歌曲）的临时访问权限，或提供对 CiviCRM\
  \ 管理的会员资格或订阅的访问权限。或者，工作人员可以在收到捐赠的电子邮件或其他通知后手动管理此类福利。\n- 12. 点击**保存**。\n\n您可以随时返回添加、修改、禁用或删除赠品。如果赠品在多个贡献页面之间共享，请务必在开始编辑之前了解任何修改的影响。\n\
  \n## 配置价格集\n\n价格集用于构建更复杂的捐赠级别选项集。在大多数情况下，您将创建简单的捐赠级别列表，并包括让捐赠者输入自己自定义金额的选项。但是，如果您需要多组选项或基于数量的购买，则可以使用价格集。\n\
  \n\n\n\n\n## 配置 CiviPledge\n\nCiviPledge 是 CiviCRM 的一个组件，用于支持对定期付款的非强制性承诺。这与 CiviCRM\
  \ 也支持的定期捐款不同，后者实际上会在支付处理商处创建授权记录，以便按定期自动转账资金。相比之下，承诺是承诺通过多次定期付款支付固定金额的承诺。\n\n例如，您的组织可能会鼓励现有捐赠者通过承诺每月付款来增加其年度总捐款，您将该付款与相应的月度需求相关联。无家可归者收容所可能会发起一项为期一年的“每月提供五顿饭”的活动。总年度捐款为\
  \ 240 美元，由 20 美元的月付款组成。\n\n当创建承诺记录时，它包括承诺的捐款总额和付款条款，即付款次数和频率（12 次 20 美元付款）。然而，它只是付款的承诺。CiviCRM\
  \ 提供了用于跟踪付款、发送提醒以及提供在线付款表单的有用工具。随着捐赠者在定期捐款中履行其承诺，您将付款记录在承诺记录中并跟踪其进度。一旦所有付款都收到，承诺记录可以关闭。\n\
  \n在实施承诺注册之前，您必须启用该组件（默认情况下处于禁用状态）。点击 Administer | Configure | Global Settings |\
  \ Enable CiviCRM Components 并将 CiviPledge 从左侧列移动到右侧。\n\n您可以通过 Contribution Page\
  \ 设置来配置将发送给捐赠者在下次付款到期日前提醒捐赠者的自动承诺提醒电子邮件，在此您也可以指定用于承诺的表单。但是，您还必须配置 cron 作业以定期检查各个承诺记录的状态和到期日期，并触发电子邮件。请参阅第\
  \ 3 章，安装、配置和维护，了解配置 cron 作业的完整讨论。\n\n## 手动记录捐款\n\n现在我们已经配置了 CiviContribute 并对关键功能选项有了工作知识，我们可以开始查看如何记录捐款记录。学习如何在此阶段手动记录捐款的部分原因是，它将提供有关捐款存储的丰富信息的更好认识。这将为更好地理解在线捐款页面自动记录捐款时发生的自动化奠定基础。\n\
  \n记录离线捐款最简单的方法是手动记录。“离线”一词可能有点误导或令人困惑；它用于区分直接在线接收和处理的付款（例如，信用卡付款）和通过其他离线方式接收的付款。这包括任何未由在线支付处理商处理的捐款类型。示例包括在办公室收到的现金、实物商品和服务、通过邮件收到的支票、通过呼叫中心收到的网站外的信用卡和借记卡捐款，这些捐款通过销售点（POS）设备处理，或在银行分行进行的电子资金转账（ETFs）。\n\
  \n要手动记录捐款，请从主菜单点击 **Contributions | New Contribution** 或 **Create New** 按钮。从联系人记录中，您可以点击\
  \ **Actions | Add Contribution**，或点击 **Contributions** 选项卡然后点击 **Record Contribution\
  \ (check, Cash, EFT...)**。如果为您的网站配置了集成的支付处理商，您将看到 **Submit Credit Card Contribution**\
  \ 的选项。该表单几乎相同，只是它将包含所需的信用卡相关字段并触发实际的付款交易。\n\n按如下方式填写字段：\n\n- 1. 如果添加捐款的方法没有在 **Contributor**\
  \ 旁边产生只读名称，则开始在 **Select Contact** 字段中输入姓名或电子邮件的一部分。从自动填充的结果列表中选择一个联系人。\n- 2. 如果无法从联系人搜索中找到做出捐款的联系人，请点击\
  \ **Create new contact** 并选择其中一个联系人类型选项。这将打开一个弹出表单，您可以在其中输入有关联系人的基本信息并保存记录。\n- 3.\
  \ 选择适当的 **Contribution Type**。\n- 4. 输入 **Total Amount** 和货币类型。如果您之前创建了价格集，您将有选择它的选项以从可用选项中进行选择。\n\
  - 5. 可选输入 **Source**。这旨在帮助您追踪捐赠者/捐款的来源。如果留空，CiviCRM 将用一些相关数据填充它，例如谁输入了捐款。\n\n> 当您选择联系人类型时出现的模态弹出表单由保留配置文件控制。您可以在\
  \ CiviCRM 中每当选择此 **Create New** 联系人选项时修改您希望收集的字段。转到 **Administer | Customize | CiviCRM\
  \ Profile** 后，点击 **Fields** 旁边的 **New Household**、**New Individual** 或 **New Organization**\
  \ 之一。\n\n- 6. 在 **Received** 旁边输入日期和 **Time**。要删除收到日期，请点击 **Time** 字段右侧的 **Clear**\
  \ 链接。如果留空，CiviCRM 将用当前日期填充该字段。\n- 7. 选择适当的 **Paid By** 值，或留空表示实物捐赠。\n- 8. 如果 **Paid\
  \ By** 设置为 **Check**，请输入 **Check Number**。\n- 9. 在 **Transaction ID** 中，如果存在唯一的交易标识符，例如银行转账号码，则输入；否则留空。\n\
  - 10. 如果捐赠者档案中存在电子邮件，您将有通过电子邮件向其发送收据的选项。如果未选中，或如果没有电子邮件存档，您可以输入 **Receipt** 日期和\
  \ **Time**。如果通过电子邮件发送收据，这些值会自动填写。\n- 11. 选择适当的 **Contribution Status**，例如如果承诺的支票尚未收到，则为\
  \ **Pending**。\n- 12. 在 **Soft Credit To** 中，输入姓名或电子邮件的一部分或全部并从结果列表中选择一个联系人。软记分的概念是承认另一位捐赠者在争取和获得此捐款方面的作用。例如，如果您知道\
  \ John Doe 是通过与 Jane Johnson 的交谈决定向您的组织捐款，您可以使用此字段为 Jane 记分。如果联系人应为捐款获得软记分且尚未在数据库中，请在另一个选项卡中创建联系人，然后返回并在此字段中进行搜索。\n\
  \n此时，您已完成了捐款记录的最基本要素。如果您为捐款创建了任何自定义字段，它们将出现在这些初始字段下方，可以通过点击标题面板进行展开。点击 **Additional\
  \ Details** 以打开其他字段选项。\n\n- 1. 输入有关捐款的 **Notes**，如有。例如，“**在十二月再次联系他，看看他是否想在年底前再做一次可抵税捐款**”。\n\
  - 2. 输入捐款的 **Non-deductible Amount**。例如，如果您输入的是价值 350 美元的葡萄酒拍卖付款 500 美元，在加拿大不可抵扣金额为\
  \ 350 美元。\n- 3. 输入 **Fee Amount**，如有。例如，处理 ETF 的 $-1.25 银行费用。\n- 4. 输入 **Net Amount**，按\
  \ **Total Amount – Fee Amount** 计算得出。\n- 5. 输入 **Invoice ID**，如有。这可能是您会计软件生成的发票号码。\n\
  - 6. 输入 **Thank-you Sent** 的日期和大致 **Time**。\n\nCiviCRM 支持致敬/纪念捐款。点击 **Honoree Information**\
  \ 以打开字段集。当捐款是为另一人致敬或纪念时，会为受赠者创建联系人记录，并且捐款将显示在其记录中（作为致敬/纪念他们）。\n\n- 1. 点击 **In Honor\
  \ of** 或 **In Memory of** 之一。如果选择错误，请点击 **Clear** 以将其删除。\n- 2. 输入受赠者的 **First Name,\
  \ Last Name, Email** 和 **Prefix**。\n\n如果您创建了奖励，您将有一个可以打开的 **Premium Information**\
  \ 面板：\n\n- 1. 如适用，选择捐赠者请求的 **Premium**。\n- 2. 如果 **Premium** 有选项，请选择捐赠者偏好的选项。\n\
  - 3. 如果奖励已运送或交付给捐赠者，请输入其 **Fulfilled** 日期。\n\n完成表单后，点击 **Save** 保存捐款，**Save and\
  \ New** 保存后立即调出同一表单以输入另一笔捐款，或 **Cancel** 放弃记录而不保存。\n\n## 导入捐款\n\n与 CiviCRM 的其他区域一样，您可以通过界面直接将捐款数据导入系统。通过主菜单访问此工具\
  \ **Contributions | Import Contributions**。我们不会花时间逐步讲解该过程，因为它与我们在 *第 5 章，收集、组织和导入数据*\
  \ 中导入联系人时概述的步骤非常相似。但是，在导入捐款时，您应该了解一些细微差别：\n\n- - 导入模式允许两个选项——**insert** 捐款或 **update**\
  \ 捐款。这些是互斥的——如果插入，所有记录都将是新的；如果更新，您必须在 .csv 文件中包含一个捐款 ID 列，该列与系统中的现有记录匹配。更新选项不会在未找到匹配项时简单地创建新记录。\n\
  - - 如果插入新记录，您应该在导入文件中提供足够的联系人数据，以确保联系人尽可能与现有联系人记录匹配并合并。\n- - 与捐款相关的某些字段是必需的，包括捐款类型和总金额。\n\
  \n\n\n\n\n与联系人导入类似，我们建议先导入少量数据并仔细检查，然后再导入非常大的数据集。字段映射可以保存并重复使用，从而简化导入、测试和完整导入流程。还要注意服务器资源限制，这可能会限制单次导入的记录数。如果导入文件非常大，您可能需要将其拆分为较小的部分进行导入。\n\
  \n## 手动创建承诺\n\n如前所述，CiviCRM 中的承诺是对未来进行一次或多次付款的承诺。承诺在收到第一笔付款前处于待处理状态，收到后状态变为进行中。一旦所有付款都已收到，其状态将变为已完成。如果其中一笔或多笔承诺付款逾期，承诺的状态不会发生变化。因此，可以将承诺视为多个承诺的捐赠记录的容器。\n\
  \n如果某人承诺支付 360 美元，分 12 个月等额支付，每月间隔一个月，CiviCRM 会将其视为一个承诺，包含十二笔 30 美元的付款（捐赠）。\n\n\
  要手动创建承诺，请点击 CiviContribute | Pledges | New Pledge，或使用 Create New | Pledge。或者，从联系人摘要页面，点击\
  \ Actions | Add Pledge，或点击 Pledges 选项卡并点击 Add Pledge 按钮或链接。\n\n- 1. 如果添加承诺的方法未在\
  \ Select Contact 旁显示只读姓名，请在该字段中开始输入姓名或电子邮件的一部分。从自动填充的结果列表中选择一个联系人。\n- 2. 如果承诺的联系人无法通过联系人搜索找到，请点击\
  \ Create new contact 并选择其中一种联系人类型选项。这将打开一个弹出表单，您可以在其中输入联系人的基本信息并保存记录。\n- 3. 在 Total\
  \ Pledge Amount 字段中输入所有付款总额的值。\n- 4. 输入付款期数（承诺分期）和每个期间的长度（每日、每周、每月或每年），例如，每 1 个月、每\
  \ 2 周。输入总承诺金额和分期付款期间后，CiviCRM 将计算出每笔分期付款的金额。\n- 5. 如有需要，将 Payments are due on the\
  \ [] day of the period 的值更改为 1 以外的其他值，例如，如果每月付款将在月中进行，则更改为 15。\n- 6. 如果承诺是在记录之前做出的，请相应地回溯\
  \ **Pledge Made**。\n- 7. 如果付款开始日期与记录承诺的日期不同，请调整 **Payments Start** 日期。\n- 8. 如果联系人留有电子邮件，点击\
  \ **Send Acknowledgement** 向其发送承诺详情的电子邮件。如果您选择通过邮件发送确认，请使用 **Acknowledgement Date**\
  \ 字段记录发送时间。如果使用电子邮件选项，日期将自动填写。\n- 9. 点击 **- select -** 旁边的 **Self-service Payments\
  \ Page** 并点击可用的适当捐赠页面。如果选择，链接到该捐赠页面的链接将包含在承诺提醒电子邮件中。用户随后可以使用该页面提交在线付款，并将捐赠归属于承诺。这非常有价值且重要，因为它为终端用户提供了一种直接将付款与承诺关联的方式。\n\
  \n与捐赠记录一样，捐赠者可能会为某人提供承诺以示尊敬或纪念。与捐赠记录一样，与承诺关联的任何自定义字段都将在此时在其自己的字段集面板中显示以供填写。\n\n\
  点击 **Payment Reminders** 标题展开字段集面板并配置提醒电子邮件。请记住，此功能取决于 cron 作业的配置，该作业应每晚运行并管理承诺状态更新和电子邮件提醒。\n\
  \n- 1. 配置何时发送初始提醒：**Send Initial Reminder [] Days prior to each scheduled payment\
  \ due date.**\n- 2. 如果您希望发送多次提醒，请将 **Send up to [] reminders for each scheduled\
  \ payment** 设置为大于 1 的值。\n- 3. 将 **Send additional reminders [] days after the last\
  \ one sent** 设置为不超过最大提醒次数。\n\n只有在可以向承诺捐赠的人发送邮件时，才会发送承诺提醒。如果联系人没有电子邮件、电子邮件无效，或他们已被管理员或自己标记为\
  \ **Do not e-mail**，则不会发送提醒。\n\n在您审阅并完成记录后，点击 **Save** 或 **Save and New**。点击 **Cancel**\
  \ 可在不保存的情况下退出记录。\n\n保存后，花点时间查看 CiviCRM 如何构建和显示承诺记录。如前所述，承诺本身是单个承诺付款的容器。这在联系人的 **Pledges**\
  \ 选项卡中有所体现，单个承诺行会展开以显示各个计划和已完成的承诺付款。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_298_0.png)\n\
  \n在您收到与承诺相关的捐赠时，重要的是通过此界面记录它们，而不是通过主捐赠选项卡（CiviCRM 在 **Contributions** 选项卡上放置了提醒以提供指导）。由于跟踪承诺进度和状态的本质涉及查看承诺付款记录的实际收款，因此您需要确保捐赠与承诺适当关联。\n\
  \n如果捐赠者逾期付款、提交的付款与计划不同，或请求更改付款条款（例如延长付款期限），请使用 **Edit Scheduled Payment** 链接修改记录。\n\
  \n## 搜索、检查和处理捐赠\n\n到目前为止，我们主要集中精力了解与筹款相关的关键配置选项，以及在联系人记录中处理单个联系人和承诺记录。在本节中，我们将批量处理捐赠记录，并回顾通过\
  \ CiviCRM 实施筹款技术的“配方”。在学习本节的过程中，我们还将突出显示值得注意的功能或如果处理不当可能会出现意外结果的地方。\n\n## 查找捐赠\n\
  \n虽然您经常会直接通过联系人记录处理捐赠，但您很可能会花费大量时间搜索和报告批量捐赠记录。例如，您可能需要定期了解一段时间内收到的捐赠数量，例如上个月或年初至今。您可能需要导出所有类型为“Donations”的捐赠，以便为税务目的发送年末对账单。或者，您可能希望筛选出捐赠金额超过特定阈值的捐赠者，并将他们归类为主要捐赠者，通过邮寄和电子邮件以独特的方式针对他们。\n\
  \n与 CiviCRM 中的其他功能区域一样，您可以使用组件搜索 **Contributions | Find Contributions** 或通过 **Advanced\
  \ Search** 中的 **Contributions** 面板进行这些搜索。字段选项相同，但结果却大不相同。组件搜索始终返回组件记录，而 **Advanced\
  \ Search** 默认返回联系人记录。这意味着如果 John Doe 有三笔符合我标准的捐赠，我将在 CiviContribute 组件搜索中看到三条记录（因为返回的是不同的捐赠记录），而在\
  \ **Advanced Search** 中只会看到一条（代表联系人记录）。此外，操作，例如使用配置文件导出和批量更新将反映来源。例如，在 **Find Contributions**\
  \ 工具中，您将能够导出捐赠详情。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_299_0.png)\n\n> 在\
  \ CiviCRM v3.3 中，**Advanced Search** 工具扩展为允许您通过此界面检索相关记录。使用 **Display Results As**\
  \ 下拉菜单，您可以选择检索联系人（默认）、活动、捐赠或活动注册记录。与使用组件搜索相比，其优势在于能够在多种类型的数据中添加标准，但检索联系人的相关记录在不同区域。例如，我可以检索所有具有\
  \ **Employee of** 关系的个人自 2004 年起成为会员的捐赠。\n\n\n\n\n\n以下截图展示了查找贡献工具中可用的选项：\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_300_0.png)\n\
  \n在很大程度上，这些选项都相当直观且不言自明。我们将简要介绍它们：\n\n- **贡献者姓名或电子邮件**：可以是部分匹配。\n- **贡献日期 – 从和至**：这将搜索收到贡献的日期（通常是记录的日期）。\n\
  - **贡献金额从和至**：在“从”字段中视为大于或等于，在“至”字段中视为小于或等于。\n- **贡献状态**：选择已完成、待处理、已取消和失败中的一项或多项。\n\
  - **支付方式、支票号码或交易ID**：如果为“支票号码”指定了值，请确保“支付方式”字段留空或选中“支票”；否则将不会返回任何结果。\n- **未发送收据？**：这在生成要接收收据的贡献者列表时很方便。\n\
  - **未设置感谢日期？**：如果选中，则将不会返回已设置**感谢日期**的贡献，从而提供需要发送“感谢信”的结果。如果未选中，则无论**感谢日期**中的值如何，都会返回结果。\n\
  - **查找稍后付款的贡献？**：如果选中，仅返回“稍后付款”的贡献。如果未选中，则无论**稍后付款？**中的值如何，都会返回结果。\n- **查找定期贡献？**：如果选中，仅返回定期贡献。如果未选中，则无论贡献是否为定期贡献，都会返回结果。\n\
  - **查找测试贡献？**：如果选中，将返回通过贡献页面测试表单生成的任何贡献。默认情况下，所有测试记录都将从搜索结果中排除。选择此选项是查找这些记录的唯一方法。\n\
  - **贡献类型**：提供了一种便捷的方式来搜索活动、会员资格、捐赠或其他已配置的贡献类型的付款。\n- **贡献页面**：提供了一种便捷的方式来搜索特定组织（或订阅）的会员资格，或对使用专门贡献页面（活动）的募捐呼吁的捐赠。\n\
  - **纪念**：提供了一种按姓名搜索被纪念人的方式。\n\n> 与CiviCRM中大多数联系人的自由文本搜索不同，**纪念**搜索字段默认情况下*不会*根据联系人的部分或完整姓名或电子邮件地址来查找联系人。要绕过此限制，您可以在搜索内容中显式包含通配符（%）。无论您将其放在哪里，它都将匹配任何文本。例如，%John%\
  \ 将匹配 John Doe 以及 Jane Johnson。\n\n- **贡献来源**：必须精确匹配，除非使用通配符。\n- **个人活动页面**。可用于确定活动者的表现如何。\n\
  - **在光荣榜中显示？**：如果选择**是**，则仅返回在公共光荣榜中勾选了“显示我的贡献”的个人活动页面的贡献。如果选择**否**，则仅返回在公共光荣榜中未勾选**显示我的贡献**的个人活动页面的贡献。如果既未选择**是**也未选择**否**，则无论此设置如何，都会返回贡献，无论它们是否通过个人活动页面进行。\n\
  - **货币类型**：如果您的CiviCRM实现具有多种可用货币（请参阅**管理 | 配置 | 全局设置 | 本地化、可用货币**），则用户可以选择他们希望用来贡献的货币。在此处指定货币类型将仅返回该货币的贡献。\n\
  - **贡献的自定义数据字段**：您可以按自定义数据字段过滤搜索结果。\n\n## 检查贡献\n\n在执行贡献搜索后，您会得到一个包含关键详细信息的列表。从此列表中，您可以直接访问联系人或贡献记录。\n\
  \n搜索结果中的每一列——名称、金额、类型、来源、收到日期、感谢信已发送、状态和赠品——都可以按升序或降序排序。您还可以在每行右侧看到熟悉的查看/编辑/删除操作链接。\n\
  \n点击任何贡献行中的联系人姓名，即可进入其摘要记录。我们可以看到贡献和认捐的数量以及其他选项卡项目。通过点击“贡献”选项卡，我们可以获得其捐赠历史的良好概要摘要，其中包含三行：最近捐赠时间、频率和金额。第一行显示当前年度至今的总金额、贡献数量和平均金额。所有年份的总计在第二行。具体捐款按时间倒序排列。请注意，这些总计仅考虑已完成的贡献（待处理、已取消等不包括在内）。同样，这些列可以排序，便于以多种方式快速访问捐款。\n\
  \n在匆忙离开之前，还需要指出的是，筹款人可以使用页面上的链接记录线下付款的接收情况，或查看、编辑或删除该联系人的贡献。\n\n## 对贡献执行操作\n\n在搜索贡献后，您可以选择部分或全部记录并对其执行批量操作。可用的选项与我们在联系人搜索操作列表中看到的不同，因为它们是针对贡献记录的需求而量身定制的。\n\
  \n在本节中，我们将回顾这些批量操作，考虑它们的典型用例，并逐步说明如何更好地利用可用功能。\n\n首先执行搜索，选择部分或全部记录，然后选择操作下拉菜单以查看您的选项。选择要对所选记录执行的操作后，单击“执行”以启动它。以下小节说明了各种操作。\n\
  \n### 更新待处理贡献状态\n\n此工具是更新在线“稍后付款”贡献、或由管理人员接收并手动录入的线下直邮/电话营销活动贡献的一种方式。\n\n“稍后付款”贡献将保持“待处理”状态，直到收到贡献（例如在表单提交后邮寄来的支票）。在某个时候，如果不再有希望收到付款，它们也可能被视为失败的捐赠。“更新待处理贡献状态”操作提供了一个针对这种情况优化的批量更新表单。它可以比逐一查找和编辑这些字段更快地更新费用金额、支付方式、支票#、交易ID和交易日期。一旦您为这些字段输入数据并为显示出的记录选择了新的贡献状态，请单击“更新待处理状态”以保存所有更改。\n\
  \n请注意，要使用此工具，您搜索选择的所有贡献都必须具有“待处理”状态；否则将显示错误消息。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_303_0.png)\n\
  \n### 打印或电子邮件发送贡献收据\n\n此操作的一个绝佳用途是跟进那些刚刚将其贡献状态从“待处理”更新为“已完成”的记录。在任何操作后单击“完成”，您将返回到搜索结果，并可以继续执行其他操作。从列表中选择“打印或电子邮件发送贡献收据”，然后单击“执行”。\n\
  \n### PDF或电子邮件收据\n\n**PDF收据**会生成一个可打印和邮寄的收据PDF文件，而**电子邮件收据**则通过电子邮件将收据发送给所有选中记录的捐赠者。点击**处理收据**后，您将返回到搜索结果（如果您通过电子邮件发送了收据），或提示您保存PDF文件（如果您正在生成PDF收据）。请注意，收据是使用**贡献\
  \ - 收据（在线）**模板生成的（有关更多详细信息，请参阅**管理 | 配置 | 消息模板，系统工作流消息**）。\n\n### 向联系人发送电子邮件\n\n\
  与相应的联系人搜索操作相同，此工具允许您生成电子邮件活动并发送给搜索结果。此操作的一个可能的用途是向捐赠者发送感谢电子邮件，这些捐赠者将收到签名的纸质收据，因为某些司法管辖区不承认电子邮件收据用于税务目的。\n\
  \n填写标准的**发送电子邮件**活动表单，选择适当的**发件人**电子邮件、**抄送**和**密件抄送**；输入**主题**行；并提供电子邮件内容。与使用此工具的其他情况一样，您可以选择**使用模板**，并根据需要提供**HTML格式**和/或**纯文本格式**内容。电子邮件内容可以保存为新模板，或者如果使用了现有模板，则可以更新它。如果您已在**全局设置**中启用附件，则可以在此处添加附件。\n\
  \n### 通过配置文件批量更新贡献\n\n此选项也基于联系人搜索的等效工具，允许您使用预定义的配置文件来定义将编辑的列/字段，在网格式布局中一次更新最多100条记录。为了说明此操作的实用性，我们将创建一个包含贡献字段的配置文件，然后使用它来更改状态和其他几个贡献字段。与对其他记录执行的批量更新操作一样，您将能够比逐一查找和编辑每条贡献记录更快地编辑贡献配置文件中暴露的字段。\n\
  \n在**管理 | 自定义 | CiviCRM配置文件**处创建一个配置文件，并选择一些贡献类型字段，例如感谢日期、支付工具和支票号码。不需要添加与联系人相关的字段，因为仅包含贡献字段的配置文件会自动显示捐赠者的姓名、电子邮件和地址。保存配置文件后，返回您的搜索结果或重新初始化它们，选择一个或多个贡献，然后选择**通过配置文件批量更新贡献**操作。您将看到可用于此目的的配置文件列表。选择您刚刚创建的配置文件，然后单击**继续**。\n\
  \n\n\n\n\n然而，我们强烈不建议删除财务数据交易，并且会建议一些方法来防止任何用户拥有删除财务交易的权限。更好的做法是记入冲销交易或使用状态来传达原始交易为何发生变化（例如，通过标记为已取消并提供操作说明）。\n\
  \n一个例外可能是当你清理系统中的测试记录时。通常，测试记录在界面中是隐藏的。你必须明确选择在“查找捐款”工具中包含它们（勾选“查找测试捐款？”）；否则，它们默认会被排除。\n\
  \n然而，定期搜索这些测试记录并使用批量“删除捐款”操作将它们从系统中移除是合理的。请确保在执行任何此类批量删除之前，已备份数据库的最新版本。\n\n正如你所见，CiviCRM\
  \ 提供了许多强大的工具来批量处理捐款记录。花时间探索可用功能，以便在处理记录时了解你的选项，并清楚地理解它们的作用。\n\n## 搜索、检查和对认捐进行操作\n\
  \n与捐款相比，可用的认捐管理选项较少。如前所述，认捐是一组捐款记录（认捐付款）的集合，由包含的认捐选项定义。\n\n### 搜索认捐\n\n要搜索认捐，请点击\
  \ 搜索 | 查找捐款 或 捐款 | 认捐 | 查找认捐。搜索认捐时可用的条件如下。我们将在使用条件时指出任何特别有用、有趣或可能意外的行为：\n\n- **认捐者姓名或电子邮件**：使用部分字符串搜索认捐者姓名或电子邮件。\n\
  - **付款计划 – 起始和结束**：输入范围，或仅输入开始或结束日期。与其他字段一样，此处不输入值将返回与该字段值无关的记录。\n- **认捐付款状态**：一个或多个\
  \ 已完成、待处理、已取消、逾期。\n\n- **认捐金额 – 起始和结束：** 这些金额范围是包含的——它将包含大于或等于 **起始** 且小于或等于 **结束**\
  \ 金额的认捐金额。在使用任何基于范围的字段时，你不需要为两者都提供值。例如，在 **认捐金额起始** 字段中输入 **50** 将返回所有大于或等于 50 的认捐。\n\
  - **认捐状态：** 一个或多个 **已完成、待处理、已取消、进行中** 或 **逾期** 状态。了解 **认捐付款状态** 与 **认捐状态** 之间的区别，前者跟踪单个付款记录，后者跟踪认捐记录的整体状态。\n\
  - **认捐创建 – 起始和结束：** 这些是包含的——认捐金额大于或等于起始且小于或等于 **结束**。\n- **付款开始日期 – 起始和结束：** 这些包含大于或等于\
  \ **起始** 且小于或等于 **结束** 的认捐金额。\n- **付款结束日期 – 起始和结束：** 这些包含大于或等于 **起始** 且小于或等于 **结束**\
  \ 的认捐金额。\n- **捐款类型：** 输入一个或多个捐款类型。\n- **捐款页面：** 请注意，此列表可能包含当前未配置为允许认捐的捐款页面。例如，可能曾经允许认捐并且已针对其做出认捐。\n\
  - **纪念/致敬：** 请注意，它会搜索名字和姓氏的全部或部分，但不会搜索电子邮件地址。\n- **查找测试认捐？** 如果选中，仅返回测试认捐。如果未选中，仅返回非测试认捐。\n\
  - **认捐频率 每 [时长] [频率]：** 检索由所选频率选项定义的认捐。\n\n搜索结果返回“容器”认捐记录，但你可以点击记录左侧的箭头展开并查看关联的认捐付款计划。\n\
  \n### 检查认捐\n\n认捐比单个捐款记录更复杂。从本质上讲，它们是作为一个整体单元（具有不同元素）绑定和管理的捐款组。认捐的创建定义了捐款记录；单个认捐付款的状态控制整体认捐记录的状态。\n\
  \n进行搜索后，认捐搜索结果页面允许轻松钻取访问构成认捐记录的待处理和已完成付款计划。除了 查看/编辑/删除 链接外，还提供 取消 操作。取消与删除不同，不会删除已收付款的记录。它是管理已在付款中途停止的认捐记录的首选方式。\n\
  \n钻取中显示的每个付款在右侧都有操作链接，允许管理员记录付款并在付款出现问题时轻松编辑付款计划。例如，如果需要减少付款或延长到期日，可以调整单个认捐付款记录，剩余付款将相应调整。\n\
  \n### 对认捐进行操作\n\n在搜索认捐结果上可用的操作有两种：可以导出或删除认捐。界面和工作流程与上面描述的捐款以及其他对象（如联系人、活动和会员资格）非常相似。进行搜索后，选择一个或全部认捐记录，选择操作，然后点击\
  \ Go。\n\n#### 导出认捐\n\n选择 导出主要字段 并点击 继续，将包含主要联系人和捐款字段的 .csv 文件保存到本地硬盘。导出可用于导入到你的会计系统、发送邮件或满足其他需求。\n\
  \n如果你想要更多控制导出的字段，请选择 选择导出字段 并点击 继续 进入字段选择页面。从此页面，你可以指定要导出的字段，如果需要，还可以保存字段映射以供将来使用。选择字段后，点击\
  \ 导出 生成并下载导出文件。请参考你的会计系统文档，了解其通过 .csv 导入功能可使用的字段。\n\n如果你之前保存了导出字段映射，在选择 选择导出字段 选项时它将可供选择和重用。选择现有字段映射并点击\
  \ 继续 后，你将能够查看和修改导出的字段列表，并提供 更新此字段映射 或另存为新字段映射 的选项。选择前者将在点击 导出 时更新字段映射。选择后者允许你提供名称和描述，然后在点击\
  \ 导出 时保存映射并导出数据。你也可以两者都不选择，直接点击 导出 以导出数据而不修改现有字段映射。\n\n#### 删除认捐\n\n正如操作标题所示，在认捐搜索结果上启动此选项将连同其关联的捐款记录一起从系统中删除它们。这是一个危险的功能，尤其是在处理具有某些数据完整性和保留义务的捐款记录时。\n\
  \n重申一下，我们强烈不建议删除财务数据交易，甚至建议方法来防止任何用户拥有删除财务交易的权限。如果已做出付款（或认捐），最好取消记录（保留其历史）或记入冲销交易（表明资金已退回），而不是从系统中删除它。完全删除会导致历史数据丢失——关于交易发生情况的细节和信息。这是不良的商业实践，可能不符合公认的会计原则。\n\
  \n此规则的唯一例外是仅为测试功能目的而生成的测试记录，并且其财务费用（如有）已冲销。在认捐搜索工具中，选择 查找测试认捐 以检索它们并使用 删除认捐 操作将其移除。\n\
  \n## 报告\n\n你可以创建捐款和认捐、管理现有记录、进行强大的搜索并对结果进行批量操作；但你如何将系统中的大量数据转化为组织领导层有意义的报告？你如何将原始数据转化为讲述组织现状和未来方向的故事？在本节中，我们将把上面描述的一些搜索工具转化为有意义的示例，说明你如何使用它们来提取重要统计数据和报告摘要。\n\
  \n### 使用高级搜索统计潜在客户\n\n在尝试确定不同细分市场的潜在客户数量时，你需要确保统计联系人而不是捐款。例如，如果你想找到捐赠金额在 100 美元到\
  \ 500 美元之间的人数，你不会使用 捐款 | 查找捐款 或 搜索 | 查找捐款，因为如果联系人在该范围内捐赠了不止一次，它可能会返回重复的联系人记录。\n\n\
  \n\n\n\n**高级搜索**默认返回联系人记录，而不是相关记录（如捐赠），并包含其数量的计数，因此它是统计筹款细分潜在客户的一种有用方法：\n\n- 1.\
  \ 点击 **Search | Advanced Search**。\n- 2. 点击 **Contributions** 面板以打开它。请注意，此表单几乎与\
  \ **Find Contributions** 工具相同（它排除了联系人姓名/电子邮件字段，该字段在 **Basic Criteria** 面板中处理）。\n\
  - 3. 选择所需的条件并运行搜索。\n\n此时，你的搜索将返回所有至少有一笔符合所选条件的捐赠的捐赠者。使用 **Advanced Search** 的另一个额外优势是可以添加贡献面板之外的条件。例如，如果你想将搜索限制为同时也是良好会员资格的联系人，你可以展开\
  \ **Membership** 面板并添加条件。\n\n下表概述了某些构成细分将如何转化为特定的搜索条件：\n\n| Segment | Field | Enter\
  \ the following value |\n|---|---|---|\n| 捐赠了一笔或多笔金额大于或等于 $100 且小于或等于 $500 的捐赠 |\
  \ **Contribution Amounts From** | 100 |\n|  | **Contribution Amounts To** | 500\
  \ |\n| 在 2009 年捐赠的人 | **Contribution Dates - From** | Jan 1, 2009 |\n|  | **Contribution\
  \ Dates - To** | Dec 31, 2009 |\n| 定期捐赠者 | **Find Recurring Contributions?** | Checkmark\
  \ |\n| 致敬捐赠者 | **In Honor Of** | %（百分号字符是一个通配符，告诉 CiviCRM 匹配任何非空值。在本例中，我们只是想要所有为他人捐赠的捐赠者）\
  \ |\n| 付费活动参与者 | **Contribution Type** | **Event Fee**（假设你的活动使用标准的 **Event Fee**\
  \ 捐赠类型） |\n\n| Segment | Field | Enter the following value |\n|---|---|---|\n| 付费会员或订阅者\
  \ | **Contribution Type** | **Member Dues**（假设你的会员资格使用标准的 **Member Dues** 捐赠类型）\
  \ |\n| 捐赠给特定在线活动的捐赠者 | **Contribution Page** | 选择接受该活动捐赠的页面。 |\n\n在你输入条件并点击 **Search**\
  \ 后，你会看到一个页面，其中包含符合条件的捐赠者总数，以及结果的第一页（默认情况下为前 50 条）。在你查看结果后，你可以通过点击 **Edit Search\
  \ Criteria** 来轻松更改搜索条件并重新运行搜索，以展开条件面板。\n\n请注意，如果你输入多个条件，结果会更少，因为所有条件都必须为真才能返回结果；换句话说，搜索条件是限制性的（条件之间使用\
  \ AND 连接）。如果你有兴趣返回匹配其中一个或另一个条件的记录，你可以使用其他工具，例如下面描述的 **Search Builder**。另一种方法是运行你的各个限制性条件集并将其保存为组，然后进行一个组合组的搜索（通过\
  \ **Advanced Search** 选择多个组是包含性的——搜索将返回匹配任一组组的记录）。\n\n由于 **Advanced Search** 页面上指定的条件是限制性的，我们提醒你不要同时为捐赠和承诺输入条件。如果你不小心，你可能会要求那些既完成捐赠又做出承诺的人，而这两者通常是截然不同的群体，处理方式也非常不同。\n\
  \n**Advanced Search** 是一个非常强大的工具，但它有几个限制。最值得注意的是，界面不允许你指定 NOT 条件。例如，没有办法说“搜索每个使用捐赠类型不是\
  \ **Event Fee** 的联系人。”\n\n## 额外的细分建议和工具\n\nCiviCRM 的搜索和报告机制，可能辅以自定义搜索和报告，可以为你提供：\n\
  \n- 初始礼物现有潜在客户的数量（例如，订阅了新闻通讯、参加了活动、通过电子邮件表达了关注、签署了请愿书等的人数）。\n\n与其他搜索工具一样，你可以进行搜索并对批量结果采取行动。可用选项将取决于返回记录的性质。\n\
  \n## 使用个人资料问卷进行研究\n\n对于许多组织而言，调查和个人资料问卷为了解现有和潜在的构成者提供了重要基础，并可能有助于形成你的筹款策略。\n\nCiviCRM\
  \ 的自定义字段和个人资料可用于进行调查（请参阅第 5 章《收集、组织和导入数据》，以全面讨论自定义数据和个人资料）。关于对你的使命和捐赠理由的市场态度的总体结果，在制定筹款计划期间最为重要。然而，在制定计划期间对调查问题的个人回答可能会提供有助于针对筹款呼吁的数据。你可能会发现你的联系人基础中有不同的群体，他们对使命的不同要素做出不同的反应。例如，有些人可能主要对支持即时救济工作感兴趣，而另一些人则主要对支持系统性和预防性变革工作感兴趣。\n\
  \n> CiviCRM v3.3 引入了一个新的 Campaign 组件，该组件使用活动作为调查和请愿的结构。虽然这些工具最初是为政治和议题导向的活动开发的，但也可以用于基于使命和筹款的调查。如果你使用的是此版本，请调查这些工具的结构，看看它们是否能为你的需求提供有效的途径。\n\
  \n## 捐赠报告\n\nCiviCRM 具有内置的报告工具，其中包含许多出色的报告模板，面向捐赠者/捐赠/筹款信息需求。以下是当前可用的报告模板列表。你应该预计该列表将在未来的版本中得到补充：\n\
  \n- **Donor Report (Summary)**\n- **Donation Summary Report (Organization)**\n-\
  \ **Donation Summary Report (Household)**\n- **Donor Report (Detail)**\n- **Donation\
  \ Summary Report (Repeat)**\n- **SYBUNT Report**：这意味着“在某一年捐赠但今年未捐赠的捐赠者”\n- **LYBUNT\
  \ Report**：这意味着“去年捐赠但今年未捐赠的捐赠者”\n- **Soft Credit Report**：软积分代表联系人招募但未亲自做出的捐赠\n\
  - **Top Donors Report**\n- **Pledge Summary Report**\n- **Pledged But not Paid Report**\n\
  - **Bookkeeping Report**\n\n关于 CiviCRM 报告工具的完整讨论，请参阅 *第 12 章，讲述你的故事：构建报告*。我们不会在这里花时间讲解概念和可用功能，因为它们在后面的章节中已深入介绍。花时间回顾核心概念和可用报告，以便你在需要开始组装报告时知道去哪里寻找。\n\
  \n## 实施呼吁\n\n正如我们所见，筹款计划通常包括几种不同的筹款项目，例如将一次性捐赠者转化为预授权月度捐赠者、举办筹款晚宴或寻找新捐赠者。在本节中，我们将使用\
  \ CiviCRM 通过多种渠道传递呼吁：在线、直接邮件、电话营销和直接联系。\n\n## 规划\n\n呼吁是对构成者的有针对性的信息，鼓励他们为特定目的捐赠——例如项目或新举措。简单筹款呼吁计划的标准要素可能包括：\n\
  \n- **Segment**：谁将被要求捐赠？\n- **Goal**：呼吁旨在筹集多少总捐赠金额，以及资金将用于什么？\n- **Case**：应提供哪些捐赠理由？这应是对整体筹款计划中捐赠理由的细化。通常最好在沟通中包含情感成分和紧迫感。\n\
  - **Ask**：要求的是什么具体内容？（例如，比去年更大的一次性礼物、任何礼物、每月承诺的增加等等。）\n- **Face**：谁是活动的形象？信件和电子邮件将以什么名字发出？\n\
  \n\n\n\n\n- **Message:** 诉求的核心信息是什么，用一句话或两句话概括？\n- **Creative:** 诉求所使用的材料的文本、图像、平面设计和版式，包括制作。这包括电子邮件、落地页、感谢页和感谢邮件、直邮套件和响应机制、电话脚本、小册子、报名表等等。不要忘记为志愿者或工作人员提供培训和支持材料，以便他们帮助实施诉求。\n\
  - **Team:** 谁将负责规划诉求、准备材料、进行募捐、跟进等？\n- **Events:** 是否会有启动、结束或其他活动？\n- **Schedule:**\
  \ 诉求中的任务和活动何时开始和结束？\n- **Closing:** 诉求的募捐何时结束，以及诸如网页和海报等支持材料何时被撤下，以及募捐者收到的电话记录表和离线捐款何时被收集以供审查？\n\
  - **Appreciation:** 捐赠者、志愿者和工作人员的贡献将如何得到认可和感谢？除了感谢邮件和信件外，是否会举办聚会？\n- **Follow-up:**\
  \ 关于诉求目标的达成情况如何报告，未来工作有哪些经验教训，是否发送认捐提醒，以及如何与捐赠者和其他人沟通资金的使用情况。\n\n有了这份计划和创意材料后，您就可以开始使用\
  \ CiviCRM 工具来构建在线元素。\n\n## 创建在线捐款页面\n\nCiviCRM **Contribution Pages** 是用于收集捐款的在线表单。\n\
  它们包含大量可供选择的配置选项。\n要创建一个捐赠者可用于在线认捐或捐款的新页面，请点击 **Administer | CiviContribute | New\
  \ Contribution Page** 或 **Contributions | New Contribution Page**。您可以通过访问 **Administer\
  \ | CiviContribute | Manage Contribution Pages** 或 **Contributions | Manage Contribution\
  \ Pages** 查看现有的捐款页面，并可以点击 **Add Contribution Page** 从此页面创建新表单。\n\n这会弹出一个九步向导，引导您设置与捐款页面相关的所有选项。每个步骤将特定类型的设置分组在一起。您可以通过查看代表不同阶段的九个文本框中的哪一个为粗体来知道您处于哪一步，当前页面的标题有时与步骤列表中使用的简短文本略有不同。向导允许您使用方便地位于每页顶部和底部的按钮随时向前、向后移动或取消。请注意，在通过第一页后，您的捐款页面将以部分完成状态保存。在后续向导步骤中点击取消会将您返回到捐款页面对话框，并且不会保存您当前所在表单的设置。但是，捐款页面已经创建，并且对向导中其他步骤的更改将被保存。\n\
  \n如果您在完成向导之前导航离开，您可以通过以下方式完成页面的配置：\n\n1. 点击 **Administer | CiviContribute | Manage\
  \ Contribution Pages** 或 **Contributions | Manage Contribution Pages**，并点击所需页面的\
  \ **Configure**。这会弹出一个页面，列出向导中的九个步骤以及每个步骤配置的内容，以及我们将在下面处理的另外两个选项：**Test-drive**\
  \ 和 **Live Contribution Page**。\n2. 从此页面您可以跳转到任何需要配置或重新配置的步骤：\n  - **Title and Settings**\n\
  \  - **Contribution Amounts**\n  - **Membership Settings**\n  - **Include Profiles**\n\
  \  - **Thank-you and Receipting**\n  - **Tell a friend**\n  - **Personal Campaign\
  \ Pages**\n  - **Contribution Widget**\n  - **Premiums**\n\n每个页面都显示与向导中相同的配置。在填写或编辑字段中的值后，您会看到\
  \ **Save** 或 **Cancel** 选项。两者都会将您返回到该捐款页面所有配置选项的列表页面。\n\n让我们依次回顾每个配置步骤。\n\n## Title\
  \ and settings\n\n您的捐款页面的 **Title** 应与诉求的信息相关。如果您打算在网站上使用单个页面进行捐款，您应该使标题与网站页面和菜单项的风格相符，例如\
  \ **Donate** 或 **Help the Children!**\n\n为页面选择合适的 **Contribution Type**。如果其名称不够清晰，您可能需要通过打开另一个浏览器标签页来验证您选择的类型的免税状态和会计代码是否正确。如果您使用的是带有右键鼠标的\
  \ Firefox，您可以点击 **Administer | CiviContribute**，将鼠标悬停在 **Contribution Types** 上，右键单击然后选择在\
  \ **New** 标签页中 **Open Link**。\n\n如果您希望允许组织在当前页面上进行捐款，请点击选择 **Allow individuals to\
  \ contribute and/or signup for membership on behalf of an organization?** 这会在捐款页面上添加字段，允许用户指定其代表其捐款的组织的名称和联系信息。这些字段会在用户点击一个选择框时出现，该选择框的标签为\
  \ **On behalf of Label** 中输入的文本。启用此选项将以组织联系人的名义记录捐款记录。如果系统中不存在联系人，表单完成后将创建一个新的组织和新的个人联系人，并在它们之间建立雇主/雇员关系。\n\
  \n如果您配置的页面用于企业活动，您可以勾选 **'Required' to force ALL users to contribute/signup on behalf\
  \ of an organization**。捐款页面功能用于会员注册以及捐款，在这种情况下，该功能通常用于只有组织才有资格在特定页面购买会员的情况。\n\n\
  在 **Introductory Message** 和 **Footer Message** 字段中输入您希望在页面顶部或底部显示的任何创意材料，例如文本和图像。\n\
  \n如果诉求有筹款目标，您可以填写它，它将被用来计算您接近目标的程度。如我们下面将看到的，CiviCRM 提供了温度计样式的小部件，可用于推广您的目标型活动。这些进展指示是激励线下和线上活动参与的经过时间考验的方法。\n\
  \n这些 CiviContribute 小部件是关于捐款页面诉求的小内容块，可以放置在网站的其他位置或由您的支持者在他们的网站上放置。它们解释了诉求并显示当前接近目标的进展。它们还允许在支持者网站上显示小部件的用户点击进入您网站上的捐款页面进行捐款。我们将在下面看到它们的外观。此时，重要的是您在此处设置筹款目标决定了小部件温度计的最高水平。\n\
  \n使用小部件时需要注意的一个问题是，如果您鼓励支持者在自己的网站上集成它们，您可能无法控制它们。一旦与诉求相关的活动结束且诉求关闭，小部件可能仍存在于支持者的网站上。**Start\
  \ Date** 和 **Time**，以及 **End Date** 和 **Time** 字段可用于使小部件指向显示“活动已结束”消息的页面，这有助于防止对已完成的活动进行非预期捐款。\n\
  \n某些类型的筹款活动受益于让捐赠者表明捐款是为某人致敬或纪念某人。例如，为抗击乳腺癌筹集资金的组织可能会鼓励人们为癌症幸存者的亲人致敬捐款，或为与疾病斗争结束的人纪念捐款。然后可以追踪因葬礼通知指示将捐款代替鲜花捐给该组织而收到的捐款，如果需要可以显示此类捐款的公开列表，并在适当时通知家属以便他们表达感谢。\n\
  \n如果需要，请点击选择 **Honoree Section Enabled**。您可以选择为页面的致敬人部分提供标题，并在致敬人字段上方放置说明。后者可能会解释此类礼物如何得到特殊处理。\n\
  \n默认情况下，新创建的捐款页面处于活动状态。这意味着导航到正确的 URL 将以其配置状态显示页面。如果您希望在页面完全配置好、筹款计划中的其他元素准备就绪或其计划的发布日期到来之前禁用页面，请点击取消选择\
  \ **Is this Online Contribution Page Active?**。\n\n## Contribution amounts\n\n此页面包含与付款方式以及捐款预定义级别相关的设置。\n\
  \n如上所述，并非所有捐款页面都需要向在线支付处理商提交实时交易。也许您想设置一个仅处理实物捐赠的页面，并使用适用于该用例的自定义配置文件字段，或者也许您刚刚开始使用\
  \ CiviCRM，虽然您尚未完成所有商家和支付处理商的审批，但您希望开始接受稍后通过支票付款的认捐。在这些情况下，您应该取消勾选 **Execute real-time\
  \ monetary transactions**。\n\n\n\n\n\n如果您配置了多个支付处理器，勾选 **执行实时货币交易** 会出现一个 **支付处理器**\
  \ 选择框。如果您的网站代表拥有各自账户的子组织收款，或为了对慈善和非慈善捐赠的会计进行完全分离，您的组织可能拥有多个支付处理器账户。版本 3.2 要求通过一个页面进行的所有捐赠（包括即时和定期承诺付款）必须使用相同的处理器（会员注册表单除外，如前所述）。从下拉选择框中选择合适的支付处理器。\n\
  \n在 *第 8 章，发展会员并与会员互动* 中，我们将讨论在购买会员资格或订阅时关闭捐赠能力的选项。对于标准的捐赠页面，请确保已勾选 **启用捐赠金额部分**。\n\
  \n在某些国家，可能不清楚为什么在线捐赠表单上要提供稍后通过支票付款的选项。人们要么在线捐赠，要么寄支票，要么电话捐赠。为什么有人会想把交易的一部分放在网上，另一部分放在线下？组织为什么要促进这种做法？原因是有些人无法或不愿在线使用信用卡或\
  \ PayPal 账户付款，也许是因为他们没有（例如，富有的老年捐赠者），或因为他们不信任在线支付系统的安全性。他们会响应电子邮件呼吁并填写有关自己和捐赠的所有信息，但付款本身将在稍后通过邮件、电话或亲自进行。他们也可能想捐赠但没有足够的可用资金。组织从减少数据录入和鼓励捐赠承诺中受益，这使得他们能够在捐赠在合理时间内未收到时进行跟进。也可能存在组织的基础设施不支持在线支付的情况——例如，使用某些支付处理器的持续月度付款。在新西兰和欧洲的部分地区，电子资金转账很常见，可以通过提供在银行网站上付款时使用的银行详细信息来促进。\n\
  \n如果您发现其中一种情况适用于您，请启用 **稍后付款选项** 并在 **稍后付款** 标签中输入要显示给希望稍后付款的用户的信息。然后在 **稍后付款说明**\
  \ 中提供地址、电话号码和付款宽限期等说明。此文本显示在感谢页面上，也包含在发送给捐赠者的电子邮件中。\n\n如果您配置了一个想要使用的价格集，请从 **价格集**\
  \ 下拉菜单中选择它。如果您未选择价格集，则可以通过勾选 **承诺** 来允许用户承诺捐赠。按如下方式配置显示给捐赠者的承诺选项：\n\n1. 选择一个或多个支持的承诺频率。\n\
  \n> 在许多情况下，通过仅提供月度捐赠的选项来优化您的回报。作为经验法则，填写的字段越多，完成前的放弃就越多。不必要的选项可能会降低用户体验。\n\n2. 勾选允许频率间隔将向用户呈现一个字段，以便他们输入所选承诺频率导致捐赠的次数。例如，他们可以输入\
  \ 3，如果他们希望每三个月捐赠一次。\n\n> 如果您认为用户确实需要此选项，请尝试测试两个捐赠页面，一个启用此功能，一个未启用，以查看哪种效果更好。\n\n\
  3. 定期付款的自动付款提醒可以使用 发送付款提醒、发送最多 和 发送额外提醒 字段设置。对于月度承诺，良好的数字可能是付款到期日前两天或不提前，总共三次提醒，提醒间隔\
  \ 10 天。对于年度付款，由于金额可能更大且更出乎意料，提前 14 天通知和间隔 14 天的三次提醒可能是合适的。确保在未付款情况下进行人工跟进的程序通常能提供良好的投资回报。\n\
  \n根据您使用的支付处理器，您可能有启用定期捐赠的选项。如果启用，您可以选择用户可用的频率选项（单位和间隔），与承诺的构建方式类似。\n\n承诺和定期捐赠提供相似但不同的功能。了解区别很重要：\n\
  \n- 承诺是对在固定、定期间隔内支付总额的承诺。但这只是一个承诺。捐赠者必须通过电话/邮件或使用在线支付表单在每次计划的承诺付款到期时发送付款。\n- 定期捐赠是实际的付款授权。您的支付处理器将接收并记录定期授权。当下一笔付款到期时，他们将自动发起交易并将通知发送回您的\
  \ CiviCRM 安装（以便生成捐赠记录）。\n\n总体而言，定期捐赠是首选，因为您（和您的捐赠者）无需做任何事情即可触发未来的付款。捐助者将从您的 CiviCRM\
  \ 安装和支付处理器处收到收据，其中包含一个链接，他们可以访问并取消定期捐赠。\n\n尽管承诺需要更多工作（跟进逾期付款）并且更容易被放弃（因为捐赠者每次承诺付款到期时都必须采取行动），但它在您的筹款策略中仍可能占有重要地位，例如在多年期资本\
  \ campaign 中。\n\n请注意，许多支付处理器不支持定期捐赠。如果您的不支持，承诺工具可能成为您筹款计划中更重要的元素。\n\n如果您希望为潜在捐赠者提供输入自选捐赠价值的选项，而不是被迫从价格集或简单的捐赠级别列表中选择，请勾选\
  \ **允许其他金额**。您可以为此字段输入接受的最低和最高金额。输入 **最低金额** 的一个原因可能是为了确保您不会因处理捐赠的成本而亏损。我们认为，鉴于新捐赠者的终身价值和获取新捐赠者的成本，这可能是短视的。在对政治竞选捐赠有限制的司法管辖区，输入\
  \ **最高金额** 可以提高合规性，同时降低合规遵守成本。\n\n**固定捐赠金额** 是以单选按钮选项形式向用户展示的建议捐赠级别。您可以为每个级别提供 **金额**\
  \ 或同时提供金额和 **捐赠标签**。如果需要，可以在用户进入页面时选择默认金额。\n\n这些选项的数量、金额和默认值会显著影响您的收入，因为它们引导捐赠者捐赠更少/更多或放弃捐赠决定。考虑使用多个页面来改变这些金额和默认值，并在同一细分市场内进行比较测试。考虑在尝试将捐赠者升级到更高捐赠级别时设置具有适当建议金额的额外页面。改变直接邮件和电子邮件消息中插入的链接，以便捐赠者根据其细分情况进入适当的页面。\n\
  \n## 会员设置\n\n对于捐赠页面，请将 **启用会员部分** 保持未勾选。*第 8 章，发展会员并与会员互动* 将解释如何为会员注册和续订配置捐赠页面。\n\
  \n默认情况下， **向捐赠者发送电子邮件收据？** 已被勾选。一般来说，您将始终使用此功能作为自动发送收据并为感谢捐赠者提供额外渠道的方式。您可能希望用组织名称或与捐赠最相关的个人填写\
  \ **收据发件人姓名**。最好 **收据发件人电子邮件** 反映 **收据发件人姓名**。来自 `info@ mydomain.org` 的感谢信影响力不大。确保\
  \ FROM 地址得到监控是良好的做法，因为有些人会回复电子邮件。您还可能希望在 **收据消息** 中包含行政人员的电子邮件地址和电话号码，以便在有任何问题时联系。捐赠的详细信息会自动插入到电子邮件正文中。构建它的模板可以通过访问\
  \ **管理 | 配置 | 消息模板** 进行查看。\n\n使用 **抄送收据给** 和 **密送收据给** 字段输入一个或多个用逗号分隔的电子邮件地址以接收收据消息的副本。这在存在需要手动履行的赠品或价格集选项时很有用，例如设置会员资格或订阅，或寄送感谢礼物。\n\
  \n## 告诉朋友\n\n刚刚向您的事业捐赠的人是您鼓励朋友和同事捐赠的最佳倡导者。他们可以有力地谈论捐赠，并且他们通常动力十足，因为他们刚刚完成了自己的捐赠。\n\
  \n为了鼓励您事业的病毒式营销，CiviCRM 包含功能以使捐赠者可以通过电子邮件告诉朋友捐赠。勾选 **启用告诉朋友？** 以显示可用选项。\n\n前两个字段，\
  \ **标题** 和 **介绍**，控制用户从捐赠感谢页面转到 **告诉朋友** 表单时显示的内容。 **建议消息** 是这些用户可以修改的文本，以便他们想要发送给朋友或同事的文本。也可以在发送给这些朋友的消息中包含\
  \ **信息页面链接**。这提供了对 campaign 给予的更长论证以及有关您的组织及其使命的更多信息。 **感谢标题** 和 **感谢消息** 是将显示给告诉朋友的人的标题和文本。\n\
  \n## 个人 campaign 页面\n\n比 **告诉朋友** 更强的病毒式网络类型适用于捐赠者做出或愿意做出比仅仅几次点击和几美元更多的承诺和牺牲的情况。如果您的支持者群体包括高度积极和投入的个人，例如愿意参加跑步或自行车马拉松的人，那么您可能希望为这些志愿者\
  \ campaign 者启用并投入精力建设个人 campaign 页面。\n\n\n\n\n\n勾选 **Enable Personal Campaign Pages\
  \ (for this contribution page)?**。这将显示一系列可配置的设置。前两个设置有助于保护您的组织免受垃圾邮件机器人和恶意用户的侵害。勾选\
  \ **Approval required?** 以要求在新的个人募捐页面激活前必须经过管理员审批。输入一个 **Notify** 电子邮件地址，以确保管理员在网站上出现待审批页面时立即收到通知。一旦页面获批，其创建者将被通知，并且他们可以开始自己的募捐活动。\n\
  \n您和系统需要知道谁在设置募捐页面。使用一个资料档案来收集捐助者的关键信息，例如他们的姓名和联系方式。“一旦在 **Supporter profile** 中指定了此资料档案，它将在支持者创建其募捐页面时使用。我们建议允许已批准的支持者使用\
  \ **Tell a friend** 功能，方法是勾选该字段，并将“**Tell a friend**” **Maximum recipients limit**\
  \ 设置为 **5** 或 **10**。后者设置可在给予个人募捐者足够灵活性的同时，避免过度占用系统资源或使其被标记为垃圾邮件发送者。\n\n您的呼吁信息应被参考，以帮助您确定在\
  \ **Create Personal Campaign Page** 链接文本中输入的内容。此文本将出现在捐赠者感谢页面以及每个个人募捐页面上，以鼓励捐赠者和个人募捐页面的访客创建自己的页面。良好的沟通政策是，对同一功能的任何菜单或其他链接使用相同的文本。例如，如果您网站上有一篇关于筹款活动的文章，请在文章中链接到捐赠页面的文本与您网站菜单系统中的文本保持一致。\n\
  \n当人们创建个人募捐页面时，他们可以选择允许向其页面捐赠的捐赠者留下信息，这些信息将在其个人募捐页面的荣誉榜上滚动显示。\n\n虽然个人募捐页面可以成为传播您网站捐赠页面信息的有效方式，但它们也可能很危险，因为陌生人可以在您的网站上创建内容并从您的网站发送电子邮件，其中包含指向该内容的链接。我们看到，可以要求在个人募捐页面被允许激活之前必须先获得管理员的预先批准。管理员也可以点击\
  \ **Contributions | Personal Campaign Pages** 或 **Administer | CiviContribute |\
  \ Personal Campaign Pages** 进入管理这些页面的界面。\n\n要查看个人募捐页面的内容并确认其是否（仍然）合适，请点击其 **Page\
  \ Title**。如果页面内容不合适，请返回个人募捐页面并点击 **Reject** 或 **Delete**。\n\n促使他人捐赠的募捐者对您的组织极其宝贵。CiviCRM\
  \ 会自动为通过个人募捐页面筹集的所有资金向其创建者授予软信用。\n\n## Contribution widget\n\n如前几节所述，捐赠小部件是代码片段，可以轻松添加到任何网页中，以帮助激励潜在捐赠者并引导他们访问捐赠页面。捐赠小部件是与个人募捐页面或\
  \ Tell a Friend 不同的病毒式营销形式。与支持者通过电子邮件一对一联系朋友不同，它使拥有自己网站或网页的支持者能够轻松地向其网站访客宣传捐赠页面。捐赠小部件也可以在您自己的网站上使用。它们可以放置在\
  \ Drupal 区块或 Joomla! 模块中，以引起人们对您正在进行的筹款活动的关注。\n\n要为捐赠页面启用捐赠小部件，请勾选 **Enable Widget**？这将显示可配置的设置，以影响小部件的外观。以下屏幕截图显示了示例小部件的两个选项卡：\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_325_0.png)\n\n**Info** 选项卡显示图形温度计以及指示目标金额、迄今为止筹集总额和当前捐赠数量的文本。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_325_1.png)\n\n**About** 选项卡显示一段简短的文字。请注意，由于这是一个小部件而不是完整页面，可用内容空间有限。您应使用活动呼吁或诉求的简短、提炼版本，而不是对活动内容的客观描述。\n\
  \n您必须在相应字段中输入 **Title** 文本和 **About** 文本。您还可以通过提供 **URL to logo image** 来指定徽标图像。您可以为\
  \ **Button Title** 输入 **Contribute!** 或其他合适的文本。您必须输入您的 **URL to home page**。您可以通过点击打开\
  \ **Widget Colors** 面板来选择性地调整小部件每个视觉元素的颜色。十六进制颜色代码可在 `http://en.wikipedia.org/wiki/Web_colors#Color_table`\
  \ 找到。\n\n输入这些信息后，点击 **Save and Preview**。对小部件的外观满意后，点击 **Select Code**，将其粘贴到任何所需网页中，并通过您的\
  \ CMS 使其可供访客复制到自己的网站（如果需要）。如果您有一份对您组织使命感兴趣的网站管理员名单，那将是发布使用代码请求的理想场所。\n\n### Premiums\n\
  \nPremium 是鼓励捐赠者捐赠超出原本意愿金额的一种方式。它通过在不同捐赠水平提供礼品来激励捐赠。\n\nPremium 必须在特定捐赠页面上使用之前进行配置。请查看本章前面找到的\
  \ Configure Premiums 部分。要为捐赠页面启用 Premium 部分，请点击 **Premium Section Enabled?**\n\n\
  与捐赠页面的所有其他文本和内容一样，Premium 部分的 **Title** 和 **Introductory Message** 应在开发中以支持捐赠理由和呼吁的整体信息。标题作为捐赠页面上的部分标题出现，介绍性信息（可包含图像和其他\
  \ html 图形元素）出现在其下方，但在页面上可供捐赠者选择的 Premium 列表上方。\n\n我们建议为任何有关 Premium 兑现和运输问题的捐赠者提供办公室管理员的\
  \ **Contact e-mail** 和 **Contact phone** 号码。\n\n您可以通过取消勾选 **Display Minimum Contribution\
  \ Amount?** 来禁用在每个 Premium 描述后自动显示最低捐赠金额。\n\n## Test-drive\n\n完成捐赠页面的配置后，我们强烈建议您使用\
  \ Test-drive 功能测试新的捐赠页面。尝试测试所有选项，这可能需要多次浏览确认、感谢和其他可选启用的页面。查看生成的电子邮件以及屏幕上的内容。在您自己完成此操作后，应让另一位员工或朋友在您启用页面之前进行审查。\n\
  \n## Live Contribution Page\n\n一旦您对使用测试驱动模式配置的新捐赠页面感到满意，我们强烈建议测试实时捐赠页面。如果这是第一个配置为使用新的或更改的支付处理器的页面，或使用新的可选功能的页面，这是必不可少的一步。\n\
  \n如果您拥有组织信用卡或 PayPal 账户，页面金额上的服务费不应构成太大问题。您可以尝试配置 1 美元或 10 美元或其他小额测试捐赠，以减少处理商产生的任何费用。不要忘记在将页面放入菜单系统或通过电子邮件群发广告之前禁用或删除小额测试金额选项。\n\
  \n很多时候，我们希望在启用新捐赠页面后立即向大量群体发送广播呼吁。为了避免尴尬，更重要的是避免收入损失和捐赠者群体的尊重丧失，请确保您首先向一小群人发送消息，让他们审查和测试您活动的各个元素，包括自动电子邮件。\n\
  \n## Publicize the page\n\nCiviCRM 为捐赠页面生成的 URL 相当难看且难以记住。它可能看起来像 https://mydomain.org/civicrm/contribute/transact?reset=1&id=1。\n\
  \nDrupal 和 Joomla! 都提供创建搜索引擎友好链接的工具，这些链接会隐藏标准的 CiviCRM 链接，将其转换为类似 https://mydomain.org/donateNow\
  \ 的形式。\n\n\n\n\n\n## 筹款：为您的使命筹集资金\n\n在Drupal中，您可以启用核心的Path模块，然后在Drupal中导航到**站点构建\
  \ | URL别名 | 添加别名**。在Joomla!中，您可以通过**站点 | 全局配置**启用原生的SEF重写工具，并选择站点选项卡。在右侧的**SEO**字段中，在**搜索引擎友好URL**旁边选择**是**，最好同时启用`htaccess`选项（务必按照提供的说明修改Joomla!随附的文件名）。然后使用**菜单管理器**创建链接，并在**菜单项详细信息**组的**别名**字段中输入一个友好的URL。请注意，启用SEF\
  \ URL将对您的整个站点产生更广泛的影响。虽然相比非SEF URL，这是一个重要且强烈推荐的改进，但在生产环境中启用之前，您应确保进行彻底测试。\n\n为了避免因同一页面存在两个链接而导致搜索引擎统计数据分散，建议在Drupal中设置并配置**Global\
  \ Redirect**模块，确保每个页面始终只有一个唯一的URL。\n\n### 发送直邮\n\nCiviCRM中支持线下捐款管理的功能大多已在本书其他部分介绍过，这里几乎没有需要补充的筹款特定内容。因此，接下来的几节将以简短的摘要形式，介绍如何以协调一致的方式使用这些功能来实现筹款目标，而不是提供在CiviCRM中管理和使用各种表单及页面的详细操作说明。\n\
  \n一次直邮活动涉及准备邮件包裹、处理无法投递的退信以及录入回复。最简单的邮件包裹是在信封外部贴上地址标签，内部放入未写收件人姓名的\"亲爱的支持者\"信函。另一种方式是使用带窗口的信封，通过窗口可以看到信函首页顶部的收件人和地址。即使是最小的非营利组织，也可以利用CiviCRM对标签和个性化信函的支持，在内部制作这些邮件包裹。\n\
  \n当邮件量不再小时，将制作工作外包可能更具成本效益。到了一定规模，那些只有在大规模下才具成本效益的不同技术就会变得适用。特别是，将地址和个性化称呼打印在同一张纸上，经过裁切、折叠、装入插页或不同纸张材质的回复装置，然后密封成信封及其内容物——这些都可以通过大规模服务更高效地完成。\n\
  \n当邮件量较小时，您可以直接从CiviCRM打印标签和信函。随着邮件量的增加，CiviCRM的联系人信息将被导出为文件，交付给邮件处理中心进行处理。\n\n\
  邮政部门提供的大宗折扣及其他优惠会显著影响直邮筹款项目的回报率。如果组织能够证明邮件中无法投递地址的比例足够低，就可以获得优惠费率。如果组织能够确保邮件按照投递路线进行分组捆绑，同样可以获得折扣。目前，CiviCRM支持美国邮政服务的地址验证软件。除此之外，CiviCRM用户需要通过外部服务处理从CiviCRM导出的文件，才能有资格获得邮政投递折扣。\n\
  \n一些邮政服务和私人服务机构提供地址变更文件，可用于更新直邮数据库中的地址。虽然邮件仍然可以投递到格式正确但已过期的地址，但这既浪费了宝贵资源，也失去了与重要捐赠者的沟通机会。定期使用国家地址变更（National\
  \ Change of Address）或类似文件来清理捐赠者数据是值得的。\n\n处理无法投递的退信和大量积极回复的一种经济高效的方式，是在信封和回复装置上印上条形码。这样，条形码扫描器可以快速录入信息，无需重新输入或进行耗时的人工查找。CiviCRM中已有添加条形码支持的初步规范，但仍在等待社区资金支持（http://wiki.civicrm.org/confluence/display/CRM/CiviCRM+for+Canvassing+and+GOTV）。在此期间，将联系人ID打印在信封地址和回复材料上可以降低数据录入成本。\n\
  \n### 开展电话营销活动\n\n最简单的呼出式电话营销活动需要活动人员与潜在对象通电话，记录他们是否愿意捐款，讨论捐款金额，并记录付款方式及信用卡信息等细节。\n\
  \n要实现这一点，您首先需要获取一份带有电话号码的合格潜在对象名单。这可能涉及通过数据经纪人附加电话号码。电话劝导员的培训质量和能力对回复率和收到的捐款水平有重大影响。低端呼叫中心技术可以通过预测式拨号来提高人工呼叫的效率。使用IP语音（VoIP）电话可以降低长途费用，而不会显著损失通话质量。基于互联网的解决方案从呼入式点击通话开始，这已与虚拟呼叫中心技术紧密相关。在这种设置中，基于互联网的电话劝导员通过网站或Web服务与合格的潜在对象建立连接，他们无需看到或拨打电话号码，直接将收到的回复输入网站表单。\n\
  \n前面引用的链接中包含了一些在CiviCRM中实施大部分此类功能的粗略成本估算。更简单的方法也随时可用。\n\n最简单的做法是搜索具有合适电话号码的潜在对象。打印出来的名单可以作为通话单的基础，回复数据可在稍后录入。\n\
  \n没有电话号码或号码已停机（NIS）的潜在对象名单可以导出并发送给数据经纪人，然后将导入的结果覆盖现有的陈旧数据。\n\n再进一步，可以为活动设置自定义字段，以表示电话劝导中的典型活动，例如对脚本中问题的回答（例如，您是否愿意捐赠50美元？）以及通话处理结果（无人接听、不在家等）。这可以用于筛选尚未联系到的潜在对象，并锁定那些已承诺捐款但尚未收到款项的目标对象。\n\
  \nCiviEngage是一个新的Drupal模块，旨在通过对CiviCRM的自定义字段、分组和活动等功能进行定制，来处理大量基层组织活动。它旨在实现一种在多种情境下取得成功的特定组织模式。其中部分功能正是面向上述类型的呼叫名单支持。如果您不习惯设置自定义字段和指定搜索条件，但又想在电话营销中使用CiviCRM，那么这将是一个非常不错的起点。您仍然需要修改CiviEngage创建的字段和通用回复，才能使其发挥实际作用。不过，修改一个已经完成了大部分期望功能的模块，通常比从零开始要容易得多。CiviEngage的安装流程可在http://wiki.civicrm.org/confluence/display/CRMDOC/CiviEngage+Installation查看。请注意，CiviEngage和CiviCampaign未来可能会合并。\n\
  \n### 直接接触\n\n直接接触式筹款涉及在繁忙街道上向路人募捐等活动。它也包括在会议或商场设置摊位。选择街道人流量可能对您的事业持好感、有能力且愿意捐款的地点非常重要。劝导员的个性和技巧至关重要。\n\
  \n来自该渠道的捐赠者可以通过剪贴板上的卡片或表格录入CiviCRM。他们往往不像其他渠道的捐赠者那样频繁地续捐。\n\n另一种取得一定成功的传统方式是逐户上门劝导。同样，目标社区的选择将极大影响这种开发潜在对象的方式能否收回成本并在长期内带来回报。\n\
  \n\n\n\n\n如果你的组织的合格潜在客户名单在某些区域足够密集，那么使用上门走访名单供拉票者使用是合理的。CiviEngage 在这方面提供了一些支持。它依赖\
  \ CiviCRM 核心的地址解析功能，从公民地址中提取街道号码，以生成走访名单报告。一旦公寓号和套房号能被可靠解析，它就能更有效地满足城市需求。\n\n##\
  \ 其他类型的捐款\n\n大额一次性捐款和遗产捐赠往往来自与你的组织或其关键个人建立了长期良好关系的联系人，他们与你的使命或其部分内容高度一致，相信你的组织能够成功履行承诺，并且拥有足以进行大额捐赠的资源。CiviCRM\
  \ 中的自定义字段可用于跟踪与捐赠能力相关的特定兴趣和人口统计信息。在关系培养过程中，通过 CiviEvent 和董事会活动建立的个人面对面关系可能非常重要。跟踪高净值人士之间的关系，或与其他组织董事会成员的交叉关联，对于识别大额捐赠活动的潜在对象以及确定最合适的联系人可能至关重要。在提出请求后，跟踪有关捐赠条款、税务影响等方面的会议和电话沟通会很有用。这些可以存储在通用活动中，也可以使用\
  \ CiviCase 创建更结构化的流程。\n\n## 权限\n\n虽然权限的更广泛问题在其他地方有介绍，但我们想花点时间再次强调在处理捐款时的一个重要关切。我们强烈不建议删除财务数据交易，因为这些记录涉及税务和财务审计。Drupal\
  \ 安装可以通过禁用所有角色中的“在 CiviContribute 中删除”和“在 CiviPledge 中删除”权限来防止有意或无意的删除。\n\nJoomla\
  \ 1.6 将具备访问控制功能，并且已经着手将这些工具与 CiviCRM 的权限系统集成。如果访问控制对你的组织至关重要，并且你正在使用 Joomla!，请首先研究将你的网站升级到\
  \ Joomla! 1.6 并实施 CiviCRM 需要什么。\n\n## 总结\n\n在本章中，我们学习了如何使用 CiviCRM 进行筹款。具体来说，我们讨论了：\n\
  \n- 制定筹款计划的基础知识\n- 选择在线支付处理商时需要考虑的因素\n- 如何配置 CiviContribute 和 CiviPledge\n- 手动记录捐赠和认捐\n\
  - 查找、检查和操作捐款与认捐\n- 实施筹款呼吁\n\n在下一章中，我们将讨论你的组织如何使用 CiviCRM 跟踪会员资格和订阅，以及如何使用贡献页面让你的支持者在线购买和续订。\n\
  \n## 定义会员类型\n\n会员类型等同于你的组织所维护的不同会员类别。每种类型都会有一个关联的金额和会费周期。因此，如果你的会员结构有子级别，或者你允许不同的支付周期，你可能需要为每个子级别或支付安排定义一个类型。\n\
  \n例如，考虑一个“关联会员”类别，它分为三个子级别——小型、中型和大型，其中会员公司产生的年销售额决定其会员子级别。要实现这一点，你可以创建三种会员类型——关联（小型）、关联（中型）、关联（大型），或类似的命名约定。\n\
  \n在命名类型并输入可选的描述后，你需要搜索并确定会员所关联的组织。这意味着，你的数据库至少必须包含一条代表你组织的组织记录，这些会员类型将附加到该记录上。\n\
  \n这种定义会员的结构附加到组织记录上，有助于支持更复杂的系统，例如你可能同时拥有与州组织和地区分支机构，或其他子实体的会员关系。会员资格也是实现付费订阅（如月度杂志）的好方法。同时拥有会员资格和付费订阅产品的组织，可以将会员类型附加到不同的组织实体（如部门）上，以便进行管理和报告。\n\
  \n继续填写表单；输入会员金额以及款项应分配到的贡献类型。如果你的会员类型是免费的，只需在金额字段中输入 0。\n\n接下来，你确定会员期间。期间是从起点到终点的会员时长。CiviCRM\
  \ 支持两种模式——固定期间和滚动期间。滚动会员类型从注册日期开始，并持续到配置的会员时长。固定期间，顾名思义，有一个固定的起始点，例如 1 月 1 日。\n\n\
  按月计算的固定会员总在人们注册的那个日历月的月初开始。例如，如果一个人在 7 月 7 日注册了一个为期六个月的固定会员，他的会员期从 7 月 1 日开始，到 12\
  \ 月 31 日结束。如果你选择了为期一年或多年的固定期间，你必须选择期间的开始日期和滚动日期。滚动日期是指在该日期之后，新的会员记录将覆盖当前和即将到来的一年。考虑以下示例。\n\
  \nFPAGM 在系统中配置了三种会员类型：**常规**和**关联**均为固定会员期间，从 1 月 1 日开始持续一年；而**支持**会员则是一年滚动会员。对于两种固定期间会员类型，他们设置了\
  \ 11 月 1 日的滚动日期。这意味着在任何 11 月 1 日至 12 月 31 日之间创建的新会员将从创建之时起有效，直到次年 12 月。此功能认识到，只享受两个月的福利却收取一整年的会员费是不合适的。\n\
  \nCiviCRM 会员工具最强大的功能之一是通过关系配置会员继承。如果在会员类型配置中选择了某种关系，任何与该“主要”会员具有该关系的联系记录都会自动获得会员资格。\n\
  \n此功能的一个常见用途是自动将组织的员工视为会员。为此，请在关系类型字段中选择**雇主为**。当某组织成为会员时，将为该组织的每位员工生成相应的会员记录。相关或继承的记录将不可编辑；只有会员的主要所有者才会拥有可编辑的记录。\n\
  \n确定应选择关系的哪一侧可能有些棘手。例如，在前面的示例中，你应该选择**雇主为**还是**雇员为**作为关系类型？如需帮助选择正确的关系类型并查看继承如何工作的示例，请单击此字段旁边的帮助图标。\n\
  \n其他常用于会员继承的关系包括**家庭成员为**、**父母为**和**配偶为**。\n\nFPAGM 的常规和关联会员类型都基于组织（会员由组织拥有，例如食品储藏室和向其供货的企业）。协会将配置两者都具有“雇主为”继承。通过这种方式，组织可以开发用于邮件和群发电子邮件的当前会员保存搜索。\n\
  \n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_336_0.png)\n\n## 查看状态规则\n\n在任何给定的时间点，你都会将成员视为具有某种状态。例如，当他们首次加入时，你可能将他们视为新成员。如果当前日期在其会员期内，他们就是当前成员。在某个时候，如果他们选择不续费，他们将被视为过期或前成员。\n\
  \nCiviCRM 提供了一种机制，用于定义确定成员状态的规则，并且可以配置为根据这些规则定期计算成员状态。导航到“管理 | CiviMember | 会员状态规则”以查看和修改它们。\n\
  \n在查看规则本身之前，让我们先了解一些重要概念，并回顾默认规则的预期用途。\n\n首先要理解的概念是状态规则顺序的重要性。当 CiviCRM 根据这些规则处理会员记录时，它会基于显示的顺序分配第一个匹配的规则。这很重要，因为某些会员记录可能匹配多条规则。\n\
  \n例如，在大多数状态配置中，新成员也会匹配当前成员规则。由于“新”状态规则（在默认配置中）排在第一位，因此将被分配该状态。\n\n\n\n\n\nCiviCRM\
  \ 自带七个预配置规则。让我们简要回顾它们的预期用途：\n\n- **新成员**：这些是刚刚加入组织的成员。也许您想通过向他们发送特别通信来表彰他们，或者在他们的会议名牌上标记“新成员”以示认可。无论您的用途如何，此状态都将帮助您快速识别新成员。\n\
  - **当前成员**：这些成员的当前日期落在其会员资格期开始日期和结束日期之间。\n- **宽限期**：此状态提供了一种方式，如果成员在结束日期之前没有续订会员资格，可以给他们一些灵活性。说实话——大多数成员等到结束日期之后才续订会员资格。您不一定想立即切断他们；因此您可以配置一个宽限期，在此期限内他们的会员福利继续有效，但他们不再被视为**当前**成员。这对您的会员总监或会员委员会也有帮助。您可以使用**宽限期**状态快速生成尚未续订当年会员资格的成员列表，并开始联系他们以鼓励续订。\n\
  - **已过期**：一旦成员超过结束日期并超过宽限期，其会员资格即过期。**已过期**状态告诉您，他们让会员资格失效而未续订。\n- **待处理**：**待处理**状态是在允许会员注册时使用“稍后付款”选项的特殊用例。“稍后付款”选项可以在会员注册页面上启用，作为收取实时信用卡付款的替代方案。实际上，它是通过支票、现金或您提供给成员的任何其他方式付款的承诺。当通过稍后付款生成会员记录时，会员记录和捐款记录都会被标记为**待处理**。收到付款后，您将在捐款记录中记录并标记为**已完成**。保存已完成的捐款记录后，对应的待处理会员资格将更新为**新**或**当前**状态。\n\
  - **已取消**：前四种状态类型都是基于日期的规则。根据当前日期和配置的规则，会员记录将被分配第一个匹配的状态。第五种（**待处理**）是基于付款的规则。相比之下，**已取消**状态通常仅手动处理。例如，某人可能加入了您的倡导组织，但后来发现自己不同意该组织采取的某些立场，于是联系您并取消其会员资格。没有基于日期或付款的计算触发取消；您只需在会员记录中将其状态更改为**已取消**。\n\
  \n## 发展您的会员并与之互动\n\n- **已故**：最后一种默认状态类型**已故**可以手动应用到记录，或将由联系人的“已故”字段触发。\n\n大多数组织会发现这些默认规则提供的基本功能足以满足其需求（尽管他们当然会想要审查这些规则，并可能发现需要调整规则配置，例如调整宽限期的时长）。如果默认规则不能满足您的需求，您可以根据需要添加、编辑、删除或重新排序规则。例如，您可以在成员过期之前构建一个多层级宽限期结构——宽限（一个月）、限制（两个月）、最后机会（三个月）——在此过程中逐渐限制用户享受某些会员福利，并以不同方式与他们沟通。\n\
  \n在创建新规则或编辑现有规则时，您可以使用多个配置选项。这些选项容易被误解或错误配置，因此让我们花点时间来审查它们：\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_338_0.png)\n\
  \n每个状态规则将定义一个触发点（**开始事件**），指示规则何时激活，以及一个可选的结束点（**结束事件**）。每个事件都可以通过调整值进行偏移。这两个事件均从三个日期之一测量——加入日期（个人加入组织的初始日期）、开始日期（会员资格期开始的日期）和结束日期（会员资格期将结束或已经结束的日期）。\n\
  \n思考开始/结束事件如何与加入/开始/结束日期关联并转化为您期望的状态可能会有点令人困惑。一种思考方式是构建一个简单的时间线来表示每个状态：\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_339_0.png)\n\
  \n让我们仔细看看上图中的时间线网格如何影响宽限期状态设置。您还记得，宽限期状态旨在表示会员资格结束日期之后、但在我们将记录视为已过期之前的期间。\n\n- **开始事件：**\
  \ 结束日期，无调整\n- **结束事件：** 结束日期，2个月\n\n这意味着什么？从会员资格结束日期开始，该记录将被标记为宽限状态两个月。之后，它将更改为已过期状态，或任何其他适用的规则。\n\
  \n> \U0001F4A1 请务必指定一个状态为默认状态。当没有其他匹配规则时，它将被分配给会员记录。\n\n除了设置开始和结束事件外，您还可以考虑在**仅限管理员？**标志中将状态标记为“仅限管理员”。如此标记意味着该状态永远不会通过规则匹配分配。它只能由管理员覆盖计算出的会员状态并分配。例如，您可以创建一个**暂停**状态，管理员用它来标记那些必须提交证件或其他文件才能被视为**当前**成员的成员。\n\
  \n**当前会员？**标志指示在显示会员总数的仪表板网格中，哪些状态类型应计为当前成员。\n\n设置好规则后，您可能想要运行一些测试记录，更改加入日期、开始日期和结束日期，以匹配您期望分配的各种状态。\n\
  \n> 请务必按照*配置计划任务*部分所述设置计划任务，以触发自动会员状态更新。当每晚或定期运行时，它将根据状态规则审查所有会员记录，并根据需要更改它们。如果您不设置计划任务，您的会员状态将仅在创建或手动更新会员记录时更新。\n\
  \n## 设置续订提醒\n\n到目前为止，您应该已经设置了会员类型，并计划创建会员加入和续订表单，以鼓励新老成员通过您的网站直接与系统交互。此外，您还需要生成定期的会员续订发票以留住现有成员。\n\
  \n如果 CiviCRM 能在会员记录接近结束日期时向成员发送提醒电子邮件，鼓励他们续订，那岂不是很棒？好消息是，CiviCRM 确实提供了这种能力！您可能已经注意到会员类型配置页面底部有一个名为**续订提醒**的区块。我们使用它来设置提醒电子邮件选项。请注意，此功能是特定于会员类型的——您可以选择不为某些会员类型启用续订提醒，或者为不同类型配置不同的电子邮件模板。\n\
  \n要使用此功能，必须执行两个非常重要的步骤——您必须创建消息模板，并且必须设置计划任务脚本（详见*配置计划任务*部分）。假设您是第一次配置这些选项，您可能会看到一个黄色消息框，提示当前不存在消息模板，并引导您到相应的页面进行设置。您可以通过菜单访问它们：**管理\
  \ | 配置 | 消息模板。**\n\n消息模板，顾名思义，将包含发送给成员的提醒电子邮件的正文文本，并且可能包含令牌——联系人记录数据的占位符。**消息模板**页面有两个选项卡——**用户驱动消息**和**系统工作流消息**。后者用于系统与核心功能一起发送的电子邮件，例如捐款的收据电子邮件。我们此时关注的是**用户驱动消息**。\n\
  \n\n\n\n创建一条新消息，并提供合适的标题、主题行和正文。请记住，您的消息应具有足够的通用性，适用于将发送到的会员类型中的所有成员。\n\n> 请直接了当。续订消息发送给那些已经对您的组织表现出一定兴趣和承诺的支持者。虽然您需要说明继续会员资格的理由，但主要目的是提醒他们续订。保持消息直接且简洁。\n\
  \n请注意，正文区域上方右侧有一个用于插入令牌（token）的链接。令牌是代表系统中某个字段的占位符。当电子邮件被处理时，令牌将被替换为每个收件人该字段的值。使用令牌可以让您为每位支持者定制电子邮件，例如将每封电子邮件的称呼设为“亲爱的[名字]”。\n\
  \n完成创建续订提醒电子邮件模板后，返回 **管理 | CiviMember | 会员类型**，选择要启用续订提醒的会员类型，并滚动到表单底部。现在您可以选择所需的提醒电子邮件模板，并指定发送时间（以会员期结束日期之前的天数计算）。\n\
  \n> 您必须按照下一节中的详细说明设置 cron 作业，才能完成续订提醒工具的配置。\n\n您起草的电子邮件模板不仅限于在自动提醒功能中使用。您还可以选择使用\
  \ CiviMail 将该电子邮件的额外副本发送给个别成员或成员组。该模板的功能与任何其他电子邮件模板相同，并可在整个系统中使用。\n\n## 配置 cron\
  \ 作业\n\n在刚刚介绍的章节中，我们回顾了两个需要自动功能的功能——一种并非由用户触发，而是由定期、基于时间的计划触发的系统操作。要实现这一点，我们必须设置一个\
  \ cron 作业。\n\n顾名思义，cron 作业是由服务器执行的基于时间的操作（时序作业）。它基本上由对脚本的引用以及脚本应运行的频率组成。有关 CiviCRM\
  \ 附带的 cron 脚本的完整讨论，请参阅*第 3 章，安装、配置和维护*。\n\n我们当前关注的是位于 `civicrm/bin/` 子目录中的 `UpdateMembershipRecord.php`\
  \ 脚本。此脚本在安装文件中最初以 `UpdateMembershipRecord.php.txt` 形式存在。在设置 cron 之前，您必须将其重命名以去掉\
  \ `.txt` 扩展名。这样做也是为了提醒您检查文件内容，因为脚本中有一个必须手动配置的变量。用您喜爱的文本编辑器打开该文件，找到文本 `EMAIL@FIXME.ORG`。正如文本所示，必须将其更改为您希望的\
  \ FROM 电子邮件地址，该地址将在发送续订提醒消息时使用。\n\n> 从 3.3 版本开始，此文件不再带有 `.txt` 扩展名，并且无需直接在文件中配置\
  \ FROM 地址，因为它现在使用系统中配置的默认 FROM 地址。\n\n在设置 cron 之前，让我们回顾一下前面讨论过的此脚本的两个用途。该脚本首先遍历所有会员记录，将现有状态与会员状态规则进行比较，并适当地更新状态。其次，脚本检查会员类型和结束日期，以判断是否已配置续订提醒电子邮件以及是否应发送。如果是，它将发送续订电子邮件并重置提醒日期。\n\
  \n鉴于该脚本的性质，将 cron 作业配置为每天运行一次就足够了。根据您的会员规模，该脚本可能需要大量服务器资源才能完成。因此，最好将其安排在站点流量的正常低谷期，例如午夜。\n\
  \n根据您的服务器设置，您可以通过控制面板界面配置 cron 作业，也可以通过 `ssh` 连接到服务器使用命令行 `crontab` 命令，或者将脚本放在 `/etc/cron.daily/`\
  \ 目录中调用 `UpdateMembershipRecord.php` 脚本。有关您的选项详情，请参阅托管服务文档。\n\n在 cron 作业中的 `wget`\
  \ 或类似命令中引用 `UpdateMembershipRecord.php` 脚本的位置时，您必须附加三个用作身份验证机制的 URL 变量。这有助于防止未经授权的用户运行该脚本。\n\
  \n```\n?name=<username>&pass=<password>&key=<sitekey>\n```\n\n有关这些变量的完整讨论，请参阅*第\
  \ 3 章，安装、配置和维护*中的*设置 cron 作业*一节。\n\n设置 cron 时，请务必在 Web 浏览器中使用配置的变量测试脚本，以确认其正常工作。您还应该启用\
  \ cron 日志记录或配置基于电子邮件的日志记录，以确保 cron 正确运行。\n\n成功运行后，您将看到会员记录随着其状态从一种类型转变为另一种类型而更新。\n\
  \n## 使用会员资格和日常管理工具\n\n在处理会员记录时，您需要轻松访问成员趋势的快照，按特定类型、状态或其他条件搜索成员，并处理单个联系人和他们的会员详细信息。CiviCRM\
  \ 提供了大量工具来完成这些工作。\n\n在主导航栏中，快速查看“会员”菜单：\n\n- **仪表板**：按类型和日期范围提供当前成员的摘要\n- **新建会员**：让您快速创建新的会员记录\n\
  - **查找成员**：提供用于搜索成员记录的工具\n- **导入会员**：允许您将之前在旧系统或其他来源中创建的记录导入系统\n\n我们不会深入审查每个工具，但会花一些时间强调关键功能和注意事项。\n\
  \n仪表板是快速获取成员系统快照的好方法。还记得我们在配置会员状态规则时，有一个选项可以将状态标记为“当前”吗？好，这个选项就在这里发挥作用——仪表板页面上的网格将显示由该选项定义的当前成员，并按过去两个月和本年迄今的当前/续订情况细分。\n\
  \n请注意，该摘要网格的大部分内容都是超链接。例如，您可以点击快速查看在特定类别或所有类别中，上个月或本月续订或加入的成员。\n\n“新建会员”菜单项可快速创建新的会员记录。使用此选项，您进入新成员表单，然后搜索选择联系人（或创建新联系人）。大多数情况下，您会先搜索并查看联系人记录，以确保是正确的联系人，然后再在其中生成会员资格。然而，这种“替代”工作流在\
  \ CiviCRM 中很常见。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_345_0.png)\n\n请注意，会员列表可能分为两个部分：有效会员资格和待处理及不活跃会员资格。后者将包括已过期、已取消或待处理的会员记录。\n\
  \n添加会员按钮位于会员列表上方。如果您的站点配置了信用卡支付处理器，您将看到第二个按钮，用于创建会员并处理信用卡付款（提交信用卡会员）。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_345_1.png)\n\
  \n选择所需的会员类型后，查看其他字段并根据需要填写。请注意，除非开始和结束日期应与**会员类型**配置部分中所述的默认计算值不同，否则您无需手动设置它们。\n\
  \n**状态覆盖？** 标记用于手动强制记录上的某个会员状态。应谨慎且少用此选项。一旦您表示某个状态已被覆盖，定期会员更新脚本和对记录的任何编辑都不会再计算状态。此选项通常仅用于以下情况：系统中有特殊联系人，他们应在现有会员类别中处理，但不收取相关费用或不需要续订。在将会员标记为已取消时，也应使用此选项，因为此时您有意将其从状态规则结构中移除。请谨慎使用此选项，因为您将失去通过基于规则的状态类型来管理联系人的能力。\n\
  \n> 如果您使用状态覆盖将某个会员标记为永久当前（因为他/她是终身会员），请考虑设置一个为期一生的终身会员类型，因为这可能是管理此类联系人更合适的方式。\n\n\
  **记录会员费**提供用于输入与会员相关的付款详细信息的字段。填写这些字段将导致创建关联的捐款记录。尽可能使用此选项很重要，而不是单独处理捐款记录，因为它会在会员和捐款记录之间建立连接，供日后引用。它还能显著简化流程，因为您可以在一个表单中同时处理会员资格和付款。\n\
  \n正如标签所示，**发送确认和收据**将生成一封发送给用户的电子邮件，其中包含所创建的会员和捐款记录的详细信息。\n\n回到会员选项卡列表，让我们了解 CiviCRM\
  \ 如何处理会员记录和续订。如前所述，会员资格有三个相关日期：加入日期、开始日期和结束日期。**加入日期**是首次创建会员记录的日期。**开始日期**是会员期开始的日期。对于固定期限会员类型，开始日期实际上可能早于加入日期。例如，如果某个会员类型以固定一年为期限，从\
  \ 1 月 1 日开始，那么 2 月 12 日创建的新会员的加入日期为 2 月 12 日，但开始日期为 1 月 1 日。滚动期限会员类型的加入日期和开始日期字段通常相同。**结束日期**根据会员类型配置和开始日期值计算。\n\
  \n续订会员记录的概念涉及将会员期结束日期延长。如果某个会员资格从 2009 年 1 月 1 日到 2009 年 12 月 31 日，续订一年后，结束日期将改为\
  \ 2010 年 12 月 31 日。\n\n\n\n\n\n许多组织习惯于将会员历史视为一系列独立的记录。以前面的示例为例，你会看到 2009 年的记录，以及\
  \ 2010 年的第二条记录。如果你习惯了这种结构，请花点时间思考这种替代格式如何影响你的工作流程。与其将会员记录视为不同的时期，你必须将其视为持续的、线性的记录。在调整你对会员的思考方式以适应此模型后，你会发现该结构在寻求对会员历史进行有效搜索时非常强大。\n\
  \nCiviCRM 通过在 **More** 下拉菜单中包含 **Renew** 和 **Renew-Credit Card** 选项来促进续费流程。\n\n\
  ![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_347_0.png)\n\n续费表单仅请求有关续费日期、付款和收据的信息。由于续费延长了现有记录，因此所有其他值都是固定的或根据现有数据计算得出的。\n\
  \n请注意，通过关系继承的会员记录将没有可用于编辑或续费记录的选项，而是有指向主要或所有者会员记录的链接，在该记录中可以进行这些功能。\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_347_1.png)\n\
  \n一个常见的困惑领域是关于已过期会员的会员续费。如果某条记录存在，但已过期，如果触发续费，应如何处理该记录？CiviCRM 通过保留原始加入日期，但根据续费发生的日期将开始和结束日期重置为新值来处理这些记录。\n\
  \n根据你希望跟踪会员历史的方式，此结构可能并不理想，因为你会丢失部分旧数据。例如，你可能更愿意为已过期的会员创建新的会员记录，以便将较旧的历史数据与新记录分开保存。这样做可以让你注意到旧记录和新记录之间发生的会员中断。\n\
  \n到目前为止，我们已经涵盖了通过管理工具配置和处理会员记录所涉及的主要功能。让我们看看这如何转化为你网站的前端。\n\n## 表单用于招募新会员并保留现有会员\n\
  \n拥有出色的管理工具很棒，但我们也希望能够在网站上展示会员注册和续费页面，以便招募新会员并保留现有会员。在 CiviCRM 中，我们通过捐赠页面来实现这一点。\n\
  \n捐赠页面用于向网站访问者征集资金。这可能是用于一般捐赠、赞助、承诺、活动，或在我们的例子中，会员资格。开始时，请访问 **Contributions | New\
  \ Contribution** 页面。\n\nCiviCRM 将引导你完成九步向导来配置你的页面。我们不会回顾所有可用选项，而是重点介绍与会员注册页面相关的关键要素。\n\
  \n在向导的第一步，你会看到一个 **Contribution Type** 字段。它的用途对于我们的目的来说可能有点误导。正如你回忆的那样，当我们定义会员类型时，我们为每个类型分配了一个捐赠类型。通过捐赠页面处理会员资格时，将使用分配给会员类型的捐赠类型进行相应的交易。然而，你可以构建你的捐赠页面，以便收集会员资格并允许额外捐赠。在这种情况下，你选择的捐赠类型将用于额外的非会员捐赠。\n\
  \n请注意，有一个选项允许个人代表组织注册。默认情况下，CiviCRM 会将与你的网站交互的用户视为个人类型联系人。毕竟，使用计算机的是人，而不是组织。但是，如果你的会员类别与组织相关联，你应该选择此选项并指示“代表”功能应为可选还是必需。请注意，你仍然可以收集填写表单的个人的信息；注册表单将把此个人视为会员组织的关联联系人（员工）。\n\
  \n在第二步中，你配置与付款相关的选项，例如使用哪个处理器，是否允许“稍后付款”功能，以及用户是否可以在会员费之外捐款。仔细考虑最后一个选项——你希望你的注册表单完全专注于会员选项，还是你的会员结构与更广泛的捐赠征集活动密切相关？\n\
  \n> 如果启用了“稍后付款”选项，访问者将有机会点击一个框以表示有意在稍后日期提交付款。表单提交后，他们的会员资格和相应的捐赠记录将被标记为待处理。当你收到付款时，只需更新捐赠记录——输入付款方式、详细信息并将状态标记为完成。这样做也会将会员资格标记为完成，并将加入日期设置为收到付款的日期。\n\
  \n第三步是启用和配置会员注册功能的地方。此单一捐赠页面可用于会员注册和续费表单，因此包含标题和描述字段供两种用途使用。续费标题和描述仅在用户登录网站并且 CiviCRM\
  \ 识别出现有会员记录时显示。否则，将使用会员加入文本。\n\n然而，这并不意味着 CiviCRM 总是会将会员记录视为新的。如果未通过身份验证的用户（未登录网站的人）在其会员加入版本中完成此表单，CiviCRM\
  \ 仍会尝试将其与系统中的现有记录匹配。如果它找到匹配项并且联系人有现有会员记录，它将续订记录而不是创建新记录。\n\n在此表单的底部，你确定哪些会员类型将可用（你可以选择将会员类型组织到多个表单中），会员注册是否必需，如果在上一屏幕配置，会员费是否应与收到的其他捐赠分开处理，以及是否应显示会员费。\n\
  \n请注意，对于 Google Checkout 和 PayPal Standard 支付处理，单独的会员费选项不可用，因为它们不支持单个提交过程中进行多笔交易。如果您希望与会员资格相关的捐赠和额外捐赠金额分配不同的捐赠类型，如前所述，应选择此选项。例如，您可能希望将会员费处理为会员会费捐赠类型，而将任何额外金额处理为捐赠捐赠类型。\n\
  \n向导的下一步提供了配置感谢屏幕和联系人将收到的电子邮件收据的选项。第五步配置 Tell-A-Friend 功能，这对于筹款活动比会员注册更常见。如果启用，完成会员表单的联系人将被鼓励使用您提供的建议文本向朋友宣传您的组织。如果您依靠口碑网络来传播您的信息，此功能可能对您有用。\n\
  \n在第六步中，您可以选择最多两个配置文件以包含在表单中。请记住，配置文件是一组字段。默认情况下，会员注册表单将只有一个必填字段——电子邮件地址。大多数情况下，您希望收集有关会员的更多信息，例如姓名、地址、电话等。您可能首先需要创建自定义配置文件或编辑现有配置文件，例如\
  \ **Supporter Profile** 或 **Name and Address**，位于 **Administer | Customize | CiviCRM\
