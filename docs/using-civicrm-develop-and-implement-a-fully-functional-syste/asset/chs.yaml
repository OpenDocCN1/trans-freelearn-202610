  \ 423\n- 论坛、IRC 和问题跟踪器 423\n- 社区与合作 424\n- 小结 425\n- 索引 427\n\n# 前言\n\nCiviCRM 是一个基于\
  \ Web 的开源支持者关系管理（CRM）系统，专门设计用于满足倡导组织、非营利组织和非政府组织的需求。民选官员、专业/行业协会、政治竞选活动和政党、政府机构以及其他类似组织都在其不断增长的热心用户之列。本书将向你展示如何在制定和执行对绩效至关重要的\
  \ CRM 战略时，充分利用 CiviCRM 令人惊叹的各种可能性。\n\n在本书中，我们将通过详细的解释和实际示例，指导你为组织制定并成功实施 CRM 战略，同时回顾\
  \ CiviCRM 的结构和主要功能。\n\n此外，我们将讨论受 CiviCRM 影响的组织流程/工作流，在您审查和分析与 CRM 实施相关的内部运营时提供指导。我们将介绍支持者关系管理的最佳实践，并指导如何利用\
  \ CiviCRM 有效实施这些实践。使用 CiviCRM 的好处将惠及整个组织，帮助您更好地实现使命。\n\n通过使用 CiviCRM，您的组织将能够更有效地与支持者互动，并通过在组织内共享的统一系统中跟踪联系人及其互动，更顺利地处理人员变动。组织领导层将利用从支持者处收集的数据来分析并为决策过程提供信息。\n\
  \n如果您的组织通过捐赠、捐款、活动费用和会员费来筹集资金，您将能够通过识别合格潜在捐赠者来开展有针对性的筹款活动，从而筹集更多资金并降低成本。我们将演示如何使用\
  \ CiviCRM 通过在线、直邮、电话营销和直接联系渠道吸引新的潜在捐赠者并将其转化为捐赠者。您将了解为什么以及如何建立和发展月度捐赠计划，并提高捐赠者基础的捐赠频率、平均捐赠金额和留存率。\n\
  \n\n\n\n使用 CiviCRM，您可以通过提供在线支付以及活动报名和会员续费的自助服务选项，减少对行政资源的负担。您可以提高现有支持者更积极参与您组织的可能性，确保更多会员前来志愿服务，识别潜在的领导者，并管理他们的志愿活动。\n\
  \n最后，您将使相关信息易于获取，这些信息可以量化您做得有多出色，包括志愿者去年为您的组织贡献的小时数、管理的案例数量、会员保留率、活动参与统计数据，或您最新紧急行动邮件带来的新病毒式注册人数。\n\
  \n这本通俗易懂的书将指导您构建一个制定良好且执行良好的 CRM 系统，使其完美满足您组织的需求。\n\n## 本书涵盖内容\n\n第 1 章，*借助 CiviCRM\
  \ 实现您的使命*，帮助您理解 CRM 的目标、目的和功能，超越技术本身，关注统一的联系人和沟通管理方法所带来的底层目标和益处。在本章中，您将学习如何使用 CiviCRM\
  \ 以有效且高效的方式实现这些目标。\n\n第 2 章，*规划您的 CRM 实施*，向您展示如何在规划 CRM 实施时审查关键步骤和注意事项，包括项目管理方法、组建项目团队以及设定切实可行且有效的目标。\n\
  \n第 3 章，*安装、配置和维护*，向您展示如何系统且全面地审查 CiviCRM 的安装和初始配置流程，同时学习核心概念以及它们将如何影响您跟踪和管理信息的方式。在本章中，您还将为持续的维护和更新建立路径。\n\
  \n第 4 章，*CiviCRM 基础：浏览系统和处理联系人*，向您展示如何通过联系人记录的视角查看您的数据，并学习如何创建、编辑以及处理联系人及其相关记录，包括关系、活动、备注、标签和组。开始使用各种搜索工具，通过批量操作查找和处理多个联系人。\n\
  \n第 5 章，*收集、组织和导入数据*，向您展示如何为不同目的创建自定义数据字段，并将它们与核心信息字段一起组织到个人资料中以进行数据录入、搜索和列表。逐步了解数据导入流程，从预处理数据清理和结构清理到导入选项和字段映射。\n\
  \n*第 6 章，更好的沟通*，通过有效的沟通将您的信息传递给大众。它帮助您理解如何通过集成方法利用 CiviCRM 工具来发送、跟踪和衡量您印刷、口头和数字沟通的有效性。\n\
  \n*第 7 章，筹款：为您的使命筹集资金*，教您如何制定筹款计划以及如何配置工具来推广和跟踪您的努力。在本章中，您还将通过联系人记录和其他管理工具处理捐款。\n\
  \n*第 8 章，发展会员并与会员互动*，向您展示如何为您的会员需求配置系统并理解 CiviCRM 中会员跟踪的核心概念。您可以使用在线表单招募新会员并鼓励续费，并跟踪、搜索和报告会员活动。\n\
  \n*第 9 章，管理活动*，向您展示如何逐步完成活动创建向导，了解处理报名、候补名单和基于审批的工作流程的各种选项。通过活动信息和报名页面以及 RSS/iCal/HTML\
  \ 列表推广您的活动。随着报名的到来进行跟踪，并通过联系人记录、出勤名单和报告处理参与者详情。\n\n*第 10 章，与支持者互动：管理案例*，使您理解案例管理的目的和关键概念，同时回顾可能对您的组织有价值的可能用途。您还将配置一种案例类型，其中包含自定义活动和时间线工作流程，并回顾在寻求案例解决时可用的管理和跟踪工具。\n\
  \n*第 11 章，提供支持：资助管理*，向您展示如何通过使用 CiviCRM 的资助跟踪工具改善您通过资助发放支持支持者的方式。它还展示了如何管理申请和审批流程，并在之后跟踪货币拨款和报告要求。\n\
  \n*第 12 章，讲述您的故事：构建报告*，帮助您通过报告讲述您组织的故事，此时您已涵盖 CiviCRM 提供的全部功能和特性。\n\n*第 13 章，定制、社区与合作*，使您展望\
  \ CiviCRM 的未来版本，了解定制安装的基本最佳实践，并学习您参与 CiviCRM 社区如何帮助支持您的组织同时推动软件发展。\n\n## 阅读本书所需条件\n\
  \n除了 CiviCRM 软件本身（可免费从 http://civicrm.org 获取）之外，您还需要 Drupal（http://drupal.org）或\
