  \ 平台上。它需要的服务器系统资源比一些其他基于网络的软件更多，包括单独运行的 Drupal 或 Joomla!。来自商业托管提供商的虚拟专用服务器是托管的良好选择，而在更苛刻的情况下，也可以使用具有高可用性和高性能服务器集群的专用服务器。虽然对于小型实施，您可能能够在共享托管上运行\
  \ CiviCRM，但您通常会发现资源限制存在问题，特别是当您对软件的使用增长时。\n\n出于测试目的或在您想要个人实例的特殊情况下，您可以在运行以下软件的本地机器上设置实施：\n\
