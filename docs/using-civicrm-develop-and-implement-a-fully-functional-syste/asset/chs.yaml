  - 设置了一个网站表单，允许联系人加入或续费会员资格，同时讨论了贡献活动可用的更广泛选项。\n- 理解了如何使用会员搜索工具查找成员子集，尤其是涉及各种日期字段时。\n\
  - 逐步完成了从三个会员报告模板之一创建会员报告的过程。\n- 退一步来理解会员资格如何与更广泛的网站目标相关联，并审查了其他可用于增强会员相关功能的工具。\n\
