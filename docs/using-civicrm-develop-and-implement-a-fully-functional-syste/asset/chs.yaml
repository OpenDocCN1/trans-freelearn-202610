  \ to the next step in the process, as illustrated by the arrows in the following\
  \ figure:\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_52_0.png)\n\nThe Waterfall\
  \ model tends to be more formal, more planned, includes more documentation, and\
  \ often has a stronger division of labor. This methodology benefits from having\
  \ clear, linear, and progressive development steps in which each phase builds upon\
  \ the previous one. However, it can suffer from inflexibility if used too rigidly.\
  \ For example, if during the verification and quality assurance phase, you realize\
  \ a significant functionality gap resulting from incorrect (or changing) specification\
  \ requirements, then it may be difficult to interject those new needs into the process.\
