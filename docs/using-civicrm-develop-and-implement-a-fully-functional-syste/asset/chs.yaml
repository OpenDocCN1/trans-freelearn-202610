  CiviCRM 与许多其他开源项目相比的一个独特之处在于，存在一个全职从事项目开发的核心开发团队。虽然社区参与是项目健康状况的良好标志，但核心开发团队的存在确保了稳定的发布、积极规划的项目路线图，以及更及时的错误修复和用户支持。


  ## 文档


  可在 http://wiki.civicrm.org 获取的详尽管理员、用户和开发者文档会在 CiviCRM 每个版本发布前进行更新。此外，《Understanding
  CiviCRM: A Comprehensive Guide》可在 http://en.flossmanuals.net/civicrm 免费获取。经常在出现问题时，其他人也曾尝试解决同样的挑战，关于他们如何获得帮助解决问题的记录，可通过在
  http://forum.civicrm.org 的社区论坛中搜索找到。


  ## 响应式的社区支持


  与专有软件相比，一些开源软件用户面临的挑战之一是难以保证在需要时能够获得支持。除了前面提到的众多专业 CiviCRM 顾问提供的付费支持服务外，CiviCRM
  社区和核心团队以在论坛中对问题快速且慷慨地回复而闻名。对于在 CiviCRM 中进行开发的人员，还有一个 #civicrm irc 频道位于 http://freenode.net，在那里通常可以找到核心团队和其他有知识的社区成员对更具挑战性的询问做出回应。


  ## CiviCRM 将如何帮助您的组织


  良好的 CRM 实施能够促进更好的成果并改善与利益相关者的关系，例如捐赠和志愿者时间的增加。它还能提高员工效率并自动化工作流程，减少与利益相关者互动的平均成本和时间。这使您和您的组织能够做得更多。CiviCRM
  将通过以下各种功能改善您的利益相关者与您组织的联系，包括：


  - 更简便的在线活动注册

  - 自助式会员续费

  - 整个合格员工均可访问的更完整的互动历史记录

  - 案例管理的自动化工作流程改进

  - 个性化电子邮件

  - 反垃圾邮件选项以确保所有电子邮件通信均基于许可

