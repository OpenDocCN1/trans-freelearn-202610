  \n## Common functions in CiviCRM\n\n会员制组织在其网站上拥有“仅限会员”部分的并不少见。此安全访问区域需要 Joomla!\
  \ 或 Drupal 用户登录帐户。如果您为会员注册创建了捐赠页面，您可以包含一个启用了用户帐户创建选项的资料。当联系人完成会员申请表时，他们将能够创建用户帐户以访问网站。\n\
  \n当您与会员合作时，您可能主要关心的是在任何给定时间点的当前会员。虽然访问 Membership | Dashboard 页面并查看按类型划分的当前会员快照很有用，但更有可能的是，您通过其他方式对当前会员进行邮件、电子邮件或其他工作。快速访问当前会员名单的一种简单方法是创建智能组。\n\
  \n使用 Search | Advanced Search，展开 Memberships 面板并选择您想要的会员类型以及 new、current、grace 状态，或您自定义的当前状态。运行搜索后，选择所有联系人并使用操作下拉菜单创建新的智能组。\n\
  \n回想一下，智能组是保存的搜索。它们是基于标准的，这意味着当新会员加入组织或现有会员记录过期时，您刚刚创建的智能组将始终显示该时间点的当前会员名单。\n\n\
  现在您有了此保存的搜索，您可以轻松导出该列表用于邮件发送或将该组用于群发电子邮件。此外，该组可以形成在线目录的基础。\n\n## Membership directories\n\
  \n值得花一点时间思考设置会员目录所需的步骤，因为这是许多会员制组织的常见目标和功能。\n\n在线会员目录的实用性和价值是无可争议的。如果您是行业协会，您很可能部分存在是为了帮助会员更有效地接触潜在客户。如果您是专业协会，您很可能希望促进会员之间的关系以进行专业发展和网络建设。\n\
  \n\n\n\n也许你过去通过发布印刷目录来满足这些需求。这个过程包括收集成员的最新信息，输入数据库，导出信息并在设计软件中排版，招揽广告，校对，发送给印刷商，最后通过邮件分发给成员，结果一收到邮件和电话就提醒你，其中相当一部分成员的信息已经过时。听起来很有趣吧？\n\
  \n虽然在线目录并不能消除工作需求，也不能以任何方式保证数据100%准确，但它确实显著简化了流程。由于你的目录将实时从数据库提取数据，因此没有延迟；一旦你收到成员的最新联系信息并在CiviCRM中更新，它就会出现在目录中。此外，如果你向成员公开一个允许他们更新自己联系信息的配置文件，你可能会减少数据录入（在一定程度上也减少了责任）。\n\
  \n构建在线目录的步骤相当简单。首先按照上一节所述，构建当前成员的智能组。这样做可以确保只有信誉良好的成员才会出现在网站目录中。一旦有人未能及时续费并转为过期状态，他们将从目录列表（及其提供的成员福利）中移除。\n\
  \n回想一下第5章“收集、组织和导入数据”中的内容，我们研究了如何将配置文件用作搜索工具，并且配置配置文件时的高级选项之一是将搜索结果限制在选定的组内。我们使用此选项将目录限制为仅显示当前成员组。\n\
  \n接着为配置文件添加和配置字段。添加字段时，你将确定哪些字段可搜索，哪些应显示在“结果”列中（请记住，列可能占据有限的屏幕空间），以及哪些应显示在详细视图中。目录页面将首先向用户提供搜索表单，通过该表单，用户可以查找并查看成员的详细信息。\n\
  \n配置文件完成后，Joomla! 用户可以通过菜单系统添加“配置文件搜索”菜单项，并选择相应的配置文件。Drupal 用户可以通过访问 http://yourdomain.org/civicrm/profile/search&gid=#&reset=1\
  \ 来访问搜索页面，其中“#”代表配置文件 ID。\n\n默认情况下，配置文件搜索打开时仅显示搜索表单本身。在 URL 中添加 &force=1 将导致页面打开时显示表单和联系人列表（如果限制为某个组，则仅显示该组中的联系人）。添加\
  \ &search=0 将只显示列表（无搜索表单）。添加 &map=1 将包含一个地图，并标记地理编码记录（你必须在系统中启用地址地理编码）。\n\n## 第三方扩展\n\
  \nJoomla! 和 Drupal 都有几个第三方扩展，用于扩展 CiviCRM 与网站的集成。其中一些扩展对会员制组织很有吸引力。\n\n三个 Joomla!\
  \ 扩展扩展了会员相关功能。你可以在 http://wiki.civicrm.org/confluence/display/CRMDOC/Joomla!+Extensions+for+CiviCRM\
  \ 阅读摘要并找到下载。你也可以在 Joomla! 扩展目录中找到它们。\n\n- **CiviAuthenticate：** 此插件为 Joomla! 核心身份验证添加了第二层验证，要求尝试登录的用户拥有信誉良好的会员资格。插件配置包括允许访问的状态级别阈值，以及针对各种可能结果（会员过期、未找到联系人记录或密码错误）的重定向链接。\n\
  - **CiviUser：** 此扩展将 Joomla! 核心用户账户创建过程替换为与 CiviCRM 交互的过程。使用此扩展，只有信誉良好的会员才能创建用户名和密码账户。此扩展附带一个模块，可以替换标准的\
  \ Joomla! 登录模块。\n- **Gloriant CiviCRM：** 此扩展提供了多种功能，但会员组织感兴趣的是基于 CiviCRM 会员资格创建前端文章权限的能力。例如，如果你有某个会员类别应具有创建文章的能力，此扩展可以提供该级别的访问控制。\n\
  \n每个 CiviCRM 会员类型都可以与一个或多个 Drupal 角色关联。首次使用此模块时，我们建议为每个关联规则选择一次每个会员状态，无论是在“**当前**”还是“**已过期**”状态部分。可以在\
  \ Drupal 的“**用户管理 | 权限**”中为关联角色设置 Drupal 权限。创建或更改关联规则后，用户的新权限默认将在他们下次登录时生效。如有必要，可以在“**用户管理\
  \ | 角色**”中创建新的 Drupal 角色。使用此工具，可以为成员授予访问、创建或删除各种内容的权限，并以极其细粒度的方式使用 Drupal 功能。\n\n\
  这些只是可用的模块和扩展中的一部分示例，可帮助你在整体网站实施中利用 CiviCRM 结构。\n\n## 总结\n\n在本章中，我们了解了 CiviCRM 如何为管理员提供强大的会员管理和报告工具，以及如何向网站公开会员注册和续费表单。具体而言，我们已：\n\
