  \ CRM 的使用，而不仅仅是规划首次实施。\n\n## 成功的障碍\n\n利益相关者关系管理计划可能很困难。在最佳情况下，它们涉及改变外部关系和内部流程和工具。在外部，利益相关者对您组织的体验需要改变，以便提供更多价值和更少的参与障碍。在内部，业务流程和支持的技术系统需要改变，以便打破部门运营的壁垒、提高效率、实现更有效的定位、改善响应能力并开展新举措。CRM\
  \ 项目的成功往往取决于改变组织内个人行为和态度，并替换、更改和/或整合组织内使用的许多 IT 系统。\n\n- **过度定制，导致：**\n  - 系统成本飙升\n\
