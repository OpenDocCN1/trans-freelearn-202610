  \ been developed into the planning of future work, as illustrated in the loop in\
  \ the following figure:\n\n![](img/76a9a15ee6002f74a917dd7fbdfc8b1c_53_0.png)\n\n\
  This methodology seeks to take what is good in the traditional Waterfall approach\
  \ — structure, clearly-defined linear steps, a strong development/quality assurance/roll\
  \ out process — and improve it through shorter development cycles that are centered\
  \ on smaller segments of the overall project. Perhaps the biggest challenge in this\
  \ model is the project management role, as it may result in many moving pieces that\
  \ must be tightly coordinated in order to release the final working product.\n\n\
  ### Agile development methodology\n\nAgile development methodologies are an effective\
  \ derivative of the iterative development model that moves one step further away\
  \ from the Waterfall model. They are characterized by requirements and solutions\
  \ evolving together, requiring work teams to be drawn from all the relevant parts\
  \ of the organization. They organize themselves to work in rapid one to four-week\
