- "# CiviCRM 使用指南：为您的组织开发和实施一个功能齐全、系统的 CRM 计划\n\n\n\n\n\n## Credits\n\n**Authors**\n\
  \nJoseph Murray, PhD\n\nBrian P. Shaughnessy\n\n**Reviewers**\n\nAlan Dixon\n\n\
  David Geilhufe\n\nMohamed M. Hagag\n\nRico Landman\n\nEileen McNaughton\n\n**Acquisition\
  \ Editor**\n\nSteven Wilding\n\n**Development Editor**\n\nNeha Mallik\n\n**Technical\
  \ Editor**\n\nKrutika Katelia\n\n**Copy Editor**\n\nNeha Shetty\n\n**Editorial Team\
  \ Leader**\n\nAkshara Aware\n\n**Project Team Leader**\n\nPriya Mukherji\n\n**Project\
  \ Coordinator**\n\nShubhanjan Chatterjee\n\n**Indexer**\n\nHemangini Bari\n\n**Proofreader**\n\
  \nAaron Nash\n\n**Graphics**\n\nNilesh Mohite\n\n**Production Coordinator**\n\n\
  Kruthika Bangera\n\n**Cover Work**\n\nKruthika Bangera\n\n## Foreword\n\nDonald\
  \ Lobo、Michal Mach 和我几乎六年前开始了 CiviCRM。当时，开源软件在操作系统领域已经站稳脚跟，但从零开始设计一款满足非营利组织和其他公民部门组织需求的开源应用的想法仍然相当激进。我们坚信，开源开发的原则，即同伴生产、协作和透明度，与许多公民部门组织的宗旨和文化之间存在天然的亲和力。\n\
  \n在我看来，开源软件的主要好处在于，软件的功能会随着赞助和使用它的组织的需求而增长和扩展。这被称为“适用性”，它使 CiviCRM 与其他 CRM 软件区别开来，后者往往更像是企业部门传下来的“不合身的旧衣服”。\n\
  \nCiviCRM 已发展成为全球数千家组织的首选 CRM 软件。我们组建了一支才华横溢、敬业的开发团队，并应对了构建能够满足从社区艺术团体到全国性会员协会、草根组织、政治竞选、宗教组织、基金会和政府机构等各类组织多样化需求的软件的挑战。\n\
  \n在这一过程中，我们一直在努力寻找合适的流程和工具来培育一个支持性强、欢迎度高的社区，在不断涌现的对更多更复杂功能的需求中提高软件的质量和可用性，并开发可持续的收入来源以维持项目。这是一段持续的旅程，而首部商业出版的\
  \ CiviCRM 指南的问世是又一个里程碑。\n\n这本书可以说是一种强力工具。作为一本“可能性手册”，它将激发新的思考，让你能够基于之前可能使用过或缺乏的旧技术，实现组织回报的最大化。如果你是\
  \ CiviCRM 的现有用户，你将找到简化工作流程并更有效地利用现有数据的方法。无论你的情况如何，这本书都是为你量身定制的。\n\n作者 Brian Shaughnessy\
  \ 和 Joseph Murray 多年来一直活跃于 CiviCRM 社区，并为各种各样的组织实施了基于 CiviCRM 的解决方案。这使他们深入了解 CiviCRM\
  \ 的精髓，以及如何实现最佳回报。\n\n当我看到新的、富有创意的基于 CiviCRM 的活动出现在我的 Twitter 动态中，新的本地 Civi聚会宣布，或是新上手开发者提交的补丁，或是看着非营利组织员工的眼睛在看到所有利益相关者信息集中在一个地方的强大功能时亮起来，我对\
  \ CiviCRM 的未来充满信心。\n\n归根结底，任何开源项目的强大之处在于其背后的社区力量。我敦促所有使用 CiviCRM 的人积极参与社区。赞助新功能和改进，提交补丁，分享案例研究，并帮助刚起步的人！你可以在\
  \ http://civicrm.org/ 上完成所有这些。\n\nDavid Greenberg\n\nCiviCRM 联合创始人\n\n## About the\
  \ Authors\n\n**Joseph Murray, PhD**，是 JMA Consulting 的所有者和负责人，专注于为进步组织提供电子倡导、电子咨询和公民参与服务。他在非营利组织董事会、政府高级职位以及选举、公投和倡导活动方面拥有丰富的经验。JMA\
  \ Consulting 已为数百个政治竞选活动提供 CRM 系统，追踪与数千万选民的互动，同时为众多非营利和倡导团体提供 Drupal 和 CiviCRM 策略、实施、开发和培训服务。\n\
  \nJoe 曾担任 CiviCRM 社区咨询小组，并是多伦多 Drupal 用户组的董事。\n\n我想感谢我的终身伴侣 Lisa Austin 的耐心、爱和支持；以及我们的儿子\
  \ Calum 和 Rafe 的摔跤比赛和挠痒痒游戏。还要感谢我的客户，他们的 CRM 挑战、赞助以及为让世界变得更美好的深思熟虑和充满激情的努力，感谢 Dave、Lobo、Kurund\
  \ 和核心团队的其他成员的领导、愿景和辛勤工作；感谢 Brian 在这次美妙的合作中承担了大量工作；以及 Steven Wilding 和 Packt 团队的其他成员对本书得以实现的支持和帮助。最后，我想感谢全球\
  \ CiviCRM 社区的开发者、维基作者、论坛发帖者和用户——你们是这本书的灵感来源，也是真正让我们的开源项目繁荣的人们。\n\nJPM\n\n**Brian\
  \ P. Shaughnessy** 是 Lighthouse Consulting & Design 的所有者和负责人，这是一家专门从事 Joomla! 和\
  \ CiviCRM 实施的网络开发公司。Brian 此前在一家协会管理公司工作了十多年，为非营利专业、贸易和慈善组织提供服务。创办自己的公司后，他将这些经验转化为为非营利组织有效实施\
  \ CiviCRM。他曾与全球各地的组织合作，帮助提高效率并通过 CiviCRM 扩展功能。\n\nBrian 曾担任 CiviCRM 社区咨询小组，并参与撰写了《Understanding\
  \ CiviCRM》第一版（后更名为《CiviCRM: A Comprehensive Guide》）。他曾与核心开发团队合作提供终端用户培训，并与项目负责人保持着密切的工作关系。Brian\
  \ 还积极参与 Joomla! 项目，曾担任 Google Summer of Code 项目的 Joomla! 导师。他通过 http://technicallead.com/\
  \ 提供专业的 Joomla! 培训。\n\n我想感谢我的家人在这本书写作期间给予的支持，并感谢 Joe 牵头该项目并作为我的合著者合作。我还要特别感谢核心开发团队和\
  \ CiviCRM 社区帮助打造了这款出色的软件。Lobo、Dave、Kurund 以及遍布全球的开发者——感谢你们将开源 CRM 的力量带给非营利社区。\n\n\
  \n\n\n\n## 关于评审者\n\n自1989年以来，**艾伦·迪克森（Alan Dixon）** 一直帮助非营利组织管理其联系人数据库。他是一名独立网站开发者，现居加拿大多伦多，自2006年起使用CiviCRM构建网站。他维护着网站\
  \ http://community.civicrm.ca。\n\n**大卫·盖尔胡费（David Geilhufe）** 在硅谷出生长大，专注于技术与社会变革的交汇点。他曾创办非营利组织和营利组织，打造企业公民组织和私人基金会的运营体系，开发风险投资支持的企业软件系统，汇聚开源社区，并指导高风险青少年进入高科技行业。他一直在寻求创造并实施一个能为世界带来些许益处的宏大构想。\n\
  \n大卫目前运营着 http://netsuite.org/，这是NetSuite的企业公民计划，致力于为全球慈善机构和社会企业提供超低成本的后台办公解决方案。\n\
  \n**穆罕默德·M·哈加格（Mohamed M. Hagag）** 是一名Unix/Linux系统工程师，对自由开源软件充满热情。他喜欢自由开源软件（FOSS）的研究与开发，自2004年起独立或与团队合作进行FOSS研发。他现任和前任雇主均为中小规模公司，主营IT市场业务，并具备一定水平的UNIX/Linux专长。虽然没有正式参与任何书籍的编写，但他曾将一些技术书籍翻译成阿拉伯语。\n\
  \n我想首先感谢上帝赐予我生命中一切美好，然后感谢我的父母、姐妹和妻子，是他们让我的生活如此美好，使我能够不断前行。\n\n**里科·兰德曼（Rico Landman）**\
  \ 是来自荷兰兹沃勒的网页开发者。在多家公司担任网页开发者后，他创办了自己的公司Futurix。他主要使用PHP，是一位坚定的开源拥护者，擅长使用Magento、Drupal、vTiger等工具。\n\
  \n近年来，他倾向于寻求与其他开源导向的公司合作。他的大部分项目都归属于Simourix（共同所有者）或Trinfinity——一个由高端互联网行业专家组成的国际网络。\n\
  \n谨以此献给玛尔亚（Marja）、卡门（Carmen）和拉尔夫（Ralph），以及我的商业伙伴马塞洛（Marcello）和汉斯（Hans）。\n\n**艾琳·麦克诺顿（Eileen\
  \ McNaughton）** 居住在新西兰惠灵顿，她的时间分配在CiviCRM咨询、家族汽车业务的账目、两个学龄前“超级英雄”以及偶尔的睡眠之间。她最初是在为惠灵顿马戏信托基金（她是该组织的受托人）设置在线课程注册时开始接触CiviCRM，此后便为Fuzion参与了多个CiviCRM和Drupal实施项目。她为核心代码库贡献了大量补丁，包括支付处理器、自定义搜索和发票增强功能。她还在研究Xero会计软件包的集成，以及为流行的Drupal\
  \ Migrate模块开发CiviCRM扩展。\n\n她是论坛和CiviCRM博客上的常客，并推动着“Make-it-Happen”倡议。她在CiviCRM API和CiviAccounts团队中任职，这些任命有时是一种荣誉，有时则让人想到“傻瓜”这个词。艾琳是参与编写原始CiviCRM\
  \ FLOSS手册的书籍冲刺团队成员之一。\n\n我要感谢唐纳德·洛博（Donald Lobo）和CiviCRM核心团队的其他成员，感谢他们为世界提供了如此出色的CRM，并付出了巨大努力帮助人们使用它。\n\
