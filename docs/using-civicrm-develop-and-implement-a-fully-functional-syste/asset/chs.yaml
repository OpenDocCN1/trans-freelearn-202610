  \ it's important that your team understands the project rules at a given point in\
  \ time, so that the project management principles are respected.\n\n### The conventional\
  \ Waterfall Development methodology\n\nThe traditional Waterfall method of software\
  \ development is sometimes thought of as \"big design upfront\". It employs a sequential\
  \ approach to development, moving from needs analysis and requirements, to architectural\
