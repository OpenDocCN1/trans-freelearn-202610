  \ 和 Windows，可以在 crontab 和计划任务、文件和目录权限系统以及简单的命令提示符/命令行命令之间准确转换，否则您应避免在 Windows 环境中使用\
  \ CiviCRM。\n\n本书涉及 CiviCRM，因此在与 CiviCRM 集成方面涉及 Drupal/Joomla! 环境。虽然偶尔会提到用于实施 CiviCRM\
  \ 的其他技术（包括 PHP、MySQL、Apache、jQuery 和 Smarty），但安装和配置软件不需要任何先验知识。\n\n## 本书适合谁\n\n\
