  \n然而，这并不意味着项目失败是不可避免的或常见的。这些明显可识别的失败原因可以通过有效的项目规划来克服。\n\n## 完美是好的敌人\n\nCRM 系统及其功能组件，如筹款、票务销售、与订阅者和其它利益相关者的沟通、会员管理以及案例管理，对于大多数非营利组织的核心运营至关重要。这可能导致在更改它们时出现项目失败的合理恐惧。然而，这种恐惧很容易造成完美主义心态，项目团队试图通过创建过多的监督、过多的应急计划和过多的项目发现时间来过度补偿，以避免遗漏任何可能集成到项目中的潜在有用功能。虽然规划是好的，但完美可能并不好，因为完美往往是好的敌人。\n\
  \nCRM 实施有风险地偏向于人们戏称的 MIT 方法。MIT 方法相信，并试图从一开始就设计、构建和部署“正确的事情”。其大局观的问题解决方法导致设计上的正确性、完整性和一致性。它更重视用户界面的简洁性而非实现设计的简洁性。光谱的另一端则被“少即是多”、“KISS”（Keep\
  \ it simple, stupid，即保持简单）和“Worse is Better”等格言所概括。这种替代观点愿意接受设计上偏离正确性、完整性和一致性，以换取整体简洁性，或实现简洁性优于用户界面简洁性。之所以出现这种反直觉的解决方案开发方法并受到尊重和欢迎，是因为从一开始就力求完美所可能导致的问题和失败。\n\
  \n\n\n\n\nNeither end of the spectrum is healthier. Handcuffing the project to an\
