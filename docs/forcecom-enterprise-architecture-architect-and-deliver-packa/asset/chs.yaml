  \ 在执行上下文之间，Apex 类方法的调用之间不会保留任何静态或成员变量值\n\n## 关注点分离\n\n如您所见，有许多地方会由各种平台功能调用 Apex\
  \ 代码。这些地方代表了有价值的代码可能隐藏的区域。之所以隐藏，是因为通常不易或不适合重用此类逻辑，因为前面表格中提到的每个区域在安全性、状态管理、事务以及其他方面（例如错误处理，如捕获和传达错误）以及各种批量化需求方面都有其自身的微妙考量。\n\
  \n在本章的其余部分，我们将审查这些要求，并将其归纳为关注点分离，以便在用于与这些平台功能集成的 Apex 代码与实现应用程序业务逻辑的代码之间划清职责界限，从而使代码能够更容易地在当前及未来的平台功能之间共享。Wikipedia\
  \ 描述了关注点分离的好处，如下所示：\n\n> \"关注点分离的价值在于简化计算机程序的开发和维护。当关注点分离良好时，各个部分可以独立开发和更新。特别有价值的是能够稍后改进或修改一个代码部分，而无需了解其他部分的详细信息，也无需对这些部分做出相应更改。\"\
  \n\n### Apex 代码演进\n\nApex 触发器可能导致更传统的 if/then/else 风格编码，产生难以维护和遵循的非常过程化的逻辑。这部分是因为它们不是类，因此不鼓励将代码拆分为方法和单独的类。正如我们在前面的表格中所见，Apex\
  \ 触发器现在不再是 Apex 唯一的执行上下文；其他上下文支持 Apex 类和面向对象编程（OOP）风格，通常利用系统定义的 Apex 接口来允许开发人员与平台集成，例如批处理\
  \ Apex。\n\n自 Apex 早期作为在 Apex 触发器中编写更复杂验证规则的手段引入以来，已经取得了长足进步。如今，社区的普遍共识是尽可能少地直接在\
  \ Apex 触发器中编写代码，而是将逻辑委托给单独的 Apex 类。对于打包应用程序，每个对象最多有一个 Apex 触发器并无真正令人信服的理由。实际上，Salesforce\
  \ 安全审查已知即使代码经过条件控制以独立运行，也会对此提出标记。\n\n将 Apex 触发器代码移至 Apex 类的一个关键动机是为了获得 Apex 语言更强大的语义，例如\
  \ OOP，使开发人员能够将代码结构更贴近应用程序的功能，并获得更好的代码复用性和可见性。\n\n## 在 Apex 中分离关注点\n\n每个执行上下文都有其自身的代码要求，例如实现系统接口、注解或控制器绑定。在这些代码中，还有关于如何工程化应用程序代码的进一步编码要求，这导致了一组常见的架构关注层，例如加载记录、应用验证和执行业务逻辑。\n\
  \n了解这些层可以让我们发现一种不同的编写应用程序代码的方式，而不仅仅是将所有代码写在单个 Apex 类中，这样会使代码与执行上下文紧密耦合，从而在未来变得不够灵活。\n\
  \n为了管理代码中的这些关注层，请创建单独的类——那些绑定到特定执行上下文（例如批处理 Apex、调度器、Apex REST 和入站消息）的类，以及包含为用户执行实际任务的应用程序业务逻辑的类。\n\
  \n下面的 UML 图显示了实现执行上下文要求（或关注点）的 Apex 类和执行应用程序业务逻辑的 Apex 类。虚线表示 UI 控制器类（这些可能是 Visualforce\
  \ 或 Lightning 控制器）与实现应用程序业务逻辑的类之间的关注点分离。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_151_0.png)\n\
  \n\n\n\n\n## Lightning Component JavaScript 中的关注点分离\n\n与 Visualforce 使用的模型-视图-控制器（MVC）类似，Lightning\
  \ Components 也按照关注点分离（SOC）的思想，将组件的实现拆分为多个各自负责不同关注点的独立文件。由于 Lightning Components\
  \ 大多在客户端实现，这些文件代表了一种在你编写的 JavaScript 代码中实现关注点分离的方式。\n\n在 Salesforce 开发者控制台中创建 Lightning\
  \ Component 时，会出现以下侧边栏，列出了构成你组件的不同文件：\n\n| 快捷键 | 类型 | 操作 |\n| :--- | :--- | :---\
  \ |\n| Ctrl + Shift + 1 | COMPONENT | |\n| Ctrl + Shift + 2 | CONTROLLER | 创建 |\n\
  | Ctrl + Shift + 3 | HELPER | 创建 |\n| Ctrl + Shift + 4 | STYLE | 创建 |\n| Ctrl +\
  \ Shift + 5 | DOCUMENTATION | 创建 |\n| Ctrl + Shift + 6 | RENDERER | 创建 |\n| Ctrl\
  \ + Shift + 7 | DESIGN | 创建 |\n| Ctrl + Shift + 8 | SVG | 创建 |\n\n我们将在第 9 章“Lightning”中详细介绍这些内容，现在先来看看\
  \ CONTROLLER、HELPER 和 RENDERER 文件。\n\n- 1. CONTROLLER：此文件中的代码负责实现与组件视觉方面的绑定。通过 COMPONENT\
  \ 文件中定义的标记来定义。与 Visualforce 控制器不同，它仅包含提供 UI 绑定的逻辑。你组件的客户端状态通过控制器来访问。\n\n- 2. HELPER：此文件中的代码负责组件行为、按钮点击及其他交互背后的逻辑，这些逻辑会导致访问后端\
  \ Apex 控制器，并组合输入和输出以与用户和后端进行交互。helper 上的方法接受控制器实例来操作状态和 UI。\n\n- 3. RENDERER：此文件中的代码仅在更高级的场景中需要，当你想要使用\
  \ COMPONENT 文件中表达的标记来覆盖或修改 Lightning Framework 本身创建的 HTML DOM 时。它专注于组件在浏览器中的呈现。\n\
  \nLightning Components 的客户端控制器可以通过 @AuraMethod 注解与 Apex Controller 类进行通信，从而访问实现共享应用程序业务逻辑的类，如上图所示。\n\
  \n本书后面我们将构建一个 Lightning Component 以打包到我们的 FormulaForce 应用程序中。\n\n## 执行上下文逻辑与应用程序逻辑关注点\n\
  \n在本节中，我们将回顾执行上下文的需求/关注点，以及每个需求如何导致应用程序业务逻辑的共同要求。这有助于定义编写应用程序业务逻辑的准则，从而使其在平台和应用程序中更加合理且可复用：\n\
  \n- 错误处理：在错误通信方面，传统上开发者有两种选择：让错误由执行上下文捕获，或者捕获异常以某种形式显示。在 Visualforce Apex 控制器上下文中，通常是捕获异常并通过\
  \ ApexPage.addMessage 方法将其路由，以通过 apex:pageMessages 标签向用户显示消息。与 Batch Apex 不同，让平台知道作业已失败涉及允许平台捕获和处理异常，而不是你的代码。例如，Apex\
  \ REST 类会自动在 REST 响应中输出异常。\n\n- 应用程序业务代码含义：这里的要点是，每个执行上下文在错误处理方面都有不同的关注点。因此，应用程序业务逻辑不应通过调用代码来规定如何处理错误，这一点很重要。\n\
  \n- **事务管理**：如前所述，平台会在执行上下文周围管理一个默认事务。在考虑错误处理关注点时这一点很重要，特别是在捕获错误时，因为平台会提交异常发生前写入数据库的任何记录，这可能不可取且难以追踪。\n\
  \n- **应用程序业务代码含义**：理解事务范围很重要，尤其是在编写会抛出异常的应用程序业务逻辑时。调用者（特别是捕获异常的调用者）不应需要担心创建 `Database.Savepoint`\
  \ 来回滚数据库状态，如果抛出异常的话。\n\n- **记录数量**：有些上下文处理单个数据库记录，例如 Visualforce 标准控制器，而其他上下文则处理多个记录，例如\
  \ Visualforce 标准集控制器或 Batch Apex。无论执行上下文的类型如何，平台本身都会在与正在处理的记录数量相关的数据库操作周围施加 governor\
  \ 限制。每个执行上下文都期望代码进行 bulkify（最小化查询和 DML 语句）。\n\n- **应用程序业务代码含义**：虽然有些执行上下文似乎一次只处理一条记录，但实际上与数据库相关的\
  \ governor 适用于所有执行上下文类型，因此最佳实践是假设应用程序代码无论何时都应考虑 bulkification。这也有助于使应用程序代码在未来从不同的上下文中更加可复用。\n\
  \n- **状态管理**：Force.com 上的执行上下文通常是无状态的；尽管如前所述，平台提供了一些设施来在执行上下文之间存储状态。\n\n- **应用程序业务代码含义**：由于状态管理解决方案并不总是可用，并且实现方式也不同，应用程序代码不应试图直接处理此关注点，而应使其本质上保持无状态。如果需要，提供可用于与调用执行上下文代码交换状态的自定义\
  \ Apex 类型，例如控制器类。\n\n- 安全性：可以说，执行上下文应该是负责强制执行这一点的，因为它最接近最终用户。在控制器执行上下文中，Salesforce\
  \ 建议放置 `with sharing` 关键字，这一点确实如此。但是，在 CRUD 和 FLS 安全方面，从维护角度来看，在执行上下文入口处强制执行会变得更加困难，因为检查用户权限的代码将需要随着底层应用程序业务代码的需求持续维护（并可能重复）。\n\
  \n- 应用程序业务代码含义：这里的含义是，执行上下文和应用程序业务逻辑都负责强制执行用户权限。但是，在共享的情况下，主要应尊重初始 Apex 调用者。随着我们在后续章节中深入探讨工程应用程序业务逻辑，我们将多次回顾安全性。\n\
  \n> 向管理员或支持团队稍后审查的错误日志记录的传统方法是使用日志表。虽然在 Force.com 中可以在某种程度上实现这一点，但请记住，如果你不捕获异常并让平台处理，某些执行上下文会与平台功能更有效地协同工作。例如，Apex\
  \ Jobs 页面将正确报告失败的批处理，以及最后一个异常的摘要。如果你实现日志解决方案并捕获这些异常，失败的批处理作业的可见性将对管理员隐藏。请确定哪种方法最适合你的用户。如果你决定实现自己的日志记录，请记住，这需要对\
  \ Apex 数据库事务进行特殊处理，并提供应用程序功能以允许用户清理旧日志。\n\n## 改进增量代码复用\n\n通过执行上下文直接调用的代码与应用程序内的应用程序业务逻辑代码之间存在关注点分离。了解这一点很重要，以确保你可以轻松、逐步且以最小努力有效复用应用程序逻辑。开发者有责任通过遵循本书章节中概述以及你自己作为编码准则一部分制定的模式和指南来维护这种关注点分离。\n\
  \n\n\n\n\n复用需求可能并不总是一目了然。然而，通过遵循关注点分离和本书中的设计模式，当随着您的应用程序发展和/或添加新平台功能时，如果出现此类需求，该过程会更加自然，无需重构，更不用说复制粘贴代码了！\n\
  \n为了说明复用场景，请想象在FormulaForce应用程序的第一个迭代中，向参赛选手授予积分是由用户通过每个参赛选手详情页面上的“Award Points”按钮完成的。此外，每月还需要手动点击赛季详情页面上的“Send\
  \ News Letter”按钮来访问通讯功能。\n\n下一个图显示了第一个迭代的类图。请注意，您已经可以看到Apex控制器逻辑与应用程序业务逻辑（后者包含在以Service结尾的类中）之间的关注点分离初步雏形。Service层将在本章后面部分详细讨论。\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_156_0.png)\n\n现在，请想象在应用程序的第二个迭代中，用户反馈请求将授予积分的功能也扩展到赛事级别，并通过Race详情页面上的一个按钮一次性为所有参赛选手应用。在下一个类图中，您可以看到ContestService类现在被RaceService类复用，以实现RaceController.awardPoints服务方法：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_156_1.png)\n\n还提出了一项额外的增强请求，以允许通讯功能使用平台调度程序自动发送通讯。下图显示，SeasonService类现在同时被SeasonNewsLetterSchedule类和SeasonController类复用：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_157_0.png)\n\n前面的示例表明，第一个迭代中的代码可以从新的应用程序业务逻辑中复用，也可以在调度程序的情况下从新的执行上下文中复用。在下一章中，我们将进一步探讨Service层，包括使这种复用成为可能的设计指南。\n"
- '# 企业应用架构模式


  到目前为止，我们仅讨论了来自执行上下文（Apex Controller、Scheduler、Batch Apex等）的Apex代码与放置在`Service`类中的可复用应用程序业务逻辑代码之间的关注点分离。然而，还有更细的粒度和模式，有助于进一步聚焦和封装应用程序逻辑，这些被称为企业应用架构模式。


  本书接下来三章中使用的模式的一般定义本身并不新鲜，但对该平台来说是一种新的实现。这些模式在其他平台上一直非常流行，并且持续流行。这些模式的原始作者是Martin
  Fowler，他在其著作*企业应用架构模式*（http://www.martinfowler.com/books/eaa.html）中描述了其他模式。


  ## 服务层


  以下是Martin Fowler对服务层的定义（http://martinfowler.com/eeaCatalog/serviceLayer.html）：


  > “使用一层服务定义应用程序的边界，该层建立一组可用操作，并在每个操作中协调应用程序的响应。”


  在本章中，您已经初步了解了该模式的实际应用。可以看到，对于业务应用程序逻辑，它构成了一个初始入口点，封装了最终用户执行的操作和任务。


  其方法和行为的设计使其对调用方不可知，从而可以轻松适应多个执行上下文，如前面的示例所示。它还在您的应用程序API策略中发挥作用。


  ## 领域模型层


  以下是Martin Fowler对领域层的定义（http://martinfowler.com/eeaCatalog/domainModel.html）：


  > “一个包含行为和数据的领域对象模型。在最糟糕的情况下，业务逻辑可能非常复杂。规则和逻辑描述了许多不同的行为案例和侧面，正是这种复杂性是对象设计所要处理的。”


  如果将服务层视为乐队指挥，那么构成领域层的Apex类就是它指挥的乐器，每个乐器在奏响乐章中都有自己的角色和职责！


  ## 数据映射器（选择器）层


  以下是Martin Fowler对数据映射器层的定义（http://martinfowler.com/eeaCatalog/dataMapper.html）：


  > “一个映射器层，用于在对象和数据库之间移动数据，同时保持它们彼此独立，也独立于映射器本身。”


  在Force.com上，充分利用数据库查询来获取数据与其他平台一样重要。对于复杂的对象模型，让SOQL承担部分繁重工作可以产生相当复杂的查询。封装数据库数据如何映射到内存中是数据映射器层的职责。


  在Martin Fowler的世界中，这通常涉及将返回的数据库结果集记录映射到Java类（称为**简单老式Java对象 (POJO)** 或 **数据转换对象
  (DTO)**）。然而，Apex为我们的每个自定义对象以SObject的形式提供了这些数据结构。因此，此模式的角色略有不同，因为SOQL查询本身明确选择了代表数据的SObject。因此，此模式已被重命名，以更准确地反映其关键职责。


  ## 介绍FinancialForce.com Apex Commons库


  存在一个用于支持这些模式的Apex类库，本书也将使用它。Apex Commons库源于FinancialForce.com发起的一个开源项目，并于Dreamforce
  2012活动期间向社区发布。从那以后，这些模式已被平台上的其他开发人员采用，并通过Fieldsets和Security等附加功能进行了扩展。在接下来的三章中，我们将使用此库来更详细地探讨其支持的企业模式。GitHub仓库位于
  https://github.com/financialforcedev/fflib-apex-common.


  ## 单元测试与系统测试


  说到测试Apex代码，我们知道该怎么做：编写良好的测试来覆盖您的代码，断言其行为，并获得至少75%的代码覆盖率。Force.com不会允许您上传打包代码，除非您获得此比例或更高的覆盖率。您还必须覆盖Apex触发器代码，即使只有一行，正如您很快将在本书中看到的Apex触发器实现情况一样。


  然而，Force.com目前缺少一个模拟框架，以允许对前面各节中提到的各层进行更集中和隔离的测试，而无需设置执行要测试的代码所需的所有记录。这使得您的Apex测试开始更像系统级测试，每次都必须执行完整的功能堆栈。


  虽然测试驱动开发（TDD）等惯例是可能的，它们确实能帮助您思考在平台上开发真正的单元测试。但由于数据设置复杂性不断增加，这样做开发起来也非常耗时，然后还要等待这些测试运行。此类测试最终感觉更像系统级或集成级测试，因为它们最终会测试应用程序中的整个代码堆栈。


  好消息是，本书中描述的分层确实为您提供了将较小的测试隔离到特定方面（例如验证或插入逻辑）的机会。在接下来的章节中，我们将逐层深入，并以一整章的篇幅结束，专注于使用名为Apex
  Mocks的开源模拟框架来实施真正的单元测试方法。该框架由FinancialForce.com与社区共享，并大量基于Java Mockito框架。https://github.com/financialforcedev/fflib-apex-mocks.






