  \ Apex 类旁边也会显示安全链接。这样，订户组织管理员就可以通过配置文件控制 API 执行的权限。请注意，这仅适用于开发者 X 调用的全局控制器方法、自定义或扩展控制器，或\
  \ Web Service 调用。您还可以通过适当的权限集（如前一章所述）授予访问权限。这意味着，如果用户被分配了授予其访问应用程序特定功能集的权限集，那么通过\
  \ API 访问这些功能也包括在内。\n\n如果要单独控制 API 权限，请创建功能范围独立的权限集：\n\n| 操作 | 名称 | 命名空间前缀 |\n| :---\
