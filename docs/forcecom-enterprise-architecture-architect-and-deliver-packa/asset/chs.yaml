  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_232_0.png)\n\n## 测试 Domain 层\n\n测试您的\
  \ Domain 代码可以采用标准的 Force.com 方式完成。通常，测试类的命名方式是在 Domain 类名末尾加上 `Test` 后缀，例如 `RacesTest`。测试方法可以选择直接或间接测试\
  \ Domain 类代码功能。\n\n间接测试是通过仅针对适用的自定义对象使用 DML 和 SOQL 逻辑，并断言这些操作产生的数据和字段错误来完成的。在此，测试代码中完全不引用您的\
  \ Domain 类。\n\n然而，这只测试了 Apex 触发器 Domain 类方法。对于表示自定义 domain 行为的测试方法，必须创建 Domain 类的实例。本节将说明间接和直接测试方法的示例。\n\
  \n## 单元测试\n\n虽然围绕 Service 层及其相关调用者（控制器、批处理等）开发测试也会调用 Domain 层逻辑，但尽可能针对 Domain 层测试尽可能多的场景非常重要，传入不同配置的记录数据以测试成功和失败代码路径，并确保您的\
  \ Domain 层逻辑尽可能健壮。Wikipedia 对 **单元测试** 的定义描述如下 (`http://en.wikipedia.org/wiki/Unit_testing`)：\n\
  \n> 在计算机编程中，单元测试是一种方法，用于测试单个源代码单元、一组或多个计算机程序模块以及相关的控制数据、使用过程和操作过程，以确定它们是否适用。直观地看，可以将单元视为应用程序中最小的可测试部分。在过程化编程中，单元可以是整个模块，但更常见的是单个函数或过程。在面向对象编程中，单元通常是整个接口，如类，但也可能是单个方法。单元测试是程序员或偶尔由白盒测试人员在开发过程中创建的简短代码片段。\n\
  \n对 Domain 层的测试符合此定义。以下部分将说明通过使用 DML 设置测试数据并执行代码来测试 Domain 类代码的传统且仍然非常有效的方法。在后续章节中，我们将回顾一个\
  \ Apex 模拟框架（类似于 Java 中的 **Mockito**），它提供了一种更精简、更有针对性的方法来测试您的 Domain 代码。\n\n## 使用\
  \ DML 和 SOQL 的测试方法\n\n要测试 Domain 类的 Apex 触发器方法，可以将传统的 DML 和 SOQL 用法与 Apex 运行时 `DMLException`\
  \ 方法结合使用，不仅断言错误消息，还断言其他详细信息。以下 Apex 测试方法说明了如何做到这一点：\n\n```\n@IsTest\nprivate static\
  \ void testAddContestantNoneScheduled() {\n    // Test data\n    Season__c season\
  \ =\n        new Season__c(Name = '2014', Year__c = '2014');\n    insert season;\n\
  \n    Driver__c driver =\n        new Driver__c(\n            Name = 'Lewis Hamilton',\
  \ DriverId__c = '42');\n    insert driver;\n    Race__c race =\n        new Race__c(Name\
  \ = 'Spa',\n            Status__c = 'In Progress',\n            Season__c = season.Id);\n\
  \    insert race;\n\n    Test.startTest();\n    try {\n        // Insert Contestant\
  \ to In Progress race\n        Contestant__c contestant =\n            new Contestant__c(\n\
  \                Driver__c = driver.Id,\n                Race__c = race.Id);\n \
  \       insert contestant;\n        System.assert(false, 'Expected exception');\n\
  \    }\n    catch (DmlException e) {\n        System.assertEquals(1, e.getNumDml());\n\
  \        System.assertEquals(\n            'Contestants can only be added to Scheduled\
  \ Races.',\n            e.getDmlMessage(0));\n        System.assertEquals(\n   \
  \         StatusCode.FIELD_CUSTOM_VALIDATION_EXCEPTION,\n            e.getDmlType(0));\n\
  \    }\n    Test.stopTest();\n}\n```\n\n前面的错误是记录级错误；DMLException 类还允许您针对字段级错误断言字段级信息。以下代码显示了此类测试断言；未显示数据设置代码：\n\
  \n```\nTest.startTest();\ntry {\n    contestant.Driver__c = anotherDriver.Id;\n\
  \    update contestant;\n    System.assert(false, 'Expected exception');\n}\ncatch\
  \ (DmlException e) {\n    System.assertEquals(1, e.getNumDml());\n    System.assertEquals(\n\
  \        'You can only change drivers for scheduled races',\n        e.getDmlMessage(0));\n\
  \    System.assertEquals(Contestant__c.Driver__c,\n        e.getDmlFields(0)[0]);\n\
  \    System.assertEquals(\n        StatusCode.FIELD_CUSTOM_VALIDATION_EXCEPTION,\n\
  \        e.getDmlType(0));\n}\nTest.stopTest();\n```\n\n## 使用 Domain 类方法的测试方法\n\n\
  为了测试自定义 Domain 类方法，应在测试方法中创建 Domain 类的实例，使用之前测试中所示已插入数据库的内存中创建或查询的测试记录。\n\n以下示例展示了正在测试的\
  \ `Contestants.awardChampionshipPoints` 方法。请注意，测试创建了一个临时 Unit Of Work 但不提交工作。严格来说，这并不是断言记录更改所必需的，因为可以使用\
  \ `Records` 属性来访问更改并断言已分配的正确值：\n\n```\n@IsTest\nprivate static void testAddChampionshipPoints()\
  \ {\n    // Test data\n    ChampionshipPoints__c championShipPoints =\n        new\
  \ ChampionshipPoints__c(\n        Name = '1', PointsAwarded__c = 25);\n    insert\
  \ championShipPoints;\n    Season__c season =\n        new Season__c(Name = '2014',\
  \ Year__c = '2014');\n    insert season;\n    Driver__c driver =\n        new Driver__c(\n\
  \        Name = 'Lewis Hamilton', DriverId__c = '42');\n    insert driver;\n   \
  \ Race__c race =\n        new Race__c(\n        Name = 'Spa', Status__c = 'Scheduled',\n\
  \        Season__c = season.Id);\n    insert race;\n    Contestant__c contestant\
  \ =\n        new Contestant__c(\n        Driver__c = driver.Id, Race__c = race.Id);\n\
  \    insert contestant;\n    race.Status__c = 'Finished';\n    update race;\n  \
  \  contestant.RacePosition__c = 1;\n    update contestant;\n\n    Test.startTest();\n\
  \    Contestants contestants =\n        new Contestants(new List<Contestant__c>\
  \ { contestant });\n    contestants.awardChampionshipPoints();\n    Application.UnitOfWork.newInstance();\n\
  \    System.assertEquals(25, (Contestant__c)\n        contestants.Records[0].ChampionshipPoints__c);\n\
  \    Test.stopTest();\n}\n```\n\n在测试中执行 SOQL 和 DML 会消耗大量 CPU 时间，并增加执行所有应用程序测试所需的总时间，一旦开始考虑持续集成（将在后续章节中介绍），这一点就变得很重要。例如，是否总是需要提交\
  \ Domain 层的数据更新，因为 Service 层测试也可能执行此类操作并断言结果。\n\n## 调用 Domain 层\n\nDomain 层在可见性和依赖性方面位于\
  \ Service 层之下。在实践中，这意味着不应直接从执行上下文代码（如 Visualforce 控制器、Lightning 组件控制器或 Batch Apex）调用\
  \ Domain 类，因为 Service 层有责任作为业务流程应用程序逻辑的唯一入口。\n\n也就是说，我们了解到 Domain 层还通过将 Apex 触发器事件绑定到\
  \ Domain 类上的方法来封装对象的行为，因为记录是通过这种方式操作的。因此，Apex 触发器从技术上构成另一个调用点。\n\n最后，Domain 层的第三种调用者类型是另一个\
  \ Domain 类。仅将 Domain 类的调用者限制在以下上下文中：\n\n- **Apex 触发器**: 这通过 `fflib_SObjectDomain.handleTrigger`\
  \ 方法调用。\n- **Service 层**: 该层直接通过 new 运算符或通过本章前面所述的 Domain 工厂方法创建 Domain 类的实例。通常，在此上下文中调用\
  \ Domain 类的自定义方法。\n- **Domain 层**: 其他 Domain 类可以调用其他 Domain 类，例如，`Races` Domain\
  \ 类可以具有其实现的某些功能，这些功能还需要使用 `Contestants` Domain 类上的方法。\n\n\n\n\n\n> 请注意，完全可以有一个 Domain\
  \ 类没有任何 Service 类代码引用它，例如在 Domain 类仅为 Apex Trigger 上下文实现代码且不包含任何自定义 Domain 方法的情况下。那么，对\
  \ Domain 类的唯一调用将通过 trigger 上下文间接进行。\n\n## Service 层交互\n\n在本章前面实现合规性框架时，我们了解到 Domain\
  \ 类可以在通用服务方法中动态创建。通常，Domain 类是直接创建的。在本节中，我们将看到几个这样的示例。\n\n以下代码展示了从 Selector 类传递记录给\
  \ Domain 类构造函数，该 Selector 类为了本章目的返回 `List<Contestant__c>`。请注意，工作单元被创建并传递给 Domain\
  \ 类的自定义方法，以便该方法也可以注册自己的工作，以便稍后提交到数据库：\n\n```\npublic class ContestantService {\n\
  \    public static void awardChampionshipPoints(\n        Set<Id> contestantIds)\
  \ {\n        fflib_SObjectUnitOfWork uow =\n            Application.UnitOfWork.newInstance();\n\
  \n        // Apply championship points to given contestants\n        Contestants\
  \ contestants =\n            new Contestants(\n                new ContestantsSelector().selectById(contestantIds));\n\
  \        contestants.awardChampionshipPoints(uow);\n\n        uow.commitWork();\n\
  \    }\n}\n```\n\n您可能已经注意到，这个示例通过重构代码并将计算点移至更接近代码直接适用的对象的位置（基本上是将原始代码移至 Domain 类），重新编写了上一章中的\
  \ Service 示例。\n\n下面的第二个示例也重新编写了上一章中的代码以利用 Domain 层。在这种情况下，RaceService 类也实现了一个 awardChampionshipPoints\
  \ 方法。这也可以受益于 Contestants Domain 类方法。请注意 Service 层和 Domain 层之间重用方法是多么容易，因为两者都确保它们的方法和交互是批量化的。\n\
  \n```\npublic class RaceService {\n    public void awardChampionshipPoints(Set<Id>\
  \ raceIds) {\n        fflib_SObjectUnitOfWork uow =\n        Application.UnitOfWork.newInstance();\n\
  \n        List<Contestant__c> contestants =\n        new List<Contestant__c>();\n\
  \        for(Race__c race :\n        new RacesSelector().selectByIdWithContestants(raceIds))\
  \ {\n            contestants.addAll(race.Contestants__r);\n        }\n\n       \
  \ // Delegate to Contestant Domain class\n        new Contestants(contestants).awardChampionshipPoints(uow);\n\
  \n        // Commit work\n        uow.commitWork();\n    }\n}\n```\n\n## Domain\
  \ 层交互\n\n在下面的示例中（也包含在本章的示例代码中），创建了一个新的自定义对象来表示参赛车队。Driver 对象新增了一个名为 Team 的查找字段，以将车手与其车队关联。\n\
  \n利用之前构建的合规性框架，还为 Team 记录添加了一个“验证合规性”按钮，用于检查车队的某些合规方面（例如赛车在测试期间可以行驶的最大距离）以及该车队的所有车手是否仍然合规（重用现有代码）。\n\
  \n> 这将通过在新的 Teams Domain 类调用中添加合规性验证代码，并委托给 Drivers Domain 类方法来实现车队中车手的相同操作。\n\n\
  为支持此示例，已向应用程序添加了以下组件：\n\n- 新的 **车队** 对象和标签页\n- **车队** 对象上带有长度 6 的新 **测试距离** 数值字段\n\
  - **车手** 对象上的新 **车队** 查找字段\n- 新的 Teams Domain 类\n\n> 如果您不打算覆盖任何 Apex Trigger 事件处理程序方法，则不必总是创建调用\
  \ `fflib_SObjectDomain.triggerHandler` 方法的 Apex Trigger。\n\n能够在 Domain 层类之间调用，使得车手合规性检查代码可以继续在\
  \ **车手** 级别以及从 **车队** 级别重用。这个 Domain 类示例展示了 Teams Domain 类调用 Drivers Domain 类：\n\
  \n```\npublic class Teams extends fflib_SObjectDomain\nimplements ComplianceService.ICompliant\
  \ {\n  public List<ComplianceService.VerifyResult> verifyCompliance() {\n    //\
  \ Verify Team compliance\n    List<ComplianceService.VerifyResult> teamVerifyResults\
  \ =\n    new List<ComplianceService.VerifyResult>();\n    for(Team__c team : (List<Team__c>)\
  \ Records) {\n    ComplianceService.VerifyResult testingDistance =\n    new ComplianceService.VerifyResult();\n\
  \    testingDistance.ComplianceCode = '22.5';\n    testingDistance.RecordId = team.Id;\n\
  \    testingDistance.passed = team.TestingDistance__c != null ?\n    team.TestingDistance__c\
  \ <= 15000 : true;\n    testingDistance.failureReason = testingDistance.passed ?\n\
  \    null : 'Testing exceeded 15,000km';\n    teamVerifyResults.add(testingDistance);\n\
  \    }\n\n    // Verify associated Drivers compliance\n    teamVerifyResults.addAll(\n\
  \    new Drivers(\n    new DriversSelector().selectDriversByTeam(\n    new Map<Id,\
  \ SObject>(Records).keySet()))\n    .verifyCompliance());\n    return teamVerifyResults;\n\
  \  }\n}\n```\n\n> 前面的代码利用了应用于 Domain 层的批量化准则，因为 Drivers Domain 类的逻辑直接从 Teams Domain\
  \ 类重用，未做任何更改。还要注意，Drivers Domain 类的实现过去和现在都不知道车手按车队拆分的情况。\n\n以下屏幕截图显示了使用 Lightning\
  \ App Builder 添加到车队页面的新车队对象和合规性检查器组件。车队记录和相关车手记录存在合规性问题。对于车队记录，测试距离值大于 15,000 km\
  \ 无效。显示的 Lewis Hamilton 车手记录上的 FIA Super License 字段未勾选，未显示。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_240_0.png)\n\
  \n## 更新 FormulaForce 包\n\n与之前一样，使用本章提供的源代码更新您的打包组织并上传新版本的包。请确保检查任何未自动添加到包的组件，例如\
  \ Apex 类、对象、标签页和 Lightning Components 标签页。\n\n在打包之前，删除通过 Lightning App Builder 添加到页面上的任何\
  \ Lightning Components。如果您打包带有组件的 Lightning Pages，这将要求用户启用 My Domain 功能，从而可能限制您的包可以安装的客户数量。这对于尚未完全采用\
  \ Lightning Experience 的客户尤其如此。\n\n请注意，自上一章中包的上一个版本发布以来，新的“验证合规性”按钮已添加到车手布局中。但是，由于布局是不可升级的组件，升级时需要在测试组织中安装后手动添加此按钮，本章添加的任何新自定义字段也是如此。您通常会通过升级和安装指南通知用户这些步骤。您还需要确保用户了解解决方案中包含的任何\
  \ Lightning Components。如前所述，打包 Lightning Pages 会创建对客户已启用 My Domain 功能的依赖。\n\n##\
  \ 摘要\n\n在本章中，您了解了一种新的业务逻辑拆分方式，它超越了将逻辑封装在 Service 层中——通过适当命名的 Domain 类，将验证更改和对象数据的解释与逻辑对齐。与\
  \ Service 层一样，这种方法使得新老开发人员在代码库中工作时能够轻松找到此类代码。\n\nDomain 类结合了传统的 Apex Trigger 逻辑和自定义\
  \ Domain 逻辑，例如为参赛者计算锦标赛积分或验证针对赛车、车手和车队的合规性规则。\n\n\n\n\n\n利用 Apex 类，即可开始发挥面向对象编程（OOP）实践的能力，使用接口和工厂方法在应用程序中实现功能子系统，不仅能够交付实现速度、一致性和复用性，还能帮助支持一致的用户体验。域类在需要时可以相互调用，以涵盖相关子组件的行为，例如团队中的车手。\n\
  \n最后，在测试域层时，请记住单元测试的最佳实践是尽可能在隔离状态下，结合多种用例和数据组合来测试代码，尽管其他测试（例如来自服务层的测试）和其他调用者也会执行这些代码路径，但变化可能较少。\n\
  \n在下一章中，我们将深入探讨选择器模式，从而完善 Martin Fowler 提出的三种模式。在本章中，我们在从应用程序使用的各种自定义对象读取数据时，已经多次使用了此模式。\n\
  \n## 应用程序选择器层\n\nApex 是一种非常富有表现力的语言，用于执行用户输入的数据或从自定义对象读取的记录的计算和转换。然而，SOQL 本身也包含大量表现力，可用于选择、过滤和聚合信息，而无需使用\
  \ Apex。SOQL 也是一种在单个语句中遍历关系（最多五个级别）的强大方式，而对于其他平台上的开发人员来说，否则需要执行多个查询。\n\n在应用程序的不同执行上下文和业务逻辑场景中，通常需要相同或类似的\
  \ SOQL 语句。在需要时内联执行这些查询，随着对象架构、字段和关系的扩展和调整，很快就会成为一项维护难题。\n\n本章介绍了一种新的 Apex 类类型，即选择器（Selector），它基于\
  \ Martin Fowler 的 Mapper 模式，旨在封装 SOQL 查询逻辑，从而在整个应用程序中轻松访问、维护和重用此类逻辑。\n\n本章将涵盖以下方面：\n\
  \n- 介绍选择器层模式\n- 实现设计指南\n- 选择器类模板\n- 实现标准查询逻辑\n- 实现自定义查询逻辑\n- 介绍选择器工厂\n\n## 介绍选择器层模式\n\
  \n以下是 Martin Fowler 对数据映射器层的定义，选择器层模式基于此定义（http://martinfowler.com/eaaCatalog/dataMapper.html）：\n\
  \n> “映射器（473）层在对象和数据库之间移动数据，同时保持彼此之间以及与映射器本身的独立性。”\n\n在 Martin 的定义中，他所指的对象是在 Java\
  \ 或 Apex 等面向对象语言中通过类实例化而生成的对象。当然，在 Force.com 世界中，这有点歧义，但更常被认为是存放记录数据的标准对象或自定义对象。\n\
  \nApex 语言的一个出色特性是，它会自动将与您定义的自定义对象定义相对应的对象类型注入到语言中。这些所谓的 SObject 在代码和数据库架构之间创建了类型安全的绑定，不过，如果需要，您也可以使用动态\
  \ Apex 和动态 SOQL 在运行时更改这些引用。\n\n本质上，SObject 是从数据库读取的数据的原生内存表示。因此，在 Apex 中，要公开记录字段数据并不严格要求采用传统的普通旧\
  \ Java 对象（POJO）方法。此外，通过 Race__c.Drivers__r 等关系字段，可以访问相关记录，而无需使用常规的 POJO 关系访问器方法或属性。\n\
  \n因此，本章中描述的表示选择器层代码的 Apex 类的角色，更侧重于封装应用程序的 SOQL 查询，促进重用和数据一致性，而不是将数据库中的信息映射到内存中。\n\
  \n> 有人可能会将域类视为围绕 SObject 的数据包装器，因为它们包含 SObject 列表。然而，这并非本意；域类方法纯粹公开行为方法。Records\
  \ 属性公开 SObject 列表，以便调用者可以以常规方式访问字段数据。\n\n下图展示了实现选择器层的 Apex 类在服务层和域层以及其他执行上下文（例如**批量\
  \ Apex**）中的交互和复用位置。大体而言，它是一个概念上位于服务层之下（服务边界下方）的层，尽管它可以从执行数据库查询的执行上下文（例如批量 Apex 和控制器）中复用。\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_246_0.png)\n\n## 实现设计指南\n\n选择器类中的方法封装了应用程序的常见\
  \ SOQL 查询，例如 `selectById`，以及更多与业务相关的方法，例如 `selectByTeam`。这有助于使用选择器类的开发人员识别出满足业务需求所需的正确方法，并避免在整个应用程序中复制\
  \ SOQL 查询。\n\n每个方法还具有某些标准特征，例如无论调用哪个方法，查询所执行的 `SObject` 字段。总体目标是让调用者专注于返回的记录数据，而非数据如何从数据库读取。\n\
  \n## 命名约定\n\n到现在为止，您对命名约定应该已经有所了解。选择器类和方法从其他层借鉴了指南，并进行了一些小调整。编写选择器代码时，请考虑以下命名约定：\n\
  \n- 类名称：命名选择器类时，通常遵循与域类相同的约定，采用与其关联对象的复数名称并在末尾追加单词 Selector；不过，您可以将常见的跨对象查询分组到单个模块作用域类中：\n\
  \  - 不良示例：RaceSQLHelper 和 SQLHelper\n  - 良好示例：RacesSelector、DriversSelector 和 RacingAnalyticsSelector\n\
  \n- 方法名称：select 前缀是表达选择器方法共同目的的好方法，随后跟上所使用的主要条件和/或关系的描述。与服务和域方法一样，避免重复类名中已使用的术语：\n\
  \  - 不良示例：getRecords、getDrivers、loadDrivers、selectDriversById 和 selectRacesAndContestants。\n\
  \  - 良好示例：selectById、selectByTeam、selectByIdWithContestants 和 selectByIdWithContestantsAndDrivers。\n\
  \n- 方法签名：选择器方法通常返回 Map、List 或 QueryLocator，公开生成的 SObject，从而支持平台以及其他层（例如域类构造函数和批量\
  \ Apex）的批量化需求。方法参数反映 WHERE 子句的参数化方面；同样，在适用的情况下，这些参数也应批量化：\n  - 不良示例：\n    ```\n\
  \    selectById(Id recordId)\n    DriverSelector.select(Set<Id> teamIds)\n    Database.QueryLocator\
  \ queryForBatch(Set<Id> ids)\n    ```\n  - 良好示例：\n    ```\n    selectById(Set<Id>\
  \ raceIds)\n    selectByTeam(Set<Id> teamIds)\n    ```\n\n## 批量化\n\n如您所见，基于方法命名和签名约定示例，与服务层和域层一样，重要的是要考虑到在大多数情况下，调用者都会希望遵循批量化最佳实践。请确保方法返回类型和参数类型是列表类型——例如\
  \ `Set`、`List`、`Map`、`QueryLocator` 或 `Iterator` 都可以使用。\n\n## 记录顺序一致性\n\n编写 SOQL\
  \ 查询时，经常会忽略 `order by` 子句，这可能导致客户端/控制器开发人员自行实现排序。平台的默认顺序是非确定性的，尽管有时看起来反映插入顺序，因此缺少\
  \ `order by` 子句在测试中往往会被忽略。通过使用选择器，您可以对所有选择器方法应用默认排序。\n\n> 返回 `Map<Id, SObject>`\
  \ 而不是 `List<SObject>` 可能似乎有助于调用者处理信息。Apex 中的 Map 具有可预测的迭代器顺序，但文档中不清楚这是否是将项添加到映射时的顺序。如果您担心此问题，请记住，如果在选择器中使用\
  \ Map，则 `order by` 子句的结果可能会受到影响。鉴于通过将列表传递给 Map 构造函数即可轻松按 SObject ID 创建映射，因此通常最好将是否包装返回列表的选项留给调用代码。\n\
  \n## 一致查询字段\n\n在同一个 Apex 执行中，尽可能避免多次重新查询相同的记录，这是一种良好做法。与其仅为了查询不同字段而为同一记录重复执行查询，不如对代码进行重构，以便将查询到的数据作为参数从一个方法传递到另一个方法，例如从服务方法传递到域方法。\n\
  \n然而，此做法可能会变得有问题，因为在使用 SOQL 时，开发人员必须在执行语句时明确列出所需的字段，通常只声明最近代码路径所需的字段。\n\n后来，随着代码的演进，SObject\
  \ 数据在方法之间传递，尤其是共享代码。如果尝试读取最初未包含在 SOQL 中的字段，可能会发生运行时异常。结果是相同的代码在一种场景下成功执行，但在另一种场景下失败，原因是针对相同数据的\
  \ SOQL 语句表达不一致。\n\n\n\n\n\n例如，假设 Contestants.awardChampionshipPoint 域类方法已更新为同时使用\
  \ RaceTime__c 字段和 RacePosition__c 字段。此方法由 ContestantService 和 RaceService 类调用。暂不考虑\
  \ Selector 概念，对 ContestantService 进行如下更改即可完美满足此新需求：\n\n```\nContestants contestants\
  \ =\n    new Contestants(\n        [select Id, RacePosition__c, RaceTime__c\n  \
  \          from Contestant__c order by RacePosition__c]);\ncontestants.awardChampionshipPoints(uow);\n\
  ```\n\n但是，如果保持不变，RaceService 类中的以下代码会导致同一方法失败，并出现异常：SObject 行是通过未查询请求的字段的 SOQL 检索到的：Contestant__c.RaceTime__c：\n\
  \n```\nList<Contestant__c> contestants = new List<Contestant__c>() ;\nfor(Race__c\
  \ race :\n    [select Id,\n        (Select RacePosition__c from Contestants__r)\n\
  \        from Race__c where Id in :ids])\ncontestants.addAll(race.Contestants__r);\n\
  new Contestants(contestants).awardChampionshipPoints(uow);\n```\n\n还要注意，此示例中缺少 order\
  \ by 子句，而在上一个示例中已指定，因此在此情况下返回的记录顺序是非确定性的。最后两个示例说明，传递给共享域类 Contestants 的记录顺序可能因调用者而异。如果域类逻辑依赖于顺序，这可能会导致意外行为。\n\
  \n修复这些不一致性有两种可能的方法，但都不理想：\n\n- 更新 awardChampionshipPoints 方法，使其执行自己的 SOQL 查询，并确保它始终能获取所需信息，而不论最初传递给域类构造函数的是什么。虽然这可能更具封装性，但在\
  \ SOQL 查询和性能方面却是浪费的。\n\n- 在应用程序代码中搜索 SOQL 语句，并更新每个区域中的相应 SOQL 逻辑（包括关系子查询）。\n\n当然，确保两个区域都有充足的单元测试和集成测试也能在一定程度上降低风险，但都无法真正提升性能或鼓励\
  \ SOQL 复用。Selector 模式的一个好处是封装一组常用字段列表，使 Selector 上的所有方法都返回填充了一组一致字段的 sObject，只要使用\
  \ Selector 来查询记录，这些字段就可以在整个应用程序代码中依赖。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_250_0.png)\n\
  \n> 在单个执行上下文中查询大量记录时，查询更多字段通常与保持低 **堆** 和/或 **视图状态大小** 的愿望背道而驰，尤其是当 Selector 返回要在\
  \ Visualforce 页面上显示的查询数据时。在本章后面的章节中，我们将看到如何使用 Apex 数据类仅表示查询的字段数据。\n\n## Selector\
  \ 类模板\n\nSelector 类（与 Domain 类类似）利用继承来获取一些标准功能；在此情况下，基类是通过 **FinancialForce.com\
  \ 企业 Apex 模式**库提供的，即 `fflib_SObjectSelector`。\n\n基本示例如下：\n\n```apex\npublic class\
  \ RacesSelector extends fflib_SObjectSelector {\n  public List<Schema.SObjectField>\
  \ getSObjectFieldList() {\n    return new List<Schema.SObjectField> {\n      Race__c.Id,\n\
  \      Race__c.Name,\n      Race__c.Status__c,\n      Race__c.Season__c,\n     \
  \ Race__c.FastestLapBy__c,\n      Race__c.PollPositionLapTime__c,\n      Race__c.TotalDNFs__c\
  \ };\n  }\n  public Schema.SObjectType getSObjectType() {\n    return Race__c.SObjectType;\n\
  \  }\n}\n```\n\n基类使用动态 SOQL 来实现本章中描述的功能。这可能带来的一个潜在缺点是，对字段的引用是在 Apex 编译器不知情的情况下进行的，因此，当您尝试删除或重命名字段时，不会收到给定字段已被引用的警告。为了避免这种情况，使用了对字段的\
  \ SObjectField 引用，它是通过写出 SObject 名称，后跟句点和字段名称来获得的。这有点像 SObject 类型上的静态属性。这种方法确保平台知道该类正在引用这些字段，即使它们是在动态\
  \ SOQL 上下文中使用。\n\n使用这个最小示例，可以通过利用 `selectSObjectsById` 基类方法来执行以下标准查询。该方法获取前面方法提供的信息，动态构建\
  \ SOQL 查询，并通过 `Database.executeQuery` 执行：\n\n```\nList<Race__c> races = (List<Race__c>)\n\
  new RacesSelector().selectSObjectsById(raceIds);\n```\n\n请注意，`fflib_SObjectSelector.selectSObjectsById`\
  \ 基类方法执行许多功能，将在本章后面描述。另请注意，创建了 Selector 实例但并未实际存储；使用实例可以继承基类行为。使用 Selector 实例的更多好处将在本章后面介绍，届时我们将讨论\
  \ **Selector 工厂**和测试。\n\n前面的 Selector 方法示例动态创建了以下 SOQL。随着本章的深入，如何做到这一点将变得更加清晰：\n\
  \n```\nSELECT\n Name, TotalDNFs__c, Status__c, Season__c, Id,\n PollPositionLapTime__c,\
  \ FastestLapBy__c\nFROM Race__c\nWHERE id in :idSet ORDER BY Name\n```\n\n下表显示了\
  \ `fflib_SObjectSelector` 类的一些关键基类方法，这些方法可供 Selector 方法使用，也可以被重写。请注意，`getSObjectType`\
  \ 和 `getSObjectFieldList` 方法是抽象的，因此至少必须按前面示例所示实现。\n\n| 方法 | 修饰符 | 用途 |\n| :--- |\
  \ :--- | :--- |\n| `getSObjectType` | abstract | 告知基类正在描述哪个 SObject |\n| `getSObjectFieldList`\
  \ | abstract | 返回构建此选择器类中使用的查询时使用的通用字段列表 |\n| `selectSObjectsById` | public | 执行动态生成的\
  \ SOQL 查询，选择 `getSObjectFieldList` 方法指定的字段。 |\n| `getOrderBy` | virtual | 可选择重写此项，以更改基类生成或执行的查询所应用的默认\
  \ order by。 |\n| `getSObjectFieldSetList` | Virtual | 可选择提供字段集列表，供基类查询生成器在生成要查询的字段列表时考虑。\
  \ |\n| `newQueryFactory` | public | 在执行之前，提供一种面向对象的方式来进一步自定义基类生成的查询。 |\n\n以下章节将详细介绍这些方法。还请花一些时间探索基类代码中的其他方法和相关代码注释。\n\
  \n## 实现标准查询逻辑\n\n之前的 Selector 使用示例要求将返回的列表强制转换为 `Race__c` 对象列表，这并不理想。为改进这一点，您可以轻松地向类添加一个新方法，以提供基类方法的更具体版本，如下所示：\n\
  \n```java\npublic List<Race__c> selectById(Set<Id> raceIds) {\n\treturn (List<Race__c>)\
  \ selectSObjectsById(raceIds);\n}\n```\n\n因此，使用代码现在如下所示：\n\n```\nList<Race__c> races\
  \ =\n    new RacesSelector().selectById(raceIds);\n```\n\n## Selector 基类的标准功能\n\n\
  fflib_SObjectSelector 基类包含其他功能，以提供更多查询一致性和平台集成。这些功能适用于前述的 selectSObjectsById 方法以及您自己的方法。以下各部分将介绍这些功能中的每一项。\n\
  \n> 当然，您可以进一步扩展此基类的标准功能。也许您希望所有查询都要考虑某些内容，或者架构设计中有通用字段或方面，或者大多数 Selector 都有共同功能。在这种情况下，请创建自己的基类，并让\
  \ Selector 继承它，如下所示。\n\n```\npublic abstract class ApplicationSelector\n    extends\
  \ fflib_SObjectSelector\n{\n    // Add your common methods here\n}\npublic class\
  \ RacesSelector\n    extends ApplicationSelector\n{\n    // Methods using methods\
  \ from both base classes\n}\n```\n\n## 强制执行对象和字段安全性\n\nSalesforce 要求开发人员在查询时实现对象读取安全性和字段级读取安全性检查。通常使用\
  \ SObjectDescribe 和 SObjectFieldDescribe Apex 运行时类型上的方法。以下各部分将介绍 fflib_SObjectSelector\
  \ 基类在这方面的支持。\n\n## 默认行为\n\n默认情况下，fflib_SObjectSelector 基类中的基类方法会自动执行对象读取安全性。基类强制执行字段级读取安全性的功能也可用，但默认不强制执行。\n\
  \n\n\n\n\n在两种情况下，如果启用了强制执行，且未为 `getSObjectType` 和 `getSObjectFieldSetList` 方法中引用的对象或字段授予用户对象或字段级读取权限，则会抛出异常。\n\
  \n## 覆盖默认行为\n\n在应用程序代码代表用户读取对象的情况下，您可能希望禁用上述默认强制执行。例如，代表用户读取赛事数据以更新应用程序的其他区域。此类访问通常称为系统级访问。在这些情况下，您可能不希望强制执行此检查。\n\
  \n在某些情况下允许此强制执行检查执行可能并不可取，因为如前示例所示，这会要求用户获得底层赛事数据对象的访问权限，才能使用读取但不向用户显示赛事数据的应用程序方面。禁用选择器默认行为的另一动机是，您希望在控制器逻辑中更显式地对这些检查进行编码。\n\
  \nSObjectSelector 类提供的构造函数参数允许每个 Selector 类控制是否启用安全强制执行。这也适用于任何实例化 Selector 类的代码，从而允许按用例为基础做出此决定，例如，当选择器在\
  \ Controller 类中使用时。\n\n为了更轻松地在整个应用程序中配置 fflib_SObjectSelector 类，以及为建立共享或通用 Selector\
  \ 逻辑代码的位置提供手段，可以按如下创建一个新基类：\n\n```\npublic abstract class ApplicationSelector extends\
  \ fflib_SObjectSelector {\n\n    public ApplicationSelector() {\n        this(false);\n\
  \    }\n\n    public ApplicationSelector(Boolean includeFieldSetFields) {\n    \
  \    // Disable the default base class read security checking\n        // in preference\
  \ to explicit checking elsewhere\n        this(includeFieldSetFields, false, false);\n\
  \    }\n\n    public ApplicationSelector(\n        Boolean includeFieldSetFields,\n\
  \        Boolean enforceCRUD,\n        Boolean enforceFLS) {\n        // Disable\
  \ sorting of selected fields to aid debugging\n        // (performance optimisation)\n\
  \        super(\n            includeFieldSetFields, enforceCRUD, enforceFLS, false);\n\
  \    }\n}\n```\n\n前面的示例还利用了 `fflib_SObjectSelector` 基类的另一个配置参数，即 `sortSelectFields`\
  \ 参数。此参数已添加，以便在构建 SOQL 查询时允许禁用字段名的排序。虽然这有助于调试，但确实会带来性能开销。出于向后兼容性考虑，基类保留此行为，但允许可选地禁用它。\n\
  \n因此，此应用程序中的 Selector 类改为扩展此类：\n\n```\npublic class RacesSelector extends ApplicationSelector\
  \ {\n```\n\n请注意，此方法要求开发人员独自承担实现对象和字段级安全检查的全部责任。这将在后面的章节中详细讨论。\n\n## 排序\n\n如前文所提及，为记录设置默认顺序对于避免平台\
  \ SOQL 引擎的随机非确定性行为非常重要。`selectSObjectById` 基类方法调用 `getOrderBy` 方法来确定用于对选择器返回的记录进行排序的字段。\n\
  \n默认行为是使用 `Name` 字段（如果可用，否则使用 `CreatedByDate`）。因此，之前的用法已经按 `Name` 排序，无需进一步编码。如果您希望更改此行为，请按如下所示覆盖该方法。此示例由\
  \ `ContestantsSelector` 类使用，以确保参赛者始终按赛季、赛事及其赛事名次的顺序查询：\n\n```\npublic override String\
  \ getOrderBy() {\n    return 'Race__r.Season__r.Name, Race__r.Name, RacePosition__c';\n\
  }\n```\n\n在本章后面，您将看到如何构建自定义选择器方法；这些方法可以选择使用 `getOrderBy` 方法。这样，如果您希望，某些方法可以使用不同于默认值的\
  \ `order by` 子句。\n\n## 字段集\n\n如前一章所讨论，利用字段集平台功能是确保您的应用程序与应用程序用户期望的自定义能力高度一致的关键。但是，您可能会想知道这与查询数据有什么关系？嗯，尽管我们围绕此功能的大部分讨论将集中在\
  \ UI 环境中的使用，但订户组织中添加的其他自定义字段仍然需要被查询才能显示；否则，就会发生异常，就像您未能查询打包字段一样。\n\n要使用此功能，您需要覆盖\
  \ `getSObjectFieldSetList` 方法，并使用 `includeFieldSetFields` 参数构建选择器。默认构造函数将此参数设置为\
  \ false，因此通常情况下，**字段集**字段不包括在内。以下示例假设 **Race** 对象上有一个名为 `SeasonOverview` 的字段集（包含在本章代码中）：\n\
  \n| 操作 | 字段标签 | API 名称 | 使用位置 |\n| :--- | :--- | :--- | :--- |\n| 编辑 | 删除 | 赛季概览\
  \ | fflib__SeasonOverview | 用于在赛季概览页面显示 Race 详细信息时。 |\n\n以下代码说明了此功能的配置（请注意，基类中的逻辑还确保，如果订户将您自己的打包字段添加到字段集中，则此类字段仅添加到\
  \ SOQL 语句字段列表一次）：\n\n```\npublic RacesSelector() {\n    super();\n}\n```\n\n```\n\
  public RacesSelector(Boolean includeFieldSetFields) {\n    super(includeFieldSetFields);\n\
  }\n```\n\n```\npublic override List<Schema.FieldSet> getSObjectFieldSetList() {\n\
  \    return new List<Schema.FieldSet>\n    { SObjectType.Race__c.FieldSets.SeasonOverview\
  \ };\n}\n```\n\n### 多货币\n\n如第 2 章“利用平台功能”中所述，启用和引用某些平台功能可能会在您的包中创建依赖项，要求您的客户在安装前也启用这些功能，这可能并不总是可取的。多货币就是其中一项功能。启用后，每个对象都会获得\
  \ CurrencyISOCode 字段；该字段随后也会出现在页面布局、报表等位置。Salesforce 确保订户在启用前充分了解其影响。\n\n如果您想在应用程序中利用该功能（但不认为这会是所有客户都需要的功能），您可以使用动态\
  \ Apex 和动态 SOQL 引用此字段。正是在此方面，fflib_SObjectSelector 基类提供了一些帮助。\n\n> 使用个人账户时，您可能希望考虑在此处描述的方法，因为只有在启用此功能的情况下，Account\
  \ 对象上的某些字段才会存在。\n\n如果您在 getSObjectFieldList 方法中明确列出了 CurrencyISOCode 字段，那么您将把代码及其所在的包绑定到此平台功能。相反，基类所做的是使用\
  \ UserInfo.isMultiCurrencyOrganization 方法动态地将此字段包含在其执行的 SOQL 查询中。请注意，您仍然需要使用动态 Apex\
  \ 来检索字段值，如以下代码所示：\n\n```\nList<Team__c> teams = (List<Team__c>)\nnew TeamsSelector().selectSObjectsById(teamIds);\n\
  for(Team__c team : teams) {\n  String teamCurrency =\n    UserInfo.isMultiCurrencyOrganization()\
  \ ?\n    (String) team.get('CurrencyIsoCode') :\n    UserInfo.getDefaultCurrency();\n\
  }\n```\n\n对于域逻辑，您可能希望在自己的域基类（例如上一章中描述的 ApplicationDomain 类）中放置一个通用方法。这样，您可以将前述三元运算符封装为单个方法。本章的示例代码包含\
  \ ApplicationDomain.getCurrencyCodes 方法，可按如下方式使用：\n\n```\npublic override onBeforeInsert()\
  \ {\n    Map<Id, String> currencies = getCurrencyCodes();\n    for(Team__c team\
  \ : (List<Team__c>) Records) {\n        String teamCurrency = currencies.get(team.Id);\n\
  \    }\n}\n```\n\n### 实现自定义查询逻辑\n\n如果我们查看本章迄今一直使用的 selectSObjectById 基类方法的实现，则以下显示的\
  \ buildQuerySObjectById 方法代码说明了我们如何实现自定义选择器方法；它还突出了 newQueryFactory 基类方法的用法：\n\n\
  ```\npublic List<SObject> selectsObjectsById(Set<Id> idSet) {\n    return Database.query(buildQuerySObjectById());\n\
  }\nprivate String buildQuerySObjectById() {\n    return newQueryFactory().\n   \
  \     setCondition('id in :idSet').\n        toSOQL();\n}\n```\n\nnewQueryFactory\
  \ 方法暴露了一种面向对象的替代方式来表达 SOQL 查询。它遵循流畅设计模型，其方法使配置不那么冗长。有关此方法的更多信息，请参见 https://en.wikipedia.org/wiki/Fluent_interface。\n\
  \n由此方法返回的 fflib_QueryFactory 实例已预先配置为通过先前讨论的选择器方法表达的对象、字段、排序和任何字段集字段。如前所述，它还将强制启用安全性。因此，通常您只需通过\
  \ setCondition 方法提供 SOQL where 子句，如上一段代码所示。最后，toSOQL 方法返回传递给标准 Database.query 方法的实际\
  \ SOQL 查询字符串。\n\n\n\n\n> fflib_QueryFactory 类方法提供了构建动态 SOQL 查询时使用标准字符串拼接或 String.format\
  \ 方法的替代方案。fflib_QueryFactory 类的原始作者 Chris Peterson 创建它的动力在于，避免基于字符串的方法可能带来的脆弱性，并提供一种更易读的方式来理解此类代码的作用。此外，由于该类支持使用\
  \ SObjectField 引用，而非字符串中的字段名引用，因此此类代码不易受到 SOQL 注入漏洞的影响。\n\n## 自定义 Selector 方法的基本示例\n\
  \n首先，我们来看一个基本示例，该示例根据分配给 Driver__c 的团队进行查询。按照指南，参数已批量化，如果需要，允许你查询多个团队中的驱动程序。\n\n\
  ```\npublic List<Driver__c> selectByTeam(Set<Id> teamIds) {\n    return (List<Driver__c>)\n\
  \    Database.query(\n    newQueryFactory().\n    setCondition('Team__c in :teamIds').\n\
  \    toSOQL();\n    }\n```\n\n通过使用 newQueryFactory 方法，fflib_QueryFactory 实例已预先填充了选择器指定的字段列表、对象名称和\
  \ order by 子句的知识。因此，此 Selector 方法在已填充字段和返回记录的顺序方面表现一致。\n\n## 带有子查询的自定义 Selector\
  \ 方法\n\n在以下示例中，查询使用子查询来包含子记录（在此示例中，Race 中的 Contestants）。关键点在于，RacesSelector 方法（如以下代码所示）重用\
  \ ContestantsSelector 类的实例来访问其字段列表并执行安全检查：\n\n```\npublic List<Race__c> selectByIdWithContestants(Set<Id>\
  \ raceIds) {\n    fflib_QueryFactory racesQueryFactory = newQueryFactory();\n  \
  \  fflib_QueryFactory contestantsSubQueryFactory =\n    new ContestantsSelector().\n\
  \    addQueryFactorySubselect(racesQueryFactory);\n    return (List<Race__c>) Database.query(\n\
  \    racesQueryFactory.setCondition('Id in :raceIds').toSOQL();\n}\n```\n\n前面的代码使用\
  \ fflib_SObjectSelector 方法 addQueryFactorySubselect。该方法创建一个新的 fflib_QueryFactory\
  \ 实例，并将其传递给传入方法的查询工厂（在此示例中为 racesQueryFactory）。在外部查询工厂上调用 toSOQL 方法时，它会自动为任何包含的查询工厂生成子查询。\n\
  \n通过重用 ContestantsSelector 的实例，确保无论如何查询 Contestant__c 记录列表（直接查询或作为子查询的一部分），字段都能一致地填充。ContestantSelector\
  \ 上的 getOrderBy 方法也被使用，以确保即使记录作为子查询的一部分返回，Contestant 记录的默认顺序也能保持不变。\n\n让我们再看一下之前使用的示例，以说明此模式如何避免了不一致查询的风险。虽然\
  \ Contestant__c 记录来自两个不同的选择器（RacesSelector 和 ContestantsSelector），但由于前面的实现中重用了 ContestantsSelector\
  \ 类，因此在已填充字段方面结果相同。\n\n以下示例显示标准 selectById 方法被用于查询 Contestants，以便将其传递给 Contestants\
  \ 域类构造函数，这是服务层实现中颁发冠军积分的一部分：\n\n```\nList<Contestant__c> contestants =\n    new\
  \ ContestantsSelector().selectById(contestantIds);\nnew Contestants(contestants).awardChampionshipPoints(uow);\n\
  ```\n\n以下替代示例显示 RaceSelector 上的自定义 selectByIdWithContestants 方法被用于查询 Races 和 Contestants，以便将其传递给\
  \ Contestants 域类构造函数以实现相同的结果：\n\n```\nList<Contestant__c> contestants = new List<Contestant__c>();\n\
  for(Race__c race :\n    new RacesSelector().selectByIdWithContestants(raceIds))\
  \ {\n    contestants.addAll(race.Contestants__r);\n}\nnew Contestants(contestants).awardChampionshipPoints(uow);\n\
  ```\n\n在这两个示例中，无论记录是作为直接查询还是子查询来查询，字段和记录排序都是一致的。这让开发者更有信心使用最佳方法来查询当时所需的记录。\n\nselectByIdWithContestants\
  \ 方法生成以下 SOQL：\n\n```\nselect\nName, TotalDNFs__c, Status__c, Season__c, Id,\nPollPositionLapTime__c,\
  \ FastestLapBy__c,\n(select\nQualification1LapTime__c, ChampionshipPoints__c,\n\
  Driver__c, GridPosition__c, Qualification3LapTime__c,\nRacePosition__c, Name, DNF__c,\
  \ RaceTime__c,\nId, DriverRace__c, Qualification2LapTime__c, Race__c\nfrom Contestants__r\n\
  order by Race__r.Season__r.Name, Race__r.Name,\nRacePosition__c)\nfrom Race__c where\
  \ id in :raceIds order by Name\n```\n\n## 带有关联字段的自定义 Selector 方法\n\n除查询子记录外，还可以使用\
  \ SOQL 字段点表示法来查询关联记录。这提供了一种额外的方式来优化查询其他记录信息，而无需进行额外查询。\n\n以下是 ContestantsSelector\
  \ 类的自定义 Selector 方法示例，其中查询 Contestant 记录及其关联 Driver 记录字段。生成的 Contestant__c 对象会公开\
  \ Driver__r 字段，该字段提供一个填充了 DriversSelector 中指定的 Driver__c 字段的 Driver__c 实例：\n\n```\n\
  public List<Contestant__c> selectByIdWithDriver(Set<Id> driverIds) {\n    fflib_QueryFactory\
  \ contestantFactory = newQueryFactory();\n    new DriversSelector().\n    configureQueryFactoryFields(\n\
  \    contestantFactory,\n    Contestant__c.Driver__c.getDescribe().getRelationshipName());\n\
  \    return Database.query(\n    contestantFactory.setCondition('Id in :driverIds').toSOQL());\n\
  }\n```\n\n> fflib_SObjectSelector.configureQueryFactoryFields 方法将选择器字段添加到作为第一个参数传递的查询工厂中，使用第二个参数中指定的关系前缀。\n\
  \n由于上述代码中 ContestantsSelector 类方法重用了 DriversSelector，以下示例返回一致填充的 Driver__c 记录。这对于域类\
  \ Drivers.verifyCompliance 方法中包含的逻辑非常重要。这种灵活性允许以最佳方式查询 Driver__c 记录，并更安全地重用域类方法，而不考虑记录是如何查询的。\n\
  \n第一个示例使用 DriversSelector 类上的标准 selectById 方法的结果来构建 Drivers 域类：\n\n```\nList<Driver__c>\
  \ drivers = new DriversSelector().selectById(driverIds);\nList<ComplianceService.VerifyResult>\
  \ results = new Drivers(drivers).verifyCompliance();\n```\n\n第二个示例实现相同结果，但通过 ContestantsSelector\
  \ 类上的自定义 Selector 方法 selectByIdWithDriver 查询 Drivers 记录：\n\n```\nList<Driver__c>\
  \ drivers = new List<Driver__c>();\nList<Contestant__c> contestants = new ContestantsSelector().selectByIdWithDriver(contIds);\n\
  for(Contestant__c contestant : contestants)\n    drivers.add(contestant.Driver__r);\n\
  List<ComplianceService.VerifyResult> results = new Drivers(drivers).verifyCompliance();\n\
  ```\n\n再次，这两个示例都表明，即使在 SOQL 中使用关联字段，生成的记录也可以与选择器表达的所需字段保持一致。selectByIdWithDriver\
  \ 方法生成以下 SOQL：\n\n```\nSELECT Qualification1LapTime__c, ChampionshipPoints__c, Driver__c,\n\
  \tGridPosition__c, Qualification3LapTime__c, RacePosition__c,\n\tName, DNF__c, RaceTime__c,\
  \ Id, DriverRace__c,\n\tQualification2LapTime__c, Race__c,\n\tDriver__r.FIASuperLicense__c,\
  \ Driver__r.Name,\n\tDriver__r.Id, Driver__r.Team__c\nFROM Contestant__c\nWHERE\
  \ Id in :driverIds\nORDER BY Name\n```\n\n\n## 带有自定义数据集的自定义 Selector 方法\n\nSOQL\
  \ 拥有非常丰富的点号表示法，可在单个查询中遍历关系（查找）字段以访问相关记录上的其他字段。要以表格形式获取以下信息，需要遍历 FormulaForce 应用程序对象模式中许多对象上的关系：\n\
  \n- 赛季名称\n- 赛事名称\n- 赛车位置\n- 车手姓名\n- 车辆名称\n\n首先，让我们考虑以下 SOQL，然后看看如何将它及其返回的数据封装在 ContestantsSelector\
  \ 类方法中。请注意，此处也应用了常见的 order by 子句，就像前一个示例中一样：\n\n```\nselect\n    Race__r.Season__r.Name,\n\
  \    Race__r.Name,RacePosition__c,\n    Driver__r.Name,\n    Driver__r.Team__r.Name,\n\
  \    Car__r.Name\nfrom\n    Contestant__c\nwhere\n    Race__c in :raceIds\norder\
  \ by\n    Race__r.Season__r.Name, Race__r.Name, RacePosition__c\n```\n\n此查询将导致部分填充的\
  \ Contestant__c 对象，不仅如此，关系字段还将公开部分填充的 Season__c、Car__c 和 Driver__c 记录。因此，这些只是简单返回到调用代码路径中的高度专业化记录实例。\n\
  \n以下代码展示了使用新 ContestantsSelector 方法的替代查询。与之前的方法最大的区别在于，它返回的是自定义 Apex 数据类型，而不是 Contestant__c\
  \ 对象。您还可以看到，哪些信息可用、哪些不可用，要容易得多：\n\n```\nList<ContestantsSelector.Summary> summaries\
  \ =\n    new ContestantsSelector().\n    selectByRaceIdWithContestantSummary(raceIds).values();\n\
  for (ContestantsSelector.Summary summary : summaries) {\n    System.debug(\n   \
  \     summary.Season + ' ' +\n        summary.Race + ' ' +\n        summary.Position\
  \ + ' ' +\n        summary.Driver + ' ' +\n        summary.Team + ' ' +\n      \
  \  summary.Car);\n}\n```\n\n根据您的数据，这将输出类似于以下调试信息：\n\n```\nUSER_DEBUG|[26]|DEBUG|2016\
  \ Spa 1 Lewis Hamilton Mercedes MP4-29\nUSER_DEBUG|[26]|DEBUG|2016 Spa 2 Rubens\
  \ Barrichello Williams FW36\n```\n\nSelector 方法返回一个新的 Apex 内部类，该类使用 Apex 属性明确公开仅查询的字段信息，从而在\
  \ Selector 方法和调用者之间建立更清晰的契约。\n\n现在不可能引用未查询的信息，当代码尝试引用未查询的字段时会导致运行时错误。以下显示了 Selector\
  \ 使用的 Apex 内部类，用于明确公开自定义 Selector 方法查询的信息：\n\n```\npublic class Summary {\n    private\
  \ Contestant__c contestant;\n    public String Season {\n        get { return contestant.Race__r.Season__r.Name;\
  \ } }\n    public String Race {\n        get { return contestant.Race__r.Name; }\
  \ }\n    public Decimal Position {\n        get { return contestant.RacePosition__c;\
  \ } }\n    public String Driver {\n        get { return contestant.Driver__r.Name;\
  \ } }\n    public String Team {\n        get { return contestant.Driver__r.Team__r.Name;\
  \ } }\n    public String Car {\n        get { return contestant.Car__r.Name; } }\n\
  \n    private Summary(Contestant__c contestant) {\n        this.contestant = contestant;\n\
  \    }\n}\n```\n\nSummary 类私有地包含查询数据的一个实例，因此不会占用额外的堆内存。它将信息公开为只读，并将构造函数设为私有，表明仅可通过\
  \ ContestantsSelector 类获得此类实例。\n\n以下代码显示了执行实际查询的 Selector 方法：\n\n```\npublic Map<Id,\
  \ List<Summary>>\nselectByRaceIdWithContestantSummary(Set<Id> raceIds) {\n\nMap<Id,\
  \ List<Summary>> summariesByRaceId =\nnew Map<Id, List<Summary>>();\n\nfor(Contestant__c\
  \ contestant :\nDatabase.query(\nnewQueryFactory(false).\nselectField(Contestant__c.RacePosition__c).\n\
  selectField('Race__r.Name').\nselectField('Race__r.Season__r.Name').\nselectField('Driver__r.Name').\n\
  selectField('Driver__r.Team__r.Name').\nselectField('Car__r.Name').\nsetCondition('Race__c\
  \ in :raceIds').\ntoSOQL()))) {\n\nList<Summary> summaries =\nsummariesByRaceId.get(contestant.Race__c);\n\
  if(summaries==null) {\nsummariesByRaceId.put(\ncontestant.Race__c, summaries = new\
  \ List<Summary>());\nsummaries.add(new Summary(contestant));\n}\n}\n\nreturn summariesByRaceId;\n\
  }\n```\n\n> 您可以利用 Apex Describe API 在前面的关系引用中添加编译时检查和引用完整性。例如，不要硬编码 Race__r.Name，而是可以使用以下内容：\n\
  > \n> Contestant__c.Race__c.getDescribe().\n> getRelationshipName() + '.' + Race__c.Name\n\
  \n前面的代码显示 newQueryFactory 方法传入了 false。这指示基类不要用选择器字段配置返回的查询工厂。这使调用者可以使用 selectField\
  \ 方法根据需要指定特定字段。\n\n> 如果您正在实现一个引用本节中所述使用自定义数据集的自定义 Selector 方法的 Apex 接口，则应考虑将该类创建为顶级类。这可以避免接口和\
  \ Selector 类之间出现潜在的循环依赖。\n\n## 将 Apex 数据类型与 SObject 类型相结合\n\n可以在 Selector 方法的响应中将\
  \ Apex 数据类型与 SObject 数据类型相结合。只要返回 SObject 数据类型时，它们是根据相应 Selector 指示的字段填充的即可。\n\n\
  例如，假设我们想返回与 Contestant 对象关联的完整 Driver__c 记录，而不仅仅是 Driver 名称。对 Summary Apex 类的更改将是公开查询的\
  \ Driver__c 记录，这是安全的，因为它已根据 DriversSelector 填充。以下代码展示了如何修改 Summary 类以公开自定义 Selector\
  \ 方法中查询的 Driver__c 记录：\n\n```\npublic class Summary {\n    public Driver__c Driver\
  \ {\n    get { return contestant.Driver__r; } }\n    \n    ... \n}\n```\n\n在此示例中，使用\
  \ DriversSelector 实例获取字段列表，并将其连同其他特定字段一起注入查询工厂：\n\n```\nfflib_QueryFactory contestantQueryFactory\
  \ =\n    newQueryFactory(false).\n    selectField(Contestant__c.RacePosition__c).\n\
  \    selectField('Race__r.Name').\n    selectField('Race__r.Season__r.Name').\n\
  \    selectField('Car__r.Name').\n    setCondition('Race__c in :raceIds');\n\nnew\
  \ DriversSelector().\nconfigureQueryFactoryFields(\n    contestantQueryFactory,\n\
  \    Contestant__c.Driver__c.getDescribe().getRelationshipName());\n\nMap<Id, List<Summary>>\
  \ summariesByRaceId =\n    new Map<Id, List<Summary>>();\nfor (Contestant__c contestant\
  \ :\n    Database.query(contestantQueryFactory.toSOQL())) {\n```\n\n## SOSL 和聚合\
  \ SOQL 查询\n\n从数据库查询信息并非只有 SOQL 一种方式。Force.com 还提供了一个强大的 Salesforce 对象搜索语言（SOSL）设施。与\
  \ SOQL 类似，它也返回 SObjects。虽然本章没有深入介绍此变体，但使用封装 SOSL 的 Selector 方法是恰当的，实际上它为调用者提供了良好的抽象，允许\
  \ Selector 开发者在未来使用 SOQL 或 SOSL 而不影响调用者。\n\n同样，聚合 SOQL 查询也是封装在 Selector 方法中的良好候选。然而，在这些情况下，请考虑使用\
  \ Apex 原生数据类型（例如，值列表）或自定义 Apex 数据类型列表来公开聚合信息。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_267_0.png)\n\
  \n> 本书的汇总源代码可在 GitHub 仓库的 master 分支中找到，其中包含 RaceDataSelector 类。在该类中，有一个名为 selectAnalysisGroupByRaceName\
  \ 的自定义 Selector 方法，演示了 SOQL 聚合查询的用法。\n\n\n\n\n\n## 介绍 Selector 工厂\n\n上一章介绍了 **Domain\
  \ 工厂** 的概念，它用于动态构建实现通用 **Apex 接口** 的 Domain 类实例，以实现合规框架。\n\n以下代码用于 ComplianceService.verify\
  \ 方法的实现中，完全不引用 Selector 类来查询构建适用 Domain 类所需的记录：\n\n```\nfflib_SObjectDomain domain\
  \ =\nApplication.Domain.newInstance(recordIds);\n```\n\n那么，Domain 工厂是如何检索记录以将其传递给底层\
  \ Domain 类构造函数的呢？答案是它在内部使用了另一个名为 **Selector 工厂** 的工厂实现。\n\n与 Domain 工厂类似，Selector\
  \ 工厂作为 Application 类中的静态实例存在，通过 Selector 静态类成员公开，如下所示：\n\n```\npublic class Application\n\
  {\n    // Configure and create the SelectorFactory for this Application\n    public\
  \ static final fflib_Application.SelectorFactory Selector =\n        new fflib_Application.SelectorFactory(\n\
  \            new Map<SObjectType, Type> {\n                Team__c.SObjectType =>TeamsSelector.class,\n\
  \                Race__c.SObjectType =>RacesSelector.class,\n                Car__c.SObjectType\
  \ =>CarsSelector.class,\n                Driver__c.SObjectType =>DriversSelector.class,\n\
  \                Contestant__c.SObjectType => ContestantsSelector.class }});\n\n\
  \    // Configure and create the DomainFactory for this Application\n    public\
  \ static final fflib_Application.DomainFactory Domain =\n        new fflib_Application.DomainFactory(\n\
  \            Application.Selector,\n            // Map SObjectType to Domain Class\
  \ Constructors\n            new Map<SObjectType, Type> {\n                Team__c.SObjectType\
  \ =>Teams.Constructor.class,\n                Race__c.SObjectType =>Races.Constructor.class,\n\
  \                Car__c.SObjectType =>Cars.Constructor.class,\n                Driver__c.SObjectType\
  \ =>Drivers.Constructor.class,\n                Contestant__c.SObjectType =>\n \
  \               Contestants.Constructor.class}});\n}\n```\n\n请注意，在前面的示例中，Selector\
  \ 工厂被传递给了 Domain 工厂。以下各节概述了工厂上的方法及相关用例。\n\n### SelectorFactory 方法\n\nSelectorFactory\
  \ 类有两个方法：newInstance 和 selectById。以下代码通过给出两个等效的用法示例来说明这两种方法，用于根据一组 ID 检索记录：\n\n\
  ```\nList<Contestant__c> contestants =\nApplication.Selector.selectById(contestantIds);\n\
  ```\n\n```\nList<Contestant__c> contestants =\nApplication.Selector.newInstance(Contestant__c.SObjectType)\n\
  .selectSObjectsById(contestantIds);\n```\n\n如你从前面的代码中所见，selectById 方法提供了一种快捷方式，用于访问\
  \ fflib_IObjectSelector 接口中的通用 selectSObjectById 方法，如前面章节所示，该方法由 fflib_SObjectSelector\
  \ 基类实现。因此，所有 Selector 类都保证提供该方法。它提供了一种更清晰的方式，以标准方式查询记录，而无需了解 Selector 的 Apex 类名称。这就是\
  \ Domain 工厂能够代表开发人员动态实例化加载了记录的 Domain 类实例的方式。\n\n该方法在内部使用 Id.getSObjectType（针对传入的第一个\
  \ ID）通过先前定义的映射查找 Selector 类并将其实例化（通过 Type.newInstance）。\n\n当你编写处理不同类型对象的通用代码时，会使用\
  \ newInstance 方法，而不是直接在 Selector 类中通过 new 运算符进行实例化。在其他情况下，你可以继续使用 new 运算符以正常方式实例化\
  \ Selector 类。\n\n## 编写测试和 Selector 层\n\n在专门为 Selector 类方法编写测试时，流程几乎与标准 Apex 测试准则一致；插入支持查询所需的数据，调用\
  \ Selector 方法，并断言返回的结果。你可以查看本章包含的一些 Selector 测试。\n\n> 如果你已实现返回 QueryLocator 实例（供\
  \ Batch Apex 调用者使用）的 Selector 方法，你仍然可以断言这些方法的结果。使用 iterator 方法获取 QueryLocatorIterator，然后调用\
  \ next 和 hasNext 方法以返回结果传递给你的断言语句。\n\n当然，围绕控制器、Batch Apex、Domain 和 Service 层的其他\
  \ Apex 测试也可能间接调用 Selector 方法，从而提供代码覆盖率，但不一定测试 Selector 类的每个方面。\n\n> 请尽量确保你的 Apex\
  \ 测试尽可能隔离地测试应用程序的各层和功能组件，以确保现有和未来的调用者不会遇到问题。\n\n如前文所述，通常编写更隔离的 Apex 测试会变得更加困难，因为被测试的代码往往需要在数据库中设置记录。通过利用前文描述的\
  \ Selector 工厂选项，可以对 Selector 方法采用模拟方法，这有助于使编写更隔离且更丰富的组件或类级别测试变得更容易。我们将在后续章节中重新讨论此主题。\n\
  \n## 更新 FormulaForce 包\n\n查看本章提供的更新代码并更新你的打包组织。执行另一次上传，并在测试组织中安装该包。安装期间，你应该会观察到本章添加的新字段集组件显示为升级中包含的新组件之一。\n\
  \n## 摘要\n\nSelector 模式为应用程序中某些关键逻辑提供了一个强大的封装层。它有助于强制执行安全方面的最佳实践，并为处理 `SObject` 数据的代码提供更一致、更可靠的基础。\n\
  \nSelector 还可以承担平台功能（如 **多币种** 和 **字段集**）的职责和关注点。最终，这允许调用者——无论是 Service、Domain，甚至是\
  \ Apex 控制器或 Batch Apex——专注于其职责和关注点，从而产生更清晰、更易于维护和演进的代码。\n\n随着 Selector 工厂的引入，我们提供了一种以\
  \ `Application.Selector.selectById` 和 `Application.Selector.newInstance` 方法形式访问该层的快捷方式，为更动态的场景（如上一章突出显示的合规框架）打开了潜力。\n\
  \n我希望用一张简单而生动的图表来结束本章系列，该图表展示了在 Domain 和 Selector 层的帮助下，Service 层代码如何协同工作。Force.com\
  \ 上的这三种模式通过一致性为开发人员增加价值，并支持批量化和代码复用方面的最佳实践。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_271_0.png)\n\
  \n虽然这是最后一章，专注于 Martin Fowler 企业应用架构模式的 Force.com 实现，但我们将在后续章节中重新讨论 Selector 的角色，关注\
  \ Batch Apex，并继续在讨论应用程序集成的后续章节中利用我们的 Service 层。\n"
- "# 8 用户界面\n\n如果要列举我职业生涯中出现又消失、周而复始的所有技术，我会说，那些影响最终用户体验的技术无疑是其中之一。做 UI 技术开发者是一份艰难的工作；从桌面端到\
  \ Web 端，再到移动端，乃至设备无关化的转变，让行业剧烈动荡，且这一局面仍在继续！这意味着，你对应用程序架构中这部分的投资至关重要，你在其中投入的逻辑也同样重要。如果在客户端层放入了不恰当的逻辑，可能会导致行为不一致，最糟糕的情况是，如果你未来决定更换客户端技术，将面临昂贵的重构工作。\n\
  \n本章讨论了为基于 Force.com 的应用程序交付用户界面的各个方面，如何充分利用 Salesforce 标准 UI，以及使用 Lightning 与 Visualforce\
  \ 构建自定义 UI。它还讨论了使用第三方富客户端框架，对比其架构在平台功能和性能方面的优缺点。本章还介绍了如何使用 **Service 层** 和 **Domain\
  \ 层** 模式，以确保无论采用哪种用户界面方式，你的用户与应用程序的交互都保持一致。本章将涵盖以下主题：\n\n- 你应该针对哪些设备？\n- 利用 Salesforce\
  \ 标准 UI\n- 生成可下载和可打印的内容\n- 翻译和本地化\n- 客户端与服务器通信\n- 管理限制\n- 对象级和字段级安全性\n- 管理和监控 UI\
  \ 响应时间\n- 使用第三方 JavaScript 库的注意事项\n\n\n\n\n- 为社区创建网站和面向外部的页面\n- 移动应用程序\n- 自定义报表和分析\
  \ API\n\n## 应针对哪些设备？\n\n在开发基于 Web 的应用程序时，历史上首先要问的问题之一是 _我们应支持哪些桌面浏览器和版本？_ 如今，你不应过多考虑用户笔记本电脑和台式机上安装的软件，而应考虑他们拥有的设备。\n\
  \n答案很可能仍然包含笔记本电脑或台式机，但不再是安全的假设，即这些是用户与你的应用程序交互的主要设备。手机、平板电脑、手表，或者 Alexa 等语音识别设备的技能，都可能被使用；或者，取决于你的目标市场，甚至可能是汽车或自动售货机等更大的设备！因此，请务必开阔思路，了解你的客户及其客户可能希望与你的应用程序交互的所有设备类型。\n\
  \n> 对于与你的 Force.com 应用程序交互的桌面和笔记本电脑用户，其使用的是标准 Salesforce UI 以及你可能使用 HTML 和 JavaScript\
  \ 构建的任何自定义 UI 的组合。鉴于此，将支持的浏览器矩阵以 Salesforce 支持的浏览器为基础是个好主意。你可以通过在 Google 中搜索 _Salesforce\
  \ supported browsers_ 来找到此信息。在撰写本文时，列出受支持浏览器的 PDF 可在 https://help.salesforce.com/apex/HTViewHelpDoc?id=getstart_browser_overview.htm&language=en\
  \ 处找到。\n\n针对多种设备开发可能成本高昂，不仅在于开发解决方案，还在于在多种设备上进行测试。在本章中，我们将探讨一系列选项，从 Salesforce 无需额外开发成本即可提供的选项，到使用\
  \ Visualforce、Lightning 和其他技术构建完全自定义的用户界面。\n\n## 介绍 Salesforce 标准用户界面和 Lightning\n\
  \n选择有时是一件好事，但有时选择并不十分明确，尤其是在新技术出现并与现有技术重叠时。在本章和下一章中，我们将探讨帮助你在 Salesforce 提供的标准 UI、构建自己的自定义\
  \ UI，或者实际上平衡两者的使用之间做出选择的功能。随着 Salesforce 新 Lightning 技术的出现，决定为特定自定义 UI 使用什么技术需要一些考量。\n\
  \nSalesforce 历史上一直将 Visualforce 作为构建自定义 UI 的推荐技术。对一些开发人员来说，它类似于 Java Server Pages\
  \ 或 .NET Active Server Pages，并且非常强大且稳定。它们还提供了大量方法，使用 Visualforce 构建的自定义 UI 来扩展其标准\
  \ UI，使你能够根据对特定用户角色最有效的方法，在更细粒度的功能级别上做出选择。\n\n为了进一步使事情复杂化，Salesforce 的标准 UI 现在有不同的变体供用户选择。有\
  \ Salesforce1 应用程序，适用于移动设备，现在还有两个面向桌面用户的选项。Salesforce 的两个桌面 UI 现在分别称为 Salesforce\
  \ Classic 和 Salesforce Lightning Experience。\n\nFormulaForce 应用程序在 Salesforce Classic\
  \ 标准 UI 中显示如下：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_274_0.png)\n\n这是它在 Salesforce\
  \ Lightning Experience 标准 UI 中的显示方式：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_275_0.png)\n\
  \n> 在 Lightning Experience 中，有更多选项可以为你的应用程序添加品牌标识。我们将在下一章进一步介绍这一点。\n\nLightning\
  \ Experience（或简称 LEX）带来了一个完全新的客户端架构，这与它的前身（Salesforce Classic）和 Visualforce 所提供的服务器端渲染不同。为了向后兼容，Visualforce\
  \ UI 仍可在 Lightning Experience 中使用，尽管在 LEX 中使用 Visualforce 不会提供使用 Lightning 框架构建的自定义\
  \ UI 所具有的可扩展性或视觉吸引力。\n\n> LEX 为开发人员提供了更多扩展标准 UI 的集成点，减少了从头开始构建完全替代页面的需求。本章和下一章将更详细地探讨如何使用\
  \ Lightning 组件扩展 LEX 功能，从而降低你的开发成本，并让你的客户从 Salesforce 标准 UI 和定制工具中获得更多价值。\n\n首次，开发人员现在可以使用\
  \ Salesforce 用于构建其基于 LEX 的应用程序的相同技术和主题，即 Lightning 框架。Salesforce 还选择将其 Lightning\
  \ 使用的样式框架开源，即 Lightning Design System (LDS)。这已内置于平台中，如果你想在 Visualforce 或外部使用，它作为一组\
  \ CSS 文件可用（https://www.lightningdesignsystem.com/）。\n\n## 为何还要考虑 Visualforce 而非\
  \ Lightning 框架？\n\n那么，Visualforce 为何仍值得考虑？在撰写本书时，Lightning 框架在提供 Visualforce 已经具备的相同设施和组件方面正在迈出巨大步伐。但它还没有完全达到；有一些差距需要注意。\n\
  \n如果你是在 Lightning 出现之前就已经开发了 Force.com 应用程序，那么你仍然非常有兴趣利用 Visualforce，直到可以进行迁移。在这种情况下，你无疑也会有兴趣了解如何结合两种技术，以便你或许可以开始在\
  \ Lightning 框架中开发新功能。\n\n在下一章中，我们将更详细地介绍如何平衡两种技术。目前，并且很可能在未来一两年内，随着采用率的提升，Salesforce\
  \ Classic 和 Lightning Experience 将会共存。\n\n## 利用 Salesforce 标准用户界面\n\nSalesforce\
  \ 在其桌面和移动端用户界面上投入了大量精力。这些声明式 UI 是首先看到进步的界面，例如能够嵌入报告图表。这些标准用户界面也是你的订阅者自定义你的应用程序外观的主要方法。此外，UI\
  \ 将随着 Salesforce 的频繁更新而演变。在某些情况下，即使你没有更新你的应用程序，新功能也会对你的用户可用。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_276_0.png)\n\
  \n> 一般来说，在 Salesforce Classic 中已经利用了标准 UI 的应用程序方面，在 Lightning Experience 中无需更改即可正常工作，并且还会自动采用新的外观和感觉。但是，如果你已广泛使用\
  \ Visualforce，和/或使用了不支持的功能（例如 JavaScript 自定义按钮），则你将需要进行一些更改。仔细在 Lightning Experience\
  \ 中测试和探索你的应用程序，以了解你需要做出哪些更改。在下一章中，我们将探讨这一过渡的关键方面以及平衡两种技术。\n\n一般来说，你应该确保对于应用程序中的所有对象，你都能充分利用标准\
  \ UI，确保你的打包布局经过高度打磨，并充分利用每一项声明式功能。即使是那些可能通常通过 Visualforce 或基于 Lightning 的自定义 UI\
  \ 访问的对象，也值得考虑这种做法。\n\n将标准 UI 视为一种主要或默认 UI，还可以确保你的 Domain 类中的验证是完整的，这确保了无论数据以何种方式输入——自定义\
  \ UI、标准 UI 或 API——都不可能输入无效数据。\n\n确保将你在自定义 UI 上执行的相同 UI 审查流程应用于标准 UI 布局。仔细审查字段标签、节、按钮名称和通用布局，同时寻找通过报告图表或嵌入自定义\
  \ UI（如本章后面所述）添加更多相关信息的选项。另外，考虑使用记录类型和不同的布局来帮助减少用户需要输入的字段数量。\n\n> 请记住，打包在你的应用程序中的\
  \ Salesforce 布局不可升级，因为它们可以由订阅者编辑。因此，无论你在后续版本中对布局做出什么改进，这些改进都仅适用于新客户，而不适用于那些正在升级到应用程序较新版本的客户。布局的新方面通常在你的安装/升级文档中说明。\n\
  \n## 替换标准 Salesforce UI 操作\n\n你可以使用自己的 Visualforce 页面替换对象的以下 Salesforce 标准 UI 操作：**接受**、**选项卡**、**克隆**、**删除**、**编辑**、**列表**、**新建**和**查看**，从而完全取代标准\
  \ UI 页面。这也会出现在 LEX 中。\n\n> 替换查看操作时，还可以通过 **Lightning 应用构建器** 工具（在 **设置** 下）指定 Lightning\
  \ 页面（也称为 FlexiPage）。在这种情况下，你分配的 Visualforce 页面仅在 Salesforce Classic 中显示，而 Lightning\
  \ 页面将在 LEX 中显示。\n\n请注意，如果你选择此选项，你不仅要承担确保添加到你的应用程序的新字段添加到这些页面的责任，还要承担随着 Salesforce\
  \ 平台的发展，标准 UI 的新平台功能出现在你的页面中的责任。因此，在决定为适用操作打包和替换之前，请务必审查标准 UI 页面功能，并考虑下一小节中描述的混合方法。\n\
  \n如果你决定构建自定义 UI，保持一致性的最佳方法是使用 Salesforce 提供的标准 UI 组件。在 Visualforce 中，这些组件在 `apex`\
  \ 命名空间中可用。在 Lightning 中，你可以利用 `lightning` 命名空间中的组件。无论哪种情况，你都可以使用 Lightning 设计系统来为自定义\
  \ UI HTML 元素设置样式。\n\n\n\n\n使用 Salesforce 提供的组件并非完整解决方案；例如，除非开发者启用，否则 Chatter 不会自动出现在页面上。另一个重要注意事项是，添加到您对象中的自定义字段或相关列表（由订阅者添加的）在页面代码中需要特别考虑，以确保这些内容得以显示，例如通过使用字段集和\
  \ apex:relatedList 组件。\n\n最后，请注意，虽然自定义对象操作覆盖（由您定义）可以打包，但它们不可升级，因此更改不会应用于现有订阅者。另外，如果订阅者希望通过标准\
  \ UI 访问自定义对象，他们可以在安装后移除这些覆盖，因此这是另一个理由，确保您将所有对象的标准 UI 视为标准实践。\n\n作为覆盖现有标准操作的替代方案，请考虑创建自定义按钮，将其放置在对象的详细信息页面和/或列表视图布局上，并将按钮命名为类似“增强编辑”或“增强新建”的名称。自定义按钮在\
  \ Salesforce Classic 和 LEX 标准 UI 中均可用，用于调用 Visualforce 页面。但是，它们不支持您构建的基于 Lightning\
  \ 的自定义 UI。要从 LEX 中的标准 UI 调用 Lightning 组件，您可以将其嵌入到 Lightning 记录页面布局中（如第 6 章“应用程序域层”所示），或使用\
  \ Lightning 组件操作（在第 9 章“Lightning”中讨论）。\n\n## 将标准 UI 与自定义 UI 相结合\n\n除非您的用户体验与标准\
  \ UI 提供的体验完全不同，否则请始终尽可能保留标准 UI。平台提供了多种方法来实现这一点，我们将在本章和下一章中探讨这些方法。在本节中，我们将探讨在标准 UI\
  \ 的特定区域嵌入自定义 UI 部分以及反之亦然的方法。\n\n## 在标准 UI 中嵌入自定义 UI\n\n在第 6 章“应用程序域层”中，我们研究了一个可以放置在\
  \ Lightning 记录页面布局上的 Lightning 组件。此方法仅适用于 LEX，并且还提供一些额外优势，例如能够监听用户内联编辑记录详细信息时 LEX\
  \ 触发的事件。此方法目前仅适用于查看记录详细信息的情况。\n\n以下截图提醒您，**合规性验证**组件放置在 LEX 标准 UI 上时的外观：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_279_0.png)\n\
  \n现在让我们看看如何自定义同时适用于 Salesforce Classic 和 LEX 的标准 UI 的示例。通过在 Race 对象的详细信息页面布局中嵌入\
  \ Visualforce 页面（如以下截图所示）来实现。页面布局在 Salesforce Classic 和 LEX 中均可用。\n\n以下 Visualforce\
  \ 页面使用 `$User.UIThemeDisplayed` **全局变量**来相应地设置页面样式。它重复使用了上一章中的**扩展控制器**：\n\n```apex\n\
  <apex:page standardController=\"Race__c\" extensions=\"RaceSummaryController\"\n\
  \ action=\"{!loadSummary}\">\n<apex:slds/>\n<apex:outputPanel\n rendered=\"{!$User.UIThemeDisplayed\
  \ == 'Theme3'}\">\n<apex:pageBlock>\n<apex:pageBlockTable value=\"{!Summary}\" var=\"\
  summaryRow\">\n<apex:column value=\"{!summaryRow.Position}\">\n<apex:facet name=\"\
  header\">Position</apex:facet>\n</apex:column>\n<apex:column value=\"{!summaryRow.Driver}\"\
  >\n<apex:facet name=\"header\">Driver</apex:facet>\n</apex:column>\n<apex:column\
  \ value=\"{!summaryRow.Team}\">\n<apex:facet name=\"header\">Team</apex:facet>\n\
  </apex:column>\n<apex:column value=\"{!summaryRow.Car}\" >\n<apex:facet name=\"\
  header\">Car</apex:facet>\n</apex:column>\n</apex:pageBlockTable>\n</apex:pageBlock>\n\
  </apex:outputPanel>\n<apex:outputPanel\nrendered=\"{!$User.UIThemeDisplayed == 'Theme4d'}\"\
  \ >\n<div class=\"slds\">\n<table\nclass=\"slds-table slds-table--bordered\nslds-table--cell-buffer\"\
  >\n<thead>\n<tr class=\"slds-text-title--caps\">\n<th scope=\"col\">\n<div\nclass=\"\
  slds-truncate\"title=\"Position\">Position</div>\n</th>\n<th scope=\"col\">\n<div\
  \ class=\"slds-truncate\"title=\"Driver\">Driver</div>\n</th>\n<th scope=\"col\"\
  >\n<div class=\"slds-truncate\"title=\"Team\">Team</div>\n</th>\n<th scope=\"col\"\
  >\n<div class=\"slds-truncate\"title=\"Car\">Car</div>\n</th>\n</tr>\n</thead>\n\
  <tbody>\n<apex:repeat value=\"{!Summary}\" var=\"summaryRow\" >\n<tr>\n<th scope=\"\
  row\"data-label=\"Position\" >\n<div\nclass=\"slds-truncate\">{!summaryRow.Position}</div>\n\
  </th>\n<td data-label=\"Driver\" >\n<div class=\"slds-truncate\">{!summaryRow.Driver}</div>\n\
  </td>\n<td data-label=\"Team\" >\n<div class=\"slds-truncate\">{!summaryRow.Team}</div>\n\
  </td>\n<td data-label=\"Car\" >\n<div class=\"slds-truncate\">{!summaryRow.Car}</div>\n\
  </td>\n</tr>\n</apex:repeat>\n</tbody>\n</table>\n</div>\n</apex:outputPanel>\n\
  </apex:page>\n```\n\n由于该页面使用 StandardController，它会出现在布局编辑器中，并可以放置在布局上：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_281_0.png)\n\
  \n然后，您可以将其拖放到布局上的现有或新部分中。结果在 Salesforce Classic 中将类似于以下截图：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_281_1.png)\n\
  \n在 Salesforce LEX 中，页面如下截图所示：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_282_0.png)\n\
  \n在 Salesforce Classic 中，此方法仅适用于用户查看记录时的布局。但是，您可以通过此类 Visualforce 页面为用户提供编辑信息的途径，即使它们呈现在记录的查看页面上。但是，这样做时无法刷新主页面。虽然\
  \ Visualforce 页面的宽度会自动调整，但高度是固定的，因此请务必根据常见数据量进行相应设置。与 Salesforce Classic 不同，Salesforce\
  \ LEX 中的用户在创建和编辑记录以及查看记录时，都会在布局中看到嵌入的 Visualforce 页面。请确保您的页面在 LEX 中预期这些场景，例如，在记录创建场景中，StandardController.getId\
  \ 方法将返回 null，您的代码应相应地处理此情况。\n\n## 在自定义 UI 中嵌入标准 UI\n\n根据您使用的自定义 UI 技术，有不同的选项可以嵌入标准\
  \ UI 页面布局。请注意，执行此操作时，任何嵌入的 Visualforce 页面也会一同包含。\n\n对于 Salesforce Classic，可以在 Visualforce\
  \ 页面上使用 `apex:detail` 标签来呈现标准 UI 的大部分外观和感觉；请注意，当页面在 LEX 中显示时，它不会自动重新设置样式。该组件的粒度不够细；例如，您无法在其呈现的标准按钮旁边添加自己的按钮。这意味着您的页面按钮需要在页面的其他位置呈现，从而使\
  \ UI 看起来不一致且令人困惑。此外，该组件仅呈现记录布局的只读视图。在大多数情况下，本章前面描述的混合方法为大多数此类需求提供了更好的解决方案。\n\n对于\
  \ Salesforce LEX，`force:recordEdit` 和 `force:recordView` 组件支持在使用 Lightning 组件构建的自定义\
  \ UI 中进行记录编辑和查看。与 Visualforce 中的 `apex:detail` 组件不同，不会呈现操作按钮。开发者负责通过触发 `recordSave`\
  \ **Lightning 事件**来通知组件何时保存详细信息。当记录保存成功时，组件会响应 `onSaveSuccess` 事件。\n\n## 扩展 Salesforce\
  \ 标准 UI\n\n前面的部分描述了一种在标准 UI 内嵌入自定义 UI 的方法，以便使用您自己的应用程序功能扩展 Salesforce UI。以下部分分别概述了\
  \ Salesforce Classic 和 LEX 中可用的进一步选项。某些功能在两者中都存在，而其他功能则在 LEX 中通过从不同区域嵌入和调用 Lightning\
  \ 组件的能力进行了重新构思。\n\n## Visualforce 页面\n\nVisualforce 不仅是为您的应用程序创建全新页面的强大方式，而且还在多个位置增强了\
  \ Salesforce 用户界面。如我们迄今所见，您可以使用它来扩展标准 UI 布局和自定义按钮。以下是接受 Visualforce 页面的平台区域列表：\n\
  \n- 布局部分\n- 自定义按钮\n- 自定义选项卡\n- 自定义选项卡闪屏页面\n- Chatter 自定义发布操作\n- 侧边栏组件\n- 仪表板组件\n\
  - Force.com 网站\n\n\n配置集和权限集也引用 Visualforce 页面；用户必须先获得页面访问权限，然后才能从这些区域使用它。\n\n##\
  \ 闪电组件\n\n以下是接受闪电组件的平台区域列表：\n\n- 记录页面\n- 主页\n- 闪电选项卡和页面\n- 闪电组件操作\n- Lightning Experience\
  \ 工具栏\n- Lightning 应用生成器\n- Lightning 社区和社区生成器\n- 面向 Visualforce 的 Lightning Out\n\
  - 面向任何应用的 Lightning Out\n\n在第 6 章\"应用程序域层\"中，我们探索了将验证合规性闪电组件添加到记录页面。在下一章中，我们将构建一些新的闪电组件，以便更仔细地查看前面列表中的其他区域。您还应参阅\
  \ Lightning 开发者指南以获取完整详情。\n\n## 生成可下载内容\n\ncontentType 属性允许您控制浏览器如何解释页面输出。使用该属性，例如，可以输出\
  \ CSV、JSON 或 XML 内容。使用控制器绑定，这可以是动态生成的输出。这对于生成要下载的内容非常有用。对 FormulaForce 应用程序所做的以下更改已包含在本章代码中：\n\
  \n- 向 RaceService 添加了新方法 generateSummaryAsCSV\n- 向 RaceSummaryController 添加了新方法\
  \ getCSVContent\n- 添加了新的 racesummary.aspx Visualforce 页面\n- 向 Race 布局添加了新的自定义按钮\"\
  下载摘要\"\n\n新方法已添加到现有的 RaceSummaryController 类中，但仅由新页面使用。请随时查看新的服务方法；请注意，它还使用了前一章中引入的\
  \ ContestantsSelector.selectByRaceIdWithContestantSummary 方法。以下是调用该方法的新控制器方法：\n\n\
  ```\npublic String getCSVContent() {\n    return RaceService.generateSummaryAsCSV(\n\
  \        new Set<Id> { standardController.getId() } );\n}\n```\n\n> RaceService\
  \ 类包含生成 CSV 文件的逻辑，而非控制器类。虽然乍一看您可能会认为这是控制器逻辑，但若从通用数据导出的角度考虑，未来也可能存在供外部开发者用于自动化 CSV\
  \ 导出流程的 API 需求；因此，将此逻辑放置在服务层中有助于实现此目标。\n\n新的 Visualforce 页面使用 contentType 属性，如下所示：\n\
  \n```\n<apex:page\n    standardController=\"Race__c\"\n    extensions=\"RaceSummaryController\"\
  \n    contentType=\"application/csv#{!Race__c.Name} Race Summary\">{!CSVContent}\n\
  </apex:page>\n```\n\n由于此页面使用标准控制器，因此可以创建自定义按钮；单击后，页面不会打开，浏览器会提示您下载文件：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_285_0.png)\n\
  \n按下\"下载摘要\"按钮会出现以下提示，以下载生成的 CSV 文件：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_285_1.png)\n\
  \n> 您可能注意到，在前面的 Visualforce 代码中，apex:page 的 contentType 属性包含 \"#\" 和一些文本。在内容类型后放置\
  \ # 符号后，您可以在文件下载时为用户指定默认文件名。还要注意，Visualforce 公式也可用于属性值，Race 名称正是以这种方式出现在文件名中。如果需要，这还允许您动态更改\
  \ contentType。\n\n> 虽然此示例很好地说明了 contentType 属性，但应注意，平台报表引擎也支持 CSV 导出。因此，如果您正在考虑\
  \ CSV 导出功能，值得首先考虑让用户使用报表；这样，他们对输出拥有更多控制自由。\n\n## 生成可打印内容\n\nSalesforce 拥有内置的 PDF\
  \ 生成引擎，可将您的 HTML 标记转换为 PDF。这是一项非常有用的功能，可用于生成发票或采购订单等更正式的文档。\n\n您可以在 Visualforce\
  \ 页面的 apex:page 元素上使用 renderAs 属性访问该功能，并将其设置为 pdf。请注意，通常应为此目的专门设置一个特定的 Visualforce\
  \ 页面，而不是尝试在用于其他目的的页面上使用此属性。\n\n> 请尽可能多地使用原生 HTML 和 CSS；Visualforce 标准组件在此模式下不一定能呈现良好。出于此原因，使用\
  \ standardStylesheets 属性禁用 Salesforce CSS 也很有用。\n\n您还可以通过使用 PageReference.getContentAsPDF\
  \ 方法并将生成的 PDF 附加到记录中以供将来使用，以编程方式访问此功能。如果您希望不使用 Visualforce 页面来生成 PDF 内容，可以以编程方式生成\
  \ HTML 并利用 Blob.toPDF 方法。第 2 章\"利用平台功能\"中已介绍翻译和本地化主题，因此我们不会在此处详细回顾。只需再次强调，从一开始就考虑翻译和本地化要求非常重要，因为事后添加这些功能可能代价高昂。另外，请注意，在前面的示例中，Visualforce\
  \ 页面中使用了 $ObjectType 全局变量来访问列标题的 **自定义字段** 标签。确保您利用此类方法将减少需要创建的 **自定义标签** 数量，并最终降低翻译成本。\n\
  \n> > 闪电组件目前不支持 $ObjectType；作为替代方法，您可以使用 Apex Describe 通过 Apex 控制器公开此内容。\n\n在 Visualforce\
  \ 中，您可以使用 `apex:inputField` 和 `apex:outputField` 组件来呈现和接收用户输入，这些组件对区域设置敏感。在 Lightning\
  \ 中，请使用 `lightning:formattedNumber` 和 `lightning:formattedDateTime` 组件。\n\n## 替代页面语言\n\
  \n默认情况下，Visualforce 页面将通过用户的区域设置查找您在页面或 Apex 代码中引用的自定义字段标签和自定义标签的翻译文本。但是，如果您希望替代此设置，可以指定\
  \ `<apex:page language` 属性；例如，如果您希望使用 Visualforce 页面以不同语言生成简报，并在发送前预览它们，则非常有用。\n\
  \n> > 闪电组件没有等效功能；它们始终使用用户的语言。\n\n这不适用于 `Name` 等描述性字段值或您添加到对象中的任何自定义描述字段。要为用户输入的数据提供翻译，您必须自行开发此类功能。平台不提供对此的支持。\n\
  \n## 客户端-服务器通信\n\n从根本上讲，用户所选设备（客户端）与 Salesforce 服务器上可用的数据和逻辑之间的任何通信都使用 HTTP 协议进行。作为\
  \ Force.com 开发者，您很少会涉及向服务器形成正确的 HTTP POST 或 HTTP GET 请求并解析响应的底层工作。\n\n例如，Visualforce\
  \ 的 `apex:commandButton` 和 `apex:actionFunction` (AJAX) 组件非常出色地为您处理此问题，因此您只需使用这些组件，就可以以很少的努力调用\
  \ Apex 代码。Salesforce 还会为您处理安全方面的问题，确保用户已登录并拥有用于向服务器发出请求的有效会话。对于闪电组件，没有通过组件标记的直接等效组件。相反，可以从组件的客户端控制器方法调用\
  \ `$A.enqueueAction` JavaScript 方法来访问 Apex 代码。\n\n取决于客户端代码运行的上下文，Force.com 提供了多种通信选项，用于对标准或自定义对象执行\
  \ CRUD 操作，以及/或调用您的应用程序的 Apex 代码以执行更复杂的任务。\n\n重要的是，您应将逻辑正确地放置在域层和服务层中，以确保无论客户端通信选项如何，您的应用程序后端都能保持一致的行为，并且每个客户端都可使用相同级别的功能。本章的各个部分将展示如何确保，无论采用何种通信方法，这些层都能被有效重用并统一访问。\n\
  \n## 客户端通信选项\n\n尽管即将到来的各个部分将更详细地讨论各种通信，但对其进行完整演练超出了本书的范围。Salesforce 文档和开发者网站提供了大量关于其使用的示例。\n\
  \n本章的目的是了解使用它们背后的架构决策、相关限制，以及每个选项如何与前几章中介绍的 Apex 代码层进行交互。\n\n\n\n\n| 通信选项 | Visualforce页面\
  \ (1) | Lightning组件 | 自定义按钮或链接 | 网站 | 原生设备 UI (3) | API 限制 |\n| :--- | :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| Visualforce组件 (apex:commandButton, apex:actionFunction)\
  \ | 是 | 否 | 否 | 是 (1) | 否 | 否 |\n| Visualforce JavaScript Remoting (Apex代码) | 是\
  \ | 否 | 否 | 是 (1) | 否 | 否 |\n| Visualforce JavaScript Remote Objects (CRUD操作) |\
  \ 是 | 否 | 否 | 是 (1) | 否 | 否 |\n| Salesforce REST / SOAP API (CRUD API、API SOAP和REST\
  \ API、Analytics) | 是 | 否 (5) | 否 | 是 (2) | 是 | 是 |\n| Salesforce 流式 API (对标准和自定义对象的读访问)\
  \ | 是 | 否 (5) | 否 | 是 (2) | 是 | 是 |\n| AJAX Toolkit (4) | 是 | 否 | 是 | 是 (2) | 否\
  \ | 是 |\n| Lightning服务器端操作 @ AuraEnabled | 否 | 是 | 否 | 否 (6) | 否 | 否 |\n| Lightning\
  \ Data Services (CRUD访问) | 否 | 是 | 否 | 否 (6) | 否 | 否 |\n\n以下注释适用于前面的表格：\n\n- 1.\
  \ 由于Visualforce页面本质上是由Salesforce服务器动态渲染的HTML页面，因此它们也可用于构建面向公众的网站，以及适应各种设备（如手机和平板电脑，前提是开发者进行了适当编码）的页面。Salesforce\
  \ 流式API目前仅可通过JavaScript访问。\n\n- 2. 使用传统的非平台语言（如.NET、Java、Ruby或PHP）构建的网站，必须仅通过REST/SOAP和流式API访问Salesforce。\n\
  \n- 3. 客户端是使用特定于设备的平台和UI技术构建的，例如使用Xcode、Java构建的原生移动应用程序，或原生包装的HTML5应用程序。\n\n- 4.\
  \ AJAX Toolkit是一个JavaScript库，用于从Visualforce或HTML页面访问Salesforce SOAP API。它是从JavaScript访问Salesforce对象和Apex\
  \ Web服务的最古老方式。虽然可以从自定义按钮和Visualforce页面使用它，但我建议使用较新的Visualforce通信选项之一（通过将Visualforce页面与自定义按钮关联，而不是使用JavaScript）。Salesforce仅支持此库的最新版本，这也从侧面说明了他们对该库的承诺程度。\n\
  \n- 5. Lightning利用**W3C**推荐的`Content-Security-Policy` HTTP标头。这控制资源如何（使用HTTPS）以及从何处（仅Lightning域）从服务器加载。由于Salesforce\
  \ API从不同域提供，因此无法直接从Lightning组件内的JavaScript代码调用它们。相反，必须从组件的Apex控制器在服务器端调用这些API。\n\
  \n- 6. **Lightning Out**是一项技术，允许将Lightning组件托管在外部网站上。在Lightning Out中运行的组件仍然可以使用Lightning服务器端操作和Lightning\
  \ Data Services与后端通信。请注意，编写本文时，Lightning Data Services仅处于开发者预览阶段。\n\n## API限制器和可用性\n\
  \n如前表所示，对于某些通信方法，Salesforce当前限制了在滚动24小时内可发出的API请求数量（尽管可以通过Salesforce支持进行扩展）。这可以在**设置**下的**公司信息**页面上的**API请求，过去24小时**和**流式API事件，过去24小时**字段中查看。\n\
  \n请注意，这些不像其他限制器（如SOQL和DML限制器）那样受你的应用程序命名空间限制。因此，访问订阅者组织的其他客户端应用程序可以消耗，并因此与你的应用程序争夺此资源。如果可能，请使用前表中列出的不消耗API限制的通信方法。如果无法避免，请确保监控客户端发出的请求数量，并在可能的情况下使用关系查询和/或Apex调用对其进行聚合。\n\
  \n> 如果你计划面向专业版，请务必与你的合作伙伴客户经理讨论API使用情况。在使用Salesforce SOAP/REST API、流式API和AJAX Toolkit等API时，此版本Salesforce中的可用性与其他版本不同。如需最新信息，还可以查阅ISVforce指南中“组和专业版的API访问”部分，网址为\
  \ https://na1.salesforce.com/help/pdfs/en/salesforce_packaging_guide.pdf。\n\n##\
  \ 数据库事务范围和客户端调用\n\n如第4章“Apex执行和关注点分离”中所述，事务上下文涵盖从客户端向Salesforce服务器发出请求的执行上下文。使用JavaScript编写客户端代码时，使用基于CRUD的通信选项（如Visualforce\
  \ JavaScript Remote Objects、Lightning Data Service和Salesforce API）时要小心，因为客户端的执行范围不会转化为服务器上的单个执行范围。\n\
  \n客户端执行的每个CRUD操作都在其自身执行范围（因此也是其自身事务）中进行。这意味着，如果客户端代码在用户交互过程中中途出错，则对数据库的先前更改不会回滚。要将多个CRUD操作封装在单个数据库事务中，请在Apex中实现逻辑，并通过之前提到的任一方式调用它，例如Visualforce\
  \ JavaScript Remote Actions或Lightning服务器端操作。请注意，从面向服务的应用程序设计角度来看，这通常也是一种良好的实践。\n\
  \n## 离线支持\n\nVisualforce apex:page元素上的manifest属性是HTML5标准的一部分，用于支持离线网页。尽管其用法的完整讨论超出了本书范围，但需要牢记一点是，你在浏览器本地离线存储中存储的任何信息都不安全。该属性要求使用docType属性来指示页面输出符合HTML5标准。\n\
  \n但是，Salesforce引入此功能主要是为了支持**混合**移动应用程序，旨在在支持离线模式的原生移动应用程序容器中使用Visualforce页面。在任何其他上下文中均不受支持。在此情况下，离线内容存储在移动应用程序自身的私有存储区中。\n\
  \n在Salesforce Mobile SDK的上下文中，混合移动应用程序是指使用一个在移动设备上托管移动浏览器的小型原生应用程序，然后利用Salesforce的登录页面和Visualforce页面来交付应用程序。通常，这需要网络连接；然而，借助manifest属性，可以实现离线支持。\n\
  \n> Lightning组件目前无法控制此属性，因为它们不拥有页面。实现此属性的责任在于Salesforce1和Salesforce LEX标准UI。Salesforce1\
  \ Mobile在记录编辑方面确实支持一些离线功能；然而，目前对基于Visualforce或Lightning的自定义UI不支持。\n\n## 管理限制\n\n\
  通常，在单个控制器执行上下文中检索的记录总数为50,000条（所有执行的SOQL查询总计）。此外，诸如`apex:dataTable`和`apex:repeat`之类的Visualforce组件只能迭代1000个项目，之后将引发运行时异常。\n\
  \n编写本文时，`readonly`属性（在`apex:page`组件上指定）将此更改为页面中Visualforce组件内100万条记录和10,000次迭代（有关最新更新，请参阅Salesforce文档）。顾名思义，数据库不能发生任何更新，基本上意味着根本不允许DML操作。请注意，查询仍受超时限制。\n\
  \n> 如果需要更精细地提高SOQL查询行限制器，可以将@ReadOnly Apex属性应用于控制器中的JavaScript Remoting方法，而不像之前描述的那样应用于页面级别。同样，此方法无法使用DML操作更新数据库，但你将能够查询更高数量的查询行。请注意，在此上下文中不适用迭代器限制增加，因为JavaScript\
  \ Remoting和Visualforce迭代器组件不能一起使用。\n\n\n\n\n编写本文档时，Lightning 组件不提供对此功能的访问权限。通过 @AuraEnabled\
  \ 方法公开的 Apex 控制器方法受标准 Apex 查询限制的约束。\n\n## 对象和字段级安全\n\n公开 SObject 信息的 Visualforce\
  \ 页面（无论是通过标准、自定义还是扩展控制器）在使用直接引用 SObject 字段的组件或表达式时，可以利用内置的 **字段级安全强制执行**；此类用法将遵守用户的字段级安全。但是，通过控制器属性引用\
  \ SObject 字段的 Visualforce 表达式不受影响，因为 Visualforce 引擎无法判断控制器属性是否反过来引用 SObject 字段。\n\
  \nLightning 目前不提供对对象级和字段级安全敏感的组件。相反，您必须通过 Lightning 服务器端操作将权限通知客户端控制器，该操作利用 **Apex\
  \ 描述** 获取正在访问的信息。然而，**Lightning 数据服务** 组件（编写本文档时为开发者预览版）不仅支持对象和字段安全，还支持共享规则。*开发者预览版*状态意味着无法打包使用它的组件。\n\
  \n## 在 Visualforce 中强制执行安全\n\n使用 Visualforce `apex:inputField` 和 `apex:outputField`\
  \ 组件时，字段（包括标签，如果存在）将相应地隐藏或设置为只读。一个不太为人知的事实是，直接的 SObject 字段表达式也受字段级安全的影响；例如，如果用户对\
  \ `Status__c` 字段没有读取权限，`{!Race__c.Status__c}` 不会被求值（页面上不会输出任何内容）。此行为特别微妙，文档中也未详细说明。\n\
  \n文档指出，使用 `apex:inputText` 和 `apex:outputText` 等组件时，这些组件不会强制执行字段安全。虽然这是正确的，但安全始终也应用于\
  \ SObject 字段表达式。因此，如果字段不可见（而不仅仅是只读），即使是 `apex:outputText` 组件也不会显示值。但是，如果字段是只读且与\
  \ `apex:inputText`（例如）一起使用，它将呈现为可编辑字段。因此，这里的一般准则是，如果您有 SObject 字段表达式，请使用推荐的 `apex:inputField`\
  \ 和 `apex:outputField` 组件。\n\n一个常见的混淆点是在关联控制器上使用 `with sharing` 和 `without sharing`\
  \ 关键字。这些关键字对字段级安全的强制执行完全没有影响；它们纯粹确定记录可见性，因此仅影响控制器内部以及由该控制器调用的其他执行 SOQL 查询的 Apex\
  \ 类中所做的 SOQL 查询。\n\n除了在控制器代码中使用 Apex 之外，您还可以使用 `$ObjectType` 全局变量直接确定字段的可访问性。例如，您可以使用以下表达式根据给定字段的安全性隐藏整个节。`{!$ObjectType.Race__c.fields.Status__c.Accessible}`。\n\
  \n以下 Visualforce 页面及其关联的自定义控制器说明了字段级安全。在所示用例中，使用了两个用户，一个具有完全访问权限，另一个已通过其配置文件获得以下权限：\n\
  \n- 对 `Status__c` 字段具有只读访问权限\n- 对 `FastestLapBy__c` 字段完全无访问权限\n\n首先，查看 Visualforce\
  \ 页面；每个部分显示以下用例：\n\n- 用例 A 展示 `apex:inputField` 的使用\n- 用例 B 展示 `apex:outputField`\
  \ 的使用\n- 用例 C 展示 `apex:inputText` 的使用\n- 用例 D 展示 `apex:outputText` 的使用\n- 用例 E 展示\
  \ SObject 字段表达式的使用\n- 用例 F 展示控制器属性表达式的使用\n\n为了方便比较，页面上会显示消息以确认字段访问级别。FLSDemoController\
  \ 包含在本章的示例代码中；它仅读取您组织中的第一个 Race__c 记录。它公开两个字符串属性，间接公开 Status__c 和 FastestLapBy__c\
  \ 字段值。以下显示了用于说明针对当前用户权限使用不同 Visualforce 绑定和组件的效果的 Visualforce 页面：\n\n```\n<apex:page\
  \ controller=\"FLSDemoController\" tabStyle=\"Race__c\">\n<apex:form>\n\n<apex:pageMessage\
  \ summary=\"Race__c.Status__c Accessible is\n{!$ObjectType.Race__c.fields.Status__c.Accessible}\"\
  \nseverity=\"info\"/>\n<apex:pageMessage summary=\"Race__c.Status__c Updatable is\n\
  {!$ObjectType.Race__c.fields.Status__c.Updateable}\"\nseverity=\"info\"/>\n<apex:pageMessage\n\
  summary=\"Race__c.FastestLapBy__c Accessible is\n{!$ObjectType.Race__c.fields.\n\
  FastestLapBy__c.Accessible}\"\nseverity=\"info\"/>\n<apex:pageMessage\nsummary=\"\
  Race__c.FastestLapBy__c Updatable is\n{!$ObjectType.Race__c.fields.\nFastestLapBy__c.Updateable}\"\
  \nseverity=\"info\"/>\n<apex:pageBlock>\n\n<apex:pageBlockSection\ntitle=\"Use Case\
  \ A: Using apex:inputField\">\n<apex:inputField value=\"{!Race.Status__c}\"/>\n\
  <apex:inputField value=\"{!Race.FastestLapBy__c}\"/>\n</apex:pageBlockSection>\n\
  \n<apex:pageBlockSection\ntitle=\"Use Case B: Using apex:outputField\">\n<apex:outputField\
  \ value=\"{!Race.Status__c}\"/>\n<apex:outputField value=\"{!Race.FastestLapBy__c}\"\
  />\n</apex:pageBlockSection>\n\n<apex:pageBlockSection\ntitle=\"Use Case C: Using\
  \ apex:inputText\">\n<apex:inputText value=\"{!Race.Status__c}\"/>\n<apex:inputText\
  \ value=\"{!Race.FastestLapBy__c}\"/>\n</apex:pageBlockSection>\n```\n\n```\n<apex:pageBlockSection\n\
  \ title=\"Use Case D: Using apex:outputText\">\n<apex:outputText value=\"{!Race.Status__c}\"\
  />\n<apex:outputText value=\"{!Race.FastestLapBy__c}\"/>\n</apex:pageBlockSection>\n\
  ```\n\n```\n<apex:pageBlockSection title=\"Use Case E: Using SObject Field Expressions\"\
  >\nThe value of Status__c is '{!Race.Status__c}',\nThe value of FastestLapBy__c\
  \ is '{!Race.FastestLapBy__c}',\n</apex:pageBlockSection>\n```\n\n```\n<apex:pageBlockSection\
  \ title=\"Use Case F: Using Controller Property Expressions\">\nThe value of Status__c\
  \ is '{!Status}',\nThe value of FastestLapBy__c is '{!FastestLapBy}'\n</apex:pageBlockSection>\n\
  </apex:pageBlock>\n</apex:form>\n</apex:page>\n```\n\n对于具有完全访问权限的用户，该页面显示如下：\n\n\
  ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_297_0.png)\n\n以下屏幕截图和说明确认了页面对权限有限用户的反应和显示方式；该页面显示某些信息按预期隐藏或只读，但并非全部，例外是用例\
  \ C 和用例 F：\n\n- 对于用例 C，该字段是只读的，因此其值可访问并放置在输入字段中。由于它是 `apex:inputText` 字段，它不遵守字段的字段级安全状态，并且在不应该可编辑时该字段是可编辑的。\n\
  \n- 对于用例 F，将显示 FastestLapBy__c 字段值，因为它没有使用 SObject 字段绑定；它使用的是控制器属性绑定，该绑定间接公开了字段值。在这种情况下，责任在于开发人员在控制器代码中检查字段级安全。\n\
  \n| 项目 | 详情 |\n| :--- | :--- |\n| Race__c.Status__c Accessible | 为 true |\n| Race__c.Status__c\
  \ Updatable | 为 false |\n| Race__c.FastestLapBy__c Accessible | 为 false |\n| Race__c.FastestLapBy__c\
  \ Updatable | 为 false |\n| 用例 A: 使用 apex:inputField | 状态：进行中 |\n| 用例 B: 使用 apex:outputField\
  \ | 状态：进行中 |\n| 用例 C: 使用 apex:inputText | 状态：进行中 |\n| 用例 D: 使用 apex:outputText |\
  \ 状态：进行中 |\n| 用例 E: 使用 SObject 字段表达式 | Status__c 的值为“进行中” |\n| 用例 F: 使用控制器属性表达式\
  \ | Status__c 的值为“进行中” |\n\n## 管理性能和响应时间\n\n解决方案中的响应时间会对应用程序的可用性产生很大影响。本节提供有关如何监控和管理\
  \ Lightning 和 Visualforce 中响应时间的信息。\n\n\n\n\n## 监控大小和响应时间的 Lightning 工具\n\n在 Lightning\
  \ 中，监控组件层次结构的复杂性非常重要。虽然出于关注点分离的原因进行组件化是件好事，但过度组件化会导致组件树过于臃肿，进而造成性能不佳。Salesforce\
  \ 提供了一款名为 Lightning Inspector 的优秀工具，可让你深入了解组件层次结构以及每个组件的渲染时间。你可以从 Google Chrome\
  \ 应用商店下载并安装此工具。\n\n下面展示了 FormulaForce 应用程序的示例截图：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_299_0.png)\n\
  \n你可能还注意到，LEX 在页眉中显示页面大小和响应时间：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_299_1.png)\n\
  \n## Visualforce 视图状态大小\n\n《Visualforce 开发者指南》中有一个名为“改进 Visualforce 性能的最佳实践”的章节，其中介绍了确保页面保持响应的几种优秀方法。我强烈建议你花时间通读。不过，该主题中有一个点我想在本节进一步阐述：\n\
  \n> \"如果你的视图状态受到大型组件树的影响，请尝试减少页面依赖的组件数量。\"\n\n这种情况会导致响应时间变差，即使在文档中描述的其他方面都已正确优化的页面也是如此。其原因在于\
  \ Salesforce Visualforce 组件的内部开销，即内部视图状态，当页面上存在许多此类组件（通常出现在表格或 apex:repeat 场景中）时，该开销会增加。\n\
  \n取决于你的 Visualforce 页面设计，它通常所占比例可能超过开发者通过控制器属性和成员变量显式放入视图状态的数据。两者共同导致达到 145 KB 的视图状态大小限制，不过在达到此限值之前，较大的视图状态也可能影响响应时间。\n\
  \n## 管理大型组件树的注意事项\n\n在设计包含原生 Visualforce 组件的表格或重复部分的 Visualforce 页面时，需考虑以下几点：\n\n\
  - 仅当页面中包含 `apex:form` 标签时才会生成视图状态；如果不需要，则应将其删除，例如在仅查看的页面上。\n- 考虑是否需要使用 `apex:outputField`\
  \ 等 Visualforce 组件，或者直接使用带有 Visualforce 表达式的 HTML 元素是否足够。HTML 元素不消耗视图状态。不过在这样做时，需谨慎考虑标准组件提供的本地化功能，例如日期和数字格式化；你可能需要在\
  \ Apex 代码中执行此操作，并绑定到格式化后的值。\n- 避免包含 Visualforce 组件的嵌套 `apex:repeat` 标签。如果可能，请在控制器的\
  \ Apex 逻辑中展平嵌套结构，并暴露一个单一的可迭代列表属性，以产生相同的输出。\n- 考虑转向如下一节所述的无状态控制器模式。\n- 考虑在页面中实现分页。\n\
  \n> 如需进一步分析，请在 http://salesforce.stackexchange.com/ 上搜索 'How to reduce a large internal\
  \ view state / what is in the internal view state?'\n\n## 使用 Service 层和数据库访问\n\n\
  与你在前面章节中看到的 Visualforce Apex 控制器操作方法一样，Service 层也设计为可从 Visualforce JavaScript Remoting\
  \ 方法调用，如下所示：\n\n```apex\npublic with sharing class RaceResultsController {\n   \
  \ @RemoteAction\n    public static List<RaceService.ProvisionalResult>\n    loadProvisionalResults(Id\
  \ raceId) {\n        return RaceService.calculateProvisionResults(\n           \
  \ new Set<Id>{ raceId }).get(raceId);\n    }\n}\n```\n\n要让 Lightning 组件控制器对 Apex\
  \ 进行服务器端调用，请使用 @AuraEnabled 注解方法：\n\n```apex\npublic with sharing class RaceResultsController\
  \ {\n    @AuraEnabled\n    public static List<RaceService.ProvisionalResult>\n \
  \   loadProvisionalResults(Id raceId) {\n        return RaceService.calculateProvisionResults(\n\
  \            new Set<Id>{ raceId }).get(raceId);\n    }\n}\n```\n\n```apex\npublic\
  \ class ProvisionalResult {\n    @AuraEnabled\n    public Integer racePosition {get;\
  \ set;}\n    @AuraEnabled\n    public Integer contestantId {get; set;}\n    @AuraEnabled\n\
  \    public String contestantName {get; set;}\n}\n```\n\n不过，在这两种情况下，都没有 try/catch\
  \ 块，因为错误处理由客户端代码负责渲染消息。当抛出异常时，平台会负责捕获异常并将其传回给调用的 JavaScript 代码，以便相应地显示。简而言之，无需自行发明错误消息处理系统；只需让平台将其传回给客户端\
  \ JavaScript 代码即可。不过请记住，你仍需在客户端 JavaScript 逻辑中处理错误消息；Visualforce 不会为你完成此操作。\n\n\
  ## 客户端逻辑和 Service 层逻辑的注意事项\n\n通过 JavaScript 在客户端添加更复杂的逻辑时，需要更加关注关注点分离。以下几点提供了相关指导：\n\
  \n- 每个远程方法调用一个服务方法：在控制器上开发远程方法时，仍应遵循单个 Service 层方法调用规则。如果正在调用多个 Service 层方法，这表明应创建并调用一个新的聚合\
  \ Service 层方法，而不是直接调用多个。\n- 避免远程客户端偏见：不要仅为了迎合 JavaScript Remoting 控制器方法的需求（即 JavaScript\
  \ 客户端的需求）而设计 Service 层。始终将 Service 层视为与客户端无关；如果你以后还想将 Service 层作为 API 暴露给应用程序，这一点尤为重要。\n\
  - Apex 枚举类型：如果你在 Service 层设计中使用 Enum 类型（老实说，为什么不使用呢？），它们非常具表现力且自文档化！不过，不幸的是，目前 JavaScript\
  \ Remoting JSON 反序列化器不支持它们，这意味着你可以返回包含它们的 Apex 数据结构，但无法从客户端接收它们（会发生平台异常）。\n\n解决方法是：要么不使用枚举，改用字符串数据类型；要么在控制器类中创建\
  \ Apex 类数据类型，并在这些类型与 Service 类型之间执行自己的封送处理（利用 `Enum.name()` 方法将枚举映射到字符串值）。选择取决于你是否希望保护\
  \ Service 层中对枚举的使用（尤其是如果它是面向公众的 API），以及所涉及的工作量。希望 Salesforce 将来能够修复此问题。\n\n## 何时应使用\
  \ JavaScript 进行数据库访问？\n\nJavaScript Remote Objects 和 Lightning Data Service 旨在暴露一个类似\
  \ \"SOQL 和 DML\" 的 API，供 Visualforce 页面或 Lightning 组件中嵌入的 JavaScript 代码使用。这提供了一种查询和更新数据库的方式，无需经过传统的\
  \ AJAX Toolkit 或会计入每日 API 限额的 Salesforce REST API。\n\n《Visualforce 开发者指南》中有一个出色的主题，介绍了使用此功能的最佳实践，标题为“使用\
  \ Remote Objects 的最佳实践”，我强烈建议你通读并全面消化。《Lightning 组件开发者指南》中也有描述 Lightning Data Service\
  \ 的示例。本节中我想强调的主要方面是与保持良好的关注点分离密切相关的事务边界。\n\n切勿在单个 JavaScript 代码块中调用多个数据库操作，因为每个操作都将在其自身的\
  \ Salesforce 执行上下文中执行，从而在各自的事务中运行。这意味着，如果 JavaScript 代码中发生错误，先前的操作不会被回滚。\n\n如果你发现自己处于这种情况，那么很可能应该将此类代码放置在应用程序的\
  \ Service 层中，并使用 JavaScript Remoting 调用该 Service 层方法，这样操作就会在单个事务范围内发生。\n\n\n\n\n\
  \n话说回来，如果您的用例会导致单个数据库操作，那么您当然可以考虑使用此功能，放心地确信您的 Apex Trigger 和 Domain 层代码将继续强制执行您的数据验证和完整性。\n\
  \n最后，请注意，从 JavaScript 查询记录不会调用您的 Selector 代码。因此，客户端上生成的 SObject 记录中查询和填充的字段在 JavaScript\
  \ 代码的所有情况下并不总是相同的。\n\n## 使用 JavaScript 库的注意事项\n\n如已讨论，您越是朝着无状态控制器和 JavaScript Remoting\
  \ 客户端架构发展，就越需要投资提供或获取 Salesforce 当前未提供的客户端组件。\n\n请按具体情况仔细考虑此决定（并非您应用程序的所有 UI 都必须采用相同方法），并确保您理解所放弃的平台功能的价值。请预期要调整对客户端开发人员速度的预期，使其与其他平台开发人员更加一致。\n\
  \n例如 jQuery 之类的库提供了大量的便利性、灵活性以及社区中可用的组件，可以作为 Visualforce 组件的一些替代和改进，此外还有网格和树等较大组件。更进一步，Sencha\
  \ ExtJS 之类的较大商业库也可在 Visualforce 页面中使用，包括 jQuery Mobile 和 Sencha Touch 等移动变体。\n\n\
  > Lightning 在您的组件周围实现了一个名为 Locker Service 的安全层。它会阻止 eval，强制使用严格模式，并限制访问组件自身边界之外的\
  \ DOM。请检查您打算在 Lightning 组件中使用的第三方库是否与此类安全上下文兼容。\n\n所有这些库都需要相当多的 JavaScript 编程知识，包括其\
  \ OOP 编程风格。有些还提供 Model View Controller (MVC) 框架，例如 AngularJS。如果您在 Google 上搜索 Salesforce\
  \ 和例如 AngularJS，您将找到社区和 Salesforce Developer Evangelists 团队的许多示例和文章。以下是使用此类库开发时应考虑的一些方面：\n\
  \n- **开发者流程**：将客户端代码存储在源代码控制中、将其推送到组织进行开发、编辑代码、调试代码，然后将其推回源代码控制的流程是什么？同样，在打包方面，请考虑是否应压缩\
  \ JavaScript。开发者流程必须快速；编辑 JavaScript 文件、重新构建 zip 文件和上传新的静态资源并不快。请考虑是否可以为客户端开发人员支持松散文件开发流程，例如为每个文件使用\
  \ Visualforce 组件、页面或静态资源（**MavensMate** 对此有很好的支持），然后将这些合并为单个静态资源用于打包和部署。\n\n- **安全**：Salesforce\
  \ 对其 Visualforce 和 Lightning 组件非常谨慎，以确保组件显示转义值，从而防止 HTML 注入等攻击。请检查组件从数据库记录注入到 DOM\
  \ 中的转义值，否则您可能会暴露于攻击之下，并且通过 Salesforce 安全审核会出现延迟。\n\n- **测试框架**：测试富客户端有多种方法，从要求开发人员编写\
  \ JavaScript 代码的单元测试框架，到实际驱动 Web 浏览器并断言页面状态的商业应用程序测试。请确保根据应用程序包含的 JavaScript 代码量进行投资。\n\
  \n## 自定义发布者操作\n\n在上一章中，我们创建了一个 **发布者操作** 以便从 Chatter 源中轻松将 **参赛者** 标记为 **未完赛**（Did\
  \ not Finish，DNF）对象。这利用了基于创建或更新相关记录来创建发布者操作的声明式方法。如果您的用例不适合此类操作，则可以使用 Lightning\
  \ 组件开发自定义发布者操作。\n\n## 创建网站和社区\n\nSalesforce 提供了以下两种方式来创建面向公众的 Web 内容：\n\n- **Force.com**：这提供了一种使用\
  \ Visualforce 页面创建面向公众的经过身份验证或公共网站的方式。因此，它可以使用本章中描述的方法访问标准对象和自定义对象，并根据需要重用应用程序中的组件和服务。Force.com\
  \ 站点配置无法打包，但您创建的用于支持它们的页面和控制器可以打包。此功能可在 Enterprise 和 Developer Edition 组织中使用。可以通过\
  \ Lightning Out 在 Visualforce 页面中使用 Lightning 组件。\n\n- **Sites.com**：这是一个面向非技术用户的声明式网站产品。虽然\
  \ Visualforce 页面不能直接与 Sites.com 一起使用，但 Sites.com 中可用的组件可以访问您应用程序的自定义对象，从而会调用您的 Apex\
  \ Trigger 以及因此的 Domain 逻辑代码。可以通过 Community Builder 在 Sites.com 中使用 Lightning 组件。\n\
  \n## 移动应用策略\n\n过去几年来，使用 Salesforce 进行移动应用开发一直是一个热门话题，起点是使用各种知名的移动框架（例如 jQuery Mobile、AngularJS）以及\
  \ Salesforce 自己的 API（包括用于身份验证的 oAuth，以及用于访问标准和自定义对象记录的 Salesforce REST API），最终发展到围绕最新\
  \ Salesforce1 移动应用程序的当前开发。\n\n有趣的是，它的演变方式与浏览器 UI 不同，浏览器 UI 起源于标准的声明式 UI，然后可以通过 Visualforce\
  \ 等更具开发者驱动的解决方案进行增强。至于移动 UI，直到 Salesforce1 发布之前，我们只有与开发人员一起构建东西这一种选择。\n\n截至目前，我们在构建移动\
  \ UI 时同时拥有这两种选择。因此，请务必首先了解 Salesforce1 移动应用程序的功能及其通过标准 UI 公开您的对象的能力。发布者操作是增强应用程序在\
  \ Chatter 源中存在感的绝佳方式，还可以将相同操作添加到用户的 Salesforce1 体验中。\n\nSalesforce1 的用户界面模型并非适合所有人；与浏览器\
  \ UI 一样，如果您希望为非常特定的移动应用程序公开更精细定制的流程驱动用户体验，它大多以数据为中心。如果您觉得有此需求，可以查看 Salesforce Mobile\
  \ Packs 以选择最适合您需求的架构和 API（https://developer.salesforce.com/mobile）。\n\n## 自定义报告和\
  \ Analytics API\n\n有时，Salesforce 报表引擎的标准输出并不是您用户所需要的。他们需要 Salesforce 不支持的格式或布局，但他们定义报表的方式对他们很有吸引力。\n\
  \nSalesforce Analytics API 允许您构建 Visualforce 页面或移动应用程序，这些页面或应用程序可以执行给定的表格、汇总或矩阵报表，并将其数据返回到客户端代码中以相应渲染。该\
  \ API 可直接供 Apex 开发人员使用，也可作为原生移动应用程序的 REST API 使用。\n\n> 您可以考虑使用报表来推动应用程序中额外流程的替代记录选择方法，方法是利用\
  \ Report Designer 的灵活性作为一种记录选择 UI。\n\n## 更新 FormulaForce 包\n\n将本章中包含的代码应用到您的包组织中。除了\
  \ RaceResultsController Apex 类之外，本章示例代码中提供的所有组件都会自动包含在包中，因为它们是已打包组件的补充或引用。\n\n\n\
  \n\n\n## 摘要\n\nSalesforce 提供了出色的标准 UI 体验，可高度定制，并能适应平台的新功能，而无需您不断发布应用程序的新版本。其核心是以数据为中心的用户体验，这意味着大多数任务都归结为创建、编辑或删除某种记录。强烈关注您的\
  \ Domain 层代码，可确保其保护应用程序的数据完整性。\n\n如果您想表达更复杂的进程或一系列任务，Visualforce 和 Lightning 允许您使用组件或其他\
  \ HTML 库来创建手头任务所需的用户体验，从而更具表现力。虽然这非常强大，但务必始终考虑标准 UI，并且在可能的情况下，使用 Visualforce 页面和/或\
  \ Lightning 组件来增强或补充它，而不是将其作为与应用程序交互的唯一方式。\n\n同样重要的是，在为性能和安全性构建自定义 UI 时要遵循最佳实践。仔细考虑并明智地选择偏离标准\
  \ UI 和/或标准组件的程度，因为您离这些越远，作为开发人员就要承担更多责任并处理更多复杂性。寻找创建标准 UI 和自定义 UI 混合组合的机会，以兼得两者之长。\n\
  \n对用户而言，报告往往是个人化的事情；Salesforce Analytics API 允许您利用 Salesforce 报表设计器和引擎的强大功能，以更具针对性的方式呈现返回的报告数据。\n\
  \n目前，有许多技术和方法组合可用为用户构建移动用户体验。与浏览器中的标准 UI 一样，先从 Salesforce 作为标准开箱即用为您和用户提供的内容开始。Salesforce1\
  \ Mobile 应用程序实际上是一项平台功能，用户期望能够像使用其他任何对象一样，将其与您的应用程序对象一起使用。\n\n在 Salesforce1 Mobile\
  \ 中构建用于使用的自定义 UI，最好使用 Lightning Components 来完成。但是，如果您选择构建自己的移动应用程序，可以选择使用 Salesforce\
  \ 的某个移动 SDK 作为起点进行开发；或者，如果您具备相关技能和经验，可以将其作为指南，了解如何调用各种 Salesforce API。\n"
- "# Lightning\n\nLightning 是一个丰富的客户端框架，用于开发与设备无关且响应式的用户体验，并支持移动设备、平板电脑和桌面。与 Visualforce\
  \ 不同，它是从零开始构建的，旨在满足当今多设备丰富客户端的需求。Salesforce 自身正在使用它，并且开发者也可以使用它来构建自己的独立或平台集成 UI。使用\
  \ Lightning Out，开发者还可以将使用 Lightning 构建的 UI 集成到外部站点和应用程序中。对组件化的强调是其架构的核心，并在提供实现复用、关注点分离和可扩展性的手段方面发挥着关键作用。\n\
  \n本章概述了 Lightning 组件架构，并将其与前身 Visualforce 进行对比。名为 Race Calendar、Race Results、Race\
  \ Standings 和 Race Setup 的新 Lightning 组件将使我们能够探索使用 Lightning Design System 进行开发和样式设计的过程。\n\
  \n使用这些新组件，我们将探索将组件集成到 Lightning Experience、Salesforce1 Mobile、Lightning Communities\
  \ 以及现有 Visualforce 页面中的选项和优势。针对 Visualforce 的 Lightning Out 允许现有解决方案在向 Lightning\
  \ 迁移的同时，继续支持 Salesforce Classic。\n\n本章将涵盖以下主题：\n\n- Lightning 组件框架概述\n- 了解各种组件容器\n\
  - 构建最终用户可自定义的组件\n- 使用组件扩展 Lightning Experience 和 Salesforce1 Mobile\n- 了解如何编写安全的\
  \ JavaScript 代码\n- 为您的 Lightning UI 设置样式\n\n## 构建基本的 Lightning 用户界面\n\n在深入研究 FormulaForce\
  \ 应用程序示例代码中包含的更复杂组件之前，让我们先创建一个简单的 **Lightning Application** 来更好地了解 Lightning 的架构。将\
  \ Lightning Application 视为 UI 的 **容器**，本质上就是您的 HTML 标记。容器实际上是您可以在浏览器中导航到的内容，它们会根据您为其赋予的名称获得自己的\
  \ URL。\n\n如我们在本章后面将探讨的那样，**Lightning Experience** 和 **Salesforce1 Mobile** 也是由 Salesforce\
  \ 以与以下示例相同的方式构建的容器。\n\n如果您想跟随接下来的几个步骤操作，请确保已安装支持 Lightning Components 的 Force.com\
  \ IDE。我们将在本章后面更深入地了解 Force.com IDE 围绕 Lightning 的功能。\n\n按照以下步骤创建您的第一个 Lightning\
  \ Application：\n\n- 确保您使用的是启用了 **My Domain** 的 **Developer Edition** 组织。可以在 **Setup**\
  \ 菜单下搜索 **My Domain** 来启用它。确保您已完成所有 My Domain 步骤。\n- 从 **New** 菜单中选择 **Force.com\
  \ Project**，为您的组织创建 Force.com IDE 项目。\n- 项目创建完成后，在 **Package Explorer** 中右键单击项目，选择\
  \ **Force.com** 子菜单，然后选择 **Work Online**。这样可确保保存文件时自动上传到 Salesforce。\n- 从 **File**\
  \ 菜单的 **New** 子菜单中选择 **Lightning Bundle**。\n- 在 **Create new Lightning Component**\
  \ 对话框中，从 **Type** 字段选择 **Lightning Application**。\n- 为您的应用程序命名 `myapp`，然后单击 **Finish**。\n\
  - 源形式的 Lightning Bundle 是一个文件夹，包含一个或多个文件，具体取决于类型。在此示例中，您将拥有一个 `.app` 文件、一个 `.css`\
  \ 文件和三个 `.js` 文件。打开 `myapp.app` 文件并输入以下标记，然后保存文件。\n\n```\n<aura:application>\n<h2>Success\
  \ your first Lightning App</h2>\n</aura:application>\n```\n\n如前所述的代码所示，容器本质上是您可以使用浏览器导航到的页面。这些页面在\
  \ Salesforce 的标准 UI 之外工作，但仍需要您登录。登录到您的 Developer Edition 组织，并在 Setup 菜单下启用 Lightning\
  \ Experience（如果尚未启用）。\n\n切换到 Lightning Experience 并记下浏览器中的 URL。对于 Lightning Experience\
  \ 容器，URL 可能类似于以下内容（https://yourdomain.lightning.force.com/one/one.app）。\n\n要启动您的第一个\
  \ Lightning Application，请按以下方式修改 URL，将 yourdomain 替换为您组织的域（https://yourdomain.lightning.force.com/c/myapp.app）。\n\
  \n> 前面 URL 中的 c 代表您组织的默认命名空间。如果您的组织有命名空间，或者您正尝试从带有命名空间 coolapps 的已安装包启动 Lightning\
  \ Application，例如，请将其替换为命名空间 /coolapps/myapp.app。\n\n您应该在浏览器中看到以下消息：\n\n## 您的第一个\
  \ Lightning App 成功\n\n这种 Lightning Application 在 Lightning Components 开发者指南中正式称为独立\
  \ Lightning App（您可以参考 https://developer.salesforce.com/docs/atlas.en-us.lightning.meta/lightning/intro_framework.htm）。\n\
  \n## Lightning Design System 简介\n\nLightning 随附一个丰富而精巧的 CSS 库，用于设置 HTML 的外观和感觉。此库之前称为\
  \ Salesforce Lightning Design System (LDS)。虽然您可以将其 CSS 作为静态资源包含在应用程序中，但对于本章中介绍的此类原生\
  \ Lightning UI，则不需要这样做。\n\n通过在以下代码中使用 extends 属性，我们可以要求框架始终包含最新平台版本，并开始使用其 CSS 类来美化我们的输出：\n\
  \n```\n<aura:application extends=\"force:slds\">\n<div class=\"slds-notify_container\"\
  >\n<div class=\"slds-notify slds-notify--alert slds-theme--success\nslds-theme--alert-texture\"\
  \ role=\"alert\">\n<span class=\"slds-assistive-text\">Success</span>\n\n\n\n\n\n\
  <h2>成功！您的第一个 Lightning 应用</h2>\n</div>\n</div>\n</aura:application>\n\n> 请注意前面代码中\
  \ role 属性和 slds-assistive-text 类的使用。虽然这些在技术上并非必需，但它们旨在确保与需要屏幕阅读协助的用户兼容。Lightning\
  \ 包含并鼓励对 HTML5 标准中关于 **无障碍访问** 的支持。我们将在本章后面进一步讨论这一点。\n\n如果您刷新浏览器，现在将看到以下屏幕截图中所示的内容。前面的\
  \ HTML 代码基于 LDS 网站提供的代码：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_313_0.png)\n\
  \nLightning Design System (https://www.lightningdesignsystem.com) 网站包含大量精彩的示例 HTML\
  \ 标记，供您探索、设计和静态测试您希望 UI 呈现的效果。使用类似前面的简单 Lightning 应用程序，您可以继续复制粘贴示例来尝试不同的组合。\n\n\
  > 但是，请牢记作为开发者要保持高效。您真正需要的是一个组件库，其中的组件封装了前面的 HTML 代码，以便您可以定义一次并复用，而不是反复复制粘贴 HTML。如我们将在后面看到的，您可以构建自己的组件，并在其中利用\
  \ SLDS。幸运的是，对于更简单、更基础的组件需求，平台提供了越来越多已经使用 SLDS 样式设计的基本组件，称为 **Lightning Base Components**。我们将在本章后面探讨这些组件\
  \ (https://developer.salesforce.com/blogs/developer-relations/2017/01/base-lightning-components.html)。\n\
  \n## 构建您的第一个组件\n\n最后，让我们创建一个 Lightning 组件来封装我们的成功消息，该组件例如可以作为更通用信息消息的可重用组件的基础：\n\
  \n- 1. 在 Force.com IDE 中，导航到 File | New | Lightning Bundle。\n- 2. 在创建新的 Lightning\
  \ 组件对话框中，从 Type 字段中选择 Lightning Component。\n- 3. 为您的组件命名为 mycomponent，然后单击 Finish。\n\
  - 4. 将 myapp.app 文件中 aura:application 标签内包含的标记复制到新 mycomponent.cmp 文件中如下所示的新 aura:component\
  \ 标签，同时修改消息：\n\n```\n<aura:component>\n    <div class=\"slds-notify_container\"\
  >\n        <div class=\"slds-notify slds-notify--alert\n            slds-theme--success\n\
  \            slds-theme--alert-texture\" role=\"alert\">\n            <span class=\"\
  slds-assistive-text\">Success</span>\n            <h2>Success your first Lightning\
  \ Component</h2>\n        </div>\n    </div>\n</aura:component>\n```\n\n- 5. 最后修改\
  \ myapp.app 文件以使用您的新组件：\n\n```\n<aura:application extends=\"force:slds\">\n    <c:mycomponent\
  \ />\n</aura:application>\n```\n\n刷新浏览器，您将看到以下内容：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_314_0.png)\n\
  \n前面的代码是 Lightning 开发的基本介绍，旨在帮助您了解 Lightning 的高层架构及其如何适应互联网使用的标准 HTML 页面模型，同时还介绍了被称为\
  \ Salesforce Lightning Design System 的样式和设计框架。\n\n## Lightning 与其他 UI 框架有何不同？\n\n\
  如果您之前使用过其他 UI 框架（例如 Salesforce 自身的 Visualforce 或 Java Server Pages (JSP)、ASP.NET\
  \ 等），那么到目前为止，这些内容可能感觉相当熟悉。我们已经定义了一些标记，使用了 CSS，并了解了如何封装可重用的 HTML 部分。当用户导航到 URL 时，Lightning\
  \ 平台服务器端代码会提供适当的 HTML 来启动指定的应用程序并呈现引用的组件。如果您是 Visualforce 开发者，可能会觉得这与使用 Visualforce\
  \ 页面和 Visualforce 组件并没有太大区别。\n\n虽然与其他框架还有其他相似之处，例如使用表达式，但与这些技术最大的区别在于页面本身的生命周期。服务器端架构通常要求在用户执行操作时刷新整个页面。页面上的信息（即页面状态）会在用户每次执行操作时在客户端和服务器之间来回传输。服务器端控制器代码控制验证、数据加载和\
  \ UI 的条件显示。\n\n越来越多的用户界面设计生成的 HTML 页面代表用户打开并保持打开的单一应用程序或工作区。用户在其中访问不同的模块并执行各种操作。这通常称为单页应用程序\
  \ (SPA) 架构。传统的服务器端页面刷新模型不够灵敏，无法满足这些需求，例如仅需要更新页面一部分的情况。即使部署了传统的异步 JavaScript 和 XML\
  \ (AJAX) 方法，通常也需要将整个页面状态传回服务器端控制器。服务器端 UI 框架也不适合开发在临时离线场景中容忍缺乏连接性的用户体验。\n\n相比之下，Lightning\
  \ 应用程序在浏览器中长期存在，并依赖 JavaScript 代码来操作页面的 DOM 以加载新内容和功能。用户正在执行的操作的状态存储在浏览器中，只有在服务器需要检索和更新数据库时才会传输。\n\
  \n## Lightning 架构\n\n在本节中，我们将讨论 Lightning 架构的关键层，这将使您在深入学习时拥有更好的理解框架。\n\n最初让我感到惊讶的一个关键方面是需要使用\
  \ JavaScript 编写 **客户端控制器**。如果您是 Visualforce 开发者，起初这可能特别令人困惑，但这是成为 Lightning 开发者的重要组成部分，反映了其客户端架构。如前一章所见，Apex\
  \ 服务器端控制器仍然发挥作用，但主要用于访问后端 Apex 服务和选择器。\n\n一般来说，Lightning 开发更加组件化。就 UI 的设计方式和代码的组织方式而言，两者更加一致，使代码更易于维护和导航。这也更加强调\
  \ UI 层内的关注点分离。\n\n### 容器\n\n如前一节所示，我们使用独立的 Lightning 应用程序创建了一个名为 `myapp` 的基本容器。它包含我们\
  \ `mycomponent` 组件的单个实例。虽然看起来可能不多，但 `<aura:application>` 为其组件和您作为开发者提供了许多服务。\n\n\
  - • 它构建了页面 `<HTML>` 标签并加载了适当的 JavaScript、CSS 资源，例如 SLDS 和 Lightning JavaScript 运行时，这使得您的组件可以通过客户端控制器代码对用户交互做出反应。\n\
  \n> `extends` 属性允许从其他基于 `<aura:application>` 的应用程序继承。前面的示例扩展了平台的 `force:slds` 应用程序，以注入\
  \ SLDS 的 CSS。\n\n- • 它加载了其主体中的组件，即 `mycomponent` 组件，同时页面中存在的任何 HTML 标记也会被注入到页面中。每个组件在容器中启动自己的生命周期。就像\
  \ Apex 中的对象一样，它会被构建、初始化、跟踪，并可以被销毁。\n\n> 组件管理是一项重要的服务，因为它有助于避免开发富客户端应用程序时的常见陷阱，即资源管理。每个\
  \ HTML 标记及其关联数据都会占用浏览器内存，如果不妥善管理，在页面的整个生命周期内很容易攀升并引起问题。\n\n- URL 参数会自动映射到 aura:application\
  \ 主体中指定的 aura:attribute 组件。例如：\n- /c/myapp.app?myparam=myvalue\n\n```\n<aura:application\
  \ extends=\"force:slds\">\n<aura:attribute name=\"myparam\" type=\"String\"/>\n\
  <h2>The value of myparam is '{!v.myparam}'</h2>\n</aura:application>\n```\n\n在浏览器中显示以下文本：\n\
  \nmyparam 的值为 'myvalue'\n\n- URL 为中心的导航是用户体验的一个重要方面，当用户将 Web 应用程序中的记录或某些页面加入书签或共享链接时，这是一种预期行为。由于应用程序设计为长期存在，且更改\
  \ URL 会导致整个页面重新加载，因此需要一种替代方案。\n\n修改 URL 的书签部分不会重新加载页面。因此，Lightning 应用程序利用这一点为用户存储的链接添加更多上下文，并在应用程序自身的导航中使用它。\n\
  \n在浏览 Lightning Experience 时，您可以亲眼看到这一点。该框架提供 aura:locationChange 事件，您的客户端逻辑可以监听该事件以确定何时发生更改。\n\
  \n下面是使用的 URL 约定的简单示例：/c/myapp.app#showraceresults-2016\n\n您可以在 Lightning 组件开发指南中阅读有关\
  \ aura:application 属性的更多内容。这些服务是否全部相关取决于您使用的容器。但是，即使您只使用 Salesforce 容器，了解事物的工作原理也是好的。\n\
  \n\n\n\n\n## 介绍 Racing Overview Lightning 应用\n\nRacing Overview Lightning 独立应用包含在本章的示例代码中。可以通过\
  \ /c/RacingOverview 访问。以下截图展示了其外观，并初步展示了本章后续将详细介绍的 Lightning 组件：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_318_0.png)\n\
  \n前一张截图中显示的示例记录数据，可以通过在开发者控制台（Developer Console）或 Force.com IDE 的“执行匿名代码”（Execute\
  \ Anonymous）中运行以下脚本，注入到您的开发者组织中：\n\n```\nPageReference sampleData =\nnew PageReference('/resource/sampledata');\n\
  String sampleDataJSON =\nsampleData.getContent().toString();\nString orgNameSpace\
  \ =\nSObjectDataLoader.class.toString().\nremoveEnd('SObjectDataLoader').removeEnd('.');\n\
  SObjectDataLoader.deserialize(\nsampleDataJSON.replace('ns__', orgNameSpace+'__'));\n\
  \n```\n\n## Lightning Experience 和 Salesforce1\n\nSalesforce 通过 Lightning 应用容器（即\
  \ Lightning Experience 和 Salesforce1 Mobile）为其自身产品及合作伙伴应用程序创建了标准 UI 容器。两者均通过 /one/\
  \ one.app URL 提供：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_319_0.png)\n\n如前几章所示，Salesforce\
  \ 不会限制在这些容器中加载其自身组件。它们为开发者提供了多种方式，用于加载自行编写的组件，以便针对特定应用对象和流程集成和扩展标准用户体验。\n\nSalesforce\
  \ 还允许开发者利用为外部开发者消费构建和测试过的某些组件。例如，force:recordView 用于显示记录。force:showToast 组件可用于显示弹出式通知。我们将在后面介绍这两个组件以及\
  \ Salesforce 容器的各种使用和扩展方式。\n\n## 组件\n\n在 Lightning 中，页面级设计不再是重点；您应采用组件优先的思维方式。但这并不意味着不需要良好的用户体验设计。相反，它涉及\
  \ UX 设计师与开发者之间更紧密的协作。\n\n不建议创建一个巨大的组件来满足所有需求，这种做法也无法以用户期望的方式拥抱 Salesforce UI 自定义功能。从编码角度来看，这样的组件难以维护且不可复用，因为它可能无法满足所有人的需求。\n\
  \n更好的方法是与 UX 设计师合作制作原型，并思考如何将 UI 拆分为可复用或独立的元素。本章后面，我将介绍在设计 FormulaForce 应用程序组件时，我是如何运用这种思维的。\n\
  \n> 在设计用户体验时，熟悉 Salesforce UI 中的扩展点也非常重要。标准 UI 可能已提供大部分所需的用户体验，开发者只需专注于一两个用于补充剩余体验的单独组件。\n\
  \n## 关注点分离\n\nLightning 组件从设计之初就贯彻了关注点分离的理念。请注意 **Lightning 包** 的使用，以及目前为止我们所知的内容被拆分为单独的文件，即\
  \ **标记**（视图）和 **JavaScript** 代码（控制器）。它们都归并在一个子文件夹下。这是 Salesforce 想要我们真正思考如何构建 Lightning\
  \ 代码以及组件如何交互的一种巧妙方式。\n\n如同工程中的大多数事物，仅凭使用技术本身并不能自动实现关注点分离。某些方面会强制执行，而其他方面则遵循指南和良好的组件设计。如果做得正确，您不仅会在自己的应用\
  \ UI 中获得可复用、健壮且持久的 UI 组件，还会在不断演进的 Salesforce 容器、日益增多的移动设备中获得此类组件，并在需要时与第三方网站集成。\n\
  \n牢记关注点分离的原则在开发富客户端应用时与在构建应用程序后端业务逻辑时同样至关重要。\n\n## 开发过程中的封装\n\n组件实现的一个重要方面是封装。其防止实现影响页面上其他组件运作的能力，是容器模型得以工作的关键方面——尤其是因为实际上，所有组件都占用同一个页面\
  \ HTML DOM。\n\n如前所述，**Lightning 包**（也称为 **Aura 定义包**）用于收集实现 Lightning 工件各个特定方面所需的源文件。以下截图显示本书中包含的\
  \ **合规性检查器** 组件，如在 Force.com IDE 中所示：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_321_0.png)\n\
  \n> 另请参阅 *Metadata API 开发者指南*（https://developer.salesforce.com/docs/atlas.en-us.api_meta.meta/api_meta/meta_auradefinitionbundle.htm）中的\
  \ Aura 定义包 类型。\n\n以下各节将讨论 Lightning 组件包的内容。\n\n### 组件标记 (.cmp)\n\n组件标记包含组件外观的 **XHTML\
  \ 标记**。其根元素是 `aura:component`。它可以引用有效的 HTML 元素和/或其他组件，如我们之前在 `mycomponent` 示例中所见。\n\
  \n在标记中，您还可以为组件的动态方面（如表或字段值）指定 **属性绑定**。与 Visualforce 不同，这些不是绑定到 Apex 类属性的。绑定是指通过\
  \ `aura:attribute` 组件（通常位于文件顶部）或平台提供的属性。\n\n框架确保当属性值发生变化（通过 JavaScript 控制器代码）时，任何通过绑定表达式引用该属性的标记都会刷新。这是一个非常强大的功能，避免了围绕页面\
  \ DOM 进行大量编码的需求。事实上，除高级场景（如自定义组件渲染或使用第三方库）外，通常不鼓励这样做。\n\n### 组件控制器 (...Controller.js)\n\
  \n`Controller.js` 是一个 JavaScript 文件，包含组件的 **客户端控制器** 代码。您必须有一个这样的文件，才能在组件中定义动态行为，包括任何动态初始化。调用\
  \ **Apex 控制器** 中代码的唯一方式是从客户端控制器代码进行；与 Visualforce 不同，无法直接从标记中这样做。\n\n定义的函数与 `.cmp`\
  \ 文件中的相应 **操作绑定** 或 `aura:handler` 引用相关联。操作是指在浏览器中发生的事件，例如单击按钮、悬停在元素上、滚动，或来自容器或另一个组件的事件。我们将在后面介绍\
  \ **事件**。\n\n虽然未强制执行，但建议仅包含与 `.cmp` 文件中引用的操作相关的函数。更多控制器代码和实用函数应放在如下所述的 `Helper.js`\
  \ 文件中。这种关注点分离的另一个动机是，框架会为组件的每个实例复制控制器，但助手始终只有一个实例。\n\n以下是在 `.cmp` 文件中使用 `c` 值提供程序（通过表达式引用客户端控制器函数）的简单按钮标记：\n\
  \n```\n<lightning:button label=\"Add Drivers\"\n onclick=\"{!c.onAddDrivers}\"/>\n\
  ```\n\n框架会自动为您设置 HTML 事件监听器并将其路由到指定的控制器方法。`component`、`event` 和 `helper` 参数始终由框架注入：\n\
  \n```\nonAddDrivers :function(component, event, helper) {\n\n\n\n```\nhelper.addDrivers(component,\
  \ event);\n}\n```\n\n> c 值提供程序（控制器提供程序）也可以在 JavaScript 中使用，以获取客户端代码希望调用的 Apex 控制器方法的引用。我们将在本章后面回顾这种场景的示例。\n\
  \n## 组件辅助程序 (...Helper.js)\n\n一个 JavaScript 文件，用于定义 Controller.js 和 Renderer.js（如下文所述）文件所使用的函数。框架会创建这些方法的单个实例，该实例在所有组件实例之间共享。因此，建议您不要存储任何状态，而是使用组件属性。\n\
  \n此示例展示了一个操作绑定，由 aura:handler 引用，指定在组件初始化期间触发的平台事件。在此情况下，它允许组件动态从服务器加载数据：\n\n```\n\
  <aura:handler\n name=\"init\" value=\"{!this}\"\n action=\"{!c.onInit}\"/>\n```\n\
  \n控制器函数触发并委托给辅助程序类：\n\n```\nonInit : function(component, event, helper) {\n helper.getCalendar(component,\
  \ event);\n}\n```\n\n辅助程序函数会向 .cmp 文件中 controller 属性指定的 Apex 控制器进行服务器端调用。此处再次使用\
  \ c 值提供程序，但这次是用于访问服务器端控制器方法：\n\n```\ngetCalendar : function(component, event ) {\n\
  \ var action = component.get(\"c.getRaceCalendar\");\n action.setCallback(this,\n\
  \ function(response) {\n if(response.getState() == 'SUCCESS') {\n component.set(\"\
  v.calendar\", response.getReturnValue());\n }\n });\n $A.enqueueAction(action);\n\
  }\n```\n\n前面代码中使用的 $A 变量可用于访问 Lightning JavaScript API。\n\n## 组件 CSS (.css)\n\n\
  在为组件设置样式时，您应该利用 Lightning 设计系统提供的设计和 CSS，如先前的 mycomponent 示例所示。这将确保您的 UI 继续与其所在的\
  \ Salesforce 容器保持一致，同时也符合对新设备和布局类型支持的任何进一步改进。\n\n> 使用 lightning 命名空间中的 Salesforce\
  \ 基础组件，例如 lightning:button、lightning:input 和 lightning:tabSet，可自动确保您使用的是 SLDS。\n\
  \n但是，如果您确实需要定义自己的样式，请通过添加到组件 .css 文件中的自定义 CSS 类来完成。框架将确保这些样式被封装在组件内，不会影响页面上的其他组件。\n\
  \n> 您不应尝试修改元素的 .style 属性。如果您需要控制此项，可能需要实现一个组件渲染程序。框架提供 $A.util.addClass 和 $A.util.removeClass\
  \ 方法，以安全地动态操作组件标记的样式。\n\n组件 CSS 中的 THIS 标识符必须用于将 CSS 作用域限定在您的组件中。以下示例用于 **Race Calendar**\
  \ 组件，以便在用户单击某场比赛时对其进行高亮显示：\n\n```\n.THIS .selectedRace{\n    background-color:token(colorBackgroundHighlight);\n\
  }\n```\n\n相应的组件标记使用条件表达式来应用 CSS 类（除了 SLDS 样式之外）。控制器方法只是更新来自赛事绑定的 .Selected 属性的值：\n\
  \n```\n<li class=\"{!'slds-item ' + (race.Selected ? 'selectedRace' : '')}\" onclick=\"\
  {!c.onRaceClicked}\">\n```\n\n令牌是 Lightning 框架的一项功能，允许您在自己的样式中重用 Salesforce 表示的颜色和字体值。前面的示例重用了\
  \ SLDS 中的一个令牌，该令牌定义选定项目的颜色。要将标准 SLDS 令牌包含在组件中以供使用，必须创建一个名为 `defaultTokens` 的 `aura:tokens`\
  \ Lightning Bundle。此令牌已包含在本章的示例代码中。在此中，您还可以通过 `aura:token` 元素定义自己的令牌。\n\n## 组件渲染程序\
  \ (...Renderer.js)\n\n在大多数情况下，利用组件标记、属性和绑定来操作组件外观是开发组件的预期方式。您也不应在辅助程序或控制器方法中操作 DOM，因为当框架响应属性更改时会覆盖更改。但是，在某些情况下，例如使用第三方\
  \ JavaScript 库时，您可能希望直接控制 DOM。在这些情况下，请使用组件渲染程序。有关此功能的更多信息，请参阅 *Lightning Components\
  \ Developer Guide*。\n\n## 组件设计 (.design) 和组件 SVG (.svg)\n\n这些基于 XML 的文件允许您在通过 **Lightning\
  \ App Builder** 和 **Lightning Community Builder** 工具公开组件时自定义其外观，例如配置用于在边栏中标识它的图标，允许您的用户使用这些拖放工具来配置\
  \ Salesforce UI，并在引入打包组件时使用。有关此功能的进一步讨论和示例，请参见本章后面的 *Making components customizable*。\n\
  \n## 组件文档 (.auradoc)\n\nLightning 提供自己的文档框架，该框架根据组织中的组件（包括来自 Salesforce 的组件）动态构建。如果您计划允许其他开发人员使用您的打包组件，可以使用此文件来放置描述组件目的和功能的文档。\n\
  \n您还应该利用 `aura:component`、`aura:attribute`、`aura:method`、`aura:event`、`aura:interface`\
  \ 和 `aura:registerEvent` 上可用的 `description` 属性。\n\n开发人员可以通过 URL https://<myDomain>.lightning.force.com/auradocs/reference.app\
  \ 访问以这种方式表达的文档。有关如何将组件公开供包外使用的示例和更多讨论，请参见本章后面的 *Making components customizable*。\n\
  \n## 在运行时强制实施封装和安全性\n\n页面上的 JavaScript 代码可以通过 HTML DOM API 遍历整个页面内容，获取信息或修改页面的其他方面。这会在运行时打破封装，也违反了\
  \ Lightning 等容器架构的安全最佳实践。假设您是一名管理员，安装了一个放置在主页上的组件，它获取了重要数据并将其传输回另一台服务器。\n\n此类组件不太可能通过\
  \ Salesforce 安全审查并发布到 AppExchange。在 Lightning 中不允许此类组件的还有一个原因。Salesforce 创建了 Lightning\
  \ Locker Service，这是一项旨在在运行时物理阻止此类逻辑（无论是故意还是无意）执行的服务。您可能会无意中编写被视为不安全的代码，即使用了不符合行业标准内容安全策略\
  \ (CSP) 的功能。在 Locker Service 创建的安全上下文中，也不支持使用 eval 和访问 window 对象等功能。\n\n> Locker\
  \ Service 可能会在您的组织或客户的组织中默认启用。因此，我们强烈建议在开发和测试组织中未启用的情况下，也应在启用状态下开发和测试代码。还有一个名为 Salesforce\
  \ Lightning CLI 的命令行实用程序，可扫描代码中的安全漏洞。这非常值得研究，如果您有持续集成流程，建议将其集成进去。\n\n## 表达行为\n\n\
  既然我们知道 Lightning 如何允许我们封装实现。请务必牢记，组件背后的愿景是共享和可重用性，不仅限于您自己的应用程序，还包括应用程序的其他消费者。如同公开\
  \ API 的 Apex 类一样，仔细管理组件消费者被允许以何种方式与其交互非常重要。\n\n## 访问控制\n\nApex 使用可见性关键字来控制在类范围内、包内以及包外可见的类、属性和方法。\n\
  \n\n\n\n\n为你定义的 Lightning 工件提供相同级别的控制，例如 `aura:application`、`aura:component`、`aura:attribute`、`aura:method`、`aura:event`\
  \ 和 `aura:interface`。所有情况下的默认访问级别均为 `public`，可提升至 `global`。对于属性，还可以使用 `private`。\n\
  \n> 与 Apex 一样，除非有充分理由提高访问级别，否则将某内容标记为最低访问级别实际上是最佳实践。因此本书中的示例大多使用 `private` 属性，因为这些属性代表组件的内部状态，甚至不应对任何其他组件（包括包内的组件）可访问。与通用\
  \ Apex 编码一样，这一最佳实践有助于管理耦合并允许更大的重构自由度。\n\n控制器、helper 和 renderer 文件中的 JavaScript 函数均为私有。不过，你可以在组件标记中使用\
  \ `aura:method` 来公开控制器函数。下一节将详细介绍方法、事件和接口的使用。\n\n> 与 Apex 类一样，在指定 `global` 访问控制时，请仔细考虑对组件在包版本之间演进的影响。为了支持升级之间的向后兼容性，更改仅限于应用了此访问控制的工件。\n\
  \n## 方法、事件和接口\n\n在 Lightning 中，方法和接口概念与 Apex 中的等效概念相似，但适用于在客户端定义的组件。与 Apex 不同，接口不表达方法，仅表达组件要实现的属性和事件。\n\
  \n> 与 Apex 和 Java 一样，没有属性或事件的接口称为标记接口，我们将在本章后面发现这一点。该平台大量使用标记接口，例如 `force:hasRecordId`，你可以将其应用于组件，以让\
  \ Salesforce 容器知道你的组件已准备好在各种上下文中使用。\n\n有时很难决定何时使用方法代替事件或反之亦然，两者都提供了组件之间通信的方式：\n\n\
  - 事件在 Lightning 中可能是一个被过度使用的术语；它可以指从浏览器中的 HTML 元素发送的内容，也可以指发生在组件生命周期中的内容，例如 `init`\
  \ 事件。这些分别称为浏览器级事件和系统级事件。\n\n- 作为组件作者，你还可以定义自己的组件事件和应用程序事件。组件事件只能在组件及其子组件中触发和处理，而应用程序事件遵循发布订阅模型，允许组件向页面上任何想要监听（订阅）该事件的组件广播事件。有关考虑所有者组件与容器时的事件处理的更多信息，请参阅\
  \ [开发者指南](https://developer.salesforce.com/docs/atlas.en-us.lightning.meta/lightning/events_application_handling_phases.htm)。\n\
  \n- 方法虽然更容易实现，但倾向于在组件之间创建更紧密的耦合，因此应谨慎使用，例如用于优化子组件的设置或配置。\n\n## 平台命名空间\n\nLightning\
  \ 利用命名空间来隔离层和功能。命名空间的使用方式与平台的其他部分相同，即在你希望引用的工件（如组件或接口）前加上前缀。下表列出了平台提供的一些核心命名空间。\n\
  \n| 命名空间 | 用途 |\n| --- | --- |\n| aura | 基于用于构建 Lightning 的核心框架 Aura。Aura 仍然是由 Salesforce\
  \ 管理的开源框架。核心组件和标记在此命名空间中定义。该命名空间的某些方面设计为与托管平台无关。如果你愿意，可以在 Java 堆栈上运行 Aura！ |\n|\
  \ force | 包含与 Force.com 平台相关的方面，例如对 SObjects 的了解以及在 Lightning 中复制自定义对象布局 UI 的组件。force:inputField\
  \ 和 force:outputField 组件模拟了 apex 命名空间下 Visualforce 中的组件。它包含在集成到 Lightning Experience\
  \ 和 Salesforce1 移动容器时使用的接口。本章中的示例组件实现了这些接口。 |\n| forceCommunity | 表示用于将组件集成到 Lightning\
  \ Community 容器中的接口。 |\n| ui | 包含用于基本表单式用户体验的可重用 UI 组件。这些组件早于 SLDS，因此默认未使用 SLDS 样式，但你可以自己应用\
  \ SLDS 样式。在路线图方面，Salesforce 将重点关注 lightning 命名空间。 |\n| lightning | 也称为基础 Lightning\
  \ 组件，将在下一节中详细讨论。 |\n\n**Aura 文档**页面的以下屏幕截图说明了一种发现所有受支持命名空间及其中的接口、组件和 API 的好方法，包括在组织中安装的包中公开的内容：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_329_0.png)\n\n## 基础组件\n\nSalesforce 推荐\
  \ `lightning` 命名空间中的组件，因为它们使用 SLDS 提供功能丰富且样式化的 UI 组件。Salesforce 已表示，随着 SLDS 的发展，它们将继续接收更新。因此，建议使用它们以确保组件与平台其余部分的外观和感觉保持一致。\n\
  \n在撰写本文时，它们尚未完全取代 `ui` 命名空间中的组件。然而，Salesforce 已表示，它们将在每个版本中继续扩展这些组件。与此同时，请继续先检查\
  \ `lightning` 命名空间，再检查 `ui` 命名空间，在构建自己的组件之前检查两者。\n\n## 数据服务\n\n在撰写本文时，Lightning\
  \ 数据服务处于开发者预览阶段，这意味着它们在完全发布用于生产使用时可能会发生变化。如前一章所述，这些服务可以作为编写 Apex 控制器的替代方案，用于仅希望创建、读取、更新或删除记录的场景。你可以将其视为\
  \ Visualforce 中标准控制器的角色，但它们位于客户端层，并由客户端控制器中的代码与之交互。\n\n请注意，不要允许此类客户端设施将业务逻辑泄露到客户端层。除最简单的情况外，你可能仍然希望将业务逻辑委托给\
  \ Apex 服务来执行。还要牢记事务范围；客户端的多个更新可能各自都有自己的事务。\n\n## 面向对象编程\n\nLightning 组件在许多方面与 Apex、Java\
  \ 和 C# 等传统面向对象编程语言中使用的类和对象相似。使用组件来利用 OOP 技术有许多好处。\n\n关于继承，请考虑以下几点：\n\n- 我们已经通过 myapp\
  \ Lightning 应用程序上的 `extends` 属性看到一个继承示例，它扩展了 `force:SLDS`（本身是 `aura:application`）以将\
  \ SLDS 注入应用程序。\n\n- 本章示例代码中用于导入 SLDS 令牌的 `defaultTokens` 令牌组件扩展了 `force:base` 组件（本身是\
  \ `aura:tokens` 的一个实例）。\n\n- 你不必仅利用平台提供的基础组件；你可以定义自己的组件，并通过 `aura:component` 元素上的\
  \ `extensible` 属性将其标记为可扩展。\n\n接口还为我们的组件与 Salesforce 容器集成提供了手段。**竞赛结果** 组件实现了以下接口，以便可以在\
  \ Lightning Experience **主页**和**记录**页面上使用：\n\n```\n<aura:component controller=\"\
  RaceResultsComponentController\"\nimplements=\"force:hasRecordId,\nflexipage:availableForAllPageTypes\"\
  \naccess=\"global\">\n```\n\n\n\n\n\n## 对象级别和字段级别安全性\n\n开发人员有责任在 Lightning 中强制执行对象和字段安全性。这可以在\
  \ Apex 控制器中使用传统的 Apex Describe 方法来完成。强制执行应在服务器端进行，否则未经授权的数据可能会被传输到客户端，用户可以使用浏览器调试工具检查从服务器发送的\
  \ JSON 负载。\n\nUI 如何向用户展示取决于开发人员。这可能只是显示一条消息，指示用户需要更多权限，或者您可以选择动态隐藏（这应包括从服务器响应中省略值）或禁止编辑某些字段或表格行，例如。\n\
  \n您可能期望 ui:inputField 和 ui:outputField 组件尊重字段级别安全性，就像它们的 Visualforce 对应物一样。情况并非如此，由于上述原因，强制执行必须在服务器端进行。\n\
  \n> 预期 Lightning Data Services 将遵守对象和字段级别安全性。\n\n## FormulaForce Lightning 组件\n\n\
  在为本书中包含的 FormulaForce 示例应用程序设计 Lightning 组件时，我希望尝试演示 Salesforce UI 中的一些关键集成点，同时确保用例与应用程序领域相符。\n\
  \n我专注于 Lightning Experience 和 Salesforce1 Mobile。在着手进行任何大规模开发之前，优先考虑平台也是一种良好的实践。我从以下用例开始，然后制定了一组组件来提供功能。\n\
  \n- 赛事概览：虽然我们之前研究过的独立 Lightning 应用程序是开始使用组件的好方法，但它不是 Salesforce 集成解决方案。我想要做的是通过\
  \ Lightning App Builder 自定义工具集成 Lightning Experience 主页。不仅要显示总排名（排行榜），还要允许用户通过赛事日历筛选信息，以显示每场已完成赛事的结果。\n\
  \n- 赛事日历可访问性：当使用应用程序的其他部分时，用户可能希望随时掌握赛事日历这一关键信息。Lightning Experience 实用工具栏（或页脚）特定于您的应用程序，并包含您希望始终可访问的组件。\n\
  \n- 赛事设置协助：Race 记录和 Drivers 之间存在一个名为 Contestants 的连接对象。从用户体验角度来看，这可能会使设置赛事变得过于复杂。因此，我想利用\
  \ Lightning 组件操作提供一个自定义 UI 以将驱动程序添加到赛事中。\n\n- 赛事结果概览。赛事结果是 Contestants、Driver、Team\
  \ 和 Car 对象信息的综合结果。我想要通过 Lightning App Builder 自定义工具，从主页和赛事记录页面提供一种轻松且上下文相关的查看赛事结果的方式。\n\
  \n让我们仔细看看我提出的组件。\n\n## RaceStandings 组件\n\n以下屏幕截图显示了 c:RaceStandings 组件的顶部部分：\n\n\
  | | 车手 | 车队 | 胜场 | 积分 |\n|---|---|---|---|---|\n| 1 | Lewis Hamilton | Mercedes\
  \ | 1 | 43 |\n| 2 | Nico Rosberg | Mercedes | 1 | 25 |\n| 3 | Sebastian Vettel |\
  \ Ferrari | 0 | 15 |\n| 4 | Kimi Raikkonen | Ferrari | 0 | 12 |\n| 5 | Daniel Ricciardo\
  \ | Red Bull | 0 | 10 |\n| 6 | Valtteri Bottas | Williams | 0 | 8 |\n| 7 | Max Verstappen\
  \ | Red Bull | 0 | 6 |\n| 8 | Sergio Perez | Force India | 0 | 4 |\n| 9 | Felipe\
  \ Massa | Williams | 0 | 2 |\n| 10 | Nico Hulkenberg | Force India | 0 | 1 |\n\n\
  以下组件标记是使用 SLDS 样式化的简化 HTML `<table>`：\n\n```\n<aura:component controller=\"RaceStandingsComponentController\"\
  \ implements=\"flexipage:availableForAllPageTypes\" access=\"global\" >\n    <!--\
  \ Attributes -->\n    <aura:attribute name=\"standings\" type=\"Object[]\" access=\"\
  private\"/>\n    <!-- Event handlers -->\n    <aura:handler name=\"init\" value=\"\
  {!this}\" action=\"{!c.onInit}\"/>\n    <!-- Component markup -->\n    <lightning:card>\n\
  \        <aura:set attribute=\"title\">\n            <lightning:icon iconName=\"\
  standard:reward\" size=\"small\"/>\n            &nbsp;Standings\n        </aura:set>\n\
  \        <table class=\"slds-table slds-table--bordered slds-table--cell-buffer\"\
  >\n            <thead>\n                <tr class=\"slds-text-title--caps\">\n \
  \                   <th scope=\"col\"></th>\n                    <th scope=\"col\"\
  >Driver</th>\n                    <th scope=\"col\">Team</th>\n                \
  \    <th scope=\"col\">Wins</th>\n                    <th scope=\"col\">Points</th>\n\
  \                </tr>\n            </thead>\n            <tbody>\n            \
  \    <aura:iteration items=\"{!v.standings}\" var=\"standing\">\n              \
  \      <tr>\n                        <th scope=\"row\" data-label=\"Position\">{!standing.Position}</th>\n\
  \                        <td data-label=\"Driver\">{!standing.Driver}</td>\n   \
  \                     <td data-label=\"Team\">{!standing.Team}</td>\n          \
  \              <td data-label=\"Wins\">{!standing.Wins}</td>\n                 \
  \       <td data-label=\"Points\">{!standing.Points}</td>\n                    </tr>\n\
  \                </aura:iteration>\n            </tbody>\n        </table>\n   \
  \ </lightning:card>\n</aura:component>\n```\n\n## RaceStandings 组件的其他值得注意的方面是：\n\
  \n- 它实现了 flexipage:availableForAllPageTypes 接口，允许将组件拖放到 Lightning Experience 主页或由\
  \ Lightning App Builder 编辑的任何其他页面上。\n\n- aura:iteration 类似于 Visualforce apex:repeat\
  \ 组件，因为它将遍历绑定的列表并重复其中定义的标记。\n\n- 它使用两个基础 Lightning 组件，lightning:card 和 lightning:icon，SLDS\
  \ 样式由这些组件实现。\n\n- 客户端控制器函数 onInit 调用一个辅助函数，该函数调用 Apex 控制器以从服务器加载信息。响应会更新 standings\
  \ 属性，进而导致框架使用记录刷新 HTML 表格：\n\n```\ngetStandings : function(component, event ) {\n\
  \ var action = component.get(\"c.getStandings\");\n action.setCallback(this, function(response)\
  \ {\n if(response.getState() == 'SUCCESS') {\n component.set(\"v.standings\",\n\
  \ response.getReturnValue());\n }\n });\n $A.enqueueAction(action);\n}\n```\n\n\
  - Apex 控制器方法使用 ContestantsSelector 类。在以下示例中，Selector 类 ContestantsSelector.Standing\
  \ 的成员不支持 @AuraEnabled 属性，因此此类未直接用于响应。备用 RaceStanding 类允许对客户端的响应更侧重于客户端代码的需求：\n\n\
  ```\npublic with sharing class RaceStandingsComponentController {\n @AuraEnabled\n\
  \ public static List<RaceStanding> getStandings() {\n List<RaceStanding> raceStandings\
  \ =\n new List<RaceStanding>();\n for(ContestsSelector.Standing standing :\n newContestsSelector().\n\
  \ selectStandingsForCurrentSeason()) {\n RaceStanding raceStanding = newRaceStanding();\n\
  \ raceStanding.Position = standing.Position;\n raceStanding.Driver = standing.Driver;\n\
  \ raceStanding.Team = standing.Team;\n raceStanding.Wins = standing.Wins;\n raceStanding.Points\
  \ = standing.Points;\n raceStandings.add(raceStanding);\n }\n return raceStandings;\n\
  \ }\n\n public class RaceStanding {\n   @AuraEnabled\n   public Integer Position;\n\
  \   @AuraEnabled\n   public String Driver;\n   @AuraEnabled\n   public String Team;\n\
  \   @AuraEnabled\n   public Integer Wins;\n   @AuraEnabled\n   public Integer Points;\n\
  \ }\n }\n```\n\n> @AuraEnabled 注解与在 Visualforce 中使用的 @RemoteAction 注解类似。两者都要求方法为静态且无状态。它们也可以在同一方法上一起使用，从而有助于从\
  \ Visualforce 迁移到 Lightning。\n\n## RaceCalendar 组件\n\n以下显示了 c:RaceCalendar 组件的顶部部分：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_335_0.png)\n\n\n\n\n\n当用户点击某个比赛时，选中的比赛会被高亮显示，并触发一个组件应用事件\
  \ c:RaceSelected。该事件稍后将由 c:RaceResults 组件接收。该事件定义如下：\n\n```\n<aura:event type=\"\
  APPLICATION\"\ndescription=\"Fired when the user selects a race\" access=\"global\"\
  >\n <aura:attribute name=\"raceId\" type=\"string\"/>\n <aura:attribute name=\"\
  raceName\" type=\"string\"/>\n</aura:event>\n```\n\n以下组件标记使用 HTML 无序列表 <ul>。列表和项使用\
  \ SLDS 进行样式设置，以按照 SLDS 设计指南显示一个磁贴列表：\n\n```\n<aura:component controller=\"RaceCalendarComponentController\"\
  \ implements=\"flexipage:availableForAllPageTypes\" access=\"global\">\n <!-- Attributes\
  \ -->\n <aura:attribute name=\"calendar\" type=\"Object\" access=\"private\"/>\n\
  \ <!-- Event handlers -->\n <aura:handler name=\"init\" value=\"{!this}\" action=\"\
  {!c.onInit}\"/>\n <!-- Component markup -->\n <lightning:card>\n <aura:set attribute=\"\
  title\">\n <lightning:icon iconName=\"standard:campaign\" size=\"small\"/>\n &nbsp;Race\
  \ Calendar\n </aura:set>\n </lightning:card>\n <div class=\"slds-p-around--small\"\
  >\n <ul class=\"slds-has-dividers--around-space\">\n <aura:iteration items=\"{!v.calendar.Remaining}\"\
  \ var=\"race\">\n <li class=\"{! 'slds-item ' + (race.Selected ? 'selectedRace'\
  \ : '')}\" onclick=\"{!c.onRaceClicked}\" data-raceid=\"{!race.Id}\" data-racename=\"\
  {!race.Name}\">\n <div class=\"slds-tile slds-tile--board\">\n <h4 class=\"slds-text-heading--small\"\
  >{!race.Name}</h4>\n <div class=\"slds-tile__details slds-text-body--small\">\n\
  \ <p>{!race.Location}</p>\n <p>{!race.RaceDate}</p>\n </div>\n </div>\n </li>\n\
  \ </aura:iteration>\n <li class=\"slds-p-around--small\">\n <div class=\"slds-text-heading--small\"\
  >Completed races</div>\n </li>\n <aura:iteration items=\"{!v.calendar.Completed}\"\
  \ var=\"race\">\n <li class=\"{!'slds-item ' + (race.Selected ? 'selectedRace' :\
  \ '')}\" onclick=\"{!c.onRaceClicked}\" data-raceid=\"{!race.Id}\" data-racename=\"\
  {!race.Name}\">\n <div class=\"slds-tile slds-tile--board\">\n <h4 class=\"slds-text-heading--small\"\
  >{!race.Name}</h4>\n <div class=\"slds-tile__details slds-text-body--small\">\n\
  \ <p>{!race.Location}</p>\n <p>{!race.RaceDate}</p>\n </div>\n </div>\n </li>\n\
  \ </aura:iteration>\n </ul>\n </div>\n </aura:component>\n```\n\n此组件的其他新特性和值得注意的方面如下：\n\
  \n- `<li>` 元素的 CSS 类由一个表达式驱动，该表达式评估来自比赛绑定的 `Selected` 属性值。这指示用户当前选择了哪个比赛。\n\n- **HTML5\
  \ 数据属性** `data-raceid` 和 `data-racename` 用于为 `<li>` 元素分配有用信息。这些信息可以由以下控制器代码稍后引用。\n\
  \n- `<li>` 元素上的 `onclick` 属性会调用 `c.onRaceClicked` 方法。将调用 helper 中的 `selectRace`\
  \ 函数，并使用 HTML5 data attributes 来确定用户点击的比赛的 Salesforce 记录 ID。一个实用方法会更新 `calendar`\
  \ 属性中保存的项目上的 `Selected` 属性。此更新反过来会刷新 `<li>` 元素上的 `class` 属性，从而显示选中的比赛项。最后，触发 `c:RaceSelected`\
  \ 事件，以便其他组件可以相应响应：\n\n```\nselectRace : function(component, event ) {\n  // Establish\
  \ the selected race via HTML5 data attributes\n  var selectedRaceId =\n  event.currentTarget.dataset.raceid;\n\
  \  var selectedRaceName =\n  event.currentTarget.dataset.racename;\n\n  // Mark\
  \ the race as selected and deselect any selected\n  var calendar = component.get('v.calendar');\n\
  \  this.updateSelectedRace(calendar.Remaining, selectedRaceId);\n  this.updateSelectedRace(calendar.Completed,\
  \ selectedRaceId);\n  component.set(\"v.calendar\", calendar);\n\n  // Fire the\
  \ RaceSelected event\n  var compEvent = $A.get(\"e.c:RaceSelected\");\n  compEvent.setParams({\"\
  raceId\" :selectedRaceId } );\n  compEvent.setParams({\"raceName\" :selectedRaceName\
  \ } );\n  compEvent.fire();\n}\n```\n\n- 加载比赛日历的 Apex 控制器方法（未显示）将比赛拆分并正确排序为两个列表（基于比赛是否已完成），然后将其发送到组件。这减少了控制器和\
  \ helper 文件中所需的 JavaScript 数量。\n\n## RaceResults 组件\n\n以下显示 c:RaceResults 组件的最上部：\n\
  \n| 驾驶员 | 车队 | 排位 | 比赛时间 | 积分 |\n|---|---|---|---|---|\n| Nico Rosberg | Mercedes\
  \ | 1 | 1:17:28.89 | 25 |\n| Lewis Hamilton | Mercedes | 2 | 0:0:15.100 | 18 |\n\
  | Sebastian Vettel | Ferrari | 3 | 0:0:21.0 | 15 |\n| Kimi Raikkonen | Ferrari |\
  \ 4 | 0:0:27.600 | 12 |\n| Daniel Ricciardo | Red Bull | 5 | 0:0:45.300 | 10 |\n\
  | Valtteri Bottas | Williams | 6 | 0:0:51.0 | 8 |\n| Max Verstappen | Red Bull |\
  \ 7 | 0:0:54.200 | 6 |\n| Sergio Perez | Force India | 8 | 0:1:5.0 | 4 |\n| Felipe\
  \ Massa | Williams | 9 | 0:1:5.600 | 2 |\n| Nico Hulkenberg | Force India | 10 |\
  \ 0:1:18.700 | 1 |\n\nc:RaceResults 组件与 c:RaceStandings 组件遵循类似的实现方法，因此此处不显示完整源代码。您可以通过本章关联的示例代码查看完整代码：\n\
  \n```\n<aura:component controller=\"RaceResultsComponentController\" implements=\"\
  force:hasRecordId,flexipage:availableForAllPageTypes\" access=\"global\">\n<!--\
  \ Attributes -->\n<aura:attribute name=\"recordName\" type=\"String\" access=\"\
  private\"/>\n<aura:attribute name=\"results\" type=\"Object[]\" access=\"private\"\
  />\n<!-- Event handlers -->\n<aura:handler name=\"init\" value=\"{!this}\" action=\"\
  {!c.onInit}\"/>\n<aura:handler event=\"c:RaceSelected\"\naction=\"{!c.handleRaceSelectedEvent}\"\
  />\n```\n\n此组件中值得注意的代码片段如下：\n\n- flexipage:availableForRecordHome 接口声明，该组件可通过 Lightning\
  \ App Builder 拖放到 **记录页面**。\n\n- flexipage:availableForAllPageTypes 接口声明，该组件可通过\
  \ Lightning App Builder 拖放到 **主页**。\n\n- force:hasRecordId 接口可让容器（Lightning Experience\
  \ 或 Salesforce1）知道组件想要获取记录 ID。当组件放置在记录页面上时，容器会在 recordId 属性（由该接口添加）中放置此值。\n\n- c.onInit\
  \ 方法会检查 recordId 属性的值；如果不为 null，它将加载适用的比赛结果并显示它们。由于组件可以放置在主页上，在该上下文中此值可能为 null：\n\
  \n```\nonInit :function(component, event, helper) {\n// If we have a recordId context\
  \ load the race results\nvar recordId = component.get('v.recordId');\nif(recordId!=null)\
  \ {\nhelper.getRaceResults(component, event);\n}\n}\n```\n\n当触发 c:RaceSelected 事件时，会调用\
  \ c.handleRaceSelected。该方法从事件参数中提取 raceId 和 raceName，并刷新比赛结果。这种方法允许组件既存在于记录页面，也存在于主页上，同时仍保持上下文：\n\
  \n```\nhandleRaceSelectedEvent :function(component, event, helper) {\n// Update\
  \ race record Id and Name attributes from Event\ncomponent.set('v.recordId', event.getParam('raceId'));\n\
  component.set('v.recordName',event.getParam('raceName'));\n// Retrieve race results\n\
  helper.getRaceResults(component, event);\n}\n```\n\n## RaceSetup 组件\n\n以下显示 c:RaceSetup\
  \ 组件：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_340_0.png)\n\n此组件利用 HTML 表格来显示驾驶员列表表格。lightning:input\
  \ 组件用于将复选框绑定到列表项。未显示完整标记；以下代码片段值得注意：\n\n```\n<aura:component controller=\"RaceSetupComponentController\"\
  \ implements=\"force:lightningQuickActionWithoutHeader, force:hasRecordId\" access=\"\
  global\">\n```\n\n```\n<lightning:input\nvalue=\"{!driver.Selected}\" type=\"checkbox\"\
  \n```\n\n\n\n\n\n```\nchecked=\"{!driver.Selected}\" label=\"{!driver.Name}\" />\n\
  <lightning:button label=\"Cancel\" onclick=\"{!c.onCancel}\"/>\n<lightning:button\
  \ label=\"Add Drivers\"\nonclick=\"{!c.onAddDrivers}\"/>\n```\n\n组件中的以下代码片段值得注意：\n\
  \n- force:lightningQuickActionWithoutHeader 用于指示此组件可在对象定义上创建 **操作** 时使用。当用户调用该操作时，组件将在不带默认标题和取消按钮的弹出窗口中显示，这正是此处所偏好的，因为组件正在呈现其自身按钮。否则，组件将实现\
  \ force:lightningQuickAction。\n\n- c.onCancel 函数发送 force:closeQuickAction 事件以指示容器通过执行以下代码关闭弹出窗口：`$A.get(\"\
  e.force:closeQuickAction\").fire();`\n\n- c.onAddDrivers 函数调用一个 helper 函数。helper\
  \ 函数将驱动程序列表传回服务器。列表包含选定的驱动程序。Lightning 框架会自动保持 lightning:input 组件的选中状态与列表项中绑定的 .Selected\
  \ 属性同步。Apex 控制器调用 RaceService.addDrivers 方法。在收到成功响应后，客户端控制器代码会触发 force:showToast\
  \ 事件（如以下所示）以显示通知，并触发 force:closeQuickAction 事件以关闭弹出窗口：\n\n```\naddDrivers :function(component,\
  \ event ) {\nvar action = component.get(\"c.addDrivers\");\naction.setParam('raceId',\
  \ component.get('v.recordId'));\naction.setParam('driversToAdd',\ncomponent.get('v.drivers'));\n\
  action.setCallback(this, function(response) {\nif(response.getState() === 'SUCCESS')\
  \ {\n// Refresh the view to show the recently added drivers\n$A.get('e.force:refreshView').fire();\n\
  // Display Toast message to confirm drivers\nvar resultsToast = $A.get(\"e.force:showToast\"\
  );\nresultsToast.setParams({\n\"title\": \"Add Drivers\",\n\"message\": \" Added\
  \ \" + response.getReturnValue() +\n\" drivers. \"});\nresultsToast.fire();\n//\
  \ Close the action panel\n$A.get(\"e.force:closeQuickAction\").fire();\n}};\n$A.enqueueAction(action);\n\
  }\n```\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_342_0.png)\n\n> 在上述示例中，使用了文本。最佳实践是使用\
  \ **自定义标签**。在这种情况下，消息文本将类似于 Add {0} drivers。客户端控制器代码将使用 $A.util.format 函数来格式化消息。\n\
  \n## 使组件可自定义\n\n本章中包含的组件将出现在 Lightning App Builder 中，因此开发人员和包的使用者可以将它们拖放到页面上。因为它们是\
  \ `global`，所以也可以在其自身组件代码中使用它们：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_342_1.png)\n\
  \n这是由于以下方面：\n\n- 组件上的 `access` 属性设置为 global。\n- 它们实现适用的 `flexipage` 和 `force` 接口。\n\
  - 虽然不是必需的，但 `.design` 文件指定了组件标签：\n  ```\n  <design:component label=\"Race Calendar\"\
  >\n  </design:component>\n  ```\n- `c:CheckCompliance` 组件的 `.svg` 文件定义了一个自定义图标，该图标显示在\
  \ Lightning App Builder 中的组件旁边。\n- 虽然不是必需的，**赛事结果**组件还包含额外的标记，以向 Lightning App Builder\
  \ 指示该组件仅与 `Race__c` 自定义对象相关：\n  ```\n  <design:component label=\"Race Results\"\
  >\n  <sfdc:objects>\n  <sfdc:object>Race__c</sfdc:object>\n  </sfdc:objects>\n \
  \ </design:component>\n  ```\n\n> 组件还可以声明显示在 Lightning App Builder 设计画布右侧配置面板中的属性。这些属性使用\
  \ `.design` 文件中的 `design:attribute` 元素表示。这些属性必须与组件标记中表达的属性匹配。以这种方式暴露的任何属性也必须具有 global\
  \ 访问级别。\n\n## 与 Lightning Experience 集成\n\n以下屏幕截图突出了组件现已与 Lightning Experience 集成的各个点。这些组件仍可用于我们在本章开头使用的\
  \ Race Overview 独立应用程序，尽管通过 Lightning App Builder，其他接口和事件现在支持更高级的容器。\n\n此屏幕截图显示了主页上的“赛事结果”和“赛事排名”组件，通过工具栏可访问“赛事日历”组件。当用户从“赛事日历”选择赛事时，赛事结果将更新：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_344_0.png)\n\n工具栏是使用 Lightning 页面（在元数据形式中称为\
  \ FlexiPage）定义的。本章的示例代码中包含 /flexipages 文件夹中的一个名为 RaceManagementUtilityBar 的页面。此页面在\
  \ Race Management 应用程序元数据（/apps 文件夹中）中引用。\n\n此屏幕截图显示了**赛事设置**组件，它是用户在 Race 记录页上点击\
  \ **添加驱动程序** 操作后出现的结果。Lightning 组件操作在 **设置** 下的 **Race** 对象定义页的 **操作** 下配置：\n\n\
  ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_345_0.png)\n\n此最终屏幕截图再次显示了**赛事结果**组件，但这次位于\
  \ Race 记录页上。使用 Lightning App Builder 添加了一个名为“赛事结果”的新选项卡，并将“赛事结果”选项卡拖放到其中。这说明组件可以支持\
  \ Lightning Experience 中的多个位置：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_346_0.png)\n\
  \n## 在 Lightning 页面和选项卡上使用组件\n\nLightning 页面（或 FlexiPage）本质上是使用 Lightning App Builder\
  \ 工具从空白页面创建的布局。因此，您或您的客户可以将上述组件及其他任何组件拖放到其中以创建新页面。与 Visualforce 页面不同，它们没有用于访问它们的\
  \ URL。显示 Lightning 页面的唯一方法是为其创建 Lightning 选项卡。这可以在设置菜单下的选项卡中访问。Lightning 选项卡在 Lightning\
  \ Experience 和 Salesforce1 Mobile 中工作。\n\n> 还可以为组件实现 force:appHostable。这允许创建 Lightning\
  \ 组件选项卡。这一历史设施不如使用 Lightning App Builder 构建 Lightning 页面灵活，后者允许用户在页面上放置多个组件。\n\n\
  ## Lightning Out 和 Visualforce\n\n**闪电输出** 是一个 JavaScript 库，可以导入到常规 HTML 页面中，例如\
  \ Visualforce 页面和其他网站或其他容器（如 Google Apps）。导入后，它会公开一个 API，允许页面开发人员实例化 Lightning 组件并将其注入到该页面上的给定\
  \ HTML 元素中。主机页面必须提供 Salesforce Session 或 OAuth 令牌，以便以安全方式实现此操作。\n\n使用 **适用于 Visualforce\
  \ 的闪电输出** 页面的过程通过在页面上使用 `apex:includeLightning` 组件来简化，该组件加载 JavaScript 库并处理身份验证。调用\
  \ `$Lightning.use` 全局方法以开始加载组件到页面的引导过程：\n\n> 在 Visualforce 页面上使用 Lightning 组件确实允许您考虑使用\
  \ Lightning 开发解决方案的新区域，同时仍然为仍然需要它的客户提供 Salesforce Classic 用户体验。\n\n有关配置 Lightning\
  \ Out 的更多信息，请参阅 *Lightning 开发人员指南*（https://developer.salesforce.com/docs/atlas.en-us.lightning.meta/lightning/lightning_out.htm）中的相关部分。\n\
  \n## 与社区集成\n\nLightning Community 是 Lightning 组件的另一个容器；因此，现有组件可能已经足够接近能够在其中和 **闪电社区生成器**\
  \ 工具中存在。最基本的要求是您的组件实现 `forceCommunity:availableForAllPageTypes` 接口。\n\n如前一部分所述，指定组件\
  \ `.design` 文件的相同注意事项也适用，以便组件在 Lightning Community Builder 工具中正确显示，特别是要将组件访问级别设为\
  \ `global`。\n\n还可以通过实现提供自定义主题布局、配置文件标题、搜索和帖子发布者组件以及内容布局的接口的组件来自定义 Lightning Community\
  \ 容器。有关更多详细信息，请查阅 `forceCommunity` 命名空间中的接口。\n\n\n\n\n\n## 测试\n\n编写本文时，Salesforce\
  \ 尚未为 Lightning 组件提供像 Apex 那样的测试框架。Salesforce 尚未官方评论，但很可能他们会在 Force.com 平台的未来版本中包含当前开源项目中存在的\
  \ Aura 测试框架（http://documentation.auraframework.org/test/runner.app）。\n\n同时，我建议您审查现有的浏览器测试工具。\n\
  \n## 更新 FormulaForce 包\n\n与前几章一样，检查所有新组件是否已添加到 FormulaForce 包并上传。由于包含了实用工具栏，该包现在要求在\
  \ orgs 中配置 My Domain 才能完成安装。虽然 My Domain 为客户提供了一些增强的安全性优势，但它确实带来了需要仔细考虑的影响。在对您的包建立此依赖项之前，请先与您的客户群进行咨询。\n\
  \n## 摘要\n\n在本章中，您已了解 Lightning 框架的高级架构，无论是从独立页面的角度，还是将 Lightning 组件集成到 Lightning\
  \ Experience 和 Salesforce1 Mobile 中的角度。\n\nLightning Experience 现在比原始的 Salesforce\
  \ Classic 用户界面更具可扩展性。在决定唯一选择是从零开始构建全新的页面级体验之前，有更多选项需要考虑。在考虑用户体验需求的同时，思考这些集成能力，以及开发人员和\
  \ UX 设计师之间组件思维的一致性，是拥抱这种在 Salesforce 上构建应用程序新方式的关键。\n\n关注点分离和良好的编码实践在客户端层与后端同样重要。同样重要的是监控您的架构，确保业务逻辑的封装和包含。这应仍然牢固地保留在后端，以便不同类型的客户端可以访问它。\n\
  \n最后，很明显 Lightning 正在拥抱 JavaScript 在行业中的持续采用，因此如果您需要提升 JavaScript 技能，现在正是开始的时候！\n\
  \n在下一章中，我们将探讨平台功能、工具和最佳实践，为您的应用程序客户和合作伙伴提供集成机会。\n"
- "# 10 提供集成和可扩展性\n\n企业业务涉及许多人类、设备，日益增加的机器交互，通常分布在全球各地。要让它们以高效且安全的方式协同工作并非易事，因此，通过互联网使用基于云的软件变得如此流行也就不足为奇了。在选择新应用程序时，高级别的安全性、可扩展性和可用性排在检查清单的高位，其后通常是\
  \ API 需求以及定制能力。\n\n通过在 Force.com 平台上开发，您的应用程序已经有了良好的开端。http://trust.salesforce.com/\
  \ 网站提供了广泛的行业级、合规性和加密标准，同样适用于您的应用程序。与此随附的是以 SOAP 和 REST 形式提供的一组标准 API，以及创建您自己的应用程序\
  \ API 的能力。依我看，目前没有比 Force.com 更具备集成就绪能力的云平台了。\n\n在本章中，我们将审查平台标准提供的集成和可扩展性选项，以及您的应用程序如何从中获益最大，此外还将介绍开发自定义应用程序\
  \ API。应用企业模式将再次发挥作用，支持 API 和 UI 具有强功能等效性的需求，通过使用前几章中描述的域层和服务层来实现。\n\n本章将涵盖以下主题：\n\
  \n- 审查集成和可扩展性需求\n- 用于集成的 Force.com 平台 API\n- 应用程序特定 API\n- 与 Force.com 可扩展性功能对齐\n\
  - 使用 Apex 接口扩展应用程序逻辑\n\n### 审查您的集成和可扩展性需求\n\n在深入探讨为集成或扩展您的应用程序的人员提供 API 的不同方式之前，让我们通过开发者\
  \ X 的眼睛来审查这些需求。这是我赋予一个代表您的 API 以及一般集成和可扩展性需求的消费者角色的名称。就像在设计用户界面时一样，我们可以使用角色概念来对\
  \ API 的设计和解释进行合理性检查。\n\n### 定义开发者 X 角色\n\n要求一些人（项目内部和外部人员）代表这个角色是非常值得做的，这让他们能够为您的应用程序\
  \ API 策略的功能和特性提供用例和反馈，因为设计一个您认为合理但其他对应用程序了解较少的人不易理解的 API 实在太容易了。围绕您的 API 开发开发者社区的一个好方法是发布设计以供反馈。为开发者\
  \ X 设计 API 时，请牢记以下几点：\n\n- 如今，开发者 X 精通许多平台和编程语言，这些平台语言不一定总是 Force.com。日益，开发者 X 还在围绕您的\
  \ API 创建移动、JavaScript 和 Heroku 应用程序。\n- 随着**物联网（IoT）**的不断扩展，还出现了从手表、冰箱、汽车和喷气发动机等消费设备向设备集成转变的趋势。因此，既能在平台上又能在平台外良好工作的\
  \ API 是必不可少的。\n- 开发者 X 可能不深入了解应用程序域（其功能概念），因此他们能够与了解这些概念的人进行沟通至关重要，这意味着您的 API 设计和应用程序功能术语必须保持良好对齐。\n\
  \n接下来的章节概述了提供集成 API 和应用程序功能一般可扩展性的一般考虑因素和需求。\n\n### 版本控制\n\n随着您产品功能的增长，管理其对已经在您的应用程序早期版本中采用您的\
  \ API 的开发人员和合作伙伴的影响非常重要，除非必要，否则不要强迫他们进行代码更改。尽可能地，保持向后兼容性，这样即使在订户组织中升级了您的应用程序后，现有的集成和扩展也能继续在不进行修改的情况下工作（订户组织中不存储您的应用程序代码的多个版本）。\n\
  \n如果没有向后兼容性，您可能会在客户群中阻碍应用程序的升级，因为开发者 X 花在解决 API 问题上的时间可能会延迟升级并带来高昂成本。一些订户可能已经使用了咨询服务来完成原始工作，或依赖于您的某个合作伙伴来使用您的\
  \ API 构建附加解决方案。\n\n版本控制分为两类：版本控制定义（或确定数据输入和输出的契约）以及每个 API 所代表的功能（或行为）。\n\n### 版本控制定义\n\
  \n一旦您发布了特定版本的 API，请勿更改其定义，例如自定义对象、字段、Apex 类、方法或成员，或等效的 REST 或 SOAP 构造。尽管平台将帮助避免某些更改，但添加可能被视为破坏性更改，特别是新的必填字段。任何更改\
  \ API 定义或签名的内容都可以被视为潜在的破坏性更改。\n\n开发者 X 应该能够修改和重新部署其现有的集成或扩展，而无需使用您的 API 重新编写或调整其代码，并且不必强迫他们升级到您的\
  \ API 的最新版本，除非，当然，他们希望访问仅通过完成新字段才能访问的新功能。请注意，这与在订户组织中升级包本身不同，后者必须允许发生。\n\n当开发者 X\
  \ 与您的自定义对象和应用程序 API 交互时，标准 Salesforce API 和平台有助于提供版本控制。版本控制的实现方式如下：\n\n- 在 Apex\
  \ 代码上下文中，平台保留开发者 X 首次编写 Apex 代码时安装的包的版本，然后仅确保此打包版本中可见的 Apex 类、方法、成员、自定义对象和字段对该代码可见。我们将在本章后面详细探讨此功能。\n\
  \n\n\n\n在 SOAP 和 REST API 的情况下，默认情况下可见您的自定义对象的最新版本。使用 SOAP API 时，可以在调用中传递标头值以锁定特定的包版本（如有需要，请在\
  \ Apex 开发者指南中搜索 PackageVersionHeader）。或者，这些 API 使用的打包版本可以在组织配置级别设置。\n\n## 通过 Salesforce\
  \ API 对应用程序访问进行版本控制\n\n在设置菜单下，搜索 API。您将找到一个设置页面，允许您下载众多 Salesforce SOAP API 之一的\
  \ WSDL。下一节中有一些版本控制设置，用于确定在与打包对象交互时应假设哪个已安装的包版本。\n\n例如，在通过 Salesforce 企业或合作伙伴 API\
  \ 执行 describeSObject Web 服务操作时，这些 API 将根据添加新字段的时间返回不同的自定义字段，因为包的新版本已随时间发布。默认行为将返回所有字段，因为默认值是当前包版本。\n\
  \n如果在使用这些 Salesforce API 时，这对于开发者 X 或第三方解决方案很重要，订阅管理员可以指定一个明确的早期版本。如果执行此操作，除非更改此设置，否则未来包版本中可用的新字段将不可用。以下屏幕截图显示了如何在设置下的\
  \ API 页面上访问这些设置：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_353_0.png)\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_353_1.png)\n\
  \n## 对 API 功能进行版本控制\n\n通过 UI 向用户提供应用程序的新版本时，用户将访问新功能——要么通过配置使用新页面或按钮加入功能，要么有时只是无缝地访问，例如新类型的计算、优化或对现有行为的改进，并带来附加好处。\n\
  \n由于 API 只是进入应用程序逻辑的另一种方式，您应该从概念上以相同的方式考虑通过 API 启用这些新功能。如果它通过 UI 对用户无缝可用，那么无论 API\
  \ 版本如何，它在 API 中也会变得无缝可用，因此，围绕您的应用程序 API 构建的解决方案也将自动受益，而无需更改集成或扩展代码。但是，如果 UI 中需要新字段或按钮，则需要新的\
  \ API 参数或操作来启用新功能。将此内容公开在 API 定义的新版本中是合理的。因此，开发者 X 将不得不修改现有代码、测试它并部署它，然后解决方案才能利用它。\n\
  \n试图在代码中过于复杂，以向 API 的旧调用者提供完全相同的行为，这将取决于 Service 和 Domain 层是否理解 API 与 UI 上下文以及包版本控制的概念，这将迅速变得复杂，难以开发、测试、支持和记录。\n\
  \n> 与您的客户和合作伙伴明确商定并沟通您将支持多少个 API 版本，并提前警告弃用。始终务必在不同版本下测试您的 API，以确保包中稍后出现但旧调用者未提供的字段缺失不会在这种情况下导致错误或不想要的行为。尽量避免在没有提供默认值的方式的情况下向应用程序添加新的必填字段。\n\
  >\n> 如果在对旧 API 版本进行回归测试时，您注意到由于限制导致数据吞吐量减少，则可以接受有条件地使用较新的逻辑（例如检查较新的字段）。同样，请小心在代码库中频繁植入此类条件逻辑。\n\
  \n## 翻译和本地化\n\n与 Service 层周围的准则类似（稍后在本章中可以将其用作形成应用程序 API 的一种手段），您应确保任何错误或状态消息都根据对自定义标签的使用进行翻译，如第\
  \ 2 章“利用平台功能”中所述（Apex 运行时将确保用户区域设置决定使用的翻译）。\n\n> > 无法通过 Apex 覆盖用于查找适当自定义标签的默认组织语言。但是，如果\
  \ API 从使用第 8 章中所述 language 属性的 Visualforce 页面调用，您的 API 代码也将遵循此设置。\n\n一些 API 公开错误代码，以便以编程方式以语言中立的方式识别某个错误用例（在翻译环境中解析消息文本不可靠）。因此，一种方法是使用\
  \ Apex 枚举和自定义 Apex 异常类，该类同时捕获翻译后的错误消息和异常代码。以下枚举和异常类型定义在本章示例代码包含的 Application 类中。请注意\
  \ Apex 中 global 关键字的使用；本章稍后将更详细地讨论此问题：\n\n```apex\nglobal Application {\n\tenum\
  \ ExceptionCode {\n\t\tComplianceFailure,\n\t\tUnableToVerifyCompliance\n\t}\n}\n\
  \nglobal virtual class ApplicationException extends Exception {\n\tglobal ExceptionCode\
  \ ExceptionCode {get; private set;}\n\n\tpublic ApplicationException(\n\t\tExceptionCode\
  \ exceptionCode, String message) {\n\t\tthis(message);\n\t\tthis.exceptionCode =\
  \ exceptionCode;\n\t}\n}\n```\n\n```apex\nglobal class ComplianceException\n\textends\
  \ Application.ApplicationException {\n\tglobal List<VerifyResult> failures {get;\
  \ private set;}\n\n\tpublic ComplianceException(\n\t\tApplication.ExceptionCode\
  \ exceptionCode,\n\t\tString message, List<VerifyResult> failures) {\n\t\tsuper(exceptionCode,\
  \ message);\n\t\tthis.failures = failures;\n\t}\n}\n```\n\n然后，此代码可以按如下方式引发指定与消息相关的枚举值的异常：\n\
  \n```apex\nthrow new ComplianceException(\n    Application.ExceptionCode.ComplianceFailure,\n\
  \    Label.ComplianceFailuresFound,\n    failedCompliances);\n```\n\n```apex\nthrow\
  \ new ComplianceException(\n    Application.ExceptionCode.UnableToVerifyCompliance,\n\
  \    Label.UnableToVerifyCompliance,\n    null);\n```\n\n与 Service 层准则一样，API 应该与客户端无关，因此您不能假设接受或返回的数据值是否应该格式化。因此，最好为日期、日期/时间和数字使用本机\
  \ Apex 类型，并允许调用者决定是否格式化这些值。返回格式化后的值对 UI 调用者很有用，但对于无头或自动化解决方案，这并不理想。\n\n## 术语和平台对齐\n\
  \n如果在定义类、方法、参数和接口时遵循 Service 层的准则（本章稍后将讨论），那么基于此层的任何 API 应该已经反映应用程序中使用的功能术语。与应用程序术语保持良好的一致性可使您的\
  \ API 更易于映射到应用程序中的功能概念，从而方便开发者 X 导航、理解以及与更深入了解应用程序功能的人员讨论。\n\n此外，与 Service 层一样，您的\
  \ API 应支持批量化等平台问题，不应妨碍开发者 X 以批量化方式调用您的 API，以充分利用平台资源。这还包括开发者 X 使用 Apex DML 语句，因此也凸显了批量化\
  \ Domain 层逻辑和批量化 Service 层逻辑的重要性。\n\n## 您的应用程序的集成需求是什么？\n\n通常，集成需求源于控制进程或应用程序，该进程或应用程序使用您的应用程序的功能，实际上代表用户自动调用应用程序中的功能，或作为事件或计划后台进程的一部分。标准\
  \ Salesforce API 和您创建的任何其他应用程序 API 都可以支持这一需求。以下图示显示了控制系统如何通过标准 Salesforce API 和/或您作为托管包一部分提供的应用程序\
  \ API 来驱动您的应用程序：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_357_0.png)\n\n尽管当所有应用程序都基于同一平台构建时集成要容易得多，但最好制定一项\
  \ API 策略来涵盖开发者 X 的平台上和平台外场景，理想情况下以一致的方式公开相同的功能。\n\n### 开发者 X 在平台上调用您的 API\n\nForce.com\
  \ Apex 开发者可以通过 Apex DML 语句操作应用程序中存储的数据。您可以将 Apex DML 视为通往应用程序数据的免费 Apex API，因为这种方法避免了构建自己的应用程序\
  \ API 来纯粹管理记录数据的需求，特别是对于那些已通过标准 Salesforce UI 公开的自定义对象。\n\n\n\n可以通过 Salesforce Schema\
  \ Builder 浏览自定义对象模式，这对这些开发人员来说是一个有用的辅助工具，就像本书前面所强调的那样。尽量避免字段标签（Field Labels）与字段\
  \ API 名称（Field API names）之间的不一致（尽管 Schema Builder 允许切换这些），因为这会使开发人员和提出需求的人更难以协作。\n\
  \n仅仅因为使用了 Apex，并不意味着开发人员 X（Developer X）可以绕过你托管 Apex 触发器（managed Apex Triggers）中的逻辑。但是，请注意，他们也可以编写自己的\
  \ Apex 触发器，这些触发器可能会在你的触发器之前执行（因为 Apex 触发器的执行顺序是不确定的）。为避免开发人员 X 的触发器对记录数据做出无效更改，请在编写验证逻辑时遵循最佳实践，将其放置在应用程序触发器的\
  \ after 阶段中。如前一章所讨论，使用 Domain 模式将确保这一点。\n\n本章稍后我们将讨论应用程序 API，这些 API 暴露的功能与直接操作自定义对象记录不直接相关，而是更多与业务逻辑相关，例如暴露\
  \ ComplianceService.verify 方法。在这种情况下，通过将 Service 类和方法设为 global 而不是 public，你可以向开发人员\
  \ X 提供相同的方法。作为 Apex API 策略的扩展，允许他们以与你在应用程序中相同的方式使用它。\n\n本章将进一步描述这种方法背后的动机，即确保随着应用程序的发展，最大限度的应用程序功能可通过你的\
  \ API 获得。但是，如果你不希望将完整的 Service 层直接作为应用程序 API 暴露，可以选择创建单独的 Apex 类来定义你的 API，这些类委托给\
  \ Service 层，或者选择性地将 global 关键字应用于你的 Service 方法。\n\n## 开发人员 X 在平台外调用你的 API\n\n开发人员\
  \ X 使用 Java、.NET、NodeJS 或 Ruby 等语言使用 HTTP 协议在两个平台之间进行连接。Salesforce 提供 API 供你登录和授权访问，以及用于操作自定义对象中数据的\
  \ API，其方式类似于使用 Apex DML。Salesforce 目前选择公开其基于 HTTP 的 API 的 SOAP 变体和 REST 变体。因此，同样，你无需为这种类型的数据集成开发自己的\
  \ API。\n\n> 许多第三方 Salesforce 集成应用程序利用平台 API，因此也可以与你的应用程序数据一起工作；这一事实是对你和开发人员 X 的一个关键平台优势。\n\
  \n说到公开应用程序 API，为了支持 SOAP 和 REST，你需要为想要公开的每个 API 分别开发独立的 Apex 类。这是因为这些类型的定义和设计不同，尽管你公开的功能相同。我们将在本章稍后进一步讨论这一点。\n\
  \n### SOAP 与 REST\n\n如果你一直关注 SOAP 与 REST 的辩论，或者简单地在 Google 上搜索一下，你就会知道目前普遍倾向于 REST。因为在移动端和基于\
  \ JavaScript 的场景中更容易编码和使用，大多数主要云服务（如 Facebook 和 LinkedIn）仅提供其 API 的 REST 版本。出于易用性和更具自我描述性的能力，我也更倾向于\
  \ REST。\n\n### 你的应用程序有哪些可扩展性需求？\n\n到目前为止，我们一直在讨论围绕你的应用程序构建自定义解决方案的设施，这是一种集成类型。另一种是提供扩展其现有业务逻辑的方式。在可扩展性用例中，开发人员\
  \ X 或管理员乐于让你的用户直接使用你的应用程序 UI 和功能，但希望以某种方式对其进行扩展，以添加其他功能或对其他自定义对象进行更新。你可能希望考虑的扩展类型示例如下：\n\
  \n- 将订阅者创建的自定义字段添加到 Visualforce 页面和字段集是实现此目的的简单方法\n- 通过电子邮件模板提供硬编码电子邮件消息的替代方案\n\
  - 用订阅者编写的 Apex 逻辑扩展应用程序 Apex 代码逻辑；我称之为 Application Callouts\n\n在本章中，我们将进一步探讨 Application\
  \ Callouts。下图显示了应用程序代码中的进程如何利用这种方法来执行由 *开发人员 X* 编写的 **代码**。本章稍后我们将看到如何通过使用 Apex\
  \ 接口和自定义元数据记录来实现这一点的示例。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_360_0.png)\n\
  \n### 用于集成的 Force.com 平台 API\n\n*第 2 章，利用平台功能*，对那些从 Force.com 平台外部（例如 Java、.NET、PHP\
  \ 和 Ruby 环境）集成到你的应用程序的人可用的众多平台 API 提供了很好的概述。它还提供了最佳实践，以确保你的应用程序以及使用这些 API 的开发人员拥有最佳体验。\n\
  \n如该章所述，这些 API 主要集中在记录数据操作和查询上，通常称为 CRUD。利用 Salesforce API 意味着希望学习如何集成到你的应用程序对象的开发人员可以利用标准\
  \ Salesforce API 文档以及 https://developer.salesforce.com/ 等网站。\n\n尽管 Enterprise API\
  \ 为 Java 或 .NET 开发人员提供了强类型 SOAP API，但其体积较大，加载到开发环境中可能会出现问题（因为它包含组织中存在的所有自定义对象和字段）。因此，更通用的\
  \ Partner API 通常是向开发人员 X 推荐的更好选择。大多数开发人员习惯于通用数据访问层，例如 JDBC 和 ADO，本质上，对他们来说，Partner\
  \ API 类似且更小巧，便于嵌入到他们的应用程序中。但是，如果你要为移动端或 JavaScript 集成推荐 API，Salesforce REST API\
  \ 则更轻量，但开发人员承担了额外的责任，即在没有通过 SOAP API 的 WSDL 提供的生成类类型的帮助下解析和构建正确的 JSON 响应和请求。通常，偏好更强类型编程原则的语言更倾向于\
  \ SOAP 变体而不是 REST 变体。\n\n对于 Java 开发人员，Salesforce 提供了一个出色的 Web 服务连接器（WSC）框架，它提供了一种无需任何其他\
  \ Web 服务堆栈即可使用 SOAP 和 REST API 的高效方式。他们提供了流行的 Partner API 和 Metadata API 的编译版本，网上有大量示例。如果你熟悉它，下载并开始使用此\
  \ API 的最简单方法是使用 Apache Maven（https://mvnrepository.com/artifact/com.force.api/force-wsc）。你也可以从\
  \ https://github.com/forcedotcom/wsc 下载 WSC：\n\n> \"Force.com Web 服务连接器（WSC）是使用流式解析器实现的高性能\
  \ Web 服务客户端堆栈。WSC 还使使用 Force.com API（Web 服务/SOAP 或异步/BULK API）变得容易得多。\"\n\n对于 .NET\
  \ 开发人员，Salesforce 发起了一项开源计划，以构建预编译程序集来提供对其 API 的访问，其精神与前面描述的 WSC Java 库类似。你可以从 https://github.com/developerforce/Force.com-Toolkit-for-NET\
  \ 下载 .NET 工具包：\n\n> \"Force.com .NET 工具包为 .NET 开发人员提供了一种使用本机库与 Force.com 和 Chatter\
  \ REST API 进行交互的简便方法。\"\n\n对于 NodeJS 开发人员，Kevin O'Hara 为社区贡献了一个名为 nforce 的库。你可以从\
  \ https://github.com/kevinohara80/nforce 下载此 NodeJS 工具包：\n\n> \"nforce 是 force.com、database.com\
  \ 和 salesforce.com 的 node.js REST API 包装器。\"\n\n### 应用程序集成 API\n\n本节描述了你可以向外暴露 Service\
  \ 层中封装的应用程序业务逻辑功能的方式。\n\n> 在某些情况下，*开发人员 X* 能够通过标准 Salesforce API 实现此类功能。但是，具体取决于需求，调用一个暴露应用程序中现有业务逻辑的\
  \ API 可能更容易且更安全。你可以出于与创建自定义 UI 而不是期望最终用户仅使用标准 UI 相同的理由决定这样做（因为直接使用你的对象要求他们更详细地了解应用程序对象模式）。\n\
  \n### 提供 Apex 应用程序 API\n\n如果你的 Service 层按照前一章讨论的准则尽可能健壮地开发和测试，那么值得考虑通过简单地更新类、方法、成员、属性以及任何自定义\
  \ Apex 类型（例如 `global`）来将其暴露给 *开发人员 X*。本章这部分更详细地讨论了这种方法，尽管它也可以应用于专门构建用于暴露委托给 Service\
  \ 层类的 API 的独立 Apex 类：\n\n```\nglobal class ComplianceService\n{\n    global static\
  \ void verify(Set<Id> recordIds)\n    {\n\n```\n\n> 请务必谨慎应用 global 修饰符，因为在你的包发布后不容易弃用它。另外，请务必仅将\
  \ `global` 应用于 Service 层的部分，避免暴露 Domain 或 Selector 层类或类型。如果你需要暴露这些类中的行为，请编写一个 Service\
  \ 层方法来实现。还要注意，`ComplianceService.ICompliant` 接口没有应用 global 修饰符，因为这是服务的内部方面。\n\n\
  如前一章所示，我们还将 `global` 修饰符应用于 `ComplianceService` 类中定义的 Apex 异常类。\n\n要试用此新应用程序 API，我们将执行以下步骤并在你的测试开发组织中执行下面介绍的示例\
  \ Apex 测试代码：\n\n- 将本章的示例代码应用到你的打包组织中。\n- 注释掉 `ComplianceService.report` 方法（我们将在执行另一次上传前不久取消注释此方法）。\n\
  \n\n\n\n- 3. 上传包的发布版本，并在测试开发组织中安装它。\n\n- 4. 打开开发者控制台，创建一个名为 ApplicationAPITest 的\
  \ Apex 类。\n\n如果在设置菜单的 Apex 类页面中检查测试开发组织中的 `ComplianceService` 类，您可以看到刚刚公开的新 API\
  \ 方法和类型现在已可见（不显示代码）。这为开发者 X 了解您的 API 提供了一种基本方式，此外还有您提供的任何文档。`ComplianceService`\
