  \ PeaZip for Linux\n\n贯穿本书构建的应用程序的集体源代码可在 main 分支中找到。对于每个章节，都提供了一个分支，其中包含该章节构建过程中添加的代码（基于前一章），例如，分支\
  \ chapter-02 将包含来自 chapter-01 的代码。\n\n本书的仓库可以在 https://github.com/afawcett/forcedotcom-enterprise-architecture\
  \ 处找到。\n\n下载源代码的另一种方法是在浏览器中导航到 www.github.com，使用前一部分中给出的链接，找到你想要下载的仓库和分支（无论是 main\
  \ 分支还是特定章节分支），然后单击右侧边栏中的 Download Zip 按钮。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_30_0.png)\n\
  \n或者，你可以下载上述列出的 GitHub 桌面客户端，并单击 Clone in Desktop 按钮。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_30_1.png)\n\
  \n当然，如果你熟悉 Git，你可以自由选择使用任何工具。\n\n### 部署源代码\n\n为所选章节下载源代码后，你应该运行 Ant 构建脚本将代码部署到你选择的\
