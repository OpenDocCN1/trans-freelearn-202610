- "# Apex 执行与关注点分离\n\n开始编写 Apex 时，很容易想直接从 Apex 触发器或 Apex 控制器类入手，并在其中放置所需逻辑来实现所需功能。本章将探索一种不同的起点，使开发者能够专注于以独立于调用上下文的方式编写应用程序业务逻辑（即应用程序的核心逻辑）。它还将解释这种方式在复用性、代码可维护性和灵活性方面带来的益处，尤其是在将代码应用到平台的不同区域时。\n\
  \n我们将探讨 Apex 代码的调用方式、这些上下文的要求与益处、它们的共同点与差异，以及共享的最佳实践。我们将这些提炼为一种分层的代码编写方式，从一开始就在代码库中教授和嵌入关注点分离（SOC）。我们还将介绍一种命名约定，以帮助代码导航并进一步强制执行\
  \ SOC。\n\n本章结束时，我们将编写一些初始代码，搭建支持 SOC 的框架，并为接下来三章中更详细地探讨一些知名企业应用架构模式奠定基础。最后，我们将对这段代码进行打包，并安装到测试组织中。\n\
  \n本章将涵盖以下主题：\n\n- Apex 执行上下文\n- Apex 限额和命名空间\n- Apex 用于何处？\n- 关注点分离\n- 企业应用架构模式\n\
  - 单元测试与系统测试\n- 打包代码\n\n## 执行上下文\n\n平台上的执行上下文有开始和结束；它由用户或系统动作或事件启动，例如按钮点击或计划后台作业的一部分，通常是短暂的；结束前只有几秒或几分钟，而不是几小时。在多租户架构中尤其重要，因为每个上下文都有自己关于查询、数据库操作、日志和执行时长的一组限制。\n\
  \n在后台作业（**批量 Apex**）的情况下，平台不会为整个作业提供一个执行上下文，而是将正在处理的信息拆分，并以串行方式通过多个执行上下文传回。例如，如果用户要求作业处理\
  \ 1000 条记录，而批次大小（即 Batch Apex 术语中的作用域大小）为 200（这是默认值），则会产生五个不同的执行上下文，一个接一个地执行。这样做是为了让平台能够根据服务当时的负载，对作业的执行进行节流控制，或在需要时在作用域之间暂停它们。\n\
  \n你可能会认为执行上下文是从你的 Apex 代码开始并以它结束，但这是错误的。本章稍后将介绍一些 Apex 代码；我们将使用调试日志来了解平台如何调用 Apex\
  \ 代码。\n\n## 探索执行上下文\n\n对于接下来的两个示例，假设已为 **参赛者** 对象创建了 Apex 触发器，并编写了一个 Apex 类来实现一些逻辑，以便在比赛结束时根据参赛者的名次更新其锦标赛积分。\n\
  \n在第一个示例中，**参赛者** 记录直接从 UI 更新，并捕获了下一个屏幕截图中显示的 **Apex 调试** 日志。\n\n请注意 **执行开始** 和\
  \ **执行结束** 行；它们显示了 Salesforce 服务器上请求的实际开始和结束。**代码单元启动** 行显示了平台调用 Apex 代码的位置。另外，请注意行号显示\
  \ **外部**，表示平台的内部代码调用了 Apex 代码。为简洁起见，屏幕截图中其余的代码执行部分已折叠。\n\n| 文本 | 类别 | 行 |\n|---|---|---|\n\
  | 执行开始 | 执行开始 | |\n| 触发器 | 代码单元启动 | [外部] |\n| flforces.ContestantsTrigger 在参赛者触发器事件\
  \ BeforeUpdate 上针对 [a03b00000006wVph] | 代码单元启动 | [外部] |\n| flforces.ContestantsTrigger\
  \ 在参赛者触发器事件 AfterUpdate 上针对 [a03b00000006wVph] | 代码单元启动 | [外部] |\n| 执行结束 | 执行结束\
  \ | |\n\n在第二个示例中，假设执行了一些 Apex 代码来在比赛结束时计算参赛者的锦标赛积分。在这种情况下，代码是从“执行匿名”提示中执行的（虽然在应用程序中，这将是一个按钮）；同样，捕获了\
  \ Apex 调试日志，如下一个屏幕截图所示。\n\n同样，你可以看到 EXECUTION_STARTED 和 EXECUTION_FINISHED 条目，以及三个\
  \ CODE_UNIT_STARTED 条目：一个用于从“执行匿名”提示中调用的 RaceService.awardChampionshipPoints Apex\
  \ 方法，另外两个用于 Apex 触发器代码。\n\n```\nLog\nText Category Line\nEXECUTION_STARTED EXECUTION_STARTED\n\
  > execute_anonymous_apex CODE_UNIT_STARTED [EXTERNAL]\n< <>entry(Trigger) SYSTEM_CONSTRUCTOR_ENTRY\
  \ [1]\n< RaceService.RaceService() METHOD_ENTRY [1]\n< flforces.RaceService.awardChampionshipPoints(Set<Id>)\
  \ METHOD_ENTRY [1]\n< fl_IdtoOpptyIDMap METHOD_ENTRY [54]\n< SYSTEM_CONSTRUCTOR_ENTRY\
  \ [9]\n< <init>(<VST>Schema.SObjectType>) [9]\n< Aggregations_1.select (...) SOQL_EXECUTE_BEGIN\
  \ [94]\n< QueryLocatorIterator (...) SYSTEM_METHOD_ENTRY [97]\n< flforces.RaceService.awardChampionshipPoints.registerDML(SObjects)\
  \ METHOD_ENTRY [201]\n< flforces.RaceService.$constructDMLWork.registerDML(SObjects)\
  \ METHOD_ENTRY [271]\n< flforces.RaceService.constructDMLWork.commitWork() METHOD_ENTRY\
  \ [281]\n> Savepoint_set SAVEPOINT_SET [156]\n< ... DML_ENTRY [174]\n< ... DML_BEGIN\
  \ [177]\n> flforces.ContestantsTrigger on Contestant trigger event BeforeUpdate\
  \ ... CODE_UNIT_STARTED [EXTERNAL]\n> flforces.ContestantsTrigger on Contestant\
  \ trigger event AfterUpdate ... CODE_UNIT_STARTED [EXTERNAL]\n< CUMULATIVE_LIMIT_USAGE\
  \ CUMULATIVE_LIMIT_USAGE\n< (default) LIMIT_USAGE_FOR_NS NS\n< ... LIMIT_USAGE_FOR_NS\
  \ NS\n< CUMULATIVE_LIMIT_USAGE_END CUMULATIVE_LIMIT_USAGE_END\n< EXECUTION_FINISHED\
  \ EXECUTION_FINISHED\n```\n\n与第一个示例不同的是，如你从“行”列中所见，执行转换显示了正在执行的 Apex 代码行和外部。当在 Apex\
  \ 中执行 DML 语句以更新参赛者记录时，Apex 代码执行会暂停，而平台代码接管以更新记录。在此期间，平台最终会调用 Apex 触发器，执行流程再次回到 Apex\
  \ 代码中。\n\n基本上，执行上下文用于封装对 Salesforce 服务器的请求；它可以是 Apex 代码、验证规则、工作流规则、触发器代码和其他逻辑执行的混合体。平台会为你处理这种整体编排。Salesforce\
  \ **开发者控制台** 工具提供了关于在这些各个区域花费时间的绝佳额外洞察。\n\n| 销售订单 ID | 单元 | 时间线 | 执行单元 |\n|---|---|---|---|\n\
  | 类别 | APEX | 92.17% | 09:56:000 |\n| APEX_CODE | 0.010 | 02.17% | |\n| WF FLOW\
  \ | 0.00 | 00.87% | |\n| FS | -ve | 4.59% | |\n| VALIDATION | 0.00 | 00.06% | |\n\
  | CALL | 0.00 | 00.00% | |\n| VALIDATION | 0.00 | 00.00% | |\n| SYSTEM | 0.00 |\
  \ 00.00% | |\n| SYSTEM | 4.0 | 37.1% | |\n| 行 | --- | --- | --- |\n| | | | |\n|\
  \ | | | |\n| | | | |\n\n如果订阅组织已向你的对象添加了 Apex 触发器，则它们在同一个执行上下文中执行。如果这些 Apex 代码单元中的任何一个抛出未处理的异常，则整个执行上下文将停止，并回滚已执行的所有数据库更新，本章稍后将更详细地讨论这一点。\n\
  \n## 执行上下文和状态\n\n执行上下文中创建的 Apex 变量所使用的服务器内存存储可以被视为执行上下文的状态；在 Apex 中，这称为 **堆**。总体而言，用于维护执行上下文状态的服务器内存资源在结束时会被释放；因此，在具有短暂执行上下文的系统中，资源可以得到更好的管理。通过使用\
  \ CPU 和堆限额，平台强制执行执行上下文的最大持续时间和 Apex 堆大小，以确保服务的平稳运行；这些内容将在本章稍后更详细地描述。\n\n**状态管理**\
  \ 是编程实践，用于管理用户或作业在执行工作过程中（例如基于向导的 UI 或汇总信息的作业）调用的独立执行上下文（对服务器的请求）之间所需的信息。当然，用户并不真正理解执行上下文和状态；他们通过用户界面查看任务，或根据他们提供的字段输入和条件启动作业。并不总是需要考虑状态管理，因为某些用户任务可以在一个执行上下文中完成；从架构角度来看，这通常更可取，因为管理状态存在开销。虽然平台提供了一些有助于状态管理的功能，但使用它们需要仔细考虑和规划，尤其是从数据量角度来看。\n\
  \n\n\n\n\n在其他编程平台（例如 Java 或 Microsoft .NET）中，静态变量用于跨执行上下文维护状态，通常缓存信息以减少后续执行上下文的处理，或存储常见的应用程序配置。Apex\
  \ 中 `static` 关键字的实现方式不同；其作用域仅适用于当前执行上下文，不再延伸。因此，Apex 静态变量的值在执行上下文之间不会被保留，尽管它们在多个\
  \ Apex 代码单元之间被保留（如上一节所示）。因此，在递归 Apex Trigger 场景中，允许共享静态变量以控制递归。\n\n> Custom Settings\
  \ 可能在 Apex 中提供一种潜在的替代方案，而其他编程语言使用静态变量来存储或缓存某些应用程序信息。此类信息可以配置为 org、用户或 profile 作用域，并且从\
  \ Apex 读取的成本很低。但是，如果您需要缓存可能具有一定生命周期或过期时间的信息，例如用户会话或跨多个用户的信息，则可能需要考虑 Platform Cache。Platform\
  \ Cache 还为您的客户在购买额外存储方面提供了更大的灵活性（Custom Settings 每个包限制为 10 MB）。\n\n## 平台缓存\n\n缓存信息并非新概念，在许多其他平台上都可用，例如\
  \ **MemCache** 是一个流行的开源框架，用于提供缓存设施。考虑缓存的主要动机是性能。\n\n如前所述，状态在请求之间不会被保留。您可能会发现常见信息需要不断查询或计算。如果此类信息更改的可能性较低，可以考虑使用缓存以获得性能优势。从\
  \ Apex 执行（CPU Governor）和/或数据库查询（SOQL 和 Row Governors）的成本必须低于从缓存中检索它的成本。\n\n> Salesforce\
  \ 建议使用 `System.currentTimeMillis` 方法在代码和/或查询周围输出调试语句，以确定潜在的收益。不要依赖调试日志时间戳。\n\nPlatform\
  \ Cache 允许您在请求范围之外保留状态，org 级缓存最长可达 48 小时，会话级缓存最长可达 8 小时。会话级缓存仅适用于交互式上下文，在异步 Apex\
  \ 中不可用。如果用户更改了缓存信息所依赖的信息，您的代码可以在这些过期时间之前清除缓存信息。Apex 在 `Cache` 命名空间下提供 API，用于从任一缓存中存储（putting）、检索（getting）和清除信息。还有一个\
  \ `$Cache` 变量，可用于在 Visualforce 页面中从会话缓存检索信息。不幸的是，在撰写本文时，Lightning 组件标记目前没有 `$Cache`\
  \ 访问，因此必须使用 Apex 控制器。\n\n> 您可以在用户详细信息页面上启用缓存诊断。启用后，您可以单击缓存分区旁边的 **诊断** 链接（本节稍后将详细介绍）。这将提供有关缓存中条目大小及其使用频率的有用信息。在测试期间这可能很有用。Salesforce\
  \ 建议谨慎使用此页面，因为生成信息的代价很高。\n\n仔细考虑放入缓存中的信息的生命周期。一旦放入，其整个要点就是尽可能长时间地保留在缓存中，因此大多数时候都能获得性能优势。如果您不断更改它或清除缓存，收益将会降低。同样，如果您没有正确考虑应用程序中需要使缓存失效（清除）的位置，信息可能会变得过时和陈旧。此考量可能变得相当复杂，具体取决于您在缓存中存储的内容，例如，如果信息是涉及多个记录和对象的计算结果。\n\
  \n> 陈旧的缓存信息可能会影响您的验证和用户体验，如果不仔细考虑，还可能导致数据完整性问题。如果您正在将信息存储在多个用户的 org 级缓存中，请确保您没有间接地暴露其他用户无法通过其共享规则、对象或字段级安全性访问的信息。\n\
  \n可用缓存的数量取决于客户的 org 类型，Enterprise Edition org 目前默认获得 10 MB，而 Unlimited 和 Performance\
  \ Edition org 获得 30 MB。您无法打包存储，但客户可以购买更多。要在 Developer Edition org 中测试平台缓存的优势，可以从\
  \ **设置** 下的 **平台缓存** 页面向 Salesforce 申请试用分配。Salesforce 使用 **最近最少使用 (LRU)** 算法来管理缓存项目。\n\
  \n可用缓存的数量可以分区（拆分），类似于硬盘上的存储分区。这允许管理员保证分配的一部分仅用于特定应用程序，并在需要时根据性能需求进行调整。作为包开发者，您可以按名称动态引用本地分区（由管理员创建）。您还可以打包一个分区名，供您的应用程序独占使用，并在代码中引用它。这确保在管理员在您的包安装后分配给您的分区的任何分配都保证由您的应用程序使用。例如，如果您的代码共享一个分区，您可能不希望其他应用程序不断将您的缓存条目挤出去。\n\
  \n> 打包的分区不能被客户 org 中的其他代码或其他包访问，只能由相应包命名空间中的代码访问。您可能希望通过自定义设置为管理员提供选项，以配置您的应用程序引用本地分区，或许允许管理员在应用程序之间汇总用量。在向缓存添加条目时，请考虑使用\
  \ Cache.Visibility.NAMESPACE 枚举，以避免包外的代码访问条目。这可能是一个重要的安全考量，具体取决于您正在缓存的内容。\n\n> Salesforce\
  \ 本身在内部使用 MemCache 来管理平台。平台缓存可能是一个封装器，将这些内部部分暴露给 Apex 开发者。请参阅博文“Salesforce 架构 -\
  \ 他们每天如何处理 13 亿笔交易”，网址为 http://highscalability.com/blog/2013/9/23/salesforce-architecture-how-they-handle-13-billion-transacti.html\n\
  \nSalesforce Apex 开发者指南包含一个平台缓存子部分，进一步详细介绍了本节涵盖的主题，包括更多最佳实践和使用指南。您可以参考该指南：https://developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_cache_namespace_overview.htm。\n\
  \n## 执行上下文和安全性\n\n如上一章所述，平台提供安全功能，允许订阅者或管理员管理您的对象上的 CRUD 操作以及单个字段级安全性 (FLS)，理想情况下是通过分配您在包中包含的一些经过仔细考虑的权限集来实现，此外还提供定义共享规则的功能，以控制记录可见性和编辑。\n\
  \n在 Apex 执行上下文中，了解由谁（平台还是开发者）负责强制执行这些安全功能非常重要。关于共享规则，存在一个默认的安全上下文，它要么由平台设置，要么可以使用\
  \ Apex 代码中的特定关键字来指定。以下项目符号详细描述了这两种安全类型：\n\n- **共享安全性**：在应用于 Apex 类声明时，通过使用 `with\
  \ sharing` 关键字，Apex 运行时提供支持，自动筛选出不满足当前用户上下文共享规则的 SOQL 查询返回的记录。如果未指定，则此设置将继承自控制执行的最外层\
  \ Apex 类。相反，可以使用 `without sharing` 关键字来明确启用返回所有满足查询的记录，而不考虑共享规则。在实施参照完整性时，这很有用，例如，代码需要查看所有可用记录，而不考虑当前用户的共享规则。\n\
  \n- **CRUD 和 FLS 安全性**：如上一章所述，Apex 开发者有责任使用适当的编程方法来强制执行此类安全性。在 Visualforce 页面中，CRUD\
  \ 和 FLS 仅通过使用适当的 Visualforce 组件（例如 `apex:inputField` 和 `apex:outputField`）来强制执行。执行上下文中的\
  \ Apex 代码在 CRUD 和 FLS 可访问性方面以系统模式运行，这意味着，除非您的代码检查允许的访问权限，否则平台将始终允许访问。请注意，这与是否使用\
  \ `with sharing` 关键字无关，该关键字仅影响对您的代码可见的记录。\n\n总之，两者分别单独控制和实现，如下所示：\n\n- 行级安全性仅适用于\
  \ `with sharing` 的使用\n- CRUD 安全性和 FLS 需要单独的编码考量\n\n在本书的后续章节中，我们将看到一些放置此逻辑的位置，以使其更易于管理，并对其余代码的侵入性更小。\n\
  \n## 执行上下文事务管理\n\n在 Apex 中处理数据库事务比其他平台更简单。默认情况下，事务范围涵盖整个执行上下文。这意味着，如果执行上下文成功完成，任何记录数据都将提交。如果发生未处理的异常或错误，执行上下文将中止，所有记录数据都将回滚。\n\
  \n\n\n\n\n未处理的 Apex 异常、调控器异常或验证规则可能导致执行上下文中止。但是，在某些情况下，仅执行部分回滚可能是可取的。对于这些情况，平台提供了\
  \ **保存点**，可用于在执行上下文中放置标记，以记录在创建保存点时写入了哪些数据。之后，保存点可在执行中用作回滚位置，以响应错误处理或导致替代代码路径并导致数据库不同更新的条件，从而恢复进一步处理。\n\
  \n> 需要注意的是，使用 Apex `try` 和 `catch` 关键字捕获异常（例如，在 Visualforce 控制器方法中）会导致平台提交异常发生前写入的任何数据。这可能导致执行上下文中正在更新的对象之间出现部分更新的数据，从而给您的应用程序带来数据完整性问题。保存点可以通过在\
  \ `catch` 代码块中使用回滚来避免这种情况。但是，每次这样做对开发人员来说都会带来相当大的样板代码开销。本书后面将更详细地审查此做法，并介绍一种称为 **工作单元**\
  \ 的模式，以帮助自动化此过程。\n\n## Apex 调控器和命名空间\n\n平台调控器防止任何单个执行上下文在服务上消耗过多资源，这可能对其用户有害。总体而言，执行上下文不能超过\
  \ 10 分钟，尽管在实践中，在执行上下文内，其他限制可能会在此之前达到。\n\n例如，在执行上下文中执行的 Apex 代码单元只能总共执行最多 10 或 60\
  \ 秒，具体取决于上下文。多年来，Salesforce 一直致力于整合曾经令人困惑的一系列调控器，这些调控器也因多种 Apex 代码上下文而异。幸运的是，如今调控器更容易遵循，并且仅根据上下文是交互式还是批处理（异步）而有所不同。\n\
  \n## 命名空间和调控器作用域\n\n对于打包解决方案，一个重要的考虑因素是调控器的作用域。换句话说，它是仅适用于打包代码，还是适用于在执行上下文中执行的所有代码？请记住，执行上下文可能包含订户组织中其他开发者或其他安装的打包解决方案的代码。\n\
  \n您的包命名空间充当一些调控器的容器，保护您的代码免受执行上下文中运行的其他打包代码（例如触发器）消耗限制。平台支持在一个执行上下文中拥有无限数量的命名空间作用域。对于未作为托管包一部分部署的代码（例如直接在订户组织中开发的代码），有一个默认命名空间。\n\
  \n在命名空间中运行的代码不能超过由命名空间限定的调控器（本章后面将重点介绍）。虽然执行上下文可以运行来自无限数量命名空间的代码，但会强制执行跨命名空间累积限制。这是每个命名空间特定限制的\
  \ 11 倍。例如，在任何数量的命名空间中最多允许 1650 条 DML 语句（每个命名空间 150 条）。更多示例请参阅 Apex 开发者指南中“Execution\
  \ Governors and Limits”页面下名为“Per-Transaction Certified Manage Package Limits”的子部分。\n\
  \n> 实际上，在我看来，150 对于单个命名空间来说是一个相当大的 DML 数量。如果您正在观察批量化，这将需要您在一个请求中更新 150 个不同的对象！如果是这种情况并且您正在遵循\
  \ DML 批量化，您可能需要审查对象模型设计，看看是否可以进一步反规范化。虽然未记录，但我怀疑 11 的累积乘数可能基于历史上 10 个命名空间限制加上默认命名空间。\n\
  \n当您在打包组织中观察调试日志时，可以看到命名空间发挥作用的证据。在每个 Apex 代码单元完成之前，请注意调试日志的 LIMIT_USAGE_FOR_NS\
  \ 部分针对默认和 force 命名空间（您的命名空间将不同）重复出现，如下所示，允许您在整个执行上下文中审查调控器的增量用法：\n\n```\n13:47:43.712\
  \ (412396000)|CUMULATIVE_LIMIT_USAGE\n13:47:43.712|LIMIT_USAGE_FOR_NS|(default)|\n\
  Number of SOQL queries: 0 out of 100\nNumber of query rows: 0 out of 50000\nNumber\
  \ of SOSL queries: 0 out of 20\nNumber of DML statements: 0 out of 150\nNumber of\
  \ DML rows: 0 out of 10000\nNumber of code statements: 0 out of 200000\nMaximum\
  \ CPU time: 0 out of 10000\nMaximum heap size: 0 out of 6000000\nNumber of callouts:\
  \ 0 out of 10\nNumber of Email Invocations: 0 out of 10\nNumber of fields describes:\
  \ 0 out of 100\nNumber of record type describes: 0 out of 100\nNumber of child relationships\
  \ describes: 0 out of 100\nNumber of picklist describes: 0 out of 100\nNumber of\
  \ future calls: 0 out of 10\n13:47:43.712|LIMIT_USAGE_FOR_NS|force|\nNumber of SOQL\
  \ queries: 1 out of 100\nNumber of query rows: 1 out of 50000\nNumber of SOSL queries:\
  \ 0 out of 20\nNumber of DML statements: 2 out of 150\nNumber of DML rows: 3 out\
  \ of 10000\nNumber of code statements: 85 out of 200000\nMaximum CPU time: 0 out\
  \ of 10000\nMaximum heap size: 0 out of 6000000\nNumber of callouts: 0 out of 10\n\
  Number of Email Invocations: 0 out of 10\nNumber of fields describes: 0 out of 100\n\
  Number of record type describes: 0 out of 100\nNumber of child relationships describes:\
  \ 0 out of 100\nNumber of picklist describes: 0 out of 100\nNumber of future calls:\
  \ 0 out of 10\n13:47:43.712|CUMULATIVE_LIMIT_USAGE_END\n13:47:43.412|CODE_UNIT_FINISHED|execute_anonymous_apex\n\
  ```\n\n请注意，无论作用域如何，汇总中都会显示所有调控器；例如，CPU 时间调控器是执行作用域调控器。这使您可以跟踪来自所有命名空间的 Apex 代码单元中\
  \ Apex CPU 时间的消耗情况。开发者控制台选项提供了一些出色的工具来分析调控器的消耗情况。\n\n## 确定性和非确定性调控器\n\n从测试和支持的角度考虑调控器时，您应该了解哪些调控器是确定性的，哪些不是。例如，在分析您的应用程序时，这是指能够从反复运行完全相同的测试的调试日志中获得完全相同的结果（例如前面的结果）。以下列出了两种类型调控器的示例：\n\
  \n- 确定性调控器的示例是 SOQL 和 DML 调控器。如果您重复相同的测试场景（在您的开发或打包组织中），您始终会得到相同的数据库查询和更新使用情况；因此，您可以可靠地确定这些方面的任何变化是否需要调查。\n\
  \n- 非确定性调控器的示例是 CPU 时间调控器。每次执行之间使用的时间量将根据 Salesforce 服务器在任何给定时间的负载而有所不同。因此，难以准确确定您的应用程序中的更改是否真的影响了这一点。话虽如此，它可以作为一个有用的指标，具体取决于您在软件构建之间看到的差异。但是，请记住，您捕获的基线信息会随着时间的推移变得越来越不准确，例如，在平台发布之间。\n\
  \n在 CPU 调控器中，平台将执行上下文允许花费在执行 Apex 代码上的时间限制为交互式上下文 10 秒，异步上下文 60 秒（例如，Batch Apex），尽管在实践中，平台似乎表现出一定的容忍度。相比之下，应用于一致测试场景时，SOQL\
  \ 查询数或 DML 语句数始终是恒定的。\n\n由于 CPU 调控器是非确定性的，测试时只应将其用作准则。我的建议是不要将 `Limits.getCPUlimit()`\
  \ 方法用作应用程序中交互式和批处理处理之间的分支机制。如果您需要这种类型的分支，请专注于使用应用程序的某些方面，例如选择条件、选定的行数或订户组织中的某些其他可配置设置（可能通过自定义设置）。\n\
  \n您可能希望考虑在 Apex 测试上下文中测试某些调控器，以监控查询或 DML 消耗量的变化。此类测试可以为您提供效率低下已悄悄进入代码的早期警告。使用 `Limits`\
  \ 类方法来捕获 SOQL 和/或 DML 调控器的前后状态。然后，应用预期使用情况的严格比较（例如，测试执行后预期 10 个查询）或加减容差以允许代码演进。\n\
  \n## Apex 包开发人员的关键调控器\n\n下表是关键调控器、其作用域及其是否为确定性的摘要。请注意，Salesforce 不断监控其服务的使用情况并调整其调控器。请始终查看\
  \ *Apex 开发者指南* 中有关调控器的最新信息。\n\n| 调控器 | 作用域 | 确定性 |\n|---|---|---|\n| 执行上下文超时 | 执行上下文\
  \ | 否 |\n| Apex CPU 调控器 | 执行上下文 | 否 |\n| SOQL 查询 | 命名空间 | 是 |\n| DML 语句 | 命名空间 |\
  \ 是 |\n| 查询行数 | 命名空间 | 是 |\n\n\n\n\n\n## Apex 在哪里使用？\n\n下表列出了 Apex 代码可运行的执行上下文类型，以及与安全性和状态管理相关的注意事项。虽然实现每种上下文的方法超出了本书的范围，但某些方面（例如批处理\
  \ Apex）将在后续章节中讨论数据量时进行更详细的介绍。\n\n| 执行上下文 | 安全性 | 状态管理 |\n|---|---|---|\n| 匿名 Apex\
