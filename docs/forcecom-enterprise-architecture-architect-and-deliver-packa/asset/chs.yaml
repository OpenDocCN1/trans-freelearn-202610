  \ 元数据 11\n\n42011272R00281\n\n美国制造\n\n特拉华州米德尔顿\n\n2019 年 4 月 11 日\n\n## Force.com\
  \ 企业架构 – 第二版\n\n各种规模的公司都已经意识到需要采用 Force.com 的架构策略，该策略专注于实现其业务目标。成功的企业应用程序需要规划、承诺，并在可用的最佳工具、流程和功能方面进行投资。\n\
  \n本书将教你如何通过 Salesforce 为企业客户架构和支持持久的应用程序，方法是探索如何识别架构需求并基于行业标准模式设计解决方案。在 Force.com\
  \ 上构建解决方案有多种方法，本书将引导你走一条逻辑路径，并展示从头到尾构建打包解决方案所需的步骤和注意事项。它涵盖了所有方面，从工程到将你的应用交到客户手中，并确保他们从你的\
  \ Force.com 应用中获得尽可能大的价值。你将熟悉如何使用自己的应用逻辑扩展 Lightning App Builder、Process Builder\
  \ 和 Flow 等工具。除了构建自己的应用 API 之外，你还将学习在桌面和移动平台上利用最新 Lightning 技术所需的技术。\n\n## 你将学到：\n\
  \n- 打包、安装、测试和升级应用程序\n- 定义与架构相一致的数据存储和功能需求\n- 开发易于导航、自文档化、可测试、健壮且有机的 Apex 代码\n- 利用你的应用程序与客户端无关的服务层骨干来支持众多平台领域\n\
  - 在 Lightning Experience 和 Salesforce Mobile 客户端中托管你的应用程序以获得最大收益\n- 应用查询、索引和异步最佳实践\n\
  - 在你的 Apex 测试中利用模拟和依赖注入\n- 探索开发高级应用程序的技巧\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_511_0.png)\n\
  \nwww.packt.com\n\n"
