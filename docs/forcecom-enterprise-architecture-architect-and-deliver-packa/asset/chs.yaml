  \n<< 返回 Apex 类: ApplicationAPITest\n\n当一个组件引用另一个组件、权限或下方项目时，就会创建依赖关系。此外，对象级操作范围（即数据操作）也已列出。要查看操作范围的字段级详细信息，请单击对象名称旁边的字段。\n\
