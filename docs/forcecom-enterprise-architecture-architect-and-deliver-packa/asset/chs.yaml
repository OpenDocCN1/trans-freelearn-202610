  \ Errata 部分下。\n\n## 盗版\n\n互联网上受版权保护材料的盗版是跨所有媒体的持续问题。在 Packt，我们非常认真地对待我们的版权和许可的保护。如果你在互联网上以任何形式发现我们的非法副本，请立即向我们提供位置地址或网站名称，以便我们可以寻求补救。\n\
