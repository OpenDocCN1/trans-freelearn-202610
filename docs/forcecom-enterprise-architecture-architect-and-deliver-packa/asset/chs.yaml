  \ **字段可管理性** 复选框的效果。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_132_0.png)\n\n\
  显示的 **命名空间前缀** 值将与您的不同。\n\n尝试在打包组织中更改或添加 **Track Lap Time** 记录，例如更新现有记录上的圈速时间。再次上传包，然后升级您的测试组织。您将看到记录会自动更新。相反，您在测试组织中创建的任何记录将在升级之间保留。\n\
  \n本章，我们现已介绍了平台的一些主要方面，涉及打包、平台对齐以及应用程序数据的存储方式，以及应用程序架构的关键方面。本章使用了自定义元数据来阐释配置数据的用例。本书将在即将到来的章节中进一步介绍此灵活平台功能的更多用例。\n\
  \n在本书的接下来几章中，我们将开始探讨 **企业编码模式** 以及有效地设计您的应用程序代码，使其与平台功能协同工作，并随着您的需求和平台一起增长。\n\n\n\
