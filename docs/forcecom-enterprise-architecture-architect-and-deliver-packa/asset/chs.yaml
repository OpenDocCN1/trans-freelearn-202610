- "# 构建、发布和支持您的应用程序\n\n将想法变为现实的关键在于执行。从构想一个想法到将其实现为应用程序并交到用户手中，是一段激动人心的旅程，也是一段在您与用户之间不断发展和演变的旅程。在Force.com上开发的一大好处是，在生产流程的核心工程阶段之外，您可以获得平台的支持。\n\
  \n在本章中，我们将使用平台的声明式方面快速构建一个应用程序的初始版本，我们将在本书中一直使用该应用程序，这将使您有机会亲身体验一些将应用程序发布给订阅者所需的打包和安装功能。我们还将了解通过Salesforce\
  \ AppExchange（相当于Apple的App Store）发布应用程序的可用设施，最后提供最终用户支持。\n\n我们将把此应用程序作为基础，在本书的各章中逐步发布新版本的应用程序，在我们对企业应用程序开发的理解基础上构建。以下主题概述了我们将在本章中完成的内容：\n\
  \n- 所需组织\n- 介绍本书的示例应用程序\n- 包类型和优势\n- 创建您的第一个托管包\n- 包依赖项和上传\n- AppExchange简介和创建列表\n\
  - 安装和测试您的包\n- 成为Salesforce合作伙伴及其优势\n- 许可\n- 支持您的应用程序\n- 客户指标\n- Trialforce和Test\
  \ Drive\n\n## 所需组织\n\n开发、打包和测试您的应用程序需要多个Salesforce组织。您可以在https://developer.salesforce.com/注册这些组织。不过，随着时间的推移，当您与Salesforce的关系变得更加正式时，您将有机会访问其**合作伙伴门户**网站来创建不同类型和功能的组织。我们将在稍后更详细地讨论这一点。\n\
  \n最好采用某种命名约定来跟踪不同的组织和登录。请使用以下表格作为指南，并通过https://developer.salesforce.com/创建以下组织。如前所述，这些组织将仅用于本书中的学习和探索：\n\
  \n| 用户名 | 用途 | 目的 |\n|---|---|---|\n| myapp@packaging.my.com | 打包 | 虽然我们将在此组织中执行初始工作，但它最终将仅用于组装和上传发布版本。\
  \ |\n| myapp@testing.my.com | 测试 | 在此组织中，我们将安装应用程序并测试升级。在实际操作中，您可以通过本章稍后描述的Partner\
  \ Portal网站创建多个此类组织。 |\n| myapp@dev.my.com | 开发 | 在后续章节中，我们将把应用程序的开发转移到此组织中，让打包组织专注于打包。\
  \ |\n\n> 您需要将myapp和my.com（或许可以复用您的公司域名以避免命名冲突）替换为您自己的值。您应该花时间熟悉andyapp@packaging.andyinthecloud.com。\n\
  \n以下是您最终需要的其他组织类型，以便管理应用程序的发布和许可。然而，它们对于完成本书中的章节并非必需：\n\n| 用途 | 目的 |\n|---|---|\n\
  | 生产/CRM组织 | 您的组织可能已经在使用此组织来管理联系人、线索、机会、案例和其他CRM对象。请确保您拥有对此组织进行更改（如果有）的完整权限，因为这是您开展业务的地方。如果您没有此类组织，可以通过本章稍后描述的合作伙伴计划网站请求一个（通过创建案例）CRM\
  \ ISV组织。即使您选择不完全采用Salesforce来处理业务的这一部分，在利用平台的许可方面时，仍需要此类组织。 |\n| AppExchange发布组织（APO）\
  \ | 此组织用于管理您对AppExchange的使用。我们将在本章稍后讨论此问题。此组织实际上就是您指定为生产组织的同一Salesforce组织，也是您开展销售和支持活动的地方。\
  \ |\n| 许可管理组织（LMO） | 在此组织中，您可以跟踪谁安装了您的应用程序（作为线索）、您授予他们的许可证以及许可时长。建议此组织与前面描述的APO相同。\
  \ |\n| Trialforce管理组织（TMO）和Trialforce源组织（TSO） | Trialforce是一种向组织提供预配置应用程序数据的方式，以便潜在客户在购买前试用您的应用程序。这将在本章稍后讨论。\
  \ |\n\n通常，LMO和APO可以与您的主Salesforce生产组织相同，这样可以让您在同一位置跟踪所有线索和未来的机会。这导致APO = LMO = 生产组织的规则。尽管两者都不应该是您的实际开发或测试组织，但您可以与Salesforce支持和您的Salesforce客户经理合作，规划和分配这些组织。\n\
  \n## 介绍本书的示例应用程序\n\n对于本书，我们将使用**一级方程式（Formula 1）**赛车领域作为基础，来构建我们将共同打造的打包应用程序。对我来说，一级方程式相当于企业应用程序软件，因为它的规模和复杂性。这也是我关注的一项运动。我对这两个领域的知识在构建我们将使用的示例时帮助很大。\n\
  \n在本书中，我们将把我们的应用程序称为**FormulaForce**，不过请牢记Salesforce的品牌政策，在为您自己的应用程序命名时，因为它们禁止在公司或产品标题中使用\"\
  Force\"一词。\n\n此应用程序将专注于赛事、车手及其众多统计数据的数据收集方面，利用平台功能在历史和当前环境中对这些数据进行结构化、可视化和处理。\n\n\
  在本章中，我们将按照以下表格详细说明创建一些初始**自定义对象**和字段。暂时无需担心创建任何自定义标签。您可以使用自己偏好的方法创建这些初始对象。请确保您已登录到您的**打包组织**（本书后续章节将使用开发组织）。\n\
  \n| 对象 | 字段名称和类型 |\n| :--- | :--- |\n| Season__c | Name（文本） |\n| Race__c | Name（文本）<br>Season（与Season的主从详细信息查找）\
  \ |\n| Driver__c | Name（文本） |\n| Contestant__c | Name（自动编号CONTEST-{00000000}）<br>Race（与Race的主从详细信息查找）<br>Driver（与Driver的查找）\
  \ |\n\n以下截图显示了可在**设置**菜单下使用的Schema Builder工具中的上述对象：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_38_0.png)\n\
  \n## 包类型和优势\n\n**包**是一个容器，用于存放您的应用程序组件，例如自定义对象、Apex代码、Apex触发器、Visualforce页面、Lightning组件等等。这些组件构成了您的应用程序。虽然还有其他方法可以在Salesforce组织之间移动组件，但包提供了一个容器，您可以用它来容纳整个应用程序，或通过利用所谓的**扩展包**来提供可选功能。\n\
  \n包有两种类型——**托管包**和**非托管包**。非托管包会导致组件从一个组织转移到另一个组织；然而，结果就好像这些组件最初是在目标组织中创建的一样，这意味着该组织的管理员可以随意修改甚至删除它们。此外，它们不可升级，并且从支持角度来看并不特别理想。而且，您编写的Apex代码对所有人都可见，因此您的知识产权面临风险。\n\
  \n\n\n\n\n未托管的包可用于共享旨在由订阅者更改的模板组件。如果您没有使用 GitHub 和 GitHub Salesforce 部署工具（https://github.com/afawcett/githubsfdeploy），它们也可为开发者提供一种共享开源库的手段。\n\
  \n## 托管包的功能与优势\n\n本书仅关注托管包。托管包具有以下功能，非常适合分发您的应用程序。安装您应用程序包的组织称为**订阅者组织**，因为该组织的用户正在订阅您的应用程序所提供的服务：\n\
  \n- **知识产权（IP）保护：**订阅者组织中的用户无法查看您的 Apex 源代码，尽管他们可以查看您的 Visualforce 页面代码和静态资源。虽然\
  \ Apex 代码是隐藏的，但 JavaScript 代码不是，因此您可以考虑使用压缩过程来部分隐藏此类代码。\n\n- **命名空间范围：**您的组件名称在整个命名空间使用过程中对您的包是唯一的。这意味着，即使您的应用程序中有对象\
  \ X，而订阅者有同名的对象，它们仍然是不同的。您将在本章后面定义命名空间。\n\n- **总督范围：**您的应用程序中的代码在其自身的总督限制范围内执行（例如，需通过\
  \ Salesforce 安全审查的 DML 和 SOQL 总督），且不受订阅者组织中其他应用程序或代码的影响。请注意，某些总督（如 CPU 时间总督）由整个执行上下文共享（将在后续章节中讨论），无论命名空间如何。\n\
  \n- **升级与版本控制：**一旦订阅者开始使用您的应用程序、创建数据、进行配置等等，您将希望提供带有新版本的应用程序的升级和补丁。\n\n托管包还有其他优势，但这些优势只有在成为\
  \ Salesforce 合作伙伴并完成安全审查流程后才能访问；这些优势将在本章后面描述。Salesforce 提供了 ISVforce Guide（也称为 Packaging\
  \ Guide），其中深入讨论了这些主题——请立即收藏！ISVforce Guide 可在 http://login.salesforce.com/help/pdfs/en/salesforce_packaging_guide.pdf\
  \ 上找到。\n\n## 创建您的第一个托管包\n\n包在您的打包组织中创建。您的打包组织中只能有一个正在开发的托管包（虽然支持其他未托管的包，但不建议将打包组织与它们混用）。您还可以安装其他依赖的托管包，并从您的应用程序中引用它们的组件。要执行的步骤将在以下部分中讨论：\n\
  \n- 设置您的包命名空间\n- 创建包并将其分配给命名空间\n- 将组件添加到包中\n\n## 设置您的包命名空间\n\n创建托管包时的一个重要决策是命名空间；这是应用于您所有组件（自定义对象、Visualforce\
  \ 页面、Lightning 组件等）的前缀，订阅者组织中的开发人员使用它来唯一地区分您的打包组件和其他组件（即使是其他包中的组件）。命名空间前缀是应用程序品牌的重要组成部分，因为它会隐式附加到您包中包含的任何\
  \ Apex 代码或其他组件。\n\n最多可包含 15 个字符，但我个人建议保持少于这个数量，因为如果过于复杂，会难以记住并导致令人沮丧的拼写错误。我还会避免使用下划线字符。如果您未来可能会创建更多托管包（在不同的打包组织中），制定命名约定是个好主意。以下是示例命名约定的格式：\n\
  \n```\n[company acronym - 1 to 4 characters][package prefix 1 to 4 characters]\n\
  ```\n\n例如，ACME 公司的 Road Runner 应用程序可能被命名为 acmerr。\n\n当未设置命名空间时，**软件包** 页面（在 **设置**\
  \ 菜单下的 **创建** 子菜单中访问）指示只能创建未托管的包。单击 **编辑** 按钮以启动一个小型向导来输入所需的命名空间。这只能进行一次，并且必须全局唯一（意味着它不能在任何其他组织中设置），很像网站域名。\n\
  \n## 分配命名空间\n\n为了便于跟随本书学习，请随意创建任何您想要的命名空间，例如 `fforce{yourinitials}`。不要使用您未来可能计划使用的命名空间，因为一旦分配，就无法更改或重用。\n\
  \n以下屏幕截图显示了 **软件包** 页面：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_41_0.png)\n\n\
  设置命名空间后，前一页应如下图所示，区别在于它现在显示您使用的命名空间前缀，并且现在也可以创建托管包。您现在已准备好创建托管包并将其分配给命名空间。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_42_0.png)\n\
  \n## 创建包并将其分配给命名空间\n\n在软件包页面上单击 New 按钮，为您的包命名（稍后可以更改）。确保同时勾选 Managed 复选框。单击 Save\
  \ 并返回软件包页面，该页面现在应如下图所示：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_42_1.png)\n\n\
  ## 将组件添加到包中\n\n在软件包页面上，单击您的包的链接以查看其详细信息。从此页面，您可以管理包的内容并上传它。单击 Add 按钮以添加本章早些时候创建的自定义对象。请注意，您无需添加任何自定义字段——这些字段会自动添加。\n\
  \n以下屏幕截图大致显示了此时您的包详细信息页面的样子：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_43_0.png)\n\
  \n当您查看添加到包中的组件时，会发现有些组件可以移除，而其他组件无法移除。这是因为平台会隐式为您添加某些组件，因为它们是依赖项。随着本书的推进，添加不同的组件类型，在某些情况下，您会看到此列表自动增长，而在其他情况下，我们必须显式添加它们。\n\
  \n## 扩展包\n\n顾名思义，扩展包扩展或添加其所基于的现有包所提供的功能，尽管它们不能更改基础包的内容。它们可以扩展一个或多个基础包，您甚至可以有多个层级的扩展包，尽管您可能希望关注使用此功能的范围，因为管理跨包依赖关系可能变得相当复杂，尤其是在开发过程中。\n\
  \n扩展包的创建方式与您刚刚完成的过程几乎相同（包括需要其自己的打包组织），不同之处在于打包组织中还必须安装依赖包。\n\n扩展包中包含的代码和 Visualforce\
  \ 页面会引用基础包中存在的其他自定义对象、字段、Apex 代码和 Visualforce 页面，平台会跟踪这些依赖关系以及引用作时基础包的版本。\n\n安装扩展包时，此依赖信息确保在允许安装完成之前，订阅者组织中已安装正确版本（最低版本）的基础包。\n\
  \n您还可以通过适用组件的 **版本** 选项卡或 XML 元数据自行管理扩展包和基础包之间的依赖关系（我们将在讨论 API 集成的后续章节中重新探讨 Apex\
  \ 中的版本控制）。\n\n## 包依赖关系与上传\n\n包可能依赖于平台功能和/或其他包。您可以使用包详细信息页面以及这里描述的动态编码约定来审查和管理这些依赖关系。\n\
  \n虽然 Salesforce 的一些功能是通用的，但客户可以根据自己的需求购买不同的版本和功能。开发者版组织可以免费访问其中的大多数功能。这意味着，在开发应用程序时，了解何时以及何时不应使用这些功能非常重要（这样做是为了避免可能阻止或阻碍您的应用程序采用的不必要的依赖关系）。\n\
  \n默认情况下，当引用某个标准对象、字段或组件类型时，您会在包上生成一个先决依赖项，您的客户在完成安装之前需要先拥有它。某些 Salesforce 功能，例如多货币或\
  \ Chatter，会对您的用户产生配置或（在某些情况下）成本影响（不同组织版本）。请仔细考虑您的包依赖于哪些功能。\n\n大多数功能依赖关系（但并非全部）可通过包详细信息页面上的\
  \ View Dependencies 按钮查看（此信息也可在上传页面上查看，允许您进行最终检查）。将此检查添加到打包流程中是良好的做法，以确保没有不想要的依赖关系混入。单击本章中迄今构建的包的此按钮，可确认没有依赖关系。\n\
  \n\n\n\n\n对于未显示的依赖项，最好确保针对测试组织启用的功能清晰明确，因此任何其他依赖项都会在安装或进一步测试期间显示。\n\n```\nShow Dependencies\n\
  No Dependency Information for Package FormulaForce\n<< Back to Package: FormulaForce\n\
  There are no dependencies.\n```\n\n本书后面将讨论 Lightning 组件。如果你要打包这些组件，那么你实际上是在要求客户必须使用\
  \ Salesforce My Domain 功能。这一点在安装时并未强制执行，因此是可选依赖项。但是，用户在先启用并配置 My Domain 之前，将无法使用你打包的\
  \ Lightning 组件。\n\n## 上传发布包和测试包\n\n检查完依赖项后，单击 Upload 按钮。系统会提示你为包指定名称和版本。后续版本将为你管理版本。包可以上传为两种状态之一：测试版或发布版，如下文所述。\n\
  \n我们将通过在“发布类型”字段中选择“托管 - 发布”选项来执行发布上传，因此请确保你对本章前一节中创建的对象感到满意，因为此后这些对象将不易更改。\n\n\
  ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_45_0.png)\n\n确认屏幕上的信息无误后，再次单击 **Upload**\
  \ 按钮以开始打包过程。上传过程完成后，你将看到如下的确认页面：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_46_0.png)\n\
  \n包可以上传为以下两种状态之一：\n\n- **发布：** 发布包可以安装到订阅者生产组织中，并可以提供从以前版本的升级路径。缺点是你无法删除之前发布的组件，也无法更改某些内容，例如字段的类型。对标记为\
  \ **global** 的组件（例如 Apex 代码和 Visualforce 组件）的更改也受到限制。尽管 Salesforce 正在逐步增强平台以提供修改某些已发布方面的功能，但在选择此选项之前，你需要确保你的应用程序版本稳定。\n\
  \n- **测试版：** 测试包不能安装到订阅者生产组织中；你只能安装到开发者版（例如你的测试组织）、**沙箱**或合作伙伴门户创建的组织中。此外，测试包一旦安装后就无法升级；这就是\
  \ Salesforce 不允许其安装到生产组织中的原因。主要好处是能够继续更改版本中的新组件，以解决与用户反馈相关的错误和功能。\n\n> 在编写本书时，删除之前发布的组件（在发布包中上传）的功能处于试点阶段。可以通过向\
  \ Salesforce 支持部门提交支持案例来启用。在你充分了解其全部影响后，他们将启用该功能。\n\n到了本书的这个阶段，我们只是添加了一些自定义对象，因此上传应该能相对较快地完成。请注意，你实际上是上传到\
  \ AppExchange，这将在接下来的章节中介绍。\n\n> 如果要保护你的包，可以提供一个密码（此后可以更改）。执行安装的用户将在安装过程中被提示输入密码。\n\
  \n## 可选包依赖项\n\n可以将某些 Salesforce 功能和/或基础包组件引用（自定义对象和字段）设置为应用程序的可选方面。根据功能类型的不同，有两种方法可以实现这一点。\n\
  \n### 动态绑定\n\n例如，多币种功能会向标准对象和自定义对象添加 CurrencyIsoCode 字段。如果你显式引用该字段（例如，在你的 Apex、Visualforce\
  \ 页面或 Lightning 页面或组件中），则会对包产生硬依赖。如果你想避免这种情况，并将其作为应用程序中的配置选项（例如），则可以利用动态 Apex 和\
  \ Visualforce。Lightning 值绑定本质上是动态的，尽管 `aura:attribute` 元素类型引用会对指定对象形成编译时引用。\n\n\
  ### 扩展包\n\n如果你想打包仅在某些版本的订阅者组织中可用的组件类型，可以选择将这些组件包含在扩展包中。例如，你可能希望支持不支持记录类型的专业版。在这种情况下，为你的应用程序功能创建一个企业版扩展包，该扩展包利用该版本的功能。\n\
  \n> 请注意，对于你以这种方式使用的每个功能组合，你都需要多个测试组织，以便有效测试应用程序所需的配置选项或安装选项。\n\n## 成为 Salesforce\
  \ 合作伙伴及其优势\n\nSalesforce 合作伙伴计划有许多优势。首先要访问的地方是 https://partners.salesforce.com/。你需要关注与成为独立软件供应商（ISV）合作伙伴相关的网站区域。从此处，你可以单击\
  \ Join Now。加入是免费的，但你当然要仔细阅读各种协议。\n\n一旦你希望开始列出包并向用户收费，你就需要安排计费详细信息，以便 Salesforce\
  \ 收取各项费用。虽然本书无法深入探讨细节，但请务必仔细关注包中使用的标准对象，因为这将决定用户所需的许可证类型以及他们将承担的总成本（不包括你的收费）。\n\n\
  显然，Salesforce 更希望你的应用程序尽可能多地使用 CRM 应用程序的功能，这对你来说也可能是有益的，因为它作为你的应用程序的一个功能，是一个有吸引力的即时集成，其他平台上不存在此类集成，例如能够立即与账户和联系人集成。\n\
  \n如果你计划使用标准对象，并且对费用（因类型不同而异）有疑问，可以申请与 Salesforce 进行交谈以讨论此事；这是在早期阶段需要牢记的事情。\n\n确保在将\
  \ Salesforce 用户与合作伙伴社区关联时，你使用的是每日使用的用户（称为合作伙伴业务组织用户），而不是来自开发或测试组织的用户。完成注册流程后，你将获得访问合作伙伴社区的权限。以下屏幕截图显示了当前合作伙伴社区主页的样子。从此处，你可以访问许多有用的服务：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_48_0.png)\n\n这是你与 Salesforce 沟通并访问与 ISV\
  \ 相关的其他材料和公告的主要场所，因此请务必经常查看。你可以提交案例，并为组织中的其他用户提供额外的登录权限，例如可能希望报告问题或提出问题的其他开发人员。\n\
  \n## 安全审查及其优势\n\n以下功能要求已完成的包版本经过名为 **安全审查** 的 Salesforce 驱动流程，该流程通过登录 AppExchange\
  \ 时的列表启动。除非你计划免费提供包，否则将包放入此流程中会涉及费用。\n\n但是，审查是可选的。没有什么能阻止你直接分发包安装 URL。但是，你将无法从将新应用程序列在\
  \ AppExchange 上供他人查看和审查的功能中受益。更重要的是，你也将无法访问以下功能来帮助你部署、授权和支持应用程序。包通过安全审查后，你将获得以下优势列表：\n\
  \n- **绕过订阅者组织设置限制**：将绕过标签页数量和自定义对象数量等限制。这意味着，即使订阅者组织已达到自定义对象的最大数量，你的包仍然可以安装。此功能有时称为\
  \ **Aloha**。如果没有此功能，你的包安装可能会失败。你可以通过 LMA 应用程序附带的 **订阅者概览** 页面来确定是否启用了 Aloha，这将在下一节中讨论。\n\
  \n- **许可**：你可以在你的 LMO 中使用 Salesforce 提供的许可证管理应用程序 (LMA)。\n\n- **订阅者支持**：使用此功能，订阅者组织中的用户可以在特定时间段内启用一种方式，让你登录到他们的组织（无需交换密码），复现问题，并启用更详细的调试信息，例如\
  \ Apex 堆栈跟踪。在此模式下，你还可以查看你在包中声明为受保护的自定义设置，这对于启用其他调试或高级功能非常有用。\n\n- **推送升级**：使用此功能，你可以在无需订阅者手动干预的情况下自动向他们应用升级，可以由你直接执行，也可以按计划执行。你可以使用此功能来应用不影响自定义对象或\
  \ API 的较小错误修复，或者部署完整升级。后者需要与订阅者进行仔细的协调和规划，以确保更改和新功能得到妥善采用。\n\n\n\n\n\nSalesforce\
  \ 要求您通过网页 (http://security.force.com/security/tools/forcecom/scanner) 对软件执行自动化安全扫描。此服务的速度可能相当慢，具体取决于队列中有多少个扫描任务。另一个选项是从实际供应商\
  \ CheckMarx 获取 Eclipse 插件，网址为 http://www.checkmarx.com，它运行相同的扫描，但允许您在本地控制。最后，为在开发应用程序时获得终极信心，Salesforce\
  \ 可以提供许可证，以将其集成到您的持续集成 (CI) 构建系统中。CI 在本书的最后一章中有介绍。\n\n本书专注于构建完全原生的应用程序，因此不考虑与所谓的“混合”应用程序（例如，应用程序的部分已在您自己的服务器上实现）相关的额外工作。但是，请记住，如果您对外部服务进行任何调用，Salesforce\
  \ 很可能还会要求您和/或服务提供商运行 BURP 扫描器，以检查安全漏洞。\n\n请确保规划合理的时间（根据我的经验，至少两到三周）来完成安全审核流程；首先列出您的软件包至关重要。不过，如果这成为问题，您可以选择直接将软件包安装\
  \ URL 发送给初始客户和早期采用者。\n\n## 充分利用合作伙伴社区\n\n花些时间回顾合作伙伴社区中的内容和设施是值得的。以下是值得查看的几个关键区域：\n\
  \n- 教育和 Trailhead：这允许您监控组织中其他用户在 Trailhead 上的进度。Trailhead 是 Salesforce 的“边做边学”方式。用户阅读关于新技术或开发方法的内容，然后被要求完成一些挑战以验证其理解。作为游戏化系统的一部分，他们会获得徽章。使用此选项卡，您可以看到谁拥有最多的徽章！\n\
  \n- 精选群组：此页面位于“更多”下，可让您快速访问多个 Salesforce 管理的 Chatter 群组。一个关键群组是合作伙伴警报群组，我强烈建议您为此群组设置电子邮件摘要。只有\
  \ Salesforce 会向此群组发帖，因此每帖摘要级别是可以接受的，并且可以让您了解情况，而无需登录社区。\n\n- 支持：当然，这是您与 Salesforce\
  \ 提交案例的地方。在提交案例时，UI 会自动尝试搜索已知问题或可能帮助回答您问题的支持文章。您也可以在此处报告和筛选未决案例。\n\n- **发布**：此页面允许您将创建的内容列在\
  \ Salesforce AppExchange 网站上。本章后面的部分将更详细地介绍此内容。\n\n- **合作伙伴警报**：合作伙伴警报对于及时了解可能影响您的开发过程和/或客户的服务变更至关重要。这些变更可能包括关键修复、安全改进或您需要做好准备的行为变更。虽然罕见，但您可能会被要求在特定截止日期前对解决方案进行更改，以确保用户不受影响。\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_51_0.png)\n\n合作伙伴社区的“精选群组”页面上显示了许多 Chatter\
  \ 群组。请全部查看并设置电子邮件摘要，这样可以帮助您了解情况，而无需每次手动登录并查看此页面。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_51_1.png)\n\
  \n## 通过 Environment Hub 创建测试和开发组织\n\n合作伙伴可以使用 Environment Hub 创建用于开发和测试的组织。您也可以在此处链接组织并管理登录。与您可以从\
  \ Salesforce 开发者网站获得的组织不同，这些组织拥有额外的用户许可证。您还可以链接 TSO 并基于您定义的模板创建组织，从而进一步优化基础组织配置，以适应您自己的开发和测试流程。有关更多信息，请查看合作伙伴社区中关于\
  \ Environment Hub 的页面 (https://partners.salesforce.com/s/education/general/Environment_Hub)。\n\
  \n## AppExchange 和列表简介\n\nSalesforce 提供了一个名为 **AppExchange** 的网站，让潜在客户可以查找、试用和安装使用\
  \ Force.com 构建的应用程序。此处列出的应用程序也可以收到评分和反馈。您还可以在此网站上列出移动应用程序。\n\n> 在本节中，我将使用我已拥有的一个\
  \ AppExchange 软件包。该软件包已经经历了该过程，以帮助说明所涉及的步骤。因此，您不需要在本书的这个阶段执行这些步骤；在您准备好开始推广应用程序后，可以在开发的后期阶段再次查看这些步骤。\n\
  \n一旦您的软件包为 AppExchange 所知，每次您单击已发布软件包上的 **上传** 按钮（如前面所述），您实际上就创建了一个私有列表。私有列表在您决定公开之前对公众不可见。这为您提供了机会，在最终测试完成时准备任何相关的营销详细信息和定价信息。请注意，您仍然可以将软件包分发给其他\
  \ Salesforce 用户，甚至早期的测试版或试点客户，而无需使列表公开。\n\n要开始构建列表，您需要登录合作伙伴社区，然后单击标题中的 **发布** 选项卡。这将向您显示发布控制台。在这里，您可以链接和管理包含您的软件包的组织，创建列表并查看有关列表访问频率的分析数据。\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_53_0.png)\n\n从菜单中选择发布控制台选项，然后单击创建新列表按钮，并完成向导中显示的步骤，以将打包组织与\
  \ AppExchange 关联；完成后，您应该能看到它已列出。\n\n至关重要的是，您应始终使用 APO 用户凭据登录 AppExchange。Salesforce\
  \ 会允许您使用其他用户登录。为了便于确认，请考虑将用户的显示名称更改为类似 MyCompany Packaging 的内容。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_53_1.png)\n\
  \n完成列表步骤并非强制性要求，除非您想亲自尝试该流程以了解所需的信息类型。在本书完成后，您可以删除创建的任何私有列表。\n\n## 下载示例代码\n\n您可以从\
  \ http://www.packtpub.com 的帐户中下载已购买的所有 Packt 图书的示例代码文件。如果您在其他地方购买了本书，可以访问 http://www.packtpub.com/support\
  \ 并注册，以便文件直接通过电子邮件发送给您。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_54_0.png)\n\n\
  ## 安装和测试您的软件包\n\n在本章前面上传软件包后，您将收到一封包含安装软件包链接的电子邮件。如果没有收到，请查看打包组织中软件包详情页面上的版本选项卡。确保您已注销，然后单击链接。出现提示时，请登录您的测试组织。安装过程将开始。以下屏幕截图显示了初始安装页面的缩减版本；单击继续按钮，并遵循默认安装提示完成安装：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_54_1.png)\n\n软件包安装涵盖以下方面（用户输入软件包密码后，如果设置了密码的话）：\n\
  \n- **软件包概述：**平台会向用户提供将要添加或更新（如果是升级）的组件概览。请注意，由于分配给您的软件包的命名空间，这些组件不会覆盖订户在订阅者组织中创建的现有组件。\n\
  \n- **连接应用和远程访问：**如果软件包包含代表连接到 Salesforce 服务之外的服务的组件，则系统会提示用户批准这些组件。\n\n- **批准软件包\
  \ API 访问：**如果软件包包含使用客户端 API（例如 JavaScript 代码）的组件，则系统会提示用户确认和/或配置这些组件。此类组件通常不会被频繁调用；更倾向于使用\
  \ **JavaScript Remoting** 等功能，它们利用安装后配置的 Apex 运行时安全性。\n\n- **安全配置：**在此步骤中，您可以确定正在安装的组件（对象、页面等）的初始可见性，选择仅限管理员，或选择要更新的配置文件。此选项早于\
  \ **权限集** 的引入，权限集允许安装后进行配置。\n\n> 如果您在应用程序中打包配置文件，用户需要记住按照步骤 2 将这些配置文件映射到订阅者组织中的现有配置文件。这是一次性选项，因为软件包中的配置文件不会实际安装，只会合并。我建议您使用\
  \ **权限集** 为应用程序提供安全配置。这些权限集会被安装，并且粒度更细。\n\n安装完成后，请在 **设置** 菜单下导航到 **已安装的软件包** 菜单选项。在这里，您可以看到部分软件包详细信息的确认，例如命名空间和版本，以及任何许可详细信息，这些内容将在本章后面讨论。\n\
  \n\n\n\n\n也可以为您的包提供一个 **配置** 链接，该链接将在包安装并在订阅者组织上的 **已安装的包** 页面列出时显示在包旁边。在这里，您可以提供一个\
  \ Visualforce 页面来访问配置选项和流程，例如。如果您已启用 **基于座位的许可**，还会有一个 **管理许可** 链接，用于确定订阅者组织中的哪些用户可以访问您的包组件，例如选项卡、对象和\
  \ Visualforce 页面。关于许可，本章后面将更详细地讨论。\n\n### 自动化包安装\n\n可以使用 **Salesforce 元数据 API**\
  \ 和相关工具（例如 **Salesforce 迁移工具包**，可从 **设置** 下的 **工具** 菜单中获取）来自动化某些流程，这些工具可以从流行的 Apache\
  \ Ant 脚本环境中运行。如果您想要自动化将包部署到客户或测试组织，这会很有用。在本书的最后一章中，我们将更详细地研究 Ant 脚本。\n\n自动化不涵盖需要用户响应的选项，例如安全配置。但是，支持受密码保护的托管包。您可以在\
  \ Salesforce 元数据 API 的在线帮助中查找已安装包组件，以了解此方面的更多详细信息，网址为 `https://www.salesforce.com/us/developer/docs/api_meta/`。\n\
  \n为了帮助从 Ant 执行此操作，可在与此章相关的示例代码中找到一个自定义 Ant 任务（参见 `/lib/antsalesforce.xml`）。以下是一个\
  \ `/build.xml` Ant 脚本（也包含在章节代码中），用于卸载和重新安装包。请注意，如果包已安装，安装还会升级包。以下是 Ant 脚本：\n\n```\n\
  <project name=\"FormulaForce\"\n    xmlns:sf=\"antlib:com.salesforce\" basedir=\"\
  .\">\n\n<!-- Downloaded from Salesforce Tools page under Setup -->\n<typedef\n \
  \   uri=\"antlib:com.salesforce\"\n    resource=\"com/salesforce/antlib.xml\"\n\
  \    classpath=\"${basedir}/lib/ant-salesforce.jar\"/>\n\n<!-- Import macros to\
  \ install/uninstall packages -->\n<import file=\"${basedir}/lib/ant-salesforce.xml\"\
  />\n\n<target name=\"package.installdemo\">\n\n<uninstallPackage\n    namespace=\"\
  yournamespace\"\n    username=\"${sf.username}\"\n    password=\"${sf.password}\"\
  / >\n<installPackage\n    namespace=\"yournamespace\"\n    version=\"1.0\"\n   \
  \ username=\"${sf.username}\"\n    password=\"${sf.password}\"/ >\n</target>\n</project>\n\
  ```\n\n您可以使用测试组织尝试前面的示例，方法是将 namespace 属性值替换为本章前面输入的 namespace。从包含 build.xml 文件的文件夹中输入以下命令，全部在一行上：\n\
  \n```\nant package.installdemo\n-Dsf.username=testorgusername\n-Dsf.password=testorgpasswordtestorgtoken\n\
  ```\n\n> 您还可以使用 Salesforce 元数据 API 列出组织中安装的包，例如，如果您想要在发送安装请求之前确定是否需要安装或升级依赖包。最后，如果您愿意，也可以卸载包。\n\
  \n## 许可\n\n完成安全审核后，您可以通过 **合作伙伴门户** 提交支持案例来请求访问 **LMA**。Salesforce 提供此权限后，请使用安装\
  \ URL 将其像安装任何其他包一样安装到您的 **LMO** 中。\n\n如果您已请求 ISV 的 CRM 组织（通过 **合作伙伴门户** 中提交的案例），您可能会发现\
  \ **LMA** 已安装。\n\n以下屏幕截图显示了安装后 **许可管理应用程序** 的主选项卡：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_58_0.png)\n\
  \n在本节中，我将使用一个我已拥有且已经完成该流程的包来帮助说明所涉及的步骤。因此，您无需执行这些步骤。\n\n完成安装后，返回 **AppExchange**\
  \ 并登录。然后，在 **发布者控制台** 的 **已上传的包** 下找到您的列表。在您的包旁边，将有一个 **管理许可** 链接。第一次单击此链接后，系统会要求您将包连接到\
  \ **LMO** 组织。完成此操作后，您将能够定义包的许可要求。\n\n以下示例显示了免费包的许可，该许可对订阅者组织中的所有用户立即生效：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_59_0.png)\n\
  \n在大多数您打算收费的包的情况下，您会提供免费试用，而不是将许可默认设置为立即激活。对于付费包，请选择许可时长，除非是一次性收费，然后选择不过期的许可。最后，如果您提供试用许可，则需要仔细考虑默认座位数（用户）；用户可能需要能够在您的应用程序中为自己分配不同的角色，以获得完整体验。\n\
  \n> 目前，许可在包级别表达，但 Salesforce 很可能会在未来围绕包中的模块或功能提供更精细的许可。这很可能会由权限集功能驱动。因此，请记住在权限集设计中采取功能导向。\n\
  \n如果您针对许可配置了若干座位数，则 **已安装的包** 页面上的您的包旁边将显示 **管理许可** 链接。订阅者组织中的管理员可以使用此页面将适用用户分配到您的包。以下屏幕截图显示了当包启用许可时，管理员看到的已安装包的外观：\n\
  \n| 操作 | 包名称 | 发布者 | 版本号 | 命名空间前缀 | 状态 | 允许的许可 |\n|---|---|---|---|---|---|---|\n\
  | 卸载 | 管理许可 | Declarative Lookup Rollup Summaries Tool | Home | 1.4 | dlra | Active\
  \ | 3 |\n\n请注意，您无需为每个上传的版本重新应用许可要求；您定义的最后详细信息将被带入包的新版本，直到您更改它们。无论如何，这些详细信息也可以在 **LMA**\
  \ 应用程序的 **许可** 页面上完全覆盖。\n\n您可能希望为扩展或插件包应用站点范围（组织范围）的活动许可。这至少可以让您跟踪谁安装了此类包，即使您不打算围绕它们管理任何许可，因为您是在主包上处理许可。\n\
  \n### 许可选项卡和管理客户许可\n\n**许可** 选项卡提供用户将您的包安装到其组织时自动生成的单个许可记录列表。Salesforce 捕获此操作并创建相关详细信息，包括线索信息。这还包含执行安装的组织和人员的联系信息，如以下屏幕截图所示：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_60_0.png)\n\n从每个记录中，您可以修改当前许可详细信息以延长到期时间或完全禁用应用程序。如果您这样做，包将保持安装并包含所有数据。但是，没有任何用户能够访问对象、Apex\
  \ 代码或页面，即使是管理员也不行。您也可以随时重新启用许可。以下屏幕截图显示了 **许可编辑** 部分：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_61_0.png)\n\
  \n## 订阅者选项卡\n\n**订阅者** 选项卡列出所有安装了您包的客户或订阅者（显示其公司个人资料中的组织名称，仅限通过 **AppExchange**\
  \ 链接的那些）。这包括其组织 ID、版本（Developer、Enterprise 或其他）以及实例类型（沙箱或生产环境）。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_61_1.png)\n\
  \n### 订阅者概览页面\n\n当您单击本选项卡列表中的组织名称时，将进入 **订阅者概览** 页面。此页面有时称为 **合作伙伴黑色选项卡**。此页面包含大量有用信息，例如联系信息（也可通过\
  \ **线索** 选项卡查看）以及可能已授予的登录访问权限（我们将在下一节中更详细地讨论），以及他们安装了哪些包、当前许可状态以及安装时间。以下是 **订阅者概览**\
  \ 页面的屏幕截图：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_62_0.png)\n\n\n\n\n\n## 许可在订阅组织中的强制执行方式\n\
  \n许可的强制执行有两种方式，具体取决于您的打包自定义对象、字段和 Apex 代码被访问时的执行上下文。\n\n第一种上下文是：用户通过用户界面或 Salesforce\
  \ API（合作伙伴 API 和企业 API）直接与您的对象、字段、选项卡和页面进行交互。如果用户或组织未获得您的包许可，这些内容将被隐藏；在 API 的情况下，将返回错误。请注意，管理员仍可在\
  \ **设置** 菜单下查看打包的组件。\n\n第二种上下文是：来自 Apex 代码（例如客户自己编写或来自另一个包中的 Apex 触发器或控制器）的访问类型。如果许可是站点级（或组织级）或组织中至少有一个用户被分配了座位，则允许以这种间接方式访问您的包组件。\n\
  \n这种情况意味着，即使当前用户未被分配座位（通过 **管理许可** 链接），他们仍然可以访问您应用程序的对象和代码，尽管是间接访问，例如，通过客户特定的实用工具页面或\
  \ Apex 触发器，用于自动创建某些记录或为您的包中的字段设置默认值。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_63_0.png)\n\
  \n## 提供支持\n\n一旦您的包完成安全审查，将启用用于支持客户的额外功能。具体而言，这包括能够安全登录（无需交换密码）到客户的环境并调试您的应用程序。以这种方式登录后，您可以看到用户看到的所有内容，此外还可以查看扩展调试日志，这些日志包含的详细程度与在开发者组织中相同。\n\
  \n首先，您的客户通过 **授予账户登录** 页面启用访问权限。不过这一次，您的组织（请注意，这是打包组织中 **公司配置文件** 下定义的 **公司名称**）将作为\
  \ Salesforce Support 之外的可用选项之一列出。以下屏幕截图显示了 **授予账户登录** 页面：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_64_0.png)\n\
  \n接下来，您登录到您的 LMO 并像前面所述导航到 **订阅者** 选项卡。为客户打开 **订阅者概览**，您现在应该能看到以该用户身份 **登录** 的链接。从此点开始，您可以遵循客户提供的步骤，并利用标准\
  \ **调试日志** 和 **开发者控制台** 工具来捕获所需的调试信息。以下屏幕截图显示了一个通过您的包被授予登录其组织权限的用户：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_64_1.png)\n\
  \n> 这种访问模式还允许您查看受保护的自定义设置（如果您将它们包含在您的包中）。如果您以前没有遇到过这些设置，那么研究一下是非常值得的，因为它们提供了一种理想的方式来启用和禁用您不希望客户通常看到的调试、诊断或高级配置。\n\
  \n## 客户指标\n\n自平台 Spring '14 版本起，Salesforce 已开始公开有关订阅者组织中您的包组件使用情况的信息。这使您可以报告客户正在使用哪些自定义对象和\
  \ Visualforce 页面，更重要的是，他们没有使用哪些。此信息由 Salesforce 提供，客户无法选择退出。\n\n此功能需要 Salesforce\
  \ Support 启用。启用后，`MetricsDataFile` 对象在您的生产组织中可用，并会定期接收包含指标记录的数据文件。可以通过在 AppExchange\
  \ 上搜索找到 **使用情况指标可视化** 应用程序，该应用可帮助可视化此信息。\n\n## Trailforce 和 Test Drive\n\n大型企业应用程序通常需要在初始包安装后与客户进行一些咨询，以根据其需求进行调整和定制。如果您希望为您的应用程序提供试用版，Salesforce\
  \ 提供了一种方法来拍摄此安装和设置过程的快照，包括示例数据。\n\n然后，您可以允许访问您的 AppExchange 列表或网站的潜在用户注册，以基于您制作的快照获取\
  \ Salesforce 组织的个性化实例。潜在客户随后可以使用该实例在有限时间内完全探索应用程序，直到他们注册成为付费客户。此类组织最终会在创建的组织的 Salesforce\
  \ 试用期结束时过期（通常为 14 天）。因此，在设置包许可的默认过期时间时，您应该牢记这一点。\n\n标准方法是提供一个网页表单，供潜在用户填写以获取试用版。有关更多信息，请查看\
  \ ISVforce Guide 中的 *在您的网站上提供免费试用* 和 *在 AppExchange 上提供免费试用* 章节。\n\n您也可以考虑使用 Signup\
  \ Request API，这使您能够更好地控制流程的启动方式并能够监控它，这样您就可以自己创建线索记录。有关更多信息，请参阅 ISVforce Guide 中的\
  \ *使用 API 创建注册* 章节。作为更高级的选项，如果您是拥有现有应用程序的 ISV，并希望使用 Salesforce.com 作为后端服务，则可以使用此\
  \ API 完全代表他们创建和管理组织。有关更多信息，请查看 ISVforce Guide 中的 *为 OAuth 创建代理注册* 和 *API 访问* 章节。\n\
  \n或者，如果潜在用户希望在其沙箱环境中试用您的包，例如，您可以允许他们直接从 AppExchange 或您的网站安装包。在这种情况下，请确保如前所述已在您的包许可上定义了默认过期时间。在此场景中，您或潜在用户将在安装后执行设置步骤。\n\
  \n最后，还有一个名为 Test Drive 的第三个选项，它不会按请求为潜在用户创建新组织，但确实要求您设置一个带有您的应用程序的组织、对其进行预配置，然后通过\
  \ AppExchange 将其链接到您的列表。用户不需要完成注册页面，而是单击 AppExchange 列表上的 Test Drive 按钮。这会将他们登录到您的测试驱动组织，作为只读用户。由于这是共享组织，您可以为用户提供的用户体验和功能仅限于主要读取信息的功能。我建议您考虑使用\
  \ Trailforce 而非此选项，除非有非常充分的理由使用它。\n\n> 在 AppExchange 上定义您的列表时，线索选项卡可用于配置为列表上的试用版、试驾和其他活动创建线索记录。启用此功能后，在用户访问列表上的这些功能之前，将向其显示一个表单。例如，如果您通过网站上的注册表单提供试用版访问权限，则不会捕获线索信息。\n\
  \n## 分发 Salesforce 连接应用\n\n如果您计划构建任何类型的平台集成（例如专用移动应用程序），使用 Salesforce API 或使用 Apex\
  \ 构建的任何 API，则需要创建并打包所谓的连接应用。这允许您作为 ISV 设置 OAuth 配置，以便这些集成的用户能够连接到 Salesforce，从而连接到在平台上运行的您的逻辑和对象。您实际上不需要打包此配置，但建议您这样做，因为它将允许您的客户控制和监控他们如何使用您的解决方案。\n\
  \n## 摘要\n\n本章通过将包安装到另一个 Salesforce 组织，为您提供了初始包创建过程的实用概述。虽然讨论的一些功能在接近首个发布阶段之前无法完全使用，但您现在可以开始开发，并充分理解早期决策（例如引用标准对象）对您的许可和成本决策至关重要。\n\
  \n同样重要的是要记住，虽然 Trailforce 等工具有助于自动化设置，但这不适用于安装和配置客户环境。因此，在设计中做出有关配置和默认值的选择时，请牢记实施周期中对客户的成本。\n\
  \n请确保在发布周期中规划安全审查流程（免费在线版本带宽有限），并尽早将其集成到您的 CI 构建系统（付费功能）中，因为该工具不仅监控安全漏洞，还有助于报告违反最佳实践的情况，例如缺少测试断言以及循环中的\
  \ SOQL 或 DML 语句。\n\n在接下来的章节中，我们将开始探索构建企业应用程序的工程方面，通过构建本章创建的包的升级，使我们能够更好地探索平台如何支持您的应用程序的渐进式增长。\n\
  \n> 当您回顾本章涵盖的工具时，请务必参考 http://www.salesforce.com/us/developer/docs/packagingGuide/index.htm\
  \ 上出色的 ISVforce Guide，以获取有关如何访问、配置和使用这些功能的最新详细步骤和说明。\n\n\n\n\n"
- "# 利用平台功能\n\n在本章中，我们将探索 Force.com 平台的一些关键功能，这些功能既能帮助开发者更快速地构建应用程序，也能为应用程序的最终用户提供关键功能。以平衡的方式使用这些功能，是确保你和你的用户不仅能当下充分发挥平台优势，而且随着平台发展，未来也能继续如此的关键。\n\
  \n企业应用程序的一个关键要求是能够定制和扩展其功能，因为企业客户的业务各异且复杂。你也应该牢记，随着你的生态系统增长，你应该确保合作伙伴关系能够通过正确的集成选项获得赋能，并且合作伙伴需要将他们的解决方案与你的解决方案进行对接；平台在此方面也起着关键作用。\n\
  \n随着我们扩展 FormulaForce 包，我们将探索以下内容，以更好地理解围绕平台对齐的一些决策：\n\n- 打包和可升级组件\n- 自定义字段功能\n\
  - 安全功能\n- 平台 API\n- 本地化和翻译\n- 构建可定制的用户界面\n- 使用电子邮件模板进行电子邮件定制\n- 工作流和流程\n- 社交功能和移动端\n\
  \n## 打包和可升级组件\n\n安装你的应用程序并为客户准备好上线使用所需的时间，是客户关系中的一个关键阶段。他们显然渴望尽快获得你更新和改进的发布版本。仔细规划并意识到你正在使用的哪些组件是可打包和可升级的，对于监控此阶段所涉及的工作量非常重要。\n\
  \n在探索可用的各种平台功能时，检查相关组件类型是否可以打包非常重要。有关可打包组件的完整列表，请在上一章中引用的 ISVforce 指南中搜索“可用组件”部分。\n\
  \n```\nhttps://developer.salesforce.com/docs/atlas.en-us.packagingGuide.meta/packagingGuide/\n\
  ```\n\n> 如果你希望使用的功能相关的组件类型无法打包，这不一定意味着它对你或你的用户没有用处，因为它可能是你可以通过咨询团队推广的内容，让最终用户管理员在安装后加以利用。不过请记住，你推荐此操作的频率越高，尤其是如果它开始成为必需的安装后任务，就会增加你的用户在你的应用程序上线所需的时间。\n\
  \n另一个需要考虑的方面是组件类型是否可升级，也就是说，如果你定义并包含你的包的一个版本，然后在后续版本中对其进行修改，它将在订阅者（客户）组织中更新。ISVforce\
  \ 指南中“可用组件”部分的表格也将为你提供有关此的最新信息。一些不可升级的组件类型如下：\n\n- 布局\n- 电子邮件模板\n- 报表\n- 列表视图\n\n\
  这些功能是你应用程序设计的关键，将在本章后面部分更详细地介绍。同样重要的是，最终用户可以自定义这些功能；因此，Salesforce 允许对它们进行编辑。不幸的是，这意味着它们不可升级，也就是说，以布局为例，任何你添加到自定义对象的新字段在用户可用升级后不会默认出现。但是，你的包的新安装将接收你的包中这些组件的最新版本。\n\
  \n这也适用于先前引用的表格中标记为可升级的组件的某些属性，但具有随后不可升级的某些属性。有关此的最新详细信息，请参阅 ISVforce 指南中的“安装后编辑组件和属性”部分。一些可打包但不可升级，因此最终用户可修改的常见属性如下：\n\
  \n- 自定义字段：选择列表值\n- 验证规则：活动\n- 自定义对象：操作重写\n\n> 验证规则的活动状态是一个相当令人惊讶的点；虽然用户无法修改你的打包验证规则，但他们可以禁用它。对于大多数目的，这意味着该平台功能成为安装后的可选活动，留给最终用户在希望实施其独有规则时执行。对于你希望在\
  \ Apex 中实施的验证，你可以利用受保护的自定义设置来控制激活（如需要）（这些设置仅通过订阅者支持对你的支持团队可见）。\n\n## 自定义字段 – 选择列表值\n\
  \n自定义字段不可升级属性中，可能最令人惊讶的就是选择列表值列表。这些值可以完全由最终用户修改；他们可以添加、修改或删除。这意味着你需要非常小心如何在 Apex\
  \ 代码中引用这些值，因此，你需要向最终用户提供关于升级后编辑和应用更改的指南。\n\n> Salesforce 翻译工作台工具位于设置菜单下，可以通过编辑用户当前的语言来有效地重新标记选择列表值，而无需在字段定义上重命名其值。最终用户管理员在安装该工具后可以执行此操作。\n\
  \n另外，请记住，平台大多数情况下将选择列表字段视为文本字段；因此，你可以用任何喜欢的值查询甚至更新选择列表字段。此外，请记住，你可以通过 Apex 安装后脚本升级客户数据（如果你更改或删除选择列表值）。\n\
  \n## 全局选择列表\n\n在字段级别定义选择列表的替代方案是全局选择列表。位于设置菜单下，它们允许你定义和打包独立于字段的选择列表，因此可以跨多个字段共享。\n\
  \n以这种方式定义的选择列表有两个显著区别：\n\n- 最终用户无法在订阅者组织中修改它们\n- 如果用户或代码尝试用无效的选择列表值更新字段，平台会对其进行验证\n\
  \n如果你需要字段上的选择列表可自定义，或者不介意它们被修改，那么你可以在字段级别定义选择列表。否则，全局选择列表是在你的数据模型需要具有固定值的字段的情况下使用的更自然、更安全的默认选项，即使字段之间没有重复使用。请记住，无论你选择哪种路线，用户仍然可以通过\
  \ Salesforce 翻译工作台修改全局选择列表项的标签。\n\n## 使用 Salesforce Metadata API 自动化升级\n\nSalesforce\
  \ 一直非常擅长提供 API；Metadata API 也不例外，因为它涵盖了设置菜单下大多数可操作内容的非常广泛的范围。这意味着可以考虑开发升级工具来协助升级组件，例如布局或选择列表值。此类工具将需要处理合并和与用户确认更改的逻辑，例如，提供一种方法将新字段合并到布局中，用户可以通过\
  \ UI 提示选择。\n\n目前，Metadata API 无法直接从 Apex 访问（尽管我仍然希望它将来可以访问）。但是，它可以通过 Apex HTTP 调用进行调用，因为它作为\
  \ SOAP API 可用。\n\nApex Metadata API 库在 https://github.com/financialforcedev/apex-mdapi\
  \ 提供了一个 Apex 封装器，以便于使用。以下 Apex 代码展示了如何使用该库以编程方式更新布局以添加新的自定义按钮。此代码可以作为你随应用程序提供的工具的一部分，或由你的顾问单独使用。有关更多信息，你可以参考\
  \ GitHub 仓库中的 README 文件。\n\n```\n// Read the layout\nMetadataService.Layout layout\
  \ =\n    (MetadataService.Layout) service.readMetadata(\n```\n\n\n\n\n\n```\n'Layout',\
  \ new String''\n\" 'Test__c-Test Layout' ).getRecords()'0';\n\n// Add a button to\
  \ the layout\nlayout.customButtons.add('anewbutton');\n\n// Update the layout\n\
  List<MetadataService.SaveResult> result =\nservice.updateMetadata(\n new MetadataService.Metadata''\
  \ \" layout \" );\n```\n\n> 可以考虑从安装后脚本中调用此逻辑是可行的。但是，Salesforce 目前要求您定义远程站点才能授权调用，即使是调用其自身的服务器也是如此。由于此\
  \ API 的端点因订阅者组织的 Salesforce 实例而异，因此难以预先定义，也难以将此配置作为包的一部分预先安装。因此，除非您确信升级前已设置好远程站点，否则最好引导用户前往\
  \ Visualforce 页面（或许可通过安装后脚本发送的电子邮件），在那里您可以提示用户。\n\n## 了解自定义字段功能\n\n自定义字段包含比您想象的更多功能；它们远比其他平台上常见的简单字段定义要复杂得多。深入理解自定义字段是减少需要编写的代码量、改善应用程序数据的用户体验和报告的关键。\n\
  \n## 默认字段值\n\n为字段添加默认值可以提高应用程序的可用性，并减少屏幕上所需的字段数量，因为用户可以从布局中移除具有可接受默认值的字段。\n\n自定义字段上定义的默认值适用于原生用户界面和\
  \ Visualforce 界面（前提是使用了 apex:inputField 组件），在某些情况下也适用于 API。您可以基于公式定义默认值，该公式可使用文字值和/或变量，如\
  \ $User、$Organization 和 $Setup。\n\n让我们试一下。按照以下截图在 Season 对象上创建一个 Year 文本字段。请确保选择\
  \ External ID 复选框，因为在本章末尾包上传后，该字段无法再更改。这在下一章中将变得重要。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_73_0.png)\n\
  \n> 您定义的默认值不能通过订阅者组织中的自定义来覆盖，但是，您可以使用 $Setup 引用在默认值公式中引用自定义设置（仅限层级类型）。这允许通过在组织、配置文件或单个用户级别编辑自定义设置来进行一定程度的自定义。\n\
  \n要在 Season 对象中创建记录，我们首先需要为其创建一个选项卡。在包组织中执行以下步骤来尝试此过程：\n\n- 1. 为 Season 对象创建选项卡。\n\
  - 2. 转到 Season 选项卡并单击 New。\n- 3. 这将在 **Year** 字段中显示当前年份，如下一张截图所示：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_74_0.png)\n\
  \n上一张截图显示了当用户使用 Salesforce Classic 时 Salesforce 显示的用户界面。Salesforce Classic 是其最新用户界面技术\
  \ Lightning Experience 的前身。两者都是用户可选的选项，并且在用户和应用程序迁移之前，这两者都可能长期并存。本书在各章中也包含有关 Lightning\
  \ 的信息，以及专门的第 10 章 Lightning。\n\n不幸的是，默认情况下，当您通过 `new Season();` 直接构建 SObject 时，Apex\
  \ 代码不会应用默认值；但是，如果您使用 `SObjectType.newSObject` 方法，可以按如下方式请求应用默认值：\n\n```\nSeason__c\
  \ season = (Season__c)\nSeason__c.SObjectType.newSObject(null, true);\nSystem.assertEquals('2016',\
  \ season.Year__c);\n```\n\n### 加密字段\n\n无论您觉得数据被盗的可能性有多小，都有一些市场和政府法规要求使用加密字段。Salesforce\
  \ 提供了两种方法来帮助确保您的应用程序数据以加密形式存储在其数据中心中。对于加密静止字段值（即物理存储在永久存储介质上的记录），有两个选项可供考虑。\n\n\
  - 经典加密：加密字段使用 128 位主密钥，并采用高级加密标准（AES）算法来存储值；它们使用字符掩码显示（当前不可由开发者定义）。此类字段可打包，但仅适用于文本字段。\n\
  - 平台加密：购买了 Salesforce Shield 插件的客户可以为其选择的某些标准字段和自定义字段启用 256 位 AES 加密。它可以应用于 E-mail、Phone、Text、Text\
  \ Area、URL、Date 和 Date/Time 字段。虽然加密级别更高，但此功能也带来了一些重大限制，这些限制将在下一节中介绍。\n\n加密字段值对拥有\
  \ **View Encrypted Data** 权限的用户可见，这是一项您的要求可能无法容忍的功能。这也包括您授予登录权限的用户，例如通过订阅者支持。您打包的\
  \ Apex、Visualforce 页面、Lightning 组件和验证规则逻辑可以看到未加密的值，因此如果您希望掩码字段值，开发者需要格外小心。如果您的唯一关注点是遵守静态加密合规性，这对您来说可能不是问题。\n\
  \n### 平台加密的特殊注意事项\n\nSalesforce 建议仅在您所在市场的政府法规要求时才考虑此功能。在开发打包解决方案时，您的主要考虑是：如果订阅者希望在您解决方案中引用的标准字段或您打包的某个字段上启用此功能，会发生什么情况。\n\
  \n> > 对于希望通过其 AppExchange 列表宣传支持此功能的用户，Salesforce 可以将一个指示器应用于您的列表，以向潜在客户展示您支持平台加密。\n\
  \n在实现平台加密使用的 256 位加密时，Salesforce 选择了概率加密而非确定性加密。由于加密不是确定性的（每次加密后的值都不同），因此无法为应用了此级别加密的字段建立索引。这会导致围绕查询该字段，对开发者和平台功能施加最重大的限制。\n\
  \n如果没有索引，平台就无法提供高效的方式来允许代码在查询中按加密字段进行过滤、分组或排序。如果代码在运行时尝试这样做，将发生异常。如果包安装检测到 Apex\
  \ 代码中存在不兼容此限制的查询，您的包安装可能会被阻止。反之，包安装后如果用户尝试启用加密，此操作可能会失败。Salesforce 在两种情况下都会提供报告，以告知用户哪些字段有问题。\n\
  \n可以在特定条件下绕过这些限制，方法是使用动态 SOQL 来允许在未启用加密时在运行时构建并执行受影响的查询。在启用加密的情况下，您可以在 Apex 和/或通过\
  \ Salesforce 对象搜索语言（SOSL）中执行过滤、分组和排序。不过，这两种选项都应谨慎考虑，因为它们各有限制，且可能不是性能最好的方案。在某些情况下，您可能需要接受有必要在解决方案中有选择地隐藏功能。这个决定需要您与用户共同做出，权衡这种妥协是否可以接受。\n\
  \n> 无论您是否计划支持平台加密，对于需要您的应用程序与其他 Salesforce 产品和其他合作伙伴解决方案共存的企业客户来说，这可能仍然是一个重要需求。我建议您提前准备一份声明，说明您提供哪些级别的支持，例如支持哪些标准字段和包字段。确保您的潜在客户能够做出明智的决定，否则他们可能会不必要地将您的应用程序从候选名单中剔除。\n\
  \n我强烈建议您利用合作伙伴成功社区中的教育部分。在“更多资源”部分下，您将找到一个专门的页面，其中包含专门针对 ISV 的视频和其他资源。\n\n## 查找选项、筛选器和布局\n\
  \nSalesforce 的标准查找 UI 可以进行配置，使用户更容易识别要选择的正确记录，筛选掉不相关的记录，并在必要时阻止他们删除在应用程序其他位置正在使用的记录，这一切都无需编写任何代码。\n\
  \n在包组织中执行以下步骤来尝试此过程：\n\n- 1. 为 Driver 和 Race 对象创建选项卡。\n- 2. 向 Driver 自定义对象添加 Active\
  \ 复选框字段；确保默认值已勾选。\n- 3. 创建驱动程序记录，例如 Lewis Hamilton。\n- 4. 从上一节中创建的 Season 记录，创建一条\
  \ Race 记录，例如 Spa。\n- 5. 通过 Contestants 关系将 Lewis Hamilton 与 Spa 比赛关联起来。\n\n\n\n\n\
  \n首先，确保如果驱动程序与参赛者记录相关联（即他们拥有或正在参加比赛），则无法删除驱动程序。编辑**参赛者**对象上的**驱动程序**字段，并启用“不允许删除作为查找关系一部分的查找记录”。这类似于在其他数据库平台中表达引用完整性规则。\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_77_0.png)\n\n现在，如果您尝试删除刘易斯·汉密尔顿，应该会收到以下屏幕截图中显示的消息。如果您尝试通过\
  \ Apex DML 或 Salesforce API 进行删除，也适用此规则。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_77_1.png)\n\
  \n您刚刚节省了一些 Apex 触发器代码，并使用了平台功能。\n\n让我们来看看另一个查找功能，即查找过滤器。一级方程式车手来来去去；让我们确保在通过参赛者记录上的**驱动程序**查找选择参赛车手时，仅显示活跃车手，并且仅允许直接输入活跃车手。\n\
  \n在打包组织中执行以下步骤以试用此流程：\n\n- 1. 创建一个**驱动程序**记录，例如 Rubens Barrichello，并确保“Active”字段未勾选。\n\
  - 2. 编辑**参赛者**对象上的**驱动程序**字段，并按照以下屏幕截图完成“查找过滤器”部分，在“如果不匹配，保存时显示此错误消息”和“将此信息消息添加到查找窗口”字段中输入建议的消息，然后单击“保存”：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_78_0.png)\n\n每个对象最多可以拥有五个活跃的查找过滤器。这不是由您的包命名空间设置的限制。因此，请谨慎使用，以便为最终用户留出创建其自己查找过滤器的空间。如果您没有强烈的过滤需求，请考虑将其实现为\
  \ Apex 触发器验证。\n\n通过尝试为 `Spa` 记录创建 `Contestant` 子记录来测试过滤器。首先，使用查找对话框，您将看到先前输入的信息消息，并且无法选择\
  \ `Rubens Barrichello`，如以下屏幕截图所示：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_79_0.png)\n\
  \n如果您尝试直接输入非活跃车手的姓名，同样会被阻止，如以下屏幕截图所示：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_79_1.png)\n\
  \n此验证也通过 Apex DML 和 Salesforce API 强制执行。与验证规则不同，最终用户无法禁用此验证。但是，平台允许与记录相关的更改，例如随后将驱动程序设为非活跃。在这种情况下，下次编辑\
  \ `Contestant` 记录时，将出现前面屏幕截图中给出的错误。\n\n最后，您还可以在查找对话框中显示其他列，这些列可帮助用户根据其他字段识别正确的记录。以下步骤介绍了如何执行此操作：\n\
  \n- 1. 向 **驱动程序** 对象添加 **选择列表** 类型的 **国籍** 字段，并输入以下值：`British`、`Spanish`、`Brazilian`、`Finnish`\
  \ 和 `Mexican`。\n- 2. 编辑现有的 **驱动程序** 记录，并在 **国籍** 字段中设置适当的值。\n- 3. 找到 **驱动程序** 对象的\
  \ **搜索布局** 部分，编辑 **查找对话框** 布局，添加步骤 1 中创建的 **国籍** 字段，并保存布局。选择驱动程序时，查找现在应显示此其他字段，如下所示：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_80_0.png)\n\n查找是平台非常强大的声明式功能；它们不仅用于表达应用程序数据模型关系，实际上还强制执行数据完整性，从而大大简化了用户的数据录入工作。\n\
  \n## 汇总字段和限制\n\n说到对数据进行计算，平台提供了多种选项：报表、Analytics API、仪表板、Apex 触发器、Visualforce 和汇总字段。汇总字段选项提供了一种无需代码的解决方案，并能够应用一些条件过滤。汇总字段随后还可以引用并与公式字段和验证规则等其他功能结合使用。\n\
  \n关键要求是，被汇总的明细记录与添加汇总字段的主记录之间必须存在主从关系，例如 **比赛** 与 **参赛者** 之间的关系。以下示例将统计未完成特定比赛（即一级方程式中的\
  \ DNF）的竞争者总数。\n\n在包组织中执行以下步骤以试用此流程：\n\n- 1. 在 **参赛者** 对象上使用 **复选框** 字段类型创建 **DNF**\
  \ 字段。\n- 2. 为 *夏尔·皮克* 创建一个 **驱动程序** 记录，并通过 **参赛者** 对象将他添加到 *Spa* 比赛中，勾选 **DNF**\
  \ 字段。\n- 3. 在 **比赛** 对象上使用 **汇总字段** 字段类型创建 Total DNFs 字段。从 **汇总对象** 下拉列表中选择 **参赛者**\
  \ 对象，将 **汇总类型** 设置为 **计数**，并按以下屏幕截图所示应用 **筛选条件** 字段，以仅选择 **DNF** 字段已勾选的 `Contestant`\
  \ 记录：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_81_0.png)\n\n导航到 Spa 记录，并注意 Total\
  \ DNFs 显示值为 1。通过更改 Driver 记录上 DNF 字段的状态来进行实验，查看值重新计算。\n\n配置后，汇总字段提供实时计算。但是，在创建或更改汇总字段时，Salesforce\
  \ 指出可能需要长达 30 分钟。您可以在文档中搜索“关于汇总字段”以阅读更多内容，并查看知识库文章“汇总字段技术概览”，网址为 http://help.salesforce.com/apex/HTViewSolution?id=000004281。\n\
  \n> 您可以在 Apex 触发器逻辑中结合使用汇总字段，例如，可以在 `Race` 对象触发器的 `after` 阶段中添加 Apex 逻辑来检查 DNF 数量。您的用户还可以在引用其汇总字段的\
  \ `Race` 对象上应用验证规则。任何导致此验证规则失效的 `Contestant` 明细记录更改都将阻止对相关 `Contestant` 记录的更新。\n\
  \n您可以想象，计算汇总字段对 Salesforce 服务器来说可能是一项相当繁重的工作。因此，Salesforce 将每个对象的汇总字段总数限制为 10 个，不过在拥有有效业务理由的情况下，通过联系\
  \ Salesforce 支持可将其增加到 25 个。请记住，作为打包应用程序提供商，此限制不受您的命名空间限制（不同于其他限制）。这意味着，如果您用完了全部\
  \ 10 个，最终用户将无法在安装后添加自己的汇总字段。同样，如果他们在安装后创建了自己的汇总字段，而升级导致超出限制，则安装将失败。\n\n> 虽然这是一个功能强大的特性，但请仔细考虑上一段中列出的其他汇总选项，以及您的用户是否真的需要这些信息是实时的或可从公式和验证规则访问。如果不是，一个很好的折中方案是\
  \ Visualforce 页面，可以内联添加到 `Page Layout` 对象中。Visualforce 页面可以使用 `readonly=true` 属性，其中\
  \ Apex 控制器逻辑可以利用聚合 SOQL 查询来聚合多达 500 万条记录（受适当索引和标准超时容差限制）。当用户在 UI 中查看记录时，即可显示此页面，从而按需计算。有关使用\
  \ Visualforce 增强 Salesforce 标准页面的详细信息将在本章后面讨论。\n\n## 了解可用的安全功能\n\n平台提供安全控件，用于管理应用程序中功能的可访问性，以及其创建的各个记录的可见性。作为应用程序提供商，您的代码有责任强制执行安全规则，并提供有助于管理员轻松配置安全性的集成。本节并非旨在深入探讨平台的安全功能，而是旨在帮助了解选项、最佳实践以及打包影响。\n\
  \n\n\n\n\n前一章中描述的安全审查流程进行的关键检查之一，是扫描代码以确保其使用适当的 Apex 规范来强制执行应用程序管理员配置的安全规则，因为并非所有安全检查都会自动为你执行。\n\
  \n本章讨论平台提供的以下两类安全性：\n\n- 功能安全：适用于应用程序对象、某些代码入口点（提供 API）以及交付应用程序功能的 Visualforce 页面的安全性，在此称为功能安全\n\
  - 数据安全：与应用程序创建和维护的单个记录数据上应用的安全性相对，此类安全性称为数据安全\n\n## 功能安全\n\n配置文件和权限集都可以在应用程序中创建和打包，以帮助应用程序管理员控制对对象、字段、选项卡和页面的访问。从根本上说，配置文件在历史上被用来预打包您设想用户在应用程序中使用的角色，例如车队负责人。相比之下，权限集可用于表达应用程序中的功能，例如将车手分配给比赛的能力。\n\
  \n到目前为止，大多数人都熟悉配置配置文件以控制安全性。问题是，这最终可能导致配置文件的激增；当用户之间的需求出现微小差异时，配置文件会被克隆，从而增加执行常见更改时的管理开销。为了管理这一点，Salesforce\
  \ 创建了权限集，这是一种表达安全控制的更细粒度的方式。\n\n从应用程序的角度来看，您可以打包权限集，甚至可以让它们随着应用程序中新增或更新的功能而自动升级。您还可以在安装后分配它们，而配置文件仅在安装期间可分配。与配置文件不同，管理员无法编辑权限集，但如果需要可以克隆它们（在\
  \ Salesforce 的 Professional 和 Group 版本中无法做到这一点）。由于这些好处，建议在打包应用程序的安全信息时使用权限集，而不是配置文件。\n\
  \n从一开始就规划权限集的使用非常重要，以便您的开发团队保持其更新，并且其使用始终保持一致。在设计权限集策略时，请考虑以下几点：\n\n- **思考功能而非角色**：不要被诱惑回到表达您设想应用程序用户被分配的角色上。企业组织庞大而复杂；很少有一种尺寸适合所有人。例如，**车队负责人**在一次安装到另一次安装中可能在您的应用程序中承担许多不同的职责。如果您做错了，管理员将被迫克隆权限集，导致未托管的权限集开始激增，这些权限集不会随着软件包升级而跟踪新增或更改的功能。\n\
  - **粒度**：在设计应用程序功能时，会定义模块（您可以使用 **设置** 下的 **应用** 来指示这些），在这些对象、选项卡或页面中，每个都有不同的操作。例如，参赛者对象可能描述指示车手已退出比赛并更新相应\
  \ DNF 字段的功能，即 **更新 DNF 状态**。例如，此权限可能会分配给比赛控制员用户。相比之下，您可能有一个较不细粒度的名为 **比赛管理** 的权限集，它涵盖\
  \ **更新 DNF 状态** 权限加上其他权限。采用这种方法设计权限集意味着管理员分配给用户的工作更少，同时，如果他们愿意，也拥有更具选择性的能力。\n- **命名约定**：当管理员在\
  \ Salesforce UI 中查看您的权限集时，请确保它们根据应用程序的功能方面进行分组，可以考虑采用命名约定，例如 `FormulaForce - Race\
  \ Management` 和 `FormulaForce - Race Management - Update DNF Status`。\n\n前一章中描述的\
  \ **许可证管理应用程序 (LMA)** 的局限性之一是其粒度不够；您只能将用户许可证有效地授予整个软件包，而不能授予其中的模块或关键功能。随着权限集许可证的引入，Salesforce\
  \ 似乎正在朝着提供一种定义与权限集相关的许可证要求的途径迈进。在编写本文时，开发人员不支持创建自己的权限集许可证；这似乎是下一个显而易见的步骤。在设计用作许可证控制的权限集时，这是需要考虑的事项，例如，有一天您可能能够使用此方法来强制实施与\
  \ **比赛管理** 权限相关的高价许可证的定价模型。\n\n在软件包组织中执行以下步骤来试用此流程：\n\n1. 创建比赛管理自定义应用程序（在“设置 | 创建”下），并将之前创建的车手、赛季和比赛选项卡添加到其中；将比赛选项卡设为默认。\n\
  2. 创建比赛分析自定义应用程序，并将比赛和报告选项卡添加到其中；将报告选项卡设为默认。\n3. 按照下表所示创建 FormulaForce 应用程序的权限集。将用户许可证字段保留为“无”。\n\
  4. 最后，将以下权限集添加到 FormulaForce 软件包中。\n\n| 权限集 | 权限 |\n|---|---|\n| FormulaForce -\
  \ 比赛管理 | 比赛管理 (自定义应用程序) 比赛分析 (自定义应用程序) 赛季选项卡 (自定义选项卡) 比赛选项卡 (自定义选项卡) 车手选项卡 (自定义选项卡)\
  \ 对象 (自定义对象, 完全访问权限) 比赛对象 (自定义对象, 完全访问权限) 车手对象 (自定义对象, 完全访问权限) 参赛者对象 (自定义对象, 完全访问权限)\
  \ |\n| FormulaForce - 比赛管理 - 更新 DNF 状态 | 参赛者对象 (自定义对象, 读取, 编辑) DNF (自定义字段, 读取, 编辑)\
  \ |\n| FormulaForce - 比赛分析 | 比赛分析 (自定义应用程序) 比赛对象 (自定义对象, 只读, 读取 DNF) |\n\n此处，完全访问权限意味着它授予对所有自定义字段的读取、创建、编辑和删除访问权限。另外，在编写本文时，权限集中的自定义应用程序和自定义选项卡组件不可打包。在它们变得可打包之前，建议您仍在权限集中维护此信息。\n\
  \n## 您的代码和安全审查注意事项\n\n您编写的并非所有代码都会自动通过用户分配的权限集或配置文件定义的对象级和字段级安全性，由平台强制执行。虽然某些 Visualforce\
  \ 组件（例如 `apex:inputField` 和 `apex:outputField`）会强制执行安全性，但获取或向用户显示信息的其他方式则不会强制执行安全性，例如\
  \ `apex:inputText` 和 `apex:outputText`。这些差异将在后面的章节中详细讨论。\n\n当您的代码在控制器中对字段执行计算或转换时，请通过控制器上的\
  \ Apex 绑定或远程操作方法间接公开此数据；为此，您需要自行添加其他检查。这也适用于面向客户的任何 Apex 代码，例如您构建的 `global` 方法或\
  \ Apex REST API。\n\n在这些情况下，您可以使用 **Apex Describe** 功能专门检查用户的配置文件或权限集分配以获取访问权限，并通过返回错误或抛出异常来防止进一步执行。实现此功能的正式参考信息可以在以下两篇\
  \ Salesforce 文章中找到：\n\n- **强制执行 CRUD 和 FLS:** https://developer.salesforce.com/page/Enforcing_CRUD_and_FLS\n\
  - **测试 CRUD 和 FLS 强制执行:** https://developer.salesforce.com/page/Testing_CRUD_and_FLS_Enforcement\n\
  \nSalesforce 安全审查扫描器和团队坚持要求您检查自定义对象级安全性（CRUD 安全性的简称），并包括检查访问的每个字段（**字段级安全性 (FLS）**）。\n\
  \n实现检查两者的代码需要仔细考虑、规划和监控。实现 FLS 特别复杂，多个用例和上下文在代码库中应用不同的使用模式。对于某些功能，您可能希望应用程序代表用户访问某些对象和/或字段而不检查安全性；请好好记录这些情况，因为您可能需要向\
  \ Salesforce 演示它们。\n\n\n\n\n实现CRUD安全是我们将在后面章节中重新审视的内容，这些章节将涉及Apex代码的Domain和Selector层，其中用于支持这些模式的库内已提供了一些自动化支持。\n\
  \n> 最好是审查并记录你的方法，并将CRUD和FLS检查作为定义编码规范的一部分；如果有疑问，请与你的Salesforce技术客户经理（TAM）讨论，或在Partner\
  \ Portal中提交支持案例。这样，在向安全审查团队提供投入和背景时，你也会有一些可供参考的决策和对话。与此同时，包括我自己在内的Salesforce社区正在探索创建通用方式来强制执行CRUD和FLS，而无需在代码库中看到硬编码检查。\n\
  \n请注意，将`with sharing`关键字应用于Apex类并不会自动强制执行CRUD或FLS安全，这是一个常见的误解，但实际上不会。此关键字仅控制查询对象时返回的记录，因此实际上仅与数据安全相关。\n\
  \n## 数据安全\n\n无论最终用户通过其配置文件或权限集分配可以访问哪些自定义对象或字段，仍可能存在筛选特定用户可见记录的要求，例如，比赛期间及之后的某些赛事数据仅对拥有的团队可见。\n\
  \nSalesforce允许通过每条记录上的**所有者**字段以及可选的名为共享的设施来控制这种安全级别。这是在FormulaForce应用程序的打包组织中通过**共享设置**页面（位于**安全控制\
  \ | 设置**）定义的。该页面在以下截图中显示：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_88_0.png)\n\
  \n你可以在此处看到列出的标准对象以及我们迄今创建的自定义对象。当你单击“编辑”时，默认访问显示访问选项会因对象是标准对象还是自定义对象而有所不同，因为Salesforce对某些标准对象（如价格簿）有特殊的访问模式。\n\
  \n> 请注意，当对象与父记录存在子关系时（例如Race和Session），无法控制该对象的安全性。因此，在设计应用程序对象架构时，请确保考虑你或你的用户是否需要在此对象上使用共享；如果是，最好考虑使用标准查找关系。\n\
  \n对于作为FormulaForce应用程序一部分存在的自定义对象，你可以定义公共读/写、公共只读和私有。默认值始终为公共读/写。\n\n默认访问定义了平台使用所有者字段和对象的共享规则确定给定记录可见性的起始位置。换句话说，如果对象具有公共读或公共读/写默认访问权限，你无法使用这些功能向给定用户隐藏记录。\n\
  \n虽然此设置随自定义对象打包，但在订户组织中可编辑，因此不可升级。如果你决定在以后的版本中更改此设置，这将需要作为安装后任务手动完成。\n\n如果你设置了私有默认访问权限且不执行任何操作，所有者字段将决定记录的可见性。默认情况下，所有者是创建记录的用户。因此，用户只能看到他们创建的记录或角色层次结构中低于他们的其他用户创建的记录（如果已启用）。记录所有者可以是用户或组（在API中称为队列），例如特定赛车团队的成员。用户还可以选择将他们拥有的记录手动共享给其他用户或组。\n\
  \n有时，需要更复杂和动态的逻辑；在这种情况下，可以添加共享规则，并且可以声明式（从共享设置页面）或以编程方式创建它们。无论使用哪种方法，平台都会创建一个共享对象（例如，对于RaceData__c对象，它将是RaceData__Share），该对象包含评估共享规则所得的记录；这些记录可以像任何其他对象一样查询，有助于调试。\n\
  \n为实现最大灵活性，你可以在Apex触发器或计划作业中编写逻辑，以直接创建、更新或删除共享记录，例如在RaceData__Share对象中。在这种情况下，共享记录的标准可以是你能在代码中表达的几乎任何内容。你首先针对适用的自定义对象定义共享原因，它将自动包含在你的包中。这用作你的应用程序代码创建的共享记录与通过订户组织中定义的共享规则创建的共享记录之间的一种标记。还要注意，如果平台检测到共享设置页面上列出的给定对象的共享对象引用，它将阻止订户组织管理员将默认访问权限从私有更改为公共。\n\
  \n## 你的代码和安全审查注意事项\n\n当用户尝试在Salesforce UI中直接导航到记录时，平台将强制执行记录可见性，包括他们运行的报告以及使用第三方应用程序时通过Salesforce\
  \ API提供的访问。\n\n但是，请记住，你的Apex代码默认在系统级别运行；因此，需要注意`with sharing`或`without sharing`关键字的使用（针对代码的所有关键入口点）。这也是安全审查扫描器会查找的内容。你或许会问何时使用`without\
  \ sharing`关键字有意义；这种用例可能是当你明确希望系统级逻辑代表用户执行的操作或验证查看所有记录时。\n\n## 平台API\n\nSalesforce提供许多API来访问和操作属于CRM等应用程序的其自身对象中的记录；这些API也扩展以支持由管理员创建或由安装在订户组织中的包提供的自定义对象。Salesforce投入了大量自身和社区驱动的文档资源，你可以在向合作伙伴和客户开发人员教授这些API的使用时参考这些资源。因此，确保你的应用程序与这些API良好协作非常重要。\n\
  \n平台API已为企业版及以上组织启用，尽管如果你需要在专业版或群组版组织中消费它们，Salesforce可以提供合作伙伴API令牌（在安全审查完成后）以启用其使用；这专属于你的应用程序，因此不提供对除你的代码以外的代码的访问。\n\
  \n通常，除非你正在开发伴随应用程序的非平台实用程序或集成，否则你的应用程序可能根本不会消费这些API，尽管以下项目符号中突出显示了一些你可能希望考虑的API。但是，请记住，如果你这样做，除了合作伙伴API令牌外，还将消耗订户组织的每日API限额；因此，请确保你的使用尽可能网络优化。\n\
  \n企业级客户通常在平台内外都有复杂的集成要求；通常，Salesforce利用SOAP和REST技术将这些API提供给任何数量的平台和语言，例如Java和Microsoft\
  \ .NET。在*第9章，提供集成和可扩展性*中，我们将讨论如何使用你自己的更多应用程序进程导向API来扩展平台数据导向API的功能。\n\n> 请注意，并非所有平台API都有可以直接调用的Apex变体，但这不一定意味着它们无法使用。\n\
  > Apex支持通过WSDL或通过直接创建和解析所需请求或响应来发出出站HTTP调用。一个很好的示例是Metadata API，它可以用于开发Visualforce向导以通过Apex自动化常见设置任务，如本章稍后所示的Apex示例（可稍后删除）。\n\
  \n以下列表详细介绍了企业级客户在围绕你的应用程序开发解决方案时可能有用的一些主要API：\n\n- **企业API**：此SOAP API根据订户组织中当时存在的对象动态生成，这意味着任何消耗它的工具（例如数据映射工具）或开发人员都会发现所暴露的信息更加熟悉且更易于访问。然而，一个缺点是，使用此API可能会非常庞大，因为企业客户组织通常包含数百个对象和字段。\n\
  - **合作伙伴API**：这也是一个SOAP API；与企业API不同，它提供更通用的基于CRUD的API来访问订户组织中的记录。其名称可能有些误导，因为非合作伙伴也可以使用它，并且由于它比企业API更轻量，因此通常是首选。\n\
  - **REST API**：这提供另一种CRUD风格的API，类似于合作伙伴API，但在此基于更流行的REST技术标准。在构建移动应用程序时通常更倾向于使用它，并且它也正在迅速成为Java和.NET的默认API。\n\
  - **元数据API和工具API**：这些SOAP API提供了一种手段来自动化在**设置**菜单下执行的许多任务，以及开发人员在编辑代码时执行的任务。虽然这些对与你的应用程序集成的人员可能不是直接感兴趣，因为许多任务最初只执行一次，然后很少执行，但你可能希望考虑在要提供的工具中使用它们，以保持你的应用程序的实施时间较短。\n\
  \n\n\n\n## 与 OK 平台 API 协同工作的注意事项\n\n以下是一些注意事项，用于确保您的应用程序对象能够很好地与 OK 平台 API 协同工作：\n\
  \n- Streaming API：该 API 使用一种称为 Bayeux 协议的 HTTP 长轮询协议，允许调用方近乎实时地监控并记录 Salesforce\
  \ 中的活动。该 API 可用于页面上，在赛事数据到达时进行监控，并以近乎实时的方式向用户显示。\n\n- Replication API：有时无法或不希望通过自定义对象将所有数据迁移到\
  \ Salesforce。在某些情况下，此迁移过于复杂或成本过高。此 REST 和 Apex API 允许复制解决方案确定在给定时间段内，给定对象的哪些记录已被创建、更新或删除。\n\
  \n- Bulk API：此基于 REST 的 API 允许以 CSV 或 XML 格式导入和导出大量记录，每个批量作业的大小可达 10 MB。\n\n- 命名自定义对象和字段：在命名自定义对象和字段时，请注意\
  \ API 名称（有时也称为开发者名称）。这是在前一节提到的 API 和 Apex 代码中引用对象或字段时使用的名称。就我个人而言，我更喜欢移除 Salesforce\
  \ 设置 UI 在您从“标签”字段移出时自动放置在默认 API 名称中的下划线字符，因为这样做可以使 API 名称更短、更易于输入，并且下划线字符更少。最终结果将反映大多数\
  \ API 使用的驼峰命名法，例如，RaceData_c 而不是 Race_Data__c。\n\n- 标签和 API 名称一致性：虽然在应用程序的不同版本之间可以重命名自定义字段的标签，但无法重命名\
  \ API 名称。尽量避免这样做，因为字段标签与 API 名称之间的不一致会使业务用户和开发人员更难协作并定位正确的字段。\n\n- 命名关系：每当您定义主详细关系或查询关系时，平台都会使用对象的复数标签值来形成关系\
  \ API 名称。在作为子查询一部分查询相关记录时会使用此 API 名称，例如，select Id, Name, (select Id, Name from Races)\
  \ from Season__c。创建关系字段时，请注意子关系名称字段中输入的默认值（如需可移除下划线），并检查名称是否合理。\n\n例如，如果您在 Race__c\
  \ 对象上创建一个名为“Fastest Lap By”的指向 Driver__c 对象的查询字段，默认的关系 API 名称将是 Races。在子查询上下文中使用此名称时，它将类似于\
  \ select Id, Name, (select Id, Name from Races) from Race__c。但是，如果将关系命名为 FastestLaps，则会生成更具自描述性的查询：select\
  \ Id, Name, (select Id, Name from FastestLaps) from Race__c。\n\n- Apex 触发器批量化和性能：测试\
  \ Apex 触发器时，请确保能够容纳多达 200 条记录；这是 Salesforce 在使用其批量 API 时推荐的默认块大小。这验证了围绕批量化最佳实践的标准准则；虽然可以配置更小的块大小，但这通常会缩短整个过程的执行时间。与执行时间相关的还有\
  \ Apex 触发器代码中花费的时间，当用户仅更新在订阅组织中添加的字段时。在这种情况下，执行 Apex 触发器逻辑大多是多余的，因为该逻辑关心的字段都不会发生变化。因此，请鼓励优化\
  \ Apex 触发器逻辑，仅在打包字段发生更改时才执行昂贵操作（例如执行 SOQL）。\n\n## 本地化与翻译\n\n从一开始就考虑本地化和翻译非常重要，因为稍后应用起来可能会变得困难且成本高昂。幸运的是，平台可以为您完成大量工作。\n\
  \n### 本地化\n\n使用原生用户界面时，它会根据用户配置文件中的 **区域设置** 字段自动格式化数值和日期字段的值。使用 `apex:outputField`\
  \ 和 `apex:inputField` 组件的 **Visualforce** 页面将自动格式化值，以任何其他方式输出区域敏感值则需要在 Apex 控制器代码或\
  \ JavaScript 代码中手动处理。\n\n> 如前一章所述，并非总是可以使用 Visualforce apex:inputField 和 apex:outputField\
  \ 标记。例如，如果您显示的信息不包含在自定义对象字段中，而是包含在 Apex 控制器中的某些计算视图状态中。Date、DateTime 和 Decimal 等各种类型类上的格式方法可以用于生成格式化的字符串值，您可以在页面上将其绑定。您还可以通过\
  \ UserInfo.getLocale() 确定用户的 ISO 区域设置代码。\n\n### 翻译\n\n在定义自定义对象、字段和布局等组件时输入的文本会自动提供给\
  \ Salesforce **翻译工作台** 工具。但是，Apex 代码和 Visualforce 页面中使用的文本需要开发人员通过使用自定义标签来特别关注。\n\
  \n在向最终用户构建消息时，重要的是要避免拼接自定义标签值，因为这会使翻译人员更难理解消息的上下文，并在需要时为其他语言重新排序消息的上下文。例如，考虑消息 `The\
  \ driver XYZ was disqualified`。不良做法是：\n\n```\nString message =\n    Label.TheDriver\
  \ + driverName + Label.WasDisqualified;\n```\n\n良好做法如下：\n\n```\nString message =\
  \ String.format(\n    Label.DriverDisqualified, new String[]{driverName});\n```\n\
  \n将按以下方式定义 `DriverDisqualified` 自定义标签：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_95_0.png)\n\
  \n> 创建自定义标签时，请务必注意 **受保护** 复选框。如果取消选中它，最终用户可以引用您的标签，如果您希望他们重复使用您的消息（例如在自定义 **电子邮件模板**\
  \ 或 **Visualforce** 页面中），则可能需要考虑这一点。但是，缺点是此类标签无法（目前）从您的包中删除，因为您的功能会发生变化。\n\n最后，请记住，在\
  \ Visualforce 中可以在 `apex:pageBlockSection` 内使用 `apex:outputField`，字段标签将自动呈现在页面上的字段旁边。\n\
  \n### 构建可定制的用户界面\n\n您的应用程序交付的用户界面中最可定制的方面是 Salesforce 通过其高度可定制的布局编辑器提供的界面，该编辑器提供了自定义用于列出、创建、编辑和删除记录的标准用户界面页面（包括当前通过移动客户端\
  \ Salesforce1 交付的页面）的功能。\n\nLightning Experience 是面向桌面用户提供的最新用户界面体验。Salesforce Classic\
  \ 或 Aloha 是现有用户界面的名称。它在外观和技术上都截然不同。幸运的是，您在布局和 Visualforce 方面的现有投资仍然兼容。然而，Lightning\
  \ 带来了更多以组件驱动的方面，并随附允许对整体用户体验进行更大程度自定义的新工具。\n\n请记住，任何未利用标准用户界面的交付用户体验通常都需要开发人员付出额外努力，通常利用自定义设置和字段集来提供定制功能。可以使用\
  \ Visualforce 页面或 Lightning 组件来自定义标准用户界面的部分内容或完全替换它。第 8 章“用户界面”中将更详细地介绍此内容。\n\n\
  > > 值得注意的是，订阅组织管理员可以修改在您的自定义对象上定义和打包的页面覆盖，以重新启用 Salesforce 标准用户界面，而不是使用您打包的 Visualforce\
  \ 页面。因此，请记住对所有自定义对象布局给予一些美观方面的关注。另外，请注意，操作覆盖和布局组件不会被升级。\n\n### 布局\n\n以下是超出标准部分和字段顺序之外的可定制功能的简要摘要。这些功能允许您添加图表和自定义\
  \ UI，以帮助将布局定制与 Visualforce 的灵活性和强大功能相结合：\n\n- **Visualforce**：布局部分允许您使用标准控制器嵌入 Visualforce\
  \ 页面。虽然这仅在标准视图页面上受支持，但您可以在 Visualforce 页面本身上执行任何操作。\n\n- **报表图表**：最近，平台添加了将报表图表嵌入布局的功能。这是一个强大的功能，可使用参数化报表来增强提供给用户的信息。\n\
  \n- **操作**：这允许您以声明式或编程方式描述超出标准平台操作的其他操作。仅当您为对象启用了 Chatter 时，这些操作才适用。\n\n- **自定义按钮**：类似于操作，这允许在详细信息和列表视图页面上添加其他按钮以调用应用程序特定功能。第\
  \ 8 章“用户界面”中介绍了创建自定义按钮并将其连接到 Apex 代码的方法。\n\n\n\n\n## Visualforce\n\n在考虑构建专用或甚至嵌入式（在布局中）Visualforce\
  \ 页面时，始终要考虑那些希望使用自己的自定义字段扩展页面布局和/或表格的最终用户。字段集是实现这一点的最佳方式；后面的章节将更详细地介绍这一点。\n\n##\
  \ Lightning App Builder 和组件\n\nLightning App Builder（可在“设置”菜单下使用）可由订户组织中的用户用于自定义\
  \ Salesforce Mobile 和 Lightning Experience 的用户体验。该工具允许用户使用拖放工具构建全新页面，以及自定义 Salesforce\
  \ 提供的现有 Lightning Experience 页面，例如主页和记录详细信息页面。\n\n> 记录详细信息组件利用通过现有布局编辑器定义的现有布局来确定显示记录时字段的布局。\n\
  \nLightning 组件是确定 Salesforce Mobile 和 Lightning Experience 用户体验中可用的信息和功能的基本构建块。Salesforce\
  \ 提供一些标准组件，其他开发者也可以构建组件，并将其包含在您的包中以暴露您的功能。在后面的章节中，我们将深入探讨 Lightning 的架构及其如何影响您在应用程序中交付功能的方式。\n\
  \n## 使用电子邮件模板自定义电子邮件\n\n使用 Apex，您可以编写代码使用 Messaging API 发送电子邮件。这允许您动态生成要发送的电子邮件的所有属性，包括发件和收件地址、主题标题和正文。但是，请记住，最终用户很可能希望向这些电子邮件添加自己的徽标和消息，即使这些电子邮件只是面向其内部用户的通知。\n\
  \n与在代码中硬编码电子邮件结构相比，请考虑使用电子邮件模板（在 **设置** 菜单下）。此功能允许订户组织中的管理员使用替换参数创建自己的电子邮件，以注入您对象定义的记录中的动态值。例如，使用自定义设置，您可以要求他们配置电子邮件模板的\
  \ `DeveloperName` 以便在您的代码中引用。您可以将电子邮件模板打包作为进一步自定义的起点，但请记住，它们不可升级。\n\n> 如果要包含在电子邮件中的数据不是作为自定义对象记录上的字段或公式字段存储的，请考虑在您的包中提供一些可在\
  \ Visualforce 电子邮件模板中使用的 Visualforce 自定义组件。这些组件可用于从电子邮件模板调用 Apex 代码，以查询信息和/或执行计算或重新格式化信息。\n\
  \n## 流程构建器、工作流和流\n\nSalesforce 提供多种声明式工具来实现业务流程和自定义用户体验流。最终用户操作（例如为记录创建、更新或启动审批流程）可以通过名为\
  \ **工作流和流程构建器** 的两个工具进行自定义。当您需要实现提供向导或访谈式用户体验的 UI 流时，可以使用 **可视化流** 工具。该工具可用于定义需要读取和更新记录的更复杂的条件业务流程。自动化流（有时称为“无头流”）是不与用户交互的可视化流，可以在\
  \ Apex 代码以及流程构建器中引用。\n\n流程构建器是工作流的继任者。它提供与工作流相同的功能，此外还具有用于更新子记录等附加功能以及面向开发者的可扩展性。它还具有更现代的图形布局，使最终用户更容易构建和可视化更复杂的流程。虽然您可以互换使用两者，但最好专注于其中一种，以便更轻松地定位和维护自定义。\n\
  \n作为应用程序开发者，这些可以作为您的应用程序的一部分创建和打包。此类组件可升级（前提是它们被标记为 **受保护**）。但是，通常包开发者倾向于将这些功能的使用留给顾问和订户组织管理员，而优先使用\
  \ Apex 和/或 Visualforce，因为在这些工具中可以创建更复杂的逻辑和用户体验。\n\n正如管理员可以使用这些工具来自定义他们的组织一样。您可以考虑通过可调用方法公开您的\
  \ Apex 驱动的应用程序业务流程，以有效扩展管理员通过这些工具可用的功能。换句话说，这允许流程构建器和可视化流工具的用户通过点击而非代码来调用您的应用程序功能。我们将在第\
  \ 10 章“提供集成和可扩展性”中再次探讨这一点。\n\n## 社交功能和移动端\n\nChatter 是平台的关键社交功能；它可以让您的应用程序的用户围绕应用程序中的记录进行协作和上下文通信，并可选择使用\
  \ Chatter Communities 功能邀请他们的客户也这样做。这是平台的一个强大方面，但介绍其细节超出了本书的范围。\n\n您可以在“设置”下的 Chatter\
  \ 设置页面启用 Chatter，之后可以为您的自定义对象启用信息源跟踪（也在“设置”下）。此设置可打包，但不可升级，并且可以由订户组织管理员禁用。在打包对 Chatter\
  \ 的此类引用以及包含对各种 Chatter 相关对象的引用时要小心，因为这会在您的包中放置打包安装依赖项，要求所有客户也启用此功能。\n\n通过在自定义对象上创建操作，您可以为用户提供在记录上执行常见活动的快速方式，例如，将参赛者的状态更新为\
  \ DNF。这些操作也可以通过 Salesforce1 Mobile 应用程序查看，因此与标准记录编辑相比，它们进一步提高了移动用户的生产力。\n\n在打包组织中执行以下步骤以试用此过程：\n\
  \n- 1. 如前所述，为 Race、Driver 和 Contest 自定义对象启用信息源跟踪；正在跟踪的字段对以下步骤不重要，但您可以全部选择它们，以便更好地了解\
  \ Chatter 生成的通知类型。还要从 Chatter 设置页面启用发布者操作。\n\n- 2. 导航到参赛者对象定义，找到“按钮、链接和操作”部分。创建一个新操作，并按如下所示完成屏幕：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_100_0.png)\n\n- 3. 当系统提示设计操作布局时，接受显示的默认布局并单击保存。在显示的参赛者操作页面上，单击新建以添加新的预定义字段值选项，以将\
  \ TRUE 分配给 DNF 字段，作为更新记录操作的一部分：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_100_1.png)\n\
  \n- 4. 最后，编辑 **参赛者** 布局，并将 **退出比赛** 操作拖到布局上（在执行此操作之前，您可能需要在布局编辑器中单击 **覆盖全局发布者布局**\
  \ 链接）。\n\n- 5. 执行这些步骤后，您将在 UI 中看到显示的 **退出比赛** 操作，如以下屏幕截图所示。如果您在 Salesforce Classic\
  \ UI 中查看参赛者记录，则该操作从页面 Chatter UI 区域的下拉菜单中访问，外观如下。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_101_0.png)\n\
  \n如果您在 Lightning Experience UI 中查看参赛者记录，它将如下所示：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_101_1.png)\n\
  \n请注意，Lightning Experience 将操作“退出比赛”按钮从 Salesforce Classic 的 Chatter UI 重新定位，以将其与其他与记录相关的按钮（右上角）并列显示。还使用了模态弹出窗口样式。这是\
  \ Salesforce 为您定义的现有功能采用不同 UX 设计的众多示例之一。\n\n您可以在“设置”菜单下为用户启用 Lightning Experience\
  \ UI，并按照屏幕上的说明启用它。启用后，您可以在两种 UI 类型之间切换。\n\n如果您通过 Salesforce1 Mobile 应用程序查看记录，它看起来像这样：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_102_0.png)\n\n\n\n\n完成本章中的步骤后，请花时间查看包的内容，然后再次上传并测试在测试组织中对包进行升级。安装升级时，您应该会看到类似下图所示的确认页面，其中显示正在安装新的或已更改的组件：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_103_0.png)\n\n尽管只显示了截图的一部分，但您可以看到它显示了本章添加的自定义应用程序、操作和权限集组件。在更下方，升级后的确认页面显示了更新的自定义对象和新的自定义字段，如下图所示：\n\
  \n| 操作 | 组件名称 | 父对象 | 组件类型 | 安装说明 |\n| :--- | :--- | :--- | :--- | :--- |\n| 更新\
  \ | Contestant | | 自定义对象 | 这是一个升级的组件。它将被更新到新版本。 |\n| 更新 | Driver | | 自定义对象 | 这是一个升级的组件。它将被更新到新版本。\
  \ |\n\n| 操作 | 组件名称 | 父对象 | 组件类型 | 安装说明 |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | 创建 | Active | Driver | 自定义字段 | 这是一个全新的组件。 |\n| 创建 | DNF | Contestant | 自定义字段 |\
  \ 这是一个全新的组件。 |\n| 创建 | Nationality | Driver | 自定义字段 | 这是一个全新的组件。 |\n| 更新 | Driver\
  \ | Contestant | 自定义字段 | 这是一个升级的组件。它将被更新到新版本。 |\n| 创建 | Total DNFs | Race | 自定义字段\
  \ | 这是一个全新的组件。 |\n| 创建 | Fastest Lap By | Race | 自定义字段 | 这是一个全新的组件。 |\n| 创建 | Driver\
  \ and Race | Contestant | 自定义字段 | 这是一个全新的组件。 |\n| 创建 | Year | Season | 自定义字段 | 这是一个全新的组件。\
  \ |\n\n> > 请注意，一旦在测试组织中升级了该包，Season、Driver 和 Race 的页面布局将不包含此版本包中添加的新字段。这是因为页面布局不会被升级。\n\
  \n## 摘要\n\n本章中，您了解了许多平台功能，这些功能可直接帮助您在不编写任何代码的情况下构建应用程序的关键结构和功能方面，进而使您的客户能够扩展和定制其应用程序。本章还着重于优化顾问和管理员执行安装和配置应用程序的任务。最后，您了解了订阅组织中施加的限制、避免这些限制的方法，以及在打包时需要注意这些限制。\n\
  \n继续审查和发展您的应用程序，首先寻找采用这些及其他平台功能的机会，您将确保您与客户与当前和未来平台功能的紧密契合不断增长。在下一章中，我们将深入探讨围绕平台上数据存储的选项和功能。\n\
  \n> > 请务必参考 Salesforce Limits Quick Reference Guide PDF，该文档描述了本章及其他章节中讨论的功能的最新限制，网址为\
  \ http://login.salesforce.com/help/pdfs/en/salesforce_app_limits_cheatsheet.pdf。\n"
- "# 应用程序存储\n\n在应用程序设计阶段早期，考虑客户围绕其数据创建和消费模式的存储需求和用例非常重要。这样可确保您的对象架构在处理大数据量、数据迁移过程（入站和出站）以及存储成本方面是最优的。在本章中，我们将扩展\
  \ FormulaForce 应用程序中的自定义对象，同时探索平台如何存储和管理数据。我们还将探讨应用程序的操作数据与配置数据之间的差异，以及使用自定义元数据类型进行配置管理和部署的好处。\n\
  \n您将很好地了解所提供的存储类型以及如何计算每种存储的相关成本。同样重要的是，要了解在重用或尝试镜像标准对象（如 Account、Opportunity 或\
  \ Product）时可用的选项，这将讨论进一步扩展到许可成本考虑因素。您还将了解应用程序数据上的标准索引和自定义索引选项，这将引出后面一整章中将要介绍的处理大数据量的主题。最后，我们将深入了解平台内用于消耗外部数据存储的新平台功能。\n\
  \n在本章中，我们将介绍以下主题：\n\n- 规划最终用户存储需求\n- 了解不同的存储类型\n- 记录标识、唯一性和自动编号\n- 记录关系\n- 重用现有的标准对象\n\
  - 应用外部 ID 和唯一字段\n- 导入和导出应用程序数据\n- 数据复制和归档选项\n- 外部数据源\n\n## 规划最终用户存储需求\n\n在应用程序的初始需求和设计阶段，最佳实践是创建称为角色的用户分类。角色会考虑用户的典型技能、需求和目标。基于这些信息，您还应该开始推断其数据需求，例如他们负责创建的数据（直接或间接地，通过运行流程），以及他们需要消耗的数据（报告）。完成此操作后，尝试估算他们每月将创建和/或消耗的记录数量。\n\
  \n> 与您的高级赞助商、市场研究人员、早期采用者以及最终的整个开发团队共享这些角色及其数据需求，以便他们在开发应用程序时牢记这些内容并针对其进行测试。\n\n\
  例如，在我们的 FormulaForce 应用程序中，**经理**可能会创建和消耗数据，而**赛事策略师**则主要消耗大量数据。**管理员**也会想要管理您应用程序的配置数据。最后，应用程序中很可能有一个后台流程，会生成大量数据，例如记录排位赛和正赛期间赛车和车手赛事数据的流程，例如扇区（赛道的指定部分）时间。\n\
  \n> 您可能希望将关于角色和数据需求的结论记录在电子表格中，并附上一些有助于预测数据存储需求（本章后面将讨论）的公式。在未来与 Salesforce 讨论应用程序的\
  \ AppExchange 列表过程中，这将有所帮助，在销售周期中，当潜在客户希望了解如何为已安装您的应用程序的存储成本制定预算时，这也是一个有用的工具。\n\n\
  ## 了解不同的存储类型\n\n您的应用程序记录所使用的存储占用了平台整体数据存储分配中最重要的部分。平台上还有一种用于上传或创建文件的存储类型。从设置菜单下的存储使用情况页面，您可以查看已用记录的摘要，包括驻留在\
  \ Salesforce 标准对象中的记录。\n\n本章稍后，我们将创建一个自定义元数据类型对象来存储配置数据。此类对象消耗的存储不会显示在存储使用情况页面上，而是以不同的方式进行管理和限制。\n\
  \n## 存储使用情况\n\n您组织的存储用量如下所示。\n\n| 存储类型 | 限制 | 已用 | 使用百分比 |\n| :--- | :--- | :---\
  \ | :--- |\n| 数据存储 | 256.0 MB | 284 KB | 0% |\n| 文件存储 | 902.0 MB | 13 KB | 0% |\n\
  \n## 当前数据存储用量\n\n| 记录类型 | 记录计数 | 存储 | 百分比 |\n| :--- | :--- | :--- | :--- |\n| Opportunities\
  \ | 31 | 62 KB | 22% |\n| Cases | 26 | 52 KB | 18% |\n| Leads | 22 | 44 KB | 15%\
  \ |\n| Contacts | 20 | 40 KB | 14% |\n| Campaigns | 4 | 32 KB | 11% |\n| Accounts\
  \ | 12 | 24 KB | 8% |\n| Solutions | 10 | 20 KB | 7% |\n| Drivers | 2 | 4 KB | 1%\
  \ |\n| Races | 1 | 2 KB | 1% |\n| Seasons | 1 | 2 KB | 1% |\n| Contestants | 1 |\
  \ 2 KB | 1% |\n| Tasks | 0 | 0 B | 0% |\n| Photos | 2 | 0 B | 0% |\n\n\n\n\n\n>\
  \ 前一页还显示了哪些用户使用了最多的存储空间。除了个人的 **用户详细信息** 页面外，您还可以找到 **已用数据空间** 和 **已用文件空间** 字段；在这些字段旁边有查看用户数据和文件存储使用情况的链接。\n\
  \n每个显示的限制均基于以下计算：根据组织类型分配的最小数据存储量，或用户数乘以特定的 MB 数量（此数量也取决于组织类型）；两者中较大者即为限制。有关完整详情，请点击页面上显示的\
  \ **本页面帮助** 链接。\n\n## 数据存储\n\n与其他数据库平台不同，Salesforce 通常在其存储使用量计算中使用每条记录固定 2 KB 的大小，而不考虑每条记录中实际的字段数量或字段内数据的大小。此规则有一些例外，例如\
  \ **市场活动** 占用 8 KB，而存储的 **电子邮件消息** 占用所包含电子邮件的大小，不过所有自定义对象记录均占用 2 KB。请注意，即使自定义对象使用大型文本区域字段，此记录大小也适用。\n\
  \n> Salesforce **大型对象** 提供一种不同的存储解决方案，这些对象专为存储数十亿条记录而设计，用于接收设备输入，例如在 **物联网 (IoT)**\
  \ 场景中。信息通过批量加载大量写入，随后频繁读取，换句话说，即写入少、读取多。虽然 Salesforce 未披露，但预期这些对象的存储成本将比在自定义对象中存储的等效记录更低。本章后面介绍的\
  \ Race Data 对象可被视为此类对象在 FormulaForce 应用程序中的良好候选对象，因为此信息在赛后批量上传并用于分析比赛。\n\n## 列与行\n\
  \n鉴于前一节中的计算，您可能需要考虑您的数据模型中是否存在具有已知最大值的多条数据。在这种情况下，请考虑创建多个列（或多组列）的选项，而不是创建会占用额外存储空间的新对象。目前，企业版组织每个对象最多支持\
  \ 500 个字段。例如，在 Formula 1 赛车比赛中，众所周知，比赛前只有三轮排位赛以确定起跑位置，每位车手都在争夺最快圈速。这可以建模为 Contestant\
  \ 对象的 Qualification Lap 子对象；然而，在这种情况下，它每个参赛者最多只有三条记录。更优的数据存储设计是在 Contestant 对象中创建一组新字段。\n\
  \n在打包组织中执行以下步骤以试用此过程：\n\n- 1. 在 Contestant 对象上创建三个 Number (6, 3) 类型的字段，例如 Qualification\
  \ 1 Lap Time（Qualification1LapTime__c）。创建这些字段时，请确保未选中 Required 复选框，因为并非所有车手都能进入最终排位赛轮次。\n\
  - 请注意，此处我们使用数字而不是单词，例如 QualificationOneLapTime__c，因为这在动态 Apex 遍历字段的场景中很有帮助。\n- 2.\
  \ 在 Race 对象上创建汇总摘要字段 Pole Position Lap Time，选择 Roll-Up Type 时使用 MIN 选项，并在 Field\
  \ to Aggregate 中选择 Qualification 1 Lap Time 字段，如下方截图所示：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_110_0.png)\n\
  \n- 3. 最后，更新权限集，在 Race Management 权限集中授予新添加字段的读写权限，并在 Race Analytics 权限集中授予读取权限。\n\
  \n请记住，您还可以使用公式字段为存储在列中的数据添加或应用进一步的逻辑，模拟对等效行进行筛选或聚合查询的效果。采用此方法的另一个好处是，可以减少代码需要执行的\
  \ SOQL 和 DML 操作数量。\n\n## 可视化您的对象模型\n\n构建对象模型的实体关系图（ERD）是一个重要的理念；这不仅是您和您团队的良好资源，还可以帮助您的客户了解他们创建的数据存储在哪里，并帮助他们构建报表和集成解决方案。Salesforce\
  \ 提供了一个名为架构生成器的交互式工具（可通过设置下的对象页面中的按钮访问）来提供帮助；它还可用于创建新对象和字段。在本书的这个阶段，FormulaForce\
  \ 应用程序数据模型应类似于此：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_111_0.png)\n\n### 配置数据注意事项\n\
  \n大多数应用程序都需要提供某种方式来配置其功能，以便管理员和用户可以根据自身需求进行定制。如第 2 章“利用平台功能”中所示，Salesforce 为您和您的用户提供了大量这方面的设施。但是，如果您希望为其提供配置的应用程序部分是特定于您的应用领域的，例如每个赛道的官方最快圈速列表，该怎么办呢。\n\
  \n在我们的情况中，假设我们希望作为包的一部分向客户提供每个赛道当前批准的最快圈速列表，这样他们就无需自行查找并手动输入。但是，您仍希望允许用户管理应用程序未知赛道的最快圈速。\n\
  \n在考虑自定义对象之前，自定义设置和自定义元数据类型是两个值得考虑的平台功能，用于存储和管理应用程序的配置。自定义元数据在许多方面都是这两种替代方案的后继者，但目前仍有一些功能可能会促使您考虑使用其他选项。\n\
  \n下表可帮助您根据配置要求决定使用哪种对象类型：\n\n| 配置对象要求 | 自定义对象 | 自定义设置对象 | 自定义元数据类型对象 |\n| :--- |\
  \ :--- | :--- | :--- |\n| 对象可以对组织管理员隐藏 | 否 | 是 | 是 |\n| 记录可以包含在您的包中 | 否 | 否 | 是\
  \ |\n| 打包的记录可防止用户编辑并可升级 | N/A | N/A | 是 |\n| 可以控制对打包记录字段的编辑 | N/A | N/A | 是 |\n\
  | 标准 Salesforce UI 布局可以定义并打包 | 是 | 否 | 是 |\n| 支持对象关系以进行更复杂的配置 | 是 | 否 | 是 |\n| Apex\
  \ 访问 | CRUD | CRUD | 读取 ** |\n| 记录可以在组织、用户或配置文件级别定义 | 否 | 是 | 否 |\n| 记录可以通过验证规则和/或\
  \ Apex 触发器应用自定义验证 | 是 | 否 | 否 |\n| 减少配置管理开销 | 重新录入或使用数据加载器 | 重新录入或使用数据加载器 | 默认安装，也可使用原生变更集和包来管理客户特定配置\
  \ |\n| 合作伙伴和其他开发人员构建包装特定形式配置的扩展包的能力 | 否 | 否 | 记录也可以包含在扩展包中 |\n\n\n\n\n\n> 读取自定义元数据类型记录时，可以使用\
  \ SOQL，且不计入 SOQL 查询限制，不过 50k 行限制仍然适用。自定义元数据类型记录可以使用 Salesforce SOAP Metadata API\
  \ CRUD 操作进行操作。\n>\n> 尽管可以通过 Apex 调用 Metadata SOAP API，但 HTTP 调用相关的限制仍然适用。围绕 HTTP\
  \ 调用频率及可进行调用时间的限制，使得在扩展到 200 条记录以上时，这种方法不太理想。此外，调用之间不支持维护引用完整性，因为 API 调用周围没有数据库事务范围。在撰写本文时，Salesforce\
  \ 已宣布原生支持 Metadata API 正在开发中，尽管其声明中没有交付承诺。\n\n在我们的情况中，将圈速配置记录打包并允许其升级的需求与自定义元数据类型非常契合。此外，无需从\
  \ Apex 以编程方式更新此配置信息，只需读取它。\n\n当前无法更新自定义元数据类型记录，如果您希望为配置构建自定义 UI，这可能会成为问题；在我们的情况中，标准\
  \ Salesforce UI 已足够。\n\n## 自定义元数据类型存储\n\n从设置中的自定义元数据类型页面，您既可以创建自定义元数据类型对象，也可以管理其包含的记录。您创建的任何记录都可以包含在您的包中，因此在安装包后即可立即供您的\
  \ Apex 逻辑使用。\n\n执行以下步骤以创建圈速记录 MDT 对象。\n\n- 1. 单击 New 创建一个圈速记录自定义元数据类型，并将 `TrackLapRecords`\
  \ 输入为 API 名称。\n- 2. 从 Visibility 字段中选择 **所有 Apex 代码和 API 都可以使用此类型**，并且在设置中可见。之所以这样做，是因为我们希望管理员除了我们包含的记录外，还能记录自己的最快圈速。如果此对象中的所有记录仅供您的应用程序逻辑使用（例如用于内部配置），则应选择\
  \ **仅同一托管包中的 Apex 代码可以看到此类型** 选项。\n- 3. 描述新自定义元数据类型对象的页面与自定义对象使用的页面非常相似。如上一表所述，您无法定义验证规则和自定义按钮等某些功能，不过与自定义设置相比，您可以定义自己的布局。此外还有更多字段类型可用。\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_115_0.png)\n\n请注意，自定义元数据类型对象的 API 名称以\
  \ _mdt 结尾，并且具有不同的标准字段。我们将使用 DeveloperName 字段作为实现圈速的赛道的唯一名称。稍后，我们将此对象中的记录包含到包中。isProtected\
  \ 字段用于确定记录的数据是否可以由包的管理员编辑。\n\n按照以下步骤在对象上创建一些字段。\n\n- 1. 按照下表创建以下字段。接受 Field Manageability\
  \ 字段中显示的默认值。\n- 2. 将圈速记录自定义元数据类型对象添加到包中。\n\n| 对象 | 字段名称和类型 |\n| :--- | :--- |\n\
  | TrackLapRecords__mdt | DriverName__c Text(60) |\n| | Time__c Number(5,3) |\n|\
  \ | Year__c Text(4) |\n\n您在创建上述字段时可能已注意到以下选项：\n\n| 字段可管理性 | 通过托管包安装记录后，谁可以更改字段值？\
  \ |\n| :--- | :--- |\n| | 仅包开发者（通过包升级） |\n| | 具有自定义应用程序权限的任何用户（包升级不会覆盖该值） |\n| |\
  \ 无人 |\n\n此选项仅适用于包中包含的记录。它确定包管理员可以更改这些记录的哪些字段。例如，您可能希望向对象添加一个管理员可以编辑的 Notes 文本字段，但保护所有其他字段。对于我们在此处添加的字段，默认值很重要，因为我们希望包更新更新应用程序已知赛道上的新圈速记录的更改。\n\
  \n| 操作 | 字段标签 | API 名称 | 数据类型 | 字段可管理性 | 已编制索引 | 控制字段 | 修改者 |\n| :--- | :--- | :---\
  \ | :--- | :--- | :--- | :--- | :--- |\n| 编辑 | 删除 | 驱动程序名称 | DriverName__c | Text(60)\
  \ | Upgradable | | App Developer, 06/08/2016 13:26 |\n| 编辑 | 删除 | 时间 | Time__c |\
  \ Number(5, 3) | Upgradable | | App Developer, 06/08/2016 13:27 |\n| 编辑 | 删除 | 年份\
  \ | Year__c | Text(4) | Upgradable | | App Developer, 06/08/2016 13:28 |\n\n输入以下示例数据。从对象定义页面单击管理圈速记录开始输入配置数据。添加记录时，取消选中受保护复选框。\n\
  \n**保护：** 这决定记录在客户组织中是否可见。受保护的记录对用户隐藏，但您自己的打包 Apex 代码仍可查询它们。对内部配置使用受保护的记录。\n\n###\
  \ 圈速记录\n\n| 操作 | 标签 | 圈速记录名称 | 命名空间前缀 | 受保护组件 | 时间 | 驱动程序名称 | 年份 |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- | :--- | :--- |\n| 编辑 | Circuit Spa-Francorchamps\
  \ | Circuit_Spa_Francorchamps | ff2 | | 105.108 | Kimi Räikkönen | 2004 |\n| 编辑\
  \ | Nürburgring | Nurburgring | ff2 | | 84.468 | Michael Schumacher | 2004 |\n|\
  \ 编辑 | Silverstone Circuit | Silverstone_Circuit | ff2 | | 90.874 | Fernando Alonso\
  \ | 2010 |\n\n您还可以定义 **列表视图**，以便在打包组织中更轻松地管理自定义元数据类型记录。最初无法编辑默认的 **全部** 视图，但您可以创建同名视图；单击\
  \ **创建新视图**。此列表视图不会打包。\n\n自定义元数据类型记录使用的存储空间不会在 **存储使用量** 页面上显示。使用的计算基于字段大小的最大记录大小，而不是自定义对象使用的标准\
  \ 2 KB。用户创建的记录总计可达 10 MB。您的打包记录也有自己的 10 MB 限制。您可以通过查看 **自定义元数据类型** 页面上显示的记录大小来计算使用的存储空间。\n\
  \n## 所有自定义元数据类型\n\n自定义元数据类型使您能够创建自己的设置对象，其记录是元数据而非数据。这些通常用于定义需要从一个环境迁移到另一个环境，或打包并安装的应用程序配置。与其从自定义对象或自定义设置中的数据记录构建应用，不如创建自定义元数据类型并添加元数据记录，享受元数据带来的所有可管理性：打包、部署和升级。查询自定义元数据记录不计入\
  \ SOQL 限制。\n\n### 新建自定义元数据类型\n\n| 操作 | 标签 | 命名空间前缀 | 可见性 | API 名称 | 记录大小 | 描述 |\n\
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 删除 | 管理记录 | Track Lap Record\
  \ | | 公开 | TrackLapRecord__mdt | 213 |\n\n要将记录添加到包中，请执行以下步骤：\n\n- 1. 从 **包详细信息**\
  \ 页面单击 **添加组件**。\n- 2. 从下拉列表中选择 **圈速记录**，并选择所有记录。\n\n完成步骤 2 时，添加到包页面将如下所示：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_118_0.png)\n\
  \n> 小知识：在试点阶段，自定义元数据类型功能称为“平台即平台”。后来品牌发生了变化，但当时 Salesforce 认为这描述了这项技术的一个潜力：开始构建您自己的平台包，向平台添加新的元数据类型。如前所述的注意事项表所示，其他人打包您的自定义元数据类型记录的能力是这一愿景的实现。\n\
  \n## 自定义设置存储\n\n自定义设置在数据存储限制方面与自定义对象略有不同，因为它们不存在于同一存储区域。自定义设置非常适合经常读取但很少写入的数据。Salesforce\
  \ 将这些对象中的数据缓存在其所谓的应用程序缓存中，并提供一种快速查询的方式，而不应用查询限制。但是，与自定义对象不同，它们不支持 Apex 触发器或验证规则。\n\
  \n每个组织、每个命名空间对自定义设置可消耗的存储空间有限制。这意味着，如果您创建自定义设置并将其添加到托管包中，它将拥有自己的存储限制。自定义设置的存储限制从完全许可用户的\
  \ 1 MB 开始，最高可达 10 MB。您可以从设置中的自定义设置页面查看当前的存储使用情况。\n\n\n\n\n\n## File storage\n\n\
  Salesforce 用于存储基于文件的数据的方式日益增多，从历史悠久的 Document 标签页，到更复杂的 Content 标签页，再到使用 Files 标签页，更不用说如果启用了附件（Attachments），还可以将其应用于自定义对象记录。每种方式都有其自身的优缺点，文件大小限制在\
  \ Salesforce 文档中有明确定义。未来 Salesforce 将仅支持 Files，因此建议使用此方式而非其他文件存储选项。例如，只有 Files 标签页在\
  \ Lightning Experience 中受支持。\n\n从应用程序开发的角度来看，与数据存储一样，要意识到您的应用程序代表用户生成了多少数据，并为用户提供控制和删除这些信息的方式。在某些情况下，请考虑最终用户是否希望有按需重新创建文件的选项（例如作为\
  \ PDF），而不是始终由应用程序存储文件。\n\n## 记录标识、唯一性和自动编号\n\nSalesforce 中的每个记录都有一个 Id 字段，除少数例外外，还有一个\
  \ Name 字段，或者用于自定义元数据类型对象的 DeveloperName。Id 字段是唯一的，但不可读，这意味着它无法手动输入，或者，对于地球上大多数人来说，也不容易记住！\n\
  \n> Database.merge 和 merge DML 语句支持合并账户、线索和联系人记录。\n\n### 唯一字段和外部 ID 字段\n\n添加字段时，可以指示其中存储的值为\
  \ **唯一** 和/或 **外部标识符**。对于唯一字段，平台会自动强制执行此规则，无论记录如何创建或更新，都会拒绝没有唯一值的记录。通过利用指定为外部 ID\
  \ 字段的字段，可以简化用户的数据加载过程；本章后面将更详细地讨论此内容。这两个字段修饰符都会创建自定义索引，有助于优化查询性能。\n\n> 您可以通过确保前一章中所述的其他标识字段（如这些字段）也添加到\
  \ **查找布局** 中，来帮助用户避免创建同名的重复记录。\n\n让我们添加一个 **唯一** 和 **外部 ID** 字段来记录车手的 Twitter 账号。在打包组织中执行以下步骤来尝试：\n\
  \n- 1. 在 **Driver** 对象上创建一个新的 **文本** 字段，**Twitter Handle** (`TwitterHandle__c`)，长度为\
  \ **15**，并选中 **唯一** 和 **外部 ID** 复选框。\n- 2. 使用上一章中输入的 **Driver** 记录来更新字段，并确认系统防止重复的\
  \ Twitter 账号。Lewis Hamilton 的 Twitter 账号是 LewisHamilton 和 Ruben 的是 rubarrichello。\n\
  - 3. 将拥有新字段读写权限的权限集更新为 **赛事管理**，将只读权限更新为 **赛事分析**。\n\n### 自动编号字段\n\n平台支持自动序列字段类型，可在对象创建期间和之后将其应用于\
  \ **名称** 字段（前提是该对象之前未作为先前包版本上传的一部分包含在内）。它也可以应用于全新字段。平台处理序列递增并确保没有重复项。\n\n在 FormulaForce\
  \ 应用程序中应用 **自动编号**，为 **Race Data** 记录在插入时提供唯一的自动递增标识符。在打包组织中执行以下步骤来尝试：\n\n- 1. 创建一个新的\
  \ **Race Data** (`RaceData__c`) 对象；对于 **记录名称**，输入 `Race Data Id`，并从 **数据类型** 字段中选择\
  \ **自动编号**。\n- 2. 在 **显示格式** 字段中输入 `RDID-{00000000}`，在 **起始编号** 中输入 `1`。最后，选中 **允许报表**\
  \ 字段。\n- 3. 添加一个名为 `Race` (`Race__c`) 的 **查找** 字段，以将此对象中的记录与现有的 `Race` 对象关联。选择 **不允许删除属于查找关系一部分的查找记录**\
  \ 选项，以防在存在赛事数据时删除赛事记录。我们将在后续章节中为此对象添加更多字段。\n- 4. 为刚刚创建的 **Race Data** 对象创建一个标签页，并将该标签页添加到\
  \ **赛事管理** 和 **赛事分析** 应用程序中。这样做，标签页和对象将自动添加到包中，为下一次上传做好准备。\n- 5. 创建一个测试记录以观察 **Race\
  \ Data 名称** 字段值。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_121_0.png)\n\n- 6.\
  \ 使用新对象和字段更新权限集，将读写权限授予 **赛事管理**，将只读权限授予 **赛事分析**。\n\n虽然可以向已打包并发布给客户的对象添加新自定义字段，但目前无法向已打包的对象（例如\
  \ **Driver** 对象）添加新的 **自动编号** 字段。\n\n创建使用自动编号字段的测试记录的 Apex 测试可以通过组织设置进行配置，以在测试之外不递增序列号，从而从最终用户的角度创建序列中的间隙。在订阅组织中，通过\
  \ Setup 下的 Apex Test Execution 页面上的 Options... 按钮访问此设置，如下所示：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_122_0.png)\n\
  \n显示格式决定格式，但不决定最大序列号。例如，如果使用 SEQ{0000} 格式，且下一个创建的序列号为 10,000，平台将显示为 SEQ10000，忽略格式数字。Auto\
  \ Number 字段的最大值在 Salesforce 文档中说明为最大长度 30 个字符，其中 10 个字符保留用于前缀字符。它还指出最大起始号必须小于 1,000,000,000。\n\
  \n平台不保证自动编号序列字段中不会有间隙。在创建记录时出现的错误可能会造成间隙，因为插入过程中分配的编号不会被重用。因此，在使用此功能时，请相应地与用户设定预期。\n\
  \n创建无中断序列的一个变通方法是创建一个使用自动编号字段类型的名称字段的自定义对象，例如 Job References。然后，在此对象与需要应用序列的对象记录之间创建关系，例如\
  \ Jobs。然后，编写一个 Apex 计划作业，为当前没有 Job Reference 关系的每个 Jobs 记录每天向 Job References 对象插入记录。然后，对\
  \ Job References 对象运行报表。为了确保没有删除 Job 记录，从而造成间隙，还可以启用后续章节中描述的查找参照完整性功能。\n\n### 订阅者自定义自动编号显示格式\n\
  \n请注意，一旦打包并安装到订阅组织中，显示格式将无法自定义。但是，可以在订阅组织中创建自定义公式字段，以从名称字段值中删除前缀并重新应用所需的任何前缀。例如，以下公式将隔离名称字段值的数字部分，并应用公式中指定的新前缀（这也可以由公式中的自定义设置或条件逻辑驱动）：\n\
  \n```\n'MYID-' + MID(Name, 4, LEN(Name) + 4)\n```\n\n当将此公式字段应用于自动编号为 RD-000000001\
  \ 的记录时，公式将显示如下：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_123_0.png)\n\n\n\n\n\
  \n## 记录关系\n\n当从一个对象向另一个对象创建**查找**字段时，就会形成一种关系，这通常被称为父子关系。Salesforce 中有两种类型的关系：**主从关系**和**查找关系**。\n\
  \n> 自定义元数据类型对象仅支持与其他自定义元数据类型对象或其他自定义对象/自定义字段元数据之间的查找关系。本节中描述的一些功能仅适用于自定义对象，例如查找过滤器和参照完整性。自定义设置对象不支持任何形式的记录关系。\n\
  \n在某些方面，它们在使用 SOQL 和 Apex 时的引用方式以及通过用户界面输入的方式上有相似之处（例如前一章中描述的**查找过滤器**）。但是，关于**限制**和**参照完整性**功能存在差异，具体如下：\n\
  \n- 使用主从关系形式可以提供一种强大的方式来建模包含关系，其中一个父对象记录充当其他子记录的容器；在我们的示例中，一场比赛包含**参赛者**。\n  - 删除父记录时，平台会自动级联删除子记录，并且在创建子记录时还会强制要求父引用。\n\
  \  - 默认情况下，平台会阻止用户通过编辑关系字段将子记录移动到另一个父记录。但是，您可以通过选择**子记录在创建后可以重新关联到其他父记录**选项来禁用此验证并允许此操作。\n\
  \  - 使用**汇总摘要**字段后，还可以基于子记录字段的值构建计算字段。\n  - 但是，Salesforce 建议这种父子关系不要超过 10,000 个子记录；否则，平台将不支持级联删除子记录。\n\
  \  - 您可以定义最多三级主从关系。\n\n- 使用**查找**类型的关系可以让您对相关记录之间的可选连接进行建模，这些连接可能还具有与其父记录不一定涉及所有权或包含关系的其他关系。使用查找字段定义关系时，请牢记以下几点：\n\
  \  - 删除父记录不会导致相关子记录级联删除；这可以通过 Salesforce 支持启用，但该设置不会被打包。\n  - 与主从关系不同，您可以在创建字段时选择让平台强制实施参照完整性，方法是使用**不允许删除属于查找关系一部分的查找记录**选项。\n\
  \  - 目前，使用查找关系时不支持**汇总摘要**字段。\n\n两种类型的查找字段都会由平台自动编入索引，在某些情况下可使查询更快。我们将在后续章节中更多地关注索引。每个对象的关系字段最大数量为\
  \ 40。\n\n> 虽然可以向已打包并发布给客户的对象添加新自定义字段，但不能向已打包的对象添加新的主从关系。\n\n## 重用现有标准对象\n\n在设计对象模型时，深入了解现有的**标准对象**及其功能是了解何时引用、何时不引用它们的关键。在考虑使用标准对象时，请牢记以下几点：\n\
  \n- **从数据存储角度来看：** 如果您的最终用户作为现有 Salesforce 客户已经在使用类似的标准对象，那么忽略标准对象会为他们带来潜在的数据重复和集成工作量。请记住，通过您的包向标准对象添加额外的自定义字段不会增加这些对象的数据存储消耗。\n\
  \n从许可成本角度来看：相反，引用某些标准对象可能会给用户带来额外的许可成本，因为并非所有标准对象都可以在没有 Salesforce 额外许可的情况下供用户使用。请确保您了解\
  \ Salesforce (CRM) 许可和 Salesforce Platform 许可在可用标准对象方面的差异。目前，Salesforce Platform\
  \ 许可提供账户和联系人；但是，要使用机会或产品对象，用户需要 Salesforce (CRM) 许可。请参阅 Salesforce 文档以获取有关这些的最新详细信息。\n\
  \n使用您的用户角色来定义您的用户使用哪些标准对象，并相应地通过查找、Apex 代码和 Visualforce 引用它们。您可以使用扩展包和/或动态 Apex\
  \ 和 SOQL 使这类引用成为可选。由于开发者版组织拥有所有这些许可和对象（尽管数量有限），请在每次单击上传按钮之前检查包依赖项，以检查是否有无意的引用。\n\
  \n## 导入和导出数据\n\nSalesforce 提供了一些用于导入和导出数据的自有工具，以及一些基于 Salesforce API 的第三方选项；这些选项均列在\
  \ AppExchange 上。在导入带有其他记录关系的记录时，无法预测并包含相关记录的 ID（例如导入比赛记录时的赛季记录 ID）；本节将介绍解决此问题的方法。\n\
  \nSalesforce 提供了数据导入向导，可在设置菜单下找到：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_126_0.png)\n\
  \n导入包含比赛赛季列表的 CSV 文件非常简单，因为这是一个顶级对象且没有其他对象依赖。但是，要导入比赛信息（这是赛季的相关子对象），需要赛季和最快圈速由记录\
  \ ID，而这些 ID 通常默认不会出现在比赛导入 CSV 文件中。请注意，ID 在整个平台上是唯一的，不能在组织之间共享。\n\n如果您需要回顾这些对象的结构，请参阅第\
  \ 2 章“利用平台功能”中显示的 Schema Builder 截图。\n\n外部 ID 字段有助于解决此问题，它允许 Salesforce 使用此类字段的现有值作为关联需要引用父记录或相关记录的导入记录的辅助方式。所需的只是在导入数据文件中包含相关记录的名称或（理想情况下）唯一外部\
  \ ID。\n\nRaces.csv 文件包含在本章的示例代码的 /data 文件夹中。此 CSV 文件包含三列：年份、名称和最快圈速由（该比赛中跑出最快圈速的车手，由其\
  \ Twitter 句柄指示）。您可能记得，驾驶员记录也可以通过此方式标识，因为该字段已定义为外部 ID 字段：\n\n| 年份 | 名称 | 最快圈速由 |\n\
  |---|---|---|\n| 2014 | Melbourne | LewisHamilton |\n| 2014 | Shanghai | LewisHamilton\
  \ |\n| 2014 | Monte Carlo | LewisHamilton |\n| 2014 | Budapest | LewisHamilton |\n\
  \n您的打包组织中应该已经存在 2014 **赛季**记录和 `Lewis Hamilton 驾驶员`记录。如果不存在，请参阅前一章来创建这些记录。现在，运行**数据导入向导**并按照以下截图完成设置：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_128_0.png)\n\n接下来，按照以下截图完成字段映射：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_128_1.png)\n\
  \n单击**开始导入**，然后单击**确定**，在数据导入完成后查看结果。您应该发现，在 `2014 赛季` 下已创建了四个新的**比赛**记录，并且**最快圈速由**字段已正确关联到\
  \ `Lewis Hamilton 驾驶员`记录。\n\n\n\n\n\n请注意，这些工具也会对您的 **Apex 触发器** 代码进行压力测试，因为它们通常启用批量模式并以每批200条记录的大小插入记录。因此，建议您将触发器的测试至少达到此级别的记录量。后续章节将介绍编码模式，以帮助确保代码支持批量模式。\n\
  \n## 复制和归档数据的选项\n\n企业客户通常拥有仍在使用或未来希望逐步淘汰的旧版和/或外部系统。因此，他们可能需要将Salesforce平台中存储的数据的某些方面复制到另一系统。同样，为了将不需要的数据移出平台并管理数据存储成本，存在归档数据的需求。\n\
  \n以下列出了一些平台和API设施，可帮助您和/或您的客户构建用于复制或归档数据的解决方案。当然，下面列出了若干 **AppExchange** 解决方案，它们提供已使用这些API的应用程序：\n\
  \n- **Replication API**：此API同时以Web服务SOAP和Apex形式存在。它允许您开发定时进程，在给定时间段内为特定对象查询平台上的任何新记录、更新记录或已删除记录。`getUpdated`\
  \ 和 `getDeleted` API方法仅返回记录的ID，要求您使用常规Salesforce API查询剩余数据以进行复制。调用此API的频率对于避免缺口非常重要。有关更多详细信息，请参阅Salesforce文档。\n\
  \n- **Outbound Messaging**：此功能提供了比复制API更具实时性的替代方案。外部消息事件可以使用平台的标准工作流功能进行配置。一旦针对给定对象配置了此事件，它将提供一个\
  \ **Web服务定义语言（WSDL）** 文件，该文件描述了在创建和更新记录时要调用的Web服务端点。Web服务开发人员有责任根据此定义创建端点。请注意，此选项不提供删除功能。\n\
  \n- Bulk API：此API提供了一种手段，每滚动24小时可移动最多5000个Salesforce数据块（每个块最多10 MB或10,000条记录）。Salesforce和第三方数据加载器工具（包括Salesforce\
  \ Data Loader工具）将其作为选项提供。它还可用于删除记录而无需将其放入回收站。此API非常适合构建用于归档数据的解决方案。\n\nHeroku Connect\
  \ 是 Salesforce 与 Heroku Postgres 之间无缝的数据同步解决方案。有关更多信息，请参见 https://www.heroku.com/connect。\n\
  \n## 外部数据源\n\n在归档用例中将数据移出平台，或无法将数据复制到平台上的一个缺点是，最终用户必须在应用程序和登录之间切换才能查看数据；由于进程和数据未连接，这会造成开销。\n\
  \nSalesforce Connect（以前称为Lightning Connect）是平台的一项付费附加功能，可通过设置中的所谓外部对象和外部数据源配置，在Salesforce用户界面中公开外部数据。它们提供与自定义对象类似的功能，例如列表视图、页面布局和自定义按钮。目前，不支持报表和仪表板，尽管可以通过Apex、Visualforce或Lightning组件构建自定义报表解决方案。\n\
  \n外部数据源可以连接到现有的基于OData的端点，并通过OAuth或基本身份验证进行保护。或者，Apex提供Connector API，开发人员可以实现适配器以连接到其他基于HTTP的API。根据关联外部数据源的功能，使用该数据源访问外部对象的用户可以通过Salesforce移动端和桌面界面等标准Salesforce\
  \ UI读取甚至更新记录。\n\n## 总结\n\n本章进一步探讨了在平台上开发应用程序的声明式方面，这些方面适用于应用程序的存储方式，以及通过使用查找字段删除约束和应用唯一字段来强制执行关系数据完整性的方式。主细关系允许您在数据模型中建模封装概念。我们还考虑了跨列而非跨行扩展架构的数据存储影响，以及这对最终用户存储成本的好处。\n\
  \n将 `FormulaForce` 包的最新版本上传并安装到您的测试组织中。新组件和升级组件的安装过程中的摘要页面应类似于以下屏幕截图。请注意，权限集在安装期间会被升级。\n\
