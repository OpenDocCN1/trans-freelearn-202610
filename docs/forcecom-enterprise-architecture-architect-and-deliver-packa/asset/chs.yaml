  \n- **文案编辑**\n  Sonia Mathur\n  Pranjali Chury\n\n## 前言\n\n作为 Salesforce.com 的开发者布道师，我一直看到对\
  \ Andrew 用这本书带来的这类材料的需求与日俱增。虽然我经常有幸向开发者展示 Force.com 上即将推出的新功能，但我也经常被问及如何利用这些功能并在企业开发者团队所需的生态系统中实施解决方案时的日常挑战。本书将在为这些特定顾虑提供新参考材料方面大有裨益。\n\
  \n2007 年，我开始在 Salesforce.com 上进行开发，当时的面貌与今天大不相同。那时没有 Visualforce。Apex 刚刚推出，缺少许多现在拥有的接口，例如\
  \ batchable 和 schedulable。大多数自定义界面是通过在 S-Controls 中嵌入大量 JavaScript 来实现的，S-Controls\
  \ 是平台不再支持的部分。与平台的通信可以通过使用 AJAX 工具包的 SOAP API 完成。如果你想在服务器端拥有真正精细的业务逻辑，可以通过在 Apex\
  \ 中自定义 SOAP 端点来公开它。\n\n2014 年，平台的功能已远超那些旧日时光。借助标准控制器，Visualforce 开箱即用，无需额外代码即可提供基本业务逻辑。对于自定义处理，开发者不再局限于单一选项，而是有多种途径，从扩展\
  \ Visualforce 组件库到直接将 Apex 方法暴露给 JavaScript——这提供了旧 AJAX 工具包的灵活性，而无需访问平台 API 的范围。Apex\
  \ 可以被调度，可以在后台处理记录，也可以用于创建完全自定义的 REST 端点。开发者现在可以使用 Streaming 和 Analytics 等强大的新 API，以及工业级身份服务。\n\
  \n平台仍在不断发展。每年在 Dreamforce 上，我们都会向平台宣布新工具、新功能和新特性。去年是 Salesforce1，随附一个新的移动应用程序，使将界面部署到智能手机变得简单且集成。即将到来的十月，我们将推出具有变革意义的创新。\n\
  \n技术演进的这种步伐，加上 Force.com 在企业应用中日益广泛的采用，为开发者带来了一个特定的挑战：不断地将平台视为各种用例的解决方案之外的东西，而是将其视为高效使用平台的完整生态系统。仅仅认为某个应用在平台上运行已不再足够；开发者需要考虑他们的应用程序是否以一种利用正确功能并能高效、良好共存的方式进行设计。需要有能力从高层次并带有清晰方向地审视平台的局限性。\n\
  \n当我们开始讨论 Andrew 基于 Martin Fowler 的关注点分离（Separation of Concerns）编写的一系列新文章，以及这些设计模式如何用于为企业解决方案开发\
  \ Apex 时，我知道 Andrew 正是具备这种能力的架构师。七年前，以这种抽象层次思考 Apex 当然是可能的——只不过并非真正必要。如今，Force.com\
  \ 开发者手握所有潜在的工具和功能，而不考虑这些概念，无疑是在为未来埋下维护债务的隐患。\n\n对熟悉其公司工作的人来说，Andrew 有条件撰写这本书并不令人惊讶。FinancialForce.com\
  \ 创建了我在 Force.com 上见过的最强大的应用程序之一，作为首席技术官，Andrew 一直处于使其成功的前沿。\n\n因此，我很高兴看到 Andrew\
  \ 撰写这本书，并且从其核心来看，我们可以看到他之前设计模式文章的扩展版本。实际上，仅仅印刷那些文章的副本也不会成为架构师图书馆中不好的补充，但在这里，我们还看到了一个更完整的愿景，即开发者在构建平台上的应用程序之前应该了解的内容，这一愿景从更高阶的考虑（例如将\
  \ Apex 类相互接口）一直延伸到具体任务（例如正确利用 Force.com 的源代码控制软件）。\n\n很高兴看到这本书在我的书架上，希望也在你的书架上——它将帮助你不仅规划这一代\
  \ Force.com 应用程序，还能为未来的应用程序向前发展。\n\nJoshua Birk\nSalesforce 开发者布道师\n\n## 关于作者\n\n\
