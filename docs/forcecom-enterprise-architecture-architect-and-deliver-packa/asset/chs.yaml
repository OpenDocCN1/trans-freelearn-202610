  \ 前言\n\n企业组织拥有通常跨越世界多个地点的复杂流程和集成需求。他们寻找一流的应用程序，这些应用程序不仅支持当前的需求，还支持未来的需求。\n\n将应用程序适应其实践、术语以及与其他现有应用程序或流程集成的能力对他们至关重要。他们在你的应用程序上的投资，与他们在你作为能够提供将与他们共同成长的应用程序策略的供应商上的投资一样多。\n\
  \n在本书中，你将学习如何通过探索如何识别架构需求并基于行业标准模式设计解决方案，使用 Salesforce 为企业客户构建和支持持久的应用程序。\n\n大规模应用程序需要仔细的编码实践以保持代码库的可扩展性。你将学习基于行业标准企业模式的高级编码模式，并为\
  \ Force.com 重新构思它们，使你能够充分利用平台，并在项目开始时就构建最佳实践。\n\n随着开发团队的扩大，使用更强大的应用程序生命周期工具管理开发周期以及采用持续集成等方法变得越来越重要。在\
  \ Force.com 上构建解决方案有多种方式；本书从头到尾为构建打包解决方案的步骤和注意事项划出了一条逻辑路径，涵盖从工程到将产品交到客户手中及更远的所有方面，确保他们从你的\
  \ Force.com 应用程序中获得尽可能大的价值。\n\n## 本书内容\n\n第 1 章 构建、发布和支持你的应用程序，将使用包、AppExchange\
  \ 和订阅者支持将你的应用程序推向潜在客户和客户。\n\n第 2 章 利用平台功能，确保你的应用程序与平台功能对齐并在可能时使用它们，这在构建应用程序时有助于提高生产力，但——或许更重要的是——它确保你的客户也能够进一步扩展和集成到你的应用程序中。\n\
  \n第 3 章 应用程序存储，教你如何建模应用程序的数据以有效利用存储空间，这可能会对你的客户的持续成本以及在选择你的应用程序时的初始决策产生重大影响。\n\n\
  第 4 章 Apex 执行和关注点分离，解释平台如何处理请求以及在什么时候调用 Apex 代码。这对于理解如何设计代码以实现最大重用性和耐久性非常重要。\n\n\
  第 5 章 应用程序服务层，专注于理解你的应用程序的真正核心：如何设计它，使其耐久，并使用 Martin Fowler 的服务模式作为模板，围绕快速发展的平台进行未来防护。\n\
  \n第 6 章 应用程序领域层，将通常锁定在 Apex 触发器中的 Apex 代码对齐到更符合对象功能目的和行为的类中，使用面向对象编程 (OOP) 来增加重用性并精简代码，并利用\
  \ Martin Fowler 的领域模式作为模板。\n\n第 7 章 应用程序选择器层，利用 SOQL 充分发挥查询引擎的作用，这可能会使查询变得复杂。使用\
  \ Martin Fowler 的映射模式作为模板，本章说明了一种封装查询的方法，使其更易于访问和重用，并使其结果在整个代码库中更加可预测和可靠。\n\n第 8\
  \ 章 用户界面，涵盖了企业应用程序用户界面在翻译、本地化和定制方面的关注点，以及平台中各种 UI 选项的优缺点。\n\n第 9 章 Lightning，解释了这个现代框架的架构，用于提供丰富的客户端设备无关的用户体验，从基本应用程序到使用组件方法来扩展\
  \ Lightning Experience 和 Salesforce1 Mobile。\n\n第 10 章 提供集成和扩展性，解释企业级应用程序要求你仔细考虑与现有应用程序和业务需求的集成，同时通过在设计应用程序时考虑扩展性来着眼于未来。\n\
  \n第 11 章 异步处理和大数据量，展示了设计一个交互式或异步处理大量数据的应用程序需要考虑了解客户的数据量要求，并利用最新的平台工具和功能，例如了解查询优化器以及何时创建索引。\n\
  \n第 12 章 单元测试，探讨了单元测试与系统测试的区别和优势。这旨在帮助你理解如何应用依赖注入和模拟技术来编写覆盖更多代码场景且运行更快的单元测试。你还将学习利用\
  \ Apex Stub API 和 ApexMocks 开源库的实际示例。\n\n第 13 章 源代码控制和持续集成，表明在规模应用程序中保持一致的代码库需要仔细考虑源代码控制，并在应用程序开发和实施过程中采取计划的集成方法。\n\
  \n## 本书所需内容\n\n为了遵循本书中的实际示例，你需要安装 Salesforce Force.com IDE、Apache Ant v1.9 或更高版本以及\
  \ Java v1.8 或更高版本，并通过 developer.salesforce.com 访问 Salesforce 开发者版组织。\n\n本书所需软件要求列表如下：\n\
  \n- Salesforce 开发者版组织\n- Java v1.8（或更高版本）\n- Apache Ant v1.9（或更高版本）\n- GitHub 客户端（可选）\n\
  - Salesforce Force.com IDE\n- Salesforce 开发者控制台（可选）\n\n\n\n\n\n## 此书适合的读者\n\n本书面向希望超越\
  \ Force.com 基础、学习如何真正挖掘其潜力的 Force.com 开发者。如果你希望扩展开发打包 ISV 软件以及适用于 Salesforce 平台的企业级复杂、可扩展应用程序的知识，你会发现这本书非常实用。本书将使你熟悉\
  \ Force.com 的非编程功能以及 Apex，并帮助你学习如何为企业级需求架构强大的解决方案。如果你在其他企业软件生态系统中拥有开发背景，你会发现本书是采用\
  \ Force.com 的宝贵资源。\n\n## 约定\n\n在本书中，你会发现许多用于区分不同类型信息的文本样式。以下是这些样式的一些示例及其含义说明。\n\n\
  正文中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟 URL、用户输入和 Twitter 账号显示如下：\"The Database.merge\
  \ and merge DML statements support merging of accounts, leads, and contact records.\"\
  \n\n代码块按以下方式设置：\n\n```\npublic class ContestantService{\n\n    public class RaceRetirement{\n\
  \        public Id contestantId;\n        public String reason;\n    }\n}\n```\n\
  \n当我们希望将你的注意力引向代码块的特定部分时，相关行或项目将以粗体显示：\n\n```\npublic class ProvisionalResult{\n\
  \    public Integer racePosition {get; set;}\n    public Id contestantId {get; set;}\n\
  \    public String contestantName {get; private set;}\n}\n```\n\n任何命令行输入或输出均按以下方式编写：\n\
  \n```\nant package.installdemo\n```\n\n**新术语**和**重要词汇**以粗体显示。你在屏幕上看到的词，例如在菜单或对话框中，会在文本中以这样的形式出现：\"\
  你可以在 **设置** 下的 **自定义设置** 页面中查看当前存储使用情况。\"\n\n警告或重要说明会出现在这样的方框中。\n\n技巧和窍门会以这样的形式出现。\n\
  \n## 读者反馈\n\n我们始终欢迎来自读者的反馈。告诉我们你对这本书的看法——你喜欢什么或不喜欢什么。读者反馈对我们很重要，因为它能帮助我们开发出你能真正受益的书籍。\n\
