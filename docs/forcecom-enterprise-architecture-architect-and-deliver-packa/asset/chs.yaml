  \ Service 层代码未来可以从这些功能中的任何一个以及其他功能中调用：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_165_0.png)\n\
  \n本书将在若干这些领域中说明 Service 层的使用。\n\n马丁定义中对边界的引用也是封装应用程序真正业务逻辑的一个重要方面。您必须谨慎对待这种封装，因为没有它，Service\
  \ 层无法协调应用程序的行为。本书中的模式有助于促进关于封装的更好思考。然而，不存在像 Java 等其他语言可能使用 `package` 和 `protected`\
  \ 关键字那样表达 Apex 代码之间依赖关系的方式。因此，我们必须确保对它们有坚实的认识和遵循意愿。\n\n> 代码审查是任何开发过程不可或缺的一部分。一个容易表明您的应用程序业务逻辑可能正在泄露到\
  \ Service 层之外的迹象是，调用类（例如 Visualforce 或 Lightning Component 控制器，或 Batch Apex 类）中的代码量在不断增加。请记住，这些类也有自己的关注点，例如处理和报告错误以及展示\
  \ Service 层或自定义对象所需的信息。不过，一般来说，如果代码看起来在做的事情超出了这些范围，这可能意味着有些代码本应被提取到 Service 方法中。困难的部分往往是基于这一观察未能通过代码审查，特别是如果作者声称目前没有复用案例。虽然这可能是事实，但最初忽略它并让它保留会增加技术债务，限制复用（下一位开发人员会有时间重构吗？），并增加整个应用程序中行为不一致的风险。\n\
