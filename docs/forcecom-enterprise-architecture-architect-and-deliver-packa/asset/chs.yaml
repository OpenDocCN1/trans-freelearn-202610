  \ |\n| 编辑 | CarsSelector | fforce |\n| 编辑 | ComplianceController | fforce |\n| 编辑\
  \ | Security ComplianceService | fforce |\n\n## 从 Apex 调用应用程序 API\n\n本节使用的代码采用 Apex\
  \ 测试方法（未包含在 FormulaForce 应用程序中）。作为运行 API 代码示例的简便方法，我们将使用 Apex 测试来说明本章包含的示例代码中 Apex\
  \ API 的用法。我们将查看的两个测试方法会在调用季节 API 创建一些测试数据（当然，这些数据仅在测试执行范围内的数据库中存在）后调用合规 API。\n\n\
  在以下示例中，由 SeasonService.createTestSeason API 创建的 Driver 记录未指明驾驶员持有 FIA 超级驾照。因此，预期\
