  \ 2;\n    rubens.contestantName = 'Rubens Barrichello';\n    rubens.contestantId\
  \ = 'a03b00000072xxS';\n    return new Map<Id, List<RaceService.ProvisionalResult>>\
  \ {\n    new List<Id>(raceIds)[0] =>\n    new List<RaceService.ProvisionalResult>\n\
  \    { hamilton, rubens }};\n    }\n    public void applyRaceResults(Map<Id,\n \
  \   List<RaceService.ProvisionalResult>>\n    provisionalResultsByRaceId) {\n  \
  \  throw new RaceService.RaceServiceException('Not implemented');\n    }\n    public\
  \ void awardChampionshipPoints(Set<Id>raceIds) {\n    throw new RaceService.RaceServiceException('Not\
  \ implemented');\n    }\n}\n```\n\n```\npublic class RaceServiceImpl implements\
  \ IRaceService {\npublic Map<Id, List<RaceService.ProvisionalResult>>\ncalculateProvisionResults(Set<Id>raceIds)\
  \ {\n    throw new RaceService.RaceServiceException('Not implemented');\n}\n\npublic\
  \ void applyRaceResults(Map<Id, List<RaceService.ProvisionalResult>> provisionalResultsByRaceId)\
  \ {\n    throw new RaceService.RaceServiceException('Not implemented');\n}\n\npublic\
  \ void awardChampionshipPoints(Set<Id>raceIds) {\nfflib_ISObjectUnitOfWork uow =\n\
  \    Application.UnitOfWork.newInstance();\n// Query Races and contestants and bulkify\
  \ list of all\ncontestants\nList<Contestant__c> contestants = new List<Contestant__c>();\n\
  for(Race__c race :\n    new RacesSelector().selectByIdWithContestants(raceIds))\
  \ {\n    contestants.addAll(race.Contestants__r);\n}\n// Delegate to contestant\
  \ service\nContestantService.awardChampionshipPoints(uow, contestants);\n// Commit\
  \ work\nuow.commitWork();\n}\n}\n```\n\n最后，添加标准服务方法，但通过服务方法来实现，该方法用于解析要使用的服务方法的正确实现。以下服务方法利用前面接口的适当实现：\n\
  \n```\npublic with sharing class RaceService {\n\npublic static Map<Id, List<ProvisionalResult>>\n\
  calculateProvisionResults(Set<Id>raceIds) {\n   return service().calculateProvisionResults(raceIds);\n\
  }\n\npublic static void applyRaceResults(\n   Map<Id, List<ProvisionalResult>>\n\
  \   provisionalResultsByRaceId ) {\n   service().applyRaceResults(provisionalResultsByRaceId);\n\
  }\n\npublic static void awardChampionshipPoints(Set<Id>raceIds) {\n   service().awardChampionshipPoints(raceIds);\n\
  }\n\nprivate static IRaceService service() {\n   return (IRaceService)\n   Application.Service.newInstance(IRaceService.class);\n\
  }\n\npublic class RaceServiceException extends Exception {}\n\npublic class ProvisionalResult\
  \ {\n   public Integer racePosition {get; set;}\n   public Id contestantId {get;\
  \ set;}\n   public String contestantName {get; set;}\n   }\n}\n```\n\n服务方法再次利用 Application\
  \ 类；这一次使用了 Service 工厂，以允许 IRaceService 接口的实际实现在运行时变化。这使开发人员可以根据需求控制应用程序使用上述两种实现中的哪一种。默认情况下使用\
  \ RaceServiceImpl 类，但可以通过在 Services 自定义元数据类型对象中插入记录来覆盖此设置。关于这一点将在后文中详细介绍。\n\n通过\
  \ Application 类中的 Service 字段暴露的工厂扩展了 fflib_Application.ServiceFactory 类，该类实例化传递给工厂的\
  \ Map 中提供的配置类。此工厂还支持模拟服务实现；这将在后续章节中更详细地讨论。\n\n该工厂已扩展为通过名为 Services 的受保护（因此对最终用户隐藏）自定义元数据对象查找配置的替代服务实现类，该对象包含在本章的源代码中。\n\
  \n您可以看到以下查询示例：\n\n```\npublic class Application {\n    //Configure and create the\
  \ ServiceFactory for this Application\n    public static final fflib_Application.ServiceFactory\
  \ Service = \n        new Application.ServiceFactory (\n            new Map<Type,\
  \ Type> {\n                IRaceService.class => RaceServiceImpl.class });\n\n \
  \   // Customised Service factory overrides via Custom Metadata\n    private class\
  \ ServiceFactory extends\n        fflib_Application.ServiceFactory {\n\n       \
  \ private Map<String, String> servicesByClassName = \n            new Map<String,\
  \ String>();\n\n        public ServiceFactory(Map<Type, Type>\n            serviceInterfaceTypeByServiceImplType)\
  \ {\n\n        super(serviceInterfaceTypeByServiceImplType);\n\n        // Map of\
  \ overridden services defined by the developer\n        for(Service__mdt serviceOverride\
  \ : [select DeveloperName,\n            NamespacePrefix, ApexClass__c from Service__mdt])\
  \ {\n            servicesByClassName.put(\n            serviceOverride.NamespacePrefix\
  \ + '.' +\n            serviceOverride.DeveloperName,\n            serviceOverride.ApexClass__c);\n\
  \        }\n    }\n}\n```\n\n\n\n```\npublic override Object newInstance(\n    Type\
  \ serviceInterfaceType) {\n\n    // Has the developer overridden the Service impl?\n\
  \    if (!Test.isRunningTest() && servicesByClassName.containsKey(\n           \
  \ serviceInterfaceType.getName())) {\n        String overriddenServiceImpl = servicesByClassName.get(\n\
  \                serviceInterfaceType.getName());\n        return Type.forName(overriddenServiceImpl).newInstance();\n\
  \    }\n\n    // Base factory returns mocked or registered impl\n    return super.newInstance(serviceInterfaceType);\n\
  }\n```\n\n> 查询自定义元数据记录不会占用 SOQL 限制；但是，返回的记录会占用最大 50k 记录限制。\n\n通过创建以下自定义元数据记录，客户端开发者可以配置应用程序使用存根实现，而无需进行任何代码更改。\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_197_0.png)\n\n通过将自定义元数据类型对象设为公共并允许客户或合作伙伴覆盖您服务的打包实现，这种方法可用于在应用程序中提供自定义扩展功能。不过，请谨慎使用此方法，并且仅在其为客户或合作伙伴增加价值时才使用。\n\
  \n### 测试服务层\n\n很容易让人倾向于通过围绕调用代码（例如 Visualforce 控制器测试）进行的测试来对服务层进行测试。但是，仅依赖这种测试会使服务层逻辑面临其他可能未由控制器逻辑严格覆盖的用例。例如，使用\
  \ StandardController 的自定义控制器只会传入单条记录而非多条记录。请确保在开发功能时针对服务层开发特定的 Apex 测试。\n\n### 模拟服务层\n\
  \n有时，服务层的数据设置要求会使为控制器或其他调用者（例如 Batch Apex）编写 Apex 测试变得相当复杂，因此成本高昂，不仅体现在测试运行的服务器时间上（由于每个测试方法的数据设置），还体现在准备完整测试数据集所需的开发人员时间上。\n\
  \n虽然您仍然需要测试代码的完整堆栈，但有一种称为模拟的方法，可以与先前提到的工厂模式配合使用，这将允许给定服务调用者的测试上下文实现其自己的服务测试实现，该实现模拟（使用硬编码测试响应）控制器期望从服务方法获得的不同行为。这在制定测试时允许控制器测试更加多样和集中。同样，这种模拟方法必须与真正执行所有所需代码的完整堆栈测试结合使用。第\
  \ 12 章 Apex Mocks 将更详细地介绍模拟服务层。\n\n### 调用服务层\n\n前面的示例已展示了从 Visualforce 控制器方法使用服务类方法的情况。让我们更仔细地看看这里正在发生什么、所做的假设，以及一个\
  \ Apex 调度器示例。服务方法在操作中的其他示例，例如来自 Lightning 组件的示例，将在后续章节中介绍。\n\n以下代码代表了一个控制器类中的代码，该类使用\
  \ StandardController 为与 Race 对象上的自定义按钮关联的 Visualforce 页面提供支持。请注意它如何将记录 ID 包装在 Set\
  \ 中，以遵循批量化的方法签名：\n\n```\npublic PageReference awardPoints() {\n    try {\n     \
  \   RaceService.awardChampionshipPoints(\n            new Set<Id> { standardController.getId()\
  \ });\n    } catch (Exception e) {\n        ApexPages.addMessages(e);\n    }\n \
  \   return null;\n}\n```\n\n这些控制器的构造函数未显示，但它本质上将 StandardController 或 StandardSetController\
  \ 存储在成员变量中，以供控制器方法稍后引用。\n\n以下代码概述了一个类似版本，可在使用 StandardSetController 时使用，例如在对象的列表视图上需要自定义按钮的情况下：\n\
  \n```\npublic PageReference awardPointsToRaces() {\n    try {\n        RaceService.awardChampionshipPoints(\n\
  \            new Map<Id, SObject>(\n                standardSetController.getRecords()).keySet());\n\
  \    } catch (Exception e) {\n        ApexPages.addMessages(e);\n    }\n    return\
  \ null;\n}\n```\n\nApex 中的 Map 构造函数将获取 SObject 列表，并根据传入的 SObject 的 ID 自动构建映射。将此与\
  \ keySet 方法结合，可快速将 StandardSetController 中包含的记录列表转换为服务方法所需的 ID 列表。\n\n在这两种情况下，任何异常都会通过调用\
  \ `ApexPages.addMessages` 方法（将异常传入）来路由到页面上的 `apex:pageMessages` 组件（这应该是您在页面中首先考虑添加的内容之一）。\n\
  \n请注意，控制器代码无需回滚在服务中可能已对对象记录所做的更改（直至抛出异常），因为控制器可以安全地假设服务方法已确保此情况。双方之间的这种安排本质上就是关注点分离的体现！\n\
  \n最后，让我们看看 `SeasonNewsletterScheduler` 类中的一个示例。与控制器示例一样，它自己处理异常，在此情况下，会就任何失败向用户发送电子邮件。请考虑以下代码：\n\
  \n```\nglobal void execute(ScheduleableContext sc) {\n    try {\n        SeasonService.issueNewsLetterCurrentSeason();\n\
  \    } catch (Exception e) {\n        Messaging.SingleEmailMessage mail = new Messaging.SingleEmailMessage();\n\
  \        mail.setTargetObjectId(UserInfo.getUserId());\n        mail.setSenderDisplayName(UserInfo.getUserName());\n\
  \        mail.setSubject('Failed to send Season Newsletter');\n        mail.setHtmlBody(e.getMessage());\n\
  \        mail.setSaveAsActivity(false);\n        Messaging.sendEmail(new Messaging.SingleEmailMessage[]\
  \ { mail });\n    }\n}\n```\n\n## 更新 FormulaForce 包\n\n最后，部署本章包含的代码，并确保将任何新的 Apex\
  \ 类（尤其是测试类）添加到包中并执行发布上传。您可能需要花些时间进一步审查本章提供的代码，因为并非所有代码都在本章中介绍。`Contestant` 和 `Season`\
  \ 对象中也添加了一些新字段，这些字段会自动添加到包中。已添加两个新的元数据对象 `Championship Points` 和 `Services`。`Championship\
  \ Point` 记录也必须添加到包中。不要打包任何 `Service` 记录。\n\n## 摘要\n\n在本章中，我们迈出了开发健壮编码规范的第一步，以管理和构建企业应用程序的编码复杂性。这一第一层以一种与平台无关的方式封装了应用程序的业务流程逻辑，使其可以轻松跨多个\
  \ Apex 入口点使用，包括当前应用程序所需的入口点，以及平台发展过程中未来出现的入口点。\n\n我们还了解了如何使用 工作单元模式 来帮助批量化 DML 语句、管理记录关系并实现数据库事务，从而使您的服务层逻辑能够更专注于实现业务逻辑这一关键职责。在即将到来的章节中，我们将看到它如何迅速成为应用程序的支柱。仔细遵守围绕服务层的准则将确保其保持强大且易于扩展。\n\
  \n在下一章中，我们将探讨域层，这是一种将自定义对象的数据与与该数据相关的自定义对象行为适用逻辑相结合的模式。这包括传统放置在 Apex 触发器中的逻辑，但也可以选择进一步分发和分层在服务层中执行的代码。\n"
- "# 应用程序域层\n\n应用程序使用的对象代表其域。与其他数据库平台不同，在其他平台上记录数据默认对最终用户隐藏，而 Force.com 平台通过标准 Salesforce\
  \ UI、报告、仪表板和 Salesforce1 移动应用程序显示记录数据。通过公开对象和字段的标签和关系，您直接将它们提供给最终用户。从创建第一个对象的那一刻起，您就开始定义应用程序的域，就像\
  \ Salesforce 标准对象代表 CRM 应用程序域一样。\n\n马丁·福勒的 *企业应用架构模式* 也将此概念视为一种代码封装手段，用于将每个对象表达的数据与影响或与该数据交互的代码中编写的行为相结合。这可能是提供默认值和验证的\
  \ Apex 触发器代码，也可能是向参赛者记录授予冠军积分或检查规则合规性的代码。\n\n本章将使用域层模式扩展 FormulaForce 应用程序的功能，同时重点介绍特定关注点、准则和最佳实践，以及它如何与\
  \ Apex 触发器和应用程序的服务层代码集成。\n\n本章将涵盖以下方面：\n\n- 介绍域层模式\n- 实现设计准则\n- 域类模板\n- 实现域触发器逻辑\n\
  - 实现自定义域逻辑\n- 面向对象编程\n- 测试域层\n- 调用域层\n\n\n\n\n## 引入领域层模式\n\n下面是 Martin Fowler 对领域层的定义（http://martinfowler.com/eeaCatalog/domainModel.html）：\n\
  \n> \"既包含行为又包含数据的领域对象模型\"。\n\n与服务层一样，此模式进一步增加了关注点分离和应用程序代码的模块化，有助于随着代码库的增长对其进行管理和扩展。\n\
  \n> \"在最糟糕的情况下，业务逻辑可能非常复杂。规则和逻辑描述了许多不同的行为案例和侧面，正是这种复杂性是对象设计用来处理的。领域模型创建了一个相互关联的对象网络，其中每个对象代表某个有意义的个体，无论是像公司这样庞大的实体，还是订单表上的一行。\"\
  \n\n马丁在前面引文中对对象的引用，主要针对的是由在面向对象编程语言（如 Java 或 .NET）中编写的类实例化而创建的对象。在这些平台中，此类类作为底层数据库表关系的逻辑表示。这种方法通常称为对象关系映射（ORM）。\n\
  \n相比之下，Force.com 开发者读到 \"object\" 这个术语时，往往首先想到的是标准对象或自定义对象，而不是类实例化的结果。这是因为 Salesforce\
  \ 通过其对象的声明式定义，将数据与行为绑定得非常出色，而众所周知，这远不止字段那么简单。它具有公式、过滤器、参照完整性以及我们在前面章节中讨论的许多其他功能，且无需编写任何代码即可使用。\n\
  \n考虑到这些声明式功能本质上是实现某些行为的手段，Force.com 的自定义对象或标准对象已经满足了领域层模式的一些封装关注点。\n\n### 在代码中封装对象的行为\n\
  \nApex 触发器提供了一种方式，用于为自定义对象（或标准对象）编写代码以实现附加行为。它们提供了一个位置，用于实现与数据库事件相关的更复杂行为，例如 **创建**、**更新**\
  \ 和 **删除**。\n\n但是，由于 Apex 触发器不能包含 `public` 方法，因此它不提供一种方式来编写逻辑上属于对象但不一定与数据库事件关联的代码。一个示例是计算\
  \ **参赛者** 锦标赛积分的逻辑，或者检查是否符合众多 *Formula1 规则和规定*，我们将在本章后面讨论这一点。此外，它们没有提供利用 **面向对象编程**（OOP）方法的机会，这也将在本章后面讨论。\n\
  \n因此，开发者往往最终将此逻辑放在其他地方，有时放在某种控制器或帮助器类中。因此，实现给定对象行为的代码变得分散，并且 *关注点分离* 遭到破坏。\n\n将\
  \ Apex 触发器代码从触发器主体中提取出来并放入 **Apex 类**（例如基于对象名称按照某种约定命名，如 `RaceTriggerManager` 或\
  \ `RaceTriggerHandler`），是缓解这种分散性的一个良好开端。使用此类方法，随后可以创建其他方法并进一步拆分代码。这些方法只是在寻求对本章所述领域模型概念的更完整诠释方面的一个起点。\n\
  \n使用 `Manager` 或 `Handler` 方法往往会吸引与 Apex 触发器事件模型相关的逻辑，而不包含其他内容，使得其他与对象相关的逻辑在代码库中找不到明显的位置。\n\
  \n### 在 Force.com 中解释领域层\n\n在本章中，我们将探讨 Force.com 对领域层模式的诠释，该诠释确保通过 Apex 触发器事件和通过直接\
  \ Apex 方法调用（来自服务层和其他领域类）所调用的行为都得到考虑。\n\n可以创建一个单一的领域类来封装所有行为，并开始利用 OOP 原则（例如接口）来进一步丰富代码以实现复用和关注点分离，我们将在本章后面探讨这一点。\n\
  \n下图说明了领域层类的两个消费者——来自服务层的代码，以及导致 Apex 触发器事件的与对象的直接交互，这些交互也将路由到同一个领域层类：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_205_0.png)\n\
  \n## 与其他平台相比，Apex 中的领域类\n\n如前面章节所示，标准对象或自定义对象在 Apex 运行时中作为具体类型公开，可以实例化以填充记录字段用于数据库插入，或确定用于返回从中查询的记录的类型。\n\
  \n考虑领域模式时，最初的想法可能是通过 Apex 继承（使用 extends 关键字）来扩展适用的 SObject，例如 Account 或 Race__c。不幸的是，Apex\
  \ 编译器不支持此方法。即使支持，鉴于批量化的最佳实践，一次处理单个记录实例的代码会很快导致 governor 限制问题。\n\n相反，此处介绍的领域类实现使用组合方法来组合记录数据和行为。这有时被称为包装器类方法；之所以这样命名，是因为它将相关数据作为类成员变量进行包装。\n\
  \nApex 中包装器类的实现并无不同，只是我们选择包装记录列表以强制执行逻辑内的 **批量化实现**。以下伪代码说明了 **Apex 领域类** 的实例化：\n\
  \n```\nRace__c raceRecords =\n    [select Id, Name from Races__c where Id in :raceIds];\n\
  \nRaces races = new Races(raceRecords);\n```\n\n与其他平台（例如 Java 和 .NET）相比，另一个实现差异是创建访问器方法以获取相关的父记录和子记录。虽然可以编写此类方法，但不推荐，例如\
  \ Contestants.getRaces 或 Races.getContestants。\n\n此实现避免编写此类访问器，因为 Apex 中的 SObject\
  \ 对象已经提供了一种在需要时（如果已查询）遍历关系的方法。Apex 领域类的批量特性也使得此类方法不太有用，更适合调用者在需要时使用选择器类查询所需的记录，而不是作为调用访问器方法的结果。\n\
  \n总结一下，本章所述的 Apex 领域类专注于包装记录列表以及封装对象行为的方法，并避免为查询相关记录提供访问器方法。\n\n## 实现设计指南\n\n与前一章一样，本节提供了围绕为给定对象设计领域层类的一些常规设计和最佳实践指南。请注意，其中一些约定由服务层共享，因为它也会调用领域层，原因是诸如批量化之类的约定也适用于此处编写的逻辑。\n\
  \n## 命名约定\n\n领域层模式的关键原则是以一种方式组织代码，使其映射到应用程序的业务域。在 Force.com 应用程序中，这通常由自定义对象支持。因此，明确指出哪个领域层类与哪个标准对象或自定义对象相关非常重要：\n\
  \n- **避免缩写**：与前一章一样，尽量避免使用缩写，除非它们会使类名过长而无法使用。\n- 类名：使用自定义对象的复数名称作为领域类的名称。这为类处理的记录范围定调，正如下一小节所述，明确表明该范围是批量化的。\n\
  \  - 不良示例：Race.cls 和 RaceDomain.cls\n  - 良好示例：Races.cls 和 Teams.cls\n- 方法名：与数据库操作或事件相关的逻辑方法应遵循\
  \ onEventName 约定。其他方法名应具有描述性，并避免在名称中重复类名。\n  - 不良示例：Races.checkInserts 和 Races.startRace\n\
  \  - 良好示例：Races.onBeforeInsert 和 Races.start\n- 参数名称和类型：前一章所述的大部分内容也适用于此。虽然将记录列表传递给领域类方法不是必须的，但这作为类成员变量可供所有领域类方法使用，如本章后面所示。\n\
  \  - 不良示例：\n    ```\n    Races.onBeforeInsert(\n        List<Race__c> racesBeingInserted)\n\
  \    Races.start(\n        List<Id> raceIds)\n    ```\n  - 良好示例：\n    ```\n    Races.onBeforeInsert()\n\
  \    Races.start()\n    ```\n- 内部类和接口：前一章所述的大部分内容也适用于此。由于所管理的数据以实际自定义对象本身的术语表示，并且该信息作为类成员变量可用，因此通常不需要内部类来表示传入和传出领域类的数据。\n\
  \n\n\n\n下图展示了本章中使用的 Domain 类如何映射到各自的自定义对象。每个 Domain 类在其构造函数中接收其方法所作用的记录。Domain 类中显示的方法将在本章后续部分详细描述。\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_208_0.png)\n\n## 批量化\n\n与 Service 层一样，编写\
  \ Domain 层代码时被鼓励以批量上下文思考记录。当 Domain 类方法从 Apex Trigger 上下文和 Service 层代码中调用时，这一点至关重要，两者都有相同的批量化要求。\n\
  \n与 Service 层不同，这里不是通过传递参数并确保参数类型已批量化来强制实施批量化，而是 Domain 类逻辑所作用且由其成员变量（这些成员变量已批量化）驱动的信息。在此情况下，Records\
  \ 类属性返回一个 `List<SObject>` 对象：\n\n```\npublic void onValidate() {\n    for(Contestant__c\
  \ race : (List<Contestant__c>) Records) {\n    }\n}\n```\n\n## 定义和传递数据\n\nDomain\
  \ 类上的大多数方法已通过 `Records` 属性（即构建 Domain 类时的状态）获得所需的信息。因此，几乎不需要在方法本身中传递数据信息。但是，对于某些自定义行为方法（即不反映\
  \ Apex Trigger 逻辑的方法），您可能希望将其他域对象和/或 **工作单元** 作为额外参数传递。本章后面的示例将有助于说明这一点。\n\n## 事务管理\n\
  \n对于执行数据库操作的 Domain 类方法，有两项设计准则：使用作为参数传递给方法的事务上下文（工作单元），或为 Domain 类方法执行的范围创建一个。\n\
  \n## Domain 类模板\n\n本章的 Domain 类实现使用了 **FinancialForce.com Apex 企业模式** 库，该库是开源的，并包含在本章的示例代码中。在此库中，提供了\
  \ Apex 基类 `fflib_SObjectDomain`，以帮助实现 Domain 层模式。\n\n下面的代码片段展示了利用此基类的 Domain 类的基本模板：\n\
  \n```\npublic class Races extends fflib_SObjectDomain {\n    public Races(List<Race__c>\
  \ races) {\n        super(races);\n    }\n}\n\npublic class Constructor\n    implements\
  \ fflib_SObjectDomain.IConstructable {\n    public fflib_SObjectDomain construct(\n\
  \        List<SObject> sObjectList) {\n        return new Races(sObjectList);\n\
  \    }\n}\n```\n\n首先需要注意的是，此类的 **构造函数** 接收一个 `Race__c` 记录列表，符合之前描述的准则。在域类中实现的代码是以批量化为宗旨编写的。基类构造函数初始化\
  \ `Records` 基类属性。\n\n内部类 Constructor 存在是为了允许在 Apex Trigger 上下文中动态创建 Domain 类。这实际上是在绕过\
  \ Apex 语言中缺乏完全反射（即动态引用类构造函数的能力）的问题。此内部类的名称必须始终为 Constructor。\n\n通过扩展 fflib_SObjectDomain\
  \ 类，Domain 类继承了可用于实现其自身方法的属性和方法，例如 Records 属性，该属性提供对实际记录数据的访问。还提供了虚拟方法，以简化 Apex\
  \ Trigger 行为的实现，以及一些专门的事件，如 onValidate 和 onApplyDefaults。下面的类概述说明了 Domain 类可重写的基类中一些关键方法：\n\
  \n```\nfflib_SObjectDomain(List<SObject>, SObjectType)\nv onApplyDefaults() : void\n\
  v onValidate() : void\nv onValidate(Map<Id, SObject>) : void\nv onBeforeInsert()\
  \ : void\nv onBeforeUpdate(Map<Id, SObject>) : void\nv onBeforeDelete() : void\n\
  v onAfterInsert() : void\nv onAfterUpdate(Map<Id, SObject>) : void\nv onAfterDelete()\
  \ : void\nv onAfterUndelete() : void\nv handleBeforeInsert() : void\nv handleBeforeUpdate(Map<Id,\
  \ SObject>) : void\nv handleBeforeDelete() : void\nv handleAfterInsert() : void\n\
  v handleAfterUpdate(Map<Id, SObject>) : void\nv handleAfterDelete() : void\nv handleAfterUndelete()\
  \ : void\n```\n\n## 实现 Domain Trigger 逻辑\n\nDomain 类最常见的初始用例是封装 Apex Trigger 逻辑。为此，需要一个小型\
  \ Apex Trigger 来调用 triggerHandler 方法。这将把各种 Trigger 事件路由到 Domain 类中的相应方法（如前面的屏幕截图所示），从而避免围绕\
  \ Trigger.isXXX 变量使用常规 if/else 逻辑。\n\n此 trigger 的名称可以是任意的，不过最好将其与相应的 Domain 类名称匹配。设置好后，您可以忽略它，专注于按如下方式实现\
  \ Domain 类方法：\n\n```\ntrigger Seasons on Season__c (\n  after delete, after insert,\
  \ after update,\n  before delete, before insert, before update) {\n    fflib_SObjectDomain.triggerHandler(Seasons.class);\n\
  }\n```\n\n## 将 Trigger 事件路由到 Domain 类方法\n\n下图展示了从 Apex Trigger 到 Domain 类，再到 triggerHandler，最后到各个方法的执行流程：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_211_0.png)\n\n为帮助您理解传统 Apex Trigger 事件如何映射到基类中的各种虚拟方法，下表描述了从调用基类的\
  \ fflib_SObjectDomain.triggerHandler 方法开始，到可由 Domain 类重写的特定事件方法的代码路径：\n\n| 触发器上下文\
  \ | 基类 Records 属性值 | 基类调用的 handle 方法（请参阅以下注释） | 基类调用的事件方法（请参阅以下注释） |\n| :--- | :---\
  \ | :--- | :--- |\n| Trigger.isBefore | | | |\n| Trigger.isInsert | Trigger.new\
  \ | handleBeforeInsert() | onApplyDefaults()<br>onBeforeInsert() |\n| Trigger.isUpdate\
  \ | Trigger.new | handleBeforeUpdate(Map<Id, SObject> existingRecords) | onBeforeUpdate(Map<Id,\
  \ SObject> existingRecords) |\n| Trigger.isDelete | Trigger.oldMap | handleBeforeDelete()\
  \ | onBeforeDelete() |\n| Trigger.isAfter | | | |\n| Trigger.isInsert | Trigger.new\
  \ | handleAfterInsert() | onValidate()<br>onAfterInsert() |\n| Trigger.isUpdate\
  \ | Trigger.new | handleAfterUpdate(Map<Id, SObject> existingRecords) | onValidate(Map<Id,\
  \ SObject> existingRecords)<br>onAfterUpdate(Map<Id, SObject> existingRecords) |\n\
  | Trigger.isDelete | Trigger.oldMap | handleAfterDelete() | onAfterDelete() |\n\n\
  注释：如果您希望实现自己的处理逻辑，也可以重写 Handle 方法。existingRecords 参数表示 Trigger.oldMap 的值。\n\n基类使用模板方法模式（http://en.wikipedia.org/wiki/Template_method_pattern）。这确保在重写基类中的\
  \ onXXX 方法时，您不需要担心调用基类版本的方法，这是在 OOP 中重写方法时的典型开发者要求。\n\n## 强制执行对象安全性\n\nSalesforce\
  \ 要求开发者使用 SObjectDescribe 和 SObjectFieldDescribe Apex 运行时类型上的方法来实现对象 CRUD（创建、读取、更新和删除）安全性以及字段级安全性检查。\n\
  \n默认情况下，本章中使用的 fflib_SObjectDomain 基类中的前面 handle 方法会自动代表开发者的 Domain 类逻辑执行对象 CRUD\
  \ 安全性。\n\n请注意，目前基类仍将实现字段级安全性留给开发者实现。\n\n基类提供的开发者控制的配置选项允许每个 Domain 类控制是否启用此默认行为。例如，由应用程序代码代表用户进行典型维护的对象可能不希望强制执行此检查，例如锦标赛积分的授予。这种访问有时被称为系统级访问，因为系统代表用户执行操作。因此，若接受默认的强制检查，将要求授予用户在应用程序其他位置不适当的访问权限。不利用默认强制执行的另一个动机是，更希望在控制器逻辑中更显式地编码这些检查。请仔细考虑每种情况下默认强制执行是否是您所需。\n\
  \n## 默认行为\n\n处理程序方法在调用前面的事件方法之前会检查所需的安全性，如果用户没有所需的访问权限，则会抛出 DomainException 异常（强制整个\
  \ Trigger 上下文停止）。例如，调用 handleAfterInsert 方法时，将使用 SObjectDescribe.isCreatable 方法。\n\
  \n\n\n\n\n## 重写默认行为\n\n为了更轻松地在整个应用程序中配置 fflib_SObjectDomain 类，并提供建立共享或通用 Domain\
  \ 逻辑代码的手段，新建了以下基类。\n\n```\n/**\n * Application specific Domain base class,\n * customise\
  \ fflib_SObjectDomain and add common behavior\n **/\npublic abstract class ApplicationDomain\
  \ extends\n\tfflib_SObjectDomain {\n\tpublic ApplicationDomain(List<SObject> records)\
  \ {\n\t\tsuper(records);\n\t\t// Disable CRUD security enforcement at the Domain\
  \ class level\n\t\tConfiguration.disableTriggerCRUDSecurity();\n\t}\n}\n```\n\n\
  因此，该应用程序中的 Domain 类改为扩展此类。\n\n```\npublic class Contestants extends ApplicationDomain\
  \ {\n\tpublic Contestants(List<Contestant__c> contestants) {\n\t\tsuper(contestants);\n\
  \t}\n}\n```\n\n注意，这种方法要求开发者独自承担实现对象 CRUD 安全检查的全部责任。\n\n## Apex 触发器事件处理\n\n即将介绍的章节将举例说明与\
  \ FormulaForce 应用程序相关的一些 Apex 触发器示例。它们使用本章示例代码中包含的 Drivers 和 Contestants Domain\
  \ 类，以及以下新字段：\n\n- 在 Driver__c 对象中，已创建名为 ShortName__c 的新文本类型字段，最大长度为 3 个字符。\n- 在\
  \ Race__c 对象中，有一个名为 Status__c 的新选择列表类型字段，包含 Scheduled、In Progress、Red Flagged 和\
  \ Finished 值。默认值为 scheduled，方法是勾选“Use first value as default value”复选框。\n\n## 插入时设置字段默认值\n\
  \n虽然可以重写 onInsertBefore 方法来实现记录插入时设置默认值的逻辑，但添加到 Contestants Domain 类中的以下代码选择重写 onApplyDefaults\
  \ 方法。之所以使用此方法，是因为它更明确，并允许默认值代码与记录插入代码之间实现关注点分离，尽管两者都在插入阶段触发：\n\n```\npublic override\
  \ void onApplyDefaults() {\n    for(Driver__c driver : (List<Driver__c>) Records)\
  \ {\n        if(driver.ShortName__c == null) {\n            // Upper case first\
  \ three letters of drivers last name\n            String lastName = driver.Name.substringAfterLast('\
  \ ');\n            driver.ShortName__c = lastName.left(3).toUpperCase();\n     \
  \   }\n    }\n}\n```\n\n前面的代码尝试填充驱动程序的短姓名，通常由其姓氏的前三个字符（大写）组成，因此 Lewis Hamilton 将变为\
  \ HAM。\n\n## 插入时验证\n\n以下验证逻辑在记录创建期间应用。它已添加到 Contestants Domain 类中，并确保只有在比赛处于 Scheduled\
  \ 状态时才能添加参赛者。\n\n它还演示了如何使用 Selector 模式类批量加载 Race__c 自定义对象的记录，该模式将在下一章中详细介绍：\n\n\
  ```\npublic override void onValidate() {\n    // Bulk load the associated races\n\
  \    Set<Id> raceIds = new Set<Id>();\n    for(Contestant__c contestant : (List<Contestant__c>)\
  \ Records) {\n        raceIds.add(contestant.Race__c);\n    }\n    Map<Id, Race__c>\
  \ associatedRaces =\n        new Map<Id, Race__c>(\n        new RacesSelector().selectById(raceIds));\n\
  \    // Only new contestants to be added to Scheduled races\n    for(Contestant__c\
  \ contestant :\n        (List<Contestant__c>) Records) {\n        Race__c race =\
  \ associatedRaces.get(contestant.Race__c);\n        if(race.Status__c != 'Scheduled')\
  \ {\n            contestant.addError(\n            'Contestants can only be added\
  \ to scheduled races');\n        }\n    }\n}\n```\n\n通过重写 onValidate 方法，逻辑始终调用 Apex\
  \ 触发器的 after 阶段。由于无法再对记录字段进行进一步编辑，因此这是执行逻辑的最安全位置。请始终牢记，您的 Apex 触发器可能不是分配给该对象的唯一触发器。例如，一旦您的软件包安装在订阅组织中，订阅者在您的对象上创建的自定义触发器可能会在您的触发器之前触发（触发器调用顺序不确定）并尝试修改字段。因此，对于托管软件包触发器，强烈建议在\
  \ after 阶段执行验证，以确保完全的信心和安全性，因为验证后数据不会再被修改。\n\n## 更新时验证\n\n提供了一种替代方法，即重写，用于实现适用于记录更新的验证逻辑。它是前面示例中所示\
  \ onValidate 方法的重载，用于在需要时传入数据库中的当前记录以供比较：\n\n```\npublic override void onValidate(\n\
  \    Map<Id, SObject> existingRecords) {\n    // Bulk load the associated races\n\
  \    Map<Id, Race__c> associatedRaces = queryAssociatedRaces();\n    // Can only\
  \ change drivers in scheduled races\n    for(Contestant__c contestant : (List<Contestant__c>)\
  \ Records) {\n        Race__c contestantRace =\n            associatedRaces.get(contestant.Race__c);\n\
  \        Contestant__c oldContestant =\n            (Contestant__c) existingRecords.get(contestant.Id);\n\
  \        if(contestantRace.Status__c != 'Scheduled' &&\n            contestant.Driver__c\
  \ != oldContestant.Driver__c) {\n            contestant.Driver__c.addError(\n  \
  \          'You can only change drivers for scheduled races');\n        }\n    }\n\
  }\n```\n\n前面的代码利用了一个新的自定义 Domain 类方法，用于共享加载关联 **比赛** 记录给 **参赛者** 的代码，这些代码用于前一示例所示的\
  \ onValidate 方法。该方法还使用 Records 属性来确定范围内的 **参赛者**：\n\n```\nprivate Map<Id, Race__c>\
  \ queryAssociatedRaces() {\n    // Bulk load the associated races\n    Set<Id> raceIds\
  \ = new Set<Id>();\n    for(Contestant__c contestant : (List<Contestant__c>) Records)\
  \ {\n        raceIds.add(contestant.Race__c);\n    }\n    return new Map<Id, Race__c>(\n\
  \        new RacesSelector().selectById(raceIds)\n    );\n}\n```\n\n> 前一个方法被标记为\
  \ private，因为目前无需将此功能暴露给其他类。最初，以这种方式限制方法通常被视为最佳实践，并允许在将来进行更轻松的内部重构或改进。如果出现需要访问此功能的需求，该方法可以设为\
  \ public。\n\n## 实现自定义 Domain 逻辑\n\nDomain 类不应将自身局限于仅包含与 Apex 触发器相关的逻辑。在以下示例中，上一章中介绍的用于计算锦标赛积分的代码已重构到\
  \ Contestants Domain 类中。这是一个更合适的位置，因为它直接适用于 Contestant 记录数据，并可以轻松在其他 Domain 和 Service\
  \ 层代码之间共享（我们将在本章后面介绍）：\n\n```\npublic void awardChampionshipPoints(fflib_ISObjectUnitOfWork\
  \ uow) {\n    // Apply championship points to given contestants\n    Map<Integer,\
  \ ChampionshipPoint__mdt> pointsByTrackPosition =\n        new ChampionshipPointsSelector().selectAllByTrackPosition();\n\
  \    for(Contestant__c contestant : (List<Contestant__c>) Records) {\n        //\
  \ Determine points to award for the given position\n        ChampionshipPoint__mdt\
  \ pointsForPosition =\n            pointsByTrackPosition.get(\n            Integer.valueOf(contestant.RacePosition__c));\n\
  \        if (pointsForPosition != null) {\n            // Apply points and register\
  \ for update with uow\n            contestant.ChampionshipPoints__c =\n        \
  \        pointsForPosition.PointsAwarded__c;\n            uow.registerDirty(contestant);\n\
  \        }\n    }\n}\n```\n\n请注意，**工作单元** 作为参数传递到这里，以便该方法可以将工作（记录更新）注册到负责提交工作的调用\
  \ Service 层方法。再次，与前面的 Domain 类方法一样，使用 `Records` 属性来访问要处理的 **参赛者** 记录。\n\n## 面向对象编程\n\
  \n使用 Apex 类的一大优势是能够利用 OOP 的强大功能。OOP 允许您观察对象间数据或行为的共同点，以共享代码或在不同对象之间应用通用处理。\n\n赛车世界中这种共同点的一个示例是规则；体育运动的每个方面都有一套需要遵守的规则和规定，例如\
  \ **驾驶员** 拥有 FIA **超级驾驶执照**、他们驾驶的赛车重量应至少高于规定的最小值，以及确保 **车队** 在测试赛车时未超过最大测试距离。此类合规性检查会定期进行，无论是赛前还是赛后。\n\
  \n## 创建合规性应用程序框架\n\n在我们的 FormulaForce 应用程序中，我们希望创建一个合规性框架，用于检查不同对象中的这些法规，同时为最终用户提供一致的用户界面体验来验证合规性。初始要求是在所有适用对象的\
  \ **详细信息页面** 上放置一个 **验证合规性** 按钮。\n\n执行验证过程的 **Visualforce 控制器** 和 **服务代码** 应该是通用的，并可在这些对象之间重复使用，而与每个对象关联的实际合规性检查逻辑将是特定的。通过使用\
  \ **Apex 接口**，我们可以为适用的 Domain 类定义此共同要求以供实现。\n\n在本节中，我们将使用 Apex 接口和一个通用服务来实现此要求，该服务可以接收应用程序中不同\
  \ Domain 对象的记录 ID。创建此类服务可以避免代码重复，无需在每个 Domain 类的代码中重复处理结果的逻辑，并为控制器提供一个集中式服务来消费，无论范围内的对象类型如何。\n\
  \n\n\n\n\n通过使用 Apex 接口和通用服务，我们按如下方式分离合规功能实现的功能关注点：\n\n- 服务层代码仅关注通过接口执行合规检查过程\n-\
  \ 控制器代码负责调用服务类方法执行合规检查，然后以一致的方式向用户呈现结果\n- 实现该接口的领域层类仅专注于根据对象类型，验证记录数据是否符合适用规则\n\n\
  有了这种关注点分离，就可以轻松显著修改或扩展检查的调用方式和向用户呈现的方式，而无需重新访问每个领域层类；或者，可以修改某个对象的合规逻辑，而不会影响整个应用程序的总体实现。\n\
  \n## Apex 接口示例\n\n接口有助于表达不同领域类之间的共同属性或行为。在本节中，我们将使用 Apex 接口来帮助暴露每个适用领域类中封装的合规检查逻辑。\n\
  \n为了练习和实现合规框架，FormulaForce 应用程序增加了一些额外的字段和对象。这些对象、附加类和 Visualforce 页面均包含在本章的代码示例中。\n\
  \n总结一下，为实现合规框架要求，已采取以下步骤。您可以跟随这些步骤操作，也可以直接参考本章的示例代码：\n\n- 1. 创建新的 Car 对象和选项卡。\n\
  - 2. 在 Car 对象上创建类型为 Number、长度为 6 的新 Weight 字段。\n- 3. 向 Driver 对象添加新的 FIA Super License\
  \ 字段。\n- 4. 创建新的 Cars 领域类和 CarsSelector 选择器类。\n- 5. 创建新的 ComplianceService 类和 ICompliant\
  \ 接口。\n- 6. 创建新的 Cars 和 Drivers 领域类并实现 ICompliant 接口。\n- 7. 更新 Application 类以实现领域类工厂\n\
  - 8. 创建利用领域工厂的新 ComplianceService.verify 方法。\n- 9. 创建用户界面以从实现该接口的各种对象访问服务。\n\n>\
  \ 最后一步将创建两个用户界面，一个用于 Salesforce Classic，另一个用于 Lightning Experience。ComplianceController\
  \ 类为每个对象的每个特定 Visualforce 页面提供通用控制器类。此外，ComplianceChecker 包提供了一个名为 Compliance Checker\
  \ 的通用 Lightning 组件，可以放置在任何对象页面上。\n\n以下各部分将从步骤 5 开始更详细地描述 Apex 代码。\n\n## 第 5 步 –\
  \ 定义通用服务\n\n目标是开发一个通用服务来处理整个应用程序中的所有合规验证。因此，创建了一个带有 verify 方法的新 ComplianceService\
  \ 类，该方法能够接收来自各种对象的 ID。如果有任何验证错误，它们将作为异常的一部分抛出。如果该方法在不抛出异常的情况下返回，则给定的记录是合规的。以下代码片段展示了带有\
  \ verify 方法的新 ComplianceService 类的创建：\n\n```\npublic class ComplianceService {\n\
  /**\n * Provides general support to verify compliance in the\n * application\n *\
  \ @throws ComplianceException for any failures\n */\npublic static void verify(Set<Id>\
  \ recordIds) {\n// Query the given records and delegate to the\n// corresponding\
  \ Domain class to check compliance\n// and report failures via ComplianceException\n\
  }\n```\n\n在深入了解如何实现此服务方法之前，请先看看新的 `ICompliant` 接口以及将由 Drivers 和 Cars 领域类实现的 `verifyCompliance`\
  \ 方法：\n\n```\npublic class ComplianceService {\n/**\n * Interface used to execute\
  \ compliance checking logic\n * in each domain class\n */\npublic interface ICompliant\
  \ {\nList<VerifyResult> verifyCompliance();\n}\n\n/**\n * Results of a compliance\
  \ verification for a given record\n */\npublic class VerifyResult {\npublic Id recordId;\n\
  public String complianceCode;\npublic Boolean passed;\npublic String failureReason;\n\
  }\n}\n```\n\n## 第 6 步 – 实现领域类接口\n\n`Drivers` 领域类按如下方式实现该接口（仅显示部分类）。它检查 FIA Super\
  \ License 字段是否已选中，如果未选中，则报告相应的合规代码和失败消息：\n\n```\npublic class Drivers extends ApplicationDomain\n\
  implements ComplianceService.ICompliant {\npublic List<ComplianceService.VerifyResult>\
  \ verifyCompliance() {\nList<ComplianceService.VerifyResult> compliances =\nnew\
  \ List<ComplianceService.VerifyResult>();\nfor(Driver__c driver : (List<Driver__c>)\
  \ Records) {\nComplianceService.VerifyResult license =\nnew ComplianceService.VerifyResult();\n\
  license.ComplianceCode = '4.1';\nlicense.RecordId = driver.Id;\nlicense.passed =\
  \ driver.FIASuperLicense__c;\nlicense.failureReason =\nlicense.passed ? null :\n\
  'Driver must have a FIA Super License.';\ncompliances.add(license);\n}\nreturn compliances;\n\
  }\n}\n```\n\nCars 领域类（仅显示部分类）按如下方式实现 verifyCompliance 方法，检查汽车是否超过指定重量：\n\n```\n\
  public class Cars extends ApplicationDomain\n    implements ComplianceService.ICompliant\
  \ {\npublic List<ComplianceService.VerifyResult> verifyCompliance() {\n    List<ComplianceService.VerifyResult>\
  \ compliances =\n        new List<ComplianceService.VerifyResult>();\n    for(Car__c\
  \ car : (List<Car__c>) Records) {\n        // Check weight compliance\n        ComplianceService.VerifyResult\
  \ license =\n            new ComplianceService.VerifyResult();\n        license.ComplianceCode\
  \ = '4.1';\n        license.RecordId = car.Id;\n        license.passed =\n     \
  \       car.Weight__c !=null && car.Weight__c>= 691;\n        license.failureReason\
  \ = license.passed ? null :\n            'Car must not be less than 691kg.';\n \
  \       compliances.add(license);\n    }\n    return compliances;\n}\n}\n```\n\n\
  ## 第 7 步 – 领域类工厂模式\n\n下一步是根据传入 `ComplianceService.verify` 方法的记录 ID，动态构建关联的领域类。实现的这一部分使用了领域类的工厂模式实现。\n\
  \n> 关于工厂模式的 Wikipedia 参考可在 http://en.wikipedia.org/wiki/Factory_method_pattern 上找到。\n\
  \n实现使用 Apex 运行时 `Id.getSObjectType` 方法来确定 `SObjectType`，然后通过以下代码所示的 `Maps`，确定要使用的适用领域类和选择器类（以查询记录）。\n\
  \n然后使用 Apex 运行时 `Type.newInstance` 方法来构建领域类和选择器类的实例。通过调用 `Application.Domain.newInstance`\
  \ 方法来调用工厂功能。Application 类上的 `Domain` 字段使用 `fflib_Application.DomainFactory` 类按如下方式实现：\n\
  \n```\npublic class Application {\n  public static final fflib_Application.DomainFactory\
  \ Domain =\n    new fflib_Application.DomainFactory(\n      Application.Selector,\n\
  \      // Map SObjectType to Domain Class Constructors\n      new Map<SObjectType,\
  \ Type> {\n        Race__c.SObjectType => Races.Constructor.class,\n        Car__c.SObjectType\
  \ => Cars.Constructor.class,\n        Driver__c.SObjectType => Drivers.Constructor.class\n\
  \      });\n}\n```\n\n> 作为开发人员，您当然可以直接实例化特定的领域类。但是，这种领域类工厂方法允许根据传递给 newInstance\
  \ 方法的 ID 关联的 SObjectType 在运行时选择特定的领域类。这是实现下一步所示的通用服务入口点的关键。领域类工厂的前面初始化还传入了 Application.Selector；这是另一个与能够查询数据库的类相关的工厂。下一章将更详细地介绍选择器模式和选择器工厂。\n\
  \n## 第 8 步 – 实现通用服务\n\n以下代码中使用的 `Application.Domain.newInstance` 方法用于访问上一步中定义的领域类实例工厂。\n\
  \n该方法返回 `fflib_ISObjectDomain`，因为这是所有领域类的共同基接口。然后，使用 `instanceof` 运算符，它确定是否实现了 `ICompliant`\
  \ 接口，如果是，则调用 `verifyCompliance` 方法。以下代码展示了通用服务的实现：\n\n```\npublic class ComplianceService\
  \ {\n  public static void verify(Set<Id> recordIds) {\n    // Dynamically create\
  \ Domain instance for these records\n    fflib_ISObjectDomain domain =\n      Application.Domain.newInstance(recordIds);\n\
  \    if (domain instanceof ICompliant) {\n      // Ask the domain class to verify\
  \ its compliance\n      ICompliant compliantDomain = (ICompliant) domain;\n```\n\
  \n\n\n\n\n\nList<VerifyResult> verifyResults =\ncompliantDomain.verifyCompliance();\n\
  if (verifyResults != null) {\n    // Check for failed compliances\n    List<VerifyResult>\
  \ failedCompliances =\n    new List<VerifyResult>();\n    for (VerifyResult verifyResult\
  \ : verifyResults) {\n    if (!verifyResult.passed) {\n        failedCompliances.add(verifyResult);\n\
  \    }\n    }\n    if (failedCompliances.size() > 0) {\n    throw new ComplianceException(\n\
  \        'Compliance failures found.', failedCompliances);\n    return;\n    }\n\
  \    }\nthrow new ComplianceException(\n    'Unable to verify compliance.', null);\n\
  }\n}\n\n> 请注意，如果将对象的 ID 传递给 verify 方法，但该对象没有相应的 Domain 类，则工厂会抛出异常。但是，如果找到了 domain\
  \ 类但未实现该接口，则前面的代码会直接在不报错的情况下返回，不过开发者在这种情况下该做什么由他们决定。\n\n## 第 9 步 – 从通用控制器使用通用服务\n\
  \n在本步骤中，我们将从 Visualforce 控制器和 Lightning 组件控制器使用相同的 ComplianceService.verify 方法。这些用户界面也具有高度通用性，因此更易于应用于未来版本中的新对象。\n\
  \n## 使用 Visualforce 的通用合规验证 UI\n\n已创建一个名为 ComplianceController 的通用 Visualforce 控制器，其中包含调用服务的\
  \ verify 操作方法。请注意，我们从未提及过特定的自定义对象或 Domain 类，确保此控制器和服务具有通用性，能够处理不同类型的对象。以下代码展示了如何从\
  \ ComplianceController.verify 方法调用通用的 ComplianceService.verify 方法：\n\n```\npublic\
  \ PageReference verify() {\n    try {\n        // Pass the record to the compliance\
  \ service\n        ComplianceService.verify(\n            new Set<Id> { standardController.getId()\
  \ });\n        // Passed!\n        ApexPages.addMessage(\n            new ApexPages.Message(\n\
  \                ApexPages.Severity.Info, 'Compliance passed'));\n    }\n    catch\
  \ (Exception e) {\n        // Report message as normal via apex:pageMessages\n \
  \       ApexPages.addMessages(e);\n        // Display additional compliance failure\
  \ messages?\n        if (e instanceof ComplianceService.ComplianceException)\n \
  \       {\n            ComplianceService.ComplianceException ce =\n            \
  \    (ComplianceService.ComplianceException) e;\n            for (ComplianceService.VerifyResult\
  \ verifyResult :\n                ce.failures) {\n                ApexPages.addMessage(new\
  \ ApexPages.Message(\n                    ApexPages.Severity.Error,\n          \
  \          String.format('{0} ({1})', new List<String> {\n                     \
  \   verifyResult.failureReason,\n                        verifyResult.complianceCode\
  \ })));\n            }\n        }\n    }\n    return null;\n}\n```\n\n然后创建 Visualforce\
  \ 页面，将此通用控制器绑定到 Driver 和 Car 详细信息页面上的自定义按钮。这是唯一针对实现 ComplianceService.ICompliant\
  \ 接口的对象的特定引用，并且仅用于在 Salesforce Classic 中创建自定义按钮。以下针对 Driver 对象的页面定义了一个使用通用 ComplianceController.verify\
  \ 方法的按钮：\n\n```\n<apex:page standardController=\"Driver__c\"\n    extensions=\"\
  ComplianceController\" action=\"{!verify}\">\n<apex:pageMessages/>\n<apex:form>\n\
  <apex:commandButton value=\"Cancel\" action=\"{!cancel}\"/>\n</apex:form>\n</apex:page>\n\
  ```\n\n## 使用 Lightning 组件的通用合规验证 UI\n\n本节描述的组件可以无需任何进一步配置即可放置在任何对象的 Lightning Experience\
  \ 或 Salesforce1 Mobile 记录页面上。该组件使用与先前的 Visualforce 示例相同的服务，以动态调用适当的 Domain 类并应用相关的验证流程。\n\
  \n> Lightning 组件将在后续章节中详细介绍。此组件演示了组件可用于扩展 Lightning Experience 和平台其他方面的众多位置之一。\n\
  \n以下代码展示了组件的 Apex 控制器：\n\n```\npublic with sharing class ComplianceCheckerComponent\
  \ {\n\n    @AuraEnabled\n    public static List<String> verify(Id recordId) {\n\
  \        try {\n            // Verify the given record for compliance\n        \
  \    ComplianceService.verify(new Set<Id> { recordId });\n            // Success,\
  \ all good!\n            return null;\n        } catch (Exception e) {\n       \
  \     // Report message as normal via apex:pageMessages\n            List<String>\
  \ messages = new List<String> { e.getMessage() };\n            // Display additional\
  \ compliance failure messages?\n            if (e instanceof ComplianceService.ComplianceException)\
  \ {\n                ComplianceService.ComplianceException ce =\n              \
  \      (ComplianceService.ComplianceException) e;\n                for (ComplianceService.VerifyResult\
  \ verifyResult : ce.failures) {\n                    messages.add(String.format('{0}\
  \ ({1})',\n                        new List<String> {\n                        \
  \    verifyResult.failureReason,\n                            verifyResult.complianceCode\
  \ })));\n                }\n            }\n            return messages;\n      \
  \  }\n    }\n}\n```\n\n以下代码展示了组件标记、JavaScript 控制器和 helper：\n\n### ComplianceChecker.cmp:\n\
  \n```\n<aura:component implements=\"force:hasRecordId,flexipage:availableForRecordHome\"\
  \ controller=\"ComplianceCheckerComponent\" access=\"global\">\n<aura:dependency\
  \ resource=\"markup://force:editRecord\"\n type=\"EVENT\" />\n<aura:attribute name=\"\
  category\" type=\"String\"\n default=\"success\" />\n<aura:attribute name=\"messages\"\
  \ type=\"String[]\" />\n<aura:handler name=\"init\" value=\"{!this}\"\n action=\"\
  {!c.onInit}\"/>\n<aura:handler event=\"force:refreshView\"\n action=\"{!c.onRefreshView}\"\
  />\n<div class=\"{!'slds-box slds-theme--' + v.category}\">\n<aura:iteration items=\"\
  {!v.messages}\" var=\"message\">\n<p><ui:outputText value=\"{!message}\"/></p>\n\
  </aura:iteration>\n</div>\n</aura:component>\n```\n\n> 前面的代码处理了 Lightning Experience\
  \ 框架在用户编辑记录时发送的 force:refreshView 事件。由于指定了 flexipage:availableForRecordHome 接口，因此该组件只能放置在记录页面上。\n\
  \n```\nComplianceCheckerController.js:\n\n({\n  onInit : function(component, event,\
  \ helper) {\n    helper.verifyCompliance(component, event, helper);\n  },\n  onRefreshView\
  \ : function(component, event, helper) {\n    helper.verifyCompliance(component,\
  \ event, helper);\n  }\n})\n\nComplianceCheckerHelper.js:\n\n({\n\n  verifyCompliance\
  \ : function(component) {\n\n    var action = component.get(\"c.verify\");\n   \
  \ action.setParams({ \"recordId\" :\n      component.get(\"v.recordId\") });\n \
  \   action.setCallback(this, function(response) {\n      if(response.getState()\
  \ == 'SUCCESS') {\n        var messages = response.getReturnValue();\n        if(messages!=null)\
  \ {\n          component.set(\"v.category\", \"error\");\n          component.set(\"\
  v.messages\", messages);\n        } else {\n          component.set(\"v.category\"\
  , \"success\");\n          component.set(\"v.messages\", [\"Verified compliance\"\
  \ ]);\n        }\n      }\n    });\n\n    $A.enqueueAction(action);\n\n  }\n})\n\
  \n```\n\n与 Visualforce 页面不同，此处未对任何对象做特定引用，因此该组件可用于任何页面。\n\n> 如果你希望在 Lightning App\
  \ Builder 工具中限制组件的可见性（用户在该工具中自定义 Lightning Experience 和 Salesforce1 Mobile），可以在\
  \ .design 文件中使用 sfdc:objects 标签。\n\n```\n<sfdc:objects>\n<sfdc:object>Driver__c</sfdc:object>\n\
  <sfdc:object>Car__c</sfdc:object>\n</sfdc:objects>\n```\n\n## 总结合规框架实现\n\n通过使用 Apex\
  \ 接口和工厂模式，应用程序中已建立一个框架，以确保合规逻辑得到一致实现。这只是实现 Domain 类接口并创建 Visualforce 页面或使用通用 Lightning\
  \ 组件的简单问题，以便在未来为其他适用对象启用该功能。\n\n> 由于此功能已作为服务实现，因此也可以轻松地从 Batch Apex 或 Scheduled\
  \ 上下文中重用。\n\n以下屏幕截图展示了 Driver 对象上的 Verify Compliance 按钮。在按下按钮之前，请确保 FIA Super License\
