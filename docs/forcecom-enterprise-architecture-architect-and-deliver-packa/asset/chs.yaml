  \ 在第 21 行第 13 列\n\n这是因为测试类的 Apex 类元数据中的包版本信息仍引用最初编写代码时安装的包版本。升级包不会更改此情况。打开“版本设置”选项卡，并更改为你刚刚安装的版本，以修复此编译问题\n\
