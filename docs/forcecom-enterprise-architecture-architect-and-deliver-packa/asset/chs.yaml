  ## 总结


  在本章中，我们深入探讨了平台如何执行 Apex 代码以及执行的不同上下文。我们还花时间了解状态和安全性等关键概念是如何管理的，并重点介绍了一些 Apex 限制及其各自的范围。


  这使我们能够观察到一些常见需求，并将其提炼为关注点分离（Separation of Concerns），我们可以开始将其作为准则应用于业务应用程序代码的各层中，从而使
  Apex 逻辑更加可复用，并能随着您的应用程序功能（甚至平台本身）的发展而从不同上下文中访问。


  随着我们在实践关注点分离方面不断深入，Domain、Service 和 Selector 层的模式将成为我们应用程序业务逻辑内进一步的分离层。在接下来的三章中，我们将继续定义命名和编码准则，以便于现有开发人员和刚开始使用代码库的开发人员更容易维护良好的关注点分离。


  ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_163_0.png)


  如果您有现有的代码库，并且不知道从哪里开始将其中的代码重构到本章描述的各层中，我的建议是：最初专注于形成您的 Service 层契约，并尽可能将真正的业务逻辑代码重构到其中。使您的执行上下文类（例如控制器和
  Batch Apex 类，但最初不包括触发器）尽可能精简，让它们专注于自身的职责，如错误处理。这将至少使您的一些真正的业务应用程序逻辑包含在 Service 层之下，即使它可能不是您希望从零开始编写时所要的精确形式。之后，您可以专注于将触发器逻辑重构到
  Domain 层，再将查询逻辑重构到独立的 Selector 类中，或许可以随着您对应用程序增强区域的修订而逐步进行。

