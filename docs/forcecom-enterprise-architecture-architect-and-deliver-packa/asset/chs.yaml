  \ (已安装包: FormulaForce)\n\nSeasonService (已安装包: FormulaForce)\n\n## 修改和弃用应用程序 API\n\
  \n当一个 `global` 类方法或成员通过包含在已发布的包中而发布后，将无法将其删除或更改。例如，尝试将 `ComplianceService.verify`\
  \ 方法重命名为 `verification`（例如）。当您尝试保存类时，将收到以下错误：\n\n```\n(ComplianceService) Global/WebService\
  \ identifiers cannot be removed from managed application: Method: void verify(SET<Id>)\
  \ (Line: 1)\n```\n\n> 如果您想在保留更改新 API 的能力的同时进行一些测试或分发您的包，请将您的包作为 Beta 上传，直到您对 API\
  \ 定义满意为止。请注意，您当然可以随时更改 API 的行为（由其背后的 Apex 代码决定），但这必须谨慎进行。\n\n`@Deprecated` 注解可用于有效地从后续包版本消费者的角度删除应用了\
  \ `global` 的类、接口、方法或成员的可见性。`Developer X` 仍可以通过类版本设置（在 **版本设置** 选项卡中显示，如以下各节中详细所述）引用包的早期版本来访问已弃用的项目。\n\
  \n> 在编写本文时，`@Deprecated` 标志无法在未托管的开发者组织中使用。在后续章节中，我们将讨论一种团队开发模型，该模型允许通过在源代码控制系统中管理代码并为每位开发者单独管理开发者组织来开发您的应用程序。尽管这种开发风格有许多好处，但它排除了使用\
  \ `@Deprecated` 标志，因为此类组织实际上是未托管的。\n\n## 对 Apex API 定义进行版本控制\n\n保存时，`ApplicationAPITest`\
