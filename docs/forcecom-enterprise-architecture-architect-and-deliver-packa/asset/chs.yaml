  \ v1.8 中可用，而 `report` 方法在 v1.9 中可用；同样，你的版本号可能不同：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_369_0.png)\n\
  \n## 对 Apex API 行为进行版本控制\n\nAPI 定义不是版本之间可能发生变化的唯一方面。即使定义保持不变，其背后的代码也可能更改 API 的行为。Apex\
  \ 运行时为打包代码提供了一种手段，以确定由 *开发者 X* 编写的调用代码期望哪个版本。可以通过调用 `System.requestVersion` 方法获得此信息。有了这些信息，你的打包代码可以根据调用代码的期望修改其行为。\n\
  \n随着你发布更多包版本且功能增长，这种代码的管理会变得更加复杂。还要注意，此功能仅适用于位于打包组织或特定托管代码中的代码。在标准开发组织中，此方法将抛出运行时异常。基本上，如果你计划将代码重新定位到打包组织之外（例如，按照本书最后一章讨论的团队开发模型），则此方法不可用。\n\
  \n版本控制行为的另一种方法是考虑应用程序逻辑的变化是 *开发者 X* 希望选择加入的内容，还是在包升级后立即对其现有代码可用。修复错误或改进信息处理方式的小改进可能是你希望无论\
  \ API 版本如何都可用的内容。但是，其他更改（例如值的计算方式或添加显著新处理）可能会证明需要新的 API 方法或参数，以便 *开发者 X* 修改其代码来使用。与\
  \ UI 中一样，你会选择添加新选项卡、页面或按钮。\n\n通过考虑何时对 API 行为进行版本控制，你已将何时接受新 API 行为的选择交到 *开发者 X*\
  \ 手中。关键的是，通过考虑向后兼容性，你不会因集成失败而阻止升级到你的包的最新版本。发现由行为更改引起的向后兼容性回归问题，随着你发布的版本越多、客户群中支持的版本越多，就会变得越困难。因此，确保你拥有强大的\
  \ API 测试策略变得至关重要。\n\n## 提供 RESTful 应用程序 API\n\n迄今为止，我们一直关注 *开发者 X* 作为平台内 Apex 开发者，以及你可以通过\
  \ Apex 提供应用程序 API 的方式。但是，*开发者 X* 也可能在平台外进行编码，需要从 Java 或 Microsoft .NET 或移动应用程序调用你的应用程序\
  \ API。也许他们想要编写一个小型专用移动应用程序，用于检查团队、司机或汽车的合规性。\n\n本章的这一部分将重点介绍公开前面合规性 API 的 REST API，供与你的应用程序编写集成的平台外开发者使用。请记住，与平台内场景一样，Salesforce\
  \ 通过 SOAP 和 REST 提供许多标准 Salesforce API，平台外编码的 *开发者 X* 可以使用这些 API 来创建、读取、更新和删除存储在你的应用程序自定义对象中的记录。\n\
  \nApex 提供支持，通过在 Apex 类中放置 `webservice` 关键字来通过 Web 服务（SOAP）公开应用程序逻辑。如果你想要公开 SOAP\
  \ API，则在将此关键字应用于服务类上的方法后，平台可以生成相应的 WSDL。本书中设计的服务恰好与 Web 服务的一般要求相当吻合。\n\n请注意，上述 `@Deprecated`\
  \ 属性不能以这种方式用于公开的 Apex 代码。不过，需要考虑的一点是，生成的 WSDL 不是版本化的；它们仅基于你的包已安装版本的代码生成。*开发者 X*\
  \ 无法从以前的包版本生成其历史版本。虽然使用 `webservice` 关键字的 Apex 方法受与 `global` 相同的限制，但你不能通过版本来排除 Web\
  \ 服务中的新方法或字段。\n\nApex 还提供支持，用于创建你自己的 REST API，并在 *Apex 开发者指南* 中提供了一些优秀的参考文档。但是，它未涵盖\
  \ REST API 设计注意事项，通常称为 RESTful。\n\n在不先理解什么是 RESTful 的情况下公开 REST API 会犯很多错误。在深入使用你的服务层来提供\
  \ REST API 之前，让我们先了解更多关于 RESTful 的内容。\n\n## RESTful 的关键方面\n\n对 RESTful API 设计的完整讨论和概述很容易占用整个章节。以下是关键\
  \ RESTful 设计目标的摘要，以及它们如何应用于通过 Apex 交付的 REST API（平台会为你处理一些指导原则）。随着我们进一步讨论此主题，术语 *操作*\
  \ 表示应用程序服务层类中的方法。这将用于帮助公开应用程序的 REST API，但不应指导其设计。\n\n没有单一的指导原则列表，有些原则可供解释。但是，如果你在\
  \ Google 中输入 *设计 RESTful API*，你肯定会找到一些有用的阅读材料。我建议你专注于那些提供洞察的文章，说明 Facebook、LinkedIn\
  \ 和 Salesforce 等较大服务本身如何解释 RESTful，例如 http://www.apigee.com/。\n\n## 你的应用程序资源是什么？\n\
  \n在 RESTful 世界中，你的操作与通过统一资源标识符 (URI) 表示的资源关联。资源可以是应用程序中的实体（例如自定义对象），也可以是概念性实体。这与之前研究过的\
  \ Apex API 所基于的服务层设计不同，在该设计中，操作是通过将它们分组在应用程序的功能区域下来表示的，然后由针对每个操作的 Apex 服务类和方法来表示。\n\
  \nSalesforce REST API 使用自定义对象来定义 REST URI 使用的物理资源，允许你构建 URI 并使用各种 HTTP 方法执行创建、读取、更新和删除操作。例如，要检索记录，可以通过开发者工作台工具发出以下请求：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_372_0.png)\n\n在公开更多面向业务流程或任务而非以数据为中心的操作的情况下，很难确定资源名称实际上应该是什么？因此，花时间与整个产品团队规划并达成一致，确定应用程序中的关键\
  \ REST 资源并坚持使用它们，是值得的。\n\n\n\n\n\n我们 FormulaForce 包中属于此类别的一个操作是合规性报告。该操作针对多个不同的自定义对象记录来报告合规性，例如驱动程序、汽车和车队。我们是应该定义一个针对这些物理资源各自单独应用的\
  \ URI，还是创建一个新的逻辑合规性资源？\n\n在本章中，我选择了后者，因为这样做感觉更具扩展性，同时还利用了应用程序中的合规性服务，该服务已经支持向合规性检查器添加新的对象类型。因此，REST\
  \ API 将支持新的对象类型，而无需对 API 进行未来更改，因为它们已添加到合规性检查器中。\n\nSalesforce 规定用于定义资源的 URI 的初始部分，其余部分由开发人员定义。对于合规性\
  \ REST API，我们将使用此 URI：\n\n/services/apexrest/compliance\n\n一旦你打包实现此 REST API 的 Apex\
  \ 代码，你会发现前面的 URI 需要由你的包命名空间限定，因此从开发人员 X 的角度来看，它将采用如下所示的格式，其中 fforce 是我的命名空间。我们将在本章后面测试合规性\
  \ REST API 时使用这种 URI 格式：\n\n/services/apexrest/fforce/compliance\n\n## 将 HTTP 方法映射\n\
  \n针对给定资源 URI 的应用程序操作应映射到 REST 基于的标准 HTTP 方法之一：GET、POST、PUT、PATCH 和 DELETE。在整个 REST\
  \ API 中选择使用哪种方法并保持一致至关重要。同样，互联网上有许多资源详细讨论了此主题。以下是我对这些阅读材料的解读的简要总结：\n\n- GET：此方法通常用于查询数据库的操作，其参数可以轻松地在\
  \ URI 结构中表达，或其参数与该方法非常匹配。\n\n- PUT 与 POST：这些方法通常用于创建、更新或查询数据库的操作，且参数更为复杂，例如无法反映在\
  \ URI 参数中的列表或信息结构。还有一个关于 **幂等** 术语的考虑（有关此术语的完整定义，请查看 Wikipedia），它涉及请求是否可以重复多次，并在数据库中产生相同的状态。随着你深入研究\
  \ RESTful 设计准则，该术语通常决定了使用 PUT 还是 POST。\n\n- PATCH：此方法通常用于仅更新现有信息的操作，例如某条记录或跨越多条记录的某些其他复杂数据集。\n\
  \n- DELETE：此方法当然用于删除 URI 中表达的现有信息。\n\n我们将使用 `POST` HTTP 方法和 `/services/apexrest/compliance`\
  \ 资源 URI 来实现合规性验证操作的 REST API，将要验证的记录列表作为 HTTP 请求体的一部分，使用 JSON 数据格式传递。\n\n## 提供\
  \ Apex REST 应用程序 API\n\n以下 Apex 类遵循以 `[ResourceName]Resource` 作为类名的命名约定，然后定义适当的方法（在这种情况下方法名称不那么重要），并将其相应地映射到\
  \ URL 映射的 HTTP 方法。这已包含在本章的示例代码中：\n\n```\n@RestResource(urlMapping='/compliance')\n\
  global with sharing class ComplianceResource {\n  @HttpPost\n  global static List<ComplianceService.VerifyResult>\n\
  \  report(List<Id> Ids) {\n    return ComplianceService.report(new Set<Id>(Ids));\n\
  \  }\n}\n```\n\n关于前面的示例，以及一般来说关于将 Service 层方法包装在 Apex REST 方法中以创建 REST API，有几点需要注意：\n\
  \n- 前面的示例使用 ComplianceService 中的 VerifyResult 类。你可能希望在 ComplianceResource 类范围内创建自己的类，以进一步隔离。\n\
  \n- 此类中的方法应根据一般 Service 层调用准则，委托给 Service 类中一个且仅一个适用的方法，以维护事务范围并关注点分离。\n\n- 不建议将\
  \ Apex 资源类仅映射到特定的 Service 类，因为你较早的 RESTful API 设计可能与你的 Service 类设计不匹配，尽管它仍应委托给该类。\n\
  \n- 将这些类视为 UI 控制器来处理，仅根据需要包含封送和错误处理逻辑。\n\n- 通常你不需要捕获来自 Service 层的异常（与 Visualforce\
  \ 控制器操作方法调用者不同），因为 Apex REST 运行时会捕获异常并返回相应的 REST API 错误代码和消息。避免实现你自己的 REST API 错误处理。\n\
  \n- 仍然需要 `global` 修饰符。请记住，对这些方法的更改适用相同的打包限制。\n\n- 开发人员 X 的 Apex 开发人员可以从 Apex 调用这些方法，因为它们是\
  \ `global`。但是，这不应被鼓励，因为这些方法可能引用未在标准 Apex 上下文中初始化的 REST API 上下文变量。\n\n- `Set` Apex\
  \ 数据类型不受 Apex REST 方法支持。与 Service 类方法已建立的标准不同，`Set` Apex 数据类型不受 Apex REST 方法支持。因此，你需要将\
  \ `List<Id>` REST 方法参数转换为 `Set<Id>` 集合，以供你的 Service 方法调用。\n\n- `ComplianceService.verify`\
  \ 方法会抛出包含特定合规性失败附加信息的异常。但是，自定义 Apex 异常中的信息不会由平台自动序列化——仅包含错误消息。在这种情况下，需要自定义响应来捕获异常并返回信息。\n\
  \n## 调用你的 Apex REST 应用程序 API\n\n可以使用 Salesforce Developer Workbench 来调用前面的 REST\
  \ API。找到未选择 FIA 超级驾驶执照字段的 Driver 记录，并使用以下 ID。请注意，以下屏幕截图中显示的 URI 包含包命名空间 fforce。要尝试此操作，你需要将此替换为你选择的包命名空间：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_375_0.png)\n\n## 对 Apex REST 应用程序 API\
  \ 进行版本控制\n\n对 REST API 进行版本控制的公认方式是将版本包含在 URI 中。请注意，前面显示的标准 Salesforce REST API\
  \ 示例中包含了 v30.0（Salesforce 平台版本），但公开合规性报告操作的 REST API 的 URI 中未包含版本。平台不提供以与其自身 API\
  \ 相同的方式对 Apex REST API 进行版本控制的功能。\n\n### 行为版本控制\n\nSalesforce REST API 和任何公开的 Apex\
  \ REST API 都可以从新的 HTTP 头中接收，例如 x-sfdc-packageVersion-fforce: 1.10。在 Apex REST API\
  \ 的情况下，可以使用此头来允许打包的 API 代码实现行为版本控制。这可以用于设置本章前面所述的 System.requestVersion 返回的版本。\n\
  \n此头是可选的；如果没有它，则假设为当前安装的包版本。我之前关于行为版本控制利用的建议也适用于此。因为该头是可选的，所以其有用性被稀释。\n\n### 定义版本控制\n\
  \n前面的 HTTP 头不以本章前面为 Apex API 所示的平台方式影响 API 定义的可见性。解决此问题的一个选项是将版本化的 URI 映射到每个版本的特定\
  \ Apex 资源类，例如，为合规性 REST API 的 v1.0 和 v2.0 版本提供支持。这种方法允许你公开包含版本的 URI：\n\n```\n/service/apexrest/fforce/v1.0/compliance\n\
  /service/apexrest/fforce/v2.0/compliance\n```\n\n在对 API 定义进行版本控制时，你还需要捕获 Service\
  \ 层中使用的 Apex 数据类型的副本。这将使每个 REST API 版本与 Service 层的底层变化隔离开来，随着其演进。这里的主要编码开销将是 Service\
  \ 层中定义的 Apex 类型（始终是最新版本）与实现 REST API 的类中的类型之间的封送。\n\n\n\n\n\n例如，为报告 API 进行版本控制时，我们需要在创建\
  \ API 类时将其类型作为内部 Apex 类捕获。以下示例说明了 v1.0 的此过程。您可以看到 API 的定义如何封装在由 v1_0 后缀表示的特定版本的\
  \ Apex 类中：\n\n```\n@RestResource(urlMapping='/v1.0/compliance')\nglobal with sharing\
  \ class ComplianceResource_v1_0 {\n\nglobal class VerifyResult {\n    global Id\
  \ recordId;\n    global String complianceCode;\n    global Boolean passed;\n   \
  \ global String failureReason;\n}\n\n@HttpPost\nglobal static List<VerifyResult>\
  \ report(List<Id> Ids) {\n\n    List<VerifyResult> results = new List<VerifyResult>();\n\
  \    for(ComplianceService.VerifyResult result :\n        ComplianceService.report(new\
  \ Set<Id>(Ids)))\n        results.add(makeVerifyResult(result));\n    return results;\n\
  }\n\nprivate static VerifyResult\nmakeVerifyResult(ComplianceService.VerifyResult\
  \ verifyResult) {\n    VerifyResult restVerifyResult = new VerifyResult();\n   \
  \ restVerifyResult.recordId = verifyResult.recordId;\n    restVerifyResult.complianceCode\
  \ = verifyResult.complianceCode;\n    restVerifyResult.passed = verifyResult.passed;\n\
  \    restVerifyResult.failureReason = verifyResult.failureReason;\n    return restVerifyResult;\n\
  }\n}\n```\n\n您使用的版本号可以是任何您喜欢的内容，但您可以考虑遵循您的软件包版本编号序列。\n\n以这种方式对 Apex REST API 进行版本控制并不理想，因为必须通过代码手动对定义进行版本控制，并且在软件包的每个版本中管理该代码会带来额外开销。但是，如果不采用这种方法，始终会暴露软件包中\
  \ Apex REST API 的最新定义。这意味着在升级软件包后，调用者会收到他们未预期的响应中的新字段。也没有方法可以弃用 Apex REST API。但是，由于对\
  \ `global` 类成员的删除限制，开发人员在意外删除会破坏现有请求的字段时有一定的保护。\n\n## Exposing Lightning Components\n\
  \n在前一章中，我们查看了 FormulaForce 软件包中包含的几个组件。这些组件已全部通过 `global` 访问级别公开，以供订阅者组织中的工具和开发人员代码使用。\n\
  \n当开发人员在其自身组件中使用这些组件时，可以通过包元数据中的设施来表达他们希望平台在代码与打包组件交互时假定的软件包版本。这允许对组件的定义和行为进行版本控制。如果没有此信息，则假定当前安装的软件包版本。\n\
  \n`System.requestVersion`、`{!Version}` 和 `cmp.getVersion()` 可用于确定组件在 Apex 或 JavaScript\
  \ 中需要遵循的版本。\n\n## Extending Process Builder and Visualflow\n\n**Process Builder**\
  \ 或 **Visualflow** 工具允许用户创建自定义流程和类似向导的用户体验。这两种工具都提供大量可操作的动作，这些动作基于用户定义的条件执行。\n\n\
  可用操作可以由安装在组织中的软件包扩展。这为您提供了另一种公开功能以构建自定义场景的方法。这种方法不需要用户编写任何代码。\n\nThe following code\
  \ creates an **Invocable Method**, which is a `global` class and a single method\
  \ with some specific annotations. These annotations are recognized by the tools\
  \ to present a dynamic configuration UI to allow the user to pass information to\
  \ and from the method you annotate:\n\n```\nglobal with sharing class UpdateStandingsAction\
  \ {\n\n    global class UpdateStandingsParameters {\n\n        @InvocableVariable(\n\
  \        Label='Season Id'\n        Description='Season to update the standings\
  \ for',\n        Required=True)\n        global Id seasonId,\n        @InvocableVariable(\n\
  \        Label='Issue News Letter'\n        Description='Send the newsletter out\n\
  \        to the teams and drivers'\n        Required=False)\n        global Boolean\
  \ issueNewsLetter;\n    }\n}\n```\n\n```\nprivate SeasonService.UpdateStandings\
  \ makeUpdateStandings() {\n    SeasonService.UpdateStandings updateStandings =\n\
  \    new SeasonService.UpdateStandings();\n    updateStandings.seasonId = this.seasonId;\n\
  \    updateStandings.issueNewsLetter = this.issueNewsLetter;\n    return updateStandings;\n\
  }\n}\n```\n\n```\n@InvocableMethod(\nLabel='Update the leaderboard of the season'\n\
  Description='Updates the standings and optionally\nsends the newsletter.')\nglobal\
  \ static void\nupdateStandings(\nList<UpdateStandingsParameters> parameters) {\n\
  \    // Marshall parameters into service parameters\n    List<SeasonService.UpdateStandings>\
  \ updateStandings =\n    new List<SeasonService.UpdateStandings>();\n    for (UpdateStandingsParameters\
  \ parameter : parameters) {\n    updateStandings.add(parameter.makeUpdateStandings());\n\
  \    }\n    // Call the service\n    SeasonService.updateStandings(updateStandings);\n\
  }\n}\n```\n\n> 为将此方法的参数与 Service 类方法的变化隔离开来，使用了 UpdateStandings Apex 类。如果需要，这还允许方法向不同方向演变。\n\
  \n以下显示了上述 Invocable Method 在 Process Builder 中的外观：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_380_0.png)\n\
  \n当比赛结束时，此方法可例如用作上述订阅者定义的 Process Builder 流程的一部分。虽然您可以在 Apex Trigger 中执行此操作，但这可能涉及特定于您软件包订阅者的某些附加条件。因此，这是\
  \ Process Builder 的一个良好用例，并通过 Invocable Method 公开 SeasonService.updateStandings\
  \ 方法。\n\n> 有关 Invocable Methods 和上述属性的更多信息，请查阅 Apex 开发者指南。关于可传递的参数类型存在各种限制，例如参数必须为列表形式。这与\
  \ Service 层的批量化要求非常契合。\n\n## Versioning Invocable Methods\n\nProcess Builder 或 VisualFlow\
  \ 都不会记录引用可调用方法时使用的软件包版本。因此，无法执行行为版本控制，System.requestVersion 返回当前安装的软件包版本。Invocable\
  \ Method 的定义由与 global 修饰符使用相关的约束控制，我们已在本章中讨论过。作为最佳实践，请避免向参数类添加新的必需成员（通过 @InvocableVariable）。\n\
  \n## Alignment with Force.com extensibility features\n\n以下是一些平台功能，可帮助确保您的应用程序功能对\
  \ Developer X 或订阅者组织管理员开放以进行扩展：\n\n- **Apex Triggers**：Developer X 可以针对您的应用程序的托管自定义对象编写自己的触发器。这些触发器将在打包的触发器之外执行。例如，这允许\
  \ Developer X 实现字段默认值或自定义验证。Salesforce 不保证打包的触发器会在订阅者组织中在 Developer X 触发器之前或之后执行。为了确保无论触发器执行顺序如何都验证所有更改，请在打包触发器的\
  \ after 阶段中执行验证逻辑。\n\n- **Field Sets**：如前几章所述，请尽可能经常在 Visualforce 页面上利用此功能，以确保区域和表格可以使用订阅者添加的字段进行扩展。如果您正在开发移动\
  \ UI，这些功能也可以与 JavaScript 框架一起使用。\n\n- **E-mail templates**：如果您正在编写代码来发送电子邮件，请考虑提供一种机制，允许使用电子邮件模板自定义文本。可以通过自定义设置使用其开发者名称引用这些模板。还可以在此处利用\
  \ Field Sets 来提供一种简便方式，以包含订阅者管理员添加的其他自定义字段。\n\n- **Visualforce components**：请考虑全局创建一些\
  \ Visualforce 组件，这样 Developer X 可以更轻松地构建替代的自定义 Visualforce 页面，而无需重新实现应用程序页面的所有方面。此类组件可以构建为允许在电子邮件模板中使用动态内容。\n\
  \n- **Lightning components**：请考虑公开软件包中使用的 Lightning 组件，以供 Lightning App Builder\
  \ 和 Lightning Community Builder 等工具使用，正如我们在前一章中探讨的那样。这可以为管理员和开发人员提供很大的灵活性，以构建和自定义其业务的独特用户体验。\n\
  \n- **Dynamic Apex type creation**：可以使用 `Type.forName` 方法创建 Apex 类型的实例，并从该实例在运行时创建该类型的实例。此功能可用于允许\
  \ Developer X 编写 Apex 代码，您的应用程序代码可以在指定时间动态调用该代码。此方法将在即将到来的章节中详细讨论。\n\n\n\n\n\n##\
  \ 使用 Apex 接口扩展应用程序逻辑\n\nApex 接口可用于描述应用程序逻辑中的一个点，Developer X 编写的自定义代码可在该点被调用。例如，为了提供由\
  \ Developer X 驱动的计算锦标赛积分的替代方案，我们可以公开一个描述应用程序调用的全局接口，如下所示：\n\n```apex\nglobal class\
  \ ContestantService {\n    global interface IAwardChampionshipPoints {\n       \
  \ void calculate(List<Contestant__c> contestants);\n    }\n}\n```\n\n通过查询本章源代码中已包含的\
  \ Callouts 自定义元数据类型的自定义元数据记录，应用程序中的代码可以确定 Developer X 是否已提供此接口的实现，以调用该实现而非标准计算代码。\n\
  \n对于此类需求，使用自定义元数据是一个极佳的用例，因为您可以通过打包记录来声明包支持的调用。然后，通过将某些字段设置为订阅者可编辑，可以允许订阅者（Developer\
  \ X）配置这些调用。与自定义设置相比，这种方法避免了额外配置和误配置的风险。\n\n> 扩展您包的合作伙伴也可以将此配置与他们的 Apex 类一起打包。因此，安装此类合作伙伴扩展包的管理员无需进行任何配置即可激活其中包含的调用。\n\
  \n此屏幕截图显示了如何定义 Callouts 自定义元数据类型。请注意，Apex 类和 Apex 类命名空间前缀字段是订阅者可编辑的：\n\n| Action\
  \ | Field Label | API Name | Data Type | Field Manageability | Indexed | Controlling\
  \ Field | Modified By |\n|---|---|---|---|---|---|---|---|\n| 编辑 | 删除 | Apex 类 |\
  \ f2w17__ApexClass__c | Text(64) | 订阅者可编辑 | | Andrew Fawcett 10/16/2019 9:29 AM\
  \ |\n| 编辑 | 删除 | Apex 类命名空间前缀 | f2w17__ApexClassNamespacePrefix__c | Text(40) |\
  \ 订阅者可编辑 | | Andrew Fawcett 10/16/2019 9:29 AM |\n| 编辑 | 删除 | 接口类型 | f2w17__InterfaceType__c\
  \ | Text(255)（不区分大小写的唯一值） | 可升级 | ✓ | Andrew Fawcett 10/16/2019 9:27 AM |\n\n以下记录由您作为打包开发者定义，以有效声明\
  \ **Award Championship Points** 调用存在且可配置。这也应包含在您的包中：\n\n| Action | Label * | Callout\
  \ Name | Namespace Prefix | Interface Type | Protected Component |\n|---|---|---|---|---|---|\n\
  | 编辑 : 删除 | **Award Championship Points** | AwardChampionshipPoints | c2v17 | ContestantService.IAwardChampionshipPoints\
  \ | ✓ |\n\n> > 请注意，自定义元数据类型字段支持 Developer X 提供类名，该类名可以是完全限定名（例如来自扩展包的 fforceext.SimpleCalc），也可以是本地类（在订阅者组织中定义），例如\
  \ DeveloperXCustomCalc。\n\n以下代码是一个 Selector 方法（参见 CalloutsSelector）类，用于读取已注册的接口实现。它使用\
  \ Type.forName 方法构建适用的 Apex 类型，并返回一个 Map，其中包含实现每个接口的 Apex 类：\n\n```java\npublic\
  \ Map<Type, Type> selectAllCallouts() {\n    // Query custom metadata records for\
  \ callouts\n    Map<Type, Type> calloutsByInterfaceType =\n        new Map<Type,\
  \ Type>();\n    for(Callout__mdt record :\n        Database.query(newQueryFactory().toSOQL()))\
  \ {\n        if(Callout__mdt.ApexClass__c!=null) {\n            // Namespace of\
  \ the interface is that\n            // of the custom metadata type\n          \
  \  Type interfaceType =\n                Type.forName(\n                    record.NamespacePrefix__c\
  \ + '.' + record.InterfaceType__c);\n            // Implementing class can optionally\
  \ specify\n            // the namespace if needed\n            Type implType =\n\
  \                Type.forName(record.ApexClassNamespacePrefix__c,\n            \
  \        record.ApexClass__c);\n            calloutsByInterfaceType.put(interfaceType,\
  \ implType);\n        }\n    }\n    return calloutsByInterfaceType;\n}\n```\n\n\
  以下代码使用一个名为 `Application.Callout` 的新类工厂，该工厂未在此显示，但包含在本章源代码中。这是一个简单的类工厂，使用上述 `Selector`\
  \ 方法并公开 `newInstance` 方法，以便实例化 `Developer X` 注册的类。`Contestants` 域类中的以下方法现在如下所示：\n\
  \n```java\npublic void awardChampionshipPoints(fflib_ISObjectUnitOfWork uow)\n{\n\
  \    // Custom implementation configured by Developer X?\n    Object registeredInterfaceImpl\
  \ =\n    Application.Callouts.newInstance(\n    ContestantService.IAwardChampionshipPoints.class);\n\
  \    if(registeredInterfaceImpl instanceof\n    ContestantService.IAwardChampionshipPoints)\
  \ {\n    // Cast the interface to call the calculate method\n    ContestantService.IAwardChampionshipPoints\n\
  \    awardChampionshipPoints =\n    (ContestantService.IAwardChampionshipPoints)\n\
  \    registeredInterfaceImpl;\n    // Invoke the custom method from Developer X\n\
  \    awardChampionshipPoints.calculate(Records);\n    // Mark dirty on behalf of\
  \ Developer X\n    for(Contestant__c contestant :\n    (List<Contestant__c>) Records)\
  \ {\n    uow.registerDirty(contestant);\n    }\n    return;\n    }\n    // Continue\
  \ with standard implementation...\n}\n```\n\n在订阅者组织或测试开发组织中，Developer X 随后可以按如下方式实现此接口，并配置与\
  \ **Award Championship Points** 调用对应的 Callouts 记录上的 Apex 类字段。下次调用锦标赛积分服务时，将调用此自定义逻辑：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_385_0.png)\n\n以下是一个简单的 Application Callout\
  \ 实现，它根据赛车位置分配积分，而不是使用默认计算：\n\n```java\npublic class SimpleCalc\n    implements\
  \ fforce.ContestantService.IAwardChampionshipPoints\n{\n    public void calculate(List<fforce__Contestant__c>\
  \ contestants)\n    {\n        // Very simple, points equals race position\n   \
  \     for(fforce__Contestant__c contestant : contestants)\n            contestant.fforce__ChampionshipPoints__c\
  \ =\n                contestant.fforce__RacePosition__c;\n    }\n}\n```\n\n公开全局\
  \ Apex 接口时需要考虑的一些方面如下：\n\n- 发布全局接口（通过将其上传至发布管理包）后，即无法对其进行修改。\n- 您可以从另一个全局接口扩展全局接口，例如\
  \ IAwardChampionshipPointsExt 扩展 IAwardChampionshipPoints。\n- 从安全角度出发，请仔细考虑通过 Apex\
  \ 接口方法向 Application Callout 传递什么内容，特别是如果参数是应用程序代码稍后会引用其值的对象。请确保您允许 Application Callout\
  \ 对此对象或数据进行任何更改。如果您对此不放心，请考虑在将对象作为参数传递给接口方法之前对其进行克隆。\n\n## 摘要\n\n在本章中，我们通过名为 Developer\
  \ X 的角色视角，回顾了企业应用程序集成和可扩展性需求。通过使用此角色，就像进行 UI 设计一样，您可以确保 API 跟踪来自代表性用户（理想情况下是实际用户）的真实用例和需求。\n\
  \n在制定 API 策略时，请牢记标准 Salesforce API 的优势，以及如何推广这些 API 以及 Salesforce 在其中投入的大量资源，以便提供对存储在自定义对象中的信息的访问。我们还了解到，Lightning\
  \ App Builder、Lightning Process Builder 和 Visualflow 等平台工具可以使用您的包中的嵌入式功能进行扩展，这些功能可以无需代码即可访问。\n\
  \n如有需要，请利用 Service 层使用 Apex 和 REST 作为交付机制来创建应用程序 API（无论是本地还是非本地）。请牢记，REST 需要额外的设计考量，以确保您的\
  \ REST API 可以被视为真正的 RESTful，从而对一直在使用其他 REST API 的 Developer X 来说感到熟悉。通过自定义元数据配置的应用程序调用允许开发人员扩展您应用程序中的逻辑。\n\
  \n请不要忘记，虽然 Visualforce、Lightning 和 Apex 等技术为您作为开发人员提供了极大的灵活性，并为用户提供了精调的功能，但它们通常会减少订阅者的可扩展性机会；通过使用\
  \ Field Sets 和 Apex Application Extensions（利用 Type.forName），您可以恢复这种平衡。还请牢记，Field\
  \ Sets 在自定义 UI 用例之外也提供了良好的可扩展性工具。例如，在使用 JavaScript 框架构建移动 UI 时，可以使用它们来公开订阅者自定义字段。\n\
  \n如果您一直在跟进，本章无需上传 FormulaForce 包的新版本；否则，请获取本章提供的示例代码中的最新代码，以更新您的打包组织并上传新包。\n\n在下一章中，我们将回顾有助于应用程序扩展的方法和功能。\n\
  \n\n\n\n"
- "# 11 异步处理和大数据量\n\n本章介绍在 Force.com 平台上开发企业级应用程序的两个重要方面。虽然异步处理和大数据量不一定相关联，但平台更大的\
  \ governor 限制和处理能力大多出现在异步处理模式中。不过，在查询大量数据时，确保交互式用户体验仍然响应迅速也非常重要。\n\n在本章中，我们将首先回顾如何通过了解如何分析查询并利用标准索引和自定义索引，确保\
  \ SOQL 查询尽可能高效。这将有助于应用程序中的交互式和批处理（或异步）进程，以及它们利用原生平台功能（如报表）的方式。\n\n随后，我们将探讨将应用程序处理迁移到异步模式的选项、最佳实践、设计和易用性注意事项，再次利用\
  \ **Service** 层作为应用程序的共享支柱，最后了解在对应用程序进行容量测试时的一些想法和注意事项。本章将涵盖以下主题：\n\n- 为容量测试创建测试数据\n\
  - 索引、选择性和查询优化\n- 异步执行上下文\n- 容量测试\n\n## 为容量测试创建测试数据\n\n在本章中，我们将使用 `RaceData__c` 对象。我们将为其添加更多字段，并运行脚本将其填充一些测试数据量，然后探讨访问它和处理其中数据的不同方式。\n\
  \n在 **Formula1** 赛车世界中，比赛期间会从车手和赛车上捕获大量数据。这些信息用于进行实时或赛后分析，以便进一步改进或排查问题。由于涉及数据量巨大，FormulaForce\
  \ 应用程序会考虑汇总这些数据的方式，以便在需要时可以轻松删除并稍后重新加载。\n\n以下功能将添加到 FormulaForce 应用程序中，以处理此信息并帮助演示本章中描述的\
  \ Force.com 功能。此功能的 Apex 类和 Visualforce 页面包含在本章的示例代码中。\n\n- 一个可对赛车数据进行 *What-If*\
  \ 分析的 Visualforce 页面\n- 一个用于验证并将赛车数据与参赛者关联的 Batch Apex 进程\n\n本章示例代码还包含对 **Race Data**\
  \ 对象的更新，如下：\n\n1. **Type** 字段表示赛车数据的类型，例如，**油压**、**发动机温度**、**扇区时间**、**燃油量**、**进站时间**等等。\n\
  2. **Value** 字段是取决于 **Type** 字段的数值。\n3. **Lap** 和 **Sector** 字段是表示捕获数据所在的圈数和扇区数的数字字段。\n\
  4. **Year**、**Race Name** 和 **Driver Id** 字段是文本字段，稍后将其组合在一起可用于形成键，以便将每个 **Race Data**\
  \ 记录与相应的 **Contestant** 记录关联（该记录与 **Driver**、**Race** 和 **Season** 对象有其自身的关系）。在此用例中，我们假设生成这些原始数据的电子系统不知道或不想了解\
  \ Salesforce ID，因此 FormulaForce 应用程序必须正确解析与 **Contestant** 记录的关系。\n5. **Contestant**\
  \ 查询字段引用适用的 **Contestant** 记录。由于传入的原始数据不包含 Salesforce 记录 ID，此字段最初未填充。FormulaForce\
  \ 应用程序的逻辑将稍后填充此字段，如本章后面所示。\n6. 一个新的 Race Data ID 外部 ID 字段已添加到 Contestant 对象。Contestants\
  \ Domain 类中的 Apex 代码已更新，以确保添加 Contestants 时自动填充此字段，并且在处理新 Race Data 时可以使用其值，以便正确将\
  \ Race Data 记录与 Contestant 记录关联。\n\nRace Data 对象对其 Name 字段使用 Auto Number 字段类型。这确保数据的插入顺序也被保留。\n\
  \n> 请注意，我们已将 Race Data ID 字段添加到之前版本的包中已发布的对象，同时 Contestants Domain 类已更新以填充新记录的此字段。订户组织中已存在的记录不会包含此值。Force.com\
  \ 提供了一种在安装（和卸载）包后执行 Apex 代码的方法，以便您可以包含触发 Batch Apex 作业的代码，以用适当的值更新现有记录中的此字段值。请参阅\
  \ Apex 开发人员指南中的 System.InstallHandler 接口。\n\n## 使用 Apex 脚本创建 Race Data 对象\n\n和我一样，我怀疑你是否拥有一支真正的\
  \ Formula1 车队或赛车来提供原始数据输入。我们将使用 Apex 脚本生成测试数据，尽管在现实中，赛车数据可以通过 CSV 文件导入或通过 Salesforce\
  \ API 与汽车本身集成来插入。\n\n此测试脚本将生成 10,000 行数据，这足以探索本章中描述的平台功能以及 Force.com SOQL 分析器的行为，后者会根据行数做出不同的选择。\n\
  \n由于正在创建（如果重新运行脚本则删除）大量数据，您必须通过所选 IDE 或开发者控制台的 Execute Anonymous 提示符逐个运行以下每个 Apex\
  \ 语句，以遵守 governor 限制：\n\n1. 运行 `TestData.resetTestSession();`\n2. 运行 `TestData.purgeVolumeData(false);`\n\
  3. 运行 `TestData.purgeVolumeData(true);`\n4. 运行 `TestData.createVolumeData(2017,\
  \ 'Spain', 52, 4);`\n\n前面步骤中的步骤 1 将运行一个脚本，清除其他 FormulaForce 对象中的所有其他数据，以便为本章余下部分设置测试\
  \ Season、Race 和 Driver 数据。您可以重复步骤 4 为其他比赛生成另外 10,000 条 Race Data 记录——我们将在本章后面这样做。此步骤可能需要几分钟才能完成。\n\
  \n脚本执行完毕后，前往 Race Data 选项卡并查看数据。Value 列中显示的值是随机值，因此您的结果会有所不同。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_391_0.png)\n\
  \n如果您查看存储使用情况页面，还应该看到以下行数：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_391_1.png)\n\
  \n## 索引、选择性和查询优化\n\n在本节中，我们将回顾 Force.com 平台维护的系统索引和自定义索引在何时用于使查询更高效，以及在返回较大查询结果后，您的\
  \ Apex 逻辑可以最有效地消耗这些索引的方式。\n\n### 标准索引和自定义索引\n\n与其他数据库一样，Force.com 在操作记录数据时维护数据库索引，以确保在查询数据时可以使用这些索引来提高查询性能。由于\
  \ Force.com 多租户平台的设计，它拥有自己的数据库索引实现（而不是使用底层 Oracle 数据库索引），该实现会考虑每个租户的需求。默认情况下，它为以下字段维护标准索引：\n\
  \n- ID\n- Name\n- OwnerId\n- CreateDate\n- CreatedById\n- LastModifiedDate\n- LastModifiedById\n\
  - SystemModStamp\n- RecordType\n- 任何主细关系字段\n- 任何查询关系字段\n- 任何标记为 Unique 的字段\n- 任何标记为\
  \ External Id 的字段\n\n将应用程序部署到订户组织后，您还可以请求 Salesforce 考虑在前面列表未涵盖的字段上创建其他自定义索引，例如应用程序逻辑用于过滤记录的字段，包括自定义公式字段以及订户添加到您对象中的自定义字段。\n\
  \n\n\n\n\n公式字段可以被索引，前提是公式结果是确定的，这意味着它不使用任何动态数据或时间函数，例如 TODAY 或 NOW，也不对通过查找字段或任何其他非确定性公式字段的相关字段进行引用。\n\
  \n由于创建和维护索引会消耗平台资源，自定义索引无法打包，因为是否启用它们的决定取决于仅在订阅者组织中才存在的条件。\n\n尽管对象可以包含数百万条记录，但标准索引最多只索引\
  \ 100 万条记录，自定义索引最多索引 333,333 条记录。这些限制会影响是否使用索引，具体取决于使用的查询和筛选条件。本章后续内容将更详细地讨论此问题。\n\
  \n关于 Race Data 对象，平台将默认索引以下字段。只有通过联系 Salesforce 支持并启用订阅者组织，才能创建其他自定义索引，例如在 Type__c\
  \ 字段上。\n\n| 字段 | 标准索引 |\n|---|---|\n| 创建者 | 是（查找字段） |\n| 最后修改者 | 是（查找字段） |\n| 名称\
  \ | 是 |\n| 所有者 | 是 |\n| Contestant__c | 是（查找字段） |\n| Race__c | 是（查找字段） |\n| DriverId__c\
  \ | 否 |\n| Lap__c | 否 |\n| RaceName__c | 否 |\n| Sector__c | 否 |\n| Type__c | 否 |\n\
  | Value__c | 否 |\n| Year__c | 否 |\n\n在“设置”中，导航到“对象”并找到 Race Data 对象。在查看“标准字段”或“自定义字段及关系”相关列表中列出的字段时，观察“索引”列。这是确定字段是否应用了标准或自定义索引的最简单方法。\n\
  \n因此，如果查询按系统或自定义索引覆盖的字段进行筛选，Force.com 查询优化器将考虑该索引。这意味着索引的存在并不表示一定会被使用。最终决定取决于查询的选择性。\n\
  \n> 默认情况下，Salesforce 不会在其索引中包含含有空值的行（针对相应字段）。在这种情况下，虽然 **参赛者** 字段默认已编入索引，但它最初包含空值，因此最初索引将无效（这一事实与为什么在筛选条件中使用空值会阻止\
  \ Force.com 查询优化器使用索引有关，将在下一节中讨论）。但是，您可以联系 Salesforce 支持，讨论在索引中包含空值的启用事宜。\n\n##\
  \ 确保查询利用索引\n\n选择适当索引的过程适用于通过 API 和 Apex 使用 SOQL 进行的查询，也适用于 **报告和列表视图**。索引的使用取决于\
  \ SOQL 语句是否具有选择性。以下提供了选择性和非选择性的定义：\n\n- Salesforce 使用 **选择性** 一词来描述能够利用 Salesforce\
  \ 幕后维护的索引来筛选记录数据的查询，从而使此类查询更高效，并更快地返回结果。\n\n- 相反，**非选择性** 一词意味着给定查询未利用索引；因此，在大多数情况下，其性能不会很好。它将超时，或者对于记录数大于\
  \ 100,000 的对象，会导致运行时异常。\n\n在非选择性查询情况下，平台将扫描对象中的所有记录，并对每条记录应用筛选；这被称为 **全表扫描**。但是，这不一定是最慢的选择，具体取决于记录数量和筛选条件。\n\
  \n本章部分的主要目标是解释 Salesforce 为给定查询选择索引所需的条件。这取决于多个因素，包括构建应用程序查询时以及订阅者组织中对象中的记录数量。\n\
  \n## 影响索引使用的因素\n\n决定是否使用索引有两个因素。首先，查询的 **筛选条件**（在 SOQL 术语中为 `WHERE` 子句）必须符合所使用的运算符和条件的某些规则。其次，对象中的\
  \ **记录总数** 与应用筛选条件后预计返回的记录数量之间的比较。\n\n筛选条件当然必须引用已为其定义标准或自定义索引的字段。之后，可以使用一元、AND、OR\
  \ 和 LIKE 运算符来筛选记录。但是，其他运算符（如否定运算符、通配符和文本比较运算符），以及在筛选条件中使用 null，都很容易导致查询无法使用索引。例如，更明确指定所需行的筛选条件\
  \ `Type__c = 'Sector Time'` 更有可能利用索引（假设该字段已启用自定义索引），而例如 `Type__c != 'Pit Stop Time'`\
  \ 则会导致平台执行全表扫描，因为平台无法利用其在该列各行中维护的数据分布内部统计信息。\n\n要使用索引，筛选后的记录数必须低于对象中总记录数的某个百分比。您可能会问，Salesforce\
  \ 如何在不实际执行查询的情况下知道这些信息？虽然他们没有提供完整详细信息，但他们确实描述了所谓的预查询，使用平台在维护标准或自定义索引时捕获的统计数据。这些统计数据有助于根据字段值了解数据分布。例如，执行加载示例数据的脚本时，`Type__c`\
  \ 字段包含 **进站停留时间** 值的行所占百分比为 0.16 百分比，因此，如果存在自定义索引且查询的筛选条件足够具有选择性（例如 `Type__c = 'PitStop\
  \ Time'`），则将使用索引。\n\n针对 **扇区时间** 的查询，例如 `Type__c = 'Sector Time'`，将返回 1664 条记录，占所选总行数的\
  \ 16.64%。因此，虽然筛选条件具有选择性，但筛选后的记录数超过了自定义索引的阈值：10% 或最多 333,333 条记录。因此，在此情况下，不会使用索引。这可能导致超时或运行时异常。因此，为避免这种情况，必须使查询更具选择性，例如，通过启用自定义索引并将\
  \ `Lap__c` 或 `Sector__c` 添加到筛选条件中。\n\nSalesforce 提供了关于如何处理大数据量的更多详细信息，例如完整记录了用于选择索引的筛选记录数容差（注意，这些容差因标准或自定义索引而异）以及关于其如何在\
  \ Oracle 数据库中存储数据的一些见解，这些有助于更好地理解相关问题。在我看来，这些是必读材料，可以在各种白皮书和 Wiki 页面中找到。其中一些如下：\n\
  \n- 查询与搜索优化速查表: http://resources.docs.salesforce.com/rel1/doc/en-us/static/pdf/salesforce_query_search_optimization_developer_cheatsheet.pdf\n\
  - 大数据量部署最佳实践: http://www.salesforce.com/docs/en/cce/ldv_deployments/salesforce_large_data_volumes_bp.pdf\n\
  - Force.com SOQL 最佳实践：空值和公式字段: https://developer.salesforce.com/blogs/engineering/2013/02/force-com-soql-best-practices-nulls-and-formula-fields.html\n\
  - 通过查询资源反馈参数试点开发选择性 Force.com 查询: https://developer.salesforce.com/blogs/engineering/2014/04/developing-selective-force-com-queries-query-resource-feedback-parameter-pilot.html\n\
  \n## 查询分析\n\n由此可见，所需索引及其使用时间等考虑因素在很大程度上取决于订阅者组织中数据增长率以及该数据中不同数据值组的分布。因此，分析通常只在与客户和\
  \ Salesforce 协作并在订阅者组织内进行。\n\n在某些情况下，披露应用程序从 Apex 和 Visualforce 页面发出的查询，可能会帮助您和您的订阅者提前规划需要哪些索引。您还可以通过调试日志捕获代码中发出的\
  \ SOQL 查询，前提是您已通过 **订阅者支持** 功能登录。\n\n\n\n\n\n一旦你怀疑某个 SOQL 查询正在引起问题，你就会对其进行性能分析，以确定正在使用哪些索引，从而决定如何解决问题、创建新索引，以及/或通过添加更多约束条件来减少过滤条件选中的记录数量。为此，你可以使用平台的一个功能，让平台在考虑为给定查询使用哪个索引（如果有的话）时解释其选择。同样，重要的是在订阅者组织或沙箱本身中使用此功能。\n\
  \n为本章的目的，以下示例利用 Salesforce REST API 上的 explain 参数，在我们运行前面脚本的包装组织中执行查询，以向 Race Data\
  \ 对象填充 10,000 条记录。\n\n开发者控制台包含查询规划器工具，可在首选项选项卡下启用。当你通过查询编辑器运行查询时，会弹出一个窗口，显示所考虑索引的说明。显示的信息基本上与本章中通过\
  \ explain 参数描述的信息相同。\n\n本节在通过开发者工作台工具运行 SOQL 时利用 explain 参数。在这里，你可以在解释模式下运行各种查询并查看结果。结果显示了如果查询实际执行时会使用的一系列查询计划。它们按平台的偏好顺序显示。以下步骤展示了如何登录开发者工作台以获取给定查询的查询计划：\n\
  \n- 1. 登录开发者工作台。\n- 2. 从实用工具菜单中，选择 REST 探索器。\n- 3. 输入 /services/data/v30.0/query?explain=\
  \ 然后粘贴你的 SOQL。你也可以在 URL 中使用最新的 Salesforce API 版本。\n- 4. 单击执行。\n\n首先，让我们尝试下面的示例，该示例未在\
  \ Type__c 字段上使用自定义索引。请注意，使用了 fforce 前缀；由于 SOQL 查询正在启用命名空间的包装组织中执行，你应该将此替换为你自己选择的命名空间。\n\
  \n```\nselect id from fforce__RaceData__c\nwhere fforce__Type__c = 'PitStop Time'\n\
  ```\n\n以下截图显示了开发者工作台针对此查询显示的查询计划结果：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_398_0.png)\n\
  \n如预期，结果是 TableScan，与以下查询相比：\n\n```\nselect id from fforce__RaceData__c\nwhere CreatedDate\
  \ = TODAY\n```\n\n以下截图显示了此查询的查询计划：\n\n```\nplans\n  [Item 1]\n    ▸ cardinality:\
  \ 648\n    ▸ fields\n      ▸ 0: CreatedDate\n    ▸ leadingOperationType: Index\n\
  \    ▸ relativeCost: 1\n    ▸ subjectCardinality: 2160\n    ▸ subjectType: fforce__RaceData__c\n\
  \  [Item 2]\n    ▸ cardinality: 648\n    ▸ fields\n    ▸ leadingOperationType: TableScan\n\
  \    ▸ relativeCost: 1.31666666666667\n    ▸ subjectCardinality: 2160\n    ▸ subjectType:\
  \ fforce__RaceData__c\n```\n\n这会产生两个计划；然而，标准索引被选中，而非表扫描。\n\n> cardinality 和 subjectCardinality\
  \ 字段均基于 Salesforce 内部维护的上述统计信息进行估算，该信息涉及记录的分布情况（在此示例中，按 Type__c 区分的不同记录）。因此，它会给出过滤条件预计会选中的行数，与\
  \ SObject 中预计的总行数进行对比。\n>\n> 在此示例中，我们可以看到这些仅是估算值，因为我们知道 RaceData__c 对象中有 10,000\
  \ 条记录；实际上，其中 1,664 条是 Sector Time 记录。不过，一般而言，只要这些值与实际物理记录大致相符，平台所做的就是计算一个值相对于另一个值的百分比，以决定索引是否值得使用。实际上，relativeCost\
  \ 字段是最重要的；基本上，大于 1 的值意味着查询不会使用关联计划执行。\n\n既然你已经大致了解如何获取这些信息，让我们再查看几个示例，但这次使用 100,000\
  \ 条 RaceData__c 记录（使用相同记录分布的 10 场比赛数据）。在我的组织中，我也已要求 Salesforce 支持在 Type__c、Lap__c\
  \ 和 Sector__c 自定义字段上启用自定义索引。为清晰起见，已移除了命名空间 fforce 前缀。\n\n| SOQL | 生成的计划 |\n|---|---|\n\
  | select id from RaceData__c where Type__c = 'PitStop Time' 与 PitStop Time 相关的记录数少于总记录数的\
  \ 10%，因此使用了索引。 | { \"plans\" : [ { \"cardinality\" : 160, \"fields\" : [ \"Type__c\"\
  \ ], \"leadingOperationType\" : \"Index\", \"relativeCost\" : 0.016, \"sobjectCardinality\"\
  \ : 100000, \"sobjectType\" : \"RaceData__c\" }, { \"cardinality\" : 160, \"fields\"\
  \ : [ ], \"leadingOperationType\" : \"TableScan\", \"relativeCost\" : 0.67013333333333334,\
  \ \"sobjectCardinality\" : 100000, \"sobjectType\" : \"RaceData__c\" } ] } |\n|\
  \ select id from RaceData__c where Type__c = 'Sector Time' 由于与 Sector Time 相关的记录数大于总记录数的\
  \ 10%，因此选择了表扫描计划。 | { \"plans\" : [ { \"cardinality\" : 16640, \"fields\" : [ ],\
  \ \"leadingOperationType\" : \"TableScan\", \"relativeCost\" : 1.0272, \"sobjectCardinality\"\
  \ : 100000, \"sobjectType\" : \"RaceData__c\" }, { \"cardinality\" : 16640, \"fields\"\
  \ : [ \"fforce__Type__c\" ], \"leadingOperationType\" : \"Index\", \"relativeCost\"\
  \ : 1.664, \"sobjectCardinality\" : 100000, \"sobjectType\" : \"RaceData__c\" }\
  \ ] } |\n\nselect id from RaceData__c where Type__c = 'Sector Time' and RaceName__c\
  \ = 'Spa'\n\n同样，即使通过添加比赛名称使查询更具选择性，还是选择了表扫描。在这里，建议在比赛名称上添加自定义索引，因为它很可能是常见的过滤条件。\n\
  \n```\n{\n    \"plans\" : [ {\n        \"cardinality\" : 1000,\n        \"fields\"\
  \ : [ ],\n        \"leadingOperationType\" :\n        \"TableScan\",\n        \"\
  relativeCost\" : 0.68833333333333334,\n        \"sobjectCardinality\" : 100000,\n\
  \        \"sobjectType\" : \"fforce__RaceData__c\"\n    }, {\n        \"cardinality\"\
  \ : 16640,\n        \"fields\" : [ \"fforce__Type__c\" ],\n        \"leadingOperationType\"\
  \ : \"Index\",\n        \"relativeCost\" : 1.664,\n        \"sobjectCardinality\"\
  \ : 100000,\n        \"sobjectType\" : \"fforce__RaceData__c\"\n    } ]\n}\n```\n\
  \nselect id from RaceData__c where Type__c != 'PitStop Time'\n\n由于使用了否定运算符，因此选择了表扫描计划。\n\
  \n```\n{\n    \"plans\" : [ {\n        \"cardinality\" : 100000,\n        \"fields\"\
  \ : [ ],\n        \"leadingOperationType\" :\n        \"TableScan\",\n        \"\
  relativeCost\" : 2.8333333333333335,\n        \"sobjectCardinality\" : 100000,\n\
  \        \"sobjectType\" : \"RaceData__c\"\n    } ]\n}\n```\n\n| SOQL | 生成的计划 |\n\
  | :--- | :--- |\n| select id from RaceData__c where Type__c != 'PitStop' and Lap__c\
  \ >=20 and Lap__c <40 尽管使用了否定运算符，但通过添加有自定义索引支持的更具选择性的条件，平台选择了使用索引而非表扫描。 | { \"plans\"\
  \ : [ { \"cardinality\" : 10000, \"fields\" : [ \"Lap__c\" ], \"leadingOperationType\"\
  \ : \"Index\", \"relativeCost\" : 1.0, \"sobjectCardinality\" : 100000, \"sobjectType\"\
  \ : \"RaceData__c\" }, { \"cardinality\" : 40000, \"fields\" : [ ], \"leadingOperationType\"\
  \ : \"TableScan\", \"relativeCost\" : 1.5333333333333334, \"sobjectCardinality\"\
  \ : 100000, \"sobjectType\" : \"RaceData__c\" } ] } |\n\n## 精简表\n\n在内部，Salesforce\
  \ 将给定记录的标准对象字段数据和自定义字段数据存储在两个独立的物理 Oracle 表中。因此，虽然你看不到，但当你执行 SOQL 查询以返回标准字段和自定义字段的混合结果时，这在内部需要一个\
  \ Oracle SQL 查询，并需要进行内部数据库连接。\n\n如果 Salesforce 支持确定避免此连接可以加快给定查询集的速度，他们可以创建一个精简表。此类表对\
  \ Force.com 开发者不可见，并由平台自动与你的对象记录保持同步，包括任何标准或自定义索引。\n\n\n\n\n\n精简表可以包含您、订户以及 Salesforce\
  \ 认为合适的常用标准字段和自定义字段，全部位于同一个 Oracle 表中，从而避免了连接（其内部代价是复制记录数据）。如果 SOQL、报表或列表视图查询使用了这些字段或其子集，平台会自动使用精简表而不是连接来提高性能。作为额外好处，内部所需的记录大小更小，这意味着用于在平台中移动记录块的数据带宽可以得到更好的利用。\n\
  \n这显然是平台的一项高级功能，但值得考虑，作为在订户组织中提升查询性能的一种额外手段。\n\n> 如果在 Force.com 环境中更改相应对象的字段类型或添加新字段，精简表不会保持同步。此外，精简表不会在沙箱环境中复制。因此，每当发生此类更改时，您或您的订户都需要再次联系\
  \ Salesforce 支持。还请注意，精简表无法打包；它们仅适用于订户组织的配置。\n\n## 处理大型结果集\n\n在大多数 Apex 场景中，无论是单独读取还是作为形成聚合查询结果的一部分，最多只能读取\
  \ 50,000 条记录。但是，可以应用一个上下文参数，允许读取不限数量的记录。然而，此上下文不允许任何数据库更新。在本节中，我们将回顾以下三种管理大型数据集的方式：\n\
  \n- 在 Apex 中处理最多 50k 条结果集\n- 在 Apex 中处理不限结果集\n- 通过 Salesforce API 处理不限结果集\n\n###\
  \ 在 Apex 中处理最多 50k 条结果集\n\n读取 50,000 条记录的问题之一是，您可能会触及其他管控器，例如堆限制。虽然堆限制在异步上下文中有所增加，但仍可能根据正在执行的处理而被触及。请查看以下示例，用于为每条\
  \ Race Data 记录生成附件：\n\n```\nList<Attachment> attachments = new List<Attachment>();\n\
  for(RaceData__c raceData : [select Id from RaceData__c])\nattachments.add(\nnew\
  \ Attachment(\nName = 'Some Attachment',\nParentId = raceData.Id,\nBody = Blob.valueOf('Some\
  \ Text'.repeat(1000)));\ninsert attachments;\n```\n\n> 要试用本章中的示例，您需要 Partner Portal\
  \ Developer Edition 组织，它附带 250 MB 的记录和文档存储空间。\n\n如果您尝试从执行匿名窗口执行上述代码，将收到以下错误，因为代码会迅速达到\
  \ 6 MB 堆大小限制：\n\n```\nSystem.LimitException: Apex heap size too large: 6022466\n\
  ```\n\n此问题的解决方案是利用所谓的 SOQL FOR 循环（如下所示）；它允许记录数据以每次 200 条记录的分块形式返回到 Apex 代码，从而避免所有附件记录在堆上堆积：\n\
  \n```\nfor(List<RaceData__c> raceDataChunk :\n[select Id from RaceData__c]) {\n\
  List<Attachment> attachments = new List<Attachment>();\nfor(RaceData__c raceData\
  \ : raceDataChunk)\nattachments.add(\nnew Attachment(\nName = 'Some Attachment',\n\
  ParentId = raceData.Id,\nBody = Blob.valueOf('Some Text'.repeat(1000)));\ninsert\
  \ attachments;\n}\n```\n\n此代码完成后，将在一个执行上下文中生成超过 80 MB 的附件数据！请注意，在这样做时，上述代码在技术上确实违反了批量化规则，因为外层分块循环中包含一个\
  \ DML 语句。对于拆分为 200 条记录分块的 10,000 条记录，这将导致 50 个分块，因此将消耗 150 个可用 DML 语句中的 50 个。在这种情况下，目的可以证明手段的合理性，因此这只是需要注意的一点。\n\
  \n### 在 Apex 中处理不限结果集\n\n在本节中，将创建一个新的 Race Analysis 页面，以允许用户查看动态应用于所选 Race Data\
  \ 的各种计算和模拟的结果。最终，请想象一下，页面允许用户输入调整和其他参数以应用于计算，并重放赛事数据，以查看比赛可能会以何种不同的方式结束。\n\n出于本章的目的，我们专注于仅查询\
  \ **赛事数据** 对象。标准行限制将 50,000 条记录（大约 5 场比赛的数据量）从 SOQL 查询中返回。对 FormulaForce 应用程序进行了以下更改，以交付此页面；如果您希望部署它们，这些更改存在于与本章关联的代码示例中：\n\
  \n- 已向 **RaceService** 类添加新的 **analyzeData** 方法。\n- 已创建 **RaceDataSelector** 类来封装查询逻辑。\n\
  - 已为 Visualforce 页面创建 **RaceAnalysisController**。\n- 已创建 **raceanalysis** Visualforce\
  \ 页面。\n- 已向 **Race__c** 对象添加新的 **Race Analysis** 列表自定义按钮。此按钮已添加到 **Season** 详细信息页面上与\
  \ **Races** 相关的列表中。\n\n用户现在可以从相关列表中选择一条或多条 **Race** 记录进行处理，操作如下：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_406_0.png)\n\
  \n接下来的显示将在开始计算之前确认所选的比赛。此按钮会调用 RaceService.analyzeData 方法，并尝试查询适用的 RaceData__c 记录。\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_407_0.png)\n\n### 生成更多 Race Data\n\n\
  为了演示如何读取超过 50,000 条记录，我们需要生成更多 Race Data。为此，我们可以重新运行本章早些时候运行过的一部分脚本，以生成最多 100,000\
  \ 条记录（这将几乎填满 Partner Portal Developer Edition 组织）。\n\n从匿名 Apex 提示符中，为每个比赛执行以下 Apex\
  \ 代码；这应该会在 Race Data 对象中生成 100,000 条记录（您可以通过设置下的数据存储页面进行验证）：\n\n```\nTestData.createVolumeData(2017,\
  \ 'Monza', 52, 4);\n```\n\n再运行上述代码八次，每次将比赛名称更改为 Austin、Sochi、Singapore、Shanghai、Spa、Suzuka、Silverstone\
  \ 和 Budapest（请注意，西班牙的 Race Data 已在早些时候生成）。\n\n请注意，若出于任何原因需要清除数据，请重复调用以下内容，然后进入回收站并删除所有组织数据：\n\
  \n```\nTestData.purgeVolumeData(false);\n```\n\n### 利用 Visualforce 和 Apex 只读模式\n\
  \n开始分析按钮会调用服务来查询赛事数据并分析数据；出于本章的目的，它按以下方式输出查询的行总数：\n\n```apex\nApexPages.addMessage(\n\
  \    new ApexPages.Message(\n    ApexPages.Severity.Info,\n    'Just read ' + Limits.getQueryRows()\
  \ +\n    ' rows from RaceData__c'));\n```\n\n如上一张屏幕截图所示，选择所有 10 个比赛（单击“显示 5 个更多”链接以显示更多相关列表记录）。单击“开始分析”按钮以显示一条消息，确认处理的记录数超过了标准\
  \ 50,000。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_408_0.png)\n\n之所以能够实现这一点，是因为\
  \ Visualforce 页面通过 apex:page 元素上的 readOnly 属性启用了只读模式，如下所示：\n\n```xml\n<apex:page\n\
  \    standardController=\"Race__c\"\n    extensions=\"RaceAnalysisController\"\n\
  \    recordSetVar=\"Races\"\n    readOnly=\"true\">\n```\n\n此模式也可以通过在 Apex 计划类或\
  \ Apex 远程操作方法上的 @ReadOnly Apex 属性来启用。顾名思义，缺点是不能有任何 DML 语句，因此我们无法更新数据库。对于此用例，此限制不是问题。请注意，通过使用\
  \ JavaScript Remoting，您可以创建带有和不带有 @ReadOnly 的方法组合。目前，此属性不能与 @AuraEnabled 同时使用。\n\
  \n\n\n\n\n> 请注意，在此模式下，其他 governors 仍处于活动状态，例如 heap 和 CPU 超时。您也可以考虑将此模式与前面所述的 SOQL\
  \ FOR LOOP 方法结合使用。此外，SOQL 聚合查询也会从中受益（因为这些查询也会占用 SOQL 查询行 governor）。\n\n## 使用 Salesforce\
  \ API 处理无限制结果集\n\n使用 Salesforce SOAP 和 REST API 检索记录数据时，Salesforce 不限制可查询的最大行数，因为在这些上下文中，消耗和处理结果记录数据的资源位于平台外。\n\
  \n不过，需要牢记的一项注意事项是每日 API 限制——虽然您可以读取无限量的数据，但数据仍是从 Salesforce 服务器分块返回的，检索每个块都会消耗一次\
  \ API 调用。虽然不太友好，但 Salesforce Bulk API 在检索更多记录时更高效，并且对 Salesforce 服务器的 API 调用次数更少。\n\
  \n## 异步执行上下文\n\nSalesforce 致力于确保您的应用程序及其自身的交互式用户体验（浏览器或移动端响应时间）尽可能达到最佳。在多租户环境中，它使用\
  \ governors 作为管理此问题的一种方式。另一种方法是提供一种途径，让您将代码处理从前台（交互式）移至后台（异步模式）。本章节讨论了在此上下文中可用的设计注意事项、实现选项和优势。\n\
  \n由于后台运行的代码，按定义，不会阻碍用户正在使用的页面的响应时间，因此 Salesforce 可以并且确实会根据服务器当时的负载，对异步进程的执行时间和频率进行限流。因此，它目前不提供确切的\
  \ SLA 来保证异步代码何时运行，也不保证 Apex 定时代码会在分配的时间准确运行。平台的这一方面有时会让等待关键业务流程完成的最终用户感到沮丧。但是，在设计、实现、用户界面和消息传递方面，有一些注意事项可以在很大程度上帮助管理他们的期望。\n\
  \n好消息是，平台会奖励您在异步模式下运行代码，在 Heap、SOQL 查询和 CPU governor 等方面为您提供更高的 governors。完整详情可在其文档中找到（试图在书中记录它们行不通，因为它们不断改进，在某些情况下甚至被删除）。\n\
  \n> 了解执行 Governors 和限制：http://www.salesforce.com/us/developer/docs/apexcode/Content/apex_gov_limits.htm.\n\
  \n## 一般异步设计注意事项\n\n平台提供了一些执行异步代码的简单方法。然而，常被忽略的是错误处理和一般用户体验注意事项。本节介绍了在将任务或进程移至异步或后台（使用更面向最终用户的术语）时，从功能角度需要考虑的要点：\n\
  \n- 后台工作类型：我将后台执行的工作分为两类，应用程序和最终用户：\n  - 应用程序是指应用程序为支持未来的最终用户任务所需的工作，例如定期重新计算、主要数据操作或从外部服务加载数据。\n\
  \  - 最终用户是指与最终用户活动相关（通常由其启动）的工作，该活动恰好需要的平台资源超过交互式（或前台）上下文中可用的资源。对于业务分析师和最终用户来说，后者可能更难以接受，他们始终要求实时响应时间。如果您发现这是唯一的途径，请重点关注用户交互和消息传递方面，如下所示。\n\
  - 用户体验：在执行后台工作时，精心设计的用户体验可以起到决定性作用，特别是在平台选择对工作进行排队或减速处理时。以下是一些需要牢记的注意事项：\n- 启动后台工作：决定用户如何启动后台进程。是通过按钮显式启动，还是通过计划作业或作为执行另一项任务的副作用间接启动？从用户界面按钮显式启动后台工作，让您有机会设定期望。一个关键点是工作是处于排队状态还是已经实际启动；如果用户不知道这一点，他们可能会倾向于尝试再次启动工作，从而可能导致两个作业并行处理！如果您决定间接启动进程，请务必专注于错误处理和恢复，以确保用户在稍后某个时间点能够收到任何重要失败的通知。\n\
  - 进度条指示器：这些可用于让用户监控作业从开始到结束的进度。在工作进度期间提供消息也有助于用户了解正在发生的情况。\n- 监控：确保用户可以在会话之间或其他任务之间继续监控进度也很重要。用户通常可能会关闭标签页或注销，因此请考虑提供一种方式，让用户返回启动作业的位置，并让用户界面识别作业仍在处理中，使用户能够恢复对作业的监控。\n\
  - 消息传递和日志：考虑您的后台进程如何与最终用户通信，通知其已完成的工作以及发生的任何错误。虽然电子邮件可能是默认选择，但请考虑此类电子邮件容易丢失，并寻找与平台和应用程序环境更一致的替代通知和日志方法。以下是一些需要牢记的注意事项：\n\
  \  - 日志：理想情况下，通过关联日志（例如日志自定义对象）将日志信息持久化在应用程序中，并与作业正在处理的记录关联的其他自定义对象一起存储，以便最终用户可以利用关联列表上下文查看日志条目。\n\
  \  - **未处理的异常：** 它们由平台捕获并在 **Apex 作业** 页面上显示。该页面的问题是不够用户友好，并且缺乏上下文，无法知道作业实际正在处理哪些记录（仅\
  \ Apex 类名可能不足以确定这一点）。尝试处理异常，通过面向最终用户的消息进行路由。有些 Apex 异常无法处理，仍需要管理员或支持顾问检查。您的交互式监控解决方案也可以查询\
  \ `AsyncApexJob` 来获取此类消息。\n  - **通知：** 作业完成或出错失败的通知可以通过电子邮件发送；但是，也可以考虑作为日志替代方案创建子记录。与用户相关的任务或\
  \ Chatter 帖子也效果不错。利用组织中存储信息的选项的好处在于，这些也可以是显示自定义按钮以重新启动进程的位置。\n  - **并发性：** 考虑如果两个或多个用户同时尝试运行您的作业，或者正在处理的数据在两个作业之间重叠会发生什么。请注意，计划作业执行时也可能发生这种情况。您可能希望在作业处理期间将\
  \ Apex 作业 ID 存储在适当的记录上，以有效锁定它，防止其他作业处理，直到它被清除为止。\n  - **错误恢复：** 考虑用户是否需要重新运行仅处理失败记录的作业，或者作业是否可以简单地设计为可重入的，这意味着它会检查以前的作业是否已经对相同数据执行过，并在过程中清理或重置。\n\
  \n### 在异步模式下运行 Apex\n\n在 Force.com 中实现异步代码有三种方式；所有这些方式在与交互式执行上下文相比，都运行在相同的默认扩展 governors\
  \ 下。\n\n如前所述，无法保证代码何时执行。Salesforce 监控每次执行的频率和长度，调整一个队列，该队列考虑整个实例的性能，而不仅仅是订户组织。它还限制了滚动\
  \ 24 小时期间内异步作业的数量。有关更多详细信息，请参见 *了解执行 Governors 和限制* 部分。Salesforce 提供了一份详细的白皮书，描述了排队情况。\n\
  \n\n\n\nForce.com 中的异步处理: https://developer.salesforce.com/page/Asynchronous_Processing_in_Force_com.\n\
  \n> 可以通过 Apex Scheduler 的 execute 方法在异步上下文中执行代码。这还提供了增强的控制器限制。根据所涉及的处理，您可能会选择从 execute\
  \ 方法启动 Batch Apex 作业。否则，如果您需要一次性的计划执行，可以使用 Database.scheduleBatch 方法。\n\n## @future\n\
  \n考虑在使用 @future 作业时遵循以下实施准则：\n\n- 避免向异步队列中添加大量 @future 作业（请考虑 Batch Apex）。\n- 方法必须快速执行，否则可能会面临平台限流，这会延迟执行。\n\
  - 实现起来更简单，因为只需添加方法注解。\n- 通常，出队并执行工作所需的时间少于 Batch Apex。\n- 您可以通过方法注解表达特定控制器的增加，以根据您的需求自定义控制器限制。\n\
  - 参数类型仅限于简单类型和列表。\n- 传入列表参数时要小心，确保使用大列表进行容量测试。\n- 无法跟踪执行，因为未返回 Apex 作业 ID。\n- 从\
  \ Apex 触发器执行时应谨慎考虑；@future 方法应进行批量处理，如果存在批量数据加载的可能性，则更有可能触及 @future 作业的每用户每日限制。\n\
  - 您无法启动另一个 @future、Batch Apex 或 Queueables 作业。如果您的打包代码可以由订阅者组织中的代码（例如开发者 X 编写的代码）调用，则这尤其成问题。如果他们有自己的\
  \ @future 方法间接调用您对该功能的使用，将会发生异常。因此，请尽量避免从打包的 Apex 触发器上下文中使用这些功能。\n\n> 我推荐使用 Queueables\
  \ 而非 @future，因为它们在可传递信息类型方面具有更多灵活性，并且提交后更容易跟踪。\n\n## Queueables\n\n考虑在使用 Queueables\
  \ 时遵循以下实施准则：\n\n- 避免向异步队列中添加大量作业（请考虑 Batch Apex）。\n- 方法必须快速执行，否则可能会面临平台限流，这会延迟执行。\n\
  - 实现 `Queueable` 接口和 execute 方法。然后，使用 `System.enqueueJob` 方法启动作业：\n  `public void\
  \ execute(QueueableContext context)`\n- 实现 `Queueable` 的对象可以包含表示要执行的工作的可序列化状态。这可以是复杂的列表、映射或您自己的\
  \ Apex 类型。\n- 通常，出队并执行工作所需的时间少于 Batch Apex。\n- 处理列表时要小心，确保使用大容量列表进行容量测试，以确保作业能够用最大数据量完成。\n\
  - 您可以跟踪执行，因为返回了 **Apex 作业 ID**。\n- 从 Apex 触发器执行时应谨慎考虑。使用 `Queueables` 应进行批量处理，如果存在批量数据加载的可能性，则更有可能触及\
  \ @future 作业的每用户每日限制。\n- 您可以在同步上下文中启动最多 50 个 `queueables` 作业。\n- 您只能在现有的 `queueable`\
  \ 作业中启动一个 `queueable` 作业；这称为链式调用。链的深度不限，但随着深度增加，平台会减慢作业之间的间隔。此外，开发者版组织的深度限制为 5。\n\
  - 如果代码尝试在现有 `queueable` 上下文中发出多个 `queueable` 作业，将发生错误。如果您的打包代码可以由订阅者组织中的代码（例如开发者\
  \ X 编写的代码）调用，则这尤其成问题。如果他们有自己的异步方法间接调用您对该功能的使用，将会发生异常。因此，请尽量避免从打包的 Apex 触发器上下文中使用这些功能。\n\
  - 可以同时运行的 queueables 作业比 Batch Apex 更多。确切限制未记录。但是，请务必避免淹没系统，通过实施控制链式调用和并发性的逻辑来实现。\n\
  \n## Batch Apex\n\n在我们的场景中，加载到 Salesforce 中的 **Race Data** 记录默认不会将自身与适用的 **Contestant**\
  \ 记录关联。如前所述，**Contestant** 记录具有一个 **Race Data Id** 字段，该字段包含由 **Year**、**Race Name**\
  \ 和 **Driver Id** 字段拼接而成的 Apex 计算的唯一值。\n\n以下 Batch Apex 作业旨在处理所有 **Race Data** 记录，计算复合\
  \ **Contestant Race Data Id** 字段，并将记录与相关 **Contestant** 记录关联更新。以下示例突出了在此上下文中 Selector\
  \ 和 Service 层模式的几个其他用法：\n\n- `RaceDataSelector` 类用于提供所需的 `QueryLocator` 方法，将 SOQL\
  \ 逻辑（在此示例中虽简单）封装在 Selector 层中。\n\n- `RaceService.processData` 方法（添加以支持此作业）接收记录的\
  \ ID，而不是传递给 execute 方法中的 `scope` 参数的记录。这种通用方法避免了对记录数据过时的任何担忧，因为 Batch Apex 在作业开始时序列化了所有记录数据。\n\
  \n- 按照标准做法，Service 层不处理异常；这些异常抛给调用者并由调用者适当处理。在此示例中，使用新的 `LogService` 类捕获抛出的异常并将其记录到自定义对象中，利用\
  \ Apex 作业 ID 作为区分其他作业日志条目的手段。请注意，`LogService` 的使用仅用于说明；它未在本章示例代码中实现。\n\n- 在 `finish`\
  \ 方法中，新的 `NotificationService` 封装逻辑，能够通知最终用户（可能通过电子邮件、任务或 Chatter，如前所述）作业结果，并传递\
  \ Apex 作业 ID，以便它可以利用存储在日志自定义对象和/或 `ApexAsyncJob` 中的信息为用户形成合适的消息。同样，这仅用于说明。\n\n以下代码显示了处理赛车数据记录的\
  \ Batch Apex 作业的实现：\n\n```java\npublic class ProcessRaceDataJob\nimplements Database.Batchable<SObject>\
  \ {\npublic Database.QueryLocator start(\nDatabase.BatchableContext ctx) {\nreturn\n\
  RaceDataSelector.newInstance().selectAllQueryLocator();\n}\n\npublic void execute(\n\
  Database.BatchableContext ctx, List<RaceData__c> scope) {\ntry {\nSet<Id> raceDataIds\
  \ =\nnew Map<Id, SObject>(scope).keySet();\nRaceService.processData(raceDataIds);\n\
  }\ncatch (Exception e) {\nLogService.log(ctx.getJobId(), e);\n}\n}\n\npublic void\
  \ finish(Database.BatchableContext ctx) {\nNotificationService.notify(\nctx.getJobId(),\
  \ 'Process Race Data');\n}\n}\n```\n\n请注意，即使启动 Apex 作业的代码也在 Service 方法中实现；这允许封装某些并发性和配置的预检查。要运行此作业，已在\
  \ Race Data 对象上放置了一个列表视图自定义按钮以启动该过程。控制器调用 Service 方法以按如下方式启动作业：\n\n```\nId jobId\
  \ = RaceService.runProcessDataJob();\n```\n\n考虑在使用 Batch Apex 时遵循以下实施准则：\n\n- 组织中最多可运行\
  \ 5 个活动 Apex 作业。\n- **Apex Flex Queue**（可在 **Setup** 下使用）最多可排队 100 个作业。平台会在作业完成时自动从队列中删除项目。您也可以通过\
  \ UI 或 API 重新排序队列中的项目。队列中的作业具有特殊的保持状态。\n\n\n\n\n\n- 如果组织中已有 100 个作业正在排队或执行，将抛出异常。\n\
  - 实现 Batch Apex 更为复杂，因为它需要三个方法。\n- 通常，出队和执行所需时间可能为几分钟或几小时。\n- 通常，执行所需时间（取决于项目数量）可能为数小时。\n\
  - 最多可处理 5000 万条数据库记录或 5 万个迭代器项目。\n- 来自 `start` 方法的记录或迭代器项目会被平台缓存，并通过 `execute` 方法传回，而不是来自数据库的当时最新记录。根据作业执行所需的时间，在此期间此类信息在数据库中可能已发生更改。\n\
  - 考虑在每个 `execute` 方法中重新读取记录数据，以获取最新的记录状态。\n- 可以通过其 Apex 作业 ID 追踪 Batch Apex 的进度。\n\
  - 不建议从 Apex 触发器执行（从批量化角度来看），尤其是当你期望用户使用批量数据加载工具时。\n- 可以从另一个 Batch Apex 作业（从 finish\
  \ 方法）启动另一个 Batch Apex 作业。\n- 将默认作用域大小（平台传递给每个 `execute` 方法调用的记录数量）校准到控制器和吞吐量的最佳使用状态。\n\
  - 提供订阅组织配置（通过受保护的自定义设置或自定义元数据）以更改默认作用域大小 200。\n\n请注意，从另一个 Batch Apex 作业启动 Batch\
  \ Apex 作业的能力是一个非常强大的功能，可用于通过各个阶段处理大量数据或实现清理过程。这通常被称为 **Batch Apex 链式**。但是，请记住，第二个作业启动成功与否没有保证，因此请确保已仔细考虑错误处理和恢复情况。\n\
  \n## Batch Apex 作业的性能\n\n如前所述，平台最终控制作业何时运行以及运行多长时间。但是，有一些技巧可用于改进情况：\n\n- 快速启动：确保你的\
  \ `start` 方法通过利用索引尽可能快地返回。\n- 校准：传递给 `execute` 方法的记录作用域大小需要进行校准。这需要在每个 `execute`\
  \ 可传递的最大记录数（目前为 2000）与处理记录所需的控制器之间取得平衡。前面的示例使用 2000，因为该操作本身开销较低。这意味着只需要 50 个块来执行作业（鉴于本章创建的测试卷数据），通常这允许作业更快执行，因为每次活动爆发一次完成更多工作。在卷测试时，利用\
  \ Limits 类并配合一些调试语句来确定代码使用了多少控制器，如果可以承受，则应用增加的作用域大小。请注意，如果做错了（例如，订阅组织中的数据复杂性超过你为测试数据所校准的程度），可以通过订阅组织中的受保护自定义设置进一步调整。\n\
  - Batch Apex 作业的频率：如果你的应用程序提交 Batch Apex 作业的频率更高，也许是因为它们从 Apex 触发器（不推荐）或许多用户使用的用户界面功能执行，你的应用程序将很快使组织的\
  \ Batch Apex 队列泛滥并达到 5 的并发限制，从而为你的 Batch Apex 作业或其他应用程序的作业不留空间。请仔细考虑需要提交作业的频率，以及是否可以在应用程序中排队工作，以便由\
  \ Batch Apex 计划作业在稍后时间消耗。Summer'14 Batch Apex Flex Queue 将有助于减少此问题。\n\n## 在 Apex\
  \ DML 中使用外部引用\n\nRaceService.processData 服务方法演示了在执行 DML 以关联记录时使用外部 ID 字段的绝佳示例。请注意，在以下代码中，不需要查询\
  \ Contestant__c 记录来确定要放置在 RaceData__c.Contestants__c 字段中的适用记录 ID。相反，Contestants__r\
  \ 关系字段用于存储 Contestant__c 对象的实例，其中仅填充了外部 ID 字段，因为它也是唯一的，并且可以以这种方式代替 ID 使用。\n\n```\n\
  public void processData(Set<Id> raceDataIds)\n{\n    fflib_SObjectUnitOfWork uow\
  \ =\n    Application.UnitOfWork.newInstance();\n    for (RaceData__c raceData :\n\
  \    (List<RaceData__c>)\n    Application.Selector.selectById(raceDataIds))\n  \
  \  {\n     raceData.Contestant__r =\n     new Contestant__c(\n     RaceDataId__c\
  \ =\n     Contestants.makeRaceDataId(\n     raceData.Year__c,\n     raceData.RaceName__c,\n\
  \     raceData.DriverId__c));\n     uow.registerDirty(raceData);\n     }\n    uow.commitWork();\n\
  }\n```\n\n如果在 DML 更新期间（由前面示例中的 Unit Of Work 执行）按外部 ID 查找失败，将抛出 DML 异常，例如：\n\n> 外部键外部\
  \ ID：2014-suzuka-98 未在实体 Contestant__c 的字段 RaceDataId__c 中找到\n\n不使用或显式查找 Salesforce\
  \ ID 即可关联记录的这种方法，也可在 Salesforce SOAP 和 REST API 以及各种数据加载器工具中使用。但是，在数据加载器场景中，赛季、比赛和驱动程序\
  \ ID 值需要在 CSV 文件中预先串联。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_419_0.png)\n\n\
  ## 卷测试\n\n在本章中，我们使用了 Apex 代码生成其他数据，以探索平台如何应用索引以及 Batch Apex 的使用。无论是否只有至少 200 条记录，始终执行一些卷测试都很重要，以确保你的触发器已批量化。测试更多数据可让你更好地了解软件中的其他限制，例如查询性能和任何\
  \ Visualforce 可扩展性问题。\n\n卷测试中最大的陷阱之一是测试数据的质量。获取实际客户数据通常并不容易，因此我们必须通过变化记录中的字段值来模拟信息分布，以便正确模拟软件不仅在记录更多的负载下，而且在负载下具有不同值分散情况时的行为。这将暴露出只有在记录批次中的数据值更改时才可能显现的其他错误。例如，本章中使用的\
  \ Apex 脚本可以更新为在驱动程序之间应用不同的 PitStop 策略，按每位驱动程序每场比赛变化这些类型的记录。\n\n第二个挑战是了解一个过程需要多长时间，例如\
  \ Batch Apex 作业。由于这是多租户环境，时间可能会有很大差异。这并不意味着你不应该在一天中的不同时间尝试几次，并大致了解不同数据卷下作业需要多长时间。你还应该在卷测试期间尝试你的\
  \ Batch Apex 作用域大小。作用域大小越高，要执行的工作块越少，通常，作业执行所需的流逝时间也越少。\n\n正如本章所见，只需 100,000 条记录即可将\
  \ Partner Developer Edition 组织填充到接近 250 MB 的容量。Partner Portal 测试组织提供增加到 1 GB，以便你可以进一步推进卷测试。你还应该鼓励与较大客户建立关系，在其沙箱中使用应用程序的\
  \ Beta 包版本。\n\n最后，考虑生成卷数据的其他方法；批量加载 CSV 文件可行，但可能导致数据多样性降低，因为 CSV 文件通常是静态的且不易编辑。投资一些离平台代码可能非常有价值，这些代码要么生成动态\
  \ CSV 文件，要么直接调用 Salesforce API 或 Bulk API 将数据直接推送到组织中。另外，请记住，在执行此操作的同时，你也在测试你的 Apex\
  \ 触发器代码。\n\n\n\n\n\n## Summary\n\n在本章中，我们了解到，不仅要了解记录的数量，还要了解其中数据的分布方式，这都会影响索引的需求，以确保查询性能，而无需依赖昂贵的表扫描，或者在\
  \ Apex Trigger 的情况下，避免运行时异常。确保你和你的客户了解应用索引的最佳方式，对交互式和批处理性能都至关重要。\n\n异步执行上下文为交互式上下文中可用的资源限制（governor\
  \ limits）提供了扩展和灵活的控制，但需要从一开始就仔细考虑用户体验，以确保用户始终了解后台正在发生和未发生的情况。当没有即时用户界面来传递和解决错误时，消息传递是关键。不要依赖\
  \ Apex Jobs 页面；相反，应尝试通过与应用程序中驱动后台进程的关键记录相关的自定义日志对象来上下文化错误信息，允许相关列表帮助以上下文方式传递关于作业状态和结果的信息。\n\
  \n后台进程的执行不仅限于你的应用程序，而是会影响整个订阅组织，因此应用程序提交到后台的进程频率需要仔细考虑。了解应用程序作业和最终用户作业之间的区别；后者更可能淹没组织并导致延迟，或者更糟，导致最终用户不得不重试请求。考虑利用\
  \ Apex Scheduler 实现自己的应用程序队列，以便为以后处理排队不同的工作项。Salesforce 允许最多排队 100 个 Batch Apex\
  \ 作业，使订阅者能够控制优先级。Queueables 比 @future 更灵活，因此推荐使用。Queueables 支持更多并发作业并能更快出队，但在变量数量方面不如\
  \ Batch Apex 灵活。\n\n在下一章中，我们将不再将打包组织作为主要的开发环境，而是转移到支持多个开发人员的环境，该环境由源代码控制和持续集成支持的应用程序开发生命周期所支撑，以确保您可以实时查看测试执行情况，并对应用程序源代码进行审计。\n"
- "# 12 Unit Testing\n\n单元测试是开发人员用来维护健康、强健代码库的关键技术。这种方法允许开发人员编写更小的测试，以调用给定方法或代码单元的更多变体排列。将每个方法视为一个独立的可测试代码片段，不仅意味着该方法的当前使用更不容易回归，未来的使用也得到了保护。它使开发人员能够专注于更多排列，例如错误场景和当前正在使用之外的参数值。\n\
  \n单元测试与集成测试不同，集成测试是将许多方法调用作为整体业务流程的一部分进行测试。两者在 Force.com 上都有其位置。在本章中，我们将探讨何时使用其中一种而非另一种。\n\
  \n要了解如何采用单元测试，我们首先需要了解依赖注入。这是动态将依赖类方法的行为替换为测试或存根行为的能力。使用所谓的依赖方法模拟实现（例如从数据库读取）可以避免反复进行资源密集型测试数据设置的需求。我们将探讨依赖注入的实现方式，包括使用\
  \ Force.com 平台附带的 Apex stub API。\n\n最后，本章展示了如何将单元测试应用到本书前面介绍的 Apex 企业模式中。使用流行的开源\
  \ ApexMocks 模拟框架配合 Apex stub API，开发人员可以为控制器、服务、领域和选择器类编写单元测试。\n\n本章将介绍单元测试的以下方面：\n\
  \n- 探索单元测试与系统测试之间的差异\n- 了解依赖注入及其实现方式\n- 利用 Apex stub API\n- 将 ApexMocks 模拟框架应用于\
  \ FormulaForce\n\n### Comparing Unit testing and Integration Testing\n\n单元测试与集成测试之间的大部分差异在于所测试代码的范围和测试目标。很可能您在\
  \ Force.com 上一直在混合使用这两种测试，而自己却未意识到。\n\n首先，让我们考虑维基百科对 **集成测试** 的定义：\n\n> 集成测试（有时称为集成和测试，缩写为\
  \ I&T）是软件测试中的一个阶段，在该阶段中，单个软件模块被组合并在一起作为一个组进行测试。它发生在单元测试之后、验证测试之前。集成测试以已进行单元测试的模块作为输入，将它们分组为更大的集合，对这些集合应用集成测试计划中定义的测试，并将准备好进行系统测试的集成系统作为输出。\n\
  \n一般来说，关于编写 Apex 测试的大部分公开指南都属于这一集成测试类别。的确，覆盖 Apex Trigger 代码的唯一方法是物理地写入数据库。还有必要测试解决方案的声明性方面（单元测试只测试代码）以及这些方面如何影响更广泛的应用程序流程。\n\
  \n当我阅读上述维基百科描述时，它描述了我在发现如何在这个平台上编写真正的单元测试之前一直在编写的 Apex 测试（稍后将详细介绍）。从视觉上看，我的测试将如下图所示。\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_423_0.png)\n\n我会编写 Apex 测试代码来设置我的记录或执行我的控制器代码或服务层代码（以测试\
  \ API）。此代码将相应地更新或查询数据库。\n\n然后我会编写测试代码来查询结果记录，以断言行为是否符合我的预期。这种方法确保了功能中涉及的所有类都被执行：例如服务、领域、工作单元、选择器和领域。它还确保它们仅在我正在测试的场景中做了所需的事情，以实现完成最终用户或\
  \ API 进程的总体目标。\n\n集成测试对于测试关键流程仍然是必要的，确实，为了打包解决方案所需的 Apex Triggers 代码覆盖率也需要集成测试。然而，它们确实有一些缺点：\n\
  \n- 执行时间：由于每个测试方法都需要设置、更新和查询数据库来执行，所有或单个测试方法可能开始花费越来越长的时间来执行，从而降低开发人员的生产力。\n\n-\
  \ 场景覆盖率：由于上述性能问题，引入更多样化的场景可能变得不那么实用。这会阻止开发人员进行彻底的测试（我们讨厌等待！）。这反过来又降低了代码覆盖率和测试的价值。这最终增加了开发人员未能发现\
  \ bug 的风险。\n\n- 代码覆盖率挑战：获得 100% 的代码覆盖率是理想目标，但在某些场景中可能无法实现。例如，无法在集成测试中模拟某些系统事件的错误处理。\n\
  \n- 确保对其他开发人员的前瞻性和可靠性：像 Scrum 这样的方法论教会我们以增量方式编写代码，并按市场需求及时编写。然而，开发人员通常意识到未来的需求，并希望构建框架、引擎或库来支持当前和未来的需求。可能无法编写集成测试来确保当那个时候到来时，此类代码对其他开发人员来说是强健和可靠的。\n\
  \n### Introducing Unit Testing\n\n在本章中，我们将发现单元测试有助于解决上述挑战。当与集成测试结合使用时，生成的测试套件为您的应用程序创建了一组更强大、更高效的\
  \ Apex 测试。\n\n了解和编写单元测试通常看起来很困难，因为这需要你学习其他概念，其中一些概念决定了你如何编写应用程序代码。关注点分离、依赖注入、模拟和测试驱动开发等概念是你在搜索单元测试时会遇到的概念。我们将在本章中探讨这些概念。当然，你现在已经非常熟悉\
  \ SOC 及其在 Apex 企业模式中的应用了。\n\n请考虑维基百科对单元测试的定义：\n\n> 直觉上，可以将单元视为应用程序中最小的可测试部分。\n>\
  \ 在过程式编程中，一个单元可以是整个模块，但更常见的是单个函数或过程。在面向对象编程中，一个单元通常是整个接口，例如类，但也可以是单个方法。\n> 单元测试是程序员或偶尔由白盒测试人员在开发过程中创建的简短代码片段。\n\
  \n通过这个定义，单元测试与集成测试之间最大的差异显而易见。单元测试可能覆盖代码库中潜在任何类的方法，而不仅仅是外层控制器类或服务类。此外，目标是仅测试所选方法中的代码执行和行为，而不测试其他内容。\n\
  \n困难部分可能是阻止正在进行单元测试的方法所调用的其他方法的执行。这是通过用存根代码（或所谓的模拟代码）替换真实生产代码的部分（仅在测试上下文中）来完成的，这些代码模拟这些方法的行为。然后，你正在单元测试的方法仍然可以执行。理想情况下，该方法应该对这种替换（即注入）毫不知情。\n\
  \n例如，控制器方法的单元测试应该只测试该方法的行为，例如与视图状态的交互或处理 UI 请求和响应与服务层调用。服务层方法做什么并不感兴趣。开发人员不应在单元测试代码中考虑依赖方法的任何此类要求（例如数据库设置）。\n\
  \n同样，在测试服务层逻辑时，它对工作单元、选择器和领域类的使用并不感兴趣或关注。但是，这些依赖项需要解决。下一节将讨论如何注入依赖项。\n\n\n\n\n下图显示了一系列针对特定类的单元测试，这些测试使用依赖类方法的模拟替代品，以避免需要关心它们的需求：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_426_0.png)\n\n依赖类的模拟版本应模仿调用方法（即你正在测试的方法）的预期，例如通过返回值或抛出异常。配置模拟是你需要掌握的单元测试关键设置方面。它可以让你编写非常复杂且多样的测试。我们将在本章后面详细介绍模拟。\n\
  \n同时，如果在开发测试代码时你不熟悉模拟方法，这个 http://en.wikipedia.org/wiki/Mock_object 链接是一个有用的介绍。当然，互联网上有许多其他网站描述其优势。以下是维基百科页面的摘录：\n\
  \n> '在面向对象编程中，模拟对象是以受控方式模仿真实对象行为的模拟对象。程序员通常创建模拟对象来测试其他对象的行为，这很大程度上类似于汽车设计师使用碰撞测试假人来模拟人类在车辆撞击中的动态行为。\n\
  > \n> 在单元测试中，模拟对象可以模拟复杂真实对象的行为，因此当真实对象不切实际或不可能纳入单元测试时，它们非常有用。如果实际对象具有以下任何特征，那么使用模拟对象来代替它可能很有用。\n\
  \n开发者在单元测试上投入越多，集成测试和最终用户发现缺陷的可能性就越小。但是请记住，证明方法在隔离状态下工作并不能证明你的应用程序按设计运行。集成测试仍然是测试应用程序的关键工具。\n\
  \n## 依赖注入、模拟和单元测试\n\n到这个阶段，你可能在想，使用代码在测试执行期间如何在技术上替换或 *注入*（使用正确的术语）不同的已编译代码。为了说明依赖注入的各种选项，让我们从一个简单的代码示例开始。我们将在本章后面探讨如何将单元测试应用于\
  \ Apex Enterprise 模式。\n\n下图显示了 `Car` 类模型的 **统一建模语言 (UML)**，该模型在设计时考虑了 SOC（关注点分离）。引擎、仪表板和数字读数显示等职责已被分离。这是一个纯\
  \ Apex 代码示例，用于说明如何使用依赖注入 (DI) 来管理类之间的依赖关系：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_427_0.png)\n\
  \n以下是 `Car` 类的代码。它依赖于 `Dashboard` 和 `Engine` 类中的方法。调用者必须设置并提供这些类的实例，方法才能正确运行：\n\n\
  ```\npublic class Car {\n    private Engine engine;\n    private Dashboard dashboard;\n\
  \    private Boolean isRunning;\n\n    public Car(Engine engine, Dashboard dashboard)\
  \ {\n        this.dashboard = dashboard;\n        this.engine = engine;\n    }\n\
  \n    public void start() {\n        dashboard.initialise();\n        engine.start();\n\
  \    }\n\n    public void stop() {\n        engine.stop();\n        dashboard.off();\n\
  \    }\n\n    public Boolean isRunning() {\n        return engine.isRunning();\n\
  \    }\n}\n```\n\nstart 和 stop 方法包含确保仪表板和引擎相应初始化的功能。以下是 Dashboard 类的代码，它需要 Display\
  \ 类的实例，该类处理信息的显示：\n\n```\npublic class Dashboard {\n\n    private Display display;\n\
  \n    public Dashboard(Display display) {\n        this.display = display;\n   \
  \ }\n\n    public void initialise() {\n        display.backlight(true);\n      \
  \  display.showMessage(10, 20, 'Hello Driver!');\n    }\n\n    public void updateRPMs(Integer\
  \ rpms) {\n        display.showMessage(10, 10, 'RPM: ' + rpms);\n    }\n\n    public\
  \ void off() {\n        display.backlight(false);\n    }\n\n}\n```\n\n`Dashboard`\
  \ 类上的方法与 `Display` 类集成，以在汽车数字显示屏的各个位置显示消息。`Display` 类没有依赖项，因此为简单起见此处未显示。（如果你想查看其代码，可以参考本章的示例代码）。最后，`Engine`\
  \ 类显示如下：\n\n```\npublic class Engine {\n\nprivate Dashboard dashboard;\nprivate\
  \ Boolean isRunning;\n\npublic Engine(Dashboard dashboard) {\n    this.dashboard\
  \ = dashboard;\n}\n\npublic void start() {\n    dashboard.updateRPMs(1000);\n  \
  \  isRunning = true;\n}\n\npublic void stop() {\n    dashboard.updateRPMs(0);\n\
  \    isRunning = false;\n}\n\npublic Boolean isRunning() {\n    return isRunning;\n\
  \n}\n}\n```\n\n`Engine` 类中的方法调用 `Dashboard` 类上的方法，以向驱动程序更新引擎的 **每分钟转数 (RPM)**。\n\
  \n> 这是示例代码。实际代码可能包括表示各种硬件传感器的类。\n\n首先让我们看看 Car 的集成测试是什么样子：\n\n```\n@IsTest\nprivate\
  \ class CarTest {\n\n@IsTest\nprivate static void integrationTestStartCar() {\n\
  \    // Given\n    Display display = new Display();\n    Dashboard dashboard = new\
  \ Dashboard(display);\n    Engine engine = new Engine(dashboard);\n\n    // When\n\
  \    Car car = new Car(engine, dashboard);\n    car.start();\n\n    // Then\n  \
  \  System.assertEquals(true, car.isRunning());\n    System.assertEquals(true, engine.isRunning());\n\
  \    System.assertEquals(true, display.isVisible());\n    System.assertEquals('Hello\
  \ Driver!',\n        display.getMessageShowAt(10, 20));\n    System.assertEquals('RPM:1000',\n\
  \        display.getMessageShowAt(10, 10));\n}\n}\n```\n\n> 此测试的设置看起来很简单，但想象一下，如果每个构建的类都需要创建其他配置和数据，设置逻辑可能会迅速增长。这个集成测试本身是完全有效且有用的。但是，正如我之前提到的，你不能仅仅因为彻底单元测试了方法，就假设当把所有东西放在一起时一切仍然可以工作！\n\
  > \n> 前面的测试代码分为三个主要部分：Given、When 和 Then。这种方法和思维来源于另一种称为行为驱动开发 (BDD) 的实践。你可以阅读 Martin\
  \ Fowler 的网站上的更多内容。https://martinfowler.com/bliki/GivenWhenThen.html\n\n## 决定在单元测试中测试什么和不测试什么\n\
  \n在本节中，让我们回顾我们想要编写哪种类型的单元测试，以及这些测试应该针对前面示例中的某些方法断言什么。\n\n让我们考虑一下，在编写仅测试 Car.start\
  \ 方法中以下逻辑的单元测试时，我们会断言什么。（请记住，我们目前不感兴趣测试 dashboard.initialise 或 engine.start 方法）：\n\
  \n```\npublic void start() {\n    dashboard.initialise();\n    engine.start();\n\
  }\n```\n\n对于此方法，我们会断言 dashboard.initialise 和 engine.start 方法实际上已被调用。因此，在此方法的单元测试中，我们只测试\
  \ start 方法的行为。在单独的单元测试中，我们也会测试 Dashboard.initialise 和 Engine.start 方法本身。\n\n> 仅测试方法的行为或实现（例如，它调用了哪些方法），与断言值相比可能看起来很奇怪。但是，有时断言某些方法已被调用（以及被调用的次数）以及任何可能存在的参数已传递给它们，是验证代码按预期工作的关键。断言方法返回的值，作为测试正确行为的一种手段，在单元测试中也是有效的。\n\
  \n对于再次显示在以下代码中的 Engine.start 方法，我们希望断言 dashboard.updateRPMs 方法已使用正确的空转 RPM 值被调用，并且引擎状态已正确设置为运行中：\n\
  \n```\npublic void start() {\n    dashboard.updateRPMs(1000); // Idle speed\n  \
  \  isRunning = true;\n}\n```\n\n我们不关心该方法是否更新了显示器；那是直接测试 Dashboard.updateRPMs 方法的另一个单元测试的关注点。\n\
  \n以下是 Dashboard.updateRPMs 方法的代码。在为该方法编写单元测试时，我们应该验证传递给 rpms 参数的任何值是否已正确传递给 Display.showMessage\
  \ 方法：\n\n```\npublic void updateRPMs(Integer rpms) {\n    display.showMessage(10,10,\
  \ 'RPM: ' + rpms);\n}\n```\n\n\n\n为了仅针对这些方法编写单元测试，我们需要 dashboard、display 和 engine\
  \ 变量引用编译器能识别为具有所需方法的对象。但同时还需要允许我们将这些方法的实际实现替换为特殊的仅测试版本，以便记录方法何时被调用，从而断言行为。我们需要的是\
  \ Dashboard、Engine 和 Display 类的模拟实现。\n\n## 构造函数依赖注入\n\n前面的代码在类之间建立了显式的硬编码依赖。为绕过此问题，可以应用\
  \ CDI。这种方法已在 Java 等其他语言中使用。在以下示例中，Apex 接口用于表达你希望独立测试的各个代码单元之间的依赖关系。\n\n> 不需要将此应用于所有方法调用依赖；仅应用于你想要进行单元测试的那些依赖。Apex\
  \ Enterprise 模式主要关注 Services、Domain、Selector 和 Unit of Work 类。\n\n通过利用给定接口可有多种实现的能力，我们可以改变执行哪种实现。我们可以执行方法的实际实现（由前面的类提供），或者仅测试其模拟行为，通常在测试本身中定义。因此，取决于正在编写的测试类型（集成测试或单元测试），你将相应的实现传递给\
  \ Car 类的构造函数。\n\n为支持这种注入方式，必须更改以下三项：\n\n- 首先，创建接口以反映 Engine、Dashboard 和 Display\
  \ 类上的方法。以下代码展示了如何定义这些接口：\n\n```java\npublic interface IEngine {\n    void start();\n\
  \    void stop();\n    Boolean isRunning();\n}\npublic interface IDashboard {\n\
  \    void initialise();\n    void updateRPMs(Integer rpms);\n    void off();\n}\n\
  public interface IDisplay {\n    void backlight(Boolean onOff);\n    void showMessage(Integer\
  \ positionX, Integer positionY, String message);\n    String getMessageShowAt(Integer\
  \ positionX, Integer positionY);\n    Boolean isVisible();\n}\n```\n\n- 其次，类的实际实现必须实现这些接口，因为接口是基于它们的方法的。这通常只需要声明类实现接口：\n\
  \n```java\npublic class Engine implements IEngine {\npublic class Dashboard implements\
  \ IDashboard {\npublic class Display implements IDisplay {\n```\n\n- 最后，代码库中必须引用接口类型而非具体类。例如，Car\
  \ 构造函数现在接受接口类型，用于调用方法的成员类型 engine 和 dashboard 也是如此：\n\n```java\npublic class Car\
  \ {\n    private IEngine engine;\n    private IDashboard dashboard;\n    private\
  \ Boolean isRunning;\n\n    public Car(IEngine engine, IDashboard dashboard) {\n\
  \        this.dashboard = dashboard;\n        this.engine = engine;\n    }\n}\n\
  ```\n\n> 请注意，本章前面展示的 Car 类集成测试无需修改仍可正常工作，因为它使用的实际实现实现了这些接口。\n\n## 使用 CDI 和模拟实现单元测试\n\
  \n现在也可以实现接口的模拟实现。这些模拟类可以根据你需要模拟的行为以及要断言的内容，尽可能简单或复杂。请注意，不需要完全实现所有方法；存根即可。实现测试场景所需的内容即可：\n\
  \n```java\nprivate class MockDashboard implements IDashboard {\n    public Boolean\
  \ initialiseCalled = false;\n    public Boolean updateRPMsCalled = false;\n    public\
  \ Integer updateRPMsCalledWith = null;\n    public void initialise() { initialiseCalled\
  \ = true; }\n    public void updateRPMs(Integer rpms) {\n        updateRPMsCalled\
  \ = true;\n        updateRPMsCalledWith = rpms;\n    }\n    public void off() {\
  \ }\n}\n```\n\n```java\nprivate class MockEngine implements IEngine {\n    public\
  \ Boolean startCalled = false;\n    public void start() { startCalled = true; }\n\
  \    public void stop() { }\n    public Boolean isRunning() { return true; }\n}\n\
  ```\n\n```java\nprivate class MockDisplay implements IDisplay {\n    public Boolean\
  \ showMessageCalled = false;\n    public String showMessageCalledWithMessage = null;\n\
  \    public void backlight(Boolean onOff) { }\n    public void showMessage(Integer\
  \ positionX, Integer positionY, String message) {\n        showMessageCalled = true;\n\
  \        showMessageCalledWithMessage = message;\n    }\n    public String getMessageShowAt(Integer\
  \ positionX, Integer positionY) { return null; }\n    public Boolean isVisible()\
  \ { return false; }\n}\n```\n\n> 如果需要，可以将这些模拟类的实现封装在 Apex 测试类或单个类中，作为内部类。\n\n在进行上述更改并引入模拟类后，Car\
  \ 类对象模型的实现现在支持通过 CDI 进行单元测试。\n\n以下每个单元测试都位于本章示例代码中的相应测试类中，例如 CarTest、EngineTest\
  \ 和 DashboardTest。\n\n以下是 Car.start 方法的单元测试：\n\n```java\n@IsTest\nprivate static\
  \ void whenCarStartCalledDashboardAndEngineInitialised() {\n    // Given\n    MockDashboard\
  \ mockDashboard = new MockDashboard();\n    MockEngine mockEngine = new MockEngine();\n\
  \n    // When\n    Car car = new Car(mockEngine, mockDashboard);\n    car.start();\n\
  \n    // Then\n    System.assert(car.isRunning());\n    System.assert(mockDashboard.initialiseCalled);\n\
  \    System.assert(mockEngine.startCalled);\n}\n```\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_435_0.png)\n\
  \n> 请注意测试方法使用的命名方法。这是有意为之，因为单元测试通常会产生许多小型单元测试方法。拥有如本节所示的命名约定有助于一眼看出测试涵盖的内容。再次强调，此约定借鉴了本章前面提到的\
  \ BDD 原则。\n\n请注意，该测试不需要任何设置来满足 engine 和 dashboard 依赖项的设置要求，例如构造 Display 类的实例。\n\n\
  模拟类还可以记录作为参数传递的值以便后续断言。以下是 Engine.start 方法的单元测试：\n\n```java\n@IsTest\nprivate static\
  \ void whenStartCalledDashboardUpdated() {\n    // Given\n    MockDashboard mockDashboard\
  \ = new MockDashboard();\n\n    // When\n    Engine engine = new Engine(mockDashboard);\n\
  \    engine.start();\n\n    // Then\n    System.assert(engine.isRunning());\n  \
  \  System.assert(mockDashboard.updateRPMsCalled);\n    System.assertEquals(1000,\n\
  \        mockDashboard.updateRPMsCalledWith);\n}\n```\n\n它使用 dashboard 的模拟实现来确认\
  \ Dashboard.updateRPMs 方法正确接收了相应的值。\n\n最后，以下是 Dashboard.updateRPMs 方法的单元测试：\n\n\
  ```java\n@IsTest\nprivate static void whenUpdateRPMsCalledMessageIsDisplayed() {\n\
  \n    // Given\n    MockDisplay mockDisplay = new MockDisplay();\n\n    // When\n\
  \    Dashboard dashboard = new Dashboard(mockDisplay);\n    dashboard.updateRPMs(5000);\n\
  \n    // Then\n    System.assert(mockDisplay.showMessageCalled);\n    System.assertEquals('RPM:5000',\n\
  \        mockDisplay.showMessageCalledWithMessage);\n}\n```\n\n它使用 display 的模拟实现来验证正确行为，并在调用方法时计算并将显示值传递给\
  \ display：\n\n> 使用接口实现依赖注入会在生产代码中增加接口的开发和使用开销。Salesforce 在引入本章后面将描述的 Apex Stub API\
  \ 时对其进行了改进。由于 Stub API 仍然相对新，你可能仍然会看到通过接口实现 DI。Apex Enterprise Patterns 库在 Stub\
  \ API 到来之前就使用了它。另请记住，正如本书前面各节所见，Apex 接口在提供架构演进的灵活性以及降低耦合方面还有许多其他用途，可在本书定义的明确边界与你的逻辑之间定义此类边界。\n\
  \n\n\n\n## 其他依赖注入方式\n\n构造函数模式的一种变体是使用设置器方法将引用注入到正在进行单元测试的类的实例中。这些方法应使用 @TestVisible\
  \ 注解，以便这些方法不会被用于覆盖实例设置来指向依赖类的真实实例（这些实例可能在构造函数中设置）。\n\n本书前面讨论的工厂模式也可用于注入模拟实现的替代实现。工厂方法不要求为每个类的构造函数声明依赖项列表。相反，通过调用工厂方法来获取接口的实例。\n\
  \n> 使用工厂依赖注入而非 CDI 是否偏好，取决于是否需要前置声明依赖项。Apex Enterprise 模式库选择使用工厂模式而非 CDI 进行注入，因为服务、域和选择器等层在整个应用程序代码库中定义良好且应用一致。\n\
  \n本书前面章节中使用的 Application 类工厂允许你通过调用每个相应工厂上的相应方法，来实现服务、域或选择器实现的运行时注入。\n\n以下 Application\
  \ 类工厂方法允许你获取实现指定服务、工作单元、域或选择器类的对象实例。这些是前面章节中用于在运行时实现各种动态配置行为的相同方法：\n\n```\nApplication.Service.newInstance\n\
  Application.Domain.newInstance\nApplication.Selector.newInstance\nApplication.UnitOfWork.newInstance\n\
  ```\n\n必须将结果强制转换为适用的 Apex 类或接口。\n\n以下方法可用于在给定服务、域或选择器类的测试设置期间注册替代实现。\n\n```\nApplication.Service.setMock\n\
  Application.Domain.setMock\nApplication.Selector.setMock\nApplication.UnitOfWork.setMock\n\
  ```\n\n前面的 newInstance 方法随后将优先返回这些实例，而不是你在 Application 类中配置的真实类的实例。\n\n在前面一章中，RaceService\
  \ 已创建并实现了 IRaceService。以下 RaceController 类的单元测试利用此接口和 Application.Service.setMock\
  \ 方法。要向工厂注册 IRaceService 接口的模拟实现。为了实现一个验证控制器的记录 ID 是否正确传递到所调用服务方法的单元测试：\n\n```\n\
  @IsTest\nprivate static void whenAwardPointsCalledIdPassedToService() {\n\n    //\
  \ Given\n    MockRaceService mockService = new MockRaceService();\n    Application.Service.setMock(IRaceService.class,\
  \ mockService);\n\n    // When\n    Id raceId = fflib_IDGenerator.generate(Race__c.SObjectType);\n\
  \    RaceController raceController =\n        new RaceController(\n            new\
  \ ApexPages.StandardController(\n                new Race__c(Id = raceId)));\n \
  \   raceController.awardPoints();\n\n    // Then\n    System.assert(mockService.awardChampionshipPointsCalled);\n\
  \    System.assertEquals(new Set<Id> { raceId },\n        mockService.awardChampionshipPointsCalledWithRaceIds);\n\
  }\n```\n\n> 为简洁起见，此处未显示 MockRaceService，但它遵循与本章前面所示的其他模拟类相同的模式。请参阅本章示例代码中包含的 RaceControllerTestMockingDemo\
  \ 类中的相关内容。另请回想，RaceService.service 方法使用 Application 服务工厂来创建要执行的服务实例。\n\n## 依赖注入框架的优势\n\
  \n迄今为止，我们已经讨论了通过使用工厂或构造函数并实现 Apex 接口来注入要模拟的类的替代模拟实现，从而实现依赖注入的方法。DI 框架为开发人员提供了访问某些底层语言运行时功能的方式，这些功能可以提供更直接的方式来实现这些方面。\n\
  \n因此，DI 框架倾向于帮助开发人员以更少的样板代码（例如使用接口）更轻松地获得 DI 的好处，尤其是在旧代码库中。然而，开发人员仍可能需要编写如上所见的模拟实现，并通过\
  \ SOC 仔细管理类之间的依赖关系。\n\n例如，Java 利用其反射 API 允许在运行时进行注入，而无需接口。Java Spring 框架通过允许通过 XML\
  \ 文件进行配置来扩展此功能，以允许不同的运行时配置。某些框架还会拦截原生 *new* 运算符的使用。这避免了实现前面代码中概述的基于工厂或构造函数的注入方法的需要。\n\
  \nApex 运行时的相对较新的补充是 **Apex Stub** API。这是 Salesforce 作为其平台一部分提供的此类 DI 框架之一。它不覆盖 *new*\
  \ 运算符。开发人员仍需要实现如前所述的注入方法。然而，它确实使在旧代码库中（未应用接口的地方）采用模拟变得更加容易。本章剩余部分将继续更详细地探索此 API，并且将在其之上构建框架。\n\
  \n## 使用 Apex Stub API 编写单元测试\n\n**Apex Stub** API 仅适用于 Apex 测试上下文。因此，它不能用于在测试之外实现\
  \ DI。为此，您仍需利用 Apex 接口。\n\n利用这些 API 需要了解以下内容：\n\n- 实现 Stub 提供程序接口：系统提供的 `System.StubProvider`\
  \ Apex 接口实际上是一种回调式接口。它允许您的模拟代码在测试中针对正在模拟的类进行方法调用时得到通知。您可以多次实现此接口，每个模拟类一次，或者使用单个实现来构建复杂的通用模拟框架。FinancialForce.com\
  \ 的 Apex Mocks 开源框架就是一个我们将在后面审查的此类框架。\n\n- 模拟的动态创建存根：平台会通过 Test.createStub 方法自动创建您希望模拟的类的实例。使用\
  \ Stub API 时，您不需要创建 Apex 接口来执行 DI。唯一的要求是向平台提供 Test.StubProvider 接口的实现，以便在测试执行期间调用创建的存根实例上的方法时进行回调。\n\
  \n## 使用 Test.StubProvider 实现模拟类\n\n使用 System.StubProvider 实现模拟处理代码只需实现一个方法，而无需逐个实现正在模拟的每个方法。这是因为此接口是所有可能方法签名的通用接口。\n\
  \n如以下 MockDashboard 类的实现所示，此接口上的 handleMethodCall 方法会传递模拟代码所需的所有信息，以识别哪个对象的哪个方法已被调用。\n\
  \n```\nprivate class MockDashboard implements System.StubProvider {\n\n    public\
  \ Boolean initialiseCalled = false;\n\n    public Object handleMethodCall(\n   \
  \     Object stubbedObject,\n        String stubbedMethodName,\n        Type returnType,\n\
  \        List<Type> listOfParamTypes,\n        List<String> listOfParamNames,\n\
  \        List<Object> listOfArgs) {\n\n        // Record method call\n        if(stubbedMethodName\
  \ == 'initialise') {\n            initialiseCalled = true;\n        }\n\n      \
  \  return null;\n    }\n}\n```\n\n再次强调，此模拟实现仅实现了满足所执行测试的模拟要求所需的最低限度。它只验证 initialise\
  \ 方法是否被调用。\n\n> Salesforce 提供了一组丰富的参数，以允许对此方法进行更通用的实现。我们将在本章后面通过 Apex Mocks 框架审查这些参数。\n\
  \n## 为模拟类创建动态存根\n\n实现 System.StubProvider 后，仍无法将 MockDashboard 类的实例传递给 Car 类，因为它无法强制转换为\
  \ dashboard 的实例。要使此成为可能，必须调用平台提供的 Test.createStub 方法。这在内部创建 Dashboard 类的实例，但将方法调用路由到提供的存根提供程序，而不是实际代码。\n\
  \n我决定在这些示例中遵循的一种约定是，通过模拟类上的自己的 createStub 方法来封装对此方法的调用。这减少了调用它时的重复量（样板代码），并在编写单元测试代码时更易于使用，如您将在下一节中看到。\n\
  \n```\nprivate class MockDashboard implements System.StubProvider {\n    public\
  \ Boolean initialiseCalled = false;\n\n    public Object handleMethodCall(... )\
  \ {\n    ...\n    }\n\n    public Dashboard createStub() {\n    return (Dashboard)\
  \ Test.createStub(Dashboard.class, this);\n    }\n}\n```\n\n## 使用 Apex Stub API\
  \ 的模拟示例\n\n实现 MockDashboard 类后，我们可以在单元测试中使用它。生成的单元测试类似于使用 Apex 接口所示的测试：\n\n```\n\
  @IsTest\nprivate static void\nwhenCarStartCalledDashboardAndEngineInitialised()\
  \ {\n// Given\nMockDashboard mockDashboard = new MockDashboard();\n\n\n\n\n\nMockEngine\
  \ mockEngine = new MockEngine();\n\n// When\nCar car = new Car(\n    mockEngine.createStub(),\n\
  \    mockDashboard.createStub());\ncar.start();\n\n// Then\nSystem.assert(car.isRunning());\n\
  System.assert(mockDashboard.initialiseCalled);\nSystem.assert(mockEngine.startCalled);\n\
  }\n\n本单元测试中使用的示例单元测试代码和模拟对象已在 CarTestApexStubAPIDemo 类中实现。\n\n与 Apex 接口方法的主要区别在于使用适用的\
  \ createStub 方法创建被模拟类的桩实例。\n\n以下代码显示了前一单元测试中使用的 MockEngine 类的 handleMethodCall 方法。它说明了如何为\
  \ Engine.isRunning 方法返回模拟响应：\n\n```\npublic Object handleMethodCall(\n    Object\
  \ stubbedObject,\n    String stubbedMethodName,\n    Type returnType,\n    List<Type>\
  \ listOfParamTypes,\n    List<String> listOfParamNames,\n    List<Object> listOfArgs)\
  \ {\n    // Record method call\n    if(stubbedMethodName == 'isRunning') {\n   \
  \     isRunningCalled = true;\n        return true;\n    } else if(stubbedMethodName\
  \ == 'start') {\n        startCalled = true;\n    }\n    return null;\n}\n```\n\n\
  以下代码显示了来自 MockDisplay 类的 handleMethodCall 方法（有关完整代码，请参见 DashboardTestApexStubAPIDemo\
  \ 类）以及 listOfArgs 参数的用法：\n\n```\npublic Object handleMethodCall(\n    Object stubbedObject,\n\
  \    String stubbedMethodName,\n    Type returnType,\n    List<Type> listOfParamTypes,\n\
  \    List<String> listOfParamNames,\n    List<Object> listOfArgs) {\n\n    // Record\
  \ method call and parameter values\n    if(stubbedMethodName == 'showMessage') {\n\
  \        showMessageCalled = true;\n        showMessageCalledWithMessage = (String)\
  \ listOfArgs[2];\n    }\n    return null;\n}\n```\n\n前面的模拟处理程序代码监控 Dashboard updateRPMs\
  \ 方法调用 showMessage 方法。随后它会存储参数值以便后续断言，而不仅仅是记录方法本身被调用的事实。\n\n以下单元测试代码利用这一点来测试在调用\
  \ updateRPMs 方法时，是否将正确信息传递给显示器：\n\n```\n@IsTest\nprivate static void whenUpdateRPMsCalledMessageIsDisplayed()\
  \ {\n\n    // Given\n    MockDisplay mockDisplay = new MockDisplay();\n\n    //\
  \ When\n    Dashboard dashboard = new Dashboard(mockDisplay.createStub());\n   \
  \ dashboard.updateRPMs(5000);\n\n    // Then\n    System.assert(mockDisplay.showMessageCalled);\n\
  \    System.assertEquals('RPM:5000',\n        mockDisplay.showMessageCalledWithMessage);\n\
  }\n```\n\n## 使用 Apex Stub API 时的注意事项\n\n以下是有关 Apex Stub API 的一些常规说明和注意事项：\n\n- 在应用程序代码中使用\
  \ Apex `new` 运算符时，它仍会创建实际类型。因此，你仍需利用依赖注入约定（如本章中描述的一种约定），将你希望在单元测试中模拟的任何依赖类的替代实现注入进去。\n\
  \n- 类间依赖边界处显式定义的接口并非严格要求，但可能是进一步强化 SOC 边界或对应用程序进行更多配置的有用手段。\n\n- 并非所有方法和类都可以使用 `Test.createStub`\
  \ 方法进行桩化。示例包括内部类和 get/set 访问器。此外，返回 `Iterator` 的方法也不能桩化。有关完整列表，请参阅 *Apex 开发者指南*。\n\
  \n- 静态方法也无法进行桩化，这是出于设计考虑，因为这些方法不支持依赖注入。尽管 Service 层设计约定使用了静态方法，但这些方法的实际实现会通过服务工厂，使用实例方法来访问实际的服务实现。这可以在示例代码中包含的\
  \ `RaceService` 中看到。\n\n- 关于可模拟内容的其他限制，例如私有方法和构造函数，可能看起来像是一种遗漏。但是，原则上，你在单元测试中只应该测试类的公共行为。一旦模拟了对象方法，用于实例化对象的构造函数就不再重要，因为你的模拟代码决定了每个方法返回的内容。\n\
  \n- 请记住，方法签名的更改可能会破坏模拟实现中对参数和返回类型的晚期绑定引用。在这方面，基于显式接口的模拟实现具有优势，因为如果你进行了破坏性更改，会出现编译错误。如下一节将讨论的那样，模拟框架可以帮助降低这种风险。\n\
  \n## 使用 Apex Stub API 配合模拟框架\n\n为小型代码库实现模拟类，或作为理解单元测试概念的辅助手段（如本章所做）是可以的。但是，对于较大的代码库，这很快会变得繁琐且成为维护负担。Apex\
  \ Stub API 的设计之初就是为了处理任何类形状。\n\nstubbedObject 参数可用于确定所调用方法所属的类型。这允许创建单个 System.StubProvider\
  \ 实现，该实现可以实现更高级的服务，供单元测试利用，而无需反复编写自己的模拟类。对模拟方法播放预配置的响应，并记录其接收到的每个方法调用以供后续断言，就是这种情况的一个示例。\n\
  \n模拟框架的概念并不新鲜。有许多成熟的框架，例如面向 Java 的流行 Mockito 框架，或面向 JavaScript/NodeJS 应用的 Jasmine\
  \ 框架。但是，模拟在 Apex 中是一个相对较新的概念和功能，因此基于 Apex 的模拟框架领域仍在发展中。\n\nFinancialForce.com 已发布一个名为\
  \ ApexMocks 的开源模拟框架。虽然它早于 Apex Stub API 的出现，但已更新以与该 API 协同工作。其优势在于，用于为 Apex Mocks\
  \ 创建模拟类的代码生成器不再需要；同样也不再需要显式使用 Apex 接口。\n\n在本章余下部分，我们将通过使用 ApexMocks 框架（现已包含在本章的示例代码中）来回顾模拟框架的优势。我们将首先将其应用于我们的示例\
  \ Car 类模型，然后应用于 FormulaForce 应用程序中的单元测试场景。就本人而言，完整的演示内容足以写成一整本书。你可以通过其 README 文件上的各种博客和文档链接了解\
  \ ApexMocks 的更多信息，https://github.com/financialforcedev/fflib-apex-mocks/blob/master/README.md。\n\
  \n> 应将 ApexMocks 的原始构思和创建归功于 Paul Hardaker。作为一名经验丰富的 Java 开发者，他来到该平台并习惯使用 Mockito，于是很快就想知道能否在该平台上创建类似的单元测试设施。因此，ApexMocks\
  \ 的 API 设计大量借鉴了 Mockito。自那以后，该框架不断发展壮大，获得了社区的多项其他提交和支持，包括在 Dreamforce 上的演示。我所了解的许多单元测试知识也归功于\
  \ Paul 的指导。谢谢！\n\n## 了解 ApexMocks 的工作原理\n\nCarTestApexMocksDemo 测试类中的 whenCarStartCalledDashboardAndEngineInitialised\
  \ 单元测试方法使用 ApexMocks 库。此单元测试的结构与本章到目前为止所查看的单元测试类似。它创建模拟对象，运行要测试的方法，并断言结果。\n\n主要区别在于，你不需要为希望模拟的类编写任何代码。相反，你使用\
  \ ApexMocks 框架来配置模拟响应，并断言记录了哪些方法。然后，通过其与 Apex Stub API 的集成，它会创建一个围绕任何你希望模拟的类的桩。\n\
  \nApexMocks 框架中的主类是 fflib_ApexMocks。此类为你实现了 System.StubProvider 接口。它会自动回显对被调用模拟方法的任何模拟响应，并记录它们被调用以及使用了什么参数。这适用于你要求它模拟的类上的所有公共方法。\n\
  \n使用 ApexMocks的大部分技巧在于知道如何配置调用模拟方法时它给出的模拟响应，以及如何编写匹配逻辑来断言不仅方法何时被调用，还包括被调用的次数和使用了什么参数。这一后续功能非常强大，为验证代码行为提供了一些复杂的选项。\n\
  \n以下代码初始化 ApexMocks 框架（每个测试方法都需要此操作）：\n\n```\n@IsTest\nprivate static void\nwhenCarStartCalledDashboardAndEngineInitialised()\
  \ {\n\nfflib_ApexMocks mocks = new fflib_ApexMocks();\n```\n\n\n\n\n## 接下来创建你需要的模拟实现：\n\
  \n```\n// Given\nDashboard mockDashboard =\n(Dashboard) mocks.factory(Dashboard.class);\n\
  Engine mockEngine =\n(Engine) mocks.factory(Engine.class);\n```\n\n以下代码免去了你在被测试代码执行期间编写返回测试值的模拟方法的需求。在\
  \ ApexMock 术语中，此配置代码被称为 **存根** 代码。你必须按照如下所示，将存根代码包装在 startStubbing 和 stopStubbing\
  \ 方法调用之间：\n\n```\nmocks.startStubbing();\nmocks.when(mockEngine.isRunning()).thenReturn(true);\n\
  mocks.stopStubbing();\n```\n\n> 在这个阶段，语法可能有点难以理解，但我保证你会习惯的！正如我之前所述，ApexMocks API\
  \ 的很多灵感都来自 Java Mockito 库。以至于互联网上的文章和文档也应该能帮助你学习该 API，同时也包括 GitHub 仓库提供的文档。\n\n\
  你的眼睛没有欺骗你；前面的代码正在调用你试图为其模拟响应的方法。首先，这是一个编译时引用，因此比我们在直接使用 Apex Stub API 时使用的晚期绑定字符串引用要安全得多。\n\
  \n其次，因为 mockEngine 指向一个动态生成的存根，它并不调用此方法的真实实现。相反，它在框架中注册：下一次方法调用 thenReturn，应将给定值存储为此方法的响应。这个值将在测试的稍后时间点返回，当时该模拟方法在测试用例上下文中再次被调用。在这种情况下，当\
  \ Car.isRunning 方法调用 engine.isRunning（如果你需要刷新记忆关于实现的作用，请参考 Car 代码）时，它会返回值 true。\n\
  \n单元测试的下一部分，即实际被测试的代码，则更加熟悉：\n\n```\n// When\nCar car = new Car(mockEngine, mockDashboard);\n\
  car.start();\n```\n\n断言 `Dashboard.initialise` 和 `Engine.start` 方法已被调用，以及 `Car.isRunning`\
  \ 返回的值符合预期，这与调用手写模拟类方法也略有不同：\n\n```\n// Then\nSystem.assertEquals(true, car.isRunning());\n\
  ((Dashboard) mocks.verify(mockDashboard, 1)).initialise();\n((Engine) mocks.verify(mockEngine,\
  \ 1)).start();\n}\n```\n\n由于 Apex 的显式转换要求，最后两行与你在等效的 Java Mockito 示例中看到的并不完全匹配。这会让语法更难阅读。在\
  \ Java Mockito 中，它看起来会像：\n\n```\nmocks.verify(mockDashboard, 1).initialise();\n\
  mocks.verify(mockEngine, 1).start();\n```\n\n断言代码是传统 `System.assert` 和对 `fflib_ApexMocks.verify`\
  \ 方法的调用的混合，随后是对被模拟方法的调用。同样，这种经过编译器检查的引用优于晚期绑定字符串引用。\n\n`verify` 方法接受模拟对象的实例和一个数字。这个数字允许你断言该方法只被调用了一次且仅一次。一旦\
  \ `verify` 方法退出并且模拟方法被调用，传递给 `verify` 方法的预期结果就会被检查。如果未满足——无论是因为方法未被调用，还是被调用了多次——框架实际上会让模拟方法使用\
  \ `System.assert` 来停止测试，并附带描述原因的异常消息。\n\n另一个示例是 `DashboardTestApexMocksDemo` 类中的\
  \ `whenUpdateRPMsCalledMessageIsDisplayed` 测试方法。它使用了一种更高级的形式来断言所需的模拟方法已被调用。这种方法不仅验证了该方法被调用，还验证了它使用了特定的参数值：\n\
  \n```\n@IsTest\nprivate static void whenUpdateRPMsCalledMessageIsDisplayed() {\n\
  \    fflib_ApexMocks mocks = new fflib_ApexMocks();\n\n    // Given\n    Display\
  \ mockDisplay = (Display) mocks.factory(Display.class);\n\n    // When\n    Dashboard\
  \ dashboard = new Dashboard(mockDisplay);\n    dashboard.updateRPMs(5000);\n\n \
  \   // Then\n    ((Display) mocks.verify(mockDisplay, 1)).\n    showMessage(10,\
  \ 10, 'RPM:5000');\n}\n```\n\n前面的 `verify` 方法用法与之前的测试没有不同。然而，接下来的模拟方法调用说明了 ApexMocks\
  \ 验证逻辑的一个非常酷的特性。传递给模拟方法调用的参数会被框架用于与先前测试期间该方法先前执行时记录的参数进行比较。如果检测到任何差异，将抛出断言并停止测试。\n\
  \n> 前面的一些示例内联包含了 `System.assert` 方法调用。你编写的其他单元测试可能不需要使用此语句，因为它们仅通过 `verify` 方法断言正确的依赖方法已被调用。这可能会在\
  \ **Salesforce 安全审查** 扫描器中导致误报，因为 verify 方法不被识别为断言质量的方法。如果发生这种情况，你可以添加一个注释中性断言来安抚扫描器，或者在你附加到审查的误报文档中记录原因。\n\
  \n## ApexMocks 匹配器\n\n正如你所见，使用 ApexMocks 有两个关键部分：通过存根设置模拟响应，以及通过验证来断言行为。这两个功能都支持自定义返回哪些模拟值或在\
  \ verify 期间匹配哪些参数的能力。\n\n例如，如果你正在单元测试的代码使用不同参数多次调用模拟方法，你可以在测试代码的存根阶段，使用一种称为匹配器的约定来改变返回的模拟值。\n\
  \n> 如果这是你想要覆盖的测试用例，还可以配置框架在调用模拟方法时抛出异常。\n\n当断言行为时，如果你希望检查模拟方法被调用两次——一次使用一组特定的参数值，第二次使用另一组不同的参数值——那么可以使用匹配器来表达这种期望的结果。\n\
  \n匹配器是一个高级功能，但值得你投入更多时间去学习。\n\n### ApexMocks 与 Apex 企业模式\n\n如前所述，支持库或 **Apex 企业模式**\
  \ 通过 Application 类中的工厂提供依赖注入设施。此设施也与使用 ApexMocks 和 Apex Stub API 兼容。以下章节包含使用 ApexMocks\
  \ 对先前章节中介绍的应用程序架构中的各层进行单元测试的示例。\n\n### 单元测试控制器方法\n\n以下测试位于 RaceControllerTest 类中，演示了如何模拟服务层类：\n\
  \n```\n@IsTest\nprivate static void whenAwardPointsCalledIdPassedToService() {\n\
  \n    fflib_ApexMocks mocks = new fflib_ApexMocks();\n\n    // Given\n    RaceServiceImpl\
  \ mockService = \n        (RaceServiceImpl) mocks.factory(RaceServiceImpl.class);\n\
  \    Application.Service.setMock(RaceService.class, mockService);\n\n    // When\n\
  \    Id raceId = fflib_IDGenerator.generate(Race__c.SObjectType);\n    RaceController\
  \ raceController =\n        new RaceController(\n            new ApexPages.StandardController(\n\
  \                new Race__c(Id = raceId)));\n    raceController.awardPoints();\n\
  \n    // Then\n    ((RaceServiceImpl) mocks.verify(mockService, 1).\n        awardChampionshipPoints(new\
  \ Set<Id> { raceId }));\n}\n```\n\n考虑上述测试代码中的以下显著方面：\n\n- 一般而言，控制器仅使用服务类或选择器类。如果使用了其他类，这可能被视为代码评审的讨论点？也许控制器内部的关注点分离需要进一步审查？\n\
  \n- 此测试仅创建 Service 类的模拟实例，并确认该方法使用来自控制器的正确参数值被调用。不需要模拟响应。然而，ApexMocks 框架确实允许对模拟方法抛出异常。因此，可以编写另一个测试来确认控制器中的错误处理是否正常工作。\n\
  \n### 单元测试服务方法\n\n以下测试方法位于 RaceServiceTest 类中，演示了如何模拟实现工作单元、领域和选择器层的类：\n\n```\n\
  @isTest\nprivate static void\nwhenAwardChampionshipPointsCallsDomainAndCommits()\
  \ {\n\nfflib_ApexMocks mocks = new fflib_ApexMocks();\n\n// Given - Create mocks\n\
  fflib_SObjectUnitOfWork mockUow = (fflib_SObjectUnitOfWork)\nmocks.factory(fflib_SObjectUnitOfWork.class);\n\
  RacesSelector mockSelector = (RacesSelector)\nmocks.factory(RacesSelector.class);\n\
  Contestants mockDomain = (Contestants)\nmocks.factory(Contestants.class);\n\n//\
  \ Given - Configure mock responses\nId testRaceId =\nfflib_IDGenerator.generate(Race__c.SObjectType);\n\
  Id testContestantId =\nfflib_IDGenerator.generate(Contestant__c.SObjectType);\n\
  List<Race__c> testRacesAndContestants = (List<Race__c>)\nfflib_ApexMocksUtils.makeRelationship(\n\
  \    List<Race__c>.class,\n    new List<Race__c> { new Race__c ( Id = testRaceId)\
  \ },\n    Contestant__c.Contestant__c,\n    new List<List<Contestant__c>> {\n  \
  \      new List<Contestant__c> {\n            new Contestant__c ( Id = testContestantId\
  \ ) }});\n```\n\n\n\n\n\n```java\nmocks.startStubbing();\nmocks.when(mockSelector.SObjectType()).\n\
  thenReturn(Race__c.SObjectType);\nmocks.when(mockSelector.selectByIdWithContestants(\n\
  \    new Set<Id> { testRaceId })).\nthenReturn(testRacesAndContestants);\nmocks.when(mockDomain.SObjectType()).\n\
  thenReturn(Contestant__c.SObjectType);\nmocks.stopStubbing();\n```\n\n```\n// Given\
  \ - Inject mocks\nApplication.UnitOfWork.setMock(mockUow);\nApplication.Selector.setMock(mockSelector);\n\
  Application.Domain.setMock(mockDomain);\n\n// When\nRaceService.awardChampionshipPoints(\n\
  \    new Set<Id> { testRaceId });\n\n// Then\n((RacesSelector) mocks.verify(mockSelector,\
  \ 1)).\n    selectByIdWithContestants(new Set<Id> { testRaceId }));\n((Contestants)\
  \ mocks.verify(mockDomain, 1)).\n    awardChampionshipPoints(mockUow);\n((fflib_SObjectUnitOfWork)\
  \ mocks.verify(mockUow, 1)).\n    commitWork();\n}\n```\n\n考虑前面测试代码中的以下显著方面：\n\n\
  - fflib_ApexMocksUtils.makeRelationship 方法用于在内存中构建包含子记录的记录列表。此实用方法（ApexMocks 的一部分）绕过了在模拟此数据结构时的平台限制。此方法对于返回您正在模拟的选择器方法所返回的更复杂记录集非常有用。\n\
  \n- 在调用 Application.Selector.setMock 和 Application.Domain.setMock 方法以注入 RacesSelector\
  \ 和 Contestants 域类的模拟实现之前，模拟框架用于模拟这些类模拟实例的 SObjectType 方法的响应，这些方法由 setMock 方法调用。模拟此方法可确保模拟的选择器实例已正确注册到\
  \ Selector 工厂。\n\n- fflib_IDGenerator.generate 方法（ApexMocks 的一部分）用于生成内存 ID，用于填充从模拟选择器返回的模拟记录。这些相同的\
  \ ID 用于确认传递给选择器的内容，因为相同的 ID 也传递给了服务方法。\n\n- Contestants 域类添加了默认构造函数，这是 Test.createStub\
  \ 方法所要求的，该方法由 fflib_ApexMocks.factory 方法使用。\n\n### 对域方法进行单元测试\n\n以下测试方法可在 ContestantsTest\
  \ 类中找到，并演示了如何模拟选择器方法响应以返回在内存中创建的数据库行。它还显示，断言相同的记录随后被传递到模拟的工作单元以进行更新：\n\n```\n@IsTest\n\
  private static void whenAwardChampionshipPointsUowRegisterDirty() {\n\n    fflib_ApexMocks\
  \ mocks = new fflib_ApexMocks();\n\n    // Given\n    fflib_SObjectUnitOfWork mockUow\
  \ = (fflib_SObjectUnitOfWork)\n        mocks.factory(fflib_SObjectUnitOfWork.class);\n\
  \    Application.UnitOfWork.setMock(mockUow);\n    Id testContestantId =\n     \
  \   fflib_IDGenerator.generate(Contestant__c.SObjectType);\n    List<Contestant__c>\
  \ testContestants =\n        new List<Contestant__c> {\n            new Contestant__c\
  \ (\n                Id = testContestantId,\n                RacePosition__c = 1\
  \ ));\n    // When\n    Contestants contestants = new Contestants(testContestants);\n\
  \    contestants.awardChampionshipPoints(mockUow);\n\n    // Then\n    ((fflib_SObjectUnitOfWork)\n\
  \        mocks.verify(mockUow, 1)).registerDirty(\n        fflib_Match.sObjectWith(\n\
  \        new Map<SObjectField, Object>{\n            Contestant__c.Id => testContestantId,\n\
  \            Contestant__c.RacePosition__c => 1,\n            Contestant__c.ChampionshipPoints__c\
  \ => 25 }));\n}\n```\n\n考虑前面测试代码中的以下显著方面：\n\n- 测试代码中会创建一个内存中的记录列表并将其传递给域类构造函数。然后调用正在进行单元测试的\
  \ awardChampionshipPoints 方法，以确定它是否正确地与工作单元进行交互。\n\n- 使用自定义的 ApexMocks 匹配器来检查传递给模拟的\
  \ fflib_SObjectUnitOfWork.registerDirty 方法的 SObject 是否为预期的方法。匹配器还帮助测试代码确认已计算正确的冠军积分。有关\
  \ ApexMocks 的更多信息，请参阅前面的章节。\n\n- 由于此测试使用模拟的工作单元，因此不执行 DML 操作。\n\n### 对选择器方法进行单元测试\n\
  \n选择器方法要测试的主要逻辑是动态构建 SOQL 字符串。理想情况下，如果可以模拟 Database.query 方法，那么就可以围绕复杂的选择器方法编写单元测试，以断言生成的\
  \ SOQL 字符串。由于目前这不可能，因此模拟选择器类的好处很小。相反，您的选择器类可以通过作为集成测试的一部分执行来获得覆盖率和验证。\n\n### 摘要\n\
  \n集成测试关注通过服务公开的控制器方法或 API 的范围，以测试代码的完整堆栈。它需要设置数据库、执行要测试的代码并查询数据库。这些测试对于确保应用程序的所有组件都交付预期行为至关重要。\n\
  \n为了使单个代码组件、类和方法尽可能健壮且面向未来，开发人员可以孤立地测试每个方法，而无需承担设置数据库或更新数据库的开销。因此，单元测试运行速度更快。单元测试可以提高覆盖率，因为可以使用模拟来模拟更多边界情况测试场景，这些场景在数据库上原本不可能或难以设置。\n\
  \n单元测试需要了解一些其他模式，例如依赖注入和模拟。依赖注入可以通过多种方式实现，使用构造函数、工厂和设置器方法。您使用的依赖注入方法将取决于您的个人偏好和/或您正在使用的库的偏好。如果需要，可以混合使用多种依赖注入方法。\n\
  \n实现模拟的一种方法是使用 Apex 接口。利用表示代码库依赖项之间边界的接口的多种实现，可以分别实现实际代码和测试代码。\n\n当被测试的代码不知道正在使用哪种实现时，模拟最有效。Apex\
  \ Stub API 允许为类创建动态模拟，而无需使用 Apex 接口。这对于现有代码库或使用 Apex 接口没有意义或会增加开销的场景非常有用。\n\nApexMocks\
  \ 是一个模拟框架库，它减少了构建模拟对象所涉及的工作，消除了手动编写它们的需要。基于 Mockito，它提供高级设施来配置模拟方法响应或抛出异常，以帮助测试错误处理。此框架还记录已调用的模拟方法，并提供复杂的匹配语法来断言调用了哪些方法。\n\
  \n本书中使用的 Apex Commons 开源库利用工厂模式来提供内置方法，用于注入服务、工作单元、域和选择器层的模拟实现。\n\n归根结底，单元测试及其相关先决条件是一个难以掌握的概念，并且需要大量的前期工作。最初从一些简单示例开始，并继续利用现有的\
  \ Apex 测试方法，直到准备好扩展。一旦掌握了 API 和概念，它就会变得得心应手，并可以帮助打开通往其他开发编码实践（例如测试驱动开发）的大门。\n\n\
  在本书的最后一章中，我们将退后一步，了解如何围绕多个开发人员扩展开发，并在进行更改时设置测试的持续和自动化执行。\n"
- "# 13 源代码控制和持续集成\n\n迄今为止，我们一直在 FormulaForce 应用程序的打包组织中进行更改。在这种情况下，由于您是唯一的开发人员，这工作得还算不错。但是，当添加更多开发人员和团队时，其他考虑因素就发挥作用了，主要是代码更改的可追溯性，以及当多个开发人员同时在开发组织中工作时冲突的实际影响。\n\
  \n本章将使打包组织承担更多的仓库专用角色，仅在需要创建 beta 或发布包时访问，不再像我们之前那样用于日常开发。如果您的客户希望您证明围绕软件开发流程和生命周期的控制的合规性和可审计性，这一原则对您和您的客户来说可能非常重要。\n\
  \n随着代码库的增长以及任何给定时间对其的贡献数量增加，更频繁地监控代码质量很重要。在尝试将软件发布给客户之前发现 Apex 测试失败既令人沮丧又代价高昂。持续集成与源代码控制系统协同工作，以自动化的方式验证应用程序的完整性和质量（通过您的测试），通常由开发人员向源代码控制提交更改来触发。\n\
  \n在本章中，您将学习以下内容：\n\n- 开发者工作流程\n- 使用源代码控制进行开发\n- 连接到持续集成\n\n\n\n\n\n- 从源代码控制发布\n\
  - 自动化回归测试\n\n## 开发工作流程与基础设施\n\n开发工作流程描述了开发人员的日常活动，目的是获取最新构建、进行更改，并将其提交回维护源代码当前整体状态的仓库。拥有稳健、定义明确的开发工作流程、支持工具和基础设施，对任何开发团队的效率至关重要。\n\
  \n开发人员首先想知道的是源代码在哪里，基本上是一个源代码控制系统，例如 Git。接下来是如何将其转换为可执行的形式。Salesforce 提供一个名为 Migration\
  \ Toolkit 的工具包，可帮助编写脚本，使用名为 Ant 的流行开发者脚本语言将组件部署到 Salesforce 组织。我们将在本章中构建这样的脚本。本章后面所述的持续集成构建服务器也会使用此类脚本。\n\
  \nMigration Toolkit 还提供了一种从 Salesforce 组织中提取源代码的方法，这些源代码包含表示应用程序所需的所有组件，而不仅仅是 Apex\
  \ 和 Visualforce 源文件，还包括描述自定义对象、字段、选项卡以及几乎任何其他可打包组件的 XML 文件。我们将使用此功能提取打包组织的当前状态，以便最初用所有所需组件文件填充\
  \ Git 仓库，以便在我们迄今一直在其中开发的打包组织之外维护源代码的进一步更改。\n\n## Salesforce 开发者体验 (DX)\n\n撰写本文时，Salesforce\
  \ 宣布了 Salesforce DX。这是一种面向企业开发人员需求的新型开发者体验。其目标是提供额外的工具和 API，以更好地促进基于源代码控制的开发，并实现完整的开发生命周期：\n\
  \n- 临时组织：这些是可按需创建和删除的特殊组织类型。因此，无需清理组织（您可以将此视为云端工作区）。您还可以提供 JSON 配置文件为组织设置各种配置，例如多货币，甚至命名空间（尽管您的打包组织也在使用相同的命名空间）。\n\
  - Heroku 流：Heroku 命令行已扩展了额外功能，例如创建临时组织以及将本地文件夹结构的内容与附加组织的内容同步的能力。\n\n详细信息仅限于年度 Salesforce\
  \ Dreamforce 事件上宣布的内容。前述要点旨在让您了解他们宣布的一些内容，这些内容将在未来几年内逐步推出。\n\n与此同时，以下小节为您提供了一种使用当前工具（无论是来自\
  \ Salesforce 还是社区）实现源代码控制开发的方法。此外，随着 Salesforce DX 在多个版本中继续成熟，这里介绍的某些方法可能仍然需要。\n\
  \n## 打包组织与沙箱组织与开发者组织\n\n如前所述，在一个组织中拥有多名开发人员可能会迅速变得不切实际。他们可能会意外覆盖彼此的更改，做出其他人可能不想看到的自定义对象或设置更改，并更快地消耗该组织的每日\
  \ API 限制，最终阻止所有人进行更改。\n\n在打包组织方面，还有另一个更重要的原因，那就是能够确切知道应用程序代码在一个版本和下一个版本之间应用了哪些更改。这是您和您的客户希望在任何时间都有信心能够了解的事情。\n\
  \n还有控制功能发布或回滚更改的能力，如果这些更改已经在打包组织中完成，则此操作会更加困难。出于这些原因，通常将对打包组织的访问权限限制在负责发布包的人员，从而从概念上将打包组织视为仅一个仓库。\n\
  \n沙箱组织通常用于企业组织内的自定义解决方案开发，其中沙箱已使用生产组织的副本进行初始化。这可以包括数据、已安装的包和其他自定义项。撰写本文时，沙箱组织可通过合作伙伴门户配置的企业版组织获得（最多五个）。沙箱可以作为开发者组织的替代方案。一个优势是能够将父组织配置为默认的空白状态，然后利用沙箱刷新流程有效地清理组织，为新的构建部署做好准备。请注意，即将推出的\
  \ Salesforce DX 临时组织在某些方面与沙箱组织类似。请注意，如果您正在使用字段集，沙箱组织目前不允许定义 **可用字段**。\n\n## 创建和准备您的开发者组织\n\
  \n在 *第 1 构建、发布和支持您的应用程序* 的 *所需和推荐组织* 章节中，我建议您创建一个开发者组织。如果您尚未这样做，请访问合作伙伴门户或 `https://developer.salesforce.com/`\
  \ 并获取一个新的开发者组织（或简称为 DE 组织）或 Salesforce DX 临时组织（如果您有权使用此功能）。\n\n由于此应用程序使用引用这些组件的\
  \ Lightning 组件和 FlexiPages，您需要在开发者组织上启用 **我的域**，以便本章中的部署能够成功。\n\n获得此组织后，您可能希望花一些时间进一步清除\
  \ Salesforce 放入此类组织中的示例包、Apex 代码或配置，因为这些组件将在后续的开发者工作流程中与您自己的组件合并，您希望避免将它们提交到源代码控制，或者更糟的是，将它们添加到您的包中。Salesforce\
  \ DX 临时组织在设计上是空的。\n\nSalesforce 原生不支持清除 DE 组织，但大多数开发人员都熟悉在从源代码控制获取新构建之前清理其工作环境（在\
  \ Force.com 开发中即其 DE 组织）的功能。这可以避免在开发过程中不需要的类、对象和字段累积，例如在实施策略更改或功能重新定义时，导致先前提交的组件被重命名或删除。这可能会意外泄露回您的代码库中。幸运的是，有一个开源解决方案利用\
  \ Migration Toolkit 来清除 DE 组织，我们将在后面探讨。Salesforce DX 临时组织也有相同的问题，但可以更轻松地删除并替换为新组织。\n\
  \n> 由于创建和管理包安装的开销，通常 DE 组织也会被测试工程师和团队其他成员用于测试或预览正在开发的功能。也就是说，在发布开发周期的各个阶段，从代码的稳定构建创建\
  \ Beta 包是值得考虑的，以便在最终上传流程之前进行额外的合理性和冒烟测试。包的上传和安装可以通过 Tooling 和 Metadata API 实现自动化。\n\
  \n在本章中，我们将从打包组织中提取应用程序组件为文件，然后上传到 GitHub 仓库，以便以比在 Salesforce 组织中允许的方式更强大的方式跟踪和审计更改。然后，我们将使用此仓库填充创建的\
  \ DE 组织，进行一些更改，并将这些更改提交回仓库。这被称为开发者工作流程。\n\n## 开发者工作流程\n\n在选择合适的源代码控制系统来存储应用程序代码时有许多选项。在本书中，我们将使用\
  \ GitHub 作为远程源代码控制存储和本地源代码控制仓库。\n\n\n\n\n这里的目的不是规定使用哪些工具，而是介绍一种您可以根据需要进行调整并稍后探索不同选项的\
  \ Force.com 开发流程的总体演练。下图展示了本章将逐步讲解的开发工作流：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_461_0.png)\n\
  \n以下各点与上述图示相关：\n\n- 1. 选择源代码控制产品和服务器是一项重要决策，您应考虑安全性、可访问性和持久性。您的应用程序源代码需要安全管理，仅供授权人员访问，理想情况下应通过企业中员工入职和离职时的清晰流程来管理。您选择存储源代码控制服务器的位置也进一步增加了这一点的重要性。如果出于可访问性原因，您选择使用众多基于云的源代码控制托管服务之一，或者确实自行管理（例如通过\
  \ Amazon EC2），请从每个位置执行持久性测试，确保服务器高效运行（开发人员讨厌等待！）。最后，请确保您已定义并测试了备份和恢复流程，重点是尽量减少开发人员在最坏情况发生时的停机时间。本章的下一节将介绍如何从打包组织的内容填充\
  \ GitHub 仓库。\n\n- 2. 将存储在源代码控制服务器中的文件填充到本地仓库是大多数开发人员执行的初始活动。如前所述，这应尽可能高效。如果您使用的是基于云的服务器，同步远程仓库和本地仓库所需的带宽量非常重要。有些源代码控制产品在这方面提供的实现比其他产品更高效。Git\
  \ 专门针对这种场景进行了定制，能够在本地克隆整个或特定分支的仓库（包含文件历史记录），然后根据需要逐步更新。大多数常见的源代码控制产品都为 GUI 和标准命令行界面提供了出色的选择。在本章中，我们将使用\
  \ GitHub 的 GUI 将仓库克隆到本地文件夹，以便进行开发流程的下一步。\n\n- 3. **Apache Ant** 开源工具为创建标准构建（部署）脚本及其他您可能想要构建的自定义开发工具提供了一个良好的操作系统平台无关的解决方案。\n\
  \n- 4. 在最基本的形式中，Ant 构建脚本仅利用 Salesforce 迁移工具 Ant 任务 `sf:deploy`，将本地仓库的内容部署到指定的开发者组织。但是，正如我们将在后面的章节中讨论的那样，它也构成了您持续集成解决方案的一部分。\n\
  \n- 5. 一旦部署到开发者组织，用于在 Force.com 上开发的工具范围从使用 **设置** 菜单、**架构构建器**（常被忽略）、**开发者控制台**、Force.com\
  \ IDE（Eclipse）的组合，到其他已出现的第三方 IDE。\n\n- 6. 关键要求是，一旦开发人员准备好提交到源代码控制，就需要有能力将本地存储的组件文件与开发者组织的内容进行同步。大多数基于桌面的\
  \ IDE 都提供了实现此目的的方法，尽管您也可以利用迁移工具包提供的 Ant 构建脚本通过 `sf:retrieve` Ant 任务来完成。我将在本章稍后介绍我如何执行此操作。\n\
  \n- 7. 一旦文件从开发者组织同步完成，开发人员可以使用标准的源代码控制提交流程来审查其更改并将更改提交到源代码控制服务器（Git 要求开发人员先提交到其本地仓库）。我们将为此使用\
  \ GitHub GUI。在本章稍后，我们将看到如何使用此操作自动触发构建，以确认开发人员更改与源代码控制当前状态的集成未造成任何损坏，方法是自动执行所有 Apex\
  \ 单元测试。\n\n> 更高级的开发流程还可以利用持续集成在预验证提交后，最终允许开发人员更改（针对所谓的功能分支所做的更改）与主分支进行传播或合并。这种高级流程之一被称为\
  \ **GitFlow**，描述了代码从开发/功能分支流向发布分支的分阶段处理过程。通过 Google 搜索此术语，阅读有关这种更高级开发流程的更多信息。\n\n\
  请注意，只有在第 4 步之后，开发人员才能真正开始高效工作，因此值得定期与开发人员确认开发流程的这一部分对他们是否运行良好。同样，第 5 步是他们花费大部分时间的地方。请尽可能让开发人员有自由选择使其各自最高效的工具，但仍需在商定开发流程的范围内工作。\n\
  \n调试仍然是在 Force.com 上开发中最耗时的方面之一。请确保所有开发人员都完全掌握 Salesforce 以及您选择的 IDE 环境提供的所有最新工具和方法。有效利用调试日志过滤器也可以节省大量时间来浏览大型调试日志，因为调试日志限制为\
  \ 2 MB。通常，开发人员会求助于 System.debug 以获取所需的洞察。请确保在安全审查之前删除这些内容。尽管真实的支持性调试条目可以讨论和允许（建议您使用适当的调试级别），但临时性调试条目无论如何都应作为一般做法的一部分被删除。Salesforce\
  \ 的交互式 Apex 调试器可通过 Force.com IDE 使用 Eclipse 调试器 UI 获得。这可以通过与 Salesforce 就某些组织进行对话来启用。\n\
  \n## 使用源代码控制进行开发\n\n既然我们对一般开发流程有了更多了解，让我们深入探讨一下可以使用的一些工具和方法。\n\n在此示例中，我们将使用以下工具来填充和管理我们选择的源代码控制仓库（在此例中为\
  \ Git）的内容。为了提供一种便捷的方式来探索更分布式解决方案的优势，我们将使用 GitHub 作为 Git 的托管实例（还有其他可用选项，包括更广泛的开发流程功能）：\n\
  \n- **GitHub**: 确保您拥有 GitHub 账户。公共账户是免费的，但您也可以出于本章目的使用私有账户。从 `https://desktop.github.com/`\
  \ 下载出色的 GitHub GUI。本章将使用 Mac 版，但这并不意味着无法在 Windows 版中找到并执行等效操作；两个客户端都非常易于使用！\n\n\
  - **Apache Ant v1.9 或更高版本**: 要确定是否已安装此工具；在终端提示符处键入 `ant -version` 以进行确认。如果未安装，可以从\
  \ `http://ant.apache.org/` 下载。\n\n- **Force.com 迁移工具包**: 可从 `https://developer.salesforce.com/page/Tools`\
  \ 下载。README 文件中的说明建议将 `ant-salesforce.jar` 文件复制到 Apache Ant 安装文件夹中。我不建议这样做，而是更倾向于将此类构建工具存储在源代码中的\
  \ `/lib` 文件夹内。这样可以让所有开发人员以无缝方式更轻松地升级，而无需每次都执行下载。\n\n- Force.com IDE: Force.com IDE\
  \ 是由 Salesforce 运行的开源项目。它会定期获得更新和改进，例如支持开发 Lightning 组件以及唯一的交互式 Apex 调试器（如需访问权限，请联系您的\
  \ Salesforce 联系人）。有关更多信息和下载说明，请访问 https://developer.salesforce.com/page/Force.com_IDE。\n\
  \n## 填充您的源代码控制仓库\n\n填充源代码控制仓库时的一个关键决策是文件夹结构。\n\n下表显示了一个您可以考虑的结构：\n\n| 文件夹 | 用途 |\n\
  | :--- | :--- |\n| / | 尽可能保持根目录内容整洁，通常此处唯一的文件是 Ant build.xml 文件。您可能还会有一个 README.md\
  \ 文件，这是提供重要用法和文档链接的常见 Git 约定。这是一个简单的文本文件，使用简单的记号语法（称为 Markdown）来表示章节、粗体、斜体等。 |\n\
  | /lib | 此文件夹包含运行 Ant 构建脚本所需的任何二进制文件、配置文件或脚本文件，这些文件代表构建工具和依赖项，通常放在根目录中。这是一个可选文件夹，但在本章中用于存储\
  \ ant-salesforce.jar 文件，而不是让开发人员自行安装。 |\n| /src | 此文件夹包含 Force.com 源文件，其结构与 Ant\
  \ sf:retrieve 任务返回的文件夹结构以及 Force.com IDE 等 IDE 所期望的结构保持一致。 |\n| /source（备选） | 请注意，如果您的应用程序包含来自其他平台的其他源代码控制工件，您可能需要考虑设立一个更通用的\
  \ /source 文件夹，允许使用 /source/salesforce/src 然后 /source/heroku 等路径。 |\n\n如果您希望按照本章中的步骤进行操作，请基于\
  \ chapter-12 分支中包含的源代码进行。如果您希望直接查看最终结果，请跳转到示例代码仓库中的 chapter-13 分支，以审查 build.xml\
  \ 和 package.xml 文件。\n\n\n\n\n执行以下步骤以创建新仓库并将其克隆，从而在计算机上创建本地仓库并用初始内容填充它：\n\n- 1. 从\
  \ Web 浏览器登录到您的 GitHub 帐户，并从用户旁边的下拉菜单中选择创建新仓库的选项。同时选择创建默认 README 文件的选项。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_465_0.png)\n\
  \n> 如果您计划在本章后面尝试持续集成步骤，那么就当前配置而言，最简单的选项是创建公共仓库。关于如何配置 Jenkins 与 GitHub 身份验证的深入演示超出了本章的范围。\n\
  \n- 2. 从 Web 浏览器中新仓库的项目页面，找到页面右下侧边栏底部的“克隆或下载”按钮。点击其上的“在桌面打开”按钮以打开 GitHub 桌面客户端并开始克隆仓库，或者手动打开\
  \ GitHub 桌面客户端并选择“克隆到计算机”选项。\n- 3. 前述克隆过程应已提示您在硬盘上选择存储本地仓库的位置。请记下此位置，因为我们将在后续步骤中填充此位置。\n\
  - 4. 在仓库文件夹的根目录下创建 /lib 文件夹。\n- 5. 将本章示例代码文件夹 /lib 中的以下文件复制到前一步创建的新 /lib 文件夹中：\n\
  \  - 复制 ant-salesforce.jar 文件\n  - 复制 ant-salesforce.xml 文件\n  - 复制 ant-contrib-1.0b3.jar\
  \ 文件\n- 6. 在仓库文件夹的根目录下创建 /src 文件夹。\n- 7. 将您在之前章节中使用的 build.xml 文件复制到仓库文件夹的根目录中。\n\
  \n在本章中，我们将更新 Ant build.xml 脚本文件，以便在需要时将应用程序源代码部署到新的开发者版 org。在此之前，我们将使用 salesforce-ant.jar\
  \ 文件提供的 Ant sf:retrieve 任务，以组件源文件的形式检索迄今您一直在开发的 FormulaForce 包的最新内容，我们将把这些内容迁移到源代码控制中。\n\
  \n> 请注意，我们执行此步骤是由于本书所采用的方法，即从打包 org 开始进行开发。如果您不是从这一点开始，则可以按手动描述创建 /src 文件夹和 package.xml\
  \ 文件。话虽如此，您可能希望在打包 org 内进行一些初步探索，以建立带有某些初始对象的包和命名空间。\n\n以下 build.xml 目标检索打包 org\
  \ 中定义的包的内容并填充 /src 文件夹。请确保您的包名称为 FormulaForce。如果不是，请按如下方式更新 packageNames 属性：\n\n\
  ```\n<target name=\"retrieve.package\">\n    <sf:retrieve\n        username=\"${sf.username}\"\
  \n        password=\"${sf.password}\"\n        retrieveTarget=\"${basedir}/src\"\
  \n        packageNames=\"FormulaForce\"/>\n</target>\n```\n\n> 您可以在登录打包 org 时，看到\
  \ Salesforce 页面标头右上角黑色横幅中显示的包名称。\n\n使用您自己的用户名、密码和令牌执行以下命令（全部在一行命令行上）以执行检索目标。首先确保已将位置更改为本地仓库的根文件夹：\n\
  \n```\nant retrieve.package\n  -Dsf.username=yourusername\n  -Dsf.password=yourpasswordyourtoken\n\
  ```\n\n您应该在本地仓库文件夹中看到类似下面的内容：\n\n| 文件夹 | 文件夹 | 文档 |\n|---|---|---|\n| src | applications\
  \ | Application.cls |\n| bin | classes | Application.cls-meta.xml |\n| .git | labels\
  \ | Cars.cls |\n| | layouts | Cars.cls-meta.xml |\n| | objects | CarsSelector.cls\
  \ |\n| | pages | CarsSelector.cls-meta.xml |\n| | permissionsets | ComplianceController.cls\
  \ |\n| | quickActions | Compliance...-ls-meta.xml |\n| | tabs | ComplianceService.cls\
  \ |\n| | triggers | Compliance...-ls-meta.xml |\n| Documents | Documents | ComplianceServiceTest.cls\
  \ |\n| build.xml | package.xml | ContestantController.cls |\n| README.md | | ContestantC...-ls-meta.xml\
  \ |\n\n> 您可能会在检索的代码和元数据文件中找到对包命名空间的引用。应将其删除，否则文件可能无法在非托管开发者 org 中部署或执行。您可以使用文件搜索实用程序查找此类引用。例如，打开\
  \ /layouts/Contestant__c-Contestant Layout.layout 文件并搜索 QuickActionName，然后删除命名空间引用。\n\
  \n在准备将此内容提交到本地仓库（在您可以上传或推送到 GitHub 远程仓库之前必需）之前，打开由检索操作创建的 package.xml 文件并将其转换为更通用的形式。前一过程创建的文件包含包中每个组件的显式列表。\n\
  \n这意味着，如果开发人员在 /classes、/pages 和 /objects 等子文件夹中添加新组件文件，则除非先更新 package.xml 文件，否则这些文件不会随后自动部署。\n\
  \n为避免开发人员需要记住执行此操作，可以将 package.xml 文件更新为使用通配符。例如，打开 package.xml 文件并用通配符字符替换显式引用，如以下示例所示：\n\
  \n```\n<types>\n    <members>*</members>\n    <name>ApexClass</name>\n</types>\n\
  <types>\n    <members>*</members>\n    <name>ApexPage</name>\n</types>\n```\n\n\
  ```\n<types>\n<members>*</members>\n<name>ApexTrigger</name>\n</types>\n```\n\n\
  还要从 package.xml 文件中删除 fullName、apiAccessLevel 和 namespacePrefix 标记。对 package.xml\
  \ 文件中的大多数组件类型重复上述方法，而不仅仅是前面示例中所示的那些，但 **子组件** 除外。\n\n如果将前面的示例与之前创建的 package.xml\
  \ 文件进行比较，您会注意到原始 package.xml 文件中的某些组件是 CustomObject 组件的子组件，例如 FieldSet、WebLink、CustomField\
  \ 和 ListView。此外，不需要多个 CustomLabel 条目。因此，它们根本不需要通配符条目，因为它们将通过其父文件部署，例如，通过包含字段的 CustomObject\
  \ 组件的 .object 文件。\n\n请注意，FormulaForce 包中实际包含的组件列表仍位于打包 org 中。package.xml 文件在源代码控制中的作用和目的不同，并且更针对开发者\
  \ org 部署进行了优化。\n\n最后，使用 GitHub UI 工具将前面的更改提交并同步到本地仓库，并上传或推送（使用正确的 Git 术语）。如果您运行该工具，应该会看到它已经在报告硬盘上的仓库文件夹中检测到新文件，如以下\
  \ Mac 版工具屏幕截图所示。只需输入摘要和说明，然后单击 **提交并同步**。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_468_0.png)\n\
  \n请注意，这将在一个操作中同时提交到本地仓库并推送到远程仓库。通常，开发人员会处理一组更改，并在决定将所有更改作为一个操作推送到远程仓库之前，本地增量式提交。\n\
  \n> 如果您不熟悉 Git，这可能有点令人困惑，因为您已经在仓库文件夹中实际复制或更新了文件。但是，为了将更改推送到存储在 GitHub 服务器上的远程 Git\
  \ 仓库，您必须先更新 .git 文件夹中保存的仓库状态的本地副本，.git 文件夹是仓库文件夹根目录下的隐藏文件夹。您绝不应编辑或查看此文件夹，因为它完全由\
  \ Git 管理。\n\n## 用于清理和构建应用程序的 Ant 构建脚本\n\n现在，我们已为应用程序创建了初始源代码控制内容，让我们将其部署到开发者 org。在此之前，我们将更新\
  \ build.xml 文件以清理 org（以防它已用于开发应用程序的早期版本）。\n\nSalesforce 不提供用于完全清理开发者 org 中先前部署或创建的任何组件的\
  \ Ant 任务。但是，它确实通过其 Force.com 迁移工具包提供了一种方式来部署所谓的 destructivePackage.xml 文件，该文件包含要删除的组件列表。不幸的是，当\
  \ org 中存在组件依赖项时，这需要一些帮助。FinancialForce.com 已通过 undeploy.xml Ant 脚本提供了一个开源解决方案，该脚本封装了此过程并解决了依赖项不足的问题。\n\
  \n从 FinancialForce.com 存储库（https://github.com/financialforcedev/df12-deployment-tools）的\
  \ /lib 文件夹下载以下文件，并将它们与 ant-salesforce.jar 文件一起放入之前创建的 /lib 文件夹中：\n\n- exec_anon.xml\n\
  - undeploy.xml\n- xmltask.jar\n- ml-ant-http-1.1.3.jar\n- ant-contrib-1.0b3.jar\n\
  \n\n\n\n\n接下来，Ant 脚本通过执行现有的 `deploy` 目标（用于部署前几章中的示例源代码）进行了更新。然后，通过将前面的任务导入构建文件中，`undeploy`\
  \ 目标将作为 `deploy` 目标的依赖目标可用，这意味着它会在执行该目标之前被调用。以下示例构建脚本突出了这些更改：\n\n```xml\n<project\
  \ name=\"FormulaForce\"\n  xmlns:sf=\"antlib.com.salesforce\" default=\"deploy\"\
  >\n  <property name=\"sf.server\"\n    value=\"https://login.salesforce.com\"/>\n\
  \  <import file=\"${basedir}/lib/exec_anon.xml\"/>\n  <import file=\"${basedir}/lib/undeploy.xml\"\
  />\n\n  <target name=\"deploy\" depends=\"undeploy\">\n    <sf:deploy\n      username=\"\
  ${sf.username}\"\n      password=\"${sf.password}\"\n      serverurl=\"${sf.server}\"\
  \n      RunAllTests=\"true\"\n      deployRoot=\"${basedir}/src\"/>\n  </target>\n\
  </project>\n```\n\n执行以下命令（全部在一行命令中）以运行前面的脚本（确保使用您的开发者组织用户名、密码和令牌）：\n\n```bash\n\
  ant\n-Dsf.username=yourdevusername\n-Dsf.password=yourdevpasswordyourdevtoken\n\
  ```\n\n> 由于正在执行的 `undeploy` 目标比较复杂，似乎会向控制台输出相当多的消息。几分钟后，它将开始执行 `deploy` 目标。一旦收到整个脚本已成功完成的确认，您可以通过登录到该组织来确认应用程序已部署。\n\
  \n一旦您确信 `build.xml` 文件工作正常，请返回到 GitHub UI 应用程序，并像之前一样，使用 **提交并同步** 按钮提交您的更改并推送到\
  \ GitHub 服务器的远程仓库。\n\n恭喜！您现在已经离开了家（打包组织）并搬到了您自己的全新开发者组织中。这也意味着您现在可以允许其他开发人员通过使用他们自己的开发者组织来遵循相同的开发流程，从而独立地开始在您的代码库上工作。\n\
  \n> Salesforce 不会自动授予使用迁移工具部署的应用程序、选项卡、页面、对象和字段的访问权限。因此，您会发现，在查看这些组件之前，您需要将权限集分配给开发者组织用户。这样做是确保这些组件随新组件保持最新且有效的好方法。一般来说，以系统管理员身份进行测试并不能可靠地确认您的应用程序在最终用户场景中正常工作。Salesforce\
  \ 之所以采用此政策，正是为了让开发人员考虑需要应用哪些权限，即使是在开发者组织中也是如此。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_471_0.png)\n\
  \n## 在开发者组织中开发与在打包组织中开发\n\n既然您已离开打包组织并进入开发者组织，您将不再在其提供的相关命名空间上下文中开发或执行代码。如果您回想一下关于执行上下文的章节，请记住，在打包组织中执行的\
  \ Apex 代码的调试日志引用了两个命名空间：打包组织命名空间和默认命名空间。虽然在打包组织中所有内容都会隐式在此命名空间中运行，但默认命名空间中永远不会运行任何内容。\n\
  \n如您所注意到的，在打包组织中编写 Apex 代码时，您不需要像在安装了您包的订阅者组织中那样，为自定义对象或字段加上该命名空间前缀。相反，在打包组织中，这整体上是隐式完成的，这使得导出到源代码控制更加容易，因为目标开发者组织环境中未分配命名空间（因为它只能分配一次）。\n\
  \n在开发者组织中开发和执行代码时，所有内容都在默认命名空间中运行。在开发者组织中开发时，请记住以下差异：\n\n- Apex 功能（例如 @deprecated\
  \ 注解和 Version 类）可帮助实现应用程序 Apex API，但这些功能在打包组织外不受支持，会导致开发者组织中出现编译失败。这里的主要缺点是无法按需使用\
  \ @deprecated 属性来停用旧的 Apex API。我不建议使用 Version 类进行行为版本控制，原因如第 9 章“提供集成和可扩展性”中所述。\n\
  \n- 利用动态 Apex 创建和填充 SObject 实例和字段的 Apex 测试，将需要通过自动感应动态应用命名空间前缀，无论 Apex 测试是否在命名空间上下文中运行。以下代码片段是确定代码是否在命名空间上下文中运行的好方法。您可以将其放在测试工具类中：\n\
  \n```\nDescribeSObjectResult seasonDescribe =\n  Season__c.SObjectType.getDescribe();\n\
  String namespace =\n  seasonDescribe.getName()\n  .removeEnd(seasonDescribe.getLocalName())\n\
  \  .removeEnd('__');\n```\n\n- 利用 Type.forName 创建 Apex 类实例的 Apex 测试（例如，为应用程序插件功能编写的测试）也需要将命名空间前缀动态应用于提供给插件配置的类名（例如，第\
  \ 9 章“提供集成和可扩展性”中介绍的自定义元数据类型）。\n\n本章后面我们将讨论持续集成。该过程将自动在打包组织中执行测试部署和 Apex 测试执行，从而继续确保您的测试在命名空间上下文中成功运行。\n\
  \n## 从 Ant 利用 Metadata API 和 Tooling APIs\n\n迁移工具包实际上用一些方便的 Ant 任务封装了 Metadata API，我们一直在前面的\
  \ Ant 脚本中使用这些任务。该工具包本身是用 Java 编写的，并符合 Ant 框架所需的必要接口和基类，以允许表示任务的 XML 元素（例如 sf:retrieve\
  \ 和 sf:deploy 任务）被注入到构建脚本中。\n\n虽然您可以采用与 Salesforce 相同的方法来开发自己的 Ant 任务，以处理与您的应用程序相关的更多自定义任务以及/或设置或部署期间的常见任务自动化，但要做到这一点，您需要是\
  \ Java 程序员。作为替代方案，并添加一些支持 Ant 任务（那些复制到您的 /lib 文件夹中），您实际上可以直接从 Ant 脚本语言调用这些 API。\n\
  \n在前一章中，我们了解了如何编写 Ant 宏来调用 Metadata API 的包安装和卸载功能，这无需 Java 代码即可实现。如果您正在开发扩展另一个包的应用程序，Ant\
  \ 的此功能非常有用，因为您可以通过扩展我们之前运行的部署脚本，轻松在部署之前自动安装/升级包。\n\n之前导入到 build.xml 文件中的 FinancialForce.com\
  \ 的开源 exec_anon.xml 文件实际上包含一个 Ant 宏，该宏利用 Tooling API 能够匿名调用 Apex 代码，类似于 Force.com\
  \ IDE 和开发者控制台工具提供的功能。\n\n在前几章中，我们利用 SeasonService.createTestSeason 方法在应用程序的自定义对象中创建测试记录数据。使用\
  \ Ant executeApex 任务，现在可以从 Ant 脚本调用该方法，以便在开发者组织中自动创建一些有用的数据。这种方法将帮助开发人员、测试人员或业务分析人员轻松试用或演示最新构建中的新功能，手动数据设置如下：\n\
  \n```\n<target name=\"deploy\" depends=\"undeploy\">\n<sf:deploy\n    username=\"\
  ${sf.username}\"\n    password=\"${sf.password}\"\n    serverurl=\"${sf.server}\"\
  \n    deployRoot=\"${basedir}/src\"/>\n<executeApex\n    username=\"${sf.username}\"\
  \n    password=\"${sf.password}\">\nSeasonService.createTestSeason();\n</executeApex>\n\
  </target>\n```\n\n\n\n\n\n## 更新您的源代码控制仓库\n\n一旦应用程序部署到开发者组织中，在随后在 Force.com 上进行开发时，您有多种选项和工具可供选择。您的选择将影响您的更改如何返回到源代码控制仓库。确保开发团队中的每个人都对开发工作流的这一方面心中有数，不仅关系到他们的效率，还有助于防止工作丢失或流氓文件进入源代码控制。\n\
  \n像“设置”菜单和架构构建器这样的基于浏览器的工具，比基于 XML 的格式更容易编辑自定义对象、字段、页面布局和权限集。然而，对于开发的其他方面，基于浏览器的开发者控制台在编辑\
  \ Apex 和 Visualforce 代码时并非人人都喜欢。我个人更喜欢使用 Force.com IDE 等桌面工具来编辑这类文件。\n\n您可以独占或组合使用基于浏览器或桌面的方法。重要的是要记住，哪种方法会自动将本地仓库文件与组织保持同步，哪种方法不会。\n\
  \n- **基于浏览器的开发**：您通过基于浏览器的工具（包括开发者控制台）所做的任何更改都将保留在开发者组织中，不会自动进入本地仓库文件夹，因此，它们对 Git\
  \ 工具不可见，您无法将其提交到源代码控制。\n\n- **基于桌面的开发**：如果您使用 Force.com IDE 等桌面工具，并将其映射到仓库的本地文件夹位置，您在此处所做的编辑将通过此类工具在本地仓库文件夹和开发者组织之间自动同步。\n\
  \n- **基于浏览器和桌面的开发**：此选项允许开发者充分利用手头的工具，但代价是增加了一些复杂性，并且在收集所有更改以提交到源代码控制时需要额外考虑。\n\n\
  ## 基于浏览器的开发和源代码控制\n\n要下载使用基于浏览器的开发工具所做的更改到本地仓库文件夹，可以再次使用 Ant 脚本和迁移工具包，采用与之前使用 sf:retrieve\
  \ Ant 任务从打包组织下载包内容时类似的方法。\n\n以下 Ant 脚本将根据 package.xml 文件中列出的组件类型刷新 /src 文件夹的内容（同样，随着您使用新平台功能，可能需要不时将新组件类型添加到此文件中）：\n\
  \n```\n<target name=\"retrieve\">\n<sf:retrieve\nusername=\"${sf.username}\"\npassword=\"\
  ${sf.password}\"\nserverurl=\"${sf.server}\"\nretrieveTarget=\"${basedir}/src\"\n\
  unpackaged=\"${basedir}/src/package.xml\"/>\n</target>\n```\n\n要运行前述目标，请使用以下命令（全部在一行命令行中）：\n\
  \n```\nant retrieve\n-Dsf.username=yourdevusername\n-Dsf.password=yourdevpasswordyourdevtoken\n\
  ```\n\n命令完成后，您可以使用 Git 工具审查更改的文件，并相应地接受、忽略或丢弃（恢复到上次提交的版本）。以下是您可能遇到的这种方法的一些用例以及处理它们的方式：\n\
  \n- **下载的其他文件**：如前所述，package.xml 文件中使用了通配符，以便更轻松地添加和删除文件。缺点是，对于某些组件（如应用程序和页面布局），您可能会发现这些组件的一些标准文件也会在仓库文件夹中创建。一个解决方案是不再为这些元数据类型使用通配符，另一个是利用\
  \ .gitignore 文件防止这些文件成为提交候选项。使用 GitHub UI 工具，您可以右键单击这些文件并选择“忽略”。如果 .gitignore 文件不存在，这将创建一个\
  \ .gitignore 文件并将相应文件添加到其中。由于此文件也会提交到仓库，因此您只需执行一次此操作。\n\n- **文件内容顺序差异或其他元素**：有时，当您未直接在基于浏览器的工具中修改相应组件时，Git\
  \ 工具也会标记文件更改。这可能发生在平台升级后出现新功能或进行组织范围的配置更改（例如启用多货币支持）时，或者在 XML 元素的顺序发生变化但对对象的整体效果相同时也会发生。如果您经常遇到这些更改，并且它们导致您乐于接受的更改，那么起初接受它们以减少未来出现的虚假差异可能很诱人。但是，不要让此类基于浏览器的开发差异得不到解释，根本原因可能非常重要！开发者之间使用不同的组织类型或组织模板也可能导致此类问题。确保所有开发者都从同一个注册页面获取他们的开发者组织，并且组织类型相同。\n\
  \n## 基于桌面的开发和源代码控制\n\n使用基于桌面的工具和源代码控制的主要好处是，它们允许您编辑 Force.com 源文件，同时与源代码控制和附加的 Salesforce\
  \ 开发者版组织进行同步。在 Force.com IDE 中，默认情况下不会在每次保存文件时自动上传到附加的开发者组织，请右键单击“包资源管理器”中的项目节点，并在\
  \ Force.com 子菜单下选择 **Work Online**。只要这些工具正在编辑来自本地仓库文件夹位置的文件，文件编辑就会自动被源代码控制系统（在本例中为\
  \ Git）看到。\n\n- Force.com IDE 提供了一种轻松将 Git 仓库文件夹与项目关联的方法。只需打开 Force.com IDE，从 **File**\
  \ 菜单中选择 **Import...**，从导入向导列表中选择 **Projects from Git**，然后单击 Next。\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_476_0.png)\n\
  \n选择 **Existing local repository**，如果未显示您的仓库，请单击 **Add** 并导航到先前用于下载 GitHub 仓库的文件夹。最后，使用新项目向导单击\
  \ **Import**，然后单击 **Finish**：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_477_0.png)\n\
  \n为您的项目指定一个合适的名称并单击 **Finish**。此项目现在已连接到您的本地 Git 仓库。如果您已安装 eGIT 插件，Eclipse IDE 内置了对\
  \ Git 的支持，因此您可以选择使用 GitHub 桌面工具，或继续在 Eclipse 中操作。\n\n要将项目与 Salesforce 连接，您需要向项目添加\
  \ **Force.com IDE** 功能。右键单击 **Package Explorer** 中的项目，然后在 **Force.com** 子菜单下选择 **Add\
  \ Force.com Nature** 选项。您将看到一条提醒您需要提供连接详细信息以完成连接的提示：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_477_1.png)\n\
  \n再次右键单击 Package Explorer 中的项目，然后在 Force.com 子菜单下选择 Project Properties 选项。使用本章前面部署到的开发者版组织完成登录详细信息，然后单击\
  \ Apply。\n\n> 单击 Apply 后，系统可能会询问您是否要重新获取并覆盖项目中的所有 Force.com 组件。请选择 No。这是因为项目文件夹已包含源代码，并且您使用的组织是从相同的文件夹内容填充的，向导无需下载。\n\
  \nForce.com IDE 项目向导会在仓库根文件夹中创建 /.settings 文件夹、/Referenced Packages 文件夹以及 .project\
  \ 和 salesforce.schema 文件。您可以使用 .gitignore 功能将这些文件从源代码控制可见性中省略，除非您的团队所有人都使用 Force.com\
  \ IDE。此屏幕截图显示了创建后项目的外观，使您可以立即开始编辑 Apex 代码：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_478_0.png)\n\
  \n\n\n\n你还可以编辑表示自定义对象和字段的文件：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_479_0.png)\n\
  \n如果你选择将这种开发方法与基于浏览器的方法相结合，Force.com IDE 提供了一种从桌面工具内部刷新文件的方法。只需右键单击文件夹并选择相应选项即可。此功能实际上执行的检索操作与前面部分通过\
  \ Ant `build.xml` 脚本描述的操作类似。因此，请注意在附加文件或文件更改方面可能出现类似的副作用。\n\n## 连接持续集成\n\n到目前为止，我们一直依赖开发人员，确保他们推送到\
  \ GitHub 远程仓库的更改不会在应用程序的其他地方造成回归，方法是在提交前运行 Apex 测试。这始终是一种良好的做法！\n\n然而，这并不总是确定代码质量的完全可靠手段，因为由于其他开发人员也在推送他们的更改，主代码库可能已经发生了变化。当集成在一起时，它们可能导致测试甚至代码无法编译。持续集成会监控源代码控制仓库的更改，并自动在完全集成的源代码库上启动其自身构建。失败会报告给最后向仓库推送代码的开发人员。\n\
  \n在本章的这一部分，我们将使用流行的 Jenkins 持续集成服务器来探索这一过程，该服务器使用 Ant 脚本执行构建步骤。在开始设置之前，让我们花点时间回顾一下我们将要使用的\
  \ CI 过程。\n\n### 持续集成过程\n\n下图显示了我们将在接下来的几个部分中设置的 CI 过程。一旦有了像这样的基本 CI 设置，你就可以开始添加其他功能，例如代码文档生成、静态代码分析、安全代码扫描器和自动化回归测试（我们稍后将简要讨论）。\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_480_0.png)\n\n以下是 CI 过程：\n\n- 1. 开发人员对源代码控制进行多次提交，就像我们在本章前面通过\
  \ GitHub UI 桌面客户端所做的那样。\n- 2. CI 服务器可以（可配置）轮询源代码控制服务器（在本例中为 GitHub 远程仓库）以检测更改。\n\
  - 3. 一旦检测到更改，它就会将最新源代码下载到本地工作区文件夹中。\n- 4. CI 服务器配置的一部分是告知其 Ant `build.xml` 脚本的位置，以便在工作区设置好后执行。\n\
  - 5. 构建组织（build org）只是一个专门指定用于 CI 过程的开发组织。我们将稍后为此目的创建一个，不过，使用 Salesforce DX 时，可以动态创建和删除临时组织。与部署过程类似，相同的\
  \ Ant 脚本用于将代码部署到构建组织（从而确认代码编译）并运行 Apex 测试。\n- 6. 如前所述，开发组织用于开发非托管环境（而非托管环境）中的更改。一些通常适用的约束，例如更改之前发布的\
  \ `global` Apex 类的能力，不被强制执行。在此步骤中，会针对打包组织执行验证性仅检查部署，以确认代码在需要时仍可部署到打包组织以供发布。此步骤还有助于验证代码和测试是否继续在托管命名空间上下文中执行。此部署仅为检查，无论结果如何，都不会对打包组织进行任何更改。\n\
  - 7. 最后，CI 服务器将记录构建的日志和结果以供分析，记录成功构建与失败构建的数量，并提供关于源代码控制中源代码整体健康状况的报告和通知。如果存在失败，可以选择向特定团队成员以及特定目标（最近进行更改的人）发送电子邮件。确保团队停止手头工作并处理损坏的构建非常重要。损坏的构建存在的时间越长，就越难解决，尤其是在发生进一步更改时。\n\
  \n## 为持续集成更新 Ant 构建脚本\n\n在设置 CI 服务器之前，我们需要确保 Ant 脚本为其提供了合适的入口点。这与前面步骤中开发人员使用的类似。以下是专为\
  \ CI 服务器设计的入口点目标。更复杂的脚本可能涉及开发人员用法和 CI 用法之间的某些复用。\n\n以下目标将清理构建组织（因为依赖于 `undeploy`\
  \ 目标），然后将其部署到构建组织。随后将执行第二次部署，以对打包组织执行仅检查部署。如果你在跟进，请将更改提交到 `build.xml` 文件，以便 Jenkins\
  \ 服务器在从 GitHub 下载最新源代码时可以看到新目标。\n\n```\n<target name=\"deploy.jenkins\" depends=\"\
  undeploy\">\n  <sf:deploy\n    username=\"${sf.username}\"\n    password=\"${sf.password}\"\
  \n    serverurl=\"${sf.server}\"\n    runAllTests=\"true\"\n    deployRoot=\"${basedir}/src\"\
  />\n  <sf:deploy\n    username=\"${sf.package.username}\"\n    password=\"${sf.package.password}\"\
  \n    serverurl=\"${sf.server}\"\n    checkOnly=\"true\"\n    runAllTests=\"true\"\
  \n    deployRoot=\"${basedir}/src\"/>\n</target>\n```\n\n## 安装、配置和测试 Jenkins 持续集成服务器\n\
  \n设置 Jenkins 服务器是一个超出本章范围的广泛话题。不过，开始使用的一个好方法是访问 http://jenkins-ci.org/ 并下载适用于你操作系统的预构建安装包之一。在此示例中，我下载了\
  \ Mac pkg 文件。安装后，我可以导航到 http://localhost:8080，发现 Jenkins 正在等待我！\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_482_0.png)\n\
  \nJenkins 具有插件系统，允许对其基本功能进行许多自定义扩展，只需单击管理 Jenkins，然后单击管理插件以查找 GitHub 插件：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_482_1.png)\n\
  \n安装此插件后，你可以创建一个指向 GitHub 仓库和 Ant 脚本的 Jenkins 作业，以执行前面定义的 `deploy.jenkins` 目标。在\
  \ Jenkins 主页面上，单击 **新建项目** 并选择 **构建一个自由风格的软件项目** 选项。完成以下步骤以创建构建项目：\n\n- 1. 使用适当的名称完成\
  \ **项目名称** 字段，例如 `FormulaForce Build`。\n- 2. 在 **GitHub 项目** 字段中，输入你 GitHub 仓库的完整\
  \ URL，例如 `https://github.com/afawcett/formulaforce-chapter13`。\n- 3. 在 **源代码管理**\
  \ 部分下，选择 **Git**。\n- 4. 在 **仓库 URL** 字段中，输入你的 GitHub 仓库 URL，它与前述 URL 不同，格式为 `https://github.com:githubuser/repositoryname.git`，例如\
  \ `https://github.com:afawcett/formulaforce-chapter13.git`。\n- 5. 如果你的仓库是私有而非公共的，则需要确保在\
  \ Jenkins 和你的 GitHub 账户之间交换了部署密钥。这涉及生成一个密钥并将其复制粘贴到 GitHub 仓库设置的 **部署密钥** 部分中。出于本书的目的，建议你使用公共\
  \ GitHub 仓库。\n- 6. 虽然不建议在生产 Jenkins 服务器上这样做，但让我们将其设置为每分钟轮询一次仓库更改。在 **生成触发器** 部分，选择\
  \ **轮询 SCM** 并在 **计划** 字段中输入 `*/1 * * * *`。\n- 7. 向下滚动项目设置页面至 **生成** 部分，并从 **添加生成步骤**\
  \ 下拉菜单中选择 **调用 Ant**。\n- 8. 在 **目标** 字段中，输入 `deploy.jenkins`（与在 `build.xml` 文件中创建的\
  \ Ant 目标名称一致）。\n- 9. 单击 **高级** 按钮，然后单击 **属性** 字段右侧的黑色向下箭头图标以展开它，这样你就可以输入多个属性。我们先前创建的\
  \ `deploy.jenkins` Ant 目标需要 `username` 和 `password` 参数来部署到构建组织并执行针对打包组织的检查部署。按如下方式在单独行上输入属性名称-值对：\n\
  \n```\nsf.username=buildorgusername\nsf.password=buildorgpasswordbuildorgtoken\n\
  sf.package.username=packagingorgusername\nsf.package.password=packagingorgpasswordpackagingorgtoken\n\
  ```\n\n- 10. 单击页面底部的 **保存** 按钮。\n\n\n\n\n\n一分钟后，Jenkins 发现还没有构建并开始构建。但是，如果你等不及，也可以单击项目，然后单击\
  \ **立即构建** 按钮！\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_484_0.png)\n\n如果单击构建本身的超链接（在侧边栏中显示），您可以实时监控\
  \ Ant 脚本日志，就像手动运行它一样：\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_484_1.png)\n\n\
  此构建完成后，Jenkins 将恢复监控 GitHub 仓库的更改，并在检测到更改时自动启动新构建。\n\n## 进一步探索 Jenkins 和 CI\n\n\
  本节仅浅尝辄止地介绍了使用 Jenkins 和 Ant 脚本可以实现的功能。您可以扩展 Ant 脚本，如前所述执行其他检查，甚至编写自定义逻辑以将统计信息写回到您自己的\
  \ Salesforce 生产环境。通过对仓库进行一些小更改和一些大更改，继续进一步探索此过程，以查看效果。\n\n例如，尝试更改某个全局 Apex 方法的方法名（例如，将\
  \ ComplianceService.report 改为 ComplianceService.reportX），以及 ComplianceResource 和\
  \ ComplianceResource_1_0 中调用它的方法。虽然这在开发者组织和构建组织中可以编译，但最终会导致 Jenkins 构建出现以下错误，因为检查部署到打包组织失败，因为已发布的全局方法不能被删除或重命名。在这种情况下，Jenkins\
  \ 将报告以下构建失败：\n\n```\nclasses/ComplianceService.cls -- Error: Global/WebService identifiers\
  \ cannot be removed from managed application: Method: LIST<fforce>. ComplianceService.VerifyResult>\
  \ report(SET<Id>) (line 1, column 8)\n```\n\nJenkins 仪表板显示该项目有一个深色云图标，因为最近两次构建中有一次失败了。是时候修复构建了：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_485_0.png)\n\n一旦新构建成功完成，Jenkins 就会用一些阳光奖励您：\n\
  \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_485_1.png)\n\n## 从源代码控制发布\n\n当您准备好为应用程序发布\
  \ beta 版或正式版软件包时，将把源代码从源代码控制中转移到您的打包组织。幸运的是，这也可以借助以下 Ant 脚本目标来实现。请注意，与 deploy Ant\
  \ 目标不同，此目标不会尝试清理目标组织！\n\n```\n<target name=\"deploy.package\">\n    <sf:deploy\n\
  \        username=\"${sf.username}\"\n        password=\"${sf.password}\"\n    \
  \    serverurl=\"${sf.server}\"\n        runAllTests=\"true\"\n        deployRoot=\"\
  ${basedir}/src\"/>\n</target>\n```\n\n通过运行前述 Ant 目标，更新打包组织的过程只能部分实现自动化，因为您仍然需要登录到打包组织以添加那些通过与包中现有组件的关系而不会自动添加的全新组件。\n\
  \n以下是一组建议步骤，用于更新并确认打包组织的内容与源代码控制的内容匹配：\n\n- 1. 运行以下命令（全部在同一行命令行上）：\n  ```\n  ant\
  \ deploy.package\n  -Dsf.username=packagingusername\n  -Dsf.password=packagingpasswordpackagingtoken\n\
  \  ```\n- 2. 登录到打包组织并查看软件包的内容。您可以使用 **添加组件** 页面来确定是否存在目前未包含在软件包中但现在位于打包组织中的组件。\n\
  - 3. 将 /src 文件夹重命名为 /src.frommsc 并创建一个新的 /src 文件夹。然后，按照本章开头用于从打包组织下载文件的命令行，运行 retrieve.package\
  \ Ant 目标。\n- 4. 使用您喜欢的文件比较工具比较 /src 和 /src.frommsc 文件夹。查看差异，以确定打包组织或源代码控制系统中是否存在不属于正在打包的应用程序的更改！\n\
  - 5. 根据最佳实践，确认您的软件包依赖项仍然符合预期。然后，像前几章讨论的那样以常规方式执行上传。\n\n## 自动化回归测试\n\n虽然 Apex 测试是监控应用程序中回归问题的关键工具，但它们可以测试的功能限制和范围很小，尤其是用于执行大量或用户界面测试（例如使用\
  \ JavaScript 的客户端）时。\n\n> 您可能会好奇 Jenkins 使用的 Ant 脚本为何要部署两次，因为检查部署到打包组织将确认 Apex 代码是否编译以及所有\
  \ Apex 测试是否成功完成。原因是，构建组织使用最新构建进行部署后，可以继续用于其他目的，例如执行更多回归测试步骤。\n\n以下是实施更多测试方法时需要考虑的事项：\n\
  \n- 可以使用本章前面描述的方法，从 Ant 脚本中执行 Apex 代码，当时我们通过调用 SeasonService.createTestSeason 方法将示例数据填充到开发者组织中。您可以扩展此方法，在\
  \ Ant 中使用循环构造来创建大量数据或启动更多 Batch Apex 作业（Apex 测试只允许处理一次 200 条记录的单个批次），暂停等待完成，并断言结果。\n\
  - Salesforce 数据加载器实际上是一个带有命令行界面的 Java 程序。因此，您可以考虑使用它将数据加载到构建组织中，以便针对不同的数据集进行测试，并与前述用于在测试之间清理记录的\
  \ Apex 代码结合使用。\n- 一旦数据加载到构建组织中，您可以使用多种 Salesforce 测试工具来执行测试。例如，Selenium WebDriver\
  \ 工具是一个绝佳的选择，因为它提供无头模式（无需物理屏幕）且可以在多个操作系统上运行。此工具允许您测试包含大量 JavaScript 的 Visualforce\
  \ 页面（http://docs.seleniumhq.org/projects/webdriver/）。\n\n## 总结\n\n在本书的最后一章中，我们了解了如何使用工业级源代码控制工具、开发流程和\
  \ Jenkins 等服务器，将开发人员资源扩展到企业应用程序的开发中。\n\n本章中描述的某些步骤，与在单个打包组织中开发或使用其他手动方法在开发者组织之间导出和合并更改相比，起初可能显得过度且过于复杂。最终，手动解决冲突会浪费更多时间，更不用说丢失更改的风险增加了。\n\
  \n当然，如果您的业务旨在接受开发流程审计，那么采用更受控的方法，并对谁有权访问不仅源代码，还有发布机制（即您的打包组织）实施更严格的控制，是必不可少的。\n\n\
  例如，将您的 Force.com 开发流程开放给 Git 等工具，可以实现更好的开发人员交互，用于代码审查以及仔细暂存开发中的功能以供发布等方面。此类工具还能更深入地了解围绕您开发流程的统计信息，从而让您随时间进一步优化开发标准和生产力。\n"
