    # # Using Components on Lightning Pages and Tabs


    Lightning Pages (or FlexiPages) are essentially layouts created from a blank page
    with the Lightning App Builder tool. Thus you or your customers can drop the preceding
    components and any others on them to create a new page. Unlike Visualforce pages,
    they do not have a URL for accessing them. The only way to display a Lightning
    Page is to create a Lightning Tab for it. This can be accessed under Tabs under
    the Setup menu. Lightning Tabs work in Lightning Experience and Salesforce1 Mobile.


    > It is also possible to implement the force:appHostable for a component. This
    permits the creation of Lightning Component Tabs. This historic facility is not
    as flexible as using the Lightning App Builder to build Lightning Pages which
    allow the user to place multiple components on the page.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# # Lightning Out and Visualforce


    **Lightning Out** is a JavaScript library that can be imported into regular HTML
    pages, such as Visualforce pages and other websites or other containers such as
    Google Apps. Once imported it exposes an API that allows the page developer to
    instantiate a Lightning Component and inject it into a given HTML element on that
    page. The host page must provide a Salesforce Session or OAuth token to allow
    this to happen in a secure way.


    The process of using **Lightning Out for Visualforce** pages is simplified through
    the use of the `apex:includeLightning` component on the page which loads the JavaScript
    library and handles authentication. Call the `$Lightning.use` global method to
    begin the bootstrapping process to load the component onto the page.


    > Using Lightning Components on a Visualforce page does allow you to consider
    ways to develop new areas of your solution with Lightning while still delivering
    a Salesforce Classic user experience for customers that still require it.


    For more information on configuring Lightning Out, consult the applicable section
    in the *Lightning Developers Guide* (https://developer.salesforce.com/docs/atlas.en-us.lightning.meta/lightning/lightning_out.htm).


    # # Integrating with communities


    Lightning Community is another container for your Lightning Components; as such
    existing components are likely already close to being able to exist within it
    and the **Lightning Community Builder** tool. The most basic requirement is that
    your components implement the `forceCommunity:availableForAllPageTypes` interface.


    The same considerations to specify a component `.design` file as described in
    the earlier section also apply so that the components appear correctly in the
    Lightning Community Builder tool, notably making the components access level `global`.


    It is also possible to customize the Lightning Community container through components
    implementing interfaces that provide a custom theme layout, profile header, search
    and post publisher components and content layouts. Consult the interfaces within
    the `forceCommunity` namespace for more details.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Testing


    At the time of writing there is no Salesforce provided test framework for Lightning
    components as there is for Apex. Salesforce has not officially commented, but
    it is likely that they will include the Aura test framework that exists today
    in the open source project in a future release of the Force.com platform (http://documentation.auraframework.org/test/runner.app).


    Meanwhile I recommend you review existing browser testing tools.


    # Updating the FormulaForce package


    As with previous chapters, check that all new components have been added to the
    FormulaForce package and upload it. Due to the inclusion of the Utility Bar the
    package now requires My Domain to be configured in orgs for installation to complete.
    While My Domain offers some increased security benefits for customers, it does
    come with the implications that need careful consideration. Consult with your
    customer base before making this dependency on your package.


    # Summary


    In this chapter, you have understood the high level architecture of the Lightning
    framework, both from a the perspective of a standalone page to integrating Lightning
    Components within Lightning Experience and Salesforce1 Mobile.


    Lightning Experience is now more extensible than the original Salesforce Classic
    user interface. There are more options to consider before deciding your only option
    is to start building entirely new from the ground up page level experiences. Thinking
    about these integration capabilities as you consider your user experience requirements
    along with how aligning component thinking between developers and UX designers
    is a key to embracing this new of building applications on Salesforce.


    The need for Separation of Concerns and good coding practices is now as important
    at the client tier as it is at the backend. It is also more important to monitor
    your architecture for encapsulation of and containment of your business logic.
    This should still remain firmly at the backend where different client types can
    access it.


    Finally, it is pretty clear that Lightning is embracing the ongoing industry adoption
    of JavaScript, so if you need to brush up on your JavaScript skills now is the
    time to start!


    In the next chapter we will be exploring platform features, tools and best practices
    for providing integration opportunities to your applications customers and partners.'
  merge: -1
