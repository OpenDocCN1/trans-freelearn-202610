- pgno: 355
  md: "> > It is not possible to override the default Org language used to look up\
    \ the appropriate Custom Labels through Apex. However, if the API is called from\
    \ a Visualforce page utilizing the 1anguage attribute as described in Chapter\
    \ 8, your API code will also honor this.\n\nSome APIs expose error codes to provide\
    \ a language-neutral way to recognize a certain error use case programmatically\
    \ (parsing the message text is not reliable in a translated environment). As such,\
    \ one approach is to use an Apex enum and a custom Apex exception class, which\
    \ captures both the translated error message and the exception code. The following\
    \ enum and exception types are defined in the Application class contained within\
    \ the sample code for this chapter. Note the use of the global keyword in Apex;\
    \ this will be discussed later in this chapter in more detail:\n\n```\n```apex\n\
    global Application {\n\tenum ExceptionCode {\n\t\tComplianceFailure,\n\t\tUnableToVerifyCompliance\n\
    \t}\n}\n\nglobal virtual class ApplicationException extends Exception {\n\tglobal\
    \ ExceptionCode ExceptionCode {get; private set;}\n\n\tpublic ApplicationException(\n\
    \t\tExceptionCode exceptionCode, String message) {\n\t\tthis(message);\n\t\tthis.exceptionCode\
    \ = exceptionCode;\n\t}\n}\n```\n```\n\nWhile the preceding ApplicationException\
    \ class can be used as it is, the following ComplianceService class has its own\
    \ custom exception that can then extend this:\n\n```\n```apex\nglobal class ComplianceException\n\
    \textends Application.ApplicationException {\n\tglobal List<VerifyResult> failures\
    \ {get; private set;}\n\n\tpublic ComplianceException(\n\t\tApplication.ExceptionCode\
    \ exceptionCode,\n\t\tString message, List<VerifyResult> failures) {\n\t\tsuper(exceptionCode,\
    \ message);\n\t\tthis.failures = failures;\n\t}\n}\n```\n```"
