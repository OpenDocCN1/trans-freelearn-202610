- pgno: 10
  md: '# About the Reviewers


    **Zarna Chintan Naik** is the Founder of YES CRM Consultants, a Salesforce.com
    consulting company based in Mumbai. YES CRM Consultants is primarily focused on
    Salesforce.com consulting, administration, and training services for clients based
    around the globe.


    Zarna and her team also have expertise in multiple appexchange products, including
    Conga Merge, Clicktools, Rollup Helper, and Drawloop.


    Zarna herself holds multiple certifications: Salesforce.com Certified Administrator,
    Developer, Sales & Service Cloud Consultant. Previously, she worked for one of
    the leading Salesforce.com partners in USA. She has also reviewed Learning Force.
    com Application Development, Packt Publishing. To know more about Zarna and YES
    CRM Consultants, log on to www.yescrm.org or visit her LinkedIn profile at https://in.linkedin.com/in/zarnadesai.


    > I would like to thank my parents, in-laws, husband, sister, friends, and family
    for their continued support for my work.


    **John M. Daniel** has been working in the technology sector for over 20+ years.
    During that time, he has worked with a variety of technologies and project roles.
    Currently, he works at Morgan & Morgan Law Firm as their Lead Salesforce Platform
    Architect. He currently holds multiple certifications from Salesforce.com, including
    the Platform Developer I & II certifications and most of the Technical Architect
    Designer certifications. He is currently in the process of attaining the Certified
    Technical Architect certification. His loves to spend time with his family, swim
    at the beach, and work on various open source projects, such as ApexDocs and ApexUML.
