  md: "> You can utilize the Apex Describe API to add compile-time checking and referential\
    \ integrity into the preceding relationship references. For example, instead of\
    \ hardcoded Race__r.Name you can use the following:\n> \n> Contestant__c.Race__c.getDescribe().\n\
    > getRelationshipName() + '.' + Race__c.Name\n\nThe preceding code shows the newQueryFactory\
    \ method being passed false. This instructs the base class not to configure the\
    \ query factory returned with the selector fields. This allows the caller to use\
    \ the selectField method to specify particular fields as required.\n\n> If you\
