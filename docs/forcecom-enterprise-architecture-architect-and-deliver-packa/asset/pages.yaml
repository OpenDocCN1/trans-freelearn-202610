  md: "```\nvoid showMessage(\n    Integer positionX, Integer positionY, String message);\n\
    String getMessageShowAt(\n    Integer positionX, Integer positionY);\nBoolean\
    \ isVisible();\n}\n```\n\nSecond, the real implementation of the classes must\
    \ implement the interfaces, since the interfaces are based on their methods. This\
    \ typically just requires stating the class implements the interface:\n\n```\n\
    public class Engine implements IEngine {\npublic class Dashboard implements IDashboard\
    \ {\npublic class Display implements IDisplay {\n```\n\nFinally, references to\
    \ the interface types and not the concrete classes must be made throughout the\
