    13:47:43.412|CODE_UNIT_FINISHED|execute_anonymous_apex

    ```


    Note that all governors are shown in the summary regardless of their scope; for
    example, the CPU time governor is an execution scope governor. This allows you
    to follow the consumption of the Apex CPU time across Apex code units from all
    namespaces. The Developer Console option provides some excellent tools to profile
    the consumption of governors.'
  merge: -1
