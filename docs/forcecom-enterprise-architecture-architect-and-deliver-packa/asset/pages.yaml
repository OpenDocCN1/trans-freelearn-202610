    Test.stopTest();\n```\n\n# Test methods using the Domain class methods\n\nIn order\
    \ to test custom Domain class methods, an instance of the Domain class should\
    \ be created in the test method, using test records created in memory or queried\
    \ from the database having been inserted as shown in the previous tests.\n\nThe\
