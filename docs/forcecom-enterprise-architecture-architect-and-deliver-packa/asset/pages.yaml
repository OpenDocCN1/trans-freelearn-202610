- pgno: 209
  md: "# # Defining and passing data\n\nMost methods on Domain classes already have\
    \ the information they need through the `Records` property (the state the Domain\
    \ class was constructed with). As such, there is little need to pass data information\
    \ on the methods themselves. However, for some custom behavior methods (those\
    \ not reflecting the Apex Trigger logic), you might want to pass other domain\
    \ objects and/or a **Unit Of Work** as additional parameters. Examples later in\
    \ this chapter help illustrate this.\n\n# # Transaction management\n\nFor Domain\
    \ class methods that perform database operations, there are two design guidelines:\
    \ utilize a transaction context (Unit Of Work) passed as a parameter to the method\
    \ or create one for the scope of the Domain class method execution.\n\n# # Domain\
    \ class template\n\nThe Domain class implementation in this chapter utilizes the\
    \ **FinancialForce.com Apex Enterprise Patterns** library, which is open source\
    \ and is included in the sample code of this chapter. In this library, the Apex\
    \ base class, `fflib_SObjectDomain`, is provided to help implement the Domain\
    \ layer pattern.\n\nA basic template for a Domain class utilizing this base class\
    \ is shown in the following code snippet:\n\n```\npublic class Races extends fflib_SObjectDomain\
    \ {\n    public Races(List<Race__c> races) {\n        super(races);\n    }\n}\n\
    \npublic class Constructor\n    implements fflib_SObjectDomain.IConstructable\
    \ {\n    public fflib_SObjectDomain construct(\n        List<SObject>sObjectList)\
    \ {\n        return new Races(sObjectList);\n    }\n}\n}\n```\n\nThe first thing\
    \ to note is that the **constructor** for this class takes a list of `Race__c`\
    \ records, as per the guidelines described previously. The code implemented in\
    \ a domain class is written with bulkification in mind. The base class constructor\
    \ initializes the `Records` base class property."
  merge: -1
  img_proc: true
- pgno: 210
  md: 'The inner class, Constructor, is present to permit the dynamic creation of
    the Domain class in an Apex Trigger context. This is actually working around the
    lack of full reflection (the ability to reference the class constructor dynamically)
    in the Apex language. The name of this inner class must always be Constructor.


    By extending the fflib_SObjectDomain class, the Domain class inherits properties
    and methods it can override to implement its own methods, such as the Records
    property, which provides access to the actual record data. There are virtual methods
    provided to make the Apex Trigger behavior implementation easier, as well as some
    specialized events such as onValidate and onApplyDefaults. The following class
    overview illustrates some of the key methods in the base class that the Domain
    classes can override:


    ```

    fflib_SObjectDomain(List<SObject>, SObjectType)

    v onApplyDefaults() : void

    v onValidate() : void

    v onValidate(Map<Id, SObject>) : void

    v onBeforeInsert() : void

    v onBeforeUpdate(Map<Id, SObject>) : void

    v onBeforeDelete() : void

    v onAfterInsert() : void

    v onAfterUpdate(Map<Id, SObject>) : void

    v onAfterDelete() : void

    v onAfterUndelete() : void

    v handleBeforeInsert() : void

    v handleBeforeUpdate(Map<Id, SObject>) : void

    v handleBeforeDelete() : void

    v handleAfterInsert() : void

    v handleAfterUpdate(Map<Id, SObject>) : void

    v handleAfterDelete() : void

    v handleAfterUndelete() : void

    ```


    # Implementing Domain Trigger logic


    The most common initial use case for a Domain class is to encapsulate the Apex
    Trigger logic. In order to enable this, a small Apex Trigger is required to invoke
    the triggerHandler method. This will route the various Trigger events to the appropriate
    methods in the Domain class (as shown in the preceding screenshot), avoiding the
    need for the usual if/else logic around Trigger.isXXX variables.'
  merge: -1
