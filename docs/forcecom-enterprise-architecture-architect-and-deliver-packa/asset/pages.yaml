    # Processing unlimited result sets using Salesforce APIs


    Salesforce does not limit the maximum number of rows that can be queried when
    using the Salesforce SOAP and REST APIs to retrieve record data, as in these contexts,
    the resources consuming and processing the resulting record data are off-platform.


    One consideration to keep in mind, however, is the daily API limits—although you
    can read unlimited data, it is still chunked from the Salesforce servers and retrieving
    each chunk will consume an API call. Although less friendly, the Salesforce Bulk
    API is more efficient at retrieving more records while using less API calls to
    the Salesforce servers.


    # Asynchronous execution contexts


    Salesforce is committed to ensuring that the interactive user experience (browser
    or mobile response times) of your applications and that of its own is as optimal
    as possible. In a multitenant environment, it uses the governors as one way to
    manage this. The other approach is to provide a means for you to move the processing
    of code from the foreground (interactive) into the background (async mode). This
    section of the chapter discusses the design considerations, implementation options,
    and benefits available in this context.


    As the code running in the background is, by definition, not holding up the response
    times of the pages the users are using, Salesforce can and does throttle when
    and how often async processes execute, depending on the load on the servers at
    the time. For this reason, it currently does not provide an SLA on exactly when
    an async piece of code will run or guarantee exactly when the Apex Schedule code
    will run at the allotted time. This aspect of the platform can at times be a source
    of frustration for end users, waiting for critical business processes to complete.
    However, there are some design, implementation, user interface, and messaging
    considerations that can make a big difference in terms of managing their expectations.'
  merge: -1
  img_proc: true
- pgno: 410
  md: 'The good news is that the platform rewards you for running your code in async
    by giving you increased governors in areas such as Heap, SOQL queries, and CPU
    governor. You can find the full details in their documentation (attempting to
    document them in a book is a nonstarter as they are constantly being improved
    and removed in some cases).


    > Understanding Execution Governors and Limits: http://www.salesforce.com/us/developer/docs/apexcode/Content/apex_gov_limits.htm.


    # General async design considerations


    The platform provides some straightforward ways in which you can execute code
    in async. What is often overlooked though is error handling and general user experience
    considerations. This section presents some points to consider functionally when
    moving a task or process into async or the background to use a more end user-facing
    term:


    +   • Type of background work: I categorize work performed in the background in
    two ways, application and end user:


    +   o Application is something that the application requires to support future
    end user tasks, such as periodic recalculation, major data manipulation, or the
    on boarding of data from an external service, for example.


    +   o End user is something that is related (typically initiated) to an end user
    activity that just happens to require more platform resources than are available
    in the interactive (or foreground) context. The latter can be much harder to accept
    for business analysts and end users, who are constantly demanding real-time response
    times. If you do find that this is your only route, focus hard on the user interaction
    and messaging aspects as follows.'
  merge: -1
  img_proc: true
- pgno: 411
  md: '+   User experience: A well-crafted user experience around the execution of
    background work can make all the difference when the platform is choosing to queue
    or slow the processing of work. Here are some considerations to keep in mind:


    +   Starting the background work: Decide how the user starts the background process.
    Is it explicitly, via a button or indirectly, via a scheduled job or as a side
    effect of performing another task? Starting the background work explicitly from
    a user interface button gives you the opportunity to set expectations. A critical
    one being whether the work is queued or it has actually started; if they didn''t
    know this, they might be inclined to attempt to start the work again, thus resulting
    in potentially two jobs processing in parallel! If you decide to start the process
    indirectly, make sure that you focus on error handling and recovery to ensure
    that the user has a way of being notified of any important failures at a later
    point in time.


    +   Progress bar indicators: These can be used to allow the user to monitor the
    progress of the job from start to finish. Providing messages during the progress
    of the work can also help the user understand what is going on.


    +   Monitoring: Ensuring that the user can continue to monitor the progress between
    sessions or other tasks can also be important. Often, users might close tabs or
    get logged out and so consider providing a means to revisit the place where they
    started the job and have the user interface recognize that the job is still being
    processed, allowing the user to resume monitoring of the job.


    +   Messaging and Logging: Think about the ways in which your background process
    communicates and notifies the end user of the work it has done and any errors
    that occurred. While e-mails can be the default choice, consider how such e-mails
    can get lost easily, look for alternative notification and logging approaches
    that are more aligned with the platform and the application environment. Here
    are some considerations to keep in mind:


    +   Logging: Ideally, persist log information within the application through an
    associated log (such as a logging Custom Object) with other Custom Objects that
    are associated with records being processed by the job, such that the end users
    can leverage related lists to see log entries contextually.'
  merge: -1
  img_proc: true
- pgno: 412
  md: '+   **Unhandled exceptions:** They are caught by the platform and displayed
    on the **Apex Jobs** page. The problem with this page is that it''s not very user-friendly
    and also lacks the context as to what the job was actually doing with which records
    (the Apex class name might not be enough to determine this alone). Try to handle
    exceptions, routing them via your end user-facing messaging. Some Apex exceptions
    cannot be handled and will still require admins or support consultants to check
    for these. Your interactive monitoring solutions can also query `AsyncApexJob`
    for such messages.


    +   **Notifications:** Notifications that a job has completed or failed with an
    error can be sent via an e-mail; however, also consider creating a child record
    as part of the logging alternative. A user-related task or a chatter post can
    also work quite well. The benefit of options that leverage information stored
    in the org is that these can also be a place to display Custom Buttons to restart
    the process.


    +   **Concurrency:** Consider what would happen if two or more users attempted
    to run your jobs at the same time or if the data being processed overlaps between
    two jobs. Note that this scenario can also occur when scheduled jobs execute.
    You might want to store the Apex job ID during the processing of the job against
    an appropriate record to effectively lock it from being processed by other jobs
    until it is cleared.


    +   **Error recovery:** Consider whether the user''s needs to rerun the job processing
    that has only failed records or whether the job can simply be designed in a way
    which is re-entrant, which means that it checks whether executions of a previous
    job might have already been made over the same data and cleans up or resets as
    it goes along.


    # # Running Apex in the asynchronous mode


    There are three ways to implement the asynchronous code in Force.com; all run
    with the same default extended governors compared to the interactive execution
    context.


    As stated previously, there is no guarantee when the code will be executed. Salesforce
    monitors the frequency and length of each execution, adjusting a queue that takes
    into consideration performance over the entire instance and not just the subscriber
    org. It also caps the number of async jobs over a rolling 24-hour period. See
    the *Understanding Execution Governors and Limits* section for more details. Salesforce
    provides a detailed white paper describing the queuing.'
  merge: -1
  img_proc: true
- pgno: 413
  md: 'Asynchronous Processing in Force.com: https://developer.salesforce.com/page/Asynchronous_Processing_in_Force_com.


    > Apex Scheduler can be used to execute code in an async context via its execute
    method. This also provides enhanced governors. Depending on the processing involved,
    you might choose to start a Batch Apex job from the execute method. Otherwise,
    if you want a one-off, scheduled execution, you can use the Database.scheduleBatch
    method.


    # @future


    Consider the following implementation guidelines when utilizing @future jobs:


    +   * Avoid flooding the async queue with many @future jobs (consider Batch Apex).

    +   * Methods must execute quickly or risk platform throttling, which will delay
    the execution.

    +   * It is easier to implement as they require only a method annotation to be
    added.

    +   * Typically, the time taken to dequeue and execute the work is less than Batch
    Apex.

    +   * You can express, via a method annotation, an increase in a specific governor
    to customize the governor limits to your needs.

    +   * Parameter types are limited to simple types and lists.

    +   * Be careful when passing in list parameters by ensuring that you volume test
    with large lists.

    +   * There is no way to track execution as the Apex Job ID is not returned.

    +   * Executing from an Apex Trigger should be considered carefully; @future methods
    should be bulkified, and if there is a possibility of bulk data loading, there
    is a greater chance of hitting the daily per user limit for @future jobs.

    +   * You cannot start another @future, Batch Apex or Queueables job. This is
    particularly an issue if your packaged code can be invoked by code (such as that
    written by developer X) in a subscriber org. If they have their own @future methods
    indirectly invoking your use of this feature, an exception will occur. As such,
    try to avoid using these features from a packaged Apex Trigger context.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '> I would recommend Queueables over @future since they have additional flexibility
    in terms of the type of information that can be passed to them and they are more
    easily tracked once submitted.


    # Queueables


    Consider the following implementation guidelines when utilizing Queueables:


    +   - Avoid flooding the async queue with many jobs (consider Batch Apex).

    +   - Methods must execute quickly or risk platform throttling, which will delay
    the execution.

    +   - Implement the interface `Queueables` and the execute method. Then, use the
    `System.enqueueJob` method to start your job:

    +     `public void execute(QueueableContext context)`

    +   - The object implementing `Queueables` can contain serializable state that
    represents the work to be undertaken. This can be complex lists, maps, or your
    own Apex types.

    +   - Typically, the time taken to dequeue and execute the work is less than Batch
    Apex.

    +   - Be careful while processing lists, ensuring that you volume test with large
    volumes of lists to ensure that the job can complete with maximum data.

    +   - You can track execution as the **Apex Job ID** is returned.

    +   - Executing from an Apex Trigger should be considered carefully. Use of `Queueables`
    should be bulkified, and if there is a possibility of bulk data loading, there
    is a greater chance of hitting the daily per user limit for `@future jobs`.

    +   - You can start up to 50 `queueables` jobs in a sync context.

    +   - You can start only one `queueable` job within an existing `queueable` job;
    this is known as chaining. The depth of the chain is unlimited, though the platform
    will slow the gaps between jobs as the depth grows. Also Developer Edition orgs
    are limited to a depth of 5.

    +   - If code attempts to issue more than 1 `queueable` job within an existing
    `queueable` context, an error occurs. This can be particularly an issue if your
    packaged code can be invoked by code (such as that written by developer X) in
    a subscriber org. If they have their own async methods indirectly invoking your
    use of this feature, an exception will occur. As such, try to avoid using these
    features from a packaged Apex Trigger context.'
  merge: -1
  img_proc: true
- pgno: 415
  md: '+   - It is possible to run more queueables jobs concurrently than Batch Apex.

    +   The exact limit is not documented. However be sure to avoid flooding the

    +   system, by putting in place logic that controls how chaining and concurrency

    +   are used.


    # Batch Apex


    In our scenario, the **Race Data** records loaded into Salesforce do not by default

    associate themselves with the applicable **Contestant** records. As noted earlier,
    the

    **Contestant** record has a **Race Data Id** field that contains an Apex-calculated
    unique

    value made up from the **Year**, **Race Name**, and **Driver Id** fields concatenated

    together.


    The following Batch Apex job is designed to process all the **Race Data** records,

    calculate the compound **Contestant Race Data Id** field, and update the records
    with

    the associated **Contestant** record relationship. The following example highlights

    a number of other things in terms of the Selector and Service layer patterns usage

    within this context:


    +   - The `RaceDataSelector` class is used to provide the `QueryLocator` method

    +   needed, keeping the SOQL logic (albeit simple in this case) encapsulated in

    +   the Selector layer.


    +   - The `RaceService.processData` method (added to support this job) is

    +   passed in the IDs of the records rather than the records passed to the

    +   execute method in the `scope` parameter. This general approach avoids any

    +   concern over the record data being old, as Batch Apex serialized all record

    +   data at the start of the job.


    +   - As per the standard practice, the Service layer does not handle exceptions;

    +   these are thrown to the caller and it handles them appropriately. In this
    case,

    +   a new `LogService` class is used to capture exceptions thrown and log them

    +   to a Custom Object, utilizing the Apex job ID as a means to differentiate
    log

    +   entries from others jobs. Note that the use of `LogService` is for illustration

    +   only; it is not implemented in the sample code for this chapter.


    +   - In the `finish` method, new `NotificationService` encapsulates logic,

    +   which is able to notify end users (perhaps via e-mail, tasks, or Chatter as

    +   considered earlier) of the result of the job, passing on the Apex job ID,
    such

    +   that it can leverage the information stored in the log Custom Object and/or

    +   `ApexAsyncJob` to form an appropriate message to the user. Again, this is
    for

    +   illustration only.'
  merge: -1
