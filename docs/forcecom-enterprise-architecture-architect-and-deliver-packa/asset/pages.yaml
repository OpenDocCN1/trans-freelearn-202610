  img_proc: true
- pgno: 261
  md: "The selectByIdWithContestants method generates the following SOQL:\n\n```\n\
    select\nName, TotalDNFs__c, Status__c, Season__c, Id,\nPollPositionLapTime__c,\
    \ FastestLapBy__c,\n(select\nQualification1LapTime__c, ChampionshipPoints__c,\n\
    Driver__c, GridPosition__c, Qualification3LapTime__c,\nRacePosition__c, Name,\
    \ DNF__c, RaceTime__c,\nId, DriverRace__c, Qualification2LapTime__c, Race__c\n\
    from Contestants__r\norder by Race__r.Season__r.Name, Race__r.Name,\nRacePosition__c)\n\
    from Race__c where id in :raceIds order by Name\n```\n\n# A custom Selector method\
    \ with related fields\n\nIn addition to querying child records, related records\
    \ can also be queried using the SOQL field dot notation. This provides an additional\
    \ way to optimize the querying of additional record information, along with having\
    \ to make an additional query.\n\nThe following is an example of a custom Selector\
    \ method for the ContestantsSelector class, where Contestant records are queried\
    \ along with the related Driver record fields. The resulting Contestant__c objects\
    \ expose the Driver__r field, which provides an instance of Driver__c populated\
    \ with the Driver__c fields specified in DriversSelector:\n\n```\npublic List<Contestant__c>selectByIdWithDriver(Set<Id>driverIds)\
    \ {\n    fflib_QueryFactorycontestantFactory = newQueryFactory();\nnew DriversSelector().\n\
    configureQueryFactoryFields(\ncontestantFactory,\nContestant__c.Driver__c.getDescribe().getRelationshipName());\n\
    return Database.query(\ncontestantFactory.setCondition('Id in :driverIds').toSOQL());\n\
    }\n```\n\n> The fflib_SObjectSelector.configureQueryFactoryFields method adds\
    \ the selector fields to the query factory passed as the first parameter, utilizing\
    \ the relationship prefix specified in the second parameter."
