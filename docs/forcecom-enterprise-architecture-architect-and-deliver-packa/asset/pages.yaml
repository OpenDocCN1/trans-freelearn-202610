- pgno: 200
  md: "In both cases, any exceptions are routed to the `apex:pageMessages` component\
    \ on the page (which should be one of the first things you should consider adding\
    \ to a page) by calling the `ApexPages.addMessages` method that is passing in\
    \ the exception.\n\nNote that there is no need for the controller code to roll\
    \ back changes made within the service that may have been made to object records\
    \ up to the exception being thrown, since the controller is safe in the assumption\
    \ that the service method has already ensured this is the case. This arrangement\
    \ between the two is essentially a Separation of Concerns at work!\n\nFinally,\
