- pgno: 319
  md: '# Lightning Experience and Salesforce1


    Salesforce has created its own standard UI containers for its own products and
    partner applications through the Lightning Application containers, known as Lightning
    Experience and Salesforce1 Mobile. Both are served up via the /one/ one.app URL:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_319_0.png)


    As we have seen in the previous chapters, Salesforce does not restrict loading
    of its own components in these containers. They provide various ways in which
    developers can load components they write in order to integrate and extend the
    standard user experience in respect of their specific application objects and
    processes.


    Salesforce also allows developers to leverage some components they have built
    and tested for external developer consumption. For example, the force:recordView
    is used to display a record. The force:showToast component can be used to display
    popup notifications. We will look at the various ways in which both of these components
    and Salesforce containers can be used and extended later.


    # Components


    Page level design is no longer the focus in Lightning; thinking component-first
    is the focus you should have. This does not dismiss the need for good user experience
    design however. Rather it involves a closer collaboration between UX designer
    and developer.


    Creating one huge component to serve your needs is not recommended and will not
    embrace the Salesforce UI customization facilities in the way your users will
    expect. From a coding perspective it will be hard to maintain and not reusable,
    as it will likely not fit everyone''s need.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'A better approach is to work with your UX designer on the mockups and think
    about how you can break up the UI into reusable or distinct elements. Later in
    this chapter, I will explain how I approached this thinking when devising the
    components for the FormulaForce application.


    > Having a good knowledge of the extensibility points within the Salesforce UIs
    is also important when designing your user experience. The standard UI may offer
    most of the user experience required, leaving the developer to focus on one or
    two single components that add the remainder.


    # Separation of concerns


    Lightning Components are built with separation of concerns in mind from the ground
    up. Note the use of a **Lightning Bundle** and the contents as we know them thus
    far are split into separate files for, the **markup** (view) and **JavaScript**
    code (controller). They are all grouped under a single subfolder. This is a clever
    way in which Salesforce wants us to really consider the way we engineer our Lightning
    code and how components interact.


    As with most things in engineering, separation of concerns is not a given by just
    using the technology alone. Some aspects are enforced for you; other things are
    subject to guidelines and good component design. If you get it right, you will
    not only get reusable, robust and enduring UI components within your own application
    UI, but also within the evolving Salesforce containers, as well as the ever increasing
    number of mobile devices and even integration with third party websites if needed.


    Keeping in mind the tenets of separation of concern are as vital when developing
    a rich client application as they are when engineering your applications backend
    business logic.


    # Encapsulation during development


    An important aspect of a component''s implementation is encapsulation. Its ability
    to keep its implementation from impacting the operation of other components on
    the page is a critical aspect of what makes the container model work – especially
    since in reality all components occupy the same HTML DOM for the page.'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'As previously mentioned, **Lightning Bundles** (also known as **Aura Definition
    Bundles**) are used to collect together the source files needed to implement each
    of the specific aspects the Lightning artifact you are creating. The following
    screenshot shows **Compliance Checker** component included in this book as shown
    with in the Force.com IDE:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_321_0.png)


    > Also see Aura Definition Bundle type in the *Metadata API Developers Guide*
    (https://developer.salesforce.com/docs/atlas.en-us.api_meta.meta/api_meta/meta_auradefinitionbundle.htm).


    The following sections discuss the contents of a Lightning Component bundle.


    # # Component markup (.cmp)


    Component markup contains the **XHTML markup** for the components appearance.
    Its root element is `aura:component`. It can include references to valid HTML
    elements and/or other components, as we have seen in the `mycomponent` example
    earlier.


    Amongst the markup you can also specify **attribute bindings**, for dynamic aspects
    of the component, such as a table or field values. Unlike Visualforce these are
    not bindings to Apex class properties. Bindings refer to attributes defined via
    the `aura:attribute` component (typically at the top of this file) or those provided
    by the platform.


    The framework ensures that when the value of an attribute changes (through JavaScript
    controller code) any markup that references it via a binding expression is refreshed.
    This is a very powerful feature and avoids the need for extensive coding around
    the page DOM. In fact, this is generally discouraged in all but advanced scenarios,
    such as custom component rendering or use of third-party libraries.'
  merge: -1
  img_proc: true
- pgno: 322
  md: "The following is a simple example of an attribute definition and usage. When\
    \ the controller changes the attribute value, the `<b>` tag will be automatically\
    \ refreshed:\n\n```\n<aura:attribute name=\"myattr\" type=\"String\"/>\n\n<b>The\
    \ value of myattr is '{!v.myattr}'</b>\n```\n\n> The `v` prefix denotes a **value\
    \ provider**. This one provides access to a components attributes or more specifically\
    \ its _view_. Other value providers are available that provide similar functionality\
    \ to that of Visualforce for accessing Custom Fields and Static Resources through\
    \ `$Label` and `$Resource`. Consult the **Lightning Components Developer Guide**\
    \ for more information on these.\n\n# # Component controller (...Controller.js)\n\
    \nThe `Controller.js` is a JavaScript file that contains the **client-side controller**\
    \ code for the component. You must have one of these to define dynamic behavior\
    \ in your component, including any dynamic initialization. The only way to call\
    \ code in an **Apex controller** is from the client side controller code; unlike\
    \ Visualforce there is no direct way to do so from the markup.\n\nFunctions defined\
    \ relate to corresponding **action bindings** or `aura:handler` references in\
    \ the `.cmp` file. Actions are events that occur in the browser, such as clicking\
    \ a button, hovering over an element, scrolling or an event from the container\
    \ or another component. We will discuss **Events** in a later section.\n\nThough\
    \ not enforced, it is recommended that it contains only functions that relate\
    \ to actions referenced in the `.cmp` file. More extensive controller code and\
    \ utility functions should be placed in the `Helper.js` file described as following.\
    \ Another motivation for this separation of concerns is that the framework replicates\
    \ the controller per instance of your component; however there is only ever one\
    \ instance of the helper.\n\nThe following is a simple button markup in `.cmp`\
    \ file using the `c` value provider in an expression to reference a client side\
    \ controller function:\n\n```\n<lightning:button label=\"Add Drivers\"\n onclick=\"\
    {!c.onAddDrivers}\"/>\n```\n\nThe framework automatically handles the setup of\
    \ the HTML event listeners for you and routing them to the specified controller\
    \ method. The `component`, `event` and `helper` parameters are always injected\
    \ by the framework:\n\n```\nonAddDrivers :function(component, event, helper) {\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 323
  md: "```\nhelper.addDrivers(component, event);\n}\n```\n\n> The c value provider\
    \ (controller provider) can also be used within JavaScript to obtain a reference\
    \ to an Apex Controller method the client code wishes to call. We will review\
    \ an example of this scenario later in the chapter.\n\n# Component Helper (...Helper.js)\n\
    \nA JavaScript file that defines functions are used by the Controller.js and Renderer.js\
    \ (described as following) files. The framework creates a single instance of these\
    \ methods which is shared between all component instances. Thus it is recommended\
    \ you do not store any state and instead leverage the component attributes instead.\n\
    \nThis example shows an action binding as referenced by an aura:handler specifying\
    \ a platform event fired during the initialization of a component. In this case\
    \ it allows the component to load data from the server dynamically:\n\n```\n<aura:handler\n\
    \ name=\"init\" value=\"{!this}\"\n action=\"{!c.onInit}\"/>\n```\n\nThe controller\
    \ function is fired and delegates to the helper class:\n\n```\nonInit : function(component,\
    \ event, helper) {\n helper.getCalendar(component, event);\n}\n```\n\nThe helper\
    \ function makes a server side call out to the Apex Controller, which is specified\
    \ through controller attribute within the .cmp file? The c value provider is used\
    \ here again, but this time to access server side controller methods:\n\n```\n\
    getCalendar : function(component, event ) {\n var action = component.get(\"c.getRaceCalendar\"\
    );\n action.setCallback(this,\n function(response) {\n if(response.getState()\
    \ == 'SUCCESS') {\n component.set(\"v.calendar\", response.getReturnValue());\n\
    \ }\n });\n $A.enqueueAction(action);\n}\n```"
