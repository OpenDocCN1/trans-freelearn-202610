    \ 'Spa', Status__c = 'Scheduled',\n        Season__c = season.Id);\n    insert\
    \ race;\n    Contestant__c contestant =\n        new Contestant__c(\n        Driver__c\
    \ = driver.Id, Race__c = race.Id);\n    insert contestant;\n    race.Status__c\
    \ = 'Finished';\n    update race;\n    contestant.RacePosition__c = 1;\n}\n```"
