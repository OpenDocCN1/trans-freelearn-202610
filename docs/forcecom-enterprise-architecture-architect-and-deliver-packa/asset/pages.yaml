- pgno: 299
  md: '# # Lightning tools to monitor size and response times


    In Lightning, it is important to monitor the complexity of your component hierarchy.
    While it is good to componentized for reasons of separation of concerns, too much
    of it can result in a heavy component tree, and result in poor performance. Salesforce
    provides an excellent tool known as Lightning Inspector, which provides insight
    into your component hierarchy and the rendering times each component takes. You
    can download and install this from the Google Chrome Web store.


    The following shows an example screenshot for the FormulaForce application:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_299_0.png)


    You may also have noticed that LEX displays page size and response time in the
    header:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_299_1.png)'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# # Visualforce Viewstate size


    Visualforce Developer''s Guide has a section within it entitled Best Practices
    for Improving Visualforce Performance, in which it outlines some excellent ways
    to ensure that your pages remain responsive. I highly recommend that you take
    the time to read through it. There is, however, one point in that topic that I
    want to elaborate further on in this section:


    > "If your view state is affected by a large component tree, try reducing the
    number of components your page depends on."


    This symptom can result in poor response times, even for pages that are properly
    optimized in all other regards described in the documentation. The cause stems
    from the internal overhead of the Salesforce Visualforce components, known as
    internal view state, which increases when you have many such components on the
    page, typically in tabular or apex:repeat scenarios.


    Depending on your Visualforce page design, it can often represent proportionally
    more than the data the developer explicitly places in the view state through controller
    properties and member variables. Together, they both contribute to reaching the
    145 KB limit on view state size, though before this is reached larger view states
    can effect response times.


    # # Considerations for managing large component trees


    Here are a few considerations when designing Visualforce pages utilizing tables
    or repeated sections that contain the native Visualforce components:


    +   - View state is only generated if you have a `apex:form` tag on the page;
    if you don''t need one, then you should remove it, for example in view only pages.


    +   - Consider if you need to use Visualforce components such as `apex:outputField`
    or if using HTML elements directly with a Visualforce expression would suffice.
    HTML elements consume no viewstate. However be careful to consider localization
    features the standard components provide when doing this, such as formatting dates
    and numbers; you might need to perform this in the Apex code and bind to the formatted
    values.


    +   - Avoid nested `apex:repeat` tags that contain Visualforce components. If
    possible, flatten a nested structure with the Apex logic in your controller and
    expose a single iterable list property that results in the same output.'
  merge: -1
  img_proc: true
- pgno: 301
  md: "+   - Consider moving to a stateless controller mode as described in the following\
    \ section.\n+   - Consider implementing pagination in your page.\n\n> > For a\
    \ further analysis, search http://salesforce.stackexchange.com/ for 'How to reduce\
    \ a large internal view state / what is in the internal view state?'\n\n# # Using\
    \ the Service layer and database access\n\nAs with the Visualforce Apex controller\
    \ action methods you've seen in the earlier chapters, the Service layer is also\
    \ designed to be called from Visualforce JavaScript Remoting methods, as follows:\n\
    \n```\n```apex\npublic with sharing class RaceResultsController {\n    @RemoteAction\n\
    \    public static List<RaceService.ProvisionalResult>\n    loadProvisionalResults(Id\
    \ raceId) {\n        return RaceService.calculateProvisionResults(\n         \
    \   new Set<Id>{ raceId }).get(raceId);\n    }\n}\n```\n```\n\nTo make Lightning\
    \ Component controller server-side calls to Apex use the @ AuraEnabled annotation\
    \ method:\n\n```\n```apex\npublic with sharing class RaceResultsController {\n\
    \    @AuraEnabled\n    public static List<RaceService.ProvisionalResult>\n   \
    \ loadProvisionalResults(Id raceId) {\n        return RaceService.calculateProvisionResults(\n\
    \            new Set<Id>{ raceId }).get(raceId);\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 302
  md: "You will also need to apply the @AuraEnabled method to accessors for Apex types\
    \ referenced by the Controller methods:\n\n```\npublic class ProvisionalResult\
    \ {\n    @AuraEnabled\n    public Integer racePosition {get; set;}\n    @AuraEnabled\n\
    \    public Integer contestantId {get; set;}\n    @AuraEnabled\n    public String\
    \ contestantName {get; set;}\n}\n```\n\nIn both these cases, however, there is\
    \ no try/catch block, as error handling is done by the client code to render the\
    \ messages. When exceptions are thrown, the platform takes care of catching the\
    \ exception and passing it back to the calling JavaScript code for it to display\
    \ accordingly. In short, there is no need to invent your own error message handling\
    \ system; just let the platform handle pass it back to the client JavaScript code\
    \ for you. Remember though that you still need to handle the error message in\
    \ your client side JavaScript logic; this will not be done by Visualforce for\
    \ you.\n\n# Considerations for client-side logic and Service layer logic\n\nWith\
    \ the addition of more complex logic in the client via JavaScript, more attention\
    \ needs to be given to Separation of Concerns. The following points provide some\
    \ guidelines for this:\n\n+   Single service method per remoting method: A single\
    \ Service layer method invocation rule should still be observed when developing\
    \ remoting methods on the controller. If multiple Service layer methods are being\
    \ called, this becomes a sign that a new aggregate Service layer method should\
    \ be created and called instead.\n\n+   Avoid remoting client bias: Do not be\
    \ tempted to design your Service layer solely around your JavaScript Remoting\
    \ controller method needs (the needs of your JavaScript client). Always consider\
    \ the Service layer as client-agnostic; this becomes particularly important if\
    \ you also want to also later expose your Service layer as an API to your application."
  merge: -1
  img_proc: true
- pgno: 303
  md: '+   - Apex enum types: If you utilize Enum types in your Service layer design
    (to be honest, why would you not?), they are very expressive and self-documenting!
    However, they unfortunately at this time are not supported by the JavaScript Remoting
    JSON de-serializer, which means that you can return Apex data structures containing
    them, but cannot receive them from the client (a platform exception occurs).


    The workarounds are to either not use enum''s and drop back to using string data
    types or create Apex class data types within the controller class and perform
    your own marshaling between these types and service types (leveraging the `Enum.name()`
    method to map Enum''s to string values). The choice is between your desire to
    protect your Service layer''s use of Enum''s (especially if it is your public-facing
    API) and the effort involved. Hopefully, at some point, Salesforce will fix this
    issue.


    # When should I use JavaScript for database access?


    JavaScript Remote Objects and the Lightning Data Service are designed to expose
    a "SOQL- and DML-like API" for use by the JavaScript code embedded within a Visualforce
    page or Lightning Component. Providing a way to query and update the database
    without having to go through the traditional AJAX Toolkit or Salesforce REST API''s
    that incur charges to the daily API limit.


    Visualforce Developer''s Guide has an excellent topic that describes the best
    practices around using this feature, entitled Best Practices for Using Remote
    Objects, which I highly recommend that you read and digest fully. The Lightning
    Component developer Guide also has samples describing the Lightning Data Service.
    The main aspect from this section which I would like to highlight is the one that
    relates to transactional boundaries in close conjunction with maintaining a good
    Separation of Concerns.


    Resist the temptation to invoke multiple database operations within a single JavaScript
    code block as each will be executed in its own Salesforce execution context and
    thus transaction. This means that, if an error occurs in your JavaScript code,
    previous operations will not be rolled back.


    If you find yourself in this situation, it is also likely that you should be positioning
    such code in your application''s Service layer and thus using JavaScript Remoting
    to call that Service layer method, which will then occur within a single transactional
    scope.'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'That said, if you have use cases that result in a single database operation
    then you can of course consider using this feature, safely assured that your Apex
    Trigger and Domain layer code will continue to enforce your data validation and
    integrity.


    Finally, note that querying records from JavaScript does not invoke your Selector
    code. So the fields queried and populated in the resulting SObject records on
    the client will not always be the same in all cases throughout your JavaScript
    code.


    # Considerations for using JavaScript libraries


    As discussed, the more you move towards a stateless controller and JavaScript
    Remoting client architecture, the more you need to invest in providing or obtaining
    client-side components not presently provided by Salesforce.


    Consider this decision carefully on a per-case basis (not all of your application
    UI has to use the same approach) and make sure that you appreciate the value of
    the platform features that you are leaving behind. Expect to adjust your expectations
    around your client developer''s velocity to be more in alignment with those on
    other platform developers.


    Libraries such as JQuery provide a great deal of convenience, flexibility, and
    components available in the community to provide some alternatives and improvements
    over the Visualforce components, in addition to larger components such as grids
    and trees. Taking things a step further, larger commercially available libraries
    such as Sencha ExtJS are also usable from within a Visualforce page, including
    mobile variants such as JQuery Mobile and Sencha Touch.


    > Lightning implements a security layer around your components, known as the Locker
    Service. This blocks eval, enforces use of strict mode, and restricts access to
    the DOM outside your components own boundaries. Check that the third-party libraries
    you intend to use in Lightning Components are compatible with this type of security
    context.


    All of these libraries require a good deal of JavaScript programming knowledge,
    including its OOP style of programming. Some provide the Model View Controller
    (MVC) frameworks as well, such as AngularJS. If you search on Google for Salesforce
    and for example AngularJS, you will find many examples and articles from the community
    and the Salesforce Developer Evangelists team.'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'Here are some aspects of developing with such libraries, which you should consider:


    +   - **Developer flow**: What is the process from storing the client code in
    source control, pushing it into an org for development, editing code, debugging
    it, and pushing it back into Source Control? Likewise when it comes to packaging,
    consider whether you should compress your JavaScript or not. The Developer flow
    has to be fast; editing JavaScript files, rebuilding zip files, and uploading
    new static resources is not fast. Consider whether you can support a loose file
    development flow for client developers, such as using Visualforce components,
    page, or static resources for each file (**MavensMate** has good support for this),
    and then combine these into a single static resource for packaging and deployment.


    +   - **Security**: Salesforce takes a great deal of care with their Visualforce
    and Lightning components to ensure that the escape values are displayed by the
    components to prevent attacks such as HTML injection for example. Check your components''
    escape values that they inject into the DOM from your database records, or you
    could find yourself open to attack and delays getting through the Salesforce Security
    Review.


    +   - **Testing frameworks**: There are a number of approaches when testing rich
    clients, ranging from unit testing frameworks that have the developer write a
    JavaScript code to testing commercial applications that actually drive the web
    browser and assert the state of the page. Make sure that you invest according
    to the amount of JavaScript code your application contains.


    # Custom Publisher Actions


    In a previous chapter, we created a **Publisher Action** to mark a **Contestant**
    as a **DNF** (Did not Finish) object easily from a Chatter feed. This leveraged
    the declarative approach to creating Publisher Actions, based on creating or updating
    a related record. If your use case does not fit into these type of operations,
    you can use Lightning Component to develop a Custom Publisher Action.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Creating websites and communities


    Salesforce provides the following two ways to create public-facing web content:


    +   - **Force.com**: This offers a means to create public-facing authenticated
    or public websites using Visualforce pages. Due to this, it can access Standard
    and Custom objects using the approaches described in this chapter, reusing components
    and services from your application as needed. The Force.com site configurations
    cannot be packaged, though the pages and controllers you create to support them
    can be. This feature is available in the Enterprise and Developer Edition orgs.
    It is possible to use Lightning Components via Lightning Out for Visualforce pages.


    +   - **Sites.com**: This is a declarative website product that is targeted at
    nontechnical users. Visualforce pages cannot be used directly with Site.com though
    components available with Site.com can access your application''s Custom Objects
    and as such will invoke your Apex Trigger and thus Domain logic code. It is possible
    to use Lightning Components with Sites.com via Community Builder.


    # Mobile application strategy


    Mobile application development using Salesforce has been a hot topic for the last
    few years, starting with the use of various well-known mobile frameworks such
    as jQuery Mobile, AngularJS along with Salesforce’s own API’s, including oAuth
    for authentication, and Salesforce REST API to access Standard and Custom Object
    records, leading up to the current development around the latest Salesforce1 mobile
    application.


    The interesting thing about this is that it has evolved in a different way to
    the browser UI, which started with the standard declarative-driven UI and could
    then be augmented with a more developer-driven solution such as Visualforce. For
    a mobile UI, up until the release of Salesforce1, we only had the option of building
    something with a developer.


    As things stand today, we now have both options available for building mobile
    UI’s. As such, make sure that you understand first and foremost the capability
    of the Salesforce1 mobile application and its ability to surface your objects
    through its standard UI. Publisher Actions provide an excellent way to enhance
    the Chatter feed presence of your application and also add the same actions to
    your users'' Salesforce1 experience.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Salesforce1''s user interface model is not for everyone; it is, like the browser
    UI, mostly data-centric if you wish to expose a more fine-tailored process-driven
    user experience for a very specific mobile application. If this is something you
    feel you need, you can review Salesforce Mobile Packs to choose the architecture
    and API''s that suite your needs the best (https://developer.salesforce.com/mobile).


    # Custom reporting and the Analytics API


    Sometimes, the standard output from the Salesforce Reporting engine is just not
    what your users are looking for. They require formatting or a layout not supported
    by Salesforce, but the way in which they have defined the report is appealing
    to them.


    The Salesforce Analytics API allows you to build a Visualforce page or mobile
    application that can execute a given tabular, summary, or matrix report and return
    its data into your client code to be rendered accordingly. The API is available
    directly to Apex developers and as a REST API for native mobile applications.


    > You might want to consider using a report to drive an alternative approach to
    selecting records for an additional process in your application by leveraging
    the flexibility of the Report Designer as a kind of record selection UI.


    # Updating the FormulaForce package


    Apply the code included in this chapter into your package org. Apart from the
    RaceResultsController Apex class, all components provided with the sample code
    for this chapter will be included in the package automatically as they are additions
    to or referenced from components that are already packaged.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Summary


    Salesforce provides a great standard UI experience that is highly customizable
    and adaptable to new features of the platform without you necessarily releasing
    new revisions of your application. At its core, it is a data-centric user experience,
    which means that most tasks come down to creating, editing, or deleting records
    of some kind. Having a strong focus on your Domain layer code ensures that it
    protects the data integrity of your application.


    If you want to express a more complex process or a series of tasks, Visualforce
    and Lightning allows you to be more expressive using components or other HTML
    libraries to create the user experience needed for the task at hand. While this
    is very powerful, it is important to always consider the standard UI, and, wherever
    possible, augment or complement it with the Visualforce page and/or Lightning
    components rather than making this the only way of interacting with your application.


    Equally important is to observe best practices around engineering custom UIs for
    performance and security. Consider carefully and choose wisely the degree to which
    you depart from the standard UI and/or standard components, as the further you
    move away from these, the more responsibility and complexity you have to deal
    with as a developer. Look for opportunities to create hybrid standard UI and custom
    UI combinations to get the best of both worlds.


    Reporting can be a personal thing for your users; the Salesforce Analytics API
    allows you to harness the power of the Salesforce Report Designer and engine with
    a more tailored rendering of the reporting data returned.


    At present, there are numerous combinations of technologies and approaches to
    build a mobile user experience for your users. As with the standard UI in the
    browser, start with what Salesforce provides you and your users with out of the
    box as standard. The Salesforce1 Mobile application is effectively a platform
    feature that users expect to be able to use with your application objects like
    any other.


    Building custom UIs for use within Salesforce1 mobile is best accomplished using
    Lightning Components. However, if you choose to build your own mobile application,
    you can choose to develop it using one of the Salesforces Mobile SDK''s as a starting
    point; alternatively, if you have the skills and experience, use them as a guide
    on how to call the various Salesforce API''s.'
  merge: -1
  img_proc: true
