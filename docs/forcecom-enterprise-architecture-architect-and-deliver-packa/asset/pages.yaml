- pgno: 350
  md: '# 10

    Providing Integration and Extensibility


    Enterprise businesses have complex needs involving many human, device, and increasingly
    machine interactions, often distributed across the globe. Allowing them to work
    together in an efficient and secure manner is no easy task, and as such, it is
    no great surprise that utilizing cloud-based software over the Internet has become
    so popular. High-grade security, scalability, and availability is high on checklists
    when choosing a new application, often followed by API needs and the ability to
    customize.


    By developing on the Force.com platform, your application already has a good start.
    The http://trust.salesforce.com/ site provides a wide selection of industry strength,
    compliance, and encryption standards that are equally applicable to your applications.
    With this comes a selection of standard APIs offered in the SOAP and REST forms
    as well as the ability to create your own application APIs. In my view, there
    is not a more integration-ready cloud platform available today than Force.com.


    In this chapter, we will review the integration and extensibility options provided
    as standard on the platform and how your application can get the most from them,
    in addition to developing custom application APIs. Once again the Application
    Enterprise Patterns will come into play, supporting the need for APIs and UIs
    to have a strong functionality parity, through the use of the Domain and Service
    layers described in earlier chapters.


    This chapter will cover the following topics:


    +   • Reviewing integration and extensibility needs

    +   • Force.com platform APIs for integration

    +   • Application-specific APIs'
  merge: -1
  img_proc: true
- pgno: 351
  md: '+   - Alignment with Force.com extensibility features

    +   - Extending the application logic with Apex Interfaces


    # Reviewing your integration and extensibility needs


    Before diving into the different ways in which you can provide APIs to those integrating
    or extending your application, let''s review these needs through the eyes of Developer
    X. This is the name I give to a persona representing a consumer of your APIs and
    general integration and extensibility requirements. Much like its use in designing
    a user interface, we can use the persona concept to sense check the design and
    interpretation of an API.


    # Defining the Developer X persona


    Asking a few people (internal and external to the project) to represent this persona
    is well worth doing, allowing them to provide use cases and feedback to the features
    and functions of your application''s API strategy, as it is all too easy to design
    an API you think makes sense, but others with less knowledge of the application
    do not easily understand. A good way to develop a developer community around your
    API is to publish designs for feedback. Keep in mind the following when designing
    your API for Developer X:


    +   - Developer X is skilled in many platforms and programming languages these
    days, which might not always be Force.com. Increasingly Developer X is also creating
    Mobile, JavaScript, and Heroku applications around your API.

    +   - As the **Internet of Things (IoT)** continues to expand, there is also a
    shift towards device integration from consumer devices such as watches, fridges,
    cars, and jet engines. So, APIs that work well on-platform and off-platform are
    a must.

    +   - Developer X might not have an in-depth knowledge of the application domain
    (its functional concepts), thus it''s important for them to be able to communicate
    with those that do, meaning that your API design and application functionality
    terminology has to be well-aligned.


    The upcoming sections outline general considerations and needs around providing
    both an integration API and general extensibility of your application''s functionality.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# # Versioning


    As your product functionality grows, it is important to manage the impact this
    has on developers and partners who have already adopted your APIs in earlier releases
    of your application and not force them to make code changes unless needed. Where
    possible, maintain backwards compatibility such that even after your application
    has been upgraded in a subscriber org, existing integrations and extensions continue
    to work without modification (multiple versions of your application code are not
    stored in a subscriber org).


    Without backwards compatibility you can inhibit upgrades to your application within
    your customer base, as the time spent by Developer X addressing API issues can
    delay upgrades and be expensive. Some subscribers might have utilized consulting
    services to affect the original work or be dependent on one of your partners for
    add-on solutions using your API.


    Versioning falls into two categories: versioning the definition (or contract determined
    input and output of data) and the functionality (or behavior) each API represents.


    # # Versioning the API definition


    Once you have published a specific version of an API, do not change its definition,
    for example the Custom Objects, fields, Apex classes, methods, or members, or
    equivalent REST or SOAP constructs. Even though the platform will help avoid certain
    changes, additions can be considered a breaking change, especially new required
    fields. Anything that changes the definition or signature of the API can be considered
    a potential breaking change.


    Developer X should be able to modify and redeploy their existing integrations
    or extensions without having to recode or adjust their code using your API and
    without forcing them to upgrade to the latest version of your API, unless, of
    course, they want to access new functionality only accessible by completing new
    fields. Note that this is different from upgrading the package itself within the
    subscriber org, which must be allowed to happen.


    The standard Salesforce APIs and platform help provide versioning when Developer
    X interacts with your Custom Objects and Application APIs. Versioning is implemented
    as follows:


    +   - In an Apex code context, the platform retains the version of your package
    installed when the Apex code was first written by Developer X, and then only ensures
    that Apex classes, methods, members, Custom Objects, and fields visible in this
    packaged version are visible to the code. This feature is something that we will
    explore in further detail later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '+   * In the case of the SOAP and REST APIs, by default the latest version
    of your Custom Objects is visible. When using the SOAP API, header values can
    be passed in such calls to lock a particular package version if needed (search
    for PackageVersionHeader in Apex Developer''s Guide). Alternatively the packaged
    version used by these APIs can be set at an org-configuration level.


    # # Versioning application access through the Salesforce APIs


    Under the Setup menu, search for API. You will find a setup page that allows you
    to download the WSDLs for one of the many Salesforce SOAP APIs. In the next section
    there are some versioning settings that determine which installed package version
    should be assumed during interactions with your packaged objects.


    For example, when performing a describeSObject web service operation via the Salesforce
    Enterprise or Partner APIs, these APIs will return different custom fields depending
    on when new fields were added, as new versions of the package have been released
    over time. The default behavior will return all fields as the default is the current
    package version.


    If this is important to Developer X or third-party solutions when using these
    Salesforce APIs, the subscriber administrator can specify an explicit previous
    version. If they do this, new fields available in future package versions will
    not be available unless this is changed. The following screenshot shows how these
    settings can be accessed on the API page under Setup:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_353_0.png)


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_353_1.png)'
  merge: -1
  img_proc: true
- pgno: 354
  md: "# Versioning the API functionality\n\nWhen offering new versions of your application\
    \ to users through the UI, new features are accessed by the user — either by opting\
    \ into the feature by configuration using a new page or button, or sometimes just\
    \ seamlessly such as a new type of calculation, optimization, or improvement to\
    \ existing behavior with added benefits.\n\nAs the API is just another way into\
    \ your application's logic, you should think about enabling these new features\
    \ through the API in conceptually the same way. If it is seamlessly available\
    \ through the UI to users, it becomes so in the API regardless of the API version,\
    \ and thus, solutions built around your application's API will also benefit automatically\
    \ without changes to the integration or extension code. However, if there is a\
    \ new field or button needed in the UI, then a new API parameter or operation\
    \ will be needed to enable the new feature. It is reasonable for this to be exposed\
    \ in a new version of your API definition. Thus, Developer X will have to modify\
    \ the existing code, test it, and deploy it before the solution can leverage it.\n\
    \nTrying to be sophisticated in your code by providing exactly the same behavior\
    \ to older callers of your API will depend on the Service and Domain layers understanding\
    \ the concept of API versus UI contexts and package versioning, which will rapidly\
    \ become complex for you to develop, test, support, and document.\n\n> Agree and\
    \ communicate to your customers and partners clearly how many versions of your\
    \ API you will support and give warning on retirements. Always be sure to test\
    \ your APIs at different versions to ensure the lack of fields that arrive later\
    \ in your package, which are not provided by older callers, does not cause errors\
    \ or unwanted behavior in these cases. Try to avoid adding new required fields\
    \ to your applications without a way to default them.\n> \n> If in your regression\
    \ testing of older API versions, you notice a reduction in data volume throughput\
    \ due to governors, it can be acceptable to condition newer logic (such as checks\
    \ for newer fields). Again, be careful with how often you implant this type of\
    \ conditional logic in your code base.\n\n# Translation and localization\n\nAs\
    \ with the guidelines around the Service layer, which can be used as a means to\
    \ form your application API later in this chapter, you should ensure that any\
    \ error or status messages are translated according to your use of Custom Labels,\
    \ as described in Chapter 2, Leveraging Platform Features (the Apex runtime will\
    \ ensure that the user locale determines the translation used)."
