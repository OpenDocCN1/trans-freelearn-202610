- pgno: 112
  md: 'If you are creating **logging** solutions in your application, keep in mind
    the storage usage for this type of data. For example, how does the user perform
    bulk deletion of the records? Should this be scheduled? Also, how do you communicate
    this information to them? A log object can be configured with workflow rules by
    the subscriber to perhaps e-mail users as critical log entries are inserted.

    If your users are using Chatter, you may want to consider providing the facility
    (perhaps as an option through dynamic Apex, to avoid a package dependency) of
    using a Chatter post to notify the user. Chatter posts, comments, and track changes
    are not counted by Salesforce under storage usage. However, any files and photos
    you upload are counted against file storage.


    # # Considerations for configuration data


    Most applications need to provide some way to configure their functionality to
    allow administrators and users to tailor it to their needs. As we have seen in
    Chapter 2, Leveraging Platform Features, Salesforce provides a great deal of facilities
    for this for you and your users. However, what if the part of your application
    you want to provide configuration for is unique to your application domain, for
    example in a list of official fastest lap times for each track.


    In our case, imagine we want to provide to our customers as part of the package
    the current approved list of fastest lap times for each track, so that they don''t
    have to look this up themselves and enter them manually. However, you still want
    to allow users to manage fastest laps for tracks not known to your application.


    Custom Settings and Custom Metadata Types are two platform features to consider
    for storing and managing configuration for your application before considering
    Custom Objects. Custom Metadata in many ways is a successor to both alternatives,
    though at this time there are still some features that may cause you to consider
    using other options.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'The following table helps you decide which object type to use based on your
    configuration requirements:


    | Configuration Object Requirement | Custom Object | Custom Setting Object | Custom
    Metadata Type Object |

    | :--- | :--- | :--- | :--- |

    | Objects can be hidden from org administrators | No | Yes | Yes |

    | Records can be included in your package | No | No | Yes |

    | Packaged records can be protected from user edits and upgraded | N/A | N/A |
    Yes |

    | Ability to edit fields on packaged records can controlled | N/A | N/A | Yes
    |

    | Layout of the standard Salesforce UI can be defined and packaged | Yes | No
    | Yes |

    | Object relationships are supported for more complex configuration | Yes | No
    | Yes |

    | Apex access | CRUD | CRUD | Read ** |

    | Records can be defined at an org, user or profile level | No | Yes | No |

    | Records can have custom validation applied via Validation Rules and/or Apex
    Triggers | Yes | No | No |

    | Reduction in configuration management overhead | Rekey or use Data Loaders |
    Rekey or use Data Loaders | Install by default also use native Change Sets and
    Packages to manage customer specific configuration |

    | Ability for partners and other developers to build extension packages that package
    specific forms of your configuration | No | No | Records can also be included
    extension packages |'
  merge: -1
  img_proc: true
- pgno: 114
  md: "> When reading Custom Metadata Type records, SOQL can be used and it does not\
    \ count towards the SOQL query governor, though the 50k row limit still applies.\
    \ Custom Metadata Type records can be manipulated using the Salesforce SOAP Metadata\
    \ API CRUD operations.\n> \n> Though the Metadata SOAP API can be called via Apex,\
    \ restrictions around HTTP callouts still apply. Restrictions around the frequency\
    \ and when HTTP callouts can be made make this approach less desirable when scaling\
    \ above 200 records. Also, maintaining referential integrity between calls is\
    \ not supported, as there is no database transaction scope around the API calls.\
    \ At the time of writing Salesforce have announced that native support for Metadata\
    \ API is under development, although there is no commitment to deliver with their\
    \ statement.\n\nIn our case, the desire to package track lap time configuration\
    \ records and thus allow it to be upgraded fits well with Custom Metadata Types.\
    \ There is also no need to update this configuration information programmatically\
    \ from Apex, only read it.\n\nThe current inability to update Custom Metadata\
    \ Type records is something that might be an issue for you if you wish to build\
    \ a custom UI for your configuration, in our case the Standard Salesforce UI is\
    \ sufficient.\n\n# Custom Metadata Type storage\n\nFrom the Custom Metadata Types\
    \ page under Setup you can both create Custom Metadata Type objects and manage\
    \ the records they contain. Any records you create can be included in your package\
    \ and are thus available to your Apex logic immediately after the installation\
    \ of your package.\n\nPerform the following steps to create the Track Lap Records\
    \ MDT object.\n\n+   1. Create a Track Lap Records custom metadata type by clicking\
    \ on New, and enter `TrackLapRecords` as the API name.\n+   \n+   2. From the\
    \ Visibility field select **All Apex code and APIs can use the type**, and it\
    \ is visible in Setup. This is done since we want to allow the administrator to\
    \ record their own fastest lap times in addition to those we include. You would\
    \ choose the option **Only Apex code in the same managed package can see the type**,\
    \ if all records in this object are to be used only by your application logic,\
    \ for example for internal configuration."
