- pgno: 439
  md: '# Benefits of Dependency Injection Frameworks


    So far we have discussed ways in which you can achieve dependency injection by
    using factories or constructors and implementing Apex Interfaces to inject alternative
    mock implementations of classes you wish to mock. DI frameworks offer ways for
    developers to access certain underlying language runtime features that can provide
    more direct ways to implement these aspects.


    Thus DI frameworks tend to help developers gain easier access to the benefits
    of DI with much less boilerplate coding such as utilizing interfaces, especially
    in older code bases. However the developer may still have to write the mock implementations
    such as those we have seen above and manage dependencies between classes carefully
    via SOC.


    Java for example leverages its reflection API to allow the injection at runtime
    without the need for interfaces. The Java Spring framework extends this feature
    by allowing configuration via XML files to allow for different runtime configurations.
    Some frameworks will also intercept the use of the native *new* operator. This
    avoids the need to implement factory- or constructor based injection approaches
    outlined in the preceding code.


    A relatively recent addition to the Apex runtime is the **Apex Stub** API. This
    is one such DI framework provided by Salesforce as part of their platform. It
    does not override the *new* operator. The developer still needs to implement an
    injection approach such as those described earlier. However, it does make it easier
    to adopt mocking in legacy code bases (where interfaces have not been applied).
    The rest of this chapter will continue to explore this API in more detail and
    frameworks will be built on top of it.


    # Writing Unit Tests with the Apex Stub API


    The **Apex Stub** API applies only within an Apex test context. So it cannot be
    used to implement DI outside of tests. For this you still need to leverage Apex
    interfaces.


    Utilizing the APIs requires an understanding of the following:


    +   - Implementing the Stub Provider interface: The `System.StubProvider` system-provided
    Apex interface is effectively a callback style interface. It allows your mocking
    code to be informed when method calls are against classes you are mocking in your
    test. You can implement this interface multiple times, once per class you''re
    mocking, or a single implementation for building sophisticated generalized mocking
    frameworks. The Apex Mocks open source framework from FinancialForce.com is one
    such framework that we will be reviewing later.'
  merge: -1
  img_proc: true
- pgno: 440
  md: "+   * Dynamic Creation of Stubs for Mocking: The platform automatically creates\
    \ instances of classes you wish to mock through the Test.createStub method. You\
    \ do not need to create Apex interfaces to perform DI when using the Stub API.\
    \ The only requirement is that you provide the platform with an implementation\
    \ of the Test.StubProvider interface to callback on when methods on the created\
    \ stub instance are called during test execution.\n\n# Implementing Mock classes\
    \ using Test. StubProvider\n\nImplementing mock handling code with the System.StubProvider\
    \ requires only one method to be implemented as opposed to each of the methods\
    \ being mocked individually. This is because this interface is a generic interface\
    \ for all possible method signatures.\n\nAs you can see from the following implementation\
    \ of the MockDashboard class, the handleMethodCall method on this interface passes\
    \ all the information your mocking code needs in order to identify which method\
    \ on which object has been called.\n\n```\nprivate class MockDashboard implements\
    \ System.StubProvider {\n\n    public Boolean initialiseCalled = false;\n\n  \
    \  public Object handleMethodCall(\n        Object stubbedObject,\n        String\
    \ stubbedMethodName,\n        Type returnType,\n        List<Type> listOfParamTypes,\n\
    \        List<String> listOfParamNames,\n        List<Object> listOfArgs) {\n\n\
    \        // Record method call\n        if(stubbedMethodName == 'initialise')\
    \ {\n            initialiseCalled = true;\n        }\n\n        return null;\n\
    \    }\n}\n```\n\nOnce again this mock implementation implements only the minimum\
    \ needed to satisfy the mocking requirements of the test being performed. It simply\
    \ validates that the initialise method was called."
