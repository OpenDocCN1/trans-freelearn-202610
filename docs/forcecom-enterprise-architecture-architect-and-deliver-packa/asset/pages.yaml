  md: "This following second example also reworks the code from the previous chapter\
    \ to leverage the Domain layer. In this case, the RaceService class also implements\
    \ an awardChampionshipPoints method. This can also benefit from the Contestants\
    \ Domain class method. Note how easy it is to reuse methods between the Service\
    \ and Domain layers, as both ensure that their methods and interactions are bulkified.\n\
    \n```\npublic class RaceService {\n    public void awardChampionshipPoints(Set<Id>raceIds)\
    \ {\n        fflib_SObjectUnitOfWork uow =\n        Application.UnitOfWork.newInstance();\n\
    \n        List<Contestant__c> contestants =\n        new List<Contestant__c>();\n\
