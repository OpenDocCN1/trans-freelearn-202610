- pgno: 478
  md: 'Once again right-click on the project in the Package Explorer, then from under
    the Force.com sub menu, select the Project Properties option. Complete the login
    details using the developer edition org you deployed to earlier in this chapter
    then click Apply.


    > Once you click Apply you may be asked whether you want to re-fetch and overwrite
    the projects all Force.com components in the project. Select No. This is because
    the project folder already has source code contained within it and the org your
    using was populated from the same folder contents, there is no need for the wizard
    to download.


    The Force.com IDE project wizard creates a /.settings folder, /Referenced Packages
    and .project and salesforce.schema files in the repository''s root folder. You
    can use the .gitignore facility to omit these from Source Control visibility unless
    everyone in your team is using Force.com IDE. This screenshot shows how the project
    looks after creation, allowing you to begin editing your Apex code immediately:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_478_0.png)'
  merge: -1
  img_proc: true
- pgno: 479
  md: 'You are also able to edit files that represent Custom Objects and fields:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_479_0.png)


    If you choose to combine this development approach with the browser-based approach,
    the Force.com IDE offers a way to refresh the files from within the desktop tool.
    Simply right-click on the folder and select the appropriate option. This facility
    effectively performs a retrieve operation similar to that described in the earlier
    section via the Ant build.xml script. As such, watch out for similar side-effects
    in terms of additional files or file changes.


    # Hooking up Continuous Integration


    So far we have been depending on the developer to ensure that the changes they
    push up to the GitHub remote repository do not cause regressions elsewhere in
    the application, by running Apex tests before making their commits. This is always
    a good practice!


    However, this is not always a fully reliable means of determining the quality
    of the code, as the main code base will likely have moved on due to other developers
    also pushing their changes. When integrated together, they might cause tests or
    even code to fail to compile. Continuous Integration monitors changes to the Source
    Control repository and automatically starts its own build over the fully integrated
    source code base. Failures are reported back to the developers who last pushed
    code to the repository.'
  merge: -1
  img_proc: true
- pgno: 480
  md: 'In this part of the chapter, we are going to explore this process using the
    popular Jenkins Continuous Integration server that uses the Ant script to perform
    the build step. Before we get into setting this up, let''s take a moment to review
    the CI process that we are going to use.


    # The Continuous Integration process


    The following diagram shows the CI process that we will be setting up over the
    course of the next few sections. Once you have a basic CI setup like this, you
    can start to add other features such as code documentation generation, static
    code analysis, security code scanner, and automated regression testing (something
    we will discuss briefly later on).


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_480_0.png)


    The following is the CI process:


    +   1. Developers make multiple contributions to Source Control, just as we did
    earlier in this chapter via the GitHub UI desktop client.

    +   2. The CI server is able to poll (configurable) the Source Control server
    (in our case, the GitHub remote repository) for changes.

    +   3. Once changes are detected, it downloads the latest source code into a local
    workspace folder.

    +   4. A part of the configuration of the CI server is to inform it of the location
    of the Ant `build.xml` script to execute after the workspace is set up.

    +   5. A build org is simply a designated developer org set aside solely for the
    use of the CI process. We will create one of these shortly for this purpose, though,
    with Salesforce DX a scratch org can be created and deleted dynamically. As with
    the deploy process, the same Ant script is used to deploy the code to the build
    org (thus confirming code compilation) and run Apex tests.'
  merge: -1
  img_proc: true
- pgno: 481
  md: "6. As described earlier, developer orgs are used to develop the changes that\
    \ are unmanaged environments as opposed to managed. Some of the constraints, such\
    \ as the ability to change a previously released `global` Apex class, that would\
    \ normally apply are not enforced. In this step, a verification check-only deployment\
    \ is performed against the packaging org to confirm that the code would, when\
    \ needed, still deploy to the packaging org for release. This step can also help\
    \ validate that code and tests continue to execute in a managed namespace context.\
    \ This deployment is only a check, no changes are made to the packaging org regardless\
    \ of the outcome.\n\n7. Finally, the CI server will record the log and results\
    \ of the build for analysis and the number of success versus failed builds and\
    \ provide reports and notifications on the overall health of the source code in\
    \ Source Control. If there are failures, there are options to e-mail certain team\
    \ members as well as specific targets (those who made the most recent changes).\
    \ Making sure a team stops what they are doing and attends to a broken build is\
    \ very important. The longer the broken builds exist, the harder they are to solve,\
    \ especially when further changes occur.\n\n# # Updating the Ant build script\
    \ for CI\n\nBefore we can set up our CI server, we need to ensure that our Ant\
    \ script has an appropriate entry point for it. This is similar to that used by\
    \ the developer in the steps described earlier. The following is a new target\
    \ designed as an entry point for a CI server. More complex scripts might involve\
    \ some reuse between developer usage and CI usage.\n\nThe following target will\
    \ clean the build org (by virtue of the dependency on the `undeploy` target) and\
    \ then deploy to it. It will then perform a second deploy to perform a check-only\
    \ deployment to the packaging org. If you are following along, commit the changes\
    \ to the `build.xml` file so that the Jenkins server can see the new target when\
    \ it downloads the latest source code from GitHub.\n\n```\n<target name=\"deploy.jenkins\"\
    \ depends=\"undeploy\">\n  <sf:deploy\n    username=\"${sf.username}\"\n    password=\"\
    ${sf.password}\"\n    serverurl=\"${sf.server}\"\n    runAllTests=\"true\"\n \
    \   deployRoot=\"${basedir}/src\"/>\n  <sf:deploy\n    username=\"${sf.package.username}\"\
    \n    password=\"${sf.package.password}\"\n    serverurl=\"${sf.server}\">\n```"
  merge: -1
  img_proc: true
- pgno: 482
  md: '```

    checkOnly="true"

    runAllTests="true"

    deployRoot="${basedir}/src"/>

    </target>

    ```


    # # Installing, configuring, and testing the Jenkins CI server


    Setting up a Jenkins server is a broad topic beyond the scope of this chapter.
    A good way, however, to get started is to go to http://jenkins-ci.org/ and download
    one of the prebuilt installations for your operating system. In this case I used
    the Mac pkg file download. After installation, I was able to navigate to http://localhost:8080
    to find Jenkins waiting for me!


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_482_0.png)


    Jenkins has a plugin system that permits many custom extensions to its base functionality,
    by clicking on Manage Jenkins and then Manage Plugins to locate a GitHub Plugin:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_482_1.png)'
  merge: -1
  img_proc: true
- pgno: 483
  md: 'Once this plugin is installed, you can create a Jenkins job that points to
    your GitHub repository and Ant script to execute the `deploy.jenkins` target defined
    earlier. On the Jenkins main page, click on **New Item** and select the **Build
    a free-style software project** option. Complete the following steps to create
    a build project:


    +   1. Complete the **Project Name** field with an appropriate name, such as `FormulaForce
    Build`.


    +   2. In the **GitHub project** field, enter the full URL to your GitHub repository,
    for example `https://github.com/afawcett/formulaforce-chapter13`.


    +   3. Under the **Source Control Management** section, select **Git**.


    +   4. In the **Repository URL** field, enter your GitHub repository URL, which
    is different from the preceding URL and takes the format of `https://github.com:githubuser/repositoryname.git`,
    for example, `https://github.com:afawcett/formulaforce-chapter13.git`.


    +   5. If your repository is private and not public, you will need to ensure that
    you have exchanged deployment keys between Jenkins and your GitHub account. This
    involves generating a key and copying and pasting it to the **Deploy** keys section
    in your GitHub repository settings. For the purposes of this book, it is recommended
    that you use a public GitHub repository.


    +   6. Although not recommended for a production Jenkins server, let''s set it
    to poll every minute for changes to the repository. In the **Build Triggers**
    section, select **Poll SCM** and enter `*/1 * * * *` in the **Schedule** field.


    +   7. Scroll further down the project setup page to the **Build** section, and
    from the **Add build step** drop-down select **Invoke Ant**.


    +   8. In the **Targets** field, enter `deploy.jenkins` (as per the name of the
    Ant target created in the `build.xml` file).


    +   9. Click on the **Advanced** button, then click on the black down arrow icon
    to the right of the **Properties** field to expand it so that you are able to
    enter multiple properties. The `deploy.jenkins` Ant target that we created earlier
    requires the `username` and `password` parameters to deploy to the build org and
    perform the check deploy to the packaging org. Enter the property name-value pairs
    on separate lines as follows:


    ```

    sf.username=buildorgusername

    sf.password=buildorgpasswordbuildorgtoken

    sf.package.username=packagingorgusername

    sf.package.password=packagingorgpasswordpackagingorgtoken

    ```


    +   10. Click on the **Save** button at the bottom of the page.'
  merge: -1
  img_proc: true
- pgno: 484
  md: 'After a minute, Jenkins realizes that there has not been a build yet and starts
    one. However, you can also click on the project and click on the **Build Now**
    button if you cannot wait!


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_484_0.png)


    If you click on the hyperlink to the build itself (shown in the sidebar), you
    can monitor in real time the Ant script log just as if you had run it manually:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_484_1.png)


    After this build completes, Jenkins will resume monitoring the GitHub repository
    for changes and automatically start a new build when it detects one.


    # # Exploring Jenkins and CI further


    This section has barely scratched the surface of what is possible with Jenkins
    and Ant scripts. You can either extend your Ant scripts to perform additional
    checks as described earlier and/or even custom logic to write back statistics
    to your own Salesforce production environment. Continue to explore this process
    a bit further by making some minor and some major changes to the repository to
    see the effects.'
  merge: -1
  img_proc: true
- pgno: 485
  md: 'For example, try changing the method name of one of the global Apex methods
    (for example, ComplianceService.report to ComplianceService.reportX) as well as
    the methods in ComplianceResource and ComplianceResource_1_0 calling it. While
    this compiles in the developer and build orgs, it eventually results in the following
    error from the Jenkins build, as the check deployment to the packaging org failed
    because published global methods cannot be removed or renamed. In this case, the
    following build failure will be reported by Jenkins:


    ```

    classes/ComplianceService.cls -- Error: Global/WebService identifiers cannot be
    removed from managed application: Method: LIST<fforce>. ComplianceService.VerifyResult>
    report(SET<Id>) (line 1, column 8)

    ```


    The dashboard on Jenkins shows the project with a dark cloud as one out of the
    last two builds have now failed. It is time to fix the build:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_485_0.png)


    Once a new build completes successfully, Jenkins rewards you with some sunshine:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_485_1.png)'
  merge: -1
  img_proc: true
- pgno: 486
  md: "# # Releasing from Source Control\n\nWhen you're ready to release a beta or\
    \ release version of the package for your application, you will transfer the source\
    \ code from Source Control into your packaging org. Thankfully, this can also\
    \ be achieved with the help of the following Ant script target. Note that unlike\
    \ the deploy Ant target, this does not attempt to clean the target org!\n\n```\n\
    <target name=\"deploy.package\">\n    <sf:deploy\n        username=\"${sf.username}\"\
    \n        password=\"${sf.password}\"\n        serverurl=\"${sf.server}\"\n  \
    \      runAllTests=\"true\"\n        deployRoot=\"${basedir}/src\"/>\n</target>\n\
    ```\n\nThe process of updating the packaging org can only be partially automated\
    \ by running the preceding Ant target, as you still need to log in to the packaging\
    \ org to add brand new components that are not automatically added through a relationship\
    \ with components already in the package.\n\nThe following is a list of recommended\
    \ steps to update and confirm that the content of your packaging org matches the\
    \ content of Source Control:\n\n+   1. Run the following command (all on one command\
    \ line):\n+      ant deploy.package\n+      -Dsf.username=packagingusername\n\
    +      -Dsf.password=packagingpasswordpackagingtoken\n+   \n+   2. Log in to the\
    \ packaging org and review the contents of the package. You can utilize the **Add\
    \ Component** page to determine whether components now reside in the packaging\
    \ org that are not presently included in the package.\n+   \n+   3. Rename the\
    \ /src folder to /src.frommsc and create a new /src folder. Then, run the retrieve.package\
    \ Ant target as per the command line you used to download files from the packaging\
    \ org at the beginning of this chapter.\n+   \n+   4. Compare the /src and /src.frommsc\
    \ folders using your favorite file comparison tool. Review differences to determine\
    \ whether changes exist either in the packaging org or in the Source Control system\
    \ that do not belong to the application being packaged!"
  merge: -1
  img_proc: true
- pgno: 487
  md: '5. As per best practice, confirm that your package dependencies are still as
    expected. Then, perform an upload in the usual way as discussed in the previous
    chapters.


    # # Automated regression testing


    While Apex tests are very much a key tool in monitoring regressions in your application,
    the limitations and scope of functionality they can test is small, particularly
    to perform volume or user interface testing (clients using JavaScript for example).


    > > You might wonder why the Ant script used by Jenkins deploys twice, as the
    check deploy to the packaging org will confirm whether the Apex code compiles
    and that all Apex tests complete successfully. The reason is that having the build
    org deployed with the latest build allows for it to go on to be used for other
    purposes, such as executing further regression testing steps.


    Here are some considerations to implement further testing approaches:


    +   - It is possible to execute the Apex code from the Ant scripts using the approach
    described earlier in this chapter, when we populated the developer org with sample
    data by calling the SeasonService.createTestSeason method. You can extend this
    approach by using loop constructs within Ant to create volume data or start more
    Batch Apex jobs (Apex tests only permit a single chunk of 200 records to be processed),
    pause for completion, and assert the results.

    +   - The Salesforce data loader tool is actually a Java program with a command-line
    interface. Thus, you could consider using it to load data into a build org to
    test against different datasets, used in combination with the preceding Apex code
    executed to clean records between tests.

    +   - Once you have the data loaded into the build org, you can execute tests
    using a number of Salesforce testing tools. For example, the Selenium WebDriver
    tool is an excellent choice, as it provides a headless mode (no need for a physical
    screen) and can be run on multiple operating systems. This tool allows you to
    test Visualforce pages with large amounts of JavaScript (http://docs.seleniumhq.org/projects/webdriver/).'
  merge: -1
  img_proc: true
- pgno: 488
  md: '# # Summary


    In this final chapter of the book, we have seen how to scale developer resources
    to the development of your enterprise application using industry strength Source
    Control tools, development processes, and servers such as Jenkins.


    Some of the steps described in this chapter might initially seem excessive and
    overly complex compared to developing within a single packaging org or using other
    manual approaches to export and merge changes between developer orgs. Ultimately,
    more time is lost in resolving conflicts manually and not to mention the increased
    risk of losing changes.


    Certainly, if your business is aiming to be audited for its development processes,
    adopting a more controlled approach with tighter controls over who has access
    to not only the source code but also your mechanism to release it (your packaging
    org) is a must.


    Opening up your Force.com development process to tools such as Git for example
    allows for a much better developer interaction for aspects such as code reviews
    and carefully staging features in development to release. Such tools also give
    a greater insight into statistics around your development process that allow you
    optimize your development standards and productivity further over time.'
  merge: -1
  img_proc: true
