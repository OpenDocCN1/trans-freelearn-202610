- pgno: 212
  md: 'To help you understand how traditional Apex Trigger events are mapped to the
    various virtual methods in the base class, this table describes the code path
    taken from when the base class''s fflib_SObjectDomain.triggerHandler method is
    invoked through the specific event-based methods that can be overridden by a Domain
    class:


    | Trigger context | Base class Records property value | Base class handle method
    called (refer to the following note) | Base class event method(s) called (refer
    to the following note) |

    | :--- | :--- | :--- | :--- |

    | Trigger.isBefore | | | |

    | Trigger.isInsert | Trigger.new | handleBeforeInsert() | onApplyDefaults()<br>onBeforeInsert()
    |

    | Trigger.isUpdate | Trigger.new | handleBeforeUpdate(Map<Id, SObject> existingRecords)
    | onBeforeUpdate(Map<Id, SObject> existingRecords) |

    | Trigger.isDelete | Trigger.oldMap | handleBeforeDelete() | onBeforeDelete()
    |

    | Trigger.isAfter | | | |

    | Trigger.isInsert | Trigger.new | handleAfterInsert() | onValidate()<br>onAfterInsert()
    |

    | Trigger.isUpdate | Trigger.new | handleAfterUpdate(Map<Id, SObject> existingRecords)
    | onValidate(Map<Id, SObject> existingRecords)<br>onAfterUpdate(Map<Id, SObject>
    existingRecords) |

    | Trigger.isDelete | Trigger.oldMap | handleAfterDelete() | onAfterDelete() |'
