    This type of Lightning Application is known formally as a Standalone Lightning
    App in the Lightning Components Developer Guide (you can refer to https://developer.salesforce.com/docs/atlas.en-us.lightning.meta/lightning/intro_framework.htm).


    # Introduction to Lightning Design System


    Lightning brings with it a rich and sophisticated CSS library for styling the
    look and feel of your HTML. This has been previously referenced as Salesforce
    Lightning Design System (LDS). While you can include its CSS as a static resource
    in your application, for native Lightning UIs such the ones featured in this chapter
    that is not required.


    By using the extends attribute in the following code, we can ask the framework
    to always include the latest platform version and start using its CSS classes
    to brighten up our output:


    ```

    <aura:application extends= force:slds">

    <div class="slds-notify_container">

    <div class="slds-notify slds-notify--alert slds-theme--success

    slds-theme--alert-texture" role="alert">

    <span class="slds-assistive-text">Success</span>

    ```'
