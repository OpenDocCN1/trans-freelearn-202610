- pgno: 223
  md: "The Apex runtime `Type.newInstance` method is then used to construct an instance\
    \ of the Domain and Selector classes. The factory functionality is invoked by\
    \ calling the `Application.Domain.newInstance` method. The `Domain` field on the\
    \ Application class is implemented using the `fflib_Application.DomainFactory`\
    \ class as follows:\n\n```\npublic class Application {\n  public static final\
    \ fflib_Application.DomainFactory Domain =\n    new fflib_Application.DomainFactory(\n\
    \      Application.Selector,\n      // Map SObjectType to Domain Class Constructors\n\
    \      new Map<SObjectType, Type> {\n        Race__c.SObjectType => Races.Constructor.class,\n\
    \        Car__c.SObjectType => Cars.Constructor.class,\n        Driver__c.SObjectType\
    \ => Drivers.Constructor.class\n      });\n}\n```\n\n> As a developer you can\
    \ of course instantiate a specific Domain class directly. However, this Domain\
    \ factory approach allows for the specific Domain class to be chosen at runtime\
    \ based on the SObjectType associated with the ID passed to the newInstance method.\
    \ This is key to implementing the generic service entry point as shown in the\
    \ next step. The preceding initialization of the Domain factory also passes in\
    \ Application.Selector; this is another factory relating to classes that are able\
    \ to query the database. The next chapter will cover the Selector pattern and\
    \ the Selector factory in more detail.\n\n# Step 8 – implementing a generic service\n\
    \nThe `Application.Domain.newInstance` method used in the following code is used\
    \ to access the Domain instance factory defined in the last step.\n\nThis method\
    \ returns `fflib_ISObjectDomain`, as this is a common base interface to all Domain\
