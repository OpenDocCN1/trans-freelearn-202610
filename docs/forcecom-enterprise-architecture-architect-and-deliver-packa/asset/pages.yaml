- pgno: 466
  md: "In this chapter, we will update the Ant build.xml script file to allow it to\
    \ deploy the application source code into new Developer Edition orgs as needed.\
    \ Before this, we will use the Ant sf:retrieve task provided by the salesforce-ant.jar\
    \ file to retrieve the latest content of our FormulaForce package, which you have\
    \ been developing so far, in the form of component source files, which we will\
    \ migrate to Source Control.\n\n> Note that we are performing this step due to\
    \ the approach we have taken in this book, which is starting with development\
    \ in the packaging org. If you are not starting from this point, you can create\
    \ a /src folder and the package.xml file as described manually. That being said,\
    \ you might want to make some initial inroads within the packaging org to establish\
    \ a package and namespace with some initial objects.\n\nThe following build.xml\
    \ target retrieves the content of the package defined in the packaging org and\
    \ populates the /src folder. Make sure that your Package name is called FormulaForce.\
    \ If not, update the packageNames attribute as follows:\n\n```\n<target name=\"\
    retrieve.package\">\n    <sf:retrieve\n        username=\"${sf.username}\"\n \
    \       password=\"${sf.password}\"\n        retrieveTarget=\"${basedir}/src\"\
    \n        packageNames=\"FormulaForce\"/>\n</target>\n```\n\n> You can see the\
    \ name of your package shown in the black banner in the top-right corner of the\
    \ Salesforce page header when logged into the packaging org.\n\nPerform the following\
    \ command (all on one command line) with your own username, password, and token\
    \ to execute the retrieve target. Ensure that you have changed the location to\
    \ the root folder of your local repository first:\n\n```\nant retrieve.package\n\
    \  -Dsf.username=yourusername\n  -Dsf.password=yourpasswordyourtoken\n```"
  merge: -1
  img_proc: true
- pgno: 467
  md: "You should see something like the following in your local repository folder:\n\
    \n| Folders | Folders | Documents |\n|---|---|---|\n| src | applications | Application.cls\
    \ |\n| bin | classes | Application.cls-meta.xml |\n| .git | labels | Cars.cls\
    \ |\n| | layouts | Cars.cls-meta.xml |\n| | objects | CarsSelector.cls |\n| |\
    \ pages | CarsSelector.cls-meta.xml |\n| | permissionsets | ComplianceController.cls\
    \ |\n| | quickActions | Compliance...-ls-meta.xml |\n| | tabs | ComplianceService.cls\
    \ |\n| | triggers | Compliance...-ls-meta.xml |\n| Documents | Documents | ComplianceServiceTest.cls\
    \ |\n| build.xml | package.xml | ContestantController.cls |\n| README.md | | ContestantC...-ls-meta.xml\
    \ |\n\n> You might find references to the package namespace present in the code\
    \ and metadata files retrieved. These should be removed, otherwise the files might\
    \ not deploy or execute within an unmanaged developer org. You can use file search\
    \ utilities to find such references. For example, open the /layouts/Contestant__c-Contestant\
    \ Layout.layout file and search for QuickActionName, then remove the namespace\
    \ reference.\n\nBefore we are ready to commit this to your local repository (required\
    \ before you can upload or push to the GitHub remote repository), open the package.xml\
    \ file created by the retrieve operation and convert it to a more generic form.\
    \ The one created by the preceding process contains explicit lists of each of\
    \ the components in the package.\n\nThis means that if developers add new component\
    \ files within the subfolders such as /classes, /pages, and /objects for example,\
    \ they will not be subsequently deployed automatically without first having to\
    \ update the package.xml file.\n\nTo avoid the developer from having to remember\
    \ to do this, the package.xml file can be updated to use wildcards instead. For\
    \ example, open the package.xml file and replace explicit references with wildcard\
    \ characters, as shown in the following examples:\n\n```\n<types>\n    <members>*</members>\n\
    \    <name>ApexClass</name>\n</types>\n<types>\n    <members>*</members>\n   \
    \ <name>ApexPage</name>\n</types>\n```"
