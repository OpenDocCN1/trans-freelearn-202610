- pgno: 221
  md: "Before we look further into how this service method can be implemented, take\
    \ a look at the new `ICompliant` interface and the `verifyCompliance` method that\
    \ will be implemented by the Drivers and Cars Domain classes:\n\n```\npublic class\
    \ ComplianceService {\n/**\n * Interface used to execute compliance checking logic\n\
    \ * in each domain class\n */\npublic interface ICompliant {\nList<VerifyResult>verifyCompliance();\n\
    }\n\n/**\n * Results of a compliance verification for a given record\n */\npublic\
    \ class VerifyResult {\npublic Id recordId;\npublic String complianceCode;\npublic\
    \ Boolean passed;\npublic String failureReason;\n}\n}\n```\n\n# Step 6 – implementing\
    \ the domain class interface\n\nThe `Drivers` Domain class implements the interface\
    \ as follows (only a portion of the class is shown). It checks whether the FIA\
    \ Super License field is checked and reports an appropriate compliance code and\
    \ failure message if not:\n\n```\npublic class Drivers extends ApplicationDomain\n\
    implements ComplianceService.ICompliant {\npublic List<ComplianceService.VerifyResult>\
    \ verifyCompliance() {\nList<ComplianceService.VerifyResult> compliances =\nnew\
    \ List<ComplianceService.VerifyResult>();\nfor(Driver__c driver : (List<Driver__c>)\
    \ Records) {\nComplianceService.VerifyResult license =\nnew ComplianceService.VerifyResult();\n\
    license.ComplianceCode = '4.1';\nlicense.RecordId = driver.Id;\nlicense.passed\
    \ = driver.FIASuperLicense__c;\nlicense.failureReason =\nlicense.passed ? null\
    \ :\n'Driver must have a FIA Super License.';\ncompliances.add(license);\n```"
