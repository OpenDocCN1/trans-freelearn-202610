- pgno: 468
  md: '```

    <types>

    <members>*</members>

    <name>ApexTrigger</name>

    </types>

    ```


    Also remove the fullName, apiAccessLevel and namespacePrefix tags from the package.xml
    file. Repeat the preceding approach for most of the component types in the package.xml
    file, not just the ones shown earlier as examples, with the exception of those
    that are known as **child components**.


    If you compare the preceding example with the package.xml file created previously,
    you will note that some of the components in the original package.xml file are
    child components of the CustomObject component, such as FieldSet, WebLink, CustomField
    and ListView. Also multiple entries for CustomLabel are not needed. Thus, they
    don''t need wildcard entries at all as they will be deployed through their parent
    file, for example, via the CustomObject component''s .object file, which contains
    fields.


    Note that the actual list of components contained within the FormulaForce package
    still resides in the packaging org. The role and purpose of the package.xml file
    within Source Control is different and is more optimized for developer org deployments.


    Finally, commit and sync the preceding changes to your local repository using
    the GitHub UI tool and upload or push (to use the correct Git term). If you run
    the tool, you should see that it is already reporting that new files have been
    detected in the repository folder on your hard disk, as shown in the following
    screenshot of the Mac version of the tool. Simply enter a summary and description
    and click on **Commit & Sync**.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_468_0.png)'
