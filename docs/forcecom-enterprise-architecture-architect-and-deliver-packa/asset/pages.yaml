- pgno: 196
  md: "The service method utilizes the Application class once more; this time a Service\
    \ factory has been used to allow the actual implementation of the IRaceService\
    \ interface to vary at runtime. This allows developers to control which of the\
    \ two preceding implementations shown they want the application to use based on\
    \ their needs. The default is to use the RaceServiceImpl class, however by inserting\
    \ a record in the Services Custom Metadata Type object this can be overridden.\
    \ More on this to follow.\n\nThe factory exposed via the Service field in the\
    \ Application class extends the fflib_Application.ServiceFactory class, which\
    \ instantiates the configured class provided in the Map passed to the factory.\
    \ This factory also supports mocking the service implementation; something that\
    \ will be discussed in more detail in a later chapter.\n\nThe factory has been\
    \ extended to look forconfigured alternative service implementation classes via\
    \ a protected (and thus hidden to end users) custom metadata object called Services,\
    \ which is included in the source code for this chapter.\n\nYou can see this being\
    \ queried as following:\n\n```\npublic class Application {\n    //Configure and\
    \ create the ServiceFactory for this Application\n    public static final fflib_Application.ServiceFactory\
    \ Service = \n        new Application.ServiceFactory (\n            new Map<Type,\
    \ Type> {\n                IRaceService.class => RaceServiceImpl.class });\n\n\
    \    // Customised Service factory overrides via Custom Metadata\n    private\
    \ class ServiceFactory extends\n        fflib_Application.ServiceFactory {\n\n\
    \        private Map<String, String> servicesByClassName = \n            new Map<String,\
    \ String>();\n\n        public ServiceFactory(Map<Type, Type>\n            serviceInterfaceTypeByServiceImplType)\
    \ {\n\n        super(serviceInterfaceTypeByServiceImplType);\n\n        // Map\
    \ of overridden services defined by the developer\n        for(Service__mdtserviceOverride\
    \ : [select DeveloperName,\n            NamespacePrefix, ApexClass__c from Service__mdt])\
    \ {\n            servicesByClassName.put(\n            serviceOverride.NamespacePrefix\
    \ + '.'\n            serviceOverride.DeveloperName,\n            serviceOverride.ApexClass__c);\n\
    \        }\n    }\n}\n```"
