- pgno: 34
  md: '# Building, Publishing, and Supporting Your Application


    The key for turning an idea into reality lies in its execution. From having the
    inception of an idea to getting it implemented as an application and into the
    hands of users is an exciting journey, and one that constantly develops and evolves
    between you and your users. One of the great things about developing on Force.com
    is the support you get from the platform beyond the core engineering phase of
    the production process.


    In this first chapter, we will use the declarative aspects of the platform to
    quickly build an initial version of an application that we will use throughout
    this book, which will give you an opportunity to get some hands-on experience
    with some of the packaging and installation features that are needed to release
    applications to subscribers. We will also take a look at the facilities available
    to publish your application through Salesforce AppExchange (equivalent to the
    Apple''s App Store) and finally provide end user support.


    We will then use this application as a basis for incrementally releasing new versions
    of the application throughout the chapters of this book, building on our understanding
    of enterprise application development. The following topics outline what we will
    achieve in this chapter:


    +   - Required organizations

    +   - Introducing the book''s sample application

    +   - Package types and benefits

    +   - Creating your first managed package

    +   - Package dependencies and uploading

    +   - Introduction to AppExchange and creating listings'
  merge: -1
  img_proc: true
- pgno: 35
  md: '+   - Installing and testing your package

    +   - Becoming a Salesforce partner and its benefits

    +   - Licensing

    +   - Supporting your application

    +   - Customer metrics

    +   - Trialforce and Test Drive


    # ## Required organizations


    Several Salesforce organizations are required to develop, package, and test your
    application. You can sign up for these organizations at https://developer.salesforce.com/.
    Though in due course, as your relationship with Salesforce becomes more formal,
    you will have the option of accessing their **Partner Portal** website to create
    organizations of different types and capabilities. We will discuss this in more
    detail later.


    It''s a good idea to have some kind of naming convention to keep track of the
    different organizations and logins. Use the following table as a guide and create
    the following organizations via https://developer.salesforce.com/. As stated earlier,
    these organizations will be used only for the purposes of learning and exploring
    throughout this book:


    | Username | Usage | Purpose |

    |---|---|---|

    | myapp@packaging.my.com | Packaging | Though we will perform initial work in
    this org, it will eventually be reserved solely for assembling and uploading a
    release. |

    | myapp@testing.my.com | Testing | In this org, we will install the application
    and test upgrades. You may want to create several of these in practice, via the
    Partner Portal website described later in this chapter. |

    | myapp@dev.my.com | Developing | In a later chapter, we will shift development
    of the application into this org, leaving the packaging org to focus only on packaging.
    |


    > > You will have to substitute myapp and my.com (perhaps by reusing your company
    domain name to avoid naming conflicts) with your own values. You should take the
    time to familiarize yourself with andyapp@packaging.andyinthecloud.com.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'The following are other organization types that you will eventually need in
    order to manage the publication and licensing of your application. However, they
    are not needed to complete the chapters in this book:


    | Usage | Purpose |

    |---|---|

    | Production/CRM Org | Your organization may already be using this org for managing
    contacts, leads, opportunities, cases, and other CRM objects. Make sure that you
    have the complete authority to make changes, if any, to this org since this is
    where you run your business. If you do not have such an org, you can request one
    via the Partner Program website described later in this chapter by requesting
    (via a case) a CRM ISV org. Even if you choose to not fully adopt Salesforce for
    this part of your business, this type of org is still required when it comes to
    utilizing the licensing aspects of the platform. |

    | AppExchange Publishing Org (APO) | This org is used to manage your use of AppExchange.
    We will discuss this a little later in this chapter. This org is actually the
    same Salesforce org you designate as your production org, and is where you conduct
    your sales and support activities from. |

    | License Management Org (LMO) | Within this organization, you can track who installs
    your application (as leads), the licenses you grant them, and for how long. It
    is recommended that this is the same org as the APO described earlier. |

    | Trialforce Management Org (TMO) and Trialforce Source Org (TSO) | Trialforce
    is a way to provide orgs with your preconfigured application data so that prospective
    customers can try out your application before buying. It will be discussed later
    in this chapter. |


    Typically, the LMO and APO can be the same as your primary Salesforce production
    org, which allows you to track all your leads and future opportunities in the
    same place. This leads to the rule of APO = LMO = production org. Though neither
    of them should be your actual developer or test orgs, you can work with Salesforce
    support and your Salesforce account manager to plan and assign these orgs.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Introducing the book''s sample application


    For this book, we will use the world of **Formula 1** motor car racing as the
    basis for a packaged application that we will build together. Formula 1 is, for
    me, the motor sport that is equivalent to enterprise applications software, due
    to its scale and complexity. It is also a sport that I follow. My knowledge of
    both of these fields helped me when building the examples that we will use.


    We will refer to our application as **FormulaForce** throughout this book, though
    please keep in mind Salesforce''s branding policies when naming your own application,
    as they prevent the use of the word "Force" in the company or product titles.


    This application will focus on the data collection aspects of the races, drivers,
    and their many statistics, utilizing platform features to structure, visualize,
    and process this data in both historic and current contexts.


    For this chapter, we will create some initial **Custom Objects** and fields, as
    detailed in the following table. Do not worry about creating any custom tabs just
    yet. You can use your preferred approach to create these initial objects. Ensure
    that you are logged in to your **packaging org** (we will use the development
    org later in this book).


    | Object | Field name and type |

    | :--- | :--- |

    | Season__c | Name (text) |

    | Race__c | Name (text)

    Season (Master Detail Lookup to Season) |

    | Driver__c | Name (text) |

    | Contestant__c | Name (Auto Number CONTEST-{00000000})

    Race (Master Detail Lookup to Race)

    Driver (Lookup to Driver) |'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The following screenshot shows the preceding objects within the Schema Builder
    tool, available under the **Setup** menu:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_38_0.png)


    # # Package types and benefits


    A **package** is a container that holds your application components, such as Custom
    Objects, Apex code, Apex triggers, Visualforce pages, Lightning Components, and
    so on. This makes up your application. While there are other ways to move components
    between Salesforce orgs, a package provides a container that you can use for your
    entire application or deliver optional features by leveraging the so-called **extension
    packages**.


    There are two types of packages – **managed** and **unmanaged**. Unmanaged packages
    result in the transfer of components from one org to another; however, the result
    is as if those components had been originally created in the destination org,
    meaning that they can be readily modified or even deleted by the administrator
    of that org. Furthermore, they are not upgradable, and are not particularly ideal
    from a support perspective. Moreover, the Apex code that you write is also visible
    for all to see, so your intellectual property is at risk.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Unmanaged packages can be used for sharing template components that are intended
    to be changed by the subscriber. If you are not using GitHub and the GitHub Salesforce
    Deployment Tool (https://github.com/afawcett/githubsfdeploy), they can also provide
    a means to share open source libraries to developers.


    # # Features and benefits of managed packages


    This book focuses solely on managed packages. Managed packages have the following
    features that are ideal for distributing your application. The org where your
    application package is installed is referred to as a **subscriber org**, since
    users of this org are subscribing to the services your application provides:


    +   • **Intellectual Property (IP) protection:** Users in the subscriber org cannot
    see your Apex source code, although they can see your Visualforce pages code and
    static resources. While the Apex code is hidden, JavaScript code is not, so you
    may want to consider using a minify process to partially obscure such code.


    +   • **The naming scope:** Your component names are unique to your package throughout
    the utilization of a namespace. This means that, even if you have object X in
    your application, and the subscriber has an object of the same name, they remain
    distinct. You will define a namespace later in this chapter.


    +   • **The governor scope:** Code in your application executes within its own
    governor limit scope (such as DML and SOQL governors that are subject to passing
    Salesforce Security Review) and is not affected by other applications or code
    within the subscriber org. Note that some governors, such as the CPU time governor,
    are shared by the whole execution context (discussed in a later chapter), regardless
    of the namespace.


    +   • **Upgrades and versioning:** Once the subscribers have started using your
    application, creating data, making configurations, and so on, you will want to
    provide upgrades and patches with new versions of your application.


    There are other benefits to managed packages, but these are only accessible after
    becoming a Salesforce partner and completing the security review process; these
    benefits are described later in this chapter. Salesforce provides ISVforce Guide
    (otherwise known as the Packaging Guide) in which these topics are discussed in
    depth—bookmark it now! The ISVforce Guide can be found at http://login.salesforce.com/help/pdfs/en/salesforce_packaging_guide.pdf.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Creating your first managed package


    Packages are created in your packaging org. There can be only one managed package
    being developed in your packaging org (though additional unmanaged packages are
    supported, it is not recommended to mix your packaging org with them). You can
    also install other dependent managed packages and reference their components from
    your application. The steps to be performed are discussed in the following sections:


    +   - Setting your package namespace

    +   - Creating the package and assigning it to the namespace

    +   - Adding components to the package


    # Setting your package namespace


    An important decision when creating a managed package is the namespace; this is
    a prefix applied to all your components (Custom Objects, Visualforce pages, Lightning
    Components, and so on) and is used by developers in subscriber orgs to uniquely
    distinguish between your packaged components and others, even those from other
    packages. The namespace prefix is an important part of the branding of the application
    since it is implicitly attached to any Apex code or other components that you
    include in your package.


    It can be up to 15 characters, though I personally recommend that you keep it
    to less than this, as it becomes hard to remember and leads to frustrating typos
    if you make it too complicated. I would also avoid underscore characters. It is
    a good idea to have a naming convention if you are likely to create more managed
    packages in the future (in different packaging orgs). The following is the format
    of an example naming convention:


    ```

    [company acronym - 1 to 4 characters][package prefix 1 to 4 characters]

    ```


    For example, the ACME Corporation''s Road Runner application might be named acmerr.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'When the namespace has not been set, the **Packages** page (accessed under
    the **Setup** menu under the **Create** submenu) indicates that only unmanaged
    packages can be created. Click on the **Edit** button to begin a small wizard
    to enter your desired namespace. This can only be done once and must be globally
    unique (meaning it cannot be set in any other org), much like a website domain
    name.


    # Assigning namespaces


    For the purposes of following this book, please feel free to make up any namespace
    you desire, for example, `fforce{yourinitials}`. Do not use one that you may plan
    to use in the future, since once it has been assigned, it cannot be changed or
    reused.


    The following screenshot shows the **Packages** page:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_41_0.png)


    Once you have set the namespace, the preceding page should look like the following
    screenshot, with the difference being that it is now showing the namespace prefix
    that you have used and that managed packages can now also be created. You are
    now ready to create a managed package and assign it to the namespace.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_42_0.png)


    # Creating the package and assigning it to the namespace


    Click on the New button on the Packages page and give your package a name (it
    can be changed later). Be sure to tick the Managed checkbox as well. Click on
    Save and return to the Packages page, which should now look like the following:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_42_1.png)


    # Adding components to the package


    In the Packages page, click on the link to your package in order to view its details.

    From this page, you can manage the contents of your package and upload it. Click
    on

    the Add button to add the Custom Objects created earlier in this chapter. Note
    that

    you do not need to add any custom fields—these are added automatically.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'The following screenshot shows broadly what your Package Detail page should
    look like at this stage:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_43_0.png)


    When you review the components added to the package, you will see that some components
    can be removed while other components cannot be removed. This is because the platform
    implicitly adds some components for you, as they are dependencies. As we progress
    through this book, adding different component types, you will see this list automatically
    grow in some cases, and in others, we must explicitly add them.


    # Extension packages


    As the name suggests, extension packages extend or add to the functionality delivered
    by the existing packages they are based on, though they cannot change the base
    package contents. They can extend one or more base packages, and you can even
    have several layers of extension packages, though you may want to keep an eye
    on how extensively you use this feature, as managing inter-package dependency
    can get quite complex, especially during development.


    Extension packages are created in pretty much the same way as the process you''ve
    just completed (including requiring their own packaging org), except that the
    packaging org must also have the dependent packages installed in it.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'As code and Visualforce pages contained within extension packages make reference
    to other Custom Objects, fields, Apex code, and Visualforce pages present in base
    package, the platform tracks these dependencies and the version of the base package
    present at the time the reference was made.


    When an extension package is installed, this dependency information ensures that
    the subscriber org has the correct version (minimum) of the base packages installed
    before permitting the installation to complete.


    You can also manage the dependencies between extension packages and base packages
    yourself through the Versions tab or XML metadata for applicable components (we
    will revisit versioning in Apex in a later chapter when discussing API integration).


    # Package dependencies and uploading


    Packages can have dependencies on platform features and/or other packages. You
    can review and manage these dependencies through the usage of the Package Detail
    page and the use of dynamic coding conventions, as described here.


    While some features of Salesforce are common, customers can purchase different
    editions and features according to their needs. Developer Edition organizations
    have access to most of these features for free. This means that as you develop
    your application, it is important to understand when and when not to use those
    features (this is done in order to avoid unwanted dependencies that might block
    or inhibit the adoption of your application).


    By default, when referencing a certain Standard Object, field, or component type,
    you will generate a prerequisite dependency on your package, which your customers
    will need to have before they can complete the installation. Some Salesforce features,
    for example Multi-Currency or Chatter, have either a configuration or, in some
    cases, a cost impact to your users (different org editions). Carefully consider
    which features your package is dependent on.


    Most of the feature dependencies, though not all, are visible via the View Dependencies
    button on the Package Detail page (this information is also available on the Upload
    page, allowing you to make a final check). It is good practice to add this check
    into your packaging procedures to ensure that no unwanted dependencies have crept
    in. Clicking on this button for the package that we have been building in this
    chapter so far confirms that there are no dependencies.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'For dependencies that are not shown, it is a good idea to make sure that the
    features enabled for your testing orgs are clear, thus any other dependencies
    will show during installation or further testing.


    ```

    Show Dependencies

    No Dependency Information for Package FormulaForce

    << Back to Package: FormulaForce

    There are no dependencies.

    ```


    Later in this book, we will be discussing Lightning Components. If you''re packaging
    these, you will be implicitly imposing the need for your customers to utilize
    the Salesforce My Domain feature. This is not enforced at installation time, so
    it is an optional dependency. However, users will not be able to use your packaged
    Lightning Components without first enabling and configuring My Domain.


    # Uploading the release and beta packages


    Once you have checked your dependencies, click on the Upload button. You will
    be prompted to give a name and version to your package. The version will be managed
    for you in subsequent releases. Packages are uploaded in one of two states, beta
    or release, as described shortly.


    We will perform a release upload by selecting the Managed - Release option from
    the Release Type field, so make sure you are happy with the objects created in
    the earlier section of this chapter, as they cannot easily be changed after this
    point.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_45_0.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Once you are happy with the information on the screen, click on the **Upload**
    button once again to begin the packaging process. Once the upload process completes,
    you will see a confirmation page as follows:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_46_0.png)


    Packages can be uploaded in one of two states, as described here:


    +   **Release:** Release packages can be installed into subscriber production
    orgs and can also provide an upgrade path from previous releases. The downside
    is that you cannot delete the previously released components, or change certain
    things, such as a field''s type. Changes to the components that are marked **global**,
    such as Apex code and Visualforce components, are also restricted. While Salesforce
    is gradually enhancing the platform to provide the ability to modify certain released
    aspects, you need to be certain that your application release is stable before
    selecting this option.


    +   **Beta:** Beta packages cannot be installed into subscriber production orgs;
    you can install only into Developer Edition (such as your testing org), **sandbox**,
    or Partner Portal created orgs. Also, Beta packages cannot be upgraded once installed;
    this is the reason why Salesforce does not permit their installation into production
    orgs. The key benefit is in the ability to continue to change new components of
    the release to address bugs and features relating to user feedback.


    > The ability to delete previously-published components (uploaded within a release
    package) is, at the time of writing this book, in pilot. It can be enabled by
    raising a support case with Salesforce Support. Once you have understood the full
    implications, they will enable it.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'At this stage in the book, we have simply added some Custom Objects, so the
    upload should complete reasonably quickly. Note that what you’re actually uploading
    to is AppExchange, which will be covered in the following sections.


    > If you want to protect your package, you can provide a password (this can be
    changed afterwards). The user performing the installation will be prompted for
    it during the installation process.


    # Optional package dependencies


    It is possible to make some Salesforce features and/or base package component
    references (Custom Objects and fields) an optional aspect of your application.
    There are two approaches to this, depending on the type of the feature.


    # Dynamic bindings


    For example, the Multi-Currency feature adds a CurrencyIsoCode field to the Standard
    and Custom Objects. If you explicitly reference this field, for example, in your
    Apex, Visualforce pages or Lightning pages or components, you will incur a hard
    dependency on your package. If you want to avoid this and make it a configuration
    option (for example) in your application, you can utilize dynamic Apex and Visualforce.
    Lightning value bindings are dynamic in nature, though `aura:attribute` element
    type references will form a compile time reference to the specified objects.


    # Extension packages


    If you wish to package component types that are only available in subscriber orgs
    of certain editions, you can choose to include these in extension packages. For
    example, you may wish to support the Professional Edition, which does not support
    record types. In this case, create an Enterprise Edition extension package for
    your application’s functionality, which leverages the functionality from this
    edition.


    > Note that you will need multiple testing organizations for each combination
    of features that you utilize in this way to effectively test the configuration
    options or installation options that your application requires.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# # Becoming a Salesforce partner and benefits


    The Salesforce Partner Program has many advantages. The first place to visit is
    https://partners.salesforce.com/. You will want to focus on the areas of the site
    relating to being an Independent Software Vendor (ISV) partner. From here, you
    can click on Join Now. It is free to join, though you will want to read through
    the various agreements carefully, of course.


    Once you wish to start listing a package and charging users for it, you will need
    to arrange billing details for Salesforce to take the various fees involved. While
    this book is not equipped to go into the details, do pay careful attention to
    the Standard Objects used in your package, as this will determine the license
    type required by your users and the overall cost to them, in addition to your
    charges.


    Obviously, Salesforce would prefer your application to use as many features of
    the CRM application as possible, which may also be beneficial to you as a feature
    of your application, since it''s an appealing immediate integration not found
    on other platforms, such as the ability to instantly integrate with accounts and
    contacts.


    If you''re planning on using Standard Objects, and are in doubt about the costs
    (as they do vary depending on the type), you can request a conversation with Salesforce
    to discuss this; this is something to keep in mind in the early stages.


    Make sure, when you associate a Salesforce user with the Partner Community, you
    utilize a user that you use daily (known as your Partner Business Org user) and
    not one from a development or test org. Once you have completed the signup process,
    you will gain access to the Partner Community. The following screenshot shows
    what the current Partner Community home page looks like. From here, you can access
    many useful services:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_48_0.png)


    This is your primary place to communicate with Salesforce and access additional
    materials and announcements relevant to ISVs, so do keep checking often. You can
    raise cases and provide additional logins to other users in your organization,
    such as other developers who may wish to report issues or ask questions.'
  merge: -1
  img_proc: true
- pgno: 49
  md: "# # Security review and benefits\n\nThe following features require that a completed\
    \ package release goes through a Salesforce-driven process known as the **security\
    \ review**, which is initiated via your listing when logged into AppExchange.\
    \ Unless you plan to give your package away for free, there is a charge involved\
    \ in putting your package through this process.\n\nHowever, the review is optional.\
    \ There is nothing stopping you from distributing your package installation URL\
    \ directly. However, you will not be able to benefit from the ability to list\
    \ your new application on AppExchange for others to see and review. More importantly,\
    \ you will also not have access to the following features to help you deploy,\
    \ license, and support your application. The following is a list of the benefits\
    \ you get once your package has passed the security review:\n\n+   - **Bypass\
    \ subscriber org setup limits**: Limits such as the number of tabs and Custom\
    \ Objects are bypassed. This means that if the subscriber org has reached its\
    \ maximum number of Custom Objects, your package will still install. This feature\
    \ is sometimes referred to as **Aloha**. Without this, your package installation\
    \ may fail. You can determine whether Aloha has been enabled via the **Subscriber\
    \ Overview** page that comes with the LMA application, which is discussed in the\
    \ next section.\n+   \n+   - **Licensing**: You are able to utilize the Salesforce-provided\
    \ License Management Application (LMA) in your LMO.\n+   \n+   - **Subscriber\
    \ support**: With this feature, the users in the subscriber org can enable, for\
    \ a specific period, a means for you to log in to their org (without exchanging\
    \ passwords), reproduce issues, and enable much more detailed debug information,\
    \ such as Apex stack traces. In this mode, you can also see custom settings that\
    \ you have declared as protected in your package, which is useful for enabling\
    \ additional debug or advanced features.\n+   \n+   - **Push upgrade**: Using\
    \ this feature, you can automatically apply upgrades to your subscribers without\
    \ their manual intervention, either directly by you or on a scheduled basis. You\
    \ may use this for applying either smaller bug fixes that don't affect the Custom\
    \ Objects or APIs, or for deploying full upgrades. The latter requires careful\
    \ coordination and planning with your subscribers to ensure that changes and new\
    \ features are adopted properly."
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Salesforce asks you to perform an automated security scan of your

    software via a web page (http://security.force.com/security/

    tools/forcecom/scanner). This service can be quite slow depending

    on how many scans are in the queue. Another option is to obtain the

    Eclipse plugin from the actual vendor CheckMarx at http://www.

    checkmarx.com, which runs the same scan but allows you to control

    it locally. Finally, for the ultimate confidence as you develop your

    application, Salesforce can provide a license to integrate it into your

    Continuous Integration (CI) build system. CI is covered in the final

    chapter of this book.


    This book focuses on building a fully native application, as such additional work

    involved with so-called "hybrid" applications (where parts of your application
    have

    been implemented on your own servers, for example) are not considered here.

    However, keep in mind that if you make any callouts to external services, Salesforce

    will also most likely ask you and/or the service provider to run a BURP scanner,
    to

    check for security flaws.


    Make sure you plan a reasonable amount of time (at least two to three weeks, in
    my

    experience) to go through the security review process; it is essential that you
    initially

    list your package. Though if it becomes an issue, you have the option of issuing
    your

    package install URL directly to initial customers and early adopters.


    # Getting the best out of the Partner Community


    It''s worth taking some time to review the content and facilities in the Partner

    Community. Some of the key areas to take a look at are listed as follows:


    +   • Education and Trailhead: This allows you to monitor the progress of other

    +   users in your organization on Trailhead. Trailhead is Salesforce''s way of

    +   learning while doing. Users read about new technologies or development

    +   approaches and are then asked to perform some challenges to validate their

    +   understanding. They are awarded badges, as part of a gamification system.

    +   Using this tab, you can see who has the most badges!


    +   • Featured Groups: This page, under More, allows you quick access to a

    +   number of Salesforce-managed Chatter groups. A key group is the Partner

    +   Alerts group, I would strongly recommend you set up an E-mail digest for

    +   this group. Only Salesforce posts to this group, so a per-post digest level
    is

    +   tolerable and keeps you informed without having to log in to the community.


    +   • Support: This is, of course, the place you go to raise cases with Salesforce.
    As

    +   you raise cases, the UI automatically attempts to search for known issues
    or

    +   support articles that might help answer your questions. You can also report

    +   and filter on open cases here.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   - **Publishing**: This page allows you to list your creations on the Salesforce
    AppExchange site. Later sections in this chapter cover this in more detail.


    +   - **Partner Alerts**: Partner Alerts are critical to keeping on top of changes
    to the service that could affect your development process and/or your customers.
    These might range from critical fixes, security improvements, or changes in behavior
    you need to be prepared for. Although rare, you may be asked to make changes to
    your solution by a certain deadline to ensure your users are not impacted.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_51_0.png)


    There are many Chatter groups shown in the Featured Groups page in the Partner
    Community. Review them all and set up E-mail digests to help keep you informed
    without having to manually log in and check through this page each time.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_51_1.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# # Creating test and developer orgs via Environment Hub


    Partners can use Environment Hub to create orgs for development and testing purposes.
    Orgs can be linked and logins managed here as well. Unlike the orgs you can get
    from the Salesforce Developer site, these orgs have additional user licenses.
    It is also possible to link your TSO and create orgs based on templates you define,
    allowing you to further optimize the base org configuration for your own development
    and testing process. For more information, review the Partner Community page detailing
    Environment Hub (https://partners.salesforce.com/s/education/general/Environment_Hub).


    # # Introduction to AppExchange and listings


    Salesforce provides a website referred to as **AppExchange**, which lets prospective
    customers find, try out, and install applications built using Force.com. Applications
    listed here can also receive ratings and feedback. You can also list your mobile
    applications on this site as well.


    > In this section, I will be using an AppExchange package that I already own.
    The package has already gone through the process to help illustrate the steps
    that are involved. For this reason, you do not need to perform these steps at
    this stage in the book; they can be revisited at a later phase in your development
    once you’re happy to start promoting your application.


    Once your package is known to AppExchange, each time you click on the **Upload**
    button on your released package (as described previously), you effectively create
    a private listing. Private listings are not visible to the public until you decide
    to make them so. It gives you the chance to prepare any relevant marketing details
    and pricing information while final testing is completed. Note that you can still
    distribute your package to other Salesforce users or even early beta or pilot
    customers without having to make your listing public.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'In order to start building a listing, you need to log in to Partner Community
    and click the Publishing tab in the header. This will present you with your Publishing
    Console. Here, you can link and manage Organizations that contain your Packages,
    create Listings and review Analytics regarding how often your listings are visited.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_53_0.png)


    Select the Publishing Console option from the menu, then click on the Create New
    Listing button and complete the steps shown in the wizard to associate the packaging
    org with AppExchange; once completed, you should see it listed.


    It''s really important that you consistently log in to AppExchange using your
    APO user credentials. Salesforce will let you log in with other users. To make
    it easy to confirm, consider changing the user''s display name to something like
    MyCompany Packaging.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_53_1.png)


    Although it is not a requirement to complete the listing steps, unless you want
    to try out the process yourself to see the type of information required. You can
    delete any private listings that you created after you complete this book.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Downloading the example code


    You can download the example code files for all Packt books that you have purchased
    from your account at http://www.packtpub.com. If you purchased this book elsewhere,
    you can visit http://www.packtpub.com/support and register to have the files e-mailed
    directly to you.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_54_0.png)


    # Installing and testing your package


    When you uploaded your package earlier in this chapter, you will receive an e-mail
    with a link to install the package. If not, review the Versions tab on the Package
    Detail page in your packaging org. Ensure that you''re logged out and click on
    the link. When prompted, log in to your testing org. The installation process
    will start. A reduced screenshot of the initial installation page is shown in
    the following screenshot; click on the Continue button and follow the default
    installation prompts to complete the installation:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_54_1.png)'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Package installation covers the following aspects (once the user has entered
    the package password, if one was set):


    +   **Package overview:** The platform provides an overview of the components
    that will be added or updated (if this is an upgrade) to the user. Note that,
    due to the namespace assigned to your package, these will not overwrite existing
    components in the subscriber org created by the subscriber.


    +   **Connected App and Remote Access:** If the package contains components that
    represent connections to services outside of Salesforce services, the user is
    prompted to approve these.


    +   **Approve Package API Access:** If the package contains components that make
    use of the client API (such as JavaScript code), the user is prompted to confirm
    and/or configure these. Such components will generally not be called much; features
    such as **JavaScript Remoting** are preferred, and they leverage the Apex runtime
    security configured post-installation.


    +   **Security configuration:** In this step, you can determine the initial visibility
    of the components being installed (objects, pages, and so on), selecting admin
    only or the ability to select profiles to be updated. This option predates the
    introduction of **permission sets**, which permit post-installation configuration.


    > If you package profiles in your application, the user will need to remember
    to map these to the existing profiles in the subscriber org, as per step 2. This
    is a one-time option, as the profiles in the package are not actually installed,
    only merged. I recommend that you utilize permission sets to provide security
    configurations for your application. These are installed and are much more granular
    in nature.


    When the installation is complete, navigate to the **Installed Packages** menu
    option under the **Setup** menu. Here, you can see the confirmation of some of
    your package details, such as namespace and version, as well as any licensing
    details, which will be discussed later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 56
  md: "It is also possible to provide a **Configure** link for your package, which\
    \ will be displayed next to the package when installed and listed on the **Installed\
    \ Packages** page in the subscriber org. Here, you can provide a Visualforce page\
    \ to access configuration options and processes, for example. If you have enabled\
    \ **Seat based licensing**, there will also be a **Manage Licenses** link to determine\
    \ which users in the subscriber org have access to your package components, such\
    \ as tabs, objects, and Visualforce pages. Licensing, in general, is discussed\
    \ in more detail later in this chapter.\n\n# # Automating package installation\n\
    \nIt is possible to automate some processes using the **Salesforce Metadata API**\
    \ and associated tools, such as the **Salesforce Migration Toolkit** (available\
    \ from the **Tools** menu under **Setup**), which can be run from the popular\
    \ Apache Ant scripting environment. This can be useful if you want to automate\
    \ the deployment of your packages to customers or test orgs. In the final chapter\
    \ of this book, we will study Ant scripts in more detail.\n\nOptions that require\
    \ a user response, such as the security configuration, are not covered by automation.\
    \ However, password-protected managed packages are supported. You can find more\
    \ details on this by looking up the installed package component in the online\
    \ help for the Salesforce Metadata API at `https://www.salesforce.com/us/developer/docs/api_meta/`.\n\
    \nAs an aid to performing this from Ant, a custom Ant task can be found in the\
    \ sample code related to this chapter (see `/lib/antsalesforce.xml`). The following\
    \ is a `/build.xml` Ant script (also included in the chapter code) to uninstall\
    \ and reinstall the package. Note that the installation will also upgrade a package\
    \ if the package is already installed. The following is the Ant script:\n\n```\n\
    <project name=\"FormulaForce\"\n    xmlns:sf=\"antlib:com.salesforce\" basedir=\"\
    .\">\n\n<!-- Downloaded from Salesforce Tools page under Setup -->\n<typedef\n\
    \    uri=\"antlib:com.salesforce\"\n    resource=\"com/salesforce/antlib.xml\"\
    \n    classpath=\"${basedir}/lib/ant-salesforce.jar\"/>\n\n<!-- Import macros\
    \ to install/uninstall packages -->\n<import file=\"${basedir}/lib/ant-salesforce.xml\"\
    />\n```"
  merge: -1
  img_proc: true
- pgno: 57
  md: "```\n<target name=\"package.installdemo\">\n\n<uninstallPackage\n    namespace=\"\
    yournamespace\"\n    username=\"${sf.username}\"\n    password=\"${sf.password}\"\
    / >\n<installPackage\n    namespace=\"yournamespace\"\n    version=\"1.0\"\n \
    \   username=\"${sf.username}\"\n    password=\"${sf.password}\"/ >\n</target>\n\
    </project>\n```\n\nYou can try the preceding example with your testing org by\
    \ replacing the namespace attribute values with the namespace you entered earlier\
    \ in this chapter. Enter the following commands, all on one line, from the folder\
    \ that contains the build.xml file:\n\n```\nant package.installdemo\n-Dsf.username=testorgusername\n\
    -Dsf.password=testorgpasswordtestorgtoken\n```\n\n> You can also use the Salesforce\
    \ Metadata API to list packages installed in an org, for example, if you wanted\
    \ to determine whether a dependent package needs to be installed or upgraded before\
    \ sending an installation request. Finally, you can also uninstall packages if\
    \ you wish.\n\n# Licensing\n\nOnce you have completed the security review, you\
    \ are able to request by raising a support cases via the Partner Portal to have\
    \ access to the LMA. Once this is provided by Salesforce, use the installation\
    \ URL to install it like any other package into your LMO."
  merge: -1
  img_proc: true
- pgno: 58
  md: 'If you have requested a CRM for ISV''s org (through a case raised within the
    Partner Portal), you may find the LMA already installed.


    The following screenshot shows the main tabs of the License Management Application
    once installed:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_58_0.png)


    In this section, I will use a package that I already own and have already taken
    through the process to help illustrate the steps that are involved. For this reason,
    you do not need to perform these steps.


    After completing the installation, return to AppExchange and log in. Then, locate
    your listing in Publisher Console under Uploaded Packages. Next to your package,
    there will be a Manage Licenses link. After clicking on this link for the first
    time, you will be asked to connect your package to your LMO org. Once this is
    done, you will be able to define the license requirements for your package.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The following example shows the license for a free package with an immediately
    active license for all users in the subscriber org:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_59_0.png)


    In most cases regarding packages that you intend to charge for, you would offer
    a free trial rather than setting the license default to active immediately. For
    paid packages, select a license length, unless it''s a one-off charge, and then
    select the license that does not expire. Finally, if you''re providing a trial
    license, you need to consider carefully the default number of seats (users); users
    may need to be able to assign themselves different roles in your application to
    get the full experience.


    > While licensing is currently expressed at a package level, it is very likely
    that more granular licensing around the modules or features in your package will
    be provided by Salesforce in the future. This will likely be driven by the permission
    sets feature. As such, keep in mind a functional orientation to your permission
    set design.


    If you configure a number of seats against the license, then the Manage Licenses
    link will be shown on the Installed Packages page next to your package. The administrator
    in the subscriber org can use this page to assign applicable users to your package.
    The following screenshot shows how your installed package looks to the administrator
    when the package has licensing enabled:'
  merge: -1
  img_proc: true
- pgno: 60
  md: '| Action | Package Name | Publisher | Version Number | Namespace Prefix | Status
    | Allowed Licenses |

    |---|---|---|---|---|---|---|

    | Uninstall | Manage Licenses | Declarative Lookup Rollup Summaries Tool | Home
    | 1.4 | dlra | Active | 3 |


    Note that you do not need to keep reapplying the license requirements for each
    version you upload; the last details you defined will be carried forward to new
    versions of your package until you change them. Either way, these details can
    also be completely overridden on the License page of the LMA application.


    You may want to apply a site-wide (org-wide) active license to extensions or add-on
    packages. This allows you to at least track who has installed such packages, even
    though you don''t intend to manage any licenses around them, since you are addressing
    licensing on the main package.


    # # The Licenses tab and managing customer licenses


    The Licenses tab provides a list of individual license records that are automatically
    generated when the users install your package into their orgs. Salesforce captures
    this action and creates the relevant details, including Lead information. This
    also contains the contact details of the organization and person who performed
    the install, as shown in the following screenshot:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_60_0.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'From each of these records, you can modify the current license details to extend
    the expiry period or disable the application completely. If you do this, the package
    will remain installed with all of its data. However, none of the users will be
    able to access the objects, Apex code, or pages, not even the administrator. You
    can also re-enable the license at any time. The following screenshot shows the
    License Edit section:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_61_0.png)


    # The Subscribers tab


    The Subscribers tab lists all your customers or subscribers (it shows their Organization
    Name from the company profile) that have your packages installed (only those linked
    via AppExchange). This includes their Organization ID, Edition (Developer, Enterprise,
    or others), and also the type of instance (sandbox or production).


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_61_1.png)'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# # The Subscriber Overview page


    When you click on Organization Name from the list in this tab, you are taken to
    the Subscriber Overview page. This page is sometimes known as the Partner Black
    Tab. This page is packed with useful information, such as the contact details
    (also seen via the Leads tab) and the login access that may have been granted
    (we will discuss this in more detail in the next section), as well as which of
    your packages they have installed, their current licensed status, and when they
    was installed. The following is a screenshot of the Subscriber Overview page:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_62_0.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# How licensing is enforced in the subscriber org


    Licensing is enforced in one of two ways, depending on the execution context in
    which your packaged Custom Objects, fields, and Apex code are being accessed from.


    The first context is where a user is interacting directly with your objects, fields,
    tabs, and pages via the user interface or the Salesforce APIs (Partner and Enterprise).
    If the user or the organization is not licensed for your package, these will simply
    be hidden from view, and, in the case of the API, will return an error. Note that
    administrators can still see packaged components under the **Setup** menu.


    The second context is the type of access made from Apex code, such as an Apex
    trigger or controller, written by the customers themselves or from within another
    package. This indirect way of accessing your package components is permitted if
    the license is site-wide (or org-wide) or there is at least one user in the organization
    that is allocated a seat.


    This condition means that even if the current user has not been assigned a seat
    (via the **Manage Licenses** link), they are still accessing your application''s
    objects and code, although indirectly, for example, via a customer-specific utility
    page or Apex trigger, which automates the creation of some records or the defaulting
    of fields in your package.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_63_0.png)


    # Providing support


    Once your package has completed the security review, additional functionality
    for supporting your customers is enabled. Specifically, this includes the ability
    to log in securely (without exchanging passwords) to their environments and debug
    your application. When logged in in this way, you can see everything the user
    sees, in addition to extended debug logs that contain the same level of detail
    as they would in a developer org.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'First, your customer enables access via the **Grant Account Login** page. This
    time, however, your organization (note that this is the **Company Name** as defined
    in the packaging org under **Company Profile**) will be listed as one of those
    available in addition to Salesforce Support. The following screenshot shows the
    **Grant Account Login** page:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_64_0.png)


    Next, you log in to your LMO and navigate to the **Subscribers** tab as described.
    Open **Subscriber Overview** for the customer, and you should now see the link
    to **Login** as that user. From this point on, you can follow the steps given
    to you by your customer and utilize the standard **Debug Logs** and **Developer
    Console** tools to capture the debug information you need. The following screenshot
    shows a user who has been granted login access via your package to their org:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_64_1.png)


    > > This mode of access also permits you to see protected custom settings, if
    you have included any of those in your package. If you have not encountered these
    before, it’s well worth researching them as they provide an ideal way to enable
    and disable debug, diagnostic, or advanced configurations that you don’t want
    your customers to normally see.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # Customer metrics


    Salesforce has started to expose information relating to the usage of your package
    components in the subscriber orgs since the Spring "14 release of the platform.
    This enables you to report what Custom Objects and Visualforce pages your customers
    are using and, more importantly, those they are not. This information is provided
    by Salesforce and cannot be opted out of by the customer.


    This facility needs to be enabled by Salesforce Support. Once enabled, the `MetricsDataFile`
    object is available in your production org and will receive a data file periodically
    that contains the metric''s records. The **Usage Metrics Visualization** application
    can be found by searching on AppExchange, and can help with visualizing this information.


    # # Trailforce and Test Drive


    Large enterprise applications often require some consultation with customers to
    tune and customize to their needs after the initial package installation. If you
    wish to provide trial versions of your application, Salesforce provides a means
    to take snapshots of the results of this installation and setup process, including
    sample data.


    You can then allow prospective users who visit your AppExchange listing, or your
    website to sign up to receive a personalized instance of a Salesforce org based
    on the snapshot you made. The potential customers can then use this to fully explore
    the application for a limited time, until they sign up as a paying customer. Such
    orgs will eventually expire when the Salesforce trial period ends for the org
    created (typically 14 days). Thus, you should keep this in mind when setting the
    default expiry on your package licensing.


    The standard approach is to offer a web form for the prospective user to complete
    in order to obtain the trial. Review the *Providing a Free Trial on your Website*
    and *Providing a Free Trial on AppExchange* sections of the ISVforce Guide for
    more on this.


    You can also consider utilizing the Signup Request API, which gives you more control
    over how the process is started and the ability to monitor it, such that you can
    create the lead records yourself. You can find out more about this in the *Creating
    Signups using the API* section in the ISVforce Guide. As a more advanced option,
    if you are an ISV with an existing application and wish to utilize Salesforce.com
    as a backend service, you can use this API to completely create and manage orgs
    on their behalf. Review the *Creating Proxy Signups for OAuth* and the *API Access*
    section in the ISVforce Guide for more information on this.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Alternatively, if the prospective user wishes to try your package in their
    sandbox environment, for example, you can permit them to install the package directly,
    either from AppExchange or from your website. In this case, ensure that you have
    defined a default expiry on your package license, as described earlier. In this
    scenario, you or the prospective user will have to perform the setup steps after
    installation.


    Finally, there is a third option called Test Drive, which does not create a new
    org for the prospective user on request, but does require you to set up an org
    with your application, preconfigure it, and then link it to your listing via AppExchange.
    Instead of the users completing a signup page, they click on the Test Drive button
    on your AppExchange listing. This logs them in to your test drive org as read-only
    users. Because this is a shared org, the user experience and features you can
    offer to users is limited to those that mainly read information. I recommend that
    you consider Trialforce over this option, unless there is a really compelling
    reason to use it.


    > When defining your listing in AppExchange, the Leads tab can be used to configure
    the creation of lead records for trials, test drives, and other activities on
    your listing. Enabling this will result in a form being presented to the user
    before accessing these features on your listing. If you provide access to trials
    through signup forms on your website, for example, lead information will not be
    captured.


    # Distributing Salesforce Connected Apps


    If you plan to build any kind of platform integration, including a dedicated mobile
    application, for example, using Salesforce APIs or any you build using Apex, you
    will need to create and package what''s known as a Connected App. This allows
    you as the ISV to set up the OAuth configuration that allows users of these integrations
    to connect to Salesforce, and thus, your logic and objects running on the platform.
    You don''t actually need to package this configuration, but you are encouraged
    to do so, since it will allow your customers to control and monitor how they utilize
    your solution.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Summary


    This chapter has given you a practical overview of the initial package creation
    process through installing it into another Salesforce organization. While some
    of the features discussed cannot be fully exercised until you''re close to your
    first release phase, you can now head to development with a good understanding
    of how early decisions, such as references to Standard Objects, are critical to
    your licensing and cost decisions.


    It is also important to keep in mind that, while tools such as Trailforce help
    automate the setup, this does not apply to installing and configuring your customer
    environments. Thus, when making choices regarding configurations and defaults
    in your design, keep in mind the costs to the customer during the implementation
    cycle.


    Make sure you plan for the security review process in your release cycle (the
    free online version has a limited bandwidth) and ideally integrate it into your
    CI build system (a paid facility) as early as possible, since the tool not only
    monitors security flaws but also helps report breaches in best practices, such
    as lack of test asserts and SOQL or DML statements in loops.


    In the following chapters, we will start exploring the engineering aspects of
    building an enterprise application as we build upgrades on the package created
    in this chapter, allowing us to better explore how the platform supports incremental
    growth of your application.


    > As you revisit the tools covered in this chapter, be sure to reference the excellent
    ISVforce Guide at http ://www.salesforce.com/us/developer/docs/packagingGuide/index.htm
    for the latest detailed steps and instructions on how to access, configure, and
    use these features.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Leveraging Platform Features


    In this chapter, we will explore some key features of the Force.com platform that
    enables developers to build the application more rapidly, but also provides key
    features to end users of the application. Using these features in a balanced way
    is the key to ensuring that you and your users not only get the best out of the
    platform today, but continue to do so in the future as the platform evolves.


    A key requirement for an enterprise application is the ability to customize and
    extend its functionality, as enterprise customers have varied and complex businesses.
    You should also keep in mind that, as your ecosystem grows, you should ensure
    that your partner relationships are empowered by the correct level of integration
    options and that they need to interface their solutions with yours; the platform
    also plays a key role here.


    As we expand our FormulaForce package, we will explore the following to better
    understand some of the decision making around platform alignment:


    +   * Packaging and upgradable components

    +   * Custom field features

    +   * Security features

    +   * Platform APIs

    +   * Localization and translation

    +   * Building customizable user interfaces

    +   * E-mail customization with e-mail templates

    +   * Workflow and flow

    +   * Social features and mobile'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Packaging and upgradable components


    The time taken to install your application and get it prepared for live usage
    by your customers is a critical phase in your customer relationship. They are
    obviously keen to get their hands on your new and improved releases as quickly
    as possible. Careful planning and awareness of which of the components you are
    using are packable and upgradeable are important to monitor the effort involved
    at this stage.


    When exploring the various platform features available to you, it is important
    to check whether the related component type can be packaged or not. For a full
    list of components that can be packaged, search for the Available Components section
    in ISVforce Guide, referenced in the previous chapter.


    ```

    https://developer.salesforce.com/docs/atlas.en-us.packagingGuide.meta/packagingGuide/

    ```


    > If a component type relating to a feature you wish to use cannot be packaged,
    it does not necessarily mean it is of no use to you or your users, as it may well
    be something you can promote through your consulting team for your end user admins
    to take advantage of after installation. Though that keep in mind, how often you
    recommend this, especially if it starts to become a required post-installation
    task, will increase the time it takes for your users to go live on your application.


    Another aspect to consider is whether the component type is upgradeable, that
    is, if you define and include one release of your package, then modify it in a
    subsequent release, it will be updated in the subscriber (customer) organization.
    The table in the Available Components section in ISVforce Guide will also give
    you the latest information on this. Some component types that are not upgradeable
    are as follows:


    +   - Layouts

    +   - E-mail templates

    +   - Reports

    +   - List view


    These features are key to your application design and are covered in more detail
    later in this chapter. It is also important that end users can customize these;
    hence, Salesforce allows them to be edited. Unfortunately, this means they are
    not upgradable, that is, in the case of Layouts for example, any new fields you
    add to your Custom Objects do not appear by default after an upgrade is available
    for your users. However, new installations of your package will receive the latest
    versions of these components in your package.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'This also applies to some attributes of components that are flagged as upgradeable
    in the table referenced previously, but have certain attributes that are then
    not upgradeable. Refer to the Editing Components and Attributes After Installation
    section in ISVforce Guide for the latest details on this. Some common attributes
    that are packable but not upgradable, and hence, end user modifiable are as follows:


    +   - Custom field: Picklist values

    +   - Validation Rule: Active

    +   - Custom Object: Action overrides


    > The active status of the Validation Rule is quite a surprising one; while the
    user cannot modify your packaged Validation Rule, they can disable it. For most
    purposes, this means that this platform feature becomes a post-install optional
    activity left to the end user where they should wish to implement rules unique
    to them. For validations you wish to implement in Apex, you can utilize a protected
    Custom Setting to control activation if desired (such settings are only visible
    to your support teams via subscriber support).


    # Custom field – picklist values


    Probably the most surprising of the non-upgradable attributes of the custom field
    is the list of picklist values. These are completely modifiable by end users;
    they can be added, modified, or deleted. This means that you need to be very careful
    about how you reference these in your Apex code, and consequently, you provide
    guidelines to your end users about editing and applying changes post upgrade.


    > The Salesforce Translation Workbench tool, under the Setup menu, can be used
    to effectively relabel a pick list value by editing the users'' current language
    without having to rename its value on the field definition. This can be done after
    installation of the tool by the end user admin.


    Also, remember that the platform treats picklist fields mostly as if they were
    text fields; as such, you can query and even update a picklist field with any
    value you like. Also, keep in mind that you can upgrade customer data (if you
    change or delete a picklist value) through an Apex post-install script.'
  merge: -1
  img_proc: true
- pgno: 71
  md: "# Global Picklists\n\nAn alternative to defining picklists at the field level\
    \ is Global Picklists. Available under the Setup menu, they allow you to define\
    \ and package picklists independent of fields and thus can be shared across multiple\
    \ fields.\n\nThere are two significant differences to picklists defined this way.\n\
    \n+   • They cannot be modified in the subscriber org by the end user\n+   • They\
    \ are validated by the platform if the user or code attempts to update a field\
    \ with an invalid picklist value\n\nIf you require picklists on your fields to\
    \ be customized or don't have any issues with them being modified, then you can\
    \ define picklists at the field level. Otherwise Global Picklists are the more\
    \ natural and safest default to use in cases where your data model requires fields\
    \ with fixed values, even if there is no reuse between fields. Keep in mind users\
    \ can still modify the labels of global picklist entries through Salesforce Translation\
    \ Workbench regardless of the route you choose.\n\n# Automating upgrades with\
    \ the Salesforce Metadata API\n\nSalesforce as ever is great at providing APIs;\
    \ the Metadata API is no exception, as it provides a pretty broad coverage of\
    \ most things that can be done under the Setup menu. This means that it is feasible\
    \ to consider the development of upgrade tools to assist in upgrading components,\
    \ such as layouts or picklist values. Such tools will have to handle the logic\
    \ of merging and confirming the changes with the user of, for example, providing\
    \ a means to merge new fields into layouts, which the user selects from a UI prompt.\n\
    \nCurrently, the Metadata API is not directly accessible from Apex (though I remain\
    \ hopeful that it will be accessible in the future). However, it can be invoked\
    \ via an Apex HTTP callout, as it is available as a SOAP API.\n\nThe Apex Metadata\
    \ API library has provided an Apex wrapper at https://github.com/financialforcedev/apex-mdapi\
    \ to make it easier to use. The following Apex code shows the library being used\
    \ to programmatically update a layout to add a new custom button. This code can\
    \ be used as part of a tool you provide with your application or separately by\
    \ your consultants. For more information, you can refer to the README file in\
    \ the GitHub repository.\n\n```\n// Read the layout\nMetadataService.Layout layout\
    \ =\n    (MetadataService.Layout) service.readMetadata(\n```"
  merge: -1
  img_proc: true
- pgno: 72
  md: "```\n'Layout', new String''\n\" 'Test__c-Test Layout' ).getRecords()'0';\n\n\
    // Add a button to the layout\nlayout.customButtons.add('anewbutton');\n\n// Update\
    \ the layout\nList<MetadataService.SaveResult> result =\nservice.updateMetadata(\n\
    \ new MetadataService.Metadata'' \" layout \" );\n```\n\n> It is feasible to consider\
    \ invoking this logic from a package post-install script. However, Salesforce\
    \ currently requires that you define a remote site in order to authorize the callout,\
    \ even to their own servers. As the end point differs for this API, based on the\
    \ subscriber orgs Salesforce instance, it is hard to predefined and thus preinstall\
    \ this configuration as part of your package. As such, unless you are confident\
    \ that the remote site has been set up before an upgrade, it might be best to\
    \ guide the user to a Visualforce page (perhaps through an e-mail from the post-install\
    \ script), where you can prompt the user.\n\n# Understanding the custom field\
    \ features\n\nCustom fields carry many more features than you might think; they\
    \ are much more than simple field definitions you find on other platforms. Having\
    \ a good understanding of a custom field is the key to reducing the amount of\
    \ code you have to write and improving the user experience and reporting of your\
    \ application's data.\n\n# Default field values\n\nAdding default values to your\
    \ fields improves the usability of your application and can reduce the number\
    \ of fields needed on the screen, as users can remove fields with acceptable defaults\
    \ from the layouts.\n\nDefault values defined on custom fields apply in the native\
    \ user interfaces and Visualforce UIs (providing the apex:inputField component\
    \ is used) and in some cases, through the APIs. You can define a default value\
    \ based on a formula using either literal values and/or variables such as $User,\
    \ $Organization, and $Setup."
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Let''s try this out. Create a Year text field on the Season object as per the
