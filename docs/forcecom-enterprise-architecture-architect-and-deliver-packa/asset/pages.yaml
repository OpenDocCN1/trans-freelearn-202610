    \ on any object page.\n\nThe following sections describe in further detail the\
    \ Apex coding from Step 5 onwards.\n\n# Step 5 – defining a generic service\n\n\
    The aim is to develop a common service to handle all compliance verifications\
    \ across the application. So, a new ComplianceService class has been created with\
    \ a verify method on it, which is capable of receiving IDs from various objects.\
    \ If there are any verification errors, they will be thrown as part of an exception.\
    \ If the method returns without throwing an exception, the given records are compliant.\
    \ The following code snippet shows the creation of a new ComplianceService class\
    \ with a verify method:\n\n```\npublic class ComplianceService {\n/ **\n * Provides\
    \ general support to verify compliance in the\n * application\n * @throws ComplianceException\
    \ for any failures\n * /\npublic static void verify(Set<Id>recordIds) {\n// Query\
    \ the given records and delegate to the\n// corresponding Domain class to check\
    \ compliance\n// and report failures via ComplianceException\n}\n```"
