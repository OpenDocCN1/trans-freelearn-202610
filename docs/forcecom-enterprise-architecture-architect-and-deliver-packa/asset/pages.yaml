    # # Summary


    In this chapter, you have seen a number of platform features that directly help
    you build key structural and functional aspects of your application without writing
    a line of code, and in turn, further enabling your customers to extend and customize
    their application. The chapter also focused on optimizing the tasks performed
    by consultants and administrators to install and configure the application. Finally,
    you were made aware of limits imposed within the subscriber org, the ways to avoid
    them, and to have an awareness of them when packaging.


    Continue to review and evolve your application by first looking for opportunities
    to embrace these and other platform features, and you will ensure that you and
    your customers'' strong alignment with the current and future platform features
    continue to grow. In the next chapter, we will dive deeper into options and features
    surrounding the storage of data on the platform.


    > > Be sure to reference the Salesforce Limits Quick Reference Guide PDF describing
    the latest limits of the features discussed in this chapter and others at http://login.salesforce.com/help/pdfs/en/salesforce_app_limits_cheatsheet.pdf.'
