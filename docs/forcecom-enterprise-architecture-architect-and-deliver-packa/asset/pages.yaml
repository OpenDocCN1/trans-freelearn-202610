- pgno: 134
  md: '# # Apex Execution and Separation of Concerns


    When starting to write Apex, it is tempting to start with an Apex Trigger or Apex
    Controller class and start placing the required logic in these classes to implement
    the desired functionality. This chapter will explore a different starting point,
    one that gives the developer focus on writing application business logic (the
    core logic of your application) in a way that is independent of the calling context.
    It will also explain the benefits that it brings in terms of reuse, code maintainability,
    and flexibility, especially when applying code to different areas of the platform.


    We will explore the ways in which Apex code can be invoked, the requirements and
    benefits of these contexts, their commonalities, their differences, and the best
    practices that are shared. We will distill these into a layered way of writing
    code that teaches and embeds Separation of Concerns (SOC) in the code base from
    the very beginning. We will also introduce a naming convention to help with code
    navigation and enforce SOC further.


    At the end of the chapter, we will have written some initial code, setting out
    the framework to support SOC and the foundation for the next three chapters to
    explore some well-known Enterprise Application Architecture patterns in more detail.
    Finally, we will package this code and install it in the test org.


    This chapter will cover the following topics:


    +   - Apex execution contexts

    +   - Apex governors and namespaces

    +   - Where is Apex used?

    +   - Separation of Concerns

    +   - Patterns of Enterprise Application Architecture'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   - Unit testing versus system testing

    +   - Packaging the code


    # ## Execution contexts


    An execution context on the platform has a beginning and an end; it starts with
    a user or system action or event, such as a button click or part of a scheduled
    background job, and is typically short lived; with seconds or minutes instead
    of hours before it ends. It is especially important in multitenant architecture
    because each context receives its own set of limits around queries, database operations,
    logs, and duration of the execution.


    In the case of background jobs (**Batch Apex**), instead of having one execution
    context for the whole job, the platform splits the information being processed
    and hands it back through several execution contexts in a serial fashion. For
    example, if a job was asked by the user to process 1000 records and the batch
    size (or scope size in Batch Apex terms) was 200 (which is the default), this
    would result in five distinct execution contexts, one after another. This is done
    so that the platform can throttle the execution of jobs up or down or if needed
    pause them between scopes based on the load on the service at the time.


    You might think that an execution context starts and ends with your Apex code,
    but you would be wrong. Using some Apex code is introduced later in this chapter;
    we will use the debug logs to learn how the platform invokes the Apex code.


    # ## Exploring execution contexts


    For the next two examples, imagine that an Apex Trigger has been created for the
    **Contestant** object and an Apex class has been written to implement some logic
    to update the contestants'' championship points dependent on their position when
    the race ends.


    In the first example, the **Contestant** record is updated directly from the UI
    and the **Apex Debug** log shown in the next screenshot is captured.


    Notice the **EXECUTION_STARTED** and **EXECUTION_FINISHED** lines; these show
    the actual start and end of the request on the Salesforce server. The **CODE_UNIT_STARTED**
    lines show where the platform invokes Apex code. Also, note that the line number
    shows **EXTERNAL**, indicating the platform''s internal code called the Apex code.
    For the sake of brevity, the rest of the execution of the code is collapsed in
    the screenshot.'
  merge: -1
  img_proc: true
