    # # Rollup summaries and limits


    When it comes to performing calculations on your data, the platform provides a
    number of options: reports, Analytics API, dashboards, Apex Triggers, Visualforce,
    and Rollup summaries. The Rollup summary option provides a code-free solution
    with the ability to apply some condition filtering. Rollup summary fields can
    then also be referenced and combined with other features such as formula fields
    and Validation Rules.


    The key requirement is that there is a Master-Detail relationship between the
    detail records being summarized on the field being added to the master records,
    such as that between **Race** and **Contestant**. The following example will total
    the number of competitors that did not finish a given race (or DNF in Formula
    1 terms).'
  merge: -1
  img_proc: true
