- pgno: 417
  md: '+   - An exception is thrown if 100 jobs in an org are already enqueued or
    executing.

    +   - It is more complex to implement Batch Apex, which requires three methods.

    +   - Typically, the time taken to dequeue and execute can be several minutes
    or hours.

    +   - Typically, the time taken to execute (depending on the number of items)
    can be hours.

    +   - Up to 50 million database records or 50 thousand iterator items can be processed.

    +   - Records or iterator items returned from the `start` method are cached by
    the platform and passed back via the `execute` method as opposed to being the
    latest records at that time from the database. Depending on how long the job takes
    to execute, such information might have changed on the database in the meantime.

    +   - Consider re-reading record data in each execute method for the latest record
    state.

    +   - You can track Batch Apex progress via its Apex job ID.

    +   - Executing from an Apex Trigger is not advised from a bulkification perspective,
    especially if you are expecting users to utilize bulk data load tools.

    +   - You can start another Batch Apex job from another (from the finish method).

    +   - Calibrate the default scope size (the number of records passed by the platform
    to each `execute` method call) to the optimum use of governors and throughput.

    +   - Provide a subscriber org configuration (through a protected Custom Setting
    or Custom Metadata) to change the default scope size of 200.


    Note that the ability to start a Batch Apex job from another can be a very powerful
    feature in terms of processing large amounts of data through various stages or
    implementing a clean-up process. This is often referred to as **Batch Apex Chaining**.
    However, keep in mind that there is no guarantee the second job will start successfully,
    so ensure you have considered error handling and recovery situations carefully.'
