- pgno: 437
  md: '# Other Dependency Injection approaches


    A variation on the constructor pattern is to use setter methods to inject references
    into the instance of a class being unit tested. These should use the @TestVisible
    annotation so that these methods do not get used to override the instance setup
    to point to the real instances of dependent classes, which might be setup in the
    constructor.


    The factory pattern discussed earlier in this book can also be used to inject
    alternative implementations of the mock implementations. The factory approach
    does not require constructors to be declared with a list of dependencies for each
    class. Instead, instances of the interfaces are obtained by calling factory methods.


    > The use of factory dependency injection over CDI can be a matter of preference
    regarding whether the dependencies need to be declared up front or not. The Apex
    Enterprise pattern library chose to use a factory pattern for injection over CDI
    since layers such as service, domain, and selector are well defined and consistently
    applied throughout an applications code base.


    The Application class factories used in the preceding chapters of this book allow
    you to implement runtime injection of services, domain, or selector implementations
    by calling the respective methods on each of the corresponding factories.


    The following Application class factory methods allow you to obtain an instance
    of an object implementing the specified service, unit of work, domain, or selector
    class. These are the same methods that have been used in earlier chapters to implement
    various dynamic configuration behaviors at runtime:


    You must cast the result to the applicable Apex class or interface.


    ```

    Application.Service.newInstance

    Application.Domain.newInstance

    Application.Selector.newInstance

    Application.UnitOfWork.newInstance

    ```


    The following methods can be used to register an alternative implementation during
    test setup of a given service, domain or selector class.


    ```

    Application.Service.setMock

    Application.Domain.setMock

    Application.Selector.setMock

    Application.UnitOfWork.setMock

    ```'
