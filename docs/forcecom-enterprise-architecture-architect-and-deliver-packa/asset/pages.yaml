- pgno: 268
  md: "# # Introducing the Selector factory\n\nThe last chapter introduced the concept\
    \ of a **Domain factory**, which was used to dynamically construct Domain class\
    \ instances implementing a common **Apex Interface** in order to implement the\
    \ compliance framework.\n\nThe following code is used in the ComplianceService.verify\
    \ method's implementation, making no reference at all to a Selector class to query\
    \ the records needed to construct the applicable Domain class:\n\n```\nfflib_SObjectDomain\
    \ domain =\nApplication.Domain.newInstance(recordIds);\n```\n\nSo, how did the\
    \ Domain factory retrieve the records in order to pass them to the underlying\
    \ Domain class constructor? The answer is that it internally used another factory\
    \ implementation called the **Selector factory**.\n\nAs with the Domain factory,\
    \ the Selector factory resides within the Application class as a static instance,\
    \ exposed via the Selector static class member, as follows:\n\n```\npublic class\
    \ Application\n{\n    // Configure and create the SelectorFactory for this Application\n\
    \    public static final fflib_Application.SelectorFactory Selector =\n      \
    \  new fflib_Application.SelectorFactory(\n            new Map<SObjectType, Type>\
    \ {\n                Team__c.SObjectType =>TeamsSelector.class,\n            \
    \    Race__c.SObjectType =>RacesSelector.class,\n                Car__c.SObjectType\
    \ =>CarsSelector.class,\n                Driver__c.SObjectType =>DriversSelector.class,\n\
    \                Contestant__c.SObjectType => ContestantsSelector.class }});\n\
    \n    // Configure and create the DomainFactory for this Application\n    public\
    \ static final fflib_Application.DomainFactory Domain =\n        new fflib_Application.DomainFactory(\n\
    \            Application.Selector,\n            // Map SObjectType to Domain Class\
    \ Constructors\n            new Map<SObjectType, Type> {\n                Team__c.SObjectType\
    \ =>Teams.Constructor.class,\n                Race__c.SObjectType =>Races.Constructor.class,\n\
    \                Car__c.SObjectType =>Cars.Constructor.class,\n              \
    \  Driver__c.SObjectType =>Drivers.Constructor.class,\n                Contestant__c.SObjectType\
    \ =>\n                Contestants.Constructor.class}});\n}\n```"
  merge: -1
  img_proc: true
- pgno: 269
  md: 'Notice that the Selector factory is passed to the Domain factory in the preceding
    example. The following sections outline the methods on the factory and relevant
    use cases.


    # SelectorFactory methods


    The SelectorFactory class has two methods on it: newInstance and selectById. The
    following code illustrates both these methods by showing two equivalent usage
    examples to retrieve records given a set of IDs:


    ```

    List<Contestant__c> contestants =

    Application.Selector.selectById(contestantIds);

    ```


    ```

    List<Contestant__c> contestants =

    Application.Selector.newInstance(Contestant__c.SObjectType)

    .selectSObjectsById(contestantIds);

    ```


    As you can see from the preceding code, the selectById method provides a shortcut
    to access the generic selectSObjectById method from the fflib_IObjectSelector
    interface and as seen earlier in this chapter is implemented by the fflib_SObjectSelector
    base class. As such all Selector classes are guaranteed to provide it. It offers
    a cleaner way of querying records in the standard way without having to know the
    Apex class name for the Selector. This effectively is how the Domain Factory can
    dynamically instantiate a Domain class instance loaded with records on behalf
    of the developer.


    The method internally uses Id.getSObjectType (on the first ID that is passed in)
    to look up the Selector class through the map defined previously and instantiate
    it (via Type.newInstance).


    You would use the newInstance method instead of just instantiating directly via
    the new operator in the Selector class when you are writing generic code which
    handles different types of objects. In other cases you can continue to instantiate
    Selector classes in the normal manner using the new operator.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Writing tests and the Selector layer


    When writing tests specifically for a Selector class method, the process is almost
    as per the standard Apex testing guidelines; insert the data you need to support
    the queries, call the Selector methods, and assert the results returned. You can
    review some of the Selector tests included in this chapter.


    > If you have implemented Selector methods that return QueryLocator instances
    (for use by Batch Apex callers), you can still assert the results of these methods.
    Use the iterator method to obtain QueryLocatorIterator, then call the next and
    hasNext methods to return the results to pass to your assert statements.


    Of course, other Apex tests around the Controllers, Batch Apex, Domain, and Service
    layers might also invoke the Selector methods indirectly, thus providing code
    coverage, but not necessarily testing every aspect of the Selector classes.


    > Try to ensure that your Apex tests test the layers and functional components
    of the application as much as possible in isolation to ensure that the existing
    and future callers don''t run into issues.


    As highlighted previously, often writing more isolated Apex tests can be made
    harder due to the fact that the code being tested often requires records to be
    set up in the database. By leveraging the Selector factory option described earlier,
    a mocking approach can be taken to the Selector methods, which can help make writing
    more isolated and varied component or class level tests easier. We will revisit
    this topic in a later chapter.


    # Updating the FormulaForce package


    Review the updated code supplied with this chapter and update your packaging org.
    Perform another upload and install the package in your testing org. During install
    you should observe that the new Field Set component added in this chapter is shown
    as one of the new components included in the upgrade.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# # Summary


    The Selector pattern provides a powerful layer of encapsulation for some critical
    logic in your application. It can help with enforcing best practices around security
    and provides a more consistent and reliable basis for code dealing with the `SObject`
    data.


    Selectors can also take on the responsibility and concern for platform features
    such as **Multi-Currency** and **Field Sets**. Ultimately allowing the caller
    – be that the Service, Domain, or even Apex Controllers, or Batch Apex– to focus
    on their responsibilities and concerns, this leads to cleaner code which is easier
    to maintain and evolve.


    With the introduction of the Selector factory, we provide a shortcut to access
    this layer in the form of the `Application.Selector.selectById` and `Application.Selector.newInstance`
    methods, opening up potential for more dynamic scenarios such as the compliance
    framework highlighted in the last chapter.


    I''d like to close this set of chapters with a simple but expressive diagram that
    shows how the Service layer code turns with the help of the Domain and Selector
    layers. These three patterns on Force.com help add value to the developer through
    consistency and also support best practices around bulkification and code reuse.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_271_0.png)


    While this is the last chapter focusing on a Force.com implementation of Martin
    Fowler''s Enterprise Application Architecture patterns, we will revisit the role
    of the Selector in a later chapter and focus on Batch Apex as well as continuing
    to leverage our Service layer in later chapters that discuss the application integration.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# # 8 User Interface


    If I were to list all the technologies that have come and gone most often in my
    career, I would say it has to be those that impact the end user experience. Being
    a UI technology developer is a tough business; the shift from desktop to web to
    mobile to device agnostic has shaken things up, and this situation is still ongoing!
    This means that the investment in this part of your application architecture is
    important, as is the logic you put into it. Putting the wrong kind of logic in
    your client tier can result in inconsistent behavior and, at worst, an expensive
    rework if you decide to shift client technology in the future.


    This chapter discusses the aspects of delivering a user interface for Force.com-based
    applications, getting the most from the Salesforce standard UIs and building custom
    UIs with Lightning versus Visualforce. It also discusses using third-party-rich
    client frameworks, contrasting their architecture’s pros and cons with respect
    to platform features and performance. The chapter also covers how to use the **Service
    layer** and the **Domain layer** patterns, to ensure that your users'' interaction
    with your application is consistent, regardless of the user interface approach.
    We will cover the following topics in this chapter:


    +   - Which devices should you target?

    +   - Leveraging the Salesforce standard UIs

    +   - Generating downloadable and printable content

    +   - Translation and localization

    +   - Client server communication

    +   - Managing limits

    +   - Object- and Field-Level security

    +   - Managing and monitoring UI response times

    +   - Considerations for using third party JavaScript libraries'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   - Creating websites and external facing pages for communities


    +   - Mobile applications


    +   - Custom Reporting and the Analytics API


    # # Which devices should you target?


    One of the first questions historically asked when developing a web-based application
    is _Which desktop browsers and versions shall we support?_ These days, you should
    not be thinking so much about the software installed on the laptops and desktops
    of your users, but rather the devices they own.


    The answer will still likely include a laptop or desktop, though no longer is
    it a safe assumption that these are the main devices your users use to interact
    with your application. Mobile phones, tablets, watches or skills for voice recognition
    devices such as Alexa could all be used, or depending on your target market, larger
    devices such as cars or even a vending machine! So, make sure that you think big
    and understand all the types of devices your customers and their customers might
    want to interact with your application.


    > For your desktop and laptop users interacting with your Force.com application,
    it is a combination of using the standard Salesforce UI and any custom UIs you
    might have built with HTML and JavaScript. Given this fact, it is a good idea
    to base your supported browser matrix on that supported by Salesforce. You can
    find this by searching for _Salesforce supported browsers_ in Google. At the time
    of writing this, a PDF listing supported browsers can be found at https://help.salesforce.com/apex/HTViewHelpDoc?id=getstart_browser_overview.htm&language=en.


    Developing against multiple devices can be expensive, not only in terms of developing
    the solution but also performing the testing across multiple devices. In this
    chapter, we will take a look at a range of options, ranging from those provided
    by Salesforce at no additional development cost to building totally customized
    user interfaces using Visualforce, Lightning and other technologies.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# # Introducing Salesforce Standard UIs and Lightning


    Choice can be a good thing, but sometimes, the choices are not very clear, especially
    when new technologies emerge and overlapping with existing ones. In this chapter
    and the next, we will be exploring features that help you make the choice between
    standard UIs provided by Salesforce, or building your own custom UIs or, in fact,
    balancing the use of both. With the advent of the new Lightning technology from
    Salesforce, deciding what technology to use for a given custom UI requires some
    consideration.


    Salesforce has historically provided Visualforce as the recommended technology
    for building custom UIs. To some developers, it resembles Java Server Pages or
    .NET Active Server Pages, and is very powerful and stable. They also provide a
    great number of ways to extend their standard UIs with custom UIs built with Visualforce,
    allowing you to make the choice at a more granular function-by-function level,
    depending on what works best for your particular user personas.


    To further complicate things, Salesforce''s standard UIs now come in different
    variants for users to choose from. There is the Salesforce1 application, for mobiles
    and now two options for desktop users. The two desktop UIs from Salesforce are
    now known as Salesforce Classic and Salesforce Lightning Experience.


    The FormulaForce application in the Salesforce Classic standard UI is shown here:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_274_0.png)'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'This is how it is shown in the Salesforce Lightning Experience standard UI:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_275_0.png)


    > There are more options to brand your application in Lightning Experience. We
    will cover this further in the next chapter.


    Lightning Experience (or LEX for short) brings with it an entirely new client
    side architecture, which departs from the server-side rendering for its predecessor
    (Salesforce Classic) and Visualforce provided. For backwards compatibility, Visualforce
    UIs can still be used within Lightning Experience, although, using Visualforce
    in LEX will not offer the level of extensibility or visual appeal as custom UIs
    built using the Lightning framework.


    > LEX provides much more integration points for developers to extended the standard
    UI, reducing the need to build an entirely new replacement page from scratch.
    This chapter and the next will explore in more detail the ways in which Lightning
    Components can be used to extended LEX features with your own, thereby reducing
    the development costs for you, and giving your customers even more value from
    the Salesforce standard UIs and customization tools.


    For the first time, developers can now use the same technology and theme Salesforce
    have used to build their LEX based applications, known as the Lightning Framework.
    Salesforce has also chosen to open source their styling framework used by Lightning,
    which is known as the Lightning Design System (LDS). This is built into the platform
    and is available as a set of CSS files if you want to use it in Visualforce or
    externally (https://www.lightningdesignsystem.com/).'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Why consider Visualforce over the Lightning Framework?


    So why is Visualforce still a consideration? At the time of writing this book,
    the Lightning framework is taking some big steps forward in providing the same
    facilities and components that Visualforce already has. But it’s not quite there
    yet; there are some gaps to be aware of.


    If you’re reading this having already developed a Force.com application prior
    to Lightning, you will still very much be very interested in leveraging Visualforce
    until you can migrate. In this case, you will also no doubt be interested in ways
    to combine both technologies, so that you can perhaps start to develop new features
    in Lightning framework.


    In the next chapter, we will go into more detail on ways to balance both technologies.
    For now, and likely for the next couple of years, while adoption builds, Salesforce
    Classic and Lightning Experience are going to co-exist.


    # Leveraging the Salesforce standard UIs


    Salesforce puts a lot of effort into its desktop and mobile based UIs. These declarative
    UIs are the first to see advancements, such as the ability to embed reporting
    charts. These standard user interfaces are also the primary method by which your
    subscribers will customize your application’s appearance. Furthermore, the UI
    will evolve with Salesforce’s frequent updates. In some cases, new features are
    available to your users, even without you updating your application.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_276_0.png)


    > In general, aspects of your application that had already leveraged the standard
    UI in Salesforce Classic will just work fine in Lightning Experience without change,
    and will also automatically adopt the new look and feel. However, if you have
    utilized Visualforce extensively, and/or used unsupported features such as JavaScript
    Custom Buttons, you will have to make some changes. Carefully test and explore
    your application in Lightning Experience to understand what changes you need to
    make. In the next chapter, we will explore some key aspects of this transition
    and balancing the two technologies.


    In general, you should ensure that for all the objects in your application, you
    make the best use of the standard UI by ensuring that your packaged layouts are
    highly polished, and make use of every last drop of the declarative features.
    It is even worth considering this practice for those objects that might be typically
    accessed through Visualforce or Lightning-based custom UIs.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'Considering the standard UI as a kind of primary or default UI also ensures
    that the validation in your Domain classes is complete, which ensures that it
    is not possible to enter invalid data regardless of how that data is entered –
    custom UI, standard UI, or API.


    Ensure that you apply the same UI review processes you undertook on your custom
    UIs to the standard UI layouts. Take care to review field labels, sections, button
    names, and general layout while also looking for options to add more related information
    through report charts or embedding custom UIs, as described later in this chapter.
    Also, consider making use of record types and different layouts to help reduce
    the number of fields that a user has to enter.


    > Keep in mind that Salesforce layouts packaged in your application are not upgradable,
    as they can be edited by the subscriber. So, no matter what improvements you make
    to your layouts in subsequent releases, these will only be available to new customers,
    and not to those who are upgrading to newer versions of the application. New aspects
    to layouts are typically expressed in your install/upgrade documentation.


    # Overriding standard Salesforce UI actions


    You can override the Salesforce standard UI for the following actions: **Accept**,
    **Tab**, **Clone**, **Delete**, **Edit**, **List**, **New**, and **View** for
    an object with your own Visualforce pages, completely replacing the standard UI
    pages. This will also appear in LEX.


    > When overriding the View action, it is also possible to specify a Lightning
    Page (or FlexiPage as it is also known) through the **Lightning App Builder**
    tool (under **Setup**). In this case the Visualforce page you assign will only
    show within Salesforce Classic, and the Lightning Page will then show in LEX.


    Be aware that, if you take this option, you’re taking on the responsibility of
    not only ensuring that new fields added to the your application are added to such
    pages but also that new platform features of the standard UI appear in your page
    as Salesforce evolves the platform. So, be sure to review the standard UI page
    functionality before making the decision to package and override for the applicable
    action and also consider a hybrid approach described in the next subsection.


    If you decide to build a custom UI, the best way to keep inline is to use the
    Salesforce provided standard UI components. In Visualforce these are available
    in the `apex` namespace. In Lightning you can leverage the components in the `lightning`
    namespace. In either case you can style custom UI HTML elements with the Lightning
    Design System.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Using Salesforce-provided components is not however a complete solution; for
    example, Chatter does not automatically appear on pages unless a developer enables
    it. Another significant consideration is that custom fields or related lists subscribers
    added to your objects need special consideration in your page code to ensure that
    these are surfaced, through the use of the Field Sets and the apex:relatedList
    component, for example.


    Finally, note that, although the Custom Object Action overrides (defined by you)
    can be packaged, they are nonupgradable, so changes will not apply to existing
    subscribers. Also, the subscriber can remove them post-installation if they prefer
    to access the custom object through the standard UI, so this is another reason
    to make sure that you consider the standard UI for all of your objects as a standard
    practice.


    As an alternative to overriding an existing standard action, consider creating
    Custom Buttons, placing them on the object''s Detail page and/ or List View layouts,
    and naming the button something like Enhanced Edit or Enhanced New. Custom Buttons
    are available in both Salesforce Classic and LEX standard UIs to invoke Visualforce
    pages. However, they do not support Lightning-based custom UIs you build. To invoke
    a Lightning Component from the standard UI in LEX, you can either embed it in
    the Lightning Record Page layout (as shown in Chapter 6, Application Domain Layer)
    or utilize Lightning Component Actions (discussed in Chapter 9, Lightning).


    # # Combining standard UIs with custom UIs


    Unless your user experience is such that it is entirely different from that offered
    by the standard UIs, always try to retain as much of the standard UIs as you can.
    The platform provides a number of ways to do this, which we will be exploring
    through this chapter and the next. In this section we will explore ways to embed
    in specific regions of the standard UI parts of a custom UI and vice versa.


    # # Embedding a custom UI in a standard UI


    In Chapter 6, Application Domain Layer, we looked at a Lightning Component which
    can be placed on the Lightning Record Page layout. This approach only applies
    to LEX, and also provides some additional benefits such as being able to listen
    to events LEX fires as users in-line edit the record details. This approach currently
    only applies when viewing the record details.'
  merge: -1
  img_proc: true
