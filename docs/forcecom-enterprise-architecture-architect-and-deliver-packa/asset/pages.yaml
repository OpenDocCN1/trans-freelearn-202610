- pgno: 290
  md: 'The following notes apply to the preceding table:


    +   1. As Visualforce pages are essentially dynamically rendered HTML pages output
    by Salesforce servers, these can also be used to build public-facing websites
    and also pages that adapt to various devices such as mobile phones and tablets
    (given the appropriate coding by the developer). The Salesforce Streaming API
    is currently only accessible via JavaScript.


    +   2. Websites built using traditional off-platform languages, such as .NET,
    Java, Ruby, or PHP, are required to access Salesforce via the REST/SOAP and Streaming
    API''s only.


    +   3. A client is built using a device-specific platform and UI technology, such
    as a native mobile application using Xcode, Java, or a natively wrapped HTML5
    application.


    +   4. The AJAX Toolkit is a JavaScript library used to access the Salesforce
    SOAP API from a Visualforce or HTML page. It is the oldest way in which you can
    access Salesforce objects and also Apex Web Services from JavaScript. Though it
    is possible to utilize it from Custom Buttons and Visualforce pages, my recommendation
    is to utilize one of the more recent Visualforce communication options (by associating
    Visualforce pages to your Custom Buttons rather than JavaScript). Salesforce only
    supports the very latest version of this library, which is also quite telling
    in terms of their commitment to it.


    +   5. Lightning utilizes the `Content-Security-Policy` HTTP header as recommended
    by **W3C**. This controls how (use of HTTPS) and from where (Lightning domain
    only) resources are loaded from the server. Since the Salesforce API''s are served
    from a different domain, they cannot be called directly from JavaScript code inside
    a Lightning Component. Instead, you must call such API''s server-side from the
    component''s Apex controller.


    +   6. **Lightning Out** is a technology that allows Lightning Components to be
    hosted on external websites. Components running within Lightning Out are still
    able to use Lightning Server Side and Lightning Data Services to communicate with
    the backend. Note that Lightning Data Services at time of writing were only in
    Developer Preview.


    # # API governors and availability


    As shown in the preceding table, for some communication methods, Salesforce currently
    caps the amount of API requests that can be made in a rolling 24-hour period (though
    this can be extended through Salesforce support). This can be seen on the **Company
    Information** page under **Setup** and the **API Requests, Last 24 Hours** and
    **Streaming API Events, Last 24 Hours** fields.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'Note that these are not scoped by your application''s namespace unlike other
    governors (such as the SOQL and DML ones). As such, other client applications
    accessing the subscriber org can consume, and thus compete with, your application
    for this resource. If possible, utilize a communication approach listed in the
    preceding table that does not consume the API limits. If you cannot avoid this,
    ensure that you are monitoring how many requests your client is making and where
    aggregating them using relationship queries and/or Apex calls is possible.


    > If you are planning on targeting Professional Edition, be sure to discuss your
    API usage with your Partner Account Manager. The accessibility within this edition
    of Salesforce when using API''s such as the Salesforce SOAP/REST API, Streaming
    API, and AJAX Toolkit is different from other editions. For the latest information,
    you can also review the API Access in Group and Professional Editions section
    in the ISVforce Guide, available at https://na1.salesforce.com/help/pdfs/en/salesforce_packaging_guide.pdf.


    # Database transaction scope and client calls


    As discussed in Chapter 4, Apex Execution and Separation of Concerns, the transaction
    context spans the execution context for a request made to the Salesforce server
    from a client. When writing the client code in JavaScript, be careful when using
    the CRUD-based communication options such as Visualforce JavaScript Remote Objects,
    Lightning Data Service and Salesforce API, as the execution scope in the client
    does not translate to a single execution scope on the server.


    Each CRUD operation that the client makes is made in its own execution scope and,
    thus, its own transaction. This means that, if your client code hits an error
    midway through a user interaction, prior changes to the database are not rolled
    back. To wrap several CRUD operations in a single database transaction, implement
    the logic in Apex and call it through one of the previous means, such as Visualforce
    JavaScript Remote Actions or a Lightning Server Side Action. Note that this is
    generally a good practice anyway from a service-orientated application design
    perspective.


    # Offline support


    The manifest attribute on the Visualforce apex:page element is part of the HTML5
    standard to support offline web pages. While a full discussion on its use is outside
    the scope of this book, one thing to keep in mind is that any information you
    store in the browser''s local offline storage is not secure. This attribute requires
    the use of the docType attribute to indicate that the page output is HTML5-compliant.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'Salesforce, however, introduced this feature mainly to support **hybrid** mobile
    applications, wanting to utilize Visualforce pages within a native mobile application
    container that supports the offline mode. It is not supported in any other context.
    In this case, the offline content is stored within the mobile application''s own
    private store.


    Hybrid mobile applications in the context of Salesforce Mobile SDK''s are those
    that use a small native to the mobile device application that hosts a mobile browser
    that then utilizes the Salesforces login and Visualforce pages to deliver the
    application. In general, this would require a network connection; however, with
    the help of the manifest attribute, offline support can be achieved.


    > Lightning Components cannot control this attribute currently, since they do
    not own the page. It is the responsibility of the Salesforce1 and Salesforce LEX
    standard UIs to implement this attribute. Salesforce1 Mobile does support some
    offline capabilities in terms of record editing; however, there is no support
    currently for Visualforce or Lightning-based custom UIs.


    # Managing limits


    Normally, the total number of records retrieved within a single controller execution
    context is 50,000 records (in total across all SOQL queries executed). In addition,
    Visualforce components such as `apex:dataTable` and `apex:repeat` can only iterate
    over 1000 items before a runtime exception is thrown.


    At the time of writing this, the `readonly` attribute (specified on the `apex:page`
    component) changes this to 1 million records and 10,000 iterations within Visualforce
    components on the page (refer to the Salesforce documentation for the latest update).
    As the name suggests, no updates to the database can occur, which basically means
    no DML at all. Note that queries are still governed by timeouts.


    > If you require a more granular elevation of the SOQL query rows governor, you
    can apply the @ReadOnly Apex attribute to a JavaScript Remoting method in your
    controller, and not at the page level as described previously. Again, this method
    will not be able to use DML operations to update the database, but you will gain
    access to querying a higher number of query rows. Note that the iterator limit
    increase is not applicable in this context, as JavaScript Remoting and Visualforce
    iterator components cannot be used together.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'At the time of writing this, Lightning Components do not provide access to
    this functionality. Apex Controller methods exposed via the @AuraEnabled method
    are subject to the standard Apex query limits.


    # Object and field-level security


    Visualforce pages exposing the SObject information (either via Standard, Custom,
    or Extension Controllers) can leverage built-in **field-level security enforcements**
    when using components or expressions that reference SObject fields directly; such
    usage will honor the user''s field-level security. However, Visualforce expressions
    referencing SObject fields by way of a controller property are not affected, as
    the Visualforce engine cannot tell whether the controller property in turn refers
    to an SObject field.


    Lightning does not currently offer components that are sensitive to object- and
    Field-Level security. You must, instead, inform the client side controller of
    the permissions via a Lightning server-side action that leverages **Apex Describe**
    for the information being accessed. The **Lightning Data Service** component,
    in Developer Preview at time of writing, does, however, support not only object
    and field security, but also sharing rules. *Developer Preview* status means it
    is not possible to package components using it.


    # Enforcing security in Visualforce


    When using the Visualforce `apex:inputField` and `apex:outputField` components,
    fields (including the label if present) will be hidden or made read only accordingly.
    A less well-known fact is that direct SObject field expressions are also affected
    by field-level security; for example, `{ !Race__c.Status__c }` will not be evaluated
    (no output emitted to the page) if the user has no read access to the `Status__c`
    field. This behavior is particularly subtle and not well documented.'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'The documentation states that when using components such as `apex:inputText`
    and `apex:outputText`, these will not enforce field security. While this is correct,
    security is always applied to SObject field expressions as well. So, if a field
    is not visible (as opposed to just read only), even the `apex:outputText` component
    will not display a value. However, if a field is read only and is used with `apex:inputText`
    (for example), it will render as an editable field. Thus, the general guideline
    here is that, if you have an SObject field expression, use the recommended `apex:inputField`
    and `apex:outputField` components.


    A common confusion point is the use of the `with sharing` and `without sharing`
    keywords on the associated controllers. These keywords have no effect at all on
    the enforcement of field-level security; they purely determine record visibility,
    and thus effect only SOQL queries made within the controller and other Apex classes
    that make SOQL queries that are called by this controller.


    In addition to using Apex described within your controller code, you can also
    determine directly a field''s accessibility, using the `$ObjectType` global variable.
    For example, you can use the following expression to hide an entire section based
    on a given field''s security. `{!$ObjectType.Race__c.fields.Status__c.Accessible}`.


    The following Visualforce page and associated custom controller illustrates field-level
    security. In the use case shown here, two users are used, one has full access
    and the other has been given the following permissions via their profile:


    +   * Read-only access to the `Status__c` field

    +   * No access at all to the `FastestLapBy__c` field


    First, review the Visualforce page; each section shows the following use case:


    +   * Use Case A shows the use of `apex:inputField`

    +   * Use Case B shows the use of `apex:outputField`

    +   * Use Case C shows the use of `apex:inputText`

    +   * Use Case D shows the use of `apex:outputText`

    +   * Use Case E shows the use of an SObject field expression

    +   * Use Case F shows the use of a controller property expression'
  merge: -1
  img_proc: true
