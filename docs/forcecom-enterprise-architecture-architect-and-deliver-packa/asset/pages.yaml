    ```

    ```


    Consider the following implementation guidelines when utilizing Batch Apex:


    +   - A maximum of 5 active Apex Jobs can run in the org.

    +   - **Apex Flex Queue** (available under **Setup**) can queue up to 100 jobs.
    The platform automatically removes items from this queue when jobs complete. You
    can also reorder items in the queue through the UI or via an API. Jobs in the
