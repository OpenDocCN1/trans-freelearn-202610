- pgno: 366
  md: '# # Modifying and deprecating the application API


    Once a `global` class method or member has been published by including it in a
    released package, it cannot be removed or changed. For example, try changing the
    `ComplianceService.verify` method by renaming it to `verification` (for example).
    When you attempt to save the class, you will receive the following error:


    ```

    (ComplianceService) Global/WebService identifiers cannot be removed from managed
    application: Method: void verify(SET<Id>) (Line: 1)

    ```


    > If you want to perform some testing or distribute your package while reserving
    the ability to make changes to your new APIs, upload your package as a beta until
    you are happy with your API definition. Note that you can of course change the
    behavior of your API (determined by the Apex code behind it) at any time, though
    this has to be done with care.


    The `@Deprecated` annotation can be used to effectively remove from visibility
    the class, interface, method, or member that `global` has been applied to from
    the perspective of subsequent package version consumers. `Developer X` can still
    access the deprecated items by referencing an earlier version of the package through
    the class version settings shown via the **Version Settings** tab as described
    in more detail in the following sections:


    > At the time of writing this, the `@Deprecated` flag cannot be used in developer
    orgs that are unmanaged. In a later chapter, we will discuss a team development
    model that permits the development of your application through managing your code
    within Source Control system and separately managing developer orgs per developer.
    While this style of development has a number of benefits, it does exclude the
    use of the `@Deprecated` flag, as such orgs are effectively unmanaged.


    # ## Versioning Apex API definitions


    When saved, the `ApplicationAPITest` class, the **Version Settings** tab, and
    the **Dependencies** page reflects the fact that code within the class is referencing
    the `ComplianceService` and `SeasonService` classes from the FormulaForce package.'
