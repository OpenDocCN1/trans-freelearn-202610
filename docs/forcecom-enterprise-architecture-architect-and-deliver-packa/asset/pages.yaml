- pgno: 286
  md: '> You may have noticed in the preceding VisualForce code that the apex:pagecontentType
    attribute contained a "#" and some text. If you put a # symbol after the content
    type, you can specify a default filename to be presented to the user when the
    file downloads. Also note that the Visualforce formula can also be used in attribute
    values, and this is how the Race name appears in the filename. This also allows
    you to vary contentType dynamically if required.


    > While this example works quite well to illustrate the contentType attribute,
    it should be noted that the platform-reporting engine also supports CSV exports.
    As such, if you are considering CSV export facilities, it is worth first considering
    asking users to leverage reports; thus, they have more freedom to control the
    output.


    # Generating printable content


    Salesforce has a built-in PDF generation engine that can take your HTML markup
    and turn it into a PDF. This is a very useful feature to generate more formal
    documents such as invoices or purchase orders.


    You can access it using the renderAs attribute of the apex:page element on a Visualforce
    page, setting it to pdf. Note that you would typically dedicate a specific Visualforce
    page for this purpose rather than attempting to use this attribute on one used
    for other purposes.


    > Make sure that you use as much vanilla HTML and CSS as possible; the Visualforce
    standard components do not always render well in this mode. For this reason, it
    is also useful to use the standardStylesheets attribute to disable Salesforce
    CSS as well.


    You can also programmatically access this capability by using the PageReference.getContentAsPDF
    method and attaching the PDF generated to records for future. If you would rather
    generate PDF content without using a Visualforce page, you can generate the HTML
    programmatically and leverage the Blob.toPDF method. Translation and localization
    Chapter 2, Leveraging Platform Features, covered this topic, so we will not be
    revisiting it in further detail here. Just to reiterate, it is important to consider
    translation and localization requirements from the outset, as they can be expensive
    to retrofit afterwards.'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'Also, note that in the preceding example, the $ObjectType global variable was
    used in the Visualforce page to access the **Custom Field** label for the column
    title. Ensuring that you leverage approaches like this will reduce the number
    of **Custom Labels** you need to create and, ultimately, your translation costs.


    > > Lightning Components do not currently support $ObjectType; as a workaround,
    you can use Apex Describe to expose this via your Apex Controller.


    In Visualforce, you can use the `apex:inputField` and `apex:outputField` components
    to render and receive input from the user, which is locale sensitive. In Lightning,
    utilize the `lightning:formattedNumber` and `lightning:formattedDateTime` components.


    # Overriding the page language


    By default, the Visualforce page looks up translated text for Custom Field labels
    and Custom labels that you reference on your page or in your Apex code through
    the user''s locale. However, if you wish to override this, you can specify the
    `<apex:page language` attribute, for example, if you wish to use a Visualforce
    page to generate a newsletter in different languages and wish to preview them
    before sending them out.


    > > There is no equivalent functionality for Lightning Components; these always
    leverage the language of the user.


    This does not apply to any descriptive field values such as `Name` or any custom
    description fields that you add to your objects. In order to provide translation
    for the data entered by a user, you must develop such a feature yourself. There
    is no platform support for this.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# # Client server communication


    Fundamentally, any communication between the user''s chosen device (client) and
    the data and logic available on the Salesforce server occurs using the HTTP protocol.
    As a Force.com developer, you rarely get involved with the low-level aspects of
    forming the correct HTTP POST or HTTP GET request to the server and parsing the
    responses.


    For example, the Visualforce `apex:commandButton` and `apex:actionFunction` (AJAX)
    components do an excellent job of handling this for you, resulting in your Apex
    code being called with very little effort on your behalf apart from simply using
    these components. Salesforce also takes care of the security aspects for you,
    ensuring that the user is logged in, and has a valid session to make the request
    to the server. For Lightning Components, there are no direct equivalent components
    through the component markup. Instead, the `$A.enqueueAction` JavaScript method
    can be called from a component''s client-side controller method to access the
    Apex code.


    Depending on the context your client code is running in, Force.com offers a number
    of communication options to either perform CRUD operations on Standard or Custom
    Objects, and/or invoke your application''s Apex code to perform more complex tasks.


    It is important that you correctly place the logic in your Domain and Service
    layers to make sure that, regardless of the client communication options, the
    backend of your application behaves consistently and that each client has the
    same level of functionality available to it. The sections in this chapter will
    show how to ensure that, regardless of the communications approach utilized, these
    layers can be effectively reused and accessed consistently.


    # # Client communication options


    Although the upcoming sections discuss the various communications in further detail,
    a full walk-through of them is outside the scope of this book. The Salesforce
    documentation and developer site offer quite an extensive set of examples on their
    use.


    The aim of this chapter is to understand the architecture decisions behind using
    them, related limits, and how each interacts with the Apex code layers introduced
    in the previous chapters.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'This table lists the various client communication options available along with
    the types of user interface they are typically utilized by. It also indicates
    whether the API calls are governed (see the following subsection on what this
    means).


    | Communication option | Visualforce Pages (1) | Lightning Component | Custom
    Button or Link | Websites | Native device UI (3) | API limits |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | Visualforce Components (apex:commandButton, apex:actionFunction) | Yes | No
    | No | Yes (1) | No | No |

    | Visualforce JavaScript Remoting (Apex code) | Yes | No | No | Yes (1) | No |
    No |

    | Visualforce JavaScript Remote Objects (CRUD operations) | Yes | No | No | Yes
    (1) | No | No |

    | Salesforce REST / SOAP API''s(CRUD API, API SOAP and REST API''s, Analytics)
    | Yes | No (5) | No | Yes (2) | Yes | Yes |

    | Salesforce Streaming API (Read access to standard and custom objects) | Yes
    | No (5) | No | Yes (2) | Yes | Yes |

    | AJAX Toolkit (4) | Yes | No | Yes | Yes (2) | No | Yes |

    | Lightning Server Side Action @ AuraEnabled | No | Yes | No | No (6) | No | No
    |

    | Lightning Data Services (CRUD access) | No | Yes | No | No (6) | No | No |'
