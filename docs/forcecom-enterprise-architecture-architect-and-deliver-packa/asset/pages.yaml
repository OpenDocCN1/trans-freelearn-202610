  md: '# # A quick guideline checklist


    Here is a useful table that summarizes the earlier guidelines:


    | When thinking about... | The guidelines are... |

    | :--- | :--- |

    | Naming conventions | • Suffix class names with service<br>• Stick to application
    vocabulary<br>• Avoid acronyms<br>• Class, method, and parameter names matter<br>•
    Avoid redundancy in names<br>• Utilize inner classes to scope by service |

    | Sharing Rules | • Use the `with sharing` keyword on Service classes<br>• Elevate
    to without sharing only when needed and only for as short a time as possible |

    | Bulkification | • On Service methods, utilize list parameters over single parameters
    to encourage optimized service code for bulk callers<br>• Single instance parameters
    can be used where it''s overly expensive to engineer bulkified implementations
    and there is little functional benefit |

    | Defining and passing data | • Keep data neutral to the caller<br>• Leverage
    inner classes to scope data<br>• Pass only what is needed |

    | Transaction management | • Callers can assume that work is rolled back if exceptions
    are raised by the service methods, so they can safely handle exceptions themselves<br>•
    Wrap service method code in `SavePoint` |

    | Compound services | • Maintain the Service layer''s functional encapsulation
    by monitoring for multiple service method calls in one execution context<br>•
    Create new service methods to wrap existing ones or merge existing methods as
    needed |'
