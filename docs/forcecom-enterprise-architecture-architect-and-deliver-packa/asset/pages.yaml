    # Testing the Domain layer


    Testing your Domain code can be accomplished in the standard Force.com manner.
    Typically, test classes are named by suffixing `Test` at the end of the Domain
    class name, for example, `RacesTest`. Test methods have the option to test the
    Domain class code functionality either directly or indirectly.


    Indirect testing is accomplished using only the DML and SOQL logic against the
    applicable Custom Objects and asserting the data and field errors arising from
    these operations. Here, there is no reference to your Domain class at all in the
    test code.


    However, this only tests the Apex Trigger Domain class methods. For test methods
    that represent custom domain behaviors, you must create an instance of the Domain
    class. This section will illustrate examples of both indirect and direct testing
    approaches.'
  merge: -1
  img_proc: true
- pgno: 233
  md: "# Unit testing\n\nAlthough developing tests around the Service layer and related\
    \ callers (controllers, batch, and so on) will also invoke the Domain layer logic,\
    \ it is important to test as many scenarios specifically against the Domain layer\
    \ as possible, passing in different configurations of record data to test both\
    \ success and failure code paths and making sure that your Domain layer logic\
    \ is as robust as possible. Wikipedia describes the definition of a **unit test**\
    \ as follows (`http://en.wikipedia.org/wiki/Unit_testing`):\n\n> In computer programming,\
    \ unit testing is a method by which individual units of source code, sets of one\
    \ or more computer program modules together with associated control data, usage\
    \ procedures, and operating procedures are tested to determine if they are fit\
    \ for use. Intuitively, one can view a unit as the smallest testable part of an\
    \ application. In procedural programming, a unit could be an entire module, but\
    \ it is more commonly an individual function or procedure. In object-oriented\
    \ programming, a unit is often an entire interface, such as a class, but could\
    \ be an individual method. Unit tests are short code fragments created by programmers\
    \ or occasionally by white box testers during the development process.\n\nTesting\
    \ of the Domain layer falls into this definition. The following sections illustrate\
    \ the traditional and still very much valid approach to testing your Domain class\
    \ code through setting up test data using DML and executing the code. In a later\
    \ chapter, we will review an Apex Mocking framework (similar to **Mockito** in\
    \ Java), which provides a much leaner and more targeted means to test your Domain\
    \ code.\n\n# Test methods using DML and SOQL\n\nTo test the Apex Trigger methods\
    \ of the Domain class, the traditional use of DML and SOQL can be applied alongside\
    \ the use of the Apex runtime `DMLException` methods to assert not only the error\
    \ message but also other details. The following Apex test method illustrates how\
    \ to do this:\n\n```\n@IsTest\nprivate static void testAddContestantNoneScheduled()\
    \ {\n    // Test data\n    Season__c season =\n        new Season__c(Name = '2014',\
    \ Year__c = '2014');\n    insert season;\n\n    Driver__c driver =\n        new\
    \ Driver__c(\n            Name = 'Lewis Hamilton', DriverId__c = '42');\n    insert\
    \ driver;\n    Race__c race =\n```"
