    # # Building customizable user interfaces


    The most customizable aspect of the user interface your application delivers is
    the one provided by Salesforce through its highly customizable layout editor that
    provides the ability to customize the standard user interface pages (including
    those now delivered via the mobile client Salesforce1) used to list, create, edit,
    and delete records.


    Lightning Experience is the latest user interface experience available for your
    desktop users. Salesforce Classic or Aloha is the name given to the existing user
    interface. Its radically different both in appearance and technology. Fortunately,
    your existing investments in layouts and Visualforce are still compatible. Lightning
    however does bring with it a more component driven aspect and with it new tools
    to that allow even greater customization of the overall user experience.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Keep in mind any user experience you deliver that is not leveraging the standard
    user interface takes added effort on behalf of the developer typically utilizing
    Custom Settings and Fieldsets to provide customization facilities. Visualforce
    pages or Lightning components can be used to customize parts of or completely
    replace the standard user interface. This will be covered in more detail in Chapter
    8, User Interface.


    > > It is worth noting that subscriber org administrators can modify the page
    overrides defined and packaged on your Custom Objects to re-enable the Salesforce
    standard user interface instead of using your packaged Visualforce page. As such,
    it''s worth keeping in mind giving some aesthetic attention to all your Custom
    Object layouts. Also, note that action overrides and layout components do not
    get upgraded.


    # # Layouts


    The following is a brief summary of the customization features available beyond
    the standard sections and field ordering. These allow you to add graphs and custom
    UIs that help combine the layout customization with the flexibility and power
    of Visualforce:


    +   * **Visualforce**: Layout sections allow you to embed a Visualforce page using
    the Standard Controllers. While this is only supported on the standard view pages,
    you are able to do whatever you wish on the Visualforce page itself.

    +   * **Report charts**: Recently, the ability to embed a report chart into a
    layout has been added to the platform. This is a powerful feature to enhance the
    information provided to the user using a parameterized report.

    +   * **Actions**: This allows you to describe, either declaratively or programmatically,
    additional actions beyond the standard platform actions. They are only applicable
    if you have enabled Chatter for the object.

    +   * **Custom Buttons**: Much like actions, this allows additional buttons on
    the detail and list view pages to invoke application specific functionality. Creating
    Custom Buttons and hooking them up to your Apex code is covered in Chapter 8,
    User Interface.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Visualforce


    When you are considering building dedicated or even embedded (within layouts)
    Visualforce pages, always give consideration to end users who want to extend the
    layout and/or tables on the page with their own custom fields. Fieldsets offer
    the best means to achieve this; a later chapter will go into this in more detail.


    # Lightning App Builder and Components


    Lightning App Builder (available under the Setup menu) can be used by users in
    the subscriber org to customize the user experience of Salesforce Mobile and Lightning
    Experience. This tool allows users to build brand new pages using a drag and drop
    tool as well as to customize existing Lightning Experience pages provided by Salesforce
    such as the Home page and Record Detail pages.


    > The Record Detail component leverages the existing layouts defined via the existing
    layout editor to determine the layout of fields when displaying records.


    Lightning Components are the fundamental building blocks that determine what information
    and functionality is available in Salesforce Mobile and Lightning Experience user
    experiences. Some standard components are provided by Salesforce and can also
    be built by other developers, as well as included in your package to expose your
    functionality. In a later chapter we will be taking a deeper look at the architecture
    of Lightning and how that effects how you deliver functionality in your application.


    # E-mail customization with e-mail templates


    Using Apex, you can write code to send e-mails using the Messaging API. This allows
    you to dynamically generate all attributes of the e-mails you wish to send, the
    from and to address, subject title, and body. However, keep in mind that end users
    will more than likely want to add their own logo and messaging to these e-mails,
    even if such e-mails are simply notifications aimed at their internal users.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Instead of hardcoding the structure of e-mails in your code, consider using
    email templates (under the **Setup** menu). This feature allows administrators
    in the subscriber org to create their own e-mails using replacement parameters
    to inject dynamic values from records your objects define. Using a Custom Setting,
    for example, you can ask them to configure `DeveloperName` of the e-mail template
    to reference in your code. You can package e-mail templates as starting points
    for further customization, though keep in mind that they are not upgradable.


    > If data being included in the e-mail is not stored as a field on a Custom Object
    record or formula field, consider providing some Visualforce custom components
    in your package that can be used in Visualforce e-mail templates. These components
    can be used to invoke the Apex code from the e-mail template to query information
    and/ or perform calculations or a reformat of information.


    # Process Builder, Workflow and Flow


    Salesforce provides several declarative tools to implement business processes
    and custom user experience flows. End user operations such as creating, updating,
    or starting an approval process for a record; can be customized through two tools
    known as **Workflow and Process Builder**. When you need to implement a UI flow
    that provides a wizard or interview style user experience, you can use the **Visual
    Flow** tool. This tool can be used to define more complex conditional business
    processes that need to read and update records. Automation Flows or sometimes
    "headless flows" are Visual Flows that do not interact with the user and can be
    referenced within Apex code as well as Process Builder.


    Process Builder is the successor to Workflow. It provides the same functionality
    as it plus additional features for updating child records for example and extensibility
    for developers. It is also easier for end users to build and visualize more complex
    processes with its more modern graphical layout. Though you can use both interchangeably
    its best to focus on one or the other, making it easier to locate and maintain
    customizations.


    As an application developer, these can be created and packaged as part of your
    application. Such components are upgradable (provided that they are marked as
    **Protected**). Typically, however, package developers tend to leave the utilization
    of these features to consultants and subscriber org admins in preference to Apex
    and/ or Visualforce, where more complex logic and user experiences can be created.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Just as these tools can be used by administrators to customize their orgs.
    You may want to consider exposing your Apex driven application business processes
    through Invocable Methods, to effectively extended the functionality available
    to admins through these tools. Put another way this allows users of the Process
    Builder and Visualflow Flow tools to invoke your application functionality through
    clicks not code. We will be revisiting this in Chapter 10, Providing Integration
    and Extensibility.


    # Social features and mobile


    Chatter is a key social feature of the platform; it can enable users of your application
    to collaborate and communicate contextually around the records in your application
    as well as optionally invite their customers to do so, using the Chatter Communities
    feature. It is a powerful aspect of the platform but covering its details is outside
    the scope of this book.


    You can enable Chatter under the Chatter Settings page under Setup, after which
    you can enable Feed Tracking (also under Setup) for your Custom Objects. This
    setting can be packaged, though it is not upgradable and can be disabled by the
    subscriber org administrator. Be careful when packaging references to Chatter
    such as this, as well as including references to the various Chatter-related objects,
    since this will place a packaging install dependency on your package, requiring
    all your customers to also have this feature enabled.


    By creating actions on your Custom Objects, you can provide a quick way for users
    to perform common activities on records, for example, updating a contestant''s
    status to DNF. These actions are also visible through the Salesforce1 Mobile application,
    so they enhance the productivity of the mobile user further compared to standard
    record editing.


    Perform the following steps in the packaging org to try out the process:


    +   1. Enable Feed Tracking for the Race, Driver, and Contest Custom Objects as
    described earlier; the fields being tracked are not important for the following
    steps, but you may want to select them all to get a better feel for the type of
    notifications Chatter generates. Also enable Publisher Actions from the Chatter
    Settings page.'
