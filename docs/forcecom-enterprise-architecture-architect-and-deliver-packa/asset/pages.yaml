- pgno: 236
  md: "```\nupdate contestant;\n\nTest.startTest();\n    Contestants contestants =\n\
    \        new Contestants(new List<Contestant__c> { contestant });\n    contestants.awardChampionshipPoints();\n\
    \    Application.UnitOfWork.newInstance();\n    System.assertEquals(25, (Contestant__c)\n\
    \        contestants.Records[0].ChampionshipPoints__c);\nTest.stopTest();\n}\n\
    ```\n\nPerforming SOQL and DML in tests is expensive in terms of CPU time and\
    \ adds to the overall time it takes to execute all application tests, which becomes\
    \ important once you start to consider Continuous Integration (covered in a later\
    \ chapter). For example, whether it is always necessary to commit data updates\
    \ from the Domain layer, as Service layer tests might also be performing these\
    \ types of operations and asserting the results.\n\n# Calling the Domain layer\n\
    \nThe Domain layer is positioned with respect to visibility and dependency below\
    \ the Service layer. This in practice means that Domain classes should not be\
    \ called directly from the execution context code, such as Visualforce Controllers,\
    \ Lightning Component Controllers or Batch Apex, as it is the Service layer's\
    \ responsibility to be the sole entry point for business process application logic.\n\
    \nThat being said, we saw that the Domain layer also encapsulates an object's\
    \ behavior as records are manipulated by binding Apex Trigger events to methods\
    \ on the Domain class. As such, Apex Triggers technically form another point of\
    \ invocation.\n\nFinally, there is a third caller type for the Domain layer, and\
    \ this is another Domain class. Restrict your Domain class callers to the following\
    \ contexts only:\n\n+   * **Apex Triggers**: This calls via the `fflib_SObjectDomain.handleTrigger`\
    \ method.\n+   * **Service layer**: This layer directly creates an instance of\
    \ a Domain class via the new operator or through the Domain factory approach seen\
    \ earlier in this chapter. Typically, the Domain class custom methods are called\
    \ in this context.\n+   * **Domain layer**: Other Domain classes can call other\
    \ Domain classes, for example, the `Races` Domain class can have some functionality\
    \ it implements that also requires the use of a method on the `Contestants` Domain\
    \ class."
  merge: -1
  img_proc: true
- pgno: 237
  md: "> Note that it is entirely acceptable to have a Domain class with no Service\
    \ class code referencing it at all, such as in the case where the Domain class\
    \ solely implements the code for use in an Apex Trigger context and doesn't contain\
    \ any custom Domain methods. Then, the only invocation of the Domain class will\
    \ be indirect via the trigger context.\n\n# Service layer interactions\n\nWhile\
    \ implementing the compliance framework earlier in this chapter, we saw how a\
    \ Domain class can be dynamically created within a generic service method. Typically,\
    \ Domain classes are created directly. In this section, we will see a couple of\
    \ examples of these.\n\nThe following code shows the Domain class constructor\
    \ being passed records from a Selector class, which returns `List<Contestant__c>`\
    \ for the purposes of this chapter. Notice that the Unit Of Work is created and\
    \ passed to the Domain class custom method so that this method can also register\
    \ work of its own to be later committed to the database:\n\n```\npublic class\
    \ ContestantService {\n    public static void awardChampionshipPoints(\n     \
    \   Set<Id> contestantIds) {\n        fflib_SObjectUnitOfWork uow =\n        \
    \    Application.UnitOfWork.newInstance();\n\n        // Apply championship points\
    \ to given contestants\n        Contestants contestants =\n            new Contestants(\n\
    \                new ContestantsSelector().selectById(contestantIds));\n     \
    \   contestants.awardChampionshipPoints(uow);\n\n        uow.commitWork();\n \
    \   }\n}\n```\n\nYou might have noticed that this example reworks the Service\
    \ example from the previous chapter by refactoring the code and calculating the\
    \ points closer to the object for which the code directly applies by basically\
    \ moving the original code to the Domain class."
