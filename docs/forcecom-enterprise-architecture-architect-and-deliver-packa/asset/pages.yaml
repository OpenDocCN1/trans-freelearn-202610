- pgno: 150
  md: '# # Separation of Concerns


    As you can see there are a number of places Apex code is invoked by various platform
    features. Such places represent areas for valuable code to potentially hide. It
    is hidden because it is typically not easy or appropriate to reuse such logic
    as each of the areas mentioned in the previous table has its own subtle concerns
    with respect to security, state management, transactions, and other aspects such
    as error handling (for example, catching and communicating errors) as well as
    varying needs for bulkification.


    Throughout the rest of this chapter, we will review these requirements and distill
    them into a Separation of Concerns that allows a demarcation of responsibilities
    between the Apex code used to integrate with these platform features versus the
    code implementing your application business logic, such that the code can be shared
    between platform features today and in the future more readily. Wikipedia describes
    the benefits of Separation of Concerns as the following:


    > "The value of Separation of Concerns is simplifying development and maintenance
    of computer programs. When concerns are well separated, individual sections can
    be developed and updated independently. Of especial value is the ability to later
    improve or modify one section of code without having to know the details of other
    sections, and without having to make corresponding changes to those sections."


    # ## Apex code evolution


    Apex Triggers can lead to a more traditional pattern of if/then/else style coding
    resulting in a very procedural logic that is hard to maintain and follow. This
    is partly due to them not being classes and as such they don''t naturally encourage
    breaking up the code into methods and separate classes. As we saw in the previous
    table, Apex Triggers are now not the only execution context for Apex; others do
    support Apex classes and the object-oriented programming (OOP) style, often leveraging
    system-defined Apex interfaces to allow the developer to integrate with the platform
    such as Batch Apex.


    Apex has come a long way since its early introduction as a means of writing more
    complex Validation Rules in Apex Triggers. These days, the general consensus in
    the community is to write as little code as possible directly in Apex Trigger,
    instead of delegating the logic to separate Apex classes. For a packaged application,
    there is no real compelling reason to have more than one Apex Trigger per object.
    Indeed, the Salesforce security review has been known to flag this even if the
    code is conditioned to run independently.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'A key motivation to move the Apex Trigger code into an Apex class is to gain
    access to the more powerful language semantics of the Apex language, such as OOP,
    allowing the developer to structure the code more closely to the functions of
    the application and gain better code reuse and visibility.


    # # Separating concerns in Apex


    Each execution context has its own requirements for your code, such as implementing
    system interfaces, annotations, or controller bindings. Within this code are further
    coding requirements relating to how you engineer your application code, which
    lead to a set of common architecture layers of concern, such as loading records,
    applying validations, and executing business logic.


    Understanding these layers allows us to discover a different way to write the
    application code than simply writing all our code in a single Apex class, which
    becomes tightly coupled to the execution context and thus less flexible in the
    future.


    To manage these layers of concern in the code, create separate classes—those that
    are bound to the specific execution context (such as Batch Apex, Scheduler, Apex
    REST, and Inbound Messaging) and those that contain the application business logic
    that implements the actual task for the user.


    The following UML diagram shows the Apex classes that implement the requirements
    (or concerns) of the execution context and Apex classes to execute the application
    business logic. The dotted line indicates a Separation of Concerns between UI
    controller (these could be Visualforce or Lightning Component Controllers) classes
    and classes implementing the application business logic.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_151_0.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# # Separation of concerns in Lightning Component JavaScript


    Like Visualforce''s use of the Model View Controller (MVC), Lightning Components
    also think in terms of SOC by splitting up the implementation of the component
    into several distinct files that each have their own concerns. As Lightning Components
    are mostly implemented on the client side these files represent a way to implement
    separation of concerns within the JavaScript code you write.


    When creating a Lightning Component in the Salesforce Developer Console, you are
    presented with the following side panel which outlines the different files that
    make up your component:


    | Shortcut | Type | Action |

    | :--- | :--- | :--- |

    | Ctrl + Shift + 1 | COMPONENT | |

    | Ctrl + Shift + 2 | CONTROLLER | Create |

    | Ctrl + Shift + 3 | HELPER | Create |

    | Ctrl + Shift + 4 | STYLE | Create |

    | Ctrl + Shift + 5 | DOCUMENTATION | Create |

    | Ctrl + Shift + 6 | RENDERER | Create |

    | Ctrl + Shift + 7 | DESIGN | Create |

    | Ctrl + Shift + 8 | SVG | Create |


    We will go into more detail on these in Chapter 9, Lightning, for now let''s consider
    the CONTROLLER, HELPER and RENDER files.


    +   1. CONTROLLER: Code in this file is responsible for implementing bindings
    to the visual aspects of the component. Defined via the markup defined in the
    COMPONENT file. Unlike a Visualforce controller, it only contains logic providing
    bindings to the UI. The client side state of your component is accessed via the
    controller.


    +   2. HELPER: Code in this file is responsible for the logic behind your components
    behavior, button presses and other interactions, which lead to accessing the backend
    Apex controller, combining inputs and outputs to interface with the user and the
    backend. Methods on the helper take an instance of the controller to manipulate
    the state and UI.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '+   3. RENDER: Code in this file is only needed in more advanced scenarios
    where you want to override or modify the HTML DOM created by the Lightning Framework
    itself using markup expressed in your COMPONENT file. It is focused on the presentation
    of your component in the browser.


    Lightning Components client-side controllers can communicate with an Apex Controller
    class via the @AuraMethod annotation and thus access classes implementing your
    share application business logic as shown in the preceding diagram.


    Later in this book we will be building a Lightning Component to package within
    our FormulaForce application.


    # Execution context logic versus application logic concerns


    In this section, we will review the needs/concerns of the execution context and
    how each can lead to a common requirement of the application business logic. This
    helps define the guidelines around writing the application business logic, thus
    making it logical and more reusable throughout the platform and application:


    +   Error handling: When it comes to communicating errors, traditionally, a developer
    has two options: Let the error be caught by the execution context or catch the
    exception to display it in some form. In the Visualforce Apex controller context,
    it''s typical to catch exceptions and route these through the ApexPage .addMessage
    method to display messages to the user via the apex:pageMessages tag. In contrast
    to Batch Apex, letting the platform know that the job has failed involves allowing
    the platform to catch and handle the exception instead of your code. In this case,
    Apex REST classes, for example, will automatically output exceptions in the REST
    response.


    +   Application business code implication: The point here is that there are different
    concerns with regard to error handling within each execution context. Thus, it
    is important for application business logic to not dictate how errors should be
    handled by calling the code.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '+   **Transaction management**: As we saw earlier in this chapter, the platform
    manages a single default transaction around the execution context. This is important
    to consider with the error handling concern, particularly if errors are caught,
    as the platform will commit any records written to the database prior to the exception
    occurring, which may not be desirable and may be hard to track down.


    +   **Application business code implication**: Understanding the scope of the
    transaction is important, especially when it comes to writing application business
    logic that throws exceptions. Callers, especially those catching exceptions, should
    not have to worry about creating `Database.Savepoint` to rollback the state of
    the database if an exception is thrown.


    +   **Number of records**: Some contexts deal with a single database record, such
    as a Visualforce Standard Controller, and others deal with multiple records, such
    as Visualforce Standard Set Controllers or Batch Apex. Regardless of the type
    of execution context, the platform itself imposes governors around the database
    operations that are linked with the number of records being processed. Every execution
    context expects code to be bulkified (minimal queries and DML statements).


    +   **Application business code implication**: Though some execution contexts
    appear to only deal with a single record at a time in reality because database-related
    governors apply to all execution context types, it is good practice to assume
    that the application code should consider bulkification regardless. This also
    helps make the application code more reusable in future from different contexts.


    +   **State management**: Execution contexts on Force.com are generally stateless;
    although as described earlier in this chapter, there are some platform facilities
    to store state across execution contexts.


    +   **Application business code implications**: As the state management solutions
    are not always available and are also implemented in different ways, the application
    code should not attempt to deal directly with this concern and should make itself
    stateless in nature. If needed, provide custom Apex types that can be used to
    exchange the state with the calling execution context code, for example, a controller
    class.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '+   - Security: It could be said that the execution context should be the one
    concerned with enforcing this, as it is the closest to the end user. This is certainly
    the case with a controller execution context where Salesforce recommends the `with
    sharing` keyword is placed. However, when it comes to CRUD and FLS security, the
    practicality of placing enforcement at the execution context entry point will
    become harder from a maintenance perspective, as the code checking the users''
    permissions will have to be continually maintained (and potentially repeated)
    along with the needs of the underlying application business code.


    +   - Application business code implication: The implication here is that it is
    the concern of both the execution context and the application business logic to
    enforce the users permissions. However, in the case of sharing, it is mainly the
    initial Apex caller that should be respected. As we dive deeper into the engineering
    application business logic in later chapters, we will revisit security several
    times.


    > A traditional approach for logging errors for later review by administrators
    or support teams is to use a log table. While in Force.com this can be implemented
    to some degree, keep in mind that some execution contexts work more effectively
    with the platform features if you don’t catch exceptions and let the platform
    handle it. For example, the Apex Jobs page will correctly report failed batches
    along with a summary of the last exception. If you implement a logging solution
    and catch these exceptions, visibility of failed batch jobs will be hidden from
    administrators. Make sure that you determine which approach suites your users
    best. If you decide to implement your own logging, keep in mind that this requires
    some special handling of Apex database transactions and the provision of application
    functionality to allow users to clean up old logs.


    # Improving incremental code reuse


    There is Separation of Concerns between code invoked directly through an execution
    context and the application business logic code within an application. This knowledge
    is important to ensure whether you can effectively reuse application logic easily,
    incrementally, and with minimal effort. It is the developer''s responsibility
    to maintain this Separation of Concerns by following patterns and guidelines set
    out in the chapters of this book and those you devise yourself as part of your
    own coding guidelines.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Reuse needs may not always be initially obvious. However, by following Separation
    of Concerns and the design patterns in this book, when they do arise as your application
    evolves and/or new platform features are added, the process is more organic without
    refactoring, or worse, copying and pasting the code!


    To illustrate a reuse scenario, imagine that in the first iteration of the FormulaForce
    application, awarding points to a race contestant was accomplished by the user
    through an Award Points button on the Contestant detail page for each contestant.
    Also, the newsletter functionality was accessed by manually clicking a Send News
    Letter button on the Season detail page each month.


    The class diagram for the first iteration is shown in the next diagram. Note that
    you can already see the beginning of a separation of concern between the Apex
    controller logic and application business logic, which is contained in the classes
    ending in Service. The Service layer is discussed in more detail later in this
    chapter.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_156_0.png)


    Now, imagine that in the second iteration of the application, user feedback requested
    that the awarding of points should also be available at the race level and applied
    in one operation for all contestants through a button on the Race detail page.
    In the following class diagram, you can see that the ContestService class is now
    reused by the RaceService class in order to implement the RaceController.awardPoints
    service method:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_156_1.png)'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'An additional enhancement was also requested to permit the newsletter functionality
    to use the platform scheduler to automatically issue the newsletter. The following
    diagram shows that the SeasonService class is now reused by both the SeasonNewsLetterSchedule
    class as well as the SeasonController class:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_157_0.png)


    The preceding examples have shown that code from the first iteration can be reused
    either from the new application business logic or from a new execution context
    in the case of the scheduler. In the next chapter, we will take a further look
    at the Service layer, including its design guidelines that make this kind of reuse
    possible.


    # # Patterns of Enterprise Application Architecture


    So far, we have only discussed Separation of Concerns between the Apex code invoked
    from an execution context (Apex Controller, Scheduler, Batch Apex, and so on)
    and reusable application business logic code placed in the `Service` classes.
    However, there are further levels of granularity and patterns that help focus
    and encapsulate application logic further, known as Enterprise Application Architecture
    patterns.


    The general definitions of the patterns used in the next three chapters of this
    book are not inherently new, but are a new implementation for this platform. They
    have been and continue to be incredibly popular on other platforms. The original
    author of these patterns is Martin Fowler, who describes the other patterns in
    his book, *Patterns of Enterprise Application Architecture* (http://www.martinfowler.com/
    books/eaa.html)'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'This book takes some of the patterns in Martin Fowler''s book and applies them
    to the platform while also taking the opportunity to bake in a few best practices
    on the Force.com platform. The next section is a short summary of those we will
    be taking a closer look at.


    # ## The Service layer


    The following is Martin Fowler''s definition of the Service layer (http://martinfowler.com/eeaCatalog/serviceLayer.html):


    > "Defines an application''s boundary with a layer of services that establishes
    a set of available operations and coordinates the application''s response in each
    operation."


    You had a little preview of this pattern in action within this chapter. You can
    see that for the business application logic, it forms an initial entry point,
    encapsulating operations and tasks the end users perform.


    Its methods and behavior are designed such that it is agnostic of the caller,
    making it adaptable to multiple execution contexts easily, as shown in the earlier
    examples. It also has a role to play in your applications API strategy.


    # ## The Domain Model layer


    The following is Martin Fowler''s definition of the Domain layer (http://martinfowler.com/eeaCatalog/domainModel.html):


    > "An object model of the domain that incorporates both behavior and data. At
    its worst, business logic can be very complex. Rules and logic describe many different
    cases and slants of behavior, and it''s this complexity that objects were designed
    to work with."


    If you think of the Service layer as the band conductor, the Apex classes that
    make up the Domain layer are the instruments it conducts, each with its own role
    and responsibility in making the music!'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'The Domain layer in a Force.com context helps group and encapsulate logic specific
    to each physical Custom Object in the application. Also, while utilizing object-oriented
    concepts such as interfaces and inheritance to apply common behavioral aspects
    between your Custom Objects in your application, such as security, it is responsible
    for applying validations and processing historically done in the Apex Triggers
    code directly. Note that the Service layer can leverage these classes to form
    high-level business application logic that spans multiple objects and thus can
    access and reuse domain object-specific logic.


    # The Data Mapper (Selector) layer


    The following is Martin Fowler''s definition of the Data Mapper layer (`http://martinfowler.com/eeaCatalog/dataMapper.html`):


    > "A layer of Mappers (473) that moves data between objects and a database while
    keeping them independent of each other and the mapper itself."


    Making effective use of database queries to fetch data is as important on Force.com
    as any other platform. For complex object models, having SOQL do some of the heavy
    lifting can lead to some fairly sophisticated queries. Encapsulating how data
    from the database is mapped into memory is the role of the Data Mapper layer.


    In Martin Fowler''s world, this usually involves mapping database result set records
    returned into Java classes (known as **Plain Old Java Objects (POJO)** or **Data
    Transformation Objects (DTO)**). However, Apex provides us with these data structures
    for each of our custom objects in the form of SObject. Thus, the role of this
    pattern is slightly different, as the SOQL query itself explicitly selects SObject
    representing the data. Hence, this pattern has been renamed to reflect its key
    responsibility more accurately.


    # Introducing the FinancialForce.com Apex Commons library


    There exists an Apex class library used to support these patterns, which is also
    used in this book. The Apex Commons library is from an open source project started
    by FinancialForce.com and launched to the community at the Dreamforce 2012 event.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'Since then, the patterns have been adopted by other developers on the platform
    and

    have been extended with additional features such as Fieldsets and Security. We
    will

    be using this library in the next three chapters as we explore the enterprise
    patterns

    they support in more detail. The GitHub repository can be found at https://

    github.com/financialforcedev/fflib-apex-common.


    # # Unit testing versus system testing


    When it comes to testing the Apex code, we know the drill: Write good tests to
    cover

    your code, assert its behavior, and obtain at least 75 percent coverage. Force.com
    will

    not allow you to upload packaged code unless you obtain this amount or higher.
    You

    also have to cover your Apex Trigger code, even if it''s only a single line, as
    you will

    soon see is the case with the implementation of the Apex Triggers in this book.


    However, when it comes to unit testing, what Force.com currently lacks, however,

    is a mocking framework to permit more focused and isolated testing of the layers

    mentioned in the previous sections without having to set up all the records needed
    to

    execute the code you want to test. This starts to make your Apex tests feel more
    like

    system-level tests having to execute the full functional stack each time.


    While conventions such as test-driven development (TDD) are possible, they

    certainly help you think about developing true unit tests on the platform. Doing
    so

    can also be quite time consuming to develop and then wait for these tests to run
    due

    to growing data setup complexity. Such tests end up feeling more like system-

    or integration-level tests because they end up testing the whole stack of code
    in your

    application.


    The good news is that the layering described in this book does give you

    opportunities to isolate smaller tests to specific aspects, such as validation
    or insert

    logic. As we progress through each layer in the upcoming chapters, we finish with

    an entire chapter focusing on implementing a true unit testing approach using
    an

    open source mocking framework known as Apex Mocks. It has been shared with

    the community by FinancialForce.com and is heavily based on the Java Mockito

    framework. https://github.com/financialforcedev/fflib-apex-mocks.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# # Packaging the code


    The source code provided with this chapter contains skeleton Apex classes shown
    in the UML diagrams used earlier in this chapter. In the upcoming chapters, we
    will flesh out the methods and logic within them. For now, deploy them into your
    packaging org and add them into your package. Note that once you add Apex classes,
    any Apex classes they subsequently go on to reference will be automatically pulled
    into the package. The following is a list of the Apex classes added in this chapter
    and the application architecture layer they apply to:


    | Apex class | Layer |

    | :--- | :--- |

    | SeasonController.cls | Visualforce Controller |

    | SeasonControllerTest.cls | Apex test |

    | ContestantController.cls | Visualforce Controller |

