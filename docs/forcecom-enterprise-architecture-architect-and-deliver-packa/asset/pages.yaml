    # With Unit Of Work


    Before we take a closer look at how the FinancialForce Apex Enterprise Pattern
    library has helped us implement this pattern, lets first take a look at the following
    revised example of the code shown earlier. This code utilizes a new Apex class
    called Application. This class exposes a static property and method to create
    an instance of a Unit Of Work.


    > The source code for this chapter includes the FinancialForce Apex Enterprise
    Pattern library, as well as the FinancialForce Apex Mocks library it depends on.
    The Apex Mocks library will become the focus in a later chapter where we will
    focus on writing unit tests for each of the patterns introduced in this book.


    The fflib_ISOObjectUnitOfWork Apex Interface is used to expose the features of
    the Unit Of Work pattern to capture the database work as records are created,
    thus the remaining logic is more focused and avoids Map and List and repeated
