    \ can only be added to scheduled races');\n    }\n}\n```\n\nBy overriding the\
    \ onValidate method, the logic always invokes the after phase of the Apex Trigger.\
    \ As no further edits can be made to the record fields, this is the safest place\
    \ to perform the logic. Always keep in mind that your Apex Trigger might not be\
    \ the only one assigned to the object. For example, once your package is installed\
    \ in a subscriber org, a subscriber-created custom trigger on your object might\
    \ fire before yours (the order of trigger invocation is non-deterministic) and\
    \ will attempt to modify fields. Thus, for managed package triggers, it is highly\
    \ recommended that validation be performed in the after phase to ensure complete\
    \ confidence and security, as the data will not be modified further after validation.\n\
