    public class Car {\n    private IEngine engine;\n    private IDashboard dashboard;\n\
    \    private Boolean isRunning;\n\n    public Car(IEngine engine, IDashboard dashboard)\
    \ {\n        this.dashboard = dashboard;\n        this.engine = engine;\n    }\n\
    }\n```\n\n> Notice that, the integration test shown earlier in this chapter for\
    \ the Car class still works without modification, since the real implementation\
