- pgno: 370
  md: 'Another way of versioning behavior is by considering whether changes in your
    application logic are something that Developer X would want to opt in to or be
    immediately available to their existing code once the package is upgraded. Changes
    to fix bugs or minor improvements in the way information is processed are likely
    things you wish to be available, regardless of the API version. However, other
    changes such as the way values are calculated or the addition of significantly
    new processing would be something that might justify a new API method or a parameter
    for Developer X to modify their code to use. Much like in the UI, you will choose
    to add a new tab, page, or button.


    By considering when to version the API behavior, you have put the choice as to
    when to accept new API behaviors in the hands of Developer X. Critically, by considering
    backwards compatibility you have not blocked upgrading to the latest version of
    your package due to integration failures. Spotting backwards compatibility regressions
    caused by behavior changes will get harder the more versions you release and the
    more supported versions you have in your customer base. Therefore making sure
    that you have a strong API-testing strategy becomes all the more critical.


    # Providing RESTful application APIs


    So far we have focused on Developer X being an on-platform Apex developer and
    the ways in which you can provide application APIs via Apex. However, it is also
    possible that Developer X could be coding off-platform, needing to call your application
    APIs from Java or Microsoft .NET, or a mobile application. Perhaps they want to
    write a small dedicated mobile application to check the compliance for teams,
    drivers, or cars.


    This part of the chapter will focus on exposing a REST API of the preceding compliance
    API for use by off-platform developers writing integrations with your application.
    Don''t forget, as with the on-platform scenario Salesforce provides a number of
    standard Salesforce APIs via SOAP and REST, which by coding off-platform Developer
    X can use to create, read, update, and delete records held in your application''s
    Custom Objects.'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'Apex provides support to expose the application logic via web services (SOAP),
    through the use of the `webservice` keyword placed in your Apex classes. If you
    want to expose a SOAP API, the platform can generate the appropriate WSDLs once
    you have applied this keyword to methods on your Service classes. The design of
    services designed in this book happens to align quite well with the general requirements
    of web services.


    Note that the afore mentioned `@Deprecated` attribute cannot be used on Apex code
    exposed in this way. One thing to consider though is that the WSDLs generated
    are not versioned; they are only generated based on the code for the installed
    version of your package. *Developer X* cannot generate historic versions of it
    from previous package versions. While Apex methods that use the `webservice` keyword
    fall under the same restrictions as `global`, you cannot exclude new methods or
    fields in your web services by version.


    Apex also provides support to create your own REST APIs, with some great reference
    documentation within the *Apex Developer''s Guide*. However, what it doesn''t
    cover are REST API design considerations, often referred to as RESTful.


    Many mistakes are made in exposing REST APIs without first understanding what
    it means to be RESTful. Before we get into using your Service layer to deliver
    a REST API, let''s learn more about being RESTful.


    # Key aspects of being RESTful


    A full discussion and overview of RESTful API design could easily take up a full
    chapter. The following is a summary of the key RESTful design goals and how these
    apply to REST APIs delivered via Apex (some guidelines are handled for you by
    the platform). As we discuss this topic further, the use of the term *operation*
    represents the methods in the application''s Service layer classes. This will
    be used to help expose the application''s REST API but should not steer its design.


    There is no one list of guidelines and some are open to interpretation. However,
    if you enter *Designing a RESTful API* in Google, you''re sure to come up with
    some useful reading. I recommend that you focus on those articles that give insight
    as to how some of the larger services such as Facebook, LinkedIn, and Salesforce
    themselves are interpreting RESTful, such as http://www.apigee.com/.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# What are your application resources?


    In the RESTful world, your operations are associated with a resource that is

    expressed via Uniform Resource Identifier (URI). A resource can be a physical
    thing

    in your application such as a Custom Object, or a conceptual thing. This is different

    from the Service layer design that drove the Apex API we have looked at earlier,

    where operations are expressed by grouping them under functional areas of the

    application, which are then expressed by Apex Service classes and methods for
    each

    operation.


    The Salesforce REST API uses Custom Objects to define physical resources the REST

    URI uses, allowing you to build a URI and use the various HTTP methods to perform

    the create, read, update, and delete operations. For example, to retrieve a record
    you

    can issue the following request via the Developer Workbench tool:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_372_0.png)


    In cases where you are exposing more business process or task-oriented operations

    that are not data-centric, it can be difficult to decide what the resource name
    should

    actually be? So it is worth taking the time to plan out and agree with the whole
    product

    team what the key REST resources are in the application and sticking to them.'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'One operation that falls into this category in our FormulaForce package is
    the compliance report. This operates on a number of different Custom Object records
    to report compliance, such as the driver, car, and team. Should we define a URI
    that applies it to each of these physical resources individually, or create a
    new logical compliance resource?


    I chose the latter in this chapter because it feels more extensible to do it this
    way, as it also leverages the compliance service in the application, which already
    supports adding new object types to the compliance checker. Thus, the REST API
    will support new object types without future changes to the API, as they are added
    to the compliance checker.


    Salesforce dictates the initial parts of the URI used to define the resource and
    the developer gets to define the rest. For the compliance REST API, we will use
    this URI:


    /services/apexrest/compliance


    Once you package your Apex code implementing this REST API, you will find that
    the preceding URI needs to be qualified by your package namespace, so it will
    take on the format, shown as follows, from the point of view of Developer X, where
    fforce is my namespace. We will use this format of URI when we test the compliance
    REST API later in this chapter:


    /services/apexrest/fforce/compliance


    # Mapping HTTP methods


    Your application operations for a given resource URI should be mapped to one of
    the standard HTTP methods on which REST is based: GET, POST, PUT, PATCH, and DELETE.
    Choosing which to use and being consistent about its use throughout your REST
    API is vital. Again, there are many resources on the Internet that discuss this
    topic in much more detail. Here is a brief summary of my interpretation of those
    readings:


    +   GET: This method is typically for operations that query the database and whose
    parameters are easily expressed in the URI structure and/or whose parameters fit
    well with this method.


    +   PUT versus POST: These methods are typically for operations that create, update,
    or query the database and where parameters are more complex, for example lists
    or structures of information that cannot be reflected in URI parameters. There
    is also a consideration around the term **Idempotent** (check out Wikipedia for
    a full definition of this), which relates to whether or not the request can be
    repeated over and over, resulting in the same state in the database. As you dig
    deeper into the RESTful design guidelines, this term typically drives the decision
    over using PUT versus POST.'
  merge: -1
  img_proc: true
- pgno: 374
  md: "+   • PATCH: This method is typically for operations that solely update existing\
    \ information, such as a record or some other complex dataset spanning multiple\
    \ records.\n+   • DELETE: This method is, of course, to delete existing information\
    \ expressed in the URI.\n\nWe will use the `POST` HTTP method with the `/services/apexrest/compliance`\
    \ resource URI to implement our REST API for the compliance verify operation,\
    \ passing the list of records to verify as a part of the HTTP request body using\
    \ the JSON data format.\n\n# # Providing Apex REST application APIs\n\nThe following\
    \ Apex class follows the naming convention `[ResourceName]Resource` as the class\
    \ name and then defines the appropriate methods (whose names are not as important\
    \ in this case), mapping them accordingly to the HTTP method for the URL mapping.\
    \ This is included in the sample code of this chapter:\n\n```\n@RestResource(urlMapping='/compliance')\n\
    global with sharing class ComplianceResource {\n  @HttpPost\n  global static List<ComplianceService.VerifyResult>\n\
    \  report(List<Id> Ids) {\n    return ComplianceService.report(new Set<Id>(Ids));\n\
    \  }\n}\n```\n\nThe following are some things to note about the preceding example,\
    \ and in general about wrapping Service layer methods in Apex REST methods to\
    \ create REST APIs:\n\n+   • The preceding example uses the VerifyResult class\
    \ from ComplianceService. You may wish to create your own class scoped within\
    \ the ComplianceResource class for further isolation.\n+   • The methods in this\
    \ class should delegate to one and only one, applicable method in a Service class\
    \ as per the general Service layer calling guidelines, to maintain a transaction\
    \ scope and also Separation of Concerns.\n+   • It is not recommended that you\
    \ map your Apex resource classes only to a specific Service class as your earlier\
    \ RESTful API design might not match your Service class design, though it should\
    \ still delegate to it.\n+   • Treat these classes like you would treat a UI controller,\
    \ including only marshaling and error-handling logic as required."
  merge: -1
  img_proc: true
- pgno: 375
  md: '+   - Typically you don''t need to catch exceptions from the Service layer
    (unlike Visualforce controller action method callers), as the Apex REST runtime
    catches the exception and the returns appropriate REST API error code and message.
    Avoid implementing your own REST API error handling.

    +   - The `global` modifier is still required. Keep in mind that the same packaging
    restrictions regarding changes to these methods apply.

    +   - It is possible for the Developer X Apex developer to call these methods
    from Apex, as they are `global`. However, this should be discouraged because these
    methods might reference the REST API context variables, which will not be initialized
    in a standard Apex context.

    +   - The `Set` Apex data type is not supported by the Apex REST methods. Unlike
    the standard, which has been established with the Service class methods, the Set
    Apex data type is not supported by the Apex REST methods. Therefore, you will
    need to convert the `List<Id>` REST method parameters to the `Set<Id>` collections
    for your Service method calls.

    +   - The `ComplianceService.verify` method throws an exception with additional
    information about the specific compliance failures. However, information in a
    custom Apex exception is not automatically serialized by the platform — only the
    error message is included. In this case, a custom response would be required to
    catch the exception and return the information.


    # # Calling your Apex REST application APIs


    The Salesforce Developer Workbench can be used to call the preceding REST API.
    Locate a Driver record without the FIA Super License field selected and use the
    following ID. Note that the URI shown in the following screenshot contains the
    package namespace, fforce. To try this out you need to replace this with your
    chosen package namespace:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_375_0.png)'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# Versioning Apex REST application APIs


    The generally recognized way in which REST APIs are versioned is to include the
    version in the URI. Notice that v30.0 (the Salesforce platform version) was included
    in the standard Salesforce REST API example shown earlier, but no version was
    included in the URI for the REST API exposing the compliance report operation.
    The platform does not provide a facility for versioning Apex REST APIs in the
    same way as its own APIs.


    # Behavior versioning


    The Salesforce REST API, and any Apex REST APIs exposed, can receive from a new
    HTTP header, such as x-sfdc-packageVersion-fforce: 1.10. In the case of Apex REST
    APIs, this can be used to allow the packaged API code to implement behavior versioning.
    This can be used to set the version returned by System.requestVersion as described
    earlier in this chapter.


    This header is optional; without it, the current package version installed is
    assumed. My preceding recommendations around the utilization of behavior versioning
    also apply here. Because the header is optional, its usefulness is diluted.


    # Definition versioning


    The preceding HTTP header does not affect the visibility of the API''s definition
    in the same way that the platform does for Apex API''s as illustrated earlier
    in the chapter. One option to address this is to map a versioned URI to a specific
    Apex resource class per version, for example, to support version v1.0 and v2.0
    of the compliance REST API. This approach allows you to expose URI''s with your
    version included:


    ```

    /service/apexrest/fforce/v1.0/compliance

    /service/apexrest/fforce/v2.0/compliance

    ```


    When versioning the API definition, you would need to also capture copies of the
    Apex data types used in the Service layer. This would isolate each REST API version
    from underlying changes of the Service layer as it evolves. The main coding overhead
    here is going to be marshaling between the Apex types defined in the Service layer
    (which are always the latest version) and those in the class implementing the
    REST API.'
  merge: -1
  img_proc: true
- pgno: 377
  md: "For example, to version the report API, we have to capture its types as inner\
    \ Apex classes at the time the API class is created. The following example illustrates\
    \ this for v1.0. You can see how the definition of the API can be encapsulated\
    \ within the specific version of the Apex class denoted by the v1_0 suffix:\n\n\
    ```\n@RestResource(urlMapping='/v1.0/compliance')\nglobal with sharing class ComplianceResource_v1_0\
    \ {\n\nglobal class VerifyResult {\n    global Id recordId;\n    global String\
    \ complianceCode;\n    global Boolean passed;\n    global String failureReason;\n\
    }\n\n@HttpPost\nglobal static List<VerifyResult> report(List<Id> Ids) {\n\n  \
    \  List<VerifyResult> results = new List<VerifyResult>();\n    for(ComplianceService.VerifyResult\
    \ result :\n        ComplianceService.report(new Set<Id>(Ids)))\n        results.add(makeVerifyResult(result));\n\
    \    return results;\n}\n\nprivate static VerifyResult\nmakeVerifyResult(ComplianceService.VerifyResult\
    \ verifyResult) {\n    VerifyResult restVerifyResult = new VerifyResult();\n \
    \   restVerifyResult.recordId = verifyResult.recordId;\n    restVerifyResult.complianceCode\
    \ = verifyResult.complianceCode;\n    restVerifyResult.passed = verifyResult.passed;\n\
    \    restVerifyResult.failureReason = verifyResult.failureReason;\n    return\
    \ restVerifyResult;\n}\n}\n```\n\nWhile the version number you use can be anything\
    \ you like, you may want to consider following your package version numbering\
    \ sequence.\n\nVersioning Apex REST APIs this way is not ideal due to the manual\
    \ way in which the definition has to be versioned by code and the overhead in\
    \ managing that code for each release of your package. However, without this approach,\
    \ it is always the latest definition of the Apex REST API in your package that\
    \ is exposed."
  merge: -1
  img_proc: true
- pgno: 378
  md: "This means that after upgrades of your package callers receive new fields in\
    \ responses they do not expect. There is also no way to deprecate Apex REST APIs.\
    \ However due to deletion restrictions over the `global` class members, there\
    \ is some protection over developers in accidentally removing fields that would\
    \ break existing requests.\n\n# Exposing Lightning Components\n\nIn the previous\
    \ chapter, we looked at several components that are included in the FormulaForce\
    \ package. These have all been exposed for use by tools and developers code in\
    \ the subscriber org, through `global` access level.\n\nWhen developers consume\
    \ these components inside their own component, there is a facility through the\
    \ bundle metadata for them to express what package version they want the platform\
    \ to assume when their code interacts with the packaged component. This allows\
    \ for definition and behavior versioning of your components. If this information\
    \ is not present, the currently installed package version is assumed.\n\nThe `System.requestVersion`,\
    \ `{!Version}` and `cmp.getVersion()` are available to determine the version your\
    \ component needs to honor in an Apex or JavaScript.\n\n# Extending Process Builder\
    \ and Visualflow\n\nThe **Process Builder** or **Visualflow** tools allow users\
    \ to create customized processes and wizard-like user experiences. Both tools\
    \ offer a large selection of actions they can perform based on criteria defined\
    \ by the user.\n\nAvailable actions can be extended by packages installed in the\
    \ org. This provides another way in which you can expose your functionality for\
    \ building customized scenarios. This approach does not require the user to write\
    \ any code.\n\nThe following code creates an **Invocable Method**, which is a\
    \ `global` class and a single method with some specific annotations. These annotations\
    \ are recognized by the tools to present a dynamic configuration UI to allow the\
    \ user to pass information to and from the method you annotate:\n\n```\nglobal\
    \ with sharing class UpdateStandingsAction {\n\n    global class UpdateStandingsParameters\
    \ {\n\n        @InvocableVariable(\n        Label='Season Id'\n```"
  merge: -1
  img_proc: true
- pgno: 379
  md: "```\nDescription='Season to update the standings for',\nRequired=True)\nglobal\
    \ Id seasonId,\n@InvocableVariable(\nLabel='Issue News Letter'\nDescription='Send\
    \ the newsletter out\nto the teams and drivers'\nRequired=False)\nglobal Boolean\
    \ issueNewsLetter;\n```\n\n```\nprivate SeasonService.UpdateStandings makeUpdateStandings()\
    \ {\n    SeasonService.UpdateStandings updateStandings =\n    new SeasonService.UpdateStandings();\n\
    \    updateStandings.seasonId = this.seasonId;\n    updateStandings.issueNewsLetter\
    \ = this.issueNewsLetter;\n    return updateStandings;\n}\n}\n```\n\n```\n@InvocableMethod(\n\
    Label='Update the leaderboard of the season'\nDescription='Updates the standings\
    \ and optionally\nsends the newsletter.')\nglobal static void\nupdateStandings(\n\
    List<UpdateStandingsParameters> parameters) {\n    // Marshall parameters into\
    \ service parameters\n    List<SeasonService.UpdateStandings> updateStandings\
    \ =\n    new List<SeasonService.UpdateStandings>();\n    for (UpdateStandingsParameters\
    \ parameter : parameters) {\n    updateStandings.add(parameter.makeUpdateStandings());\n\
    \    }\n    // Call the service\n    SeasonService.updateStandings(updateStandings);\n\
    }\n}\n```\n\n> In order to isolate the parameters of this method from changes\
    \ to the Service class methods, the UpdateStandings Apex class is used. This also\
    \ allows the method to evolve in a different direction if needed."
