- pgno: 213
  md: 'Note: Handle methods can also be overridden if you wish to implement your own
    handling. The existingRecords parameter represents the value of Trigger.oldMap.


    The base class uses the template method pattern (http://en.wikipedia.org/wiki/Template_method_pattern).
    This ensures that when overriding the onXXX methods from the base class, you do
    not need to worry about calling the base class version of the method, as is the
    typical developer requirement when overriding methods in OOP.


    # Enforcing object security


    Salesforce requires developers to implement the Object CRUD (Create, Read, Update,
    and Delete) security and Field Level security checks using the methods on the
    SObjectDescribe and SObjectFieldDescribe Apex runtime types.


    By default, the preceding handle methods in the fflib_SObjectDomain base class
    used in this chapter automatically perform the Object CRUD security on behalf
    of the developers Domain class logic.


    Note that currently the base class still leaves implementing Field Level security
    to the developer to implement.


    A developer controlled configuration option provided by the base class allows
    each Domain class to control whether this default behavior is enabled or not.
    For example, objects that are typically maintained by the application code on
    behalf of the user may not wish to have this check enforced, such as the awarding
    of championship points. This type of access is sometimes referred as system level
    access, as the system performs an operation on behalf of the user. Thus by accepting
    the default to enforce this check, it would require users to be granted access
    which would not be appropriate elsewhere in the application. Another motivation
    for not leveraging the default enforcement would be a preference to code these
    checks in your controller logic more explicitly. Consider carefully the default
    enforcement is what you need in each case.


    # Default behavior


    The handler method checks the required security before calling the preceding event
    methods and throws a DomainException exception if the user does not have the required
    access (forcing the entire trigger context to stop). For example, when the handleAfterInsert
    method is invoked, the SObjectDescribe.isCreatable method is used.'
  merge: -1
  img_proc: true
- pgno: 214
  md: "# Overriding the default behavior\n\nTo make it easier to configure the fflib_SObjectDomain\
    \ class throughout the application, as well as to provide a means to establish\
    \ shared or common Domain logic code, a new base class is created as follows.\n\
    \n```\n/**\n * Application specific Domain base class,\n * customisefflib_SObjectDomain\
    \ and add common behavior\n **/\npublic abstract class ApplicationDomain extends\n\
    \tfflib_SObjectDomain {\n\tpublic ApplicationDomain(List<SObject> records) {\n\
    \t\tsuper(records);\n\t\t// Disable CRUD security enforcement at the Domain class\
    \ level\n\t\tConfiguration.disableTriggerCRUDSecurity();\n\t}\n}\n```\n\nThus\
    \ Domain classes in this application extended this class instead.\n\n```\npublic\
    \ class Contestants extends ApplicationDomain {\n\tpublic Contestants(List<Contestant__c>\
    \ contestants) {\n\t\tsuper(contestants);\n\t}\n}\n```\n\nNote that this approach\
    \ requires that the developer takes over exclusive responsibility for implementing\
    \ Object CRUD security checking them.\n\n# Apex Trigger event handling\n\nThe\
    \ upcoming sections illustrate some Apex Trigger examples with respect to the\
    \ FormulaForce application. They utilize the Drivers and Contestants Domain classes\
    \ included in the sample code for this chapter along with the following new fields:\n\
    \n+   - In the Driver__c object, a new field called ShortName__c as a Text type,\
    \ with a maximum size of 3 characters, has been created.\n+   - In the Race__c\
    \ object, there is a new field called Status__c as a Picklist type, with the Scheduled,\
    \ In Progress, Red Flagged, and Finished values. The default value is scheduled\
    \ by ticking the Use first value as default value checkbox."
