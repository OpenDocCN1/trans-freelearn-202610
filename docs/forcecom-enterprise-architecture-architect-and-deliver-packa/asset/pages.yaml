- pgno: 82
  md: '> You can combine the use of Rollup summary fields in your Apex Trigger logic,
    for example, you can add the Apex logic to check the number of DNFs in the `after`
    phase of the trigger on the `Race` object. Your users can also apply Validation
    Rules on the `Race` object that references its Rollup summary fields. Any changes
    to `Contestant` detail records that cause this Validation Rule to be invalid will
    prevent updates to the related `Contestant` record.


    As you can imagine, calculating Rollup summaries can be quite an intensive job
    for the Salesforce servers. As such, Salesforce limits the total number of Rollup
    summaries to 10 per object, though this can be increased to 25 by contacting Salesforce
    Support with a valid business case. Keep in mind that as a packaged application
    provider, this limit is not scoped by your namespace, unlike other limits. This
    means that if you use all 10, your end users will not be able to add their own
    post-installation. Similarly, if they have created their own post-installation
    and an upgrade causes the limit to be breached, the install will fail.


    > While this can be a powerful feature, carefully consider the other summarization
    options listed in the previous paragraph and if your users really need this information
    to be real-time or accessible from formulas and Validation Rules. If not, a good
    compromise is a Visualforce page that can be added inline into the `Page Layout`
    objects. The Visualforce page can utilize the `readonly=true` attribute in which
    the Apex Controller logic can utilize aggregate SOQL queries to aggregate up to
    5 million records (subject to appropriate indexes and within standard timeout
    tolerance). This page can then display when the user reviews the record in the
    UI and is thus calculated on demand. Enhancing the Salesforce standard pages with
    Visualforce is discussed in more detail later in this chapter


    # # Understanding the available security features


    The platform provides security controls to manage the accessibility of functionalities
    in your application and also the visibility of the individual records it creates.
    As an application provider, your code has a responsibility to enforce security
    rules as well as to provide integrations that help administrators configure security
    easily. This section is not aimed at taking a deep dive into the security features
    of the platform, but is more an aid in understanding the options, best practices,
    and packaging implications.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'One of the key checks the security review process described in the previous
    chapter makes is to scan the code to ensure that it is using the appropriate Apex
    conventions to enforce the security rules administrators of your application configure,
    as not all security checks are enforced automatically for you.


    This chapter discusses the following two categories of security as provided by
    the platform:


    +   - Functional security: Security that applies to application objects and some
    code entry points (providing APIs) and also Visualforce pages that deliver the
    features of the application is referred to here as functional security

    +   - Data security: In contrast to security applied to individual record data
    created and maintained by the application, this type of security is referred to
    as data security


    # Functional security


    Both profiles and Permission Sets can be created and packaged in your application
    to help administrators of your application control access to your objects, fields,
    tabs, and pages. Fundamentally, profiles have been historically used to prepackage
    the roles, such as team principle, you envisage users using in your application.
    In contrast, Permission Sets can be used to express the functionality in your
    application such as the ability to assign a driver to a race.


    By now, most people are familiar with configuring profiles to control security.
    The issue is that they can eventually lead to a proliferation of profiles; as
    small differences in needs between users arise, profiles are then cloned and thus
    increases the administration overhead when performing common changes. To manage
    this, Salesforce created Permission Sets, which is a much more granular way of
    expressing security controls.


    From an application perspective, you can package Permission Sets and even have
    them upgraded automatically as they change in accordance with the new or updated
    functionality in your application. You can also assign them after installation,
    in contrast to profiles, which can only be done during the installation. Also
    unlike profiles, administrators cannot edit them though they can clone them if
    there is a need (this is not possible in Professional and Group Editions of Salesforce).
    Because of these benefits, it is recommended that Permission Sets be used over
    profiles when packaging security information about your application.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'It is important to plan your use of Permission Sets from the start so that
    your development team keeps them updated and their usage remains consistent throughout.
    Consider the following when designing your Permission Set strategy:


    +   - **Think features not roles**: Do not be tempted to fall back to expressing
    the roles you envisage your application users being assigned. Enterprise organizations
    are large and complex; rarely does one size fit all. For example, a **team principle**
    can have many different responsibilities across your application from one installation
    to another. If you get this wrong, the administrator will be forced to clone the
    Permission Set, resulting in the start of the proliferation of unmanaged Permission
    Sets that do not track with the new or changed functionality as your package is
    upgraded.

    +   - **Granularity**: As you design the functionality of your application, modules
    are defined (you can use **Application** under **Setup** to indicate these), and
    within these objects, tabs, or pages, each has distinct operations. For example,
    the Contestant object might describe the ability to indicate that a driver has
    crashed out of the race and update the appropriate DNF field, which is **Update
    DNF Status**. For example, this permission might be assigned to the race controller
    user. In contrast, you might have a less granular Permission Set called **Race
    Management**, which encompasses the **Update DNF Status** permission plus others.
    Considering this approach to design your Permission Sets means that administrators
    have less work to assign to users, while at the same time, they have the power
    to be more selective should they wish to.

    +   - **Naming convention**: When the administrator is viewing your Permission
    Sets in the Salesforce UI ensure they are grouped according to the functional
    aspects of your application by considering a naming convention, for example, `FormulaForce
    - Race Management` and `FormulaForce - Race Management - Update DNF Status`.


    One of the limitations of the **License Management Application (LMA)** described
    in the previous chapter is that it is not very granular; you can only effectively
    grant user licenses to the whole package and not modules or key features within
    it. With the introduction of Permission Set licenses, Salesforce looks to be heading
    down the path of providing a means to define your licensing requirements with
    respect to Permission Sets. At the time of writing this, there was no support
    for developers to create their own; this looks like the next obvious step. This
    is something to consider when designing your Permission Sets for use as license
    control, for example, one day you may be able to use this to enforce a pricing
    model for high-priced licenses associated with the **Race Management** permission.'
  merge: -1
  img_proc: true
