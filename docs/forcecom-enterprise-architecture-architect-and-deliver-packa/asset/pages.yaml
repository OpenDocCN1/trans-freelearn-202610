- pgno: 310
  md: '# Lightning


    Lightning is a rich client side framework for developing device agnostic and responsive
    user experiences as well as supporting mobile, tablet and desktop. Unlike Visualforce
    it was built from the ground up with today''s multi-device rich client demands
    in mind. It is used by Salesforce themselves and is also available to developers
    to build their own standalone or platform integrated UIs. Using Lightning Out
    developers can also integrate UIs built with Lightning into external sites and
    applications. An emphasis on componentization is at the heart of its architecture,
    and plays a key part in providing a means to implement reuse, separation of concerns
    and extensibility.


    This chapter provides an architectural overview of the Lightning component architecture,
    while contrasting it with its predecessor Visualforce. New Lightning Components
    called Race Calendar, Race Results, Race Standings and Race Setup will allow us
    to explore and development process and styling using Lightning Design System.


    Using the new components, we will explore the options and benefits of integrating
    components into Lightning Experience, Salesforce1 Mobile, Lightning Communities,
    as well as an existing Visualforce pages. Lightning Out for Visualforce allows
    existing solutions to continue to support Salesforce Classic while moving towards
    Lightning.


    We will cover the following topics in this chapter:


    +   - Overview of the Lightning component framework

    +   - Understanding of the various component containers

    +   - Building components your end users can customize

    +   - Using components to extend Lightning Experience and Salesforce1 Mobile

    +   - Understanding how to write secure JavaScript code

    +   - Styling your Lightning UIs'
  merge: -1
  img_proc: true
- pgno: 311
  md: "# # Building a basic Lightning user interface\n\nBefore we dive into the more\
    \ complex components included in the sample code for the FormulaForce application,\
    \ let's first create a simple **Lightning Application** to better understand the\
    \ architecture of Lightning. Think of a Lightning Application as a **container**\
    \ for your UI, essentially your HTML markup. Containers are effectively things\
    \ you can navigate to in the browser, they get their own URL based on the name\
    \ you give them.\n\nAs we will explore later in the chapter, **Lightning Experience**\
    \ and **Salesforce1 Mobile** are also containers built by Salesforce in the same\
    \ way as the example that follows.\n\nIf you want to follow along with the next\
    \ few steps, ensure you have installed the Force.com IDE with support for Lightning\
    \ Components. We will be taking a closer look at the Force.com IDE features around\
    \ Lightning later in this chapter.\n\nFollow these steps to create your first\
    \ Lightning Application:\n\n+   1. Ensure that you are using a **Developer Edition**\
    \ org with **My Domain** enabled. This can be enabled under the **Setup** menu\
    \ by searching for **My Domain**. Ensure that you have completed all the My Domain\
    \ steps.\n+   \n+   2. Create Force.com IDE project for your org from the **New**\
    \ menu by selecting **Force.com Project**.\n+   \n+   3. Once the project is created,\
    \ right click on the project in the **Package Explorer** and select the **Force.com**\
    \ sub-menu then **Work Online**. This ensures when saving a file it gets automatically\
    \ uploaded to Salesforce.\n+   \n+   4. From the **File** menu, select **Lightning\
    \ Bundle** from the **New** sub-menu.\n+   \n+   5. In the **Create new Lightning\
    \ Component** dialog, select **Lightning Application** from the **Type** field.\n\
    +   \n+   6. Give your application the name `myapp` and click **Finish**.\n+ \
    \  \n+   7. A Lightning Bundle in source form is a folder that contains one or\
    \ more files depending on the type. In this case you will have a `.app` file,\
    \ `.css` file and three `.js` files. Open the `myapp.app` file and enter the markup\
    \ below, then save the file.\n\n```\n<aura:application>\n<h2>Success your first\
    \ Lightning App</h2>\n</aura:application>\n```"
  merge: -1
  img_proc: true
- pgno: 312
  md: '+   8. As described in the preceding code, containers are essentially pages
    you can navigate to with your browser. These work outside of the standard UIs
    from Salesforce but still require you to login. Login to your Developer Edition
    org and enable Lightning Experience from under the Setup menu (if it is not already
    enabled).


    +   9. Switch to Lightning Experience and take note of the URL in the browser.
    This might be something like the following for the Lightning Experience container
    (https://yourdomain.lightning.force.com/one/one.app).


    +   10. To launch your first Lightning Application, modify the URL as follows,
    substituting yourdomain for your orgs domain (https://yourdomain.lightning.force.com/c/myapp.app).


    > The c in the preceding URL represents the default namespace of your org. If
    your org has a namespace or you''re attempting to launch a Lightning Application
    from an installed package with a namespace of coolapps, for example, exchange
    it with the namespace /coolapps/myapp.app.


    You should see in your browser the following message:


