    # # Object-oriented programming


    One of the big advantages of using Apex classes is the ability to leverage the
    power of OOP. OOP allows you to observe commonalities in data or behavior across
    your objects to share code or apply common processing across different objects.


    An example of such a commonality in the Formula1 world are rules; every aspect
    of the sport has a set of rules and regulations to comply with, such as **drivers**
    owning a FIA **Super License**, the weight of the car they drive should be at
    least above a defined minimum, and ensuring that a **team** has not exceeded the
    maximum distance in testing their cars. Such compliances are checked regularly,
    both before and after a race.


    # # Creating a compliance application framework


    In our FormulaForce application, we want to create a compliance framework that
    will check these regulations across the different objects while also providing
    a consistent user interface experience for the end user to verify compliance.
    The initial requirement is to place a **Verify Compliance** button on the **Detail
    Pages** on all applicable objects.


    The **Visualforce Controller** and **Service code** that perform the verification
    process should be generic and reusable across these objects, while the actual
    compliance-checking logic associated with each object will be specific. By using
    an **Apex Interface**, we can define this common requirement for the applicable
    Domain classes to implement.


    In this section, we will implement this requirement using an Apex interface and
    a generic service that can be passed record IDs for different Domain objects across
    the application. Creating such a service avoids code duplication by having to
    repeat the logic of handling the results within the code of each Domain class
    and provides a centralized service for the controller to consume regardless of
    the object type in scope.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'By using an Apex interface and a generic service, we separate the functional
    concerns of implementing compliance functionality as follows:


    +   • The Service layer code is concerned solely with executing the compliance-checking
    process through the interface

    +   • The Controller code is concerned with calling the service class method to
    execute the compliance check and then presenting the results to the user consistently

    +   • The Domain layer classes that implement the interface focus solely on validating
    the record data against the applicable rules according to the type of the object


    Having this Separation of Concerns makes it easy to significantly modify or extend
    the ways in which the checking is invoked and presented to the user without having
    to revisit each of the Domain layer classes or conversely, modify the compliance
    logic of one object without impacting the overall implementation across the application.


    # An Apex interface example


    Interfaces help express common attributes or behaviors across different domain
    classes. In this section, we will use an Apex interface to help expose the compliance-checking
    logic encapsulated in each of the applicable Domain classes.


    In order to exercise and implement the compliance framework, the FormulaForce
    application has gained a few extra fields and objects. These objects, additional
    classes, and Visualforce pages are all included in the code samples of this chapter.


    To summarize, the following steps have been taken to implement the compliance
    framework requirement. You can follow along with these or simply refer to the
    sample code of this chapter:


    +   1. Create a new Car object and tab.

    +   2. Create a new Weight field of type Number and length 6 on the Car object.

    +   3. Create a new FIA Super License field to the Driver object.

    +   4. Create a new Cars Domain class and CarsSelector Selector class.

    +   5. Create a new ComplianceService class and ICompliant interface.

    +   6. Create new Cars and Drivers Domain classes and implement the ICompliant
    interface.

    +   7. Update the Application class to implement a Domain class factory'
  merge: -1
  img_proc: true
- pgno: 220
