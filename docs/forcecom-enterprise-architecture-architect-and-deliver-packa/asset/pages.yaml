    \ must not be less than 691kg.';\n        compliances.add(license);\n    }\n \
    \   return compliances;\n}\n}\n```\n\n# Step 7 – the domain class factory pattern\n\
    \nThe next step is to dynamically construct the associated Domain class based\
    \ on the record IDs passed into the `ComplianceService.verify` method. This part\
    \ of the implementation makes use of a Factory pattern implementation for Domain\
    \ classes.\n\n> A Wikipedia reference to the Factory pattern can be found at http://en.wikipedia.org/wiki/Factory_method_pattern.\n\
    \nThe implementation uses the Apex runtime `Id.getSObjectType` method to establish\
    \ `SObjectType`, and then via the `Maps` (shown in the following code), it determines\
    \ the applicable Domain and Selector classes to use (to query the records)."
