- pgno: 334
  md: "# Other notable aspects of the RaceStandings component are:\n\n• It implements\
    \ the flexipage:availableForAllPageTypes interface that permits the component\
    \ to be dropped on to the Lightning Experience Home page or any other page edited\
    \ by the Lightning App Builder.\n\n• The aura:iteration is similar to the Visualforce\
    \ apex:repeat component, in that it will iterate over a bound list and repeat\
    \ the markup defined within.\n\n• It uses two Base Lightning Components, lightning:card\
    \ and lightning:icon, SLDS styling is implemented by these components.\n\n• The\
    \ client controller function onInit calls a helper function that makes a call\
    \ to the Apex Controller to load the information from the server. The response\
    \ updates the standings attribute which in turn causes the framework to refresh\
    \ the HTML table with the records:\n\n```\ngetStandings : function(component,\
    \ event ) {\n var action = component.get(\"c.getStandings\");\n action.setCallback(this,\
    \ function(response) {\n if(response.getState() == 'SUCCESS') {\n component.set(\"\
    v.standings\",\n response.getReturnValue());\n }\n });\n $A.enqueueAction(action);\n\
    }\n```\n\n• The Apex Controller method uses the ContestantsSelector class. In\
    \ the following example the members of the Selector class ContestantsSelector.\
    \ Standing do not support the @AuraEnabled attribute, so this class was not used\
    \ directly in the response. The alternative RaceStanding class, allows the response\
    \ to the client to be more focused on the needs of the client code:\n\n```\npublic\
    \ with sharing class RaceStandingsComponentController {\n @AuraEnabled\n public\
    \ static List<RaceStanding> getStandings() {\n List<RaceStanding>raceStandings\
    \ =\n new List<RaceStanding>();\n for(ContestsSelector.Standing standing :\n newContestsSelector().\n\
    \ selectStandingsForCurrentSeason()) {\n RaceStanding raceStanding = newRaceStanding();\n\
    \ raceStanding.Position = standing.Position;\n raceStanding.Driver = standing.Driver;\n\
    \ raceStanding.Team = standing.Team;\n raceStanding.Wins = standing.Wins;\n raceStanding.Points\
    \ = standing.Points;\n}\n```"
