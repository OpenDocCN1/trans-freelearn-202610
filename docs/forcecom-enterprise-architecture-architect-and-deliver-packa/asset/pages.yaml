    | Kimi Räikkönen | 2004 |

    | Edit | Nürburgring | Nurburgring | ff2 | | 84.468 | Michael Schumacher | 2004
    |

    | Edit | Silverstone Circuit | Silverstone_Circuit | ff2 | | 90.874 | Fernando
    Alonso | 2010 |


    You can also define a **List View** to make it easier for you to manage Custom
    Metadata Type records in the packaging org. You cannot initially edit the default
    **All** view, though you can create one with the same name; click on **Create
    New View**. This List View is not packaged.


    Storage used by Custom Metadata Type records is not shown on the **Storage Usage**
    page. The calculation used is based on the maximum record size based on the field
    size and not the standard 2 KB used on Custom Objects. Records created by users
    can total up to 10 MB. Your packaged records also get their own 10 MB limit. You
    can calculate the storage used by reviewing the record size shown on the **Custom
    Metadata Types** page.


    # ## All Custom Metadata Types


    Custom metadata types enable you to create your own setup objects whose records
    are metadata rather than data. These are typically used to define application
    configurations that need to be migrated from one environment to another, or packaged
    and installed. Rather than building apps from data records in custom objects or
    custom settings, you can create custom metadata types and add metadata records,
    with all the manageability that comes with metadata: package, deploy, and upgrade.
    Querying custom metadata records doesn''t count against SOQL limits.


    ### New Custom Metadata Type


    | Action | Label | Namespace Prefix | Visibility | Api Name | Record Size | Description
    |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | Del | Manage Records | Track Lap Record | | Public | TrackLapRecord__mdt | 213
    |


    To add the records to the package, follow these steps:


    +   1. From the **Package Detail** page click **Add Components**.

    +   2. Select **Track Lap Record** from the dropdown and select all records.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'When completing Step 2, the Add to Package page will look like the following:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_118_0.png)


    > Trivia: In its pilot phase the Custom Metadata Type feature was known as Platform
    on Platform. The branding later changed, but at the time Salesforce felt that
    this described one of the potentials of this technology to start to build your
    own platform packages that added to new metadata types to the platform. As stated
    in the considerations table earlier, the ability for others to package your custom
    metadata type records is a realization of this vision.


    # Custom Settings storage


    Custom settings are slightly different from Custom Objects with respect to data
    storage limits, in that they do not exist in the same storage area. Custom settings
    are ideal for data that is read often but written to infrequently. Salesforce
    caches data in these objects in something it calls the Application Cache and provides
    a means to query it quickly without query governor limits being applied. However,
    unlike Custom Objects, they do not support Apex Triggers or Validation Rules.


    There are limits on the storage they can consume, per organization, per namespace.
    This means that if you create a custom setting and add it to your managed package,
    it gets its own storage limit. The storage limit for custom settings starts with
    1 MB for a full licensed user and can go up to a maximum of 10 MB. You can see
    the current storage utilization from the Custom Settings page under Setup.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# File storage


    Salesforce has a growing number of ways to store file-based data, ranging from
    the historic Document tab, to the more sophisticated Content tab, to using the
    Files tab, not to mention Attachments, which can be applied to your Custom Object
    records if enabled. Each has its own pros and cons for end users and file size
    limits that are well defined in the Salesforce documentation. Going forward only
    Files will be supported by Salesforce and so use of this is recommended over other
    file storage options. For example, only the Files tab is supported in Lightning
    Experience.


    From the perspective of application development, as with data storage, be aware
    of how much your application is generating on behalf of the user and give them
    a means of controlling and deleting that information. In some cases, consider
    whether the end user would be happy to have the option of recreating the file
    on demand (perhaps as a PDF) rather than always having the application to store
    it.


    # Record identification, uniqueness, and auto numbering


    Every record in Salesforce has an Id field, and with a few exceptions, also a
    Name field or DeveloperName for Custom Metadata Type objects. The Id field is
    unique, but is not human readable, meaning it cannot be entered or, for most of
    us on this planet, easily remembered!


    The Standard and Custom Objects default value for the Name field is to provide
    a means for the user to enter their own textual description for the record, such
    as the race name or the driver name. The Name field is not enforced as being unique.
    Being the primary means by which the user identifies records, this can be a problem
    and is something that the end user needs to avoid. This aspect of the platform
    can be particularly problematic with accounts and contacts hence AppExchange has
    a number of so-called "Deduplication" applications you can try.


    > The Database.merge and merge DML statements support the merging of accounts,
    leads, and contact records.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# # Unique and external ID fields


    When adding fields, you can indicate that the values stored within them are **unique**
    and/or **external identifiers**. For unique fields, the platform will automatically
    enforce this rule regardless of how records are created or updated, rejecting
    records with no unique values. By utilizing fields designated as external ID fields,
    you can simplify the data-loading process for users; this will be discussed later
    in this chapter in more detail. Both of these field modifiers result in a custom
    index being created, which can help optimize query performance.


    > You can help users avoid creating duplicate records with the same name by ensuring
    that other identifying fields such as these are also added to the **lookup layout**
    as described in the previous chapter.


    Let''s add a **Unique** and **External Id** field to record the driver''s Twitter
    handle. Perform the following steps in the packaging org to try this out:


    +   1. Create a new **Text** field, **Twitter Handle** (`TwitterHandle__c`), with
    a length of **15** on the **Driver** object, and check the **Unique** and **External
    Id** checkboxes.

    +   2. Utilize the **Driver** records entered in the previous chapters to update
    the fields and confirm that the system prevents duplicate Twitter handles. Lewis
    Hamilton''s Twitter handle is LewisHamilton and Ruben''s is rubarrrichello.

    +   1. Update the permission sets that have read and write permissions for the
    new field to **Race Management**, and the read-only permission to **Race Analytics**.


    # # Auto Number fields


    The platform supports an auto sequence field type, which can be applied to the
    **Name** field during and after object creation (as long as the object has not
    been previously included as part of a prior package release upload). It can also
    be applied to a brand new field. The platform handles incrementing the sequence
    and ensures that there are no duplicates.


    Apply **Auto Number** within the FormulaForce application to give a unique auto
    incrementing identifier to the **Race Data** records as they are inserted. Perform
    the following steps in the packaging org to try this out:


    +   1. Create a new **Race Data** (`RaceData__c`) object; for **Record Name**,
    enter `Race Data Id`, and select **Auto Number** from the **Data Type** field.

    +   2. In the **Display Format** field, enter `RDID-{00000000}` and `1` in the
    **Starting Number**. Finally, check the **Allow Reports** field.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '+   3. Add a **Lookup** field called `Race` (`Race__c`) to relate records in
    this object to the existing `Race` object. Select the **Don''t allow deletion
    of the lookup record that''s part of a lookup relationship** option to prevent
    the deletion of race records if race data exists. We will add further fields to
    this object in a later chapter.


    +   4. Create a tab for the **Race Data** object that we just created and add
    the tab to the **Race Management** and **Race Analytics** applications. By doing
    this, the tab and object will automatically be added to the package ready for
    the next upload.


    +   5. Create a test record to observe the **Race Data Name** field value.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_121_0.png)


    +   6. Update the permission sets with the new object and fields, giving a read
    and write permission to **Race Management** and a read-only permission to **Race
    Analytics**.


    While it is possible to add new custom fields to objects that have already been
    packaged and released to your customers, you cannot currently add new **Auto Number**
    fields to an object that has already been packaged, for example, the **Driver**
    object.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'Apex tests creating test records that utilize Auto Number fields can be configured
    by an org setting to not increment the sequence number outside of the test, which
    would create gaps in the sequence from the end user''s perspective. Access this
    setting in the subscriber org via the Options... button on the Apex Test Execution
    page under Setup as follows:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_122_0.png)


    The Display Format determines the formatting but not the maximum sequence number.
    For example, if a format of SEQ{0000} is used, and the next sequence number created
    is 10,000, the platform will display it as SEQ10000, ignoring the format digits.
    The maximum of an Auto Number field is stated in the Salesforce documentation
    as being a maximum length of 30 characters, of which 10 are reserved for the prefix
    characters. It also states that the maximum starting number must be less than
    1,000,000,000.


    The platform does not guarantee that there will be no gaps in an auto number sequence
    field. Errors in creating records can create gaps as the number assigned during
    the insert process is not reused. Thus, set expectations accordingly with your
    users when using this feature.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'One workaround to creating an unbroken sequence would be to create a Custom
    Object with the Name field that utilizes the Auto Number field type, for example,
    Job References. Then, create a relationship between this object and the object
    records to which you require the sequence applied, for example Jobs. Then, write
    an Apex Scheduled job that inserts records on a daily basis into the Job References
    object for each Jobs record that is currently without a Job Reference relationship.
    Then, run reports over the Job References object. To ensure that no Job records
    are deleted, thus creating gaps, you can also enable the lookup referential integrity
    feature described in the following sections.


    # Subscribers customizing the Auto Number Display Format


    Be aware that Display Format cannot be customized once it is packaged and installed
    in the subscriber org. However, it is possible to create a custom formula field
    in the subscriber org to remove the prefix from the Name field value and reapply
    whatever prefix is needed. For example, the following formula will isolate the
    numeric portion of the Name field value and apply a new prefix specified in the
    formula (this could also be driven by a custom setting or conditional logic in
    the formula):


    ```

    ''MYID-'' + MID(Name, 4, LEN(Name) + 4)

    ```


    When this formula field is applied for a record whose Auto Number is RD-000000001,
    the formula would display as follows:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_123_0.png)'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Record relationships


    A relationship is formed by a **Lookup** field being created from one object to
    another, often referred to as a parent and child relationship. There are two types
    of relationships in Salesforce: **Master-Detail** and **Lookup**.


    > Custom Metadata Type objects only support Lookup relationships to other Custom
    Metadata Type objects or to other Custom Object or custom field metadata. Some
    features described in this section only apply to Custom Objects, such as lookup
    filters and referential integrity. Custom Setting objects do not support any form
    of record relationships.


    In some aspects, they share similarities in how they are referenced when using
    SOQL and Apex and how they are input through the user interface (such as **lookup
    filters** described in the previous chapter). However, there are differences regarding
    **limits** and **referential integrity** features, and they are as follows:


    +   - Utilizing the Master-Detail form of relationship provides a powerful way
    to model containment, where one parent object record acts as a container for other
    child records; in our example, a race contains **Contestants**.

    +     - The platform will automatically cascade deletion of child records when
    the parent is deleted, and it will also enforce the need for a parent reference
    when the child records are created.

    +     - By default, the platform prevents users from moving the child records
    to another parent by editing the relationship field. However, you can disable
    this validation and permit this by selecting the **Child records can be reparented
    to other parent records after they are created** option.

    +     - With the use of **Rollup Summary** fields, it also becomes possible to
    build calculated fields based on values of the child record fields.

    +     - Salesforce, however, does recommend that this kind of parent-and-child
    relationship does not exceed 10,000 child records; otherwise, the platform will
    not support the cascade delete of child records.

    +     - You can define up to three levels of Master-Detail relationships.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '+   - Utilizing the **Lookup** type of relationship allows you to model connections
    between related records that are optional and may also have other relationships
    not necessarily in an ownership or containing aspects of their parents. Keep in
    mind the following points when using Lookup fields to define relationships:

    +     - Deletion of parent records will not result in a cascade delete of related
    child records; this can be enabled via Salesforce Support, though this setting
    will not be packaged.

    +     - Unlike with Master-Detail, you can elect for the platform to enforce referential
    integrity during the creation of the field by utilizing the **Don''t allow deletion
    of the lookup record that''s part of a lookup relationship** option.

    +     - Currently, the **Rollup Summary** fields are not supported when using
    a Lookup relationship.


    Lookup fields of either kind are automatically indexed by the platform, making
    queries, in some cases, faster. We will focus more on indexes in a later chapter.
    The maximum number of relationship fields per object is 40.


    > While it is possible to add new custom fields to objects that have already been
    packaged and released to your customers, you cannot add a new Master-Detail relationship
    to an object that has already been packaged.


    # # Reusing the existing Standard Objects


    When designing your object model, a good knowledge of the existing **Standard
    Objects** and their features is the key to knowing when and when not to reference
    them. Keep in mind the following points when considering the use of Standard Objects:


    +   - **From a data storage perspective:** Ignoring Standard Objects creates a
    potential data duplication and integration effort for your end users if they are
    already using similar Standard Objects as pre-existing Salesforce customers. Remember
    that adding additional custom fields to the Standard Objects via your package
    will not increase the data storage consumption for those objects.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'From a license cost perspective: Conversely, referencing some Standard Objects
    might cause additional license costs for your users, since not all are available
    to the users without additional licenses from Salesforce. Make sure that you understand
    the differences between Salesforce (CRM) and Salesforce Platform licenses with
    respect to the Standard Objects available. Currently, the Salesforce Platform
    license provides Accounts and Contacts; however, to use Opportunity or Product
    objects, a Salesforce (CRM) license is needed by the user. Refer to the Salesforce
    documentation for the latest details on these.


    Use your user personas to define what Standard Objects your users use and reference
    them via lookups, Apex code, and Visualforce accordingly. You may wish to use
    extension packages and/or dynamic Apex and SOQL to make these kind of references
    optional. Since Developer Edition orgs have all these licenses and objects available
    (although in a limited quantity), make sure you review your package dependencies
    before clicking on the Upload button each time to check for unintentional references.


    # Importing and exporting data


    Salesforce provides a number of its own tools for importing and exporting data,
    as well as a number of third-party options based on the Salesforce APIs; these
    are listed on AppExchange. When importing records with other record relationships,
    it is not possible to predict and include the IDs of related records, such as
    the Season record ID when importing Race records; this section will present a
    solution to this.


    Salesforce provides Data Import Wizard, which is available under the Setup menu:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_126_0.png)'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'It is straightforward to import a CSV file with a list of race Seasons since
    this is a top-level object and has no other object dependencies. However, to import
    Race information (which is a related child object to Season), the Season and Fasted
    Lap By record IDs are required, which will typically not be present in a Race
    import CSV file by default. Note that IDs are unique across the platform and cannot
    be shared between orgs.


    If you need a reminder of the structure of these objects, refer to the Schema
    Builder screenshot shown in Chapter 2, Leveraging Platform Features.


    External ID fields help address this problem by allowing Salesforce to use the
    existing values of such fields as a secondary means to associate records being
    imported that need to reference parent or related records. All that is required
    is that the related record Name or, ideally, a unique external ID be included
    in the import data file.


    The Races.csv file is included in the sample code for this chapter in the /data
    folder. This CSV file includes three columns: Year, Name, and Fastest Lap By (of
    the driver who performed the fastest lap of that race, indicated by their Twitter
    handle). You may remember that a Driver record can also be identified by this
    since the field has been defined as an External ID field:


    | Year | Name | Fasted Lap By |

    |---|---|---|

    | 2014 | Melbourne | LewisHamilton |

    | 2014 | Shanghai | LewisHamilton |

    | 2014 | Monte Carlo | LewisHamilton |

    | 2014 | Budapest | LewisHamilton |'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'Both the 2014 **Season** record and the `Lewis Hamilton Driver` record should
    already be present in your packaging org. If not, refer to the previous chapter
    to create these. Now, run the **Data Import Wizard** and complete the settings
    as shown in the following screenshot:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_128_0.png)


    Next, complete the field mappings as shown in the following screenshot:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_128_1.png)


    Click on **Start Import** and then on **OK** to review the results once the data
    import has completed. You should find that four new **Race** records have been
    created under `2014 Season`, with the **Fasted Lap By** field correctly associated
    with the `Lewis Hamilton Driver` record.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Note that these tools will also stress your **Apex Trigger** code for volumes,
    as they typically have the bulk mode enabled and insert records in chunks of 200
    records. Thus, it is recommended that you test your triggers to at least this
    level of record volumes. Later chapters will present coding patterns to help ensure
    that code supports the bulk mode.


    # Options for replicating and archiving data


    Enterprise customers often have legacy and/or external systems that are still
    being used or that they wish to phase out in the future. As such, they may have
    requirements to replicate aspects of the data stored in the Salesforce platform
    to another. Likewise, in order to move unwanted data off the platform and manage
    their data storage costs, there is a need to archive data.


    The following lists some platform and API facilities that can help you and/or
    your customers build solutions to replicate or archive data. There are, of course,
    a number of **AppExchange** solutions listed that provide applications that use
    these APIs already:


    +   • **Replication API**: This API exists in both the web service SOAP and Apex
    form. It allows you to develop a scheduled process to query the platform for any
    new, updated, or deleted records within a given time period for a specific object.
    The `getUpdated` and `getDeleted` API methods return only the IDs of the records,
    requiring you to use the conventional Salesforce APIs to query the remaining data
    for the replication. The frequency in which this API is called is important to
    avoid gaps. Refer to the Salesforce documentation for more details.


    +   • **Outbound Messaging**: This feature offers a more real-time alternative
    to the replication API. An outbound message event can be configured using the
    standard workflow feature of the platform. This event, once configured against
    a given object, provides a **Web Service Definition Language (WSDL)** file that
    describes a web service endpoint to be called when records are created and updated.
    It is the responsibility of a web service developer to create the end point based
    on this definition. Note that there is no provision for deletion with this option.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '+   - Bulk API: This API provides a means to move up to 5000 chunks of Salesforce
    data (up to 10 MB or 10,000 records per chunk) per rolling 24-hour period. Salesforce
    and third-party data loader tools, including the Salesforce Data Loader tool,
    offer this as an option. It can also be used to delete records without them going
    into the recycle bin. This API is ideal for building solutions to archive data.


    Heroku Connect is seamless data synchronization solution between Salesforce and
    Heroku Postgres. For further information see https://www.heroku.com/connect.


    # External data sources


    One of the downsides of moving data off the platform in an archive use case, or
    with not being able to replicate data onto the platform, is that the end users
    have to move between applications and logins to view data; this causes an overhead
    as the process and data is not connected.


    The Salesforce Connect (previously known as Lightning Connect), a chargeable add-on
    feature of the platform, is the ability to surface external data within the Salesforce
    user interface via the so-called External Objects and External Data Sources configurations
    under Setup. They offer a similar functionality to Custom Objects, such as List
    View, Layouts and Custom Buttons. Currently Reports, and Dashboards are not supported,
    though it is possible to build custom report solutions via Apex, Visualforce or
    Lightning Components.


    External Data Sources can be connected to existing OData based end points and
    secured through OAuth or Basic Authentication. Alternatively, Apex provides a
    Connector API whereby developers can implement adapters to connect to other HTTP
    based APIs. Depending on the capabilities of the associated External Data Source
    users accessing External Objects using the data source can read and even update
    records through the standard Salesforce UIs such as Salesforce Mobile and desktop
    interfaces.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Summary


    This chapter has further explored the declarative aspects of developing an application
    on the platform that applies to how an application is stored and how relational
    data integrity is enforced through the use of the Lookup field deletion constraints
    and applying unique fields. The Master-Detail relationships allow you to model
