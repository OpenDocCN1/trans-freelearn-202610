- pgno: 357
  md: '# # What are your application''s integration needs?


    Typically an integration need arises from a controlling process or application
    that consumes the functionality of your application, effectively invoking the
    functionality within your application automatically on behalf of a user, or as
    part of an event or scheduled background process. Both, the standard Salesforce
    APIs and any additional application APIs that you create can support this need.
    The following diagram shows a controlling system driving your application through
    either the standard Salesforce API and/or application APIs that you have provided
    as part of the managed package:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_357_0.png)


    Although integrations are much easier when all applications are built based on
    the same platform, it is a good practice to have an API strategy that covers both,
    on- and off-platform, Developer X scenarios, ideally exposing the same functionality
    consistently.


    # ## Developer X calling your APIs on-platform


    A Force.com Apex developer can manipulate the data stored in your application
    through Apex DML statements. You can think of Apex DML as your free Apex API to
    your application data, as this approach avoids the need for you to build your
    own application APIs to purely manage record data, particularly for those Custom
    Objects that you are already exposing through the standard Salesforce UI.'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'It can be a useful aid to these developers to browse your Custom Object schema
    through Salesforce Schema Builder, as highlighted earlier in this book. Try to
    avoid inconsistencies between your Field Labels and Field API names (though the
    Schema Builder does permit toggling of these), as this can make it harder for
    developers and those expressing the requirements to collaborate.


    Just because Apex is being used does not mean that Developer X can bypass logic
    in your managed Apex Triggers. However, take note that they can also write Apex
    Triggers of their own, which can execute before yours (as the Apex Trigger order
    is nondeterministic). To avoid Developer X triggers making invalid changes to
    record data, ensure that you follow the best practice when you''re writing the
    validation logic to place it in the after-phase of your application triggers.
    As discussed in the previous chapter, utilizing the Domain pattern will ensure
    this.


    Later in this chapter we will discuss application APIs that expose functionality
    not directly related to manipulating your Custom Object records, but one that
    is more business logic related, for example exposing the ComplianceService.verify
    method. In this case, by making the Service class and methods global as opposed
    to public, you can make this same method available to Developer X. As an extension
    to your Apex API strategy, allow them to consume it in the same manner as you
    do within your application.


    The motivation behind this approach, described further in this chapter, is to
    ensure that the maximum amount of your application functionality is available
    through your API as your application evolves. However, if you do not want to expose
    your full Service layer directly as your application API, you can elect to create
    separate Apex classes that define your API which delegate to the Service layer
    or selectively apply the global keyword to your Service methods.


    # # Developer X calling your APIs off-platform


    Developer X using languages such as Java, .NET, NodeJS or Ruby uses the HTTP protocol
    to connect between the two platforms. Salesforce provides APIs to log in and authorize
    access for you as well as APIs to manipulate the data in your Custom Objects much
    like using Apex DML. Salesforce currently chooses to expose both SOAP- and REST-based
    variants of its HTTP-based APIs. So again, you need not develop your own APIs
    for this type of data integration.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '> Many third-party Salesforce integration applications leverage platform APIs
    and as such will also work with your application data; this fact is a key platform
    benefit for you and Developer X.


    When it comes to exposing application APIs, to support SOAP and REST, you will
    need to develop separate Apex classes in each case for each API that you want
    to expose. This is because the definition and design of these types is different,
    though the functionality your exposing is the same. We will discuss this further
    later in this chapter.


    # # SOAP versus REST


    If you have been following the debate over SOAP versus REST or just simply Google
    for it, you''ll know that there is currently a general trend towards REST. As
    it''s easier to code against and consume in mobile and JavaScript-based scenarios,
    most major cloud services such as Facebook and LinkedIn only provide REST versions
    of their APIs. For ease of use and the ability to be more self-describing I prefer
    REST also.


    # # What are your applications extensibility needs?


    So far we have been discussing providing facilities to build custom solutions
    around your application, which is one type of integration. Another is providing
    ways to make extensions to its existing business logic. In an extensibility use
    case, Developer X or an administrator is happy for your users to consume your
    application UI and functionality directly but wants to extend it in some way to
    add additional functionality or updates to other Custom Objects. Some examples
    of the type of extensions you might want to consider are as follows:


    +   - Adding subscriber-created Custom Fields to Visualforce Pages and Field Sets
    is an easy way to achieve this

    +   - Providing alternatives to hardcoded Email messages via Email Templates

    +   - Extending the application Apex code logic with the subscriber-written Apex
    logic; this is something I call Application Callouts'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'In this chapter we will explore Application Callouts further. The following
    diagram shows processes in your application code making use of this approach to
    execute **code** written by *Developer X*. Later in this chapter we will see an
    example of how can implement these through the use of Apex interfaces and Custom
    Metadata records.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_360_0.png)


    # # Force.com platform APIs for integration


    *Chapter 2, Leveraging Platform Features*, provided a good overview of the many
    platform APIs available to those integrating with your application from outside
    of the Force.com platform, from environments such as Java, .NET, PHP, and Ruby.
    It also provided the best practices to ensure that your application and developers
    using these APIs have the best experience.


    As stated in that chapter, these APIs are mostly focused on record data manipulation
    and querying, often known as CRUD. Leveraging the Salesforce APIs means developers
    wishing to learn how to integrate with your application objects can leverage the
    standard Salesforce API documentation and websites such as https://developer.salesforce.com/.'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'Although the Enterprise API provides a strongly typed SOAP API for Java or
    .NET developers, its larger size can be problematic to load into development environments
    (as it includes all Custom Objects and fields present in the org). As such, more
    general Partner API is often a better recommendation to make to Developer X. Most
    developers are used to generic data access layers such as JDBC and ADO, and in
    essence to them the Partner API is similar and a lot smaller to embed in their
    applications. If however, you are recommending an API for mobile or JavaScript
    integration, the Salesforce REST APIs are even lighter, though come at the added
    responsibility of the developer to parse and form the correct JSON responses and
    requests without the aid of generated class types provided via the WSDLs of the
    SOAP APIs. Typically, languages that prefer more strongly typed programming principles
    prefer the SOAP variants over the REST variant.


    For Java developers, Salesforce provides an excellent Web Service Connector (WSC)
    framework, which offers an efficient way to consume the SOAP and REST APIs without
    the need for any other web service stacks. They provide compiled versions of their
    popular Partner and Metadata APIs, with plenty of examples online. If you''re
    familiar with it, the easiest way to download and start using this API is to use
    Apache Maven (https://mvnrepository.com/artifact/com.force.api/force-wsc). You
    can also download WSC from https://github.com/forcedotcom/wsc:


    > "The Force.com Web Service Connector (WSC) is a high performing web service
    client stack implemented using a streaming parser. WSC also makes it much easier
    to use the Force.com API (Web Services/SOAP or Asynchronous/BULK API)."


    For .NET developers, Salesforce started an open source initiative to build precompiled
    assemblies providing access to their APIs, much in the same spirit as the WSC
    Java library described earlier. You can download the toolkit for .NET from https://github.com/developerforce/Force.com-Toolkit-for-NET:


    > "The Force.com Toolkits for .NET provides an easy way for .NET developers to
    interact with the Force.com & Chatter REST APIs using native libraries."


    For NodeJS developers, Kevin O''Hara has contributed to the community a library
    known as nforce to the community. You can download this toolkit for NodeJS from
    https://github.com/kevinohara80/nforce:


    > "nforce is node.js a REST API wrapper for force.com, database.com, and salesforce.
    com."'
  merge: -1
  img_proc: true
- pgno: 362
  md: "# Application integration APIs\n\nThis section describes ways in which you\
