- pgno: 86
  md: '# # Your code and security review considerations


    Not all code you write will automatically be subjected to enforcement by the platform
    through the object- and field-level security defined by the Permission Sets or
    profiles assigned to users. While certain Visualforce components such as `apex:inputField`
    and `apex:outputField` enforce security, other ways in which you obtain or display
    information to users will not enforce security, such as `apex:inputText` and `apex:outputText`.
    The differences will be discussed in more detail in a later chapter.


    When your code is performing calculations or transformations on fields in the
    controller, expose this data indirectly via Apex bindings or remote action methods
    on your controller; for this, you need to add additional checks yourself. This
    also applies to any customer facing the Apex code such as `global` methods or
    Apex REST APIs you build.


    In these cases, you can use the **Apex Describe** facility to specifically check
    the user''s profile or Permission Set assignment for access and prevent further
    execution by returning errors or throwing exceptions. The formal reference information
    for implementing this can be found in the following two Salesforce articles:


    +   - **Enforcing CRUD and FLS:** https://developer.salesforce.com/page/Enforcing_CRUD_and_FLS

    +   - **Testing CRUD and FLS Enforcement:** https://developer.salesforce.com/page/Testing_CRUD_and_FLS_Enforcement


    The Salesforce security review scanner and team insist that you check Custom Object
    level security (CRUD security for short) and include checking for every field
    that is accessed (**field-level security (FLS)**).


    Implementing code to check both needs careful consideration, planning, and monitoring.
    Implementing FLS is especially complex with multiple use cases and contexts applying
    different usage patterns within your code base. For some functionalities, you
    may wish the application to access certain objects and/or fields on the users''
    behalf without checking security; document these cases well as you might need
    to present them to Salesforce.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Implementing CRUD security is something we will revisit in later chapters on
    the Domain and Selector layers of your Apex code, where some automated support
    within the library used to support these patterns has been provided.


    > It''s best to review and document your approach and use the CRUD and FLS checking
    as a part of defining your coding conventions, and if in doubt, discuss with your
    Salesforce Technical Account Manager (TAM) or by raising a support case in Partner
    Portal. This way, you will also have some reference decisions and conversations
    to use when providing input and background to the security review team. Meanwhile,
    the Salesforce community, including myself, is looking at ways of creating generic
    ways to enforce CRUD and FLS without having to see hardcoded checks throughout
    the code base.


    Note that it is a common misconception that applying the `with sharing` keyword
    to your Apex classes will automatically enforce CRUD or FLS security, but it does
    not. This keyword solely controls the records returned when querying objects,
    so is in fact related only to data security.


    # ## Data security


    Regardless of which Custom Objects or fields are accessible to the end user through
    their profile or Permission Set assignments, there may still be a requirement
    to filter which records certain users can see, for example, certain race data
    during and after the race can only be visible to the owning teams.


    Salesforce allows this level of security to be controlled through the **Owner**
    field on each record and optionally a facility known as sharing. This is defined
    via the **Sharing Settings** page (under **Security Controls | Setup**), in the
    packaging org for the FormulaForce application. This page is shown in the following
    screenshot:'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_88_0.png)


    You can see the Standard Objects and also the Custom Objects we have created so
    far listed here. When you click on Edit, Default Access shows that the access
    options vary based on whether the object is a standard or Custom Object, as Salesforce
    has some special access modes for certain Standard Objects such as Price Book.


    > Notice that where an object is in a child relationship with a parent record,
    in the case of Race and Session, there is no facility to control the security
    of this object. Thus, when you are designing your application object schema, make
    sure that you consider whether you or your users will need to utilize sharing
    on this object; if so, it might be better to consider a standard lookup relationship.


    For the Custom Objects that exist as a part of the FormulaForce application, you
    can define Public Read/Write, Public Read Only, and Private. The default value
    is always Public Read/Write.


    The default access defines the starting position for the platform to determine
    the visibility of a given record using the Owner field and the object''s sharing
    rules. In other words, you cannot use these features to hide records from a given
    user if the object has Public Read or Public Read/Write default access.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Although this setting is packaged with Custom Objects, it is editable in the
    subscriber org and is thus not upgradable. If you decide to change this in a later
    release, this will need to be done manually as a post-install task.


    If you set the Private default access and do nothing, the Owner field determines
    the visibility of the records. By default, the owner is the user that created
    the record. Thus, users can only see records they create or records created by
    other users below them in the role hierarchy (if enabled). A record owner can
    be a user or a group (known as Queue within the API), for example, members of
    a specific racing team. Users can choose to manually share a record they own with
    other users or groups also.


    Sometimes, a more sophisticated and dynamic logic is required; in these cases,
    sharing rules can be added and they can be created either declaratively (from
    the Sharing Settings page) or programmatically. Regardless of the approach used,
    the platform creates a Share object (for example, for a RaceData__c object, this
    would be RaceData__Share) that contains records resulting from the evaluation
    of sharing rules; these records can be queried like any other object, useful for
    debugging.


    For the ultimate in flexibility, you can write logic within an Apex Trigger or
    Scheduled Job to directly create, update, or delete the sharing records, for example,
    in the RaceData__Share object. In this case, the criteria for sharing records
    can be practically anything you can express in code. You first define a sharing
    reason against the applicable Custom Object, which will be automatically included
    in your package. This is used as a kind of tag for the sharing records your application
    code creates versus sharing records created through sharing rules defined in the
    subscriber org. Also note that if the platform detects references to the Share
    object for a given object listed on the Sharing Settings page, it will prevent
    the subscriber org administrator from changing the default access from Private
    to Public.


    # Your code and security review considerations


    The platform will enforce record visibility in cases where the user attempts to
    navigate to the record directly in the Salesforce UI, including reports they run
    and access provided via Salesforce APIs when they use third-party applications.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'However, keep in mind that your Apex code runs at system level by default;
    thus, it''s important to pay attention to the use of the `with sharing` or `without
    sharing` keyword (for all key entry points to your code). This is also something
    the security review scanner will look for. You might as well ask when using the
    `without sharing` keyword makes sense; such a use case might be when you explicitly
    want a system-level logic to see all records on behalf of an operation or validation
    the user is performing.


    # # Platform APIs


    Salesforce provides a number of APIs to access and manipulate records in its own
    objects that belong to applications such as CRM; these APIs are also extended
    to support Custom Objects created by admins or provided by packages installed
    in the subscriber org. Salesforce dedicates a huge amount of its own and community-driven
    documentation resources you can reference when educating partners and customer
    developers on the use of these APIs. Thus, it is important that your application
    works well with these APIs.


    Platform APIs are enabled for Enterprise Edition orgs and above, though if you
    have a need to consume them in Professional or Group Edition orgs, Salesforce
    can provide a Partner API token (following security review completion) to enable
    their use; this is unique to your application and so does not provide access for
    code other than yours.


    Typically, unless you are developing an off-platform utility or integration to
    accompany your application, you may not find your application consuming these
    APIs at all, though there are some you might want to consider, highlighted in
    the following bullets. Keep in mind, however, that if you do, in addition to the
    Partner API token, the subscriber org''s daily API limit will also be consumed;
    hence, ensure that your usage is as network optimal as possible.


    Enterprise-level customers often have complex integration requirements both on
    and off platform; typically, Salesforce utilizes the SOAP and REST technologies
    to make these APIs available to any number of platforms and languages such as
    Java and Microsoft .NET. In _Chapter 9, Providing Integration and Extensibility_,
    we will discuss how you can extend the features of the platform data-orientated
    APIs with your own more application process-orientated APIs.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '> Note that not all platform APIs have an Apex variant that can be called directly,
    though this does not necessarily mean that they cannot be used.

    > Apex supports making outbound HTTP callouts either via a WSDL or

    > by directly creating and parsing the required requests or responses. A

    > good example of this is the Metadata API, which can be used to develop

    > Visualforce wizards to automate common setup tasks via Apex, as shown

    > in an Apex example Ok to delete later in this chapter.


    The following list details some of the main APIs that may be of use to your

    Enterprise-level customers wishing to develop solutions around your application:


    +   * **Enterprise API**: This SOAP API is dynamically generated based on the

    +   objects present at the time in the subscriber org, meaning that any tool (such

    +   as data-mapping tools) or developer consuming it will find the information

    +   exposes more familiar and easier to access. One downside, however, is that

    +   this can end up being quite a large API to work with, as Enterprise customer

    +   orgs often have hundreds of objects and fields in them.

    +   * **Partner API**: This is also a SOAP API; unlike the Enterprise API, it
    provides a

    +   more generic CRUD-based API to access the record in the subscriber org. Its

    +   name can be a bit misleading, as there is no restriction to non-partners using

    +   it, and as it is lighter than the Enterprise API, it''s often a first choice.

    +   * **REST API**: This provides another CRUD style API, similar to the Partner

    +   API, but in this case, it is based on the more popular REST technology

    +   standard. It''s often preferred when building mobile applications and is also

    +   fast becoming popular as the default API for Java and .NET.

    +   * **Metadata API and Tooling API**: These SOAP APIs provide a means to

    +   automate many of the tasks performed under the **Setup** menu and those

    +   performed by developers when editing code. While these might not be of

    +   direct interest to those integrating with your application, as many of these

    +   tasks are performed initially and then only rarely, it might be something

    +   to consider using in tools you want to provide to keep the implementation

    +   times for your application low.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '+   Streaming API: This API utilizes a HTTP long polling protocol known as
    the Bayeux protocol to allow callers to monitor in near real time and record activity
    in Salesforce. This API can be used on a page to monitor race data as it arrives
    and display it in near real time to the user.


    +   Replication API: Sometimes it is not possible or desirable to migrate all
    data into Salesforce through Custom Objects. In some cases, this migration is
    too complex or cost prohibitive. This REST and Apex API allows replication solutions
    to determine for a given period of time which records for a given object have
    been created, updated, or deleted.


    +   Bulk API: This REST-based API allows the import and export of large amounts
    of records in CSV or XML format up to 10 MB in size per batch job.


    # Considerations for working well with OK platform APIs


    The following are some considerations to ensure that your application objects
    are well placed to work well with OK platform APIs:


    +   Naming Custom Objects and fields: When naming your Custom Objects and fields,
    pay attention to API Name (or Developer Name, as it is sometimes referenced).
    This is the name used when referencing the object or field in the APIs and Apex
    code mentioned in the previous section. Personally, I prefer to remove the underscore
    characters that the Salesforce Setup UIs automatically place in the default API
    names when you tap out of the Label field, as doing so makes the API name shorter
    and easier to type with fewer underscore characters. It then ends up reflecting
    the camel case used by most APIs, for example, RaceData_c instead of Race_Data__c.


    +   Label and API name consistency: While it is possible to rename the label of
    a custom field between releases of your application, you cannot rename the API
    name. Try to avoid doing so, as causing an inconsistency between the field label
    and API name makes it harder for business users and developers to work together
    and locate the correct fields.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '+   Naming Relationships: Whenever you define Master-Detail or Lookup Relationship,
    the platform uses the plural label value of the object to form a relationship
    API name. This API name is used when querying related records as part of a subquery,
    for example, select Id, Name, (select Id, Name from Races) from Season__c. When
    creating relationship fields, pay attention to the default value entered into
    the Child Relationship Name field, removing underscores if desired and checking
    whether the names make sense.


    For example, if you create a lookup field to the Driver__c object called Fastest
    Lap By on the Race__c object, the default relationship API name will be Races.
    When using this in a subquery context, it will look like select Id, Name, (select
    Id, Name from Races) from Race__c. However, by naming the relationship FastestLaps,
    this results in a more self-describing query: select Id, Name, (select Id, Name
    from FastestLaps) from Race__c.


    +   Apex Triggers bulkification and performance: When testing Apex Triggers, ensure
    that you accommodate up to 200 records; this is the default chunk size that Salesforce
    recommends when utilizing its bulk APIs. This tests the standard guidelines around
    bulkification best practices; although smaller chunk sizes can be configured,
    it will typically reduce the execution time of the overall process. Also related
    to execution time is the time spent within Apex Trigger code, when users solely
    update fields that have been added in the subscriber org. In these cases, executing
    the Apex Trigger logic is mostly redundant, as none of the fields this logic is
    interested in will have changed. Therefore, encourage the optimization of the
    Apex Trigger logic to execute expensive operations (such as the execution of SOQL)
    only if fields that have been packaged have changed.


    # Localization and translation


    It is important to take localization and translation into consideration from the
    beginning as it can become difficult and costly to apply it later. Fortunately,
    the platform can do a lot of work for you.'
  merge: -1
  img_proc: true
- pgno: 94
  md: "# # Localization\n\nWhen using the native user interface, it automatically\
    \ formats the values of the numeric and date fields according to the **Locale**\
    \ field on the user profile. **Visualforce** pages using the `apex:outputField`\
    \ and `apex:inputField` components will automatically format values, and outputting\
    \ local sensitive values in any other way will need to be handled manually in\
    \ your Apex Controller code or in your JavaScript code.\n\n> It's not always possible\
    \ to use the Visualforce apex:inputField and apex:outputField tags as described\
    \ earlier in this chapter. For example, if the information you are displaying\
    \ is not contained within a Custom Object field, but in some calculated view state\
    \ in your Apex Controller. The format methods on various type classes such as\
    \ Date, DateTime, and Decimal, can be used to generate a formatted string value\
    \ that you can bind to on your pages. You can also determine the users' ISO locale\
    \ code via UserInfo.getLocale().\n\n# # Translation\n\nLiteral text entered when\
    \ defining components such as Custom Objects, fields, and layouts are automatically\
    \ available to the Salesforce **Translation Workbench** tool. However, literal\
    \ text used in the Apex code and Visualforce pages need special attention from\
    \ the developer through the use of Custom Labels.\n\nIt is important to avoid\
    \ the concatenation of Custom Label values when forming messages to the end user,\
    \ as it makes it harder for translators to understand the context of the messages\
    \ and if needed, resequence the context of the message for other languages. For\
    \ example, take the message `The driver XYZ was disqualified`. The bad practice\
    \ is:\n\n```\nString message =\n    Label.TheDriver + driverName + Label.WasDisqualified;\n\
    ```\n\nThe good practice is as follows:\n\n```\nString message = String.format(\n\
    \    Label.DriverDisqualified, new String{' ' driverName\");\n```"
  merge: -1
  img_proc: true
