- pgno: 432
  md: "In order to write unit tests for these methods and these methods alone, we\
    \ need the dashboard, display and engine variables to reference something the\
    \ compiler will recognize as having the required methods. But it also needs to\
    \ allow us to make a substitution of the real implementation of these methods\
    \ with special test-only versions so we can record when the methods are called\
    \ in order to assert behavior. What we need is mock implementations of the Dashboard,\
    \ Engine and Display classes.\n\n# Constructor Dependency Injection\n\nThe preceding\
    \ code makes explicit hard coded dependencies between classes.\nTo work around\
    \ this, CDI can be applied. This has been used in other languages\nsuch as Java.\
    \ In the following examples Apex Interfaces are utilized to express the\ndependencies\
    \ between various units of code that you want to test in isolation.\n\n> It is\
    \ not required to apply this to all method-to-method calling\n> dependencies;\
    \ only those that you want to apply unit testing to. The Apex\n> Enterprise patterns\
    \ focuses mainly on Services, Domain, Selector and Unit\n> of Work classes.\n\n\
    By leveraging the ability to have multiple implementations of a given interface\n\
    we can vary which implementation gets executed. We can execute the real\nimplementation\
    \ of a method (this is provided by the preceding classes) or the test\nonly the\
    \ mock behavior of it, typically defined in the test itself. Thus depending on\n\
    the type of test being written, integration or unit test, you then pass the appropriate\n\
    implementations constructor of the Car class.\n\nTo support this type of injection,\
    \ the following three things must be changed:\n\nFirstly, interfaces are created\
    \ to reflect the methods on the Engine, Dashboard, and\nDisplay classes. The following\
    \ code shows how these interfaces are defined:\n\n```\npublic interface IEngine\
    \ {\n    void start();\n    void stop();\n    Boolean isRunning();\n}\npublic\
    \ interface IDashboard {\n    void initialise();\n    void updateRPMs(Integer\
    \ rpms);\n    void off();\n}\npublic interface IDisplay {\n    void backlight(Boolean\
    \ onOff);\n}\n```"
