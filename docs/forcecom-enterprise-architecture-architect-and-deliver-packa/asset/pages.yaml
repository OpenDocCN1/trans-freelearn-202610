    are non-upgradable components, this will need to be added manually after installation
    in the test org when upgrading, as will any new custom fields added throughout
    this chapter. You would typically notify users of these steps through your upgrade
    and installation guide. You will also have to ensure users are made aware of any
    Lightning Components as part of your solution. As previously noted, packaging
    Lightning pages creates a dependency on the My Domain feature having been enabled
    by the customer.


    # Summary


    In this chapter, you''ve seen a new way to factor business logic beyond encapsulating
    it in the Service layer – one that aligns the logic– implementing the validation
    changes, and interpretation of an object''s data through a Domain class named
    accordingly. As with the Service layer, this approach makes such code easy to
    find for new and experienced developers working on the code base.


    A Domain class combines the traditional Apex Trigger logic and custom Domain logic–
    such as the calculation of championship points for a contestant or the verification
    of compliance rules against the cars, drivers, and teams.'
  merge: -1
  img_proc: true
