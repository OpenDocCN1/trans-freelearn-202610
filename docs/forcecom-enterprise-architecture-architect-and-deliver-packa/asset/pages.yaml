  md: '# Handling DML with the Unit Of Work pattern


    The database maintains relationships between records using record IDs. Record
    IDs are only available after the record is inserted. This means that the related
    records, such as child object records, need to be inserted in a specific dependency
    order. Parent records should be inserted before child records, and the parent
    record IDs are used to populate the relationship (lookup) fields on the child
    record objects before they can be inserted.


    The common pattern for this is to use the `List` or `Map` keyword to manage records
    inserted at a parent level, in order to provide a means to look up parent IDs,
    as child records are built prior to being inserted. The other reasoning for this
    is bulkification; minimizing the number of DML statements being used across a
    complex code path is vital to avoid hitting governor limits on the number of DML
    statements required as such lists are favored over executing individual DML statements
    per record.


    The focus on these two aspects of inserting data into objects can often detract
    from the actual business logic required, making code hard to maintain and difficult
    to read. The following section introduces another of Martin Fowler''s patterns,
    the Unit Of Work, which helps address this, as well as providing an alternative
    to the boilerplate transaction management using SavePoint, as illustrated earlier
    in this chapter.


    The following is Martin Fowler''s definition of Unit Of Work (`http://martinfowler.com/eaaCatalog/unitOfWork.html`):


    > "Maintains a list of objects affected by a business transaction and coordinates
    the writing out of changes and the resolution of concurrency problems."


    In an extract from the given webpage, he also goes on to make these further points:


    > "You can change the database with each change to your object model, but this
    can lead to lots of very small database calls, which ends up being very slow."


    > "A Unit of Work keeps track of everything you do during a business transaction
    that can affect the database. When you''re done, it figures out everything that
    needs to be done to alter the database as a result of your work."


    Although these statements don''t appear to relate to Force.com, there are parallels
    with respect to the cost of making multiple DML statements, both in terms of governors
    and general performance. There is also a statement about transaction'
