- pgno: 106
  md: '# Application Storage


    It is important to consider your customers'' storage needs and use cases around
    their data creation and consumption patterns early in the application design phase.
    This ensures that your object schema is the most optimum one with respect to large
    data volumes, data migration processes (inbound and outbound), and storage cost.
    In this chapter, we will extend the Custom Objects in the FormulaForce application
    as we explore how the platform stores and manages data. We will also explore the
    difference between your applications operational data and configuration data and
    the benefits of using Custom Metadata Types for configuration management and deployment.


    You will obtain a good understanding of the types of storage provided, and how
    the costs associated with each are calculated. It is also important to understand
    the options that are available when it comes to reusing or attempting to mirror
    the Standard Objects such as Account, Opportunity, or Product, which extend the
    discussion further into license cost considerations. You will also become aware
    of the options for standard and custom indexes over your application data, which
    will lead to the topic of handling large data volumes, covered in an entire chapter
    later in this book. Finally, we will gain some insight into new platform features
    for consuming external data storage from within the platform.


    In this chapter, we will cover the following topics:


    +   - Mapping out end user storage requirements

    +   - Understanding the different storage types

    +   - Record identification, uniqueness, and auto numbering

    +   - Record relationships

    +   - Reusing existing Standard Objects

    +   - Applying external IDs and unique fields'
  merge: -1
  img_proc: true
- pgno: 107
  md: '+   - Importing and exporting application data

    +   - Options for replicating and archiving data

    +   - External data sources


    # # Mapping out end user storage requirements


    During the initial requirements and design phase of your application, the best
    practice is to create user categorizations known as personas. Personas consider
    the users'' typical skills, needs, and objectives. From this information, you
    should also start to extrapolate their data requirements, such as the data they
    are responsible for creating (either directly or indirectly, by running processes),
    and what data they need to consume (reporting). Once you have done this, try to
    provide an estimate of the number of records that they will create and/or consume
    per month.


    > Share these personas and their data requirements with your executive sponsors,
    your market researchers, early adopters, and finally the whole development team,
    so that they can keep them in mind and test against them as the application is
    developed.


    For example, in our FormulaForce application, it is likely that **managers** will
    create and consume data, whereas **race strategists** will mostly consume a lot
    of data. **Administrators** will also want to manage your application''s configuration
    data. Finally, there will likely be a background process in the application, generating
    a lot of data, such as the process that records race data from the cars and drivers
    during the qualification stages and the race itself, such as sector (a designated
    portion of the track) times.


    > You may want to capture your conclusions regarding personas and data requirements
    in a spreadsheet along with some formulas that help predict data storage requirements
    (discussed later in this chapter). This will help in the future as you discuss
    your application with Salesforce during the AppExchange listing process, and will
    be a useful tool during the Sales cycle as prospective customers wish to know
    how to budget their storage costs with your application installed.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Understanding the different storage types


    The storage used by your application records contributes to the most important
    part of the overall data storage allocation on the platform. There is also another
    type of storage used by the files uploaded or created on the platform. From the
    Storage Usage page under the Setup menu, you can see a summary of the records
    used, including those that reside in the Salesforce Standard Objects.


    Later in this chapter, we will be creating a Custom Metadata Type object to store
    configuration data. Storage consumed by this type of object is not reflected on
    the Storage Usage page and is managed and limited in a different way.


    # Storage Usage


    Your organization''s storage usage is listed below.


    | Storage Type | Limit | Used | Percent Used |

    | :--- | :--- | :--- | :--- |

    | Data Storage | 256.0 MB | 284 KB | 0% |

    | File Storage | 902.0 MB | 13 KB | 0% |


    # Current Data Storage Usage


    | Record Type | Record Count | Storage | Percent |

    | :--- | :--- | :--- | :--- |

    | Opportunities | 31 | 62 KB | 22% |

    | Cases | 26 | 52 KB | 18% |

    | Leads | 22 | 44 KB | 15% |

    | Contacts | 20 | 40 KB | 14% |

    | Campaigns | 4 | 32 KB | 11% |

    | Accounts | 12 | 24 KB | 8% |

    | Solutions | 10 | 20 KB | 7% |

    | Drivers | 2 | 4 KB | 1% |

    | Races | 1 | 2 KB | 1% |

    | Seasons | 1 | 2 KB | 1% |

    | Contestants | 1 | 2 KB | 1% |

    | Tasks | 0 | 0 B | 0% |

    | Photos | 2 | 0 B | 0% |'
  merge: -1
  img_proc: true
- pgno: 109
  md: '> The preceding page also shows which users are using the most amount of storage.
    In addition to the individual''s **User Details** page, you can also locate the
    **Used Data Space** and **Used File Space** fields; next to these are the links
    to view the users'' data and file storage usage.


    The limit shown for each is based on a calculation between the minimum allocated
    data storage depending on the type of organization or the number of users multiplied
    by a certain amount of MB, which also depends on the organization type; whichever
    is greater becomes the limit. For full details of this, click on the **Help for
    this Page** link shown on the page.


    # Data storage


    Unlike other database platforms, Salesforce typically uses a fixed 2 KB per record
    size as part of its storage usage calculations, regardless of the actual number
    of fields or the size of the data within them on each record. There are some exceptions
    to this rule, such as **Campaigns** which take up 8 KB, and stored **Email Messages**
    use up the size of the contained e-mail, though all Custom Object records take
    up 2 KB. Note that this record size also applies even if the Custom Object uses
    large text area fields.


    > Salesforce **Big Objects** offer a different kind of storage solution, these
    objects are designed for the storage of billions of records, receiving device
    input, in **Internet of Things (IoT)** scenario for examples. Information is written
    on mass using bulk loading and later read frequently, or stated another way, written
    less and read often. Although not disclosed by Salesforce, the expectation is
    that the storage cost for these objects will be cheaper than equivalent records
    stored in Custom Objects. The Race Data object introduced later in this chapter
    could be considered a good candidate for this type of object for the FormulaForce
    application, since this information is uploaded after the race in bulk and used
    to analyze the race.


    # Columns versus rows


    Given the calculation in the preceding section, you may want to consider whether
    your data model has multiple occurrences of data that have a known maximum value.
    In these cases, consider the option of creating multiple columns (or multiple
    sets of columns) instead of a new object that will use up additional storage.
    Enterprise Edition orgs currently support up to 500 fields per object. For example,
    in Formula 1 racing, it is well established that there are only three rounds of
    qualification before the race in order to determine the starting positions, where
    each driver competes for the fastest lap.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'This could be modeled as a Qualification Lap child object to the Contestant
    object; however, in this case, it will only ever have a maximum of three records
    per contestant in it. A more optimal data storage design is a set of new fields
    in the Contestant object.


    Perform the following steps in the packaging org to try out this process:


    +   1. Create three fields of type Number (6, 3), for example, Qualification 1
    Lap Time (Qualification1LapTime__c), on the Contestant object. Ensure that the
    Required checkbox is unchecked when creating these fields, since not all drivers
    make it through to the final qualification rounds.

    +   Note that here we have used numerals instead of words, for example QualificaitonOneLapTime__c,
    as this can help in situations where dynamic Apex is iterating over the fields.


    +   2. Create a roll-up summary field on the Race object, Poll Position Lap Time,
    utilize the MIN option when selecting Roll-Up Type, and select the Qualification
    1 Lap Time field in Field to Aggregate, as shown in the following screenshot:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_110_0.png)


    +   3. Finally, update the permission sets to grant read and write access to the
    new fields that you have just added in the Race Management permission set and
    read access within the Race Analytics permission set.


    Keep in mind that you can also use Formula fields to add or apply further logic
    to data stored in columns, emulating what would have been filtered or aggregating
    queries over equivalent rows. There is also a benefit to reducing the number of
    SOQL and DML operations that your code needs to perform when taking this approach.'
  merge: -1
