  md: "# Unit Of Work special considerations\n\nDepending on your requirements and\
    \ use cases, the standard methods of Unit Of Work may not be appropriate. The\
    \ following is a list of some use cases that are not handled by default and may\
    \ require a custom work callback to be registered:\n\n+   - **Self and recursive\
    \ referencing:** Records within the same object that have lookups to each other\
    \ are not currently supported, for example, account hierarchies.\n+   \n+   -\
    \ **More granular DML operations:** The Database class methods allow the ability\
    \ to permit some records to be processed when others fail. The DML statements\
    \ executed in the Unit Of Work are defaulted to all or nothing.\n+   \n+   - **Sending\
    \ e-mails:** Sending e-mails is considered a part of the current transaction;\
    \ if you want to register this kind of work with the Unit Of Work, you can do\
    \ so via the registerEmail method. Multiple registrations will be automatically\
    \ bulkified.\n\nThe following is a template for registering a customer work callback\
    \ handler with Unit Of Work. This will be called during the commitWork method\
    \ within the transaction scope it creates. This means that if work fails in this\
    \ work callback, it will also call other work registered in the standard way with\
    \ Unit Of Work to rollback. Take a look at the code:\n\n```\npublic class CustomAccountWork\
    \ implements\n    fflib_SObjectUnitOfWork.IDoWork {\n\nprivate List<Account> accounts;\n\
    \npublic CustomAccountWork (List<Account> accounts) {\n    this.accounts = accounts;\n\
    }\n\npublic void doWork() {\n    // Do some custom account work e.g. hierarchies\n\
    }\n}\n```\n\nThen, register the custom work as per the following example:\n\n\
    ```\nuow.registerNew...\nuow.registerDirty...\nuow.registerDeleted...\nuow.registerWork(new\
    \ CustomAccountWork(accounts));\nuow.commitWork();\n```"
  merge: -1
  img_proc: true
