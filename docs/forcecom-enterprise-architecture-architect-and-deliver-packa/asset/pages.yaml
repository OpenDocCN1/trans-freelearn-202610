- pgno: 117
  md: '**Protection:** This determines if the record is visible in the customer org.
    Protected records are hidden from the user, but your own packaged Apex code can
    still query them. Use protected records for internal configuration.


    ## Track Lap Records


    | Action | Label | Track Lap Record Name | Namespace Prefix | Protected Component
    | Time | Driver Name | Year |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

