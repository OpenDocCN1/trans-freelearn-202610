    The preceding use of the `verify` method is no different from the previous test.
    However, the following mocked method call illustrates a very cool feature of ApexMocks
    verification logic. The parameters passed in the call to the mocked method are
    used by the framework to compare with those recorded during prior execution of
    the method during the preceding test. If any differences are detected an assertion
    is thrown and the test is stopped.


    > Some of the preceding examples include a `System.assert` method call inline.
    Other unit tests you write may not require use of this statement as they solely
    assert the correct dependent methods have been called through the `verify` method.
    This can lead to a false positive in the **Salesforce Security Review** scanner,
    since the verify method is not recognized as a method asserting quality. If this
    happens you can add a comment neutral assert to pacify the scanner, or record
    the reason why in the false positive document you attach to the review.


    # ApexMocks Matchers


    As you can see there are two key parts to using ApexMocks– setting up the mocked
    responses through stubbing, and asserting the behavior through verifying. Both
    these facilities support the ability customize what mocked values are returned
    or what parameters are matched during verify.


    For example, if the code you''re unit testing calls a mocked method several times
    with different parameters, you can vary the mocked value returned using a convention
    known as a matcher during the stubbing phase of your test code.


    > It is also possible to configure the framework''s throwing of exceptions when
    mocked methods are called, if that is the desired test case you want to cover.


    When asserting behavior, if you wish to check that a mocked method is called twice
    — once with a certain set of parameter values and a second time with a different
    set of parameters — then matchers can be used to express this desired outcome.'
