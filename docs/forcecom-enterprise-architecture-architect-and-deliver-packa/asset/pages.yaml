    \ using custom datasets, as described in this section, you should consider creating\
    \ the class as a top-level class. This avoids potential circular dependencies\
    \ occurring between the interface and selector class.\n\n# Combining Apex data\
    \ types with SObject types\n\nIt is possible to combine Apex data types with SObject\
