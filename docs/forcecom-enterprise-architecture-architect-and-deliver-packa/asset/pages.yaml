- pgno: 74
  md: '3. This results in the current year being displayed in the **Year** field as
    shown in the following screenshot:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_74_0.png)


    The preceding screenshot shows the user interface shown by Salesforce when the
    user is using Salesforce Classic. Salesforce Classic is the predecessor to their
    latest user interface technology known as Lightning Experience. Both are options
    for users and will likely remain so for some time until users and applications
    are migrated over. This book also includes information on Lightning throughout
    its chapters, as well as a dedicated Chapter 10, Lightning.


    Unfortunately, by default, the Apex code does not apply default values when you
    construct an SObject in the direct manner via `new Season();` however, if you
    utilize the `SObjectType.newSObject` method, you can request for defaults to be
    applied as follows:


    ```

    Season__c season = (Season__c)

    Season__c.SObjectType.newSObject(null, true);

    System.assertEquals(''2016'', season.Year__c);

    ```


    # # Encrypted fields


    However unlikely you feel data theft might be, there are some markets and government
    regulations that require encrypted fields. Salesforce offers two ways to help
    ensure your application data is stored in their data centers in an encrypted form.
    There are two options to consider for encrypting field values at rest, that is
    records physically stored on permanent storage.


    +   * Classic Encryption: Encrypted fields leverage 128-bit master keys and use
    the Advanced Encryption Standard (AES) algorithm to store values; they are displayed
    using a character mask (currently not developer definable). Such fields are packagable,
    though this only applies to Text fields.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   - Platform Encryption: Customers that have purchased the Salesforce Shield
    add-on can enable 256-bit AES encryption for certain Standard fields and Custom
    fields of their choosing. It can be applied to E-mail, Phone, Text, Text Area,
    URL, Date and Date/Time fields. While the encryption level is higher this facility
    does come with some significant restrictions, these are covered in the next section.


    Encrypted field values are visible to those who have the **View Encrypted Data**
    permission, which is a facility that may not be something your requirements tolerate.
    This also includes users whom you grant the login access to, such as through subscriber
    support. Apex, Visualforce Page, Lightning Components and Validation Rule logic
    you package can see the unencrypted values, so extra care is needed by developers
    if you want to mask field values. If your only concern is compliance with encryption
    at rest, this may not be such an issue for you.


    # # Special considerations for Platform Encryption


    Salesforce recommend that you only consider this feature if government regulations
    for your market require it. When developing a packaged solution, your main consideration
    is what happens if a subscriber wishes to enable it on a Standard field you reference
    in your solution or on one of your packaged fields.


    > > For those that do want to promote support for this feature through their AppExchange
    listing, there is an indicator that can be applied to your listing by Salesforce
    to show prospective customers that you support Platform Encryption.


    When implementing the 256-bit encryption used by Platform Encryption, Salesforce
    opted for probabilistic encryption over deterministic encryption. Since the encryption
    is not deterministic (encrypted value is the same each time), it is not possible
    to index fields that have this level of encryption applied. This results in the
    most significant of restrictions to developers and platform functionality around
    querying the field.


    Without an index, the platform cannot provide a performant way to allow code to
    filter, group or order by encrypted fields in queries. If code attempts to do
    so at runtime, an exception will occur. Your package installation may be blocked
    if it detects queries inside Apex code that would not be compatible with this
    restriction. Conversely once your package is installed and the user attempts to
    enable encryption, this action may fail. Salesforce provides a report in both
    cases to inform the user which fields are problematic.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'It is possible to work around these restrictions conditionally, by using Dynamic
    SOQL to allow runtime formation and the execution of effected queries where encryption
    is not enabled. In cases where encryption is enabled you can perform filtering,
    grouping and ordering in Apex and/or via Salesforce Object Search Language (SOSL).
    Though both these options should be considered carefully as they have their own
    restrictions and may not be the most performant. You may need to accept that you
    have to selectively hide functionality in your solution in some cases. The decision
    is something you have to make in conjunction with your users as to how acceptable
    a trade-off this would be.


    > Regardless of if you plan to support Platform Encryption or not, it may still
    be an important need for your enterprise customers where your application must
    co-exists with other Salesforce products and other Partner solutions. I would
    recommend that you prepare a statement to set expectations early on what level
    of support you provide, such as which standard fields and package fields are supported.
    Make sure your prospects can make informed decisions, otherwise they may dismiss
    your application from their shortlists unnecessarily.


    I highly recommend that you leverage the Education section in the Partner Success
    Community. Under the MORE RESOURCES section you will find a dedicated page with
    videos and other resources dedicated to ISVs.


    # Lookup options, filters, and layouts


    The standard lookup UI from Salesforce can be configured to make it easier for
    users to recognize the correct record to select, filter out those that are not
    relevant, and if necessary, prevent them from deleting records that are in use
    elsewhere in your application, all without writing any code.


    Perform the following steps in the package org to try out this process:


    +   1. Create Tabs for the Driver and Race objects.

    +   2. Add an Active checkbox field to the Driver Custom Object; ensure that the
    default is checked.

    +   3. Create a driver record, for example, Lewis Hamilton.

    +   4. From the Season record created in the previous section, create a Race record,
    for example, Spa.

    +   5. Associate Lewis Hamilton with the Spa race via the Contestants relationship.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'First, let''s ensure that drivers cannot be deleted if they are associated
    with a Contestant record (meaning they have or are taking part in a race). Edit
    the Driver field on the Contestant object and enable Don''t allow deletion of
    the lookup record that''s part of a lookup relationship. This is similar to expressing
    a referential integrity rule in other database platforms.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_77_0.png)


    Now if you try to delete Lewis Hamilton, you should receive a message as shown
    in the following screenshot. This also applies if you attempt to delete via Apex
    DML or the Salesforce API.


