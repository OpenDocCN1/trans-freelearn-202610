- pgno: 315
  md: '# # How does Lightning differ from other UI frameworks?


    So far things might feel quite familiar if you have developed in other UI frameworks
    such as Salesforce''s own Visualforce or others such as Java Server Pages (JSP)
    or ASP .NET. We have defined some markup, used CSS, and seen how we can encapsulate
    reusable portions of HTML. When the user navigates to the URL, the Lightning platform
    server side code served up the appropriate HTML to launch the specified application
    and render referenced components. If you are a Visualforce developer, you might
    be thinking that this is not all that different from the use of Visualforce Pages
    and Visualforce Components.


    While there are other similarities to other frameworks, such as the use of expressions
    for example, the biggest departure from those technologies is the lifecycle of
    the page itself. A server-side architecture often requires that the whole page
    be refreshed when the user performs an action. The information on the page, the
    state of the page, is transmitted back and forth between the client and the server
    each time the user performs an action. Server side controller code controls validations,
    loading of data and conditional display of the UI.


    Increasingly, user interface designs result in HTML pages that represent a single
    application or workspace users open and keep open. They access different modules
    and perform various operations within. This is typically known as Single-Page
    Application (SPA) architecture. The traditional server side page refresh model
    is not responsive enough to meet these needs, for example when only a portion
    of the page needs updating. Even when the traditional Asynchronous JavaScript
    and XML (AJAX) approach is deployed, often the entire state of the page needs
    transmitting back to the server side controller. Server-side UI frameworks are
    also not well-suited to developing user experiences that tolerate lack of connectivity
    in temporary offline scenarios.


    In contrast, Lightning applications are long lived in the browser and depend on
    JavaScript code to manipulate the DOM of the page to load new content and functionality.
    The state of the operation the user is performing is stored in the browser and
    only transmitted when needed by the server to retrieve and update the database.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# # Lightning architecture


    In this section, we will discuss key layers of the Lightning architecture that
    will allow you to have a better framework of understanding as you go deeper.


    A key aspect that took me by surprise at first is the need to write **client-side
    controllers** in JavaScript. This can be particularly puzzling at first if you
    are Visualforce developer, but is vital part of being a Lightning developer and
    is a reflection of its client side architecture. As we saw in the previous chapter,
    Apex server side controllers still play a part but are mainly for accessing your
    backend Apex Services and Selectors.


    In general, Lightning development is much more componentized. In terms of how
    the UI is designed and how the code is factored, the two are much more aligned,
    making it easier to maintain and navigate code. This also gives a much greater
    emphasis on separation of concerns within the UI tier.


    # # Containers


    As we saw in the previous section, we created a basic container called `myapp`
    using a standalone Lightning app. It contained a single instance of our `mycomponent`
    component. It may not have looked like much but `<aura:application>` provided
    a number of services for its components and you as the developer.


    +   • It constructed the page `<HTML>` tag and loaded appropriate JavaScript,
    CSS resources, such as SLDS and the Lightning JavaScript runtime that allows your
    components to react to user interactions through client side controller code.


    > The `extends` attribute allows for inheritance from other `<aura:application>`
    based applications. The preceding example extending the platforms `force:slds`
    application to inject the CSS for SLDS.


    +   • It loaded the components within its body, namely the `mycomponent` component,
    but also any HTML markup that is present is also injected into the page. Each
    component started its own life cycle within the container. Much like an object
    in Apex, it was constructed, initialized, tracked, and can be destroyed.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '> Component management is an important service since it helps avoid a common
    pitfall when developing rich client applications and that is resource management.
    Each HTML tag and associated data takes up memory in the browser and throughout
    the life time of the page can easily climb and cause issues if not properly managed.


    +   URL-parameters are mapped automatically to aura:attribute components specified
    in the body of the aura:application. For example:

    +   /c/myapp.app?myparam=myvalue


    ```

    <aura:application extends="force:slds">

    <aura:attribute name="myparam" type="String"/>

    <h2>The value of myparam is ''{!v.myparam}''</h2>

    </aura:application>

    ```


    Results in the following text being displayed in the browser:


    The value of myparam is ''myvalue''


    +   URL centric navigation is an important aspect of the user experience and an
    expectation when users are bookmarking or sharing links to records or certain
    pages in your web application. Since the application is designed to be long lived
    and changing the URL causes the entire page to reload, an alternative is needed.


    Modifying the bookmark portion of a URL does not reload the page. As such, Lightning
    applications leverage this to add more contexts to links stored by users, as well
    as using it during the applications own navigation.


    You can see this in action as you navigate through Lightning Experience. The framework
    provides the aura:locationChange event your client side logic can listen to determine
    when changes are made.


    Here is simple example of the URL convention used: /c/myapp.

    app#showraceresults-2016


    You can read more about the attributes of the aura:application in the Lightning
    Components Developer Guide. Not all these services may be relevant depending on
    the container you''re using. However, it is good to have a basic understanding
    of how things work even if you only ever leverage the Salesforce containers.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# # Introducing the Racing Overview Lightning app


    The Racing Overview Lightning standalone app is contained in the sample code for
    this chapter. It can be accessed through /c/RacingOverview. The following screenshot
    shows what it looks like and gives a first look at the Lightning Components we
    will be covering in more detail throughout the rest of this chapter:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_318_0.png)


    The sample record data shown in the preceding screenshot can be injected into
