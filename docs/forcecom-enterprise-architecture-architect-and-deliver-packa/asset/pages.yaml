- pgno: 111
  md: '# # Visualizing your object model


    It is an essential idea to build an Entity Relationship Diagram (ERD) of your
    object model; not only is this a good resource for you and your team, but it can
    also help your customers understand where the data that they are creating resides,
    and help them build reports and integration solutions. Salesforce provides an
    interactive tool known as Schema Builder (accessed via the button from the Objects
    page under Setup) that can help with this; it can also be used to create new objects
    and fields. At this stage in the book, the FormulaForce application data model
    should look something like this:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_111_0.png)'
  merge: -1
