    # # Skinny tables


    Internally, Salesforce stores Standard Object''s field data and custom field data
    for a given record in two separate physical Oracle tables. So, while you don''t
    see it, when you execute a SOQL query to return a mixture of both standard and
    custom fields, this internally requires an Oracle SQL query, which requires an
    internal database join to be made.


    If Salesforce Support determines that avoiding this join would speed up a given
    set of queries, they can create a skinny table. Such a table is not visible to
    the Force.com developer and is kept in sync with your object records automatically
    by the platform, including any standard or custom indexes.'
  merge: -1
  img_proc: true
- pgno: 404
  md: 'A skinny table can contain commonly used standard and custom fields that

    you, the subscriber, and Salesforce deem appropriate, all in the one Oracle table,

    thus, it avoids the join (all at the internal cost of duplicating the record data).
    If a

    SOQL, Report, or List View query utilizes the fields or a subset, the platform
    will

    automatically use the skinny table instead of the join to improve performance.
    As an

    additional benefit, the record size needed internally is smaller, which means
    that the

    data bandwidth used to move chunks of records around the platform can be better

    utilized.


    This is obviously quite an advanced feature of the platform, but worth considering
    as

    an additional means to improve query performance in a subscriber org.


    > Skinny tables are not kept in sync if you change field types or add new

    > fields to the corresponding object in the Force.com world. Also, they

    > are not replicated in sandbox environments. So, you or your subscriber

    > will need to contact Salesforce Support again each time these types of

    > changes occur. Also note that skinny tables cannot be packaged; they are

    > configurations only for subscriber orgs.


    # Handling large result sets


    In most cases within Apex, it is only possible to read up to 50,000 records, regardless

    of whether they are read individually or as part of forming an aggregate query

    result. There is, however, a context parameter that can be applied that will allow
    an

    unlimited number of records to be read. However, this context does not permit
    any

    database updates. In this section, we will review the following three ways in
    which

    you can manage large datasets:


    +   - Processing 50k maximum result sets in Apex

    +   - Processing unlimited result sets in Apex

    +   - Processing unlimited result sets via the Salesforce APIs


