- pgno: 380
  md: 'The following shows how the preceding Invocable Method appears in Process Builder:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_380_0.png)


    This method could for example be used as part of the above subscriber defined
    Process Builder process when a race ends. While you could perform this in Apex
    Trigger, this might involve some additional conditions unique to the subscriber
    of your package. Thus is this is a good use case for Process Builder and exposing
    the SeasonService.updateStandings method via an Invocable Method.


    > Check the Apex Developers guide for more information on Invocable Methods and
    the preceding attributes. There are various restrictions around the types of parameters
    that can be passed, such as the parameters must be in list form. This fits well
    with the bulkfied requirements of the Service layer.


    # Versioning Invocable Methods


    Neither Process Builder or VisualFlow record the package version that was used
    when an invocable method is referenced. Thus it is not possible to perform behavior
    versioning, the System.requestVersion returns the currently installed package
    version. The definition of the Invocable Method is controlled by the constraints
    relating to use of the global modifier as we have already discussed in this chapter.
    As a best practice avoid adding new required members (via @InvocableVariable)
    to your parameter classes.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# Alignment with Force.com extensibility features


    Here are some platform features that can help ensure your application functionality
    is open to being extended by Developer X or subscriber org administrators:


    +   - **Apex Triggers**: Developer X can write their own triggers against your
    application''s managed Custom Objects. These will execute in addition to those
    packaged. This allows Developer X to implement the defaulting of fields or custom
    validations, for example. Salesforce does not guarantee that packaged triggers
    execute before or after Developer X triggers in the subscriber org. To ensure
    that all changes are validated regardless of the trigger execution order, perform
    your validation logic in the after-phase of your packaged triggers.


    +   - **Field Sets**: As described in earlier chapters, be sure to leverage this
    feature as often as possible on your Visualforce pages to ensure that regions
    and tables can be extended with subscriber added fields. These can also be used
    with JavaScript frameworks if you''re developing a mobile UI.


    +   - **E-mail templates**: If you''re writing code to emit e-mails, consider
    providing a means to allow the text to be customized using an e-mail template.
    These can be referenced through their developer name using a custom setting. Field
    Sets can also be leveraged here to provide an easy way to include additional custom
    fields added by the subscriber administrator.


    +   - **Visualforce components**: Consider creating some Visualforce components
    globally, such that Developer X can more easily build alternative custom Visualforce
    pages without having to reinvent all aspects of your applications pages. Such
    components can be built to allow dynamic content in e-mail templates.


    +   - **Lightning components**: Consider exposing Lightning components used in
    your package for use with tools such as Lightning App Builder and Lighting Community
    builder, as we explored in the previous chapter. This can provide administrators
    and developers with a great deal of flexibility to build and customize unique
    user experiences for their business.


    +   - **Dynamic Apex type creation**: The `Type.forName` method can be used to
    create an instance of an Apex type, and from that an instance of that type at
    runtime. This capability can be used to allow Developer X to write the Apex code,
    which your application code can dynamically call at a specified time. This approach
    is discussed in further detail in the upcoming section.'
  merge: -1
  img_proc: true
- pgno: 382
  md: "# Extending the application logic with Apex interfaces\n\nAn Apex Interface\
    \ can be used to describe a point in your application logic where custom code\
    \ written by Developer X can be called. For example, in order to provide an alternative\
    \ means to calculate championship points driven by Developer X, we might expose\
    \ a global interface describing an application callout that looks like this:\n\
    \n```\n```apex\nglobal class ContestantService {\n    global interface IAwardChampionshipPoints\
    \ {\n        void calculate(List<Contestant__c> contestants);\n    }\n}\n```\n\
    ```\n\nBy querying Custom Metadata records from the Callouts custom metadata type,\
    \ which has been included in the source code for this chapter, code in the application\
    \ can determine whether Developer X has provided an implementation of this interface\
    \ to call instead of the standard calculation code.\n\nUsing Custom Metadata is\
    \ an excellent use case for this sort of requirement, since you can declare the\
    \ callouts your package supports by packaging records. Then, by making certain\
    \ fields subscriber editable you can allow the subscriber (Developer X) to configure\
    \ those callouts. This approach in contrast with Custom Settings, avoids additional\
    \ configuration and risk of misconfiguration.\n\n> Partners extending your package\
    \ can also package this configuration with their Apex class. Thus administrators\
    \ installing such partner extension packages have zero configuration to perform\
    \ to activate the callout contained within.\n\nThis screenshot shows how the Callouts\
    \ Custom Metadata Type is defined. Notice how the Apex Class and Apex Class Namespace\
    \ Prefix fields are subscriber editable:\n\n| Action | Field Label | API Name\
    \ | Data Type | Field Manageability | Indexed | Controlling Field | Modified By\
    \ |\n|---|---|---|---|---|---|---|---|\n| Edit | Del | Apex Class | f2w17__ApexClass__c\
    \ | Text(64) | Subscriber editable | | Andrew Fawcett 10/16/2019 9:29 AM |\n|\
    \ Edit | Del | Apex Class Namespace Prefix | f2w17__ApexClassNamespacePrefix__c\
    \ | Text(40) | Subscriber editable | | Andrew Fawcett 10/16/2019 9:29 AM |\n|\
    \ Edit | Del | Interface Type | f2w17__InterfaceType__c | Text(255) (Unique Case\
    \ Insensitive) | Upgradable | ✓ | Andrew Fawcett 10/16/2019 9:27 AM |"
  merge: -1
  img_proc: true
- pgno: 383
  md: "The following record is defined by you the packager developer to effectively\
    \ declare that **Award Championship Points** callout exists and can be configured.\
    \ This should also be included in your package:\n\n| Action | Label * | Callout\
    \ Name | Namespace Prefix | Interface Type | Protected Component |\n|---|---|---|---|---|---|\n\
    | Edit : Del | Award Championship Points | AwardChampionshipPoints | c2v17 | ContestantService.IAwardChampionshipPoints\
    \ | ✓ |\n\n> > Notice how the Custom Metadata Type fields supports Developer X\
    \ providing a class name that is either fully qualified (perhaps from an extension\
    \ package, for example, fforceext.SimpleCalc) or a local class (defined in the\
    \ subscriber org), for example, DeveloperXCustomCalc.\n\nThe following code is\
    \ a Selector method (see CalloutsSelector) class that reads the registered interface\
    \ implementations. It uses the Type.forName method to construct applicable Apex\
    \ types and returns a Map of Apex classes implementing each interface:\n\n```\n\
    public Map<Type, Type> selectAllCallouts() {\n    // Query custom metadata records\
    \ for callouts\n    Map<Type, Type> calloutsByInterfaceType =\n        new Map<Type,\
    \ Type>();;\n    for(Callout__mdt record :\n        Database.query(newQueryFactory().toSOQL()))\
    \ {\n        if(Callout__mdt.ApexClass__c!=null) {\n            // Namespace of\
    \ the interface is that\n            // of the custom metadata type\n        \
    \    Type interfaceType =\n                Type.forName(\n                   \
    \ record.NamespacePrefix__c + '.' + record.InterfaceType__c);\n            //\
    \ Implementing class can optionally specify\n            // the namespace if needed\n\
    \            Type implType =\n                Type.forName(record.ApexClassNamespacePrefix__c,\n\
    \                    record.ApexClass__c);\n            calloutsByInterfaceType.put(interfaceType,\
    \ implType);\n        }\n    }\n    return calloutsByInterfaceType;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 384
  md: "The following code uses a new `Application.Callout` class factory, which is\
    \ not shown here but is included in the source code of this chapter. This is a\
    \ simple class factory that uses the above `Selector` method and exposes the `newInstance`\
    \ method to provide an easy way to instantiate the classes `Developer X` has registered.\
    \ The following method in the `Contestants` Domain class now looks like this:\n\
    \n```\n```java\npublic void awardChampionshipPoints(fflib_ISOObjectUnitOfWork\
    \ uow)\n{\n    // Custom implementation configured by Developer X?\n    Object\
    \ registeredInterfaceImpl =\n    Application.Callouts.newInstance(\n    ContestantService.IAwardChampionshipPoints.class);\n\
    \    if(registeredInterfaceImpl instanceof\n    ContestantService.IAwardChampionshipPoints)\
    \ {\n    // Cast the interface to call the calculate method\n    ContestantService.IAwardChampionshipPoints\n\
    \    awardChampionshipPoints =\n    (ContestantService.IAwardChampionshipPoints)\n\
    \    registeredInterfaceImpl;\n    // Invoke the custom method from Developer\
    \ X\n    awardChampionshipPoints.calculate(Records);\n    // Mark dirty on behalf\
    \ of Developer X\n    for(Contestant__c contestant :\n    (List<Contestant__c>)\
    \ Records) {\n    uow.registerDirty(contestant);\n    }\n    return;\n    }\n\
    \    // Continue with standard implementation...\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 385
  md: "In the subscriber org or the test development org, Developer X can then implement\
    \ this interface as follows and configure the Apex Class field on the Callouts\
    \ record corresponding to the Award Championship Points callout. The next time\
    \ the award championship points service is called, this custom logic will be called\
    \ instead:\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_385_0.png)\n\nThe following\
    \ is a simple Application Callout implementation that assigns points according\
    \ to the race position rather than using the default calculation:\n\n```\npublic\
    \ class SimpleCalc\n    implements fforce.ContestantService.IAwardChampionshipPoints\n\
    {\n    public void calculate(List<fforce__Contestant__c> contestants)\n    {\n\
    \        // Very simple, points equals race position\n        for(fforce__Contestant__c\
    \ contestant : contestants)\n            contestant.fforce__ChampionshipPoints__c\
    \ =\n                contestant.fforce__RacePosition__c;\n    }\n}\n```\n\nSome\
    \ aspects to consider when exposing global Apex interfaces are as follows:\n\n\
    +   - You cannot modify global interfaces once published by uploading them within\
    \ a release managed package.\n+   - You can extend a global interface from another\
    \ global interface, for example IAwardChampionshipPointsExt extends IAwardChampionshipPoints."
  merge: -1
