- pgno: 336
  md: "When the user clicks on a race, the selected race is highlighted and a component\
    \ application event c:RaceSelected is fired. This event will later be received\
    \ by the c:RaceResults component. This event is defined as follows:\n\n```\n<aura:event\
    \ type=\"APPLICATION\"\ndescription=\"Fired when the user selects a race\" access=\"\
    global\">\n <aura:attribute name=\"raceId\" type=\"string\"/>\n <aura:attribute\
    \ name=\"raceName\" type=\"string\"/>\n</aura:event>\n```\n\nThe following component\
    \ markup uses a HTML unordered list <ul>. The list and items are styled using\
    \ SLDS to show a list of tiles as specified by the SLDS design guidelines:\n\n\
    ```\n<aura:component controller=\"RaceCalendarComponentController\" implement\
    \ s=\"flexipage:availableForAllPageTypes\" access=\"global\">\n <!-- Attributes\
    \ -->\n <aura:attribute name=\"calendar\" type=\"Object\" access=\"private\"/>\n\
