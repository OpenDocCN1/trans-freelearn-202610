- pgno: 369
  md: 'Finally, revisit the `ComplianceService` Apex class page from within your test
    development org and notice that the available versions of this class has also
    increased to include the version just uploaded. Toggle between them; you can see
    the changes that the API definition has undergone between the last two package
    releases we have just performed.


    Select **All Versions** to get a full summary of which methods arrived at which
    package version. You can see in the following screenshot that the `verify` method
    was first available in v1.8 and the `report` method in v1.9; again, your version
    numbers might differ:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_369_0.png)


    # Versioning Apex API behavior


    The API definition is not the only aspect that can undergo changes between releases.
    Even if the definition stays the same, the code behind it can change the behavior
    of the API. The Apex runtime provides a means for the packaged code to determine
    which version the calling code written by *Developer X* is expecting. This can
    be obtained by calling the `System.requestVersion` method. With this information,
    your packaged code can modify its behavior according to the expectations of the
    calling code.


    As you release more versions of your package and the functionality grows, the
    management of this type of code becomes more complex. Also note that this feature
    is only available in the code located within the packaging org or specifically
    managed code. In the standard developer org, this method will throw a runtime
    exception. This essentially rules out its use if you plan on relocating your code
    outside the packaging org, for example, by following the team development model
    discussed in the last chapter of this book.'
