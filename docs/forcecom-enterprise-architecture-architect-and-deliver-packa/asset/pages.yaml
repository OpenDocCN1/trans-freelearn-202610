- pgno: 244
  md: '# # Application Selector Layer


    Apex is a very expressive language to perform calculations and transformations
    of data entered by the user or records read from your Custom Objects. However,
    SOQL also holds within it a great deal of expressiveness to select, filter, and
    aggregate information without having to resort to Apex. SOQL is also a powerful
    way to traverse relationships (up to five levels) in one statement, which would
    otherwise leave developers on other platforms performing several queries.


    Quite often, the same or similar SOQL statements are required in different execution
    contexts and business logic scenarios throughout an application. Performing these
    queries inline as and when needed, can rapidly become a maintenance problem as
    you extend and adapt your object schema, fields, and relationships.


    This chapter introduces a new type of Apex class, the Selector, based on Martin
    Fowler''s Mapper pattern, which aims to encapsulate the SOQL query logic, making
    it easy to access, maintain, and reuse such logic throughout the application.


    The following aspects will be covered in this chapter:


    +   * Introducing the Selector layer pattern

    +   * Implementation design guidelines

    +   * The Selector class template

    +   * Implementing the standard query logic

    +   * Implementing the custom query logic

    +   * Introducing the Selector factory'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Introducing the Selector layer pattern


    The following is Martin Fowler''s definition of the Data Mapper layer on which
    the Selector layer pattern is based (http://martinfowler.com/eaaCatalog/dataMapper.html):


    > "A layer of Mappers (473) that moves data between objects and a database while
    keeping them independent of each other and the Mapper itself."


    In Martin''s definition, he is referring to objects as those resulting from the
    instantiation of classes within an OO language such as Java or Apex. Of course,
    in the Force.com world, this has a slightly ambiguous meaning, but is more commonly
    thought of as the Standard or Custom Object holding the record data.


    One of the great features of the Apex language is that it automatically injects
    object types into the language that mirror the definition of the Custom Objects
    you define. These so-called SObjects create a type-safe bond between the code
    and the database schema, though you can also leverage Dynamic Apex and Dynamic
    SOQL to change these references at runtime if needed.


    Essentially, SObjects are the native in-memory representation of the data read
    from the database. Thus, a traditional Plain Old Java Object (POJO) approach in
    Apex is not strictly required to expose the record field data. Additionally, through
    relationship fields such as Race__c.Drivers__r, related records can be accessed
    without the need for the usual POJO relationship accessor methods or properties.


    For this reason, the role of Apex classes that represent the Selector layer code
    described in this chapter is much more focused on encapsulating the application''s
    SOQL queries, promoting reuse and data consistency rather than mapping information
    from the database into memory.


    > One might consider the Domain classes as data wrappers around SObject, as they
    contain a list of SObjects. However, this is not the intent; the Domain class
    methods purely expose behavioral methods. The Records property exposes the SObject
    list so that callers can access the field data in the usual manner.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'The following diagram illustrates where Apex classes implementing the Selector
    layer fit in terms of its interaction and reuse within the Service and Domain
    layers as well as other execution contexts such as **Batch Apex**. For the most
    part, it is a layer that exists conceptually below the Service layer (under the
    Service boundary), though it can be reused from execution contexts that perform
    database queries, such as Batch Apex and Controllers.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_246_0.png)


    # # Implementing design guidelines


    The methods in the Selector classes encapsulate common SOQL queries made by the
    application, such as `selectById`, as well as more business-related methods, such
    as `selectByTeam`. This helps the developers who consume the Selector classes
    identify the correct methods to use for the business requirement and avoids replication
    of SOQL queries throughout the application.


    Each method also has some standard characteristics, such as the `SObject` fields
    selected by the queries executed, regardless of the method called. The overall
    aim is to allow the caller to focus on the record data returned and not how it
    was read from the database.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# # Naming conventions


    By now, you''re starting to get the idea about naming conventions. The Selector
    classes and methods borrow guidelines from other layers with a few tweaks. Consider
    the following naming conventions when writing the Selector code:


    +   - Class names: in naming a Selector class, it typically follows the same convention
    as a Domain class, taking the plural name of the object it is associated with
    and appending the word Selector at the end; though you can group common cross
    object queries into a single module scoped class:

    +     - Some bad examples are RaceSQLHelper and SQLHelper

    +     - Some good examples are RacesSelector, DriversSelector and RacingAnalyticsSelector


    +   - Method names: the select prefix is a good way to express the shared purpose
    of the Selector methods, followed by a description of the primary criteria and/or
    relationships used. As with the Service and Domain methods, avoid repeating terms
    already used in the class name:

    +     - Some bad examples are getRecords, getDrivers, loadDrivers, selectDriversById,
    and selectRacesAndContestants.

    +     - Some good examples are selectById, selectByTeam, selectByIdWithContestants,
    and selectByIdWithContestantsAndDrivers.


    +   - Method signatures: Selector methods typically return a Map, List, or QueryLocator
    exposing the resulting SObjects, thus supporting the bulkification needs of the
    platform and other layers such as the Domain class constructors and Batch Apex.
    Method parameters reflect the parameterized aspects of the WHERE clause; again,
    these should also be bulkified where applicable to do so:

    +     - Some bad examples are:

    +       ```

    +       selectById(Id recordId)

    +       DriverSelector.select(Set<Id>teamIds)

    +       Database.QueryLocatorqueryForBatch(Set<Id> ids)

    +       ```

    +     - Some good examples are:

    +       ```

    +       selectById(Set<Id>raceIds)

    +       selectByTeam(Set<Id>teamIds)

    +       ```'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# # Bulkification


    As you can see, based on the method naming and signature convention examples,
    as with the Service and Domain layers, it’s important to consider that in most
    cases the caller will want to honor the bulkifciation best practices. Make sure
    that the method return types and parameter types are list types—those such as
    `Set`, `List`, `Map`, `QueryLocator`, or `Iterator` can be used.


    # # Record order consistency


    Quite often, the `order by` clause is overlooked when writing SOQL queries, and
    this can lead to client/controller developers implementing this themselves. The
    default ordering of the platform is non-deterministic, though it sometimes appears
    to reflect the insert order, so the absence of an `order by` clause can often
    go unnoticed in testing. By using a Selector, you can apply a default ordering
    to all Selector methods.


    > Returning `Map<Id, SObject>` instead of `List<SObject>` might seem like a good
    way to help callers process the information. Maps in Apex have a predictable iterator
    order, however it is not clear from the documentation if this is the order in
    which items are added to the map. If you’re concerned about this, keep in mind
    the result of using the `order by` clause in the Selector might be affected if
    a Map is used. Given the ease with which maps by SObject ID are created by passing
    the list into the Map constructor, it’s often best to leave this option to wrap
    or not wrap the list returned up to the calling code.


    # # Querying fields consistently


    It is a good practice to avoid re-querying the same record(s) more than once within
    the same Apex execution if it can be avoided. Rather than repeating queries for
    the same record solely to query different fields, it becomes desirable to factor
    code such that it can pass the queried data as parameters from one method to another,
    for example from a Service method to a Domain method.


    However, this practice can become problematic as when using SOQL, the developer
    must explicitly list the fields needed at the time the statement is executed,
    typically stating only the fields needed by the most immediate code path ahead.


    Later, as the code evolves, the `SObject` data is passed between methods, particularly
    shared code. Runtime exceptions can occur if an attempt is made to read from a
    field that was not originally included in the initial SOQL. This result in the
    same code executing successfully in one scenario but failing in another, due to
    SOQL statements for the same data being inconsistently expressed.'
  merge: -1
  img_proc: true
- pgno: 249
  md: "For example, consider that the Contestants.awardChampionshipPoint Domain class\
    \ method is updated to utilize the RaceTime__c field as well as the RacePosition__c\
    \ field. This method is called from the ContestantService and RaceService classes.\
    \ Ignoring the Selector concept for a moment, the following change to ContestantService\
    \ will work just fine to meet this new requirement:\n\n```\nContestants contestants\
    \ =\n    new Contestsants(\n        [select Id, RacePosition__c, RaceTime__c\n\
    \            from Contestant__c order by RacePosition__c]);\ncontestants.awardChampionshipPoints(uow);\n\
    ```\n\nHowever, if left unchanged, the following code from the RaceService class\
    \ will cause the same method to fail with an SObject row was retrieved via SOQL\
    \ without querying the requested field: Contestant__c.RaceTime__c exception:\n\
    \n```\nList<Contestant__c> contestants = new List<Contestant__c>() ;\nfor(Race__c\
    \ race :\n    [select Id,\n        (Select RacePosition__c from Contestants__r)\n\
    \        from Race__c where Id in :ids])\ncontestants.addAll(race.Contestants__r);\n\
    new Contestants(contestants).awardChampionshipPoints(uow);\n```\n\nAlso note that\
    \ the order by clause is missing from this example, but specified in the previous\
    \ one thus, in this case the order of the records returned is non-deterministic.\
    \ These last two examples illustrate that the records passed to the shared Domain\
    \ class Contestants have the potential to vary in order by caller. This could\
    \ give rise to unexpected behavior, if the Domain class logic is dependent on\
    \ the order.\n\nThese are the two possible ways to fix these inconsistencies,\
    \ though neither is ideal:\n\n+   - Update the awardChampionshipPoints method\
    \ to have it perform its own SOQL query, and ensure that it always gets the information\
    \ it needs regardless of what was initially passed into the Domain class constructor.\
    \ While this is arguably more contained, it is wasteful in regards to SOQL queries\
    \ and performance.\n\n+   - Search for SOQL statements across the application\
    \ code and update the corresponding SOQL logic in each area (including relationship\
    \ sub selects)."
  merge: -1
  img_proc: true
- pgno: 250
  md: "Of course, ensuring that both areas have adequate unit and integration testing\
    \ also somewhat reduces the risk, but neither really helps increase the performance\
    \ or encourage SOQL reuse. One of the benefits of the Selector pattern is to encapsulate\
    \ a list of commonly used fields such that all the methods on the Selector return\
    \ sObjects populated with a consistent set of fields which can be relied on throughout\
    \ the application code, as long as the Selector is used to query the records.\n\
    \n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_250_0.png)\n\n> Querying more fields\
    \ can generally be at odds with the desire to maintain a low **heap** and/or **viewstate\
    \ size** when querying a large number of records in a single execution context,\
    \ particularly if the Selector is returning queried data for display on a Visualforce\
    \ page. In a later section of this chapter, we will see how it is possible to\
    \ use an Apex data class to represent only the field data queried.\n\n# # The\
    \ Selector class template\n\nA Selector class, like the Domain class, utilizes\
    \ inheritance to gain some standard functionality; in this case, the base class\
    \ delivered through the **FinancialForce.com Enterprise Apex Patterns** library,\
    \ `fflib_SObjectSelector`.\n\nA basic example is as follows:\n\n```\n```apex\n\
    public class RacesSelector extends fflib_SObjectSelector {\n  public List<Schema.SObjectField>\
    \ getSObjectFieldList() {\n    return new List<Schema.SObjectField> {\n      Race__c.Id,\n\
    \      Race__c.Name,\n      Race__c.Status__c,\n      Race__c.Season__c,\n   \
    \   Race__c.FastestLapBy__c,\n      Race__c.PollPositionLapTime__c,\n      Race__c.TotalDNFs__c\
    \ };\n  }\n  public Schema.SObjectTypegetSObjectType() {\n    return Race__c.SObjectType;\n\
    \  }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 251
  md: "The base class uses Dynamic SOQL to implement the features described in this\
    \ chapter. One potential disadvantage this can bring is that references to the\
    \ fields are made without the Apex compiler knowing about them, and as such, when\
    \ you attempt to delete or rename fields, no warning is given that the given field\
    \ is already referenced. To avoid this, the SObjectField reference to the field\
    \ is used, which is obtained by stating the SObject name followed by the field\
    \ name separated by a period. This is somewhat like a static property on the SObject\
    \ type. This approach ensures that the platform knows the class is referencing\
    \ the fields, even though they are being used in a dynamic SOQL context.\n\nWith\
    \ this minimal example, the following standard query can be made by leveraging\
    \ the `selectSObjectsById` base class method. This method takes the information\
    \ provided by the preceding methods and constructs a SOQL query dynamically and\
    \ executes it via `Database.executeQuery`:\n\n```\nList<Race__c> races = (List<Race__c>)\n\
    new RacesSelector().selectSObjectsById(raceIds);\n```\n\nNote that the `fflib_SObjectSelector.selectSObjectsById`\
    \ base class method performs a number of features, described later in this chapter.\
    \ Also, note that an instance of the Selector was created but was not actually\
    \ stored using an instance permits base class behavior to be inherited. Additional\
    \ benefits of using instances of Selectors are covered later in this chapter when\
    \ we discuss **Selector factories** and testing.\n\nThe preceding Selector method\
    \ example dynamically creates the following SOQL. As we progress through this\
    \ chapter, how this is done will become more clear:\n\n```\nSELECT\n Name, TotalDNFs__c,\
    \ Status__c, Season__c, Id,\n PollPositionLapTime__c, FastestLapBy__c\nFROM Race__c\n\
    WHERE id in :idSet ORDER BY Name\n```"
  merge: -1
  img_proc: true
- pgno: 252
  md: "The following table shows some of the key base class methods of the `fflib_SObjectSelector`\
    \ class available to your Selector methods and also those that can be overridden.\
    \ Note that the `getSObjectType` and `getSObjectFieldList` methods are abstract\
    \ and thus must be implemented as minimum, as per the previous example.\n\n| Method\
    \ | Modifier | Purpose |\n| :--- | :--- | :--- |\n| `getSObjectType` | abstract\
    \ | Tells the base class which SObject is being described |\n| `getSObjectFieldList`\
    \ | abstract | Returns a list of common fields used when build queries used in\
    \ this selector class |\n| `selectSObjectsById` | public | Executes a dynamically\
    \ generated SOQL query that selects the fields specified by the `getSObjectFieldList`\
    \ method. |\n| `getOrderBy` | virtual | Optionally override this to change the\
    \ default order by applied to queries generated or executed by the base class.\
    \ |\n| `getSObjectFieldSetList` | Virtual | Optionally provide a list of Field\
    \ Sets for the base class query generator to consider when generating a list of\
    \ fields to query. |\n| `newQueryFactory` | public | Provides an object orientated\
    \ means to further customize the queries generated by the base class before executing\
    \ them. |\n\nThe following sections describe these methods in further detail.\
    \ Do also take some further time to explore further methods and associated code\
    \ comments in the base class code.\n\n# # Implementing the standard query logic\n\
    \nThe previous Selector usage example required a cast of the list returned to\
    \ a list of `Race__c` objects, which is not ideal. To improve this, you can easily\
    \ add a new method to the class to provide a more specific version of the base\
    \ class method, as follows:\n\n```\n```java\npublic List<Race__c> selectById(Set<Id>raceIds)\
    \ {\n\treturn (List<Race__c>) selectSObjectsById(raceIds);\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 253
  md: "Thus, the usage code now looks like this:\n\n```\nList<Race__c> races =\n \
    \   new RacesSelector().selectById(raceIds);\n```\n\n# Standard features of the\
    \ Selector base class\n\nThe fflib_SObjectSelector base class contains additional\
    \ functionality to provide more query consistency and integration with the platform.\
    \ These apply to the aforementioned selectSObjectsById method as well as your\
    \ own. The following sections highlight each of these features.\n\n> You can,\
    \ of course, extend the standard features of this base class further. Perhaps\
    \ there is something you want all your queries to consider, a common field or\
    \ aspect to your schema design, or a feature that is common to most of your selectors.\
    \ In this case, create your own base class and have your selectors extend that,\
    \ as follows.\n\n```\npublic abstract class ApplicationSelector\n    extends fflib_SObjectSelector\n\
    {\n    // Add your common methods here\n}\npublic class RacesSelector\n    extends\
    \ ApplicationSelector\n{\n    // Methods using methods from both base classes\n\
    }\n```\n\n# Enforcing object and field security\n\nSalesforce requires developers\
    \ to implement the object read security and field level read security checks when\
    \ querying. Typically using the methods on the SObjectDescribe and SObjectFieldDescribe\
    \ Apex runtime types. The following sections describe the fflib_SObjectSelector\
    \ base class support in respect to this.\n\n# Default behavior\n\nBy default,\
    \ the base class methods in the fflib_SObjectSelector base class automatically\
    \ perform Object read security. The ability of the base class to enforce Field\
    \ level read security is also available but is not enforced by default."
  merge: -1
  img_proc: true
- pgno: 254
  md: 'In both cases, if enforcement is enabled and user object or field level read
    permissions have not been granted for the object or fields referenced in the getSObjectType
    and getSObjectFieldSetList methods, an exception will be thrown.


    # Overriding the default behavior


    You may wish to disable the aforementioned default enforcement in cases where
    objects are read by the application code on behalf of the user. For example, reading
    the race data to update other areas of the application on behalf of the user.
    Such access is often referred to as system level access. In these cases, you may
    not wish to have this check enforced.


    Allowing this enforcement check to execute in some cases may not be desirable
    since, as given in the preceding example, it then requires users to be granted
    access to the underlying race data object in order to use aspects of the application
    that read but do not display race data to the user. Another motivation for disabling
    the selector default behavior would be a preference to code these checks in your
    controller logic more explicitly.


    Constructor parameters provided by the SObjectSelector class allow each Selector
    class to control whether security enforcement is enabled or not. This is also
    available to any code instantiating a Selector class, allowing this decision to
    be made on a per use case basis, for example, when the selector is used within
    a Controller class.


    To make it easier to configure the fflib_SObjectSelector class throughout the
    application as well as to provide a means to establish a place for shared or common
    Selector logic code, a new base class can be created as follows:


    ```

    public abstract class ApplicationSelector

    extends fflib_SObjectSelector {


    public ApplicationSelector() {

    this(false);

    }


    public ApplicationSelector(Boolean includeFieldSetFields) {

    // Disable the default base class read security checking

    // in preference to explicit checking elsewhere

    this(includeFieldSetFields, false, false);

    }


    public ApplicationSelector(

    Boolean includeFieldSetFields,

    Boolean enforceCRUD,

    ```'
  merge: -1
  img_proc: true
- pgno: 255
  md: "```\nBoolean enforceFLS) {\n    // Disable sorting of selected fields to aid\
    \ debugging\n    // (performance optimisation)\n    super(\n        includeFieldSetFields,\
    \ enforceCRUD, enforceFLS, false);\n    }\n}\n```\n\nThe preceding sample also\
    \ leverages another configuration parameter of the `fflib_SObjectSelector` base\
    \ class, the `sortSelectFields` parameter. This has been added to allow disablement\
    \ of the sorting of the field names while building the SOQL queries. While this\
    \ can aid debugging, it does have a performance overhead. For backwards compatibility\
    \ the base class retains this behavior, but allows for it to be disabled optionally.\n\
    \nThus Selector classes in this application extended this class instead:\n\n```\n\
    public class RacesSelector extends ApplicationSelector {\n```\n\nNote that this\
    \ approach requires that the developer takes over exclusive responsibility for\
    \ implementing object and field level security checking themselves. This will\
    \ be discussed in further detail a later chapter.\n\n# Ordering\n\nAs mentioned\
    \ in the conventions, having a default order to records is important to avoid\
    \ the random non-deterministic behavior of the platform SOQL engine. The `selectSObjectById`\
    \ base class method calls the `getOrderBy` method to determine which field(s)\
    \ to use to order the records returned from the Selector.\n\nThe default behavior\
    \ is to use the `Name` field (if available, otherwise `CreatedByDate` is used).\
    \ As such, the previous usage is already ordering by `Name` without further coding.\
    \ If you wish to change this, override the method as follows. This example is\
    \ used by the `ContestantsSelector` class to ensure that contestants are always\
    \ queried in the order of season, race, and their race position:\n\n```\npublic\
    \ override String getOrderBy() {\n    return 'Race__r.Season__r.Name, Race__r.Name,\
    \ RacePosition__c';\n}\n```"
  merge: -1
  img_proc: true
- pgno: 256
  md: "Later in this chapter, you will see how custom Selector methods can be constructed;\
    \ these have the option of using the `getOrderBy` method. This allows some methods\
    \ to use a different `order by` clause other than the default if you wish to do\
    \ so.\n\n# Field Sets\n\nAs was discussed in a previous chapter, utilization of\
    \ the Field Sets platform feature is the key to ensuring that your application\
    \ is strongly aligned with the customization capabilities that your application's\
    \ users expect. However, you might be wondering what it has to do with querying\
    \ data? Well, even though most of our discussions around this feature will focus\
    \ on the use of it in a UI context, the additional custom fields added in the\
    \ subscriber org still need to be queried for them to be displayed; otherwise,\
    \ an exception will occur just the same as if you had failed to query a packaged\
    \ field.\n\nTo use this feature, you need to override the `getSObjectFieldSetList`\
    \ method and construct the Selector with the `includeFieldSetFields` parameter.\
    \ The default constructor sets this parameter to false so that in general, the\
    \ **Field Sets** fields are not included. The following example assumes a field\
    \ set on the **Race** object called `SeasonOverview` (included in the code of\
    \ this chapter):\n\n| Action | Field Label | API Name | Where is this used? |\n\
    | :--- | :--- | :--- | :--- |\n| Edit | Del | Season Overview | ffroce__SeasonOverview\
    \ | Used when displaying Race details on the Season overview page. |\n\nThe following\
    \ code illustrates the configuration of this feature (note that the logic in the\
    \ base class also ensures that if the subscriber adds your own packaged fields\
    \ to the Field Set, such fields are only added to the SOQL statement field list\
    \ once):\n\n```\npublic RacesSelector() {\n    super();\n}\n```\n\n```\npublic\
    \ RacesSelector(Boolean includeFieldSetFields) {\n    super(includeFieldSetFields);\n\
    }\n```\n\n```\npublic override List<Schema.FieldSet> getSObjectFieldSetList()\
    \ {\n    return new List<Schema.FieldSet>\n    { SObjectType.Race__c.FieldSets.SeasonOverview\
    \ };\n}\n```"
  merge: -1
  img_proc: true
- pgno: 257
  md: "# # Multi-Currency\n\nAs discussed in Chapter 2, Leveraging Platform Features,\
    \ enabling and referencing certain platform features can create dependencies on\
    \ your package that require your customers to also enable those features prior\
    \ to installation, and this might not always be desirable. One such feature is\
    \ Multi-Currency. Once this is enabled, every object gains a CurrencyISOCode field;\
    \ it then also appears on layouts, reports, and so on. Salesforce ensures that\
    \ subscribers are fully aware of the implications before enabling it.\n\nIf you\
    \ want to leverage it in your application (but do not think it will be something\
    \ that all your customers will require), you have the option to reference this\
    \ field using Dynamic Apex and Dynamic SOQL. It is in this latter area that the\
    \ ffLib_SObjectSelector base class provides some assistance.\n\n> You might want\
    \ to consider the approach described here when working with Personal Accounts,\
    \ as certain fields on the Account object are only present if this feature is\
    \ enabled.\n\nIf you explicitly listed the CurrencyISOCode field in your getSObjectFieldList\
    \ method, you will therefore bind your code and the package that contains it to\
    \ this platform feature. Instead, what the base class does is use the UserInfo.isMultiCurrencyOrganization\
    \ method to dynamically include this field in the SOQL query that it executes.\
    \ Note that you still need to utilize Dynamic Apex to retrieve the field value,\
    \ as shown in the following code:\n\n```\nList<Team__c> teams = (List<Team__c>)\n\
    new TeamsSelector().selectSObjectsById(teamIds);\nfor(Team__c team : teams) {\n\
    \  String teamCurrency =\n    UserInfo.isMultiCurrencyOrganization() ?\n    (String)\
