  md: "The following code represents code from a controller class utilizing StandardController\
    \ that provides support for the Visualforce page associated with a Custom Button\
    \ on the Race object. Notice how it wraps the record ID in Set, honoring the bulkified\
    \ method signature:\n\n```\npublic PageReferenceawardPoints() {\n try{\n RaceService.awardChampionshipPoints(\n\
    \ new Set<Id> {standardController.getId() }) ;\n }\n }\n\n catch (Exception e)\
    \ {\n ApexPages.addMessages(e);\n }\n return null;\n}\n```\n\nThe constructor\
    \ of these controllers is not shown, but it essentially stores StandardController\
    \ or StandardSetController in a member variable for later reference by the controller\
    \ methods.\n\nThe following code outlines a similar version that can be used when\
    \ StandardSetController is being used, in cases where a Custom Button is required\
    \ on the objects' list view:\n\n```\npublic PageReferenceawardPointsToRaces()\
    \ {\n try {\n RaceService.awardChampionshipPoints(\n new Map<Id, SObject>(\n standardSetController.getRecords()).keySet()\
    \ ) ;\n }\n\n catch (Exception e) {\n ApexPages.addMessages(e);\n }\n return null;\n\
    }\n```\n\nThe Map constructor in Apex will take a list of SObjects and automatically\
    \ build a map based on the IDs of the SObjects passed in. Combining this with\
    \ the keySet method allows for a quick way to convert the list of records contained\
    \ in StandardSetController into a list of IDs required by the service method."
