- pgno: 418
  md: "# # Performance of Batch Apex jobs\n\nAs stated previously, the platform ultimately\
    \ controls when and how long your job can take. However, there are a few tips\
    \ that you can use to improve things:\n\n+   - Getting off to a quick start: Ensure\
    \ that your start method returns as quickly as possible by leveraging indexes.\n\
    \n+   - Calibrating: Calibrate the scope size of the records passed to the execute\
    \ method. This will be a balance between the maximum number of records that can\
    \ be passed to each execute (which is currently 2000) and the governors required\
