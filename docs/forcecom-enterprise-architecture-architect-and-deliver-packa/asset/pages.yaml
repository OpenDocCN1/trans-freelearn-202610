- pgno: 469
  md: 'Note that this will both commit to the local repository and be pushed to the
    remote repository in one operation. Typically, developers would work on a set
    of changes and commit locally in increments, before deciding to push all changes
    as one operation to the remote repository.


    > If you''re not familiar with Git, this might seem a bit confusing, as you have
    already physically copied or updated files in the repository folder. However,
    in order to push to the remote Git repository stored on the GitHub servers, you
    must first update a local copy of the state of the repository held in the .git
    folder, which is a hidden folder in the root of your repository folder. You should
    never edit or view this folder as it is entirely managed by Git.


    # The Ant build script to clean and build your application


    Now that we have our initial Source Control content for the application created,
    let''s deploy it to a developer org. Before we do this, we will update the build.xml
    file to clean the org (in case it has been used to develop an earlier build of
    the application).


    Salesforce does not provide an Ant task to completely clean a developer org of
    any previously deployed or created components. However, it does provide a means
    via its Force.com Migration Toolkit to deploy what is known as a destructivePackage.xml
    file, which has a list of components to delete. Unfortunately, this needs a little
    help when there are component dependencies present in the org. FinancialForce.com
    has provided an open source solution to this via an undeploy.xml Ant script, which
    wraps this process and resolves the dependency shortcomings.


    Download the following files from the /lib folder of the FinancialForce.com repository
    (https://github.com/financialforcedev/df12-deployment-tools), and place them in
    the /lib folder created earlier, along with the ant-salesforce.jar file:


    +   - exec_anon.xml

    +   - undeploy.xml

    +   - xmltask.jar

    +   - ml-ant-http-1.1.3.jar

    +   - ant-contrib-1.0b3.jar'
  merge: -1
  img_proc: true
- pgno: 470
  md: "Next, the Ant script is updated to default by executing the existing `deploy`\
    \ target (used to deploy the sample source code from previous chapters). Then,\
    \ by importing the preceding tasks into the build file, the `undeploy` target\
    \ becomes available as a dependent target to the `deploy` target, which means\
    \ that it will be called before that target is executed. The following sample\
    \ build script highlights these changes:\n\n```\n```xml\n<project name=\"FormulaForce\"\
    \n  xmlns:sf=\"antlib.com.salesforce\" default=\"deploy\">\n  <property name=\"\
    sf.server\"\n    value=\"https://login.salesforce.com\"/>\n  <import file=\"${basedir}/lib/exec_anon.xml\"\
    />\n  <import file=\"${basedir}/lib/undeploy.xml\"/>\n\n  <target name=\"deploy\"\
    \ depends=\"undeploy\">\n    <sf:deploy\n      username=\"${sf.username}\"\n \
    \     password=\"${sf.password}\"\n      serverurl=\"${sf.server}\"\n      RunAllTests=\"\
    true\"\n      deployRoot=\"${basedir}/src\"/>\n  </target>\n</project>\n```\n\
    ```\n\nExecute the following command (all on one command line) to run the preceding\
    \ script (make sure that you use your developer org username, password, and token):\n\
    \n```\n```bash\nant\n-Dsf.username=yourdevusername\n-Dsf.password=yourdevpasswordyourdevtoken\n\
    ```\n```\n\n> It appears to output quite a lot of messages to the console due\
    \ to the complexity of the `undeploy` target being executed. After a few moments,\
    \ it will begin executing the `deploy` target. Once you receive confirmation that\
    \ the entire script is successfully complete, you can confirm that the application\
    \ has been deployed by logging into the org.\n\nOnce you're happy that the `build.xml`\
    \ file is working fine, go back to the GitHub UI application and, as before, use\
    \ the **Commit and Sync** button to commit your changes and push to the GitHub\
    \ server's remote repository.\n\nCongratulations! You have now left home (the\
    \ packaging org) and moved out into your own brand new developer org. This also\
    \ means that you can now allow other developers to start work independently on\
    \ your code base by following the same developer flow using their own developer\
    \ orgs."
  merge: -1
  img_proc: true
- pgno: 471
  md: '> Salesforce does not automatically grant access to applications, tabs, pages,
    objects, and fields deployed using the Migration Tool. So, you will find that
    before you can see these components, you need to assign your Permission Sets to
    your developer org user. Doing this is a good way to ensure that these are kept
    up to date with new components and are valid. In general, testing as a system
    administrator is not a reliable confirmation of your application working in an
    end-user scenario. This is why Salesforce has adopted this policy – to make the
    developer think about which permissions need to be applied, even in a developer
    org.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_471_0.png)


    # # Developing in developer orgs versus packaging orgs


    Now that you have moved out of the packaging org and into a developer org, you
    will no longer be developing or executing code within the associated namespace
    context that it provides. If you recall back to the chapter around execution contexts,
    remember that the debug logs from Apex code executed in the packaging org had
    two namespaces referenced: the packaging org one and the default one. While everything
    runs in this namespace implicitly in the packaging org, nothing would ever run
    in the default namespace.


    As you will have noticed, when writing the Apex code in the packaging org, you
    don''t have to prefix Custom Objects or fields with that namespace the way you
    would have to in a subscriber org where your package was installed. Instead, in
    the packaging org, this is done implicitly on the whole, which made it easier
    to export into Source Control, as the target developer org environments do not
    have the namespace assigned to them (because it can only be assigned once).


    When developing and executing code in a developer org, everything runs in the
    default namespace. Keep in mind the following differences when developing in a
    developer org:


    +   - Apex features that can help implement Application Apex APIs such as the
    @deprecated annotation and the Version class that are not supported outside of
    the packaging org and results in compilation failures in the developer org. The
    main downside here is the lack of ability to use the @deprecated attribute as
    you want to retire old Apex APIs. Behavior versioning using the Version class
    is not something I would recommend for the reasons outlined in Chapter 9, Providing
    Integration and Extensibility.'
  merge: -1
  img_proc: true
- pgno: 472
  md: "+   • Apex tests that utilize Dynamic Apex to create and populate SObject instances\
    \ and fields will need to dynamically apply the namespace prefix by autosensing,\
    \ whether the Apex test is running in a namespace context or not. The following\
    \ code snippet is a good way to determine whether the code is running in a namespace\
    \ context or not. You can place this in a test utility class:\n\n```\nDescribeSObjectResult\
    \ seasonDescribe =\n  Season__c.SObjectType.getDescribe();\nString namespace =\n\
    \  seasonDescribe.getName().\n  removeEnd(seasonDescribe.getLocalName()).\n  removeEnd('__');\n\
    ```\n\n+   • Apex tests that utilize Type.forName to create instances of Apex\
    \ classes (for example, a test written for an application plugin feature) will\
    \ also need to dynamically apply the namespace prefix to the class name given\
    \ to the plugin configuration (such as the custom metadata type featured in Chapter\
    \ 9, Providing Integration and Extensibility).\n\nLater in this chapter, we will\
    \ discuss Continuous Integration. This process will automatically perform a test\
    \ deployment and execution of Apex tests in the packaging org and thus continue\
    \ to ensure that your tests run successfully in the namespace context.\n\n# Leveraging\
    \ the Metadata API and Tooling APIs from Ant\n\nThe Migration Toolkit actually\
    \ wraps the Metadata API with some handy Ant tasks that we have been using in\
    \ the preceding Ant scripts. The toolkit itself is written in Java and complies\
    \ with the necessary interfaces and base classes that the Ant framework requires,\
    \ to allow XML elements representing the tasks to be injected into the build scripts\
    \ such as the sf:retrieve and sf:deploy tasks.\n\nWhile you can apply the same\
    \ approach as Salesforce to develop your own Ant tasks for more custom tasks relating\
    \ to your application and/or automation of common tasks during setup or deployment,\
    \ you will need to be a Java programmer to do so. As an alternative and with the\
    \ addition of a few supporting Ant tasks (those copied into your /lib folder),\
    \ you can actually call these APIs directly from the Ant scripting language."
  merge: -1
  img_proc: true
- pgno: 473
  md: "In a previous chapter, we saw how Ant macros can be written to call the Metadata\
    \ API's package install and uninstall capabilities, this was achieved without\
    \ Java code. This capability from Ant can be quite useful if you are developing\
    \ an application that extends another package, as you can easily automate installation/upgrade\
    \ of the package(s) ahead of the deployment by extending the deploy script we\
    \ ran earlier.\n\nThe open source exec_anon.xml file from FinancialForce.com imported\
    \ earlier into the build.xml file actually contains within it an Ant macro that\
    \ leverages the Tooling API's ability to call the Apex code anonymously, much\
    \ like the Force.com IDE and developer console tools offer.\n\nIn previous chapters,\
    \ we leveraged the SeasonService.createTestSeason method to create test record\
    \ data in the application's Custom Objects. Using the Ant executeApex task, this\
    \ can now be called from the Ant script in order to autocreate some useful data\
    \ in a developer org. This approach will help developers, testers, or business\
    \ analysts to easily try out or demonstrate the new features from the latest builds\
    \ with the manual data setup as follows:\n\n```\n<target name=\"deploy\" depends=\"\
    undeploy\">\n<sf:deploy\n    username=\"${sf.username}\"\n    password=\"${sf.password}\"\
    \n    serverurl=\"${sf.server}\"\n    deployRoot=\"${basedir}/src\"/>\n<executeApex\n\
    \    username=\"${sf.username}\"\n    password=\"${sf.password}\">\nSeasonService.createTestSeason();\n\
    </executeApex>\n</target>\n```"
  merge: -1
  img_proc: true
- pgno: 474
  md: '# Updating your Source Control repository


    Once the application is deployed to a developer org, you have a number of options
    and tools to choose from as you then proceed in developing on Force.com. Your
    choices impact the way in which your changes find their way back into your Source
    Control repository. Making sure that everyone in the development team is crystal
    clear on this aspect of the development workflow is not only important to their
    efficiency, but also helps prevent work being lost or rogue files finding their
    way into Source Control.


    Browser-based tools such as the Setup menu and Schema Builder provide an easier
    way of editing Custom Objects, Fields, Layouts, and Permission Sets than their
    XML-based formats. However, for other aspects of development the browser-based
    developer console is not to everyone''s liking when it comes to editing Apex and
    Visualforce code. I personally prefer a desktop tool such as Force.com IDE to
    edit these types of files.


    You can either the browser- or desktop-based approaches exclusively or in combination.
    It is important to keep in mind which approach is automatically keeping your local
    repository files in sync with the org and which is not.


    +   **Browser-based development**: Any changes that you make via the browser-based
    tools (including developer console) will remain in the developer org and will
    not automatically find their way to your local repository folder, thus, they are
    not visible to the Git tools for you to commit to Source Control.


    +   **Desktop-based development**: If you''re using a desktop tool such as Force.
    com IDE, mapped to your repository local folder location, edits you make here
    will automatically sync between your local repository folder and your developer
    org by such tools.


    +   **Browser and desktop-based development**: This option allows the developer
    to make the best use of the tools at their disposal, albeit at the cost of some
    complexity and additional consideration when it comes to gathering all the changes
    to commit to Source Control.'
  merge: -1
  img_proc: true
- pgno: 475
  md: '# Browser-based development and Source Control


    To download the changes that you have made using the browser-based development
    tools to your local repository folder, an Ant script and the Migration Toolkit
    can once again be used by applying a similar approach to that used when initially
    downloading the contents of the package from the packaging org using the sf:retrieve
    Ant task earlier.


    The following Ant script will refresh the contents of the /src folder based on
    the component types listed in the package.xml file (again you might need to add
    new component types to this file from time to time as you make use of new platform
    features):


    ```

    <target name="retrieve">

    <sf:retrieve

    username="${sf.username}"

    password="${sf.password}"

    serverurl="${sf.server}"

    retrieveTarget="${basedir}/src"

    unpackaged="${basedir}/src/package.xml"/>

    </target>

    ```


    To run the preceding target, use the following command (all on one command line):


    ```

    ant retrieve

    -Dsf.username=yourdevusername

    -Dsf.password=yourdevpasswordyourdevtoken

    ```


    Once this command completes, you can use the Git tools to review changed files,
    accepting, ignoring, or discarding (reverting back to the last committed version)
    accordingly. These are some use cases you might encounter with this approach and
    ways to handle them:


    +   • **Additional files downloaded**: Wildcards are used in the package.xml file,
    as described earlier, to make it easier to add and remove files. The downside
    is that for some components such as application and layout, you might find that
    some of the standard files for these get created in your repository folders as
    well. One solution is to drop using wildcards for these metadata types and the
    other is to leverage the .gitignore file to prevent these files from being candidates
    for commits. With the GitHub UI tool, you can right-click on these files and select
    Ignore. This will create a .gitignore file if one does not already exist and add
    the appropriate file to it. As this file is also committed into the repository,
    you only have to do this once.'
  merge: -1
  img_proc: true
- pgno: 476
  md: '+   • Differences in file content order or additional elements: Sometimes file
    changes are flagged up by the Git tools when you have not directly made modifications
    to the corresponding component in the browser tools. This can be the case after
    a platform upgrade when new features arise or an org-wide configuration change
    is made (such as switching on the Multi-Currency support), or on occasions when
    the order of the XML elements have changed, but the overall effect on the object
    is the same. If you experience these changes often and they result in a change
    that you''re happy to accept, it can be tempting to initially accept them, such
    that less false differences appear in the future. However, don''t let such browser-based
    development differences go unexplained, the root cause could be quite important!
    Use of different org types or org templates between developers can also result
    in this type of issue. Ensure that all developers are sourcing their developer
    orgs from the same sign-up page and are of the same org type.


    # # Desktop-based development and Source Control


    The key benefit with desktop-based tools and Source Control is that they allow
    you to edit Force.com source files while synchronizing with both Source Control
    and an attached Salesforce Developer Edition org. In Force.com IDE the default
    is to not to automatically upload to the attached developer org each time a file
    is saved, right click the project node in the Package Explorer and under the Force.com
    sub menu, select **Work Online**. So long as these tools are editing files from
    the local repository folder location, file edits are automatically seen by the
    Source Control system, which in our case is Git.


    +   1. Force.com IDE provides a means to easily associate Git repository folders
    with projects. Simply open Force.com IDE and select **Import...** from the **File**
    menu. Select **Projects from Git** from the import wizard list presented and click
    Next.


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_476_0.png)'
  merge: -1
  img_proc: true
- pgno: 477
  md: 'Select **Existing local repository**, if your repository is not shown, click
    **Add** and navigate to the folder used previously to download the GitHub repository.
    Finally click **Import** using the New project wizard and click **Finish**:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_477_0.png)


    Give your project a suitable name and click **Finish**. This project is now connected
    to your local Git repository. The Eclipse IDE has built-in support for Git if
    you have eGIT plugin installed, so you can choose to either use the GitHub desktop
