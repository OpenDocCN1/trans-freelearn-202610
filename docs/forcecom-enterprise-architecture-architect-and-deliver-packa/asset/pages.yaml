- pgno: 282
  md: 'In Salesforce LEX the page looks like the following screenshot:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_282_0.png)


    When in Salesforce Classic, this approach only applies to the layouts when users
    are viewing records. You can, however, provide a means for users to edit the information
    through such Visualforce pages even though they are rendered on the view page
    for the record. There is, however, no way to refresh the main page when you do
    so. While the width of the Visualforce page will adjust automatically, the height
    is fixed, so be sure to set accordingly to common data volumes. Unlike Salesforce
    Classic, users in Salesforce LEX will see embedded Visualforce pages in layouts
    when creating and editing records as well as viewing them. Ensure that your pages
    expect these scenarios in LEX, for example, the StandardController.getId method
    will return null in a record create scenario, your code should handle this accordingly.


    # Embedding a standard UI in a custom UI


    Depending on the custom UI technology you use, there are different options to
    embed the standard UI page layout. Note that when you do this, any embedded Visualforce
    pages are also included.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'For Salesforce Classic, the `apex:detail` tag can be used on a Visualforce
    page to render most of the look and feel of the standard UI; note that it is not
    automatically restyled when the page is shown in LEX. The component is not very
    granular; for example, you cannot add your own buttons alongside the standard
    buttons it renders. This means that your page buttons need to be rendered elsewhere
    on the page, making the UI look inconsistent and confusing. In addition, this
    component only renders a read-only view of the record layout. In most cases, the
    hybrid approach described earlier in the chapter provides a better solution to
    most requirements like this.


    For Salesforce LEX, the `force:recordEdit` and `force:recordView` components support
    both record editing and viewing within custom UIs built using Lightning Components.
    In contrast to the `apex:detail` component in Visualforce, action buttons are
    not rendered. The developer is responsible for informing the component when to
    save the details by firing the `recordSave` **Lightning Event**. The component
    responds with the `onSaveSuccess` event when the record is saved successfully.


    # ## Extending the Salesforce standard UIs


    The previous sections described a way to embed custom UIs within the standard
    UIs as a means of extending the Salesforce UIs with your own application functionality.
    The following sections outline the further options available in Salesforce Classic
    and LEX respectively. Some features exist in both, others have been re-envisioned
    in LEX through the ability to embed and invoke Lightning Components from different
    areas.


    # ## Visualforce Pages


    Visualforce is not only a powerful way to create entirely new pages for your application,
    but also augments the Salesforce user interface in multiple places. As we’ve seen
    so far, you can use it to extend the standard UI layouts and Custom Buttons. Here
    is a list of platform areas that accept Visualforce pages:


    +   - Layout sections

    +   - Custom Buttons

    +   - Custom Tabs

    +   - Custom Tab Splash page

    +   - Chatter Custom Publisher Actions

    +   - Sidebar component

    +   - Dashboard component

    +   - Force.com sites'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'Profiles and Permission Sets also reference Visualforce pages; users must be
    given access to a page before they can use it from these areas.


    # # Lightning Components


    The following is a list of platform areas that accept Lightning Components:


    +   - Record Pages

    +   - Home Pages

    +   - Lightning Tabs and Pages

    +   - Lightning Component Actions

    +   - Lightning Experience Utility Bar

    +   - Lightning App Builder

    +   - Lightning Community and Community Builder

    +   - Lightning Out for Visualforce

    +   - Lightning Out for Any App


    In Chapter 6, Application Domain Layer, we explored adding the Verify Compliance
    Lightning Component to Record Pages. In the next chapter, we will build some new
    Lightning Components to allow us to take a closer look at some of the other areas
    in the preceding list. You should also refer to the Lightning Developer Guide
    for full details.


    # # Generating downloadable content


    The contentType attribute allows you to control how the browser interprets the
    page output. With this attribute, you can, for example, output some CSV, JSON,
    or XML content. Using a controller binding, this can be dynamically generated
    output. This can be useful to generate content to download. The following changes
    have been made to the FormulaForce application and are included in the code for
    this chapter:


    +   - Added a new method, generateSummaryAsCSV, to RaceService

    +   - Added a new getCSVContent method to RaceSummaryController

    +   - Added a new racesummary.aspx Visualforce page

    +   - Added a new Custom Button, Download Summary, to the Race layout'
  merge: -1
  img_proc: true
- pgno: 285
  md: "The new method is added to the existing RaceSummaryController class, but is\
    \ only used by the new page. Feel free to review the new Service method; note\
    \ that it also uses the ContestantsSelector.selectByRaceIdWithContestantSummary\
    \ method introduced in the previous chapter. Here is the new controller method\
    \ calling it:\n\n```\npublic String getCSVContent() {\n    return RaceService.generateSummaryAsCSV(\n\
    \        new Set<Id> { standardController.getId() } );\n}\n```\n\n> The RaceService\
    \ class contains the logic to generate the CSV file and not the controller class.\
    \ Although at first you might consider this controller logic, if you think about\
    \ it from a general data export perspective, there could equally be an API requirement\
    \ in the future for external developers wanting to automate the CSV export process;\
    \ thus, placing this logic in the Service layer facilitates this.\n\nThe new Visualforce\
    \ page utilizes the contentType attribute as follows:\n\n```\n<apex:page\n   \
    \ standardController=\"Race__c\"\n    extensions=\"RaceSummaryController\"\n \
    \   contentType=\"application/csv#{!Race__c.Name} Race Summary\">{!CSVContent}\n\
    </apex:page>\n```\n\nAs this page uses a Standard Controller, a Custom Button\
    \ can be created; once it has been clicked, instead of the page opening, the browser\
    \ prompts you to download the file:\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_285_0.png)\n\
    \nPressing the Download Summary button results in the following prompt to download\
    \ the resulting CSV file:\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_285_1.png)"
