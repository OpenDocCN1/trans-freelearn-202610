- pgno: 464
  md: '+   • Force.com IDE: The Force.com IDE is an open source project run by Salesforce.
    It gets regular updates and improvements, such as support for developing Lightning
    Components and the only interactive Apex Debugger (talk to your Salesforce contact
    for access). For more information and download instructions visit https://developer.salesforce.com/page/
    Force.com_ IDE.


    # # Populating your Source Control repository


    A key decision when populating your Source Control repository is the folder structure.


    The following table shows one structure that you might want to consider:


    | Folder | Purpose |

    | :--- | :--- |

    | / | Keep the content of the root as clean as possible, and typically, the only
    file here will be the Ant build.xml file. You might also have a README.md file,
    which is a common Git convention to provide important usage and documentation
    links. This is a simple text file that uses a simple notation syntax (known as
    MarkDown) to represent sections, bold, italics, and so on. |

    | /lib | This folder contains any binary, configuration, or script files that
    represent build tools and dependencies needed to run the Ant build script, typically
    placed in the root. This is an optional folder but is used in this chapter to
    store the ant-salesforce.jar file, as opposed to having developers install it.
    |

    | /src | This folder contains Force.com source files, structured in alignment
    with the folder structure returned by the Ant sf:retrieve task and expected by
    IDEs such as Force.com IDE. |

    | /source (alternative) | Note that if your application contains other Source
    Control artifacts from other platforms, you might want to consider having a more
    general /source folder, permitting paths such as /source/salesforce/src and then
    /source/heroku. |


    If you want to follow through the steps in this chapter, follow on from the source
    code as contained within the chapter-12 branch. If you would rather review the
    end result, skip to the chapter-13 branch in the sample code repository to review
    the build.xml and package.xml files.'
  merge: -1
  img_proc: true
- pgno: 465
  md: 'Perform the following steps to create the new repository and clone it, in order
