- pgno: 263
  md: "# A custom Selector method with a custom data set\n\nSOQL has a very rich dot\
    \ notation to traverse relationship (lookup) fields to access other fields on\
    \ related records within a single query. To obtain the following information in\
    \ a tabular form, it needs to traverse up and down the relationships across many\
    \ of the objects in the FormulaForce application object schema:\n\n+   - The season\
    \ name\n+   - The race name\n+   - The race position\n+   - The driver's name\n\
    +   - The car name\n\nFirst, let's consider the following SOQL and then look at\
    \ how it and the data it returns can be encapsulated in a ContestantsSelector\
    \ class method. Note that the common order by clause is also applied here as was\
    \ the case in the previous example:\n\n```\nselect\n    Race__r.Season__r.Name,\n\
    \    Race__r.Name,RacePosition__c,\n    Driver__r.Name,\n    Driver__r.Team__r.Name,\n\
    \    Car__r.Name\nfrom\n    Contestant__c\nwhere\n    Race__c in :raceIds\norder\
    \ by\n    Race__r.Season__r.Name, Race__r.Name, RacePosition__c\n```\n\nThis query\
    \ will result in partially populated Contestant__c objects, not only that, but\
    \ relationship fields will also expose partially populated Season__c, Car__c,\
    \ and Driver__c records. Thus, these are highly specialized instances of records\
    \ to simply return into the calling code path."
  merge: -1
  img_proc: true
- pgno: 264
  md: "The following code shows an alternative to the preceding query, using a new\
    \ ContestantsSelector method. The biggest difference from the previous ones is\
    \ that it returns a custom Apex data type and not the Contestant__c object. You\
    \ can also see that it's much easier to see what information is available and\
    \ what is not:\n\n```\nList<ContestantsSelector.Summary> summaries =\n    new\
    \ ContestantsSelector().\n    selectByRaceIdWithContestantSummary(raceIds).values();\n\
    for (ContestantsSelector.Summary summary : summaries) {\n    System.debug(\n \
    \       summary.Season + ' ' +\n        summary.Race + ' ' +\n        summary.Position\
    \ + ' ' +\n        summary.Driver + ' ' +\n        summary.Team + ' ' +\n    \
    \    summary.Car);\n}\n```\n\nDepending on your data, this would output something\
    \ like the following debug:\n\n```\nUSER_DEBUG|[26]|DEBUG|2016 Spa 1 Lewis Hamilton\
    \ Mercedes MP4-29\nUSER_DEBUG|[26]|DEBUG|2016 Spa 2 Rubens Barrichello Williams\
    \ FW36\n```\n\nThe Selector method returns a new Apex inner class that uses Apex\
    \ properties to explicitly expose only the field information queried, thus creating\
    \ a clearer contract between the Selector method and the caller.\n\nIt is now\
    \ not possible to reference the information that has not been queried and would\
    \ result in runtime errors when code attempts to reference fields that are not\
    \ queried. The following shows an Apex inner class that the Selector uses to explicitly\
    \ expose only the information queried by a custom Selector method:\n\n```\npublic\
    \ class Summary {\n    private Contestant__c contestant;\n    public String Season\
    \ {\n        get { return contestant.Race__r.Season__r.Name; } }\n    public String\
    \ Race {\n        get { return contestant.Race__r.Name; } }\n    public Decimal\
    \ Position {\n        get { return contestant.RacePosition__c; } }\n    public\
    \ String Driver {\n        get { return contestant.Driver__r.Name; } }\n    public\
    \ String Team {\n        get { return contestant.Driver__r.Team__r.Name; } }\n\
    \    public String Car {\n        get { return contestant.Car__r.Name; } }\n}\n\
    ```"
