- pgno: 6
  md: '# # Foreword


    As a Developer Evangelist for Salesforce.com, I''ve seen an ever-widening demand
    for the exact kind of material that Andrew brings to the table with this book.
    While I often get the joy of showing developers new features that are rolling
    out on Force. com, I am often also asked questions about daily challenges when
    it comes to leveraging those features and implementing solutions within the ecosystem
    required by enterprise developer teams. This book will go a long way in providing
    new reference material specifically for those concerns.


    In 2007, I started developing at Salesforce.com, and the landscape looked quite
    different than it is today. There was no Visualforce. Apex had just launched and
    lacked many of the interfaces it enjoys now, such as batchable and schedulable.
    Most custom interfaces were accomplished through extensive amounts of JavaScript
    embedded in S-Controls, which is a portion of the platform that is no longer supported.
    Communicating back to the platform could be done via the SOAP API using the AJAX
    toolkit. If you wanted truly fine-tuned business logic on the server side, you
    exposed it via a custom SOAP endpoint in Apex.


    In 2014, the capabilities of the platform completely eclipse those days. With
    Standard Controllers, Visualforce provides basic business logic out of the box,
    without additional code required. For custom processing, a developer is not limited
    to just a single option, but various routes ranging from extending Visualforce''s
    components library to exposing Apex methods directly to JavaScript—providing the
    flexibility from the old AJAX toolkit without ever needing to access the scope
    of the platform APIs. Apex can be scheduled, it can churn through records in the
    background, and it can be used to create completely custom REST endpoints. Developers
    now have access to powerful new APIs such as Streaming and Analytics as well as
    industrial strength identity services.


    The platform continues to evolve. At Dreamforce, each year, we announce new tools,
    features, and functionality to the platform. Last year was Salesforce1 with a
    new mobile application that would make deploying interfaces to smartphones a simple
    and integrated process. This coming October, we will deliver new industry-changing
    innovations.'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'This pace of technical evolution combined with an ever increasing adoption
    of Force.com for enterprise applications poses a specific challenge for developers:
    to continually think of the platform not as just a solution for various use cases,
    but as a complete ecosystem that uses the platform efficiently. It is no longer
    sufficient to consider that a given application simply works on the platform;
    developers need to consider whether their applications are being designed in a
    way that leverages the correct features and that will co-exist efficiently and
    well. It takes the ability to view how the platform is being limited from a high
    level and with a clear direction.


    I knew Andrew was the kind of architect with such an ability when we started discussing
    a new set of articles he was writing based on Martin Fowler''s Separation of Concerns
    and how such design patterns could be used to develop Apex for enterprise solutions.
    Seven years ago, thinking about Apex in such layers of abstraction was certainly
    possible—it just wasn''t really necessary. With all the potential tools and features
    in the hands of a Force.com developer now, not considering such concepts is begging
    for maintenance debt down the road.


    Andrew being in a position to write this book should be a surprise to nobody familiar
    with his company''s work. FinancialForce.com has created some of the most robust
    applications I''ve seen on Force.com, and as Chief Technical Officer, Andrew has
    been at the forefront of making them successful.


    Hence, I''m delighted to see Andrew writing this book, and that at its core, we
    can see an expanded version of his previous design pattern articles. Actually,
    simply a printed copy of those articles would not be a bad addition to an architect''s
    library, but here, we also see a more complete vision of what a developer should
    know before building applications on the platform that levels off from higher
    order considerations like interfacing Apex classes together down to the concrete
    tasks of properly leveraging Source Control software for Force.com.


    I''m excited to see this book on my shelf, and hopefully yours—it will help you
    map out not only this generation of Force.com applications, but to move forward
    with future ones as well.


    Joshua Birk


    Salesforce Developer Evangelist'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# About the Author


    **Andrew Fawcett** has over 25 years of experience, holding several software development-related
    roles with increasing focus and responsibility around enterprise-level product
    architectures with major international accounting and ERP software vendors over
    the years. He is experienced in performing and managing all aspects of the software
    development life cycle across various technology platforms, frameworks, industry
    design patterns, and methodologies, more recently Salesforce''s Force.com and
    Heroku.


    He is currently a CTO, Salesforce MVP, and Salesforce Certified Advanced Developer
    within a UNIT4 and Salesforce.com funded startup, FinancialForce.com. He is responsible
    for driving platform adoption, relationship, and technical strategy across the
    product suite. He is an avid blogger, open source contributor and project owner,
    and an experienced speaker at various Salesforce and FinancialForce.com events.


    He loves watching movies and Formula1 motor racing and building cloud-controlled
    Lego robots! You can find him on Twitter at @andyinthecloud, and his Lego robot
    Twitter handle and website is @brickinthecloud.


    You can visit his LinkedIn profile at https://www.linkedin.com/in/andyfawcett
    and his website at https://andyinthecloud.com/.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Acknowledgements


    Firstly, I would like to thank my wife, Sarah, for supporting me in writing this
    book, giving up our weekends, and encouraging me. Also, the endless supply of
    tea and biscuits when needed!


    I''d like to acknowledge the Salesforce community for their excellent contributions,
    feedback, and encouragement in respect to the many open source frameworks used
    in this book. Thank you, one and all, and keep it up!


    Lastly I''d like to acknowledge FinancialForce.com for its commitment to the Salesforce
    community by sharing code through its public GitHub repositories, many of which
    are featured and leveraged in this book. Open source is nothing without contributors;
    these repositories continue to benefit from contributions made both in the past
    and present by developers both internal and external to FinancialForce.com. So
    I also want to say a big thank you to those contributors!'
  merge: -1
