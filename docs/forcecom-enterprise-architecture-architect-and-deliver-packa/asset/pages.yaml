    methods.


    # The Unit Of Work scope


    To make the most effective use of the Unit Of Work''s ability to coordinate database
    updates and transaction management, maintain a single instance of the Unit Of
    Work within the scope of the Service method, as illustrated in the previous section.


    If you need to call other classes that also perform database work, be sure to
    pass the same Unit Of Work instance to them, rather than allowing them to create
    their own instance. We will explore this a little later in this chapter.


    > It may be tempting to maintain a static instance of Unit Of Work so that you
    can refer to it easily without having to pass it around. The downside of this
    approach is that the scope becomes broader than the service layer execution scope
    as Apex can be invoked within an execution context multiple times. Code registering
    records with a static execution scope Unit Of Work depending on an outer Apex
    code unit committing the work. It also gives a false impression that the Unit
    Of Work is useable after a commit has been performed.'
