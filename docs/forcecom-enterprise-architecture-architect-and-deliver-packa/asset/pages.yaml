    \ client logic, it can be an advantage to decouple these two streams of development\
    \ activity so that developers can continue in parallel, meeting up sometime in\
    \ the future to combine efforts.\n\nAn approach to this is sometimes referred\
    \ to as Contract Driven Development. This is where there is an agreement on a\
    \ contract (or service definition) between the two development streams before\
    \ they start their respective developments. Naturally, the contract can be adjusted\
    \ over time, but having a solid starting point will lead to a smoother parallel\
    \ development activity.\n\nThis type of development can be applied by implementing\
    \ a small factory pattern within the Service layer class. The main methods on\
    \ the service class are defined as normal, but their internal implementation can\
    \ be routed to respective inner classes to provide an initial dummy implementation\
    \ of the service, which is active for the client developers, for example, and\
    \ another production implementation, which can be worked on independently by the\
    \ service developers.\n\n> Because the static Service methods actually exposed\
    \ to callers don't expose this factory implementation, it can easily be removed\
    \ later in the development cycle.\n\nTake for example a requirement in the FormulaForce\
    \ application to provide a Visualforce page to preview the final finishing positions\
    \ of the drivers once the race is complete (known as the provisional positions).\
    \ Development needs to start on the user interface for this feature as soon as\
    \ possible, but the Service layer code has not been written yet. The client and\
    \ Service layer developers sit down and agree what is needed, and define the skeleton\
    \ methods in the Service layer together.\n\nThe first thing they do within the\
    \ service class is to create an Apex interface that describes the service methods,\
    \ which is the contract. The methods on this interface follow the same design\
    \ guidelines as described earlier in this chapter."
  merge: -1
  img_proc: true
