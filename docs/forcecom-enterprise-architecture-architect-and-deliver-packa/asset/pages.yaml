    for (Contestant__c contestant :\n    Database.query(contestantQueryFactory.toSOQL()))\
    \ {\n```\n\n# SOSL and Aggregate SOQL queries\n\nSOQL is not the only way to query\
    \ information from the database. Force.com also provides a power Salesforce Object\
    \ Search Language (SOSL) facility. Like SOQL, this returns SObjects. While this\
    \ chapter has not covered this variation in depth, the use of Selector methods\
    \ encapsulating SOSL is appropriate and in fact provides a good abstract from\
    \ the caller, allowing the developer of the Selector to use SOQL or SOSL in future\
    \ without impacting the callers.\n\nLikewise, Aggregate SOQL queries are also\
    \ good candidates to encapsulate in Selector methods. However, in these cases,\
    \ consider using Apex native data types (for example, a list of values) or lists\
    \ of custom Apex data types to expose the aggregate information.\n\n![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_267_0.png)\n\
