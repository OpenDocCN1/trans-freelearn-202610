- pgno: 258
  md: "For Domain logic, you might want to put a common method in your own Domain\
    \ base class (such as the ApplicationDomain class described in the last chapter).\
    \ This way, you can encapsulate the preceding turnery operation into a single\
    \ method. The sample code for this chapter contains the ApplicationDomain.getCurrencyCodes\
    \ method, which can be used as follows:\n\n```\npublic override onBeforeInsert()\
    \ {\n    Map<Id, String> currencies = getCurrencyCodes();\n    for(Team__c team\
    \ : (List<Team__c>) Records) {\n        String teamCurrency = currencies.get(team.Id);\n\
    \    }\n}\n```\n\n# # Implementing custom query logic\n\nIf we take a look at\
    \ the implementation of the selectSObjectById base class method we have been using\
    \ so far in this chapter, the buildQuerySObjectById method code shown as following,\
    \ gives an indication of how we implement custom Selector methods; it also highlights\
    \ the newQueryFactory base class method usage:\n\n```\npublic List<SObject> selectsObjectsById(Set<Id>\
    \ idSet) {\n    return Database.query(buildQuerySObjectById());\n}\nprivate String\
    \ buildQuerySObjectById() {\n    return newQueryFactory().\n        setCondition('id\
    \ in :idSet').\n        toSOQL();\n}\n```\n\nThe newQueryFactory method exposes\
    \ an alternative object orientated way to express a SOQL query. It follows the\
    \ fluent design model with its methods making the configuration less verbose.\
    \ For more information on this approach see https://en.wikipedia.org/wiki/Fluent_interface.\n\
    \nThe instance of fflib_QueryFactory returned by this method is preconfigured\
    \ with the object, fields, order by and any field set fields expressed through\
    \ the selector methods discussed previously. As described earlier it will also\
    \ enforce security enabled. So in general all you need to do is provide an SOQL\
    \ where clause via the setCondition method, as shown in the last code. Finally,\
    \ the toSOQL method returns the actual SOQL query string that is passed to the\
    \ standard Database.query method."
  merge: -1
  img_proc: true
- pgno: 259
  md: "> The fflib_QueryFactory class methods provide an alternative to\n> using the\
    \ standard string concatenation or String.format approaches\n> when building dynamic\
    \ SOQL queries. The original author of the\n> fflib_QueryFactory class, Chris\
    \ Peterson, was motivated in creating\n> it to avoid the fragility that string-based\
    \ methods can give as well as to\n> provide a more readable means of understanding\
    \ what such code was\n> doing. In addition because the class supports using SObjectField\n\
    > references, as opposed to field name references in strings, such code is\n>\
    \ less prone to SOQL-injection vulnerabilities.\n\n# # A basic custom Selector\
    \ method\n\nLet's look first at a basic example, which queries Driver__c based\
    \ on the team they\nare assigned to. As per the guidelines, the parameters are\
    \ bulkified and allow you to\nquery for drivers across multiple teams if needed.\n\
    \n```\npublic List<Driver__c> selectByTeam(Set<Id> teamIds) {\n    return (List<Driver__c>)\n\
    \    Database.query(\n    newQueryFactory().\n    setCondition('Team__c in :teamIds').\n\
    \    toSOQL();\n    }\n```\n\nBy using the newQueryFactory method, the fflib_QueryFactory\
    \ instance is\nalready populated with knowledge of the field list, object name,\
    \ and order by clause\nspecified by the selector. Thus this Selector method behaves\
    \ consistently in terms of\nthe fields populated and the order of the records\
    \ returned.\n\n# # A custom Selector method with subselect\n\nIn the following\
    \ example, the querying being made uses a sub-select to also include\nchild records\
    \ (in this case, Contestants within Race). The key thing here is that the\nRacesSelector\
    \ method (shown in the following code) reuses an instance of the\nContestantsSelector\
    \ class to access its field list and perform security checking:\n\n```\npublic\
    \ List<Race__c> selectByIdWithContestants(Set<Id> raceIds) {\n    fflib_QueryFactory\
    \ racesQueryFactory = newQueryFactory();\n    fflib_QueryFactory contestantsSubQueryFactory\
    \ =\n    new ContestantsSelector().\n    addQueryFactorySubselect(racesQueryFactory);\n\
    \    return (List<Race__c>) Database.query(\n```"
  merge: -1
  img_proc: true
- pgno: 260
  md: "```\nracesQueryFactory.setCondition('Id in :raceIds').toSOQL();\n}\n```\n\n\
    The preceding code uses the fflib_SObjectSelector method addQueryFactorySubselect.\
    \ This method creates a new fflib_QueryFactory instance and passes it on to the\
    \ query factory passed into the method, in this case, the racesQueryFactory. When\
    \ the toSOQL method is called on the outer query factory it automatically generates\
    \ sub-queries for any contained query factories.\n\nBy reusing an instance of\
    \ the ContestantsSelector, it is ensured that no matter how a list of Contestant__c\
    \ records are queried (directly or as part of a sub-select query), the fields\
    \ are populated consistently. The getOrderBy method on ContestantSelector is also\
    \ used to ensure that even though the records are being returned as part of a\
    \ sub-select, the default ordering of Contestant records is also maintained.\n\
    \nLet's take another look at the example used earlier to illustrate how this pattern\
    \ has avoided the dangers of inconsistent querying. Although the Contestant__c\
    \ records are queried from two different selectors, RacesSelector and ContestantsSelector,\
    \ the result in terms of fields populated is the same due to the reuse of the\
    \ ContestantsSelector class in the preceding implementation.\n\nThe following\
    \ example shows the standard selectById method being used to query Contestants\
    \ to pass to the Contestants Domain class constructor, as part of the Service\
    \ layer implementation to award championship points:\n\n```\nList<Contestant__c>\
    \ contestants =\n    new ContestantsSelector().selectById(contestantIds);\nnew\
    \ Contestants(contestants).awardChampionshipPoints(uow);\n```\n\nThe following\
    \ alternative example shows the custom selectByIdWithContestants method on RaceSelector\
    \ being used to query Races and Contestants to pass to the Contestants Domain\
    \ class constructor to achieve the same result:\n\n```\nList<Contestant__c> contestants\
    \ = new List<Contestant__c>();\nfor(Race__c race :\n    new RacesSelector().selectByIdWithContestants(raceIds))\
    \ {\n    contestants.addAll(race.Contestants__r);\n}\nnew Contestants(contestants).awardChampionshipPoints(uow);\n\
    ```\n\nIn either of these two examples, the fields and ordering of the records\
    \ are consistent, despite the way in which they have been queried, either as a\
    \ direct query or sub-select. This gives the developer more confidence in using\
    \ the most optimum approach to query the records needed at the time."
