  md: '# Next create the mock implementations that you need:


    ```

    // Given

    Dashboard mockDashboard =

    (Dashboard) mocks.factory(Dashboard.class);

    Engine mockEngine =

    (Engine) mocks.factory(Engine.class);

    ```


    The following code replaces the need for you to write mock methods that return
    test values during the execution of code being tested. In ApexMock terms this
    configuration code is known as a **stubbing** code. You must surround stubbing
    code in startStubbing and stopStubbing method calls as shown here:


    ```

    mocks.startStubbing();

    mocks.when(mockEngine.isRunning()).thenReturn(true);

    mocks.stopStubbing();

    ```


    > The syntax gets a little tricky to understand at this stage, but you will get
    used to it, I promise! As I stated earlier, much of the inspiration for the ApexMocks
    API is taken from the Java Mockito library. So much so that articles and documentation
    around the Internet should also aid you in learning the API, as well as the documentation
    provided on the GitHub repo.


    Your eyes are not deceiving you; the preceding code is calling the method you''re
    attempting to mock a response for. First of all, this is a compile time reference,
    so it is much safer than a late bound string reference we used when using the
    Apex Stub API raw.


    Secondly, because the mockEngine points to a dynamically generated stub, it is
    not calling the real implementation of this method. Instead it is registering
    in the framework that the next method call, thenReturn, should store the given
    value as a response to this method. This will be given back at a later point in
    the test when that mocked method is called again, this time in the test case context.
    In this case when the Car.isRunning method calls engine.isRunning (refer to the
    Car code if you need to refresh your memory as to what the implementation does)
    it returns the value true.


    The next part of the unit test, the actual code being tested, is more familiar:


    ```

    // When

    Car car = new Car(mockEngine, mockDashboard);

    car.start();

    ```'
