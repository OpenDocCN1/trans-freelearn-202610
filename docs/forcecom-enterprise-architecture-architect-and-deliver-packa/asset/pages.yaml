- pgno: 324
  md: "The $A variable used in the preceding code provides access to Lightning JavaScript\
    \ API.\n\n# ## Component CSS (.css)\n\nWhen styling your component, you should\
    \ leverage the designs and CSS provided by the Lightning Design System, as shown\
    \ in the mycomponent example earlier. This will ensure your UI continues to stay\
    \ in line with the Salesforce containers it resides in, as well as, any further\
    \ advancement in respect to supporting new devices and layout types.\n\n> Using\
    \ Salesforce base components from the lightning namespace, such as lightning:button,\
    \ lightning:input and lightning:tabSet automatically ensures you are using SLDS.\n\
    \nHowever, if you do need to define your own styles, do so via custom CSS classes\
    \ added to the components .css file. The framework will ensure that these will\
    \ be encapsulated within the component and will not affect other components on\
    \ the page.\n\n> You should not attempt to modify the .style attribute of the\
    \ element. If you need to control this you may need to implement a Component Render.\
    \ The framework provides $A.util.addClass and $A.util.removeClass methods to dynamically\
    \ manipulate the style of your components markup safely.\n\nThe THIS identifier\
    \ in component CSS must be used to scope the CSS to your component. The following\
    \ example is used in the **Race Calendar** component to highlight a race when\
    \ the user clicks on it:\n\n```\n.THIS .selectedRace{\n    background-color:token(colorBackgroundHighlight);\n\
    }\n```\n\nThe corresponding component markup uses a conditional expression to\
    \ apply the CSS class (in addition to the SLDS styles). The controller method\
    \ simply updates the value of the .Selected property from the race binding:\n\n\
    ```\n<li class=\"{!'slds-item ' + (race.Selected ? 'selectedRace' : '')}\" onclick=\"\
    {!c.onRaceClicked}\">\n```"
  merge: -1
  img_proc: true
- pgno: 325
  md: 'Tokens are a feature of the Lightning framework that allows you to reuse colors
    and font values expressed by Salesforce in your own styles. The preceding example
    reuses a token from SLDS that defines what color a selected item is. To include
    the standard SLDS tokens for use in your components you must create an `aura:tokens`
    Lightning Bundle, called `defaultTokens`. This has already been included in the
    sample code for this chapter. In this you can also define your own tokens via
    the `aura:token` element.


    # Component Render (...Renderer.js)


    In most cases utilizing the component markup, attributes and bindings to manipulate
    the appearance of the component is the intended way in which to develop your components.
    You are also discouraged from manipulating the DOM within your helper or controller
    methods, as the framework will overwrite the changes when it responds to attribute
    changes. However, in some cases, for example when using a third party JavaScript
    library you may wish to take control of the DOM directly. In these cases, utilize
    a component renderer. Consult the *Lightning Components Developer Guide* for more
    information on this facility.


    # Component Design (.design) and Component SVG (.svg)


    These XML based files allow you to customize the appearance of your component
    when exposing it through the **Lightning App Builder** and **Lightning Community
    Builder** tools, such as configuring the icon used to identify it in the sidebar,
    allowing your users to use these drag and drop tools to configure Salesforce UIs
    with the introduction of your packaged components. See *Making components customizable*
    later in this chapter for further discussion and examples of this capability.


    # Component Documentation (.auradoc)


    Lightning provides its own documentation framework that is built dynamically based
    on the components in the org, including those from Salesforce. If you plan to
    allow other developers to use your packaged components, you can use this file
    to place documentation that describes the purpose and features of the component.


    You should also leverage the `description` attribute available on `aura:component`,
    `aura:attribute`, `aura:method`, `aura:event`, `aura:interface` and `aura:registerEvent`.'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'Developers can access documentation expressed this way via the URL,

    https://<myDomain>.lightning.force.com/auradocs/reference.app. See

    Making components customizable later in this chapter for an example and more

    discussion on how to expose your components for use outside your package.


    # Enforcing encapsulation and security at runtime


    JavaScript code on a page can traverse the entire page content via the HTML

    DOM API and obtain information or modify other aspects of the page. This breaks

    encapsulation at runtime and also breaks security best practices for container

    architectures such as Lightning. Imagine as an admin you installed a component
    that

    you placed on your Home page and it obtained important data and transmitted it

    back to another server.


    While it is unlikely such a component would pass through the Salesforce Security

    Review and onto AppExchange. There is another reason why in Lightning this type
    of

    component is not permitted. Lightning Locker Service, a service designed to physically

    block this type of logic from executing at runtime, either intentionally or unintentionally

    has been created by Salesforce. You may unintentionally write code that is considered

    not secure, by using features that do not comply with the industry standard Content

    Security Policy (CSP). Features like use of eval and access to the window object
    are also

    not supported within the security context the Locker Service creates.


    > Locker Service may be activated by default in your org or your customers

    > org. We are thus strongly encouraged to develop and test our code with it

    > enabled if it is not already switch on for your develop and test orgs. There

    > is also a command line utility, Salesforce Lightning CLI, that scans your

    > code for security vulnerabilities. This is well worth investigating and if

    > you have a Continuous Integration process integrating it.


    # Expressing behavior


    Now that we know how Lightning allows us to encapsulate our implementation. It
    is

    important to keep in mind the vision behind components is sharing and reusability,

    not just within your own application, but by other consumers of your application.
    As

    with an Apex class exposing an API, it is important to carefully manage what ways

    consumers of your components are permitted to interact with them.


    # Access Control


    Apex uses the visibility keywords to control what classes, properties and methods

    are visible, within the scope of the class, within a package and outside of it.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'The same level of control is available for the Lightning artifacts you define,
    such as `aura:application`, `aura:component`, `aura:attribute`, `aura:method`,
    `aura:event` and `aura:interface`. The default access level in all cases is `public`,
    which can be increased to `global`. For attributes, you can also use `private`.


    > As with Apex, it is actually best practice to mark something as the lowest level
    of access unless you have good reason to increase it. Thus the samples in this
    book mostly utilize `private` attributes, as these represent the internal state
    of the component and should not be accessible even to any other components, including
    those within the package. As with general Apex coding, this best practice helps
    manage coupling and allows for greater factoring freedom.


    JavaScript functions within the controller, helper and renderer files are private.
    You can however use `aura:method` in your component markup to expose controller
    functions. The next section goes into more details on the use of methods, events
    and interfaces.


    > As with Apex classes, consider carefully the implications on your components
    evolution between package releases when specifying the `global` access control.
    To support backwards compatibility between upgrades, changes are limited to artifacts
    that have this access control applied.


    # Methods, events and interfaces


    In Lightning, the method and interface concepts are similar to equivalent concepts
    in Apex, but apply to components defined in the client. Unlike Apex, interfaces
    do not express methods, only attributes and events to be implemented by the component.


    > Like Apex and Java, interfaces that have no attributes or events are known as
    marker interfaces, as we will discover later in this chapter. The platform makes
    extensive use of marker interfaces, such as the `force:hasRecordId`, you can apply
    to your components to let the Salesforce containers known that your components
    are ready to be used in various contexts.


    It can sometimes be difficult to decide when to use a method in place of an event
    or vice versa, both provide a means for communicating between components:


    +   • An event can be quite an overused term in Lightning; it can refer to something
    sent from an HTML element in the browser or something that occurs during the component''s
    lifecycle, such as the `init` event. These are known as browser and system level
    events respectively.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '+   As a component author you can also define your own component events and
    application events. Component events can be fired and handled within the component
    and by its child components only, whereas application events follow the publish
    and subscribe model, allowing a component to broadcast to any component on the
    page an event that wants to listen (subscribe) to the event. Refer to developer''s
    guide for more information relating to event handling when considering owner components
    versus container (https://developer.salesforce.com/docs/atlas.en-us.lightning.meta/lightning/events_application_handling_phases.htm).


    +   Methods while easier to implement, tend to create tighter coupling between
    components, so should be used sparingly, for example to optimize the setup or
    configuration of child components.


    # Platform namespaces


    Lightning leverages namespaces to segregate layers and functionality. Namespaces
    are used in the same way as other parts of the platform with a prefix ahead of
    the artifact you wish to reference, such as a component or interface. The following
    table lists some of the core namespaces provided with the platform.


    | Namespace | Purpose |

    | :--- | :--- |

    | aura | Based on the core framework used to build Lightning. Aura.

    This remains an open source framework managed by Salesforce. Core

    components and markup is defined in this namespace. Aspects of

    this namespace are designed to be agnostic of the hosting platform.

    You can run Aura on a Java stack if you wanted to! |

    | force | Contains aspects that relate to the Force.com platform, such

    as knowledge of SObjects and components that replicate the

    Custom Object Layout UI in Lightning. The force:inputField

    and force:outputField components mimic those found in

    Visualforce under the apex namespace. It contains interfaces that

    are used when integrating into the Lightning Experience and

    Salesforce1 mobile containers. The sample components in this

    chapter implement these interfaces. |'
  merge: -1
  img_proc: true
- pgno: 329
  md: '| forceCommunity | Represents interfaces used to integrate components into
    the Lightning Community container. |

    |---|---|

    | ui | Includes reusable UI components for basic form based user experiences.
    These components predate SLDS and thus are not styled with it by default, though
    you can apply SLDS styles yourself. In terms of roadmap, Salesforce is focusing
    on the lightning namespace going forward. |

    | lightning | Also known as the Base Lightning Components, these are discussed
    in further detail in the following section. |


    The following screenshot of the **Aura Documentation** page illustrates a good
    way to discover all of the supported namespaces and the interfaces, components,
    and API''s within them, including those exposed from packages installed in the
    org:


    ![](img/bd6ecd0ea6a28b6cca2aa631a00b3793_329_0.png)


    # Base components


    The components in the `lightning` namespace are recommended by Salesforce as they
    provide functionally rich and styled UI components using SLDS. They have stated
    that they will continue to receive updates as SLDS evolves. Thus they are recommended
    to ensure components stay in alignment with the look and feel of the rest of the
    platform.


    At time of writing they have not fully replaced those within the `ui` namespace.
    However, Salesforce have stated that they will continue to expand them on each
    release. Meanwhile continue to check first the `lightning` namespace before the
    `ui` namespace, and check both before building your own.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Data services


    Lightning Data Services are at the time of writing in Developer Preview, which
    means that there is a possibility they will change once fully released for production
    usage. As described in the previous chapter, these can be used as an alternative
    to writing an Apex Controller in scenarios where you simply wish to create, read,
    update or delete a record. You can consider them much like the role of the Standard
    Controller in Visualforce, but instead they exist in the client tier and are interacted
    with by code in the client controller.


    Be careful not to allow such client side facilities to allow business logic to
    leak into the client tier. In all but the simplest cases, you will likely still
    want to delegate to an Apex Service to perform business logic. Also keep in mind
    the transactional scope; multiple updates from the client will likely each have
    their own transaction.


    # Object-oriented programming


    Lightning components are in many ways similar to classes and objects used by traditional
    object-oriented programming languages like Apex, Java and C#. There are many benefits
    to leveraging OOP techniques with components.


    In respect to inheritance consider the following:


    +   - We have already seen an example inheritance through the `extends` attribute
    on the myapp Lightning Application extended `force:slDS` (which is itself an `aura:application`)
    to inject SLDS into the application.

    +   - The `defaultTokens` token component used in this chapter''s sample code
    to import the SLDS tokens extended the `force:base` component (which is itself
    an instance of `aura:tokens`).

    +   - You don''t have to leverage only the platform provided base components;
    you can define your own, marking them extensible via the `extensible` attribute
    on the `aura:component` element.


    Interfaces also provide a means for our components to integrate with Salesforce
    containers. The **Race Results** component implements the following interfaces
    so that it can be used on the Lightning Experience **Home** and **Record** pages:


    ```

    <aura:component controller="RaceResultsComponentController"

    implements="force:hasRecordId,

    flexipage:availableForAllPageTypes"

    access="global">

    ```'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# # Object-Level and Field-Level security


    It is the developer''s responsibility to enforce object and field security within
    Lightning. This can be done with the traditional Apex Describe approaches within
    Apex Controllers. Enforcement should be done at the server end, otherwise unauthorized
    data can be transmitted to the client and the user could use browser debug tools
    to inspect the JSON payloads sent from the server.


    It is up to the developer as to how the UI manifests to the user. This might simply
    result in message indicating the user requires more permission or you may choose
    to dynamically hide (which should include omitting values from the server response)
    or disallow edit to certain fields or table rows for example.


    You might expect that the ui:inputField and ui:outputField components respect
    field level security, like their Visualforce counterparts. This is not the case,
    due to the aforementioned reason; enforcement must happen at the server end.


    > Lightning Data Services are expected to honor object and Field-Level security.


    # # FormulaForce Lightning Components


    In designing the Lightning Components for the FormulaForce sample application
    contained in this book, I wanted to try to demonstrate some key integration points
    within the Salesforce UIs, while also ensuring the use cases fit with the application
    domain.


    I focused on Lightning Experience and Salesforce1 Mobile. It is also good practice
    to think platform-first, before embarking on any extensive development. I started
    with the following use cases and then devised a set of components to deliver the
    functionality.


    +   - Race Overview: while the standalone Lightning Application we looked at earlier
    was a good means to get started with the components, it''s not a Salesforce integrated
    solution. What I wanted to do was integrate the Lightning Experience Home Page,
    through the Lightning App Builder customization tool. Not only to show the overall
    standings (leaderboard), but to allow users to filter information through the
    race calendar to show the results from each completed race.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '+   - Race Calendar accessibility: The race calendar is a key piece of information
    users will likely want at hand when using other parts of the application. The
    Lightning Experience Utility Bar (or footer) is specific to your application and
    contain components you want to be always accessible.

    +   - Race Setup assistance: There is a junction object between Race records and
    Drivers called Contestants. This can make setting up a race overly complex from
    a user experience perspective. As such I wanted to leverage Lightning Component
    Actions to provide a custom UI to add drivers to a race.

    +   - Race Results overview. Race results are the combined result of information
    from the Contestants, Driver, Team and Car objects. I wanted to provide an easy
    and contextual way of viewing the race results from the Home Page and Race Record
    Page through the Lightning App Builder customization tool.


    Let''s take a closer look at the components that I came up with.


