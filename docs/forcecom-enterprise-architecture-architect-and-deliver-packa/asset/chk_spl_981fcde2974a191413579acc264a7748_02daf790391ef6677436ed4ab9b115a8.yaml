- 'no': 4489
  overturn_probability: 0.75
  alternative: 正文小标题（二级节标题）
  counter_evidence:
  - 格式特征上该行使用“##”二级标题而非“#”一级标题，与前后章标题（“# 应用程序域层”、“# 8 用户界面”）格式不一致，根据“只划分全书最高层级的大章”规则，二级标题更可能属于子层级节标题，不应独立分章。
  - 该行缺少数字章序号，语义虽指向新章，但格式上更像是域层章节内的下一节或选择器部分的小标题，存在误报可能。
  keep_split: false
- 'no': 5269
