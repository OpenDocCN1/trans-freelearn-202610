  alternative: 正文小标题 / 章内引言性大标题
  counter_evidence:
  - 该行未使用数字章序号（如“第 X 章”或“X.”），仅凭语义判断“应用程序域层”可能被视为上一章（服务层）内部的大型结构性小节，而非全书最高层级独立章节。
  - 标题前紧邻“## 摘要”（第3389行），两者可能共同构成上一章的末尾结构，标题本身可能只是章内引言性小标题，而非新章起点。
