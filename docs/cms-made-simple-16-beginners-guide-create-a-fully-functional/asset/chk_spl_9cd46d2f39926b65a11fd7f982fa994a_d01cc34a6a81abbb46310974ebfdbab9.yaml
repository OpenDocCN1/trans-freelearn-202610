  counter_evidence:
  - 前一个相邻标题为“## 总结”（6425行），总结通常是章的收尾部分，随后立即出现“随堂测验答案”，可视为该章甚至全书后置的补充材料，不一定需要另起新章。
  - 该行虽使用“##”标题，但没有章序号，且没有典型的章首概述段落，只是集中列出第3章至第11章的答案，更像书末附录而非具有统领性的正文章节。
