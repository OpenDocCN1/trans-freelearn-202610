- pgno: 242
  md: 'Use the functionality for the Admin Notifications already implemented in the
    module, so that the support staff are informed if a new ticket is opened or a
    new reply is added.


    In the admin area of the module Calguys Feedback Module (tab Fields), you can
    create a new custom field that allows one of the following values: Opened, Waiting
    for Response, or Closed. Use the field type Dropdown to define it. This field
    can be set by the support staff while working on the ticket and shown in the summary
    view of the tickets, so that the customer can see what the current status of the
    ticket is.


    You have seen how you can use the module that is not dedicated for creating a
    service desk to set up the required features. Be open-minded and experiment with
    the modules. Even if their description is not exactly what you need, you can use
    it in your way, as shown in this section.


    # Pop quiz – creating your own functionality


    +   1. Why should the Allow users to login more than once box be selected when
    setting preferences in the FrontEndUsers module?

    +      a. When the user is currently logged in and the session expires in the
    browser and not on the server, the user would not be able to log in again.

    +      b. You should give users with a dual personality a chance to log in at
    least twice at the same time.

    +      c. A lot of users are working on different computers (private, office,
    and so on), so they can log in from more than one computer.

    +      d. When this box is not checked, it is not possible to generate a new password
    (or regenerate the username) when the user once forgets it.

    +   2. What is the right statement according to the following Smarty tags used
    in protected pages?

    +      {CGFeedback key1="Ticket" key2=$userid}

    +      {CGFeedback key1="Ticket" key2=$userid action="summary"}

    +      a. These tags show the summary view of all comments written by all registered
    users.

    +      b. These tags show the comment form and the summary view of all comments
    written by one user.

    +      c. These tags show the summary view of all comments written by all users,
    who are currently visiting the website.

    +      d. These tags show the comment form and the summary view of all summaries
    of professional books written by all users having the same ID.


    ```

    {CGFeedback key1="Ticket" key2=$userid}

    {CGFeedback key1="Ticket" key2=$userid action="summary"}

    ```'
  merge: -1
  img_proc: true
- pgno: 243
  md: '3. What is the advantage of using a support ticket system?


    +   a. The website will get more visitors because of the fact that ticket systems
    are modern and the users are projecting this fact to your whole site.

    +   b. The user can have a non public discussion with the service staff concerning
    his/her needs and problems.

    +   c. The user gets tickets for the champion league for a special price.

    +   d. The user can have a public discussion in the forum concerning his needs
    and problems.


    # Have a go hero – creating your own functionality


    Before you say that there is no module that can cover my requirements and start
    to develop one, try to figure out if your requirements can be solved with on-board
    means. A lot of modules are just categorized catalogs of something, so they can
    be created with help of the module CTLModuleMaker. And, as you have seen, try
    to see your requirements more abstractly and reflect on using other modules to
    solve your functionality before starting to develop from scratch.


    # Summary


    We learned a lot in this chapter about implementing our own functionality not
    covered by any ready-made module of CMS Made Simple.


    Specifically, we covered:


    +   ◆ Module Maker: Creating some entirely new custom modules with catalog-like
    content.

    +   ◆ Custom Area: Enabling the login functionality on the website and creating
    rudimentary service desk functionality with the feedback module.


    Now that we''ve learned about how to create our own functionality, you can follow
    a workshop on how to realize basic e-commerce solution with CMS Made Simple. If
    you do not need any e-commerce functionality, you are now ready to place your
    website online because by this time, your website is fully functional.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 9

    E-commerce Workshop


    CMS Made Simple is, as its name suggests, a content management system. In a CMS,
    data can be defined as almost anything—documents, movies, pictures, phone numbers,
    scientific data, and so on. CMS is generally used for storing, controlling, revising,
    and publishing content. They are not explicitly designed for e-commerce or community
    needs. For sophisticated online shops without any content management features,
    it is better to get a dedicated e-commerce application. The same applies to the
    typical community features like forum or chat.


    However, if your website is heterogenic, then it is not just a content management
    system and has a mix of various features. You can use additional modules for basic
    functionality of other applications. In CMS Made Simple, there are some community
    modules such as Forum Made Simple (FMS) and Shootbox Made Simple, and a number
    of modules that cover basic e-commerce features.


    A number of additional e-commerce modules for CMS Made Simple can be confusing
    at the beginning. Actually, there are different solutions such as e-commerce suite,
    Shop Made Simple (SMS), and the Cataloger. These different solutions are not compatible
    with each other in any way and cannot be used together on one website.


    In this chapter, you will learn about a solution made of nine modules that offers
    the widest functionality. This suite can be enriched by a number of additional
    modules to get even more features. Often users of CMS Made Simple wonder why there
    are so many modules that are required to get a basic online shop. It is a philosophy
    of CMS Made Simple to act like a Lego system, where you can build your required
    solution without installing a big package having a bunch of features that you
    will never use.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'This solution is made of nine modules that are listed as follows:


    +   - **CGExtensions**

    +   - **CGSimpleSmarty**

    +   - **Products**

    +   - **Cart**

    +   - **FrontEndUsers**

    +   - **SelfRegistration** (optional)

    +   - **CGPaymentGatewayBase**

    +   - **Orders**

    +   - **PaypalGateway** (optional)


    Two of them are optional. The **SelfRegistration** module will allow your buyers
    to register with the website during the checkout process. The last module, **PaypalGateway**,
    should be installed if you use **PayPal** service to instantly collect payment
    from the website. For this workshop, I will use products from the official CMS
    Made Simple shop that can be found at http://www.cafepress.co.uk/cmsmadesimple.
    I also assume that you already know how to install modules and customize module
    templates with HTML, CSS, and Smarty.


    # Module Products


    The **Products** module will be the heart of your e-commerce solution. This module
    is the place where products that you would like to sell in your shop are saved.
    Generally, it is possible to use any other module for the solution, but this would
    imply that you have to make some heavy modifications to your templates and, probably,
    the PHP code of the modules.


    With the **Products** module, you can manage:


    +   - Products

    +   - Product attributes that will have an impact on the price (like size or color)

    +   - Categories

    +   - Product hierarchy

    +   - Custom fields


    This module is the basis for all other modules that you will use later on. After
    all, you cannot start a shop if you do not have any place to store the products.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Install the **Products** module with the **Module Manager**. Pay attention
    to the **Dependencies** section of the module before installing it. There are
    two (**CGExtensions** and **CGSimpleSmarty**) modules that provide convenience
    APIs, reusable forms, and Smarty tags for use in other modules. If you are not
    a programmer, you probably will not need to do anything with these modules besides
    adjusting some preferences if you ever need them. In the workshop described here,
    you just need to install them.


    # Time for action – adding the first product


    After the **Products** module is installed, we will display it on the page **Shop**
    and add the first product to it as follows:


    +   1. Create a new content page **Shop (Content | Pages | Add New Content)**.

    +   2. Add the Smarty tag `{Products}` into the field **Content** of the page.
    If you see the page in browser, it will not show anything at this time as you
    have not added any product to the shop so far.

    +   3. In the admin console of CMS Made Simple, click on **Content | Product Manager**.

    +   4. Under the **Products** tab, click on the **Add A Product** link and add
    your product as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_246_0.png)


    +   5. Click on **Submit** and see the **Shop** page on your website.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# What just happened?


    You have added the first product to the **Products** module. This product is displayed
    on the page with the **Price** and **Weight** (we can delete this field later
    on). Click the product link to see the detailed view of the product. The template
    looks very technical, but with some HTML, CSS, and Smarty knowledge you can change
    its look and feel later on. Let''s concentrate on the functionality of the module
    first and not on the design.


    Add some more products in the **Product Manager** and see the list of products
    on the **Shop** page. Pay attention that the detailed view of every product is
    displayed in the same way. In the **Products** module, there are some fields like
    **Price** and **Weight** already defined. But you will need to add your own fields.


    # Creating custom fields


    Usually one or more pictures of the product can be found in an online shop. However,
    there is no special image field where you can upload the product picture. Luckily,
    you can add as many custom fields as you need. In the next step, you will create
    a custom field, where the image of the product can be uploaded. In the admin area
    of the **Product Manager**, choose the tab **Field Definitions** and click on
    the link **Add A Field**.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_247_0.png)


    **Name** is a kind of technical field that is not displayed to your visitors.
    You should not use any special characters or spaces in the name of the field.
    Use only letters and numbers, no dashes, slashes, or anything else non-alphanumeric.'
  merge: -1
  img_proc: true
- pgno: 248
  md: "The **Prompt** field is the label of the field that you will see in the admin\
    \ area of the **Product Manager** during adding or editing products. You can use\
    \ any characters in this field.\n\nThe **Type** of the field should be **Image**.\
    \ By selecting this type you ensure that the field is displayed as a field for\
    \ file uploads in the admin area. This field will also be validated, so that only\
    \ images can be uploaded here. Additionally, thumbnails for the uploaded images\
    \ (small preview versions) will be created automatically after upload.\n\nLet\
    \ the field be public by selecting the checkbox for **Is this a public field?**\
    \ It means that the content of the field (the image itself) will be shown to the\
    \ visitors of your shop. If you make it private, only the administrator of the\
    \ website can see the field in the admin area of the module.\n\nSave the field.\
    \ This field is automatically added to the detail template on the page and the\
    \ editing view of the product in the admin area of the **Product Manager**. To\
    \ test the field, open any product for editing in the admin area, find the field\
    \ **Product image (Prompt)**, and upload an image for the product using this field.\n\
    \nControl the display of the field in the detailed view of the product on the\
    \ website. The small preview version of the product is added to the section **Custom\
    \ Fields** of the detailed view. We still do not care of how it looks like, but\
    \ how it works. We will change the detailed view of the product when we are ready\
    \ with all the custom fields and the product hierarchy.\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_248_0.png)\n\
    \n> **Image already exists**\n> \n> When you try to upload the same image twice\
    \ you will get an error saying that the image has been already uploaded. To control\
    \ what images are already saved for the product and delete them, open **Content\
    \ | File Manager** in the admin console. Find the folder Products and then the\
    \ folder name `product_[ID]`. The ID of the product is displayed in the list of\
    \ products in the admin area. Click on this folder and remove the images already\
    \ uploaded. Now, you can upload the same image in the admin area of the **Product\
    \ Manager**.\n\n# Define your own fields\n\nCreate as many custom fields as you\
    \ need to display and manage the product. With the **Type** of the field you decide\
    \ how the field is displayed in the admin area. The output of the field on the\
    \ page can be fully customized and does not depend on the type.\n\nIf you need\
    \ a **Product Number** field, create a new custom field (**Text Input**) with\
    \ maximum length of 12 characters and make the field public. Then edit each of\
    \ your products and enter a number in this field. You can adjust the order of\
    \ the fields under the **Field Definitions** tab. Again, this order only applies\
    \ to how the admin area for the product management looks; the output on the page\
    \ can be completely different."
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Creating a product hierarchy


    Next, let us create a product hierarchy. In the official shop that I am trying
    to reproduce here, there are four hierarchy items:


    +   - Shirts (short)

    +   - Shirts (long)

    +   - Home & Office

    +   - Mugs


    You should understand the difference between product categories and product items
    in the Product Manager module. Product categories are kind of tags for the products.
    It is not possible to arrange them in the hierarchy. However, you can assign one
    product to multiple categories if you like. In contrast to the categories, a product
    can belong to only one hierarchy item. That means the structure above should be
    implemented as a hierarchy and not as categories. One product cannot be a shirt
    and a mug at the same time.


    We will use categories later on to mark the products as:


    +   - New

    +   - Popular

    +   - Discounted


    Categories will allow you to make one product both new and discounted at the same
    time. A hierarchy would not, as multiple assignment is not possible.


    In the admin area of Product Manager, click on the Product Hierarchy tab and create
    four hierarchy items displayed in the first list. It is your choice if you want
    to add any description or image to the hierarchy or leave it empty.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_249_0.png)'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'Once the hierarchy is created, go through your already created products and
    assign them to the proper hierarchy item. The hierarchy can now be displayed in
    the sidebar navigation on the page. Open the main page template (Layout | Templates)
    and find the section with sidebar navigation. Add the Smarty tag for the product
    hierarchy shown as follows:


    ```

    {Products action="hierarchy"}

    ```


    # Customizing product templates


    The display of the product hierarchy template is very technical. Let''s customize
    all the templates for the module. There are three of them:


    +   - Summary Templates

    +   - Detail Templates

    +   - Hierarchy Report Templates


    Let''s start with the Hierarchy Report Templates. This template defines how the
    hierarchy in the sidebar is displayed. In the admin area of the Product Manager,
    click on the Hierarchy Report Templates tab and find the list of existing templates
    for the hierarchy. The template Sample is the one that is used by default. You
    can customize this template or create your own by clicking on the New Template
    link. I choose the second way. It is generally advisable not to change sample
    templates, but create your own and set them as default. This way you can delete
    anything from the custom template and use the Sample template for reference if
    you need parts removed from the custom template. For the template name, I chose
    My Shop. However, you can use any name you wish.


    In the Template Text field, the sample template code is already suggested. Leave
    this code as it is and submit the new template. Now you see two templates in the
    list. Make the template My Shop the default one by clicking on the red cross in
    the Default column. Let''s see what we have in the template and what we actually
    need. Open the new template for editing:


    | Smarty variable | Description |

    |---|---|

    | {$hierarchy_item.name} | The name of the hierarchy item. |

    | {$hierarchy_item.id} | The ID of the hierarchy item. |

    | {$upurl} | The URL to the parent hierarchy item. Only applicable if there are
    more than one hierarchy levels. |

    | {$mod} | The object containing all the information about the module Products.
    In the template the object is used to get translations:

    {$mod->Lang(''parent'')} returns the translation for the key parent from the translation
    file.

    You can replace this variable with your custom text if your website is monolingual
    and the language of the website will be never changed. |'
  merge: -1
  img_proc: true
