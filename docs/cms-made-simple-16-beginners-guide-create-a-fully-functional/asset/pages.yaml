    +      b. Sending out the prepared e-mails to a mailing list.

    +      c. Choosing an existing message and an existing list of users that are
    going to get the message.

    +      d. Thinking about the different possibilities you have for combining mailing
    lists and planned messages.


    # Have a go hero – installing other modules


    Now, if you require other features for your website, you should look at the available
    modules and try them out. Use each module''s **Help** to figure out whether you
    can solve your requirements with it. Do not forget about plugins. They give you
    small but useful features in cases where the modules will be too much overhead.


    A good website is mostly never ready, and you work on it again and again; hide
    unfinished parts now, and present the first version of your website online, while
    working on unfinished parts in the development environment.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Summary


    We learned a lot in this chapter about how different modules in CMS Made Simple
    extend the features of your website.


    In this chapter, we covered:


    +   - **Gallery**: How to create a photo gallery and create a custom template
    for the gallery from scratch.

    +   - **Form Builder**: How to create and customize forms like contact or feedback
    forms on the page, without any deep programming knowledge.

    +   - **Newsletter**: How to import e-mail addresses to the user list of the module
    **Newsletter Made Simple** and send out messages to existing e-mail lists.

    +   - **YouTube videos**: How to embed YouTube videos in the website. You do not
    need any special module to show single videos on the page. Discover the core functionality
    before looking for add-ons.


    In this chapter, only some modules were explained. There are many more modules
    that have very sophisticated functionality and offer extended features for your
    website. Every week, new modules are developed for CMS Made Simple and updates
    are made to the existing ones.


    In the next chapter, you will learn how to build more functionality from existing
    modules and even create your own functionalities from scratch.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 8


    # Creating Your Own Functionality


    > CMS Made Simple has only some rudimental features that belong to the standard
    installation. Any additional functionality can be installed with other modules,
    as you have learnt from the previous chapter. However, you often need your own
    functionality that is not covered by any existing module.


    In this chapter, we will:


    +   - Create a product catalog with custom fields and an individual hierarchy

    +   - Use the functionality of a module in a way that it was not developed for


    So let''s get started...


    # Creating a product catalog


    In this section, we will learn how to create a new module. As an example, the
    product catalog will be created, but in the same way, you can create any kind
    of catalog such as services, courses, real estate advertisements, or freelancer
    directory.


    Before you create your own catalog module, you should plan its structure very
    thoroughly. First of all, reflect on the number of levels. Write down how many
    levels (product categories, subcategories, and so on) you need. For my example,
    I will create a simple office furniture catalog. I need the following three categories
    to which the products can be assigned during creation:


    +   - Desks

    +   - Chairs

    +   - Bookcases'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'This means that for the furniture catalog, a two-level structure is required,
    such as categories and products. Each product will belong to only one of the categories
    listed previously.


    In the next step, you have to figure out what fields you need to create for one
    item (product) in your catalog. This is like making a table from your product''s
    list. What columns do you need to separate different information? For my example,
    I need the following four fields:


    +   - Product title

    +   - Description

    +   - Image

    +   - Price


    Now, you can start creating your own module. You are not going to use any special
    dedicated modules, but you will learn how to create an individual module perfectly
    fitted for your individual needs. This can be done with **CTLModuleMaker** module
    that allows the creation of any fully functional catalog-like module.


    The example structure of the new product catalog is as follows:


    +   - Desks

    +     - Computer desk

    +     - Executive desk

    +   - Chairs

    +     - Executive chair

    +     - Guest chair

    +   - Bookcases

    +     - .....


    Install the **CTLModuleMaker** module from the list of available modules (**Extensions
    | Module Manager**). When the module is installed, its admin area can be found
    in the admin console (**Extensions | CTLModuleMaker**).


    # Creating a new catalog-like module


    We will now start to create a new individual module. In the admin console, go
    to the admin area of **CTLModuleMaker** (**Extensions | CTLModuleMaker**), and
    click on the link **Create a new module**.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Step 1: Basic information about the module


    The module wizard will take you through all steps needed to create a new module.
    In step 1 you are asked to define basic information about the new module.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_210_0.png)


    In the first field, enter the name of the module. This name will appear in the
    list of modules (Extensions | Modules). It will also be used in the Smarty tag
    {cms_module module="NAME_OF_MODULE"} later on. It''s better to choose a unique
    prefix for the module name, as shown in the previous example. Do not name it just
    Products (there is a third-party module called Products), but BWProducts. BW stands
    for Business World in my example (sure you can use your own prefix).


    > The first field is also used to generate URLs for the module items later on.
    For example, the detailed view of the product will display http://www.mydomain.com/nameofmodule/detail/nameofproduct/5/.


    The description of the module will appear on the module Help in the section What
    Does This Do?


    The friendly name of the module will be shown in the admin menu when the module
    is installed. In the previous example, the module will be installed in Content
    | Products Catalogue.


    We have figured out that we need a two-level structure: categories and products.
    If you need more levels, then change it here. However, I recommend starting with
    a simple two-level structure at the beginning and then, if the principle is clear,
    creating one or more additional levels.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '*Creating Your Own Functionality*


    Click on **Next** and proceed with step 2.


    # Step 2: Creating levels


    The products in the module will be assigned to different categories. Categories
    will help to group different products and make the navigation within the product
    list easier


    # Creating the first level categories]


    This step helps you to define categories for the new module, so that the items
    can be assigned to later on.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_211_0.png)'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'The first and the fourth fields require a technical name and a prefix for the
    categories. Technical names are not shown to the visitors of the website and should
    not contain any special characters. On the contrary, the second and the third
    field is user friendly and can contain special characters. These fields will be
    used in the admin console. For example, the plural form of the level name will
    appear on a tab in the admin area of the module, as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_212_0.png)


    The fifth field deals with the flexibility of the hierarchy. Can a product belong
    to only one category or to many categories? As an example, imagine a book catalog
    where a book can belong to more than one category. Historical crime logically
    belongs to crimes and historical literature at the same time. For the furniture
    catalog, we do not need such flexibility. In our example, the products can only
    belong to one category.


    In the sixth field, you enter number of fields that are required additionally
    to the fields automatically added to each level. You can read from the comment
    of the field what fields will be created. This means that we do not need any extra
    field for the category title as we will use the field name for it. Additionally,
    we need the field that stores the description of the category. Therefore, you
    enter 1 in this field.


    The seventh field is not important for the level 1 in the catalog structure as
    there are no parent elements for the categories.


    Where should new categories appear in the list of categories (in the admin area
    and on the website) by default? Note that you can always reorder the appearance
    of the category manually in the admin area of the module later on.


    The last field is not important for level 1 and can be left as it is. Click on
    Next.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Creating Your Own Functionality


    On the last screen, you defined the number of additional fields (see the sixth
    field in the first image under step 2) that the category should have. Now, you
    have to give more information about this field on the next screen, as shown in
    the following screenshot.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_213_0.png)


    The first field contains the technical name of the field for internal use only.
    The second field is the friendly name which will be visible to the editors of
    the catalog in the admin console. Choose **Short text (255 chars.)** for the field
    type if you feel that 255 characters will be enough for the category description.
    Setting a field to be mandatory means that you won''t be able to create a new
    category without giving it a description.


    Should the content of the field be indexed in the **Search** module of CMS Made
    Simple? This module is a standard module and was explained in Chapter 5, *Using
    Core Modules*.


    Every module created with **CTLModuleMaker** will get an additional advanced search
    function, as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_213_1.png)'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'In the last field of the field definition, you can define whether or not you
    would like to see the field in the advanced search. In the previous example, the
    field is searchable and therefore displayed at the top of the search function.
    Click on **Next**.


    In the next step, you define what fields will be displayed in the list of categories
    in the admin area of the future module. The field **name** is mandatory, you cannot
    delete it from the list, but you can add any other fields from the list of **Possible
    fields**. Add the field **nbchildren** to the list, as shown in the following
    screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_214_0.png)


    With the fields defined previously, the list of categories in the admin console
    of the module will look as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_214_1.png)'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Creating Your Own Functionality


    Click on **Next** and proceed with the definition of the products (level 2 in
    the catalog structure).


    # Creating the second level (products)


    In the following steps, you will be asked for information about your products.
    You will see that the definition of each level is similar. There are the same
    fields as for categories where you now provide information about products.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_215_0.png)


    For the products, we need three additional fields:


    +   - Description

    +   - Price

    +   - Image'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'The product title will be saved in the mandatory field **Name** and should
    not be planned here.


    The seventh field, which could be ignored for the category level, gets some meaning
    in the second level. How the products should be displayed in the list of products,
    whether categorically or alphabetically, and whether they should be displayed
    independent of the category they are placed in or not.


    | By category | Alphabetically |

    |---|---|

    | Executive Desk | Computer Desk |

    | Computer Desk | Executive Chair |

    | Executive Chair | Executive Desk |

    | Guest Chair | Guest Chair |


    In the last field, you can define whether there can be only one default product
    for the whole product list, or one default product for each category. In our example,
    we do not need any default products, so you can leave the field as it is.


    Click on **Next**.


    Similar to the definition of the additional field **description** for the category,
    you are now asked to define the three additional fields for the products.


    The first field required for the product is **Product Description**. This field
    is defined in the same way the category description was defined. I have chosen
    the field to be **Long text** so that there is no limit to the description length
    of the product. The field should be searchable both ways, from the standard search
    field of CMS Made Simple and from the advanced search feature of the module itself.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_216_0.png)'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Creating Your Own Functionality


    In the next field, the price of the product should be stored. The field must be
    defined as **Short text (10 chars.)**. If you choose **Number** in the **Field
    Type**, then no decimal numbers can be stored in it.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_217_0.png)


    The third field will allow you to upload product images. Once you have changed
    the **Field Type** to **Image**, additional information will be displayed as shown
    in the next screenshot:'
  merge: -1
  img_proc: true
- pgno: 218
  md: "# Field 3\n\n**Field Name**\n*This is for internal use only. It should be alpha-numerical,\
    \ without accents, spaces, or other symbols.*\nimage\n\n**Friendly name (display\
    \ name)**\nProduct Image\n\n**Field Type (What does it contain?)**\nImage\n\n\
    **Is this field mandatory?**\nNo\n\n**Should this field be indexed for the Search\
    \ Module?**\nNo\n\n**Should this field show up in the advanced (search by fields)\
    \ search action?**\nNo\n\n**Enter the path of the folder in which the files should\
    \ be uploaded.**\n*This path will be added to the upload folder (empty = root\
    \ of the upload folder).* \nimages/catalogue\n\n**Should the uploaded images be\
    \ resized to a maximum size?**\n*Enter the size in pixels, format \"widthxheight\"\
    \ (empty = images not resized).* \n\nThe resize functions require the gd libraries\
    \ and will only work with .jpeg, .jpg, .png or .gif files\n500x700\n\n**Should\
    \ the image be cropped when not of the resize proportions?**\nNo\n\n**Should a\
    \ thumbnail be created, what should be its maximum size?**\n*Enter the size in\
    \ pixels, format \"widthxheight\" (empty = no thumbnail created).* \n120x120\n\
    \n**Should the thumbnail be cropped when not of the resize proportions?**\nYes\n\
    \n**Allowed file extensions, separated by commas. (empty allows gif/jpeg/jpg/png\
    \ for images, and anything for other filetype)**\ngif,jpeg,jpg,png"
  merge: -1
  img_proc: true
- pgno: 219
  md: 'The information in the last six fields is only required for the fields where
    images can be uploaded.


    You should enter the name of the folder where the images will be saved after upload.
    This folder will be created automatically below the `uploads` folder on your web
    hosting. You can use the `images` folder and then the custom name of the module
    folder. This will ensure that the images are automatically saved in the `images`
    folder and thus can be edited online with **Image Manager**.


    In the next field, enter the maximum size of the product image to what the image
    will be resized if it is larger than the size given here. However, sometimes it
    is not possible to resize the image precisely to the size given in the field without
    changing the image''s proportion. In this case, either width or height will be
    considered. If you would like to keep the exact size, then the module has to crop
    the image. If you crop an image, it would mean that a part of the image will be
    cut off. You can choose the resize method in the field below.


    In the same way, you can define the size of the thumbnails. The best resize method
    depends on your source images and design so a general recommendation cannot be
    made.


    In the last field, you give the extensions that are allowed for the upload. Note
    that only GIF, JPEG, JPG, and PNG files can be displayed as images in all browsers.
    Do not allow any other format so that the editors of the products will not be
    able to upload other files in this field.


    Click on **Next**, and define what fields should be shown in the admin console
    for the list of products:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_219_0.png)'
  merge: -1
  img_proc: true
- pgno: 220
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Creating Your Own Functionality


    Click on **Next**. You have reached the last step and are close to the finish
    and installation of the new module.


    Leave the values in the last step as they are. They deal with file fields (we
    do not have any), languages (we learn more about translations in Chapter 10, *Advanced
    Use of CMS Made Simple*), and the module version. The module version is used for
    revision control and is used to manage changes made to the module afterwards.
    For example, an initial configuration of the module gets the version 1.0. When
    the first change to the module is made, the resulting configuration will be marked
    as version 2.0, and so on. We do not allow visitors to the website to add products,
    so leave the **Frontend User Management** set to **No** as well.


    Click on **Next**. The **CTLModuleMaker** module starts to create all required
    folders and files. Click on the **Install module** link, and the new custom module
    will be installed. You can now find it in the admin console **Content | Products
    Catalogue**.


    Additionally, the module can be found in, removed, and installed from the list
    of modules in **Module Manager (Extensions | Modules)**.


    # Configuring the new Products Catalogue module


    Add some categories and some products in the admin area of the new module.


    Then, open the page **Products (Content | Pages)**, and add the following Smarty
    tag to call your module:


    ```

    ```smarty

    {cms_module module="bwproducts"}

    ```

    ```


    Replace the name in the parameter module by the name of your module. This name
    can be found in the list of installed modules (**Extensions | Modules**). Open
    the page, and see the list of products on the page.


    The new module also has a **Module Help** section where all parameters that you
    can use with this module are listed. The help section can be accessed from the
    **Module Help** icon placed in the module admin area at the top-right of the page.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_221_0.png)'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'For more help, you may take a look at the FAQ. The link to the FAQ can be found
    in the module help above the Copyright and License section.


    # Creating the product list template


    For modules created with CTLModuleMaker, some sample templates are created automatically.
    However, for each level, you can create an unlimited number of templates by yourself.


    # Time for action – creating a new list template


    Let''s customize the appearance of the product list and add products'' images
    as thumbnails to this list.


    +   1. In the admin console, click on Content | Products Catalogue, and choose
    the Templates tab.

    +   2. Below the section Default Templates, you will find a list of sample templates.
    Click on the Add template link.

    +   3. For the product list with thumbnails, enter the following code snippet
    in the Template field:

    +   ```

    +   {if $itemcount > 0}

    +       <ul>

    +           {foreach from=$itemlist item="item"}

    +               <li style="list-style-type:none; float:left; margin: 20px;"><a
    href="{$item->detailurl}">

    +               <img src="uploads/{$item->image->thumbnail}" alt="{$item->name}"
    /></a>

    +               <br/>

    +               {$item->detaillink}<br/>{$item->price} USD</li>

    +           {/foreach}

    +       </ul>

    +   {/if}

    +   ```

    +   4. Click on Submit.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '5. In the **Default templates** section, choose the template you just created
    to be the **Default list template for level "product"**. The list of products
    should look as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_223_0.png)


    # What just happened?


    You have created a new template for the list of the products. This template shows
    not only the products'' name but also the small version of the products'' image.
    The small version of the image is represented as Smarty variable `{$item->image->thumbnail}`
    in the template. All Smarty variables that you can use in the template can be
    found on the tab **Template variables (Content | Products Catalogue | Templates)**
    when the template is open for edit. Consider that the fields containing images
    have even more variables. They are explained in the FAQ for the module in the
    section titled *How can I retrieve images in the display templates?*


    > The inline CSS added to the template is not the proper way to implement styles.
    It has been made to simplify the example. You should create a new CSS class and
    store the style definitions in the main stylesheet.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'In the same way, you can modify or create a new template for the **Default
    detail template** that is used to display the detailed view of one product.


    With the **CTLModuleMaker** module, you can create any kind of catalog such as
    products, services, real estate advertisements, courses, and more. Everything
    that you can categorize can be put in a custom catalog-like module. Remember that
    you create an ordinary module that can be removed from the list of modules, exported
    as XML, and imported into another installation.


    # Implementing service desk functionality


    There are over 300 third-party modules in CMS Made Simple, and this number grows
    weekly. Some modules do not work as expected, as there is no quality assurance
    for the third-party modules. However, sometimes you do not need to use a dedicated
    module to solve your requirements. With some creativity you can divert modules
    from its intended use to create your own functionality.


    There is no sophisticated module for the service desk in CMS Made Simple. However,
    if you need it to handle support tickets, then you can use the module **CGFeedback**;
    which was originally created to handle comments for the pages or news articles.
    Although this module has not been developed to handle support tickets, it can
    be used to solve the required features with some advanced customization.


    # Managing visitors'' logins


    Before you set up the service desk feature on your website, you have to install
    the module **FrontEndUsers**. The **FrontEndUsers** module is a kind of membership
    management facility for your website. In our case, members are the customers who
    can authorize with their access data on the website and the protected content
    or communicate with you through their personal member area.


    Generally, **FrontEndUsers** can be integrated with many other modules such as:


    +   - **News** (Registered visitors can add news to the website)

    +   - **DownloadManager** (Registered visitors can download protected files from
    the website)

    +   - **Forum** (Registered users can communicate on the boards)

    +   - **NMS** (Mass mail for registered users)


    > Website members are not the same as the admin users of your website, which were
    described in Chapter 6, *Users and Permissions*. They have nothing to do with
    your admin console (hopefully!).'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'The module **FrontEndUsers** has a dependency on the module **CMSMailer**.
    It means that you have to configure e-mail settings, as described in Chapter 2,
    *Getting Started*, before installing member management on the website. Otherwise,
    features like sending out forgotten passwords will not work.


    To install the module in the admin console, click on **Extensions | Module Manager**,
    and choose the letter **F** from the **Available modules** tab above the alphabetical
    module list. Find the **FrontEndUsers** module, and click the **Download & Install**
    link. The module will be installed and can now be configured.


    Open the page **Service Desk (Content | Pages)**, and add the login form into
    the **Content** field of the page, shown as follows:


    ```

    {cms_module module="FrontendUsers"}

    ```


    Now, you can see the login form on the page. Let''s create a first customer account
    and log in to the page so that you can test the functionality of the module.


    # Time for action – creating the first user account


    We are going to add the first customer account to the website.


    +   1. In the admin console, click on **Users & Groups | Frontend User Management**.

    +   2. Click on the **User Properties** tab.

    +   3. Click the **Add Property** link and fill in the form, as shown in the following
    screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_225_0.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: '4. Click on **Submit**.


    5. Open the **Groups** tab, and click on the **Add Group** link.


    6. Fill in the fields, and assign the e-mail field created above to the group,
    as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_226_0.png)


    7. Click on **Submit**.


    8. Click on the **Users** tab and then on the **Add User** link.


    9. Fill in the fields, as shown in the following screenshot (provide a valid e-mail
    address!), and assign the user to the **Customers** group:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_226_1.png)'
  merge: -1
  img_proc: true
- pgno: 227
  md: '+   10. Click on **Next**, and enter the e-mail address of the customer again.

    +   11. Click on **Submit**.

    +   12. Log in with the customer data (**Username = Email Address** of the customer)
    on the page **Service Desk** to see how it works. If you are logged in, the page
    should look as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_227_0.png)


    # What just happened?


    You have created the first customer account. You have started by adding the user
    property (a field that contains a customer''s e-mail address). This field will
    be used for sending e-mails such as if the customer forgets his password. By default,
    this field is also used as the username (you can change it later on). The **Type**
    of the field must be set to **Email Address**, so that anything entered in this
    field must be a valid e-mail. You do not need to define user properties such as
    **username** or **password**. These two properties are already provided for you
    and cannot be changed or deleted.


    > > Never use any special characters like dashes in the field **Name** while adding
    user properties!


    You have already created a new user group (**Customers** in our example). The
    e-mail field has been assigned to the group **Customers** as a required field
    (**Field Status**), which means that each customer must have a valid e-mail address.


    At this point, you have configured the module so that the first customer could
    be added. All customer accounts have their expiration date, so they are disabled
    automatically if the date is in the past. The new user has been assigned to the
    **Customer** group and is now shown in the list of users on the **Users** tab
    (**Users & Groups | Frontend User Management**).


    # Useful settings for module FrontEndUsers


    As the administrator of the website, you can adjust the settings of the **FrontEndUsers**
    module. In the admin console of your website, click on **Users & Groups | Frontend
    User Management**, and select the **Preferences** tab. The following settings
    should be made:'
  merge: -1
  img_proc: true
- pgno: 228
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 229
  md: "You can find all the templates listed in the table in the admin console (**Users\
    \ & Groups| Frontend User Management**) on the corresponding tabs. **Forgot Password\
    \ Templates** and **Lost Username Templates** include verification forms as well.\n\
    \nTo see the verification form for **Forgot Password**, click on the link **Forgot\
    \ Your Password?** below the login form on the website, enter the **Username**,\
    \ and click on **Submit**. Check incoming mails for the subject **Lost Password**\
    \ sent out from your website. If you do not get an e-mail (has your customer entered\
    \ a real e-mail?), then you have to check the configuration of the **CMSMailer**\
    \ module, as explained in Chapter 2, *Getting Started*.\n\nThe text of e-mail\
    \ messages sent by the **FrontEndUsers** module cannot be changed in the admin\
    \ area of the module. These messages are stored in the language files and can\
    \ be edited with **Translation Manager**, which will be explained in Chapter 10,\
    \ *Advanced Use of CMS Made Simple*.\n\n# Creating protected pages\n\nProtected\
    \ pages can be viewed only by registered members, and as you have already installed\
    \ the **FrontEndUsers** module, you can continue with creating protected pages.\n\
    \nTo protect content pages, you have to install the module called **CustomContent**.\
    \ The module **CustomContent**, in conjunction with the module **FrontEndUsers**,\
    \ allows creating protected pages that will be accessible only by logged users.\
    \ Open **Extensions | Module Manager**, and click on the tab for available modules\
    \ with the letter **C**, search for the module **CustomContent**, and click on\
    \ the link **Download & Install**. The module is installed. This module does not\
    \ have any admin area. Nevertheless, you can access the module help from the list\
    \ of installed modules (**Extensions | Modules**) by clicking on the module name.\n\
    \nYou will find an example in the **How Do I Use It** section, that we are going\
    \ to alternate for our purpose. The smarty IF condition checks if the user is\
    \ logged or not and displays different content depending on it.\n\n```\n{if $customcontent_loggedin\
    \ > 0}\n    Welcome <b>{$customcontent_loginname}</b><br/>\n{else}\n    <h1>You\
    \ are not authorized to view this data</h1>\n{/if}\n```\n\nIf the Smarty variable\
    \ `$customcontent_loggedin` is greater than 0, then the user is authorized to\
    \ see the content, otherwise a message that the user is not authorized is displayed.\
    \ We are going to protect the **Service Desk** page. If the user is not logged\
    \ in, then no content should be shown on the page except the login form."
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Time for action – protecting the service desk


    Now, let us protect the Service Desk page so that its main content can only be
    viewed by registered members. If the user is not logged in, only the login form
    should be shown.


    +   1. In the admin console, open the Service Desk page for editing (Content |
    Pages).

    +   2. Click on the Options tab, and mark the page to be not cachable and not
    searchable, as shown in the following screenshot:

    +   3. Switch to the Main tab, and fill in the content field, as shown in the
    following screenshot:

    +   4. Click on Apply.

    +   5. View the page as a logged in user as well as a logged out user.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_230_0.png)


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_230_1.png)'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# What just happened?


    You have protected a part of the page content from being viewed by an unauthorized
    user. You have set the page as not cachable first. It is important to do it with
    every page that should be protected or every page that contains the login form.
    Cached pages would also cache the login status of the user and show him as logged
    in even if he is logged out.


    The page should not be searchable as it would not make sense to show it in the
    search results to the non-authorized users.


    In the Content field, the login form (if the user is not logged in) or logout
    form (if the user is logged in) is displayed. The form will automatically change
    depending on the user''s status. Everything passed between the smarty tags IF
    is only shown to the logged in users.


    In this way, you can protect every page or only a part of the content depending
    on whether the user is authorized or not.


    # Creating user area for support requests


    A support ticket system is an area where your customers can place their questions
    about your products or services. This area is private and cannot be seen by website
    visitors or other customers. When the question is placed in the support ticket
    area, the support staff can give the customer an answer to it. If the issue is
    not resolved by an answer, the customer can respond to the answer and the staff
    answers again. This dialog (questions and answers) is organized as one ticket.
    If the customer has another question, then he can open another ticket. In the
    private service desk, the customer can always see the list of his tickets and
    read the answers given from the staff. A support ticket system is often used in
    the professional customer care.


    To create a support ticket system, you do not need a special support ticket module.
    Let us see how you can use the feedback module to create service desk functionality.
    The name of the module in question is CGFeedback. This module is developed to
    allow website visitors to provide comments on individual pages, news articles,
    products, or other items on your website. We will use the functionality of this
    module to create a rudimentary support ticket system.


    In the admin console, click on Extensions | Module Manager, and search on the
    Available Modules tab for the module CGFeedback. Click on the Dependencies link
    to figure out what modules should be installed first. You will see the following
    modules:


    +   - CGExtensions

    +   - CGSimpleSmarty'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'Install these modules first, and then install the CGFeedback module. The simplest
    way to use the module is to include the following Smarty tag at the bottom of
    any page content:


    ```

    {CGFeedback}

    ```


    This will create a comment form and allows visitors to enter comments and ratings
    about that particular page. To display those comments, you would add another tag
    below the preceding tag:


    ```

    {CGFeedback action="summary"}

    ```


    These tags can be optionally placed in page templates or in module templates.
    If nothing else is defined, then the comments are automatically attached to the
    page where they have been made. If you would like to allow comments on module
    items like news articles, you should use two additional parameters:


    ```

    {CGFeedback key1="News" key2=$entry->id}

    ```


    There are two parameters, key1 and key2. Each parameter can be filled with different
    values. In the preceding example, the parameter key1 is filled with the value
    News so that ordinary page comments can be differed from the comments on news
    article. The second key saves the number ($id) of the news article to be sure
    that a comment is only shown on the page with this particular news item displayed
    in detailed view.


    When comments are added, they are saved in the database with the values given
    in both parameters (key1 and key2) like "comment for the news article with particular
    ID". Why should we not use this functionality to manage comments that are attached
    to one particular logged user? The first parameter, key1, will separate page comments
    from tickets. From Chapter 4, Design and Layout, we know that there are some Smarty
    variables that exist in every page. One of those variables is provided by the
    module FrontEndUsers and is called $userid. This variable exists only if the user
    is logged in and contains the user ID. By placing the following two lines into
    the page content, you say "save and display comments for the particular logged
    in user":


    ```

    {CGFeedback key1="Ticket" key2=$userid}

    {CGFeedback key1="Ticket" key2=$userid action="summary"}

    ```'
  merge: -1
  img_proc: true
- pgno: 233
