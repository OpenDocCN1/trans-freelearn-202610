- pgno: 235
  md: 'Now, the comment form is displayed with the template **NewTicket**. Additionally,
    the form is redirected to the same page after the question has been submitted
    due to the parameter `policy`.


    To test the module, create some new tickets with two different customers to see
    how exactly they are separated, depending on which customer is currently logged
    in. We will customize templates for summary and detail view later on.


    Now, let''s see how we can implement the possibility of answering the tickets
    from the admin console by the support staff.


    # Adding answer fields to the tickets


    We are now going to create two custom fields in the module **CGFeedback**. The
    first one will contain the name of the support staff answering the ticket. The
    second field will contain the answer.


    # Time for action – creating new fields


    Support staff should be able to answer to the support tickets and store their
    names to each answer as well. Let''s create the new fields that will contain this
    information.


    +   1. In the admin console, click on **Content | Calguys Feedback Module**, and
    select the **Fields** tab.

    +   2. Click on **Add a new field**, which contains the names of the support staff
    as shown in the following screenshot:

    +   3. Click on **Submit**.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_235_0.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: '4. Then, add another field that will contain the answer text from the support
    staff, as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_236_0.png)


    5. Click on Submit.


    6. In the admin console, open an existing ticket (Content | Calguys Feedback Module)
    for edit and find both custom fields at the edit screen.


    # What just happened?


    You have added two custom fields. From now you can enter an answer to the ticket
    in the admin console as if you were a support staff. The answer will appear on
    the website when the detail view template is customized properly. This will be
    described later in this chapter.


    # Templates for ticket list and ticket detail view


    Before customizing a detail view, let''s create a new summary template. The summary
    view is used below the ticket submission form to show a list of all tickets submitted
    by one customer on the page Service Desk. The title of each ticket is linked with
    the detailed view of the ticket, where the answer from the staff is shown.


    # Time for action – customizing list of tickets


    The appearance of the list of tickets created by the customer and shown to him
    should be changed to meet our needs.


    +   1. In the admin console, click on Content | Calguys Feedback Module, and choose
    the Summary Templates tab.


    +   2. Click on New Template, and enter TicketList as the Template Name.'
