    # What just happened?


    With the Smarty `{get_template_vars}` plugin, you displayed all **Smarty variables**
    available in your template. In the list of variables on each line, one variable
    is displayed with its name and its value separated by an equals sign. These values
    change from page to page. For example, the variable with the name `friendly_position`
    contains the position of the page in the page hierarchy. If you navigate to other
    pages, you will see that the value of this variable is different on every page.


    How do you add a variable in your template? Smarty variables are enclosed in curly
    brackets as well, but unlike the Smarty plugins, they have a dollar sign at the
    beginning. To use the variable `friendly_position`, you just need to add the following
    Smarty tag to your template:


    ```

    ```smarty

    {$friendly_position}

    ```

    ```'
