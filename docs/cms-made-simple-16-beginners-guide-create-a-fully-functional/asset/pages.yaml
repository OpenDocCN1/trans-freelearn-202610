- pgno: 32
  md: '# 2

    Getting Started


    > Before you start creating a website with CMS Made Simple, you have to install
    the application on your web hosting and make some important configurations that
    will have an impact on everything you do with the website in future. To install
    CMS Made Simple, you should understand what is web hosting. You should be able
    to create an empty database in your web hosting account and upload CMS Made Simple''s
    installation files through FTP.


    In this chapter, we will:


    +   - Install CMS Made Simple

    +   - Learn about the admin console and how it is organized

    +   - Finish the installation

    +   - Configure the e-mail settings


    CMS Made Simple is a PHP application that uses a MySQL database. This means that
    you need web hosting with PHP and MySQL to run CMS Made Simple. You can install
    a web server on a local PC for testing environments and/or on remote web hosting
    for live websites. The requirements for CMS Made Simple are as follows:


    +   - Web server on Linux/Unix or Windows 2000/XP/ME/2003 or OS X

    +   - PHP 5.2.x (not PHP 5.3)

    +     - `safe_mode` should be off

    +     - At least 16 MB of available memory for PHP

    +     - PHP tokenizer support enabled

    +     - At least one of ImageMagick or GDlib enabled

    +   - MySQL 4.1+ or PostgreSQL 7+

    +   - Enough access to your server to upload files and change some permissions'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Getting Started


    These requirements are not special and are covered by most hosting providers.
    To test CMS Made Simple for free without any obligation, you can even set up CMS
    Made Simple on free web hosting that meets the requirements stated. If in doubt,
    ask on the CMS Made Simple forum (http://forum.cmsmadesimple.org) for any hosting
    recommendations.


    # Installing CMS Made Simple step-by-step


    The CMS Made Simple installer is started automatically when you enter your domain
    name in the address bar of the browser. The installer assists you step-by-step
    during the entire installation process.


    # Choosing a language


    First you choose the installation language. In the drop-down field, you see all
    languages available in the installation package. In the base version of CMS Made
    Simple, you can choose only English. The full version has more languages included.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_33_0.png)


    Consider that the language you choose here is used only during the installation.
    The language of the website and admin console can be changed later on. Click on
    **Submit**.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Step 1: Validating file integrity (optional)


    In the first step, you can optionally validate the integrity of the installation
    file. This will help you identify potential problems, for example if some files
    have been damaged during FTP transfer or are incomplete due to network issues.
    If there were no issues while uploading the files to the web hosting, then ignore
    this step and click on Continue. Validation can also be done any time after the
    installation is complete.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_34_0.png)


    If you would like to validate, then you will need the checksum file corresponding
    to your version: `cmsmadesimple-1.6.6-full-checksum.dat` or `cmsmadesimple-1.6.6-base-checksum.dat`.
    This file is available for download from the official website. Go to http://cmsmadesimple.org,
    click Downloads | CMSMS Releases, and save the checksum file to your local disk.
    Choose the file in the field above, and click on Test.


    This step is optional. Click on Continue.'
  merge: -1
  img_proc: true
- pgno: 35
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 36
  md: 'If the file does not exist, create an empty file named `config.php` in a text
    editor (not a word processor). In Windows, open Notepad (this text editor comes
    with Windows), and without typing anything in the document, click on **File |
    Save As**. Choose a location to save the file, and use "config.php" (including
    the quotes) as the filename to ensure that the right extension (.php) is used.
    Upload that file via FTP to the folder where the CMS Made Simple installation
    files were uploaded. The config.php file should be in the same folder as the index.php
    file, as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_36_0.png)


    Check if the file you have created and uploaded has the file type PHP (some editors
    may append .txt extension to the end of the filename). If necessary, rename the
    file to `config.php`.


    If the file already exists, open FileZilla or any other browser of your choice
    and right-click on it. Choose **File permissions** and enter 777 in the **Numeric
    value** field. Click on OK.


    Go back to your browser, and click on **Try again** at the end of the settings
    check; the failure should disappear.


    If you have other failures or warnings in the **Required settings** section and
    if you''re unsure how to handle them, then take a screenshot of the page, and
    send it to your provider. He/she will help you to solve the problem.'
  merge: -1
  img_proc: true
- pgno: 37
