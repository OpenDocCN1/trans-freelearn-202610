- pgno: 180
  md: '# # Using Third-party Modules


    *CMS Made Simple has only some basic features that belong to the standard installation.
    Any additional functionality can be installed with other modules. Think of CMS
    Made Simple modules as Lego bricks. Modules can be installed in any combination
    you choose. Some modules are combinable with or even dependant on other modules.
    Modules are additional features that anyone can put on their website.*


    To choose and install new modules, click on **Extensions | Module Manager** in
    the admin console. Notice that the modules listed here are not standard modules
    of CMS Made Simple and therefore not all of them are of the same high quality
    as the core modules. That is why you see the message "*Use at Your Own Risk*"
    above the list of modules. Nevertheless, there are many modules which are very
    useful, sophisticated, and were thoroughly tested by their developers.


    The **Available Modules** tab facilitates the installation of packages you already
    know about. The modules are sorted alphabetically by their names and a good explanation
    about them can be found by clicking on the **Help** link beside the module name.


    In this chapter, we shall install and use the following:


    +   - Gallery

    +   - Form Builder

    +   - Newsletter

    +   - YouTube videos


    So, let''s get started with it...'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Creating a photo gallery


    The most popular feature for websites is a photo gallery. Photo galleries are
    popular parts of private portfolios, music bands'', or company websites. On a
    business website, photo galleries are often used to display office buildings or
    photos of the team members. Products, samples, or results of the projects are
    often implemented as photo galleries as well.


    If you are not using any special module for gallery, you could upload all images
    in one folder on your web hosting and manually add each image to the content page.
    This kind of static gallery is difficult to maintain and design. It is not flexible
    enough and requires deep HTML knowledge from the page editor.


    A better solution is to use a special module that will read a folder on the web
    host and display all images from this folder using some impressive blending effects.
    The module will offer a special admin area where each image''s caption can be
    entered.


    To install the Gallery module, log in to admin console and click on Extensions
    | Module Manager. On the Available Modules tab, click the letter G in the alphabetical
    navigation, and find the module called Gallery. Click the Download & Install link
    in line with the module name. The module will be installed.


    After installation of the Gallery module, a new folder called uploads/images/Gallery
    will be automatically created on your web hosting. This folder is empty by default,
    so you have to upload some images into it. You can upload images with Image Manager
    or File Manager or even with an FTP browser if you have a lot of images to upload.


    # Time for action – creating the first gallery


    Let''s see how images from the folder uploads/images/Gallery can be displayed
    on the Photo Gallery page. Perform the following steps:


    +   1. In the admin console, open the Photo Gallery page for editing (Content
    | Pages).

    +   2. Enter the Smarty plugin in the Content field, as shown in the following
    screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_181_0.png)'
  merge: -1
  img_proc: true
- pgno: 182
  md: '+   3. Click on **Apply** and then on the magnifying glass icon beside the
    **Apply** button to see the first gallery on the website.


    # What just happened?


    You have uploaded some images into the folder `/uploads/images/Gallery`. This
    folder was automatically created after the module installation. Your first gallery
    is displayed on the **Photo Gallery** page.


    You will find the admin area of the **Gallery** module in the admin console (**Content
    | Gallery**). Open the admin area, and click on the folder named `Gallery` to
    see what you can change in the module output. Change **Gallery Title** and **Comment**
    to suit your needs. Choose another **Template** for different blending effects
    in the gallery. If no template is specified for the gallery, then the default
    template (**Content | Gallery**, tab **Templates**) is used.


    The size of thumbnails (small preview versions of the images) is set to 96x96
    pixels (standard thumbnail size in CMS Made Simple). In the photo gallery, you
    can enter your own thumbnail size and then choose any of the following resize
    methods:


    +   - **crop**: Crops the original image to the thumbnail size taking smaller
    detail of the image. Proportions of the original image are ignored.

    +   - **scale**: This will resize the original image to the custom thumbnail size.
    The proportions of the original image are held, so that only the width or height
    can be taken into account while resizing.

    +   - **zoom & crop**: This is the same as ''crop'', but the details of the image
    are slightly zoomed. Crops the original image to the thumbnail size while taking
    zoomed details of the image. The proportions of the original image are ignored.

    +   - **zoom & scale**: The same as ''scale crop'', but the thumbnail is slightly
    zoomed. Resizes the original image to the custom thumbnail size. The proportions
    of the original image are held, so that only the width or height can be taken
    into account while resizing.


    When the thumbnail size is changed, you have to click on the link (**(Re)Create
    Thumbs** for the new thumbnails to be created.


    At the bottom of the screen, a list of the images that are uploaded into the folder
    `uploads/images/Gallery` are displayed. For each image, you can enter a **Title**
    (image caption) and a **Comment** (is not shown in any template by default). You
    can deactivate images rather than delete them. In this case, the image is not
    shown in the gallery, but the caption and comment will be kept.


    The images in the gallery are sorted alphabetically by their filenames.'
  merge: -1
  img_proc: true
- pgno: 183
  md: "# Adding albums to a gallery\n\nNew albums are created from new folders. Create\
    \ a new folder below the folder uploads/images/Gallery with File Manager or Image\
    \ Manager. Upload your images into the new folder. In the admin area of the Gallery\
    \ (Content | Gallery), find the new folder, and edit it the same way as your main\
    \ album.\n\nTo display images from one or more directories, use the parameter\
    \ dir. This parameter specifies the directory (or directories) where the images\
    \ are uploaded. For example, if you have created two folders below the /uploads/images/Gallery\
    \ and named them buildings and projects, then to display images from the folder\
    \ buildings only, use the Smarty tag as shown:\n\n```\n{Gallery dir=\"buildings\"\
    }\n```\n\nYou can override the template for the gallery directly in the Smarty\
    \ tag by adding the parameter template to it. If this parameter is not specified,\
    \ then the template assigned to the directory will be used, or else the default\
    \ template will be used.\n\n# Using the gallery on other pages\n\nUse images from\
    \ the gallery on other pages and not only in the page Photo Gallery. For example,\
    \ display recently added images from your gallery on the start page and link them\
    \ to the page where the entire gallery can be found.\n\n# Time for action – adding\
    \ random images to the template\n\nLet's add two recently added images from the\
    \ gallery to the start page of the website.\n\n+   1. In the admin console, click\
    \ on Content | Gallery, and choose the Templates tab.\n\n+   2. Click the Create\
    \ a new template link. Enter Latest as the template name and in the Template Source\
    \ field add the following Smarty code:\n\n```\n{foreach from=$images item=image}\n\
    \    <a href=\"{cms_selflink href=\"photo-gallery\"}\" title=\"{$image->title}\"\
    ><img src=\"{$image->thumb}\" alt=\"{$image->title}\" />\n    </a>\n{/foreach}\n\
    ```\n\nYou should replace photo-gallery in the example with the alias of the page\
    \ where the whole image gallery can be found.\n\n+   3. Delete everything from\
    \ the fields Template CSS-stylesheet and Template JavaScript.\n\n+   4. Click\
    \ on Save."
  merge: -1
  img_proc: true
- pgno: 184
  md: '5. In the admin console, open the start page for editing (Content | Pages).


    6. Add the Smarty tag to display the latest images from the gallery, as shown
    in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_184_0.png)


    7. Click Apply and see the result on the start page.


    # What just happened?


    You have created a new template for the Gallery module. This template displays
    two recently added images from the gallery. Each image is linked to the Photo
    Gallery page ({cms_selflink href="photo-gallery"}). Then, you have added the Smarty
    tag {Gallery action="showlatest" number="2" template="Latest"} to the start page.
    There are three parameters, which are as follows:


    +   - action="showlatest": Displays the most recently added images (by default,
    it displays a total of six images). Subdirectories are automatically included.

    +   - number="2": The maximum number of images to display. All images will be
    displayed if the value for this parameter is not specified.

    +   - template="Latest": Uses a separate database template for displaying the
    photo gallery. This template must exist. However, it does not need to be set as
    default. If this parameter is not specified, then the default template will be
    used.'
  merge: -1
  img_proc: true
- pgno: 185
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 186
  md: "This code was taken from the file `example.html` and was modified to use the\
    \ Smarty tag `foreach` to take all images from the gallery.\n\nProceed with the\
    \ stylesheet. On your local disk, open the file `jquery.ad-gallery.css`. This\
    \ file has to be slightly modified for the images to be found on the server. Find\
    \ any occurrences of:\n\n```\nbackground: url(\n```\n\nand replace them with:\n\
    \n```\nbackground: url(../../images/\n```\n\nThen, in the first line, adjust the\
    \ width of the entire gallery:\n\n```\nad-gallery {\n  width: 500px;\n}\n```\n\
    \nCopy the entire contents of the modified stylesheet, and replace the content\
    \ of the field **Template CSS-stylesheet** with it.\n\nIn the last step, copy\
    \ the following code, and replace the entire content in the field **Template JavaScript**:\n\
    \n```\n<script type=\"text/javascript\"\n  src=\"modules/Gallery/templates/jquery/jquery.js\"\
    ></script>\n<script type=\"text/javascript\"\n  src=\"modules/Gallery/templates/adgallery/jquery.ad-gallery.js\"\
    >\n</script>\n<script type=\"text/javascript\">\n$(function() {\n  var galleries\
    \ = $('.ad-gallery').adGallery();\n  $('#switch-effect').change(\n    function()\
    \ {\n      galleries[0].settings.effect = $(this).val();\n      return false;\n\
    \    }\n  );\n  $('#toggle-slideshow').click(\n    function() {\n      galleries[0].slideshow.toggle();\n\
    \      return false;\n    }\n  );\n});\n</script>\n```"
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Click on **Save**, and find the new template in the list of templates. Set
    the template as **Default** and see your photo gallery on the website. Your gallery
    is now using the AD Gallery plugin.

    In the same way, you can use any plugin for your gallery. Separate HTML, images,
    CSS, and JavaScript from each other and place them in the appropriate fields so
    that all required parts are composed on the website in the right order as before.


    # Adding forms with the module Form Builder


    Almost every business page has a contact, feedback, or inquiry form. The **Form
    Builder** module helps you to create forms with any level of complexity without
    writing any HTML. You can add different input fields to it, set validation rules,
    and define how the data from the form must be stored and/or sent by e-mail.


    Install the **Form Builder** module in the same way as you installed other third-party
    modules on the website (for example, **Questions** or **Gallery**). After installation,
    the admin area of the module can be found in **Extensions | Form Builder**.


    Before you start configuring the module, ensure that the module **CMSMailer**
    is properly configured (refer Chapter 2, *Getting Started*) and you are able to
    send e-mails from your CMS Made Simple website.


    # Time for action – adding a contact form to the website


    Let''s add a simple contact form to the **Contact Us** page and send the submitted
    content of the form to our e-mail address.


    +   1. In the admin console, click on **Extensions | Form Builder**.

    +   2. Click the **Contact Form** link.

    +   3. Scroll down to **Form Fields**, and click the **Send To** link.

    +   4. Replace the e-mail address in the fields "**From address**" for email and
    **Destination Email Address** with your real e-mail address, as shown in the following
    screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_187_0.png)'
  merge: -1
  img_proc: true
