- pgno: 4
  md: '# About the Reviewers


    **Jeremy Bass** began learning web construction at the age of 12 using the "view
    source" on sites such as the young Yahoo and the late GeoCities. Armed with a
    computer and a talent for the fine arts, he has been in computer-based graphics
    ever since. A few of the high points are stents at an international telescope
    (Gemini in Hawaii) and winning a Telly award for 3D animation. Currently, Jeremy
    works with Digital Barn Productions in Idaho, and Defined Clarity in Philadelphia
    along with freelancing and participation in the CMSMS community.


    > I would like to thank my wife, Aimee, for understanding I work long hours not
    just to grow, but for her and the kids. This was fun.


    **Yury V. Zaytsev** has an advanced degree in physics from the Nizhny Novgorod
    State University, Russia, and is currently working towards his doctorate in Computational
    Neuroscience at the University of Freiburg, Germany. Yury''s primary interests
    concern scientific computing, modeling, and simulation, particularly of the complex
    dynamics of large populations of neurons.


    Yury''s first contact with computers was at the age of 6 when he programmed his
    first text-based role-playing game in BASIC on a historical 80386 machine. This
    inspired a never ending passion for programming, which also led to a brief career
    at the age of 17 in freelance web development for companies in Russia, Europe,
    and overseas.


    Having successfully implemented many commercial and hobby projects with CMS Made
    Simple, Yury is happy to contribute to the widespread adoption of CMSMS for the
    benefit of both users and developers.'
