- pgno: 14
  md: '# Preface


    CMS Made Simple is an open source content management system that allows rapid
    website development in a fraction of the normal time, while avoiding hours of
    coding by providing modules and third-party add-ons. With this book in hand, you
    will be able to harness the power of this modular and extensible content management
    system at your fingertips.


    This guide for CMS Made Simple is based on practical and working solutions allowing
    you to understand how this powerful and simple application can support you in
    your daily work. The workshop helps you to create engaging, effective, and easy-to-use
    CMS websites for businesses, clubs, and organizations.


    This is a step-by-step case study, aimed at helping you to build a complete professional
    website with CMS Made Simple. You can take a ready-to-use template or implement
    your own custom design, enrich the website with features such as a photo gallery,
    an e-commerce solution with a PayPal checkout, and forms of any complexity or
    popular jQuery effects, and finish it off by optimizing it for search engines.
    The useful HTML and CSS code snippets are optimized and can be easily adapted
    for your own projects. Chapter-by-chapter, you will put yourself into the role
    of a web designer, developer, administrator, and business manager, thus learning
    every aspect needed for building rich websites that are very simple to manage.


    # What this book covers


    *Chapter 1, Building Websites with CMS Made Simple* introduces the case study
    website with its functional requirements.


    *Chapter 2, Getting Started* explains how to install CMS Made Simple, how its
    admin console is organized, and how to configure CMS Made Simple for sending out
    e-mails.


    *Chapter 3, Creating Pages and Navigation* focuses on creating, editing, and organizing
    pages. It introduces the page hierarchy and search engine friendly URLs. At the
    end of this chapter, you will have the complete page structure for the case study
    website.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Preface


    *Chapter 4, Design and Layout* explains how to create a new template and how to
    port a ready HTML/CSS design to CMS Made Simple. At the end of this chapter, you
    will be able to implement an individual design for a website.


    *Chapter 5, Using Core Modules* covers standard modules of CMS Made Simple, such
    as News, Search, Image and File Manager, and Printing (including built-in PDF
    output), and shows you how to install additional modules such as FAQ.


    *Chapter 6, Users and Permissions* explains how the permissions of different users
    can be organized in the admin console.


    *Chapter 7, Using Third-party Modules* explains how to implement a photo gallery
    with an individual design, add a contact form with custom fields, install Captcha
    functionality, manage newsletters, and implement YouTube videos on the website.


    *Chapter 8, Creating Your Own functionality* introduces two approaches to creating
    your own functionality. In the first part, you learn how to use the module maker
    to create a product catalog. In the second part, you learn how to create a service
    desk functionality using a module.


    *Chapter 9, E-commerce Workshop* covers a step-by-step workshop to see how an
    e-commerce shop with a PayPal checkout can be realized with the e-commerce suite.


    *Chapter 10, Advanced Use of CMS Made Simple* explains how to create multilingual
    websites, make search engine optimizations, and use jQuery plugins in the navigation
    of the website. The integration of a visitor statistic and some advanced techniques
    enrich the functionality of the case study website.


    *Chapter 11, Administration and Troubleshooting* explains how to keep your website
    up-to-date and secure and how to do some performance tuning. At the end of the
    chapter, you will get an answer to the question "How can I get quick help in the
    forum?"


    *Appendix, Pop Quiz Answers* contains the answers to the pop quizzes throughout
    the book.


    # What you need for this book


    CMS Made Simple is a PHP application that uses a MySQL database. This means that
    you need a web hosting with PHP and MySQL to run CMS Made Simple. You can install
    a web server on your local PC for testing environments and/or on the remote web
    hosting for live websites. The requirements for CMS Made Simple are as follows:


    +   - Web server on Linux/Unix or Windows 2000/XP/ME/2003 or OS X

    +   - PHP 5.2.x (NOT PHP 5.3)

    +     - `safe_mode` should be off

    +     - At least 16 MB of available memory for PHP'
  merge: -1
  img_proc: true
- pgno: 16
  md: '+   o PHP tokenizer support enabled

    +    o At least one of ImageMagick or GDlib enabled

    +    • MySQL 4.1+ or PostgreSQL 7+

    +    • Enough access to your server to upload files and change some permissions


    # Who this book is for


    This book is perfect for newcomers as well as webmasters who are looking for an
    introduction to building powerful and professional websites with a content management
    system. Basic knowledge of HTML and CSS is the only requirement. The workshop
    covers all aspects of web publishing and is aimed for web designers, web developers,
    editors, and web managers.


    # Conventions


    In this book, you will find several headings appearing frequently.


    To give clear instructions of how to complete a procedure or task, we use:


    # Time for action – heading


    +   1. Action 1

    +   2. Action 2

    +   3. Action 3


    Instructions often need some extra explanation so that they make sense, so they
    are followed with:


    # What just happened?


    This heading explains the working of tasks or instructions that you have just
    completed.


    You will also find some other learning aids in the book, including:


    # Pop quiz – heading


    These are short multiple choice questions intended to help you test your own understanding.'
  merge: -1
  img_proc: true
