- pgno: 141
  md: "# *Using Core Modules*\n\n+   7. Click on the green tick mark again to apply\
    \ the changes. When the image has been saved, you can close the window.\n+   \n\
    +   8. Refresh the page with the image thumbnails or open **Image Manager** again\
    \ (**Content | Images**). The new version of the image with the changes applied\
    \ is now shown in the list of available images.\n\n# **What just happened?**\n\
    \nYou have uploaded a new image to CMS Made Simple. After uploading, a 96x96 pixels\
    \ thumbnail (small version of the picture used for previewing) is automatically\
    \ created by CMS. You have changed the size of the image and then saved it at\
    \ a lower quality to reduce the weight in kilobytes as well. Choosing a quality\
    \ of 60 percent to 85 percent for JPEG images will not cause any visible quality\
    \ loss. Try it out. Your original image will not be changed after saving, but\
    \ a new version of the image will be created. You can delete the new version at\
    \ any time and start with the original picture once again if you have made a mistake.\n\
    \nFor more advanced graphical work, you can use special graphics applications\
    \ such as the free GIMP or the commercial Adobe Photoshop.\n\nWith an FTP browser,\
    \ you can find your image files and automatically created thumbnails in the directory\
    \ `/uploads/images`. If you have a lot of images, you can upload them to this\
    \ directory using an FTP browser in this directory as well. However if you do\
    \ this, the thumbnails are not created automatically. After uploading through\
    \ FTP, you have to open **Content | Image Manager**. The **Image Manager** will\
    \ discover the newly uploaded files and then create the missing thumbnails.\n\n\
    Thumbnails' filenames are prefixed with `thumb_`. For example, the image file\
    \ `city.jpg` will get an automatically generated thumbnail with the name `thumb_city.jpg`\
    \ in the same folder where the original image was uploaded.\n\n# **Using images\
    \ in template and content**\n\nThe uploaded images can be used in the content\
    \ of the pages with the WYSIWYG editor (refer Chapter 3, *Creating Pages and Navigation*).\
    \ Normally, the editor of the content does not have the ability to change the\
    \ template of the website. But there is also a functionality that can help him/her\
    \ to assign an image to the page and display it anywhere in the template.\n\n\
    Consider that the design (template) and the text can be strictly separated from\
    \ each other in CMS Made Simple. In order to give a little more responsibility\
    \ for the appearance of the site to the editor, you can allow him to change the\
    \ pictures of the template in a defined way."
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Let''s create a new image that can be chosen by the editor of the page to be
    displayed above the navigation. First of all, create two images having a width
    of 800 pixels and height of about 100 pixels. Name them pageimage1.jpg and pageimage2.jpg.
    Upload the images with **Image Manager** to CMS Made Simple. Do not upload them
    to subfolders, but directly to the start folder of **Image Manager** (`uploads/images`).


    In the admin console, open any page (**Content | Pages**). Choose the **Options**
    tab, and in the **Image** field, select the picture you would like to associate
    with this page, as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_142_0.png)


    Do the same with other pages and assign other images to them.


    > If you cannot see the image in the drop-down field, then it is not uploaded
    into the right folder. Page images have to be found in **Content | Image Manager**
    or `/uploads/images` (not subfolder) on the web server.


    Then add the image to the template. Open the **Business World** template (**Layout
    | Templates**), and add the page image to display it:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>{title} - {sitename}</title>

    {stylesheet}

    {metadata}

    <meta name="description" content="" />

    </head>

    <body>

    <div id="container">

    <div id="header">

    businessWorld

    </div>

    ```'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Using Core Modules


    ```

    ```html

    <img src="uploads/images/{page_image}" width="800" height="100"

    alt="{title}" />

    <div id="top-navi">

    {menu number_of_levels="1" template="minimal_menu.tpl"}

    </div>

    <div id="content">

    <h1>{title}</h1>

    {content}

    </div>

    ...

    ```

    ```


    Now the editor of the page can select from the predefined images to display them
    in the template without having to modify the template itself.


    # Using Menu Manager in content


    You have already worked with the **Menu Manager** to create top, sidebar, and
    footer navigation for the website. Top navigation displays pages that are placed
    on the first level of the page hierarchy. Sidebar navigation automatically displays
    only the children of the page selected in the top navigation. Navigation in the
    footer includes all pages independent of their position in the hierarchy.


    Additionally, you can display the complete website structure (or some parts of
    it) in the **Content** field as well. In this way, you can easily output a sitemap
    that helps your visitors to find the required information on your website.


    # Time for action – creating a sitemap


    Let''s create a sitemap in the page **Sitemap** that we had created in Chapter
    3, *Creating Pages and Navigation*. If you do not have the page, then please create
    it now.


    +   1. In the admin console, open the page **Sitemap (Content | Pages)**.

    +   2. Add the Smarty tag `{menu template="minimal_menu.tpl"}` to the content
    of the page.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '3. Click on Apply, and use the magnifying glass icon beside the button Apply
    to see the result on the website. It should look as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_144_0.png)


    # What just happened?


    Using the already known Smarty tag {menu}, you have added a sitemap to the website.
    It displays the complete structure of the website with all pages that are marked
    as Shown in Menu (tab Options). You can refine the output of the {menu} tag with
    further parameters:


    +   - show_all="1": This option will show all pages even if they are set to not
    be shown in the menu. However, it still will not display inactive pages.

    +   - number_of_levels="1": This setting will help to limit the output to a certain
    number of levels.


    You can combine as many parameters as you like. For example, to display all active
    pages and to limit the hierarchy by two levels, you would add the following line:


    ```

    {menu show_all="1" number_of_levels="2"}

    ```'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Another example of the use of an additional navigation option in the content
    is the list of pages (not news articles) on the start page independent of their
    actual position in the hierarchy. Assume that you would like to create some kind
    of quick navigation on your start page giving the visitor the possibility to access
    some pages directly from the start page. To create a list of subpages, use one
    of the following parameters in the content of the start page:


    +   - `start_element="1.2"`: Displays the list of pages starting at the given
    start_element (position in the hierarchy) and shows that element and its children
    only

    +   - `start_page="home"`: Displays the list of pages at the given start_page
    (alias of the page) and shows that element and its children only


    It''s up to you, which of the two parameters you prefer to use. Surely you can
    simply create the list of links to the pages manually. But in this case, the list
    is not dynamic. If new pages are added, then you have to add them manually to
    the link list as well. If you use the Smarty tag `{menu}` instead, it automatically
    displays all new pages as well.


    Another useful parameter is:


    +   - `show_root_siblings="1"`: This option only becomes useful if the start_element
    or start_page parameters (as shown previously) are used. It will display pages
    in the same level as the selected start page or element.


    See the following example for page structure and how it can be outputted on every
    page with different parameters:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_145_0.png)'
