- pgno: 137
  md: '3. Click on Submit and view your page in the browser, it should look as shown
    in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_137_0.png)


    # What just happened?


    You have added the search feature to your website. It works out of the box if
    you try to search in the content of your pages or news articles.


    You can define the list of Stop Words in the admin console (Extensions | Search
    | Options). These words are excluded from the search index, and there is also
    a predefined list of common stop words for your convenience. Normally, you would
    add your company name or any word that can be found on every page or in templates.
    To avoid that, search functions show all pages in the found results. You can add
    your custom words separated by a comma at the end of the list or define your own
    list. Do not forget to click on the button Reindex All Content after saving the
    list of stop words. It would create a new search index for your website.


    If your website is in English, you can use a word stemming search. This means
    that the words in the search index are reduced to their stem, base, or root form.
    For example, you have a content page where the word steps is found and indexed.
    However, the visitor of your website searches for step. Without activating the
    stemming feature, nothing is found as literally step is not the same as steps.
    With stemming search, all forms of the search word are considered, such as "step",
    "steps", and even "stepped".


    Excluding pages from search

    If you would like some pages, like Policy or Disclaimer to be excluded from search,
    then open the page that you would like to exclude in the admin console (Content
    | Pages) and select the Options tab. Deselect the field This page is searchable,
    and save the page. Now the page is not found even if the searched word appears
    on this page.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'You can customize the template of the search template (search field itself)
    and search result template in the admin console (Extensions | Search). As usual,
    you use a mix of HTML and Smarty tags to change the order of the elements. Use
    stylesheet to change to suit the form into your layout.


    If you would like to output search results in the template different from the
    main one, you have to create the desired template yourself (you have learned how
    to create templates in the previous chapter) and assign the template to the page
    where the search results should be shown. The alias of this page should be passed
    to the parameter resultpage as shown in the example. Modify the Smarty tag {search}
    by adding the parameter resultpage as follows:


    ```

    {search resultpage="search-result"}

    ```


    You have to assign the alias of the page created previously to the parameter resultpage,
    so that the search results are always shown on this page now.


    The search feature also tracks the search activity on your website and allows
    you to figure out what the visitors of your website need or miss. You can track
    single search words or phrases to see how often they have been used by the visitors.
    In the Options tab of the Search module (Extensions | Search), you can select
    Track Search Phrases, not Individual Words to enable statistic for phrases.


    The Search module of CMS Made Simple is not as sophisticated as large search engines.
    You can use customized Google search for your website if you would like to show
    the searched words in the text and have stemming features for languages other
    than English. But if your website is not indexed in Google, then you do not have
    any other option but to use the standard search feature of CMS Made Simple.


    # Browsing files with File Manager


    You can upload any files in CMS Made Simple with File Manager. File Manager is
    like a built-in FTP browser where you can upload, move, delete, and copy files
    or directories. In the admin console, open Content | File Manager, and find the
    list of all the files that are saved in the folder uploads on your web hosting.


    On the Upload files tab, you can upload more than one file or even an archive
    file that will be unpacked after uploading in this folder.


    On the Settings tab, you can enable the advanced mode that will let you gain access
    to the whole file structure of your CMS Made Simple website so that File Manager
    is no longer restricted to the folder uploads. Be careful with this setting, as
    you can easily move and delete core files of CMS Made Simple, and as a result,
    damage your entire website.


    If you would like to upload and edit images, then you should use Image Manager.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Using Image Manager


    Surely, you would like to add images to your website. Whether they are placed
    in the content of your pages or used in templates or photo galleries, they have
    to be uploaded to your web host first. You should optimize your images before
    displaying them on your website. Do not upload images that are larger than 200KB.
    This restriction is not from CMS Made Simple. You can upload and display even
    larger images with Image Manager. The restriction is suggested in consideration
    of your visitors who want your website to load quickly. If you use large images,
    your website will load very slowly, and a certain percentage of your visitors
    will close the browser before they have seen what you offer on the website.


    > The rule of thumb

    > One image should not be larger than 20KB and all images on one page together
    should not account for more than 200KB.


    Resize your images with graphics program before using them on the website. Or,
    use the built-in image editor in CMS Made Simple to resize, crop, rotate, and
    flip your images.


    Let us upload some images to CMS Made Simple, edit, and display them on the page
    or in the template. There are three formats that can be displayed by any browser—JPG
    (or JPEG), GIF, and PNG. No other graphics should be used on the websites, because
    some browsers on some operating systems will not display BMP, TIFF, PSD, or other
    files. Prepare one image that you will use for the next step on your local disk
    with any graphics application.


    # Time for action – using the image editor


    Assume we have an image that is too large for the page. Ideally, you have to create
    images with a graphics application before uploading them to your web hosting.
    But if you have no graphics application or would just like to make few quick changes,
    you can use the built-in Image Manager for the task.


    +   1. In the admin console, open Content | Image Manager.

    +   2. Choose the image you would like to upload in the field Upload File at the
    bottom of the page, and click on Send.

    +   3. When the image is uploaded, click on the edit icon below the image to start
    the image editor.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '**4.** Resize the physical size of the picture to the required width and height
    in pixels by clicking on **Resize** in the left control panel and giving the desired
    dimensions in the fields above the image.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_140_0.png)


    **5.** Click on the icon with a green tick mark above the image to apply the changes.


    **6.** Click on the **Save** icon in the left control panel, and choose the image
    format for the resized image, as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_140_1.png)'
  merge: -1
