- pgno: 147
  md: '# What just happened?


    With the custom Smarty tag {print}, you use the core module Printing. At the place
    where you have added the tag, a link Print this page is displayed. When you click
    on the link, a new page is opened with a print friendly version of the page. It
    does not have any special styles in it, and it does not display a main template
    but only the content of the page.


    There are some useful parameters that help you to customize the link Print this
    page and its behavior.


    +   - text="Print this page": Overrides the default text for the print link.

    +   - popup="false": Set this to true and the page for printing will be opened
    in a new window. Be careful, some browsers block popup windows!

    +   - script="false": Set this to true and the print version will automatically
    open the print dialog of the browser.

    +   - includetemplate="false": If this is set to true, not only the content of
    the page, but the whole page template including the content of the page, header,
    navigation, and footer area will be displayed.

    +   - showbutton="false": Set this to true to show a graphical button instead
    of the text Print this page.


    If the preceding parameters do not offer enough ways for you to customize the
    look and feel of the print link and print view, you are free to customize the
    module in the admin console (Extensions | Printing). There are four tabs:


    +   - **Link template**: The template that is used to display the link to the
    print (or PDF) version of your website.

    +   - **Print template**: The template that is used to display the print version.
    You can add your own HTML markup here, like URL of the website, website company,
    or contact details, so that this information is automatically displayed in the
    print version of the website.

    +   - **Override print stylesheet**: Gives you the possibility to insert your
    own, custom CSS to the print version. Normally, you would use it to define the
    font size and set it in points as often used in print works.

    +   - **PDF settings**: We will discuss this tab later in the section *Generating
    a PDF version of the page.*'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Adding media type to stylesheets


    Sometimes a visitor of the page does not use the special print button but the
    default print dialog of the browser. In this case, the whole page is printed out,
    as shown on the screen. You can use media type for the stylesheets to customize
    the printed version in this case as well. In pure CSS, you can define different
    media types as HTML attributes in the link tags as follows:


    ```

    <link rel="stylesheet" type="text/css" media="screen" href="sheet.css">

    <link rel="stylesheet" type="text/css" media="print" href="print.css">

    ```


    In CMS Made Simple, you add the Smarty tag {stylesheet} to the template that generates
    the HTML link tags automatically, so that you cannot add HTML attribute media
    to it. Nevertheless, you can attach two different stylesheets to your template
    and mark them as screen, print, or any other allowed type.


    In the admin console, open your stylesheet (Layout | Stylesheets) for editing
    and scroll down to the Media Type section:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_148_0.png)


    Select the media types that you would like to serve with this stylesheet, for
    example, screen. To add a special stylesheet containing formatting for the print
    view of your page, create a new stylesheet with print formats. Select print as
    the media type in the Media Type section (see the preceding screenshot), then
    attach this stylesheet to the template. CMS Made Simple will automatically add
    the HTML attribute media to the link tags generated at the place where {stylesheet}
    was added to the template.'
  merge: -1
  img_proc: true
