- pgno: 77
  md: '# Summary


    In this chapter, you learned how easily pages can be created and managed. You
    saw that the navigation of your website is built automatically from the existing
    pages.


    Specifically, we covered the following:


    +   - **Creating pages:** You can create new pages from scratch or as a copy of
    an existing page.

    +   - **Editing pages:** You can change everything on the page after it has been
    created, such as title, content, menu text, or page alias.

    +   - **Adding meta tags:** Meta tags can be defined globally, if they are the
    same for each page. For individual meta tags on each specific page, you use the
    field **Page Specific Metadata** in the **Options** tab.

    +   - **Page hierarchy:** Pages can be organized in a tree hierarchy. It helps
    to keep your pages structured and control the top and subnavigation of the website
    intuitively.

    +   - **Search engine friendly URLs:** You modified the URLs for your pages. It
    gives you clean and pretty URLs that are quite noticeable for the visitors too.

    +   - **Navigation control:** Pages are displayed automatically in the navigation.
    You can control this behavior by hiding the pages from navigation (they are still
    accessible by the visitors with direct links). You can also set the page to inactive
    so that only you, as the website administrator, are able to see the content of
    the links.


    We also discussed how you create or change the start page of your website, gain
    more control by using different content types, or change multiple pages at once
    to save time.


    Now that we''ve created the website structure, we''re ready to start with the
    design and layout of our company website.'
  merge: -1
  img_proc: true
- pgno: 78
  md: "# # 4\n## Design and Layout\n\nIn this chapter, we will learn what templates\
    \ are. The strength of CMS Made Simple is its flexibility of design. Once you\
    \ have understood how you can combine your static HTML with the dynamic parts\
    \ of the website and format them with CSS, you will never lose control of your\
    \ design or layout in CMS.\n\n+   In this chapter, we will:\n+   \n+   - Work\
    \ with existing templates\n+   - Create our own template from scratch\n+   - Add\
    \ and organize stylesheets\n+   - Create and format navigation\n+   - Port HTML\
    \ templates to CMS Made Simple\n+   - Learn the basics of Smarty\n+   - Learn\
    \ about exporting templates\n\nCMS Made Simple uses various templates to display\
    \ the content of your website. To understand templates, think of them as predefined\
    \ layouts. Every time you create a new page, you choose a layout to define how\
    \ this page should look.\n\nYou can easily imagine a template as a wrapper for\
    \ your content. The wrapper (layout) is always the same; the content changes from\
    \ page-to-page. The editor of the website just adds content to the page and chooses\
    \ a template. CMS Made Simple will automatically display the page content for\
    \ the visitors within a chosen layout. Thus, the design and content are entirely\
    \ separated in CMS."
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Working with existing templates


    You will find all existing templates in your CMS in the admin console. Click on
    **Layout | Templates** to see all templates available in your installation. If
    you did not install any sample content, then only one template is available.


    In the strictest sense, we have to differentiate between templates and themes.
    A template is just a part of a theme. A theme consists of one or more templates
    and one or more stylesheets. Some themes optionally include menu templates as
    well. So if you talk about the complete design of your website, you should think
    about themes. Different page layouts (1-column, 2-column, or others) within one
    theme are called templates in CMS Made Simple.


    You can easily add ready-to-use templates to your website without any HTML or
    CSS knowledge by using some resources for the themes:


    +   - http://themes.cmsmadesimple.org

    +   - http://www.icms.info/cmsms-templates


    # Time for action – importing a ready-made template


    Let us see how to import a ready-made template into your installation.


    +   1. Download an XML file for your template from one of the addresses given
    above and save this file to your local disk.

    +   2. In the admin console, click on **Layout | Theme Manager**.

    +   3. Switch to the tab **Import** and choose the XML file from step 1 in the
    field **Upload Theme**.

    +   4. Click on **Import**.

    +   5. Go to **Layout | Templates** and find the new imported template in the
    list of templates.

    +   6. Click on the icon with a red cross in the **Active** column (the icon should
    change to a green tick).


    # What just happened?


    You have imported a new theme into your CMS Made Simple installation. A theme
    contains one or more templates (**Layout | Templates**), one or more stylesheets
    (**Layout | Stylesheets**) and sometimes menu templates as well (**Layout | Menu
    Manager**).'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'To test the template, open a page that you would like to see within the new
    template for editing (**Content | Pages**). Switch to the **Options** tab, and
    select the newly created template in the field **Template**. The screen is automatically
    redirected to the **Main** tab. Click on **Apply** and then on the icon with the
    magnifying glass icon beside the button **Apply** to see the changes on the page.
    Compare this page to other pages that use different templates.


    This wonderful principle of CMS Made Simple allows you to give each page its own
    look and feel. You can use different templates to separate some parts of your
    website. For example, you could use one template for the company website and a
    completely different template for the shop if you like. Designers often use different
    templates to enable one, two, or three columns layouts on different pages.


    To see which page uses what template, open the list of the current pages in the
    admin console (**Content | Pages**) and see the column **Template**.


    If you would like to use one template on all pages of your website, you can assign
    it to all pages at once. This function is especially useful if you already have
    a great number of pages. In the admin console, open the list of existing templates
    (**Layout | Templates**) and click the **Set All Pages** link beside the name
    of the template. This way, the template is assigned to all pages of your website
    with just one click.


    In the list of templates, you can also see that one template is set as default.
    When you create a new page, CMS Made Simple will automatically take the default
    template for the new page. Click on the icon with the red cross in the column
    **Default** beside the template name that you would like to use as the standard
    template.


    # Creating a new template


    Surely, it is easier to use ready-made templates for the website. However, you
    often need your own style for the website. In this section, we will learn how
    to create a new template from scratch.


    Templates in CMS Made Simple contain pure HTML. For dynamic parts of the layout,
    such as navigation or content, special placeholders are used. These placeholders
    are realized with the **Smarty** web template system. You use simple **Smarty
    tags** in your template to mark the places where dynamic parts in the pages are
    required. Smarty tags are placeholders that are substituted with simple text or
    even other HTML templates when the website is displayed in the browser. In contrast
    to HTML tags, Smarty tags are always enclosed in curly brackets.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Design and Layout


    # Time for action – creating a new template


    Let us see how you can easily create a new HTML template in CMS Made Simple:


    +   1. In the admin console of your website, select **Layout | Templates**.

    +   2. Click on **Add New Template** at the bottom of the list.

    +   3. On the next page, type the name of the new template, **My first template**.

    +   4. Add HTML source code to the **Content** field, as shown in the following
    screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_81_0.png)


    +   5. Click on **Submit**.

    +   6. In the list of templates, find your new template **My first template**,
    click on **Set All Pages** in the same line where your template name is, and confirm
    the message:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_81_1.png)'
  merge: -1
  img_proc: true
- pgno: 82
  md: "+   7. The message **All pages modified!** appears above the list of templates.\n\
    +   \n+   8. Click on the magnifying glass icon in the top-right corner of the\
    \ admin console to see the result (Google Chrome was used as the web browser in\
    \ this example):\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_82_0.png)\n\n# What\
    \ just happened?\n\nYou have created a new template with some simple HTML tags.\
    \ You have then instructed CMS to use this newly created template on all pages\
    \ of your website. In your browser, you see the exact output of the HTML code\
    \ you have added to the **Content** field of the template.\n\nYour template is\
    \ static now. It means that no individual part of the page, such as title of the\
    \ page or content, is displayed on the website. To mark the places where dynamic\
    \ content should be displayed, you have to use **Smarty tags**. These tags will\
    \ be substituted with an actual title or content when the page is loaded and displayed\
    \ in the browser.\n\n# Adding dynamic parts to templates\n\nLet us substitute\
    \ the static page title and content with individual content of the page."
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Time for action – adding Smarty tags to a template


    +   1. In the admin console, click on Layout | Templates, and click on My first
    template to open it for editing.

    +   2. Replace the static text for title and content with Smarty tags, as shown
    in the following screenshot:

    +   3. Click on Apply and then click on the magnifying glass icon in the top-right
    corner of the admin console to see the results of your changes. It should look
    as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_83_0.png)


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_83_1.png)


    # What just happened?


    You have replaced the static text in your template with placeholders called Smarty
    tags. These special tags are enclosed in curly brackets. When you see the page
    in your browser, the places where you have added Smarty tags in the HTML code
    are now replaced with actual content and the title of the page.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'To confirm that changes were made for each page and not only for the start
    page, open the current list of the pages (**Content | Pages**) in the admin console,
    and click on the magnifying glass icon beside some of the pages to display them
    in the browser. You should see that every page gets an individual title. The page
    content is displayed in the place where the tag `{content}` was added in the template.


    `{title}` and `{content}` are only two examples for custom CMS Smarty plugins
    that you can use in your template. Try out some of them from the following table
    to see what is displayed at the place where these Smarty tags are added.


    | Tag | Description |

    |---|---|

    | `{breadcrumbs}` | Prints a breadcrumb trail. |

    | `{created_date}` | Prints the date and time when the page was created. |

    | `{last_modified_by}` | Prints the ID of the user who has last edited the page.
    |

    | `{menu_text}` | Prints the text entered in the field **Menu Text** for the page.
    |

    | `{modified_date}` | Prints the date and time the page was last modified. |


    To try the plugins, just add the name of a plugin in the curly brackets to the
    template of your website in any place you like.


    The preceding tags hold different information about the actual page. There are
    also tags that hold global information about your website, such as the website''s
    name or the version of CMS Made Simple that is installed. They do not depend on
    the page where they are displayed and are the same on each page. Try them as well
    to see what information is displayed at the place where the tag is added.


    | Tag | Description |

    |---|---|

    | `{cms_version}` | Prints the current version number of your CMS. |

    | `{cms_versionname}` | Prints the current version name of your CMS. |

    | `{current_date}` | Prints the current date and time. |

    | `{root_url}` | Prints the URL location of your website. |

    | `{sitename}` | Prints the website name. The information can be changed in the
    admin console (**Site Admin | Global Settings | Site Name**). |


    With Smarty tags, you see the main principle of the separation of the code from
    design. As a designer, you do not need to know how the date of the last page modification
    is stored in the database (`{modified_date}`) and how exactly the location of
    the website is retrieved from the address line of the browser (`{root_url}`).
    You can just use the plugins declared above to retrieve the needed information.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Having control over the output


    If you have already tried some of the preceding tags, then you have probably noticed
    that sometimes the output is not exactly what you need. You can control the output
    of the tags using **Smarty parameters** (also called attributes).


    Parameters can be compared to HTML attributes. You can use parameters to refine
    the output of the Smarty tags. Parameters can be used to:


    +   - Change date formats displayed by a tag

    +   - Add supplementary parts to the output of the tag

    +   - Remove some parts from the output

    +   - Replace specific text in the output of the tag


    # Time for action – adding Smarty parameters to the template


    Let us say you have added the tag `{last_modified_by}` to your template. However,
    you do not like the ID of the user, and you would like the username or his full
    name to be displayed instead of the user ID.


    +   1. In the admin console, select your template for edit (**Layout | Templates
    | My first template**).

    +   2. Add the `{last_modified_by}` tag with the format parameter, as shown in
    the following screenshot:

    +   3. Click on **Apply** and then click on the magnifying glass icon in the top-right
    corner of the admin console to see the result of your template changes.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_85_0.png)'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# What just happened?


    You have added a tag `{last_modified_by}` to the template in order to display
    the name of the user who made the last modification to the page. Normally, if
    you do not say anything else, the ID of the user is displayed at the place where
    the tag is added. By adding a `format` parameter to the tag, you can now control
    what exactly should be shown.


    As templates in CMS Made Simple consist of a mixture of HTML and Smarty, you need
    to understand the definition of tag, plugin, parameter, and parameter values.
    The tags we used in the example are **Smarty plugins**. Smarty plugins are custom
    functions defined for your convenience. Almost every plugin can take parameters
    (sometimes also called attributes). You add parameters to the plugin name separated
    with a space. The parameter name is followed by an equals sign and parameter value
    enclosed in double or single quotes. See the following image to understand the
    anatomy of the Smarty tag:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_86_0.png)


    Now, how do you know what parameters you can use with what plugin and what parameter
    values are allowed? You will find a complete list of custom CMS plugins in the
    admin console of your website. These plugins are called tags in CMS Made Simple.
    Click on **Extensions | Tags** to see the complete list of plugins that you can
    use in the template right now.


    If you click on the name of the tag, you will get help on it. You will find a
    short description what this tag does in general, and then see an example of how
    you can use it in your template. You will also see a list of available parameters
    (if any) and the values you can use for them.


    Similar to HTML attributes, you can use more than one parameter in a tag. The
    order of the parameters is not important.


    For the tag `{last_modified_by}`, only one parameter is listed in the **Help**
    section. There are three values that are accepted by this parameter—`id`, `username`,
    and `fullname`, so that you can use another parameter value to display the full
    name of the person who has edited the page last:


    ```

    {last_modified_by format="fullname"}

    ```'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Design and Layout


    > The full name of the user is shown if it is given in the user''s account. In
    the admin console, open **Users & Groups | Users** and click on the username that
    you would like to modify. Enter the **First Name** and the **Last Name** of the
    user.


    # Using plugins in content


    In the last section, you added Smarty plugins to the template. However, it is
    also possible to add them directly into the content of the page. You use the tags
    in the content in the same way that you used them in the template. Write the name
    of the plugin enclosed in curly brackets in the field **Content** of a specific
    page. Try it out now. Open any page for editing (**Content | Pages**) and add
    one or more tags in the field **Content**. You can mix tags and static text in
    the same way you did in the template.


    A small example for the start page of your website can be:


    ```

    Welcome! Today is {current_date}.

    ```


    The preceding code will automatically display the current date on the start page
    of your website.


    > You should add plugins that need to be displayed on every page of your website
    to the template. If you need a special plugin on only one page (for example, the
    start page), then you should add the plugin into the field **Content** of this
    page.


    # Adding stylesheets to the template


    Nowadays, designing websites requires not only pure HTML, but also CSS. The most
    professional websites use HTML to structure the website and CSS to style them.
    CSS gives you full control over your layout. With CSS you can easily change the
    look and feel of your website without changing any HTML. You can see some good
    examples of CSS layouts based on the same HTML at `http://www.csszengarden.com`.


    CMS Made Simple takes pure CSS code for your page layout and saves it in the database.
    In this section, you will learn how you can create a new stylesheet, add your
    styles to it, and attach it to the template.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# # Creating a new stylesheet


    To create a new stylesheet, you have to accomplish three simple steps:


    +   1. Create and save the new stylesheet containing your CSS code.

    +   2. Attach the stylesheet to the template.

    +   3. Add a special tag in the template that will be replaced by an HTML tag
    `<link>` pointing to the stylesheet.


    # ## Time for action — creating the stylesheet


    Normally, in static HTML pages, you create a CSS file and attach it to your template
    using an HTML `<link>` tag. In CMS Made Simple, stylesheets are saved in the database,
    and therefore cannot be linked directly. Let us see how stylesheets can be created
    and attached to the templates.


    +   1. In the admin console, click on **Layout | Stylesheets**.

    +   2. Click the **Add a Stylesheet** link at the bottom of the list.

    +   3. Type in the name of the new stylesheet and enter the CSS code in the **Content**
    field, as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_88_0.png)


    +   4. Click on **Submit**. The new stylesheet is added to the list of stylesheets.

    +   5. To attach the new stylesheet to your template, in the admin console, click
    on **Layout | Templates**.'
  merge: -1
  img_proc: true
- pgno: 89
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 90
  md: '10. Click on Apply and then click on the magnifying glass icon in the top-right
    corner of the admin console to see the result of your template changes. It should
    look as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_90_0.png)


    # What just happened?


    You have created a new stylesheet that contains pure CSS code. Then, you have
    attached this stylesheet to your template. By attaching the stylesheet, you have
    stated which stylesheet is relevant for your template. The {stylesheet} tag that
    you added to your template, is substituted by the HTML <link> tag when the page
    is displayed in the browser.


    Open the page source in the browser to see what is set at the place where the
    {stylesheet} tag has been added to the template. In my example, it looks like:


    ```

    <link rel="stylesheet" type="text/css" href="http://www.yourdomain.com/stylesheet.php?cssid=51"
    />

    ```


    In your special installation, the name of the domain will be different, and the
    last number in the URL of the stylesheet is also likely to be different. The tag
    is formed automatically, and you do not need to care how it is made technically.


    You can define and attach more than one stylesheet to the template. For example,
    you can define a stylesheet with general styles and then add another one containing
    print styles. We will create and add more stylesheets in the course of the book
    so that you can see how it works later on. For each stylesheet, a separate HTML
    link tag is added at the place where the {stylesheet} tag is added. There is no
    need to add the tag twice or more if you have attached more stylesheets, as this
    plugin will create as many links as there are stylesheets attached to the template.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Media types for stylesheets


    While creating a stylesheet, you have probably seen the area Media Type with some
    checkboxes at the bottom of the page where stylesheet code is added. You can see
    the area if you open your stylesheet for editing in the admin console (Layout
    | Stylesheets) and scroll down. It appears as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_91_0.png)


    The media type corresponds to the HTML attribute media and is automatically added
    to the HTML <link> tag (if you select any type here):


    ```

    <link rel="stylesheet" type="text/css" media="screen" href="http://www.yourdomain.com/stylesheet.php?cssid=51"
    />

    <link rel="stylesheet" type="text/css" media="print" href="http://www.yourdomain.com/stylesheet.php?cssid=52"
    />

    ```


    The styles from the first stylesheet are used to display your website in the browser.
    However, the browser will use the print stylesheet if your page is printed:


    > If you use any CSS framework with more than one CSS file, then you can copy
    the content of each CSS file into a separate stylesheet in CMS Made Simple and
    then attach them all to your templates. You can also change the order of the stylesheets
    while assigning them to the template.


    # Creating navigation for the website


    The heart of each website is surely the navigation. The navigation consists of
    links to the pages and is often divided into main navigation and sidebar navigation.
    In CMS Made Simple, the navigation is automatically built from the list of active
    pages. You can create navigation of any complexity grade in CMS Made Simple due
    to the very powerful concept explained in the following sections.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Time for action – adding navigation to the template


    Let us add navigation links to the website.


    +   1. In the admin console, click on **Layout | Templates**, and select **My
    first template** for edit.

    +   2. Add a special tag for navigation before the `{content}` tag, as shown in
    the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_92_0.png)


    +   3. Click on **Apply** and then click on the magnifying glass icon in the top-right
    corner of the admin console to see the result of your template changes. It should
    look as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_92_1.png)'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# What just happened?


    With the custom CMS tag {menu}, a complete structure of the website is displayed
    at the place where it is added in the template. Each active page is displayed
    according to its position in the hierarchy and order in the list of pages.


    The {menu} tag is very powerful. You can use numerous parameters that help you
    to create navigation of any complexity grade. For example, you can limit the navigation
    to only one level, so that only pages from the first hierarchy level are shown:


    ```

    {menu number_of_levels="1"}

    ```


    Try the preceding code to create some navigation limited to the main pages. This
    is a common way to create the main navigation for the website; normally placed
    at the top of each page. The subpages are not shown with this parameter but we
    can display them in the sidebar navigation later on.


    We will learn more parameters for the {menu} tag and see more examples on how
    it can be customized later on. In this chapter, our main subject is design and
    layout. That is why we will now learn to customize the look and feel of top navigation.


    # Designing navigation—the pure CSS way


    With the simple plugin {menu} the navigation of the website is displayed on every
    page. CMS Made Simple creates a simple unordered HTML list for the navigation
    as you can see in the source code of the page. Let us see how you can easily style
    a top navigation bar with pure CSS.


    # Time for action – design navigation with pure CSS


    We are now going to style the top navigation so that it looks like buttons displayed
    beside each other instead of below each other.


    +   1. In the admin console, click on Layout | Templates, and open My first template
    for edit.

    +   2. Add the HTML <div> tag around the {menu number_of_levels="1"} tag, as shown
    in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 94
  md: "![](img/b21e3dc5c94405bc7b3f102758ea770c_94_0.png)\n\n+   3. Click on **Submit**.\n\
    +   4. Open **My First Style Sheet** from the list of stylesheets (**Layout |\
    \ Stylesheets**) for editing.\n+   5. Add style formats for the container `top-navi`\
    \ at the end of stylesheet, as shown in the following code snippet:\n\n```\n#top-navi\
    \ ul\n{\n    height: 22px;\n    padding: 0px;\n    margin: 10px 0;\n    border-top:\
    \ 1px solid #e5e4e2;\n    border-bottom: 1px solid #e5e4e2;\n}\n#top-navi li\n\
    {\n    list-style: none;\n    float:left;\n}\n#top-navi li a\n{\n    color: #a2a2a2;\n\
    \    text-decoration: none;\n    display: block;\n    padding: 5px 15px;\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 95
  md: "```\n#top-navi li a:hover\n{\n    color: #ffffff;\n    background: #3d648a;\n\
    }\n```\n\n6. Click on Apply and then click on the magnifying glass icon in the\
    \ top-right corner of the admin console to see the result of your changes. It\
    \ should now look as shown in the following screenshot:\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_95_0.png)\n\
    \n# What just happened?\n\nYou have limited the output of the navigation to the\
    \ first level by adding the parameter number_of_levels to the {menu} tag. Then\
    \ you have placed an HTML <div> tag around the Smarty plugin {menu}. With the\
    \ last step, you have added some CSS styles to give the top navigation the desired\
    \ look and feel. Notice that you do not need any special \"CMS design\" knowledge\
    \ to add styles to your navigation. You have used pure and common CSS to format\
    \ the navigation.\n\nIf you click on each page in the browser and see how the\
    \ navigation is displayed on other pages, you will notice that there is some additional\
    \ formatting which CMS uses to display active pages. For example, <h3> is used\
    \ to display the name of the active page within navigation. Open the page source\
    \ in your browser to see the formatting of active pages. You can add more styles\
    \ to change the formatting of <h3> tag. On the other hand, to save your time you\
    \ can reduce all these special formats to pure ordered lists by using the built-in\
    \ template minimal_menu.tpl. This template is automatically provided with a standard\
    \ installation of CMS Made Simple. To use it, add another parameter to the tag\
    \ {menu}, as shown in the following line of code:\n\n```\n{menu number_of_levels=\"\
    1\" template=\"minimal_menu.tpl\"}\n```"
  merge: -1
  img_proc: true
- pgno: 96
  md: "In this way, all additional tags are deleted from the navigation and a clear\
    \ unordered list is displayed on each page.\n\nIf you look into the page source\
    \ of the website, you will notice that there were also some special class attributes\
    \ added to the menu. CMS knows what page is actually shown and adds a special\
    \ class to the HTML tag `<a>` of the active page:\n\n```\n```html\n<li><a href=\"\
    http://www.yourdomain.com/\" class=\"currentpage\"> Our Company </a>\n```\n```\n\
    \nYou can use this information to give another style to the navigation item of\
    \ the page that is currently displayed. The easiest method is to combine the `a:hover`\
    \ and `a.currentpage` classes to give them the same style.\n\n```\n```css\n#top-navi\
    \ li a:hover, #top-navi li a.currentpage\n{\n    color: #ffffff;\n    background:\
    \ #3d648a;\n}\n```\n```\n\nIf you can design websites with CSS, you are now able\
    \ to design simple navigation of the website without any special coding knowledge.\n\
    \n# Adding sidebar navigation\n\nHowever, this is only half of the story. The\
    \ pages displayed in the top navigation are limited to the first level. We need\
    \ some sidebar navigation to display the list of subpages belonging to the parent\
    \ page.\n\nWe have to discuss another important parameter of the plugin `{menu}`.\
    \ With the parameter `number_of_levels`, you set how many levels from your page\
    \ hierarchy are to be shown. For the sidebar navigation, you do not need to limit\
    \ the number of levels, but to define a start level for your navigation. As the\
    \ first level is added to the top navigation already, for the sidebar, you start\
    \ with the second level:\n\n```\n```text\n{menu start_level=\"2\" template=\"\
    minimal_menu.tpl\" }\n```\n```\n\nWith parameter `start_level`, you say from what\
    \ level the pages are shown in the menu. Second level means that pages with a\
    \ minimum of two numbers in the hierarchy are shown, for example, 1.2, 2.3, or\
    \ 4.2. CMS Made Simple also knows what page is selected in the top navigation\
    \ and displays in the sidebar only pages that are children of the page selected\
    \ above. This means that if the page with number 3 is selected in the top navigation,\
    \ the sidebar will only contain the children of this page: 3.1, 3.2, 3.3, and\
    \ so on.\n\nWith the parameter `template`, you again reduce the output of the\
    \ navigation to the pure HTML unordered list to make formatting easier at this\
    \ point."
  merge: -1
  img_proc: true
- pgno: 97
  md: 'An interesting and popular parameter is collapse, for example, {menu collapse="1"}.
    This parameter allows the collapsing of sub items in the menu, so that only the
    sub items of the current menu item are shown. It should have at least three levels
    in the page hierarchy to see how automatic collapse hides menu items that do not
    belong to the currently displayed page.


    We have learned the most important parts of a template: title, content, and menu.
    This is enough information to be able to port ready-made HTML template to CMS
    Made Simple.


    # Porting a HTML template


    Normally, you do not design a complete template from scratch in CMS Made Simple.
    You can use any HTML/CSS editor to create a design outside of CMS Made Simple.
    It is also possible that you have downloaded or purchased a ready-made HTML template
    or you work with a designer who has created the design for your website. In all
    the cases listed above, you get an HTML file, CSS file, and one or more images.
    In this section, we learn to port an HTML template to CMS Made Simple.


    Imagine, you get an HTML template that looks like the following screenshot.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_97_0.png)


    This template consists of three files: HTML, CSS, and a logo image in the upper-right
    corner. Notice that there is nothing but pure HTML and CSS at this point. Let
    us create a new CMS Made Simple template from the preceding template.'
  merge: -1
  img_proc: true
