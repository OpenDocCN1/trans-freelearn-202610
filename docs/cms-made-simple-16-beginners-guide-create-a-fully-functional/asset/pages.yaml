- pgno: 103
  md: 'Now, you can start replacing the static text in your template with Smarty tags.
    Find and replace title, content, and menu in HTML. Open your template in the admin
    console and make the following changes:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>{title} - {sitename}</title>

    {stylesheet}

    {metadata}

    <meta name="description" content="" />

    </head>

    <body>

    <div id="container">

    <div id="header">

    businessWorld

    </div>

    <div id="top-navi">

    {menu number_of_levels="1" template="minimal_menu.tpl"}

    </div>

    <div id="content">

    <h1>{title}</h1>

    {content}

    </div>

    <div id="sidebar">

    {menu start_level="2" template="minimal_menu.tpl"}

    </div>

    <div id="footer">

    2009 businessWorld

    </div>

    </div>

    </body>

    </html>

    ```


    Below the Smarty {stylesheet} plugin, you can add the {metadata} plugin. This
    plugin will add global metadata (Site Admin | Global Settings) and the Page Specific
    Metadata from the tab Options of the page. It will also set the HTML <base> tag
    with the attribute href to the root of your installation. In this way, all images
    can be defined in relation to the root folder.


    Congratulations! Your template is now ported to CMS Made Simple.'
  merge: -1
  img_proc: true
