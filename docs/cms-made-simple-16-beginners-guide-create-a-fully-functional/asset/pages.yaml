- pgno: 206
  md: '+   6. What is the right statement according to a group of radio buttons and
    a group of checkboxes?

    +      a. In a combined group of checkboxes and radio buttons, all alternatives
    can be activated.

    +      b. In a group of checkboxes, all alternatives can be activated, in a group
    of radio buttons, only one can be activated.

    +      c. In a group of radio buttons, all alternatives can be activated, in a
    group of checkboxes, only one can be activated.

    +      d. In a group of checkboxes, a drop-down menu has to be integrated, otherwise
    you cannot hear music by handling the radio buttons.


    +   7. What is a **Job** in the **Newsletter Made Simple** module?

