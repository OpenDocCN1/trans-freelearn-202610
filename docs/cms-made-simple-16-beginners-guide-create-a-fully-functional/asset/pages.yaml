- pgno: 108
  md: "```\n```html\n{/if}\n</div>\n<div id=\"sidebar\">\n  {menu start_level=\"2\"\
    \ template=\"minimal_menu.tpl\"}\n</div>\n<div id=\"footer\">\n  2009 businessWorld\n\
    </div>\n</div>\n</body>\n</html>\n```\n```\n\n> In this book, you may occasionally\
    \ come across a single line of code appearing on two different lines. Please note\
    \ that this has been done only for the purpose of indentation due to space constraints.\
    \ When using such code make sure it's on one line in your script file.\n\n+  \
    \ 3. Click on **Apply** and then click on the magnifying glass icon in the top-right\
    \ corner of the admin console to see the result.\n\n# What just happened?\n\n\
    The IF code that you have added around the paragraph containing the last modification\
    \ causes CMS to check the page alias of the displayed page. If the page alias\
    \ is equal to \"contact-us\", then everything between the IF structure is not\
    \ shown, otherwise the information about the last modification is displayed.\n\
    \nYou have seen from the previous section that CMS knows what page of our website\
    \ is currently being displayed. This information is stored in the Smarty variable\
    \ `{$page_alias}`. With the built-in IF function, you can compare the page alias\
    \ of the actual page with the page alias of the page **Contact Us**. If the value\
    \ of the variable `{$page_alias}` is NOT equal to `contact-us`, then everything\
    \ between the IF tags is displayed. If the page alias is equal to `contact-us`,\
    \ then nothing is displayed. In this way, you can control the output of the template\
    \ depending on the page alias.\n\nThe abbreviation `neq` (meaning **not equal**)\
    \ between the variable `{$page_alias}` and the value `contact-us` is called a\
    \ **Qualifier**. Qualifiers are used to build a logical condition in the IF code.\
    \ The result of the logical condition can be true or false. If the result of the\
    \ IF condition is true (and it is true if the page alias IS NOT EQUAL to `contact-us`),\
    \ then everything placed in between the IF tags is displayed. If the result of\
    \ the IF condition is false (and it is only false if the page alias IS EQUAL to\
    \ `contact-us`), then everything between the IF tags is suppressed."
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Design and Layout


    There are more qualifiers that can be used to build logical conditions in Smarty.
    Some of them are listed in the following table:


    | Qualifier | Meaning | Example |

    |---|---|---|

    | `eq` | equals | `$page_alias eq "contact-us"` |

    | `neq` | not equal to | `$page_alias neq "contact-us"` |

    | `gt` | greater than | `$friendly_position gt 2` |

    | `lt` | less than | `$friendly_position lt 3` |

    | `gte` | greater than or equal | `$friendly_position gte $count` |

    | `lte` | less than or equal | `$friendly_position lte 5` |

    | `not` | negation | `not $lang`<br><br>(Negation can be used to check if a variable
    contains any value or if it is empty. If no value is given, then the result of
    the condition is true, or else the result of the condition is false.) |

    | `mod` | modulo | `$count mod 2`<br><br>The modulo operation finds the remainder
    of division of one number by another. You can use the above example to figure
    out if the number of pages in the first hierarchy level is even or odd. |


    The IF structure is a useful tool for handling slight changes in one template
    depending on the page name or the position in the hierarchy. In the preceding
    example, you saw that you can use every variable from the template to build a
    logical condition.


    # Creating navigation template with Smarty loop


    You can also change the HTML markup of the navigation. In this chapter, the great
    principle of a "template in template" giving you full control of your design is
    explained. Before you can learn this principle, you have to understand some Smarty
    basics.


    When we added the top navigation to the website, we used a standard template for
    the navigation. It displays the navigation as an unordered HTML list. Imagine
    that you need a kind of footer navigation where all the links from the top navigation
    are shown. You do not need an unordered HTML list in this case. You just would
    like to show all links in one line separated by a pipe (|) shown as follows:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_109_0.png)'
  merge: -1
  img_proc: true
- pgno: 110
  md: "This means that you need a completely different HTML markup for this kind of\
    \ navigation. The great advantage of CMS Made Simple is the ability to display\
    \ a template in template. While you can use the main template to define the whole\
    \ layout for the page, the HTML markup of the navigation is saved in its own template.\
    \ This navigation template is just a piece of the HTML code that is added to the\
    \ main template at the place where the tag `{menu}` is placed.\n\nThe menu template\
    \ contains some HTML markup for the navigation. Let us see how you can create\
    \ a fully new template for the menu and add your individual HTML markup.\n\n#\
    \ Time for action – creating a menu template\n\nWe need a simple footer navigation\
    \ where all pages of the website are listed, separated by a pipe (|) sign, as\
    \ shown earlier.\n\n+   1. In the admin console of the page, click on **Layout\
    \ | Menu Manager**.\n+   2. Click on **Add Template**.\n+   3. Fill in the fields\
    \ for **New Template Name** and **Template Content**, as shown in the following\
    \ screenshot :\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_110_0.png)\n\n+   4.\
    \ Click on **Submit** to save the new menu template.\n+   5. Open the **Business\
    \ World** template for editing (**Layout | Templates**).\n+   6. Add footer navigation\
    \ with the `{menu}` tag, and provide the name of the menu template, as shown in\
    \ the following code snippet:\n\n```\n<!DOCTYPE html>\n<html>\n    <head>\n  \
    \      <title>{title} - {sitename}</title>\n        {stylesheet}\n        {metadata}\n\
    \        <meta name=\"description\" content=\"\" />\n    </head>\n    <body>\n\
    ```"
  merge: -1
  img_proc: true
