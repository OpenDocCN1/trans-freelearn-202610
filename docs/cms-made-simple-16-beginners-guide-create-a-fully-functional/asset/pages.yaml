- pgno: 150
  md: 'The **Available Modules** tab is your research centre for available modules.
    The modules are sorted alphabetically by their names and have mostly good explanations
    which can be found by clicking on the **Help** link beside the module name.


    There is no possibility to search for a module functionality by keywords in **Module
    Manager**. However, you can use the search feature in **CMSMS Forge**. CMSMS Forge
    is a hub for all features such as modules, plugins, or translations. It can be
    found at `http://dev.cmsmadesimple.org`. Enter the search word or phrase in the
    top-right corner in CMSMS Forge and find the list of modules, plugins (also called
    tags), or translations that match your search criteria. If you are interested
    in any module found in the list; note its name, return to the admin console in
    **Extensions | Module Manager**, and search in the alphabetical list for the module
    name in question. Read the **Help** section to see if the module suits your requirements.


    # Installing additional modules


    Before installing a module, you should check the **Dependencies** link beside
    it in the list of modules in the **Module Manager**. Some modules depend on other
    modules in order to function, so you have to install the other modules first.


    # Time for action – module installation


    Let''s install an additional module that allows us to manage FAQ on the website.


    +   1. In the admin console, click on **Extensions | Module Manager**, and choose
    the tab **Available Modules** tab.

    +   2. In the list of modules, select the letter **Q**, and find the module **Questions**.

    +   3. Click on the **Dependencies** link to see what modules have to be installed
    first.

    +   4. Return to the list of available modules (**Extensions | Module Manager**)
    and select the letter **C**. Find the module **CGExtensions**, and click on the
    **Download & Install** link. The module **CGExtensions** will be installed.

    +   5. Return to the list of available modules (**Extensions | Module Manager**),
    and select the letter **Q** again. Find the **Questions** module.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_150_0.png)'
  merge: -1
  img_proc: true
- pgno: 151
  md: <!-- no content -->
