- pgno: 252
  md: "```\n    {$node.name}\n    {/if}\n    </h3>\n    {if !empty($node.description)}\n\
    \    <div>{$node.description}\n    </div>\n    {/if}\n    {/foreach}\n{/if}\n\n\
    <!-- This tag will be automatically added to the page content.\n    It uses the\
    \ default summary template for products. -->\n{Products hierarchyid=$hierarchy_item.id}\n\
    ```\n\nThis template goes through each hierarchy and displays its name as a HTML\
    \ heading <h3>. It will also show a description field of the hierarchy item below\
    \ the heading. The last Smarty tag in the template shows the summary list of the\
    \ products limited to the hierarchy item selected in the sidebar. The template\
    \ of this summary list is the default summary template. The products summary list\
    \ will automatically replace the page content.\n\nBefore you customize the summary\
    \ template, open it (Content | Product Manager, tab Summary Templates, template\
    \ Sample) and find out what the major parts of this template are. It consists\
    \ of:\n\n+   - Drop-down list of categories\n+   - Page navigation\n+   - List\
    \ of products with the add-to-cart functionality for each product\n\nAt present,\
    \ you can see only the list of products, no categories, no page navigation, and\
    \ no cart functionality.\n\nDisplaying the drop-down list of the categories does\
    \ not work in the actual version of the module the way it is added to the sample\
    \ template:\n\n```\n    {if isset($catformstart)}\n        {$catformstart}\n \
    \       {$catdropdown}{$catbutton}\n        {$catformend}\n    {/if}\n```\n\n\
    It is still possible that this functionality will be added in a later release\
    \ of the module. At present, you can completely delete this part or replace it\
    \ with the Smarty tag shown as follows:\n\n```\n{Products action=\"categorylist\"\
    }\n```"
  merge: -1
