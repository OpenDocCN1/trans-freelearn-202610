- pgno: 116
  md: '5. Where do you place the {stylesheet} tag in the template?


    +   a. Head

    +   b. Keywords or description

    +   c. Title

    +   d. Body

    +   e. Footer


    6. How many stylesheets can be defined for one template?


    +   a. Just one stylesheet for each template.

    +   b. It depends on the number of themes in the template, you can define as many
    stylesheets as you have themes for it.

    +   c. Maximum seven, because of program restrictions.

    +   d. As many as you want.


    7. How can you generate the navigation?


    +   a. The main menu and the sidebar navigation have to be connected in the admin
    console Content | Pages and the drop-down menu parent.

    +   b. The sites have to be connected to the whole navigation at once with a Smarty
    tag.

    +   c. The navigation is generated automatically.

    +   d. The main menu is generated automatically, the sidebar menu has to be integrated
    by using the module ''SideNav3.1''.


    8. What is the meaning of the plugin menu in combination with the parameter start_level
    set to 2 ({menu start_level="2"})?


    +   a. The menu is only shown when you click twice on the button.

    +   b. The value 2 depends on the number of the line of the code in the template
    where it is integrated.

    +   c. When you set the value 2, there will only be 2 navigation links shown,
    when you set all instead of 2, the whole navigation structure is displayed.

    +   d. The value 2 is responsible for the first level not being shown in the navigation.


    9. What is the special feature of an array like $nodelist, which is a Smarty variable?


    +   a. There is more than one value saved in it.

    +   b. There is exactly one value saved in it.

    +   c. Arrays only contain numeric values.

    +   d. Arrays only contain text values.'
