    will not encounter any problems while running your website even if you do not
    correct them. However, if you can follow the recommendations given to resolve
    the warnings, then please do it.


    | Test | Result |

    |---|---|

    | **Recommended settings** | |

    | Checking PHP memory limit (minimum 16M, recommend 24M or greater) You have 32M
    | ✓ |

    | Checking PHP time limit in second (minimum 30, recommend 60 or greater) You
    have 30

    *Number of seconds a script is allowed to run. If this is reached, the script
    returns a fatal error.* | ⚠ |

    | Checking PHP register globals You have Off | ✓ |

    | Checking output buffering You have On | ✓ |

    | Checking PHP disable functions | ✓ |

    | Checking for safe mode You have Off | ✓ |

    | Check for PHP Open Basedir | ✓ |

    | Test for remote URL

    ✓ fsockopen: Connection ok!

    ✓ fopen: Connection ok! | ✓ |

    | Checking file uploads You have On | ✓ |

    | Checking max post size (minimum 2M, recommend 10M or greater) You have 8M

    *You will probably not be able to submit (larger) data. Please be aware of this
    restriction.* | ⚠ |

    | Checking max upload file size (minimum 2M, recommend 10M or greater) You have
    8M

    *You will probably not be able to upload (larger) files using the included file
    management functions. Please be aware of this restriction.* | ⚠ |

    | Checking if /var/www/web0/html/themes.icms.info/uploads is writable You have
    /var/www/web0/html/themes.icms.info/uploads | ✓ |

    | Checking if /var/www/web0/html/themes.icms.info/uploads/images is writable You
    have /var/www/web0/html/themes.icms.info/uploads/images | ✓ |

    | Checking if /var/www/web0/html/themes.icms.info/modules is writable You have
    /var/www/web0/html/themes.icms.info/modules | ✓ |

    | Checking if session.save_path is writable You have /var/lib/php5 | ✓ |

    | session.use_cookies You have On | ✓ |

    | Checking for basic XML (expat) support You have On | ✓ |

    | Checking for file_get_contents You have On | ✓ |

    | Checking if ini_set works You have On | ✓ |'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'On some web servers, you have to change permissions of the uploaded folders.
    If you''re using FileZilla, then right-click on the remote folder, and select
    **File permissions**. In the dialog window **Change file attributes**, enter **777**
    in the **Numeric value** field. You should make those changes to the following
    folders:


    +   - `tmp/templates_c`

    +   - `tmp/cache`

    +   - `uploads`

    +   - `uploads/images`

    +   - `modules`


    Click on **Continue.**


    # Step 3: Testing file creation mask (optional)


    In this step, you can optionally test if CMS Made Simple is allowed to create
    files on your web hosting. Click on **Test** or just ignore this step and click
    on **Continue.**


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_38_0.png)'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Step 4: Admin account information


    Pay attention to this step. You are going to create an administrator account for
    your website. With this data, you gain access to the administration console of
    your website after it has been installed. Remember or write down the administrator''s
    username and password that you enter in this step. Provide a valid e-mail address
    for your account. If you forget your password someday, then a reminder will be
    sent to this e-mail address.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_39_0.png)'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'You can check the box for **E-Mail Account Information**. CMS Made Simple will
    try to send a confirmation mail to your e-mail account. However, do not rely on
    it due to the individual hosting settings. We will configure the e-mail settings
    of CMS Made Simple later in this chapter.


    Click on **Continue.**


    # Step 5: Database information


    In this step, change the name of the website or leave it as it is. This information
    can be changed any time after the installation.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_40_0.png)'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'For the database information, use the access data for the database that you
    gained while preparing for the installation.


    +   1. Replace **Database host address** with your individual data.

    +   2. Replace **Database name** with the name of your database.

    +   3. Enter the database **Username**.

    +   4. Enter the database **Password** and optionally the **Database port** (if
    any).


    These are the access credentials for your database. If you are not sure what to
    enter in these fields, then ask your hosting provider.


    # Sample content and templates


    In the last field of this installation step, you have to decide whether you would
    like to install sample content and templates. Sample content is a useful resource
    for your first introduction to CMS Made Simple, as it includes more than twenty
    pages with an overview of what CMS Made Simple is and how it works. However, the
    default templates are difficult for beginners to understand, as they are complex
    and look overloaded.


    For our website, we will not install any default content or templates.


    Click on **Continue**.


    # Step 6: Creating tables


    If the connection to the database was successful and the tables in the database
    were created, then you will see the message **Success!** at the end of this step,
    as shown in the next screenshot. Leave all the values in the fields below the
    message as they are, and click on **Continue**.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_41_0.png)'
  merge: -1
  img_proc: true
- pgno: 42
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Getting Started


    Log in to the admin console with the address http://www.yourdomain.com/admin,
    using the data from step 4 of the installation process. The administrator of the
    website can also add additional users (see Chapter 6, Users and Permissions).


    Everything in the admin console is accessed through the main horizontal menu.
    When you first enter the admin area, you also see a sitemap of what can be accessed
    through each menu.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_43_0.png)'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'In the sitemap for any menu item, when you click on the main horizontal menu
    (CMS, Content, Layout, Users & Groups, and so on), all subitems of that menu item
    are shown.


    Let''s take a quick walkthrough of what''s in the admin console.


    +   CMS: In the CMS menu, you can open the admin sitemap (see the next screenshot),
    the frontend page (View Site) in a new window, or Logout.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_44_0.png)


    +   Content: Here you can manage the content of your site. You can add and edit
    pages, upload and manage images and files, and also add, edit, and remove news.
    If you have installed additional content modules (such as a guestbook or FAQ),
    then they appear in this section as well. Lastly, in the content menu, you can
    create global content blocks that will be used on the entire website in different
    places and edited from one place.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_44_1.png)


    +   Layout: Here you can style and format the look of your page in the way you
    want. For the general layout, you use templates. In the layout menu, you can also
    access the Stylesheets. Using stylesheets (CSS), you can style different elements
    of your page.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_44_2.png)'
  merge: -1
  img_proc: true
- pgno: 45
  md: '+   ♦ **Users & Groups**: With this menu item, you can add users that should
    have access to the admin console of your website and select what permissions they
    will have. You can put users in groups to easily select permissions for the whole
    group at the same time.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_45_0.png)


    +   ♦ **Extensions**: These are add-ons that give extra functionality to CMS Made
    Simple. The standard installation of CMS Made Simple includes only some basic
    features. With extensions, you can add more or less any functionality to your
    site. Extensions can be either modules or tags (also called plugins).


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_45_1.png)


    +   ♦ **Site Admin**: Here you can change the settings and preferences for the
    entire website, get system information, and verify the file''s integrity. Any
    changes made to your website by you or other users are tracked in **Admin Log**.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_45_2.png)


    +   ♦ **My Preferences**: Here you can change your personal settings. You can
    also manage shortcuts to the pages that are most frequently used in the admin
    area. Click on **My Account**, if you would like to change the username of the
    administrator account, his/her password, or the e-mail associated with the account.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_45_3.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Finishing the installation


    Immediately after installation, you see two unhandled notifications in the dashboard
    area below the main menu. Click on the sign + beside the notifications to expand
    the dashboard area.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_46_0.png)


    The first notification informs you that the `install` folder still exists on the
    web server. This folder contains the installation program you have used to set
    up CMS Made Simple. Once CMS Made Simple is installed and is running, you don''t
    need this folder, and therefore, you should delete it or at least rename it. If
    you do not, then everybody can start the installation program again and thus replace
    your website with a new installation. This would be a big security issue, so delete
    the folder right now.


    After the folder is deleted (or renamed), refresh the admin console to see the
    first message disappear.


    The second message deals with the e-mail settings you should configure before
    running CMS Made Simple.


    # Sending e-mails with CMS


    CMS Made Simple sends e-mails with the module **CMSMailer**. The configuration
    of the **CMSMailer** module is very important. If you do not configure it, then
    you will not receive the e-mail with new login information, should you ever forget
    your administrator password. This module is also used by many other CMS Made Simple
    modules that send out e-mails such as **FrontEndUsers**, **Orders**, or **FormBuilder**.


    You will see this notification in the dashboard of CMS Made Simple till you have
    configured the module.


    In the admin console, in the main horizontal navigation, select **Extensions |
    CMSMailer**. Set the **Character Set** to `utf-8`. Then, choose **sendmail** in
    the **Mailer method** field. Fill the field **From address** with an existing
    e-mail address. When CMS sends e-mails, the recipient will see this e-mail as
    the sender address. You have to enter an existing e-mail address here, as due
    to spam and security settings on your web hosting, CMS Made Simple will probably
    not be able to send out e-mails.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Getting Started


    Fill in the From Username field. The name given here will be assigned to the mail
    address in the recipient''s mail client.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_47_0.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Click on **Submit**, and confirm the changes.


    Test your settings using the last field on the same page. In the **Test Email
    Address** field, enter any e-mail address (not one from the field **From Address**)
    where you have access to the mail box. CMS Made Simple will send a test message
    to the e-mail address given in this field. Click on the **Send Test Message**
    button, and control the incoming address of the e-mail address given in the field
    **Test Email Address**. Did you receive the test message?


    If not, wait for some time and then check your spam folder. Sometimes test messages
    are filtered out and treated as spam. If the test message has not been sent, then
    something is wrong with the configuration of the **CMSMailer** module.


    # Known issues


    +   - Check the **Sendmail location** field (your hosting provider has to confirm
    that it is right or he/she should provide you with your individual location).

    +   - Check the e-mail address entered in the **From address** field. It must
    be an existing e-mail address, and it has to be located on your web hosting. If
    you enter any other e-mail address, then your server will not be able to send
    out e-mails. To use e-mail addresses of the public e-mail services such as Gmail
    or GMX, you have to configure the module with SMTP as the **Mailer method**. This
    method requires that you fill in the fields considering SMTP. SMTP settings are
    individual for any e-mail provider.

    +   - Check the spam folder and filter of the **Test Email Address**, sometimes
    test messages are sorted out or immediately deleted.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Getting Started


    # Summary


    At the end of this chapter, you should have a clean installation of CMS Made Simple.


    Specifically, we covered:


    +   - Installation of the program: CMS Made Simple is delivered with a simple
    installation program that guides you step-by-step through the setup process. We
    have performed the steps to get CMS Made Simple running.

    +   - Overview of the admin console: The admin console is like a cockpit in a
    plane. It is a place from where you can control the entire website. In the course
    of this book, you will learn every part in more detail.

    +   - Sending e-mails: You have configured CMS Made Simple so that it can send
    mails from the admin console. If you forget your admin password, then you will
    receive a reminder e-mail with instructions on how to recover it. All core and
    most of the third-party modules of CMS Made Simple rely on this functionality.
    Once configured, you do not need to make it for each module separately.


    In the next chapter, we will see how you create the website structure and build
    website navigation.'
  merge: -1
  img_proc: true
- pgno: 50
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Planning your website will also help us to choose the appropriate design for
    it. The best design will fail if your website plan does not match the already
    created navigation. In the example website plan, you can easily indicate the main
    navigation (marked in bold), subnavigation (marked in grey), and the common structure
    of the website. It is important to have a rough plan and that we do not change
    it very often.


    It is likely that you will have more and more ideas while planning the website—write
    them down! The advantage of planning in this way is that you are not restricted
    at all. You can note down all your ideas now, select the feasible tasks, and concentrate
    on them. Later on, you can add new parts that are not mandatory for the first
    implementation of your website. It is important to differentiate between nice-to-have
    features and something that you cannot live without.


    If you create a website plan to keep all your ideas in mind, you can avoid creating
    pages that contain only one sentence like "Under construction". Good websites
    don''t have any pages that are not ready. If there are any, then they should not
    be shown to the visitor. Imagine seeing a notice about personal style consultation
    in the window of a clothes shop. You go into the shop, but the clerk says: "Sorry!
    This service is still under construction." What was the purpose of calling attention
    to it? Some webmasters add such pages to the website just "to keep them in mind".
    You can keep them in mind in a more efficient way if you write down the main structure
    of your website in a separate place.


    > Ask your friends or family members what they plan to add to the website and
    keep their ideas as well. Consider different age groups and interests while planning
    to broaden the scope of your visitors.


    If everything is perfect, then go through the main sections in your website plan
    and mark the parts that can be done immediately (all the sections on the previously
    mentioned website plan will be discussed in this guide). Other parts should not
    be deleted from the plan but marked as postponed. Normally, you have enough stuff
    at the beginning. Concentrate on these feasible points and keep the postponed
    points in mind.


    When you are ready with the website plan, print it out, put it beside your PC,
    and start working on your website.


    In this chapter, we will:


    +   ♦ Create and edit some pages

    +   ♦ Learn about page hierarchy

    +   ♦ Control the navigation of the website'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Creating pages


    We will begin by creating a rough structure for our website. A website consists
    of pages, which are linked to each other. The navigation of the website helps
    the visitor to find the pages containing the requested information. A website
    must have at least one page and therefore, the first page is already created in
    your admin console after installation. It is the start page of your website, and
    it is called Home.


    # Time for action – adding a new page to the website


    Your website requires a page where information about the company is represented.
    It is the page for the section Our Company in the website plan. Let''s create
    a new page as follows:


    +   1. In the admin console of your website, click on Content | Pages and then
    on the link Add New Content.

    +   2. Fill in the fields Title and Content Type as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_52_0.png)'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Creating Pages and Navigation


    **3.** Click on **Submit**.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_53_0.png)


    **4.** Click on the magnifying glass icon at the top-right of the admin console
    to view your website and find the new page added to the main navigation of the
    website.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_53_1.png)


    # What just happened?


    You have just added a new page to your website. The page has the title **Our Company**
    and is now listed in current pages of your website in the admin console. The page
    is also automatically added to the main navigation of the website. It has sample
    company information in the content field. This text is displayed on the **Our
    Company** page on the website when you navigate to the page.


    You have entered only a little information to create a new page. However, other
    things happened.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Menu text has been created from the title of the page. A page address (URL)
    has been created from the title of the page. It is a part of the page link that
    is placed after `index.php?page=` in the address bar of the browser when you navigate
    to the page. In CMS Made Simple, we call this part the **page alias**. The page
    alias is unique within your website. You can have a lot of pages with the same
    title and menu text, but all these pages will have a different page alias. As
    the page alias is used to create a link to a specific page, you cannot have two
    different pages with the same link, and logically you cannot have the same page
    alias for two different pages.


    You do not need to care about integrating the created page into the navigation
    of your website. All created pages will be displayed in the navigation if you
    do not state anything else.


    Now, you can create all pages from the first level of your website, thus creating
    the main navigation on the top of the website. Add the following pages:


    +   - Products

    +   - Client Center

    +   - Contact Us

    +   - Privacy Policy

    +   - Sitemap


    Control the list of current pages in the admin console and on your website.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_54_0.png)'
  merge: -1
  img_proc: true
- pgno: 55
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 56
  md: '![](img/b21e3dc5c94405bc7b3f102758ea770c_56_0.png)


    Use the **Apply** button frequently, especially if you are working with large
    amounts of text, keep a copy of it in a separate editor window. If the connection
    is lost or time''s out, then the page will fail to load in the browser and the
    modifications would be lost.


    # Previewing changes


    If you would like to preview the changes before saving, switch to the **Preview**
    tab without applying the changes. You can see the changes displayed in the preview
    window, but they will not be visible to the visitors of your website at this moment.
    Once you have applied or submitted the edited page, the changes will be made visible
    to your site''s visitors.


    # Changing the page alias


    You can change the page alias of the page as well. Switch to the **Options** tab
    while editing the page, and enter the desired alias in the **Page Alias** field.
    Think of page alias as the link to the page. You are not allowed to enter special
    characters in this field, so use spaces or leave it empty. Choose the name entered
    here carefully as you will not be able to change it easily after your website
    is published online. Once your website is discovered by the search engines, the
    pages will be displayed in the search results with links made from the page alias.
    If you change the page alias, then the page will not be found and your visitors
    will see an error message instead of the desired information.


    # Deleting pages


    You can delete your pages from the list of current pages in the admin console
    (**Content | Pages**). Find the page you do not need anymore, and click on the
    dust bin icon for that page. Be careful! Deleted pages cannot be restored. If
    you would like to keep the page for personal purposes only, then make it inactive
    (see the section titled *Control the navigation of the website* for more information).


    # Formatting page content


    You have already created some pages and edited them. Notice that the text you
    have entered in the **Content** field appears on the website in a certain place.
    The text is only a fraction of the entire page. You cannot change the design of
    the navigation, the header, or the footer part from here.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Creating Pages and Navigation


    If you were just an editor of the website (not a designer and not an administrator),
    then you would create or edit your articles here, but would not have the ability
    to change anything else on the website. This is the most important principle of
    a **content management system (CMS)**. We separate design from content to separate
    different tasks that can be accomplished by different persons. It also helps to
    separate the content of the layout and design so that it allows for globally changing
    the appearance of the website without going through all the circles of hell.


    An editor needs to have the ability to format his writing by making some phrases
    bold and creating lists or link to other pages of the website. Normally, HTML
    knowledge is required for this, unless you use the **WYSIWYG editor**.


    **WYSIWYG** means **What You See Is What You Get** and gives you the ability to
    format the text of a page with a common word processing feature. Additionally,
    the text is displayed in the editor in the same way that it will appear on the
    website.


    > Working with the WYSIWYG editor does not require any HTML knowledge to create,
    edit, and format the text part of your website.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_57_0.png)


    The WYSIWYG editor is the central and most important feature of every CMS. If
    you create a website with CMS, then you are going to consequently add content
    to your website. It means that apart from other modules, the WYSIWYG editor will
    be one of the most frequently used features of your CMS. Therefore, it is important
    to understand how the editor can help you and what you can do to make it suit
    your needs. There are some WYSIWYG editors available, for CMS Made Simple, the
    editor called **TinyMCE** is the most well integrated one.


    In the admin console, go to **Content | Pages** and select any page for editing.
    The **Content** field uses a WYSIWYG editor (you can see a toolbar above the content
    field), which is shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_57_1.png)'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'The toolbar of the editor is self-explanatory and is similar to most popular
    word processing programs. There are many more settings that can simplify your
    life if you discover them.


    Often, a large amount of text is written in word processing programs like Microsoft
    Word. If you copy the text from Word directly into the content of the field, then
    it will cause a lot of problems because of the bad HTML produced by Word. In the
    toolbar of the editor, there is a special button (the fourth in the first line)
    to paste text from Word. Always use this button to copy text from Word as it will
    filter any messy code from your text.


    # Configuring TinyMCE


    In the admin console, click on **Extensions | TinyMCE WYSIWYG**. You can change
    the width and height of the editor field here. By default, the size of the editor
    field is set automatically; change it according to your screen preference to gain
    more space to write and read.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_58_0.png)


    Deselect the **Auto** field, enter the desired width and height, and click on
    **Save settings**. There is a test field below the settings where you can immediately
    see the changes. This field allows you to preview changes so that you do not need
    to edit pages to control the appearance of the editor.


    On the **Profiles** tab, you can add even more features. For the administrator
    of the website, the changes have to be made in the **Advanced backend profile
    settings** section. Select the **Allow table operations** field to be able to
    create and edit tables with the WYSIWYG editor. After saving the profile, you
    will find the third line in the toolbar of the editor that helps to build HTML
    tables.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Creating Pages and Navigation


    Check the **Show file management options** field if you would like to upload images
    directly from the editor. Click on **Save profile**, and then click on the **Insert/edit
    image** icon in the toolbar. A small window pops up where you can change an image
    URL. Click on it, and the content of your images folder is displayed, as shown
    in the next screenshot. Normally, no uploads are allowed from this window. However,
    as you have activated the file management option, you will find the **File operations**
    section above the image list where you can upload your images.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_59_0.png)


    > Use folders to organize the images from the very beginning, or else you will
    end up with hundreds of assorted images in no time, and it will be a big problem
    to rearrange them, as they are already linked from various pages. Having a lot
    of images in one folder will slow down the loading of the file picker and finding
    the image you are looking for will become a challenging task.


    Continue to customize the editor in the **Plugins** tab. There are some useful
    plugins that are not active by default, but can be activated if needed. I recommend
    activating the following plugins:


    +   - **print**: Allows you to print the text from the editor

    +   - **fullscreen**: Adds a fullscreen editing mode

    +   - **searchreplace**: Adds search/replace dialogs for the text'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Click on Save plugins. Only the icon for fullscreen is added to the second
    toolbar before the help icon. The other two do not appear. Why? Let''s take a
    step back and check the Profiles tab again. In the Advanced backend profile settings
    section, you can see three toolbar lines. These lines control the order of the
    icons shown in the editor in the first, second, and third (yet empty) line. The
    single buttons are represented with their names in the toolbar fields, as shown
    in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_60_0.png)


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_60_1.png)


    You can delete some of them, change the order, or add new ones. That is what we
    are going to do.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Time for action – activating search and replace function


    There is a useful plugin that can search the entire contents of a page and replace
    all instances of a word or phrase with something different. Let''s see how we
    can activate this plugin in TinyMCE.


    +   1. In the admin console, click on **Extensions | TinyMCE WYSIWYG**.

    +   2. Click the **Plugins** tab.

    +   3. Select the checkbox beside the plugin called **searchreplace**, as shown
    in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_61_0.png)


    +   4. Click the **Save plugins** button.

    +   5. Switch to the **Profiles** tab.

    +   6. In the **Advanced backend profile settings** section, add the words **search,
    replace** to the **Toolbar 3** field, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Toolbar 1:

    cut,paste,pastetext,pasteword,copy,separators,justifyleft,justifycenter,justifyright,justifyfull,separa


    Toolbar 2:

    bold,italic,underline,strikethrough,advhr,separators,bullist,numlist,separators,outdent,indent,sep


    Toolbar 3:

    search,replace


    Click here to view toolbar-instructions in TinyMCE-wiki.


    7. Click on the Save profile button, and see the additional functions added to
    the third line of the toolbar, as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_62_0.png)


    # What just happened?


    Firstly, you activated the plugin in the Plugins tab. Activating a plugin means
    that the plugin is loaded with TinyMCE. But it is not enough to just activate
    it. In the second step, you had to customize the toolbar of TinyMCE to inform
    the editor where the buttons for the plugin should be shown.


    You saw that a single plugin can provide two buttons. Therefore, there were two
    words you had to enter in the field Toolbar 3. The first one, search, was for
    the search button, and the second one, replace, was for the replace function.
    They must not be used together. You can omit the first or the second one if you
    do not need that specific functionality.


    > Add the plugin removeformat in the Toolbar 3 field. This is a plugin that must
    not be activated first as it belongs to standard. The plugin allows the removal
    of any formatting from the text without looking at the HTML.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Creating Pages and Navigation


    There are more advanced settings in the WYSIWYG editor. To understand them, you
    need to know how CMS Made Simple works in general. I recommend referring to the
    settings of the WYSIWYG editor again and again while reading this book to make
    working with the editor more efficient.


    # Adding meta tags


    Meta tags contain additional information about your website. This information
    is not directly displayed to the visitors of the website; as the purpose of meta
    tags is to supply additional information about your website to search engines
    and web browsers. We have to distinguish between meta tags that are the same on
    each page of your website and tags that are unique to a specific page of your
    content.


    Meta elements are HTML or XHTML elements that provide additional information for
    search engines. They are not visible to the visitors of the website. Such elements
    must be placed as tags in the head section of the page. Meta elements can be used
    to specify the page description, keywords, and any other metadata.


    Meta element specifies name and the associated content describing the page. For
    example:


    ```

    `<meta name="keywords" content="business company, services" />`

    ```


    In this example, the meta tag identifies the page as containing keywords relevant
    to the phrase `business company` and the word `services`.


    # Time for action – adding meta tags to pages


    Let''s add some specific meta tags to the start page of our website.


    +   1. In the admin console, open **Content | Pages**.

    +   2. Click on the start page **Start** to edit it.

    +   3. Switch to the **Options** tab.

    +   4. In the field **Page Specific Metadata**, add meta tags that are specific
    to the page.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/b21e3dc5c94405bc7b3f102758ea770c_64_0.png)


    +   5. Click on **Apply** at the bottom of the page.

    +   6. Click on the magnifier icon beside the **Apply** button.

    +   7. See the head section of the website in the source code of the page.


    # What just happened?


    You have added meta tags in plain HTML to the start page of your website. These
    meta tags appear only on this specific page. Generally, meta tags for the description
    and keywords should be different on each page.


    > Any other tags (not only meta tags) for the head section of the generated page
    can be added here as well.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Creating Pages and Navigation\n\n# Adding global meta tags\n\nSome global\
    \ meta tags are already added to the standard installation of CMS Made Simple.\
    \ You can see these meta tags in the source code of every page generated by CMS\
    \ Made Simple:\n\n```\n```html\n<meta name=\"Generator\" content=\"CMS Made Simple\
    \ - Copyright (C) 2004-9 Ted Kulp. All rights reserved.\" />\n<meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=utf-8\" />\n```\n```\n\nTo change\
    \ or delete the tags, click on **Site Admin | Global Settings** in the admin console.\
    \ Find the meta tags listed above in the field **Global Metadata**. You can add\
    \ your own meta tags in this field using plain HTML.\n\n> Any other tags (not\
    \ only meta tags) for the head section of all pages can be added here as well.\n\
    \n# Understanding page hierarchy\n\nAll pages you have added in the last step\
    \ are now displayed in the main navigation of your website and can be found in\
    \ the current list of the pages in the admin console. But there are some more\
    \ pages in our website plan that have to be added to the hierarchy.\n\nWith page\
    \ hierarchy, you define the pages as being above, below, or at the same level\
    \ as another page. If a page is not shown in the main navigation, then we call\
    \ it a **subpage**. It also means that there is a parent page above the subpage.\n\
    \n# Time for action – adding subpages to a website\n\nLet's create four pages\
    \ below the **Our Company** page according to the website plan.\n\n+   1. In the\
    \ admin console of your website, click on **Content | Pages** and then on the\
    \ **Add New Content** link.\n+   \n+   2. Fill the fields **Title** and **Content**\
    \ as shown in the following screenshot and choose the page **2. -Our Company**\
    \ from the drop-down field **Parent**."
