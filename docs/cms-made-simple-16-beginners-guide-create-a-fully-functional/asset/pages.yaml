- pgno: 158
  md: '# Chapter 4: Advanced Concepts in Modern Computing Systems


    This chapter explores the fundamental principles underlying modern computing architectures,
    with a focus on distributed systems, concurrency, and fault tolerance. The material
    presented here builds upon the foundational knowledge established in earlier chapters
    and prepares the reader for advanced topics in system design.


    A key challenge in distributed systems is maintaining consistency across multiple
    nodes while ensuring high availability. Various consensus algorithms have been
    proposed to address this tension, each making different trade-offs between safety,
    liveness, and performance under partial failure conditions.


    In this section we examine the role of replication in achieving durability and
    availability. The primary approaches include synchronous replication, where every
    write must be acknowledged by all replicas before completion, and asynchronous
    replication, which offers higher throughput at the cost of potential data loss
    during failover scenarios.


    +   - Strong consistency guarantees linearizable semantics

    +   - Eventual consistency provides better availability

    +   - Causal consistency preserves ordering of related events

    +   - Read-committed isolation for relaxed transaction semantics


    The CAP theorem states that a distributed data store cannot simultaneously provide
    more than two of the following three guarantees: consistency, availability, and
    partition tolerance. In practice, network partitions are inevitable, so system
    designers must choose between consistency and availability when failures occur.


    Practical systems often adopt a hybrid approach, offering strong consistency within
    a partition and eventual consistency across partitions. This allows applications
    to maintain correctness for local operations while accepting temporary divergence
    during network outages.


    > > Distributed systems are characterized by the absence of a global clock and
    the possibility of independent failures. — Leslie Lamport


    We conclude with a discussion of operational considerations for deploying such
    systems in production environments, including monitoring, load balancing, and
    graceful degradation strategies.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Understanding users and their roles


    A **role** is a collection of permissions grouped by general tasks that the user
    has to be able to perform on the website. An **editor** may be responsible for
    creating, reorganizing, and editing pages. A **designer** does not need to have
    any permission for page operations, but for creating and editing templates (including
    module templates). An **administrator** is a person who has all permissions in
    the admin console and has unrestricted access to the entire admin console.


    In CMS Made Simple, three roles are suggested by default—editor, designer, and
    administrator. The first user created during installation of CMS Made Simple gets
    the administrator role by default. This user cannot be deleted, deactivated, or
    removed from the administrator group, as it would mean that there is no administrator
    for the website at all. You should choose the name of this user and pay attention
    to the password strength. Members of the administrator group automatically get
    all the permissions.


    Let''s see how you can create a new user and learn about the minimum features
    that every user has, independent of his/her role.


    # Time for action – creating a new user


    +   1. In the admin console, click on **Users & Groups | Users.**

    +   2. Click on **Add New User**, and fill in the fields, as shown in the following
    screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_159_0.png)'
  merge: -1
  img_proc: true
- pgno: 160
  md: '+   3. Click on **Submit**.

    +   4. Log out (**CMS | Logout**) and log in as **Peter**. The admin console should
    now look as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_160_0.png)


    # What just happened?


    You have created a new user without assigning him to any group. This user can
    log in to the admin console. There are only two main menu items that the user
    can access—**CMS** and **My Preferences**. The user can change his name, password,
    and e-mail address in the **My Account** section. He can define his personal preferences
    such as language, admin template, set default start page for the admin console,
    and more. He is also able to manage his personal shortcuts.


    It is important to define an e-mail address for every user, as this e-mail is
    used to recover the password, in case the user forgets it. On the login screen
    of the admin console of CMS Made Simple (when you are not logged in), you will
    find the link **Forgot your password**. Click it, enter **Peter** in the **Username**
    field, and click on **Submit**. An e-mail will be sent to the e-mail address associated
    with this user. If no e-mail address has been set for this user, then automatic
    password recovery is not possible. In this case, only the administrator of the
    website can reset the user''s password.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Users and Permissions


    The administrator of the website can set any user as inactive by clicking the
    icon with a green tick in the column **Active (Users & Groups | Users)**. The
    user account is not deleted, but the user is not able to log in to the admin console
    until his account has been activated again. If you delete the user, all permissions
    and personal user preferences will be irrevocably removed.


    If the user is not assigned to any group, then he is not allowed to do anything
    other than changing his personal settings. Let''s assign the user **Peter** to
    the editor group to see what tasks he will be allowed to perform as an editor.


    # Time for action – assigning a user to a group


    +   1. In the admin console, click on **Users & Groups | Users**.

    +   2. Select the user **Peter** for edit by clicking on his username.

    +   3. Select the **Editor** checkbox at the bottom of the screen, as shown in
    the following screenshot:

    +   4. Click on **Submit**.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_161_0.png)'
  merge: -1
  img_proc: true
- pgno: 162
  md: '5. Log out (CMS | Logout) and log in as Peter. The admin console should look
    as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_162_0.png)


    # What just happened?


    You have given the user additional permissions. Now, he can access a new menu
    item called Content. There are no content pages, but only News that Peter can
    submit. Let''s see what permissions Peter has now. In the admin console, click
    on Users & Groups | Group Permissions. In the first column, all available permissions
    are listed. To the right of the permission, there are three columns, one for each
    group—Admin, Editor, and Designer. You can limit the view to only one group by
    selecting the group at the top of the table from the drop-down list.


    Find all selected checkboxes in the Editor column to see what permissions the
    user assigned to this group gets. You can see that only the Modify News permission
    is checked for the group. This means that the user can create news articles and
    edit existing news. When the user creates a new item, the news is automatically
    saved as a draft, so that only the administrator of the page or a user who has
    the Approve News For Frontend Display permission can publish the article on the
    website.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Peter is not allowed to delete news articles (permission **Delete News Articles**)
    and has no access to the content pages (permission **Modify Any Page** or **Manage
    All Content**).


    # Content permissions


    As the target goal of CMS Made Simple is content management, the permissions on
    editing content are the most flexible. You can create and manage as many editors
    for the website as you like. Moreover, you can create editors with different access
    levels thus thoroughly separating who is allowed to do what on your website.


    For example, the permission **Manage All Content** will give the group full access
    to all the features that are available with the administrator account in **Content
    | Pages**. A user assigned to this group can:


    +   - Create new pages

    +   - Reorder and move them through the hierarchy

    +   - Make pages inactive or prevent them from showing in the navigation

    +   - Change the default page of the website

    +   - Delete pages

    +   - Edit pages including all the information placed in the **Options** tab


    To restrict the features mentioned above, you can grant the permission **Modify
    Any Page**. This permission allows us to edit the content only. The **Options**
    tab is not shown for the users with this permission, so that any information placed
    in the **Options** tab cannot be changed.


    In addition to the last permission, you can allow some fields from the **Options**
    tab, so that the editor is able to change the template or mark the page as inactive.


    # Time for action – creating an editor account


    The company page will be edited by the office assistant Mary. The office assistant
    must be able to edit existing pages, edit meta tags, assign templates, and set
    the page as inactive.


    +   1. In the admin console, create a new user (**Users & Groups | Users**), and
    assign the user to the group **Editor**, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 164
  md: '![](img/b21e3dc5c94405bc7b3f102758ea770c_164_0.png)


    +   2. Click on **Submit**.

    +   3. Modify the permissions of the group **Editor (Users & Groups | Group Permissions)**,
    and check the box for **Modify Any Page**.

    +   4. Click on **Submit**.

    +   5. In the admin console, click on **Site Admin | Global Settings**, and choose
    the **Advanced Setup** tab.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Users and Permissions


    +   6. In the **Basic Properties** field, choose options **Template**, **Active**,
    and **Page Specific Metadata**, as shown in the following screenshot (hold the
    *Ctrl* key to mark three options at the same time):


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_165_0.png)


    +   7. Click on **Submit**.


    +   8. Log out (**CMS | Logout**) and log in as **Mary**. Check that all of the
    required features are available when the page is opened for editing.


    # What just happened?


    You have created a new user and assigned the user to the group **Editor**. The
    group is allowed to edit any page of the website. Additionally, the fields **Template**,
    **Active**, and **Page Specific Metadata** are available to Mary when she edits
    the content.


    > 💡 Your template should have a Smarty plugin `{metadata}` in the head section,
    so that **Page Specific Metadata** can be placed in the source code of the page.


    Note that the permission **Modify Any Page** does not give you the possibility
    to restrict access to certain pages. If Mary is not allowed to edit every page
    on the website, but only some of them, then you should switch to the concept of
    additional editors, which will be described in the next section.


    # Additional editors


    For every content page, **additional editors** can be defined. You can add additional
    editors to a certain page in the **Options** tab in the field **Additional Editors**
    (you must be logged in as the administrator to do it). The additional editor of
    the page will be able to see and edit only the pages that he is assigned.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'To explain it in our example and make it more practical, assume that Mary is
    not allowed to edit all the pages but only pages **History**, **Team**, and **Contact
    Us**. Remove Mary from the group **Editor** (**Users & Groups | Group Assignments**)
    by deselecting the group in line with Mary''s account. Then open the three pages
    listed earlier, and assign Mary in the field **Additional Editors**, in the **Options**
    tab for every page. Now, log in as Mary, and open the list of content pages (**Content
    | Pages**).


    Additional editors automatically get the permission **Modify Any Page**, but are
    restricted to the pages where they have been set as additional editors. You do
    not need any special group or permissions for such users. Mary, as with every
    additional editor, is not allowed to create new pages.


    # Creating new pages


    The **Add Pages** permission depends upon other permissions that the user has.
    It is not enough to add the permission **Add Pages** for the editor. This is because
    creating new pages will automatically impact the whole website structure. Remember
    that the navigation is built entirely of the existing pages.


    Only those groups having the **Manage All Content** permission are allowed to
    create pages at every level of the website structure. Beware that these users
    will not only be able to create new pages, but also modify the whole website structure
    by reordering or even deleting pages.


    # Time for action – adding page permissions


    Assume that Mary was not only allowed to edit some pages, but also to create pages
    at certain places in the hierarchy. However, Mary is still not allowed to create
    pages at the top level of the website. In the last example, we added Mary as an
    additional editor to some pages. Let''s give her the right to create new pages.


    +   1. In the admin console, click on **Users & Groups | Groups**, and create
    a new group named **Additional Editors**.'
  merge: -1
  img_proc: true
- pgno: 167
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 168
  md: '> If you would like to approve pages created by editors before showing them
    in the menu of the website, click on **Site Admin | Page Defaults** and deselect
    the field **Show in Menu**. This way, all newly created pages are not shown in
    the navigation. By default, the editor cannot change these settings. He/she has
    to wait for the administrator of the website or for the user with the permission
    **Manage All Content** for the page to be shown in menu.


    In the same manner, you can grant the permission **Remove Pages**. Assign the
    permission to the group **Additional Editors**, so that they can delete only those
    pages where they have been assigned as editors.


    # Designer permissions


    If you have a user with strong HTML and CSS knowledge who is able to make reasonable
    changes to the entire layout of the website or just to the module templates, then
    you can assign that user to the group **Designer**.


    A designer must have the following set of permissions:


    +   - Add Stylesheet Associations

    +   - Add Stylesheets

    +   - Add Templates

    +   - Manage Menu

    +   - Manage Themes

    +   - Modify Files

    +   - Modify Stylesheet Associations

    +   - Modify Stylesheets

    +   - Modify Templates

    +   - Remove Stylesheet Associations

    +   - Remove Stylesheets

    +   - Remove Templates

    +   - View Tag Help


    This set of permissions allows the designer of the website to perform any task
    related to the design of the template. However, the designer will not be able
    to edit the content, submit news, or set any site preferences.'
  merge: -1
  img_proc: true
- pgno: 169
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 170
  md: 'In the admin console (Site Admin | Global Settings), under the Advanced Setup
    tab, you can define Basic Properties for the additional editors such as Image.
    We used this field in the last chapter. Here, the editor can choose an image from
    a drop-down list and thus assign an image to a certain location in the template
    defined by the designer.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_170_0.png)


    There is a useful third-party module called Template Externalizer. It allows you
    to use any external editor to edit your templates and stylesheets. After installing
    and turning on Development Mode, the module automatically extracts all stylesheets
    and templates into the specified directory.

    If you modify templates in this external directory, changes are automatically
    detected, imported to the database, and take effect immediately. When the module
    is installed, there is the permission Template Externalizer that can be granted
    to the group Designer.


    # Viewing the admin log


    The admin log records the details of the changes made to the site by all users.
    This log can be found in the admin console (Site Admin | Admin Log) and includes
    records about the creating, deleting, and changing of:


    +   - Pages and global content blocks

    +   - Templates and stylesheets

    +   - Users, groups, and permissions

    +   - Site preferences

    +   - Modules


    At the top of the log, you will find a navigation section providing links to the
    first, next, previous, and last pages of the log. There is also a link to download
    the complete log as a tab separated text file. At the bottom is the Clear Admin
    Log link. This will clear the entire log.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_170_1.png)


    Important! You won''t be asked to confirm the Clear Admin Log, and this action
    cannot be undone once completed.


    Once the admin log is cleared, there is no evidence of who has changed anything
    on the website and what the changes were. Therefore, there is even a separate
    permission called Clear Admin Log that is granted separately from the permission
    Modify Site Preferences.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'There are five columns in each log entry, which are as follows:


    +   - **User**: This shows the username of the user who performed the action.
    Even if the user is deleted later, the username is still saved in the log.

    +   - **Item ID**: This shows the database ID of the affected item. Note that
    item IDs are only unique to the **Item Name** shown in the next column and not
    across the whole database, so the same item ID may appear repeatedly.

    +   - **Item Name**: This shows the name of the item affected.

    +   - **Action**: This describes the type of change made to the item.

    +   - **Date**: This saves the date and time the change was made.


    If you have novice users with access to the admin console, then you probably would
    like to keep all versions of the content to be able to restore them if something
    goes wrong. There is no such feature in the standard installation of CMS Made
    Simple, but there is a nice third-party module that you can install additionally.


    # Archiving changes and restoring them


    Once the **Archiver** module is installed, it keeps a copy of every content page,
    global content block, stylesheet, or template that is edited or deleted. It also
    provides the possibility to restore anything in the archive to the current state.
    This means that your users can edit various aspects of the site, and you can reverse
    their changes later.


    To install the **Archiver** module, open the admin console, and click on **Extensions
    | Module Manager**. Click on the **Available Modules** tab, and then click the
    **Download & Install** link which can be found in the same line as the module
    name. The module is installed.


    After installation, the module will automatically start saving changes into the
    archives. For example, if you would like to track the changes of the start page,
    open the page, and save it without any changes, so that the first version of the
    page is created. This version will be used as a base for future restorations.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Time for action – restoring changes made by an editor


    Assuming that you have installed the Archiver module, as just described, you can
    restore the changes made by the editor as follows:


    +   1. Log in as the editor and edit any page that you are allowed to.

    +   2. Log out and then log in again with the administrator account.

    +   3. Click on Content | Archive Manager Module.

    +   4. Search for the name of the page that has been edited in step 1, and click
    on it.

    +   5. In the Expanded Archive View, find the second last version (revision) of
    the page and click on the last icon in the column Operation.

    +   6. View the page.


    # What just happened?


    You have restored the older version of the content and made it to the current
    one. The editor''s version is not deleted but just replaced, so that you can restore
    it any time.


    You can automatically purge archives either by the number of stored versions for
    each item (that is, keep only the last five versions of each page, global content
    block, stylesheet, or template) or by date (that is, keep the versions of the
    last seven days only). For automatic purge setup, click the Archive Preferences
    link in the admin area of the module (Content | Archive Manager Module).


    You do not have to purge archives, though you can keep accumulating all changes.
    However, if you have a lot of changes made daily, you must purge your archive
    to prevent an overflow of the database.


    > This module is not a substitute for the regular offsite database backups. The
    data is still stored in the same database, which might render the archives useless
    upon a database crash. Read the appropriate section in Chapter 11, Administration
    and Troubleshooting to learn how to create database backups.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Overview of all default permissions


    Permissions are always given to the group and are shared by all users assigned
    to this group. In the following table, the first column is the name of the permission,
    the second column is a suggestion as to what role the permission can be granted
    to, and the third column advises you if there are some preconditions for the permission
    to take effect.


    | Permission | Suggestion for the role | Description |

    |---|---|---|

    | Add Global Content Blocks | Editor | The group is allowed to create new global
    content blocks (Content | Global Content Blocks). Depends upon the permission
    Modify Global Content Blocks. |

    | Add Groups | Admin | The group is allowed to create user groups (Users & Groups
    | Groups). Depends upon the permission Modify Groups. |

    | Add Pages | Editor | The group allows the creation of children content pages
    below the pages where the user is an owner or an additional editor. The user must
    be set as Owner of the page or an Additional Editor. |

    | Add Stylesheet Associations | Designer | The group is allowed to associate stylesheets
    with templates. |

    | Add Stylesheets | Designer | The group is allowed to create new stylesheets.
    |

    | Add Templates | Designer | The group is allowed to create new templates. |

    | Add Users | Admin | The group is allowed to create new users with access to
    the admin console. |

    | Allow usage of advanced profile in TinyMCE | Editor | Users in this group will
    automatically get advanced profile settings made for the TinyMCE module. However,
    they are not able to change the profile itself. |

    | Approve News For Frontend Display | Editor | Allows changing the Status field
    of the news item from Draft to Published. The user in this group is also able
    to edit news articles. |

    | Clear Admin Log | Admin | Clear the history in Site Admin | Admin Log. Depends
    upon the permission Modify Site Preferences. |

    | Delete News Articles | Editor | The group is allowed to delete news articles.
    Depends upon the permission Modify News. |

    | Manage All Content | Editor | The group is allowed to create, move, and delete
    pages. The group is allowed to access the Options tab while editing the pages
    and change anything that can be found on the tab in contrast to the permission
    Modify Any Page. |

    | Manage Menu | Designer | The group can modify menu templates and create new
    menu templates. |'
  merge: -1
  img_proc: true
- pgno: 174
  md: '| Permission | Suggestion for the role | Description |

    |---|---|---|

    | **Manage Themes** | Designer | The group is allowed to export themes. If dependant
    permissions are available, the user is also able to import themes. Depends upon
    the permissions **Add Stylesheet Associations**, **Add Stylesheets**, and **Add
    Templates**. |

    | **Modify Any Page** | Editor | The group is allowed to edit content pages. There
    is no **Options** tab while editing the content for this group. However, some
    fields from the **Options** tab can be added from **Site Admin | Global Settings**
    (tab **Advanced Setup**, field **Basic Properties**). |

    | **Modify Events** | Admin | The group is allowed to add and reorder events (refer
    to Chapter 8). |

    | **Modify Files** | Editor | Allows using **File and Image Manager**, thus giving
    full access to the `/uploads` folder of your installation. |

    | **Modify Global Content Blocks** | Editor | Allows editing and deleting of global
    content blocks. |

    | **Modify Group Assignments** | Admin | Allows assigning users to different groups.
    |

    | **Modify Groups** | Admin | Allows changing group names. |

    | **Modify Modules** | Admin | Allows managing of **Extensions | Modules** and
    **Extensions | Module Manager**, thus installing, upgrading, uninstalling, and
    removing modules. |

    | **Modify News** | Editor | Allows editing news and creating new articles with
    status **Draft**. |

    | **Modify Permissions for Groups** | Admin | Allows modifying permissions for
    the group. |

    | **Modify Site Preferences** | Admin | This is a set of multiple permissions
    including the tabs **Preferences**, **Settings**, or **Options** in different
    modules. For example, the user is able to access the **Options** tab on the **News**
    module, the **Settings** tab in **File Manager**, **CMSMailer**, the **Options**
    tab in the **Search** module, and so on. |

    | **Modify Stylesheet Associations** | Designer | Allows attaching stylesheets
    to the templates and resolving the attachment as well. |

    | **Modify Stylesheets** | Designer | Allows editing existing stylesheets. |

    | **Modify Templates** | Designer | Allows editing existing templates including
    templates in modules **News**, **Search**, and **Printing**. |

    | **Modify User-defined Tags** | Admin | Allows adding user defined tags to the
    website (refer to Chapter 10). |'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Users and Permissions


    | Permission | Suggestion for the role | Description |

    |---|---|---|

    | **Modify Users** | Admin | Allows editing the user with the exception of the
    administrator user account. |

    | **Remove Global Content Blocks** | Admin | Allows editing the global content
    blocks. Depends upon the permission **Modify Global Content Blocks**. |

    | **Remove Groups** | Admin | Allows deleting user groups. |

    | **Remove Pages** | Editor | Allows deleting content pages where the user is
    an **Owner** or **Additional editor**. |

    | **Remove Stylesheet Associations** | Designer | Allows removing stylesheet associations.
    |

    | **Remove Stylesheets** | Designer | Allows removing stylesheets. |

    | **Remove Templates** | Designer | Allows removing layout templates, but not
    the module templates. |

    | **Remove Users** | Admin | Allows removing users with exception of the own account
    and the administrator account. |

    | **Advanced usage of the File Manager module** | Admin | Allows viewing the complete
    structure of the website and not only the `/uploads` directory. For this permission
    to work, the advanced mode setting should be enabled in **File**. |

    | **View Tag Help** | Editor | Allows reading help for the custom smarty plugins.
    |


    # Module permissions


    Not only can the core functions and core modules of CMS Made Simple have permissions,
    but every third-party module you have installed on your page can add the module''s
    specific permissions to the list. If you still have the **Questions & Answers**
    module installed, as described in the last chapter, you will find the permissions
    **Manage Questions**, **Can Answer Questions**, and **Can Approve Questions**
    in your list of permissions (**Users & Groups | Group Permissions**).


    The **Archiver** module has the permission **Manage Archives** that can be granted
    to advanced users with access to the admin console or to the main editor with
    the permission **Manage All Content**.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# # User notifications


    There is a notification area in the admin console of CMS Made Simple located below
    the main menu.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_176_0.png)


    You saw the message just after the installation of CMS Made Simple advising you
    about the next steps to secure and configure the system. Later on, this area is
    used to notify us when a new version of CMS Made Simple is released. The **News**
    module uses the area to notify when there are some unpublished news articles that
    must be approved and published.


    Normally, each user logged into the admin console is able to read these notifications
    even if it is something that is not devoted to him.


    You can disable notifications in the admin console. Click on **Site Admin | Global
    Settings**, and select the tab **Advanced Setup**. Deselect the field **Allow
    users to view notifications** and the messages will disappear.


    # ## Pop quiz – users and permissions


    +   1. What is a role?

    +      a. A bunch of permissions.

    +      b. Another term only for editors.

    +      c. A term for a special visitor group.

    +      d. A term for visitors, whose permissions to read special contents can
    be defined.'
  merge: -1
  img_proc: true
