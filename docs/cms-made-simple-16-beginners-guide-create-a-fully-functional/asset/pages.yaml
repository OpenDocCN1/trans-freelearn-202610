- pgno: 120
  md: "# # 5\n## Using Core Modules\n\n*We have learned how to set up a website, plan\
    \ and create a complete website structure, and design the website. These were\
    \ the first steps we had to take before writing content and implementing additional\
    \ features such as news articles or search functionality.*\n\n> **What are core\
    \ modules?**\n> \n> Core modules are a few basic modules that offer important\
    \ features and are shipped with CMS Made Simple. They are installed by default\
    \ and are supported by the official development team of CMS Made Simple. These\
    \ modules are not essential, and your CMS website will work well without them.\
    \ You can use them if you need functionality such as news management, search function,\
    \ or custom navigation.\n\nIn this chapter, we will:\n\n+   - Create global content\
    \ blocks\n+   - Implement news article and categorize them\n+   - Add a search\
    \ function\n+   - Use a built-in **Image Manager** and **File Manager**\n+   -\
    \ Create a sitemap with **Menu Manager**\n+   - Create a print version of the\
    \ content pages or news articles\n+   - Learn how to install additional modules\
    \ that are not included in the standard installation of CMS Made Simple\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_120_0.png)"
  merge: -1
  img_proc: true
- pgno: 121
  md: 'In the following examples, I assume that you have a template like the one which
    was created in the last chapter and that your website structure is built according
    to the one shown at the end of Chapter 3, *Creating Pages and Navigation*. However,
    you can still proceed with this chapter if your structure or design is different.


    # Understanding global content blocks


    You can use global content blocks to add some repeated parts containing text and/or
    images in your website. These blocks contain the same information and can be used
    at any place in your template or in the content of any page. For example, you
    can create a contact box with the address and phone number of your company as
    a global content block and then add it at multiple places in your website.


    Sure, you can design the contact box every time you need it and add the contact
    information individually for each page. You can even copy the box from one page
    and paste it into another. It works until the phone number of your company changes.
    Now, you have to open each page where the contact box is added and change the
    phone number. Depending on the number of the pages, you could spend hours changing
    every page. Using the global content block, you can edit all the information in
    one place and just call the same content from any place on your website. If the
    phone number of the company has changed, then you adjust it in the global content
    block, and it is automatically changed on each page that uses this global content
    block.


    Let''s see how to use global content blocks on your website.


    # Time for action – adding a global content block to the website


    Let''s say that we need a contact box as described earlier on some of the pages
    placed somewhere in the content.


    +   1. In the admin console, click on **Content | Global Content Blocks**.

    +   2. Click on **Add Global Content Block**.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '3. Enter the **Name** of the block and then the contact information in the
    field **Content**, as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_122_0.png)


    > Use *Shift + Enter* on your keyboard to add line breaks.


    4. Click on **Submit**.


    5. In the list of the global content blocks, copy the Smarty tag from the column
    **Tag to Use this Block** to the clipboard.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '6. In the admin console, open a page of your choice (Content | Pages) for editing
    and paste the tag at the place where the contact box should be shown.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_123_0.png)


    7. Click on Apply, and see the result on your website.


    # What just happened?


    For the contact information, you have created a new global content block. Every
    time you need to display contact information on your website (whether in the page
    or in a template), you add the Smarty tag instead of the complete information.
    From now on, you make your changes only in the global content block, and each
    page and template using it will display the same information.


    Try it out. Add a new global content block to another page and see the result
    on both pages. Then in the admin console, open Content | Global Content Blocks,
    choose the content block with your contact information, and change something in
    it. Save it, and see the changes on both pages using it.


    # Managing news articles with module News


    Until now, we have added content pages which are under the control of the hierarchy
    manager of CMS Made Simple. For announcements or events in your company, you use
    the core module News. This module allows you to create quick, short statements,
    and then place them at any place on your website, templates, or pages. Your news
    should be really new. Nothing is as disappointing as websites containing news
    dated a year ago. "Aged" news gives a website an abandoned look.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'For your company website, you can announce the last project the company accomplished
    or any customer events. With the news section, you can also advertise the new
    products or services that your company offers. You can present your new customers
    or partners and wish your customers on holidays. When the visitors of the website
    find news articles dated just some days ago, they know that your website (and
    your company) is alive.


    If you cannot imagine what could be announced on the website, then skip this module.
    Do not place it only because it is standard and easy to use and other websites
    have news on them.


    # Displaying news on the website


    The **News** module is very flexible and can be displayed in many different ways.
    Let''s see how you can add news to the page **Announcements**. I assume that you
    have created this page already. If not, then you can put the news on the start
    page of your website as well. The next step will work on every page.


    # Time for action – displaying news on the page


    +   1. Open the page **Announcements** for editing (**Content | Pages**).

    +   2. Add the Smarty tag `{news}` at the place where news articles should be
    displayed, as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_124_0.png)'
  merge: -1
  img_proc: true
- pgno: 125
  md: '3. Click on **Apply**, and see the result of this Smarty tag on your website.
    It should look as follows:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_125_0.png)


    # What just happened?


    With only one short Smarty tag, you can display the first news article on your
    website. This article is already added with the standard installation of CMS Made
    Simple. But where can this article be edited and how can new articles be created?


    # Adding news


    All news that has ever been created can be found in the admin console. Open **Content
    | News**. You see the admin area of this module with many settings. On the first
    tab, **Articles**, you can search through the news if you have got lots of them.
    But at this point, you have just one news article that is displayed below the
    list and called **News Module Installed**. This news article is created automatically
    during installation of CMS Made Simple and is also shown on the page where the
    tag `{news}` has been added.


    Let''s add a new article to the list of news and see what can be changed to suit
    your requirements.


    # Time for action – adding news items


    +   1. In the admin console, click on **Content | News**.

    +   2. Click **Add Article**.

    +   3. Enter the **Title** of the news article, **Summary** text, and **Content**
    of the article.'
  merge: -1
  img_proc: true
