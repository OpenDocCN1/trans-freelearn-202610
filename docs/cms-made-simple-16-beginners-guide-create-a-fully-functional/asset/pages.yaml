- pgno: 76
  md: 'Use your own website plan or the sample one:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_76_0.png)


    # Creating pages and navigation


    First add pages that are on the first level in your hierarchy (marked in bold
    in the preceding diagram). Then add the pages from the second level (marked in
