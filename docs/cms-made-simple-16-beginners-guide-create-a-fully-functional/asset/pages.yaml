- pgno: 132
  md: "# What just happened?\n\nYou have created a new summary template for the news\
    \ articles. The summary template includes an ordered list of the news articles,\
    \ and each article is linked to the detail view. Then, you have added a Smarty\
    \ tag in the template below the sidebar menu. You have used the parameter `summarytemplate`\
    \ to specify exactly what template should be used to display the summary view\
    \ of the news articles in this place. If you do not use the parameter, then the\
    \ default template is used. In the standard installation of CMS Made Simple, the\
    \ **Sample** template is taken by default. You can change the default template\
    \ by clicking on the icon with the red cross in the column **Default** in the\
    \ list of templates (**Content | News | Summary Templates**).\n\nYou can edit\
    \ existing templates or create new custom templates. If you use the module for\
    \ different tasks such as job opportunities, announcements, and company blog,\
    \ you can create as many templates as you need. You can also specify which template\
    \ should be used to display the output of the module at the place where the tag\
    \ is called. An example call for displaying job opportunities on the website can\
    \ be:\n\n```\n```smarty\n{news summarytemplate=\"Jobs\" detailtemplate=\"Job\"\
    \n     category=\"Vacancies\"}\n```\n```\n\nFor the preceding example, you should\
    \ create a summary template with the name **Jobs** and a detail template with\
    \ the name **Job**. You also need a **Vacancies** category where you add at least\
    \ one job opportunity.\n\n# Adding custom fields to the module News\n\nSometimes,\
    \ you need custom information to be displayed in the announcements. For example,\
    \ you would like to add a department or a special location, or you would like\
    \ to associate files with the news announcing new products. In this case, you\
    \ would have to define custom fields in the **News** module.\n\nLet's see how\
    \ the location of the news can be added in the special field."
  merge: -1
  img_proc: true
