- pgno: 71
  md: '+   4. Scroll down to the bottom of the page, and click on the **Submit** button.

    +   5. View your website with the magnifier icon on the top right of the admin
    console.


    Do the same for the **Sitemap** page.


    # What just happened?


    You have deselected **Show in Menu** to hide the page from the main navigation
    of your website. The link to the page disappears from the top menu.


    However, the page is not deactivated. You can still view it if you enter the full
    address of the page in the address bar of your browser or place a direct link
    to it from other pages of your website. Normally you would use this feature to
    hide pages that are not important enough to be shown in the main navigation.


    Another reason can be that specific pages have to be displayed only under certain
    circumstances. An example for such a page can be a *Thank you!* page that has
    to be displayed to the visitor when he sends us a message using the contact form
    on the website. We speak about service pages in this case and will learn later
    on how to use them on your website.


    On the **Options** tab, you may have noticed another field that can be deselected:
    **Active**. Deactivating a page makes it unavailable to the visitors of the website.
    Even if a direct link is given to the page, the visitor will see an error message
    saying that the page could not be found.


    > Think of pages that are not active as pages that do not exist as far as visitors
    are concerned.


    You can use this feature to disable a page that you do not need any more. You
    can delete such pages and lose the contents of them or just deactivate them, while
    still being able to see their content in the admin console of your website. In
    this case, you are the only person who can see it. Some webmasters create inactive
    pages as a placeholder for future content.


    # What is your start page?


    When your website is published online, individual pages can be reached through
    their links. But what page is displayed to the visitor if only the domain name
    of your website is given?'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'In CMS Made Simple, we call this the **default page**. You can define any page
    to be the default one. In the admin console, open **Content | Pages** and find
    the column **Default** in the list of current pages. Only one page has a green
    tick in the column and the page marked in this way is the start page of your website.
    You can choose another page to be the default page by clicking on the red cross
    in the column. Before the default page is changed, you have to confirm the question
    **Are you sure you want to set (Page name) as site default page?** See how the
    green tick is now moved from the previous default page to the new one. The previous
    page shows a red cross automatically in the column. Logically, you can have only
    one start page for your website.


    # More navigation control with content types


    More control over your navigation can be achieved with different content types.
    You have surely noticed the **Content Type** field on the screen where the page
    is created or edited. The standard choice in this field is **Content** that is
    used to create an ordinary content page. You use this type in most cases.


    With different content types (refer to the following table), you can add links
    to your navigation and get other behavior than ordinary pages.


    | Content type | Description |

    |---|---|

    | **Internal page link** | Use this content type to create a link in navigation
    to a specific page that is actually at another level of hierarchy. This content
    type generates just a link to the specific page that you select in the field **Destination
    page**. |

    | **Separator** | Use this content type to internally separate different navigation
    sections from each other. This content type is mostly used to create sophisticated
    navigation structures or complex navigation design. |

    | **External link** | As the name of the content type suggests, add an external
    link with this content type to your navigation. Enter complete URL starting with
    `http://` in the field **URL** of the content type. |

    | **Error page** | This content type does not deal with navigation. It is explained
    in detail in Chapter 5, *Using Core Modules*. |

    | **Section header** | With this content type, you create a header in the navigation.
    This content type is not a link itself. It just "holds" other pages placed below
    it in the hierarchy. You use this content type to visibly divide your menu structure
    into different parts. |

    | **Content** | This content type is used as standard for normal content pages
    of your website. |'
  merge: -1
  img_proc: true
