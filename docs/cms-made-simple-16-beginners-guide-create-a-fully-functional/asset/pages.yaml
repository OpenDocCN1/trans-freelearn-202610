- pgno: 67
  md: '# What just happened?


    You have added a new page. This time you have selected a parent page placing the
    new page in the hierarchy below the parent one. In the admin console, you can
    see that the page is now indented under the parent page. It gets the number 2.1,
    saying that the page belongs to the page with number 2 and is its first child
    page. You will not find the page in the main navigation of the website, however,
    you can see the page added to the subnavigation, if you move your mouse over Our
    Company in the navigation.


    We need the page hierarchy to organize our pages into main sections and to have
    the subnavigations built automatically.


    If you would like to change the position of the page in the hierarchy, you have
    to edit the page by clicking on it in the page list. Select another parent page
    in the field Parent and save the changes. If you choose none in the drop-down
    list, then the page is moved to the first level and thus displayed in the main
    navigation.


    Use the Expand All Sections link at the bottom of the list of current pages in
    order to show all hierarchy levels. With Collapse All Sections, you can hide all
    subpages and show only the first level.


    You can reorder the pages that are on the same level by using icons from the Move
    column (down and up). However, if you have to move one or more pages from the
    very bottom to the top of the list, it can be hard to do it with move icons (especially
    if you have a large number of pages). Use the Reorder pages link in this case.
    This feature allows you to reorder pages by clicking on a page and dragging it
    to a different position within the same hierarchy level.


    Reordering pages in the admin console will also change the order of appearance
    in the navigation of your website.


    # Breadcrumbs


    Your hierarchy is also displayed in the so called breadcrumbs—navigation aid displayed
    on the website above the content. It starts with You are here, displays the trail
    of the page and provides links back to the parent page(s) of the current one.


    # Search engine friendly URLs


    While creating your website, you probably thought about how you would promote
    it in search engines. Before you start to share the URLs of your website''s pages,
    it is advisable to set up search engine friendly addresses.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Search engine friendly URLs do not contain any dynamic components in them and
    are more readable for visitors of your website and search engines. Compare the
    following two URLs:


    ```

    http://yourdomain.com/index.php?page=products

    ```


    ```

    http://yourdomain.com/products

    ```


    Which page address is better? Search engines index your website better if your
    website uses the second version. Some pages with dynamic query strings in the
    address (as in the first example) are never indexed, and some of them will take
    longer to get into the search results.


    If you do not care about search engines, then think about the visitors of the
    website. How easy is it to type or write down the address of the specific page
    if we do not use the second rewritten version? Imagine your visitor would like
    to recommend the page. He would do it without any difficulties with search engine
    friendly URLs and may fail with the first example.


    However, after installing your website with CMS Made Simple, you will find that
    the URLs of your pages are built in the first way. You can easily change them
    to achieve better results with the website.


    # Time for action – creating search engine friendly URLs


    To enable search engine friendly URLs on your website, perform the following steps:


    +   1. Start FileZilla or any other FTP browser of your choice.


    +   2. Connect to your hosting and select the file `config.php` for editing. (You
    can also copy the file to your local disk for editing and upload it after the
    following changes have been made).


    +   3. Search `config.php` for the section "URL Settings" and replace:

    +   `$config[''url_rewriting''] = ''none'';`

    +   with

    +   `$config[''url_rewriting''] = ''mod_rewrite'';`


    +   4. Close, save, and upload the file back to your web hosting.


    +   5. Further, using FileZilla or any other FTP browser of your choice, open
    the `doc` directory.


    +   6. Move the `htaccess.txt` file found in the `doc` directory to the root directory
    of your website (it is the same directory where the file `config.php` is present).


    +   7. Rename the moved file to `.htaccess` (the period at the beginning belongs
    to the new filename!).


    +   8. View your website in a browser, click on the top navigation area to see
    the new addresses for each page.'
  merge: -1
  img_proc: true
- pgno: 69
  md: "# What just happened?\n\nI am not going to bother you with technical stuff\
    \ (please read about the `mod_rewrite` module if you would like to know more).\
    \ You now have some pretty, clean URLs on your website.\n\nIf you have received\
    \ an internal server error, then please consider the following known issues:\n\
    \n+   - Your hosting company does not support `mod_rewrite` (ask your hosting\
    \ provider if you are not sure).\n+   - You have installed CMS Made Simple into\
    \ a subdirectory; for example, `http://yourdomain.com/mycms`. In this case, you\
    \ will have to edit the file `.htaccess` and replace the line.\n+     \n+    \
    \ `RewriteBase /`\n+     \n+     with\n+     \n+     `RewriteBase /mycms`\n+ \
    \    \n+     Change the name after the slash to your subdirectory's name.\n\n\
    # Getting more success from hierarchy\n\nEnabling search engine friendly URLs\
    \ has another useful effect. The URL of the page now contains the full path to\
    \ the page including the parent page and not only the page alias.\n\nLet's assume\
    \ that you have created the page Philips TV (with page alias philips) and selected\
    \ the page Plasma TV (with page alias plasma-tv) to be the parent page for it.\
    \ Without rewriting the URL of the page, Philips TV gets the following address:\n\
    \n```\nhttp://yourdomain.com/index.php?page=philips\n```\n\nAfter rewriting the\
    \ URL of the page, we get:\n\n```\nhttp://yourdomain.com/plasma-tv/philips\n```\n\
    \nThe second version is cleaner, looks better for visitors, can easily be written\
    \ down or remembered, and is better for search engines as you also have more keywords\
    \ in your URL.\n\nRemember that page aliases have to be unique. For example, you\
    \ cannot have this kind of structure:\n\n```\nyourdomain.com/products/tv\n```\n\
    \n```\nyourdomain.com/news/products\n```\n\nThe alias *products* can be used only\
    \ once on the entire website."
  merge: -1
  img_proc: true
