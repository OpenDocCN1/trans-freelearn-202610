- pgno: 152
  md: '# What just happened?


    You have installed a new module. The **Questions** module is now available on
    every page or template of your CMS Made Simple website. You will find the **Questions**
    module in the list of installed modules in the admin console (**Extensions | Modules**)
    as well.


    Each module that you have installed can be used in the content of a page or template
    by using the Smarty tag `{cms_module ...}`. This tag has a required parameter
    `module` that is set to the name of the module, as shown in the module list (**Extensions
    | Modules**). Generally, all modules can be used with this tag:


    ```

    ```smarty

    {cms_module module="MODULE_NAME"}

    ```

    ```


    Just replace `MODULE_NAME` with the name of the installed module to see how the
    module acts by default. The **Questions** module displays the FAQs which can be
    created, edited, deleted, and categorized in the admin console (**Content | Questions
    and Answers**). It is self-explaining how the FAQ can be built (use the link **Add
    New Question** to add a new pair of questions and answers). Please use the **Help**
    link in the list of installed modules (**Extensions | Modules**) to find some
    usage examples and an additional parameter for the module **Questions**.


    For example, if you do not like the filter form in the list of questions and answers,
    remove it with the parameter `nofilter` shown as follows:


    ```

    ```smarty

    {cms_module module="Questions" nofilter="yes"}

    ```

    ```


    Some modules have a short version and can be called only by their names.


    | Short notation | Long notation |

    |---|---|

    | `{news}` | `{cms_module module="News"}` |

    | `{search}` | `{cms_module module="Search"}` |

    | `{menu}` | `{cms_module module="MenuManager"}` |

    | Not available | `{cms_module module="Questions"}` |


    There is no difference in functionality. Every module can be used with long notation
    and only some of them have short notation implemented. Please see the **Help**
    module to determine whether or not short notation is available.


    # Installing modules with XML file


    On some web hosting, there is no possibility to connect to external resources
    (such as CMSMS Forge). In this case, you will not see any module in the list of
    available modules. Nevertheless, you can install modules manually as well, if
    you download the XML installation file for them.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Using Core Modules


    To find the module installation file, open CMSMS Forge (http://dev.cmsmadesimple.org)
    and search for a desired module. Click on the module name, and select the **Files**
    tab to the right of the module name. Find the newest XML file in the list of files
    shown, and save it to your local disk. In the admin console, click on **Extensions
    | Modules**, and select the saved XML file in the field **Upload**, below the
    list of the modules. Click on **Submit**, and the module will be shown in the
    list of modules. However, it is not installed yet. Click the **Install** link
    beside the module to complete its installation. You can now use it the same way
    as if it had been installed automatically with the **Module Manager**.


    # Available upgrades


    From time to time, new versions with new features or bug fixes are released. In
    the **Available Upgrades** tab, you can see which of your installed modules have
    newer versions compared to the version installed on your system.


    To upgrade modules, search for their names in the list on the **Available Modules**
    tab and click the **Upgrade** link that is shown at the place of **Download &
    Install** link. Before upgrading, make a backup of your website so that you have
    the ability to roll back if something goes wrong.


    # How to find the best CMS Made Simple module for your purpose


    There are a lot of modules for CMS Made Simple, but not all of them are of the
    same quality. The version of the module normally indicates how mature it is. Module
    versions that start with 0, like 0.3 or 0.5, are alpha versions. This means that
    these modules are in the first phases of testing and could exhibit some errors
    or unexpected behavior. Use these modules with caution if you are not a technical
    person.


    The **About** link beside the module name in the list of **Available Modules (Extensions
    | Module Manager)** will inform you when the latest version of the module was
    released. A last release date of 2006 or 2007 could indicate that there is no
    scope for development for the module anymore, and it has been abandoned by its
    developer. In this case, it is better to look for another module or use this one
    at your own risk.


    The **Help** link gives you extended information about the module functionality.
    See the **parameter** section to figure out if your requirements can be solved
    with the module in question.


    # Uninstalling and removing modules


    All modules that you do not need can be uninstalled from the list of modules (**Extensions
    | Modules**). If you do not need the module and uninstall it, then all data that
    is saved in it will be lost. The module itself will be inactive but still shown
    in the list of modules. By removing modules from the list, you also physically
    remove the associated module files from your website.'
  merge: -1
  img_proc: true
