- pgno: 112
  md: "# What just happened?\n\nYou have just created a new menu template. In the\
    \ menu template, you have used some Smarty code that needs to be explained. The\
    \ most important part in the code is the Smarty variable $nodelist. It is not\
    \ an ordinary Smarty variable like the ones we have already learned. This variable\
    \ is an array. It means that more than one value is saved in it. This variable\
    \ contains all the information, such as menu texts or URLs of all active pages\
    \ of our website. With the built-in Smarty function foreach, we can run through\
    \ all the values of this variable and display the same piece of HTML code for\
    \ each page. Let us see exactly how a loop works.\n\nforeach goes through every\
    \ single page saved in the variable {$nodelist} and prints the HTML code placed\
    \ between the foreach tags as many times as there are pages found in the variable.\
    \ For each run, the values for the single page are saved in the variable $node.\
    \ We name and create this variable with parameter item=node in the foreach tag.\
    \ The loop starts its run with the first menu item—the page Our Company. At this\
    \ point, the menu text and URL are saved in the variable $node. We can reach the\
    \ required information with {$node->menutext} and {$node->url} and use the tags\
    \ in the HTML code. With the next (second) run, the next page is saved in the\
    \ variable $node. So beginning with the second run, another menu text and URL\
    \ is pasted into the same HTML code. The foreach loop runs through every page\
    \ and stops automatically when no more pages are found.\n\nFooter navigation displays\
    \ all pages independent of their position in the hierarchy. You can limit the\
    \ footer navigation only to the first level as well. Do it the same way you did\
    \ it with the top navigation. Use parameter number_of_levels in the tag {menu}\
    \ shown as follows:\n\n```\n{menu number_of_levels=\"1\" template=\"footer_menu\"\
    }\n```\n\nforeach loops are a powerful way to construct any form of navigation\
    \ you can imagine. This way, you can use images instead of text in your navigation.\n\
    \nOne more example, how a graphical navigation can be created, is as shown:\n\n\
    ```\n{foreach from=$nodelist item=node}\n<a href=\"{$node->url}\">\n    <img src=\"\
    uploads/design/{$node->alias}.jpg\"\n         alt=\"{$node->menutext}\" border=\"\
    0\" />\n</a>\n{/foreach}\n```\n\nTo understand what HTML is produced by the preceding\
    \ Smarty code, in your mind, replace the bold Smarty tags with the actual values\
    \ of a page, for example, Contact Us:\n\n```\n<a href=\"contact-us\">\n    <img\
    \ src=\"uploads/design/contact-us.jpg\" alt=\"Contact Us\" />\n</a>\n```"
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Design and Layout


    As the previous code is placed in the `foreach` loop, the markup will be repeated
    for every page. You can see that for the graphical example to work, you will need
    to create a JPG file for every page. The name of the files has to correspond to
    the page alias. In our example, for the top navigation, you will need five images:


    +   - `our-company.jpg`

    +   - `products.jpg`

    +   - `client-center.jpg`

    +   - `contact-us.jpg`

    +   - `sitemap.jpg`


    Create the images (buttons) in the graphics editing program of your choice and
    upload them to the `uploads/design` directory on your web server. Create a new
    menu template with the name `graphical_menu`, and add the Smarty `foreach` code
    into it, as shown earlier. Then replace the top navigation in the main template
    (**Layout | Templates**) with the following line:


    ```

    ```smarty

    {menu number_of_levels="1" template="graphical_menu"}

    ```

    ```


    Now, the navigation is made of graphics instead of text.


    There is even more information about each page available in menu template which
    is given in the following table:


    | Variable | Explanation |

    |---|---|

    | `$node->pagetitle` | Title of the page |

    | `$node->depth` | Number of levels in the page hierarchy |

    | `$node->prevdepth` | Number of levels of the previous page in the page hierarchy
    |

    | `$node->haschildren` | Prints 1 if the page has child pages |

    | `$node->target` | The target of the page can be set by the editor from the drop-down
    menu. In your template, you use it in the following way, as shown in the following
    example:<br><br>`<a href="{$node->url}" target="{$node->target}">` |

    | `$node->alias` | Prints the alias of the page |

    | `$node->current` | Prints 1 if the page is currently displayed |

    | `$node->type` | The type of the page. Possible values are:<br><br>`sectionheader`
    (Section header)<br>`separator` (Separator)<br>`content` (Content)<br>`pagelink`
    (Internal page link)<br>`link` (External link) |'
  merge: -1
  img_proc: true
