    You can either open the XML file or save it as backup for your design.


    # Pop quiz—testing what you have learned


    +   1. Where in the admin console can you find all the templates, which you have
    at your disposal in your project?

    +      a. **Layout | Templates**

    +      b. **Layout | Stylesheets | Templates**

    +      c. **Content | Pages | Main | Templates**

    +      d. **Extensions | Templates**


    +   2. How can you replace static text with dynamical components?

    +      a. Integrate Smarty tags like `{content}` in the template.

    +      b. Integrate Smarty tags like `<content>` in the template.

    +      c. Integrate modules like ''DynTxt'' in the CSS stylesheet.

    +      d. Integrate a Smarty tag like `<breadcrumbs>` in the content field of
    the page.


    +   3. If you have a closer look at the Smarty tag `{last_modified_by format="username"}`,
    which part of it is the "name" of the parameter?

    +      a. `last_modified_by`

    +      b. `format`

    +      c. `username`

    +      d. `by format`


    +   4. What do you do if you want to have special and dynamic information on every
    page?

    +      a. Add Smarty plugins directly into the content of the page by using the
    content field.

    +      b. Add Smarty plugins directly into the content of the page by using the
    stylesheet.

    +      c. Add Smarty plugins directly into an inactive template, because you can
    fit the output easier in the layout of the site.

    +      d. Add Smarty plugins directly into the active template, because this is
    the only way to display it.'
