- pgno: 323
  md: '# Step 1


    Consider this step for busy websites that accept data from visitors, like **Comments**
    or **FrontEndUsers**. Enable the **Site Down Message** to prevent somebody from
    using the website while you are moving it to another hosting service. In the admin
    console, click on **Site Admin | Global Settings**, and select the **Sitedown
    Settings** tab. Write the message that the visitors to the website will see if
    they try to use your website during the transfer, then tick the **Enable Site
    Down Message** checkbox, and click **Submit**. From now on, visitors to the website
    will see the **Site Down Message** instead of the website.


    # Step 2


    Clear the `cache` folder. CMS Made Simple creates a lot of temporary files to
    speed up the website. These files must not be saved with the backup as they will
    be generated automatically once CMS Made Simple is installed and running. To clear
    the `cache` folder in the admin console, click on **Site Admin | Global Settings**,
    select the **Advanced Setup** tab, and click the **Clear** button below the **Clear
    Cache** label.


    # Step 3


    Create a database backup, as described in the preceding section. Import the database
    on the new host using phpMyAdmin. Log in to phpMyAdmin on the new host, and select
    the database intended for use of CMS Made Simple. Click on the **Import** tab,
    and select the file with the database backup in the field **Location of the text
    file**. Click **Go**. The database is imported to the new host.


    # Step 4


    Copy all the files from your old site to your new site using an FTP client (for
    example, FileZilla). After the files are transferred, remember to check the permissions
    for the folders on the new site to ensure that they are set correctly. Check the
    permissions on the following folders:


    +   - `/tmp/templates_c`

    +   - `/tmp/cache`

    +   - `/uploads`

    +   - `/uploads/images`

    +   - `/modules`


    They should be writable. Contact your provider if you are not sure how to do it.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Step 5


    In the last step, you have to open and modify the files `config.php` and `.htaccess`.


    In the file `config.php`, check and adjust the following sections:


    +   - Database Settings

    +   - Path Settings

    +   - Image Settings


    Update them with the database access credentials and paths applicable to the new
    server.


    > The path settings are not always that obvious. In your FTP browser, it might
    show something like `/csmmadesimple`. However, the real path on the server might
    be something like `/home/user/html/cmsmadesimple`. If you have the wrong path,
    then look at the error messages when you try to access your site after transfer.
    This message will give you a hint as to the real path settings. Contact your provider
    for help if it is still unclear.


    The `.htaccess` file should only be modified if you change the domain name. However,
    if you did not make any changes to the file due to the search engine optimization,
    leave it as is.


    Try to log in to the admin console of CMS Made Simple on the new hosting. If everything
    looks good, then disable the **Site Down Message** and see the page up and running.


    # Ungrading CMS Made Simple


    The CMS Made Simple development team improves the application constantly; therefore
    new versions are released regularly. You should ensure that you upgrade your system
    consequently. Upgrades are important for several reasons.


    +   - **Free community support:** You will probably get no help for old releases,
    as there are only a few users who are still working with the old version. The
    development team will not fix any issues in old versions, as a lot of issues are
    already solved in newer releases, and you are always encouraged to install the
    latest version.

    +   - **Features:** In new releases, new features are implemented. If you work
    with an old version, then you have to reinvent the wheel if you need something
    already developed and existing.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '+   - **Third-party modules:** Developers of additional modules release new
    versions, including new functionality and corrected bugs. Newer versions of the
    modules often assume that the newest version of CMS Made Simple is installed.
    Sometimes, the feature you need is already implemented in the last version of
    the module, but you are not able to install it due to the outdated version of
    CMS Made Simple.


    +   - **Security releases:** Not only are errors corrected in new releases and
    new functions added, but from time-to-time, security holes are discovered. In
    this case, exploits are quickly spread throughout the internet. Exploits are generally
    sequences of commands that take advantage of a bug in order to take control over
    your system. If you do not upgrade, then your system becomes extremely vulnerable,
    your data could be damaged or lost, and nobody would take responsibility for it
    except you.


    +   - **Stability and performance:** New releases often include improvements in
    performance. Even if you are not interested in the features included in new releases,
    your website can gain speed just by upgrading.


    If a new version has been released, then you will see a message saying **You have
    1 unhandled notification** in the admin console below the main menu. The message
    appears only once a day! Click on the plus sign beside the message, as shown in
    the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_325_0.png)


    Let''s see how to upgrade your installation to the newer version.


    It is important to create a backup of your database and all the files on the web
    hosting before every upgrade (please refer to the section *Backup your website*).
    If something goes wrong, you can always return to the previous version and start
    upgrading again. Having no backup means having no possibility to go back in case
    of an emergency.


    Open the link `http://cmsmadesimple.org` in the browser, and select **Downloads
    | File Releases** in the main menu on the top of the page. The list of releases
    is shown. If you are not sure what version of CMS Made Simple is currently installed
    on your web hosting, then open the admin console; you can see in the footer area
    at the very bottom of the page what version is used on your website.


    In the downloads section, find the newest release, and choose the file named `cmsmadesimple-full-diff-[YOUR.CURRENT.VERSION]-[NEW.VERSION].tar.gz`.
    For example, to upgrade from version 1.6 to 1.6.5, you have to choose the file
    `cmsmadesimple-full-diff-1.6-1.6.5.tar.gz`. Save the file to your local disk and
    extract it.'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'If you cannot find the upgrade file from exactly your version to the current
    one, then you will have to download the last full version above the one installed
    (for example, 1.6) and proceed with these instructions using that version first.


    Before copying the files to the web server, you should probably set up a **Site
    Down Message (Site Admin | Sitedown Settings)**. Now open an FTP browser, and
    upload all the files from the extracted folder to your web hosting. Overwrite
    the existing files and directories. You have to overwrite these existing files
    with the newer versions.


    After uploading the new files, check if a folder called `/install` has been created
    in the folder where CMS Made Simple is installed. If so, then enter in your browser
    `http://www.yourdomain.com/install/upgrade.php` (substitute the domain with yours).
    This will automatically update your database to the newest version. Do not forget
    to delete the install folder after upgrade. If a folder named install was not
    created, then you have finished the upgrade at this point.


    Check the version in the footer area of the admin console. It should display the
    new version now.


    You then have to upgrade the modules. In the admin console, click on **Extensions
    | Module Manager**, and see if some modules have to be upgraded on the **Available
    Upgrades** tab.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_326_0.png)


    If there are some upgrades shown, then look for the modules on the **Available
    Modules** tab, and click on the **Upgrade** link beside the module name.


    > Sometimes, the notification for the new version is not displayed in the admin
    console. This is due to the security settings of your web hosting. Another possible
    way of being informed about a new version in this case is subscribing to the official
    RSS feed from the CMS Made Simple blog or (if you are a registered member in CMS
    Made Simple Forum) to subscribe to the board **Announcements**.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'Remember that upgrading your system is not difficult if you do it regularly.
    Go with the development to get the best free support and to be sure that your
    system is secure and stable.


    # Optimizing (performance tuning)


    Like every system, CMS Made Simple can be optimized and tuned for the best performance.
    The tips described in this section can significantly speed up your system. However,
    I recommend applying these instructions only if you encounter any performance
    issues.


    Before you start to optimize your system, you should know how the system performs
    without any optimization. CMS Made Simple has built-in performance measurement.
    If you open any page generated by CMS Made Simple in a browser and then see the
    source code of the page, you will find HTML comments at the end of every page,
    shown as follows:


    ```

    <!-- 0.267839 / 38 / 5834456 / 6113588 -->

    ```


    This comment can be broken into four parts:


    +   1. The page was generated in 0.267839 seconds by CMS Made Simple.

    +   2. 38 SQL queries were needed to generate pages.

    +   3. 5834456 bytes of memory were used.

    +   4. The peak memory usage was 6113588 bytes.


    You should save this comment to control the amount of resources that can be saved
    using optimization tips, given in the following sections. Every time you make
    an optimization, compare the new numbers on the same page with the previous ones.


    # Compression


    This option allows the output from your server to be compressed before being sent
    to the browser. In simple words, the page is zipped, and instead of sending HTML,
    the server sends a much smaller ZIP file. The smaller the file, the faster the
    website can be loaded. The browser is able to decompress the zipped page automatically,
    so that neither you nor your visitor should care about it.


    Compression can be turned on in the file config.php. Open the file and find the
    line:


    ```

    $config[''output_compression''] = false;

    ```


    Turn on the compression by setting it to true:


    ```

    $config[''output_compression''] = true;

    ```'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'This may provide a significant performance increase on some sites. However,
    it is not needed for Apache servers that have mod_deflate enabled. Please contact
    your provider if you are not sure. Consider that enabling this feature will significantly
    increase the CPU and RAM usage on the server side, and this can even slow down
    the website if the server is very busy.


    # Persistent connections


    CMS Made Simple is based on the database. Therefore, for each page loaded in the
    browser, a connection to the database is needed. There are two concepts on how
    CMS Made Simple connects to the database. Normally, for each page, the new connection
    to the database has to be established. A persistent connection is a concept which
    is designed to improve performance for some applications. Instead of the connection
    being established for each page, it is opened once and then kept for the application''s
    lifetime.


    In the file config.php, you can define how CMS Made Simple should connect to the
    database. Open the file and search for the following line:


    ```

    $config[''persistent_db_conn''] = false;

    ```


    Change the line to:


    ```

    $config[''persistent_db_conn''] = true;

    ```


    This would ensure that the connection to the database is not closed after the
    page is loaded but is kept open. The next time the page is requested, the server
    checks whether there is an opened connection and uses it for the new page. In
    this way, the time for establishing the new database connection is saved.


    > This setting is not allowed by all providers. Please contact your provider to
    figure out if you can use persistent connections on your web hosting.


    # CSS in global settings and static CSS


    Another place where you can save time is in the generation of the stylesheet for
    the page. If you open your page in the browser and see the page source, then you
    will see that the links to stylesheets are actually references to the PHP file
    stylesheet.php:


    ```

    <link rel="stylesheet" type="text/css" href="http://yourdomain.com/stylesheet.php?cssid=59"
    />

    ```


    However, it is not necessary to generate stylesheets with every page again and
    again. You can cache them when you are ready with the design of the website and
    do not plan to change it.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'In the admin console, click on Site Admin | Global Settings, and switch to
    the tab Advanced Setup. Find the field Maximum amount of time (seconds) stylesheets
    can be cached in the browser, and enter any value other than 0, as shown in the
    following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_329_0.png)


    It depends on how often you will update the stylesheet in the future. If you do
    not plan to change it in the future, then go for a high value like 2592000 seconds.
    This means that the stylesheet will be cached for a month.


    +   - 1 hour = 3600 seconds

    +   - 1 day = 86400 seconds

    +   - 1 week = 604800 seconds


    Be sure that you change the value back to 0 if you change the stylesheet, as you
    will not see any changes on the page with the old cached version.


    These performance tips can speed up CMS Made Simple. However, you will get more
    effective results if you tune the server where CMS Made Simple is installed and
    not only CMS Made Simple itself. Server tuning assumes that you have full access
    to the server and basic Linux administrator knowledge.


    # How to secure your installation


    In this section, you learn how to secure your CMS Made Simple installation. We
    will not discuss how to secure the web hosting server as this is a stuff for the
    web hosting provider. If you host your website on your own, then you should know
    how to secure the server in general. If you host on a shared hosting or a managed
    server, then your provider would do it for you and you don''t need to worry about
    it. Let''s see what the provider will not do for you.


    The first rule for a secure website is to upgrade CMS Made Simple and its modules
    regularly. Every time a new version of CMS Made Simple is released, run the upgrade
    as soon as possible. It is especially important for security releases that we
    close security holes. Upgrading is very easy. Please refer to the section Upgrading
    CMS Made Simple to read about how to perform upgrades.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# System verification


    A CMS Made Simple installation consists of its files and a database. The database
    holds page structure, page content, design, and any module data and can change
    daily on busy websites. In contrast to the database, files are a kind of static
    part of the website. They are changed only if you:


    +   - Upgrade CMS Made Simple

    +   - Upgrade any module

    +   - Install new modules

    +   - Remove modules from the installation

    +   - Intentionally or unintentionally make changes to the files on your own


    Sometimes files can be changed by malicious programs or hackers if you do not
    secure your system enough. So how can you be sure that the system files are not
    changed and everything is still okay.


    CMS Made Simple uses a checksum verification to prove that the files on your web
    hosting have not been changed. A checksum is a text string computed from a file
    for the purpose of detecting accidental changes that may occur during its transmission
    or storage. These checksum strings are generated for each file that originates
    from the core CMS Made Simple and can be downloaded from http://dev.cmsmadesimple.org/project/files/6.
    A checksum file is generated for each release of CMS Made Simple.


    Depending on your version (base or full, and release), choose the right checksum.dat
    file, and save it to your local disk. Open it in a text editor to see what is
    inside.


    ```

    3ad39cc13942818630935b56dc8af619  */index.php

    6f8ae75cfde0c5a81dc09f35ea40f7a6  */preview.php

    d53ee56d1c123a1ed04326ca3406e744  */favicon_cms.ico

    ...

    ```


    You will find a long list of checksum strings followed by the filenames and their
    paths. In CMS Made Simple, you can automatically validate all files in the admin
    console (**Site Admin | System Verification**). This function will compare the
    checksum strings of the original files with the files on your installation. Normally,
    your files should not have any changes if you have not made any upgrades to the
    system so far.


    The only acceptable errors are missing files from the install folder, as you had
    to delete this directory for security reasons. You may also be told that various
    index.html files in the tmp folder are missing or invalid. This is not critical.
    Missing the file SITEDOWN is also not critical.'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'Every time you run an upgrade of CMS Made Simple or any of its modules, you
    should create a new checksum file. In the admin console, open Site Admin | System
    verification, and click the Submit button in the Download Checksum File section.
    This function allows you to generate a checksum file for the current installation
    and save it on your local computer to be verified later. This should be done just
    prior to rolling out the website, and/or after any upgrades or major modifications.
    The integrity of the data can be checked at any later time by comparing the checksum
    file with the stored files.


    Using this function can assist in finding problems with uploads, or exactly what
    files were modified if your system has been hacked. If you suddenly encounter
    strange issues and suspect that your system has been attacked, then you should
    make a system verification first to see whether there are any changed files. If
    the checksums do not match, then the data was certainly altered (either intentionally
    or unintentionally).


    > The original checksum file from http://dev.cmsmadesimple.org only verifies the
    core CMS Made Simple and the core modules that are delivered with CMS Made Simple.
    Any additional modules that you''ve added are not verified.


    You can see the errors, as shown in the following screenshot:


    ```

    1 Files Not found

    Files Not found:

    ./tmp/cache/SITEDOWN


    2 Files failed md5sum check:

    ./tmp/templates_c/index.html

    ./tmp/cache/index.html

    ```


    According to the preceding explanation, these errors are not critical. If you
    get other failures, it is up to you to interpret what has happened. If you are
    sure that you have not changed any files, then somebody else has done it to damage
    your website. In this case, download the original release from CMS Made Simple,
    extract it, and replace the changed files with the original.


    Replacing the files is the first step. If your system has been hacked, it means
    that there is still a security hole that can be used again and again to damage
    your system. Please read and implement the following sections to see how you can
    protect your system.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# # Usernames and passwords


    Check how strong the combination of administrator''s username and password on
    your installation is. Do not use admin, administrator, or any other simple words
    like these for the username, as they are very easy to guess. Secondly, use strong
    passwords for the administrator account. Password strength estimates how many
    trials an attacker of your website would need on an average to guess your password.


    There are some tips for choosing good and secure passwords:


    +   - Include numbers, special characters, upper and lowercase letters, and punctuations
    in the password

    +   - The password length should be around 12 to 14 characters

    +   - Avoid any password made of a word that can be found in the dictionary

    +   - Avoid using relative or pet names or biographical information like your
    own birth date or a wedding date


    Pay attention to an editors'' username and passwords as well. Assist them in choosing
    strong passwords and advise them to keep the passwords in mind and never write
    them down. You and your users should not use the same password on other websites
    on the internet.


    If you post some news article with the admin account on the website, then the
    username is revealed on the website in the default news template. It would be
    better not to show the username at all or replace it with the user''s first and
    last name.


    To replace the username with real name, create a new user-defined tag (**Extensions
    | User Defined Tags**), call it *realname*, and add the following code snippet:


    ```

    global $gCms;

    $db = $gCms->db;

    $query = "select first_name, last_name from ". $gCms->config[''db_prefix''] .
    "users where user_id =?";

    $row = $db->GetRow($query, array($params[''user'']));

    echo $row[''first_name''] . '' '' . $row[''last_name''];

    ```


    This code will return the user''s first and last name from the user account. It
    assumes that the parameter user with the user ID is provided. To use the user-defined
    tag in the template, in the admin console, click on **Content | News**, and switch
    to the **Summary Templates** tab. Open the template for editing, and search for
    the Smarty variable {$entry->author}. Replace the variable with the Smarty tag
    {realname user=$entry->author_id}. Save the template, and see the changes on the
    website. Apply the same changes to the **Detail Templates**.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# # Hiding admin directory


    Every CMS has an admin URL. In CMS Made Simple, this URL is `http://www.yourdomain.com/admin`.
    This URL is defined by default, so that any experienced CMS Made Simple user can
    get the login screen to your admin console. The more information you reveal to
    the hacker, the more vulnerable your system is. In CMS Made Simple, you can easily
    change the URL of the admin console, so that one cannot guess where the "entrance"
    is.


    Open your FTP browser and rename the folder `admin` to something that cannot be
    guessed easily (for example, `private4me` or `hide2safe`). Then, open the file
    `config.php` with any FTP browser of your choice and find the line


    ```

    ```php

    $config[''admin_dir''] = "admin";

    ```

    ```


    Change the line to the name you have given to the folder `admin`. If your admin
    directory is now named `private4me`, then change the line shown as follows:


    ```

    ```php

    $config[''admin_dir''] = "private4me";

    ```

    ```


    From now on, the URL to your admin console will be `http://www.yourdomain.com/private4me`.
    If you enter the standard admin URL in the browser now, then you will get the
    error 404 (Page not found) instead of the login screen. In combination with a
    strong username and password, this would give additional protection to your admin
    area. An attacker must guess the admin URL first, before he tries to manipulate
    the username or password information.


    When you rename the `admin` folder to something else, the default verification
    checksum file will not work. This file will still look for the `admin` folder,
    will not find it, and then give you an error for each file with this no longer
    existing folder. Therefore, directly after renaming of the `admin` folder, create
    a new custom verification file (**Site Admin | System Verification**), and save
    it to your local disk. In this way, you hold the current status of the system,
    considering the renamed admin directory.


    When upgrading CMS Made Simple, before copying upgrade files to your current installation,
    rename your folder back to `admin`, perform the upgrade, and restore the custom
    name of the folder again.


    # # File permissions


    If your installation is on Linux server (please check **Site Admin | System Information,
    Server Operating System** if you are not sure), then you should know how file
    permissions can be configured to secure your system. A Linux server needs to know
    two things about the file:


    +   - What can be done to a file?

    +   - Who can do it with the file?'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'The first question can be broken down to three actions: **read**, **write**,
    and **execute**. Reading a file means just opening the file and looking at its
    contents. Writing means changing, replacing, or deleting the file. The last option
    checks if programs or scripts are allowed to be executed.


    The second question can be broken into three types of user: **owner**, **group**,
    and **public**. The owner of the file is the user who has initially created it.
    The group is not important for our needs and will be treated the same way as public.
    Public is every other user on our server who is not the owner of the file.


    With Linux permissions, we combine the preceding information and say who is allowed
    to do what with each file. You can imagine a permission matrix shown as follows:


    | Permission | Owner | Group | Public |

    |------------|-------|-------|--------|

    | **Read**   | 4     | 4     | 4      |

    | **Write**  | 2     | 2     | 2      |

    | **Execute**| 1     | 1     | 1      |


    You see that there are theoretically 27 possible combinations for the permissions
    of only one file. Any combination can be expressed by the sum of the numbers in
    the preceding table and changed with the Linux command **chmod** (change mode).
    However, you do not need to know exactly how this command is executed as every
    FTP browser lets you define the permissions intuitively.


    Let''s see and understand some examples for the permission sets:


    +   - **777** (1+2+4 for each column) means that everybody (all three groups)
    is allowed to read, write, and execute the file.

    +   - **755** means that the owner is allowed to do everything with the file,
    but group and public users are only allowed to read and execute the file. They
    are not allowed to change it.

    +   - **644** means that the owner is allowed to execute and read the file, others
    are only allowed to read it.


    There is a very important file in your installation that is worth securing with
    Linux permissions additionally. This file contains the database’s connection data
    and is called `config.php`. It is like the heart of your installation.


    While installing or upgrading, the file must be writable at least by the owner
    of the file, so its permissions must be set to at least **644**. As soon as the
    installation or upgrade is finished, you should lower the permissions of this
    file to **444** (everyone can read the file, but nobody can execute or change
    it).'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'In an FTP browser like FileZilla, you can right click on the file and select
    the option **File permissions**. The next dialog looks like the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_335_0.png)


    Generally, avoid setting any files to **777** if it is not absolutely needed.
    This permission allows the reading, changing, and deleting of the file by every
    user on your server.


    # CMS Made Simple and server version


    In the default template of CMS Made Simple, the version is shown in the footer
    area as follows:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_335_1.png)


    This information is provided in the template with the Smarty plugin `{cms_version}`.
    Delete it and do not use it in your templates at all. You should avoid revealing
    the exact CMS Made Simple version you use. The reason for this recommendation
    is the following scenario.


    You use an actual version of CMS Made Simple. One day, a security issue is discovered
    in this version. The development team of CMS Made Simple reacts and publishes
    a security release. If you do not upgrade your system immediately, your website
    would be extremely vulnerable as everybody knows exactly what version you use
    on the website.


    For the same reason, delete the doc folder from your installation. This folder
    contains the file `changelog.txt` which will reveal the actual version of CMS
    Made Simple as well. A malicious person just has to enter in the address bar of
    the browser the following line:


    ```

    http://www.yourdomain.com/doc/changelog.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 336
  md: '> Backup all your files and your database again and again. If something is
    damaged or lost, then you can save your time and nerves by replacing the damaged
    version with the last backup.


    # Troubleshooting


    While designing and configuring websites, you will surely encounter some issues.
    There is a solution for each problem if you know how and where to get help.


    If you install CMS Made Simple with sample content and templates, then you will
    get the well documented content pages, templates, and stylesheets with a new installation
    of CMS Made Simple. They are an invaluable way of introducing yourself to the
    application and getting to know how it works. Read all these pages thoroughly
    and save them for future reference.


    # CMS Made Simple Wiki


    The purpose of this Wiki is not only to allow the CMS Made Simple community to
    collaborate in the documentation process, but to also give you an appropriate
    and easy way to find information. This documentation is made by CMS Made Simple
    users and partly covers more languages than just English. However, a major part
    of the Wiki still remains in English. You will find the documentation on http://wiki.cmsmadesimple.org.


    You can search this documentation to find answers to your questions. A search
    button is at the top-right of every page for your convenience. You can read this
    manual page-by-page or pick the pages you like. In the Table of Contents at the
    right-hand side, you can see where you are (the title of the page you are reading
    is black).


    In the admin console of CMS Made Simple, you will see the Community Help link
    at the top-right of every page (below the main navigation). This link will take
    you directly to the Wiki page dealing with the function or the module you currently
    open in the admin console. However, there are still pages that are not written
    yet.


    The more users participate in writing documentation, the more answers can be found
    in it. CMS Made Simple really needs everyone''s assistance to make the documentation
    accurate, user friendly, and understandable. If you want to help, then please
    register as an editor on the Wiki site and start to help improving and enhancing
    the documentation for your own reference as well.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# Administration and Troubleshooting


    # Help for modules


    While trying to solve issues with the modules, you should differentiate between
    core modules of CMS Made Simple and third-party modules. The core modules are
    installed with CMS Made Simple, such as **News**, **Menu Manager**, **Printing**,
    **Search**, and so on. Third-party modules are installed manually. The help for
    third-party modules is not provided by the development team of CMS Made Simple
    but by the module''s developer. Therefore, the quality of the third-party module''s
    help depends on the developer of the module and cannot be managed by the official
    development team.


    # Built-in help


    Each module installed in a CMS Made Simple website includes basic help and examples
    to assist you in utilizing the functionality. With CMS Made Simple, you get the
    built-in help in the admin console. Open any module, and find the link **Module
    help** at the top right below the main navigation. The help sections of all modules
    look mostly similar and contain the following sections.


    # What does this do?


    This section explains the purpose of the module and describes the available functionality.
    Read this section thoroughly before starting to use the module. Are all the functions
    you need covered? Will the module solve all your requirements? There are some
    third-party modules with very similar functionality. Read this section for each
    module in question, compare them, and decide which one to use. Also see the *Parameters*
    section (described as follows) for the advanced functionality.


    # How do I use it?


    This section is aimed to introduce you to the module''s usage. It is a wonderful
    possibility to quickly get the first impression of how the module works by following
    some simple instructions. Depending on the module, this section is more or less
    complete and sometimes contains sophisticated usage examples or useful hints as
    well.


    # Parameters


    This section contains all the Smarty parameters you can use with the module. There
    are required parameters that you must use and some optional parameters. There
    is an explanation for each parameter with default value (value used if nothing
    is specified) and allowed values. The list of parameters will also give you a
    complete overview of what the module can do.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Forge (bugs and feature request)


    If you use some third-party modules and encounter problems, then you can also
    check the bug tracker for the module. The bug tracker is a list of known issues
    with each module and is provided by CMS Made Simple in the developer section (http://dev.cmsmadesimple.org/).
    It includes not only a list of known problems but sometimes the solutions. Module
    developers are supposed to check the bug list regularly and to update their module
    with new versions.


    If you encounter errors with third-party modules, then create a bug report to
    inform the developer of the module about the issue and use the support board to
    get help from the module''s users. The bug tracker is a place where the developer
    can track the list of errors. However, it is not the place to raise support requests
    for the module.


    # How to get a quick answer in the forum


    Using support forums is something that you probably do everyday. So, you may wonder
    why this section is so long. Well, there are some rules that you should follow
    while asking for free support in the forums. If you have ever had some questions
    unanswered in any forum, then you should go through the rules given below to see
    what the developers want from you to be able to help you.


    If you do not follow these rules, then you are not going to get quick answers.
    Moreover, your questions may be completely ignored. Consider that the forum offers
    support for free. The developer team and many other volunteers on the forum really
    want to be helpful and make things work for you. But remember that they all have
    jobs, families, friends, and other responsibilities. None of them are getting
    paid for the work they do on the forum. You can buy their time with commercial
    support or help them to help you by giving them everything they need.


    # Using search


    Search in the forum for your question before asking. Remember that a lot of questions
    are already answered and you will get the answer quicker. Use the search button
    in the forum and try different spellings, synonyms, and abbreviations. For example,
    if you search for any issue dealing with the module FrontEndUsers and login functionality,
    try:


    +   - Front End Users login

    +   - FrontEndUsers login

    +   - FEU login

    +   - Front End Users sign-in, and so on'
  merge: -1
  img_proc: true
- pgno: 339
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 340
  md: '+   - **Layout and Design (CSS & HTML)**: Is intended for discussion and questions
    related to CMS Made Simple templates, stylesheets (CSS), and themes or layout
    issues.

    +   - **Modules / Add-ons**: Is intended to assist if you have a question or problem
    with any third-party module or plugin that was not included in the standard package
    of CMS Made Simple.

    +   - **Developers discussion**: Is for talking about programming with and for
    CMS Made Simple.

    +   - **International Discussions**: Includes boards in other languages. If your
    problem is related to any language other than English, you can discuss it here.


    Choosing the right board from the very beginning will ensure that you cover the
    widest group of users who are able to help you.


    # Topic subject


    After you have figured out the correct board for the request, think about the
    right topic title or subject. Let''s see some bad examples:


    +   - Urgent help needed!

    +   - Big issue

    +   - Something goes wrong


    Give a good summary of your problem as the topic title. If you encounter a problem
    with the login functionality in the module **FrontEndUsers**, then you should
    name your topic. **Login issues in Front End Users.** Although a lot of people
    do know the answer to your problem, they do not have time to look through each
    topic that is *urgent* or has a *big issue*. They would only pick up the topics
    with the subjects that they believe they know the answer to.


    # Provide as much information as possible


    Make sure that you provide all the version information you can think of. It is
    better to include irrelevant data than to omit useful data. The easiest way to
    get the required information is to use the page **Site Admin | System Information**
    in the admin console of CMS Made Simple. This page includes everything you and
    someone who will help you should know. But do not just copy the entire page into
    the forum. There is a special text version of it. In the top-right corner of the
    page (below the main navigation), you will find the link **View Text Report (suitable
    for copying into forum posts)**. Click on it, copy it, and include it in your
    forum post.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Describe the problem step-by-step


    Describe the problem, including as much detail as possible (especially including
    error messages exactly as they are presented to you). It is not enough to say
    "If I sign in with the module FrontEndUsers I get some weird errors."


    If nobody knows what the errors are, then nobody will help you. There are no visionaries
    in the forum, just developers. Imagine you have a problem with your car. You call
    the garage and say "My car does not drive. Help!". If you do not provide more
    information on the exact behavior of your car, then the garage will not be able
    to help you. The same will happen in the support forum.


    If the error can be reproduced, then detail the steps that one can follow to repeat
    the issue on their own installation. This is a very good method; sometimes by
    writing step-by-step what you are doing, you are able to figure out the issue
    yourself.


    Be polite. Do not demand anything as there is no guarantee for a free product.
    Do not threaten to use another CMS if your problem is not solved instantly. If
    you do not like CMS Made Simple, then you are free to use any other system and
    claim free instant support there. However, I assume that you will not get free
    support this way anywhere. Do not insult the developers by saying the code of
    CMS Made Simple is bad or inefficient. You are not going to get any answers this
    way as in this case the developer team will assume that you are able to write
    your own beautiful and efficient code and do not need any help.


    Be patient. If there is a solution to your issue, then you will get it. It does
    not make the process quicker if you hourly "bump" the topic to appear at the top
    of the board. On the contrary, this can be another reason for being ignored.


    # Help others if you have been helped


    Once your question is answered and you have got your solution, open your first
    post for editing and add [SOLVED] in front of the topic subject. The developers
    can then concentrate on unsolved topics rather than looking into your topic again
    and again. If you feel that there is a bug and not a handling issue, then file
    a bug report for it in the development Forge (http://dev.cmsmadesimple.org) in
    addition to posting about it in the forum. This will help the developers to manage
    the process of tracking and fixing it.


    If the question could not be answered in the forum, but you have found the solution
    yourself, or someone has given the solution to you by another way, then post it
    in the forum so that other people can benefit from it. Someday, you will be happy
    if someone posts his solution for an issue you have in your installation as well.'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'If you follow these steps, then you will save a great deal of time for yourself
    and the developers. Getting quick answers is simple.


    # Commercial support


    So you''ve got CMS Made Simple up and running and you like what you see. However,
    your project requires some functionality that isn''t yet available for the CMS
    or doesn''t quite work the way you want it to. For that, the CMS Made Simple development
    team offers independent contracting services. Their in-depth knowledge of the
    tool and experience in building the package and additional modules can ensure
    that you get a working, well fitting, and quality tool.


    Paid support is available to those people with an important project that are concerned
    about the turnaround time that may be related to getting an issue solved. Additionally,
    if you would like to have somebody to call for problems that you just can''t fix,
    upgrade issues, backups, or any other concern, then commercial support may be
    an option for you.


    The CMS Made Simple development team offers various professional services for
    the web developer that needs a bit more support or needs something a little bit
    different.


    # Support contracts


    So, you are creating a new CMS Made Simple website for a very important customer,
    and you are concerned about "what if something goes wrong". For example, if the
    host changes something, or the site gets hacked, or some unexpected thing happens.
    You will need to fix it quickly and properly, and you are not sure how you can
    do this.


    It is for such purposes that various members of the development team offer support
    contracts. A support contract assures your client that if something unexpected
    pops up, a professional and experienced programmer with intimate knowledge of
    CMS Made Simple will be available within a reasonable time to either take care
    of the problem personally, or to assist you via telephone, video chat, and so
    on in resolving the issue.


    Support contracts are nominally priced, are usually on a per-site basis, for a
    fixed number of "tickets" and for a limited time period (like one year). Think
    of it like an insurance policy. If something goes wrong that you don''t know how
    to fix, somebody is there for you.


    Your clients will probably feel more secure knowing that there is ongoing technical
    support for their business-critical website.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Software development


    So you have a number of websites running CMS Made Simple already, and all of them
    are working well. However, this new site that you are working on is a bit different,
    and you''re going to need some functionality that CMS Made Simple doesn''t have
    yet. You may need some slight changes to the behavior of some of the existing
    functionality. Where can you go?


    The CMS Made Simple development team can work with you to determine a solution
    to your problem, either by modifying some existing code, or by writing something
    new.


    The developer team has a vast amount of experience working with CMS Made Simple
    and developing the CMS Made Simple Framework (after all, they wrote it).


    Most of the development team members work on a pay for time mechanism. For a nominal
    fee, you can probably get one of the development team members to adjust their
    schedule to help you out.


    # What about larger projects?


    The developer team can handle that too. Many of the modules that are available
    for CMS Made Simple were sponsored by members of the community who love CMS Made
    Simple and its flexibility, but needed some functionality that was not yet available.
    Maybe you can become another valued sponsor.


    You can contact a development team member, and work with them to sponsor a project
    on a contract basis. Usually the fees for these contracts are based on a regular
    consulting rate.


    # Is the development team a corporation or company?


    Actually, no; they are a loosely coupled group of independent contractors that
    work together. They collaborate and contribute to CMS Made Simple, to the various
    add-ons, and work on issues like support contracts.


    They work independently because they are in many different locations spread around
    the world, and it is just easier that way. However, they are always ready to help
    each other, and spell off each other for various reasons, for example, if one
    of them is going on vacation, the other members are willing to cover for him/her
    for support contract issues. Similarly, if somebody is just too busy with other
    projects, they would be more than happy to recommend another appropriate development
    team member to help you.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# How do I contact you?


    Well, you can read more information about the development team on http://www.cmsmadesimple.org/about-link/about-us/
    and decide which member(s) you would like to contact. If you have further questions
    that you would like to ask, but don’t want to contact anybody directly yet, then
    you can feel free to ask a question on the Help Wanted (commercial) board.


    # Pop quiz – administration and troubleshooting


    +   1. What is included in the database backup?

    +      a. The entire website including page structure, languages, modules and
    templates.

    +      b. Only page structure, settings, and templates.

    +      c. Only page structure and design is saved in the files.

    +      d. Database does not include anything that is important to backup the website.

    +   2. How often should you backup the website?

    +      a. Everyday.

    +      b. Depending on how often the changes are made to the content of the website.

    +      c. Depending on how often you would like to restore the website.

    +      d. You do not need to care about the backup. This will be done automatically.

    +   3. Why should you regularly upgrade your websites that are run with CMS Made
    Simple?

    +      a. To keep the changes made during the whole lifecycle of the page.

    +      b. To inform visitors of your website that you use the newest version of
    CMS Made Simple.

    +      c. To keep the installation secure and avoid vulnerability.

    +      d. To be informed about the new features offered and be able to select
    those you need.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '4. What name would be the best for the admin account?


    +   - a. admin

    +   - b. ro0t6i2go

    +   - c. webmaster

    +   - d. test


    5. Where do you find free help when you encounter issues?


    +   - a. Any HTML or CSS reference.

    +   - b. Official help board of CMS Made Simple.

    +   - c. Personal message to one of the CMS Made Simple developer.

    +   - d. Comments in the installation files and database.


    6. How can you stay informed about any updates of CMS Made Simple?


    +   - a. You will be e-mailed automatically if an update is available.

    +   - b. You have to look up in the official board daily.

    +   - c. You will see the appropriate message in the admin console of CMS Made
    Simple.

    +   - d. CMS Made Simple does not offer any updates for free.


    # Have a go hero – configure backup and stay up-to-date


    Configure the backup for your website right now. If something goes wrong, you
    will not be able to recover the website without a backup. Double-check that your
    backup files include files and database as both of them are important. Play a
    recover scenario in case of emergency, so that you can be sure that backup is
    not corrupted or incomplete.


    Stay up-to-date. Sign in with the official forum of CMS Made Simple and subscribe
    for new topics in the board **Announcements** (also RSS Feed is available for
    your convenience).'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# # Summary


    In this chapter, you have learned a lot of stuff concerning the administration
    of CMS Made Simple. As mentioned at the beginning of the chapter, you do not need
    to read all of the sections in this chapter. But I strongly recommend going through
    the sections on *How to secure your installation* and *Troubleshooting*.


    Specifically, we covered:


    +   - How to backup a CMS Made Simple website in case of an emergency. You have
    learned that the website consists of two parts, its files and the database. It
    is important to create backups for both the parts. Two ways of creating a backup
    were discussed, that is, third-party modules and manual backups for people who
    have hosting with restrictions.

    +   - How to move the website from one hosting to the other. You have to move
    your website if you change the hosting provider.

    +   - How to upgrade CMS Made Simple and its modules. We have learned why it is
    so important to upgrade the system regularly. You gain not only new features,
    but improved performance and security. It is your responsibility to upgrade the
    system and stay up-to-date with CMS Made Simple''s development.

    +   - How to secure the installation. There were some useful tips on how you can
    quickly secure your system and protect it from hacking, attack, and damage. Remember
    that if you spend some time learning how to secure the website from the very beginning,
    then it can save you days and weeks of getting your website backup and running,
    if it gets attacked.

    +   - How to get a quick answer in the support forum. You got some tips on how
    to get the best answers from the free support forums of CMS Made Simple. Reading
    this section will save you a lot of time while solving issues with the installation.'
  merge: -1
  img_proc: true
