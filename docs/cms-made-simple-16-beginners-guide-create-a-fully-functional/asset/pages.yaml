    +      b. The URL is optimized for search engines.

    +      c. You should not use them at all because you have to create for every
    search engine a special one and so create duplicated content.

    +      d. The page is loaded much quicker


    +   7. User-defined tags are written in:

    +      a. Pure HTML

    +      b. Pure HTML and CSS

    +      c. JavaScript

    +      d. PHP


    +   8. Some jQuery plugins cannot be integrated in CMS Made Simple:

    +      a. true

    +      b. false'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Have a go hero – make search engine optimization


    Make search engine optimizations for your website before you publish it. It is
    better to start with a clear and optimized website from the very beginning. Double-check
    page titles, menu texts and words represented as internal links in the content
    of the page. Control if one page can be reached with different URLs and use a
    canonical tag to help the search engines to understand which URL is the main one.
    Create an XML sitemap for search engines and monitor the statistics of your visitors
    to figure out what pages are the most popular, thus figuring out what contents
    of your page can be extended.


    Consider that your website is made primarily for visitors and not for search engines.
    Search engines are just carriers that bring visitors to your website. And whether
    the visitor likes your website or not lies in your responsibility.


    # Summary


    In this chapter, we learned advanced subjects that are not necessarily a part
    of every website.


    Specifically, we covered the following topics:


    +   - **Localization and translation:** You need this section if the primary language
    of the website is not in English or if you are going to create a multilingual
    website.

    +   - **Additional content and controls for editors:** This section helps to understand
    what you can do if you have a sophisticated layout or would give website ''editors''
    more control.

    +   - **Search engine optimization:** You learned how you can optimize the website
    for search engines.

    +   - **User-defined tags and Event Manager:** If you have some basic PHP knowledge,
    you can even implement your own PHP scripts into CMS Made Simple and still stay
    upgradable.

    +   - **Implementing jQuery effects:** You learned how you can implement simple
    jQuery functionality into the top navigation of the website.


    Now that we''ve learned how to realize these sophisticated features, read the
    next chapter to see what tasks you have as a website administrator during the
    lifetime of the website.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# # Administration and Troubleshooting


    Once the website you have created is ready and running, you have to take a closer
    look at the tasks you have as a webmaster during the lifetime of the website.
    Depending on the nature of the website, you must regularly make backups if you
    or your customer continuously add and edit the content or change the design. It
    is also recommended to watch the development of CMS Made Simple and make updates
    to keep the website secure and be able to use the newest features.


    This chapter helps you administer your CMS Made Simple website once it is running.
    In this chapter, we will see how to:


    +   - Take a backup of your website

    +   - Move it to another web host

    +   - Upgrade your installation or modules

    +   - Optimize the performance

    +   - Secure and protect your website in the most efficient way

    +   - Get help from the community


    You are not supposed to read the whole chapter. You can start reading from any
    section, as they do not depend on each other. *Upgrading CMS Made Simple* is the
    part that you will probably need when a new release of CMS Made Simple is published.


    I strongly recommend that you read the *Troubleshooting* section and devote 10
    minutes of your time to the question *How can I get a quick answer in the free
    support forum?* There are some useful tips on how to get the best answer in the
    shortest period of time.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Getting system information


    As the website administrator, you should know how to get the system information
    for your website or your customer''s installation. This information helps you
    to understand how the server, where CMS Made Simple is installed and configured,
    gives you the first indicators when you encounter problems while running CMS Made
    Simple or any of its modules.


    In the admin console, click Site Admin | System Information. The information page
    is divided into three sections:


    +   - CMS Install Information

    +   - PHP Information

    +   - Server Information


    In the first section you see the version of CMS Made Simple installed and all
    enabled modules with their versions as well.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_313_0.png)'
  merge: -1
  img_proc: true
- pgno: 314
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 315
  md: 'Failures should be corrected as soon as possible. Warnings can be ignored if
    you do not have any issues when running CMS Made Simple, but you should correct
    them if something does not work as expected. In the following table, you will
    find some required and recommended settings for CMS Made Simple. Required settings
    are mandatory. Recommended settings can make your system run smoother and solve
    some issues.


    | Setting | Minimum and recommended values |

    |---|---|

    | **Current PHP Version (phpversion)** | 5.0.4 or greater |

    | **GD version (gd_version)** | version 2 |

    | **Magic quotes in runtime (magic_quotes_runtime)** | On (True) |

    | **PHP Effective Memory Limit (memory_limit)** | minimum 16 MB

    recommended 24 MB or greater |

    | **Maximum Execution Time (max_execution_time)** | minimum 30

    recommend 60 or greater |

    | **PHP Safe Mode (safe_mode)** | Off (False) |

    | **Session Save Path (session_save_path)** | This path should be writable (green
    tick) |

    | **PHP register_globals (register_globals)** | Off (False) |

    | **Maximum Post Size (post_max_size)** | minimum 2M

    recommend 10M or greater |

    | **Maximum Upload Size (upload_max_filesize)** | minimum 2M

    recommend 10M or greater |


    The third section on the **System Information** page gives you an overview of
    your server''s configuration. If you are the website administrator, then you should
    be able to answer at least three questions about your system:


    +   - What operating system is used on your server?

    +   - What server software (and which version) is installed on your server?

    +   - What database (and which version) is used for a CMS Made Simple installation?'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'All these questions can be answered if you look at the information given here
    thoroughly.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_316_0.png)


    From the preceding screenshot, I can say that this installation of CMS Made Simple
    is installed on Linux (Server Operating System), Apache server version 2 is installed
    (Server Software), and this server uses the database MySQL 5.0.32 (Server Database
    + Server Database Version).


    It is important to know how your server is configured to be able to get help if
    you encounter issues. There are a lot of varieties of applications'' versions
    and configurations, so nobody can guess exactly how your individual hosting is
    configured. Keep that in mind while getting free help from the community.


    # Backing up your website


    Backing up means making copies of your files and database. You need to backup
    regularly in case something goes wrong on your web hosting. Your data could be
    lost due to some hosting issues or through webmaster mistakes. Therefore, it is
    important to have backup files to be able to restore your website.


    To backup a website made with CMS Made Simple, it is not sufficient just to copy
    all the files found on the server with FTP. Those files are only a small fraction
    of your website. The most important part is the database where all your text and
    designs (except image files) are stored.


    In CMS Made Simple, you have two modules (one is used for file backups and one
    for database backups). You would probably not be able to use the modules on free
    web hosting or on the hosting with strong restrictions. To check if an easy backup
    of your website with the following described modules is possible, try to install
    the first module to backup files.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Backing up website files


    **Website files** are the files that you upload to your FTP directory. Most of
    them are delivered from the team of developers and have been copied to your web
    space before installation. In the `uploads` directory, you will find files, like
    `images`, that have been uploaded by the editors. If you have installed additional
    modules, then you will find files for these modules in the `modules` folder.


    To backup files, you can download everything from your FTP to the local disk.
    However, depending on your connection and the total number of files, this can
    take a lot of time.


    # Time for action – creating a backup with the module


    If you would like to archive the files before downloading them, then you can use
    the **FileBackup** module.


    +   1. In the admin console, select **Extensions | Module Manager**.

    +   2. Click on the **Available Modules** tab, and look for the letter **F** above
    the alphabetical module list.

    +   3. Find the **FileBackup** module, and click on the **Download & Install**
    link in the same line. If there are restrictions on your web hosting, then you
    will see the following error:

    +   4. In the admin console, go to **Site Admin | File Backup**.

    +   5. Click on the **Preferences** tab. In the admin area you see the following
    message:

    +   6. Click **Save**. (This module tries to recognize the required path automatically).
    If the message does not disappear, then you have to ask your hosting provider
    what the path to `tar` binaries on your web hosting is and enter the path into
    the field **Path to tar binaries**.


    > You cannot use this module, since you don''t have the tar command installed
    on your server.


    In this case, you will have to backup your website manually. If the installation
    of the module **FileBackup** was successful, then you can start configuring it.


    > Please check and save the path to tar binaries before using FileBackup.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '+   7. Switch to the **Backup Files** tab.

    +   8. Click on **Backup Files**.

    +   9. Wait until the complete list of folders is displayed and you see the message
    **Task completed** at the end of the list. Below this message, you will see the
    backup file containing all your website files.

    +   10. Click on the backup file, and save it to your local disk.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_318_0.png)


    # What just happened?


    You have created an archived backup of all website files and have saved the archive
    to your local disk. You should create a new backup file and save it separately
    from the current installation. For example; on the local disk, anytime you install
    a new module, upgrade the whole system or one module or upload new images. Do
    it regularly. You will save a lot of time in case of emergency.


    All backup files will also be saved in your installation. You will find them using
    any FTP browser (for example, **FileZilla**) in the folder `/admin/backups` on
    your web hosting.


    > Make sure you delete the backup files after downloading to your local disk.
    Otherwise, anybody could go to `http://www.yourdomain.com/admin/backups/` and
    download your backup, containing the file `config.php` with your database settings
    and password.


    It is recommended to clear the cache folder before creating a file backup as CMS
    Made Simple creates a lot of temporary files to speed up the website. These files
    must not to be saved with the backup as they will be generated automatically once
    CMS Made Simple is installed and running. To clear the cache folder in the admin
    console, click on **Site Admin | Global Settings**, select the **Advanced Setup**
    tab, and click the **Clear** button below the **Clear Cache** label.


    In fact, the best solution would be to set up some automation if the files are
    changed frequently. You should contact your ISP to determine whether it is possible
    to backup the file automatically.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Backing up database


    With the next step, you backup your database. In other words, you create a dump
    of the database. Dumps hold all the actual data of the installation: page structure,
    page content, complete design, and any data saved in the modules like News.


    A database backup has the same importance as a backup of the files. If you just
    backup the files, then you do not backup any changes on the website such as new
    pages or new modules.


    # Time for action – creating a database backup


    Let''s see how to create a backup of the database along with the file backup.
    You need the MysqlDump module to create a database dump from within your admin
    console in CMS Made Simple.


    +   1. In the admin console, click on Extensions | Module Manager

    +   2. Click on the Available Modules tab, and then the letter M above the alphabetical
    module list.

    +   3. Find the module MysqlDump, and click on the Download & Install link in
    the same line. If there are any restrictions on your web hosting, then you will
    see the following error.

    +   4. In the admin console, click on Site Admin | MySQL Dump

    +   5. Switch to the Preferences tab.

    +   6. Click Save. (Usually the path to mysql binaries is recognized automatically.)
    If you still see the message Invalid path to MySQL utilities, then you have to
    ask your hosting provider for the proper path to mysql binaries on your web hosting,
    and enter the path into the field Path to mysql binaries.

    +   7. Switch to the Backup Database tab.


    > You cannot use this module, if don''t have MySQL installed on your server.


    This error means that you cannot use the module to create a database dump this
    way and should do it manually (refer to the next section). If the module installation
    was successful, then you can create a database dump right now.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '8. Click the **Backup database** button. Wait till a list of tables appears,
    and find the link to create a database dump at the end of the list.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_320_0.png)


    9. Save the file to your local disk.


    # What just happened?


    You have created a backup of your database. This backup includes all your database
    tables and should be made regularly, ideally every time changes are made to the
    site''s pages or the modules.


    Similar to the file backup, you will find all database backups with any FTP client
    (for example, FileZilla) in the folder `/admin/backups` on your web hosting.


    # Manual backup


    If you are not allowed to install the modules on your web hosting due to some
    restrictions (often made on the free web hosting), then you should backup you
    files manually.


    For the file backup, open any FTP browser (for example, FileZilla), navigate to
    your installation folder, and copy all the files from the web hosting to your
    local disk. Remember that the files contain only a small part of your website.
    You should create a database dump to save all your content, design, and module
    data.


    # Backing up database with phpMyAdmin


    **phpMyAdmin** is a free open source tool intended to handle the administration
    of MySQL databases. It is normally installed on every web hosting. Contact your
    provider to figure out the link to phpMyAdmin on your web hosting, and your login
    credentials if you are not sure. This tool helps you to create database backups.'
  merge: -1
  img_proc: true
- pgno: 321
  md: "# # Time for action – creating a backup with phpMyAdmin\n\nThe steps described\
    \ here are only needed if you have no possibility to backup the database with\
    \ the module described previously.\n\n+   1. Log in to phpMyAdmin on your server\
    \ (contact your provider to figure out the details as they can differ between\
    \ web hosts).\n+   \n+   2. Upon login, select **Databases** on the major screen:\n\
    +   \n+   3. Select the database used for a CMS Made Simple installation. If you\
    \ are not sure, then open the `config.php` file and find the line `$config['db_name']`\
    \ that contains the name of the database.\n+   \n+   4. Click on the database\
    \ name in the list.\n+   \n+   5. On the next screen, you will see the list of\
    \ all tables in this database. Click on the **Export** tab at on the top of the\
    \ list, as shown in the following screenshot:\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_321_0.png)\n\
    \n![](img/b21e3dc5c94405bc7b3f102758ea770c_321_1.png)"
