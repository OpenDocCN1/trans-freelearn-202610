- pgno: 255
  md: "```\n```css\n{\n    float: left;\n    padding: 15px;\n    text-align: center;\n\
    }\n```\n```\n\nThis is just an example; you are free to add any styles that will\
    \ fit into your own design.\n\nThe size of the thumbnails created while uploading\
    \ product images can be changed in the tab **Preferences (Content | Product Manager)**.\
    \ On this page, scroll down to the section **Image Handling Settings** and adjust\
    \ the values as you like.\n\nIf you have used my templates so far, your summary\
    \ template and hierarchy should look as shown in the following screenshot:\n\n\
    ![](img/b21e3dc5c94405bc7b3f102758ea770c_255_0.png)\n\nThe last step will be customization\
    \ of the detailed view of the product. Create a new template called **My Shop**\
    \ under the **Detail Templates** tab in the admin area of the **Products** module.\
    \ Then set the template as default.\n\nIn the detail template, you will find a\
    \ section for the product attributes. We did not discuss it so far. The products\
    \ can have different attributes, like size or color for the t-shirts. These attributes\
    \ may or may not have an impact on the price. For each product, the attributes\
    \ are added separately. It does not make sense to add size or color to the mouse\
    \ pad, if we have only one model."
  merge: -1
  img_proc: true
- pgno: 256
  md: 'Let''s create the attribute for the color of the long t-shirt. Assume that
    we have two colors available: white and grey. The color does not change the price
    of the product. In the admin area of the **Products** module, click on the **Products**
    tab. In the list of products, at the end of each line there is an icon for **Edit
    Attribute Sets**. Click on this icon in line with the product to which you would
    like to add attributes.


    On the next screen, click on **Add Attribute**. Enter the name of the attribute.
    This name contains the generic term like Color. In the **Label** field enter the
    name of the attribute in the same way as it should appear on the website. As the
    color of the t-shirt does not change the price of the product, enter **0** in
    the field **Price Adjustment** and click on **Update**. Add another label for
    the color **Grey**. It should look as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_256_0.png)


    Click on **Submit** once you have entered all possible values for this attribute.
    See the detailed view of the product with defined attributes. All possible values
    are listed in the template. When you install the **Cart** module later on, you
    will not only be able to display the attributes, but add them to the cart as well.
    The price will be automatically adjusted in the cart view.


    You should now be able to customize the detail template yourself.


    Follow these steps:


    +   1. Create a new template and do not overwrite the sample one. The **Sample
    template** can be used for future reference if you delete any part from your custom
    template.

    +   2. Analyze the template. Try to figure out its major parts and usage of other
    modules in it.

    +   3. Write down all the Smarty variables used in the templates in a table as
    shown previously for the **Hierarchy Report Templates**.'
  merge: -1
  img_proc: true
- pgno: 257
  md: "+   4. Figure out, what values are saved in these variables. If the variable\
    \ contains an array, use the Smarty modifier `print_r` to get all array values\
    \ from it. For example, `{$entry|print_r}` will output all the values contained\
    \ in this variable.\n+   5. Use HTML and Smarty to markup the template.\n+   6.\
    \ Add stylesheet definitions to change the appearance.\n\n# Creating detail view\
    \ for product\n\nFollow the list above and create your own template for the detailed\
    \ view of the product. Delete everything you do not need in the template; for\
    \ example, the Weight field. Assign custom fields (Product image and Product number)\
    \ the same way you did in the summary template. Check the values of the variables\
    \ with the modifier `print_r` if you are not sure what you have to use.\n\nMy\
    \ detail template looks as shown in the following screenshot:\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_257_0.png)\n\
    \nThe template code I have used for the detailed template is shown in the following\
    \ code snippet:\n\n```\n```html\n<div class=\"products-detail\">\n  <img align=\"\
    left\" src=\"{$entry->file_location}/{$entry->fields.image->value}\" alt=\"{$entry->product_name}\"\
    />\n  <h1>{$entry->product_name}</h1>\n  <h2>{$currency_symbol}{$entry->price}</h2>\n\
    \  <div>{$entry->details}</div>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 258
  md: "```\n{* print out attributes *}\n{if isset($entry->attributes)}\n  {foreach\
    \ from=$entry->attributes key='name' item='attribset'}\n    <p><strong>{$name}:</strong>\n\
    \      {foreach from=$attribset key='label' item='adjustment'}\n        {$label}\
    \ ({$currency_symbol}{$adjustment}),\n      {/foreach}\n    </p>\n  {/foreach}\n\
    {/if}\n  {* include the cart *}\n  {if isset($cart_module_tag)}\n  {eval var=$cart_module_tag}\n\
    \  {/if}\n</div>\n```\n\nYou are now ready to add cart functionality to your solution.\n\
    \n# Module Cart\n\nThis module will add simple cart functionality to the **Products**\
    \ module. Once installed, the **Cart** module will be automatically displayed\
    \ in the detailed view of the product. The visitor of the website will then be\
    \ able to put one or more products in the basket along with the desired quantity.\
    \ There are other modules that you can use instead of the **Cart** module, like\
    \ **GiftBaskets**. For our example **Shop**, it is enough to use the simple functionality\
    \ of the **Cart** module.\n\nInstall the module **Cart** from the list of available\
    \ modules in the **Module Manager**. The admin area of this module will be added\
    \ to **Extensions | Cart** in the admin console of CMS Made Simple.\n\n# Time\
    \ for action – connecting products and cart\n\nIf you now look at your **Shop**\
    \ page and open a detailed view of any product, you will discover that there is\
    \ still no cart functionality in it. The reason for it is that the **Products**\
    \ module does not know that the **Cart** module has been installed and is ready\
    \ for use. Let's connect two modules.\n\n+   1. Open the admin area of the **Products**\
    \ module (**Content | Product Manager**).\n+   2. Click on the **Preferences**\
    \ tab.\n+   3. Select the **Cart** module from the field **Cart Module**."
  merge: -1
  img_proc: true
- pgno: 259
  md: '4. Click on Submit and open detailed view of any product. You should see the
    button Add to My Cart in the detailed view of the product. If the product has
    some attributes additionally to the quantity field, then the attributes are displayed
    in a drop-down field besides it.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_259_0.png)


    # What just happened?


    You have told the Products module what module has to be used for cart functionality.
    Test it and add some products to the cart right now. The products will be added,
    but there is no possibility to display the content of the cart for the visitor
    yet.


    Create a new content page called Cart and add the following Smarty tag as the
    content of the page:


    ```

    {Cart action="viewcart"}

    ```


    Save the page, then open the admin area for the Cart module (Extensions | Cart)
    and switch to the Preferences tab. Select the newly created page in the list of
    pages, so that the visitor is automatically redirected to the page after he has
    added the product to it.


    There are four templates that you can customize for the module:


    | Template | Description |

    |---|---|

    | AddToCart | This template controls how the quantity field, the button Add To
    My Cart (shown in the previous screenshot) and optionally product attributes with
    price adjustment will look. |

    | MyCart | This template is used to display the cart status. It is displayed at
    the place where the Smarty tag {Cart action="mycart"} is placed. It shows the
    number of items currently saved in the cart and a link to the cart page. |

    | Viewcart | This template is used for extended display of all products saved
    in the cart. It shows all products with their quantities and prices and the total
    order price. Additionally it offers the possibility to start the checkout order
    process if the module Orders is installed. |

    | Product Summary | This template is used to format the output used for each product
    summary in the Viewcart template. It allows you to customize the product label
    based on the attributes, product name, and price. |'
  merge: -1
  img_proc: true
- pgno: 260
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 261
  md: 'From this list of dependencies, you can learn that it is based on the functionality
    of the module **FrontEndUsers**. This means that your website''s customers must
    register before they can start the payment process on your online store. There
    is no possibility to turn off this registration process and it is required for
    the checkout step.


    Install all modules listed in the preceding dependencies list, then install the
    **Orders** module.


    # Time for action – adding the checkout step


    To enable the checkout process provided by the **Orders** module follow these
    steps:


    +   1. Create a new content page (**Content | Pages | Add New Content**) and name
    it **Checkout**.

    +   2. Add the following Smarty tag to the **Content** field of the **Checkout**
    page:

    +      `{Orders}`

    +   3. Save and view the page in the browser. This page will display either the
    billing form if the user is logged in or the warning message if the user is not
    logged in or does not belong to special user group.

    +   4. To connect the **Cart** module with the new **Checkout** page, in the admin
    console click on **Extensions | Cart**.

    +   5. Select the tab **Viewcart Form Templates** and click on the **Sample**
    template (or your own template, if you have created one).

    +   6. At the very end of the template in the **Template Text** field, add the
    following line of code:

    +      `{cms_selflink page="checkout"}`

    +   7. Open your shop and add one or more products to the cart, find a link to
    the page **Checkout** at the very bottom of the screen.


    ```

    {Orders}

    ```


    ```

    {cms_selflink page="checkout"}

    ```


    > The parameter page should contain the page alias of the page where the Smarty
    tag {Orders} has been added to the content.


    # What just happened?


    You have connected the module **Cart** with the module **Orders** by placing a
    link from the cart view to the checkout process. To test the link, add some products
    to the cart and click the **Checkout** link at the bottom of the cart view. If
    you are not logged in, you will see the following message:'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# The user is not logged in (or not a member of the required group)


    This message can be found in the template of the **Orders** module. But first,
    let''s see an overview of the templates delivered with this module. In the admin
    console, click on **Content | Order Manager** and find the **Templates** link
    above the list of orders:


    | Template | Description |

    |---|---|

    | **Billing Form** | This template controls the first step in the order processing.
    It displays the form where the customer can enter billing address and one or more
    shipping addresses. |

    | **Payment Form** | This template controls the second step in the order processing
    and is used to display the payment form for manual e-mail-based checkout process.
    You will need this template if you do not use any payment services such as PayPal,
    EMoney, eWay, or Authorize.Net. |

    | **Confirm Order** | This template controls the third step in the order processing
    and is used to display any information the customer entered in the first and optionally
    second step, so that the customer can confirm the shipping and invoice addresses
    or go back and correct them. |

    | **Invoice** | This template is used in the admin area of the **Orders** module
    to print out the invoice or to send it via e-mail to the customer. |

    | **Gateway Complete** | This template is used to display the status message after
    the payment has been made with any third-party service such as PayPal, EMoney,
    EWay or Authorize.net. |

    | **User Email** | This template is used to customize the e-mail with order confirmation
    sent to the customer when the new order has been submitted. |

    | **Admin Email** | This template controls the layout and content of the e-mail
    that is sent to the authorized administrator of the store when a new order is
    submitted. |

    | **Message** | There is no sample template for the messages. Here you can define
    your custom e-mail notifications that can be manually sent to the customers from
    the admin area of the module. An example of such message can be an e-mail notification
    that is sent when the order is shipped. |


    Now, we know where to start and how to proceed with customizing of the templates
    according to our requirements and payment configurations. Let''s give the customer
    the possibility to register with or login to the website to be able to complete
    the checkout process.'
  merge: -1
  img_proc: true
- pgno: 263
  md: "# Integrating the login screen\n\nThe message that indicates that the customer\
    \ is not logged in is saved in the template **Billing Form** (the first step in\
    \ the checkout process).\n\nThe user is not logged in (or not a member of the\
    \ required group).\n\nThis is not very user friendly. Whether the user is registered\
    \ or not we should give him a possibility to log in or to register on this page\
    \ as shown in the following screenshot:\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_263_0.png)\n\
    \nThe login form for registered customers can be displayed with the module **FrontEndUsers**.\
    \ This module was discussed in the section *Managing visitors' logins* in Chapter\
    \ 8, *Creating Your Own Functionality*. If you have not installed the module yet,\
    \ use the **Module Manager** to do so and see the login form on the website. The\
    \ link to the page where the customer can register will be provided with the **SelfRegistration**\
    \ module discussed further.\n\nIn the admin area of the **Orders** module, click\
    \ on the **Templates** link and create a new template with the name **My Shop**\
    \ on the **Billing Form** tab. Scroll down to the very bottom of the suggested\
    \ template text and find the last ELSE condition:\n\n```\n...\n{else}\n  {* user\
    \ is not logged in, gotta make him *}\n  <h3 style=\"color: red;\">{$Orders>Lang('error_notloggedin')}</h3><br/>\n\
    {/if}\n```"
  merge: -1
  img_proc: true
- pgno: 264
  md: 'This is the place where the message that the user is not logged in is shown.
    Replace this section with the login screen of the module **FrontEndUsers**, as
    shown in the following code snippet:


    ```

    ...

    {else}


    <h1>Already registered?</h1>

    {FrontEndUsers}


    {/if}

    ```


    Save the template and do not forget to set it as **Default** to see changes on
    the website. Registered customers can now log in to start the checkout process.


    But, what about customers who do not have an account? They should be able to register
    themselves with our website. As it gets a bit complicated I have created the following
    flowchart:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_264_0.png)


    The billing form checks if the visitor is logged in or not. If yes, he can fill
    in the billing information; if not, the login form of the **FrontEndUsers** module
    (step 3) is displayed. The steps 4 and 5 in the workflow should assist new customers
    by allowing them to register. These steps can be accomplished with the **SelfRegistration**
    module. Read the next section to see how the module can be configured.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'Before you continue be sure that:


    +   - The **CMSMailer** module is configured and is able to send out messages
    (refer to Chapter 2, *Getting Started*).

    +   - There is a user property of type **Email Address** in the module **FrontEndUsers**
    (**Users & Groups | Frontend User Management**, tab **User Properties**).

    +   - There is a user group that has the above user properties associated as **Required**
    (**Users & Groups | Frontend User Management**, tab **Groups**).


    You can read how to configure the **FrontEndUsers** module in Chapter 8, *Creating
    Your Own Functionality*.


    # Integrating customer registration


    This module is designed to allow visitors of the website to register themselves.
    It optionally sends a confirmation e-mail with an activation link that must be
    clicked before the registration is complete. Once the registration is complete,
    a user account is created in the module **FrontEndUsers**.


    Install the **SelfRegistration** module from the list of available modules in
    the **Module Manager**. For the registration page, create a new content page **Register**
    and add the following Smarty tag into the content of the page:


    ```

    {SelfRegistration group="Customers"}

    ```


    Pay attention to the part in bold in the above code. The value of the parameter
    group should exactly reflect the name of user group in the module **FrontEndUsers**
    (**Users & Groups | Frontend User Management**, tab **Groups**). Please read Chapter
    8, *Creating Your Own Functionality* to see how the **FrontEndUsers** module should
    be configured if you do not have any user groups so far.


    Open the **Register** page of your website and sign in yourself as a new customer
    with the **SelfRegistration** module to see how the module works by default. There
    are some preferences in the module that can make the registration process user
    friendly. In the admin area of the **Self Registration** module (**Users & Groups
    | Self Registration Module**), click on the **Preferences** tab.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'The **SelfRegistration** module offers registration with an e-mail verification
    step or optionally single-step registration without any confirmation. If you do
    not need the e-mail verification, you should deselect the option **Require the
    user to confirm registration via email** on the **Preferences** tab of the module.
    The three settings considering the final message work different depending on what
    registration method you have chosen.


    | Setting | With verification | Without verification |

    |---|---|---|

    | **Don''t display the final message after registration** | Prevents the registration
    form to be replaced by the confirmation message after the form is submitted. |
    Prevents the registration form to be replaced by the final message after the form
    is submitted. |

    | **PageID/Alias to redirect to after registration is complete** | N/A | Redirects
    to the given page, but replaces the whole content of the page with the final message.
    |

    | **PageID/Alias to redirect to after verification step is complete** | Redirects
    to the given page, but replaces the whole content of the page with the final message.
    | N/A |


    According to the workflow, let''s add a link to the registration page for the
    new customers (step 4). In the billing template of the **Orders** module, open
    the template for the **Billing Form** again, scroll down and add a link to the
    registration page for the new customers as shown in the following code snippet:


    ```

    ...

    {else}


    <h1>Already registered?</h1>

    {FrontEndUsers}


    <h1>New Customer?</h1>

    {cms_selflink page="register"}

    {/if}

    ```'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# E-commerce Workshop


    Pay attention to the parameter page. It should contain the alias of the page where
    the registration form is displayed. Customize the **Registration Template 1**
    of the **SelfRegistration** module that displays the registration form. Generally,
    there are two templates. The first one is for the registration form and the second
    one (**Post Registration Template**) contains the message informing the customer
    that his registration should be confirmed through a link sent to his e-mail address.
    Other templates that you can customize are as shown in the following table:


    | Templates | Description |

    |---|---|

    | **Registration Template 2** | This template contains the form where the username,
    verification code, and password will be added to complete registration. |

    | **Confirmation Email** | Contains the subject of the verification e-mail, the
    plain text and the HTML version of the e-mail sent out after the customer has
    registered. |

    | **Final Message** | The message is shown to customer after the registration
    process is completed. To build the workflow suggested previously (step 5) add
    link to the billing form in this template, so that the user can carry on with
    the checkout process. It is also advisable to tick the option **Login user after
    registration**, so that the login step can be skipped after registration. |

    | **Lost Email** | This template contains a form for the customers who have registered
    but did not get verification e-mail. This template is shown at the place where
    the Smarty tag `{SelfRegistration mode="sendmoremail"}` is shown. |


    When the user registers with the website and e-mail verification is required,
    the temporary user account is saved in the **SelfRegistration** module (not **FrontEndUsers**!).
    After e-mail verification is complete, new user account is automatically moved
    to the **FrontEndUsers** module. At the same time the temporary account is deleted
    from the **SelfRegistration** module.


    There is a limit of 250 temporary accounts in the **SelfRegistration** module.
    When the number of 250 non-verified accounts is reached, no registration is possible.
    Therefore you purge from the **SelfRegistration** module by using the option on
    the **Preferences** tab.


    After the module **SelfRegistration** is configured and all required templates
    are customized, you can go through the whole manual e-mail-based checkout process.


    I suggest that you use the workflow to test all three cases:


    +   - The visitor is registered and logged in

    +   - The visitor is registered, but not logged in

    +   - The visitor is not registered'
  merge: -1
  img_proc: true
