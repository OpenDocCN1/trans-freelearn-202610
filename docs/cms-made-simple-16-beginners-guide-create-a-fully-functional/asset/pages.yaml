- pgno: 134
  md: '# What just happened?


    You have added a new custom field to the news articles. As the field is marked
    as Public, it will be displayed on the website. The field is automatically added
    to the news editing window. If you like to change the position of the field, you
    should edit the template. In the default template Sample, all additional fields
    are added at the bottom of the news article. In your own template, you can get
    any custom field value with the following line of code:


    ```

    Location: {$entry->fieldsbyname.location->value}

    ```


    The previous line will display the value saved in the field Location. You can
    use this line in the summary and detail template.


    There are even more parameters that you can use to refine the output of the Smarty
    plugin {news}. For each module, the list of parameters can be found in the Help
    section of the module. In the admin console, open Content | News, and click on
    the Module Help link to the right of the module name.


    There are some useful parameters for the News module, as listed in the following
    table:


    | News parameter | Description |

    |---|---|

    | browsecat="1" | Shows a browseable category list. |

    | showall="1" | Shows all articles, irrespective of the end date. |

    | showarchive="0" | Shows only expired news articles. |

    | sortasc="true" | Sort news items in an ascending date order rather than descending.
    |

    | sortby="news_title" | Field to sort by. Options are: news_date, summary, news_data,
    news_category, news_title, news_extra, end_time, start_time, and random. Default
    is news_date. |

    | moretext="more..." | Text to display at the end of a news item if the field
    Summary is not empty. By default, it is set to "more..." |

    | start="0" | Starts the list of articles with the item number given. |


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_134_0.png)


    If you would like to display a detailed view of the news article in another page
    template other than your main template, then create a new page template (Layout
    | Templates), create a new page, and assign the new template to the page. Call
    the News module with {news page="alias"} where the alias is the name of the page
    where a detailed view of every news item should be displayed.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'You can even allow your site visitors to add news articles to your module if
    you install the module **FrontEndUsers** which will be described in Chapter 7,
    *Using Third-party Modules*. The news articles submitted by the website''s visitors
    will be saved as drafts, and you can publish them after approving them in the
    admin content page.


    # Using the news title as the page title


    Pay attention to the title bar of the browser on the page where the full article
    is displayed. You discover that the title tag will be the same for each item,
    as there is only one real page to display each news article. However, search engine
    optimization requires a unique title for every page. You can customize the title
    of the generated pages with a small trick. Open **Content | News** in the admin
    console, and choose the **Detail Templates** tab. At the very top of the template,
    add the following line:


    ```

    {assign var="pagetitle" value=$entry->title|escape}

    ```


    This line will generate the Smarty variable {$pagetitle} containing the title
    of the news article. To add the variable to the main template, open it, and add
    the tag {process_pagedata} at the very top of your template and replace the title
    tag with an IF structure, as shown in the following code snippet:


    ```

    {process_pagedata}

    <!DOCTYPE html>

    <html>

    <head>

    {if isset($pagetitle) && !empty($pagetitle)}

    <title>{title} - {sitename}</title>

    {else}

    <title>{sitename} - {title}</title>

    {/if}

    ...

    ```


    This piece of code checks if the variable {$pagetitle} is defined and is not empty.
    If the variable exists, then the news title is used for the title tag and is displayed
    in the title bar of the browser. If not, then the ordinary page title is taken.


    # Using the search function with the module Search


    The next standard feature that should be explained is a **Search** module. It
    is installed by default and allows the visitors of the website to search the content
    pages and the news articles on your website. Normally, you add the search field
    to your template rather than to every single page.


    Let''s add the search feature to the template at the top of the website.'
  merge: -1
  img_proc: true
