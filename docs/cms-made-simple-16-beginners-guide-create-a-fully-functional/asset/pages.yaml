- pgno: 276
  md: '+   4. If you would like to test PayPal functionality on your website, you
    can use a so called sandbox environment. What is true about the PayPal sandbox?

    +      a. It charges your real PayPal account.

    +      b. It can be used to create a seller account for testing purposes.

    +      c. It can operate only with USD as currency.

    +      d. It is not free


    +   5. E-commerce solution described in this chapter requires that the customer
    creates an account before purchasing:

    +      a. True

    +      b. False


    # Summary


    In this chapter, you learned how to set up basic e-commerce functionality with
    CMS Made Simple. Even if CMS Made Simple does not pretend to offer fully sophisticated
    e-commerce features, it offers the most wanted features with delivered modules.


    Be sure that you do not use CMS Made Simple for pure e-commerce websites. It is
    better to use a dedicated e-commerce solution for an online shop rather than CMS
    Made Simple. However, if your website has a mix of features such as a blog, a
    shop, a forum, and so on, then you can use third-party modules to implement these
    features.


    Specifically, we covered:


    +   - The **Products** module that allows you to create and edit products for
    the online shop. This module is a basis for the e-commerce suite.

    +   - The **Cart** module that adds simple cart functionality to the **Products**
    module. It saves its data in the browser session and connects the module **Product**
    with the module **Orders**.

    +   - The **Orders** module that starts the checkout process for the items added
    to the cart. This module saves all orders in the admin area and allows tracking
    and updating order status for the administrator of the website.

    +   - The **SelfRegistration** module that allows your website''s visitors to
    register with your website before making payment. We have also created a small
    workflow to see how the module is integrated in the checkout process.

    +   - The **PayPal Gateway** module that accepts instant payments from the PayPal
    website and keeps you informed about the status of the payment.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# E-commerce Workshop


    Now that we''ve learned how to realize a complete website including e-commerce
    functionality, we''re ready to proceed with advanced topics that require basic
    PHP knowledge, which is the subject of the next chapter. By this time your website
    is fully functional and can be published, so that you do not need any extended
    topics from the next chapter to have a complete website.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# # Advanced Use of CMS Made Simple


    > This chapter includes some tips for advanced webmasters who are creating websites
    with CMS Made Simple. You do not need to read the entire chapter; you can just
    pick up the sections that are most important to you.


    In this chapter, we will:


    +   - Learn how to develop multilingual websites with CMS Made Simple

    +   - Create additional layout control possibilities for the editors of the website

    +   - Make some search engine optimizations

    +   - Work with user-defined tags and the event manager to implement our own functionality
    or define custom workflows


    You will need basic PHP knowledge to follow instructions in this chapter. So let''s
    get on with it.


    # ## Localization and translation


    The admin console of CMS Made Simple is translated in over 20 languages. As you
    already know from Chapter 2, CMS Made Simple is distributed in two versions. The
    base version contains just the English language files, while the full version
    includes all language files.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'If you need only one language in addition to English (English cannot be uninstalled),
    you can download the base package and then the required language files. Language
    files can be found on the official CMS Made Simple website (http://www.cmsmadesimple.org/),
    in the **Downloads | CMSMS Release** section at the bottom of the page (you will
    only need the file corresponding to your release). To include any language in
    the base installation, download and unpack the base installation file first, then
    download the required language file corresponding to the base release number and
    unpack it as well. Merge the contents of the base folder with the contents of
    the language file folder by copying the language folder over the base files. Then
    install CMS Made Simple as usual.


    Users with access to the admin console of the website can select their preferred
    language in their personal accounts (**My Preferences | User Preferences**). For
    the base installation, only **English** is shown in the field. If you have installed
    any additional language, then it will be shown in the drop-down field **Language**
    as well. This setting does not affect the website language used for visitors to
    the website.


    To set up the website language, in the admin console, click on **Site Admin |
    Global Settings**, and change the **Default language for the frontend**. If no
    language is set there, then CMS Made Simple uses English as the default language
    (**en_US**). This setting will automatically change the default text for some
    modules on the website, for example, the label of the search button in the **Search**
    module or some labels in the **News** module.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_279_0.png)


    In the preceding screenshot, see the difference between the labels for **Category
    (Kategorie** in German), **Posted by (Erstellt von** in German), and so on. This
    will help to define most labels displayed by the modules that are translated into
    your language. However, this would only help if your website is not multilingual
    and uses only one language.


    # Configuring dates


    From time to time, CMS Made Simple must output dates and times. Especially, for
    news articles, the proper date format is important.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'The general date format can be changed in the admin console (**Site Admin |
    Global Settings**) in the field **Date Format String**. The date format should
    be entered according to the PHP format function `strftime (http://www.php.net/manual/en/function.strftime.php)`.
    There are some examples shown in the following table:


    | Date format string | Output |

    |---|---|

    | `%Y-%m-%d` | 2009-05-20 |

    | `%a %d %b %Y` | Wed 20 May 2009 |

    | `%a %d %b %H:%M:%S %Y` | Wed 20 May 15:53:40 2009 |


    The first column is built according to allowed parameters (please see the last
    link for an explanation). The second column shows the result on the page. Enter
    parameters from the first column in the **Date Format String** field to get the
    results shown in the second column.


    The month and weekday names depend on the `locale` setting of your server. On
    some servers, you can change the language used to output dates. Setting the locale
    will also affect currency, decimal separators, and other outputs dependent on
    the language. In CMS Made Simple, open the `config.php` file and find the line
    with `$config[''locale'']`. It depends on your server, what value you enter here.
    For German month names on a Linux server, try changing the line as shown:


    ```

    ```php

    $config[''locale''] = ''de_DE.UTF8'';

    ```

    ```


    # Making multilingual websites


    Multilingual websites are created in more than one language. Every language has
    its own translated navigation, content, and probably translated news articles.
    We do not speak about automatic translation of the websites that are made by Google
    or any other tool. Automatic translations are awful. They are often not readable
    by human beings and make no sense. In this section, you will learn how to create
    a real multilingual website where the entire content is translated by human translators.


    You can use the **Babel** module to manage multiple languages for the website
    and navigation. Install the module the same way you install other modules for
    your website (**Extensions | Module Manager**).


    After installation of the module, set up the page structure for the website to
    suit your desired languages, for example:


    +   1. English

    +      1.1. Our company

    +      1.2. Announcements

    +      1.3. Contact Us'
  merge: -1
  img_proc: true
- pgno: 281
  md: '+   2. German

    +     2.1. Unternehmen

    +     2.2. Aktuelles

    +     2.3. Kontakt


    The root language pages (1. and 2.) should be defined as pages with the content
    type Section Headers. You can give them any title you want. For the page alias,
    I suggest using the two-letter ISO 639-1 code system such as en (for English),
    de (for German), and fr (for French). The page alias will be used in the website
    URL like http://www.yourdomain/en/our-company or http://www.yourdomain/de/kontakt.


    In order to display the menu correctly (that is, not to display language header
    pages and pages belonging to other languages), you have to add the parameter start_level="2"
    to your top menu tag in the main template (Layout | Templates). Open the template,
    and adjust your top navigation, as shown in the following code snippet:


    ```

    {menu number_of_levels="1" start_level="2"}

    ```


    This would ensure that only second level pages belonging to the selected language
    are displayed in the top navigation. If you use the sidebar navigation, you should
    change the number of levels here as well by reducing the number of the start level:


    ```

    {menu start_level="3"}

    ```


    When the page structure is created, click on Extensions | Babel: Multilingual
    site in the admin console. For each language you have integrated in the page structure,
    click on the link Add Language, and enter the appropriate information, as shown
    in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_281_0.png)'
  merge: -1
  img_proc: true
- pgno: 282
  md: "The **Root page associated with the language** should be one of the section\
    \ headers you have created for each language. The **Default page for redirection\
    \ to this language** should be the start page for each language (not the section\
    \ header from the preceding field). For the **Language code**, you can use any\
    \ five character code, but in order to provide good compatibility with the modules,\
    \ you should use the same language codes as CMS Made Simple. Use the drop-down\
    \ list on the top-right of the admin area to prefill the form with default values.\n\
    \nClick **Submit**, and be sure that you have activated the language in the **Active**\
    \ column. Add all desired languages the same way.\n\nTo display a language menu,\
    \ use the following tag in the main template at the place where the links to different\
    \ languages should be displayed:\n\n```\n{babel action=\"menu\"}\n```\n\n# Editing\
    \ language entries\n\nIn the admin area of the **Babel** module, you will find\
    \ a link for editing the language entries for each language. Language entries\
    \ are strings that exist for each language but hold different text (or HTML code).\
    \ For the label of the *search* button in the **Search** module, you would definitely\
    \ like to have different descriptions such as:\n\n+   - *Search* for English\n\
    +   - *Suche* for German\n+   - *Recherche* for French, and so on.\n\nOpen the\
    \ **Babel: Multilingual Site** module in the admin console, and click on the **Edit\
    \ language entries** link. Click on the **Add a new language entry** link at the\
    \ top-right corner of the module's admin area. This is the place where you can\
    \ define your personal translation for each language. The entry name is a general\
    \ key that will be used to get the right translation. In our example, we would\
    \ like to translate the label of the search button, so the key for the translation\
    \ can be *search* button. In the fields below, enter the translation for each\
    \ defined language, and click on **Submit**.\n\nCustomize the label for the search\
    \ button in the template of the module **Search (Extensions | Search, tab Search\
    \ Template)**, and replace the tag {$submittext} with {babel show=\"search button\"\
    }, as shown in the following code snippet:\n\n```\n{$startform}\n<input type=\"\
    text\" class=\"search-input\"\n    id=\"{$search_actionid}searchinput\"\n    name=\"\
    {$search_actionid}searchinput\" size=\"18\" maxlength=\"50\"\n    value=\"{$searchtext}\"\
    \ {$hogan}/>\n<input class=\"search-button\" name=\"submit\" value=\"{babel show=\"\
    search button\"}\" type=\"submit\" />\n{if isset($hidden)}{$hidden}{/if}\n{$endform}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 283
  md: 'This would show the proper label translation on the search button considering
    the currently selected language. You can replace the variable `{$searchtext}`
    the same way. Create a new language entry in the **Babel** module for the search
    text, translate it, and then replace the variable `{$searchtext}` in the search
    template with the corresponding tag `{babel show="[KEY]"}`.


    # The hierarchy solution


    The **Babel** module uses the page hierarchy to know which page is equivalent
    in other languages. In our example, the page *2.2. Aktuelles* is the German equivalent
    of the English page *1.2. Announcements*, as it has the same position in the hierarchy
    of the German branch.


    In other words, should the pages in other language be ordered differently, all
    would be messed up.


    +   1. English

    +      1.1. Our company

    +      1.2. Announcements

    +      1.3. Contact Us

    +   2. German

    +      2.1. Aktuelles

    +      2.2. Unternehmen

    +      2.3. Kontakt


    In this example, the *Aktuelles* page has the first position within the German
    branch, so it is the equivalent of the first page in English, even if it is not
    logically.


    The page structure must be identical for each language. This means that all pages
    must be an equivalent in other languages or the link to the other language will
    not be shown in the language menu on this specific page. If your structure is
    not identical and some pages are not translated, then use the method displayed
    below.


    # Adding flags as the language menu


    You can add small flag images for each language on your website. Free images can
    be downloaded from `http://www.famfamfam.com/lab/icons/flags/`. Upload the required
    images into the folder `/uploads/flags/`. In the main page template (**Layout
    | Templates**), insert links to the start pages of each language as small flag
    icons, as shown in the following code snippet:'
  merge: -1
  img_proc: true
- pgno: 284
  md: '```

    {cms_selflink page="our-company" image="uploads/flags/lang_en.gif" alt="English"
    imageonly=1}

    {cms_selflink page="unternehmen" image="uploads/flags/lang_de.gif" alt="Deutsch"
    imageonly=1}

    {cms_selflink page="enterprises" image="uploads/flags/lang_fr.gif" alt="Français"
    imageonly=1}

    ```


    You can replace the tag {babel action="menu"} with the last code snippet. In this
    case, you do not need to have the same structure for each language. However, the
    above flags always point to the start page of another language and not to the
    page equivalent in the other language, whether it exists or not.


    # Separate news articles by language


    In our example, not only the labels must be translated. In the page templates,
    we show news articles on each page. It does not make sense to display news articles
    in English to the German visitors of the website and vice versa. It would be better
    to separate the news automatically by language.


    The easiest way is to create new categories in the News module and to change them
    depending on the language. With the Babel module, a new Smarty variable $page_lang
    is added to each page, so you can create Smarty conditions with this variable
    as follows:


    ```

    {if $page_lang == "en_US"}

    {news category="General" number="5"}

    {elseif $page_lang == "de_DE"}

    {news category="Allgemein" number="5"}

    {/if}

    ```


    The last code snippet assumes that two news categories were created, namely, General
    and Allgemein. Depending on the language the visitors choose, the news articles
    from only one or another category is shown in the template. The editor of the
    news only needs to choose the right category while adding news articles in the
    admin console.


    > Use the language entries of the Babel module to replace language strings such
    as Category and Posted by in the news templates according to the currently displayed
    language.'
  merge: -1
  img_proc: true
- pgno: 285
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 286
  md: 'On the left-hand side, you see English words and phrases that have to be translated.
    Translations are made on the right-hand side of the window. If the translation
    has not been made, then both columns are identical and contain English. You can
    replace the English text in the right column by the translation into your language
    and submit. That''s all! The more the users participate in translations, the better
    the translation will be.


    > If you want to participate and your language doesn''t exist in the Forge, create
    a project and inform the CMS Made Simple Forge admin, then the language will be
    added to the Translation Center.


    The translations made here will be available to all users with the next release
    of CMS Made Simple or with the next release of the core or third-party modules.
    If you need the translation right now or if you would just like to customize the
    existing language to your needs, then you have to add or change the language files
    manually on your server.


    # Translating modules in your installation


    Language files for the modules are always saved in the same folder `/modules/MODULE_NAME/lang/ext`.
    Only the default English translation is placed directly in `modules/MODULE_NAME/lang`
    in the file `en_US.php`. Open the file to see how it is organized.


    All language files are built the same way for each language. They consist of a
    single PHP array `$lang`.


    ```

    $lang[''key''] = ''Custom language translation'';

    ```


    Search for the file with the required language in `/modules/MODULE_NAME/lang/ext`,
    and open it for editing. If the file is not there, then it means that the module
    has not been translated yet. In this case, you can just copy the file `en_US.php`
    into the folder `/modules/MODULE_NAME/lang/ext` and rename it to the language
    you need. For German, you would name the file `de_DE.php`, for French `fr_FR.php`,
    and so on.


    The file can be edited with a simple text editor like Notepad or WordPad. However,
    this way of translation requires some basic PHP knowledge. Be aware that the custom
    changes made in these files may be overwritten with the next release of the module
    or CMS Made Simple, so be sure that you create a backup file with the changes
    made somewhere apart from your installation.


    Let''s see how you can translate your own module, **BWProducts** (created in Chapter
    8, *Creating Your Own Functionality* with **CTLMakerModule**), into other languages.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# # Time for action – custom translation of the module


    You have created a new module and need a German translation for it.


    +   1. With an FTP browser of your choice, for example, FileZilla, connect to
    your web hosting.

    +   2. In the `modules` folder, look for the folder that contains your module;
    in our example, it is `bwproducts`.

    +   3. Download the file `en_US.php` from the folder `modules/bwproducts/lang`
    to your local disk.

    +   4. Rename the file to `de_DE.php`, and make your translation with any text
    editor.

    +   5. Upload the translated file `de_DE.php` to the folder `modules/bwproducts/lang/ext`.


    # ## What just happened?


    The language of the module is taken from the global settings of the website (**Site
    Admin | Global Settings**, field **Default language for the frontend**). If the
    language file for the module is not found, then CMS Made Simple will automatically
    use the file `en_US.php`.


    You have created a new file for your language, renamed it according to the ISO
    language naming conventions, translated it into your language, and uploaded it
    to the right folder. That''s it. You do not need to translate everything in the
    file. Set your custom translation to some keys and see how the translations are
    overtaken in the module.


    In the same way, you can adjust existing language files if you like.


    # ## Additional content and controls for editors


    Often websites are edited by people who are not well-versed in HTML. However,
    you would like to give them as much control as possible, even if they do not have
    any special knowledge. There are some concepts in CMS Made Simple that help you
    and your editors.


    You can add more than one content block to the website if your layout requires
    physical separation of the content on one page. And you can use page attributes
    to give editors more control over the layout and the style of the website as well.'
  merge: -1
  img_proc: true
- pgno: 288
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 289
  md: "# Extra page attribute\n\nAnother way to give more control over the layout\
    \ of the page to the editor without any special knowledge is using extra page\
    \ attributes. When you open any page for editing, you will find three fields on\
    \ the Options tab, which are as follows:\n\n+   1. Extra Page Attribute 1\n+ \
    \  2. Extra Page Attribute 2\n+   3. Extra Page Attribute 3\n\nThese fields can\
    \ hold any information and can be evaluated and used in templates. For example,\
    \ if you would like to hide the news summary on some pages, you can use one of\
    \ these fields, fill it with defined values, and then check the field value in\
    \ the template.\n\n# Time for action – using extra page attributes\n\nLet's see\
    \ how you can hide the news summary on the Contact Us page.\n\n+   1. Open the\
    \ Contact Us page (Content | Pages) for editing.\n+   2. Switch to the Options\
    \ tab, and enter nonews into the field Extra Page Attribute 1.\n+   3. Save the\
    \ page.\n+   4. Now in the admin console, open your main template (Layout | Templates).\n\
    +   5. Find the Smarty tag {news}, and add an IF function as shown:\n+      {if\
    \ $node->extra1 != \"nonews\"}\n+        {news ...}\n+      {/if}\n+   6. Check\
    \ the Contact Us page to see the changes.\n\n```\n{if $node->extra1 != \"nonews\"\
    }\n  {news ...}\n{/if}\n```\n\n# What just happened?\n\nExtra page attributes\
    \ are a simple way to give additional control over the layout of the website to\
    \ the editor of the website. He should only know what he must enter into the field\
    \ Extra Page Attribute 1. In the template, you evaluate whether any value is saved\
    \ in the field and control what content should be shown or not on this specific\
    \ page.\n\nThe values entered in the extra page attributes can be retrieved in\
    \ the template with $node->extra1, $node->extra2, and $node->extra3."
  merge: -1
  img_proc: true
- pgno: 290
  md: 'The fields can also be used to display any additional information on the website
    like the article author or anything else that you would like to handle in your
    template separately from the main content. In this case, you can use the following
    Smarty tag:


    ```

    {page_attr key="extra1"}

    ```


    # Search engine optimization (SEO)


    Nowadays, it is not enough to have a website alone. Even the most beautiful and
    useful page is meaningless, if it cannot be found in search engines. And just
    being present in the search engines does not answer a purpose of getting new customers.
    You should care about the ranking (the place) your page has in the search results,
    when the most important key words or phrases representing your business are entered.


    In this section, you will find important information that will help you to improve
    your search ranking and get the most from your website.


    Before you start to optimize your website made with CMS Made Simple, you should
    know that search engines are greedy for any kind of text on your website. They
    are not interested in CSS, JavaScript, or any other beautiful technology. The
    most important point to start with is writing good unique content. If you copy
    content from other pages, you will not succeed. Having unique content is the key
    for search engine optimization. Unique content is also very important for the
    visitors of your website. The more interesting the content, the higher is the
    possibility that the visitor will turn to a customer and the visitor may probably
    recommend your website to other people.


    # Title of your website


    The most important part of your website in the eyes of a search engine is the
    title of the page. It is the text that is found between the HTML tags title. In
    Chapter 4, Design and Layout, you had created a new template and had added the
    title, as shown in the following code snippet:


    ```

    <head>

    <title>{title}- {sitename}</title>

    ```


    The Smarty tag {title} is exactly what you enter in the field Title while creating
    or editing the page. The title must be short enough (not more than 70 characters)
    and should include search keywords and phrases that match this particular page
    (not the entire website). The title should be unique for every page that you create
    in your website.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Advanced Use of CMS Made Simple


    This last requirement is easy to follow with content pages, but what about generated
    pages like news articles or products? If you examine the URLs of the detailed
    view of news, you will see that that the title does not match the news article,
    but holds the title of the page where it is displayed.


    You can customize the title of the generated pages with a simple trick. In the
    admin console, click on **Content | News**, and choose the tab **Detail Templates**.
    Open the template for edit, and at the very top of the template, add the following
    line of code:


    ```

    {assign var="pagetitle" value=$entry->title|escape:''html'':''utf-8''}

    ```


    This line will generate the Smarty variable $pagetitle that contains the title
    of the news article. To add the customized title to the main template, open it
    (**Layout | Templates**), and replace the entire HTML title tag with the following
    code snippet:


    ```

    {if isset($pagetitle) && !empty($pagetitle)}

    <title>{$sitename} - {$pagetitle}</title>

    {else}

    <title>{$sitename} - {$title}</title>

    {/if}

    ```


    This piece of code checks if the Smarty variable $pagetitle is defined and is
    not empty. If so, then the news title is used within the HTML tag title. If not,
    then the normal page title is taken. You should ensure that the very first line
    in your main template contains the following line:


    ```

    {process_pagedata}

    ```


    Without this line, the trick will not work. In this way, the title of every generated
    page can be changed. From now on, you should customize the detail templates of
    each module, and add the following line of code at the very top of the module''s
    detail template:


    ```

    {assign var="pagetitle" value=PAGE_TITLE}

    ```


    Replace PAGE_TITLE with the Smarty variable that contains the desired page title.
    In the **News** module, this was $entry->title. In the modules created with **CTLModuleMaker**,
    the line will look like:


    ```

    {assign var="pagetitle" value=$item->name}

    ```


    Different titles on every page of your website are very important for the search
    engine optimization. They are also important for the visitors of your website,
    as the title of the page is used on the browser tab and as a description of the
    website when the visitor adds the page to their favorite links or bookmarks it.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Meta tags


    Meta tags used to be a very important part of the search engine optimization.
    Nowadays, the only important tag is the meta tag for description:


    ```

    <meta name="description" content="Find the best tips on this website" />

    ```


    **Description meta tags** must include a readable description of the actual page
    (not of the whole website). It can contain any words or sentences and is displayed
    in search engines below the page title in the search results.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_292_0.png)


    The description has to be attractive to the visitor, encouraging him to visit
    your website and not the one above or below yours in the search results.


    There are two places where you can add meta tags to your website. In the admin
    console (**Site Admin | Global settings**, field **Global Metadata**), you add
    meta tags that will appear on every page. Be careful! Do not add a meta tag for
    the description here. This tag must be unique for every page if you would like
    to achieve the best search engine ranking.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'To add a specific description to one page, open the page for editing in the
    admin console (Content | Pages), and switch to the Options tab. Add the description
    meta tag into the field Page Specific Metadata, the same way you would do it in
    plain HTML.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_293_0.png)


    Do not copy the same meta tag to every page, it does not make any sense for search
    engine optimization. The description meta tag should be different in every page.


    The method just described is suitable for editors with some basic HTML knowledge.
    However, if the editor of your website does not have any HTML knowledge, you better
    give him a special field where the description of the page can be added and then
    automatically pasted into the template at the right place.


    Open your main template (Layout | Templates). Add the following line of code into
    the head section of the template, right below the Smarty tag {metadata}:


    ```

    <meta name="description" content="{description}" />

    ```


    Then, open any page for editing, and switch to the Options tab, fill in the description
    of the website in the field Description (title attribute), and the meta tag will
    be generated the right way.


    If you have a lot of pages and would like to have a description generated automatically,
    then you can also use the special third-party tag called autometa (http://dev.cmsmadesimple.org/projects/autometa).
    This tag creates meta tags for keywords and descriptions on the fly, if they are
    not found in the page metadata field. Keywords are taken from the Search module,
    which should be installed. The meta tag description includes the first characters
    of the page content.


    # Meta tag keywords


    There is a discussion on the use of meta tag keywords still being important or
    not. I do not add any keywords to my websites anymore, as I cannot see any difference
    in the ranking of websites with or without keywords. However, they cannot do any
    harm, and if you would like to use meta keywords, then add the following lines
    in the head of your main template (Layout | Templates), below the Smarty tag {metadata}:


    ```

    <meta name="keywords" content="{content block=''Keywords'' oneline=''true'' wysiwyg=''false''}"
    />

    ```'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'This code uses additional content blocks described in the previous section,
    and adds a new field named **Keywords** to the page editing window in the admin
    console. The field can then be filled by the editor of the website and will be
    automatically placed at the right place in your template.


    # Using SEO markup in templates


    This is not really a CMS Made Simple trick. However, this tip is very important
    for search engine optimization. Use the HTML tag `<h1>` in your template, and
    pay attention to the words you use in your title. The best way is to place the
    title of every page within an `<h1>` tag in your main template, as shown in the
    following code snippet:


    ```

    <h1>{title}</h1>

    {content}

    ```


    Do not use any other HTML tag for the title, as the search engine will not pay
    enough attention to titles formatted like:


    ```

    <div class="title">{title}</div>

    {content}

    ```


    Use words and search phrases that are relevant and important for your business
    in `<h1>` tags, especially on the start page. If you use a title like *Welcome!*
    on the start page, then you say to the search engine that the word *Welcome* is
    extremely important for your business. You see, that does not make sense, as you
    would not like to be found if someone searches for *Welcome*, but for the products
    or services you offer.


    Use headings in the module templates as well, for example, for the detailed view
    of news article. The best way is to place the news title in `<h1>` or `<h2>` tags
    as well:


    ```

    <h1>{entry->title}</h1>

    ```'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'It is recommended that you have at least one <h1> tag and some <h2>-<h6> tags
    in one page. In the WYSIWYG editor, you can use the format drop-down to automatically
    select headings 1 to 6, as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_295_0.png)


    # Using SEO markup in pages


    While writing content for your website, use HTML strong tags to emphasize words
    or phrases relevant to your business, products, or services. The more text you
    have, the better for search engines. However, a search engine does not use any
    logic and is not human. If it sees 800 words on the page, it can not differentiate
    between important and unimportant words. To help it identify, place important
    words in between strong tags. But do not use a lot of them. One per paragraph
    is more than enough; do not exaggerate, as it would harm your search engine ranking
    rather than help. In the WYSIWYG editor, you can use the B button to format anything
    in strong tags:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_295_1.png)'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Use internal links in your text to other pages. It means link your own pages
    if it makes sense.\nYou should link search words and phrases instead of phrases
    like *click here*.


    When adding images to your website, never forget to fill in the HTML attributes
    `alt` and `title`. Search engines use these attributes for finding and matching
    pictures in the special image search. With a WYSIWYG editor, the two fields are
    shown right below the **Image URL** tag:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_296_0.png)


    # Using keywords in page alias and image files


    Using keywords in page aliases that are used to create unique URLs for the website
    is a simple way to improve its search ranking. A page alias is generated by default
    from the title of the page, but you can change it afterwards. In the admin console,
    open any page for editing, and switch to the **Options** tab. Find the **Page
    Alias** field, and change it to suit your desired search words or phrases.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '> Do not change the alias often, especially if the page is already linked to
    other websites. If you change the alias, the page will not be found. If you still
    need to change the alias of a good linked page, without losing references, change
    it. Then create a new page with the content type Internal Page Link, give the
    page the old alias, and choose as the destination the page with the new alias.
    Do not show this page in the menu. The old link will still work and redirect the
    user to the new page alias.


    It is also better to use search keywords in the names of the image files.


    # Search engine friendly URLs


    Search engine friendly URLs are website addresses that do not contain any dynamic
    components in them, and thus are better readable for humans and search engines.
    Compare the following two URLs:


    ```

    http://youdomain.com/index.php?page=products

    ```


    ```

    http://yourdomain.com/products

    ```


    Which is better? A search engine will find the second version more attractive
    and will better index your website. Some pages with query strings in the address
    (as in the first example) are never indexed, while some will take longer to be
    indexed. After setting up your website with CMS Made Simple, you will find that
    the URLs of your pages are built in the first way. We should rewrite them to achieve
    better results with the website.


    The search engine friendly URLs are also better readable by people. If you do
    not care about the search engines, then think about the visitors of the website.
    How easy is it to type or write down the address of the specific page if we do
    not use the second rewritten version? Imagine your visitor would like to recommend
    the page. He/she would do it without any difficulties with search engine friendly
    URL and may fail with the first example.


    # Time for action – turning on search engine friendly URLs


    Let''s see how search engine friendly URLs can be enabled in CMS Made Simple.


    +   1. Open an FTP browser of your choice (for example, FileZilla), and find the
    folder `doc` in your installation.

    +   2. Copy the `htaccess.txt` file from the `doc` folder into the root directory
    of your CMSMS website (at the same level as the `config.php` file).

    +   3. Rename the file `htaccess.txt` to `.htaccess` (pay attention to the period
    at the front of the filename).'
  merge: -1
  img_proc: true
- pgno: 298
  md: '+   4. In the next step, open the `config.php` file for editing, and find the
    section *URL Settings*.

    +   5. Change the line for rewriting URLs, as shown:

    +      `$config[''url_rewriting''] = ''mod_rewrite'';`

    +   6. Open your website, and see how the links in the navigation look. They should
    be search engine friendly now.


    # What just happened?


    To enable search engine friendly URLs on your website, you had to complete two
    steps. In the first step, you moved the file `htaccess.txt` into the root directory
    of your website. You then renamed the moved file to `.htaccess` (period at the
    beginning belongs to the filename). `.htaccess` is the name of a configuration
    file that allows you to control the web server. The file is placed in the root
    directory and overrides some of the default settings of your server.


    The default `htaccess.txt` is suitable for most servers. However, sometimes you
    may encounter difficulties. For example, not all web hosting providers accept
    the following setting:


    ```

    Options +FollowSymLinks

    ```


    In this case, you will get an error 500 (internal server error) after turning
    on search engine friendly URLs. To solve the issue, comment out the following
    option as shown:


    ```

    # Options +FollowSymLinks

    ```


    If your website is placed in a subfolder, like `http://www.yourdomain.com/folder`,
    then you have to adjust the `.htaccess` file. Find the line `RewriteBase /`, and
    change it to the name of the folder where your website is placed. In our example,
    it would be:


    ```

    RewriteBase /folder

    ```


    In the second step, you modified the file `config.php`. With these changes, you
    have told CMS Made Simple that `.htaccess` is placed in the root directory, and
    you are going to use these new settings to rewrite URLs.


    With CMS Made Simple, you can even simulate a static address like `http://www.yourdomain.com/products.html`.
    In this case, the address of the pages will look like static HTML files. Open
    `config.php`, and find the line `$config[''page_extension''] = ''''`; . If you
    change it to `$config[''page_extension''] = ''html'';`, then all URLs of your
    website will look like static HTML pages.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'If you still get an internal server error (error 500), please check the following
    known issues:


    +   - Your hosting company does not support `mod_rewrite`. Ask your provider if
    the module `mod_rewrite` is available on your web hosting.

    +   - You have installed CMS into a subdirectory, for example, `http://yourdomain.com/mycms`.
    In this case, you have to edit the `.htaccess` file, and replace the line `RewriteBase
    /` with `RewriteBase /mycms` (change the name after the slash to your subdirectory).


    # Avoiding duplicate content


    Duplicate content refers to the pages whose content completely matches other pages.
    Normally, you do not create such pages consciously. However, there are some examples
    for non-malicious duplicate content:


    +   - Printer-only version of the page

    +   - Pages that are linked using multiple URLs

    +   - Mobile versions of the website, and so on.


    CMS websites with generated pages are extremely vulnerable to being penalized
    by search engines for duplicate content.


    > > Google says: As a result, the ranking of the site may suffer, or the site
    might be removed entirely from the Google index, in which case, it will no longer
    appear in the search results.


    There are some steps you can take to prevent duplicate content issues that have
    been described in the following sections.


    # Consequently use domain with www or without www


    Normally, your website can be reached at `http://yourdomain.com` or `http://www.yourdomain.com`.
    Even if the same content is shown on both addresses, it is technically possible
    to serve different contents on both addresses. Search engines know it, and can
    skip your website from the index if both versions are reachable and serve the
    same content.


    First of all, decide what your preferred domain version is. Then check what address
    has been given during the installation of your website. Open the file `config.php`
    in your FTP browser, and search for the following line:


    ```

    ```php

    $config[''root_url''] = ''http://yourdomain.com'';

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'Adjust the line to your preferred domain version if it does not match, and
    save the file on your web hosting. In the next step, open the file `.htaccess`,
    and add the marked lines as shown in the following code snippet, if your preferred
    domain name includes `www`:


    ```

    RewriteEngine on

    RewriteBase /


    # Redirect to canonical domain name with www

    RewriteCond %{HTTP_HOST} ^yourdomain\.com$ [NC]

    RewriteRule ^(.*) http://www.yourdomain.com/$1 [L,R=301]

    ```


    In the other case (your preferred domain name is without www), add the lines as
    shown in the following code snippet:


    ```

    RewriteEngine on

    RewriteBase /


    # Redirect to canonical domain name without www

    RewriteCond %{HTTP_HOST} ^www\.yourdomain\.com$ [NC]

    RewriteRule ^(.*) http://yourdomain.com/$1 [L,R=301]

    ```


    Now, all links in your website navigation should point to the correct version.
    If you enter a wrong version in the address bar of the website, it would immediately
    redirect to the right one.


    # Avoid publishing of print versions of your pages


    If you use the **Printing** module on your website to offer a printer friendly
    version of your content, then you should block it from search engines.


    In the admin console, click on **Extensions | Printing**, and click on the **Print
    template** tab. Add the following meta tags to the head section of the template:


    ```

    <meta name="robots" content="noindex,nofollow" />

    ```


    This meta tag can control the behavior of search engine crawling and indexing
    and applies to all search engines. **noindex** prevents the page from being indexed,
    and **nofollow** prevents the search engine from following links from this page.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Use tag for canonical URLs


    If you use search engine friendly URLs, then the pages of your website are available
    through different URLs. Say you have a page called FAQ placed under the page Client
    Center. This page can be accessed through three different URLs:


    +   - http://www.yourdomain.com/client-center/faq

    +   - http://www.yourdomain.com/index.php?page=faq

    +   - http://www.yourdomain.com/faq


    All these URLs actually call the same page. How can we inform the search engine
    that there is only one "main" URL that should be considered? There is a link tag,
    which can be placed in the head section of HTML:


    ```

    <link rel="canonical" href="http://www.yourdomain.com/client-center/faq">

    ```


    This tag tells the search engine what the main or canonical URL of the page is.
    All other versions of the page would be treated as non-canonical and thus not
    considered by the search engines. In CMS Made Simple, you can generate a canonical
    URL in your main page template (Layout | Templates) as shown in the following
    code snippet:


    ```

    {if isset($canonical)}

    <link rel="canonical" href="{$canonical}" />

    {elseif isset($content_obj)}

    <link rel="canonical" href="{$content_obj->GetURL()}" />

    {/if}

    ```


    Place the code in the head section of your HTML template and save it. From now
    on, the canonical URL of every page will be generated automatically in CMS Made
    Simple.


    # Creating XML sitemaps for search engines


    Sitemaps are a way to tell search engines about the pages on your website which
    otherwise they might not discover. In its simplest terms, an XML sitemap—usually
    called a sitemap—is a list of the pages on your website. Creating and submitting
    a sitemap makes sure that search engines know about all the pages on your site,
    including URLs that may not be discoverable by a normal crawling process.


    XML sitemaps can be created with the SiteMapMadeSimple module. After installation,
    this module creates a file called sitemap.xml in the root of your website and
    tells the search engine which pages can be found on the site and when the page
    was last changed. An XML sitemap is automatically updated every time you make
    changes to the pages or page structure.'
  merge: -1
  img_proc: true
- pgno: 302
  md: "You can submit your sitemap to major search engines such as Google, Yahoo!,\
    \ Bing, or Ask. For minor search engines, you can extend the robots.txt file placed\
    \ in the root directory of your website. Add the following line at the very bottom\
    \ of the file:\n\n```\nSitemap: http://www.yourdomain.com/sitemap.xml\n```\n\n\
    Adjust your domain name in the example.\n\n# Visitor statistics\n\nNow, when the\
    \ website is published, you would probably like to know how many visitors you\
    \ get per day, week, and month. In this way, you can control your efforts in search\
    \ engine optimization and gain additional information about what the visitors\
    \ of your website look for or which content is the most interesting to them. The\
    \ module provides information on how the visitors find your website and where\
    \ they come from. You can also see what browser and screen resolution the visitor\
    \ used.\n\nThere are a lot of web analysis tools that you can use on the website.\
    \ There is even a special third-party module that you can install to see the statistic\
    \ of your website directly in the admin console. The module is called Statistics.\
    \ This module not only makes the visitor statistics available in your admin console,\
    \ but also shows a visible counter on the website.\n\nYou can also use external\
    \ website analysis tools such as Google Analytics or even both (the module Statistics\
    \ and Google Analytics) if you want to compare the results. Google Analytics provides\
    \ you with special JavaScript code that you must add to the main template of your\
    \ website (Layout | Templates). It is important to know that only pages that include\
    \ this code are tracked in the statistics. By placing it in the main template,\
    \ the code is automatically called with every page, and thus the entire website\
    \ is covered.\n\nAlways include JavaScript code in the Smarty tag {literal} to\
    \ avoid the code being interpreted as Smarty code. For example:\n\n```\n{literal}\n\
    \    alien JS code\n{/literal}\n```\n\n# User-defined tags\n\nUser-defined tags\
    \ are a simple way to insert some PHP code into your site. With the default installation\
    \ of CMS Made Simple there are two example tags already created, which are as\
    \ follows:\n\n+   - {custom_copyright}\n+   - {user_agent}"
  merge: -1
  img_proc: true
- pgno: 303
  md: 'You will find them in the admin console. Click on **Extensions | User Defined
    Tags**, and then on one of the tags displayed there to see simple PHP code implemented.


    To use a user-defined tag in the page, just put its name enclosed in curly brackets
    into the page content or template. For example, you can add the tag `{custom_copyright}`
    to the footer section of your template, as shown in the following code snippet:


    ```

    {custom_copyright} businessWorld

    ```


    The tag will automatically display the year 2004, a dash, and then the actual
    year, so that you do not need to change the template to adjust the year afterwards.


    To create a new user-defined tag, you need some basic PHP knowledge. Write your
    code in any PHP editor, create a new user-defined tag, and paste your PHP code
    into it (leaving `<?php` and `?>` out). Then call the user-defined tags with Smarty
    tag in your page or templates.


    # How to make a user-defined tag


    Like most things in CMS Made Simple, adding a new user-defined tag is simple,
    if you have some PHP knowledge. Let''s create a simple PHP countdown script.


    # Time for action – creating your own user-defined tag


    Imagine you would like to countdown the number of days till the New Year on the
    start page. The days should be counted automatically and displayed at the place
    where the user-defined tag is added in the content.


    +   1. In the admin console, click on **Extensions | User Defined Tags**.

    +   2. At the bottom of the page, click on **Add User Defined Tag**.

    +   3. Enter **countdown** as the name of the new user-defined tag and the following
    code snippet into the field Code:

    +   ```

    +   $target = mktime(0, 0, 0, 1, 1, 2011);

    +   $diff = $target - time();

    +   $days = floor($diff/86400);

    +   echo $days;

    +   ```

    +   4. Click on **Submit**.

    +   5. Open any page of your website, and add the user-defined tag, shown as follows:

    +   `It is {countdown} days until 1. January 2011`

    +   6. Click on **Apply**, and see the result on the page.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# What just happened?


    You have created your own user-defined tag (UDT) in CMS Made Simple. This tag
    automatically shows the number of days until the date given in the first line
    of the PHP script (January 1, 2011).


    Then, you have used the tag in a sentence on the page. Instead of the tag {countdown},
    the number of days is shown at the place where you have added the tag.


    The name of the tag is technical information and can only contain letters, numbers,
    and underscores, just like the names of PHP variables. The name is what you will
    have to type in curly brackets to add it into a page. So be descriptive, but do
    not make it too long.


    You do not need any <? or <?php tags when you paste the code into UDT, just skip
    them. If you make a syntax mistake in your PHP code, then you will not be able
    to save the code. However, the following error will be displayed, so that you
    know you have to correct your PHP code.


    > Invalid code entered.

    > Parse error: syntax error, unexpected '']'' in /var/www/ html/businessworld
    /admin/edituserplugin.php(103) : eval()''d code on line 5


    # Parameters for tags


    User defined tags get really useful when you start to add parameters to them.
    You can pass parameters to the PHP code this way:


    ```

    {countdown date=''05-01-2011''}

    ```


    In this way, you can specify the countdown date directly in the UDT instead of
    writing it in the code, so that that there is no need to customize PHP code again
    and again.


    In PHP code, you can get the parameter with the help of the special array $params,
    which is always defined and contains all parameters passed. In the next example,
    the passed parameter date is used in the countdown script:


    ```

    $date = explode(''-'', $params[''date'']);

    $target = mktime(0, 0, 0, $date[0], $date[1] , $date[2]);

    $diff = $target - time();

    $days = floor($diff/86400);

    echo $days;

    ```


    Test this tag the same way as before, but instead of using {countdown}, use {countdown
    date=''05-01-2011''} or any other date in the format MM-DD-YYYY.'
  merge: -1
  img_proc: true
- pgno: 305
  md: "These are basic principles of writing user-defined tags. You can do some useful\
    \ things with a little imagination, so just think about what you can do if you\
    \ know a little PHP.\n\n# How to get the page information in UDT\n\nYou can pass\
    \ any variable to the UDT including objects created by CMS Made Simple. You can\
    \ show variables and objects that exist in the page with the following code:\n\
    \n```\n{get_template_vars}\n```\n\nIf you add the above tag to the template, then\
    \ you will find out that the page has an object called $content_obj. This object\
    \ contains all the information about the actual page and can be passed to UDT\
    \ as well.\n\nLet's assume we need some additional navigation that looks like\
    \ the tracing path of the visitor on the website. It means that we would like\
    \ to display the last three pages that the visitor has seen. This navigation has\
    \ to be built automatically and saved in the visitor session.\n\nCreate a new\
    \ user-defined tag and call it trace. Add the PHP code shown in the following\
    \ code snippet:\n\n```\n$pagetitle = $params['page']->Name();\n$pageurl = $params['page']->GetURL();\n\
    \n$_SESSION['trace'][$pagetitle] = $pageurl;\n\nif (sizeof($_SESSION['trace'])\
    \ > 3) {\n    array_shift($_SESSION['trace']);\n}\n\n$trace = array_reverse($_SESSION['trace']);\n\
    \nforeach ($trace as $title => $url) {\n    echo '<a href=\"'. $url .'\">'. $title\
    \ . '</a><br />';\n}\n```\n\nThis code assumes that the parameter page has been\
    \ passed to it ($params['page']) and this parameter contains the page object.\
    \ We can call the user-defined tag as shown in the following code snippet:\n\n\
    ```\n<h4>Last 3 pages you have visited</h4>\n{trace page=$content_obj}\n```\n\n\
    I suggest that you add the tag to the page template below the site navigation.\
    \ Every time the user opens a new page, the information about it is passed to\
    \ the UDT. The page parameter contains the page object, and can be used with page\
    \ content methods (Name() and GetURL()). Please see CMS Made Simple API for more\
    \ information."
  merge: -1
  img_proc: true
- pgno: 306
  md: 'The last three pages that the visitor has seen are saved in the session variable
    and are now temporarily displayed below the sidebar menu.


    # Understanding events


    In the last section, you learned to create user-defined tags. To execute the PHP
    code in the tags, you had to place it in the page or the template. With Event
    Manager, you can execute the code when certain events occur. An event can be the
    creation of a new page or even deleting a user in the admin console. There are
    over 50 events already defined in CMS Made Simple, and every module can have additional
    events.


    Examples for executing user-defined tags on events are as follows:


    +   - Sending an e-mail to the administrator of the website if any page is updated

    +   - Replacing certain parts of the page before displaying it on the website

    +   - Deleting associated stylesheets if the template is deleted


    CMS Made Simple triggers events such as ContentEditPost or DeleteTemplatePre,
    when the specified action occurs. You create one or more user-defined tags with
    custom functionality and assign them to the event. This means that the assigned
    functionality will be executed when the event is triggered. The event sends the
    actual data to the user-defined tag (if there is any), and this data can now be
    used in any way in your PHP code.


    See the list of events already added to CMS Made Simple in the admin console (Extensions
    | Event Manager). For every event, there is a brief description of when the user-defined
    tags appended to it will be executed.


    This functionality allows anybody with a bit of PHP knowledge to extend core or
    module functionality. For example, it should now be easy to send an e-mail to
    the administrator if the page is modified by the editor. For the next example,
    the CMSMailer module should be configured properly, as explained in Chapter 2,
    Getting Started.


    # Time for action – sending mails after page update


    To enable CMS Made simple to send e-mails to the administrator when a content
    page is updated, perform the following steps:


    +   1. In the admin console, click on Extensions | User Defined Tags.

    +   2. Click on the Add User Defined Tag link.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '+   3. Name the new tag buzzer and the code as shown:

    +   ```

    +   global $gCms;

    +   $cmsmailer = $gCms->modules[''CMSMailer''][''object''];

    +   $cmsmailer->AddAddress($cmsmailer->GetFrom(),$cmsmailer->GetFromName());

    +   $cmsmailer->SetSubject(''Admin buzzer'');

    +   $cmsmailer->SetBody(''The page <i> ''.$params[''content'']->mName.'' </i>
    has been changed.'');

    +   $cmsmailer->IsHTML(true);

    +   $cmsmailer->Send();

    +   ```


    +   4. Click on Submit.


    +   5. In the admin console, click on Extensions | Event Manager.


    +   6. Find the event called ContentEditPost, and click the edit button on the
    same line.


    +   7. Select the buzzer tag from the drop-down field, and click Add.


    +   8. Now, change any page to test the admin buzzer function. You should receive
    an e-mail notification with the page name changed.


    # What just happened?


    We have used the CMSMailer module of CMS Made Simple to send an e-mail notification.
    In this way, we consider all individual settings made in the module and ensure
    that e-mails are sent properly.


    The PHP code added to the tag is a slight modification of the sample code added
    to the Help section of the CMSMailer module. It sends mails to the e-mail address
    configured in the module in the field From address. We have also used the name
    of the changed page in the e-mail notification. This was possible because an event
    provides us with the object $params[''content''] that contains a reference to
    the affected page and all information about the page.


    Then, you have assigned the user-defined tag to the event ContentEditPost. This
    event is sent after the page is edited and submitted (it is not enough to just
    Apply changes, you must Submit them).


    # Integrating jQuery in navigation


    CMS Made Simple uses plain HTML, CSS, and Smarty in all templates. This means
    that you can use any jQuery effect in your templates as well. jQuery is a JavaScript
    framework and has a lot of plugins.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'To use the plugins, you have to separate HTML, CSS, and JavaScript and put
    them at the appropriate place in CMS Made Simple. HTML markup is saved in templates,
    whereas CSS is saved in stylesheets and then assigned to the template. JavaScript
    can be placed globally (**Site Admin | Global Metadata**), so that it is available
    on the whole page. Alternatively, it can be placed in the page template. In this
    case, it will be available in all pages using this template. If you need JavaScript
    only in one page, then you can add it to the **Page Specific Metadata** field
    in the **Options** tab.


    Let''s see how you can integrate a jQuery drop-down menu on your website. Examples
    and instructions for this effect can be found at `http://www.dynamicdrive.com/style/csslibrary/item/jquery_multi_level_css_menu_horizontal_blue/`.


    # Time for action – integrating jQuery in navigation


    The instruction on the link above explains how you can use this jQuery plugin
    in the pure HTML website. Let''s see how you can integrate the plugin in CMS Made
    Simple.


    +   1. Save the files `jquerycssmenu.css` and `jquerycssmenu.js` from the address
    given above to your local disk.

    +   2. Upload the file `jquerycssmenu.js` into the folder `uploads` on your web
    hosting.

    +   3. In the admin console **Add a Stylesheet (Layout | Stylesheets)**, call
    it **JQueryCSSMenu**, and copy the whole content from the file `jquerycssmenu.css`
    into the **Content** field.

    +   4. Click on **Submit**.

    +   5. In the list of stylesheets, click the blue CSS button beside the new created
    stylesheet.

    +   6. Select your main template from the drop-down field, and click on **Attach
    to this Template**.

    +   7. Open the main template of your website, and add the following code snippet
    in the head section:


    ```

    ```html

    {literal}

    <!--[if lte IE 7]>

    <style type="text/css">

    html .jquerycssmenu{height: 1%; /*Holly Hack for IE7 and below*/

    </style>

    <![endif]-->

    {/literal}

    <script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.2.6/jquery.min.js"></script>

    <script type="text/javascript" src="uploads/jquerycssmenu.js"></script>

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 309
  md: '+   8. Create or replace the top navigation in the main template with:


    ```

    <div id="myjquerymenu" class="jquerycssmenu">

    {menu template="minimal_menu.tpl"}

    <br style="clear: left" />

    </div>

    ```


    +   9. Click on Apply, and see the drop-down menu of your website.


    # What just happened?


    This was a very basic example of how to integrate jQuery into your website. First,
    you have to figure out what JavaScript files are needed for the plugin and upload
    them to your web hosting. Then create a new stylesheet, copy all styles into it,
    and attach the new stylesheet to the template. If images are used in the stylesheet,
    then upload them to the web hosting as well and adjust the image path in the stylesheet.


    Then open your template and add JavaScript to the head section of the template.
    Any scripts should be enclosed in the Smarty tags {literal}{/literal}. This tag
    allows a block of data to be taken literally. This is typically used around JavaScript
    or stylesheet blocks where curly braces would interfere with the curly braces
    of Smarty tags. Anything within {literal}{/literal} tags is not interpreted, but
    displayed as it is.


    In the last step, you add the required CSS classes and IDs to the HTML markup
    of the template. This method works for any jQuery plugin you would like to integrate.
    Another example for integrating jQuery into the Gallery module was explained in
    Chapter 7, Using Third-party Modules.


    # Pop quiz – advanced use of CMS Made Simple


    +   1. If you change the language of the admin console, it would have an impact
    on:


    +   a. All user accounts in CMS Made Simple.

    +   b. On the language displayed to the visitors of the website.

    +   c. Only to this user account.

    +   d. Nothing. You have to choose the language once during installation and cannot
    be changed later.


    +   2. If you would like to participate in making translations for CMS Made Simple,
    you have to:


    +   a. Join the official developer team of CMS Made Simple.

    +   b. Join the translation project of your language in Forge.

    +   c. Translate on your local installation and upload translations to CMS Made
    Simple forum.

    +   d. Pay the community to get needed translations.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '+   3. Meta tags are important for search engines. What meta tags are used
    by the major search engines like Google, Yahoo and Bing?

    +      a. `descr<meta name="iption" content="" />`

    +      b. `<meta name="refresh" content="" />`

    +      c. `<meta name="robots" content="" />`

    +      d. `<meta name="author" content="" />`


    +   4. Assume you use the tag `{title}` in the tag `<title>` in your template.
    What will be affected if the title of the page is changed?

    +      a. Alias of the page

    +      b. Menu text of the page

    +      c. Heading of the page

    +      d. The name in the title bar of the browser


    +   5. How can you prevent different URLs of the same page being treated as duplicate
    content?

    +      a. Consequently use domain with or without www.

    +      b. Avoid publishing print version of your websites.

    +      c. Use canonical tag for canonical URLs.

    +      d. Use `<meta name="robots" content="noindex" />` in all your pages.


    +   6. Why should you use search engine friendly addresses?

