- pgno: 190
  md: 'Edit the field **Your Email Address**. Set it to **Required**, and select **Email
    Address** in the **Field Validation** option. This will ensure that visitors must
    provide a valid e-mail address, otherwise an error message will be displayed.
    Set the value in the field **Send User a Copy of Submission** to **Never**. If
    you send a copy of the message to the visitor, you reveal the destination e-mail
    address, and probably get undesired communication bypassing the feedback form.
    Update the field and return to the list of fields in the form.


    The **Email Again** field is optional. You can remove it if you like.


    The **Message** field is defined as a **Text Area**. This means that more than
    one line can be entered in the field by the website visitor. The height and width
    of this field can be changed by setting the number of **Rows** (number of lines
    shown without scroll bar) and **Columns** (number of characters shown in one line
    before line break). The size of the field can also be customized using CSS.


    For each form, different types of template can be defined and configured. You
    can use a combination of HTML and Smarty tags as you learned in Chapter 4, *Design
    and Layout*.


    | Template | Description |

    |---|---|

    | **Form Template** | This template defines how the form should look. Open the
    **Contact Form (Extensions | Form Builder)**, and click on the **Form Template**
    tab. Some default templates can be chosen from the **Load Template** drop-down
    list. You can also create your own template by using instructions and variables
    shown in the section **Form Template Variables**. The default **Form Template**
    is very complicated. The reason for it is that it includes everything that you
    can customize for the single fields. |

    | **Submission Template** | This template defines how the response message should
    look like after the form is submitted. Open the **Contact Form (Extensions | Form
    Builder)**, and click on the **Submission Template** tab. Customize the message
    in the field **Response to display**. You don''t need to use any variables in
    this field. I also recommend removing the part **Other information** as it is
    too technical for website visitors. |

    | **Email Template** | This template defines how the e-mail message should look.
    Open the **Contact Form (Extensions | Form Builder)**, and click on the field
    **Send To** in the list of fields. Choose the **Advanced Settings** tab, scroll
    down, and click on the button **Create Sample HTML Template**. Now, you can edit
    the e-mail message in field **Email Template**. |


    **Form Builder** not only offers default templates, but offers default stylesheets
    as well. The stylesheet is automatically added after installation to **Layout
    | Stylesheets**. Attach the **FormBuilder Default Style** to the **Business World**
    template by clicking on the blue CSS icon in the list of stylesheets if you would
    like to use it. You can customize the attached stylesheet to suit the form to
    your individual page layout.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Using Third-party Modules


    # Adding new fields to the forms


    The contact form can be enriched with more fields. Let''s see how you can add
    a radio button group, drop-down group, and checkbox group to the form. New fields
    are created in the admin area of the **Form Builder (Extensions | Form Builder)**.
    Open the **Contact Form** for editing, and click the **Add New Field** link below
    the list of fields. Then you have to select the **Field Type** you would like
    to add.


    Every time you add a new field to the form, you must adjust the **Email Template**
    and **Submission Template**. New fields are added automatically to the form but
    not to other templates.


    To update the **Email Template**, open the **Send To** field for editing, and
    select the **Advanced Settings** tab, scroll down the page, and click the **Create
    Sample HTML Template** button. In the field **Email Template** above you will
    see the sample template that will be used for sending out messages. Edit the template
    if needed and click **Update** to save it. This would automatically add new fields
    to the e-mail message. On the **Submission Template** tab, you can edit the message
    that the visitor sees after the form is sent. You can create a sample HTML template
    here as well, and then alter it according to your needs.


    In the following three sections, we will add three new fields to the contact form,
    so that it looks like the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_191_0.png)


    # Adding salutation as a radio button group


    For salutation fields, you create a new field with radio buttons that are grouped
    so that only one radio button in the group can be selected at any time. Select
    **Radio Button Group** in the **Field Type** and enter the fields as shown:'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'The Radio Button label is what visitors of the website see while filling in
    the form. The Value when checked is what will be sent to you when they submit
    the form. Here you can enter different values if you like. Initially, you see
    only one option that you can fill, so click the Add More Options button to add
    more radio buttons to the group.


    Click Add when you are ready, and the field will be added to the list of fields.
    Below the list of fields, you will find the Reorder Fields link where you can
    easily drag-and-drop the fields to adjust their appearance order on the page.
    Place Salutation at the very top of your form so that it appears before the Your
    Name field.


    > Do not forget to update the Email and Submission templates after adding the
    field to the form.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Using Third-party Modules


    # Adding department as a pulldown field


    Another type of field that you can easily add to the form is a drop-down field,
    which is called **pulldown** in CMS Made Simple. Click on the **Add New Field**
    link, and select **Pulldown** as the **Field Type**. Enter the fields as shown
    in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_193_0.png)


    Just as in radio buttons, here you can differentiate between what the visitor
    sees while filling in the form (**Option Name**) and the value of the field sent
    to you (**Value Submitted**).


    > 💡 Do not forget to update the **Email** and **Submission** templates after adding
    the field to the form.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Adding multiple choice selection with the checkbox group


    In contrast to radio buttons, the checkboxes in a group can be checked without
    changing the state of other checkboxes, so multiple choices are possible. It would
    not make any sense for the salutation field, but for fields where the visitor
    can request different types of information this can be useful. Click on the **Add
    New Field** link, and select **Check Box Group** as **Field Type**. Enter the
    fields as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_194_0.png)


    Checkboxes can have different states—checked and not checked. Depending on the
    state, different values will be sent to you after submitting the form. You can
    leave the **Value when not checked** field empty. No values are sent if the boxes
    are not checked.


    > Keep the number of mandatory entries to the bare minimum, if you actually want
    people to write to you. The best clients are busy people who won''t spend hours
    on filling in pedantic forms in the first place, but rather choose a provider
    that spares their time.'
  merge: -1
  img_proc: true
- pgno: 195
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 196
  md: 'The strength of the captcha will grow depending on how many changes you have
    made. Some spam programs can read captcha images generated with default values.
    However, they fail if you place any individual values here. Be sure that you make
    only slight changes in the fields **minsize**, **maxsize**, and **maxrotation**,
    so that the captcha will still be readable to human users. Note that the changes
    are valid for all forms and modules in CMS Made Simple that use the **Captcha**
    module.


    To activate the captcha for the contact form, open the form in **Extensions |
    Form Builder**. Choose the **Captcha Settings** tab, and select the box **Use
    Captcha to protect form submissions**. See the captcha image added to the bottom
    of the contact form.


    **reCAPTCHA** has some advantages. This library is supported by a crew responsible
    for keeping it up-to-date, it is accessible for disabled persons, and it helps
    to recognize texts of scanned books thus making them available in electronic formats.
    If you would like to use reCAPTCHA you should sign up at `reCaptcha.com` and add
    your website so that you can get public and private keys for it. You cannot reuse
    the same keys for sites on other domains, so you have to add every new site to
    your account to get a new set of keys.


    # Sending out newsletters


    With CMS Made Simple and the **Newsletter Made Simple (NMS)** module, you can
    send out newsletters to your customers or any visitors of your website who have
    subscribed to the newsletter.


    You can define one or more user lists, thus separating your customers from the
    visitors and being able to send different newsletter to each user list. One user
    can be assigned to one or more lists. You create a template that contains the
    e-mail subject and text, so you don''t need to start each message from a blank
    page, you can use a template that has already been created. However, you can write
    newsletters without templates as well.


    To send out a newsletter, you will choose an existing message and a list of users
    that are going to get this message. This will be called a **Job**. The job will
    be processed manually at the time you activate it.


    Install the **NMS** module from the list of available modules in the admin console
    (**Extensions | Module Manager**). Pay attention to the modules found on the **Dependencies**
    link before installing the module. These modules should be installed before you
    attempt to install Newsletter Made Simple.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Time for action – sending mails to registered customers


    Let''s create our first newsletter that will be sent to the visitors of the website.
    You have to create one or more test users with different valid e-mail addresses
    to be able to control how the messages will be delivered. Do not use real e-mail
    addresses, unless you want them to get test messages at this point.


    +   1. In the admin console, click on **Extensions | Newsletter Made Simple**.


    +   2. Click on the **Create a List** link, and enter the fields, as shown in
    the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_197_0.png)


    +   3. Click on **Submit**.


    +   4. Switch to the **Users** tab. At the bottom of the page, click on the **Add
    User** link, and add two or more users. Assign them to the group **Public Newsletter**,
    as shown:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_197_1.png)'
  merge: -1
  img_proc: true
- pgno: 198
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 199
  md: '# What just happened?


    You have just created a new list of users in the Newsletter Made Simple module.
    This was a public list; it means that the administrator of the website is not
    the only person who can add users to this list. Making the group public means
    that any visitor of the website, whether he is a customer or not, can subscribe
    himself to the list, if the subscription form is added to the website.


    Then you created some test accounts. When you compose a new message for the newsletter,
    you can choose if the message should be sent as HTML or as plain text. If you
    need any special HTML formatting such as hyperlinks, lists, tables, or images,
    then you must compose an HTML mail. In this case, you should also compose an alternative
    text message that will be shown to the customers who are not able to see HTML
    e-mails in their mail clients. Do not use any HTML tags in the Text Message field,
    just plain text.


    For HTML e-mails, you can create templates that contain your company logo and
    contact information, so that you do not need to add it to each message separately.


    In the text message, you can use the following Smarty tags linking to your website:


    +   - `{$unsubscribe}`: A URL that can be used to display a page for unsubscribing

    +   - `{$preferences}`: A URL that can be used to display a user preferences page

    +   - `{$confirmurl}`: A URL that can be used to confirm subscriptions


    For these links to work, you have to choose a Return Page in the list of pages
    while composing a message. This page should contain the Smarty tag `{nms}`.


    You can also display the sent messages as newsletter archive on your website.
    Any message marked as public will be displayed in this public archive and can
    be read by every visitor of your website. Please read the next section to see
    how a public subscriber form for the newsletter can be added to the page or template.


    Creating jobs means putting a message and a list of users together. You do not
    send messages but just create a task. This task will be started when you process
    the job.


    > Public newsletter means that every user of your website can subscribe to the
    newsletter.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_199_0.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: '| Template | Description |

    |---|---|

    | **Subscribe** | The subscribe form, activation e-mail sent to the subscriber
    to confirm his e-mail address and message displayed after subscribing on the page.
    |

    | **Confirm Subscribe** | The confirmation e-mail sent to the subscriber after
    he/she has confirmed his e-mail address and message showed on the page when the
    e-mail is confirmed. |

    | **Unsubscribe** | The unsubscribe form, subject, and text of the e-mail sent
    to the user after he has unsubscribed from the newsletter. Text shown on the page
    after the unsubscribing form is sent and the confirmation e-mail sent to the user
    when the unsubscribing process is finished. |

    | **User Settings** | If you have more than one newsletter list that the visitor
    can subscribe to, then you can also offer a link where he/she can manage his subscription
    lists. Forms and messages needed for managing these preferences are found on this
    tab. |

    | **Archive Templates** | If you would like to display a newsletter archive on
    the website, you can use the Smarty tag `{NMS action="archivelist"}` on the page.
    There are two templates that can be used to display an archive: **list view**
    and **detail view**. You can modify the templates to suit your design on this
    tab. |


    Open the **Newsletter** page and place the Smarty tag `{NMS}` into the content
    of the page. Edit the appearance of the forms in the admin area of the **Newsletter
    Made Simple** module.


    You can adjust the delay between each message that is sent. Messages are grouped
    into batches (50 messages per batch). After each batch is sent, there is a larger
    delay. The delays are very important to preserve your web hosting''s performance.
    Sending out many mails has a heavy impact on your web server. The more mails you
    send at once, the more critical the server performance. You can change the delay
    on the **Preferences** tab. Use it with care; ask your provider how many mails
    you are allowed to send per hour and how you can be sure that your mails will
    not be implied to be spam. To get even better performance, use the `sendmail`
    method in the module **CMSMailer**.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Displaying videos


    Videos have become more and more popular on websites. Everyone can upload videos
    to YouTube, but only some people know that any of these videos can also be seamlessly
    integrated into websites. Open any video on YouTube website and look on the panel
    to the right of it.


    There are two fields with the names URL and Embed. The first field contains the
    plain link to the video. The second field contains HTML code to display it.


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_201_0.png)


    Which field to use depends upon the place of the video on your website. If the
    video should be shown on every page of your website, you have to copy the HTML
    code from the field Embed, open your page template (Layout | Templates), and add
    the code at the place where the video should be shown on every page.


    If the video should be shown in the page content on the single page, you have
    to open a page for editing in the admin console, and click on Turn WYSIWYG on/off
    below the Content field. Find the place in HTML source of the page where the video
    should be displayed, and add the code from the field Embed to this place. Not
    so comfortable, right? You can work this way if you have HTML knowledge, but what
    about the editors of the website who do not have any HTML knowledge?


    In the WYSIWYG editor, you can activate a simple plugin that helps to implement
    any video without looking into the HTML source.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'In the admin console, click on **Extensions | TinyMCE WYSIWYG**, and choose
    the **Plugins** tab. Select the plugin with the name **media**, and click **Save
    plugins**. Then switch to the **Profiles** tab. There are three sections:


    +   - **Backend profile settings**: Settings for editors of the website

    +   - **Advanced backend profile settings**: Settings for the administrator of
    the website

    +   - **Frontend profile settings**: Settings for the usage of the WYSIWYG editor
    on the frontend, for example, if your visitors can add news articles to the website


    The button for inserting embedded media is called **media** and can be added to
    any **Toolbar** of any profile depending on your individual needs. For example,
    to make the button available to the editor of the website and to the administrator
    in the first line of the toolbar, add the word **media** at the very end of the
    field **Toolbar 1** in both profiles, as shown in the following screenshot:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_202_0.png)'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Save each profile and see the button at the end of the first line in the *TinyMCE*
    editor. Now you or the editor can add any video from YouTube by clicking on the
    button. The **Type** of the file should be **Flash**; in the **File/URL** field,
    copy the link from YouTube, as shown in the **URL** field:


    ![](img/b21e3dc5c94405bc7b3f102758ea770c_203_0.png)


    The dimensions of the video will be set automatically. Additionally, a preview
    of the video is shown below. Click on **Insert**, and the video will be added
    to the page. Now, your editor should only know the link to the video; the rest
    will be done by the WYSIWYG editor.


    You do not need any additional module to insert the video on the page. A lot of
    functionality is covered by the core CMS Made Simple. Its just waiting to be discovered!


    # Adding your own player


    The method described in the last section would help if you uploaded your videos
    to YouTube first. But sometimes you would like to upload videos to your own hosting
    and display them, bypassing services like YouTube or Google Video.'
  merge: -1
  img_proc: true
