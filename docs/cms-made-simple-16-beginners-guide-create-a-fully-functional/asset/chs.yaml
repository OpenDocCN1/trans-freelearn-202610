  Piracy of copyright material on the Internet is an ongoing problem across all media.\
  \ At Packt, we take the protection of our copyright and licenses very seriously.\
  \ If you come across any illegal copies of our works, in any form, on the Internet,\
  \ please provide us with the location address or website name immediately so that\
  \ we can pursue a remedy.\n\nPlease contact us at `copyright@packtpub.com` with\
  \ a link to the suspected pirated material.\n\nWe appreciate your help in protecting\
  \ our authors, and our ability to bring you valuable content.\n\n## Questions\n\n\
  You can contact us at `questions@packtpub.com` if you are having a problem with\
  \ any aspect of the book, and we will do our best to address it.\n\n## What is a\
  \ CMS?\n\n**CMS** is an abbreviation for **content management system**. Generally,\
  \ it is an application that helps to create a website structure and manage its content.\
  \ By content, we mean any type of documents such as pages, images, structured data\
  \ as products or users, and so on.\n\nThe most important goal of any CMS is the\
  \ strict separation of content, design, and programming. You do not need to understand\
  \ how a CMS is programmed when you write and publish the content. You do not need\
  \ to be a web designer to create new pages and organize them into the navigation\
  \ of the website. A programmer creates functionalities. A designer creates a layout\
  \ without knowing how the program code is written and what exactly the content of\
  \ every page will be. The editor uses the functions supplied by the programmer.\
  \ The written content is automatically pasted into the layout created by the designer.\
  \ That's it! Everyone does the job he/she can do best.\n\nTypically, a CMS is used\
  \ to offer the ability to manage the content of the website without any programming\
  \ knowledge. The webmaster uses the CMS to create websites for customers who would\
  \ like to manage their content by themselves. Once the design is made and the functionality\
  \ is implemented, the customer can start entering his/her content. He/she does not\
  \ care about anything else. He/she uses a graphical user interface to manage the\
  \ content that is wrapped into the design.\n\nA CMS consists of files and, in the\
  \ case of CMS Made Simple, a database. Files provide functions that can retrieve\
  \ any data from the database: content, design, features, and so on. The data retrieved\
  \ is then wrapped as HTML and sent to the client (browser), because your visitors\
  \ do not care how your website is made.\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_21_0.png)\n\
  \nIn the last image, you see a client-server structure. The server is your web space\
  \ where the CMS is installed along with the database. Clients are visitors to your\
  \ website. This means that to run a CMS, especially CMS Made Simple, you need some\
  \ web space where you can create a new database and install CMS Made Simple. We\
  \ will install CMS Made Simple step-by-step in the next chapter.\n\n### A CMS versus\
  \ a website builder\n\nA CMS is not a website builder. A website builder is used\
  \ by people who would like to build websites without learning the technical aspects\
  \ of web page production. They use ready-made design templates and select from the\
  \ limited function that the website builder offers. This kind of website production\
  \ is inflexible and is often used to build private pages. A CMS caters to professional\
  \ webmasters who create an individual website's layout and integrate any features\
  \ that a customer needs.\n\n### Why CMS Made Simple?\n\nYou have decided to build\
  \ a website with CMS Made Simple. Good choice! CMS Made Simple has several advantages:\n\
  \n- It's free for personal and commercial use.\n- It's simple. You won't need more\
  \ than half an hour to introduce your customer to the usage of the CMS. It is mostly\
  \ intuitive.\n- It's flexible in design. Any design that is created in HTML and\
  \ CSS can be ported to CMS Made Simple. There are no restrictions.\n- It's modular.\
  \ The basic functionality of CMS Made Simple can be extended by installing over\
  \ 100 additional modules that are offered for free on the official website.\n- It's\
  \ popular. You are not alone. A large international community helps you to solve\
  \ your individual issues. Thousands of websites are already built using CMS Made\
  \ Simple, so you are not going to be alone.\n- It's open source. You can create\
  \ your own functionality the way you need.\n\nYou can avoid provider lock-in to\
  \ a certain proprietary closed source CMS solution. If a provider of proprietary\
  \ software decides to charge you more, goes out of business, or does not want to\
  \ incorporate desired new functionalities, then there's nothing you can do. With\
  \ an Open Source CMS, if you face a problem that you can't solve on your own, you\
  \ can at least hire a programmer who will solve it for you.\n\n\n\n\n\n## 案例研究网站\n\
  \n在本书中，我们将构建一个案例研究网站，该网站将在第8章*创建你自己的功能*结束时完成，届时可以填充内容并发布。想象一下，你需要从头开始为公司*businessWorld*创建一个商业网站。*businessWorld*是一家需要基于CMS构建网站的公司，因为网站内容将由公司员工管理。我们的任务是创建基本的网站结构，实现以HTML和CSS交付的自定义布局，并提供公司在功能规格说明中描述的功能。\n\
  \n## 功能规格说明\n\n页面的总数没有提及。员工将随着时间的推移添加任何需要的页面。新页面应自动添加到网站的导航中。布局将以HTML或CSS模板的形式交付，并且必须移植到CMS\
  \ Made Simple中。\n\n除了普通内容页面外，网站还应包括以下内容：\n\n- 一个新闻版块，可以在指定日期创建、分类和发布新闻文章到网站上\n-\
  \ 一个用于内容页面和新闻文章搜索的搜索功能\n- 所有页面均可导出为PDF的打印功能\n- 一个FAQ版块，可以随之扩展新的问题和答案\n- 一个相册，可以将产品图片和团队成员照片组织到相册中\n\
  - 一个带有自定义字段和产品层级结构的产品目录\n- 一个联系表单，以避免直接的电子邮件通信并减少垃圾邮件\n- 一个由网站访客自行订阅的新闻通讯\n- 一个面向注册客户的服务台\n\
  \n网站的每个部分都需要不同的编辑权限。有些员工只被允许管理新闻文章。其他人将负责产品目录，但无法访问新闻区域，等等。网站应针对搜索引擎进行优化。在网站的生命周期内，如果CMS\
  \ Made Simple的模块或核心发布新版本，网站管理员需要定期更新网站。现在我们已经了解了规格说明，让我们继续准备系统进行安装。\n\n## 安装准备\n\
  \n首先，收集安装CMS Made Simple所需的详细信息。你需要了解以下内容：\n\n| 数据 | 你的值 |\n|---|---|\n| 域名（网站地址）\
  \ | `http://` |\n| FTP 主机 | |\n| FTP 用户 | |\n| FTP 密码 | |\n| 数据库主机地址 | |\n| 数据库端口（可选）\
  \ | |\n| 数据库名称* | |\n| 数据库用户名 | |\n| 数据库密码 | |\n\n*在开始安装之前，你必须创建一个空数据库。如何创建新数据库取决于你的主机提供商。通常，可以在你的网站托管管理面板中创建数据库。如果遇到任何困难，请向你的提供商寻求帮助。\n\
  \n开始安装之前，表中列出的所有信息都应准备就绪。缺少任何这些信息都将导致CMS Made Simple无法安装。所需信息可以从你的托管服务商的支持处获得。现在就查明并记下所有必需的访问数据。在设置和配置过程中，你将需要这些数据。\n\
  \n要在你的网站托管上开始设置CMS Made Simple，你的域名应该已经注册并连接。现在测试一下。打开浏览器，在地址栏中输入你的域名。可以吗？如果没有，你的域名提供商将帮助你解决任何问题。\n\
  \n### 浏览器\n\n你可以使用任何浏览器来管理CMS Made Simple，但Internet Explorer 6除外。这个浏览器相当老旧。它于2001年8月发布，不符合现代互联网的要求。尽管如此，使用Internet\
  \ Explorer 6访问你网站的访客在浏览页面时不会遇到任何困难。此限制仅适用于作为网站管理员的你。\n\n## FTP浏览器\n\n你需要FTP访问权限才能访问你的网站。几乎所有网站托管都提供这种访问方式。使用FTP连接数据（见上表），你可以连接到托管服务器并上传安装和运行CMS\
  \ Made Simple所需的全部文件。\n\n有许多可以使用的免费FTP浏览器。如果你没有FTP浏览器，那么我推荐开源软件FileZilla，它可以在http://filezilla-project.org/上免费获取。现在就下载并安装FileZilla。\n\
  \n> 你只需要FileZilla客户端，而不是FileZilla服务器！\n\n## 文件解压工具\n\n文件解压工具是一种可以用来将CMS Made Simple的文件解压到本地磁盘的程序。由于CMS\
  \ Made Simple的文件以压缩包形式分发，该程序应能够处理tar.gz文件。如果你没有文件解压工具，那么你可以使用开源应用程序7-Zip，它可以从http://www.7-zip.org免费下载。\n\
  \n现在我们已经拥有所有访问信息和所需软件，可以开始安装了。\n\n## 上传CMS Made Simple的文件\n\nCMS Made Simple的文件可以从CMS\
  \ Made Simple的官方网站下载。打开http://cmsmadesimple.org，然后点击顶部主导航中的下载 | CMSMS发布版本。你会看到可供下载的文件列表，但你不需要所有文件。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_25_0.png)\n\n此操作将在你的本地磁盘上创建一个名为`cmsmadesimple-1.6.6-full`的新文件夹（或与版本和发布号类似的名称）。此文件夹包含安装CMS\
  \ Made Simple所需的全部文件。现在你必须将它们上传到你的网站空间。\n\n打开FileZilla或你选择的FTP浏览器。你必须连接到你的网站托管才能上传文件。在FileZilla中，点击**文件\
  \ | 站点管理器**。在**站点管理器**中，点击**新建站点**按钮。你应该会看到一个对话框窗口，如下面的截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_27_0.png)\n\
  \n在右侧的**主机**字段中输入你的FTP主机。然后点击**登录类型**字段，并从列表中选择**正常**。现在，你可以在下方的相应字段中输入你的FTP**用户**和FTP**密码**。你的FTP登录详细信息应由你的托管公司提供。如果遇到任何问题，请联系你的托管公司的支持部门。点击**连接**。连接应该建立，你将看到类似于下面的屏幕：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_28_0.png)\n\n在屏幕的左侧，你可以看到你的本地磁盘。导航到你解压CMS\
  \ Made Simple安装文件的文件夹。在右侧，你看到的是你的网站托管的远程文件夹。\n\n你必须将本地磁盘中的所有文件和文件夹以完全相同的文件夹结构上传到网站空间的根目录或子目录。你的根目录可以是`public_html`（或`wwwroot`或`htdocs`），如果你不确定将文件上传到哪里，请询问你的提供商。将文件放在根目录中，将使你的网站可以供用户通过http://www.yourdomain.com访问。如果你在根目录下创建子目录，例如public_html/somename，那么你的网站将只能通过http://www.yourdomain.com/somename在子目录中访问。我建议将文件上传到根目录，除非你已经在那里安装了其他应用程序。\n\
  \n要上传CMS Made Simple的所有文件夹和文件，请选择左侧（本地）的所有内容，右键单击，然后选择上传。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_29_0.png)\n\
  \n根据你的连接情况，上传文件可能需要超过十五分钟。由于FTP浏览器会创建到服务器的多个连接，可能会出现某些文件已经通过其他连接复制的情况。在这种情况下，你会看到一个类似于下面的窗口：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_30_0.png)\n\n选择**覆盖**作为操作，并勾选**始终使用此操作**复选框。等待所有文件传输到网站空间，直到上传完成。\n\
  \n传输完成后，你可以开始运行CMS Made Simple的分步安装程序。在浏览器的地址栏中输入`http://www.yourdomain.com`（使用你自己的域名），即可启动CMS\
  \ Made Simple的安装过程。如果你没有看到任何安装界面，那么说明你将文件上传到了网站空间中的错误文件夹。请向你的提供商询问文件应该放在哪里。\n\n\n\
  \n\n\n## 摘要\n\n在本章中，对整本书做了简要介绍。\n\n具体来说，我们涵盖了以下内容：\n\n- 总体上的 CMS 以及 CMS Made Simple\
  \ 的优势\n- 本书通篇使用的案例研究网站的功能规范\n- 为安装 CMSMS 准备我们的系统。\n\n我们现在准备开始安装 CMS Made Simple。\n"
- "## 2 开始使用\n\n> 在你开始使用 CMS Made Simple 创建网站之前，你必须在你的网络托管上安装该应用程序，并进行一些重要的配置，这些配置将影响你今后对网站所做的一切。要安装\
  \ CMS Made Simple，你应该了解什么是网络托管。你应该能够在你的网络托管账户中创建一个空数据库，并通过 FTP 上传 CMS Made Simple\
  \ 的安装文件。\n\n在本章中，我们将：\n\n- 安装 CMS Made Simple\n- 了解管理控制台及其组织方式\n- 完成安装\n- 配置电子邮件设置\n\
  \nCMS Made Simple 是一个使用 MySQL 数据库的 PHP 应用程序。这意味着你需要支持 PHP 和 MySQL 的网络托管才能运行 CMS\
  \ Made Simple。你可以在本地 PC 上安装 Web 服务器用于测试环境，和/或在远程网络托管上用于实时网站。CMS Made Simple 的要求如下：\n\
  \n- Linux/Unix 或 Windows 2000/XP/ME/2003 或 OS X 上的 Web 服务器\n- PHP 5.2.x（非 PHP 5.3）\n\
  \  - `safe_mode` 应关闭\n  - PHP 可用内存至少 16 MB\n  - 已启用 PHP tokenizer 支持\n  - 至少启用 ImageMagick\
  \ 或 GDlib 其中之一\n- MySQL 4.1+ 或 PostgreSQL 7+\n- 足够的服务器访问权限以上传文件并更改某些权限\n\n这些要求并不特殊，大多数托管提供商都已涵盖。如需免费无义务地测试\
  \ CMS Made Simple，你甚至可以在满足上述要求的免费网络托管上设置 CMS Made Simple。如有疑问，可在 CMS Made Simple\
  \ 论坛（http://forum.cmsmadesimple.org）上询问托管建议。\n\n### 分步安装 CMS Made Simple\n\n当你在浏览器地址栏输入域名时，CMS\
  \ Made Simple 安装程序会自动启动。安装程序将在整个安装过程中逐步协助你。\n\n### 选择语言\n\n首先选择安装语言。在下拉字段中，你可以看到安装包中所有可用的语言。在\
  \ CMS Made Simple 的基础版本中，你只能选择英语。完整版本包含更多语言。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_33_0.png)\n\
  \n请注意，你在此处选择的语言仅用于安装。网站和管理员控制台的语言以后可以更改。点击 **Submit**。\n\n### 第 1 步：验证文件完整性（可选）\n\
  \n在第一步中，你可以可选地验证安装文件的完整性。这将帮助你识别潜在问题，例如某些文件在 FTP 传输过程中损坏或因网络问题不完整。如果在将文件上传到网络托管时没有出现问题，则忽略此步骤并点击\
  \ **Continue**。验证也可以在安装完成后随时进行。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_34_0.png)\n\
  \n如果你想进行验证，则需要对应你版本的校验和文件：`cmsmadesimple-1.6.6-full-checksum.dat` 或 `cmsmadesimple-1.6.6-base-checksum.dat`。该文件可从官方网站下载。前往\
  \ http://cmsmadesimple.org，点击 Downloads | CMSMS Releases，并将校验和文件保存到本地磁盘。在上方字段中选择该文件，然后点击\
  \ **Test**。\n\n此步骤为可选。点击 **Continue**。\n\n### 第 2 步：设置文件权限\n\n如果文件不存在，请在文本编辑器中（非文字处理器）创建一个名为\
  \ `config.php` 的空文件。在 Windows 中，打开记事本（随 Windows 提供），在文档中不输入任何内容后，点击 **File | Save\
  \ As**。选择保存位置，并使用 \"config.php\"（包括引号）作为文件名，以确保使用正确的扩展名（.php）。通过 FTP 将该文件上传到 CMS\
  \ Made Simple 安装文件已上传的文件夹。`config.php` 文件应与 `index.php` 文件在同一文件夹中，如以下屏幕截图所示：\n\n\
  ![](img/b21e3dc5c94405bc7b3f102758ea770c_36_0.png)\n\n检查你创建并上传的文件是否具有 PHP 文件类型（某些编辑器可能会在文件名末尾添加\
  \ .txt 扩展名）。如有必要，将文件重命名为 `config.php`。\n\n如果文件已存在，请打开 FileZilla 或你选择的任何浏览器并右键单击它。选择\
  \ **File permissions** 并在 **Numeric value** 字段中输入 777。点击 OK。\n\n返回浏览器，点击设置检查末尾的\
  \ **Try again**；失败项应消失。\n\n如果你在 **Required settings** 部分有其他失败或警告，并且不确定如何处理，请截取该页面的屏幕截图并发送给你的服务提供商。他/她将帮助你解决问题。\n\
  \n你可以忽略 **Recommended settings** 部分的警告。即使你不纠正它们，在运行网站时也最可能不会遇到任何问题。但是，如果你能按照给出的建议解决警告，请这样做。\n\
  \n| Test | Result |\n|---|---|\n| **Recommended settings** | |\n| Checking PHP memory\
  \ limit (minimum 16M, recommend 24M or greater) You have 32M | ✓ |\n| Checking PHP\
  \ time limit in seconds (minimum 30, recommend 60 or greater) You have 30<br><em>Number\
  \ of seconds a script is allowed to run. If this is reached, the script returns\
  \ a fatal error.</em> | ⚠ |\n| Checking PHP register globals You have Off | ✓ |\n\
  | Checking output buffering You have On | ✓ |\n| Checking PHP disable functions\
  \ | ✓ |\n| Checking for safe mode You have Off | ✓ |\n| Check for PHP Open Basedir\
  \ | ✓ |\n| Test for remote URL<br>✓ fsockopen: Connection ok!<br>✓ fopen: Connection\
  \ ok! | ✓ |\n| Checking file uploads You have On | ✓ |\n| Checking max post size\
  \ (minimum 2M, recommend 10M or greater) You have 8M<br><em>You will probably not\
  \ be able to submit (larger) data. Please be aware of this restriction.</em> | ⚠\
  \ |\n| Checking max upload file size (minimum 2M, recommend 10M or greater) You\
  \ have 8M<br><em>You will probably not be able to upload (larger) files using the\
  \ included file management functions. Please be aware of this restriction.</em>\
  \ | ⚠ |\n| Checking if /var/www/web0/html/themes.icms.info/uploads is writable You\
  \ have /var/www/web0/html/themes.icms.info/uploads | ✓ |\n| Checking if /var/www/web0/html/themes.icms.info/uploads/images\
  \ is writable You have /var/www/web0/html/themes.icms.info/uploads/images | ✓ |\n\
  | Checking if /var/www/web0/html/themes.icms.info/modules is writable You have /var/www/web0/html/themes.icms.info/modules\
  \ | ✓ |\n| Checking if session.save_path is writable You have /var/lib/php5 | ✓\
  \ |\n| session.use_cookies You have On | ✓ |\n| Checking for basic XML (expat) support\
  \ You have On | ✓ |\n| Checking for file_get_contents You have On | ✓ |\n| Checking\
  \ if ini_set works You have On | ✓ |\n\n在某些 Web 服务器上，你必须更改已上传文件夹的权限。如果你使用 FileZilla，请右键单击远程文件夹并选择\
  \ **File permissions**。在对话框窗口 **Change file attributes** 中，在 **Numeric value** 字段中输入\
  \ **777**。你应对以下文件夹进行这些更改：\n\n- `tmp/templates_c`\n- `tmp/cache`\n- `uploads`\n-\
  \ `uploads/images`\n- `modules`\n\n点击 **Continue**。\n\n### 第 3 步：测试文件创建掩码（可选）\n\n\
  在此步骤中，你可以可选地测试 CMS Made Simple 是否允许在你的网络托管上创建文件。点击 **Test** 或直接忽略此步骤并点击 **Continue**。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_38_0.png)\n\n\n\n\n\n## 第 4 步：管理员账户信息\n\
  \n请特别注意此步骤。你将为自己的网站创建一个管理员账户。借助这些数据，你可以在网站安装完成后访问其管理控制台。请记住或记下你在此步骤中输入的管理员用户名和密码。请为你的账户提供一个有效的电子邮件地址。如果日后忘记了密码，重置提醒将发送至该邮箱。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_39_0.png)\n\n你可以勾选**通过电子邮件发送账户信息**选项。CMS\
  \ Made Simple 会尝试向你的电子邮箱发送一封确认邮件。不过，由于各主机的设置不同，请不要完全依赖此功能。我们将在本章稍后部分配置 CMS Made\
  \ Simple 的电子邮件设置。\n\n点击**继续**。\n\n## 第 5 步：数据库信息\n\n在此步骤中，你可以修改网站名称，或保持默认不变。此信息在安装完成后可随时更改。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_40_0.png)\n\n对于数据库信息，请使用你在安装准备阶段获取的数据库访问数据。\n\
  \n- 1. 将**数据库主机地址**替换为你自己的数据。\n- 2. 将**数据库名称**替换为你的数据库名称。\n- 3. 输入数据库**用户名**。\n\
  - 4. 输入数据库**密码**，并视需要填写**数据库端口**（如果有的话）。\n\n这些是你的数据库访问凭据。如果不确定这些字段该如何填写，请咨询你的主机服务提供商。\n\
  \n### 示例内容和模板\n\n在此安装步骤的最后一个字段中，你需要决定是否安装示例内容和模板。示例内容是首次了解 CMS Made Simple 时的有用资源，因为它包含二十多个页面，概述了\
  \ CMS Made Simple 是什么以及它的工作方式。然而，默认模板对初学者来说较难理解，因为它们结构复杂，看起来有些臃肿。\n\n对于我们的网站，我们不会安装任何默认内容或模板。\n\
  \n点击**继续**。\n\n## 第 6 步：创建数据表\n\n如果数据库连接成功，并且数据库中的数据表已创建，那么在此步骤的末尾你会看到**成功！**消息，如下一张截图所示。保持消息下方各字段中的值不变，然后点击**继续**。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_41_0.png)\n\n## 开始使用\n\n使用安装过程第 4 步中的数据，通过地址\
  \ http://www.yourdomain.com/admin 登录管理控制台。网站管理员还可以添加其他用户（参见第 6 章“用户与权限”）。\n\n管理控制台中的所有内容都通过主水平菜单访问。当你首次进入管理区域时，还会看到一个站点地图，显示每个菜单可访问的内容。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_43_0.png)\n\n对于任何菜单项的站点地图，当你点击主水平菜单（CMS、内容、布局、用户与组等）时，该菜单项的所有子项都会显示出来。\n\
  \n让我们快速浏览一下管理控制台中有哪些内容。\n\n- **CMS**：在 CMS 菜单中，你可以打开管理员站点地图（见下一张截图）、在新窗口中打开前端页面（查看站点），或退出登录。\n\
  \n  ![](img/b21e3dc5c94405bc7b3f102758ea770c_44_0.png)\n\n- **内容**：在这里你可以管理网站的内容。你可以添加和编辑页面，上传和管理图片与文件，还可以添加、编辑和删除新闻。如果你安装了额外的内容模块（如留言簿或\
  \ FAQ），它们也会出现在此部分。最后，在内容菜单中，你可以创建全局内容块，这些内容块将在整个网站的不同位置使用，并且可以统一编辑。\n\n  ![](img/b21e3dc5c94405bc7b3f102758ea770c_44_1.png)\n\
  \n- **布局**：在这里你可以按照自己的意愿来设计页面外观和格式。对于整体布局，你需要使用模板。在布局菜单中，你还可以访问样式表。使用样式表（CSS），你可以为页面的不同元素设置样式。\n\
  \n  ![](img/b21e3dc5c94405bc7b3f102758ea770c_44_2.png)\n\n- **用户与组**：通过此菜单项，你可以添加应拥有网站管理控制台访问权限的用户，并选择他们将拥有哪些权限。你可以将用户分组，从而同时为整个组轻松选择权限。\n\
  \n  ![](img/b21e3dc5c94405bc7b3f102758ea770c_45_0.png)\n\n- **扩展**：这些是为 CMS Made\
  \ Simple 提供额外功能的附加组件。CMS Made Simple 的标准安装仅包含一些基本功能。通过扩展，你可以为网站添加几乎所有功能。扩展可以是模块，也可以是标签（也称为插件）。\n\
  \n  ![](img/b21e3dc5c94405bc7b3f102758ea770c_45_1.png)\n\n- **站点管理**：在这里你可以更改整个网站的设置和偏好，获取系统信息，并验证文件的完整性。你或其他用户对网站所做的任何更改都会记录在**管理员日志**中。\n\
  \n  ![](img/b21e3dc5c94405bc7b3f102758ea770c_45_2.png)\n\n- **我的偏好**：在这里你可以更改个人设置。你也可以管理管理区域中最常用页面的快捷方式。如果你想更改管理员账户的用户名、密码或与该账户关联的电子邮件，请点击**我的账户**。\n\
  \n  ![](img/b21e3dc5c94405bc7b3f102758ea770c_45_3.png)\n\n### 完成安装\n\n安装完成后，你可能会立即在主菜单下方的仪表板区域看到两条未处理的通知。点击通知旁边的\
  \ + 号以展开仪表板区域。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_46_0.png)\n\n第一条通知提醒你，`install`\
  \ 文件夹仍然存在于 Web 服务器上。该文件夹包含你用于安装 CMS Made Simple 的安装程序。一旦 CMS Made Simple 安装并运行，你就不需要这个文件夹了，因此你应该将其删除或至少重命名。如果不这样做，任何人都可以重新启动安装程序，从而用全新安装覆盖你的网站。这将是一个严重的安全问题，请立即删除该文件夹。\n\
  \n在删除（或重命名）该文件夹后，刷新管理控制台，可以看到第一条消息消失。\n\n第二条消息涉及在运行 CMS Made Simple 之前应配置的电子邮件设置。\n\
  \n### 使用 CMS 发送电子邮件\n\nCMS Made Simple 通过 **CMSMailer** 模块发送电子邮件。**CMSMailer** 模块的配置非常重要。如果不配置它，那么万一你忘记了管理员密码，你将无法收到包含新登录信息的电子邮件。该模块也被许多其他发送电子邮件的\
  \ CMS Made Simple 模块使用，如 **FrontEndUsers**、**Orders** 或 **FormBuilder**。\n\n在配置该模块之前，你会一直在\
  \ CMS Made Simple 的仪表板中看到这条通知。\n\n在管理控制台的主水平导航中，选择**扩展 | CMSMailer**。将**字符集**设置为\
  \ `utf-8`。然后，在**邮件发送方式**字段中选择 **sendmail**。在**发件人地址**字段中填写一个现有的电子邮件地址。当 CMS 发送电子邮件时，收件人会看到该地址作为发件人地址。你必须在此输入一个现有的电子邮件地址，因为由于\
  \ Web 主机上的垃圾邮件和安全设置，CMS Made Simple 很可能无法发送电子邮件。\n\n填写“发件人用户名”字段。这里提供的名称将被分配给收件人邮件客户端中的邮件地址。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_47_0.png)\n\n点击**提交**，并确认更改。\n\n使用同一页面上的最后一个字段测试你的设置。在**测试电子邮件地址**字段中，输入一个你可以访问其邮箱的任意电子邮件地址（不要使用**发件人地址**字段中的地址）。CMS\
  \ Made Simple 将向该字段中给出的电子邮件地址发送一条测试消息。点击**发送测试消息**按钮，并检查**测试电子邮件地址**字段中给出的邮箱的收件情况。你收到测试消息了吗？\n\
  \n如果没有收到，请稍等片刻，然后检查你的垃圾邮件文件夹。有时测试消息会被过滤并视为垃圾邮件。如果测试消息仍未发送，则说明 **CMSMailer** 模块的配置有问题。\n\
  \n### 已知问题\n\n- 检查**发送邮件位置**字段（你的主机服务提供商必须确认该位置是否正确，或者他/她应提供你的个人位置）。\n- 检查**发件人地址**字段中输入的电子邮件地址。它必须是现有的电子邮件地址，并且必须位于你的\
  \ Web 主机上。如果输入任何其他电子邮件地址，你的服务器将无法发送电子邮件。要使用 Gmail 或 GMX 等公共电子邮件服务的地址，你需要将模块配置为使用\
  \ SMTP 作为**邮件发送方式**。此方法要求你根据 SMTP 填写相应字段。SMTP 设置因电子邮件服务提供商而异。\n- 检查**测试电子邮件地址**的垃圾邮件文件夹和过滤器，有时测试消息会被分类或立即删除。\n\
  \n\n\n\n# 开始入门\n\n# 总结\n\n在本章结束时，你应该已经完成了 CMS Made Simple 的全新安装。\n\n具体来说，我们涵盖了：\n\
  \n- 程序安装：CMS Made Simple 附带一个简单的安装程序，引导你逐步完成设置过程。我们已执行了这些步骤，使 CMS Made Simple 运行起来。\n\
  - 管理控制台概述：管理控制台就像飞机的驾驶舱。它是一个你可以控制整个网站的地方。在本书中，你将更详细地了解每个部分。\n- 发送电子邮件：你已配置 CMS Made\
  \ Simple，使其能够从管理控制台发送邮件。如果你忘记了管理员密码，你将收到一封提醒邮件，其中包含如何找回密码的说明。CMS Made Simple 的所有核心模块和大多数第三方模块都依赖此功能。一旦配置完成，你就不需要为每个模块单独设置。\n\
  \n在下一章中，我们将了解如何创建网站结构并构建网站导航。\n\n规划网站也将帮助我们为其选择合适的设计。如果你的网站计划与已创建的导航不匹配，再好的设计也会失败。在示例网站计划中，你可以轻松标明主导航（以粗体标记）、子导航（以灰色标记）以及网站的通用结构。有一个粗略的计划并且不频繁更改是很重要的。\n\
  \n在规划网站时，你很可能会有越来越多的想法——把它们写下来！这样规划的好处是你完全不受限制。你可以现在记下所有想法，选择可行的任务并专注于它们。之后，你可以添加对网站首次实现来说并非必需的新部分。区分“有则更好”的功能和“不可或缺”的功能非常重要。\n\
  \n如果你创建网站计划来记录所有想法，你就可以避免创建只包含一句“正在建设中”这样的页面。好的网站不会有任何未准备好的页面。如果有，就不应该展示给访客。想象一下，你在服装店橱窗里看到一则关于个人形象咨询的告示。你走进店里，店员却说：“抱歉！这项服务仍在建设中。”\
  \ 这样引起人们注意又有什么意义呢？有些网站管理员把这样的页面添加到网站上只是为了“记住它们”。如果你在另一个地方写下网站的主要结构，就能更高效地记住它们。\n\
  \n> 询问你的朋友或家人他们计划向网站添加什么，并记住他们的想法。在规划时，考虑不同的年龄段和兴趣，以扩大访客的范围。\n\n如果一切完美，那么就浏览网站计划中的主要部分，并标记可以立即完成的部分（前面提到的网站计划中的所有部分都将在本指南中讨论）。其他部分不应从计划中删除，而应标记为推迟。通常，一开始你有足够的事情可做。专注于这些可行点，并记住推迟的点。\n\
  \n当你准备好网站计划后，把它打印出来，放在电脑旁边，然后开始着手你的网站。\n\n在本章中，我们将：\n\n- 创建并编辑一些页面\n- 了解页面层次结构\n\
  - 控制网站导航\n\n## 创建页面\n\n我们将从为网站创建一个粗略结构开始。网站由相互链接的页面组成。网站导航帮助访客找到包含所需信息的页面。一个网站必须至少有一个页面，因此安装后，第一个页面已在你的管理控制台中创建。它是你网站的起始页，名为“Home”。\n\
  \n### 动手操作——向网站添加新页面\n\n你的网站需要一个展示公司信息的页面。这是网站计划中“我们的公司”部分的页面。让我们按如下步骤创建一个新页面：\n\
  \n- 1. 在网站的管理控制台中，点击“内容 | 页面”，然后点击“添加新内容”链接。\n- 2. 填写“标题”和“内容类型”字段，如下面的截图所示：\n\n\
  ![](img/b21e3dc5c94405bc7b3f102758ea770c_52_0.png)\n\n### 创建页面和导航\n\n**3.** 点击**提交**。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_53_0.png)\n\n**4.** 点击管理控制台右上角的放大镜图标，查看你的网站，并找到已添加到网站主导航中的新页面。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_53_1.png)\n\n### 刚才发生了什么？\n\n你刚刚向网站添加了一个新页面。该页面的标题为**我们的公司**，现在已列在管理控制台中网站的当前页面列表中。该页面也会自动添加到网站的主导航中。它的内容字段中有示例公司信息。当你导航到该页面时，这段文本会显示在网站的**我们的公司**页面上。\n\
  \n你只输入了很少的信息来创建一个新页面。然而，其他事情也发生了。\n\n菜单文本已根据页面标题创建。页面地址（URL）也已根据页面标题创建。当你导航到该页面时，它是页面链接中位于浏览器地址栏\
  \ `index.php?page=` 之后的部分。在 CMS Made Simple 中，我们将这部分称为**页面别名**。页面别名在你的网站中是唯一的。你可以有很多具有相同标题和菜单文本的页面，但所有这些页面都会有不同的页面别名。由于页面别名用于创建指向特定页面的链接，因此你不能让两个不同的页面具有相同的链接，逻辑上你也不能让两个不同的页面使用相同的页面别名。\n\
  \n你无需操心将创建的页面集成到网站的导航中。如果你没有其他说明，所有已创建的页面都会显示在导航中。\n\n现在，你可以创建网站第一层的所有页面，从而在网站顶部创建主导航。添加以下页面：\n\
  \n- 产品\n- 客户中心\n- 联系我们\n- 隐私政策\n- 站点地图\n\n在管理控制台和你的网站上检查当前页面列表。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_54_0.png)\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_56_0.png)\n\n经常使用**应用**按钮，尤其是在处理大量文本时，请在单独的编辑器窗口中保留一份副本。如果连接断开或超时，页面将无法在浏览器中加载，修改也会丢失。\n\
  \n### 预览更改\n\n如果你想在保存前预览更改，请在不应用更改的情况下切换到**预览**选项卡。你可以在预览窗口中看到更改，但这些更改此时不会显示给网站的访客。一旦你应用或提交了编辑后的页面，更改就会对网站访客可见。\n\
  \n### 更改页面别名\n\n你也可以更改页面的页面别名。在编辑页面时切换到**选项**选项卡，并在**页面别名**字段中输入所需的别名。将页面别名视为页面的链接。此字段中不允许输入特殊字符，因此请使用空格或留空。请仔细选择在此处输入的名称，因为网站在线发布后，你将无法轻易更改它。一旦你的网站被搜索引擎收录，页面将以页面别名生成的链接显示在搜索结果中。如果你更改了页面别名，那么该页面将无法被找到，你的访客将看到错误消息，而不是所需的信息。\n\
  \n### 删除页面\n\n你可以从管理控制台（**内容 | 页面**）的当前页面列表中删除页面。找到不再需要的页面，然后点击该页面的垃圾桶图标。小心！已删除的页面无法恢复。如果你只想将页面保留用于个人用途，则将其设为不活动（有关更多信息，请参阅*控制网站导航*一节）。\n\
  \n### 格式化页面内容\n\n你已经创建并编辑了一些页面。请注意，你在**内容**字段中输入的文字会显示在网站的某个位置。这段文字只是整个页面的一小部分。你无法从这里更改导航、页眉或页脚部分的设计。\n\
  \n\n\n\n\n## 创建页面与导航\n\n如果你只是网站的一名编辑（不是设计师，也不是管理员），那么你可以在这里创建或编辑文章，但无法更改网站上的任何其他内容。这是**内容管理系统（CMS）**最重要的原则。我们将设计与内容分离，以便不同的人可以完成不同的任务。这也有助于将布局与内容分开，从而可以在不经历重重困难的情况下全局更改网站的外观。\n\
  \n编辑需要能够通过将某些短语加粗、创建列表或链接到网站的其他页面来格式化自己的写作。通常，这需要 HTML 知识，除非你使用**所见即所得编辑器**。\n\n\
  **WYSIWYG** 的意思是**所见即所得**，它让你能够使用常见的文字处理功能来格式化页面文本。此外，文本在编辑器中的显示方式与它在网站上的最终显示效果一致。\n\
  \n> 使用所见即所得编辑器创建、编辑和格式化网站文本部分时，不需要任何 HTML 知识。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_57_0.png)\n\
  \n所见即所得编辑器是每个 CMS 的核心和最重要的功能。如果你使用 CMS 创建网站，那么你将不断向网站添加内容。这意味着，除了其他模块之外，所见即所得编辑器将成为你\
  \ CMS 中最常用的功能之一。因此，了解编辑器如何帮助你以及你可以做些什么来让它满足你的需求非常重要。市面上有一些所见即所得编辑器，对于 CMS Made Simple\
  \ 来说，名为 **TinyMCE** 的编辑器是集成度最高的。\n\n在管理控制台中，转到**内容 | 页面**并选择任意页面进行编辑。**内容**字段使用所见即所得编辑器（你可以在内容字段上方看到工具栏），如下面的截图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_57_1.png)\n\n编辑器的工具栏不言自明，与大多数流行的文字处理程序类似。如果你去探索，还会发现更多可以简化工作的设置。\n\
  \n通常，大量文本是在 Microsoft Word 等文字处理程序中编写的。如果你将 Word 中的文本直接复制到内容字段中，则会产生很多问题，因为 Word\
  \ 生成的 HTML 质量很差。在编辑器的工具栏中，有一个特殊按钮（第一行中的第四个）用于从 Word 粘贴文本。始终使用此按钮从 Word 复制文本，因为它会过滤掉文本中的杂乱代码。\n\
  \n## 配置 TinyMCE\n\n在管理控制台中，点击**扩展 | TinyMCE WYSIWYG**。你可以在此处更改编辑器字段的宽度和高度。默认情况下，编辑器字段的大小会自动设置；根据你的屏幕偏好进行更改，以获得更多的书写和阅读空间。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_58_0.png)\n\n取消选中**自动**字段，输入所需的宽度和高度，然后点击**保存设置**。设置下方有一个测试字段，你可以立即看到更改效果。该字段允许你预览更改，因此无需编辑页面即可控制编辑器的外观。\n\
  \n在**配置文件**选项卡中，你可以添加更多功能。对于网站管理员，必须在**高级后端配置文件设置**部分中进行更改。选中**允许表格操作**字段，以便能够使用所见即所得编辑器创建和编辑表格。保存配置文件后，你会在编辑器工具栏中找到第三行，它有助于构建\
  \ HTML 表格。\n\n如果你希望直接从编辑器上传图片，请勾选**显示文件管理选项**字段。点击**保存配置文件**，然后点击工具栏中的**插入/编辑图像**图标。此时会弹出一个窗口，你可以在其中更改图像\
  \ URL。点击它，你的图片文件夹内容就会显示出来，如下一张截图所示。通常，此窗口不允许上传。但是，由于你已激活文件管理选项，你会在图片列表上方找到**文件操作**部分，可以在其中上传图片。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_59_0.png)\n\n> 从一开始就使用文件夹来组织图片，否则你很快就会拥有数百张杂乱的图片，而重新整理它们将是一个大问题，因为它们已经链接到各个页面。一个文件夹中有大量图片会减慢文件选择器的加载速度，并且找到你要找的图片将变成一项艰巨的任务。\n\
  \n继续在**插件**选项卡中自定义编辑器。有一些有用的插件默认未激活，但可以根据需要激活。我建议激活以下插件：\n\n- **print**：允许你从编辑器打印文本\n\
  - **fullscreen**：添加全屏编辑模式\n- **searchreplace**：为文本添加搜索/替换对话框\n\n点击“保存插件”。只有 fullscreen\
  \ 的图标被添加到第二个工具栏中帮助图标之前。另外两个没有出现。为什么？让我们退一步，再次检查“配置文件”选项卡。在“高级后端配置文件设置”部分，你可以看到三行工具栏。这些行控制编辑器中第一行、第二行和第三行（目前为空）中图标的显示顺序。单个按钮在工具栏字段中以其名称表示，如下面的截图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_60_0.png)\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_60_1.png)\n\
  \n你可以删除其中一些、更改顺序或添加新的。这就是我们接下来要做的。\n\n### 动手实践——激活搜索和替换功能\n\n有一个有用的插件，可以搜索页面的全部内容，并将某个单词或短语的所有实例替换为其他内容。让我们看看如何在\
  \ TinyMCE 中激活这个插件。\n\n1. 在管理控制台中，点击**扩展 | TinyMCE WYSIWYG**。\n2. 点击**插件**选项卡。\n\
  3. 选中名为 **searchreplace** 的插件旁边的复选框，如下面的截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_61_0.png)\n\
  \n4. 点击**保存插件**按钮。\n5. 切换到**配置文件**选项卡。\n6. 在**高级后端配置文件设置**部分，将单词 **search, replace**\
  \ 添加到**工具栏 3**字段中，如下面的截图所示：\n\n| 工具栏 | 内容 |\n|---|---|\n| 工具栏 1 | cut,paste,pastetext,pasteword,copy,separators,justifyleft,justifycenter,justifyright,justifyfull,separators\
  \ |\n| 工具栏 2 | bold,italic,underline,strikethrough,advhr,separators,bullist,numlist,separators,outdent,indent,separators\
  \ |\n| 工具栏 3 | search,replace |\n\n点击此处查看 TinyMCE 维基中的工具栏说明。\n\n7. 点击“保存配置文件”按钮，可以看到添加到工具栏第三行的附加功能，如下面的截图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_62_0.png)\n\n### 刚才发生了什么？\n\n首先，你在“插件”选项卡中激活了插件。激活插件意味着该插件会随\
  \ TinyMCE 一起加载。但仅仅激活它还不够。在第二步中，你必须自定义 TinyMCE 的工具栏，以告知编辑器该插件的按钮应显示在何处。\n\n你看到单个插件可以提供两个按钮。因此，你必须在“工具栏\
  \ 3”字段中输入两个单词。第一个是 search，用于搜索按钮；第二个是 replace，用于替换功能。它们不能同时使用。如果你不需要某个特定功能，可以省略第一个或第二个。\n\
  \n> 在“工具栏 3”字段中添加插件 removeformat。这是一个无需先激活的插件，因为它属于标准插件。该插件允许在不查看 HTML 的情况下移除文本的任何格式。\n\
  \n\n\n\n\n## 创建页面和导航\n\nWYSIWYG 编辑器中还有更高级的设置。要理解它们，你需要了解 CMS Made Simple 的整体工作原理。我建议在阅读本书的同时反复参考\
  \ WYSIWYG 编辑器的设置，以提高使用编辑器的效率。\n\n### 添加 meta 标签\n\nMeta 标签包含有关网站的附加信息。这些信息不会直接显示给网站访客；meta\
  \ 标签的目的是向搜索引擎和网络浏览器提供有关网站的附加信息。我们必须区分网站每个页面都相同的 meta 标签和特定内容页面独有的标签。\n\nMeta 元素是提供搜索引擎附加信息的\
  \ HTML 或 XHTML 元素。它们对网站访客不可见。此类元素必须作为标签放置在页面的 head 部分。Meta 元素可用于指定页面描述、关键词以及任何其他元数据。\n\
  \nMeta 元素指定名称和描述页面的相关内容。例如：\n\n```html\n<meta name=\"keywords\" content=\"business\
  \ company, services\" />\n```\n\n在此示例中，meta 标签将页面标识为包含与短语 `business company` 和单词\
  \ `services` 相关的关键词。\n\n### 动手时间 – 向页面添加 meta 标签\n\n让我们为网站的起始页添加一些特定的 meta 标签。\n\
  \n1. 在管理控制台中，打开 **Content | Pages**。\n2. 点击起始页 **Start** 以编辑它。\n3. 切换到 **Options**\
  \ 选项卡。\n4. 在字段 **Page Specific Metadata** 中，添加特定于该页面的 meta 标签。\n\n    ![](img/b21e3dc5c94405bc7b3f102758ea770c_64_0.png)\n\
  \n5. 点击页面底部的 **Apply**。\n6. 点击 **Apply** 按钮旁边的放大镜图标。\n7. 在页面源代码中查看网站的 head 部分。\n\
  \n### 发生了什么？\n\n你已以纯 HTML 形式向网站的起始页添加了 meta 标签。这些 meta 标签仅出现在该特定页面上。一般来说，描述和关键词的\
  \ meta 标签在每个页面上都应不同。\n\n> 也可以在此处添加用于生成的页面 head 部分的任何其他标签（不仅限于 meta 标签）。\n\n### 添加全局\
  \ meta 标签\n\n一些全局 meta 标签已添加到 CMS Made Simple 的标准安装中。你可以在 CMS Made Simple 生成的每个页面的源代码中看到这些\
  \ meta 标签：\n\n```html\n<meta name=\"Generator\" content=\"CMS Made Simple - Copyright\
  \ (C) 2004-2009 Ted Kulp. All rights reserved.\" />\n<meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=utf-8\" />\n```\n\n要更改或删除这些标签，请在管理控制台中点击 **Site Admin\
  \ | Global Settings**。在字段 **Global Metadata** 中找到上面列出的 meta 标签。你可以在此字段中使用纯 HTML\
  \ 添加自己的 meta 标签。\n\n> 也可以在此处添加用于所有页面 head 部分的任何其他标签（不仅限于 meta 标签）。\n\n### 理解页面层级\n\
  \n你在上一步中添加的所有页面现在都显示在网站的主导航中，并且可以在管理控制台的当前页面列表中找到。但在我们的网站计划中还有一些页面需要添加到层级中。\n\n\
  通过页面层级，你可以定义页面相对于另一个页面是位于上方、下方还是同一级别。如果页面未显示在主导航中，我们称其为 **子页面**。这也意味着子页面上方有一个父页面。\n\
  \n### 动手时间 – 向网站添加子页面\n\n让我们根据网站计划在 **Our Company** 页面下方创建四个页面。\n\n1. 在网站的管理控制台中，点击\
  \ **Content | Pages**，然后点击 **Add New Content** 链接。\n\n2. 填写字段 **Title** 和 **Content**，如以下屏幕截图所示，并在下拉字段\
  \ **Parent** 中选择页面 **2. Our Company**。\n\n    ![](img/b21e3dc5c94405bc7b3f102758ea770c_66_0.png)\n\
  \n3. 点击 Submit。\n\n4. 点击三角形以展开 Our Company 页面下方的页面列表并查看创建的子页面。\n\n    ![](img/b21e3dc5c94405bc7b3f102758ea770c_66_1.png)\n\
  \n5. 点击刚创建页面旁边的放大镜图标以在网站上查看该页面。\n\n### 发生了什么？\n\n你已添加了一个新页面。这次你选择了一个父页面，将新页面置于父页面下方的层级中。在管理控制台中，你可以看到该页面现在缩进在父页面下方。它获得编号\
  \ 2.1，表示该页面属于编号为 2 的页面，并且是其第一个子页面。你不会在网站的主导航中找到该页面，然而，当你在导航中将鼠标悬停在 Our Company 上时，你可以看到该页面已添加到子导航中。\n\
  \n我们需要页面层级来将页面组织为主部分，并自动构建子导航。\n\n如果你想更改页面在层级中的位置，你必须通过在页面列表中点击它来编辑该页面。在字段 Parent\
  \ 中选择另一个父页面并保存更改。如果你选择下拉列表中的 none，则页面将被移至第一级，从而显示在主导航中。\n\n使用当前页面列表底部的 Expand All\
  \ Sections 链接以显示所有层级级别。使用 Collapse All Sections，你可以隐藏所有子页面，仅显示第一级。\n\n你可以使用 Move\
  \ 列中的图标（向下和向上）重新排序同一级别的页面。但是，如果你必须将一个或多个页面从列表的底部移动到顶部，使用移动图标会很困难（尤其是在页面数量很多的情况下）。在这种情况下使用\
  \ Reorder pages 链接。此功能允许你通过点击页面并将其拖动到同一层级内的不同位置来重新排序页面。\n\n在管理控制台中重新排序页面也会更改页面在网站导航中的显示顺序。\n\
  \n### 面包屑\n\n你的层级也在所谓的面包屑中显示——显示在网站内容上方的导航辅助。它以 You are here 开始，显示页面的路径并提供返回当前页面父页面(们)的链接。\n\
  \n### 搜索引擎友好的 URL\n\n在创建网站时，你可能考虑过如何在搜索引擎中推广它。在开始分享网站页面 URL 之前，建议设置搜索引擎友好的地址。\n\n\
  搜索引擎友好的 URL 不包含任何动态组件，对网站访客和搜索引擎来说更易读。比较以下两个 URL：\n\n```text\nhttp://yourdomain.com/index.php?page=products\n\
  ```\n\n```text\nhttp://yourdomain.com/products\n```\n\n哪个页面地址更好？如果网站使用第二个版本，搜索引擎会更好地索引你的网站。一些地址中带有动态查询字符串的页面（如第一个示例）永远不会被索引，而有些页面进入搜索结果所需的时间会更长。\n\
  \n如果你不在乎搜索引擎，那么想想网站的访客。如果我们不使用第二个重写版本，输入或写下特定页面的地址有多容易？想象一下你的访客想推荐该页面。他使用搜索引擎友好的\
  \ URL 将会毫不费力地做到这一点，而使用第一个示例可能会失败。\n\n然而，在使用 CMS Made Simple 安装网站后，你会发现页面的 URL 是按第一种方式构建的。你可以轻松更改它们以获得更好的网站效果。\n\
  \n### 动手时间 – 创建搜索引擎友好的 URL\n\n要启用网站的搜索引擎友好 URL，请执行以下步骤：\n\n1. 启动 FileZilla 或你选择的任何其他\
  \ FTP 浏览器。\n\n2. 连接到你的托管服务并选择文件 `config.php` 进行编辑。（你也可以将文件复制到本地磁盘进行编辑，并在进行以下更改后上传）。\n\
  \n3. 在 `config.php` 中搜索 “URL Settings” 部分，并将 `$config['url_rewriting'] = 'none';`\
  \ 替换为 `$config['url_rewriting'] = 'mod_rewrite';`\n\n4. 关闭、保存并将文件重新上传到你的网络托管。\n\n\
  5. 进一步使用 FileZilla 或你选择的任何其他 FTP 浏览器，打开 `doc` 目录。\n\n6. 将 `doc` 目录中找到的 `htaccess.txt`\
  \ 文件移动到网站的根目录（即文件 `config.php` 所在的同一目录）。\n\n7. 将移动的文件重命名为 `.htaccess`（开头的句点属于新文件名！）。\n\
  \n8. 在浏览器中查看你的网站，点击顶部导航区域以查看每个页面的新地址。\n\n\n\n\n\n## 刚才发生了什么？\n\n我不打算用技术细节来烦扰你（如果你想了解更多，请阅读`mod_rewrite`模块）。现在你的网站上已经有了一些漂亮、简洁的URL。\n\
  \n如果你收到了内部服务器错误，请考虑以下已知问题：\n\n- 你的托管公司不支持`mod_rewrite`（如果不确定，请咨询你的托管服务提供商）。\n- 你将CMS\
  \ Made Simple安装到了子目录中；例如，`http://yourdomain.com/mycms`。在这种情况下，你需要编辑`.htaccess`文件并替换该行。\n\
  \n    `RewriteBase /`\n\n    替换为\n\n    `RewriteBase /mycms`\n\n    将斜杠后的名称改为你的子目录名称。\n\
  \n## 从层级结构中获得更多成功\n\n启用搜索引擎友好URL还有另一个有用的效果。现在页面的URL包含页面的完整路径，包括父页面，而不仅仅是页面别名。\n\n\
  假设你创建了页面Philips TV（页面别名为philips），并选择了页面Plasma TV（页面别名为plasma-tv）作为它的父页面。如果不重写该页面的URL，Philips\
  \ TV将获得以下地址：\n\n```\nhttp://yourdomain.com/index.php?page=philips\n```\n\n重写URL后，我们得到：\n\
  \n```\nhttp://yourdomain.com/plasma-tv/philips\n```\n\n第二个版本更简洁，对访客来说看起来更好，容易记下或记住，而且对搜索引擎更友好，因为你的URL中包含了更多关键词。\n\
  \n请记住，页面别名必须是唯一的。例如，你不能拥有这样的结构：\n\n```\nyourdomain.com/products/tv\n```\n\n```\n\
  yourdomain.com/news/products\n```\n\n别名*products*在整个网站上只能使用一次。\n\n- 4. 滚动到页面底部，点击**提交**按钮。\n\
  - 5. 使用管理控制台右上角的放大镜图标查看你的网站。\n\n对**站点地图**页面执行相同操作。\n\n## 刚才发生了什么？\n\n你已经取消了**在菜单中显示**的勾选，以将该页面从网站的主导航中隐藏。指向该页面的链接会从顶部菜单中消失。\n\
  \n然而，该页面并未被停用。如果你在浏览器的地址栏中输入该页面的完整地址，或者从网站的其他页面放置一个直接链接，你仍然可以查看它。通常，你会使用此功能来隐藏那些不够重要、无需显示在主导航中的页面。\n\
  \n另一个原因可能是某些页面只在特定情况下才需要显示。这种页面的一个例子可以是*感谢您！*页面，当访客通过网站上的联系表单向我们发送消息时，需要向访客显示该页面。这种情况下我们称之为服务页面，稍后我们将学习如何在你的网站上使用它们。\n\
  \n在**选项**选项卡中，你可能注意到了另一个可以取消勾选的字段：**启用**。停用页面会使其对网站访客不可用。即使提供了指向该页面的直接链接，访客也会看到一条错误消息，说明找不到该页面。\n\
  \n> 可以把未启用的页面看作是对访客来说不存在的页面。\n\n你可以使用此功能来禁用一个不再需要的页面。你可以删除这些页面并丢失其内容，或者直接停用它们，同时在网站的管理控制台中仍然能够看到它们的内容。在这种情况下，你是唯一能看到它的人。有些网站管理员会创建未激活的页面，作为未来内容的占位符。\n\
  \n## 你的起始页是哪个？\n\n当你的网站上线后，各个页面可以通过其链接访问。但如果只输入你网站的域名，会向访客显示哪个页面呢？\n\n在CMS Made\
  \ Simple中，我们称之为**默认页面**。你可以将任何页面定义为默认页面。在管理控制台中，打开**内容 | 页面**，并在当前页面列表中找到**默认**列。只有一页在该列中有绿色勾号，以这种方式标记的页面就是你网站的起始页。你可以通过点击该列中的红色叉号来选择另一个页面作为默认页面。在更改默认页面之前，你必须确认问题**您确定要将（页面名称）设置为站点默认页面吗？**\
  \ 可以看到绿色勾号如何从先前的默认页面移到新页面。先前的页面会自动在该列中显示红色叉号。逻辑上，你的网站只能有一个起始页。\n\n## 通过内容类型获得更多导航控制\n\
  \n通过不同的内容类型，你可以实现对导航的更多控制。你一定注意到了创建或编辑页面屏幕上的**内容类型**字段。该字段的标准选项是**内容**，用于创建普通的内容页面。在大多数情况下，你都会使用这种类型。\n\
  \n使用不同的内容类型（参考下表），你可以向导航中添加链接，并获得与普通页面不同的行为。\n\n| 内容类型 | 描述 |\n|---|---|\n| **内部页面链接**\
  \ | 使用此内容类型在导航中创建指向特定页面的链接，该页面实际上位于层次结构的另一层。此内容类型仅生成一个指向你在**目标页面**字段中选择的特定页面的链接。\
  \ |\n| **分隔符** | 使用此内容类型在内部将不同的导航部分彼此分隔开来。此内容类型主要用于创建复杂的导航结构或复杂的导航设计。 |\n| **外部链接**\
  \ | 正如内容类型名称所示，使用此内容类型向导航添加外部链接。在内容类型的**URL**字段中输入以`http://`开头的完整URL。 |\n| **错误页面**\
  \ | 此内容类型与导航无关。它将在第5章*使用核心模块*中详细解释。 |\n| **部分标题** | 使用此内容类型，你可以在导航中创建一个标题。此内容类型本身不是链接。它只是\"\
  承载\"层次结构中位于其下方的其他页面。使用此内容类型可以清晰地将菜单结构划分为不同部分。 |\n| **内容** | 此内容类型用作你网站普通内容页面的标准类型。\
  \ |\n\n## 小测验 – 创建页面和导航\n\n- 1. 如何在CMS Made Simple中创建新页面？\n  a. **站点管理 | 页面默认设置\
  \ | 添加新页面。**\n  b. **布局 | 菜单管理器 | 添加新页面。**\n  c. **内容 | 页面 | 添加新内容。**\n- 2. 创建新页面时填写的标题在网站上的哪里显示？\n\
  \  a. 标题栏和菜单。\n  b. 标题栏和网站标题。\n  c. 菜单和子菜单。\n  d. 菜单和网站头部。\n- 3. 关于**应用**和**提交**按钮，哪些答案是正确的？\n\
  \  a. **提交**按钮一步保存更改并关闭页面。\n  b. **应用**按钮一步保存更改并关闭页面。\n  c. **提交**按钮不关闭页面，但会保存你所做的更改。\n\
  \  d. **提交**按钮不关闭页面，并在浏览器中预览更改。\n- 4. 如果更改页面别名，什么会受到影响？\n  a. 标题\n  b. 关键词\n  c.\
  \ 菜单\n  d. URL\n- 5. 你将适用于项目中所有页面的元标签放在哪里？\n  a. **内容 | 页面 | 页面标题 | 选项。**\n  b.\
  \ 在样式表的常规元标签部分。\n  c. **站点管理 | 全局设置 | 常规设置 | 全局元数据。**\n  d. **扩展 | 模块管理器 | GenMetaMod。**\n\
  \n## 创建页面和导航\n\n- 6. 为什么你应该使用搜索引擎友好地址？\n  a. 如果没有搜索引擎友好URL（它们太长），打开超过七个页面会使计算机的RAM内存过载。\n\
  \  b. URL针对搜索引擎进行了优化。\n  c. 你根本不应该使用它们，因为你必须为每个搜索引擎创建一个特殊的URL，并创建一些重复内容。\n  d. 页面加载速度快得多。\n\
  \n- 7. 如果你想对访客隐藏一个页面，但又希望出于内部需求保留页面上的内容，你应该：\n  a. 删除该页面。\n  b. 停用该页面。\n  c. 指定另一个父页面。\n\
  \  d. 复制该页面并删除原始页面。\n\n- 8. 你的所有页面都是用英文写的。你会把语言的元标签放在哪里？\n  a. 在全局设置中。\n  b. 在每个单独的页面中。\n\
  \n- 9. 你的一个页面已被另一个网站链接。如果更改页面别名会怎样？\n  a. 旧链接将自动重定向到新的页面别名。\n  b. 点击链接后会出现一条错误消息，提示找不到该页面。\n\
  \n# 大显身手 – 为公司网站创建所有页面\n\n在进入下一章（讲解设计和布局）之前，请创建你的网站所需的所有页面。你不需要为每个页面编写完整文本。下一部分将只是关于准备网站的结构。\n\
  \n\n\n\n\n使用你自己的网站规划或示例规划：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_76_0.png)\n\
  \n## 创建页面和导航\n\n首先添加你在层级结构中第一层的页面（在上图中用粗体标记）。然后添加第二层的页面（用灰色标记）。你可以调整页面别名和菜单文本。\n\
  \n为页面添加一些示例文本，或写下每个页面将包含的内容。如果你有一些不错的想法，但不应该从一开始就发布在网站上，那么可以创建一些保存这些想法的非活动页面。\n\n\
  开始时不要创建超过两层。即使可以创建大量层级，你的访客如果不必点击 5 或 6 次才能到达所需信息，网站的导航会更友好。最好从两层导航开始，以便在下一章简化布局和设计的学习。\n\
  \n上面展示的网站结构的结果如下：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_76_1.png)\n\n请注意，**Start**\
  \ 页面已被重命名为 **Our Company**。\n\n## 总结\n\n在本章中，你学习了页面如何轻松创建和管理。你看到网站的导航是从现有页面自动构建的。\n\
  \n具体来说，我们涵盖了以下内容：\n\n- **创建页面：** 你可以从头创建新页面，或作为现有页面的副本。\n- **编辑页面：** 页面创建后，你可以更改页面上的所有内容，例如标题、内容、菜单文本或页面别名。\n\
  - **添加元标签：** 如果每个页面都相同，元标签可以全局定义。对于每个特定页面的单独元标签，你在 **Options** 选项卡中使用字段 **Page Specific\
  \ Metadata**。\n- **页面层级：** 页面可以按树形层级组织。它有助于保持页面结构化，并直观地控制网站的顶级和子导航。\n- **搜索引擎友好的\
  \ URL：** 你修改了页面的 URL。它为你提供了干净美观的 URL，对访客也很明显。\n- **导航控制：** 页面会自动显示在导航中。你可以通过将页面从导航中隐藏来控制此行为（它们仍可通过直接链接由访客访问）。你也可以将页面设为非活动状态，这样只有你作为网站管理员才能看到链接的内容。\n\
  \n我们还讨论了如何创建或更改网站的起始页面，通过使用不同的内容类型获得更多控制，或一次性更改多个页面以节省时间。\n\n现在我们已经创建了网站结构，我们准备开始设计和布局我们的公司网站。\n"
- "## 4 设计和布局\n\n在本章中，我们将学习模板是什么。CMS Made Simple 的设计优势在于其灵活性。一旦你理解了如何将静态 HTML 与网站的动态部分结合并用\
  \ CSS 格式化，你将永远不会在 CMS 中失去对设计或布局的控制。\n\n在本章中，我们将：\n\n- 使用现有模板\n- 从头创建自己的模板\n- 添加和组织样式表\n\
  - 创建和格式化导航\n- 将 HTML 模板移植到 CMS Made Simple\n- 学习 Smarty 的基础知识\n- 学习导出模板\n\nCMS Made\
  \ Simple 使用各种模板来显示网站的内容。要理解模板，请将其视为预定义的布局。每次创建新页面时，你都会选择一个布局来定义此页面应如何显示。\n\n你可以轻松地将模板想象为内容的包装器。包装器（布局）始终相同；内容从页面到页面发生变化。网站编辑只需向页面添加内容并选择模板。CMS\
  \ Made Simple 会自动在所选布局内向访客显示页面内容。因此，在 CMS 中，设计和内容完全分离。\n\n### 使用现有模板\n\n你可以在 CMS\
  \ 管理控制台中找到所有现有模板。点击 **Layout | Templates** 查看安装中所有可用的模板。如果你没有安装任何示例内容，则只有一个模板可用。\n\
  \n严格来说，我们必须区分模板和主题。模板只是主题的一部分。主题由一个或多个模板和一个或多个样式表组成。一些主题还可选地包含菜单模板。因此，如果你谈论网站的完整设计，你应该考虑主题。CMS\
  \ Made Simple 中同一主题内的不同页面布局（1 列、2 列或其他）称为模板。\n\n你可以通过使用主题资源在没有任何 HTML 或 CSS 知识的情况下轻松将即用型模板添加到网站：\n\
  \n- http://themes.cmsmadesimple.org\n- http://www.icms.info/cmsms-templates\n\n\
  ### 动手时间 – 导入现成模板\n\n让我们看看如何将现成模板导入你的安装。\n\n1. 从上面给出的地址之一下载模板的 XML 文件并将其保存到本地磁盘。\n\
  2. 在管理控制台中，点击 **Layout | Theme Manager**。\n3. 切换到 **Import** 选项卡，并在字段 **Upload Theme**\
  \ 中选择步骤 1 中的 XML 文件。\n4. 点击 **Import**。\n5. 转到 **Layout | Templates** 并在模板列表中找到新导入的模板。\n\
  6. 点击 **Active** 列中带红叉的图标（图标应变为绿色勾号）。\n\n### 刚才发生了什么？\n\n你已将新主题导入到你的 CMS Made Simple\
  \ 安装中。主题包含一个或多个模板（**Layout | Templates**）、一个或多个样式表（**Layout | Stylesheets**）以及有时还有菜单模板（**Layout\
  \ | Menu Manager**）。\n\n要测试模板，打开你希望在新模板中查看的页面进行编辑（**Content | Pages**）。切换到 **Options**\
  \ 选项卡，并在字段 **Template** 中选择新创建的模板。屏幕会自动重定向到 **Main** 选项卡。点击 **Apply**，然后点击 **Apply**\
  \ 按钮旁边的放大镜图标以查看页面上的更改。将此页面与其他使用不同模板的页面进行比较。\n\nCMS Made Simple 的这一奇妙原则允许你为每个页面提供自己的外观和感觉。你可以使用不同的模板来分隔网站的某些部分。例如，如果你喜欢，可以为公司网站使用一个模板，为商店使用完全不同的模板。设计师经常使用不同的模板来在不同页面上启用一列、两列或三列布局。\n\
  \n要查看哪个页面使用哪个模板，请在管理控制台中打开当前页面的列表（**Content | Pages**）并查看 **Template** 列。\n\n如果你希望在网站的所有页面上使用一个模板，你可以一次将其分配给所有页面。此功能在你已有大量页面时尤其有用。在管理控制台中，打开现有模板列表（**Layout\
  \ | Templates**）并点击模板名称旁边的 **Set All Pages** 链接。这样，模板只需一次点击即可分配给网站的所有页面。\n\n在模板列表中，你还可以看到其中一个模板被设为默认。当你创建新页面时，CMS\
  \ Made Simple 会自动为新页面采用默认模板。点击 **Default** 列中带红叉的图标，旁边是你要用作标准模板的模板名称。\n\n### 创建新模板\n\
  \n当然，使用现成模板为网站更容易。然而，你通常需要网站自己的风格。在本节中，我们将学习如何从头创建新模板。\n\nCMS Made Simple 中的模板包含纯\
  \ HTML。对于动态布局部分，例如导航或内容，使用特殊占位符。这些占位符通过 **Smarty** 网页模板系统实现。你在模板中使用简单的 **Smarty\
  \ 标签** 来标记需要动态部分的位置。Smarty 标签是占位符，在网站在浏览器中显示时会被简单的文本甚至其他 HTML 模板替换。与 HTML 标签不同，Smarty\
  \ 标签始终用花括号括起来。\n\n\n\n\n\n## 设计与布局\n\n## 动手实践 – 创建新模板\n\n让我们来看看如何轻松地在 CMS Made Simple\
  \ 中创建一个新的 HTML 模板：\n\n- 1. 在网站的管理控制台中，选择**布局 | 模板**。\n- 2. 单击列表底部的**添加新模板**。\n-\
  \ 3. 在下一页中，输入新模板的名称：**我的第一个模板**。\n- 4. 将 HTML 源代码添加到**内容**字段中，如以下截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_81_0.png)\n\
  \n- 5. 单击**提交**。\n- 6. 在模板列表中找到你的新模板**我的第一个模板**，在模板名称所在行单击**设为所有页面**，并确认该消息：\n\n\
  ![](img/b21e3dc5c94405bc7b3f102758ea770c_81_1.png)\n\n- 7. 模板列表上方会出现消息**所有页面已修改！**。\n\
  - 8. 单击管理控制台右上角的放大镜图标以查看结果（本示例使用 Google Chrome 作为 Web 浏览器）：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_82_0.png)\n\
  \n## 刚刚发生了什么？\n\n你已经用一些简单的 HTML 标签创建了一个新模板。然后你指示 CMS 在你网站的所有页面中使用这个新模板。在浏览器中，你会看到你添加到模板**内容**字段中的\
  \ HTML 代码的准确输出。\n\n你的模板现在是静态的。这意味着页面的任何单独部分（如页面标题或内容）都不会在网站上显示。要标记应显示动态内容的位置，你必须使用\
  \ **Smarty 标签**。当页面在浏览器中加载并显示时，这些标签将被实际的标题或内容替换。\n\n## 向模板添加动态部分\n\n让我们用页面的单独内容替换静态页面标题和内容。\n\
  \n## 动手实践 – 向模板添加 Smarty 标签\n\n- 1. 在管理控制台中，单击“布局 | 模板”，然后点击“我的第一个模板”以打开它进行编辑。\n\
  - 2. 用 Smarty 标签替换标题和内容的静态文本，如以下截图所示：\n- 3. 单击**应用**，然后点击管理控制台右上角的放大镜图标以查看更改结果。结果应如以下截图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_83_0.png)\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_83_1.png)\n\
  \n## 刚刚发生了什么？\n\n你已经将模板中的静态文本替换为称为 Smarty 标签的占位符。这些特殊标签用花括号括起来。当你在浏览器中查看页面时，你在 HTML\
  \ 代码中添加 Smarty 标签的位置现在会被实际内容和页面标题所替换。\n\n要确认更改是对每个页面（而不仅仅是起始页面）生效的，请在管理控制台中打开当前页面列表（**内容\
  \ | 页面**），并单击某些页面旁边的放大镜图标以在浏览器中显示它们。你应该会看到每个页面都有一个独立的标题。页面内容显示在模板中添加 `{content}`\
  \ 标签的位置。\n\n`{title}` 和 `{content}` 只是你可以在模板中使用的自定义 CMS Smarty 插件的两个示例。请尝试使用下表中的一些插件，看看在添加这些\
  \ Smarty 标签的位置会显示什么。\n\n| 标签 | 描述 |\n|---|---|\n| `{breadcrumbs}` | 打印面包屑导航。 |\n\
  | `{created_date}` | 打印页面创建的日期和时间。 |\n| `{last_modified_by}` | 打印最后编辑该页面的用户的 ID。\
  \ |\n| `{menu_text}` | 打印页面**菜单文本**字段中输入的内容。 |\n| `{modified_date}` | 打印页面上次修改的日期和时间。\
  \ |\n\n要尝试这些插件，只需将插件名称放在花括号中，添加到网站模板的任意位置即可。\n\n上述标签保存了当前页面的不同信息。还有一些标签保存你网站的全局信息，例如网站名称或已安装的\
  \ CMS Made Simple 版本。它们不依赖于显示它们的页面，并且在每个页面上都相同。也请尝试这些标签，看看在添加标签的位置会显示什么信息。\n\n|\
  \ 标签 | 描述 |\n|---|---|\n| `{cms_version}` | 打印你的 CMS 的当前版本号。 |\n| `{cms_versionname}`\
  \ | 打印你的 CMS 的当前版本名称。 |\n| `{current_date}` | 打印当前日期和时间。 |\n| `{root_url}` | 打印你网站的\
  \ URL 位置。 |\n| `{sitename}` | 打印网站名称。该信息可以在管理控制台（**站点管理 | 全局设置 | 站点名称**）中更改。 |\n\
  \n通过 Smarty 标签，你可以看到代码与设计分离的主要原理。作为设计者，你无需知道页面上次修改的日期是如何存储在数据库中的（`{modified_date}`），也无需知道网站的位置是如何从浏览器地址栏中获取的（`{root_url}`）。你只需使用上面声明的插件即可获取所需信息。\n\
  \n## 控制输出\n\n如果你已经尝试过前面的一些标签，那么你可能会注意到有时输出并不完全符合你的需要。你可以使用 **Smarty 参数**（也称为属性）来控制标签的输出。\n\
  \n参数可以与 HTML 属性相类比。你可以使用参数来细化 Smarty 标签的输出。参数可用于：\n\n- - 更改标签显示的日期格式\n- - 向标签输出添加补充部分\n\
  - - 从输出中移除某些部分\n- - 替换标签输出中的特定文本\n\n## 动手实践 – 向模板添加 Smarty 参数\n\n假设你已经在模板中添加了 `{last_modified_by}`\
  \ 标签。但是，你不喜欢显示用户 ID，而希望显示用户名或他的全名，而不是用户 ID。\n\n- 1. 在管理控制台中，选择要编辑的模板（**布局 | 模板 |\
  \ 我的第一个模板**）。\n- 2. 添加带 format 参数的 `{last_modified_by}` 标签，如以下截图所示：\n- 3. 单击**应用**，然后点击管理控制台右上角的放大镜图标以查看模板更改的结果。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_85_0.png)\n\n## 刚刚发生了什么？\n\n你已在模板中添加了\
  \ `{last_modified_by}` 标签，以显示对页面上次修改的用户的名称。通常，如果不额外指定，添加该标签的位置会显示用户 ID。通过向标签添加 `format`\
  \ 参数，你现在可以控制具体显示什么内容。\n\n由于 CMS Made Simple 中的模板由 HTML 和 Smarty 混合组成，你需要理解标签、插件、参数和参数值的定义。我们在示例中使用的标签是\
  \ **Smarty 插件**。Smarty 插件是为方便你而定义的自定义函数。几乎每个插件都可以接受参数（有时也称为属性）。你将参数附加到插件名称后，用空格分隔。参数名后跟等号，参数值用双引号或单引号括起来。请参见下图了解\
  \ Smarty 标签的结构：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_86_0.png)\n\n那么，你怎么知道哪些参数可以用于哪些插件，以及允许哪些参数值呢？你可以在网站的管理控制台中找到自定义\
  \ CMS 插件的完整列表。这些插件在 CMS Made Simple 中被称为标签。单击**扩展 | 标签**即可查看当前可以在模板中使用的插件的完整列表。\n\
  \n如果你单击标签的名称，将获得相关帮助。你会看到该标签一般做什么的简短描述，然后看到如何在模板中使用它的示例。你还会看到可用参数（如果有）的列表以及可以用于这些参数的值。\n\
  \n与 HTML 属性类似，你可以在一个标签中使用多个参数。参数的顺序并不重要。\n\n对于 `{last_modified_by}` 标签，**帮助**部分只列出了一个参数。该参数接受三个值——`id`、`username`\
  \ 和 `fullname`，因此你可以使用另一个参数值来显示最后编辑页面的人的全名：\n\n```\n{last_modified_by format=\"\
  fullname\"}\n```\n\n\n\n\n\n## 设计与布局\n\n> 如果在用户账户中提供了全名，则会显示用户的全名。在管理控制台中，打开 **Users\
  \ & Groups | Users** 并点击您想要修改的用户名。输入用户的 **First Name** 和 **Last Name**。\n\n### 在内容中使用插件\n\
  \n在上一节中，您已将 Smarty 插件添加到模板中。然而，您也可以直接将它们添加到页面的内容中。您在内容中使用标签的方式与在模板中使用的方式相同。在特定页面的\
  \ **Content** 字段中，用花括号括起插件名称进行书写。现在就试试吧。打开任意页面进行编辑（**Content | Pages**）并在 **Content**\
  \ 字段中添加一个或多个标签。您可以像在模板中那样在同一位置混合使用标签和静态文本。\n\n网站首页的一个小示例可以是：\n\n```\nWelcome! Today\
  \ is {current_date}.\n```\n\n上述代码将自动在网站首页显示当前日期。\n\n> 您应该将需要在网站每个页面上显示的插件添加到模板中。如果您只需要在一个页面上使用特殊插件（例如首页），则应将该插件添加到该页面的\
  \ **Content** 字段中。\n\n### 向模板添加样式表\n\n如今，设计网站不仅需要纯 HTML，还需要 CSS。最专业的网站使用 HTML 来构建网站结构，使用\
  \ CSS 来美化它们。CSS 赋予您对布局的完全控制权。借助 CSS，您可以在不更改任何 HTML 的情况下轻松更改网站的外观和感觉。您可以在 `http://www.csszengarden.com`\
  \ 看到基于相同 HTML 的一些优秀 CSS 布局示例。\n\nCMS Made Simple 将用于页面布局的纯 CSS 代码保存在数据库中。在本节中，您将学习如何创建新的样式表，向其中添加样式并将其附加到模板。\n\
  \n### 创建新的样式表\n\n要创建新的样式表，您需要完成三个简单的步骤：\n\n- 1. 创建并保存包含 CSS 代码的新样式表。\n- 2. 将样式表附加到模板。\n\
  - 3. 在模板中添加一个特殊标签，该标签将被替换为指向样式表的 HTML `<link>` 标签。\n\n#### Time for action — creating\
  \ the stylesheet\n\n通常，在静态 HTML 页面中，您会创建一个 CSS 文件并使用 HTML `<link>` 标签将其附加到模板。在 CMS\
  \ Made Simple 中，样式表保存在数据库中，因此无法直接链接。让我们看看样式表如何创建并附加到模板。\n\n- 1. 在管理控制台中，点击 **Layout\
  \ | Stylesheets**。\n- 2. 点击列表底部的 **Add a Stylesheet** 链接。\n- 3. 输入新样式表的名称，并在 **Content**\
  \ 字段中输入 CSS 代码，如以下屏幕截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_88_0.png)\n\
  \n- 4. 点击 **Submit**。新样式表将被添加到样式表列表中。\n- 5. 要将新样式表附加到模板，请在管理控制台中点击 **Layout | Templates**。\n\
  - 10. 点击 **Apply**，然后点击管理控制台右上角的放大镜图标以查看模板更改的结果。它应如下图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_90_0.png)\n\
  \n#### What just happened?\n\n您已创建了一个包含纯 CSS 代码的新样式表。然后，您已将此样式表附加到模板。通过附加样式表，您已指定哪个样式表与您的模板相关。您添加到模板中的\
  \ `{stylesheet}` 标签在页面在浏览器中显示时会被 HTML `<link>` 标签替换。\n\n在浏览器中打开页面源代码，查看 `{stylesheet}`\
  \ 标签添加到模板的位置设置了什么。在我的示例中，它看起来像：\n\n```\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"http://www.yourdomain.com/stylesheet.php?cssid=51\" />\n```\n\n在您的特定安装中，域名称会不同，样式表\
  \ URL 中的最后一个数字也可能不同。该标签是自动生成的，您无需关心其技术实现方式。\n\n您可以为模板定义并附加多个样式表。例如，您可以定义一个包含通用样式的样式表，然后再添加一个包含打印样式的样式表。我们将在本书的后续部分创建并添加更多样式表，以便您稍后了解其工作原理。对于每个样式表，在\
  \ `{stylesheet}` 标签添加的位置都会添加一个单独的 HTML 链接标签。如果您附加了多个样式表，无需多次添加该标签，因为此插件会根据附加到模板的样式表数量创建相应数量的链接。\n\
  \n### 样式表的媒体类型\n\n在创建样式表时，您可能已经看到页面底部样式表代码添加区域中的 **Media Type** 区域，其中包含一些复选框。您可以在管理控制台中打开样式表进行编辑（**Layout\
  \ | Stylesheets**）并向下滚动时看到该区域。它如下图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_91_0.png)\n\
  \n媒体类型对应于 HTML 属性 `media`，如果在此处选择任何类型，则会自动添加到 HTML `<link>` 标签中：\n\n```\n<link rel=\"\
  stylesheet\" type=\"text/css\" media=\"screen\" href=\"http://www.yourdomain.com/stylesheet.php?cssid=51\"\
  \ />\n<link rel=\"stylesheet\" type=\"text/css\" media=\"print\" href=\"http://www.yourdomain.com/stylesheet.php?cssid=52\"\
  \ />\n```\n\n第一个样式表的样式用于在浏览器中显示您的网站。然而，如果打印页面，浏览器将使用打印样式表：\n\n> 如果您使用包含多个 CSS 文件的任何\
  \ CSS 框架，则可以将每个 CSS 文件的内容复制到 CMS Made Simple 中的单独样式表中，然后将它们全部附加到模板。您也可以在将样式表分配给模板时更改样式表的顺序。\n\
  \n### 为网站创建导航\n\n每个网站的核心无疑是导航。导航由指向页面的链接组成，通常分为主导航和侧边栏导航。在 CMS Made Simple 中，导航是从活动页面列表自动构建的。由于以下各节中解释的非常强大的概念，您可以在\
  \ CMS Made Simple 中创建任何复杂程度的导航。\n\n#### Time for action – adding navigation to the\
  \ template\n\n让我们向网站添加导航链接。\n\n- 1. 在管理控制台中，点击 **Layout | Templates**，并选择 **My first\
  \ template** 进行编辑。\n- 2. 在 `{content}` 标签之前添加导航的特殊标签，如以下屏幕截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_92_0.png)\n\
  \n- 3. 点击 **Apply**，然后点击管理控制台右上角的放大镜图标以查看模板更改的结果。它应如下图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_92_1.png)\n\
  \n#### What just happened?\n\n使用自定义 CMS 标签 `{menu}`，网站的完整结构将在模板中添加的位置显示。每个活动页面都根据其在层级中的位置和页面列表中的顺序显示。\n\
  \n`{menu}` 标签功能非常强大。您可以使用大量参数来创建任何复杂程度的导航。例如，您可以将导航限制为仅一级，以便仅显示第一层级层级的页面：\n\n```\n\
  {menu number_of_levels=\"1\"}\n```\n\n尝试上述代码以创建仅限于主页的导航。这是创建网站主导航的常见方式；通常放置在每个页面的顶部。使用此参数不会显示子页面，但我们稍后可以在侧边栏导航中显示它们。\n\
  \n我们将在后面学习 `{menu}` 标签的更多参数，并查看更多自定义示例。在本章中，我们的主要主题是设计和布局。因此，我们现在将学习如何自定义顶部导航的外观和感觉。\n\
  \n### 设计导航 — 纯 CSS 的方式\n\n使用简单的插件 `{menu}`，网站的导航会在每个页面上显示。CMS Made Simple 为导航创建简单的无序\
  \ HTML 列表，如您在页面源代码中看到的那样。让我们看看如何使用纯 CSS 轻松设置顶部导航栏的样式。\n\n#### Time for action –\
  \ design navigation with pure CSS\n\n我们现在将设置顶部导航的样式，使其看起来像并排显示的按钮，而不是上下显示。\n\n-\
  \ 1. 在管理控制台中，点击 **Layout | Templates**，并打开 **My first template** 进行编辑。\n- 2. 在 `{menu\
  \ number_of_levels=\"1\"}` 标签周围添加 HTML `<div>` 标签，如以下屏幕截图所示：\n\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_94_0.png)\n\
  \n- 3. 点击**提交**。\n- 4. 从样式表列表（**布局 | 样式表**）中打开**我的第一个样式表**进行编辑。\n- 5. 在样式表末尾为容器`top-navi`添加样式格式，如下面的代码片段所示：\n\
  \n```\n#top-navi ul\n{\n    height: 22px;\n    padding: 0px;\n    margin: 10px 0;\n\
  \    border-top: 1px solid #e5e4e2;\n    border-bottom: 1px solid #e5e4e2;\n}\n\
  #top-navi li\n{\n    list-style: none;\n    float:left;\n}\n#top-navi li a\n{\n\
  \    color: #a2a2a2;\n    text-decoration: none;\n    display: block;\n    padding:\
  \ 5px 15px;\n}\n```\n\n```\n#top-navi li a:hover\n{\n    color: #ffffff;\n    background:\
  \ #3d648a;\n}\n```\n\n6. 点击**应用**，然后点击管理控制台右上角的放大镜图标，查看更改的结果。现在应该看起来如下面的截图所示：\n\n\
  ![](img/b21e3dc5c94405bc7b3f102758ea770c_95_0.png)\n\n## 刚才发生了什么？\n\n你通过向`{menu}`标签添加`number_of_levels`参数，将导航的输出范围限制为第一级。然后，你在Smarty插件`{menu}`周围放置了一个HTML\
  \ `<div>`标签。在最后一步，你添加了一些CSS样式，使顶部导航具有所需的外观和感觉。请注意，为导航添加样式并不需要任何特殊的“CMS设计”知识，你使用的是纯的、通用的CSS来格式化导航。\n\
  \n如果你在浏览器中逐个点击页面，并查看其他页面上导航的显示方式，你会注意到CMS使用了一些额外的格式来显示活动页面。例如，`<h3>`用于在导航中显示活动页面的名称。在浏览器中打开页面源代码，即可查看活动页面的格式。你可以添加更多样式来更改`<h3>`标签的格式。另一方面，为了节省时间，你可以使用内置模板`minimal_menu.tpl`，将这些特殊格式全部缩减为纯列表。该模板随CMS\
  \ Made Simple的标准安装自动提供。要使用它，只需向`{menu}`标签添加另一个参数，如下面的代码行所示：\n\n```\n{menu number_of_levels=\"\
  1\" template=\"minimal_menu.tpl\"}\n```\n\n这样，所有额外的标签都会从导航中删除，每个页面都会显示一个清晰的无序列表。\n\
  \n如果你查看网站的页面源代码，会发现菜单中还添加了一些特殊的class属性。CMS知道当前实际显示的是哪个页面，并会为活动页面的HTML标签`<a>`添加一个特殊的类：\n\
  \n```\n```html\n<li><a href=\"http://www.yourdomain.com/\" class=\"currentpage\"\
  > Our Company </a>\n```\n```\n\n你可以利用这一信息，为当前显示页面的导航项设置另一种样式。最简单的方法是组合`a:hover`和`a.currentpage`类，使它们具有相同的样式。\n\
  \n```\n```css\n#top-navi li a:hover, #top-navi li a.currentpage\n{\n    color: #ffffff;\n\
  \    background: #3d648a;\n}\n```\n```\n\n如果你能用CSS设计网站，那么现在你就可以在不需要任何特殊编码知识的情况下，设计网站的简单导航。\n\
  \n## 添加侧边栏导航\n\n然而，这只是完成了一半。顶部导航中显示的页面仅限于第一级。我们需要一些侧边栏导航来显示属于父页面的子页面列表。\n\n我们必须讨论插件`{menu}`的另一个重要参数。通过`number_of_levels`参数，你可以设置页面层次结构中显示多少层。对于侧边栏导航，你不需要限制层数，而是需要定义导航的起始层。由于第一层已经添加到顶部导航中，因此在侧边栏中，你应该从第二层开始：\n\
  \n```\n```text\n{menu start_level=\"2\" template=\"minimal_menu.tpl\" }\n```\n```\n\
  \n使用`start_level`参数，你可以指定菜单中从哪一层开始显示页面。第二层意味着显示层次结构中至少包含两个数字的页面，例如1.2、2.3或4.2。CMS\
  \ Made Simple还知道顶部导航中选择了哪个页面，并只在侧边栏中显示该所选页面的子页面。这意味着，如果在顶部导航中选择了编号为3的页面，侧边栏将只包含该页面的子页面：3.1、3.2、3.3等。\n\
  \n使用`template`参数，你可以再次将导航输出简化为纯HTML无序列表，从而使此处的格式化更加容易。\n\n一个有趣且常用的参数是`collapse`，例如`{menu\
  \ collapse=\"1\"}`。该参数允许折叠菜单中的子项，因此只显示当前菜单项的子项。页面层次结构中至少需要有三层，才能看到自动折叠如何隐藏不属于当前显示页面的菜单项。\n\
  \n我们已经学习了模板最重要的部分：标题、内容和菜单。有了这些信息，就足以将现成的HTML模板移植到CMS Made Simple中。\n\n## 移植HTML模板\n\
  \n通常，你不会在CMS Made Simple中从头设计一个完整模板。你可以在CMS Made Simple之外使用任何HTML/CSS编辑器来创建设计。也有可能你下载或购买了现成的HTML模板，或者你与一位为你的网站创建设计的设计师合作。在上述所有情况下，你都会得到一个HTML文件、一个CSS文件和一个或多个图片。在本节中，我们将学习如何将HTML模板移植到CMS\
  \ Made Simple中。\n\n假设你得到了一个如下图所示的HTML模板。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_97_0.png)\n\
  \n该模板由三个文件组成：HTML、CSS和位于右上角的Logo图片。请注意，此时除了纯HTML和CSS外什么都没有。让我们根据上述模板创建一个新的CMS Made\
  \ Simple模板。\n\n## 动手实践——将HTML模板移植到CMS Made Simple\n\n- 1. 在管理控制台中，点击**布局 | 模板**，然后点击**添加新模板**。\n\
