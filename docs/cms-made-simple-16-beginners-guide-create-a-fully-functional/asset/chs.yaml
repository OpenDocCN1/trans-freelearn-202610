- '# 关于审阅者


  **Jeremy Bass** 12 岁时开始学习网站构建，使用的是 Yahoo 早期网站和已经停运的 GeoCities 等网站上的“查看源代码”功能。他拥有一台计算机和出色的美术天赋，此后一直从事计算机图形相关工作。他职业生涯中的一些亮点包括在国际望远镜项目（夏威夷的
  Gemini）中工作，以及凭借 3D 动画获得 Telly 奖。目前，Jeremy 在爱达荷州的 Digital Barn Productions 和费城的 Defined
  Clarity 工作，同时也从事自由职业，并参与 CMSMS 社区活动。


  > 我要感谢我的妻子 Aimee，感谢她理解我长时间工作不仅是为了成长，也是为了她和孩子们。这段经历很有趣。


  **Yury V. Zaytsev** 获得了俄罗斯下诺夫哥罗德国立大学的物理学高级学位，目前正在德国弗赖堡大学攻读计算神经科学博士学位。Yury 主要关注科学计算、建模和仿真，尤其是大规模神经元群体的复杂动态。


  Yury 6 岁时第一次接触计算机，当时他在一台具有历史意义的 80386 机器上使用 BASIC 编写了自己的第一个文本角色扮演游戏。这激发了他对编程永无止境的热情，也使他在
  17 岁时短暂从事自由网页开发，为俄罗斯、欧洲及海外的公司提供服务。


  在成功使用 CMS Made Simple 实施许多商业和个人项目后，Yury 很高兴能够为 CMSMS 的广泛采用贡献力量，使用户和开发者都能从中受益。

