- "## 前言\n\nCMS Made Simple 是一个开源内容管理系统，允许您在远少于常规的时间内快速开发网站，并通过提供模块和第三方插件避免数小时的编码工作。手握本书，您将能够轻松驾驭这个模块化、可扩展的内容管理系统的强大功能。\n\
  \n本指南基于实用且可行的解决方案，帮助您了解这个强大而简单的应用程序如何在日常工作中为您提供支持。工作坊帮助您为企业、社团和组织创建引人入胜、高效且易用的 CMS\
  \ 网站。\n\n这是一个循序渐进、案例驱动的教程，旨在帮助您使用 CMS Made Simple 构建一个完整的专业网站。您可以使用现成的模板，也可以实现自己的自定义设计；为网站丰富功能，例如相册、带\
  \ PayPal 结账的电子商务解决方案、任意复杂度的表单或流行的 jQuery 特效；最后通过搜索引擎优化进行收尾。书中提供的 HTML 和 CSS 代码片段均经过优化，可以轻松调整以适用于您自己的项目。随着一章一章地学习，您将分别扮演网页设计师、开发者、管理员和业务经理的角色，从而掌握构建易于管理的富网站所需的方方面面。\n\
  \n## 本书涵盖内容\n\n- *第1章，使用 CMS Made Simple 构建网站*：介绍案例研究网站及其功能需求。\n- *第2章，开始入门*：讲解如何安装\
  \ CMS Made Simple、其管理控制台的组织方式，以及如何配置 CMS Made Simple 以发送电子邮件。\n- *第3章，创建页面与导航*：重点讲解创建、编辑和组织页面，介绍页面层级和搜索引擎友好的\
  \ URL。学完本章，您将获得案例研究网站的完整页面结构。\n- *第4章，设计与布局*：讲解如何创建新模板，以及如何将现成的 HTML/CSS 设计移植到 CMS\
  \ Made Simple。学完本章，您将能够为网站实现个性化设计。\n- *第5章，使用核心模块*：涵盖 CMS Made Simple 的标准模块，如新闻、搜索、图像与文件管理器、打印（包括内置\
  \ PDF 输出），并向您展示如何安装额外模块（如 FAQ）。\n- *第6章，用户与权限*：讲解如何在管理控制台中组织不同用户的权限。\n- *第7章，使用第三方模块*：讲解如何实现具有个性化设计的相册、添加带自定义字段的联系表单、安装验证码功能、管理新闻通讯，以及在网站中嵌入\
  \ YouTube 视频。\n- *第8章，创建自己的功能*：介绍创建自己功能的两种方法。第一部分，您将学习如何使用模块生成器创建产品目录。第二部分，您将学习如何使用模块创建服务台功能。\n\
  - *第9章，电子商务工作坊*：通过逐步工作坊，让您了解如何使用电子商务套件实现带 PayPal 结账的电子商务商店。\n- *第10章，CMS Made Simple\
  \ 高级使用*：讲解如何创建多语言网站、进行搜索引擎优化，以及在网站导航中使用 jQuery 插件。集成访问者统计和一些高级技术可丰富案例研究网站的功能。\n\
  - *第11章，管理与故障排查*：讲解如何保持网站更新和安全，以及如何进行性能调优。在本章末尾，您将得到“如何在论坛中快速获得帮助？”这一问题的答案。\n- *附录，小测验答案*：包含本书中所有小测验的答案。\n\
  \n## 本书所需环境\n\nCMS Made Simple 是一个使用 MySQL 数据库的 PHP 应用程序。这意味着您需要一个支持 PHP 和 MySQL\
  \ 的网络托管服务来运行 CMS Made Simple。您可以在本地 PC 上安装 Web 服务器用于测试环境，和/或安装到远程主机上用于正式网站。CMS Made\
  \ Simple 的要求如下：\n\n- Linux/Unix 或 Windows 2000/XP/ME/2003 或 OS X 上的 Web 服务器\n- PHP\
  \ 5.2.x（不是 PHP 5.3）\n  - `safe_mode` 应关闭\n  - 至少 16 MB 的可用 PHP 内存\n\n\n\n\n\n- PHP\
  \ tokenizer support enabled\n- At least one of ImageMagick or GD library enabled\n\
  - MySQL 4.1+ or PostgreSQL 7+\n- Enough access to your server to upload files and\
  \ change some permissions\n\n## Who this book is for\n\nThis book is perfect for\
  \ newcomers as well as webmasters who are looking for an introduction to building\
  \ powerful and professional websites with a content management system. Basic knowledge\
  \ of HTML and CSS is the only requirement. The workshop covers all aspects of web\
  \ publishing and is aimed for web designers, web developers, editors, and web managers.\n\
  \n## Conventions\n\nIn this book, you will find several headings appearing frequently.\n\
  \nTo give clear instructions of how to complete a procedure or task, we use:\n\n\
  ### Time for action – heading\n\n1. Action 1\n2. Action 2\n3. Action 3\n\nInstructions\
  \ often need some extra explanation so that they make sense, so they are followed\
  \ with:\n\n### What just happened?\n\nThis heading explains the working of tasks\
  \ or instructions that you have just completed.\n\nYou will also find some other\
  \ learning aids in the book, including:\n\n### Pop quiz – heading\n\nThese are short\
  \ multiple-choice questions intended to help you test your own understanding.\n\n\
  ### Have a go hero – heading\n\nThese set practical challenges and give you ideas\
  \ for experimenting with what you have learned.\n\nYou will also find a number of\
  \ styles of text that distinguish between different kinds of information. Here are\
  \ some examples of these styles, and an explanation of their meaning.\n\nCode words\
  \ in text are shown as follows: \"Your root directory can be `public_html` (or `wwwroot`\
  \ or `htdocs`), please ask your provider if you are not sure where to upload the\
  \ files.\"\n\nA block of code is set as follows:\n\n```\n#top-navi ul\n{\n    height:\
  \ 22px;\n    padding: 0px;\n    margin: 10px 0;\n    border-top: 1px solid #e5e4e2;\n\
  \    border-bottom: 1px solid #e5e4e2;\n}\n```\n\nWhen we wish to draw your attention\
  \ to a particular part of a code block, the relevant lines or items are set in bold:\n\
  \n```\n{foreach from=$nodelist item=node}\n    <a href=\"{$node->url}\">\n     \
  \   <img src=\"uploads/design/{$node->alias}.jpg\" alt=\"{$node->menutext}\" border=\"\
  0\" />\n    </a>\n{/foreach}\n```\n\n**New terms** and **important words** are shown\
  \ in bold. Words that you see on the screen, in menus or dialog boxes for example,\
  \ appear in the text like this: \"Open **My First Style Sheet** from the list of\
  \ stylesheets (**Layout | Stylesheets**) for edit.\"\n\nWarnings or important notes\
  \ appear in a box like this.\n\nTips and tricks appear like this.\n\n## Reader feedback\n\
  \nFeedback from our readers is always welcome. Let us know what you think about\
  \ this book—what you liked or may have disliked. Reader feedback is important for\
  \ us to develop titles that you really get the most out of.\n\nTo send us general\
  \ feedback, simply send an e-mail to feedback@packtpub.com, and mention the book\
  \ title via the subject of your message.\n\nIf there is a book that you need and\
  \ would like to see us publish, please send us a note in the SUGGEST A TITLE form\
  \ on www.packtpub.com or e-mail suggest@packtpub.com. If there is a topic that you\
  \ have expertise in and you are interested in either writing or contributing to\
  \ a book on, see our author guide on www.packtpub.com/authors.\n\n## Customer support\n\
  \nNow that you are the proud owner of a Packt book, we have a number of things to\
  \ help you to get the most from your purchase.\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_18_0.png)\n\
  \n### Downloading the example code for the book\n\nVisit http://www.packtpub.com/files/code/8204_Code.zip\
  \ to directly download the example code. The downloadable files contain instructions\
  \ on how to use them.\n\nIn this book, you may occasionally come across a single\
  \ line of code appearing on two different lines. Please note that this has been\
