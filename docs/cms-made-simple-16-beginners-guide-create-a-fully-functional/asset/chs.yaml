  ```\n\n+   8. 点击 **Submit**。\n+   \n+   9. 在样式表列表 (**Layout | Stylesheets**) 中，点击新样式表所在行中的蓝色\
  \ CSS 图标。\n+   \n+   10. 从下拉字段中选择模板 **Business World**，并点击 **Attach to this Template**。\n\
  +   \n+   11. 点击 **Business World** 打开模板进行编辑，并将样式表的静态链接替换为如下所示的 Smarty 占位符：\n\n\
  ```\n<!DOCTYPE html>\n<html>\n    <head>\n```\n\n现在，你可以开始用 Smarty 标签替换模板中的静态文本。查找并替换\
  \ HTML 中的标题、内容和菜单。在管理控制台中打开你的模板并进行以下更改：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
  <title>{title} - {sitename}</title>\n{stylesheet}\n{metadata}\n<meta name=\"description\"\
  \ content=\"\" />\n</head>\n<body>\n<div id=\"container\">\n<div id=\"header\">\n\
  businessWorld\n</div>\n<div id=\"top-navi\">\n{menu number_of_levels=\"1\" template=\"\
  minimal_menu.tpl\"}\n</div>\n<div id=\"content\">\n<h1>{title}</h1>\n{content}\n\
  </div>\n<div id=\"sidebar\">\n{menu start_level=\"2\" template=\"minimal_menu.tpl\"\
  }\n</div>\n<div id=\"footer\">\n2009 businessWorld\n</div>\n</div>\n</body>\n</html>\n\
  ```\n\n在 Smarty {stylesheet} 插件下方，你可以添加 {metadata} 插件。此插件将添加全局元数据（Site Admin | Global\
  \ Settings）和来自页面选项标签的页面特定元数据。它还将设置 HTML <base> 标签，其 href 属性指向安装的根目录。这样，所有图像都可以相对于根文件夹定义。\n\
  \n恭喜！你的模板现在已移植到 CMS Made Simple。\n\n# 设计与布局\n\n**3.** 点击 **Apply**，然后点击管理控制台右上角的放大镜图标查看结果。它现在应该看起来像以下截图：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_105_0.png)\n\n# 发生了什么？\n\n使用 Smarty `{get_template_vars}`\
  \ 插件，你显示了模板中可用的所有 **Smarty 变量**。在每行变量列表中，一个变量以其名称和值显示，两者由等号分隔。这些值会随页面而变化。例如，名为 `friendly_position`\
  \ 的变量包含页面在页面层级中的位置。如果你导航到其他页面，你会看到此变量的值在每个页面上都不同。\n\n如何在模板中添加变量？Smarty 变量也用花括号括起来，但与\
  \ Smarty 插件不同，它们开头有一个美元符号。要使用变量 `friendly_position`，你只需在模板中添加以下 Smarty 标签：\n\n```\n\
  ```smarty\n{$friendly_position}\n```\n```\n\n现在可以删除 `{get_template_vars}` 插件了。它有助于你查看存在哪些\
  \ Smarty 变量以及存储了什么值。当你需要查找另一个变量时，可以再次添加此插件。\n\n让我们利用我们对 Smarty 插件和 Smarty 变量的了解，将它们结合起来创建页面的标题。打开模板\
  \ **Business World (Layout | Templates)** 进行编辑，并在 body 标签之间、{content} 标签之前更改页面的标题，如下所示：\n\
  \n```\n<h1><span>{$friendly_position}</span> {title}</h1>\n```\n\n然后打开 **Business\
  \ World Style Sheet** 进行编辑 (**Layout | Stylesheets**)，并添加 CSS 样式来格式化页面的标题：\n\n```\n\
  h1 span\n{\n    color: #ffffff;\n    background: #cccccc;\n    padding: 0 5px;\n\
  }\n```\n\n上述格式化的结果应如下所示的截图：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_106_0.png)\n\
  \n你可以使用模板中的任何 Smarty 变量，除了值为 `Array()` 的变量。我们将在下一节中查看这些特殊变量。\n\n```\n```html\n{/if}\n\
  </div>\n<div id=\"sidebar\">\n  {menu start_level=\"2\" template=\"minimal_menu.tpl\"\
  }\n</div>\n<div id=\"footer\">\n  2009 businessWorld\n</div>\n</div>\n</body>\n\
  </html>\n```\n```\n\n> 在本书中，你偶尔会遇到一行代码出现在两行不同的位置。请注意，这只是出于缩进目的而为了解决空间限制而进行的。当使用此类代码时，请确保它在你的脚本文件中位于一行。\n\
  \n+   3. 点击 **Apply**，然后点击管理控制台右上角的放大镜图标查看结果。\n\n# 发生了什么？\n\n你已在包含最后修改的段落周围添加了 IF\
  \ 代码，这会导致 CMS 检查所显示页面的页面别名。如果页面别名等于 \"contact-us\"，则 IF 结构之间的所有内容都不会显示，否则将显示有关最后修改的信息。\n\
  \n你已从上一节了解到 CMS 知道我们网站当前显示的是哪个页面。此信息存储在 Smarty 变量 `{$page_alias}` 中。使用内置的 IF 函数，你可以将实际页面的页面别名与\
  \ **Contact Us** 页面的页面别名进行比较。如果变量 `{$page_alias}` 的值 NOT 等于 `contact-us`，则 IF 标签之间的所有内容都会显示。如果页面别名等于\
  \ `contact-us`，则不会显示任何内容。这样，你可以根据页面别名控制模板的输出。\n\n变量 `{$page_alias}` 与值 `contact-us`\
  \ 之间的缩写 `neq`（意为 **不等于**）称为 **限定符**。限定符用于在 IF 代码中构建逻辑条件。逻辑条件的结果可以为真或假。如果 IF 条件的结果为真（当页面别名\
  \ NOT 等于 `contact-us` 时为真），则放置在 IF 标签之间的所有内容都会显示。如果 IF 条件的结果为假（仅当页面别名等于 `contact-us`\
  \ 时为假），则 IF 标签之间的所有内容将被抑制。\n\n\n\n\n\n# 设计与布局\n\n在 Smarty 中还可以使用更多限定符来构建逻辑条件。其中一些列在下表中：\n\
  \n| 限定符 | 含义 | 示例 |\n|---|---|---|\n| `eq` | 等于 | `$page_alias eq \"contact-us\"\
  ` |\n| `neq` | 不等于 | `$page_alias neq \"contact-us\"` |\n| `gt` | 大于 | `$friendly_position\
  \ gt 2` |\n| `lt` | 小于 | `$friendly_position lt 3` |\n| `gte` | 大于或等于 | `$friendly_position\
  \ gte $count` |\n| `lte` | 小于或等于 | `$friendly_position lte 5` |\n| `not` | 否定 |\
  \ `not $lang`<br><br>（否定可用于检查变量是否包含任何值或是否为空。如果未给出值，则条件的结果为 true，否则条件的结果为 false。）\
  \ |\n| `mod` | 取模 | `$count mod 2`<br><br>取模运算求一个数除以另一个数的余数。你可以使用上面的例子来判断第一层级页面的数量是偶数还是奇数。\
  \ |\n\nIF 结构是处理模板中根据页面名称或层级位置的细微变化的有用工具。在前面的示例中，你已经看到可以使用模板中的每个变量来构建逻辑条件。\n\n##\
  \ 使用 Smarty 循环创建导航模板\n\n你还可以更改导航的 HTML 标记。在本章中，解释了“模板中模板”的伟大原则，它赋予你完全控制设计的权力。在学习这一原则之前，你需要了解一些\
  \ Smarty 基础知识。\n\n当我们将顶部导航添加到网站时，我们使用了导航的标准模板。它将导航显示为无序 HTML 列表。想象一下，你需要一种页脚导航，其中显示顶部导航中的所有链接。在这种情况下，你不需要无序\
  \ HTML 列表。你只想在一行中显示所有链接，用竖线 (|) 分隔，如下所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_109_0.png)\n\
  \n这意味着你需要为这种导航使用完全不同的 HTML 标记。CMS Made Simple 的一大优势是可以将模板显示在模板中。虽然你可以使用主模板定义页面的整体布局，但导航的\
  \ HTML 标记保存在其自己的模板中。该导航模板只是添加到主模板中的 HTML 代码片段，放置在标签 `{menu}` 的位置。\n\n菜单模板包含导航的一些\
  \ HTML 标记。让我们看看如何为菜单创建一个全新的模板并添加你自己的 HTML 标记。\n\n### 动手时间 – 创建菜单模板\n\n我们需要一个简单的页脚导航，其中列出网站的所有页面，用竖线\
  \ (|) 符号分隔，如前所示。\n\n- 1. 在页面的管理控制台中，点击 **Layout | Menu Manager**。\n- 2. 点击 **Add\
  \ Template**。\n- 3. 填写 **New Template Name** 和 **Template Content** 的字段，如以下屏幕截图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_110_0.png)\n\n- 4. 点击 **Submit** 保存新的菜单模板。\n\
  - 5. 打开 **Business World** 模板进行编辑（**Layout | Templates**）。\n- 6. 使用 `{menu}` 标签添加页脚导航，并提供菜单模板的名称，如以下代码片段所示：\n\
  \n```\n<!DOCTYPE html>\n<html>\n    <head>\n        <title>{title} - {sitename}</title>\n\
  \        {stylesheet}\n        {metadata}\n        <meta name=\"description\" content=\"\
  \" />\n    </head>\n    <body>\n```\n\n```\n<div id=\"container\">\n<div id=\"header\"\
  >\nbusinessWorld\n</div>\n<div id=\"top-navi\">\n{menu number_of_levels=\"1\" template=\"\
  minimal_menu.tpl\"}\n</div>\n<div id=\"content\">\n<h1>{title}</h1>\n{content}\n\
  {if $page_alias neq \"contact-us\"}\n<p>Last modified by {last_modified_by format=\"\
  fullname\"}</p>\n{/if}\n</div>\n<div id=\"sidebar\">\n{menu start_level=\"2\" template=\"\
  minimal_menu.tpl\"}\n</div>\n<div id=\"footer\">\n<p>{menu template=\"footer_menu\"\
  }</p>\n2009 businessWorld\n</div>\n</div>\n</body>\n</html>\n```\n\n7. 点击 Apply\
  \ 并查看网站上的页脚导航。它应如下图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_111_0.png)\n\n\
  ## 发生了什么？\n\n你刚刚创建了一个新的菜单模板。在菜单模板中，你使用了需要解释的一些 Smarty 代码。代码中最重要的部分是 Smarty 变量 $nodelist。它不是我们已经学过的普通\
  \ Smarty 变量。这是一个数组。这意味着其中保存了多个值。该变量包含我们网站所有活动页面的所有信息，例如菜单文本或 URL。通过内置的 Smarty 函数\
  \ foreach，我们可以遍历该变量的所有值，并为每个页面显示相同的 HTML 代码片段。让我们具体看看循环是如何工作的。\n\nforeach 遍历变量 {$nodelist}\
  \ 中保存的每个页面，并将放置在 foreach 标签之间的 HTML 代码打印与变量中找到的页面数量一样多次。每次运行，单个页面的值都保存在变量 $node\
  \ 中。我们通过 foreach 标签中的参数 item=node 来命名并创建此变量。循环从第一个菜单项——页面 Our Company 开始运行。此时，菜单文本和\
  \ URL 保存在变量 $node 中。我们可以通过 {$node->menutext} 和 {$node->url} 访问所需的信息并在 HTML 代码中使用标签。在下一次（第二次）运行中，下一个页面保存在变量\
  \ $node 中。因此，从第二次运行开始，另一个菜单文本和 URL 会粘贴到相同的 HTML 代码中。foreach 循环遍历每个页面，并在找不到更多页面时自动停止。\n\
  \n页脚导航显示所有页面，而不考虑其在层级中的位置。你也可以将页脚导航限制为仅第一层级。方法与顶部导航相同。在标签 {menu} 中使用参数 number_of_levels，如下所示：\n\
  \n```\n{menu number_of_levels=\"1\" template=\"footer_menu\"}\n```\n\nforeach 循环是构建你能想象的任何形式导航的强大方法。这样，你就可以在导航中使用图像而不是文本。\n\
  \n另一个如何创建图形导航的例子如下所示：\n\n```\n{foreach from=$nodelist item=node}\n<a href=\"{$node->url}\"\
  >\n    <img src=\"uploads/design/{$node->alias}.jpg\"\n         alt=\"{$node->menutext}\"\
  \ border=\"0\" />\n</a>\n{/foreach}\n```\n\n要理解前面的 Smarty 代码会生成什么 HTML，请在脑海中将粗体\
  \ Smarty 标签替换为页面的实际值，例如 Contact Us：\n\n```\n<a href=\"contact-us\">\n    <img src=\"\
  uploads/design/contact-us.jpg\" alt=\"Contact Us\" />\n</a>\n```\n\n由于前面的代码放置在 `foreach`\
  \ 循环中，标记将为每个页面重复。你可以看到，要使图形示例正常工作，你需要为每个页面创建一个 JPG 文件。文件名称必须与页面别名对应。在我们的示例中，对于顶部导航，你需要五张图片：\n\
  \n- - `our-company.jpg`\n- - `products.jpg`\n- - `client-center.jpg`\n- - `contact-us.jpg`\n\
  - - `sitemap.jpg`\n\n在你选择的图形编辑程序中创建图像（按钮）并将它们上传到 Web 服务器上的 `uploads/design` 目录。创建一个名为\
  \ `graphical_menu` 的新菜单模板，并将 Smarty `foreach` 代码添加到其中，如前所示。然后用以下行替换主模板（**Layout\
  \ | Templates**）中的顶部导航：\n\n```\n```smarty\n{menu number_of_levels=\"1\" template=\"\
  graphical_menu\"}\n```\n```\n\n现在，导航由图形而不是文本组成。\n\n菜单模板中关于每个页面的信息还有更多，列在下表中：\n\n\
  | 变量 | 说明 |\n|---|---|\n| `$node->pagetitle` | 页面的标题 |\n| `$node->depth` | 页面层级中的层级数\
  \ |\n| `$node->prevdepth` | 页面层级中前一个页面的层级数 |\n| `$node->haschildren` | 如果页面有子页面则打印\
  \ 1 |\n| `$node->target` | 页面的目标可由编辑器从下拉菜单中设置。在模板中，你按如下方式使用它，如以下示例所示：<br><br>`<a\
  \ href=\"{$node->url}\" target=\"{$node->target}\">` |\n| `$node->alias` | 打印页面的别名\
  \ |\n| `$node->current` | 如果页面当前正在显示则打印 1 |\n| `$node->type` | 页面的类型。可能的值为：<br><br>`sectionheader`（节标题）<br>`separator`（分隔符）<br>`content`（内容）<br>`pagelink`（内部页面链接）<br>`link`（外部链接）\
  \ |\n\n\n\n\n\n3. 点击**导出**。\n\n4. 在浏览器的下载窗口中，选择将此 XML 文件保存在硬盘上的哪个位置。\n\n你可以打开该 XML\
  \ 文件，也可以将其保存为设计的备份。\n\n## 小测验——测试你学到的内容\n\n- 1. 在管理控制台中，你可以在哪里找到项目中可用的所有模板？\n  -\
  \ a. **布局 | 模板**\n  - b. **布局 | 样式表 | 模板**\n  - c. **内容 | 页面 | 主页面 | 模板**\n  - d.\
  \ **扩展 | 模板**\n\n- 2. 你如何用动态组件替换静态文本？\n  - a. 在模板中集成类似 `{content}` 的 Smarty 标签。\n\
  \  - b. 在模板中集成类似 `<content>` 的 Smarty 标签。\n  - c. 在 CSS 样式表中集成类似 'DynTxt' 的模块。\n\
  \  - d. 在页面的内容字段中集成类似 `<breadcrumbs>` 的 Smarty 标签。\n\n- 3. 仔细观察 Smarty 标签 `{last_modified_by\
  \ format=\"username\"}`，其中哪一部分是参数的“名称”？\n  - a. `last_modified_by`\n  - b. `format`\n\
  \  - c. `username`\n  - d. `by format`\n\n- 4. 如果你希望在每个页面上显示特殊且动态的信息，你应该怎么做？\n \
  \ - a. 通过使用内容字段，将 Smarty 插件直接添加到页面内容中。\n  - b. 通过使用样式表，将 Smarty 插件直接添加到页面内容中。\n\
  \  - c. 将 Smarty 插件直接添加到非活动模板中，因为这样更容易使输出适应站点的布局。\n  - d. 将 Smarty 插件直接添加到活动模板中，因为这是显示它的唯一方法。\n\
  \n- 5. 在模板中，你应该把 `{stylesheet}` 标签放在哪里？\n  - a. 头部\n  - b. 关键字或描述\n  - c. 标题\n \
  \ - d. 主体\n  - e. 页脚\n\n- 6. 一个模板可以定义多少样式表？\n  - a. 每个模板只能定义一个样式表。\n  - b. 这取决于模板中的主题数量，你可以定义与主题数量一样多的样式表。\n\
  \  - c. 最多七个，因为程序限制。\n  - d. 想要多少就可以定义多少。\n\n- 7. 你如何生成导航？\n  - a. 主菜单和侧边栏导航必须在管理控制台的内容\
  \ | 页面以及下拉菜单父项中进行连接。\n  - b. 必须使用 Smarty 标签将站点一次性连接到整个导航。\n  - c. 导航是自动生成的。\n  -\
  \ d. 主菜单是自动生成的，侧边栏菜单则必须使用 'SideNav3.1' 模块来集成。\n\n- 8. 插件菜单与设置为 2 的 start_level 参数（`{menu\
  \ start_level=\"2\"}`）结合使用是什么意思？\n  - a. 只有当你点击按钮两次时，菜单才会显示。\n  - b. 值 2 取决于模板中代码所在的行数。\n\
  \  - c. 当你设置为 2 时，只会显示 2 个导航链接；当你设置为 all 而不是 2 时，会显示整个导航结构。\n  - d. 值 2 用于使导航中不显示第一级。\n\
  \n- 9. 像 `$nodelist` 这样的数组（即一个 Smarty 变量）有什么特殊之处？\n  - a. 其中保存了多个值。\n  - b. 其中恰好保存了一个值。\n\
  \  - c. 数组只包含数字值。\n  - d. 数组只包含文本值。\n"
- "## 5. 使用核心模块\n\n*我们已经学习了如何建立网站、规划和创建完整的网站结构以及设计网站。这些是在编写内容和实现新闻文章或搜索功能等附加功能之前，我们必须完成的最初步骤。*\n\
  \n> **什么是核心模块？**\n>\n> 核心模块是一些基础模块，它们提供了重要功能，并随 CMS Made Simple 一起提供。这些模块默认安装，并得到\
  \ CMS Made Simple 官方开发团队的支持。这些模块并非必需，没有它们，你的 CMS 网站也能正常运行。当你需要新闻管理、搜索功能或自定义导航等功能时，可以使用它们。\n\
  \n在本章中，我们将：\n\n- 创建全局内容块\n- 实现新闻文章并对其进行分类\n- 添加搜索功能\n- 使用内置的**图片管理器**和**文件管理器**\n\
  - 使用**菜单管理器**创建站点地图\n- 创建内容页面或新闻文章的打印版本\n- 学习如何安装未包含在 CMS Made Simple 标准安装中的其他模块\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_120_0.png)\n\n在接下来的示例中，我假定你已经拥有一个类似上一章中创建的模板，并且你的网站结构是按照第3章\
  \ *创建页面和导航* 末尾所示的结构构建的。不过，即使你的结构或设计有所不同，你仍然可以继续学习本章。\n\n### 了解全局内容块\n\n你可以使用全局内容块在网站中添加一些包含文本和/或图像的重复部分。这些块包含相同的信息，可以在模板中的任何位置或任何页面的内容中使用。例如，你可以创建一个包含公司地址和电话号码的联系框作为全局内容块，然后将其添加到网站的多个位置。\n\
  \n当然，你可以在每次需要时设计联系框，并单独为每个页面添加联系信息。你甚至可以复制一个页面上的联系框，然后粘贴到另一个页面。在公司电话号码不变的情况下，这种方法可行。一旦公司电话号码发生变化，你就必须打开每个添加了联系框的页面并修改电话号码。根据页面数量的不同，你可能会花费数小时来修改每个页面。使用全局内容块，你可以在一处编辑所有信息，然后从网站的任何位置调用相同的内容。如果公司电话号码发生了变化，你只需在全局内容块中调整它，那么使用此全局内容块的每个页面都会自动更新。\n\
  \n让我们看看如何在你的网站上使用全局内容块。\n\n### 动手实践——向网站添加全局内容块\n\n假设我们需要在前面提到的某些页面中放置一个联系框，该联系框位于内容中的某个位置。\n\
  \n- 1. 在管理控制台中，点击**内容 | 全局内容块**。\n- 2. 点击**添加全局内容块**。\n- 3. 输入块的**名称**，然后在**内容**字段中输入联系信息，如下图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_122_0.png)\n\n> 使用键盘上的 *Shift + Enter*\
  \ 添加换行。\n\n- 4. 点击**提交**。\n- 5. 在全局内容块列表中，将 **用于此块的标签** 列中的 Smarty 标签复制到剪贴板。\n-\
  \ 6. 在管理控制台中，打开你选择的页面（内容 | 页面）进行编辑，并将标签粘贴到应显示联系框的位置。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_123_0.png)\n\
  \n- 7. 点击**应用**，并在你的网站中查看结果。\n\n### 刚才发生了什么？\n\n针对联系信息，你已创建了一个新的全局内容块。每当你在网站上显示联系信息时（无论是在页面中还是在模板中），你只需添加\
  \ Smarty 标签，而无需输入完整信息。从现在起，你只需在全局内容块中进行修改，使用该块的每个页面和模板都会显示相同的信息。\n\n试试看。将一个新的全局内容块添加到另一个页面，然后在两个页面上查看结果。接着在管理控制台中，打开\
  \ 内容 | 全局内容块，选择包含你联系信息的内容块并修改其中的内容。保存后，在两个使用该块的页面上查看更改。\n\n### 使用 News 模块管理新闻文章\n\
  \n到目前为止，我们已经添加了由 CMS Made Simple 的层级管理器控制的内容页面。对于公司内部的公告或活动，你可以使用核心模块 News。该模块允许你创建快速简短的通知，然后将其放置在网站、模板或页面的任何位置。你的新闻应该是真正新鲜的。没有什么比网站中充斥着一年前的新闻更令人失望的了。“过时”的新闻会让网站看起来像被遗弃了一样。\n\
  \n\n\n\n\n对于公司的网站，你可以发布公司最近完成的项目或任何客户活动。借助新闻版块，你还可以宣传公司提供的新产品或新服务。你可以介绍新客户或合作伙伴，并在节日向客户表达祝福。当网站访客看到几天前发布的新闻文章时，他们就会知道你的网站（以及你的公司）是活跃的。\n\
  \n如果你想不到网站上可以发布什么内容，那就跳过这个模块。不要仅仅因为它标准、易用且其他网站也有新闻就把它放上去。\n\n## 在网站上显示新闻\n\n**新闻**模块非常灵活，可以通过多种不同方式显示。我们来看看如何将新闻添加到**公告**页面。我假设你已经创建了这个页面。如果没有，你也可以把新闻放在网站的首页上。下一步在任何页面上都能生效。\n\
  \n### 操作实践——在页面上显示新闻\n\n1. 打开**公告**页面进行编辑（**内容 | 页面**）。\n2. 在需要显示新闻文章的位置添加 Smarty\
  \ 标签 `{news}`，如下图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_124_0.png)\n\n\
  3. 点击**应用**，查看该 Smarty 标签在你网站上的显示效果。效果应如下所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_125_0.png)\n\
  \n### 刚才发生了什么？\n\n只需一个简短的 Smarty 标签，你就可以在网站上显示第一篇新闻文章。这篇文章在 CMS Made Simple 标准安装时就已经存在。但该文章在哪里编辑？又如何创建新文章呢？\n\
  \n## 添加新闻\n\n所有创建过的新闻都可以在管理控制台中找到。打开**内容 | 新闻**。你会看到该模块的管理区域，其中包含许多设置。在第一个标签页**文章**中，如果新闻很多，你可以进行搜索。但此时，你只有一篇新闻文章，它显示在列表下方，名为**新闻模块已安装**。这篇新闻文章是在\
  \ CMS Made Simple 安装过程中自动创建的，也会显示在添加了 `{news}` 标签的页面上。\n\n让我们向新闻列表中添加一篇新文章，看看哪些内容可以根据需求进行调整。\n\
  \n### 操作实践——添加新闻条目\n\n1. 在管理控制台中，点击**内容 | 新闻**。\n2. 点击**添加文章**。\n3. 输入新闻文章的**标题**、**摘要**文本和文章**内容**。\n\
  \n---\n\n# 游戏中的 PageRank 算法 —— EVE Online\n\n作者：Ing. Tomáš Fabián\n\n摘要——PageRank\
  \ 算法最初由拉里·佩奇和谢尔盖·布林开发，用于搜索引擎中的网页排名，如今已在万维网之外的多个领域得到应用。本文探讨了 PageRank 算法在游戏领域的应用，特别聚焦于大型多人在线角色扮演游戏（MMORPG）EVE\
  \ Online。其独特的玩家驱动经济和复杂的玩家互动，使 EVE Online 成为应用基于图的排名算法来分析游戏宇宙中玩家影响力、星系重要性和经济流动的理想对象。\n\
  \nEVE Online 呈现了一个持久世界，玩家在其中进行采矿、贸易、制造和战斗。游戏宇宙由相互连接的星系构成，形成一种天然的图结构。通过将 PageRank\
  \ 应用于该图，我们可以识别在经济活动和战略重要性方面最具影响力的星系。这种分析有助于洞察玩家行为模式，并可辅助游戏平衡调整和内容开发。\n\n研究方法包括构建\
  \ EVE Online 宇宙的有向图，其中节点代表星系，边代表它们之间的旅行航线。我们对标准 PageRank 算法进行了调整，以纳入玩家流量、贸易量和战斗频率等游戏专属指标。将所得排名与游戏中已知的重要星系进行比较，结果显示其与玩家人口分布和市场活动存在显著相关性。\n\
  \n总之，PageRank 算法为分析玩家驱动的虚拟世界提供了一个稳健的框架。在 EVE Online 中的应用展示了基于图的排名方法在游戏环境中的多用途性，为游戏开发者和研究虚拟经济的研究者提供了宝贵的见解。\n\
  \n---\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_128_0.png)\n\n3. 点击提交。\n\n4. 在文章标签页下，点击添加文章，并创建包含以下信息的新文章：\n\
  \n- a. 分类：职位空缺\n- b. 标题：市场经理\n- c. 内容：我们正在寻找一位优秀的人才，能够为公司开拓欧洲市场。请联系我们的人力资源部门。\n\n\
  5. 点击提交。\n\n6. 打开网站的首页进行编辑，并在内容字段的某处添加 Smarty 标签，如下图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_128_1.png)\n\
  \n---\n\n```smarty\n<title>{title} - {sitename}</title>\n{stylesheet}\n{metadata}\n\
  <meta name=\"description\" content=\"\" />\n</head>\n<body>\n<div id=\"container\"\
  >\n<div id=\"header\">\nbusinessWorld\n</div>\n<div id=\"top-navi\">\n{menu number_of_levels=\"\
  1\" template=\"minimal_menu.tpl\"}\n</div>\n<div id=\"content\">\n<h1>{title}</h1>\n\
  {content}\n{if $page_alias neq \"contact-us\"}\n<p>Last modified by {last_modified_by\
  \ format=\"fullname\"}</p>\n{/if}\n</div>\n<div id=\"sidebar\">\n{menu start_level=\"\
  2\" template=\"minimal_menu.tpl\"}\n<hr />\n{news summarytemplate=\"NewsList\"}\n\
  </div>\n<div id=\"footer\">\n<p>{menu template=\"footer_menu\"}</p>\n2009 businessWorld\n\
  </div>\n</div>\n</body>\n</html>\n```\n\n6. 点击提交，然后在页面上查看结果。你的侧边栏应与以下截图类似：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_131_0.png)\n\
  \n### 刚才发生了什么？\n\n你为新闻文章创建了一个新的摘要模板。该摘要模板包含新闻文章的有序列表，每篇文章都链接到详细视图。然后，你在侧边栏菜单下方的模板中添加了一个\
  \ Smarty 标签。你使用了参数 `summarytemplate` 来指定在此处显示新闻文章摘要视图时具体使用哪个模板。如果不使用该参数，则使用默认模板。在\
  \ CMS Made Simple 的标准安装中，默认使用 **Sample** 模板。你可以通过点击模板列表（**内容 | 新闻 | 摘要模板**）中**默认**列里带红色叉号的图标来更改默认模板。\n\
  \n你可以编辑现有模板或创建新的自定义模板。如果你将该模块用于不同任务，例如职位机会、公告和公司博客，你可以根据需要创建任意数量的模板。你还可以指定在调用标签的位置使用哪个模板来显示该模块的输出。例如，在网站上显示职位机会的调用可以这样写：\n\
  \n```smarty\n{news summarytemplate=\"Jobs\" detailtemplate=\"Job\"\n     category=\"\
  Vacancies\"}\n```\n\n对于上述示例，你需要创建一个名为 **Jobs** 的摘要模板和一个名为 **Job** 的详细模板。你还需要一个 **Vacancies**\
  \ 分类，并在其中添加至少一个职位机会。\n\n## 为新闻模块添加自定义字段\n\n有时候，你需要将自定义信息显示在公告中。例如，你可能想添加部门或特殊地点，或者希望将文件与发布新产品的新闻关联起来。在这种情况下，你需要在**新闻**模块中定义自定义字段。\n\
  \n让我们看看如何将新闻的位置添加到特殊字段中。\n\n\n\n\n\n## Time for action – adding custom fields\n\n\
  +   1. 在管理字段中，打开 **Content | News** 并选择 **Field Definitions** 选项卡。\n+   2. 点击 **Add\
  \ Field Definition** 并输入字段，如以下截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_133_0.png)\n\
  \n+   3. 点击 **Submit**。\n+   4. 打开你最近添加的文章条目，例如 **Marketing Manager (Content | News)**，你会在页面底部找到新的字段\
  \ **Location**。\n+   5. 在 **Location** 字段中输入 **Washington**，然后点击 **Submit**。\n+\
  \   6. 打开你的页面，你可以在新闻文章下方找到添加的位置。 （注意：这仅适用于 *Sample* 模板或基于默认模板的模板！）。它应与以下截图类似：\n\n\
  ![](img/b21e3dc5c94405bc7b3f102758ea770c_133_1.png)\n\n## What just happened?\n\n\
  你已为新闻文章添加了一个新的自定义字段。由于该字段标记为公开，它将在网站上显示。该字段会自动添加到新闻编辑窗口。如果你想更改字段的位置，应编辑模板。在默认模板\
  \ Sample 中，所有附加字段都添加到新闻文章底部。在你自己的模板中，可以使用以下代码行获取任何自定义字段值：\n\n```\nLocation: {$entry->fieldsbyname.location->value}\n\
  ```\n\n上一行将显示保存在 Location 字段中的值。你可以在摘要和详细模板中使用此行。\n\n还有更多参数可用于优化 Smarty 插件 {news}\
  \ 的输出。对于每个模块，参数列表可以在模块的帮助部分找到。在管理控制台中，打开 Content | News，然后点击模块名称右侧的 Module Help\
  \ 链接。\n\n新闻模块有一些有用的参数，如下表所示：\n\n| News parameter | Description |\n|---|---|\n| browsecat=\"\
  1\" | 显示可浏览的分类列表。 |\n| showall=\"1\" | 显示所有文章，不受结束日期限制。 |\n| showarchive=\"0\" |\
  \ 仅显示已过期的新闻文章。 |\n| sortasc=\"true\" | 按升序日期顺序而非降序排序新闻项目。 |\n| sortby=\"news_title\"\
  \ | 按字段排序。选项为：news_date, summary, news_data, news_category, news_title, news_extra,\
  \ end_time, start_time, 和 random。默认值为 news_date。 |\n| moretext=\"more...\" | 如果\
  \ Summary 字段不为空，则在新闻项目末尾显示的文本。默认设置为 \"more...\" |\n| start=\"0\" | 从给定项目号开始列出文章。\
  \ |\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_134_0.png)\n\n如果你想在除主模板以外的其他页面模板中显示新闻文章的详细视图，请创建一个新的页面模板（Layout\
  \ | Templates），创建一个新页面，并将新模板分配给该页面。使用 {news page=\"alias\"} 调用 News 模块，其中 alias\
  \ 是应显示每篇新闻项目详细视图的页面的名称。\n\n你甚至可以允许网站访问者向你的模块添加新闻文章，如果你安装 **FrontEndUsers** 模块，该模块将在第\
  \ 7 章 *Using Third-party Modules* 中描述。网站访问者提交的新闻文章将保存为草稿，你可以在管理内容页面中批准后发布它们。\n\n\
  ## Using the news title as the page title\n\n注意在显示完整文章的页面上浏览器标题栏的标题。你会发现标题标签对每个项目都相同，因为只有一个真实页面用于显示每篇新闻文章。然而，搜索引擎优化要求每个页面都有唯一的标题。你可以用一个小技巧自定义生成的页面的标题。打开管理控制台中的\
  \ **Content | News**，并选择 **Detail Templates** 选项卡。在模板的最顶部，添加以下行：\n\n```\n{assign\
  \ var=\"pagetitle\" value=$entry->title|escape}\n```\n\n此行将生成 Smarty 变量 {$pagetitle}，其中包含新闻文章的标题。要将变量添加到主模板，请打开它，并在模板的最顶部添加标签\
  \ {process_pagedata} 并用 IF 结构替换标题标签，如以下代码片段所示：\n\n```\n{process_pagedata}\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n{if isset($pagetitle) && !empty($pagetitle)}\n<title>{title}\
  \ - {sitename}</title>\n{else}\n<title>{sitename} - {title}</title>\n{/if}\n...\n\
  ```\n\n这段代码检查变量 {$pagetitle} 是否已定义且不为空。如果变量存在，则新闻标题用于标题标签并显示在浏览器标题栏中。如果不存在，则采用普通的页面标题。\n\
  \n## Using the search function with the module Search\n\n接下来应解释的标准功能是 **Search**\
  \ 模块。它默认安装，允许网站访问者搜索网站上的内容页面和新闻文章。通常，你将搜索字段添加到模板中而不是每个页面。\n\n让我们将搜索功能添加到网站顶部的模板中。\n\
  \n## Time for action – adding a search form\n\n+   1. 打开模板 **Business World (Layout\
  \ | Templates)**\n+   2. 将 Smarty 标签 `{search}` 添加到侧边栏，如下所示：\n\n```\n<!DOCTYPE html>\n\
  <html>\n<head>\n<title>{title} - {sitename}</title>\n{stylesheet}\n{metadata}\n\
  <meta name=\"description\" content=\"\" />\n</head>\n<body>\n<div id=\"container\"\
  >\n<div id=\"header\">\n businessWorld\n</div>\n<div id=\"top-navi\">\n {menu number_of_levels=\"\
  1\" template=\"minimal_menu.tpl\"}\n</div>\n<div id=\"content\">\n<h1>{title}</h1>\n\
  {content}\n{if $page_alias neq \"contact-us\"}\n<p>Last modified by {last_modified_by\
  \ format=\"fullname\"}</p>\n{/if}\n</div>\n<div id=\"sidebar\">\n{search}\n{menu\
  \ start_level=\"2\" template=\"minimal_menu.tpl\"}\n<hr />\n{news summarytemplate=\"\
  NewsList\"}\n</div>\n<div id=\"footer\">\n<p>{menu template=\"footer_menu\"}</p>\n\
  2009 businessWorld\n</div>\n</div>\n</body>\n</html>\n```\n\n3. 点击 Submit 并在浏览器中查看你的页面，它应如下图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_137_0.png)\n\n## What just happened?\n\
  \n你已将搜索功能添加到你的网站。如果你尝试在页面内容或新闻文章中搜索，它开箱即用。\n\n你可以在管理控制台中定义停用词列表（Extensions | Search\
  \ | Options）。这些词从搜索索引中排除，并且还为你提供了常用停用词的预定义列表。通常，你会添加公司名称或可以在每个页面或模板中找到的任何词。为了避免这种情况，搜索功能会显示搜索结果中的所有页面。你可以在列表末尾用逗号分隔添加自定义词或定义自己的列表。保存停用词列表后，不要忘记点击\
  \ Reindex All Content 按钮。它将为你的网站创建新的搜索索引。\n\n如果你的网站是英文的，你可以使用词干搜索。这意味着搜索索引中的词被简化为其词干、词根或基本形式。例如，你有一个内容页面，其中找到并索引了词\
  \ steps。然而，网站访问者搜索 step。在未激活词干功能的情况下，找不到任何内容，因为字面上的 step 与 steps 不同。使用词干搜索，所有搜索词的形式都会被考虑，如\
  \ \"step\"、\"steps\" 甚至 \"stepped\"。\n\n排除搜索中的页面\n如果你想让某些页面，如 Policy 或 Disclaimer\
  \ 从搜索中排除，请在管理控制台中打开你想排除的页面（Content | Pages）并选择 Options 选项卡。取消选择字段 This page is searchable，然后保存页面。现在即使搜索词出现在该页面上，该页面也不会被找到。\n\
  \n你可以在管理控制台中自定义搜索模板（搜索字段本身）和搜索结果模板（Extensions | Search）。与往常一样，你使用 HTML 和 Smarty\
  \ 标签的混合来更改元素的顺序。使用 stylesheet 使其符合你的布局。\n\n如果你想在与主模板不同的模板中输出搜索结果，你必须自己创建所需的模板（你已在上一章学习了如何创建模板）并将模板分配给应显示搜索结果的页面。此页面的别名应作为参数传递给\
  \ resultpage，如示例所示。修改 Smarty 标签 {search}，添加 resultpage 参数如下：\n\n```\n{search resultpage=\"\
  search-result\"}\n```\n\n你必须将之前创建的页面的别名分配给 resultpage 参数，以便搜索结果始终显示在此页面上。\n\n搜索功能还会跟踪你网站上的搜索活动，并让你了解网站访问者需要或缺少什么。你可以跟踪单个搜索词或短语，以查看它们被访问者使用的频率。在\
  \ Search 模块的 Options 选项卡（Extensions | Search）中，你可以选择 Track Search Phrases, not Individual\
  \ Words 以启用短语统计。\n\nCMS Made Simple 的 Search 模块不如大型搜索引擎那么复杂。如果你想在网站上显示搜索词的文本并对英语以外的语言具有词干功能，可以使用自定义\
  \ Google 搜索。但如果你的网站未在 Google 上索引，那么你别无选择，只能使用 CMS Made Simple 的标准搜索功能。\n\n## Browsing\
  \ files with File Manager\n\n你可以使用 File Manager 在 CMS Made Simple 中上传任何文件。File Manager\
  \ 就像一个内置的 FTP 浏览器，你可以在其中上传、移动、删除和复制文件或目录。在管理控制台中，打开 Content | File Manager，找到保存在你网络托管的\
  \ uploads 文件夹中的所有文件列表。\n\n在 Upload files 选项卡上，你可以上传多个文件，甚至是上传后在此文件夹中解压的归档文件。\n\n\
  在 Settings 选项卡上，你可以启用高级模式，这将让你访问 CMS Made Simple 网站的整个文件结构，以便 File Manager 不再限制在\
  \ uploads 文件夹。谨慎使用此设置，因为你可以轻松移动和删除 CMS Made Simple 的核心文件，从而损坏整个网站。\n\n如果你想上传和编辑图像，则应使用\
  \ Image Manager。\n\n\n\n\n\n## 使用图片管理器\n\n你当然希望给自己的网站添加图片。无论这些图片是放在页面内容中，还是用于模板或相册，都必须先上传到你的网站主机上。在上传到网站展示之前，你应该对图片进行优化。不要上传大于\
  \ 200KB 的图片。这个限制并非来自 CMS Made Simple。使用图片管理器，你甚至可以上传和显示更大的图片。此限制是考虑到你的访问者希望网站能够快速加载。如果使用大图片，你的网站会加载得非常缓慢，而且有一定比例的访问者会在看到你网站提供的内容之前就关闭浏览器。\n\
  \n> 经验法则\n>\n> 单张图片不应大于 20KB，并且一个页面上的所有图片总大小不应超过 200KB。\n\n在网站上使用图片之前，请使用图形程序调整图片大小。或者，使用\
  \ CMS Made Simple 内置的图片编辑器来调整大小、裁剪、旋转和翻转图片。\n\n让我们上传一些图片到 CMS Made Simple，进行编辑，然后在页面或模板中显示它们。有三种格式可以被任何浏览器显示——JPG（或\
  \ JPEG）、GIF 和 PNG。网站上不应使用其他图形格式，因为某些操作系统上的某些浏览器无法显示 BMP、TIFF、PSD 或其他文件。请使用任意图形应用程序在本地磁盘上准备一张图片，供下一步使用。\n\
  \n### 动手实践——使用图片编辑器\n\n假设我们有一张对于页面来说过大的图片。理想情况下，你应该在上传到网站主机之前使用图形应用程序创建图片。但如果你没有图形应用程序，或者只想快速做一些修改，可以使用内置的图片管理器来完成这项任务。\n\
  \n1. 在管理控制台中，打开**内容 | 图片管理器**。\n2. 在页面底部的**上传文件**字段中选择要上传的图片，然后点击**发送**。\n3. 图片上传后，点击图片下方的编辑图标以启动图片编辑器。\n\
  4. 通过点击左侧控制面板中的**调整大小**，并在图片上方的字段中指定所需尺寸，将图片的物理尺寸调整为所需的像素宽度和高度。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_140_0.png)\n\
  \n5. 点击图片上方带有绿色对勾标记的图标以应用更改。\n6. 点击左侧控制面板中的**保存**图标，并为调整大小后的图片选择图片格式，如以下截图所示：\n\n\
  ![](img/b21e3dc5c94405bc7b3f102758ea770c_140_1.png)\n\n7. 再次点击绿色对勾标记以应用更改。图片保存后，可以关闭窗口。\n\
  8. 刷新显示图片缩略图的页面，或重新打开**图片管理器**（**内容 | 图片**）。此时，已应用更改的新版本图片会显示在可用图片列表中。\n\n### 刚才发生了什么？\n\
  \n你已将一张新图片上传到 CMS Made Simple。上传后，CMS 会自动创建一个 96×96 像素的缩略图（用于预览的小尺寸图片版本）。你更改了图片的大小，然后以较低的质量保存，以减少其千字节大小。对于\
  \ JPEG 图片，选择 60% 到 85% 的质量不会造成任何可见的质量损失。你可以试一试。保存后原始图片不会被更改，而是会创建该图片的一个新版本。如果出现错误，你可以随时删除新版本，并再次从原始图片开始操作。\n\
  \n对于更高级的图形处理工作，你可以使用专门的图形应用程序，例如免费的 GIMP 或商业软件 Adobe Photoshop。\n\n使用 FTP 浏览器，你可以在目录\
  \ `/uploads/images` 中找到你的图片文件和自动创建的缩略图。如果你有大量图片，也可以使用 FTP 浏览器将它们上传到这个目录。但是，如果这样做，缩略图不会自动创建。通过\
  \ FTP 上传后，你必须打开**内容 | 图片管理器**。**图片管理器**会发现新上传的文件，然后创建缺失的缩略图。\n\n缩略图的文件名以 `thumb_`\
  \ 为前缀。例如，图片文件 `city.jpg` 会在原始图片上传的同一文件夹中获得一个自动生成的缩略图，名称为 `thumb_city.jpg`。\n\n##\
  \ 在模板和内容中使用图片\n\n上传的图片可以通过所见即所得（WYSIWYG）编辑器用于页面内容中（参见第 3 章，*创建页面和导航*）。通常情况下，内容编辑者无法更改网站模板。但还有一种功能可以帮助他/她为页面分配图片，并在模板中的任意位置显示该图片。\n\
  \n在 CMS Made Simple 中，设计（模板）和文本可以严格分离。为了让编辑者更多地承担网站外观的责任，你可以允许他们以受控的方式更改模板中的图片。\n\
  \n我们来创建一个可由页面编辑者选择并显示在导航上方的图片。首先，创建两张宽度为 800 像素、高度约为 100 像素的图片。将它们命名为 `pageimage1.jpg`\
  \ 和 `pageimage2.jpg`。使用**图片管理器**将图片上传到 CMS Made Simple。不要将它们上传到子文件夹，而是直接上传到**图片管理器**的起始文件夹（`uploads/images`）。\n\
  \n在管理控制台中，打开任意页面（**内容 | 页面**）。选择**选项**选项卡，然后在**图片**字段中选择要与此页面关联的图片，如以下截图所示：\n\n\
  ![](img/b21e3dc5c94405bc7b3f102758ea770c_142_0.png)\n\n对其他页面执行相同操作，并为它们分配其他图片。\n\
  \n> 如果你在下拉字段中看不到该图片，说明它没有被上传到正确的文件夹。页面图片必须位于**内容 | 图片管理器**或 Web 服务器上的 `/uploads/images`\
  \ 目录中（而不是子文件夹）。\n\n然后将图片添加到模板中。打开 **Business World** 模板（**布局 | 模板**），并添加页面图片以显示它：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>{title} - {sitename}</title>\n\
  {stylesheet}\n{metadata}\n<meta name=\"description\" content=\"\" />\n</head>\n\
  <body>\n<div id=\"container\">\n<div id=\"header\">\nbusinessWorld\n</div>\n<img\
  \ src=\"uploads/images/{page_image}\" width=\"800\" height=\"100\"\nalt=\"{title}\"\
  \ />\n<div id=\"top-navi\">\n{menu number_of_levels=\"1\" template=\"minimal_menu.tpl\"\
  }\n</div>\n<div id=\"content\">\n<h1>{title}</h1>\n{content}\n</div>\n...\n```\n\
  \n现在，页面编辑者可以从预定义的图片中选择要在模板中显示的图片，而无需修改模板本身。\n\n## 在内容中使用菜单管理器\n\n你已经使用过**菜单管理器**为网站创建顶部导航、侧边栏导航和页脚导航。顶部导航显示位于页面层级第一级的页面。侧边栏导航自动只显示顶部导航中所选页面的子页面。页脚中的导航包含所有页面，无论它们在层级中的位置如何。\n\
  \n此外，你也可以在**内容**字段中显示完整的网站结构（或其一部分）。这样，你可以轻松输出一个站点地图，帮助访问者在你网站上找到所需信息。\n\n### 动手实践——创建站点地图\n\
  \n让我们在**第 3 章*创建页面和导航***中创建的**站点地图**页面里创建一个站点地图。如果没有该页面，请现在就创建它。\n\n1. 在管理控制台中，打开**站点地图**页面（**内容\
  \ | 页面**）。\n2. 将 Smarty 标签 `{menu template=\"minimal_menu.tpl\"}` 添加到页面内容中。\n\n\n\
  \n\n3. 点击 Apply，然后使用 Apply 按钮旁边的放大镜图标在网站上查看结果。效果应该如下图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_144_0.png)\n\
  \n## 刚才发生了什么？\n\n使用已知的 Smarty 标签 {menu}，你已经为网站添加了一个站点地图。它会显示网站的完整结构，包括所有标记为“在菜单中显示”（位于“选项”标签页）的页面。你可以通过以下参数来优化\
  \ {menu} 标签的输出：\n\n- `show_all=\"1\"`：此选项将显示所有页面，即使它们被设置为不在菜单中显示。但仍不会显示未激活的页面。\n\
  - `number_of_levels=\"1\"`：此设置可帮助你将输出限制为特定的层级数。\n\n你可以任意组合多个参数。例如，要显示所有激活页面并将层级限制为两层，你可以添加以下行：\n\
  \n```\n{menu show_all=\"1\" number_of_levels=\"2\"}\n```\n\n在内容中使用额外导航选项的另一个示例是，在首页上显示页面（而非新闻文章）列表，这些页面与其在层级中的实际位置无关。假设你想在首页上创建某种快速导航，让访问者可以直接从首页访问某些页面。要创建子页面列表，请在首页内容中使用以下参数之一：\n\
  \n- `start_element=\"1.2\"`：显示从给定 start_element（层级中的位置）开始的页面列表，并且只显示该元素及其子元素。\n\
  - `start_page=\"home\"`：显示从给定 start_page（页面的别名）开始的页面列表，并且只显示该元素及其子元素。\n\n使用哪个参数取决于你。当然，你也可以手动创建页面链接列表。但这样一来，列表就不是动态的。如果添加了新页面，你还必须手动将它们添加到链接列表中。如果你改用\
  \ Smarty 标签 `{menu}`，它会自动显示所有新页面。\n\n另一个有用的参数是：\n\n- `show_root_siblings=\"1\"`：此选项仅在使用\
  \ start_element 或 start_page 参数（如前面所示）时才有用。它将显示与所选起始页面或元素同一层级的页面。\n\n请参阅以下页面结构示例，了解如何在不同参数下在每个页面上输出该结构：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_145_0.png)\n\n如果你的网站结构如上图所示，那么使用第一列中的标签，你将获得第二列所示的输出。\n\
  \n| Smarty 标签 | 输出 |\n|---|---|\n| {menu start_element=\"3\"} | • 客户中心<br>  ○ 常见问题<br>\
  \  ○ 通讯简报<br>  ○ 服务台 |\n| {menu start_element=\"1.1\" show_root_siblings=\"1\"}\
  \ | • 公告<br>  ○ 所有公告<br>  • 历史<br>  • 团队<br>  • 照片画廊 |\n| {menu start_element=\"\
  1.1\" show_root_siblings=\"1\" number_of_levels=\"1\"} | • 公告<br>  • 历史<br>  • 团队<br>\
  \  • 照片画廊 |\n\n你可以看到 CMS Made Simple 中导航布局的灵活性。在每个页面上，你都可以精确定义导航结构，甚至可以通过先添加文章分类，然后将文章分配到分类中，并使用菜单管理器在网站的任何页面或模板中显示它们，从而创建一种文章目录。\n\
  \n## 打印页面\n\n使用 CMS Made Simple，每个页面和新闻文章都可以通过内置的打印模块自动生成打印预览。\n\n## 动手实践——添加打印链接\n\
  \n让我们看看如何为每个页面或新闻文章添加打印版本的链接。\n\n- 1. 在管理控制台中，打开模板 Business World 进行编辑（布局 | 模板）。\n\
  - 2. 在模板中将 Smarty 插件 {print} 添加到 {content} 标签上方，如下所示：\n- 3. 点击 Apply，然后在网站上查看更改。\n\
  \n```\n...\n<div id=\"content\">\n<h1><span>{$friendly_position}</span> {title}</h1>\n\
  {print}\n{content}\n...\n```\n\n## 刚才发生了什么？\n\n通过自定义 Smarty 标签 {print}，你使用了核心模块\
  \ Printing。在你添加该标签的位置，会显示一个“打印此页”链接。当点击链接时，会打开一个新页面，其中包含该页面的打印友好版本。它没有任何特殊样式，也不显示主模板，只显示页面内容。\n\
  \n有一些有用的参数可帮助你自定义“打印此页”链接及其行为。\n\n- text=\"Print this page\"：覆盖打印链接的默认文本。\n- popup=\"\
  false\"：将其设置为 true，则将在新窗口中打开用于打印的页面。请注意，某些浏览器会阻止弹出窗口！\n- script=\"false\"：将其设置为\
  \ true，则打印版本将自动打开浏览器的打印对话框。\n- includetemplate=\"false\"：如果将其设置为 true，则不仅显示页面内容，还显示整个页面模板，包括页面内容、页眉、导航和页脚区域。\n\
  - showbutton=\"false\"：将其设置为 true 以显示图形按钮，而不是文本“打印此页”。\n\n如果上述参数不足以让你自定义打印链接和打印视图的外观与体验，你可以自由地在管理控制台（扩展\
  \ | 打印）中自定义该模块。有以下四个标签页：\n\n- **链接模板**：用于显示网站打印（或 PDF）版本链接的模板。\n- **打印模板**：用于显示打印版本的模板。你可以在此处添加自己的\
  \ HTML 标记，如网站 URL、网站公司或联系方式，以便这些信息自动显示在网站的打印版本中。\n- **覆盖打印样式表**：允许你将自己的自定义 CSS 插入到打印版本中。通常，你会用它来定义字体大小，并设置为打印作品中常用的磅值。\n\
  - **PDF 设置**：我们将在*生成页面的 PDF 版本*一节中讨论此标签页。\n\n## 向样式表添加媒体类型\n\n有时，页面的访问者不使用专门的打印按钮，而是使用浏览器的默认打印对话框。在这种情况下，整个页面会按屏幕显示的样子打印出来。你也可以使用样式表的媒体类型来定制这种打印版本。在纯\
  \ CSS 中，你可以在链接标签中将不同的媒体类型定义为 HTML 属性，如下所示：\n\n```\n<link rel=\"stylesheet\" type=\"\
  text/css\" media=\"screen\" href=\"sheet.css\">\n<link rel=\"stylesheet\" type=\"\
  text/css\" media=\"print\" href=\"print.css\">\n```\n\n在 CMS Made Simple 中，你向模板添加\
  \ Smarty 标签 {stylesheet}，它会自动生成 HTML 链接标签，因此你无法向其添加 HTML 属性 media。不过，你可以为模板附加两个不同的样式表，并将它们标记为\
  \ screen、print 或任何其他允许的类型。\n\n在管理控制台中，打开你的样式表（布局 | 样式表）进行编辑，然后向下滚动到“媒体类型”部分：\n\n\
  ![](img/b21e3dc5c94405bc7b3f102758ea770c_148_0.png)\n\n选择你希望此样式表服务的媒体类型，例如 screen。要添加一个包含页面打印视图格式的特殊样式表，请创建一个带有打印格式的新样式表。在“媒体类型”部分（见前一张截图）中选择\
  \ print 作为媒体类型，然后将此样式表附加到模板。CMS Made Simple 会自动将 HTML 属性 media 添加到模板中 {stylesheet}\
  \ 所在位置生成的链接标签上。\n\n**可用模块**标签页是你查找可用模块的研究中心。模块按名称字母顺序排序，并且大多都有很好的说明，可以通过单击模块名称旁边的**帮助**链接查看。\n\
  \n在**模块管理器**中无法通过关键词搜索模块功能。但是，你可以使用 **CMSMS Forge** 中的搜索功能。CMSMS Forge 是所有功能（如模块、插件或翻译）的中心。可以在\
  \ `http://dev.cmsmadesimple.org` 找到它。在 CMSMS Forge 的右上角输入搜索词或短语，即可找到与搜索条件匹配的模块、插件（也称为标签）或翻译列表。如果你对列表中的任何模块感兴趣，请记下其名称，返回管理控制台中的**扩展\
  \ | 模块管理器**，在字母列表中搜索该模块名称。阅读**帮助**部分，看看该模块是否满足你的需求。\n\n## 安装附加模块\n\n在安装模块之前，你应该在**模块管理器**的模块列表中检查其旁边的**依赖**链接。有些模块的运行依赖于其他模块，因此你必须先安装其他模块。\n\
  \n## 动手实践——模块安装\n\n让我们安装一个额外模块，用于管理网站上的常见问题（FAQ）。\n\n- 1. 在管理控制台中，点击**扩展 | 模块管理器**，然后选择**可用模块**标签页。\n\
  - 2. 在模块列表中，选择字母 **Q**，找到模块 **Questions**。\n- 3. 点击**依赖**链接，查看必须先安装哪些模块。\n- 4. 返回可用模块列表（**扩展\
  \ | 模块管理器**），选择字母 **C**。找到模块 **CGExtensions**，然后点击**下载并安装**链接。模块 **CGExtensions**\
  \ 将被安装。\n- 5. 返回可用模块列表（**扩展 | 模块管理器**），再次选择字母 **Q**。找到 **Questions** 模块。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_150_0.png)\n\
  \n\n\n\n## 刚才发生了什么？\n\n您已经安装了一个新模块。**Questions** 模块现在可用于您的 CMS Made Simple 网站的每个页面或模板。您也可以在管理控制台（**Extensions\
  \ | Modules**）的已安装模块列表中找到 **Questions** 模块。\n\n您安装的每个模块都可以通过使用 Smarty 标签 `{cms_module\
  \ ...}` 在页面或模板的内容中使用。此标签有一个必需的参数 `module`，其值设置为模块的名称，如模块列表（**Extensions | Modules**）中所示。通常，所有模块都可以使用此标签：\n\
  \n```\n```smarty\n{cms_module module=\"MODULE_NAME\"}\n```\n```\n\n只需将 `MODULE_NAME`\
  \ 替换为已安装模块的名称，即可查看该模块的默认行为。**Questions** 模块显示 FAQ，这些 FAQ 可以在管理控制台（**Content | Questions\
  \ and Answers**）中创建、编辑、删除和分类。如何构建 FAQ 不言自明（使用 **Add New Question** 链接添加新的问答对）。请使用已安装模块列表（**Extensions\
  \ | Modules**）中的 **Help** 链接查找一些用法示例和 **Questions** 模块的附加参数。\n\n例如，如果您不喜欢问答列表中的筛选表单，可以使用如下所示的\
  \ `nofilter` 参数将其移除：\n\n```\n```smarty\n{cms_module module=\"Questions\" nofilter=\"\
  yes\"}\n```\n```\n\n有些模块有简短形式，可以仅通过其名称调用。\n\n| 简短形式 | 长形式 |\n|---|---|\n| `{news}`\
  \ | `{cms_module module=\"News\"}` |\n| `{search}` | `{cms_module module=\"Search\"\
  }` |\n| `{menu}` | `{cms_module module=\"MenuManager\"}` |\n| 不可用 | `{cms_module\
  \ module=\"Questions\"}` |\n\n功能上没有区别。每个模块都可以使用长形式，但只有部分模块实现了简短形式。请参阅 **Help** 模块以确定简短形式是否可用。\n\
  \n## 使用 XML 文件安装模块\n\n在某些网络托管环境中，无法连接到外部资源（如 CMSMS Forge）。在这种情况下，您将无法在可用模块列表中看到任何模块。不过，如果您下载模块的\
  \ XML 安装文件，也可以手动安装模块。\n\n## 使用核心模块\n\n要找到模块安装文件，请打开 CMSMS Forge（http://dev.cmsmadesimple.org）并搜索所需模块。点击模块名称，然后选择模块名称右侧的\
  \ **Files** 选项卡。在显示的文件列表中找到最新的 XML 文件，并将其保存到本地磁盘。在管理控制台中，点击 **Extensions | Modules**，然后在模块列表下方的\
  \ **Upload** 字段中选择保存的 XML 文件。点击 **Submit**，该模块将显示在模块列表中。但是，它尚未安装。点击模块旁边的 **Install**\
  \ 链接以完成安装。现在您可以像通过 **Module Manager** 自动安装一样使用它。\n\n## 可用升级\n\n不时会发布具有新功能或错误修复的新版本。在\
  \ **Available Upgrades** 选项卡中，您可以查看哪些已安装模块有比系统上安装的版本更新的版本。\n\n要升级模块，请在 **Available\
  \ Modules** 选项卡的列表中搜索其名称，然后点击在 **Download & Install** 链接位置显示的 **Upgrade** 链接。升级之前，请备份您的网站，以便在出现问题时能够回滚。\n\
  \n## 如何找到最适合您需求的 CMS Made Simple 模块\n\nCMS Made Simple 有很多模块，但并非所有模块都具有相同的质量。模块的版本通常表示其成熟程度。以\
  \ 0 开头的模块版本（如 0.3 或 0.5）是 alpha 版本。这意味着这些模块处于测试的初始阶段，可能会表现出一些错误或意外行为。如果您不是技术人员，请谨慎使用这些模块。\n\
  \n在 **Available Modules（Extensions | Module Manager）** 列表中，模块名称旁边的 **About** 链接会告知您该模块最新版本的发布时间。如果最后发布日期是\
  \ 2006 年或 2007 年，则可能表明该模块不再有开发空间，并且已被其开发人员放弃。在这种情况下，最好寻找另一个模块，或者自行承担风险使用这个模块。\n\n\
  **Help** 链接为您提供有关模块功能的扩展信息。请参阅 **parameter** 部分，以确定您的需求是否可以通过所讨论的模块解决。\n\n## 卸载和移除模块\n\
  \n所有您不需要的模块都可以从模块列表（**Extensions | Modules**）中卸载。如果您不需要该模块并卸载它，则其中保存的所有数据都将丢失。模块本身将变为非活动状态，但仍会显示在模块列表中。从列表中移除模块时，您也会从网站中物理删除相关的模块文件。\n\
  \n您不能移除核心模块，因为它们是 CMS Made Simple 标准安装的一部分。\n\n## 小测验 – 使用核心模块\n\n+   1. 全局内容块的主要功能是什么？\n\
  +      a. 它可以将重复的文本和图片添加到您的网站。\n+      b. 它可以在不同页面上放置不同的公司地址（总部和子公司）。\n+      c.\
  \ Smarty 标签必须添加到模板中。\n+      d. 全局内容块必须通过 Module Manager 安装。\n+   2. 如果新闻中的摘要文本未填写，会发生什么？\n\
  +      a. 您只能将其放在“通用”类别中。\n+      b. 整个文本将显示在网站的新闻部分。\n+      c. 新闻将不会显示在网站的新闻部分。\n\
  +      d. 没有摘要，您无法保存新闻。\n+   3. File Manager 用于存储文件的标准文件夹是哪个？\n+      a. uploads\n\
  +      b. downloads\n+      c. images\n+      d. 没有标准文件夹。\n+   4. 哪种图像格式不应在网站中使用？\n\
  +      a. JPEG\n+      b. GIF\n+      c. TIFF\n+      d. PNG\n+   5. 为了打印 PDF 文档，您必须\
  \ ...\n+      a. 使用 Smarty 标签 {pdf_onpage pdf=\"true\"}。\n+      b. 首先下载 Adobe Reader。\n\
  +      c. 确保您的访问者已安装 Acrobat。\n+      d. 使用 Smarty 标签 {print pdf=\"true\"}。\n\n\
  ## 使用核心模块\n\n+   6. 如何找到最佳的 CMSMS 模块？\n+   \n+      a. 确保它是 alpha 版本，因为 alpha 每次都是高质量的代名词。\n\
  +   \n+      b. 确保最后发布日期不太久远，因为您可以确定开发人员仍在维护该模块。\n+   \n+      c. 确保最后发布日期至少在 18\
  \ 个月前，因为您可以确定开发人员制作了一个稳定的模块。\n+   \n+      d. 确保模块的版本至少以 0.5 开头，因为 0.3 或更早的版本不稳定。\n\
  \n## 动手实践 – 应用自定义到核心模块\n\n您可以根据个人需求在网站中集成新闻、搜索和打印功能。使用每个模块的 **Help** 部分来了解如何自定义它。使用模块模板来调整每个模块的布局以符合您的设计。完成后，结果将是一个使用\
  \ CMS Made Simple 构建的初级网站。如果您没有其他需求，可以到此为止。恭喜！您几乎已经准备好网站，现在可以填充内容并发布了。\n\n## 总结\n\
  \n在本章中，您学习了如何使用和自定义随 CMS Made Simple 安装的标准模块（核心模块）。\n\n具体来说，我们涵盖了：\n\n+   - 如何在页面中使用全局内容块。全局内容块并不是真正的模块，而是一个额外的功能，可用于在网站的不同位置显示相同的内容。\n\
  +   - 使用新闻功能向网站添加新闻文章，将它们放入不同类别，并根据类别在网站的不同位置显示它们。\n+   - 使用和自定义用于网站页面或新闻文章内容的搜索功能。\n\
  +   - 使用 **Image Manager** 将图像上传到网站、在线编辑图像，并在网站的内容或模板中使用它们。\n+   - 使用 **Menu Manager**\
  \ 在内容中显示网站结构的任何部分。您学习了如何创建站点地图或任何动态页面列表。\n\n\n\n\n\n- 使用 **Printing** 模块即可在无需任何特殊知识的情况下创建网站页面的打印版本，甚至创建网站的\
  \ PDF 版本。\n- 使用 **Module Manager** 安装第三方模块，从而为网站添加新功能，如 FAQ 功能。我们将在第 7 章 *Using\
  \ Third-party Modules* 中学习更多模块。\n\n对于每个模块，你都看到了强大的“模板中模板”概念如何让你完全自定义每个模块模板的外观和感觉。通过结合\
  \ Smarty 标签、HTML 和 CSS，你没有任何设计限制，可以在网站上使用任何复杂度的设计。\n\n现在我们已经学习了模块，我们准备学习用户在网站管理控制台中可以拥有的角色和权限——这是下一章的主题。\n\
  \n## Chapter 4: Advanced Concepts in Modern Computing Systems\n\n本章探讨了现代计算架构的基础原理，重点关注分布式系统、并发和容错。这里介绍的材料建立在前几章建立的基础知识之上，并为读者准备系统设计中的高级主题。\n\
  \n分布式系统中的一个关键挑战是在确保高可用的同时在多个节点之间保持一致性。已经提出了各种共识算法来解决这一矛盾，每种算法在部分故障条件下在安全性、活跃性和性能之间做出不同的权衡。\n\
  \n在本节中，我们考察复制在实现持久性和可用性方面的作用。主要方法包括同步复制，其中每次写入必须在完成前得到所有副本的确认，以及异步复制，它提供更高的吞吐量，但以在故障切换场景中可能丢失数据的代价为交换。\n\
  \n- 强一致性保证线性化语义\n- 最终一致性提供更好的可用性\n- 因果一致性保留相关事件的顺序\n- 读已提交隔离用于宽松的事务语义\n\nCAP 定理指出，分布式数据存储无法同时提供以下三个保证中的超过两个：一致性、可用性和分区容错。在实践中，网络分区是不可避免的，因此系统设计者在发生故障时必须在一致性和可用性之间做出选择。\n\
  \n实际系统通常采用混合方法，在分区内提供强一致性，在分区之间提供最终一致性。这允许应用程序在本地操作中保持正确性，同时在网络中断期间接受暂时性的分歧。\n\n\
  > 分布式系统的特征是没有全局时钟以及独立故障的可能性。—— Leslie Lamport\n\n我们最后讨论了在生产环境中部署此类系统的操作考虑，包括监控、负载均衡和优雅降级策略。\n\
  \n### Understanding users and their roles\n\n**角色** 是按用户需要能够在网站上执行的一般任务分组的权限集合。**编辑**\
  \ 可能负责创建、重新组织和编辑页面。**设计师** 不需要任何页面操作的权限，但需要创建和编辑模板（包括模块模板）的权限。**管理员** 是拥有管理控制台中所有权限并可无限制访问整个管理控制台的人。\n\
  \n在 CMS Made Simple 中，默认建议三种角色——编辑、设计师和管理员。在安装 CMS Made Simple 期间创建的第一个用户默认获得管理员角色。此用户无法被删除、停用或从管理员组中移除，否则网站将完全没有管理员。你应该选择此用户的名称并注意密码强度。管理员组成员自动获得所有权限。\n\
  \n让我们看看如何创建新用户并了解每个用户无论其角色如何都拥有的最少功能。\n\n### Time for action – creating a new user\n\
  \n1. 在管理控制台中，点击 **Users & Groups | Users.**\n2. 点击 **Add New User**，并填写字段，如以下屏幕截图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_159_0.png)\n\n3. 点击 **Submit**。\n4. 注销\
  \ (**CMS | Logout**) 并以 **Peter** 身份登录。管理控制台现在应如下屏幕截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_160_0.png)\n\
  \n### What just happened?\n\n你已创建了一个新用户且未将其分配到任何组。此用户可以登录管理控制台。用户只能访问两个主菜单项——**CMS**\
  \ 和 **My Preferences**。用户可以在 **My Account** 部分更改其姓名、密码和电子邮件地址。他可以定义个人偏好，例如语言、管理模板、设置管理控制台的默认起始页等。他还可以管理个人快捷方式。\n\
  \n为每个用户定义电子邮件地址很重要，因为此电子邮件用于在用户忘记密码时恢复密码。在 CMS Made Simple 管理控制台的登录屏幕上（当你未登录时），你会找到\
  \ **Forgot your password** 链接。点击它，在 **Username** 字段中输入 **Peter**，然后点击 **Submit**。一封电子邮件将被发送到与此用户关联的电子邮件地址。如果未为此用户设置电子邮件地址，则无法自动恢复密码。在这种情况下，只有网站管理员可以重置用户的密码。\n\
  \n### Users and Permissions\n\n网站管理员可以通过点击 **Active (Users & Groups | Users)** 列中的绿色勾号图标将任何用户设为非活动状态。用户账户不会被删除，但用户在账户重新激活之前无法登录管理控制台。如果你删除用户，所有权限和个人用户偏好将被不可逆地移除。\n\
  \n如果用户未分配到任何组，则他只能更改个人设置之外的任何操作。让我们将用户 **Peter** 分配到编辑组，看看他作为编辑将被允许执行哪些任务。\n\n###\
  \ Time for action – assigning a user to a group\n\n1. 在管理控制台中，点击 **Users & Groups\
  \ | Users**。\n2. 通过点击其用户名选择用户 **Peter** 进行编辑。\n3. 在屏幕底部选中 **Editor** 复选框，如以下屏幕截图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_161_0.png)\n\n4. 点击 **Submit**。\n5. 注销\
  \ (**CMS | Logout**) 并以 **Peter** 身份登录。管理控制台应如下屏幕截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_162_0.png)\n\
  \n### What just happened?\n\n你已为用户授予了额外权限。现在，他可以访问名为 Content 的新菜单项。没有内容页面，只有 Peter\
  \ 可以提交的新闻。让我们看看 Peter 现在有哪些权限。在管理控制台中，点击 Users & Groups | Group Permissions。在第一列中列出了所有可用权限。在权限右侧，有三列，分别对应每个组——Admin、Editor\
  \ 和 Designer。你可以通过从表格顶部的下拉列表中选择组来将视图限制为仅一个组。\n\n查找 Editor 列中所有选中的复选框，以查看分配给此组的用户获得哪些权限。你可以看到，仅为该组选中了\
  \ Modify News 权限。这意味着用户可以创建新闻文章并编辑现有新闻。当用户创建新项目时，新闻会自动保存为草稿，因此只有页面管理员或拥有 Approve\
  \ News For Frontend Display 权限的用户才能在网站上发布该文章。\n\n\n\n\n\nPeter 不允许删除新闻文章（权限 **删除新闻文章**），并且无权访问内容页面（权限\
  \ **修改任何页面** 或 **管理所有内容**）。\n\n## 内容权限\n\n由于 CMS Made Simple 的目标是内容管理，因此内容编辑权限最为灵活。你可以随心所欲地创建和管理任意数量的网站编辑者。此外，你还可以创建具有不同访问级别的编辑者，从而彻底区分谁可以在你的网站上执行哪些操作。\n\
  \n例如，权限 **管理所有内容** 将赋予该组完整访问 **内容 | 页面** 中管理员帐户可用的所有功能的权限。被分配到该组的用户可以：\n\n- 创建新页面\n\
  - 重新排序并在层级中移动页面\n- 将页面设为不活跃或阻止其显示在导航中\n- 更改网站的默认页面\n- 删除页面\n- 编辑页面，包括 **选项** 选项卡中的所有信息\n\
  \n要限制上述功能，你可以授予权限 **修改任何页面**。该权限只允许我们编辑内容。拥有此权限的用户不会看到 **选项** 选项卡，因此 **选项** 选项卡中的任何信息都无法更改。\n\
  \n除最后一个权限外，你可以允许从 **选项** 选项卡中开放某些字段，以使编辑者能够更改模板或将页面标记为不活跃。\n\n## 动手实践——创建编辑者帐户\n\
  \n公司页面将由办公室助理 Mary 编辑。办公室助理必须能够编辑现有页面、编辑元标签、分配模板，并将页面设置为不活跃。\n\n- 1. 在管理控制台中，创建一个新用户（**用户和组\
  \ | 用户**），并将该用户分配到 **编辑者** 组，如以下截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_164_0.png)\n\
  \n- 2. 点击 **提交**。\n- 3. 修改 **编辑者** 组的权限（**用户和组 | 组权限**），并勾选 **修改任何页面** 复选框。\n- 4.\
  \ 点击 **提交**。\n- 5. 在管理控制台中，点击 **站点管理 | 全局设置**，然后选择 **高级设置** 选项卡。\n\n## 用户和权限\n\n\
  - 6. 在 **基本属性** 字段中，选择 **模板**、**活跃** 和 **页面特定元数据** 选项，如以下截图所示（按住 *Ctrl* 键同时标记三个选项）：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_165_0.png)\n\n- 7. 点击 **提交**。\n- 8. 注销（**CMS\
  \ | 注销**），然后以 **Mary** 身份登录。检查打开页面进行编辑时，所有所需功能是否可用。\n\n## 刚刚发生了什么？\n\n你创建了一个新用户，并将该用户分配到\
  \ **编辑者** 组。该组被允许编辑网站的任何页面。此外，字段 **模板**、**活跃** 和 **页面特定元数据** 在 Mary 编辑内容时对她可用。\n\
  \n> \U0001F4A1 你的模板应该在 head 部分包含一个 Smarty 插件 `{metadata}`，以便 **页面特定元数据** 能够被放入页面的源代码中。\n\
  \n请注意，权限 **修改任何页面** 并不赋予你限制访问特定页面的能力。如果 Mary 不被允许编辑网站上的每个页面，而只被允许编辑其中一些页面，那么你应该转向附加编辑者的概念，这将在下一节中描述。\n\
  \n## 附加编辑者\n\n对于每个内容页面，都可以定义**附加编辑者**。你可以在 **选项** 选项卡的 **附加编辑者** 字段中为某个页面添加附加编辑者（必须以管理员身份登录才能执行此操作）。页面的附加编辑者将只能看到和编辑他被分配到的页面。\n\
  \n为了在我们的示例中解释这一点并使其更具实用性，假设 Mary 不被允许编辑所有页面，而只被允许编辑 **历史**、**团队** 和 **联系我们** 页面。将\
  \ Mary 从 **编辑者** 组（**用户和组 | 组分配**）中移除，方法是取消选中与 Mary 帐户对应的组。然后打开前面列出的三个页面，并在每个页面的\
  \ **选项** 选项卡中的 **附加编辑者** 字段中分配 Mary。现在，以 Mary 身份登录，并打开内容页面列表（**内容 | 页面**）。\n\n附加编辑者会自动获得\
  \ **修改任何页面** 权限，但仅限于他们被设置为附加编辑者的页面。你不需要为此类用户设置任何特殊组或权限。和所有附加编辑者一样，Mary 不允许创建新页面。\n\
  \n## 创建新页面\n\n**添加页面** 权限取决于用户拥有的其他权限。仅仅为编辑者添加 **添加页面** 权限是不够的。这是因为创建新页面会自动影响整个网站结构。请记住，导航完全由现有页面构建。\n\
  \n只有拥有 **管理所有内容** 权限的组才被允许在网站结构的每一级创建页面。请注意，这些用户不仅能够创建新页面，还能通过重新排序甚至删除页面来修改整个网站结构。\n\
  \n## 动手实践——添加页面权限\n\n假设 Mary 不仅被允许编辑某些页面，还被允许在层级中的特定位置创建页面。但是，Mary 仍然不被允许在网站顶层创建页面。在上一个示例中，我们将\
  \ Mary 添加为某些页面的附加编辑者。现在让我们赋予她创建新页面的权利。\n\n- 1. 在管理控制台中，点击 **用户和组 | 组**，并创建一个名为 **附加编辑者**\
  \ 的新组。\n\n> 如果你希望在编辑者创建的页面显示在网站菜单之前对其进行审批，请点击 **站点管理 | 页面默认值**，并取消选中 **在菜单中显示**\
  \ 字段。这样，所有新创建的页面都不会显示在导航中。默认情况下，编辑者无法更改这些设置。他/她必须等待网站管理员或拥有 **管理所有内容** 权限的用户将该页面显示在菜单中。\n\
  \n以同样的方式，你可以授予 **删除页面** 权限。将该权限分配给 **附加编辑者** 组，以便他们只能删除那些他们被分配为编辑者的页面。\n\n## 设计者权限\n\
  \n如果你有一个精通 HTML 和 CSS 的用户，能够对网站的整个布局或仅对模块模板进行合理的更改，那么你可以将该用户分配到 **设计者** 组。\n\n设计者必须拥有以下一组权限：\n\
  \n- 添加样式表关联\n- 添加样式表\n- 添加模板\n- 管理菜单\n- 管理主题\n- 修改文件\n- 修改样式表关联\n- 修改样式表\n- 修改模板\n\
  - 删除样式表关联\n- 删除样式表\n- 删除模板\n- 查看标签帮助\n\n这组权限允许网站设计者执行与模板设计相关的任何任务。但是，设计者将无法编辑内容、提交新闻或设置任何站点偏好。\n\
  \n在管理控制台（站点管理 | 全局设置）中，在 **高级设置** 选项卡下，你可以为附加编辑者定义 **基本属性**，例如 图像。我们在上一章中使用过该字段。在这里，编辑者可以从下拉列表中选择一张图片，从而将图像分配到由设计者定义的模板中的某个位置。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_170_0.png)\n\n有一个有用的第三方模块叫做 Template\
  \ Externalizer。它允许你使用任何外部编辑器来编辑模板和样式表。安装并启用开发模式后，该模块会自动将所有样式表和模板提取到指定目录。\n如果你在此外部目录中修改模板，更改会自动被检测到，导入数据库，并立即生效。当模块被安装后，会有一个权限\
  \ **Template Externalizer** 可以被授予 **设计者** 组。\n\n## 查看管理员日志\n\n管理员日志记录了所有用户对网站所做更改的详细信息。该日志可以在管理控制台（站点管理\
  \ | 管理员日志）中找到，并包含关于以下内容的创建、删除和更改记录：\n\n- 页面和全局内容块\n- 模板和样式表\n- 用户、组和权限\n- 站点偏好\n\
  - 模块\n\n在日志的顶部，你会看到一个导航区域，提供指向日志首页、下一页、上一页和末页的链接。还有一个链接可以将完整日志下载为以制表符分隔的文本文件。底部是\
  \ **清除管理员日志** 链接。该操作将清除整个日志。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_170_1.png)\n\
  \n重要！执行 **清除管理员日志** 时不会要求你确认，并且此操作一旦完成便无法撤销。\n\n一旦管理员日志被清除，就没有证据表明谁更改了网站上的任何内容以及更改了什么。因此，甚至还有一个单独的权限叫做\
  \ **清除管理员日志**，它独立于 **修改站点偏好** 权限被授予。\n\n\n\n\n\n每个日志条目包含五列，分别是：\n\n- **User**：显示执行该操作的用户用户名。即使用户后来被删除，用户名仍保存在日志中。\n\
  - **Item ID**：显示受影响项目的数据库 ID。请注意，项目 ID 仅对下一列中显示的 **Item Name** 唯一，而非在整个数据库中唯一，因此同一个项目\
  \ ID 可能会重复出现。\n- **Item Name**：显示受影响项目的名称。\n- **Action**：描述对项目所做的更改类型。\n- **Date**：保存更改所做的日期和时间。\n\
  \n如果您有新手用户可以访问管理控制台，那么您可能希望保留所有版本的內容，以便在出现问题时可以恢复它们。CMS Made Simple 的标准安装中没有此功能，但有一个不错的第三方模块可以额外安装。\n\
  \n## 归档更改并恢复它们\n\n一旦安装了 **Archiver** 模块，它就会保存每个被编辑或删除的内容页面、全局内容块、样式表或模板的副本。它还提供了将归档中的任何内容恢复到当前状态的可能性。这意味着您的用户可以编辑网站的各个方面，而您可以稍后撤销他们的更改。\n\
  \n要安装 **Archiver** 模块，请打开管理控制台，然后点击 **Extensions | Module Manager**。点击 **Available\
  \ Modules** 选项卡，然后点击与模块名称同一行中的 **Download & Install** 链接。模块即已安装。\n\n安装后，模块将自动开始将更改保存到归档中。例如，如果您想跟踪首页的更改，请打开该页面并在不做任何更改的情况下保存它，以便创建该页面的第一个版本。此版本将用作未来恢复的基础。\n\
  \n### 行动时间 – 恢复编辑者所做的更改\n\n假设您已按上述说明安装了 Archiver 模块，您可以按如下方式恢复编辑者所做的更改：\n\n1. 以编辑者身份登录并编辑您有权编辑的任何页面。\n\
  2. 注销然后再次使用管理员账户登录。\n3. 点击 Content | Archive Manager Module。\n4. 搜索步骤 1 中已编辑的页面的名称，然后点击它。\n\
  5. 在 Expanded Archive View 中，找到该页面的倒数第二个版本（修订版）并点击 Operation 列中的最后一个图标。\n6. 查看该页面。\n\
  \n### 发生了什么？\n\n您已将内容的旧版本恢复并使其成为当前版本。编辑者的版本并未被删除，只是被替换，因此您可以随时将其恢复。\n\n您可以按每个项目的存储版本数量自动清理归档（即仅保留每个页面、全局内容块、样式表或模板的最后五个版本）或按日期清理（即仅保留最近七天的版本）。要设置自动清理，请在模块的管理区域中点击\
  \ Archive Preferences 链接（Content | Archive Manager Module）。\n\n您不必清理归档，也可以一直累积所有更改。但是，如果您每天有大量更改，则必须清理归档以防止数据库溢出。\n\
  \n> 该模块不能替代常规的异地数据库备份。数据仍存储在同一数据库中，数据库崩溃可能会使归档变得无用。请阅读第 11 章《Administration and\
  \ Troubleshooting》中的相应部分，了解如何创建数据库备份。\n\n## 所有默认权限的概述\n\n权限始终授予组，并由分配给该组的所有用户共享。在下表中，第一列是权限名称，第二列是对该权限可授予角色的建议，第三列建议该权限生效的一些前提条件。\n\
  \n| Permission | Suggestion for the role | Description |\n|---|---|---|\n| Add Global\
  \ Content Blocks | Editor | 该组允许创建新的全局内容块（Content \\| Global Content Blocks）。取决于权限\
  \ Modify Global Content Blocks。 |\n| Add Groups | Admin | 该组允许创建用户组（Users & Groups\
  \ \\| Groups）。取决于权限 Modify Groups。 |\n| Add Pages | Editor | 该组允许在用户是所有者或额外编辑的页面下创建子内容页面。用户必须被设为页面的所有者或额外编辑。\
  \ |\n| Add Stylesheet Associations | Designer | 该组允许将样式表与模板关联。 |\n| Add Stylesheets\
  \ | Designer | 该组允许创建新的样式表。 |\n| Add Templates | Designer | 该组允许创建新的模板。 |\n| Add\
  \ Users | Admin | 该组允许创建具有管理控制台访问权限的新用户。 |\n| Allow usage of advanced profile in\
  \ TinyMCE | Editor | 该组中的用户将自动获得为 TinyMCE 模块制作的高级配置文件设置。但是，他们无法更改配置文件本身。 |\n| Approve\
  \ News For Frontend Display | Editor | 允许将新闻项的状态字段从 Draft 更改为 Published。该组中的用户也可以编辑新闻文章。\
  \ |\n| Clear Admin Log | Admin | 清除 Site Admin \\| Admin Log 中的历史记录。取决于权限 Modify\
  \ Site Preferences。 |\n| Delete News Articles | Editor | 该组允许删除新闻文章。取决于权限 Modify\
  \ News。 |\n| Manage All Content | Editor | 该组允许创建、移动和删除页面。该组允许在编辑页面时访问 Options 选项卡并更改该选项卡上可以找到的任何内容，与权限\
  \ Modify Any Page 相比。 |\n| Manage Menu | Designer | 该组可以修改菜单模板并创建新的菜单模板。 |\n| **Manage\
  \ Themes** | Designer | 该组允许导出主题。如果存在依赖权限，用户也可以导入主题。取决于权限 **Add Stylesheet Associations**、**Add\
  \ Stylesheets** 和 **Add Templates**。 |\n| **Modify Any Page** | Editor | 该组允许编辑内容页面。编辑内容时没有\
  \ **Options** 选项卡。但是，一些来自 **Options** 选项卡的字段可以从 **Site Admin \\| Global Settings**（选项卡\
  \ **Advanced Setup**，字段 **Basic Properties**）中添加。 |\n| **Modify Events** | Admin\
  \ | 该组允许添加和重新排序事件（请参阅第 8 章）。 |\n| **Modify Files** | Editor | 允许使用 **File and Image\
  \ Manager**，从而完全访问安装的 `/uploads` 文件夹。 |\n| **Modify Global Content Blocks** | Editor\
  \ | 允许编辑和删除全局内容块。 |\n| **Modify Group Assignments** | Admin | 允许将用户分配到不同的组。 |\n\
  | **Modify Groups** | Admin | 允许更改组名。 |\n| **Modify Modules** | Admin | 允许管理 **Extensions\
  \ \\| Modules** 和 **Extensions \\| Module Manager**，从而安装、升级、卸载和删除模块。 |\n| **Modify\
  \ News** | Editor | 允许编辑新闻并创建状态为 **Draft** 的新文章。 |\n| **Modify Permissions for Groups**\
  \ | Admin | 允许修改组的权限。 |\n| **Modify Site Preferences** | Admin | 这是一组多个权限，包括不同模块中的\
  \ **Preferences**、**Settings** 或 **Options** 选项卡。例如，用户能够访问 **News** 模块的 **Options**\
  \ 选项卡、**File Manager**、**CMSMailer** 中的 **Settings** 选项卡、**Search** 模块中的 **Options**\
  \ 选项卡等。 |\n| **Modify Stylesheet Associations** | Designer | 允许将样式表附加到模板并解决附加关系。\
  \ |\n| **Modify Stylesheets** | Designer | 允许编辑现有样式表。 |\n| **Modify Templates**\
  \ | Designer | 允许编辑现有模板，包括 **News**、**Search** 和 **Printing** 模块中的模板。 |\n| **Modify\
  \ User-defined Tags** | Admin | 允许向网站添加用户定义标签（请参阅第 10 章）。 |\n\n\n\n\n\n## 用户与权限\n\
  \n| 权限 | 角色建议 | 描述 |\n|---|---|---|\n| **修改用户** | 管理员 | 允许编辑用户，管理员用户账户除外。 |\n| **移除全局内容块**\
  \ | 管理员 | 允许编辑全局内容块。依赖**修改全局内容块**权限。 |\n| **移除用户组** | 管理员 | 允许删除用户组。 |\n| **移除页面**\
  \ | 编辑者 | 允许删除用户是**所有者**或**附加编辑者**的内容页面。 |\n| **移除样式表关联** | 设计者 | 允许移除样式表关联。 |\n\
  | **移除样式表** | 设计者 | 允许移除样式表。 |\n| **移除模板** | 设计者 | 允许移除布局模板，但不包括模块模板。 |\n| **移除用户**\
  \ | 管理员 | 允许移除用户，自己的账户和管理员账户除外。 |\n| **文件管理器模块的高级用法** | 管理员 | 允许查看网站的完整结构，而不仅仅是\
  \ `/uploads` 目录。要使用此权限，需要在**文件**中启用高级模式设置。 |\n| **查看标签帮助** | 编辑者 | 允许阅读自定义 Smarty\
  \ 插件的帮助。 |\n\n## 模块权限\n\nCMS Made Simple 的核心功能和核心模块不仅拥有权限，你页面上安装的每个第三方模块也可以将该模块的特定权限添加到列表中。如果你仍然安装了上一章所述的**问答**模块，你将在权限列表（**用户与群组\
  \ | 群组权限**）中找到 **管理问题**、**可以回答问题** 和 **可以批准问题** 权限。\n\n**归档**模块拥有**管理归档**权限，该权限可以被授予能够访问管理控制台的高级用户，或拥有**管理所有内容**权限的主编辑。\n\
  \n## 用户通知\n\nCMS Made Simple 的管理控制台中有一个通知区域，位于主菜单下方。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_176_0.png)\n\
  \n在安装 CMS Made Simple 之后，你会看到该消息，提示你保护和配置系统的后续步骤。之后，当 CMS Made Simple 发布新版本时，该区域会用于通知我们。**新闻**模块会使用该区域来通知是否有未发布的新闻文章需要批准和发布。\n\
  \n通常，每个登录到管理控制台的用户都能阅读这些通知，即使某些通知并不是专门针对他本人的。\n\n你可以在管理控制台中禁用通知。点击**站点管理 | 全局设置**，选择**高级设置**选项卡。取消选中**允许用户查看通知**字段，消息就会消失。\n\
  \n### 小测验 – 用户与权限\n\n- 1. 什么是角色？\n  - a. 一组权限。\n  - b. 仅针对编辑者的另一个术语。\n  - c. 特殊访客组的术语。\n\
  \  - d. 访客的一个术语，可以定义其读取特定内容的权限。\n\n## 使用第三方模块\n\n*CMS Made Simple 只有一些属于标准安装的基础功能。任何其他功能都可以通过安装其他模块来实现。将\
  \ CMS Made Simple 的模块看作是乐高积木。你可以选择任意组合来安装模块。有些模块可以与其他模块组合，甚至依赖其他模块。模块是任何人都可以添加到网站上的附加功能。*\n\
  \n要选择并安装新模块，请在管理控制台中点击**扩展 | 模块管理器**。请注意，这里列出的模块并非 CMS Made Simple 的标准模块，因此并非所有模块都与核心模块具有相同的质量。这就是为什么你会看到模块列表上方有“*自行承担风险使用*”的消息。尽管如此，仍有许多模块非常实用、精致，并且经过了开发者的全面测试。\n\
  \n**可用模块**选项卡便于安装你已经了解过的软件包。模块按名称字母顺序排序，点击模块名称旁边的**帮助**链接可以找到关于它们的详细说明。\n\n在本章中，我们将安装并使用以下模块：\n\
  \n- - 相册（Gallery）\n- - 表单构建器（Form Builder）\n- - 新闻通讯（Newsletter）\n- - YouTube 视频\n\
  \n那么，让我们开始吧……\n\n## 创建相册\n\n网站上最受欢迎的功能就是相册。相册是个人作品集、乐队网站或公司网站中常见的组成部分。在商业网站上，相册常用于展示办公楼或团队成员的照片。产品、样品或项目成果也经常以相册的形式呈现。\n\
  \n如果你不使用任何专门的相册模块，你可以将全部图片上传到虚拟主机上的一个文件夹中，然后手动将每张图片添加到内容页面中。这种静态相册难以维护和设计。它不够灵活，并且要求页面编辑者具备深厚的\
  \ HTML 知识。\n\n更好的解决方案是使用一个专门的模块，它读取虚拟主机上的文件夹，并通过一些令人惊艳的过渡效果显示该文件夹中的所有图片。该模块会提供一个专门的管理区域，可以在其中输入每张图片的说明。\n\
  \n要安装 Gallery 模块，请登录管理控制台并点击“扩展 | 模块管理器”。在“可用模块”选项卡中，点击字母导航中的字母 G，找到名为 Gallery 的模块。点击模块名称对应的“下载并安装”链接。模块将被安装。\n\
  \n安装 Gallery 模块后，虚拟主机上会自动创建一个名为 uploads/images/Gallery 的新文件夹。该文件夹默认为空，因此你需要向其中上传一些图片。你可以使用图片管理器或文件管理器上传图片，如果有很多图片要上传，甚至可以使用\
  \ FTP 浏览器上传。\n\n## 动手实践 – 创建第一个相册\n\n让我们看看 uploads/images/Gallery 文件夹中的图片如何显示在“相册”页面上。请执行以下步骤：\n\
  \n- 1. 在管理控制台中，打开“相册”页面以进行编辑（内容 | 页面）。\n- 2. 在“内容”字段中输入 Smarty 插件，如以下截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_181_0.png)\n\
  \n- 3. 点击**应用**，然后点击**应用**按钮旁边的放大镜图标，查看网站上的第一个相册。\n\n## 刚才发生了什么？\n\n你已将一些图片上传到 `/uploads/images/Gallery`\
  \ 文件夹。该文件夹是在模块安装后自动创建的。你的第一个相册会显示在**相册**页面上。\n\n你可以在管理控制台（**内容 | Gallery**）中找到 **Gallery**\
  \ 模块的管理区域。打开管理区域，点击名为 `Gallery` 的文件夹，查看可以在模块输出中修改哪些内容。根据需要更改**相册标题**和**评论**。为相册选择另一种**模板**以获得不同的过渡效果。如果没有为相册指定模板，则使用默认模板（**内容\
  \ | Gallery**，**模板**选项卡）。\n\n缩略图（图片的小预览版本）的尺寸设置为 96x96 像素（CMS Made Simple 中的标准缩略图尺寸）。在相册中，你可以输入自己的缩略图尺寸，然后选择以下任意一种调整大小的方法：\n\
  \n- - **裁剪**：将原始图像裁剪为缩略图尺寸，保留图像中较小的细节。忽略原始图像的比例。\n- - **缩放**：将原始图像调整为自定义缩略图尺寸。保持原始图像的比例，因此调整大小时仅考虑宽度或高度。\n\
  - - **放大并裁剪**：与“裁剪”相同，但图像细节会稍微放大。将原始图像裁剪为缩略图尺寸，同时保留放大后的图像细节。忽略原始图像的比例。\n- - **放大并缩放**：与“缩放裁剪”相同，但缩略图会稍微放大。将原始图像调整为自定义缩略图尺寸。保持原始图像的比例，因此调整大小时仅考虑宽度或高度。\n\
  \n当更改缩略图尺寸后，你必须点击**（重新）创建缩略图**链接，以创建新的缩略图。\n\n屏幕底部会显示已上传到 `uploads/images/Gallery`\
  \ 文件夹的图片列表。对于每张图片，你可以输入**标题**（图片说明）和**评论**（默认不在任何模板中显示）。你可以停用图片而不是删除它们。在这种情况下，图片不会显示在相册中，但标题和评论会被保留。\n\
  \n相册中的图片按其文件名按字母顺序排序。\n\n\n\n\n\n## 将相册添加到画廊\n\n新相册是从新文件夹创建的。在 File Manager 或 Image\
  \ Manager 中，在 uploads/images/Gallery 文件夹下方创建一个新文件夹。将您的图片上传到新文件夹中。在画廊的管理区域（Content\
  \ | Gallery）中，找到新文件夹，并像编辑主相册一样编辑它。\n\n要显示一个或多个目录中的图片，请使用参数 dir。该参数指定图片上传的目录（或目录）。例如，如果您在\
  \ /uploads/images/Gallery 下创建了两个文件夹并分别命名为 buildings 和 projects，那么要仅显示 buildings\
  \ 文件夹中的图片，请使用如下所示的 Smarty 标签：\n\n```\n{Gallery dir=\"buildings\"}\n```\n\n您可以通过在\
  \ Smarty 标签中添加参数 template 来直接覆盖画廊的模板。如果未指定此参数，则将使用分配给该目录的模板，否则将使用默认模板。\n\n## 在其他页面上使用画廊\n\
  \n在 Photo Gallery 页面之外，在其他页面上使用画廊中的图片。例如，在起始页面上显示画廊中最近添加的图片，并将它们链接到可以找到整个画廊的页面。\n\
  \n## 动手时间 – 将随机图片添加到模板\n\n让我们将画廊中最近添加的两张图片添加到网站的起始页面。\n\n- 1. 在管理控制台中，单击 Content\
  \ | Gallery，并选择 Templates 选项卡。\n- 2. 单击 Create a new template 链接。输入 Latest 作为模板名称，并在\
  \ Template Source 字段中添加以下 Smarty 代码：\n\n```\n{foreach from=$images item=image}\n\
  \    <a href=\"{cms_selflink href=\"photo-gallery\"}\" title=\"{$image->title}\"\
  ><img src=\"{$image->thumb}\" alt=\"{$image->title}\" />\n    </a>\n{/foreach}\n\
  ```\n\n您应该将示例中的 photo-gallery 替换为可以找到整个图片画廊的页面的别名。\n- 3. 删除字段 Template CSS-stylesheet\
  \ 和 Template JavaScript 中的所有内容。\n- 4. 单击 Save。\n\n5. 在管理控制台中，打开起始页进行编辑（Content |\
  \ Pages）。\n\n6. 添加 Smarty 标签以显示画廊中的最新图片，如以下屏幕截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_184_0.png)\n\
  \n7. 单击 Apply 并在起始页面上查看结果。\n\n## 发生了什么？\n\n您为 Gallery 模块创建了一个新模板。此模板显示画廊中最近添加的两张图片。每张图片都链接到\
  \ Photo Gallery 页面（{cms_selflink href=\"photo-gallery\"}）。然后，您已将 Smarty 标签 {Gallery\
  \ action=\"showlatest\" number=\"2\" template=\"Latest\"} 添加到起始页面。有三个参数，分别如下：\n\n\
  - action=\"showlatest\"：显示最近添加的图片（默认情况下显示总共六张图片）。子目录会自动包含在内。\n- number=\"2\"：要显示的图片的最大数量。如果未指定此参数的值，则将显示所有图片。\n\
  - template=\"Latest\"：使用单独的数据库模板来显示照片画廊。此模板必须存在。但是，它不必设为默认。如果未指定此参数，则将使用默认模板。\n\n\
  此代码取自文件 `example.html`，并已修改为使用 Smarty 标签 `foreach` 来获取画廊中的所有图片。\n\n继续进行样式表。在本地磁盘上打开文件\
  \ `jquery.ad-gallery.css`。此文件需要稍作修改，以便图片可以在服务器上找到。查找任何出现的：\n\n```\nbackground: url(\n\
  ```\n\n并将其替换为：\n\n```\nbackground: url(../../images/\n```\n\n然后，在第一行，调整整个画廊的宽度：\n\
  \n```\nad-gallery {\n  width: 500px;\n}\n```\n\n复制修改后的样式表的全部内容，并用其替换字段 **Template\
  \ CSS-stylesheet** 的内容。\n\n在最后一步，复制以下代码，并替换字段 **Template JavaScript** 中的全部内容：\n\n\
  ```\n<script type=\"text/javascript\"\n  src=\"modules/Gallery/templates/jquery/jquery.js\"\
  ></script>\n<script type=\"text/javascript\"\n  src=\"modules/Gallery/templates/adgallery/jquery.ad-gallery.js\"\
  >\n</script>\n<script type=\"text/javascript\">\n$(function() {\n  var galleries\
  \ = $('.ad-gallery').adGallery();\n  $('#switch-effect').change(\n    function()\
  \ {\n      galleries[0].settings.effect = $(this).val();\n      return false;\n\
  \    }\n  );\n  $('#toggle-slideshow').click(\n    function() {\n      galleries[0].slideshow.toggle();\n\
  \      return false;\n    }\n  );\n});\n</script>\n```\n\n单击 **Save**，并在模板列表中找到新模板。将模板设为\
  \ **Default** 并在网站上查看您的照片画廊。您的画廊现在正在使用 AD Gallery 插件。\n同样，您可以使用任何插件作为您的画廊。将 HTML、图片、CSS\
  \ 和 JavaScript 分开，并将它们放置在适当的字段中，以便所有必需的部分按之前的顺序在网站上组合。\n\n## 使用 Form Builder 模块添加表单\n\
  \n几乎每个业务页面都有联系、反馈或咨询表单。**Form Builder** 模块可帮助您在不编写任何 HTML 的情况下创建任何复杂程度的表单。您可以向其中添加不同的输入字段，设置验证规则，并定义表单数据的存储方式和/或通过电子邮件发送方式。\n\
  \n以与您在网站上安装其他第三方模块相同的方式安装 **Form Builder** 模块（例如，**Questions** 或 **Gallery**）。安装后，模块的管理区域可在\
  \ **Extensions | Form Builder** 中找到。\n\n在开始配置模块之前，请确保模块 **CMSMailer** 已正确配置（请参阅第\
  \ 2 章，*Getting Started*），并且您可以从您的 CMS Made Simple 网站发送电子邮件。\n\n## 动手时间 – 向网站添加联系表单\n\
  \n让我们向 **Contact Us** 页面添加一个简单的联系表单，并将表单提交的内容发送到我们的电子邮件地址。\n\n- 1. 在管理控制台中，单击 **Extensions\
  \ | Form Builder**。\n- 2. 单击 **Contact Form** 链接。\n- 3. 滚动到 **Form Fields**，并单击\
  \ **Send To** 链接。\n- 4. 将字段 \"**From address**\" for email 和 **Destination Email\
  \ Address** 中的电子邮件地址替换为您自己的真实电子邮件地址，如以下屏幕截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_187_0.png)\n\
  \n- 5. 单击 **Update** 以保存更改。\n- 6. 单击表单字段下方的 **Save**。\n- 7. 复制行 **Contact Form**\
  \ 中列 **Form Alias** 的 Smarty 标签，如以下屏幕截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_188_0.png)\n\
  \n- 8. 打开页面 **Contact Us** 进行编辑（**Content | Pages**）并将复制的 Smarty 标签添加到其中。\n- 9.\
  \ 单击 **Apply** 并查看页面。它应如下所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_188_1.png)\n\
  \n- 10. 填写表单并单击 **Submit Form**，您应该会收到一封从此联系表单发送到步骤 4 中给出的电子邮件地址的电子邮件。\n\n## 发生了什么？\n\
  \n您已向页面添加了一个简单的联系表单。此联系表单由字段集（所有字段周围的边框）、五个可见字段和 **Submit Form** 按钮组成。您已更改电子邮件地址，以确保表单结果通过电子邮件发送到正确的地址。此联系表单可以根据您的需要完全自定义。\n\
  \n编辑字段 **Your Email Address**。将其设为 **Required**，并在 **Field Validation** 选项中选择 **Email\
  \ Address**。这将确保访客必须提供有效的电子邮件地址，否则将显示错误消息。将字段 **Send User a Copy of Submission**\
  \ 的值设为 **Never**。如果您向访客发送消息副本，您将泄露目标电子邮件地址，并且可能会收到绕过反馈表单的 undesired 通信。更新该字段并返回到表单中的字段列表。\n\
  \n**Email Again** 字段是可选的。如果您愿意，可以将其删除。\n\n**Message** 字段被定义为 **Text Area**。这意味着网站访客可以在该字段中输入多行。可以通过设置\
  \ **Rows**（无滚动条时显示的行数）和 **Columns**（换行前一行显示的字符数）的数量来更改此字段的高度和宽度。字段的大小也可以使用 CSS 自定义。\n\
  \n对于每个表单，可以定义和配置不同类型的模板。您可以使用 HTML 和 Smarty 标签的组合，如您在第 4 章 *Design and Layout* 中所学。\n\
  \n| Template | Description |\n|---|---|\n| **Form Template** | 此模板定义表单应如何显示。打开 **Contact\
  \ Form (Extensions | Form Builder)**，并单击 **Form Template** 选项卡。一些默认模板可以从 **Load\
  \ Template** 下拉列表中选择。您也可以使用 **Form Template Variables** 部分中显示的说明和变量创建自己的模板。默认的 **Form\
  \ Template** 非常复杂。原因在于它包含了您可以为单个字段自定义的所有内容。 |\n| **Submission Template** | 此模板定义表单提交后响应消息应如何显示。打开\
  \ **Contact Form (Extensions | Form Builder)**，并单击 **Submission Template** 选项卡。自定义字段\
  \ **Response to display** 中的消息。您不需要在此字段中使用任何变量。我还建议删除部分 **Other information**，因为它对网站访客来说过于技术化。\
  \ |\n| **Email Template** | 此模板定义电子邮件消息应如何显示。打开 **Contact Form (Extensions | Form\
  \ Builder)**，并在字段列表中单击字段 **Send To**。选择 **Advanced Settings** 选项卡，向下滚动并单击按钮 **Create\
  \ Sample HTML Template**。现在，您可以在字段 **Email Template** 中编辑电子邮件消息。 |\n\n**Form Builder**\
  \ 不仅提供默认模板，还提供默认样式表。样式表在安装后会自动添加到 **Layout | Stylesheets**。如果您想使用它，请通过单击样式表列表中的蓝色\
  \ CSS 图标，将 **FormBuilder Default Style** 附加到 **Business World** 模板。您可以自定义附加的样式表以使表单适合您个人的页面布局。\n\
  \n\n\n\n\n## 使用第三方模块\n\n### 为表单添加新字段\n\n联系表单可以通过添加更多字段来丰富。让我们看看如何向表单添加单选按钮组、下拉组和复选框组。新的字段在\
  \ **Form Builder（扩展 | 表单构建器）** 的管理区域中创建。打开 **Contact Form** 进行编辑，然后点击字段列表下方的 **Add\
  \ New Field** 链接。然后你需要选择想要添加的 **Field Type**。\n\n每次向表单添加新字段时，你必须调整 **Email Template**\
  \ 和 **Submission Template**。新字段会自动添加到表单中，但不会添加到其他模板中。\n\n要更新 **Email Template**，打开\
  \ **Send To** 字段进行编辑，选择 **Advanced Settings** 选项卡，向下滚动页面，然后点击 **Create Sample HTML\
  \ Template** 按钮。在上方的 **Email Template** 字段中，你会看到用于发送消息的示例模板。按需编辑模板并点击 **Update**\
  \ 保存。这将自动把新字段添加到电子邮件消息中。在 **Submission Template** 选项卡中，你可以编辑表单发送后访客看到的消息。你也可以在此创建示例\
  \ HTML 模板，然后根据需要对其进行修改。\n\n在接下来的三个部分中，我们将向联系表单添加三个新字段，使其看起来像以下截图：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_191_0.png)\n\
  \n### 添加称呼作为单选按钮组\n\n对于称呼字段，你创建一个带有单选按钮的新字段，这些按钮被分组，使得在任何时候只能选择该组中的一个单选按钮。在 **Field\
  \ Type** 中选择 **Radio Button Group** 并按如下所示输入字段：\n\n单选按钮标签是网站访客在填写表单时看到的内容。选中时的值是他们提交表单后发送给你的内容。你可以根据需要输入不同的值。最初你只会看到一个可以填写的选项，因此点击\
  \ Add More Options 按钮以向该组添加更多单选按钮。\n\n准备就绪后点击 Add，字段将被添加到字段列表中。在字段列表下方，你会找到 Reorder\
  \ Fields 链接，可以轻松拖放字段以调整其在页面上的显示顺序。将 Salutation 放在表单的最顶部，使其出现在 Your Name 字段之前。\n\n\
  > 添加字段到表单后，不要忘记更新电子邮件和提交模板。\n\n## 使用第三方模块\n\n### 添加部门作为下拉字段\n\n你还可以轻松向表单添加另一种类型的字段，即下拉字段，在\
  \ CMS Made Simple 中称为 **pulldown**。点击 **Add New Field** 链接，并选择 **Pulldown** 作为 **Field\
  \ Type**。按以下截图所示输入字段：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_193_0.png)\n\n\
  与单选按钮一样，这里你也可以区分访客在填写表单时看到的内容（**Option Name**）和发送给你的字段值（**Value Submitted**）。\n\n\
  > \U0001F4A1 添加字段到表单后，不要忘记更新 **Email** 和 **Submission** 模板。\n\n### 使用复选框组进行多选\n\n\
  与单选按钮不同，组中的复选框可以被选中而不改变其他复选框的状态，因此可以进行多项选择。对于称呼字段来说这没有任何意义，但对于访客可以请求不同类型信息的字段来说这很有用。点击\
  \ **Add New Field** 链接，并选择 **Check Box Group** 作为 **Field Type**。按以下截图所示输入字段：\n\n\
  ![](img/b21e3dc5c94405bc7b3f102758ea770c_194_0.png)\n\n复选框可以有不同的状态——已选中和未选中。根据状态，提交表单后会发送不同的值。你可以留空\
  \ **Value when not checked** 字段。如果未选中复选框，则不会发送任何值。\n\n> 如果你真的希望人们与你联系，请将必填项的数量保持在最低限度。最好的客户是忙碌的人，他们不会在第一次就花费数小时填写繁琐的表单，而更愿意选择能节省他们时间的提供商。\n\
  \n验证码的强度会随着你所做的更改数量而增长。一些垃圾邮件程序可以读取使用默认值生成的验证码图像。然而，如果你在此处放置任何个性化值，它们就会失败。请确保你在字段\
  \ **minsize**、**maxsize** 和 **maxrotation** 中只做轻微的更改，以便验证码仍然可供人类用户阅读。请注意，这些更改适用于\
  \ CMS Made Simple 中使用 **Captcha** 模块的所有表单和模块。\n\n要为联系表单激活验证码，请在 **Extensions | Form\
  \ Builder** 中打开表单。选择 **Captcha Settings** 选项卡，并选中 **Use Captcha to protect form\
  \ submissions** 框。查看已添加到联系表单底部的验证码图像。\n\n**reCAPTCHA** 有一些优势。该库由负责保持其最新状态的团队支持，它对残疾人士可访问，并且有助于识别扫描书籍的文本，从而使它们以电子格式可用。如果你想使用\
  \ reCAPTCHA，你应该在 `reCaptcha.com` 上注册并添加你的网站，以便为其获取公钥和私钥。你不能在其他域的网站上重复使用相同的密钥，因此你必须将每个新站点添加到你的账户以获取新的密钥集。\n\
  \n### 发送新闻通讯\n\n使用 CMS Made Simple 和 **Newsletter Made Simple (NMS)** 模块，你可以向你的客户或订阅新闻通讯的网站任何访客发送新闻通讯。\n\
  \n你可以定义一个或多个用户列表，从而将客户与访客分开，并能够向每个用户列表发送不同的新闻通讯。一个用户可以分配给一个或多个列表。你创建一个包含电子邮件主题和文本的模板，这样你就不必从空白页面开始每条消息，可以使用已创建的模板。然而，你也可以不使用模板编写新闻通讯。\n\
  \n要发送新闻通讯，你将选择一条现有消息和将收到此消息的用户列表。这将被称为 **Job**。作业将在你激活它时手动处理。\n\n从管理控制台的可用模块列表中安装\
  \ **NMS** 模块（**Extensions | Module Manager**）。在安装模块之前，请注意 **Dependencies** 链接上找到的模块。这些模块应该在你尝试安装\
  \ Newsletter Made Simple 之前安装。\n\n### 行动时间 – 向注册客户发送邮件\n\n让我们创建我们的第一份新闻通讯，将其发送给网站的访客。你必须创建一个或多个具有不同有效电子邮件地址的测试用户，以便能够控制消息的投递方式。除非你希望他们在此阶段收到测试消息，否则不要使用真实的电子邮件地址。\n\
  \n- 1. 在管理控制台中，点击 **Extensions | Newsletter Made Simple**。\n- 2. 点击 **Create a List**\
  \ 链接，并按以下截图所示输入字段：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_197_0.png)\n\n- 3.\
  \ 点击 **Submit**。\n- 4. 切换到 **Users** 选项卡。在页面底部，点击 **Add User** 链接，并添加两个或更多用户。将它们分配给组\
  \ **Public Newsletter**，如下所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_197_1.png)\n\
  \n### 发生了什么？\n\n你刚刚在 Newsletter Made Simple 模块中创建了一个新的用户列表。这是一个公开列表；这意味着网站管理员并不是唯一可以向此列表添加用户的人。使组公开意味着任何网站访客，无论他是否是客户，都可以自行订阅该列表，前提是订阅表单已添加到网站上。\n\
  \n然后你创建了一些测试账户。当你为新闻通讯撰写新消息时，你可以选择消息应作为 HTML 还是纯文本发送。如果需要任何特殊的 HTML 格式，例如超链接、列表、表格或图像，则必须撰写\
  \ HTML 邮件。在这种情况下，你还应撰写替代文本消息，该消息将显示给在其邮件客户端中无法查看 HTML 电子邮件的客户。不要在 Text Message 字段中使用任何\
  \ HTML 标签，只使用纯文本。\n\n对于 HTML 电子邮件，你可以创建包含公司标志和联系信息的模板，这样你就不必在每条消息中单独添加。\n\n在文本消息中，你可以使用以下链接到你网站的\
  \ Smarty 标签：\n\n- `{$unsubscribe}`：可用于显示退订页面的 URL\n- `{$preferences}`：可用于显示用户偏好页面的\
  \ URL\n- `{$confirmurl}`：可用于确认订阅的 URL\n\n要使这些链接正常工作，你必须在撰写消息时在页面列表中选择一个返回页面。此页面应包含\
  \ Smarty 标签 `{nms}`。\n\n你还可以将已发送的消息作为新闻通讯存档显示在你的网站上。任何标记为公开的消息都将显示在此公共存档中，可供网站的每个访客阅读。请阅读下一节，了解如何将新闻通讯的公共订阅表单添加到页面或模板中。\n\
  \n创建作业意味着将一条消息和一个用户列表放在一起。你不会发送消息，而只是创建一个任务。当你处理作业时，此任务将被启动。\n\n> 公共新闻通讯意味着你的网站的每个用户都可以订阅新闻通讯。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_199_0.png)\n\n\n\n\n| 模板 | 描述 |\n|---|---|\n\
  | **订阅** | 订阅表单、发送给订阅者以确认其电子邮件地址的激活邮件，以及订阅后页面上显示的消息。 |\n| **确认订阅** | 在订阅者确认其电子邮件地址后发送给订阅者的确认邮件，以及电子邮件确认时页面上显示的消息。\
  \ |\n| **退订** | 退订表单、主题以及用户退订后发送给用户的电子邮件文本。退订表单发送后页面上显示的文本，以及退订过程完成时发送给用户的确认邮件。\
  \ |\n| **用户设置** | 如果有多个可供访客订阅的新闻通讯列表，还可以提供一个链接，让他/她管理自己的订阅列表。此选项卡上可以找到管理这些偏好设置所需的表单和消息。\
  \ |\n| **存档模板** | 如果希望在网站上显示新闻通讯存档，可以在页面上使用 Smarty 标签 `{NMS action=\"archivelist\"\
  }`。有两种模板可用于显示存档：**列表视图**和**详情视图**。您可以在此选项卡上修改模板以符合您的设计。 |\n\n打开 **新闻通讯** 页面，并将 Smarty\
  \ 标签 `{NMS}` 放入页面内容中。在 **Newsletter Made Simple** 模块的管理区域中编辑表单的外观。\n\n您可以调整每条消息发送之间的延迟。消息按批次分组（每批\
  \ 50 条）。每批发送后，会有更长的延迟。延迟对于保持您的虚拟主机的性能非常重要。一次发送大量邮件会对您的 Web 服务器造成沉重负担。一次发送的邮件越多，服务器性能就越关键。您可以在\
  \ **偏好设置** 选项卡上更改延迟。请谨慎使用；询问您的服务提供商您每小时允许发送多少邮件，以及如何确保您的邮件不会被视为垃圾邮件。为了获得更好的性能，请在\
  \ **CMSMailer** 模块中使用 `sendmail` 方法。\n\n## 显示视频\n\n视频在网站上变得越来越流行。每个人都可以将视频上传到 YouTube，但只有一些人知道这些视频中的任何一个也可以无缝集成到网站中。打开\
  \ YouTube 网站上的任意视频，查看其右侧的面板。\n\n有两个字段，分别名为 URL 和 Embed。第一个字段包含指向视频的纯链接。第二个字段包含用于显示视频的\
  \ HTML 代码。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_201_0.png)\n\n使用哪个字段取决于视频在您网站上的位置。如果视频应显示在您网站的每个页面上，您必须从\
  \ Embed 字段复制 HTML 代码，打开您的页面模板（布局 | 模板），并将代码添加到每个页面上应显示视频的位置。\n\n如果视频应显示在单个页面的页面内容中，您必须打开管理控制台中的页面进行编辑，并点击\
  \ Content 字段下方的“打开/关闭 WYSIWYG”按钮。在页面的 HTML 源代码中找到应显示视频的位置，并将 Embed 字段中的代码添加到该位置。不是那么方便，对吧？如果您具备\
  \ HTML 知识，您可以这样做，但网站中没有 HTML 知识的编辑怎么办？\n\n在 WYSIWYG 编辑器中，您可以激活一个简单的插件，无需查看 HTML\
  \ 源代码即可嵌入任何视频。\n\n在管理控制台中，点击 **扩展 | TinyMCE WYSIWYG**，选择 **插件** 选项卡。选择名为 **media**\
  \ 的插件，然后点击 **保存插件**。然后切换到 **配置文件** 选项卡。有三个部分：\n\n- **后端配置文件设置**：网站编辑者的设置\n- **高级后端配置文件设置**：网站管理员的设置\n\
  - **前端配置文件设置**：前端使用 WYSIWYG 编辑器的设置，例如，如果您的访客可以向网站添加新闻文章。\n\n用于插入嵌入媒体的按钮称为 **media**，可以根据您的个人需求添加到任何配置文件的任何\
  \ **工具栏** 中。例如，要使该按钮可供网站编辑者和管理员在工具栏的第一行使用，请在两个配置文件的 **工具栏 1** 字段的最末尾添加 **media**\
  \ 一词，如下面的截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_202_0.png)\n\n保存每个配置文件，然后会在\
  \ *TinyMCE* 编辑器第一行的末尾看到该按钮。现在您或编辑者只需点击按钮即可从 YouTube 添加任何视频。文件的 **类型** 应为 **Flash**；在\
  \ **文件/URL** 字段中，从 YouTube 复制链接，如 **URL** 字段所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_203_0.png)\n\
  \n视频的尺寸将自动设置。此外，下方会显示视频的预览。点击 **插入**，视频将添加到页面中。现在，您的编辑者只需知道视频链接；其余工作将由 WYSIWYG 编辑器完成。\n\
  \n您无需任何额外的模块即可在页面上插入视频。CMS Made Simple 核心已涵盖大量功能。等待您去发现！\n\n## 添加您自己的播放器\n\n上一节描述的方法适用于您先将视频上传到\
  \ YouTube 的情况。但有时您可能希望将视频上传到自己的主机并显示它们，绕过 YouTube 或 Google Video 等服务。\n\n## 小测验\
  \ – 使用第三方模块\n\n- 1. 在哪里可以找到 **Photo Gallery** 的管理区域？\n  - a. **内容 | 图像管理器**\n  -\
  \ b. **内容 | 画廊**\n  - c. **扩展 | 模块 | 照片**\n  - d. **扩展 | 模块 | 图片**\n- 2. **Gallery**\
  \ 模块中不允许使用哪种扩展名？\n  - a. `.jpeg`\n  - b. `.eps`\n  - c. `.png`\n  - d. `.jpg`\n\
  - 3. 为了使用 **Form Builder** 创建的表单发送电子邮件，应首先安装哪个模块？\n  - a. **Newsletter Made Simple**\n\
  \  - b. **CTLModuleMaker**\n  - c. **CMSMailer**\n  - d. **File Manager**\n- 4.\
  \ 在编辑联系表单时，为什么应该将 **向用户发送提交副本** 字段的值设置为“从不”？\n  - a. 用户最清楚自己写了什么，因此他/她不需要关于这些内容的通知。\n\
  \  - b. 因为电子邮件提交可能会使 Web 服务器满载运行。\n  - c. 因为这会导致无限循环，并可能使您的 Web 服务器满载运行。\n  - d.\
  \ 因为用户会得到您的电子邮件地址，并可能绕过反馈表单开始与您联系。\n- 5. **Form Builder** 中的 **提交模板** 定义了什么？\n \
  \ - a. 表单发送后响应消息的外观。\n  - b. 负责已发送电子邮件外观的 **电子邮件模板** 的外观。\n  - c. 提交消息前表单的外观。\n\
  \  - d. 用于创建模板的个人管理区域的外观。\n- 6. 关于一组单选按钮和一组复选框，哪种说法是正确的？\n  - a. 在复选框和单选按钮的组合组中，所有选项都可以被激活。\n\
  \  - b. 在一组复选框中，所有选项都可以被激活；在一组单选按钮中，只能激活一个选项。\n  - c. 在一组单选按钮中，所有选项都可以被激活；在一组复选框中，只能激活一个选项。\n\
  \  - d. 在一组复选框中，必须集成一个下拉菜单，否则您无法通过操作单选按钮来听音乐。\n- 7. 在 **Newsletter Made Simple**\
  \ 模块中，什么是 **任务**？\n  - a. 为了发送电子邮件而做的所有事情。\n  - b. 将准备好的电子邮件发送到邮件列表。\n  - c. 选择一个现有的消息和一个现有的将接收该消息的用户列表。\n\
  \  - d. 思考可以组合邮件列表和计划消息的不同可能性。\n\n## 动手实践 – 安装其他模块\n\n现在，如果您需要为网站添加其他功能，应该查看可用的模块并尝试它们。使用每个模块的\
  \ **帮助** 来确定它是否能解决您的需求。不要忘记插件。在模块可能过于臃肿的情况下，它们会为您提供小而实用的功能。\n\n一个好的网站通常永远不会真正完成，您会一次又一次地改进它；暂时隐藏未完成的部分，将网站的第一版发布上线，同时在开发环境中处理未完成的部分。\n\
  \n\n\n\n## 摘要\n\n在本章中，我们学习了很多关于 CMS Made Simple 中不同模块如何扩展网站功能的知识。\n\n在本章中，我们涵盖了：\n\
  \n- **图库**：如何创建照片图库，并从头开始为图库创建自定义模板。\n- **表单构建器**：如何创建和自定义页面上的联系表单或反馈表单，无需深厚的编程知识。\n\
  - **新闻通讯**：如何将电子邮件地址导入 **Newsletter Made Simple** 模块的用户列表，并向现有的电子邮件列表发送消息。\n- **YouTube\
  \ 视频**：如何将 YouTube 视频嵌入网站。你不需要任何特殊模块即可在页面上显示单个视频。在寻找附加组件之前，先了解核心功能。\n\n在本章中，只介绍了一些模块。还有许多模块具有非常复杂的功能，并为你的网站提供扩展功能。每周都有为\
  \ CMS Made Simple 开发的新模块，并且对现有模块进行更新。\n\n在下一章中，你将学习如何从现有模块构建更多功能，甚至从零开始创建自己的功能。\n"
- "## 8 创建你自己的功能\n\nCMS Made Simple 仅包含一些属于标准安装的基础功能。任何附加功能都可以通过其他模块安装，正如你在前一章中所学到的。然而，你常常需要自己的功能，而现有模块无法覆盖这些功能。\n\
  \n在本章中，我们将：\n\n- 使用自定义字段和单独的层级结构创建产品目录\n- 以一种并非模块开发初衷的方式使用模块的功能\n\n那么让我们开始吧……\n\n\
  ### 创建产品目录\n\n在本节中，我们将学习如何创建新模块。以产品目录为例，但同样地，你可以创建任何类型的目录，例如服务、课程、房地产广告或自由职业者目录。\n\
  \n在创建你自己的目录模块之前，你应该非常仔细地规划其结构。首先，考虑层级的数量。写下你需要多少层级（产品类别、子类别等）。例如，我将创建一个简单的办公家具目录。我需要以下三个类别，产品在创建时可以分配到这些类别：\n\
  \n- 桌子\n- 椅子\n- 书柜\n\n这意味着家具目录需要一个两级结构，例如类别和产品。每个产品将只属于前面列出的类别之一。\n\n接下来，你必须确定需要为目录中的一个项目（产品）创建哪些字段。这就像为你的产品列表制作一张表格。你需要哪些列来区分不同信息？例如，我需要以下四个字段：\n\
  \n- 产品标题\n- 描述\n- 图片\n- 价格\n\n现在，你可以开始创建自己的模块了。你不会使用任何特殊的专用模块，而是学习如何创建完全适合你个人需求的独立模块。这可以通过\
  \ **CTLModuleMaker** 模块完成，该模块允许创建任何功能完整的类似目录的模块。\n\n新产品目录的示例结构如下：\n\n- 桌子\n  - 电脑桌\n\
  \  - 办公桌\n- 椅子\n  - 行政椅\n  - 客椅\n- 书柜\n  - .....\n\n从可用模块列表（**扩展 | 模块管理器**）中安装 **CTLModuleMaker**\
  \ 模块。模块安装后，可以在管理控制台（**扩展 | CTLModuleMaker**）中找到其管理区域。\n\n### 创建新的类似目录的模块\n\n我们现在将开始创建一个新的独立模块。在管理控制台中，进入\
  \ **CTLModuleMaker** 的管理区域（**扩展 | CTLModuleMaker**），然后点击 **创建一个新模块** 链接。\n\n###\
  \ 第1步：模块的基本信息\n\n模块向导将引导你完成创建新模块所需的所有步骤。在第1步中，你需要定义新模块的基本信息。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_210_0.png)\n\
  \n在第一个字段中，输入模块的名称。此名称将出现在模块列表（扩展 | 模块）中。它稍后也会用于 Smarty 标签 {cms_module module=\"\
  NAME_OF_MODULE\"}。最好为模块名称选择一个唯一的前缀，如前面的示例所示。不要只命名为 Products（有一个名为 Products 的第三方模块），而是命名为\
  \ BWProducts。在我的示例中，BW 代表 Business World（商业世界）（当然你可以使用自己的前缀）。\n\n第一个字段也用于稍后为模块项目生成\
  \ URL。例如，产品的详细视图将显示 http://www.mydomain.com/nameofmodule/detail/nameofproduct/5/。\n\
  \n模块的描述将出现在模块帮助的“此模块的作用是什么？”部分。\n\n模块的友好名称将在模块安装后显示在管理菜单中。在前面的示例中，模块将安装在“内容 | 产品目录”下。\n\
  \n我们已经确定需要两级结构：类别和产品。如果你需要更多层级，请在此处更改。但是，我建议一开始使用简单的两级结构，然后在原理清楚后，再创建一个或多个额外的层级。\n\
  \n点击 **下一步** 并继续第2步。\n\n### 第2步：创建层级\n\n模块中的产品将被分配到不同的类别。类别有助于将不同的产品分组，并使产品列表中的导航更加容易。\n\
  \n### 创建第一级类别\n\n此步骤帮助你为新模块定义类别，以便以后可以将项目分配到这些类别。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_211_0.png)\n\
  \n第一个和第四个字段需要类别的技术名称和前缀。技术名称不会显示给网站的访问者，并且不应包含任何特殊字符。相反，第二个和第三个字段是用户友好的，可以包含特殊字符。这些字段将在管理控制台中使用。例如，层级名称的复数形式将出现在模块管理区域的选项卡上，如以下截图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_212_0.png)\n\n第五个字段涉及层级的灵活性。一个产品只能属于一个类别，还是可以属于多个类别？例如，想象一个图书目录，其中一本书可以属于多个类别。历史犯罪小说在逻辑上同时属于犯罪文学和历史文学。对于家具目录，我们不需要这样的灵活性。在我们的示例中，产品只能属于一个类别。\n\
  \n在第六个字段中，你输入除自动添加到每个层级的字段之外所需字段的数量。你可以从字段的注释中了解将创建哪些字段。这意味着我们不需要为类别标题添加额外的字段，因为我们将使用字段名称作为标题。此外，我们需要存储类别描述的字段。因此，你在此输入\
  \ 1。\n\n第七个字段对于目录结构中的第 1 级并不重要，因为类别没有父元素。\n\n默认情况下，新类别应出现在类别列表（管理区域和网站上）的什么位置？请注意，你以后始终可以在模块的管理区域中手动重新排序类别的显示顺序。\n\
  \n最后一个字段对于第 1 级并不重要，可以保持原样。点击“下一步”。\n\n在最后一个屏幕上，你定义了类别应具有的附加字段的数量（请参见第2步中第一张图片中的第六个字段）。现在，你必须在下一个屏幕上提供有关此字段的更多信息，如以下截图所示。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_213_0.png)\n\n第一个字段包含字段的技术名称，仅供内部使用。第二个字段是友好名称，编辑人员将在管理控制台的目录中看到该名称。如果你认为\
  \ 255 个字符足以描述类别，请为字段类型选择 **短文本（255 字符）**。将字段设置为必填意味着，如果不提供描述，你将无法创建新类别。\n\n字段内容是否应被\
  \ CMS Made Simple 的 **Search** 模块索引？该模块是标准模块，已在第5章 *使用核心模块* 中说明。\n\n每个使用 **CTLModuleMaker**\
  \ 创建的模块都将获得一个额外的高级搜索功能，如以下截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_213_1.png)\n\
  \n\n\n在字段定义的最后一个字段中，您可以定义是否希望在高级搜索中看到该字段。在之前的示例中，该字段是可搜索的，因此显示在搜索功能的顶部。点击**下一步**。\n\
  \n在下一步中，您将定义在将来模块的管理区域中，哪些字段将显示在类别列表中。**名称**字段是必填的，您不能将其从列表中删除，但您可以添加**可能字段**列表中的任何其他字段。将**子项数量**字段添加到列表中，如下图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_214_0.png)\n\n根据之前定义的字段，模块管理控制台中的类别列表将如下图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_214_1.png)\n\n## 创建您自己的功能\n\n点击**下一步**，继续定义产品（目录结构中的第2级）。\n\
  \n### 创建第二级（产品）\n\n在接下来的步骤中，系统将询问有关您的产品的信息。您将看到每个级别的定义是相似的。与类别相同的字段，现在您需要为产品提供信息。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_215_0.png)\n\n对于产品，我们需要三个额外的字段：\n\n-\
  \ 描述\n- 价格\n- 图片\n\n产品标题将保存在必填的**名称**字段中，不应在此处规划。\n\n第七个字段在类别级别可以忽略，但在第二级中具有一些意义。即产品应如何在产品列表中显示，是按类别还是按字母顺序排列，以及是否应独立于它们所属的类别显示。\n\
  \n| 按类别 | 按字母顺序 |\n|---|---|\n| 行政办公桌 | 电脑桌 |\n| 电脑桌 | 行政椅 |\n| 行政椅 | 行政办公桌 |\n\
  | 访客椅 | 访客椅 |\n\n在最后一个字段中，您可以定义整个产品列表是否只能有一个默认产品，还是每个类别有一个默认产品。在我们的示例中，我们不需要任何默认产品，因此您可以保留该字段的默认设置。\n\
  \n点击**下一步**。\n\n与定义类别的附加字段**描述**类似，您现在需要为产品定义三个额外的字段。\n\n产品所需的第一个字段是**产品描述**。该字段的定义方式与类别描述相同。我选择将该字段设为**长文本**，以便产品描述的长度不受限制。该字段应可双向搜索，既可通过CMS\
  \ Made Simple的标准搜索字段搜索，也可通过模块本身的高级搜索功能搜索。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_216_0.png)\n\
  \n## 创建您自己的功能\n\n在下一个字段中，应存储产品的价格。该字段必须定义为**短文本（10个字符）**。如果您选择**字段类型**为**数字**，则其中无法存储小数。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_217_0.png)\n\n第三个字段将允许您上传产品图片。一旦您将**字段类型**更改为**图片**，将显示附加信息，如下一个截图所示：\n\
  \n### 字段 3\n\n**字段名称**\n*仅供内部使用。应为字母数字，不能包含重音符号、空格或其他符号。*\nimage\n\n**友好名称（显示名称）**\n\
  产品图片\n\n**字段类型（它包含什么？）**\n图片\n\n**此字段是否为必填？**\n否\n\n**是否应为此字段建立索引以供搜索模块使用？**\n否\n\
  \n**此字段是否应显示在高级（按字段搜索）搜索操作中？**\n否\n\n**输入文件应上传到的文件夹路径。**\n*此路径将添加到上传文件夹（空 = 上传文件夹的根目录）。*\
  \ \nimages/catalogue\n\n**上传的图片是否应调整为最大尺寸？**\n*输入像素尺寸，格式为“宽x高”（空 = 图片不调整大小）。* \n\
  \n调整大小功能需要gd库，并且仅适用于.jpeg、.jpg、.png或.gif文件\n500x700\n\n**当图片不符合调整比例的尺寸时，是否应进行裁剪？**\n\
  否\n\n**是否应创建缩略图，其最大尺寸应为多少？**\n*输入像素尺寸，格式为“宽x高”（空 = 不创建缩略图）。* \n120x120\n\n**当缩略图不符合调整比例的尺寸时，是否应进行裁剪？**\n\
  是\n\n**允许的文件扩展名，以逗号分隔。（对于图片，空值允许gif/jpeg/jpg/png；对于其他文件类型，允许任何类型）**\ngif,jpeg,jpg,png\n\
  \n最后六个字段中的信息仅对可以上传图片的字段是必需的。\n\n您应该输入上传后图片将保存到的文件夹名称。此文件夹将在您网站托管的`uploads`文件夹下自动创建。您可以使用`images`文件夹，然后加上模块文件夹的自定义名称。这将确保图片自动保存到`images`文件夹中，从而可以通过**图片管理器**在线编辑。\n\
  \n在下一个字段中，输入产品图片的最大尺寸，如果图片大于此处给定的尺寸，则将其调整为该尺寸。但是，有时在不改变图片比例的情况下，无法将图片精确调整为字段中给定的尺寸。在这种情况下，将考虑宽度或高度。如果您希望保持精确尺寸，则模块必须裁剪图片。裁剪图片意味着图片的一部分将被切掉。您可以在下面的字段中选择调整大小的方法。\n\
  \n同样，您可以定义缩略图的尺寸。最佳的调整大小方法取决于您的源图片和设计，因此无法给出通用建议。\n\n在最后一个字段中，您指定允许上传的扩展名。请注意，只有GIF、JPEG、JPG和PNG文件才能在所有浏览器中显示为图片。不要允许任何其他格式，这样产品编辑者将无法在此字段中上传其他文件。\n\
  \n点击**下一步**，定义在产品列表的管理控制台中应显示哪些字段：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_219_0.png)\n\
  \n## 创建您自己的功能\n\n点击**下一步**。您已到达最后一步，即将完成并安装新模块。\n\n保留最后一步中的值不变。它们涉及文件字段（我们没有任何文件字段）、语言（我们将在第10章“CMS\
  \ Made Simple高级使用”中了解更多关于翻译的内容）以及模块版本。模块版本用于修订控制，并用于管理之后对模块所做的更改。例如，模块的初始配置获得版本1.0。当对模块进行第一次更改时，生成的配置将标记为版本2.0，依此类推。我们不允许网站访客添加产品，因此请将**前端用户管理**也设置为**否**。\n\
  \n点击**下一步**。**CTLModuleMaker**模块开始创建所有必需的文件夹和文件。点击**安装模块**链接，新的自定义模块将被安装。您现在可以在管理控制台的**内容\
  \ | 产品目录**中找到它。\n\n此外，该模块可以在**模块管理器（扩展 | 模块）**的模块列表中找到、移除和安装。\n\n### 配置新的产品目录模块\n\
  \n在新模块的管理区域中添加一些类别和一些产品。\n\n然后，打开页面**产品（内容 | 页面）**，并添加以下Smarty标签来调用您的模块：\n\n```\n\
  {cms_module module=\"bwproducts\"}\n```\n\n将参数module中的名称替换为您的模块名称。此名称可以在已安装模块列表（**扩展\
  \ | 模块**）中找到。打开页面，查看页面上的产品列表。\n\n新模块还有一个**模块帮助**部分，其中列出了您可以与此模块一起使用的所有参数。可以通过位于模块管理区域页面右上角的**模块帮助**图标访问帮助部分。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_221_0.png)\n\n\n\n如需更多帮助，可以查看常见问题解答（FAQ）。在模块帮助中，“版权与许可”部分上方可以找到FAQ的链接。\n\
  \n## 创建产品列表模板\n\n对于使用CTLModuleMaker创建的模块，系统会自动生成一些示例模板。不过，对于每一级，你都可以自行创建无限数量的模板。\n\
  \n### 动手操作——创建新的列表模板\n\n让我们自定义产品列表的外观，并将产品图片以缩略图形式添加到该列表中。\n\n1. 在管理控制台中，点击 **内容\
  \ | 产品目录**，然后选择“模板”选项卡。\n2. 在“默认模板”部分下方，你会看到示例模板列表。点击“添加模板”链接。\n3. 对于带缩略图的产品列表，请在“模板”字段中输入以下代码片段：\n\
  \n   ```\n   {if $itemcount > 0}\n       <ul>\n           {foreach from=$itemlist\
  \ item=\"item\"}\n               <li style=\"list-style-type:none; float:left; margin:\
  \ 20px;\"><a href=\"{$item->detailurl}\">\n               <img src=\"uploads/{$item->image->thumbnail}\"\
  \ alt=\"{$item->name}\" /></a>\n               <br/>\n               {$item->detaillink}<br/>{$item->price}\
  \ USD</li>\n           {/foreach}\n       </ul>\n   {/if}\n   ```\n\n4. 点击“提交”。\n\
  5. 在**默认模板**部分，选择你刚创建的模板作为**级别为“product”的默认列表模板**。产品列表应如下方截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_223_0.png)\n\
  \n### 刚才发生了什么？\n\n你已为产品列表创建了一个新模板。该模板不仅显示产品名称，还显示产品图片的小尺寸版本。图片的小版本在模板中以Smarty变量`{$item->image->thumbnail}`表示。当模板处于编辑状态时，你可以在\
  \ **模板变量（内容 | 产品目录 | 模板）** 选项卡中找到模板中可使用的所有Smarty变量。请注意，包含图片的字段还有更多变量。这些变量在模块FAQ中标题为\
  \ *如何在我的显示模板中获取图片？* 的部分有详细说明。\n\n> 模板中添加的内联CSS并不是实现样式的正确方式。这样做只是为了简化示例。你应该创建一个新的CSS类，并将样式定义存放在主样式表中。\n\
  \n同样，你可以修改或创建一个新的**默认详情模板**，该模板用于显示单个产品的详细视图。\n\n通过 **CTLModuleMaker** 模块，你可以创建任何类型的目录，如产品、服务、房地产广告、课程等。任何可以分类的内容都可以放入类似自定义目录的模块中。请记住，你创建的是一个普通模块，可以从模块列表中移除，导出为XML，并导入到另一个安装中。\n\
  \n## 实现服务台功能\n\nCMS Made Simple中有超过300个第三方模块，而且这个数字每周都在增长。有些模块可能无法按预期工作，因为第三方模块没有质量保证。然而，有时你并不需要使用专门的模块来解决需求。凭借一些创造力，你可以将模块从其原本用途中转换出来，以创建自己的功能。\n\
  \nCMS Made Simple中没有专门的服务台模块。但是，如果你需要用其来处理支持工单，则可以使用 **CGFeedback** 模块；它最初是为处理页面或新闻文章的评论而创建的。尽管该模块并非为处理支持工单而开发，但通过一些高级定制，它可以用来解决所需功能。\n\
  \n## 管理访客登录\n\n在网站上设置服务台功能之前，你必须安装 **FrontEndUsers** 模块。**FrontEndUsers** 模块是一种网站会员管理工具。在我们的场景中，会员是指那些可以使用其访问数据在网站上进行认证、访问受保护内容或通过个人会员区域与你沟通的客户。\n\
  \n通常，**FrontEndUsers** 可以与其他许多模块集成，例如：\n\n- **新闻**（注册访客可以向网站添加新闻）\n- **下载管理器**（注册访客可以从网站下载受保护的文件）\n\
  - **论坛**（注册用户可以在论坛上交流）\n- **NMS**（向注册用户发送群发邮件）\n\n> 网站会员不同于网站的管理员用户，后者在第6章 *用户与权限*\
  \ 中已有描述。会员与管理控制台无关（希望如此！）。\n\n**FrontEndUsers** 模块依赖于 **CMSMailer** 模块。这意味着，在网站上安装会员管理之前，你必须按照第2章\
  \ *开始使用* 中的说明配置电子邮件设置。否则，诸如发送忘记密码等功能将无法正常使用。\n\n要在管理控制台中安装该模块，请点击 **扩展 | 模块管理器**，然后在字母模块列表上方的“可用模块”选项卡中选择字母\
  \ **F**。找到 **FrontEndUsers** 模块，点击 **下载并安装** 链接。该模块将完成安装，现在可以进行配置。\n\n打开 **服务台**\
  \ 页面（**内容 | 页面**），并将登录表单添加到页面的**内容**字段中，如下所示：\n\n```\n{cms_module module=\"FrontendUsers\"\
  }\n```\n\n现在，你可以在页面上看到登录表单。让我们创建第一个客户账户并登录该页面，以便测试模块功能。\n\n### 动手操作——创建第一个用户账户\n\
  \n我们将向网站添加第一个客户账户。\n\n1. 在管理控制台中，点击 **用户与群组 | 前端用户管理**。\n2. 点击 **用户属性** 选项卡。\n3.\
  \ 点击 **添加属性** 链接并填写表单，如下方截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_225_0.png)\n\
  \n4. 点击 **提交**。\n5. 打开 **群组** 选项卡，点击 **添加群组** 链接。\n6. 填写字段，并将上面创建的电子邮件字段分配给该群组，如下方截图所示：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_226_0.png)\n\n7. 点击 **提交**。\n8. 点击 **用户**\
  \ 选项卡，然后点击 **添加用户** 链接。\n9. 填写字段，如下方截图所示（请提供有效的电子邮件地址！），并将用户分配给 **客户** 群组：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_226_1.png)\n\
  \n10. 点击 **下一步**，再次输入客户的电子邮件地址。\n11. 点击 **提交**。\n12. 在 **服务台** 页面上使用客户数据（**用户名 =\
  \ 客户的电子邮件地址**）登录，查看其工作方式。如果登录成功，页面应如下方截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_227_0.png)\n\
  \n### 刚才发生了什么？\n\n你已创建了第一个客户账户。你首先添加了用户属性（一个包含客户电子邮件地址的字段）。该字段将用于发送电子邮件，例如当客户忘记密码时。默认情况下，该字段也用作用户名（你以后可以更改）。字段的**类型**必须设置为**电子邮件地址**，因此在其中输入的内容必须是有效的电子邮件。你无需定义**用户名**或**密码**等用户属性。这两个属性已经为你提供，并且不能更改或删除。\n\
  \n> 添加用户属性时，千万不要在**名称**字段中使用短横线等特殊字符！\n\n你已经创建了一个新的用户群组（本例中为**客户**）。电子邮件字段已被分配为**客户**群组的必填字段（**字段状态**），这意味着每个客户都必须有一个有效的电子邮件地址。\n\
  \n此时，你已经配置好模块，可以添加第一个客户了。所有客户账户都有过期日期，因此如果日期已过，账户将自动禁用。新用户已被分配到**客户**群组，现在会显示在 **用户**\
  \ 选项卡（**用户与群组 | 前端用户管理**）的用户列表中。\n\n### FrontEndUsers 模块的有用设置\n\n作为网站管理员，你可以调整 **FrontEndUsers**\
  \ 模块的设置。在网站的管理控制台中，点击 **用户与群组 | 前端用户管理**，然后选择 **偏好设置** 选项卡。应进行以下设置：\n\n\n\n\n\n\
  ## 创建你自己的功能\n\n您可以在管理控制台（**用户和组 | 前端用户管理**）的相应选项卡中找到表中列出的所有模板。**忘记密码模板** 和 **丢失用户名模板**\
  \ 也包括验证表单。\n\n要查看 **忘记密码** 的验证表单，请点击网站上登录表单下方的链接 **忘记密码？**，输入 **用户名**，然后点击 **提交**。检查收到的电子邮件中是否有从您的网站发送的主题为\
  \ **丢失密码** 的邮件。如果您没有收到电子邮件（您的客户是否输入了真实的电子邮件？），那么您必须检查 **CMSMailer** 模块的配置，如第 2 章，*入门*\
  \ 所述。\n\n**FrontEndUsers** 模块发送的电子邮件文本无法在模块的管理区域中更改。这些消息存储在语言文件中，可以使用 **Translation\
  \ Manager** 进行编辑，这将在第 10 章，*CMS Made Simple 高级使用* 中解释。\n\n### 创建受保护的页面\n\n受保护的页面只能由注册成员查看，由于您已经安装了\
  \ **FrontEndUsers** 模块，您可以继续创建受保护的页面。\n\n要保护内容页面，您必须安装名为 **CustomContent** 的模块。**CustomContent**\
  \ 模块与 **FrontEndUsers** 模块一起，可以创建仅对登录用户可访问的受保护页面。打开 **扩展 | 模块管理器**，单击带有字母 **C**\
  \ 的可用模块选项卡，搜索 **CustomContent** 模块，并单击 **下载并安装** 链接。模块即安装完成。该模块没有任何管理区域。不过，您可以从已安装模块列表（**扩展\
  \ | 模块**）中单击模块名称来访问模块帮助。\n\n您将在 **如何使用它** 部分找到一个示例，我们将针对我们的目的对其进行修改。Smarty IF 条件检查用户是否已登录，并根据结果显示不同的内容。\n\
  \n```\n{if $customcontent_loggedin > 0}\n    Welcome <b>{$customcontent_loginname}</b><br/>\n\
  {else}\n    <h1>You are not authorized to view this data</h1>\n{/if}\n```\n\n如果\
  \ Smarty 变量 `$customcontent_loggedin` 大于 0，则用户有权查看内容，否则会显示一条用户未获授权的消息。我们将保护 **服务台**\
  \ 页面。如果用户未登录，则页面上除了登录表单外不应显示任何内容。\n\n### 操作实践——保护服务台\n\n现在，让我们保护服务台页面，以便只有注册成员才能查看其主要内容。如果用户未登录，则只显示登录表单。\n\
  \n1. 在管理控制台中，打开服务台页面进行编辑（内容 | 页面）。\n2. 单击“选项”选项卡，并将页面标记为不可缓存和不可搜索，如下面的截图所示：\n3.\
  \ 切换到“主”选项卡，并填写内容字段，如下面的截图所示：\n4. 单击“应用”。\n5. 分别以已登录用户和未登录用户身份查看页面。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_230_0.png)\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_230_1.png)\n\n### 刚才发生了什么？\n\n您已保护了部分页面内容，使其无法被未授权用户查看。您首先将页面设置为不可缓存。对于每个需要保护的页面或每个包含登录表单的页面，这样做都很重要。缓存的页面也会缓存用户的登录状态，即使他已退出，也会显示为已登录。\n\
  \n该页面不应被搜索到，因为向未授权用户显示在搜索结果中是没有意义的。\n\n在“内容”字段中，显示登录表单（如果用户未登录）或注销表单（如果用户已登录）。该表单会根据用户状态自动更改。Smarty\
  \ 标签 IF 之间的所有内容仅对已登录用户显示。\n\n通过这种方式，您可以根据用户是否获得授权来保护每个页面或仅保护部分内容。\n\n### 为支持请求创建用户区域\n\
  \n支持工单系统是一个区域，您的客户可以在其中提出关于您的产品或服务的问题。该区域是私密的，网站访问者或其他客户无法看到。当问题被提交到支持工单区域时，支持人员可以给客户回答。如果问题没有得到解决，客户可以对回答进行回复，工作人员会再次回答。这个对话（问题和答案）被组织为一个工单。如果客户还有另一个问题，他可以打开另一个工单。在私人服务台中，客户始终可以看到他的工单列表并阅读工作人员给出的答案。支持工单系统常用于专业的客户服务中。\n\
  \n要创建支持工单系统，您不需要专门的支持工单模块。让我们看看如何使用反馈模块来创建服务台功能。所讨论的模块名为 CGFeedback。该模块用于允许网站访问者对您的网站上的各个页面、新闻文章、产品或其他项目提供评论。我们将使用此模块的功能来创建一个基本的支持工单系统。\n\
  \n在管理控制台中，单击“扩展 | 模块管理器”，在“可用模块”选项卡中搜索 CGFeedback 模块。单击“依赖项”链接以确定应先安装哪些模块。您将看到以下模块：\n\
  \n- CGExtensions\n- CGSimpleSmarty\n\n首先安装这些模块，然后安装 CGFeedback 模块。使用该模块最简单的方法是在任何页面内容的底部包含以下\
  \ Smarty 标签：\n\n```\n{CGFeedback}\n```\n\n这将创建一个评论表单，允许访问者输入关于该特定页面的评论和评分。要显示这些评论，您可以在前一个标签下方添加另一个标签：\n\
  \n```\n{CGFeedback action=\"summary\"}\n```\n\n这些标签可以选择性地放置在页面模板或模块模板中。如果没有定义其他内容，则评论会自动附加到发表评论的页面上。如果您希望允许对新闻文章等模块项目发表评论，则应该使用两个附加参数：\n\
  \n```\n{CGFeedback key1=\"News\" key2=$entry->id}\n```\n\n有两个参数：key1 和 key2。每个参数可以填入不同的值。在前面的示例中，参数\
  \ key1 填入了值 News，以便将普通页面评论与新闻文章评论区分开来。第二个键保存了新闻文章的编号（$id），以确保评论仅显示在显示该特定新闻项目详细视图的页面上。\n\
  \n添加评论时，它们会与两个参数（key1 和 key2）中给定的值一起保存在数据库中，例如“针对特定 ID 的新闻文章的评论”。我们为什么不用这个功能来管理与某个特定登录用户关联的评论呢？第一个参数\
  \ key1 将页面评论与工单区分开。从第 4 章 设计与布局 中，我们知道每个页面中都存在一些 Smarty 变量。其中有一个由 FrontEndUsers\
  \ 模块提供的变量，称为 $userid。该变量仅在用户登录时存在，并包含用户 ID。通过在页面内容中放置以下两行，您表示“保存并显示针对特定登录用户的评论”：\n\
  \n```\n{CGFeedback key1=\"Ticket\" key2=$userid}\n{CGFeedback key1=\"Ticket\" key2=$userid\
  \ action=\"summary\"}\n```\n\n这两行将显示评论表单和由同一个用户撰写的所有评论的摘要视图。当用户未登录时，他无法看到评论，因为对于未登录的用户，变量\
  \ $userid 不存在。其他用户也不会看到这些评论，因为他们有不同的用户 ID。通过将这两个 Smarty 标签放入服务台页面来测试。由于页面上有登录表单，完整内容应类似于以下截图：\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_233_0.png)\n\n现在，已登录用户可以创建评论，或者说创建支持工单，这些评论只能由用户本人在页面上查看，或由\
  \ CMS Made Simple 管理控制台中的支持人员查看。您可以完全自定义带有评论表单的模板，如下面的截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_233_1.png)\n\
  \n\n\n\n\n你可以删除或替换图例 **Add a Review**。移除 **Notify me of new comments to this page**\
  \ 复选框，并将字段 **Additional Comments** 重命名为 **Your question** 或 **Your request**。\n\n\
  要在管理控制台中创建新的 **Comment Form Templates**，点击 **Content | Calguys Feedback Module**。选择\
  \ **Comment Form Templates** 选项卡，并点击 **New Template**。输入 **NewTicket** 作为 **Template\
  \ Name**，并在 **Template Text** 字段中输入以下代码片段：\n\n```\n{if isset($message)}\n    <p\
  \ class=\"success\">{$message}</p>\n{else}\n    {if isset($error)}\n        <p class=\"\
  error\">{$error}</p>\n    {/if}\n{$formstart}\n\n    <p><label>Title:</label>\n\
  \    <input type=\"text\" name=\"{$actionid}title\" value=\"{$title}\"/></p>\n\n\
  \    <p><label>Your name:</label>\n    <input type=\"text\" name=\"{$actionid}author_name\"\
  \ value=\"{$author_name}\"/></p>\n\n    <p><label>Your e-mail:</label>\n    <input\
  \ type=\"text\" name=\"{$actionid}author_email\" value=\"{$author_email}\"/></p>\n\
  \n    <p><label>Question:</label>\n    <textarea name=\"{$actionid}comment\" cols=\"\
  40\" rows=\"5\">{$comment}</textarea></p>\n\n    <p><input type=\"submit\" name=\"\
  {$actionid}submit\" value=\"Send\"/></p>\n\n{$formend}\n{/if}\n```\n\n点击 **Submit**。打开页面\
  \ **Service Desk (Content | Pages)**，并按以下代码片段所示修改评论表单的 Smarty 标签：\n\n```\n{cms_module\
  \ module=\"FrontEndUsers\"}\n{if !empty($customcontent_loggedin)}\n{CGFeedback key1=\"\
  Ticket\" key2=$userid commenttemplate=\"NewTicket\" policy=\"session\"}\n{CGFeedback\
  \ key1=\"Ticket\" key2=$userid action=\"summary\"}\n{/if}\n```\n\n现在，评论表单将使用模板 **NewTicket**\
  \ 显示。此外，由于参数 `policy`，问题提交后表单会重定向到同一页面。\n\n要测试该模块，请使用两位不同的客户创建一些新工单，以查看它们是如何根据当前登录的客户进行分离的。我们稍后将为摘要和详细视图自定义模板。\n\
  \n现在，让我们看看如何通过管理控制台由支持人员实现回复工单的功能。\n\n## 为工单添加回复字段\n\n我们现在将在模块 **CGFeedback** 中创建两个自定义字段。第一个将包含回复工单的支持人员姓名。第二个字段将包含回复内容。\n\
  \n### 行动时间 – 创建新字段\n\n支持人员应能够回复支持工单并将他们的姓名存储到每个回复中。让我们创建将包含此信息的新的字段。\n\n- 1. 在管理控制台中，点击\
  \ **Content | Calguys Feedback Module**，并选择 **Fields** 选项卡。\n- 2. 点击 **Add a new\
  \ field**，其中包含支持人员的姓名，如以下屏幕截图所示：\n\n  ![](img/b21e3dc5c94405bc7b3f102758ea770c_235_0.png)\n\
  \n- 3. 点击 **Submit**。\n- 4. 然后，添加另一个字段以包含来自支持人员的回复文本，如以下屏幕截图所示：\n\n  ![](img/b21e3dc5c94405bc7b3f102758ea770c_236_0.png)\n\
  \n- 5. 点击 Submit。\n- 6. 在管理控制台中，打开一个现有工单（Content | Calguys Feedback Module）进行编辑，并在编辑屏幕中找到这两个自定义字段。\n\
  \n### 发生了什么？\n\n你已添加了两个自定义字段。从现在起，你可以在管理控制台中输入工单的回复，就像你是支持人员一样。回复将在网站上显示，前提是详细视图模板已正确自定义。这将在本章后面描述。\n\
  \n## 工单列表和工单详细视图的模板\n\n在自定义详细视图之前，让我们先创建一个新的摘要模板。摘要视图用于在工单提交表单下方显示由一位客户在 Service\
  \ Desk 页面上提交的所有工单列表。每个工单的标题链接到工单的详细视图，在那里显示来自员工的回复。\n\n### 行动时间 – 自定义工单列表\n\n应更改由客户创建并向其显示的工单列表的外观以满足我们的需求。\n\
  \n- 1. 在管理控制台中，点击 Content | Calguys Feedback Module，并选择 Summary Templates 选项卡。\n\
  - 2. 点击 New Template，并输入 TicketList 作为 Template Name。\n- 3. 将以下代码添加到 Template text\
  \ 字段中：\n\n```\n{if isset($comments)}\n    {foreach from=$comments item=\"one\"}\n\
  \        <p><strong>Ticket No {$one.id}: <a href=\"{$one.detail_url}\" title=\"\
  {$one.title}\">{$one.title}</a></strong><br/>\n            <small>{$one.created|date_format:\"\
  %a %d %b %H:%M\"} |\n            <a href=\"mailto{$one.author_email}\">{$one.author_name}</a>\n\
  \            </small>\n        </p>\n        <div class=\"feedback_item_data\">\n\
  \            {$one.data}\n        </div>\n    {/foreach}\n{/if}\n```\n\n- 4. 点击\
  \ Submit。\n- 5. 要将此模板用于工单列表，请打开页面 Service Desk（Content | Pages），并按以下代码片段所示修改工单摘要视图的\
  \ Smarty 标签：\n\n```\n{cms_module module=\"FrontEndUsers\"}\n{if !empty($customcontent_loggedin)}\n\
  \    {CGFeedback key1=\"Ticket\" key2=$userid commenttemplate=\"NewTicket\" policy=\"\
  session\"}\n    {CGFeedback key1=\"Ticket\" key2=$userid summarytemplate=\"TicketList\"\
  \ action=\"summary\"}\n{/if}\n```\n\n- 6. 点击 Submit。\n- 7. 模板显示所有工单的列表，包括其编号、标题和内容，如以下屏幕截图所示：\n\
  \n  ![](img/b21e3dc5c94405bc7b3f102758ea770c_237_0.png)\n\n### 发生了什么？\n\n你已为客户区域创建了一个新的工单列表模板。为了保持示例整洁，我已从摘要模板中移除了分页，但如果你愿意，可以从\
  \ Sample 模板中将其复制回来。\n\n在下一步中，修改工单详细视图的详细模板。在管理控制台中，点击 Content | Calguys Feedback\
  \ Module，并选择 Detail Templates 选项卡。点击 New Template，并在 Template Name 字段中输入 TicketDetail。在\
  \ Template Text 字段中，输入建议的代码如下：\n\n```\n<h3>Ticket No. {$onecomment.id}: {$onecomment.title}</h3>\n\
  <p>{$onecomment.created|date_format:\"%a %d %b %H:%M\"} |\n<a href=\"mailto:{$onecomment.author_email}\"\
  >\n{$onecomment.author_name}\n</a></p>\n<div class=\"feedback_item_data\">\n{$onecomment.data}\n\
  </div>\n{if isset($onecomment.fields)}\n{foreach from=$onecomment.fields key=\"\
  name\" item=\"field\"}\n{assign var=$name value=$field.value}\n{/foreach}\n{if !empty($Answer)}\n\
  <p><strong>Staff Answer</strong><br/>\n<small>{$onecomment.modified|date_format:\"\
  %a %d %b %H:%M\"} |\n{$Staff}</small></p>\n<div>\n{$Answer}\n</div>\n{/if}\n{/if}\n\
  ```\n\n点击 Submit。要使用创建的模板显示带员工回复的工单，你必须将其设为默认。打开详细模板列表（Content | Calguys Feedback\
  \ Module，Detail templates 选项卡）并点击 Default 列中带有红色叉号的图标，以使模板 TicketDetail 成为默认。\n\n\
  Platforma AI 是一个 AI 驱动的平台，旨在简化从概念到部署创建 AI 解决方案的过程。它简化了构建、测试和部署聊天机器人和其他 AI 模型，使其对开发人员和非开发人员都可访问。凭借其全面的工具包，企业可以快速高效地将\
  \ AI 集成到其运营中，专注于创新而非基础设施管理。\n\n主要产品包括预训练模型和无代码构建器，可实现快速原型制作。该平台支持各种 AI 任务，例如自然语言处理（NLP）和计算机视觉，并通过\
  \ API 提供灵活的集成选项。其直观的界面使用户能够轻松管理其 AI 项目，确保从开始到结束的顺畅体验。\n\nPlatforma AI 还专注于可扩展性和安全性，确保解决方案随着业务增长而扩展，同时保持数据保护。无论你是经验丰富的\
  \ AI 专家还是初学者，该平台都提供必要的工具和支持，将你的 AI 想法变为现实。\n\n\n\n\n\n## 创建自己的功能\n\n为了锦上添花，创建一个对话框表单的模板和一个对话框摘要视图的模板。对话框表单不需要任何特殊标题，因为它会获取工单的标题并以\
  \ **Re:** 作为工单标题的前缀。它也将使用工单中的值进行预填充。创建一个新的评论表单模板，并将以下代码片段添加到其中：\n\n```smarty\n{if\
  \ isset($message)}\n    <p class=\"info\">{$message}</p>\n{else}\n    {if isset($error)}\n\
  \    <p class=\"error\">{$error}</p>\n    {/if}\n    {$formstart}\n    <p><input\
  \ type=\"hidden\" name=\"{$actionid}title\" value=\"Re: {$onecomment.title}\"/></p>\n\
  \    <p><label>{$mod->Lang('prompt_your_name')}:</label>\n        <input type=\"\
  text\" name=\"{$actionid}author_name\"\n            value=\"{$onecomment.author_name}\"\
  />\n    </p>\n    <p><label>{$mod->Lang('prompt_your_email')}:</label>\n       \
  \ <input type=\"text\" name=\"{$actionid}author_email\"\n            value=\"{$onecomment.author_email}\"\
  />\n    </p>\n    <p><label>Question:</label>\n        <textarea name=\"{$actionid}comment\"\
  \ cols=\"40\"\n                rows=\"5\">{$comment}</textarea></p>\n    <p><input\
  \ type=\"submit\" name=\"{$actionid}submit\" value=\"{$mod->Lang('submit')}\"/>\n\
  \    </p>\n    {$formend}\n{/if}\n```\n\n将模板保存为名称 **TicketDialogue**。在工单的详细视图中（模板\
  \ **TicketDetail**），调整底部的 Smarty 标签以使用新的表单模板，如以下代码片段所示：\n\n```smarty\n{CGFeedback\
  \ key1=\"Dialogue\" key2=$userid key3=$onecomment.id\n action=\"summary\" sortorder=\"\
  ASC\"}\n<hr/>\n{CGFeedback key1=\"Dialogue\" key2=$userid key3=$onecomment.id\n\
  \ policy=\"session\" commenttemplate=\"TicketDialogue\"}\n```\n\n通过最后一步，你可以向客户展示员工的回答，以便在工单内显示整个对话。创建一个新的摘要模板（**Content\
  \ | Calguys Feedback Module**，选项卡 **Summary Templates**）并使用以下代码片段：\n\n```smarty\n\
  {if isset($comments)}\n    {foreach from=$comments item='one'}\n        <p><strong>{$one.title}</strong><br/>\n\
  \            <small>{$one.created|date_format:\"%a %d %b %H:%M\"} | <a\n       \
  \         href=\"mailto:{$one.author_email}\">{$one.author_name}</a>\n         \
  \   </small>\n        </p>\n        <div class=\"feedback_item_data\">\n       \
  \     {$one.data}\n        </div>\n        {if isset($one.fields)}\n           \
  \ {foreach from=$one.fields key='name' item='field'}\n                {assign var=$name\
  \ value=$field.value}\n            {/foreach}\n            {if !empty($Answer)}\n\
  \                <p><strong>Staff Answer</strong><br/>\n                    <small>{$one.modified|date_format:\"\
  %a %d %b %H:%M\"} |\n                        {$Staff}</small>\n                </p>\n\
  \                <div>\n                    {$Answer}\n                </div>\n\
  \            {/if}\n        {/if}\n    {/foreach}\n{/if}\n```\n\n将模板保存为名称 **DialogueList**。在工单的详细视图中（模板\
  \ **TicketDetail**），调整底部的 Smarty 标签以使用新的摘要模板，如以下代码片段所示：\n\n```smarty\n{CGFeedback\
  \ key1=\"Dialogue\" key2=$userid key3=$onecomment.id\naction=\"summary\" sortorder=\"\
  ASC\" summarytemplate=\"DialogueList\"}\n<hr/>\n{CGFeedback key1=\"Dialogue\" key2=$userid\
  \ key3=$onecomment.id\npolicy=\"session\" commenttemplate=\"TicketDialogue\"}\n\
  ```\n\n现在，基本服务台功能已完成。客户可以在其个人区域提交问题，支持团队可以从 CMS Made Simple 的管理控制台回答问题，客户可以回复答案。\n\
  \n使用模块中已实现的管理员通知功能，以便在新工单打开或添加新回复时通知支持人员。\n\n在模块 Calguys Feedback Module 的管理区域（选项卡\
  \ Fields）中，您可以创建一个新的自定义字段，允许以下其中一个值：Opened、Waiting for Response 或 Closed。使用字段类型\
  \ Dropdown 来定义它。支持人员在处理工单时可以设置此字段，并在工单的摘要视图中显示它，以便客户可以看到工单的当前状态。\n\n您已经看到如何使用一个并非专门用于创建服务台的模块来设置所需的功能。保持开放的心态并尝试使用模块。即使其描述并非完全符合您的需求，您也可以按本节所示的方式使用它。\n\
  \n### 测验 – 创建自己的功能\n\n1. 为什么在 FrontEndUsers 模块中设置首选项时，应选择 Allow users to login more\
  \ than once 框？\n    a. 当用户当前已登录并且会话在浏览器中过期而非服务器上时，用户将无法再次登录。\n    b. 您应该给具有双重人格的用户一个机会同时至少登录两次。\n\
  \    c. 许多用户在不同的电脑上工作（私人、办公室等），因此他们可以从多台电脑登录。\n    d. 当此框未被选中时，不可能在用户一旦忘记时生成新密码（或重新生成用户名）。\n\
  \n2. 根据以下用于受保护页面的 Smarty 标签，正确的说法是什么？\n\n    ```smarty\n    {CGFeedback key1=\"\
  Ticket\" key2=$userid}\n    {CGFeedback key1=\"Ticket\" key2=$userid action=\"summary\"\
  }\n    ```\n\n    a. 这些标签显示所有注册用户编写的所有评论的摘要视图。\n    b. 这些标签显示一个用户编写的所有评论的评论表单和摘要视图。\n\
  \    c. 这些标签显示所有当前访问网站的用户编写的所有评论的摘要视图。\n    d. 这些标签显示所有具有相同 ID 的用户编写的所有专业书籍摘要的评论表单和摘要视图。\n\
  \n3. 使用支持工单系统的优势是什么？\n    a. 网站会因为工单系统现代而获得更多访客，用户会将这一事实投射到整个网站。\n    b. 用户可以与服务人员就其需求和问题进行非公开讨论。\n\
  \    c. 用户可以以特殊价格获得冠军联赛门票。\n    d. 用户可以在论坛中就其需求和问题进行公开讨论。\n\n### 试一试英雄 – 创建自己的功能\n\
  \n在您说没有模块可以满足我的需求并开始开发之前，请尝试弄清您的需求是否可以用现成手段解决。许多模块只是某种分类目录，因此可以用模块 CTLModuleMaker\
  \ 来创建。而且，正如您所见，尝试更抽象地看待您的需求，并在从头开始开发之前反思使用其他模块来解决您的功能。\n\n### 总结\n\n我们在本章中学到了很多关于实现\
  \ CMS Made Simple 的任何现成模块都不涵盖的我们自己的功能的内容。\n\n具体来说，我们涵盖了：\n\n- **Module Maker：**\
  \ 使用类似目录的内容创建全新的自定义模块。\n- **Custom Area：** 在网站上启用登录功能并使用反馈模块创建基础服务台功能。\n\n现在我们已经了解了如何创建自己的功能，您可以跟随一个关于如何使用\
  \ CMS Made Simple 实现基本电子商务解决方案的工作坊。如果您不需要任何电子商务功能，您现在就可以将网站上线，因为到此时，您的网站已完全可用。\n"
- "## 9 电子商务工作坊\n\nCMS Made Simple 正如其名称所示，是一种内容管理系统。在 CMS 中，数据可以定义为几乎任何东西——文档、电影、图片、电话号码、科学数据等等。CMS\
  \ 通常用于存储、控制、修订和发布内容。它们并非专门为电子商务或社区需求而设计。对于没有任何内容管理功能的复杂在线商店，最好获取一个专门的电子商务应用程序。同样适用于典型的社区功能，如论坛或聊天。\n\
  \n然而，如果您的网站是异构的，那么它不仅仅是一个内容管理系统，而是有各种功能的混合。您可以使用附加模块来实现其他应用程序的基本功能。在 CMS Made Simple\
  \ 中，有一些社区模块，如 Forum Made Simple（FMS）和 Shoutbox Made Simple，以及涵盖基本电子商务功能的多个模块。\n\n\
  对于 CMS Made Simple 来说，多个附加电子商务模块在开始时可能会令人困惑。实际上，有不同的解决方案，如电子商务套件、Shop Made Simple（SMS）和\
  \ Cataloger。这些不同的解决方案在任何方面都不兼容，也不能在同一个网站上一起使用。\n\n在本章中，您将了解一个由九个模块组成的解决方案，它提供了最广泛的功能。该套件可以通过多个附加模块来丰富以获得更多功能。CMS\
  \ Made Simple 的用户经常想知道为什么需要这么多模块才能获得一个基本的在线商店。这是一种 CMS Made Simple 的理念，即像乐高系统一样运作，您可以构建所需的解决方案，而无需安装一个包含您永远不会使用的功能的大包。\n\
  \n\n\n\n\n这个解决方案由以下列出的九个模块组成：\n\n- **CGExtensions**\n- **CGSimpleSmarty**\n- **Products**\n\
  - **Cart**\n- **FrontEndUsers**\n- **SelfRegistration**（可选）\n- **CGPaymentGatewayBase**\n\
  - **Orders**\n- **PaypalGateway**（可选）\n\n其中两个是可选的。**SelfRegistration** 模块将允许你的买家在结账过程中注册网站。最后一个模块\
  \ **PaypalGateway**，如果使用 **PayPal** 服务即时从网站收取付款，则应安装该模块。对于本研讨会，我将使用来自官方 CMS Made\
  \ Simple 商店的产品，该商店可在 http://www.cafepress.co.uk/cmsmadesimple 找到。我还假设你已经知道如何安装模块以及使用\
  \ HTML、CSS 和 Smarty 自定义模块模板。\n\n## 模块 Products\n\n**Products** 模块将是你的电子商务解决方案的核心。该模块是保存你希望在商店中销售的产品的地方。通常，可以使用任何其他模块作为解决方案，但这意味着你必须对模板进行大量修改，并且可能还要修改模块的\
  \ PHP 代码。\n\n使用 **Products** 模块，你可以管理：\n\n- 产品\n- 会影响价格的产品属性（如尺寸或颜色）\n- 分类\n- 产品层级\n\
  - 自定义字段\n\n该模块是稍后你将使用的所有其他模块的基础。毕竟，如果你没有地方存储产品，就无法开设商店。\n\n使用 **Module Manager**\
  \ 安装 **Products** 模块。在安装之前，请注意模块的 **Dependencies** 部分。**CGExtensions** 和 **CGSimpleSmarty**\
  \ 这两个模块提供了便利的 API、可复用的表单以及供其他模块使用的 Smarty 标签。如果你不是程序员，你可能不需要对这些模块做任何事情，除了在需要时调整一些首选项。在这里描述的研讨会中，你只需要安装它们即可。\n\
  \n### Time for action – adding the first product\n\n在安装 **Products** 模块后，我们将把它显示在页面\
  \ **Shop** 上并按如下方式添加第一个产品：\n\n1. 创建一个新的内容页面 **Shop（Content | Pages | Add New Content）**。\n\
  2. 在页面的 **Content** 字段中添加 Smarty 标签 `{Products}`。如果你此时在浏览器中查看页面，它不会显示任何内容，因为你尚未向商店添加任何产品。\n\
  3. 在 CMS Made Simple 的管理控制台中，点击 **Content | Product Manager**。\n4. 在 **Products**\
  \ 选项卡下，点击 **Add A Product** 链接并按以下截图添加你的产品：\n\n   ![](img/b21e3dc5c94405bc7b3f102758ea770c_246_0.png)\n\
  \n5. 点击 **Submit** 并查看网站上的 **Shop** 页面。\n\n### What just happened?\n\n你已向 **Products**\
  \ 模块添加了第一个产品。该产品在页面上显示了 **Price** 和 **Weight**（我们稍后可以删除此字段）。点击产品链接以查看产品的详细视图。模板看起来很技术化，但有了一些\
  \ HTML、CSS 和 Smarty 知识，你稍后可以改变其外观和感觉。让我们先专注于模块的功能，而不是设计。\n\n在 **Product Manager**\
  \ 中添加更多产品，并在 **Shop** 页面上查看产品列表。请注意，每个产品的详细视图都以相同的方式显示。在 **Products** 模块中，已经定义了一些字段，如\
  \ **Price** 和 **Weight**。但你需要添加自己的字段。\n\n### Creating custom fields\n\n通常在线商店中可以找到一个或多个产品的图片。然而，并没有专门的图片字段可以上传产品图片。幸运的是，你可以添加任意数量的自定义字段。在下一步中，你将创建一个自定义字段，可以在此上传产品的图片。在\
  \ **Product Manager** 的管理区域中，选择选项卡 **Field Definitions** 并点击链接 **Add A Field**。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_247_0.png)\n\n**Name** 是一种技术性字段，不会显示给你的访客。你不应在字段名称中使用任何特殊字符或空格。只使用字母和数字，不要使用连字符、斜杠或其他任何非字母数字字符。\n\
  \n**Prompt** 字段是你在 **Product Manager** 的管理区域中添加或编辑产品时看到的字段标签。你可以在此字段中使用任何字符。\n\n\
  字段的 **Type** 应为 **Image**。选择此类型可确保该字段在管理区域中显示为文件上传字段。此字段也将被验证，因此只有图片可以上传到这里。此外，上传后会自动为上传的图片创建缩略图（小预览版本）。\n\
  \n通过选中 **Is this a public field?** 的复选框让该字段公开。这意味着该字段的内容（图片本身）将显示给商店的访客。如果你将其设为私有，只有网站管理员可以在模块的管理区域中看到该字段。\n\
  \n保存该字段。该字段会自动添加到页面上的详细模板以及 **Product Manager** 管理区域中的产品编辑视图中。为了测试该字段，在管理区域中打开任意产品进行编辑，找到字段\
  \ **Product image (Prompt)**，并使用该字段为产品上传图片。\n\n控制该字段在网站上产品详细视图中的显示方式。产品的小预览版本被添加到详细视图的\
  \ **Custom Fields** 部分。我们仍然不关心它看起来如何，而关心它如何工作。当我们准备好所有自定义字段和产品层级时，我们将更改产品的详细视图。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_248_0.png)\n\n> **Image already exists**\n\
  >\n> 当你尝试两次上传同一张图片时，你会收到一条错误信息，提示该图片已被上传。要控制为产品保存了哪些图片以及删除它们，请在管理控制台中打开 **Content\
  \ | File Manager**。找到文件夹 Products，然后找到文件夹名称 `product_[ID]`。产品的 ID 显示在管理区域的产品列表中。点击此文件夹并删除已上传的图片。现在，你可以在\
  \ **Product Manager** 的管理区域中再次上传同一张图片。\n\n### Define your own fields\n\n创建尽可能多的自定义字段来显示和管理产品。通过字段的\
  \ **Type** 你决定该字段在管理区域中如何显示。字段在页面上的输出可以完全自定义，并且不依赖于类型。\n\n如果你需要一个 **Product Number**\
  \ 字段，创建一个新的自定义字段（**Text Input**），最大长度为 12 个字符，并使该字段公开。然后编辑你的每个产品并在此字段中输入一个号码。你可以在\
  \ **Field Definitions** 选项卡下调整字段的顺序。再次说明，此顺序仅适用于产品管理的管理区域的外观；页面上的输出可以完全不同。\n\n###\
  \ Creating a product hierarchy\n\n接下来，让我们创建一个产品层级。在我试图在此处复现的官方商店中，有四个层级项：\n\n- Shirts\
  \ (short)\n- Shirts (long)\n- Home & Office\n- Mugs\n\n你应该理解 Product Manager 模块中产品分类和产品项之间的区别。产品分类有点像产品的标签。不可能将它们排列成层级结构。然而，如果你愿意，可以将一个产品分配给多个分类。与分类不同，一个产品只能属于一个层级项。这意味着上述结构应作为层级实现，而不是作为分类。一个产品不能同时是衬衫和马克杯。\n\
  \n我们稍后将使用分类来标记产品为：\n\n- New\n- Popular\n- Discounted\n\n分类将允许你使一个产品同时为新品和折扣品。层级则不会，因为不支持多重分配。\n\
  \n在 Product Manager 的管理区域中，点击 Product Hierarchy 选项卡并创建第一列表中显示的四个层级项。你可以选择是否向层级添加任何描述或图片，也可以将其留空。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_249_0.png)\n\n\n\n\n创建层次结构后，请检查已创建的产品，并将它们分配到相应的层次项目。现在，该层次结构可以显示在页面的侧边栏导航中。打开主页模板（布局\
  \ | 模板），找到带有侧边栏导航的部分。添加产品层次结构的 Smarty 标签，如下所示：\n\n```\n{Products action=\"hierarchy\"\
  }\n```\n\n## 自定义产品模板\n\n产品层次结构模板的显示非常技术化。让我们自定义该模块的所有模板。共有三个：\n\n- 摘要模板\n- 详细模板\n\
  - 层次结构报表模板\n\n让我们从层次结构报表模板开始。该模板定义了侧边栏中层次结构的显示方式。在产品管理器的管理区域中，单击“层次结构报表模板”选项卡，找到现有的层次结构模板列表。默认使用的是\
  \ Sample 模板。您可以自定义此模板，或通过单击“新建模板”链接创建自己的模板。我选择第二种方式。通常建议不要修改示例模板，而是创建自己的模板并将其设置为默认模板。这样，您可以从自定义模板中删除任何内容，如果需要从自定义模板中移除某些部分，可以参考\
  \ Sample 模板。对于模板名称，我选择了“My Shop”。当然，您可以使用任何想要的名称。\n\n在“模板文本”字段中，已经提供了示例模板代码。请保留此代码并提交新模板。现在您会在列表中看到两个模板。通过单击“默认”列中的红色叉号，将模板“My\
  \ Shop”设为默认模板。让我们看看模板中有什么，以及我们实际需要什么。打开新模板进行编辑：\n\n| Smarty 变量 | 描述 |\n|---|---|\n\
  | {$hierarchy_item.name} | 层次项目的名称。 |\n| {$hierarchy_item.id} | 层次项目的 ID。 |\n| {$upurl}\
  \ | 指向父层次项目的 URL。仅当存在多个层次级别时适用。 |\n| {$mod} | 包含有关 Products 模块所有信息的对象。在模板中，该对象用于获取翻译：{$mod->Lang('parent')}\
  \ 从翻译文件返回键为 parent 的翻译。如果您的网站是单语言的，并且网站语言永远不会更改，则可以用自定义文本替换此变量。 |\n\n```\n    {$node.name}\n\
  \    {/if}\n    </h3>\n    {if !empty($node.description)}\n    <div>{$node.description}\n\
  \    </div>\n    {/if}\n    {/foreach}\n{/if}\n\n<!-- This tag will be automatically\
  \ added to the page content.\n    It uses the default summary template for products.\
  \ -->\n{Products hierarchyid=$hierarchy_item.id}\n```\n\n该模板遍历每个层次结构，并将其名称显示为 HTML\
  \ 标题 `<h3>`。它还会在标题下方显示层次项目的描述字段。模板中的最后一个 Smarty 标签显示产品摘要列表，该列表仅限于在侧边栏中选择的层次项目。此摘要列表的模板是默认的摘要模板。产品摘要列表将自动替换页面内容。\n\
  \n在自定义摘要模板之前，请打开它（内容 | 产品管理器，“摘要模板”选项卡，模板 Sample），并找出该模板的主要部分。它包括：\n\n- 类别下拉列表\n\
  - 页面导航\n- 产品列表，每个产品都带有加入购物车功能\n\n目前，您只能看到产品列表，没有类别、页面导航和购物车功能。\n\n在当前版本的模块中，按示例模板中添加的方式显示类别下拉列表并不起作用：\n\
  \n```\n    {if isset($catformstart)}\n        {$catformstart}\n        {$catdropdown}{$catbutton}\n\
  \        {$catformend}\n    {/if}\n```\n\n该功能仍有可能在模块的后续版本中添加。目前，您可以完全删除此部分，或将其替换为如下所示的\
  \ Smarty 标签：\n\n```\n{Products action=\"categorylist\"}\n```\n\n```\n```css\n{\n\
  \    float: left;\n    padding: 15px;\n    text-align: center;\n}\n```\n```\n\n\
  这只是一个示例；您可以根据自己的设计自由添加任何样式。\n\n上传产品图片时创建的缩略图大小可以在 **偏好设置（内容 | 产品管理器）** 选项卡中更改。在此页面上，向下滚动到\
  \ **图像处理设置** 部分，然后根据您的喜好调整数值。\n\n如果您已经使用了我的模板，那么您的摘要模板和层次结构应如下图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_255_0.png)\n\
  \n最后一步将是自定义产品的详细视图。在 **Products** 模块管理区域的 **详细模板** 选项卡下，创建一个名为 **My Shop** 的新模板。然后将该模板设置为默认模板。\n\
  \n在详细模板中，您会找到一个用于产品属性的部分。我们之前没有讨论过它。产品可以有不同的属性，例如 T 恤的尺寸或颜色。这些属性可能会或可能不会影响价格。对于每个产品，属性都是单独添加的。如果我们只有一种型号，那么为鼠标垫添加尺寸或颜色就没有意义。\n\
  \n让我们为长 T 恤创建颜色属性。假设我们有两种可用颜色：白色和灰色。颜色不会改变产品的价格。在 **Products** 模块的管理区域中，单击 **Products**\
  \ 选项卡。在产品列表中，每行末尾都有一个 **编辑属性集** 图标。单击您要添加属性的产品所在行上的此图标。\n\n在下一个屏幕上，单击 **添加属性**。输入属性的名称。此名称包含通用术语，如“颜色”。在\
  \ **标签** 字段中，输入属性名称，就像它应该出现在网站上一样。由于 T 恤的颜色不会改变产品价格，请在 **价格调整** 字段中输入 **0**，然后点击\
  \ **更新**。为颜色 **灰色** 添加另一个标签。它应如下图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_256_0.png)\n\
  \n为该属性输入所有可能值后，单击 **提交**。查看带有已定义属性的产品的详细视图。所有可能值都列在模板中。当您以后安装 **购物车** 模块时，您不仅能够显示属性，还可以将它们添加到购物车。价格将在购物车视图中自动调整。\n\
  \n您现在应该能够自行自定义详细模板。\n\n请按照以下步骤操作：\n\n- 1. 创建一个新模板，不要覆盖示例模板。如果您从自定义模板中删除了任何部分，**示例模板**可用于将来参考。\n\
  - 2. 分析模板。尝试找出其主要部分以及其中其他模块的用法。\n- 3. 将模板中使用的所有 Smarty 变量写入表格，如前面对 **层次结构报表模板**\
  \ 所做的那样。\n- 4. 弄清楚这些变量中保存了哪些值。如果变量包含数组，请使用 Smarty 修饰符 `print_r` 获取其所有数组值。例如，`{$entry|print_r}`\
  \ 将输出此变量中包含的所有值。\n- 5. 使用 HTML 和 Smarty 标记模板。\n- 6. 添加样式表定义以更改外观。\n\n## 创建产品的详细视图\n\
  \n按照上面的列表，为产品的详细视图创建您自己的模板。删除模板中不需要的所有内容；例如，“重量”字段。以与在摘要模板中相同的方式分配自定义字段（产品图片和产品编号）。如果不确定必须使用什么，请使用修饰符\
  \ `print_r` 检查变量的值。\n\n我的详细模板如下图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_257_0.png)\n\
  \n我用于详细模板的模板代码如下面的代码片段所示：\n\n```\n```html\n<div class=\"products-detail\">\n  <img\
  \ align=\"left\" src=\"{$entry->file_location}/{$entry->fields.image->value}\" alt=\"\
  {$entry->product_name}\"/>\n  <h1>{$entry->product_name}</h1>\n  <h2>{$currency_symbol}{$entry->price}</h2>\n\
  \  <div>{$entry->details}</div>\n```\n```\n\n\n\n\n```\n{* print out attributes\
  \ *}\n{if isset($entry->attributes)}\n  {foreach from=$entry->attributes key='name'\
  \ item='attribset'}\n    <p><strong>{$name}:</strong>\n      {foreach from=$attribset\
  \ key='label' item='adjustment'}\n        {$label} ({$currency_symbol}{$adjustment}),\n\
  \      {/foreach}\n    </p>\n  {/foreach}\n{/if}\n  {* include the cart *}\n  {if\
  \ isset($cart_module_tag)}\n  {eval var=$cart_module_tag}\n  {/if}\n</div>\n```\n\
  \n现在，你已经准备好为你的解决方案添加购物车功能了。\n\n## 购物车模块\n\n该模块将为**产品**模块添加简单的购物车功能。安装后，**购物车**模块将自动显示在产品详情视图中。网站访客随后将能够将一件或多件产品及其所需数量放入购物篮。除了**购物车**模块，你还可以使用其他模块，例如**礼品篮**。对于我们的示例**商店**，使用**购物车**模块的简单功能就足够了。\n\
  \n在**模块管理器**中的可用模块列表中安装**购物车**模块。该模块的管理区域将被添加到 CMS Made Simple 管理控制台的**扩展 | 购物车**下。\n\
  \n## 动手实践——连接产品与购物车\n\n如果你现在查看**商店**页面并打开任意产品的详情视图，你会发现其中仍然没有购物车功能。原因是**产品**模块并不知道**购物车**模块已经安装并可供使用。让我们来连接这两个模块。\n\
  \n- 1. 打开**产品**模块的管理区域（**内容 | 产品管理器**）。\n- 2. 点击**偏好设置**选项卡。\n- 3. 从**购物车模块**字段中选择**购物车**模块。\n\
  - 4. 点击提交，然后打开任意产品的详情视图。你应该会在产品详情视图中看到“添加到我的购物车”按钮。如果产品除数量字段外还有一些属性，那么这些属性会显示在其旁边的下拉字段中。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_259_0.png)\n\n## 刚才发生了什么？\n\n你已经告诉**产品**模块，需要使用哪个模块来实现购物车功能。现在测试一下，立即向购物车中添加一些产品。产品会被添加成功，但目前访客还无法看到购物车的内容。\n\
  \n创建一个名为“购物车”的新内容页面，并将以下 Smarty 标签添加为该页面的内容：\n\n```\n{Cart action=\"viewcart\"}\n\
  ```\n\n保存页面，然后打开**购物车**模块的管理区域（**扩展 | 购物车**），切换到**偏好设置**选项卡。在页面列表中选择刚刚创建的页面，这样访客将产品添加到购物车后会自动重定向到该页面。\n\
  \n该模块有四个模板可供你自定义：\n\n| 模板 | 描述 |\n|---|---|\n| AddToCart | 该模板控制数量字段、“添加到我的购物车”按钮（见前面的截图），以及可选的产品属性及其价格调整的显示样式。\
  \ |\n| MyCart | 该模板用于显示购物车状态。它显示在放置 Smarty 标签 `{Cart action=\"mycart\"}` 的位置。它显示当前保存在购物车中的商品数量，并提供指向购物车页面的链接。\
  \ |\n| Viewcart | 该模板用于扩展显示购物车中保存的所有产品。它显示所有产品的数量、价格以及订单总价。此外，如果已安装订单模块，它还提供启动结账订单流程的可能性。\
  \ |\n| Product Summary | 该模板用于格式化 Viewcart 模板中每个产品摘要的输出。它允许你根据属性、产品名称和价格自定义产品标签。\
  \ |\n\n从这个依赖列表中，你可以了解到它基于 **FrontEndUsers** 模块的功能。这意味着你网站的客户必须先注册，然后才能在你的在线商店中开始支付流程。这个注册过程无法关闭，并且是结账步骤所必需的。\n\
  \n安装前面依赖列表中列出的所有模块，然后安装 **订单**模块。\n\n## 动手实践——添加结账步骤\n\n要启用**订单**模块提供的结账流程，请按照以下步骤操作：\n\
  \n- 1. 创建一个新的内容页面（**内容 | 页面 | 添加新内容**），并将其命名为**结账**。\n- 2. 将以下 Smarty 标签添加到**结账**页面的**内容**字段中：\n\
  \n  ```\n  {Orders}\n  ```\n\n- 3. 在浏览器中保存并查看该页面。如果用户已登录，此页面将显示账单表单；如果用户未登录或不属于特定用户组，则显示警告消息。\n\
  - 4. 要连接**购物车**模块与新的**结账**页面，请在管理控制台中点击**扩展 | 购物车**。\n- 5. 选择**Viewcart 表单模板**选项卡，然后点击**Sample**模板（或你自己的模板，如果你已创建了一个）。\n\
  - 6. 在**模板文本**字段的模板末尾，添加以下代码行：\n\n  ```\n  {cms_selflink page=\"checkout\"}\n  ```\n\
  \n- 7. 打开你的商店，将一件或多件产品添加到购物车，然后在屏幕最底部找到指向**结账**页面的链接。\n\n```\n{Orders}\n```\n\n\
  ```\n{cms_selflink page=\"checkout\"}\n```\n\n> 参数 `page` 应包含已将 Smarty 标签 `{Orders}`\
  \ 添加到内容中的页面的页面别名。\n\n## 刚才发生了什么？\n\n你通过从购物车视图放置指向结账流程的链接，将**购物车**模块与**订单**模块连接了起来。要测试该链接，请向购物车中添加一些产品，然后点击购物车视图底部的**结账**链接。如果未登录，你将看到以下消息：\n\
  \n## 用户未登录（或不是所需组的成员）\n\n这条消息可以在**订单**模块的模板中找到。不过，首先让我们看看该模块附带的模板概览。在管理控制台中，点击**内容\
  \ | 订单管理器**，然后在订单列表上方找到**模板**链接：\n\n| **账单表单** | 该模板控制订单处理的第一步。它显示一个表单，客户可以在其中输入账单地址以及一个或多个送货地址。\
  \ |\n| **支付表单** | 该模板控制订单处理的第二步，用于显示基于手动电子邮件结账流程的支付表单。如果你不使用 PayPal、EMoney、eWay\
  \ 或 Authorize.Net 等支付服务，你将需要此模板。 |\n| **确认订单** | 该模板控制订单处理的第三步，用于显示客户在第一步（以及可选的第二步）中输入的任何信息，以便客户确认送货地址和发票地址，或返回修改。\
  \ |\n| **发票** | 该模板在**订单**模块的管理区域中使用，用于打印发票或通过电子邮件将其发送给客户。 |\n| **网关完成** | 该模板用于在使用\
  \ PayPal、EMoney、EWay 或 Authorize.net 等第三方服务完成支付后显示状态消息。 |\n| **用户邮件** | 该模板用于自定义在新订单提交后发送给客户的订单确认电子邮件。\
  \ |\n| **管理员邮件** | 该模板控制新订单提交后发送给商店授权管理员的电子邮件的布局和内容。 |\n| **消息** | 消息没有示例模板。你可以在其中定义自定义电子邮件通知，并从模块的管理区域手动发送给客户。此类消息的一个示例是在订单发货时发送的电子邮件通知。\
  \ |\n\n现在，我们知道了从哪里开始，以及如何根据我们的需求和支付配置进行模板定制。让我们为客户提供注册或登录网站的机会，以便他们能够完成结账流程。\n\n\
  \n\n\n## 集成登录屏幕\n\n提示客户未登录的消息保存在模板 **Billing Form**（结账流程的第一步）中。\n\n用户未登录（或不是所需组的成员）。\n\
  \n这并不太友好。无论用户是否已注册，我们都应在此页面为其提供登录或注册的可能性，如以下屏幕截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_263_0.png)\n\
  \n已注册客户的登录表单可通过模块 **FrontEndUsers** 显示。该模块在第 8 章 *Creating Your Own Functionality*\
  \ 中 *Managing visitors' logins* 部分有讨论。如果您尚未安装该模块，请使用 **Module Manager** 进行安装并在网站上查看登录表单。客户可注册的页面链接将由后续讨论的\
  \ **SelfRegistration** 模块提供。\n\n在 **Orders** 模块的管理区域中，单击 **Templates** 链接并在 **Billing\
  \ Form** 选项卡上创建一个名为 **My Shop** 的新模板。将建议的模板文本滚动到最底部，找到最后一个 ELSE 条件：\n\n```\n...\n\
  {else}\n  {* user is not logged in, gotta make him *}\n  <h3 style=\"color: red;\"\
  >{$Orders->Lang('error_notloggedin')}</h3><br/>\n{/if}\n```\n\n这是显示用户未登录消息的位置。用模块\
  \ **FrontEndUsers** 的登录屏幕替换此部分，如以下代码片段所示：\n\n```\n...\n{else}\n\n<h1>Already registered?</h1>\n\
  {FrontEndUsers}\n\n{/if}\n```\n\n保存模板并不要忘记将其设为 **Default** 以在网站上看到更改。已注册客户现在可以登录以开始结账流程。\n\
  \n但是，对于没有账户的客户怎么办？他们应该能够自行在我们的网站上注册。由于流程有点复杂，我制作了以下流程图：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_264_0.png)\n\
  \n账单表单会检查访客是否已登录。如果已登录，他可以填写账单信息；如果未登录，则显示 **FrontEndUsers** 模块的登录表单（步骤 3）。工作流中的步骤\
  \ 4 和 5 应通过允许他们注册来帮助新客户。这些步骤可通过 **SelfRegistration** 模块完成。请阅读下一节，了解如何配置该模块。\n\n\
  继续之前请确保：\n\n- **CMSMailer** 模块已配置并且能够发送消息（请参阅第 2 章 *Getting Started*）。\n- 在模块 **FrontEndUsers**\
  \ 中存在类型为 **Email Address** 的用户属性（**Users & Groups | Frontend User Management**，选项卡\
  \ **User Properties**）。\n- 存在一个具有上述用户属性关联为 **Required** 的用户组（**Users & Groups |\
  \ Frontend User Management**，选项卡 **Groups**）。\n\n您可以在第 8 章 *Creating Your Own Functionality*\
  \ 中阅读如何配置 **FrontEndUsers** 模块。\n\n## 集成客户注册\n\n该模块旨在允许网站访客自行注册。它可选择发送一封包含激活链接的确认电子邮件，必须在注册完成前点击该链接。注册完成后，模块\
  \ **FrontEndUsers** 中会创建一个用户账户。\n\n从 **Module Manager** 中可用模块列表安装 **SelfRegistration**\
  \ 模块。对于注册页面，创建一个新的内容页面 **Register** 并将以下 Smarty 标签添加到页面的内容中：\n\n```\n{SelfRegistration\
  \ group=\"Customers\"}\n```\n\n请注意上面代码中加粗的部分。参数 group 的值应与模块 **FrontEndUsers** 中用户组的名称完全一致（**Users\
  \ & Groups | Frontend User Management**，选项卡 **Groups**）。如果您目前还没有任何用户组，请阅读第 8 章 *Creating\
  \ Your Own Functionality* 以了解应如何配置 **FrontEndUsers** 模块。\n\n打开您网站的 **Register**\
  \ 页面并使用 **SelfRegistration** 模块以新客户身份自行注册，以查看模块的默认工作方式。模块中存在一些首选项可使注册流程更友好。在 **Self\
  \ Registration** 模块的管理区域（**Users & Groups | Self Registration Module**）中，单击 **Preferences**\
  \ 选项卡。\n\n**SelfRegistration** 模块提供带电子邮件验证步骤的注册，或可选的无需确认的单步注册。如果您不需要电子邮件验证，应在模块的\
  \ **Preferences** 选项卡上取消选择选项 **Require the user to confirm registration via email**。根据所选择的注册方法，关于最终消息的三个设置的工作方式不同。\n\
  \n| 设置 | 带验证 | 不带验证 |\n|---|---|---|\n| **Don't display the final message after\
  \ registration** | 防止注册表单在提交后被确认消息替换。 | 防止注册表单在提交后被最终消息替换。 |\n| **PageID/Alias to\
  \ redirect to after registration is complete** | N/A | 重定向到给定页面，但用最终消息替换页面的全部内容。\
  \ |\n| **PageID/Alias to redirect to after verification step is complete** | 重定向到给定页面，但用最终消息替换页面的全部内容。\
  \ | N/A |\n\n根据工作流程，让我们为新客户添加一个指向注册页面的链接（步骤 4）。在 **Orders** 模块的账单模板中，再次打开 **Billing\
  \ Form** 的模板，向下滚动并按以下代码片段所示为新客户添加指向注册页面的链接：\n\n```\n...\n{else}\n\n<h1>Already registered?</h1>\n\
  {FrontEndUsers}\n\n<h1>New Customer?</h1>\n{cms_selflink page=\"register\"}\n{/if}\n\
  ```\n\n## E-commerce Workshop\n\n请注意参数 page。它应包含显示注册表单的页面的别名。自定义 **SelfRegistration**\
  \ 模块中显示注册表单的 **Registration Template 1**。通常有两个模板。第一个用于注册表单，第二个（**Post Registration\
  \ Template**）包含通知客户其注册应通过发送到其电子邮件地址的链接进行确认的消息。您可以自定义的其他模板如以下表格所示：\n\n| 模板 | 描述 |\n\
  |---|---|\n| **Registration Template 2** | 该模板包含用于添加用户名、验证码和密码以完成注册的表单。 |\n| **Confirmation\
  \ Email** | 包含验证电子邮件的主题、客户注册后发送的电子邮件的纯文本和 HTML 版本。 |\n| **Final Message** | 注册流程完成后显示给客户的消息。为构建前面建议的工作流程（步骤\
  \ 5），在此模板中添加指向账单表单的链接，以便用户可以继续结账流程。还建议勾选选项 **Login user after registration**，以便注册后可跳过登录步骤。\
  \ |\n| **Lost Email** | 该模板包含一个表单，用于已注册但未收到验证电子邮件的客户。该模板显示在 Smarty 标签 `{SelfRegistration\
  \ mode=\"sendmoremail\"}` 显示的位置。 |\n\n当用户在网站上注册并且需要电子邮件验证时，临时用户账户保存在 **SelfRegistration**\
  \ 模块中（不是 **FrontEndUsers**！）。电子邮件验证完成后，新用户账户会自动移至 **FrontEndUsers** 模块。同时，临时账户会从\
  \ **SelfRegistration** 模块中删除。\n\n**SelfRegistration** 模块中临时账户的上限为 250 个。当达到 250\
  \ 个未验证账户的数量时，无法进行注册。因此您可通过 **Preferences** 选项卡上的选项从 **SelfRegistration** 模块中清除。\n\
  \n在配置完 **SelfRegistration** 模块并自定义所有必需模板后，您可以进行整个基于手动电子邮件的结账流程。\n\n我建议您使用工作流程测试所有三种情况：\n\
  \n- 访客已注册并已登录\n- 访客已注册，但未登录\n- 访客未注册\n\n\n\n\n从**模块管理器**中的可用模块列表中安装 **Paypal Gateway**\
  \ 模块。该模块的管理区域位于 **扩展 | Paypal Gateway**。点击 **偏好设置** 选项卡。模块使用需要一些字段，如下面的截图所示：\n\n\
  ![](img/b21e3dc5c94405bc7b3f102758ea770c_269_0.png)\n\n在测试电子商务解决方案时，您自然不会使用真实的 PayPal\
  \ 账户。建议的 **Paypal URL** 指向 PayPal 服务的官方测试环境。该环境模拟支付过程，而不会进行真实的资金转账。\n\n该环境可以在 `http://sandbox.paypal.com`\
  \ 上找到。它的运作方式与真实 PayPal 网站相同。\n\n## 行动时间——创建测试账户\n\n在使用此环境之前，您必须在 `http://developer.paypal.com`\
  \ 上注册一个开发者账户，并创建两个测试账户。\n\n- 1. 在浏览器中打开 `http://developer.paypal.com`，点击 **立即注册**。\n\
  - 2. 填写字段，点击 **同意并提交**。\n- 3. 使用您的电子邮件和密码登录您的开发者账户。\n- 4. 点击 **创建预配置的买家或卖家账户**。\n\
  - 5. 选择 **买家（用于代表您客户的体验）**，并用任意测试数据填写该字段。点击 **创建账户**。\n- 6. 创建另一个账户，但这次选择 **卖家（用于代表您自己作为商家）**\
  \ 作为 **账户类型**。\n\n**7.** 两个账户都创建后，点击左侧的 **测试账户**。您应该会看到测试账户的概览，如下面的截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_270_0.png)\n\
  \n## 刚才发生了什么？\n\n您已经创建了两个测试账户，一个用于买家，一个用于卖家。创建此类账户最简单的方法是选择预配置的账户。现在，您可以在 `http://sandbox.paypal.com`\
  \ 上使用买家账户登录，并像您自己的客户一样操作。您可以购买任何物品而无需支付真实金钱。\n\n您还可以使用卖家账户登录 http://sandbox.paypal.com\
  \ 进行配置。您必须为该账户激活 PDT 和 IPN 功能，获取 PDT 身份令牌，并在您的 PayPal 账户上进行更多设置，以便即时支付与 Paypal Gateway\
  \ 模块配合工作。\n\n## 配置 PayPal 的卖家账户\n\n点击卖家账户中的个人资料链接。您需要自定义四个部分，以便通过网站设置 PayPal 支付。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_271_0.png)\n\n## 收款偏好\n\n首先，决定您是否要手动接受以其他货币支付的款项。这仅适用于您的\
  \ PayPal 账户的默认货币与 Products 模块的偏好设置选项卡中设置的货币不同的情况。例如，如果您的 PayPal 货币是欧元，但在您的网页上产品以美元提供。通常，PayPal\
  \ 不会自动转换任何货币。这意味着所有以其他货币支付的款项都将被保留，直到您在 PayPal 账户中手动接受它们。一旦接受付款，订单状态将设置为“已支付”。如果您希望自动转换货币并接受任何货币的付款，您必须取消选择“阻止我未持有的货币向我发送的付款”这一设置。\n\
  \n其次，您可以阻止所有状态为“待处理”的付款。这将拒绝所有在付款确认后未立即完成的付款。请注意，如果激活了 IPN，Paypal Gateway 模块能够处理待处理的付款。\n\
  \n这是您生成的 PDT 身份令牌，您需要将其保存在 **Paypal Gateway** 模块的 **偏好设置** 选项卡中。\n\n## 语言编码\n\n\
  在此页面上，您应该调整语言编码。CMS Made Simple 默认使用 UTF-8 编码。点击 **更多选项** 按钮，并在 **编码** 字段中选择 UTF-8。为\
  \ IPN 保留相同的编码并保存。\n\n现在，您已经拥有配置 **Paypal Gateway** 模块所需的全部信息。在 **Paypal Gateway**\
  \ 模块的管理区域中，点击 **偏好设置** 选项卡，并输入您从 PayPal 沙箱环境中获得的自定义值。**Paypal Gateway** 模块中的 **Business\
  \ Email** 字段包含卖家账户生成的电子邮件地址。下面的截图显示了我的自定义值：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_273_0.png)\n\
  \n接下来，将 **Orders** 模块与 **Paypal Gateway** 模块连接。在 **Orders** 模块的管理区域中，点击 **偏好设置**\
  \ 选项卡，向下滚动到 **支付网关设置** 部分。在支付模块列表中选择 **Paypal Gateway** 模块，然后点击 **提交**。\n\n现在测试您的订单流程。注意账单表单中的\
  \ **Email** 字段，必须填写它才能进行 PayPal 支付。付款完成后，您必须检查卖家 PayPal 账户中的付款状态。它应该是“已完成”。在 CMS\
  \ Made Simple 的管理控制台中，点击 **站点管理 | 管理日志**，查看与 PayPal 网站的通信协议。对于每个通过 PDT 和 IPN 完成的订单，您应该有五条消息，如下面的截图所示：\n\
  \n| 用户 | 项目 ID | 项目名称 | 操作 |\n|---|---|---|---|\n| webmaster | 0 | PaypalGateway\
  \ | 收到交易 12Y48348G3951362M 的成功回复 |\n| webmaster | 0 | Orders | 订单 16 的状态更改为“待处理”\
  \ |\n|  | 0 | PaypalGateway:ipn | IPN 交易 12Y48348G3951362M 成功。状态：已完成 |\n|  | 0 |\
  \ Orders:gateway_event | 已为订单 16 处理异步交易 12Y48348G3951362M |\n|  | 0 | Orders | 已收到订单\
  \ 16 的付款。 |\n\n订单处于待处理状态的原因是 IPN 功能已激活。该模块将订单设置为待处理状态，直到从模块收到 IPN 消息为止。因此，上述五条消息的结果是在\
  \ CMS Made Simple 的管理控制台中生成一个已完成且已付款的订单。\n\n一旦您测试了该模块，您应该按照前面的说明配置您的真实 PayPal 账户，从真实账户收集所有必需的信息（如\
  \ PDT 身份令牌），并将 PayPal URL 更改为 https://www.paypal.com/cgi-bin/webscr。\n\n## 电子商务套件的可选模块\n\
  \n还有一些模块可以与这个电子商务套件一起使用，以丰富其功能：\n\n- **统一税率税**：允许您对 **Products** 模块中的任意产品或所有产品应用统一税率税。\n\
  - **仓库税**：根据仓库所在的美国州和客户所在的美国州计算产品的税费。\n- **FlatRateShipping**：提供一个界面来设置一些简单的重量运费规则，并根据其总重量计算运费成本。\n\
  - **基于目的地的配送**：允许根据目的地国家和物品数量计算固定运费。它在计算中不考虑重量。\n- **PriceBasedShipping**：允许根据税前的订单总价计算运费成本。\n\
  \n- 4. 如果您想在网站上测试 PayPal 功能，您可以使用所谓的沙箱环境。关于 PayPal 沙箱，以下哪项是正确的？\n  a. 它会向您的真实 PayPal\
  \ 账户收费。\n  b. 它可以用于创建用于测试目的的卖家账户。\n  c. 它只能使用美元作为货币。\n  d. 它不是免费的。\n\n- 5. 本章描述的电子商务解决方案要求客户在购买前创建账户：\n\
  \  a. 正确\n  b. 错误\n\n## 总结\n\n在本章中，您学习了如何使用 CMS Made Simple 设置基本的电子商务功能。即使 CMS Made\
  \ Simple 并不自称提供完全成熟的电子商务功能，它也通过自带的模块提供了最常被需要的功能。\n\n请确保不要将 CMS Made Simple 用于纯粹的电子商务网站。对于在线商店，最好使用专门的电子商务解决方案，而不是\
  \ CMS Made Simple。但是，如果您的网站具有博客、商店、论坛等多种功能，那么您可以使用第三方模块来实现这些功能。\n\n具体来说，我们涵盖了：\n\
  \n- **Products** 模块，允许您为在线商店创建和编辑产品。该模块是电子商务套件的基础。\n- **Cart** 模块，为 **Products**\
  \ 模块添加了简单的购物车功能。它将数据保存在浏览器会话中，并将 **Product** 模块与 **Orders** 模块连接起来。\n- **Orders**\
  \ 模块，为添加到购物车的商品启动结账流程。该模块将所有订单保存在管理区域，并允许网站管理员跟踪和更新订单状态。\n- **SelfRegistration**\
  \ 模块，允许网站访客在付款前向您的网站注册。我们还创建了一个小型工作流程，以了解该模块如何集成到结账流程中。\n- **PayPal Gateway** 模块，接受来自\
  \ PayPal 网站的即时支付，并让您随时了解支付状态。\n\n\n\n## 电子商务研讨会\n\n现在我们已经学会了如何实现一个包含电子商务功能的完整网站，我们可以继续学习高级主题，这些主题需要基础的PHP知识，这将是下一章的内容。届时，你的网站已经完全可用并可以发布，因此你不需要下一章的扩展主题就能拥有一个完整的网站。\n"
- "## CMS Made Simple 的高级使用\n\n> 本章为使用CMS Made Simple创建网站的高级站长提供一些提示。你无需阅读整章，只需挑选对你最重要的部分。\n\
  \n在本章中，我们将：\n\n- 学习如何使用CMS Made Simple开发多语言网站\n- 为网站编辑器创建额外的布局控制选项\n- 进行一些搜索引擎优化\n\
  - 使用用户定义标签和事件管理器来实现我们自己的功能或定义自定义工作流\n\n你需要具备基础的PHP知识才能按照本章的说明操作。那么让我们开始吧。\n\n###\
  \ 本地化与翻译\n\nCMS Made Simple 的管理控制台已被翻译成超过20种语言。正如你在第2章中已经了解到的，CMS Made Simple 分为两个版本发布。基础版本只包含英语语言文件，而完整版本包含所有语言文件。\n\
  \n如果你除了英语之外只需要一种语言（英语无法卸载），你可以下载基础包，然后下载所需的语言文件。语言文件可以在CMS Made Simple 官方网站（http://www.cmsmadesimple.org/）页面底部的\
  \ **Downloads | CMSMS Release** 部分找到（你只需要与你版本对应的文件）。要在基础安装中包含任何语言，请先下载并解压基础安装文件，然后下载与基础版本号对应的所需语言文件并同样解压。通过将语言文件夹复制到基础文件上来合并基础文件夹与语言文件文件夹的内容。然后像往常一样安装CMS\
  \ Made Simple。\n\n有权访问网站管理控制台的用户可以在其个人账户中选择首选语言（**My Preferences | User Preferences**）。对于基础安装，该字段中只显示\
  \ **English**。如果你安装了任何其他语言，它也会显示在 **Language** 下拉字段中。此设置不影响网站访问者所使用的网站语言。\n\n要设置网站语言，请在管理控制台中点击\
  \ **Site Admin | Global Settings**，并更改 **Default language for the frontend**。如果此处未设置语言，则CMS\
  \ Made Simple默认使用英语（**en_US**）。此设置将自动更改网站上某些模块的默认文本，例如 **Search** 模块中搜索按钮的标签，或 **News**\
  \ 模块中的某些标签。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_279_0.png)\n\n在上面的截图中，可以看到\
  \ **Category**（德语 *Kategorie*）、**Posted by**（德语 *Erstellt von*）等标签之间的区别。这将有助于定义大部分由模块显示的、已翻译成你所使用语言的标签。然而，仅当你的网站不是多语言且只使用一种语言时，这才有帮助。\n\
  \n### 配置日期\n\nCMS Made Simple 时常需要输出日期和时间。尤其是对于新闻文章，正确的日期格式非常重要。\n\n可以在管理控制台（**Site\
  \ Admin | Global Settings**）的 **Date Format String** 字段中更改通用日期格式。日期格式应根据PHP格式函数\
  \ `strftime` (http://www.php.net/manual/en/function.strftime.php) 输入。下表显示了一些示例：\n\
  \n| 日期格式字符串 | 输出 |\n|---|---|\n| `%Y-%m-%d` | 2009-05-20 |\n| `%a %d %b %Y` | Wed\
  \ 20 May 2009 |\n| `%a %d %b %H:%M:%S %Y` | Wed 20 May 15:53:40 2009 |\n\n第一列根据允许的参数构建（请参阅最后一个链接以了解说明）。第二列显示页面上的结果。在\
  \ **Date Format String** 字段中输入第一列的参数，即可获得第二列所示的结果。\n\n月份和星期名称取决于服务器的 `locale` 设置。在某些服务器上，你可以更改用于输出日期的语言。设置区域设置也会影响货币、小数分隔符以及其他依赖于语言的输出。在\
  \ CMS Made Simple 中，打开 `config.php` 文件，找到 `$config['locale']` 这一行。你在此处输入什么值取决于你的服务器。对于\
  \ Linux 服务器上的德语月份名称，请尝试更改该行，如下所示：\n\n```php\n$config['locale'] = 'de_DE.UTF8';\n\
  ```\n\n### 创建多语言网站\n\n多语言网站使用不止一种语言创建。每种语言都有自己翻译后的导航、内容，可能还有翻译后的新闻文章。我们这里谈的不是由Google或任何其他工具进行的网站自动翻译。自动翻译很糟糕。它们往往让人无法阅读，而且毫无意义。在本节中，你将学习如何创建一个真正的多语言网站，其中所有内容都由人工翻译人员翻译。\n\
  \n你可以使用 **Babel** 模块来管理网站和导航的多种语言。安装该模块的方式与为网站安装其他模块相同（**Extensions | Module Manager**）。\n\
  \n安装模块后，为网站设置页面结构以匹配你需要的语言，例如：\n\n- 1. 英语\n  - 1.1. 我们的公司\n  - 1.2. 公告\n  - 1.3.\
  \ 联系我们\n- 2. 德语\n  - 2.1. Unternehmen\n  - 2.2. Aktuelles\n  - 2.3. Kontakt\n\n\
  根语言页面（1. 和 2.）应定义为内容类型为“部分标题（Section Headers）”的页面。你可以为它们设置任何想要的标题。对于页面别名，我建议使用两个字母的ISO\
  \ 639-1代码系统，例如en（英语）、de（德语）、fr（法语）。页面别名将用于网站URL，如 http://www.yourdomain/en/our-company\
  \ 或 http://www.yourdomain/de/kontakt。\n\n为了正确显示菜单（即不显示语言标题页面和属于其他语言的页面），你必须在主模板（Layout\
  \ | Templates）的顶部菜单标签中添加参数 start_level=\"2\"。打开模板，调整你的顶部导航，如以下代码片段所示：\n\n```\n{menu\
  \ number_of_levels=\"1\" start_level=\"2\"}\n```\n\n这将确保在顶部导航中只显示属于所选语言的第二级页面。如果你使用侧边栏导航，也应通过减少起始级别数来更改这里的级别数：\n\
  \n```\n{menu start_level=\"3\"}\n```\n\n页面结构创建完成后，在管理控制台中点击 Extensions | Babel:\
  \ Multilingual Site。对于你在页面结构中集成的每种语言，点击“添加语言”链接，并输入相应的信息，如以下截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_281_0.png)\n\
  \n**与该语言关联的根页面** 应为你在每种语言中创建的部分标题之一。**用于重定向到该语言的默认页面** 应为每种语言的起始页（而不是前一个字段中的部分标题）。对于\
  \ **语言代码**，你可以使用任意五个字符的代码，但为了与模块提供良好的兼容性，你应该使用与CMS Made Simple相同的语言代码。使用管理区域右上角的下拉列表，用默认值预填表单。\n\
  \n点击 **提交**，并确保你已在 **Active** 列中激活了该语言。以相同方式添加所有需要的语言。\n\n要显示语言菜单，请在主模板中应显示不同语言链接的位置使用以下标签：\n\
  \n```\n{babel action=\"menu\"}\n```\n\n### 编辑语言条目\n\n在 **Babel** 模块的管理区域，你会找到一个用于编辑每种语言的语言条目的链接。语言条目是每种语言都存在但包含不同文本（或HTML代码）的字符串。对于\
  \ **Search** 模块中的 *搜索* 按钮标签，你肯定希望有不同的描述，例如：\n\n- 英语为 *Search*\n- 德语为 *Suche*\n-\
  \ 法语为 *Recherche*，等等。\n\n打开管理控制台中的 **Babel: Multilingual Site** 模块，点击 **编辑语言条目**\
  \ 链接。点击模块管理区域右上角的 **添加新语言条目** 链接。在这里你可以为每种语言定义你自己的翻译。条目名称是一个通用键，用于获取正确的翻译。在我们的示例中，我们想要翻译搜索按钮的标签，因此翻译的键可以是\
  \ `search button`。在下面的字段中，为每种已定义的语言输入翻译，然后点击 **提交**。\n\n在 **Search** 模块的模板（Extensions\
  \ | Search，Search Template 选项卡）中自定义搜索按钮的标签，并将标签 `{$submittext}` 替换为 `{babel show=\"\
  search button\"}`，如以下代码片段所示：\n\n```\n{$startform}\n<input type=\"text\" class=\"\
  search-input\"\n    id=\"{$search_actionid}searchinput\"\n    name=\"{$search_actionid}searchinput\"\
  \ size=\"18\" maxlength=\"50\"\n    value=\"{$searchtext}\" {$hogan}/>\n<input class=\"\
  search-button\" name=\"submit\" value=\"{babel show=\"search button\"}\" type=\"\
  submit\" />\n{if isset($hidden)}{$hidden}{/if}\n{$endform}\n```\n\n\n\n\n\n这将根据当前选择的语言显示搜索按钮上的正确标签翻译。你可以用同样的方式替换变量\
  \ `{$searchtext}`。在 **Babel** 模块中为搜索文本创建一个新的语言条目，对其进行翻译，然后在搜索模板中用对应的标签 `{babel show=\"\
  [KEY]\"}` 替换变量 `{$searchtext}`。\n\n## 层级解决方案\n\n**Babel** 模块使用页面层级来判断哪个页面在其他语言中是等价的。在我们的示例中，页面\
  \ *2.1. Aktuelles* 是英语页面 *1.1. Our company* 的德语等价物，因为它在德语分支的层级中处于相同位置。\n\n换句话说，如果其他语言中的页面排序不同，一切都会乱套。\n\
  \n- 1. English\n  - 1.1. Our company\n  - 1.2. Announcements\n  - 1.3. Contact Us\n\
  - 2. German\n  - 2.1. Aktuelles\n  - 2.2. Unternehmen\n  - 2.3. Kontakt\n\n在此示例中，*Aktuelles*\
  \ 页面在德语分支中处于第一位置，因此它是英语中第一个页面的等价物，即使在逻辑上并非如此。\n\n页面结构必须对每种语言都相同。这意味着所有页面必须在其他语言中都有等价物，否则在该特定页面上语言菜单中将不会显示指向其他语言的链接。如果你的结构不相同且某些页面未被翻译，则使用下面显示的方法。\n\
  \n## 将标志作为语言菜单添加\n\n你可以在网站上为每种语言添加小的国旗图像。免费图像可以从 `http://www.famfamfam.com/lab/icons/flags/`\
  \ 下载。将所需图像上传到文件夹 `/uploads/flags/`。在主页面模板（**Layout | Templates**）中，如以下代码片段所示，将指向每种语言起始页面的链接插入为小型国旗图标：\n\
  \n```\n{cms_selflink page=\"our-company\" image=\"uploads/flags/lang_en.gif\" alt=\"\
  English\" imageonly=1}\n{cms_selflink page=\"unternehmen\" image=\"uploads/flags/lang_de.gif\"\
  \ alt=\"Deutsch\" imageonly=1}\n{cms_selflink page=\"entreprises\" image=\"uploads/flags/lang_fr.gif\"\
  \ alt=\"Français\" imageonly=1}\n```\n\n你可以用最后的代码片段替换标签 `{babel action=\"menu\"\
  }`。在这种情况下，你不需要为每种语言保持相同的结构。然而，以上标志始终指向另一种语言的起始页，而不指向另一种语言中该页面的等价物，无论其是否存在。\n\n##\
  \ 按语言分隔新闻文章\n\n在我们的示例中，不仅标签需要翻译。在页面模板中，我们在每个页面上显示新闻文章。对德语网站访问者显示英语新闻文章，反之亦然是没有意义的。最好按语言自动分隔新闻。\n\
  \n最简单的方法是在 News 模块中创建新类别并根据语言更改它们。有了 Babel 模块，每个页面都会添加一个新的 Smarty 变量 `$page_lang`，因此你可以使用此变量创建\
  \ Smarty 条件，如下所示：\n\n```\n{if $page_lang == \"en_US\"}\n{news category=\"General\"\
  \ number=\"5\"}\n{elseif $page_lang == \"de_DE\"}\n{news category=\"Allgemein\"\
  \ number=\"5\"}\n{/if}\n```\n\n最后的代码片段假设创建了两个新闻类别，即 General 和 Allgemein。根据访问者选择的语言，模板中只显示其中一个类别的新闻文章。新闻编辑在管理控制台中添加新闻文章时只需选择正确的类别即可。\n\
  \n> 使用 Babel 模块的语言条目，根据当前显示的语言，在新闻模板中替换诸如 Category 和 Posted by 之类的语言字符串。\n\n在左侧，你会看到需要翻译的英语单词和短语。翻译在窗口右侧进行。如果未进行翻译，则两列相同且都包含英语。你可以用自己的语言翻译替换右侧列中的英语文本并提交。就这样！用户参与翻译越多，翻译就越好。\n\
  \n> 如果你想参与并且你的语言在 Forge 中不存在，请创建一个项目并通知 CMS Made Simple Forge 管理员，然后该语言将被添加到翻译中心。\n\
  \n在此处进行的翻译将在 CMS Made Simple 的下一个版本或核心或第三方模块的下一个版本中对所有用户可用。如果你现在就需要翻译或只是想根据自己的需要自定义现有语言，则必须在服务器上手动添加或更改语言文件。\n\
  \n## 在你的安装中翻译模块\n\n模块的语言文件始终保存在同一文件夹 `/modules/MODULE_NAME/lang/ext` 中。只有默认的英语翻译直接放在\
  \ `modules/MODULE_NAME/lang` 中的文件 `en_US.php` 中。打开文件即可查看其组织方式。\n\n所有语言文件对每种语言都以相同的方式构建。它们由单个\
  \ PHP 数组 `$lang` 组成。\n\n```\n$lang['key'] = 'Custom language translation';\n```\n\
  \n在 `/modules/MODULE_NAME/lang/ext` 中查找所需语言的文件并打开进行编辑。如果文件不存在，则意味着该模块尚未被翻译。在这种情况下，你只需将文件\
  \ `en_US.php` 复制到文件夹 `/modules/MODULE_NAME/lang/ext` 并将其重命名为你需要的语言。对于德语，你将文件命名为\
  \ `de_DE.php`，对于法语 `fr_FR.php`，依此类推。\n\n文件可以用简单的文本编辑器如 Notepad 或 WordPad 编辑。然而，这种翻译方式需要一些基本的\
  \ PHP 知识。请注意，这些文件中所做的自定义更改可能会在模块或 CMS Made Simple 的下一个版本中被覆盖，因此请确保在安装之外的地方创建包含更改的备份文件。\n\
  \n让我们看看如何将你自己的模块 **BWProducts**（在第 8 章 *Creating Your Own Functionality* 中使用 **CTLMakerModule**\
  \ 创建）翻译成其他语言。\n\n### Time for action – custom translation of the module\n\n你创建了一个新模块，需要为其提供德语翻译。\n\
  \n- 1. 使用你选择的 FTP 浏览器，例如 FileZilla，连接到你的网络托管。\n- 2. 在 `modules` 文件夹中查找包含你的模块的文件夹；在我们的示例中，它是\
  \ `bwproducts`。\n- 3. 将文件 `en_US.php` 从文件夹 `modules/bwproducts/lang` 下载到你的本地磁盘。\n\
  - 4. 将文件重命名为 `de_DE.php`，并用任何文本编辑器进行翻译。\n- 5. 将翻译后的文件 `de_DE.php` 上传到文件夹 `modules/bwproducts/lang/ext`。\n\
  \n### What just happened?\n\n模块的语言取自网站的全局设置（**Site Admin | Global Settings**，字段\
  \ **Default language for the frontend**）。如果找不到模块的语言文件，则 CMS Made Simple 将自动使用文件\
  \ `en_US.php`。\n\n你为你的语言创建了一个新文件，根据 ISO 语言命名约定重命名它，将其翻译成你的语言，并上传到正确的文件夹。就这样。你不需要翻译文件中的所有内容。设置某些键的自定义翻译并查看翻译如何在模块中被采用。\n\
  \n同样，你也可以根据需要调整现有的语言文件。\n\n## 编辑器的附加内容和控件\n\n通常网站由不精通 HTML 的人员编辑。然而，你希望尽可能地给予他们控制权，即使他们没有任何特殊知识。CMS\
  \ Made Simple 中有一些概念可以帮助你和你的编辑。\n\n如果你布局需要在一页上对内容进行物理分离，你可以向网站添加多个内容块。你也可以使用页面属性为编辑提供更多对网站布局和样式的控制。\n\
  \n\n\n\n\n## 额外页面属性\n\n另一种让编辑者在无需特殊知识的情况下对页面布局进行更多控制的方法是使用额外页面属性。当你打开任何页面进行编辑时，你会在“选项”选项卡上看到三个字段，如下所示：\n\
  \n1. 额外页面属性1\n2. 额外页面属性2\n3. 额外页面属性3\n\n这些字段可以保存任意信息，并可在模板中进行求值和引用。例如，如果你想在某些页面上隐藏新闻摘要，可以使用这些字段之一，填入定义好的值，然后在模板中检查字段值。\n\
  \n### 动手实践 – 使用额外页面属性\n\n让我们看看如何隐藏“联系我们”页面上的新闻摘要。\n\n1. 打开“联系我们”页面（内容 | 页面）进行编辑。\n\
  2. 切换到“选项”选项卡，并在“额外页面属性1”字段中输入 nonews。\n3. 保存页面。\n4. 然后在管理控制台中，打开你的主模板（布局 | 模板）。\n\
  5. 找到 Smarty 标签 {news}，并添加一个 IF 函数，如下所示：\n\n   ```\n   {if $node->extra1 != \"nonews\"\
  }\n     {news ...}\n   {/if}\n   ```\n\n6. 检查“联系我们”页面以查看更改。\n\n```\n{if $node->extra1\
  \ != \"nonews\"}\n  {news ...}\n{/if}\n```\n\n### 刚才发生了什么？\n\n额外页面属性是一种简单的方式，可以让网站编辑者对网站布局进行额外控制。他只需要知道必须向“额外页面属性1”字段中输入什么。在模板中，你评估该字段是否保存了任何值，并控制此特定页面上应显示或不显示哪些内容。\n\
  \n在额外页面属性中输入的值可以通过 $node->extra1、$node->extra2 和 $node->extra3 在模板中获取。\n\n这些字段还可以用于在网站上显示任何附加信息，如文章作者或任何你希望在模板中与主要内容分开处理的信息。在这种情况下，你可以使用以下\
  \ Smarty 标签：\n\n```\n{page_attr key=\"extra1\"}\n```\n\n## 搜索引擎优化（SEO）\n\n如今，仅仅拥有一个网站是不够的。即使是最精美、最实用的页面，如果无法在搜索引擎中找到，也是毫无意义的。而且，仅仅出现在搜索引擎中并不能达到获取新客户的目的。当人们输入代表你业务的最重要的关键词或短语时，你需要关注你的页面在搜索结果中的排名（位置）。\n\
  \n在本节中，你将找到一些重要信息，这些信息将帮助你提高搜索排名并最大限度地利用你的网站。\n\n在开始优化你用 CMS Made Simple 构建的网站之前，你应该知道搜索引擎对你网站上的任何文本都如饥似渴。它们对\
  \ CSS、JavaScript 或任何其他漂亮的技术不感兴趣。最重要的一点是写好独特的原创内容。如果你复制其他页面的内容，你不可能成功。拥有独特的内容是搜索引擎优化的关键。独特的内容对于你网站的访问者也非常重要。内容越有趣，访问者转变为客户的可能性就越高，而且访问者还可能将你的网站推荐给其他人。\n\
  \n### 你网站的标题\n\n在搜索引擎眼中，你网站最重要的部分是页面的标题。就是位于 HTML 的 title 标签之间的文本。在第4章“设计与布局”中，你创建了一个新模板并添加了标题，如下面的代码片段所示：\n\
  \n```\n<head>\n<title>{title}- {sitename}</title>\n```\n\nSmarty 标签 {title} 正是你在创建或编辑页面时在“标题”字段中输入的内容。标题必须足够简短（不超过\
  \ 70 个字符），并且应包含与该特定页面（而非整个网站）匹配的搜索关键词和短语。你网站中创建的每个页面的标题都应该是唯一的。\n\n最后这一要求对内容页面来说很容易做到，但对于新闻文章或产品等生成的页面呢？如果你检查新闻详细视图的\
  \ URL，你会看到标题与新闻文章不匹配，而是保持了显示该文章的页面的标题。\n\n你可以用一个简单的技巧自定义生成页面的标题。在管理控制台中，点击**内容 |\
  \ 新闻**，然后选择**详细模板**选项卡。打开模板进行编辑，并在模板的最顶部添加以下代码行：\n\n```\n{assign var=\"pagetitle\"\
  \ value=$entry->title|escape:'html':'utf-8'}\n```\n\n这一行将生成包含新闻文章标题的 Smarty 变量 $pagetitle。要将自定义标题添加到主模板中，请打开它（**布局\
  \ | 模板**），并将整个 HTML 标题标签替换为以下代码片段：\n\n```\n{if isset($pagetitle) && !empty($pagetitle)}\n\
  <title>{$sitename} - {$pagetitle}</title>\n{else}\n<title>{$sitename} - {$title}</title>\n\
  {/if}\n```\n\n这段代码检查 Smarty 变量 $pagetitle 是否已定义且非空。如果是，则在 HTML title 标签中使用新闻标题；如果不是，则使用正常的页面标题。你应该确保主模板的第一行包含以下代码：\n\
  \n```\n{process_pagedata}\n```\n\n没有这一行，这个技巧将无法生效。通过这种方式，每个生成页面的标题都可以更改。从现在开始，你应该自定义每个模块的详细模板，并在模块详细模板的最顶部添加以下代码行：\n\
  \n```\n{assign var=\"pagetitle\" value=PAGE_TITLE}\n```\n\n将 PAGE_TITLE 替换为包含所需页面标题的\
  \ Smarty 变量。在**新闻**模块中，这是 $entry->title。在使用 **CTLModuleMaker** 创建的模块中，这一行将如下所示：\n\
  \n```\n{assign var=\"pagetitle\" value=$item->name}\n```\n\n你网站每个页面上的不同标题对于搜索引擎优化非常重要。它们对你网站的访问者也很重要，因为页面标题会显示在浏览器选项卡上，并且在访问者将页面添加到收藏夹或书签时作为网站的描述。\n\
  \n### 元标签\n\n元标签曾经是搜索引擎优化中非常重要的一部分。如今，唯一重要的标签是用于描述的元标签：\n\n```\n<meta name=\"description\"\
  \ content=\"Find the best tips on this website\" />\n```\n\n**描述元标签**必须包含实际页面（而非整个网站）可读的描述。它可以包含任何词语或句子，在搜索引擎结果中会显示在页面标题下方。\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_292_0.png)\n\n描述必须对访问者具有吸引力，鼓励他们访问你的网站，而不是搜索结果中排在你上面或下面的网站。\n\
  \n你可以通过两个地方向你的网站添加元标签。在管理控制台（**站点管理 | 全局设置**，字段**全局元数据**）中，你可以添加将出现在每个页面上的元标签。要小心！不要在这里添加描述元标签。如果你想达到最佳的搜索引擎排名，这个标签必须是每个页面唯一的。\n\
  \n要向某个页面添加特定的描述，请在管理控制台（内容 | 页面）中打开该页面进行编辑，并切换到“选项”选项卡。将描述元标签添加到“页面特定元数据”字段中，方式与在纯\
  \ HTML 中相同。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_293_0.png)\n\n不要将相同的元标签复制到每个页面，这对搜索引擎优化毫无意义。每个页面的描述元标签都应该不同。\n\
  \n刚才描述的方法适用于具备一些基本 HTML 知识的编辑者。然而，如果你网站的编辑者没有任何 HTML 知识，你最好给他一个特殊字段，用于添加页面描述，然后自动粘贴到模板中的正确位置。\n\
  \n打开你的主模板（布局 | 模板）。将以下代码行添加到模板的 head 部分，紧挨在 Smarty 标签 {metadata} 下方：\n\n```\n<meta\
  \ name=\"description\" content=\"{description}\" />\n```\n\n然后，打开任何页面进行编辑，切换到“选项”选项卡，在“描述（标题属性）”字段中填入网站的描述，元标签将被正确生成。\n\
  \n如果你有很多页面，并且希望自动生成描述，你还可以使用名为 autometa (<http://dev.cmsmadesimple.org/projects/autometa>)\
  \ 的特殊第三方标签。如果页面元数据字段中未找到关键词和描述，此标签会即时为它们创建元标签。关键词来自应安装的“搜索”模块。元标签描述包含页面内容的前几个字符。\n\
  \n### 元标签关键词\n\n关于元标签关键词是否仍然重要，存在一些讨论。我不再向我的网站添加任何关键词，因为我看不出有或没有关键词对网站排名有什么差别。然而，它们不会造成任何伤害，如果你想使用元关键词，那么请在主模板（布局\
  \ | 模板）的 head 部分，Smarty 标签 {metadata} 下方添加以下代码行：\n\n```\n<meta name=\"keywords\"\
  \ content=\"{content block='Keywords' oneline='true' wysiwyg='false'}\" />\n```\n\
  \n\n\n\n\n这段代码使用了上一节中描述的其他内容块，并在管理后台的页面编辑窗口中新增了一个名为 **Keywords** 的字段。网站编辑人员可以填写该字段，内容将被自动放置在模板中的正确位置。\n\
  \n## 在模板中使用 SEO 标记\n\n这其实并不是 CMS Made Simple 的专属技巧。不过，这个建议对搜索引擎优化非常重要。在模板中使用 HTML\
  \ 标签 `<h1>`，并注意标题中使用的词语。最好的做法是将每个页面的标题放在主模板的 `<h1>` 标签中，如下面的代码片段所示：\n\n```\n<h1>{title}</h1>\n\
  {content}\n```\n\n不要使用其他 HTML 标签作为标题，否则搜索引擎不会对这样的标题格式给予足够的重视：\n\n```\n<div class=\"\
  title\">{title}</div>\n{content}\n```\n\n在 `<h1>` 标签中使用与你的业务、产品或服务相关且重要的词语和搜索短语，尤其是在首页上。如果你在首页使用类似\
  \ *欢迎！* 的标题，那等于告诉搜索引擎，“欢迎”这个词对你的业务极其重要。你看，这毫无意义，因为你并不希望用户在搜索 *欢迎* 时找到你，而是希望用户能搜索到你所提供的产品或服务。\n\
  \n在模块模板中也应使用标题，例如新闻文章详情视图的标题。最好的做法是将新闻标题也放在 `<h1>` 或 `<h2>` 标签中：\n\n```\n<h1>{entry->title}</h1>\n\
  ```\n\n建议每个页面至少有一个 `<h1>` 标签和一些 `<h2>`-`<h6>` 标签。在所见即所得编辑器中，你可以使用格式下拉菜单自动选择 1 到\
  \ 6 级标题，如下图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_295_0.png)\n\n## 在页面中使用\
  \ SEO 标记\n\n在编写网站内容时，使用 HTML strong 标签来强调与你的业务、产品或服务相关的词语或短语。文字内容越多，对搜索引擎越有利。然而，搜索引擎并不具备逻辑判断能力，也不是人类。如果页面上有\
  \ 800 个单词，它无法区分哪些是重要的，哪些是不重要的。为了帮助它识别，请将重要的词语放在 strong 标签中。但不要滥用。每段一个就足够了；不要过度使用，否则会损害而不是帮助你的搜索引擎排名。在所见即所得编辑器中，可以使用\
  \ B 按钮将内容格式化为 strong 标签：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_295_1.png)\n\
  \n在文本中使用指向其他页面的内部链接。也就是说，在合理的情况下链接你自己的页面。你应该链接搜索关键词和短语，而不是像 *点击这里* 这样的表述。\n\n在向网站添加图片时，千万不要忘记填写\
  \ HTML 属性 `alt` 和 `title`。搜索引擎会使用这些属性在专门的图片搜索中查找和匹配图片。在所见即所得编辑器中，这两个字段会显示在 **Image\
  \ URL** 标签的正下方：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_296_0.png)\n\n## 在页面别名和图片文件名中使用关键词\n\
  \n在用于生成网站唯一 URL 的页面别名中使用关键词，是提升网站搜索排名的一种简单方法。页面别名默认由页面标题生成，但你可以在之后修改它。在管理后台中，打开任意页面进行编辑，切换到\
  \ **Options** 选项卡。找到 **Page Alias** 字段，将其修改为符合你期望的搜索关键词或短语。\n\n> 不要频繁更改别名，尤其是当页面已被其他网站链接时。如果更改别名，页面将无法被找到。如果你确实需要更改一个被良好链接的页面的别名，同时又不希望丢失引用，可以这样操作：先修改别名，然后创建一个内容类型为“内部页面链接（Internal\
  \ Page Link）”的新页面，将旧别名赋予该新页面，并将目标指向使用新别名的页面。不要将此页面显示在菜单中。这样，旧链接仍然有效，并且会将用户重定向到新的页面别名。\n\
  \n图片文件的名称也最好使用搜索关键词。\n\n## 搜索引擎友好 URL\n\n搜索引擎友好 URL 是指不包含任何动态组件的网址，因而对人类和搜索引擎都更易于阅读。比较以下两个\
  \ URL：\n\n```\nhttp://yourdomain.com/index.php?page=products\n```\n\n```\nhttp://yourdomain.com/products\n\
  ```\n\n哪个更好？搜索引擎会觉得第二个版本更具吸引力，并且能更好地索引你的网站。地址中带有查询字符串的某些页面（如第一个示例）可能永远不会被索引，而另一些则需要更长时间才能被索引。使用\
  \ CMS Made Simple 搭建网站后，你会发现页面 URL 是以第一种方式构建的。为了在网站上取得更好的效果，我们应该对它们进行重写。\n\n搜索引擎友好\
  \ URL 对人类来说也更容易阅读。如果你不在乎搜索引擎，那么请考虑网站访问者。如果我们不使用第二种重写后的版本，他们输入或写下特定页面地址会有多困难？想象一下，你的访问者想要推荐这个页面。他/她使用搜索引擎友好\
  \ URL 时可以毫无困难地做到这一点，而使用第一个示例则可能会失败。\n\n### 动手实践 – 开启搜索引擎友好 URL\n\n让我们看看如何在 CMS Made\
  \ Simple 中启用搜索引擎友好 URL。\n\n- 1. 打开你选择的 FTP 浏览器（例如 FileZilla），在安装目录中找到 `doc` 文件夹。\n\
  - 2. 将 `doc` 文件夹中的 `htaccess.txt` 文件复制到你的 CMSMS 网站的根目录下（与 `config.php` 文件位于同一层级）。\n\
  - 3. 将文件 `htaccess.txt` 重命名为 `.htaccess`（注意文件名前面的点）。\n- 4. 下一步，打开 `config.php` 文件进行编辑，找到\
  \ *URL Settings* 部分。\n- 5. 修改 URL 重写的相关行，如下所示：\n  `$config['url_rewriting'] = 'mod_rewrite';`\n\
  - 6. 打开你的网站，查看导航中的链接显示效果。现在它们应该已经是搜索引擎友好的了。\n\n### 刚才发生了什么？\n\n要在你的网站上启用搜索引擎友好 URL，你需要完成两个步骤。第一步，你将文件\
  \ `htaccess.txt` 移动到了网站的根目录。然后你将移动后的文件重命名为 `.htaccess`（开头的句点属于文件名）。`.htaccess` 是一个配置文件的名称，它允许你控制\
  \ Web 服务器。该文件放置在根目录中，并会覆盖服务器的一些默认设置。\n\n默认的 `htaccess.txt` 适用于大多数服务器。不过，有时你可能会遇到问题。例如，并非所有虚拟主机提供商都接受以下设置：\n\
  \n```\nOptions +FollowSymLinks\n```\n\n在这种情况下，开启搜索引擎友好 URL 后你会收到错误 500（内部服务器错误）。要解决此问题，请按如下所示注释掉该选项：\n\
  \n```\n# Options +FollowSymLinks\n```\n\n如果你的网站位于子文件夹中，例如 `http://www.yourdomain.com/folder`，那么你必须调整\
  \ `.htaccess` 文件。找到 `RewriteBase /` 这一行，将其改为你的网站所在文件夹的名称。在我们的示例中，应该是：\n\n```\nRewriteBase\
  \ /folder\n```\n\n第二步，你修改了 `config.php` 文件。通过这些更改，你告诉 CMS Made Simple，`.htaccess`\
  \ 位于根目录中，并且你将使用这些新设置来重写 URL。\n\n使用 CMS Made Simple，你甚至可以模拟静态地址，例如 `http://www.yourdomain.com/products.html`。在这种情况下，页面的地址看起来会像是静态\
  \ HTML 文件。打开 `config.php`，找到 `$config['page_extension'] = '';` 这一行。如果你将其改为 `$config['page_extension']\
  \ = 'html';`，那么你网站的所有 URL 看起来都会像是静态 HTML 页面。\n\n如果你仍然收到内部服务器错误（错误 500），请检查以下已知问题：\n\
  \n- 你的主机服务商不支持 `mod_rewrite`。请向你的服务商咨询你的虚拟主机上是否可以使用 `mod_rewrite` 模块。\n- 你将 CMS\
  \ 安装到了一个子目录中，例如 `http://yourdomain.com/mycms`。这种情况下，你必须编辑 `.htaccess` 文件，将 `RewriteBase\
  \ /` 这一行替换为 `RewriteBase /mycms`（将斜杠后面的名称改为你的子目录）。\n\n## 避免重复内容\n\n重复内容是指与其他页面内容完全匹配的页面。通常情况下，你不会有意创建此类页面。不过，有一些无恶意的重复内容示例：\n\
  \n- 页面的纯打印版本\n- 通过多个 URL 链接的页面\n- 网站的移动版本，等等。\n\n使用动态生成页面的 CMS 网站极易因重复内容而受到搜索引擎的惩罚。\n\
  \n> > Google 表示：因此，网站的排名可能会受到影响，或者网站可能会被完全从 Google 索引中移除，在这种情况下，它将不再出现在搜索结果中。\n\n\
  你可以采取一些措施来避免重复内容问题，具体将在以下各节中介绍。\n\n### 统一使用带 www 或不带 www 的域名\n\n通常，你的网站可以通过 `http://yourdomain.com`\
  \ 或 `http://www.yourdomain.com` 访问。即使两个地址显示相同的内容，从技术上讲，这两个地址也可以提供不同的内容。搜索引擎知道这一点，如果两个版本都可以访问并且提供相同的内容，它们可能会将你的网站从索引中跳过。\n\
  \n首先，决定你优先选择的域名版本。然后检查在网站安装期间设置的是什么地址。在你的 FTP 浏览器中打开 `config.php` 文件，并搜索以下行：\n\n\
  ```php\n$config['root_url'] = 'http://yourdomain.com';\n```\n\n\n\n\n如果与您偏好的域名版本不匹配，请调整该行，并将文件保存到您的网站托管空间中。下一步，打开\
  \ `.htaccess` 文件，如果您的首选域名包含 `www`，则添加标记的行，如下面的代码片段所示：\n\n```\nRewriteEngine on\n\
  RewriteBase /\n\n# Redirect to canonical domain name with www\nRewriteCond %{HTTP_HOST}\
  \ ^yourdomain\\.com$ [NC]\nRewriteRule ^(.*) http://www.yourdomain.com/$1 [L,R=301]\n\
  ```\n\n另一种情况下（您的首选域名不带 `www`），请添加如下代码片段所示的行：\n\n```\nRewriteEngine on\nRewriteBase\
  \ /\n\n# Redirect to canonical domain name without www\nRewriteCond %{HTTP_HOST}\
  \ ^www\\.yourdomain\\.com$ [NC]\nRewriteRule ^(.*) http://yourdomain.com/$1 [L,R=301]\n\
  ```\n\n现在，您网站导航中的所有链接都应指向正确的版本。如果您在网站地址栏中输入了错误的版本，它将立即重定向到正确的版本。\n\n## 避免发布页面的打印版本\n\
  \n如果您在网站上使用**打印**模块来提供内容的打印友好版本，那么您应该阻止搜索引擎对其进行索引。\n\n在管理控制台中，点击**扩展 | 打印**，然后点击**打印模板**选项卡。将以下\
  \ meta 标签添加到模板的 head 部分：\n\n```\n<meta name=\"robots\" content=\"noindex,nofollow\"\
  \ />\n```\n\n此 meta 标签可以控制搜索引擎抓取和索引的行为，适用于所有搜索引擎。**noindex** 阻止页面被索引，**nofollow**\
  \ 阻止搜索引擎跟踪此页面上的链接。\n\n## 使用标签指定规范 URL\n\n如果您使用搜索引擎友好的 URL，那么您网站的页面可以通过不同的 URL 访问。假设您有一个名为\
  \ FAQ 的页面，位于“客户中心”页面下。此页面可以通过三个不同的 URL 访问：\n\n- http://www.yourdomain.com/client-center/faq\n\
  - http://www.yourdomain.com/index.php?page=faq\n- http://www.yourdomain.com/faq\n\
  \n所有这些 URL 实际上调用的是同一个页面。我们如何告知搜索引擎应该只考虑一个“主要”URL？有一个 link 标签，可以放置在 HTML 的 head 部分：\n\
  \n```\n<link rel=\"canonical\" href=\"http://www.yourdomain.com/client-center/faq\"\
  >\n```\n\n此标签告诉搜索引擎页面的主要（或规范）URL 是什么。页面的所有其他版本都将被视为非规范版本，因此不会被搜索引擎考虑。在 CMS Made\
  \ Simple 中，您可以在主页模板（布局 | 模板）中生成规范 URL，如下面的代码片段所示：\n\n```\n{if isset($canonical)}\n\
  <link rel=\"canonical\" href=\"{$canonical}\" />\n{elseif isset($content_obj)}\n\
  <link rel=\"canonical\" href=\"{$content_obj->GetURL()}\" />\n{/if}\n```\n\n将代码放在\
  \ HTML 模板的 head 部分并保存。从现在开始，CMS Made Simple 将自动生成每个页面的规范 URL。\n\n## 为搜索引擎创建 XML\
  \ 站点地图\n\n站点地图是一种让搜索引擎了解您网站上那些可能无法被发现页面的方式。简单来说，XML 站点地图（通常称为 sitemap）是您网站页面的列表。创建并提交站点地图可以确保搜索引擎了解您网站上的所有页面，包括那些可能无法通过正常抓取过程发现的\
  \ URL。\n\n可以使用 SiteMapMadeSimple 模块创建 XML 站点地图。安装后，该模块会在您网站的根目录中创建一个名为 sitemap.xml\
  \ 的文件，并告知搜索引擎网站上可以找到哪些页面以及页面最后更改的时间。每次您对页面或页面结构进行更改时，XML 站点地图都会自动更新。\n\n您可以将站点地图提交到主要的搜索引擎，如\
  \ Google、Yahoo!、Bing 或 Ask。对于次要的搜索引擎，您可以扩展位于网站根目录中的 robots.txt 文件。在文件的最底部添加以下行：\n\
  \n```\nSitemap: http://www.yourdomain.com/sitemap.xml\n```\n\n在示例中调整您的域名。\n\n##\
  \ 访问者统计\n\n现在，当网站发布后，您可能想知道每天、每周和每月有多少访问者。这样，您可以控制自己在搜索引擎优化方面的投入，并获得关于您网站访问者寻找什么内容或哪些内容对他们最感兴趣的其他信息。该模块提供有关访问者如何找到您的网站以及他们来自何处的信息。您还可以看到访问者使用的浏览器和屏幕分辨率。\n\
  \n有很多网站分析工具可供您在网站上使用。甚至还有一个特殊的第三方模块，您可以安装它来直接在管理控制台中查看网站的统计信息。该模块称为 Statistics。此模块不仅使访问者统计信息在管理控制台中可用，还会在网站上显示一个可见的计数器。\n\
  \n您也可以使用外部网站分析工具，如 Google Analytics，甚至两者同时使用（Statistics 模块和 Google Analytics），如果您想比较结果的话。Google\
  \ Analytics 会为您提供特殊的 JavaScript 代码，您必须将其添加到网站的主模板（布局 | 模板）中。了解这一点很重要：只有包含此代码的页面才会被统计。通过将其放置在主模板中，该代码会随每个页面自动调用，从而覆盖整个网站。\n\
  \n始终将 JavaScript 代码包含在 Smarty 标签 `{literal}` 中，以避免代码被解释为 Smarty 代码。例如：\n\n```\n\
  {literal}\n    alien JS code\n{/literal}\n```\n\n## 用户自定义标签\n\n用户自定义标签是一种将 PHP 代码插入到您网站中的简单方法。在\
  \ CMS Made Simple 的默认安装中，已经创建了两个示例标签，如下所示：\n\n- {custom_copyright}\n- {user_agent}\n\
  \n您可以在管理控制台中找到它们。点击**扩展 | 用户自定义标签**，然后点击显示在那里的其中一个标签，以查看已实现的简单 PHP 代码。\n\n要在页面中使用用户自定义标签，只需将用花括号括起来的标签名称放入页面内容或模板中。例如，您可以将\
  \ `{custom_copyright}` 标签添加到模板的页脚部分，如下面的代码片段所示：\n\n```\n{custom_copyright} businessWorld\n\
  ```\n\n该标签将自动显示 2004 年、一个破折号，然后显示实际年份，这样您以后就不需要更改模板来调整年份。\n\n要创建新的用户自定义标签，您需要一些基本的\
  \ PHP 知识。在任何 PHP 编辑器中编写代码，创建一个新的用户自定义标签，然后将您的 PHP 代码粘贴到其中（省略 `<?php` 和 `?>`）。然后在您的页面或模板中使用\
  \ Smarty 标签调用用户自定义标签。\n\n## 如何创建用户自定义标签\n\n与 CMS Made Simple 中的大多数操作一样，如果您有一些 PHP\
  \ 知识，添加新的用户自定义标签很简单。让我们创建一个简单的 PHP 倒计时脚本。\n\n### 动手实践 – 创建您自己的用户自定义标签\n\n假设您想在起始页上倒计时距离新年的天数。天数应自动计算，并显示在内容中添加了用户自定义标签的位置。\n\
  \n1. 在管理控制台中，点击**扩展 | 用户自定义标签**。\n2. 在页面底部，点击**添加用户自定义标签**。\n3. 输入 **countdown**\
  \ 作为新用户自定义标签的名称，并将以下代码片段输入到 Code 字段中：\n\n   ```\n   $target = mktime(0, 0, 0, 1,\
  \ 1, 2011);\n   $diff = $target - time();\n   $days = floor($diff/86400);\n   echo\
  \ $days;\n   ```\n\n4. 点击**提交**。\n5. 打开您网站的任何页面，并添加用户自定义标签，如下所示：\n\n   `It is {countdown}\
  \ days until 1. January 2011`\n\n6. 点击**应用**，然后在页面上查看结果。\n\n\n\n\n## 发生了什么？\n\n\
  你已经在 CMS Made Simple 中创建了自己的用户自定义标签（UDT）。该标签会自动显示 PHP 脚本第一行中给出的日期（2011 年 1 月 1 日）之前的天数。\n\
  \n然后，你在页面上的句子中使用了该标签。不是显示标签 {countdown}，而是在你添加标签的位置显示天数。\n\n标签的名称是技术信息，只能包含字母、数字和下划线，就像\
  \ PHP 变量的名称一样。名称是你必须在花括号中输入以将其添加到页面中的内容。因此请描述性地命名，但不要太长。\n\n将代码粘贴到 UDT 中时不需要任何 <?\
  \ 或 <?php 标签，只需跳过它们即可。如果你在 PHP 代码中犯了语法错误，则无法保存代码。但是，会显示以下错误，以便你知道需要更正 PHP 代码。\n\n\
  > Invalid code entered.\n> Parse error: syntax error, unexpected ']' in /var/www/\
  \ html/businessworld /admin/edituserplugin.php(103) : eval()'d code on line 5\n\n\
  ## 标签的参数\n\n当你开始为其添加参数时，用户自定义标签变得非常有用。你可以通过以下方式将参数传递给 PHP 代码：\n\n```\n{countdown\
  \ date='05-01-2011'}\n```\n\n这样，你可以直接在 UDT 中指定倒计时日期，而无需在代码中编写它，因此无需一遍又一遍地自定义 PHP\
  \ 代码。\n\n在 PHP 代码中，你可以借助特殊数组 $params 获取参数，该数组始终已定义并包含所有传递的参数。在下一个示例中，传递的参数 date\
  \ 在倒计时脚本中使用：\n\n```\n$date = explode('-', $params['date']);\n$target = mktime(0,\
  \ 0, 0, $date[0], $date[1] , $date[2]);\n$diff = $target - time();\n$days = floor($diff/86400);\n\
  echo $days;\n```\n\n以与之前相同的方式测试此标签，但不要使用 {countdown}，而是使用 {countdown date='05-01-2011'}\
  \ 或格式为 MM-DD-YYYY 的任何其他日期。\n\n这些是编写用户自定义标签的基本原则。你可以用一点想象力做一些有用的事情，所以只要想想如果你懂一点 PHP\
  \ 可以做什么。\n\n## 如何在 UDT 中获取页面信息\n\n你可以将任何变量传递给 UDT，包括由 CMS Made Simple 创建的对象。你可以使用以下代码显示页面中存在的变量和对象：\n\
  \n```\n{get_template_vars}\n```\n\n如果你将上述标签添加到模板中，那么你会发现页面有一个名为 $content_obj 的对象。此对象包含有关实际页面的所有信息，也可以传递给\
  \ UDT。\n\n假设我们需要一些额外的导航，看起来像访问者在网站上的追踪路径。这意味着我们希望显示访问者最后看到的三个页面。此导航必须自动构建并保存在访问者会话中。\n\
  \n创建一个新的用户自定义标签并将其命名为 trace。添加以下代码片段中显示的 PHP 代码：\n\n```\n$pagetitle = $params['page']->Name();\n\
  $pageurl = $params['page']->GetURL();\n\n$_SESSION['trace'][$pagetitle] = $pageurl;\n\
  \nif (sizeof($_SESSION['trace']) > 3) {\n    array_shift($_SESSION['trace']);\n\
  }\n\n$trace = array_reverse($_SESSION['trace']);\n\nforeach ($trace as $title =>\
  \ $url) {\n    echo '<a href=\"'. $url .'\">'. $title .'</a><br />';\n}\n```\n\n\
  此代码假定参数 page 已传递给它（$params['page']），并且此参数包含页面对象。我们可以按以下代码片段所示调用用户自定义标签：\n\n```\n\
  <h4>Last 3 pages you have visited</h4>\n{trace page=$content_obj}\n```\n\n我建议你将标签添加到页面模板中，位于站点导航下方。每次用户打开新页面时，其信息都会传递给\
  \ UDT。page 参数包含页面对象，可以使用页面内容方法（Name() 和 GetURL()）。请参阅 CMS Made Simple API 了解更多信息。\n\
  \n访问者最后看到的三个页面保存在会话变量中，现在临时显示在侧边栏菜单下方。\n\n## 理解事件\n\n在上一节中，你学习了如何创建用户自定义标签。要执行标签中的\
  \ PHP 代码，你必须将其放在页面或模板中。使用事件管理器，你可以在某些事件发生时执行代码。事件可以是创建新页面，甚至在管理控制台中删除用户。CMS Made\
  \ Simple 中已定义了 50 多个事件，每个模块都可以有额外的事件。\n\n执行用户自定义标签以响应事件的示例如下：\n\n- 如果任何页面更新，则向网站管理员发送电子邮件\n\
  - 在网站上显示页面之前替换页面某些部分\n- 如果模板被删除，则删除关联的样式表\n\n当指定的操作发生时，CMS Made Simple 会触发诸如 ContentEditPost\
  \ 或 DeleteTemplatePre 之类的事件。你创建一个或多个具有自定义功能的用户自定义标签并将其分配给事件。这意味着当事件被触发时，将执行分配的功能。事件将实际数据发送到用户自定义标签（如果有），并且此数据现在可以在你的\
  \ PHP 代码中以任何方式使用。\n\n在管理控制台中查看已添加到 CMS Made Simple 的事件列表（Extensions | Event Manager）。对于每个事件，都有简要说明何时执行附加到它的用户自定义标签。\n\
  \n此功能允许任何具有一点 PHP 知识的人扩展核心或模块功能。例如，现在应该很容易在编辑器修改页面时向管理员发送电子邮件。对于下一个示例，应正确配置 CMSMailer\
  \ 模块，如第 2 章《入门》中所述。\n\n## 动手时间 – 页面更新后发送邮件\n\n要使 CMS Made simple 在内容页面更新时向管理员发送电子邮件，请执行以下步骤：\n\
  \n- 1. 在管理控制台中，单击 Extensions | User Defined Tags。\n- 2. 单击 Add User Defined Tag\
  \ 链接。\n- 3. 将新标签命名为 buzzer，代码如下：\n```\nglobal $gCms;\n$cmsmailer = $gCms->modules['CMSMailer']['object'];\n\
  $cmsmailer->AddAddress($cmsmailer->GetFrom(),$cmsmailer->GetFromName());\n$cmsmailer->SetSubject('Admin\
  \ buzzer');\n$cmsmailer->SetBody('The page <i> '.$params['content']->mName.' </i>\
  \ has been changed.');\n$cmsmailer->IsHTML(true);\n$cmsmailer->Send();\n```\n- 4.\
  \ 单击 Submit。\n- 5. 在管理控制台中，单击 Extensions | Event Manager。\n- 6. 找到名为 ContentEditPost\
  \ 的事件，并单击同一行上的编辑按钮。\n- 7. 从下拉字段中选择 buzzer 标签，然后单击 Add。\n- 8. 现在，更改任意页面以测试管理员蜂鸣器功能。你应该会收到一封包含更改页面名称的电子邮件通知。\n\
  \n## 发生了什么？\n\n我们使用了 CMS Made Simple 的 CMSMailer 模块来发送电子邮件通知。这样，我们考虑了在模块中进行的所有单独设置，并确保电子邮件正确发送。\n\
  \n添加到标签的 PHP 代码是对添加到 CMSMailer 模块帮助部分中的示例代码的轻微修改。它向模块中 From address 字段配置的电子邮件地址发送邮件。我们还在电子邮件通知中使用了更改页面的名称。这是因为事件为我们提供了对象\
  \ $params['content']，它包含对受影响页面的引用以及有关页面的所有信息。\n\n然后，你将用户自定义标签分配给事件 ContentEditPost。此事件在页面编辑并提交后发送（仅应用更改是不够的，你必须提交它们）。\n\
  \n## 在导航中集成 jQuery\n\nCMS Made Simple 在所有模板中使用纯 HTML、CSS 和 Smarty。这意味着你也可以在模板中使用任何\
  \ jQuery 效果。jQuery 是一个 JavaScript 框架，拥有大量插件。\n\n\n\n\n\n要使用插件，你必须将 HTML、CSS 和 JavaScript\
  \ 分开，并将它们放在 CMS Made Simple 中的适当位置。HTML 标记保存在模板中，而 CSS 则保存在样式表中，然后分配给模板。JavaScript\
  \ 可以全局放置（**站点管理 | 全局元数据**），这样它就可以在整个页面上使用。或者，它可以放在页面模板中。在这种情况下，它将在使用此模板的所有页面中可用。如果您只需要在一个页面中使用\
  \ JavaScript，那么您可以在 **选项** 选项卡中的 **页面特定元数据** 字段中添加它。\n\n让我们看看如何在你的网站上集成 jQuery 下拉菜单。有关此效果的示例和说明可以在\
  \ `http://www.dynamicdrive.com/style/csslibrary/item/jquery_multi_level_css_menu_horizontal_blue/`\
  \ 找到。\n\n## 动手时间 – 在导航中集成 jQuery\n\n上面的链接上的说明解释了如何在纯 HTML 网站中使用此 jQuery 插件。让我们看看如何在\
  \ CMS Made Simple 中集成该插件。\n\n- 1. 从上面给出的地址将文件 `jquerycssmenu.css` 和 `jquerycssmenu.js`\
  \ 保存到你的本地磁盘。\n- 2. 将文件 `jquerycssmenu.js` 上传到你的网络托管上的 `uploads` 文件夹。\n- 3. 在管理控制台中\
  \ **添加样式表（布局 | 样式表）**，将其命名为 **JQueryCSSMenu**，并将文件 `jquerycssmenu.css` 的全部内容复制到\
  \ **内容** 字段中。\n- 4. 点击 **提交**。\n- 5. 在样式表列表中，点击新创建样式表旁边的蓝色 CSS 按钮。\n- 6. 从下拉字段中选择你的主模板，然后点击\
  \ **附加到此模板**。\n- 7. 打开你网站的主模板，并在 head 部分添加以下代码片段：\n\n```\n{literal}\n<!--[if lte\
  \ IE 7]>\n<style type=\"text/css\">\nhtml .jquerycssmenu{height: 1%; /*Holly Hack\
  \ for IE7 and below*/\n</style>\n<![endif]-->\n{/literal}\n<script type=\"text/javascript\"\
  \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.2.6/jquery.min.js\"></script>\n\
  <script type=\"text/javascript\" src=\"uploads/jquerycssmenu.js\"></script>\n```\n\
  \n- 8. 在主模板中创建或替换顶部导航为：\n\n```\n<div id=\"myjquerymenu\" class=\"jquerycssmenu\"\
  >\n{menu template=\"minimal_menu.tpl\"}\n<br style=\"clear: left\" />\n</div>\n\
  ```\n\n- 9. 点击应用，然后查看你网站的下拉菜单。\n\n## 发生了什么？\n\n这是一个非常基本的示例，说明如何将 jQuery 集成到你的网站中。首先，你必须弄清楚插件需要哪些\
  \ JavaScript 文件并将它们上传到你的网络托管。然后创建一个新的样式表，将所有样式复制到其中，并将新样式表附加到模板。如果样式表中使用了图像，则还应将它们上传到网络托管并调整样式表中的图像路径。\n\
  \n然后打开你的模板并将 JavaScript 添加到模板的 head 部分。任何脚本都应包含在 Smarty 标签 {literal}{/literal} 中。此标签允许将数据块原样获取。这通常用于\
  \ JavaScript 或样式表块周围，其中大括号会干扰 Smarty 标签的大括号。{literal}{/literal} 标签内的任何内容都不会被解释，而是按原样显示。\n\
  \n最后一步，你将所需的 CSS 类和 ID 添加到模板的 HTML 标记中。此方法适用于你想要集成的任何 jQuery 插件。有关将 jQuery 集成到图库模块的另一个示例已在第\
  \ 7 章《使用第三方模块》中解释。\n\n## 测验 – CMS Made Simple 的高级使用\n\n- 1. 如果你更改管理控制台的语言，会对以下哪项产生影响：\n\
  \  - a. CMS Made Simple 中的所有用户账户。\n  - b. 网站访问者看到的语言。\n  - c. 仅此用户账户。\n  - d. 什么都没有。你必须在安装期间选择一次语言，并且以后无法更改。\n\
  \n- 2. 如果你想参与为 CMS Made Simple 制作翻译，你必须：\n  - a. 加入 CMS Made Simple 的官方开发团队。\n \
  \ - b. 加入 Forge 中你所在语言的翻译项目。\n  - c. 在本地安装上翻译并将翻译上传到 CMS Made Simple 论坛。\n  - d.\
  \ 付费给社区以获得所需的翻译。\n\n- 3. 元标签对搜索引擎很重要。像 Google、Yahoo 和 Bing 这样的主要搜索引擎使用哪些元标签？\n \
  \ - a. `descr<meta name=\"iption\" content=\"\" />`\n  - b. `<meta name=\"refresh\"\
  \ content=\"\" />`\n  - c. `<meta name=\"robots\" content=\"\" />`\n  - d. `<meta\
  \ name=\"author\" content=\"\" />`\n\n- 4. 假设你在模板的 `<title>` 标签中使用了 `{title}` 标签。如果页面的标题被更改，会影响什么？\n\
  \  - a. 页面的别名\n  - b. 页面的菜单文本\n  - c. 页面的标题\n  - d. 浏览器标题栏中的名称\n\n- 5. 如何防止同一页面的不同\
  \ URL 被视为重复内容？\n  - a. 一贯使用带或不带 www 的域名。\n  - b. 避免发布网站的打印版本。\n  - c. 对规范 URL 使用规范标签。\n\
  \  - d. 在所有页面中使用 `<meta name=\"robots\" content=\"noindex\" />`。\n\n- 6. 为什么应该使用对搜索引擎友好的地址？\n\
  \  - a. 计算机的 RAM 内存因打开超过七个页面而过载（URL 太长，URL 不友好）。\n  - b. URL 已针对搜索引擎进行了优化。\n  -\
  \ c. 你根本不应该使用它们，因为你必须为每个搜索引擎创建一个特殊的地址，从而创建重复内容。\n  - d. 页面加载速度更快\n\n- 7. 用户定义的标签是用以下哪种语言编写的：\n\
  \  - a. 纯 HTML\n  - b. 纯 HTML 和 CSS\n  - c. JavaScript\n  - d. PHP\n\n- 8. 某些 jQuery\
  \ 插件无法集成到 CMS Made Simple 中：\n  - a. true\n  - b. false\n\n## 试一试 – 进行搜索引擎优化\n\n\
  在发布网站之前为你的网站进行搜索引擎优化。最好从一开始就有一个清晰且经过优化的网站。仔细检查页面标题、菜单文本以及页面内容中作为内部链接表示的词语。检查一个页面是否可以通过不同的\
  \ URL 访问，并使用规范标签帮助搜索引擎了解哪个 URL 是主要 URL。为搜索引擎创建 XML 网站地图并监控访客统计数据，以了解哪些页面最受欢迎，从而了解可以扩展哪些页面内容。\n\
  \n请记住，你的网站主要是为访客制作的，而不是为搜索引擎制作的。搜索引擎只是将访客带到你网站的载体。而访客是否喜欢你的网站则在你的责任范围内。\n\n## 总结\n\
  \n在本章中，我们学习了一些不一定是每个网站都包含的高级主题。\n\n具体来说，我们涵盖了以下主题：\n\n- **本地化和翻译：** 如果网站的主要语言不是英语或你将要创建一个多语言网站，则需要此部分。\n\
  - **编辑的附加内容和控件：** 本部分有助于理解如果你有复杂的布局或想给网站“编辑”更多控制权时可以做什么。\n- **搜索引擎优化：** 你学习了如何为搜索引擎优化网站。\n\
  - **用户定义标签和事件管理器：** 如果你有一些基本的 PHP 知识，你甚至可以将自己的 PHP 脚本实现到 CMS Made Simple 中，同时仍保持可升级性。\n\
  - **实现 jQuery 效果：** 你学习了如何将简单的 jQuery 功能实现到网站的顶部导航中。\n\n现在我们已经学习了如何实现这些复杂功能，请阅读下一章，了解你在网站生命周期中作为网站管理员需要承担哪些任务。\n"
- "## 管理和故障排除\n\n一旦你创建的网站准备就绪并运行，你必须更仔细地查看你在网站生命周期中作为网站管理员的任务。根据网站的性质，如果你或你的客户不断添加和编辑内容或更改设计，你必须定期备份。还建议关注\
  \ CMS Made Simple 的发展并进行更新，以保持网站安全并能够使用最新功能。\n\n本章帮助你在网站运行后管理你的 CMS Made Simple\
  \ 网站。在本章中，我们将了解如何：\n\n- 备份你的网站\n- 将其移至另一个网络主机\n- 升级你的安装或模块\n- 优化性能\n- 以最有效的方式保护和保护你的网站\n\
  - 从社区获得帮助\n\n你不必阅读整章。你可以从任何部分开始阅读，因为它们彼此不依赖。*升级 CMS Made Simple* 是你将在发布 CMS Made\
  \ Simple 新版本时可能需要的部分。\n\n我强烈建议你阅读 *故障排除* 部分并花 10 分钟时间阅读问题 *如何在免费支持论坛中快速获得答案？* 有一些有用的提示，说明如何在最短时间内获得最佳答案。\n\
  \n\n\n\n\n## 获取系统信息\n\n作为网站管理员，您应该知道如何获取自己网站或客户安装的系统信息。这些信息有助于您了解 CMS Made Simple\
  \ 安装和配置所在的服务器环境，并在运行 CMS Made Simple 或其任何模块遇到问题时，为您提供初步的排查线索。\n\n在管理后台中，点击“站点管理\
  \ | 系统信息”。信息页面分为三个部分：\n\n- CMS 安装信息\n- PHP 信息\n- 服务器信息\n\n在第一个部分中，您可以看到已安装的 CMS\
  \ Made Simple 版本以及所有已启用模块及其版本。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_313_0.png)\n\
  \n故障应尽快修复。如果您在运行 CMS Made Simple 时没有遇到任何问题，警告可以忽略；但如果某些功能未按预期工作，则应予以修正。在下表中，您将看到\
  \ CMS Made Simple 的一些必需和推荐设置。必需设置为强制要求，推荐设置则能让您的系统运行得更顺畅，并解决某些问题。\n\n| 设置 | 最低值和推荐值\
  \ |\n|---|---|\n| **当前 PHP 版本（phpversion）** | 5.0.4 或更高 |\n| **GD 版本（gd_version）**\
  \ | 版本 2 |\n| **运行时魔术引号（magic_quotes_runtime）** | 开启（True） |\n| **PHP 有效内存限制（memory_limit）**\
  \ | 最低 16 MB<br>推荐 24 MB 或更高 |\n| **最大执行时间（max_execution_time）** | 最低 30<br>推荐 60\
  \ 或更高 |\n| **PHP 安全模式（safe_mode）** | 关闭（False） |\n| **会话保存路径（session_save_path）**\
  \ | 该路径应可写（绿色勾选） |\n| **PHP register_globals（register_globals）** | 关闭（False） |\n\
  | **最大 POST 大小（post_max_size）** | 最低 2M<br>推荐 10M 或更高 |\n| **最大上传大小（upload_max_filesize）**\
  \ | 最低 2M<br>推荐 10M 或更高 |\n\n**系统信息**页面的第三个部分为您提供了服务器配置的概览。如果您是网站管理员，您至少应当能够回答关于系统的三个问题：\n\
  \n- 您的服务器上运行的是什么操作系统？\n- 您的服务器上安装了哪种服务器软件（以及哪个版本）？\n- CMS Made Simple 安装使用的是哪种数据库（以及哪个版本）？\n\
  \n只要仔细查看此处提供的信息，所有这些问题都可以得到解答。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_316_0.png)\n\
  \n从上面的截图中，我可以说明这次安装的 CMS Made Simple 运行在 Linux（服务器操作系统）上，安装了 Apache 服务器版本 2（服务器软件），并且该服务器使用\
  \ MySQL 5.0.32 数据库（服务器数据库 + 服务器数据库版本）。\n\n了解您的服务器配置方式对于在遇到问题时获得帮助非常重要。应用程序的版本和配置种类繁多，因此没有人能准确猜测您的具体托管环境是如何配置的。在从社区获取免费帮助时，请牢记这一点。\n\
  \n## 备份您的网站\n\n备份是指复制您的文件和数据库。您需要定期备份，以防网络托管出现问题时造成数据丢失。您的数据可能因某些托管问题或站长的失误而丢失。因此，保留备份文件以便恢复您的网站至关重要。\n\
  \n要备份使用 CMS Made Simple 构建的网站，仅通过 FTP 复制服务器上的所有文件是不够的。这些文件只是您网站的一小部分。最重要的部分是数据库，其中存储了您的所有文本和设计（图片文件除外）。\n\
  \n在 CMS Made Simple 中，您有两个模块（一个用于文件备份，一个用于数据库备份）。在免费虚拟主机或受严格限制的托管环境中，您可能无法使用这些模块。要检查是否可以使用以下所述模块轻松备份网站，请先尝试安装第一个用于备份文件的模块。\n\
  \n## 备份网站文件\n\n**网站文件**是您上传到 FTP 目录的文件。其中大部分由开发团队提供，并在安装前已复制到您的网站空间。在`uploads`目录中，您会找到编辑器上传的文件，例如\
  \ `images` 图片。如果您安装了额外的模块，那么您会在`modules`文件夹中找到这些模块的文件。\n\n要备份文件，您可以将 FTP 中的所有内容下载到本地磁盘。但是，根据您的连接速度和文件总数，这可能会花费大量时间。\n\
  \n### 操作时间 – 使用模块创建备份\n\n如果您希望在下载前将文件归档，可以使用 **FileBackup** 模块。\n\n1. 在管理后台中，选择\
  \ **扩展 | 模块管理器**。\n2. 点击 **可用模块** 选项卡，在按字母顺序排列的模块列表上方查找字母 **F**。\n3. 找到 **FileBackup**\
  \ 模块，并点击同一行中的 **下载并安装** 链接。如果您的网络托管有相关限制，您将看到以下错误：\n\n   > 您无法使用此模块，因为您的服务器上未安装\
  \ tar 命令。\n\n   在这种情况下，您将不得不手动备份网站。如果 **FileBackup** 模块安装成功，那么您可以开始配置它。\n\n4. 在管理后台中，前往\
  \ **站点管理 | 文件备份**。\n5. 点击 **首选项** 选项卡。在管理区域中，您会看到以下消息：\n\n   > 使用 FileBackup 之前，请检查并保存\
  \ tar 二进制文件的路径。\n\n6. 点击 **保存**。（该模块会尝试自动识别所需路径）。如果消息没有消失，您必须向托管服务商询问您的网络托管上 `tar`\
  \ 二进制文件的路径，并将该路径输入到 **Path to tar binaries**（tar 二进制文件路径）字段中。\n7. 切换到 **备份文件** 选项卡。\n\
  8. 点击 **备份文件**。\n9. 等待完整文件夹列表显示，并在列表末尾看到 **任务完成** 消息。在此消息下方，您将看到包含所有网站文件的备份文件。\n\
  10. 点击备份文件，并将其保存到您的本地磁盘。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_318_0.png)\n\
  \n### 刚才发生了什么？\n\n您已创建了所有网站文件的归档备份，并将该归档保存到本地磁盘。您应该创建新的备份文件，并将其与当前安装分开保存。例如，保存在本地磁盘上，每当您安装新模块、升级整个系统或某个模块，或上传新图片时都进行备份。要定期这样做。在紧急情况下，您将节省大量时间。\n\
  \n所有备份文件也会保存在您的安装中。您可以使用任何 FTP 浏览器（例如 **FileZilla**）在您的网络托管上的 `/admin/backups` 文件夹中找到它们。\n\
  \n> 请确保在下载到本地磁盘后删除备份文件。否则，任何人都可以访问 `http://www.yourdomain.com/admin/backups/` 并下载您的备份，其中包含带有数据库设置和密码的\
  \ `config.php` 文件。\n\n建议在创建文件备份之前清除缓存文件夹，因为 CMS Made Simple 会创建大量临时文件来加速网站运行。这些文件不应包含在备份中，因为一旦\
  \ CMS Made Simple 安装并运行，它们会自动重新生成。要在管理后台中清除缓存文件夹，请点击 **站点管理 | 全局设置**，选择 **高级设置**\
  \ 选项卡，然后点击 **清除缓存** 标签下方的 **清除** 按钮。\n\n实际上，如果文件经常更改，最好的解决方案是设置某种自动化备份。您应该联系您的互联网服务提供商，以确定是否可以自动备份文件。\n\
  \n\n\n\n\n## 备份数据库\n\n接下来，你要备份你的数据库。换句话说，你要创建数据库的转储。转储包含了安装的所有实际数据：页面结构、页面内容、完整设计，以及保存在模块（如\
  \ News）中的任何数据。\n\n数据库备份的重要性与文件备份相同。如果你只备份文件，那么你就不会备份网站上的任何更改，例如新页面或新模块。\n\n### 操作时间\
  \ – 创建数据库备份\n\n让我们看看如何与文件备份一起创建数据库备份。你需要 MysqlDump 模块才能从 CMS Made Simple 的管理控制台内创建数据库转储。\n\
  \n1. 在管理控制台中，点击 Extensions | Module Manager\n2. 点击 Available Modules 选项卡，然后在字母模块列表上方点击字母\
  \ M。\n3. 找到模块 MysqlDump，并点击同一行中的 Download & Install 链接。如果你的网络托管有限制，则会看到以下错误。\n4.\
  \ 在管理控制台中，点击 Site Admin | MySQL Dump\n5. 切换到 Preferences 选项卡。\n6. 点击 Save。 （通常 mysql\
  \ 二进制文件的路径会自动识别。）如果仍然看到消息 Invalid path to MySQL utilities，那么你需要向你的托管服务提供商询问你在网络托管上\
  \ mysql 二进制文件的正确路径，并在字段 Path to mysql binaries 中输入该路径。\n7. 切换到 Backup Database 选项卡。\n\
  \n> 如果你的服务器上未安装 MySQL，则无法使用此模块。\n\n此错误意味着你无法以这种方式使用该模块来创建数据库转储，应该手动执行（请参阅下一节）。如果模块安装成功，那么你现在就可以创建数据库转储了。\n\
  \n8. 点击 **Backup database** 按钮。等待表格列表出现，并在列表末尾找到创建数据库转储的链接。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_320_0.png)\n\
  \n9. 将文件保存到你的本地磁盘。\n\n### 发生了什么？\n\n你已创建了数据库的备份。此备份包含你所有的数据库表，应定期进行，最好在对网站页面或模块进行更改时每次都进行。\n\
  \n与文件备份类似，你可以使用任何 FTP 客户端（例如 FileZilla）在你的网络托管上的 `/admin/backups` 文件夹中找到所有数据库备份。\n\
  \n### 手动备份\n\n如果由于某些限制（通常在免费网络托管上设置）不允许你在网络托管上安装模块，那么你应该手动备份你的文件。\n\n对于文件备份，打开任何\
  \ FTP 浏览器（例如 FileZilla），导航到你的安装文件夹，并将所有文件从网络托管复制到你的本地磁盘。请记住，文件只包含你网站的一小部分。你应该创建数据库转储以保存所有内容、设计和模块数据。\n\
  \n### 使用 phpMyAdmin 备份数据库\n\n**phpMyAdmin** 是一款免费的开源工具，旨在处理 MySQL 数据库的管理。它通常安装在每个网络托管上。联系你的服务提供商以确定\
  \ phpMyAdmin 在你的网络托管上的链接，如果不确定，还需要你的登录凭据。此工具可帮助你创建数据库备份。\n\n### 操作时间 – 使用 phpMyAdmin\
  \ 创建备份\n\n这里描述的步骤仅在你无法使用前面描述的模块备份数据库时才需要。\n\n1. 登录到你服务器上的 phpMyAdmin（联系你的服务提供商以确定详细信息，因为它们在不同网络主机之间可能有所不同）。\n\
  \n2. 登录后，在主屏幕上选择 **Databases**：\n\n3. 选择用于 CMS Made Simple 安装的数据库。如果不确定，请打开 `config.php`\
  \ 文件并找到包含数据库名称的行 `$config['db_name']`。\n\n4. 在列表中点击数据库名称。\n\n5. 在下一个屏幕上，你将看到此数据库中所有表的列表。点击列表顶部的\
  \ **Export** 选项卡，如以下屏幕截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_321_0.png)\n\
  \n![](img/b21e3dc5c94405bc7b3f102758ea770c_321_1.png)\n\n### 步骤 1\n\n对于接受访客数据的繁忙网站考虑此步骤，例如\
  \ **Comments** 或 **FrontEndUsers**。启用 **Site Down Message** 以防止有人在你将网站迁移到另一个托管服务时使用网站。在管理控制台中，点击\
  \ **Site Admin | Global Settings**，并选择 **Sitedown Settings** 选项卡。写下访客在传输期间尝试使用你的网站时将看到的消息，然后勾选\
  \ **Enable Site Down Message** 复选框，并点击 **Submit**。从现在开始，访客将看到 **Site Down Message**\
  \ 而不是网站。\n\n### 步骤 2\n\n清除 `cache` 文件夹。CMS Made Simple 创建了大量临时文件以加快网站速度。这些文件不应与备份一起保存，因为一旦\
  \ CMS Made Simple 安装并运行，它们将自动生成。要在管理控制台中清除 `cache` 文件夹，请点击 **Site Admin | Global\
  \ Settings**，选择 **Advanced Setup** 选项卡，然后点击 **Clear Cache** 标签下方的 **Clear** 按钮。\n\
  \n### 步骤 3\n\n创建数据库备份，如前一节所述。使用 phpMyAdmin 在新主机上导入数据库。登录到新主机上的 phpMyAdmin，并选择用于\
  \ CMS Made Simple 的数据库。点击 **Import** 选项卡，并在字段 **Location of the text file** 中选择包含数据库备份的文件。点击\
  \ **Go**。数据库将被导入到新主机。\n\n### 步骤 4\n\n使用 FTP 客户端（例如 FileZilla）将所有文件从旧站点复制到新站点。文件传输完成后，请记住检查新站点上文件夹的权限，以确保它们设置正确。检查以下文件夹的权限：\n\
  \n- `/tmp/templates_c`\n- `/tmp/cache`\n- `/uploads`\n- `/uploads/images`\n- `/modules`\n\
  \n它们应该是可写的。如果不确定如何操作，请联系你的服务提供商。\n\n### 步骤 5\n\n在最后一步中，你必须打开并修改文件 `config.php` 和\
  \ `.htaccess`。\n\n在文件 `config.php` 中，检查并调整以下部分：\n\n- Database Settings\n- Path Settings\n\
  - Image Settings\n\n使用适用于新服务器的数据库访问凭据和路径对其进行更新。\n\n> 路径设置并不总是那么明显。在你的 FTP 浏览器中，它可能显示为\
  \ `/csmmadesimple`。然而，服务器上的真实路径可能类似于 `/home/user/html/cmsmadesimple`。如果路径错误，请在传输后尝试访问你的网站时查看错误消息。此消息将提示你真实的路径设置。如果仍然不清楚，请联系你的服务提供商寻求帮助。\n\
  \n`.htaccess` 文件只有在你更改域名时才应修改。但是，如果你由于搜索引擎优化而未对文件进行任何更改，请保持原样。\n\n尝试登录到新托管上的 CMS\
  \ Made Simple 管理控制台。如果一切看起来良好，请禁用 **Site Down Message** 并查看页面运行情况。\n\n## 升级 CMS\
  \ Made Simple\n\nCMS Made Simple 开发团队不断改进应用程序；因此新版本会定期发布。你应该确保相应地升级你的系统。升级很重要，原因有几个。\n\
  \n- **免费社区支持：** 你可能得不到旧版本的帮助，因为只有少数用户仍在使用旧版本。开发团队不会修复旧版本中的任何问题，因为许多问题已在更新版本中解决，并且你始终被鼓励安装最新版本。\n\
  - **功能：** 在新版本中实现了新功能。如果你使用旧版本，那么如果你需要已经开发并存在的东西，就必须重新发明轮子。\n\n\n\n\n- **第三方模块：**\
  \ 附加模块的开发者会发布包含新功能和 bug 修复的新版本。新版本的模块通常假定已安装最新版本的 CMS Made Simple。有时，你需要的功能已经在该模块的最新版本中实现，但由于\
  \ CMS Made Simple 版本过旧，你无法安装它。\n\n- **安全更新：** 新版本不仅修复错误、增加新功能，而且时不时会发现安全漏洞。在这种情况下，漏洞利用程序会迅速在互联网上传播。漏洞利用程序通常是利用\
  \ bug 来控制系统的命令序列。如果你不升级，你的系统将变得极其脆弱，数据可能被破坏或丢失，除了你自己，没有人会为此承担责任。\n\n- **稳定性与性能：**\
  \ 新版本通常包含性能改进。即使你对新版本中的新功能不感兴趣，仅通过升级也能提升网站速度。\n\n如果新版本已发布，你会在管理控制台主菜单下方看到一条消息，提示“**您有\
  \ 1 条未处理的通知**”。该消息每天只出现一次！点击消息旁边的加号，如下面的截图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_325_0.png)\n\
  \n下面我们来看看如何将你的安装升级到新版本。\n\n在每次升级之前，务必备份你的数据库和虚拟主机上的所有文件（请参阅*备份你的网站*一节）。如果出现问题，你随时可以恢复到以前的版本并重新开始升级。没有备份意味着在紧急情况下无法回退。\n\
  \n在浏览器中打开链接 `http://cmsmadesimple.org`，然后选择页面顶部主菜单中的**下载 | 文件发布**。会显示版本列表。如果你不确定虚拟主机上当前安装的\
  \ CMS Made Simple 版本，请打开管理控制台；你可以在页面最底部的页脚区域看到你的网站使用的版本。\n\n在下载部分，找到最新版本，并选择名为 `cmsmadesimple-full-diff-[YOUR.CURRENT.VERSION]-[NEW.VERSION].tar.gz`\
  \ 的文件。例如，要从 1.6 版本升级到 1.6.5，你必须选择文件 `cmsmadesimple-full-diff-1.6-1.6.5.tar.gz`。将文件保存到本地磁盘并解压。\n\
  \n如果找不到从你的确切版本到当前版本的升级文件，那么你需要下载高于已安装版本的最近一个完整版本（例如 1.6），并先使用该版本按照这些说明进行操作。\n\n\
  在将文件复制到 Web 服务器之前，你可能应该设置一条**网站关闭消息（站点管理 | 站点关闭设置）**。现在打开一个 FTP 浏览器，将解压文件夹中的所有文件上传到你的虚拟主机。覆盖现有的文件和目录。你必须用这些新版本覆盖现有文件。\n\
  \n上传新文件后，检查在安装 CMS Made Simple 的文件夹中是否创建了一个名为 `/install` 的文件夹。如果是，则在浏览器中输入 `http://www.yourdomain.com/install/upgrade.php`（将域名替换为你自己的域名）。这将自动将数据库更新到最新版本。升级后不要忘记删除\
  \ install 文件夹。如果没有创建名为 install 的文件夹，那么此时你已经完成了升级。\n\n检查管理控制台页脚区域的版本信息。现在应该显示新版本了。\n\
  \n然后你必须升级模块。在管理控制台中，点击**扩展 | 模块管理器**，并在**可用升级**选项卡中查看是否有模块需要升级。\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_326_0.png)\n\
  \n如果显示了一些升级，请在**可用模块**选项卡中查找这些模块，并点击模块名称旁边的**升级**链接。\n\n> 有时，新版本的提示不会显示在管理控制台中。这是由于你的虚拟主机的安全设置所致。在这种情况下，另一种可能获知新版本的方式是订阅\
  \ CMS Made Simple 博客的官方 RSS 源，或者（如果你是 CMS Made Simple 论坛的注册会员）订阅**公告**版区。\n\n请记住，如果你定期升级，升级系统并不困难。跟上开发步伐，以获得最佳的免费支持，并确保你的系统安全稳定。\n\
  \n## 优化（性能调优）\n\n与每个系统一样，CMS Made Simple 也可以进行优化和调整，以获得最佳性能。本节中描述的技巧可以显著加速你的系统。但是，我建议仅在你遇到性能问题时才应用这些说明。\n\
  \n在开始优化系统之前，你应该了解系统在未进行任何优化时的性能表现。CMS Made Simple 内置了性能测量功能。如果你在浏览器中打开 CMS Made\
  \ Simple 生成的任何页面，然后查看页面源代码，你会发现每个页面末尾都有 HTML 注释，如下所示：\n\n```\n<!-- 0.267839 / 38\
  \ / 5834456 / 6113588 -->\n```\n\n该注释可以分解为四个部分：\n\n1. 页面由 CMS Made Simple 在 0.267839\
  \ 秒内生成。\n2. 生成页面需要 38 次 SQL 查询。\n3. 使用了 5834456 字节的内存。\n4. 峰值内存使用量为 6113588 字节。\n\
  \n你应该保存此注释，以便掌握通过以下各节中的优化技巧可以节省多少资源。每次进行优化时，将同一页面上的新数字与之前的数字进行比较。\n\n### 压缩\n\n\
  此选项允许服务器在将输出发送到浏览器之前对其进行压缩。简而言之，页面被压缩，服务器发送的不是 HTML，而是一个小得多的 ZIP 文件。文件越小，网站加载速度越快。浏览器能够自动解压缩压缩后的页面，因此你和访问者都无需关心这一点。\n\
  \n可以在 `config.php` 文件中启用压缩。打开该文件并找到以下行：\n\n```\n$config['output_compression'] =\
  \ false;\n```\n\n将其设置为 true 以开启压缩：\n\n```\n$config['output_compression'] = true;\n\
  ```\n\n在某些网站上，这可能会带来显著的性能提升。但是，对于已启用 mod_deflate 的 Apache 服务器，则不需要此功能。如果你不确定，请与你的服务商联系。请注意，启用此功能会显著增加服务器端的\
  \ CPU 和内存使用量，如果服务器非常繁忙，这甚至可能导致网站变慢。\n\n### 持久连接\n\nCMS Made Simple 基于数据库。因此，对于浏览器中加载的每个页面，都需要一个数据库连接。CMS\
  \ Made Simple 连接数据库的方式有两种。通常，每个页面都必须建立新的数据库连接。持久连接是一种为某些应用提高性能而设计的概念。它不是为每个页面建立连接，而是打开一次连接，然后在应用程序生存期内保持该连接。\n\
  \n在 `config.php` 文件中，你可以定义 CMS Made Simple 应如何连接到数据库。打开该文件并搜索以下行：\n\n```\n$config['persistent_db_conn']\
  \ = false;\n```\n\n将该行改为：\n\n```\n$config['persistent_db_conn'] = true;\n```\n\n\
  这将确保数据库连接在页面加载后不会关闭，而是保持打开状态。下次请求页面时，服务器会检查是否存在已打开的连接，并将其用于新页面。这样，就节省了建立新数据库连接所需的时间。\n\
  \n> 并非所有服务商都允许此设置。请联系你的服务商，以确认你可以在虚拟主机上使用持久连接。\n\n### 全局设置中的 CSS 和静态 CSS\n\n另一个可以节省时间的地方是页面样式表的生成。如果你在浏览器中打开页面并查看页面源代码，你会看到样式表的链接实际上是对\
  \ PHP 文件 `stylesheet.php` 的引用：\n\n```\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"http://yourdomain.com/stylesheet.php?cssid=59\" />\n```\n\n然而，没有必要在每次生成页面时都重复生成样式表。当你完成网站设计并且不打算更改时，你可以缓存它们。\n\
  \n\n\n\n\n在管理控制台中，点击“站点管理 | 全局设置”，然后切换到“高级设置”选项卡。找到“样式表可在浏览器中缓存的最长时间（秒）”字段，输入一个不为\
  \ 0 的值，如下图所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_329_0.png)\n\n这取决于你将来更新样式表的频率。如果你将来不打算更改它，那么可以设置一个较高的值，例如\
  \ 2592000 秒。这表示样式表将缓存一个月。\n\n- 1 小时 = 3600 秒\n- 1 天 = 86400 秒\n- 1 周 = 604800 秒\n\
  \n如果你更改样式表，请务必将该值改回 0，因为使用旧的缓存版本时，你将在页面上看不到任何更改。\n\n这些性能优化技巧可以加速 CMS Made Simple。然而，如果你对安装\
  \ CMS Made Simple 的服务器进行调优，而不仅仅是针对 CMS Made Simple 本身，你会获得更显著的效果。服务器调优需要你拥有服务器的完全访问权限，并具备基本的\
  \ Linux 管理员知识。\n\n## 如何保护你的安装\n\n在本节中，你将学习如何保护你的 CMS Made Simple 安装。我们不会讨论如何保护 Web\
  \ 托管服务器，因为这是 Web 托管提供商的任务。如果你自己托管网站，那么你应该了解如何保护服务器的一般方法。如果你使用的是共享托管或受管服务器，那么你的提供商会为你完成这项工作，你无需担心。让我们看看提供商不会为你做哪些事情。\n\
  \n确保网站安全的第一条规则是定期升级 CMS Made Simple 及其模块。每当 CMS Made Simple 发布新版本时，要尽快进行升级。对于修复安全漏洞的安全更新版本来说，这一点尤其重要。升级非常简单。请参阅“升级\
  \ CMS Made Simple”一节，了解如何执行升级。\n\n### 系统验证\n\n一个 CMS Made Simple 安装由文件和数据库组成。数据库保存着页面结构、页面内容、设计以及任何模块数据，在繁忙的网站上可能每天都会发生变化。与数据库相比，文件是网站的一种静态部分。它们只会在以下情况下发生更改：\n\
  \n- 升级 CMS Made Simple\n- 升级任何模块\n- 安装新模块\n- 从安装中移除模块\n- 自己有意或无意地更改文件\n\n有时，如果你的系统保护不够充分，文件可能会被恶意程序或黑客更改。那么，你如何确保系统文件没有被更改，一切仍然正常呢？\n\
  \nCMS Made Simple 使用校验和验证来证明你的 Web 托管上的文件没有被更改。校验和是根据文件计算出的文本字符串，用于检测文件在传输或存储过程中可能发生的意外更改。这些校验和字符串是为每个源自\
  \ CMS Made Simple 核心的文件生成的，可从 http://dev.cmsmadesimple.org/project/files/6 下载。每个\
  \ CMS Made Simple 版本都会生成一个校验和文件。\n\n根据你的版本（基础版或完整版，以及发行版本），选择正确的 checksum.dat 文件，并将其保存到本地磁盘。用文本编辑器打开它，查看其中的内容。\n\
  \n```\n3ad39cc13942818630935b56dc8af619  */index.php\n6f8ae75cfde0c5a81dc09f35ea40f7a6\
  \  */preview.php\nd53ee56d1c123a1ed04326ca3406e744  */favicon_cms.ico\n...\n```\n\
  \n你会看到一长串校验和字符串，后面跟着文件名及其路径。在 CMS Made Simple 中，你可以在管理控制台（**站点管理 | 系统验证**）中自动验证所有文件。该功能会将原始文件的校验和字符串与你安装中的文件进行比较。通常情况下，如果你到目前为止没有对系统进行任何升级，你的文件不应该有任何更改。\n\
  \n唯一可以接受的错误是 install 文件夹中的文件缺失，因为出于安全原因，你必须删除该目录。你还可能被告知 tmp 文件夹中的多个 index.html\
  \ 文件缺失或无效。这并不严重。缺少 SITEDOWN 文件也不严重。\n\n每次运行 CMS Made Simple 或其任何模块的升级时，你都应该创建一个新的校验和文件。在管理控制台中，打开“站点管理\
  \ | 系统验证”，然后点击“下载校验和文件”部分中的“提交”按钮。此功能允许你为当前安装生成校验和文件，并将其保存到本地计算机上，以便日后验证。这应在网站发布之前，和/或在进行任何升级或重大修改之后进行。日后，你可以通过将校验和文件与存储的文件进行比较来检查数据的完整性。\n\
  \n使用此功能有助于发现上传问题，或者在系统被黑客入侵时，准确找出哪些文件被修改了。如果你突然遇到奇怪的问题并怀疑系统受到了攻击，那么你应该首先进行系统验证，看看是否有任何文件被更改。如果校验和不匹配，那么数据肯定被更改过（无论是有意还是无意的）。\n\
  \n> 来自 http://dev.cmsmadesimple.org 的原始校验和文件仅验证 CMS Made Simple 核心及其随附的核心模块。你添加的任何其他模块都不会被验证。\n\
  \n你可以看到错误，如下图所示：\n\n```\n1 Files Not found\nFiles Not found:\n./tmp/cache/SITEDOWN\n\
  \n2 Files failed md5sum check:\n./tmp/templates_c/index.html\n./tmp/cache/index.html\n\
  ```\n\n根据前面的说明，这些错误并不严重。如果你遇到其他失败，则需要由你来解释发生了什么。如果你确信自己没有更改任何文件，那么就是其他人为了破坏你的网站而更改了文件。在这种情况下，请从\
  \ CMS Made Simple 下载原始版本，将其解压，然后用原始文件替换被更改的文件。\n\n替换文件只是第一步。如果你的系统已被黑客入侵，这意味着仍然存在一个可被反复利用来破坏你系统的安全漏洞。请阅读并实施以下各节，了解如何保护你的系统。\n\
  \n### 用户名和密码\n\n检查你安装中管理员用户名和密码的组合强度。不要使用 admin、administrator 或类似的其他简单词语作为用户名，因为它们很容易被猜到。其次，为管理员账户使用强密码。密码强度评估的是攻击者平均需要尝试多少次才能猜出你的密码。\n\
  \n以下是一些选择安全可靠密码的技巧：\n\n- 密码中应包含数字、特殊字符、大小写字母和标点符号\n- 密码长度应在 12 到 14 个字符左右\n- 避免使用字典中可查到的单词作为密码\n\
  - 避免使用亲属或宠物的名字，或诸如自己的出生日期、结婚日期等个人信息\n\n同样也要注意编辑者的用户名和密码。帮助他们选择强密码，并建议他们记住密码，切勿将其写下来。你和你的用户不应在其他网站上使用相同的密码。\n\
  \n如果你在网站上使用管理员账户发布新闻文章，那么用户名就会在默认新闻模板中显示在网站上。最好不要显示用户名，或者用用户的名和姓来代替。\n\n要用真实姓名替换用户名，请创建一个新的用户自定义标签（**扩展\
  \ | 用户自定义标签**），将其命名为 *realname*，并添加以下代码片段：\n\n```\nglobal $gCms;\n$db = $gCms->db;\n\
  $query = \"select first_name, last_name from \". $gCms->config['db_prefix'] . \"\
  users where user_id = ?\";\n$row = $db->GetRow($query, array($params['user']));\n\
  echo $row['first_name'] . ' ' . $row['last_name'];\n```\n\n此代码将从用户账户中返回用户的名和姓。它假定提供了带有用户\
  \ ID 的 user 参数。要在模板中使用该用户自定义标签，请在管理控制台中点击**内容 | 新闻**，然后切换到**摘要模板**选项卡。打开模板进行编辑，并搜索\
  \ Smarty 变量 {$entry->author}。将该变量替换为 Smarty 标签 {realname user=$entry->author_id}。保存模板，然后在网站上查看更改。对**详细模板**应用相同的更改。\n\
  \n\n\n\n\n## 隐藏 admin 目录\n\n每个 CMS 都有一个管理后台 URL。在 CMS Made Simple 中，该 URL 是 `http://www.yourdomain.com/admin`。这个\
  \ URL 是默认定义的，因此任何有经验的 CMS Made Simple 用户都能进入你管理控制台的登录页面。你向黑客透露的信息越多，你的系统就越脆弱。在 CMS\
  \ Made Simple 中，你可以轻松更改管理控制台的 URL，使攻击者无法猜测“入口”在哪里。\n\n打开你的 FTP 浏览器，将文件夹 `admin`\
  \ 重命名为一个难以猜测的名称（例如 `private4me` 或 `hide2safe`）。然后，用你选择的任何 FTP 浏览器打开文件 `config.php`，找到以下行：\n\
  \n```\n```php\n$config['admin_dir'] = \"admin\";\n```\n```\n\n将这一行改为你给文件夹 `admin`\
  \ 起的名称。如果你的管理目录现在命名为 `private4me`，则将下面显示的行更改如下：\n\n```\n```php\n$config['admin_dir']\
  \ = \"private4me\";\n```\n```\n\n从现在起，你的管理控制台 URL 将是 `http://www.yourdomain.com/private4me`。如果你现在在浏览器中输入标准的管理\
  \ URL，你将得到错误 404（页面未找到），而不是登录页面。结合强用户名和密码，这将为你的管理区域提供额外保护。攻击者必须先猜测管理 URL，然后才能尝试篡改用户名或密码信息。\n\
  \n当你将 `admin` 文件夹重命名为其他名称时，默认的验证校验文件将无法工作。该文件仍会查找 `admin` 文件夹，但找不到它，然后对每个涉及这个已不存在文件夹的文件都会给你一个错误。因此，在重命名\
  \ `admin` 文件夹后，立即创建一个新的自定义验证文件（**站点管理 | 系统验证**），并将其保存到本地磁盘。这样，考虑到重命名的管理目录，你就能保持系统的当前状态。\n\
  \n在升级 CMS Made Simple 时，在将升级文件复制到当前安装之前，请将你的文件夹重命名回 `admin`，执行升级，然后再次恢复文件夹的自定义名称。\n\
  \n## 文件权限\n\n如果你的安装位于 Linux 服务器上（如果不确定，请检查 **站点管理 | 系统信息、服务器操作系统**），那么你应该知道如何配置文件权限以保护你的系统。Linux\
  \ 服务器需要知道关于文件的两件事：\n\n- 可以对文件执行什么操作？\n- 谁可以对文件执行该操作？\n\n第一个问题可以分为三个操作：**读取**、**写入**和**执行**。读取文件意味着打开文件并查看其内容。写入意味着更改、替换或删除文件。最后一个选项检查是否允许程序或脚本被执行。\n\
  \n第二个问题可以分为三类用户：**所有者**、**组**和**公共用户**。文件的所有者是最初创建它的用户。组对我们的需求并不重要，将按与公共用户相同的方式处理。公共用户是服务器上不属于文件所有者的任何其他用户。\n\
  \n通过 Linux 权限，我们将上述信息结合起来，说明谁可以对每个文件做什么。你可以想象一个如下所示的权限矩阵：\n\n| 权限 | 所有者 | 组 | 公共\
  \ |\n|------------|-------|-------|--------|\n| **读取**   | 4     | 4     | 4   \
  \   |\n| **写入**  | 2     | 2     | 2      |\n| **执行**| 1     | 1     | 1      |\n\
  \n你会看到，理论上只对一个文件来说就有 27 种可能的权限组合。任何组合都可以用前面表中数字的总和来表示，并通过 Linux 命令 **chmod**（更改模式）进行更改。但是，你不需要确切知道该命令如何执行，因为每个\
  \ FTP 浏览器都允许你直观地定义权限。\n\n让我们看看并理解一些权限集合的例子：\n\n- **777**（每列 1+2+4）意味着每个人（所有三个组）都被允许读取、写入和执行该文件。\n\
  - **755** 意味着所有者被允许对该文件进行所有操作，但组和公共用户只被允许读取和执行该文件，不允许更改它。\n- **644** 意味着所有者被允许读取和执行该文件，其他人只被允许读取它。\n\
  \n你的安装中有一个非常重要的文件，值得用 Linux 权限额外保护。该文件包含数据库的连接数据，称为 `config.php`。它就像你安装的心脏。\n\n\
  在安装或升级期间，该文件必须至少可由文件所有者写入，因此其权限必须至少设置为 **644**。一旦安装或升级完成，你应该将该文件的权限降低到 **444**（每个人都可以读取该文件，但没有人可以执行或更改它）。\n\
  \n在类似 FileZilla 的 FTP 浏览器中，你可以右键单击该文件并选择 **文件权限** 选项。下一个对话框类似于以下截图：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_335_0.png)\n\
  \n通常，除非绝对需要，否则避免将任何文件设置为 **777**。此权限允许服务器上的每个用户读取、更改和删除该文件。\n\n## CMS Made Simple\
  \ 与服务器版本\n\n在 CMS Made Simple 的默认模板中，版本信息显示在页脚区域，如下所示：\n\n![](img/b21e3dc5c94405bc7b3f102758ea770c_335_1.png)\n\
  \n此信息通过 Smarty 插件 `{cms_version}` 在模板中提供。请将其删除，并完全不要在模板中使用它。你应该避免透露你使用的确切 CMS Made\
  \ Simple 版本。提出此建议的原因如下。\n\n你使用的是 CMS Made Simple 的某个版本。有一天，该版本中发现了一个安全问题。CMS Made\
  \ Simple 的开发团队做出响应并发布了一个安全更新。如果你不立即升级系统，你的网站将极其脆弱，因为每个人都知道你在网站上使用的确切版本。\n\n出于同样的原因，请从你的安装中删除\
  \ doc 文件夹。此文件夹包含文件 `changelog.txt`，它同样会透露 CMS Made Simple 的实际版本。恶意用户只需在浏览器的地址栏中输入以下行：\n\
  \n```\nhttp://www.yourdomain.com/doc/changelog.txt\n```\n\n> 反复备份你的所有文件和数据库。如果某些东西损坏或丢失，你可以用最新的备份替换损坏的版本，从而节省时间和精力。\n\
  \n## 故障排除\n\n在设计和配置网站时，你肯定会遇到一些问题。如果你知道如何以及在哪里寻求帮助，那么每个问题都有解决办法。\n\n如果你使用示例内容和模板安装\
  \ CMS Made Simple，那么在全新的 CMS Made Simple 安装中，你将获得包含完整文档的内容页面、模板和样式表。它们是让你熟悉该应用程序并了解其工作方式的宝贵途径。通读所有这些页面，并保存它们以供将来参考。\n\
  \n## CMS Made Simple 维基\n\n这个维基的目的不仅是让 CMS Made Simple 社区能够协作完成文档编写过程，还为你提供一种合适且简便的信息查找方式。该文档由\
  \ CMS Made Simple 用户编写，部分覆盖的语言不仅仅是英语。不过，维基的主要部分仍然是英文。你可以在 http://wiki.cmsmadesimple.org\
  \ 上找到该文档。\n\n你可以搜索此文档以找到问题的答案。为了方便，每页右上角都有一个搜索按钮。你可以逐页阅读本手册，也可以选择你喜欢的页面。在右侧的目录中，你可以看到自己当前所在的位置（你正在阅读的页面标题为黑色）。\n\
  \n在 CMS Made Simple 的管理控制台中，你会在每个页面的右上角（主导航下方）看到社区帮助链接。此链接将直接带你到与你当前在管理控制台中打开的功能或模块相关的维基页面。不过，有些页面还没有编写。\n\
  \n参与编写文档的用户越多，你能在其中找到的答案就越多。CMS Made Simple 确实需要每个人的帮助，以使文档准确、用户友好且易于理解。如果你想提供帮助，请先在维基站点上注册为编辑者，然后开始帮助改进和增强文档，同时也供你自己参考。\n\
  \n\n\n\n\n## 管理与故障排除\n\n### 模块帮助\n\n在尝试解决模块问题时，你应该区分 CMS Made Simple 的核心模块和第三方模块。核心模块随\
  \ CMS Made Simple 一起安装，例如 **News**、**Menu Manager**、**Printing**、**Search** 等。第三方模块是手动安装的。第三方模块的帮助不是由\
  \ CMS Made Simple 开发团队提供，而是由模块的开发者提供。因此，第三方模块帮助的质量取决于模块的开发者，官方开发团队无法管理。\n\n### 内置帮助\n\
  \n安装在 CMS Made Simple 网站中的每个模块都包含基本帮助和示例，以帮助你使用其功能。使用 CMS Made Simple 时，你可以在管理控制台中获得内置帮助。打开任意模块，并在主导航下方右上角找到链接\
  \ **Module help**。所有模块的帮助部分看起来大多相似，并包含以下部分。\n\n#### 它做什么？\n\n本节解释模块的用途并描述可用功能。在开始使用模块之前请仔细阅读本节。所需的所有功能是否都已涵盖？模块是否能满足你所有的需求？有些第三方模块具有非常相似的功能。请为每个相关模块阅读本节，进行比较并决定使用哪个。另请参阅\
  \ *Parameters* 部分（如下所述）以了解高级功能。\n\n#### 如何使用它？\n\n本节旨在介绍模块的使用方法。通过遵循一些简单说明，你可以快速获得模块工作原理的第一印象。根据模块的不同，本节的完整程度各不相同，有时还包含复杂的用法示例或有用的提示。\n\
  \n#### Parameters\n\n本节包含你可以用模块使用的所有 Smarty 参数。其中有必须使用的必需参数和一些可选参数。对每个参数都有说明，包括默认值（未指定时使用值）和允许值。参数列表还将为你提供模块功能的完整概览。\n\
  \n### Forge（错误和功能请求）\n\n如果你使用某些第三方模块并遇到问题，也可以查看该模块的错误跟踪器。错误跟踪器是每个模块已知问题的列表，由 CMS\
  \ Made Simple 在开发者部分提供（http://dev.cmsmadesimple.org/）。它不仅包括已知问题的列表，有时还提供解决方案。模块开发者应定期检查错误列表并用新版本更新其模块。\n\
  \n如果你遇到第三方模块的错误，请创建错误报告以通知模块开发者该问题，并使用支持板块向模块用户寻求帮助。错误跟踪器是开发者跟踪错误列表的地方。然而，它不是提出模块支持请求的场所。\n\
  \n### 如何在论坛中快速获得答案\n\n使用支持论坛是你可能每天都在做的事情。因此，你可能会想知道为什么本节这么长。好吧，在论坛中寻求免费支持时，你应该遵循一些规则。如果你曾经在任何论坛中遇到问题未得到解答，那么你应该阅读下面的规则，了解开发者需要你提供什么才能帮助你。\n\
  \n如果你不遵循这些规则，就不会得到快速的答案。此外，你的问题可能会被完全忽略。请记住，论坛提供的支持是免费的。开发团队和论坛上的许多其他志愿者都非常希望提供帮助并使事情为你工作。但请记住，他们都有工作、家庭、朋友和其他责任。没有人会为他们在论坛上做的工作付费。你可以用商业支持购买他们的时间，或者通过提供他们所需的一切来帮助他们帮助你。\n\
  \n#### 使用搜索\n\n在提问前先在论坛中搜索你的问题。请记住，很多问题已经得到解答，你会更快得到答案。使用论坛中的搜索按钮并尝试不同的拼写、同义词和缩写。例如，如果你搜索与模块\
  \ FrontEndUsers 和登录功能相关的任何问题，请尝试：\n\n- Front End Users login\n- FrontEndUsers login\n\
  - FEU login\n- Front End Users sign-in, and so on\n\n- **Layout and Design (CSS\
  \ & HTML)**: 旨在讨论与 CMS Made Simple 模板、样式表（CSS）和主题或布局问题相关的问题。\n- **Modules / Add-ons**:\
  \ 旨在帮助你在使用未包含在 CMS Made Simple 标准包中的任何第三方模块或插件时遇到问题或疑问。\n- **Developers discussion**:\
  \ 用于讨论使用和为 CMS Made Simple 编程。\n- **International Discussions**: 包括其他语言的板块。如果你的问题与英语以外的任何语言相关，你可以在这里讨论。\n\
  \n从一开始选择正确的板块将确保你覆盖最广泛能够帮助你的用户群体。\n\n#### 主题标题\n\n在确定了请求的正确板块后，考虑合适的主题标题或主题。让我们看一些不好的例子：\n\
  \n- Urgent help needed!\n- Big issue\n- Something goes wrong\n\n将问题的良好摘要作为主题标题。如果你遇到模块\
  \ **FrontEndUsers** 中的登录功能问题，那么你的主题应命名为 **Login issues in Front End Users**。虽然很多人都知道你的问题的答案，但他们没有时间查看每个\
  \ *urgent* 或有 *big issue* 的主题。他们只会挑选他们认为知道答案的主题。\n\n#### 提供尽可能多的信息\n\n确保你提供所有能想到的版本信息。包含无关数据总比遗漏有用数据好。获取所需信息的最简单方法是使用\
  \ CMS Made Simple 管理控制台中的页面 **Site Admin | System Information**。此页面包含你和将帮助你的人所需了解的一切。但不要直接将整个页面复制到论坛中。它有一个特殊的文本版本。在页面右上角（主导航下方），你会找到链接\
  \ **View Text Report (suitable for copying into forum posts)**。点击它，复制它，并将其包含在你的论坛帖子中。\n\
  \n#### 逐步描述问题\n\n描述问题，包括尽可能多的细节（尤其是错误信息要完全按呈现的方式）。仅说“如果我使用模块 FrontEndUsers 登录，我会得到一些奇怪的错误”是不够的。\n\
  \n如果没人知道错误是什么，就没人会帮助你。论坛里没有先知，只有开发者。想象一下你的汽车有问题。你打电话给修理厂说“我的车开不动。帮忙！”。如果你不提供有关汽车确切行为的更多信息，修理厂将无法帮助你。支持论坛也会发生同样的情况。\n\
  \n如果错误可以重现，请详细说明可以遵循的步骤以在自己的安装上重复该问题。这是一种非常好的方法；有时在逐步写下你正在做的事情时，你自己就能找出问题。\n\n要有礼貌。不要要求任何东西，因为免费产品没有保证。不要威胁如果你的问题不能立即解决就使用另一个\
  \ CMS。如果你不喜欢 CMS Made Simple，你可以自由使用任何其他系统并在那里索取免费即时支持。然而，我认为你不会在任何地方以这种方式获得免费支持。不要通过说\
  \ CMS Made Simple 的代码很差或效率低下来侮辱开发者。你不会以这种方式得到任何答案，因为在这种情况下开发团队会认为你能够编写自己的漂亮高效的代码并且不需要任何帮助。\n\
  \n要有耐心。如果你的问题有解决方案，你会得到它。每小时“顶帖”使主题出现在板块顶部并不会使过程更快。相反，这可能是被忽略的另一个原因。\n\n#### 如果你得到帮助，请帮助他人\n\
  \n一旦你的问题得到解答并获得解决方案，请打开你的首帖进行编辑，并在主题标题前加上 [SOLVED]。这样开发者就可以集中精力解决未解决的主题，而不是一遍又一遍地查看你的主题。如果你认为这是一个错误而不是操作问题，请在开发\
  \ Forge（http://dev.cmsmadesimple.org）中为其提交错误报告，除在论坛中发布外。这将帮助开发者管理跟踪和修复的过程。\n\n如果问题在论坛中无法得到解答，但你自己找到了解决方案，或有人以其他方式给了你解决方案，请在论坛中发布，以便其他人也能受益。有一天，当有人发布你安装中问题的解决方案时，你也会很高兴。\n\
  \n\n\n\n\n如果你遵循这些步骤，你将为自己和开发人员节省大量时间。快速获得答案很简单。\n\n## 商业支持\n\n那么，你已经让 CMS Made Simple\
  \ 正常运行，并且喜欢你所看到的功能。然而，你的项目需要一些 CMS 尚不可用的功能，或者某些功能不能完全按你想要的方式工作。为此，CMS Made Simple\
  \ 开发团队提供独立承包服务。他们对工具的深入了解以及构建软件包和附加模块的经验，可以确保你获得一个可用、贴合需求且质量上乘的工具。\n\n付费支持适用于那些拥有重要项目、担心解决问题所需周转时间的人。此外，如果你希望有专人可以联系，以解决你无法自行修复的问题、升级问题、备份或任何其他顾虑，那么商业支持可能是一个选择。\n\
  \nCMS Made Simple 开发团队为需要更多支持或需要一些不同功能的 Web 开发人员提供各种专业服务。\n\n## 支持合同\n\n那么，你正在为一位非常重要的客户创建一个新的\
  \ CMS Made Simple 网站，并且你担心“如果出了问题怎么办”。例如，如果主机商更改了某些设置，或者网站被黑客入侵，或者发生了一些意外情况。你需要快速、妥善地修复它，但你不确定如何做到这一点。\n\
  \n正是为了这些目的，开发团队的多个成员提供支持合同。支持合同向你的客户保证，如果出现意外情况，一位精通 CMS Made Simple 的专业且有经验的程序员将在合理的时间内提供服务，要么亲自处理问题，要么通过电话、视频聊天等方式协助你解决问题。\n\
  \n支持合同名义上定价，通常按每个网站计算，包含固定数量的“工单”，并限定有效期（例如一年）。可以把它想象成一份保险单。如果出现了你不知道如何修复的问题，会有人为你提供帮助。\n\
  \n你的客户可能会因为知道他们业务关键的网站有持续的技术支持而感到更安心。\n\n## 软件开发\n\n那么，你已经运行着多个 CMS Made Simple\
  \ 网站，而且它们都运行良好。然而，你正在开发的这个新网站有点不同，你需要一些 CMS Made Simple 尚不具备的功能。你可能需要对某些现有功能的行为进行一些细微的更改。你可以去哪里寻求帮助？\n\
  \nCMS Made Simple 开发团队可以与你合作，通过修改一些现有代码或编写新代码来确定问题的解决方案。\n\n开发团队在 CMS Made Simple\
  \ 以及 CMS Made Simple 框架的开发方面拥有丰富的经验（毕竟，框架就是他们编写的）。\n\n大多数开发团队成员按时间计费。只需支付一笔象征性的费用，你或许就能让一位开发团队成员调整他们的日程来帮助你。\n\
  \n## 更大的项目怎么办？\n\n开发团队也能处理这些。CMS Made Simple 可用的许多模块都是由社区成员赞助的，他们热爱 CMS Made Simple\
  \ 及其灵活性，但需要一些尚不可用的功能。也许你可以成为另一位重要的赞助者。\n\n你可以联系一位开发团队成员，与他们合作，以合同形式赞助一个项目。通常，这些合同的费用基于常规咨询费率。\n\
  \n## 开发团队是公司吗？\n\n实际上，不是；他们是一组松散耦合的独立承包商，共同协作。他们合作并为 CMS Made Simple、各种附加组件做出贡献，并处理诸如支持合同之类的问题。\n\
  \n他们独立工作，因为他们分布在世界各地，这样合作起来更方便。然而，他们总是愿意互相帮助，并因各种原因互相顶班，例如，如果其中一人要去度假，其他成员愿意为其处理支持合同问题。同样，如果有人因其他项目太忙，他们会非常乐意推荐另一位合适的开发团队成员来帮助你。\n\
  \n## 我该如何联系你们？\n\n嗯，你可以在 http://www.cmsmadesimple.org/about-link/about-us/ 上阅读有关开发团队的更多信息，并决定你想联系哪位成员。如果你有进一步的问题想问，但还不想直接联系任何人，你可以随时在“寻求帮助（商业）”版块提问。\n\
  \n## 小测验 – 管理与故障排除\n\n- 1. 数据库备份中包含什么？\n  - a. 整个网站，包括页面结构、语言、模块和模板。\n  - b. 仅页面结构、设置和模板。\n\
  \  - c. 仅页面结构和设计保存在文件中。\n  - d. 数据库不包含任何对备份网站重要的内容。\n- 2. 你应该多久备份一次网站？\n  - a. 每天。\n\
  \  - b. 取决于网站内容更改的频率。\n  - c. 取决于你希望多久恢复一次网站。\n  - d. 你不需要关心备份。这会自动完成。\n- 3. 为什么你应该定期升级使用\
  \ CMS Made Simple 运行的网站？\n  - a. 以保留页面整个生命周期中所做的更改。\n  - b. 告知网站访问者你使用的是最新版本的 CMS\
  \ Made Simple。\n  - c. 保持安装安全并避免漏洞。\n  - d. 了解所提供的新功能，并能选择你需要的内容。\n- 4. 哪个名称最适合作为管理员账户？\n\
  \  - a. admin\n  - b. ro0t6i2go\n  - c. webmaster\n  - d. test\n- 5. 遇到问题时，你在哪里可以找到免费帮助？\n\
  \  - a. 任何 HTML 或 CSS 参考。\n  - b. CMS Made Simple 官方帮助论坛。\n  - c. 给某位 CMS Made Simple\
  \ 开发人员发送私人消息。\n  - d. 安装文件和数据库中的注释。\n- 6. 你如何及时了解 CMS Made Simple 的任何更新？\n  - a.\
  \ 如果有更新可用，你会自动收到电子邮件。\n  - b. 你必须每天查看官方论坛。\n  - c. 你会在 CMS Made Simple 的管理控制台中看到相应的消息。\n\
  \  - d. CMS Made Simple 不提供任何免费更新。\n\n## 动手实践 – 配置备份并保持最新\n\n立即为你的网站配置备份。如果出现问题，没有备份你将无法恢复网站。仔细检查你的备份文件是否包含文件和数据库，因为两者都很重要。演练一个紧急情况下的恢复场景，以确保备份没有损坏或不完整。\n\
  \n保持最新状态。登录 CMS Made Simple 官方论坛，并在 **公告** 版块订阅新主题（为了方便，也提供 RSS 源）。\n\n## 总结\n\n\
  在本章中，你学习了许多关于 CMS Made Simple 管理的知识。正如本章开头提到的，你不需要阅读本章的所有部分。但我强烈建议你阅读 *如何保护你的安装*\
  \ 和 *故障排除* 部分。\n\n具体来说，我们涵盖了：\n\n- 如何在紧急情况下备份 CMS Made Simple 网站。你了解到网站由两部分组成：文件和数据库。为这两部分创建备份非常重要。讨论了两种创建备份的方法，即第三方模块和适用于受托管限制用户的手动备份。\n\
  - 如何将网站从一个主机迁移到另一个主机。如果你更换主机提供商，则必须迁移网站。\n- 如何升级 CMS Made Simple 及其模块。我们了解了定期升级系统为何如此重要。你不仅能获得新功能，还能获得改进的性能和安全性。升级系统并跟上\
  \ CMS Made Simple 的发展是你的责任。\n- 如何保护安装安全。有一些有用的提示，教你如何快速保护系统免受黑客攻击、攻击和破坏。请记住，如果你从一开始就花时间学习如何保护网站，那么在网站受到攻击时，它可以为你节省数天甚至数周的恢复时间。\n\
  - 如何在支持论坛中快速获得答案。你获得了一些关于如何从 CMS Made Simple 免费支持论坛获得最佳答案的提示。阅读本节将帮助你在解决安装问题时节省大量时间。\n\
  \n\n\n\n"
