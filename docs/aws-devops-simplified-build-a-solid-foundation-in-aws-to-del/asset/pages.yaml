  md: "# Deploying the network stack\n\nA complete version of the network stack template\
    \ can be found at https://github.com/PacktPublishing/AWS-DevOps-Simplified/blob/main/chapter-4/cfn-templates/network-stack.yml.\n\
    \nFrom the AWS console, let's initiate a new session for our Cloud9 IDE. Once\
    \ logged in, switch to the chapter-4/ resources and trigger a stack deployment\
    \ with the following command:\n\n```\naws cloudformation deploy \\\n  --stack-name\
    \ networking-stack \\\n  --region eu-central-1 \\\n  --parameter-overrides EnvironmentName=aws-devops-simplified\
    \ \\\n  --template-file network-stack.yml\n\nWaiting for changeset to be created..\n\
    Waiting for stack create/update to complete\nSuccessfully created/updated stack\
