- pgno: 66
  md: 'For our needs, we’ll create an IAM user with AdministratorAccess. Let’s look
    at the steps that follow:


    +   1. In the IAM console, select Users in the navigation panel and then click
    Add Users.

    +   2. Enter a username you would like to identify these credentials with. In
    the following section, Specify user details, you can click on the checkbox that
    provides access to the AWS Management Console. Next, set Console password to Autogenerated
    password or type in a Custom password property.

    +   3. Click Next; you will be taken to the Set permissions section, where you
    can attach an existing AWS policy directly. For our requirements, we will choose
    AdministratorAccess and assign it to the user we are creating.

    +   4. Once the user creation process is complete, you can save your User name
    and Console password details, or email the sign-in instructions to an email ID.

    +   5. As a security best practice, let’s go ahead and assign an MFA device to
    this user. You may repeat the MFA steps shown in the Secure your root user credentials
    section or go through the steps provided in the official AWS docs (recommended):
    https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa_enable_virtual.html.


    > Tip

    > Even though we are creating an IAM user here, it’s important to note that this
    is not a practice you should be following in your actual AWS environments. From
    a security standpoint, you should always federate into your AWS accounts via some
    other identity provider (IdP), such as Azure AD, which should act as the authoritative
    source of credential management. Setting up an IdP is outside the scope of this
    book, so for the sake of simplicity, we will proceed with an IAM user. To secure
    its usage, please ensure that you have set up MFA access, as described previously.


    Having created the IAM user for the hands-on exercises in this book, let’s set
    up the customized AWS Cloud9 integrated development environment (IDE) that I have
    prepared for you.


    # Setting up an AWS Cloud9 IDE in your AWS account


    AWS Cloud9 is a cloud-based IDE that allows developers to write, edit, and deploy
    code from within the AWS console. We will be using it to deploy sample code covered
    in various chapters throughout this book.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Note


    Please note that all the hands-on exercises in this book have been tested in the
    AWS Frankfurt (eu-central-1) region, using a t3.medium instance type of the Cloud9
    environment. It''s strongly advised that you use the same region in your AWS console.
    Furthermore, all activities from this point onwards will incur costs in your AWS
    account. A 5hrs/day usage of the t3.medium compute instance costs roughly 7.30
    USD per month, for example. You can reduce these costs further by choosing a low-cost
    instance type, such as t3.small. Furthermore, it is highly recommended that you
    set up billing alarms in your AWS account. For instructions, please refer to https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/monitor_estimated_charges_with_cloudwatch.html.


    You will use a CloudFormation template to perform a one-time installation of the
    IDE in your AWS account. If you have not used CloudFormation in the past, it is
    an AWS service that enables you to provision AWS infrastructure deployments predictably
    and repeatedly. A template is a YAML or JSON formatted file that defines certain
    AWS resources, as code, and deploys them as one group, known as a stack. We will
    dive into the details of the service in Chapter 4, Managing Infrastructure as
    Code with AWS CloudFormation. Let''s proceed with installing the Cloud9 IDE:


    +   1. First and foremost, download the template from this book''s GitHub repository
    onto your local machine: https://github.com/PacktPublishing/AWS-DevOps-Simplified/blob/main/toolbox/cloud9-ide.yaml.

    +   2. In the AWS console, log in with the IAM user we created in the previous
    section, switch to the eu-central-1 region, and search for the CloudFormation
    service in the search panel at the top.

    +   3. Once you are on the service page, click the Create stack dropdown and select
    the With new resources (standard) option.

    +   4. In the Prepare template section, select the Template is ready option.

    +   5. In the subsequent section, Specify template, select Upload a template file
    and upload the file you downloaded in Step 1. Click Next.

    +   6. Enter any stack name that you want. In the Parameters section, you can
    configure certain properties. However, it is recommended that you use the defaults
    unless you are sure about the changes you want to make.

    +   7. Continue clicking Next until you arrive at the final screen, where you
    can click on the checkbox that asks for your acknowledgment to create IAM resources.
    Finally, click Submit – your Cloud9 IDE should be ready in 5-10 minutes.


    Once the CloudFormation stack has been created, you can go to the Cloud9 service
    page to access your newly created environment.'
  merge: -1
  img_proc: true
- pgno: 68
