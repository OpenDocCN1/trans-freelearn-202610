- pgno: 29
  md: 'The framework served the team well for two to three weeks and then the next
    wave of challenges became evident:


    +   - Data import time was increasing exponentially. To execute parallel MySQL
    threads, I needed more compute power – so, another request to the infrastructure
    team was needed.

    +   - High I/O operations required more performant disks. To upgrade these, the
    infrastructure team had to raise a new purchase order and install new SSDs.

    +   - Developers now wanted the capability to be able to maintain the latest X
    versions of the backups. Where should these be stored?


    As you might have noticed already, the framework had matured considerably, but
    it was as good as the availability, scalability, and reliability of the underlying
    infrastructure. With underpowered machines, disk capacity issues, and frequent
    network timeouts, there was only so much the framework could do.


    What started as an initiative to increase development velocity soon transitioned
    into a technology-focused framework. *Were there some technical learnings from
    this exercise?* A lot. In fact, there were so many that I wrote a *Best Practices
    for Bash Scripts* blog afterward, which can be found at https://medium.com/p/17229889774d.
    Did it resolve all the problems the developers were facing? Probably not. Before
    embarking on these lengthy development cycles and going down the rabbit hole of
    solving technical problems, it would have been better to build a little, test
    a little, and always challenge myself with the question, *Is this what my customers
    really need?*


    # Knowing your customers (and their future needs)


    It’s of paramount importance to know the end beneficiary of your work. You will
    always have a *customer* – internal, external, or both. If you are not clear about
    it, I would strongly recommend discussing this with your manager or colleagues
    to understand for whom the solution is being built. It’s essential to put yourself
    in your customer’s shoes and approach the problems and solutions from their perspective.
    Always ask yourself whether what you are doing will address your customers’ issues
    and delight them. It took me at least two or three months to bring the Bash framework
    up to the desired level of performance and utility. However, a Bash script orchestrator
    was not something my customers (developers) required. They needed a simple, scalable,
    and reliable mechanism to reproduce production-like databases. In fact, operating
    this framework was an additional overhead for them. It was not helping them with
    what they did best – writing code and delivering business outcomes.


    # Focusing on iterative development and failing fast


    Another prerequisite for delivering impactful customer solutions is to establish
    an iterative working model: deliver work into manageable pieces, monitor the success
    metrics, and establish a feedback mechanism to validate progress. Applying this
    to the aforementioned situation would have meant that developers had complete
    visibility of the implementation from the beginning. Collaborating together, we
    could have defined the success criteria (time to provision production database
    replicas) at the very start of the process.'
  merge: -1
