- pgno: 64
  md: '# Securing your root user credentials


    As soon as your account is activated, you will receive an email from AWS at your
    registered email address. You can use your browser to log into your newly created
    account using the AWS console sign-in page at https://console.aws.amazon.com/:


    +   1. After a successful login, you will be greeted with the Console Home page
    (Figure 3.2):


    ![](img/ecd265dfca9bb64161408ba8a944a4d9_64_0.png)


    Figure 3.2: AWS Console Home page


    +   2. In the search bar at the top, enter IAM, and then select IAM in the Services
    section. This will lead you to the IAM dashboard, where you can enable multi-factor
    authentication (MFA) for your root user, thereby adding an additional layer of
    security.


    +   3. Under Security Recommendations, you will be prompted to secure the root
    user account with MFA. Choose Add MFA, then Active MFA. You can choose any of
    the listed options (Figure 3.3) as your MFA device. Enterprise companies typically
    use hardware tokens, but the use of virtual devices, or mobile apps such as Authenticator,
    is equally common these days:'
  merge: -1
  img_proc: true
- pgno: 65
  md: <!-- no content -->
