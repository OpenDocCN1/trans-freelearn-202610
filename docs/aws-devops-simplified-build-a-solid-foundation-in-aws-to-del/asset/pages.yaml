- pgno: 259
  md: '# Ensuring a Strong AWS

    Foundation for Multi-Account

    and Multi-Region Environments


    An AWS account is a *logical container* for the AWS resources that you create.
    It provides a structure that can be used to easily manage the access, billing,
    and isolation needs of a group of related resources.


    All organizations start their AWS journey by creating an account and hosting some
    **proof of concept (PoC)** workloads on it. As they gain more experience and know-how,
    their confidence and comfort with cloud services increases. At a certain point,
    the organizations might decide on migrating their on-premises production workloads
    to the cloud. Or, even better, they might directly start developing cloud-native
    applications by leveraging AWS services for maximized innovation.


    There is often a pivoting point where they must decide if all their workloads
    should be hosted in one or multiple AWS accounts. Key drivers behind these discussions
    are the problems associated with a single account. These problems surface when
    the AWS platform’s usage outgrows its initial intent of hosting PoC workloads
    and transitions into a full-grown environment that now requires enterprise-grade
    security, governance controls, cost management, granular access policies, and
    so on.


    However, the nature of these problems could vary across different organizations
    operating at different scales. Some might find it difficult to manage granular
    security policies for multiple users in a single account, while others might struggle
    with boundary enforcement between development and production workloads, for example.
    In addition to the application challenges, there are also service limits and quotas
    that are set by the cloud provider, which could limit the usage of a single AWS
    account beyond certain thresholds. Whatever the reason for the initial conversations,
    all organizations face these challenges once their AWS usage matures and will
    have to adopt a multi-account strategy.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'Enabling software developers to seamlessly onboard their workloads into a dedicated
    AWS account, while *automatically* providing a minimum-security baseline, network
    connectivity, and operations, are some of the key responsibilities of the *platform
    team*, who manages the entire cloud landscape for the organization. These teams
    play a significant role in providing a solid multi-account, multi-region cloud
    foundation – also known as the Landing Zone. Why do we even need a strategy for
    this, you may ask? Think of a scenario where multiple AWS accounts must be created
    to address all the problems we discussed previously. Individually managing a handful
    of accounts is not a problem, but as soon as the count increases to 10s and 100s
    – which is typical for a mid-sized enterprise – you immediately face scaling problems.
    Furthermore, how do you ensure workload compliance within all accounts? How can
    global resources be provisioned (as code) in every account in one go? Is there
    a way for the CISO team to easily validate the security posture of the entire
    AWS landscape? How does the platform team provide telemetry capabilities across
    the entire AWS landscape? How can workloads communicate over the network with
    each other, and on-premises data centers? How can you enforce an organization-wide
    policy that blocks the usage of certain AWS regions and high-cost GPU instances?


    These are a few examples of the challenges that platform teams typically face,
    and how to solve them is going to be the theme of this chapter. We will look at
    the capabilities that AWS offers to simplify the management of these multi-account
    environments via some services and ready-made solutions. Also, the Landing Zone
    is also *managed as code*, just like any other software application. So, all DevOps
    and DevSecOps principles that we have discussed previously, such as IaC, continuous
    testing, and shifting left with regard to security, are equally applicable to
    this concept as well.


    As a DevOps practitioner, whenever you notice organizational complexities associated
    with the usage of a single, or very few, AWS accounts, it might be the right time
    to brainstorm and promote the idea of a well-defined, automation-driven, multi-account
    environment – a Landing Zone. These complexities, if left unaddressed, will directly
    impact the agility of the software teams in seamlessly adopting the AWS offerings.
    Furthermore, it is important to highlight that these concepts are not limited
    to big enterprise companies but are equally relevant for others that are taking
    the first steps toward solidifying their AWS accounts posture for increased agility,
    governance, and control in the cloud.


    We will cover the following topics in the sections that follow:


    +   - What is a Landing Zone?

    +   - Key considerations in a Landing Zone

    +   - Best practices for operating multi-account architectures

    +   - Orchestrating multi-account deployments with Control Tower and CfCT


    # What is a Landing Zone?


    A Landing Zone is the concept of a pre-defined multi-account environment that
    allows you to securely onboard application workloads onto the cloud in an *automated*
    way. A good multi-account foundation reduces the cognitive load of different teams
    and allows the developers to move faster. It either blocks'
  merge: -1
  img_proc: true
