    multiple accounts throughout the organization. This greatly simplifies administrating
    certain tasks such as enabling compliance recording of all AWS resources in an
    account as soon as it is created, for example. Similarly, Security Hub can auto-enroll
    any new account in the organization and start scanning it for security risks.
    To find a list of all AWS services that integrate with AWS Organizations, you
