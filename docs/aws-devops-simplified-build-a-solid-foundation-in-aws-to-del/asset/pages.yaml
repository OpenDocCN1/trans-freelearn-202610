- pgno: 54
  md: '# Accelerating software delivery with platform services


    Platform-as-a-service offerings allow users to focus on managing their applications
    instead of underlying infrastructure. With this support, the developers can be
    more efficient in their work and need not worry about capacity planning and software
    maintenance or patching.


    There are two key services worth mentioning that boost application development.


    # AWS Elastic Beanstalk


    From quickly launching web applications to supporting mobile backend APIs, Elastic
    Beanstalk helps users with end-to-end management of infrastructure and application
    components. Users commit code to a central repository, and the service takes care
    of software delivery, basic networking, and monitoring. This allows for rapid
    expansion and an accelerated go-to-market strategy. It supports a wide range of
    application platforms in several programming languages.


    # AWS Lambda


    AWS Lambda is a compute service that executes code in a completely managed environment.
    With automatic scaling, logging, and operating system maintenance, users can just
    write code and wire together Lambda functions with other AWS services to build
    an application.


    You write your logic as Lambda functions which scale to thousands of requests
    per second. You pay only for the execution time.


    # Fully managed software services


    The final tier offers complete abstraction and just offers SDKs and APIs for users
    to consume the functionality. There is nothing that requires user intervention
    around operations, deployment, or feature development. These services are used
    exclusively for very specific business use cases where re-inventing the wheel
    is not an option.


    # Amazon Chime


    This is a fully managed communication service used by organizations for hosting
    meetings, conferences, and chat sessions. All enterprise use cases such as managed
    policies, SSO access, and persistent communications are offered out of the box.
    Companies that want to build customized experiences can also leverage the SDK
    to build innovative solutions.


    # Amazon WorkMail


    Amazon WorkMail is a secure, enterprise-ready email and calendar service that
    operates on different clients such as Outlook, Android, and iOS applications.
    This can also integrate with existing Active Directory systems.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Summary


    In this chapter, we discussed the three important service tiers offered by cloud
    providers: IaaS, PaaS, and SaaS. We started with a basic understanding of all
    three, discussed the different levels of abstraction they offer, and talked about
    their fitment in specific scenarios. Balancing the needs of the organization,
    its current cloud skills, and its business goals are key to ensuring that the
    right service tier is adopted for a particular software stack or team.


    We then went on to discuss typical cloud operating models that can co-exist in
    any organization. In the context of two real-life scenarios, we discussed how
    software developers leveraged AWS PaaS and IaaS offerings on two separate occasions.
    Sometimes, it also makes sense to adopt a readymade solution to a common problem
    by leveraging SaaS solutions. This helps avoid undifferentiated heavy lifting
    and allows the developers to focus on real customer problems and business use
    cases.


    In the next chapter, we will discuss a mental shift around how we think of infrastructure
    these days and how AWS supports such an approach with evolving application needs.
    Furthermore, we will set up your AWS environment with security best practices
    and go through some real-life hands-on exercises that highlight the benefits of
    infrastructure automation and the idea of disposability.


    # Further reading


    If you are interested in establishing a cloud operating model in your organization
    or want to understand the architectural fundamentals around hosting SaaS offerings
    on AWS, you can learn more about them here:


    +   - https://docs.aws.amazon.com/whitepapers/latest/saas-architecture-fundamentals/saas-architecture-fundamentals.html

    +   - https://docs.aws.amazon.com/whitepapers/latest/building-cloud-operating-model/building-cloud-operating-model.html'
