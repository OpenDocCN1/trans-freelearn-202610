- pgno: 225
  md: '# Security challenges for operating workloads in the cloud


    There are two common blockers that software teams adopting AWS face, or any other
    cloud provider for that matter, when it comes to security.


    # Understanding the security responsibilities in the cloud


    The first thing we need to understand is where exactly the cloud provider’s responsibilities
    end, and yours, as a customer, begin. These responsibilities can further vary
    depending on the type of cloud service tier (IaaS, PaaS, or SaaS) you are using.
    We discussed all three tiers in detail in Chapter 2, Choosing the Right Cloud
    Service. For example, when running your applications in EC2, patching the security
    vulnerabilities or upgrading the AMIs is your responsibility. But the same is
    not true if your code is deployed on Lambda, in which case the security of the
    underlying compute infrastructure sits with AWS. The cloud provider is responsible
    for the security of the cloud, and the customer is responsible for security in
    the cloud. To explain this further, if a hypervisor vulnerability allows another
    AWS user to gain unauthorized access to your EC2 instance, then this is a lapse
    of AWS’ security. On the other hand, misconfigured security groups allowing unrestricted
    SSH access to an EC2 instance in AWS are the customer’s fault. I would recommend
    going through the AWS shared responsibility resource to dig deeper into the details:
    https://aws.amazon.com/compliance/shared-responsibility-model/.


    For software applications, the risks are more or less the same if you are running
    your workload on-premises or in the cloud. However, something that does change
    is the processes and solutions to address those risks. AWS offers several services
    that can help you secure the network, data, and identity and access management.
    Considering our example of an internet-facing web application, you could transfer
    your risks of managing a self-hosted load balancer to AWS Elastic Load Balancer
    with web application firewall integrations. Extracting the frontend API logic
    from the code base and migrating to API Gateway transfers your risks to the cloud
    provider, and modernizing a traditional static website and hosting it on CloudFront
    with no servers to manage eliminates your risks. So, it’s important to understand
    what exactly needs to be secured.


    Once the responsibilities have been clarified, the second problem teams run into
    is how to manage their risks.


    # Identifying and prioritizing the risks


    Software teams often begin by securing parts of the application architecture that
    they are most familiar with. This can sometimes hide other risks, potentially
    with a higher probability of occurrence. A good way to understand (or raise Awareness,
    as defined in the AEA framework) your risk exposures is to begin with a threat
    modeling process.


    Threat modeling is an assessment that outlines the risks that currently deployed
    resources are exposed to, and what their priorities are based on respective criticalities.
    With the evolution of application architecture, these risks will also keep on
    changing, and so should the mitigations. Threat modeling'
  merge: -1
  img_proc: true
