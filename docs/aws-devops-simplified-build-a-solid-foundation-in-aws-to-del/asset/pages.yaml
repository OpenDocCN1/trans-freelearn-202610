  md: "Modifying any of these attributes, such as ImageId or ami, will result in an\
    \ instance upgrade, but this is entirely handled by the respective tools, while\
    \ the user just focuses on defining the target state of the infrastructure.\n\n\
    # Using infrastructure definition generators\n\nUnlike service-native configuration\
    \ languages, there is a different segment of tools that offer the flexibility\
    \ to use regular programming languages, such as Python or Golang, to generate\
    \ AWS CloudFormation templates. These are beneficial when organizations have a\
    \ high maturity and comfort level with specific programming languages.\n\nTools\
    \ such as Troposphere and GoFormation are well-known in this space and can dynamically\
    \ generate ready-to-use CloudFormation templates based on the code written by\
    \ the user.\n\nLet's see how we could define a configuration with Troposphere:\n\
    \n```\n>>> from troposphere import Ref, Template\n>>> import troposphere.ec2 as\
    \ ec2\n>>> t = Template()\n>>> instance = ec2.Instance(\"myinstance\")\n>>> instance.ImageId\
    \ = \"ami-951945d0\"\n>>> instance.InstanceType = \"t1.micro\"\n>>> t.add_resource(instance)\n\
    <troposphere.ec2.Instance object at 0x101bf3390>\n>>> print(t.to_json())\n{\n\
    \    \"Resources\": {\n        \"myinstance\": {\n            \"Properties\":\
    \ {\n                \"ImageId\": \"ami-951945d0\",\n                \"InstanceType\"\
    : \"t1.micro\"\n            },\n            \"Type\": \"AWS::EC2::Instance\"\n\
    \        }\n    }\n}\n>>> print(t.to_yaml())\nResources:\n  myinstance:\n    Properties:\n\
    \      ImageId: ami-951945d0\n      InstanceType: t1.micro\n    Type: AWS::EC2::Instance\n\
    ```"
