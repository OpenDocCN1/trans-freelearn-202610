  md: '# Overview of the target architecture


    Before we dive into the code-level changes, let''s get a visual understanding
    of the components we plan to add around our test application stack, and how they
    communicate with each other. We will focus on capabilities that help us monitor
    the application logs and metrics on tools of our choice.


    We will extend our existing application architecture with the following components
    to capture and display observability data:


    +   - **CloudWatch Logs**: Amazon ECS offers integrations with several logging
    platforms, with CloudWatch being one of them. We can make use of CloudWatch Logs
    to ingest all data written on STDOUT of our application containers running in
    ECS.


    +   - **Amazon Managed Prometheus**: The biggest challenge with Prometheus installations
    is data retention and dynamically scaling the storage infrastructure as the rate
    of metrics ingestion increases. Similar to the benefits offered by other AWS services,
    we would like to offload the maintenance of the Prometheus server and related
    storage to the cloud provider. AWS simply offers us a data ingestion endpoint
    that can be used by applications to push metrics data to the platform.


    +   - **Amazon Managed Grafana**: To visualize the metrics captured by Prometheus,
    we will use Grafana as our dashboarding solution. AWS offers us the same experience
    we would get by running a Grafana open source solution. The additional benefits
    are the readymade integrations around AWS data sources and configurations that
    come out of the box when using the service offered by AWS.


    +   - **OpenTelemetry Collector**: A common deployment pattern for using third-party
    tools in containerized environments is to deploy them as a sidecar. In our case,
    we will be deploying an OpenTelemetry collector from AWS, in the same ECS task
    definition that hosts the web application and MongoDB container. This will allow
    the collector agent to scrape metrics information from the application container
    on the `/metrics` endpoint.


    All these components and the corresponding information flows are highlighted in
    Figure 8.3. In this case, the Flask-based web application forwards logs to the
    CloudWatch Logs service. The application metrics are scraped by the OpenTelemetry
    sidecar container and then forwarded to the Amazon Managed Prometheus (AMP) service.
    Finally, we configure Amazon Managed Grafana to query data from both these sources
    and display it in a centralized dashboard:'
