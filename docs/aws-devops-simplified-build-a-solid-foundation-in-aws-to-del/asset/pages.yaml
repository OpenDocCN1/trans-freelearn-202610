- pgno: 250
  md: 'A CoP is a group of people within the organization that share a concern or
    passion for something. They meet regularly to collaborate and learn from each
    other. These communities might have multiple dimensions of purpose; sometimes,
    helping other communities with everyday work needs, sharing best practices and
    guidelines for the organization, or fostering breakthrough innovations and new
    practices. As shown in Figure 10.2, a CoP is an overlapping structure that spawns
    multiple teams in the company and gets everyone with similar interests together
    in a room:


    ![](img/ecd265dfca9bb64161408ba8a944a4d9_250_0.png)


    Organizations typically plan these collaborative working sessions at least once
    a week, when undergoing major transformations. In later stages, they might want
    to revisit the cadence by further reducing or increasing it, depending on the
    value that the teams are driving from the setup.


    # Measuring the DevOps maturity of your teams


    An important prerequisite to improving something is to start measuring it. The
    same applies to the DevOps maturity of your teams. It is essential to identify
    the areas of improvement, understand progress, and track the effectiveness of
    any process or change rolled out as part of DevOps practices in your organization.
    But what exactly needs to be measured, you may ask?


    **Accelerate 2022 State of DevOps Report** (Ref: `https://services.google.com/fh/files/misc/2022_state_of_devops_report.pdf`)
    mentions two clusters of analysis, one targeted toward *software delivery performance*,
    and the other toward *operational performance*. These reports are based on inputs
    from more than 33k respondents from different organizations. *Figure 10.3* highlights
    the four key metrics in the software delivery performance category that will help
    you quantify your team’s current performance and measure it against the industry
    benchmark:'
  merge: -1
  img_proc: true
- pgno: 251
  md: '| Software delivery performance metric | Low | Medium | High |

    |---|---|---|---|

    | **Deployment frequency**<br>For the primary application or service you work
    on, how often does your organization deploy code to production or release it to
    end users? | Between once per month and once every 6 months | Between once per
    week and once per month | On-demand (multiple deploys per day) |

    | **Lead time for changes**<br>For the primary application or service you work
    on, what is your lead time for changes (i.e., how long does it take to go from
    code committed to code successfully running in production)? | Between one month
    and six months | Between one week and one month | Between one day and one week
    |

    | **Time to restore service**<br>For the primary application or service you work
    on, how long does it generally take to restore service when a service incident
    or a defect that impacts users occurs (e.g., unplanned outage or service impairment)?
    | Between one week and one month | Between one day and one week | Less than one
    day |

    | **Change failure rate**<br>For the primary application or service you work on,
    what percentage of changes to production or released to users result in degraded
    service (e.g., lead to service impairment or service outage) and subsequently
    require remediation (e.g., require a hotfix, rollback, fix forward, patch)? |
    46%-60% | 16%-30% | 0%-15% |


    Figure 10.3 – Four metrics to measure software delivery performance


    (source: Accelerate 2022 State of DevOps report)


    It gives you an idea of how other companies are doing and if you’d like to aim
    higher by improving your current standings in any way.


    However, all of this needs to be discussed and planned against the real needs
    of your application and the expectations of the end customers. So, context matters.
    Not all teams and applications require 10 deployments per day, but if they do,
    it’s necessary to make sure that your release process support it.


    The same report further describes a second clustering approach that accumulates
    the metrics from software delivery performance and sprinkles the reliability aspect
    on top of it. A holistic view of all these areas gives a representation of the
    current state of the workloads that you are managing, resulting in four different
    categorizations:


    +   - Starting

    +   - Flowing

    +   - Slowing

    +   - Retiring'
