    \ $\naws cloudformation deploy \\\n    --stack-name aws-devops-simplified-network-stack\
    \ \\\n    --template-file ./network-stack.yml \\\n    --parameter-overrides EnvironmentName=aws-devops-simplified\
    \ \\\n    --region eu-central-1\nWaiting for changeset to be created..\nWaiting\
    \ for stack create/update to complete\nSuccessfully created/updated stack - aws-devops-simplified-network-stack\n\
    ```\n\n2. Then, we can pass the stack's name and AMI Id while deploying the application\
    \ stack. Please note that certain resource identifiers, such as Amazon Machine\
    \ Image (AMI) IDs, can only be referenced in a particular region. In this case,\
    \ we have used ami-09cadf1c312a9b12e, which is available in the eu-central-1 region.\
    \ So, you should use the same region when running these commands:\n\n```\naws-devops-simplified:~/environment/chapter-5/cfn-templates\
    \ $\naws cloudformation deploy \\\n    --stack-name aws-devops-simplified-application-stack\
    \ \\\n    --template-file ./application-stack.yml \\\n    --parameter-overrides\
    \ NetworkStackName=aws-devops-simplified-network-stack AMIId=ami-09cadf1c312a9b12e\
    \ \\\n    --capabilities CAPABILITY_NAMED_IAM \\\n    --region eu-central-1\n\
    Waiting for changeset to be created..\nWaiting for stack create/update to complete\n\
