- pgno: 271
  md: 'Even before IaC deploys something into the account, certain prerequisites must
    be met. After the accounts are provisioned, you might need some post-installation
    procedures to be carried out, which might deal with notifications, ticket closures,
    or anything else. This is where the concept of an Account Vending Machine (AVM)
    comes in. It takes care of these two requirements and acts as a glue between the
    organization processes, actual IaC itself, and the stages in the life cycle of
    AWS account management. Its core responsibility is to vend accounts as if they
    are coming out of a factory and immediately ready to host production-grade workloads.
    Let’s see an example.


    Enterprises typically have ticketing processes or some other mechanisms using
    which AWS accounts are requested and approved. Some examples are ServiceNow, Jira,
    or a home-grown custom solution. Once the requests are in, you will want an event-driven
    invocation of the AVM, which you can do by passing a payload that reflects the
    input from the ticketing system. The AVM then manages the life cycle of the account
    creation process, starting with ensuring that prerequisites are in place, deploying
    resources via the IaC stack, and finally carrying out post-deployment procedures.


    # Maintain a separate AWS Organizations organization for platform development


    Similar to software development life cycles, it’s important to test new Landing
    Zone features and changes in an isolated environment first, and then roll them
    out in the production AWS organization. Small changes such as SCP modifications,
    network route configurations, and security policy upgrades can have a big impact
    with multiple accounts being affected all at once. Misconfiguring CloudTrail S3
    buckets, for example, can result in log and audit data not being aggregated as
    expected, resulting in the loss of valuable information.


    Developing the overall platform in the same AWS organization that hosts production
    workloads increases the blast radius by a great deal. AWS accounts are free resources,
    so there isn’t a huge cost impact for replicating a similar structure to what
    you have in production. To further limit any additional spending in the development
    environment, it’s a good practice to set up billing alerts and remove all the
    resources across the entire organization using IaC automation when not needed,
    after office hours or during weekends. It’s a common practice to empty all the
    accounts using tools such as aws-nuke (https://github.com/rebuy-de/aws-nuke).
    This validates the functionality and repeatability of the IaC framework so that
    it can spin up the entire platform from scratch, should the need arise, such as
    in the event of a disaster.


    # Avoid provisioning any IAM users


    The single most frequent source of credential leaks is AWS IAM access keys, which
    can be accidentally committed into source code or left in an EC2 instance that
    is no longer used. You should always aim to leverage IAM roles for any access
    requirements in the AWS Landing Zone. It’s a security best practice to deny the
    creation of IAM users in all AWS accounts in your Landing Zone. Technically, all
    AWS identities, be it users, services, or resources themselves, can assume an
    IAM role and request temporary credentials at the time of use, from the IAM control
    plane. EC2 instances have the concept'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'of an instance profile, and services such as Lambda and RDS use service roles,
    which gives them access to the allowed resources.


    The majority of enterprises already have some form of IdP solution in use in the
    organization. AWS IAM supports out-of-the-box integration with such providers
    through **OIDC** or **Security Assertion Markup Language (SAML)**, which removes
    the need to provision and manage any users throughout the organization. IAM federation
    further prevents credential sprawl and any employees that are offboarded from
    the authoritative identity source, such as Active Directory, automatically lose
    access to all AWS accounts, which is a good security win.


    # Prefer no-code or low-code solutions


    A lot of integrations that previously had to be built out manually are now natively
    supported by many AWS services. While this greatly improves the development velocity,
    it also leads to less maintenance of code and an increase in efficiency. Landing
    Zone implementations heavily depend on services such as **AWS Step Functions,
    AWS Organizations, Lambda, and IAM**, to name a few. In recent times, AWS Step
    Functions, a workflow management service, has launched native integrations with
    AWS Organizations, Lambda, and many other services. So, an action such as moving
    an account to a different OU, which previously required a Lambda function to assume
    a role in the management account, can now directly be executed by AWS Step Functions,
    without you having to write any code.


    Sending out platform notifications is another example where the developers had
    to leverage a combination of services such as Lambda, events, SNS, or SES. With
    **AWS User Notifications**, you can leverage automatic notifications for selected
    **EventBridge** events, and the entire responsibility of event capturing, payload
    parsing, and notification triggers are offloaded to the service. It sends out
    notifications on multiple channels, such as **Microsoft Teams, Slack, and Email**.


    Having discussed a few best practices when building out your Landing Zone foundations,
    let’s discuss what this looks like in practice when combining a service such as
    AWS Control Tower with CfCT, an AWS-offered solution for deploying resources across
    multiple accounts.


    # Building a Landing Zone with Control Tower and CfCT


    AWS Control Tower gives users a jumpstart in establishing their Landing Zone foundations,
    in contrast to building everything from scratch. Starting from a basic OU structure
    to host the security and workload accounts, it offers an *account factory* – an
    abstraction on top of **Service Catalog** that is used to create new accounts
    and provision resources in them. From a logging and security standpoint, it automatically
    rolls out organizational trails with AWS CloudTrail and also aggregates the compliance
    status by leveraging AWS Config’s features. At its core, it *orchestrates* account-related
    activities across several other AWS services to realize the benefits of a multi-account
    structure. Furthermore, it defines a security and compliance baseline that is
    composed of AWS Config rules, IAM policies, and SCPs. These sane defaults block
    actions such as making an S3 bucket public, disabling CloudTrail logs, or switching
    off Config recorder logs, thereby ensuring a good security posture out of the
    box.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'For enterprises that are just getting started with building their AWS foundations,
    AWS Control Tower does a lot of heavy lifting for them and reduces the implementation
    effort and time. Others, who are more hands-on and well-versed with the AWS technology
    stack, might still decide to go ahead and build a customized version of the Landing
    Zone as it gives them more control and choice of tooling. This is because, as
    a service, Control Tower on its own doesn’t do much. It’s based on the best practices
    that most customers follow when establishing a cloud structure that can be safely
    used to launch applications with the least resistance and delays. For account
    management, it depends on AWS Organizations, for policies, it depends on SCPs,
    and for compliance, it depends on AWS Config; deploying resources in target accounts
    is entirely offloaded to CloudFormation. To benefit from the readymade prescriptive
    foundation that it offers, it is still a good idea to use it for that and fill
    the gaps with another deployment solution or framework that complements it.


    At the time of writing this book, there are also some areas where the service
    doesn’t shine as much. Due to its lack of API support, I would suggest exercising
    caution before building any hard dependencies on the service for features that
    require frequent invocations. Carrying out actions over the web console simply
    does not scale, and you need to give someone access to the management account
    (the service can only be deployed there), which is not desirable. It’s important
    to highlight that the service operations are single-threaded, which means they
    can only work on one thing at a time. This limit does not exist for some features,
    such as account requests, where you can go up to a maximum of five, but these
    limitations can be a blocker for some organizations that are going to provision
    and manage accounts at scale.


    Therefore, my advice for companies who are just getting started with their AWS
    foundation would be to leverage the service for what it offers, and let it play
    its role in the bigger Landing Zone arena. You will need a complementing solution
    or framework to implement other functionalities that are not bundled as part of
    the service. For companies that have an existing Landing Zone, or framework that
    works with IaC, I see less value in switching over to Control Tower. The latter
    is more specific to companies that are comfortable getting hands-on and maintaining
    such solutions at scale on their own. Due to the variety of implementation options
    here, it’s out of this chapter’s scope to cover all possible implementation scenarios.
    In the following sections, we will focus more on using Control Tower alongside
    another framework of your choice to build an end-to-end Landing Zone platform.


    Before we get to the topic of integrating a deployment solution or framework,
