- pgno: 120
  md: '# Accessing private VPC resources


    By default, you cannot access your VPC resources when running CodeBuild projects.
    However, if required, the service can be configured to run the build environments
    within your designated VPCs and subnets. This allows it to access your private
    resources in the cloud or on-premises. This unlocks a lot of possibilities as
    you can run integration tests against resources that are privately available and
    not be worried about exposing anything over the internet.


    # Using CodeDeploy to orchestrate deployment workflows

    in compute environments


    Software deployments could mean different things for different technology stacks.
    For Python-based applications, it could mean placing the scripts at a specific
    location, and for Java web apps, it could mean deploying WAR (**web application
    archive**) files on **Tomcat**. Whatever the requirement, CodeDeploy can help
    you deploy different compute environments. You can manage your deployments on
    servers (EC2/on-premises), **Elastic Container Service (ECS)**, or even Lambda’s
    serverless platform.


    Like CodeBuild, CodeDeploy depends on a manifest file, known as appspec.yml (which
    can also be JSON formatted). This file contains all the steps CodeDeploy needs
    to manage your application deployments. On EC2 instances or on-premises servers,
    this task is delegated to an agent that is already running alongside your application.
    With ECS and Lambda, the service directly speaks to the respective control plane
    to roll out application changes. When it comes to deployments, DevOps methodologies
    advocate the adoption of different strategies such as **blue-green** or **canary**
    to minimize risk. These capabilities are **natively supported** by CodeDeploy,
    making the overall process of introducing change much safer.


    To make deployments happen, CodeDeploy uses several components that describe what
    to deploy, where to deploy, and how to deploy. Let’s see what they are and how
    they work.


    # Key components in CodeDeploy


    It is important to be clear about the major components and the role they play
    before you start using the service.


    # Application – logical container for all configurations


    An application in CodeDeploy wires all the configuration details together. As
    its name suggests, it identifies the application that is being deployed. When
    you reference an application’s name in the deployment, it selects the right combination
    of deployment group, configuration, and type.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Deployment group – where to deploy stuff


    Deployment groups identify the targets where application artifacts are placed.
    In our hands-on exercise, we will be working with EC2 instances hosted in an Auto
    Scaling group. This group of instances is clubbed together and called a deployment
    group. The actions that you define in the deployment configuration are performed
    on these servers.


    # Deployment configurations – fine-tune your deployment settings


    You might want to shift all traffic to the new Lambda function in one go, or maybe
    you want to do it in increments. You may also want to wait for X minutes before
    shifting the traffic to new deployments. Fine-tuning such settings is a function
    of deployment configurations. With health checks, you can instruct the service
    to only proceed further when a minimum threshold of healthy instances is ensured.
    These settings make rolling out and rolling back the change very reliable.


    # Deployment type – a strategy for rolling out change


    CodeDeploy primarily supports two different deployment types: in-place and blue-green.
    This controls the approach that is used to roll out application changes inside
    the deployment group. Depending on which approach you choose, CodeDeploy interacts
    with additional services on your behalf to achieve the desired deployment state.


    Next, let’s walk through some features that make it a valuable choice for software
    deployments in the cloud.


    # Key features offered by CodeDeploy


    In addition to regular code deployment capabilities, the service offers great
    flexibility around third-party integrations and adjusts quite well to your CI/CD
    pipeline needs. Just like CodeBuild, CodeDeploy can also operate in isolation
    by directly consuming build artifacts from supported sources – S3 and GitHub.


    # Integrations with EC2 Auto Scaling and Elastic Load Balancing


    If you’re working with EC2 Auto Scaling or ELBs, CodeDeploy can natively integrate
    with those services to roll out applications in a controlled manner. In a blue-green
    deployment scenario, CodeDeploy ensures that your Auto Scaling configurations
    are copied over to a new group, provisions the instances, deploys code, and registers
    them with the load balancer to serve traffic, after your deployments pass the
    validation tests. It can retain your previous set of instances, gradually scale
    them down, or immediately delete them for additional cost savings. Imagine building
    all the orchestration around these services on your own. You could use other agent-based
    configuration systems to manage similar deployments, but the native integration
    is something that is a big gain that comes with a low effort.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Support for life cycle hooks that map to different phases of software change


    With support for several life cycle hooks, you can pin down the actions that you
    want to take when you reach a particular stage of the rollout process. This could
    be BeforeInstall, AfterInstall, upon ApplicationStart, or during ValidateService,
    among several others. Depending on the chosen compute platform, you can choose
    and implement all the hooks that you would like to automate against. For example,
    BeforeInstall could be used to send a Slack notification to your developers, stating
    that they should expect a change rollout soon. We will see some of these hooks
    in action during the hands-on exercises.


    # Monitoring events with CloudWatch


    Depending on the type of event, you can build automation workflows to take some
    action when something expected or unexpected happens to your deployments. By creating
    rules for relevant EventBridge events, you can add triggers such as Lambda functions
    or forward the event payload to Kinesis streams for further processing. This allows
    you to create event-based workflows with fully managed AWS services, which makes
    the overall operations process very reliable.


    # AWS Systems Manager support for agent installation


    You can make the agent available inside your compute instances in two ways – either
    bake it right into your AMI image during the build process or install it with
    the AWS Systems Manager service. The second approach has additional benefits since
    you always have the most recent version of the agent installed, and secondly,
    you don’t need to open ingress network traffic flows for your instances. With
    Systems Manager, it is more of a pull-based mechanism, where your instance can
    automatically get the agent file and deploy it. Once the agent is up and running,
    it’s available to respond to build commands from the service control plane.


    At this point, we can discuss the AWS service that brings all the others together
    and offers a systematic workflow mechanism to the end user – **CodePipeline**.


    # Implementing end-to-end software delivery with

    CodePipeline


    CodePipeline is a continuous software delivery service that can be used to design,
    operate, and automate all the stages of your software processes – that is, developing
    code, building and testing the artifacts, and performing the final rollout in
    productive environments. The entire sequence of activities is orchestrated by
    this service. It shares artifacts from one service to the other, checks their
    execution status, integrates with external tooling, and introduces a visual model
    around the steps you take to make the code available to the end user. However,
    you need to know about a few constructs when working with this service.'
