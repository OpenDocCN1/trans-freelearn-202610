  img_proc: true
- pgno: 139
  md: "AWS offers ready-made cloud blocks such as default VPCs, which allow users\
    \ to get started in their AWS account.\n\n# Automating infrastructure rollouts\
    \ with scripts\n\nOnce users are comfortable with AWS services and the idea of\
    \ bundling multiple of those together to solve a business use case, they start\
    \ using CLI commands and AWS SDKs to trigger some actions from their Terminal.\
    \ If these follow a particular sequence, it also makes sense to tie them up with\
    \ Bash scripts, for example. These scripts can then also be used in automated\
    \ software delivery pipelines using tools such as Jenkins and AWS CodeBuild.\n\
    \n# Adopting a declarative approach\n\nOnce the needs grow beyond basic scripting\
    \ solutions, organizations typically take the next steps with more advanced services\
    \ such as CloudFormation and Terraform. In some cases, they might even adopt these\
    \ services directly, depending on the existing experience and knowledge within\
    \ the company.\n\nThese services offer a declarative approach to infrastructure\
    \ definition, where the user defines a *target state* of their AWS accounts. The\
    \ tools then leverage the underlying service APIs to make this declared state\
    \ a reality. Reaching this target state requires a lot of magic behind the scenes\
    \ in terms of state management, resolving update conflicts, dependency resolutions,\
    \ and so on. All of these are abstracted from the end user.\n\nTo get started\
    \ with these tools, the users need to ramp up on respective configuration languages\
    \ and template structures. It’s important to note that these services don’t go\
    \ beyond what is put in the template files. So, the user still needs to define\
    \ all the components of the architecture at the most granular level and tie them\
    \ up so that they work together as a solution.\n\nThe following are two configuration\
    \ examples of defining an EC2 instance in a declarative way:\n\n+   - With Terraform:\n\
    \n```\n```hcl\nresource \"aws_instance\" \"web\" {\n  ami           = \"ami-a1b2c3d4\"\
    \n  instance_type = \"t3.micro\"\n}\n```\n```\n\n+   - With CloudFormation:\n\n\
    ```\n```yaml\nEC2Instance:\n  Type: AWS::EC2::Instance\n  Properties:\n    ImageId:\
    \ \"ami-a1b2c3d4\"\n    InstanceType: t3.micro\n```\n```"
