  md: "# Deploying infrastructure and application stacks\n\nBefore we can deploy pipeline\
    \ resources, we need to have the underlying infrastructure and application components\
    \ available. This is mainly to ensure that inter-stack dependencies are met so\
    \ that the pipeline stack to be deployed successfully:\n\n1. From within the IDE,\
