- pgno: 105
  md: "I would like to highlight the use of two intrinsic functions that were referenced\
    \ in this template:\n\n+   - Importing stack outputs from a different deployment:\n\
    +     Fn::ImportValue, as its name suggests, is used to import the outputs from\
    \ another stack. We used the aws cloudformation list-exports command to list the\
    \ exports from the network stack. The same values are referenced here, using this\
    \ function. This is how CloudFormation allows you to resolve inter-stack dependencies\
    \ while keeping the templates modular, and teams agile.\n+   - Substituting data\
    \ for generating configurations at runtime:\n+     Not all configurations can\
    \ be statically defined in the templates. As seen in this example, the network\
    \ stack could have been named in different ways. To keep the template definition\
    \ flexible, we substituted the value of the respective parameter to form a well-defined\
    \ string. Eventually, this allows us to import the required value from another\
    \ stack.\n\n# ALB listeners and target groups\n\nTo make the ALB understand the\
    \ type of traffic it is handling, we can use the concept of listeners. They identify\
    \ the protocol, port, and actions to take when packets are received. Listeners\
    \ also map to a target group, which is where the matching traffic needs to be\
    \ forwarded:\n\n```\nParameters:\n...\n  NetworkStackName:\n    Description: Identifies\
    \ the name of the network stack.\n    Type: String\n...\nResources:\n...\n  AppLoadBalancerListener:\n\
    \  Type: AWS::ElasticLoadBalancingV2::Listener\n  DependsOn: AppLoadBalancer\n\
    \  Properties:\n    Protocol: HTTP\n    Port: 80\n    LoadBalancerArn: !Ref AppLoadBalancer\n\
    \    DefaultActions:\n      - Type: forward\n        TargetGroupArn: !Ref InstanceTargetGroup\n\
    \n  InstanceTargetGroup:\n  Type: AWS::ElasticLoadBalancingV2::TargetGroup\n \
    \ Properties:\n    HealthCheckEnabled: true\n```"
  merge: -1
  img_proc: true
- pgno: 106
  md: "```\nTargetType: instance\nProtocol: HTTP\nPort: 8080\nVpcId:\n  Fn::ImportValue:\n\
    \    'Fn::Sub': \"${NetworkStackName}-vpc-id\"\n...\n```\n\nTarget groups are\
    \ the entities where EC2 instances are registered by the Auto Scaling groups.\
    \ We are using the !Ref keyword here to reference other resources within the same\
    \ template.\n\nAll CloudFormation resources have a specific return value. It could\
    \ be an ARN, ID, name, or something else. When authoring templates, you need to\
    \ validate these details in the respective docs’ sections. If you need to extract\
    \ a value other than the default, CloudFormation offers a Fn::GetAtt function,\
    \ which can help you extract a specific attribute.\n\n# Auto Scaling groups and\
    \ launch templates\n\nThese are the components that are responsible for configuring\
    \ and maintaining the compute fleet at any given point. Auto Scaling groups define\
    \ a minimum, maximum, and desired number of instances in the compute fleet. It\
    \ also maps to a target group, where instances can be deployed.\n\nThe configurations\
