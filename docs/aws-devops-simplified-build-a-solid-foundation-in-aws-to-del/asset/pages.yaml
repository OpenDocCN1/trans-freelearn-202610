- pgno: 16
  md: 'You will learn how to select the optimal AWS service tiers, foster cultural
    shifts with DevOps, set up teams for success, and explore AWS offerings that help
    derive technical metrics from business KPIs as well as measure them.


    +   - **Software developers and operations specialists**: The book covers essential
    AWS services to reliably host your software in the cloud and deploy changes in
    an iterative manner, across multiple AWS accounts and Regions. You will get hands-on
    with ready-to-use solutions focusing on containers, infrastructure automation,
    DevSecOps, and observability. You will learn by doing, and evolve solutions to
    meet personal or organizational needs.


    +   - **DevOps practitioners delving into the AWS world**: The book covers vital
    AWS services and how they synergize with key DevOps and DevSecOps practices in
    modern software development. You will dive into the cultural aspects and foundations
    of team structures that help maintain the same level of agility in the cloud.


    # What this book covers


    *Chapter 1, Accelerating Your DevOps Journey with AWS,* emphasizes the importance
    of digital transformation and how DevOps and AWS play a role in this transition.
    With two examples from the author''s own experience, the chapter covers key learnings
    from each instance and focuses on the need for customer-centricity and prioritizing
    business outcomes over technology.


    *Chapter 2, Choosing the Right Cloud Service,* covers the three service tiers
    offered by AWS: IaaS, PaaS, and SaaS. Starting with a basic understanding of all
    three, it delves into the trade-offs between simplicity and control, and the application
    of these tiers in specific organizational situations. With two real-life examples,
    it covers the benefits that software teams reap by adopting one of the tiers.


    *Chapter 3, Leveraging Immutable Infrastructure in the Cloud,* highlights the
    importance of infrastructure immutability in the AWS realm and demonstrates how
    to boost software reliability with a hands-on deployment covering HashiCorp''s
    Packer tool. Most importantly, this chapter unveils an AWS Cloud9 IDE-based toolbox
    to deploy the hands-on exercises covered throughout the book and serves as an
    introduction to AWS for new users while learning about security best practices.


    *Chapter 4, Managing Infrastructure as Code with AWS CloudFormation,* delves into
    the benefits of **infrastructure as code (IaC)** automation using AWS CloudFormation.
    After explaining key service constructs, the chapter moves on to good enterprise
    design strategies for IaC and compares the service with Terraform, another famous
    infrastructure automation tool from HashiCorp.


    *Chapter 5, Rolling Out a CI/CD Pipeline,* lays the foundations for a robust software
    delivery life cycle backed by **Continuous Integration and Continuous Delivery
    (CI/CD)** practices. It covers typical enterprise challenges in adopting continuous
    deployment methodologies and suggests some strategies to solve them. Before concluding
    with a fully automated application delivery pipeline deployment, the chapter covers
    the integrations offered by all AWS services in the CI/CD space and how to leverage
    them for maximized benefits.'
  merge: -1
  img_proc: true
