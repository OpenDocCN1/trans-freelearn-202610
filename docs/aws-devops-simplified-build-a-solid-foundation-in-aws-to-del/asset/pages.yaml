- pgno: 177
  md: "# Networking foundations and the ECS cluster\n\nA common starting point for\
    \ all infrastructure stack definitions is to create a VPC, subnets, and corresponding\
    \ route tables. You will also need to set up an internet gateway for the VPC and\
    \ a NAT gateway in each of the public subnets to enable packet traversals over\
    \ the internet:\n\n```\nimport { Vpc, SubnetType} from 'aws-cdk-lib/aws-ec2';\n\
    ...\nconst customVPC = new Vpc(this, 'CustomVPC', {\n  cidr: '10.0.0.0/16',\n\
    \  maxAzs: 2,\n  subnetConfiguration: [\n    {\n      subnetType: SubnetType.PRIVATE_WITH_EGRESS,\n\
    \      name: 'privateSubnet',\n      cidrMask: 24,\n    },\n    {\n      subnetType:\
    \ SubnetType.PUBLIC,\n      name: 'publicSubnet',\n      cidrMask: 24,\n    }\n\
    \  ],\n  natGateways: 2\n})\n```\n\nAfter adding the VPC resources, we are all\
    \ set to define our ECS cluster and link it to this custom VPC:\n\n```\nimport\
    \ * as ecs from 'aws-cdk-lib/aws-ecs';\n...\nconst ecsCluster = new ecs.Cluster(this,\
    \ 'ECSCluster', {\n  vpc: customVPC,\n  clusterName: \"aws-devops-simplified\"\
    ,\n})\n...\n```\n\nThese simple constructs abstract a lot of complexity from the\
    \ user. If you perform cdk synth at this point, you will appreciate the heavy\
    \ lifting that goes on behind the scenes in generating the CloudFormation template\
    \ for this stack.\n\nNow that the cluster is ready, it’s time to define the task\
    \ definition that will host both of our containers."
