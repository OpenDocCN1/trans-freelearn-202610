  md: 'the build instructions, runs all the validations that have been defined, and
    reports the outcomes (success/failure) back to the orchestrator – CodePipeline.


    +   4. Upon receiving a successful status from the build stage, CodePipeline picks
    up the output artifacts. which in this case are the validated templates and code.
    It then forwards them to CodeDeploy, which serves as its input for the following
    steps in the process.


    +   5. CodeDeploy makes use of the appspec.yml file to understand the deployment
    steps. Depending on the deployment configuration, it coordinates code rollout
    activities in the deployment group (two EC2 instances). CodePipeline tracks the
    output of the respective CodeDeploy deployment and upon receiving a success signal,
    marks the pipeline as completed.


    +   6. Finally, the new code modifications are deployed to the underlying EC2
    instances. Application consumers, or the end users, can now use the application
    by accessing the load balancer’s URL.


    > **Note**

    > For a brief duration, you might notice different code versions running in parallel,
    across different EC2 instances. This is because we do a phased deployment rollout
    with CodeDeploy. This results in ALB returning different responses while the deployment
    is mid-way through.


    Let’s start with the first step of our deployment, which is to create a new AMI
