    systems* for a particular request, and identify if something didn’t go as expected.
    These traces are also valuable input for service maps as they can be used to visually
    depict the dependencies each service has and some problematic areas.


    AWS’s Swiss-army knife solution for all observability needs is **Amazon CloudWatch**.
    CloudWatch can be used for a variety of customer needs to continuously monitor
