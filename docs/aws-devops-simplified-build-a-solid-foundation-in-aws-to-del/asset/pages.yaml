  md: "The overall workflow is highlighted in *Figure 5.2:*\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_126_0.png)\n\
    \nFigure 5.2 – Software delivery process highlighting the important phases\n\n\
    The following are the individual steps you must take, starting from writing code\
