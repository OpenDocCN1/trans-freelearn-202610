- pgno: 279
  md: '# 12

    Adhering to AWS

    Well-Architected Principles


    Back in 2012, one of the famous **Amazon Web Services (AWS)** services—Amazon
    **Elastic Block Store (EBS)**—had an outage that affected the workloads of many
    customers. Interestingly, though, the impact was negligible, or not seen at all
    by a few customers. This clearly meant that in addition to the capabilities provided
    by the cloud provider, the *usage pattern* of those services played an important
    role in the stability of customers’ workloads. Deeper investigations surfaced
    some architectural patterns that a few AWS customers had been following. This,
    combined with the data and analysis from AWS, led to the formation of **AWS Well-Architected**.
    Since then, this has been used to educate customers on how to architect their
    cloud workloads in a reliable and efficient manner. What started as a set of best
    practices then transformed into some whitepapers and architectural guides for
    hosting applications on AWS. These practices will never cater to 100% of the architectural
    patterns that your workloads will have but will serve the need for strong foundational
    practices and guidance that help you identify, measure, and optimize your architectures
    over time, leading to business success.


    AWS Well-Architected has since then evolved quite a lot. As of today, it offers
    much more than just generic architectural best practices. It can be used by application
    teams to benchmark their workloads against technical and business-vertical best
    practices. In addition to identifying their areas of strength, they also get to
    know about the opportunities for future optimization. Some organizations might
    consider AWS Well-Architected as a mechanism to *audit* their workloads, which
    is *not* correct. As a DevOps professional, you should advocate for these practices
    as a constructive discussion that promotes better architectural decisions, rather
    than using them as a mechanism to point out individuals or teams responsible for
    building those architectures in the cloud. IT architecture is always a trade-off—you
    win something, and you lose something else. The same applies to your applications
    hosted in AWS. Ensuring a higher availability of your applications might result
    in a cost increase, and implementing cross-region **disaster recovery (DR)** procedures,
    on the other hand, could complicate operational procedures and stress the design
    of your application code. Being aware of these trade-offs will help you align
    your technical decisions with your business needs and assist your decision-making
    when architecting for the long term.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'In this chapter, we will discuss the different components of AWS Well-Architected,
    and how you can leverage them to host your mission-critical applications with
    confidence. Starting with a brief understanding of AWS Well-Architected, we will
    then dive into sample implementation use cases, covering common problems that
    apply to most enterprises. Considering the scope of the chapter, we will not be
    able to cover code-level details of these implementation examples, but the idea
    is to give you a basic understanding of how the workflows look and which AWS services
    you could leverage to roll these out. It’s expected that you might have to do
    some self-explorations to build and deploy these solutions in your AWS organization.


    We will cover the following topics in this chapter:


    +   - Understanding different components of AWS Well-Architected

    +   - Aligning your architecture with the six focus pillars of the framework

    +   - Sample practical implementations to adhere to these well-architected best
    practices


    As mentioned before, AWS Well-Architected is much more than just architectural
    practices. Let’s start with a basic understanding of the different offerings under
    this umbrella that come together to help you with a consistent approach to architecture
    evaluation and scalable design implementation.


    # Understanding different components of AWS Well-Architected


    **Well-Architected** is an AWS offering that grants customers access to the wealth
    of knowledge acquired through numerous architectural reviews with other customers,
    over the years. This ensures that customers are well informed about the most effective
    practices and can mitigate architectural risks their applications might be exposed
    to. With Well-Architected, organizations can identify areas within their architecture
    that need enhancement, thereby allowing them to address and overcome ongoing challenges
    that divert their focus from value-adding activities.


    In essence, it serves as a mechanism for organizations to achieve the following:


    +   - Acquire insights into effective strategies and best practices for cloud-based
    architecture

    +   - Assess their architecture against established best practices

    +   - Enhance their architecture by resolving any identified issues


    There are three main components of AWS Well-Architected—the **framework** itself,
    **Well-Architected Lenses**, and the **Well-Architected Tool**. Let’s discuss
    them in detail.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# The AWS Well-Architected Framework


    The Well-Architected Framework offers a collection of questions for customers
    to assess their architecture and its alignment with AWS best practices. Learning
    from what has worked well for other AWS customers in the past avoids the need
    to reinvent the wheel and provides a consistent approach that can be leveraged
    to architect modern cloud-based systems that are secure, cost-effective, efficient,
    reliable, and sustainable. As new application patterns evolve, this framework
    is going to continuously adapt to them. Therefore, it is necessary to look at
    this as an *ongoing activity* where you can continuously measure progress and
    ensure that you are moving in the right direction.


    To categorize these learnings into well-defined focus areas, AWS Well-Architected
    uses six key pillars, which we will cover in the upcoming sections.


    # AWS Well-Architected lenses


    To evaluate your architectures against a well-defined technical or business scope
    and context, there are dedicated *lenses* that can be leveraged. AWS Well-Architected
    Lenses expand on the advice provided by the AWS Well-Architected Framework and
    cater to distinct industry verticals and technology domains. Depending on the
    nature of your applications, you can assess them against business verticals such
    as **financial services**, **media streaming**, or **healthcare**, or you could
    also assess technical maturity around topics such as **hybrid networking**, **high-performance
    computing**, **containers**, or **SaaS (Software as a Service)** capabilities.


    As a DevOps professional, you can leverage these lenses and align application
    design, deployment, and operational activities to ensure that your applications
    will meet the business needs when deployed on AWS. The lenses *add a new dimension*
    to each of the six pillars covered in the framework.


    Let’s take an example of the *SaaS lens* for the AWS Well-Architected Framework.
    It is targeted toward customers that host SaaS applications on the cloud. Diving
    into common areas of concerns that multi-tenant SaaS applications have, such as
    data isolation, noisy neighbor problems, tenant onboarding, and tenant consumption,
    the lens provides best practices around how to solve these problems by leveraging
    AWS services and mechanisms. These lenses provide prescriptive guidance that can
    help you solidify your workloads’ security, resiliency, and availability while
    reducing the overall cost.


    In the previous chapter, *Chapter 11, Ensuring a Strong AWS Foundation for Multi-Account
    and Multi-Region Environments*, we covered the concept of a **landing zone**.
    To identify best practices for the management and governance of your multi-account
    environment, there is a dedicated guide in the AWS Well-Architected Framework
    that outlines various aspects of networking, security, identity management, and
    monitoring that you should consider. Refer to the following link for more details:
    https://docs.aws.amazon.com/wellarchitected/latest/management-and-governance-guide/management-and-governance-cloud-environment-guide.html.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# The AWS Well-Architected Tool


    The **AWS Well-Architected Tool**, also known as the **WA Tool**, is a free-to-use
    service to review your workloads hosted in AWS. It is a cloud-based solution that
    presents a uniform approach to evaluating your architecture against the AWS Well-Architected
    Framework. By using the AWS Well-Architected Tool, you will receive valuable suggestions
    to enhance the security, cost-effectiveness, and efficiency of your workloads.
    It not only helps you identify opportunities for improvement but also to track
    progress over time. It’s a *living database* of your workloads’ current and future
    target state.


    By documenting the decisions that you make (in the tool), you can ensure that
    future team members will have a good understanding of the technology decisions
    that were made to meet a specific business goal.


    Having discussed the key components of AWS Well-Architected, let’s now dive into
    the details of the six pillars of the framework. Most importantly, we will be
    discussing some practical implementation scenarios, under each pillar, that can
    address common challenges faced by organizations when operating in the cloud.


    # Aligning your architecture with the six focus pillars of the framework


    The AWS Well-Architected Framework categorizes all practices under six main pillars,
    which are **Cost Optimization**, **Reliability**, **Operational Excellence**,
    **Performance Efficiency**, **Sustainability**, and—most importantly—**Security**.
    Let’s start with **Operational Excellence**, which focuses on best practices for
    operating your workloads at scale and evolving them over time to ensure a great
    customer experience.


    # Operating your workloads with confidence


    The **Operational Excellence** pillar aims to optimize the delivery cycle of new
    features and bug fixes in customer environments, in a reliable and repeatable
    manner. Developers can only focus on building new capabilities when they are not
    frequently pulled into operational issues that distract them. To ensure this,
    Operational Excellence promotes the idea of automating changes and responses to
    events, continuously monitoring running systems, and improving processes or procedures
    when necessary. In the initial chapters of this book, we discussed software delivery
    concepts such as **Continuous Integration and Continuous Delivery (CI/CD)**, which
    are essential for achieving the operational excellence of your workloads in AWS.
    Let’s discuss some best practices that you can consider adopting in this area.


    # *Best practices for efficiently operating workloads in the cloud*


    Irrespective of the business vertical or technical domain your application corresponds
    to, you can use these practices to enhance operations on AWS.'
  merge: -1
  img_proc: true
