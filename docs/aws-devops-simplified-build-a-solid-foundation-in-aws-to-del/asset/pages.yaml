- pgno: 294
  md: '# Minimizing cloud costs while maximizing business value creation


    The **Cost Efficiency** pillar of the AWS Well-Architected Framework focuses on
    optimizing the use of cloud resources to achieve maximum value and thereby reduce
    expenses. With resource usage understanding and cost management practices, users
    can make informed decisions to optimize their cloud spend. There are some best
    practices recommended in this area, which we’ll look at next.


    # Best practices for reducing your cloud spend


    Depending on particular use cases and application needs, certain measures can
    result in substantial cloud spend reduction. Let’s discuss a few practices that
    can benefit most applications.


    # Aligning consumption with business needs


    Not all compute resources have to be running all the time. Except for production
    workloads, it is generally possible to stop development and test environments
    completely outside working hours. Additionally, configuring low-cost resource
    types for these non-critical environments can result in cost savings that can
    be utilized for experimental or research and development work, leading to room
    for innovation.


    # Analyzing cost anomalies


    Regularly review cost and billing reports to identify unexpected cost increases
    and investigate the reasons for sudden cost spikes. Making software teams aware
    of the cost impact their architectural decisions have is a good first step to
    begin with.


    # Opting for cost-effective alternatives when possible


    Services such as AWS Lambda allow you to match your specific requirements and
    financial constraints with serverless computing resources, with a *pay-as-you-go*
    model. By billing you only for the actual usage, they eliminate the need to manage
    and bear the cost of dedicated server resources that might remain idle for a substantial
    period of time.


    To optimize cloud costs, it is important to set up automated reporting and analysis
    of resource consumption. A common enterprise pattern to implement this is by utilizing
    AWS **Cost and Usage Reports (CUR)**. *Figure 12.5* describes how one could approach
    collection, automated analysis, or reporting with such a solution.


    # Automated analysis of cost and usage of your AWS resources


    AWS services that are relevant for implementing this functionality are Amazon
    CloudWatch, AWS CUR, AWS Lambda, and Amazon **Simple Storage Service (S3)**. The
    cost analysis logic can be customized based on specific requirements, and the
    solution can also be extended to send out automated notifications, or emails,
    if necessary:'
  merge: -1
  img_proc: true
- pgno: 295
  md: '![](img/ecd265dfca9bb64161408ba8a944a4d9_295_0.png)


    # Figure 12.5: Automated analysis of cost and usage reports in AWS


    Let’s look at this in a bit more detail, as follows:


    +   1. AWS CUR provides a comprehensive report collecting the cost and usage data
    across several accounts. These reports can be automatically published up to three
    times a day into a destination such as an Amazon S3 bucket.


    +   2. Amazon CloudWatch rules can be configured to trigger at a pre-defined time
    of day, depending on your use case. You might want to process these records daily,
    or maybe on a weekly or monthly basis. Alternatively, one could also define S3
    event notifications to automatically trigger a Lambda function as soon as an object
    is uploaded. These CloudWatch rule triggers are usually configured to invoke a
    pre-deployed Lambda function that has the necessary permissions to pull and process
    data from the S3 storage bucket in question.


    +   3. The Lambda function pulls the recent reports, parses the CSV records, and
    derives additional insights from the raw data, converting it into actionable information.
    This processed information might support the creation of visuals, graphs, or any
    other form of insight that can then help your teams understand the cost impact
    of the decisions they are making.


    +   4. After the insights are prepared, they can be shared with the relevant teams
    over email or other forms of notifications.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Building sustainable workloads in the cloud


    The **Sustainability** pillar of the AWS Well-Architected Framework focuses on
    controlling and reducing the environmental effects of cloud resources that your
    applications consume. Just as with security, this is also a *shared responsibility*
    model where AWS focuses on using renewable sources for data center energy requirements,
    and users are expected to do their part, by avoiding wastage and carrying out
    architectural improvements when possible. From the users’ perspective, it mostly
    comes down to the reduction of resources and maximum utilization of what is available.


    As with the other pillars, there are also a few sustainability best practices,
    which we will cover next.


    # Best practices for making cloud environments sustainable


    These practices focus on the *indirect emissions* that users can help reduce since
    AWS has little control over how you manage your workloads and the kind of resource
    consumption it results in. The actual consumption depends on the type of AWS services
    that the customers use, the energy requirements of those services, and finally
    the energy requirements of the data center to continue running those workloads.


    # Deriving actionable KPIs from your usage patterns


    First and foremost, users need to understand and measure the impact of their cloud
    workloads by including all forms of impact, including how the end customers use
    their products and what the entire lifecycle leading to resource decommissioning
    looks like. Once the measurements are in place, it becomes easy to derive the
    energy requirements per unit of work and then work toward reducing that requirement
    through efficient architectural design and usage of AWS cloud resources.


    # Maximizing utilization of provisioned resources


    Eliminating resource wastage is a low-hanging fruit that contributes the most
    to your sustainability goals. A subsequent step is to maximize the utilization
    of provisioned resources by optimizing software design and architecture, which
    leads to lower energy consumption. Idling resources in CI/CD pipeline execution
    environments are good candidates for first-level optimizations, after which teams
    can focus on individual applications.


    # Leveraging a shared pool of managed service resources


    Resource sharing by multiple customers results in optimal usage of data center
    infrastructure and thereby allows AWS to reduce the sustainability impact by making
    decisions that benefit a large group of customers. For example, when migrating
    applications to managed services such as **AWS Fargate serverless**, customers
    benefit from shared data center resources such as power and networking, efficiently
    handled by AWS on a large scale.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Summary


    In this chapter, we delved into the fundamental principles and significance of
    AWS Well-Architected, which serves as a comprehensive guide for designing and
    operating reliable, performant, cost-effective, secure, and sustainable cloud
    systems.


    We started with a discussion of different components of AWS Well-Architected—the
    framework, the lenses, and the Well-Architected Tool. An important takeaway from
    all these learnings is that it is an evolving concept. The cloud provider will
    keep on extending the framework and the suggestions under each of the pillars
    as the cloud capabilities evolve and by looking at how different customers use
    these capabilities to solve their unique business problems. The lenses additionally
    provide focused attention on a particular business or technical domain that customer
    workloads map to. Documenting workload evaluations and learnings based on Well-Architected
    suggestions is an important activity that is fulfilled by the use of the Well-Architected
    Tool. Only then can you continually measure progress and identify the drivers
    of certain architectural decisions for your future team members.


    In the last section of the chapter, we focused on the six pillars of the framework
    and covered organizational best practices under each of them. These practices
    serve as a guiding path toward the most important aspects an enterprise should
    consider on its AWS cloud journey. For each of these pillars, we also covered
    an example implementation workflow that highlighted common use cases that apply
    to most enterprises.


    As a DevOps practitioner, it’s important that you advocate the adoption of these
    practices and continuous evaluation of workloads against the Well-Architected
    Framework. At the same time, it is equally important to discourage the use of
    Well-Architected as an audit or blame mechanism.


    I hope these learnings will help you create a strong AWS foundation on which you
    can base your processes and technical architectures. Establishing a continuous
    improvement culture based on learnings from how other customers have used AWS
    services will additionally enable you to solve organizational needs of reliable,
    cost-effective, secure, and sustainable cloud systems.


    # Further reading


    Here are some case studies outlining the benefits that three companies realized,
    with the adoption of the AWS Well-Architected Framework and practices:


    +   - https://aws.amazon.com/solutions/case-studies/moots-technology-wa-case-study/

    +   - https://aws.amazon.com/solutions/case-studies/well-architected-natura-case-study-en/

    +   - https://aws.amazon.com/solutions/case-studies/bmc-software-wa/'
  merge: -1
