    Logs are the ultimate source of truth for the events that are happening in a system.
    Therefore, it’s important to enforce appropriate security guardrails to prevent
    any modifications after they have been created. In AWS, it’s a good practice to
    encrypt these logs at rest using services such as **Amazon Key Management Service
    (KMS)**.


    +   - **Metrics:** These are the *raw data points* that reflect the performance
    of your systems over time and are particularly useful in alarming, trend analysis,
    and scenario forecasting. For on-premises deployments, organizations typically
    leverage third-party tools and **application performance monitoring (APM)** solutions
    that gather underlying infrastructure and application metrics. However, in AWS,
    most of the services automatically publish key metrics without any additional
    configurations or cost to the user. This information, which is available free
    of charge, can be used to define alarms for threshold breaches or mathematical
    analysis – for example, maximum IOPS for a disk in any 5-minute interval.


