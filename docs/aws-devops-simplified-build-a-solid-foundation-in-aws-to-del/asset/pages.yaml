- pgno: 189
  md: '# Enabling the Observability of Your Workloads


    The ever-increasing complexities of our software applications demand insights
    at a level of detail that was not common before. Breaking down monoliths into
    a set of microservices comes with well-established benefits but we certainly need
    to do more to have the same or, in some cases, even better understanding of how
    our systems are performing under the hood.


    When something is wrong with an application, it affects the user experience and
    ultimately the business. If such occurrences happen frequently, they can even
    lead to a loss of customer trust due to unreliable software systems. Therefore,
    it''s very important to detect problems as soon as possible, and then understand
    why it''s happening and how the problem can be fixed.


    **Monitoring** is what deals with the *reactive* part, and **observability** is
    what deals with the *proactive* part. With monitoring, you already have a good
    idea about the factors that will negatively influence software availability –
    for example, a storage disk that is soon going to be full. Observability, on the
    other hand, is mostly about anticipating the problems that could happen, and simplifying
    the analysis of root causes, when they happen. For the same storage disk, an observability
    solution could analyze disk usage logs and correlate them to increased latency
    or errors during software release cycles, for example. The administrators could
    leverage these findings to optimize the storage configurations before they result
    in an outage. In the ideal case, the software patterns that have the potential
    to cause customer impact should surface much earlier than a metric alarm being
    triggered, or even before customers start to experience service degradation. This
    should be the *North Star* of all observability efforts by a team that manages
    software applications at scale.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'Having worked with several software teams in my career, a common approach I’ve
    noticed is that observability and monitoring are always seen just in the light
    of technical metrics. Sometimes, software professionals are a bit disconnected
    from understanding the business impact their code has, and how exactly the end
    users consume the applications they develop daily. Observability, from my perspective,
    is all about *empathizing with the customer* and feeling what they feel, seeing
