    # Summary


    We started this chapter by understanding the relevance that containers have in
    modern software applications. They not only speed up the development velocity
    but also adhere to the microservices patterns and twelve-factor design principles,
    which are an inherent part of your software artifacts. In case you had not been
    exposed to containers yet, we started with a basic understanding of how they work
    and then moved on to outlining the constructs of Docker, a container runtime environment.


    With the foundations covered, we discussed the need for a container orchestrator
    system when running production workloads in the cloud. AWS ECS is an opinionated
    offering from AWS that simplifies operating containers in an enterprise-grade
    environment. Next, we dived deeper into Amazon ECS and the native constructs used
    by the service to define logical components in your application stack. Of course,
    security is paramount when deploying resources in the cloud. So, we discussed
    some best practices to ensure least privileged access patterns for your container
    applications, as well as integrations with other AWS services. To give you a practical
    hands-on experience of everything that was discussed around ECS, we worked on
    deploying a To-Do List Manager application from scratch. Building on what we had
    learned in previous chapters, we used CDK to manage the infrastructure components
    that were needed.'
