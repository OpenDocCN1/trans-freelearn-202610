- pgno: 138
  md: 'language. With CDK, they can use familiar programming principles such as inheritance,
    composition, and loops to manage their infrastructure. CDK offers reusable blocks
    that speed up infrastructure deployment while keeping you away from undifferentiated
    heavy lifting.


    We will cover the following topics in this chapter:


    +   - Different approaches to managing infrastructure and where AWS CDK fits in

    +   - What is AWS CDK?

    +   - Benefits of using CDK

    +   - Deploying a test application with AWS CDK in your AWS account


    Let’s start by providing a basic understanding of where CDK fits in the overall
    AWS infrastructure automation landscape, and also do a quick comparison with other
    offerings.


    # Different approaches to managing infrastructure in AWS


    Many years back, when I was starting with infrastructure automation on AWS, I
    used to bundle together some CLI commands in a Bash script and fire it off when
    new AWS accounts required bootstrapping. It worked like a charm for basic setups
    but surfaced limitations in other areas such as ongoing management, updates, stack
    removals, extracting resource identifiers, and so on. Every requirement would
    transform into more scripts being developed and managed, which of course was not
    a scalable solution.


    Secondly, it was difficult for other team members to contribute to these scripts
    as they didn’t have an operations or scripting background. This is where something
    more declarative such as AWS CloudFormation/Terraform could have helped them easily
    get started. There will always be a tipping point in your AWS infrastructure automation
    journey where you would like to switch from one approach to another as your needs
    outgrow the capabilities of underlying mechanisms or tools.


    Luckily, when it comes to working with AWS, there are a lot of options that can
    be leveraged to target a specific requirement. As a cloud provider, it has always
    been a priority area for AWS to meet the requirements of the users, wherever they
    are in their cloud journey, and infrastructure automation is no different. Let’s
    dive into the various categories of infrastructure management tools that fit the
    respective use cases.


    # Manual infrastructure management


    This is where everyone starts their AWS journey. After logging into the console,
    users can browse different services across 26+ regions and deploy them with the
    click of a button. For demonstrations and proof-of-concept development, this is
    still a viable approach, so long as the user takes care of the security best practices
    and does not expose any confidential information over the internet.'
