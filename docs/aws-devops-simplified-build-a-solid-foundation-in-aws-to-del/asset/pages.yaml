- pgno: 254
  md: 'a dedicated team. What is essential is that a single team should own the entire
    life cycle of the service they manage, from ideation to production operations,
    and they should perform this role quite well, with full autonomy and ownership.


    # Invest in building abstractions that promote best practices


    Creating Amazon RDS databases is not a differentiated task. Using these databases
    to extract value from data and demonstrating engineering excellence is.


    If you leave the infrastructure life cycle management of such services to respective
    teams, there’s a high chance that every team in your organization might implement
    it a bit differently. Some might not enable encryption at rest, and others might
    not enforce SSL connection parameters. It could also be the case that organizations
    just getting started with AWS might want to ensure a minimum security posture
    in the cloud while the teams gain a better understanding of best practices. Services
    such as **AWS Service Catalog** can be very beneficial here. The platform teams
    could offer a ready-made *catalog* of packaged products to the end users by implementing
    and abstracting the implementation details in Service Catalog. The product in
    this case could be implemented with **CloudFormation** or **Terraform** scripts
    under the hood, two famous IaC solutions. The value streams need not bother about
    the configuration specifics of these offerings from the platform team, but just
    use them as a service, just like they would do with any other SaaS product out
    there. These products could also adapt to the software environment they are being
    provisioned for. In production, they could enable backup retention and prevent
    accidental deletion, while in dev, they could enforce low-cost configurations.


    # Making injection of failure scenarios a routine practice


    For critical business applications with a very high uptime requirement, organizations
    might implement **disaster recovery (DR)** processes and architectures to survive
    regional outages. The rarity of such scenarios occurring means that the disaster
    recovery procedures are hardly tested before a real event happens. AWS services
    such as **Fault Injection Simulator** and **Resilience Hub** allow users to intentionally
    introduce certain failure scenarios, such as the unavailability of an **Availability
    Zone (AZ)** – a collection of data centers in AWS, sudden CPU usage spikes on
    a container, and so on. In addition to giving the teams confidence around how
    gracefully their workloads survive these situations, these procedures also help
    uncover aspects that developers might not have thought of. DR procedures that
    haven’t been triggered in the last 2 years are as risky as not having any at all.


    Organizations with highly mature operational practices regularly operate their
    critical workloads from a standby site multiple times a year.'
  merge: -1
