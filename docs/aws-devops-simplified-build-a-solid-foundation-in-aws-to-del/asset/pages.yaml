    # Summary


    Developing software applications is only one part of the challenge. Maintaining
    them in a productive environment (at an enterprise scale) requires equal commitment
    and engineering effort. This can only be achieved with a solid observability strategy
    that allows you to not only react faster to operational issues but also gather
    meaningful insights that allow you to continue delivering differentiated business
    outcomes to your users.


    We started this chapter with a basic understanding of what observability is and
    why it matters. Equipped with that knowledge, we then moved on to discussing the
    AWS observability platform – CloudWatch – and the solutions or integrations it
    offers for each of the observability pillars – metrics, logs, and traces. In addition
    to that, we discussed AWS’s efforts in the CNCF’s Open Telemetry project and the
    ADOT collector, which allows you to seamlessly collect, process, and export metrics,
    logs, and traces to other AWS services.


    Outside AWS, solutions such as Prometheus and Grafana are widely adopted by companies
    due to their maturity, ease of use, and scalability. To ensure a hands-on experience
    that covers all these solutions, we went ahead with deploying an observability
    stack for the To-Do List Manager, our test application from the previous chapter.
    This allowed us to have a holistic view of how we can integrate all these tools
    and adapt them to our specific needs.'
