- pgno: 49
  md: '# Monitoring


    Running an application in production requires visibility in terms of how all layers
    of the application are functioning. To understand key system behaviors, software
    developers can derive valuable insights from the metrics supported by the PaaS
    offering, such as the number of incoming HTTP requests, database response time
    latencies, and so on.


    Beanstalk offers basic or enhanced reporting and monitoring directly in the console.
    With basic insights such as *target response time*, *CPU utilization* across the
    fleet, and *total requests*, the platform offers an aggregated view of the application
    performance that was not available in the systems on-premises. Using the Beanstalk
    health agent, the service additionally provides interesting insights into the
    deployment time activities and how they correlate with the application behavior.
    This was never available in the infrastructure setup on-premises.


    With PaaS offerings, you not only meet your basic application needs but get interesting
    features from the platform based on the provider’s experience running workloads
    of thousands of other enterprise customers, at scale. This level of knowledge
    and best practices takes a long time to establish when you are managing workloads
    on your own and starting from scratch.


    # Code deployment


    For rolling out features in the cloud, Beanstalk offers seamless integration with
    Amazon S3. You upload the code packages into the storage service, and Beanstalk
    takes care of the rest. Furthermore, it supports well-established DevOps methodologies
    to test new functionalities in isolation before rolling them out on all servers.


    The team ended up using a *traffic-splitting* deployment policy that gave them
    the possibility to test new features on a subset of servers, while the live requests
    were served by others, using the older stable version of the application code.


    A modification to any of these configuration settings was as simple as modifying
    a property in the web console that switched the deployment mode to *rolling* or
    *all at once*. These deployment modes control the rate of change rollout across
    your servers: one at a time or all in one go. Implementing similar software delivery
    capabilities on your own requires a lot of tinkering with various systems, applications,
    and tools. That is definitely not easy for teams just getting started with cloud.


    # Configuration


    Modification of any application stack component including software, instances,
    capacity planning, and so on was possible within the configuration options supported
    by Elastic Beanstalk. Once the developers were comfortable operating the service
    via the console, they started rolling out modifications through code as well.
    Elastic Beanstalk offers the possibility to roll out customizations using its
    custom configuration files.


    This level of understanding and confidence paved the way for easier adoption of
    automation and tooling, driven by code. In the on-premises world, the developers
    hardly had any opportunities to'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'own the operations of the software stack. Beanstalk opened the doors for them
    to not just build but own the application environments, from development to production.


    # Operations


    A key measure of success for PaaS services is the level of simplicity offered
    in terms of *Day 2 operations*. If not managed properly, this can lead to software
    developers either focusing too much time on repeatable, boring tasks, or even
    worse, the end-user experience takes a hit.


    Through AWS EC2 auto-scaling and ELB, Beanstalk offers the capabilities to provision
    capacity on demand, load balance requests across multiple instances, and scale
    the application based on application usage metrics.


    Starting with a basic set of features, it is very simple for developers to extend
    the system for future requirements by leveraging the integration points such as
    custom configuration files and CloudFormation support. However, the cloud platform,
    that is the AWS accounts, the underlying VPCs, and so on, are still managed by
    the cloud platform team.


    Next, let’s dive deeper into a growth-focused operating model that promotes ownership
    and gives even more control to the application owners.


    # Focusing on growth in the cloud


    Fast-moving organizations with mature DevOps practices demonstrate this approach
    to operating in the cloud. The developers not only build and run the software
    stack but also manage the cloud platform on their own. This is only possible when
    teams automate most of their tasks, test frequently, and leverage IaaS cloud capabilities
    to manage the entire infrastructure as code.


    In such setups, the cloud platform teams focus on ensuring the right guardrails,
    compliance, and overall strategy instead of managing the infrastructure for individual
    teams. Managing multi-account AWS environments at scale is a topic we will cover
    in a dedicated chapter towards the end of the book.


    It is important to understand that not all teams within an organization need to
    follow the same operating model. It is common for companies to have a mix of all
    three, based on what the individual application needs and priorities are.


    Let’s discuss another real-life example where the same team, after gaining relevant
    cloud skills, went ahead and launched another service in the cloud a few months
    later. This time, they took care of the entire cloud infrastructure. It is a common
    progression path observed in companies that adopt PaaS offerings, expand their
    learning horizons, and later go ahead and control the entire infrastructure using
    IaaS. These requirements are mostly fueled by the need to control and optimize
    beyond what PaaS environments would expose to the end user.'
  merge: -1
  img_proc: true
