- pgno: 193
  md: '# CloudWatch metrics


    Most AWS services emit free metrics by default that can be used to understand
    the performance of your systems and enable search and visualization capabilities.
    Customers can either use basic monitoring of metrics (free) or the detailed version
    (paid), which is only offered by some services. Depending on the time granularity
    of these metrics, the users could use them to understand trends and patterns of
    how certain parts of the system are working. Users can also leverage CloudWatch
    Metrics Insights, which is a SQL query engine that allows real-time analysis of
    metrics.


    # CloudWatch alarms


    A CloudWatch alarm can be configured to monitor a certain metric or the result
    of a math expression that covers multiple metrics. For example, if an AWS service
    emits read IOPS and write IOPS independently, you can use metric addition to derive
    the total IOPS and configure an alarm whenever the total IOPS threshold is breached.


    Alarms can be configured to send Amazon Simple Notification Service (SNS) notifications
    and start/stop EC2 instances as a target action, for example.


    # Application monitoring


    With application monitoring, CloudWatch offers additional insights into how your
    applications are working under the hood. Several services are offered in this
    category.


    # Synthetic monitoring


    CloudWatch allows you to simulate an end user''s interaction with your application
    from multiple locations in the world – just as real users would use your application.


    # Service lens


    Service lens aggregates all data from traces, metrics, logs, and alarms onto a
    single dashboard. This gives the user a unified view of not only the service map,
    which highlights the different components involved in the application workflow
    but also brings the bottlenecks and metrics for important data to the surface,
    such as requests per minute and average response times. This visibility allows
    you to easily pinpoint the needle in a haystack of data, and you can work back
    from this analysis to uncover the underlying problem.


    # CloudWatch real user monitoring


    CloudWatch real user monitoring (RUM) can offer real user insights that give visibility
    into what the end user is experiencing. It''s a JavaScript code snippet that you
    can add to your application and start measuring key metrics immediately. The data
    that''s captured by the RUM agent and injected into your web page can extract
    page load times and client-side errors, among many other use cases.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# *Insights and operational visibility*


    This category of offerings is a huge differentiator when it comes to providing
    ready-made solutions that extract data from multiple sources and deriving insights
    out of those to provide actionable next steps to the user.


    # Container insights


    When working with AWS services in the container landscape, you can use **CloudWatch
    container insights** to summarize metrics and logs from your containerized applications.
    It offers deep insights into problems such as continuous container restarts, for
    example.


    # Lambda Insights


    When running serverless workloads on **AWS Lambda**, Lambda Insights can offer
    a deep understanding of system-level metrics and events from your Lambda invocations.
    For supported runtimes, you can add an extension that starts gathering useful
    data and helps the users identify problems such as cold starts.


    > **Did you know?**

    > At the time of writing, Amazon CloudWatch is used to monitor more than 9 quadrillion
    metric observations and ingests more than 5 exabytes of logs per month. Comparing
    this with over 8 billion people on Earth would mean that the service manages roughly
    1 million events per person on the planet, per month. That’s the scale CloudWatch
    operates at.


    There is so much that users can do by leveraging the right solutions from the
    CloudWatch observability platform. However, there are some best practices that
    I would like to discuss next so that you can maximize your benefits when using
    these tools.


    # Best practices for a solid observability strategy


    In this section, we will be covering some fundamentals of how to best represent
    your observability data while maintaining the right balance of information you
    need to process.


    # Build a hierarchy of dashboards


    A key measure of success for your observability strategy is the **Mean Time to
    Recover (MTTR)**. This defines how soon an engineer working on operational issues
    can understand and recover from the underlying problem. To begin with, it’s important
    to have dashboards that provide just the right amount of detail. Reducing unwanted
    noise is crucial in reducing the overall MTTR. A common problem software teams
    run into is creating a data-heavy dashboard that covers many different aspects
    of their application, all on one screen. This often leads to false negatives consuming
    a lot of investigation time.'
  merge: -1
  img_proc: true
