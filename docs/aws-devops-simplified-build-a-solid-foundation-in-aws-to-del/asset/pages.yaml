- pgno: 90
  md: "# Best practices for using CloudFormation to define enterprise-grade architectures\n\
    \nWhen it comes to architectural designs spawning multiple accounts, teams, and\
    \ regions, there are a few guiding principles you should always keep in mind.\n\
    \n# Keep templates small and reusable\n\nWhen you are just getting started, you\
    \ work with small templates targeting a minimal set of resources. Over time, the\
    \ needs of your team and organization grow, which can lead to an uncontrolled\
    \ expansion of the same template for all future additions. It is a good practice\
    \ to restrict the scope of these templates based on the team’s responsibilities\
    \ and the applications they own. Managing infrastructure resources for two different\
    \ applications in the same stack can have adverse effects on the team’s agility\
    \ and introduce dependencies. Furthermore, it also introduces an element of risk\
    \ as some stack operations can affect all other resources.\n\nSecondly, maintaining\
    \ small templates promotes reusability. For example, a three-tier web application\
    \ following all the best practices and organizational security controls could\
    \ easily be shared with other teams to get them started with a secure and compliant\
    \ infrastructure baseline.\n\nManaging dependencies between different stacks can\
    \ be simplified with inputs and outputs.\n\n# Leverage inputs and outputs for\
    \ cross-stack dependencies\n\nAs discussed previously, CloudFormation can export\
    \ certain resource identifiers for use by other stacks. This can be achieved by\
    \ defining Output parameters and exporting these values with a predefined name.\
    \ In such cases, the service acts as a message bus facilitating communication\
    \ between different stacks.\n\nStacks that import these values use the Fn::ImportValue\
    \ intrinsic function:\n\n```\nResources:\n  WebServerInstance:\n    Type: 'AWS::EC2::Instance'\n\
    \    Properties:\n      InstanceType: t3.micro\n      ImageId: ami-0c956e207f9d113d5\n\
    \      NetworkInterfaces:\n        - GroupSet:\n          - Fn::ImportValue\n\
    \            'Fn::Sub': '${NetworkStack}-SecurityGroupID'\n```\n\nIn this example,\
    \ the stack is importing SecurityGroupID from another stack whose name is referenced\
    \ by the ${NetworkStack} parameter."
