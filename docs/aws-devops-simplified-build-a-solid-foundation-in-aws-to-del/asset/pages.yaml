    print(\"Server stopped.\")\n```\n\nThis is a sample web server implementation\
    \ where Python listens for incoming GET requests on port 8080 and responds with\
    \ a static string AWS DevOps Simplified - Simple HTTP Server. Let’s jump into\
    \ creating a new AMI with a widely adopted automation tool – Hashicorp’s Packer.\n\
    \n# Building an AMI with Packer\n\nPacker is an open source tool from Hashicorp\
    \ that automates the process of building system images. It works with all major\
    \ cloud providers and helps author your golden images – templates for your virtual\
    \ machines in the cloud. It also offers a multi-cloud workflow to define a blueprint\
    \ for creating images across multiple providers, such as AWS and GCP. For the\
    \ scope of this chapter, we will focus on creating an AWS-based AMI and starting\
    \ an EC2 instance off of it.\n\nPacker leverages a JSON template that defines\
    \ all the configurations for creating your AWS image. Using the CLI, you can target\
    \ a specific configuration that defines the steps to create an AMI in your AWS\
    \ account. Once the execution completes, you can simply create an EC2 instance\
    \ using this standardized template with all software dependencies baked in. Using\
    \ pre-baked AMIs ensures a good security posture and avoids the need for any modifications\
    \ post instance creation.\n\nLet’s start our AMI build process with packer, inside\
    \ the Cloud9 IDE we used previously. Packer configuration files can be found in\
    \ the packer/ folder, inside the chapter-3 directory. A configuration file called\
    \ ami_build.json pre-exists in the same directory. You will notice that the values\
    \ for the vpc_id and subnet_id properties have been automatically updated for\
    \ you, based on the resource identifiers in your AWS account. Please confirm that\
    \ the right values are in place before proceeding with the AMI build using packer:\n\
    \n```\naws-devops-simplified:~/environment/chapter-3/packer $ packer build ami_build.json\n\
    ```\n\nCompleting the build gives an AMI ID toward the end that can later be used\
    \ to provision an EC2 instance. If you observe the output on your local machine,\
