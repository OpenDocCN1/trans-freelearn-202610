  md: "are hosted in the public subnets, though, mainly because they want to route\
    \ traffic to the internet via the internet gateway:\n\n```\n```yaml\nResources:\n\
    ...\n  NatGateway1EIP:\n    Type: AWS::EC2::EIP\n    DependsOn: InternetGatewayAttachment\n\
    \    Properties:\n      Domain: vpc\n\n  NatGateway1:\n    Type: AWS::EC2::NatGateway\n\
    \    Properties:\n      AllocationId: !GetAtt NatGateway1EIP.AllocationId\n  \
    \    SubnetId: !Ref PublicSubnet1\n...\n```\n```\n\nAn important CloudFormation\
    \ construct that we’ll cover here is DependsOn. This is used to mark explicit\
    \ dependencies between two resources defined in the template.\n\nWe also use an\
    \ **Elastic IP (EIP)** here, which is a static public IP address whose life cycle\
    \ is independent of the resource it is attached to. You can move these IPs across\
    \ several different AWS resources, which means you don’t lose them when underlying\
    \ resources are deleted. Big enterprises often follow IP whitelisting requirements\
    \ with their customers. EIPs come in handy in such situations as you don’t want\
    \ to lose the IPs that have gone through lengthy approval processes already.\n\
    \n> **Tip**\n> \n> It is now possible to transfer EIPs across multiple accounts.\
    \ The target account has 7 hours to accept this transfer once initiated. Organizations\
    \ benefit from this transferability when they go through organizational restructuring\
    \ and disaster recovery procedures.\n\n# Stack outputs\n\nEarlier, we discussed\
    \ a best practice to keep your CloudFormation templates modular and organize them\
    \ with ownership in mind. The network stack we just defined can be deployed and\
    \ managed by the networking team, independent of the application teams. The application\
    \ owners, however, will need to consume some resource identifiers from this stack’s\
    \ output (VPC ID, for example) in their own IaC stack definitions. This is where\
    \ we can leverage stack outputs and make the outputs from this stack available\
    \ for use by others:\n\n```\n```yaml\n...\nOutputs:\n```\n```"
