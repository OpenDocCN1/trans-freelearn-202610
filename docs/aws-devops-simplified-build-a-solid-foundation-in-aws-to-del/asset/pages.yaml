- pgno: 239
  md: "By default, this utility dumps a report file after the command’s execution\
    \ is complete. In addition to JSON, there is support for several other formats,\
    \ which can be automatically parsed for any additional automation you want to\
    \ build on top of it. After making these changes, you can push the new updates\
    \ to the repository hosted on AWS:\n\n```\naws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app\
    \ $\ngit commit -am \"Increased threshold for CVSS score in SCA check\"\n[master\
    \ 73db6e9] Increased threshold for CVSS score in SCA check\n 1 file changed, 1\
    \ insertion(+), 1 deletion(-)\n\naws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app\
    \ $\ngit push origin master\nEnumerating objects: 7, done.\n...\n...\n   0032123..73db6e9\
    \  master -> master\n```\n\nNext, we can move on to the outputs of the SAST stage.\n\
    \n# Static Application Security Testing with Bandit\n\n**Bandit** is a famous\
    \ SAST utility for testing security issues in Python code. This is the second\
    \ action in the ApplicationValidation stage of our pipeline that executes in parallel\
    \ to SCA, which we discussed previously.\n\nWe also have an error that has been\
    \ reported here. It seems to point to incorrect usage of exception handling in\
    \ Python:\n\n```\n>> Issue: [B110:try_except_pass] Try, Except, Pass detected.\n\
    \   Severity: Low   Confidence: High\n   CWE: CWE-703\n\n      More Info: https://bandit.readthedocs.io/en/1.7.5/plugins/b110_try_except_pass.html\n\
    \   Location: app.py:35:8\n34              return redirect(url_for('todos'))\n\
    35              except Exception as e:\n36                  pass\n```\n\nThe problem\
    \ with this code is that we are catching all exceptions and silently ignoring\
    \ them. This represents a potential security risk as a large number of errors\
    \ from a service can hint at attempts to interfere with the application. Even\
    \ if we don’t want to handle the exception in a particular way, we should at least\
    \ log the failure message and not just suppress it with pass."
  merge: -1
  img_proc: true
- pgno: 240
  md: "Let’s replace the problematic line of code in app.py with a logger statement\
    \ and commit the changes again:\n\n```\n```python\n...\n    return redirect(url_for('todos'))\n\
    except Exception as e:\n    logging.error(\"Exception occurred while submitting\
    \ data to MongoDB\", exc_info=True)\n...\n```\n```\n\nNow that we’ve fixed this\
    \ security risk, the last validation check that must be configured in the pipeline\
    \ involves bringing potential risks, or issues, with the Dockerfile to the surface.\n\
    \n# Validating the Dockerfile manifest with hadolint\n\nIn addition to linting\
    \ Docker files, **hadolint** also performs bash code validations through the *shellcheck*\
    \ utility. If you are into writing bash scripts for day-to-day operational procedures,\
    \ I highly recommend using **shellcheck**, if you don’t use it already.\n\nThere\
    \ are a few errors you will notice in the CodePipeline execution under the `PlatformValidation`\
    \ stage that require fixing. Let’s have a look:\n\n```\n```\n...\n...\nDockerfile:10\
    \ DL3018 warning: Pin versions in apk add. Instead of `apk add <package>` use\
    \ `apk add <package>=<version>`\nDockerfile:22 DL3059 info: Multiple consecutive\
    \ `RUN` instructions. Consider consolidation.\nDockerfile:24 DL3020 error: Use\
    \ COPY instead of ADD for files and folders\nDockerfile:29 DL3042 warning: Avoid\
    \ use of cache directory with pip. Use `pip install --no-cache-dir <package>`\n\
    Dockerfile:29 DL3013 warning: Pin versions in pip. Instead of `pip install <package>`\
    \ use `pip install <package>==<version>` or `pip install --requirement <requirements\
    \ file>`\n...\n...\n```\n```\n\nWhile some of these are opportunities to optimize\
    \ the Dockerfile layer’s structure, the others that ask for specific versions\
    \ of the libraries to be pinned have some security benefits.\n\nIt is always good\
    \ practice to avoid cached directories for installation and use the latest versions\
    \ of the libraries. This also goes against the idea of immutability because when\
    \ new versions of those libraries are released, you might unknowingly end up with\
    \ a different library version than the one you tested. This can introduce potential\
    \ security risks if new vulnerabilities were introduced in the latest packages."
