- pgno: 288
  md: '# Building resilient and highly available systems


    The main focus of the **Reliability** pillar within the AWS Well-Architected Framework
    is to create systems capable of automatically recovering from infrastructure or
    service interruptions and seamlessly adjusting to evolving conditions. The ultimate
    objective is to guarantee applications'' **high availability** (**HA**), resilience,
    and maintainability, by keeping downtime at a minimum and delivering a reliable
    and uninterrupted experience for end users.


    Let’s discuss some best practices that simplify the achievement of these objectives
    when deploying workloads on AWS.


    # *Best practices for building reliable applications on AWS*


    Through the implementation of automated recovery processes, rigorous testing,
    horizontal scaling, and efficient change management, organizations can ensure
    their applications remain resilient and provide a consistent experience for users.
    It’s important to remember that every single component in your AWS architecture
    can fail; therefore, you need to at least have a plan in place that outlines the
    course of action when unforeseen events happen.


    # Automatically recovering workloads from failures


    A good monitoring and alerting strategy depends on business KPIs instead of technical
    thresholds. Depending on the nature of your application, you can start with what
    good looks like, and derive business KPIs from that, which can then be monitored.
    For example, an e-commerce shop could watch for delays in shopping cart processing
    time instead of blindly looking at the CPU crossing 90% usage thresholds, as the
    latter does not help you measure the business outcome.


    # Scaling your workloads by leveraging AWS availability constructs


    All AWS regions are composed of three or more **Availability Zones (AZs)**, which
    by themselves are a collection of multiple data centers. When architecting systems
    in the cloud, it’s important to spread your resources throughout these discrete
    locations and horizontally scale your systems. Also, resource constraints are
    usually scoped to a particular AZ. So, distributing your applications across multiple
    AZs offers additional benefits of higher availability and uniform resource spread,
    eventually improving your application uptime and reliability.


    # Dynamically adapting to changing capacity demands


    Static provisioning of resources in AWS will not offer you the elasticity to automatically
    scale up or scale down based on changing demands. With features such as **Elastic
    Compute Cloud (EC2)** Auto Scaling or serverless capabilities of AWS services,
    you can ensure that reasonable demand needs are met automatically, without any
    manual intervention or interruptions to the application’s availability.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'An e-commerce shop might have demand spikes during specific times of the year
    that can be easily met with such practices, for example. On the other hand, there
    should also be controls that block automatic scale-up beyond certain thresholds,
    which might instead be representative of service availability attacks such as
    **Distributed Denial-of-Service (DDoS)** attacks. These measures avoid any unexpected
    cost burden and misuse of services.


    # Leveraging automation for any changes to the infrastructure or application


    Completely avoiding manual interventions for any changes to be rolled out in the
    application or infrastructure is an important step in the direction of building
    reliable systems. When operating in AWS, you might be deploying resources across
    multiple accounts, regions, and AZs. This necessitates the need for automation
    even further as the chances of configuration drift increase when these changes
    are rolled out manually. Secondly, any modern application these days is composed
    of several services that can only be efficiently managed when modifications are
    coordinated and rolled out using code that has been tested in another environment
    beforehand.


    Such approaches make the process of rolling out changes at an infrastructure or
    application level more reliable, visible, and trackable, additionally allowing
    you to focus on differentiated value creation.


    Most companies architect their cloud applications for failure handling but rarely
    test these scenarios in practice, which results in a lack of understanding of
    how these applications actually behave when unforeseen situations happen. Let’s
    look at a test setup demonstrating how one could simulate outages across different
    components of a typical web application stack.


    # *Injecting failures with AWS Fault Injection Simulator*


    Simulating failures across different application components can be carried out
    with manual actions in the console, automated test scripts, or by leveraging services
    such as **AWS Fault Injection Simulator (FIS)**. FIS provides out-of-the-box integrations
    with services such as EC2, **Relational Database Service (RDS)**, **Elastic Kubernetes
    Service (EKS)**, and so on to simulate operational events. These simulations surface
    software behaviors that are otherwise only experienced during real outage events.'
  merge: -1
  img_proc: true
- pgno: 290
  md: "Have a look at the following diagram:\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_290_0.png)\n\
    \nFigure 12.3: Simulating failures with AWS Fault Injection Simulator\n\nFor a\
    \ typical web application fronted by a load balancer and application code deployed\
    \ in EC2 instances that persist data in a Multi-AZ RDS database, one could follow\
    \ these steps for failure injection, using the FIS service:\n\n+   1. Random EC2\
    \ instances in the architecture are shut down, and the application, as a whole,\
    \ is still expected to work fine as incoming requests should be distributed to\
    \ the remaining EC2 instances by the load balancer. During these resiliency tests,\
    \ one starts with a *hypothesis* on what they expect to happen when a failure\
    \ occurs and confirms that hypothesis by actually carrying out the corresponding\
    \ action. To continuously check the response of an application API during this\
    \ time, one could leverage the **AWS CloudWatch Synthetics** service, which repeatedly\
    \ tests an endpoint, generating traffic just like a regular end user.\n+   \n\
    +   2. After the compute instances’ failure simulations are validated, one can\
    \ move ahead with database-level resiliency tests. The FIS service supports restarting\
    \ the active database instance from an RDS cluster, in a Multi-AZ setup. This\
    \ should mimic the scenario where a particular AZ is affected, resulting in a\
    \ trigger of the database failover process."
  merge: -1
  img_proc: true
- pgno: 291
  md: '3. Finally, after the failures of individual resources and their corresponding
    impacts have been analyzed, one can proceed with an AZ-wide outage. This is commonly
    achieved by detaching NACLs from the subnets in the second or third AZ, as shown
    by point 3 in Figure 12.3. This will make all resources in that AZ unreachable,
    and the tests can validate how the application responds to this situation.


    Using these resiliency test procedures gives software teams confidence by increasing
    awareness of unknown limitations of the software application architecture, or
    the expectation from AWS cloud services. It’s advisable to execute these tests
    regularly so that operational runbooks and procedures can also evolve over time,
    leading to a more reliable cloud presence.


    # Improving the performance efficiency of your workloads


    The core idea of the **Performance Efficiency** pillar revolves around optimal
    utilization of computing resources, to meet specific business requirements in
    the most effective manner. Furthermore, it delves into strategies for sustaining
    this efficiency amid fluctuating demands and ever-evolving technologies.


    # *Best practices for extracting the most out of your workloads on AWS*


    These practices are focused on achieving optimal utilization of computing resources
    while fulfilling specific performance requirements. With this, organizations can
    maximize the value of their cloud-based systems and enhance overall cost-effectiveness.


    # Avoiding reinventing the wheel and delegating repeatable tasks


    With AWS, you can let the cloud vendor handle repeatable tasks that don’t provide
    any differentiated value for your software teams. For example, maintaining a database
    running in EC2 or hosting a self-managed load balancer is not going to help you
    in the long run, unless there are strong business reasons to demand that. So,
    whenever possible, it’s recommended to adopt AWS-managed services, which reduce
    the time and effort you would have otherwise invested in maintaining this stack.
    This effort-saving directly impacts your **total cost of ownership (TCO)** when
    operating in the cloud.


    # Adopting serverless technologies to reduce cost and operations


    Serverless technologies such as **AWS Lambda**, **DynamoDB**, and **Step Functions**
    abstract a lot of intricate details under the hood, which removes a lot of overhead
    around the maintenance and development of complicated technology stacks. While
    spearheading the development of actual applications, they shorten the time-to-business-value
    realization, which is very beneficial for software teams that are just getting
    started or already very mature with their cloud strategy.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Deploying applications closer to end users for increased performance and
    reliability


    By leveraging AWS services such as **CloudFront edge locations** and **AWS Global
    Accelerator**, application teams can host their applications closer to end users,
    which reduces response latency, increases performance, and allows you to extract
    more value out of the same set of compute resources.


    # Experimenting with different service configurations


    Be it running applications’ business logic in **AWS Lambda** functions or running
    CI/CD build jobs using **AWS CodeBuild**, it’s important to right-size your compute
    configurations to address the use case at hand. For example, increasing the memory
    size of your Lambda function might allow you to process the same request in reduced
    time, eventually leading to lower costs as the billed-duration metric decreases
    substantially.


    Before starting with any optimizations in the application code or the AWS components
    used in the technology stack, it’s important to measure important metrics to surface
    the bottlenecks and identify areas of optimization. To support this, the **Amazon
    CloudWatch** observability platform offers a *cross-account observability* feature
    that can be used to analyze metrics throughout your organization, in one central
    AWS account. Let’s look at an example implementation of how this works in practice.


    # *Aggregating cross-account observability data to identify performance bottlenecks*


    When operating workloads on AWS, most organizations do not invest in building
    a centralized observability platform that can help correlate performance metrics
    in a central place. Using Amazon CloudWatch, one can leverage the embedded **Observability
    Access Manager (OAM)** feature to link multiple *source accounts* with a central
    *monitoring account*. Without incurring any costs, important indicators of performance
    bottlenecks, such as logs, metrics, and traces, can be sourced from multiple accounts
    into one central location.


    Using the AWS Organizations service, one can automatically configure the collection
    of observability data using **CloudFormation StackSets** or a similar deployment
    framework. Let’s see how these steps look in practice, in *Figure 12.4*:'
  merge: -1
  img_proc: true
- pgno: 293
  md: "![](img/ecd265dfca9bb64161408ba8a944a4d9_293_0.png)\n\nFigure 12.4: Cross-account\
    \ observability to observe metrics and identify performance bottlenecks\n\nLet’s\
    \ look at this in a bit more detail, as follows:\n\n+   1. **CloudFormation StackSets**,\
    \ under the hood, hooks into AWS Organizations events that notify the service\
    \ of any new accounts that are created in the organization.\n+   \n+   2. **CloudFormation\
    \ OAM** requires data sharing to be configured from the *source accounts*. This\
