    \ knows where to push the collected metrics to. Secondly, we define AWS_PROMETHEUS_SCRAPING_ENDPOINT,\
    \ which tells the collector where to scrape the metrics from. All these configurations\
    \ are governed by the type of config file that we are using for the OTEL collector.\
    \ The AWS OTEL collector supports several platforms where it can consume data\
    \ from or send data to. In our case, we are mostly interested in Prometheus metrics,\
    \ so we used the /etc/ecs/ecs-amp-prometheus.yaml file from the OTEL Docker container.\n\
    \n> **Note**\n> If you are interested in exploring the contents of this file and\
