- pgno: 236
  md: 'As you can notice, the first stage reports a failure, which is expected since
    there is no code in the freshly provisioned CodeCommit repository. So, let’s go
    ahead and commit the application code into the repository. CodeCommit recommends
    using the git-remote-codecommit plugin for authenticating against the HTTPS (GRC)
    endpoint. This GRC endpoint can be retrieved from the CodeCommit service page
    for your repository, in the AWS web console. The git-remote-codecommit plugin
    is already included in the Cloud9 IDE that you’ve installed in your AWS account.


    One last step before we can see the pipeline in execution is to initialize a local
    git repository and set up the git remote so that it points to our CodeCommit repository
    in the AWS account. We just need to push the application code, so let’s switch
    the working directory as well:


    ```

    aws-devops-simplified:~/environment/chapter-9 $ cd chapter-9-flask-app/

    aws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app $ git init .

    aws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app $ git checkout
    -b master

    aws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app $ git add .

    aws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app $ git commit
    -m "Sample application for DevSecOps pipeline"

    ```


    After files have been added to Git’s staging area, we can push them to the CodeCommit
    repository:


    ```

    aws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app $ git remote
    add origin codecommit::eu-central-1://image-delivery-pipeline

    aws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app $ git push origin
    master

    ...

    ```


    As soon as the commits are registered in CodeCommit, the pipeline execution begins.
    CodePipeline can now source the code from the CodeCommit repository on the configured
    branch (master). Let’s dive into the result of security assessments that are configured
    in the pipeline.


    # Checking the result of security assessments


    Every stage of the pipeline validates some or the other aspect of the application
    against security risks. We follow the same *inside-out* principle and start from
    the application itself, before moving on to Docker validations.'
  merge: -1
  img_proc: true
- pgno: 237
  md: "# Software Composition Analysis with dependency-check\n\nIf you observe the\
    \ output of the pipeline execution, you will notice that the first stage, ApplicationValidation,\
    \ reports an error in the SCAcheck CodeBuild action. Checking the CodeBuild build\
    \ execution log reveals a finding in the Flask framework and since the criticality\
    \ exceeds the threshold value of 7 (as configured in the buildspec.yml file),\
    \ an error has been raised. Such security validations flag any new dependency\
    \ that your developers might introduce into the application. The criticality of\
    \ these findings can vary, and not all would be relevant, but having some false\
    \ positives is still better than no reporting at all.\n\nIn this case, the OWASP\
    \ dependency-check utility, in addition to flagging a potential risk, gives us\
    \ a URL that contains more information about the specific CVE that has been reported:\n\
    \n```\n\"vulnerabilities\": [\n  {\n    \"source\": \"OSSINDEX\",\n    \"name\"\
    : \"CVE-2023-30861\",\n    \"severity\": \"HIGH\",\n    \"cvssv2\": { \n     \
    \ \"score\": 7.5,\n    ...\n    ...\n    \"cwes\": [\n      \"CWE-539\"\n    ],\n\
    \    ...\n    \"description\": \"Flask is a lightweight WSGI web application framework.\
    \ When all of the following conditions are met, a response containing data intended\
    \ for one client may be cached ... https://ossindex.sonatype.org/vulnerability/CVE-2023-30861\n\
    \    ...\n```\n\nAs shown in Figure 9.4, visiting the CVE URL in your web browser\
    \ further explains how certain configurations in the Python Flask framework can\
    \ be exploited. dependency-check parsed the requirements.txt file to figure out\
    \ the third-party dependency names and their version. It then verified these dependencies\
    \ against the publicly available vulnerabilities database – in this case, NVD.\
    \ Since the version we are using in the application is flagged as a potential\
    \ risk, it was called out by the dependency-check utility. However, in this case,\
