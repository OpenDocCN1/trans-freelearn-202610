    See More\n\n> Deviation Notice:\n> Sonatype's research suggests that this CVE's\
    \ details differ from those defined at NVD or other reporting sources; sign in\
    \ for details.\n\nFigure 9.4 – CVE finding reported by the dependency-check utility\n\
    \n# Tip\n\nOn every run, utilities such as dependency-check download all the CVEs\
    \ from public databases and store them locally for evaluation. As CodeBuild environments\
    \ are ephemeral, it leads to a loss of information every time the build completes.\
    \ This results in really high execution times (>5 minutes) for each run. This\
