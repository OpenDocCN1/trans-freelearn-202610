- pgno: 217
  md: '# Implementing DevSecOps with AWS


    Equifax, a credit reporting agency, reported unauthorized access to the personal
    records of 143 million US citizens in a data breach in 2017 that went unnoticed
    for 76 days (https://www.csoonline.com/article/3444488/equifax-data-breach-faq-what-happened-who-was-affected-what-was-the-impact.html).
    What started as Common Vulnerabilities and Exposures (CVE) in Apache Struts, a
    well known framework used by Java applications, resulted in financial and reputational
    damage for the company. Even after corrective measures, a few servers remained
    unfixed due to the dependency on manual processes. These gaps, combined with teams’
    lack of awareness of security breaches in general, were exploited by malicious
    actors to gain access to one of the servers, and then several others. Security
    incidents like these harm business health and, most importantly, result in loss
    of customer trust, along with reputational damage.


    The evolution of software practices and rapid cloud adoption has further contributed
    to the surge in security risks that modern applications are exposed to. This is
    mainly caused by increasing dependencies on third-party software modules, frequent
    changes, and multiple levels of abstraction that are now part and parcel of every
    software artifact that gets deployed. Security these days is no longer about a
    monolith Java application deployed on-premises, for example. The same application
    might have now transformed into a set of microservices, each exposing an API,
    and deployed as a container image, onto a Kubernetes cluster running in the public
    cloud. In addition to the application code itself, we have several other layers
    to secure. What if there are vulnerabilities in the base container image or the
    custom libraries that we add on top? How do we manage secure HTTPS communication
    interfaces for all microservices at scale? Securing other components such as the
    Kubernetes control plane and cloud networking configurations, which are more of
    a black box to the developers, is a different challenge altogether. Furthermore,
    how is all of this going to be handled on an ongoing basis, ensuring that every
    new line of code that is written still adheres to the security standards we have
    set?'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'As you can see, the new software patterns have introduced risk dimensions that,
    in most cases, are not easy to fix, or even identify, as the software teams often
    don’t have the required depth and visibility into these layers themselves. However,
    with a focused effort in three areas – let’s call it the *AEA framework* – they
    can ensure good security coverage for their workloads in the cloud:


    +   - *Awareness* of the existence of security risks in your systems, and the
    corresponding criticality

    +   - *Enablement* of people so that they can comprehend and act on any information
    or alert that comes up

    +   - *Automation* to detect these security risks as early as possible in the
    delivery chain


    These three aspects are going to be the theme of this chapter and we will learn
    about them in the light of an important concept called **DevSecOps**. Similar
    to how DevOps enables software teams to culturally transform and deliver software
    faster, DevSecOps introduces new ideas and practices that focus on security. DevSecOps
    should be seen as an iteration of your DevOps practices in the sense that it wraps
    an additional security layer to your existing development and operational processes.
    This is fundamentally different from traditional software development approaches,
    where security was seen as an afterthought.


    At a broader level, we will cover the following topics in this chapter:


    +   - Trade-offs and challenges of security

    +   - What is DevSecOps?

    +   - Securing your workloads in AWS

    +   - Rolling out a test CI/CD workflow for DevSecOps


    > **Tip**

    > If you are curious about the different types of security risks in the cloud
    and how they could impact you, I recommend reading this blog: https://appinventiv.com/blog/cloud-security-risks-and-solutions/.


    The key requirements for consistently rolling out software artifacts with a high
    degree of success are *automation* and *effective feedback cycles*. Driven by
    this idea, a DevOps strategy aims to optimize every single step of the software
    delivery life cycle. A developer writes code on their local machine and commits
    the changes to a version control system. At this point, the delivery pipelines
    take over, testing the changes and creating a new version of the software artifact,
    providing feedback at every stage. If all test cases are green, it promotes the
    artifacts to subsequent environments in the delivery chain, eventually taking
    the changes to pre-production or production. However, in practical scenarios,
    this is easier said than done, especially when releasing software artifacts at
    a rapid scale. While several factors can slow you down, the most critical one
    to accommodate is security. Let’s see why that is the case.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Trade-offs and challenges of security


    Every software team can have its own unique set of challenges to solve, be it
    technical or cultural. Before we dive into the specifics of DevSecOps, let’s try
    to understand what led to the need for an iteration of existing DevOps methodologies.
    Along the way, we will discuss why security can sometimes be seen as a resistive
    effort, instead of a positive push to continuous application delivery. In my experience
    working with different teams, there are four main patterns that I have commonly
    observed to be the root cause of this slow-down:


    +   - Lack of ownership

    +   - Last step in software delivery

    +   - The rapid evolution of application architectures

    +   - Outdated security tools


    Let’s look at each of these in detail.


    # Lack of ownership


    Often, developers and operation team members *don’t feel responsible* for the
    security posture of their applications. Being on the other side of the spectrum,
    which involves building new features and rolling them out on production, they
    see security as something that hinders growth. The security adherence is left
    to a professional that sits in another room.


    Unless this becomes a shared responsibility and the team members start contributing
    to identifying and fixing issues collaboratively, security will continue to be
    a show-stopper. The entire software delivery process is going to be *as fast as
    the weakest link* in the chain – and we don’t want security to be there. Furthermore,
    it’s important to highlight that adopting DevOps comes with security as a recurring
    theme in everything that you do, to give you immediate benefit.


    # Last step in software delivery


    In the previous chapters, we discussed quite a few things around infrastructure
    automation, application delivery, and how we can optimize most of these tasks
    by adopting DevOps methodologies. However, a critical step in the software release
    cycles that we haven’t discussed enough is security. The problem is not with the
    *criticality* that slows down the teams – it’s more to do with it being the *last
    step*.


    Traditionally, software teams developed features with a waterfall model approach
    and pushed them over the fence to the security team, close to the go-live date.
    These mammoth releases make it very difficult to accurately identify all the security
    risks that the new code opens up the application to. Manual testing takes time
    and eventually, all of this leads to a divergence between the pace at which software
    is developed, and the pace at which it is released. As a DevSecOps practitioner,
    you should always keep an eye on such bottlenecks as they can slow down your team,
    resulting in frustration, delays, and reduced confidence. But what exactly makes
    security audits slow?'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# The rapid evolution of application architectures


    An important dimension that we cannot overlook is the evolution of application
    architectures over the past years, which, in a way, has added an additional burden
    to security investigations and sign-offs.


    These days, monolith applications are broken down into microservices, resulting
    in hundreds or thousands of APIs. Previously, you just needed to safeguard countable
    entry points, but now, you have a dynamic scale to manage. Highly secure environments
    further enforce communications over mutual TLS (mTLS) between these microservices.
    This results in the need to manage a lot of certificates. From an operational
    and scalability standpoint, a common next step is to look into containerization
    options. Since running these containers reliably at scale is not an easy feat,
    the orchestration provided by a managed container platform becomes the ideal next
    step. Of course, who doesn’t want to simplify the management of these platforms
    so that a good chunk of these applications makes cloud providers such as AWS their
    new home?


    If you take a brief pause at this point and look at this gigantic shift from a
    security perspective, you will notice that all of this has greatly contributed
    to an increase in the attack surface and introduced new risks that the teams now
    need to safeguard themselves against. Things are no longer constrained to the
    application itself, but also the abstraction layers that are built on top – that
    is, APIs, container abstractions, and cloud platforms – each having their share
    to contribute.


    # Outdated security tools


    Security professionals, on the other hand, have since long been used to a specific
    set of tools that might not have evolved as fast as the fancy innovations in software
    development. As a result, security not only needs to keep up with the new tools
    that the developers adopt but also be on the constant lookout for new attack surfaces.
    In some cases, this might warrant the need for finding new security tools, adopting
    third-party cloud security software, or even developing bespoke solutions.


    All of this leads to one important point – security is never done. *It’s an ongoing
    cycle of improvement.* This makes it very difficult for security professionals
    working in modern software teams to keep up with the pace of delivery. Potential
    risk surfaces have increased manifold and this cannot be tackled with manual testing
    anymore, and at the same time, we cannot wait until the very end of the software
    delivery process. Therefore, injecting security scans at every single step of
    the delivery life cycle is key, and this is what DevSecOps is all about.


    # What is DevSecOps?


    Simply put, DevSecOps is the practice of integrating security tests into every
    stage of the software delivery life cycle. It is an *extension* of the DevOps
    approach that we have discussed so far in this book. Using tools and processes,
    it promotes collaboration between development, operations, and security teams.
    This results in software artifacts that are not only operationally efficient to
    produce but also safe to be released in production, at any point in time. Similar
    to DevOps, DevSecOps also brings in a cultural shift around how we approach security
    in conventional software delivery processes. Security'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'teams should no longer be seen as some form of resistance, but more as enablers
    of the adoption of security best practices in the organization.


    Before we move further, I would like to clarify one point that you might be thinking
    of at this stage – the difference between DevOps and DevSecOps.


    # How is it different from DevOps?


    The core idea behind DevOps is to get the application into the hands of the end
    user as fast as possible. While this revolves a lot around cultural transformations,
    automation tools, and processes, security can sometimes be left behind. Software
    teams often see security as an isolated process, or team, that comes into the
    picture only before a deployment. In some cases, these security clearances and
    processes might as well be completely overlooked, which is an even more critical
    situation to be in.


    DevSecOps, on the other hand, aims to address this gap by ensuring a seamless
    integration of security practices into day-to-day development activities. Developers
    and operations team members work together with security professionals to share
    the responsibility of releasing secure artifacts to the end user every single
    time. This collaboration often results in the adoption of automations and tools
    that extend the current CI/CD processes used by these teams.


    One important thing I would like to highlight here is that your DevSecOps success
    will be largely defined by how stable your DevOps foundations are. It can only
    be built on top of existing implementations of DevOps practices, such as continuous
    integration, operational procedures, and team culture. It is an approach to further
    amplify the returns of your DevOps investments and gain from the benefits offered
    by continuous security enforcement and validations.


    To justify the need of adopting certain practices or ways of working, it’s important
    to analyze the benefits that come with it. We’ll discuss this next.


    # Key benefits of DevSecOps


    There are a lot of areas that are positively influenced by the adoption of DevSecOps
    practices in the software development life cycle (SDLC). While every team’s mileage
    would vary, certain benefits apply to most teams. Let’s take a look.


    # Reduced time to market


    Lack of security awareness and automated code validations can hamper the benefits
    you might achieve with the adoption of just DevOps. Along with releasing frequent
    code changes multiple times a day, DevSecOps ensures that software developers
    are safeguarded from unknown security risks that can result in a degraded end
    user experience and loss of trust. Reduction of time in security assessments automatically
    increases the software deployment rate.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Improved security awareness of team members


    Developers and operation team members often find themselves in situations where
    they could easily adopt an existing open source tool or third-party library to
    implement functionality. While it is always a good practice to approach these
    decisions with a build versus buy mindset and not reinvent the wheel, usage of
    such external code bases can lead to unknown risk exposures. It might as well
    be the case that a library that is safe to use now might not be safe enough with
    future release iterations. In the Rolling out a test CI/CD workflow for DevSecOps
    section, we will cover some security tools that scan the code against public vulnerability
    databases (such as National Vulnerability Database (NVD)) that are continuously
    updated. This drastically improves the awareness of everyone involved in the delivery
    of code. In addition to identifying risks, most of these tools also help the developers
    with suggestions on how to immediately fix the vulnerability.


    Being aware of such problems is a great benefit that comes with the adoption of
    integrated security practices advocated by DevSecOps.


    > **Note**

    > A good example that fits here is the zero-day Log4j vulnerability from 2021,
    which exposed security loopholes in the Log4j logging utility, commonly used in
    Java programs. If you were not exposed to this news, I recommend reading more
    about it at https://builtin.com/cybersecurity/log4j-vulnerability-explained.


    # Develop new features with confidence


    While security is an ongoing process, the feedback that’s received via automated
    validations and code checks helps fix problems sooner, resulting in increased
    confidence in software developers. They can trust the scans performed by multiple
    tools in the delivery chain and be at least confident about a minimum baseline
    of security posture being met.


    # Improved compliance in regulated environments


    Regulated industries such as pharmaceuticals, defense, and aerospace follow traditional
    development practices that involve a lot of manual testing procedures. To comply
    with multiple regulations and standards, it becomes difficult for them to release
    code changes at a scale similar to how other non-regulated companies, with fewer
    things to worry about, would do. This has a direct impact on the release velocity
    and productivity of the software teams.


    Additionally, they need to maintain software applications for a much longer time,
    and the changes in the underlying platform and infrastructure warrant the need
    for continuous evaluation procedures that can be repeated even for the smallest
    of code changes.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# *Early identification of issues*


    DevSecOps tooling automations can kick off as early as when the developer commits
    code to their local git repositories. By leveraging git’s `pre-commit` hooks,
    they can benefit from the feedback of these code scans even before they push the
    changes to a remote repository.


    > Tip

    > **Trufflehog** is one such tool that stops you from accidentally committing
    secrets into your source code. You can read more about this tool and how you can
    configure it as a pre-commit hook at `https://github.com/trufflesecurity/trufflehog`.


    This controls any risk exposures that are introduced by recent code changes. The
    problems are easier to fix as the developers have a full context of what they
    were trying to do and the modifications are still fresh in their mind.


    A *defense-in-depth* strategy also ensures that similar guardrails are applied
    and evaluated at multiple stages of the code development process. So, even if
    the local configurations on a developer’s machine are not functional, such risks
    can be mitigated at the next level, which could be a server-side hook configured
    in the remote repository management system, such as **GitHub** or **GitLab**.


    An important aspect of DevSecOps that we have been discussing a lot is the cultural
    shift and change in roles and responsibilities. Next, we’ll discuss what this
    means for the different personas in a software team.


    # What it means for security professionals


    Security colleagues have always been seen as some sort of gatekeepers and are
    ultimately responsible for any security risks that come up. As per DevSecOps methodology,
    this needs to change. Instead of resisting frequent code modifications and releases,
    they should act as enablers. The mantra for success for these professionals should
    be *guardrails but not blockers*. They need to continuously learn how DevOps works
    across the organization and evolve security processes by embedding the controls
    right into the DevOps methodologies.


    # *Define security policies for both application and infrastructure*


    Security risks are now multi-dimensional. They apply to anything that is managed
    as code – so both infrastructure and applications. Security professionals should
    focus on defining the policies around what these code bases should and should
    not be allowed to do. Rather than dictating granular policies for each application
    or team, they should invest effort in establishing guardrails that protect the
    company and individual teams.'
  merge: -1
