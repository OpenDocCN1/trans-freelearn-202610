- pgno: 27
  md: 'instance and read replicas. Every minute of downtime or system degradation
    directly impacted shipping, packaging, and order invoicing. During that time,
    the developers were using local MySQL instances to develop and test new features
    and would later ship them off to staging, followed by production rollout.


    With the problem statement clear, a promising next step was to enable them to
    develop and test in *production-like* environments. This would allow them to see
    how their systems were reacting to evolving customer usage, and to have a better
    understanding of the production issues at an earlier stage.


    With a strong understanding of Bash scripting (...or at least I thought so) and
    basic MySQL administration skills, I decided to build shell scripts that could
    prepare these testbed environments, and refresh them with the most recent production
    data, on a daily basis. A request for a similar number of new MySQL servers was
    raised with the on-premises infrastructure team. They provisioned them in a week,
    set up the operating system, and required libraries for MySQL, before handing
    over to me my *newly acquired liability*. Moving forward, all maintenance and
    upkeep of these servers were my responsibility. I later scheduled cronjobs on
    all these servers to run the scripts created previously. They would perform the
    following steps at a pre-configured time of the day:


    +   1. Copy the previous day’s production backups from the fileserver to the local
    filesystem.

    +   2. Remove all existing data in the local MySQL database.

    +   3. Dump the new backup data into the local MySQL database.

    +   4. Perform data anonymization and remove certain other confidential tables.


    You can see how the different entities communicated in the following figure:


    ![](img/ecd265dfca9bb64161408ba8a944a4d9_27_0.png)


    Figure 1.1: Bash scripts to manage database operations'
  merge: -1
  img_proc: true
