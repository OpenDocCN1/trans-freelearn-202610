- pgno: 141
  md: 'The teams adopting such tools will still require some understanding of how
    services such as AWS CloudFormation function under the hood, what kind of constructs
    (building blocks) they expose to the end user, and so on.


    # Using frameworks that offer high-level abstractions


    Once users are comfortable with services such as AWS CloudFormation and have gained
    substantial experience debugging production-grade rollouts, they might consider
    adopting tools such as **AWS CDK** and **Pulumi**. AWS CDK offers an approach
    to managing infrastructure with general-purpose programming languages such as
    TypeScript, Python, Go, Java, and so on. As an official AWS offering, it has some
    advantages in terms of long-term commitment, support, and development from the
    cloud provider.


    Another famous IaC platform that operates in this space is Pulumi. There are some
    key differences between how Pulumi and AWS CDK function, but from an end user
    perspective, the features are more or less the same – infrastructure resource
    management with commonly used programming languages. Pulumi, like AWS CDK, offers
    integrations with general-purpose programming languages, but this support is not
    limited to just AWS. It also provides more than 60+ integrations with other cloud
    or SaaS providers.


    # Pulumi versus CDK


    Under the hood, AWS CDK is more of a **transpiler**. Transpilers are programs
    that convert a piece of source code from one high-level language into another.
    The output from these programs has the same level of abstraction as the input.
    This is fundamentally different from compilers as they produce low-level code
    that directly interacts with the underlying machine, and is more performant.


    Pulumi, on the other hand, offers deeper integrations with the programming runtime
    and the cloud provider by not depending on an intermediate state, such as AWS
    CloudFormation templates in the case of AWS CDK. Pulumi takes control of managing
    the life cycle of the resources that the user defined a target state for. This
    level of integration provides additional benefits with efficient unit and integration
    testing capabilities by leveraging mocked responses and other constructs.


    Figure 6.1 shows a visual mapping of the different infrastructure management approaches
    and the corresponding tools and frameworks:'
