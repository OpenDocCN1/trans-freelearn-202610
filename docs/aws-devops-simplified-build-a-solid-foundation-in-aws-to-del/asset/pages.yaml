  md: "typically name their fleet of servers with functional identifiers such as web001,\
    \ web002, web003, and so on. If web002 stops functioning, the server would be\
    \ de-registered from the fleet and then replaced with a healthy new machine. The\
    \ infrastructure elasticity of the cloud empowers this. Typically, these processes\
    \ are entirely automated, and the end users, or the operation engineers hardly\
    \ notice any service interruption. However, this does require some adaptation\
    \ and architectural considerations in the application design to support such operative\
    \ procedures. For example, a de-registered server for a stateful application should\
    \ still complete in-flight work, persist all information to disk, and then prepare\
    \ for a graceful shutdown. Applications need to be programmed to handle these\
    \ signals.\n\nAs you can see, it all comes down to a shift of mindset where the\
    \ infrastructure is no longer treated like pets, but more like a herd of cattle.\
    \ If you think of a server that can be easily recreated and replaced at any time,\
    \ it's part of a herd. If you consider a server indispensable, then it's a pet.\n\
    \nIt's important to highlight that maintaining pets in the cloud takes you further\
    \ away from leveraging the real benefits of the elastic infrastructure. You should\
    \ be designing your architectures with failure in mind, all the time. What is\
    \ more important is to architect an application that seamlessly recovers from\
    \ failures. Once this is ensured, your applications can leverage the cloud in\
    \ the best way possible.\n\nIn the words of AWS's CTO:\n\n> \"Failures are a given\
    \ and everything will eventually fail over time: from routers to hard disks, from\
    \ operating systems to memory units corrupting TCP packets, from transient errors\
    \ to permanent failures. This is a given, whether you are using the highest quality\
    \ hardware or lowest cost components.\"\n> \n> – Werner Vogels, Chief Technology\
    \ Officer and Vice President, Amazon\n\nHaving covered the foundational differences\
    \ around how you perceive your infrastructure, let's discuss the benefits offered\
    \ by immutable infrastructure – a key enabler for the adoption of the cattle mindset.\n\
    \n# Mutable and immutable infrastructure\n\nInfrastructure resources created on-premises,\
    \ or in the cloud, can either be modified in place or be completely replaced with\
    \ a new instance. It is usually not a problem to modify the servers, which involves\
    \ upgrading libraries, rolling out new application code, or changing configuration\
    \ settings in the early days. However, as your workloads scale, these in-place\
    \ upgrades risk the reliability of the applications and complicate the testing\
    \ and operational procedures. Before diving into the benefits of the immutable\
    \ infrastructure, it's important to introduce you to mutable infrastructures and\
    \ explain their trade-offs. Let's discuss this in the light of a real-life example,\
    \ where I managed a Java-based web application on a Tomcat web server."
