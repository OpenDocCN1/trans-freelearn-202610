- pgno: 61
  md: 'Such *half-failed* scenarios contribute to major problems around the following:


    +   - Lack of testability of all possible permutations and combinations

    +   - Complex debugging procedures

    +   - Unreliable software applications


    The life cycle of cloud resources is easy to manage and automate through APIs
    and SDKs provided by cloud providers such as AWS. This has paved the way for the
    adoption of immutable infrastructure practices – let’s see what it is and the
    benefits it provides.


    # Immutable infrastructure


    Immutable infrastructure is a strategy that promotes the idea of *replacing* your
    software components with IT resources instead of *modifying them in-place*. Whenever
    a change needs to be rolled out, an application or service undergoes a complete
    redeployment. All the components in the stack, starting from the underlying OS,
    libraries, dependencies, and the application code, are packaged and deployed as
    a *discrete unit*.


    In the AWS world, one way to adopt the concept of immutable infrastructure is
    by using EC2 **Amazon Machine Images (AMIs)**. You version and release the entire
    image with all dependencies baked in. Modifications to the live servers are discouraged
    as it leads to issues such as configuration mismatch, which eventually affects
    system stability and reliability. You no longer need to care about the myriad
    configuration combinations, as we discussed in the context of mutable infrastructures.
    The users can now test if the entire stack, which represents all the components
    and dependencies of the application, works or not. The scenarios where it doesn’t
    work surface much earlier in the software delivery process, so it’s easy to fix
    the underlying problem. Furthermore, not requiring direct access to the machines
    backed by these AMIs increases system reliability and promotes security best practices.
    With automated testing procedures, this image can also be tested in isolation,
    followed by replacing the servers in the cattle fleet.


    Adopting this approach in the Java web stack allowed us to get rid of all issues
    around configuration mismatch, security risks, and networking. Combining the AMI
    concept with Amazon EC2’s Auto Scaling service further simplified the rollout
    of new changes. With an API call, the users could map the entire fleet to a new
    version of the AMI, gradually replacing all the servers automatically.


    There is, however, one important aspect of application design that you need to
    consider when adopting infrastructure immutability.'
  merge: -1
  img_proc: true
