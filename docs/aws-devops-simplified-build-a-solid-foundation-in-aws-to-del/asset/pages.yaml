    # # Summary


    This chapter laid the foundations of immutable infrastructure and the benefits
    of adopting this approach for managing software at scale. This is important for
    delivering solutions with increased reliability and confidence. The same approach
    can easily be adopted on-premises, but AWS shines in this space as its infrastructure
    elasticity fits particularly well with such methodologies.


    Those of you who have not used AWS before will also benefit from this chapter
    as we have covered creating an AWS account and security best practices around
    the usage of root credentials. It also provided some hands-on practice with the
    AWS CLI, and the toolbox setup. All of this will help you in the upcoming chapters
    as the hands-on exercises in this book will leverage the tooling baked into the
    Cloud9 IDE.


    Finally, we used tools such as Packer to create an AMI and deployed an EC2 instance
    hosting the Python web server application. We used some resources such as a default
    VPC and the subnets that were pre-created by AWS when we set up our account.


    In *Chapter 4, Managing Infrastructure as Code with AWS CloudFormation*, we will
    dive deeper into managing these resources as code.


    # # Further reading


    To learn more about the topics that were covered in this chapter, take a look
    at the following resources:


    +   - The AWS services offered in the free tier: `https://aws.amazon.com/free/`\n-
    Packer tutorial for building an AWS AMI: `https://developer.hashicorp.com/packer/tutorials/aws-get-started/aws-get-started-build-image`\n-
    AWS security best practices: `https://aws.amazon.com/architecture/security-identity-compliance/`'
