- pgno: 252
  md: 'As a DevOps practitioner, your goal should be to ensure that the result of
    this analysis matches the expectation from the workload or the value stream. These
    categorizations are highlighted in *Figure 10.4:*


    | Cluster | Stability: Time to restore service | Stability: Change failure rate
    | Operational Performance: Reliability | Throughput: Lead time | Throughput: Deployment
    frequency | % respondents |

    |---|---|---|---|---|---|---|

    | Starting | Between one day and one week | 31%–45% | Sometimes meet expectations
    | Between one week and one month | Between once per week and once per month |
    28% |

    | Flowing | Less than one hour | 0%–15% | Usually meet expectations | Less than
    one day | On demand (multiple deploys per day) | 17% |

    | Slowing | Less than one day | 0%–15% | Usually meet expectations | Between one
    week and one month | Between once per week and once per month | 34% |

    | Retiring | Between one month and six months | 46%–60% | Usually meet expectations
    | Between one month and six months | Between once per month and once every 6 months
    | 21% |


    Figure 10.4 – Clustering software delivery and operational performance metrics
    to identify the current state of the workloads (source: Accelerate 2022 State
    of DevOps report)


    # De-silo Dev and Ops


    Many organizations might divide their teams into separate functional areas, leading
    to groups consisting of developers, operations, QAs, and so on. This model keeps
    you away from the benefits that shared responsibility, ownership, and team cohesion
    can bring on your DevOps journey. The whole idea of the DevOps methodology is
    to break down these silos, ensure teams speak more often, are aligned on what
    the end customer needs, and collaborate on achieving this goal. The wall that
    exists between these teams creates resistance to change that is detrimental to
    reliably releasing software more often. Developers who have had some system administration
    background in the past should actively involve themselves in improving the operations
    of the software. Operators, on the other hand, might be well versed in some application
    programming languages, so they could leverage those capabilities to assist the
    developers in reliably rolling out changes at scale.


    However, introducing this change in organizations that have since long been using
    these siloed models might face some resistance. A strategy that I’ve seen work
    quite well in such teams is to temporarily *embed* DevOps practitioners into the
    teams who can act as agents of change. By introducing new practices around development,
    operations, and communications backed by automation and tooling, they can motivate
    the team members to think beyond their preset boundaries and focus on driving
    customer value.'
