- pgno: 257
  md: '# Driving change from the bottom up


    There are multiple levels of influence within a company, starting from the CEO
    and coming down to the engineer writing code that delivers value to the customer.
    As a DevOps practitioner, it can sometimes become a challenge to *sell* ideas
    or benefits behind adopting a tool or automation that can help the wider team
    in delivering more value to the customers. This section covers some tips that
    you could consider to demonstrate the real value of what you are proposing. This
    is not easy because your level of influence as an individual contributor might
    not offer you a position to push ideas downwards. But the good part is that you’re
    in a unique position to actually *implement* a change at the ground level and
    quickly *validate* the idea to demonstrate tangible value. Within this scope,
    you can easily take the first steps around breathing life into your proposal and
    see if it works for you. Once it does, it’s time to push it forward. Let’s discuss
    a few things that will help you sell your DevOps ideas higher up in the organizational
    chain.


    # Structure your ideas well


    Don’t start with the deepest technical implementation details when describing
    your ideas. Focus on the value it provides and how that leads to success. If you’ve
    built a tool that injects failures into various components of the architecture
    stack to test their resiliency, make sure you highlight the value all your customers
    get by adopting this approach. While this certainly helps the software developers
    test the resiliency of their application stack and how the code behaves during
    disasters, it ultimately benefits the end customers as well since the application
    they use will be more reliable and sustain the unexpected scenarios quite well.


    # Demonstrate commitment


    Develop a **proof of concept (PoC)** that works end-to-end and demonstrates the
    benefits of using it. This shows that you are committed to the idea and will not
    leave it unfinished. Furthermore, by doing this, you either reduce or completely
    remove the potential risk of something resulting in a wasted effort for the stakeholder.
    It makes it a lot easier to get buy-in and experience the idea in a working form.


    # Find collaborators and share good practices


    Once the initial PoC has been validated, you might want to look for additional
    collaborators within and outside your team and share the benefits of adopting
    the tool, or automation, with a larger group. In addition to getting feedback
    on the current state of implementation, this also helps you gather ideas and problems
    from other team members. Demonstrating these PoCs in CoP sessions, for example,
    could be a good way to take things forward.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Summary


    We started this chapter by highlighting the importance of integrating both people
    and technology in the DevOps realm for successful initiatives. While people drive
    the cultural and collaborative aspects of DevOps, technology provides the necessary
    tools and infrastructure. The most important takeaway should be to focus on establishing
    the right foundations of team culture and the working model before adopting technology.


    We then moved on to discussing some team working models that provide the right
    balance of ownership, ease of management, and autonomy. Even if they do not fit
    as-is into your organization, they can act as a target model that you would eventually
    want to transition into. By doing this, you will already start reaping the benefits
    they provide. Next, we discussed technical best practices that can help your teams
    adopt the AWS services in the best way possible. Making technology decisions while
    considering business needs, building the right abstractions, and developing reusable
    workflows can help everyone on your team perform better.


    Of course, doing all of this can sometimes lead to role transitions within the
    company. To make this transition as smooth as possible, we discussed some strategies
    for continuous learning and development, and how to drive change from the bottom
    up – a common challenge that individual contributors face. In the next chapter,
    *Ensuring a Strong AWS Foundation for Multi-Account and Multi-Region Environments*,
    we will look at best practices for operating multi-account environments in AWS.
    Additionally, we will look into some AWS services and open source solutions that
    can help orchestrate such an environment as code.


    # Further reading


