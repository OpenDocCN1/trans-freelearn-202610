- pgno: 171
  md: 'Having covered the primary constructs in ECS, let’s also discuss some security
    best practices that will help you ensure a good cloud posture for your organization.


    # Ensuring a good security posture with ECS


    Security guardrails can have multiple dimensions. AWS offers services that cater
    to most of these needs – be they Route53 DNS, firewall, network packet inspection
    through a network firewall, network access control lists for subnets, or security
    groups for managing traffic at the interface level. In the context of ECS (and
    containers in general), let’s discuss some low-hanging fruits that can provide
    big security benefits.


    # Locking down permissions with IAM roles


    IAM is what defines everything around authentication and authorization in AWS.
    ECS is no different. The service allows you to define and map IAM roles at the
    ECS agent level, as well as the application task level. They are known as ECS
    Task Execution Role and ECS Task Role. The ECS task agent will typically require
    access to the ECR registry, SSM parameters, and CloudWatch logs. In addition to
    this, you can restrict the permissions for the application running inside the
    ECS container. When the application container bootstraps, ECS ensures that dynamic
    credentials are injected into it. This helps you avoid having to manage long-term
    static security credentials, which can be a security risk.


    # Ensuring security patch readiness when CVEs are identified


    With ECS on Fargate, you can offload the security patching work to AWS and the
    cloud provider takes responsibility for dynamically patching your instances for
    any newly identified Common Vulnerabilities and Exposures (CVEs). However, if
    you are running ECS on EC2, you have to be aware of the Shared Responsibility
    Model from AWS (https://aws.amazon.com/compliance/shared-responsibility-model/).
    The most important thing to remember is that AWS is responsible for the security
    of the cloud, and the customer is responsible for security in the cloud. This
    applies not only to containers but also the entire AWS ecosystem in general. So,
    regularly patching the EC2 instances is the customer’s responsibility and can
    be easily managed by dynamically updating the affected libraries or adopting the
    idea of infrastructure immutability, as discussed in Chapter 3, Leveraging Immutable
    Infrastructure in the Cloud. This essentially means that you can replace the whole
    AMI with a new official artifact from ECS as soon as it is available. However,
    this requires a solid software delivery and test process that is automated.


    # Network isolation using the task-level ENI


    ECS is quite flexible when it comes to networking the properties of the tasks
    in your cluster. There are three modes: host, vpc, and bridge. From a security
    standpoint, this capability allows you to manage the network traffic for this
    container, just like you would do it for an EC2 instance. Depending on what networking
    mode you use, you can either isolate the container within the boundaries of the
    underlying host with a bridge network, use the VPC constructs to assign ENIs directly
    to the containers, or completely abstract the containers behind the host IP using
    the host mode.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Tasks that solely focus on some sort of batch processing can be run in isolation
    by leveraging the Docker-managed bridge network. For others, where you would like
    to expose the workloads outside the host, you could use the other two modes.


    # Container secrets and kernel capabilities


    Injecting secrets into the container environment can be achieved by defining the
    relevant keys, and respective values, in your container definitions. However,
    when dealing with secure parameters, you can make use of the Secrets Manager integration
    to avoid leaking any confidential data as part of the code, or related configurations.


    All applications running inside containers need system call capabilities to perform
    some functions. ECS makes it possible to granularly assign the exact system calls
    that should be allowed by the particular task. Unless you are running container
    workloads that need to make some changes directly on the underlying host, you
    should try and avoid *privileged* mode. This essentially makes the container behave
    like a root user on the underlying host.


    # Deploying a test application on ECS


    It’s always fun to see what we’ve learned in action. Based on what we have explored
    so far, let’s get our hands dirty by deploying a test application on Amazon ECS.
    This time, we’ll create a new application that you can also use and customize
    beyond the scope of this chapter, as per your personal preferences – a **To-Do
    List Manager**.


    We will sprinkle some data persistence elements into the application architecture
    to make it as close as possible to real-life usage patterns, where you would like
    to add new tasks and delete a few others daily. Let’s outline the main components
    of the application, as highlighted in *Figure 7.2*.


    # Understanding the test application architecture


    To-Do List Manager is an application that allows you to manage all the tasks that
    you accomplish in your day-to-day routine. In this exercise, we will develop and
    host two features: creating new tasks and deleting the ones that are complete.
    You can also further extend the scope of the application and personalize it to
    your taste. Several application- and infrastructure-level components communicate
    with each other to expose task management capabilities to the end user. They can
    be broadly categorized into two segments – **infrastructure components and application
    components**.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Infrastructure components


    These are the services that support the underlying infrastructure foundations
    on top of which the application runs. As always, you need a VPC, subnet, and corresponding
    route tables for traffic flow management. Once the user requests hit an Application
    Load Balancer hosted on the edge, it forwards the packets to an ECS cluster, which
    then returns a HTTP response, based on the type of request that was sent. As we’ve
    already discussed in this chapter, ECS is further composed of services, tasks,
    and task definitions. We will make use of all of them to host our Python-based
    web application in an AWS account.


    As we saw in the previous chapter, A Programmatic Approach to IaC with AWS CDK,
    it’s very efficient to leverage existing CDK constructs to build and deploy AWS
    infrastructures at scale. This enables us to avoid investing a lot of time in
    writing CloudFormation templates from scratch. Therefore, we will define the entire
    infrastructure required in this chapter using AWS CDK.


    The following are the three layers under the infrastructure segment:


    +   - **Network infrastructure (VPCs, subnets, and route tables)**: We will create
    a standard 10.0.0.0/16 VPC CIDR block for this exercise and carve out two public
    and two private subnets, each with a /24 mask. We will offload all the tasks around
    route table creation, route entries, NAT gateways, and internet gateways to CDK
    using the aws-cdk-lib/aws-ec2 library.


    +   - **Container platform (ECS)**: Within the scope of ECS, we will create task
    definitions that allocate compute and memory resources, and further define two
    containers for the application and the database. To have an always running application
    instance, we will wrap it into an ECS service that integrates with the Application
    Load Balancer. As we don’t want to manage any EC2 instances, we will use the Fargate
    launch type, thereby offloading this responsibility to the ECS service.


    +   - **Traffic controller (Application Load Balancer)**: To receive requests
    from the end user, we will create a public-facing Application Load Balancer and
    drop its interfaces into the public subnets of the VPC. ECS automatically registers
    the running containers with the respective target group, thereby abstracting the
    container port, 5000 (used by Flask), behind the regular HTTP 80.'
