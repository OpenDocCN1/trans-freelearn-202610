- pgno: 116
  md: "# Key features offered by CodeCommit\n\nIn addition to generic code management\
    \ capabilities, several other highlights help you establish controls to meet your\
    \ organization’s coding, security, or compliance requirements.\n\n# Granular security\
    \ controls with IAM\n\nRestricting access to protected branches is as simple as\
    \ applying the right IAM policies for your users or groups. You can be very specific\
    \ with the criteria, such as granting permissions for specific Git actions (push,\
    \ pull, merge, and so on), or limiting access to certain branches.\n\nLet’s see\
    \ a sample IAM policy that only allows the GitPush action on the dev and test\
    \ branches for a developer:\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\"\
    : [\n    {\n      \"Effect\": \"Deny\",\n      \"Action\": \"codecommit:GitPush\"\
    ,\n      \"Resource\": \"arn:aws:codecommit:eu-central1:111111111111:SampleRepo\"\
    ,\n      \"Condition\": {\n        \"StringEqualsIfExists\": {\n          \"codecommit:References\"\
    : [\n            \"refs/heads/test\",\n            \"refs/heads/dev\"\n      \
    \    ]\n        }\n      }\n    }\n  ]\n}\n```\n\nIt is a good practice to restrict\
    \ certain Git permissions, such as MergePullRequestByFastForward, to individuals\
    \ who are more experienced with the code base. By not allowing fast-forward merges\
    \ to everyone, you avoid scenarios that could pollute the main branch if commits\
    \ are not written thoughtfully. A squash merge addresses this by squashing all\
    \ commits from the feature branch into one. Organizations usually align these\
    \ permissions with the Git branching strategy that has been established for certain\
    \ software or teams.\n\n# Amazon CloudWatch event integration\n\nYou can monitor\
    \ and build automations when specific events occur in your repositories. Among\
    \ several others, events such as creating pull requests, adding comments, or reacting\
    \ to comments"
  merge: -1
  img_proc: true
