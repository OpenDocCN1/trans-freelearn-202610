- pgno: 287
  md: 'Figure 12.2: Monitoring usage of security break-glass users


    Let''s look at this in a bit more detail, as follows:


    +   1. During events of security breaches involving the IdP or outages of the
    service itself, security team members might have to invoke the break-glass process
    by using the IAM user credentials configured in the AWS management account.

    +   2. The user login results in the creation of an event in the EventBridge service,
    in the region where the user logged in.

    +   3. To track these events, one can leverage the AWS User Notifications service,
    which handles the lifecycle management of event tracking and forwarding in the
    target regions of the management account.

    +   4. A notification is sent out on the configured destination platform, which
    as of writing this chapter can be MS Teams, Slack, or email.


    To track the event that defines console login for the break-glass user, one can
    configure the IAM user Amazon Resource Name (ARN) in the User Notifications service.
    For example, to track a user named break-glass-1, one can use the following ARN
    in the service: `arn:aws:iam::<management_account_id>:user/break-glass-1`.


    The event is then forwarded to one of the three aggregator regions that are also
    managed and configured by the service.'
