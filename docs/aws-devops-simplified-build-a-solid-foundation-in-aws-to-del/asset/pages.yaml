  md: '# Contributors


    # About the author


    **Akshay Kapoor** is a software engineer and cloud architect with over a decade
    of experience in delivering simple solutions for intricate business challenges.
    He’s a continuous learner and loves to share his knowledge. From start-ups to
    big companies, Akshay understands how tech teams work and how to boost their progress
    with the innovative use of DevOps and the cloud. At **Amazon Web Services (AWS)**,
    he partners with enterprises as a trusted advisor, crafting inventive solutions
    using AWS services that connect technical strategies with business goals.


    He is based in Munich, Germany, and holds a master’s degree in computer applications
    from Thapar University, India. Akshay can be reached on LinkedIn at https://www.linkedin.com/in/akskap/.


    *I want to thank my wife, Rohini, for her unwavering support throughout the lengthy
    process of authoring this book; my parents, for instilling in me the values and
    strength that have shaped this journey; and Manish and Shashi, for their constant
    motivation and guidance in all endeavors.*


    *Thanks to the entire team at Packt for their help and support throughout the
    process, and the reviewers for their valuable suggestions and feedback.*'
