- pgno: 39
  md: '# AWS CodePipeline


    CodePipeline is an orchestrator that works with all the services discussed previously.
    It manages the overall software delivery process and is responsible for invoking
    certain services, in the defined order.


    Using YAML and JSON templates, you can code an automated procedure that can be
    used to reliably release software every single time. The service shines in terms
    of native integrations with many other services. This abstracts lots of internal
    details and lets you focus on application-specific details.


    # IaC


    With the ever-increasing complexity of software applications, infrastructure requirements
    have grown exponentially. Managing all these components manually is error prone
    and subject to human limitations. Using standard tools, SDKs, and APIs, AWS makes
    it easy to manage the entire IaC. It takes minutes to spin up and tear down infrastructure
    across an entire AWS region.


    AWS offers SDKs in different programming languages such as Python, Go, Ruby, JavaScript,
    C++, and many more. Using familiar programming syntax, you can develop and operate
    your entire software stack using code. In the later chapters, we will learn about
    the relevant AWS services, such as CloudFormation and Cloud Development Kit (CDK).


    # AWS CloudFormation


    With JSON or YAML templates, users can define their entire infrastructure stacks
    and maintain them as code. CloudFormation allows them to build resource dependency
    graphs automatically and provision all services in the desired order. It further
    supports multi-region and multi-account rollouts, which is helpful for enterprise-grade
    AWS landscapes.


    # AWS CDK


    This is an open source, infrastructure management framework that works using the
    concept of constructs – readymade abstractions for deploying integrated application
    components. Under the hood, it works with CloudFormation templates but abstracts
    these details from the end user. It offers native programming language features
    such as conditionals, composition, and inheritance, which enable the user to apply
    programming methodologies to infrastructure management. These reusable components
    can then be shared with other teams in the company. This not only accelerates
    overall DevOps adoption but also leads to standardized infrastructure solutions
    for a particular application pattern.


    # Summary


    In this chapter, we discussed two real-life examples that helped you to compare
    different approaches to building solutions and to enable your teams. While this
    highlighted certain drawbacks in the traditional on-premises infrastructure model,
    you also learned about the practical benefits of using AWS services in the cloud.'
  merge: -1
  img_proc: true
- pgno: 40
