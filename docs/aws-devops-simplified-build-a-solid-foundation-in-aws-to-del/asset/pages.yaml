    \ These foundations typically unlock two main use cases – migrating workloads\
    \ from on-premises environments or net new development in the cloud. Therefore,\
    \ the main goals here are as follows:\n\n+   - Secure and compliant\n+   - Scalable\
    \ and resilient\n+   - Flexible to future change\n\nA good KPI to measure a Landing\
    \ Zone’s maturity is – how long it takes to create a new AWS account and make\
    \ it ready for hosting production workloads. There’s a lot that goes on in between,\
    \ starting with account requests, approvals, provisioning, and actual usage, highlighting\
    \ various challenges ranging from humans to technology and automation.\n\nThe\
    \ term **Landing Zone** is often used, or misused, in different contexts, which\
    \ can be confusing for users. Let’s go through four common patterns I’ve observed\
    \ over the last few years:\n\n+   - **Landing Zone as a concept:** This is the\
    \ idea of a multi-account cloud foundation, as well as the tangible outcome that\
    \ gets deployed in your AWS environment. It helps the organizations reap benefits\
    \ from the cost segregation, security and access management, and reduced blast\
    \ radius offered by AWS account boundaries. It promotes the idea of managing all\
    \ infrastructure automation with code that is repeatable, easy to test, and automate.\n\
    +   \n+     Throughout the chapter, we will be using the term landing zone for\
    \ both the concept and the tangible foundational structure that represents this\
    \ concept.\n\n+   - **Landing Zone as a solution:** A solution is a pre-baked,\
    \ ready-to-deploy implementation that fulfills a particular need – in this case,\
    \ a multi-account architecture – by leveraging a variety of AWS services. A few\
    \ years back, AWS offered a publicly available gigantic CloudFormation template\
    \ known as **AWS Landing Zone (ALZ)** that could be used by customers to deploy\
    \ multiple services, accounts, and policies into their AWS organization. It gave\
    \ them a solid enterprise-grade foundation to begin their AWS journey. It is no\
    \ longer supported and deprecated in favor of a managed service called **AWS Control\
    \ Tower**, which we will cover in more detail later in this chapter. Some examples\
    \ of other solutions that are offered by AWS are **Customizations for Control\
    \ Tower (CfCT)** and **Account Factory for Terraform (AFT)**.\n\n+   - **Landing\
    \ Zone as an AWS service:** Solutions such as ALZ required a lot of customization\
    \ to adapt to the unique needs of an organization. As it was completely managed\
    \ with a CloudFormation template, it was not easy to maintain and operate, not\
