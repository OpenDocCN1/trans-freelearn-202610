    <p>AWS DevOps Simplified - Simple HTTP Server</p>\", \"utf-8\"))\n        self.wfile.write(bytes(\"\
    </body></html>\", \"utf-8\"))\n\nif __name__ == \"__main__\":\n    webServer =\
