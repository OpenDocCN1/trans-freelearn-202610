- pgno: 83
  md: "# Stacks\n\nWhen managing IaC, you want to deal with the related resources\
    \ as a single unit. For example, a three-tier web application will require you\
    \ to create a set of resources, such as the load balancer, compute instance, and\
    \ database server. It is ideal to be able to manage them all within a single template.\
    \ This simplifies the management of the dependencies and stack operations. In\
    \ CloudFormation terminology, this single unit is what is referred to as a **stack**.\
    \ A template definition is a prerequisite for AWS CloudFormation to understand\
    \ the resources you'd like to create and the configurations to be used for those\
    \ resources.\n\nYou can create a stack in your AWS account with the `aws cloudformation\
    \ deploy` command.\n\n# Change sets\n\nJust like software applications, infrastructure\
    \ needs to adapt to changing requirements. This results in the modification of\
    \ stacks that have already been deployed by CloudFormation in an AWS account.\
    \ Some resources in AWS are *immutable*, which means any modification requires\
    \ a complete replacement since in-place updates are not possible. To provide a\
    \ safety net around such operations, CloudFormation allows you to evaluate the\
    \ impact of your changes before you roll them out. This intermediate stage is\
    \ known as a **change set**. After a change set has been created, it tells you\
    \ about the impact of the planned stack update operation on existing resources.\
    \ If you notice unexpected changes to the resources, you can cancel the update\
    \ process; otherwise, you can go ahead with the final rollout.\n\nTo create a\
    \ change set, you can use the `aws cloudformation create-change-set` command.\n\
    \n# Template\n\nA CloudFormation **template** is a blueprint of the resources\
    \ in your infrastructure stack and their dependencies. It is the interface between\
    \ the infrastructure developer and the service itself. What gets defined here\
    \ becomes part of a *stack* that CloudFormation will eventually roll out in your\
    \ AWS account. It is a text file that is consumed by the service to provision\
    \ resources. When you trigger a CloudFormation deployment, you need to pass a\
    \ template file as an argument to the CLI command. Within a template, there are\
    \ several constructs that you can leverage to define your infrastructure components.\
    \ Let's go through some of them.\n\n# Resources\n\nThis is a mandatory section\
    \ of the template that defines the resources that should be created in your AWS\
    \ account. It also includes the properties that define specific configurations\
    \ those resources should have. A simple example could be the creation of an EC2\
    \ instance, mapped to a particular security group, and using a specific **Amazon\
    \ Machine Image (AMI)**:\n\n```\nResources:\n  TestEC2Instance:\n    Type: AWS::EC2::Instance\n\
    \    Properties:\n```"
  merge: -1
  img_proc: true
- pgno: 84
  md: "```\n```yaml\nImageId: ami-0834874e33262e665\nInstanceType: t3.micro\nSubnetId:\
    \ subnet-0e4f97bea5c50b873\nSecurityGroupIds:\n  - sg-06320d12095603e68\nKeyName:\
    \ test-key-pair\n```\n```\n\nDeploying this template will create an EC2 instance\
    \ with all the configurations defined under the `TestEC2Instance:` section. You\
    \ will notice that most of the configurations reference pre-existing resource\
    \ identifiers. This means that they should be present in the respective AWS account\
    \ (and region) before you deploy a stack using this template.\n\n> **Tip**\n>\
    \ \n> Most of the AWS services are region scoped and you should take special care\
    \ about the implications this could have. For example, a public AMI available\
    \ in `eu-central-1` cannot be referenced in your CloudFormation template when\
    \ you’re deploying a stack in another region. Furthermore, AWS ensures that none\
    \ of your resources transfer data to another region unless they’ve been explicitly\
    \ configured by the user. You should keep this in mind when you’re working on\
    \ architectures that need to comply with strict data residency and compliance\
    \ needs.\n\nTherefore, please keep in mind that hard-coding configurations is\
    \ not a good design practice as stack deployments will fail if prerequisites don’t\
    \ exist. Secondly, it’s difficult to reuse such templates in other AWS accounts\
    \ and regions. Security, reusability, and modularity should be at the top of your\
    \ mind when you’re working with them. We will cover some good design practices\
    \ later in the *Best practices for using CloudFormation to define enterprise-grade\
    \ architectures* section.\n\nTo ensure reusability and a clean design, CloudFormation\
    \ offers the capability to use **parameters**, which can be defined at runtime.\
    \ This enables dynamic configuration possibilities and simplifies template maintainability.\n\
    \n# Parameters\n\nThese are the values that you pass to your template during stack\
    \ creation. It helps separate the design from the configuration. You can have\
    \ defaults, and also provide a list of allowed values, to control what the user\
    \ can or cannot use. Once the parameters have been defined, it is easy to reference\
    \ them in the Resources section using the Ref keyword:\n\n```\n```yaml\nParameters:\n\
    \  InstanceType:\n    Type: String\n    Default: t3.micro\n    AllowedValues:\n\
    \      - t3.micro\n```\n```"
  merge: -1
  img_proc: true
- pgno: 85
  md: "```\n```yaml\n  - m5.medium\n...\n...\nResources:\n  EC2Instance:\n    Type:\
    \ AWS::EC2::Instance\n    Properties:\n      InstanceType:\n        Ref: InstanceType\n\
    ...\n...\n```\n```\n\nThis makes your templates flexible as they can adapt to\
    \ the values provided at runtime.\n\n# Conditions\n\n**Conditions** provide a\
    \ control mechanism in your template. Based on a certain condition being true\
    \ or `false`, you could either skip the resource creation altogether or use a\
    \ different configuration value when deploying the stack. This is useful in situations\
    \ where you would like different values for development or production, for example:\n\
    \n```\n```yaml\n...\nConditions:\n  SkipResourceCreation: !Equals\n    - !Ref\
    \ Environment\n    - dev\n...\n...\nResources:\n  EC2Instance:\n    Type: AWS::EC2::Instance\n\
    \    Condition: SkipResourceCreation\n...\n```\n```\n\nBut what if you would like\
    \ to block the stack’s operation based on the evaluation of certain parameter\
    \ values? Let’s have a look at **rules**.\n\n# Rules\n\nThis is an optional section\
    \ of your template that can be used to evaluate a certain combination of parameter\
    \ values and block the stack creation or update process. It works around the concepts\
    \ of a *rule condition* and an *assertion*. If you don’t define any condition,\
    \ then the rule assertion will always be evaluated:\n\n```\n```yaml\nRules:\n\
    \  testInstanceType:\n```\n```"
  merge: -1
  img_proc: true
- pgno: 86
  md: "```\n```yaml\nRuleCondition:\n  !Equals - !Ref Environment\n  - test\nAssertions:\n\
    \  - Assert:\n      'Fn::Contains':\n        - - t3.medium\n          - !Ref InstanceType\n\
    \      AssertDescription: 'For a test environment, the instance type must be t3.medium'\n\
    ```\n```\n\nThis rule denies stack updates or creation when the instance type\
    \ is different than `t3.medium`.\n\nSo far, we’ve covered different ways to pass\
    \ information to a CloudFormation template. What if we need some information in\
    \ return after stack operations are complete? This is where **outputs** come into\
    \ the picture.\n\n# Outputs\n\nThese are the values that you would like to retrieve\
    \ after the stack operations have been completed. You can access them via the\
    \ console or CLI commands, or reference them in other templates as *imports*.\
    \ This approach ensures that the templates are of a manageable size as you don’t\
    \ have to put all the resources together in one big file. You can define an output\
    \ value using the Outputs construct:\n\n```\n```yaml\nOutputs:\n  InstanceID:\n\
    \    Description: ID of the EC2 instance\n    Value: !Ref EC2Instance\n```\n```\n\
    \nAs soon as the stack operations are complete, you can access the identifier\
    \ of the new EC2 instance using the `InstanceID` key.\n\nThe concepts we’ve covered\
    \ so far should help you get started with the practical day-to-day usage of the\
    \ CloudFormation service. To make debugging issues easier, let’s discuss the internals\
    \ of how CloudFormation works under the hood.\n\n# How CloudFormation works\n\n\
    AWS services such as CloudFormation are great at reducing the cognitive load of\
    \ the end user. A lot of internal details are abstracted, exposing only the functionalities\
    \ that the users need. However, in certain situations, it’s important to understand\
    \ what the service is internally doing. This not only helps debug problems faster\
    \ but also gives you a good thinking ground when discussing topics such as security,\
    \ compliance, and day-to-day operations for your organization."
