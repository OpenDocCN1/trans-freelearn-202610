  md: "```\nType: AWS::EC2::Route\nDependsOn: InternetGatewayAttachment\nProperties:\n\
    \  RouteTableId: !Ref PublicRouteTable\n  DestinationCidrBlock: 0.0.0.0/0\n  GatewayId:\
    \ !Ref InternetGateway\n\nPublicSubnet1RouteTableAssociation:\n  Type: AWS::EC2::SubnetRouteTableAssociation\n\
    \  Properties:\n    RouteTableId: !Ref PublicRouteTable\n    SubnetId: !Ref PublicSubnet1\n\
    ...\n```\n\nCloudFormation offers built-in functions that help you assign values\
    \ that are not available until runtime. You can use these programming capabilities\
    \ within your templates to construct, extract, and define different types of values.\
    \ !Select (short form for Fn::Select) is one such function that can help you extract\
    \ an item from a list, for a given index. Here, we get the ID of the first AZ\
    \ so that we can deploy the public subnet. We also use !Sub to substitute the\
    \ contents of the EnvironmentName parameter into the Tag value. This is an efficient\
    \ approach to dynamically changing the resource tag names by modifying a single\
    \ parameter in the template. You can explore other intrinsic functions supported\
    \ by the service at https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/intrinsic-function-reference.html.\n\
    \nPlease note that we also define similar resource blocks for the other public\
    \ subnet, hosted in the second AZ, but they haven’t been mentioned in this example\
    \ to avoid redundancy.\n\nWe will use the public subnets to host an internet-facing\
    \ load balancer that can receive requests from the end user and balance the load\
    \ across multiple compute instances in the background.\n\n# Private subnets\n\n\
    Similar to public subnets, private subnets are also carved out from the same VPC\
    \ CIDR block. The key difference lies in the routes that are added to these subnets.\
    \ Functionally, they are used to host resources that will not be exposed to the\
    \ internet. If you recall the AMI deployment from the previous chapter, we hosted\
    \ the EC2 instance directly in the public subnet of the default VPC, by allocating\
    \ a public IP. In real-life implementations, it’s not a good practice to expose\
    \ the backend instances directly on the internet as it introduces architectural\
    \ limitations around security, network ingress traffic inspection, and load balancing\
    \ capabilities. So, resources such as backend servers, databases, and internal\
    \ tools get deployed in these subnets:\n\n```\nResources:\n...\n```"
