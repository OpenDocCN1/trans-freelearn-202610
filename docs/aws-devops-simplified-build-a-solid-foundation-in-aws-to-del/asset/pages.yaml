- pgno: 263
  md: '**Note**


    Even though some frameworks such as ADF have “AWS” in their name, they are not
    officially supported by the cloud provider as part of the enterprise support plans.
    This can be one of the criteria that companies might want to consider, or at least
    be aware of. On the other hand, the two solutions – AFT and CfCT – do come with
    official AWS support, just like other services. These solutions are maintained
    by the Control Tower service team.


    We could dedicate an entire book to the development of a Landing Zone. An important
    callout is that this is an *evolving* thing. The ever-changing requirements of
    the organization will dictate new criteria and goals that have to be met by the
    Landing Zone design. To achieve this, services, solutions, and deployment frameworks
    will have to adapt. How you use these services and solutions is going to be largely
    driven by the unique needs and implementations within your organization. This
    is a reason why you will never come across an end-to-end implementation that can
    be adopted as-is. The services and solutions will always focus on the *lowest
    common denominator* that applies to the majority of enterprise use cases. Almost
    always, there is a customization layer that comes on top, to make it a complete
    solution that addresses your needs.


    Therefore, the main priorities of this chapter are to introduce you to the key
    considerations of a Landing Zone, relevant AWS services, solutions, and frameworks.
    This will help you identify the areas that you should look into, as well as introduce
    you to deployment orchestration frameworks, for rolling out resources across multiple
    AWS accounts and regions. Equipped with this knowledge, you can come up with custom
    implementations or designs that work for you.


    # Key considerations in a Landing Zone


    Creating a Landing Zone concept from scratch that will cater to all current and
    future organizational needs can be intimidating. Five areas are essential for
    all organizations, big or small, to build an AWS foundation that scales. We will
    discuss them in this section, starting with the multi-account structure.


    # Defining a structure for organizational units and accounts


    At the core of your Landing Zone design is an account structure that enables an
    organization to move fast, enforce granular controls, establish isolation boundaries,
    and reduce blast radius, while remaining flexible to future changes. So far in
    this chapter, we have discussed quite a few areas that benefit from a multi-account
    structure. All of this aligns well with the **AWS Organizations** service offerings,
    which help you manage your entire AWS landscape under the same umbrella. It gives
    you organizational controls that are otherwise difficult to establish, and maintain,
    across many discrete AWS accounts that act as independent entities. So, enabling
    AWS Organizations is essential if you don''t leverage it already. Available at
    no charge, it gives you immediate benefits around consolidated billing, service
    integrations, policies to centralize service usage control, and grouping your
    accounts for budgetary and compliance needs. Let’s discuss them in more detail
    and highlight some best practices as we progress.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Grouping accounts for compliance and regulatory needs


    **Organizational units (OUs)** are an AWS Organizations feature that allows you
    to amalgamate multiple AWS accounts into one logical entity. It''s a soft structure
    that can be used to group certain accounts that exhibit the need for similar governance
    and control. For example, there might be a subset of enterprise applications that
    are regulated by the **Health Insurance Portability and Accountability Act (HIPAA)**,
    and as a result, might not allow usage of certain AWS services. It''s easy to
    group these accounts, form an OU, and enforce policies at the OU level, which
    are then inherited by all accounts. Furthermore, any other AWS account that gets
    placed in this OU, even in the future, automatically follows the same rules, thereby
    ensuring continuous compliance. As another example, some companies might want
    to group all their dev workload accounts together so that they can apply certain
    policies that block the usage of high-cost compute. Keeping custom requirements
    aside for a moment, certain OUs apply to the majority of organizations, as covered
    here:


    +   - **Shared services OU**: This OU contains the platform services'' accounts
    that would be consumed by all other AWS accounts, basically a shared resource.
    It is common to host systems such as **Active Directory**, network appliances,
    or proxy services in this OU (in dedicated accounts) that can only be accessed
    by authorized personnel.

    +   - **Security OU**: This is where you group your **Audit** and **LogArchive**
    accounts, which external auditors and in-house security teams will have access
    to. All platform logs coming from **CloudTrail** and **Config** should be pushed
    into the central LogArchive account, as a best practice, so that they can be independently
    analyzed by **Security Information and Event Management (SIEM)** systems for threat
    detection purposes.

    +   - **Automation OU**: A while ago, we slightly touched upon the need for deployment
    frameworks that make the Landing Zone concept a reality. It''s a good practice
    to host an independent Automation account in this OU, which contains the frameworks
    responsible for rolling out resources across all other accounts, in an automated
    fashion. Since this account has privileged access to almost every other account
    in the organization, access is generally limited to the tools that manage the
    entire AWS landscape. Human access, if any, should be actively monitored.

    +   - **Maintenance OU**: Once the security and regulatory policies have been
    applied to an OU, it''s difficult to sometimes carry out maintenance procedures
    on the accounts contained therein. Therefore, it''s recommended to create a maintenance
    OU that temporarily hosts all the AWS accounts that need to be prepared for a
    specific need or operated upon. A common use case is to enable AWS opt-in regions
    by placing the AWS account in this OU. Normally, this would be a restricted action
    across all OUs and accounts as users could enable regions that might break the
    compliance posture of the company. Once the regions are enabled, accounts are
    placed back into their original OU. Think of this OU as a *pit stop*, used in
    racing competitions for minor servicing and refueling.


    As a security measure, it''s also important to revoke permissions from all other
    AWS users that allow them to manually move any account into this OU, as that would
    immediately lift all the restrictions by which the accounts were otherwise blocked.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '+   - **Suspended OU:** All suspended AWS accounts remain in the same state
    for 90 days, as a cool-off period, before they are removed. As a security measure,
    this OU restricts all actions in these accounts to prevent any additional billing
    or unauthorized usage.

    +   - **Development OU:** Striking the right balance between security controls
    and agility is key to innovation. Organizations often enforce a standard set of
    policies and controls across all AWS accounts, which holds back developers from
    testing new ideas and innovating in the cloud. As AWS puts it, a good Landing
    Zone design follows the *Guardrails, but not blockers* principle. Therefore, it
    is important to create a dedicated OU where individual developers or team accounts
    can be hosted acting as the innovation space. You can still apply certain budgetary
    constraints on these OUs and block IAM actions that could hinder the security
    posture of the organization.


    Having covered the most important OUs in any Landing Zone, let’s see what an OU
    setup would look like for a huge organization that has dedicated teams specializing
    in different areas of the technology stack, and application workloads that need
    to adhere to regulated standards such as HIPAA.


    # Sample OU design for a regulated organization


    Large enterprises typically have dedicated teams handling security, network operations,
    audit, software development, and so on. These teams are often grouped by cost
    centers, require customized access controls, and are governed by security controls
    and governance policies. Software development teams, on the other hand, are grouped
    by business domains or value streams and have several environments, such as development,
    staging, and production, where they host their application workloads. The boundaries
    provided by an AWS account in terms of billing, access, and isolation needs map
    well to such scenarios. OUs can provide a logical structure that these accounts
    can be further grouped under, for access control and policy enforcement. A sample
    OU structure is given in *Figure 11.2*:


    ![](img/ecd265dfca9bb64161408ba8a944a4d9_265_0.png)


    Figure 11.2 – Sample OU hierarchy for an organization hosting regulated workloads'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'Grouping the AWS accounts under specific OUs simplifies the definition, and
    mapping of policies. Let’s discuss this in the following section.


    # Enforcing policies to control service usage and tag assignments


    Three types of policies are supported by AWS Organizations – **Service Control
    Policies (SCPs)**, **Tagging Policies**, and **Backup Policies.**


    SCPs can restrict certain IAM actions to all OUs, or accounts they are mapped
    to. It is important to not overuse them as there are restrictions around policy
    size (5,120 bytes) and the total number of policies that can be directly applied
    to an AWS account or OU (currently 5). Think of them as *global controls* that
    deny all actions that you do not want your users to perform. For example, denying
    all other AWS regions except the ones you want to operate in is a common SCP control.
    Another could be denying the configurations to make an S3 bucket public or restricting
    certain EC2 instance types that can have cost repercussions or be misused in a
    certain way. AWS IAM inherently denies all actions that are not explicitly added
    to a policy, but SCPs are a type of global administrative mechanism that takes
    the highest precedence, even in scenarios where a certain IAM action has been
    mistakenly allowed on a user or resource.


    Tagging policies, in combination with SCPs, are used to enforce the existence
    of certain tag keys and the corresponding values. Almost all AWS resources support
    tags, which are key-value pairs that are used to provide additional context to
    a particular resource. This is particularly useful for tracking down the owners
    and application teams for support, operations, or cost analysis needs. A common
    mistake that organizations make is investing too much time and effort in coming
    up with a tagging strategy that will fulfill all their future needs. It’s highly
    recommended to start backward – that is, identify the problem that you want to
    solve with tags and then arrive at a tagging policy that helps you enforce it.
    For example, if an organization is struggling with identifying the resource owners
    in the aggregated cost and usage reports, it might help to enforce the tag keys
    that map teams and individuals.


    Backup policies are used to automatically apply backup plans to supported resources,
    across all your AWS accounts.


    # Leverage service integrations with AWS Organizations


    AWS services such as **AWS Security Hub**, **AWS CloudFormation**, and **AWS Config**,
    among many others, can leverage an AWS Organizations feature known as **Trusted
