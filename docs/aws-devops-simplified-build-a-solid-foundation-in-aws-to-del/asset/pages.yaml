    # Key AWS offerings for monitoring and observability


    AWS offers a variety of native services that enable customers to implement end-to-end
    observability solutions for their application workloads. All three pillars of
    observability are well covered. CloudWatch is AWS’s primary observability platform,
    which is a suite of different solutions that address customer needs around logs
    and metrics collection. For **traces**, AWS offers the **X-Ray** service, which
    makes it very easy to trace individual requests or workflows in your applications.


    Interestingly, there are also quite a lot of customers in the observability space
    that have been working with open source solutions and would like to extend their
    existing implementations in the cloud. AWS offers managed solutions for **Prometheus**
    and **Grafana**, which we will cover in a lot more detail during the hands-on
    exercise, later in this chapter. Furthermore, AWS has been quite active in the
    **Cloud Native Computing Foundation’s (CNCF’s) OpenTelemetry** project, also known
    as OTel for short. It is a vendor-neutral framework for managing telemetry data.
    OpenTelemetry introduces the concept of a *distribution*, which is a customized
    version of a specific OpenTelemetry component. AWS **Distro for OpenTelemetry
    (ADOT)** is an AWS distribution based on the OpenTelemetry project. It provides
    out-of-the-box capabilities to instrument your applications once and send the
    metrics and data to multiple AWS services, including Amazon CloudWatch, X-Ray,
    and Amazon Managed Service for Prometheus.


    Before diving into the best practices for a good observability strategy, let’s
    understand various components of AWS’s observability platform – Amazon CloudWatch.


    # Amazon CloudWatch


    CloudWatch is a centralized platform that allows customers to collect, monitor,
    and visualize their application logs, metrics, and X-Ray traces, all in a single
    dashboard. It is invaluable in providing a unified view of operational health
    for all the workloads the customer is managing.


    There are three main areas of features that CloudWatch offers.


    # Infrastructure monitoring


    Infrastructure monitoring covers the foundational aspects of metrics, alarms,
    and related insights.'
