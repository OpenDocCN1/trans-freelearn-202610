- pgno: 43
  md: '# Platform as a Service (PaaS)


    In a PaaS service model, cloud providers additionally manage the operating system
    and application integrations on top of the infrastructure. This further abstracts
    the system internals from the software team, allowing them to focus on business
    outcomes. With pre-built integrations, all aspects of infrastructure, operations,
    and configuration management, which is the process of maintaining hardware and
    software in a desired state, are taken care of by the provider. These platforms,
    to some degree, are opinionated about the software delivery process and the automation
    around it. The developers still need to write code, but PaaS takes care of the
    operations and deployment activities, which results in a seamless merge with the
    underlying IaaS.


    Developers greatly benefit from such offerings as they help them build proof of
    concepts in no time. In contrast to IaaS, these offerings are generally less flexible
    to customization and change. It takes time for the developers to get used to the
    specifics of the framework and what is expected in terms of code structure, configurations,
    software delivery process, and so on. However, once they have a foundational understanding
    of the service offered, onboarding time for a new application improves a great
    deal.


    # Software as a Service (SaaS)


    This is the most comprehensive form of offering by cloud providers, where the
    end-user simply consumes application features via APIs or directly through their
    browser over the internet. The end-user is not responsible for software patches,
    overall maintenance, and application uptime. The cloud provider, however, needs
    to take care of security aspects around such offerings. Generally, these are multi-tenant
    systems with common storage for multiple users.


    In some form or the other, we all use SaaS applications these days. Common examples
    are email and cloud-based file storage. In Chapter 1, we discussed the importance
    of undifferentiated heavy lifting being taken over by cloud services. SaaS excellently
    fits that concept. The end-user consumes the software application without having
    to worry about anything else.


    This model is the least flexible in terms of change and control, as you are bound
    by the service boundaries and limitations coming from the provider side. You have
    less influence on the software features. SaaS is great for companies who don’t
    want to take ownership of applications that they can simply consume as-is and
    who don’t want to reinvent the wheel.


    Let’s try to visually map our learnings so far to different cloud service tiers
    and the varied levels of abstraction and control they offer. Different layers
    are highlighted in Table 2.1, where we can see the ones you have to manage in
    white and the ones managed by cloud provider in blue:'
