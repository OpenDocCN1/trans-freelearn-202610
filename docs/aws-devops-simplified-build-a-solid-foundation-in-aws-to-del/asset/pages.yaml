    \ a directory that needs to be saved and reused in subsequent build runs. You\
    \ can read more about this feature at https://docs.aws.amazon.com/codebuild/latest/userguide/build-caching.html.\n\
    \nFor simplicity's sake, let's say we are not interested in any vulnerability\
    \ findings where the CVSS score is below 8. We can adapt the respective buildspec\
    \ file for the CodeBuild action and commit the changes. To do this, we can modify\
    \ the CVSS threshold to 8 in the buildspecs/sca.yml file:\n\n```\n...\n  build:\n\
    \    on-failure: ABORT\n    commands:\n      - dependency-check --scan \"${PWD}\"\
    \ --enableExperimental --failOnCVSS 8 --format JSON\n...\n...\n```"
