  md: 'After the AMI build process completes, we can proceed with stack deployments
    using CloudFormation. We will deploy three templates in this chapter (in order):


    +   1. **Infrastructure stack**: Deploys foundational resources such as VPCs,
    subnets, route tables, and so on.

    +   2. **Application stack**: Builds on top of the infrastructure stack and deploys
    Auto Scaling groups, a target group, and an Application Load Balancer.

    +   3. **Pipeline stack**: Integrates with the application resources to offer
    an end-to-end CI/CD pipeline for the application developer. Any code change from
    this point onwards will automatically be rolled out to the EC2 instances.


    > **Note**

    > You might have provisioned the first two stacks as part of the hands-on exercise
    in *Chapter 4, Managing Infrastructure as Code with CloudFormation*. If those
    resources are still available in your AWS account, you can directly proceed with
    deploying the pipeline stack.


    Inter-stack dependencies are highlighted in Figure 5.3:


