    Let’s begin by understanding the core idea behind observability.


    # What is observability?


    Simply put, it’s all about understanding the current state a running system is
    in, from the work it is doing and the data that it is emitting. Developing a solid
    observability strategy is not a one-time thing and it will always have scope for
    optimizations as your business needs evolve. But, before you can even understand
    what is going on, it’s important to ensure that the system at least emits some
    data for us to be able to derive some reasoning out of it. But what kind of data?


    Observability has three foundational pillars that allow you to convert data into
    information, and derive insights from that information, which ultimately leads
    to the actions that need to be taken:


    +   - **Logs:** These are the *discrete events* that have occurred across several
    components in your systems while serving a customer request. It’s invaluable to
    store these logs in a centralized data store so that information can be securely
    extracted, and analyzed, as and when needed.'
