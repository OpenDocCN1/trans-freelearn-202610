- "## 成功组建团队\n\n在 DevOps 领域，所有举措的成功和有效性都取决于人员与技术的协调整合。只关注其中一方不会带来太多好处。通过认识到两者的重要性，组织可以释放\
  \ DevOps 的全部潜力，从而实现更快的软件交付生命周期，同时提高质量和可靠性。\n\n**人员**推动 DevOps 的文化和协作方面。他们运用自己的技能和专业知识，推动共同责任、持续改进和有效沟通的心态。另一方面，**技术**提供必要的工具、自动化和基础设施管理来支持这种心态。持续集成（CI）、CI/CD\
  \ 流水线和**基础设施即代码（IaC）**等软件交付方法，使团队能够提高向客户交付代码的整体效率。\n\n在 DevOps 实践中，人们往往过于急于采用工具。在这样做之前，他们需要确保文化和运作模式具备正确的基础。一旦人们认同这两者的价值和好处，他们就会主动采用所需的技术变革和工作方式。在本章中，我们将聚焦两大支柱——人员和技术——以及你可以通过哪些\
  \ AWS 措施来成功组建团队。此外，我还将介绍一些资源，供你用于 DevOps 团队的持续学习和能力提升。采用 AWS 通常会带来新的创新机会，有时甚至会导致公司内部的角色转型。在本章末尾，我们将介绍一条基本的学习路径，你可以为自己或其他希望更深入参与\
  \ AWS 上 DevOps 工作的团队成员参考。\n\n本章议程如下：\n\n- 建立协作、敏捷的团队结构和文化\n- 成功的技术最佳实践与考量\n- 支持\
  \ AWS 学习与发展的资源\n- 转型为 DevOps 角色的学习路径\n\n## 建立协作型团队结构和文化\n\n采用 DevOps 实践说来容易做来难。大多数组织面临的一个根本问题是，将工具和自动化视为解决所有问题的黄金方案——甚至更糟糕的是，从市场上招聘\
  \ DevOps 工程师并将其嵌入现有团队，希望他们能引入自动化和云服务，神奇地填补所有空白。在走这条路之前，他们首先需要确保*人员就绪*。在本节中，我们将讨论如何构建一个有效的团队结构，以支持在整个组织中成功实施\
  \ DevOps。我们将重点讨论培养协作和有效沟通文化的重要性，这种文化反过来又能为客户创造价值。\n\n## 让团队创造更多价值\n\n你需要应对的第一个挑战是公司的运营模式。团队如何构建？他们的职责是什么？他们如何沟通？这种结构与业务目标的一致性如何？它是否能让团队独立地向客户交付业务成果？日常例行工作是否需要频繁移交其他团队？他们是否在软件运行所必需的关键领域缺乏专业知识？等等。\n\
  \n无论组织规模如何，都可以采用四种基本团队结构。在深入探讨细节之前，有必要指出，这些团队设置可能会因组织的规模和 DevOps 成熟度而略有不同。因此，不要将它们当作一成不变的模板，而应将其视为灵感来源——新团队可据此组建，现有团队也可据此转型。更多地关注这些结构带来了什么价值，以及它们如何帮助团队专注于自己最擅长的工作。\n\
  \n### *价值流对齐团队*\n\n这些团队高度专注于一条定义明确的独特工作流。他们是你的前线战士，始终与最终客户（无论是外部还是内部）建立良好的沟通接口。这个团队的北极星应该是为最终用户提供业务价值。根据公司的规模和产品组合，这条单一工作流可以局限于一个完整的产品或服务、产品中的一组功能，甚至在需要时更加细化。重要的是，他们要承担全部责任，从收集客户意见、理解他们的痛点、开发软件解决差距，到在生产环境中运维软件。例如，**AWS**\
  \ 等公司可能会将这些团队结构与云提供商提供的不同服务对齐。例如，一个专门团队可能负责 **AWS CodeBuild**，另一个团队可能负责 **AWS CodePipeline**。这些团队拥有跨职能技能，能够理解客户的业务需求，并将这些需求转化为软件功能。他们还应该具备在全球范围内运维这些工作负载所需的所有内部技能。从\
  \ DevOps 的角度来看，这满足所有条件，例如“谁构建、谁运维”、自主运营、以最终客户为中心进行构建等等。\n\n再举个不同的例子，比如**eBay**，可能需要对工作流进行不同的划分。例如，可能有一个团队负责*结账*，一个负责*产品目录*列表，另一个负责*欺诈管理*，等等。然而，核心原则保持不变。这些团队几乎可以独立于公司中的任何其他团队交付价值。\n\
  \n组织经常面临的另一个挑战是这些团队应该有多大。为了确保有效的协作、共同的责任感和良好的团队动态，经验法则是将团队人数控制在 10-12 人以下。这也是亚马逊所称的*2-比萨团队*——一个用两个比萨就能喂饱、并拥有充分权力为自己的工作流做出最佳决策的团队。\n\
  \n我们接下来要讨论的其他团队更像是组织中核心价值流的*赋能者*。当某些领域拖慢了价值流向最终用户提供价值的进程时，他们就会出现并提供支持。\n\n## 平台团队\n\
  \n平台团队专注于为其客户——组织内各个价值流中的成员——开发和维护可复用的服务。平台团队唯一的成功标准应该是其提供的服务易于采用、使用和文档化。这些服务越有吸引力、越易于使用，采用范围就越广。\n\
  \n在*第 1 章《借助 AWS 加速你的 DevOps 之旅》*中，我们讨论了降低客户认知负荷的理念。平台团队的概念与此理念密切相关。他们应该让价值流成员能够专注于差异化的业务成果。这只有通过为他们分担其他无差异化的任务才能实现。平台团队的成果满足所有其他价值流的共同需求。例如，如果所有软件制品都依赖于运行在**Amazon\
  \ Elastic Kubernetes Service（Amazon EKS）**上的容器化工作负载，那么平台团队的正确关注点应该是为在这些 EKS 环境中部署、监控和运维服务提供现成的模板。他们可以提供集中式仪表板和开箱即用的日志集成，方便价值流轻松采用并从中受益。\n\
  \n然而，值得注意的是，各个价值流所开发软件的生产环境所有权仍然归属于这些价值流自身。\n\n在*第 11 章《确保多账户和多区域环境拥有强大的 AWS 基础》*中，我们将讨论**着陆区**的概念。在\
  \ AWS 环境的背景下，这很好地映射了平台团队理应对接的工作范围。这使得应用团队能够专注于自己最擅长的工作，同时将多账户、多区域环境的基础架构复杂性交由中央平台团队处理。\n\
  \n\n\n\n## 专业团队\n\n根据组织的业务领域，在大多数（如果不是全部）价值流中，可能存在某些跨领域的专业领域。这些领域需要行业内或公司内部不常见的特殊技能，例如媒体编码、金融风险分析算法、高数据压缩技术等方面的深厚专业知识。\n\
  \n这些知识很可能正是价值流所提供产品的核心，对于持续向最终客户提供价值至关重要。在这种情况下，组织可以考虑建立这些专业团队，由他们围绕这一细分技能集的最佳实践为价值流提供*咨询*。高度成熟的DevOps公司还会投入将这种专业技能*作为服务*提供，通常通过易于理解的接口对底层细节进行抽象，从而降低价值流的认知负荷。\n\
  \n## 赋能团队\n\n交付更多功能的压力不断增加，有时会使价值流偏离其核心差异化产品。价值流可能会被拉入一些临时但需要深厚技能或经验的任务，而这些技能或经验他们未必有时间去学习。\n\
  \n这种模式经常出现在组织中的迁移场景中，例如，组织将应用程序从OpenShift（Red Hat的Kubernetes产品）等技术栈迁移到AWS中的EKS。并非所有价值流都可能意识到此类迁移的特殊性，以及他们应着重评估的应用栈中的依赖关系。为了推进此类迁移，通常有帮助的做法是建立赋能团队，这是一种临时结构，由在公司内参与过许多其他工作负载类似迁移的人员组成。他们过去的经验对于想要进行类似操作的团队来说可以增加巨大价值。\n\
  \n实践社区（CoP）是组织内部对某件事物有共同关注或热情的一群人。他们定期会面，相互协作和学习。这些社区可能有多方面的目的；有时是帮助其他社区解决日常工作需要，分享组织的最佳实践和指导方针，或者促进突破性创新和新实践。如图10.2所示，CoP是一种重叠结构，它衍生出公司的多个团队，并将所有兴趣相似的人聚在一起：\n\
  \n![](img/ecd265dfca9bb64161408ba8a944a4d9_250_0.png)\n\n在经历重大转型时，组织通常至少每周计划一次这种协作工作会话。在后期阶段，他们可能希望根据各团队从这种设置中获得的价值，通过进一步减少或增加频率来重新审视节奏。\n\
  \n## 衡量团队的DevOps成熟度\n\n改进某件事的重要先决条件是从衡量它开始。衡量团队的DevOps成熟度也是如此。识别需要改进的领域、了解进展，并跟踪作为组织DevOps实践一部分已推出的任何流程或变更的有效性，这一点至关重要。但您可能想问，究竟需要衡量什么？\n\
  \n**《2022年加速DevOps现状报告》**（参考：`https://services.google.com/fh/files/misc/2022_state_of_devops_report.pdf`）提到两类分析，一类针对*软件交付性能*，另一类针对*运营性能*。这些报告基于来自不同组织超过33,000名受访者的反馈。*图10.3*重点介绍了软件交付性能类别的四个关键指标，这些指标将帮助您量化团队当前的表现，并与行业基准进行比较：\n\
  \n| 软件交付性能指标 | 低 | 中 | 高 |\n|---|---|---|---|\n| **部署频率**<br>对于您负责的主要应用程序或服务，您的组织多久将代码部署到生产环境或发布给最终用户？\
  \ | 每月一次至每6个月一次 | 每周一次至每月一次 | 按需（每天多次部署） |\n| **变更前置时间**<br>对于您负责的主要应用程序或服务，您的变更前置时间是多少（即从代码提交到代码成功在生产环境中运行需要多长时间）？\
  \ | 一个月至六个月 | 一周至一个月 | 一天至一周 |\n| **服务恢复时间**<br>对于您负责的主要应用程序或服务，当发生服务事件或影响用户的缺陷（如计划外停机或服务受损）时，通常需要多长时间恢复服务？\
  \ | 一周至一个月 | 一天至一周 | 少于一天 |\n| **变更失败率**<br>对于您负责的主要应用程序或服务，有多少比例的生产变更或发布给用户的变更导致服务降级（例如，导致服务受损或服务中断），随后需要修复（例如，需要热修复、回滚、向前修复、补丁）？\
  \ | 46%-60% | 16%-30% | 0%-15% |\n\n图10.3 – 衡量软件交付性能的四个指标\n\n（来源：《2022年加速DevOps现状报告》）\n\
  \n它让您了解其他公司的表现，以及您是否希望通过任何方式改进当前状态，从而追求更高的目标。\n\n然而，所有这些都需要根据应用程序的实际需求和最终客户的期望进行讨论和规划。因此，具体情况很重要。并非所有团队和应用程序都需要每天部署10次，但如果需要，就必须确保发布流程支持这一点。\n\
  \n同一份报告进一步描述了第二种聚类方法，该方法汇总软件交付性能指标，并在此基础上融入可靠性方面。对这些领域的整体审视可以反映您所管理工作负载的当前状态，从而产生四种不同的分类：\n\
  \n- 起步\n- 流动\n- 放缓\n- 退役\n\n作为DevOps实践者，您的目标应该是确保分析结果符合工作负载或价值流的期望。这些分类在*图10.4*中突出显示：\n\
  \n| 分类 | 稳定性：服务恢复时间 | 稳定性：变更失败率 | 运营性能：可靠性 | 吞吐量：前置时间 | 吞吐量：部署频率 | 受访者占比 |\n|---|---|---|---|---|---|---|\n\
  | 起步 | 一天至一周 | 31%–45% | 有时达到预期 | 一周至一个月 | 每周一次至每月一次 | 28% |\n| 流动 | 少于一小时 | 0%–15%\
  \ | 通常达到预期 | 少于一天 | 按需（每天多次部署） | 17% |\n| 放缓 | 少于一天 | 0%–15% | 通常达到预期 | 一周至一个月 |\
  \ 每周一次至每月一次 | 34% |\n| 退役 | 一个月至六个月 | 46%–60% | 通常达到预期 | 一个月至六个月 | 每月一次至每6个月一次 |\
  \ 21% |\n\n图10.4 – 对软件交付和运营性能指标进行聚类，以识别工作负载的当前状态（来源：《2022年加速DevOps现状报告》）\n\n## 打破开发与运维的孤岛\n\
  \n许多组织可能会将团队划分为独立的功能领域，从而形成由开发人员、运维人员、QA人员等组成的群体。这种模式让您无法获得共享责任、所有权和团队凝聚力在DevOps旅程中可以带来的好处。DevOps方法论的全部理念就是打破这些孤岛，确保团队之间更频繁地沟通，在最终客户需求上保持一致，并协作实现这一目标。这些团队之间存在的壁垒会产生变革阻力，不利于更频繁地可靠发布软件。过去具有一些系统管理背景的开发人员应积极参与软件运维的改进。另一方面，运维人员可能精通一些应用程序编程语言，因此他们可以利用这些能力来帮助开发人员大规模地可靠推出变更。\n\
  \n然而，在长期使用孤岛模式的组织中引入这种改变可能会面临一些阻力。我在这类团队中看到的行之有效的一种策略是暂时*嵌入*DevOps实践者，让他们充当变革推动者。通过引入围绕开发、运维和沟通的新实践，并辅以自动化和工具支持，他们可以激励团队成员超越预设边界思考，专注于推动客户价值。\n\
  \n\n\n\n一个专职团队。关键点在于，应由一个团队全权负责他们所管理服务的整个生命周期，从创意构思到生产运维，并且他们应当以充分的自主权和所有权出色地履行这一职责。\n\
  \n## 投入构建能推广最佳实践的抽象层\n\n创建 Amazon RDS 数据库并非一项差异化任务。利用这些数据库从数据中提取价值并展现卓越的工程能力才是。\n\
  \n如果你把这类服务的基础设施生命周期管理交给各个团队，那么组织中的每个团队很有可能都会以略有不同的方式来实现。有些团队可能不会启用静态加密，有些则可能不会强制使用\
  \ SSL 连接参数。此外，对于刚开始使用 AWS 的组织而言，可能希望在团队逐步理解最佳实践的同时，确保云中具备最低限度的安全态势。**AWS Service\
  \ Catalog** 等服务在这方面会非常有用。平台团队可以通过在 Service Catalog 中实现并抽象实现细节，向最终用户提供现成的打包产品*目录*。此处的产品可以在底层使用\
  \ **CloudFormation** 或 **Terraform** 脚本实现，这两种都是著名的 IaC 解决方案。价值流团队无需关心平台团队提供这些服务时的具体配置细节，只需像使用任何其他\
  \ SaaS 产品一样将其作为一项服务来使用即可。这些产品还可以适应其被配置部署的软件环境。在生产环境中，它们可以启用备份保留并防止意外删除，而在开发环境中，它们可以强制采用低成本配置。\n\
  \n## 将故障注入演练常态化\n\n对于可用性要求极高的关键业务应用，组织可能会实施**灾难恢复（DR）**流程和架构，以应对区域级故障。这类场景很少发生，意味着灾难恢复流程在真正发生故障之前几乎不会被测试。**Fault\
  \ Injection Simulator** 和 **Resilience Hub** 等 AWS 服务允许用户主动引入某些故障场景，例如**可用区（AZ）**（AWS\
  \ 中一组数据中心）不可用、容器 CPU 使用率突然飙升等。除了让团队对其工作负载在这些情况下能否平稳运行更有信心外，这些演练还有助于发现开发人员可能未曾考虑到的方面。过去两年内从未触发过的灾难恢复流程，其风险与完全没有灾难恢复流程一样大。\n\
  \n运维实践高度成熟的组织，每年都会多次从备用站点常规运行其关键工作负载。\n\n## 让技术决策与业务预期保持一致\n\n正如人们所说，使用 AWS 服务就像小孩子走进糖果店。周围有太多东西让你想全部拥有。在消费这些服务时，与实际工作负载的需求保持平衡非常重要。例如，多区域可用性并非始终是应用的必备条件。将现有单体应用容器化也未必总能带来令人满意的结果。追求额外\
  \ 0.01% 的应用可用性，可能会导致成本和架构复杂性增加，而这些投入并不能证明这微乎其微的可用性提升是值得的。因此，有必要将所有决策与实际业务需求进行权衡，并尽量保持架构精简。\n\
  \n如果你还记得我们之前在 *Accelerate DevOps* 报告中提到的指标，应用可靠性与软件交付一样，被视为一项重要的 DevOps 成熟度指标。\n\
  \n因此，为你的工作负载定义切实可行的阈值和可用性目标，是构建满足你需求的高效云架构的一个非常重要的输入。但如何衡量系统的可靠性，并将其传达给客户呢？这里有两个重要指标：**服务级别目标（SLOs）**\
  \ 和 **服务级别指标（SLIs）**。SLO 是公司就系统可用性向用户做出的承诺。作为服务提供商，你可以承诺 99.99% 的月度可用性 SLO。而 SLI\
  \ 则是判断 SLO 是否达标的关键指标，它是 SLO 中所描述指标的实际测量值。\n\n基于服务所承诺的 SLO，提供商会制定**服务级别协议（SLA）**。SLA\
  \ 规定了公司在无法满足所承诺的 SLO 时将采取的行动。通常，这些行动会转化为服务积分或账单折扣。\n\n**你知道吗？**\n谷歌会对某些服务实施定期的计划停机，以防止服务*过度可用*。他们最初在一个内部系统的一些前端服务器上尝试了这种做法。这次停机揭示了一些其他服务正在不当地使用这些服务器。有了这些信息，他们得以将工作负载迁移到更合适的地方，同时将服务器维持在恰当的可用性水平。\n\
  \nDevOps 方法论所推动的新工作方式与 AWS 服务的创新性使用相结合，常常会促使组织内部识别出新的角色和路线图。出于个人兴趣，一些现有员工也可能会受到激励，转变职业方向，在云技能方面发展深度和广度。在下一节中，我将向你介绍一些学习资源，帮助你的团队走向成功。\n\
  \n## 持续学习与赋能的资源\n\n这些是经过时间考验的实践，已被亚马逊采用，要么用于自身使用，要么用于为客户构建创新解决方案。让我们深入了解每个资源的重点领域：\n\
  \n- **Amazon Builders’ Library**\n\n  Amazon Builders’ Library 是一系列文章，解释了亚马逊如何创建、设计、发布和管理技术。这些文章由亚马逊经验丰富的技术领导者和工程师撰写，涵盖了与架构、软件交付和运维相关的各种主题。例如，你可以了解亚马逊的软件交付自动化方法，这使他们能够一年内进行超过\
  \ 1.5 亿次部署。你还可以探索亚马逊工程师如何利用洗牌分片（shuffle sharding）等原则来构建强大而可靠的系统，即使在故障期间也能处理错误并保持可访问性。Builders’\
  \ Library 的文章合集可在 `https://aws.amazon.com/builders-library` 获取。\n\n- **解决方案库及其模式**\n\
  \n  如今，组织都在寻找可信赖的解决方案和有用的建议，以快速解决其业务问题。AWS Solutions Library 提供了由 AWS 及其合作伙伴创建的各种解决方案。这些方案可以按原样使用，也可以根据特定需求进行定制。它们涵盖广泛的行业和技术使用场景，为客户提供了符合其需求的选择。你可以在\
  \ `https://aws.amazon.com/solutions/` 访问所有这些模式。\n\n- **AWS 上的研讨会**\n\n  还有什么比动手实践教程更好的方式来学习实用技能、概念和技术，从而解决业务问题呢？你可以使用\
  \ AWS 团队开发的精选内容，访问地址为 `https://awsworkshop.io/`。\n\n- **本地社区和用户组**\n\n  另一个很好的知识交流来源是参与本地社区和用户组，人们可以在其中分享他们在\
  \ AWS 上使用特定技术栈解决问题的经验。你可以在 Meetup 等门户网站中搜索这些社区：`https://www.meetup.com/`。\n\n在掌握了所有技能和知识之后，许多\
  \ DevOps 个人贡献者仍然面临的一个常见问题是，如何在组织内部推动变革。让我们讨论一些技巧，帮助你取得成功。\n\n\n\n\n\n## 自下而上推动变革\n\
  \n公司内部存在多个层面的影响力，从CEO一直到编写代码为客户交付价值的工程师。作为DevOps从业者，有时向团队推广采用某种工具或自动化方案的理念或好处会成为一种挑战，尽管这些方案能帮助更广泛的团队为客户交付更多价值。本节将介绍一些技巧，供你参考，以展示你所提方案的真实价值。这并不容易，因为你作为个人贡献者的影响力层级可能无法让你自上而下地推动想法。但好处在于，你处于一个独特的位置，可以真正在基层*实施*变革，并快速*验证*想法，以展示切实的价值。在这个范围内，你可以轻松迈出第一步，为你的提案注入活力，看看它是否适合你。一旦奏效，就可以向前推进了。让我们讨论一些能帮助你在组织链条中向上推销DevOps理念的方法。\n\
  \n### 精心构建你的想法\n\n描述想法时，不要从最深的技术实现细节开始。要聚焦于它提供的价值，以及这些价值如何带来成功。如果你构建了一个向架构栈的各个组件注入故障以测试其韧性的工具，务必强调采用这种方法能让所有客户获得的价值。虽然这无疑有助于软件开发人员测试其应用栈的韧性以及代码在灾难期间的行为，但最终也会使终端客户受益，因为他们使用的应用将更加可靠，能够很好地应对意外场景。\n\
  \n### 展示承诺\n\n开发一个端到端可用的**概念验证（PoC）**，并展示使用它的好处。这表明你对该想法有承诺，不会半途而废。此外，通过这样做，你可以降低或完全消除利益相关者可能面临的工作浪费风险。这会让他们更容易接受这个想法，并以可运行的形式体验它。\n\
  \n### 寻找合作者并分享良好实践\n\n一旦初始PoC得到验证，你可能希望在你的团队内外寻找更多合作者，与更大的群体分享采用该工具或自动化的好处。除了获得对当前实施状态的反馈外，这还能帮助你收集其他团队成员的想法和问题。例如，在CoP会议上演示这些PoC，可能是推进事情进展的好方法。\n\
  \n### 小结\n\n在本章开始时，我们强调了在DevOps领域整合人员与技术对成功举措的重要性。人员推动DevOps的文化和协作方面，而技术则提供必要的工具和基础设施。最重要的收获应该是：在采用技术之前，先专注于建立正确的团队文化基础和工作模式。\n\
  \n接着，我们讨论了一些团队工作模式，这些模式在所有权、管理便捷性和自主性之间提供了恰当的平衡。即使它们不能原封不动地适用于你的组织，也可以作为你最终想要过渡到的目标模式。通过这样做，你就能开始收获它们带来的好处。接下来，我们讨论了技术最佳实践，帮助你的团队以最佳方式采用AWS服务。在考虑业务需求的情况下做出技术决策、构建正确的抽象层以及开发可复用工作流，都能帮助团队中的每个人表现得更好。\n\
  \n当然，做所有这些有时会导致公司内部的角色转变。为了使这种转变尽可能顺利，我们讨论了一些持续学习和发展的策略，以及如何自下而上推动变革——这是个人贡献者经常面临的挑战。在下一章《确保多账户和多区域环境中的强大AWS基础》中，我们将探讨在多账户环境中运营AWS的最佳实践。此外，我们还将研究一些AWS服务和开源解决方案，它们可以帮助以代码方式编排这样的环境。\n\
  \n### 延伸阅读\n\n要了解更多关于本章涉及主题的内容，请查看以下资源：\n\n- 适用于团队赋能的AWS动手教程：https://aws.amazon.com/getting-started/hands-on/\n\
  - 通过创建云赋能引擎加速云采用：https://aws.amazon.com/blogs/training-and-certification/accelerate-cloud-adoption-by-creating-a-cloud-enablement-engine/\n"
- "## 确保多账户和多区域环境中的强大AWS基础\n\nAWS账户是你所创建的AWS资源的*逻辑容器*。它提供了一种结构，可用于轻松管理一组相关资源的访问、账单和隔离需求。\n\
  \n所有组织都是从创建一个账户并在其中托管一些**概念验证（PoC）**工作负载开始其AWS之旅的。随着他们获得更多经验和技能，他们对云服务的信心和熟悉度也会增加。在某个时点，组织可能会决定将其本地生产工作负载迁移到云端。或者，更好的情况是，他们可能直接开始利用AWS服务开发云原生应用，以实现最大化的创新。\n\
  \n这通常是一个关键转折点，他们必须决定所有工作负载是托管在一个还是多个AWS账户中。这些讨论背后的主要驱动力是单账户带来的问题。当AWS平台的使用超出其最初托管PoC工作负载的意图，并转变为一个需要企业级安全、治理控制、成本管理、细粒度访问策略等的成熟环境时，这些问题就会出现。\n\
  \n然而，这些问题的性质可能因不同规模运营的不同组织而有所差异。有些组织可能发现难以在单个账户中为多个用户管理细粒度安全策略，而另一些组织可能难以在开发和生产工作负载之间实施边界，例如。除了应用挑战外，云提供商还设置了服务限制和配额，这可能将单个AWS账户的使用限制在某一阈值之外。无论最初讨论的原因是什么，所有组织在AWS使用成熟后都会面临这些挑战，并必须采用多账户策略。\n\
  \n让软件开发人员能够无缝地将工作负载接入专用的AWS账户，同时*自动*提供最低安全基线、网络连接和运维，是*平台团队*的一些关键职责，该团队负责管理整个组织的云环境。这些团队在提供坚实的多账户、多区域云基础（也称为着陆区）方面发挥着重要作用。你可能会问：为什么我们甚至需要为此制定策略？设想一个场景，必须创建多个AWS账户来解决我们之前讨论的所有问题。单独管理几个账户不是问题，但一旦数量增加到几十个甚至上百个——这在中型企业中很典型——你很快就会面临扩展问题。此外，如何确保所有账户中的工作负载合规？如何一次性在所有账户中以代码方式配置全球资源？CISO团队是否有办法轻松验证整个AWS环境的安全态势？平台团队如何在整个AWS环境中提供遥测能力？工作负载如何通过网络相互通信以及与本地数据中心通信？如何强制执行阻止使用某些AWS区域和高成本GPU实例的组织级策略？\n\
  \n这些只是平台团队通常面临的挑战的几个例子，而如何解决这些挑战将是本章的主题。我们将研究AWS通过一些服务和现成解决方案提供的功能，以简化这些多账户环境的运营管理。此外，着陆区也*以代码方式管理*，就像任何其他软件应用一样。因此，我们之前讨论的所有DevOps和DevSecOps原则，如IaC、持续测试和安全左移，同样适用于这一概念。\n\
  \n作为DevOps从业者，每当你注意到与使用单个或极少数AWS账户相关的组织复杂性时，可能就是头脑风暴和推广一个定义明确、自动化驱动、多账户环境（着陆区）理念的正确时机。这些复杂性如果得不到解决，将直接影响软件团队无缝采用AWS服务的敏捷性。此外，重要的是要强调，这些概念不仅限于大型企业公司，对于那些正在迈出第一步以巩固其AWS账户态势、以增强云端敏捷性、治理和控制能力的组织来说，也同样重要。\n\
  \n我们将在接下来的章节中讨论以下主题：\n\n- 什么是着陆区？\n- 着陆区中的关键考量\n- 运营多账户架构的最佳实践\n- 使用Control Tower和CfCT编排多账户部署\n\
  \n### 什么是着陆区？\n\n着陆区是一个预定义的多账户环境的概念，允许你以*自动化*方式安全地将应用工作负载接入云端。一个良好的多账户基础可以降低不同团队的认知负担，并让开发人员更快地行动。它要么阻止\n\
  \n\n\n任何默认配置错误，或者无需费力就能从问题中恢复。这些基础通常能解锁两个主要用例——将工作负载从本地环境迁移，或在云端进行全新开发。因此，这里的主要目标如下：\n\
  \n- 安全且合规\n- 可扩展且具有弹性\n- 灵活适应未来变化\n\n衡量着陆区成熟度的一个好的 KPI 是——创建一个新的 AWS 账户并使其准备好承载生产工作负载需要多长时间。这中间有很多环节，从账户请求、审批、配置到实际使用，凸显了从人员到技术和自动化等各类挑战。\n\
  \n**着陆区**（Landing Zone）一词在不同语境下经常被使用，甚至被误用，这可能会让用户感到困惑。让我们来看看过去几年中我观察到的四种常见模式：\n\
  \n- **作为概念的着陆区：** 这是一个多账户云基础的理念，以及实际部署到你的 AWS 环境中的有形成果。它帮助组织从成本隔离、安全和访问管理以及 AWS\
  \ 账户边界带来的爆炸半径缩减中获益。它提倡用可重复、易于测试和自动化的代码来管理所有基础设施自动化。\n\n  在整章中，我们将使用“着陆区”一词来同时指代这一概念，以及代表这一概念的有形基础结构。\n\
  \n- **作为解决方案的着陆区：** 解决方案是一种预先配置好、可随时部署的实现，通过利用各种 AWS 服务来满足特定需求——在本例中是多账户架构。几年前，AWS\
  \ 提供了一个公开可用的大型 CloudFormation 模板，名为 **AWS Landing Zone (ALZ)**，客户可以使用它将多个服务、账户和策略部署到他们的\
  \ AWS 组织中。它为客户的 AWS 之旅提供了坚实的企业级基础。该方案已不再受支持，已被弃用，取而代之的是一项名为 **AWS Control Tower**\
  \ 的托管服务，我们将在本章后面更详细地介绍它。AWS 提供的其他解决方案示例包括 **Customizations for Control Tower (CfCT)**\
  \ 和 **Account Factory for Terraform (AFT)**。\n\n- **作为 AWS 服务的着陆区：** 诸如 ALZ 之类的解决方案需要进行大量定制才能适应组织的独特需求。由于它完全由\
  \ CloudFormation 模板管理，因此不易维护和操作，更不用说通常从 AWS 服务中获得的 AWS 支持也已缺失。为了填补这些空白并降低使用 ALZ\
  \ 所带来的复杂性，AWS 推出了一项服务——AWS Control Tower——它基于从多个企业客户那里收集的现场经验，以及他们如何使用 ALZ 解决方案来构建可承载应用程序的坚实基础。Control\
  \ Tower 提供自动化功能，可创建新账户、为其配置基础安全资源、实施治理控制等等。很多时候，当用户使用“着陆区”一词时，他们往往指的是 Control Tower\
  \ 之类的服务。着陆区是一个更广泛的概念，该服务（在某种程度上）*实现*了它。\n\n- **作为部署编排框架引用的着落区：** 从核心上讲，着陆区是一个多账户概念。将此概念实际应用到你的\
  \ AWS Organizations 组织中，需要在多个 AWS 账户中部署资源。一些组织最终使用 CloudFormation、CDK 或 Terraform\
  \ 开发了自主解决方案。一些编排框架以开源代码的形式在 GitHub 上提供。用户可能会开始将其称为着陆区，但它们只不过是可以用来在多个账户中部署资源的部署框架。即使不在着陆区的上下文中使用，它们也有其自身的意义。\n\
  \n两个常用的开源框架是 **AWS Deployment Framework (ADF)** 和 **Service Catalog Tools**。\n\n\
  *图 11.1* 突出了所有不同的实体及其与着陆区概念的关系：\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_262_0.png)\n\
  \n图 11.1 – 不同实体与着陆区概念之间的关系\n\n**注意**\n\n尽管某些框架（如 ADF）名称中带有“AWS”，但它们并不作为企业支持计划的一部分得到云提供商的官方支持。这可能是公司可能要考虑（或至少要知道）的标准之一。另一方面，AFT\
  \ 和 CfCT 这两个解决方案与其他服务一样，确实带有 AWS 的官方支持。这些解决方案由 Control Tower 服务团队维护。\n\n我们可以用整整一本书来阐述着陆区的开发。一个重要的提醒是，这是一个*不断演变*的事物。组织不断变化的需求将决定着陆区设计必须满足的新标准和目标。为了实现这一点，服务、解决方案和部署框架必须进行调整。你如何使用这些服务和解决方案，将在很大程度上取决于组织内部的独特需求和实现。这就是为什么你永远不会遇到一个可以按原样采用的端到端实现。服务和解决方案将始终关注适用于大多数企业用例的*最低公共标准*。几乎总是会有一个定制层叠加在上面，以使其成为满足你需求的完整解决方案。\n\
  \n因此，本章的主要重点是向你介绍着陆区的关键考量、相关的 AWS 服务、解决方案和框架。这将帮助你确定应关注的领域，并向你介绍用于在多个 AWS 账户和区域中部署资源的部署编排框架。掌握这些知识后，你就可以提出适合你的自定义实现或设计。\n\
  \n## 着陆区中的关键考量\n\n从零开始创建一个能满足当前和未来所有组织需求的着陆区概念可能令人望而生畏。对于所有组织（无论大小）来说，有五个领域对于构建可扩展的\
  \ AWS 基础至关重要。我们将在本节中讨论它们，从多账户结构开始。\n\n## 为组织单位和账户定义结构\n\n着陆区设计的核心是一个账户结构，它使组织能够快速行动、实施细粒度控制、建立隔离边界并缩小爆炸半径，同时保持对未来变化的灵活性。到目前为止，在本章中，我们已经讨论了不少受益于多账户结构的领域。所有这些都与\
  \ **AWS Organizations** 服务高度契合，该服务可帮助你在同一个保护伞下管理整个 AWS 环境。它为你提供了组织控制能力，而在许多作为独立实体运行的离散\
  \ AWS 账户中，这些控制很难建立和维护。因此，如果你尚未使用 AWS Organizations，启用它是必不可少的。它免费提供，能立即为你带来合并账单、服务集成、用于集中控制服务使用的策略，以及为预算和合规需求而分组账户等方面的好处。让我们更详细地讨论它们，并在推进过程中强调一些最佳实践。\n\
  \n## 为合规和监管需求分组账户\n\n**组织单位（OU）** 是 AWS Organizations 的一项功能，允许你将多个 AWS 账户合并为一个逻辑实体。它是一种软性结构，可用于对需要类似治理和控制的特定账户进行分组。例如，可能有一部分企业应用程序受\
  \ **《健康保险携带和责任法案》（HIPAA）** 监管，因此可能不允许使用某些 AWS 服务。将这些账户分组、组成一个 OU，并在 OU 级别强制执行策略（所有账户都会继承这些策略）是很容易的。此外，任何其他被放入此\
  \ OU 的 AWS 账户，即使是将来加入的，也会自动遵循相同的规则，从而确保持续合规。再举一个例子，一些公司可能希望将所有开发工作负载账户分组在一起，以便应用某些阻止使用高成本计算的策略。暂且抛开自定义需求，某些\
  \ OU 适用于大多数组织，如下所述：\n\n- **共享服务 OU**：此 OU 包含平台服务账户，这些账户将被所有其他 AWS 账户使用，基本上是共享资源。通常会将\
  \ **Active Directory**、网络设备或代理服务等系统托管在此 OU 中（在专用账户中），且只能由授权人员访问。\n- **安全 OU**：这是你将\
  \ **Audit** 和 **LogArchive** 账户分组的地方，外部审计师和内部安全团队可以访问这些账户。作为最佳实践，来自 **CloudTrail**\
  \ 和 **Config** 的所有平台日志都应推送到中央 LogArchive 账户，以便 **安全信息和事件管理（SIEM）** 系统可以独立分析这些日志以进行威胁检测。\n\
  - **自动化 OU**：稍早前，我们略微提到了需要部署框架来让着陆区概念成为现实。在此 OU 中托管一个独立的 Automation 账户是一个很好的做法，该账户包含负责以自动化方式在所有其他账户中部署资源的框架。由于此账户对组织中几乎每个其他账户都有特权访问权限，因此访问权限通常仅限于管理整个\
  \ AWS 环境的工具。人工访问（如果有）应受到主动监控。\n- **维护 OU**：一旦将安全和监管策略应用于某个 OU，有时很难对该 OU 中包含的账户执行维护程序。因此，建议创建一个维护\
  \ OU，用于临时托管所有需要为特定需求做准备或需要对其进行操作的 AWS 账户。一个常见的用例是通过将 AWS 账户放入此 OU 来启用 AWS 可选区域。通常，这将是所有\
  \ OU 和账户中的受限操作，因为用户可能会启用可能破坏公司合规态势的区域。一旦区域启用，账户就会被放回其原始 OU。将此 OU 视为*维修站*，就像赛车比赛中用于进行小型维修和加油一样。\n\
  \n作为一项安全措施，还必须撤销所有其他 AWS 用户手动将任何账户移入此 OU 的权限，因为这样做会立即解除账户原来受到的所有限制。\n\n\n\n\n\n\
  - **Suspended OU：** 所有被暂停的 AWS 账户在被移除前会保持相同状态 90 天，作为冷静期。作为安全措施，该 OU 会限制这些账户中的所有操作，以防止任何额外计费或未经授权的使用。\n\
  - **Development OU：** 在安全控制与敏捷性之间取得正确平衡是创新的关键。组织通常会在所有 AWS 账户中强制执行一套标准策略和控制措施，这会阻碍开发者测试新想法并在云中创新。正如\
  \ AWS 所说，一个良好的 Landing Zone 设计遵循 *Guardrails, but not blockers* 原则。因此，创建专门的 OU 来托管个人开发者或团队账户作为创新空间非常重要。你仍然可以在这些\
  \ OU 上应用一定的预算限制，并阻止可能损害组织安全态势的 IAM 操作。\n\n在介绍了 Landing Zone 中最重要的 OU 后，让我们看看一个拥有专门团队负责技术栈不同领域的大型组织，以及需要遵守\
  \ HIPAA 等监管标准的应用程序工作负载，其 OU 设置会是什么样子。\n\n## 适用于受监管组织的示例 OU 设计\n\n大型企业通常拥有专门负责安全、网络运营、审计、软件开发等的团队。这些团队通常按成本中心分组，需要定制化的访问控制，并受安全控制和治理策略管理。另一方面，软件开发团队按业务域或价值流分组，并拥有多个环境，如开发、\
  \ staging 和生产，用于托管其应用程序工作负载。AWS 账户在计费、访问和隔离方面提供的边界非常适合此类场景。OU 可以提供逻辑结构，可在此结构下进一步对这些账户进行分组，以进行访问控制和策略执行。示例\
  \ OU 结构如下 *Figure 11.2* 所示：\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_265_0.png)\n\
  \nFigure 11.2 – Sample OU hierarchy for an organization hosting regulated workloads\n\
  \n将 AWS 账户分组到特定的 OU 下可简化策略的定义和映射。让我们在下一节中讨论这一点。\n\n## 强制执行策略以控制服务使用和标签分配\n\nAWS\
  \ Organizations 支持三种类型的策略 – **Service Control Policies (SCPs)**、**Tagging Policies**\
  \ 和 **Backup Policies。**\n\nSCP 可以限制所有 OU 或其映射的账户的某些 IAM 操作。需要注意不要过度使用它们，因为存在策略大小限制（5,120\
  \ 字节）以及可以直接应用于 AWS 账户或 OU 的策略总数限制（目前为 5）。将它们视为 *global controls*，拒绝所有你不希望用户执行的操作。例如，拒绝除你希望运营的区域之外的所有其他\
  \ AWS 区域是常见的 SCP 控制。另一个例子可以是拒绝将 S3 存储桶设为公开的配置，或限制可能产生成本影响或被以某种方式滥用的某些 EC2 实例类型。AWS\
  \ IAM 本质上会拒绝所有未明确添加到策略中的操作，但 SCP 是一种全局管理机制，具有最高优先级，即使在某些 IAM 操作被错误地允许在用户或资源上时也是如此。\n\
  \nTagging policies 与 SCP 结合使用，用于强制执行某些标签键及其对应值存在的策略。几乎所有 AWS 资源都支持标签，它们是键值对，用于为特定资源提供额外上下文。这对于追踪支持、运营或成本分析需求的资源所有者和应用程序团队特别有用。组织常犯的一个错误是投入过多时间和精力制定一个能满足未来所有需求的标签策略。强烈建议从后往前开始——即先确定你希望通过标签解决的问题，然后制定有助于强制执行的标签策略。例如，如果组织在汇总的成本和使用报告中难以识别资源所有者，强制执行映射团队和个人的标签键可能会有所帮助。\n\
  \nBackup policies 用于自动将备份计划应用于所有 AWS 账户中的受支持资源。\n\n## 利用与 AWS Organizations 的服务集成\n\
  \n诸如 **AWS Security Hub**、**AWS CloudFormation** 和 **AWS Config** 等 AWS 服务，以及许多其他服务，可以利用\
  \ AWS Organizations 的一项功能 **Trusted Access**，搭载组织服务功能并自动管理组织中的多个账户。这大大简化了某些任务的管理，例如在账户创建后立即启用对账户中所有\
  \ AWS 资源合规性记录。例如，Security Hub 可以自动将组织中的任何新账户注册并开始扫描其安全风险。要查找与 AWS Organizations\
  \ 集成的所有 AWS 服务列表，可以参考此页面：https://docs.aws.amazon.com/organizations/latest/userguide/orgs_integrate_services_list.html。\n\
  \n## 专注于跨账户和混合网络需求\n\n无论你计划使用 AWS 迁移本地工作负载还是在云中开发新应用程序，网络连接都将是一个基本需求。应用程序需要与托管在另一个账户中的共享服务通信，并与本地的对应方通信。从安全和合规角度来看，你可能希望对互联网入站和出站或跨账户通信实施数据包级检查。网络流可以根据组织特定需求进行高度定制。过去几年中\
  \ AWS 在网络领域的产品呈指数级增长，但这并不意味着你需要从一开始就采用和使用最精尖的服务。Landing Zone 会随着时间的推移而演进，这同样适用于网络需求。\n\
  \n例如，我经常看到团队从一开始就利用 **AWS Transit Gateway**。如果你只管理少数几个账户，大多数用例都可以通过在多个账户之间共享子网并实现\
  \ VPC 对等连接来简单解决，即使是跨区域数据传输需求也是如此。你应该意识到过早采用此类服务的设计权衡和成本或复杂性影响。此外，网格网络通常并不需要，因此了解平台需要支持的不同网络流并构建以成本优化和安全的方式实现必要功能的架构非常宝贵。\n\
  \n本地连接也一样，除非应用程序有具体要求，否则可能不需要高带宽、低延迟的 **Direct Connect** 连接。通过单个 Transit Gateway\
  \ 汇总多个站点到站点 VPN 连接通常可以满足混合部署的带宽和高可用性需求。\n\n然而，企业在某些情况下确实需要更复杂的设置来支持合规性、数据包检查或性能敏感型应用程序的需求。在这些情况下，诸如入站\
  \ VPC、出口 VPC 和集中式数据包检查架构等网络结构可以支持任何新加入 Landing Zone 的 AWS 账户的需求。深入探讨架构细节超出了本章范围，但如果你有兴趣了解更多，我推荐以下博客：`https://aws.amazon.com/blogs/networking-and-content-delivery/tag/hybrid-connectivity/`。\n\
  \n## 使用 IAM 和安全服务保护 Landing Zone\n\nLanding Zone 的设计需要考虑谁将访问 AWS 账户，以及他们将拥有哪些权限。最小权限原则有助于指导定义开发者或工具执行某项活动所需的最低权限。\n\
  \n使用 AWS CloudTrail 审计所有活动，AWS CloudTrail 是安全审计和故障排除服务，可让平台所有者或安全专业人员提醒并调查所有 AWS\
  \ 账户中的任何意外使用。我们讨论了与 AWS Organizations 的服务集成，CloudTrail 也可从中受益。作为最佳实践，启用组织范围的\n\n\
  \n\n通过跟踪，可以将审计数据集中聚合到 LogArchive 账户中的 S3 存储桶。当新账户创建或现有账户加入组织时，它会自动将跟踪配置注入这些账户。作为企业安全措施的一部分，您应强制执行一个\
  \ SCP，阻止任何可能导致篡改此 S3 存储桶中的数据或修改 CloudTrail 服务所使用的加密密钥的 IAM 操作。\n\n其次，对于用户访问需求，我强烈推荐使用\
  \ **AWS IAM Identity Center**，它允许你集中创建和连接所有员工用户，并管理他们在所有其他 AWS 账户中的访问权限。借助 Identity\
  \ Center，你可以利用现有的**身份提供商（IdPs）**（如 Azure Active Directory）将用户联合到 AWS 账户中。\n\n> **注意**\n\
  > \n> IAM Identity Center 控制平面仅在该服务实例化的 AWS 区域中可用。为同一区域受灾难影响的场景做好准备是一种良好的实践。如果 Identity\
  \ Center 不可用，可能意味着所有用户对 AWS 账户的访问都将被锁定。为缓解这种情况，建议准备一组 *应急（break-glass）* IAM 用户，可在特殊情况下用于紧急访问。这些凭证应通过\
  \ MFA 进行保护；访问密钥 ID 和秘密访问密钥应分别由不同人员保管，以避免滥用。当然，所有活动都应被审计，并且凭证应定期轮换。\n\n第三，很难确保对 AWS\
  \ 账户中可能发生的所有安全事件都保持警觉并采取预防措施。**Amazon GuardDuty** 是一个唾手可得的选项，它利用机器学习来识别异常网络流量、DNS\
  \ 日志、CloudTrail 事件以及潜在的权限提升场景。它还可以针对代表恶意软件和比特币挖矿的异常 EC2 行为发出告警。通过利用与 AWS Organizations\
  \ 的集成，GuardDuty 可以自动扫描组织内的所有 AWS 账户，并将发现结果输入到 AWS Security Hub，后者是一个来自多个其他服务的安全检查聚合器。\n\
  \n## DevOps 与配置管理\n\n您的 Landing Zone 实现将像任何其他软件应用程序一样以代码形式进行管理。强烈建议从一开始就采用定义良好的实践，例如\
  \ IaC、CI 和自动化代码验证。您编写的任何 CloudFormation 模板都应通过安全检查门禁和策略，这些策略定义了您在 AWS 环境中可以做什么和不可以做什么。\n\
  \n大多数 AWS 解决方案都从源代码存储库触发，这些存储库通常在 **AWS CodeCommit** 中管理。本章后面介绍 CfCT 解决方案时，我们将看到它在实践中的样子。\n\
  \n由于部署工具具有在组织中几乎所有其他账户中部署资源的权限，因此对这些管道强制执行正确的访问控制至关重要，以确保它们不会以任何方式被滥用。对托管部署工具和框架的账户的访问也应受到严格限制。如果您想使用其他\
  \ CI/CD 系统（例如 **GitLab**），您可能会对 **Open ID Connect（OIDC）** 与 AWS IAM 的集成感兴趣，这消除了在\
  \ CI/CD 管道中预置任何临时 IAM 用户或凭证的需要。\n\n## 运维\n\n您的 Landing Zone 策略需要考虑平台和应用程序的可观测性、基础设施监控、应用程序监控、事件管理、变更管理等需求。\n\
  \n通知、告警和报告应与现有的寻呼工具集成。这应允许值班运维团队以与处理无法正常工作的生产应用程序相同的优先级来支持 Landing Zone 或任何故障。AWS\
  \ 还提供了其他服务，例如**个人健康仪表板（PHD）**和**服务限制（Service Limits）**告警，这些服务对于显示特定区域中服务的任何持续问题以及资源的计划维护活动至关重要。\n\
  \n在介绍了优秀 Landing Zone 概念的关键考量之后，让我们深入探讨一些最佳实践，这些实践将帮助您取得成功。\n\n## 管理多账户架构的最佳实践\n\
  \n以下最佳实践涉及我们在上一节中介绍的许多领域。基于我为多家企业客户开发 Landing Zone 的经验，我想分享一些关于您可以为您的组织考虑采用的最佳实践的见解。\n\
  \n### 限制对管理账户的访问\n\n您在其中引导 AWS Organizations 组织的 AWS 账户被称为**管理账户**，即主付款方。这是一个高度特权的账户，可提供对策略管理、集中式计费和成本报告以及账户管理的访问。只有在特殊情况下，才应由选定人员访问该账户。\n\
  \nSCP 不适用于管理账户，这使得在该层面强制执行任何策略或治理控制变得困难。其次，默认情况下，AWS Organizations 会向组织中的所有 AWS\
  \ 账户注入一个具有 `AdministratorAccess` 权限的 IAM 角色，以及一个允许管理账户不受限制访问的信任策略。这意味着，除非已采取其他措施来阻止，否则任何可以访问管理账户的人都可以代入该角色，并获得对组织中任何其他账户的提升权限。此外，由于所有策略都是从管理账户管理和执行的，您可以解除所有限制，从而使整个组织面临安全风险。\n\
  \n作为 Landing Zone 自动化过程的一部分，某些用例无法避免，即工具需要访问管理账户才能执行一些只能在管理账户内执行的操作。例如，启用可选区域（opt-in\
  \ region）或将账户移动到不同的 OU，只能从管理账户内部执行。一种良好的安全实践是在管理账户中创建细粒度的 IAM 角色，赋予 Landing Zone\
  \ 自动化工具仅执行允许的 IAM 操作的权限。\n\nAWS Organizations 还有一个称为**委托管理员（Delegated Admin）**的有趣功能，现在对它的支持已扩展到许多\
  \ AWS 服务。它允许将特定服务的管理能力*委派*给组织中的另一个账户。委托管理员进一步减少了登录管理账户的需要，并允许服务所有者从委派账户本身管理特定服务。\n\
  \n### 采用在易用性和控制性之间取得适当平衡的解决方案\n\n值得重申的是：没有任何 AWS 解决方案、服务或框架能够原样满足您所有的 Landing Zone\
  \ 需求。每个客户都不同，每个用例都需要深入分析，从而产生自定义实现。所有这些服务和框架的优点在于，它们可能功能有限，但它们做得很好。因此，将它们视为可以组合起来构建\
  \ Landing Zone 的互补技术总是有帮助的。举一个具体的例子，AWS Control Tower 服务将帮助您在不到一小时内构建每家公司所需的初始 30%\
  \ 到 40%。然后，您需要专注于将此服务与另一个帮助您构建剩余 60% 到 70% 的框架相结合。\n\n理想情况下，您自己应该开发的唯一代码是跨所有这些服务和框架的编排器，同时充分利用它们所能提供的最佳能力。\n\
  \n另一方面，一些组织在 **CloudFormation** 和 **Terraform** 等技术上投入了大量精力。根据他们的专业知识和熟练程度，他们可能还会决定从头开始构建整个\
  \ Landing Zone，这也是可以的，只要他们清楚自行维护这些框架与长期受益于更多控制之间的权衡。\n\n### 投资构建账户自动售货机（Account\
  \ Vending Machine）\n\n当谈到以代码方式管理 Landing Zone 时，大多数组织专注于构建 IaC 层，该层直接与云提供商的 API\
  \ 交互并将资源部署到 AWS 账户中。在构建整体基础时，他们忽略了两件关键的事情：\n\n- 首先是一个总体层，将该框架与公司内部的现有工具和流程集成起来\n\
  - 其次，忽略了一个事实，即整个 IaC 层都有其相关的生命周期，它从来不是一蹴而就的\n\n\n\n即使在 IaC 将资源部署到账户之前，也必须满足某些先决条件。账户配置完成后，您可能需要执行一些安装后流程，这些流程可能涉及通知、工单关闭或其他事项。这就是账户自助机（Account\
  \ Vending Machine，AVM）概念的用武之地。它负责这两个需求，并充当组织流程、实际 IaC 以及 AWS 账户管理生命周期各阶段之间的粘合剂。其核心职责是以如同从工厂产出并可立即承载生产级工作负载的方式提供账户。让我们看一个示例。\n\
  \n企业通常有工单流程或其它机制来请求和审批 AWS 账户。示例包括 ServiceNow、Jira 或自研定制方案。请求提交后，您希望以事件驱动的方式调用 AVM，这可以通过传递反映工单系统输入的有效负载来实现。AVM\
  \ 然后管理账户创建流程的生命周期，从确保先决条件就绪开始，通过 IaC 栈部署资源，最后执行部署后流程。\n\n## 为平台开发维护一个单独的 AWS Organizations\
  \ 组织\n\n与软件开发生命周期类似，首先在隔离环境中测试新的 Landing Zone 功能和变更，然后再在生产 AWS 组织中推广非常重要。诸如 SCP\
  \ 修改、网络路由配置和安全策略升级等小改动都可能产生巨大影响，同时影响多个账户。例如，错误配置 CloudTrail S3 存储桶可能导致日志和审计数据无法按预期聚合，从而丢失有价值的信息。\n\
  \n在托管生产工作负载的同一 AWS 组织中开发整体平台会大幅增加影响范围。AWS 账户是免费资源，因此复制生产环境的类似结构并不会带来巨大的成本影响。为了进一步限制开发环境中的额外支出，建议设置计费警报，并在不需要时，例如下班后或周末，使用\
  \ IaC 自动化删除整个组织中的所有资源。这是一种常见做法，使用诸如 aws-nuke（https://github.com/rebuy-de/aws-nuke）等工具清空所有账户。这验证了\
  \ IaC 框架的功能性和可重复性，以便在需要时，例如在灾难情况下，能够从零开始重新构建整个平台。\n\n## 避免配置任何 IAM 用户\n\n凭证泄露最常见的来源就是\
  \ AWS IAM 访问密钥，这些密钥可能会意外提交到源代码中，或留在不再使用的 EC2 实例中。您应始终力求为 AWS Landing Zone 中的任何访问需求利用\
  \ IAM 角色。在 Landing Zone 中的所有 AWS 账户中拒绝创建 IAM 用户是一种安全最佳实践。从技术上讲，所有 AWS 标识，无论是用户、服务还是资源本身，都可以承担\
  \ IAM 角色并在需要时从 IAM 控制平面请求临时凭证。EC2 实例具有实例配置文件概念，而 Lambda 和 RDS 等服务使用服务角色，从而使它们能够访问允许的资源。\n\
  \n大多数企业在组织中已在使用某种形式的 IdP 解决方案。AWS IAM 通过 **OIDC** 或 **Security Assertion Markup\
  \ Language（SAML）** 原生支持与此类提供商的集成，从而消除了在整个组织中配置和管理用户的需求。IAM 联合进一步防止凭证泛滥，并且从权威身份源（例如\
  \ Active Directory）离职的任何员工都会自动失去对所有 AWS 账户的访问权限，这是一个很好的安全收益。\n\n## 优先选择无代码或低代码解决方案\n\
  \n过去需要手动构建的许多集成现在都已由许多 AWS 服务原生支持。虽然这极大地提高了开发速度，但也减少了代码维护并提高了效率。Landing Zone 实现在很大程度上依赖于诸如\
  \ **AWS Step Functions、AWS Organizations、Lambda 和 IAM** 等服务，举几个例子。最近，AWS Step Functions，一项工作流管理服务，已启动与\
  \ AWS Organizations、Lambda 和许多其他服务的原生集成。因此，将账户移至不同 OU 等操作，以前需要 Lambda 函数在管理账户中承担角色，现在可以直接由\
  \ AWS Step Functions 执行，而无需您编写任何代码。\n\n发送平台通知是另一个示例，开发人员过去必须利用 Lambda、事件、SNS 或 SES\
  \ 等服务的组合。使用 **AWS User Notifications**，您可以利用所选 **EventBridge** 事件的自动通知，整个事件捕获、有效负载解析和通知触发的责任都转移给该服务。它通过多个渠道发送通知，例如\
  \ **Microsoft Teams、Slack 和 Email**。\n\n在讨论了构建 Landing Zone 基础时应遵循的几项最佳实践后，让我们讨论一下将服务如\
  \ AWS Control Tower 与 CfCT 结合使用时，这在实践中是什么样子的，CfCT 是 AWS 提供的一种跨多个账户部署资源的解决方案。\n\n\
  ## 使用 Control Tower 和 CfCT 构建 Landing Zone\n\n与从零开始构建一切相比，AWS Control Tower 为用户建立\
  \ Landing Zone 基础提供了快速入门。从托管安全和工作负载账户的基本 OU 结构开始，它提供了一个 *账户工厂* —— 在 **Service Catalog**\
  \ 之上的抽象，用于创建新账户并在其中配置资源。从日志和安全角度来看，它会自动推广组织范围的跟踪，使用 AWS CloudTrail，并通过利用 AWS Config\
  \ 的功能聚合合规状态。其核心是 *编排* 跨多个其他 AWS 服务的账户相关活动，以实现多账户结构的优势。此外，它定义了一个由 AWS Config 规则、IAM\
  \ 策略和 SCP 组成的安全和合规基线。这些合理的默认值阻止了诸如使 S3 存储桶公开、禁用 CloudTrail 日志或关闭 Config 记录器日志等操作，从而确保开箱即用的良好安全态势。\n\
  \n对于刚刚开始构建 AWS 基础的企业，AWS Control Tower 为其做了大量繁重的工作，减少了实施工作量和时间。其他更注重动手操作且精通 AWS\
  \ 技术栈的人，仍可能决定继续构建 Landing Zone 的定制版本，因为它赋予了他们更多控制权和工具选择。这是因为，作为一项服务，Control Tower\
  \ 本身并不能做太多。它基于大多数客户在建立可安全用于以最少阻力和延迟启动应用程序的云结构时遵循的最佳实践。对于账户管理，它依赖 AWS Organizations；对于策略，它依赖\
  \ SCP；对于合规性，它依赖 AWS Config；将资源部署到目标账户完全交由 CloudFormation 处理。为了受益于它提供的现成指导性基础，使用它仍然是一个好主意，并用另一个补充的部署解决方案或框架来填补空白。\n\
  \n在撰写本书时，该服务在某些方面表现并不突出。由于缺乏 API 支持，我建议在为需要频繁调用的功能构建任何硬依赖之前谨慎行事。通过 Web 控制台执行操作根本无法扩展，并且您需要向某人授予管理账户的访问权限（该服务只能部署在那里），这是不理想的。需要强调的是，服务操作是单线程的，这意味着它们一次只能处理一件事。此限制不适用于某些功能，例如账户请求，您最多可以达到五个，但这些限制对于要大规模配置和管理账户的一些组织来说可能是阻碍。\n\
  \n因此，我的建议是，对于刚刚开始 AWS 基础建设的公司，应利用该服务所提供的内容，让它在更大的 Landing Zone 领域中发挥其作用。您需要一个补充的解决方案或框架来实现服务捆绑中未包含的其他功能。对于已有\
  \ Landing Zone 或与 IaC 配合使用的框架的公司，我认为切换到 Control Tower 的价值较小。后者更适合那些愿意动手操作并自行大规模维护此类解决方案的公司。由于这里的实现选项多种多样，涵盖所有可能的实现场景已超出本章范围。在以下各节中，我们将更侧重于将\
  \ Control Tower 与您选择的另一个框架结合使用，以构建端到端的 Landing Zone 平台。\n\n在我们进入集成部署解决方案或框架的主题之前，让我们通过查看一张图表来确保我们对\
  \ Control Tower 服务有良好的理解：\n\n\n图 11.3 – AWS Control Tower 对不同 AWS 服务的编排\n\n此图并非详尽展示\
  \ AWS Control Tower 在后台处理的每一项功能；相反，它旨在突出账户创建工作流中涉及的不同步骤，以及随后向其中部署资源的过程。让我们更详细地看看这张图：\n\
  \n- 1. 平台开发人员使用 AWS Control Tower 控制台界面提交新的账户创建请求，并指定该账户应加入的目标 OU。\n- 2. AWS Control\
  \ Tower 将请求传递给 Account Factory（一个 Service Catalog 产品），由其启动账户预置工作流。\n- 3. 在后台，该请求会调用\
  \ AWS Organizations API 来创建新账户。\n- 4. 系统会创建一个 AWS 账户，并将其放入目标 OU，该 OU 决定了此账户中托管的工作负载将适用哪些策略控制和治理规则。\n\
  - 5. AWS CloudFormation StackSets 是一项可自动将堆栈部署到账户-区域组合的服务功能，AWS Control Tower 服务已经为其定义了一些可复用模板。AWS\
  \ Control Tower 会为 StackSet 定义创建新的堆栈实例，从而在目标账户中启动 AWS CloudFormation 模板的预置。\n- 6.\
  \ AWS CloudFormation 堆栈预置在目标账户内的特定 AWS 区域中开始，并部署诸如 AWS Config 记录器、IAM 角色以及其他以合规方式管理此账户所需的资源。\n\
  - 7. AWS Config 设置一个 *记录器*，用于监控账户内所有资源的变更，并设置一个交付通道。\n- 8. 配置记录器是一种记录所有资源配置变更并将数据发送到集中式\
  \ S3 存储桶以满足审计需求的机制；同时，通知会发送到 SNS 主题。SNS 通知按区域聚合，当发生意外资源变更时，安全团队可以使用这些通知进行高级分析和自动告警。\n\
  - 9. 当你首次安装 AWS Control Tower 时，它会创建一个组织级的 AWS CloudTrail 跟踪，自动获取组织中的新账户，并将跟踪数据聚合到\
  \ LogArchive 账户中的中央 S3 存储桶。它还将日志推送到管理账户中的 CloudWatch 日志组。这为中央安全团队提供了审计和调查的可能性，而无需访问\
  \ Landing Zone 中的所有账户。\n\nControl Tower 开箱即用地提供了所有这些功能，安装大约需要 1 小时。你可能已经注意到，该服务并不涵盖任何应用程序或组织特定的部署需求。到目前为止，它是一种基于良好实践的规定性设置，会在账户创建后立即推出。要推出其他\
  \ AWS 服务和资源，你需要一个部署解决方案或框架来填补缺口，以构建完整的 Landing Zone 平台。\n\n接下来，我们来看看 CfCT。这是一个 AWS\
  \ 支持的解决方案，可与 AWS Control Tower 服务集成，以推出由 AWS CloudFormation 模板定义的自定义资源。假设你需要为安全扫描第三方平台准备一个特定的\
  \ IAM 角色，并且该角色应在所有 AWS 账户预置后自动部署到其中。CfCT 可以帮助实现这一点。或者，你可能希望将某些 Config 规则部署到生产 OU\
  \ 中的所有 AWS 账户，而不是其他账户。\n\n## 使用 CfCT 部署资源\n\nCfCT 是一个与你的 Control Tower 服务部署集成的部署框架。它需要安装在管理账户中，且必须位于最初设置\
  \ Control Tower 的同一区域。它会挂接到服务事件上，并运行一个工作流，在组织内的目标账户中预置 SCP 策略或 AWS CloudFormation\
  \ 资源。\n\n该框架用于部署两类资源：SCP 策略和 CloudFormation StackSets。每类资源都有专门的部署工作流，通过 AWS Step\
  \ Functions 实现。用户与框架的交互通过一个具有定义良好的 YAML 格式的清单文件进行。每当文件提交到版本控制时，框架都会获取变更并执行管道。\n\n\
  我们可以查看**图 11.4** 来了解部署框架中涉及的不同组件：\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_276_0.png)\n\
  \n图 11.4 – CfCT 框架的组件（来源：https://docs.aws.amazon.com）\n\n整个解决方案可以作为 CloudFormation\
  \ 模板部署在你的 AWS 管理账户中。如你所见，CodePipeline 管道会从版本控制（S3 或 CodeCommit）拉取最新更改，并触发一个 CodeBuild\
  \ 项目来初步验证清单文件。如果一切正常，框架会继续调用 SCP Step Functions 状态机和 CloudFormation Step Functions\
  \ 状态机。如果你之前没有接触过 AWS Step Functions 服务，它是一个工作流编排器，可以帮助你构建可编程的流程，调用各种 AWS 服务来完成工作。让我们看一下该框架用于在\
  \ Landing Zone 中部署资源的清单文件示例：\n\n```yaml\n---\nregion: us-east-1  # Control Tower\
  \ Home Region\nversion: 2021-03-15\nresources:\n  - name: test-preventive-guardrails\n\
  \    description: Prevent deleting or disabling resources\n    resource_file: s3://marketplace-sa-resources-ct-us-east-1/ctlabs/preventive-guardrails.json\n\
  \    deploy_method: scp\n    deployment_targets:\n      organizational_units:\n\
  \        - Security\n        - Sandbox\n...\n- name: create-iam-role\n  resource_file:\
  \ s3://marketplace-sa-resources-ct-us-east-1/ctlabs/describe-regions-iam-role.template\n\
  \  deploy_method: stack_set\n  deployment_targets:\n    organizational_units:\n\
  \      - Security\n      - Sandbox\n    regions:\n      - us-east-1\n```\n\n清单文件通过\
  \ YAML 结构中的键回答了三个问题：\n\n- `resource_file`：需要部署的代码在哪里？\n- `deploy_method`：需要部署什么？该键有两个可能的值——`scp`\
  \ 或 `stack_set`。\n- `deployment_targets`：资源应部署到哪里？在这里，你可以使用单个账户或代表一组账户的 OU。\n\n\
  一旦此文件提交到解决方案所跟踪的 Git 仓库，管道就会触发，从而将 SCP 和 CloudFormation 模板部署到目标位置——在本例中，即安全 OU 和沙箱\
  \ OU。\n\n使用 AWS 提供的解决方案的一个好处是，如有需要，你可以获得 AWS Support 的保障。这与你可能开发的其他自定义实现不同。\n\n\
  ## 总结\n\n在本章开头，我们确定了多账户结构的必要性，以及它在 AWS 中托管多个工作负载时提供的好处。多种服务、解决方案和部署框架满足了特定需求，但重要的是要明白，它们本身并不能单独帮助你。组织要实现其特定需求，总是需要一定程度的定制。在明确了需求和好处之后，我们接着讨论了在设计\
  \ Landing Zone 概念时应该考虑的关键事项。我们还研究了多账户结构、安全与 IAM、DevOps 与 Config 管理以及运维方面的一些最佳实践。\n\
  \n在本章的后半部分，我们更深入地了解了 AWS Control Tower 的内部工作原理，以及它与 CfCT 解决方案的开箱即用集成。客户从这些解决方案中获得的关键好处之一是它们由\
  \ AWS 提供支持，就像 AWS 支持任何其他服务一样。\n\n在下一章 *遵循 AWS Well-Architected 原则* 中，我们将探讨一个坚实基础的关键支柱，你可以为自己的应用程序工作负载考虑这些支柱。\n\
  \n\n\n\n## 进一步阅读\n\n要了解本章涵盖的主题的更多信息，请查看以下资源：\n\n- AWS 部署框架 (ADF)： https://github.com/awslabs/aws-deployment-framework\n\
