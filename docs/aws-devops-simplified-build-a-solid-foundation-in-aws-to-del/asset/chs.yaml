  \ 7.4 所示：\n\n## 待办事项管理器 (AWS DevOps Simplified)\n\n图 7.4 – 运行在 ECS 上的待办事项管理器应用\n\
  \n该应用为你提供了一个蓝图，你可以根据自己的偏好以及对任何待办事项管理器应用的功能需求，轻松地对其进行扩展和定制。\n\n## 总结\n\n在本章开始时，我们了解了容器在现代软件应用中的重要性。容器不仅加快了开发速度，还遵循了微服务模式和十二要素设计原则，这些是软件工件中固有的一部分。如果你还没有接触过容器，我们先从它们的基本工作原理入手，然后进一步介绍了容器运行时环境\
  \ Docker 的构成。\n\n在打好基础之后，我们讨论了在云端运行生产工作负载时对容器编排系统的需求。AWS ECS 是 AWS 提供的一种有主见的（opinionated）服务，它简化了在企业级环境中运行容器的操作。接下来，我们更深入地探讨了\
  \ Amazon ECS 及其用于定义应用堆栈中逻辑组件的原生结构。当然，在云端部署资源时安全性至关重要。因此，我们讨论了一些最佳实践，以确保你的容器应用采用最小权限访问模式，并与其他\
  \ AWS 服务集成。为了让你获得关于 ECS 所讨论内容的实际动手经验，我们从零开始部署了一个待办事项管理器应用。基于前几章学到的知识，我们使用 CDK 来管理所需的基础设施组件。\n"
- "## 实现工作负载的可观测性\n\n随着软件应用日益复杂，我们需要在非常细致的层面上获得洞察，这在以前并不常见。将单体应用拆分为一组微服务带来了公认的好处，但为了同样甚至在某些情况下更好地了解系统在底层的运行状况，我们确实需要做更多工作。\n\
  \n当应用出现问题时，会影响用户体验，并最终影响业务。如果此类情况频繁发生，甚至可能因为软件系统不可靠而导致客户信任的丧失。因此，尽早发现问题，并理解问题发生的原因以及如何修复，是非常重要的。\n\
  \n**监控**处理的是*被动*部分，而**可观测性**处理的是*主动*部分。通过监控，你已经能够很好地了解哪些因素会对软件可用性产生负面影响——例如，一个即将写满的存储磁盘。另一方面，可观测性主要关注的是预见可能发生的问题，并在问题发生时简化根因分析。对于同一个存储磁盘，可观测性解决方案可以分析磁盘使用日志，并将其与软件发布周期中的延迟增加或错误相关联，例如。管理员可以利用这些发现来优化存储配置，避免最终导致宕机。在理想情况下，可能对客户产生影响的软件模式应该在指标告警触发之前，甚至早于客户开始体验服务降级之前就暴露出来。这应该是所有管理工作负载的团队的*北极星*，尤其是在大规模场景下。\n\
  \n\n\n\n在我的职业生涯中与多个软件团队合作时，我注意到一个常见的现象：可观测性和监控总是仅被视为技术指标的范畴。有时，软件专业人员与理解自己的代码对业务产生的影响以及最终用户如何消费他们每天开发的应用有些脱节。从我的角度来看，可观测性完全是关于*设身处地为客户着想*，感受他们所感受的，看到他们所看到的，并衡量对他们最重要的数据。只有这样，我们才能在他们每次使用我们的应用时不断改善体验。当然，这在某种程度上取决于底层技术指标，但方法始终应该是从驱动客户体验的业务目标倒推，然后推导出影响这些目标的相关指标。构建一个与业务需求脱节的技术策略将导致无效的解决方案。\n\
  \n以电子商务平台为例，客户最不关心的是后端服务器上不断上升的 CPU 和内存使用率。然而，如果他们无法在合理的时间内完成订单，他们就会对此感到不满。因此，关注*订单完成时间*作为指标并从那里倒推，弄清楚\
  \ CPU 利用率的增加是否导致了该问题，可能很有价值。\n\n在本章中，我们将涵盖以下主题，以了解有关启用在 AWS 中运行的工作负载的可观测性的一些知识：\n\
  \n- 什么是可观测性？\n- 用于监控和可观测性的关键 AWS 服务\n- 构建稳健可观测性策略的最佳实践\n- 如何为托管在 AWS 中的工作负载定义您的可观测性策略\n\
  - 为托管在 ECS 上的测试应用部署一个基础可观测性栈\n\n让我们从理解可观测性的核心思想开始。\n\n## 什么是可观测性？\n\n简单来说，它就是关于理解正在运行的系统当前所处的状态，从它所做的工作和它所发出的数据来看。制定一个稳健的可观测性策略不是一次性的工作，并且随着业务需求的演变，它总是有优化的空间。但是，在你甚至能理解发生了什么之前，确保系统至少发出一些数据供我们推导出一些结论是很重要的。但是什么样的数据呢？\n\
  \n可观测性有三个基础支柱，使你能够将数据转化为信息，并从这些信息中得出见解，最终导致需要采取的行动：\n\n- **日志：** 这些是*离散事件*，在为客户请求提供服务时发生在系统的各个组件中。将这些日志存储在集中式数据存储中以便在需要时安全地提取和分析信息，是非常宝贵的。\n\
  \n日志在某些组件因未处理的异常而停止向事件存储推送指标的情况下特别有帮助。这可能是由第三方依赖项、网络问题或其他不可预见的情况引起的。日志是系统中发生的事件的最终真实来源。因此，在创建后防止任何修改，强制执行适当的安全防护措施非常重要。在\
  \ AWS 中，使用诸如 **Amazon Key Management Service (KMS)** 之类的服务在静态时加密这些日志是一个很好的做法。\n\n\
  - **指标：** 这些是*原始数据点*，反映了系统随时间推移的性能，在告警、趋势分析和场景预测中特别有用。对于本地部署，组织通常利用第三方工具和 **应用性能监控\
  \ (APM)** 解决方案来收集底层基础设施和应用指标。然而，在 AWS 中，大多数服务会自动发布关键指标，而无需任何额外配置或用户成本。这些信息可免费使用，可用于定义阈值违规告警或数学分析——例如，磁盘在任何\
  \ 5 分钟间隔内的最大 IOPS。\n\n- **追踪：** 在使用多个微服务时，通常需要一个整体视图来理解请求流并识别瓶颈。这使软件团队能够深入了解信息*如何在特定请求的多个系统间传递*，并确定是否出现了异常。这些追踪也是服务图的宝贵输入，因为它们可用于直观地描绘每个服务所拥有的依赖关系和一些问题区域。\n\
  \nAWS 用于所有可观测性需求的瑞士军刀解决方案是 **Amazon CloudWatch**。CloudWatch 可用于各种客户需求，以持续监控应用程序和底层基础设施。\n\
  \n在了解了可观测性的三个主要支柱后，让我们看看它们有助于实现的主要优势。\n\n## 可观测性的优势\n\n当团队使系统可观测时，他们会获得多重益处：\n\n\
  - **增强的客户体验：** 毫无疑问，你对系统行为的理解越好，就越容易最大化客户从软件应用中获得的收益。产品经理可以利用这些数据来了解特定软件应用的使用方式，并为新功能和增强功能制定未来策略，从而取悦客户。\n\
  \n- **高效的故障排除：** 良好的可观测性策略可减少围绕运营问题和中断的调查时间。这使团队有更多时间构建差异化功能，而不是被拉入长时间的调查中。\n\n\
  - **可见性：** 可观测性不仅仅是灭火式的运营问题，有时你会想问自己一些问题，以便更好地了解软件应用的消费模式。*我的大多数用户来自哪里？他们通常花多少时间填写特定表单？用户在我的网站上订购商品需要多少次点击？有多少用户向我的\
  \ API 传递了错误的参数，等等？*\n\n在建立了对可观测性是什么以及为什么重要的基础理解后，让我们讨论一下 AWS 在这一领域的服务。\n\n## 用于监控和可观测性的关键\
  \ AWS 服务\n\nAWS 提供各种原生服务，使客户能够为其应用工作负载实施端到端的可观测性解决方案。三个可观测性支柱都得到了很好的覆盖。CloudWatch\
  \ 是 AWS 的主要可观测性平台，它是一套不同的解决方案，解决客户在日志和指标收集方面的需求。对于 **追踪**，AWS 提供 **X-Ray** 服务，这使得追踪应用中的单个请求或工作流变得非常容易。\n\
  \n有趣的是，可观测性领域还有很多客户一直在与开源解决方案合作，并希望在云中扩展其现有实现。AWS 为 **Prometheus** 和 **Grafana**\
  \ 提供托管解决方案，我们将在本章后面的动手练习中详细介绍。此外，AWS 在 **Cloud Native Computing Foundation’s (CNCF’s)\
  \ OpenTelemetry** 项目中也非常活跃，该项目也简称为 OTel。它是管理遥测数据的厂商中立框架。OpenTelemetry 引入了*发行版*的概念，它是特定\
  \ OpenTelemetry 组件的定制版本。AWS **Distro for OpenTelemetry (ADOT)** 是基于 OpenTelemetry\
  \ 项目的 AWS 发行版。它提供开箱即用的功能，可一次性对应用进行检测，并将指标和数据发送到多个 AWS 服务，包括 Amazon CloudWatch、X-Ray\
  \ 和 Amazon Managed Service for Prometheus。\n\n在深入了解良好的可观测性策略的最佳实践之前，让我们了解 AWS 可观测性平台——Amazon\
  \ CloudWatch 的各个组件。\n\n## Amazon CloudWatch\n\nCloudWatch 是一个集中式平台，允许客户收集、监控和可视化其应用日志、指标和\
  \ X-Ray 追踪，所有内容都在单个仪表板中。它在为客户管理的全部工作负载提供统一的运营健康视图方面非常宝贵。\n\nCloudWatch 提供的功能主要有三个方面。\n\
  \n### 基础设施监控\n\n基础设施监控涵盖指标、告警和相关见解的基础方面。\n\n\n\n\n\n## CloudWatch 指标\n\n大多数 AWS\
  \ 服务默认会发出免费指标，这些指标可用于了解系统性能，并支持搜索和可视化功能。客户既可以使用指标的基本监控（免费），也可以使用详细版本（付费），后者仅由部分服务提供。根据这些指标的时间粒度，用户可以用它们来了解系统某些部分的工作趋势和模式。用户还可以利用\
  \ CloudWatch Metrics Insights，这是一个 SQL 查询引擎，可对指标进行实时分析。\n\n## CloudWatch 告警\n\n\
  可以配置 CloudWatch 告警来监控某个特定指标或涵盖多个指标的数学表达式结果。例如，如果某个 AWS 服务分别发出读 IOPS 和写 IOPS，你可以使用指标加法得出总\
  \ IOPS，并在总 IOPS 阈值被突破时配置告警。\n\n例如，告警可以配置为发送 Amazon Simple Notification Service（SNS）通知，并将启动/停止\
  \ EC2 实例作为目标操作。\n\n## 应用程序监控\n\n借助应用程序监控，CloudWatch 可以更深入地了解应用程序的内部工作方式。此类别提供了多项服务。\n\
  \n### 合成监控\n\nCloudWatch 允许你从世界多个位置模拟最终用户与应用程序的交互——就像真实用户使用你的应用程序一样。\n\n### Service\
  \ Lens\n\nService Lens 将来自链路追踪、指标、日志和告警的所有数据汇总到单个仪表盘上。这不仅为用户提供了服务图谱的统一视图（其中突出显示了应用程序工作流中涉及的不同组件），还将瓶颈以及每分钟请求数、平均响应时间等重要数据指标呈现出来。这种可见性使你可以轻松地在海量数据中找到问题所在，并可以基于此分析回溯，以揭示潜在问题。\n\
  \n### CloudWatch 真实用户监控\n\nCloudWatch 真实用户监控（RUM）可以提供真实用户洞察，让你了解最终用户的真实体验。它是一个 JavaScript\
  \ 代码片段，你可以将其添加到应用程序中，并立即开始测量关键指标。RUM 代理捕获并注入到网页中的数据可以提取页面加载时间和客户端错误等信息，此外还可用于许多其他场景。\n\
  \n## 洞察与运维可见性\n\n在提供现成解决方案方面，这一类别具有巨大的差异化优势——这类解决方案从多个来源提取数据，从中获取洞察，并为用户提供可操作的后续步骤。\n\
  \n### 容器洞察\n\n在容器领域使用 AWS 服务时，你可以使用 **CloudWatch 容器洞察**来汇总容器化应用程序的指标和日志。它可以针对持续容器重启等问题提供深入洞察。\n\
  \n### Lambda 洞察\n\n在 **AWS Lambda** 上运行无服务器工作负载时，Lambda 洞察可以深入了解 Lambda 调用中的系统级指标和事件。对于支持的运行时，你可以添加一个扩展，该扩展会开始收集有用数据，并帮助用户识别冷启动等问题。\n\
  \n> **你知道吗？**\n> 在撰写本文时，Amazon CloudWatch 每月监控超过 9000 万亿次指标观测，并摄取超过 5 EB（艾字节）的日志。与全球\
  \ 80 多亿人口相比，这意味着该服务平均每月为地球上的每个人处理约 100 万次事件。这就是 CloudWatch 的运行规模。\n\n用户可以通过利用 CloudWatch\
  \ 可观测性平台中的合适解决方案做非常多的事情。不过，接下来我想讨论一些最佳实践，以便你在使用这些工具时能最大化收益。\n\n## 构建可靠可观测性策略的最佳实践\n\
  \n在本节中，我们将介绍一些基本原理，说明如何最好地呈现可观测性数据，同时保持你需要处理的信息量的适当平衡。\n\n### 构建仪表盘层级结构\n\n可观测性策略成功的一个关键衡量指标是**平均恢复时间（MTTR）**。它定义了处理运维问题的工程师能够多快理解并从潜在问题中恢复。首先，提供恰当详细程度的仪表盘非常重要。减少无关噪音对于降低整体\
  \ MTTR 至关重要。软件团队常遇到的一个问题是创建数据量庞大的仪表盘，将所有应用程序的许多不同方面都放在一个屏幕上。这通常会导致漏报，从而消耗大量排查时间。\n\
  \n如本章开头所述，你必须以客户为中心，做到感同身受，并在此基础上构建可观测性策略。为了直观感受最终用户的体验，你可以构建一个仪表盘层级结构，从顶层全局视图开始，并在深入每个组件时提供指向其他子仪表盘的链接。每个子仪表盘都针对应用程序的特定设计领域。例如，让我们考虑一个由多个微服务实现的典型\
  \ Web 应用程序架构。在从一个提供重要 API 延迟、服务图谱健康状态和分布式链路追踪数据的高级仪表盘开始后，你可以将调查范围缩小到提供前端、应用程序或数据层更多细节的特定仪表盘。这样你就可以只关注足够的信息，并一步步深入调查。此外，你还可以实现一个全局仪表盘，突出显示所有组件和相应资源的容量问题。图\
  \ 8.1 突出显示了这些仪表盘可以关注的架构特定区域：\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_195_0.png)\n\
  \n图 8.1 – 构建正确的仪表盘层级结构以降低 MTTR\n\n还有很多实践可以进一步简化或增强仪表盘所呈现的数据。让我们来看看其中的一些。\n\n###\
  \ 采用时间序列模式分析\n\n对于某些指标，观察时间序列模式比观察标量值更相关。当你的运维团队注意到 API 错误数每 10 分钟出现一次尖峰，但从未超过你设置的告警阈值时，这可以增强主动分析能力。\n\
  \n你还可以在同一图表上绘制相关的时间序列数据，以相对了解某些参数如何随时间演变，以及是否存在需要深入研究的关联。\n\n### 在图表上标注良好和不良阈值\n\
  \n不同的应用程序对良好或不良状态的阈值可能不同。对于计算密集型批处理工作负载，CPU 利用率持续报告为 80% 可能是可以的，但对于另一种类型的应用程序，这可能不符合预期的利用率范围。此外，团队在不断变化，可能会有新成员加入，也可能会有一些人在某个时候离开。当这些阈值范围与底层指标一起绘制时，你可以轻松识别异常值和不符合预期的部分。\n\
  \n### 绘制正确的维度\n\nCloudWatch 指标基于维度概念工作。普通指标只是数据，但当我们添加一定数量的相关维度时，它们就转变为信息。如何利用这些维度对于在运维仪表盘上呈现最相关的信息起着重要作用。\n\
  \n例如，一个维度可以是在定义的时间窗口内发生的 API 错误总数。但这也可能意味着某个客户持续使用错误的负载调用某个 API 端点。当然，你不会希望因为这种情况被寻呼，因此更好的维度可以是按客户统计的\
  \ API 错误数。这有助于排除误报，从而节省宝贵的排查时间。\n\n### 在所有系统中使用一致的时区\n\n几乎每次故障排查都始于事件发生时间。这随后成为在其他仪表盘、系统和日志中搜索相关信息的关键。作为经验法则，始终选择\
  \ UTC 作为参考，这样你就是在相同的时间标准下比较数据和调查结果。当你在同一个仪表盘上绘制不同指标，并写入带有时间戳的日志（这些日志之后会推送到集中式日志平台）时，这一点尤其有用。\n\
  \n### 传播链路追踪标识符\n\n采用分布式架构可能意味着单个请求在向用户返回任何响应之前，需要流经多个系统或微服务。调试此类请求时，在\n\n\n\n缺乏相关上下文可能会很痛苦。因此，在负载通过多个组件传递时附加一个唯一的请求标识符是一个好主意。每个微服务的相应日志随后可以利用相同的跟踪标识符，以及附加的元数据，例如处理请求所花费的时间。\n\
  \n这在很大程度上简化了调试活动，因为你可以过滤特定的请求标识符，并立即了解特定请求如何在系统中遍历。这在图 8.2 中有所强调：\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_197_0.png)\n\
  \n图 8.2 – 在每个请求中注入跟踪标识符\n\n除了跟踪标识符传播请求元数据之外，还很重要的一点是系统的所有组件都要让用户了解其健康状况。\n\n## 确保系统的所有组件都发出事件\n\
  \n无论是日志、指标还是跟踪，在理想情况下，系统中不应存在像黑盒一样运行的组件。每个服务，无论是托管还是非托管，都应在你的中央可观测性平台中记录事件。这也是从云提供商中选择特定服务时的重要标准。验证开箱即用的日志类型、提供的指标、这些事件如何聚合到你选择的工具中等等总是很有帮助的。\n\
  \n需要注意的是，通常有些组件确实是黑盒，因为它们是从其他团队继承的，代码不再可用，或者某种技术债务不允许你在代码级别添加检测。在这种情况下，你可以探索 sidecar\
  \ 模式，其中最低限度的检测来自另一个软件或工具。这些工具与此类组件一起部署，并且可以在不造成任何性能问题的情况下跟踪对底层内核或其他库的调用。\n\n接下来，我们将深入研究测试应用程序。这将帮助我们亲身体验来自\
  \ AWS 和开源社区的一些服务。\n\n## 为托管在 AWS 上的工作负载定义你的可观测性策略\n\n永远不存在一种完美的可观测性策略，可以在规模上为你提供系统最细粒度的视图。相反，这是一段不断发展的旅程，随着你发布新功能和软件应用程序的更新而不断演进。你继续通过确保可观测性堆栈在任何时候都能突出显示对关键业务目标的遵守情况来调整可观测性堆栈。为了在\
  \ AWS 上启动你的可观测性之旅，你可以考虑以下方面。\n\n## 为托管在 ECS 上的测试应用程序部署可观测性堆栈\n\n在第 7 章《在 AWS 中运行容器》中，我们看到了在\
  \ AWS 上运行容器化工作负载是多么容易。我们使用 Python Flask 框架开发了一个待办事项列表管理器应用程序，并将其部署在 Amazon ECS 上，基础设施组件使用\
  \ CDK 推出。通过利用 ECS 的 Fargate 部署模型，我们能够将底层容器节点的管理 offload 给 AWS，同时我们专注于应用程序逻辑及其周围的安全防护。以相同的示例为基础，我们将学习如何为此类应用程序添加可观测性构建。作为最佳实践，这是在你编写代码的前几行时就应该开始关注的事情。你将在哪里处理日志，你将如何可视化指标，你应该为哪些关键阈值设置警报等等？\n\
  \n本书的这一部分将特别关注动手实现，以帮助你体验我们在本章中讨论的可观测性的关键领域。我们将学习如何将日志转发到 CloudWatch，在 Prometheus\
  \ 中处理指标，最后在 Grafana 仪表板上可视化所有内容。我们将扩展上一章《在 AWS 中运行容器》中的代码库，并将其与将应用程序可观测性提升到下一个水平的其他工具集成。让我们先从我们计划实施的更改概述开始。\n\
  \n## 目标架构概述\n\n在深入代码级更改之前，让我们对我们计划在测试应用程序堆栈周围添加的组件以及它们如何相互通信有一个视觉上的理解。我们将重点关注帮助我们在我们选择的工具上监控应用程序日志和指标的能力。\n\
  \n我们将通过以下组件扩展现有应用程序架构来捕获和显示可观测性数据：\n\n- **CloudWatch Logs**：Amazon ECS 提供与多个日志平台的集成，CloudWatch\
  \ 是其中之一。我们可以使用 CloudWatch Logs 摄取在 ECS 中运行的应用程序容器 STDOUT 上写入的所有数据。\n- **Amazon Managed\
  \ Prometheus**：Prometheus 安装的最大挑战是数据保留以及随着指标摄取速率增加而动态扩展存储基础设施。类似于其他 AWS 服务提供的优势，我们希望将\
  \ Prometheus 服务器及其相关存储的维护 offload 给云提供商。AWS 只为我们提供一个数据摄取端点，可由应用程序用于将指标数据推送到平台。\n\
  - **Amazon Managed Grafana**：为了可视化 Prometheus 捕获的指标，我们将使用 Grafana 作为我们的仪表板解决方案。AWS\
  \ 为我们提供了与运行 Grafana 开源解决方案相同的体验。额外的好处是围绕 AWS 数据源的现成集成以及使用 AWS 提供的服务时开箱即用的配置。\n-\
  \ **OpenTelemetry Collector**：在容器化环境中使用第三方工具的常见部署模式是将其作为 sidecar 部署。在我们的例子中，我们将在托管\
  \ Web 应用程序和 MongoDB 容器的同一 ECS 任务定义中部署来自 AWS 的 OpenTelemetry collector。这将允许 collector\
  \ 代理从应用程序容器上的 `/metrics` 端点抓取指标信息。\n\n所有这些组件和相应的信息流在图 8.3 中突出显示。在这种情况下，基于 Flask\
  \ 的 Web 应用程序将日志转发到 CloudWatch Logs 服务。应用程序指标由 OpenTelemetry sidecar 容器抓取，然后转发到 Amazon\
  \ Managed Prometheus (AMP) 服务。最后，我们配置 Amazon Managed Grafana 从这两个源查询数据并在集中式仪表板中显示：\n\
  \n![](img/ecd265dfca9bb64161408ba8a944a4d9_200_0.png)\n\n图 8.3 – 待办事项列表管理器测试应用程序的可观测性堆栈\n\
  \n## 注意\n\n如果你过去接触过 Prometheus 工具，你通常会体验到一种基于拉取的方法，其中 Prometheus 服务器直接从相关目标获取指标并存储它们。在这种情况下，我们使用的是来自\
  \ AWS 的 OTEL collector sidecar 模式，它在抓取应用程序端点后将指标推送到 Amazon Managed Prometheus 工作区。\n\
  \n作为下一步，让我们用一些代码级修改来动手实现我们刚刚讨论的架构。\n\n## 扩展代码库以获得更好的可观测性\n\n正如你所想象的，除了向我们的堆栈添加 CDK\
  \ 构造之外，我们还需要对基于 Flask 的 Web 应用程序进行一些更改，以便它开始向 Prometheus 等工具提供指标和见解。让我们先从应用程序级更改开始。\n\
  \n## 修改 Flask 应用程序代码\n\n我们需要两个主要更改。首先，我们必须向代码库添加日志记录功能，其次，我们必须允许代码发布 Prometheus\
  \ 指标，以便稍后部署的 OpenTelemetry collector 可以使用。\n\n就像其他可重用的 Python 模块一样，Prometheus 为常用的应用程序框架提供了各种即用型集成。Flask\
  \ 也不例外。两个与我们的用例相关的库是 prometheus-client 和 prometheus-flask-exporter。通过简单地将这些库导入我们的代码，就非常简单地公开\
  \ Prometheus 指标，正如我们很快会看到的那样。对于日志记录需求，我们将使用标准 logging 库。\n\n## 在应用程序中启用 Prometheus\
  \ 指标\n\nFlask 应用程序代码位于 app.py 文件中。完整文件可在 https://github.com/PacktPublishing/AWS-DevOps-Simplified/blob/main/chapter-8/chapter-8-flask-app/app.py\
  \ 供你参考。创建 PrometheusMetrics 类的实例后不久，它在幕后挂钩到 Flask 框架，从而直接捕获所有相关指标。每当收到 GET 或 POST\
  \ 请求时，Prometheus 就会知道。这避免了开发人员方面的任何额外工作，除非他们想根据应用程序的业务用例定义和导出额外的自定义指标：\n\n```\n\
  ...\nfrom prometheus_flask_exporter import PrometheusMetrics\n...\napp = Flask(__name__)\n\
  metrics = PrometheusMetrics(app)\n...\n```\n\n为了将这些模块包含在我们的构建工作流中，我们还应该将它们添加到 requirements.txt\
  \ 文件中，以便在创建 Docker 镜像时被拾取。作为最佳实践，我们应该使用确切的版本标识符锁定它们：\n\n```\n...\n...\nWerkzeug==2.2.3\n\
  zipp==3.14.0\nprometheus-client==0.16.0\nprometheus-flask-exporter==0.22.3\n```\n\
  \n在此阶段部署应用程序将自动启用 `/metrics` 端点，该端点导出从 Flask 应用程序提取的 Prometheus 指标。\n\n\n\n\n##\
  \ 在应用程序中记录重要事件\n\n我们将使用 Python 标准日志库为应用程序中发生的相关事件添加日志。在使用之前，我们需要实例化一个带有默认配置的对象，这些配置适用于以下日志语句：\n\
  \n```\n...\nimport logging\nimport sys\n...\nroot = logging.getLogger()\nroot.setLevel(logging.DEBUG)\n\
  handler = logging.StreamHandler(sys.stdout)\nhandler.setLevel(logging.DEBUG)\nformatter\
  \ = logging.Formatter('%(asctime)s - %(name)s - %(levelname)s - %(message)s')\n\
  handler.setFormatter(formatter)\nroot.addHandler(handler)\n...\n```\n\n下一步是在我们的\
  \ Flask 装饰器函数中使用 logging 模块，该函数接收任务创建或检索请求：\n\n```\n@app.route(\"/\", methods =\
  \ ('GET', 'POST'))\ndef todos():\n    if (request.method == \"POST\"):\n       \
  \ logging.info('Received a %s request for %s ', request.method, request.url)\n \
  \       todo_item = request.form[\"todo\"]\n        todo_type = request.form[\"\
  tasktype\"]\n        try:\n            logging.info('Submitting \\'%s\\' task: \\\
  '%s\\' to persistent storage ',request.form[\"tasktype\"], request.form[\"todo\"\
  ])\n            todos_collection.insert_one({\"todo\": todo_item, \"tasktype\":\
  \ todo_type})\n            return redirect(url_for('todos'))\n        except Exception\
  \ as e:\n            logging.error(\"Exception occurred while submitting data to\
  \ MongoDB\", exc_info=True)\n    all_todos = todos_collection.find()\n    return\
  \ render_template('index.html', all_todos = all_todos)\n```\n\nCloudFormation 资源只是为我们创建了一个\
  \ Prometheus 工作区，但我们仍然需要某种机制将相关指标发布到该工作区中。下面我们来介绍这一点。\n\n## 在 ECS 任务定义中注入 Sidecar\
  \ OpenTelemetry 容器\n\n在创建好 Prometheus 之后，我们现在可以在承载 Flask 应用程序和 MongoDB 数据库容器的同一个\
  \ ECS 任务定义中添加一个 sidecar 容器。这将使 OTEL 收集器能够从我们的应用程序中抓取指标，并将它们推送到上一节中创建的托管 Prometheus\
  \ 工作区：\n\n```\nconst otelCollector = new ecs.ContainerDefinition(this,\n\"OtelCollectorDefn\"\
  , {\n  image: ecs.ContainerImage.fromRegistry(\"public.ecr.aws/aws-observability/aws-otel-collector:v0.26.1\"\
  ),\n  taskDefinition: fargateTaskDefn,\n  command: [\"--config=/etc/ecs/ecs-amp-prometheus.yaml\"\
  ],\n  logging: ecs.LogDrivers.awsLogs({streamPrefix: \"aws-devops-simplified-otel-collector\"\
  }),\n  environment: {\n    \"AWS_PROMETHEUS_ENDPOINT\": `${apsWorkspace.attrPrometheusEndpoint}api/v1/remote_write`,\n\
  \    \"AWS_PROMETHEUS_SCRAPING_ENDPOINT\": \"0.0.0.0:5000\"\n  }\n})\n```\n\n正如你所看到的，我们在\
  \ apsWorkspace CDK 资源中引用了工作区端点，并将其作为 AWS_PROMETHEUS_ENDPOINT 环境变量的值进一步传递到 OTEL 容器中。这样，OTEL\
  \ 收集器就知道将采集到的指标推送到哪里。其次，我们定义了 AWS_PROMETHEUS_SCRAPING_ENDPOINT，它告诉收集器从哪里抓取指标。所有这些配置都由我们为\
  \ OTEL 收集器使用的配置文件类型所决定。AWS OTEL 收集器支持多种平台，既可以从中消费数据，也可以向其中发送数据。在我们的案例中，我们主要关注 Prometheus\
  \ 指标，因此我们使用了 OTEL Docker 容器中的 /etc/ecs/ecs-amp-prometheus.yaml 文件。\n\n> **注意**\n\
  > 如果你想探索该文件的内容及其提供的所有配置选项，可以访问以下链接：https://github.com/aws-observability/aws-otel-collector/blob/main/config/ecs/ecs-amp-prometheus.yaml。\n\
  \n在完成应用程序和基础设施所需的所有代码更改后，我们现在可以进入最激动人心的部分——在我们的 AWS 账户中部署解决方案。\n\n## 在 AWS 账户中部署堆栈\n\
  \n此时，我们可以在 AWS 账户中部署我们的 CDK 堆栈。除了 VPC、子网和网关等核心基础设施元素外，它还将预置 ECS 集群，其中包含三个容器——应用程序、数据库和\
  \ OpenTelemetry 收集器。我们还将为 Amazon 托管的 Prometheus 部署一个独立的工作区。最后，我们将手动部署 Grafana，因为在撰写本文时，它还不支持通过\
  \ CDK 进行部署。\n\n## 部署 CDK 堆栈\n\n首先，让我们为 Cloud9 IDE 启动一个新会话，并切换到包含本章资源的目录。\n\n进入本章的\
  \ CDK 项目文件夹后，我们可以使用 npm install 命令下载所有 node 模块。安装完成后，我们可以触发 cdk synth，以大致了解将要部署到\
  \ AWS 账户中的 CloudFormation 模板：\n\n```\naws-devops-simplified:~/environment/chapter-8/chapter-8-cdk\
  \ $ cdk synth\nResources:\n  CustomVPC616E3387:\n    Type: AWS::EC2::VPC\n    Properties:\n\
  \      CidrBlock: 10.0.0.0/16\n      EnableDnsHostnames: true\n      EnableDnsSupport:\
  \ true\n      InstanceTenancy: default\n      Tags:\n        - Key: Name\n     \
  \     Value: Chapter8CdkStack/CustomVPC\n    Metadata:\n...\n...\n```\n\n快速查看模板并了解正在预置的资源后，你就可以进行最终的堆栈部署了：\n\
  \n```\naws-devops-simplified:~/environment/chapter-8/chapter-8-cdk $ cdk deploy\n\
  ✨  Synthesis time: 11.93s\nChapter8CdkStack: building assets...\n...\n...\n```\n\
  \n```\nDo you wish to deploy these changes (y/n)? y\n...\nChapter8CdkStack: creating\
  \ CloudFormation changeset...\n...\n...\n✅  Chapter8CdkStack\n    Deployment time:\
  \ 245.97s\n\nOutputs:\nChapter8CdkStack.FargateServiceLoadBalancerDNS9433D5F6 =\
  \ Chapt-Farga-\n65SZA285PP01-1511829492.eu-central-1.elb.amazonaws.com\n✨  Total\
  \ time: 257.9s\n```\n\nCDK 堆栈部署完成后，我们会在屏幕上看到作为输出的负载均衡器 URL。该 URL 可用于在浏览器中访问应用程序。我们将使用同一个\
  \ URL 生成一些负载，以便看到一些指标和数据被推送到可观测性堆栈的不同组件中。但在那之前，让我们先配置 Grafana 仪表盘，使其准备好从 Prometheus\
  \ 消费指标。\n\n## 为 Amazon Managed Grafana 创建工作区\n\nAWS 的官方文档概述了使用 Web 控制台在账户中设置个人 Grafana\
  \ 工作区所需执行的所有步骤。为了确保你遵循最新的说明，我建议你查看官方链接 https://docs.aws.amazon.com/grafana/latest/userguide/AMG-create-workspace.html。请确保你使用的是部署\
  \ CDK 堆栈时所用的同一个 AWS 区域。Grafana 通过 SSO 或 SAML 配置用户访问。如果你对这两个概念都不熟悉，我建议你在账户中设置一个 AWS\
  \ SSO 用户。这是免费的，同时为你提供了一种安全机制，可以从一个中央面板管理对组织中多个 AWS 账户的访问。\n\n对于数据源，我们需要选择 **Amazon\
  \ Managed Service for Prometheus**。\n\n安装完成后，你可以进入 Grafana 工作区的用户管理部分。你可以按照 *图 8.4*\
  \ 中所示的步骤，将你已配置的 SSO/SAML 用户指定为此次 Grafana 安装的管理员：\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_207_0.png)\n\
  \n为新的 Grafana 工作区添加管理员用户后，你可以进入登录页面，输入必要的凭据，并按照 *图 8.5* 所示进行数据源配置。这将使 Grafana 能够从作为\
  \ CDK 部署一部分创建的 Prometheus 工作区查询指标：\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_208_0.png)\n\
  \n图 8.5 – Grafana 登录与数据源配置\n\n此选项会进入数据源配置页面，你可以在其中添加要集成的 Prometheus 工作区的其他详细信息。假设你在同一账户中没有创建任何其他工作区，那么在你选择适当的\
  \ AWS 区域后（在我们的案例中始终是 eu-central-1，即法兰克福），你将会找到由 CDK 堆栈预置的那个工作区。\n\n如果你看到多个工作区，请参考随\
  \ CDK 部署一起创建的那个工作区的标识符。该标识符应该在最近部署的 CloudFormation 堆栈详细信息页面上可以看到。\n\n填写完 Prometheus\
  \ 的所有数据源配置字段后，你应该会看到类似以下内容：\n\n- `scrape_*`：抓取指标反映了通过 OTEL 收集的持续时间和样本，这些收集是我们在 ECS\
  \ 任务定义中选择的配置（/etc/ecs/ecs-amp-prometheus.yaml）的一部分：\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_210_0.png)\n\
  \n图 8.7 – 不同类别指标的 Prometheus 选择器\n\n一旦你按需选择了指标，就需要对 Web 应用施加负载，以便在各个平台和工具中看到相关的遥测数据。\n\
  \n## 对应用进行负载测试以生成数据\n\n对 To-Do List Manager 应用进行负载测试的一个简单方法，是在你的 Cloud9 IDE 终端中运行一条针对应用负载均衡器\
  \ URL 的 curl 查询。\n\n为了生成哈希，我们可以利用 `RANDOM` 变量，通过以下命令从中派生一个 md5 校验和值：\n\n```\necho\
  \ $RANDOM | md5sum | head -c 20\n```\n\n我们可以将哈希生成用于一条 curl 命令中，该命令在应用端点上触发 POST\
  \ 请求：\n\n```\ncurl --location --request POST 'http://chapt-farga-65sza285ppol-1511829492.eu-central-1.elb.amazonaws.com/'\
  \ \\\n  --form \"todo=`echo $RANDOM | md5sum | head -c 20`\" \\\n  --form 'tasktype=\"\
  Un-important\"'\n```\n\n为了使其无限执行（直到手动中断），我们可以用 while 循环包装该命令：\n\n```\nwhile true;\
  \ do curl --location --request POST 'http://chapt-farga-65sza285ppol-1511829492.eu-central-1.elb.amazonaws.com/'\
  \ --form \"todo=`echo $RANDOM | md5sum | head -c 20`\" --form 'tasktype=\"Un-important\"\
  '; done\n```\n\n让这段代码运行一段时间，以便在我们的可观测性工具中生成足够的数据。\n\n## 观察数据以了解应用行为\n\n调试运维事件通常需要关联多个指标的信息，并从底层数据中得出洞察。我们的测试应用栈会在不同工具中发布不同类型的数据。我们在\
  \ CloudWatch 中拥有基础设施指标和日志，此外还会在 Prometheus 中发布指标。让我们查看一下 CloudWatch，看看是否有在 Flask\
  \ 装饰器函数中启用的日志记录所生成的日志。\n\n### 使用 Amazon CloudWatch Logs 监控日志\n\n要检查 CloudWatch Logs，你可以前往\
  \ CloudWatch 服务控制台并点击相关的日志组。这种无缝的日志摄取由 ECS 与 CloudWatch 之间的集成提供。作为最佳实践，你应该始终将日志流输出到\
  \ STDOUT，以便数据能够轻松地被摄取到其他平台。\n\n你可能还记得，我们在每个代表一个 ECS 容器的 CDK 构造中都有日志配置。对于应用容器，配置大致如下：\n\
  \n```\nlogging: ecs.LogDrivers.awsLogs({streamPrefix: \"aws-devops-simplified-app-container\"\
  })\n```\n\n这一行配置会从应用容器摄取数据，并将其转发到 CloudWatch 服务，使用预定义的流前缀。在 CloudWatch 上检查此日志流的日志会显示一些有趣的洞察，如*图\
  \ 8.8* 中突出显示的那样：\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_212_0.png)\n\n图 8.8\
  \ – 在 CloudWatch Logs 中捕获的应用日志\n\n让我们仔细看看：\n\n- 1. `GET /metrics`：来自 OpenTelemetry\
  \ 收集器的 HTTP 调用会按预定义间隔抓取应用指标，并将其发布到 Prometheus 服务器。如我们所见，请求来源是 `127.0.0.1`，这符合预期，因为收集器与应用程序运行在同一个任务定义中。\n\
  - 2. `GET /`：这些是对应用根路径的调用，似乎来自两个 IP 地址：`10.0.3.223` 和 `10.0.2.30`。这些是应用负载均衡器的接口，它们会触发对应用的定期健康检查请求。\n\
  - 3. `POST`：这是对应用域的一个请求，是我们从本地终端触发以产生一些负载的 `curl` 命令的结果。你会看到很多这样的请求，具体取决于你让命令运行了多长时间。\n\
  \nCloudWatch 还允许你根据某些模式从这些日志中创建指标。因此，用户可以跟踪 1 分钟时间窗口内传入的 POST 调用数量，并在其超过预期阈值时发出警报。此外，你还可以跟踪此类请求的源\
  \ IP 地址，找出某个时间段内对应用负载贡献最大的来源。如你所见，可能性无穷无尽，这完全取决于你想从这些洞察中挖掘多深。\n\n接下来，让我们看看我们的 Prometheus\
  \ 指标。\n\n### 使用 Amazon Managed Prometheus 对应用指标进行插桩\n\n如前所述，在我们的 Flask 应用内实例化 Prometheus\
  \ 客户端还会启用一个 `/metrics` 端点，将应用指标暴露给抓取器——在我们的案例中，就是 OTEL 收集器。\n\n你也可以通过访问应用负载均衡器 URL（末尾加上\
  \ `/metrics` 后缀）来查看这些原始指标。\n\n就我而言，访问 `http://chapt-farga-65sza285ppol-1511829492.eu-central-1.elb.amazonaws.com/metrics`\
  \ URL 得到了以下输出：\n\n```\n...\n#### HELP flask_exporter_info Information about the\
  \ Prometheus Flask exporter\n#### TYPE flask_exporter_info gauge\nflask_exporter_info{version=\"\
  0.22.3\"} 1.0\n...\n#### HELP flask_http_request_duration_seconds Flask HTTP request\
  \ duration in seconds\n#### TYPE flask_http_request_duration_seconds histogram\n\
  flask_http_request_duration_seconds_bucket{le=\"0.005\",method=\"GET\",path=\"/\"\
  ,status=\"200\"} 309.0\n...\n```\n\n以 `# HELP` 开头的行描述了后续几行的相关信息以及如何解读它们，而以 `# TYPE`\
  \ 开头的行则显示指标类型（直方图/仪表）和相关值，这些值随后可通过 Grafana 等工具进行可视化。\n\n### 使用 Amazon Grafana 可视化数据\n\
  \n到目前为止，我们已经验证了应用在 `/metrics` 端点上暴露指标数据，OTEL 收集器正在抓取该端点，并将其进一步发布到我们在 CDK 栈中配置的 Prometheus\
  \ 工作区中。我们架构中的最后一个工具是 Grafana。如*图 8.7* 所述，你可以选择某些指标显示在 Grafana 仪表板上。我选择了其中几个后得到了以下截图（*图\
  \ 8.9*），它突出显示了后台运行 `curl` 命令期间持续一段时间的网络请求峰值：\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_214_0.png)\n\
  \n图 8.9 – 在 Amazon Grafana 仪表板上可视化指标\n\n理想情况下，你会根据定义系统行为的关键指标自定义字段选择器，并将其固定到一个可持续监控的仪表板上。\n\
  \n## 总结\n\n开发软件应用只是挑战的一部分。在（企业规模的）生产环境中维护它们需要同样的投入和工程努力。这只能通过可靠的可观测性战略来实现，它不仅让你能更快地响应运维问题，还能收集有意义的洞察，从而让你持续为用户交付差异化的业务成果。\n\
  \n本章开始时，我们基本了解了什么是可观测性以及它为何重要。带着这些知识，我们接着讨论了 AWS 可观测性平台——CloudWatch——以及它为每个可观测性支柱（指标、日志和追踪）提供的解决方案或集成。此外，我们还讨论了\
  \ AWS 在 CNCF 的 OpenTelemetry 项目和 ADOT 收集器方面所做的努力，后者使你能无缝地收集、处理和导出指标、日志和追踪到其他 AWS\
  \ 服务。\n\n在 AWS 之外，Prometheus 和 Grafana 等解决方案因其成熟度、易用性和可扩展性而被企业广泛采用。为了确保涵盖所有这些解决方案的动手体验，我们继续为上一章中的测试应用\
  \ To-Do List Manager 部署了一个可观测性栈。这让我们能够全面了解如何集成所有这些工具，并使它们适应我们的特定需求。\n\n\n\n在下一章中，*使用\
  \ AWS 实施 DevSecOps*，我们将重点讨论一种能够在整个 IT 生命周期中集成安全性的方法。\n\n## 延伸阅读\n\n要深入了解本章涵盖的主题，请参阅以下资源：\n\
  \n- 英国电信如何利用 CloudWatch 监控数百万台设备：`https://aws.amazon.com/blogs/mt/how-bt-uses-amazon-cloudwatch-to-monitor-millions-of-devices/`\n\
  - 构建用于运维可见性的仪表板：`https://aws.amazon.com/builders-library/building-dashboards-for-operational-visibility/`\n"
- "## 使用 AWS 实施 DevSecOps\n\n征信机构 Equifax 报告称，在 2017 年的一次数据泄露事件中，1.43 亿美国公民的个人记录被未经授权访问，而该事件在\
  \ 76 天内未被发现（https://www.csoonline.com/article/3444488/equifax-data-breach-faq-what-happened-who-was-affected-what-was-the-impact.html）。最初只是\
  \ Apache Struts（Java 应用程序常用的一种知名框架）中的一个常见漏洞与暴露（CVE），最终却给该公司带来了财务和声誉损失。即使采取了纠正措施，由于依赖人工流程，仍有少数服务器未得到修复。这些缺口，加上团队普遍缺乏对安全漏洞的认识，被恶意行为者利用，先访问了其中一台服务器，进而访问了其他多台服务器。此类安全事件会损害业务健康，更重要的是，会导致客户信任丧失以及声誉受损。\n\
  \n软件实践的演进和云计算的快速普及进一步加剧了现代应用面临的安全风险激增。这主要是由于对第三方软件模块的依赖日益增加、频繁变更以及现在每个部署的软件制品中都必不可少的多个抽象层所致。如今的安全性不再局限于本地部署的单体式\
  \ Java 应用。例如，同一个应用可能已转变为一组微服务，每个微服务都暴露 API，并作为容器镜像部署到公有云中运行的 Kubernetes 集群上。除了应用代码本身，我们还有其他多个层需要保护。如果基础容器镜像或我们添加在之上的自定义库存在漏洞怎么办？我们如何大规模地为所有微服务管理安全的\
  \ HTTPS 通信接口？保护 Kubernetes 控制平面和云网络配置等其他组件（对开发人员来说更像黑盒）是完全不同的挑战。此外，如何持续处理所有这些，确保每一行新编写的代码仍然符合我们设定的安全标准？\n\
  \n正如你所看到的，新的软件模式引入了风险维度，在大多数情况下，这些风险并不容易修复，甚至难以识别，因为软件团队自身往往对这些层缺乏所需的深度和可见性。然而，只要在三个领域集中发力——我们称之为\
  \ *AEA 框架*——他们就能确保云工作负载获得良好的安全覆盖：\n\n- *感知*（Awareness）：了解系统中存在的安全风险及其相应的严重程度\n-\
  \ *赋能*（Enablement）：让人员能够理解并处理出现的任何信息或警报\n- *自动化*（Automation）：在交付链中尽早检测这些安全风险\n\n\
  这三个方面将成为本章的主题，我们将围绕一个名为 **DevSecOps** 的重要概念来学习它们。正如 DevOps 使软件团队能够实现文化转型并更快地交付软件一样，DevSecOps\
  \ 引入了聚焦安全的新思想和实践。DevSecOps 应被视为 DevOps 实践的一次迭代，因为它为现有的开发和运维流程包裹了一个额外的安全层。这与传统软件开发方法有根本不同，在传统方法中，安全被视为事后考虑。\n\
  \n在更广泛的层面上，我们将在本章中涵盖以下主题：\n\n- 安全的权衡与挑战\n- 什么是 DevSecOps？\n- 在 AWS 中保护你的工作负载\n-\
  \ 为 DevSecOps 推出测试 CI/CD 工作流\n\n> **提示**\n> 如果你对云中不同类型的安全风险及其可能带来的影响感到好奇，我推荐阅读这篇博客：https://appinventiv.com/blog/cloud-security-risks-and-solutions/。\n\
  \n持续成功推出软件制品的关键要求是*自动化*和*有效的反馈循环*。在这一理念的驱动下，DevOps 策略旨在优化软件交付生命周期的每一个步骤。开发人员在自己的本地机器上编写代码，并将更改提交到版本控制系统。此时，交付管道接管，测试更改并创建新版本的软件制品，在每个阶段提供反馈。如果所有测试用例都通过，它会将制品提升到交付链中的后续环境，最终将更改带到预生产或生产环境。然而，在实际场景中，这说起来容易做起来难，尤其是在快速规模发布软件制品时。虽然有几个因素可能会拖慢你的速度，但最需要适应的关键因素是安全。让我们来看看为什么会出现这种情况。\n\
  \n## 安全的权衡与挑战\n\n每个软件团队都有自己独特的挑战需要解决，无论是技术上的还是文化上的。在深入探讨 DevSecOps 的细节之前，让我们先尝试理解是什么导致了对现有\
  \ DevOps 方法论进行迭代的需求。在此过程中，我们将讨论为什么安全有时被视为一种阻力，而不是对持续应用交付的积极推动。根据我与不同团队合作的经验，我观察到导致这种放缓的四个主要模式：\n\
  \n- 缺乏所有权意识\n- 软件交付中的最后一步\n- 应用架构的快速演进\n- 过时的安全工具\n\n让我们逐一详细看看这些模式。\n\n### 缺乏所有权意识\n\
  \n通常，开发人员和运维团队成员*并不觉得自己对应用的安全状况负有责任*。站在光谱的另一端——即构建新功能并将其推向生产——他们把安全视为阻碍增长的东西。安全合规被留给坐在另一个房间里的专业人员。\n\
  \n除非这成为共同责任，并且团队成员开始协作识别和修复问题，否则安全将继续成为阻碍项。整个软件交付过程的速度将*取决于链条中最薄弱的环节*——而我们不希望安全成为那个环节。此外，需要强调的是，采用\
  \ DevOps 意味着安全在你所做的一切中都是一个反复出现的主题，这会给你带来立竿见影的好处。\n\n### 软件交付中的最后一步\n\n在前面的章节中，我们讨论了很多关于基础设施自动化、应用交付以及如何通过采用\
  \ DevOps 方法论来优化大部分这些任务的内容。然而，软件发布周期中一个我们讨论得不够充分的关键步骤是安全。问题不在于*严重性*拖慢了团队——而更多在于它成为了*最后一步*。\n\
  \n传统上，软件团队采用瀑布模型方法开发功能，并在接近上线日期时将其“扔过墙”交给安全团队。这些庞大的发布使准确识别新代码给应用带来的所有安全风险变得非常困难。手动测试需要时间，最终，所有这些都导致软件开发速度与发布速度之间的脱节。作为\
  \ DevSecOps 实践者，你应该始终关注此类瓶颈，因为它们可能会拖慢团队步伐，导致挫败感、延迟和信心降低。但究竟是什么让安全审计变得缓慢呢？\n\n\n\n\
  \n## 应用架构的快速演进\n\n我们不能忽视的一个重要维度是过去几年中应用架构的演进，这在某种程度上给安全调查和审批增加了额外的负担。\n\n如今，单体应用被拆分为微服务，导致产生数百甚至数千个\
  \ API。以前，你只需要保护可计数的入口点，但现在，你需要管理动态规模的系统。高度安全的环境进一步强制这些微服务之间通过相互 TLS (mTLS) 进行通信。这导致需要管理大量的证书。从运营和可扩展性的角度来看，一个常见的下一步是研究容器化选项。由于在规模上可靠地运行这些容器并非易事，由托管容器平台提供的编排就成为理想的下一步。当然，谁不想简化这些平台的管理，让相当一部分应用将\
  \ AWS 等云服务提供商作为新的家园呢？\n\n如果你在此稍作停顿，从安全角度审视这一巨大转变，你会注意到所有这些都极大地增加了攻击面，并引入了团队现在需要防范的新风险。事物不再局限于应用本身，还包括构建在其之上的抽象层——即\
  \ API、容器抽象和云平台——各自都有其贡献。\n\n## 过时的安全工具\n\n另一方面，安全专业人员长期以来习惯于一套特定的工具，而这些工具可能并没有像软件开发中的花哨创新那样快速演进。因此，安全不仅需要跟上开发人员采用的新工具，还需要不断寻找新的攻击面。在某些情况下，这可能需要寻找新的安全工具、采用第三方云安全软件，甚至开发定制解决方案。\n\
  \n所有这些都引出一个重要观点——安全永远不会完成。*它是一个持续改进的循环。* 这使得在现代软件团队中工作的安全专业人员很难跟上交付的步伐。潜在的风险面已成倍增加，这已无法再通过手动测试来解决，同时，我们也不能等到软件交付过程的最后阶段。因此，在交付生命周期的每一步都注入安全扫描至关重要，而这正是\
  \ DevSecOps 的核心。\n\n## 什么是 DevSecOps？\n\n简单来说，DevSecOps 是将安全测试集成到软件交付生命周期的每个阶段的做法。它是我们迄今为止在本书中讨论的\
  \ DevOps 方法的*扩展*。利用工具和流程，它促进开发、运维和安全团队之间的协作。这使得产生的软件制品不仅在运营上高效，而且在任何时间点发布到生产环境都是安全的。与\
  \ DevOps 类似，DevSecOps 也带来了关于如何在传统软件交付流程中处理安全问题的文化转变。安全团队不应再被视为某种形式的阻力，而应更多地被视为在组织中推广安全最佳实践的推动者。\n\
  \n在我们继续之前，我想澄清一个你可能正在思考的问题——DevOps 和 DevSecOps 之间的区别。\n\n## 它与 DevOps 有何不同？\n\n\
  DevOps 的核心思想是尽可能快地将应用交付到最终用户手中。虽然这在很大程度上围绕文化转型、自动化工具和流程展开，但安全有时会被落下。软件团队经常将安全视为一个孤立的流程或团队，仅在部署前才介入。在某些情况下，这些安全许可和流程甚至可能被完全忽视，这是一个更关键的情况。\n\
  \n另一方面，DevSecOps 旨在通过确保安全实践无缝集成到日常开发活动中来解决这一差距。开发人员和运维团队成员与安全专业人员一起共同承担每次向最终用户发布安全制品的责任。这种协作通常会导致采用自动化和工具，从而扩展这些团队当前使用的\
  \ CI/CD 流程。\n\n我想在此强调的一点是，你的 DevSecOps 成功在很大程度上取决于你的 DevOps 基础是否稳定。它只能建立在现有的 DevOps\
  \ 实践实施之上，例如持续集成、运营程序和团队文化。这是一种进一步放大 DevOps 投资回报并从持续安全执行和验证带来的好处中获益的方法。\n\n为了证明采用某些实践或工作方式的必要性，分析其带来的好处非常重要。我们接下来将讨论这一点。\n\
  \n## DevSecOps 的关键优势\n\nDevSecOps 实践在软件开发生命周期（SDLC）中对许多领域都有积极影响。虽然每个团队的收益程度会有所不同，但某些优势适用于大多数团队。让我们来看看。\n\
  \n## 降低上市时间\n\n缺乏安全意识和自动化的代码验证会阻碍你仅采用 DevOps 可能获得的好处。除了每天多次频繁发布代码更改外，DevSecOps 还确保软件开发人员免受可能导致最终用户体验下降和信任丧失的未知安全风险的影响。安全评估时间的减少会自动提高软件部署速率。\n\
  \n## 提高团队成员的安全意识\n\n开发人员和运维团队成员经常会遇到可以轻松采用现有开源工具或第三方库来实现功能的情况。虽然始终以构建与购买的思维方式来处理这些决策并避免重复造轮子是一个很好的做法，但使用此类外部代码库可能导致未知的风险暴露。同样，一个现在安全使用的库在未来的版本迭代中可能不再足够安全。在“为\
  \ DevSecOps 推出测试 CI/CD 工作流”部分，我们将介绍一些安全工具，它们会将代码扫描与公共漏洞数据库（例如国家漏洞数据库（NVD））进行比对，而这些数据库会持续更新。这极大地提高了参与代码交付的每个人的意识。除了识别风险之外，大多数这些工具还帮助开发人员提供如何立即修复漏洞的建议。\n\
  \n意识到此类问题是采用 DevSecOps 提倡的集成安全实践带来的巨大好处。\n\n> **注意**\n> 一个很好的例子是 2021 年的零日 Log4j\
  \ 漏洞，它暴露了 Log4j 日志实用程序中的安全漏洞，该实用程序在 Java 程序中常用。如果你没有接触过这个新闻，我建议阅读更多相关内容，网址为 https://builtin.com/cybersecurity/log4j-vulnerability-explained。\n\
  \n## 充满信心地开发新功能\n\n虽然安全是一个持续的过程，但通过自动化验证和代码检查获得的反馈有助于更早地解决问题，从而提高软件开发人员的信心。他们可以信任交付链中多个工具执行的扫描，并至少对达到最低安全基线充满信心。\n\
  \n## 在受监管环境中提高合规性\n\n制药、国防和航空航天等受监管行业遵循传统的开发实践，涉及大量手动测试程序。为了遵守多项法规和标准，它们很难像其他非受监管公司那样以类似的规模发布代码更改，而后者无需担心太多问题。这直接影响到软件团队的发布速度和生产力。\n\
  \n此外，它们需要维护软件应用更长的时间，而底层平台和基础设施的变化要求需要持续的评估程序，即使是最小的代码更改也需要重复执行。\n\n\n\n\n\n## 问题的早期识别\n\
  \nDevSecOps 工具的自动化可以在开发者将代码提交到本地 git 仓库时就启动。通过利用 git 的 `pre-commit` 钩子，他们甚至在将更改推送到远程仓库之前就能从这些代码扫描的反馈中受益。\n\
  \n> **提示**\n>\n> **Trufflehog** 就是这样一种工具，它可以阻止你意外地将密钥提交到源代码中。你可以在 `https://github.com/trufflesecurity/trufflehog`\
  \ 了解更多关于此工具的信息以及如何将其配置为 pre-commit 钩子。\n\n这可以控制由最近代码更改引入的任何风险敞口。由于开发者对自己试图完成的事情有完整的上下文，并且修改仍在他们的脑海中，这些问题更容易修复。\n\
  \n*纵深防御* 策略还确保在代码开发过程的多个阶段应用并评估类似的防护措施。因此，即使开发者机器上的本地配置不正常，此类风险也可以在下一层级得到缓解，该层级可能是配置在远程仓库管理系统中的服务器端钩子，例如\
  \ **GitHub** 或 **GitLab**。\n\n我们一直在讨论很多的 DevSecOps 重要方面是文化转变以及角色和职责的变化。接下来，我们将讨论这对软件团队中的不同角色意味着什么。\n\
  \n### 对安全专业人员意味着什么\n\n安全同事一直被视为某种守门人，并且最终对出现的任何安全风险负责。根据 DevSecOps 方法论，这需要改变。它们不应抵制频繁的代码修改和发布，而应充当推动者。这些专业人员的成功[content]\n\
  \n## 问题的早期识别\n\nDevSecOps 工具的自动化可以在开发者将代码提交到本地 git 仓库时就启动。通过利用 git 的 `pre-commit`\
  \ 钩子，他们甚至在将更改推送到远程仓库之前就能从这些代码扫描的反馈中受益。\n\n> **提示**\n>\n> **Trufflehog** 就是这样一种工具，它可以阻止你意外地将密钥提交到源代码中。你可以在\
  \ `https://github.com/trufflesecurity/trufflehog` 了解更多关于此工具的信息以及如何将其配置为 pre-commit\
  \ 钩子。\n\n这可以控制由最近代码更改引入的任何风险敞口。由于开发者对自己试图完成的事情有完整的上下文，并且修改仍在他们的脑海中，这些问题更容易修复。\n\n\
  *纵深防御* 策略还确保在代码开发过程的多个阶段应用并评估类似的防护措施。因此，即使开发者机器上的本地配置不正常，此类风险也可以在下一层级得到缓解，该层级可能是配置在远程仓库管理系统中的服务器端钩子，例如\
  \ **GitHub** 或 **GitLab**。\n\n我们一直在讨论很多的 DevSecOps 重要方面是文化转变以及角色和职责的变化。接下来，我们将讨论这对软件团队中的不同角色意味着什么。\n\
  \n### 对安全专业人员意味着什么\n\n安全同事一直被视为某种守门人，并且最终对出现的任何安全风险负责。根据 DevSecOps 方法论，这需要改变。它们不应抵制频繁的代码修改和发布，而应充当推动者。这些专业人员的成功箴言应该是\
  \ *防护措施而非阻碍者*。他们需要不断学习组织内 DevOps 的运作方式，并通过将控制措施直接嵌入 DevOps 方法论中来发展安全流程。\n\n### 为应用和基础设施定义安全策略\n\
  \n安全风险现在是多维度的。它们适用于作为代码管理的任何内容——因此既包括基础设施也包括应用程序。安全专业人员应专注于定义这些代码库应该和不应该被允许做什么的策略。与其为每个应用程序或团队制定细粒度的策略，他们应投入精力建立保护公司和各个团队的防护措施。\n\
  \n## 在云中运行工作负载的安全挑战\n\n软件团队在采用 AWS 或任何其他云服务提供商时，在安全方面面临两个常见的阻碍。\n\n### 理解云中的安全责任\n\
  \n我们首先需要了解云服务提供商的责任究竟在何处结束，以及作为客户的你的责任从何开始。这些责任还可能因你使用的云服务层级类型而异，即 IaaS、PaaS 或 SaaS。我们在第\
  \ 2 章《选择合适的云服务》中详细讨论了这三个层级。例如，当你在 EC2 上运行应用程序时，修补安全漏洞或升级 AMI 是你的责任。但如果你的代码部署在 Lambda\
  \ 上，则底层计算基础设施的安全性由 AWS 负责。云服务提供商负责云的安全，而客户负责云中的安全。为了进一步说明这一点，如果超visor 漏洞允许另一位 AWS\
  \ 用户未经授权访问你的 EC2 实例，则这是 AWS 安全的疏漏。另一方面，配置错误的 security group 允许对 EC2 实例进行不受限制的 SSH\
  \ 访问，则是客户的过错。我建议你查阅 AWS 共享责任资源以深入了解细节：https://aws.amazon.com/compliance/shared-responsibility-model/。\n\
  \n对于软件应用程序而言，如果你是在本地运行工作负载还是在云中运行，风险或多或少是相同的。然而，发生变化的是应对这些风险的流程和解决方案。AWS 提供了多个服务，可帮助你保护网络、数据以及身份和访问管理。考虑到我们互联网面向的\
  \ Web 应用程序示例，你可以将管理自托管负载均衡器的风险转移到 AWS Elastic Load Balancer 并集成 Web 应用防火墙。提取前端 API\
  \ 逻辑并迁移到 API Gateway 将你的风险转移到云服务提供商，而将传统的静态网站现代化并托管在 CloudFront 上且无需管理服务器则消除了你的风险。因此，了解需要保护的确切内容非常重要。\n\
  \n一旦责任明确，团队遇到的第二个问题是如何管理其风险。\n\n### 识别和优先排序风险\n\n软件团队通常从开始保护他们最熟悉的应用架构部分。这有时会隐藏其他风险，可能发生概率更高。了解你的风险敞口的一种好方法是开始威胁建模流程，正如\
  \ AEA 框架中定义的提高意识。\n\n威胁建模是对当前部署资源所面临的风险进行评估，并根据各自的关键性确定其优先级。随着应用架构的演进，这些风险也会不断变化，因此缓解措施也应随之改变。威胁建模有时被视为在软件交付流程的后期阶段、发布前进行的一次性活动。根据\
  \ DevSecOps 方法论，应避免这种情况，DevSecOps 方法论提倡将安全实践直接构建到开发生命周期中。因此，在应用程序设计阶段就让安全团队成员参与其中，以便尽早发现风险，这很有意义。在开发的早期阶段，开发者修复具有安全影响的架构方法所花费的成本也更低。\n\
  \n对于互联网面向的 Web 应用程序，这里有一些潜在风险的示例：\n\n- **分布式拒绝服务 (DDoS)** 攻击\n- 用户突破应用程序的多租户边界以提取属于其他用户的数据\n\
  - SQL 注入和跨站脚本攻击\n\n在此情况下的威胁建模练习应考虑每种风险发生的概率，并提出缓解步骤。具有成熟 DevSecOps 实践的组织进一步确保其威胁建模流程是周期性活动。这确保了良好的安全态势不仅在首次生产发布期间得到验证，而且不断地针对新风险和敞口进行评估和优化。\n\
  \n> **提示**\n>\n> OWASP Top 10 是了解你的应用程序可能遇到的不同类型的 Web 应用程序安全问题的良好资源。作为威胁建模活动的一部分，你可以考虑将工作负载与这些风险进行评估作为起点：`https://owasp.org/www-project-top-ten/`。\n\
  \n并非所有风险都源于软件开发者编写的专有代码。大量漏洞来自这些项目所使用的依赖项和开源库。**Snyk** 和 **Linux Foundation** 的\
  \ 2022 年开源安全现状报告指出：\n\n> “平均应用开发项目有 49 个漏洞和 80 个直接依赖项，并且修复开源项目中漏洞所需的时间稳步增加，从 2018\
  \ 年的 49 天增加到 2021 年的 110 天以上。”\n\n即使这些数字反映了开源项目的现状，它们也说明了持续扫描任何不受信任代码并尽快暴露漏洞的必要性。让我们讨论一些你可以考虑的测试策略。\n\
  \n\n\n\n\n## 针对AWS工作负载的测试策略\n\n代码不再仅限于最终用户使用的业务应用程序。你的基础设施、CI/CD流水线以及为支持应用程序交付而构建的所有自动化同样可能危及你的安全态势。假设架构的大多数（如果不是全部）组件都是通过流水线部署的，有两个主要方面需要考虑：\n\
  \n- 流水线的安全性\n- 流水线中的安全性\n\n让我们来看一看。\n\n### 流水线的安全性\n\n流水线中内置的高度自动化也意味着任何意外的代码更改都可能在交付生命周期中走得很远，最终到达生产环境。良好的安全实践限制了对生产环境的任何形式的人为访问，这反过来要求CI/CD流水线具有高权限的访问权限。因此，确保你的流水线也被视为代码、持续检查并监控安全漏洞非常重要。接下来将讨论需要保护的五个主要领域。\n\
  \n### 流水线的身份与访问管理\n\nAWS Identity and Access Management（IAM）有助于管理身份及其对AWS服务的访问，涵盖人类和非人类访问模式。例如，我们在前几章部署的CodePipeline流水线使用了服务角色，在该角色中，我们定义了服务代表用户在AWS账户中可以做什么或不可以做什么。根据流水线需要执行的操作，你应始终遵循最小权限原则，尽量给予最低权限。\n\
  \n拥有高度成熟DevSecOps实践的公司还可以考虑构建流水线工厂，为针对常见应用程序模式的流水线发出权限最小的可复用模板。\n\n### 检测异常行为\n\n\
  您应该像捕获应用程序日志一样，捕获流水线在AWS中的所有执行日志。此外，CodePipeline和CodeBuild等服务提供了与CloudWatch Logs和CloudWatch\
  \ Metrics集成的日志和指标集成能力。启用这些设置只需在基础设施代码中添加几行配置即可。\n\n维护这些日志的机密性和完整性是一项重要的安全措施，而良好的组织策略还会在CloudTrail中捕获所有IAM操作事件。这有助于在需要时进行无缝的审计流程。例如，IAM访问请求拒绝的突然激增可能暗示系统已受损，并且可以通过错误代码进行跟踪\n\
  \n![](img/ecd265dfca9bb64161408ba8a944a4d9_229_0.png)\n\n图9.1 – 在CI/CD的所有阶段嵌入安全性\n\
  \n与我们之前讨论的*左移*策略一致，DevSecOps旨在使开发人员能够自行保护其代码。为了促进这种文化转变，可以使用不同类型的代码测试方法向开发人员提供反馈。\n\
  \n### 软件组成分析\n\n如今许多现代应用程序由开源代码组成，这对组织来说是一个巨大挑战。他们需要扫描所有这些依赖项及其代码，以有效管理风险。**软件组成分析（SCA）**\
  \ 可以跟踪所有已报告漏洞和潜在漏洞的软件许可证和依赖项。此外，这些工具会生成**软件物料清单（SBOM）**，可用于跟踪软件所依赖的所有资产。这些工具应在SDLC早期集成，并在引入新依赖项或升级版本时及时集成。\n\
  \n### 静态应用程序安全测试\n\n**静态应用程序安全测试（SAST）** 工具扫描组织专有的代码。它们根据已知的引入安全风险的编程模式来评估代码。作为分析的一部分，它们还提供一些改进反馈，说明如何使代码更安全。SCA和SAST方法都不需要部署代码进行测试。适合在SDLC早期、代码部署到测试环境之前运行这些扫描。\n\
  \n### 动态应用程序安全测试\n\n顾名思义，这些测试是动态的。它们试图穿透应用程序的安全，并将漏洞暴露出来。这些工具通常在生产环境中使用，从这些工具获得的反馈对于安全策略和标准的持续合规非常有价值。\n\
  \n**动态应用程序安全测试（DAST）** 工具主要用于Web应用程序，因为它们经常通过互联网暴露于不受信任的网络和用户。随着应用程序代码的演变，这些工具会在新发现的风险变得严重之前继续扫描它们。\n\
  \n### 保护定义为代码的基础设施\n\n**基础设施即代码（IaC）** 是一种通过配置文件在本地或云中定义和管理基础设施组件的方法。该领域常用的工具和服务包括**Pulumi、CloudFormation、Terraform**和**AWS\
  \ CDK**。保护它们需要安全团队定义一组规则，然后将其编码并用于评估这些配置中的任何更改。**Open Policy Agent（OPA）** 就是这样一种工具，它允许你根据自定义定义的策略验证基础设施代码。\n\
  \n在所有这些安全测试机制方面，工具领域非常广泛。在我们深入实践练习之前，让我们快速了解一些工具，你可以根据当前用例考虑采用这些工具。\n\n### 用于安全评估的重要工具\n\
  \n下表列出了一些有助于减轻各种安全风险的开源扫描器：\n\n| 工具 | 描述 |\n| --- | --- |\n| **密钥扫描器** | |\n| `git-secrets`\
  \ | 此工具可防止你意外将机密和凭据提交到git存储库。理想情况下，它应该作为`pre-commit`钩子的一部分调用。 |\n| **第三方库漏洞扫描器**\
  \ | |\n| **Grype** | Grype扫描容器镜像和文件系统中来自第三方依赖项的漏洞。它支持Docker、Ruby、Java和Python等。 |\n\
  | **OWASP dependency-check** | 此工具对照NVD数据库中注册的漏洞扫描依赖项。它支持Java、JavaScript和Ruby。 |\n\
  | **Trivy** | Trivy扫描容器镜像、git存储库以及maven、npm和yarn等依赖框架。 |\n| **CloudFormation、CDK和Terraform代码的安全扫描器**\
  \ | |\n| **cfn_nag** | 它搜索CloudFormation模板中的不安全基础设施指示器，包括过度宽松的IAM规则、安全组、缺失的访问日志等。\
  \ |\n| **cfn_guard** | 从技术上讲，`cfn_guard` 与OPA类似。你可以使用它来定义声明式策略，然后用于评估CloudFormation模板。\
  \ |\n| **cdk_nag** | 在CDK应用程序中搜索安全合规性问题。它还支持可用于HIPAA、NIST和PCI合规性的规则列表。 |\n| **checkov**\
  \ | `checkov` 是一个静态代码分析工具，可扫描IaC模板并查找开源包中的漏洞。 |\n| **tfsec** | `tfsec` 是AquaSec的代码扫描器。它报告基础设施配置中的错误配置。\
  \ |\n\n在下一节中，我们将动手部署一个测试CI/CD工作流，总结我们目前学到的所有知识。\n\n### 为DevSecOps推出测试CI/CD工作流\n\n\
  为了将实践付诸行动，我们将在AWS账户中部署一个测试流水线，从安全角度演示各种工具（AWS和**开源**）的用法。更具体地说，让我们考虑一个几乎每个现代软件开发团队都需要解决的需求——在大规模下安全地交付Docker镜像。在真实场景中，你应该考虑将此工作流生成的输出工件（Docker镜像）部署到专用测试环境中，在那里可以执行DAST调查。这在将镜像部署到后续环境（预生产、生产等）之前尤其有用。\n\
  \n为了直观地了解我们将要构建的内容，让我们通过一个突出显示端到端流程的架构图深入了解细节。\n\n\n\n\n\n## 了解 DevSecOps 流水线的目标架构\n\
  \n在 AWS CodePipeline 中，流水线定义至少包含两个阶段，以及每个阶段中对应的操作。我们在第 5 章“推出 CI/CD 流水线”中详细介绍了 AWS\
  \ CodePipeline 的组成部分。当我们想到软件交付的整个生命周期时，脑海中浮现的典型阶段是源代码、构建、测试和部署。在接下来的练习中，我们将主要关注前两个阶段，并以\
  \ Docker 镜像交付工作流为例，了解如何将 DevSecOps 实践引入其中。\n\n在前几章中，我们开发并部署了一个基于 Python 的待办事项列表管理器应用。我们将复用该应用代码和相应的\
  \ Docker 清单文件。我们的主要重点是在此应用的构建阶段引入安全评估，从而创建安全的 Docker 镜像。图 9.2 突出显示了我们将运行的不同类型的安全扫描：\n\
  \n![](img/ecd265dfca9bb64161408ba8a944a4d9_232_0.png)\n\n图 9.2 – DevSecOps 流水线的不同阶段\n\
  \n让我们先概述流水线每个阶段执行的步骤：\n\n- **1. 新代码变更**：几乎每个 CI/CD 流水线都会针对感兴趣的事件设置自动触发器。在本例中，我们关注的是开发人员将新提交推送到包含应用代码的\
  \ CodeCommit 仓库。\n- **2. CodePipeline 执行**：在 CodeCommit 仓库中注册 git 提交后，流水线执行立即开始。如前面的图所示，Source\
  \ 是第一个阶段，CodePipeline 在此拉取最新版本的代码变更，并在后续阶段和操作中提供这些变更。\n- **3. 应用验证**：流水线中的第二个阶段定义了针对安全漏洞评估代码及其依赖项的操作。此阶段进一步包含两个并行执行的*操作*：\n\
  \n  - I. **软件成分分析（SCA）**：这是应用验证阶段中的 CodePipeline 操作。我们利用 CodeBuild 提供临时计算环境，用于安装来自\
  \ **OWASP** 的 **Dependency-Check** 工具。安装完成后，我们验证 `requirements.txt` 文件中定义的 Python\
  \ 代码依赖项。如果你之前没有使用过 Python，`requirements.txt` 文件会列出项目使用的所有依赖项，也就是库和包。\n\n  Dependency-Check\
  \ 是一种 SCA 工具，支持多种编程语言，可检测项目依赖项中已公开披露的漏洞。这是通过评估指定依赖项是否存在**通用平台枚举（CPE）**标识符来实现的。一旦发现漏洞，将生成一份综合报告，其中包含相应\
  \ CVE 条目的链接。\n\n  - II. **静态应用安全测试（SAST）**：在此 CodePipeline 操作中，我们使用 **Bandit** 工具扫描\
  \ Python 代码，将安全问题暴露出来。Bandit 会从它扫描的所有 Python 代码文件生成**抽象语法树（AST）**，然后针对该 AST 运行安全验证插件。输出是一份报告，突出显示安全问题，并为开发人员提供建议操作。\n\
  \n- **4. Dockerfile 验证**：这是流水线的第三个阶段，在应用代码扫描通过后触发。你可能已经注意到，我们遵循*由内向外*的原则：先扫描应用本身，然后逐层处理其上的抽象层。这也有助于优化流水线资源的使用，因为在确保要放入\
  \ Docker 镜像的代码具有良好安全状态之前，测试 Docker 镜像毫无意义。\n\n  对于 Dockerfile 的 lint 检查和安全分析，我们使用\
  \ `hadolint`。除了提供基本的 lint 检查功能外，hadolint 还允许安全专业人员强制执行某些规则。例如，你可以定义这些 Dockerfile\
  \ 可以基于的可信注册表，或抑制误报。hadolint 的所有验证规则都可以在 https://github.com/hadolint/hadolint#rules\
  \ 查看。\n\n- **5. Dockerfile 构建**：这是流水线的最后一个阶段，在这里构建 Docker 镜像，然后将其发布到**弹性容器注册表（ECR）**仓库中，供部署活动使用。\n\
  \n我们部署的工作流可以轻松扩展，为任何其他软件添加特定的部署操作。在理想情况下，你还可以有额外的阶段来使用此流水线生成的工件（Docker 镜像），并将其部署到支持运行\
  \ Docker 容器的环境上，例如**弹性容器服务（ECS）**或**弹性 Kubernetes 服务（EKS）**。\n\n在了解了 DevSecOps 流水线的整体流程以及我们希望实现的目标之后，让我们概述一下我们将使用的代码库的两个组成部分。\n\
  \n## 了解代码库\n\n与其他章节类似，接下来练习的代码可以在 Cloud9 IDE 中的项目目录 `chapter-9/` 下找到。其中两个子文件夹分别包含\
  \ Python 应用和用于推出 DevSecOps CI/CD 流水线的基础设施代码。让我们逐一查看两者的内容：\n\n- **Python Flask 应用：**\
  \ 此文件夹包含以 Docker 容器形式运行基于 Python 的**待办事项列表管理器**应用所需的代码。除了 `app.py` 文件外，`Dockerfile`\
  \ 清单还列出了创建 Docker 镜像所需的全部指令。\n- **DevSecOps CI/CD 流水线构造：** 我们将利用 **AWS CDK** 构造来部署\
  \ CI/CD 流水线的各个组件，并了解典型的 DevSecOps 工作流是什么样子。我们在 CDK 堆栈中使用的所有资源构造都是 AWS 托管服务，因此无需任何基础性基础设施元素，例如\
  \ VPC、子网、互联网网关等。\n\n在提交 Python 应用代码并评估其是否存在安全风险之前，我们需要部署 CDK 堆栈并预置流水线组件。\n\n## 在\
  \ AWS 账户中部署 CDK 堆栈\n\n要部署堆栈资源，我们首先需要运行 `npm install` 命令，以便下载所有项目依赖项。安装完成后，如果你愿意，可以使用\
  \ `cdk synth` 命令检查 CloudFormation 模板。\n\n至此，我们已经准备好将堆栈部署到 AWS 账户中，这将使用 **AWS CodePipeline**\
  \ 服务设置流水线的所有阶段和相应操作：\n\n```\naws-devops-simplified:~ /environment/chapter-9/devsecops-cicd-pipeline\n\
  $ cdk deploy\n...\n...\n✨  Synthesis time: 12.65s\nDeliveryPipelineStack:  start:\
  \ Building 46e40c3e0f5b985e8b4b1bbc5c4eb-24cacee4d46e40c3e0f5b985e8b4b1bbc5c4eb24cacee4d04d15ecbcbecbc4839d8f-9dlcf:current_account-current_region\n\
  ...\nDo you wish to deploy these changes (y/n)? y\nDeliveryPipelineStack: deploying...\
  \ [1/1]\n...\nDeliveryPipelineStack: creating CloudFormation changeset...\nDeliveryPipelineStack\n\
  Deployment time: 202.82s\n```\n\nCDK 应用成功部署后，你可以访问 CodePipeline 服务，查看已预置的所有阶段和相应操作。你将看到类似图\
  \ 9.3 的内容：\n\n![](img/ecd265dfca9bb64161408ba8a944a4d9_235_0.png)\n\n图 9.3 – CI/CD\
  \ 流水线的不同阶段\n\n正如你所注意到的，第一个阶段报告了失败，这是预期的，因为新预置的 CodeCommit 仓库中还没有代码。因此，让我们继续将应用代码提交到仓库中。CodeCommit\
  \ 建议使用 git-remote-codecommit 插件通过 HTTPS（GRC）端点进行身份验证。可以从 AWS Web 控制台中你仓库的 CodeCommit\
  \ 服务页面获取此 GRC 端点。git-remote-codecommit 插件已经包含在你安装到 AWS 账户中的 Cloud9 IDE 中。\n\n在查看流水线执行之前，最后一步是初始化本地\
  \ Git 仓库并设置 Git remote，使其指向我们在 AWS 账户中的 CodeCommit 仓库。我们只需要推送应用代码，所以让我们也切换工作目录：\n\
  \n```\naws-devops-simplified:~/environment/chapter-9 $ cd chapter-9-flask-app/\n\
  aws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app $ git init .\n\
  aws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app $ git checkout\
  \ -b master\naws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app $\
  \ git add .\naws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app $\
  \ git commit -m \"Sample application for DevSecOps pipeline\"\n```\n\n将文件添加到 Git\
  \ 暂存区后，我们就可以将它们推送到 CodeCommit 仓库：\n\n```\naws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app\
  \ $ git remote add origin codecommit::eu-central-1://image-delivery-pipeline\naws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app\
  \ $ git push origin master\n...\n```\n\n一旦提交在 CodeCommit 中注册，流水线执行就会开始。CodePipeline\
  \ 现在可以从配置的分支（master）上的 CodeCommit 仓库获取代码。让我们深入了解流水线中配置的安全评估结果。\n\n## 检查安全评估结果\n\n\
  流水线的每个阶段都会针对安全风险验证应用的某个方面。我们遵循相同的*由内向外*原则，从应用本身开始，然后再进行 Docker 验证。\n\n\n\n\n\n##\
  \ 使用 dependency-check 进行软件组成分析\n\n如果观察管道执行的输出，你会注意到第一个阶段 ApplicationValidation 在\
  \ SCAcheck CodeBuild 动作中报告了一个错误。查看 CodeBuild 构建执行日志可发现 Flask 框架中存在一个发现，并且由于严重性超过了阈值\
  \ 7（在 buildspec.yml 文件中配置），因此引发了错误。此类安全验证会标记开发人员可能引入到应用程序中的任何新依赖项。这些发现的严重性可能各不相同，并非所有都相关，但有一定误报总比没有报告要好。\n\
  \n在这种情况下，OWASP dependency-check 工具除了标记潜在风险外，还为我们提供了一个包含有关已报告特定 CVE 的更多信息的 URL：\n\
  \n```\n\"vulnerabilities\": [\n  {\n    \"source\": \"OSSINDEX\",\n    \"name\"\
  : \"CVE-2023-30861\",\n    \"severity\": \"HIGH\",\n    \"cvssv2\": { \n      \"\
  score\": 7.5,\n    ...\n    ...\n    \"cwes\": [\n      \"CWE-539\"\n    ],\n  \
  \  ...\n    \"description\": \"Flask is a lightweight WSGI web application framework.\
  \ When all of the following conditions are met, a response containing data intended\
  \ for one client may be cached ... https://ossindex.sonatype.org/vulnerability/CVE-2023-30861\n\
  \    ...\n```\n\n如图 9.4 所示，访问浏览器中的 CVE URL 会进一步解释 Python Flask 框架中的某些配置如何被利用。dependency-check\
  \ 解析了 requirements.txt 文件以确定第三方依赖项的名称及其版本。然后它将这些依赖项与公开可用的漏洞数据库进行核对——在此案例中为 NVD。由于我们在应用程序中使用的版本被标记为潜在风险，因此被\
  \ dependency-check 工具指出。然而，在本例中，我们并未使用 cookie 或标头，因此可以安全地抑制该发现：\n\n## 漏洞\n\nCVE-2023-30861\n\
  \nCVSS Score\n7.5\nHIGH\n\nCVSS Vector\nCVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N\n\
  \nCWE\n\n[CVE-2023-30861] CWE-539: Information Exposure Through Persistent Cookies\n\
  \n## Description\n\nFlask is a lightweight WSGI web application framework. When\
  \ all of the following conditions are met, a response containing data intended for\
  \ one client may be cached and subsequently sent by the proxy to other clients.\
  \ If the proxy also caches `Set-Cookie`\nSee More\n\n> Deviation Notice:\n> Sonatype's\
  \ research suggests that this CVE's details differ from those defined at NVD or\
  \ other reporting sources; sign in for details.\n\nFigure 9.4 – CVE finding reported\
  \ by the dependency-check utility\n\n### Tip\n\n每次运行时，像 dependency-check 这样的工具都会从公共数据库下载所有\
  \ CVE 并在本地存储以供评估。由于 CodeBuild 环境是临时的，每次构建完成后都会导致信息丢失。这会导致每次运行的执行时间非常高（>5 分钟）。这可以通过利用\
  \ CodeBuild 构建缓存来优化，该缓存允许你标记需要保存并在后续构建运行中重用的目录。你可以在 https://docs.aws.amazon.com/codebuild/latest/userguide/build-caching.html\
  \ 上阅读有关此功能的更多信息。\n\n为了简单起见，我们假设我们对 CVSS 评分低于 8 的任何漏洞发现都不感兴趣。我们可以调整 CodeBuild 动作的相应\
  \ buildspec 文件并提交更改。为此，我们可以将 buildspecs/sca.yml 文件中的 CVSS 阈值修改为 8：\n\n```\n...\n\
  \  build:\n    on-failure: ABORT\n    commands:\n      - dependency-check --scan\
  \ \"${PWD}\" --enableExperimental --failOnCVSS 8 --format JSON\n...\n...\n```\n\n\
  默认情况下，该工具会在命令执行完成后转储一份报告文件。除了 JSON 之外，还支持多种其他格式，可以自动解析以构建你想要在其之上进行的任何额外自动化。进行这些更改后，你可以将新的更新推送到托管在\
  \ AWS 上的存储库：\n\n```\naws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app\
  \ $\ngit commit -am \"Increased threshold for CVSS score in SCA check\"\n[master\
  \ 73db6e9] Increased threshold for CVSS score in SCA check\n 1 file changed, 1 insertion(+),\
  \ 1 deletion(-)\n\naws-devops-simplified:~/environment/chapter-9/chapter-9-flask-app\
  \ $\ngit push origin master\nEnumerating objects: 7, done.\n...\n...\n   0032123..73db6e9\
  \  master -> master\n```\n\n接下来，我们可以继续查看 SAST 阶段的输出。\n\n## 使用 Bandit 进行静态应用程序安全测试\n\
  \n**Bandit** 是用于测试 Python 代码中安全问题的著名 SAST 工具。这是我们管道中 ApplicationValidation 阶段的第二个动作，与之前讨论的\
  \ SCA 并行执行。\n\n我们在这里也收到一个错误报告。看起来是指 Python 中异常处理的不当使用：\n\n```\n>> Issue: [B110:try_except_pass]\
  \ Try, Except, Pass detected.\n   Severity: Low   Confidence: High\n   CWE: CWE-703\n\
  \n      More Info: https://bandit.readthedocs.io/en/1.7.5/plugins/b110_try_except_pass.html\n\
  \   Location: app.py:35:8\n34              return redirect(url_for('todos'))\n35\
  \              except Exception as e:\n36                  pass\n```\n\n此代码的问题在于我们捕获了所有异常并静默忽略它们。这代表了潜在的安全风险，因为来自服务的大量错误可能暗示有人试图干扰应用程序。即使我们不想以特定方式处理异常，我们也至少应该记录失败消息，而不是仅用\
  \ pass 抑制它。\n\n让我们用 logger 语句替换 app.py 中有问题的代码行并再次提交更改：\n\n```\n```python\n...\n\
  \    return redirect(url_for('todos'))\nexcept Exception as e:\n    logging.error(\"\
  Exception occurred while submitting data to MongoDB\", exc_info=True)\n...\n```\n\
  ```\n\n现在我们已修复此安全风险，管道中必须配置的最后一个验证检查涉及将 Dockerfile 的潜在风险或问题暴露出来。\n\n## 使用 hadolint\
  \ 验证 Dockerfile 清单\n\n除了 lint Docker 文件外，**hadolint** 还通过 *shellcheck* 实用程序执行 bash\
  \ 代码验证。如果你喜欢为日常操作程序编写 bash 脚本，我强烈推荐使用 **shellcheck**，如果你还没有使用的话。\n\n在 CodePipeline\
  \ 执行的 `PlatformValidation` 阶段下，你会注意到一些需要修复的错误。让我们看一下：\n\n```\n...\n...\nDockerfile:10\
  \ DL3018 warning: Pin versions in apk add. Instead of `apk add <package>` use `apk\
  \ add <package>=<version>`\nDockerfile:22 DL3059 info: Multiple consecutive `RUN`\
  \ instructions. Consider consolidation.\nDockerfile:24 DL3020 error: Use COPY instead\
  \ of ADD for files and folders\nDockerfile:29 DL3042 warning: Avoid use of cache\
  \ directory with pip. Use `pip install --no-cache-dir <package>`\nDockerfile:29\
  \ DL3013 warning: Pin versions in pip. Instead of `pip install <package>` use `pip\
  \ install <package>==<version>` or `pip install --requirement <requirements file>`\n\
  ...\n...\n```\n\n其中一些是优化 Dockerfile 层结构的优化机会，而其他要求固定库特定版本的要求则具有一定的安全优势。\n\n始终建议避免安装时的缓存目录并使用库的最新版本。这也违背了不可变性的思想，因为当新版本的库发布时，你可能会无意中使用与测试时不同的库版本。这可能会引入潜在的安全风险，如果最新软件包中引入了新的漏洞。\n\
  \n为修复报告的错误，我们可以在 Dockerfile 中进行以下修改：\n\n```\n```dockerfile\n## Install packages\n\
  RUN apk update && apk add --update --no-cache \\\n    bash=5.2.15-r0 \\\n    python3=3.10.11-r0\
  \ \\\n    py3-pip=22.3.1-r1 \\\n    py3-cryptography=38.0.3-r1 \\\n    vim=9.0.0999-r0\
  \ \\\n    wget=1.21.4-r0 \\\n    curl=8.1.1-r0 \\\n    tree=2.0.4-r0\n\nRUN apk\
  \ --no-cache add --virtual \\\\\n    builds-deps=20230523.220926 \\\\\n    build-base=0.5-r3\
  \ && \\\\\n    mkdir /opt/aws-devops-simplified\n...\n...\n```\n```\n\n在固定了库版本并合并了\
  \ RUN 命令后，我们现在遵循了 hadolint 实用程序推荐的最佳实践。\n\n一旦所有这些更改都提交回 CodeCommit 仓库，我们应该会有一个成功的\
  \ CodePipeline 运行，该运行构建 Docker 镜像并将其推送到我们在 CDK 堆栈中创建的 ECR 注册表中。\n\n## 总结\n\n在当今的软件环境中，安全性对于金融、社交媒体和电子商务行业至关重要，但对所有行业都至关重要。随着软件实践的演进和云采用的增加，现代应用程序的复杂性和风险显著增加。这些风险通常超出开发团队的控制范围，可能造成严重后果，包括声誉受损、信息丢失和客户信任丧失。DevSecOps\
  \ 是一个有助于我们在确保开发者、运维和安全团队成员之间更多协作的同时解决这些需求的重要概念。\n\n我们从介绍 DevSecOps 是什么及其优势开始这一章。与\
  \ DevOps 类似，它不仅仅是技术优化，也提倡开发者、运维和安全之间的共同责任。这确保了应用程序可能面临的任何新风险都能尽快得到缓解。在了解了不同测试方法的一些实践方法后，我们还进行了一次动手部署，以在\
  \ CI/CD 管道中体验 DevSecOps 工具。我们主要使用开源工具，因为它们在这个领域已经非常成熟，很容易找到合适的工具组合，而无需承诺更广泛范围的服务或解决方案。\n\
  \n\n\n\n\n在下一章《成功组建团队》中，我们将介绍一些促进协作、学习和成长的理念。我们还将重点讨论无指责反馈文化的好处。\n\n## 延伸阅读\n\n\
  若要详细了解本章涵盖的主题，请参阅以下资源：\n\n- 常见的云安全问题和威胁：https://www.strongdm.com/blog/cloud-security-issues-risks\n\
  - 面向构建者的威胁建模工作坊：https://catalog.workshops.aws/threatmodel/en-US\n"
- '# 第 4 部分


  ## 迈出下一步


  本部分聚焦于从文化和技术的角度成功组建团队。它深入探讨了随着 AWS 的日益普及，企业面临的典型问题，并提供了实用的解决技巧，同时增强团队协作、优化开发者流程。你将了解一些持续改进和遵循
  AWS Well-Architected Framework 的策略。通过着陆区（landing zones）的概念，我们还将向你介绍一些开源解决方案和框架。这些框架可以与
  AWS 服务（如 Control Tower）结合使用，以提高多账户、多区域环境的合规性和安全性。


  本部分包含以下章节：


  - 第 10 章，成功组建团队

  - 第 11 章，确保多账户和多区域环境拥有强大的 AWS 基础

  - 第 12 章，遵循 AWS Well-Architected 原则

