  \ PDU> <non-flush flag> <LSTO> <inquiry TX power> <EPC>\n  <extended features>\n\
  ```\n\n## 蓝牙测距器\n\nBlueranger 是一个小型程序/脚本，可通过测试 l2cap ping 来帮助定位蓝牙设备距离你的设备有多远。它测量\
  \ ping 的链路质量，以帮助确定它认为蓝牙设备距离你的传感器有多远。在选项方面它非常简单。你只需要将你的蓝牙接口以及设备地址（MAC 地址）传递给它：\n\n\
  ```\nroot@pi-kali:~# blueranger.sh\nBlueRanger 1.0 by JP Dunning (.ronin)\n<www.hackfromacave.com>\n\
  (c) 2009-2012 Shadow Cave LLC.\nNAME\nblueranger\nSYNOPSIS\nblueranger.sh <hciX>\
  \ <bdaddr>\nDESCRIPTION\n<hciX>      Local interface\n<bdaddr>    Remote Device\
  \ Address\n```\n\n由于你需要知道远程设备地址，我通常会将此程序与 bluelog 配合运行。有了 bluelog，我可以看到所有设备。让我们看下面的示例：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_177_0.png)\n\n根据 bluelog 的发现，我会将找到的每个设备都输入到\
  \ blueranger 中，以查看它们是否彼此靠近或其中一个更远。第一个设备是 iPhone。我可以看到底部的 ping 计数和范围刻度，其中左侧正好在传感器旁边，右侧则是它能读取的最远距离。因此根据该设备的读数，iPhone\
  \ 相对于传感器来说比较接近：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_177_1.png)\n\n接下来，我将在\
  \ SRS-BTM8 设备上运行它。这里我也可以看到 ping 计数。但请注意，链路质量较低，因此范围图更处于图表中间。因此，我可以由此确定手机靠近传感器，而\
  \ SRS-BTM8 设备确实更远：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_178_0.png)\n\n再次强调，此工具的目的是根据测量的链路质量帮助定位通过扫描找到的任何蓝牙设备。显然，其他因素会影响链路质量；但在我的测试中，blueranger\
  \ 还是相当准确的。\n\n## 使用 Hcitool 扫描\n\nHcitool 是一个很棒的内置蓝牙连接配置工具。你可以运行很多快速的小命令来获取一些关于你找到的蓝牙设备的信息，从而帮助你获得更多关于它的信息。hcitool\
  \ 有趣的地方在于它做了一些需要我们之前讨论过的多个工具才能完成的事情。正因为如此，它可以简化蓝牙设备的调查。命令结构简化，但具有许多命令选项，这使其非常有用：\n\
  \n```\nroot@pi-kali:~# hcitool\nhcitool - HCI Tool ver 5.43\nUsage:      hcitool\
  \ [options] <command> [command parameters]\nOptions:\n--help Display help\n-i dev\
  \ HCI device\n```\n\n至于命令选项，有很多，取决于你想要查找的内容。我建议查看 man 手册或 --help 以查看完整列表。列表相当长，这体现了其强大功能。\n\
  \n现在，让我们测试其中一些命令。首先，hcitool 可以进行扫描。然而，与 bluelog 不同，它并不是为了长时间运行而设计的，比如守护进程模式。但不管怎样，它确实会显示附近发现了什么。如以下代码所示，这是我在实验室中发现的内容。\n\
  \n```\nroot@pi-kali:~# hcitool -i hci0 scan\nScanning ...        48:3B:38:EB:5D:9F\
  \      Powerbeats Wireless\n8C:DE:52:1F:F5:07      SRS-BTM8\n```\n\n现在，如果我想获取其中一项的更多信息，我可以传递\
  \ info 命令：\n\n```\nroot@pi-kali:~# hcitool -i hci0 info 48:3B:38:EB:5D:9F\nRequesting\
  \ information ...\n        BD Address:  48:3B:38:EB:5D:9F\n        OUI Company:\
  \ Apple, Inc. (48-3B-38)\n        Device Name: Powerbeats Wireless\n        LMP\
  \ Version: 4.0 (0x06) LMP Subversion: 0x2576\n        Manufacturer: Cambridge Silicon\
  \ Radio (10)\n        Features page 0: 0xff 0xff 0x8f 0xfe 0xdb 0xff 0x5b 0x87\n\
  \                <3-slot packets> <5-slot packets> <encryption> <slot offset>\n\
  \                <timing accuracy> <role switch> <hold mode> <sniff mode>\n    \
  \            <park state> <RSSI> <channel quality> <SCO link> <HV2 packets>\n  \
  \              <HV3 packets> <u-law log> <A-law log> <CVSD> <paging scheme>\n  \
  \              <power control> <transparent SCO> <broadcast encrypt>\n         \
  \       <EDR ACL 2 Mbps> <EDR ACL 3 Mbps> <enhanced iscan>\n                <interlaced\
  \ iscan> <interlaced pscan> <inquiry with RSSI>\n                <extended SCO>\
  \ <EV4 packets> <EV5 packets> <AFH cap. slave>\n                <AFH class. slave>\
  \ <LE support> <3-slot EDR ACL>\n                <5-slot EDR ACL> <sniff subrating>\
  \ <pause encryption>\n                <AFH cap. master> <AFH class. master> <EDR\
  \ eSCO 2 Mbps>\n                <EDR eSCO 3 Mbps> <3-slot EDR eSCO> <extended inquiry>\n\
  \                <LE and BR/EDR> <simple pairing> <encapsulated PDU>\n         \
  \       <non-flush flag> <LSTO> <inquiry TX power> <EPC>\n                <extended\
  \ features>\n        Features page 1: 0x03 0x00 0x00 0x00 0x00 0x00 0x00 0x00\n\
  ```\n\n我还喜欢做的是检查设备的 RSSI 和功率水平。再次与 blueranger 类似，它会给我一个关于设备有多近的某种概念。但运行这些命令确实需要我连接到设备。这是通过\
  \ rfcomm 命令完成的。一旦我运行它，我就可以查询设备：\n\n```\nroot@pi-kali:~# sudo rfcomm connect 0 8C:DE:52:1F:F5:07\
  \ 10 >/dev/null&\n```\n\n现在我已连接，我将使用 rssi 命令检查 RSSI，使用 lq 命令检查链路质量，以及使用 tpl 命令检查功率水平。以下是两个命令的输出：\n\
  \n```\nroot@pi-kali:~# hcitool -i hci0 rssi 8C:DE:52:1F:F5:07\nRSSI return value:\
  \ -2\nroot@pi-kali:~# hcitool -i hci0 lq 8C:DE:52:1F:F5:07\nLink quality: 252\n\
  root@pi-kali:~# hcitool -i hci0 tpl 8C:DE:52:1F:F5:07\nCurrent transmit power level:\
  \ 4\n```\n\n这些只是使用 hcitool 的一些示例。这是我蓝牙研究中使用的一个很棒的小工具。\n\n## 物理安全注意事项\n\n尽管我在谈论网络基础设施，但我不能不谈论需要进行的物理安全测试。想想看，你可以拥有所需的所有防火墙、IPS\
  \ 设备、VLAN 分段，但如果有人可以直接进入数据中心，关闭服务器，拆下机架并离开，那么这些设备根本帮不上忙。这就是为什么像 PCI 这样的重要安全标准也要求进行物理安全测试。\n\
  \n物理安全测试不如攻击网络基础设施那样令人兴奋，但在保护你的基础设施方面同样重要。以下是你需要测试的一些主要物理安全要点。\n\n\n\n## 安全访问\n\
  安全访问是物理安全的基石。任何不被视为公共空间的区域，都应有机制根据职位角色限制对该区域的访问。该机制可以是某种门禁卡或徽章读卡器、生物识别设备，或它们的组合。根据职位角色限制访问的能力对于防止未经授权访问某人本不应接触的信息至关重要。\n\
  \n渗透测试员的工作是走遍设施，查看你能够进入和不能进入的房间和区域。记录所有发现。但不要止步于此。与其他员工交朋友，尤其是那些能进入你无法进入的场所的人。测试他们是否会允许你跟随进入而无需扫描你的徽章或生物识别信息。此类行为应被记录并报告。员工绝不应让他人尾随进入。这应作为公司安全政策中的书面规定，员工应每年审查一次，以确保了解任何变更。\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_181_0.png)\n\n如果公司在某些访问点部署了双因素认证，也应使用他人的徽章和你的指纹或反之进行测试。这是一个确保系统正确联动而非仅作摆设的好方法。\n\
  \n## 员工/供应商识别\n这可能是最简单、最便宜却又强大的物理安全控制措施之一，应予以实施。确保建筑物内的每个人始终佩戴某种形式的徽章，并且能够轻松区分员工、承包商和访客。视觉标识至关重要，因为如果所有访客都佩戴红色徽章而员工佩戴白色徽章，并且你在安全区域注意到红色徽章，就知道应报告该人员。\n\
  \n对此的一个简单测试是走遍办公室，寻找任何违反政策的迹象。此过程包括寻找任何未佩戴正确身份标识的人。我会询问各种人员，以确保他们的徽章与其正确职能相符（即，他们是否确实是佩戴员工徽章的员工，是否拿了别人的徽章，或被发放了错误的类型？）。\n\
  \n下面的截图是员工与访客之间视觉差异的绝佳示例。\n\n## 总结\n我们现在完成了第7天，让我们回顾一下。确保基础设施得到保护对任何客户/公司都很重要，因此作为渗透测试员，找到可能存在的问题是我们的职责。我以各种用于执行有线网络攻击的工具开始了本章。这包括基于\
  \ SNMP 的问题以及 DHCP，然后转向基于 DOS 的攻击。然后我转向了无线攻击。这些非常重要，因为无线攻击往往更容易执行，因为它们不需要像某些有线攻击那样进行物理网络连接。在无线方面，我展示了各种用于监控无线电波的工具，以及如何攻击无线弱点，例如\
  \ WPA、WEP，当然还有围绕无线的社会工程学。然后我提及了一些基于蓝牙的工具，用于监控渗透测试员正在测试的设施范围内可能存在的蓝牙设备。随着越来越多的蓝牙设备进入企业，无论好坏，在任何渗透测试中都应包含蓝牙。最后，我以一些应包含在渗透测试中的快速物理安全考虑事项结束了本章。物理安全与我们已讨论过的所有其他安全考虑一样重要，不应被忽视。我给出的这些示例是获得非常强大的物理安全状况的快速、简单且有效的方法。\n\
  \n在下一章，我将讨论 Web 应用程序攻击。Web 应用程序可能相当复杂，但由于它们经常暴露于外部世界，往往是黑客的目标。这就是为什么确保它们安全很重要。我将介绍一些用于测试\
  \ Web 应用程序各个方面的工具。这将包括会话管理、数据验证和错误处理等主题。\n"
- "## 8\n## Web 应用程序攻击\nWeb 应用程序为组织提供了一些最大的攻击面。由于有如此多的 Web 应用程序可公开用于提供服务，必须确保它们是安全的。每天有数百万用户使用这些应用程序并输入各种数据，如个人身份信息、信用卡信息、健康信息等，一旦\
  \ Web 应用程序被入侵，所有这些数据都将对黑客开放。\n\n尽管如此，Web 应用程序有很多 moving parts，因此对其进行渗透测试可能令人望而生畏。我列出了在对\
  \ Web 应用程序进行渗透测试时我会测试的几个不同部分，并在该类别中包含了各种测试工具。这些类别遵循 OWASP 的建议，作为渗透测试期间需要验证的一些重要部分。如果你不熟悉\
  \ OWASP，或开放 Web 应用程序安全项目，你可以在此处获取更多信息：https://www.owasp.org/index.php/Main_Page。最简单地说，他们是一个非营利组织，其唯一使命是让软件安全对所有人可见，以便个人能够理解它们，从而在\
  \ Web 应用程序周围做出更好的安全决策。OWASP 每隔几年就会发布一次前十名，以真正向应用程序开发人员展示 Web 应用程序的当前趋势和威胁。上一次发布是在\
  \ 2013 年，而今年 2017 年，新列表将在年内晚些时候发布。2017 年的拟议列表包括以下内容：\n- Injection\n- Broken authentication\
  \ and session management\n- XSS\n- Broken access control\n- Security misconfiguration\n\
  - Sensitive data exposure\n- Insufficient attack protection\n- Cross-site request\
  \ forgery\n- Using components with known vulnerabilities\n- Under protected APIs\n\
  \n我们将涵盖该列表中大多数攻击。我们在之前的章节中已经涵盖了一些项目，但我想获得一个良好的攻击类型和工具的混合，涵盖 Web 应用程序测试的各个方面。需要记住的一点是，该列表绝非详尽无遗。总是有其他攻击存在，并且这种情况在不断变化。跟上\
  \ OWASP 的建议始终是最佳实践。\n\n本章将讨论以下主题：\n- Manipulation by client-side testing\n- Infrastructure\
  \ and design weaknesses\n- Identity-based testing\n- Validating data, error handling\
  \ and logic\n- Session management\n\n### 客户端测试的操纵\n就 Web 应用程序而言，客户端测试是一个重要问题。不仅需要担心他人在客户端浏览器中执行代码的能力，还需要考虑这将如何影响\
  \ Web 服务器和应用程序。客户端测试涉及 XSS（跨站脚本）、JavaScript 执行和 WebSockets 等项目，仅举几例。\n\n客户端问题并非新事物，但随着为保护免受服务器端攻击而增加的关注和安全措施，黑客已转向客户端攻击。客户端攻击围绕基于浏览器的漏洞展开，这些漏洞源于未修补的浏览器或零日漏洞。利用\
  \ Web 应用程序，可以尝试攻击客户端机器，并在该客户端机器上获得立足点以做任何想做的事情。不仅客户端机器需要修补并拥有最新浏览器，而且 Web 应用程序程序员也必须确保他们以安全的方式编程\
  \ Web 应用程序，以防止这些攻击发生。\n\n以下工具针对这些问题，可以用来验证是否可以执行其中一些选项。我将在我的实验室中展示它们各自的示例，以及如何最大限度地利用它们。我还将解释这些攻击，以及为什么要保护免受其侵害。\n\
  \n\n\n## 跨站脚本攻击\n\n跨站脚本，或简称为 XSS，是一种 Web 应用程序漏洞，用户可以在其中注入将在客户端运行的脚本。这些脚本通常具有恶意性质，并在互联网上随处可见。它们通常发生在输入字段未对输入进行验证或正确编码的地方。当这种情况发生时，恶意用户可以向字段中输入脚本，并且在表单提交时，脚本将被运行。\n\
  \n通常存在两种 XSS 攻击分类，即存储型 XSS 攻击和反射型 XSS 攻击，我将在接下来的两个部分中进一步讨论这两种攻击。\n\n### 反射型 XSS\
  \ 攻击\n\n反射型 XSS 攻击发生在脚本被反射自 Web 服务器以便运行时。浏览器允许其运行，因为它认为该脚本来自受信任的服务器。它们通常通过诸如错误消息或搜索结果之类的内容从\
  \ Web 服务器反射出来。但从技术上讲，只要部分输入发送到 Web 服务器，它们就可以通过任何响应被反射回来。反射型 XSS 攻击，或非持久型 XSS 攻击，往往是最常见的\
  \ XSS 攻击。\n\n为了测试反射型 XSS 攻击，我将尝试向网站中的姓名字段插入一些代码，以便在按下提交按钮时，如果 XSS 攻击成功，代码将被运行。\n\
  \n首先，我将浏览到该站点并验证页面是否正常工作，然后查看 URL：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_185_0.png)\n\
  \n提交后，我可以看到它输出了姓名，并且也在 URL 中将其放在 name 变量之后：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_185_1.png)\n\
  \n让我看看是否可以创建一个警告弹出窗口。为此，我将以下内容输入到输入字段中：\n\n```html\n<script>alert(\"Your site is\
  \ not protecting against XSS! Please fix ASAP!!\")</script>\n```\n\n当我按下提交按钮时，我可以看到\
  \ URL 中包含我的脚本作为变量传递。我也可以看到 XSS 攻击成功了，因为我可以看到带有我指定的消息的警告弹出窗口：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_186_0.png)\n\
  \n### 存储型 XSS 攻击\n\n另一种跨站脚本攻击类型是存储型 XSS 攻击。对于这些攻击，脚本被注入到存储在目标服务器上的字段中。这些包括访客留言簿、消息论坛、访客日志或数据库等项目。受害者随后会检索信息以及脚本，然后恶意脚本将被运行。存储型\
  \ XSS，或持久型 XSS，通常并不常见，但也往往更具破坏性。\n\n为了尝试存储型 XSS 攻击，我将尝试查看表单的工作方式。我将填写表单并提交以验证一切正常工作：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_186_1.png)\n\n我可以看到消息已正确提交，因为我的消息现在作为有效条目显示在屏幕上：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_187_0.png)\n\n现在，让我看看是否可以将脚本插入表单以执行存储型\
  \ XSS 攻击。像之前的示例一样，我将尝试打印出带有消息的警告框。我将输入以下内容：\n\n```\n<script>alert(\"Bad Code\")</script>\n\
  ```\n\n一旦我点击“签名留言簿”，我可以看到弹出窗口显示了我的消息。这验证了该特定 Web 应用程序容易受到存储型跨站脚本攻击：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_187_1.png)\n\
  \n以下是带有我选择的文本的警告框：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_187_2.png)\n\n##\
  \ 使用 OWASP ZAP 查找会话问题\n\nOWASP ZAP 是一款出色的多用途工具，直接来自 OWASP，因此由具有深厚安全和 Web 应用程序背景的安全人员设计。它是查找\
  \ Web 应用程序中各种漏洞的绝佳渗透工具，因此任何从事 Web 应用程序测试的人都应将其纳入工具箱。OWASP ZAP 可以执行以下任务：\n\n- 对站点进行蜘蛛发现\n\
  - 充当代理\n- 主动和被动扫描\n- 修改请求和响应\n\n它是 Web 应用程序渗透工具的瑞士军刀，这只是它能做的事情的子集。\n\n在本次练习的实验室测试中，我将使用扫描功能查找任何与会话相关的信息/漏洞/问题。以下是我在实验室中采取的逐步操作。\n\
  \n- 1. 一旦我启动 OWASP ZAP，我会看到默认屏幕，此时不应有任何内容。OWASP ZAP 是一个非常强大的工具，可用于许多 Web 应用程序测试程序，但在我的示例中，我将使用它来扫描基于会话的漏洞，以便我可以利用其他工具检索和使用该会话信息。以下是呈现给我的默认屏幕：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_188_0.png)\n\n- 2. 然后我将输入要攻击的 URL。输入后，我将点击攻击按钮：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_189_0.png)\n\n- 3. 一旦我点击攻击，工具首先会对站点运行蜘蛛程序以将其全部列出。完成后，它将开始主动扫描。整个过程中它会显示进度条，显示扫描的进度。取决于站点的大小，此部分可能需要一些时间才能完成：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_189_1.png)\n\n- 4. 现在进入重点部分。然后你可以浏览到\
  \ Alerts 选项卡，查看 OWASP ZAP 在 Web 应用程序中发现的任何问题。如下面所示，发现了许多问题：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_189_2.png)\n\
  \n- 5. 我将重点关注 Cookie No HttpOnly Flag 以及 Web Browser XSS Protection Not Enabled。如果我深入研究其中每一个，我将能够找到包含这些问题的页面，以及如下截图所示的对问题的详细描述：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_190_0.png)\n\n## 基础设施和设计弱点\n\n许多人理解基础设施对坚固且安全的网络的重要性，但他们忽略了基础设施对\
  \ Web 应用程序也很重要的事实。设计不良的基础设施也可能导致 Web 应用程序中的安全问题。例如，如果你的 Web 服务器和数据库服务器位于完全相同的网络上，那么被攻破的\
  \ Web 服务器很可能会导致数据库服务器被攻破。\n\n就像基础设施设计一样，Web 应用程序的实际设计对于成功且安全的 Web 应用程序至关重要。因此，作为渗透测试人员，你希望确保\
  \ Web 应用程序安全，并且没有任何可能导致安全事件的设计缺陷。\n\n我将使用以下工具检查我的 Web 应用程序是否存在任何基础设施或设计弱点。\n\n###\
  \ Uniscan\n\nUniscan 是一款快速易用的漏洞扫描器，旨在检测远程文件包含、本地文件包含和远程命令执行漏洞。根据我的测试，它是一款功能强大的 Web\
  \ 应用程序扫描器，能够完成工作。它包含基于 CLI 的版本以及基于 GUI 的选项。我倾向于使用命令行版本，因此在下面的实验室示例中使用了此版本。\n\n运行\
  \ Uniscan 有几个 CLI 选项。在帮助指南底部，有几个示例可帮助你根据想要指定主机的方式进行指导，以及大量选项可根据你的最终目标打开某些检查。\n\n\
  ```\n###########################\n#### Uniscan project###\n#### http://uniscan.sourceforge.net/###\n\
  ###########################\nV. 6.3\nOPTIONS:\n    -h      help\n    -u      <url>\
  \ example: https://www.example.com/\n    -f      <file> list of url's\n    -b  \
  \    Uniscan go to background\n    -q      Enable Directory checks\n    -w     \
  \ Enable File checks\n    -e      Enable robots.txt and sitemap.xml check\n    -d\
  \      Enable Dynamic checks\n    -s      Enable Static checks\n    -r      Enable\
  \ Stress checks\n    -i      <dork> Bing search\n    -o      <dork> Google search\n\
  \    -g      Web fingerprint\n    -j      Server fingerprint\nusage:\n[1] perl ./uniscan.pl\
  \ -u http://www.example.com/ -qweds\n[2] perl ./uniscan.pl -f sites.txt -bqweds\n\
  [3] perl ./uniscan.pl -i uniscan\n[4] perl ./uniscan.pl -i \"ip:xxx.xxx.xxx.xxx\"\
  \n[5] perl ./uniscan.pl -o \"inurl:test\"\n[6] perl ./uniscan.pl -u https://www.example.com/\
  \ -r\n```\n\n\n\n我倾向于使用 -q，这将启用目录检查，-w 将启用文件扫描，-e 将启用 robots.txt 和 sitemap.xml 检查，-d\
  \ 将启用动态扫描，-s 将启用静态检查。\n\n这里是我在实验室中运行的命令，用于使用 Uniscan 检查目标 Web 应用程序中的任何漏洞：\n\n```\n\
  root@pi-kali:~# uniscan -u http://192.168.33.31/ -qweds\n```\n\n运行一小段时间后，发现了第一个问题，应用程序中存在可能的后门。显示的一个很好的信息是它列出了页面。这非常方便，因为我现在可以立即去修复那个特定问题：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_192_0.png)\n\n在 Web 应用程序中发现的 PHP 信息泄露信息：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_192_1.png)\n\n以下是发现 Web 应用程序中大量 SQL 注入攻击的部分：\n\
