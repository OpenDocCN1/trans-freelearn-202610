  compared to the default Kali image:


  命令与控制主机上的 SSH 设置也不是一个复杂的过程，并且与我们的现场设备非常相似。唯一真正的区别是 Raspberry Pi 的 Kali 镜像与默认 Kali
  镜像相比具有一些不同的默认操作/设置：


