  \ 1dbe561b891b2191d ba1a1d9972b1974 ef4ef50dfe62b7848ba0079395f4bd f19dfc75a0014c19bb34e9819290d31f\
  \ 44ae7425\n[*] None ZSK RSASHA1NSEC3SHA1 03010001d381989d9bcb77051b1420aa 3dc1a0efef367125f6a7a840a65e22\
  \ b75a4638 a55f0cb23f0a4f0aa2e1bf9f 2c612e9f0dc943b18076300db065706 f348710d7ad9d35e36650ec9879eff04\
  \ 69d3ec417fe17f71f e096126370530a5 a8b71a390d42a9c80aa3eb291974c2be b8cf4a18e5fb55fab91e1c503d1d34b6\
  \ 0bc3f04f\n[*] None KSK RSASHA1NSEC3SHA1 02ffffc335910d21b3de0e09922b90ab 0b3bf5867a9f0c64d1ff4f17d3024126\
  \ 2b446774 7f856eba9b9f78a6f675e 638c7db469a1ec539d508ba104afd2c bcb643ca93b44b8dd9f2783e75813517\
  \ cac2159b48d416bea d63c2b1b796c01e 94bcfbb4ee64a6d23b4ced7aa769dca6 7849a9fcd3e66589e27b2bbe983d996ef\
  \ 8c66521824e32ffce4160f69d5 9ac8d7 78ed1d9ecacbf0cc82e707723f2da06e 4b1606c72c6f0376df800f1183b8f0f1e\
  \ aca2fcb67ee4d55a78fbc2c3b04877373 ae18c66258569abdeb5e0d696457a5cf f3195eb2bab80969eb6d3a1dceba\
  \ f729 5f848703f5def0d2b73d32cd43142879 c335516e724 9179d665b69c29a1e42f0 4ef14b\n\
  ```\n\n## 检查 DNS BIND 版本\n\n能够看到 DNS 服务器运行的 BIND 版本会提供一些潜在的重要信息。许多 DNS 服务器设计为不会透露这些信息，或只透露有关其设置的通用信息。但仍有大量\
  \ BIND 实例在运行，它们可能会透露其运行的确切 BIND 版本。使用以下命令获取的版本，你可以将其与任何已知漏洞进行交叉引用，如果存在漏洞，你现在就有了潜在的入侵途径。\n\
  \n在以下示例中，我能够从一台公开可用的 DNS 服务器获取 BIND 服务器信息。我已更改名称以保护当事人：\n\n```\nroot@pi-kali:~#\
  \ host -c chaos -t txt version.bind DNS1.XXXX.NET\nUsing domain server:\nName: DNS1.XXXX.NET\n\
  Address: XXX.XXX.XXX.XXX#53\nAliases:\nversion.bind descriptive text \"9.3.6-P1-RedHat-9.3.6-16.P1.1.2012012401\"\
  \n```\n\n## 使用 Nmap 探测网络\n\nNmap 无疑是目前最优秀的渗透测试工具之一。它是一个网络映射实用程序，可为你希望发送到线路上的任何内容生成网络数据包。这正是它如此出色的原因。你可以生成自己选择的数据包，然后查看网络和系统如何响应它。但这种强大的功能也带来了一些复杂性。Nmap\
  \ 确实有一定的学习曲线。我将介绍我在实验室测试中使用的一些示例。请查看 Nmap 的主页面，因为有大量选项可供你使用。\n\n让我们看一些示例：\n\n```\n\
  nmap -v -A scanme.nmap.org\nnmap -v -sn 192.168.0.0/16 10.0.0.0/8\nnmap -v -iR 10000\
  \ -Pn -p 80\n```\n\n这里，我们还可以参考 https://nmap.org/book/man.html 主页面以获取更多选项和示例。\n\n\
  现在，让我们尝试一些真实世界的示例：\n\n```\nNmap -v -sS -sV -p0-65535 192.168.1.129\n```\n\n- 1.\
  \ 我们通常在想要查看网络上运行了什么时使用以下扫描：\n- 2. 现在，让我们逐个开关来分析这个示例。首先，使用 -v 增加详细程度。这将让我们更好地了解正在发生的事情。现在这不是必需的，有些人不用它，但你会喜欢它提供的额外信息。\n\
  - 3. 一旦你足够频繁地使用此命令，你就会知道发生了什么，如果你愿意，可以将其关闭。\n- 4. 接下来，我们将使用 -sS 进行 TCP SYN 扫描。使用\
  \ TCP 时有几个不同的选项。我倾向于使用 SYN 扫描，因为它比 connect 更快，而且通常不会像 connect 那样容易受到防火墙的影响。\n- 5.\
  \ 然后，我们将使用 -sV，它将探测以尝试确定这些端口上的服务和版本。\n- 6. 然后我们指定要测试的端口（ 0-65535）最后以我们使用的主机结束。\n\
  \n- 7. 当在我的实验室网络上运行时，我们将得到此输出。输出不仅显示打开了哪些端口，还尝试找出服务，在本例中为 Cisco Identity Services\
  \ Engine。\n\n```\nroot@kali:~# nmap -v -sS -sV -p0-65535 192.168.1.129\nStarting\
  \ Nmap 7.40 ( https://nmap.org ) at 2017-01-16 16:31 EST\nNSE: Loaded 40 scripts\
  \ for scanning.\nInitiating Ping Scan at 16:31\nScanning 192.168.1.129 [4 ports]\n\
  Completed Ping Scan at 16:31, 0.01s elapsed (1 total hosts)\nInitiating Parallel\
  \ DNS resolution of 1 host. at 16:31\nCompleted Parallel DNS resolution of 1 host.\
  \ at 16:31, 13.01s elapsed\nInitiating SYN Stealth Scan at 16:31\nScanning 192.168.1.129\
  \ [65536 ports]\nDiscovered open port 80/tcp on 192.168.1.129\nDiscovered open port\
  \ 22/tcp on 192.168.1.129\nDiscovered open port 443/tcp on 192.168.1.129\nSYN Stealth\
  \ Scan Timing: About 20.49% done; ETC: 16:33 (0:02:00 remaining)\nDiscovered open\
  \ port 8443/tcp on 192.168.1.129\nDiscovered open port 8910/tcp on 192.168.1.129\n\
  SYN Stealth Scan Timing: About 48.87% done; ETC: 16:33 (0:01:04 remaining)\nDiscovered\
  \ open port 8444/tcp on 192.168.1.129\nDiscovered open port 9090/tcp on 192.168.1.129\n\
  Discovered open port 8905/tcp on 192.168.1.129\nDiscovered open port 49/tcp on 192.168.1.129\n\
  Discovered open port 9002/tcp on 192.168.1.129\nDiscovered open port 5222/tcp on\
  \ 192.168.1.129\nCompleted SYN Stealth Scan at 16:33, 104.32s elapsed (65536 total\
  \ ports)\nInitiating Service scan at 16:33\nScanning 11 services on 192.168.1.129\n\
  Completed Service scan at 16:34, 98.19s elapsed (11 services on 1 host)\nNSE: Script\
  \ scanning 192.168.1.129.\nInitiating NSE at 16:34\nCompleted NSE at 16:35, 20.25s\
  \ elapsed\nInitiating NSE at 16:35\nCompleted NSE at 16:35, 0.04s elapsed\nNmap\
  \ scan report for 192.168.1.129\nHost is up (0.0049s latency).\nNot shown: 65521\
  \ filtered ports\n```\n\n| 端口 | 状态 | 服务 | 版本 |\n|------|-------|---------|---------|\n\
  | 22/tcp | 开放 | ssh | OpenSSH 6.6 (protocol 2.0) |\n| 49/tcp | 开放 | tcpwrapped |\
  \  |\n| 80/tcp | 开放 | http | Cisco Identity Services Engine |\n| 443/tcp | 开放 |\
  \ ssl/http | Cisco Identity Services Engine |\n| 1468/tcp | 关闭 | csdm |  |\n| 5222/tcp\
  \ | 开放 | xmpp-client? |  |\n| 6514/tcp | 关闭 | syslog-tls |  |\n| 8080/tcp | 关闭 |\
  \ http-proxy |  |\n| 8443/tcp | 开放 | ssl/http | Cisco Identity Services Engine admin\
  \ httpd |\n| 8444/tcp | 开放 | ssl/http | Cisco Identity Services Engine admin httpd\
  \ |\n| 8905/tcp | 开放 | ssl/unknown |  |\n| 8909/tcp | 关闭 | unknown |  |\n| 8910/tcp\
  \ | 开放 | ssl/manyone-http? |  |\n| 9002/tcp | 开放 | ssl/dynamid? |  |\n| 9090/tcp\
  \ | 开放 | http | Apache Tomcat/Coyote JSP engine 1.1 |\n\n\n\n\n我们也可以对 UDP 执行类似的测试，不过\
  \ UDP 扫描会花费很长时间。这是因为 UDP 是一种无连接协议，因此没有像 TCP 那样丢弃/关闭/重置连接的机制，所以 Nmap 需要发送多个数据包，只是为了确保没有其他原因导致没有收到响应。如果想要快速测试，可以通过调整计时器来操作，但要小心。如果加速太多，你可能会遗漏某些内容。\n\
  \n这里是我对 UDP 的扫描，以查看此主机开放了什么：\n\n```\nroot@kali:~# nmap -sU --min-rate 5000 192.168.1.129\n\
  Starting Nmap 7.40 ( https://nmap.org ) at 2017-01-29 19:55 EST\nNmap scan report\
  \ for 192.168.1.129\nHost is up (0.48s latency).\nNot shown: 997 open|filtered ports\n\
  PORT     STATE         SERVICE\n68/udp   closed        dhcpc\n161/udp  closed  \
  \      snmp\n162/udp  closed        snmptrap\n\nNmap done: 1 IP address (1 host\
  \ up) scanned in 21.95 seconds\n```\n\n除了之前执行的 TCP SYN 扫描和 UDP 扫描外，肯定还有大量其他类型的扫描。浏览主页面会列出所有不同的选项。每种扫描类型在显示内容方面都有其优势。\n\
  \n内置脚本引擎，或 NSE，将 Nmap 提升到全新水平。它允许你将社区脚本，甚至你自己的脚本作为命令的一部分使用。这样，你可以让这些脚本并行运行，并在输出中提供更多信息。让我们先看一个仅使用默认\
  \ Nmap 并定义参数的示例，然后再看一个启用脚本引擎的示例。\n\n以下是未启用脚本引擎的输出：\n\n```\nroot@pi-kali:~# nmap\
  \ -p22,80,443,8888 -T4 192.168.1.129\nStarting Nmap 7.40 ( https://nmap.org ) at\
  \ 2017-05-06 17:33 UTC\nNmap scan report for 192.168.1.129\nHost is up (0.00088s\
  \ latency).\nPORT      STATE      SERVICE\n22/tcp    open       ssh\n80/tcp    open\
  \       http\n443/tcp   open       https\n8888/tcp  filtered   sun-answerbook\n\
  Nmap done: 1 IP address (1 host up) scanned in 1.82 seconds\n```\n\n以下是启用脚本引擎的输出。你可以看到正在显示的额外信息：\n\
  \n```\nroot@pi-kali:~# nmap -sC -p22,80,443,8888 -T4 192.168.1.129\nStarting Nmap\
  \ 7.40 ( https://nmap.org ) at 2017-05-06 17:33 UTC\nNmap scan report for 192.168.1.129\n\
  Host is up (0.00084s latency).\nPORT STATE SERVICE\n22/tcp open ssh\n| ssh-hostkey:\n\
  |_ 2048 7e:4c:c1:4d:e6:53:68:45:5a:a5:53:f9:98:32:13:e5 (RSA)\n80/tcp open http\n\
  |_http-title: Did not follow redirect to https://192.168.1.129/admin/\n443/tcp open\
  \ https\n| http-title: Site doesn't have a title (text/html;charset=UTF-8).\n|_Requested\
  \ resource was /admin/login.jsp\n| ssl-cert: Subject:\ncommonName=ise.cryptomap65535.com/organizationName=IT/stateOrProvinceName=Pennsylvania/countryName=US\n\
  | Not valid before: 2016-10-12T20:17:05\n|_Not valid after: 2018-10-12T20:17:05\n\
  |_ssl-date: 2017-05-06T17:33:38+00:00; 0s from scanner time.\n8888/tcp filtered\
  \ sun-answerbook\nNmap done: 1 IP address (1 host up) scanned in 7.31 seconds\n\
  ```\n\n脚本引擎使用 -sC 标志激活。\n\n有了从 Nmap 接收到的所有信息，我在本次实验后面进行有针对性的利用和漏洞扫描时肯定处于良好状态。此外，有了一些返回的版本信息，我也可以精确定位这些产品。知道\
  \ Apache with Tomcat 与仅 Apache 之间的区别为我们提供了明确的优势。\n\n## 使用 NSE 检查 DNS 递归\n\nDNS 递归通常不是问题，但如果你允许外部主机使用你的内部\
  \ DNS 服务器进行递归，你就为潜在攻击埋下了隐患。DNS 放大攻击可以利用这类设置，黑客会使用这些 DNS 服务器向其发送伪造请求，而它们会将响应发送回原始主机，如果数量众多，就会造成\
  \ DDoS 情况。\n\n要检查 DNS 递归，我们可以使用 NSE 引擎的 Nmap。命令很简单，因为我们将在端口 53 上执行 UDP 扫描并使用命令 nmap\
  \ -sU -p53 -script=dns-recursion HOST 打开递归脚本。\n\n在此示例中，DNS 服务器设置正确，因为它们不允许 DNS 递归：\n\
  \n```\nroot@pi-kali:~# nmap -sU -p53 --script=dns-recursion NS.XXX.NET\nStarting\
  \ Nmap 7.40 ( https://nmap.org ) at 2017-05-06 18:24 UTC\nNmap scan report for NS.XXX.NET\
  \ (XXX.XXX.XXX.XXX)\nHost is up (0.096s latency).\nPORT STATE SERVICE\n53/udp open\
  \ domain\nNmap done: 1 IP address (1 host up) scanned in 3.06 seconds\n```\n\n接下来，此特定服务器允许递归发生，因此可能参与\
  \ DNS 放大攻击：\n\n```\nroot@pi-kali:~# nmap -sU -p53 --script=dns-recursion 1.xxx.xxx.xxx\n\
  Starting Nmap 7.40 ( https://nmap.org ) at 2017-05-06 18:24 UTC\nNmap scan report\
  \ for 1.xxx.xxx.xxx\nHost is up (0.27s latency).\nPORT STATE SERVICE\n53/udp open\
  \ domain\n|_dns-recursion: Recursion appears to be enabled\nNmap done: 1 IP address\
  \ (1 host up) scanned in 7.29 seconds\n```\n\n## 使用 P0f 进行系统指纹识别\n\nP0f 是一个很棒的小工具，可帮助根据\
  \ p0f 观察到的网络连接来识别或被动指纹识别另一系统。每个操作系统处理事物的方式略有不同，网络栈也存在细微差异。正因如此，p0f 通常可以确定主机机器的操作系统。这很有用，因为你可以记录所有主机的操作系统以供将来进行利用测试。\n\
  \nP0f 使用起来相当简单。它可以针对来自或发往你所在主机的实时流量运行，也可以将网络捕获输入其中以确定操作系统。以下是命令行参数的输出，以帮助确定你的使用方法：\n\
  \n```\nroot@kali:~# p0f -h\n--- p0f 3.09b by Michal Zalewski <lcamtuf@coredump.cx>\
  \ ---\n\np0f: invalid option -- 'h'\nUsage: p0f [ ...options... ] [ 'filter rule'\
  \ ]\n\nNetwork interface options:\n\n  -i iface   - listen on the specified network\
  \ interface\n  -r file    - read offline pcap data from a given file\n  -p     \
  \    - put the listening interface in promiscuous mode\n  -L         - list all\
  \ available interfaces\n\nOperating mode and output settings:\n\n  -f file    -\
  \ read fingerprint database from 'file' (/etc/p0f/p0f.fp)\n  -o file    - write\
  \ information to the specified log file\n  -s name    - answer to API queries at\
  \ a named unix socket\n  -u user    - switch to the specified unprivileged account\
  \ and chroot\n  -d         - fork into background (requires -o or -s)\n\nPerformance-related\
  \ options:\n\n  -S limit   - limit number of parallel API connections (20)\n  -t\
  \ c,h     - set connection / host cache age limits (30s,120m)\n  -m c,h     - cap\
  \ the number of active connections / hosts (1000,10000)\n\nOptional filter expressions\
  \ (man tcpdump) can be specified in the command line to prevent p0f from looking\
  \ at incidental network traffic.\n\nProblems? You can reach the author at <lcamtuf@coredump.cx>.\n\
  ```\n\n如果你想对网络上的主机运行测试，可以通过指定正确的接口以及任何过滤器来限制进入 p0f 的内容来运行 p0f。在我们的例子中，我将检查从此设备发出到\
  \ TCP 3389 的任何流量。我将通过指定本地要监视的接口来启动 p0f，然后使用过滤器。\n\n过滤器语法与 tcpdump 相同，因此在可能的情况下利用它们以防止\
  \ p0f 屏幕持续流式传输，尤其是在繁忙的设备上：\n\n```\nroot@kali:~# p0f -i eth0 'port 3389'\n--- p0f\
  \ 3.09b by Michal Zalewski <lcamtuf@coredump.cx> ---\n\n[+] Closed 1 file descriptor.\n\
  [+] Loaded 322 signatures from '/etc/p0f/p0f.fp'.\n[+] Intercepting traffic on interface\
  \ 'eth0'.\n[+] Custom filtering rule enabled: port 3389 [+VLAN]\n[+] Entered main\
  \ event loop.\n\n.-[ 192.168.33.27/34728 -> 192.168.33.29/3389 (syn) ]-\n| client\
  \ = 192.168.33.27/34728\n| os = Linux 2.2.x-3.x\n| dist = 0\n| params = generic\
  \ tos:0x04\n| raw_sig = 4:64+0:0:1460:mss*20,5:mss,sok,ts,nop,ws:df,id:+0\n`----\n\
  \n.-[ 192.168.33.27/34728 -> 192.168.33.29/3389 (mtu) ]-\n| client = 192.168.33.27/34728\n\
  | link = Ethernet or modem\n| raw_mtu = 1500\n`----\n\n.-[ 192.168.33.27/34728 ->\
  \ 192.168.33.29/3389 (syn+ack) ]-\n| server = 192.168.33.29/3389\n| os = Windows\
  \ 7 or 8\n| dist = 0\n| params = none\n| raw_sig = 4:128+0:0:1460:8192,8:mss,nop,ws,sok,ts:df,id:+0\n\
  `----\n```\n\n根据屏幕截图，你可以看到它正确识别了连接的源和目标。由于厂商可能不会更改某些栈的编程方式，因此你并不总是能获得操作系统的确切版本。你可以看到，在我在实验室中执行的先前示例中，目标主机被识别为\
  \ Windows 7 或 Windows 8 主机。即使指纹不完全精确，你也可以将该信息用于后续的进一步利用。\n\n\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_49_0.png)\n\
  \n使用 tcpdump 风格的过滤器在渗透测试主机上同时运行多个工具时非常重要。例如，如果你正在运行 Nmap 来查看哪些端口开放，然后将其中一些结果交给 p0f\
  \ 进一步检查，你可能会捕获到不仅是你想看到的 p0f 流量，还有持续的 Nmap。我的建议是只要可能就始终使用过滤器，以防止多个测试汇聚到 p0f 屏幕中。\n\
  \n现在，如果你不想测试实时流量，而是想查看过去记录的实时对话中有哪些主机在通信怎么办？完全没问题。通过指定 -r 以及文件名，你可以将文件导入 p0f 并查看识别出的操作系统。\n\
  \n在我的实验室环境中，我从我的 OS X 主机发起了一个到网络上另一台主机的 ssh 连接。你可以看到 p0f 正确识别了我的 OS X 主机。此外，进一步向下，它将目标机器识别为\
  \ Linux 主机：\n\n```\nroot@kali:~# p0f -r ssh.pcap\n--- p0f 3.09b by Michal Zalewski\
  \ <lcamtuf@coredump.cx> ---\n\n[+] Closed 1 file descriptor.\n[+] Loaded 322 signatures\
  \ from '/etc/p0f/p0f.fp'.\n[+] Will read pcap data from file 'ssh.pcap'.\n[+] Default\
  \ packet filtering configured [+VLAN].\n[+] Processing capture data.\n\n.-[ 192.168.33.3/54332\
  \ -> 192.168.33.27/22 (syn) ]-\n| client = 192.168.33.3/54332\n| os = Mac OS X\n\
  | dist = 0\n| params = generic\n| raw_sig = 4:64+0:0:1460:65535,5:mss,nop,ws,nop,nop,ts,sok,eol+1:df,id:+0\n\
  |____\n```\n\n如示例所示，使用 p0f 读取流量（实时和记录的）可以帮助进一步识别你可能尚不了解的机器操作系统。再一次，这展示了在渗透测试工具箱中使用\
  \ p0f 的强大功能。\n\n## 使用 Firewalk 进行防火墙侦察\n\nFirewalk 是一种主动侦察网络扫描器，可帮助确定我们的路由器或防火墙会放行或拒绝哪些第\
  \ 4 层协议。这是一个很好的工具，通过利用网络设备中不良或缺失的 ACL 来找到穿透环境的途径。Firewalk 利用 ICMP 错误消息和 TTL 过期来告知我们端口是否开放或不开放，与\
  \ traceroute 非常相似。如果端口被打开或允许，目标端口的数据包通常会被安全设备静默丢弃。但是，如果端口关闭，数据包的 TTL 将在下一跳过期并发出\
  \ ICMP_TIME_EXCEEDED 错误消息。\n\nFirewalk 是一个两阶段命令。第一阶段称为 hop ramping 阶段。其唯一工作是找到到目标网关的正确跳数，以便为下一阶段锁定正确的\
  \ TTL（跳数 + 1）。第二阶段涉及从该点开始并使用 CLI 选项中指定的端口对该 metric 主机进行端口扫描。\n\n初次使用 firewalk 时，参数可能有点令人困惑。以下是命令的屏幕输出：\n\
  \n```\nroot@kali:~# firewalk\nFirewalk 5.0 [gateway ACL scanner]\nUsage : firewalk\
  \ [options] target_gateway metric\n    [-d 0 - 65535] destination port to use (ramping\
  \ phase)\n    [-h] program help\n    [-i device] interface\n    [-n] do not resolve\
  \ IP addresses into hostnames\n    [-p TCP | UDP] firewalk protocol\n    [-r] strict\
  \ RFC adherence\n    [-S x - y, z] port range to scan\n    [-s 0 - 65535] source\
  \ port\n    [-T 1 - 1000] packet read timeout in ms\n    [-t 1 - 25] IP time to\
  \ live\n    [-v] program version\n    [-x 1 - 8] expire vector\n```\n\n与 Nmap 等其他工具相比，选项数量并不多，这是一件好事。从技术上讲，我们只需要指定\
  \ `target_gateway` 和 metric 即可使 Firewalk 工作。`target_gateway` 指的是我想要检查 ACL 或访问的网关/防火墙/安全设备的\
  \ IP 地址。metric 只是指位于该 `target_gateway` 地址之后或后面的某个 IP 地址。该 IP 地址甚至不需要位于该 `target_gateway`\
  \ 的下一跳内，或可达，或甚至在下一个网络中。该 IP 地址只有一个工作，那就是让 Firewalk 尝试向其发送流量以验证 `target_gateway`\
  \ 是否允许数据包通过它。它从技术上讲永远不会到达那里，因为 TTL 将在下一跳过期，因此会引发 `ICMP_TIME_EXCEEDED`。\n\n以下是一些我如何利用\
  \ `firewalk` 命令检查到目标 `192.168.30.250` 的几个知名端口的示例。我们想要进行侦察的主机是主机 `192.168.1.1`，它恰好是一个安全设备。在\
  \ CLI 命令中，我们还指定了源端口和目标端口以及使用 `-S` 开关的端口范围。\n\n在以下输出中，你将看到两个阶段的运行。在第一阶段，你将通过看到第一个\
  \ TTL 过期来看到 `hop ramping`。在此示例中，该第一跳为 `192.168.1.1`。在下一跳，第一阶段现在已绑定，因此第二阶段可以开始。使用第二阶段，我们在\
  \ CLI 中指定的那些知名端口现在正在被测试。结果显示端口 `22`（ssh）和 `5900`（VNC）是开放的。我们可以将此信息用于未来的渗透测试。\n\n\
  ![](img/095df2cd1930baecbcecaa51ee3417aa_51_0.png)\n\n需要注意的是，一些安全设备不会递减 TTL。如果是这种情况，我们可能无法获得该设备的跳数或测试甚至可能失败，因为\
  \ Firewalk 认为它在同一网络上。如果是这样，你将看到一条错误消息，提示 metric 在目标之前响应。\n\n## 信息收集\n\n如果在内部进行测试，你可能有选项可以关闭某些防火墙上的该功能，如果你愿意的话：\n\
