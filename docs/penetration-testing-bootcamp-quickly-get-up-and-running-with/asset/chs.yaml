  \ 在此任务中，我们将查看需要调查的各种类型的信息，以及在哪里寻找更多信息。 我们不能总是依赖利益相关者的文档是正确的，甚至可能存在他们甚至不知道的未记录系统。\
  \ 找到这些系统是我们的任务。 我们将使用各种工具来获取这些信息，以便帮助我们了解现有的安全性和系统，从而知道稍后从哪里开始渗透测试。\n\n## 2\n\n\
  ## Information Gathering\n\n有了从范围界定会议收到的所有信息，现在是时候不仅验证这些信息，而且通过你自己的信息收集研究尽可能多地了解。\
  \ 目标是在开始扫描漏洞并利用它们之前，尽可能多地了解网络和系统。\n\n在本章中，你将学习使用各种工具来开始绘制网络和系统的地图，然后枚举你的发现。 从此阶段获得的信息越多，找到漏洞和利用就越容易。\
  \ 这一步可以在实验室中为你节省大量时间。 例如，如果你了解到 Web 服务器是 Microsoft Windows 2012 服务器，你就可以利用此信息更好地了解如何进行利用阶段。\
  \ 如果没有这些信息，你可能会尝试对该服务器进行大量利用，但它们不会起作用，因为它们不是针对 Windows 2012 服务器的。\n\n话虽如此，在找到你想要进一步探测的系统后，总是会有快速通过此阶段的诱惑。\
  \ 你必须不惜一切代价抵制这种行为。 你必须在分配的渗透测试时间中花费相当一部分时间在此阶段。 在此花费的实际时间将取决于整体参与时间。 我不能强调这一点足够；\
  \ 这可能是整个渗透测试中最重要的阶段。 你花费的时间越多来了解环境和目标，你在渗透测试的其他阶段浪费的时间就越少。\n\n在本章中，我们将讨论以下主题：\n\n\
  - 工具箱中的各种工具\n- Whois、dnsmap 和 DNSRecon\n- Nmap\n- P0f\n- Firewall Dotdotpwn\n\n\
  ## Understanding the current environment\n\n在跳入用于绘制网络、安全性和系统地图的各种工具之前，回顾你可能作为利益相关者会议的一部分收到的当前文档是一种良好的做法。\
  \ 同时，你希望采访组织内的各个团队，以获取有关拓扑的背景信息，在你自己发现之前。 如果你已经有一个定义的布局，渗透测试员的工作肯定会更容易，而不是花费数天进行探测和映射只是为了达到这一点。\n\
  \n以下是一些我倾向于交谈的团队。 你选择的团队最终将取决于组织以及渗透测试的范围：\n\n- **网络团队**：采访网络团队以更好地了解当前网络拓扑、当前使用的网络设备、使用的网络供应商以及任何有助于你了解网络的其他信息。\n\
  - **系统管理员**：与系统管理员交谈将帮助你了解现有的各种操作系统以及服务器角色、应用程序和应用程序之间的数据流。 当谈到查看应用程序层和可能存在的漏洞时，这些信息是无价的。\n\
  - **安全团队**：这一个对我来说意义重大。 了解网络中使用的当前安全设备是真正了解拓扑的关键。 防火墙和设备可能会隐藏网络的部分，因此了解它们存在的位置和原因将帮助你布置网络和任何潜在目标。\
  \ 此外，了解公司的安全策略，例如修补管理策略、密码策略和端点策略，肯定会帮助你为未来的工具确定目标。\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_32_0.png)\n\
  \n前面的列表仅代表在跳入探测和映射工具之前需要交谈的团队的一小部分。 你能交谈的人越多，能获得的信息越多，渗透测试成功的可能性就越大。 其中一个主要原因是严格由于你将通过深入细节而节省的时间，而不会浪费太多时间只是绘制地图。\n\
  \n## Where to look for information – checking out the toolbox!\n\n现在我们已经讨论了信息收集阶段为何如此重要，让我们深入了解一些用于获取各种类型信息的工具。\
  \ 你可能很快会注意到的一件事是，有很多工具和方法可以从环境中获得更多情报。 第二件事是这些工具及其各自的功能和输出有很多重叠。 这是一件好事，因为随着经验的积累，每位渗透测试员都会学会他们最喜欢使用的工具、他们认为最有益的工具以及他们想要避免的工具。\n\
  \n以下是我在实验室环境中以及现实世界中使用过的工具，以发现我正在运行渗透测试的网络上到底有什么。\n\n## Search engines as an information\
  \ source\n\n搜索引擎为我们提供了回答任何问题的手段。 诸如 Google、Yahoo! 或 Bing 等工具使我们能够随时找到任何问题的答案。 但这些工具对于为我们计划运行渗透测试的公司或环境提供信息也非常强大。\
  \ 通过各种搜索，你可以查看环境的各种图像，这可以帮助你布置任何物理安全测试。 你还可以找到可能泄露了环境某些敏感信息的 Google dorks。 Google\
  \ dorking 在信息收集阶段非常流行。\n\n类似于 Google，Shodan 已成为任何 Internet 连接设备的首选搜索引擎。 该搜索引擎对于暴露和泄露环境中各种各样的信息具有巨大的可能性。\
  \ 浏览该网站可以为你提供有关连接到 Internet 的网络摄像头的\n\n## 利用 whois 进行信息收集\n\n当域名注册时，必须输入一些特定的联系信息。你可以选择公开显示这些信息，或支付费用将其隐藏，以免他人看到这些个人信息。其中包括姓名、物理地址、电子邮件地址和电话号码等项目。除了联系信息外，还有其他相关信息，例如域名注册日期和分配的域名服务器。这些信息可能很有用。\n\
  \n对公司的域名使用 whois 可以让我们看到一些相关信息，例如谁维护 DNS 记录及其联系信息。利用注册日期可以知道域名可能何时到期，如果公司忘记续费，你也可以利用这些信息在到期时自行注册。过去这种情况曾发生在许多知名网站上。\n\
  \n以下是关于 google.com 域名信息的 whois 截图：\n\n```\nroot@kali:~# whois -H google.com\n\n\
  Whois Server Version 2.0\n\nDomain names in the .com and .net domains can now be\
  \ registered\nwith many different competing registrars. Go to http://www.internic.net\n\
  for detailed information.\n\nDomain Name: GOOGLE.COM\nRegistrar: MARKMONITOR INC.\n\
  Sponsoring Registrar IANA ID: 292\nWhois Server: whois.markmonitor.com\nReferral\
  \ URL: http://www.markmonitor.com\nName Server: NS1.GOOGLE.COM\nName Server: NS2.GOOGLE.COM\n\
  Name Server: NS3.GOOGLE.COM\nName Server: NS4.GOOGLE.COM\nStatus: clientDeleteProhibited\
  \ https://icann.org/epp#clientDeleteProhibited\nStatus: clientTransferProhibited\
  \ https://icann.org/epp#clientTransferProhibited\nStatus: clientUpdateProhibited\
  \ https://icann.org/epp#clientUpdateProhibited\nStatus: serverDeleteProhibited https://icann.org/epp#serverDeleteProhibited\n\
  Status: serverTransferProhibited https://icann.org/epp#serverTransferProhibited\n\
  Status: serverUpdateProhibited https://icann.org/epp#serverUpdateProhibited\nUpdated\
  \ Date: 20-jul-2011\nCreation Date: 15-sep-1997\nExpiration Date: 14-sep-2020\n\n\
  >>> Last update of whois database: Sun, 15 Jan 2017 03:43:20 GMT <<<\n```\n\n以下是从\
  \ whois 屏幕中可以看到的联系信息：\n\n```\nRegistry Registrant ID:\nRegistrant Name: Dns Admin\n\
  Registrant Organization: Google Inc.\nRegistrant Street: Please contact contact-admin@google.com,\
  \ 1600 Amphitheatre Parkway\nRegistrant City: Mountain View\nRegistrant State/Province:\
  \ CA\nRegistrant Postal Code: 94043\nRegistrant Country: US\nRegistrant Phone: +1.6502530000\n\
  Registrant Phone Ext:\nRegistrant Fax: +1.6506188571\nRegistrant Fax Ext:\nRegistrant\
  \ Email: dns-admin@google.com\nRegistry Admin ID:\n```\n\n现在，你可以看到 whois 提供了一些很棒的信息。如果没有域名只有\
  \ IP 地址怎么办？没问题！whois 可以使用 IP 地址进行查询。事实上，这是我最喜欢使用 whois 的方式，因为它能提供有关公司的一些关键信息。例如，它会显示该\
  \ IP 所属的分配网络块以及公司的 AS 编号。接下来，我将向你展示如何使用这个 AS 编号。\n\n以下是使用 IP 地址进行 whois 查询的截图，可以看到它与查询域名时的结果大不相同。我运行了以下命令来获取输出：\n\
  \n```\nwhois -H 216.58.218.238\n```\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_36_0.png)\n\
  \n让我们回到之前找到的 AS 编号。我们现在可以取这个编号并查找分配给该公司（包括 IPv4 和 IPv6）的所有 IP 网络。这也可以通过 whois 和一些参数来实现，同时使用\
  \ Unix 管道和 grep 过滤输出。利用此工具是验证利益相关方所声称拥有的 IP 地址范围并获取额外攻击面的绝佳方式。我见过很多利益相关方忘记或不知道自己拥有的网络块的情况：\n\
  \n```\nroot@kali:~# whois -h whois.radb.net -- '-i origin AS36856' | grep route\n\
  route:       63.245.208.0/20\nroute:       63.245.223.0/24\nroute:       63.245.208.0/22\n\
  route:       63.245.221.0/24\nroute:       63.245.220.0/24\nroute:       63.245.214.0/23\n\
  route:       63.245.219.0/24\nroute:       63.245.208.0/20\nroute:       63.245.221.0/24\n\
  route:       63.245.214.0/23\nroute6:      2620:101:8001::/48\nroute6:      2620:101:8000::/40\n\
  route6:      2620:101:8000::/40\n```\n\n## 使用 dnsmap 枚举 DNS\n\ndnsmap 是一个非常棒的工具，可以在你正在查找的域名内发现子域名。这是可以查看是否存在其他可能已知或未知的公开站点（内部和/或外部）的绝佳方式。这使你有可能找到并利用未被正确控制或管理的子域名。你可以提供自己的词表来对照子域名进行查找，也可以直接使用内置的词表。有些组织会将部分子域名外包给第三方，因此在使用这些信息时需要谨慎。工作范围可能仅涵盖你受雇的公司；因此，如果你试图主动利用它，另一家组织可能不会对你持友好态度。这应该在利益相关方会议上确定，但有时事情还是会遗漏。以下是\
  \ dnsmap 命令行选项的截图：\n\n```\nroot@kali:~# dnsmap\ndnsmap 0.30 - DNS Network Mapper\
  \ by pagvac (gnucitizen.org)\n\nusage: dnsmap <target-domain> [options]\noptions:\n\
  -w <wordlist-file>\n-r <regular-results-file>\n-c <csv-results-file>\n-d <delay-millisecs>\n\
  -i <ips-to-ignore> (useful if you're obtaining false positives)\n\ne.g.:\ndnsmap\
  \ target-domain.foo\ndnsmap target-domain.foo -w yourwordlist.txt -r /tmp/domainbf_results.txt\n\
  dnsmap target-domain.foo -r /tmp/ -d 3000\ndnsmap target-domain.foo -r ./domainbf_results.txt\n\
  ```\n\n然后我们可以取正在查看的域名，在本例中为 https://www.mozilla.org，并查看可能存在哪些其他子域名。以下截图显示了针对 Mozilla.org\
  \ 运行 dnsmap 命令的输出：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_38_0.png)\n\n有了这些信息，我们现在可以开始探测过去可能不知道的额外\
  \ IP 地址/站点，这可以增加我们可操作的攻击/渗透测试面。目标越多，我们进入的机会就越大，并且能够将其包含在我们将交付的渗透测试报告中。\n\n## 使用\
  \ DNSRecon 进行 DNS 侦察\n\nDNSRecon 是一个方便的基于 DNS 的实用工具，可让你对 DNS 记录执行各种侦察操作。首先，你可以枚举所有不同类型的\
  \ DNS 记录，检查任何缓存条目，并检查区域传输，甚至可以枚举 Google 以获取额外的区域文件。\n\nDNSRecon 并不是一个复杂的工具，但它功能强大，可以节省你手动使用其他工具花费的大量时间。`dnsrecon`\
  \ 包有一些命令行选项，因此一定要查看主页面，看看在你的环境中哪些是相关的。我通常使用 `-g` 开关进行 Google 枚举。这可以找到引用我正在查找的主域名的额外子域名。这让我不必手动在\
  \ Google 上查找，从而节省了大量时间。这是可以自动化部分 `google-fu` 的绝佳方式，可以获得一些很棒的信息。\n\n以下是实验室中使用 `-g`\
  \ 开关的示例。你会注意到在命令的第一部分会给出标准信息。Google 枚举结果稍后出现。以下是通过 DNS 查找发现的一般枚举结果：\n\n```\nroot@kali:~#\
  \ dnsrecon -d cnn.com -g\n[*] Performing General Enumeration of Domain: cnn.com\n\
  [-] DNSSEC is not configured for cnn.com\n[*] SOA ns-47.awsdns-05.com 205.251.192.47\n\
  [*] NS ns-1086.awsdns-07.org 205.251.196.62\n[*] NS ns-1086.awsdns-07.org 2600:9000:5304:3e00::1\n\
