- "## 2\n\n## Information Gathering\n\n有了从范围界定会议收到的所有信息，现在是时候不仅验证这些信息，而且通过你自己的信息收集研究尽可能多地了解。\
  \ 目标是在开始扫描漏洞并利用它们之前，尽可能多地了解网络和系统。\n\n在本章中，你将学习使用各种工具来开始绘制网络和系统的地图，然后枚举你的发现。 从此阶段获得的信息越多，找到漏洞和利用就越容易。\
  \ 这一步可以在实验室中为你节省大量时间。 例如，如果你了解到 Web 服务器是 Microsoft Windows 2012 服务器，你就可以利用此信息更好地了解如何进行利用阶段。\
  \ 如果没有这些信息，你可能会尝试对该服务器进行大量利用，但它们不会起作用，因为它们不是针对 Windows 2012 服务器的。\n\n话虽如此，在找到你想要进一步探测的系统后，总是会有快速通过此阶段的诱惑。\
