  \n工具部分包含的内容完全由您决定。我倾向于保持简单，只列出工具、版本和简要描述。我见过为每个工具列出各种攻击场景的情况。无论如何，有此部分肯定有助于客户了解使用的工具和平台，以便他们可能进行复制。\n\
  \n## 附录 B - 附加报告\n\n本节旨在附加针对环境运行的任何报告结果。这些报告可以包括漏洞评估报告、Nmap 扫描报告和密码扫描。任何针对环境运行的扫描都应在此处包含。此外，如果适用，还包括基于扫描以外的项目的报告。例如，如果您使用\
  \ nipper-ng 进行配置审计，也请附加此报告。重点是附加您认为能为报告和利益相关者增加巨大价值的任何工具的报告。\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_242_0.png)\n\
  \n本节的一个极其重要的部分是使报告成为您自己的，即使您使用的是第三方工具。您希望向利益相关者展示价值，而直接提供由工具输出的报告不会显示出太多价值。他们可以安装相同的工具并运行相同的报告。我不知道有多少次我收到了来自安全专业人员的各种报告，他们甚至懒得这样做。让报告成为您自己的，并遵循从文档开始时设定的主题。使用相同的罐装报告可能会让利益相关者质疑您和报告的整体。\n\
  \n这是一个实验室渗透测试的示例报告。我对其中一个测试交换机运行了 nipper 报告。现在，在真实报告中，我会将输出报告数据合并到我的标准格式中，但在这里我想展示附加报告的选项：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_242_1.png)\n\n\n\n## 附录 C - 附带的图表\n\n\
  连同报告一起，提供您或组织内团队成员为支持此次测试而开发的任何图表都是非常好的。这可以帮助公司重现测试场景，同时也可能只是记录他们从未记录过的内容。我见过许多渗透测试创建了组织图表、数据流图或业务流程图等文档，而公司从未记录过这些文档，或者至少没有纸质副本。我在实验室中作为渗透测试的一部分创建了早期的\
  \ PCI 数据流图。\n\n## 关于您的公司\n\n本节全部关于营销您的品牌。您希望放置少量关于您公司及其提供的服务的信息。执行渗透测试的人员应有一小段文字博客，介绍他们的专业经验以及他们可能拥有的任何认证。这将帮助阅读报告的任何人了解谁执行了测试以及他们为何有资格执行。始终放置您的联系信息，以防任何人将来需要就其他事情联系您，以及公司可能持有的任何认证。它实际上应该读起来像一个30秒的广告。\n\
  \n## Onshore IT服务信用卡数据流\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_244_0.png)\n\
  \nPOS终端VLAN（5）\n\nPOS终端\n\n防火墙\n\n互联网\n\nPOS应用VLAN（15）\n\n应用服务器\n\nDB VLAN（27）\n\
  \nDB服务器\n\n商户\n\n## 构建报告\n\n现在我们已经讨论了渗透测试报告的布局，只需将我们获得的所有信息放入我们刚刚讨论的逻辑结构中即可。\n\n\
  通常，从初稿开始。初稿总是会最困难，但大部分时间和精力都花在这一步。先从你觉得准备好的部分开始，然后在完成你最熟悉的部分后，再回头处理其他部分。我倾向于遵循以下流程：\n\
  \n- 1. 首先把所有主要标题放进去。\n- 2. 然后，返回并在标题下放置所有主要部分。\n- 3. 先处理你最熟悉的部分。跳来跳去，先完成你熟悉的部分。\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_245_0.png)\n\n如果以后需要在文档的任何部分添加内容，请做某种视觉标记。这样你就知道以后需要返回那里添加图形或文本或进行任何更改。我总是使用这组字符来表示仍在进行中的部分（XXXX）。这样，我就可以在将文档称为完成之前，在文档中搜索这些字符组是否存在。\n\
  \n- 4. 最后，浏览所有部分并完全填写它们。\n- 5. 完成后，离开工作。我通常会等上一天左右再回去重读初稿。这样我的思维会更清新。\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_245_1.png)\n\
  \n我有过在写完初稿后立即编辑的情况，并且由于内容在我脑海中如此新鲜，导致措辞不正确；我的大脑正确地阅读了文字，即使它们在页面上的布局是错误的。\n\n- 6.\
  \ 完成初稿的阅读和编辑后，请另一位团队成员阅读文档进行编辑。这始终是一个好主意，以确保措辞和思想完整。\n\n此时，您应该有一份相当精美的报告，准备好进入下一步，即向利益相关者交付报告。\n\
  \n## 提交报告\n\n报告完成后，现在是时候将其交付给原始利益相关者作为我们的最终交付物。如何以及向谁交付应在原始范围会议中定义。这是一个重要的过程，因为我们创建的文档可能包含您不希望泄露给任何人的敏感信息。如果这些信息落入坏人之手，例如黑客，他们将知道所有弱点以及攻击的确切位置。\n\
  \n第一步是决定报告是否需要以电子方式、物理方式或两者结合交付。让我们从电子方式开始。在这个数字时代，保护文档至关重要。需要考虑某种加密。这通常是共享在其他类型的媒介上或可能在对话中预先安排的对称密钥。这样，如果数字副本泄露，他们需要密钥才能读取它。此外，确保密钥不可猜测，并且需要确保密钥足够强。我们在第6章《基于密码的攻击》中讨论了强密码的重要性。\n\
  \n如果您想要更安全的保护，可以实施非对称加密来保护文档。这将需要实施用于加密和解密的数字证书。虽然设置要复杂得多，但绝对是文档加密中最安全的。\n\n如果需要纸质副本，最好的选择是确保在公司内部打印。然而，这取决于公司的规模以及所需副本的大小和数量，您可能需要寻求外部帮助。如果是这种情况，请使用值得信赖的供应商进行所有外部打印。有些公司专门从事安全打印。浏览并查看其中几家，看看哪一家更符合您的需求。\n\
  \n现在您已经打印了报告，您需要确保可以安全地将其交付到最终目的地。如果您幸运的话，可以亲自送达，因为它们可能在合理的旅行距离之内。这是最佳情况，因为您不必担心交付被盗或丢失。然而，如果不是这种情况，您\
  \ definitely 需要考虑安全交付。有许多安全交付供应商，因此您可能需要做一些研究。无论供应商是谁，始终要求签名以确保组织中的某人签收交付，并始终获取跟踪号码。这样，您就可以与组织中的联系人核实包裹是否已送达。\n\
  \n## 总结\n\n我们现在完成了第10天，也是这次渗透测试训练营的最后一天，让我们回顾一下。首先，我们谈到了收集整个参与过程中收集的所有数据。这包括将非结构化数据放入结构化布局中，以便更轻松地迁移到最终产品。\n\
  \n风险以及定义其重要性是下一个主题。我引用了 NIST 风险标准来帮助说明风险如何定义，以及风险如何变化，并举例说明了在两种不同环境中相同的漏洞。\n\n接下来，我们触及了渗透测试的结构，这可能是本章最重要的部分之一。在这里，我列出了渗透报告中的各个部分，列出如下：\n\
  \n- 封面\n- 目录\n- 执行摘要\n- 项目范围\n- 渗透测试目标\n- 风险评级标准说明\n- 发现摘要\n- 详细发现结论\n- 附录 A - 使用的工具\n\
  - 附录 B - 附带报告\n- 附录 C - 附带图表 关于您的公司\n\n接下来，我们转向构建实际报告。这包括基于我多年来观察到的经验的一些最佳实践。最后，我们谈到了将最终产品交付给利益相关者作为我们的最终交付物。\n\
  \n我本想说，在下一章，但本章结束了本书。希望根据这最后10天/章节，您能更好地理解渗透测试流程。本书中发现并提供的信息应该能让您自信且更有信息地进行渗透测试流程。利用您在书中学到的信息，获得管理层的批准，运行一些内部渗透测试以磨练您的技能并为您的组织创造更强大的安全态势。\n\
