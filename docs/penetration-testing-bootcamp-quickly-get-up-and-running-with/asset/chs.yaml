  /root/outbound-ssh


  ```

  root@pi-kali:~# cd /etc/network/if-up.d/

  root@pi-kali:/etc/network/if-up.d# touch outbound-ssh

  root@pi-kali:/etc/network/if-up.d# chmod +x outbound-ssh

