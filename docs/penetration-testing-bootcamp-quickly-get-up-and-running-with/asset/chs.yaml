  \ ARP 请求，在本例中为 192.168.33.0/24。根据回复，你可以看到当前网络上哪些主机处于活动状态。\n\n## 枚举你的发现\n\n现在我们刚刚使用了一系列信息收集工具来绘制、探测和发现我们正在处理的基础设施，让我们将这些信息整理成逻辑性更强、结构更完善的文档。然后我们可以将这些信息与我们在利益相关者会议和团队访谈中获得的数据合并，创建一个可靠的文档包，这几乎可以保证我们在渗透测试的后续阶段取得成功。我们创建的这些信息将包含在最终的渗透测试报告中，不仅有助于展示我们的发现，还可以核实组织目前记录的内容。很多时候我提交的文档要么比组织现有的更详细，要么更新，要么更完整。我们作为渗透测试人员所展示的价值越大，未来被再次聘用的机会就越多。\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_60_0.png)\n\n组织是成功项目的关键。你使用的工具提供了大量关于网络和系统的各种优秀信息。在从各种工具中枚举这些信息时，请确保按某种结构组织项目。这可以按系统类型或信息类型进行；这个决定由你来做。但你不希望因为信息不在文档中应有的位置而丢失或遗漏有价值的信息。\n\
  \n## 摘要\n\n在本章中，我们讨论了信息收集的重要性以及它如何决定渗透测试的成功与否。在开始利用阶段之前尽可能多地收集信息可以节省你的时间和精力，因为你会知道攻击什么以及如何攻击，而不是浪费周期尝试那些行不通的利用。\n\
  \n我们回顾了我工具箱中用于收集信息的几个工具。每种工具相互补充，并且在发现能力方面都很强大。这些工具包括 whois、dnsmap、Nmap、p0f、Firewall、DotDotPwn\
  \ 和 Netdiscover。这绝不是工具的详尽清单，但只是我使用的一些更流行和有效的工具。\n\n在介绍这些工具时，我展示了一些使用示例，但我也记录了所有可用的命令行参数。这样你就可以尝试它们，并发现哪些选项和工具最适合你的环境。\n\
  \n在下一章中，我们将讨论设置和维护命令与控制服务器。这是将文件、数据以及在渗透测试中遇到的任何其他证据传输出去的重要步骤。\n"
- '## 3


  ## 设置和维护命令与控制服务器


  在过去两天尽可能多地收集情报之后，现在是开始思考渗透测试本身以及我们将如何执行它的时候了。在第 4 天，我们将开始实际测试或渗透在调查阶段发现的各种系统，但在到达那里之前，还有一些事项需要考虑。首先，我们计划将测试期间获取的任何证据放在哪里？我们不想将其留在服务器上，以防被发现并可能被更改（或在我们报告之前漏洞被修补）。我们可能还需要根据网络中运行测试的设备进行离服务器分析。这就是命令与控制（C&C）服务器发挥作用的地方。


  在本章中，我们将讨论在渗透测试演练中使用 C&C 服务器以及它如何发挥关键作用。我们还将深入探讨 C&C 服务器的各种选项。这将使你可以选择将其放置的位置以及它是什么。最后，我们将讨论如何设置、管理和监控该
  C&C 服务器，以及如何有效地和安全地使用它。这将包括自动化一些任务以及文件实用工具，以确保我们不被发现。我们将涵盖本章的以下主题：


  - C&C 要求

  - 设置安全连接

  - 内部服务器 SSH 设置

  - C&C 服务器 SSH 设置

  - 设置反向 SSH 隧道

  - Stunnel 救援

  - 验证自动化

  - 自动化证据收集

  - 文件实用工具


  C&C 服务器的设置很大程度上取决于渗透测试人员。有些人，像我一样，更喜欢拥有一个集中的 C&C 服务器，并在网络中使用较小的设备来执行测试。其他人可能选择仅使用其更强大的设备进行测试和分析。这真的取决于渗透测试人员的个人风格。以下部分反映了我的个人风格；然而，你应该根据自己的个人喜好务必探索其他方法。


  ## 命令与控制服务器


  命令与控制服务器，或 C&C 服务器，由于其被广泛用于恶意目的，例如投递恶意软件或其他恶意负载，因此具有负面印象。由于同样的原因，它们以负面方式被使用，也可以用正面方式使用。这些
  C&C 服务器是完美的方式，可以将你收集的数据或证据传输到异地服务器，以便你进行审查、整理和最终确定。你永远不想留下你在特定系统上的任何证据，甚至不想留下任何文件或发现。这就是
  C&C 服务器发挥作用的地方，因为它们可以成为你所有渗透测试证据的单一来源。


  你的 C&C 服务器驻留在何处完全由你决定。大多数时候，C&C 服务器驻留在某人的云中。这可能是 AWS、Azure 或你选择的任何其他云服务。然而，它不必是基于云的解决方案。你可以在公司办公室拥有一个服务器，甚至在你的家庭实验室中拥有一个服务器，并在其中建立安全的回传通道。选择权在你。重要的是它需要以下条件：


  - 充足的连接性

  - 能够远程访问

  - 访问本地本地部署设备

  - 必须具有成本效益


  C&C 服务器可以根据你的喜好位于任何地方。但即使它们可以位于任何地方、是任何东西，仍然需要一些要求，以确保你拥有一个有效的设置，有助于简化你的渗透测试，而不是阻碍它。




  Here are some of the requirements that you may need for a penetration-testing C&C
  server setup:


  以下是您可能需要的渗透测试 C&C 服务器设置的某些要求：


  - **处理能力：** 它们可能需要用于使用 Wireshark 分析大型捕获、密码破解或任何其他 CPU 密集型程序。您需要确保拥有足够的处理能力以合理的方式执行这些任务。如果破解无线密码需要
  30 天，而密码每周都会更改，那么任务就毫无意义了。在选择系统规格时请记住这一点。

  - **500 GB+ 的磁盘空间：** 随着渗透测试的继续，证据会不断累积。各种发现，例如您的笔记会很小；然而，屏幕截图和流量捕获会迅速累积。确保您拥有尽可能多的空间；过度配置也不会有坏处。

  - **本地现场设备：** 您希望在现场拥有一个本地设备，该设备可远程与您的 C&C 服务器通信。对于此任务，我倾向于选择 Raspberry Pi，因为它体积小且易于隐藏，但仍足够强大，可以运行
  Kali 等完整操作系统。由于该设备不需要执行密集处理，因此不需要是全尺寸的笔记本电脑或服务器。它只需要传递数据即可。如果可能，它应具有无线接口，以便拥有额外的连接选项。许多公司都有基于
  NAC 的解决方案，会检测有线设备，但在无线方面通常要求不那么严格。此外，根据公司是否知道您在那里有设备，您可能会接入一个非面向互联网的 VLAN 的端口。我更喜欢无线方式，这样我就可以随时连接到访客
  SSID 或其他非企业受限 SSID 进行传输。如果可能，它还应具有多个无线接口，以便您可以进行一些无线攻击，以及一个蓝牙接口。

  - **本地设备与 C&C 服务器之间的安全通道：** 这通常是一个反向 SSH 隧道。您需要确保它是安全且加密的，这样其他人就无法窃取您的证据并将其用于对您正在工作的公司不利。


  ## 设置安全连接


  It is not only important to ensure that there is connectivity from the local on-premises
  box to the C&C server; however, it should also be secure. You don’t want to give
  someone the ability to sniff the traffic and get information that they shouldn’t
  have. This not only makes you look bad as a penetration tester, but could also cause
  serious issues for the company you are running the penetration test for.


  确保本地现场设备到 C&C 服务器的连接不仅仅重要；它还应该是安全的。您不想让某人能够嗅探流量并获取他们不应该拥有的信息。这不仅会让您作为渗透测试人员显得很糟糕，而且还可能导致您正在为其进行渗透测试的公司出现严重问题。


  Your job as a penetration tester is to find weaknesses in the environment. So having
  these being clearly seen as they pass over the wire is like forgetting to close
  your safe, where you have all of your most important and valuable items.


  作为渗透测试人员的职责是查找环境中的弱点。因此，让这些信息在传输过程中被清晰地看到，就像忘记关闭保险箱一样，里面存放着您最重要的和最有价值的物品。


  For my penetration-testing requirements, I will use a reverse SSH tunnel within
  a stunnel instance. I will show you the steps to set up this secure communication
  from the C&C server side to the on-premises box, which in my case is the Raspberry
  Pi. First, we will start inside with the reverse SSH setup, followed by the stunnel
  setup. But when bringing up the connection, this happens in the opposite order,
  with the stunnel session getting set up first, followed by the reverse SSH session
  within that tunnel.


  对于我的渗透测试需求，我将在 stunnel 实例中使用反向 SSH 隧道。我将向您展示从 C&C 服务器端到现场设备的这些安全通信的设置步骤，在我的例子中是
  Raspberry Pi。首先，我们将从内部开始反向 SSH 设置，然后是 stunnel 设置。但在建立连接时，顺序是相反的，首先建立 stunnel 会话，然后在该隧道内建立反向
  SSH 会话。


  ![](img/095df2cd1930baecbcecaa51ee3417aa_64_0.png)


  Since this is an intermediate level book, I will not go into a complete step-by-step
  setup of some of these tools. I will assume that the base operating system is in
  place; in this case, it''s Kali Linux on the laptop VM as well as the Raspberry
  Pi.


  由于这是一本中级书籍，我不会详细介绍这些工具的完整逐步设置。我假设基础操作系统已经就位；在这种情况下，笔记本 VM 以及 Raspberry Pi 上都是 Kali
  Linux。


  ## 内部服务器 SSH 设置


  Let''s start by working on getting the Raspberry Pi, or whichever inside server
  you will use to set up the secure reverse SSH tunnel. The process itself is not
  really that difficult. It just involves setting up SSH since this host will be the
  one initiating connections back to the C&C server:


  让我们开始着手配置 Raspberry Pi，或您将用于设置安全反向 SSH 隧道的任何内部服务器。过程本身并不算太困难。它只是涉及设置 SSH，因为此主机将是发起回
  C&C 服务器连接的主机：


  - 1. The first thing we do is back up old SSH keys and create new ones. On the Raspberry
  Pi, these keys are set up by default.

  - 1. 我们首先备份旧的 SSH 密钥并创建新的密钥。在 Raspberry Pi 上，这些密钥默认已设置。

  - 2. Typically, the Raspberry Pi Kali Linux image allows root login by default.
  I always verify to prevent unnecessary troubleshooting later.

  - 2. 通常，Raspberry Pi Kali Linux 镜像默认允许 root 登录。我总是进行验证以防止以后不必要的故障排除。

  - 3. Next, we need to allow SSH to start on reboot. This is a very important task.
  I have had situations where power was lost to one of the hosts, and SSH was not
  set to restart on boot. I had to manually console in and update. If the device is
  not local, it can be a hard lesson to learn.

  - 3. 接下来，我们需要允许 SSH 在重启时启动。这是一项非常重要的任务。我曾遇到过主机断电的情况，而 SSH 未设置为启动时重启。我不得不手动登录控制台并进行更新。如果设备不在本地，这可能是一个难以学习的教训。

  - 4. Restart SSH, and you are ready to go. I always test it out as well just to
  make sure. So, try to SSH to the Raspberry Pi or whichever inside box you are using
  just to verify that everything is working.

  - 4. 重启 SSH，您就可以开始了。我也总是测试一下以确保无误。因此，请尝试 SSH 到 Raspberry Pi 或您使用的任何内部设备，以验证一切是否正常工作。


