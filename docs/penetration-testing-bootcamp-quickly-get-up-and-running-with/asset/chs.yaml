  ```\n\n如你所见，进入对话中间是相当容易的。但如果你更喜欢基于 GUI 的 MiTM 工具怎么办？那么，让我们来看看 Ettercap。\n\n## Ettercap\n\
  \nEttercap 是一个很棒的工具，可用于使用 GUI 而非 CLI 执行 MiTM 攻击。Ettercap 具有基于 CLI 的实用程序，但 GUI 版本功能强大，是\
  \ arpspoof 的绝佳替代方案。\n\n启动 Ettercap 时，首先需要决定要以哪种模式运行它。可用的选项是 Bridge sniffing 或 Unified\
  \ sniffing。如果您是物理有线内联，则可以选择 **Bridge sniffing**。但如果不是，您应该选择 **Unified sniffing**，这就是我将选择的内容：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_125_0.png)\n\n接下来，我们将选择适当的接口，在本例中为 `eth0`，因为它是我们在线的唯一接口：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_125_1.png)\n\n菜单出现后，您将开始看到项目正在加载，最后会出现\
  \ `Starting Unified sniffing....` 消息。此时，该实用程序已准备就绪：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_126_0.png)\n\
