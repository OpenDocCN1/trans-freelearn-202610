  现在我们已到达本章的结尾，我们应该拥有渗透测试所需的一切。 在与所有利益相关者进行范围界定会议后，我们能够得到我们所需的所有问题的答案。 这包括参与问题和范围界定标准。
  利益相关者在范围界定会议后的交付物应包括对渗透测试有益的任何文档。 我们通常需要网络图、组织结构图以及任何重要的数据流图。


  一旦我们完成了规划部分，我们就进入了准备阶段。 在这种情况下，准备阶段涉及在 Raspberry Pi 上设置 Kali Linux 以及在笔记本电脑上将其设置为
  VM。 我们在每个平台上完成了安装和更新软件的步骤，以及一些基本的管理任务。


  在 `Chapter 2`，*信息收集*，我们将开始深入信息收集任务。 在此任务中，我们将查看需要调查的各种类型的信息，以及在哪里寻找更多信息。 我们不能总是依赖利益相关者的文档是正确的，甚至可能存在他们甚至不知道的未记录系统。
  找到这些系统是我们的任务。 我们将使用各种工具来获取这些信息，以便帮助我们了解现有的安全性和系统，从而知道稍后从哪里开始渗透测试。

