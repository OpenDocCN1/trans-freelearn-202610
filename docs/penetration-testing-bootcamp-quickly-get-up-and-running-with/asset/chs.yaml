  \ TTL 被设置为 2：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_54_0.png)\n\n## 检测 Web\
  \ 应用防火墙\n\n基于网络的防火墙并不是你在途中可能发现的唯一类型的防火墙。Web 应用防火墙（Web Application Firewalls，简称 WAFs）常被用于保护基于\
  \ Web 的应用程序。如果对环境不熟悉，检测 WAF 可以帮助梳理 Web 应用程序的基础架构。为了帮助我们弄清这方面的信息，我们将使用一个名为 WAFW00F\
  \ 的工具。WAFW00F 可以帮助你确定在 Web 服务器之前是否存在额外的安全层。\n\nWAFW00F 可以检测许多不同类型的 WAF 的存在。通过使用\
  \ -l 标志运行 wafw00f 命令，你可以看到当前已定义的 WAF 列表。以下是我的实验室中的当前列表。如果其中一种未被检测到，不必担心；wafw00f\
  \ 命令仍会通知你检测到通用 WAF：\n\n- Profense\n- NetContinuum\n- Incapsula WAF\n- CloudFlare\n\
