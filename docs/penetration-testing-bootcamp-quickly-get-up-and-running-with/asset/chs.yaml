  \ Web 应用程序以查找任何漏洞的方法。然后，您可以利用这些信息尝试利用或测试该漏洞，或者您可以将其作为参与结束报告的一部分提交给利益相关者。我通常会将此报告包含在测试的任何\
  \ Web 应用程序中，作为一些很好的资料。\n\n## 基于身份的测试\n\n身份控制是 Web 应用程序的关键功能。您希望确保人们就是他们所说的那样，并且他们只能做被允许做的事情。\n\
  \n如今大多数，如果不是全部的 Web 应用程序，在使用该应用程序之前都需要某种形式的身份验证，因此它是个人或黑客首先遇到的项目之一。因此，确保它在应该工作时工作，并拒绝不应该在场的用户非常重要。\n\
  \n对 Web 应用程序进行默认用户名和密码测试是跨所有应用程序进行身份测试的重要部分。更改默认用户名和密码是实现强大的 Web 应用程序态势时易于取得的成果。您还希望确保用户根据其角色有权访问所需的内容。当只有\
  \ 2 人需要完全访问权限时，不应有 27 个具有管理权限的用户。我将探讨您可以对 Web 应用程序执行的某些测试，以使您拥有强大的身份控制。\n\n\n\n\n\
  ## 基于角色的访问控制\n\n身份测试的一个重要部分是确保拥有访问权限的人员，其访问权限与其角色相符。例如，如果有一个用户需要登录系统以读取应用程序生成的所有日志，并且这就是其唯一关注点，那么就不应允许该用户登录后更改内容。另一个例子是拥有可以向应用程序添加用户的用户。他们不应能够更改管理员用户的密码。我可以继续举例，但重点是您希望角色来定义用户的访问权限。\n\
  \n通常，对此的测试相当简单。我将用户从 Web 应用程序用户数据库中提取出来，并将其与这些用户的角色进行交叉引用。然后我验证用户是否具有与其工作角色相匹配的正确权限。这是一个快速而强大的测试。\n\
  \n## Apache-users\n\nApache-users 是针对启用了 UserDir 模块的 Apache 服务器设置使用的枚举工具。至少，您将指定\
  \ wordlist、主机，然后开始。非常易于使用的工具，并且检查非常特定的功能，但可以提供有价值的信息，可用于最终的发现报告：\n\n```\nroot@pi-kali:~#\
  \ apache-users\nUSAGE: apache.pl [-h 1.2.3.4] [-l names] [-p 80] [-s (SSL Support\
  \ 1=true 0=false)] [-e 403 (http code)] [-t threads]\n```\n\n运行测试针对没有问题的主机时，输出如下：\n\
  \n```\nroot@pi-kali:~# apache-users -h 192.168.1.129 -l /usr/share/wordlists/metasploit/unix_users.txt\
  \ -p 80 -s 0 -e 403 -t 10\nExecution time: 34 seconds!\n```\n\n但是，运行测试针对存在问题的主机时，输出如下：\n\
  \n```\nroot@pi-kali:/usr/share/wfuzz# apache-users -h 192.168.33.3 -l /usr/share/wordlists/metasploit/unix_users.txt\
  \ -p 80 -s 0 -e 403 -t 10\nROOT exists on 192.168.33.3\ndaemon exists on 192.168.33.3\n\
  ftp exists on 192.168.33.3\nlp exists on 192.168.33.3\nnobody exists on 192.168.33.3\n\
  root exists on 192.168.33.3\nsshd exists on 192.168.33.3\nwww exists on 192.168.33.3\n\
  Execution time: 15 seconds!\n```\n\n就这样。快速、简单，但功能强大。我能够通过此脚本枚举系统中大量用户名。然后我可以利用这些信息对账户进行暴力破解。\n\
  \n## Wfuzz\n\nWfuzz 是一个 Web 应用程序暴力破解实用程序。它可用于各种不同的基于暴力破解的攻击，包括检查不同类型的注入攻击、用户名或密码检查、模糊测试等等。由于本节是基于身份的测试，我将使用暴力破解用户名和密码检查。我已为用户名和密码选择了\
  \ wordlist。我将使用 -hc 302 开关来忽略 302 响应，以便我只能看到有效的响应。我还指定了我将进行暴力破解的 URL。由于我将为输入提供两个文件，我可以在\
  \ URL 中使用变量 FUZZ 和 FUZZZ 来指定它们，其中第二个表示第二个变量。\n\n我需要做的第一件事是获取 PHP 会话 ID（PHPSESSID）。为此，我将浏览网站并在浏览器中调出开发者工具菜单。这样我就可以获取一个会话\
  \ ID 以插入到 wfuzz 中。以下是我的会话中 PHPSESSID 的屏幕截图：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_199_0.png)\n\
  \n以下是我将运行以尝试暴力破解 Web 应用程序的命令。请注意，我使用了之前获取的 PHPSESSID，以及适当的 wordlist 和登录的 URL：\n\n\
  ```bash\nroot@pi-kali:/etc# wfuzz -b PHPSESSID=55e8ff7e0bec6bfbf3485bb9272f8acc\
  \ -z file,/usr/share/wfuzz/wordlist/general/user.txt -z file,/usr/share/wfuzz/wordlist/general/pass.txt\
  \ http://192.168.33.31/dvwa/vulnerabilities/brute/?username=FUZZ\\&password=FUZZZ\\\
  &Login=Login#\n```\n\n当我运行命令时，输出如下。我已圈出成功的尝试。您会注意到单词编号与其他的不同。我还突出显示了有效的用户/密码组合：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_200_0.png)\n\n从该示例中，您可以看到使用 wfuzz 暴力破解此\
  \ Web 应用程序是多么快速和简单，而且这只是使用 wfuzz 的一种方式。\n\n有很多优秀的模糊测试软件，还有许多关于如何模糊测试不同类型 Web 应用程序的示例。请随意探索并找到最适合您需求的工具。\n\
  \n## 验证数据、错误处理和逻辑\n\n让您的 Web 应用程序收集数据非常重要，因为这通常是存在 Web 应用程序的主要原因。但系统如何处理这些数据非常重要，尤其是对安全专业人员而言。Web\
  \ 应用程序需要能够处理传入的数据，但它们对输入错误数据时的反应是我们作为渗透测试人员想要测试的内容。有时，当输入错误数据时，Web 应用程序会发生不想要的事情，我们希望确保这种情况不会发生。\n\
  \n我们还需要确保显示给用户的数据也是正确的。您不希望向用户提供不必要的信息，或向用户提供他们不应看到的信息。一个很好的例子是用户能够查看其账户信息以更改密码。您不希望该用户能够查看所有账户。\n\
  \n错误处理也很关键。您永远不希望向用户发布用户不需要的信息。有人可能会利用这些信息来了解有关应用程序工作原理的更多信息。因此，我们希望确保应用程序正确处理错误等，并且不会向用户泄露任何额外信息。\n\
  \n逻辑也起着关键作用。如果用户本应遵循某个流程从 A 点到达 G 点，如果用户可以跳过步骤直接从 A 点到 G 点会怎样？应用程序会中断并阻止用户吗？还是某些步骤可以被绕过并可能获得提升的权限？这就是为什么测试应用程序的逻辑很重要。\n\
  \n在以下部分中，我将介绍一些工具，展示如何测试数据验证和错误处理。\n\n## 使用 Sqlmap 进行 SQL 注入\n\nSQLmap 是一款用于检测和利用\
  \ SQL 注入漏洞的渗透工具。一旦被利用，它就可以使用各种开关对数据库执行一系列操作。这包括指纹识别、数据库列表、这些数据库中的表列表，甚至转储整个数据库。它支持这里的所有主要数据库厂商，并完全支持六种不同的\
  \ SQL 注入技术。如需更多信息，请务必查看 http://sqlmap.org。现在，让我们尝试测试我们的应用程序是否存在 SQL 注入漏洞，如果发现漏洞，则执行一些测试以获取一些数据。\n\
  \n首先，我们需要获取会话 ID。我将以与使用 wfuzz 时相同的方式完成此操作。首先，我将打开浏览器，并在打开开发者工具的情况下，连接到我将尝试进行 SQL\
  \ 注入的 URL：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_202_0.png)\n\n一旦我获得了该 cookie\
  \ ID，我就可以启动 sqlmap 语法。在我的 sqlmap 语法中，我需要指定我想要尝试运行 SQL 注入的 URL，以及 cookie 信息。我还将指定\
  \ -dbs 标志，以便让 sqlmap 找出底层数据库。\n\n```bash\nroot@pi-kali:~# sqlmap -u \"http://192.168.33.31/dvwa/vulnerabilities/sqli/?id=user&Submit=Submit#\"\
  \ --cookie=\"PHPSESSID=eb6e6cd3ca8532aa5abb6edf879713e7; security=low\" --dbs\n\
  ```\n\n```\n[!] legal disclaimer: Usage of sqlmap for attacking targets without\
