  通常可以通过防火墙，因此让流量通过 SSL/TLS 隧道传输将是一个额外的好处。幸运的是，stunnel 是一个非常适合此用途的实用工具。现在，让我演示如何在将所有内容整合之前设置
  stunnel 并使其正常工作。但在进入 stunnel 之前，我们必须确保我们的 ssh 连接会在启动时启动，以便我们随时可以进行反向 ssh：


