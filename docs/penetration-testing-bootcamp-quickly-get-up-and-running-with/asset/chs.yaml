  \n## 使用 Skipfish 进行 Web 应用程序侦察\n\nSkipfish 是一个极其快速的 Web 应用程序侦察工具。它全部用 C 编写，因此速度极快且高度优化。正因如此，它可以对主机执行许多测试以生成令人印象深刻的报告。\n\
