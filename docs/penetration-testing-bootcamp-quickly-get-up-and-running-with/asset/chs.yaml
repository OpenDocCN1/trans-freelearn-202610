  [*] NS ns-47.awsdns-05.com 205.251.192.47\n[*] MX ppsprmsa.turner.com 157.166.168.210\n\
  [*] MX ppsprmsh.turner.com 157.166.157.29\n[*] A cnn.com 151.101.64.73\n[*] A cnn.com\
