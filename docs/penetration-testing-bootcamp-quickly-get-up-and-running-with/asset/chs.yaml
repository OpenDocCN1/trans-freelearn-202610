  - 1. 与 Raspberry Pi 设置类似，我们需要复制旧密钥并创建新密钥。与 Raspberry Pi 不同，密钥未共享并且应已唯一；然而，我喜欢重新创建它们以防万一（这是习惯使然，也是安全方面的最佳实践）：


