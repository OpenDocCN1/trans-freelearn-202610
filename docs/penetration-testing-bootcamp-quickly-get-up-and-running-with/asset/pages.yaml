  md: '![](img/095df2cd1930baecbcecaa51ee3417aa_49_0.png)


    Using the tcpdump style filters is very important when running multiple tools
    on your penetration-testing box. For example, if you are running Nmap to see what
    is open and then take some of those results to p0f for further examination, you
    may end up capturing not only the p0f traffic you want to see, but also the continuing
    Nmap. My advice is always to use filters whenever possible, to prevent multiple
    tests converging into the p0f screen.


    Now, what happens if you don''t want to test live traffic but want to see which
    hosts were communicating in a live conversation that was recorded in the past?
    That''s no problem at all. By specifying -r with the file name, you can pull a
