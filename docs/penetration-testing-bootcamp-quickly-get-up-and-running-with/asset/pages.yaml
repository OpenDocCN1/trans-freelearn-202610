    # Wfuzz


    Wfuzz is a web application brute forcing utility. It can be used for lots of different
    bruteforce based attacks, including checking different kinds of injection attacks,
    usernames, or password checks, fuzzing, and so on. Since this section is identity-based
    testing, I will use the brute-force username and password check. I have chosen
    my wordlists for both the username and the password. I will use the -hc 302 switch
    to ignore the 302 responses, so that I can only see the one that works. I also
    specify the URL that I will brute force. Since I will be providing two files for
    input, I can specify those in the URL with the variable FUZZ and FUZZZ, where
    the two specifies it is the second variable.


    The first thing I need to do is grab the PHP session ID (PHPSESSID). To do this,
    I will browse the website and pull up the developer tools menu in the browser.
    This way I can grab a session ID to insert into wfuzz. Here is the screenshot
    of the PHPSESSID from my session:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_199_0.png)


    The following is the command I will run to attempt to brute force the web application.
    Notice that I have the PHPSESSID that I grabbed earlier, as well as the appropriate
    wordlists and the URL for the login:


    ```

    ```bash

    root@pi-kali:/etc# wfuzz -b PHPSESSID=55e8ff7e0bec6bfbf3485bb9272f8acc -z file,/usr/share/wfuzz/wordlist/general/user.txt
    -z file,/usr/share/wfuzz/wordlist/general/pass.txt http://192.168.33.31/dvwa/vulnerabilities/brute/?username=FUZZ\&password=FUZZZ\&Login=Login#

    ```

    ```'
