    # Understanding spoofing attacks


    What''s the best way to get in between a conversation when it is not possible
    to physically be in line? Well, that''s with spoofing attacks of course. Spoofing
    attacks are a fundamental requirement for attacks where you are in between a conversation
    or man-in-the-middle as it''s often referred to. Spoofing attacks, in their simplest
    form, are you impersonating something else in order to get in the middle of that
    conversation or all the conversations if you impersonate the default gateway.


    To accomplish this task, we will be performing ARP spoofing. This will allow us
    to tell the host to send its traffic to us as the default gateway and to tell
    the default gateway to send traffic to that host to us. This way, we can place
    ourselves in the middle of that conversation. Once we are in the middle of that
    conversation, we can not only learn information about the conversation, but also
    manipulate the various responses to glean information from either side or send
    malware or other types of malicious program.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'The following diagram shows a MiTM attack in its simplest form:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_121_0.png)


    # ARP spoofing


    Now that we have an understanding of spoofing attacks and why they are useful,
    let’s start by getting in between some host conversations. I will use ARP spoofing
    to accomplish this. Using the `arpspoof` command, I will be able to poison the
    ARP cache on both sides with my MAC address to force a change in the traffic flow.


    To work with Arpspoof, you need to make sure it is installed. Arpspoof is a part
    of the dsniff family, so if you install dsniff (`apt-get install dsniff`), you
    will get arpspoof as well. However, before everything works, you need to make
    sure IP forwarding is enabled on the box you plan to use inline. This is because,
    by default, the system will not forward that packet back on the wire. To accomplish
    this, I just make a change via sysctl:


    ```

    ```bash

    sysctl -w net.ipv4.ip_forward=1

    ```

    ```


    ![](img/095df2cd1930baecbcecaa51ee3417aa_121_1.png)'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'I always make sure I verify that this change did go into effect. I have gotten
    bitten in the past by forgetting to enable this and then spent way too much time
    troubleshooting this. The quick and dirty check is to just verify the current
    sysctl settings:


    ```

    root@kali:~# sysctl -a list | grep net.ipv4.ip_forward

    net.ipv4.ip_forward = 1

    ```


    ![](img/095df2cd1930baecbcecaa51ee3417aa_122_0.png)


    Now that everything is all set, let us have some fun and spoof ourselves into
    some traffic flow. In my lab example, I will try and intercept the communication
