- pgno: 50
  md: "# Firewall reconnaissance with Firewalk\n\nFirewalk is an active reconnaissance\
    \ network scanner that will help determine what Layer 4 protocols our router or\
    \ firewall will pass or deny. This is a great tool for finding a way through an\
    \ environment by leveraging a bad or missing ACL within one of your network devices.\
    \ Firewalk leverages ICMP error messages and TTL expirations to let us know whether\
    \ a port is open or not, very similar to traceroute. If a port is opened or allowed,\
    \ the packet destined for that port will typically be silently dropped by the\
    \ security device. But, if the port is closed, the TTL of the packet will expire\
    \ at the next hop and issue an ICMP_TIME_EXCEEDED error message.\n\nFirewalk is\
    \ a two-phase command. The first phase is called the hop ramping phase. Its sole\
    \ job is to find the correct hop count to the target gateway so that is has the\
    \ right TTL (hop count + 1) to lock onto for the next phase. The second phase\
    \ involves starting at that point and doing a port scan with the ports we specify\
    \ from the options on the CLI to that metric host.\n\nWhen using firewalk for\
    \ the first time, the arguments can be a little confusing. Here is the screen\
    \ output of the command:\n\n```\nroot@kali:~# firewalk\nFirewalk 5.0 [gateway\
    \ ACL scanner]\nUsage : firewalk [options] target_gateway metric\n    [-d 0 -\
    \ 65535] destination port to use (ramping phase)\n    [-h] program help\n    [-i\
    \ device] interface\n    [-n] do not resolve IP addresses into hostnames\n   \
    \ [-p TCP | UDP] firewalk protocol\n    [-r] strict RFC adherence\n    [-S x -\
    \ y, z] port range to scan\n    [-s 0 - 65535] source port\n    [-T 1 - 1000]\
    \ packet read timeout in ms\n    [-t 1 - 25] IP time to live\n    [-v] program\
    \ version\n    [-x 1 - 8] expire vector\n```"
  merge: -1
  img_proc: true
- pgno: 51
  md: 'There are not a large number of options compared to other tools such as Nmap,
    which is a good thing. Technically, we only need to specify `target_gateway` and
    metric for Firewalk to work. The `target_gateway` refers to the IP address of
    the gateway/firewall/security device I want to check ACL or access against. The
    metric just refers to an IP address that is somewhere behind or after that `target_gateway`
    address. This IP address doesn''t even need to be within the next hop of that
    `target_gateway`, or reachable, or even in the next network. That IP address has
    only one job and that is to have Firewalk attempt to send traffic to it to verify
    that `target_gateway` allows the packet through it. It will technically never
    reach it, as the TTL will expire at the next hop, and therefore, elicit `ICMP_TIME_EXCEEDED`.


    Here are some examples on how I utilize the `firewalk` command to check for a
    couple of well-known ports going to our target `192.168.30.250`. The host that
    we are trying to get some reconnaissance on is host `192.168.1.1`, which happens
    to be a security device. In the CLI command, we specified a source and destination
    port as well as a port range using the `-S` switch.


    In the following output, you will see the two phases in action. In the first phase,
    you will see `hopramping` by seeing the first TTL expire. In this example, that
    first hop was `192.168.1.1`. At the next hop, the first phase is now bound, so
    the second phase can start. With the second phase, those well-known ports we specified
    against the CLI are now being tested. The results show that ports `22` (ssh) and
