  img_proc: true
- pgno: 60
  md: '![](img/095df2cd1930baecbcecaa51ee3417aa_60_0.png)


    Organization is key to a successful project. The tools you use provide lots of
    great information of all types about the network and systems. When enumerating
    that information from various tools, make sure to keep items organized by some
    structure. This could be by system type or by information type; that decision
    is up to you. But you don’t want to lose or miss valuable information because
    it was not where it should have been in your documentation.


    # Summary


    In this chapter, we talked about the importance of information gathering and how
    it can make or break how successful the penetration test will be. Gathering as
    much information as possible prior to starting the exploitation phases save you
    time and effort as you will know what to attack and how to attack it, rather than
    wasting cycles trying to exploit things that will not work.


    We went over a couple of tools in my toolbox for gathering some information. Each
    tool compliments each other and is powerful in what it can discover. These tools
    included whois, dnsmap, Nmap, p0f, Firewall, DotDotPwn and Netdiscover. This is
    by no means an exhaustive list of tools but some of the more popular and effective
    ones that I use.


    When going through these tools, I showed some examples on how I use them, but
    I also noted all the command-line arguments that are available. This way you can
    play around with them and discover which options and tools work best for your
    environment.


    In the next chapter, we will discuss setting up and maintaining a command and
    control server. This is an important step for dropping files, data, and any other
    evidence you come across while performing your penetration test.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 3


    # Setting up and maintaining the Command and Control Server


    After gathering as much intelligence as possible over the last two days, it is
    now time to start thinking about the penetration test itself, and how we will
    execute it. On Day 4, we will start the actual testing or penetrate the various
    systems that we found during our investigational phase, but before we get there,
    there are still some items to think about. First, where do we plan to place any
    of the evidence that is acquired during the test? We don’t want to leave it on
    the server in case it is found and potentially changed (or the vulnerability is
    patched before we can report it). We may also need to perform some off-server
    analysis depending on the device we have within the network running the test.
    This is where a command and control (C&C) server comes into play.


    In this chapter, we will discuss the use of a C&C server within a penetration-testing
    exercise and how it plays a pivotal role. We will also dive into various options
    that exist for a C&C server. This will allow you to have options as to where you
    put it as well as what it is. Finally, we will discuss setting up, managing, and
    monitoring as well as using this C&C server effectively and securely. This will
    include automating some tasks as well as file utilities to make sure we stay under
    the radar. We will be covering the following topics in this chapter:


    +   - C&C requirements

    +   - Setting up secure connectivity

    +   - Inside server SSH setup

    +   - C&C server SSH setup

    +   - Setting up a reverse SSH tunnel

    +   - Stunnel to the rescue verify the automation automating evidence collection
    file utilities'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'C&C server setup is very much dependent on the penetration tester. Some, like
    me, prefer to have a centralized C&C server, with smaller devices within the network
    to perform tests. Others may choose to just use their more powerful devices for
    both testing and analysis. It''s really up to the penetration tester''s personal
    style. The following section reflects my personal style; however, you should definitely
    explore other ways based on your own personal preferences.


    # Command and control servers


    Command and control servers, or C&C servers, have a negative perception due to
    their extensive use for malicious purposes, such as delivering malware or other
    malicious payloads. For the same reasons they are used in a negative manner, they
    can also be used in a positive way. These C&C servers serve as the perfect way
    to get the data or evidence you are collecting to an offsite server so that you
    can review, arrange, and finalize it. You never want to leave any evidence that
    you were on a particular system or even leave any files or findings behind. This
    is where C&C servers come into play, as they can be a single source for all your
    penetration-testing evidence.


    Where your C&C server resides is really up to you. Most of the time, C&C servers
    reside in someone''s cloud. This could be within AWS, Azure, or any other cloud
    flavor of your choice. However, it doesn''t have to be a cloud-based solution.
    You could have a server in your company office or even within your home lab in
    which you have that secure channel back. The choice is yours. The important thing
    is that it needs the following:


    +   - Lots of connectivity

    +   - The ability to access it remotely

    +   - Access to the local on-premise box

    +   - It must be cost-effective


    C&C servers can be anywhere based on your preference. But even though they can
    be anywhere and anything, there still need to be some requirements to make sure
    you have an effective setup that will help streamline your penetration test, not
    hamper it.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Here are some of the requirements that you may need for a penetration-testing
    C&C server setup:


    +   - **Processing capabilities:** They are potentially needed to drill into large
    captures with Wireshark, password cracking, or any other CPU-intensive programs.
    You need to make sure you have the processing power to perform these tasks in
    a reasonable manner. If it takes 30 days to crack a wireless password that changes
    every week, then the task is pointless. Keep this in mind when picking out the
    specifications of the system.

    +   - **500 GB + of disk space:** Evidence will add up as you continue the penetration
    test. Various findings such as your notes will be small; however, screenshots
    and traffic captures will add up quickly. Make sure you have as much space as
    possible; it never hurts to overprovision this.

    +   - **Local on-prem box:** You will want to have a local box on-site that will
    talk to your C&C server remotely. I tend to prefer the Raspberry Pi for this task
    as it''s small and concealable, yet powerful enough to run a full operating system
    such as Kali. Since this box doesn''t need to perform intense processing, it doesn''t
    need to be a full-sized laptop or server. It just needs to pass the data over.
    It should have a wireless interface, if possible, to have additional connectivity
    options. Many companies have NAC-based solutions that will detect wired devices,
    but are often less stringent on the wireless side. Also, depending on whether
    or not the company knows you have a device there, you may jack into a port with
    a non- Internet facing VLAN. I prefer wireless so that I can jump on a guest SSID
    or another non-corporate restricted SSID and do my transfers at will. It should
    also have multiple wireless interfaces, if possible, so you can do some wireless
    attacks, as well as a Bluetooth interface.

    +   - **Secure channel between the local box and the C&C server:** This is typically
    a reverse SSH tunnel. You want to make sure it''s secure and encrypted so that
    others can''t steal your evidence and use it against the company you are working
    for.


    # Setting up secure connectivity


    It is not only important to ensure that there is connectivity from the local on-premises
    box to the C&C server; however, it should also be secure. You don’t want to give
    someone the ability to sniff the traffic and get information that they shouldn’t
    have. This not only makes you look bad as a penetration tester, but could also
    cause serious issues for the company you are running the penetration test for.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Your job as a penetration tester is to find weaknesses in the environment.
    So having these being clearly seen in as they pass over the wire is like forgetting
    to close your safe, where you have all of your most important and valuable items.


    For my penetration-testing requirements, I will use a reverse SSH tunnel within
    a stunnel instance. I will show you the steps to set up this secure communication
    from the C&C server side to the on-premises box, which in my case is the Raspberry
    Pi. First, we will start inside in with the reverse SSH setup, followed by the
    stunnel setup. But when bringing up the connection, this happens in the opposite
    order, with the stunnel session getting set up first, followed by the reverse
    SSH session within that tunnel.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_64_0.png)


    Since this is an intermediate level book, I will not go into a complete step-by-step
    setup of some of these tools. I will assume that the base operating system is
    in place; in this case, it''s Kali Linux on the laptop VM as well as the Raspberry
    Pi.


    # Inside server SSH setup


    Let''s start by working on getting the Raspberry Pi, or whichever inside server
    you will use to set up the secure reverse SSH tunnel. The process itself is not
    really that difficult. It just involves setting up SSH since this host will be
    the one initiating connections back to the C&C server:


    +   1. The first thing we do is back up old SSH keys and create new ones. On the
    Raspberry Pi, these keys are set up by default.

    +   2. Typically, the Raspberry Pi Kali Linux image allows root login by default.
    I always verify to prevent unnecessary troubleshooting later.

    +   3. Next, we need to allow SSH to start on reboot. This is a very important
    task. I have had situations where power was lost to one of the hosts, and SSH
    was not set to restart on boot. I had to manually console in and update. If the
    device is not local, it can be a hard lesson to learn.

    +   4. Restart SSH, and you are ready to go. I always test it out as well just
    to make sure. So, try to SSH to the Raspberry Pi or whichever inside box you are
    using just to verify that everything is working.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Command and control server SSH setup


    Setup on the command and control host for the SSH is not a complicated process
    as well and is very similar to our on-premises box. The only real difference is
    the fact that the Kali image for the Raspberry Pi has some different defaults
    actions/settings compared to the default Kali image:


    +   1. Similar to the Raspberry Pi setup, we need to copy old keys and create
    new ones. Unlike the Raspberry Pi, the keys are not shared and should already
    be unique; however, I like to recreate them just in case (force of habit and a
    best practice for security):


    ![](img/095df2cd1930baecbcecaa51ee3417aa_65_0.png)'
  merge: -1
  img_proc: true
- pgno: 66
  md: '2. The default image of Kali Linux does not allow root login by default. You
    need to navigate to the /etc/ssh/ directory and edit the sshd_config file with
    your editor of choice. Find the line that says PermitRootLogin and change the
    response from no to yes. Save the file:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_66_0.png)


    3. Next, we will set SSH to start up on boot. It will not perform this by default.
    To accomplish this, we will run the following command:


    ```

    update-rc.d -f ssh enable 2 3 4 5

    ```


    4. Restart the SSH service and try a test SSH session to verify that everything
    is working correctly:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_66_1.png)'
