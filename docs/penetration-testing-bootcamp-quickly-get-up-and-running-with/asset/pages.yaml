    # Summary


    With us at the end of Day 4, let us go back and review what we have done. On day
    4, the main goal was to start probing the environment for vulnerabilities using
    our vulnerability scanner of choice, OpenVAS. With OpenVAS, we were able to create
    a scheduled scan with all the required variables that would, when finished, email
    me if there were any vulnerabilities found with a severity greater then 5. A great
    way to save some time.


    We then jumped into Metasploit to try and exploit some of the vulnerabilities
    that I discovered during the vulnerability scan. This allowed me to verify that
    the findings contained within the vulnerability scan were true. Verification is
    important, as we want to make sure we document what is really vulnerable and not
    just a false positive.


    Lastly, we also wanted to perform some social engineering tests to go after some
    browser-based security holes using BeEF as well as SET. Social engineering is
    an important phase in a penetration test, as the user is often the weakest link.


    In Chapter 5, Traffic Sniffing and Spoofing, we will focus on traffic sniffing
    techniques and spoofing. This will include using different traffic sniffing tools
    as well as understanding how to optimize my favorite traffic sniffing tool, tcpdump.
    Finally, we will cover spoofing tools and techniques that will allow us to perform
    some man-in-the-middle (MiTM) attacks.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 5


    # Traffic Sniffing and Spoofing


    Understanding traffic flow on the network will give you better understanding of
    not only what is going on within the network, but will also give you clues as
    to what you may want to go after during the penetration test. Traffic sniffers
    allow us to monitor or capture traffic on the network to see what is happening
    among the hosts on the network. They work in a couple of different ways, depending
    on whether you are just looking at the traffic, or if you want to look and potentially
    change what you see before it ends up going to its ultimate destination. This
    is the whole idea around spoofing and **man-in-the-middle attacks** (**MiTM**),
    which we will discuss in this chapter.


    The following topics will be discussed in this chapter:


    +   - Traffic sniffing tools and techniques

    +   - Tcpdump and filters

    +   - Understanding and performing spoofing attacks

    +   - MiTM attacks


    # Traffic sniffing tools and techniques


    Being able to see what is happening on the network is not only important for understanding
    traffic patterns and flow, but also to see where issues may be or even understand
    what may become a target. For example, if I am on the network, and sniffing traffic
    as a penetration tester, and I notice encrypted traffic going somewhere, I may
    try to understand what more is going on.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'I could attempt MiTM on that connection to try and harvest information to verify
    that the user pays attention to whether the site is secure or not, or I may just
    try to see if the network has controls in place to even allow it. The other option
    is that I could just try and hijack the session. Obviously, as a penetration tester,
    I only want to see what I can and can''t do, so I can alert the stakeholders about
    what needs to be improved. But, as a hacker, I wouldn''t be so kind.


    There are a lot of sniffers out there, and you should find your favorite and go
    with that one. However, before we talk about sniffer options, let me talk about
    different sniffing types.


    For the most part, there are two different traffic sniffing methods out there:
    passive and active. The most common uses are passive techniques. In this scenario,
    you are simply just looking at the traffic. This can be for troubleshooting purposes,
    network analysis, or just understanding flow on the ethical side. Unethically,
    you can use this type of sniffing to harvest credentials or steal information
    or passwords, just to name a few. The important thing is you are only looking
    and not touching. This would include utilizing programs such as Wireshark, tcpdump,
    and WinDump for protocol analysis such as ARP, TCP, and UDP. On the other hand,
    if you are looking at the traffic coming in one way and changing it before it
    goes back onto the wire, this is known as an active method. Typically, nothing
    good comes from active sniffing. This includes SSLStrip and dsniff. They change
    the information coming over the wire to accomplish tasks such as MiTM attacks.
    In this chapter, I will explore both cases so that I can show the various ways
    we can use tools for penetration testing.


    Before diving into sniffing, make sure you have a detailed understanding of the
    protocols you will be sniffing and spoofing. This is important because if you
    don''t understand the ins and outs of the protocols, you will not be able to understand
    what you are doing or why. For example, you should have deep knowledge of at least
    ARP, HTTP, TCP, and UDP, as most of the time, you will be working with these protocols.
    However, if you know you are looking at a particular protocol, do your due diligence
    and research of that protocol so that you know as much about it as possible.


    # Sniffing tools


    There are a bunch of sniffing tools available out there to use. A lot of tools
    you use will depend on the platform that you are on and ultimately what you are
    trying to do. The important thing is to find the one that you like to use the
    most and stick with it.'
  merge: -1
  img_proc: true
- pgno: 111
  md: "Getting packets to your sniffer can be accomplished in a couple of different\
    \ ways. One way is you can plug directly into a switch port that has been set\
    \ up as a SPAN port of some type. With this type of configuration, you will see\
    \ traffic on this SPAN port that matches the configuration you set up. Maybe you\
    \ have certain interfaces being SPAN'ed to that port or particular VLANs; however,\
    \ you have it configured; that will be the traffic which you see on that port.\
    \ The benefit of this method is that you will see any traffic you want as long\
    \ as you configure the SPAN port correctly to your needs.\n\nThe other option\
    \ is to run a sniffer based on traffic you are seeing off of your local network\
    \ connection. This is the easy method as you can start sniffing traffic as soon\
    \ as you have an active connection. The only downfall is you will only see what\
    \ is on that particular Layer 2 network and either sourced or destined for your\
    \ host (unless, they are things such as broadcasts and ARP messages). Now, of\
    \ course, there are ways to change this behavior and listen to other hosts on\
    \ that same Layer 2 network using techniques such ARP poisoning and spoofing,\
    \ but I will cover that later.\n\nThe following sections covers some of the tools\
    \ that I use in my lab all the time, depending on what I want to do with sniffing.\n\
    \n# Tcpdump\n\nTcpdump is my favorite network utility of all time. It is a CLI-based\
    \ packet-capturing utility, and a very powerful utility at that. Tcpdump allows\
    \ us to look at any traffic, either live or precaptured, and perform deep analysis\
    \ on the full protocol stack from Layer 1 to Layer 7. You can see anything you\
    \ ever wanted to know about a packet with tcpdump.\n\nAs a security and network\
    \ guy, every time there was an issue, the network was always blamed. I would use\
    \ tcpdump to prove the network innocent almost every time. Remember, the network\
    \ doesn't ever lie, and tcpdump can prove its innocence.\n\nThe first thing you\
    \ will notice with tcpdump is that there are a lot of options:\n\n```\nUsage:\
    \ tcpdump [-aAbdDefhHIJKlLnNOpqRStUuvxX#] [ -B size ] [ -c count ]\n    [ -C file_size\
    \ ] [ -E algo:secret ] [ -F file ] [ -G seconds ]\n[ -i interface ] [ -j tstamp\
    \ type ] [ -M secret ] [ --number ]\n[ -Q in|out|inout ]\n[ -r file ] [ -s snaplen\
    \ ] [ --time-stamp-precision precision ]\n[ --immediate-mode ] [ -T type ] [ --version\
    \ ] [ -V file ]\n[ -w file ] [ -W filecount ] [ -y datalinktype ] [ -z command\
    \ ]\n[ -Z user ] [ expression ]\n```\n\nOne of the most important thing you can\
    \ learn about tcpdump is how to use filters. Without them, your screen will most\
    \ likely scroll so fast you will not be able to decipher anything. Let me go through\
    \ some of the filters I use all the time during penetration tests."
  merge: -1
  img_proc: true
- pgno: 112
  md: 'I can use the expressions to filter by individual host ip or hostname:


    ```

    tcpdump host 192.168.34.56

    ```


    or:


    ```

    tcpdump host www.thisismydomain.com

    ```


    We can also specify the SRC and DST hosts if we are looking for only a certain
    direction of traffic:


    ```

    tcpdump src 192.168.13.34

    ```


    or:


    ```

    tcpdump ''src 192.168.13.242 and dst 192.168.31.150''

    ```


    ![](img/095df2cd1930baecbcecaa51ee3417aa_112_0.png)


    Notice the use of the word AND. If you are combining expressions, you can use
    these typical keywords: AND, OR, and NOT. You can also perform an order of operations
    using parentheses. I tend to use an apostrophe as well when combining expressions,
    though it isn''t always required. This depends on the complexity of the expression.
    However, it''s a good habit to get into.


    I can also specify whole networks. This is very handy if I am not quite sure which
    hosts I want to look at or which hosts are the top talkers. This is done in the
    CIDR notation.


    ```

    tcpdump net 192.168.30.0/24

    ```


    You can specify this host as well using the /32:


    ```

    tcpdump net 192.168.33.3/32

    ```


    Specifying at the port or protocol is very important. Most of the time, you are
    looking for something very specific on a host or looking for a particular port
    for traffic. In this case, you will use filters such as these:


    ```

    tcpdump tcp

    tcpdump port 22

    tcpdump dst port 22

    tcpdump ''tcp and dst port 22''

    tcpdump ''tcp and dst port 22 and src port 53029''

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Now, with ports, protocols, and IP addresses already understood, let us combine
    all of them into a single filter to allow us to be very specific. This filter
    will look for SRC of TCP port 22 in the 192.168.1.0/24 network:


    ```

    tcpdump ''tcp and src port 22 and net 192.168.1.0/24''

    ```


    Sometimes you may not want to look at the traffic, and just want to record and
    either look at it later or dump off to your C&C server, which we have setup in
    Chapter 3, Setting up and maintaining the Command and Control Server. If this
    is the case, you can use the -w switch with the filename specified. I tend to
    use the .pcap extension, but .cap and .dmp are also somewhat common as well:


    ```

    tcpdump -w SSHcap.pcap ''tcp and dst port 22 and src port 53029

    net 192.168.1.0/24''

    ```


    Since we dumped the traffic to the file for reading it at a later date, there
    certainly needs to be a way to read those precaptured files. You can use the -r
    switch followed by the filename to read it into tcpdump:


    ```

    tcpdump -r SSHcap.pcap

    ```


    Here is an example of me running tcpdump on my network. I tend to use the -n flag
    as I don''t want IPs or ports resolved:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_113_0.png)'
  merge: -1
  img_proc: true
- pgno: 114
