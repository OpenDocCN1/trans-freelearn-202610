- pgno: 183
  md: '# 8


    # Web Application Attacks


    Web applications provide some of the greatest attack surfaces for organizations.
    With so many web applications that are publicly available for providing services,
    one must make sure they are secure. With millions of users utilizing these applications
    daily, and inputting all sorts of data into them, like personally identifiable
    information, credit card information, health information just to name a few, having
    a web application compromised leaves all that data available for the hacker.


    With that being said, there are a lot of moving pieces to web applications, so
    running a penetration test against them can be daunting. I have laid out a couple
    of different sections that I test when running a penetration test against web
    applications and included various tools to test within that category. These categories
    follow OWASP recommendations as some of the important pieces to verify during
    a penetration test. In case you are not familiar with OWASP, or the open web application
    security project, you can get more information here: https://www.owasp.org/index.php/Main_Page.
    In the simplest form, they are a nonprofit organization with the sole mission
    to make software security visible to all, so that individuals can understand them,
    and therefore, make better security decisions around web applications. OWASP does
    publish a top 10 every couple of years to really show application developers the
    current trends and threats to web applications. The last year published was 2013,
    and this year, 2017, a new list will be published later on in the year. The proposed
    list for 2017 includes the following:


    +   - Injection

    +   - Broken authentication and session management

    +   - XSS

    +   - Broken access control

    +   - Security misconfiguration

    +   - Sensitive data exposure

    +   - Insufficient attack protection'
  merge: -1
  img_proc: true
- pgno: 184
  md: '+   - Cross-site request forgery

    +   - Using components with known vulnerabilities

    +   - Under protected API''s


    We will cover the majority of attacks that are found within that list. Some items
    we covered in previous chapters but I wanted to get a good mix of attack types
    and tools that cover the spectrum of web application testing. The one thing to
    remember as well is that this list is by no means comprehensive. There are always
    other attacks that are out there, and this is changing on a constant basis. Keeping
    up with recommendations from OWAPS is always a best practice.


    The following topics will be discussed in this chapter:


    +   - Manipulation by client-side testing

    +   - Infrastructure and design weaknesses

    +   - Identity-based testing

    +   - Validating data, error handling and logic

    +   - Session management


    # Manipulation by client-side testing


    Client-side testing is an important concern when it comes to web applications.
    One needs not only to be worried about the ability for others to execute code
    within the client-side browser but also how that will affect the web server and
    applications. Client-side testing involves items like XSS (Cross site scripting),
    JavaScript execution and WebSockets to name just a few.


    Client-side issues are not new but with the increased amount of attention and
    security being added to protect against server-side attacks, hackers have moved
    to client-side attacks. Client-side attacks revolve around browser-based vulnerabilities
    that result from unpatched browsers, or zero-day vulnerabilities. Using the web
    application, one can try and attack the client-side machine, and gain a foothold
    on that client machine to do whatever they want. It is important for not only
    the client-side machine to be patched and have an up to date browser, but also
    the web application programmer to make sure they are securely programming the
    web application to not allow these attacks to happen.


    The following tools hit these concerns and can be used to verify whether some
    of these options can be performed. I will show examples of each of them in my
    lab, and how to get the most use out of them. I will also explain these attacks,
    and why they are important to protect against.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Cross-site scripting attacks


    Cross-site scripting, or XSS for short, is a form of web application vulnerability
    in which a user can inject scripts that will run on the client-side. These scripts
    tend to be malicious in nature, and are found all over the internet. They tend
    to occur where the input fields are not validating the input, or encoding it correctly.
    When that occurs, a malicious user can input the script into the fields, and when
    the form is submitted, the script will run.


    There tend to be two classifications of XSS attacks, stored XSS attacks and reflected
    XSS attacks both of which I will discuss further in the next two sections.


    # Reflected XSS attack


    A reflected XSS attack occurs when a script is reflected off the web server in
    order to run. The browser allows it to run since it believes it came from the
    trusted server. They tend to be reflected off the web server via things like error
    messages or search results. But, they can technically be reflected back via any
    response, as long as some of the input is sent to the web server. Reflected XSS
    attacks, or non-persistent XSS attacks, tend to be the most common XSS out there.


    For testing a reflected XSS attack, I will attempt to insert some code into the
    Name field within the website, so that when I hit the Submit button, it will run
    the code if the XSS attack is successful.


    First, I will browse to the site and verify the page works, and then look at the
    URL:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_185_0.png)


    Once I submit, I can see it outputs the name, and puts it in the URL as well after
    the name variable:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_185_1.png)'
  merge: -1
  img_proc: true
