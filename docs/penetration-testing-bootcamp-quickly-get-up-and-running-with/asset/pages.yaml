- pgno: 87
  md: '![](img/095df2cd1930baecbcecaa51ee3417aa_87_0.png)


    # Performing scans against the environment


    Before starting the process of scanning with OpenVAS, let''s first talk about
    the different types of scan. You will notice that there are many types, including
    those that mention the following keywords full: deep, fast, and ultimate. When
    I first went through them, I was confused as to the differences. The OpenVAS documentation
    does a great job in describing these options:


    +   - **Full and fast**: This scan exploits the majority of NVTs and uses information
    previously collected.

    +   - **Full and fast completed**: This scan exploits the majority of NVTs and
    uses previously collected information as well. However, there are some checks
    that may cause a shutdown of the service/remote system.

    +   - **Full and very deep**: This scan exploits most of NVTs but is slower because
    it doesn''t use previously collected information.

    +   - **Full and very deep ultimate**: This scan exploits majority NVTs but doesn''t
    use previously collected information, so it is slower. There are some that may
    cause a shutdown of the service/remote system.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'To start your vulnerability scan, you just need to enter the IP address in
    the **Quick start** box:


    +   1. After adding the IP address within this box, you can click on the **Start
    Scan** button, and you will see a task created similar to the following screenshot:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_88_0.png)


    ![](img/095df2cd1930baecbcecaa51ee3417aa_88_1.png)


    This task should start in a couple of minutes depending on the resources that
    are needed.


    +   2. Once the scan starts, you will see the progress bar go start to turn green
    showing the percentage completed. While it is scanning, you can, at any time,
    click on the scan name, and you will see the current report. This report will
    show all finished tests as well as the unfinished ones. You can certainly go in
    there and filter by **Severity** if you want to get a good idea of any vulnerabilities
    showing up. I typically start the scan and move onto something else, as the scan
    can take a while depending on the box you are scanning from. Once completed, you
    will see the status of your task as **Done**. You will also see the severity of
    the report among other things:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_88_2.png)'
  merge: -1
  img_proc: true
- pgno: 89
  md: '3. Clicking on Reports will also break down the different levels of severity
    found during the scan. This paints a nice picture (in this case it''s not so nice)
    of how seriously vulnerable the box is:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_89_0.png)


    4. To really get into the details of the report now, just click on the Date. This
    will take you into the report itself. Once in there, you can click on the Severity
    column to sort by the highest severity. This way you can prioritize what you respond
    to:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_89_1.png)'
  merge: -1
  img_proc: true
- pgno: 90
  md: '5. You can also click on the Vulnerability name to see what exactly that vulnerabity
    is about. For example, here is a description of one of the vulnerabilities found
    within the system:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_90_0.png)


    6. Another fantastic feature of OpenVAS is that it will display a potential fix
    if it knows of one. This is the column that has a puzzle piece as its name. If
    you find that one of the vulnerabilities you are vulnerable against has a fix
    icon, you can see within the details of the vulnerability whether there is a vendor
    fix, workaround, no fix available, or any mitigation techniques.


    7. Now, you have all the relevant information to start using Metasploit to target
    these vulnerabilities. However, before you jump in there, you want to make sure
    you continue to have a strong security profile; so you will automate these scans
    so that you can make sure they keep happening consistently and alert you if there
    are any vulnerabilities found with a certain severity level. To accomplish this,
    navigate to configuration and schedules and create a new weekly schedule:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_90_1.png)'
  merge: -1
  img_proc: true
- pgno: 91
  md: '8. Next, you need to set up alerting. For this, navigate to **Configuration**
    and select **Alerts**. On the alert screen, you need to create a new alert. Once
    there, you can configure the alert any way you want. I have mine set to alert
    on any severity with a score of **5.0** and up:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_91_0.png)


    9. Finally, before you are done prepping for setting up the task, you need to
    configure your target. This gets done in the **Configuration | Target** menu.
    Here, you will create a new target for **My LAMP Server**, with the IP address
    and other information, and save the target. My target list looks like the following
    configuration:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_91_1.png)'
  merge: -1
  img_proc: true
- pgno: 92
  md: '10. Now that you have all the prework done, you need to go into **Scan Management**
    to set up your scan and apply the schedule and alert. To do this, click on **Scan
    Management** and then **Tasks**. Once in **Tasks**, create a new task with all
    the variables you previously created. This should bring you to the screen where
    you can enter all the information about the scan task you want to automate:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_92_0.png)


    That should be it, as you will now have a working scheduled task on a particular
    host and have the correct alerting function all complete. There are some administrative
    tasks you will want to perform on a regular basis to make sure the feeds are up-to-date.
    Under the **Administration** menu, you will want to click on the three feed options
    to make sure you update the feed. This way you have the latest and greatest for
    any scan.


    Your scanning report may include false positives and false negatives. False positives
    are situations where the report will show something is open, but it will really
    not be open. This does happen from time to time. Other tests should reveal the
    truth about this port. As for false negatives, this is when a scanner shows a
    port as not open, but in reality it is. These tend to be more dangerous, as you
    will just assume that the port is closed and move on. Further testing and probing
    can reveal the truth about these ports.


    Now that we have our vulnerability test complete and report in hand, let''s review
    the vulnerability reports and start to plan on which target we want to try and
    exploit first. This is where **Metasploit** comes in, the next tool in our penetration
    tester toolbox.'
