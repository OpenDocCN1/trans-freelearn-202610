- pgno: 39
  md: '# DNS reconnaissance with DNSRecon


    DNSRecon is a handy DNS-based utility that lets you perform various reconnaissance
    exercises on DNS records. First, you can enumerate DNS records for all the different
    types, check for any cached entries, and check for zone transfers or even enumerate
    Google for additional zone files.


    DNSRecon is not a complicated utility, but it is a powerful one and can save you
    a lot of time with other tools manually. There are some command-line options with
    the `dnsrecon` package, so definitely check out the main page to see what is relevant
    in your environment. I typically use the `-g` switch to do a Google enumeration.
    This finds additional subdomains that reference the main domain that I am looking
    for. This saves me a lot of time having to look through Google manually. This
    is a great way to automate some of that `google-fu`, which can yield some great
    information.


    Here is an example in the lab using the `-g` switch. You will notice that in the
    first part of the command, standard information is given. The google enumeration
    is found later. The following is the general enumeration found via DNS lookup:


    ```

