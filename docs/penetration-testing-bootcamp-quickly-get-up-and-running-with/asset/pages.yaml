- pgno: 154
  md: '# 7


    # Attacks on the Network Infrastructure


    Understanding the potential flaws or security issues within the infrastructure
    is key to a strong security policy. If these flaws are found by the bad guys,
    they can attack the infrastructure and render the network inoperable, or worse,
    use them as a tool to attack others. As penetration testers, it is important that
    we also look at the complete overall infrastructure to make sure that we find
    and notify on any issues that may exist.


    In this chapter, we will be going through various utilities to check the security
    posture of the infrastructure. This will include both, the wired and wireless
    infrastructure. With the onslaught of undefined devices within the enterprise,
    it is more important than ever to make sure that they are not creating any security
    issues. We will also touch on the physical security as well, as the company may
    have all the security controls in place but if someone can just walk into the
    building and steal the assets, then the security plan is definitely a big fail.


    The following topics will be discussed in this chapter:


    +   - Wired-based attacks

    +   - Checking the air

    +   - Bluetooth probing

    +   - Physical security considerations'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Wired-based attacks


    Hackers don''t just show up, plug into the environment, and start hashing passwords
    to gain access into a server. There is a lot of time and effort they have to expel,
    for them just to get a foothold within the environment before they can get what
    they are ultimately looking for. To gain this foothold, often times, there are
    attacks on the infrastructure, which allow them to gain that entry point, establish
    that foothold, and move within the infrastructure from there.


    The following sections will show some of the utilities and attacks on the wired
    infrastructure. Most of these can be prevented with the right configuration in
    place on the network-infrastructure side.


    # snmp-check


    SNMP is a very popular protocol for network monitoring. Pretty much every single
    network device supports it, and in some way or another, has it enabled by default.
    This is where we, the penetration testers, come in. SNMP can provide great information
    for an organization about their infrastructure and the device it''s running on.
    But, if set up incorrectly or using default information, it can provide other
    non-employees that same information. This information can be used to further understand
    and attack the network, so you definitely want to limit who can do what and see
    what.


    snmp-check is a utility to enumerate an snmpwalk to grab a bunch of userfull information
    about the environment. There are very few configuration options to configure,
    which makes it a nice and straightforward tool to use:


    ```

    root@kali:/root# snmp-check -h

    snmp-check v1.9 - SNMP enumerator Copyright (c) 2005-2015 by Matteo Cantoni (www.nothink.org)

    Usage: snmp-check [OPTIONS] <target IP address>

    -p --port      : SNMP port. Default port is 161;

    -c --community : SNMP community. Default is public;

    -v --version   : SNMP version (1,2c). Default is 1;

    -w --write     : detect write access (separate action by enumeration);

    -d --disable_tcp : disable TCP connections enumeration!

    -t --timeout   : timeout in seconds. Default is 5;

    -r --retries   : request retries. Default is 1;

    -i --info      : show script version;

    -h --help      : show help menu;

    ```'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'I typically scan the environment for the default string in most cases of public.
    This way, I can include it in my findings. Here is the syntax of my command and
