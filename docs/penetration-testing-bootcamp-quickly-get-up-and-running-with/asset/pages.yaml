- pgno: 207
  md: '# Error handling issues


    Using OWASP ZAP, you can also check for error handling issues within the web application.
    You want to be able to give the user some sort of knowledge of what the issue
    may be, but not disclose too much information. For example, if someone is trying
    to log into a web site, and their password is wrong, you don''t want to tell the
    user the password is incorrect, as that would let the other person know that the
    user name is correct, just not the password. How you would handle this would be
    to just say that the login credentials are incorrect.


    Using OWASP, you can also scan for Error Disclosure issues. Below is a scan from
    the lab, and you will notice it found some of the issues:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_207_0.png)


    If I browse to one of those pages, you can see that I just don''t get a 404 page
    not found, I get some additional information which probably should be disclosed
    to the user as seen below:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_207_1.png)'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'In theory, the error messages should be generic and let you know the page isn''t
    there, but not divulge any other information, similar to the page below from google.com.
    Now we still get a 404 error, so we know that page doesn''t exist, but it is not
    giving us any additional information which is better than the above example:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_208_0.png)


    # Session management


    Making sure others can''t hijack your session while using a web application is
    important. Otherwise, they would be able to not only see what you are doing, but
    be able to buy items with your information. It is important for web applications
    to have safeguards in place to prevent session hijacking from occurring. Sessions
    can come in all types. For example, they can use cookies, or within the URL, or
    even with a hidden field. No matter the session type, they should remain unique
    to a user, and not be able to be stolen or seen by another user.


    Using some of the following utilities, I will test some of the web applications
    for any session hijacking issues.


    # Burp suite with intercept


    Burp suite is a pretty comprehensive product, with many functions that do a ton
    of different things. The functions are listed at the top, and include items like
    Proxy, Spider, Intruder, Repeater etc. Since we are talking about manipulating
    sessions, we will use the Proxy and Intercept functions. This will allow us to
    try man-in-the-middle connections and steal session information. The other functions
    allow for other, very powerful ways to test your web applications as well, but
    are beyond the scope of this session management section. For information on those
    sections, you can check out the burp suite help page: https://portswigger.net/burp/help/suite_burptools.html.'
  merge: -1
  img_proc: true
