- pgno: 245
  md: '# Building the report


    Now that we have talked about the layout for the penetration testing report, it
    is just a matter of taking all the information that we obtained and putting it
    into our logical structure we just talked about.


    Typically, start with your first draft. The first draft will always be the hardest,
    but most of the time and effort go into this step. Start with the sections you
    feel you are ready for and go back to the others as you finish the ones you are
    most comfortable with first. I tend to follow the following process:


    +   1. Start by putting all the main headings in first.

    +   2. Then, go back and put all the main sections within the heading next.

    +   3. Go and work on the sections you are most comfortable with first. Jump around
    to get the sections you are comfortable with done first.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_245_0.png)


    Make some sort of visual mark at any part of the document if you need to add something
    there later. This way, you know you need to go back there at a later date to either
    add a graphic or text or make any change. I always use this character set to denote
    a section that is still a work in progress (XXXX). This way, I can just do a search
    within the document to see whether any of these group of characters exist prior
    to me calling a document complete.


    +   4. Finally, go through all sections and fill them out completely.

    +   5. Once completed, step away from the work. I typically wait a day or so to
    go back and reread my first draft. This way, my mind is fresh.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_245_1.png)


    I have had situations when I have edited my first draft right after writing it
    and have had incorrectly worded statements since the content was so fresh in my
    mind; my mind read the words correctly even though they were laid out wrong on
    the page.


    +   6. Once you complete reading and editing your first draft, have another team
    member read over the document for editing. This is always a great idea to make
    sure wording and thoughts are complete.


    At this point, you should have a pretty polished report ready for the next step,
    which is to deliver the report to the stakeholders.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Delivering the report


    With the report completed, it is now time to deliver it to the original stakeholders
    as our final deliverable. How and to whom you deliver it to should be defined
    in the original scoping meeting. This is an important process, as the document
    we create can contain sensitive information that you wouldn’t want to be leaked
    out to anyone. If this information got into the wrong hands, such as hackers,
    they would know all the weaknesses and exactly where to attack.


    The first step is to decide whether the report needs to be delivered electronically,
    physically, or a combination of both. Let us start with electronically. In this
    digital age, protecting the documents is of utmost importance. Encryption of some
    type needs to be considered. This tends to be a symmetric key that is shared over
    some other type of medium or maybe prearranged earlier in the conversation. This
    way, if a digital copy leaks out, they would need the key to be able to read it.
    Also, make sure that the key isn’t guessable, and you need to ensure that the
    key is strong. We talked about the importance of strong passwords in Chapter 6,
    Password-based Attacks.


    If you want even more security, you can implement asymmetric encryption to protect
    the document. This will require implementation of digital certificates for encryption
    and decryption. Though a much more complicated setup, definitely about as secure
    as it comes with document encryption.


    If a physical copy is required, the best option is to make sure it is printed
    internally within the company. However, depending on the size of the company and
    on the size and number of copies needed, you may need to seek help externally.
    If this is the case, use a trusted vendor for all your external printing. There
    are companies out there that specialize in secure printing. Go through and check
    out a couple of them to see whether one of them meets your needs more than the
    other.


    Now that you have the reports printed, you need to ensure you can deliver them
    to their final destination securely. If you are lucky, you can deliver them by
    hand, since they may be within a reasonable travel distance. This is your best-case
    scenario since you don’t have to worry about the delivery being stolen or lost.
    However, if this isn’t the case, you definitely need to consider secure delivery.
    There are many secure delivery vendors out there, so you may need to do your research.
    No matter who the vendor may be, always require a signature to make sure that
    someone in the organization signs for delivery, and always get a tracking number.
    This way, you can verify with the contact at the organization that the package
    was delivered.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Summary


    We are now done with day 10, the last day in this penetration testing bootcamp,
    so let us recap. First, we talked about gathering all that data that we had been
    collecting over the entire engagement. This included taking the unstructured data
    and putting it into a structured layout that allows for easier migration toward
    the end product.


    Risk, and how important it is to define it, was the next topic at hand. I referenced
    the NIST risk standard to help show how risk is defined, as well as showing how
    risk can change, with an example of the same vulnerability in two different environments.


    Next, we touched on the structure of the penetration test, which is arguably one
    of the most important sections in this chapter. Here, I laid out the various sections
    within the penetration report, which are listed as follows:


    +   - Cover Sheet

    +   - Table of Contents

    +   - Executive Summary

    +   - Scope of Project

    +   - Objectives of the Penetration Test

    +   - Description of Risk rating scale

    +   - Summary of Findings

    +   - Detailed Findings Conclusion

    +   - Appendix A - Tools Used

    +   - Appendix B - Attached Reports

    +   - Appendix C - Attached Diagrams About your Company


    Next, we moved toward building the actual report. This included some of my best
    practices based on experiences that I have observed over time. Finally, we talked
    about delivering the finalized product to the stakeholders as our final deliverable.


    I was about to say, in the next chapter, but this chapter concludes this book.
    Hopefully, you are better able to understand the penetration testing process based
    on these last 10 days/chapters. The information found and delivered in this book
    should enable you to go through the penetration testing process confidently and
    more informed. Take the information you learned throughout the book and get management
    approval to run some internal penetration tests to hone your skills and create
    a stronger security position for your organization.'
  merge: -1
  img_proc: true
