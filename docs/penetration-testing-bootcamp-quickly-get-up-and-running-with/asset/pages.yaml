    This is a very easy way to grab and use other users'' session information so that
    you don''t have to login to these applications yourself.


    # Summary


    We are now done with day 8, so let us recap. We talked about various OWASP categories
    for web application security, including infrastructure and design weaknesses,
    identity-based testing, validating data/error handling and logic, session management,
    and finally, manipulation with client-side testing. I used various tools in my
    lab to search web applications that had issues located in each of these categories.
    These tools all ran within Kali Linux, and provided large amounts of information
    for the issues they disclosed.


    In the next chapter, I will talk about how to get out of the environment and clean-up
    since the penetration test is coming to an end. This is an important task, as
    we don''t want to leave any findings or information behind. Plus, we want to make
    sure we leave the environment how we found it prior to the penetration testing.


    I will touch on how to clean up the trails we leave behind, as well as covering
    our tracks and destroying any equipment that we may need to. A lot of this will
    ultimately depend on the initial engagement discussed with the stakeholders.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 9


    # Cleaning Up and Getting Out


    With us coming toward the end of our engagement with the stakeholders, and all
    the tests having been performed, it is time for us to do any necessary housekeeping
    we need to do and then get out of the environment.


    It is important to make sure we leave the environment just like it was before
    we started the penetration test. The software should be the same as prior to the
    testing as well as the hardware. There should be nothing new that we introduced
    into the environment that we don''t undo. Our job is to hand over the findings
    and documentation to the stakeholders and have them perform any remediation that
    they feel is necessary based on their schedule and priorities.


    The following topics will be discussed in this chapter:


    +   - Covering your tracks

    +   - Cleaning up any trails left behind

    +   - Destroying equipment


    # Cleaning up any trails left behind


    One of the most important things we can do, as penetration testers, is to leave
    the environment in the same shape it was prior to the engagement. This means we
    need to make sure anything we had on the systems has been removed. This list is
    just some of the things that we need to do as responsible penetration testers:


    +   - Remove any user or system accounts that were created for any tests or procedures.
    We don''t want to leave any unmonitored accounts.

    +   - Remove any exploits, backdoors, rootkits, or malware that we may have left
    behind as part of our testing.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '+   - Remove any test evidence that was left on the servers during our tests.
    We should have transferred these to our C&C server for safekeeping, but there
    may have been times when this wasn''t possible. So, we want to make sure none
    of this is left behind.

    +   - Remove any tools or scripts that were used during any of the tests. We don''t
    want anyone else to use our tools against the company after the fact.

    +   - Make sure any systems that were modified or changed are set back to factory
    defaults. This can be done via restoring the gold image we made prior to updating
    that system, restoring it from the last backup of files or the system, or just
    changing the values back to their original values. How and what we do will ultimately
    be dependent on what the stakeholders wanted us to do.

    +   - Remove any and all equipment that we used during the penetration test that
    doesn''t belong to the customer. This could be cables, computers, and other devices.

    +   - Remove any commands from log files that may indicate what you have done.

    +   - Clear any network layer logs so that no one will know where and when you
    were in the environment.


    # Covering your tracks


    After finishing all the tasks on the various servers for our penetration test,
    it is our job now to cover our tracks. We want to make sure that we don''t leave
    any evidence around of what we did and where we did it. To accomplish this, let
    me show you some utilities that you can use to help clean up any traces of what
    you did.


    # Clearev with Metasploit


    Within Metasploit, there is a script that will clear out Windows event logs. It
    will clear all event logs that are contained on the system. It saves a lot of
    time and manual effort with one command. Packaging this utility inside Metasploit
    is tremendously smart.


    The one caveat is that it''s only supported if you have compromised a Windows
    system. When you compromise any other operating system, this particular menu item
    will not be available.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'The process for using clearev is quite easy. You first need to compromise a
    Windows host of some sort. Once you have performed this, you will arrive at the
    following prompt:


    ```

    meterpreter >

    ```


    Once you are at this prompt, you will know you have successfully compromised a
    host. To see what options you have available, type help at the prompt to see all
    your available options. If the host is a Windows machine, you should see the clearev
    option under the System section. To clear out those logs, just type the command
    clearev at the meterpreter prompt. There are no arguments to pass. Here is the
    process that I followed in my lab:


    ```

    meterpreter > clearev [*] Wiping 45 records from Application... [*] Wiping 219
    records from System... [*] Wiping 5 records from Security...

    meterpreter >

    ```


    Based on the output, you can see what logs have been cleared as well as how many
    messages were removed.


    # Shredding files with shred


    When you really need to make sure that your files and partitions are gone, you
    may want to use shred. Unlike rm, which only removes the pointers, shred overwrites
    the file multiple times to try and make sure it is recoverable using any tools.
    This holds true for whole partitions as well.'
  merge: -1
  img_proc: true
- pgno: 217
  md: "Shred is one of my favorite commands for clearing files. There are a couple\
    \ of options available for shred; let's see the following output for the options:\n\
    \n```\nroot@pi-kali:~# shred --help\nUsage: shred [OPTION]... FILE...\nOverwrite\
    \ the specified FILE(s) repeatedly, in order to make it harder\nfor even very\
    \ expensive hardware probing to recover the data.\n\nIf FILE is -, shred standard\
    \ output.\n\nMandatory arguments to long options are mandatory for short options\
    \ too.\n -f, --force    change permissions to allow writing if necessary\n -n,\
    \ --iterations=N  overwrite N times instead of the default (3)\n     --random-source=FILE\
    \  get random bytes from FILE\n -s, --size=N   shred this many bytes (suffixes\
    \ like K, M, G accepted)\n -u             truncate and remove file after overwriting\n\
    \     --remove[=HOW]  like -u but give control on HOW to delete;  See below\n\
    \ -v, --verbose  show progress\n -x, --exact    do not round file sizes up to\
    \ the next full block;\n                this is the default for non-regular files\n\
    \ -z, --zero     add a final overwrite with zeros to hide shredding\n     --help\
    \     display this help and exit\n     --version  output version information and\
    \ exit\n\nDelete FILE(s) if --remove (-u) is specified.  The default is not to\
    \ remove\nthe files because it is common to operate on device files like /dev/hda,\n\
    and those files usually should not be removed.\nThe optional HOW parameter indicates\
    \ how to remove a directory entry:\n'unlink' => use a standard unlink call.\n\
    'wipe' => also first obfuscate bytes in the name.\n'wipesync' => also sync each\
    \ obfuscated byte to disk.\nThe default mode is 'wipesync', but note it can be\
    \ expensive.\n```\n\nIn my lab, I want to shred the auth.log file, but I also\
    \ want to remove the file. To do this, I will run the following command:\n\n```\n\
    shred -vfzu auth.log\n```"
