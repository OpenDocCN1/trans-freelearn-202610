    # File utilities


    There are some great file utilities out there to make sure that files are compressed
    as much as possible. I tend to rely on file utilities that will compress; or if
    compression won''t help, then they should be able to split files into more manageable
    parts. These utilities include tar, Zip/Unzip and Split.


    # Playing with tar


    tar is one of the most useful tools that come installed by default in most Linux
    distributions. There is a lot of power in tar; however, it can have a little bit
    of a learning curve with the wide number of switches you can use with it.


    To compress a file using tar, I tend to use the following command:


    ```

    tar -zcvf <newfilename.tar.gz> <filetobcompressed>

    ```


    -z will compress the resulting tar file even further using gzip. -v turns on verbosity
    so that I can see what is going on. The -c flag will compress the file, and finally,
    the -f switch will inform tar that I will be specifying the file to be compressed.
    Here is a working example of using tar to compress:


    ```

    JABELTRA-M-V0B5:~ jabeltra$ tar -zcvf system.log.tar.gz system.log

    a system.log

    ```


    To decompress the file, it''s a very similar setup, just one change in the switch.
    Here is a syntax I use for decompressing zip files:


    ```

    tar -xvf <compressed file>

    ```'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'The only difference here is the use of -x, which lets tar know that the file
    will be extracted. Here is an example screenshot of tar being used to decompress
    or extract a file:


    ```

    JABELTRA-M-V0B5:~ jabeltra$ tar -xvf system.log.tar.gz

    x ./._system.log

    x system.log

    ```


    # Split utility


    Split is a very handy utility to break up a file into more manageable pieces before
    we transfer it to our C&C server. This will allow us to be more efficient on bandwidth
    and the time spent on the wire, and go unnoticed as much as possible. It is less
    likely that someone will notice a consistent 1 MBps versus consistent 10 MBps
    spikes.


    The split utility is very easy to use. To use this command, you enter the split
    command, followed by the size of each file, the file to be split, and the final
    name of the split files:


    ```

    split -b <size k|m> <filetobesplit> <nameofsplitfiles>

    ```


    In the following screenshot, I will split the log file called system.log into
    a more manageable size of 1 MB and call it system.log.split. This will end up
    creating four files called system.log.splitaa-system.log.splitad. I will then
    just transfer the files securely over my stunnel tunnel to my C&C server using
    my transfer script:


    ```

    JABELTRA-M-V0B5:~ jabeltra$ split -b 1m system.log system.log.split

    JABELTRA-M-V0B5:~ jabeltra$ ls -al | grep system.log.split

    -rw-r--r-- 1 jabeltra staff 1048576 Jan 22 17:38 system.log.splitaa

    -rw-r--r-- 1 jabeltra staff 1048576 Jan 22 17:38 system.log.splitab

    -rw-r--r-- 1 jabeltra staff 1048576 Jan 22 17:38 system.log.splitac

    -rw-r--r-- 1 jabeltra staff 1003173 Jan 22 17:38 system.log.splitad

    ```


    To put it all back together on the other side, I utilize the cat command. This
    utility basically concatenates the files together back into one. The syntax is
    as follows:


    ```

    cat <fileaa fileab fileac filead> > <final file name>

    ```


    Here is a screenshot of me putting the files back together on the remote side:


    ```

