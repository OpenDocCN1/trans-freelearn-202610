    # Stored XSS attack


    The other type of cross-site scripting attack is the stored XSS attack. For these,
    the script is injected into fields which are stored on the target servers. These
    include items like a guestbook, message forum, visitor logs, or databases. The
    victim will then retrieve the information as well as the script, and the malicious
    script will then run. Stored XSS, or persistent XSS, tend to be not as common,
    but they also tend to be more devastating.


