    aan

    ```


    # Online locations


    Even though you have the ability to create your own wordlists and rainbow tables,
    there are many sites online that you can go to get pre-built lists. Having other
    lists ready for you to use saves time and processing power. Like anything else
    on the Internet, make sure you are getting these lists from valid and legitimate
    sites. The following are two examples of such sites:


    +   - Openwall: http://download.openwall.net/pub/passwords/wordlists/

    +   - Hashcat: https://hashcat.net/wiki/doku.php?id=example_hashes


    Another popular trend nowadays is to create target-based wordlists.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'How are these different from the other wordlists we created earlier? Well,
    they tend to be used for a particular target that we know may have a particular
    set of words that they are using for their passwords as opposed to a random list.
    These wordlists are used for very specific attacks against a particular person,
    so they are a targeted attack. Using various tools, you can influence the wordlists
    generated by specifying certain words that you believe are part of that user''s
    passwords. Examples can be pets names, names of children, other family names,
    vacation spots, and so on. These are just a few of the possible options. These
    attacks tend to be very successful, since you already have some idea of the user''s
    possibly password, but they do require background research and possible social
    engineering to gain this type of knowledge ahead of time. CUPP is a very popular
    tool for this type of wordlist, and can be obtained here https://github.com/Mebus/cupp.git.


    # Cracking utilities


    Password cracking can be defined as the process of recovering a password based
    on data that has either been stored on a system or has been transmitted by one.
    There are many different techniques to accomplish this feat, including some of
    the following types:


    +   - **Brute-Force attack**: Systematically trying out as many combinations of
    characters as possible against the password.

    +   - **Dictionary attack**: Using words from a dictionary in a utility to try
    and figure out the password.

    +   - **Rainbow table attack**: Uses rainbow tables to try and match hashes found
    in the operating system''s password hash files. Rainbow tables have hashes and
    the corresponding passwords.

    +   - **Password guessing**: Using a knowledge of the end user to try and figure
    out their password based strictly on a best guess.

    +   - **Phishing attacks**: Tricking users into entering their credentials, or
    stealing the credentials from them.


    Using the following tools, I will demonstrate some of these techniques to see
    if I can crack some passwords on my lab network.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# John the Ripper


    John the Ripper is a fast and feature-rich password cracking utility that is designed
    to work on many different hash types and systems. This is why it is such a widely
    used utility.


    Another cool little feature of John the Ripper is that it also contains some notification
    utilities that are designed to notify users of either their weak password or the
    fact that John the Ripper has actually cracked it. This information is great for
    a penetration tester to include in the final penetration report to the stakeholders.
    But enough with the features; let''s see how we can use this utility.


    The first task you should perform is to look at the main page for John the Ripper.
    There are lots of command-line switches that allow you to change the functionality
    of the utility depending on the type of system you are looking to crack. Here
    is the syntax of John the Ripper:


    ```

    john [OPTIONS] [PASSWORD-FILES]

    ```


    Here is a list of the various options:


    ```

    --single=[SECTION]          "single crack" mode

    --wordlist=[FILE] --stdin   wordlist mode, read words from FILE or stdin

    --pipe                      like --stdin, but bulk reads, and allows rules

    --loopback=[FILE]           like --wordlist, but fetch words from a .pot file

    --dupe-suppression          suppress all dupes in wordlist (and force preload)

    --prince=[FILE]             PRINCE mode, read words from FILE

    --encoding=NAME             input encoding (eg. UTF-8, ISO-8859-1). See also doc/ENCODING
    and --list=hidden-options.

    --rules=[SECTION]           enable word mangling rules for wordlist modes

    --incremental=[MODE]        "incremental" mode [using section MODE]

    --mask=MASK                 mask mode using MASK

    --markov[=OPTIONS]          "Markov" mode (see doc/MARKOV)

    --external=MODE             external mode or word filter [not available]

    --stdout[=LENGTH]           just output candidate passwords [cut at LENGTH]

    --restore=[NAME]            restore an interrupted session [called NAME]

    --session=NAME              give a new session the NAME

    --status=[NAME]             print status of a session [called NAME]

