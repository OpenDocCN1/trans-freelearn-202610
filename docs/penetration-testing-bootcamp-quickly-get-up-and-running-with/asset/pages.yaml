    # Bluetooth probing


    With numerous Bluetooth-capable devices making their way into the enterprise,
    Bluetooth scanning is becoming more and more important. Not only because of the
    numerous amount of devices that support Bluetooth, but hackers are placing their
    own devices within the network or enterprise to steal data using Bluetooth. Bluetooth
    is cheap and easy to use. This is the perfect driver for hackers. There have been
    Bluetooth skimming devices found in the wild, and because of this, credit card
    companies such as Visa recommend Bluetooth scanning on a regular basis, similar
    to the wireless testing in the past.


    Because of the importance of knowing what Bluetooth-capable devices are within
    the network space, I will do some Bluetooth discovery, testing, and attacks to
    see what information can be leveraged with the environment. I will use a bunch
    of different Bluetooth utilities to glean as much information as I can about the
    environment.


    # Bluelog


    Bluelog is a Bluetooth scanner that will look for signs of Bluetooth devices within
    the area. It is a great utility for understanding what is around you. Knowing
    what is around you will help in identifying possible malicious Bluetooth devices
    that may be hidden.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Bluelog is defined as a Bluetooth site survey tool, so having it run in a static
    location for a long duration will allow you to get a good profile of that area.
    This will be exactly how I will run it. The command itself is not overly complicated,
    but there are some options available:


    # Basic options:


    +   - `-i <interface> Sets scanning device, default is "hci0"`

    +   - `-o <filename> Sets output filename, default is "devices.log"`

    +   - `-v Verbose, prints discovered devices to the terminal`

    +   - `-q Quiet, turns off nonessential terminal outout`

    +   - `-d Enables daemon mode, Bluelog will run in background`

    +   - `-k Kill an already running Bluelog process`

    +   - `-l Start "Bluelog Live", default is disabled`


    # Logging options:


    +   - `-n Write device names to log, default is disabled`

    +   - `-m Write device manufacturer to log, default is disabled`

    +   - `-c Write device class to log, default is disabled`

    +   - `-f Use "friendly" device class, default is disabled`

    +   - `-t Write timestamps to log, default is disabled`

    +   - `-x Obfuscate discovered MACs, default is disabled`

    +   - `-e Encode discovered MACs with CRC32, default disabled --b Enable BlueProPro
    log format, see README`


    # Advanced options:


    +   - `-r <retries> Name resolution retries, default is 3`

    +   - `-a <minutes> Amnesia, Bluelog will forget device after X time`

    +   - `-w <seconds> Scanning window in seconds, see README`

    +   - `-s Syslog only mode, no logfile, default is disabled`


    Before running bluelog, you need to make sure that your system sees the Bluetooth
    interface and it''s functional. You can accomplish this using the hciconfig. Here
    is the output from my system:


    ```

    root@pi-kali:~# hciconfig

    hci0:      Type: Primary  Bus: USB       BD Address: 00:1A:7D:DA:71:10  ACL MTU:
    310:10  SCO MTU: 64:8   UP RUNNING      RX bytes:1232  acl:0  sco:0

    events:74  errors:0     TX bytes:2858  acl:0  sco:0  commands:74  errors:0

    ```'
  merge: -1
  img_proc: true
