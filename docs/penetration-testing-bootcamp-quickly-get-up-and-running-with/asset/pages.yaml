    a good option to do a quicker scan, and grab user accounts that are using those
    bad passwords. Then, when time permit or at the same time, run the longer scans.
    My smaller wordlist scan took less than 1hr and grabbed the preceding password.


    Hydra is a great tool because it is easy, and has the ability to attack other
    services. The latest list of services as of this release includes TELNET, FTP,
    HTTP, HTTPS, HTTP- PROXY, SMB, SMBNT, MS-SQL, MYSQL, REXEC, irc, RSH, RLOGIN,
