- pgno: 160
  md: '# Denial-of-service checks


    Sometimes, the intention is not to break into the system or steal any sort of
    information, but rather take the infrastructure down. Systems within the network
    may handle large amounts of bogus traffic inefficiently, and therefore, cause
    the CPU and memory to rise to the point that the system becomes unstable or unusable.
    There are ways to prevent this on the infrastructure side, so I will be testing
    to see how the infrastructure responds to such events.


    # Various attacks with hping3


    hping3 is a packet generator utility and protocol analyzer that is extremely flexible.
    This utility can be used for a number of different tests. First, we will be testing
    embryonic connection limits on our firewalls. Embryonic connections are half-open
    connections, which means we are going to only send SYN packets and never respond
    after that. The goal is to fill the connection tables on the firewall with fake
    connections so that it fills up and cannot accept any more connections. Using
    hping3, I will generate a bunch of SYN connections against the firewall to see
    how it handles the embryonic connections. The hping3 has a lot of options and
    switches available for running it. So I will not be showing all the options, but
    rather just explain the switches that I will use.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_160_0.png)


    Prior to running any command for the first time, make sure to either check out
    the man page for the tool or run the command with something such as -help or /?.
    Commands and switches sometimes change when new versions are released.


    For running this test, I will be using the following syntax :


    ```

    Hping3 -c 30000 -d 120 -S -p 22 --flood 192.168.33.1

    -c - Number of packets to send

    -d - Size of the packet to send

    -S - SYN packets only

    -p - Port to use

    --flood - Send the packets as fast as possible

    ```'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'When I start running the command on my terminal window, I will also run a ping
    against an outside host to verify if the firewall is handling the connections
    correctly or not:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_161_0.png)


    You can see that what would normally be a 30 ms ping time is now over 200+ ms,
    and I am even starting to drop packets. This is a clear indication that the firewall
    is not set up to handle the embryonic connections correctly. A hacker could take
    advantage of this situation, so you want to make sure you note this in your end
    of engagement report.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_161_1.png)


    Mitigating these attacks involve connection limits on the appropriate security
    devices to limit the number of embryonic connections. You can also check out RFC4987
    for more information on how to mitigate SYN attacks at https://tools.ietf.org/html/rfc4987.


    # Land attacks with hping3


    Another test we can use with hping3 is to perform a land attack. A land attack
    is when you send a packet with the SRC and DST as the exact same IP address. This
    is an example of IP spoofing. The network infrastructure should be set up to deny
    spoofed packets. Using the best security practices, you should never have any
    traffic coming into your environment that has a SRC address of your IP space.
    This makes perfect sense, since by logic, traffic coming into your network shouldn''t
    be coming from your network.


    To test if spoofing is being allowed in your network, you can utilize hping3 to
    check this out. Here is the syntax that I will use for the land attack:


    ```

    hping -V -c 100 -d 40 -S -p 139 -s 80 -k -a 192.168.1.129 192.168.1.129

    -V <-- Verbose

    -c --count: packet count

    -d --data: data size

    -S --syn: set SYN flag

    -p --destport [+] [+] <port> destination port (default 0) ctrl+z inc/dec

    -s --baseport: base source port (default random)

    -k --keep source port still

    -a --spoof source address

    ```'
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/095df2cd1930baecbcecaa51ee3417aa_162_0.png)


    For the infrastructure protection against this mechanism, the infrastructure needs
    to have proper access control lists within the environment to not let SRC addresses
    through an interface, which they should never typically be seen coming from. For
    more information on protecting against this, you can check out BCP38 from the
    IETF at https://tools.ietf.org/html/bcp38.


    # Smurf attacks using hping3


    Smurf attacks occur when a spoofed source address sends a large amount of ICMP
    packets to the broadcast address. Hosts on that network will then respond back,
    as they are support to respond back to broadcast addresses. This causes a denial-of-service
    situation on the local LAN. Typically, you would want your network devices to
    not send a directed broadcast through the interface, so the packet is dropped
    and nothing bad occurs. But, if that infrastructure-based configuration is not
    set, the smurf attack will be successful.


    Utilizing hping3, here is the syntax for setting up my smurf attack on the network:


    ```

    hping3 -1 --flood -a 192.168.33.123 192.168.1.255

    ```


    +   - **-1 --icmp**: It is icmp mode

    +   - **--flood**: It send packets as fast as possible

    +   - **-a -spoof**: It source address


    Defending against this sort of attack is as easy as turning directed broadcasts
    off on the switchports and router interfaces within the environment. In a Cisco
    environment, the following commands will work:


    ```

    Router(config)#interface GigabitEthernet0

    Router(config-if)#noip directed-broadcast

    ```


    # MAC flooding with Macof


    MAC address flooding is a great way to render a network useless. Basically, through
    MAC flooding, you can turn the network into a large hub. MAC flooding works by
    essentially allowing the switch ports to learn as many MAC addresses as they see
    on their ports, and if no limits on in place, can fill up the TCAM space on the
    switch. Once this happens, switches turn themselves into hubs, since they can''t
    store the MAC for the port. They need to send every packet out to every switch
    to try and get the packet delivered.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Using a utility called macof, we can attempt to check if the appropriate switch
    port controls are in place by flooding the switch port we are connected to with
    as many MAC addresses as possible.


    The syntax of macof is as follows. Check out the man page or --help to get a full
    description of the available options:


    ```

    macof [-i interface] [-s src] [-d dst] [-e tha] [-x sport] [-y dport] [-n times]

    ```


    In my lab, to test this out, I will run the following command to check if I can
    use up all the TCAM space:


    ```

    macof -i eth0 -d 192.168.33.1 -n 1000000

    ```


    To protect against MAC address flooding, the key is to limit, as best you can,
    the number of MAC addresses allowed on a switch port. On Cisco devices, this is
    done with the switchport port-security set of commands. Here is a basic example
    of a Cisco switch:


    ```

    Switch(config)# interface gi 0/1

    Switch(config-if)# switchport mode access

    Switch(config-if)# switchport port-security

    Switch(config-if)# switchport port-security maximum 5

    Switch(config-if)# switchport port-security mac-address sticky

    ```


    # Wireless-based attacks


    With the proliferation of wireless networks, the increase in security of these
    networks has never been more important. As with the wired, wireless has its fair
    share of utilities to both, audit and attack the various hosts and networks. As
    a penetration tester, it is our job to make sure that the wireless networks are
    set up correctly and that there are no other networks that are in range and shouldn''t
    be there, as well as making sure that they are not interfering with the networks
    in-scope.


    In the following section, I will show examples of some of the wireless utilities
    that I use during penetration testing. There are a lot of great tools out there,
    and I could probably devote a whole book just going over them, but I wanted to
    select a sample that shows a variety of testing strategies.'
  merge: -1
  img_proc: true
- pgno: 164
  md: "# Cracking WPA2 with aircrack-ng\n\nThe aircrack-ng, in my opinion, is one\
    \ of the greatest wireless penetration tools out there. It can crack both, WPA\
    \ and WEP keys, by setting up a listening interface on the wireless interface,\
    \ sniffing traffic and handshakes, and then trying and cracking these keys. There\
    \ are many tools that come with aircrack-ng, including airbase-ng, aird ec ap-ng,\
    \ airdecloak-ng, and aireplay-ng. I will use some of these tools for my wireless\
    \ test.\n\nI will use aircrack-ng in the lab to try and crack a wireless guest\
    \ network that is using WPA to make sure that they are not using an easy-to-guess\
    \ passphrase. There are a couple of steps involved; let me walk you through these\
    \ now. I will assume that aircrack-ng is already installed:\n\n+   1. We need\
    \ to start up the wireless monitoring interface. To accomplish this, we need to\
    \ use the airmon-ng command, followed by the wireless interface you plan you to\
    \ use. In my case, it's wlan1.\n+   \n+   2. Next, we need to get a list of available\
    \ WLANs that are being seen. This way, we can select the appropriate WLAN for\
    \ packet and handshake capturing. To get this list, we can use the airodump-ng\
    \ command:\n\n```\nroot@pi-kali:~# airmon-ng start wlan1\nFound 2 processes that\
    \ could cause trouble.\nIf airodump-ng, aireplay-ng or airtun-ng stops working\
    \ after a short period of time, you may want to run 'airmon-ng check kill'\nPID\n\
    Name\n199 NetworkManager\n445 wpa_supplicant\nPHY     Interface       Driver \
    \     Chipset\nphy0    wlan0           ??????      Broadcom 43430\nphy1    wlan1\
    \           rt2800usb   Ralink Technology, Corp. RT5372\n(mac80211 monitor mode\
    \ vif enabled for [phy1]wlan1 on\n[phy1]wlan1mon)\n\n(mac80211 station mode vif\
    \ disabled for [phy1]wlan1)\n```\n\n![](img/095df2cd1930baecbcecaa51ee3417aa_164_0.png)\n\
    \nFor any processes that may interfere, you may want to stop them before proceeding\
    \ just to make sure there isn't any interference. You can use the kill PID command,\
    \ where PID is the process id of that interfering process.\n\n```\nroot@pi-kali:~#\
    \ airodump-ng wlan1mon\n```"
  merge: -1
  img_proc: true
