  md: 'To create a certificate for the site I will perform a MiTM attack against,
    I will run the following command from the CLI:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_132_0.png)


    ![](img/095df2cd1930baecbcecaa51ee3417aa_132_1.png)


    You will notice that I specified a wild domain (*.aol.com). Make sure you perform
    research on the domain you are looking to intercept. In this particular case,
    after hitting the main site, you are redirected to a different sub-domain when
    you log in. This certificate will cover all of them.


    Once the certificate is all set up, you need a mechanism to get it onto the end
    user''s machine. In this lab, we are going to assume the certificate is on the
    end user machine already. If for some reason it is not, they will still be able
    to log into the site and allow us to steal their credentials; the user will just
    get certificate errors.


    We need a way to make some `sysctl` changes as well as iptables for some redirecting.
    Similar to `sslstrip` and `arpspoof`, we need to make sure we are forwarding packets
    back on the wire. This should be already set based on prior configuration, but
    if not, here is the command I will use:


    ```

    ```

    Sysctl -w net.ipv4.ip_forward=1

    ```

    ```


    Next, I will redirect any ports I plan to listen on to the port I will run `sslsplit`
    on command. You could redirect HTTP, SMTP over SSL, or FTP, to name a few. I will
    be intercepting HTTPS, so I will redirect 8443:


    ```

    ```

    iptables -t nat -F

    ```

    ```


    ```

    ```

    iptables -t nat -A PREROUTING -p tcp --dport 443 -j REDIRECT --to-ports 8443

    ```

    ```'
