    # Enumerating DNS with dnsmap


    dnsmap is a fantastic tool to find subdomains within the domain you are looking
    for. It''s a great way to see whether other sites are publicly available (internally
    and/or externally) that may or may not be known. This allows you to potentially
    find and exploit a subdomain that may not be controlled or administered correctly.
    You can provide your own word list to look up against the subdomains, or you can
    use the built-in one. Some organizations offload some subdomains to third parties,
    so you need to be cautious how you use this information. The scope of work may
    only cover the company you are hired for; and therefore, you may not be looked
    upon so kindly by the other organization if you are trying to actively exploit
    it. This should be worked out in the stakeholders meeting, but sometimes things
    do slip through the floor. The following is a screenshot of the command-line options
    for dnsmap:


    ```

    ```

    root@kali:~# dnsmap

    dnsmap 0.30 - DNS Network Mapper by pagvac (gnucitizen.org)


    usage: dnsmap <target-domain> [options]

    options:

    -w <wordlist-file>

    -r <regular-results-file>

    -c <csv-results-file>

    -d <delay-millisecs>

    -i <ips-to-ignore> (useful if you''re obtaining false positives)


    e.g.:

    dnsmap target-domain.foo

    dnsmap target-domain.foo -w yourwordlist.txt -r /tmp/domainbf_results.txt

    dnsmap target-fomain.foo -r /tmp/ -d 3000

    dnsmap target-fomain.foo -r ./domainbf_results.txt

    ```

    ```'
