    # Physical security considerations


    Even though I am talking about the network infrastructure, I can''t go on without
    talking about physical security testing that needs to be done. Think about it,
    you could have all the firewalls, IPS units, VLAN segmentation you need, but if
    someone can walk right into the datacenter, turn off the server, un-rack it, and
    leave, those devices won''t help at all. This is why the major security standards
    out there such as PCI require physical security testing as well.


    Physical security testing isn''t as exciting as attacking the network infrastructure,
    but is just as important in protecting your infrastructure. The following are
    some of the major physical security points you will want to test.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Secure access


    Secure access is the foundation of physical security. Anywhere there is any sort
    of space that is not considered common space, there should be a mechanism to restrict
    access to that space based on the job role. This mechanism can be fob or badge
    reader of some sort, a biometric type device, or a combination of these. The ability
    to restrict access based on job role is key in preventing unwanted access to information
    that someone shouldn’t have access to.


    The job of a penetration tester is to walk around the facility, and see what room
    and spaces you are able and not able to get into. Make a note of all your finds.
    But, don’t stop there. Make friends with other employees, especially those who
    have access to places you cannot get into. Test to see if they will allow you
    to follow them in without scanning your badge or biometrics. This sort of action
    should be documented and reported. Employees should never let anyone else tailgate
    them. It should be a written rule within the company security policy that should
    be reviewed by employees on a yearly basis to make sure they are up to date on
    any changes.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_181_0.png)


    If the company deploys a two-factor authentication on some access, test this as
    well using someone’s badge and your fingerprint or vice versa. This is a great
    way to make sure that the systems are tied together correctly and are not just
    there for show.


    # Employee/vendor identification


    This is probably one of the easiest, cheapest, and yet powerful physical security
    controls one should have in place. Making sure everyone within the building has
    some sort of badge on them at all times as well as an easy way to distinguish
    between employees, contractors, and visitors. The visual indication is key, since
    if all visitors have a red badge and employees have white badges, and you notice
    a red badge in a secure area, you know to report that person.


    An easy test for this is to walk around the office and look for any signs of non-compliance
    of the policy. This process would include looking for anybody walking around without
    the correct form of identification. I would poll various people to make sure their
    badge matches their correct function (which means, are they truly an employee
    with the employee badge on, did they take someone else’s badge, or get issued
    the incorrect type?).


    The following screenshot is a great example of a visual difference between employee
    and visitors.'
  merge: -1
  img_proc: true
