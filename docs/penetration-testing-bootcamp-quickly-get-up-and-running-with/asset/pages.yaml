    # Validating data, error handling, and logic


    Having your web application collect data is extremely important, as that is typically
    the main reason why there is a web application. But how the system handles that
    data is very important, especially to security professionals. Web applications
    need to be able to handle the data they get in, but how they react to the wrong
    data being entered is something we want to test as a penetration tester. Sometimes,
    unwanted things happen to web applications when the wrong data is entered, and
    we want to make sure this doesn''t happen.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'We also need to make sure the data that is displayed to the user is also correct.
    You don''t want to give more information to a user than is necessary, or give
    information to that user that they shouldn''t see. A great example of this would
    be for a user to be able to see their account information for the ability to change
    their password. You wouldn''t want that user to be able to see all accounts.


    Error handling is also key. You never want to release information to a user that
    the user doesn''t need. One can potentially take this information and leverage
    it to find out more about how the application works. Therefore, we want to make
    sure errors and such are handled correctly by the application and don''t divulge
    any additional information to the users.


    Logic also plays a key role. If a user is supposed to follow a certain process
    to get from point A to point G, what happens if the user can skip steps and go
    right from point A to point G? Does the application break and stop the user? Or
    can certain steps be bypassed and potentially give escalated privileges? This
    is why testing the logic of an application is important.


    In the following sections, I will visit some tools that will show you how to test
    for validating data and error handling.


    # SQL Injection fun with Sqlmap


    SQLmap is a penetration tool used for detecting and exploiting SQL injection flaws.
    Once exploited, it can perform a bunch of actions against the database with various
    switches. This includes fingerprinting, list of databases, list of tables within
    those databases, and even dumping the full database out. It supports all the major
    database vendors out here, and has full support for six different SQL injection
    techniques. For more information, definitely check out http://sqlmap.org. Now,
    let us try and test our application for a SQL injection flaw, and if we find one,
    perform some tests to grab some data.'
  merge: -1
  img_proc: true
