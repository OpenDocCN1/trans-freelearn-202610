- pgno: 23
  md: '# Organization chart


    You may be wonder why an organization chart is a valuable and required piece of
    documentation for a penetration test. But when you think about it, people in higher
    positions tend to get targeted because they have the power to transfer money,
    or have access to important items. Knowing the chain of command for all employees
    within an organization allows us, as penetration testers, to see other individuals
    that can be targeted with the hopes of getting all the way to the top. This information
    can help show the penetration tester whom to potentially target first. It may
    be easier for a hacker to get a junior accountant to click on a link and install
    the malware for the hacker to have remote access than it would be for them to
    try the same approach with the CFO. Now, we are pretty sure the CFO will have
    more access compared to the junior accountant, but once you have a foothold within
    an organization, moving around becomes a lot easier. Remember: People are typically
    the weakest link in security.


    Here is a simple example of an organization chart:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_23_0.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Building the systems for the penetration test


    With a clear understanding of expectations, deliverables, and scope, it is now
    time to start working on getting our penetration systems ready to go. For the
    hardware, I will be utilizing a decently powered laptop. The laptop is a Macbook
    Pro with 16 GB of RAM, a 256 GB SSD, and a quad-core 2.3 GHz Intel i7 running
    VMware Fusion. I will also be using the Raspberry Pi 3. The Raspberry Pi 3 is
    a 1.2 GHz ARMv8 64-bit Quad Core, with 1 GB of RAM and a 32 GB microSD. Obviously,
    there is quite a power discrepancy between the laptop and the Raspberry Pi. That
    is okay though, because I will be using both these devices differently. Any task
    that requires any sort of processing power will be done on the laptop. I love
    using the Raspberry Pi because of its small form factor and flexibility. It can
    be placed in just about any location we need, and if needed, it can be easily
    concealed.


    For software, I will be using Kali Linux as my operating system of choice. Kali
    is a security-oriented Linux distribution that contains a bunch of security tools
    already installed. Its predecessor, Backtrack, was also a very popular security
    operating system. One of the benefits of Kali Linux is that it is also available
    for the Raspberry Pi, which is perfect in our circumstance. This way, we can have
    a consistent platform between the devices we plan to use in our penetration-testing
    labs. Kali Linux can be downloaded from their site at https://www.kali.org. For
    the Raspberry Pi, the Kali images are managed by Offensive Security at https://www.offensive-security.com.
    As for the various tools, we will talk about those as we use them in other chapters.


    Even though I am using Kali Linux as my software platform of choice, feel free
    to use whichever software platform you feel most comfortable with. In this book,
    we will be using a bunch of open source tools for testing. A lot of these tools
    are available for other distributions and operating systems.


    # Penetration system software setup


    Setting up Kali Linux on both systems is a bit different since they are different
    platforms. Since this is an intermediate-level book, we won''t be diving into
    a lot of details about the installation, but we will be hitting all the major
    points. This is the process you can use to get the software up and running.


    We will start with the installation on the Raspberry Pi:


    +   1. Download the images from Offensive Security at https://www.offensive-security.com/kali-linux-arm-images/.

    +   2. Open the Terminal app on OS X.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '3. Using the utility xz, you can decompress the Kali image that was downloaded:


    ```

    xz-d kali-2.1.2-rpi2.img.xz

    ```


    4. Next, you insert the USB microSD card reader with the microSD card into the
    laptop and verify the disks that are installed so that you know the correct disk
    to put the Kali image on:


    ```

    diskutil list

    ```


    5. Once you know the correct disk, you can unmount the disk to prepare to write
    to it:


    ```

    diskutil unmountDisk/dev/disk2

    ```


    6. Now that you have the correct disk unmounted, you will want to write the image
    to it using the dd command. This process can take some time, so if you want to
    check on the progress, you can run the Ctrl + T command any time:


    ```

    sudo dd if=kali-2.1.2-rpi2.img of=/dev/disk2 bs=1m

    ```


    7. Since the image is now written to the microSD drive, you can eject it with
    the following command:


    ```

    disk utile ject/dev/disk2

    ```


    8. You then remove the USB microSD card reader, place the microSD card in the
    Raspberry Pi, and boot it up for the first time. The default login credentials
    are as follows:


    ```

    Username:root

    Password:toor

    ```


    9. You then change the default password on the Raspberry Pi with the following
    command to make sure no one can get into it:


    ```

    Passwd<INSERTPASSWORDHERE>

    ```


    10. Making sure the software is up to date is important for any system, especially
    a secure penetration-testing system. You can accomplish this with the following
    commands:


    ```

    apt-get update

    apt-get upgrade

    apt-get dist-upgrade

    ```'
  merge: -1
  img_proc: true
