    # Protocol fuzzing with DotDotPwn


    DotDotPwn is a slick multi-protocol fuzzer to discover traversal directory vulnerabilities
    within web servers. Fuzzing is the testing technique of looking for poor coding
    or security loopholes in software applications such as web servers or even operating
    systems. Because of this, DotDotPwn makes a good reconnaissance tool for finding
    various issues within the web server stack that you can later exploit.


    Getting the most information about the environment now makes the exploitation
    phase much easier. We will note everything we can find and then exploit it at
    the appropriate time. Do not rush through the reconnaissance phase, as it will
    just lessen the overall quality of the penetration test. The more we can find
    now, the more we can exploit later.


    First thing to know about `dotdotpwn` is that it supports many different protocols
    or modules. We will focus on the `http` module during the lab but there are other
    modules available such as `tftp` and `ftp`. Here are the available switches when
    running `dotdotpwn` from the CLI:'
  merge: -1
  img_proc: true
- pgno: 57
  md: '```

    Usage: ./dotdotpwn.pl -m <module> -h <host> [OPTIONS]

    Available options:

    -m Module [http | http-url | ftp | tftp | payload | stdout]

    -h Hostname

    -O Operating System detection for intelligent fuzzing (nmap)

    -o Operating System type if known ("windows", "unix" or "generic")

    -s Service version detection (banner grabber)

    -d Depth of traversals (e.g. deepness 3 equals to ../../..; default: 6)

    -f Specific filename (e.g. /etc/motd; default: according to OS detected, defaults
    in TraversalEngine.pm)

    -E Add @Extra_files in TraversalEngine.pm (e.g. web.config, httpd.conf, etc.)

    -S Use SSL - for HTTP and Payload module (use https:// for in url for http-uri)

    -u URL with the part to be fuzzed marked as TRAVERSAL (e.g. http://foo:8080/id.php?x=TRAVERSAL&y=31337)

    -k Text pattern to match in the response (http-url & payload modules - e.g. "root:"
    if trying /etc/passwd)

    -p Filename with the payload to be sent and the part to be fuzzed marked with
    the TRAVERSAL keyword

    -x Port to connect (default: HTTP=80; FTP=21; TFTP=69)

    -t Time in milliseconds between each test (default: 300 (.3 second))

    -X Use the Bisection Algorithm to detect the exact deepness once a vulnerability
    has been found

    -e File extension appended at the end of each fuzz string (e.g. ".php", ".jpg",
    ".inc")

    -U Username (default: ''anonymous'')

    -P Password (default: ''dot@dot.pwn'')

    -M HTTP Method to use when using the ''http'' module [GET | POST | HEAD | COPY
    | MOVE] (default: GET)

    -r Report filename (default: ''HOST_MM-DD-YYYY_HOUR-MIN.txt'')

    -b Break after the first vulnerability is found

    -q Quiet mode (doesn''t print each attempt)

    -C Continue if no data was received from host

    ```


    Now that we have all the options, we will test them against our host in our lab
    192.168.1.134. In our test, we will be using the method http with the -m switch
