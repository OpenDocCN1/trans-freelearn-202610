    # Checking for a DNS BIND version


    Being able to see which version of BIND a DNS server is running will give you
    some potentially great information. A lot of DNS servers out there are designed
    to not give up that information or reveal some generic information about its setup.
    But there are still a lot of BIND instances running out there that may reveal
    the exact version of BIND they are running. Using the version you glean from the
    following command, you can cross-reference that version against any known exploits,
    and if there are some, you now have a potential way in.


    In the following example, I was able to grab the BIND server information from
    a publicly available DNS server. I have changed the name to protect the innocent:


    ```

    root@pi-kali:~# host -c chaos -t txt version.bind DNS1.XXXX.NET

    Using domain server:

    Name: DNS1.XXXX.NET

    Address: XXX.XXX.XXX.XXX#53

    Aliases:

    version.bind descriptive text "9.3.6-P1-RedHat-9.3.6-16.P1.1.2012012401"

    ```'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Probing the network with Nmap


    Nmap is arguably one of the greatest penetration-testing tools out there. It is
    a network mapping utility that generates network packets for anything you are
    looking to put on the wire. That is what makes it such a great tool. You can generate
    a packet of your choice and then see how both the network and systems respond
    to it. But with this power comes some complexity. Nmap does have a little bit
    of a learning curve. I will go through some examples that I use in my lab for
    testing. Check out the main page of Nmap as there are tons of options available
    to you.


    Let''s look at some examples:


    ```

    nmap -v -A scanme.nmap.org

    nmap -v -sn 192.168.0.0/16 10.0.0.0/8

    nmap -v -iR 10000 -Pn -p 80

    ```


    Here, we can also refer to the main page at https://nmap.org/book/man.html for
    more options and examples.


    Now, let''s try some real-world examples:


    ```

    Nmap -v -sS -sV -p0-65535 192.168.1.129

    ```


    +   1. We typically use the following scan when we want to see what is up and
    running on the network:

    +   2. Now, let us go through this example switch by switch. First, you turn up
    the verbosity with -v. This will give us a better idea of what is going on. Now
    this isn''t required, and some people don''t use this, but you will like the additional
    information it provides.

    +   3. Once you use this command enough you will know what is going on, and you
    can probably leave this off if you want.

    +   4. Next, we will be doing a TCP SYN scan with -sS. There are a couple of different
    options when using TCP. I tend to use the SYN scan because it is faster than the
    connect, plus it is not usually affected by a firewall as much as the connects
    are.

    +   5. Then, we will use -sV, which will probe to try and determine the service
    and version on those ports.

    +   6. We then specify the ports to test ( 0-65535) and finally end with the host
    we used.'
  merge: -1
  img_proc: true
