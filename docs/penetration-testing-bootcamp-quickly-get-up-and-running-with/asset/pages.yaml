    # Checking for DNS recursion with NSE


    DNS recursion isn''t typically an issue, but if you allow outside hosts to use
    your internal DNS servers for recursion, you are setting yourself up for potential
    attacks. DNS amplification attacks can be leveraged using these types of setup,
    where hackers will use these DNS servers to send spoofed requests to them, and
    they will respond back to the original host and, if there are a large number of
    these, a DDOS situation.


    To check for DNS recursion, we can use Nmap with the NSE engine. The command is
    straightforward, as we will do a UDP scan on port 53 and turn on the recursive
    script with the command nmap -sU -p53 -script=dns-recursion HOST.'
