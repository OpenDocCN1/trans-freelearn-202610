- pgno: 44
  md: 'We can also do the same sort of test on UDP as well, though UDP scans will
    take a long time. This is because UDP is a connectionless protocol, so there is
    no mechanism to drop/close/reset the connection like TCP, so Nmap needs to send
    multiple packets just to make sure there wasn''t another reason for it not to
    get a response back. There are ways to play around with the timers if you want
    a quick test, but be careful. If you speed them up too much, you will potentially
    miss things.


    Here is my scan for UDP to see what this host has open:


    ```

    root@kali:~# nmap -sU --min-rate 5000 192.168.1.129

    Starting Nmap 7.40 ( https://nmap.org ) at 2017-01-29 19:55 EST

    Nmap scan report for 192.168.1.129

    Host is up (0.48s latency).

    Not shown: 997 open|filtered ports

    PORT     STATE         SERVICE

    68/udp   closed        dhcpc

    161/udp  closed        snmp

    162/udp  closed        snmptrap


    Nmap done: 1 IP address (1 host up) scanned in 21.95 seconds

    ```


    Besides the TCP SYN scans and the UDP scans that we performed previously, there
    are certainly a large number of other types of scan. Perusing the main page will
    list all the different options. Each scan type has its benefits in terms of what
    it shows.


    The built-in scripting engine, or NSE, takes Nmap to a whole different level.
    It allows you to use community scripts, or even your own, as part of the command.
    This way, you can have these scripts run in parallel and provide even more information
    in the output. Let''s look at the following example just using the default Nmap
    with defined parameters and then one where I am enabling the scripting engine.


    Here is the output without the scripting engine enabled:


    ```

