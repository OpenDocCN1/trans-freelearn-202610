- pgno: 129
  md: '# SSLStrip


    In the past, I could stop with the preceding step and just run tcpdump and harvest
    any website credentials I needed to. However, with most sites moving to SSL, we
    need a way to decrypt the communication between the hosts so that I can see that
    information clearly. This is what SSLStrip will allow us to accomplish.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_129_0.png)


    With more and more sites moving away from HTTP towards HTTPS, the need to intercept
    and decrypt will become ever more important. There are still lots of sites out
    there that still run off of HTTP. According to a recent survey by Google, HTTPS
    topped 30% of traffic. This should soon increase to well over 50%.


    SSLStrip is an attack tool that utilizes the man-in-the-middle functionality to
    transparently look at HTTPS traffic, hijack it, and return non-encrypted HTTP
    links to the user in response. The hope here is that the end user will not notice
    that the traffic is no longer encrypted and enter sensitive information thinking
    they are safe. However, in reality, `sslstrip` is harvesting all this sensitive
    information. Let''s set this up and test this in our lab.


    There are some housekeeping steps required to set up prior to starting up `sslstrip`.
    We need a way to get the traffic coming into the box via the ARP spoofing over
    to `sslstrip` to do its job. To do this, I will utilize iptables to redirect that
    inbound SSL to the port that I will have `sslstrip` listening on. The syntax is
    as follows:


    ```

    ```

    iptables -t nat -A PREROUTING -p tcp --destination-port 80 -j REDIRECT --to-port
    $LISTEN-PORT

    ```

    ```


    Once I have the redirect all set, I can start up `sslstrip` and make sure I specify
    the port that I am using for the redirect in iptables. The log file that you specify
    will be the place where all the harvesting information will end up.


    Here is how I have it set up in my lab. First, I start by redirecting traffic
    to `sslstrip` and then start up `sslstrip` on the correct port:


    ```

    ```bash

    root@pi-kali:~# iptables -t nat -A PREROUTING -p tcp --destination-port 80 -j
    REDIRECT --to-port 8080

    root@pi-kali:~# sslstrip -l 8080


    sslstrip 0.9 by Moxie Marlinspike running...

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Next, I set up arpspoof to get into the flow of traffic by spoofing the default
    gateway shown in the following screenshot to the host, so that the host will send
    its traffic to me on the way out:


    ```

