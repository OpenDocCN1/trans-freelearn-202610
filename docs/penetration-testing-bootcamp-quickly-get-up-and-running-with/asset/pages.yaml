    # Attacking WEP with wifite


    Wifite is the quintessential WEP and WPS attacking tool. It is also a great wireless
    auditing tool that provides some great information on the SSIDs within range as
    well as their encryption type. But, besides just giving you the wireless information
    it sees, you can also try to attack the wireless networks using various attack
    scenarios. If the wireless network is using WPS (Wireless Protected Setup), it
    will attempt to break into it using various attacks. While WPS makes it easier
    for home users to set up and connect to wireless who have little wireless experience,
    there are lots of security concerns around WPS. Basically, the PIN can be compromised
    fairly easily after a couple of hours of attacking, and unfortunately, a lot of
    these home devices enable this feature by default. Wifite understands this, and
    if the network does have WPS enabled, it will attempt to brute force this with
    various attacks first.


    Now, if the wireless network is WEP, wifite will recognize this as well and attempt
    to crack the key using various tests, which I will show.


    When you first run the wifite command, you will be presented with a screen that
    will show that it is scanning the various networks. The following screenshot is
    from my lab on wifite starting up:'
  merge: -1
  img_proc: true
