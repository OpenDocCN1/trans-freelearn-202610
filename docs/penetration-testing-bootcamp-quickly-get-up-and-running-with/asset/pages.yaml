- pgno: 141
  md: '# Crunching wordlists


    Another great password utility that comes installed with Kali Linux is Crunch.
    Crunch is a wordlist generator that generates wordlists based on the criteria
    you pass to it. These criteria include the minimum and maximum length of the words
    and the characters to use, to name a few just. You can output the wordlist that
    is generated, and use it in another password cracking program that takes wordlists.


    Using Crunch is not a complicated procedure. Here is the basic syntax:


    ```

    crunch <min-len> <max-len> [<character set>] {options}

    ```


    Here is an example:


    ```

    crunch 5 8 abcdefg12345 -o wordlist.txt

    ```


    In the following screenshot, I will generate a wordlist with a minimum of three
    characters and a maximum of five. I will not specify any patterns, so the default
    character set will be used. The -o will allow me to specify a file named wordlist.txt
    as the output:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_141_0.png)'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'If I look at the file, I can see how Crunch creates the wordlists:


    ```

    root@pi-kali:~/META# cat wordlist.txt | more

    AAA

    aab

    aac

    aad

    aae

    aaf

    aag

    aah

    aai

    aaj

