    ```

    ```

    Snmp-check -c public -v 2c -w 192.168.1.5

    ```

    ```


    When I run this against a switch within my environment, the output is full of
    very useful information. The following screenshot is the output from my lab switch:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_156_0.png)


    The interesting thing about snmp-check is that it will give you a bunch of very
    useful information. For example, you can see the system information as well as
    network information and network interfaces.'
  merge: -1
