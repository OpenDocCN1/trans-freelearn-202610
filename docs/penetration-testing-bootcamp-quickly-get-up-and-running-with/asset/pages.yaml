- pgno: 136
  md: '# Summary


    Now that we are at the end of Day 5, we can review some of the topics we talked
    about. This chapter focused on traffic sniffing techniques and spoofing. We talked
    about the importance of sniffers and explored various type of sniffers such as
    tcpdump, Windump, and Wireshark. We then moved onto various spoofing attacks.
    The foundation of any spoofing attack and MiTM attack is ARP spoofing. Utilities
    such as arpspoof and Ettercap were discussed, as both are viable options to spoof
    traffic. Finally, since more and more traffic is moving to SSL, and any traffic
    worth grabbing is secure, we talked about two methods for harvesting information
    from those traffic flows. These methods include sslstrip and SSLsplit.


    In the next chapter, we will explore password-based attacks. This will include
    discussions around rainbow tables and password lists, along with various tools
    to utilize for these types of attacks. We will also touch on the importance of
    social engineering experiments, since users are often the weak link in security.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# 6


    # Password-based Attacks


    Understanding password-based attacks is a key skill for any penetration tester.
    The job of a penetration tester is to find any weak or common passwords that may
    exist on the network so that they can be changed before someone else cracks their
    password with malicious intent. Plus, if these same users are using weak or well-known
    passwords for their user accounts, who knows what other system or superuser accounts
    they will also use those passwords for? That is why password cracking is such
    an important task.


    In this chapter, I will be going through the fundamental process for password
    cracking, the initial task being generating rainbow tables and wordlists. These
    lists are the foundation of any cracking utility. I will then take those wordlists
    that I generated and use them in the various password cracking utilities that
    I use in my lab, the goal being to discover and report any weak or common passwords.


    The following topics will be discussed in this chapter:


    +   - The importance of social engineering experiments

    +   - Using password lists and rainbow tables

    +   - Password capture/cracking tools


    # Generating rainbow tables and wordlists


    Rainbow tables and wordlists are the bedrock of any password cracking software.
    Rainbow tables are a precomputed table of hashes with some sort of encoding function,
    such as Base64, for example. Hash tables are a hash of each word stored within
    a table. They are often confused with each other. Both are used for reverse-engineering
    cryptographic hash functions. The purpose of these tables is to crack password
    hashes. Rainbow tables and hash tables are typically used against a hash file
    that has been downloaded. They tend to be used for offline attacks.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'Rainbow tables are typically very good for harder passwords, while hash tables
    tend to work better for simple, more common passwords. Wordlists are just that:
    a list of passwords that will be tried against the system in real time. Because
    of this, wordlists are typically used in online attacks.


    Dictionary attacks are the type of attack we are trying to accomplish with these
    tools. A dictionary attack uses some sort of precomputed dictionary file to try
    and guess the password. The attack is typically limited to the size of the dictionary
    file it will use. There are also brute-force attacks, which are similar to dictionary
    attacks but try every single combination possible, and can therefore take a long
    time to finish.


    Next, I will talk about some utilities that I use for generating rainbow tables
    and wordlists, as well as some online resources for grabbing other tables and
    wordlists that others have already created and have found useful. Tables can take
    a long time to generate based on the table size, so if someone has already generated
    some good lists, be sure to keep those lists handy to save you some time.


    # Creating rainbows with RainbowCrack


    RainbowCrack is a software package that contains many tools, including one that
    is used to generate rainbow tables called rtgen. There are also utilities that
    can convert tables back and forth between different rainbow table formats, as
    well as rcrack, which is used with the rainbow tables to crack passwords. Here
    is the syntax for rtgen:


    ```

    rtgen hash_algorithm charset plaintext_len_min plaintext_len_max

    table_index chain_len chain_num part_index

    ```'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'The following are the option descriptions for `rtgen`:


    | Option | Description |

    |---|---|

    | hash_algorithm | Rainbow table is hash algorithm specific. Rainbow table for
    a certain hash algorithm only helps to crack hashes of that type. The rtgen program
    natively support lots of hash algorithms like lm, ntlm, md5, sha1, mysqlsha1,
    halfmd5, ntlmchall, oracle-SYSTEM and md5-half. In the example above, we generate
    md5 rainbow tables that speed up cracking of md5 hashes. |

    | charset | The charset includes all possible characters for the plaintext. "loweralpha-numeric"
    stands for "abcdefghijklmnopqrstuvwxyz0123456789", which is defined in configuration
    file charset.txt. |

    | plaintext_len_min

    plaintext_len_max | These two parameters limit the plaintext length range of the
    rainbow table. In the example above, the plaintext length range is 1 to 7. So
    plaintexts like "a" and "abcdefg" are likely contained in the rainbow table generated.
    But plaintext "abcdefgh" with length 8 will not be contained. |

    | table_index¹ | The table_index parameter selects the reduction function. Rainbow
    table with different table_index parameter uses different reduction function.
    |

    | chain_len¹ | This is the rainbow chain length. Longer rainbow chain stores more
    plaintexts and requires longer time to generate. |

    | chain_num¹ | Number of rainbow chains to generate. Rainbow table is simply an
    array of rainbow chains. Size of each rainbow chain is 16 bytes. |

    | part_index | To store a large rainbow table in many smaller files, use different
    number in this parameter for each part and keep all other parameters identical.
    |'
  merge: -1
  img_proc: true
- pgno: 140
