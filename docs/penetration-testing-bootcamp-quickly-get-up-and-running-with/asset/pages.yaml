    # Ettercap


    Ethercap is a great tool for performing an MiTM attack using the GUI as opposed
    to the CLI. Ettercap has a CLI-based utility, but the GUI version is quite powerful
    and a great alternative to arpspoof.


    When starting up Ethercap, you first need to decide which mode you want to run
    it in. The available options are either Bridge sniffing or Unified sniffing. If
    you are physically wired inline, you can select **Bridge sniffing**. But if you
    are not, you should select **Unified sniffing**, which is what I will select:'
  merge: -1
  img_proc: true
