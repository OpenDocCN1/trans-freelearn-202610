- pgno: 17
  md: '# 1


    # Planning and Preparation


    Proper planning and preparation is key to a successful penetration test. It is
    definitely not as exciting as some of the tasks we will do within the penetration
    test later, but it will lay the foundation of the penetration test. There are
    a lot of moving parts to a penetration test, and you need to make sure that you
    stay on the correct path and know just how far you can and should go. The last
    thing you want to do in a penetration test is cause a customer outage because
    you took down their application server with an exploit test (unless, of course,
    they want us to get to that depth) or scanned the wrong network. Performing any
    of these actions would cause our penetration-testing career to be a rather short-lived
    one.


    In this chapter, the following topics will be covered:


    +   - Why does penetration testing take place?

    +   - Scoping meeting, stakeholder questionnaire, and documentation

    +   - Building the systems for the penetration test

    +   - Penetration system software setup


    # Why does penetration testing take place?


    There are many reasons why penetration tests are necessary. Sometimes, a company
    may want to have a stronger understanding of their security footprint. Sometimes,
    they may have a compliance requirement that they have to meet. Either way, understanding
    why penetration testing is necessary will help you understand the goal of the
    company. Plus, it will also let you know whether you are performing an internal
    penetration test or an external penetration test. External penetration tests will
    follow the flow of an external user and see what they have access to, and what
    they can do with that access.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Internal penetration tests are designed to test internal systems, so typically,
    the penetration box will have full access to that environment, being able to test
    all software and systems for known vulnerabilities. Since tests have different
    objectives, we need to treat them differently; therefore, our tools and methodologies
    will be different.


    # Understanding the engagement


    One of the first tasks you need to complete prior to starting a penetration test
    is to have a meeting with the stakeholders and discuss various data points concerning
    the upcoming penetration test. This meeting could involve you as an external entity
    performing a penetration test for a client, or as an internal security employee
    doing the test for your own company. The important element here is that the meeting
    should happen either way, and the same type of information needs to be discussed.


    During the scoping meeting, the goal is to discuss various items of the penetration
    test so that you have not only everything you need, but also full management buy-in
    with clearly defined objectives and deliverables. Full management buy-in is a
    key component for a successful penetration test. Without it, you may have trouble
    getting the required information from certain teams, or there may be scope creep,
    or general pushback.


    # Defining objectives with stakeholder questionnaires


    This section goes over the various questions that I have used, and That I think
    are important for this type of engagement. These will help define clear and measurable
    objectives for the penetration tester.


    Let''s have a look at a questionnaire to determine the engagement criteria:


    +   - What is the objective of this penetration test?

    +   - What will be the deliverables required at the end of the penetration test?

    +   - What is the length of the penetration test, and is there any period of time
    when the penetration test cannot happen? (For example, the customer may have a
    busy period during the day when they don''t want anything to interrupt their business
    processes)'
  merge: -1
  img_proc: true
- pgno: 19
  md: '+   - During the penetration test, does the penetration test stop at finding
    vulnerabilities, or does it proceed to actively try to exploit these vulnerabilities?
    (This question is important because the stakeholder may not want systems to be
    taken down or potential data modified/deleted, so we want to make sure we know
    the boundaries) If exploiting systems is acceptable, do you want the penetration
    tester to try lateral movement within the environment after that?

    +   - Will this be an internal penetration test, an external penetration test,
    or both?

    +   - Who are the contacts within the company?

    +   - Are there any compliance standards that the company needs to follow?


    # Scoping criteria


    We will now see an example questionnaire for the scoping criteria. First, we will
    start with questions that will be derived from a white-box tester only to gain
    intimate knowledge of the network for testing:


    +   - What are the subnets and/or IP addresses in the scope of this test?

    +   - Are there any systems that are out of scope?

    +   - Are there security devices within the network? (This is important because
    these devices may block access into an environment, and that will prevent testing
    the system correctly)

    +   - Is there any type of important data held or transferred within the environment?


    Finally, if the penetration tester is using more of a black-box mentality, then
    these questions will be relevant for them, as well as the white-box testers:


    +   - Is guest access in scope as well?

    +   - Which corporate SSIDs are in scope?

    +   - What are the physical locations in scope for the test (if there are multiple
    locations)? Are all locations/networks dedicated, or are they shared with another
    company (for example, shared hosting or some cloud environments)?


    ![](img/095df2cd1930baecbcecaa51ee3417aa_19_0.png)


    This list is by no means complete or comprehensive. It is important for you, as
    a penetration tester, to figure out what questions you feel are relevant for your
    particular engagement. The preceding list contains some of the required questions,
    based on my experience.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Documentation


    Documentation is an important part of the planning and preparation phase. Sometimes,
    this information is not provided to you, and you must glean it yourself. In `Chapter
    2`, *Information Gathering*, we will focus on getting some of this information
    as well, if it is not all provided.


    But hopefully, you can get some information about the environment prior to jumping
    into the penetration test. There are different types of documentation that are
    great to have prior to starting a penetration test. In the next couple of sections,
    we will see some of the main types of documentation that we need during the preparation
    phase.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_20_0.png)


    Documentation is great, but part of a penetration tester''s job is also to verify
    that it''s correct. We have seen way too often documentation that was outdated
    and/or incorrect. Use it as a guide for the test, but by no means should you use
    it as the single source of truth.


    # Understanding the network diagram – onshore IT example


    A network diagram of the systems and devices that are in scope is important to
    get a good understanding of the network so you can start working on your overall
    penetration plan. This documentation will allow you to see what systems are in
    scope, as well as the path through the network and devices that are involved.
    A lot of organizations struggle with this type of documentation, so use it strictly
    as a guide. One of the deliverables might end up being a more comprehensive network
    diagram for you, based on what is discovered during the penetration test.


    Network diagrams come in all shapes and sizes. The important thing is to have
    it for the in-scope networks and to show the main network devices, security devices,
    and hosts, if at all possible. The following is a sample network diagram that
    I created. This will give you a good idea of what to look for:'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/095df2cd1930baecbcecaa51ee3417aa_21_0.png)


    # Data flow diagram


    Data flow diagrams are probably one of the most important documents a penetration
    tester/assessor/auditor can have. The job of a data flow diagram is to show the
    flow of important data within the organization. The data can be of different types,
    including credit card information, proprietary company information, or even personally
    identifiable information (PII). Understanding how this type of data flows in the
    network, and which systems it interacts with, will allow you to help the penetration
    tester understand where to focus. This is important as this is where the hackers
    will focus as well.


    Some organizations do not typically have this type of documentation. We have seen
    many companies having to generate these data flow diagrams while going through
    an audit or assessment of some sort. But most organizations should have data flow
    diagrams within the organization for any important data flows.'
  merge: -1
  img_proc: true
