- pgno: 148
  md: '# Ncrack


    Ncrack is a powerful and fast password cracking tool designed to crack passwords
    for network-based services such as RDP, SSH, HTTP(S), SMB, pop3(s), VNC, FTP,
    and Telnet. With Ncrack, you can pull in a host list via NMAP or from a file.
    Plus, you have the ability to play around with different timing and performance
    settings, such as connection limits, retries, and timeouts. IPv6 is also supported,
    which is a great feature if your are attacking an IPv6 network. Here are the options
    for running ncrack. You will notice that there are a lot of options, as ncrack
    is an extremely powerful and customizable utility:


    ```

    Usage: ncrack [Options] {target and service specification}

    ```


    There are a lot of options and target and service specifications to understand.
    Definitely check out the main page to get a comprehensive grasp of the list.


    In my lab example, I will be cracking a list of hosts, in which the hosts will
    be listed in the file hosts.txt. Since I know they are all Linux boxes, I will
    specify the user as root and specify my password list as generic-passwords.txt.
    I will also specify a connection limit of four parallel tasks:


    ```

    root@kali:~# ncrack -v -iL host.txt --user root -P generic-passwords.txt -p ssh
    CL=4


    Starting Ncrack 0.5 ( http://ncrack.org ) at 2017-02-07 15:02 EST


    Discovered credentials on ssh://192.168.33.27:22 ''root'' ''toor''

    Discovered credentials on ssh://192.168.33.123:22 ''root'' ''P@55w0rd''

    ssh://192.168.33.27:22 finished.

    ssh://192.168.33.123:22 finished.


    Discovered credentials for ssh on 192.168.33.27 22/tcp:

    192.168.33.27 22/tcp ssh: ''root'' ''toor''

    Discovered credentials for ssh on 192.168.33.123 22/tcp:

    192.168.33.123 22/tcp ssh: ''root'' ''P@55w0rd''


    Ncrack done: 2 services scanned in 45.00 seconds.

    Probes sent: 203 | timed-out: 0 | prematurely-closed: 43


    Ncrack finished.

    ```


    I really love using ncrack for its flexibility in specifying a host list versus
    performing an individual scan per host. This allows for easier auditing of a network
    for known passwords.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Medusa


    Medusa is very similar to THC-Hydra. It''s a lightweight but powerful password
    cracking utility. It is multi-threaded, which allows it to scan multiple hosts
    at one time; in fact, if you are using a host list, each host will spawn a separate
    child process. It supports a bunch of protocols, including AFP, CVS, FTP, HTTP,
    IMAP, MS-SQL, MySQL, NetWare NCP, NNTP, pcAnywhere, POP3, PostgreSQL, REXEC, RLOGIN,
    RSH, SMBNT, SMTP-AUTH, SMTP-VRFY, SNMP, SSHv2, Subversion (SVN), Telnet, VMware
    Authentication Daemon (vmauthd), VNC, Generic Wrapper, and Web Form.


    Here is the syntax for Medusa:


    ```

    Medusa [-h host|-H file] [-u username|-U file] [-p password|-P file] [-C file]
    -M module [OPT]

    ```


    As for the options available for the command, check out the main page for medusa,
    or use medusa --help. There are many switches available that can make this command
    even more powerful.


    In my lab example, I will be using medusa to scan the same host list as I did
    with Ncrack. I will also pull from the same wordlist. The goal here is to see
    if medusa can also crack the same hosts as ncrack did:


    ![](img/095df2cd1930baecbcecaa51ee3417aa_149_0.png)


    As you can see, medusa was also successful in cracking the passwords for both
    hosts. In fact, it happened in under 10 seconds. Medusa is definitely a favorite
    password cracking utility because of its speed and effectiveness.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Social engineering experiments


    Employees or users are often considered the weakest link in security, and are
    typically the greatest threat to any organization in today''s world. They are
    not likely to be well versed in security best practices, and often won''t care
    about them. They are often more concerned about getting the job done as quickly
    and easily as possible. Therefore, this can be easily exploited.


    As part of our penetration test, I will show you some examples of social engineering
    attacks designed around passwords. Hashing a password or guessing a password can
    be tough, and can take a long time, but it can usually be done. But, if I can
    just get the user to give me the password, it will save me a lot of work in the
    long run. This is the main reason why social engineering attacks are important,
    and why I will talk about three different kinds of attack now.


    ![](img/095df2cd1930baecbcecaa51ee3417aa_150_0.png)


    Social engineering attacks merit a book all on their own. I will cover three examples
    that I have seen work really well in the real world, but that is by no means a
    comprehensive list. As the penetration tester, figure out holes in the environment
    you are running the tests on, as well as the security awareness of the employees.
    Based on that information, formulate some social engineering attacks to test those
    users.


    # Impersonation to get the goods


    Impersonating another person is one of the most popular social engineering attacks
    that is out there. Depending on the line of business the company is in, who or
    what is being impersonated will change, but they all have the same desired outcome:
    the password of the user.


    Here are two scenarios to run with during a social engineering test as part of
    the penetration test you are performing:


    # Scenario 1


    You have done the necessary research to understand the organizational structure
    of the organization you are penetrating. This can be based on documentation you
    were provided or information you have gleaned through various methods. But based
    on this information, you have targeted a specific individual. The knowledge you
    have found on this person will allow you to know that they have access to the
    specific data you want to try and get (or in the case of the penetration test,
    just testing whether you can get it).'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'So in my case, I called them up and impersonated someone from the company''s
    IT help desk. I let the user know that I have seen their workstation making strange
    connections to the Internet and that I will need their username and password to
    verify that they don''t have any issues. I make it sound very professional and
    that the matter is of the utmost importance. The user will give their information
    more often than not, especially if you target the correct person.


    # Scenario 2


    You are trying to get root access to some servers that are being co-managed by
    a third party. You know that these servers have some information on them and you
    want to test whether you can get it. I call up the third party''s help desk and
    inform them that my laptop has died and that I have a new one, but that I no longer
    have the password saved, so I need it changed. I let them know that this is an
    emergency and they need to change the password ASAP while I am on the phone, as
    one of the company''s applications is down, and the company cannot do business
    with their app down. With enough pressure and urgency, a lot of companies will
    reset that password, and allow you to log in and create backdoor accounts in case
    the real administrators need to reset the password again.


    # Dumpster diving


    This may sound like a gross encounter, and believe me, it can be. But the risk
    is definitely worth the reward in this case. A lot of companies don''t have very
    strict shredding rules. They may have a shredding program, but they rely on the
    user to perform this task, and put the paper in the shredding bins versus the
    regular trash. Now, from what I have found, different departments tend to follow
    these shredding policies at different levels. Typically, the accounting or billing
    departments are very good at this policy, as there tends to be more training around
    shredding in these departments, and there also tends to be more shredding bins
    located around them. But, for other departments, this tends to be a policy that
    is less well followed. Systems and network groups are often very lax in this policy.
    Typically, they have scrap pieces of paper lying around with all types of information
    on them, including passwords. Often these pieces lie around the desk for a while,
    and in a rush to clean up, they just toss them in the garbage. This is where the
    risk pays off. Going through the trash can get you all sorts of information. Information
    such as network diagrams, passwords, server information, project plans, and so
    on. The world is your oyster in this case.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '![](img/095df2cd1930baecbcecaa51ee3417aa_152_0.png)


    Dumpster diving doesn’t have to be literally diving into the dumpster and searching.
    One can accomplish this by paying off or working for the cleaning crew and just
    taking the garbage to where you are going to search versus directly in the trash.
    There are plenty of options that are less intense than swimming in a dumpster
    of trash looking for gold.


    # Free USB drives for all!!


    Let''s face it: people love free stuff, especially free stuff they find. A classic
    example of social engineering attacks is to buy a bunch of USB drives, the more
    flashy or cool looking the better. Then, take them and install some malicious
    software on them, maybe even the Rubber Ducky software or some other type of malicious
    software. Basically, you will want software that will perform the necessary task
    when plugged in; this can include keystroke monitoring, changing system settings,
    opening backdoors, or initiating reverse shells.


    Once you have the drives all set up and loaded with your software du jour, you
    just need to take them to the business that you want to test against, in our case,
    one of the locations of the company we are performing the penetration test against.
    Once in the parking lot, just place the drives near car doors sporadically throughout
    the parking lot. Once placed, sit back and wait. Most users will pick them up
    and plug them in just out of sheer curiosity. This is what we are betting on.
    This works most of the time, and will provide some good findings in our final
    penetration testing report.


    # Summary


    Now that we have reached the end of Day 6, let''s recap what we talked about.
    This chapter was all about password- based attacks. I started the chapter off
    by talking about rainbow tables and wordlists. I discussed some of the utilities
    that I used in the lab, such as RainbowCrack and Crunch, to generate my own wordlist
    and rainbow tables. I also discussed some other ways to get these resources online
    as well. After getting those lists created, I discussed a couple of cracking utilities
    that I use in my tests. These utilities included John the Ripper, THC-Hydra, Medusa,
    and finally Ncrack-all great utilities that make password cracking easy.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Finally, I finished off the chapter by talking about social engineering experiments
    that are probably the easiest way to crack a password, that is, letting the user
    give it to you themselves.


    In the next chapter, I will talk about and display attacks on the infrastructure.
    This will include wired, wireless, and Bluetooth-based attacks, as well as the
    various utilities used to perform them effectively.'
  merge: -1
