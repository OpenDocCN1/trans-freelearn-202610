- pgno: 146
  md: 'As you can see, John the Ripper makes it very easy to crack passwords with
    little input needed from the user. There are some more advanced things you can
    do as well when it comes to searching the cracked password using some of the command-line
    switches to help make it easier on large password files. For example, you can
    search by UID, GID, or even shells. In the following screenshot, I wanted to see
    all the cracked users that were using a bash shell:


    ```

    root@pi-kali:~# john --show --shells=bash META/server-META.txt

    msfadmin:msfadmin:1000:1000:msfadmin,,,:/home/msfadmin:/bin/bash

    postgres:postgres:108:117:PostgreSQL administrator,,,:/var/lib/postgresql:/bin/bash

    user:user:1001:1001:just a user,111,,,:/home/user:/bin/bash

    service:service:1002:1002,,,:/home/service:/bin/bash

    4 password hashes cracked, 1 left

    ```


    ![](img/095df2cd1930baecbcecaa51ee3417aa_146_0.png)


    Depending on how powerful the hardware on which you are running any password cracking
    utilities is, the time it takes to crack passwords can vary. If you have a less
    powerful system internally, like in my case a Raspberry Pi, I will just use that
    to extract the necessary files, and then run the cracking software on my C&C server.


    # THC-Hydra


    Hydra is a great password cracking tool that can run on a Kali system running
    on a desktop machine, or even Kali running on the Raspberry Pi. It allows you
    to run cracks in parallel. This allows the application to scale quicker, and really
    get as many attempts in per minute as possible. You can control this number as
    well, and Hydra will notify you when you need to change this number when you go
    to run the crack. This is somewhat dependent on the service type you are trying
    to crack the password on as well.


    Here is the syntax for THC-Hydra:


    ```

    hydra [[[-l LOGIN|-L FILE] [-p PASS|-P FILE]] | [-C FILE]] [-e nsr] [-o FILE]
    [-t TASKS] [-M FILE [-T TASKS]] [-w TIME] [-W TIME] [-f] [-s PORT] [-x MIN:MAX:CHARSET]
    [-SouvVd46] [service://server[:PORT][/OPT]]

    ```


    Here are the options:


    +   - -l LOGIN or -L FILE  login with LOGIN name, or load several logins from
    FILE

    +   - -p PASS  or -P FILE  try password PASS, or load several passwords from FILE

    +   - -C FILE  colon separated "login:pass" format, instead of -L/-P options

    +   - -M FILE  list of servers to attack, one entry per line, '':'' to specify'
  merge: -1
  img_proc: true
