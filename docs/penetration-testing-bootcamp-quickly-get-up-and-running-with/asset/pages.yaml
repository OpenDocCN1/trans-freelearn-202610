- pgno: 100
  md: 'These are just some examples of the power of meterpreter.


    # Understanding client-side attacks


    Client-side attacks are becoming more and more popular because they work, and
    they work well. They take advantage of the client-server architecture that is
    in use today. These clients or endpoints run full operating systems with all types
    of application running on them. Both the operating systems as well as the applications
    contained on these clients have vulnerabilities. This demonstrates the importance
    of patch management.


    Client-side attacks exploit these vulnerabilities in different ways. In the following
    examples, we use BeEF to leverage a browser-based attack. However, that is not
    the only way. You can get files onto the machine via email or other methods to
    exploit Java or Adobe Reader on the client side to take whatever you want from
    that machine or just control it for some other purpose down the road. The choice
    is yours, which is why it''s important not to gloss over client-side attacks.


    # Using BeEF for browser-based exploitation


    One of the best tools out there for phishing attacks is BeEF. BeEF uses weaknesses
    that are found in web browsers for client-side attacks. These attacks hook web
    browsers and use them as beachheads in order to attack the host directly. It is
    a very easy attack, as it is often easy to trick users. It shows the importance
    of making sure your browser is patched and up to date.


    BeEF can be placed in many categories, but I consider it an exploitation tool
    and that is how I plan to use it in my lab. BeEF is a very popular tool for penetration
    testers as it adds yet another vector for us to test against; it looks beyond
    perimeter security, and it doesn''t require us to change any security or settings
    against the endpoint targets. It is also a very good tool to test your users with
    various social engineering tasks by seeing who clicks on which fake links.


    BeEF is primarily driven via the browser, so running beef-xss from the CLI will
    start BeEF, but the rest of the configuration will be done over a web interface.
    Again, this shows how easy this tool is to use.'
  merge: -1
  img_proc: true
