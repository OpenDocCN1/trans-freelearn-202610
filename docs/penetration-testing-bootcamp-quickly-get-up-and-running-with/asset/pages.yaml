    be using sha256 as the hash algorithm, with a minimum of 1 and a maximum length
    of 7. I will also have 2,000 chains generated with the following command:


    ```

    root@kali:~# rtgen sha256 loweralpha-numeric 1 7 0 1000 2000 0

