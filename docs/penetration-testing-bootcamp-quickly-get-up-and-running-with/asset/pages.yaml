    # Identity-based testing


    Identity controls are a key function of web applications. You want to make sure
    that people are who they say they are, and that they can only do what they should
    be allowed to do.


    Most, if not all web applications today, require some sort of authentication prior
    to using that app, so it is one of the first items that a person or hacker is
    presented with. Therefore, it is important that it works when it''s supposed to,
    and denies users that shouldn''t be there.


    Testing your web applications for default usernames and passwords is an important
    part of identity testing across all your applications. Changing default usernames
    and passwords is a low-hanging fruit when it comes to a strong web application
    posture. You also want to make sure users have access to what they need based
    on their role. There shouldn''t be 27 administrative privileged users when only
    2 need full access. I will explore some of the tests you can perform on your web
    applications to make you have strong identity controls.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Role based access control


    An important piece of identity testing is to make sure that people who have access,
    have the correct access based on their role. For example, if there is a user that
    needs to log into the system to read all the logs the application has generated,
    and that is their only focus, they shouldn''t be allowed to log in and change
    content. Another example would be having a user who can add users to the application.
    They should not be able to change the password of the administrative user. I could
    go on, but the point is that you want the role to define access of the user.


    Typically, testing for this is quite simple. I have the users pulled from the
    web application user database and cross reference them against those users'' roles.
    I then verify that the users have the correct permissions to match their jobs
    roles. This is a quick, yet powerful test.


    # Apache-users


    Apache-users is an enumeration tool used against apache server setup with the
    UserDir module. At the least, you will specify the wordlist, the host, and off
    you go. A very easy tool to use, and it checks for a very specific function, but
    can provide valuable information that can be used in your final findings report:


    ```

    root@pi-kali:~# apache-users

    USAGE: apache.pl [-h 1.2.3.4] [-l names] [-p 80] [-s (SSL Support 1=true 0=false)]
    [-e 403 (http code)] [-t threads]

    ```


    When running the test against a host that didn''t have any issues, here is the
    output:


    ```

    root@pi-kali:~# apache-users -h 192.168.1.129 -l /usr/share/wordlists/metasploit/unix_users.txt
    -p 80 -s 0 -e 403 -t 10

    Execution time: 34 seconds!

    ```


    But, when running the test against a host that did have an issue, here is the
    output:


    ```

    root@pi-kali:/usr/share/wfuzz# apache-users -h 192.168.33.3 -l /usr/share/wordlists/metasploit/unix_users.txt
    -p 80 -s 0 -e 403 -t 10

    ROOT exists on 192.168.33.3

    daemon exists on 192.168.33.3

    ftp exists on 192.168.33.3

    lp exists on 192.168.33.3

    nobody exists on 192.168.33.3

    root exists on 192.168.33.3

    sshd exists on 192.168.33.3

    www exists on 192.168.33.3

    Execution time: 15 seconds!

    ```'
