    # Calling multiple queries at once


    If you know you need to call more than one query, and the order in which these
    queries are called is not important, you can increase performance by calling them
    all with one API URL. All the results will be returned at once.


    The syntax is:


    ```

    https://api.facebook.com/method/fql.multiquery?queries=["SELECT x FROM a WHERE
    c", "SELECT y FROM b WHERE d"]&access_token=«access_token»

    ```


    Although in this example I''ve only used very simple queries, you are not restricted
    to these.


    # Pop Quiz


    +   1. When does it make sense to use FQL instead of the Graph API?

    +      a. When publishing information to Facebook

    +      b. When trying to retrieve a specific list of fields

    +      c. When attempting to find out the user''s extended permissions

    +   2. When does it make sense to use the Graph API instead of FQL?

    +      a. When publishing information to Facebook

    +      b. When trying to retrieve a specific list of fields

    +      c. When attempting to find out the user''s extended permissions

    +   3. How do columns and rows within database tables correspond to objects and
    properties within the AS3 model?

    +      a. Columns are like properties, rows are like objects

    +      b. Columns are like objects, rows are like properties'
  - '[PAGE 277]


    # Summary


    In this chapter, you went from knowing absolutely nothing about FQL to being able
    to do more advanced search queries with it than you could with the Graph API.
    You also learned about some techniques that the Graph API does not support, like
    how to get a list of extended permissions that the current user has been granted.


    The key points are as follows:


    +   - Databases arrange data into tables, columns, rows, and fields

    +   - FQL stands for Facebook Query Language

    +   - The API URL for submitting an FQL query is https://api.facebook.com/method/fql.query?access_token=ACCESS_TOKEN&format=FORMAT&query=FQL_QUERY
    — FORMAT can be either json or xml

    +   - FQL queries must query an indexable field

    +   - Read entity-relationship lines by combining the names of the two tables
    (not columns!) with the verb before the line

    +   - The permissions table can be queried to find out which extended permissions
    an authenticated user has been granted

    +   - A list of tables and their columns (with a guide to which fields are indexable)
    can be found at http://developers.facebook.com/docs/reference/fql/


    In the next chapter, we''ll wrap up everything we''ve learned throughout the book
    and wrap up your application as a whole.'
