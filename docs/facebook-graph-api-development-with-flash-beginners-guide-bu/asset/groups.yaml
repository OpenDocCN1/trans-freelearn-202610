  - "[PAGE 50]\n\nMost of the data from the GraphObject is displayed in a text area\
    \ inside the window, in a simple \"key: value\" format. The Page's name field\
    \ is displayed in the window's title bar, and if the Page has a picture field\
    \ (we can see from the JSON that PacktPub does), the image is downloaded and displayed\
    \ inside the renderer using a Loader.\n\n> Like URLLoader, the flash.display.Loader\
    \ class downloads the object that a given URLRequest points to, dispatching a\
    \ COMPLETE event when ready. Unlike URLLoader, Loader is used to download images\
    \ and SWFs, and the event is actually dispatched by one of its sub-objects, contentLoaderInfo.\
    \ Also, Loader extends DisplayObject, and takes the appearance of the image when\
    \ it has finished downloading.\n> \n> Flash's security model prevents an image's\
    \ data being accessed by SWFs residing on a different domain than the image itself,\
    \ unless there is a cross-domain policy file on the domain of the image that allows\
    \ it. Fortunately, Facebook's cross-domain policy file is lenient, allowing such\
    \ access by every domain.\n\nSo, really, this is just a graphical way of representing\
    \ a Page object from the Graph API.\n\n# Understanding connections\n\n\"That's\
    \ all well and good,\" you may be thinking, \"but it doesn't show all the data\
