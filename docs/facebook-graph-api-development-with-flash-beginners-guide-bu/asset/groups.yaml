  - "[PAGE 107]\n\n> The pop-up window will probably be blocked. To prevent you from\
    \ being able to load a million pop-up windows automatically, pop ups opened by\
    \ a call to `window.open()` are blocked by the browser, unless the call comes\
    \ from within the handler of a `MOUSE_CLICK` event.\n> Feel free to add a \"log\
    \ in\" button to the application and move the contents of the `attemptToAuthenticate()`\
    \ function to the buttons click handler function; I'm just going to click on **Allow\
    \ pop ups** in my browser.\n\nOnce the pop up is working, you'll either see the\
    \ Facebook login page or the Google home page, depending on whether you're currently\
    \ logged in to Facebook. To make sure you can see the login page, log out of Facebook,\
    \ or load `index.html` in Private browsing mode. Eventually, you'll see the next\
    \ screenshot:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_107_0.png)\n\n# Creating\
    \ a callback web page\n\nOnce you log in, you'll be redirected to Google. However,\
    \ we need the page that the user is redirected to – the **callback** webpage –\
    \ to be one that we control, so that we can put some JavaScript inside it to grab\
    \ the access token and pass it back to our application.\n\nCreate a new HTML page,\
    \ `callback.html`, and enter the following code:\n\n```\n<html>\n<head>\n  <script\
    \ type=\"text/javascript\">\n  <!--\n  window.opener.setAccessToken(window.location.hash);\n\
    \  //-->\n\n```"
  - "[PAGE 108]\n\n# Let Me In!\n\n```\n</script>\n</head>\n<body>\n<h2>Close this\
    \ window</h2>\n<p>The access token has been passed back to index.html.</p>\n</body>\n\
    </html>\n```\n\nYou may later want this window to close automatically once it's\
    \ done its job. This is simple to do: just add another line to the JavaScript\
    \ as shown in the following code:\n\n```\n<script type=\"text/javascript\">\n\
    <!--\n    window.opener.setAccessToken(window.location.hash);\n    self.close();\n\
    //-->\n</script>\n```\n\nI've highlighted the most important line; this finds\
    \ the window that opened the pop up, and calls a JavaScript function named setAccessToken()\
    \ inside that window's page, passing it the \"hash\" of the pop up's URL (everything\
    \ after the # character). Remember, the pop up's URL will be :\n\n```\nhttp://www.google.com/#access_token=123675230995389%7C2._X2CYJw2h7tOH9T9i7tkCg__.3600.1277610200-169573433058884%7Cy3fkK9oobNvC6DS\
    \ SFChUVFeJrMO, so the hash will contain the access token.\n```\n\nWe need to\
    \ write that setAccessToken() function – but first, let's make this the official\
    \ callback webpage. Upload callback.html to the same directory as index.html on\
    \ your web host, then go to the Facebook Developers page and edit your application's\
    \ settings.\n\nIn the Web Site tab, enter the base domain name of your host into\
    \ the Site URL box. For instance, if your callback.html page is at http://host.com/visualizer/callback.html,\
    \ enter http://host.com/.\n\nNow, in HTTPRequestor.as, in your attemptToAuthenticate()\
    \ function, change the redirect_uri parameter of the URL to point to callback.html:\n\
    \n```\npublic function attemptToAuthenticate():void\n{\n    ExternalInterface.call(\"\
    window.open\",\n        \"https://graph.facebook.com/oauth/authorize?\n      \
    \      client_id=165373950152944&type=user_agent&redirect_uri=\n            http://host.com/visualizer/callback.html\"\
    \n        \"facebookLoginWindow\",\n        \"height=370, width=600\");\n}\n```"
  - "[PAGE 109]\n\nRecompile your application, and upload it to your web host, overwriting\
    \ the old version. Refresh `index.html` in your browser. You should see the pop\
    \ up appear, and (once you've logged in) it will load `callback.html`:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_109_0.png)\n\
    \nIt's telling a lie at the moment, though. The access token hasn't been passed\
    \ back, because there's no `setAccessToken()` function to pass it back to!\n\n\
    # Receiving the access token\n\nUsing `ExternalInterface`, we can allow JavaScript\
    \ inside `index.html` to call an ActionScript function inside our SWF.\n\n+  \
    \ 1. Let's create an ActionScript function that will take the hash value and extract\
    \ the access token from it.\n+   2. Add this new function to `HTTPRequestor.as`:\n\
    \n```\nprivate function setAccessToken(a_hashValue:String):void\n{\n    var hashParams:Array\
    \ = a_hashValue.substr(1).split(\"&\");\n    var hashKeyAndValue:Array;\n\n  \
    \  for (var i:int = 0; i < hashParams.length; i++)\n    {\n        hashKeyAndValue\
    \ = (hashParams[i] as String).split(\"=\");\n        if (hashKeyAndValue[0] ==\
    \ \"access_token\")\n        {\n            this.accessToken = hashKeyAndValue[1];\n\
    \            break;\n        }\n    }\n    this.request(new GraphRequest(\"me\"\
    ));\n}\n```"
