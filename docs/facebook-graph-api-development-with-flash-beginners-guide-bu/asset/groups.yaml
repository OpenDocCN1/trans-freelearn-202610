  md: "\n## What just happened?\n\nOnce the user clicks on Allow, Facebook will remember\
    \ that decision, and your application won't have to ask for this permission again\
    \ – just like when the user authorized the application to see their basic information\
    \ for the first time.\n\nYou can request more than one extended permission at\
    \ a time; just separate them with commas:\n\n```\nhttps://graph.facebook.com/oauth/authorize?client_id=<your_application_id>&type=user_agent&redirect_uri=<your_callback_url>&scope=read_mailbox,user_photos,user_interests\n\
    ```\n\nExtended permissions aren't just about you, though. Allowing the user_interests\
    \ extended permission will allow the application to access the user's list of\
    \ interests (which are, of course, represented as a list of Graph objects) – but\
    \ there's also a friends_interests extended permission, which allows the application\
    \ to access the lists of interests of all the user's friends.\n\nActually, most\
    \ of the extended permissions have a user-only version and a friends version;\
    \ check out the official documentation for a list of all of them: http://developers.facebook.com/docs/authentication/permissions.\n\
    \n## Time for action – requesting extended permissions\n\nTo make your application\
    \ always request the user_interests extended permission, we merely have to modify\
    \ HTTPRequestor.attemptToAuthenticate() to:\n\n```\npublic function attemptToAuthenticate():void\
    \ as shown in the following code:\n{\n    ExternalInterface.call(\"window.open\"\
    ,\n    \"https://graph.facebook.com/oauth/authorize?\n    client_id=<your_application_id>&type=user_agent&\n\
    \    redirect_uri=<your_callback_url>\"\n    + \"&scope=user_interests\",\n  \
    \  \"facebookLoginWindow\",\n    \"height=370, width=600\");\n}\n```\n\nThat'll\
    \ work fine; it'll give you the pop-up window asking you if it's okay for the\
    \ application to access your profile information.\n\nIf that's all you need –\
    \ and all you'll ever need – then you could leave it at that. But what if you\
    \ want to make this a little more flexible?\n\nFirst, let's allow the attemptToAuthenticate()\
    \ function to take an arbitrary number of extended permissions as arguments, and\
    \ append them to the scope parameter as a comma-separated list:\n\n```\npublic\
    \ function attemptToAuthenticate(...permissions):void\n{\n    var scope:String\
    \ = \"\";\n    if (permissions.length > 0)\n    {\n        scope = \"&scope=\"\
    \ + permissions.join(\",\");\n    }\n    ExternalInterface.call(\"window.open\"\
    ,\n        \"https://graph.facebook.com/oauth/authorize?client_id=165373950152944&type=user_agent&redirect_uri=http://gamedev.michaeljameswilliams.com/scrap/visualizer/callback.html\"\
    \n        + scope,\n        \"facebookLoginWindow\",\n        \"height=370, width=600\"\
    );\n}\n```\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_117_0.png)\n\n> Using permissions\
    \ as the sole argument for the function means that we can pass it as many arguments\
    \ as we like, and they'll form an array called permissions. (This is called the\
    \ ... (rest) parameter, in case you want to look it up.)\n> \n> We can then use\
    \ the Array.join() method to combine all the strings in this array into a single\
    \ string, in the form of a comma-separated list.\n\nWe have to change the signature\
    \ of the method in IRequestor.as to match the changes we've made to the function:\n\
    \n```\npackage graph.apis.base\n{\n    import flash.events.IEventDispatcher;\n\
    \    import graph.GraphRequest;\n\n    public interface IRequestor extends IEventDispatcher\n\
    \    {\n        function request(a_request:GraphRequest):void;\n        function\
    \ attemptToAuthenticate(...permissions):void;\n    }\n}\n```\n\n## Let Me In!\n\
    \nNow we just need to pass the extended permissions that we desire to this method.\
