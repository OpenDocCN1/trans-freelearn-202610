  md: "\n![](img/4e826fa36038b86f2087ef8b818d0acf_53_0.png)\n\nBut in mathematics,\
    \ \"graph\" refers to any set of nodes connected by edges, like the example in\
    \ the next diagram:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_53_1.png)\n\n\
    The Graph API represents Facebook's data as shown in the next diagram :\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_53_2.png)\n\
    \nIn the previous diagram, each object is a node, and the lines represent different\
    \ types of connection.\n\nFetching http://graph.facebook.com/packtpub/posts gets\
    \ you all the nodes joined to PacktPub by a \"post\" connection – that is, all\
    \ Post objects that have been posted on Packt’s wall:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_54_0.png)\n\
    \n## Have a go hero – exploring connections\n\nNow that you know about the metadata\
    \ parameter, explore the different types of connections in your browser, and see\
    \ what new kinds of objects you can find.\n\n## Rendering Lists\n\nWhat happens\
    \ if you try to load https://graph.facebook.com/packtpub/posts using the same\
    \ code we used to load the Packt Publishing Page object?\n\nWe get this in the\
    \ output panel:\n\nGraph Object was null!\n\nNot a success. The way the Graph\
    \ API structures the JSON here is totally different to how it structures the JSON\
    \ for a Page, Post, or any other Graph Object. The same is true of the JSON for\
    \ the other connection URLs. We call this structure a Graph List.\n\n## Time for\
    \ action – rendering Lists of Posts\n\nSince a Graph List's data property is an\
    \ array of Graph Objects, we could just loop through the array and create a new\
    \ Graph Object Renderer for each element. Feel free to have a go at this, if you\
    \ like, but I've got another solution.\n\nI've created a second renderer: this\
    \ time, a Graph List Renderer. I've also created a class graph.GraphList. And\
    \ CustomGraphContainerController inherits a method called renderGraphList(). Perhaps\
    \ unsurprisingly, this takes an object of type graph.GraphList as a parameter,\
    \ and creates a new Graph List Renderer to display its contents. So, we need to\
    \ take a Graph List that we receive from the Graph API, and turn it into an instance\
    \ of the GraphList class. The GraphList class is a little more sophisticated than\
    \ the GraphObject class; it has a method called addToList(), to which we can pass\
    \ any GraphObject instance to be added to the list.\n\nWe'll still loop through\
    \ the data array, then, but instead of rendering each GraphObject on its own,\
    \ we'll add each one to a GraphList and render that.\n\nModify the URL that CustomGraphContainerController\
    \ requests, so that it loads the list of posts:\n\n```\npublic function CustomGraphContainerController\n\
    \    (a_graphControlContainer:GraphControlContainer)\n{\n    super(a_graphControlContainer);\n\
    \n    var loader:URLLoader = new URLLoader();\n    var request:URLRequest = new\
    \ URLRequest();\n    //Specify which Graph URL to load\n    request.url = \"https://graph.facebook.com/PacktPub/posts\"\
    ;\n    loader.addEventListener(Event.COMPLETE, onGraphDataLoadComplete);\n   \
    \ //Start the actual loading process\n    loader.load(request);\n}\n```\n\nNow,\
    \ once this is loaded, we need to check whether the item returned is a Graph Object\
    \ or a Graph List. We can do this by looking for a property called data; if one\
    \ exists, we'll assume it's a List.\n\n```\nprivate function onGraphDataLoadComplete(a_event:Event):void\n\
    {\n    var loader:URLLoader = a_event.target as URLLoader;\n    //obtain whatever\
    \ data was loaded, and trace it\n    var graphData:String = loader.data;\n   \
    \ var decodedJSON:Object = JSON.decode(graphData);\n\n    if (decodedJSON.data)\n\
    \    {\n        //has a \"data\" property so we assume it is a Graph List\n  \
    \  }\n}\n```\n\n```\nelse\n{\n    //no \"data\" so we assume it is a Graph Object\n\
    \    var graphObject:GraphObject = new GraphObject();\n    //copy all the properties\
    \ from decodedJSON to graphObject\n    for (var key:String in decodedJSON)\n \
    \   {\n        graphObject[key] = decodedJSON[key];\n    }\n    this.renderGraphObject(graphObject);\n\
    }\n```\n\nInside this if block, we first create a new GraphList instance:\n\n\
    ```\nif (decodedJSON.data)\n{\n    //has a \"data\" property so we assume it is\
    \ a Graph List\n    var graphList:GraphList = new GraphList();\n}\n```\n\n(You\
    \ will need to import graph.GraphList.)\n\nNext, remember than decodedJSON.data\
    \ is an array of objects; we loop through this array, and create a GraphObject\
    \ from each element.\n\n```\nif (decodedJSON.data)\n{\n    //has a \"data\" property\
    \ so we assume it is a Graph List\n    var graphList:GraphList = new GraphList();\n\
    \    var childGraphObject:GraphObject;\n    for each (var childObject:Object in\
    \ decodedJSON.data)\n    {\n        childGraphObject = new GraphObject();\n  \
    \      for (var childKey:String in childObject)\n        {\n            childGraphObject[childKey]\
    \ = childObject[childKey];\n        }\n    }\n}\n```\n\nThis is basically the\
    \ same thing we did with the decodedJSON when loading a single Graph Object.\n\
    \nWhat about the other property inside the Graph List, the paging object? We should\
    \ add that too:\n\n```\nif (decodedJSON.data)\n{\n    //has a \"data\" property\
    \ so we assume it is a Graph List\n    var graphList:GraphList = new GraphList();\n\
    \    var childGraphObject:GraphObject,\n    for each (var childObject:Object in\
    \ decodedJSON.data)\n    {\n        childGraphObject = new GraphObject();\n  \
    \      for (var childKey:String in childObject)\n        {\n            childGraphObject[childKey]\
    \ = childObject[childKey];\n        }\n        graphList.addToList(childGraphObject);\n\
    \    }\n    graphList.paging = decodedJSON.paging;\n}\n```\n\nFinally, we pass\
    \ the GraphList instance to renderGraphList():\n\n```\nif (decodedJSON.data)\n\
    {\n    //has a \"data\" property so we assume it is a Graph List\n    var graphList:GraphList\
    \ = new GraphList();\n    var childGraphObject:GraphObject,\n    for each (var\
    \ childObject:Object in decodedJSON.data)\n    {\n        childGraphObject = new\
    \ GraphObject();\n        for (var childKey:String in childObject)\n        {\n\
    \            childGraphObject[childKey] = childObject[childKey];\n        }\n\
    \        graphList.addToList(childGraphObject);\n    }\n    graphList.paging =\
    \ decodedJSON.paging;\n    this.renderGraphList(graphList);\n}\n```\n\n## Welcome\
    \ to the Graph\n\nCompile the SWF and test it. The following screenshot shows\
    \ the result:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_58_0.png)\n\nIt's a\
    \ scrollable window containing all the Graph Objects from the list.\n\nWhat happens\
    \ when you click the Pop Out button underneath a Graph Object?\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_58_1.png)\n\
    \nAs you can probably guess, setting variables.metadata = 1 is exactly the same\
    \ as sticking ?metadata=1 on the end of the URL. Doing it this way takes a few\
    \ more lines, but it makes it much easier to set different parameters, and keeps\
    \ the parameters separate from the URL.\n\nAnyway, compile the SWF and you should\
    \ see the following screenshot:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_61_0.png)\n\
    \nNotice the new Connections bar at the bottom of the Renderer? Click on the Show\
    \ button:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_61_1.png)\n\n## What just\
    \ happened?\n\nWe can now see all of the connections of a Graph Object right there\
    \ in its renderer. Of course, that's not very interesting unless we can see what's\
    \ at the other end of each connection!\n\n## Introducing the Requestor\n\nIdeally,\
    \ whenever the user clicks a connection from the scrolling list, a new Graph List\
    \ Renderer of that connection will be created and displayed.\n\nTo do this, we'd\
    \ need to add a MouseEvent.CLICK listener to the list, and use it to trigger a\
    \ new URLLoader request for the clicked connection.\n\nFortunately, all the UI\
    \ code has already been provided elsewhere in the project; we just need to tap\
    \ into that. To do this, we'll need to make use of what I call a Requestor.\n\n\
    ## Time for action – creating an HTTP Requestor\n\nThe idea is, we move all of\
    \ the code regarding the URLLoader from CustomGraphContainerController to a separate\
    \ class, called HTTPRequestor. We will then replace the CustomGraphContainerController\
    \ constructor with this:\n\n```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    _requestor = new HTTPRequestor();\n\
    \    _requestor.request(new GraphRequest(\"PacktPub\"));\n}\n```\n\nWhy bother?\
    \ Well, apart from being neater, there are two main advantages:\n\n- 1. It's much\
    \ simpler to request several Graph Objects or Graph Lists; no need to deal with\
    \ multiple instances of URLLoader.\n- 2. In the next chapter, we'll see how to\
    \ use the official Adobe AS3 Facebook SDK to retrieve information from the Graph\
    \ API. If all the code for a request is encapsulated in one class, then we only\
    \ need to change one line to switch from using HTTP to using Adobe's SDK:\n```\n\
    public function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    _requestor = new SDKRequestor();\n\
    \    _requestor.request(new GraphRequest(\"PacktPub\"));\n}\n```\n"
  mdcn: "\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_53_0.png)\n\n但在数学中，“图”指的是由边连接起来的任意节点集合，如下一张图所示：\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_53_1.png)\n\nGraph API 对 Facebook 数据的表示方式如下图所示：\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_53_2.png)\n\n在上图中，每个对象都是一个节点，线条代表不同类型的连接。\n\
    \n获取 http://graph.facebook.com/packtpub/posts 可以得到所有通过 “post” 连接与 PacktPub 相连的节点——即所有发布在\
    \ Packt 主页上的 Post 对象：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_54_0.png)\n\n\
    ## 动手实践——探索连接\n\n既然你已经了解了 metadata 参数，不妨在浏览器中探索不同类型的连接，看看你还能发现哪些新类型的对象。\n\n##\
    \ 渲染列表\n\n如果尝试使用我们加载 Packt Publishing Page 对象时所用的同一段代码来加载 https://graph.facebook.com/packtpub/posts，会发生什么？\n\
    \n我们在输出面板中得到：\n\nGraph Object was null!\n\n并不成功。Graph API 在这里组织 JSON 的方式与它为 Page、Post\
    \ 或任何其他 Graph Object 组织 JSON 的方式完全不同。其他连接 URL 返回的 JSON 也是如此。我们把这种结构称为 Graph List。\n\
    \n## 动手实践——渲染帖子列表\n\n由于 Graph List 的 data 属性是一个由 Graph Object 组成的数组，我们可以直接遍历该数组，并为每个元素创建一个新的\
    \ Graph Object Renderer。如果你愿意，当然可以自己试一试，不过我有另一种解决方案。\n\n我创建了第二个渲染器——这次是 Graph\
    \ List Renderer。我还创建了一个名为 graph.GraphList 的类。CustomGraphContainerController 继承了一个名为\
    \ renderGraphList() 的方法。不出意料，该方法接收一个 graph.GraphList 类型的对象作为参数，并创建一个新的 Graph List\
    \ Renderer 来显示其内容。因此，我们需要从 Graph API 接收一个 Graph List，并将其转换为 GraphList 类的实例。GraphList\
    \ 类比 GraphObject 类要稍微复杂一些；它有一个名为 addToList() 的方法，我们可以向它传递任意 GraphObject 实例，将其添加到列表中。\n\
    \n我们仍然需要遍历 data 数组，但不再单独渲染每个 GraphObject，而是将每个对象添加到一个 GraphList 中，然后渲染该列表。\n\n\
    修改 CustomGraphContainerController 请求的 URL，使其加载帖子列表：\n\n```\npublic function CustomGraphContainerController\n\
    \    (a_graphControlContainer:GraphControlContainer)\n{\n    super(a_graphControlContainer);\n\
    \n    var loader:URLLoader = new URLLoader();\n    var request:URLRequest = new\
    \ URLRequest();\n    //Specify which Graph URL to load\n    request.url = \"https://graph.facebook.com/PacktPub/posts\"\
    ;\n    loader.addEventListener(Event.COMPLETE, onGraphDataLoadComplete);\n   \
    \ //Start the actual loading process\n    loader.load(request);\n}\n```\n\n现在，加载完成后，我们需要检查返回的项目是\
    \ Graph Object 还是 Graph List。我们可以通过查找名为 data 的属性来判断：如果该属性存在，我们就假定它属于 Graph List。\n\
    \n```\nprivate function onGraphDataLoadComplete(a_event:Event):void\n{\n    var\
    \ loader:URLLoader = a_event.target as URLLoader;\n    //obtain whatever data\
    \ was loaded, and trace it\n    var graphData:String = loader.data;\n    var decodedJSON:Object\
    \ = JSON.decode(graphData);\n\n    if (decodedJSON.data)\n    {\n        //has\
    \ a \"data\" property so we assume it is a Graph List\n    }\n}\n```\n\n```\n\
    else\n{\n    //no \"data\" so we assume it is a Graph Object\n    var graphObject:GraphObject\
    \ = new GraphObject();\n    //copy all the properties from decodedJSON to graphObject\n\
    \    for (var key:String in decodedJSON)\n    {\n        graphObject[key] = decodedJSON[key];\n\
    \    }\n    this.renderGraphObject(graphObject);\n}\n```\n\n在这个 if 块中，我们首先创建一个新的\
    \ GraphList 实例：\n\n```\nif (decodedJSON.data)\n{\n    //has a \"data\" property\
    \ so we assume it is a Graph List\n    var graphList:GraphList = new GraphList();\n\
    }\n```\n\n（你需要导入 graph.GraphList。）\n\n接下来，记住 decodedJSON.data 是一个对象数组；我们遍历这个数组，并从每个元素创建一个\
    \ GraphObject。\n\n```\nif (decodedJSON.data)\n{\n    //has a \"data\" property\
    \ so we assume it is a Graph List\n    var graphList:GraphList = new GraphList();\n\
    \    var childGraphObject:GraphObject;\n    for each (var childObject:Object in\
    \ decodedJSON.data)\n    {\n        childGraphObject = new GraphObject();\n  \
    \      for (var childKey:String in childObject)\n        {\n            childGraphObject[childKey]\
    \ = childObject[childKey];\n        }\n    }\n}\n```\n\n这基本上与加载单个 Graph Object\
    \ 时我们对 decodedJSON 所做的操作相同。\n\n那么 Graph List 中的另一个属性——paging 对象呢？我们也应该把它加进来：\n\
    \n```\nif (decodedJSON.data)\n{\n    //has a \"data\" property so we assume it\
    \ is a Graph List\n    var graphList:GraphList = new GraphList();\n    var childGraphObject:GraphObject,\n\
    \    for each (var childObject:Object in decodedJSON.data)\n    {\n        childGraphObject\
    \ = new GraphObject();\n        for (var childKey:String in childObject)\n   \
    \     {\n            childGraphObject[childKey] = childObject[childKey];\n   \
    \     }\n        graphList.addToList(childGraphObject);\n    }\n    graphList.paging\
    \ = decodedJSON.paging;\n}\n```\n\n最后，我们将 GraphList 实例传递给 renderGraphList()：\n\
    \n```\nif (decodedJSON.data)\n{\n    //has a \"data\" property so we assume it\
    \ is a Graph List\n    var graphList:GraphList = new GraphList();\n    var childGraphObject:GraphObject,\n\
    \    for each (var childObject:Object in decodedJSON.data)\n    {\n        childGraphObject\
    \ = new GraphObject();\n        for (var childKey:String in childObject)\n   \
    \     {\n            childGraphObject[childKey] = childObject[childKey];\n   \
    \     }\n        graphList.addToList(childGraphObject);\n    }\n    graphList.paging\
    \ = decodedJSON.paging;\n    this.renderGraphList(graphList);\n}\n```\n\n## 欢迎来到\
    \ Graph\n\n编译 SWF 并进行测试。下面的截图显示了结果：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_58_0.png)\n\
    \n它是一个可滚动的窗口，包含列表中的所有 Graph Object。\n\n当你点击 Graph Object 下方的 Pop Out 按钮时会发生什么？\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_58_1.png)\n\n你可能已经猜到，设置 variables.metadata\
    \ = 1 与在 URL 末尾加上 ?metadata=1 完全一样。这样做虽然需要多写几行代码，但可以更容易地设置不同的参数，也能让参数与 URL 分离。\n\
    \n无论如何，编译 SWF，你应该会看到下面的截图：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_61_0.png)\n\
    \n注意到 Renderer 底部新增的 Connections 栏了吗？点击 Show 按钮：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_61_1.png)\n\
    \n## 刚才发生了什么？\n\n我们现在可以在 Graph Object 的渲染器中直接看到它的所有连接。当然，除非我们能看到每条连接的末端是什么，否则这并没有太大意义！\n\
    \n## 引入 Requestor\n\n理想情况下，当用户从滚动列表中点击某个连接时，应该创建并显示该连接对应的一个新的 Graph List Renderer。\n\
    \n为此，我们需要向列表添加一个 MouseEvent.CLICK 监听器，并用它来触发对被点击连接的新 URLLoader 请求。\n\n幸运的是，项目中的其他地方已经提供了全部\
    \ UI 代码；我们只需要接入即可。为此，我们需要使用我所说的 Requestor。\n\n## 动手实践——创建 HTTP Requestor\n\n思路是将\
    \ CustomGraphContainerController 中与 URLLoader 相关的所有代码移动到一个单独的类中，名为 HTTPRequestor。然后，我们将\
    \ CustomGraphContainerController 的构造函数替换为以下内容：\n\n```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    _requestor = new HTTPRequestor();\n\
    \    _requestor.request(new GraphRequest(\"PacktPub\"));\n}\n```\n\n为什么要这么做？除了更简洁之外，还有两个主要优点：\n\
    \n- 1. 请求多个 Graph Object 或 Graph List 要简单得多；无需处理多个 URLLoader 实例。\n- 2. 在下一章中，我们将看到如何使用官方的\
    \ Adobe AS3 Facebook SDK 从 Graph API 检索信息。如果请求的所有代码都封装在一个类中，那么只需要修改一行代码，就可以从使用\
    \ HTTP 切换到使用 Adobe 的 SDK：\n\n```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    _requestor = new SDKRequestor();\n\
    \    _requestor.request(new GraphRequest(\"PacktPub\"));\n}\n```\n\n"
