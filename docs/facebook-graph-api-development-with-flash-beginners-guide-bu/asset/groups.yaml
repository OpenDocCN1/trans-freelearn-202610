    # Choosing your application''s Facebook settings


    There''s more to an application''s settings than Canvas URLs. Here are some of
    the more interesting options:


    +   - **Advanced | Deauthorize Callback**: Here you can specify a URL that will
    get called whenever a user removes your application; the ID of the user will be
    passed to this URL. In order to do something with this ID, you''ll need to use
    a server-side scripting language – see "What Next?" later in this chapter. More
    information on decoding the info is available here: http://developers.facebook.com/docs/authentication/

    +   - **About | Developers**: Allows you to set other users as a developer of
    your application, giving them access to the application settings.

    +   - **Advanced | Sandbox Mode**: Very useful for testing, this will only allow
    a user to sign in to your application if they are listed as a developer of that
    application.

    +   - **Facebook Integration | Bookmark URL**: On the left side of the Facebook
    home page, you can see a list of applications and games that you''ve used:

    +   - These are called **Bookmarks**; setting the Bookmark URL lets you choose
    where these links point to.

    +   The number to the right of a Bookmark is called a **Counter**, and lets the
    user know about notifications and changes within the application. Read more about
    Counters here: http://developers.facebook.com/docs/guides/canvas/#bookmarks.

    +   - **About | Icon and About | Logo**: The icon appears next to Bookmarks and
    below wall posts created via your app, while the logo appears in the authorization
    page and in search results.


