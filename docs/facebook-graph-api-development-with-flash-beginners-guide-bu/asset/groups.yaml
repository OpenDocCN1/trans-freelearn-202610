  - '[PAGE 238]


    # Notes


    Notes are like little blog posts:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_238_0.png)


    The URL to request is: https://graph.facebook.com/<id>/notes.


    The ID can only be that of the current user, or of a Page which the user administers.


    Despite generally being longer than Wall Posts—and being able to support images,
    links, and formatted text—they take only two parameters:


    +   - message: This is an HTML string (so that explains the ability to add images
    and formatting)

    +   - subject: The title of the note


    To post a note, your application will need the publish_stream permission.'
  - '[PAGE 239]


    # Events


    Events look like this:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_239_0.png)


    Like a Page, an Event has a Wall, which can be posted to using the /«event_id»/feed
    URL stub. Events also have lists of members, but they are divided into four categories:


    +   ♦ Attending: /«event_id»/attending

    +   ♦ Maybe attending: /«event_id»/maybe

    +   ♦ Not attending: /«event_id»/declined

    +   ♦ Awaiting reply: /«event_id»/noreply'
  - '[PAGE 240]


    Guests can be invited and can RSVP with any of the first three categories; this
    makes scheduling somewhat easier.


    Another connection, /«event_id»/invited, contains a list of everyone that has
    been invited to the event, regardless of their RSVP.


    To create an Event, POST to this URL: https://graph.facebook.com/«id»/events.


    (As with Notes, the ID can only be the current user''s or that of a Page which
    the user administers.)


    Three parameters are required:


    +   - `name`: The title of the event

    +   - `start_time`: The time and date the event will start

    +   - `end_time`: The time and date the event will finish


    Both dates must be entered in **ISO 8601** format. Wikipedia has more information
    than you''ll ever need to know on ISO 8601 (http://en.wikipedia.org/wiki/ISO_8601);
    a quick summary is that **1:25pm UTC, November 8, 2010** is represented as `2010-11-08T13:25Z`.
    If you let the user enter the time manually, make sure that you alter it to match
    the UTC time zone!


    To create an event, your application will need the `create_event` permission.


    # Event RSVPs


    Rather than having a single URL to POST an RVSP to, and setting the type of RSVP
    in the parameters, Facebook uses three separate URLs:


    +   - https://graph.facebook.com/«event_id»/attending: attending

    +   - https://graph.facebook.com/«event_id»/maybe: maybe attending

    +   - https://graph.facebook.com/«event_id»/declined: not attending


    When RSVPing through the website interface, Facebook will ask the user for an
    (optional) note to go along with it (such as, "Sorry I can''t make it that day,"
    or "Really looking forward to it!"). However, the preceding three URLs take no
    parameters; if you want to let the user post an RSVP note, simply publish it to
    the `/feed` connection as a Post.


    RVSPs aren''t written in stone; the user can change their mind later. Bear this
    in mind when designing an application for this! Don''t stop them from setting
    their RSVP status just because they already have one.


    To RSVP, your application will need the `rsvp_event` permission.'
