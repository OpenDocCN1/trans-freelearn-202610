  - "[PAGE 289]\n\nPortals might prevent SWFs from loading data from external sites,\
    \ which would mean that accessing even public Graph data would be tricky or impossible.\
    \ This is not particularly likely – if external resources are completely blocked,\
    \ how could in-game advertising work? – but it’s worth looking out for.\n\nThe\
    \ true problem lies in authentication. This is for two reasons:\n\n+   ♦ In order\
    \ to obtain an access token, we call a JavaScript function within the page where\
    \ the SWF is embedded. But Flash game portals don’t give us access to the source\
    \ of the web page, so we can’t insert this JavaScript function to be run. On top\
    \ of that, portals are likely to prevent SWFs from using `ExternalInterface` to\
    \ call JavaScript functions, because they pose a potential security risk.\n+ \
    \  \n+   ♦ In Chapter 3, we learned that we had to set the Site URL to match the\
    \ base domain name of our application’s host. If these didn’t match – say, if\
    \ your application was at `http://portal.com/games/awesomegame.html` but the Site\
    \ URL was set to `http://host.com/~` Facebook would not let the user authenticate.\
    \ This means we can’t allow games hosted on different portals to authenticate\
    \ through the same Facebook application.\n\nSo, sadly, Facebook did not design\
    \ their applications model for SWFs that can be run from different sites. A possible\
    \ workaround is to import a separate SWF, hosted on your own server, into the\
    \ main game SWF, and let that separate SWF handle authentication… but implementing\
    \ that is beyond the scope of this book.\n\nHowever, you don’t have to do all\
    \ that work yourself! If you don’t need access to the entire Graph API, and only\
    \ want to be able to post messages on the user’s Wall, retrieve their profile\
    \ information, and obtain a list of their Facebook friends, then you can use the\
    \ Mochi Social Platform.\n\nThis is a free ActionScript API, provided by Mochi\
    \ Media, which ties in to the Facebook, Twitter, and MySpace APIs, allowing you\
    \ to post to and access data from all three social networks. It also allows you\
    \ to store arbitrary data about the player and link it to their social networking\
    \ profile. This means you can store their top scores, other stats, or even entire\
    \ custom levels that they’ve built.\n\nFor more information, visit `http://www.mochimedia.com/developers/social.html`.\n\
    \n# As a desktop AIR application\n\nAlthough much of the `HTTPRequestor` code\
    \ we’ve written will work in a desktop AIR application without any changes, there’s\
    \ one sticking point: authentication. Since, when using AIR, we don’t have an\
    \ SWF embedded in an HTML page, how can we display the Facebook authorization\
    \ page, obtain the access token, and pass it to an AS3 function?"
