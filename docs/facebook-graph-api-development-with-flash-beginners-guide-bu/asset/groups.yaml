    \nAs you can see, Facebook's security restricts access to what information you\
    \ can see about a person. It's not a simple binary setting – \"you can either\
    \ see this information or that information\" – rather, it's based on:\n\n- How\
    \ you are connected to the other person\n- Whether or not you are logged in to\
    \ Facebook\n\nWhat's particularly interesting is that you can often see more information\
