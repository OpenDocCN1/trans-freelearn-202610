    \nDespite generally being longer than Wall Posts—and being able to support images,\
    \ links, and formatted text—they take only two parameters:\n\n- message: This\
    \ is an HTML string (so that explains the ability to add images and formatting)\n\
    - subject: The title of the note\n\nTo post a note, your application will need\
    \ the publish_stream permission.\n\n## Events\n\nEvents look like this:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_239_0.png)\n\
    \nLike a Page, an Event has a Wall, which can be posted to using the /«event_id»/feed\
    \ URL stub. Events also have lists of members, but they are divided into four\
    \ categories:\n\n- ♦ Attending: /«event_id»/attending\n- ♦ Maybe attending: /«event_id»/maybe\n\
    - ♦ Not attending: /«event_id»/declined\n- ♦ Awaiting reply: /«event_id»/noreply\n\
    \nGuests can be invited and can RSVP with any of the first three categories; this\
    \ makes scheduling somewhat easier.\n\nAnother connection, /«event_id»/invited,\
    \ contains a list of everyone that has been invited to the event, regardless of\
    \ their RSVP.\n\nTo create an Event, POST to this URL: https://graph.facebook.com/«id»/events.\n\
    \n(As with Notes, the ID can only be the current user's or that of a Page which\
    \ the user administers.)\n\nThree parameters are required:\n\n- `name`: The title\
    \ of the event\n- `start_time`: The time and date the event will start\n- `end_time`:\
    \ The time and date the event will finish\n\nBoth dates must be entered in **ISO\
    \ 8601** format. Wikipedia has more information than you'll ever need to know\
    \ on ISO 8601 (http://en.wikipedia.org/wiki/ISO_8601); a quick summary is that\
    \ **1:25pm UTC, November 8, 2010** is represented as `2010-11-08T13:25Z`. If you\
    \ let the user enter the time manually, make sure that you alter it to match the\
    \ UTC time zone!\n\nTo create an event, your application will need the `create_event`\
    \ permission.\n\n## Event RSVPs\n\nRather than having a single URL to POST an\
    \ RVSP to, and setting the type of RSVP in the parameters, Facebook uses three\
    \ separate URLs:\n\n- https://graph.facebook.com/«event_id»/attending: attending\n\
    - https://graph.facebook.com/«event_id»/maybe: maybe attending\n- https://graph.facebook.com/«event_id»/declined:\
    \ not attending\n\nWhen RSVPing through the website interface, Facebook will ask\
    \ the user for an (optional) note to go along with it (such as, \"Sorry I can't\
    \ make it that day,\" or \"Really looking forward to it!\"). However, the preceding\
    \ three URLs take no parameters; if you want to let the user post an RSVP note,\
    \ simply publish it to the `/feed` connection as a Post.\n\nRVSPs aren't written\
    \ in stone; the user can change their mind later. Bear this in mind when designing\
    \ an application for this! Don't stop them from setting their RSVP status just\
    \ because they already have one.\n\nTo RSVP, your application will need the `rsvp_event`\
    \ permission.\n\n```\nloader.addEventListener(HTTPStatusEvent.HTTP_STATUS,\n \
    \   onHTTPStatusReturned);\nloader.addEventListener(SecurityErrorEvent.SECURITY_ERROR,\n\
    \    onSecurityError);\nloader.load(urlRequest);\n```\n\n...we must do this:\n\
    \n```\nvariables.message = a_publishObject.message;\nvariables.source = a_publishObject.source;\n\
    urlRequest.data = variables;\na_publishObject.source.addEventListener(\n    DataEvent.UPLOAD_COMPLETE_DATA,\
    \ onPublishComplete);\na_publishObject.source.addEventListener(IOErrorEvent.IO_ERROR,\n\
    \    onIOError);\na_publishObject.source.addEventListener(HTTPStatusEvent.HTTP_STATUS,\n\
    \    onHTTPStatusReturned);\na_publishObject.source.addEventListener(\n    SecurityErrorEvent.SECURITY_ERROR,\
    \ onSecurityError);\na_publishObject.source.upload(urlRequest);\n```\n\nNo real\
    \ changes are needed for the SDK Requestor; it uses a FileReference and encapsulates\
    \ the upload process. This means that we can just call Facebook.api() as usual:\n\
    \n```\nFacebook.api(urlStub, publishComplete,\n{\n    message:a_publishObject.message,\n\
    \    source:a_publishObject.source\n},\nURLRequestMethod.POST\n);\n```\n\nIn each\
    \ case, remember to change the URL stub to /«album_id»/photos.\n\nUploading a\
    \ photo to an Album requires the publish_stream permission. As with Albums, you\
    \ may want to grant the user_photos permission as well.\n\nNot surprisingly, in\
    \ order to add a photo to an Album, the user must either own the Album, or administer\
    \ the Page which owns the Album.\n\n## Checkins\n\n**Checkins** are used by Facebook\
    \ Places and allow the user to post their current location and a message about\
    \ that place.\n\nTo create a checkin, POST to this URL: https://graph.facebook.com/«user_id»/checkins.\n\
    \nThe only ID allowed is that of the authenticated user (so you could use me instead).\n\
    \nThree parameters are supported:\n\n- `coordinates`\n- `place`\n- `message`\n\
    \nThe `coordinates` parameter must be a JSON string containing two properties—latitude\
    \ and longitude. Use the JSON.encode() method from earlier in this chapter to\
    \ turn a native AS3 object into a JSON string.\n\nThe `place` parameter should\
    \ be the ID of a Place corresponding to the place the user is currently visiting.\
    \ In Chapter 5, we saw how to search for Places near a given location, and retrieve\
    \ their IDs.\n\nThe `message` parameter is optional—it's a simple comment by the\
    \ user about what they're doing. For example, \"Just went on the Log Flume at\
    \ Alton Towers.\"\n\nCreating a checkin requires the `publish_checkins` permission.\
    \ You may wish to grant the `user_checkins` permission as well to allow the user\
    \ to view their other checkins.\n\n## What about...?\n\nThere are a lot of things\
    \ you can do via Facebook's website interface, but not through the Graph API.\
    \ We've already looked at the restrictions to the \"like\" feature; what else\
    \ is missing?\n\n## Sending inbox messages\n\nIt's possible to read inbox messages\
    \ (as we saw in Chapter 5) but not to create and send them. Facebook had planned\
    \ to allow apps to create inbox messages but this plan appears to have been scrapped.\
    \ It's possible that this functionality will be included as part of the new messages;\
    \ see Chapter 8 for a little more information on this.\n\n## Creating Pages, Groups,\
    \ Applications, and Videos\n\nIt's not possible to create any of these types of\
    \ Graph Object via the Graph API.\n\nThis is a little surprising—a Group is not\
    \ that different from an Event, and a Page, in turn, is not that different from\
    \ a Group. The lack of video creation ability is even stranger, as it means it's\
    \ not possible to create a mobile application that uploads video directly to Facebook.\n\
    \nNot being able to create applications through other applications makes some\
    \ sense though!\n\n## Changing biographical information\n\nYour application can't\
    \ alter the user's relationship status, current location, favorite quotations,\
    \ record of education, or anything of the sort. Because the Graph API doesn't\
    \ allow \"liking/unliking\" anything other than Wall posts, it means the user's\
    \ entire Info box is \"look but don't touch.\"\n\n## Making Friends\n\nIt's not\
    \ possible for an application to send a friend request to another user, or to\
    \ remove someone from the current user's friend list. (Although you can send other\
    \ users enough rude messages to encourage them to remove the current user from\
    \ their friend list.)\n\n## Inviting Friends to Events\n\nYou can create Events,\
    \ but you can't invite anyone to them. Go figure.\n\n## Pop Quiz\n\n- 1. Why do\
    \ we need to use a different HTTP request method all of a sudden?\n  a. We should\
