  md: "\nAs you can see, there's a new **Search** button in the top-left corner, which\
    \ makes the new **Search** window appear in the main stage area. You'll recognise\
    \ the first six radio buttons as corresponding to allowed values for the `type`\
    \ parameter; don't worry about **My News Feed** or **Friend's Posts** for now.\n\
    \nWhen the **Search** button inside the window is clicked, it calls a function\
    \ called `search()` inside the class that `CustomGraphContainerController.as`\
    \ extends, passing it three values:\n\n- Query\n- Type\n- User ID (which contains\
    \ the value in the lower textbox – again, we'll come to this later)\n\nThis function\
    \ is completely empty, so clicking that button doesn't do anything at the moment;\
    \ we'll have to override `search()` and make it work!\n\n1. In `CustomGraphContainerController.as`,\
    \ add the following function:\n\n```\noverride public function search(a_query:String\
    \ = \"\", a_type:String = \"\", a_userID:String = \"\"):void\n{\n\n}\n```\n\n\
    2. Now to add the actual search code. Let’s start with the HTTP Requestor. The\
    \ process is very similar to requesting a Graph Object or Graph List directly\
    \ – in fact, it's even simpler. Open `HTTPRequestor.as` and create a new function\
    \ as so:\n\n```\npublic function search(a_query:String = \"\", a_type:String =\
    \ \"\"):void\n{\n    var loader:URLLoader = new URLLoader();\n    var urlRequest:URLRequest\
    \ = new URLRequest();\n    var variables:URLVariables = new URLVariables();\n\n\
    \    urlRequest.url = \"https://graph.facebook.com/search\";\n\n    variables.metadata\
    \ = 1;\n    if (accessToken != \"\")\n    {\n        variables.access_token =\
    \ accessToken;\n    }\n    variables.q = a_query;    //not variables.query!\n\
    \    variables.type = a_type;\n```\n\n### What just happened?\n\nOur Visualizer\
    \ can now search for Graph objects based on a query that you enter. Since the\
    \ results are returned in the form of a Graph List, our application will then\
    \ grab all the info about those objects – and this means we can see their connections,\
    \ too.\n\n### Time for action – searching via the SDK\n\nIt's easy to make our\
    \ search work via the SDK, too. Start by opening SDKRequestor.as and adding a\
    \ new function called search(), just as we did with the HTTPRequestor:\n\n```\n\
    public function search(a_query:String = \"\", a_type:String = \"\"):void\n{\n\
    }\n```\n\nAs with a request, we pass three parameters to the Facebook.api() method:\n\
    \n1. /search (a string containing the key part of the Graph URL)\n2. A reference\
    \ to a callback function\n3. An object containing the parameters (q and type –\
    \ remember not to use query as the name of the parameter!)\n\nSo, add this call\
    \ to your search() function as shown in the following code:\n\n```\npublic function\
    \ search(a_query:String = \"\", a_type:String = \"\"):void\n{\n    Facebook.api(\n\
    \        \"/search\",\n        searchComplete,\n        { metadata: 1, q:a_query,\
    \ type:a_type }\n    );\n}\n```\n\nThere was no need to use currying this time,\
    \ as we don't need to maintain a reference to the original GraphRequest object.\n\
    \nThat's it for the search() function. We still need to write the callback for\
    \ when the data is loaded though, so create a new function, searchComplete(),\
    \ as shown in the following lines of code:\n\n```\nprivate function searchComplete(success:Object,\
    \ fail:Object):void\n{\n}\n```\n\nLike the other SDK callbacks, this function\
    \ must accept two parameters: result and fail.\n\nSince the search results are\
    \ returned in the form of a Graph List, we can re-use most of the code from the\
    \ requestComplete() function. Modify searchComplete() as shown in the following\
    \ lines of code:\n\n```\nprivate function searchComplete(result:Object, fail:Object):void\n\
    {\n    if (result != null)\n    {\n        var decodedJSON:Object = result;\n\
    \        var graphList:GraphList = new GraphList();\n        var childGraphObject:GraphObject;\n\
    \        for each (var childObject:Object in decodedJSON)\n        {\n       \
    \     childGraphObject = new GraphObject();\n            for (var childKey:String\
    \ in childObject)\n            {\n                childGraphObject[childKey] =\
    \ childObject[childKey];\n            }\n            graphList.addToList(childGraphObject);\n\
    \        }\n        graphList.paging = decodedJSON.paging;\n\n        dispatchEvent(new\
    \ RequestEvent(RequestEvent.REQUEST_COMPLETED, graphList));\n    }\n    else\n\
    \    {\n        //was a failure. See contents of 'fail' object.\n    }\n}\n```\n\
    \nJust as with the HTTP Requestor, check Chapter 2 and Chapter 3 if you want a\
    \ reminder of how this all works.\n\nNow that both Requestors have a search()\
    \ method; we can add that method to the IRequestor interface. Modify IRequestor\
    \ as like so:\n\n```\npackage graph.apis.base\n{\n    import flash.events.IEventDispatcher;\n\
    \    import graph.GraphRequest;\n\n    public interface IRequestor extends IEventDispatcher\n\
    \    {\n        function request(a_request:GraphRequest):void;\n        function\
    \ attemptToAuthenticate(...permissions):void;\n        function initialize():void;\n\
    \        function search(a_query:String = \"\", a_type:String = \"\"):void;\n\
    \    }\n}\n```\n\nThis means we don't have to cast _requestor as an HTTPRequestor\
    \ in CustomGraphContainerController.search() any more, so open CustomGraphContainerController.as\
    \ and alter that method:\n\n```\noverride public function search(a_query:String\
    \ = \"\", a_type:String = \"\", a_userID:String = \"\"):void\n{\n    _requestor.search(a_query,\
    \ a_type);\n}\n```\n\nAll that's left before we can test it is to change the constructor\
    \ so that _requestor is created as an SDKRequestor rather than an HTTPRequestor.\
    \ This is done as follows:\n\n```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    this._showListCounts = true;\n   \
    \ this._showListFilters = true;\n    this._canShowSearchUI = true;\n\n    _requestor\
    \ = new SDKRequestor();\n    addEventListenersToRequestor();\n    //we must wait\
    \ for the Requestor to initialise before we can do anything else with it\n   \
    \ _requestor.addEventListener(Event.COMPLETE, onRequestorInitialize);\n\n    _requestor.initialize();\n\
    }\n```\n\n### Search Me\n\nSave, compile, and upload the SWF. Load it in your\
    \ browser – remember to use sdkindex.html.\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_184_0.png)\n\
    \nGreat, it works!\n\n### What just happened?\n\nWe just added the same search\
    \ functionality as before, but this time we made it work via the SDK. Bear in\
    \ mind that this means that the access token is automatically used, if the user\
    \ is authenticated.\n\n### Have a go hero – setting the locale\n\nNow that we\
    \ can search for posts, how about restricting the search to posts written by people\
    \ with a specified locale?\n\nYou could hardcode the locale to use within the\
    \ search() method, or (if you're comfortable with manipulating XML) you could\
    \ make your project pick one of the locales at random, from http://www.facebook.com/translations/FacebookLocales.xml.\n\
    \n## Searching feeds and wall posts\n\nThe Graph URL search may be limited compared\
    \ to Facebook's Full Search, but there are two types of search that can only be\
    \ done via the Graph API:\n\n- Searching for specific items in your news feed\n\
    - Searching for things that a specific friend has posted\n\n### Time for action\
    \ – searching your news feed\n\nYour news feed is the list you see when you log\
    \ in to the Facebook website; all the status updates, links, videos, and photos\
    \ that your friends (and other Graph websites to which you are subscribed, such\
    \ as pages you \"like\") have posted.\n\nWe've seen that we can access this feed\
    \ through your profile's home connection:\n\n```\nhttps://graph.facebook.com/me/home?access_token=«access_token»\n\
    ```\n\nwhich returns a Graph List, as you'd expect.\n\nWe can search within this\
    \ feed by specifying a value for the q parameter:\n\n```\nhttps://graph.facebook.com/me/home?q=test&access_token=«access_token»\n\
    ```\n\n```\n\"data\": [\n  {\n    \"id\": \"151673724649_415202504649\",\n   \
    \ \"from\": {\n      \"name\": \"Activetuts\",\n      \"category\": \"Products_other\"\
    ,\n      \"id\": \"151673724649\"\n    },\n    \"message\": \"Test Your Observation\
    \ Skills With an AS3 Difference Game \\u2013 Active Premium\",\n    \"link\":\
    \ \"http://feedproxy.google.com/~r/Flashtuts/~3/i8-bZF-Mvhc/\",\n    \"description\"\
    : \"Today, we have another Active Premium tutorial exclusively available to Premium\
    \ members. If you want to take your ActionScript skills to the next level, then\
    \ we have an awesome tutorial for you, courtesy of Stephan Meesters\",\n    \"\
    type\": \"link\",\n    \"created_time\": \"2010-07-28T11:07:12+0000\",\n    \"\
    updated_time\": \"2010-07-28T11:07:12+0000\"\n  }\n],\n\"paging\": {\n```\n"
  mdcn: "\n可以看到，左上角新增了一个**搜索**按钮，点击后主舞台区域会显示新的**搜索**窗口。你会注意到前六个单选按钮对应`type`参数的允许值；暂时不用关心**我的动态**或**好友的帖子**。\n\
    \n当点击窗口内的**搜索**按钮时，它会调用`CustomGraphContainerController.as`所继承的类中的`search()`函数，并向其传递三个值：\n\
    \n- 查询\n- 类型\n- 用户ID（其中包含下方文本框中的值——同样，我们稍后会再讨论）\n\n这个函数完全是空的，所以目前点击该按钮不会执行任何操作；我们需要重写`search()`并让它正常工作！\n\
    \n1. 在`CustomGraphContainerController.as`中，添加以下函数：\n\n```\noverride public function\
    \ search(a_query:String = \"\", a_type:String = \"\", a_userID:String = \"\"):void\n\
    {\n\n}\n```\n\n2. 现在添加实际的搜索代码。我们从HTTP Requestor开始。这个过程与直接请求Graph Object或Graph\
    \ List非常相似——事实上，它甚至更简单。打开`HTTPRequestor.as`并创建一个新函数，如下所示：\n\n```\npublic function\
    \ search(a_query:String = \"\", a_type:String = \"\"):void\n{\n    var loader:URLLoader\
    \ = new URLLoader();\n    var urlRequest:URLRequest = new URLRequest();\n    var\
    \ variables:URLVariables = new URLVariables();\n\n    urlRequest.url = \"https://graph.facebook.com/search\"\
    ;\n\n    variables.metadata = 1;\n    if (accessToken != \"\")\n    {\n      \
    \  variables.access_token = accessToken;\n    }\n    variables.q = a_query;  \
    \  //not variables.query!\n    variables.type = a_type;\n```\n\n### 刚才发生了什么？\n\
    \n我们的Visualizer现在可以根据你输入的查询条件搜索Graph对象。由于结果以Graph List的形式返回，我们的应用程序将获取这些对象的所有信息——这也意味着我们也能看到它们之间的连接。\n\
    \n### 动手实践——通过SDK进行搜索\n\n通过SDK实现搜索也很容易。先打开SDKRequestor.as，并添加一个名为search()的新函数，就像我们对HTTPRequestor所做的那样：\n\
    \n```\npublic function search(a_query:String = \"\", a_type:String = \"\"):void\n\
    {\n}\n```\n\n与请求时一样，我们向Facebook.api()方法传递三个参数：\n\n1. /search（一个包含Graph URL关键部分的字符串）\n\
    2. 回调函数的引用\n3. 一个包含参数（q和type——记住不要使用query作为参数名！）的对象\n\n因此，将以下代码中的调用添加到你的search()函数中：\n\
    \n```\npublic function search(a_query:String = \"\", a_type:String = \"\"):void\n\
    {\n    Facebook.api(\n        \"/search\",\n        searchComplete,\n        {\
    \ metadata: 1, q:a_query, type:a_type }\n    );\n}\n```\n\n这次不需要使用柯里化（currying），因为我们无需保持对原始GraphRequest对象的引用。\n\
    \nsearch()函数就到此为止。不过，我们还需要编写数据加载完成后的回调函数，因此创建一个新的函数searchComplete()，如下列代码所示：\n\
    \n```\nprivate function searchComplete(success:Object, fail:Object):void\n{\n\
    }\n```\n\n与其他SDK回调一样，此函数必须接受两个参数：result和fail。\n\n由于搜索结果以Graph List的形式返回，我们可以复用requestComplete()函数中的大部分代码。如下列代码所示修改searchComplete()：\n\
    \n```\nprivate function searchComplete(result:Object, fail:Object):void\n{\n \
    \   if (result != null)\n    {\n        var decodedJSON:Object = result;\n   \
    \     var graphList:GraphList = new GraphList();\n        var childGraphObject:GraphObject;\n\
    \        for each (var childObject:Object in decodedJSON)\n        {\n       \
    \     childGraphObject = new GraphObject();\n            for (var childKey:String\
    \ in childObject)\n            {\n                childGraphObject[childKey] =\
    \ childObject[childKey];\n            }\n            graphList.addToList(childGraphObject);\n\
    \        }\n        graphList.paging = decodedJSON.paging;\n\n        dispatchEvent(new\
    \ RequestEvent(RequestEvent.REQUEST_COMPLETED, graphList));\n    }\n    else\n\
    \    {\n        //was a failure. See contents of 'fail' object.\n    }\n}\n```\n\
    \n与HTTP Requestor一样，如果你想回顾这一切是如何工作的，请查看第2章和第3章。\n\n现在两个Requestor都有了search()方法；我们可以将该方法添加到IRequestor接口中。如下修改IRequestor：\n\
    \n```\npackage graph.apis.base\n{\n    import flash.events.IEventDispatcher;\n\
    \    import graph.GraphRequest;\n\n    public interface IRequestor extends IEventDispatcher\n\
    \    {\n        function request(a_request:GraphRequest):void;\n        function\
    \ attemptToAuthenticate(...permissions):void;\n        function initialize():void;\n\
    \        function search(a_query:String = \"\", a_type:String = \"\"):void;\n\
    \    }\n}\n```\n\n这意味着我们不再需要在CustomGraphContainerController.search()中将_requestor强制转换为HTTPRequestor，因此打开CustomGraphContainerController.as并修改该方法：\n\
    \n```\noverride public function search(a_query:String = \"\", a_type:String =\
    \ \"\", a_userID:String = \"\"):void\n{\n    _requestor.search(a_query, a_type);\n\
    }\n```\n\n在测试之前，剩下要做的就是修改构造函数，使_requestor创建为SDKRequestor而不是HTTPRequestor。具体操作如下：\n\
    \n```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    this._showListCounts = true;\n   \
    \ this._showListFilters = true;\n    this._canShowSearchUI = true;\n\n    _requestor\
    \ = new SDKRequestor();\n    addEventListenersToRequestor();\n    //we must wait\
    \ for the Requestor to initialise before we can do anything else with it\n   \
    \ _requestor.addEventListener(Event.COMPLETE, onRequestorInitialize);\n\n    _requestor.initialize();\n\
    }\n```\n\n### 搜索一下\n\n保存、编译并上传SWF文件。在浏览器中加载它——记得使用sdkindex.html。\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_184_0.png)\n\
    \n太好了，成功了！\n\n### 刚才发生了什么？\n\n我们刚刚添加了与之前相同的搜索功能，但这次是通过SDK实现的。请记住，这意味着如果用户已通过身份验证，访问令牌会被自动使用。\n\
    \n### 挑战自我——设置语言区域\n\n现在我们可以搜索帖子了，那么将搜索结果限制为具有指定语言区域的用户发布的帖子怎么样？\n\n你可以在search()方法中硬编码要使用的区域设置，或者（如果你对操作XML很熟悉）可以让你的项目从\
    \ http://www.facebook.com/translations/FacebookLocales.xml 中随机选择一个区域设置。\n\n##\
    \ 搜索动态和主页帖子\n\n与Facebook的完整搜索相比，Graph URL搜索可能有所限制，但有两种类型的搜索只能通过Graph API完成：\n\n\
    - 在你的动态中搜索特定项目\n- 搜索特定好友发布的内容\n\n### 动手实践——搜索你的动态\n\n你的动态是你登录Facebook网站时看到的列表；包含你的好友（以及你订阅的其他Graph网站，例如你“赞”过的页面）发布的全部状态更新、链接、视频和照片。\n\
    \n我们已经知道，可以通过个人资料的home连接访问该动态：\n\n```\nhttps://graph.facebook.com/me/home?access_token=«access_token»\n\
