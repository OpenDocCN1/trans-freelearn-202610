  - '[PAGE 139]


    # What just happened?


    One of four things just happened:


    +   1. Your SWF became very slow and eventually crashed

    +   2. No data came through to the SWF

    +   3. The SWF rendered a new List, but it didn''t contain 5,000 Objects

    +   4. The SWF rendered a new List of 5,000 Objects


    It''s hard to predict which result you''ll see. Previously, the Graph API couldn''t
    handle a request for even 500 Objects at once – it would time out and return a
    completely blank page (not even an empty JSON or error message).


    More recently the situation has improved massively; it seems that Facebook returns
    as many Objects as it can in one shot, up to and including the number that you
    specified as the `limit`. If there are any problems, they''re more likely to be
    caused by your code taking too long to process the data than by Facebook timing
    out.


    This means that, in a lot of practical cases, you can request a large number of
    Objects in a List and get everything you need. But this is sloppy. Let''s look
    at an alternative.


    # Paging


    Instead of requesting, say, 250 Objects all at once, we can have the List split
    into several pages, with each page containing a smaller number of Objects.


    ![](img/4e826fa36038b86f2087ef8b818d0acf_139_0.png)'
