  mdcn: "\n\n## Time for action – displaying the number of objects in a list\n\n打开你的\
    \ `Visualizer` 项目。我们将打开一个隐藏选项，使 List Renderer 窗口的标题包含 Graph List 中的项目数量。\n\n-\
    \ 1. 首先，让我们从 `SDKRequestor` 切回 `HTTPRequestor`。打开 `CustomGraphContainerController.as`\
    \ 并更改创建新 Requestor 的那一行：\n\n```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    _requestor = new HTTPRequestor();\n\
    \    addEventListenersToRequestor();\n    //we must wait for the Requestor to\
    \ initialise before we can do anything else with it\n    _requestor.addEventListener(Event.COMPLETE,\
    \ onRequestorInitialize);\n}\n```\n\n我们将在本章后面再回到 SDK Requestor。\n\n- 2. 有一个小问题：这个类正在等待\
    \ Requestor 分发 `COMPLETE` 事件，表明它已完成初始化，但我们的 `HTTPRequestor` 并没有这样做。我们可以移除事件监听器，但修改\
    \ Requestor 会更容易；打开 `HTTPRequestor.as`，并添加一个新函数：\n\n```\npublic function initialize():void\n\
    {\n    dispatchEvent(new Event(Event.COMPLETE));\n}\n```\n\n- 3. 也修改 `SDKRequestor.as`，将对\
    \ `Facebook.init()` 的调用从构造函数函数移动到新的函数 `initialize()`：\n\n```\npublic function\
    \ SDKRequestor(target:IEventDispatcher = null)\n{\n    super(target);\n    //Facebook.init(\"\
    165373950152944\", initComplete);\n}\n\npublic function initialize():void\n{\n\
    \    Facebook.init(\"165373950152944\", initComplete);\n}\n```\n\n- 4. 将 initialize()\
    \ 函数添加到 IRequestor.as 接口中：\n\n```\npackage graph.apis.base\n{\n    import flash.events.IEventDispatcher;\n\
    \    import graph.GraphRequest;\n\n    public interface IRequestor extends IEventDispatcher\n\
    \    {\n        function request(a_request:GraphRequest):void;\n        function\
    \ attemptToAuthenticate(...permissions):void;\n        function initialize():void;\n\
    \    }\n}\n```\n\n- 5. 最后，在 CustomGraphContainerController.as 的构造函数中添加对这个新的 initialize()\
    \ 函数的调用：\n\n```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    _requestor = new HTTPRequestor();\n\
    \    addEventListenersToRequestor();\n    //we must wait for the Requestor to\
    \ initialise before we can do anything else with it\n    _requestor.addEventListener(Event.COMPLETE,\
    \ onRequestorInitialize);\n    _requestor.initialize();\n}\n```\n\n这会更改项目其他地方的一个设置，进而指示新的\
    \ Graph List Renderer 在渲染器窗口的标题中显示其 Graph Objects 的总数。你无需理解其工作原理；可以说它使用了适当 GraphList\
    \ 实例内部的列表数组的 length 属性。\n\n- 8. 重新编译 SWF 并加载相同的连接：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_135_0.png)\n\
    \n## What just happened?\n\n我们现在可以看到我个人资料的 feed 连接返回的 Graph List 中有多少个对象：25。但自然地，我加入\
    \ Facebook 以来发布的动态更新远不止 25 条。发生了什么？进一步探索显示，25 似乎是请求列表时返回项目的默认最大数量。有时你会得到更少的结果，即使相册或\
    \ feed 中有超过 25 个对象。\n\n对于新闻 feed 来说，这可能没问题，因为只有最近的条目才相关，但对于相册来说却是无用的；自然地，你希望看到所有照片。\n\
    \n我们如何让 Facebook 给我们更多对象？\n\n## What just happened?\n\n发生了四种可能的情况之一：\n\n- 1. 你的\
    \ SWF 变得很慢并最终崩溃\n- 2. 没有数据传到 SWF\n- 3. SWF 渲染了一个新的列表，但其中不包含 5,000 个对象\n- 4. SWF\
    \ 渲染了一个包含 5,000 个对象的新列表\n\n很难预测你会看到哪种结果。以前，Graph API 甚至无法处理一次请求 500 个对象 – 它会超时并返回一个完全空白的页面，甚至没有空的\
    \ JSON 或错误消息。\n\n最近情况有了巨大改善；似乎 Facebook 会一次性返回尽可能多的对象，直到包括你指定的 `limit` 数量。如果有任何问题，更可能是你的代码处理数据花费时间过长，而不是\
    \ Facebook 超时。\n\n这意味着，在很多实际情况下，你可以请求列表中大量对象并获得所需的一切。但这很粗糙。让我们来看一个替代方案。\n\n##\
    \ Paging\n\n与其一次性请求例如 250 个对象，我们可以让列表分成几个页面，每个页面包含较少数量的对象。\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_139_0.png)\n\
    \n我们应该能够看到 feed 中第 301 – 325 条帖子。试试看。写作时的结果如下：\n\n```\n{\n  \"data\": [\n\n  ]\n\
    }\n```\n\n等等，什么？\n\n## What just happened?\n\nGraph API 对可以从用户或页面的流和状态更新中检索的内容有限制，其中包括其\
    \ feed 连接。官方文档说这些连接仅限于最近 30 天或 50 条帖子，以较大者为准。\n\n这并不是 limit-offset 参数的唯一问题。尝试加载此\
    \ URL：\n\n```\nhttps://graph.facebook.com/facebook/feed?offset=2&limit=1\n```\n\
    \n...你会得到与之前相同的空 JSON – 但加载此 URL：\n\n```\nhttps://graph.facebook.com/facebook/feed?offset=2&limit=4\n\
    ```\n\n...你会收到恰好一个结果。然而，你可以将 limit 设置为 6 而不会收到任何额外对象！\n\n这毫无意义。越深入研究，越显得不合逻辑。\n\
    \n这是一个持续存在的问题；如果你想跟上该领域所做的任何更改，请订阅此链接上的官方 Facebook Bug Tracker 线程：\n\n```\nhttp://bugs.developers.facebook.net/show_bug.cgi?id=10576\n\
    ```\n\n> 当然，很有可能等你读到这本书时，这些问题已经得到解决。那样的话，恭喜你！\n\n尽管如此，我们可以看到 limit 和 offset 对于其他连接是如何工作的。\n\
    \n## What just happened?\n\n我们现在已将 `limit-offset` 分页功能添加到我们两个 Requestor 中：我们从头构建的\
    \ HTTP Requestor，以及基于官方 SDK 的 SDK Requestor。\n\n要测试这一点，在 `CustomGraphContainerController.as`\
    \ 中创建一个新的 `GraphRequest` 实例，在当前 Requestor 初始化后使用：\n\n```\nprivate function onRequestorInitialize(a_event:Event):void\n\
    {\n    _requestor.attemptToAuthenticate(ExtendedPermissions.READ_STREAM);\n  \
    \  var testRequest:GraphRequest = new GraphRequest(\"me\", \"likes\");\n    testRequest.limit\
    \ = 20;\n    testRequest.offset = 50;\n    _requestor.request(testRequest);\n\
    }\n```\n\n不要忘记用两个 Requestor 都测试它！\n\n## Date-Based filtering\n\n你是否注意到上面概述的分页系统存在任何潜在问题（除了目前按预期工作不正常之外）？\n\
    \n对于获取某个特别受欢迎的帖子的评论列表呢？\n\n假设你希望获取帖子的 100 条最新评论，并且需要使用分页来实现。你请求评论 1-25、26-50，然后是\
    \ 51-75。然而，在这时，其他人发布了一条评论，被添加为新的 #1。旧的 #1 变成新的 #2，旧的 #2 变成新的 #3，依此类推，因此当你请求 76-100\
    \ 时，你实际上收到了评论 #76 两次 – 几秒钟前它是 #75！\n\n更糟的是，你现在没有新的评论 #1。因此，你可以尝试按相反顺序获取页面：76-100、51-75，然后是\
    \ 26-50。这次，如果添加了一条新评论作为 #1，旧的 #25 变成 #26。但你现在请求评论 1-25；旧的 #25 没有进入你的列表，所以出现了空白。这甚至还没提到如果删除了一条评论会发生什么。\n\
    \n现实中，这些并不是大问题；它们只是说明 `limit-offset` 分页方法并不完美。作为替代方案，我们可以根据时间和日期对数据进行分页。\n\n"
