  - "[PAGE 102]\n\n# Let Me In!\n\nTo see how much information your friends can access\
    \ about you through applications, log in to the Facebook website, click on Account\
    \ | Privacy Settings, select Edit your settings for using applications, games\
    \ and websites, and view the settings for Information accessible through your\
    \ friends:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_102_0.png)\n\n# That's\
    \ cheating!\n\nOkay, fine, generating an access token in the browser and then\
    \ pasting it directly into the source code is not a great way of handling authentication.\
    \ We need to obtain an access token in our application itself.\n\n# Time for action\
    \ – authenticating through the application\n\nWhen authenticating in the browser,\
    \ we visit https://graph.facebook.com/oauth/authorize?client_id=<your_application_id>&redirect_uri=http://google.com&type=user_agent,\
    \ so let's start by loading that URL in our code.\n\nStart by creating a new function,\
    \ attemptToAuthenticate(), in HTTPRequestor.as:\n\n```\npublic function attemptToAuthenticate():void\n\
    {\n    var loader:URLLoader = new URLLoader();\n    var urlRequest:URLRequest\
    \ = new URLRequest();\n```"
  - "[PAGE 103]\n\n```\nvar variables:URLVariables = new URLVariables();\n\nurlRequest.url\
    \ = \"https://graph.facebook.com/oauth/authorize\";\nvariables.client_id = \"\
    «your_application_id»\";\nvariables.type = \"user_agent\";\nvariables.redirect_uri\
    \ = \"http://google.com\";\nurlRequest.data = variables;\n\nloader.addEventListener(Event.COMPLETE,\
    \ onAuthenticationComplete);\nloader.addEventListener(IOErrorEvent.IO_ERROR, onIOError);\n\
    loader.load(urlRequest);\n}\n```\n\nMake sure that you replace «your_application_id»\
    \ with your actual application ID.\n\nWe're using the same IO_ERROR handler function\
    \ as when we load a Graph object, but we need a new function, onAuthenticationComplete(),\
    \ for when the loading has finished; add it to HTTPRequestor.as:\n\n```\nprivate\
    \ function onAuthenticationComplete(a_event:Event):void\n{\n    trace(\"Authentication\
    \ complete\");\n    var loader:URLLoader = URLLoader(a_event.target);\n    trace(loader.data);\n\
    }\n```\n\nNothing complicated there; it will trace whatever gets sent back.\n\n\
    In CustomGraphContainerController.as, let's change the constructor function so\
    \ that it kicks this authentication off instead of loading a user profile:\n\n\
    ```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    _requestor = new HTTPRequestor();\n\
    \    addEventListenersToRequestor();\n    _requestor.attemptToAuthenticate();\n\
    \    //_requestor.request(new GraphRequest(\"«your_user_id»\"));\n}\n```\n\nBefore\
    \ this can work, we need to add the function to the IRequestor interface. Modify\
    \ \\src\\graph\\apis\\base\\IRequestor.as to:\n\n```\npackage graph.apis.base\n\
    {\n    import flash.events.IEventDispatcher;\n```"
  - "[PAGE 104]\n\n```\nimport graph.GraphRequest;\n\npublic interface IRequestor\
    \ extends IEventDispatcher\n{\n    function request(a_request:GraphRequest):void;\n\
    \    function attemptToAuthenticate():void;\n}\n}\n```\n\nTest it. What gets traced?\
    \ A lot of HTML, which (when pasted into a blank .html file and opened in a browser)\
    \ looks like this:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_104_0.png)\n\n\
    > If you get an error, or no data returned at all, load the URL in your browser\
    \ to see what error message is returned. Make sure that all the properties of\
    \ your URLVariables object are set correctly.\n\n# What just happened?\n\nOh,\
    \ right, we need to log in first. But here's a problem: since we're loading the\
    \ URL inside Flash Player, rather than in a browser, we don't have access to the\
    \ browser cookies, so Facebook can't remember who we are and directs us to the\
    \ login page. Of course, since we're not in a browser, we can't actually see the\
