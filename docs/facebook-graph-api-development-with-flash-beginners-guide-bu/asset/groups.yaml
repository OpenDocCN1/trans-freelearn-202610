  mdcn: "\n\n接下来，继续看看其他类型的 Facebook 对象：个人主页、活动、群组。对于个人主页，其 `id` 可能由字母和数字组成（如果该用户注册了自定义\
    \ Facebook 用户名，网址为 http://www.facebook.com/username/），但通常情况下 `id` 是数字，由 Facebook\
    \ 在用户注册时自动分配。\n\n对于某些类型的对象（如相册），`id` 的值在 Facebook 网站内的 URL 中并不明显；我们将在本章后面介绍如何找到这些\
