    \ all good to know, but does it affect our application?\n\nTry accessing the profiles\
    \ of all the people you just looked at through their Graph URLs. Remember, if\
    \ their Facebook URL is http://www.facebook.com/username, their Graph URL will\
    \ be https://graph.facebook.com/username; if their Facebook URL is http://www.facebook.com/profile.php?id=12345678,\
    \ their Graph URL will be https://graph.facebook.com/12345678.\n\nYou'll notice\
    \ that the only information you can see is:\n\n- Name (and separate fields for\
    \ first name, last name, and so on)\n- Profile picture (through https://graph.facebook.com/id/picture)\n\
    - Gender\n\nAll this information is publicly available. This is true even if you\
    \ can see extra information on their profile page when logged out.\n\nThe Graph\
    \ API can't detect whether we're logged in to Facebook in another browser window,\
    \ so everything we see here is through the eyes of a logged-out user.\n\nFor instance,\
    \ here's what my page looks like as shown in the following lines of code:\n\n\
    ```\n{\n  \"id\": \"«redacted»\",\n  \"name\": \"Michael James Williams\",\n \
    \ \"first_name\": \"Michael\",\n  \"middle_name\": \"James\",\n  \"last_name\"\
    : \"Williams\",\n  \"gender\": \"male\",\n  \"locale\": \"en_GB\"\n}\n```\n\n\
    And although you can see a list of connections URLs by adding metadata=1 to the\
    \ URL, trying to access any of them leads to this error:\n\n```\n{\n  \"error\"\
    : {\n    \"type\": \"OAuthAccessTokenException\",\n    \"message\": \"An access\
    \ token is required to request this resource.\"\n  }\n}\n```\n\nBut what is an\
    \ access token?\n\n## Access tokens are proof of authorization\n\nImagine a secure\
    \ building. To get in through the front door, you need to provide the doorman\
    \ with your passport, your driver's license, and your social security number –\
    \ just to prove who you are. Once he's satisfied, he gives you a temporary pass,\
    \ with your name on it, to clip to your jacket.\n\nInside the building, everybody\
