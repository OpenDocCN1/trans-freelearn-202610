  md: "\n# Search Me\n\nAs well as the smart name recognition search, Facebook also\
    \ uses a smart sort to order the list, ranking the results to try to give you\
    \ the ones you're likely to be looking for first: Pages and Groups that you 'like'\
    \ are ranked higher, as are Events that you're on the guest list for, and Applications\
    \ and Games that you've added. And there are a few things Facebook checks to figure\
    \ out which people you might be seeking:\n\n- ◆ Are you friends with the person\
    \ already?\n- ◆ Do you have a lot of friends in common?\n- ◆ Do you both live\
    \ in the same area?\n- ◆ Are you in the same networks (college, school, workplace)?\n\
    \nThis way, most of the time, you'll find the person or object you're looking\
    \ for in the short drop-down list of results. But, if not, you'll need to go to\
    \ the Full Search.\n\n## Time for action – Using the Full Search results\n\nType\
    \ a query into the Search box, and click on the Magnifying Glass icon or the See\
    \ More Results item at the bottom of the drop-down list to get to the Full Search\
    \ page:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_164_0.png)\n\nThe full page\
    \ is shown in the next screenshot:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_165_0.png)\n\
    \n(Also, note that these lists allow you to page through the results.)\n\nFourth,\
    \ the options on the left include some types of objects that won't appear in the\
    \ drop-down list:\n\n- ♦ Web results (powered by Bing) – essentially a frontend\
    \ for the search engine, inside the Facebook site\n- ♦ Posts by friends – wall\
    \ posts, notes, links, videos, photos, and statuses\n- ♦ Posts by everyone – just\
    \ wall posts, notes, links, and statuses\n\nFinally, there are a number of sub-options\
    \ you can alter for these searches: narrow posts down by locale or location; filter\
    \ people by their school or workplace; look for events happening today, tomorrow,\
    \ this week, or this month, and so on.\n\n## What just happened?\n\nThis is all\
    \ pretty straightforward. The one point of confusion here is: why don't the top\
    \ results from the Full Search match those from a Quick Search?\n\n(I searched\
    \ \"Liz\", and the Quick Search listed my friend Beth at the top spot and my friend\
    \ Elizabeth at the second; when I do a Full Search, neither of them turn up in\
    \ the All results tab and only Beth appears in the People results – Elizabeth\
    \ is nowhere to be seen!)\n\nSure, it's not too surprising that the two pages\
    \ would use different algorithms for searching, but it doesn't make a lot of sense\
    \ for them to be this different. Since we're only looking at the website itself\
    \ at the moment, it doesn't really matter – however, we will come across a similar\
    \ issue when searching via the Graph API, which is what we're going to do next.\n\
    \n## Searching with a Graph URL\n\nYou knew it was coming.\n\nWe'll start by searching\
    \ for Graph Objects that can be seen by the public.\n\n## Time for action – searching\
    \ without authorization\n\nThe basic search query Graph URL is:\n\n```\nhttps://graph.facebook.com/search?type=«type»&q=«query»\n\
    ```\n\nThe type parameter lets you choose an option (as in from the left-hand\
    \ side of the Full Search), and q (for query) specifies the search terms.\n\n\
    ## 教材简析\n\n《祖父的园子》是统编版语文五年级下册第一单元的一篇课文，节选自萧红的自传体小说《呼兰河传》。课文以第一人称叙述，描写了作者童年时代在祖父园子里的快乐生活，展现了祖父的慈爱与宽容，表达了作者对童年生活的怀念和对自由的向往。\n\
    \n## 学情分析\n\n五年级学生已具备一定的阅读理解能力，能够初步把握文章主要内容，体会文章表达的思想感情。但对作者借助具体事物表达情感、运用拟人、排比等修辞手法表情达意的方法还缺乏深入的体会，需要教师引导品读感悟。\n\
    \n## 教学目标\n\n- 1. 认识“蚱、啃”等生字，会写“蝴、蝶”等生字，正确读写“蝴蝶、蜻蜓、蚂蚱”等词语。\n- 2. 正确、流利、有感情地朗读课文，了解课文内容。\n\
    - 3. 抓住重点语句，体会作者在园子里的快乐与自由，感受祖父的慈爱。\n- 4. 学习作者留心观察、借助具体事物表达情感的写作方法。\n\n## 教学重难点\n\
    \n重点：抓住重点语句，体会作者在园子里的快乐与自由，感受祖父的慈爱。\n难点：学习作者留心观察、借助具体事物表达情感的写作方法。\n\n## Differences\n\
    \nHowever, even when authenticated, the results we get through a Graph URL search\
    \ don't always match the results we see in a Full Search. This is particularly\
    \ true when looking for people; by default, all apps are able to access an authenticated\
    \ user's friends' names and IDs, but other information may be hidden.\n\nFor example,\
    \ by entering an e-mail address as the query in a User search, we can find anyone\
    \ with that exact email address – unless they've noted in their privacy settings\
    \ that they don't want that information to be available to other apps. (See also\
    \ the options in Account | Privacy Settings | Applications and websites | Information\
    \ accessible through your friends, as described in Chapter 3.)\n\nSometimes this\
    \ will cut particular results out entirely; sometimes it will make the same results\
    \ appear, but in a different order. Remember this when testing: If the results\
    \ you get when searching through your application are different from those you\
    \ get when searching through the web site, that doesn't necessarily mean there's\
    \ a bug in your application.\n\n## Restrictions\n\nThe sub-options available when\
    \ searching via a Graph URL are very limited when compared to the Full Search.\
    \ We can't filter Users by their location or school, Groups by their type, or\
    \ Events by their date (even using since/until paging).\n\nNor can we restrict\
    \ Posts to a specific language, which makes them far less useful than they might\
    \ be (as we saw when searching for \"Packt\", a common German word). But we can\
    \ do something similar.\n\nThere is a parameter called locale which accepts languages\
    \ like \"en_US\" (for US English) and \"fr_FR\" (for French). This can be used\
    \ in two ways.\n\nFirst, we can use it to transform information that we receive.\
    \ For example, here's Facebook CTO Bret Taylor's User object:\n\n```\nhttps://graph.facebook.com/btaylor\n\
    {\n  \"id\": \"220439\",\n  \"name\": \"Bret Taylor\",\n  \"first_name\": \"Bret\"\
    ,\n  \"last_name\": \"Taylor\",\n  \"link\": \"http://www.facebook.com/btaylor\"\
    ,\n  \"gender\": \"male\",\n  \"locale\": \"en_US\"\n}\n```\n\nIn the next code\
    \ snippet, we have the User object with the locale set to French:\n\n```\nhttps://graph.facebook.com/btaylor?locale=fr_FR\n\
    {\n  \"id\": \"220439\",\n  \"name\": \"Bret Taylor\",\n  \"first_name\": \"Bret\"\
    ,\n  \"last_name\": \"Taylor\",\n  \"link\": \"http://www.facebook.com/btaylor\"\
    ,\n  \"gender\": \"homme\",\n  \"locale\": \"en_US\"\n}\n```\n\nNot much has changed\
    \ – except the value of gender, which has gone from male to homme. This is useful\
    \ if you need to make basic information available in different languages, without\
    \ hiring a translator.\n\nSecond, notice that Bret's locale is set to en_US. All\
    \ users have a locale; it can be set in Account | Language, and defines which\
    \ language you view the Facebook website in. We can filter Post search results\
    \ to only show results from users that have a certain locale, using the following\
    \ Graph URL :\n\n```\nhttps://graph.facebook.com/search?type=post&q=test&locale=fr_FR\n\
    ```\n\nIt's not quite the same as searching for posts in a specified language\
    \ – so we can't eliminate all the results that use \"Packt\" as part of a German\
    \ sentence – but it's close. And this is the same sub-option that we can set in\
    \ the Posts searches in the Full Search.\n\nA full list of locales is available\
    \ at http://www.facebook.com/translations/FacebookLocales.xml.\n\nA sample is\
    \ as follows:\n\n```\n<?xml version='1.0'?>\n<locales>\n  <locale>\n    <englishName>Catalan</englishName>\n\
    \    <codes>\n      <code>\n        <standard>\n          <name>FB</name>\n  \
    \        <representation>ca_ES</representation>\n        </standard>\n      </code>\n\
    \    </codes>\n  </locale>\n</locales>\n```\n\nThere are some peculiar choices\
    \ in there, like English (Upside-Down), so take a look.\n\n## Time for action\
    \ – implementing a Search window in the Visualizer\n\nOkay, now that we know what\
    \ we can do with the Graph URL search, let's use it in our application.\n\nThe\
    \ Visualizer project includes a window with UI elements for searching the Graph.\
    \ It's hidden, but we can enable it in the same way that we enabled the Filter\
    \ panel on the List Renderers.\n\nLoad the Visualizer project and open CustomGraphContainerController.as.\
    \ In the constructor function, set the _canShowSearchUI property (which is inherited\
    \ from the class that CustomGraphContainerController extends) to true:\n\n```\n\
    public function CustomGraphContainerController\n(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    this._showListCounts = true;\n   \
    \ this._showListFilters = true;\n    this._canShowSearchUI = true;\n    _requestor\
    \ = new HTTPRequestor();\n    addEventListenersToRequestor();\n    //we must wait\
    \ for the Requestor to initialise before we can do\n    //anything else with it\n\
    \    _requestor.addEventListener(Event.COMPLETE, onRequestorInitialize);\n   \
    \ _requestor.initialize();\n}\n```\n\nCompile the project, upload the SWF to your\
    \ web host, and load it in your browser using the usual URL. The result is shown\
    \ in the next screenshot:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_177_0.png)\n"
  mdcn: "\n\n# Search Me\n\n除了智能名称识别搜索外，Facebook 还使用智能排序来排列列表，排名结果以便首先向你展示你最有可能查找的内容：你点赞的页面和群组排名更高，你在宾客名单上的活动排名也更高，以及你添加的应用程序和游戏排名也更高。Facebook\
    \ 还会检查一些事情来判断你可能在寻找哪些人：\n\n- ◆ 你是否已经是该人的朋友？\n- ◆ 你们是否有很多共同朋友？\n- ◆ 你们是否生活在同一地区？\n\
    - ◆ 你们是否在同一网络中（大学、学校、工作场所）？\n\n这样，大多数情况下，你会在短的下拉结果列表中找到你正在寻找的人或对象。但如果没有，你就需要去进行完整搜索。\n\
    \n## Time for action – Using the Full Search results\n\n在搜索框中输入查询，然后点击放大镜图标或下拉列表底部的“查看更多结果”项目即可进入完整搜索页面：\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_164_0.png)\n\n下一张截图中显示了完整页面：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_165_0.png)\n\
    \n（另外，请注意，这些列表允许你翻页查看结果。）\n\n第四，左侧的选项包括一些在下拉列表中不会出现的对象类型：\n\n- ♦ Web results (powered\
    \ by Bing) – 本质上是 Facebook 网站内部的搜索引擎前端\n- ♦ Posts by friends – 墙帖、笔记、链接、视频、照片和状态\n\
    - ♦ Posts by everyone – 仅墙帖、笔记、链接和状态\n\n最后，你可以更改这些搜索的许多子选项：按地区或位置缩小帖子范围；按学校或工作场所筛选人员；查找今天、明天、本周或本月发生的活动，等等。\n\
    \n## What just happened?\n\n这一切都相当直接。这里唯一令人困惑的一点是：为什么完整搜索的顶部结果与快速搜索的不匹配？\n\n（我搜索了“Liz”，快速搜索将我的朋友\
    \ Beth 列在首位，我的朋友 Elizabeth 列在第二位；当我进行完整搜索时，在“全部结果”标签中两者都没有出现，只有 Beth 出现在“人物”结果中——Elizabeth\
    \ 完全不见了！）\n\n当然，不同页面使用不同的搜索算法并不令人意外，但它们差异如此之大就说不通了。由于我们目前只是在查看网站本身，这并不重要——不过，当我们通过\
    \ Graph API 进行搜索时，我们会遇到类似的问题，而这正是我们接下来要做的。\n\n## Searching with a Graph URL\n\n\
    你知道它要来了。\n\n我们将首先搜索公众可见的 Graph 对象。\n\n## Time for action – searching without authorization\n\
    \n基本的搜索查询 Graph URL 为：\n\n```\nhttps://graph.facebook.com/search?type=«type»&q=«query»\n\
    ```\n\ntype 参数让你可以选择一个选项（与完整搜索左侧相同），而 q（查询）指定搜索词。\n\n## 教材简析\n\n《祖父的园子》是统编版语文五年级下册第一单元的一篇课文，节选自萧红的自传体小说《呼兰河传》。课文以第一人称叙述，描写了作者童年时代在祖父园子里的快乐生活，展现了祖父的慈爱与宽容，表达了作者对童年生活的怀念和对自由的向往。\n\
    \n## 学情分析\n\n五年级学生已具备一定的阅读理解能力，能够初步把握文章主要内容，体会文章表达的思想感情。但对作者借助具体事物表达情感、运用拟人、排比等修辞手法表情达意的方法还缺乏深入的体会，需要教师引导品读感悟。\n\
    \n## 教学目标\n\n- 1. 认识“蚱、啃”等生字，会写“蝴、蝶”等生字，正确读写“蝴蝶、蜻蜓、蚂蚱”等词语。\n- 2. 正确、流利、有感情地朗读课文，了解课文内容。\n\
    - 3. 抓住重点语句，体会作者在园子里的快乐与自由，感受祖父的慈爱。\n- 4. 学习作者留心观察、借助具体事物表达情感的写作方法。\n\n## 教学重难点\n\
    \n重点：抓住重点语句，体会作者在园子里的快乐与自由，感受祖父的慈爱。\n难点：学习作者留心观察、借助具体事物表达情感的写作方法。\n\n## Differences\n\
    \n然而，即使经过身份验证，通过 Graph URL 搜索获得的结果也不总是与完整搜索中看到的结果匹配。当查找人员时尤其如此；默认情况下，所有应用都可以访问经过身份验证用户的朋友姓名和\
    \ ID，但其他信息可能被隐藏。\n\n例如，通过在用户搜索中输入电子邮件地址作为查询，我们可以找到拥有该确切电子邮件地址的任何人——除非他们在隐私设置中注明不希望该信息对其他应用可用。（另请参阅“帐户\
    \ | 隐私设置 | 应用和网站 | 通过你的朋友可访问的信息”中的选项，如第三章所述。）\n\n有时这会完全排除特定结果；有时会使相同的结果出现，但顺序不同。记住这一点进行测试：如果通过你的应用搜索获得的结果与通过网站搜索获得的结果不同，这并不一定意味着你的应用存在错误。\n\
    \n## Restrictions\n\n与完整搜索相比，通过 Graph URL 搜索时可用的子选项非常有限。我们无法按位置或学校筛选用户，按类型筛选群组，或按日期筛选活动（即使使用\
    \ since/until 分页）。\n\n我们也不能将帖子限制为特定语言，这使得它们比可能的情况要没用得多（正如我们在搜索“Packt”，一个常见的德语词时所看到的）。但我们可以做类似的事情。\n\
    \n有一个名为 locale 的参数，它接受诸如“en_US”（美国英语）和“fr_FR”（法语）之类的语言。这可以用两种方式使用。\n\n首先，我们可以用它来转换接收到的信息。例如，这里是\
    \ Facebook CTO Bret Taylor 的用户对象：\n\n```\nhttps://graph.facebook.com/btaylor\n\
    {\n  \"id\": \"220439\",\n  \"name\": \"Bret Taylor\",\n  \"first_name\": \"Bret\"\
    ,\n  \"last_name\": \"Taylor\",\n  \"link\": \"http://www.facebook.com/btaylor\"\
    ,\n  \"gender\": \"male\",\n  \"locale\": \"en_US\"\n}\n```\n\n在下一个代码片段中，我们将用户对象的\
    \ locale 设置为法语：\n\n```\nhttps://graph.facebook.com/btaylor?locale=fr_FR\n{\n \
    \ \"id\": \"220439\",\n  \"name\": \"Bret Taylor\",\n  \"first_name\": \"Bret\"\
    ,\n  \"last_name\": \"Taylor\",\n  \"link\": \"http://www.facebook.com/btaylor\"\
    ,\n  \"gender\": \"homme\",\n  \"locale\": \"en_US\"\n}\n```\n\n几乎没有什么变化——除了 gender\
    \ 的值，从 male 变成了 homme。这在你需要以不同语言提供基本信息，而无需聘请翻译时很有用。\n\n其次，请注意 Bret 的 locale 设置为\
    \ en_US。所有用户都有一个 locale；它可以在“帐户 | 语言”中设置，并定义你查看 Facebook 网站的语言。我们可以使用以下 Graph\
    \ URL 将帖子搜索结果过滤为仅显示具有特定 locale 的用户的帖子：\n\n```\nhttps://graph.facebook.com/search?type=post&q=test&locale=fr_FR\n\
    ```\n\n这与按指定语言搜索帖子并不完全相同——因此我们无法消除所有使用“Packt”作为德语句子一部分的结果——但很接近。而这正是我们可以在完整搜索中的帖子搜索中设置的子选项。\n\
    \n完整的本地化列表可在 http://www.facebook.com/translations/FacebookLocales.xml 获取。\n\n\
    示例如下：\n\n```\n<?xml version='1.0'?>\n<locales>\n  <locale>\n    <englishName>Catalan</englishName>\n\
    \    <codes>\n      <code>\n        <standard>\n          <name>FB</name>\n  \
    \        <representation>ca_ES</representation>\n        </standard>\n      </code>\n\
    \    </codes>\n  </locale>\n</locales>\n```\n\n其中有一些奇怪的选择，比如英语（倒着写），所以请自行查看。\n\
    \n## Time for action – implementing a Search window in the Visualizer\n\n好吧，现在我们知道了\
    \ Graph URL 搜索可以做什么，让我们在应用中使用它。\n\nVisualizer 项目包含一个用于搜索 Graph 的窗口，其中包含 UI 元素。它是隐藏的，但我们可以以与在列表渲染器上启用过滤面板相同的方式启用它。\n\
    \n加载 Visualizer 项目并打开 CustomGraphContainerController.as。在构造函数函数中，将 _canShowSearchUI\
    \ 属性（继承自 CustomGraphContainerController 扩展的类）设置为 true：\n\n```\npublic function\
    \ CustomGraphContainerController\n(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    this._showListCounts = true;\n   \
    \ this._showListFilters = true;\n    this._canShowSearchUI = true;\n    _requestor\
    \ = new HTTPRequestor();\n    addEventListenersToRequestor();\n    //we must wait\
    \ for the Requestor to initialise before we can do\n    //anything else with it\n\
    \    _requestor.addEventListener(Event.COMPLETE, onRequestorInitialize);\n   \
    \ _requestor.initialize();\n}\n```\n\n编译项目，将 SWF 上传到你的网络主机，并使用常规 URL 在浏览器中加载它。结果显示在下一张截图中：\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_177_0.png)\n\n"
