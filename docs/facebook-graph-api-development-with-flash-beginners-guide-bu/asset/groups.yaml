    # 6

    Adding to the Graph


    > We''ve spent a lot of time observing the Graph, both as anonymous outsiders
    and as authenticated users. We understand the different types of node and the
    connections between them. Now it''s time to create some of our own.


    In this chapter, you will learn:


    +   - How to create new Graph Objects using the Graph API

    +   - How to delete existing objects from the Graph

    +   - The limitations of the Graph API for adding to the Graph versus the Facebook
    website


    Let''s get started...


    # Hello, Facebook!


    I''m not usually a fan of "Hello World" applications, but it''s so relevant here
    that I will make an exception. We''ll start by posting a message to the logged-in
    user''s Wall.


    # Time for action – posting to the user''s feed


    We''ll keep it simple to start with. Just let the user enter a line of text, and
    post it to their Wall.'
