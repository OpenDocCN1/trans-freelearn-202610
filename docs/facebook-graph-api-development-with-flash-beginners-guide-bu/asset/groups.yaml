  - "[PAGE 209]\n\n4. Compile, upload, and execute the Visualizer, and try to post\
    \ on your own Wall again.\n\nIt still won't work, but you'll see a dialog like\
    \ this:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_209_0.png)\n\n# What just\
    \ happened?\n\nThe dialog says HTTP status: 403. As mentioned earlier, this means\
    \ that we are not allowed to access the resource that we were trying to access—that\
    \ is, we're not allowed to post to the Wall. In other words, we don't have permission...\
    \ or rather, we haven't been granted the extended permission required.\n\n> It's\
    \ possible that you'll see an HTTP status code response of 500, instead. That's\
    \ okay—it's a fairly generic error message which means \"there was a problem,\"\
    \ in this case. The cause is likely still the lack of the extended permission.\n\
    > Of course, if you had granted your application the permission needed earlier\
    \ in the book, you won't have seen any problems at all!\n\n# Time for action –\
    \ granting the required permission\n\n+   1. Before this can work, we must grant\
    \ the application the publish_stream extended permission, so alter the onRequestorInitialize()\
    \ function within CustomGraphContainerController.as, like so:\n\n```\nprivate\
    \ function onRequestorInitialize(a_event:Event):void\n{\n    _requestor.attemptToAuthenticate(\n\
    \        ExtendedPermissions.READ_STREAM,\n        ExtendedPermissions.PUBLISH_STREAM);\n\
    }\n```"
