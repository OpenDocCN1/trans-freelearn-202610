  - "[PAGE 202]\n\nWhen the user types in their message and clicks on Post, we want\
    \ the message to get posted to their Wall. At the moment, the code is set up to\
    \ pass an AS3 object containing the message to a method called publish() in the\
    \ class which CustomGraphContainerController extends. Just as in previous chapters,\
    \ we'll override this method and write new code to handle the Facebook integration.\n\
    \nIn CustomGraphContainerController.as, add this function:\n\n```\noverride public\
    \ function publish(a_publishObject:PublishObject):void\n{\n    super.publish(a_publishObject);\n\
    }\n```\n\nThe PublishObject class contains a property called message that holds\
    \ the message which the user typed into the Post to Wall window. We need to import\
    \ this class:\n\n```\nimport graph.apis.base.PublishObject;\n```\n\nThat takes\
    \ care of the UI. Next, we'll pass this object to a method inside our Requestor\
    \ to deal with publishing the post on Facebook. Add a new function, publish(),\
    \ to IRequestor.as:\n\n```\npackage graph.apis.base\n{\n    import flash.events.IEventDispatcher;\n\
    \    import graph.GraphRequest;\n\n    public interface IRequestor extends IEventDispatcher\n\
    \    {\n        function request(a_request:GraphRequest):void;\n        function\
    \ attemptToAuthenticate(...permissions):void;\n        function initialize():void;\n\
    \        function search(a_query:String = \"\", a_type:String = \"\", a_userID:String\
    \ = \"\"):void;\n        function publish(a_publishObject:PublishObject):void;\n\
    \    }\n}\n```\n\nThe PublishObject instance contains all of the information that\
    \ we need, so it's the only parameter we'll pass to this method.\n\nNow add stub\
    \ publish() functions to both SDKRequestor.as and HTTPRequestor.as:\n\n```\npublic\
    \ function publish(a_publishObject:PublishObject):void\n{\n}\n```"
  - "[PAGE 203]\n\nYou will also need to import PublishObject in both of those classes:\n\
    \n```\nimport graph.apis.base.PublishObject;\n```\n\nWe'll start, as usual, by\
    \ writing the code for HTTPRequestor, so change the line in the constructor function\
    \ of CustomGraphContainerController.as that instantiates the _requestor object\
    \ so that it creates an HTTPRequestor:\n\n```\n_requestor = new HTTPRequestor();\n\
    ```\n\nFinally, change CustomGraphContainerController.as so that its publish()\
    \ method calls the publish() method of the Requestor:\n\n```\noverride public\
    \ function publish(a_publishObject:PublishObject):void\n{\n    super.publish(a_publishObject);\n\
    \    _requestor.publish(a_publishObject);\n}\n```\n\nEverything's in place, but\
    \ how do we post the message from the Visualizer to our actual Facebook Wall?\n\
    \n# Request methods\n\nPublishing a message to a user's Wall isn't any more complex\
    \ than filtering information from it—we use the Graph URL, https://graph.facebook.com/me/feed,\
    \ and pass it two parameters:\n\n+   - The access token, and\n+   - The message\
    \ to post\n\nThe difference comes in how we pass those parameters. We cannot simply\
    \ load the URL anymore. Try it yourself: browse to https://graph.facebook.com/me/feed?access_token=«access_token»&message=Hello.\
    \ It will return your feed in JSON format, but won't post to it.\n\nWe still use\
    \ a URLLoader and a URLRequest, but we use a different request method.\n\n# What's\
    \ a request method?\n\nAn HTTP request method is a way of telling the web server\
    \ what kind of action we want it to take when we ask it for a page or some other\
    \ resource.\n\nBy default, an AS3 URLRequest uses an HTTP request method called\
    \ GET; this is a \"safe\" method, so-called because it doesn't ask the server\
    \ to change any information, merely to pass some back—which is all what we've\
    \ needed up to this point in the book."
  - "[PAGE 204]\n\nPublishing a wall post obviously causes a change, so we should\
    \ use an \"unsafe\" method—in this case, POST. This is the same method used when\
    \ submitting a web page form that changes or adds some data, like when ordering\
    \ a book from Amazon.\n\n> For security reasons, Flash Player 10 and above will\
    \ allow only the POST method to be used if the user initiates the load. This means\
    \ that your application cannot post to the Graph automatically (for instance,\
    \ based on how long the user has been logged in); instead, you must always publish\
    \ from, say, a button's MOUSE_CLICK event handler function.\n\n# Time for action\
    \ – using the POST method\n\n+   1. To specify that we want to use the POST method,\
    \ we change the method property of URLRequest (after all, POST is a request method).\
    \ Another class, flash.net.URLRequestMethod, contains consts with all the permitted\
    \ values, so import it in HTTPRequestor.as:\n+   ```\n+   import flash.net.URLRequestMethod;\n\
    +   ```\n+   2. We set up the URLLoader, URLRequest, and URLVariables instances\
    \ in the same way as we do in the request() and search() methods:\n+   ```\n+\
