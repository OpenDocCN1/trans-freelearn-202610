    We''ll concentrate on `message`, `picture`, `link`, `name`, `caption`, and `description`
    first, and find out what they do by publishing a rich post that uses them.


    The Visualizer can be configured to display a window with input fields for all
    six of these parameters, instead of just `message`. To do so, find this line in
    `CustomGraphContainerController.as`:


    ```

    this._publishingCapability = PublishingCapabilities.BASIC;

    ```


    ...and replace it with this:


    ```

    this._publishingCapability = PublishingCapabilities.COMPLETE;

    ```


    When you click on the **Publish** button on your `feed` List Renderer, you''ll
    see the new window:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_215_0.png)


    The **Post** button still passes an instance of `PublishObject` to the same function,
    `publish()`, in the class that `CustomGraphContainerController` extends. The difference
    from before is that the `PublishObject` has more properties set.


    Specifically, it can have any of these properties:


    +   - `message`

    +   - `pictureURL`: Corresponds to `picture`

    +   - `linkURL`: Corresponds to `link`'
