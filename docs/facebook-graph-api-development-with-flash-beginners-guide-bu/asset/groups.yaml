  - '[PAGE 269]


    # Permissions


    Just because you''re not accessing data through the Graph doesn''t mean you can
    grab whatever information you want. You''re still subject to the same authentication
    requirements as before. For instance, you need an access token to run this query:


    ```

    SELECT uid

    FROM user

    WHERE name="Michael James Williams"

    ```


    Extended permissions are still relevant when using FQL. If you try to query the
    `mailbox_folder` table without any permissions, you''ll receive an `error 612`,
    telling you that **mailbox requires the read_mailbox extended permission.**


    At time of writing, there is no guide in the documentation that explains which
    extended permissions are required to access given tables (or fields). The closest
    is this page, which gives descriptions in terms of the Graph: http://developers.facebook.com/docs/authentication/permissions.


    # Checking existing permissions


    One great feature that the database model offers but the Graph does not is a means
    to get a list of extended permissions granted to the current user.


    This is by way of the `permissions` table, which has many columns:


    +   - `uid` (integer) – A User ID (must be of the current user) or Page ID

    +   - `publish_stream` (Boolean) – returns 1 if the user or page has the `publish_stream`
    permission, 0 otherwise

    +   - `create_event` (Boolean) – returns 1 if the user or page has the `create_event`
    permission, 0 otherwise

    +   - `rsvp_event` (Boolean) – returns 1 if the user or page has the `rsvp_event`
    permission, 0 otherwise


    and so on. The table has one column for each of the possible permissions; in each
    case, the value will be 1 or 0.


    So if the current user''s ID is 123456, we can find out whether they have granted
    our app the `publish_stream` permission using the following FQL query:


    ```

    SELECT publish_stream

    FROM permissions

    WHERE uid=123456

    ```'
