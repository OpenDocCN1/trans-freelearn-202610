  - '[PAGE 105]


    # A different approach


    There are a few ways around this, depending on whether we''re using AIR or Flash
    Player. In this chapter, we''ll use the simplest method: embedding the SWF in
    a web page and using JavaScript to open the login page and pass the access token
    back to Flash Player.


    # Time for action – authenticating via JavaScript


    Here''s what is going to happen:


    +   1. We''ll embed our application''s SWF in a web page, and load the page in
    a browser.

    +   2. The application will call a JavaScript function inside the web page, telling
    it to load the "authorize" URL in a new browser window.

    +   3. The new window may ask us to log in; once we''re authenticated, it''ll
    redirect to the Redirect URI page, just as when we used it earlier.

    +   4. This time, however, we''ll have changed the Redirect URI page to one that
    we control (rather than using the Google home page). It will obtain the access
    token and pass it back to a JavaScript function in the page containing our application''s
    SWF.

    +   5. That JavaScript function will pass the access token to an AS3 function
    in our application, which will then be able to use it everywhere.


    For this to work, the web page that Facebook redirects us to (in Step 4, containing
    the SWF) needs to be online. That means we need to have a web host. See Chapter
    1 for details on setting one up.


    Publish your project for the web, so that you end up with a web page containing
    the Visualizer SWF – again, the method for doing this is outlined in Chapter 1
    – and upload it to your host. Let''s suppose that the web page is called `index.html`,
    and that you uploaded all the files to `http://host.com/visualizer/`.


    Load `http://host.com/visualizer/index.html` in your browser. You''ll see, well,
    nothing much, because the application is still set to try to authenticate rather
    than loading any data, and it''s failing at that. But if you look in the top-left-hand
    side corner, you should see the familiar UI controls: **Zoom In**, **Zoom Out**,
    and **Reset View**. (If you see "Movie Not Loaded", check that your HTML page
    is set to load the correct SWF, and that you uploaded all of the files to the
    web host, rather than just `index.html`.)'
  - "[PAGE 106]\n\nTo open a new window containing the Facebook login page, we need\
    \ to run this JavaScript code from inside index.html:\n\n```\nwindow.open('https://graph.facebook.com/oauth/authorize?client_id=«your_application_id»&redirect_uri=http://google.com&type=user_agent',\
    \ '«window_name»', 'height=370,width=670');\n```\n\nYou can probably guess what\
    \ the code does, as JavaScript syntax is very similar to ActionScript; it loads\
    \ a pop-up window, with the height, width, and URL specified. The «window_name»\
    \ parameter is a value we can use to refer to the window later.\n\nWe could put\
    \ this code inside the HTML of the page. However, rather than risk messing up\
    \ the SWF embedding code (and to make our SWF a little more flexible), we'll use\
    \ ExternalInterface to inject it into the page from our SWF instead.\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_106_0.png)\n\
    \n> The flash.external.ExternalInterface class allows ActionScript code within\
    \ an SWF to communicate with JavaScript code within an HTML page containing that\
    \ SWF. This means that the SWF can call JavaScript methods, and vice-versa.\n\n\
    Open HTTPRequestor.as and import the ExternalInterface class:\n\n```\nimport flash.external.ExternalInterface;\n\
    ```\n\nNow, remove all the code we put in attemptToAuthenticate() earlier, and\
    \ replace it with an ExternalInterface call:\n\n```\npublic function attemptToAuthenticate():void\n\
    {\n    ExternalInterface.call(\"window.open\",\n        \"https://graph.facebook.com/oauth/authorize?client_id=«your_application_id»&type=user_agent&redirect_uri=http://google.com\"\
    \n        \"facebookLoginWindow\",\n        \"height=370, width=600\");\n}\n```\n\
    \nThis will call the JavaScript function from above, passing it the three arguments\
    \ needed. Note that I've given the pop-up window a name of facebookLoginWindow\
    \ in case we need to refer to it in code later.\n\nCompile your SWF (avoid testing\
    \ it in the standalone Flash Player, as it won't be able to access ExternalInterface\
    \ outside of a browser) and upload it to your web host, overwriting the previous\
    \ one. Then, refresh index.html in your browser."
