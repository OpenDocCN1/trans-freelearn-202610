    # 7


    # FQL Matters


    > The Graph is a terrific model for accessing the data in Facebook; it manages
    to take the huge amount of information on the site and make it easy and simple
    to access it.


    > Sometimes, however, we want a little extra control and a little extra power.
    That''s where FQL comes in. It''s a programming language designed for searching
    the Facebook databases – and it doesn''t use the Graph.


    In this chapter we shall:


    +   - Recap the different models of data representation and visualization

    +   - Get comfortable with FQL by using it to grab some Facebook data

    +   - Learn how to use FQL to do (almost) anything we could do with the Graph

    +   - Discover what the Graph is better at than FQL

    +   - Find out how to detect which extended permissions have been granted

    +   - Look at some advanced FQL features


    So let''s get on with it...


    # What is FQL?


    FQL (pronounced as the acronym, "eff-cue-ell") is Facebook''s version of the database
    language SQL. Don''t know what SQL is? Don''t worry, you don''t need to. In this
    chapter, I''ll assume you don''t know anything about FQL, SQL, or databases yet.
    So before getting into what FQL is, let''s take a step back and look at databases.'
  - '[PAGE 250]


    # But what if I do already know SQL?


    Even if you know SQL, it''s worth reading this chapter to brush up on some concepts
    and learn the differences between FQL and regular SQL. In particular, check out
    the Restrictions section.

    If you''re experienced with SQL, you may be surprised by how many features FQL
    is missing. Most notably, there are no INSERT, DELETE, or UPDATE clauses. Also,
    JOIN, GROUP BY, and LIKE are missing; you must specify a set of fields to be returned,
    rather than typing SELECT *, and you can only specify one table in the FROM clause.


    ![](img/4e826fa36038b86f2087ef8b818d0acf_250_0.png)


    # Understanding the FQL interface


    We''ve been looking at the Facebook data as though it were structured in the Graph
    format laid out in Chapter 2, but really, this is just a model for the data; the
    Graph API acts like a wrapper, making it appear as though the data is structured
    in that way. It''s not.


    Does it matter how the data is structured? Not for our purposes. What matters
    is the interface we are given to access it with. So far, that interface has been
    the Graph API; we''ve obtained all our data through Graph URLs and processed them
    with AS3.


    But there is another way of looking at the data, which is like a traditional database
    structure. In this case, all the data is kept in tables, organized into columns,
    rows, and fields. It''s easier to explain with an example:


    | user |

    |---|---|---|---|---|---|---|

    | uid | first_name | middle_name | last_name | name | sex | username |

    | 123456 | Michael | James | Williams | Michael James Williams | male | michael_james_williams
    |

    | 789012 | Joe | Quincy | Faikname | Joe Q Faikname | male | joe_q_faikname |


    Some columns have been left out for brevity.


    This is one table of data. Specifically, it''s the user table, as you can see
    from the following heading:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_250_1.png)'
  - "[PAGE 251]\n\nEach **column** represents an attribute of the data:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_251_0.png)\n\
    \nEach **row** corresponds to a single object, with all its attributes:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_251_1.png)\n\
    \nThe intersection of a row and a column – that is, a single attribute of a single\
    \ object – is called a **field**:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_251_2.png)\n\
    \nYou could alternatively think of this like a spreadsheet; this is the simple,\
    \ natural way of storing data in a grid. (Of course, if you're familiar with relational\
    \ databases, you could just think of it as a relational database's table!)\n\n\
    # Models of data\n\nSo now we've got three different models we can use when thinking\
    \ about Facebook data:\n\n+   1. The AS3 object-oriented model: We have classes\
    \ containing certain properties, and instances of those classes containing information\
    \ about a specific item. For example, we could have a class called User which\
    \ contains certain properties, and define an instance of that class:\n\n```\n\
    class User\n{\n    public var uid:int;\n```"
