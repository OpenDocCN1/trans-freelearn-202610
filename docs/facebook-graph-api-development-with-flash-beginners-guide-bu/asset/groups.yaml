  - '[PAGE 113]


    # What just happened?


    You just added true Facebook authentication to your Flash application.


    The user logs in on Facebook itself, rather than through your application, minimizing
    the security risk. Facebook passes the access token back to a callback page that
    you wrote, which in turn passes it back through another web page to your SWF,
    which is now able to use it when requesting Graph API data.


    # What about users who haven''t used the application before?


    We haven''t fully tested the authentication yet, since we had already granted
    the application permission to access our data earlier on, when we were experimenting
    with the browser.


    Fortunately it''s very easy to undo all that and pretend we''ve never seen the
    application before. Log in to Facebook and click on Account | Application Settings.
    Find your application in the list, and click on the X button as shown in the next
    screenshot:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_113_0.png)


    Facebook will ask you to confirm this decision. (The application will remain on
    your Developers Page, even though it will be removed from your Applications Page.)


    ![](img/4e826fa36038b86f2087ef8b818d0acf_113_1.png)'
  - '[PAGE 114]


    Refresh index.html. This time, the pop up will ask for permission to access your
    information:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_114_0.png)


    Click on **Allow**, and the pop up is redirected to callback.html, which passes
    the access token to the visualizer, just as before.


    # Have a go hero – dealing with the undecided


    What if your user clicks on the **Don''t allow** dialog box?


    At the moment, the application doesn''t do anything without an access token; it
    just sits patiently and waits. If, when the pop up window appears, the user doesn''t
    click on **Allow** – or if the user doesn''t see the pop up , perhaps because
    it''s blocked – the application won''t fail gracefully. It will just sit there
    and wait.


    Add some features to your application to make it deal with this kind of situation.
    Maybe it could pop up a message after a few seconds, saying "You need to log in
    to Facebook and approve this application in order to use it." Or perhaps you could
    load a different Graph object to start with, and only request a login when the
    user tries to access something they need an access token for.


    Now that your application''s online, you can let other people see it by directing
    them to index.html. Get some friends to test it out.'
