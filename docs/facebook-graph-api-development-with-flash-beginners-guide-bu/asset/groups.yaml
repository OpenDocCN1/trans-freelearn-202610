    ;\n   stageWebView.loadURL(authURL);\n   ```\n\n6. Note that the `StageWebView.loadURL()`\
    \ method does not require a `URLRequest`, but a `String`.\n\n7. Extract the access\
    \ token from the hash in the same way as before:\n\n   ```\n   private function\
    \ onRedirect(a_event:LocationChangeEvent):void\n   {\n       var stageWebView:StageWebView\
    \ = a_event.target as StageWebView;\n       if (stageWebView.location.indexOf(\"\
    #\") != -1)\n       {\n           var hash:String = stageWebView.location.substr(stageWebView.location.indexOf(\"\
    #\") + 1);\n           setAccessToken(hash);\n       }\n   }\n   ```\n\n8. You\
    \ can't use `removeChild()` to remove the `StageWebView`, so use this method:\n\
    \n   ```\n   private function onRedirect(a_event:LocationChangeEvent):void\n \
    \  {\n       var stageWebView:StageWebView = a_event.target as StageWebView;\n\
    \       if (stageWebView.location.indexOf(\"#\") != -1)\n       {\n          \
    \ var hash:String = stageWebView.location.substr(stageWebView.location.indexOf(\"\
    #\") + 1);\n           setAccessToken(hash);\n           stageWebView.stage.nativeWindow.close();\n\
    \       }\n   }\n   ```\n\nThat will work! There's just one small tweak we have\
    \ to make. On Android, the StageWebView uses the Android OS system web control\
    \ (in desktop AIR, the internal AIR WebKit engine is used). Since we don't have\
    \ full control over this, we need to make sure it doesn't do anything unexpected,\
    \ like open the browser application.\n\n9. To do this, prevent the StageWebView\
    \ instance's default action as soon as it dispatches the `LOCATION_CHANGING` event\
    \ (this is dispatched just before the location changes):\n\n   ```\n   var stageWebView:StageWebView\
    \ = new StageWebView();\n   stageWebView.stage = this.stage;\n   stageWebView.viewPort\
    \ = new Rectangle(0, 0, stage.stageWidth, stage.stageHeight);\n   stageWebView.addEventListener(LocationChangeEvent.LOCATION_CHANGE,\
    \ onRedirect);\n   stageWebView.addEventListener(LocationChangeEvent.LOCATION_CHANGING,\
    \ onRedirecting);\n   var authURL:String = \"https://graph.facebook.com/oauth/authorize?client_id=<application_id>&type=user_agent&redirect_uri=<redirect_url>\"\
    ;\n   stageWebView.loadURL(authURL);\n\n   private function onRedirecting(a_event:LocationChangeEvent):void\n\
    \   {\n       var stageWebView:StageWebView = a_event.target;\n       a_event.preventDefault();\
    \  //stop any unexpected default behavior\n       stageWebView.loadURL(a_event.location);\n\
    \       //...but continue loading the URL\n   }\n   ```\n\n## What just happened?\n\
    \nUsing a StageWebView, you authenticated a user with Facebook through an AIR\
    \ for Android application. Since URLLoader instances can be used in the same way\
    \ in AIR for Android as they can in a regular SWF, this means that you can now\
    \ make Android applications that are totally integrated with Facebook, using Flash.\n\
    \n## Have a go hero – modifying the SDK for Android\n\nAt time of writing, the\
    \ SDK uses an `HTMLLoader` for AIR authentication, and JavaScript for SWF authentication,\
    \ so cannot be used to authenticate an Android application. If you really want\
    \ to use the SDK for your Android projects, you'll have to make some changes of\
    \ your own.\n\nAdd StageWebView-based login functionality to the SDK. Rather than\
    \ modifying existing SDK class files, create new class files that extend existing\
    \ ones – that way, they won't be lost if you update the SDK in future.\n\nIt's\
    \ a tricky challenge because you'll be modifying someone else's code, but worth\
    \ it if you want to use the SDK.\n\n## Choosing your application's Facebook settings\n\
    \nThere's more to an application's settings than Canvas URLs. Here are some of\
    \ the more interesting options:\n\n- **Advanced | Deauthorize Callback**: Here\
    \ you can specify a URL that will get called whenever a user removes your application;\
    \ the ID of the user will be passed to this URL. In order to do something with\
    \ this ID, you'll need to use a server-side scripting language – see \"What Next?\"\
    \ later in this chapter. More information on decoding the info is available here:\
    \ http://developers.facebook.com/docs/authentication/\n- **About | Developers**:\
    \ Allows you to set other users as a developer of your application, giving them\
    \ access to the application settings.\n- **Advanced | Sandbox Mode**: Very useful\
    \ for testing, this will only allow a user to sign in to your application if they\
    \ are listed as a developer of that application.\n- **Facebook Integration | Bookmark\
    \ URL**: On the left side of the Facebook home page, you can see a list of applications\
    \ and games that you've used. These are called **Bookmarks**; setting the Bookmark\
    \ URL lets you choose where these links point to. The number to the right of a\
    \ Bookmark is called a **Counter**, and lets the user know about notifications\
    \ and changes within the application. Read more about Counters here: http://developers.facebook.com/docs/guides/canvas/#bookmarks.\n\
    - **About | Icon and About | Logo**: The icon appears next to Bookmarks and below\
    \ wall posts created via your app, while the logo appears in the authorization\
    \ page and in search results.\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_297_0.png)\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_299_0.png)\n\nThe thumbnail image was\
    \ drawn using Graffiti, giving a quick example of what it can do. The About paragraph\
    \ sums up the purpose of the application concisely, and the description adds a\
    \ little social proof: \"lots of other people like this, so you probably will\
    \ too!\"\n\nActually, a lot of the page is about social proof (perhaps not surprising\
    \ for a social application on a social network):\n\n- Display of your friends\
    \ who use the application\n- Average user rating (4.3 out of 5)\n- Large number\
    \ of reviews\n"
  mdcn: "\n\n## 行动时间 – 通过 AIR 使用 HTTP 进行授权\n\n与其将我们的应用程序放在 HTML 页面中，我们必须将 HTML 页面放在我们的应用程序中。为此，我们可以使用\
    \ `HTMLLoader`。\n\n`flash.html.HTMLLoader` 类，仅在 AIR 中可访问，是一种 `DisplayObject` 类型，它充当\
    \ HTML 内容的容器。我们用它来加载应用程序的 Facebook 登录页面，就像我们在第 3 章中使用弹出窗口所做的那样。在那一章中，一旦用户登录，弹出窗口就会重定向到另一个页面，将访问令牌作为哈希的一部分传递，而该页面的源代码中的\
    \ JavaScript 会提取哈希并将其传递给 SWF。在 AIR 中，我们的应用程序将使用事件侦听器来检测此重定向，并直接提取哈希。\n\n以下是其分解方式。这些是通用说明，而不是针对\
    \ Visualizer，因此请根据项目需要进行实现：\n\n1. 首先，导入 `HTMLLoader`。\n\n   ```\n   import flash.html.HTMLLoader;\n\
    \   ```\n\n2. 接下来，创建此类的一个实例，并添加事件侦听器以在内容被重定向时触发。\n\n   ```\n   var htmlLoader:HTMLLoader\
    \ = new HTMLLoader();\n   htmlLoader.addEventListener(Event.LOCATION_CHANGE, onRedirect);\n\
    \   ```\n\n   （不要忘记 `import flash.events.Event`。）\n\n3. `HTMLLoader` 默认的宽度和高度为零，这没有用，因为我们需要用户在其中点击按钮！因此，请调整其大小。\n\
    \n   ```\n   var htmlLoader:HTMLLoader = new HTMLLoader();\n   htmlLoader.addEventListener(Event.LOCATION_CHANGE,\
    \ onRedirect);\n   htmlLoader.width = 640;\n   htmlLoader.height = 480;\n   ```\n\
    \n4. 将其添加到显示列表中以便可见。\n\n   ```\n   var htmlLoader:HTMLLoader = new HTMLLoader();\n\
    \   htmlLoader.addEventListener(Event.LOCATION_CHANGE, onRedirect);\n   htmlLoader.width\
    \ = 640;\n   htmlLoader.height = 480;\n   addChild(htmlLoader);\n   ```\n\n5.\
    \ 加载 Facebook 授权 URL：\n\n   ```\n   var stageWebView:StageWebView = new StageWebView();\n\
    \   stageWebView.stage = this.stage;\n   stageWebView.viewPort = new Rectangle(0,\
    \ 0, stage.stageWidth, stage.stageHeight);\n   stageWebView.addEventListener(LocationChangeEvent.LOCATION_CHANGE,\
    \ onRedirect);\n   var authURL:String = \"https://graph.facebook.com/oauth/authorize?client_id=<application_id>&type=user_agent&redirect_uri=<redirect_url>\"\
    ;\n   stageWebView.loadURL(authURL);\n   ```\n\n6. 请注意，`StageWebView.loadURL()`\
    \ 方法不需要 `URLRequest`，而是需要一个 `String`。\n\n7. 以与之前相同的方式从哈希中提取访问令牌：\n\n   ```\n \
    \  private function onRedirect(a_event:LocationChangeEvent):void\n   {\n     \
    \  var stageWebView:StageWebView = a_event.target as StageWebView;\n       if\
    \ (stageWebView.location.indexOf(\"#\") != -1)\n       {\n           var hash:String\
    \ = stageWebView.location.substr(stageWebView.location.indexOf(\"#\") + 1);\n\
    \           setAccessToken(hash);\n       }\n   }\n   ```\n\n8. 你不能使用 `removeChild()`\
    \ 来移除 `StageWebView`，因此使用此方法：\n\n   ```\n   private function onRedirect(a_event:LocationChangeEvent):void\n\
    \   {\n       var stageWebView:StageWebView = a_event.target as StageWebView;\n\
    \       if (stageWebView.location.indexOf(\"#\") != -1)\n       {\n          \
    \ var hash:String = stageWebView.location.substr(stageWebView.location.indexOf(\"\
    #\") + 1);\n           setAccessToken(hash);\n           stageWebView.stage.nativeWindow.close();\n\
    \       }\n   }\n   ```\n\n这样就可以工作了！我们只需要做一个小小的调整。在 Android 上，StageWebView 使用\
    \ Android 操作系统系统网络控件（在桌面 AIR 中，使用内部 AIR WebKit 引擎）。由于我们无法完全控制它，因此我们需要确保它不会做任何意外的操作，例如打开浏览器应用程序。\n\
    \n9. 为此，只要 StageWebView 实例分派 `LOCATION_CHANGING` 事件，就阻止其默认操作（该事件在位置更改前立即分派）：\n\
    \n   ```\n   var stageWebView:StageWebView = new StageWebView();\n   stageWebView.stage\
    \ = this.stage;\n   stageWebView.viewPort = new Rectangle(0, 0, stage.stageWidth,\
    \ stage.stageHeight);\n   stageWebView.addEventListener(LocationChangeEvent.LOCATION_CHANGE,\
    \ onRedirect);\n   stageWebView.addEventListener(LocationChangeEvent.LOCATION_CHANGING,\
    \ onRedirecting);\n   var authURL:String = \"https://graph.facebook.com/oauth/authorize?client_id=<application_id>&type=user_agent&redirect_uri=<redirect_url>\"\
    ;\n   stageWebView.loadURL(authURL);\n\n   private function onRedirecting(a_event:LocationChangeEvent):void\n\
    \   {\n       var stageWebView:StageWebView = a_event.target;\n       a_event.preventDefault();\
    \  //stop any unexpected default behavior\n       stageWebView.loadURL(a_event.location);\n\
    \       //...but continue loading the URL\n   }\n   ```\n\n## 发生了什么？\n\n使用 StageWebView，你已通过\
    \ AIR for Android 应用程序使用 Facebook 对用户进行了身份验证。由于 URLLoader 实例可以在 AIR for Android\
    \ 中与在常规 SWF 中相同的方式使用，这意味着你现在可以使用 Flash 创建完全集成 Facebook 的 Android 应用程序。\n\n## 试试英雄\
    \ – 修改 SDK 以用于 Android\n\n截至撰写本文时，SDK 使用 `HTMLLoader` 进行 AIR 身份验证，并使用 JavaScript\
    \ 进行 SWF 身份验证，因此无法用于对 Android 应用程序进行身份验证。如果你真的想在 Android 项目中使用 SDK，你就必须自己做一些更改。\n\
    \n为 SDK 添加基于 StageWebView 的登录功能。不要修改现有的 SDK 类文件，而是创建扩展现有类的新类文件——这样，如果你将来更新 SDK，它们就不会丢失。\n\
    \n这是一个棘手的挑战，因为你将修改他人的代码，但如果你想使用 SDK，这也是值得的。\n\n## 选择应用程序的 Facebook 设置\n\n应用程序的设置不仅仅是\
    \ Canvas URL。以下是一些更有趣的选项：\n\n- **Advanced | Deauthorize Callback**：在这里你可以指定一个\
    \ URL，每当用户移除你的应用程序时就会调用该 URL；用户的 ID 将传递给此 URL。为了对该 ID 做些什么，你需要使用服务器端脚本语言——请参阅本章后面的“下一步？”。有关解码信息的更多信息，请访问这里：http://developers.facebook.com/docs/authentication/\n\
    - **About | Developers**：允许你将其他用户设为应用程序的开发者，从而让他们访问应用程序设置。\n- **Advanced | Sandbox\
    \ Mode**：非常适合测试，这将只允许列为该应用程序开发者的用户登录你的应用程序。\n- **Facebook Integration | Bookmark\
    \ URL**：在 Facebook 主页的左侧，你可以看到你使用过的应用程序和游戏列表。这些被称为 **Bookmarks**；设置 Bookmark URL\
    \ 可让你选择这些链接指向的位置。Bookmark 右侧的数字称为 **Counter**，可让用户了解应用程序内的通知和更改。阅读有关 Counters\
    \ 的更多信息：http://developers.facebook.com/docs/guides/canvas/#bookmarks。\n- **About\
    \ | Icon and About | Logo**：图标出现在 Bookmarks 旁边以及通过你的应用创建的墙贴下方，而徽标则出现在授权页面和搜索结果中。\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_297_0.png)\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_299_0.png)\n\
    \n缩略图图像使用 Graffiti 绘制，给出了它可以做什么的快速示例。关于段落简洁地概括了应用程序的目的，而描述则增加了一些社会认同：“很多人喜欢这个，所以你可能也会喜欢！”\n\
    \n实际上，页面的很大一部分都是关于社会认同（对于社交网络上的社交应用来说也许并不奇怪）：\n\n- 显示使用该应用程序的朋友\n- 平均用户评分（4.3\
    \ 分之 5）\n- 大量的评论\n\n"
