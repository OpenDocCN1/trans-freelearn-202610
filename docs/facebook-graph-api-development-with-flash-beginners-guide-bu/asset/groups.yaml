    ,\n\"type\": \"link\",\n\"created_time\": \"2010-06-04T12:39:44+0000\",\n\"updated_time\"\
    : \"2010-06-04T12:39:44+0000\",\n\"likes\": 1\n}\n```\n\nThat object has expired\
    \ now, and is no longer available through the Graph API, but as you could have\
    \ guessed, it was available at https://graph.facebook.com/204603129458_127056137323572.\
    \ It's in the same format as the Page object – albeit with a few different fields\
    \ – so our Graph Object Renderer could render it just fine.\n\nOf course, this\
    \ is useless unless we know the ID of each of the Posts associated with Packt\
    \ Publishing, and there's no indication of where we might find them. Or is there?\n\
    \nI said earlier that the Graph API was designed to be self-documenting. We can\
    \ request extra, \"meta\" information about any Graph Object by adding a metadata=1\
    \ flag to the end of any Graph URL. Take a look at: https://graph.facebook.com/PacktPub?metadata=1\
    \ in your browser. A new property, type, appears in the JSON:\n\n```\n\"type\"\
    : \"page\"\n```\n\nThat's useful; as I said, Posts and Pages (and in fact all\
    \ Graph Objects) take the same format, so this gives us a way of telling them\
    \ apart.\n\nMore immediately interesting, though, is the new metadata object.\
    \ This contains one object, connections, and one array, fields. Let's look at\
