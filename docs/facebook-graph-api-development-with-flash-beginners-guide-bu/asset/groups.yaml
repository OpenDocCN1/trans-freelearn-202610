    ```

    "picture": "http://photos-c.ak.fbcdn.net/hphotos-ak-snc3/hs185.snc3/19239_307944374458_204603129458_4527791_8102041_s.jpg",

    "source": "http://sphotos.ak.fbcdn.net/hphotos-ak-snc3/hs185.snc3/19239_307944374458_204603129458_4527791_8102041_n.jpg",

    "height": 666,

    "width": 540,

    "link": "http://www.facebook.com/photo.php?pid=4527791&id=204603129458",

    "icon": "http://static.ak.fbcdn.net/rsrc.php/z2E5Y/hash/8as8iqdm.gif",

    "created_time": "2010-02-04T12:40:07+0000",

    "updated_time": "2010-03-18T16:08:42+0000"

    }

    ],

    "paging": {

    "previous": "https://graph.facebook.com/307932939458/photos?limit=25&since=2010-03-18T16%3A00%3A38%2B0000",

    "next": "https://graph.facebook.com/307932939458/photos?limit=25&until=2010-02-04T12%3A40%3A06%2B0000"

    }

    }

    ```


    See that node called paging? It obviously contains two URLs, though they seem
    to have some junk attached to the end of them. Actually, it''s not junk; it''s
    just URL-encoded. Here''s how the previous URL looks when decoded:


    ```

    https://graph.facebook.com/307932939458/photos?limit=25&since=2010-03-18T16:00:38+0000

    ```


    It''s clearly a date with a timestamp, passed to a since parameter, just like
    we''ve been using.


    Facebook provides these as an easier alternative to the offset/limit-based paging
    we explored earlier in the chapter. Paging based on time makes a lot more sense
    than paging based on the items position in a list (as we explored before), because
    the date and time that an item was created will never change, while the item''s
    position in a list will change whenever a new item is added to that list.


    It''s true that items being deleted could cause problems: if we''ve already downloaded
    the item then we may not detect that it''s gone, leaving us with incorrect data.
    Even if we do a double-check and remove it, it''s going to leave a gap, meaning
    that the page of items that used to contain it will be shorter than the other
    pages. Whether these are serious problems depends on the application.'
