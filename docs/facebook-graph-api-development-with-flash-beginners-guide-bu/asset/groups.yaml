  md: "\n> The pop-up window will probably be blocked. To prevent you from being able\
    \ to load a million pop-up windows automatically, pop ups opened by a call to\
    \ `window.open()` are blocked by the browser, unless the call comes from within\
    \ the handler of a `MOUSE_CLICK` event.\n> Feel free to add a \"log in\" button\
    \ to the application and move the contents of the `attemptToAuthenticate()` function\
    \ to the button's click handler function; I'm just going to click on **Allow pop\
    \ ups** in my browser.\n\nOnce the pop up is working, you'll either see the Facebook\
    \ login page or the Google home page, depending on whether you're currently logged\
    \ in to Facebook. To make sure you can see the login page, log out of Facebook,\
    \ or load `index.html` in Private browsing mode. Eventually, you'll see the next\
    \ screenshot:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_107_0.png)\n\n## Creating\
    \ a callback web page\n\nOnce you log in, you'll be redirected to Google. However,\
    \ we need the page that the user is redirected to – the **callback** webpage –\
    \ to be one that we control, so that we can put some JavaScript inside it to grab\
    \ the access token and pass it back to our application.\n\nCreate a new HTML page,\
    \ `callback.html`, and enter the following code:\n\n```\n<html>\n<head>\n  <script\
    \ type=\"text/javascript\">\n  <!--\n  window.opener.setAccessToken(window.location.hash);\n\
    \  //-->\n</script>\n</head>\n<body>\n<h2>Close this window</h2>\n<p>The access\
    \ token has been passed back to index.html.</p>\n</body>\n</html>\n```\n\nYou\
    \ may later want this window to close automatically once it's done its job. This\
    \ is simple to do: just add another line to the JavaScript as shown in the following\
    \ code:\n\n```\n<script type=\"text/javascript\">\n<!--\n    window.opener.setAccessToken(window.location.hash);\n\
    \    self.close();\n//-->\n</script>\n```\n\nI've highlighted the most important\
    \ line; this finds the window that opened the pop up, and calls a JavaScript function\
    \ named setAccessToken() inside that window's page, passing it the \"hash\" of\
    \ the pop up's URL (everything after the # character). Remember, the pop up's\
    \ URL will be:\n\n```\nhttp://www.google.com/#access_token=123675230995389%7C2._X2CYJw2h7tOH9T9i7tkCg__.3600.1277610200-169573433058884%7Cy3fkK9oobNvC6DSSFChUVFeJrMO\n\
    ```\n\nso the hash will contain the access token.\n\nWe need to write that setAccessToken()\
    \ function – but first, let's make this the official callback webpage. Upload\
    \ callback.html to the same directory as index.html on your web host, then go\
    \ to the Facebook Developers page and edit your application's settings.\n\nIn\
    \ the Web Site tab, enter the base domain name of your host into the Site URL\
    \ box. For instance, if your callback.html page is at http://host.com/visualizer/callback.html,\
    \ enter http://host.com/.\n\nNow, in HTTPRequestor.as, in your attemptToAuthenticate()\
    \ function, change the redirect_uri parameter of the URL to point to callback.html:\n\
    \n```\npublic function attemptToAuthenticate():void\n{\n    ExternalInterface.call(\"\
    window.open\",\n        \"https://graph.facebook.com/oauth/authorize?client_id=165373950152944&type=user_agent&redirect_uri=http://host.com/visualizer/callback.html\"\
    ,\n        \"facebookLoginWindow\",\n        \"height=370, width=600\");\n}\n\
    ```\n\nRecompile your application, and upload it to your web host, overwriting\
    \ the old version. Refresh `index.html` in your browser. You should see the pop\
    \ up appear, and (once you've logged in) it will load `callback.html`:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_109_0.png)\n\
    \nIt's telling a lie at the moment, though. The access token hasn't been passed\
    \ back, because there's no `setAccessToken()` function to pass it back to!\n\n\
    ## Receiving the access token\n\nUsing `ExternalInterface`, we can allow JavaScript\
    \ inside `index.html` to call an ActionScript function inside our SWF.\n\n1. Let's\
    \ create an ActionScript function that will take the hash value and extract the\
    \ access token from it.\n2. Add this new function to `HTTPRequestor.as`:\n\n```\n\
    private function setAccessToken(a_hashValue:String):void\n{\n    var hashParams:Array\
    \ = a_hashValue.substr(1).split(\"&\");\n    var hashKeyAndValue:Array;\n\n  \
    \  for (var i:int = 0; i < hashParams.length; i++)\n    {\n        hashKeyAndValue\
    \ = (hashParams[i] as String).split(\"=\");\n        if (hashKeyAndValue[0] ==\
    \ \"access_token\")\n        {\n            this.accessToken = hashKeyAndValue[1];\n\
    \            break;\n        }\n    }\n    this.request(new GraphRequest(\"me\"\
    ));\n}\n```\n\nNow, add the following code to your HTTPRequestor() constructor\
    \ function:\n\n```\npublic function HTTPRequestor(target: IEventDispatcher = null)\n\
    {\n    //this is needed because the class extends EventDispatcher\n    super(target);\n\
    \    ExternalInterface.addCallback(\"setAccessToken\", setAccessToken);\n\n  \
    \  ExternalInterface.call(\"function() {\\n\" +\n        \"window.setAccessToken\
    \ = function(hashValue){\\n\" +\n        \"  var visualizer = document.getElementById('Visualizer');\\\
    n\" +\n        \"  visualizer.setAccessToken(hashValue);\\n\" +\n        \"}\\\
    n\" +\n        \"}\");\n}\n```\n\nThe highlighted code creates and calls an anonymous\
    \ function which contains the actual function we want to call. It's a bit messy,\
    \ but it works.\n\nRecompile your SWF and upload it to your host. Refresh index.html.\
    \ The pop up will appear, may prompt you to log in, and will redirect to the Close\
    \ this window page. Shortly after that we will see the following screenshot:\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_112_0.png)\n\nSuccess!\n\n## What just\
    \ happened?\n\nYou just added true Facebook authentication to your Flash application.\n\
    \nThe user logs in on Facebook itself, rather than through your application, minimizing\
    \ the security risk. Facebook passes the access token back to a callback page\
    \ that you wrote, which in turn passes it back through another web page to your\
    \ SWF, which is now able to use it when requesting Graph API data.\n\n## What\
    \ about users who haven't used the application before?\n\nWe haven't fully tested\
    \ the authentication yet, since we had already granted the application permission\
    \ to access our data earlier on, when we were experimenting with the browser.\n\
    \nFortunately it's very easy to undo all that and pretend we've never seen the\
    \ application before. Log in to Facebook and click on Account | Application Settings.\
    \ Find your application in the list, and click on the X button as shown in the\
    \ next screenshot:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_113_0.png)\n\n\
    Facebook will ask you to confirm this decision. (The application will remain on\
    \ your Developers Page, even though it will be removed from your Applications\
    \ Page.)\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_113_1.png)\n\nRefresh index.html.\
    \ This time, the pop up will ask for permission to access your information:\n\n\
    ![](img/4e826fa36038b86f2087ef8b818d0acf_114_0.png)\n\nClick on **Allow**, and\
    \ the pop up is redirected to callback.html, which passes the access token to\
    \ the visualizer, just as before.\n\n## Have a go hero – dealing with the undecided\n\
    \nWhat if your user clicks on the **Don't allow** dialog box?\n\nAt the moment,\
    \ the application doesn't do anything without an access token; it just sits patiently\
    \ and waits. If, when the pop up window appears, the user doesn't click on **Allow**\
    \ – or if the user doesn't see the pop up, perhaps because it's blocked – the\
    \ application won't fail gracefully. It will just sit there and wait.\n\nAdd some\
    \ features to your application to make it deal with this kind of situation. Maybe\
    \ it could pop up a message after a few seconds, saying \"You need to log in to\
    \ Facebook and approve this application in order to use it.\" Or perhaps you could\
    \ load a different Graph object to start with, and only request a login when the\
    \ user tries to access something they need an access token for.\n\nNow that your\
    \ application's online, you can let other people see it by directing them to index.html.\
    \ Get some friends to test it out.\n\n## Extended permissions\n\nWe don't have\
    \ access to everything yet, though. In your browser, try loading https://graph.facebook.com/me/inbox\
    \ (with an access token passed as a parameter). You'll get the following message:\n\
    \n```\n{\n  \"error\": {\n    \"type\": \"Exception\",\n    \"message\": \"(#612)\
    \ mailbox requires the read_mailbox extended permission.\"\n  }\n}\n```\n\nMuch\
    \ like how you, as a user, can restrict other users from seeing certain parts\
    \ of your Facebook profile, you can also restrict certain apps from accessing\
    \ certain information via the Graph API.\n\nIn this case, we're trying to access\
    \ my inbox, as an application, and are being told we don't have permission. But\
    \ how do we get permission?\n\n## Time for action – obtaining extended permissions\n\
    \nIt's actually really easy to request permission to do something beyond the basic:\
    \ when calling the authorize URL, pass it an extra parameter named scope.\n\n\
    Set the value of the scope parameter to the name of the extended permission you\
    \ want to request. For example, to request access to the user's inbox, use this\
    \ URL:\n\n```\nhttps://graph.facebook.com/oauth/authorize?client_id=<your_application_id>&type=user_agent&redirect_uri=<your_callback_url>&scope=read_mailbox\n\
    ```\n\nTry this in the browser, and you'll get this dialog:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_115_0.png)\n"
  mdcn: "\n> 弹出窗口很可能会被拦截。为了防止你能够自动加载无数个弹出窗口，浏览器会阻止通过调用 `window.open()` 打开的弹出窗口，除非该调用来自\
    \ `MOUSE_CLICK` 事件的处理程序。\n> 你可以随意在应用程序中添加一个“登录”按钮，并将 `attemptToAuthenticate()`\
    \ 函数的内容移到该按钮的点击处理函数中；反正我会直接在浏览器中点击**允许弹出窗口**。\n\n一旦弹出窗口正常工作，你会看到 Facebook 登录页面或\
    \ Google 首页，具体取决于你当前是否已登录 Facebook。为了确保你能看到登录页面，请退出 Facebook，或在隐私浏览模式下加载 `index.html`。最终，你会看到下面这张截图：\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_107_0.png)\n\n## 创建回调网页\n\n一旦你登录，你会被重定向到\
    \ Google。然而，我们需要用户被重定向到的页面——**回调**网页——是一个由我们控制的页面，这样我们才能在页面内放入一些 JavaScript 来获取访问令牌并将其传递回我们的应用程序。\n\
    \n新建一个 HTML 页面 `callback.html`，并输入以下代码：\n\n```\n<html>\n<head>\n  <script type=\"\
    text/javascript\">\n  <!--\n  window.opener.setAccessToken(window.location.hash);\n\
    \  //-->\n</script>\n</head>\n<body>\n<h2>Close this window</h2>\n<p>The access\
    \ token has been passed back to index.html.</p>\n</body>\n</html>\n```\n\n你可能希望该窗口在完成任务后自动关闭。这很简单：只需在\
    \ JavaScript 中再添加一行代码，如下所示：\n\n```\n<script type=\"text/javascript\">\n<!--\n\
    \    window.opener.setAccessToken(window.location.hash);\n    self.close();\n\
    //-->\n</script>\n```\n\n我突出显示了最重要的一行；它找到打开弹出窗口的窗口，并在该窗口的页面中调用名为 setAccessToken()\
    \ 的 JavaScript 函数，将弹出窗口 URL 的“哈希值”传递给它（也就是 `#` 字符之后的所有内容）。记住，弹出窗口的 URL 将是：\n\n\
    ```\nhttp://www.google.com/#access_token=123675230995389%7C2._X2CYJw2h7tOH9T9i7tkCg__.3600.1277610200-169573433058884%7Cy3fkK9oobNvC6DSSFChUVFeJrMO\n\
    ```\n\n因此，哈希值中会包含访问令牌。\n\n我们需要编写这个 setAccessToken() 函数——不过首先，让我们把 callback.html\
    \ 设为正式的回调网页。将 callback.html 上传到你的 Web 主机上与 index.html 相同的目录，然后转到 Facebook 开发者页面并编辑你的应用程序设置。\n\
    \n在 Web Site 标签页中，在 Site URL 输入框中输入你的主机的基础域名。例如，如果你的 callback.html 页面位于 http://host.com/visualizer/callback.html，请输入\
    \ http://host.com/。\n\n现在，在 HTTPRequestor.as 中，在 attemptToAuthenticate() 函数里，将\
    \ URL 的 redirect_uri 参数改为指向 callback.html：\n\n```\npublic function attemptToAuthenticate():void\n\
    {\n    ExternalInterface.call(\"window.open\",\n        \"https://graph.facebook.com/oauth/authorize?client_id=165373950152944&type=user_agent&redirect_uri=http://host.com/visualizer/callback.html\"\
    ,\n        \"facebookLoginWindow\",\n        \"height=370, width=600\");\n}\n\
    ```\n\n重新编译你的应用程序，并上传到你的 Web 主机，覆盖旧版本。在浏览器中刷新 `index.html`。你应该会看到弹出窗口出现，并且（一旦你登录）它会加载\
    \ `callback.html`：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_109_0.png)\n\n\
    不过，目前这实际上是在“说谎”。访问令牌并没有传回，因为还没有 `setAccessToken()` 函数来接收它！\n\n## 接收访问令牌\n\n借助\
    \ `ExternalInterface`，我们可以让 `index.html` 中的 JavaScript 调用我们 SWF 内的 ActionScript\
    \ 函数。\n\n1. 我们来创建一个 ActionScript 函数，它接收哈希值并从中提取访问令牌。\n2. 将这个新函数添加到 `HTTPRequestor.as`\
    \ 中：\n\n```\nprivate function setAccessToken(a_hashValue:String):void\n{\n   \
    \ var hashParams:Array = a_hashValue.substr(1).split(\"&\");\n    var hashKeyAndValue:Array;\n\
    \n    for (var i:int = 0; i < hashParams.length; i++)\n    {\n        hashKeyAndValue\
    \ = (hashParams[i] as String).split(\"=\");\n        if (hashKeyAndValue[0] ==\
    \ \"access_token\")\n        {\n            this.accessToken = hashKeyAndValue[1];\n\
    \            break;\n        }\n    }\n    this.request(new GraphRequest(\"me\"\
    ));\n}\n```\n\n现在，将以下代码添加到你的 HTTPRequestor() 构造函数中：\n\n```\npublic function HTTPRequestor(target:\
    \ IEventDispatcher = null)\n{\n    //this is needed because the class extends\
    \ EventDispatcher\n    super(target);\n    ExternalInterface.addCallback(\"setAccessToken\"\
    , setAccessToken);\n\n    ExternalInterface.call(\"function() {\\n\" +\n     \
    \   \"window.setAccessToken = function(hashValue){\\n\" +\n        \"  var visualizer\
    \ = document.getElementById('Visualizer');\\n\" +\n        \"  visualizer.setAccessToken(hashValue);\\\
    n\" +\n        \"}\\n\" +\n        \"}\");\n}\n```\n\n突出显示的代码创建并调用了一个匿名函数，该函数包含我们真正想要调用的函数。这有点乱，但确实有效。\n\
    \n重新编译你的 SWF 并上传到你的主机。刷新 index.html。弹出窗口会显示，可能会提示你登录，然后重定向到“Close this window”页面。紧接着，你会看到下面这张截图：\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_112_0.png)\n\n成功！\n\n## 刚才发生了什么？\n\n\
    你刚刚为你的 Flash 应用添加了真正的 Facebook 身份验证。\n\n用户直接在 Facebook 上登录，而不是通过你的应用，从而将安全风险降到最低。Facebook\
    \ 将访问令牌传回你编写的回调页面，该页面再通过另一个网页将其传回你的 SWF，现在 SWF 就可以在请求 Graph API 数据时使用它了。\n\n##\
    \ 那些之前没有使用过该应用的用户呢？\n\n我们还没有完整地测试身份验证，因为之前在浏览器中做实验时，我们已经授予了应用程序访问我们数据的权限。\n\n\
    幸运的是，撤销这一切非常容易，我们可以假装从未见过这个应用。登录 Facebook，点击 Account | Application Settings。在列表中找到你的应用程序，然后点击\
    \ X 按钮，如下面截图所示：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_113_0.png)\n\nFacebook\
    \ 会要求你确认此决定。（应用程序将保留在你的开发者页面，即使它会从你的应用页面中移除。）\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_113_1.png)\n\
    \n刷新 index.html。这一次，弹出窗口会请求获取你信息的权限：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_114_0.png)\n\
    \n点击**允许**，弹出窗口就会被重定向到 callback.html，它会像之前一样将访问令牌传递给 visualizer。\n\n## 小试牛刀——处理犹豫不决的用户\n\
    \n如果用户点击了**不允许**对话框呢？\n\n目前，如果没有访问令牌，应用程序什么都不会做；它只是耐心地等待。如果弹出窗口出现时，用户没有点击**允许**——或者用户因为弹出窗口被拦截而没有看到它——应用程序就不会优雅地失败，而只是坐在那里一直等待。\n\
    \n为你的应用程序添加一些功能，让它能处理这类情况。也许它可以在几秒钟后弹出一条消息，提示“你需要登录 Facebook 并批准此应用程序才能使用它。”或者你也可以先加载一个不同的\
    \ Graph 对象，只在用户试图访问需要访问令牌的内容时才要求登录。\n\n既然你的应用已经上线，你可以让别人通过访问 index.html 来查看它。找一些朋友来测试一下吧。\n\
    \n## 扩展权限\n\n不过，我们目前还不能访问所有内容。在你的浏览器中，尝试加载 https://graph.facebook.com/me/inbox\
    \ （将访问令牌作为一个参数传入）。你会收到以下消息：\n\n```\n{\n  \"error\": {\n    \"type\": \"Exception\"\
    ,\n    \"message\": \"(#612) mailbox requires the read_mailbox extended permission.\"\
    \n  }\n}\n```\n\n就像作为用户，你可以限制其他用户查看你 Facebook 个人资料的某些部分一样，你也可以通过 Graph API 限制某些应用访问特定信息。\n\
    \n在这个例子中，我们正以应用的身份尝试访问我的收件箱，但被告知没有权限。那么我们又该如何获得权限呢？\n\n## 实践时刻——获取扩展权限\n\n要请求超出基本范围的权限，其实非常容易：在调用授权\
    \ URL 时，额外传入一个名为 scope 的参数。\n\n将 scope 参数的值设置为你想要请求的扩展权限的名称。例如，要请求访问用户的收件箱，请使用以下\
    \ URL：\n\n```\nhttps://graph.facebook.com/oauth/authorize?client_id=<your_application_id>&type=user_agent&redirect_uri=<your_callback_url>&scope=read_mailbox\n\
    ```\n\n在浏览器中尝试这个 URL，你会看到这个对话框：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_115_0.png)\n"
