    \ 添加到你的应用程序中，作为本章前面构建的类的替代方案。\n\nSDK 的工作方式与我们的类非常相似，只是更加精致；它也使用 `URLRequest` 对象来检索数据，并将结果\
    \ JSON 解码为原生的 AS3 对象。\n\n为了使 SDK 正常工作，它导入了两个包含 JavaScript 函数的 JS 文件，这些函数实际上驱动了\
    \ Facebook 登录和集成。这两个文件称为：`FBJSBridge.js`，包含在项目中；以及 `all.js`，从 Facebook 服务器加载。只要你的网页使用\
    \ SWFObject 并导入这些 JavaScript 文件，你就应该能够使用 SDK。\n\n## Have a go hero – requesting\
    \ extended permissions with the SDK\n\n`Facebook.login()` 方法接受第二个参数：`options`，一个原生的\
    \ AS3 `Object`。它用于请求扩展权限；只需提供一个具有字符串属性 `perms` 的对象，该属性是权限的逗号分隔列表。\n\n使用它来修改你的\
    \ `SDKRequestor.attemptToAuthenticate()` 方法，使其可以接受任意数量的扩展权限作为参数并使用 `Facebook.login()`\
    \ 方法请求它们。\n\n## Pop Quiz\n\n- 1. What does \"me\" do?\n  - a. Returns the authenticated\
    \ user's ID\n  - b. Stands in as the authenticated user's ID when used in a Graph\
    \ URL.\n  - c. It represents the ID of a Facebook user called Mike Eddington\n\
    \n- 2. Why didn't we obtain an access token using AS3 alone?\n  - a. `URLRequest`\
    \ objects can't load the Facebook login page\n  - b. It's only possible to obtain\
    \ a token using JavaScript\n  - c. We wanted to present the user with a genuine\
    \ Facebook login page, for trust reasons\n\n- 3. Why shouldn't you ask for all\
    \ the extended permissions your application might possibly need at once?\n  -\
    \ a. It's likely to scare users away\n  - b. Only five permissions can be granted\
    \ at any one time\n  - c. This is a violation of the Facebook terms of service\n\
    \n## Summary\n\n在本章中，关键词是安全、权限和身份验证。\n我们学习了：\n\n- Facebook 如何限制我们访问不应该访问的信息\n\
    - 用户如何决定哪些信息可以被其他用户（和应用）看到\n- 应用如何请求查看用户更多信息的权限\n- 用户和应用如何共同使用 Facebook 进行身份验证\n\
    \n## Key takeaways\n\n- 如果你尝试在没有身份验证证明的情况下访问 Graph 对象，Graph API 只会提供关于某人的某些细节。\n\
    - 访问令牌是授权证明，与用户和应用程序相关联。\n- 用户有两个凭证：电子邮件地址和密码。\n- 应用程序有三个凭证：应用程序 ID（类似于用户名）、应用程序密钥（类似于密码，可以更改）和\
    \ API 密钥（用于访问 Graph API）。\n\n"
