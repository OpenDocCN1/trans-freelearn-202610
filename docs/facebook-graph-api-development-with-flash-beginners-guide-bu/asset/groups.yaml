    The user will also receive e-mails and notifications whenever someone comments
    on that post. It''s like a mini-subscription, as well as a sign of approval.


    The URL to request is:


    ```

    https://graph.facebook.com/<post_id>/likes.

    ```


    There are no possible parameters.


    Likes require the `publish_stream` permissions.


    # What about "liking" other Graph Objects?


    In Chapter 2, we looked at how "like" connections joined people to TV shows, movies,
    music, interests, and activities; the "like" connection is responsible for many
    of the strands in the Graph''s Web. Yet, the Graph API will not allow us to "like"
    anything other than posts (even trying to like a comment will result in an HTTP
    Status Code 500).


    Facebook has said that they have no plans to allow developers to create "likes"
    for anything else. It seems their aim is to make sure no user ever clicks an unofficial
    "like" button (or at least, a "like" button in a context that Facebook hasn''t
    approved; Yelp.com has its own design of "like" button, as they are a partner
    site to Facebook).


    So, unfortunately, it''s not possible to alter the user''s television, movies,
    interests, or activities through the Graph API.


    # Deleting Likes


    Likes don''t have their own ID, so we can''t delete a like by attempting to delete
    https://graph.facebook.com/<like_id>. Instead, we must use this URL: https://graph.facebook.com/<graph_object_id>/likes.


    As you know, this is the Graph URL for a connection, which would return a Graph
    List if we tried to load it in a browser. However, when we try to delete the URL
    using the process described in the Deleting Graph Objects section, it will make
    the authorized user "unlike" the Graph Object.'
