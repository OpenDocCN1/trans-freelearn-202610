  - "[PAGE 40]\n\nThat's how website users view the information. How will our code\
    \ \"see\" it? Take a look at how the Graph API represents Packt Publishing's Page\
    \ by pointing your web browser at https://graph.facebook.com/PacktPub. This is\
    \ called a Graph URL – note that it's the same URL as the Page itself, but with\
    \ a secure https connection, and using the graph sub domain, rather than www.\n\
    \nWhat you'll see is as follows:\n\n```\n{\n  \"id\": \"204603129458\",\n  \"\
    name\": \"Packt Publishing\",\n  \"picture\": \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs302.ash1/23274_204603129458_7460_s.jpg\"\
    ,\n  \"link\": \"http://www.facebook.com/PacktPub\",\n  \"category\": \"Products_other\"\
    ,\n  \"username\": \"PacktPub\",\n  \"company_overview\": \"Packt is a modern,\
    \ IT focused book publisher, specializing in producing cutting-edge books for\
    \ communities of developers, administrators, and newbies alike.\\n\\nPackt published\
    \ its first book, Mastering phpMyAdmin for MySQL Management in April 2004.\",\n\
    \  \"fan_count\": 412\n}\n```\n\n# What just happened?\n\nYou just fetched the\
    \ Graph API's representation of the Packt Publishing Page in your browser.\n\n\
    The Graph API is designed to be easy to pick up – practically self-documenting\
    \ – and you can see that it's a success in that respect. It's pretty clear that\
    \ the previous data is a list of fields and their values.\n\nThe one field that's\
    \ perhaps not clear is id; this number is what Facebook uses internally to refer\
    \ to the Page. This means Pages can have two IDs: the numeric one assigned automatically\
    \ by Facebook, and an alphanumeric one chosen by the Page's owner. The two IDs\
    \ are equivalent: if you browse to https://graph.facebook.com/204603129458, you'll\
    \ see exactly the same data as if you browse to https://graph.facebook.com/PacktPub.\n\
    \n# Have a go hero – exploring other objects\n\nOf course, the Packt Publishing\
    \ Page is not the only Page you can explore with the Graph API in your browser.\
    \ Find some other Pages through the Facebook website in your browser, then, using\
    \ the https://graph.facebook.com/id format, take a look at their Graph API representations.\
    \ Do they have more information, or less?"
