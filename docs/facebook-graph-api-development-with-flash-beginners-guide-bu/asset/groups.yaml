    Evidently, the ReadWriteWeb article had temporarily become the top search result
    for **Facebook Login**, leading hundreds of Facebook users, equating Google or
    Bing with the Internet, to believe that this blog post was actually a redesigned
    `Facebook.com`. The comment form, fittingly, had a **Sign in with Facebook** button
    that could be used instead of manually typing in a name and e-mail address to
    sign a comment—and of course, the Facebook users misinterpreted this as the new
    **Log in** button.


    And yet... all of those people manage to use Facebook, keenly enough to throw
    a fit when it apparently became impossible to use. It''s not just a site for geeks
    and students; it has serious mass market appeal.


    Even "The Social Network"—a movie based on the creation of Facebook—held this
    level of appeal: it opened at #1 and remained there for its second weekend.


    ## Numbers


    According to Facebook''s statistics page (`http://www.facebook.com/press/info.php?statistics`),
    over 500 million people log in to Facebook in any given month (as of November
    2010). For perspective, the population of the entire world is just under 7,000
    million.


    Twitter is estimated to have 95 million monthly active users (according to the
    `eMarketer.com` September 2010 report), as is MySpace. **FarmVille**, the biggest
    game based on the Facebook platform, has over 50 million: more than half the population
    of either competing social network.


    FarmVille has been reported to be hugely profitable, with some outsider reports
    claiming that its parent company, **Zynga**, has generated twice as much profit
    as Facebook itself (though take this with a grain of salt). Now, of course, not
    every Facebook game or application can be that successful, and FarmVille does
    benefit from the same snowball effect as Facebook itself, making it hard to compete
    with—but that almost doesn''t matter; these numbers validate Facebook as a platform
    on which a money-making business can be built.


    ## It''s everywhere


    As the aforementioned ReadWriteWeb article explained, Facebook has become a standard
    login across many websites. Why add yet another username/password combination
    to your browser''s list (or your memory) if you can replace them all with one
    Facebook login?


    ## Introduction


    This isn''t restricted to posting blog comments. UK TV broadcaster, Channel 4,
    allows viewers to access their entire TV lineup on demand, with no need to sign
    up for a specific Channel 4 account:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_24_0.png)


    Again, Facebook benefits from that snowball effect: as more sites enable a Facebook
    login, it becomes more of a standard, and yet more sites decide to add a Facebook
    login in order to keep up with everyone else.


    Besides login capabilities, many sites also allow users to share their content
    via Facebook. Another UK TV broadcaster, the BBC, lets users post links for their
    recommended TV programs straight to Facebook:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_24_1.png)


    Blogs—or, indeed, many websites with articles—allow readers to Like a post, publishing
    this fact on Facebook and on the site itself:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_24_2.png)


    So half a billion people use the Facebook website every month, and at the same
    time, Facebook spreads further and further across the Internet—and even beyond.
    "Facebook Messages" stores user''s entire conversational histories, across e-mail,
    SMS, chat, and Facebook itself; "Facebook Places" lets users check into a physical
    location, letting friends know that they''re there.


    No other network has this reach.


    ## It''s interesting to develop for


    With all this expansion, it''s difficult for a developer to keep up with the Facebook
    platform. And sometimes there are bugs, and undocumented areas, and periods of
    downtime, all of which can make development harder still.


    But the underlying system—the **Graph API**, introduced in April 2010—is fascinating.
    The previous API had become bloated and cumbersome over its four years; the Graph
    API feels well-designed with plenty of room for expansion.


    This book mainly focuses on the Graph API, as it is the foundation of modern Facebook
    development. You''ll be introduced to it properly in *Chapter 2, Welcome to the
    Graph*.


    ## Have a go hero – get on Facebook


    If you''re not on Facebook already, sign up now (for free) at http://facebook.com.
    You''ll need an account in order to develop applications that use it. Spend some
    time getting used to it:


    - Set up a personal profile.

    - Post messages to your friends on their **Walls**.

    - See what all the FarmVille fuss is about at http://apps.facebook.com/onthefarm.

    - Check in to a location using Facebook Places.

    - Log in to some blogs using your Facebook account.

    - Share some YouTube videos on your own Wall from the YouTube website.

    - "Like" something.

    - Go native!


    ## Web hosts


    If you''ve already got a publicly accessible web server or are signed up to a
    web host to which you can upload SWFs and HTML pages via FTP, skip to the *How
    much AS3 knowledge is required?* section.


    ### What''s a web host?


    I''ll assume that you roughly know how the Internet works: when you type a URL
    into a web browser on your computer and hit **Go**, it retrieves all the pages
    and images it needs from another computer, the **web server**, and displays them.
    The exact methods it uses to find the web server and the protocols for how the
    information gets back to your computer aren''t relevant here.


    You could go out and buy a computer, install some server software, and hook it
    up to your Internet connection, and you''d have a functional web server. But you''d
    have to maintain it and keep it secure, and your ISP probably wouldn''t be very
    happy about you sending all those pages and images to other people''s browsers.
    A better option is to pay another company to take care of all of that for you—a
    web host.


    ### Why do you need one?


    - In order to build an online SWF-based application or game that allows users
    to log in with their Facebook account (with the SWF being able to access their
    profile, list of friends, Wall, and so on), you will require control over a web
    page.

    - Technically, you could probably come up with some hack that would allow you
    to get around this—perhaps by hosting everything on Google sites and MegaSWF—but
    in the long run it''s not going to be worth it. Splash out on a web host for the
    sake of learning; you will definitely need access to one if you do professional
    Facebook application development in the future.


    ### How do you choose one?


    - There are a huge number of web hosts to choose from, and an even bigger number
    of configurable options between them. How much disk space do you need? How much
    bandwidth per month? How much processing power? Some hosts will give you a server
    all to yourself, while others will put your files on the same computer as other
    customers. And of course, you have to wonder how good the customer service is
    and how reliable the company is at keeping their servers online. Throw in a few
    terms such as "cloud hosting" and it''s enough to make your head spin.

    - All you need is a host that allows you to upload HTML files and SWFs; this book
    also assumes that you''ll be able to use FTP to transfer files from your computer
    to the host, though this isn''t strictly necessary.

    - Want to just get started without wasting time comparing hosts? Go with Media
    Temple. The code in this book was all tested using a Media Temple Grid Service
    account, available at http://mediatemple.net/webhosting/gs/. It provides much
    more than what you''ll need for completing the projects in this book, granted,
    and at $20/month. It''s not the cheapest option available, but the extra service
    and features will definitely come in handy as you build your own Facebook applications
    and games.


    - **How To Use A Document Class In Flash**—A short tutorial to get you up to speed
    with using document classes in Flash CS3 and above: http://active.tutsplus.com/tutorials/actionscript/quick-tip-how-to-use-a-document-class-in-flash/.

    - **AS3 101**—A series of tutorials to walk you through the basics of AS3 development.
    In particular, read from Part 8 onwards, as these deal with OOP in AS3: http://active.tutsplus.com/series/as3-101/.


    - You should also know how to create and compile a SWF project, and be familiar
    enough with HTML to be able to embed a SWF in it. We''ll use **SWFObject** for
    this purpose (this is the default embed method used by Flash CS5); if you''re
    not sure what this means, familiarize yourself here: http://code.google.com/p/swfobject/.

    - All important AS3 classes and keywords used in this book will be briefly explained
    as they become relevant, so don''t worry if you haven''t memorized the **LiveDocs**
    yet. Speaking of LiveDocs, remember that you can always use them to look up unfamiliar
    code: http://help.adobe.com/en_US/FlashPlatform/reference/actionscript/3/index.html.


    ## The source code


    At the start of *Chapter 2, Welcome to the Graph*, you''ll be given a Flash project
    that''s just an empty user interface—it''ll be up to you to build the backend
    using the lessons you learn from Chapters 2 through 6.


    This project is called **Visualizer**, and contains the class structure and all
    the UI for an application that can be used to represent all of the information
    stored on Facebook. You''ll go far beyond simply allowing people to log in to
