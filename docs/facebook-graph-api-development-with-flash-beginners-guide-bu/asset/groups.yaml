  - '[PAGE 259]


    Okay, so that explains how one photo is connected to one album. We can find out
    which album has a certain photo as its cover with this FQL query:


    ```

    SELECT aid

    FROM album

    WHERE cover_pid = «specific photo''s ID»

    ```


    Conversely, we can find which photo is the cover for an album with this query:


    ```

    SELECT pid

    FROM photo

    WHERE pid = «album''s cover_pid»

    ```


    ...actually, we can find out which photos are in an album with a very similar
    query:


    ```

    SELECT pid

    FROM photo

    WHERE aid = «album''s ID»

    ```


    This can be considered "backwards" compared to the Graph model, because with the
    Graph you take the album object and ask for all its related photos: "album/photos";
    with the database model you take the photo table and ask for all rows belonging
    to an album: "FROM photo WHERE aid = «album id»".


    # Photos, Albums, and their Owners


    Did you notice that both the photo and album tables have a field called "owner",
    containing the owner''s user ID? Now, surely we can connect these. A first attempt
    at doing so might look like this:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_259_0.png)


    What word would go above that line? A smart guess would be "is", since the owners
    are the same – watch out, because this is a trap.'
  - '[PAGE 260]


    These "entity relationship" lines don''t connect *fields* in the database tables;
    they connect entire tables, *using* the fields as a "key". Remember the rule of
    reading the verbs from left to right. If we used "is" as the verb, it would say,
    "The photo is the specified album" which is clearly wrong.


    We can''t connect the two tables directly because their relationship is through
    another entity. Let me show you what I mean:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_260_0.png)


    We''ve now got three tables (photo, album, user) and four relationships:


    +   - The photo belongs to the specified album

    +   - The photo is a cover of the specified album

    +   - The photo belongs to the specified user

    +   - The user owns the specified album


