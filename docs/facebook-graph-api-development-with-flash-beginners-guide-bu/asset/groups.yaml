    But let''s look at what you''ll need to know about tabs for when you can create
    them.


    From a technical point of view, the most important point is that tabs have a width
    of only 520 pixels, so bear this in mind when laying out your application and
    its tab page. You may even wish to create a separate web page to house the SWF
    – or even a separate SWF – for use inside a tab.


    If you''ve made an advergame for a company, with Facebook integration to use the
    player''s own name inside the game and let them post their score on their Wall,
    you could put the game in a tab on that company''s Facebook page, rather than
    just using a standalone application page for it.


    Adobe took such an approach with their Flex quiz game, Cube Builder:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_287_0.png)'
