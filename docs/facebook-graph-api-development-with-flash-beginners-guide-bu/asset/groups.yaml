    \n    urlRequest.url = \"https://graph.facebook.com/oauth/authorize\";\n    variables.client_id\
    \ = \"<your_application_id>\";\n    variables.type = \"user_agent\";\n    variables.redirect_uri\
    \ = \"http://google.com\";\n    urlRequest.data = variables;\n\n    loader.addEventListener(Event.COMPLETE,\
    \ onAuthenticationComplete);\n    loader.addEventListener(IOErrorEvent.IO_ERROR,\
    \ onIOError);\n    loader.load(urlRequest);\n}\n```\n\nMake sure that you replace\
    \ <your_application_id> with your actual application ID.\n\nWe're using the same\
    \ IO_ERROR handler function as when we load a Graph object, but we need a new\
    \ function, onAuthenticationComplete(), for when the loading has finished; add\
    \ it to HTTPRequestor.as:\n\n```\nprivate function onAuthenticationComplete(a_event:Event):void\n\
    {\n    trace(\"Authentication complete\");\n    var loader:URLLoader = URLLoader(a_event.target);\n\
    \    trace(loader.data);\n}\n```\n\nNothing complicated there; it will trace whatever\
    \ gets sent back.\n\nIn CustomGraphContainerController.as, let's change the constructor\
    \ function so that it kicks this authentication off instead of loading a user\
    \ profile:\n\n```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    _requestor = new HTTPRequestor();\n\
    \    addEventListenersToRequestor();\n    _requestor.attemptToAuthenticate();\n\
    \    //_requestor.request(new GraphRequest(\"<your_user_id>\"));\n}\n```\n\nBefore\
    \ this can work, we need to add the function to the IRequestor interface. Modify\
    \ \\src\\graph\\apis\\base\\IRequestor.as to:\n\n```\npackage graph.apis.base\n\
    {\n    import flash.events.IEventDispatcher;\n    import graph.GraphRequest;\n\
    \n    public interface IRequestor extends IEventDispatcher\n    {\n        function\
    \ request(a_request:GraphRequest):void;\n        function attemptToAuthenticate():void;\n\
    \    }\n}\n```\n\nTest it. What gets traced? A lot of HTML, which (when pasted\
    \ into a blank .html file and opened in a browser) looks like this:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_104_0.png)\n\
    \n> If you get an error, or no data returned at all, load the URL in your browser\
    \ to see what error message is returned. Make sure that all the properties of\
    \ your URLVariables object are set correctly.\n\n## What just happened?\n\nOh,\
    \ right, we need to log in first. But here's a problem: since we're loading the\
    \ URL inside Flash Player, rather than in a browser, we don't have access to the\
    \ browser cookies, so Facebook can't remember who we are and directs us to the\
    \ login page. Of course, since we're not in a browser, we can't actually see the\
    \ page!\n\nWe could write code to create a Flash login form, and post the user's\
    \ e-mail address and password to the real Facebook login form, but why would the\
    \ user trust our application not to hijack their data?\n\n## A different approach\n\
    \nThere are a few ways around this, depending on whether we're using AIR or Flash\
    \ Player. In this chapter, we'll use the simplest method: embedding the SWF in\
    \ a web page and using JavaScript to open the login page and pass the access token\
    \ back to Flash Player.\n\n## Time for action – authenticating via JavaScript\n\
    \nHere's what is going to happen:\n\n- 1. We'll embed our application's SWF in\
    \ a web page, and load the page in a browser.\n- 2. The application will call\
    \ a JavaScript function inside the web page, telling it to load the \"authorize\"\
    \ URL in a new browser window.\n- 3. The new window may ask us to log in; once\
    \ we're authenticated, it'll redirect to the Redirect URI page, just as when we\
    \ used it earlier.\n- 4. This time, however, we'll have changed the Redirect URI\
    \ page to one that we control (rather than using the Google home page). It will\
    \ obtain the access token and pass it back to a JavaScript function in the page\
    \ containing our application's SWF.\n- 5. That JavaScript function will pass the\
    \ access token to an AS3 function in our application, which will then be able\
    \ to use it everywhere.\n\nFor this to work, the web page that Facebook redirects\
    \ us to (in Step 4, containing the SWF) needs to be online. That means we need\
    \ to have a web host. See Chapter 1 for details on setting one up.\n\nPublish\
    \ your project for the web, so that you end up with a web page containing the\
    \ Visualizer SWF – again, the method for doing this is outlined in Chapter 1 –\
    \ and upload it to your host. Let's suppose that the web page is called `index.html`,\
    \ and that you uploaded all the files to `http://host.com/visualizer/`.\n\nLoad\
    \ `http://host.com/visualizer/index.html` in your browser. You'll see, well, nothing\
    \ much, because the application is still set to try to authenticate rather than\
    \ loading any data, and it's failing at that. But if you look in the top-left-hand\
    \ corner, you should see the familiar UI controls: **Zoom In**, **Zoom Out**,\
    \ and **Reset View**. (If you see \"Movie Not Loaded\", check that your HTML page\
    \ is set to load the correct SWF, and that you uploaded all of the files to the\
    \ web host, rather than just `index.html`.)\n\nTo open a new window containing\
    \ the Facebook login page, we need to run this JavaScript code from inside index.html:\n\
    \n```\nwindow.open('https://graph.facebook.com/oauth/authorize?client_id=<your_application_id>&redirect_uri=http://google.com&type=user_agent',\
    \ '<window_name>', 'height=370,width=670');\n```\n\nYou can probably guess what\
    \ the code does, as JavaScript syntax is very similar to ActionScript; it loads\
    \ a pop-up window, with the height, width, and URL specified. The `<window_name>`\
    \ parameter is a value we can use to refer to the window later.\n\nWe could put\
    \ this code inside the HTML of the page. However, rather than risk messing up\
    \ the SWF embedding code (and to make our SWF a little more flexible), we'll use\
    \ ExternalInterface to inject it into the page from our SWF instead.\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_106_0.png)\n\
    \n> The flash.external.ExternalInterface class allows ActionScript code within\
    \ an SWF to communicate with JavaScript code within an HTML page containing that\
    \ SWF. This means that the SWF can call JavaScript methods, and vice-versa.\n\n\
    Open HTTPRequestor.as and import the ExternalInterface class:\n\n```\nimport flash.external.ExternalInterface;\n\
    ```\n\nNow, remove all the code we put in attemptToAuthenticate() earlier, and\
    \ replace it with an ExternalInterface call:\n\n```\npublic function attemptToAuthenticate():void\n\
    {\n    ExternalInterface.call(\"window.open\",\n        \"https://graph.facebook.com/oauth/authorize?client_id=<your_application_id>&type=user_agent&redirect_uri=http://google.com\"\
    ,\n        \"facebookLoginWindow\",\n        \"height=370, width=600\");\n}\n\
    ```\n\nCompile your SWF (avoid testing it in the standalone Flash Player, as it\
    \ won't be able to access ExternalInterface outside of a browser) and upload it\
    \ to your web host, overwriting the previous one. Then, refresh index.html in\
    \ your browser.\n"
  mdcn: "\n## 让我进去！\n\n要了解你的朋友可以通过应用程序访问到关于你的多少信息，请登录 Facebook 网站，依次点击“账户 | 隐私设置”，选择“编辑使用应用程序、游戏和网站的设置”，然后查看“通过你的朋友可访问的信息”设置：\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_102_0.png)\n\n## 这是作弊！\n\n好吧，在浏览器中生成访问令牌，然后直接将其粘贴到源代码中，并不是一种好的认证处理方式。我们需要在应用程序本身中获取访问令牌。\n\
    \n## 动手实践 – 通过应用程序进行认证\n\n在浏览器中进行认证时，我们会访问 `https://graph.facebook.com/oauth/authorize?client_id=<your_application_id>&redirect_uri=http://google.com&type=user_agent`，所以让我们从在代码中加载该\
    \ URL 开始。\n\n首先，在 HTTPRequestor.as 中创建一个新函数 attemptToAuthenticate()：\n\n```\n\
    public function attemptToAuthenticate():void\n{\n    var loader:URLLoader = new\
    \ URLLoader();\n    var urlRequest:URLRequest = new URLRequest();\n\n    var variables:URLVariables\
    \ = new URLVariables();\n\n    urlRequest.url = \"https://graph.facebook.com/oauth/authorize\"\
    ;\n    variables.client_id = \"<your_application_id>\";\n    variables.type =\
    \ \"user_agent\";\n    variables.redirect_uri = \"http://google.com\";\n    urlRequest.data\
    \ = variables;\n\n    loader.addEventListener(Event.COMPLETE, onAuthenticationComplete);\n\
    \    loader.addEventListener(IOErrorEvent.IO_ERROR, onIOError);\n    loader.load(urlRequest);\n\
    }\n```\n\n请确保将 <your_application_id> 替换为你的实际应用程序 ID。\n\n我们使用与加载 Graph 对象时相同的 IO_ERROR\
    \ 处理函数，但需要一个新的函数 onAuthenticationComplete()，用于加载完成后的处理；将其添加到 HTTPRequestor.as\
    \ 中：\n\n```\nprivate function onAuthenticationComplete(a_event:Event):void\n{\n\
    \    trace(\"Authentication complete\");\n    var loader:URLLoader = URLLoader(a_event.target);\n\
    \    trace(loader.data);\n}\n```\n\n这里没什么复杂的；它会输出返回的任何内容。\n\n在 CustomGraphContainerController.as\
    \ 中，让我们修改构造函数，使其启动此认证流程，而不是加载用户配置文件：\n\n```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    _requestor = new HTTPRequestor();\n\
    \    addEventListenersToRequestor();\n    _requestor.attemptToAuthenticate();\n\
    \    //_requestor.request(new GraphRequest(\"<your_user_id>\"));\n}\n```\n\n在此之前，我们需要将该函数添加到\
    \ IRequestor 接口中。将 \\src\\graph\\apis\\base\\IRequestor.as 修改为：\n\n```\npackage\
    \ graph.apis.base\n{\n    import flash.events.IEventDispatcher;\n    import graph.GraphRequest;\n\
    \n    public interface IRequestor extends IEventDispatcher\n    {\n        function\
    \ request(a_request:GraphRequest):void;\n        function attemptToAuthenticate():void;\n\
    \    }\n}\n```\n\n测试一下。会输出什么？会输出大量 HTML，将其粘贴到空白的 .html 文件中并在浏览器中打开后，效果如下：\n\n\
    ![](img/4e826fa36038b86f2087ef8b818d0acf_104_0.png)\n\n> 如果遇到错误，或者根本没有返回数据，请在浏览器中加载该\
    \ URL，查看返回的错误消息。确保 URLVariables 对象的所有属性都设置正确。\n\n## 刚才发生了什么？\n\n哦，对，我们需要先登录。但这里有个问题：由于我们是在\
    \ Flash Player 内加载 URL，而不是在浏览器中，因此无法访问浏览器 Cookie，所以 Facebook 无法记住我们是谁，并将我们重定向到登录页面。当然，由于我们不在浏览器中，我们实际上看不到这个页面！\n\
    \n我们可以编写代码创建一个 Flash 登录表单，并将用户的电子邮件地址和密码提交到真正的 Facebook 登录表单，但用户为什么要相信我们的应用不会劫持他们的数据呢？\n\
    \n## 另一种方法\n\n有几种方法可以解决这个问题，具体取决于我们使用的是 AIR 还是 Flash Player。在本章中，我们将使用最简单的方法：将\
    \ SWF 嵌入网页中，并使用 JavaScript 打开登录页面，然后将访问令牌传回 Flash Player。\n\n## 动手实践 – 通过 JavaScript\
    \ 进行认证\n\n接下来会发生以下步骤：\n\n- 1. 我们将把应用程序的 SWF 嵌入网页中，并在浏览器中加载该页面。\n- 2. 应用程序将调用网页内的\
    \ JavaScript 函数，让它在新的浏览器窗口中加载“授权”URL。\n- 3. 新窗口可能会要求我们登录；一旦认证成功，它将重定向到重定向 URI\
    \ 页面，就像我们之前使用它时一样。\n- 4. 不过，这次我们将把重定向 URI 页面改为我们控制的页面（而不是使用 Google 主页）。该页面将获取访问令牌，并将其传回包含我们应用程序\
    \ SWF 的页面中的 JavaScript 函数。\n- 5. 然后，该 JavaScript 函数会将访问令牌传递给应用程序中的 AS3 函数，之后该函数就可以在任何地方使用它了。\n\
    \n要让这正常工作，Facebook 将我们重定向到的网页（第 4 步中包含 SWF 的页面）必须在线。这意味着我们需要有一个 Web 主机。有关如何设置，请参阅第\
    \ 1 章。\n\n将你的项目发布到 Web，这样最终会得到一个包含 Visualizer SWF 的网页——同样，具体方法在第 1 章中已概述——并将其上传到你的主机。假设该网页名为\
    \ `index.html`，并且你已将所有文件上传到 `http://host.com/visualizer/`。\n\n在浏览器中加载 `http://host.com/visualizer/index.html`。你会看到……嗯，没什么内容，因为应用程序仍然设置为尝试认证，而不是加载任何数据，并且在认证这一步失败了。但如果你看左上角，应该会看到熟悉的\
    \ UI 控件：**放大**、**缩小**和**重置视图**。（如果你看到“Movie Not Loaded”，请检查你的 HTML 页面是否设置为加载正确的\
    \ SWF，以及你是否将所有文件（而不是仅仅 `index.html`）上传到了 Web 主机。）\n\n要打开一个包含 Facebook 登录页面的新窗口，我们需要在\
    \ index.html 中运行以下 JavaScript 代码：\n\n```\nwindow.open('https://graph.facebook.com/oauth/authorize?client_id=<your_application_id>&redirect_uri=http://google.com&type=user_agent',\
    \ '<window_name>', 'height=370,width=670');\n```\n\n你可能已经猜到这段代码的作用了，因为 JavaScript\
    \ 语法与 ActionScript 非常相似；它会加载一个弹出窗口，并指定高度、宽度和 URL。`<window_name>` 参数是一个稍后可以用来引用该窗口的值。\n\
    \n我们可以将这段代码放到页面的 HTML 中。但是，为了避免弄乱 SWF 嵌入代码（并让我们的 SWF 更灵活一些），我们将使用 ExternalInterface\
    \ 从 SWF 中将其注入页面。\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_106_0.png)\n\n> flash.external.ExternalInterface\
    \ 类允许 SWF 中的 ActionScript 代码与包含该 SWF 的 HTML 页面中的 JavaScript 代码进行通信。这意味着 SWF 可以调用\
    \ JavaScript 方法，反之亦然。\n\n打开 HTTPRequestor.as 并导入 ExternalInterface 类：\n\n```\n\
    import flash.external.ExternalInterface;\n```\n\n现在，移除我们之前放在 attemptToAuthenticate()\
    \ 中的所有代码，并将其替换为 ExternalInterface 调用：\n\n```\npublic function attemptToAuthenticate():void\n\
    {\n    ExternalInterface.call(\"window.open\",\n        \"https://graph.facebook.com/oauth/authorize?client_id=<your_application_id>&type=user_agent&redirect_uri=http://google.com\"\
    ,\n        \"facebookLoginWindow\",\n        \"height=370, width=600\");\n}\n\
    ```\n\n编译你的 SWF（避免在独立 Flash Player 中测试，因为它在浏览器之外无法访问 ExternalInterface），并将其上传到你的\
    \ Web 主机，覆盖之前的版本。然后，在浏览器中刷新 index.html。\n\n"
