    \ Compare the above to the result you get if requesting the Facebook Page directly:\n\
    \n```\nhttps://graph.facebook.com/facebook\n{\n  \"id\": \"20531316728\",\n  \"\
    name\": \"Facebook\",\n  \"picture\": \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs624.ash1/27535_20531316728_5553_s.jpg\"\
    ,\n  \"link\": \"http://www.facebook.com/facebook\",\n  \"category\": \"Technology\"\
    ,\n  \"username\": \"facebook\",\n  \"founded\": \"February 4, 2004\",\n  \"company_overview\"\
    : \"«overview»\",\n  \"mission\": \"Facebook's mission is to give people the power\
    \ to share and make the world more open and connected.\",\n  \"fan_count\": 12672338\n\
    }\n```\n\nYou can see that when requesting more than one Graph object at once,\
    \ the objects are jammed together as sub-nodes of a single object, each labeled\
    \ with their ID.\n\nNaturally, you don't have to use Page IDs; you can use the\
    \ ID of any object in the Graph, including Albums, Photos, and Users. What's more,\
    \ you can mix the types of ID you request, so you could request an Event, three\
    \ Users, and a dozen Photos all at once, and they'll be returned in the same JSON.\n\
    \n### Have a go hero – creating a Compound Object based on results from a List\n\
    \nRevisit what we looked at earlier—finding people that posted on your wall on\
    \ your last birthday—but this time, request and render a Compound Object containing\
    \ all of those User objects.\n\nThis is a big challenge: the best place to do\
    \ this is not inside the Visualizer itself, but inside a brand new project. Can\
    \ you create a project from scratch that can do this? Naturally, you can re-use\
    \ any of the useful classes from Visualizer, like the Requestors and the ExtendedPermissions\
    \ class.\n\n## Summary\n\nPaging means splitting a long collection of data into\
    \ multiple smaller components, called Pages. Do not confuse this type of page\
    \ with a Facebook Page Object or a web page.\n\n- The number of records in a page\
    \ can be set using a parameter called `limit`. The default value for `limit` is\
    \ 25.\n- The `offset` parameter can be used to specify the first object in the\
    \ collection that should be returned. The default value for `offset` is 0.\n-\
    \ Pages can be defined by combining `offset` and `limit` parameters – although\
    \ the Graph API is a little unstable on that point at the time of writing.\n-\
    \ The `since` and `until` parameters filter a Graph List to a specified range\
    \ of dates and times.\n- Dates and times can be written in a wide range of formats;\
    \ see http://www.php.net/manual/en/datetime.formats.php for a full list.\n- All\
    \ four parameters – `limit`, `offset`, `since`, and `until` – can be used together\
    \ at the same time.\n- To specify these parameters via a Graph URL, simply pass\
    \ them as URL parameters, or using an instance of the AS3 `URLVariables` class.\n\
    - To specify these parameters via the SDK, include them as properties of an object,\
    \ passed as the third parameter to the `Facebook.api()` function.\n- Graph Lists,\
    \ returned as JSON objects, have a property called `paging`, which contains URLs\
    \ for the next and previous pages of data. These URLs use `since-until` paging,\
    \ rather than `limit-offset`.\n- A **Compound Object** can be obtained using a\
    \ Graph URL of this format: `https://graph.facebook.com/?ids=id1,id2,id3,...`.\
    \ This contains multiple objects in a similar JSON format to a Graph List, but\
    \ with no `data` node.\n\nWe've learned how to dig deeper into the Graph, revealing\
    \ more about Graph Objects and connections whose IDs we already know, but what\
    \ about finding Graph Objects based on their contents, rather than their IDs?\
    \ In the next chapter, we'll learn about searching the Graph to do just that.\n\
    \n## Pop Quiz\n\n1. Why does Facebook split Graph Lists into pages by default,\
    \ rather than just providing all of the data at once whenever it's requested?\n\
    \   a. Facebook only retains the last week's worth of information in its data\
    \ banks\n   b. It's a compromise between speed of access and amount of information\
    \ provided\n   c. Privacy concerns\n2. What do the parameters `limit`, `offset`,\
    \ `since`, and `until` do?\n   a. Allow you to narrow down the results returned\
    \ from a collection\n   b. Restrict user access to a Graph Object for a certain\
    \ time period\n3. When paging, why is it better to use the \"next\" and \"previous\"\
    \ URLs from a Graph List's JSON object, rather than constructing your own URLs\
    \ using `limit` and `offset`?\n   a. Date-based paging gives finer control of\
    \ which posts to request\n   b. Date-based paging means Graph Objects won't be\
    \ missed out between pages\n   c. Date-based paging means Graph Objects won't\
    \ be missed out if created or removed while paging\n\n## Time for action – examining\
    \ quick search results\n\nLog in to Facebook in your browser, type \"test\" into\
    \ the Search bar at the top of the page, and see what appears in the drop-down\
    \ list:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_162_0.png)\n\nNow try a name:\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_163_0.png)\n\n### What just happened?\n\
    \nFacebook uses a smart search for names; notice that when I typed in \"bob\"\
    \ it found results containing \"Bob,\" \"Rob,\" and \"Robert.\" Similarly, if\
    \ you search for \"Jim\" it'll find \"James.\"\n\n(This can be confusing; I was\
    \ scratching my head for a long time trying to find out why searching for \"Liz\"\
    \ listed my friend Beth – whose name is not short for Elizabeth!)\n\nThis isn't\
    \ a wildcard search, though. Searching for \"obert\" won't find you people called\
    \ \"Robert.\"\n\nYou can see from my results that the search results include Groups,\
    \ Applications, and Games, mixed in with fellow users. If I'd picked a different\
    \ search term, the search could have found Events and Pages.\n"
  mdcn: "\n\n由于这些分页链接与 JSON 一起打包，因此与基于 `limit` 和 `offset` 参数自行设计系统相比，它们通常更容易实现。在我们的例子中这并不完全正确，因为我们必须从\
    \ `next` 和 `previous` URL 中提取 `since` 和 `until` 参数，然后将它们传递给 `GraphRequest` 对象——提取集合中最早和最晚的\
    \ Graph 对象日期并使用它们会更容易。\n\n尽管如此，这在你未来从事的其他项目中可能会派上用场，因此值得一提。\n\n## 一次请求多个 ID\n\n\
    本章前面我们学习了如何检索特定日期范围内的一系列墙贴。如何获取撰写这些帖子的人的基本信息？\n\n根据迄今为止所见，显而易见的答案是遍历所有人的所有 ID，并为每个\
    \ ID 请求 User 对象。\n\n这样做是可以的，但有点笨拙，而且我们无法将这些人相互关联。难道不希望我们能一次性在一个列表中全部获取吗？\n\n###\
    \ 动手时间 – 在 Graph URL 中使用 ids 参数\n\n在浏览器中加载以下 URL：\n\n```\nhttps://graph.facebook.com/?ids=facebook,packtpub\n\
    {\n  \"facebook\": {\n    \"id\": \"20531316728\",\n    \"name\": \"Facebook\"\
    ,\n    \"picture\": \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs624.ash1/27535_20531316728_5553_s.jpg\"\
    ,\n    \"link\": \"http://www.facebook.com/facebook\",\n    \"category\": \"Technology\"\
    ,\n    \"username\": \"facebook\",\n    \"founded\": \"February 4, 2004\",\n \
    \   \"company_overview\": \"«overview»\",\n    \"mission\": \"Facebook's mission\
    \ is to give people the power to share and make the world more open and connected.\"\
    ,\n    \"fan_count\": 12672143\n  },\n  \"packtpub\": {\n    \"id\": \"204603129458\"\
    ,\n    \"name\": \"Packt Publishing\",\n    \"picture\": \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs302.ash1/23274_204603129458_7460_s.jpg\"\
    ,\n    \"link\": \"http://www.facebook.com/PacktPub\",\n    \"category\": \"Products_other\"\
    ,\n    \"username\": \"PacktPub\",\n    \"company_overview\": \"«overview»\",\n\
    \    \"fan_count\": 437\n  }\n}\n```\n\n### 发生了什么？\n\n我们一次性将两个 Page 的 ID 传递给 Graph，使用\
    \ ids 参数，它返回了一个包含两者基本信息的 JSON。\n\n所以这是一个列表，对吧？\n\n错了！\n\n好吧，根据我们迄今为止使用的定义，它不是一个列表，因为没有\
    \ data 节点。我称之为复合对象。将其与直接请求 Facebook Page 时得到的结果进行比较：\n\n```\nhttps://graph.facebook.com/facebook\n\
    {\n  \"id\": \"20531316728\",\n  \"name\": \"Facebook\",\n  \"picture\": \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs624.ash1/27535_20531316728_5553_s.jpg\"\
    ,\n  \"link\": \"http://www.facebook.com/facebook\",\n  \"category\": \"Technology\"\
    ,\n  \"username\": \"facebook\",\n  \"founded\": \"February 4, 2004\",\n  \"company_overview\"\
    : \"«overview»\",\n  \"mission\": \"Facebook's mission is to give people the power\
    \ to share and make the world more open and connected.\",\n  \"fan_count\": 12672338\n\
    }\n```\n\n你可以看到，当一次性请求多个 Graph 对象时，这些对象会被挤压成单个对象的子节点，每个节点都以其 ID 标记。\n\n自然地，你不必使用\
    \ Page ID；你可以使用 Graph 中任何对象的 ID，包括相册、照片和用户。更重要的是，你可以混合请求 ID 的类型，因此你可以同时请求一个事件、三个用户和十几张照片，它们会以相同的\
    \ JSON 返回。\n\n### 试试英雄 – 基于列表结果创建复合对象\n\n重温我们之前看到的内容——查找在你上次生日时在你墙上发帖的人——但这次，请求并渲染一个包含所有这些\
    \ User 对象的复合对象。\n\n这是一个很大的挑战：最好的做法不是在 Visualizer 本身内部完成，而是在一个全新的项目内部完成。你能从头创建一个可以做到这一点的项目吗？自然地，你可以重用\
    \ Visualizer 中的任何有用类，比如 Requestors 和 ExtendedPermissions 类。\n\n## 总结\n\n分页意味着将长数据集合拆分为多个较小的组件，称为页面。不要将这种类型的页面与\
    \ Facebook 页面对象或网页混淆。\n\n- 页面中的记录数可以使用名为 `limit` 的参数设置。`limit` 的默认值是 25。\n- `offset`\
    \ 参数可用于指定应返回的集合中的第一个对象。`offset` 的默认值是 0。\n- 页面可以通过组合 `offset` 和 `limit` 参数来定义——尽管在撰写本文时\
    \ Graph API 在这一点上有点不稳定。\n- `since` 和 `until` 参数将 Graph 列表过滤到指定的日期和时间范围。\n- 日期和时间可以用多种格式书写；请参阅\
    \ http://www.php.net/manual/en/datetime.formats.php 获取完整列表。\n- 四个参数——`limit`、`offset`、`since`\
    \ 和 `until`——可以同时一起使用。\n- 要通过 Graph URL 指定这些参数，只需将它们作为 URL 参数传递，或使用 AS3 `URLVariables`\
    \ 类的实例。\n- 要通过 SDK 指定这些参数，将它们作为对象的属性包含在内，作为传递给 `Facebook.api()` 函数的第三个参数。\n- 作为\
    \ JSON 对象返回的 Graph 列表有一个名为 `paging` 的属性，其中包含下一页和上一页数据的 URL。这些 URL 使用 `since-until`\
    \ 分页，而不是 `limit-offset`。\n- 可以使用以下格式的 Graph URL 获得 **复合对象**：`https://graph.facebook.com/?ids=id1,id2,id3,...`。它包含多个对象，其\
    \ JSON 格式与 Graph 列表类似，但没有 `data` 节点。\n\n我们已经学习了如何深入挖掘 Graph，揭示我们已知其 ID 的 Graph\
    \ 对象和连接的更多信息，但如果要根据其内容而不是其 ID 来查找 Graph 对象呢？在下一章中，我们将学习如何搜索 Graph 来做到这一点。\n\n\
    ## 快速测验\n\n1. 为什么 Facebook 默认将 Graph 列表拆分为页面，而不是在每次请求时一次性提供所有数据？\n   a. Facebook\
    \ 仅在数据银行中保留最近一周的信息\n   b. 这是在访问速度和提供的信息量之间的一种折中\n   c. 隐私问题\n2. 参数 `limit`、`offset`、`since`\
    \ 和 `until` 有什么作用？\n   a. 允许你缩小从集合返回的结果范围\n   b. 在特定时间段内限制用户对 Graph 对象的访问\n3.\
    \ 在分页时，为什么使用 Graph 列表 JSON 对象中的“next”和“previous”URL 比使用 `limit` 和 `offset` 构建自己的\
    \ URL 更好？\n   a. 基于日期的分页可以更精细地控制要请求的帖子\n   b. 基于日期的分页意味着 Graph 对象不会在页面之间遗漏\n \
    \  c. 基于日期的分页意味着如果在分页期间创建或删除 Graph 对象，也不会遗漏\n\n## 动手时间 – 检查快速搜索结果\n\n在浏览器中登录 Facebook，在页面顶部的搜索栏中输入“test”，看看下拉列表中出现了什么：\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_162_0.png)\n\n现在试试一个名字：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_163_0.png)\n\
    \n### 发生了什么？\n\nFacebook 对名字使用智能搜索；注意当我输入“bob”时，它找到了包含“Bob”、“Rob”和“Robert”的结果。同样，如果你搜索“Jim”，它会找到“James”。\n\
    \n（这可能会让人困惑；我花了很长时间挠头试图弄明白为什么搜索“Liz”会列出我的朋友 Beth——她的名字并不是 Elizabeth 的简称！）\n\n\
    这不是通配符搜索。搜索“obert”不会找到名为“Robert”的人。\n\n从我的结果可以看出，搜索结果包括群组、应用程序和游戏，与其他用户混合在一起。如果我选择了不同的搜索词，搜索也可能找到事件和页面。\n\
    \n"
