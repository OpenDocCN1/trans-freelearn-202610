    \ onHTTPStatusReturned);\nloader.addEventListener(SecurityErrorEvent.SECURITY_ERROR,\
    \ onSecurityError);\nloader.load(urlRequest);\n}\n```\n\n...but we can easily\
    \ tell Facebook to treat it as a DELETE request by passing a new parameter—method=delete:\n\
    \n```\npublic function deleteObject(a_objectID:String):void\n{\nvar loader:URLLoader\
    \ = new URLLoader();\nvar urlRequest:URLRequest = new URLRequest();\nvar variables:URLVariables\
    \ = new URLVariables();\n\nurlRequest.url = \"https://graph.facebook.com/\";\n\
    urlRequest.url += a_objectID;\nurlRequest.method = URLRequestMethod.POST;\n\n\
    if (this.accessToken != \"\")\n{\n    variables.access_token = this.accessToken;\n\
    }\nvariables.method = \"delete\";\nurlRequest.data = variables;\n\nloader.addEventListener(Event.COMPLETE,\
    \ onDeleteComplete);\nloader.addEventListener(IOErrorEvent.IO_ERROR, onIOError);\n\
    loader.addEventListener(HTTPStatusEvent.HTTP_STATUS,\n    onHTTPStatusReturned);\n\
    loader.addEventListener(SecurityErrorEvent.SECURITY_ERROR,\n    onSecurityError);\n\
    loader.load(urlRequest);\n}\n```\n\nThis works just as well as the AIR version,\
    \ and only costs us one extra line of code.\n\nTo delete an object using the SDK,\
    \ we could use `Facebook.api()`, but there's a shortcut method: `Facebook.deleteObject()`.\
    \ This takes two parameters—the ID of the Graph Object to delete, and a callback\
    \ function. This makes the required code very simple; add this to SDKRequestor.as:\n\
    \n```\npublic function deleteObject(a_objectID:String):void\n{\n    Facebook.deleteObject(a_objectID,\
    \ deleteComplete);\n}\n\nprivate function deleteComplete(result:Object, fail:Object):void\n\
    {\n    if (result != null)\n    {\n        dispatchEvent(new DialogEvent(DialogEvent.DIALOG,\
    \ \"Deleted!\"));\n    }\n    else\n    {\n        dispatchEvent(new DialogEvent(DialogEvent.DIALOG,\n\
    \            \"Deletion failed. Details: \" + String(fail)));\n    }\n}\n```\n\
    \nCompile, upload, and test the new changes by deleting one of your posts from\
    \ your Wall.\n\n## What just happened?\n\nYou should have seen a Wall post get\
    \ deleted from Facebook.\n\n> Stop Press: Shortly before this book was published,\
    \ Facebook appeared to change the Graph API so that Wall posts could only be deleted\
    \ by an application if that application was used to publish them in the first\
    \ place. Previously, it was possible to delete any posts on the logged-in user's\
    \ Wall, as well as any posts made by the user on other Walls. At the time of this\
    \ writing, the official Graph API documentation does not mention this restriction.\
    \ So, if you're having problems deleting posts, try creating one through the Visualizer\
    \ first, and then deleting that.\n\nOnce again this requires only the `publish_stream`\
    \ extended permission; by now you should have a good idea of how powerful this\
    \ permission is. You can use the same code to delete other kinds of Graph Object,\
    \ not just posts. If your application has permission to modify or create an object,\
    \ it has permission to delete it, too.\n\nIf you try to delete a post through\
    \ the Facebook website, it will ask for confirmation:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_235_0.png)\n\
    \nThis is a good idea, and worth using for the interface of your own projects.\
    \ The Visualizer doesn't ask for confirmation, and doesn't even remove the Post\
    \ from the List Renderer once deleted—though this does let you see what happens\
    \ if you try to remove a Post that's already been deleted...\n\n## Publishing\
    \ other kinds of Graph Object\n\nAll the types of Graph Object that can be created\
    \ can be created with the same basic steps as a Wall Post:\n\n- Use `POST HTTP`\
    \ request method\n- Set parameters with a `URLVariables` object\n- Make sure that\
    \ you have an access token and the required permissions\n\nThe Graph List Renderer's\
    \ Publish button always creates a window with inputs that are appropriate to the\
    \ Graph List being rendered, and this in turn always passes its values to the\
    \ `publish()` function of `CustomGraphContainerController`, inside a `PublishObject`\
    \ instance, so you can experiment with the different types.\n\nThe user will also\
    \ receive e-mails and notifications whenever someone comments on that post. It's\
    \ like a mini-subscription, as well as a sign of approval.\n\nThe URL to request\
    \ is:\n\n```\nhttps://graph.facebook.com/<post_id>/likes\n```\n\nThere are no\
    \ possible parameters.\n\nLikes require the `publish_stream` permission.\n\n##\
    \ What about \"liking\" other Graph Objects?\n\nIn Chapter 2, we looked at how\
    \ \"like\" connections joined people to TV shows, movies, music, interests, and\
    \ activities; the \"like\" connection is responsible for many of the strands in\
    \ the Graph's Web. Yet, the Graph API will not allow us to \"like\" anything other\
    \ than posts (even trying to like a comment will result in an HTTP Status Code\
    \ 500).\n\nFacebook has said that they have no plans to allow developers to create\
    \ \"likes\" for anything else. It seems their aim is to make sure no user ever\
    \ clicks an unofficial \"like\" button (or at least, a \"like\" button in a context\
    \ that Facebook hasn't approved; Yelp.com has its own design of \"like\" button,\
    \ as they are a partner site to Facebook).\n\nSo, unfortunately, it's not possible\
    \ to alter the user's television, movies, interests, or activities through the\
    \ Graph API.\n\n## Deleting Likes\n\nLikes don't have their own ID, so we can't\
    \ delete a like by attempting to delete https://graph.facebook.com/<like_id>.\
    \ Instead, we must use this URL: https://graph.facebook.com/<graph_object_id>/likes.\n\
    \nAs you know, this is the Graph URL for a connection, which would return a Graph\
    \ List if we tried to load it in a browser. However, when we try to delete the\
    \ URL using the process described in the Deleting Graph Objects section, it will\
    \ make the authorized user \"unlike\" the Graph Object.\n"
