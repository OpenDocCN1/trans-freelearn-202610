  - "[PAGE 55]\n\nI've created a second renderer: this time, a Graph List Renderer.\
    \ I've also created a class graph.GraphList. And CustomGraphContainerController\
    \ inherits a method called renderGraphList(). Perhaps unsurprisingly, this takes\
    \ an object of type graph.GraphList as a parameter, and creates a new Graph List\
    \ Renderer to display its contents. So, we need to take a Graph List that we receive\
    \ from the Graph API, and turn it into an instance of the GraphList class. The\
    \ GraphList class is a little more sophisticated than the GraphObject class; it\
    \ has a method called addToList(), to which we can pass any GraphObject instance\
    \ to be added to the list.\n\nWe'll still loop through the data array, then, but\
    \ instead of rendering each GraphObject on its own, we'll add each one to a GraphList\
    \ and render that.\n\nModify the URL that CustomGraphContainerController requests,\
    \ so that it loads the list of posts:\n\n```\npublic function CustomGraphContainerController\n\
    \    (a_graphControlContainer:GraphControlContainer)\n{\n    super(a_graphControlContainer);\n\
    \n    var loader:URLLoader = new URLLoader();\n    var request:URLRequest = new\
