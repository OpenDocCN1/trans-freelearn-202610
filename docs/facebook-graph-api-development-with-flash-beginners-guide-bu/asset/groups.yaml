    # Acknowledgement


    I''d like to thank my Dad, for teaching me how to be technical; my Mum, for teaching
    me how to write; and my little sister, for not being too jealous that I beat her
    to being a published author.


    I also want to thank Ryan Henson Creighton, for inadvertently introducing me to
    David Barnes; all the Flash developers that make up the awesome community I''m
    happy to be a part of, particularly Bram, Ryan, Rasmus, Jeff and Steve, and Daniel;
    Tom, for letting me use his tutorial as a template for my first (and still most
    popular!) piece of writing; Ian Yates and the rest of Envato™, for enabling me
    to keep working and earning a living while writing this book; Keith Peters, for
    providing the awesome MinimalComponents I used throughout this book; and everyone
    that''s ever commented on anything I''ve written – I really appreciate that.


    Finally, I must express my appreciation for and thanks to David, Vishal, Hyacintha,
    Paramanand, Priya, Namita, and everyone else at Packt Publishing for all their
    support, help, and hard work. I know I can be stubborn, but it''s been a pleasure
    to work with you all. In particular, thank you to David, who not only approved
    this book in the first place, but also gave me a huge amount of guidance in all
    aspects of writing it. And of course, I have to thank Emanuele, not just for doing
    the technical review of this book, but also for his blog, which (by a funny turn
    of events) was one of my key inspirations to start writing about Flash in the
    first place.'
