    }\n```\n\nThe first thing we'll do is grab the Graph API's representation of Packt\
    \ Publishing's Page via a Graph URL, like we did using the web browser. For this\
    \ we can use a `URLLoader`.\n\n> The `URLLoader` and `URLRequest` classes are\
