    ## Have a go hero – creating your application''s profile page


    Browse to your list of applications inside the Developers application, select
    your application from the list, and click on **Application Profile Page**.


    ![](img/4e826fa36038b86f2087ef8b818d0acf_300_0.png)


    The **Get started** tab will guide you through setting everything up with a profile
    picture, status updates, and basic information. Remember your main aim is to get
    people to click the **Go to application** button!


    ## 类风湿性关节炎


    类风湿性关节炎是一种以关节滑膜慢性炎症为特征的自身免疫性疾病。常表现为对称性多关节炎，可导致关节软骨和骨破坏。


    **临床表现**：多见于女性。早期表现为晨僵、关节肿痛，常累及近端指间关节、掌指关节和腕关节；晚期可出现关节畸形。


    - 关节外表现：类风湿结节、间质性肺病、血管炎。

    - 实验室检查：类风湿因子阳性、抗CCP抗体阳性、血沉增快、CRP升高。


    **诊断**：主要依据临床表现、实验室检查和影像学检查。


    | 药物 | 用法 |

    | --- | --- |

    | 甲氨蝶呤 | 7.5-25 mg，每周1次 |

    | 柳氮磺吡啶 | 0.75-3 g/d |

    | 羟氯喹 | 0.2-0.4 g/d |


    **治疗**：应尽早使用改善病情抗风湿药，同时注意监测药物不良反应。


    > > 早期诊断和规范治疗是改善类风湿性关节炎预后的关键。


    ## Test users


    The Facebook policies prevent anyone from creating multiple user accounts. However,
    it''s now possible to create up to 50 user accounts specifically for the purpose
    of testing an application, using the Graph API.


    For more information, see http://developers.facebook.com/docs/test_users.


    ## The New Messages


    In November 2010, Facebook announced their highly-anticipated "Gmail killer,"
    the new Messages. This allows users to combine messages, texts, chats, and emails
    into a single conversation thread, for cross-platform communication.


    The Graph API and FQL will be able to be used to access these messages, through
    a new connection called /thread/.


    For more information, see the documentation at http://developers.facebook.com/docs/reference/api/thread.


    ## Facebook developer resources


    Here are some excellent websites for your browser bookmarks and RSS readers.


    ## Official Facebook resources


    - ♦ The central source of information for all Facebook developers is http://developers.facebook.com/.
    From here you can access the massive set of documentation, which covers every
    part of the APIs, as well as the (very active) developer forums, where you can
    discuss application development with others.

    - ♦ You can also check the current status of the Facebook Platform through the
    Platform live status page: http://developers.facebook.com/live_status. If something
    is going wrong with your application and you can''t see any cause on your side,
    check this page to see whether the problem lies with Facebook.

    - ♦ You should also be aware of the Facebook Platform Bug Tracker: http://bugs.developers.facebook.net/.
    Since changes are made to the platform very frequently, a few bugs pop up here
    and there. This bug tracker helps you to bring bugs to the attention of the Facebook
    administrators; it can also be used to figure out if an issue you''re having is
    a common bug.


    ## Other great websites


    The entire InsideNetwork (http://www.insidenetwork.com/) is invaluable reading
    for Facebook developers. It consists of:


    - Inside Facebook: http://www.insidefacebook.com/ – news about Facebook and the
    Facebook Platform

    - AppData: http://www.appdata.com/ – analysis of metrics and traffic trends for
    Facebook applications

    - PageData: http://pagedata.insidefacebook.com/ – like AppData, but for Facebook
    Pages rather than applications

    - Inside Virtual Goods: http://www.insidevirtualgoods.com/ – research, data, and
    analysis regarding virtual goods (will be particularly relevant once Facebook
    Credits go public)

    - Inside Social Games: http://www.insidesocialgames.com/ – news and analysis of
    the growing social games market (including Facebook games)


    Another great blog about Facebook game development is Facebook Indie Games: http://fbindie.posterous.com/.


    As you read more and more of these sites, you''ll come across all sorts of terms
    and acronyms that you may not recognize, like DAU, MAU, and K Factor. Wavedash.net
    has provided a useful reference for what many of these terms mean: http://www.wavedash.net/2010/04/the-secret-glossary-of-social-games-analytics/.


    The blog "Cognition.ca" does not contain many posts on Facebook development, but
    it does have two that I found very useful:


    - http://www.cognition.ca/2007/11/using-ssh-tunnels-to-develop-facebook-applications.html

    - http://www.cognition.ca/2008/02/facebook-application-development-how-to-11-tips-you-dont-want-to-miss.html


    Check out the comments on the latter post as well. Although some of the information
    is out-of-date, there''s some really great advice about setting up a test version
    of your application so that you don''t push untested changes to your live version.


    In Chapter 6 I mentioned that Facebook won''t allow you to "like" Graph objects
    (apart from posts) through anything other than the official Facebook Like Button.
    Well, that''s not entirely true – the team at Hook seem to have cracked it. See
    this blog post for more details (but remember that Facebook don''t want you to
    do this, so there''s no guarantee this will work forever): http://labs.byhook.com/2010/08/03/facebook-like-button-in-flash/.


    ## Me, me, me


    My website is http://michaeljameswilliams.com/. Through there, you can find my
    blog of Flash game development tutorials, and get in contact if you want to ask
    any questions or hire me. I post on Twitter as @MichaelJW.


    I''m also editor of http://active.tutsplus.com/, which publishes Flash tutorials
    on subjects including Facebook application development.


    Yes, I''m on Facebook, but no, I probably won''t add you – sorry! I like to keep
    my friends list pared down to people I know in real life. (Is that ironic?) However,
    you can connect to me through my public Page: http://www.facebook.com/pages/Michael-James-Williams/16957343058884–
    drop me a note and let me know what you thought of the book!


    ## Keeping up with the Zuckerbergs


    Facebook are always making changes and improvements to the service. Things change;
    as a developer you must deal with this.


    More importantly, you must accept this. Every time Facebook announces a new feature,
    the removal of an old feature, or a change to an existing feature, developers
    rise up and complain that this is going to cripple their application, push them
    way back on schedule, and make them lose huge amounts of revenue and users.


    It''s fine to be vocal, but at some point it becomes denial. If you''ve been using
    the Facebook website for any length of time, you''ll know that they will happily
    make big, sweeping changes – like the introduction of the News Feed, and the removal
    of Tabs and Boxes on user profiles – and stick with them despite complaints from
    users. And usually, their instincts in what will make the site better are right.


    No surprise, then, that the same is true with the APIs. Maybe this isn''t fair
    to developers, but it''s not likely to change. So remember, as you build your
    project, that if it relies too much on one single feature of the Graph API (or
    the Facebook interface, or the data available), then you''re in danger of having
    the rug swept out from under your feet. Remember to work out a pricing structure
    with your clients so that when changes need to be made to their project''s Facebook
    integration code a few months later, you aren''t contracted to do it for free.


    Fortunately for you, your knowledge of the Graph API is based on core concepts,
    not on specific implementations. You understand the Graph itself, rather than
    just how to copy and paste snippets of Facebook-related AS3 code. This means you''ll
    be able to cope with anything new.


    ## Dealing with change


    Keep an eye on these two pages:


    - Facebook Developer Blog: http://developers.facebook.com/blog/

    - Facebook Developer Roadmap: http://developers.facebook.com/roadmap


    The blog announces changes relevant to developers, and the roadmap gives a brief
    summary of these upcoming changes.


    In general, new changes are announced weeks or even months before they are implemented.
    Often, you''ll be able to enable the changes in your application some time before
    the migration is forced upon you, which is useful for testing alterations you
    need to make to your code.


    Now go and read the blog''s archives dating from November 2010 onwards (the date
    when this book was completed), and then subscribe to it to receive regular updates.
    This way, you''ll stay up-to-date.


    ## Summary


    In this chapter, we looked at how to move beyond the technical issues onto the
    practical ones, and where to go from here. All that''s left is for you to go and
    make some fantastic Facebook applications!


    I wish you the best of luck with your development. From me, and everyone else
    involved in this book, thanks for reading! I hope you''ve found it useful. And
    please let me know about any Facebook applications or games you develop – I''d
    love to see them.

