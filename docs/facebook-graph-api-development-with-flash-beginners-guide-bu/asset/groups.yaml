    I''ll assume that you roughly know how the Internet works: when you type a URL
    into a web browser on your computer and hit **Go**, it retrieves all the pages
    and images it needs from another computer, the **web server**, and displays them.
    The exact methods it uses to find the web server and the protocols for how the
    information gets back to your computer aren''t relevant here.'
