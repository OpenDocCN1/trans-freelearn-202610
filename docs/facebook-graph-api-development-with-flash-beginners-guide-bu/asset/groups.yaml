  - "[PAGE 83]\n\nThis page is split into two main sections: **Basic directory information**\
    \ and **Sharing on Facebook**. Take some time to dig in to these and see what\
    \ information can be viewed by whom. You might be surprised at how much information\
    \ about you is available to anyone who cares to look.\n\nWhile customizing your\
    \ settings in either of those pages, you can click on **Preview my Profile** to\
    \ see how your profile will look when viewed by any person you specify.\n\nA few\
    \ pieces of information are always viewable by anyone who's logged in: your name,\
    \ your gender, your profile picture, and your list of networks. Access to everything\
    \ else can be modified.\n\n# What's that got to do with the Graph API?\n\nThat's\
    \ all good to know, but does it affect our application?\n\nTry accessing the profiles\
    \ of all the people you just looked at through their Graph URLs. Remember, if\
    \ their Facebook URL is http://www.facebook.com/username, their Graph URL will\
    \ be https://graph.facebook.com/username; if their Facebook URL is http://www.facebook.com/profile.php?id=12345678,\
    \ their Graph URL will be https://graph.facebook.com/12345678.\n\nYou'll notice\
    \ that the only information you can see is:\n\n+   ◆ Name (and separate fields\
    \ for first name, last name, and so on)\n+   ◆ Profile picture (through https://graph.facebook.com/id/picture)\n\
    +   ◆ Gender\n\nAll this information is publicly available. This is true even\
    \ if you can see extra information on their profile page when logged out.\n\n\
    The Graph API can't detect whether we're logged in to Facebook in another browser\
    \ window, so everything we see here is through the eyes of a logged-out user.\n\
    \nFor instance, here's what my page looks like as shown in the following lines\
    \ of code:\n\n```\n{\n  \"id\": \"«redacted»\",\n  \"name\": \"Michael James Williams\"\
    ,\n  \"first_name\": \"Michael\",\n  \"middle_name\": \"James\",\n  \"last_name\"\
    : \"Williams\",\n  \"gender\": \"male\",\n  \"locale\": \"en_GB\"\n}\n```"
  - "[PAGE 84]\n\nAnd although you can see a list of connections URLs by adding metadata=1\
    \ to the URL, trying to access any of them leads to this error:\n\n```\n{\n  \"\
    error\": {\n    \"type\": \"OAuthAccessTokenException\",\n    \"message\": \"\
    An access token is required to request this resource.\"\n  }\n}\n```\n\nBut what\
    \ is an access token?\n\n# Access tokens are proof of authorization\n\nImagine\
    \ a secure building. To get in through the front door, you need to provide the\
    \ doorman with your passport, your driver's license, and your social security\
    \ number – just to prove who you are. Once he's satisfied, he gives you a temporary\
    \ pass, with your name on it, to clip to your jacket.\n\nInside the building,\
    \ everybody trusts the pass. You don't need to risk showing them your important\
    \ personal documents; those only get seen by the doorman.\n\nAn access token is\
    \ like that pass. Facebook gives a logged-in user a string of characters, which\
    \ says, \"I am this person, and I have logged in,\" and this string can be passed\
    \ as a parameter to a Graph URL to gain access to information that the user is\
    \ permitted to see.\n\nExcept, that's not the whole story.\n\n# User/Application\
    \ authorization\n\nThere are actually two authorizations required: the user's\
    \ and the application's. It works like this:\n\nJoe User tries to do something\
    \ in Bill's Cool Application that requires the application to access some of Joe's\
    \ restricted information. The application can't access it, so the two of them\
    \ approach Facebook via the Graph API.\n\nThe application says, \"Hey Facebook,\
    \ I'm Bill's Cool Application, and I want to access Joe User's data.\""
