    ,\n\"source\": \"http://sphotos.ak.fbcdn.net/hphotos-ak-snc3/hs185.snc3/19239_307944374458_204603129458_4527791_8102041_n.jpg\"\
    ,\n\"height\": 666,\n\"width\": 540,\n\"link\": \"http://www.facebook.com/photo.php?pid=4527791&id=204603129458\"\
    ,\n\"icon\": \"http://static.ak.fbcdn.net/rsrc.php/z2E5Y/hash/8as8iqdm.gif\",\n\
    \"created_time\": \"2010-02-04T12:40:07+0000\",\n\"updated_time\": \"2010-03-18T16:08:42+0000\"\
    \n}\n],\n\"paging\": {\n\"previous\": \"https://graph.facebook.com/307932939458/photos?limit=25&since=2010-03-18T16%3A00%3A38%2B0000\"\
    ,\n\"next\": \"https://graph.facebook.com/307932939458/photos?limit=25&until=2010-02-04T12%3A40%3A06%2B0000\"\
    \n}\n}\n```\n\nSee that node called `paging`? It obviously contains two URLs,\
    \ though they seem to have some junk attached to the end of them. Actually, it's\
    \ not junk; it's just URL-encoded. Here's how the previous URL looks when decoded:\n\
    \n```\nhttps://graph.facebook.com/307932939458/photos?limit=25&since=2010-03-18T16:00:38+0000\n\
    ```\n\nIt's clearly a date with a timestamp, passed to a `since` parameter, just\
    \ like we've been using.\n\nFacebook provides these as an easier alternative to\
    \ the offset/limit-based paging we explored earlier in the chapter. Paging based\
    \ on time makes a lot more sense than paging based on the item's position in a\
    \ list (as we explored before), because the date and time that an item was created\
    \ will never change, while the item's position in a list will change whenever\
    \ a new item is added to that list.\n\nIt's true that items being deleted could\
    \ cause problems: if we've already downloaded the item then we may not detect\
    \ that it's gone, leaving us with incorrect data. Even if we do a double-check\
    \ and remove it, it's going to leave a gap, meaning that the page of items that\
    \ used to contain it will be shorter than the other pages. Whether these are serious\
    \ problems depends on the application.\n"
  mdcn: "\n\n## 深入挖掘图\n\n另外，请注意，“30天或50条帖子”的限制似乎在这里不适用，因为这篇帖子比一年还要老，而此后发布的帖子远不止50条。\n\
    \n不幸的是，这就是使用 Graph URL 分页时的情况，至少目前是这样。有时它按预期工作，但有时它会表现出奇怪而神秘的行为，正如我们所见的。同样，很可能等你读到本文时所有问题都已解决——但以防万一没有，在围绕\
    \ Graph URL 分页设计项目时请谨慎。\n\n**在它能正常工作的情况**下，`until` 参数可以接受多种不同的日期格式：\n\n- 31march2009\n\
    - May-4th-2010\n- 2010-12-25\n- Yesterday\n- First Monday of September 2009\n\
    - 12 days ago\n- -7 weekdays\n\n你也可以指定时间：\n\n- 31march2009 15:10\n- May-4th-2010\
    \ noon\n- 2010-12-25T08:00:00\n- 12 days ago 8pm\n- Today 7:30AM\n\n完整的格式列表可在以下地址找到：\
    \ http://www.php.net/manual/en/datetime.formats.php。\n\n> **记住：** URL 不喜欢 + 等字符（甚至空格也不行），所以在将\
    \ URL 传递给 URLRequest 之前，请务必对其进行编码。你可以使用 AS3 内置的 `escape()` 方法来实现：\n>\n> ```\n\
    > var urlEncodedString:String = escape(unencodedURL);\n> ```\n>\n> 有关更多信息，请查看\
    \ escape() 的 LiveDocs 页面：\n> http://www.adobe.com/livedocs/flash/9.0/ActionScriptLangRefV3/package.html#escape()。\n\
    \n因此，`until` 参数让我们可以指定按其过滤数据的最新日期和时间；它还有一个姐妹参数让我们可以指定最早的日期：`since`。它以完全相同的方式工作，并允许完全相同的日期和时间格式。\n\
    \n> 要请求 Facebook 页面从 2010 年 4 月 21 日（Graph API 发布的日子）开始的帖子，我们将使用此 URL：\n> `https://graph.facebook.com/facebook/photos?since=21april2010T00:00:01&until=21april2010T23:59:59`\n\
    >\n> 如果当天有超过 25 条帖子，那么我们甚至可以在 `since` 和 `until` 旁边使用 `offset` 和 `limit` 来将该列表拆分为更小的页面。\n\
    >\n> 该确切的 URL 不会返回任何数据（因为它已超过 30 天），但此示例展示了你必须使用的格式。\n\n好了，让我们将其集成到我们的应用程序中。\n\
    \n### 行动时间 – 为 GraphRequest 实例添加 since 和 until\n\n允许我们对 `GraphRequest` 实例使用 `since-until`\
    \ 的过程几乎与允许我们使用 `limit-offset` 的过程相同。\n\n1. 按以下代码所示向 `GraphRequest.as` 添加 `since`\
    \ 和 `until` 字符串属性：\n\n   ```\n   package graph\n   {\n       public class GraphRequest\n\
    \       {\n           public var objectID:String = \"\";\n           public var\
    \ connectionID:String = \"\";\n           public var limit:int = 25;\n       \
    \    public var offset:int = 0;\n           public var since:String = \"\";\n\
    \           public var until:String = \"\";\n\n           public function GraphRequest(a_objectID:String\
    \ = \"\",\n               a_connectionID:String = \"\")\n           {\n      \
    \         this.objectID = a_objectID;\n               this.connectionID = a_connectionID;\n\
    \           }\n       }\n   }\n   ```\n\n2. 在 `HTTPRequestor.as` 中，根据这些新字符串设置\
    \ URLVariables 对象的属性：\n\n   ```\n   public function request(a_request:GraphRequest):void\n\
    \   {\n       var loader:URLLoader = new URLLoader();\n       var urlRequest:URLRequest\
    \ = new URLRequest();\n       var variables:URLVariables = new URLVariables();\n\
    \n       //We construct a URL from the parameters of the GraphRequest\n      \
    \ urlRequest.url = \"https://graph.facebook.com/\" +\n           a_request.objectID;\n\
    \       if (a_request.connectionID)\n       {\n           //remember, this means\
    \ a connection (and thus a list)\n           //was requested\n           urlRequest.url\
    \ += \"/\" + a_request.connectionID;\n       }\n\n       variables.metadata =\
    \ 1;\n       variables.limit = a_request.limit;\n       variables.offset = a_request.offset;\n\
    \       variables.since = a_request.since;\n       variables.until = a_request.until;\n\
    \       if (accessToken != \"\")\n       {\n           variables.access_token\
    \ = accessToken;\n       }\n       urlRequest.data = variables;\n\n       //this\
    \ is used to figure out which GraphRequest created the\n       //loader later\n\
    \       _requests[loader] = a_request;\n\n       loader.addEventListener(Event.COMPLETE,\n\
    \           onGraphDataLoadComplete);\n       loader.addEventListener(IOErrorEvent.IO_ERROR,\
    \ onIOError);\n       loader.load(urlRequest);\n   }\n   ```\n\n3. 修改 `SDKRequestor.as`\
    \ 中 `request()` 函数内传递给 `Facebook.api()` 方法的第三个参数：\n\n   ```\n   public function\
    \ request(a_request:GraphRequest):void\n   {\n       this._showListFilters = true;\n\
    \n       _requestor = new HTTPRequestor();\n       addEventListenersToRequestor();\n\
    \       //we must wait for the Requestor to initialise before we can do\n    \
    \   //anything else with it\n       _requestor.addEventListener(Event.COMPLETE,\n\
    \           onRequestorInitialize);\n\n       _requestor.initialize();\n   }\n\
    \   ```\n\n4. 保存、编译并上传你的项目，然后打开任何连接以创建列表渲染器。 （如果结果不多，请删除 `onRequestorInitialize()`\
    \ 中设置特定 `since-until` 或 `limit-offset` 值的行。）\n\n   ![](img/4e826fa36038b86f2087ef8b818d0acf_150_0.png)\n\
    \n5. 点击上一个屏幕截图中所示的新过滤栏上的显示按钮。\n\n   ![](img/4e826fa36038b86f2087ef8b818d0acf_151_0.png)\n\
    \n6. 此新面板允许你输入用于 `since-until` 过滤的日期。\n\n7. 在框中输入任何日期和时间，或使用 C 按钮调出日历控件以代替使用。\n\
    \n8. 当用户在此面板中点击过滤按钮时，它会调用 `CustomGraphContainerController` 扩展的类中的受保护函数 `listFilterCallback()`，并将输入的日期和列表渲染器所代表的\
    \ Graph 对象和连接的 ID 传递给它。\n\n这意味着 `CustomGraphContainerController` 继承了该函数，因此我们可以让它使用这些日期为此\
    \ Graph 对象和连接创建一个新的 `GraphRequest`。\n\n9. 因此，打开 `CustomGraphContainerController.as`\
    \ 并重写该函数：\n\n   ```\n   override protected function listFilterCallback(a_objectID:String,\
    \ a_connectionType:String, a_since:String, a_until:String):void\n   {\n      \
    \ super.listFilterCallback(a_objectID, a_connectionType, a_since, a_until);\n\
    \   }\n   ```\n\n继承的函数只是一个存根——它什么也不做。\n\n10. 现在，使用参数中传递的信息创建并使用一个新的 `GraphRequest`：\n\
    \n    ```\n    override protected function listFilterCallback(a_objectID:String,\
    \ a_connectionType:String, a_since:String, a_until:String):void\n    {\n     \
    \   super.listFilterCallback(a_objectID, a_connectionType, a_since, a_until);\n\
    \        var filterRequest:GraphRequest = new GraphRequest(a_objectID, a_connectionType);\n\
    \        filterRequest.since = a_since;\n        filterRequest.until = a_until;\n\
    \        _requestor.request(filterRequest);\n    }\n    ```\n\n11. 编译并上传 SWF，然后通过在过滤面板中输入两个日期并点击过滤按钮来测试更改。\n\
    \n### 发生了什么？\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_152_0.png)\n\n```\n\"\
    picture\": \"http://photos-c.ak.fbcdn.net/hphotos-ak-snc3/hs185.snc3/19239_307944374458_204603129458_4527791_8102041_s.jpg\"\
    ,\n\"source\": \"http://sphotos.ak.fbcdn.net/hphotos-ak-snc3/hs185.snc3/19239_307944374458_204603129458_4527791_8102041_n.jpg\"\
    ,\n\"height\": 666,\n\"width\": 540,\n\"link\": \"http://www.facebook.com/photo.php?pid=4527791&id=204603129458\"\
    ,\n\"icon\": \"http://static.ak.fbcdn.net/rsrc.php/z2E5Y/hash/8as8iqdm.gif\",\n\
    \"created_time\": \"2010-02-04T12:40:07+0000\",\n\"updated_time\": \"2010-03-18T16:08:42+0000\"\
    \n}\n],\n\"paging\": {\n\"previous\": \"https://graph.facebook.com/307932939458/photos?limit=25&since=2010-03-18T16%3A00%3A38%2B0000\"\
    ,\n\"next\": \"https://graph.facebook.com/307932939458/photos?limit=25&until=2010-02-04T12%3A40%3A06%2B0000\"\
    \n}\n}\n```\n\n看到那个名为 `paging` 的节点了吗？它显然包含两个 URL，尽管它们似乎在末尾附加了一些乱码。实际上，这不是乱码；它只是\
    \ URL 编码。以下是解码后的上一个 URL 的样子：\n\n```\nhttps://graph.facebook.com/307932939458/photos?limit=25&since=2010-03-18T16:00:38+0000\n\
    ```\n\n它显然是一个带时间戳的日期，传递给 `since` 参数，就像我们使用的一样。\n\nFacebook 提供这些作为比本章前面探索的基于 offset/limit\
    \ 的分页更容易的替代方案。基于时间的分页比基于列表中项目位置的分页更有意义（正如我们之前探索的那样），因为项目创建的日期和时间永远不会改变，而项目在列表中的位置会在向该列表添加新项目时发生变化。\n\
    \n确实，项目被删除可能会导致问题：如果我们已经下载了该项目，则可能无法检测到它已消失，导致我们的数据不正确。即使我们进行二次检查并将其删除，它也会留下空白，导致曾经包含它的页面比其他页面更短。这些是否是严重问题取决于应用程序。\n\
    \n"
