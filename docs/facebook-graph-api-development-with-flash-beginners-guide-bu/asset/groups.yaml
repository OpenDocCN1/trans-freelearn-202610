  - '[PAGE 81]


    # What just happened?


    As you can see, Facebook''s security restricts access to what information you
    can see about a person. It''s not a simple binary setting – "you can either see
    this information or that information" – rather, it''s based on:


    +   - How you are connected to the other person

    +   - Whether or not you are logged in to Facebook


    What''s particularly interesting is that you can often see more information about
    a person just by logging in to Facebook – even if you''ve never met them, and
    have no friends or networks in common. For some people, you may not even be able
    to view their profile page if you''re not logged in; Facebook might deny that
    it even exists.


    Every Facebook user has a list of permissions, which specifies the information
    about them that other users can see, based on their connections to the other user.
    If you don''t have permission to view certain data, Facebook''s security simply
    doesn''t show it to you.


    Permissions can be complicated to figure out. Here''s a diagram of what one user''s
    permissions might look like:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_81_0.png)'
