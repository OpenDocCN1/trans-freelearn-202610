  - '[PAGE 265]


    This makes searching for a user''s friends a little harder than searching for
    their photos. However, we can get a list of friends'' IDs like so:


    ```

    SELECT uid2

    FROM friend

    WHERE uid1 = «user''s ID»

    ```


    # What just happened?


    That query will get a list of IDs of all users that are friends with the specified
    other user. Don''t worry, every row is duplicated with the order of IDs switched;
    if there''s a row with "uid1 = 123" and "uid2 = 456" then there''s another row
    with "uid1 = 456" and "uid2 = 123". This means you won''t miss anyone if you only
    ask for values of uid2.


    Getting a list of a user''s friends'' names is harder. Let''s think about how
    we''d do it with the help of AS3.


    # Time for action – getting a user''s friends'' names with AS3


    We can start by getting a list of the IDs of a user''s friends using the query
    above:


    ```

    SELECT uid2

    FROM friend

    WHERE uid1 = «user''s ID»

    ```


    From earlier in the chapter, you know that we can call this API URL to get that
    list:


    ```

    https://api.facebook.com/method/fql.query?access_token=«access_token»&format=json&query=SELECT%20page_id%20FROM%20page%20WHERE%20name%20=%20%22Facebook%22

    ```


    Except, actually, that won''t work. Just like when using the Graph API to access
    private information, you''ll need to use an access token. (See Chapter 3 for a
    reminder of how to generate one of these.)


    The correct API URL, then, is:


    ```

    https://api.facebook.com/method/fql.query?access_token=ACCESS_TOKEN&format=json&query=SELECT%20page_id%20FROM%20page%20WHERE%20name%20=%20%22Facebook%22

    ```


    Given a user''s ID, we can get their name using this query:


    ```

    SELECT name

    FROM user

    WHERE uid = «user''s ID»

    ```'
