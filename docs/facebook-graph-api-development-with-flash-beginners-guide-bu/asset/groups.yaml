- raw:
  - '[PAGE 85]


    Facebook replies, "First I need to see your ID, to prove that you really are Bill''s
    Cool Application."


    The application says, "Sure thing; here are my credentials."


    Facebook checks them out, and says, "These look okay to me. Wait a minute, how
    do I know that this is the real Joe User, and not some guy in a wig?"


    Joe logs in to Facebook with his e-mail address and password, obscuring them so
    that Bill''s Cool Application never sees them. The application politely looks
    away.


    Facebook says, "Hey Joe, good to see you. Are you happy for Bill''s Cool Application
    to access this data it''s asking for?"


    Joe checks what the application is trying to get, and says, "Yeah, sure, that''s
    fine with me."


    Facebook says, "Great. Okay, Bill''s Cool Application, here''s an access token.
    If you want to access any of Joe''s data, just show me that token when you ask
    for the info and I''ll give it to you."


    The application says, "Cool! So, I can just use this token whenever I want?"


    Facebook says, "Well, no. It will expire within a few hours. After that, you''ll
    have to ask for another one, and you''ll need Joe to be logged in to do that.
    Same deal if Joe logs out; you''ll need to get another token, which means getting
    him to log in again."


    The application says, "That seems a little inconvenient. You mean I have to get
    Joe to say it''s okay for me to access his data every couple of hours?"


    Facebook replies, "Oh, no, no, no. Now that Joe''s said it''s okay for you to
    see his information, I''ll remember that, and won''t bother asking again. And
    I don''t need to see his e-mail and password if he''s already logged in."


    Joe and the application thank Facebook and go off to do whatever it was they wanted
    to do in the first place.


    Of course, the information isn''t passed through the form of a conversation; that
    would be silly. The application credentials are passed to Facebook through a Graph
    URL, while the user give their credentials through a standard Facebook login web
    page. Facebook does not return the access token in a JSON, but through a parameter
    to the application''s URL – this is why your application needs a web host.


    First, you''re probably wondering where we get application credentials from. We
    can''t just make them up; we need to register our application with Facebook first.
    Let''s do that now.'
  - '[PAGE 86]


    # Time for action – registering an application with Facebook


    Sign up to become a Facebook Developer at http://www.facebook.com/developers/.
    Don''t worry; it''s free, and instant.


    You may be asked to verify your Facebook account by entering a valid mobile phone
    number or adding a credit card. You won''t be charged (apart from the cost of
    a standard text message, if you pick that method); this is to ensure that every
    application is connected to a real person.


    On the Developer page, click **Set Up New Application** in the top-right:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_86_0.png)


    You''ll be asked to enter the name of your application. It''s a good idea to use
    your name or your company''s name as part of the application''s name, as this
    makes it more likely to be unique. (You can change the name of the application
    later if you like; this isn''t set in stone.) You''ll also be asked to agree to
    the **Facebook Terms and Conditions** – make sure you read them first.


    ![](img/4e826fa36038b86f2087ef8b818d0acf_86_1.png)'
