  - '[PAGE 164]


    # Search Me


    As well as the smart name recognition search, Facebook also uses a smart sort
    to order the list, ranking the results to try to give you the ones you''re likely
    to be looking for first: Pages and Groups that you ''like'' are ranked higher,
    as are Events that you''re on the guest list for, and Applications and Games that
    you''ve added. And there are a few things Facebook checks to figure out which
    people you might be seeking:


    +   ◆ Are you friends with the person already?

    +   ◆ Do you have a lot of friends in common?

    +   ◆ Do you both live in the same area?

    +   ◆ Are you in the same networks (college, school, workplace)?


    This way, most of the time, you''ll find the person or object you''re looking
    for in the short drop-down list of results. But, if not, you''ll need to go to
    the Full Search.


    # Time for action – Using the Full Search results


    Type a query into the Search box, and click on the Magnifying Glass icon or the
    See More Results item at the bottom of the drop-down list to get to the Full Search
    page:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_164_0.png)'
  - '[PAGE 165]


    The full page is shown in the next screenshot:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_165_0.png)'
  - '[PAGE 166]


    <!-- no content -->'
  - '[PAGE 167]


    (Also, note that these lists allow you to page through the results.)


    Fourth, the options on the left include some types of objects that won''t appear
    in the drop-down list:


    +   ♦ Web results (powered by Bing) – essentially a frontend for the search engine,
    inside the Facebook site

    +   ♦ Posts by friends – wall posts, notes, links, videos, photos, and statuses

    +   ♦ Posts by everyone – just wall posts, notes, links, and statuses


    Finally, there are a number of sub-options you can alter for these searches: narrow
    posts down by locale or location; filter people by their school or workplace;
    look for events happening today, tomorrow, this week, or this month, and so on.


    # What just happened?


    This is all pretty straightforward. The one point of confusion here is: why don''t
    the top results from the Full Search match those from a Quick Search?


    (I searched "Liz", and the Quick Search listed my friend Beth at the top spot
    and my friend Elizabeth at the second; when I do a Full Search, neither of them
    turn up in the All results tab and only Beth appears in the People results – Elizabeth
    is nowhere to be seen!)


    Sure, it''s not too surprising that the two pages would use different algorithms
    for searching, but it doesn''t make a lot of sense for them to be this different.
    Since we''re only looking at the website itself at the moment, it doesn''t really
    matter – however, we will come across a similar issue when searching via the Graph
    API, which is what we''re going to do next.


    # Searching with a Graph URL


    You knew it was coming.


    We''ll start by searching for Graph Objects that can be seen by the public.


    # Time for action – searching without authorization


    The basic search query Graph URL is:


    ```

    https://graph.facebook.com/search?type=«type»&q=«query»

    ```


    The type parameter lets you choose an option (as in from the left-hand side of
    the Full Search), and q (for query) specifies the search terms.'
