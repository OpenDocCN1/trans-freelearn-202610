    Let''s take a look at an example, getting some information out of the page table:


    | page |

    |------|

    | page_id |

    | name |

    | website |

    | type |

    | location |


    Each of these – page_id, name, website, type, and location – are columns, just
    as uid, first_name, middle_name, last_name, name, sex, and username are for the
    user table.


    # Time for action – retrieving info from the Page table


    So how do we use it? Well, we can''t request objects, of course, because we''re
    not using an Object model – but we don''t even request rows, which are their close
    equivalents. We request specific fields. If all we''re interested in is the URLs
    of Pages'' associated websites, we can just request results from the "website"
    column:


    ```

    SELECT website

    ```


    Next, we have to specify the table we''re interested in. In this case, that''s
    "page":


    ```

    SELECT website

    FROM page

    ```


    Now we specify a condition to narrow down the search:


    ```

    SELECT website

    FROM page

    WHERE name = "Facebook"

    ```


    (Note that when checking this condition, we use = rather than ==, unlike in AS3.)


    These three elements make up a single "query". When we run this query – analogous
    to compiling an AS3 – we will receive http://www.facebook.com/, as this is the
    value of the field in the website column in the page table, in the row whose name
    is set to Facebook.


    ![](img/4e826fa36038b86f2087ef8b818d0acf_253_0.png)


    > It''s common to see the FQL keywords typed in all capitals, like SELECT, FROM,
    and WHERE, but this isn''t strictly necessary. It does help readability though.'
  md: "\n3. What can we publish without an access token?\n\na. Nothing\nb. Just Status\
    \ Messages\nc. Just Likes\nd. Anything\n\n## Summary\n\nSo, you've learned how\
    \ to create lots of different types of Graph Object: Posts, Comments, Events,\
    \ and so on. You've also learnt how to destroy them if need be.\n\nWere you surprised\
    \ at what you couldn't do with the Graph API?\n\nIn the next chapter, we'll go\
    \ back to examining the Graph, but we'll use a powerful new tool—Facebook Query\
    \ Language.\n\nKey takeaways:\n\n- To publish via HTTP, use a URLRequest/URLLoader/URLVariables\
    \ setup as usual, and include parameters for the new Graph Object in the URLVariables\
    \ instance, alongside the access token.\n- The URL to use is https://graph.facebook.com/«id»/«connection».\
    \ Make sure to use flash.net.URLRequestMethod.POST.\n- To publish via the SDK,\
    \ call Facebook.api(\"«id»/«connection»\", «callback», {parameter1:\"value1\"\
    , parameter2:\"value2\"}, URLRequestMethod.POST).\n- Uploading photos requires\
    \ a FileReference. Use FileReference.browse() to let the user pick an image from\
    \ their hard drive.\n- To upload via HTTP: Use FileReference.upload() rather than\
    \ URLLoader.load().\n- To upload via the SDK: just pass the FileReference as the\
    \ value of the source parameter in the URLVariables instance, and call Facebook.api()\
    \ as usual.\n- You cannot \"like\" anything other than a Post through the Graph\
    \ API. This means we can't alter the user's interests or favorite TV programs.\n\
    - At the time of writing, we can only delete Posts that were created using the\
    \ same application.\n- To do so via HTTP, just pass `method=delete` to `https://graph.facebook.com/<id>`,\
    \ using `URLRequestMethod.POST`.\n- If using AIR, you can simply load `https://graph.facebook.com/<id>`\
    \ using `URLRequestMethod.DELETE`.\n- To delete via the SDK, call `Facebook.deleteObject(\"\
    <id>\", \"<callback>\")`.\n- The exception is when deleting a \"like\"; in this\
    \ case, the URL stub to delete is `<id>/likes`.\n- A full list of parameters and\
    \ permissions required for publishing is available at `http://developers.facebook.com/docs/reference/api`.\n\
    - For security reasons, Flash Player 10 and above will not let your application\
    \ publish anything via the `HTTP POST` method unless the user initiated the action\
    \ (for instance, by clicking a button).\n\n## 7\n\n## FQL Matters\n\n> The Graph\
    \ is a terrific model for accessing the data in Facebook; it manages to take the\
    \ huge amount of information on the site and make it easy and simple to access\
    \ it.\n\n> Sometimes, however, we want a little extra control and a little extra\
    \ power. That's where FQL comes in. It's a programming language designed for searching\
    \ the Facebook databases – and it doesn't use the Graph.\n\nIn this chapter we\
    \ shall:\n\n- Recap the different models of data representation and visualization\n\
    - Get comfortable with FQL by using it to grab some Facebook data\n- Learn how\
    \ to use FQL to do (almost) anything we could do with the Graph\n- Discover what\
    \ the Graph is better at than FQL\n- Find out how to detect which extended permissions\
    \ have been granted\n- Look at some advanced FQL features\n\nSo let's get on with\
    \ it...\n\n## What is FQL?\n\nFQL (pronounced as the acronym, \"eff-cue-ell\"\
    ) is Facebook's version of the database language SQL. Don't know what SQL is?\
    \ Don't worry, you don't need to. In this chapter, I'll assume you don't know\
    \ anything about FQL, SQL, or databases yet. So before getting into what FQL is,\
    \ let's take a step back and look at databases.\n\n## But what if I do already\
    \ know SQL?\n\nEven if you know SQL, it's worth reading this chapter to brush\
    \ up on some concepts and learn the differences between FQL and regular SQL. In\
    \ particular, check out the Restrictions section.\nIf you're experienced with\
    \ SQL, you may be surprised by how many features FQL is missing. Most notably,\
    \ there are no INSERT, DELETE, or UPDATE clauses. Also, JOIN, GROUP BY, and LIKE\
    \ are missing; you must specify a set of fields to be returned, rather than typing\
    \ SELECT *, and you can only specify one table in the FROM clause.\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_250_0.png)\n\
    \n## Understanding the FQL interface\n\nWe've been looking at the Facebook data\
    \ as though it were structured in the Graph format laid out in Chapter 2, but\
    \ really, this is just a model for the data; the Graph API acts like a wrapper,\
    \ making it appear as though the data is structured in that way. It's not.\n\n\
    Does it matter how the data is structured? Not for our purposes. What matters\
    \ is the interface we are given to access it with. So far, that interface has\
    \ been the Graph API; we've obtained all our data through Graph URLs and processed\
    \ them with AS3.\n\nBut there is another way of looking at the data, which is\
    \ like a traditional database structure. In this case, all the data is kept in\
    \ tables, organized into columns, rows, and fields. It's easier to explain with\
    \ an example:\n\n| user |  |  |  |  |  |  |\n|---|---|---|---|---|---|---|\n|\
    \ uid | first_name | middle_name | last_name | name | sex | username |\n| 123456\
    \ | Michael | James | Williams | Michael James Williams | male | michael_james_williams\
    \ |\n| 789012 | Joe | Quincy | Faikname | Joe Q Faikname | male | joe_q_faikname\
    \ |\n\nSome columns have been left out for brevity.\n\nThis is one table of data.\
    \ Specifically, it's the user table, as you can see from the following heading:\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_250_1.png)\n\nEach **column** represents\
    \ an attribute of the data:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_251_0.png)\n\
    \nEach **row** corresponds to a single object, with all its attributes:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_251_1.png)\n\
    \nThe intersection of a row and a column – that is, a single attribute of a single\
    \ object – is called a **field**:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_251_2.png)\n\
    \nYou could alternatively think of this like a spreadsheet; this is the simple,\
    \ natural way of storing data in a grid. (Of course, if you're familiar with relational\
    \ databases, you could just think of it as a relational database's table!)\n\n\
    ## Models of data\n\nSo now we've got three different models we can use when thinking\
    \ about Facebook data:\n\n1. The AS3 object-oriented model: We have classes containing\
    \ certain properties, and instances of those classes containing information about\
    \ a specific item. For example, we could have a class called User which contains\
    \ certain properties, and define an instance of that class:\n\n```\nclass User\n\
    {\n    public var uid:int;\n```\n\nLet's take a look at an example, getting some\
    \ information out of the page table:\n\n| page |\n|------|\n| page_id |\n| name\
    \ |\n| website |\n| type |\n| location |\n\nEach of these – page_id, name, website,\
    \ type, and location – are columns, just as uid, first_name, middle_name, last_name,\
    \ name, sex, and username are for the user table.\n\n## Time for action – retrieving\
    \ info from the Page table\n\nSo how do we use it? Well, we can't request objects,\
    \ of course, because we're not using an Object model – but we don't even request\
    \ rows, which are their close equivalents. We request specific fields. If all\
    \ we're interested in is the URLs of Pages' associated websites, we can just request\
    \ results from the \"website\" column:\n\n```\nSELECT website\n```\n\nNext, we\
    \ have to specify the table we're interested in. In this case, that's \"page\"\
    :\n\n```\nSELECT website\nFROM page\n```\n\nNow we specify a condition to narrow\
    \ down the search:\n\n```\nSELECT website\nFROM page\nWHERE name = \"Facebook\"\
    \n```\n\n(Note that when checking this condition, we use = rather than ==, unlike\
    \ in AS3.)\n\nThese three elements make up a single \"query\". When we run this\
    \ query – analogous to compiling an AS3 – we will receive http://www.facebook.com/,\
    \ as this is the value of the field in the website column in the page table, in\
    \ the row whose name is set to Facebook.\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_253_0.png)\n\
    \n> It's common to see the FQL keywords typed in all capitals, like SELECT, FROM,\
    \ and WHERE, but this isn't strictly necessary. It does help readability though.\n"
  mdcn: "\n\n3. 没有访问令牌，我们可以发布什么？\n\na. 什么都不能\nb. 只能发布状态消息\nc. 只能点赞\nd. 什么都可以\n\n##\
    \ 总结\n\n现在，你已经学会了如何创建多种不同类型的图谱对象：帖子、评论、活动等等。你还学会了在需要时如何删除它们。\n\n对于图谱 API 无法做到的事情，你是否感到惊讶？\n\
    \n在下一章中，我们将重新审视图谱，但我们将使用一个强大的新工具——Facebook 查询语言。\n\n要点回顾：\n\n- 要通过 HTTP 发布，照常使用\
    \ URLRequest/URLLoader/URLVariables 设置，并在 URLVariables 实例中随访问令牌一起包含新图谱对象的参数。\n\
    - 使用的 URL 是 https://graph.facebook.com/«id»/«connection»。务必使用 flash.net.URLRequestMethod.POST。\n\
    - 要通过 SDK 发布，调用 Facebook.api(\"«id»/«connection»\", «callback», {parameter1:\"\
    value1\", parameter2:\"value2\"}, URLRequestMethod.POST)。\n- 上传照片需要 FileReference。使用\
    \ FileReference.browse() 让用户从硬盘中选择图片。\n- 要通过 HTTP 上传：使用 FileReference.upload()\
    \ 而不是 URLLoader.load()。\n- 要通过 SDK 上传：只需将 FileReference 作为 URLVariables 实例中 source\
    \ 参数的值传入，然后照常调用 Facebook.api() 即可。\n- 通过图谱 API，你只能“赞”帖子，不能“赞”其他内容。这意味着我们无法修改用户的兴趣或最喜欢的电视节目。\n\
    - 在编写本书时，我们只能删除使用同一应用程序创建的帖子。\n- 要通过 HTTP 删除，只需使用 URLRequestMethod.POST 将 `method=delete`\
    \ 传递给 `https://graph.facebook.com/<id>`。\n- 如果使用 AIR，你可以直接用 `URLRequestMethod.DELETE`\
    \ 加载 `https://graph.facebook.com/<id>`。\n- 要通过 SDK 删除，调用 `Facebook.deleteObject(\"\
    <id>\", \"<callback>\")`。\n- 例外情况是删除“赞”；在这种情况下，要删除的 URL 路径是 `<id>/likes`。\n- 发布所需的完整参数和权限列表可在\
    \ `http://developers.facebook.com/docs/reference/api` 查看。\n- 出于安全原因，Flash Player\
    \ 10 及以上版本不允许你的应用程序通过 `HTTP POST` 方法发布任何内容，除非该操作是由用户发起的（例如，通过点击按钮）。\n\n## 7\n\n\
    ## FQL 相关问题\n\n> 图谱是访问 Facebook 数据的一种极佳模型；它能够处理网站上海量的信息，并让访问变得简单易行。\n\n> 然而，有时我们希望获得额外的控制力和更强大的能力。这时就要用到\
    \ FQL 了。它是一种专为搜索 Facebook 数据库而设计的编程语言——而且它不使用图谱。\n\n在本章中，我们将：\n\n- 回顾不同的数据表示和可视化模型\n\
    - 通过使用 FQL 获取一些 Facebook 数据来熟悉它\n- 学习如何使用 FQL 来完成（几乎）所有图谱能做的事情\n- 发现图谱比 FQL 更擅长的方面\n\
    - 找出如何检测已授予哪些扩展权限\n- 了解一些高级 FQL 特性\n\n那么，让我们开始吧……\n\n## 什么是 FQL？\n\nFQL（按首字母缩写读作“eff-cue-ell”）是\
    \ Facebook 版本的数据库语言 SQL。不知道 SQL 是什么？别担心，你不需要知道。在本章中，我会假设你对 FQL、SQL 或数据库一无所知。所以在深入探讨\
    \ FQL 是什么之前，让我们先退一步，看看数据库。\n\n## 但如果我已经会 SQL 了呢？\n\n即使你懂 SQL，也值得读一读本章，以复习一些概念，并了解\
    \ FQL 与常规 SQL 之间的差异。特别是，可以参考“限制”部分。\n如果你有 SQL 经验，你可能会惊讶于 FQL 缺少多少功能。最明显的是，它没有\
    \ INSERT、DELETE 或 UPDATE 子句。此外，缺少 JOIN、GROUP BY 和 LIKE；你必须指定要返回的字段集，而不能输入 SELECT\
    \ *，而且在 FROM 子句中只能指定一个表。\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_250_0.png)\n\
    \n## 理解 FQL 接口\n\n我们一直把 Facebook 数据看作第 2 章中列出的图谱格式来查看，但实际上，这仅仅是一种数据模型；图谱 API 就像是一个包装器，让数据看起来像是按那种方式组织的。其实并非如此。\n\
    \n数据的组织方式重要吗？对于我们的目的来说并不重要。重要的是我们用来访问数据的接口。到目前为止，这个接口一直是图谱 API；我们通过图谱 URL 获取了所有数据，并用\
    \ AS3 进行处理。\n\n但还有另一种查看数据的方式，它类似于传统的数据库结构。在这种情况下，所有数据都保存在表中，按列、行和字段组织。用一个例子来解释更容易：\n\
    \n| user |  |  |  |  |  |  |\n|---|---|---|---|---|---|---|\n| uid | first_name\
    \ | middle_name | last_name | name | sex | username |\n| 123456 | Michael | James\
    \ | Williams | Michael James Williams | male | michael_james_williams |\n| 789012\
    \ | Joe | Quincy | Faikname | Joe Q Faikname | male | joe_q_faikname |\n\n为了简洁起见，省略了部分列。\n\
    \n这是一张数据表。具体来说，它是 user 表，你可以从下面的标题看出来：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_250_1.png)\n\
    \n每一**列**代表数据的一个属性：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_251_0.png)\n\n\
    每一**行**对应一个对象，包含其所有属性：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_251_1.png)\n\
    \n行和列的交点——即某个对象的某个属性——称为一个**字段**：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_251_2.png)\n\
    \n你也可以把这种结构想象成电子表格；这是以网格形式存储数据的一种简单而自然的方式。（当然，如果你熟悉关系数据库，你也可以直接把它想象成关系数据库中的一张表！）\n\
    \n## 数据模型\n\n现在我们有了三种不同的模型可以用来思考 Facebook 数据：\n\n1. AS3 面向对象模型：我们有一些包含特定属性的类，以及这些类的实例，实例中包含关于特定项目的信息。例如，我们可以创建一个名为\
    \ User 的类，它包含某些属性，并定义该类的一个实例：\n\n```\nclass User\n{\n    public var uid:int;\n\
    ```\n\n让我们看一个例子，从 page 表中获取一些信息：\n\n| page |\n|------|\n| page_id |\n| name |\n\
    | website |\n| type |\n| location |\n\n其中每一项——page_id、name、website、type 和 location——都是列，就像\
    \ uid、first_name、middle_name、last_name、name、sex 和 username 是 user 表的列一样。\n\n##\
    \ 动手实践——从 Page 表检索信息\n\n那么我们如何使用它呢？当然，我们不能请求对象，因为我们不是在使用对象模型——但我们甚至也不请求行（行与对象是近似的对应物）。我们请求的是特定字段。如果我们只对页面关联网站的\
    \ URL 感兴趣，我们只需请求“website”列中的结果：\n\n```\nSELECT website\n```\n\n接下来，我们必须指定我们感兴趣的表。在本例中，就是“page”：\n\
    \n```\nSELECT website\nFROM page\n```\n\n现在我们指定一个条件来缩小搜索范围：\n\n```\nSELECT website\n\
    FROM page\nWHERE name = \"Facebook\"\n```\n\n（请注意，在检查这个条件时，我们使用 = 而不是 ==，这与 AS3\
    \ 不同。）\n\n这三个元素构成一个“查询”。当我们运行这个查询时——类似于编译 AS3——我们将收到 http://www.facebook.com/，因为这是\
    \ page 表中 name 为 Facebook 的那一行的 website 列字段的值。\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_253_0.png)\n\
    \n> 通常会看到 FQL 关键字全部大写，如 SELECT、FROM 和 WHERE，但这并不是硬性要求。不过，这确实有助于提高可读性。\n\n"
