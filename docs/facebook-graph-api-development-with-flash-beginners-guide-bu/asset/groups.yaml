    \nExcept, that's not the whole story.\n\n## User/Application authorization\n\n\
    There are actually two authorizations required: the user's and the application's.\
    \ It works like this:\n\nJoe User tries to do something in Bill's Cool Application\
    \ that requires the application to access some of Joe's restricted information.\
    \ The application can't access it, so the two of them approach Facebook via the\
