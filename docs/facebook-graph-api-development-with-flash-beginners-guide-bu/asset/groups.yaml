    The diagram is looking more and more complex (and the similarities to the mathematical
    graph drawn earlier are now clear). Of course, now that people are involved, the
    number of connections gets ridiculous. Users can be connected to any other object,
    either by being friends with another User, by being tagged in a Photo, Video,
    or Note, by posting a Comment, Link or other item, or by clicking Like on any
    other element in Facebook.


    ![](img/4e826fa36038b86f2087ef8b818d0acf_74_0.png)


    If you start with one Page and keep going through all the objects connected to
    it, and then all the objects connected to those, and so on, you can cover huge
    numbers of nodes without having to start again with a new Page.


    The power of the graph lies in its flexibility. Every type of Graph Object has
    the same basic structure as every other type of Graph Object – with the exception
    of Graph Lists (which contain arrays of Graph Objects). That''s why our Graph
    Object Renderer can easily display any kind of Graph Object.'
  - '[PAGE 75]


    Also, have you noticed that it''s not just comments that have a `from` property?
    Albums do, too, and so do individual photos, and pretty much every type of object
    that isn''t a Page or a User. This means you can start with any object, find its
    creator, and traverse outwards across the graph from there.


    The Graph model has implications for privacy. Suppose that, if we were granted
    access to information about a Page, we were also allowed to access information
    about any object connected to that Page. Well, then we could go from the Page
    to:


    +   - An Album posted by the Page, to

    +   - A Photo in that Album, to

    +   - A User tagged in that Photo, to

    +   - That User''s list of wall posts, to

    +   - A Comment made on a post by a friend of the first User, to

    +   - The User that posted the Comment, to

    +   - A TV Show that this User Likes, to

    +   - A Link posted on the Page for that TV Show, to

    +   - The User who posted that link


    and so on. It''s no surprise, then, that Facebook uses a more detailed set of
    rules to determine both what a user can access, and what an app can access on
    behalf of a user. We''ll look at these rules in the next chapter.


    # Putting it all together


    Finally, let''s see how far we can traverse through the graph, starting from the
    Packt Publishing Page.


    # Time for action – traversing the Graph


    Set the Visualizer to start by requesting the PacktPub Page. Now, compile and
    run your SWF, and use the **Connections** box and the **Pop Out** buttons to explore
    the Graph, and see how far you can get. Don''t forget you can drag Renderers around,
    and zoom out to fit even more in the Flash Player window! And remember, black
    lines signify connections, while gray lines signify that the object belongs to
    a List.'
