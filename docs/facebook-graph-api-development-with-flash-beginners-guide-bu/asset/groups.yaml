    ```

    "previous": "https://graph.facebook.com/61300894/home?q=test&access_token=«access_token»&limit=25&since=2010-07-28T11%3A07%3A12%2B0000",

    "next": "https://graph.facebook.com/61300894/home?q=test&access_token=«access_token»&limit=25&until=2010-07-20T15%3A01%3A01%2B0000"

    }

    ```


    # What just happened?


    Perhaps this should be thought of more as a filter than a search. Regardless,
    the end result is a Graph List of posts from your news feed containing the specified
    query.


    The search terms don''t have to appear in the actual text of the post; suppose
    it''s my friend Bill''s birthday. If I load:


    ```

    https://graph.facebook.com/me/home?q=Bill&access_token=«access_token»

    ```


    then I will see:


    +   - My own post on Bill''s wall, saying "Happy Birthday, Bill!" (because the
    post contains the word "Bill")

    +   - My friend Bob''s post on Bill''s wall, saying "Happy Birthday!" (because
    the person receiving the post is called "Bill" – which means that there are two
    reasons for my own post to be in these results)

    +   - Bill''s post saying "Thanks for the birthday wishes, everyone!" (because
    his name is Bill)


    Unfortunately there''s no way to narrow this down and specify where you want to
    look for matches – at least, not using a Graph Search URL.


    You''re probably wondering whether we can substitute another person''s User ID
    instead of "me", and thus see what posts will be appearing in their news feed.
    We can''t do this, for privacy reasons, but we can do something similar.


    # Time for action – searching a friend''s Wall Posts


    It''s confusing that the Graph URL for your news feed (which you''ll see when
    you log in) is:


    ```

    https://graph.facebook.com/me/home?access_token=«access_token»

    ```


    The link to your wall is:


    ```

    https://graph.facebook.com/me/feed?access_token=«access_token»

    ```


    It''s just something to memorize, I''m afraid.'
