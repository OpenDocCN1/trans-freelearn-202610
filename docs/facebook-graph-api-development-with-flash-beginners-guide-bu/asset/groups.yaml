    \ The Page's name field is displayed in the window's title bar, and if the Page\
    \ has a picture field (we can see from the JSON that PacktPub does), the image\
    \ is downloaded and displayed inside the renderer using a Loader.\n\n> Like URLLoader,\
    \ the flash.display.Loader class downloads the object that a given URLRequest\
    \ points to, dispatching a COMPLETE event when ready. Unlike URLLoader, Loader\
    \ is used to download images and SWFs, and the event is actually dispatched by\
    \ one of its sub-objects, contentLoaderInfo. Also, Loader extends DisplayObject,\
    \ and takes the appearance of the image when it has finished downloading.\n> \n\
    > Flash's security model prevents an image's data being accessed by SWFs residing\
    \ on a different domain than the image itself, unless there is a cross-domain\
    \ policy file on the domain of the image that allows it. Fortunately, Facebook's\
    \ cross-domain policy file is lenient, allowing such access by every domain.\n\
    \nSo, really, this is just a graphical way of representing a Page object from\
    \ the Graph API.\n\n## Understanding connections\n\n\"That's all well and good,\"\
    \ you may be thinking, \"but it doesn't show all the data associated with the\
    \ Page, does it? Where are the wall posts and photos?\"\n\n## Time for action\
    \ – finding connections in a browser\n\nFacebook treats wall posts, photos, videos,\
    \ and even statuses as separate objects within the Graph API, rather than jamming\
    \ them all into a single Page object. For instance, here's an object representing\
    \ a single Post by Packt Publishing:\n\n```\n{\n  \"id\": \"204603129458_127056137323572\"\
