  - "[PAGE 206]\n\n```\nurlRequest.data = variables;\n\nloader.addEventListener(Event.COMPLETE,\
    \ onPublishComplete);\nloader.addEventListener(IOErrorEvent.IO_ERROR, onIOError);\n\
    loader.load(urlRequest);\n}\n```\n\n7. Create an event handler function for the\
    \ COMPLETE event:\n\n```\nprivate function onPublishComplete(a_event:Event):void\n\
    {\n    dispatchEvent(new DialogEvent(DialogEvent.DIALOG,\n        \"Publish complete!\"\
    ));\n}\n```\n\nRemember, the DialogEvent can be used to display a dialog box within\
    \ the Visualizer project, containing any message you please. You'll need to import\
    \ events.DialogEvent to use it, though.\n\nCompile, upload, and execute the SWF\
    \ and you will find that... it doesn't work.\n\n# What just happened?\n\nTo find\
    \ out why this didn't work, we can add a new type of event listener to the URLLoader—an\
    \ HTTPStatusEvent listener.\n\nThis type of event is returned by the server and\
    \ dispatches before the IO_ERROR or COMPLETE events. Its status property contains\
    \ the \"HTTP code\" of the response, which is a simple shorthand to explain the\
    \ response status. For example, 404 is an HTTP status code meaning \"Not Found\"\
    . There's a full list at http://en.wikipedia.org/wiki/List_of_HTTP_status_codes,\
    \ but in general you will see:\n\n+   - 200: If there were no problems\n+   -\
    \ 400: If the request you sent was badly formed (most likely due to a typo in\
    \ the URL variables)\n+   - 403: If you are not allowed to access whichever resource\
    \ you requested\n+   - 404: If the resource that you requested was not found on\
    \ the server\n+   - 500: If there was another problem (like insufficient permissions)\n\
    \n(You may also see 0 if Flash Player is unable to detect the HTTP response code\
    \ due to some condition in its environment.)\n\nThis can be useful additional\
    \ information to have to help narrow down an IO_ERROR problem, or to detect a\
    \ problem that doesn't dispatch an IO_ERROR event."
