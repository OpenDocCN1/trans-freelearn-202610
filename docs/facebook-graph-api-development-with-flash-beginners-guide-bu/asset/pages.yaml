- pgno: 128
  md: 'All we have to do now is create an HTML page to contain the SWF. We cannot
    use the standard `index.html` page we have been using so far, as the SDK requires
    certain JavaScript functions in order to work.


    Adobe has provided some **wrapper** HTML pages to use as containers for our SWFs.
    One of the pages, `sdkindex.html`, is in the `\bin\adobesdk\` folder, alongside
    a JavaScript file called `FBJSBridge.js`. Copy both `sdkindex.html` and `FBJSBridge.js`
    into your `\bin\` directory.


    Open `sdkindex.html` in a text editor, and find the following line:


    ```

    embedSWF("Visualizer.swf", "flashContent", "600", "300", "10.0");

    ```


    Replace `Visualizer.swf` with the name of your SWF.


    Finally, upload `sdkindex.html`, `FBJSBridge.js` and your SWF to your web host
    to the same directory as usual, and load `http://host.com/sdkindex.html` in your
    web browser.


    # What just happened?


    You just added the official Adobe ActionScript 3 SDK for Facebook Platform to
    your application as an alternative to the classes that we built earlier in the
    chapter.


    The SDK works in a very similar way to our classes, albeit with a lot more polish;
    it also uses `URLRequest` objects to retrieve data, and decodes the resulting
    JSON to a native AS3 object.


    In order for the SDK to work, it imports two JS files containing JavaScript functions,
    which actually power the Facebook login and integration. Those two files are called:
    `FBJSBridge.js`, which is included in the project; and `all.js`, which is loaded
    from the Facebook server. As long as your webpage uses SWFObject and imports those
    JavaScript files, you should be able to use the SDK.


    # Have a go hero – requesting extended permissions with the SDK


    The `Facebook.login()` method takes a second parameter: `options`, a native AS3
    `Object`. This is used to request extended permissions; simply provide an object
    with a string property called `perms`, which is a comma-separated list of the
    permissions.


    Use this to modify your `SDKRequestor.attemptToAuthenticate()` method so that
    it can take an arbitrary number of extended permissions as parameters and request
    them using the `Facebook.login()` method.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Pop Quiz


    +   1. What does "me" do?

    +      a. Returns the authenticated user''s ID

    +      b. Stands in as the authenticated user''s ID when used in a Graph URL.

    +      c. It represents the ID of a Facebook user called Mike Eddington


    +   2. Why didn''t we obtain an access token using AS3 alone?

    +      a. `URLRequest` objects can''t load the Facebook login page

    +      b. It''s only possible to obtain a token using JavaScript

    +      c. We wanted to present the user with a genuine Facebook login page, for
    trust reasons


    +   3. Why shouldn''t you ask for all the extended permissions your application
    might possibly need at once?

    +      a. It''s likely to scare users away

    +      b. Only five permissions can be granted at any one time

    +      c. This is a violation of the Facebook terms of service


    # Summary


    In this chapter, the key words were security, permissions, and authentication.

    We learned about:


    +   - How Facebook restricts us from accessing information we''re not supposed
    to

    +   - How users determine which information other users (and apps) can see

    +   - How apps can request permission to see more information from users

    +   - How users and apps work together to authenticate with Facebook


    # Key takeaways


    +   - The Graph API will only give certain details about a person if you try to
    access a Graph Object without proof of authentication.

    +   - An access token is proof of authorization, and is associated with both a
    user and an application.

    +   - Users have two credentials: e-mail address and password.

    +   - Applications have three credentials: application ID (which is like a username),
    application secret (which is like a password, and can be changed), and API key
    (which is used to access the Graph API).'
  merge: -1
