- pgno: 226
  md: "3. Add similar code to SDKRequestor.as:\n\n```\npublic function publish(a_publishObject:PublishObject):void\n\
    {\n    var urlStub:String = \"/\" + a_publishObject.ownerID + \"/feed\";\n   \
    \ var actionObj:Object = [ {\n        name:\"Visit my Twitter Page\",\n      \
    \  link:\"http://twitter.com/MichaelJW\"\n    } ];\n    var actionString:String\
    \ = JSON.encode(actionObj);\n\n    var privacyObj:Object = {\n        value:\"\
    EVERYONE\"\n    }\n    var privacyString:String = JSON.encode(privacyObj);\n\n\
    \    Facebook.api(urlStub, publishComplete,\n    {\n        message:a_publishObject.message,\n\
    \        picture:a_publishObject.pictureURL,\n        link:a_publishObject.linkURL,\n\
    \        name:a_publishObject.linkName,\n        caption:a_publishObject.caption,\n\
    \        description:a_publishObject.description,\n        actions:actionString,\n\
    \        privacy:privacyString\n    },\n        URLRequestMethod.POST\n    );\n\
    }\n```\n\n4. By setting value to EVERYONE, we will make the post visible to anyone\
    \ who can see your Wall, not just your friends.\n\nWhat other options are there?\n\
    \nWell, value can be set to:\n\n+   - EVERYONE\n+   - ALL_FRIENDS\n+   - NETWORKS_FRIENDS\n\
    +   - FRIENDS_OF_FRIENDS"
  merge: -1
  img_proc: true
- pgno: 227
  md: "The meanings of those are pretty obvious, apart from NETWORKS_FRIENDS (which\
    \ allows your friends plus anyone in your networks to see the post).\n\nThere's\
    \ one other possible setting for value: CUSTOM. Using this allows you to specify\
    \ two other properties of privacyObj—networks and friends.\n\nFor the networks\
    \ property, enter a comma-separated list of the IDs of the networks that should\
    \ be allowed to see your post, like so:\n\n```\nvar privacyObj:Object = {\n  \
    \  value:\"EVERYONE\",\n    networks:\"network1,network2,network3\"\n}\n```\n\n\
    To allow all networks to see the post, just enter 1 as the value.\n\nFor the friends\
    \ property, enter one of the following:\n\n+   - EVERYONE\n+   - NETWORKS_FRIENDS\n\
    +   - FRIENDS_OF_FRIENDS\n+   - ALL_FRIENDS\n+   - SELF\n+   - NO_FRIENDS\n\n\
    Again, it's pretty clear what each of these do. NO_FRIENDS lets you allow only\
    \ people in specified networks to see the post.\n\nThere is another possible setting\
    \ for friends: SOME_FRIENDS. This gives you another pair of properties that you\
    \ can set for privacyObj—allow and deny. Each of these properties takes a comma-separated\
    \ list of user IDs (mixed with friend list IDs); allow defines who can see the\
    \ post, while deny defines who cannot.\n\nSo, your privacyObj could look like\
    \ this:\n\n```\nvar privacyObj:Object = {\n    value:\"CUSTOM\",\n    networks:\"\
    network1,network2,network3\",\n    friends:\"SOME_FRIENDS\",\n    allow:\"bob.smith,joe.q.faikname\"\
    ,\n    deny:\"bill.the.jerk\"\n}\n```"
  merge: -1
  img_proc: true
- pgno: 228
  md: '# What just happened?


    As you can see, you have fine-grained control over the level of privacy of posts
    on a user''s Wall. The "correct" settings to use depend entirely on your application
    and its audience; just be aware of what''s possible.


    > You cannot control the privacy setting of posts that your users publish on the
    Walls of other users, Pages, Events, or Groups; these are always able to be seen
    by anybody who can see the other Wall.


    # Source


    The `source` parameter supposedly allows you to embed small photo galleries, Flash
    objects (like video clips), and MP3 music into a Post, as well as custom key-value
    pairs that (although invisible on the Facebook website) can be read later on by
    your application or any other.


    Unfortunately, at the time of this writing this feature is not working correctly
    with the Graph API. Take a look at what can be done with the `source` parameter
    here: http://developers.facebook.com/docs/guides/attachments. With luck, the feature
    will be fully implemented and documented by the time you read this paragraph.


    # Deleting Graph Objects


    We''ve mastered adding posts, but what about removing them later?


    # Time for action – deleting a Post


    Facebook''s interface for deleting a post is a Remove button that appears on hover:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_228_0.png)


    The Visualizer project also has a Delete button; let''s see how to add it.'
  merge: -1
  img_proc: true
- pgno: 229
  md: "# Time for action – deleting Posts using the Visualizer\n\n1. We can enable\
    \ the Delete button of the Visualizer by using yet another hidden option. In the\
    \ constructor function of CustomGraphContainerController as, set this._showDeleteButtons\
