- pgno: 196
  md: '+   - Without an access token, certain types of search (like `user`) cannot
    be performed

    +   - When using an access token, search results are tailored to the authorized
    user: people are ranked higher in the search if they live nearby, for example

    +   - Some search types require a certain extended permission to be granted before
    returning any results – see `http://developers.facebook.com/docs/authentication/permissions`
    for more details

    +   - You can set the locale of certain properties of JSON objects returned by
    using the locale URL parameter: `https://graph.facebook.com/<id>?locale=fr_FR`

    +   - You can also filter Post search results to only shows those made by people
    that use a certain locale: `https://graph.facebook.com/search?type=post&q=<query>&locale=fr_FR`

    +   - A full list of locales is available at `http://facebook.com/translations/FacebookLocales.xml`

    +   - You can filter the entries from your news feed using this Graph URL: `https://graph.facebook.com/me/home?access_token=<access_token>&q=<query>`

    +   - You can filter the Graph for everything that a given friend has posted using
    this Graph URL: `https://graph.facebook.com/<username>/feed?access_token=<access_token>&q=<query>`


    # Pop Quiz


    +   1. What''s gone wrong if the results you obtain from a Graph URL search don''t
    match those from a website search?

    +      a. Incorrect parameters were passed to the Graph URL

    +      b. An incorrect Graph URL was used

    +      c. A user''s privacy settings don''t allow applications to access their
    data

    +      d. Potentially any of the above

    +   2. What''s odd about the results you get from `https://graph.facebook.com/<username>/feed?q=<query>`
    and those you get from `https://graph.facebook.com/<username>/feed`?

    +      a. They can be obtained even if the user''s privacy settings are turned
    all the way up

    +      b. The first doesn''t act as a filter for the second, unlike all the other
    Graph Search URLs

    +      c. The two URLs always return exactly the same JSON as each other'
