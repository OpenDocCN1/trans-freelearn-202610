- pgno: 112
  md: "Now, add the following code to your HTTPRequestor() constructor function:\n\
    \n```\npublic function HTTPRequestor(target: IEventDispatcher = null)\n{\n   \
    \ //this is needed because the class extends EventDispatcher\n    super(target);\n\
    \    ExternalInterface.addCallback(\"setAccessToken\", setAccessToken);\n\n  \
    \  ExternalInterface.call(\"function() {\n\" +\n    \"window.setAccessToken =\
    \ function(hashValue){\n\" +\n    \"  var visualizer = document.getElementById('Visualizer');\"\
    \ +\n    \"  visualizer.setAccessToken(hashValue);\" +\n    \"}\n\" +\n    \"\
    }\");\n}\n```\n\nThe highlighted code creates and calls an anonymous function\
    \ which contains the actual function we want to call. It's a bit messy, but it\
    \ works.\n\nRecompile your SWF and upload it to your host. Refresh index.html.\
    \ The pop up will appear, may prompt you to log in, and will redirect to the Close\
    \ this window page. Shortly after that we will see the following screenshot:\n\
    \n![](img/4e826fa36038b86f2087ef8b818d0acf_112_0.png)\n\nSuccess!"
  merge: -1
  img_proc: true
- pgno: 113
  md: '# What just happened?


    You just added true Facebook authentication to your Flash application.


    The user logs in on Facebook itself, rather than through your application, minimizing
    the security risk. Facebook passes the access token back to a callback page that
    you wrote, which in turn passes it back through another web page to your SWF,
    which is now able to use it when requesting Graph API data.


    # What about users who haven''t used the application before?


    We haven''t fully tested the authentication yet, since we had already granted
    the application permission to access our data earlier on, when we were experimenting
    with the browser.


    Fortunately it''s very easy to undo all that and pretend we''ve never seen the
    application before. Log in to Facebook and click on Account | Application Settings.
    Find your application in the list, and click on the X button as shown in the next
    screenshot:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_113_0.png)


    Facebook will ask you to confirm this decision. (The application will remain on
    your Developers Page, even though it will be removed from your Applications Page.)


    ![](img/4e826fa36038b86f2087ef8b818d0acf_113_1.png)'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Refresh index.html. This time, the pop up will ask for permission to access
    your information:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_114_0.png)


    Click on **Allow**, and the pop up is redirected to callback.html, which passes
    the access token to the visualizer, just as before.


    # Have a go hero – dealing with the undecided


    What if your user clicks on the **Don''t allow** dialog box?


    At the moment, the application doesn''t do anything without an access token; it
    just sits patiently and waits. If, when the pop up window appears, the user doesn''t
    click on **Allow** – or if the user doesn''t see the pop up , perhaps because
    it''s blocked – the application won''t fail gracefully. It will just sit there
    and wait.


    Add some features to your application to make it deal with this kind of situation.
    Maybe it could pop up a message after a few seconds, saying "You need to log in
    to Facebook and approve this application in order to use it." Or perhaps you could
    load a different Graph object to start with, and only request a login when the
    user tries to access something they need an access token for.


    Now that your application''s online, you can let other people see it by directing
    them to index.html. Get some friends to test it out.'
  merge: -1
  img_proc: true
- pgno: 115
  md: "# Extended permissions\n\nWe don't have access to everything yet, though. In\
    \ your browser, try loading https://graph.facebook.com/me/inbox (with an access\
    \ token passed as a parameter). You'll get the following message:\n\n```\n{\n\
    \  \"error\": {\n    \"type\": \"Exception\",\n    \"message\": \"(#612) mailbox\
    \ requires the read_mailbox extended permission.\"\n  }\n}\n```\n\nMuch like how\
    \ you, as a user, can restrict other users from seeing certain parts of your Facebook\
    \ profile, you can also restrict certain apps from accessing certain information\
    \ via the Graph API.\n\nIn this case, we're trying to access my inbox, as an application,\
    \ and are being told we don't have permission. But how do we get permission?\n\
    \n# Time for action – obtaining extended permissions\n\nIt's actually really easy\
    \ to request permission to do something beyond the basic: when calling the authorize\
    \ URL, pass it an extra parameter named scope.\n\nSet the value of the scope parameter\
    \ to the name of the extended permission you want to request. For example, to\
    \ request access to the user's inbox, use this URL:\n\n```\nhttps://graph.facebook.com/oauth/authorize?client_id=<your_application_id>&type=user_agent&redirect_uri=<your_callback_url>&scope=read_mailbox\n\
    ```\n\nTry this in the browser, and you'll get this dialog:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_115_0.png)"
  merge: -1
  img_proc: true
- pgno: 116
  md: "# What just happened?\n\nOnce the user clicks on Allow, Facebook will remember\
    \ that decision, and your application won't have to ask for this permission again\
    \ – just like when the user authorized the application to see their basic information\
    \ for the first time.\n\nYou can request more than one extended permission at\
    \ a time; just separate them with commas:\n\n```\nhttps://graph.facebook.com/oauth/authorize?client_id=<your_application_id>&type=user_agent&redirect_uri=<your_callback_url>&scope=read_mailbox,user_photos,user_interests\n\
    ```\n\nExtended permissions aren't just about you, though. Allowing the user_interests\
    \ extended permission will allow the application to access the user's list of\
    \ interests (which are, of course, represented as a list of Graph objects) – but\
    \ there's also a friends_interests extended permission, which allows the application\
    \ to access the lists of interests of all the user's friends.\n\nActually, most\
    \ of the extended permissions have a user-only version and a friends version;\
    \ check out the official documentation for a list of all of them: http://developers.facebook.com/docs/authentication/permissions.\n\
    \n# Time for action – requesting extended permissions\n\nTo make your application\
    \ always request the user_interests extended permission, we merely have to modify\
    \ HTTPRequestor.attemptToAuthenticate() to:\n\n```\npublic function attemptToAuthenticate():void\
    \ as shown in the following code:\n{\n    ExternalInterface.call(\"window.open\"\
    ,\n    \"https://graph.facebook.com/oauth/authorize?\n    client_id=<your_application_id>&type=user_agent&\n\
    \    redirect_uri=<your_callback_url>\"\n    + \"&scope=user_interests\",\n  \
    \  \"facebookLoginWindow\",\n    \"height=370, width=600\");\n}\n```\n\nThat'll\
    \ work fine; it'll give you the pop-up window asking you if it's okay for the\
    \ application to access your profile information.\n\nIf that's all you need –\
    \ and all you'll ever need – then you could leave it at that. But what if you\
    \ want to make this a little more flexible?"
  merge: -1
  img_proc: true
- pgno: 117
  md: "First, let's allow the attemptToAuthenticate() function to take an arbitrary\
    \ number of extended permissions as arguments, and append them to the scope parameter\
    \ as a comma-separated list:\n\n```\npublic function attemptToAuthenticate(...permissions):void\n\
    {\n    var scope:String = \"\";\n    if (permissions.length > 0)\n    {\n    \
    \    scope = \"&scope=\" + permissions.join(\",\");\n    }\n    ExternalInterface.call(\"\
    window.open\",\n        \"https://graph.facebook.com/oauth/authorize?client_id=165373950152944&type=user_agent&redirect_uri=http://gamedev.michaeljameswilliams.com/scrap/visualizer/callback.html\"\
    \n        + scope,\n        \"facebookLoginWindow\",\n        \"height=370, width=600\"\
    );\n}\n```\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_117_0.png)\n\n> Using permissions\
    \ as the sole argument for the function means that we can pass it as many arguments\
    \ as we like, and they'll form an array called permissions. (This is called the\
    \ ... (rest) parameter, in case you want to look it up.)\n> \n> We can then use\
    \ the Array.join() method to combine all the strings in this array into a single\
    \ string, in the form of a comma-separated list.\n\nWe have to change the signature\
    \ of the method in IRequestor.as to match the changes we've made to the function:\n\
