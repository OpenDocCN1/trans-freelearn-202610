- pgno: 280
  md: '# On Facebook


    At time of writing, there are three ways to allow users to access your application
    from within the Facebook website: in an IFrame, through FBML, and in a Page Tab.
    We''ll go through what each of these is, and how to use all of them, in turn.


    # IFrame


    Remember frames? They''re back...


    Back in the nineties, every other website used the HTML <frame> tag to lay out
    their pages. This fashion was eventually dropped in favor of cleaner, bookmark-friendly
    methods, and has not been missed.


    But now frames are back in common usage – or rather, their sister tag the <iframe>
    is.


    An IFrame, or "inline frame," allows you to embed one complete web page entirely
    inside another, even if the two pages are on different servers and domains. If
    you view the source for, say, the FarmVille application page (http://apps.facebook.com/onthefarm/)
    you''ll see that this is the case as shown in the next screenshot:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_280_0.png)'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'The page on the Facebook site is called the Canvas (not to be confused with
    HTML5''s canvas).


    Now, we''ve already got a page hosted on an external host (with an SWF embedded):
    http://host.com/visualizer/index.html. We don''t need to make any changes to this
    page to load it inside an IFrame on Facebook; the settings are all in the Facebook
    Developer application.


    # Time for action – setting up an IFrame application


    Browse to http://www.facebook.com/developers/apps.php and find your application
    in the list. Select it, then click Edit settings. Choose Facebook Integration
    from the menu on the left.


    ![](img/4e826fa36038b86f2087ef8b818d0acf_281_0.png)


    The settings can be seen in the previous screenshot. Here''s what they mean, and
    what to set them to:


    +   ♦ Canvas Page: This is the URL, within Facebook, that users will browse to
    in order to load your application. As we saw above, FarmVille uses http://apps.facebook.com/onthefarm.
    Type something short and descriptive; it doesn''t have to be too clever as users
    are more likely to reach the page through a Facebook Bookmark, rather than by
    typing in the URL. You can change this URL later.

    +   ♦ Canvas URL: This is the URL of the page that gets loaded into the IFrame
    that sits inside the Canvas page. Your application can contain multiple HTML pages
    that the user can navigate between; the Canvas URL is the first page that will
    be loaded. Set this to your application''s URL, that is http://host.com/visualizer/index.html.

    +   ♦ Canvas Type: IFrame or FBML. We''re using IFrame at the moment; we''ll look
    at FBML later in the chapter.'
  merge: -1
  img_proc: true
