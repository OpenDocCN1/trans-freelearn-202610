- pgno: 83
  md: "This page is split into two main sections: **Basic directory information**\
    \ and **Sharing on Facebook**. Take some time to dig in to these and see what\
    \ information can be viewed by whom. You might be surprised at how much information\
    \ about you is available to anyone who cares to look.\n\nWhile customizing your\
    \ settings in either of those pages, you can click on **Preview my Profile** to\
    \ see how your profile will look when viewed by any person you specify.\n\nA few\
    \ pieces of information are always viewable by anyone who's logged in: your name,\
    \ your gender, your profile picture, and your list of networks. Access to everything\
    \ else can be modified.\n\n# What's that got to do with the Graph API?\n\nThat's\
    \ all good to know, but does it affect our application?\n\nTry accessing the profiles\
    \ of all the people you just looked at through their Graph URLs. Remember, if\
    \ their Facebook URL is http://www.facebook.com/username, their Graph URL will\
    \ be https://graph.facebook.com/username; if their Facebook URL is http://www.facebook.com/profile.php?id=12345678,\
    \ their Graph URL will be https://graph.facebook.com/12345678.\n\nYou'll notice\
    \ that the only information you can see is:\n\n+   ◆ Name (and separate fields\
    \ for first name, last name, and so on)\n+   ◆ Profile picture (through https://graph.facebook.com/id/picture)\n\
    +   ◆ Gender\n\nAll this information is publicly available. This is true even\
    \ if you can see extra information on their profile page when logged out.\n\n\
    The Graph API can't detect whether we're logged in to Facebook in another browser\
    \ window, so everything we see here is through the eyes of a logged-out user.\n\
    \nFor instance, here's what my page looks like as shown in the following lines\
    \ of code:\n\n```\n{\n  \"id\": \"«redacted»\",\n  \"name\": \"Michael James Williams\"\
    ,\n  \"first_name\": \"Michael\",\n  \"middle_name\": \"James\",\n  \"last_name\"\
    : \"Williams\",\n  \"gender\": \"male\",\n  \"locale\": \"en_GB\"\n}\n```"
  merge: -1
  img_proc: true
- pgno: 84
  md: "And although you can see a list of connections URLs by adding metadata=1 to\
    \ the URL, trying to access any of them leads to this error:\n\n```\n{\n  \"error\"\
    : {\n    \"type\": \"OAuthAccessTokenException\",\n    \"message\": \"An access\
    \ token is required to request this resource.\"\n  }\n}\n```\n\nBut what is an\
    \ access token?\n\n# Access tokens are proof of authorization\n\nImagine a secure\
    \ building. To get in through the front door, you need to provide the doorman\
    \ with your passport, your driver's license, and your social security number –\
    \ just to prove who you are. Once he's satisfied, he gives you a temporary pass,\
    \ with your name on it, to clip to your jacket.\n\nInside the building, everybody\
    \ trusts the pass. You don't need to risk showing them your important personal\
    \ documents; those only get seen by the doorman.\n\nAn access token is like that\
    \ pass. Facebook gives a logged-in user a string of characters, which says, \"\
    I am this person, and I have logged in,\" and this string can be passed as a parameter\
    \ to a Graph URL to gain access to information that the user is permitted to see.\n\
    \nExcept, that's not the whole story.\n\n# User/Application authorization\n\n\
    There are actually two authorizations required: the user's and the application's.\
    \ It works like this:\n\nJoe User tries to do something in Bill's Cool Application\
    \ that requires the application to access some of Joe's restricted information.\
    \ The application can't access it, so the two of them approach Facebook via the\
    \ Graph API.\n\nThe application says, \"Hey Facebook, I'm Bill's Cool Application,\
    \ and I want to access Joe User's data.\""
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Facebook replies, "First I need to see your ID, to prove that you really are
    Bill''s Cool Application."


    The application says, "Sure thing; here are my credentials."


    Facebook checks them out, and says, "These look okay to me. Wait a minute, how
    do I know that this is the real Joe User, and not some guy in a wig?"


    Joe logs in to Facebook with his e-mail address and password, obscuring them so
    that Bill''s Cool Application never sees them. The application politely looks
    away.


    Facebook says, "Hey Joe, good to see you. Are you happy for Bill''s Cool Application
    to access this data it''s asking for?"


    Joe checks what the application is trying to get, and says, "Yeah, sure, that''s
    fine with me."


    Facebook says, "Great. Okay, Bill''s Cool Application, here''s an access token.
    If you want to access any of Joe''s data, just show me that token when you ask
    for the info and I''ll give it to you."


    The application says, "Cool! So, I can just use this token whenever I want?"


    Facebook says, "Well, no. It will expire within a few hours. After that, you''ll
    have to ask for another one, and you''ll need Joe to be logged in to do that.
    Same deal if Joe logs out; you''ll need to get another token, which means getting
    him to log in again."


    The application says, "That seems a little inconvenient. You mean I have to get
    Joe to say it''s okay for me to access his data every couple of hours?"


    Facebook replies, "Oh, no, no, no. Now that Joe''s said it''s okay for you to
    see his information, I''ll remember that, and won''t bother asking again. And
    I don''t need to see his e-mail and password if he''s already logged in."


    Joe and the application thank Facebook and go off to do whatever it was they wanted
    to do in the first place.


    Of course, the information isn''t passed through the form of a conversation; that
    would be silly. The application credentials are passed to Facebook through a Graph
    URL, while the user give their credentials through a standard Facebook login web
    page. Facebook does not return the access token in a JSON, but through a parameter
    to the application''s URL – this is why your application needs a web host.


    First, you''re probably wondering where we get application credentials from. We
    can''t just make them up; we need to register our application with Facebook first.
    Let''s do that now.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Time for action – registering an application with Facebook


    Sign up to become a Facebook Developer at http://www.facebook.com/developers/.
    Don''t worry; it''s free, and instant.


    You may be asked to verify your Facebook account by entering a valid mobile phone
    number or adding a credit card. You won''t be charged (apart from the cost of
    a standard text message, if you pick that method); this is to ensure that every
    application is connected to a real person.


    On the Developer page, click **Set Up New Application** in the top-right:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_86_0.png)


    You''ll be asked to enter the name of your application. It''s a good idea to use
    your name or your company''s name as part of the application''s name, as this
    makes it more likely to be unique. (You can change the name of the application
    later if you like; this isn''t set in stone.) You''ll also be asked to agree to
    the **Facebook Terms and Conditions** – make sure you read them first.


    ![](img/4e826fa36038b86f2087ef8b818d0acf_86_1.png)'
  merge: -1
