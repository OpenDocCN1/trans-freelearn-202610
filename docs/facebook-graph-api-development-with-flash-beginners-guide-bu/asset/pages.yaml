  md: "# Time for action – displaying the number of objects in a list\n\nOpen your\
    \ `Visualizer` project. We're going to turn on a hidden option that makes the\
    \ title of List Renderer windows contain the number of items in the Graph List.\n\
    \n+   1. First, though, let's switch back from our `SDKRequestor` to our `HTTPRequestor`.\n\
    +      Open `CustomGraphControllerContainer.as` and change the line that creates\
    \ the new Requestor:\n+      ```\n+      public function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    +      {\n+          super(a_graphControlContainer);\n+          _requestor =\
    \ new HTTPRequestor();\n+          addEventListenersToRequestor();\n+        \
    \  //we must wait for the Requestor to initialise before we can do anything else\
    \ with it\n+          _requestor.addEventListener(Event.COMPLETE, onRequestorInitialize);\n\
    +      }\n+      ```\n+      We will come back to the SDK Requestor later in the\
    \ chapter.\n+   \n+   2. There's a slight problem: this class is waiting for the\
    \ Requestor to dispatch a `COMPLETE` event, stating that it has finished initializing,\
    \ but our `HTTPRequestor` does not do this. We could remove the event listener,\
    \ but it'll be easier to modify the Requestor; open `HTTPRequestor.as`, and add\
    \ a new function:\n+      ```\n+      public function initialize():void\n+   \
    \   {\n+          dispatchEvent(new Event(Event.COMPLETE));\n+      }\n+     \
    \ ```\n+   \n+   3. Modify `SDKRequestor.as`, too, moving the call to `Facebook.init()`\
    \ from the constructor function to a new function, `initialize()`:\n+      ```\n\
    +      public function SDKRequestor(target:IEventDispatcher = null)\n+      {\n\
    +          super(target);\n+          //Facebook.init(\"165373950152944\", initComplete);\n\
    +      }\n+   \n+      public function initialize():void\n+      {\n+        \
    \  Facebook.init(\"165373950152944\", initComplete);\n+      }\n+      ```"
