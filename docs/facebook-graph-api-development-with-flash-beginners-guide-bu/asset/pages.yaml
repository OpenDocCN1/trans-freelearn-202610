- pgno: 141
  md: "We should be able to see the 301st – 325th posts in the feed. Try it out. The\
    \ result at the time of writing is as follows:\n\n```\n{\n  \"data\": [\n\n  ]\n\
    }\n```\n\nWait, what?\n\n# What just happened?\n\nThe Graph API puts limitations\
    \ on what can be retrieved from a User's or Page's stream and status updates (which\
    \ includes their feed connection). The official documentation says that these\
    \ connections are limited to the last 30 days or 50 posts, whichever is greater.\n\
    \nThat's not the only problem with the limit-offset parameters. Try loading this\
    \ URL:\n\n```\nhttps://graph.facebook.com/facebook/feed?offset=2&limit=1\n```\n\
    \n...and you'll get the same empty JSON as before – but load this URL:\n\n```\n\
    https://graph.facebook.com/facebook/feed?offset=2&limit=4\n```\n\n...and you'll\
    \ receive exactly one result. However, you can set the limit as high as 6 without\
    \ receiving any additional Objects!\n\nIt doesn't make any sense. And the more\
    \ you look into this, the less logical it appears to be.\n\nThis is an ongoing\
    \ issue; if you would like to keep up-to-date with any changes made in this area,\
    \ subscribe to the official Facebook Bug Tracker thread for it at this link:\n\
    \n```\nhttp://bugs.developers.facebook.net/show_bug.cgi?id=10576\n```\n\n> Of\
    \ course, it's possible that by the time you read this book, these issues will\
    \ have been sorted out. In that case, lucky you!\n\nStill, we can see how limit\
    \ and offset work for other connections."
  merge: -1
