- pgno: 178
  md: "As you can see, there's a new **Search** button in the top-left corner, which\
    \ makes the new **Search** window appear in the main stage area. You'll recognise\
    \ the first six radio buttons as corresponding to allowed values for the `type`\
    \ parameter; don't worry about **My News Feed** or **Friend's Posts** for now.\n\
    \nWhen the **Search** button inside the window is clicked, it calls a function\
    \ called `search()` inside the class that `CustomGraphContainerController.as`\
    \ extends, passing it three values:\n\n+   - Query\n+   - Type\n+   - User ID\
    \ (which contains the value in the lower textbox – again, we'll come to this later)\n\
    \nThis function is completely empty, so clicking that button doesn't do anything\
    \ at the moment; we'll have to override `search()` and make it work!\n\n1. In\
    \ `CustomGraphContainerController.as`, add the following function:\n\n```\noverride\
    \ public function search(a_query:String = \"\", a_type:String = \"\", a_userID:String\
    \ = \"\"):void\n{\n\n}\n```\n\n2. Now to add the actual search code. Let’s start\
    \ with the HTTP Requestor. The process is very similar to requesting a Graph Object\
    \ or Graph List directly – in fact, it's even simpler. Open `HTTPRequestor.as`\
    \ and create a new function as so:\n\n```\npublic function search(a_query:String\
    \ = \"\", a_type:String = \"\"):void\n{\n    var loader:URLLoader = new URLLoader();\n\
    \    var urlRequest:URLRequest = new URLRequest();\n    var variables:URLVariables\
    \ = new URLVariables();\n\n    urlRequest.url = \"https://graph.facebook.com/search\"\
    ;\n\n    variables.metadata = 1;\n    if (accessToken != \"\")\n    {\n      \
    \  variables.access_token = accessToken;\n    }\n    variables.q = a_query;  \
    \  //not variables.query!\n    variables.type = a_type;\n```"
  merge: -1
  img_proc: true
