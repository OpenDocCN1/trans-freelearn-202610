- pgno: 95
  md: '+   2. You proved to Facebook who you were, as a Facebook user, by logging
    in to your account directly through a `Facebook.com` login web page.

    +   3. Facebook asked you if you were happy to let the application access your
    information, and you granted it permission.

    +   4. Facebook passed an access token back to the page that the application specified
    earlier (in this case, it was the Google home page).


    This workflow isn''t unique to Facebook. It''s actually part of the **OAuth 2.0
    protocol**, known as the **User Agent Flow**. This means that once you get the
    hang of the workflow needed to allow an application to authenticate with Facebook,
    you''ll be able to apply that knowledge to write an application that can authenticate
    with any other system that uses OAuth 2.0.


    > The official documentation for the OAuth 2.0 protocol is here: http://tools.ietf.org/html/draft-ietf-oauth-v2-05#section-3.5.


    # Keeping secrets


    It seems odd that we don''t need to pass the **Application Secret** in the Graph
    URL to authenticate. The reasoning is that, if we did pass the secret in that
    way, then the user or another program running on the user''s computer could grab
    it, and use it to masquerade as our application – and remember, the secret is
    analogous to a password. So, the user agent flow lets us authenticate the application
    without using its secret, for unsecure situations such as this.


    It''s still possible for the user or a desktop application to get hold of the
    access token and use it to pretend to be the user, logged into our application.
    But there''s no point in the user doing this (as any information he could access
    using this, he could already access via the Facebook web site anyway), and as
    for desktop applications, well, that''s just part of the everyday risk of running
    a computer, along with viruses and spyware.


    # What did Facebook give us?


    Check out the URL that Facebook redirected us to after authentication:


    ```

    http://google.com/#access_token=123675230995389%7C2.hX2Png6g2LUuczfd4tLPbQ__.3600.1276960311-169573433058884%7C8BAAidDt1t8fulZHA3bC3YxcCwM.&expires_in=6561

    ```


    There are two parameters: `access_token` and `expires_in`.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'The second parameter tells us the number of seconds until the access token
    expires. It seems like a random number, but there is a pattern: if we request
    a token at 14:32:07, it will expire at 16:00:00; one requested at 9:15:34 will
    expire at 11:00:00. Add two hours to the token''s generation time, knock off the
    minutes and seconds, and you''ll find the expiration time.


    At first glance, the access token appears to be a mess of characters. Actually,
    it contains some useful information.


    First, you should know that %7C is code for a "pipe" character, |, which allows
    it to be passed in a URL. So replace both the %7Cs with pipes:


    ```

    123675230995389|2i.hX2Png6g2LUuczfd4tLPbQ__.3600.1276960311-169573433058884|8BAAidDtl8fulZHA3bC3YxcCwM.

    ```


    There are three useful pieces of information in here:


    +   1. The Application ID: the number before the first pipe – 123675230995389
    in this case.

    +   2. The ID of the current user: before the last pipe, after the dash – 169573433058884
    in this case.

    +   3. The expiry time: before the user ID – 1276960311 in this case. This is
    given in Unix time.


    The Unix time system describes points in time as the number of seconds since January
    1st, 1970, at midnight UTC, ignoring leap seconds. It provides a simple way to
    encode any point in time (since 1970) as a single integer.


    The website UnixTime.info contains a simple converter for switching between Unix
    timestamps and conventional date formats.


    > In AS3, the Date class can be used to convert between the two time formats.
    Pass the Date() constructor a value epochTime*1000 as its first parameter to initiate
    the Date with that time. The time property of a Date object will return a date
    in Unix format, albeit multiplied by 1000 as Flash uses milliseconds as its base
    time unit.


    This means that, given any access token, you can find out which user requested
    it, when it''s going to expire, and which application it''s for – try browsing
    to https://graph.facebook.com/your_application_id.'
  merge: -1
  img_proc: true
