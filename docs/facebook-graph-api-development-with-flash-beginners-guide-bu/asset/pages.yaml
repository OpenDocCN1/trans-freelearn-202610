- pgno: 175
  md: "# Differences\n\nHowever, even when authenticated, the results we get through\
    \ a Graph URL search don't always match the results we see in a Full Search. This\
    \ is particularly true when looking for people; by default, all apps are able\
    \ to access an authenticated user's friends' names and IDs, but other information\
    \ may be hidden.\n\nFor example, by entering an e-mail address as the query in\
    \ a User search, we can find anyone with that exact email address – unless they've\
    \ noted in their privacy settings that they don't want that information to be\
    \ available to other apps. (See also the options in Account | Privacy Settings\
    \ | Applications and websites | Information accessible through your friends, as\
    \ described in Chapter 3.)\n\nSometimes this will cut particular results out entirely;\
    \ sometimes it will make the same results appear, but in a different order. Remember\
    \ this when testing: If the results you get when searching through your application\
    \ are different from those you get when searching through the web site, that doesn't\
    \ necessarily mean there's a bug in your application.\n\n# Restrictions\n\nThe\
    \ sub-options available when searching via a Graph URL are very limited when compared\
    \ to the Full Search. We can't filter Users by their location or school, Groups\
    \ by their type, or Events by their date (even using since/until paging).\n\n\
    Nor can we restrict Posts to a specific language, which makes them far less useful\
    \ than they might be (as we saw when searching for \"Packt\", a common German\
    \ word). But we can do something similar.\n\nThere is a parameter called locale\
    \ which accepts languages like \"en_US\" (for US English) and \"fr_FR\" (for French).\
    \ This can be used in two ways.\n\nFirst, we can use it to transform information\
    \ that we receive. For example, here's Facebook CTO Bret Taylor's User object:\n\
    \n```\nhttps://graph.facebook.com/btaylor\n{\n  \"id\": \"220439\",\n  \"name\"\
    : \"Bret Taylor\",\n  \"first_name\": \"Bret\",\n  \"last_name\": \"Taylor\",\n\
    \  \"link\": \"http://www.facebook.com/btaylor\",\n  \"gender\": \"male\",\n \
    \ \"locale\": \"en_US\"\n}\n```"
  merge: -1
  img_proc: true
- pgno: 176
  md: "In the next code snippet, we have the User object with the locale set to French:\n\
    \n```\nhttps://graph.facebook.com/btaylor?locale=fr_FR\n{\n  \"id\": \"220439\"\
    ,\n  \"name\": \"Bret Taylor\",\n  \"first_name\": \"Bret\",\n  \"last_name\"\
    : \"Taylor\",\n  \"link\": \"http://www.facebook.com/btaylor\",\n  \"gender\"\
    : \"homme\",\n  \"locale\": \"en_US\"\n}\n```\n\nNot much has changed – except\
    \ the value of gender, which has gone from male to homme. This is useful if you\
    \ need to make basic information available in different languages, without hiring\
    \ a translator.\n\nSecond, notice that Bret's locale is set to en_US. All users\
    \ have a locale; it can be set in Account | Language, and defines which language\
    \ you view the Facebook website in. We can filter Post search results to only\
    \ show results from users that have a certain locale, using the following Graph\
    \ URL :\n\n```\nhttps://graph.facebook.com/search?type=post&q=test&locale=fr_FR\n\
    ```\n\nIt's not quite the same as searching for posts in a specified language\
    \ – so we can't eliminate all the results that use \"Packt\" as part of a German\
    \ sentence – but it's close. And this is the same sub-option that we can set in\
    \ the Posts searches in the Full Search.\n\nA full list of locales is available\
    \ at http://www.facebook.com/translations/FacebookLocales.xml.\n\nA sample is\
    \ as follows:\n\n```\n<?xml version='1.0'?>\n<locales>\n  <locale>\n    <englishName>Catalan</englishName>\n\
    \    <codes>\n      <code>\n        <standard>\n          <name>FB</name>\n  \
    \        <representation>ca_ES</representation>\n        </standard>\n      </code>\n\
    \    </codes>\n  </locale>\n</locales>\n```\n\nThere are some peculiar choices\
    \ in there, like English (Upside-Down), so take a look."
  merge: -1
  img_proc: true
- pgno: 177
  md: "# Time for action – implementing a Search window in the Visualizer\n\nOkay,\
    \ now that we know what we can do with the Graph URL search, let's use it in our\
    \ application.\n\nThe Visualizer project includes a window with UI elements for\
    \ searching the Graph. It's hidden, but we can enable it in the same way that\
    \ we enabled the Filter panel on the List Renderers.\n\nLoad the Visualizer project\
    \ and open CustomGraphContainerController.as. In the constructor function, set\
    \ the _canShowSearchUI property (which is inherited from the class that CustomGraphContainerController\
    \ extends) to true:\n\n```\npublic function CustomGraphContainerController\n(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    this._showListCounts = true;\n   \
    \ this._showListFilters = true;\n    this._canShowSearchUI = true;\n    _requestor\
    \ = new HTTPRequestor();\n    addEventListenersToRequestor();\n    //we must wait\
    \ for the Requestor to initialise before we can do\n    //anything else with it\n\
    \    _requestor.addEventListener(Event.COMPLETE, onRequestorInitialize);\n   \
    \ _requestor.initialize();\n}\n```\n\nCompile the project, upload the SWF to your\
    \ web host, and load it in your browser using the usual URL. The result is shown\
    \ in the next screenshot:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_177_0.png)"
  merge: -1
