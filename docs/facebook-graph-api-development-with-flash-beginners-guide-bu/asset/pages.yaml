- pgno: 101
  md: "It works just as we'd expect. (Remember, HTTPRequestor is passing the access\
    \ token as a parameter to all Graph URLs requested.)\n\nTake a look at what's\
    \ loaded when we request the user profile:\n\n```\nhttps://graph.facebook.com/your_user_id?access_token=«your_access_token»&metadata=1\n\
    {\n  \"id\": \"169573433058884\",\n  \"name\": \"Michael James Williams\",\n \
    \ \"first_name\": \"Michael\",\n  \"middle_name\": \"James\",\n  \"last_name\"\
    : \"Williams\",\n  \"link\": \"http://www.facebook.com/«redacted»\",\n  \"about\"\
    : \"Twitter: @MichaelJW\",\n  \"gender\": \"male\",\n  \"timezone\": 1,\n  \"\
    locale\": \"en_GB\",\n  \"verified\": true,\n  \"updated_time\": \"2010-06-16T20:38:01+0000\"\
    ,\n  \"metadata\": {\n    \"connections\": {\n      \"home\": \"https://graph.facebook.com/«redacted»/home?access_token=«your_access_token»\"\
    ,\n      \"feed\": \"https://graph.facebook.com/«redacted»/feed?access_token=«your_access_token»\"\
    ,\n      \"friends\": \"https://graph.facebook.com/«redacted»/friends?access_token=«your_access_token»\"\
    ,\n      «...some datacut out here, for length...»\n    }\n  },\n  \"type\": \"\
    user\"\n}\n```\n\nNotice that the Graph URLs in the connections list already have\
    \ the access_token parameter filled in. The Visualizer's code doesn't use these\
    \ Graph URLs – it constructs them using the form https://graph.facebook.com/<id_of_object>/<name_of_connection>\
    \ – but this knowledge may come in useful for your own projects.\n\nAs you can\
    \ see from the Visualizer, the friends connection Graph List only includes very\
    \ basic information: the users' IDs and names. However, much more information\
    \ is loaded in the full Graph Objects of your friends – though the exact amount\
    \ depends on your friends' privacy settings."
  merge: -1
  img_proc: true
- pgno: 102
  md: "# Let Me In!\n\nTo see how much information your friends can access about you\
    \ through applications, log in to the Facebook website, click on Account | Privacy\
    \ Settings, select Edit your settings for using applications, games and websites,\
    \ and view the settings for Information accessible through your friends:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_102_0.png)\n\
    \n# That's cheating!\n\nOkay, fine, generating an access token in the browser\
    \ and then pasting it directly into the source code is not a great way of handling\
    \ authentication. We need to obtain an access token in our application itself.\n\
    \n# Time for action – authenticating through the application\n\nWhen authenticating\
    \ in the browser, we visit https://graph.facebook.com/oauth/authorize?client_id=<your_application_id>&redirect_uri=http://google.com&type=user_agent,\
    \ so let's start by loading that URL in our code.\n\nStart by creating a new function,\
    \ attemptToAuthenticate(), in HTTPRequestor.as:\n\n```\npublic function attemptToAuthenticate():void\n\
    {\n    var loader:URLLoader = new URLLoader();\n    var urlRequest:URLRequest\
    \ = new URLRequest();\n```"
  merge: -1
  img_proc: true
- pgno: 103
  md: "```\nvar variables:URLVariables = new URLVariables();\n\nurlRequest.url = \"\
    https://graph.facebook.com/oauth/authorize\";\nvariables.client_id = \"«your_application_id»\"\
    ;\nvariables.type = \"user_agent\";\nvariables.redirect_uri = \"http://google.com\"\
    ;\nurlRequest.data = variables;\n\nloader.addEventListener(Event.COMPLETE, onAuthenticationComplete);\n\
    loader.addEventListener(IOErrorEvent.IO_ERROR, onIOError);\nloader.load(urlRequest);\n\
    }\n```\n\nMake sure that you replace «your_application_id» with your actual application\
    \ ID.\n\nWe're using the same IO_ERROR handler function as when we load a Graph\
    \ object, but we need a new function, onAuthenticationComplete(), for when the\
    \ loading has finished; add it to HTTPRequestor.as:\n\n```\nprivate function onAuthenticationComplete(a_event:Event):void\n\
    {\n    trace(\"Authentication complete\");\n    var loader:URLLoader = URLLoader(a_event.target);\n\
    \    trace(loader.data);\n}\n```\n\nNothing complicated there; it will trace whatever\
    \ gets sent back.\n\nIn CustomGraphContainerController.as, let's change the constructor\
    \ function so that it kicks this authentication off instead of loading a user\
    \ profile:\n\n```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    _requestor = new HTTPRequestor();\n\
    \    addEventListenersToRequestor();\n    _requestor.attemptToAuthenticate();\n\
    \    //_requestor.request(new GraphRequest(\"«your_user_id»\"));\n}\n```\n\nBefore\
    \ this can work, we need to add the function to the IRequestor interface. Modify\
    \ \\src\\graph\\apis\\base\\IRequestor.as to:\n\n```\npackage graph.apis.base\n\
    {\n    import flash.events.IEventDispatcher;\n```"
  merge: -1
  img_proc: true
- pgno: 104
  md: "```\nimport graph.GraphRequest;\n\npublic interface IRequestor extends IEventDispatcher\n\
    {\n    function request(a_request:GraphRequest):void;\n    function attemptToAuthenticate():void;\n\
    }\n}\n```\n\nTest it. What gets traced? A lot of HTML, which (when pasted into\
    \ a blank .html file and opened in a browser) looks like this:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_104_0.png)\n\
    \n> If you get an error, or no data returned at all, load the URL in your browser\
    \ to see what error message is returned. Make sure that all the properties of\
    \ your URLVariables object are set correctly.\n\n# What just happened?\n\nOh,\
    \ right, we need to log in first. But here's a problem: since we're loading the\
    \ URL inside Flash Player, rather than in a browser, we don't have access to the\
    \ browser cookies, so Facebook can't remember who we are and directs us to the\
    \ login page. Of course, since we're not in a browser, we can't actually see the\
    \ page!\n\nWe could write code to create a Flash login form, and post the user's\
    \ e-mail address and password to the real Facebook login form, but why would the\
    \ user trust our application not to hijack their data?"
  merge: -1
  img_proc: true
- pgno: 105
  md: '# A different approach


    There are a few ways around this, depending on whether we''re using AIR or Flash
    Player. In this chapter, we''ll use the simplest method: embedding the SWF in
    a web page and using JavaScript to open the login page and pass the access token
    back to Flash Player.


    # Time for action – authenticating via JavaScript


    Here''s what is going to happen:


    +   1. We''ll embed our application''s SWF in a web page, and load the page in
    a browser.

    +   2. The application will call a JavaScript function inside the web page, telling
    it to load the "authorize" URL in a new browser window.

    +   3. The new window may ask us to log in; once we''re authenticated, it''ll
    redirect to the Redirect URI page, just as when we used it earlier.

    +   4. This time, however, we''ll have changed the Redirect URI page to one that
    we control (rather than using the Google home page). It will obtain the access
    token and pass it back to a JavaScript function in the page containing our application''s
    SWF.

    +   5. That JavaScript function will pass the access token to an AS3 function
    in our application, which will then be able to use it everywhere.


    For this to work, the web page that Facebook redirects us to (in Step 4, containing
    the SWF) needs to be online. That means we need to have a web host. See Chapter
    1 for details on setting one up.


    Publish your project for the web, so that you end up with a web page containing
    the Visualizer SWF – again, the method for doing this is outlined in Chapter 1
    – and upload it to your host. Let''s suppose that the web page is called `index.html`,
    and that you uploaded all the files to `http://host.com/visualizer/`.


    Load `http://host.com/visualizer/index.html` in your browser. You''ll see, well,
    nothing much, because the application is still set to try to authenticate rather
    than loading any data, and it''s failing at that. But if you look in the top-left-hand
    side corner, you should see the familiar UI controls: **Zoom In**, **Zoom Out**,
    and **Reset View**. (If you see "Movie Not Loaded", check that your HTML page
    is set to load the correct SWF, and that you uploaded all of the files to the
    web host, rather than just `index.html`.)'
  merge: -1
  img_proc: true
- pgno: 106
  md: "To open a new window containing the Facebook login page, we need to run this\
    \ JavaScript code from inside index.html:\n\n```\nwindow.open('https://graph.facebook.com/oauth/authorize?client_id=«your_application_id»&redirect_uri=http://google.com&type=user_agent',\
    \ '«window_name»', 'height=370,width=670');\n```\n\nYou can probably guess what\
    \ the code does, as JavaScript syntax is very similar to ActionScript; it loads\
    \ a pop-up window, with the height, width, and URL specified. The «window_name»\
    \ parameter is a value we can use to refer to the window later.\n\nWe could put\
    \ this code inside the HTML of the page. However, rather than risk messing up\
    \ the SWF embedding code (and to make our SWF a little more flexible), we'll use\
    \ ExternalInterface to inject it into the page from our SWF instead.\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_106_0.png)\n\
    \n> The flash.external.ExternalInterface class allows ActionScript code within\
    \ an SWF to communicate with JavaScript code within an HTML page containing that\
    \ SWF. This means that the SWF can call JavaScript methods, and vice-versa.\n\n\
    Open HTTPRequestor.as and import the ExternalInterface class:\n\n```\nimport flash.external.ExternalInterface;\n\
    ```\n\nNow, remove all the code we put in attemptToAuthenticate() earlier, and\
    \ replace it with an ExternalInterface call:\n\n```\npublic function attemptToAuthenticate():void\n\
    {\n    ExternalInterface.call(\"window.open\",\n        \"https://graph.facebook.com/oauth/authorize?client_id=«your_application_id»&type=user_agent&redirect_uri=http://google.com\"\
    \n        \"facebookLoginWindow\",\n        \"height=370, width=600\");\n}\n```\n\
    \nThis will call the JavaScript function from above, passing it the three arguments\
    \ needed. Note that I've given the pop-up window a name of facebookLoginWindow\
    \ in case we need to refer to it in code later.\n\nCompile your SWF (avoid testing\
    \ it in the standalone Flash Player, as it won't be able to access ExternalInterface\
    \ outside of a browser) and upload it to your web host, overwriting the previous\
    \ one. Then, refresh index.html in your browser."
  merge: -1
  img_proc: true
- pgno: 107
  md: "> The pop-up window will probably be blocked. To prevent you from being able\
    \ to load a million pop-up windows automatically, pop ups opened by a call to\
    \ `window.open()` are blocked by the browser, unless the call comes from within\
    \ the handler of a `MOUSE_CLICK` event.\n> Feel free to add a \"log in\" button\
    \ to the application and move the contents of the `attemptToAuthenticate()` function\
    \ to the buttons click handler function; I'm just going to click on **Allow pop\
    \ ups** in my browser.\n\nOnce the pop up is working, you'll either see the Facebook\
    \ login page or the Google home page, depending on whether you're currently logged\
    \ in to Facebook. To make sure you can see the login page, log out of Facebook,\
    \ or load `index.html` in Private browsing mode. Eventually, you'll see the next\
    \ screenshot:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_107_0.png)\n\n# Creating\
    \ a callback web page\n\nOnce you log in, you'll be redirected to Google. However,\
    \ we need the page that the user is redirected to – the **callback** webpage –\
    \ to be one that we control, so that we can put some JavaScript inside it to grab\
    \ the access token and pass it back to our application.\n\nCreate a new HTML page,\
    \ `callback.html`, and enter the following code:\n\n```\n<html>\n<head>\n  <script\
    \ type=\"text/javascript\">\n  <!--\n  window.opener.setAccessToken(window.location.hash);\n\
    \  //-->\n\n```"
  merge: -1
  img_proc: true
- pgno: 108
  md: "# Let Me In!\n\n```\n</script>\n</head>\n<body>\n<h2>Close this window</h2>\n\
    <p>The access token has been passed back to index.html.</p>\n</body>\n</html>\n\
    ```\n\nYou may later want this window to close automatically once it's done its\
    \ job. This is simple to do: just add another line to the JavaScript as shown\
    \ in the following code:\n\n```\n<script type=\"text/javascript\">\n<!--\n   \
    \ window.opener.setAccessToken(window.location.hash);\n    self.close();\n//-->\n\
    </script>\n```\n\nI've highlighted the most important line; this finds the window\
    \ that opened the pop up, and calls a JavaScript function named setAccessToken()\
    \ inside that window's page, passing it the \"hash\" of the pop up's URL (everything\
    \ after the # character). Remember, the pop up's URL will be :\n\n```\nhttp://www.google.com/#access_token=123675230995389%7C2._X2CYJw2h7tOH9T9i7tkCg__.3600.1277610200-169573433058884%7Cy3fkK9oobNvC6DS\
    \ SFChUVFeJrMO, so the hash will contain the access token.\n```\n\nWe need to\
    \ write that setAccessToken() function – but first, let's make this the official\
    \ callback webpage. Upload callback.html to the same directory as index.html on\
    \ your web host, then go to the Facebook Developers page and edit your application's\
    \ settings.\n\nIn the Web Site tab, enter the base domain name of your host into\
    \ the Site URL box. For instance, if your callback.html page is at http://host.com/visualizer/callback.html,\
    \ enter http://host.com/.\n\nNow, in HTTPRequestor.as, in your attemptToAuthenticate()\
    \ function, change the redirect_uri parameter of the URL to point to callback.html:\n\
    \n```\npublic function attemptToAuthenticate():void\n{\n    ExternalInterface.call(\"\
    window.open\",\n        \"https://graph.facebook.com/oauth/authorize?\n      \
    \      client_id=165373950152944&type=user_agent&redirect_uri=\n            http://host.com/visualizer/callback.html\"\
    \n        \"facebookLoginWindow\",\n        \"height=370, width=600\");\n}\n```"
  merge: -1
  img_proc: true
- pgno: 109
  md: "Recompile your application, and upload it to your web host, overwriting the\
    \ old version. Refresh `index.html` in your browser. You should see the pop up\
    \ appear, and (once you've logged in) it will load `callback.html`:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_109_0.png)\n\
    \nIt's telling a lie at the moment, though. The access token hasn't been passed\
    \ back, because there's no `setAccessToken()` function to pass it back to!\n\n\
    # Receiving the access token\n\nUsing `ExternalInterface`, we can allow JavaScript\
    \ inside `index.html` to call an ActionScript function inside our SWF.\n\n+  \
    \ 1. Let's create an ActionScript function that will take the hash value and extract\
    \ the access token from it.\n+   2. Add this new function to `HTTPRequestor.as`:\n\
    \n```\nprivate function setAccessToken(a_hashValue:String):void\n{\n    var hashParams:Array\
    \ = a_hashValue.substr(1).split(\"&\");\n    var hashKeyAndValue:Array;\n\n  \
    \  for (var i:int = 0; i < hashParams.length; i++)\n    {\n        hashKeyAndValue\
    \ = (hashParams[i] as String).split(\"=\");\n        if (hashKeyAndValue[0] ==\
    \ \"access_token\")\n        {\n            this.accessToken = hashKeyAndValue[1];\n\
    \            break;\n        }\n    }\n    this.request(new GraphRequest(\"me\"\
    ));\n}\n```"
  merge: -1
  img_proc: true
