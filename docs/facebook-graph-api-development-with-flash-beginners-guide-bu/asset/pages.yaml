- pgno: 40
  md: "That's how website users view the information. How will our code \"see\" it?\
    \ Take a look at how the Graph API represents Packt Publishing's Page by pointing\
    \ your web browser at https://graph.facebook.com/PacktPub. This is called a Graph\
    \ URL – note that it's the same URL as the Page itself, but with a secure https\
    \ connection, and using the graph sub domain, rather than www.\n\nWhat you'll\
    \ see is as follows:\n\n```\n{\n  \"id\": \"204603129458\",\n  \"name\": \"Packt\
    \ Publishing\",\n  \"picture\": \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs302.ash1/23274_204603129458_7460_s.jpg\"\
    ,\n  \"link\": \"http://www.facebook.com/PacktPub\",\n  \"category\": \"Products_other\"\
    ,\n  \"username\": \"PacktPub\",\n  \"company_overview\": \"Packt is a modern,\
    \ IT focused book publisher, specializing in producing cutting-edge books for\
    \ communities of developers, administrators, and newbies alike.\\n\\nPackt published\
    \ its first book, Mastering phpMyAdmin for MySQL Management in April 2004.\",\n\
    \  \"fan_count\": 412\n}\n```\n\n# What just happened?\n\nYou just fetched the\
    \ Graph API's representation of the Packt Publishing Page in your browser.\n\n\
    The Graph API is designed to be easy to pick up – practically self-documenting\
    \ – and you can see that it's a success in that respect. It's pretty clear that\
    \ the previous data is a list of fields and their values.\n\nThe one field that's\
    \ perhaps not clear is id; this number is what Facebook uses internally to refer\
    \ to the Page. This means Pages can have two IDs: the numeric one assigned automatically\
    \ by Facebook, and an alphanumeric one chosen by the Page's owner. The two IDs\
    \ are equivalent: if you browse to https://graph.facebook.com/204603129458, you'll\
    \ see exactly the same data as if you browse to https://graph.facebook.com/PacktPub.\n\
    \n# Have a go hero – exploring other objects\n\nOf course, the Packt Publishing\
    \ Page is not the only Page you can explore with the Graph API in your browser.\
    \ Find some other Pages through the Facebook website in your browser, then, using\
    \ the https://graph.facebook.com/id format, take a look at their Graph API representations.\
    \ Do they have more information, or less?"
  merge: -1
  img_proc: true
- pgno: 41
  md: "Next, move on to other types of Facebook objects: personal profiles, events,\
    \ groups. For personal profiles, the id may be alphanumeric (if the person has\
    \ signed up for a custom Facebook Username at http://www.facebook.com/username/),\
    \ but in general the id will be numeric, and auto-assigned by Facebook when the\
    \ user signed up.\n\nFor certain types of objects (like photo albums), the value\
    \ of id will not be obvious from the URL within the Facebook website; we'll look\
    \ at how to find these later in the chapter.\n\nIn some cases, you'll get an error\
    \ message, like:\n\n```\n{\n  \"error\": {\n    \"type\": \"OAuthAccessTokenException\"\
    ,\n    \"message\": \"An access token is required to request this resource.\"\n\
    \  }\n}\n```\n\nAgain, we'll look at what this means and how to get around it\
    \ later in the book.\n\n# Accessing the Graph API through AS3\n\nNow that you've\
    \ got an idea of how easy it is to access and read Facebook data in a browser,\
    \ we'll see how to fetch it in AS3.\n\n# Time for action – retrieving a Page's\
    \ information in AS3\n\nSet up the project from the Chapter 2 start files, as\
    \ explained in Chapter 1. Check that the project compiles with no errors (there\
    \ may be a few warnings, depending on your IDE). You should see a 640 x 480 px\
    \ SWF, all white, with just three buttons in the top-left corner: Zoom In, Zoom\
    \ Out, and Reset View:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_41_0.png)\n\
    \nThis project is the basis for a Rich Internet Application (RIA) that will be\
    \ able to explore all of the information on Facebook using the Graph API. All\
    \ the code for the UI is in place, just waiting for some Graph data to render.\
    \ Our job is to write code to retrieve the data and pass it on to the renderers."
  merge: -1
  img_proc: true
- pgno: 42
  md: "I'm not going to break down the entire project and explain what every class\
    \ does, as the focus of this book is on using Facebook with Flash, not on building\
    \ RIAs. What you need to know at the moment is a single instance of the `controllers.CustomGraphContainerController`\
    \ class is created when the project is initialized, and it is responsible for\
    \ directing the flow of data to and from Facebook. It inherits some useful methods\
    \ for this purpose from the `controllers.GCController` class; we'll make use of\
    \ these later on.\n\nOpen the `CustomGraphContainerController` class in your IDE.\
    \ It can be found in `\\src\\controllers\\CustomGraphContainerController.as`,\
    \ and should look like the listing below:\n\n```\npackage controllers\n{\n   \
    \ import ui.GraphControlContainer;\n\n    public class CustomGraphContainerController\
    \ extends GCController\n    {\n\n        public function CustomGraphContainerController\n\
    \            (a_graphControlContainer:GraphControlContainer)\n        {\n    \
    \        super(a_graphControlContainer);\n        }\n\n    }\n}\n```\n\nThe first\
    \ thing we'll do is grab the Graph API's representation of Packt Publishing's\
    \ Page via a Graph URL, like we did using the web browser. For this we can use\
    \ a `URLLoader`.\n\n> The `URLLoader` and `URLRequest` classes are used together\
    \ to download data from a URL. The data can be text, binary data, or URL-encoded\
    \ variables.\n> The download is triggered by passing a `URLRequest` object, whose\
    \ `url` property contains the requested URL, to the `load()` method of a `URLLoader`.\n\
    > Once the required data has finished downloading, the `URLLoader` dispatches\
    \ a `COMPLETE` event. The data can then be retrieved from its `data` property."
  merge: -1
  img_proc: true
- pgno: 43
  md: "Modify CustomGraphContainerController.as like so (the highlighted lines are\
    \ new):\n\n```\npackage controllers\n{\n    import flash.events.Event;\n    import\
    \ flash.net.URLLoader;\n    import flash.net.URLRequest;\n    import ui.GraphControlContainer;\n\
    \n    public class CustomGraphContainerController extends GCController\n    {\n\
    \n        public function CustomGraphContainerController\n            (a_graphControlContainer:GraphControlContainer)\n\
    \        {\n            super(a_graphControlContainer);\n\n            var loader:URLLoader\
    \ = new URLLoader();\n            var request:URLRequest = new URLRequest();\n\
    \            //Specify which Graph URL to load\n            request.url = \"https://graph.facebook.com/PacktPub\"\
    ;\n            loader.addEventListener(Event.COMPLETE,\n                onGraphDataLoadComplete);\n\
    \            //Start the actual loading process\n            loader.load(request);\n\
    \        }\n\n        private function onGraphDataLoadComplete(a_event:Event):void\n\
    \        {\n            var loader:URLLoader = a_event.target as URLLoader;\n\
    \            //obtain whatever data was loaded, and trace it\n            var\
    \ graphData:String = loader.data;\n            trace(graphData);\n        }\n\n\
    \    }\n}\n```\n\nAll we're doing here is downloading whatever information is\
    \ at https://graph.facebook.com/PacktPub and tracing it to the output window."
  merge: -1
  img_proc: true
- pgno: 44
  md: "Test your project, and take a look at your output window. You should see the\
    \ following data:\n\n```\n{\"id\":\"204603129458\",\"name\":\"Packt Publishing\"\
    ,\"picture\":\"http:\\\\\\\\profile.ak.fbcdn.net\\\\hprofile-ak-snc4\\\\hs302.ash1\\\
    \\23274_204603129458_7460_s.jpg\",\"link\":\"http:\\\\\\\\www.facebook.com\\\\\
    PacktPub\",\"category\":\"Products_other\",\"username\":\"PacktPub\",\"company_overview\"\
    :\"Packt is a modern, IT focused book publisher, specializing in producing cutting-edge\
    \ books for communities of developers, administrators, and newbies alike.\\n\\\
    nPackt published its first book, Mastering phpMyAdmin for MySQL Management in\
    \ April 2004.\",\"fan_count\":412}\n```\n\nIf you get an error, check that your\
    \ code matches the previously mentioned code. If you see nothing in your output\
    \ window, make sure that you are connected to the Internet. If you still don't\
    \ see anything, it's possible that your security settings prevent you from accessing\
    \ the Internet via Flash, so check those.\n\n# What just happened?\n\nThe line\
    \ breaks and tabulation between values have been lost, and some characters have\
    \ been escaped, making it hard to read... but you can see that this is the same\
    \ data as we obtained when browsing to https://graph.facebook.com/PacktPub. No\
    \ surprise here; that's all the URLLoader does.\n\nThe data's not very useful\
    \ to us in that form. In order to do something with it, we need to convert it\
    \ to an object that we can interact with natively in AS3.\n\nThe format which\
    \ Graph API uses is called JSON (JavaScript Object Notation; pronounced \"Jason\"\
    ).\n\nJSON is a human-readable, text-based data format standard. It allows you\
    \ to represent objects as key-value pairs, like so:\n\n```\n{\n  \"key1\": \"\
    value1\",\n  \"key2\": \"value2\",\n  \"key3\": \"value3\"\n}\n```\n\nThe values\
    \ can be strings (enclosed in quote marks), or numbers, Boolean values, or null\
    \ (not enclosed in quote marks)."
  merge: -1
  img_proc: true
- pgno: 45
  md: "JSON objects can also contain arrays, using square brackets:\n\n```\n{\n  \"\
    key1\": \"value1\",\n  \"array\":\n  [\n    \"First item in array\",\n    \"Second\
    \ item in array\",\n    \"Third item in array\"\n  ]\n}\n```\n\nThey can even\
    \ contain other JSON objects, by nesting curly braces:\n\n```\n{\n  \"key1\":\
    \ \"value1\",\n  \"subObject\":\n  {\n    \"subKey1\": \"subValue1\",\n    \"\
    subKey2\": \"subValue2\",\n  }\n}\n```\n\nThese sub-objects can contain other\
    \ objects and arrays, and arrays can contain other objects or arrays, too.\n\n\
    Note that this is very similar to the AS3 syntax for declaring an object:\n\n\
    ```\nvar as3Object:Object = {\n  key1:\"value1\",\n  key2:\"value2\",\n  subObject:{\n\
    \    subKey1:\"subValue1\"\n  },\n  myArray:[1, 2, 3]\n}\n```\n\nFor more information,\
    \ check out http://www.json.org.\n\nUnlike with XML, AS3 has no native features\
    \ for handling JSON objects – but there is an officially supported library that\
    \ does."
  merge: -1
  img_proc: true
- pgno: 46
  md: <!-- no content -->
