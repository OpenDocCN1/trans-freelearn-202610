- pgno: 158
  md: '# Have a go hero – creating a Compound Object based on results from a List


    Revisit what we looked at earlier—finding people that posted on your wall on your
    last birthday – but this time, request and render a Compound Object containing
    all of those User objects.


    This is a big challenge: the best place to do this is not inside the Visualizer
    itself, but inside a brand new project. Can you create a project from scratch
    that can do this? Naturally, you can re-use any of the useful classes from Visualizer,
    like the Requestors and the ExtendedPermissions class.


    # Summary


    Paging means splitting a long collection of data into multiple smaller components,
    called Pages. Do not confuse this type of page with a Facebook Page Object or
    a web page.


    +   - The number of records in a page can be set using a parameter called `limit`.
    The default value for `limit` is 25.

    +   - The `offset` parameter can be used to specify the first object in the collection
    that should be returned. The default value for `offset` is 0.

    +   - Pages can be defined by combining `offset` and `limit` parameters – although
    the Graph API is a little unstable on that point at time of writing.

    +   - The `since` and `until` parameters filter a Graph List to a specified range
    of dates and times.

    +   - Dates and times can be written in a wide range of formats; see http://www.php.net/manual/en/datetime.formats.php
    for a full list.

    +   - All four parameters – `limit`, `offset`, `since`, and `until`– can be used
    together at the same time.

    +   - To specify these parameters via a Graph URL, simply pass them as URL parameters,
    or using an instance of the AS3 `URLVariables` class.

    +   - To specify these parameters via the SDK, include them as properties of an
    object, passed as the third parameter to the `Facebook.api()` function.

    +   - Graph Lists, returned as JSON objects, have a property called `paging`,
    which contains URLs for the next and previous pages of data. These URLs use `since-until`
    paging, rather than `limit-offset`.

    +   - A **Compound Object** can be obtained using a Graph URL of this format:
    `https://graph.facebook.com/?ids=id1,id2,id3,...`. This contains multiple objects
    in a similar JSON format to a Graph List, but with no `data` node.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'We''ve learned how to dig deeper into the Graph, revealing more about Graph
    Objects and connections whose IDs we already know, but what about finding Graph
    Objects based on their contents, rather than their IDs? In the next chapter, we''ll
    learn about searching the Graph to do just that.


    # Pop Quiz


    +   1. Why does Facebook split Graph Lists into pages by default, rather than
    just providing all of the data at once whenever it''s requested?

    +      a. Facebook only retains the last week''s worth of information in its data
    banks

    +      b. It''s a compromise between speed of access and amount of information
    provided

    +      c. Privacy concerns

    +   2. What do the parameters `limit`, `offset`, `since`, and `until` do?

    +      a. Allow you to narrow down the results returned from a collection

    +      b. Restrict user access to a Graph Object for a certain time period

    +   3. When paging, why is it better to use the "next" and "previous" URLs from
    a Graph List''s JSON object, rather than constructing your own URLs using `limit`
    and `offset`?

    +      a. Date-based paging gives finer control of which posts to request

    +      b. Date-based paging means Graph Objects won''t be missed out between pages

    +      c. Date-based paging means Graph Objects won''t be missed out if created
    or removed while paging'
  merge: -1
  img_proc: true
