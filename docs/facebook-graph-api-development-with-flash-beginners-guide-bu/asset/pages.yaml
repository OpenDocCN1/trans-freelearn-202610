- pgno: 212
  md: "When publishing, we need to pass a fourth variable:\n\n+   ♦ The HTTP request\
    \ method to use\n\nFrom our work with the HTTP Requestor, you already know that\
    \ this needs to be POST. So, modify the publish() method of SDKRequestor.as, like\
    \ so:\n\n```\npublic function publish(a_publishObject:PublishObject):void\n{\n\
    \    var urlStub:String = \"/me/feed\";\n    Facebook.api(urlStub, publishComplete,\n\
    \        { message:a_publishObject.message },\n        URLRequestMethod.POST\n\
    \    );\n}\n```\n\nMake sure that you import flash.net.URLRequestMethod.\n\nNext,\
    \ you’ll need to create the publishComplete() function to be used as a callback:\n\
    \n```\nprivate function publishComplete(result:Object, fail:Object):void\n{\n\n\
    }\n```\n\nWe don't need to add event listeners for HTTP statuses or security errors\
    \ when using the SDK; just check whether the result is null; if so, more details\
    \ should be in the fail object:\n\n```\nprivate function publishComplete(result:Object,\
    \ fail:Object):void\n{\n    if (result != null)\n    {\n        dispatchEvent(new\
    \ DialogEvent(DialogEvent.DIALOG,\n            \"Publish complete!\"));\n    }\n\
    \    else\n    {\n        dispatchEvent(new DialogEvent(DialogEvent.DIALOG,\n\
    \            \"Publish failed. Details: \" + String(fail)));\n    }\n}\n```\n\n\
    Make sure that you import events.DialogEvent if you want to use it."
