- pgno: 285
  md: '# Time for action – adding an application to a Page tab


    To add your application as a tab on a Page that you administer, you must first
    mark it as being able to be embedded in a tab. Open the application''s settings,
    and navigate to the Facebook Integration section. In the Page Tabs sub-section,
    enter the following:


    +   - **Tab Name**: The name to be displayed on the tab (keep it short)

    +   - **Tab URL**: The filename of the application''s web page, relative to the
    Canvas URL

    +   - **Edit URL**: Leave this blank


    ![](img/4e826fa36038b86f2087ef8b818d0acf_285_0.png)


    Next, browse to the application''s Application Profile Page from the Developers
    dashboard, and click on Add To My Page from the menu on the left:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_285_1.png)


    > Add to my page''s favorites adds a link to the application''s profile to your
    Page, rather than the application itself.


    You''ll be given a list of Pages that you control; if you don''t have any Pages,
    you can follow the instructions at http://www.facebook.com/FacebookPages to learn
    how to create one.'
  merge: -1
  img_proc: true
