- pgno: 244
  md: '# Checkins


    **Checkins** are used by Facebook Places and allow the user to post their current
    location and a message about that place.


    To create a checkin, POST to this URL: https://graph.facebook.com/«user_id»/checkins.


    The only ID allowed is that of the authenticated user (so you could use me instead).


    Three parameters are supported:


    +   - `coordinates`

    +   - `place`

    +   - `message`


    The `coordinates` parameter must be a JSON string containing two properties—latitude
    and longitude. Use the JSON.encode() method from earlier in this chapter to turn
    a native AS3 object into a JSON string.


    The `place` parameter should be the ID of a Place corresponding to the place the
    user is currently visiting. In Chapter 5, we saw how to search for Places near
    a given location, and retrieve their IDs.


    The `message` parameter is optional—it''s a simple comment by the user about what
    they''re doing. For example, "Just went on the Log Flume at Alton Towers."


    Creating a checkin requires the `publish_checkins` permission. You may wish to
    grant the `user_checkins` permission as well to allow the user to view their other
    checkins.


    # What about...?


    There are a lot of things you can do via Facebook''s website interface, but not
    through the Graph API. We''ve already looked at the restrictions to the "like"
    feature; what else is missing?


    # Sending inbox messages


    It''s possible to read inbox messages (as we saw in Chapter 5) but not to create
    and send them. Facebook had planned to allow apps to create inbox messages but
    this plan appears to have been scrapped. It''s possible that this functionality
    will be included as part of the new messages; see Chapter 8 for a little more
    information on this.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Creating Pages, Groups, Applications, and Videos


    It''s not possible to create any of these types of Graph Object via the Graph
    API.


    This is a little surprising—a Group is not that different from an Event, and a
    Page, in turn, is not that different from a Group. The lack of video creation
    ability is even stranger, as it means it''s not possible to create a mobile application
    that uploads video directly to Facebook.


    Not being able to create applications through other applications makes some sense
    though!


    # Changing biographical information


    Your application can''t alter the user''s relationship status, current location,
    favorite quotations, record of education, or anything of the sort. Because the
    Graph API doesn''t allow "liking/unliking" anything other than Wall posts, it
    means the user''s entire Info box is "look but don''t touch."


    # Making Friends


    It''s not possible for an application to send a friend request to another user,
    or to remove someone from the current user''s friend list. (Although you can send
    other users enough rude messages to encourage them to remove the current user
    from their friend list.)


    # Inviting Friends to Events


    You can create Events, but you can''t invite anyone to them. Go figure.


    # Pop Quiz


    +   1. Why do we need to use a different HTTP request method all of a sudden?

    +      a. We should have been using POST all along

    +      b. The Graph API changed since you read the previous chapter

    +      c. HTTP requires that we use an "unsafe" method when changing data

    +   2. Why bother listening for different types of HTTP Status Codes?

    +      a. We need to do this now that we are using a different HTTP request method

    +      b. These codes can give us extra information about why a publishing attempt
    failed'
  merge: -1
  img_proc: true
- pgno: 246
  md: '3. What can we publish without an access token?


    a. Nothing

    b. Just Status Messages

    c. Just Likes

    d. Anything


    # Summary


    So, you''ve learned how to create lots of different types of Graph Object: Posts,
    Comments, Events, and so on. You''ve also learnt how to destroy them if need be.


    Were you surprised at what you couldn''t do with the Graph API?


    In the next chapter, we''ll go back to examining the Graph, but we''ll use a powerful
    new tool—Facebook Query Language.


    Key takeaways:


    +   - To publish via HTTP, use a URLRequest/URLLoader/URLVariables setup as usual,
    and include parameters for the new Graph Object in the URLVariables instance,
    alongside the access token.

    +     - The URL to use is https://graph.facebook.com/«id»/«connection». Make sure
    to use flash.net.URLRequestMethod.POST.

    +   - To publish via the SDK, call Facebook.api("«id»/«connection»", «callback»,
    {parameter1:"value1", parameter2:"value2"}, URLRequestMethod.POST).

    +   - Uploading photos requires a FileReference. Use FileReference.browse() to
    let the user pick an image from their hard drive.

    +     - To upload via HTTP: Use FileReference.upload() rather than URLLoader.load().

    +     - To upload via the SDK: just pass the FileReference as the value of the
    source parameter in the URLVariables instance, and call Facebook.api() as usual.

    +   - You cannot "like" anything other than a Post through the Graph API. This
    means we can''t alter the user''s interests or favorite TV programs.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '+   - At the time of writing, we can only delete Posts that were created using
    the same application.

    +     - To do so via HTTP, just pass `method=delete` to `https://graph.facebook.com/<id>`,
    using `URLRequestMethod.POST`.

    +     - If using AIR, you can simply load `https://graph.facebook.com/<id>` using
    `URLRequestMethod.DELETE`.

    +     - To delete via the SDK, call `Facebook.deleteObject("<id>", "<callback>")`.

    +     - The exception is when deleting a "like"; in this case, the URL stub to
    delete is `<id>/likes`.

    +   - A full list of parameters and permissions required for publishing is available
    at `http://developers.facebook.com/docs/reference/api`.

    +   - For security reasons, Flash Player 10 and above will not let your application
    publish anything via the `HTTP POST` method unless the user initiated the action
    (for instance, by clicking a button).'
  merge: -1
  img_proc: true
