- pgno: 257
  md: "# What about connections?\n\nSo that's essentially the FQL equivalent of retrieving\
    \ a single Graph Object. But what's the equivalent to getting a Graph Object's\
    \ connections?\n\nUnderstanding the way connections are formed in a database model\
    \ is a much harder concept to grasp than with the Graph API model. (I wouldn't\
    \ be surprised if this were one of the main motivations beyond the Graph API.)\
    \ You have to work backwards, in a sense.\n\nLet's use the idea of an album full\
    \ of photos as an example. First, imagine we create an empty album called \"Michael's\
    \ Awesome Vacation Photos.\" It'll look like this, in the database model:\n\n\
    | album |\n|---|---|---|\n| aid | owner | name |\n| «automatic» | «my user ID»\
    \ | Michael's Awesome Vacation Photos |\n\nThe `album` table has a `cover_pid`\
    \ field, which is set to the ID of a picture that I want to set as the cover photo.\
    \ So let's suppose I take a picture of the airport and upload it as my cover photo;\
    \ it'll be auto-assigned an ID.\n\nNow we can enter the airport photo's ID as\
    \ the value for the album's `cover_pid` field:\n\n| album |\n|---|---|---|---|\
    \ \n| aid | owner | name | cover_pid |\n| «automatic» | «my user ID» | Michael's\
    \ Awesome Vacation Photos | «ID of airport photo» |\n\nWe can illustrate this\
    \ like so:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_257_0.png)"
  merge: -1
  img_proc: true
- pgno: 258
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 259
  md: 'Okay, so that explains how one photo is connected to one album. We can find
    out which album has a certain photo as its cover with this FQL query:


    ```

    SELECT aid

    FROM album

    WHERE cover_pid = «specific photo''s ID»

    ```


    Conversely, we can find which photo is the cover for an album with this query:


    ```

    SELECT pid

    FROM photo

    WHERE pid = «album''s cover_pid»

    ```


    ...actually, we can find out which photos are in an album with a very similar
    query:


    ```

    SELECT pid

    FROM photo

    WHERE aid = «album''s ID»

    ```


    This can be considered "backwards" compared to the Graph model, because with the
    Graph you take the album object and ask for all its related photos: "album/photos";
    with the database model you take the photo table and ask for all rows belonging
    to an album: "FROM photo WHERE aid = «album id»".


    # Photos, Albums, and their Owners


    Did you notice that both the photo and album tables have a field called "owner",
    containing the owner''s user ID? Now, surely we can connect these. A first attempt
    at doing so might look like this:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_259_0.png)


    What word would go above that line? A smart guess would be "is", since the owners
    are the same – watch out, because this is a trap.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'These "entity relationship" lines don''t connect *fields* in the database tables;
    they connect entire tables, *using* the fields as a "key". Remember the rule of
    reading the verbs from left to right. If we used "is" as the verb, it would say,
    "The photo is the specified album" which is clearly wrong.


    We can''t connect the two tables directly because their relationship is through
    another entity. Let me show you what I mean:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_260_0.png)


    We''ve now got three tables (photo, album, user) and four relationships:


    +   - The photo belongs to the specified album

    +   - The photo is a cover of the specified album

    +   - The photo belongs to the specified user

    +   - The user owns the specified album


    So we can get the URLs of all of a specific user''s photos using this query:


    ```

    SELECT src

    FROM photo

    WHERE owner = «user''s ID»

    ```


    # Have a go hero – getting a user''s albums


    See if you can write an equivalent query for getting the URLs of all of a specific
    user''s albums. The names of the tables and columns that you''ll need to use are
    in the diagram above, but you can find more information at http://developers.facebook.com/docs/reference/fql/.


    Remember, you can always check your query using an API URL call.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Primary keys


    Have you noticed how one side of a relationship line always points to the main
    ID of a table?


    +   - `photo.pid`

    +   - `user.uid`

    +   - `album.aid`


    Each of these fields is called the **primary key** of its table. This means any
    given row can be identified using that field (and only that field); every row
    has a value in its primary key''s field, and no two rows have the same primary
    key value.


    We can make it easier to understand the relationships between tables by writing
    the names of the primary keys in bold type.


    We also have a name for fields that link to primary keys of other tables, like:


    +   - `photo.owner` (links to `user.uid`)

    +   - `photo.aid` (links to `album.aid`)

    +   - `album.cover_pid` (links to `photo.pid`)


    We call these **foreign keys** and tend to write these in italics in any diagram.


    Our earlier diagram of the **photo**, **user**, and **album** tables can thus
    be redrawn as shown in the next screenshot:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_261_0.png)'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Crow''s feet


    So we have two lines connecting the album table and the photo table.


    For a given album, what''s so different about the results of these two queries?


    ```

    SELECT pid

    FROM photo

    WHERE aid = «album ID»

    ```


    and


    ```

    SELECT pid

    FROM photo

    WHERE pid = «album''s cover_pid»

    ```


    The answer is, the first may return several photos'' IDs, while the second will
    only ever return one. We can clarify this in the wording of our relationship sentences
    like so:


    "The album contains **zero or more** photos"


    "The album''s cover is **one and exactly one** photo"


    Note I''ve had to reverse the sentences to start with "the album" rather than
    "the photo" for these to make sense.


    We can also represent this in the diagram; we use what''s called **crow''s foot
    notation**:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_262_0.png)


    The three prongs ("**crow''s foot**") on the right of the top line means "many"
    and the circle means "zero," so this reads as "zero to many" or "zero or more".
    The pair of dashes across the right of the bottom line means "one and exactly
    one".'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'This doesn''t tell the whole story, though. Not all photos are the cover photo
    for an album. We need to reverse the sentences to explain that in words:


    > "The photo belongs to one and exactly one album"


    > "The photo is the cover of zero or one albums"


    ![](img/4e826fa36038b86f2087ef8b818d0acf_263_0.png)


    Here, the pair of dashes on the top line again means "one and exactly one," while
    the circle and dash means "zero or one." I''ve left the other markings on the
    lines, but since the tables are the other way around now, they''re on the left
    rather than the right.


    It''s tricky to read these diagrams at first; the best thing to do is break them
    down into pairs of sentences like we''ve done here. You''ll get the hang of it
    eventually.


    # Have a go hero – drawing your own crows'' feet


    Another way to learn how to use crow''s foot notation is to draw your own diagrams.
    Redraw the diagrams connecting the photo, user, and album tables and add the appropriate
    markers to each side of the lines. Remember to start with the pairs of relationship
    sentences to figure out what you need to say!


    You can do this with pencil and paper, but if you want to go further and draw
    diagrams for all the tables, consider using a piece of software like DbSchema:
    http://www.dbschema.com/. Remember, the list of tables and their columns is available
    at http://developers.facebook.com/docs/reference/fql/.


    # Link tables


    How can we create the same links between friends? Well, this has to be a relationship
    between the user table and itself, so a good first guess would be:


    > "A user is friends with zero or more users"'
  merge: -1
  img_proc: true
- pgno: 264
  md: '...with the reverse sentence being exactly the same. So far, so good. It gets
    trickier when we try to draw it, though. Do either of these work?


    ![](img/4e826fa36038b86f2087ef8b818d0acf_264_0.png)


    ![](img/4e826fa36038b86f2087ef8b818d0acf_264_1.png)


    No. And this is a basic rule of the database model: you can''t have "many-to-many"
    relationships between tables. Here we tried it where both tables were the same,
    but this rule applies even if that''s not the case.


    I guess we''d better give up then. Not really, of course. Instead, we use what''s
    called a "link table":


    ![](img/4e826fa36038b86f2087ef8b818d0acf_264_2.png)


    Labels for these relationships are tricky; since the link table is not a tangible
    thing, the proper label has to be something like, "is assigned to," which is not
    helpful. Really, the link table itself expresses the relationship, so you can
    often omit the labels altogether. Alternatively, label them as if they were connecting
    through the link table, like "is friends with".'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'This makes searching for a user''s friends a little harder than searching for
    their photos. However, we can get a list of friends'' IDs like so:


    ```

    SELECT uid2

    FROM friend

    WHERE uid1 = «user''s ID»

    ```


    # What just happened?


    That query will get a list of IDs of all users that are friends with the specified
    other user. Don''t worry, every row is duplicated with the order of IDs switched;
    if there''s a row with "uid1 = 123" and "uid2 = 456" then there''s another row
    with "uid1 = 456" and "uid2 = 123". This means you won''t miss anyone if you only
    ask for values of uid2.


    Getting a list of a user''s friends'' names is harder. Let''s think about how
    we''d do it with the help of AS3.


    # Time for action – getting a user''s friends'' names with AS3


    We can start by getting a list of the IDs of a user''s friends using the query
    above:


    ```

    SELECT uid2

    FROM friend

    WHERE uid1 = «user''s ID»

    ```


    From earlier in the chapter, you know that we can call this API URL to get that
    list:


    ```

    https://api.facebook.com/method/fql.query?access_token=«access_token»&format=json&query=SELECT%20page_id%20FROM%20page%20WHERE%20name%20=%20%22Facebook%22

    ```


    Except, actually, that won''t work. Just like when using the Graph API to access
    private information, you''ll need to use an access token. (See Chapter 3 for a
    reminder of how to generate one of these.)


    The correct API URL, then, is:


    ```

    https://api.facebook.com/method/fql.query?access_token=ACCESS_TOKEN&format=json&query=SELECT%20page_id%20FROM%20page%20WHERE%20name%20=%20%22Facebook%22

    ```


    Given a user''s ID, we can get their name using this query:


    ```

    SELECT name

    FROM user

    WHERE uid = «user''s ID»

    ```'
  merge: -1
  img_proc: true
