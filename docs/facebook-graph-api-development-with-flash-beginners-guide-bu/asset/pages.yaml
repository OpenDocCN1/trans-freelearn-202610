  md: "My News Feed searches /me/home, and Friend' s Posts searches /«username»/feed,\
    \ where «username» is the value typed into the textbox.\n\nLet's first add the\
    \ My News Feed search to both Requestors. The only change we have to make is to\
    \ the URL that gets requested; instead of /search we use /me/home. The Search\
    \ window returns \"home\" as the value of type if My News Feed is checked, so\
    \ modify the search() method in HTTPRequestor.as as shown in the following code:\n\
    \n```\npublic function search(a_query:String = \"\", a_type:String = \"\"):void\n\
    {\n    var loader:URLLoader = new URLLoader();\n    var urlRequest:URLRequest\
    \ = new URLRequest();\n    var variables:URLVariables = new URLVariables();\n\n\
    \    if (a_type == \"home\")\n    {\n        urlRequest.url = \"https://graph.facebook.com/me/home\"\
    ;\n    }\n    else\n    {\n        urlRequest.url = \"https://graph.facebook.com/search\"\
    ;\n    }\n\n    variables.metadata = 1;\n    if (accessToken != \"\")\n    {\n\
    \        variables.access_token = accessToken;\n    }\n    variables.q = a_query;\
    \      //not variables.query!\n    variables.type = a_type;\n    urlRequest.data\
    \ = variables;\n\n    loader.addEventListener(Event.COMPLETE, onGraphSearchComplete);\n\
    \    loader.addEventListener(IOErrorEvent.IO_ERROR, onIOError);\n    loader.load(urlRequest);\n\
    }\n```\n\nSimilarly, make the following changes to the search() method inside\
    \ SDKRequestor.as:\n\n```\npublic function search(a_query:String = \"\", a_type:String\
    \ = \"\"):void\n{\n    var urlStub:String;\n    if (a_type == \"home\")\n    {\n\
    \        urlStub = \"/me/home\";\n    }\n    else\n    {\n        urlStub = \"\
    /search\";\n```"
