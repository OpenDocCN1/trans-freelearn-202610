- pgno: 37
  md: '# 2


    # Welcome to the Graph


    > Facebook has a huge store of information, on people, companies, events, photo
    albums, and more. It also knows how all of these are linked: which person owns
    each album; which people appear in each photo; which company is organizing each
    event.


    For four years, this was accessed using a huge, sprawling API, which got more
    complex as new abilities were bolted on to it. In April 2010, Facebook launched
    the Graph API, greatly simplifying how developers can retrieve all of this data.


    In this chapter we shall:


    +   - Explore the Facebook Graph

    +   - Learn what the Graph API is, and how it structures all the data on Facebook

    +   - Access public Graph data using AS3 and the Graph API


    So let''s get on with it.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Accessing the Graph API through a Browser


    We''ll dive right in by taking a look at how the Graph API represents the information
    from a public Page.


    When I talk about a Page with a capital P, I don''t just mean any web page within
    the Facebook site; I''m referring to a specific type of page, also known as a
    public profile. Every Facebook user has their own personal profile; you can see
    yours by logging in to Facebook and clicking on the "Profile" link in the navigation
    bar at the top of the site. Public profiles look similar, but are designed to
    be used by businesses, bands, products, organizations, and public figures, as
    a way of having a presence on Facebook.


    This means that many people have both a personal profile and a public profile.
    For example, Mark Zuckerberg, the CEO of Facebook, has a personal profile at http://www.facebook.com/zuck
    and a public profile (a Page) at http://www.facebook.com/markzuckerberg. This
    way, he can use his personal profile to keep in touch with his friends and family,
    while using his public profile to connect with his fans and supporters.


    There is a second type of Page: a Community Page. Again, these look very similar
    to personal profiles; the difference is that these are based on topics, experience,
    and causes, rather than entities. Also, they automatically retrieve information
    about the topic from Wikipedia, where relevant, and contain a live feed of wall
    posts talking about the topic.


    All this can feel a little confusing – don''t worry about it! Once you start using
    it, it all makes sense.


    # Time for action – loading a Page


    Browse to http://www.facebook.com/PacktPub to load Packt Publishing''s Facebook
    Page. You''ll see a list of recent wall posts, an Info tab, some photo albums
    (mostly containing book covers), a profile picture, and a list of fans and links.'
  merge: -1
  img_proc: true
