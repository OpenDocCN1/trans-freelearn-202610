- pgno: 35
  md: '# A final note...


    Facebook''s developers are always tweaking the platform. This can make it exciting
    to develop on because new features are being added all the time, but it can also
    make it very frustrating to develop on because old features can be removed, or
    their implementations changed; anything could be altered at any time.


    The new Platform API (the Graph API) is a strong foundation, and looks likely
    to be around for a while—remember, the previous Platform API lasted four years.
    But it''s modular, and individual pieces might change, or even be removed.


    It''s possible then that parts of this book may be out-of-date by the time you
    read it, and some of the instructions might not give the same results with the
    current version of Facebook platform as they did when this book was written. If
    you''re concerned about this, you can find out how to keep up-to-date with any
    platform changes in the last section of *Chapter 8, Keeping Up With The Zuckerbergs.*


    But for now, dive into *Chapter 2, Welcome to the Graph* and start developing!'
