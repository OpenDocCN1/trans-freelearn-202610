  md: "```\n},\n{\n  \"name\": \"category\",\n  \"description\": \"The page's category\"\
    \n},\n{\n  \"name\": \"fan_count\",\n  \"description\": \"\\\\/* The number of\
    \ fans the page has\"\n}\n]\n```\n\nThis is a list explaining what each of the\
    \ fields in the main body of the Graph Object represents. At time of writing,\
    \ this is still a fairly new feature, so it's possible that the list will be more\
    \ complete by the time you load it.\n\nThe connections object is as follows:\n\
    \n```\n\"connections\": {\n  \"feed\": \"https://graph.facebook.com/packtpub/feed\"\
    ,\n  \"posts\": \"https://graph.facebook.com/packtpub/posts\",\n  \"tagged\":\
    \ \"https://graph.facebook.com/packtpub/tagged\",\n  \"statuses\": \"https://graph.facebook.com/packtpub/statuses\"\
    ,\n  \"links\": \"https://graph.facebook.com/packtpub/links\",\n  \"notes\": \"\
    https://graph.facebook.com/packtpub/notes\",\n  \"photos\": \"https://graph.facebook.com/packtpub/photos\"\
    ,\n  \"albums\": \"https://graph.facebook.com/packtpub/albums\",\n  \"events\"\
    : \"https://graph.facebook.com/packtpub/events\",\n  \"videos\": \"https://graph.facebook.com/packtpub/videos\"\
    \n}\n```\n\nBrowse to one of the URLs from the previous list: http://graph.facebook.com/packtpub/posts.\
    \ It returns a JSON containing an array called data and an object called paging.\
    \ The data array contains several Post objects; we'll look at paging later in\
    \ the book.\n\n# What just happened?\n\nThe metadata=1 parameter tells the Graph\
    \ API to display all of the metadata about the current object, which, in this\
    \ case, includes the type of object it is, an array of descriptions of the object's\
    \ properties, and all of the URLs that contain lists of objects connected to this\
    \ Page.\n\nThis layout is where the Graph API gets its name. In everyday usage,\
    \ \"graph\" means the type of chart shown in the next diagram:"
