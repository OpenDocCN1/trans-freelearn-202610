- pgno: 125
  md: "The required form of the `requestComplete()` callback is almost the same as\
    \ the others, as shown in the next lines of code:\n\n```\nprivate function requestComplete(result:Object,\
    \ fail:Object):void\n{\n    if (result != null)\n    {\n        //was a success.\n\
    \    }\n    else\n    {\n        //was a failure. See contents of 'fail' object.\n\
    \    }\n}\n```\n\nAdd that to `SDKRequestor.as`. Notice that this time, instead\
    \ of a `success` parameter we have a `result` parameter (not that this really\
    \ matters, but it's a more accurate name), and it is just an `Object`, rather\
    \ than an instance of `FacebookSession`.\n\nIn fact, `result` is in exactly the\
    \ same form as the `decodedJSON` object that we created ourselves in `HTTPRequestor.onGraphDataLoadComplete()`.\
    \ This means we can copy and paste the code we wrote earlier to deal with it –\
    \ so do so:\n\n```\nprivate function requestComplete(result:Object, fail:Object):void\n\
    {\n    if (result != null)\n    {\n        var decodedJSON:Object = result;\n\
    \        if (decodedJSON.data)\n        {\n            var graphList:GraphList\
    \ = new GraphList();\n            var childGraphObject:GraphObject;\n        \
    \    for each (var childObject:Object in decodedJSON.data)\n            {\n  \
    \              childGraphObject = new GraphObject();\n                for (var\
    \ childKey:String in childObject)\n                {\n                    childGraphObject[childKey]\
    \ = childObject[childKey];\n                }\n                graphList.addToList(childGraphObject);\n\
    \            }\n            graphList.paging = decodedJSON.paging;\n         \
    \   graphList.ownerID = originalRequest.objectID;\n```"
  merge: -1
  img_proc: true
- pgno: 126
  md: "```\ngraphList.connectionType = originalRequest.connectionID;\n\ndispatchEvent(new\
    \ RequestEvent(RequestEvent.REQUEST_COMPLETED,\n    graphList));\n}\nelse\n{\n\
    \    var graphObject:GraphObject = new GraphObject();\n    for (var key:String\
    \ in decodedJSON)\n    {\n        graphObject[key] = decodedJSON[key];\n    }\n\
    \n    dispatchEvent(new RequestEvent(RequestEvent.REQUEST_COMPLETED,\n       \
    \ graphObject));\n}\n}\nelse\n{\n    //was a failure. See contents of 'fail' object.\n\
    }\n```\n\nYou'll also need the following imports:\n\n```\nimport graph.GraphList;\n\
    import graph.GraphObject;\nimport events.RequestEvent;\n```\n\nThere's a big problem\
    \ here, though. We refer to originalRequest in the code, but we have no way of\
    \ obtaining the original GraphRequest instance!\n\nThe solution is to use a coding\
    \ trick called currying. This allows us to pass extra values to the callback function\
    \ at the time that we make the request.\n\n> Don't worry if you don't understand\
    \ how currying works. I'm not going to explain it here, as it's fairly advanced\
    \ and not really relevant to Facebook – the code that uses it is specific to the\
    \ Visualizer. For an excellent explanation of currying, see the article by Jackson\
    \ Dunstan at: http://jacks ondunstan.com/articles/338.\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_126_0.png)"
  merge: -1
  img_proc: true
- pgno: 127
  md: "Change the request() function to:\n\n```\npublic function request(a_request:GraphRequest):void\n\
    {\n    var graphItem:String = \"/\" + a_request.objectID;\n    if (a_request.connectionID)\n\
    \    {\n        graphItem += \"/\" + a_request.connectionID;\n    }\n    Facebook.api(graphItem,\
    \ function(result:Object, fail:Object):void {\n        requestComplete.call(this,\
    \ result, fail, a_request); } );\n}\n```\n\nNow, modify the signature of requestComplete()\
    \ to accept an extra parameter:\n\n```\nprivate function requestComplete(result:Object,\
    \ fail:Object, originalRequest:GraphRequest):void\n```\n\nSDKRequestor is now\
    \ ready for testing. Switch to CustomGraphContainerController.as, and change it\
    \ to:\n\n```\npackage controllers\n{\n    import flash.events.Event;\n    import\
    \ graph.apis.base.ExtendedPermissions;\n    import graph.apis.http.HTTPRequestor;\n\
    \    import graph.apis.sdk.SDKRequestor;\n    import graph.GraphRequest;\n   \
    \ import ui.GraphControlContainer;\n\n    public class CustomGraphContainerController\
    \ extends GCCcontroller\n    {\n        public function CustomGraphContainerController\n\
    \            (a_graphControlContainer:GraphControlContainer)\n        {\n    \
    \        super(a_graphControlContainer);\n            _requestor = new SDKRequestor();\n\
    \            addEventListenersToRequestor();\n            //we must wait for the\
    \ SDK to initialize before we can do\n            //anything else with it\n  \
    \          _requestor.addEventListener(Event.COMPLETE, onSDKInitialize);\n   \
    \     }\n\n        private function onSDKInitialize(a_event:Event):void\n    \
    \    {\n            _requestor.attemptToAuthenticate();\n        }\n    }\n}\n\
    ```"
