- pgno: 272
  md: '> Note that this restriction only requires *at least one* of the fields queried
    to be indexable. The fields specified in the `SELECT` clause can be any fields
    in the table specified in the `FROM` clause. And later in the chapter, you''ll
    see how to query multiple fields at once inside a single `WHERE` clause, only
    one of which needs to be indexable.


    # Does this matter in practice?


    In general, the fields that you actually need to use in a search query are indexable;
    it''s rare that you''ll want to search for a user based on the URL of their profile
    picture. There are exceptions to watch out for, though. For instance, in the `event`
    table, only the `eid` field (the primary key) is indexable, meaning that you cannot
    search across all events in the database to find one taking place in a specified
    location, or containing a specified term in its name.


    # Advanced FQL


    What we''ve covered so far is enough to cover most of what you can do with Graph
    calls, and some more besides. Let''s take a look at the more advanced features
    of FQL.


    # Operators


    Just like `if` statements in AS3, FQL''s `WHERE` clause can take both logical
    and comparison operators.


    # Comparison


    We can use the mathematical comparison operators =, <, >, <=, >=, and !=. (An
    alternative to != is <>, which you may see in examples online.)


    These all work the same as in AS3, with the exception of =, which is like AS3''s
    ==; it''s used for checking equality rather than assigning a value.


    The most useful scenario for using these is when you want to filter out objects
    past a certain age.


    # Logical


    `AND`, `OR`, and `NOT` will be familiar to you, although in AS3 we would write
    them as `&&`, `||`, and `!`, respectively.


    We already covered `IN` earlier in the chapter; this allows us to check whether
    a given item exists in a given list.'
  merge: -1
  img_proc: true
- pgno: 273
  md: "# Have a go hero – getting a list of your events based on location\n\nEarlier\
    \ in the chapter we learned that we couldn't run this query:\n\n```\nSELECT eid\n\
    FROM event\nWHERE location = 'london'\n```\n\nThis is because the only indexable\
    \ field in event is eid.\n\nHere's one sneaky way around it:\n\n```\nSELECT eid\n\
    FROM event\nWHERE eid != -1 AND location = 'london'\n```\n\nUnfortunately, it\
    \ doesn't work. Facebook will tell you that \"your statement is not indexable.\"\
    \ Ah well.\n\nSo come up with a query that searches for events taking place in\
    \ London that the current user is already aware of – you'll need to create a sub-query\
    \ using the event_member table and the IN operator for this.\n\n(The event_member\
    \ table is a link table with two indexable fields: uid, which corresponds to a\
    \ user, and eid, which corresponds to an event.)\n\n# Have a go hero – finding\
    \ gatecrashers\n\nWant a bigger challenge?\n\nPick an event where lots of photos\
    \ were taken. Using FQL and AS3, write code that will take the ID of an event\
    \ and a list of IDs of photo albums of that event, and output a list of names\
    \ of people who were tagged in the albums but not invited to the event.\n\n# Ordering\n\
    \nThe ORDER BY clause allows us to sort results on a specific field. For example,\
    \ you can get a list of your own friends as shown in the following lines of code:\n\
    \n```\n# SELECT name\n# FROM user\n# WHERE uid IN (\n    * SELECT uid2\n    *\
    \ FROM friend\n    * WHERE uid1 = « your User ID »\n```"
  merge: -1
  img_proc: true
- pgno: 274
  md: "You can display them in alphabetical order by adding the following new clause:\n\
    \n```\nSELECT name\nFROM user\nWHERE uid IN (\n    SELECT uid2\n    FROM friend\n\
    \    WHERE uid1 = «your User ID»\n)\nORDER BY name\n```\n\nWrite ORDER BY name\
    \ DESC to sort in descending order, or ORDER BY name ASC to sort in ascending\
    \ order. The default is ASC.\n\nThis is great when retrieving data that needs\
    \ to be displayed in a certain order inside Flash; all the work can be done at\
    \ the server end, rather than having to take all the data and sort it with AS3.\
    \ It cannot be done with a Graph call.\n\n# Paging\n\nAs with the Graph, there\
    \ are two main methods of paging: by date, or by number.\n\nPaging by date uses\
    \ comparison operators:\n\n```\nSELECT aid\nFROM album\nWHERE owner = «your User\
    \ ID» AND created < «latest date» AND created > «earliest date»\n```\n\nYou can\
    \ also use arithmetic operators (+, -, /, *) to make date comparisons easier to\
    \ read:\n\n```\nSELECT aid\nFROM album\nWHERE owner = «your User ID» AND created\
    \ < «certain date» AND created > «certain date» - 10\n```\n\nPaging by number\
    \ uses LIMIT and OFFSET, just like with a Graph call:\n\n```\nSELECT aid\nFROM\
    \ album\nWHERE owner = «your User ID»\nLIMIT 15\nOFFSET 30\n```\n\nSee Chapter\
    \ 4 for more information on paging."
  merge: -1
  img_proc: true
