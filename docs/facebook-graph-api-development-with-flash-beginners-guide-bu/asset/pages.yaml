- pgno: 235
  md: '# What just happened?


    You should have seen a Wall post get deleted from Facebook.


    > Stop Press: Shortly before this book was published, Facebook appeared to change
    the Graph API so that Wall posts could only be deleted by an application if that
    application was used to publish them in the first place. Previously, it was possible
    to delete any posts on the logged-in user''s Wall, as well as any posts made by
    the user on other Walls. At time of this writing, the official Graph API documentation
    does not mention this restriction. So, if you''re having problems deleting posts,
    try creating one through the Visualizer first, and then deleting that.


    Once again this requires only the `publish_stream` extended permission; by now
    you should have a good idea of how powerful this permission is. You can use the
    same code to delete other kinds of Graph Object, not just posts. If your application
    has permission to modify or create an object, it has permission to delete it,
    too.


    If you try to delete a post through the Facebook website, it will ask for confirmation:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_235_0.png)


    This is a good idea, and worth using for the interface of your own projects. The
    Visualizer doesn''t ask for confirmation, and doesn''t even remove the Post from
    the List Renderer once deleted—though this does let you see what happens if you
    try to remove a Post that''s already been deleted...


    # Publishing other kinds of Graph Object


    All the types of Graph Object that can be created can be created with the same
    basic steps as a Wall Post:


    +   - Use `POST HTTP` request method

    +   - Set parameters with a `URLVariables` object

    +   - Make sure that you have an access token and the required permissions


    The Graph List Renderer''s Publish button always creates a window with inputs
    that are appropriate to the Graph List being rendered, and this in turn always
    passes its values to the `publish()` function of `CustomGraphContainerController`,
    inside a `PublishObject` instance, so you can experiment with the different types.'
  merge: -1
  img_proc: true
