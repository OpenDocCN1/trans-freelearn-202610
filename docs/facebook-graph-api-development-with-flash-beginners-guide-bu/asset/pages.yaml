- pgno: 89
  md: "# Time for action – requesting an access token with the browser\n\nOpen your\
    \ browser and head to https://graph.facebook.com/oauth/authorize?client_id=<insert_application_id>\
    \ (replace <insert_application_id> with your application’s Application ID).\n\n\
    You'll get the following error:\n\n```\n{\n  \"error\": {\n    \"type\": \"OAuthException\"\
    ,\n    \"message\": \"Missing redirect_uri parameter.\"\n  }\n}\n```\n\nFacebook\
    \ won’t just output the access token; it wants to redirect the browser to another\
    \ web page, and pass the access token to that page. At the moment, this isn’t\
    \ very useful. Our Flash application is running as a standalone SWF and is not\
    \ embedded in a page — so we’ll use a quick workaround.\n\n# Registering a redirect\
    \ URI with our application\n\nGo to your application’s Settings (go to http://www.facebook.com/developers,\
    \ then click the name of your application, then click on Edit Settings). Click\
    \ on the Web Site tab in the navigation bar on the left.\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_89_0.png)"
  merge: -1
  img_proc: true
- pgno: 90
  md: 'You''ll see the panel as shown in the next screenshot:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_90_0.png)


    The Site URL box defines the URL that Facebook redirects to after authorizing
    the user and the application. It''s also the URL to which the access token will
    be passed.


    Until we create our own page, let''s set this to the Google home page. I''m sure
    they won''t mind. Enter http://google.com/ in the box, and click on Save Changes.


    ![](img/4e826fa36038b86f2087ef8b818d0acf_90_1.png)


    If you try browsing to https://graph.facebook.com/oauth/authorize?client_id<<your_application_id>>
    again, you''ll get the same error message. Even though we''ve specified the redirect
    destination page inside our application''s settings, we still have to pass it
    to the authorize URL.


    There is a security risk involved in passing credentials as parameters typed into
    a URL; they''re not secure, and could be read by anyone. This poses a problem:
    Facebook would like to see our Application Secret, to prove that we really are
    logging in via the application whose ID we''ve provided, but we can''t risk passing
    the Secret via the URL.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'To get around this, we can tell Facebook that we''re using a web browser on
    the user''s side to authenticate, and Facebook will let us through without requiring
    our Application Secret. This involves passing another parameter: type=user_agent
    (user agent is the general term for applications like web browsers that run on
    the user''s computer).


    So, browse to the URL: https://graph.facebook.com/oauth/authorize?client_id=«your_application_id»&redirect_uri=http://google.com&type=user_agent.


    > Note that there is an ampersand (&) separating the value of each parameter and
    the name of the next, and that the second parameter is called redirect_uri, not
    redirect_url. (That''s not a typo; a URL is a specific type of URI.)


    You should be faced with a Facebook login web page:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_91_0.png)


    Enter your details and click on Log in. You''ll be asked to give the application
    permission to access your basic information:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_91_1.png)'
  merge: -1
  img_proc: true
- pgno: 92
  md: "# Let Me In!\n\nClick on Allow. You'll be redirected to Google—but take a closer\
    \ look at the URL:\n\n```\nhttp://google.com/#access_token=123675230995389%7C2.hX2Png6g2LUuczfd4tLPbQ__.3600.1276960311-169573433058884%7C8BAAidDtl\
    \ t8fulZHA3bC3YxcCwM\n```\n\nAt last! We have our access token. You can see it\
    \ as the value of the access_token parameter in the URL we were redirected to.\
    \ In this case, it's: 123675230995389%7C2.hX2Png6g2LUuczfd4tLPbQ__.3600.1276960311-169573433058884%7C8BAAidDtl\
    \ t8fulZHA3bC3YxcCwM.\n\n(Yours will be different, because the token is based\
    \ on the User ID, the Application ID, and the time of authorization, but it will\
    \ look similar.)\n\n# Using the Access Token\n\nLet's try it out. Try loading\
    \ your own profile through the Graph API, as we did earlier:\n\n```\nhttps://graph.facebook.com/«your_username»\n\
    ```\n\nIf you recall, I got this:\n\n```\n{\n  \"id\": \"«redacted»\",\n  \"name\"\
    : \"Michael James Williams\",\n  \"first_name\": \"Michael\",\n  \"middle_name\"\
    : \"James\",\n  \"last_name\": \"Williams\",\n  \"gender\": \"male\",\n  \"locale\"\
    : \"en_GB\"\n}\n```\n\nNow try again, but this time add an access_token parameter\
    \ to the URL:\n\n```\nhttps://graph.facebook.com/«your_username»?access_token=123675230995389%7C2.hX2Png6g2LUuczfd4tLPbQ__.3600.1276960311-169573433058884%7C8BAAidDtl\
    \ t8fulZHA3bC3YxcCwM.\n```\n\nThis time, you'll get more data as shown in the\
    \ following snippet:\n\n```\n{\n  \"id\": \"«redacted»\",\n  \"name\": \"Michael\
    \ James Williams\",\n  \"first_name\": \"Michael\",\n  \"middle_name\": \"James\"\
    ,\n  \"last_name\": \"Williams\",\n  \"link\": \"«redacted»\",\n}\n```"
