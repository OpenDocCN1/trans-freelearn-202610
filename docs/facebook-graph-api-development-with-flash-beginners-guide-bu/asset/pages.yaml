- pgno: 181
  md: "# What just happened?\n\nOur Visualizer can now search for Graph objects based\
    \ on a query that you enter. Since the results are returned in the form of a Graph\
    \ List, our application will then grab all the info about those objects – and\
    \ this means we can see their connections, too.\n\n# Time for action – searching\
    \ via the SDK\n\nIt's easy to make our search work via the SDK, too. Start by\
    \ opening SDKRequestor.as and adding a new function called search(), just as we\
    \ did with the HTTPRequestor:\n\n```\npublic function search(a_query:String =\
    \ \"\", a_type:String = \"\"):void\n{\n}\n```\n\nAs with a request, we pass three\
    \ parameters to the Facebook.api() method:\n\n+   1. /search (a string containing\
    \ the key part of the Graph URL)\n+   2. A reference to a callback function\n\
    +   3. An object containing the parameters (q and type – remember not to use query\
    \ as the name of the parameter!)\n\nSo, add this call to your search() function\
    \ as shown in the following code:\n\n```\npublic function search(a_query:String\
    \ = \"\", a_type:String = \"\"):void\n{\n    Facebook.api(\n        \"/search\"\
    ,\n        searchComplete,\n        { metadata: 1, q:a_query, type:a_type }\n\
    \    );\n}\n```\n\nThere was no need to use currying this time, as we don't need\
    \ to maintain a reference to the original GraphRequest object.\n\nThat's it for\
    \ the search() function. We still need to write the callback for when the data\
    \ is loaded though, so create a new function, searchComplete(), as shown in the\
    \ following lines of code:\n\n```\nprivate function searchComplete(success:Object,\
    \ fail:Object):void\n{\n}\n```"
  merge: -1
  img_proc: true
- pgno: 182
  md: "Like the other SDK callbacks, this function must accept two parameters: result\
    \ and fail.\n\nSince the search results are returned in the form of a Graph List,\
    \ we can re-use most of the code from the requestComplete() function. Modify searchComplete()\
    \ as shown in the following lines of code:\n\n```\nprivate function searchComplete(result:Object,\
    \ fail:Object):void\n{\n    if (result != null)\n    {\n        var decodedJSON:Object\
    \ = result;\n        var graphList:GraphList = new GraphList();\n        var childGraphObject:GraphObject;\n\
    \        for each (var childObject:Object in decodedJSON)\n        {\n       \
    \     childGraphObject = new GraphObject();\n            for (var childKey:String\
    \ in childObject)\n            {\n                childGraphObject[childKey] =\
    \ childObject[childKey];\n            }\n            graphList.addToList(childGraphObject);\n\
    \        }\n        graphList.paging = decodedJSON.paging;\n\n        dispatchEvent(new\
    \ RequestEvent(RequestEvent.REQUEST_COMPLETED, graphList));\n    }\n    else\n\
    \    {\n        //was a failure. See contents of 'fail' object.\n    }\n}\n```\n\
    \nJust as with the HTTP Requestor, check Chapter 2 and Chapter 3 if you want a\
    \ reminder of how this all works.\n\nNow that both Requestors have a search()\
    \ method; we can add that method to the IRequestor interface. Modify IRequestor\
    \ as like so:\n\n```\npackage graph.apis.base\n{\n    import flash.events.IEventDispatcher;\n\
    \    import graph.GraphRequest;\n\n    public interface IRequestor extends IEventDispatcher\n\
    \    {\n```"
  merge: -1
  img_proc: true
- pgno: 183
  md: "```\nfunction request(a_request:GraphRequest):void;\nfunction attemptToAuthenticate(...permissions):void;\n\
    function initialize():void;\nfunction search(a_query:String = \"\", a_type:String\
    \ = \"\"):void;\n}\n```\n\nThis means we don't have to cast _requestor as an HTTPRequestor\
    \ in CustomGraphContainerController.search() any more, so open CustomGraphContainerController.as\
    \ and alter that method:\n\n```\noverride public function search(a_query:String\
    \ = \"\", a_type:String = \"\", a_userID:String = \"\"):void\n{\n    _requestor.search(a_query,\
    \ a_type);\n}\n```\n\nAll that's left before we can test it is to change the constructor\
    \ so that _requestor is created as an SDKRequestor rather than an HTTPRequestor.\
    \ This is done as follows:\n\n```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    this._showListCounts = true;\n   \
    \ this._showListFilters = true;\n    this._canShowSearchUI = true;\n\n    _requestor\
    \ = new SDKRequestor();\n    addEventListenersToRequestor();\n    //we must wait\
    \ for the Requestor to initialise before we can do anything else with it\n   \
    \ _requestor.addEventListener(Event.COMPLETE, onRequestorInitialize);\n\n    _requestor.initialize();\n\
    }\n```"
  merge: -1
  img_proc: true
