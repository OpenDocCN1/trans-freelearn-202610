- pgno: 223
  md: "Now look again at the Wall post:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_223_0.png)\n\
    \nThe actions are the links underneath the post that other Facebook users can\
    \ click.\n\nWe can add our own user-defined action, such as \"Visit my website\"\
    \ or \"Plant some crops\", by passing it in a JSON to the actions parameter.\n\
    \n# Time for action – literally\n\n+   1. Open HTTPRequestor.as and find the publish()\
    \ function. Create a native AS3 object within the function like so:\n+   ```\n\
    +   var actionObj:Object = [ {\n+       name:\"Visit my Twitter Page\",\n+   \
    \    link:\"http://twitter.com/MichaelJW\"\n+   } ];\n+   ```\n+   Square brackets\
    \ define an array, so we could type this as an Array rather than an Object, but\
    \ it doesn't really matter.\n+   \n+   2. Next, in the same function, use the\
    \ JSON library that we've used before to decode this object into a JSON string:\n\
    +   ```\n+   var actionString:String = JSON.encode(actionObj);\n+   ```\n+   \n\
    +   3. Now, add this String as a property of the URLVariables object, called actions:\n\
    +   ```\n+   variables.message = a_publishObject.message;\n+   variables.picture\
    \ = a_publishObject.pictureURL;\n+   variables.link = a_publishObject.linkURL;\n\
    +   variables.name = a_publishObject.linkName;\n+   variables.caption = a_publishObject.caption;\n\
    +   variables.description = a_publishObject.description;\n+   variables.actions\
    \ = actionString;\n+   urlRequest.data = variables;\n+   ```"
  merge: -1
  img_proc: true
- pgno: 224
  md: "4. Make similar changes in SDKRequestor.as:\n\n```\npublic function publish(a_publishObject:PublishObject):void\n\
    {\n    var urlStub:String = \"/\" + a_publishObject.ownerID + \"/feed\";\n   \
    \ var actionObj:Object = [ {\n        name:\"Visit my Twitter Page\",\n      \
    \  link:\"http://twitter.com/MichaelJW\"\n    } ];\n    var actionString:String\
    \ = JSON.encode(actionObj);\n    Facebook.api(urlStub, publishComplete,\n    {\n\
    \        message:a_publishObject.message,\n        picture:a_publishObject.pictureURL,\n\
    \        link:a_publishObject.linkURL,\n        name:a_publishObject.linkName,\n\
    \        caption:a_publishObject.caption,\n        description:a_publishObject.description,\n\
    \        actions:actionString\n    },\n        URLRequestMethod.POST\n    );\n\
    }\n```\n\n5. You will need to import com.adobe.serialization.json.JSON. Test this\
    \ out:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_224_0.png)\n\n# What just happened?\n\
    \nYou've added an app-specific action to posts coming from your project. You can\
    \ add only one such action to each post, but of course, it doesn't have to be\
    \ the same for every single post.\n\nThe action is a functional hyperlink; clicking\
    \ on it would take you to my Twitter page. Facebook adds a URL parameter, ref=nf,\
    \ to the end of all such links, though, so test them out first—for example, trying\
    \ to load http://google.com?ref=nf gives you a 404 message."
