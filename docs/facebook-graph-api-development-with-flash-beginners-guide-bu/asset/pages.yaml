- pgno: 62
  md: "# What just happened?\n\nWe can now see all of the connections of a Graph Object\
    \ right there in its renderer. Of course, that's not very interesting unless we\
    \ can see what's at the other end of each connection!\n\n# Introducing the Requestor\n\
    \nIdeally, whenever the user clicks a connection from the scrolling list, a new\
    \ Graph List Renderer of that connection will be created and displayed.\n\nTo\
    \ do this, we'd need to add a MouseEvent.CLICK listener to the list, and use it\
    \ to trigger a new URLLoader request for the clicked connection.\n\nFortunately,\
    \ all the UI code has already been provided elsewhere in the project; we just\
    \ need to tap into that. To do this, we'll need to make use of what I call a Requestor.\n\
    \n# Time for action – creating an HTTP Requestor\n\nThe idea is, we move all of\
    \ the code regarding the URLLoader from CustomGraphContainerController to a separate\
    \ class, called HTTPRequestor. We will then replace the CustomGraphContainerController\
    \ constructor with this:\n\n```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    {\n    super(a_graphControlContainer);\n    _requestor = new HTTPRequestor();\n\
    \    _requestor.request(new GraphRequest(\"PacktPub\"));\n}\n```\n\nWhy bother?\
    \ Well, apart from being neater, there are two main advantages:\n\n+   1. It's\
    \ much simpler to request several Graph Objects or Graph Lists; no need to deal\
    \ with multiple instances of URLLoader.\n+   2. In the next chapter, we'll see\
    \ how to use the official Adobe AS3 Facebook SDK to retrieve information from\
    \ the Graph API. If all the code for a request is encapsulated in one class, then\
    \ we only need to change one line to switch from using HTTP to using Adobe's SDK:\n\
    +   ```\n+   public function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
    +   {\n+       super(a_graphControlContainer);\n+       _requestor = new SDKRequestor();\n\
    +       _requestor.request(new GraphRequest(\"PacktPub\"));\n+   }\n+   ```"
  merge: -1
  img_proc: true
- pgno: 63
  md: "GraphRequest is a simple class; its constructor allows you to use two parameters\
    \ to specify what you'd like to retrieve from the Graph API:\n\n+   - objectID,\
    \ the name of any Graph Object.\n+   - connectionID, the name of any connection\
    \ of that Graph Object.\n\nSo, to request the Packt Publishing Page, you would\
    \ use this GraphRequest:\n\n```\nnewGraphRequest(\"PacktPub\");\n```\n\nand to\
    \ request the list of Posts from the Packt Publishing Page, you'd use this:\n\n\
    ```\nnewGraphRequest(\"PacktPub\", \"posts\");\n```\n\nThe class is already written;\
    \ it's in \\src\\com\\graph\\apis\\http\\HTTPRequestor.as. Take a look! There\
    \ are a few changes from the code we wrote in CustomGraphContainerController.as,\
    \ but these all have comments to explain them:\n\n```\npackage graph.apis.http\n\
    {\n    import events.DialogEvent;\n    import events.RequestEvent;\n    import\
    \ flash.events.Event;\n    import flash.events.EventDispatcher;\n    import flash.events.HTTPStatusEvent;\n\
    \    import flash.events.IEventDispatcher;\n    import flash.events.IOErrorEvent;\n\
    \    import flash.net.URLLoader;\n    import flash.net.URLRequest;\n    import\
    \ flash.net.URLVariables;\n    import flash.utils.Dictionary;\n    import graph.apis.base.IRequestor;\n\
    \    import graph.BaseGraphItem;\n    import graph.GraphList;\n    import graph.GraphObject;\n\
    \    import graph.GraphRequest;\n    import com.adobe.serialization.json.JSON;\n\
    \n    //the class needs to dispatch events (see later in code for why)\n    public\
    \ class HTTPRequestor extends EventDispatcher implements IRequestor\n    {\n \
    \       //this is used to figure out which GraphRequest created each\n       \
    \ //loader\n        private var __requests:Dictionary = new Dictionary();\n\n\
    \        public function HTTPRequestor(target:IEventDispatcher = null)\n     \
    \   {\n```"
  merge: -1
  img_proc: true
- pgno: 64
  md: "```\n//this is needed because the class extends EventDispatcher\nsuper(target);\n\
    }\n\npublic function request(a_request:GraphRequest):void\n{\n    var loader:URLLoader\
    \ = new URLLoader();\n    var urlRequest:URLRequest = new URLRequest();\n    var\
    \ variables:URLVariables = new URLVariables();\n\n    //We construct a URL from\
    \ the parameters of the GraphRequest\n    urlRequest.url = \"https://graph.facebook.com/\"\
    \ + a_request.objectID;\n    if (a_request.connectionID)\n    {\n        urlRequest.url\
    \ += \"/\" + a_request.connectionID;\n    }\n\n    variables.metadata = 1;\n \
    \   urlRequest.data = variables;\n\n    //this is used to figure out which GraphRequest\
    \ created the loader later\n    _requests[loader] = a_request;\n\n    loader.addEventListener(Event.COMPLETE,\
    \ onGraphDataLoadComplete);\n    loader.load(urlRequest);\n}\n\nprivate function\
    \ onGraphDataLoadComplete(a_event:Event):void\n{\n    var loader:URLLoader = a_event.target\
    \ as URLLoader;\n    var graphData:String = loader.data;\n    var decodedJSON:Object\
    \ = JSON.decode(graphData);\n\n    //we find the original GraphRequest used to\
    \ start the loader\n    var originalRequest:GraphRequest = _requests[loader] as\
    \ GraphRequest;\n\n    if (decodedJSON.data)\n    {\n        var graphList:GraphList\
    \ = new GraphList();\n```"
