- pgno: 121
  md: "# Time for action –implementing the SDK\n\nThe SDK source files have already\
    \ been downloaded and copied into the Visualizer project directory; find them\
    \ in \\src\\com\\facebook\\. (For information on downloading the latest version\
    \ of the SDK and including it in your own project, refer to Chapter 1.)\n\nWe're\
    \ going to build another Requestor, but this time it'll be powered by the SDK,\
    \ rather than by our own URLRequest. Start by creating a new folder in \\src\\\
    apis\\ called \\ sdk\\. Then, create a new file inside this folder called SDKRequestor.as.\
    \ Make it extend EventDispatcher and implement IRequestor, just like HTTPRequestor.\n\
    \nHere's the basic code for that class:\n\n```\npackage graph.apis.sdk\n{\n  \
    \  import flash.events.EventDispatcher;\n    import flash.events.IEventDispatcher;\n\
    \    import graph.apis.base.IRequestor;\n    import graph.GraphRequest;\n\n  \
    \  public class SDKRequestor extends EventDispatcher\n        implements IRequestor\n\
    \    {\n\n        public function SDKRequestor(target:IEventDispatcher = null)\n\
    \        {\n            super(target);\n        }\n\n        public function request(a_request:GraphRequest):void\n\
    \        {\n        }\n\n        public function attemptToAuthenticate(...permissions):void\n\
    \        {\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 122
  md: "Next, import the Facebook class. This is the API for web-based applications:\n\
    \n```\nimport com.facebook.graph.Facebook;\n```\n\nWe need to initialize this\
    \ class before we can do anything with it. To do so, we must pass it our application's\
    \ ID and a callback function. Do this in the SDKRequestor() constructor:\n\n```\n\
    public function SDKRequestor(target:IEventDispatcher = null)\n{\n    super(target);\n\
    \n    Facebook.init(\"«your_application_id»\", initComplete);\n}\n```\n\nNext\
    \ we must create this initComplete() function, which will be called once the initialization\
    \ process finishes. Add this to SDKRequestor.as as shown in the following code:\n\
    \n```\nprivate function initComplete(success:Object, fail:Object):void\n{\n}\n\
    ```\n\nThe function needs those two parameters – success and fail – or the code\
    \ won't compile. If there were no problems with the initialization, then success\
    \ will be an object of type com.Facebook.graph.data.FacebookSession; otherwise,\
    \ success will be null, and fail will contain details. Let's deal with this using\
    \ the following code:\n\n```\nprivate function initComplete(success:Object, fail:Object):void\n\
    {\n    if (success is FacebookSession)\n    {\n        //was a success.\n    }\n\
    \    else\n    {\n        //was a failure. See contents of 'fail' object.\n  \
    \  }\n}\n```\n\nYou must import the FacebookSession too as shown in the following\
    \ code:\n\n```\nimport com.facebook.graph.data.FacebookSession;\n```"
  merge: -1
  img_proc: true
- pgno: 123
  md: "Let's make it dispatch a COMPLETE event when it's ready, so that we know it's\
    \ safe to call other methods:\n\n```\nprivate function initComplete(success:Object,\
    \ fail:Object):void\n{\n    if (success is FacebookSession)\n    {\n        dispatchEvent(new\
    \ Event(Event.COMPLETE))\n    }\n    else\n    {\n        //was a failure. See\
    \ contents of 'fail' object.\n    }\n}\n```\n\nYou must import flash.events.Event\
    \ for this to work.\n\nOnce the API is initialized, we can authenticate the user\
    \ using the Facebook.login() method. The call to this should go in attemptToAuthenticate():\n\
    \n```\npublic function attemptToAuthenticate(...permissions):void\n{\n    Facebook.login(loginComplete);\n\
    }\n```\n\nThis will cause a pop-up window to appear, asking the user to log in\
    \ and allow our application to access the user's profile. If no pop-up appears,\
    \ check that cookies are enabled; it won't work otherwise.\n\nThe loginComplete\
    \ parameter passed to Facebook.login() is another callback function, of the same\
    \ form as initComplete(), which is called once the user has authenticated. Add\
    \ this to SDKRequestor.as:\n\n```\nprivate function loginComplete(success:Object,\
    \ fail:Object):void\n{\n    if (success is FacebookSession)\n    {\n        //was\
    \ a success.\n    }\n    else\n    {\n        //was a failure. See contents of\
    \ 'fail' object.\n    }\n}\n```"
  merge: -1
