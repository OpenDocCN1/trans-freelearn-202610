- pgno: 29
  md: '+   - **How To Use A Document Class In Flash**—A short tutorial to get you
    up to speed with using document classes in Flash CS3 and above: http://active.tutsplus.com/tutorials/actionscript/quick-tip-how-to-use-a-document-class-in-flash/.

    +   - **AS3 101**—A series of tutorials to walk you through the basics of AS3
    development. In particular, read from Part 8 onwards, as these deal with OOP in
    AS3: http://active.tutsplus.com/series/as3-101/.


    +   - You should also know how to create and compile a SWF project, and be familiar
    enough with HTML to be able to embed a SWF in it. We''ll use **SWFObject** for
    this purpose (this is the default embed method used by Flash CS5); if you''re
    not sure what this means, familiarize yourself here: http://code.google.com/p/swfobject/.

    +   - All important AS3 classes and keywords used in this book will be briefly
    explained as they become relevant, so don''t worry if you haven''t memorized the
    **LiveDocs** yet. Speaking of LiveDocs, remember that you can always use them
    to look up unfamiliar code: http://help.adobe.com/en_US/FlashPlatform/reference/actionscript/3/index.html.


    # The source code


    At the start of *Chapter 2, Welcome to the Graph*, you''ll be given a Flash project
    that''s just an empty user interface—it''ll be up to you to build the backend
    using the lessons you learn from Chapters 2 through 6.


    This project is called **Visualizer**, and contains the class structure and all
    the UI for an application that can be used to represent all of the information
    stored on Facebook. You''ll go far beyond simply allowing people to log in to
    the application and grabbing their username; there is so much more that can be
    achieved with AS3 and the Graph API, and you''ll learn about all of it.


    Although the project is complex, the classes have been arranged in such a way
    that you need to modify only a small number of them, and these have little or
    no code in them to begin with. This means that you don''t have to dive into mountains
    of code that you didn''t write! You can focus entirely on learning about the Facebook
    side of Flash development.


    Each of the Chapters from 2 to 6 has two associated ZIP files: one for the start
    of the project at the start of the chapter, and one for the end. This means you
    could skip through those chapters in any order, but you''ll find it must easier
    to learn if you go through them in sequence. All project files are available in
    forms that are compatible with Flash CS3 and above, Flash Builder, and FlashDevelop—and
    if you use a different Flash editor, you should find it easy to convert the project.'
  merge: -1
  img_proc: true
