- pgno: 185
  md: "# Searching feeds and wall posts\n\nThe Graph URL search may be limited compared\
    \ to Facebook's Full Search, but there are two types of search that can only be\
    \ done via the Graph API:\n\n+   - Searching for specific items in your news feed\n\
    +   - Searching for things that a specific friend has posted\n\n# Time for action\
    \ – searching your news feed\n\nYour news feed is the list you see when you log\
    \ in to the Facebook website; all the status updates, links, videos, and photos\
    \ that your friends (and other Graph website to which you are subscribed, such\
    \ as pages you \"like\") have posted.\n\nWe've seen that we can access this feed\
    \ through your profile's home connection:\n\n```\nhttps://graph.facebook.com/me/home?access_token=«access_token»\n\
    ```\n\nwhich returns a Graph List, as you'd expect.\n\nWe can search within this\
    \ feed by specifying a value for the q parameter:\n\n```\nhttps://graph.facebook.com/me/home?q=test&access_token=«access_token»\n\
    ```\n\n```\n\"data\": [\n  {\n    \"id\": \"151673724649_415202504649\",\n   \
    \ \"from\": {\n      \"name\": \"Activetuts\",\n      \"category\": \"Products_other\"\
    ,\n      \"id\": \"151673724649\"\n    },\n    \"message\": \"Test Your Observation\
    \ Skills With an AS3 Difference Game \\u2013 Active Premium\",\n    \"link\":\
    \ \"http://feedproxy.google.com/~r/Flashtuts/~3/i8-bZF-Mvhc/\",\n    \"description\"\
    : \"Today, we have another Active Premium tutorial exclusively available to Premium\
    \ members. If you want to take your ActionScript skills to the next level, then\
    \ we have an awesome tutorial for you, courtesy of Stephan Meesters\",\n    \"\
    type\": \"link\",\n    \"created_time\": \"2010-07-28T11:07:12+0000\",\n    \"\
    updated_time\": \"2010-07-28T11:07:12+0000\"\n  }\n],\n\"paging\": {\n```"
  merge: -1
  img_proc: true
- pgno: 186
  md: '```

    "previous": "https://graph.facebook.com/61300894/home?q=test&access_token=«access_token»&limit=25&since=2010-07-28T11%3A07%3A12%2B0000",

    "next": "https://graph.facebook.com/61300894/home?q=test&access_token=«access_token»&limit=25&until=2010-07-20T15%3A01%3A01%2B0000"

    }

    ```


    # What just happened?


    Perhaps this should be thought of more as a filter than a search. Regardless,
    the end result is a Graph List of posts from your news feed containing the specified
    query.


    The search terms don''t have to appear in the actual text of the post; suppose
    it''s my friend Bill''s birthday. If I load:


    ```

    https://graph.facebook.com/me/home?q=Bill&access_token=«access_token»

    ```


    then I will see:


    +   - My own post on Bill''s wall, saying "Happy Birthday, Bill!" (because the
    post contains the word "Bill")

    +   - My friend Bob''s post on Bill''s wall, saying "Happy Birthday!" (because
    the person receiving the post is called "Bill" – which means that there are two
    reasons for my own post to be in these results)

    +   - Bill''s post saying "Thanks for the birthday wishes, everyone!" (because
    his name is Bill)


    Unfortunately there''s no way to narrow this down and specify where you want to
    look for matches – at least, not using a Graph Search URL.


    You''re probably wondering whether we can substitute another person''s User ID
    instead of "me", and thus see what posts will be appearing in their news feed.
    We can''t do this, for privacy reasons, but we can do something similar.


    # Time for action – searching a friend''s Wall Posts


    It''s confusing that the Graph URL for your news feed (which you''ll see when
    you log in) is:


    ```

    https://graph.facebook.com/me/home?access_token=«access_token»

    ```


    The link to your wall is:


    ```

    https://graph.facebook.com/me/feed?access_token=«access_token»

    ```


    It''s just something to memorize, I''m afraid.'
