- pgno: 151
  md: "4. Click on the Show button on the new Filter bar as shown in the previous\
    \ screenshot.\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_151_0.png)\n\n5. This\
    \ new panel allows you to enter dates to use for since-until filtering.\n\n6.\
    \ Type any date and time into the boxes, or use the C buttons to bring up calendar\
    \ controls which can be used instead.\n\n7. When the user clicks the Filter button\
    \ in this panel, it calls a protected function, listFilterCallback(), in the class\
    \ that CustomGraphContainerController extends, and passes it the dates entered\
    \ and the IDs of the Graph Object and connection that the List Renderer represents.\n\
    \nThis means that CustomGraphContainerController inherits that function, so we\
    \ can make it create a new GraphRequest for this Graph Object and connection,\
    \ using those dates.\n\n8. So, open CustomGraphContainerController.as and override\
    \ the function:\n\n```\noverride protected function listFilterCallback(a_objectID:String,\
    \ a_connectionType:String, a_since:String, a_until:String):void\n{\n    super.listFilterCallback(a_objectID,\
    \ a_connectionType, a_since, a_until);\n}\n```"
