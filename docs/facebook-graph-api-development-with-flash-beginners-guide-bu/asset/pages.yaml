- pgno: 47
  md: "```\n\"category\": \"Products_other\",\n\"username\": \"PacktPub\",\n\"company_overview\"\
    : \"Packt is a modern, IT focused book publisher, specializing in producing cutting-edge\
    \ books for communities of developers, administrators, and newbies alike.\\n\\\
    nPackt published its first book, Mastering phpMyAdmin for MySQL Management in\
    \ April 2004.\",\n\"fan_count\": 412\n}\n```\n\nand it turned the string into\
    \ a native AS3 object, as if we had typed this:\n\n```\nvar graphObject:Object\
    \ = {};\ngraphObject.id = \"204603129458\";\ngraphObject.name = \"Packt Publishing\"\
    ;\ngraphObject.picture = \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs302.ash1/23274_204603129458_7460_s.jpg\"\
    ;\ngraphObject.link = \"http://www.facebook.com/PacktPub\";\ngraphObject.category\
    \ = \"Products_other\";\ngraphObject.username = \"PacktPub\";\ngraphObject.company_overview\
    \ = \"Packt is a modern, IT focused book publisher, specializing in producing\
    \ cutting-edge books for communities of developers, administrators, and newbies\
    \ alike.\\n\\nPackt published its first book, Mastering phpMyAdmin for MySQL Management\
    \ in April 2004.\"\ngraphObject.fan_count = 412;\n```\n\n(Note that unlike the\
    \ raw string we had earlier, the slashes in the URLs have not been escaped.)\n\
    \nThis means we can easily access any of the information Facebook has about this\
    \ Page, or even iterate through every piece of data.\n\n# Time for action – visualizing\
    \ the info\n\nEnough traces! It's time we displayed something in our actual SWF.\n\
    \nCustomGraphContainerController inherits a method called renderGraphObject ()\
    \ which will take care of this for us. All we have to do is pass it an argument\
    \ of type graph.GraphObject.\n\nGraphObject.as is a simple class; feel free to\
    \ open it and take a look:\n\n```\npackage graph\n{\n    import graph.controls.GraphObjectRenderer;\n\
    \    public dynamic class GraphObject extends BaseGraphItem\n```"
  merge: -1
  img_proc: true
- pgno: 48
  md: "```\n{\n    public var rendererObject:GraphObjectRenderer;\n    public var\
    \ graphObjectListRenderers:Array = [];\n\n    public function GraphObject()\n\
    \    {\n\n    }\n\n}\n}\n```\n\nHonestly, there's no need to worry about any of\
    \ the code there. All you need to know is that it's dynamic, which means that\
    \ we can assign new properties to it during runtime, without having to specify\
    \ their names beforehand. So we can do this:\n\n```\nvar graphObject:GraphObject\
    \ = new GraphObject();\ngraphObject.favoriteColor = \"red\";\n```\n\nWhen a GraphObject\
    \ is passed to the CustomGraphContainerController.renderGraphObject() method,\
    \ every single property of the GraphObject will be rendered in a fancy list, automatically.\
    \ Every single property apart from the two that are defined in the class already,\
    \ that is!\n\nSo what we have to do, inside CustomGraphContainerController.onGraphDataLoadComplete(),\
    \ is:\n\n+   1. Create a new instance of GraphObject.\n+   2. Copy all the properties\
    \ of decodedJSON to this new GraphObject.\n+   3. Pass the GraphObject to renderGraphObject().\n\
    +   4. The code for doing that is as follows:\n\n```\nprivate function onGraphDataLoadComplete(a_event:Event):void\n\
    {\n    var loader:URLLoader = a_event.target as URLLoader;\n    //obtain whatever\
    \ data was loaded, and trace it\n    var graphData:String = loader.data;\n   \
    \ var decodedJSON:Object = JSON.decode(graphData);\n\n    var graphObject:GraphObject\
    \ = new GraphObject();\n    //copy all the properties from decodedJSON to graphObject\n\
    \    for (var key:String in decodedJSON)\n```"
  merge: -1
  img_proc: true
- pgno: 49
  md: "```\n{\n    graphObject[key] = decodedJSON[key];\n}\nthis.renderGraphObject(graphObject);\n\
    }\n```\n\n5. Compile and test. The SWF is shown in the next screenshot:\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_49_0.png)\n\
    \nYou can click the Zoom In button a few times to make the Renderer larger and\
    \ clearer, as in the screenshot above. Your Renderer might display the fields\
    \ in a different order than depicted; Facebook returns the fields in an arbitrary\
    \ order.\n\n# What just happened?\n\nThe window that appeared on stage is what\
    \ I call a Renderer – specifically, a Graph Object Renderer. It can be dragged\
    \ around by the title bar, the contents can be scrolled, and you can close it\
    \ by clicking the button in the top-right corner.\n\nSo, you've successfully fetched\
    \ data from Facebook's Graph API and displayed it in a SWF. Your SWF is flexible;\
    \ change request.url to point to the Graph URL of a different Facebook object\
    \ and you'll see it displayed in the Renderer."
  merge: -1
  img_proc: true
- pgno: 50
  md: "Most of the data from the GraphObject is displayed in a text area inside the\
    \ window, in a simple \"key: value\" format. The Page's name field is displayed\
    \ in the window's title bar, and if the Page has a picture field (we can see from\
    \ the JSON that PacktPub does), the image is downloaded and displayed inside the\
    \ renderer using a Loader.\n\n> Like URLLoader, the flash.display.Loader class\
    \ downloads the object that a given URLRequest points to, dispatching a COMPLETE\
    \ event when ready. Unlike URLLoader, Loader is used to download images and SWFs,\
    \ and the event is actually dispatched by one of its sub-objects, contentLoaderInfo.\
    \ Also, Loader extends DisplayObject, and takes the appearance of the image when\
    \ it has finished downloading.\n> \n> Flash's security model prevents an image's\
    \ data being accessed by SWFs residing on a different domain than the image itself,\
    \ unless there is a cross-domain policy file on the domain of the image that allows\
    \ it. Fortunately, Facebook's cross-domain policy file is lenient, allowing such\
    \ access by every domain.\n\nSo, really, this is just a graphical way of representing\
    \ a Page object from the Graph API.\n\n# Understanding connections\n\n\"That's\
    \ all well and good,\" you may be thinking, \"but it doesn't show all the data\
    \ associated with the Page, does it? Where are the wall posts and photos?\"\n\n\
    # Time for action – finding connections in a browser\n\nFacebook treats wall posts,\
    \ photos, videos, and even statuses as separate objects within the Graph API,\
    \ rather than jamming them all into a single Page object. For instance, here's\
    \ an object representing a single Post by Packt Publishing:\n\n```\n{\n  \"id\"\
