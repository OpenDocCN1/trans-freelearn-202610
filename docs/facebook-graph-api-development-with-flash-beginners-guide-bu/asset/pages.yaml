  md: "What about the other property inside the Graph List, the paging object? We\
    \ should add that too:\n\n```\nif (decodedJSON.data)\n{\n    //has a \"data\"\
    \ property so we assume it is a Graph List\n    var graphList:GraphList = new\
    \ GraphList();\n    var childGraphObject:GraphObject,\n    for each (var childObject:Object\
