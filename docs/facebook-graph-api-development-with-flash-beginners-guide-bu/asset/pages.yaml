- pgno: 55
  md: "I've created a second renderer: this time, a Graph List Renderer. I've also\
    \ created a class graph.GraphList. And CustomGraphContainerController inherits\
    \ a method called renderGraphList(). Perhaps unsurprisingly, this takes an object\
    \ of type graph.GraphList as a parameter, and creates a new Graph List Renderer\
    \ to display its contents. So, we need to take a Graph List that we receive from\
    \ the Graph API, and turn it into an instance of the GraphList class. The GraphList\
    \ class is a little more sophisticated than the GraphObject class; it has a method\
    \ called addToList(), to which we can pass any GraphObject instance to be added\
    \ to the list.\n\nWe'll still loop through the data array, then, but instead of\
    \ rendering each GraphObject on its own, we'll add each one to a GraphList and\
    \ render that.\n\nModify the URL that CustomGraphContainerController requests,\
    \ so that it loads the list of posts:\n\n```\npublic function CustomGraphContainerController\n\
    \    (a_graphControlContainer:GraphControlContainer)\n{\n    super(a_graphControlContainer);\n\
    \n    var loader:URLLoader = new URLLoader();\n    var request:URLRequest = new\
    \ URLRequest();\n    //Specify which Graph URL to load\n    request.url = \"https://graph.facebook.com/PacktPub/posts\"\
    ;\n    loader.addEventListener(Event.COMPLETE, onGraphDataLoadComplete);\n   \
    \ //Start the actual loading process\n    loader.load(request);\n}\n```\n\nNow,\
    \ once this is loaded, we need to check whether the item returned is a Graph Object\
    \ or a Graph List. We can do this by looking for a property called data; if one\
    \ exists, we'll assume it's a List.\n\n```\nprivate function onGraphDataLoadComplete(a_event:Event):void\n\
    {\n    var loader:URLLoader = a_event.target as URLLoader;\n    //obtain whatever\
    \ data was loaded, and trace it\n    var graphData:String = loader.data;\n   \
    \ var decodedJSON:Object = JSON.decode(graphData);\n\n    if (decodedJSON.data)\n\
    \    {\n        //has a \"data\" property so we assume it is a Graph List\n  \
    \  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 56
  md: "```\nelse\n{\n    //no \"data\" so we assume it is a Graph Object\n    var\
    \ graphObject:GraphObject = new GraphObject();\n    //copy all the properties\
    \ from decodedJSON to graphObject\n    for (var key:String in decodedJSON)\n \
    \   {\n        graphObject[key] = decodedJSON[key];\n    }\n    this.renderGraphObject(graphObject);\n\
    }\n```\n\nInside this if block, we first create a new GraphList instance:\n\n\
    ```\nif (decodedJSON.data)\n{\n    //has a \"data\" property so we assume it is\
    \ a Graph List\n    var graphList:GraphList = new GraphList();\n}\n```\n\n(You\
    \ will need to import graph.GraphList.)\n\nNext, remember than decodedJSON.data\
    \ is an array of objects; we loop through this array, and create a GraphObject\
    \ from each element.\n\n```\nif (decodedJSON.data)\n{\n    //has a \"data\" property\
    \ so we assume it is a Graph List\n    var graphList:GraphList = new GraphList();\n\
    \    var childGraphObject:GraphObject;\n    for each (var childObject:Object in\
    \ decodedJSON.data)\n    {\n        childGraphObject = new GraphObject();\n  \
    \      for (var childKey:String in childObject)\n        {\n            childGraphObject[childKey]\
    \ = childObject[childKey];\n        }\n    }\n}\n```\n\nThis is basically the\
    \ same thing we did with the decodedJSON when loading a single Graph Object."
