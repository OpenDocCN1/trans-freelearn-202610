- pgno: 54
  md: 'In the previous diagram, each object is a node, and the lines represent different
    types of connection.


    Fetching http://graph.facebook.com/packtpub/posts gets you all the nodes joined
    to PacktPub by a "post" connection – that is, all Post objects that have been
    posted on Packt’s wall:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_54_0.png)


    # Have a go hero – exploring connections


    Now that you know about the metadata parameter, explore the different types of
    connections in your browser, and see what new kinds of objects you can find.


    # Rendering Lists


    What happens if you try to load https://graph.facebook.com/packtpub/posts using
    the same code we used to load the Packt Publishing Page object?


    We get this in the output panel:


    Graph Object was null!


    Not a success. The way the Graph API structures the JSON here is totally different
    to how it structures the JSON for a Page, Post, or any other Graph Object. The
    same is true of the JSON for the other connection URLs. We call this structure
    a Graph List.


    # Time for action – rendering Lists of Posts


    Since a Graph List''s data property is an array of Graph Objects, we could just
    loop through the array and create a new Graph Object Renderer for each element.
    Feel free to have a go at this, if you like, but I''ve got another solution.'
