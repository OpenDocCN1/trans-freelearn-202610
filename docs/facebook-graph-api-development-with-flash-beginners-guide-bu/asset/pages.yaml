    +   8. Recompile the SWF and load the same connection:


    ![](img/4e826fa36038b86f2087ef8b818d0acf_135_0.png)


    # What just happened?


    We can now see how many Objects are in the Graph List returned by my profile’s
    feed connection: 25. But naturally, I’ve written more than 25 status updates since
    joining Facebook. What’s going on? A little more exploration shows that 25 seems
    to be the default maximum number of items you’ll get back when requesting a List.
    Sometimes you’ll get less than this (even if there are more than 25 objects in
    the album or feed).


    That might be okay for a news feed, where only the most recent entries are relevant,
    but it’s useless for an album; naturally, you’d like to see all the photos.


    How can we get Facebook to give us more Objects?'
