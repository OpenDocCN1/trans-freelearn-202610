- pgno: 295
  md: "5. Load the Facebook Authorize URL:\n\n```\nvar stageWebView:StageWebView =\
    \ new StageWebView();\nstageWebView.stage = this.stage;\nstageWebView.viewPort\
    \ = new Rectangle(0, 0, stage.stageWidth,\nstage.stageHeight);\nstageWebView.addEventListener(LocationChangeEvent.LOCATION_CHANGE,\n\
    onRedirect);\nvar authURL:String = \"https://graph.facebook.com/oauth/\nauthorize?client_id=«application_id»&type=user_agent&redirect_\n\
    uri=«redirect_url»\";\nstageWebView.loadURL(authURL);\n```\n\n6. Note that the\
    \ StageWebView.loadURL() method does not require a URLRequest, but a String.\n\
    \n7. Extract the access token from the hash in the same way as before:\n\n```\n\
    private function onRedirect(a_event:LocationChangeEvent):void\n{\n    var stageWebView:StageWebView\
    \ = a_event.target as StageWebView;\n    if (stageWebView.location.indexOf(\"\
    #\") != -1)\n    {\n        var hash:String = stageWebView.location.substr\n \
    \           (stageWebView.location.indexOf(\"#\") + 1);\n        setAccessToken(hash);\n\
    \    }\n}\n```\n\n8. You can't use removeChild() to remove the StageWebView, so\
    \ use this method:\n\n```\nprivate function onRedirect(a_event:LocationChangeEvent):void\n\
    {\n    var stageWebView:StageWebView = a_event.target as StageWebView;\n    if\
    \ (stageWebView.location.indexOf(\"#\") != -1)\n    {\n        var hash:String\
    \ = stageWebView.location.substr\n            (stageWebView.location.indexOf(\"\
    #\") + 1);\n        setAccessToken(hash);\n        stageWebView.stage.nativeWindow.close();\n\
    \    }\n}\n```\n\nThat will work! There's just one small tweak we have to make.\
    \ On Android, the StageWebView uses the Android OS system web control (in desktop\
    \ AIR, the internal AIR WebKit engine is used). Since we don't have full control\
    \ over this, we need to make sure it doesn't do anything unexpected, like open\
    \ the browser application."
  merge: -1
  img_proc: true
- pgno: 296
  md: "9. To do this, prevent the StageWebView instance's default action as soon as\
    \ it dispatches the LOCATION_CHANGING event (this is dispatched just before the\
    \ location changes):\n\n```\nvar stageWebView:StageWebView = new StageWebView();\n\
    stageWebView.stage = this.stage;\nstageWebView.viewPort = new Rectangle(0, 0,\
    \ stage.stageWidth,\nstage.stageHeight);\nstageWebView.addEventListener(LocationChangeEvent.LOCATION_CHANGE,\n\
    onRedirect);\nstageWebView.addEventListener(LocationChangeEvent.LOCATION_CHANGING,\n\
    onRedirecting);\nvar authURL:String = \"https://graph.facebook.com/oauth/\nauthorize?client_id=«application_id»&type=user_agent&redirect_uri=«redirect_url»\"\
    ;\nstageWebView.loadURL(authURL);\n\nprivate function onRedirecting(a_event:LocationChangeEvent):void\n\
    {\n    var stageWebView:StageWebView = a_event.target;\n    a_event.preventDefault();\
    \  //stop any unexpected default\n    //behavior\n    stageWebView.loadURL(a_event.location);\n\
    \    //...but continue loading the URL\n}\n```\n\n# What just happened?\n\nUsing\
    \ a StageWebView, you authenticated a user with Facebook through an AIR for Android\
    \ application. Since URLLoader instances can be used in the same way in AIR for\
    \ Android as they can in a regular SWF, this means that you can now make Android\
    \ applications that are totally integrated with Facebook, using Flash.\n\n# Have\
    \ a go hero – modifying the SDK for Android\n\nAt time of writing, the SDK uses\
    \ an HTMLLoader for AIR authentication, and JavaScript for SWF authentication,\
    \ so cannot be used to authenticate an Android application. If you really want\
    \ to use the SDK for your Android projects, you'll have to make some changes of\
    \ your own.\n\nAdd StageWebView-based login functionality to the SDK. Rather than\
    \ modifying existing SDK class files, create new class files that extend existing\
    \ ones – that way, they won't be lost if you update the SDK in future.\n\nIt's\
    \ a tricky challenge because you'll be modifying someone else's code, but worth\
    \ it if you want to use the SDK."
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Choosing your application''s Facebook settings


    There''s more to an application''s settings than Canvas URLs. Here are some of
    the more interesting options:


    +   - **Advanced | Deauthorize Callback**: Here you can specify a URL that will
    get called whenever a user removes your application; the ID of the user will be
    passed to this URL. In order to do something with this ID, you''ll need to use
    a server-side scripting language – see "What Next?" later in this chapter. More
    information on decoding the info is available here: http://developers.facebook.com/docs/authentication/

    +   - **About | Developers**: Allows you to set other users as a developer of
    your application, giving them access to the application settings.

    +   - **Advanced | Sandbox Mode**: Very useful for testing, this will only allow
    a user to sign in to your application if they are listed as a developer of that
    application.

    +   - **Facebook Integration | Bookmark URL**: On the left side of the Facebook
    home page, you can see a list of applications and games that you''ve used:

    +   - These are called **Bookmarks**; setting the Bookmark URL lets you choose
    where these links point to.

    +   The number to the right of a Bookmark is called a **Counter**, and lets the
    user know about notifications and changes within the application. Read more about
    Counters here: http://developers.facebook.com/docs/guides/canvas/#bookmarks.

    +   - **About | Icon and About | Logo**: The icon appears next to Bookmarks and
    below wall posts created via your app, while the logo appears in the authorization
    page and in search results.


    ![](img/4e826fa36038b86f2087ef8b818d0acf_297_0.png)'
  merge: -1
  img_proc: true
