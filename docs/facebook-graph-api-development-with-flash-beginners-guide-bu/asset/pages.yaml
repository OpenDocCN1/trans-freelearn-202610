- pgno: 146
  md: "# Digging Deeper into the Graph\n\nAlso, notice that the \"30 days or 50 posts\"\
    \ limit does not seem to apply here, as this post is much older than a year, and\
    \ there have been far more than 50 posts made since.\n\nUnfortunately, this is\
    \ just what using paging with Graph URLs is like, at least for the time being.\
    \ Sometimes it works as expected, but sometimes it behaves in strange and mysterious\
    \ ways, as we've seen. Again, it's possible that all the issues will have been\
    \ sorted out by the time you read this – but just in case they haven't, take care\
    \ if designing a project around Graph URL paging.\n\n**In the situations where\
    \ it works**, the `until` parameter can take dates in lots of different forms:\n\
    \n+   - 31march2009\n+   - May-4th-2010\n+   - 2010-12-25\n+   - Yesterday\n+\
    \   - First Monday of September 2009\n+   - 12 days ago\n+   - -7 weekdays\n\n\
    You can specify time, too:\n\n+   - 31march2009 15:10\n+   - May-4th-2010 noon\n\
    +   - 2010-12-25T08:00:00\n+   - 12 days ago 8pm\n+   - Today 7:30AM\n\nA full\
    \ list of formats is available at: http://www.php.net/manual/en/datetime.formats.php.\n\
    \n> **Remember:** URLs don't like characters like + (or even spaces, really),\
    \ so be sure to encode your URL before passing it to a URLRequest. You can use\
    \ AS3's built-in `escape()` method for this:\n> \n> ```\n> var urlEncodedString:String\
    \ = escape(unencodedURL);\n> ```\n> For more information, check out the LiveDocs\
    \ Page on escape():\n> http://www.adobe.com/livedocs/flash/9.0/ActionScriptLangRefV3/package.html#escape()."
  merge: -1
  img_proc: true
- pgno: 147
  md: "So, the `until` parameter lets us specify the latest day and time to filter\
    \ our data by; it also has a sister parameter that lets us specify the earliest\
    \ date: `since`. It works in exactly the same way and allows exactly the same\
    \ formats of dates and times.\n\n> To requests posts from the Facebook page from\
    \ April 21st, 2010 (the day the Graph API was released), we would use this URL:\n\
    > `https://graph.facebook.com/facebook/photos?since=21april2010T00:00:01&until=21april2010T23:59:59`\n\
    > If there were more than 25 posts on that day, then we could even use `offset`\
    \ and `limit` alongside `since` and `until` to split that list into further pages.\n\
    > That exact URL won't return any data (since it's more than 30 days ago), but\
    \ this example shows the format that you have to use.\n\nOkay, let's get this\
    \ into our application.\n\n# Time for action – adding since and until to GraphRequest\
    \ instances\n\nThe procedure for allowing us to use `since-until` with our `GraphRequest`\
    \ instances is almost identical to that for allowing us to use `limit-offset`.\n\
    \n+   1. Add `since` and `until` string properties to `GraphRequest.as` as shown\
    \ in the following code:\n\n```\npackage graph\n{\n    public class GraphRequest\n\
    \    {\n        public var objectID:String = \"\";\n        public var connectionID:String\
    \ = \"\";\n        public var limit:int = 25;\n        public var offset:int =\
    \ 0;\n        public var since:String = \"\";\n        public var until:String\
    \ = \"\";\n\n        public function GraphRequest(a_objectID:String = \"\",\n\
    \            a_connectionID:String = \"\")\n        {\n            this.objectID\
    \ = a_objectID;\n            this.connectionID = a_connectionID;\n        }\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 148
  md: "2. In HTTPRequestor.as, set the properties of the URLVariables object depending\
    \ on these new strings:\n\n```\npublic function request(a_request:GraphRequest):void\n\
    {\n    var loader:URLLoader = new URLLoader();\n    var urlRequest:URLRequest\
    \ = new URLRequest();\n    var variables:URLVariables = new URLVariables();\n\n\
    \    //We construct a URL from the parameters of the GraphRequest\n    urlRequest.url\
    \ = \"https://graph.facebook.com/\" +\n        a_request.objectID;\n    if (a_request.connectionID)\n\
    \    {\n        //remember, this means a connection (and thus a list)\n      \
    \  //was requested\n        urlRequest.url += \"/\" + a_request.connectionID;\n\
    \    }\n\n    variables.metadata = 1;\n    variables.limit = a_request.limit;\n\
    \    variables.offset = a_request.offset;\n    variables.since = a_request.since;\n\
    \    variables.until = a_request.until;\n    if (accessToken != \"\")\n    {\n\
    \        variables.access_token = accessToken;\n    }\n    urlRequest.data = variables;\n\
    \n    //this is used to figure out which GraphRequest created the\n    //loader\
    \ later\n    _requests[loader] = a_request;\n\n    loader.addEventListener(Event.COMPLETE,\n\
    \        onGraphDataLoadComplete);\n    loader.addEventListener(IOErrorEvent.IO_ERROR,\
    \ onIOError);\n    loader.load(urlRequest);\n}\n```\n\n3. Modify the third parameter\
    \ passed to the Facebook.api() method in the request() function inside SDKRequestor.as:\n\
    \n```\npublic function request(a_request:GraphRequest):void\n{\n```"
