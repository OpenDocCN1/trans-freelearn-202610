- pgno: 154
  md: '# Digging Deeper into the Graph


    ```

    "picture": "http://photos-c.ak.fbcdn.net/hphotos-ak-snc3/hs185.snc3/19239_307944374458_204603129458_4527791_8102041_s.jpg",

    "source": "http://sphotos.ak.fbcdn.net/hphotos-ak-snc3/hs185.snc3/19239_307944374458_204603129458_4527791_8102041_n.jpg",

    "height": 666,

    "width": 540,

    "link": "http://www.facebook.com/photo.php?pid=4527791&id=204603129458",

    "icon": "http://static.ak.fbcdn.net/rsrc.php/z2E5Y/hash/8as8iqdm.gif",

    "created_time": "2010-02-04T12:40:07+0000",

    "updated_time": "2010-03-18T16:08:42+0000"

    }

    ],

    "paging": {

    "previous": "https://graph.facebook.com/307932939458/photos?limit=25&since=2010-03-18T16%3A00%3A38%2B0000",

    "next": "https://graph.facebook.com/307932939458/photos?limit=25&until=2010-02-04T12%3A40%3A06%2B0000"

    }

    }

    ```


    See that node called paging? It obviously contains two URLs, though they seem
    to have some junk attached to the end of them. Actually, it''s not junk; it''s
    just URL-encoded. Here''s how the previous URL looks when decoded:


    ```

    https://graph.facebook.com/307932939458/photos?limit=25&since=2010-03-18T16:00:38+0000

    ```


    It''s clearly a date with a timestamp, passed to a since parameter, just like
    we''ve been using.


    Facebook provides these as an easier alternative to the offset/limit-based paging
    we explored earlier in the chapter. Paging based on time makes a lot more sense
    than paging based on the items position in a list (as we explored before), because
    the date and time that an item was created will never change, while the item''s
    position in a list will change whenever a new item is added to that list.


    It''s true that items being deleted could cause problems: if we''ve already downloaded
    the item then we may not detect that it''s gone, leaving us with incorrect data.
    Even if we do a double-check and remove it, it''s going to leave a gap, meaning
    that the page of items that used to contain it will be shorter than the other
    pages. Whether these are serious problems depends on the application.'
  merge: -1
  img_proc: true
- pgno: 155
  md: "Since these paging links are bundled with the JSON, they're often easier to\
    \ implement than working out our own system based on `limit` and `offset` parameters.\
    \ That's not really true in our case, because we would have to extract the `since`\
    \ and `until` parameters from the `next` and `previous` URLs and then feed them\
    \ to a `GraphRequest` object – it would be easier to extract the dates of the\
    \ earliest and latest Graph Objects in the collection, and use those.\n\nStill,\
    \ this may come in useful for other projects you work on in the future, so it's\
    \ worth mentioning.\n\n# Requesting multiple IDs at once\n\nEarlier in the chapter\
    \ we learned how to retrieve a list of wall posts from a specific date range.\
    \ How would you get the basic information about all the people that wrote these\
    \ posts?\n\nBased on what we've seen so far, the obvious answer is to loop through\
    \ all of the IDs of all of the people, and request the User object for each of\
    \ them.\n\nThat's fine, but it's a bit clunky, and we have no way of associating\
    \ those people with each other. Wouldn't it be nicer if we could obtain them all\
    \ in a single List?\n\n# Time for action – using the ids parameter in a Graph\
    \ URL\n\nLoad the following URL in your browser:\n\n```\nhttps://graph.facebook.com/?ids=facebook,packtpub\n\
    {\n  \"facebook\": {\n    \"id\": \"20531316728\",\n    \"name\": \"Facebook\"\
    ,\n    \"picture\": \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs624.ash1/27535_20531316728_5553_s.jpg\"\
    ,\n    \"link\": \"http://www.facebook.com/facebook\",\n    \"category\": \"Technology\"\
    ,\n    \"username\": \"facebook\",\n    \"founded\": \"February 4, 2004\",\n \
    \   \"company_overview\": \"«overview»\",\n    \"mission\": \"Facebook's mission\
    \ is to give people the power to share and make the world more open and connected.\"\
    ,\n    \"fan_count\": 12672143\n  },\n  \"packtpub\": {\n    \"id\": \"204603129458\"\
    ,\n    \"name\": \"Packt Publishing\",\n\n```"
  merge: -1
  img_proc: true
- pgno: 156
  md: "```\n\"picture\": \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs302.ash1/23274_204603129458_7460_s.jpg\"\
    ,\n\"link\": \"http://www.facebook.com/PacktPub\",\n\"category\": \"Products_other\"\
    ,\n\"username\": \"PacktPub\",\n\"company_overview\": \"«overview»\",\n\"fan_count\"\
    : 437\n}\n```\n\n# What just happened?\n\nWe passed the IDs of two Pages at once\
    \ to the Graph, using the ids parameter, and it returned a JSON containing the\
    \ basic information of both of them.\n\nSo this is a List, right?\n\nWrong!\n\n\
    Well, it's not a List according to the definition we've been using so far, as\
    \ there's no data node. I'll call it a Compound Object. Compare the above to the\
    \ result you get if requesting the Facebook Page directly:\n\n```\nhttps://graph.facebook.com/facebook\n\
    {\n  \"id\": \"20531316728\",\n  \"name\": \"Facebook\",\n  \"picture\": \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs624.ash1/27535_20531316728_5553_s.jpg\"\
    ,\n  \"link\": \"http://www.facebook.com/facebook\",\n  \"category\": \"Technology\"\
    ,\n  \"username\": \"facebook\",\n  \"founded\": \"February 4, 2004\",\n  \"company_overview\"\
    : \"«overview»\",\n  \"mission\": \"Facebook's mission is to give people the power\
    \ to share and make the world more open and connected.\",\n  \"fan_count\": 12672338\n\
    }\n```\n\nYou can see that when requesting more than one Graph object at once,\
    \ the objects are jammed together as sub-nodes of a single object, each labeled\
    \ with their ID.\n\nNaturally, you don't have to use Page IDs; you can use the\
    \ ID of any object in the Graph, including Albums, Photos, and Users. What's more,\
    \ you can mix the types of ID you request, so you could request an Event, three\
    \ Users, and a dozen Photos all at once, and they'll be returned in the same JSON."
  merge: -1
