  md: "![](img/4e826fa36038b86f2087ef8b818d0acf_219_0.png)\n\nA note on images: That\
    \ small image in the post is still hosted on Wikimedia Commons, but is accessed\
    \ via a proxy PHP hosted on Facebook's server—http://platform.ak.fbcdn.net/ in\
    \ this case. The crossdomain.xml on that server is as follows:\n\n```\n<cross-domain-policy>\n\
    \    <site-control permitted-cross-domain-policies=\"master-only\"/>\n    <allow-access-from\
    \ domain=\"*\"/>\n</cross-domain-policy>\n```\n\nThis means that your application\
    \ can access the BitmapData of the image directly without any sandbox security\
    \ issues, no matter where the original image was hosted.\n\nThe actual Graph Object\
    \ created looks like this:\n\n```\n{\n  \"id\": \"«redacted»\",\n  \"from\": {\n\
    \    \"name\": \"Michael James Williams\",\n    \"id\": \"«redacted»\"\n  },\n\
    \  \"message\": \"Hello Britain!\",\n  \"picture\": \"http://platform.ak.fbcdn.net/www/app_full_proxy.php?app=«redacted»&v=1&size=z&cksum=«redacted»&src=http%3A%2F%2Fupload.wikimedia.org%2F\
    \ wikipedia%2Fcommons%2Fthumb%2Fa%2Fae%2FFlag_of_the_United_Kingdom.svg%2F200px-Flag_of_the_United_Kingdom.svg.png\"\
    ,\n  \"link\": \"http://en.wikipedia.org/wiki/Union_Flag\",\n  \"name\": \"Union\
    \ Flag\",\n  \"caption\": \"en.wikipedia.org\",\n  \"description\": \"The Union\
    \ Flag, also known as the Union Jack, is the flag of the United Kingdom.\",\n\
    \  \"icon\": \"http://graph.facebook.com/images/icons/hidden.gif\",\n  \"actions\"\
    : [\n    {\n      \"name\": \"Comment\",\n      \"link\": \"http://www.facebook.com/«redacted»/posts/«redacted»\"\
    \n    },\n    {\n      \"name\": \"Like\",\n      \"link\": \"http://www.facebook.com/«redacted»/posts/«redacted»\"\
