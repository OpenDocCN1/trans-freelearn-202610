  \ Requestor 分发 `COMPLETE` 事件，表明它已完成初始化，但我们的 `HTTPRequestor` 并没有这样做。我们可以移除事件监听器，但修改\
  \ Requestor 会更容易；打开 `HTTPRequestor.as`，并添加一个新函数：\n\n```\npublic function initialize():void\n\
