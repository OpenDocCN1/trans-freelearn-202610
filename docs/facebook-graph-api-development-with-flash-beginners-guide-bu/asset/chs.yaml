- "## 2\n\n## 欢迎来到图谱\n\n> Facebook 拥有关于人物、公司、活动、相册等的大量信息。它也知道这一切是如何关联的：哪个人拥有哪个相册；哪些人出现在哪张照片中；哪个公司组织哪场活动。\n\
  \n四年来，这些信息都是通过一个庞大而杂乱的 API 来访问的，随着新功能的不断加入，它变得越来越复杂。2010 年 4 月，Facebook 推出了 Graph\
  \ API，极大地简化了开发人员检索所有这些数据的方式。\n\n在本章中，我们将：\n\n- 探索 Facebook 图谱\n- 了解 Graph API 是什么，以及它如何组织\
  \ Facebook 上的所有数据\n- 使用 AS3 和 Graph API 访问公开图谱数据\n\n那么让我们开始吧。\n\n## 通过浏览器访问 Graph\
  \ API\n\n我们直接来看看 Graph API 如何表示一个公共页面的信息。\n\n当我提到大写 P 的页面（Page）时，我指的不是 Facebook\
  \ 网站中的任意网页；我指的是一种特定类型的页面，也称为公共主页。每个 Facebook 用户都有自己的个人主页；你可以通过登录 Facebook 并点击网站顶部导航栏中的“主页”链接来查看自己的个人主页。公共主页看起来类似，但它是为商家、乐队、产品、组织和公众人物设计的，作为他们在\
  \ Facebook 上存在的一种方式。\n\n这意味着许多人同时拥有个人主页和公共主页。例如，Facebook 的首席执行官马克·扎克伯格在 http://www.facebook.com/zuck\
  \ 有一个个人主页，在 http://www.facebook.com/markzuckerberg 有一个公共主页（页面）。这样，他可以用个人主页与朋友和家人保持联系，同时用公共主页与粉丝和支持者建立连接。\n\
  \n还有第二种页面类型：社区主页。同样，这些页面看起来与个人主页非常相似；区别在于它们基于主题、经历和事业，而不是实体。此外，它们会自动从维基百科检索相关主题的信息，并包含一个实时更新的关于该主题的帖子动态。\n\
  \n这一切可能让人有点困惑——别担心！一旦你开始使用，一切都会变得有意义。\n\n### 动手实践 —— 加载一个页面\n\n浏览到 http://www.facebook.com/PacktPub\
  \ 加载 Packt Publishing 的 Facebook 页面。你会看到最近的帖子列表、一个信息标签、一些相册（大多包含书籍封面）、一张主页头像照片，以及粉丝和链接的列表。\n\
