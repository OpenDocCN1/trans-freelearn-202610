  \n网站：http://www.PacktPub.com\n\n公司概述：Packt 是一家现代 IT 图书出版商，专注于为开发人员、管理员和新手社区出版前沿书籍。\n\
  \nPackt 于 2004 年 4 月出版了第一本书《Mastering phpMyAdmin for MySQL Management》。\n\nFacebook\
  \ 页面：http://www.facebook.com/PacktPub\n\n这就是网站用户查看信息的方式。我们的代码会如何“看待”它？让我们看一下 Graph\
  \ API 如何表示 Packt Publishing 的页面：在浏览器中访问 https://graph.facebook.com/PacktPub。这称为\
  \ Graph URL——请注意，它与页面本身的 URL 相同，但使用的是安全的 https 连接，并使用 graph 子域，而不是 www。\n\n你将看到如下内容：\n\
  \n```\n{\n  \"id\": \"204603129458\",\n  \"name\": \"Packt Publishing\",\n  \"picture\"\
  : \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs302.ash1/23274_204603129458_7460_s.jpg\"\
  ,\n  \"link\": \"http://www.facebook.com/PacktPub\",\n  \"category\": \"Products_other\"\
