  \n}\n```\n\n当我们在同一连接中搜索“birthday”一词时，我们会看到以下输出：\n\n```\nhttps://graph.facebook.com/BillSmith/feed\
  \ access_token=«access_token»&q=birthday\n{\n    \"data\": [\n        {\n      \
  \      \"id\": \"«redacted»\",\n            \"from\": {\n                \"name\"\
  : \"Bill Smith\",\n                \"id\": \"«redacted»\",\n            },\n   \
