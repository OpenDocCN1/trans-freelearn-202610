  \ URL 编码。以下是解码后的上一个 URL 的样子：\n\n```\nhttps://graph.facebook.com/307932939458/photos?limit=25&since=2010-03-18T16:00:38+0000\n\
  ```\n\n它显然是一个带时间戳的日期，传递给 `since` 参数，就像我们使用的一样。\n\nFacebook 提供这些作为比本章前面探索的基于 offset/limit\
  \ 的分页更容易的替代方案。基于时间的分页比基于列表中项目位置的分页更有意义（正如我们之前探索的那样），因为项目创建的日期和时间永远不会改变，而项目在列表中的位置会在向该列表添加新项目时发生变化。\n\
  \n确实，项目被删除可能会导致问题：如果我们已经下载了该项目，则可能无法检测到它已消失，导致我们的数据不正确。即使我们进行二次检查并将其删除，它也会留下空白，导致曾经包含它的页面比其他页面更短。这些是否是严重问题取决于应用程序。\n\
  \n\n\n\n\n由于这些分页链接与 JSON 一起打包，因此与基于 `limit` 和 `offset` 参数自行设计系统相比，它们通常更容易实现。在我们的例子中这并不完全正确，因为我们必须从\
  \ `next` 和 `previous` URL 中提取 `since` 和 `until` 参数，然后将它们传递给 `GraphRequest` 对象——提取集合中最早和最晚的\
  \ Graph 对象日期并使用它们会更容易。\n\n尽管如此，这在你未来从事的其他项目中可能会派上用场，因此值得一提。\n\n## 一次请求多个 ID\n\n\
  本章前面我们学习了如何检索特定日期范围内的一系列墙贴。如何获取撰写这些帖子的人的基本信息？\n\n根据迄今为止所见，显而易见的答案是遍历所有人的所有 ID，并为每个\
  \ ID 请求 User 对象。\n\n这样做是可以的，但有点笨拙，而且我们无法将这些人相互关联。难道不希望我们能一次性在一个列表中全部获取吗？\n\n###\
  \ 动手时间 – 在 Graph URL 中使用 ids 参数\n\n在浏览器中加载以下 URL：\n\n```\nhttps://graph.facebook.com/?ids=facebook,packtpub\n\
  {\n  \"facebook\": {\n    \"id\": \"20531316728\",\n    \"name\": \"Facebook\",\n\
  \    \"picture\": \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs624.ash1/27535_20531316728_5553_s.jpg\"\
  ,\n    \"link\": \"http://www.facebook.com/facebook\",\n    \"category\": \"Technology\"\
  ,\n    \"username\": \"facebook\",\n    \"founded\": \"February 4, 2004\",\n   \
  \ \"company_overview\": \"«overview»\",\n    \"mission\": \"Facebook's mission is\
  \ to give people the power to share and make the world more open and connected.\"\
  ,\n    \"fan_count\": 12672143\n  },\n  \"packtpub\": {\n    \"id\": \"204603129458\"\
  ,\n    \"name\": \"Packt Publishing\",\n    \"picture\": \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs302.ash1/23274_204603129458_7460_s.jpg\"\
  ,\n    \"link\": \"http://www.facebook.com/PacktPub\",\n    \"category\": \"Products_other\"\
  ,\n    \"username\": \"PacktPub\",\n    \"company_overview\": \"«overview»\",\n\
  \    \"fan_count\": 437\n  }\n}\n```\n\n### 发生了什么？\n\n我们一次性将两个 Page 的 ID 传递给 Graph，使用\
  \ ids 参数，它返回了一个包含两者基本信息的 JSON。\n\n所以这是一个列表，对吧？\n\n错了！\n\n好吧，根据我们迄今为止使用的定义，它不是一个列表，因为没有\
  \ data 节点。我称之为复合对象。将其与直接请求 Facebook Page 时得到的结果进行比较：\n\n```\nhttps://graph.facebook.com/facebook\n\
  {\n  \"id\": \"20531316728\",\n  \"name\": \"Facebook\",\n  \"picture\": \"http://profile.ak.fbcdn.net/hprofile-ak-snc4/hs624.ash1/27535_20531316728_5553_s.jpg\"\
  ,\n  \"link\": \"http://www.facebook.com/facebook\",\n  \"category\": \"Technology\"\
  ,\n  \"username\": \"facebook\",\n  \"founded\": \"February 4, 2004\",\n  \"company_overview\"\
  : \"«overview»\",\n  \"mission\": \"Facebook's mission is to give people the power\
  \ to share and make the world more open and connected.\",\n  \"fan_count\": 12672338\n\
  }\n```\n\n你可以看到，当一次性请求多个 Graph 对象时，这些对象会被挤压成单个对象的子节点，每个节点都以其 ID 标记。\n\n自然地，你不必使用\
  \ Page ID；你可以使用 Graph 中任何对象的 ID，包括相册、照片和用户。更重要的是，你可以混合请求 ID 的类型，因此你可以同时请求一个事件、三个用户和十几张照片，它们会以相同的\
  \ JSON 返回。\n\n### 试试英雄 – 基于列表结果创建复合对象\n\n重温我们之前看到的内容——查找在你上次生日时在你墙上发帖的人——但这次，请求并渲染一个包含所有这些\
  \ User 对象的复合对象。\n\n这是一个很大的挑战：最好的做法不是在 Visualizer 本身内部完成，而是在一个全新的项目内部完成。你能从头创建一个可以做到这一点的项目吗？自然地，你可以重用\
  \ Visualizer 中的任何有用类，比如 Requestors 和 ExtendedPermissions 类。\n\n## 总结\n\n分页意味着将长数据集合拆分为多个较小的组件，称为页面。不要将这种类型的页面与\
  \ Facebook 页面对象或网页混淆。\n\n- 页面中的记录数可以使用名为 `limit` 的参数设置。`limit` 的默认值是 25。\n- `offset`\
  \ 参数可用于指定应返回的集合中的第一个对象。`offset` 的默认值是 0。\n- 页面可以通过组合 `offset` 和 `limit` 参数来定义——尽管在撰写本文时\
  \ Graph API 在这一点上有点不稳定。\n- `since` 和 `until` 参数将 Graph 列表过滤到指定的日期和时间范围。\n- 日期和时间可以用多种格式书写；请参阅\
  \ http://www.php.net/manual/en/datetime.formats.php 获取完整列表。\n- 四个参数——`limit`、`offset`、`since`\
  \ 和 `until`——可以同时一起使用。\n- 要通过 Graph URL 指定这些参数，只需将它们作为 URL 参数传递，或使用 AS3 `URLVariables`\
  \ 类的实例。\n- 要通过 SDK 指定这些参数，将它们作为对象的属性包含在内，作为传递给 `Facebook.api()` 函数的第三个参数。\n- 作为\
  \ JSON 对象返回的 Graph 列表有一个名为 `paging` 的属性，其中包含下一页和上一页数据的 URL。这些 URL 使用 `since-until`\
  \ 分页，而不是 `limit-offset`。\n- 可以使用以下格式的 Graph URL 获得 **复合对象**：`https://graph.facebook.com/?ids=id1,id2,id3,...`。它包含多个对象，其\
  \ JSON 格式与 Graph 列表类似，但没有 `data` 节点。\n\n我们已经学习了如何深入挖掘 Graph，揭示我们已知其 ID 的 Graph 对象和连接的更多信息，但如果要根据其内容而不是其\
  \ ID 来查找 Graph 对象呢？在下一章中，我们将学习如何搜索 Graph 来做到这一点。\n\n## 快速测验\n\n1. 为什么 Facebook 默认将\
  \ Graph 列表拆分为页面，而不是在每次请求时一次性提供所有数据？\n   a. Facebook 仅在数据银行中保留最近一周的信息\n   b. 这是在访问速度和提供的信息量之间的一种折中\n\
  \   c. 隐私问题\n2. 参数 `limit`、`offset`、`since` 和 `until` 有什么作用？\n   a. 允许你缩小从集合返回的结果范围\n\
  \   b. 在特定时间段内限制用户对 Graph 对象的访问\n3. 在分页时，为什么使用 Graph 列表 JSON 对象中的“next”和“previous”URL\
  \ 比使用 `limit` 和 `offset` 构建自己的 URL 更好？\n   a. 基于日期的分页可以更精细地控制要请求的帖子\n   b. 基于日期的分页意味着\
  \ Graph 对象不会在页面之间遗漏\n   c. 基于日期的分页意味着如果在分页期间创建或删除 Graph 对象，也不会遗漏\n\n## 动手时间 – 检查快速搜索结果\n\
  \n在浏览器中登录 Facebook，在页面顶部的搜索栏中输入“test”，看看下拉列表中出现了什么：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_162_0.png)\n\
  \n现在试试一个名字：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_163_0.png)\n\n### 发生了什么？\n\
  \nFacebook 对名字使用智能搜索；注意当我输入“bob”时，它找到了包含“Bob”、“Rob”和“Robert”的结果。同样，如果你搜索“Jim”，它会找到“James”。\n\
  \n（这可能会让人困惑；我花了很长时间挠头试图弄明白为什么搜索“Liz”会列出我的朋友 Beth——她的名字并不是 Elizabeth 的简称！）\n\n这不是通配符搜索。搜索“obert”不会找到名为“Robert”的人。\n\
  \n从我的结果可以看出，搜索结果包括群组、应用程序和游戏，与其他用户混合在一起。如果我选择了不同的搜索词，搜索也可能找到事件和页面。\n\n\n\n\n"
- "# Search Me\n\n除了智能名称识别搜索外，Facebook 还使用智能排序来排列列表，排名结果以便首先向你展示你最有可能查找的内容：你点赞的页面和群组排名更高，你在宾客名单上的活动排名也更高，以及你添加的应用程序和游戏排名也更高。Facebook\
  \ 还会检查一些事情来判断你可能在寻找哪些人：\n\n- ◆ 你是否已经是该人的朋友？\n- ◆ 你们是否有很多共同朋友？\n- ◆ 你们是否生活在同一地区？\n\
  - ◆ 你们是否在同一网络中（大学、学校、工作场所）？\n\n这样，大多数情况下，你会在短的下拉结果列表中找到你正在寻找的人或对象。但如果没有，你就需要去进行完整搜索。\n\
  \n## Time for action – Using the Full Search results\n\n在搜索框中输入查询，然后点击放大镜图标或下拉列表底部的“查看更多结果”项目即可进入完整搜索页面：\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_164_0.png)\n\n下一张截图中显示了完整页面：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_165_0.png)\n\
  \n（另外，请注意，这些列表允许你翻页查看结果。）\n\n第四，左侧的选项包括一些在下拉列表中不会出现的对象类型：\n\n- ♦ Web results (powered\
  \ by Bing) – 本质上是 Facebook 网站内部的搜索引擎前端\n- ♦ Posts by friends – 墙帖、笔记、链接、视频、照片和状态\n\
  - ♦ Posts by everyone – 仅墙帖、笔记、链接和状态\n\n最后，你可以更改这些搜索的许多子选项：按地区或位置缩小帖子范围；按学校或工作场所筛选人员；查找今天、明天、本周或本月发生的活动，等等。\n\
  \n## What just happened?\n\n这一切都相当直接。这里唯一令人困惑的一点是：为什么完整搜索的顶部结果与快速搜索的不匹配？\n\n（我搜索了“Liz”，快速搜索将我的朋友\
  \ Beth 列在首位，我的朋友 Elizabeth 列在第二位；当我进行完整搜索时，在“全部结果”标签中两者都没有出现，只有 Beth 出现在“人物”结果中——Elizabeth\
  \ 完全不见了！）\n\n当然，不同页面使用不同的搜索算法并不令人意外，但它们差异如此之大就说不通了。由于我们目前只是在查看网站本身，这并不重要——不过，当我们通过\
  \ Graph API 进行搜索时，我们会遇到类似的问题，而这正是我们接下来要做的。\n\n## Searching with a Graph URL\n\n\
  你知道它要来了。\n\n我们将首先搜索公众可见的 Graph 对象。\n\n## Time for action – searching without authorization\n\
  \n基本的搜索查询 Graph URL 为：\n\n```\nhttps://graph.facebook.com/search?type=«type»&q=«query»\n\
  ```\n\ntype 参数让你可以选择一个选项（与完整搜索左侧相同），而 q（查询）指定搜索词。\n\n## 教材简析\n\n《祖父的园子》是统编版语文五年级下册第一单元的一篇课文，节选自萧红的自传体小说《呼兰河传》。课文以第一人称叙述，描写了作者童年时代在祖父园子里的快乐生活，展现了祖父的慈爱与宽容，表达了作者对童年生活的怀念和对自由的向往。\n\
  \n## 学情分析\n\n五年级学生已具备一定的阅读理解能力，能够初步把握文章主要内容，体会文章表达的思想感情。但对作者借助具体事物表达情感、运用拟人、排比等修辞手法表情达意的方法还缺乏深入的体会，需要教师引导品读感悟。\n\
  \n## 教学目标\n\n- 1. 认识“蚱、啃”等生字，会写“蝴、蝶”等生字，正确读写“蝴蝶、蜻蜓、蚂蚱”等词语。\n- 2. 正确、流利、有感情地朗读课文，了解课文内容。\n\
  - 3. 抓住重点语句，体会作者在园子里的快乐与自由，感受祖父的慈爱。\n- 4. 学习作者留心观察、借助具体事物表达情感的写作方法。\n\n## 教学重难点\n\
  \n重点：抓住重点语句，体会作者在园子里的快乐与自由，感受祖父的慈爱。\n难点：学习作者留心观察、借助具体事物表达情感的写作方法。\n\n## Differences\n\
  \n然而，即使经过身份验证，通过 Graph URL 搜索获得的结果也不总是与完整搜索中看到的结果匹配。当查找人员时尤其如此；默认情况下，所有应用都可以访问经过身份验证用户的朋友姓名和\
  \ ID，但其他信息可能被隐藏。\n\n例如，通过在用户搜索中输入电子邮件地址作为查询，我们可以找到拥有该确切电子邮件地址的任何人——除非他们在隐私设置中注明不希望该信息对其他应用可用。（另请参阅“帐户\
  \ | 隐私设置 | 应用和网站 | 通过你的朋友可访问的信息”中的选项，如第三章所述。）\n\n有时这会完全排除特定结果；有时会使相同的结果出现，但顺序不同。记住这一点进行测试：如果通过你的应用搜索获得的结果与通过网站搜索获得的结果不同，这并不一定意味着你的应用存在错误。\n\
  \n## Restrictions\n\n与完整搜索相比，通过 Graph URL 搜索时可用的子选项非常有限。我们无法按位置或学校筛选用户，按类型筛选群组，或按日期筛选活动（即使使用\
  \ since/until 分页）。\n\n我们也不能将帖子限制为特定语言，这使得它们比可能的情况要没用得多（正如我们在搜索“Packt”，一个常见的德语词时所看到的）。但我们可以做类似的事情。\n\
  \n有一个名为 locale 的参数，它接受诸如“en_US”（美国英语）和“fr_FR”（法语）之类的语言。这可以用两种方式使用。\n\n首先，我们可以用它来转换接收到的信息。例如，这里是\
  \ Facebook CTO Bret Taylor 的用户对象：\n\n```\nhttps://graph.facebook.com/btaylor\n{\n\
  \  \"id\": \"220439\",\n  \"name\": \"Bret Taylor\",\n  \"first_name\": \"Bret\"\
  ,\n  \"last_name\": \"Taylor\",\n  \"link\": \"http://www.facebook.com/btaylor\"\
  ,\n  \"gender\": \"male\",\n  \"locale\": \"en_US\"\n}\n```\n\n在下一个代码片段中，我们将用户对象的\
  \ locale 设置为法语：\n\n```\nhttps://graph.facebook.com/btaylor?locale=fr_FR\n{\n  \"\
  id\": \"220439\",\n  \"name\": \"Bret Taylor\",\n  \"first_name\": \"Bret\",\n \
  \ \"last_name\": \"Taylor\",\n  \"link\": \"http://www.facebook.com/btaylor\",\n\
  \  \"gender\": \"homme\",\n  \"locale\": \"en_US\"\n}\n```\n\n几乎没有什么变化——除了 gender\
  \ 的值，从 male 变成了 homme。这在你需要以不同语言提供基本信息，而无需聘请翻译时很有用。\n\n其次，请注意 Bret 的 locale 设置为\
  \ en_US。所有用户都有一个 locale；它可以在“帐户 | 语言”中设置，并定义你查看 Facebook 网站的语言。我们可以使用以下 Graph URL\
  \ 将帖子搜索结果过滤为仅显示具有特定 locale 的用户的帖子：\n\n```\nhttps://graph.facebook.com/search?type=post&q=test&locale=fr_FR\n\
  ```\n\n这与按指定语言搜索帖子并不完全相同——因此我们无法消除所有使用“Packt”作为德语句子一部分的结果——但很接近。而这正是我们可以在完整搜索中的帖子搜索中设置的子选项。\n\
  \n完整的本地化列表可在 http://www.facebook.com/translations/FacebookLocales.xml 获取。\n\n示例如下：\n\
  \n```\n<?xml version='1.0'?>\n<locales>\n  <locale>\n    <englishName>Catalan</englishName>\n\
  \    <codes>\n      <code>\n        <standard>\n          <name>FB</name>\n    \
  \      <representation>ca_ES</representation>\n        </standard>\n      </code>\n\
  \    </codes>\n  </locale>\n</locales>\n```\n\n其中有一些奇怪的选择，比如英语（倒着写），所以请自行查看。\n\n\
  ## Time for action – implementing a Search window in the Visualizer\n\n好吧，现在我们知道了\
  \ Graph URL 搜索可以做什么，让我们在应用中使用它。\n\nVisualizer 项目包含一个用于搜索 Graph 的窗口，其中包含 UI 元素。它是隐藏的，但我们可以以与在列表渲染器上启用过滤面板相同的方式启用它。\n\
  \n加载 Visualizer 项目并打开 CustomGraphContainerController.as。在构造函数函数中，将 _canShowSearchUI\
  \ 属性（继承自 CustomGraphContainerController 扩展的类）设置为 true：\n\n```\npublic function CustomGraphContainerController\n\
  (a_graphControlContainer:GraphControlContainer)\n{\n    super(a_graphControlContainer);\n\
  \    this._showListCounts = true;\n    this._showListFilters = true;\n    this._canShowSearchUI\
  \ = true;\n    _requestor = new HTTPRequestor();\n    addEventListenersToRequestor();\n\
  \    //we must wait for the Requestor to initialise before we can do\n    //anything\
  \ else with it\n    _requestor.addEventListener(Event.COMPLETE, onRequestorInitialize);\n\
  \    _requestor.initialize();\n}\n```\n\n编译项目，将 SWF 上传到你的网络主机，并使用常规 URL 在浏览器中加载它。结果显示在下一张截图中：\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_177_0.png)\n\n\n\n\n可以看到，左上角新增了一个**搜索**按钮，点击后主舞台区域会显示新的**搜索**窗口。你会注意到前六个单选按钮对应`type`参数的允许值；暂时不用关心**我的动态**或**好友的帖子**。\n\
  \n当点击窗口内的**搜索**按钮时，它会调用`CustomGraphContainerController.as`所继承的类中的`search()`函数，并向其传递三个值：\n\
  \n- 查询\n- 类型\n- 用户ID（其中包含下方文本框中的值——同样，我们稍后会再讨论）\n\n这个函数完全是空的，所以目前点击该按钮不会执行任何操作；我们需要重写`search()`并让它正常工作！\n\
  \n1. 在`CustomGraphContainerController.as`中，添加以下函数：\n\n```\noverride public function\
  \ search(a_query:String = \"\", a_type:String = \"\", a_userID:String = \"\"):void\n\
  {\n\n}\n```\n\n2. 现在添加实际的搜索代码。我们从HTTP Requestor开始。这个过程与直接请求Graph Object或Graph List非常相似——事实上，它甚至更简单。打开`HTTPRequestor.as`并创建一个新函数，如下所示：\n\
  \n```\npublic function search(a_query:String = \"\", a_type:String = \"\"):void\n\
  {\n    var loader:URLLoader = new URLLoader();\n    var urlRequest:URLRequest =\
  \ new URLRequest();\n    var variables:URLVariables = new URLVariables();\n\n  \
  \  urlRequest.url = \"https://graph.facebook.com/search\";\n\n    variables.metadata\
  \ = 1;\n    if (accessToken != \"\")\n    {\n        variables.access_token = accessToken;\n\
  \    }\n    variables.q = a_query;    //not variables.query!\n    variables.type\
  \ = a_type;\n```\n\n### 刚才发生了什么？\n\n我们的Visualizer现在可以根据你输入的查询条件搜索Graph对象。由于结果以Graph\
  \ List的形式返回，我们的应用程序将获取这些对象的所有信息——这也意味着我们也能看到它们之间的连接。\n\n### 动手实践——通过SDK进行搜索\n\n\
  通过SDK实现搜索也很容易。先打开SDKRequestor.as，并添加一个名为search()的新函数，就像我们对HTTPRequestor所做的那样：\n\n\
  ```\npublic function search(a_query:String = \"\", a_type:String = \"\"):void\n\
  {\n}\n```\n\n与请求时一样，我们向Facebook.api()方法传递三个参数：\n\n1. /search（一个包含Graph URL关键部分的字符串）\n\
  2. 回调函数的引用\n3. 一个包含参数（q和type——记住不要使用query作为参数名！）的对象\n\n因此，将以下代码中的调用添加到你的search()函数中：\n\
  \n```\npublic function search(a_query:String = \"\", a_type:String = \"\"):void\n\
  {\n    Facebook.api(\n        \"/search\",\n        searchComplete,\n        { metadata:\
  \ 1, q:a_query, type:a_type }\n    );\n}\n```\n\n这次不需要使用柯里化（currying），因为我们无需保持对原始GraphRequest对象的引用。\n\
  \nsearch()函数就到此为止。不过，我们还需要编写数据加载完成后的回调函数，因此创建一个新的函数searchComplete()，如下列代码所示：\n\n\
  ```\nprivate function searchComplete(success:Object, fail:Object):void\n{\n}\n```\n\
  \n与其他SDK回调一样，此函数必须接受两个参数：result和fail。\n\n由于搜索结果以Graph List的形式返回，我们可以复用requestComplete()函数中的大部分代码。如下列代码所示修改searchComplete()：\n\
  \n```\nprivate function searchComplete(result:Object, fail:Object):void\n{\n   \
  \ if (result != null)\n    {\n        var decodedJSON:Object = result;\n       \
  \ var graphList:GraphList = new GraphList();\n        var childGraphObject:GraphObject;\n\
  \        for each (var childObject:Object in decodedJSON)\n        {\n         \
  \   childGraphObject = new GraphObject();\n            for (var childKey:String\
  \ in childObject)\n            {\n                childGraphObject[childKey] = childObject[childKey];\n\
  \            }\n            graphList.addToList(childGraphObject);\n        }\n\
  \        graphList.paging = decodedJSON.paging;\n\n        dispatchEvent(new RequestEvent(RequestEvent.REQUEST_COMPLETED,\
  \ graphList));\n    }\n    else\n    {\n        //was a failure. See contents of\
  \ 'fail' object.\n    }\n}\n```\n\n与HTTP Requestor一样，如果你想回顾这一切是如何工作的，请查看第2章和第3章。\n\
  \n现在两个Requestor都有了search()方法；我们可以将该方法添加到IRequestor接口中。如下修改IRequestor：\n\n```\npackage\
  \ graph.apis.base\n{\n    import flash.events.IEventDispatcher;\n    import graph.GraphRequest;\n\
  \n    public interface IRequestor extends IEventDispatcher\n    {\n        function\
  \ request(a_request:GraphRequest):void;\n        function attemptToAuthenticate(...permissions):void;\n\
  \        function initialize():void;\n        function search(a_query:String = \"\
  \", a_type:String = \"\"):void;\n    }\n}\n```\n\n这意味着我们不再需要在CustomGraphContainerController.search()中将_requestor强制转换为HTTPRequestor，因此打开CustomGraphContainerController.as并修改该方法：\n\
  \n```\noverride public function search(a_query:String = \"\", a_type:String = \"\
  \", a_userID:String = \"\"):void\n{\n    _requestor.search(a_query, a_type);\n}\n\
  ```\n\n在测试之前，剩下要做的就是修改构造函数，使_requestor创建为SDKRequestor而不是HTTPRequestor。具体操作如下：\n\n\
  ```\npublic function CustomGraphContainerController(a_graphControlContainer:GraphControlContainer)\n\
  {\n    super(a_graphControlContainer);\n    this._showListCounts = true;\n    this._showListFilters\
  \ = true;\n    this._canShowSearchUI = true;\n\n    _requestor = new SDKRequestor();\n\
  \    addEventListenersToRequestor();\n    //we must wait for the Requestor to initialise\
  \ before we can do anything else with it\n    _requestor.addEventListener(Event.COMPLETE,\
  \ onRequestorInitialize);\n\n    _requestor.initialize();\n}\n```\n\n### 搜索一下\n\n\
  保存、编译并上传SWF文件。在浏览器中加载它——记得使用sdkindex.html。\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_184_0.png)\n\
  \n太好了，成功了！\n\n### 刚才发生了什么？\n\n我们刚刚添加了与之前相同的搜索功能，但这次是通过SDK实现的。请记住，这意味着如果用户已通过身份验证，访问令牌会被自动使用。\n\
  \n### 挑战自我——设置语言区域\n\n现在我们可以搜索帖子了，那么将搜索结果限制为具有指定语言区域的用户发布的帖子怎么样？\n\n你可以在search()方法中硬编码要使用的区域设置，或者（如果你对操作XML很熟悉）可以让你的项目从\
  \ http://www.facebook.com/translations/FacebookLocales.xml 中随机选择一个区域设置。\n\n## 搜索动态和主页帖子\n\
  \n与Facebook的完整搜索相比，Graph URL搜索可能有所限制，但有两种类型的搜索只能通过Graph API完成：\n\n- 在你的动态中搜索特定项目\n\
  - 搜索特定好友发布的内容\n\n### 动手实践——搜索你的动态\n\n你的动态是你登录Facebook网站时看到的列表；包含你的好友（以及你订阅的其他Graph网站，例如你“赞”过的页面）发布的全部状态更新、链接、视频和照片。\n\
  \n我们已经知道，可以通过个人资料的home连接访问该动态：\n\n```\nhttps://graph.facebook.com/me/home?access_token=«access_token»\n\
  ```\n\n正如你所料，它会返回一个Graph List。\n\n我们可以通过为q参数指定值来在此动态中搜索：\n\n```\nhttps://graph.facebook.com/me/home?q=test&access_token=«access_token»\n\
