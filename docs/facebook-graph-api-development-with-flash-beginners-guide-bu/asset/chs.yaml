  }\n```\n\n同样，对 SDKRequestor.as 中的 search() 方法做以下更改：\n\n```\npublic function search(a_query:String\
  \ = \"\", a_type:String = \"\"):void\n{\n    var urlStub:String;\n    if (a_type\
  \ == \"home\")\n    {\n        urlStub = \"/me/home\";\n    }\n    else\n    {\n\
  \        urlStub = \"/search\";\n```\n\n```\n}\nFacebook.api(\n    urlStub,\n  \
  \  searchComplete,\n    { metadata: 1, q:a_query, type:a_type }\n);\n}\n```\n\n\
  我们不需要更改其他任何内容，因为这些搜索仍然会返回一个 Graph 列表。\n试试看：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_191_0.png)\n\
  \n成功。添加朋友的帖子搜索会稍微棘手一些，但也没多少。首先我们必须允许 Requestors 的 search() 函数接受另一个参数：User ID。\n\n\
  打开 IRequester.as 并向函数签名添加此参数：\n\n```\npackage graph.apis.base\n{\n    import flash.events.IEventDispatcher;\n\
  \    import graph.GraphRequest;\n\n    public interface IRequestor extends IEventDispatcher\n\
  \    {\n        function request(a_request:GraphRequest):void;\n        function\
  \ attemptToAuthenticate(...permissions):void;\n```\n\n## 搜索我\n\n仅此而已。按下一张截图所示进行测试：\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_194_0.png)\n\n很酷。\n\n## 发生了什么？\n\n你已在应用程序中构建了两种额外的搜索功能：\n\
  \n- ♦ 搜索你的新闻 feed 中的帖子\n- ♦ 搜索特定朋友的帖子\n\n由于你的新闻 feed 由朋友（以及你订阅的其他 Graph 对象）的帖子组成，第一种帖子本质上与完整搜索中存在的“朋友的帖子”选项相同，但该选项在搜索\
  \ URL 中缺失。\n\n通过 Facebook 网站无法完成按特定朋友发布的帖子进行搜索。恭喜！你的应用程序现在比 Facebook 具有更多功能。\n\n\
  - 没有 access token，某些类型的搜索（如 `user`）无法执行\n- 使用 access token 时，搜索结果会根据授权用户进行定制：例如，如果人们住在附近，则在搜索中排名更高\n\
  - 某些搜索类型需要在返回任何结果之前授予一定的扩展权限——有关更多详细信息，请参阅 `http://developers.facebook.com/docs/authentication/permissions`\n\
  - 你可以使用 locale URL 参数设置 JSON 对象返回的某些属性的语言环境：`https://graph.facebook.com/<id>?locale=fr_FR`\n\
  - 你还可以将帖子搜索结果过滤为仅显示使用特定语言环境的人发布的帖子：`https://graph.facebook.com/search?type=post&q=<query>&locale=fr_FR`\n\
  - 完整的语言环境列表可在 `http://facebook.com/translations/FacebookLocales.xml` 获取\n- 你可以使用此\
  \ Graph URL 过滤你的新闻 feed 条目：`https://graph.facebook.com/me/home?access_token=<access_token>&q=<query>`\n\
  - 你可以使用此 Graph URL 过滤给定朋友发布的所有内容：`https://graph.facebook.com/<username>/feed?access_token=<access_token>&q=<query>`\n\
  \n## 测验\n\n- 1. 如果你从 Graph URL 搜索获得的结果与网站搜索的结果不匹配，可能出了什么问题？\n  a. 向 Graph URL 传递了不正确的参数\n\
  \  b. 使用了不正确的 Graph URL\n  c. 用户的隐私设置不允许应用程序访问其数据\n  d. 以上任何一种都有可能\n- 2. `https://graph.facebook.com/<username>/feed?q=<query>`\
  \ 的结果和 `https://graph.facebook.com/<username>/feed` 的结果有什么奇怪之处？\n  a. 即使用户的隐私设置调到最高也能获得它们\n\
  \  b. 第一个不像所有其他 Graph Search URL 那样对第二个起过滤作用\n  c. 两个 URL 总是返回完全相同的 JSON\n\n\n\n\
  \n\n## 添加到图谱\n\n> 我们花费了大量时间观察图谱，既作为匿名外部人员，也作为已认证用户。我们了解不同类型的节点以及它们之间的连接。现在是时候创建一些属于我们自己的了。\n\
  \n在本章中，你将学习：\n\n- 如何使用 Graph API 创建新的 Graph 对象\n- 如何从 Graph 中删除现有对象\n- Graph API\
  \ 在添加内容方面的限制，与 Facebook 网站相比如何\n\n让我们开始吧...\n\n## 你好，Facebook！\n\n我通常不是“Hello World”应用的粉丝，但在这里它如此相关，我会破例。我们将从向已登录用户的墙上发布一条消息开始。\n\
  \n### 行动时间 – 发布到用户的动态\n\n我们先从简单开始。只需让用户输入一行文字，并将其发布到他们的墙上。\n\n当用户输入消息并点击发布时，我们希望消息被发布到他们的墙上。目前，代码设置好将包含消息的\
  \ AS3 对象传递给 CustomGraphContainerController 扩展的类中的 publish() 方法。就像之前的章节一样，我们将重写此方法并编写新代码来处理\
  \ Facebook 集成。\n\n在 CustomGraphContainerController.as 中，添加此函数：\n\n```\noverride\
  \ public function publish(a_publishObject:PublishObject):void\n{\n    super.publish(a_publishObject);\n\
  }\n```\n\nPublishObject 类包含一个名为 message 的属性，用于保存用户在“发布到墙”窗口中输入的消息。我们需要导入此类：\n\n\
  ```\nimport graph.apis.base.PublishObject;\n```\n\nUI 部分就绪。接下来，我们将此对象传递给 Requestor\
  \ 中的一个方法来处理在 Facebook 上发布帖子。在 IRequestor.as 中添加一个新函数 publish()：\n\n```\npackage\
  \ graph.apis.base\n{\n    import flash.events.IEventDispatcher;\n    import graph.GraphRequest;\n\
  \n    public interface IRequestor extends IEventDispatcher\n    {\n        function\
  \ request(a_request:GraphRequest):void;\n        function attemptToAuthenticate(...permissions):void;\n\
  \        function initialize():void;\n        function search(a_query:String = \"\
  \", a_type:String = \"\", a_userID:String = \"\"):void;\n        function publish(a_publishObject:PublishObject):void;\n\
  \    }\n}\n```\n\nPublishObject 实例包含我们所需的所有信息，因此它是传递给此方法的唯一参数。\n\n现在在 SDKRequestor.as\
  \ 和 HTTPRequestor.as 中都添加 stub publish() 函数：\n\n```\npublic function publish(a_publishObject:PublishObject):void\n\
  {\n}\n```\n\n你还需要在这两个类中导入 PublishObject：\n\n```\nimport graph.apis.base.PublishObject;\n\
  ```\n\n我们将像往常一样先编写 HTTPRequestor 的代码，因此更改 CustomGraphContainerController.as 中实例化\
  \ _requestor 对象的构造函数函数中的那一行，使其创建 HTTPRequestor：\n\n```\n_requestor = new HTTPRequestor();\n\
  ```\n\n最后，修改 CustomGraphContainerController.as，使其 publish() 方法调用 Requestor 的 publish()\
  \ 方法：\n\n```\noverride public function publish(a_publishObject:PublishObject):void\n\
  {\n    super.publish(a_publishObject);\n    _requestor.publish(a_publishObject);\n\
  }\n```\n\n一切就绪，但我们如何从 Visualizer 将消息发布到实际的 Facebook 墙上呢？\n\n## 请求方法\n\n向用户的墙上发布消息与从中筛选信息并没有更复杂——我们使用\
  \ Graph URL，https://graph.facebook.com/me/feed，并传递两个参数：\n\n- 访问令牌，以及\n- 要发布的消息\n\
  \n不同之处在于我们如何传递这些参数。我们不能再简单地加载 URL 了。自己试试：浏览 https://graph.facebook.com/me/feed?access_token=«access_token»&message=Hello。它会以\
  \ JSON 格式返回你的动态，但不会发布到其中。\n\n我们仍然使用 URLLoader 和 URLRequest，但使用不同的请求方法。\n\n### 什么是请求方法？\n\
  \nHTTP 请求方法是一种告诉 Web 服务器当我们请求页面或其他资源时，我们希望它执行何种操作的方式。\n\n默认情况下，AS3 URLRequest 使用一种名为\
  \ GET 的 HTTP 请求方法；这是一种“安全”方法，之所以称为安全，是因为它不要求服务器更改任何信息，只是将其传回——这正是到目前为止本书中我们所需的一切。\n\
  \n发布墙帖显然会引起更改，因此我们应该使用“不安全”方法——在本例中为 POST。这与提交会更改或添加数据的网页表单时使用的相同方法，例如在亚马逊订购书籍时。\n\
  \n> 出于安全原因，Flash Player 10 及以上版本只允许在用户发起加载时使用 POST 方法。这意味着你的应用程序不能自动向 Graph 发布（例如，基于用户登录时间的长短）；相反，你必须始终从例如按钮的\
  \ MOUSE_CLICK 事件处理函数中发布。\n\n### 行动时间 – 使用 POST 方法\n\n1. 要指定我们想要使用 POST 方法，我们更改 URLRequest\
  \ 的 method 属性（毕竟 POST 是一个请求方法）。另一个类 flash.net.URLRequestMethod 包含所有允许值的常量，因此在 HTTPRequestor.as\
  \ 中导入它：\n```\nimport flash.net.URLRequestMethod;\n```\n2. 我们以与 request() 和 search()\
  \ 方法相同的方式设置 URLLoader、URLRequest 和 URLVariables 实例：\n```\npublic function publish(a_publishObject:PublishObject):void\n\
  {\n    var loader:URLLoader = new URLLoader();\n    var urlRequest:URLRequest =\
  \ new URLRequest();\n    var variables:URLVariables = new URLVariables();\n}\n```\n\
  3. 因为我们想要发布到自己的墙上，所以我们使用个人资料的 feed 连接作为 URL——没有单独的发布到墙 URL：\n```\npublic function\
  \ publish(a_publishObject:PublishObject):void\n{\n    var loader:URLLoader = new\
  \ URLLoader();\n    var urlRequest:URLRequest = new URLRequest();\n    var variables:URLVariables\
  \ = new URLVariables();\n\n    urlRequest.url = \"https://graph.facebook.com/me/feed\"\
  ;\n}\n```\n4. 现在我们使用 URLRequestMethod 类中的 POST 常量来设置请求方法：\n```\npublic function\
  \ publish(a_publishObject:PublishObject):void\n{\n\n```\n\n```\nurlRequest.data\
  \ = variables;\n\nloader.addEventListener(Event.COMPLETE, onPublishComplete);\n\
  loader.addEventListener(IOErrorEvent.IO_ERROR, onIOError);\nloader.load(urlRequest);\n\
  }\n```\n\n7. 为 COMPLETE 事件创建事件处理函数：\n\n```\nprivate function onPublishComplete(a_event:Event):void\n\
  {\n    dispatchEvent(new DialogEvent(DialogEvent.DIALOG,\n        \"Publish complete!\"\
  ));\n}\n```\n\n记住，DialogEvent 可用于在 Visualizer 项目中显示对话框框，包含你想要的任何消息。不过，使用它时你需要导入\
  \ events.DialogEvent。\n\n编译、上传并执行 SWF，你会发现……它不起作用。\n\n### 刚才发生了什么？\n\n要找出为什么不起作用，我们可以为\
  \ URLLoader 添加一种新的事件监听器——HTTPStatusEvent 监听器。\n\n此类型的事件由服务器返回，并在 IO_ERROR 或 COMPLETE\
  \ 事件之前分发。其 status 属性包含响应的“HTTP 代码”，这是一种简化的简写来解释响应状态。例如，404 是一个 HTTP 状态代码，表示“未找到”。完整列表可在\
  \ http://en.wikipedia.org/wiki/List_of_HTTP_status_codes 查看，但通常你会看到：\n\n- 200：如果没有问题\n\
  - 400：如果发送的请求格式错误（最有可能是 URL 变量中的拼写错误）\n- 403：如果不允许你访问请求的资源\n- 404：如果服务器上找不到你请求的资源\n\
  - 500：如果出现其他问题（如权限不足）\n\n（你也可能看到 0，如果 Flash Player 由于其环境中的某些条件而无法检测 HTTP 响应代码。）\n\
  \n这可以提供有用的额外信息来帮助缩小 IO_ERROR 问题范围，或检测不会分发 IO_ERROR 事件的问题。\n\n\n\n\n\n4. 编译、上传并执行\
  \ Visualizer，然后再次尝试在自己的 Wall 上发布。\n\n   它仍然不会工作，但你会看到类似这样的对话框：\n\n   ![](img/4e826fa36038b86f2087ef8b818d0acf_209_0.png)\n\
  \n## What just happened?\n\n对话框显示 HTTP 状态：403。正如前面提到的，这意味着我们不被允许访问我们试图访问的资源——也就是说，我们不被允许发布到\
  \ Wall。换句话说，我们没有权限……或者更准确地说，我们尚未被授予所需的扩展权限。\n\n> 有可能你会看到 HTTP 状态码响应为 500。这是可以的——这是一个相当通用的错误信息，表示“出现问题”，在这种情况下也是如此。原因很可能仍然是缺少扩展权限。\n\
  >\n> 当然，如果你在书中更早的时候就已授予你的应用程序所需的权限，你就不会遇到任何问题了！\n\n## Time for action – granting\
  \ the required permission\n\n1. 在此之前能工作，我们必须授予应用程序 `publish_stream` 扩展权限，因此请在 `CustomGraphContainerController.as`\
  \ 中的 `onRequestorInitialize()` 函数内进行如下修改：\n\n   ```\n   private function onRequestorInitialize(a_event:Event):void\n\
  \   {\n       _requestor.attemptToAuthenticate(\n           ExtendedPermissions.READ_STREAM,\n\
  \           ExtendedPermissions.PUBLISH_STREAM);\n   }\n   ```\n\n2. 编译、上传并再次尝试。你在加载页面时会看到权限请求弹出：\n\
  \n   ![](img/4e826fa36038b86f2087ef8b818d0acf_210_0.png)\n\n3. 点击 Allow，然后打开你的 Feed\
  \ List Renderer，并点击 Publish。在框中输入一些文本：\n\n   ![](img/4e826fa36038b86f2087ef8b818d0acf_210_1.png)\n\
  \n   ...然后点击 Post。检查 Facebook 网站上的你的 Wall：\n\n   ![](img/4e826fa36038b86f2087ef8b818d0acf_210_2.png)\n\
  \n它工作了吗？\n\n在发布时，我们需要传递第四个变量：\n\n- 要使用的 HTTP 请求方法\n\n从我们对 HTTP Requestor 的工作来看，你已经知道这需要是\
  \ POST。因此，请修改 `SDKRequestor.as` 中的 `publish()` 方法，如下所示：\n\n```\npublic function\
  \ publish(a_publishObject:PublishObject):void\n{\n    var urlStub:String = \"/me/feed\"\
  ;\n    Facebook.api(urlStub, publishComplete,\n        { message:a_publishObject.message\
  \ },\n        URLRequestMethod.POST\n    );\n}\n```\n\n确保导入 `flash.net.URLRequestMethod`。\n\
  \n接下来，你需要创建 `publishComplete()` 函数作为回调使用：\n\n```\nprivate function publishComplete(result:Object,\
  \ fail:Object):void\n{\n\n}\n```\n\n使用 SDK 时我们不需要为 HTTP 状态或安全错误添加事件监听器；只需检查结果是否为\
  \ null；如果是，更多细节应位于 fail 对象中：\n\n```\nprivate function publishComplete(result:Object,\
  \ fail:Object):void\n{\n    if (result != null)\n    {\n        dispatchEvent(new\
  \ DialogEvent(DialogEvent.DIALOG,\n            \"Publish complete!\"));\n    }\n\
  \    else\n    {\n        dispatchEvent(new DialogEvent(DialogEvent.DIALOG,\n  \
  \          \"Publish failed. Details: \" + String(fail)));\n    }\n}\n```\n\n如果要使用它，请确保导入\
  \ `events.DialogEvent`。\n\n我们首先集中在 `message`、`picture`、`link`、`name`、`caption` 和\
  \ `description` 上，并通过发布使用它们的富帖子来了解它们的作用。\n\nVisualizer 可以配置为显示一个包含这六个参数所有输入字段的窗口，而不是仅\
  \ `message`。要做到这一点，请在 `CustomGraphContainerController.as` 中找到这一行：\n\n```\nthis._publishingCapability\
  \ = PublishingCapabilities.BASIC;\n```\n\n...并将其替换为：\n\n```\nthis._publishingCapability\
  \ = PublishingCapabilities.COMPLETE;\n```\n\n当你在 `feed` List Renderer 上点击 **Publish**\
  \ 按钮时，你会看到新的窗口：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_215_0.png)\n\n**Post**\
  \ 按钮仍然将 `PublishObject` 的实例传递给 `CustomGraphContainerController` 扩展的类中的同一个函数 `publish()`。与之前不同的是，`PublishObject`\
  \ 设置了更多属性。\n\n具体来说，它可以具有以下任何属性：\n\n- `message`\n- `pictureURL`: 对应于 `picture`\n\
  - `linkURL`: 对应于 `link`\n\n同样，编辑 `SDKRequestor.as` 中的 `publish()` 函数：\n\n```\npublic\
  \ function publish(a_publishObject:PublishObject):void\n{\n    var urlStub:String\
  \ = \"/me/feed\";\n    Facebook.api(urlStub, publishComplete,\n    {\n        message:a_publishObject.message,\n\
  \        picture:a_publishObject.pictureURL,\n        link:a_publishObject.linkURL,\n\
  \        name:a_publishObject.linkName,\n        caption:a_publishObject.caption,\n\
  \        description:a_publishObject.description\n    },\n    URLRequestMethod.POST\n\
  \    );\n}\n```\n\n在你的主机上测试 Visualizer。以下是来自 Wikipedia 和 Wikimedia Commons 的一些测试数据：\n\
  \n- message: Hello Britain!\n- picture: http://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Flag_of_the_United_Kingdom.svg/200px-Flag_of_the_United_Kingdom.svg.png\n\
  - link: http://en.wikipedia.org/wiki/Union_Flag\n- name: Union Flag\n- caption:\
  \ en.wikipedia.org\n- description: The Union Flag, also known as the Union Jack,\
  \ is the flag of the United Kingdom\n\n结果如下：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_217_0.png)\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_219_0.png)\n\n关于图像的说明：帖子中的那个小图像仍然托管在\
  \ Wikimedia Commons，但通过托管在 Facebook 服务器上的代理 PHP 访问——本例中为 http://platform.ak.fbcdn.net/。该服务器上的\
  \ crossdomain.xml 如下：\n\n```\n<cross-domain-policy>\n    <site-control permitted-cross-domain-policies=\"\
  master-only\"/>\n    <allow-access-from domain=\"*\"/>\n</cross-domain-policy>\n\
  ```\n\n这意味着无论原始图像托管在何处，你的应用程序都可以直接访问图像的 BitmapData，而不会出现任何沙箱安全问题。\n\n实际创建的 Graph\
  \ Object 看起来像这样：\n\n```\n{\n  \"id\": \"«redacted»\",\n  \"from\": {\n    \"name\"\
  : \"Michael James Williams\",\n    \"id\": \"«redacted»\"\n  },\n  \"message\":\
  \ \"Hello Britain!\",\n  \"picture\": \"http://platform.ak.fbcdn.net/www/app_full_proxy.php?app=«redacted»&v=1&size=z&cksum=«redacted»&src=http%3A%2F%2Fupload.wikimedia.org%2Fwikipedia%2Fcommons%2Fthumb%2Fa%2Fae%2FFlag_of_the_United_Kingdom.svg%2F200px-Flag_of_the_United_Kingdom.svg.png\"\
  ,\n  \"link\": \"http://en.wikipedia.org/wiki/Union_Flag\",\n  \"name\": \"Union\
  \ Flag\",\n  \"caption\": \"en.wikipedia.org\",\n  \"description\": \"The Union\
  \ Flag, also known as the Union Jack, is the flag of the United Kingdom.\",\n  \"\
  icon\": \"http://graph.facebook.com/images/icons/hidden.gif\",\n  \"actions\": [\n\
  \    {\n      \"name\": \"Comment\",\n      \"link\": \"http://www.facebook.com/«redacted»/posts/«redacted»\"\
  \n    },\n    {\n      \"name\": \"Like\",\n      \"link\": \"http://www.facebook.com/«redacted»/posts/«redacted»\"\
  \n    }\n  ],\n  \"privacy\": {\n    \"description\": \"Friends only\",\n```\n\n\
  现在再次查看 Wall 帖子：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_223_0.png)\n\n操作是帖子下方其他\
  \ Facebook 用户可以点击的链接。\n\n我们可以通过将 JSON 传递给 actions 参数来添加我们自己的用户定义操作，例如“Visit my website”或“Plant\
  \ some crops”。\n\n## Time for action – literally\n\n1. 打开 `HTTPRequestor.as` 并找到\
  \ `publish()` 函数。在函数内创建原生 AS3 对象如下：\n\n   ```\n   var actionObj:Object = [ {\n \
  \      name:\"Visit my Twitter Page\",\n       link:\"http://twitter.com/MichaelJW\"\
  \n   } ];\n   ```\n\n   方括号定义一个数组，因此我们也可以将其键入为 Array 而不是 Object，但这并不重要。\n\n2. 接下来，在同一个函数中，使用我们之前使用过的\
  \ JSON 库将此对象编码为 JSON 字符串：\n\n   ```\n   var actionString:String = JSON.encode(actionObj);\n\
  \   ```\n\n3. 现在，将此 String 作为 URLVariables 对象的属性添加，称为 `actions`：\n\n   ```\n   variables.message\
  \ = a_publishObject.message;\n   variables.picture = a_publishObject.pictureURL;\n\
  \   variables.link = a_publishObject.linkURL;\n   variables.name = a_publishObject.linkName;\n\
  \   variables.caption = a_publishObject.caption;\n   variables.description = a_publishObject.description;\n\
  \   variables.actions = actionString;\n   urlRequest.data = variables;\n   ```\n\
  \n\n\n\n\n4. 在 SDKRequestor.as 中做类似的修改：\n\n```\npublic function publish(a_publishObject:PublishObject):void\n\
  {\n    var urlStub:String = \"/\" + a_publishObject.ownerID + \"/feed\";\n    var\
  \ actionObj:Object = [ {\n        name:\"Visit my Twitter Page\",\n        link:\"\
  http://twitter.com/MichaelJW\"\n    } ];\n    var actionString:String = JSON.encode(actionObj);\n\
  \    Facebook.api(urlStub, publishComplete,\n    {\n        message:a_publishObject.message,\n\
  \        picture:a_publishObject.pictureURL,\n        link:a_publishObject.linkURL,\n\
  \        name:a_publishObject.linkName,\n        caption:a_publishObject.caption,\n\
  \        description:a_publishObject.description,\n        actions:actionString\n\
  \    },\n        URLRequestMethod.POST\n    );\n}\n```\n\n5. 你需要导入 com.adobe.serialization.json.JSON。测试一下：\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_224_0.png)\n\n## What just happened?\n\
  \n你已向来自你项目的帖子添加了一个应用特定的操作。每个帖子只能添加一个这样的操作，但当然，它不必对每个帖子都相同。\n\n该操作是一个功能性超链接；点击它会带你到我的\
  \ Twitter 页面。不过，Facebook 会在所有此类链接末尾添加一个 URL 参数 ref=nf，因此先测试一下——例如，尝试加载 http://google.com?ref=nf\
  \ 会得到 404 消息。\n\n3. 在 SDKRequestor.as 中添加类似的代码：\n\n```\npublic function publish(a_publishObject:PublishObject):void\n\
  {\n    var urlStub:String = \"/\" + a_publishObject.ownerID + \"/feed\";\n    var\
  \ actionObj:Object = [ {\n        name:\"Visit my Twitter Page\",\n        link:\"\
  http://twitter.com/MichaelJW\"\n    } ];\n    var actionString:String = JSON.encode(actionObj);\n\
  \n    var privacyObj:Object = {\n        value:\"EVERYONE\"\n    }\n    var privacyString:String\
  \ = JSON.encode(privacyObj);\n\n    Facebook.api(urlStub, publishComplete,\n   \
  \ {\n        message:a_publishObject.message,\n        picture:a_publishObject.pictureURL,\n\
  \        link:a_publishObject.linkURL,\n        name:a_publishObject.linkName,\n\
  \        caption:a_publishObject.caption,\n        description:a_publishObject.description,\n\
  \        actions:actionString,\n        privacy:privacyString\n    },\n        URLRequestMethod.POST\n\
  \    );\n}\n```\n\n4. 通过将 value 设置为 EVERYONE，我们将使帖子对任何可以看到你 Wall 的人可见，而不仅仅是你的朋友。\n\
  \n还有哪些其他选项？\n\n好吧，value 可以设置为：\n\n- EVERYONE\n- ALL_FRIENDS\n- NETWORKS_FRIENDS\n\
  - FRIENDS_OF_FRIENDS\n\n这些含义都很明显，除了 NETWORKS_FRIENDS（它允许你的朋友加上你网络中的任何人查看帖子）。\n\n\
  value 的另一个可能设置是：CUSTOM。使用它可以让你为 privacyObj 指定另外两个属性——networks 和 friends。\n\n对于 networks\
  \ 属性，输入应允许查看你帖子的网络的 ID 的逗号分隔列表，如下所示：\n\n```\nvar privacyObj:Object = {\n    value:\"\
  EVERYONE\",\n    networks:\"network1,network2,network3\"\n}\n```\n\n要允许所有网络查看帖子，只需将\
  \ 1 作为值输入即可。\n\n对于 friends 属性，输入以下其中之一：\n\n- EVERYONE\n- NETWORKS_FRIENDS\n- FRIENDS_OF_FRIENDS\n\
  - ALL_FRIENDS\n- SELF\n- NO_FRIENDS\n\n同样，很清楚每个的作用是什么。NO_FRIENDS 让你仅允许指定网络中的人查看帖子。\n\
  \nfriends 的另一个可能设置是：SOME_FRIENDS。这会为你提供可以为 privacyObj 设置的另一对属性——allow 和 deny。这两个属性都接受用户\
  \ ID（混合好友列表 ID）的逗号分隔列表；allow 定义谁可以看到帖子，而 deny 定义谁不能。\n\n因此，你的 privacyObj 可能看起来像这样：\n\
  \n```\nvar privacyObj:Object = {\n    value:\"CUSTOM\",\n    networks:\"network1,network2,network3\"\
  ,\n    friends:\"SOME_FRIENDS\",\n    allow:\"bob.smith,joe.q.faikname\",\n    deny:\"\
  bill.the.jerk\"\n}\n```\n\n## What just happened?\n\n正如你所见，你可以精细控制用户 Wall 上帖子的隐私级别。使用“正确”的设置完全取决于你的应用程序及其受众；只需了解可能实现的功能即可。\n\
  \n> 你无法控制用户在其他用户、页面、活动或群组的 Wall 上发布的帖子的隐私设置；这些帖子始终可以被任何可以看到该 Wall 的人看到。\n\n## Source\n\
  \n`source` 参数据说允许你将小型照片库、Flash 对象（如视频剪辑）和 MP3 音乐嵌入到帖子中，以及自定义键值对，这些键值对（虽然在 Facebook\
  \ 网站上不可见）稍后可以被你的应用程序或任何其他应用程序读取。\n\n不幸的是，在撰写本文时，该功能与 Graph API 的配合并不正确。请查看 `source`\
  \ 参数可以实现的功能：http://developers.facebook.com/docs/guides/attachments。希望到你阅读这一段时，该功能能得到完全实现并记录在案。\n\
  \n## Deleting Graph Objects\n\n我们已经掌握了添加帖子的方法，但后来如何删除它们呢？\n\n## Time for action\
  \ – deleting a Post\n\nFacebook 删除帖子的界面是一个在悬停时出现的 Remove 按钮：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_228_0.png)\n\
  \nVisualizer 项目也有一个 Delete 按钮；让我们看看如何添加它。\n\n## Time for action – deleting Posts\
  \ using the Visualizer\n\n1. 我们可以通过使用另一个隐藏选项来启用 Visualizer 的 Delete 按钮。在 CustomGraphContainerController.as\
  \ 的构造函数中，将 this._showDeleteButtons 设置为 true：\n\n```\npublic function CustomGraphContainerController(a_graphControlContainer:\
  \ GraphControlContainer)\n{\n    super(a_graphControlContainer);\n    this._showListCounts\
  \ = true;\n    this._showListFilters = true;\n    this._canShowSearchUI = true;\n\
  \    this._publishingCapability = PublishingCapabilities.COMPLETE;\n    this._showDeleteButtons\
  \ = true;\n    _requestor = new SDKRequestor();\n    addEventListenersToRequestor();\n\
  \    //we must wait for the Requestor to initialise before we can do\n    // anything\
  \ else with it\n    _requestor.addEventListener(Event.COMPLETE, onRequestorInitialize);\n\
  \    _requestor.initialize();\n}\n```\n\n2. 下次加载 SWF 时，你将在 List Renderer 中看到这个新按钮：\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_229_0.png)\n\n我们将从（像往常一样）HTTPRequestor\
  \ 的代码开始，因此请确保你的项目设置为将 _requestor 实例化为 HTTPRequestor 而不是 SDKRequestor。我们可以重用 publish()\
  \ 的大部分代码；按如下方式修改 HTTPRequestor.as 的 deleteObject() 函数：\n\n```\npublic function deleteObject(a_objectID:String):void\n\
  {\n    var loader:URLLoader = new URLLoader();\n    var urlRequest:URLRequest =\
  \ new URLRequest();\n    var variables:URLVariables = new URLVariables();\n\n  \
  \  if (this.accessToken != \"\")\n    {\n        variables.access_token = this.accessToken;\n\
  \    }\n    urlRequest.data = variables;\n\n    loader.addEventListener(Event.COMPLETE,\
  \ onDeleteComplete);\n    loader.addEventListener(IOErrorEvent.IO_ERROR, onIOError);\n\
  \    loader.addEventListener(HTTPStatusEvent.HTTP_STATUS, onHTTPStatusReturned);\n\
  \    loader.addEventListener(SecurityErrorEvent.SECURITY_ERROR, onSecurityError);\n\
  \    loader.load(urlRequest);\n}\n```\n\n4. 请注意，与使用 onPublishComplete() 作为 COMPLETE\
  \ 事件处理函数不同，我们使用的是 onDeleteComplete()，因此请创建该函数：\n\n```\nprivate function onDeleteComplete(a_event:Event):void\n\
  {\n    dispatchEvent(new DialogEvent(DialogEvent.DIALOG, \"Deleted!\"));\n}\n```\n\
  \n我们需要使用哪个 URL？很简单：我们使用要删除的 Graph 对象的 Graph URL。因此：\n\n```\npublic function deleteObject(a_objectID:String):void\n\
  {\n    var loader:URLLoader = new URLLoader();\n    var urlRequest:URLRequest =\
  \ new URLRequest();\n    var variables:URLVariables = new URLVariables();\n\n  \
  \  urlRequest.url = \"https://graph.facebook.com/\";\n    urlRequest.url += a_objectID;\n\
  \n    if (this.accessToken != \"\"\n\n\n```\n{\n    variables.access_token = this.accessToken;\n\
  }\nurlRequest.data = variables;\n\nloader.addEventListener(Event.COMPLETE, onDeleteComplete);\n\
  loader.addEventListener(IOErrorEvent.IO_ERROR, onIOError);\nloader.addEventListener(HTTPStatusEvent.HTTP_STATUS,\n\
  \    onHTTPStatusReturned);\nloader.addEventListener(SecurityErrorEvent.SECURITY_ERROR,\n\
  \    onSecurityError);\nloader.load(urlRequest);\n}\n```\n\n5. 那么HTTP请求方法呢？有一种叫做DELETE的方法，它绝对不是“安全”方法，而且正是我们想要的。不幸的是，出于安全考虑，我们只能在AIR中使用它。下面是代码，以防你以后编写AIR应用程序：\n\
  \n```\npublic function deleteObject(a_objectID:String):void\n{\n    var loader:URLLoader\
  \ = new URLLoader();\n    var urlRequest:URLRequest = new URLRequest();\n    var\
  \ variables:URLVariables = new URLVariables();\n\n    urlRequest.url = \"https://graph.facebook.com/\"\
  ;\n    urlRequest.url += a_objectID;\n    urlRequest.method = URLRequestMethod.DELETE;\n\
  \n    if (this.accessToken != \"\")\n    {\n        variables.access_token = this.accessToken;\n\
  \    }\n    urlRequest.data = variables;\n\n    loader.addEventListener(Event.COMPLETE,\
  \ onDeleteComplete);\n    loader.addEventListener(IOErrorEvent.IO_ERROR, onIOError);\n\
  \    loader.addEventListener(HTTPStatusEvent.HTTP_STATUS,\n        onHTTPStatusReturned);\n\
  \    loader.addEventListener(SecurityErrorEvent.SECURITY_ERROR,\n        onSecurityError);\n\
  \    loader.load(urlRequest);\n}\n```\n\n不过，如果你是在制作常规的Flash Player SWF，URLRequestMethod类甚至不会有DELETE常量。\n\
  \n对于基于常规SWF的应用程序，情况并没有复杂多少。我们只有两种请求方法可选——GET和POST。因为GET是安全方法，我们不能用它来删除服务器上的对象，所以必须使用POST：\n\
  \n```\npublic function deleteObject(a_objectID:String):void\n{\nvar loader:URLLoader\
  \ = new URLLoader();\nvar urlRequest:URLRequest = new URLRequest();\nvar variables:URLVariables\
  \ = new URLVariables();\n\nurlRequest.url = \"https://graph.facebook.com/\";\nurlRequest.url\
  \ += a_objectID;\nurlRequest.method = URLRequestMethod.POST;\n\nif (this.accessToken\
  \ != \"\")\n{\n    variables.access_token = this.accessToken;\n}\nurlRequest.data\
  \ = variables;\n\nloader.addEventListener(Event.COMPLETE, onDeleteComplete);\nloader.addEventListener(IOErrorEvent.IO_ERROR,\
  \ onIOError);\nloader.addEventListener(HTTPStatusEvent.HTTP_STATUS, onHTTPStatusReturned);\n\
  loader.addEventListener(SecurityErrorEvent.SECURITY_ERROR, onSecurityError);\nloader.load(urlRequest);\n\
  }\n```\n\n……但我们可以轻松地通过传递一个新参数——method=delete——来告诉Facebook将其视为DELETE请求：\n\n```\n\
  public function deleteObject(a_objectID:String):void\n{\nvar loader:URLLoader =\
  \ new URLLoader();\nvar urlRequest:URLRequest = new URLRequest();\nvar variables:URLVariables\
  \ = new URLVariables();\n\nurlRequest.url = \"https://graph.facebook.com/\";\nurlRequest.url\
  \ += a_objectID;\nurlRequest.method = URLRequestMethod.POST;\n\nif (this.accessToken\
  \ != \"\")\n{\n    variables.access_token = this.accessToken;\n}\nvariables.method\
  \ = \"delete\";\nurlRequest.data = variables;\n\nloader.addEventListener(Event.COMPLETE,\
  \ onDeleteComplete);\nloader.addEventListener(IOErrorEvent.IO_ERROR, onIOError);\n\
  loader.addEventListener(HTTPStatusEvent.HTTP_STATUS,\n    onHTTPStatusReturned);\n\
  loader.addEventListener(SecurityErrorEvent.SECURITY_ERROR,\n    onSecurityError);\n\
  loader.load(urlRequest);\n}\n```\n\n这个方法和AIR版本一样有效，而且只多花我们一行代码。\n\n要使用SDK删除对象，我们可以使用`Facebook.api()`，但有一个快捷方法：`Facebook.deleteObject()`。它接受两个参数——要删除的Graph\
  \ Object的ID和一个回调函数。这使得所需代码非常简单；将其添加到SDKRequestor.as中：\n\n```\npublic function deleteObject(a_objectID:String):void\n\
  {\n    Facebook.deleteObject(a_objectID, deleteComplete);\n}\n\nprivate function\
  \ deleteComplete(result:Object, fail:Object):void\n{\n    if (result != null)\n\
  \    {\n        dispatchEvent(new DialogEvent(DialogEvent.DIALOG, \"Deleted!\"));\n\
  \    }\n    else\n    {\n        dispatchEvent(new DialogEvent(DialogEvent.DIALOG,\n\
  \            \"Deletion failed. Details: \" + String(fail)));\n    }\n}\n```\n\n\
  编译、上传，然后通过删除你墙上的一条帖子来测试新的更改。\n\n## 刚才发生了什么？\n\n你应该已经看到一条墙上的帖子从Facebook上被删除了。\n\n\
  > 最新消息：在本书即将出版之前，Facebook似乎改变了Graph API，使得墙上的帖子只能由最初用于发布该帖子的应用程序删除。以前，可以删除已登录用户墙上的任何帖子，也可以删除该用户在他人墙上发布的任何帖子。在撰写本文时，官方Graph\
  \ API文档并未提及此限制。因此，如果你在删除帖子时遇到问题，请先通过Visualizer创建一个帖子，然后再尝试删除它。\n\n这再次只需要`publish_stream`扩展权限；到目前为止，你应该已经清楚这个权限有多强大了。你可以使用相同的代码删除其他类型的Graph\
  \ Object，而不仅仅是帖子。如果你的应用程序有权限修改或创建对象，那么它也有权限删除它。\n\n如果你尝试通过Facebook网站删除帖子，它会要求确认：\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_235_0.png)\n\n这是个好主意，值得在你自己的项目界面中使用。Visualizer不会要求确认，而且即使删除后也不会从List\
  \ Renderer中移除帖子——尽管这确实让你看到如果尝试删除一个已经被删除的帖子会发生什么……\n\n## 发布其他类型的Graph Object\n\n\
  所有可以创建的Graph Object类型都可以按照与墙帖子相同的基本步骤来创建：\n\n- 使用`POST HTTP`请求方法\n- 使用`URLVariables`对象设置参数\n\
  - 确保你拥有访问令牌和所需的权限\n\nGraph List Renderer的Publish按钮总是会创建一个窗口，其中的输入与正在渲染的Graph List相对应，而这个窗口又总是将其值传递给`CustomGraphContainerController`的`publish()`函数（在一个`PublishObject`实例内部），因此你可以试验不同的类型。\n\
  \n每当有人评论该帖子时，用户还会收到电子邮件和通知。这就像一个微型订阅，也是一种认可的标志。\n\n请求的URL是：\n\n```\nhttps://graph.facebook.com/<post_id>/likes\n\
  ```\n\n没有任何参数。\n\n点赞需要`publish_stream`权限。\n\n## 那么“点赞”其他Graph Object呢？\n\n在第2章中，我们了解了“点赞”连接如何将人们与电视节目、电影、音乐、兴趣和活动联系起来；“点赞”连接构成了Graph\
  \ Web中的许多分支。然而，Graph API不允许我们“点赞”帖子以外的任何东西（即使尝试点赞评论也会导致HTTP状态码500）。\n\nFacebook表示，他们不打算允许开发者为其他任何东西创建“点赞”。他们的目标似乎是确保任何用户都不会点击非官方的“点赞”按钮（或者至少，不会在Facebook未批准的环境中点击“点赞”按钮；Yelp.com有自己设计的“点赞”按钮，因为他们是Facebook的合作伙伴网站）。\n\
  \n所以，遗憾的是，无法通过Graph API修改用户的电视节目、电影、兴趣或活动。\n\n## 删除点赞\n\n点赞没有自己的ID，所以我们不能通过尝试删除\
  \ https://graph.facebook.com/<like_id> 来删除点赞。相反，我们必须使用这个URL：https://graph.facebook.com/<graph_object_id>/likes。\n\
  \n如你所知，这是连接的Graph URL，如果我们试图在浏览器中加载它，它会返回一个Graph List。然而，当我们尝试使用“删除Graph Objects”一节中描述的过程删除该URL时，它会使授权用户“取消赞”该Graph\
  \ Object。\n\n\n\n\n\n## 笔记\n\n笔记就像微型博客文章：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_238_0.png)\n\
  \n要请求的 URL 是：https://graph.facebook.com/<id>/notes。\n\n该 ID 只能是当前用户的 ID，或者是用户管理的主页的\
  \ ID。\n\n尽管笔记通常比墙贴更长，并且能够支持图片、链接和格式化文本，但只需要两个参数：\n\n- message：这是一个 HTML 字符串（这就解释了为什么能添加图片和格式化内容）\n\
  - subject：笔记的标题\n\n要发布笔记，你的应用程序需要 publish_stream 权限。\n\n## 活动\n\n活动看起来像这样：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_239_0.png)\n\
  \n与主页一样，活动也有一个留言墙，可以使用 /«event_id»/feed 这个 URL 路径前缀向其发布内容。活动也有成员列表，但成员分为四个类别：\n\n\
  - ♦ 参加：/«event_id»/attending\n- ♦ 可能参加：/«event_id»/maybe\n- ♦ 不参加：/«event_id»/declined\n\
  - ♦ 等待回复：/«event_id»/noreply\n\n用户可以收到邀请，并可以用前三个类别中的任意一个进行 RSVP；这让日程安排变得简单一些。\n\n\
  另一个连接，/«event_id»/invited，包含了所有被邀请到该活动的人员列表，无论他们是否回复。\n\n要创建活动，请向此 URL 发送 POST 请求：https://graph.facebook.com/«id»/events。\n\
  \n（与笔记一样，该 ID 只能是当前用户的 ID，或者是用户管理的主页的 ID。）\n\n需要三个参数：\n\n- `name`：活动的标题\n- `start_time`：活动开始的时间和日期\n\
  - `end_time`：活动结束的时间和日期\n\n两个日期都必须以 **ISO 8601** 格式输入。维基百科关于 ISO 8601 的信息比你需要的还要多（http://en.wikipedia.org/wiki/ISO_8601）；简单总结一下，**2010年11月8日\
  \ UTC 下午1:25** 表示为 `2010-11-08T13:25Z`。如果你让用户手动输入时间，请确保将其调整到 UTC 时区！\n\n要创建活动，你的应用程序需要\
  \ `create_event` 权限。\n\n## 活动回复（RSVP）\n\nFacebook 没有使用一个单一的 URL 来提交 RSVP 并在参数中设置\
  \ RSVP 类型，而是使用了三个独立的 URL：\n\n- https://graph.facebook.com/«event_id»/attending：参加\n\
  - https://graph.facebook.com/«event_id»/maybe：可能参加\n- https://graph.facebook.com/«event_id»/declined：不参加\n\
  \n当用户通过网站界面进行 RSVP 时，Facebook 会询问用户是否附上（可选的）备注（例如，“抱歉我那天去不了”或“非常期待！”）。然而，上述三个 URL\
  \ 不接受任何参数；如果你想让用户发布 RSVP 备注，只需将其作为一条帖子发布到 `/feed` 连接即可。\n\nRSVP 并非一成不变；用户之后可以改变主意。在设计与此相关的应用时请记住这一点！不要因为用户已经有\
  \ RSVP 状态就阻止他们再次设置。\n\n要进行 RSVP，你的应用程序需要 `rsvp_event` 权限。\n\n```\nloader.addEventListener(HTTPStatusEvent.HTTP_STATUS,\n\
  \    onHTTPStatusReturned);\nloader.addEventListener(SecurityErrorEvent.SECURITY_ERROR,\n\
  \    onSecurityError);\nloader.load(urlRequest);\n```\n\n……我们必须这样做：\n\n```\nvariables.message\
  \ = a_publishObject.message;\nvariables.source = a_publishObject.source;\nurlRequest.data\
  \ = variables;\na_publishObject.source.addEventListener(\n    DataEvent.UPLOAD_COMPLETE_DATA,\
  \ onPublishComplete);\na_publishObject.source.addEventListener(IOErrorEvent.IO_ERROR,\n\
  \    onIOError);\na_publishObject.source.addEventListener(HTTPStatusEvent.HTTP_STATUS,\n\
  \    onHTTPStatusReturned);\na_publishObject.source.addEventListener(\n    SecurityErrorEvent.SECURITY_ERROR,\
  \ onSecurityError);\na_publishObject.source.upload(urlRequest);\n```\n\nSDK Requestor\
  \ 不需要真正的修改；它使用 FileReference 并封装了上传过程。这意味着我们可以像往常一样直接调用 Facebook.api()：\n\n```\n\
  Facebook.api(urlStub, publishComplete,\n{\n    message:a_publishObject.message,\n\
  \    source:a_publishObject.source\n},\nURLRequestMethod.POST\n);\n```\n\n在每种情况下，记得将\
  \ URL 路径前缀改为 /«album_id»/photos。\n\n将照片上传到相册需要 publish_stream 权限。与相册类似，你可能还想授予 `user_photos`\
  \ 权限。\n\n不出所料，要向相册添加照片，用户必须要么拥有该相册，要么管理拥有该相册的主页。\n\n## 签到\n\n**签到**由 Facebook 地点（Places）使用，允许用户发布他们当前的位置以及关于该地点的消息。\n\
  \n要创建签到，请向此 URL 发送 POST 请求：https://graph.facebook.com/«user_id»/checkins。\n\n唯一允许的\
  \ ID 是已认证用户的 ID（所以你可以改用 me）。\n\n支持三个参数：\n\n- `coordinates`\n- `place`\n- `message`\n\
  \n`coordinates` 参数必须是一个包含两个属性（纬度和经度）的 JSON 字符串。使用本章前面提到的 JSON.encode() 方法将原生 AS3\
  \ 对象转换为 JSON 字符串。\n\n`place` 参数应该是与用户当前所在位置对应的地点（Place）的 ID。在第5章中，我们看到了如何搜索给定位置附近的地点（Places）并获取其\
  \ ID。\n\n`message` 参数是可选的——它是用户对自己正在做什么的简单评论。例如，“刚在奥尔顿塔玩了激流勇进。”\n\n创建签到需要 `publish_checkins`\
  \ 权限。你可能还想授予 `user_checkins` 权限，以允许用户查看他们的其他签到。\n\n## 其他功能呢？\n\n有很多操作你可以通过 Facebook\
  \ 网站界面完成，但无法通过 Graph API 完成。我们已经看到了“赞”功能的限制；还有哪些缺失的功能？\n\n## 发送站内信\n\n可以读取站内信（如第5章所述），但不能创建和发送这些消息。Facebook\
  \ 曾计划允许应用创建站内信，但这一计划似乎已被废弃。这项功能有可能会作为新消息功能的一部分被纳入；更多相关信息请参见第8章。\n\n## 创建主页、群组、应用和视频\n\
  \n无法通过 Graph API 创建这些类型的任何 Graph 对象。\n\n这有点令人惊讶——群组与活动并没有太大不同，而主页反过来也与群组没有太大不同。无法创建视频的功能甚至更奇怪，因为这意味着无法创建能够直接将视频上传到\
  \ Facebook 的移动应用。\n\n不过，不能通过其他应用创建应用倒是可以理解的！\n\n## 更改个人资料信息\n\n你的应用程序无法更改用户的感情状态、当前所在地、最喜欢的语录、教育背景，或任何类似信息。由于\
  \ Graph API 不允许对除墙贴之外的任何内容进行“赞/取消赞”，这意味着用户的整个信息栏都“只能看，不能碰”。\n\n## 添加好友\n\n应用无法向其他用户发送好友请求，也无法将某人从当前用户的好友列表中移除。（尽管你可以向其他用户发送足够多的无礼消息，鼓励他们将当前用户从其好友列表中移除。）\n\
  \n## 邀请好友参加活动\n\n你可以创建活动，但无法邀请任何人参加。真有意思。\n\n## 快速测验\n\n- 1. 为什么我们突然需要使用不同的 HTTP\
  \ 请求方法？\n  a. 我们自始至终都应该使用 POST\n  b. Graph API 自你阅读上一章以来已经改变了\n  c. 在更改数据时，HTTP\
  \ 要求我们使用“不安全”的方法\n- 2. 为什么要费心监听不同类型的 HTTP 状态码？\n  a. 既然我们现在使用的是不同的 HTTP 请求方法，我们就需要这样做\n\
  \  b. 这些代码可以为我们提供关于发布尝试失败原因的额外信息\n\n\n\n\n\n3. 没有访问令牌，我们可以发布什么？\n\na. 什么都不能\nb.\
  \ 只能发布状态消息\nc. 只能点赞\nd. 什么都可以\n\n## 总结\n\n现在，你已经学会了如何创建多种不同类型的图谱对象：帖子、评论、活动等等。你还学会了在需要时如何删除它们。\n\
  \n对于图谱 API 无法做到的事情，你是否感到惊讶？\n\n在下一章中，我们将重新审视图谱，但我们将使用一个强大的新工具——Facebook 查询语言。\n\n\
  要点回顾：\n\n- 要通过 HTTP 发布，照常使用 URLRequest/URLLoader/URLVariables 设置，并在 URLVariables\
  \ 实例中随访问令牌一起包含新图谱对象的参数。\n- 使用的 URL 是 https://graph.facebook.com/«id»/«connection»。务必使用\
  \ flash.net.URLRequestMethod.POST。\n- 要通过 SDK 发布，调用 Facebook.api(\"«id»/«connection»\"\
  , «callback», {parameter1:\"value1\", parameter2:\"value2\"}, URLRequestMethod.POST)。\n\
  - 上传照片需要 FileReference。使用 FileReference.browse() 让用户从硬盘中选择图片。\n- 要通过 HTTP 上传：使用\
  \ FileReference.upload() 而不是 URLLoader.load()。\n- 要通过 SDK 上传：只需将 FileReference 作为\
  \ URLVariables 实例中 source 参数的值传入，然后照常调用 Facebook.api() 即可。\n- 通过图谱 API，你只能“赞”帖子，不能“赞”其他内容。这意味着我们无法修改用户的兴趣或最喜欢的电视节目。\n\
  - 在编写本书时，我们只能删除使用同一应用程序创建的帖子。\n- 要通过 HTTP 删除，只需使用 URLRequestMethod.POST 将 `method=delete`\
  \ 传递给 `https://graph.facebook.com/<id>`。\n- 如果使用 AIR，你可以直接用 `URLRequestMethod.DELETE`\
  \ 加载 `https://graph.facebook.com/<id>`。\n- 要通过 SDK 删除，调用 `Facebook.deleteObject(\"\
  <id>\", \"<callback>\")`。\n- 例外情况是删除“赞”；在这种情况下，要删除的 URL 路径是 `<id>/likes`。\n- 发布所需的完整参数和权限列表可在\
  \ `http://developers.facebook.com/docs/reference/api` 查看。\n- 出于安全原因，Flash Player\
  \ 10 及以上版本不允许你的应用程序通过 `HTTP POST` 方法发布任何内容，除非该操作是由用户发起的（例如，通过点击按钮）。\n\n## 7\n"
- "## FQL 相关问题\n\n> 图谱是访问 Facebook 数据的一种极佳模型；它能够处理网站上海量的信息，并让访问变得简单易行。\n\n> 然而，有时我们希望获得额外的控制力和更强大的能力。这时就要用到\
  \ FQL 了。它是一种专为搜索 Facebook 数据库而设计的编程语言——而且它不使用图谱。\n\n在本章中，我们将：\n\n- 回顾不同的数据表示和可视化模型\n\
  - 通过使用 FQL 获取一些 Facebook 数据来熟悉它\n- 学习如何使用 FQL 来完成（几乎）所有图谱能做的事情\n- 发现图谱比 FQL 更擅长的方面\n\
  - 找出如何检测已授予哪些扩展权限\n- 了解一些高级 FQL 特性\n\n那么，让我们开始吧……\n\n## 什么是 FQL？\n\nFQL（按首字母缩写读作“eff-cue-ell”）是\
  \ Facebook 版本的数据库语言 SQL。不知道 SQL 是什么？别担心，你不需要知道。在本章中，我会假设你对 FQL、SQL 或数据库一无所知。所以在深入探讨\
  \ FQL 是什么之前，让我们先退一步，看看数据库。\n\n## 但如果我已经会 SQL 了呢？\n\n即使你懂 SQL，也值得读一读本章，以复习一些概念，并了解\
  \ FQL 与常规 SQL 之间的差异。特别是，可以参考“限制”部分。\n如果你有 SQL 经验，你可能会惊讶于 FQL 缺少多少功能。最明显的是，它没有 INSERT、DELETE\
  \ 或 UPDATE 子句。此外，缺少 JOIN、GROUP BY 和 LIKE；你必须指定要返回的字段集，而不能输入 SELECT *，而且在 FROM 子句中只能指定一个表。\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_250_0.png)\n\n## 理解 FQL 接口\n\n我们一直把 Facebook\
  \ 数据看作第 2 章中列出的图谱格式来查看，但实际上，这仅仅是一种数据模型；图谱 API 就像是一个包装器，让数据看起来像是按那种方式组织的。其实并非如此。\n\
  \n数据的组织方式重要吗？对于我们的目的来说并不重要。重要的是我们用来访问数据的接口。到目前为止，这个接口一直是图谱 API；我们通过图谱 URL 获取了所有数据，并用\
  \ AS3 进行处理。\n\n但还有另一种查看数据的方式，它类似于传统的数据库结构。在这种情况下，所有数据都保存在表中，按列、行和字段组织。用一个例子来解释更容易：\n\
  \n| user |  |  |  |  |  |  |\n|---|---|---|---|---|---|---|\n| uid | first_name\
  \ | middle_name | last_name | name | sex | username |\n| 123456 | Michael | James\
  \ | Williams | Michael James Williams | male | michael_james_williams |\n| 789012\
  \ | Joe | Quincy | Faikname | Joe Q Faikname | male | joe_q_faikname |\n\n为了简洁起见，省略了部分列。\n\
  \n这是一张数据表。具体来说，它是 user 表，你可以从下面的标题看出来：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_250_1.png)\n\
  \n每一**列**代表数据的一个属性：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_251_0.png)\n\n每一**行**对应一个对象，包含其所有属性：\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_251_1.png)\n\n行和列的交点——即某个对象的某个属性——称为一个**字段**：\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_251_2.png)\n\n你也可以把这种结构想象成电子表格；这是以网格形式存储数据的一种简单而自然的方式。（当然，如果你熟悉关系数据库，你也可以直接把它想象成关系数据库中的一张表！）\n\
  \n## 数据模型\n\n现在我们有了三种不同的模型可以用来思考 Facebook 数据：\n\n1. AS3 面向对象模型：我们有一些包含特定属性的类，以及这些类的实例，实例中包含关于特定项目的信息。例如，我们可以创建一个名为\
  \ User 的类，它包含某些属性，并定义该类的一个实例：\n\n```\nclass User\n{\n    public var uid:int;\n```\n\
  \n让我们看一个例子，从 page 表中获取一些信息：\n\n| page |\n|------|\n| page_id |\n| name |\n| website\
  \ |\n| type |\n| location |\n\n其中每一项——page_id、name、website、type 和 location——都是列，就像\
  \ uid、first_name、middle_name、last_name、name、sex 和 username 是 user 表的列一样。\n\n## 动手实践——从\
  \ Page 表检索信息\n\n那么我们如何使用它呢？当然，我们不能请求对象，因为我们不是在使用对象模型——但我们甚至也不请求行（行与对象是近似的对应物）。我们请求的是特定字段。如果我们只对页面关联网站的\
  \ URL 感兴趣，我们只需请求“website”列中的结果：\n\n```\nSELECT website\n```\n\n接下来，我们必须指定我们感兴趣的表。在本例中，就是“page”：\n\
  \n```\nSELECT website\nFROM page\n```\n\n现在我们指定一个条件来缩小搜索范围：\n\n```\nSELECT website\n\
  FROM page\nWHERE name = \"Facebook\"\n```\n\n（请注意，在检查这个条件时，我们使用 = 而不是 ==，这与 AS3\
  \ 不同。）\n\n这三个元素构成一个“查询”。当我们运行这个查询时——类似于编译 AS3——我们将收到 http://www.facebook.com/，因为这是\
  \ page 表中 name 为 Facebook 的那一行的 website 列字段的值。\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_253_0.png)\n\
  \n> 通常会看到 FQL 关键字全部大写，如 SELECT、FROM 和 WHERE，但这并不是硬性要求。不过，这确实有助于提高可读性。\n\n\n\n\n\
  ```\n\"username\": \"facebook\",\n\"founded\": \"February 4, 2004\",\n\"company_overview\"\
  : \"Millions of people use Facebook everyday to keep up with friends, upload an\
  \ unlimited number of photos, share links and videos, and learn more about the people\
  \ they meet.\\n\\n\\\"Like\\\" this page for ongoing updates on new products, announcements\
  \ and stories. \\n\\nOther ways to connect with us:\\nVisit the Facebook Blog at\
  \ http://blog.facebook.com\\nFollow us on Twitter: @facebook\\nSubscribe to more\
  \ video at http://www.youtube.com/facebook\\n\",\n\"mission\": \"Facebook's mission\
  \ is to give people the power to share and make the world more open and connected.\"\
  ,\n\"fan_count\": 17565186\n}\n```\n\n然后，ID 为 107885072567744 的页面：\n\nhttps://graph.facebook.com/107885072567744\n\
  \n```\n{\n  \"id\": \"107885072567744\",\n  \"name\": \"Facebook\",\n  \"link\"\
  : \"http://www.facebook.com/pages/Facebook/107885072567744\",\n  \"category\": \"\
  Interest\",\n  \"is_community_page\": true,\n  \"description\": \"<p><b>Facebook</b>\
  \ is a <a href=\\\"/pages/w/107511275938278\\\">social networking</a> website launched\
  \ in February 2004 that is operated and privately owned by Facebook, Inc., with\
  \ more than 500 million active users in July 2010.</p>\",\n  \"fan_count\": 299474\n\
  }\n```\n\n啊哈！第二个是一个社区主页——一个由 Facebook 用户创建并拥有的、关于 Facebook 的页面，而不是 Facebook 自身创建的。如果你在浏览器中加载这个主页（使用\
  \ link 属性中的 URL），你会看到“网站”字段没有任何内容，这就是为什么我们第一次查询得到的第二个结果是空白的。谜团解开了。\n\n## 动手实践——创建\
  \ FQL 查询构建器\n\n创建一个 Flash 应用程序，允许你输入 FQL 查询，运行它，并显示结果。你需要使用某个东西，就像我们在第 2 章中所做的那样。这将使你在本章其余部分测试查询时容易得多！\n\
  \n## 连接呢？\n\n所以这本质上是从单个 Graph 对象获取数据的 FQL 等价物。但获取 Graph 对象的连接又等价于什么呢？\n\n理解数据库模型中连接的形成方式，比使用\
  \ Graph API 模型更难掌握。（如果这是 Graph API 背后的主要动机之一，我也不会感到惊讶。）在某种意义上，你必须反向思考。\n\n让我们以装满照片的相册为例。首先，想象我们创建了一个名为“迈克尔超棒的假期照片”的空相册。在数据库模型中，它看起来像这样：\n\
  \n| album |\n|---|---|---|\n| aid | owner | name |\n| «自动» | «我的用户ID» | 迈克尔超棒的假期照片\
  \ |\n\n`album` 表有一个 `cover_pid` 字段，它被设置为我想设为封面照片的那张图片的 ID。那么假设我拍了一张机场的照片并上传为封面照片；它会被自动分配一个\
  \ ID。\n\n现在我们可以将机场照片的 ID 作为 `album` 表的 `cover_pid` 字段的值：\n\n| album |\n|---|---|\
  \ \n| aid | owner | name | cover_pid |\n| «自动» | «我的用户ID» | 迈克尔超棒的假期照片 | «机场照片的ID»\
  \ |\n\n我们可以这样说明：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_257_0.png)\n\n好了，这解释了一张照片如何连接到一个相册。我们可以用以下\
  \ FQL 查询找出哪个相册以某张照片作为封面：\n\n```\nSELECT aid\nFROM album\nWHERE cover_pid = «specific\
  \ photo's ID»\n```\n\n反过来，我们可以用这个查询找出哪个照片是某个相册的封面：\n\n```\nSELECT pid\nFROM photo\n\
  WHERE pid = «album's cover_pid»\n```\n\n……实际上，我们可以用一个非常相似的查询找出某个相册中有哪些照片：\n\n```\n\
  SELECT pid\nFROM photo\nWHERE aid = «album's ID»\n```\n\n与 Graph 模型相比，这可以被认为是“反向”的，因为在\
  \ Graph 中，你获取相册对象并请求所有相关的照片：`album/photos`；而在数据库模型中，你获取照片表并请求所有属于某个相册的行：`FROM photo\
  \ WHERE aid = «album id»`。\n\n## 照片、相册及其所有者\n\n你注意到了吗？photo 和 album 表都有一个名为 “owner”\
  \ 的字段，包含所有者的用户 ID？现在，我们当然可以把它们连接起来。第一次尝试可能看起来像这样：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_259_0.png)\n\
  \n那条线上方该放什么词？聪明的猜测是“是”，因为所有者相同——小心，这是一个陷阱。\n\n这些“实体关系”线并不连接数据库表中的*字段*；它们连接整个表，*使用*字段作为“键”。记住从左到右阅读动词的规则。如果我们使用“是”作为动词，它就会变成“照片是指定的相册”，这显然是错误的。\n\
  \n我们不能直接连接这两张表，因为它们的关系是通过另一个实体建立的。让我来展示一下我的意思：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_260_0.png)\n\
  \n现在我们有了三张表（photo、album、user）和四个关系：\n\n- 照片属于指定的相册\n- 照片是指定相册的封面\n- 照片属于指定的用户\n\
  - 用户拥有指定的相册\n\n所以我们可以用这个查询获取某个用户所有照片的 URL：\n\n```\nSELECT src\nFROM photo\nWHERE\
  \ owner = «user's ID»\n```\n\n## 动手实践——获取用户的相册\n\n看看你能否写出一个等效的查询，用于获取某个用户所有相册的 URL。你需要使用的表和列名都在上面的图中，但你可以在\
  \ http://developers.facebook.com/docs/reference/fql/ 找到更多信息。\n\n记住，你总是可以通过 API URL\
  \ 调用来检查你的查询。\n\n## 主键\n\n你注意到了吗？关系线的一端总是指向表的主 ID？\n\n- `photo.pid`\n- `user.uid`\n\
  - `album.aid`\n\n这些字段中的每一个都被称为该表的**主键**。这意味着任何给定的行都可以用该字段（且仅用该字段）来标识；每一行在其主键字段中都有一个值，并且没有两行具有相同的主键值。\n\
  \n通过用粗体书写主键的名称，我们可以更容易地理解表之间的关系。\n\n我们也有一个名称，用于指向其他表主键的字段，比如：\n\n- `photo.owner`（链接到\
  \ `user.uid`）\n- `photo.aid`（链接到 `album.aid`）\n- `album.cover_pid`（链接到 `photo.pid`）\n\
  \n我们称这些为**外键**，并且倾向于在任何图中用斜体书写它们。\n\n我们之前关于 **photo**、**user** 和 **album** 表的图可以重新绘制，如下一张截图所示：\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_261_0.png)\n\n## 乌鸦脚\n\n所以我们有两条线连接 album\
  \ 表和 photo 表。\n\n对于给定的相册，这两个查询的结果有什么不同？\n\n```\nSELECT pid\nFROM photo\nWHERE aid\
  \ = «album ID»\n```\n\n和\n\n```\nSELECT pid\nFROM photo\nWHERE pid = «album's cover_pid»\n\
  ```\n\n答案是，第一个可能返回多个照片的 ID，而第二个只会返回一个。我们可以在关系语句的措辞中明确这一点，像这样：\n\n> 相册包含**零个或多个**照片\n\
  \n> 相册的封面是**一个且仅一个**照片\n\n注意，我必须反转句子，以“相册”而不是“照片”开头，这样才有意义。\n\n我们也可以在图中表示这一点；我们使用所谓的**乌鸦脚标记法**：\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_262_0.png)\n\n顶部线右侧的三个叉（“**乌鸦脚**”）表示“多”，圆形表示“零”，所以这读作“零到多”或“零或多个”。底部线右侧的一对横线表示“一个且仅一个”。\n\
  \n不过，这并没有说明全部情况。并非所有照片都是相册的封面照片。我们需要反转句子来用语言解释：\n\n> “照片属于一个且仅一个相册”\n\n> “照片是零个或一个相册的封面”\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_263_0.png)\n\n这里，顶部线上的一对横线再次表示“一个且仅一个”，而圆和横线表示“零或一个”。我保留了线上的其他标记，但由于表现在调换了方向，它们位于左侧而不是右侧。\n\
  \n一开始阅读这些图有点棘手；最好的方法是将它们分解成我们在这里所做的成对句子。你最终会掌握的。\n\n## 动手实践——绘制你自己的乌鸦脚\n\n学习使用乌鸦脚标记法的另一种方法是绘制你自己的图。重新绘制连接\
  \ photo、user 和 album 表的图，并在每条线的每一侧添加适当的标记。记住从成对的关系语句开始，弄清楚你需要表达什么！\n\n你可以用铅笔和纸来完成，但如果你想进一步为所有表绘制图，可以考虑使用像\
  \ DbSchema 这样的软件：http://www.dbschema.com/。记住，表和列的列表可在 http://developers.facebook.com/docs/reference/fql/\
  \ 获取。\n\n## 链接表\n\n我们如何在朋友之间创建同样的链接？嗯，这必须是 user 表与其自身之间的关系，所以一个不错的初步猜测是：\n\n> “一个用户与零个或多个用户是好友”\n\
  \n\n\n……反过来写的句子也完全相同。到目前为止，一切顺利。不过，当我们尝试把它画出来时，事情就变得棘手了。下面这两种方式可行吗？\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_264_0.png)\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_264_1.png)\n\n不行。这是数据库模型的一条基本规则：表之间不能存在“多对多”关系。这里我们尝试的是两张表相同的情况，但即使表不同，这条规则也同样适用。\n\
  \n我想那我们最好放弃吧。当然，其实并非如此。相反，我们使用一种称为“链接表”的东西：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_264_2.png)\n\
  \n这些关系的标签很棘手；由于链接表不是实实在在的东西，合适的标签必须像是“被分配给”，这没什么帮助。实际上，链接表本身就表达了这种关系，所以你通常可以完全省略标签。或者，也可以像它们通过链接表连接那样来标注，比如“是……的好友”。\n\
  \n这使得查找用户的好友比查找他们的照片要困难一些。不过，我们可以像这样获取好友 ID 的列表：\n\n```\nSELECT uid2\nFROM friend\n\
  WHERE uid1 = «user's ID»\n```\n\n## 刚才发生了什么？\n\n该查询将获得与指定用户为好友的所有用户的 ID 列表。别担心，每一行都会以\
  \ ID 顺序调换的方式重复存储；如果有一行是“uid1 = 123”和“uid2 = 456”，那么就会有另一行是“uid1 = 456”和“uid2 = 123”。这意味着如果你只查询\
  \ uid2 的值，也不会漏掉任何人。\n\n获取用户好友姓名的列表则更难一些。让我们考虑一下如何借助 AS3 来实现。\n\n## 动手实践 – 使用 AS3\
  \ 获取用户好友的姓名\n\n我们可以从使用上面的查询获取用户好友的 ID 列表开始：\n\n```\nSELECT uid2\nFROM friend\nWHERE\
  \ uid1 = «user's ID»\n```\n\n从本章前面的内容可知，我们可以调用这个 API URL 来获取该列表：\n\n```\nhttps://api.facebook.com/method/fql.query?access_token=«access_token»&format=json&query=SELECT%20page_id%20FROM%20page%20WHERE%20name%20=%20%22Facebook%22\n\
  ```\n\n不过，实际上这样是行不通的。就像使用 Graph API 访问私人信息一样，你需要使用访问令牌。（关于如何生成访问令牌，可参阅第 3 章。）\n\n\
  那么，正确的 API URL 是：\n\n```\nhttps://api.facebook.com/method/fql.query?access_token=ACCESS_TOKEN&format=json&query=SELECT%20page_id%20FROM%20page%20WHERE%20name%20=%20%22Facebook%22\n\
  ```\n\n有了用户的 ID，我们可以使用以下查询获取他们的姓名：\n\n```\nSELECT name\nFROM user\nWHERE uid = «user's\
  \ ID»\n```\n\n## 权限\n\n仅仅因为你不是通过 Graph 访问数据，并不意味着你可以随意获取任何你想要的信息。你仍然受到与之前相同的身份验证要求的约束。例如，你需要一个访问令牌才能运行此查询：\n\
  \n```\nSELECT uid\nFROM user\nWHERE name=\"Michael James Williams\"\n```\n\n在使用\
  \ FQL 时，扩展权限仍然适用。如果你在没有任何权限的情况下尝试查询 `mailbox_folder` 表，你将收到一个 `error 612`，提示你 **邮箱需要\
  \ read_mailbox 扩展权限。**\n\n在撰写本文时，文档中还没有指南说明访问特定表（或字段）需要哪些扩展权限。最接近的是这个页面，它从 Graph\
  \ 的角度进行了描述：http://developers.facebook.com/docs/authentication/permissions。\n\n##\
  \ 检查现有权限\n\n数据库模型提供而 Graph 不具备的一个很棒的功能，是能够获取当前用户被授予的扩展权限列表。\n\n这是通过 `permissions`\
  \ 表实现的，该表有很多列：\n\n|  |  |\n|---|---|\n| `uid`（整数）– 用户 ID（必须是当前用户）或主页 ID |  |\n|\
  \ `publish_stream`（布尔值）– 如果用户或主页拥有 `publish_stream` 权限，则返回 1，否则返回 0 |  |\n| `create_event`（布尔值）–\
  \ 如果用户或主页拥有 `create_event` 权限，则返回 1，否则返回 0 |  |\n| `rsvp_event`（布尔值）– 如果用户或主页拥有\
  \ `rsvp_event` 权限，则返回 1，否则返回 0 |  |\n\n等等。表中每一个可能的权限都对应一列；每种情况下，值都为 1 或 0。\n\n因此，如果当前用户的\
  \ ID 是 123456，我们可以使用以下 FQL 查询来了解他们是否已向我们的应用授予 `publish_stream` 权限：\n\n```\nSELECT\
  \ publish_stream\nFROM permissions\nWHERE uid=123456\n```\n\n> 请注意，此限制仅要求查询字段中*至少有一个*是可索引的。`SELECT`\
  \ 子句中指定的字段可以是 `FROM` 子句指定表中的任意字段。在本章后面，你将看到如何在一个 `WHERE` 子句中同时查询多个字段，其中只需有一个字段可索引。\n\
  \n## 这在实践中有影响吗？\n\n一般来说，你在搜索查询中实际需要使用的字段都是可索引的；你很少会想根据用户头像的 URL 来搜索用户。不过，也有一些例外需要留意。例如，在\
  \ `event` 表中，只有 `eid` 字段（主键）是可索引的，这意味着你不能跨数据库中的所有活动进行搜索，以找到在指定地点举行或名称中包含指定词条的活动。\n\
  \n## 高级 FQL\n\n到目前为止，我们所介绍的内容已经足够涵盖使用 Graph 调用所能完成的大部分操作，甚至更多。让我们来看看 FQL 更高级的特性。\n\
  \n## 运算符\n\n与 AS3 中的 `if` 语句一样，FQL 的 `WHERE` 子句既可以使用逻辑运算符，也可以使用比较运算符。\n\n## 比较\n\
  \n我们可以使用数学比较运算符 =、<、>、<=、>= 和 !=。（!= 的另一种写法是 <>，你可能会在网上的示例中看到。）\n\n除了 = 之外，这些运算符的用法与\
  \ AS3 中相同。= 类似于 AS3 中的 ==，用于检查相等性而非赋值。\n\n使用这些运算符最有用的场景，是当你想要过滤掉超过某个年龄的对象时。\n\n\
  ## 逻辑\n\n`AND`、`OR` 和 `NOT` 对你来说应该很熟悉，尽管在 AS3 中我们分别将它们写成 `&&`、`||` 和 `!`。\n\n我们在本章前面已经介绍过\
  \ `IN`；它允许我们检查给定项是否存在于给定列表中。\n\n## 牛刀小试 – 根据地点获取你的活动列表\n\n在本章前面我们了解到，我们不能运行以下查询：\n\
  \n```\nSELECT eid\nFROM event\nWHERE location = 'london'\n```\n\n这是因为 event 中唯一可索引的字段是\
  \ eid。\n\n这里有一种绕过它的巧妙方法：\n\n```\nSELECT eid\nFROM event\nWHERE eid != -1 AND location\
  \ = 'london'\n```\n\n不幸的是，这行不通。Facebook 会告诉你“你的语句不可索引。”唉，算了。\n\n所以，请设计一个查询，搜索当前用户已知道的、在伦敦举行的活动——为此，你需要使用\
  \ event_member 表和 IN 运算符创建一个子查询。\n\n（event_member 表是一个链接表，有两个可索引字段：uid，对应用户；eid，对应活动。）\n\
  \n## 牛刀小试 – 找出不速之客\n\n想要更大的挑战吗？\n\n选择一个拍摄了大量照片的活动。使用 FQL 和 AS3，编写一段代码，接收一个活动 ID\
  \ 和该活动相册的 ID 列表，并输出在相册中被标记但未被邀请参加该活动的人的姓名列表。\n\n## 排序\n\nORDER BY 子句允许我们按特定字段对结果进行排序。例如，你可以像下面几行代码所示，获取你自己的好友列表：\n\
  \n```\n# SELECT name\n# FROM user\n# WHERE uid IN (\n    * SELECT uid2\n    * FROM\
  \ friend\n    * WHERE uid1 = « your User ID »\n```\n\n你可以添加以下新子句，按字母顺序显示它们：\n\n\
  ```\nSELECT name\nFROM user\nWHERE uid IN (\n    SELECT uid2\n    FROM friend\n\
  \    WHERE uid1 = «your User ID»\n)\nORDER BY name\n```\n\n编写 ORDER BY name DESC\
  \ 可按降序排序，或编写 ORDER BY name ASC 按升序排序。默认值为 ASC。\n\n当在 Flash 中检索需要按特定顺序显示的数据时，这非常有用；所有工作都可以在服务器端完成，而不必获取所有数据并用\
  \ AS3 排序。这一点是 Graph 调用无法做到的。\n\n## 分页\n\n与 Graph 一样，分页主要有两种方式：按日期或按数字。\n\n按日期分页使用比较运算符：\n\
  \n```\nSELECT aid\nFROM album\nWHERE owner = «your User ID» AND created < «latest\
  \ date» AND created > «earliest date»\n```\n\n你还可以使用算术运算符（+、-、/、*）来让日期比较更易于阅读：\n\
  \n```\nSELECT aid\nFROM album\nWHERE owner = «your User ID» AND created < «certain\
  \ date» AND created > «certain date» - 10\n```\n\n按数字分页使用 LIMIT 和 OFFSET，就像 Graph\
  \ 调用一样：\n\n```\nSELECT aid\nFROM album\nWHERE owner = «your User ID»\nLIMIT 15\n\
  OFFSET 30\n```\n\n更多关于分页的信息，请参阅第 4 章。\n\n\n\n\n## 一次调用多个查询\n\n如果你知道需要调用不止一个查询，并且这些查询的调用顺序并不重要，你可以通过一个\
  \ API URL 将它们全部调用来提高性能。所有结果将一次性返回。\n\n语法是：\n\n```\nhttps://api.facebook.com/method/fql.multiquery?queries=[\"\
  SELECT x FROM a WHERE c\", \"SELECT y FROM b WHERE d\"]&access_token=«access_token»\n\
  ```\n\n尽管在这个示例中我只使用了非常简单的查询，但你并不限于这些。\n\n## 小测验\n\n+   1. 何时使用 FQL 而不是 Graph API\
  \ 才有意义？\n+      a. 当发布信息到 Facebook 时\n+      b. 当尝试检索特定字段列表时\n+      c. 当尝试了解用户的扩展权限时\n\
  +   2. 何时使用 Graph API 而不是 FQL 才有意义？\n+      a. 当发布信息到 Facebook 时\n+      b. 当尝试检索特定字段列表时\n\
  +      c. 当尝试了解用户的扩展权限时\n+   3. 数据库表中的列和行与 AS3 模型中的对象和属性如何对应？\n+      a. 列像属性，行像对象\n\
  +      b. 列像对象，行像属性\n\n## 总结\n\n在本章中，你从对 FQL 一无所知，到能够使用它进行比 Graph API 更高级的搜索查询。你还了解了一些\
  \ Graph API 不支持的技术，例如如何获取当前用户被授予的扩展权限列表。\n\n要点如下：\n\n+   - 数据库将数据安排成表、列、行和字段\n+\
  \   - FQL 代表 Facebook Query Language\n+   - 提交 FQL 查询的 API URL 为 https://api.facebook.com/method/fql.query?access_token=ACCESS_TOKEN&format=FORMAT&query=FQL_QUERY\
  \ — FORMAT 可以是 json 或 xml\n+   - FQL 查询必须查询可索引字段\n+   - 通过将两张表的名称（不是列！）与线前的动词组合起来阅读实体关系线\n\
  +   - 可以查询权限表以了解经过身份验证的用户被授予了哪些扩展权限\n+   - 表及其列的列表（附带哪些字段可索引的指南）可以在 http://developers.facebook.com/docs/reference/fql/\
  \ 找到\n\n在下一章中，我们将总结本书中迄今为止学到的所有内容，并完成你的应用程序的整体构建。\n\n## 在 Facebook 上\n\n截至撰写时，有三种方式让用户从\
  \ Facebook 网站内访问你的应用程序：在 IFrame 中，通过 FBML，以及在 Page Tab 中。我们将依次介绍这些是什么，以及如何使用它们。\n\
  \n## IFrame\n\n还记得 frames 吗？它们回来了...\n\n在九十年代，每隔一个网站都使用 HTML <frame> 标签来布局页面。这种时尚最终被更干净、更适合书签的方法所取代，并且从未被怀念。\n\
  \n但现在 frames 又在普遍使用——或者更确切地说，它们的姐妹标签 <iframe>。\n\nIFrame，或“内联框架”，允许你将一个完整的网页完全嵌入到另一个网页中，即使这两个页面位于不同的服务器和域中。如果你查看例如\
  \ FarmVille 应用程序页面（http://apps.facebook.com/onthefarm/）的源代码，你会看到情况确实如此，如下一张截图所示：\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_280_0.png)\n\nFacebook 站点上的页面称为 Canvas（不要与\
  \ HTML5 的 canvas 混淆）。\n\n现在，我们已经有一个托管在外部主机上的页面（嵌入了 SWF）：http://host.com/visualizer/index.html。我们不需要对该页面做任何更改即可将其加载到\
  \ Facebook 上的 IFrame 中；设置全部在 Facebook 开发者应用程序中。\n\n## 动手时间 – 设置一个 IFrame 应用程序\n\n\
  浏览到 http://www.facebook.com/developers/apps.php 并在列表中找到你的应用程序。选择它，然后点击 Edit settings。从左侧菜单中选择\
  \ Facebook Integration。\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_281_0.png)\n\
  \n设置可以在上一张截图中看到。以下是它们的含义，以及应如何设置：\n\n+   ♦ Canvas Page：这是用户将在 Facebook 内浏览以加载你的应用程序的\
  \ URL。正如我们上面看到的，FarmVille 使用 http://apps.facebook.com/onthefarm。输入一个简短且描述性的名称；它不必太巧妙，因为用户更可能通过\
  \ Facebook 书签到达该页面，而不是通过输入 URL。你以后可以更改此 URL。\n+   ♦ Canvas URL：这是被加载到位于 Canvas 页面内的\
  \ IFrame 中的页面的 URL。你的应用程序可以包含用户可以在其间导航的多个 HTML 页面；Canvas URL 是将被加载的第一页。将其设置为你的应用程序的\
  \ URL，即 http://host.com/visualizer/index.html。\n+   ♦ Canvas Type：IFrame 或 FBML。我们目前使用\
  \ IFrame；我们将在本章后面介绍 FBML。\n\n## 动手时间 – 将应用程序添加到 Page 标签\n\n要将你的应用程序作为你在管理的 Page\
  \ 上的标签添加，你必须首先将其标记为可以嵌入到标签中。打开应用程序的设置，并导航到 Facebook Integration 部分。在 Page Tabs 子部分中，输入以下内容：\n\
  \n+   - **Tab Name**：要在标签上显示的名称（保持简短）\n+   - **Tab URL**：应用程序网页的文件名，相对于 Canvas URL\n\
  +   - **Edit URL**：留空\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_285_0.png)\n\n\
  接下来，从开发者仪表板浏览到应用程序的 Application Profile Page，并从左侧菜单点击 Add To My Page：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_285_1.png)\n\
  \n> 将添加到我的页面的收藏夹会将应用程序的个人资料链接到你的 Page，而不是应用程序本身。\n\n你会得到一个你控制的 Pages 列表；如果你没有 Page，可以按照\
  \ http://www.facebook.com/FacebookPages 上的说明学习如何创建一个。\n\n但让我们看看当你能够创建它们时，你需要了解有关标签的知识。\n\
  \n从技术角度来看，最重要的点是标签的宽度只有 520 像素，因此在布局你的应用程序及其标签页面时请记住这一点。你甚至可能希望创建一个单独的网页来容纳 SWF——甚至是单独的\
  \ SWF——用于标签内使用。\n\n如果你为一家公司制作了一个广告游戏，并集成了 Facebook 以在游戏中使用玩家自己的名字并让他们将分数发布到他们的 Wall\
  \ 上，你可以将游戏放在该公司 Facebook 页面的标签上，而不是仅使用独立的应用程序页面。\n\nAdobe 就采用了这种方法，使用他们的 Flex 测验游戏\
  \ Cube Builder：\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_287_0.png)\n\n门户可能会阻止\
  \ SWF 从外部站点加载数据，这意味着访问即使是公共 Graph 数据也会变得棘手或不可能。这不太可能——如果完全阻止外部资源，游戏内广告如何工作？——但值得留意。\n\
  \n真正的难题在于身份验证。这有两个原因：\n\n+   ♦ 为了获得访问令牌，我们在 SWF 嵌入的页面内调用一个 JavaScript 函数。但 Flash\
  \ 游戏门户不让我们访问网页的源代码，因此我们无法插入此 JavaScript 函数以运行。此外，门户很可能会阻止 SWF 使用 `ExternalInterface`\
  \ 调用 JavaScript 函数，因为它们可能构成安全风险。\n+   \n+   ♦ 在第 3 章中，我们了解到我们必须将 Site URL 设置为与应用程序主机的基本域名相匹配。如果它们不匹配——比如说，如果你的应用程序位于\
  \ `http://portal.com/games/awesomegame.html` 但 Site URL 设置为 `http://host.com/~`\
  \ Facebook 将不允许用户进行身份验证。这意味着我们不能允许托管在不同门户上的游戏通过同一个 Facebook 应用程序进行身份验证。\n\n因此，很遗憾，Facebook\
  \ 并未为可以从不同站点运行的 SWF 设计其应用程序模型。一个可能的变通方法是导入一个托管在你自己的服务器上的单独 SWF 到主游戏 SWF 中，并让该单独的\
  \ SWF 处理身份验证……但实现这一点超出了本书的范围。\n\n不过，你不必自己做所有这些工作！如果你不需要访问整个 Graph API，而只想能够在用户的\
  \ Wall 上发布消息、检索他们的个人资料信息并获取他们的 Facebook 好友列表，那么你可以使用 Mochi Social Platform。\n\n\
  这是一个由 Mochi Media 提供的免费 ActionScript API，它与 Facebook、Twitter 和 MySpace API 集成，允许你发布到并访问这三个社交网络的数据。它还允许你存储关于玩家的任意数据并将其链接到他们的社交网络个人资料。这意味着你可以存储他们的最高分数、其他统计数据，甚至他们构建的整个自定义关卡。\n\
  \n更多信息，请访问 `http://www.mochimedia.com/developers/social.html`。\n\n## 作为桌面 AIR 应用程序\n\
  \n尽管我们编写的大部分 `HTTPRequestor` 代码在桌面 AIR 应用程序中无需任何更改即可工作，但有一个障碍：身份验证。由于在使用 AIR 时，我们没有嵌入在\
  \ HTML 页面中的 SWF，我们如何显示 Facebook 授权页面、获取访问令牌并将其传递给 AS3 函数？\n\n\n\n\n\n## 行动时间 – 通过\
  \ AIR 使用 HTTP 进行授权\n\n与其将我们的应用程序放在 HTML 页面中，我们必须将 HTML 页面放在我们的应用程序中。为此，我们可以使用 `HTMLLoader`。\n\
  \n`flash.html.HTMLLoader` 类，仅在 AIR 中可访问，是一种 `DisplayObject` 类型，它充当 HTML 内容的容器。我们用它来加载应用程序的\
  \ Facebook 登录页面，就像我们在第 3 章中使用弹出窗口所做的那样。在那一章中，一旦用户登录，弹出窗口就会重定向到另一个页面，将访问令牌作为哈希的一部分传递，而该页面的源代码中的\
  \ JavaScript 会提取哈希并将其传递给 SWF。在 AIR 中，我们的应用程序将使用事件侦听器来检测此重定向，并直接提取哈希。\n\n以下是其分解方式。这些是通用说明，而不是针对\
  \ Visualizer，因此请根据项目需要进行实现：\n\n1. 首先，导入 `HTMLLoader`。\n\n   ```\n   import flash.html.HTMLLoader;\n\
  \   ```\n\n2. 接下来，创建此类的一个实例，并添加事件侦听器以在内容被重定向时触发。\n\n   ```\n   var htmlLoader:HTMLLoader\
  \ = new HTMLLoader();\n   htmlLoader.addEventListener(Event.LOCATION_CHANGE, onRedirect);\n\
  \   ```\n\n   （不要忘记 `import flash.events.Event`。）\n\n3. `HTMLLoader` 默认的宽度和高度为零，这没有用，因为我们需要用户在其中点击按钮！因此，请调整其大小。\n\
  \n   ```\n   var htmlLoader:HTMLLoader = new HTMLLoader();\n   htmlLoader.addEventListener(Event.LOCATION_CHANGE,\
  \ onRedirect);\n   htmlLoader.width = 640;\n   htmlLoader.height = 480;\n   ```\n\
  \n4. 将其添加到显示列表中以便可见。\n\n   ```\n   var htmlLoader:HTMLLoader = new HTMLLoader();\n\
  \   htmlLoader.addEventListener(Event.LOCATION_CHANGE, onRedirect);\n   htmlLoader.width\
  \ = 640;\n   htmlLoader.height = 480;\n   addChild(htmlLoader);\n   ```\n\n5. 加载\
  \ Facebook 授权 URL：\n\n   ```\n   var stageWebView:StageWebView = new StageWebView();\n\
  \   stageWebView.stage = this.stage;\n   stageWebView.viewPort = new Rectangle(0,\
  \ 0, stage.stageWidth, stage.stageHeight);\n   stageWebView.addEventListener(LocationChangeEvent.LOCATION_CHANGE,\
  \ onRedirect);\n   var authURL:String = \"https://graph.facebook.com/oauth/authorize?client_id=<application_id>&type=user_agent&redirect_uri=<redirect_url>\"\
  ;\n   stageWebView.loadURL(authURL);\n   ```\n\n6. 请注意，`StageWebView.loadURL()`\
  \ 方法不需要 `URLRequest`，而是需要一个 `String`。\n\n7. 以与之前相同的方式从哈希中提取访问令牌：\n\n   ```\n   private\
  \ function onRedirect(a_event:LocationChangeEvent):void\n   {\n       var stageWebView:StageWebView\
  \ = a_event.target as StageWebView;\n       if (stageWebView.location.indexOf(\"\
  #\") != -1)\n       {\n           var hash:String = stageWebView.location.substr(stageWebView.location.indexOf(\"\
  #\") + 1);\n           setAccessToken(hash);\n       }\n   }\n   ```\n\n8. 你不能使用\
  \ `removeChild()` 来移除 `StageWebView`，因此使用此方法：\n\n   ```\n   private function onRedirect(a_event:LocationChangeEvent):void\n\
  \   {\n       var stageWebView:StageWebView = a_event.target as StageWebView;\n\
  \       if (stageWebView.location.indexOf(\"#\") != -1)\n       {\n           var\
  \ hash:String = stageWebView.location.substr(stageWebView.location.indexOf(\"#\"\
  ) + 1);\n           setAccessToken(hash);\n           stageWebView.stage.nativeWindow.close();\n\
  \       }\n   }\n   ```\n\n这样就可以工作了！我们只需要做一个小小的调整。在 Android 上，StageWebView 使用 Android\
  \ 操作系统系统网络控件（在桌面 AIR 中，使用内部 AIR WebKit 引擎）。由于我们无法完全控制它，因此我们需要确保它不会做任何意外的操作，例如打开浏览器应用程序。\n\
  \n9. 为此，只要 StageWebView 实例分派 `LOCATION_CHANGING` 事件，就阻止其默认操作（该事件在位置更改前立即分派）：\n\n\
  \   ```\n   var stageWebView:StageWebView = new StageWebView();\n   stageWebView.stage\
  \ = this.stage;\n   stageWebView.viewPort = new Rectangle(0, 0, stage.stageWidth,\
  \ stage.stageHeight);\n   stageWebView.addEventListener(LocationChangeEvent.LOCATION_CHANGE,\
  \ onRedirect);\n   stageWebView.addEventListener(LocationChangeEvent.LOCATION_CHANGING,\
  \ onRedirecting);\n   var authURL:String = \"https://graph.facebook.com/oauth/authorize?client_id=<application_id>&type=user_agent&redirect_uri=<redirect_url>\"\
  ;\n   stageWebView.loadURL(authURL);\n\n   private function onRedirecting(a_event:LocationChangeEvent):void\n\
  \   {\n       var stageWebView:StageWebView = a_event.target;\n       a_event.preventDefault();\
  \  //stop any unexpected default behavior\n       stageWebView.loadURL(a_event.location);\n\
  \       //...but continue loading the URL\n   }\n   ```\n\n## 发生了什么？\n\n使用 StageWebView，你已通过\
  \ AIR for Android 应用程序使用 Facebook 对用户进行了身份验证。由于 URLLoader 实例可以在 AIR for Android\
  \ 中与在常规 SWF 中相同的方式使用，这意味着你现在可以使用 Flash 创建完全集成 Facebook 的 Android 应用程序。\n\n## 试试英雄\
  \ – 修改 SDK 以用于 Android\n\n截至撰写本文时，SDK 使用 `HTMLLoader` 进行 AIR 身份验证，并使用 JavaScript\
  \ 进行 SWF 身份验证，因此无法用于对 Android 应用程序进行身份验证。如果你真的想在 Android 项目中使用 SDK，你就必须自己做一些更改。\n\
  \n为 SDK 添加基于 StageWebView 的登录功能。不要修改现有的 SDK 类文件，而是创建扩展现有类的新类文件——这样，如果你将来更新 SDK，它们就不会丢失。\n\
  \n这是一个棘手的挑战，因为你将修改他人的代码，但如果你想使用 SDK，这也是值得的。\n\n## 选择应用程序的 Facebook 设置\n\n应用程序的设置不仅仅是\
  \ Canvas URL。以下是一些更有趣的选项：\n\n- **Advanced | Deauthorize Callback**：在这里你可以指定一个 URL，每当用户移除你的应用程序时就会调用该\
  \ URL；用户的 ID 将传递给此 URL。为了对该 ID 做些什么，你需要使用服务器端脚本语言——请参阅本章后面的“下一步？”。有关解码信息的更多信息，请访问这里：http://developers.facebook.com/docs/authentication/\n\
  - **About | Developers**：允许你将其他用户设为应用程序的开发者，从而让他们访问应用程序设置。\n- **Advanced | Sandbox\
  \ Mode**：非常适合测试，这将只允许列为该应用程序开发者的用户登录你的应用程序。\n- **Facebook Integration | Bookmark\
  \ URL**：在 Facebook 主页的左侧，你可以看到你使用过的应用程序和游戏列表。这些被称为 **Bookmarks**；设置 Bookmark URL\
  \ 可让你选择这些链接指向的位置。Bookmark 右侧的数字称为 **Counter**，可让用户了解应用程序内的通知和更改。阅读有关 Counters 的更多信息：http://developers.facebook.com/docs/guides/canvas/#bookmarks。\n\
  - **About | Icon and About | Logo**：图标出现在 Bookmarks 旁边以及通过你的应用创建的墙贴下方，而徽标则出现在授权页面和搜索结果中。\n\
  \n![](img/4e826fa36038b86f2087ef8b818d0acf_297_0.png)\n\n![](img/4e826fa36038b86f2087ef8b818d0acf_299_0.png)\n\
  \n缩略图图像使用 Graffiti 绘制，给出了它可以做什么的快速示例。关于段落简洁地概括了应用程序的目的，而描述则增加了一些社会认同：“很多人喜欢这个，所以你可能也会喜欢！”\n\
  \n实际上，页面的很大一部分都是关于社会认同（对于社交网络上的社交应用来说也许并不奇怪）：\n\n- 显示使用该应用程序的朋友\n- 平均用户评分（4.3 分之\
  \ 5）\n- 大量的评论\n\n\n\n\n\n+   - 数百万月活跃用户\n+   - 大量点击过那个**赞**按钮的用户\n\n显然，你对这些没有任何直接控制权！但它们确实在很大程度上影响着人们对你应用或游戏的看法，所以请记住这一点。\n\
  \n## 动手实践——创建你的应用资料页\n\n在 Developers 应用中浏览到你的应用列表，从列表中选择你的应用，然后点击**应用资料页**。\n\n\
  ![](img/4e826fa36038b86f2087ef8b818d0acf_300_0.png)\n\n**开始使用**标签页将引导你完成头像、状态更新和基本信息的设置。记住，你的主要目标是让人们点击**前往应用**按钮！\n\
  \n## 类风湿性关节炎\n\n类风湿性关节炎是一种以关节滑膜慢性炎症为特征的自身免疫性疾病。常表现为对称性多关节炎，可导致关节软骨和骨破坏。\n\n**临床表现**：多见于女性。早期表现为晨僵、关节肿痛，常累及近端指间关节、掌指关节和腕关节；晚期可出现关节畸形。\n\
  \n- 关节外表现：类风湿结节、间质性肺病、血管炎。\n- 实验室检查：类风湿因子阳性、抗CCP抗体阳性、血沉增快、CRP升高。\n\n**诊断**：主要依据临床表现、实验室检查和影像学检查。\n\
  \n| 药物 | 用法 |\n| --- | --- |\n| 甲氨蝶呤 | 7.5-25 mg，每周1次 |\n| 柳氮磺吡啶 | 0.75-3 g/d |\n\
  | 羟氯喹 | 0.2-0.4 g/d |\n\n**治疗**：应尽早使用改善病情抗风湿药，同时注意监测药物不良反应。\n\n> > 早期诊断和规范治疗是改善类风湿性关节炎预后的关键。\n\
  \n## 测试用户\n\nFacebook 政策禁止任何人创建多个用户帐户。不过，现在可以使用 Graph API 创建最多 50 个专门用于测试应用的用户帐户。\n\
  \n更多信息，请参阅 http://developers.facebook.com/docs/test_users。\n\n## 新版消息\n\n2010年11月，Facebook\
  \ 宣布推出备受期待的“Gmail 杀手”——新版消息。该功能允许用户将消息、短信、聊天和电子邮件整合到同一个会话线程中，实现跨平台通信。\n\nGraph API\
  \ 和 FQL 将可通过名为 `/thread/` 的新连接来访问这些消息。\n\n更多信息，请参阅 http://developers.facebook.com/docs/reference/api/thread\
  \ 上的文档。\n\n## Facebook 开发者资源\n\n这里有一些非常适合加入浏览器书签和 RSS 阅读器的优秀网站。\n\n## Facebook 官方资源\n\
  \n- ♦ 所有 Facebook 开发者的核心信息来源是 http://developers.facebook.com/。在这里，你可以访问涵盖 API 各个方面的海量文档，以及（非常活跃的）开发者论坛，在那里可以与他人讨论应用开发。\n\
  - ♦ 你还可以通过平台实时状态页面 http://developers.facebook.com/live_status 查看 Facebook 平台的当前状态。如果你的应用出现问题，而你在自己这边找不到原因，可以查看此页面，了解问题是否出在\
  \ Facebook 一方。\n- ♦ 你还应该了解 Facebook 平台缺陷跟踪系统：http://bugs.developers.facebook.net/。由于平台变更非常频繁，偶尔会出现一些缺陷。这个缺陷跟踪系统可帮助你向\
  \ Facebook 管理员反馈缺陷；它也可以用来确认你遇到的问题是否是常见缺陷。\n\n## 其他优秀网站\n\n整个 InsideNetwork（http://www.insidenetwork.com/）对\
  \ Facebook 开发者来说具有极高的阅读价值。它包括：\n\n- Inside Facebook：http://www.insidefacebook.com/\
  \ – 关于 Facebook 和 Facebook 平台的新闻\n- AppData：http://www.appdata.com/ – Facebook 应用的指标和流量趋势分析\n\
  - PageData：http://pagedata.insidefacebook.com/ – 与 AppData 类似，但针对的是 Facebook 主页而非应用\n\
  - Inside Virtual Goods：http://www.insidevirtualgoods.com/ – 关于虚拟商品的研究、数据和分析（一旦 Facebook\
  \ Credits 公开推出，这将尤其相关）\n- Inside Social Games：http://www.insidesocialgames.com/\
  \ – 关于不断增长的社交游戏市场（包括 Facebook 游戏）的新闻与分析\n\n另一个关于 Facebook 游戏开发的优秀博客是 Facebook Indie\
  \ Games：http://fbindie.posterous.com/。\n\n随着你阅读越来越多的此类网站，你会遇到各种可能不认识的术语和缩写，例如 DAU、MAU\
  \ 和 K 因子。Wavedash.net 提供了一个有用的参考，说明其中许多术语的含义：http://www.wavedash.net/2010/04/the-secret-glossary-of-social-games-analytics/。\n\
  \n博客“Cognition.ca”中关于 Facebook 开发的帖子不多，但其中有两篇我觉得非常有用：\n\n- http://www.cognition.ca/2007/11/using-ssh-tunnels-to-develop-facebook-applications.html\n\
  - http://www.cognition.ca/2008/02/facebook-application-development-how-to-11-tips-you-dont-want-to-miss.html\n\
  \n也请看看后一篇文章的评论。虽然其中有些信息已经过时，但确实有一些很好的建议，比如设置应用测试版本，以免将未经测试的更改推送到线上版本。\n\n在第6章中，我提到过\
  \ Facebook 不允许你通过官方 Facebook 赞按钮以外的任何方式给 Graph 对象（帖子除外）“点赞”。嗯，这不完全正确——Hook 团队似乎已经攻克了这个问题。详情请参阅这篇博文（但请记住，Facebook\
  \ 不希望你这样做，所以无法保证这个方法永远有效）：http://labs.byhook.com/2010/08/03/facebook-like-button-in-flash/。\n\
  \n## 我，我，我\n\n我的网站是 http://michaeljameswilliams.com/。在那里，你可以找到我的 Flash 游戏开发教程博客，如果你有任何问题或想雇用我，也可以与我联系。我在\
  \ Twitter 上的账号是 @MichaelJW。\n\n我也是 http://active.tutsplus.com/ 的编辑，该网站发布包括 Facebook\
  \ 应用开发在内的 Flash 教程。\n\n是的，我在 Facebook 上，但恐怕我不会加你好友——抱歉！我喜欢把好友列表精简为仅限于现实中认识的人。（这是不是有点讽刺？）不过，你可以通过我的公共主页与我联系：http://www.facebook.com/pages/Michael-James-Williams/16957343058884–\
  \ 给我留言，告诉我你对这本书的看法！\n\n## 跟上扎克伯格们的节奏\n\nFacebook 一直在更改和改进其服务。事情总是在变化；作为开发者，你必须应对这一点。\n\
  \n更重要的是，你必须接受这一点。每当 Facebook 宣布新功能、移除旧功能或更改现有功能时，开发者们就会群起抱怨，说这将使他们的应用瘫痪，使他们的进度大幅倒退，并让他们失去大量收入和用户。\n\
  \n大声表达不满没问题，但在某个节点上，这就变成了否认现实。只要你使用 Facebook 网站一段时间，你就会知道，他们乐于进行大规模、彻底的更改——例如推出动态消息（News\
  \ Feed），移除用户主页上的标签页和框（Tabs and Boxes）——并且不顾用户抱怨而坚持到底。而且通常，他们对如何让网站变得更好的直觉是正确的。\n\
  \n因此，API 领域也是如此，这并不奇怪。也许这对开发者不公平，但这不太可能会改变。所以请记住，在构建项目时，如果它过度依赖 Graph API 的某一个单一特性（或\
  \ Facebook 界面，或可用数据），那么你就有被釜底抽薪的危险。请记住与客户商定好定价结构，这样几个月后当他们的项目中的 Facebook 集成代码需要更改时，你不会因为合同而被要求免费来做。\n\
  \n幸运的是，你对 Graph API 的了解基于核心概念，而非具体实现。你理解 Graph 本身，而不仅仅是知道如何复制粘贴与 Facebook 相关的 AS3\
  \ 代码片段。这意味着你将能够应对任何新事物。\n\n## 应对变化\n\n请留意以下两个页面：\n\n- Facebook 开发者博客：http://developers.facebook.com/blog/\n\
  - Facebook 开发者路线图：http://developers.facebook.com/roadmap\n\n该博客会宣布与开发者相关的更改，而路线图则简要总结这些即将到来的更改。\n\
  \n通常，新更改会在实施前几周甚至几个月就公布。通常情况下，你可以在迁移被强制执行之前的某段时间内在应用中启用这些更改，这对测试你需要对代码进行的改动很有用。\n\
  \n现在就去阅读该博客自 2010年11月（本书完成之时）以来的存档，然后订阅它以定期获取更新。这样，你就能保持与时俱进。\n\n## 小结\n\n在本章中，我们探讨了如何从技术问题转向实际问题，以及接下来该何去何从。剩下的就是你去大展身手，创建一些精彩的\
  \ Facebook 应用了！\n\n祝你在开发工作中一帆风顺。我和参与本书的所有人都感谢你的阅读！希望这本书对你有用。如果你开发了任何 Facebook 应用或游戏，请告诉我——我很想看看它们。\n\
