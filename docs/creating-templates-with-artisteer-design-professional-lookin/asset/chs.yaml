  \ |  |\n| 内容可由团队同时插入。 |  |\n\n结论是：做简单网站或需快速完成时，可在 Artisteer 中准备内容再导入 CMS。构建复杂网站且已确定\
  \ CMS 时，直接在 CMS 中输入内容更好，可完全掌控工作。\n\n## 摘要\n\n本章介绍了为 CMS 平台设计模板的方法，讨论了 CMS 驱动网站与静态\
