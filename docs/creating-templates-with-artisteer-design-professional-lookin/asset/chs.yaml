  \ Artisteer 的感觉就像设计师坐在你旁边，倾听建议，即时修改并立即呈现结果。\n\n## 网页开发公司\n\n人们合作的一个主要原因是没有人完美，没有人拥有全部才能。对个人而言，Artisteer\
  \ 似乎是好选择，因为它可让他避免与其它专家合作（可能 costly）并独自完成项目。但对于由不同互补技能人员组成的团队，根本无需此类工具。基于个人经验，我不同意这种想法，理由如下：\n\
  \n- 任何工作或项目的主要成本因素始终是完成工作所需的时间和技能。设计和编程都很耗时，任何自动化都能节省时间和金钱。\n- 网页设计业务中最令人沮丧的是，客户通常不会为未见过的东西付费。有了\
  \ Artisteer，概念的第一阶段可以很快完成。\n\n前面提到的 Artisteer 对各种人群有用的例子，并不意味着所有事情都可以用 Artisteer\
  \ 完成。例如，你无法为网站添加任何逻辑，这需要编程工作。同样对于图形，即使最好的自动化生成器也无法替代真正的艺术家。像其他事物一样，定制手工产品最好，网站也不例外。例如汽车。你是否同意手工打造的豪华轿车或跑车比量产的流行紧凑型车更好？你可能同意，但你有手工跑车吗？每天有数百万人开着廉价紧凑型车通勤，他们很满意。价格是关键因素。网站也一样。\n\
  \n## 10 分钟内制作你的第一个模板\n\n够了，开始动手。像大多数编程书中第一个练习是显示“Hello World！”文本一样，我们将创建第一个“Hello\
  \ World！”模板。开始吧。\n\n该程序有两种版本：Home & Academic 和 Standard，功能不同。Home & Academic 是 Standard\
  \ 的精简版。本书使用 Standard 版。\n\n你可以在生产商网站 `http://www.artisteer.com/?p=downloads` 下载最新版本。两个版本共用一个安装程序，根据你拥有的许可证号激活\
  \ Standard 或 Home & Academic 版。同一安装程序也可安装试用版，让你了解程序并决定是否购买。\n\n试用版没有使用时间限制或功能限制。你可以无限期使用并体验所有功能。试用版与完整版的区别是试用版无法保存项目，且导出的模板会显示\
  \ Trial 水印。\n\n安装过程全自动，若接受许可条款且无需指定安装位置，只需一直点击 **下一步** 按钮直至完成。\n\n要将试用版转为完整版，需要激活。激活需要网络连接。点击欢迎屏幕上的\
  \ **激活** 按钮（也可通过菜单选择 **文件** | **激活**）。你将进入 **Artisteer 激活** 窗口，在 **许可证密钥** 字段输入你的许可证密钥，如下图所示：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_23_0.png)\n\n激活窗口\n\n输入许可证密钥后，点击 **激活**\
  \ 按钮。几秒后，你的 Artisteer 副本将被完全激活。\n\n## 创建新项目\n\n启动程序后，第一个看到的窗口标题为 **新建项目**。这里可选择打开之前保存的项目或新建项目。该窗口主体由三行组成。第一行可筛选可用的预制模板（若想在修改其一的基础上开始）。预制模板在第三行显示，根据你选择的分类和排序规则。\n\
  \n第二行始终只有一个图标。点击它即可从 **空白** 模板开始，从零开始设计样式。\n\n## 认识 Artisteer\n\n窗口右侧列出了最近打开的项目，如下图所示：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_24_0.png)\n\nArtisteer 启动窗口\n\n你可能会说：“等等！你说在\
  \ Artisteer 中我可以设计静态网站，也可以为各种 CMS 设计模板。我在哪里设置我要做什么？”你说得对。而且在 Artisteer 早期版本中，启动窗口有额外字段可设置。但在当前版本中没有此选项。这不是功能限制，而是工作方式的理念变化。你只是在设计，无论后来选择哪个平台。因为你是在最后而不是开始时选择平台。这也突出了\
  \ Artisteer 让你专注于设计而非平台。将设计视为平台无关的东西。\n\n由于我们想从空白模板开始，点击第二行的单独图标。Artisteer 将加载默认数据。接下来的步骤我们将把它变成自定义布局。\n\
  \n> 正如你所见，**空白** 模板并非真正空。它包含一些基本元素和示例内容。然而，这是使用 Artisteer 时最初始的状态，用于从零开始设计模板。\n\n\
  ## 程序界面\n\n下图显示的是 Artisteer 的默认界面。如果你熟悉现代应用，会感到宾至如归。主菜单采用功能区形式（源自 Microsoft Office\
  \ 2007），主选项如 **编辑、颜色和字体、布局、内容、背景、表格、页眉、菜单、区块、垂直菜单、控件 和 页脚** 对应设计布局的主要阶段（我们将在下一章详细讨论）。第一个选项\
  \ **主页** 包含影响整个网站的通用选项。\n\n你对如何开始有点困惑吗？别担心！在使用更高级选项之前，我们将从一个非常简单直观的工具开始：建议模式功能。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_25_0.png)\n\n程序界面\n\n\n\n## 建议工具\n\n\
  建议模式是一个功能，它建议你当前正在处理的元素的外观。因为 **Home** 选项卡指的是整个项目的范围，在此级别使用此功能会建议包含所有依赖元素的整个设计。让我们点击图标。它是黄色灯泡，第一个在左边，标签为\
  \ **Suggest Design**。\n\n整个设计都变了。令人惊叹，不是吗？它不仅仅是从集合中切换到下一个可用的模板。当你点击图标时，Artisteer\
  \ 生成了一个全新的布局，由随机生成的元素组成。你所看到的是独一无二的。如果你不相信，你可以很容易地自己测试。只需重新启动程序并再次尝试。你可能永远不会两次看到完全相同的布局。\n\
  \n反复点击 **Suggest Design** 图标，直到你真的喜欢看到的内容。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_26_0.png)\n\
  \n> 有趣的是，虽然每次都会随机生成新的提案，但 **Undo** 功能工作正常。似乎只要程序运行，就会存储生成的布局的完整历史记录。\n\n## 预览项目\n\
  \n随时你都可以在浏览器中看到项目的实时预览。要实现这一点，请执行以下步骤：\n\n- 1. 点击 **File** 菜单（位于功能区上方）。\n- 2. 选择\
  \ **Preview In Browser** 功能。系统中安装的浏览器列表将会展开。\n- 3. 选择你想要查看项目的浏览器。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_27_0.png)\n\
  \n选择预览浏览器\n\n过了一会儿，所选浏览器将打开，显示项目当前状态。看一下地址栏。你会注意到你看到的是一个真实的 HTML 文件，由程序生成（在系统临时目录中）。这很重要，因为你可以确定你看到的文件与导出项目时生成的文件完全相同。\n\
  \n## 初始自定义\n\n如果你对项目满意，双击 **Enter Site Title** 文本（有时也可能是 **Best Idea** 或其他内容，但它始终是页眉中最大的文本）。你会看到像任何文字处理器中一样的闪烁光标。\n\
  \n删除文本并输入 `Hello World!`。对页眉下方的网站标语执行相同操作，将原始文本替换为 `My first Artisteer template`。键入完成后，只需点击其他任何元素即可应用更改。\n\
  \n在屏幕左侧，你可以看到一个名为 **Pages** 的面板。在那里定义整个网站包含的页面数量和标题。请注意，此面板的内容与项目中的菜单严格相关。默认情况下，每个项目都有两个菜单——一个水平菜单和一个垂直菜单。即使在设计过程中，这两个菜单也非常交互式。例如，如果将鼠标光标移到水平菜单的第一个位置上，它会展开，显示所有包含的子位置。垂直菜单的行为类似，但你必须点击位置才能展开它。\n\
  \n当你点击菜单项时，左侧面板 **Pages** 部分中对应的页面将被选中。该面板以树形形式呈现所有页面。你可以点击 **Home** 页面左侧的小三角形来展开其子元素。你可以观察到，最初\
  \ Artisteer 为两个菜单都创建了两个位置，并且第一个位置包含树形子位置。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_28_0.png)\n\
  \n页面以树形形式呈现，显示项目的结构\n\n小型网站通常只有一个菜单——垂直或水平。如果需要使用两个（或更多）菜单，第一个通常是主菜单，第二个充当其从属菜单，在较低层级显示选项。在我们的第一个项目中不需要两个菜单，所以我们只保留水平菜单。\n\
  \n让我们更改菜单位置的标题以及网站子页面的标题。\n\n在左侧面板中，执行以下操作：\n\n- 1. 第一个页面的名称 **Home** 很好。我们将保持不变。\n\
  - 2. 通过点击左侧的小三角形展开 **Home** 的所有子元素。\n- 3. 右键点击 **Subpage 1** 项目，从内容菜单中选择 **Rename**。标签将被选中，你现在可以删除文本并输入。输入\
  \ `About Me` 并按 *回车*。右键点击 **Subpage 2** 并将其重命名为 `Contact`，如上所述。\n- 4. 右键点击 **Subpage\
  \ 3**，从内容菜单中选择 **Delete**。在确认对话框中选择 **Yes**。\n- 5. 将 **Blog** 重命名为 `My Blog`。\n\n\
  你的项目结构现在应如以下屏幕截图所示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_29_0.png)\n\n更改后我们项目的结构\n\
  \n菜单的结构也根据我们所做的更改而发生了变化。\n\n水平菜单应如下屏幕截图所示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_29_1.png)\n\
  \n水平菜单立即呈现页面的当前结构\n\n现在，点击功能区上的 **Vertical Menu** 组并点击 **Position**。一个包含垂直菜单可能显示位置的列表将会展开。垂直菜单显示为填充的正方形。让我们选择第一个名为\
  \ **No Block** 的选项。此选项根本不显示垂直菜单：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_30_0.png)\n\
  \n我们将垂直菜单设置为不显示\n\n好的，我们完成了第一个设计。它没有花超过10分钟，对吧？如果是这样，再试一次。当你知道自己在做什么时，我相信你这次可以更快完成。\n\
  \n## 保存项目\n\n你应该归档每个项目（因为你知道 Artisteer 项目不仅包含设计，还包含内容，我们应该称其为项目而不是仅仅是模板）。这个简单的原则听起来可能很平常，但遵循它的理由很多，如下所示：\n\
  \n- 无论你是为自己还是为他人做项目，迟早都需要修改它\n- 你或你的客户可能会决定更改 CMS 平台（但不更改设计）\n- 你的服务器可能会损坏或被攻击\n\
  \n在所有讨论的情况下，拥有作品的副本以修改或恢复网站是合适的。实现这一目标最简单（我认为也是最好的）方法是使用 Artisteer 原生二进制格式保存项目。没错。虽然\
  \ Artisteer 将模板生成为一组 HTML/CSS/JavaScript/PHP 文件（或一个 ZIP 压缩包），但它也有自己的原生二进制文件，扩展名为\
  \ `.artx`。这些文件包含项目设计及其内容的所有组件。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_31_0.png)\n\
  \n> 你可以把它想象成在 MS Word 中编写文档的类比。文档的最终形式是打印出来的纸张，但你可以以 MS Word `.docx` 文件的形式保存和归档文档。然后你可以在任何时候将\
  \ `.docx` 文件加载到 Word 中，修改它，再次打印它。打印纸张很难更改——只能手工用铅笔更改。Artisteer 和导出的网页也是同样的情况。你可以随时打开\
  \ `.artx` 文件，做出一些更改，再次导出模板，但更改导出的文件只能通过手动编码来实现。没有办法逆转导出过程并将导出的模板重新导入到 Artisteer\
  \ 中。也不可能例如从 `drupal.org` 取一个模板并导入到 Artisteer 中进行编辑。\n\n要保存项目，请点击功能区快捷菜单上的图标，或展开\
  \ **File** 菜单并选择 **Save** 或 **Save As...** 选项。然后输入项目名称，设置文件目标位置（默认保存路径为 `C:\\users\\\
  YourUser\\Documents\\Artisteer Templates`），并点击 **Save**。\n\n请注意，Artisteer 在启动时显示最近项目的列表；因此下次启动\
  \ Artisteer 时，你会看到项目在列表中。\n\n如我之前提到的，如果你选择以 HTML 文件的形式存储项目，你就无法再用 Artisteer 打开和编辑项目，并且必须手动编码所有可能的修改。即使你很好地理解如何操作，你也可以确定手动编码比使用\
  \ Artisteer 需要花费更多的时间和精力。选择原生文件用于归档还有一个原因。`.artx` 文件独立于 CMS 平台。假设你用 WordPress 运行网站并想将其移植到\
  \ Joomla!（或反之亦然）。没问题，你只需打开 `.artx` 文件并再次导出，选择 Joomla! 作为目标。如果只有导出的模板文件，要进行这样的迁移，你需要重新编码整个模板。当然，这里我们跳过了你在更复杂的项目中工作的情况，在该项目中\
  \ Artisteer 仅用作中间工具，导出的模板会进一步修改以添加一些额外功能。但在这种情况下，我相信你会决定归档所有可能的东西，例如 `.artx` 文件、源图形文件、read\
  \ template 等等。\n\n\n\n## 导出模板\n\n现在我们已经设计并保存了项目，是时候导出它了。要导出项目，请点击功能区快捷区域中的 **Export**\
  \ 图标，或从菜单中选择 **File | Export | Website Template**。我们将以 **Website Template** 的形式导出项目。这意味着它将是一个静态的普通网站，不由任何\
  \ CMS 系统驱动。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_32_0.png)\n\n导出项目\n\n如以下屏幕截图所示出现的窗口中，我们需要设置一些参数：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_32_1.png)\n\n在导出窗口中，您设置导出参数\n\n- **Template**：这是一个可以更改为所需导出模板类型（CMS\
  \ 系统）的字段。我们保持原样，使用 **Website Template**。\n- **Export to:** 这是一个字段，您可以在其中确定是否要将其导出到\
  \ **Local**（作为硬盘上的文件）或 **FTP**（直接传输到您的 Web 服务器）。我们希望将其导出为 **Local**。\n- **Folder\
  \ Name:** 这是将会创建的文件夹名称，也是所有模板文件将被保存的位置。此名称不能包含空格和命名文件夹时禁止使用的字符（例如 \\、/、? 等）。让我们删除默认值（**Untitled**）并输入\
  \ `myFirstTemplate`。\n- **Path:** 这是创建文件夹的导航路径。点击浏览图标并选择您的桌面。\n\n> 尽管 Windows 不区分大小写，Linux\
  \ 却区分，而您的 Web 服务器很可能运行在 Linux 上。命名文件夹时，请注意输入的名称大小写。\n\n下面还有两个附加选项：\n\n- **ZIP archive:**\
  \ 如果勾选此复选框，模板将不会保存在新文件夹中，而是作为 ZIP 压缩包保存，名称为你在 **Folder Name** 字段中输入的名称。此选项应为大多数\
  \ CMS 勾选。由于我们目前不导出到任何 CMS，因此我们保持此选项未勾选。\n- **Include ARTX Project:** 如果此选项被勾选，二进制\
  \ Artisteer 项目文件将与其他模板文件一起保存。我建议你保持未勾选，因为我们已经保存了项目。\n\n> 大多数 CMS 都提供通过其管理面板上传的 ZIP\
  \ 压缩包形式的模板安装功能。如果你为 CMS 导出，你很可能会勾选此选项。\n\n## 删除页脚注释\n\n在点击 **Export** 按钮之前，我们导航到\
  \ **Options**（点击该按钮）。默认情况下，Artisteer 会在页脚插入一条注释，说明此模板是用 Artisteer 创建的。由于这是 Extensoft（Artisteer\
  \ 的生产公司）的巧妙营销手段，在大多数情况下你不会想包含此类信息。\n\n在 **Options** 窗口中，点击左侧最后一项（**Footnote**）并取消勾选\
  \ **Include a backward link to the Author** 和 **Include backward links to the CMS\
  \ and the Artisteer** 选项，如以下屏幕截图所示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_34_0.png)\n\
  \n从页脚中删除关于 Artisteer 的注释，即 Created with Artisteer\n\n点击 **OK** 返回到上一个窗口，然后点击 **Export**\
  \ 导出模板。过了一会儿，进程将完成，你将在桌面上找到一个新文件夹：`myFirstTemplate`。\n\n恭喜！你刚刚在 Artisteer 中设计、保存并导出了你的第一个模板。打开此文件夹并双击\
  \ `index.html` 文件。过了一会儿，你将在默认浏览器中看到你的网站。\n\n## 摘要\n\n在本章中，你了解了 Artisteer 是什么类型的工具，它在其他软件工具中的位置，以及它如何对不同用户群体有用。你现在知道如何创建新项目，使用\
  \ Suggestion 工具修改它们，并将它们导出为可工作的 HTML 网站。\n\n你还知道如何从页脚中删除 **Created with Artisteer**\
  \ 注释，以及如何将项目保存为 Artisteer 原生文件，以便进一步修改和备份目的。\n\n现在，你准备好了解使用 Artisteer 设计模板的细节了。\n\
  \n# 2 模板逐步讲解\n\n# 2 模板逐步讲解\n\n在上一章中，我们讨论了 Artisteer 的一些总体特性。到目前为止，你已经了解了该软件的用途，并对它的界面和工作方式有了一些经验。\n\
  \n现在我们将一起准备一个模板。我将带你完成所有步骤，从开始到结束。本章结束时，你将拥有一个完整的模板，可以直接用于你的网站或根据需要进行修改。这将是一个静态网页的模板。\n\
  \n## 模板\n\n在开始创建模板之前，我们必须先定义模板到底是什么。\n\n一个 **template** 是网站的通用元素集合。你可能会问，什么是网站？一个\
  \ **website** 是关于某一特定主题的逻辑连接的网页集合。当我们谈论公司网站时，主题就是公司。对于个人网站，主题就是网站所关于的人，等等。\n\n当然，你可以为每个子页面单独设计，每个页面采用不同的设计。虽然这可行，但这种解决方案会有几个严重的缺点。如下所列：\n\
  \n- 如果页面没有一致的设计和布局，访客可能会觉得被重定向到另一个网站而感到迷失\n- 如果每个页面都有不同的、单独的菜单，位于不同的位置，在页面之间导航会很困难，访客不得不专注于如何导航而不是内容\n\
  - 网站整体上不会看起来统一\n\n为了避免此类缺点（并且不让访客感到困惑），我们必须让所有子页面看起来相似。这是通过使用相同的图形元素（例如每个子页面上的公司标志）和相同的（或不同但在某种程度上一致的）布局来实现的。\n\
  \n但说所有子页面唯一应该共有的元素只是公司标志（对于公司网站而言）是不够的。网站中可以区分出许多作为共同部分的元素的组合。所有这些元素的组合就是一个模板。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_36_0.png)\n\n> 你可能会觉得使用模板限制了设计师的创造力并降低了特定子页面的个性。虽然这是真的，但请记住，目标是创建一个好的网站，而不是单个子页面。而设计师的挑战是创建一个好且有个性的模板。你可以把它与汽车相比：所有汽车都有很多共同点。汽车都有四个轮子、驾驶员和乘客的空间、发动机、后备箱等等。但它们都长得一样吗？当然不是。现在想想保时捷的不同车型。它们看起来足够相似以让每个人都知道那是保时捷吗？我认为是的。这会让保时捷变得丑陋、不吸引人吗？嗯，我不介意开一辆！\n\
  \n## 网站的共同部分\n\n是时候尝试区分网站的共同部分了。我们将把它们分为元素和属性。\n\n元素是网站中独立存在的部分。我的意思是你可以替换它们，而这些更改不会影响网站的其余部分。元素的例子是页脚或菜单。你可以更改页脚的外观（颜色、字体或边框），但这不会影响菜单或其他任何元素。\n\
  \n属性是影响整个网站（所有元素）的东西。属性的例子是页面宽度。如果你决定让网站更宽或更窄，你可能需要重新设计所有元素以适应新的空间。想想前面提到的页脚。页脚通常与整个页面一样宽。如果你让网站更宽，你也必须让页脚更宽。\n\
  \n\n\n## 元素\n\n元素列表可能因具体网站而异，但总体上我们可以将其区分。\n\n### 页眉\n\n页眉是标识网站的容器。它通常与整个页面一样长，位于页面的顶部。它也是你在阅读页面时看到的第一个元素。根据网站的主题，页眉内部包含其他元素，例如公司网站上的公司标志（在公司网站上）、作者照片（在博客中）、标语、产品图片或指代内容的图像。页眉还可以包含一些附加元素，例如语言标志或联系数据。\n\
  \n### 水平菜单\n\n如果页面有水平菜单，它通常位于页眉正下方或页脚上方。它是一个导航元素，包含指向其他页面的链接。\n\n### 垂直菜单\n\n垂直菜单是导航元素，通常位于页面的左侧或右侧。与水平菜单一样，它包含指向其他页面的链接。\n\
  \n### 内容区域\n\n内容区域是阅读内容（从页面获取的信息）的地方。它可能包含文本、图片、画廊、电影、表格、论坛、链接以及可在网站上发布的任何其他类型的信息。内容区域是页面中主要且最大的部分。\n\
  \n### 特殊区块\n\n特殊区块包括某些页面可能需要的附加元素，并且出现在所有（或几乎所有）子页面上，例如登录表单。\n\n> 元素与内容之间的划分相当模糊，在特定情况下可能有所不同。我们试图列出适用于整个网站的常见元素（它们出现在所有子页面上）。根据你的设计，相同的信息有时是元素，而有时只是内容。例如，考虑电话号码。如果你将其写在联系页面中，内容区域内，它就是内容。但你也可以认为这是非常重要的一条信息，希望在每个页面上都以特殊的联系区块或甚至在页眉中显示。在这种情况下，它将成为元素。网站上的信息既是内容又是元素的情况也不少见。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_38_0.png)\n\n### 页脚\n\n页脚是页面的最后一个元素。它通常包含版权信息。它还可能包含底部菜单、一些附加信息以及指向网站管理员的反向链接。\n\
  \n## 属性\n\n属性是适用于整个页面的特征。通常我们可以将其区分如下：\n\n### 页面宽度\n\n你可以用许多设备浏览互联网：我们有台式机、笔记本电脑、上网本、平板电脑、智能手机等等。这些设备都有不同的屏幕尺寸和分辨率。这意味着布局尺寸很重要。你的网站应该尽可能在各种不同的设备上正确显示。这通常会导致妥协。你不应该设计页面过宽（看起来不错，但仅适用于拥有新高端显示器的访客），而应为更广泛的受众准备，并为使用旧硬件的人准备。这就是为什么布局通常居中，周围留有空白或背景。\n\
  \n首先关注的是宽度。高度并不那么重要，因为你可以用鼠标滚动网站而不会破坏阅读流程，而水平滚动则很费力。尽管如此，你也不应完全忽视高度，尤其是在设计页眉时。如今，屏幕越来越宽广，如果访客只能看到页眉，那就不好了。\n\
  \n### 排版\n\n排版是一组出现在页面上的字体及其样式。你应避免在不同子页面上使用不同的字体。相反，每个子页面上的内容都应使用相同、一致的字体。想象一下阅读一本书，其中每一页都用不同的字体印刷。你不会认为它很专业，对吧？根据内容的复杂程度，你至少必须定义标题（标题）、段落（正文）和超链接的字体。如果你的内容更复杂，你可能需要更多标题层级、表格标题、表格内容、引用等等。此外，你也不应忘记行间距和边距。排版是设计的重要组成部分，可以极大地改善或破坏最终效果。\n\
  \n### 颜色\n\n所有元素的颜色（其边框、背景等）应以创造一个连贯整体的方式选择。我们将这组颜色称为配色主题。配色主题是任何设计中非常重要的因素，因为它可以定义整个网站的氛围。设计的合适配色主题就像歌曲的合适节奏。\n\
  \n### 布局\n\n布局是页面所有元素的排列。谈论布局时，我们谈论布局通常包含的列。一列是页面的垂直部分，可以包含垂直菜单、特殊区块或内容区域等元素。列通常位于页眉和页脚之间。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_39_0.png)\n\n你可以说每个布局都有 *至少* 一列。即使看起来布局根本不包含任何列，实际上它是一个单列布局。\n\
  \n> 每个布局至少有一列。\n\n请记住，当我们谈论布局列时，我们不是谈论文本列（在报纸中，文本分为几列），而是谈论页面的独立区域（容器），你可以在其中放置元素。如果一列包含内容区域，内容本身可以分为多列，但根据我们的定义，这仍然是一列。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_40_0.png)\n\n我们可以区分三种典型的布局。\n\n### 单列布局\n\
  \n单列布局通常用于博客、个人网站和简单的公司网站。单列布局仅包含一个水平菜单。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_40_1.png)\n\
  \n### 双列布局\n\n双列布局是最受欢迎的。第一列通常包含垂直菜单，而第二列用于显示内容区域。\n双列布局可以包含垂直菜单、水平菜单或两者。\n如果双列布局仅包含水平菜单，则侧列用于附加区块，例如登录框。下图显示了左侧有垂直菜单的双列布局：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_41_0.png)\n\n下图显示了右侧有垂直菜单的双列布局：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_41_1.png)\n\
  \n### 三列布局\n\n三列布局通常用于更高级的网站。它由两个侧列（通常为左右）和中间的一个大列组成。侧列包含各种特殊区块，中间列显示内容。三列布局的示意图如下：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_42_0.png)\n\n## 创建模板\n\n现在我们将准备我们的第一个布局。我们将一起一步一步地完成，并解释我们所经历的每一步。但在开始之前，请让我先解释一下我们将要实现的目标。\n\
  \n我们将准备一个宣传你作为网页设计师的网站。网站的结构在下图中显示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_42_1.png)\n\
  \n如你所见，我们的网站将由八个页面组成。第一个页面（在图中略高于其他页面绘制）是主页。这是访客来到我们网站时看到的第一个页面，也是我们必须设计的第一个页面。逻辑上，它与第一行的其他页面处于同一级别。第二行显示服务页面的子页面。对于我们的项目，我们将创建一个双列布局，左侧的第一列显示垂直菜单和包含联系信息的区块。我们的网站还将有一个水平菜单。准备好了吗？如果是，请在启动屏幕上启动\
  \ Artisteer，点击 **空白** 模板，然后跟随本章的下一部分！\n\n不幸的是，在 Artisteer 中，你无法设置一个菜单作为另一个菜单的子菜单。你也不能决定菜单应在哪些页面上显示。两个菜单都显示在所有页面上。你能做的只是决定哪些页面应在哪个菜单上显示（在你将新页面添加到项目后，它会立即出现在两个菜单中，但你可以随后排除某些页面）。在我们的项目中，理想的解决方案是让我们的垂直菜单充当水平菜单的子菜单，并且只显示我们服务的页面。此菜单应仅在水平菜单中选择服务页面时可见，并在所有其他页面上不可见。遗憾的是，我们无法实现这一点。让我们希望\
  \ Artisteer 的下一个版本能扩展此类可能性。由于我们不能这样做，我们将设计两个菜单，然后你可以决定你更喜欢使用哪一个以及应该删除哪一个。我们还将准备一个折中方案，你在这种情况下也可能觉得可以接受。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_43_0.png)\n\n> 使垂直菜单充当子菜单是可能的，但它需要手动更改导出的代码。在第\
  \ 4 章，技巧与窍门中，你可以找到如何操作的描述。\n> \n> 幸运的是，使用任何旧的受支持的 CMS 平台时，此限制完全不重要。\n\n\n\n首先，我们的模板看起来像这样：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_44_0.png)\n\n我们现在位于功能区的第一个选项卡，名为 **Home**。它包含\
  \ **Design Ideas** 区域、**Website** 和 **Export**。在 **Design Ideas** 中，你可以找到 **Suggestion\
  \ Tool** 的不同范围。最左边的第一个按钮是 **Suggest Design**，它会为整个设计生成自动建议。接下来几个按钮，**Suggest Colors**、**Suggest\
  \ Fonts**、**Layout**、**Background** 和 **Styles** 会生成自动建议，改变页面对应部分的外观。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_45_0.png)\n\
  \n> 功能区上的选项卡将功能按逻辑与选项卡名称关联。例如，**Background** 选项卡上的所有按钮都适用于页面的背景。第一个选项卡 **Home**\
  \ 是父选项卡。\n> \n> 还有一个规则是，每个选项卡上的第一个按钮始终是适用于该选项卡元素的 **Suggestion Tool**。\n> \n> 有时同一个功能会在不同的选项卡上出现。这是因为某些按钮在逻辑上适用于多个选项卡。例如，**Layout**\
  \ 选项卡上的 **Sheet Width** 和 **Sheet** 选项卡上的 **Width** 按钮是相同的。设置页面宽度同样适用于 **Layout**\
  \ 和 **Sheet**，因此 Artisteer 的作者决定将此选项放在两个选项卡上。\n\n其他按钮用于添加和删除页面和博文、插入特殊区块，以及快速导出模板。\n\
  \n## Layout\n\n在设计新网站时，我们首先应该设置的是其宽度。如果你有兴趣创建网页，你可能拥有一台大屏幕、分辨率良好的显示器。但我们必须记住，并非所有访客都有如此好的硬件。Artisteer\
  \ 生成的所有模板都是居中的，而且几乎所有现代浏览器都允许你自由缩放页面。让部分访客放大网站，远比让其他访客在阅读时使用水平滚动条要好。\n\n你选择的分辨率将取决于网站的目标受众。通常，私人电脑的参数比公司里仅用于办公的典型\
  \ PC 更好。因此，如果你设计一个网站，你知道它主要会被私人用户浏览，你可以选择比典型的商业网站稍宽的布局。但你不能忘记，许多非商业网站，例如社区网站，通常也是在办公室访问的。\n\
  \n那么答案是什么呢？在我看来，宽度为 1,000 像素的布局对于大多数情况仍然是一个不错的选择。这种宽度可确保网站在相当老旧但仍被广泛使用的非宽屏 17 英寸显示器上正确显示。\
  \ （该硬件的典型分辨率为 1,024 x 768，这种布局将填满整个屏幕。）随着越来越多用户开始使用配备更好屏幕的电脑，你可以考虑将分辨率稍微提高，例如到 1,150\
  \ 像素。记住，并非每个用户都使用台式机访问你的网站。许多笔记本电脑，尤其是上网本和平板电脑，也没有宽屏。\n\n> 记住，页面的宽度必须略低于屏幕的总分辨率。你应该为垂直滚动条预留一些空间。\n\
  \n我们将传统地把项目的宽度设置为 1,000 像素。要做到这一点，请点击功能区上的 **Layout** 选项卡，然后点击 **Sheet Width** 按钮旁。\
  \ 从列表中可用的选项中选择 **1000 pixels**。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_46_0.png)\n\
  \n**Sheet Options** 窗口分为两个区域：左侧你可以从以像素表示的值中选择，而右侧则以百分比表示。百分比值意味着页面没有固定的宽度，但它会根据页面显示的屏幕参数而变化（根据所选的百分比值）。使用宽度以百分比定义的布局似乎是个好主意；事实上，这种技术如果正确使用，可以带来很好的效果。但你必须记住，在这种情况下，所有页面元素都必须类似地准备好，以便能够适应网站动态变化的宽度。用固定值（以像素表示）实现良好的布局结果要简单得多。\n\
  \n在使用 Artisteer 时有一个常见规则：点击功能区上的按钮后，你会得到包含最常用的标准值的列表。但是，如果你需要自定义值，你可以点击列表底部的按钮，进入一个窗口，在那里你可以自由设置和选择所需的值。例如，在选择布局宽度时，点击位于列表正下方的\
  \ **More Sheet Widths...** 按钮，将带你进入一个窗口，在那里你可以以 1 像素的精度设置所需的宽度。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_47_0.png)\n\
  \n我们可以以三种方式设置所需值：\n\n- 我们可以点击字段右侧的上下箭头。\n- 我们可以将鼠标光标移到字段上并使用出现的滑块。\n- 我们可以点击字段。文本光标会出现。然后我们可以使用键盘输入所需的值。对我来说，这是最舒适的方式，尤其是因为滑块的最小进度超过\
  \ 1。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_47_1.png)\n\n## Panel mode versus\
  \ windows mode\n\n如果你仔细观察显示的窗口，你会在右下角看到一个面板模式按钮。此按钮在面板模式和窗口模式之间切换 Artisteer 的界面。在窗口模式下，高级设置以窗口形式显示。在面板模式下，高级设置显示在\
  \ Artisteer 窗口右侧的侧面板上。如果你使用的是宽屏，你可能会发现面板模式更舒适。其优点是侧面板不会遮挡项目中的任何内容，因此你有更好的视野来观察更改。这种更改是持久的，如果你切换到面板模式，所有高级设置都将显示在右侧面板中，直到你决定返回窗口模式为止。要反转，请找到并点击侧面板右上角的图标（就在关闭面板的\
  \ x 按钮旁边）。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_48_0.png)\n\n## Columns and\
  \ their content\n\n使用 Artisteer 设计模板时，下一步通常是决定布局应包含多少列。在我们的项目中，我们将使用两列布局，较大的列用于内容，另一列较窄，位于左侧。在这一列中，我们希望显示一个垂直菜单并放置一个包含联系信息的区块。这两个元素将显示在所有页面上。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_48_1.png)\n\n> 当你向项目添加特殊区块时，它会显示在每个页面上。不幸的是，你无法排除区块在特定页面上的显示。因此我们必须选择在每个页面上显示都有意义的区块。\n\
  > \n> 幸运的是，当你为 CMS 设计时，这一限制无关紧要。\n\n我们首先设置列数。点击功能区 **Layout** 选项卡上的 Columns 按钮。从可用选项中选择一个具有两列且较窄的一列在左侧的选项。\n\
  \n现在看看左侧列的内容。有一个垂直菜单和一个搜索区块。我们希望那里有一个垂直菜单，但我们没有计划搜索区块。我们必须删除此区块并替换为一个展示我们联系信息的区块。请执行以下步骤：\n\
  \n1. 将鼠标指针移到搜索区块上。根据指针的位置，Artisteer 会突出显示区块内的各种元素。将鼠标指针稍微放在区块标题下方，以使程序框住整个区块。\n\
  2. 在区块的右上角，你会找到两个图标。第一个看起来像灯泡，用于启动 **Suggestion Tool**，其范围仅限于边框内的元素。第二个看起来像带红色叉号的列表，会从项目中删除边框内的所有元素。如果你点击该图标，整个区块就会消失。你需要在\
  \ Artisteer 显示的确认对话框中确认你的决定，以确保你不会误删任何内容。\n3. 点击 **New Block** 按钮（我们仍在 **Layout**\
  \ 选项卡中）。Artisteer 会在垂直菜单下方放置一个全新的区块：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_49_0.png)\n\
  \n现在我们必须更改新区块的标题并在其中写入一些内容。请执行以下步骤：\n\n1. 点击区块的标题（**New Block**）并使用键盘删除 `Block`\
  \ 文本。然后输入新标题：Contact。\n2. 在下方稍微点击一下（边框会显示位置）并输入你自己的联系信息：电话号码和电子邮件地址。\n\n完成所有更改后，你的新区块应类似于以下内容：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_49_1.png)\n\n\n\n我们新区块内更改文本的方式是 Artisteer\
  \ 中编辑内容的标准方式。程序到 2.6 版本时，内容编辑是不可能的。从 3.0 版本开始，你可以在项目的各个页面上自由编辑内容。从 4.0 版本开始，这不仅适用于\
  \ HTML 模板，在为 CMS 设计时也同样可行。内容可以与设计一起导出并导入到 CMS 中。\n\n注意在你编写内容时，功能区会自动切换到编辑标签页，在那里你可以找到典型的编辑功能。在这里，例如，你可以设置字体、对齐方式，并插入图片或表格。用于表示各种选项的符号与你在任何流行文字处理软件中找到的符号相似——如果你有\
  \ MS Word 的使用经验，这将会非常直观。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_50_0.png)\n\
  \n## Colors\n\n默认的空白项目为白色。在开始设计模板的各个元素之前，我们将通过选择蓝色中的一个可用主题来更改配色主题。为此，请按照以下步骤操作：\n\
  \n- 1. 在功能区上选择“颜色和字体”标签。\n- 2. 单击“配色主题”按钮。\n- 3. 在列表中找到“天蓝”组，并选择“深度”主题。\n\n> 也许你已经注意到\
  \ Artisteer 在动态显示更改结果时，不仅在你选择一个选项（即配色主题）之后，也会在你将鼠标指针移动到各个选项上时显示。\n\n## Background\n\
  \n选择配色方案后，是时候设置我们网站的背景了。选择功能区上的“背景”标签以查看可用选项。\n\n开始时，我们必须决定背景应该是纯色、渐变、纹理还是图片。有些选项互斥，而有些可以共存。它们之间的关系在下图中显示：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_51_0.png)\n\n如果为背景设置颜色，并不排除使用渐变。但纹理和图片的同時使用是不可能的。如果希望背景为纯色或渐变，你必须在“图片或图像”列表中选择“无纹理”。否则，所选图片或纹理将覆盖所选颜色。\n\
  \n工具的最后一组包含“光效”，它为背景添加一种类似光晕的细腻效果。光效组的选项与颜色和渐变以及纹理和图片相关。\n\n对于我们的项目，我们将设置一个带渐变的彩色背景。单击“填充颜色”按钮，并从“主题颜色”列表中选择第二行从左数第三个颜色。然后单击“渐变”按钮，并在“从浅到深”组中选择第二行从左数第一个选项：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_51_1.png)\n\n对于光效，选择“经典”组中的第一个选项。\n\n\
  ## Pages\n\n我们现在应根据方案向项目中添加页面。我们必须删除 Artisteer 默认插入的页面，并用我们的页面集替换它们，保持它们之间的关系。你可以使用左侧的侧面板来管理页面。\n\
  \n### Adding, removing, and renaming the pages\n\n第一步我们将删除冗余页面。如果你查看“页面”面板，你会看到第一页包含两个子页面。但在我们的项目中（再次查看方案），第一页不包含任何子页面。我们将删除这些子页面，因为我们不需要它们。请按照以下步骤操作：\n\
  \n- 1. 单击 Page 1 左侧的小三角形符号以展开其子页面（另一种方法是直接双击页面名称）。\n- 2. 右键单击 Page 3 并从上下文菜单中选择“删除”（你也可以通过单击左键选择页面并按键盘上的\
  \ Delete 键）。\n- 3. 对 Page 1 的所有子页面重复此操作以删除它们。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_52_0.png)\n\
  \n> 单击鼠标一次可选择一个页面，但如果所单击的页面已被选中，则单击一次鼠标用于重命名它。\n\n现在我们将添加缺失的页面。我们的项目假设顶层有四个页面，因此我们需要再添加两个页面：\n\
  \n- 1. 右键单击 Page 2 并从上下文菜单中选择“新建页面”。Artisteer 将添加一个新页面并将其命名为 Page 3。该页面的名称将被高亮显示以便你重命名它。\n\
  - 2. 输入 Offer 并按 Enter。同样地，添加 Contact 页面并通过从“重命名”上下文菜单中选择来重命名前两个页面。你应该拥有以下页面：Home、About\
  \ Me、Offer 和 Contact。\n- 3. 右键单击 Offer 页面并从上下文菜单中选择“新建子页面”。将新子页面命名为 Websites。类似地添加其他缺失的子页面。\n\
  \n### Page properties\n\n好的，我们的项目现在包含了我们想要的所有页面。你可以观察到所有页面都显示为两个菜单中的项目（水平菜单默认通过悬停展开，而垂直菜单通过单击展开）。我们已重命名页面，但我们赋予它们的名称并不是导出过程中将生成的文件的名称，而只是菜单中显示的名称。\n\
  \n> 你在 **Pages** 面板中看到的页面名称是菜单中显示的名称。它既不是将生成的文件的名称，也不是将在浏览器中显示的页面标题。这些参数必须在 **Properties**\
  \ 窗口中定义。在此窗口中，我们还可以定义页面应显示在哪个菜单中。\n\n让我们为 **Home** 页面定义属性：\n\n- 1. 在 **Pages** 面板中，右键单击\
  \ **Home** 页面，并从上下文菜单中选择 **Properties**。它将显示 **Properties** 窗口。\n- 2. 确保 **General**\
  \ 选项卡（窗口左侧列表中）处于活动状态。\n- 3. 在 **Name/URL** 字段中，输入：`index`。\n- 4. 在 **Title** 字段中，输入：`Welcome\
  \ to my page`。\n- 5. 单击 **OK** 按钮关闭窗口。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_53_0.png)\n\
  \n**Name/URL** 字段定义导出过程中将生成的文件的名称，该名称会出现在浏览器的地址栏中。因为它是一个文件名，所以不能包含文件名中禁止的字符（例如“?”）。此外，它也不能包含任何空格。如果所需名称由两个或多个单词组成，可以使用“-”字符代替空格（例如，对于我们的\
  \ **About Me** 页面，一个好的名称将是：`about-me`）。请记住 Linux 是区分大小写的（在大多数情况下，你的托管账户所在的服务器由 Linux\
  \ 驱动），因此为了避免任何麻烦，最好只使用小写字母的做法是良好的实践。\n\nTitle 字段包含在浏览器窗口（以及浏览器标签页）中显示的页面的标题。在此字段中，你可以使用任何字符。此标题也由搜索引擎显示，例如\
  \ Google、Bing 和 Yahoo!。正如你所见，这是一个重要的属性。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_54_0.png)\n\
  \n> 对于大多数 Web 服务器而言，当未指定特定文件时显示的默认文件是 index.html 或 index.htm。这就是为什么你应该在网站主页的 Name/URL\
  \ 字段中插入 index。Artisteer 将生成此页面作为 index.html 文件。得益于此，当访客仅在浏览器地址栏中输入你的域名（而不指定具体页面）时，你的主页将默认显示。\n\
  \n同样，为我们项目中其余的页面定义这些参数。\n\n## Header\n\n现在我们已经设计了整体布局、页面宽度和背景，并添加了页面，是时候设计模板的各个元素了。我们将从页眉开始。首先，我们希望它（页眉）稍微高一些。单击功能区上的\
  \ Header 选项卡并查找 Height 按钮。单击它并从可用选项列表中选择 150px。页眉将采用新的尺寸。\n\n接下来，我们将定义页眉的背景。就像页面的背景一样，页眉的背景可以是纯色、渐变、纹理或图片。展开“背景图像”列表，并从“抽象”组中选择第二行从左数第一个选项。\n\
  \n## Title and slogan\n\n在 Artisteer 中，模板的页眉包含两个标准文本：Title 和 Slogan。\n\nTitle 只是你在页眉中展示的网站标题（不要将其与你在“页面属性”窗口中定义的标题混淆）。Slogan\
  \ 是页眉中的第二个标准文本，通常包含一个口号。\n\n\n\n标题和标语的编辑方式与编辑页面中其余文本的方式相同（还记得我们如何编辑联系信息块吗？）。要编辑标语和标题，请执行以下步骤：\n\
  \n- 1. 双击标题 **输入站点标题**。\n- 2. 使用键盘删除现有文本并输入：\n  `Stunning Web Design.`\n- 3. 点击除页眉以外的任何位置以应用更改。\n\
  \n标题在点击其他位置时会处于非激活状态。如果单击一次，周围会出现细腻的边框，并且您可以自由移动和旋转文本。请注意，标题无法移出页眉。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_55_0.png)\n\
  \n> 之前移动和旋转对象的技术不仅可以应用于标题，还可以应用于标语和形状。\n\n现在我们将为页眉添加标语：\n\n- 1. 在功能区上单击 **标语** 按钮。页眉区域会出现新的文本\
  \ **输入站点标语**。\n- 2. 删除原始文本并以修改标题相同的方式将其替换为 `We design your needs`。\n- 3. 将标语放置在标题下方。\n\
  \n请注意，在编辑标题和标语时，功能区不会自动切换到 **编辑** 选项卡，即使手动切换，所有位于 **编辑** 选项卡上的选项也不可用。这是否意味着您无法影响这些元素的外观？当然不是！如果您想更改标题或标语的外观，您必须使用位于功能区\
  \ **页眉** 选项卡上 **编辑形状** 组中的 **文本** 按钮。只有在选择标题或标语时才会显示该选项组。尝试所有可用选项，使这两个元素完全符合您的期望。\n\
  \n## 图片\n\n除了标题和标语，您还可以向页眉中插入图像。现在我们将向页眉中插入一张图片：\n\n- 1. 单击 **图像** 按钮的下部——箭头。该按钮由两个元素组成。单击上部会触发\
  \ **从文件...** 选项，而单击底部箭头会展开完整的选项列表。\n- 2. 在列表中找到 **动物** 组。\n- 3. 选择两只彩色鹦鹉的图片。\n\n\
  您可以使用鼠标自由移动和调整插入图片的大小（调整大小时，Artisteer 程序会保持图片的宽高比）。请注意，在选择图片时，功能区上会显示一个新的选项组，**编辑形状**。它位于我们编辑标题和标语时找到的\
  \ **编辑图像** 组的位置。此组包含可用于对齐图片、将其转换为灰度或添加发光效果的选项。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_56_0.png)\n\
  \n> 您可以在页眉中放置任意数量的图片。\n\n## 形状\n\n**形状** 是您可以插入到页眉中的图形对象（以几何图形的形式）。您也可以像处理标题和标语一样移动和旋转形状，并且可以像处理图片一样调整其大小（甚至更好，因为您可以有或没有保持宽高比地调整形状大小）。您还可以通过双击形状并在其中启用文本光标来在形状内输入文本。形状的背景可以是纯色、渐变或纹理。\n\
  \n每个形状可以有几种预定义形式之一。可用形式包含简单的几何图形以及一些更高级的形状。可用形式的列表在单击功能区上的 **形状** 按钮后显示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_57_0.png)\n\
  \n此列表上的最后一个选项（形式）会展开另一个列表，其中包含更高级的形式：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_57_1.png)\n\
  \n使用形状非常方便。它们在与图像结合使用时尤其有用：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_57_2.png)\n\
  \n形状（左侧，带电话号码）与图像组合的示例\n\n形状提供的最有趣功能之一是使用蒙版的能力。\n\n## 排序形状和图片\n\n蒙版是形状内的透明区域。由于形状始终显示在图像之上，将带有蒙版的形状移过图像会使图像通过形状可见。仅揭开图像的一部分的可能性使您能够实现有趣的效果，如以下屏幕截图所示：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_58_0.png)\n\n如果您在页眉中使用许多图片和形状，迟早会遇到需要决定哪一个在上、哪一个被覆盖的问题。在\
  \ Artisteer 中，您可以通过右键单击形状/图像时出现的上下文菜单中选择 发送到后方 或 置于前方 选项来设置这些对象的顺序：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_58_1.png)\n\
  \n> 形状和图像的顺序应分别考虑。您可以将一张图片显示在另一张图片之上/之下，或将一个形状显示在另一个形状之上/之下。但您不能将图片显示在任何形状之上。形状始终显示在图片之上。\n\
  \n## Flash\n\n如果您愿意，可以向页眉添加其中一个可用的 Flash 效果。为此，单击 Flash 按钮（它位于功能区的右侧，位于页眉选项卡上）并从列表中选择其中一个效果（我选择了特殊组中的第二个效果）。您还可以从光盘插入自己的\
  \ Flash 电影（swf 格式）。\n\nArtisteer 原生提供的 Flash 效果的特征在于它们不会替换页眉的内容，而是在其上显示相当精致的附加效果。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_59_0.png)\n\n> 尽管向页眉添加 Flash 可以使其看起来更具吸引力，但您应该记住，Flash\
  \ 在 iOS 设备（如 iPad 或 iPhone）上不受原生支持。如果您预计访客会使用其中一种设备浏览您的网站，使用 Flash 并不是最佳选择。\n\n\
  ## 菜单\n\n接下来我们要设计的元素是我们的菜单。我们将设置它们的外观，并决定它们应以哪些页面作为其项目显示。\n\n### 水平菜单\n\nArtisteer\
  \ 用于设计水平菜单的所有选项都位于功能区的菜单选项卡上。单击它。\n\n目前我们的水平菜单位于页眉内部并右对齐。由于此位置现在被图像占据，菜单并不清晰可见。我们要做的第一件事是为菜单找到更好的位置。我们将把它放在页眉下方并左对齐。\n\
  \n垂直菜单的位置由位置选项决定，该选项位于建议菜单旁边，从左侧数起的第二个图标。展开可用位置，查看菜单位置如何根据每个位置而变化。对于我们的项目，请在内部工作表组中选择第二个位置。菜单将移至页眉下方。\n\
  \n如果您希望菜单和页眉之间有一些空间，请使用边距选项。长度选项可让您将菜单宽度设置为等于页眉或与整个屏幕一样宽。\n\n我们下一步是对菜单项进行左对齐。这有点棘手，因为正确的选项不在菜单区域组内，而在项目中。（我必须承认这是合乎逻辑的，因为您不对齐菜单区域而是对齐菜单项。另一方面，您不能对齐单个项目，只能同时对齐所有项目。无论如何，当我开始使用\
  \ Artisteer 的冒险时，找到此选项花了我一些时间。）要更改菜单的对齐方式，请执行以下操作：\n\n- 1. 单击项目按钮。\n- 2. 在列表中找到布局组并通过将鼠标指针移过它来展开对齐选项。\n\
  - 3. 从可用选项中选择代表左对齐的图标：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_60_0.png)\n\n\
  如果您想快速更改整个菜单的外观，请使用菜单样式列表中可用的其中一个选项。列出的每个选项都会更改整个菜单的外观，包括其所有元素。如果您想分别定义每个菜单元素，则应使用菜单和子菜单组中可用的选项。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_60_1.png)\n\n菜单组包含修改菜单顶层的选项。该组分为四个主要选项，每个选项都有自己的更详细属性。\n\
  \n### 菜单区域\n\n菜单区域是菜单显示的容器（矩形区域）。它不定义菜单项的外观。项目位于菜单区域内。换句话说，菜单区域只是菜单栏。\n\n### 项目\n\
  \n借助此选项，您可以定义菜单中顶级项目的外观。\n\n### 着色\n\n此选项可让您设置活动项目标记的样式。\n\n\n\n最后三个选项（活动、非活动和悬停）让你能够根据菜单项可能存在的三种状态精确设计其外观：\n\
  \n-   **活动菜单项**：它代表当前正在显示的页面的项目。让活动项看起来与其他项不同是个好主意，因为它能让访客快速知道自己当前正在查看哪个页面。\n- \
  \  **非活动菜单项**：它既不是活动状态也不是悬停状态的项目。\n-   **悬停菜单项**：它是指鼠标指针下的项目。使用鼠标悬停突出显示项目通常用于装饰效果。\n\
  \n你可能会想，使用“项目”选项有什么意义，又在什么时候会为其三种状态分别设计项目的外观呢？好吧，我必须说你说得有道理。项目列表中的选项更具通用性，并同时适用于所有菜单项（请注意，它们不会让你选择诸如颜色之类的基本属性）。如果来自“项目”的基本设置与为特定状态（活动、非活动或悬停）定义的设置冲突，则更详细的设置具有优先权。\n\
  \n“子菜单”组包含与“菜单”组类似的选项，只是它们不适用于顶级项目，而是适用于子项目。该组有“非活动”和“悬停”，但这里没有“活动”——这不是错误。水平菜单通过鼠标悬停展开，当鼠标指针移开时它会折叠，并且仅对顶级项目再次显示。因此活动子项目永远不可见，它始终处于折叠状态。这就是为什么子项目永远不会处于活动状态。\n\
  \n## 级别\n\n请查看“子菜单”组中第一个名为“项目”的按钮。这是“菜单”选项卡中最重要的按钮之一。它定义了整个菜单的外观和感觉。点击它，你将看到以下五个选项的列表：\n\
  \n-   **无子菜单（无子项目）**\n-   **单列**\n  -   **多级**\n  -   **扩展**\n-   **多列**\n  -  \
  \ **巨型菜单**\n  -   **巨型菜单扩展**\n\n为了更好地理解这些变体的含义，让我们考虑一个具有以下结构的网站：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_62_0.png)\n\
  \n我们顶层有三个项目。每个项目都有三个自己的子项目，而每个子项目也有三个自己的子项目。让我们看看对于上一个图表中所示结构的网站，水平菜单的每个变体会是什么样子。\n\
  \n### 无子菜单（无子项目）\n\n这是水平菜单的第一种也是最基本的变体。在此变体中，水平菜单仅显示顶级项目。子项目根本不显示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_62_1.png)\n\
  \n### 单列 – 多级\n\n在此变体中，我们的菜单显示顶级项目以及子项目。子项目以列的形式呈现，位于父顶级项目的正下方。下一级项目显示在右侧的列中（如果父项目显示在屏幕右侧边缘，则在左侧）。此菜单类似于经典桌面应用程序的标准菜单：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_62_2.png)\n\n### 单列 – 扩展\n\n这种菜单与上一节描述的非常相似。唯一的区别是展开时顶级项目的标记方式。在前一个示例中，包含子项目的列与父级（顶级项目）分离，而在这种情况下，它们共同构成一个简单的单元：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_63_0.png)\n\n### 多列 – 巨型菜单\n\n这种菜单（在\
  \ Artisteer 4 中引入）以多列形式呈现子项目。第二级项目以一行显示（它们为粗体），第三级项目以列的形式显示在其下方。如果菜单包含更多层级，它们将像前面的变体一样显示（父项目右侧的新列）：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_63_1.png)\n\n### 多列 – 巨型菜单扩展\n\n“巨型菜单”与“巨型菜单扩展”之间的区别类似于单列样式中“多级”与“扩展”之间的区别。“巨型菜单扩展”就是在“巨型菜单”基础上有所不同，即顶级项目与子项目合并。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_64_0.png)\n\n对于我们的项目，我们将选择单列 | 多级。\n\n\
  我们还将定义菜单的外观，但与其逐一设计每个方面，我们将使用“菜单样式”选项。点击按钮并选择第五行中的第一个选项。我们的模板目前应如下所示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_64_1.png)\n\
  \n## 垂直菜单\n\n即使你对我们的水平菜单满意，我们也不能忘记垂直菜单。点击功能区上的“垂直菜单”选项卡，我们就可以开始了。\n\n位于**垂直菜单**选项卡中的可用选项与**菜单**选项卡上的排列方式相似。最左侧（与往常一样）我们有**建议工具**，随后是**布局**组（不要将其与**布局**选项卡混淆！），它只包含一个按钮（这更像是一个小组，对吧？）。这是一个重要的按钮，它决定了垂直菜单的位置。让我们点击它。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_65_0.png)\n\n显示的此列表分为两个组：**无区块**和**区块位置**。第二组包含多个更改垂直菜单位置的选项。目标位置在图标上以填充区域标记。切换选项并观察垂直菜单从一个位置移动到另一个位置。请注意，你不一定必须在侧栏中显示垂直菜单，尽管在大多数情况下在内容上方或下方显示垂直菜单并不是最好的主意。\n\
  \n> 此列表的内容会根据项目布局而变化。例如，如果我们选择了三列布局，你会看到其中有更多选项。\n\n第一个组（**无区块**）只包含一个图标。通过启用此选项，你决定完全不显示垂直菜单。\n\
  \n> 选择**无区块**选项与使用其右上角的图标删除垂直菜单相同（还记得我们如何移除搜索区块吗？）。如果你移除了垂直菜单，你可以随时通过在**位置**列表中选择其他位置来将其恢复到项目中。\n\
  \n**样式**按钮的工作方式与**菜单**选项卡中的**菜单样式**按钮类似。它让你能够通过选择预定义选项之一，快速定义整个菜单的外观。同样，**菜单区域**、**项目**和**子菜单**组中的选项也与我们在设计水平菜单时使用的对应选项类似。由于它们非常相似，我们不会逐一描述它们，而是重点关注垂直菜单和水平菜单之间的差异（当然，主要区别是一个是垂直的，另一个是水平的）。\n\
  \n垂直菜单实际上是一种区块（在侧栏中显示的任何内容都是一个区块）。与其他区块一样，垂直菜单可能有标题（标题文本），也可能没有。你可以隐藏（或显示，如果它已被隐藏）此标题，并使用**菜单区块**按钮上的选项列表选择垂直菜单的预定义样式之一。请注意，没有其他方法可以移除标题。你可以编辑并更改其文本，但即使删除所有字符，你仍然会有标题（尽管是空的）。你也不能使用右上角的图标从区块中移除标题。即使边框或框架仅包围标题而不是整个区块，点击图标也会移除整个区块。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_66_0.png)\n\n水平菜单始终在鼠标悬停时展开并自动折叠。垂直菜单的行为可能不同，这取决于设置。活动子项目可能可见，因此为三种状态（活动、非活动和悬停）设计外观是有意义的。这就是为什么垂直菜单的项目和子项目都存在**活动**、**非活动**和**悬停**按钮。\n\
  \n### 垂直菜单行为\n\n定义垂直菜单行为的可能选项可通过**子菜单**组中的**级别**按钮获得。\n\n\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_67_0.png)\n\
  \n## 定义垂直菜单行为的可用样式\n\n我们可以从六种垂直菜单行为中进行选择：\n\n- **One Level** 是您可以选择的菜单中最基本的一种。它仅显示顶级项目。完全不显示子项目。\n\
  - **Expand with Reload** 菜单同时显示项目和子项目。包含子项目的项目在鼠标点击时展开。点击后页面会重新加载。\n- **Expand on\
  \ Click** 菜单与 **Expand with Reload** 非常相似，不同之处在于项目在不重新加载的情况下展开。\n\n> 您可能会认为 **Expand\
  \ on Click** 比 **Expand with Reload** 更好（看起来相同，但无需重新加载页面）。但最重要的区别并不是重新加载。相反，在 **Expand\
  \ with Reload** 中，包含子项目的项目是通向页面的链接，而在 Expand on Click 中它只是菜单项，没有对应的页面。请考虑我们的项目：我们有一个包含三个子页面的\
  \ **Offer** 页面。将垂直菜单设置为 **Expand on Click** 并导出页面，然后打开导出的文件夹并双击 `index.html` 文件。页面将在您系统的默认浏览器中打开。点击垂直菜单中的\
  \ **Offer** 项目。页面会重新加载，您可能会看到 **Offer** 页面被显示（查看浏览器地址栏，您会在地址末尾看到 `offer.html`）。然后返回\
  \ Artisteer，更改垂直菜单，输入 Expand on Click，导出页面并再次运行。您会看到点击垂直菜单中的 **Offer** 项目时，菜单会展开，但您完全无法访问\
  \ **Offer** 页面。\n\n我并不是说 **Expand on Click** 不好。确实存在某些项目，其中它会比 **Expand with Reload**\
  \ 好得多，反之亦然。\n\n- 在 **Expand on Hover** 菜单中，包含子项目的项目在悬停时展开，无需点击。父项目仍然是通向页面的链接。\n\
  - **Popup on Hover** 菜单在悬停时展开，就像水平菜单一样，但方向是垂直的。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_68_0.png)\n\
  \n- **All Open** 菜单始终显示其所有子项目（永远不会折叠）。\n\n我们将使用 **Styles** 中的一个可用选项快速设计菜单的外观。点击\
  \ **Styles** 按钮，从列表中选择第二行的第二个选项。我们还想隐藏此菜单的标题。点击 **Menu Block** 按钮，从 **Simple** 组中选择第二个选项。作为菜单类型，通过点击\
  \ **Level** 按钮上的列表中的最后一个选项选择 **All Open**。我们最后想更改的是项目的圆角。点击 **Item** 按钮（在 **Menu**\
  \ 组中），展开 **Radius** 选项，并选择 **10% of Height**。\n\n## 确定菜单中显示的页面\n\n在功能区的 **Menu**\
  \ 和 **Vertical Menu** 选项卡中，您都可以找到仅包含一个按钮 **Show in Menu** 的 **Pages** 组。点击此按钮会显示\
  \ **Select pages in menu** 窗口，您可以在其中决定哪些页面应在菜单中显示，哪些不应显示。我们希望所有页面都显示在水平菜单中，而仅 **Offer**\
  \ 页面（及其所有子页面）显示在垂直菜单中。勾选适当的页面。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_69_0.png)\n\
  \n对于垂直菜单，我们只想显示 Offer 页面及其子页面\n\n请注意，您不能在不勾选其父页面<|message|> 的情况下勾选子页面（更准确地说，您可以；但如果这样做，它们不会显示，尽管您已勾选它们）。这就是为什么我们不仅要勾选\
  \ Websites、WordPress、Joomla! 和 DotNetNuke 页面，还要勾选它们的父页面 Offer。\n\n到目前为止，您的垂直菜单应如下图所示：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_69_1.png)\n\n我们已经设计了水平菜单和垂直菜单的外观和感觉，并且还设置了在每个菜单中显示的页面。我们的下一步将是设计内容区域。\n\
  \n## 内容\n\n在开始编写内容之前，我们必须设计内容的整体布局。在 Artisteer 中，内容区域可以分为任意数量的行和列。熟练识别行和列是实现设计良好的内容的关键。\n\
  \n首先要规划的是网站的外观。我们将使用以下内容设计主站点：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_70_0.png)\n\
  \n在内容顶部我们想要标题。在其下方的较大区域中，我们想要一段关于我们是谁以及我们做什么的描述（请记住，我们正在创建一个宣传您作为网页设计师的网站）。我们想用照片丰富文本。在其下方我们只想要一行文字：`Look\
  \ at our latest projects...` 最后一个区域将包含三张图片，显示您最新项目的缩略图。如果您还没有做过任何项目，不用担心！使用 Auto\
  \ Suggestion 工具快速设计一些内容，并使用到目前为止阅读的信息对其进行自定义。实际上，这将是一次很好的练习，让您熟悉该程序。如果您觉得现在还做不到，您可以先在此处插入\
  \ Artisteer 库中的任何图片，以后再替换它们。\n\n在我们的例子中，行和单元格的组合应类似于以下图片（为了更清晰，行和单元格已加边框）：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_71_0.png)\n\
  \n我们需要三行内容。第一行用于最大的文本部分（描述），第二行用于其下方的简短文本，最后一行分为三个单元格，用于插入三个标志。\n\n您可能会想，为什么我们不为页面标题创建一行。原因是\
  \ Artisteer 会自动创建标题的容器。这与垂直菜单标题的情况类似。您可以隐藏页面标题，但您无法在没有它的情况下设计任何页面。我们将在本章稍后学习如何隐藏页面标题。\n\
  \n您可能会想，为什么第一张照片不放在单独的单元格中，而接下来的三个标志却放在了其中。原因是第一行中的照片不是我们内容的单独元素。第一行包含一篇文章，照片是其一部分。\n\
  \n在设置内容布局之前，我们必须删除程序自动放置在此处的实际内容。为了高效地做到这一点，我们必须了解 Artisteer 为创建内容布局提供的工具。\n\n设计内容布局的所有工具都位于功能区的\
  \ **Content** 选项卡上。点击它。选项并不太多。但当您在内容区域的任何位置点击时，**Content** 选项卡上显示的工具数量会增加，并会出现许多新按钮。您会看到许多新按钮出现。\n\
  \n> Artisteer 仅在您编辑内容时才显示完整的范围的内容设计工具。\n\n应用于布局设计的工具位于 **Content** 组中。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_72_0.png)\n\
  \n第一个按钮 **Content Layout** 显示最常用的内容布局列表。您可以将其视为一种模板，只需单击鼠标即可将其分配给您的页面。选择其中一个可用选项将用所选布局替换当前布局，并且您的所有内容将自动更新为新的行和单元格结构。\n\
  \n第二个按钮 **Styling** 可让您设置内容样式。在之前的列表中您可以定义布局，这里您可以定义它看起来如何。**Styling** 选项为您的行和单元格定义各种边框和背景。\n\
  \n> **Styling** 列表中显示的选项取决于您在 **Content Layout** 中选择的布局。\n\n**Styling** 列表中的最后一个选项可让您定义当前行的布局，并定义适用于所有页面的一些设置，例如单元格边框、边距和圆角。\n\
  \n\n\n我们必须删除当前内容。当然，我们可以逐行逐单元格点击并逐一删除文本，但我们将使其更快且稍显巧妙。如果你更改布局，内容会被保留并自动适配到新布局。因此，我们可以利用此功能一次性删除所有内容。执行以下步骤：\n\
  \n- 1. 点击 **Content Layout** 按钮。\n- 2. 从列表中选择 **One Column** 组中唯一可用的选项。当前内容布局将被替换为仅包含一个行的布局，该行将包含所有内容。\n\
  - 3. 在内容中的任意位置点击并按 *Ctrl + A*。所有内容将被选中。\n- 4. 按 *Delete* 删除当前内容。\n\n现在我们可以开始设计布局。因为\
  \ **Content Layout** 列表上没有这样的布局，我们将手动设计它。点击 **Layout...** 按钮以显示 **Layout Editor**\
  \ 窗口：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_73_0.png)\n\n在之前的窗口中，你几乎可以自由设计自己的布局。左侧的框架代表行和单元格。右侧第一个按钮（倒三角形状）允许你通过显示可用选项的列表来更改行的样式（单元格的数量和比例）。第二个按钮（红色减号）会删除整行。\n\
  \n> 你可以删除整行及其所有列，但不能删除单个单元格。\n\n我们将从头开始修改布局。请执行以下操作：\n\n- 1. 使用带有红色减号的按钮删除所有行。实际上我们只需修改现有行即可，但我们想从头开始设计。\n\
  - 2. 通过点击带有绿色加号的按钮添加新行，并从可用行变体列表中选择第一个选项——未划分为更多单元格的行。我们希望在这第一行中放置带照片的文章。\n- 3.\
  \ 向内容布局添加第二行。它将包含我们的“Look at our latest projects...”声明。这也是一行单单元格。\n- 4. 添加第三行也是最后一行。此行将包含我们的三个缩略图。因为它们将作为独立元素放置（而不是插入到文章中），所以此行需要有三个单元格。选择并点击正确的选项。\n\
  - 5. 点击 OK 关闭此窗口。表面上似乎什么都没发生。但如果你将鼠标光标移到内容区域上，你会看到边框出现在新区域上。因此，Artisteer 确实修改了布局。\n\
  \n## 编写文章\n\n现在我们已经定义了内容布局中的区域，可以开始填充网站内容。\n\n我们首先更改标题。在左侧面板上右键点击 **Home** 页面，并从上下文菜单中选择\
  \ **Show Article Title**：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_75_0.png)\n\
  \n标题将显示在内容区域第一行上方。我们尚未编辑它，因此它仍然包含文本 **Page 1**。点击标题并将其更改为 `Welcome to my site!`。\n\
  \n现在我们要编写文章。把书中的所有文章都写出来并无太大用处。相反，我们将复制并粘贴一些占位文本。\n\n> 这是设计布局时的一种常见做法：用示例文本填充它。如果没有这样做，最终客户就无法知道模板作为实时网站会是什么样子。它还有助于你设计和展示排版。示例文本有一个通用标准——lorem\
  \ ipsum。\n\n要获取占位文本，只需前往 http://www.lipsum.com 并找到 **Generate Lorem Ipsum** 按钮。将生成的段落数更改为三段，然后点击它。然后将生成的文本复制到剪贴板并返回\
  \ Artisteer。在 Artisteer 中，点击内容区域的第一行并按 Ctrl + V 粘贴文本。从功能区的 **Paragraph** 组中点击将文本对齐的图标：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_75_1.png)\n\n你可以像在任何文本编辑器中一样输入文本。如果你想更改字体或开始列表，你需要的所有工具都位于\
  \ **Style and Font** 和 **Paragraph** 组中。\n\n在编写内容时，你应记住一条特定规则：如果需要更改字体（即你想写一个标题），应使用样式而不是直接操作字体属性。这样一来，你的内容在整个网站上看起来会保持一致。请记住，所有排版，包括六级标题、链接和按钮文本都是由你的布局定义的。通常情况下，几乎不需要使用除已定义样式之外的其他内容。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_76_0.png)\n\n## 插入图片\n\n我们第一行已填入文本，现在是时候用图片丰富文章了。我们希望图片放置在文章开头。为此，请执行以下操作：\n\
  \n- 1. 点击文章开头。文本光标将在文章第一个单词之前闪烁。\n- 2. 点击 Image 按钮下的三角形（它位于功能区的 Insert 组中），并从可用选项中选择\
  \ Clip Art。另一个展示 Artisteer 提供的图片缩略图的列表将会展开。\n- 3. 选择第二行中的第四张图片。\n\n图片已插入，但并非完全如我们所预期。首先，它太大了。其次，我们希望文字环绕图片，而我们得到的是右侧留有空白的图片！\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_77_0.png)\n\n别担心！我们将对其进行修正。右键点击图片并从上下文菜单中选择\
  \ **Image Options....** **Image Options** 窗口将会出现。该窗口左侧有三个标签：**Image**、**Layout**\
  \ 和 **Link**。确保第一个标签被选中。请执行以下操作：\n\n- 1. 将图片宽度设置为 150 px。**Height** 和 **Scale**\
  \ 字段中的值将自动更改。\n- 2. 在 **Alt Text** 字段中输入 `My photo`（请记住我们正在设计你的网站，因此你可以将此图片替换为你的真实照片）。\n\
  - 3. 点击左侧的 **Layout** 标签。\n- 4. 从 **Position** 下拉框中选择 left。同时，将底部边距设置为 0 px，边框设置为\
  \ 2 px。点击 **OK** 关闭窗口。\n\n更改后你的网站应如下所示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_77_1.png)\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_78_0.png)\n\n> 你永远不应将 **Alt Text** 字段留空。**Alt\
  \ Text** 是在无法显示图片时显示的文本。例如，使用屏幕阅读器的残障人士只能获得替代文本。放置没有替代文本的图片也可能导致网站验证出现问题。\n\n在讨论插入图片时，我们还有一个重要特性需要讨论。默认情况下，点击图片时，该图片的更大、覆盖版本会显示在页面顶部。此效果称为\
  \ **Lightbox Style**（名称源自引入此效果的著名 JavaScript 库）。它非常适合创建图片画廊，但有时你并不希望图片如此行为。\n\n\
  ![](img/7f889df2ffdb68108cff34d798a2b9a3_78_1.png)\n\n要检查图片是否应具有 Lightbox 效果，你必须在\
  \ **Image Options** 窗口中更改 **Preview** 设置。它是 **Image** 标签中的最后一个选项，包含两个选项：**Yes**\
  \ 和 **No**。将此值设置为 **No** 以关闭图片的此效果。\n\n为了完成我们的第一页，我们必须完成其余单元格中的内容。\n\n点击下面的行，并从\
  \ **Style and Font** 组中选择 **Header 2** 作为样式（我们希望此文本比段落中的默认文本更大）。输入 `Look at my latest\
  \ project...`，点击第三行的第一个单元格，然后点击 **Image** 按钮。**Open** 对话框将会出现。选择你在 Artisteer 中完成的任何其他项目的截图文件（如果没有，你可以从磁盘中选择任何其他图片）。同样地，将图片插入到最后两个单元格中。这次我们不会关闭\
  \ Lightbox 效果，因为让访客可以点击并放大这些缩略图是很好的。\n\n\n\n> 如果你在浏览器中预览此网站，你会看到 Lightbox 效果不仅显示更大的图片，还显示下一张和上一张图片的导航按钮。这样我们就创建了一个画廊。\n\
  \n最后，我们的网站应该看起来像这样：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_79_0.png)\n\n##\
  \ 插入幻灯片\n\n除了插入图片和图片画廊（带 Lightbox 效果）之外，Artisteer 还提供创建幻灯片的可能性。幻灯片是一组图片，按顺序一张一张地在同一位置显示。显示的幻灯片会根据预定义的其中一种转场效果而变化。你可以在内容区域和页眉中创建幻灯片。\n\
  \n## 内容区域中的幻灯片\n\n我们通过插入一张图片开始准备幻灯片。这张图片将是首先显示的幻灯片，并且它决定了整个幻灯片的尺寸。每张幻灯片大小相同，因此在开始准备幻灯片之前，先准备好图片集并相应调整大小是良好的做法。你可以在一张幻灯片中插入多张图片，制作拼贴，甚至将图片与形状结合。\n\
  \n在插入图片后，用鼠标左键单击一次。功能区将显示编辑选项卡，并且幻灯片组中的新建幻灯片按钮将被启用。点击以从可用来源之一插入新幻灯片：你可以插入空白幻灯片，复制当前幻灯片，从文件添加图片，从\
  \ Artisteer 库添加图片，或从 Flickr 添加图片：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_80_0.png)\n\
  \n如果决定从文件插入新幻灯片，你还将有调整图片大小的可能性。可用的选项有：\n\n- **调整拼贴以适应图片**：此选项根据新图片的尺寸调整整个幻灯片的大小。仅适用于小于幻灯片的图片。\n\
  - **调整图片以适应拼贴**：此选项调整插入图片的大小以适应实际幻灯片尺寸。\n- **使用原始大小**：此选项不改变插入图片的大小。如果图片大于幻灯片，则只会显示图片的一部分。如果图片小于幻灯片，则会用背景环绕。\n\
  \n你也可以向现有幻灯片中插入新的图片和形状。为此，使用位于我们用于插入新幻灯片的新建幻灯片按钮右侧的**添加图片**或**添加形状**按钮。它们的工作方式非常相似，但不是将新的图片（或形状）作为新幻灯片插入，而是将其添加到当前幻灯片中。你可以通过在一张幻灯片中组合多张图片和形状来创建有趣的效果。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_81_0.png)\n\n两张图片和一个形状组合成一张幻灯片\n\n**背景**按钮让你为幻灯片选择背景。如果显示的图片（或图片）小于幻灯片的尺寸，背景将可见。你可以为每张幻灯片设置不同的背景。\n\
  \n**幻灯片**组中的最后三个按钮是：**播放**、**运动**和**导航器**。\n\n- **播放**按钮启动幻灯片并让你看到它在实际网站上的效果。\n\
  - **运动**按钮让你选择其中一种可用的转场效果。默认情况下，幻灯片以淡入淡出效果切换。你还可以设置转场效果的速度、延迟（每张幻灯片显示的时间）以及幻灯片是否重复。\n\
  - **导航器**按钮让你设计导航器。导航器默认显示在幻灯片右下角的一组指针。它指示当前显示的是哪张幻灯片，并允许你点击前往另一张：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_81_1.png)\n\
  \n## 页眉中的幻灯片\n\n在页眉中创建幻灯片与在内容中放置幻灯片的过程非常相似。不同之处在于你只能有一个幻灯片，并且每张幻灯片都覆盖整个页眉。事实上，它并不是*页眉中的幻灯片*，而是*页眉的幻灯片*。\n\
  \n在功能区的**页眉**面板中，你会找到**幻灯片放映**组，其中包含与我们在**编辑**面板中看到的类似的按钮。\n\n要创建幻灯片，请像往常一样设计你的页眉。设置背景并插入图片和形状。此页眉将是第一张幻灯片。当一切准备就绪后，点击**新建幻灯片**按钮并选择图片。将插入一张新幻灯片（新页眉），所选图片将成为其背景。再次设计页眉，这将是第二张幻灯片，以此类推。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_82_0.png)\n\n> 将每张幻灯片视为一个独立的页眉，具有自己的背景、图片和形状。唯一对所有幻灯片都通用的元素是标题、标语和搜索字段。\n\
  \n## 排版\n\n我们已经稍微谈过排版。你知道可以使用样式而不是为每个标题更改字体，并且排版包含链接、按钮文本等的定义。\n\n现在我们将更仔细地查看此模板的参数。\n\
  \n排版工具位于功能区的**颜色和字体**选项卡上。点击它。如名称所示，此选项卡包含排版工具和模板颜色操作工具。排版工具放置在**字体**组中（在**建议工具**旁边）。在此组中你可以找到三个按钮：**字体集**、**排版**和**字体比例**。\n\
  \n**字体集**按钮让你选择项目中使用的字体集。每个集合包含两种字体：第一种字体用于标题，第二种字体用于段落文本。点击此按钮后，你将看到可用字体集的列表。每个列表项都显示字体集的名称，以及所用字体的名称。所用字体的名称以这些字体显示，让你预览它们的外观。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_83_0.png)\n\n在此列表底部有一个名为**编辑字体集**的按钮。点击此按钮会显示**编辑字体集**窗口，在其中你可以更改活动状态下使用的字体。\n\
  \n假设我们希望标题使用 Arial 字体，段落使用 Times New Roman 字体。我们需要：\n\n1. 显示**编辑字体集**窗口。\n2. 在**标题字体**字段中选择**Arial**。\n\
  3. 在**文本字体**字段中选择**Tahoma**。\n4. 点击**确定**按钮关闭窗口。\n\nArtisteer 已更改字体，如果再次点击**字体集**按钮，你会看到我们的集合现在在**自定义**组中显示为**未保存**。确实，这是我们的自定义集合，我们尚未保存它。点击底部（现在已激活）的**保存字体集**按钮并将文件保存为名称\
  \ `My favorite fonts`。我们的新集合将显示在**自定义**组中。\n\n> 我们保存的字体并非仅存储在模板中，而是存储在 Artisteer\
  \ 的应用程序级别。你可以重新启动程序，打开其他布局，或开始创建新布局，你会看到我们的**My favorite fonts**字体集可用。这样，你准备的集合可以在未来的项目中重复使用。\n\
  \n但排版远比标题和段落的字体定义复杂。我们有六个标题级别，因此显然应该有定义更多属性的可能性。要编辑排版的高级功能，请点击**排版**按钮。展开的列表包含可用的排版。活动的一个可能是在**自定义**组中的**未保存**。\n\
  \n点击列表底部的**编辑排版...**按钮以显示**排版**窗口。在此窗口中你可以查看模板的所有文本元素。列表下方有一个**修改**按钮、一个**预览**字段，可在其中查看所选元素的外观，以及元素的\
  \ CSS 定义：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_84_0.png)\n\n我们将对排版进行以下修改：\n\
  \n- 我们将修改**标题 6**元素\n- 我们将把文本“Look at my latest projects...”的样式从**标题 2**改为**标题 6**。结果，我们的文本外观应发生变化。\n\
  \n要进行这些更改，请执行以下操作：\n\n1. 在列表中点击**标题 6**元素以选择它。\n2. 点击**修改**按钮。将会出现一个新窗口。\n3. 在此窗口的**字体**选项卡中，将字体名称设置为**Aguafina\
  \ Script**，将字体样式选择为**粗体**，并将**字体大小**选择为**28**。\n\n\n\n- 4. 单击 **OK** 按钮返回到上一个窗口。再次单击\
  \ **OK** 按钮关闭窗口。\n- 5. 单击我们的文本。你不需要选择整段文本，只要文本光标在文本中的某处闪烁即可。\n- 6. 功能区的 **Edit**\
  \ 选项卡应自动被选中。展开样式列表（你可以在 **Style and Font** 组中找到它）并选择 **Heading 6**。我们的文本样式将会改变并看起来像我们设计的那样。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_85_0.png)\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_85_1.png)\n\
  \n> 我们已更改了 **Heading 6** 元素的定义并将其应用于 `Look at my latest projects...` 文本。在我们的情况下这是可以接受的，因为我们在项目中不使用完整的排版。如果我们网站内容的结构如此复杂，以至于需要全部六个标题级别，我们就不能浪费标题样式仅用于文本。相反，我们应该使用\
  \ **Paragraph** 样式设置文本，然后手动更改字体。设计标题级别的总体规则是，每个下一级应比上一级略小一些，以直观地说明标题的逻辑层次结构。\n\n\
  我们将修改段落文本并使其稍微大一些，与我们更改 **Header 6** 元素的方式相同。类似于 **Header 6** 元素，再次编辑排版，并在 **Typography**\
  \ 窗口中将 **Default** 元素的字体大小设置为 **14 px**。\n\n你可以同样修改排版的任何元素。创建良好的排版不是一项简单的任务，但它是整体模板的重要因素。\n\
  \n如果你以后想使用我们修改过的排版，可以使用 **Save Typography** 按钮以任意名称保存它。\n\n**Fonts** 组中的最后一个按钮是\
  \ **Font Scale**。使用此按钮可以非常快速地一次性更改所有文本元素的大小。**Options...** 按钮会带你进入窗口，在那里你可以手动设置文本的比例。\n\
  \n## Color theme\n\n我们已为模板选择了配色主题，但我们没有深入探讨这个话题。这是因为我们希望快速开始设计，同时也因为我们需要在更了解 Artisteer\
  \ 的使用方法后才能处理这个问题。\n\n配色主题是模板中使用的颜色集合。逻辑上它类似于字体集和排版。排版定义了各种模板元素中使用的文本，而配色主题则定义了它们的颜色。\n\
  \n要修改主题的颜色，可以使用位于 Paints 组中的三个按钮（我们仍在 Fonts & Colors 选项卡中）。这三个按钮以填充特定颜色的矩形形式出现，让你选择涂料的颜色。\n\
  \nPaints 是配色主题中使用的主要颜色。你可以将其视为整个配色主题构建的基础。Artisteer 中的每个配色主题都有三种涂料。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_86_0.png)\n\
  \n> 与特定涂料和模板元素之间没有固定的关系。例如，你不能说更改第二个涂料总会改变背景颜色。主题颜色的分布在各种模板中会发生变化。\n\n使用最后一个标有 Adjust\
  \ 的按钮，你可以更改配色主题中所有涂料的亮度和饱和度。可用选项分为四个组，其名称暗示了更改（Basic、Normal、Contrast 和 Pastel）。\n\
  \n如果你修改了配色主题中的涂料并且对更改感到满意，可以以任意名称保存它，并在未来的项目中使用。\n\n## Footer\n\n我们需要设计的最后一件事是页脚。所有适用于页脚的工具都位于\
  \ Footer 选项卡上——尽管你会发现在这方面并不那么明显。问题在于，许多你可以用 Footer 选项卡的工具定义的事情，也可以使用 Edit 选项卡上的类似工具实现。更重要的是，Edit\
  \ 选项卡工具所做的设置优先级高于 Footer 选项卡工具所做的设置。例如，你可以使用 Footer 选项卡中的 Align 按钮将页脚文本右对齐，同时使用\
  \ Edit 选项卡中的对齐图标将同一文本左对齐。结果，文本将被左对齐。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_87_0.png)\n\
  \n> 如果 **Footer** 选项卡的设置与 **Edit** 选项卡的设置冲突，则 **Edit** 选项卡的设置具有更高的优先级。\n> \n> 如果你觉得\
  \ **Footer** 选项卡中的选项完全不起作用，请检查是否已使用 **Edit** 选项卡中的工具设置了相同的属性。例如，如果你在 **Edit** 选项卡中设置了文本颜色，则使用\
  \ **Footer** 选项卡中的按钮更改它将没有任何效果，因为该属性已被来自 **Edit** 选项卡工具的优先级更高的设置覆盖。\n\n**Footer**\
  \ 选项卡上的工具分为两个组：**Layout** 和 **Footer Styles**。**Layout** 组中的第一个按钮 **Length and Position**\
  \ 让你选择三种页脚类型之一。（为了更好地理解它们的工作原理，你可以使用 **Fill** 按钮暂时为整个页脚设置不同的背景颜色。）\n\n**Inside Sheet**\
  \ 页脚位于模板内部。页脚左侧、右侧和下方都有网站背景：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_87_1.png)\n\
  \nInside Sheet 页脚：页脚下方和两侧都有背景\n\n**Sheet Width, Screen Height** 页脚填充整个空间直至屏幕底部。页脚下方没有空余空间（背景）：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_88_0.png)\n\nSheet Width, Screen Height\
  \ 页脚：页脚填充下方所有空间\n\n**Page Width, Screen Height** 页脚填充内容下方所有空间，且宽如整个页面。页脚左侧、右侧和下方没有空余空间（背景）：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_88_1.png)\n\nPage Width, Screen Height\
  \ 页脚：页脚填充内容下方所有位置\n\n**Margin** 按钮让你定义内容底部边缘与页脚顶部边缘之间的垂直空间。\n\n对于我们的项目，选择 **Inside\
  \ Sheet** 选项。\n\n使用 **Fill** 按钮可以定义页脚面板的颜色。可用颜色列表展示了属于配色主题的颜色。你也可以单击 **More Colors...**\
  \ 并自由地从完整调色板中选择。此列表上的最后一个按钮让你设置页脚面板的透明度。\n\n对于我们的项目，选择第二行中的第一个颜色（来自 **Theme Colors**\
  \ 组）并将透明度设置为 50%。\n\n**Separator** 按钮让你定义分隔页脚的线的外观。你可以设置该线的宽度（**Weight**）、样式和颜色。\n\
  \n其余按钮你不应有任何问题，因为它们的行为类似于放置在其他选项卡上的类似工具。唯一让你惊讶的是当你单击 **Text** 按钮时。单击它，你将被重定向到功能区上的\
  \ **Edit** 选项卡！\n\n## Summary\n\n我们经历了创建简单网站的整个过程。我们设计了其结构并为项目添加了适当的子页面。然后你了解了典型模板的主要元素是什么以及如何使用\
  \ Artisteer 设计它们。我们逐一进行，从页眉到页脚。此时你拥有了第一个网站的完整项目：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_89_0.png)\n\
  \n子页面目前还没有内容，但设计已完成。菜单工作正常，底部的图像使用了 Lightbox 效果。你现在可以将此项目导出为 HTML 网站（如我们在 *Chapter\
  \ 1, Meet the Artisteer* 中所做的）或如果计划让此网站增长，则将其导出为可与受支持的 CMS 之一一起使用的就绪包。这就是我们在下一章中将要介绍的内容。\n\
  \n\n\n# 3 CMS 模板\n\n直到此刻，我们一直专注于设计静态网站（在 Artisteer 中称为 Website Template）。术语 **static\
  \ website** 可能让你有点尴尬，因为它自然会被理解为“页面上什么都不动的”。你可能会想，如果你在静态网站上添加例如幻灯片，它就不再是静态的了。这是一种非常自然且合乎逻辑的思考方式，但在这种情况下，常用的术语则完全不同。说到静态网站，我们想的不是其内容，而是页面的生成方式。\n\
  \n## 什么是 CMS\n\n在静态 HTML 网站中，内容是硬编码的——它是页面代码的一部分。这样的网站由众多 HTML 文件组成，并且所有文件都是单独逐一编写的。它们可以使用各种工具来准备（或多或少简化工作），但每个文件都同时包含外观定义和内容。所有这些文件都被复制到\
  \ Web 服务器上，使其可供访客访问。这是最自然、最易于理解的网站类型。\n\n动态页面在技术上肯定更先进。它并不以文件的形式存在，而是由 Web 服务器即时生成的。在收到需要显示特定页面的信号后，一种特殊的软件会获取适当的内容（通常来自数据库）并将其放入可用的模板中。内容和模板成功结合后，页面就准备就绪并发送到浏览器。\n\
  \n**Dynamic website** 因此不是静态页面（HTML 文件）的集合，而是在 Web 服务器上安装的用于管理内容、模板并将它们合并为动态页面的软件。\n\
  \n动态网站比其静态对应物运行得更慢，因为每个页面在显示前都必须生成。它们对服务器的要求更高，因为服务器不仅要显示页面，还要生成页面。\n\n那么优势是什么呢？这无疑是一个更通用的解决方案，而且“一旦被称为内容管理系统（CMS）的软件准备好后，就可多次用于各种网站。让我们回顾一下我们对模板的定义。我写道，模板是网站的共同、固定元素的集合，如背景、页眉和页脚。\n\
  \n这些元素对整个网站是共同的。区分各个页面的内容。借助 CMS，内容与布局分离并存储在外部存储中（通常在数据库中）。在页面显示之前，CMS 获取适当的内容并将其放入模板中。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_92_0.png)\n\n在页面显示时，CMS 将页面的固定元素（模板）与数据库中的正确内容连接起来\n\
  \n因为固定元素只定义一次（它们不会在每个页面上重复，而只存在于模板的一个实例中），这意味着数据的节省。但更重要的是，外观与内容的分离允许你在任何时候更改模板，而不会影响内容。你可以随时更改网站的外观而保持内容不变。如果你长期管理一个网站或博客，你肯定会欣赏这种可能性。外观与内容的<|message|>\n\
  [/content]\n\nWait need complete translation. I truncated. Need full translation.\
  \ Let's continue properly.\n\nWe need ensure entire text translated. Let's do full\
  \ translation systematically.\n\nI'll produce complete output.\n\nProbably need\
  \ keep line breaks.\n\nLet's produce final answer with full translation.\n\nI'll\
