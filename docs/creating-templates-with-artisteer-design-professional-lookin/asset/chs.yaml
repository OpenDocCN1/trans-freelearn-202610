  \n- 任何项目的主要成本因素始终是完成该工作所需的时间和技能。设计和编程都是非常耗时的任务，任何自动化都能节省时间和金钱。\n- 网页设计业务中最令人沮丧的事情之一是，客户通常不会为他或她尚未看到的东西付费。有了\
  \ Artisteer，概念的第一阶段可以非常快速地完成。\n\n前面讨论的关于 Artisteer 对[content]\n## 网页开发者和程序员\n\n\
  将网页开发者和程序员区分开来的界限往往很模糊，不同公司对同一职位使用不同的名称。本书中，网页开发者是指具备创建 HTML/CSS 代码技能的人。此外，他或她通常熟悉\
  \ CMS 管理，能安装配置各种扩展，并能完成整个网站，包括样式表修改，且无需单独编程。程序员通常是“更高级别的网页开发者”，具备编程技能。通常他们编写 CMS\
  \ 系统的核心或其附加功能（创建扩展）。简言之，网页开发者是使用程序员编写的东西来构建网站的人。\n\n网页开发者和程序员能独立搭建整个网站，除了一个问题——他们不会画图。他们可能是优秀的技术人员，但不是图形设计师，即使技术最先进的网站若无图形也不会令人印象深刻。因此他们常以现成模板为基础进一步工作。当需要修改的不是功能而是网站外观时，就必须与设计师合作。\n\
  \n设计师是具有艺术品味的人。他们能判断什么好看什么不好看，即使自己画不出来。Artisteer 让他们能独立设计模板，通过确定网站及其各元素的外观，改变颜色、位置、大小等参数。正如后文所述，使用\
  \ Artisteer 的感觉就像设计师坐在你旁边，倾听建议，即时修改并立即呈现结果。\n\n## 网页开发公司\n\n人们合作的一个主要原因是没有人完美，没有人拥有全部才能。对个人而言，Artisteer\
  \ 似乎是好选择，因为它可让他避免与其它专家合作（可能 costly）并独自完成项目。但对于由不同互补技能人员组成的团队，根本无需此类工具。基于个人经验，我不同意这种想法，理由如下：\n\
  \n- 任何工作或项目的主要成本因素始终是完成工作所需的时间和技能。设计和编程都很耗时，任何自动化都能节省时间和金钱。\n- 网页设计业务中最令人沮丧的是，客户通常不会为未见过的东西付费。有了\
  \ Artisteer，概念的第一阶段可以很快完成。\n\n前面讨论的 Artisteer 对各[content]\n## 网页开发者和程序员\n\n将网页开发者和程序员区分开来的界限往往很薄，不同公司对同一职位使用不同名称。本书中，网页开发者是指具备创建\
