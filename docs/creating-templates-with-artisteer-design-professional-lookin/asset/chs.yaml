  \n## 内容编辑 – Artisteer 或 CMS\n\n我们已自动将 Artisteer 项目中的所有内容导入到 Joomla! 和 WordPress。\
  \ 我们在 Artisteer 中准备的所有内容——即页面（带文字和图片）、菜单、菜单项和页脚——现在都存在并且在我们的 CMS 网站中正常工作。整个过程虽然简单快捷，但你可能会想知道最好的工作方式是什么：应该在\
  \ Artisteer 中准备所有内容然后导入到 CMS，还是安装空模板并直接在 CMS 中输入内容？\n\n这个问题的答案并不那么明显。两种方法都可行，选择权在你。但你应该考虑每种方法的优缺点。以下是直接在\
  \ Artisteer 中准备内容的优缺点：\n\n| 在 Artisteer 中准备内容的优点 | 在 Artisteer 中准备内容的缺点 |\n|---|---|\n\
  | 可以非常快速完成，无需切换到 CMS 甚至安装它。你可以在拥有主机账户之前就进行操作。 | 内容是根据 Artisteer 设定的规则导入的。你别无选择，只能接受它们。例如，在\
  \ WordPress 中，所有文章都将被放入名为“未分类”的一个分类中。 |\n| 只要内容仍在 Artisteer 项目中，它就保持平台无关（当然不包括特定平台的功能）。你可以在决定使用特定\
  \ CMS 之前准备好整个网站。 | 你无法设置一些重要属性，例如 Joomla! 中文章和菜单项的别名。它们是自动设置的。这对 SEO 地址有直接影响。如果你想修复它们，就必须手动在\
  \ CMS 中纠正。这需要时间。 |\n| 如果你为他人准备网站，你可以在不触碰其系统的情况下准备好带内容的整个网站。你只需将整个网站导出为一个可安装的 ZIP\
  \ 包即可。 | 你无法使用在 CMS 中安装的任何第三方扩展提供的功能，也无法使用已上传的图片。你在目标系统之外。 |\n| 你可以为模板准备示例内容。 |\
  \  |\n\n以下是直接在 CMS 中准备内容的优缺点：\n\n| 直接在 CMS 中准备内容的优点 | 直接在 CMS 中准备内容的缺点 |\n|---|---|\n\
  | 你可以使用 CMS 的全部功能，包括所有已安装的扩展和已上传的图片。 | Web 应用的响应速度不如桌面应用。你可能使用 Artisteer 编写一篇简单文章所需的时间会比使用\
  \ CMS 少一些。 |\n| 你可以完全控制内容和 CMS 功能。你可以为文章和菜单项设置适当的别名，为各种文章分配各种分类，设置分类名称、上传图片的位置等等。\
  \ |  |\n| 内容可以由一队人同时插入。 |  |\n\n从上述分析可以得出的结论是，如果你制作一个简单的网站，或需要非常快速地完成某些工作，你可以在 Artisteer\
  \ 中准备内容然后导入到 CMS 系统。如果你要构建一个相当复杂的网站，并且已经决定使用哪个 CMS，直接在 CMS 中输入内容是更好的选择。你将完全控制自己的工作。\n\
  \n## 摘要\n\n在本章中，你学习了如何为 CMS 平台设计模板。我们讨论了由 CMS 驱动的网站与静态 HTML 网站之间的总体差异，并了解了 Artisteer\
  \ 的一些新功能。我们已成功在 Joomla! 和 WordPress——两个最受欢迎的 CMS 解决方案中导出并安装了模板。\n\n但我们与 Artisteer\
  \ 的冒险还未结束。通过对生成代码做少量修改，你可以实现“看似在 Artisteer 中无法完成”的事情。\n\n## 4 个技巧和窍门\n\nArtisteer\
  \ 的大部分功能已介绍完毕，你现在可以自行设计和使用模板。最后要介绍的是技巧和窍门——可在 Artisteer 中直接实现的效果。这些需要对导出代码做少量修改，但修改并不困难，我会详细说明。这里的例子是许多\
  \ Artisteer 用户常问的问题。我相信你也会有自己的问题。Extensoft 邮件订阅是获取技巧的好来源，其中会发布一些不错的技巧。Artisteer\
  \ 官方网站 www.artisteer.com 和 Szablonik www.szablonik.net 也是很好的知识来源，后者是另一个专注于 Artisteer\
  \ 的网站。你也可以查看我的博客 http://artisteer.fajnyblog.eu，我会不时发布技巧。\n\n### 幻灯片中的图片链接\n\n此技巧适用于\
  \ HTML 模板。示例项目为 `slidesAsLinks.artx` 文件。\n\n本技巧将展示如何修改幻灯片，使每张幻灯片或其中部分幻灯片链接到其他网站。\n\
  \n创建幻灯片时可定义特定图片，但无法将幻灯片设为链接。第一个想法当然是点击文章中的任意位置，然后在菜单中导航到 编辑 | HTML 以显示包含幻灯片的文章源代码，并在不退出程序的情况下进行修改。让我们开始。\n\
  \n- 1. 幻灯片位置会找到类似以下内容：\n\n```\n<div class=\"image-caption-wrapper\" style=\"width:\
  \ 55%;\nfloat: left\">\n[collage_79]\n</div>\n```\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_126_0.png)\n\
  \n### 下载示例代码\n\n你可以在 http://www.packtpub.com 从账户下载所有已购买的 Packt 书籍的示例代码文件。如果你是在其他地方购买本书，可访问\
  \ http://www.packtpub.com/support 注册，以便将文件直接发送到你的邮箱。\n\n- 2. 哎呀！看起来 Artisteer 并非以源代码形式呈现幻灯片，而是以特殊标签呈现。整个幻灯片以\
  \ [collage_79] 呈现（数字可能不同，但整体模式始终相同）。\n\n- 3. 这样我们别无选择，只能导出模板然后编辑源代码。将模板导出为文件夹，并在文本编辑器中打开\
  \ index.html 文件。查找负责显示幻灯片的代码部分。你会找到类似以下内容：\n\n```\n<div class=\"art-slider art-slidecontainer79\"\
  >\n  <div class=\"art-slider-inner\">\n    <div class=\"art-slide-item art-slide790\"\
  ></div>\n    <div class=\"art-slide-item art-slide791\"></div>\n    <div class=\"\
  art-slide-item art-slide792\"></div>\n    <div class=\"art-slide-item art-slide793\"\
  ></div>\n  </div>\n</div>\n```\n\n- 4. 为使代码更清晰，我们添加一些注释：\n\n```\n<!-- The external\
  \ container, containing the slideshow -->\n<div class=\"art-slider art-slidecontainer79\"\
  >\n  <!-- slideshow container -->\n  <div class=\"art-slider-inner\">\n    <!--\
  \ first slide -->\n    <div class=\"art-slide-item art-slide790\"></div>\n    <!--\
  \ second slide -->\n    <div class=\"art-slide-item art-slide791\"></div>\n    <!--\
  \ third slide -->\n    <div class=\"art-slide-item art-slide792\"></div>\n    <!--\
  \ fourth slide -->\n    <div class=\"art-slide-item art-slide793\"></div>\n  </div>\n\
  </div>\n```\n\n\n\n幻灯片显示为两个容器，内部容器包含其自己的内部容器——特别是幻灯片。每个幻灯片都表示为一个 `<div>` 元素（在 `<header>`\
  \ 部分中的 jQuery 脚本执行其工作之前）。\n\n5. 要使每个幻灯片成为链接，我们将在每个幻灯片中添加一些基本的 JavaScript；具体来说，我们将处理\
  \ `onClick` 事件（换句话说，我们将定义当访客点击代表特定幻灯片的此 `<div>` 元素时应该发生什么）。由于这只是一个单行脚本，因此无需将其作为\
  \ `<script>` 元素在代码中分离。\n\n我们将按照以下模式添加内容：\n\n```\nonclick=location.href('address_to_be_redirected_to')\n\
  ```\n\n例如：\n\n```\nonclick=location.href('www.google.com')\n```\n\n此 `onclick` 事件将把访客重定向到\
  \ www.google.com。\n\n6. 让我们修改代码并添加链接：\n\n```\n<div class=\"art-slider art-slidecontainer79\"\
  >\n  <!-- The external container, containing the slideshow -->\n  <div class=\"\
  art-slider art-slidecontainer79\">\n    <!-- Slideshow container -->\n    <div class=\"\
  art-slider-inner\">\n      <!-- First slide. Link to: www.artisteer.com -->\n  \
  \    <div class=\"art-slide-item art-slide790\"onclick=\"location.href='http://www.artisteer.com'\"\
  ></div>\n      <!-- Second slide. Link to: www.google.com -->\n      <div class=\"\
  art-slide-item art-slide791\" onclick=\"location.href='http://www.google.com'\"\
  ></div>\n      <!-- Third slide. Link to: www.example.com -->\n      <div class=\"\
  art-slide-item art-slide792\" onclick=\"location.href='http://www.example.com'\"\
  ></div>\n      <!-- Fourth slide. Link to www.packtpub.com -->\n      <div class=\"\
  art-slide-item art-slide793\" onclick=\"location.href='http://www.packtpub.com'\"\
  ></div>\n    </div>\n  </div>\n</div>\n```\n\n7. 保存文件并在浏览器中查看。幻灯片现在充当链接。解决方案有效，但让鼠标指针指示存在链接会很有用。我们将通过一点\
  \ CSS 实现这一点，设置鼠标光标的外观。我们需要在每个幻灯片定义中添加以下文本：\n\n```\nstyle=\"cursor: pointer;\"\n\
  ```\n\n8. 修改后，我们将有以下代码：\n\n```\n<!-- The external container, containing the slideshow\
  \ -->\n<div class=\"art-slider art-slidecontainer79\">\n    <!-- Slideshow container\
  \ -->\n    <div class=\"art-slider-inner\">\n        <!-- First slide. Link to:\
  \ www.artisteer.com -->\n        <div class=\"art-slide-item art-slide790\"\nonclick=\"\
  location.href='http://www.artisteer.com'\"\nstyle=\"cursor: pointer;\"></div>\n\
  \        <!-- Second slide. Link to: www.google.com -->\n        <div class=\"art-slide-item\
  \ art-slide791\"\nonclick=\"location.href='http://www.google.com'\"\nstyle=\"cursor:\
  \ pointer;\"></div>\n        <!-- Third slide. Link to: www.example.com -->\n  \
  \      <div class=\"art-slide-item art-slide792\"\nonclick=\"location.href='http://www.example.com'\"\
  \nstyle=\"cursor: pointer;\"></div>\n        <!-- Fourth slide. Link to www.packtpub.com\
  \ -->\n        <div class=\"art-slide-item art-slide793\"\nonclick=\"location.href='http://www.packtpub.com'\"\
  \nstyle=\"cursor: pointer;\"></div>\n    </div>\n</div>\n```\n\n9. 好多了！我们应该做的最后一件事是添加提示以告知访客将被重定向到哪个页面。为此，我们需要在代表幻灯片的每个\
  \ <div> 中添加 title 参数，如下所示：\n\n```\ntitle=\"description of the link\"\n```\n\n10.\
  \ 我们的最终代码如下所示：\n\n```\n<!-- The external container, containing the slideshow -->\n\
  <div class=\"art-slider art-slidecontainer79\">\n    <!-- Slideshow container -->\n\
  \    <div class=\"art-slider-inner\">\n        <!-- First slide. Link to: www.artisteer.com\
  \ -->\n        <div class=\"art-slide-item art-slide790\"\nonclick=\"location.href='http://www.artisteer.com'\"\
  \nstyle=\"cursor: pointer;\" title=\"Artisteer official page\"></div>\n        <!--\
  \ Second slide. Link to: www.google.com-->\n        <div class=\"art-slide-item\
  \ art-slide791\"\nonclick=\"location.href='http://www.google.com'\"\nstyle=\"cursor:\
  \ pointer;\" title=\"Search engine\"></div>\n    <!-- Third slide. Link to: www.example.com\
  \ -->\n    <div class=\"art-slide-item art-slide792\"\nonclick=\"location.href='http://www.example.com'\"\
  \nstyle=\"cursor: pointer;\" title=\"Example domain\"></div>\n    <!-- Fourth slide.\
  \ Link to www.packtpub.com -->\n    <div class=\"art-slide-item art-slide793\"\n\
  onclick=\"location.href='http://www.packtpub.com'\"\nstyle=\"cursor: pointer;\"\
  \ title=\"Visit Packt Publishing\"></div>\n    </div>\n</div>\n```\n\n11. 就这样。修改后，我们幻灯片中的每个链接都是指向另一个网页的链接。鼠标光标的形状是手形，这是超链接的典型特征。此外，还有简短的说明，说明您将被重定向到哪里。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_129_0.png)\n\n## 从某些页面移除垂直菜单\n\n此提示适用于\
  \ HTML 模板。一个示例项目将是 chapterTwo.artx 项目文件。\n\n在 Chapter2《逐步模板》中，我们准备了一个带有水平菜单和垂直菜单的模板。水平菜单是我们网站的主菜单，显示与直接链接页面相关的项目，而垂直菜单是补充菜单，显示我们提供的详细信息。我们得出的结论是，组织菜单的最佳方式是仅在\
  \ Offer 页面的子页面上显示垂直菜单。这比在每个页面上显示我们提供的详细信息更好、更合乎逻辑。\n\n不幸的是，Artisteer 不允许我们定义菜单应在哪些页面上显示，并且两个菜单都在每个页面上显示。解决此限制的方法是创建带有两个菜单的模板（如我们所做的那样），然后从我们不想显示它的页面中删除垂直菜单。这样我们将使垂直菜单充当水平菜单的子菜单。让我们开始：\n\
  \n- 1. 让我们再次从 *第 2 章，逐步模板* 导出项目，然后打开 `index.html` 文件（我们网站的首页）。\n- 2. 现在查看 Artisteer\
  \ 创建的文件。你将看到四个 `.html` 文件，它们是站点结构顶层的页面，即 `home`、`about me`、`offer` 和 `contact`。\n\
  - 3. **Offer** 页面的子页面位于名为 `Offer` 的单独文件夹中。文件夹和文件的结构反映了网站的逻辑结构。这使我们的任务更简单。位于 `Offer`\
  \ 文件夹中的所有 `.html` 文件都应显示垂直菜单，而我们应将其从位于主项目文件夹中的 `.html` 文件中删除。\n- 4. 让我们打开 `index.html`\
  \ 文件并在代码中搜索垂直菜单。你会找到类似以下的内容：\n\n```\n<div class=\"art-vmenublockcontent\">\n<ul\
  \ class=\"art-vmenu\">\n<li>\n<a href=\"offer.html\">Offer</a>\n<ul>\n<li>\n<a href=\"\
  offer/websites.html\">Websites</a>\n</li>\n<li>\n<a href=\"offer/wordpress.html\"\
  >WordPress</a>\n</li>\n<li>\n<a href=\"offer/joomla.html\">Joomla!</a>\n</li>\n\
  <li>\n<a href=\"offer/dotnetnuke.html\">DotNetNuke</a>\n</li>\n</ul>\n</li>\n</ul>\n\
  </div>\n```\n\n我们看到整个垂直菜单的主容器是一个 `<div>` 元素，其类为 `art-vmenublockcontent`。这是我们任务的关键信息。然后菜单项是一个列表。菜单项的下一级表示为该列表的下一级。\n\
  \n- 5. 要从页面中删除垂直菜单，只需删除主菜单容器及其所有内容（之前的代码）。现在，保存文件并在浏览器中刷新页面。我们看到垂直菜单已从 **HOME**\
  \ 页面消失。\n- 6. 太好了！现在，对其余的顶级站点重复整个操作，即 `about_me.html`、`offer.html` 和 `contact.html`\
  \ 文件。\n  结果，这些页面上不再有垂直菜单。\n- 7. 因为我们没有触及 `Offer` 文件夹中的页面，所以 **Offer** 页面的子页面（**Websites**、**WordPress**、**Joomla!**\
  \ 和 **DotNetNuke**）显示垂直菜单。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_131_0.png)\n\
  \n我们已从 HOME 页面删除了垂直菜单\n\n8. 我们的工作已经完成，但如果仔细查看垂直菜单，你会发现它显示了两级项目，如以下截图所示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_132_0.png)\n\
  \n我们的垂直菜单显示了两级项目\n\n9. 第一级只包含一个项目，**Offer**。我们必须保留这个项目，因为在 Artisteer 中设计时，菜单不能只包含其子项目而不显示其父项目。但很明显，在这种情况下\
  \ **Offer** 是不必要的，所以让我们查看代码并尝试修复它。如我们在第 4 步的先前代码中所见，菜单项构成列表。每一级下一级项目都表示为一个新的嵌套列表：\n\
  \n```\n<!--List representing our menu -->\n<ul class=\"art-vmenu\">\n<li>\n    <!--\
  \ First level item - Offer -->\n    <a href=\"offer.html\">Offer</a>\n    <!-- Nested\
  \ list - next level of items -->\n<ul>\n<!-- First subitem -->\n    <li>\n    <a\
  \ href=\"offer/websites.html\">Websites</a>\n    </li>\n<!-- Second subitem -->\n\
  \    <li>\n    <a href=\"offer/wordpress.html\">WordPress</a>\n    </li>\n<!-- Next\
  \ subitems... -->\n    <li>\n    <a href=\"offer/joomla.html\">Joomla!</a>\n   \
  \ </li>\n    <li>\n    <a href=\"offer/dotnetnuke.html\">DotNetNuke</a>\n    </li>\n\
  </ul>\n</li>\n</ul>\n```\n\n10. 让我们打开 offer.html 文件并将其更改为仅包含我们子页面的单级列表。我们不需要第一个项目\
  \ **Offer**，因此可以将其删除。现在代码如下：\n\n```\n<!--List representing our menu -->\n<ul class=\"\
  art-vmenu\">\n    <!-- Nested list - next level of items -->\n<ul>\n<!-- First subitem\
  \ -->\n    <li>\n        <a href=\"offer/websites.html\">Websites</a>\n    </li>\n\
  <!-- Second subitem -->\n    <li>\n        <a href=\"offer/wordpress.html\">WordPress</a>\n\
  \    </li>\n<!-- Next subitems... -->\n    <li>\n        <a href=\"offer/joomla.html\"\
  >Joomla!</a>\n    </li>\n    <li>\n        <a href=\"offer/dotnetnuke.html\">DotNetNuke</a>\n\
  \    </li>\n</ul>\n</ul>\n```\n\n11. 因为菜单中不再有任何父项目，所以在代码中保留两个嵌套列表（<ul> 标签）没有意义。让我们删除内部列表。现在得到以下代码：\n\
  \n```\n<ul class=\"art-vmenu\">\n    <li>\n        <a href=\"offer/websites.html\"\
  >Websites</a>\n    </li>\n    <li>\n        <a href=\"offer/websites.html\">Websites</a>\n\
  \    </li>\n    <li>\n        <a href=\"offer/wordpress.html\">WordPress</a>\n \
  \   </li>\n    <li>\n        <a href=\"offer/joomla.html\">Joomla!</a>\n    </li>\n\
  \    <li>\n        <a href=\"offer/dotnetnuke.html\">DotNetNuke</a>\n    </li>\n\
  </ul>\n```\n\n12. 保存文件并刷新网站。你的垂直菜单现在应如以下截图所示显示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_134_0.png)\n\
  \n我们的垂直菜单，仅将子页面显示为顶级项目\n\n## 为特定模块设置样式\n\n此提示适用于 Joomla! 模板。例如 `specialModule.artx`\
  \ 文件。\n\n此提示基于 Joomla! 中使用的标准技术，但在 Artisteer 的情况下，需要进一步解释。\n\n这种情况很常见，你希望你的某个模块与其他模块看起来不同。例如，你可能希望登录模块或其他模块与其他模块区分开来。对于自定义\
  \ HTML 模块，你当然可以直接在模块中修改 HTML，但此提示允许你在不触碰 HTML 的情况下完成此操作，并且仅基于 CSS 修改。\n\n> 此技术适用于从模板样式表获取\
  \ CSS 的模块。它不适用于单独渲染并带有自己样式的自定义扩展。在这种情况下，你必须查看特定扩展的源代码并相应地修改代码。\n\n在我们的示例中，我们将区分登录模块，使其对访客更醒目。\n\
  \n在 Artisteer 中设计时，你无法使某个模块与其他模块不同，因为更改会传播到其他区块。这就是我们需要解决方案的原因。\n\n我们正在处理带有内容的 `specialModule.artx`\
  \ 项目。打开它并导出到 Joomla!。你的网站应如下截图所示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_135_0.png)\n\
  \n示例网站，左右两列有两个相同的模块\n\n该网站只有一个页面，采用三列布局，左右两列各有一个相同的模块。它们作为两个独立的自定义 HTML 模块导入，但都由\
  \ Artisteer 创建。我们的任务是在不修改其 HTML 的情况下区分第二个模块，具体如下：\n\n- 1. 在 Joomla! 的管理面板中，导航到 **Extensions\
  \ | Module Manager**。你将进入 **Module Manager** 中的 **Modules** 屏幕，其中将列出所有已安装的模块。找到并点击\
  \ **Second Block** 模块以进入其设置。\n- 2. 在 **Module Manager: Module Custom HTML**（**Second\
  \ Block** 模块设置）中，展开 **Advanced Options** 区域并找到 **Module Class Suffix** 字段。在此字段中，我们将输入合适的后缀。\n\
  \n3. 如以下截图所示，在 Module Class Suffix 字段中输入 _SpecialModule：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_136_0.png)\n\
  \n将 _SpecialModule 作为模块类后缀输入\n\n4. 根据你在该字段中输入的 Module Class Suffix 名称，Joomla! 将搜索在模板\
  \ CSS 样式中定义的新类定义。它是按照 art-block + 空格 + clearfix + 你在字段中输入的内容 的模式进行的。\n\n在我们的情况下，这意味着\
  \ art-block + _SpecialModule = art-block clearfix_SpecialModule\n\nJoomla! 在渲染页面时，将在\
  \ CSS 样式表中查找 art-block clearfix_SpecialModule 定义。这意味着我们的区块将使用来自两个类的样式：art-block\
  \ 和 clearfix_SpecialModule。\n\nart-block 类最初由 Artisteer 定义。查看源代码中的此类并分析它。此类定义了区块的背景、边框和圆角。我们的区块将从两个类获取样式，这非常方便——我们无需从头定义一切，只需添加补充定义即可。更重要的是，因为我们的类定义在后面，我们的定义将覆盖来自\
  \ Artisteer 的原始定义。我们可以随时删除我们的类以恢复模板的原始外观。\n\n5. 我们需要在 CSS 模板文件中添加我们的类。此文件名为 template.css，位于模板文件夹的\
  \ CSS 文件夹中。在编辑器中打开此文件，并在末尾写入：\n\n```\n/*** My Classes ***/\n.clearfix_SpecialModule\n\
  {\nborder: 1pt solid red;\n  background-color: #FFFF99;\n}\n```\n\n我们已覆盖边框的宽度和颜色，并将背景颜色设置为淡黄色。保存文件并刷新页面。你应该会看到如下截图所示的内容：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_137_0.png)\n\n右侧的区块与左侧的孪生兄弟看起来大不相同\n\n\
  6. 到目前为止，一切顺利。让我们执行下一步并更改文本的字体。在我们的类中添加另一行代码，使其如下所示：\n\n```\n.clearfix_SpecialModule\n\
  {\n  border: 1pt solid red;\n  background-color: #FFFF99;\n  color: blue;\n}\n```\n\
  \n7. 保存更改，刷新页面，……什么也没发生！有些不对劲。撤销更改（从我们的类中删除最后的定义），然后让我们查看页面的源代码。显示我们区块的代码片段如下：\n\
  \n```\n<div class=\"art-block clearfix_SpecialModule\">\n  <div class=\"art-blockheader\"\
  >\n    <h3 class=\"t\">Second Block</h3>\n  </div>\n  <div class=\"art-blockcontent\"\
  >\n    <div class=\"custom_SpecialModule\"  >\n```\n\n```\n    <!--\n    content\
  \ of our block:\n    <p> elements, image and list\n    -->\n    </div>\n    </div>\n\
  \    </div>\n```\n\n现在我们需要牢记以下规则：\n\n- `DIV` 元素包含整个区块，属于以下两个类：\n  - `art-block`\n\
  \  - `clearfix_SpecialModule`（根据我们的后缀）\n- 标题位于一个 `DIV` 元素内。该元素属于 `art-blockheader`\
  \ 类。标题本身是一个 `h3` 元素，属于 `t` 类。\n- 我们区块的内容位于一个 `DIV` 元素内。该元素属于 `custom_SpecialModule`（根据我们的后缀）类，并且位于另一个属于\
  \ `art-blockcontent` 类的 `DIV` 元素内。\n\n我们区块的结构显示了以下方案：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_138_0.png)\n\
  \n构成我们区块的元素的方案\n\n\n\n8. 知道了这一点，我们可以编写一些额外的定义，让我们的区块看起来更不一样。我们将把标题的颜色设置为绿色，以斜体样式显示内容文本，更改其字体样式，并为图片添加边框：\n\
  \n```\n/*** My Classes ***/\n.clearfix_SpecialModule\n{\n    border: 1pt solid red;\n\
  \    background-color: #FFFF99;\n}\n\n.clearfix_SpecialModule .art-blockheader h3\n\
  {\n    color: green;\n}\n\n.custom_SpecialModule p\n{\n    font-family: \"Tahoma\"\
  ;\n    font-style: italic;\n}\n\n.clearfix_SpecialModule .custom_SpecialModule img\n\
  {\n    border: 1px solid #000000;\n}\n```\n\n好的，我们已经实现了目标，让我们的区块看起来不同。但这种技术的最大优势是，在样式定义好之后，你可以将其用于任何模块，而无需额外工作。为了说明这一点，我们将从我们的\
  \ **Second Block** 中移除样式并将其应用到登录框：\n\n- 1. 在管理面板中编辑 **Second Block** 模块并清空 **Module\
  \ Class Suffix** 字段。**Second Block** 将再次看起来与 **First Block** 完全相同。\n- 2. 创建 **Login**\
  \ 模块并将其放置在右侧栏中 **Second Block** 的下方。显示该模块（**position-7**）。\n- 3. 编辑你的 **Login**\
  \ 模块的首选项，并在 **Module Class Suffix** 字段中输入 `_SpecialModule`（这就是我们的后缀）。\n- 4. 保存更改并刷新网站。你会注意到\
  \ **Login** 模块已采用我们之前定义的样式。\n\n## 提示和技巧\n\n当然，这个模块包含一些未定义的独特元素，但整体效果是可行的。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_140_0.png)\n\
  \n之前对登录表单所做的修改\n\n## 从零开始设置样式\n\n在之前的示例中，我们通过将我们的类与标准的 `art-block` Artisteer 类混合来设置\
  \ **Second Block** 的样式。但有时，你可能更感兴趣的是移除所有模板样式并从零开始设置某个模块的样式。为此目的，Artisteer 提供了一个名为\
  \ `art-nostyle` 的特殊类。该类的名称应为后缀的第一部分。\n\n> > 事实上，当你使用 `art-nostyle` 类来组成你的后缀时，模块也会获得两个类的定义，即\
  \ `art-nostyle` 和你自己的（名称来自后缀）。但使用 `art-nostyle` 类会导致模块在省略模板样式的情况下显示，因此实际上效果就像模块根本没有样式一样。\n\
  \n在本示例中，我们将在项目中使用相同的 **Second Block**。步骤如下：\n\n- 1. 如果你已根据之前的示例修改了模板 CSS 文件，请删除模板并重新安装一次。这将防止你的\
  \ `template.css` 文件变得杂乱。假设 **First Block** 和 **Second Block** 看起来相同，编辑 **Second\
  \ Block** 模块属性，并在 **Module Class Suffix** 字段中输入 `art-nostyle MySpecialModule`。\n\
  - 2. 保存更改并刷新网站。你会看到我们的 **Second Block** 再次与 **First Block** 不同，但这次它看起来就像根本没有样式一样：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_141_0.png)\n\n启用新后缀后，我们右侧栏中的 Second Block\
  \ 完全没有定义的样式\n\n> 这次我们在后缀中没有用 _ 字符开头我们的类名。我们没有这样做，因为当我们将后缀与其中一个预定义的 Artisteer 类（在本例中为\
  \ `art-nostyle`）组合时，单词 `clearfix` 不会被添加到我们的类名中。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_142_0.png)\n\
  \n- 3. 使用这种形式的后缀会导致 Joomla! 在渲染我们的 **Second Block** 时同时查找 `art-nostyle` 和 `MySpecialModule`\
  \ 类。第一个是标准的 Artisteer 类。我们需要在 `template.css` 文件中添加第二个定义。但在这样做之前，让我们先看看生成的页面的源代码：\n\
  \n```\n<!-- begin nostyle -->\n<div class=\"art-nostyle MySpecialModule\">\n   \
  \ <h3>Second Block</h3>\n    <!-- begin nostyle content -->\n        <div class=\"\
  customart-nostyle MySpecialModule\">\n        <!--\ncontent of our block:\n<p> elements,\
  \ image and list\n        -->\n        </div>\n    <!-- end nostyle content -->\n\
  </div>\n<!-- end nostyle -->\n```\n\n这次我们的任务更容易，因为 Artisteer 插入了注释，告知我们页面未样式化片段的开始和结束。整个区块位于一个\
  \ DIV 元素中，该元素属于两个类，即 `art-nostyle` 和 `MySpecialModule`（`class=\"art-nostyle MySpecialModule\"\
  `），根据我们在 Joomla! 中输入的后缀。区块的标题只是一个 h3 元素，没有任何类。我们的区块内容位于另一个 DIV 元素中，该元素也属于类 `custom\
  \ art-nostyle` 和 `MySpecialModule`（`class=\"custom art-nostyle MySpecialModule\"\
  `）。我们希望组合样式，使我们的 **Second Block** 看起来与之前的示例相似。\n\n- 4. 所以，让我们打开 `template.css` 文件并为我们的类添加定义。因为我们决定不扩展块元素的现有样式（`art-block`\
  \ 类），而是自己设计一切，所以我们必须定义比上次更多的属性：\n\n```\n/*** My Classes ***/\n/* Main container\
  \ of our block */\n.MySpecialModule\n{\n    /* rounded corners of main container\
  \ */\n    -webkit-border-radius: 6px 6px 0 0;\n    -moz-border-radius: 6px 6px 0\
  \ 0;\n    border-radius: 6px 6px 0 0;\n    /* margins, border and background color\
  \ */\n    margin: 7px;\n    border: 1pt solid red;\n    background-color: #FFFF99;\n\
  }\n\n/* Block header */\n.MySpecialModule h3\n{\n    padding: 12px 3px;\n    color:\
  \ green;\n    font-size: 20px;\n    font-family: Moul, Arial, 'Arial Unicode MS',\
  \ Helvetica, Sans-Serif;\n    font-weight: normal;\n    margin: 0 5px;\n}\n\n/*\
  \ Paragraph in block content */\n.MySpecialModule p\n{\n    font-family: \"Tahoma\"\
  ;\n    font-size: 10pt;\n    font-style: italic;\n    line-height: 180%;\n}\n\n\
  /* Image border */\n.MySpecialModule img\n{\n    border: 1px solid #000000;\n}\n\
  \n/* List inside block content */\n.MySpecialModule ul\n{\n    margin-left: 10px;\n\
  }\n```\n\n```\n.MySpecialModule ul li\n{\n  list-style-image: url('./images/blockbullets.png');\n\
  \  margin: 10px 15px;\n}\n```\n\n- 5. 保存更改，刷新网站，以下截图将会出现：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_144_0.png)\n\
  \n我们更改的当前状态\n\n- 6. 一切似乎都相当不错，但我们不希望内部 DIV 元素周围有边框。此边框在我们的 .MySpecialModule 类中定义，我们必须为包含区块内容的\
  \ DIV 元素排除它（再次查看方案）。再次编辑 template.css 文件，并在末尾追加以下代码：\n\n```\n.customart-nostyle.MySpecialModule\n\
  {\n  margin-top: 0;\n  border: none;\n}\n```\n\n- 7. 保存更改并刷新网站。就这样！我们通过将模块后缀与内置的\
  \ Artisteer art-nostyle 类结合，从零开始设置了 Second Block 的样式。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_145_0.png)\n\
  \n更改后的模板\n\n## 与其他 Artisteer 生成类的组合\n\n在第一个示例中，我们将我们的类与 Artisteer 生成的类 art-block\
  \ 组合。在第二个示例中，我们从零开始设置模块样式，将我们的类与 art-nostyle Artisteer 类组合。根据你的需求，将模块后缀与其他标准 Artisteer\
  \ 生成的类（即用于帖子的 art-article）组合可能很有用。分析导出的模板的 template.css 文件是一个好主意，也是一个很好的练习。分析模板目录中主\
  \ Joomla! 模板文件（index.php 文件）以及 Joomla! 生成的源代码也是一个很好的练习。对 Artisteer 生成的模板是如何构建和工作的良好理解，在进行模板的自定义修改时非常有用。\n\
  \n\n\n\n## 为项目添加额外的 CSS\n\n本技巧适用于所有类型的模板。在本示例中，我们将使用 HTML 模板进行操作。\n\n如果你需要向原始模板的样式表中添加一些自己的\
  \ CSS，可以直接从 Artisteer 中进行操作。此功能也可能很有用，如果你想修改原始 Artisteer 类。以下是本技巧的步骤：\n\n- 1. 在本示例中，我们使用\
  \ AddCssToProject.artx 项目文件。打开它。这是我们在第 2 章《逐步模板》中看到的站点，但我在联系页面中添加了一个简单的联系表单。\n\n\
  在本示例中，我们将添加一些 CSS 定义以实现三个目标：\n- 我们希望更改 CSS 类的默认 Artisteer 前缀。\n- 我们希望在鼠标光标移动到图片上时区分图片（悬停效果）。此效果应仅适用于具有\
  \ Lightbox 效果的图片。\n- 我们希望区分联系表单中的活动控件。\n\n- 2. 要向生成的代码添加 CSS，请单击 Export 按钮，然后在 Export\
  \ 窗口中单击 Options 按钮。在出现的 Options 窗口中，单击左侧的 CSS Options 面板。窗口右侧将显示可用的选项。你会看到有两个字段，即\
  \ CSS Prefix: 和 Additional CSS Styles:\n\nCSS Prefix: 字段包含将用于命名导出模板中生成的 CSS 类的前缀。默认值是\
  \ art-。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_146_0.png)\n\n- 3. 回顾我们在 *从头开始设置样式*\
  \ 技巧中使用的标准类。我们使用的是 `art-block`、`art-nostyle` 和 `art-article` 类。其名称的第一部分就是你在该字段中输入的前缀。假设我在这里写\
  \ `jakub-`（取自我的名字）。在这种情况下，Artisteer 将生成类名，即 `jakub-block`、`jakub-nostyle` 或 `jakub-article`，而不是\
  \ `art-block`、`art-nostyle` 或 `art-article` 类。更改默认 CSS 类前缀不会改变代码中的任何内容，只是类名。那么为什么要这样做呢？有两个原因：\n\
  - 有时你可能想隐藏你是用 Artisteer 准备项目的事实。有些人认为 Artisteer 生成的模板比手工制作或使用其他工具制作的模板便宜。他们是否正确超出了本书的范围。如果你需要，可以将此前缀更改为其他任何内容。\n\
  - 你可能有一个在指定类名上运行的外部脚本。在这种情况下，调整模板代码中的名称可能比调整脚本中的名称更快。\n\n- 4. **CSS Prefix:** 字段下方的\
  \ **Additional CSS styles:** 字段是一个文本区域，你可以在其中放置任何额外的 CSS 代码。此代码将被添加到 `style.css`\
  \ 文件的末尾。不幸的是，没有代码编写支持，例如语法着色或至少更改字体，因此最好在外部编辑器中准备代码，然后在此处粘贴。\n\n- 5. 好的，让我们在 **Additional\
  \ CSS styles:** 字段中放入一些代码来实现我们的任务。我们希望在鼠标光标悬停在图片上时区分图片，并在控件处于活动状态时区分联系表单中的控件。将以下代码写入此字段：\n\
  \n/* hover pseudo-class for images\n   We use opacity filter */\nimg:hover\n{\n\
  \    opacity : 0.4;\n    filter: alpha(opacity=40);\n}\n\n/* and for inputs while\
  \ they are focused.\n   We set their background color as yellow */\ninput:focus\n\
  {\n    background-color: yellow;\n}\n```\n\n- 6. 单击 OK 按钮关闭窗口并导出模板。你将看到我们的代码成功运行，如以下屏幕截图所示：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_148_0.png)\n\n活动输入元素用黄色背景区分\n\n> 实际上你甚至不需要导出模板就可以观察到更改。我们的附加代码也在\
  \ Artisteer 界面中被解释。\n\n唯一的问题是图像效果适用于所有图像，而不仅仅是具有 Lightbox 效果的图像。好吧，这是正确的，因为我们为所有图像定义了\
  \ hover 伪类。为了解决这个问题，我们必须知道启用了 Lightbox 效果的图片的类。查看我们主页的源代码，你会注意到该类称为 img.Lightbox。\n\
  \n- 7. 好的，那么让我们修改我们的代码：\n\n```\nimg.art-Lightbox:hover\n{\n  opacity : 0.4;\n  filter:\
  \ alpha(opacity=40); /* msie */\n}\n\ninput:focus\n{\n  background-color: yellow;\n\
  }\n```\n\n到目前为止，我们的解决方案按计划工作——我们为具有活动 Lightbox 效果的图片缩略图（图像库）提供了悬停效果，而联系表单上的控件在获得焦点时用黄色背景区分。我们修改了原始\
  \ Artisteer 创建的 `img.art-Lightbox` 类并为活动输入添加了伪类。\n\n- 8. 如果你编辑导出模板中的 `style.css`\
  \ 文件，你会看到我们的代码被适当的注释包围，显示修改的开始和结束。\n\n在 **Additional CSS styles:** 字段中编写代码并不太舒适，你可能会想为什么要把代码放在这里而不是直接编辑导出文件的代码，或使用自己的附加\
  \ CSS 文件。我同意使用任何代码编辑器编写代码肯定更方便，但你应该记住使用本示例中描述的技术的一个优点，直接在 Artisteer 中操作也有一些优点。如果你直接将代码放入\
  \ Artisteer，你的代码将与 `.artx` 项目文件一起存储，这意味着你不必记住你的更改并在每次导出后重写它们，这对未来的更改很方便。这就是我认为如果更改不大并且你不必触及导出的其余代码，这可能是一种相当好的方法。\n\
  \n## 修改 CSS 文件的另一种方法\n\n本技巧适用于所有类型的模板。一个例子是 `OneDayBlue.artx` 文件。\n\n在 *从头开始设置样式*\
  \ 和 *为项目添加额外的 CSS* 技巧中，我们修改了相关项目的 CSS 样式表。这些示例中的每一个都提出了解决问题的不同方法：\n- 我们修改了一个导出的\
  \ CSS 模板文件\n- 我们直接在 Artisteer 中添加了一些 CSS 定义\n\n这些技术各有优缺点。如果你编辑导出的 CSS 文件，可以使用你喜欢的文本编辑器进行操作，该编辑器可能配备了许多使工作更舒适的工具（如代码高亮）。此外，在编辑导出的\
  \ CSS 文件时，你可以看到所有内容（模板中使用的 CSS 定义），而无需蒙眼编写。这种方法的缺点是，如果你使用 Artisteer（使用 GUI）修改项目并再次导出新版本，你的文件将被新文件覆盖，你的修改将丢失。你必须重写你的更改。\n\
  \n如果你直接在 Artisteer 中添加 CSS，你的修改将存储在 .artx 项目中。你可以多次修改项目并导出它，你的附加 CSS 代码将被保留。虽然这听起来像是一种更好的方法，但由于\
  \ Artisteer 缺乏编辑工具而在其中编写 CSS 的不便，以及你看不到其余代码的事实，这使得它非常不方便。\n\n第三种方法是将所有修改写入并保存到单独的\
  \ CSS 文件中，然后将其与导出的其余文件连接起来。你可以将 CSS 文件的副本与 Artisteer 项目一起存储。如果你对 Artisteer 中的内容进行了更改，可以导出项目并再次将其与你的文件连接，所需的工作量和时间最少。这样，你就可以舒适地使用你喜欢的文本编辑器编辑\
  \ CSS 代码，并且在下一次导出时不会丢失你的工作。\n\n让我们在实践中看看这种技术。打开示例文件（OneDayBlue.artx）并查看模板。这只是 Artisteer\
  \ 的 Blank 模板，只有一个页面，页眉中有一个标准的橙色标题：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_150_0.png)\n\
  \n我们的任务并不令人惊讶。我们需要修改导出的 CSS 文件以使此文本变为蓝色。我们按如下方式操作：\n\n- 1. 将此模板导出为 HTML 模板到 OneDayBlue\
  \ 文件夹并编辑 style.css 文件。站点标题的 CSS 定义是：\n\n```\n.art-headline,\n.art-headline a,\n\
  .art-headline a:link,\n.art-headline a:visited,\n.art-headline a:hover\n{\nfont-size:\
  \ 36px;\nfont-family: Arial, 'Arial Unicode MS', Helvetica, Sans-Serif;\nfont-weight:\
  \ normal;\nfont-style: normal;\ntext-decoration: none;\ntext-shadow: 0px 2px 3px\
  \ rgba(0, 0, 0, 0.3);\npadding: 0;\nmargin: 0;\ncolor: #FA6114 !important;\nwhite-space:\
  \ nowrap;\n}\n```\n\n\n\n2. 为了实现我们的目标并使标题变蓝，我们需要覆盖 color 属性。定义如下：\n\n```\n.art-headline,\n\
  .art-headline a,\n.art-headline a:link,\n.art-headline a:visited,\n.art-headline\
  \ a:hover\n{\n    color: blue !important;\n}\n```\n\n3. 我们可以将上述定义追加到 style.css 文件的末尾。我们也可以直接在\
  \ Artisteer 中于 Additional CSS styles: 字段中输入它，方法是导航到 Export | Options | CSS Options。结果相同且有效（标题为蓝色）。\n\
  \n4. 与其这样，我们来创建一个全新的文件并将其命名为 myStyles.css。\n\n5. 在此文件中写入我们的定义并将其保存到导出的模板文件夹（OneDayBlue）中。在浏览器中查看网站。我们的修改尚未生效，因为我们还没有将文件与模板连接起来。\n\
  \n6. 要将文件与模板连接，请编辑 index.html 文件。在文件开头，你会找到连接 CSS 文件的行：\n\n```\n<!--[if lt IE 9]><script\n\
  src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"></script>\n<![endif]-->\n\
  <link rel=\"stylesheet\" href=\"style.css\" media=\"screen\">\n<!--[if lte IE 7]><link\
  \ rel=\"stylesheet\" href=\"style.ie7.css\"\nmedia=\"screen\" /><![endif]-->\n<link\
  \ rel=\"stylesheet\" href=\"style.responsive.css\" media=\"all\">\n```\n\n7. 在步骤\
  \ 6 给出的代码下方，添加以下行：\n\n```\n<link rel=\"stylesheet\" href=\"myStyles.css\" />\n```\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_151_0.png)\n\n> 将自己的 CSS 文件与网页连接时的整体模式是\
  \ <link rel=\"stylesheet\" href=\"path-to-your-file\" />\n\n8. 保存文件并在浏览器中刷新网站。现在，我们的\
  \ CSS 文件已连接到页面，我们的更改已应用。\n\n如果你的网站包含多个网页，你就需要将 CSS 文件与每个页面连接。幸运的是，在 CMS 模板的情况下，通常只有一个主模板文件。\n\
  \n9. 使用此技术，你应记住一些规则，包括：\n\n- **始终覆盖，切勿移除：** 在 CSS 中，每个元素可以被定义多次。后续定义相互补充。在冲突的情况下，最后一个定义具有最高优先级。不要从原始定义中移除属性，而是再次编写该定义并用新值覆盖特定属性。\n\
  - **将你的 CSS 文件作为最后一个连接：** 每个页面可以连接多个 CSS 文件。如果来自不同文件的定义发生冲突，则最后连接的文件中的定义将具有最高优先级。将你的文件作为最后一个连接，可以确保你的更改会覆盖\
  \ Artisteer 生成的原始定义。\n\n## 复制网页\n\n有时你需要对项目中已有的页面文章进行精确复制。这可能是当你想要有几个相似的页面，仅在某些细节上有所不同时。那么，与其手动逐个复制元素，不如复制源页面，修改细节，然后制作下一个页面。\n\
  \n不幸的是，你不能只用鼠标选择页面的内容然后按 Ctrl + C 来复制内容，因为这样做不会起作用。你只能在单个内容单元格内执行此操作。\n\n解决方案非常简单：\n\
  \n- 1. 在要复制的页面中，在内容区域的任何位置单击。\n- 2. 在功能区上单击 Edit 选项卡，然后在 Source 组中单击 HTML 按钮。\n\
  - 3. 选中 Edit whole Article HTML 字段。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_152_0.png)\n\
  \n- 4. 你会收到一条警告消息，内容为 **编辑后，内容将被合并到一个单元格中**；单击 **OK**。\n- 5. 现在在 HTML 编辑器中你将看到页面（文章）的所有内容。用鼠标选择全部文本（或按\
  \ *Ctrl + A*），按鼠标右键，然后从内容菜单中选择 **Copy**（或直接按 *Ctrl + C*）将文本复制到剪贴板。\n- 6. 单击 **OK**\
  \ 按钮关闭 HTML 编辑器。\n- 7. 创建一个新页面并在内容区域的任何位置单击。\n- 8. 在功能区上单击 **HTML** 按钮。\n- 9. 删除\
  \ HTML 编辑器中的所有内容并粘贴剪贴板中的代码（按 *Ctrl + V*，或按鼠标右键并从内容菜单中选择 **Paste**）。\n- 10. 单击 **OK**\
  \ 按钮关闭 HTML 编辑器。\n\n你会注意到源文章的全部内容已被复制。\n\n## 添加 Lightbox\n\n此提示适用于 HTML 模板。如果使用\
  \ CMS，则应使用其中一个可用扩展。\n\nLightbox 效果是 Artisteer 的一个非常酷的功能，可让你用图片库丰富项目。但 Artisteer\
  \ 的 Lightbox 没有真正的那么令人印象深刻。拥有一个带有真正的 Lightbox 的画廊不是很好吗？在本提示中，我将向你展示如何修改代码以获得带有真实\
  \ Lightbox 的画廊。在此示例中，我们将使用 `betterImageGallery.artx` 项目文件。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_153_0.png)\n\
  \n> Lightbox 是使用模态对话框显示图像的一组技术的通用名称。该名称源自 Lokesh Dhakar 创建的原始 JavaScript 插件（有关更多信息，请访问\
  \ http://lokeshdhakar.com/projects/lightbox/）。类似 Lightbox 的脚本以漂亮的边框显示图像，并带有导航控件和描述文本。\n\
  \n我们将使用基于 jQuery 库的 Lightbox2 效果。有许多类似 Lightbox 的效果可用，但这个效果功能强大且易于使用。Artisteer 为其自己的\
  \ Lightbox 效果使用 jQuery，并在导出项目时默认附加此库，因此使用基于此库的效果是个好主意。以下是我们的流程：\n\n- 1. 在开始之前，我们需要准备一些额外的文件。Artisteer\
  \ 将包含 jQuery 库，但我们需要我们的 Lightbox2 效果。你可以从其作者网站 `http://lokeshdhakar.com/projects/lightbox2/`\
  \ 免费下载。前往此页面并下载文件。这将是一个 ZIP 压缩包，包含多个文件夹和文件。这些文件并非全部真正需要，但为简单起见，只需解压压缩包即可。你将获得一个\
  \ `Lightbox` 文件夹。\n- 2. 安装包不仅包含必要的文件，还包含示例页面、jQuery 库和一些示例图像。如果只想要真正需要的内容，可以删除不必要的文件，只保留以下截图方案中显示的文件：\n\
  - 3. 我们需要的第二个资源是我们要在画廊中显示的图像。对于此示例，我已将简单的图像包准备到 ZIP 压缩包中。解压 `galleryImages.zip`\
  \ 文件。你应该拥有包含八张简单图像的 `galleryImages` 文件夹。\n- 4. 现在，当我们准备好所需的额外文件后，启动 Artisteer 并打开\
  \ `betterImageGallery.artx` 项目文件。你会看到它只是一个单页模板，内容区域中有八个空单元格。使用 Lightbox 的图像画廊概念是页面上显示图像缩略图。每个缩略图都是指向对应大图的链接。在没有\
  \ Artisteer 的情况下，我们需要准备图像缩略图，但我们不必担心这一点，因为 Artisteer 在将图像插入单元格时会正确调整每个图像的大小。\n\n\
  ![](img/7f889df2ffdb68108cff34d798a2b9a3_154_0.png)\n\n5. 在每个单元格中放置我们集合中的一张图像。你的项目应类似于以下截图所示：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_155_0.png)\n\n我们画廊的初始状态，其中内容区域的单元格中有缩略图\n\
  \n6. 现在将项目导出到文件夹中，并将其命名为 `ImageGallery`。打开此文件夹并双击 `index.html` 文件以在浏览器中查看网站。\n\n\
  7. 默认情况下，每张图片都启用了 Lightbox 效果。由于我们将用另一个效果替换 Artisteer 的 Lightbox 效果，因此需要将其关闭。返回\
  \ Artisteer，对每张图像按鼠标右键，选择内容菜单中的 **Image Options** 选项，并在 **Image Options** 窗口中将 **Preview**\
  \ 字段的值设置为 **No**。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_155_1.png)\n\n我们需要为画廊中的每张图像关闭\
  \ Lightbox 效果\n\n8. 再次以相同名称和位置导出项目，覆盖任何先前文件。\n\n\n\n9. 打开此文件夹并双击 `index.html` 文件以在浏览器中显示我们的网站。确保画廊中任何缩略图的\
  \ Lightbox 效果均已禁用。如果您忘记为任何图片禁用此效果，请返回 Artisteer，禁用它，然后再次导出项目，覆盖之前导出的文件。\n\n10. 打开导出模板的文件夹并进入\
  \ `images` 文件夹。这是标准 Artisteer 生成的模板文件夹，其中包含项目中使用的所有图形文件。请注意，在将图像插入项目时，Artisteer\
  \ 不仅将原始图像的大小调整为目标尺寸（单元格），还制作了带缩略图的副本。我们现在拥有画廊中每个图像的两份副本，即缩略图（实际显示在单元格中），以及其对应的原始尺寸图像。生成的图像命名约定如下：\n\
  \n| 缩略图 | 原始图像（较大） |\n|---|---|\n| 1.jpg | 1-large.jpg |\n| 2.jpg | 2-large.jpg\
  \ |\n\n- 现在是解释为什么我们必须导出模板两次的原因。任何放入 Artisteer 项目中的图像，其 **预览**（Lightbox 效果）属性默认设置为\
  \ **是**。在我们第一次导出项目时，此选项对所有图像都已启用。这使得 Artisteer 为每个图像创建缩略图，同时保留原始的较大图像（缩略图显示在页面上，而较大图像在\
  \ Lightbox 效果中显示）。然后我们为所有图像禁用了 Lightbox 效果并再次导出项目，覆盖文件。如果 Lightbox 效果被禁用，就没有必要保留较大图像，Artisteer\
  \ 未将其包含在导出的文件中。大多数文件已被覆盖，但由于导出项目的位置未改变，旧文件仍然保留。您可以检查文件的创建日期。您会注意到较大图像稍微老一些，因为它们来自我们第一次导出，而较小的图像在第二次导出期间被覆盖。通过这种技巧，我们禁用了\
  \ Lightbox 效果，但仍然拥有每个图像的两个版本，即缩略图和原始尺寸。\n- 现在是时候将我们的缩略图转换为指向其对应较大图像的链接了。\n\n11.\
  \ 在 Artisteer 中按住右鼠标按钮单击第一张图像，然后从内容菜单中选择 **编辑超链接...** 选项。这将打开 **图像选项** 窗口，其中 **链接**\
  \ 选项卡已启用。在 **地址：** 字段中，我们需要输入当前缩略图对应的较大图像的相对路径（请查看上表以检查我们画廊中对应图像的名称）。\n\n由于所有图像都存储在\
  \ `images` 文件夹中，我们需要根据模式 `Folder name/bigger-image-name` 以文件夹名称开头路径。\n\n我们正在处理 `1.jpg`\
  \ 文件（第一个缩略图），因此在这种情况下，我们应该输入 `images/1-large.jpg`。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_157_0.png)\n\
  \n我们输入原始尺寸图像的路径\n\n对每个图像重复此过程。再次导出项目，覆盖之前导出的文件。\n\n12. 在浏览器中打开我们的网站。画廊可以工作，尽管目前还没有\
  \ Lightbox 效果。当您单击缩略图时，您将被重定向到显示图像较大版本的页面。\n\n> 如果此步骤出现问题（单击缩略图后显示错误而不是较大图像），请返回\
  \ Artisteer，编辑链接属性，并确保 **地址：** 字段的值不以 / 字符开头。如果是，请将其删除。出于某种原因，如果链接的地址以 / 开头，Artisteer\
  \ 会在地址后添加 `.html`。例如：\n> \n> - 正确：`images/1-large.jpg`\n> - 错误：`/images/1-large.jpg`\n\
  \n13. 在我们启用 Lightbox2 效果之前（这需要我们修改导出的代码），让我们添加图片描述。Lightbox2 允许您为图像添加描述。假设我们想将文本\
  \ `This is the first image of our gallery` 作为第一个图像的描述。\n\n14. 为此，按住右鼠标按钮单击第一个缩略图，然后再次从内容菜单中选择\
  \ **编辑超链接...** 选项。然后只需在 **图像选项** 窗口中的 **屏幕提示：** 字段中输入您的描述，如以下屏幕截图所示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_158_0.png)\n\
  \n为图像添加描述\n\n重复此过程，为每个图像提供适当的描述。\n\n在 Artisteer 中我们可以做的最后一件事是为画廊中的任何链接设置正确的 rel\
  \ 属性。Lightbox2 仅适用于具有设置 rel=\"Lightbox[galleryName]\" 的图片。\n\n> 此功能使页面上可以有多个画廊。每张图片都显示导航箭头，使用户可以切换到下一张或上一张图像。方括号中的\
  \ galleryName 标识图像属于特定画廊。您可以自行命名。如果页面上有多个画廊，请为每个图像在 rel 属性中设置适当的 galleryName。这将通知\
  \ Lightbox 特定画廊何时结束以及另一个画廊何时开始。\n\n15. 为此，单击任何缩略图，然后单击功能区上的 **HTML** 按钮（它位于 **编辑**\
  \ 选项卡上）。HTML 编辑器将出现，显示我们内容区域的源代码。查找我们第一个缩略图的链接（如果您不确定要查找的内容，只需查找缩略图的文件名）。找到看起来像以下的代码片段：\n\
  \n```\n<a href=\"images/1-large.jpg\" title=\"This is the first image of our gallery\"\
  >\n```\n\n16. 将光标放置在 title 属性的右侧并添加：\n\n```\nrel=\"Lightbox[myGallery]\"\n```\n\n\
  17. 您现在应该有以下内容：\n\n```\n<a href=\"images/1-large.jpg\" rel=\"Lightbox[myGallery]\"\
  \ title=\"This is the first image of our gallery\">\n```\n\n18. 对我们画廊中的所有链接重复此操作（请记住我们有八张图像）。单击\
  \ OK 按钮关闭编辑器窗口。导出项目，覆盖之前导出的文件。\n\n19. 最后一步是修改导出的代码并为我们的网站添加真正的 Lightbox 效果。打开导出项目的文件夹并将我们之前准备的整个\
  \ Lightbox 文件夹复制到此文件夹。然后编辑 index.html 文件并找到附加 jQuery 的代码部分。我们正在寻找以下行（文件开头附近）：\n\n\
  ```\n<script src=\"jquery.js\"></script>\n```\n\n20. 在此行正下方（如果需要留出一些空间），放置以下代码：\n\
  \n```\n<!-- we add Lightbox effect -->\n<link rel=\"stylesheet\" href=\"Lightbox/css/Lightbox.css\"\
  \ />\n<script src=\"Lightbox/js/Lightbox.js\"/>\n<!-- end of our modifications -->\n\
  ```\n\n21. 保存文件并双击 index.html 文件。我们的画廊应该按预期工作，但关闭和加载图像缺失。要修复此问题，只需将 close.png 和\
  \ loading.gif 文件从 Lightbox/images 文件夹复制或移动到我们的模板 images 文件夹（从 ImageGallery/Lightbox/images\
  \ 目录到 ImageGallery/images 目录）。\n\n这就是要做的最后一件事。现在您应该可以看到我们的项目，具有漂亮的 Lightbox2 效果图像画廊，具有平滑的显示效果、导航箭头和图像描述\n\
  \n## 摘要\n\n在本章中，您学习了一些技巧，可以扩展生成模板的功能，并执行 Artisteer 本身无法直接完成的事情。虽然修改所有导出的源代码可能看起来很复杂，但目的是向您展示自动生成的代码可以扩展以满足自定义需求。接下来是什么？尝试实验，做新事物，不要害怕。无论任务看起来多么复杂，总的来说它只是\
  \ HTML。这也是本书的结尾。我希望您喜欢阅读它并发现它有用。\n\n\n"
