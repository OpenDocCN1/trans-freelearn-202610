  \n这些元素对整个网站是共同的。区分各个页面的内容。借助 CMS，内容与布局分离并存储在外部存储中（通常在数据库中）。在页面显示之前，CMS 获取适当的内容并将其放入模板中。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_92_0.png)\n\n在页面显示时，CMS 将页面的固定元素（模板）与数据库中的正确内容连接起来\n\
  \n因为固定元素只定义一次（它们不会在每个页面上重复，而只存在于模板的一个实例中），这意味着数据的节省。但更重要的是，外观与内容的分离允许你在任何时候更改模板，而不会影响内容。你可以随时更改网站的外观而保持内容不变。如果你长期管理一个网站或博客，你肯定会欣赏这种可能性。外观与内容的[content]\n\
  ## 3 CMS 模板\n\n直到此刻，我们一直专注于设计静态网站（在 Artisteer 中称为 Website Template）。术语 **static\
  \ website** 可能让你有点尴尬，因为它自然会被理解为“页面上什么都不动的”。你可能会想，如果你在静态网站上添加例如幻灯片，它就不再是静态的了。这是一种非常自然且合乎逻辑的思考方式，但在这种情况下，常用的术语则完全不同。说到静态网站，我们想的不是其内容，而是页面的生成方式。\n\
  \n## 什么是 CMS\n\n在静态 HTML 网站中，内容是硬编码的——它是页面代码的一部分。这样的网站由众多 HTML 文件组成，并且所有文件都是单独逐一编写的。它们可以使用各种工具来准备（或多或少简化工作），但每个文件都同时包含外观定义和内容。所有这些文件都被复制到\
  \ Web 服务器上，使其可供访客访问。这是最自然、最易于理解的网站类型。\n\n动态页面在技术上肯定更先进。它并不以文件的形式存在，而是由 Web 服务器即时生成的。在收到需要显示特定页面的信号后，一种特殊的软件会获取适当的内容（通常来自数据库）并将其放入可用的模板中。内容和模板成功结合后，页面就准备就绪并发送到浏览器。\n\
  \n**Dynamic website** 因此不是静态页面（HTML 文件）的集合，而是在 Web 服务器上安装的用于管理内容、模板并将它们合并为动态页面的软件。\n\
  \n动态网站比其静态对应物运行得更慢，因为每个页面在显示前都必须生成。它们对服务器的要求更高，因为服务器不仅要显示，还要生成页面。\n\n那么优势是什么呢？这无疑是一个更通用的解决方案，而且“一旦被称为内容管理系统（CMS）的软件准备好后，就可多次用于各种网站。让我们回顾一下我们对模板的定义。我写道，模板是网站的共同、固定元素的集合，如背景、页眉和页脚。\n\
  \n这些元素对整个网站是共同的。区分各个页面的内容。借助 CMS，内容与布局分离并存储在外部存储中（通常在数据库中）。在页面显示之前，CMS 获取适当的内容并将其放入模板中。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_92_0.png)\n\n在页面显示时，CMS 将页面的固定元素（模板）与数据库中的正确内容连接起来\n\
  \n因为固定元素只定义一次（它们不会在每个页面上重复，而只存在于模板的一个实例中），这意味着数据的节省。但更重要的是，外观与内容的分离允许你在任何时候更改模板，而不会影响内容。你可以随时更改网站的外观而保持内容不变。如果你长期管理一个网站或博客，你肯定会欣赏这种可能性。外观与内容的[content]\n\
  因为固定元素只定义一次（它们不会在每个页面上重复，而只存在于模板的一个实例中），这意味着数据的节省。但更重要的是，外观与内容的分离允许你在任何时候更改模板，而不会影响内容。你可以随时更改网站的外观而保持内容不变。如果你长期管理一个网站或博客，你肯定会欣赏这种可能性。外观与内容的分离并不意味着你必须在看不到模板的情况下单独输入内容，那样会非常困难。更先进的\
  \ CMS 解决方案允许你在线直接在浏览器中输入内容，使用 WYSIWYG 编辑器。\n\n了解以上所有信息后，我们可以形成对 CMS 的定义。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_93_0.png)\n\
  \n> CMS 是一种用于管理网站的通用软件。它通过使用模板将网站的外观与其内容分离，并允许管理员直接在浏览器中输入内容。通常，CMS 系统还允许你操作菜单结构。\n\
  \n市场上存在各种类型的 CMS。有些是商业的，有些是免费的，而最知名解决方案的可能性远远超出我们的定义。Artisteer 支持为几种流行的 CMS 创建模板。\n\
  \n由于内容编辑直接在浏览器中进行，因此无需将新页面上传到服务器。这确实加快了网站管理以及添加新内容和页面的速度。\n\n使用 CMS 系统还有另一个、也许是最重要的优势，那就是向网站添加新内容所需的时间。\n\
  \n假设你有一个由 50 个页面组成的网站。（你现在可能觉得这很多，但事实并非如此。在你认真开始开发网站后，你会很容易超过这个数字。）假设这是一个静态网站，由单独的\
  \ HTML 文档组成。共同的元素是页眉、左侧的垂直菜单和页脚。你想添加一个页面并希望它可以通过菜单访问。第一步当然是准备新页面。但之后你会意识到这是一项耗时较少的工作（如果你使用任何\
  \ WYSIWYG 编辑器，你可以在其中显示模板并非常快速地输入内容）。真正的难题在于修改菜单。修改刚添加的页面上的菜单是不够的，你必须修改所有其他页面上的菜单！（新页面应可从任何现有页面访问。）由于菜单在每个页面上都是硬编码的（它是其源代码的一部分），而静态网站只是一组单独的\
  \ HTML 文档，这意味着你必须编辑和修改所有现有文件！在我们的例子中，添加一个页面需要你修改 50 个现有文件，而且不要忘记在工作完成后你还必须将它们全部上传到服务器。\n\
  \n这种情况不仅适用于菜单，对于任何固定元素也是如此。你想更改页脚中的电话号码吗？你必须修改所有页面的页脚。\n\n但如果你使用 CMS，添加新页面只需几次鼠标点击，菜单就会自动适应新网站的结构。对于页脚也是类似的过程，我们只需要更改一次。修改的便捷性和节省时间正是使\
  \ CMS 成为较大网站最佳选择的原因。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_94_0.png)\n\n静态网站：添加单个页面所需的时间和工作量越多，网站的页面就越多\n\
  \n使用 CMS，添加单个页面所需的时间和工作量越少，无论网站有多大。\n\n基于以上内容，得出以下结论：\n\n向静态网站添加单个页面所需的时间和工作量越多，网站的页面就越多。使用\
  \ CMS 添加单个页面始终需要固定的时间和工作量，无论整个网站有多大。\n\n但等等！在上一章中，我们可以清楚地观察到，在向项目添加页面后，菜单也会自动适应。页脚或页眉（布局的固定元素）也是如此。\n\
  \nArtisteer 的行为确实类似于 CMS，这也是其最重要的优势之一。但请注意，即使使用 Artisteer，在更改完成后，你仍然必须将所有修改过的文件上传到服务器（并替换旧文件）。\n\
  \n可以把 Artisteer 视为 CMS 的替代品吗？对于小型网站来说，是的。你可以使用 Artisteer 的功能同时设计模板和输入内容，将所有内容集中在一个工具中。但对于较大网站的管理，使用\
  \ CMS 会更容易，因为你不必将所有修改过的文件上传到服务器。还有一些事情是 Artisteer 单独无法完成的（例如，使用联系表单发送消息）。这是否意味着\
  \ CMS 比 Artisteer 更好？完全不是，它只是不同类型的工具。CMS 是用于管理网站的软件，而 Artisteer 是用于设计模板的软件。\n\n\n\
  \n为 CMS 准备模板比为静态网站准备模板更困难。每个 CMS 都有自己的模板创建规则，而 CMS 模板不仅必须包含 HTML/CSS 代码，还必须包含用编程语言编写的一些代码。这些额外的代码片段对于\
  \ CMS 了解应将何种内容与模板中的特定区域关联是必要的。\n\n但别担心，我们有个好消息，Artisteer 可以自动生成适用于各种 CMS 的模板！因此“CMS\
  \ 还是 Artisteer 更好”这个问题有一个恰当的答案，那就是两者兼用。设计和管理大型网站最舒适的方式是：\n\n- 使用 Artisteer 设计模板（并可能填充初始内容）\n\
  - 将模板导出到 CMS\n- 使用 CMS 管理网站\n\n## 静态页面模板与 CMS 模板\n\nCMS 模板的创建与静态网站模板的创建过程不同，需要从不同的角度进行考虑。让我们详细描述这两种情况之间的差异，并记住一些可能有用的提示。\n\
  \n> 专注于设计。内容不在讨论范围之内。\n\n设计静态网站时，你通常会考虑具体的或至少是计划中的内容。想想我们在上一章中所做的工作。我们首先准备了显示网站结构的方案。我们知道它将由哪些子页面组成，以及每个页面上会呈现什么内容。在此基础上，我们决定主菜单将是水平的，并且我们还将拥有互补的垂直菜单。对于\
  \ CMS 模板而言，情况则大不相同；通常你甚至不知道会发布什么类型的内容。你不能假设网站管理员会按照你的假设使用你的模板。也不可以根据你对可能内容的设想来准备模板。这种方法会限制网站所有者。因此，在为\
  \ CMS 系统创建模板时，你应专注于设计，而不是内容。\n\n为了更好地说明我所说的“以设计为中心而非以内容为中心的方法”，让我们考虑一个具体的模板元素，即垂直菜单。本章开头我写道，特定页面由固定的模板元素和可变因素内容组成。内容因页面而异。这是正确的。但如果我们考虑某些固定元素的性质，就会意识到它们并非绝对固定。菜单包含现有页面的链接。如果\
  \ CMS 不仅允许我们编辑现有页面，还允许删除和添加新页面，则菜单也必须根据网站结构的变化进行调整。每当添加新页面时，就应出现新的菜单项（在正确的位置！），而当页面被删除时，对应的菜单项也应随之删除。\n\
  \n否则，可能会出现刚添加的页面在菜单中没有对应项的情况，因此访客无法浏览到它。或者菜单仍包含已被删除页面的项。\n\n对于静态网站，你可以将菜单作为一个整体来设计。你知道项目的确切数量和标题。你可以根据项目数量调整按钮大小，并使菜单在屏幕上占据你想要的精确空间。对于\
  \ CMS 模板设计，你不知道菜单将包含多少项。你无法预测菜单的大小，因为在添加新页面后，菜单中会出现新的按钮，使你的垂直菜单变高。唯一的解决方案是将垂直菜单视为一个整体区域，由项目（菜单按钮）填充。你可以，也应该设计特定菜单项的外观、整个菜单的边框、菜单标题的字体，但它仍然是一个整体模板，而不是具体的菜单。你必须接受自己没有所有信息这一事实，并且必须在这种情况下完成工作。这就是我写道你应专注于设计而非内容的意思。\n\
  \n> 模板元素导致项目的完整性。\n\n由于你不知道使用你的模板会发布什么内容，你不能仅将工作限制在设计你知道会出现元素上。你的模板必须是完整的，并且应使用户能够输入各种可能的内容。你的模板应为整个网站提供统一的外观。你不能省略某些元素，因为你不知道它们是否会被使用。\n\
  \n例如，在第 2 章《逐步构建模板》中设计静态模板时，我们省略了标题的第三级。我们知道内容，并且此类元素不会被使用；因此，没有必要设计它们。但在设计 CMS\
  \ 模板时，你不能这样做。你应该设计所有可能出现的元素。\n\n特别要记住设计：\n\n- 完整的排版（所有六级的标题、所有状态下的链接、普通文本字体、引用等等）\n\
  - 表格的外观（表格标题字体、表格内容字体和边框）\n- 表单控件（按钮、单选按钮和复选框）\n- 图片的边框和边距\n- 项目符号\n- 水平和垂直菜单（你不知道用户是否想使用其中一个或两者）\n\
  \n此外，你不能省略特定 CMS 支持的特殊区块。最常用的特殊区块是登录表单和搜索字段。虽然所有 CMS 解决方案的基本方法相似（例如在线内容编辑），但特定系统之间存在差异。每个系统都有其特定的典型用途。要设计一个好的模板，你必须了解为之设计的\
  \ CMS 的特性和属性。Artisteer 允许你使用 **Widgets** 列表插入最常见的区块（它位于功能区的 **Layout** 选项卡上）。查看此列表以确保自己没有遗漏重要内容并不是坏主意。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_97_0.png)\n\n如果你的目标 CMS 使用了这些区块之一，你应该在项目中予以考虑\n\
  \n> 对具体 CMS 的可能性和属性的了解是制作其良好模板的基本要求。\n\n## CMS 模板\n\n大多数现代 CMS 解决方案采用模块化设计。这意味着核心功能可以通过安装扩展来扩展。市场上针对各种流行\
  \ CMS 有成千上万的各种扩展。它们由第三方公司提供，提供非常多样化的功能。当然，你无法知道用户会使用哪些插件，你的模板不必全部支持它们。最低要求是设计一个支持特定\
  \ CMS 所有核心功能的模板。\n\n在大多数情况下，选择三列布局是个好主意。要理解原因，我们必须回到对 CMS 工作方式的解释。我们知道内容是在显示前插入到页面中的。我们也知道某些元素（即菜单）具有动态特性，其外观取决于网站结构或其他系统设置。下一个特点是网站管理员可以决定是否显示某些可用元素。管理员可以，例如，决定水平菜单应显示在所有页面上，而垂直菜单仅显示在其中一些页面上（作为补充菜单），搜索字段仅显示在主页上。从一个角度看，它提供了巨大的网站管理自由度，但从另一个角度看，它也显示了问题的复杂性。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_98_0.png)\n\n两侧都有列时，在放置元素时具有很大的自由度\n\n\
  基于前面的信息，我们可以假设通过 CMS 系统显示页面的过程大致如下：\n\n- 1. 获取将要显示的页面的设置。\n- 2. 检查哪些元素应显示，哪些不应显示。\n\
  - 3. 显示模板中的所有静态固定元素，并将其定位到正确的位置。\n- 4. 渲染模板的动态元素，并将其定位到正确的位置。\n- 5. 获取适当的内容，并在内容区域显示它。\n\
  \n由于动态元素的尺寸可能会发生变化，因此无法定义其位置。例如，你无法预测应显示在垂直菜单下方的登录字段距离页面顶部 400 像素，因为我们不知道垂直菜单有多高。我们唯一真正拥有的信息是它应显示在左侧，垂直菜单下方。为了解决这个问题，CMS\
  \ 模板基于我们称之为区域的东西。\n\n区域是模板中可以显示特定元素的位置。在区域中，你可以显示各种类型的元素，也可以将区域留空。一种特殊的区域是内容区域。内容是一个元素，每个页面上只能出现一次。\n\
  \n这是否意味着其他元素可以在同一页面上多次出现，例如两个垂直菜单，一个在另一个之下，看起来相同？是的。即使这在逻辑上不合理，从技术上讲也是可能的。\n\n区域始终呈矩形形状，并将模板划分为行和列，因此任何模板都可以视为网格。此网格的单元格数量（模板中的区域数量）因特定模板而异。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_99_0.png)\n\n> CMS 的模板是可用区域和元素外观定义的组合。\n\
  \n当你从头开始手工编写模板代码时，你决定区域的数量和放置位置。使用 Artisteer 时，你必须接受应用程序生成的网格。\n\nArtisteer 为 CMS\
  \ 系统生成三列布局，左侧和右侧列中有区域。使用 Artisteer 设计时，你应遵守此规则，并以三列布局为项目基础。\n\n\n\nDoes it mean,\
  \ that every website based on an Artisteer-generated theme has to have a three-column\
  \ layout? No. The dimensions of Areas are dynamic – an Area adopts its size to the\
  \ elements that it contains. The empty Area although exists, but its vertical and\
  \ horizontal size is zero. From the site administrator's point of view, this is\
  \ a very good solution, because he has the possibility to display any element in\
  \ the side column if he wants, but if he doesn't, this column will remain invisible\
  \ for the visitor.\n\n这是否意味着，每个基于 Artisteer 生成的主题的网站都必须采用三列布局？不。区域的尺寸是动态的——区域会根据其包含的元素调整大小。虽然空区域存在，但其垂直和水平尺寸为零。从网站管理员的角度来看，这是一个非常好的解决方案，因为他可以根据需要将任何元素显示在侧栏中，如果他不这样做，该列对访客来说将保持不可见。\n\
  \nDesigning three-column layouts don't force the user to use all three columns.\
  \ You give him only the possibility to do this. He still has a free choice to use\
  \ only one or two of the available columns.\n\n设计三列布局并不强制用户使用全部三列。你只是给了他这样做的可能性。他仍然可以自由选择只使用一列或两列可用列。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_100_0.png)\n\n> By designing a three-column\
  \ layout, you give the site administrator the possibility to insert and display\
  \ any element in side columns. But if he decides not to use these columns at all,\
  \ they won't even be visible (its width will be zero).\n\n> 通过设计三列布局，你给了网站管理员在侧栏中插入和显示任何元素的可能性。但如果他决定完全不使用这些列，它们甚至不会可见（其宽度为零）。\n\
  \n## Specific CMS template elements\n\n## 特定的 CMS 模板元素\n\nThere are some elements\
  \ that are specific for CMS templates. Not every CMS system supports all of them.\
  \ Also, site administrators can decide not to use them, even if they are supported.\
  \ Nevertheless, if you design a platform that supports these elements, you should\
  \ include them in your project.\n\n存在一些特定于 CMS 模板的元素。并非每个 CMS 系统都支持所有这些元素。此外，即使得到支持，网站管理员也可以选择不使用它们。尽管如此，如果你设计一个支持这些元素的平台，你应该将它们包含在你的项目中。\n\
  \n## Post header icons\n\n## 文章头部图标\n\nPost header icons are displayed next to the\
  \ post header. Artisteer supports the **Author**, **Date**, **Edit**, **Email**,\
  \ **PDF**, and **Print** icons. The last position on the list (**Date**) contains\
  \ its own subelements.\n\n文章头部图标显示在文章标题旁边。Artisteer 支持 **作者**、**日期**、**编辑**、**邮件**、**PDF**\
  \ 和 **打印** 图标。列表中的最后一个位置（**日期**）包含其自己的子元素。\n\nWe will choose the **Print** icon\
  \ as an example, but the procedure is the same for each icon. To set the **Print**\
  \ icon, do the following:\n\n我们将选择 **打印** 图标作为示例，但每个图标的流程都相同。要设置 **打印** 图标，请执行以下操作：\n\
  \n- 1. Select a blog page on the **Pages** panel on the left. If you don't have\
  \ any, create one. Also, create at least one post to be able to observe the inserted\
  \ icon.\n- 1. 在左侧的 **页面** 面板上选择一个博客页面。如果没有，请创建一个。此外，至少创建一个帖子以便能够观察插入的图标。\n- 2. In\
  \ the **Content** tab on the ribbon, navigate to **Post Header** | **Icons** | **Print**.\
  \ Enable the **Show Print** option. This enables our template to support this icon.\
  \ After enabling this option, additional options will appear with the collection\
  \ of available icons. Choose the icon you prefer.\n- 2. 在功能区的 **内容** 选项卡中，导航到 **文章头部**\
  \ | **图标** | **打印**。启用 **显示打印** 选项。这使我们的模板能够支持此图标。启用此选项后，将出现附加选项，其中包含可用图标的集合。选择你喜欢的图标。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_101_0.png)\n\nSetting Print icon\n\n\
  设置打印图标\n\n## Post footer icons\n\n## 文章底部图标\n\nPost footer icons are displayed under\
  \ the post. Artisteer supports three kinds of these icons, namely Category, Comments,\
  \ and Tags. The procedure is analogous to inserting post header icons, but instead\
  \ of the Post header button, we use Post footer.\n\n文章底部图标显示在文章下方。Artisteer 支持三种此类图标，即分类、评论和标签。流程与插入文章头部图标类似，但不是使用文章头部按钮，而是使用文章底部。\n\
  \nWe will style Icons for Comments:\n\n我们将为评论设置图标样式：\n\n- 1. Select a blog page\
  \ on the Pages panel on the left. If you don't have any, create one. Also, create\
  \ at least one post to be able to observe the inserted icon.\n- 1. 在左侧的页面面板上选择一个博客页面。如果没有，请创建一个。此外，至少创建一个帖子以便能够观察插入的图标。\n\
  - 2. In the Content tab on the ribbon, navigate to Post Footer | Icons | Comments.\
  \ Enable the Show Comments option. This makes our template to support this icon.\
  \ After enabling this option, additional options will appear with the collection\
  \ of available icons.\n- 2. 在功能区的 内容 选项卡中，导航到 文章底部 | 图标 | 评论。启用 显示评论 选项。这使我们的模板能够支持此图标。启用此选项后，将出现附加选项，其中包含可用图标的集合。\n\
  - 3. Choose the icon you prefer.\n- 3. 选择你喜欢的图标。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_102_0.png)\n\
  \nSetting Comments icon\n\n设置评论图标\n\nActually, you don't need a blog page to set\
  \ up the post icons, but working with a blog page (with at least one post) has the\
  \ advantage that you immediately see all changes.\n\n实际上，你不需要博客页面来设置文章图标，但使用博客页面（至少有一个帖子）的好处是你可以立即看到所有更改。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_102_1.png)\n\nExample post in Artisteer,\
  \ with all icons enabled\n\nArtisteer 中的示例帖子，所有图标均已启用\n\n## Advanced techniques\n\
  \n## 高级技术\n\nIn this section, we will go through the more advanced functionality\
  \ in Artisteer that enables you to extend the number of template positions generated\
  \ by default. But before we start, we will learn how to display the available positions\
  \ and their names in Joomla!. You will need this information to use additional positions\
  \ efficiently.\n\n在本节中，我们将介绍 Artisteer 中更高级的功能，该功能可让你扩展默认生成的模板位置数量。但在开始之前，我们将学习如何在\
  \ Joomla! 中显示可用位置及其名称。你需要此信息才能有效地使用额外位置。\n\n## Displaying positions in a Joomla!\
  \ template\n\n## 在 Joomla! 模板中显示位置\n\nTo check the position of a Joomla! Template,\
  \ do the following:\n\n要检查 Joomla! 模板的位置，请执行以下操作：\n\n- 1. Log in to the Joomla!\
  \ administrative panel.\n- 1. 登录到 Joomla! 管理面板。\n- 2. Navigate to **Extension**\
  \ | **Template Manager** from the menu.\n- 2. 从菜单中导航到 **扩展** | **模板管理器**。\n- 3.\
  \ Click on the **Options** button on the toolbar.\n- 3. 在工具栏上单击 **选项** 按钮。\n- 4.\
  \ Enable the **Preview Module Positions** option.\n- 4. 启用 **预览模块位置** 选项。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_103_0.png)\n\
  \n- 5. Click on **Save & Close**.\n- 5. 单击 **保存并关闭**。\n\nWith this function enabled,\
  \ go to your page, using the address that is in the format `http://address-of-your-site/index.php?tp=1`.\n\
  \n启用此功能后，使用格式为 `http://address-of-your-site/index.php?tp=1` 的地址访问你的页面。\n\nYou should\
  \ see your home page, but its name will be displayed in every template position:\n\
  \n你应该会看到你的主页，但其名称将显示在每个模板位置中：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_103_1.png)\n\
  \nSpecial address displays positions' names and locations in Joomla!\n\n特殊地址显示 Joomla!\
  \ 中位置的名称和位置\n\n## Additional template position in the header\n\n## 头部中的额外模板位置\n\n\
  This functionality applies to Joomla!, WordPress, and Drupal templates.\n\n此功能适用于\
  \ Joomla!、WordPress 和 Drupal 模板。\n\nYou can add a new position in the header area.\
  \ This is handy if you need a special position to show in the header's additional\
  \ menu, image link (logo), and so on. You can add only one position in the header.\
  \ In our example, we use .artx project from Chapter 2, The Template Step-by-Step:\n\
  \n你可以在头部区域添加一个新位置。如果需要在头部的附加菜单、图像链接（logo）等处显示特殊位置，这非常方便。你只能在头部添加一个位置。在我们的示例中，我们使用第\
  \ 2 章《逐步模板》中的 .artx 项目：\n\n- 1. Choose the **Header** tab on the ribbon.\n- 1. 在功能区中选择\
  \ **头部** 选项卡。\n- 2. Click on the **Controls** button (in the **Insert** group) and\
  \ select **Position** from the list.\n- 2. 单击 **控件** 按钮（在 **插入** 组中）并从列表中选择 **位置**。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_104_0.png)\n\nInserting new area into\
  \ the header\n\n在头部插入新区域\n\n- 3. Click anywhere within the header area.\n- 3. 在头部区域内的任意位置单击。\n\
  \nThe new position will be inserted in the place you have clicked. You can move\
  \ it and resize using the mouse, like any other shape.\n\n新位置将插入到你单击的位置。你可以使用鼠标移动和调整其大小，就像其他任何形状一样。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_104_1.png)\n\nOur header with new template\
  \ position inserted\n\n插入新模板位置后的头部\n\nYou can't insert something into this position\
  \ using Artisteer, but after exporting template to CMS (that is, Joomla!), this\
  \ position can be used as any another.\n\n你不能使用 Artisteer 向此位置插入内容，但在将模板导出到 CMS（即\
  \ Joomla!）后，此位置可像其他任何位置一样使用。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_105_0.png)\n\
  \nOur new, empty position-31 in Joomla!\n\n我们在 Joomla! 中的新空位置-31\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_105_1.png)\n\
  \nSome content inserted into our new position (as Custom HTML module, Joomla!)\n\
  \n有些内容已插入到我们的新位置（作为自定义 HTML 模块，Joomla!）\n\n## Additional template positions in the\
  \ footer\n\n## 脚部中的额外模板位置\n\nThis functionality applies to Joomla! and WordPress\
  \ templates.\n\n此功能适用于 Joomla! 和 WordPress 模板。\n\nYou can also insert new template\
  \ positions into the footer. It's very easy. You edit the footer area just like\
  \ the page's content, inserting new rows and cells, using tools from the Edit tab.\n\
  \n你也可以在脚部插入新的模板位置。非常简单。你可以像编辑页面内容一样编辑脚部区域，使用编辑选项卡中的工具插入新行和单元格。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_105_2.png)\n\
  \nButtons from Content group on the ribbon's Edit tab work also for the footer\n\
  \n功能区编辑选项卡上的内容组按钮也适用于脚部\n\nFooters containing many rows and cells won't be exported\
  \ as one template position, but Artisteer will create new template positions for\
  \ each cell.\n\n包含许多行和单元格的脚部不会作为一个模板位置导出，但 Artisteer 会为每个单元格创建新的模板位置。\n\n## CMS\
  \ Templates\n\n## CMS 模板\n\nThe following screenshot contains an example grid in\
  \ the project's footer. All cells will be exported as template positions:\n\n以下屏幕截图包含项目脚部中的示例网格。所有单元格都将作为模板位置导出：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_106_0.png)\n\nThe exported footer's cells\
  \ that are available Widget Areas in WordPress are as follows:\n\n导出的脚部单元格在 WordPress\
  \ 中可作为小部件区域如下：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_106_1.png)\n\nThe exported\
  \ footer’s cells that are available module positions in Joomla! are as follows:\n\
  \n导出的脚部单元格在 Joomla! 中可作为模块位置如下：\n\n| position-32[artstyle outline] | n-32 | position-33[artstyle\
  \ outline] | n-33 | position-34[artstyle outline] | n-34 |\n|---|---|---|---|---|---|\n\
  | position-35[artstyle outline] | n-35 | position-36[artstyle outline] | n-36 |\
  \ position-37[artstyle outline] | n-37 |\n| position-38[artstyle outline] | n-38\
  \ | position-39[artstyle outline] | n-39 | position-40[artstyle outline] | n-40\
  \ |\n| position-41[artstyle outline] |  | position-41 |  |  |  |\n\nThis feature,\
  \ introduced in Artisteer 4.1, shows all the possibilities when you stop to think\
  \ about the footer as a place not only for inserting copyrights, but when you treat\
  \ this area as \"everything below the main content\". There are kinds of websites\
  \ (especially multimedia portals), in which the layout is a custom grid of different\
  \ modules/widgets. You can achieve such a template with Artisteer by designing any\
  \ grid of positions. Remember that the dimensions of template areas adapt to the\
  \ content they display, and the dimensions of empty areas are zero. According to\
  \ your needs, you may decide to use one, several, or all areas you have created.\
  \ You can even decide not to display any article at all, hiding the main Content\
  \ Area and using only this grid for displaying modules/widgets.\n\n此功能在 Artisteer\
  \ 4.1 中引入，展示了当你停止将脚部视为仅用于插入版权的地方，而是将该区域视为“主内容下方的一切”时的所有可能性。有些网站（尤其是多媒体门户）的布局是不同模块/小部件的自定义网格。你可以使用\
  \ Artisteer 通过设计任意位置网格来实现此类模板。请记住，模板区域的尺寸会根据其显示的内容自适应，而空区域的尺寸为零。根据你的需要，你可以决定使用一个、多个或所有你创建的区域。你甚至可以决定完全不显示任何文章，隐藏主内容区域，仅使用此网格来显示模块/小部件。\n\
  \n## Joomla! templates\n\n## Joomla! 模板\n\nJoomla! is a very popular CMS, written\
  \ in PHP language. To be able to use it, you will need a hosting account that supports\
  \ PHP and access to one database on MySQL database server. Joomla! is a free, open\
  \ source software, licensed under the terms of GPL 2, which simply means that you\
  \ can use it free of charge for commercial purposes too (you can find text of this\
  \ license at http://www.gnu.org/licenses/gpl-2.0.html). You can download the newest\
  \ version of Joomla! installer from www.joomla.org. While I’m writing this book,\
  \ the newest, long-term, stable version is 2.5.9, and this is the version we are\
  \ going to work with in this chapter.\n\nJoomla! 是一个非常流行的 CMS，用 PHP 语言编写。要使用它，你需要一个支持\
  \ PHP 的托管账户以及对 MySQL 数据库服务器上一个数据库的访问权限。Joomla! 是一款免费的开源软件，根据 GPL 2 条款许可，这意味着你也可以免费用于商业用途（你可以在\
  \ http://www.gnu.org/licenses/gpl-2.0.html 找到此许可证的文本）。你可以从 www.joomla.org 下载最新版本的\
  \ Joomla! 安装程序。当我撰写本书时，最新长期稳定版本是 2.5.9，这就是本章将使用的版本。\n\n\n\n\n## 模板区域\n\nArtisteer\
  \ 生成的 Joomla! 模板包含以下区域：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_108_0.png)\n\
  \n来源：www.artisteer.com\n\n如果仔细观察该图，您会看到每个区域都有两个名称。第一个名称与区域的目的相关，而第二个名称放在括号中并基于位置-数字模式构建（即\
  \ position-30）。第一种约定是 Joomla! 1.5 的标准（它仍然是一个非常流行的版本），第二种是在 1.6 版本中引入的。由于 Artisteer\
  \ 为各种版本（1.5 或 2.5-3.0）导出模板，因此在导出模板时您可以选择 Joomla! 的目标版本以及模板区域的命名约定。\n\n## 导出 Joomla!\
  \ 模板\n\n导出 CMS 模板的方式与我们在上一章中完成的导出静态页面模板非常相似。\n\n首先要做的是选择目标平台——本例中为 Joomla！为此，请单击功能区快速访问工具栏上导出按钮旁边的箭头（您也可以从菜单中选择\
  \ 文件 | 导出 | Joomla 模板）。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_109_0.png)\n\
  \n导出窗口将如下所示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_109_1.png)\n\n设置以下字段：\n\
  \n- **Template: Joomla Template**（模板的目标平台）\n- **Version: 2.5**（目标 Joomla! 版本）\n\
  - **Positions: position-1, p...**（区域命名约定。我们选择了较新的一个，是 Joomla! 1.6+ 的默认值）\n- **FileName:\
  \ MyJoomlaTemplate**（模板文件名）\n- **Path: C:\\Users\\Jakub\\Desktop**（创建文件的目标路径。在本例中为我的桌面）\n\
  \n**Path:** 下有三个重要的选项可以勾选：\n\n- **ZIP archive**\n- **Include ARTX Project**\n- **Include\
  \ Content**\n\n勾选第一个选项 **ZIP archive** 会使生成的文件自动压缩为 ZIP 归档。您绝对应该勾选此选项，因为 ZIP 归档是\
  \ Joomla! 用于安装新模板所支持的正确格式。此类模板可以直接从 Joomla! 管理面板安装。\n\n> 导出 Joomla! 时应始终勾选 **ZIP\
  \ archive** 选项。\n\n勾选 **Include ARTX Project** 选项会将原生 Artisteer 项目文件（`.artx`）添加到导出的文件中。这对安装或使用模板没有影响，选择由您决定。\n\
  \n最后一个选项（**Include Content**）是在 Artisteer 4.0 中引入的，允许您将 Artisteer 中输入的所有内容——页面、文本、菜单、图像和页脚——与模板一起导出。如果您的工作是构建整个网站，并且已在\
  \ Artisteer 中输入了最终内容，勾选此选项可能是一个好主意（这样您就无需再次在 Joomla! 中重新输入）。如果您的工作只是创建模板，您可能不会勾选此选项（尽管，提供示例内容以展示模板的潜力给最终用户，可能也是一个好主意）。\n\
  \n## 安装 Joomla! 模板\n\nArtisteer 生成的模板的安装方式与任何其他模板完全相同。登录管理面板后，请执行以下操作：\n\n1. 在菜单中导航至\
  \ **Extensions | Extension Manager**。\n2. 在 **Upload Package File** 字段中，单击 **Browse**\
  \ 按钮。\n3. 在打开的对话框中，指向您的模板文件。\n4. 单击 **Upload & Install**。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_110_0.png)\n\
  \n指向模板文件后，单击 Upload & Install 以安装模板\n\n模板将从您的本地计算机发送到服务器（根据您的互联网连接质量可能需要一些时间），并将被安装。此操作结束时，将显示确认文本\
  \ **Installing template was successful**。\n\n但是，刷新网站后您将看不到任何变化。我们的模板已安装，但未设置为显示（您可以在\
  \ Joomla! 中安装任意多个模板；甚至可以设置哪个模板用于显示哪个页面）。\n\n我们的下一步将是激活我们的模板。\n\n5. 将我们的模板设为默认：\n\
  \   - 从菜单导航至 **Extensions | Template Manager**。您将被重定向到 **Template Manager: Styles**\
  \ 屏幕。\n   - 在列表中找到您的模板并单击右侧对应的星标（在 **Default** 列中）。图标（星标）将被填满，这意味着从此刻起我们的模板是默认模板。\n\
  6. 刷新页面。您将看到网站使用我们的模板显示，尽管一些关键元素，如菜单，未显示。别担心，我们很快会修复这个问题！\n\n## 设置模板\n\n是时候让我们的模板看起来像我们在\
  \ Artisteer 中设计的那样了。\n\n### 标题和标语\n\n我们将要显示的第一个缺失元素是页眉中的标题和标语。您在 Artisteer 中为标题和标语输入的文本不会随模板一起导出。导出的只是这些文本的样式（外观），但您必须在\
  \ Joomla! 中再次输入它们。让我们回到 Joomla! 管理面板并执行以下步骤：\n\n1. 从菜单导航至 **Extensions | Template\
  \ Manager**。我们将返回到 **Template Manager: Styles** 屏幕。\n2. 在 Style 列区域单击您的模板。您将进入 **Template\
  \ Manager: Edit Style** 屏幕。\n3. 在右侧，您将看到 **Basic Options** 区域，其中包含 **Headline**\
  \ 和 **Slogan** 字段。在其中输入适当的文本。\n4. 单击工具栏上的 **Save** 按钮保存更改。\n\n刷新页面后，您将看到标题和标语正在显示。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_112_0.png)\n\n输入 Headline 和 Slogan 的文本\n\
  \n### 水平菜单\n\n为 Artisteer 生成的模板创建水平菜单的方式与为 Joomla! 中任何其他模板创建水平菜单的方式相同。您唯一需要记住的是将其放置在\
  \ position-1 (user3) 区域。\n\n> 如果您将水平菜单放置在其他区域，它会工作，但外观不会如设计。要使其看起来像 Artisteer 中的那样，您必须将其放置在\
  \ position-1 (user3) 区域。\n\n### 垂直菜单\n\n垂直菜单通常放置在左侧或右侧列中。创建垂直菜单比水平菜单涉及更多步骤，因为您必须为其定义模块后缀。\n\
  \n要正确显示垂直菜单，包括 Artisteer 中设计的整体外观，请执行以下步骤：\n\n1. 创建一个新的垂直菜单模块。\n2. 将菜单放置在目标区域（通常为左侧或右侧列）。\n\
  3. 编辑模块设置，并在模块管理器屏幕中展开高级选项区域。\n4. 在 Module Class Suffix 字段中输入 `art-vmenu`。\n5. 保存更改。\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_113_0.png)\n\n要正确显示垂直菜单，您必须将 Module Class\
  \ Suffix 设置为 art-vmenu\n\n### 页脚修改\n\n最后需要修改的是我们网站的页脚。在 Artisteer 生成的模板中，您可以通过修改\
  \ position-27 (copyright) 区域来实现。我们需要做的就是创建一个新的 Custom HTML 类型的模块，并将其放置在此区域。我们的模块将成为新的网站页脚。让我们执行以下步骤：\n\
  \n1. 创建一个新的 Custom HTML 模块并将其标题设为：Footer。\n2. 禁用模块标题的显示。\n3. 将其放置在 position-27 (copyrights)\
  \ 中。\n4. 输入您希望在页脚中显示的文本。\n5. 保存更改并启用新模块。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_113_1.png)\n\
  \n页脚模块设置\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_113_2.png)\n\n页脚中的示例文本——当然，您应该在此处放置您的数据\n\
  \n刷新页面后，您将看到我们的网站具有新的页脚，我们已经设计好了。\n\n\n\n## 导入内容\n\n我相信你在为页眉的标题和标语输入文本时已勾选了 **从模板导入内容**\
  \ 按钮。我们现在将使用它，并将内容从 Artisteer 模板导入到 Joomla! 网站。请执行以下步骤：\n\n- 1. 在 Joomla! 管理面板中，导航至\
  \ **扩展** | **模板管理器**。\n- 2. 进入 **模板管理器** | **样式**，并在 **样式** 列中查找并点击你的模板。\n- 3. 在\
  \ **模板管理器：编辑样式** 屏幕中，点击 **从模板导入内容** 按钮。\n- 4. 在确认对话框中点击 **导入**。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_114_0.png)\n\
  \n点击导入按钮将内容从模板导入到 Joomla！\n\n你在 Artisteer 中输入的所有内容都将被导入到 Joomla！水平菜单、垂直菜单、页脚和页面将自动创建并显示。甚至我们图片的\
  \ Lightbox 效果也能正常工作！\n\n我们可以观察到内容导入的方式：\n\n- 新建了一个名为 `Articles` 的分类。所有导入的文章（所有页面的文本）都已放入此新分类中。\n\
  - 创建了一个水平菜单的新模块，名称为 `Content/Horizontal Menu`，所有项目均为单篇文章类型。\n- 创建了一个垂直菜单的新模块，名称为\
  \ `Content/Vertical Menu`，所有项目均为单篇文章类型。\n- 创建了一个名为 `Content/Special Menu` 的菜单，但未关联任何模块。该菜单包含两个标准项目。第一个项目为分类博客类型，与精选分类中的文章相关联。第二个项目为单篇文章项目，目前未关联到任何文章。\n\
  - 页脚已作为新的自定义 HTML 模块导入，名称为 **Footer**，放置在 **position-27**。添加了一些新的空页面（作为没有内容的文章）。Joomla！不允许你保存空文章。因此，如果你尝试编辑并保持不变地保存它们，将会显示错误文本，提示你必须先输入一些内容。\n\
  - 所有图片都已放入 `Media` 中的 `template-content` 文件夹。\n- 包含我们联系信息的一个区块已作为新的自定义 HTML 类型模块插入。\n\
  \n还请注意，菜单项目和文章的别名均未显示我们在 Artisteer 中输入的页面的标题或文件名。菜单别名是使用 *ct-menu-item-number* 模式创建的。\n\
  \n> 出于 SEO 目的，你应该修改导入文章和菜单项目中的别名。\n\n## WordPress 模板\n\nWordPress 是另一款非常流行的 CMS，使用\
  \ PHP 语言编写。\n\n使用它，你需要一个支持 PHP 的托管账户以及访问一个 MySQL 数据库。\n\n你也可以在 `wordpress.com` 域名上注册系统的免费实例。\n\
  \n该软件在 GPL 许可证下发布，你可以从官方项目页面 `wordpress.org` 免费下载。\n\nWordPress 是 b2/cafelog 博客系统的继任者，最初也是一款博客平台。\n\
  \n随着时间的推移和新版本的发布，该系统已经成熟，现在可以被视为一个完整的 CMS 系统。\n\nWordPress 与其他解决方案的区别在于其易用性和易于管理，使其成为初学者的最佳选择之一。\n\
  \nWordPress 不仅是一个非常用户友好的解决方案，而且其核心功能可以通过各种插件进行扩展（市场上既有免费也有商业的，数以千计），使该 CMS 成为一个可扩展的解决方案，适用于许多项目。在撰写本书时，可用的最新\
  \ WordPress 版本是 3.5.1。\n\n## 小部件区域\n\n与其他 CMS 系统一样，WordPress 模板具有放置特殊元素（称为小部件）的特殊区域。Artisteer\
  \ 导出的 WordPress 主题具有以下小部件区域：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_116_0.png)\n\
  \nSource: www.artisteer.com\n\n## 导出 WordPress 模板\n\n导出 WordPress 模板时，你必须选择 WordPress\
  \ 作为目标平台。请确保在导出窗口中，模板字段中选择了 WordPress 主题。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_116_1.png)\n\
  \n导出 WordPress 主题\n\n其余设置与 Joomla！的导出类似。请确保已勾选 ZIP 归档选项。这将允许你直接从 WordPress 管理面板安装模板。\n\
  \n你还可以点击 **选项** 按钮并设置 WordPress 特定设置。它们并不多。你可以定义菜单项中主页的文本，以及该项目是否应显示。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_117_0.png)\n\
  \n与 WordPress 相关的导出选项\n\n导出 WordPress 模板后，就该将其安装到 CMS 中了：\n\n- 1. 登录管理面板。\n- 2.\
  \ 从菜单导航至 **外观** | **主题**。\n- 3. 点击 **安装主题** 选项卡（屏幕顶部）。\n- 4. 点击 **上传** 链接。\n- 5.\
  \ 点击 **浏览** 按钮，指向导出的主题文件，然后点击 **立即安装**。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_117_1.png)\n\
  \n在 WordPress 中安装新模板\n\n一段时间后，模板已安装，但如果我们想让它显示，就必须激活它。\n\n- 6. 点击 **激活** 链接。如果刷新网站，你将看到它已使用我们的模板显示。\n\
  \n## 设置模板\n\n现在，我们的模板已安装并激活，是时候设置它了。\n\n## 标题和标语\n\n我们要做的第一件事是为页面设置正确的标题和标语。为此，请执行以下步骤（我们假设你已登录\
  \ WordPress 控制面板）：\n\n- 1. 从菜单导航至 **外观** | **主题**。\n- 2. 找到你的模板并点击 **自定义** 链接。\n\
  - 3. 点击 **站点标题和标语** 选项。\n- 4. 在 **站点标题** 字段中输入正确的标题，在 **标语** 字段中输入标语。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_118_0.png)\n\
  \n- 5. 点击 **保存并发布** 按钮。\n\n## 自定义页脚\n\n如果你的模板已导入并激活，你可以自定义网站的页脚。为此，登录管理面板并从左侧主菜单导航至\
  \ **外观** | **主题选项**。然后在主屏幕区域向下滚动并找到 **页脚** 部分。点击 **覆盖默认主题页脚内容** 并启用下面的字段。现在你可以输入你想要的页脚的任何内容。因为它不是所见即所得编辑器，所以你需要手动编写\
  \ HTML 标签。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_118_1.png)\n\n## 菜单\n\n为\
  \ Artisteer 生成的模板创建水平和垂直菜单的方式与 WordPress 中任何其他模板的菜单相同。\n\n## 导入内容\n\n如果你在安装并激活模板后通过从\
  \ Artisteer 导出模板勾选了包含内容选项，将会询问你是否要从模板导入内容：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_119_0.png)\n\
  \n将内容从 Artisteer 生成的模板导入到 WordPress\n\n根据你的需求，你可以决定将导入的内容添加到 WordPress 中已有的内容中，替换现有内容，或直接点击关闭按钮拒绝导入内容。我们点击替换导入内容。\n\
  \n一段时间后，我们的内容将被导入并放入 CMS。你可以刷新页面并看到内容可用且已显示。\n\n我们可以看到内容已被导入并以以下方式显示：\n\n- Artisteer\
  \ 项目中的所有普通页面都已作为页面导入。所有页面的父级属性均已正确设置。网站结构得以保留。\n- Artisteer 中的所有博客文章都已作为文章导入。所有文章都属于未分类分类。\n\
  \n已创建了两个菜单，即 Sample HMenu（水平菜单）和 Sample VMenu（垂直菜单）。页面和文章已与其它 CMS 系统的菜单相关联。\n\n\
  我们描述了 Joomla！和 WordPress 的安装和导入内容，因为它们都是非常流行的解决方案。然而，Artisteer 支持更多 CMS 系统，并且随着\
  \ Artisteer 4 中引入 SDK，有可能扩展支持的系统数量。我们可以预期支持的 CMS 数量将会增加。\n\n\n\n在特定 CMS 中安装 Artisteer\
  \ 和非 Artisteer 模板的整体方式是相同的；因此，这更像是使用某个 CMS 解决方案的问题，而不是 Artisteer 本身的问题。\n\n在为特定\
  \ CMS 设计时，你应该知道的最重要的一点是 Artisteer 为各种平台生成的模板区域布局。\n\n## Drupal\n\nArtisteer 生成的模板在\
  \ Drupal 主题中包含以下区域：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_120_0.png)\n\n来源:\
  \ www.artisteer.com\n\n## DotNetNuke\n\nArtisteer 生成的模板在 DotNetNuke 主题中包含以下区域：\n\
  \n![](img/7f889df2ffdb68108cff34d798a2b9a3_121_0.png)\n\n来源: www.artisteer.com\n\
  \n## 内容编辑 – Artisteer 或 CMS\n\n我们已自动将 Artisteer 项目中的所有内容导入到 Joomla! 和 WordPress。\
  \ 我们在 Artisteer 中准备的所有内容——即页面（带文字和图片）、菜单、菜单项和页脚——现在都存在并且在我们的 CMS 网站中正常工作。整个过程虽然简单快捷，但你可能会想知道最好的工作方式是什么：应该在\
  \ Artisteer 中准备所有内容然后导入到 CMS，还是安装空模板并直接在 CMS 中输入内容？\n\n这个问题的答案并不那么明显。两种方法都可行，选择权在你。但你应该考虑每种方法的优缺点。以下是直接在\
  \ Artisteer 中准备内容的优缺点：\n\n| 在 Artisteer 中准备内容的优点 | 在 Artisteer 中准备内容的缺点 |\n|---|---|\n\
  | 可以非常快速完成，无需切换到 CMS 甚至安装它。你可以在拥有主机账户之前就进行操作。 | 内容是根据 Artisteer 设定的规则导入的。你别无选择，只能接受它们。例如，在\
  \ WordPress 中，所有文章都将被放入名为“未分类”的一个分类中。 |\n| 只要内容仍在 Artisteer 项目中，它就保持平台无关（当然不包括特定平台的功能）。你可以在决定使用特定\
  \ CMS 之前准备好整个网站。 | 你无法设置一些重要属性，例如 Joomla! 中文章和菜单项的别名。它们是自动设置的。这对 SEO 地址有直接影响。如果你想修复它们，就必须手动在\
  \ CMS 中纠正。这需要时间。 |\n| 如果你为他人准备网站，你可以在不触碰其系统的情况下准备好带内容的整个网站。你只需将整个网站导出为一个可安装的 ZIP\
  \ 包即可。 | 你无法使用在 CMS 中安装的任何第三方扩展提供的功能，也无法使用已上传的图片。你在目标系统之外。 |\n| 你可以为模板准备示例内容。 |\
  \  |\n\n以下是直接在 CMS 中准备内容的优缺点：\n\n| 直接在 CMS 中准备内容的优点 | 直接在 CMS 中准备内容的缺点 |\n|---|---|\n\
  | 你可以使用 CMS 的全部功能，包括所有已安装的扩展和已上传的图片。 | Web 应用的响应速度不如桌面应用。你可能使用 Artisteer 编写一篇简单文章所需的时间会比使用\
  \ CMS 少一些。 |\n| 你可以完全控制内容和 CMS 功能。你可以为文章和菜单项设置适当的别名，为各种文章分配各种分类，设置分类名称、上传图片的位置等等。\
  \ |  |\n| 内容可以由一队人同时插入。 |  |\n\n从上述分析可以得出的结论是，如果你制作一个简单的网站，或需要非常快速地完成某些工作，你可以在 Artisteer\
  \ 中准备内容然后导入到 CMS 系统。如果你要构建一个相当复杂的网站，并且已经决定使用哪个 CMS，直接在 CMS 中输入内容是更好的选择。你将完全控制自己的工作。\n\
  \n## 摘要\n\n在本章中，你学习了如何为 CMS 平台设计模板。我们讨论了由 CMS 驱动的网站与静态 HTML 网站之间的总体差异，并了解了 Artisteer\
  \ 的一些新功能。我们已成功在 Joomla! 和 WordPress——两个最受欢迎的 CMS 解决方案中导出并安装了模板。\n\n但我们与 Artisteer\
  \ 的冒险还未结束。通过对生成代码做少量修改，你可以实现“看似在 Artisteer 中无法完成”的事情。\n\n# 4 个技巧和窍门\n\n我们已经[content]\n\
