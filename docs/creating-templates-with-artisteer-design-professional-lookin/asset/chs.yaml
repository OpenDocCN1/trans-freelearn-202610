  \n\n\n## 前言\n\n设计外观精美、专业品质的网页模板或构建自己的网站是一项复杂的工作。Artisteer 改变了这种情况，使任何人都能自行完成，而无需学习\
  \ HTML、网页编程语言或绘图等知识。*使用 Artisteer 创建模板*是一本实用、分步指南，将向您展示如何使用 Artisteer 的功能自行准备优雅、专业外观的网站。\n\
  \n本书非常适合爱好者、Artisteer 用户以及希望在不支付专业服务、昂贵工具费用且加快工作速度、自动化耗时任务的情况下创建专业外观网站的个人。\n\n##\
  \ 本书涵盖内容\n\n*第1章，认识 Artisteer*，帮助您了解 Artisteer 到底是什么以及它如何对您有用。我们将熟悉应用程序的界面和一些基本功能。您还将制作自己的第一个模板。\n\
  \n*第2章，逐步制作模板*，涵盖使用 Artisteer 设计的典型流程，逐一解释模板的所有典型元素。本章结束时，您将能够独自准备自己的简单网站。\n\n*第3章，CMS\
  \ 模板*，讨论使用内容管理系统（CMS）相对于静态网站的优势，以及如何使用 Artisteer 为此类解决方案设计模板。我们将把示例项目转换为可安装的 Joomla!\
  \ 和 WordPress 包，并将内容从 Artisteer 导入到 CMS。\n\n*第4章，技巧与窍门*，向您展示通过稍微修改程序生成的源代码，可以为项目增添的一些额外效果。\n\
  \n## 阅读本书所需\n\n为了充分欣赏本书，我们建议您使用可从 http://www.artisteer.com/ 下载的 Artisteer 版本 4，以及可从\
  \ http://notepad-plus-plus.org/ 下载的 Notepad++。\n\n## 本书适合谁阅读\n\n本书面向希望自行构建个人或公司网站，而无需学习\
