- raw:
  - '[PAGE 61]


    The last three options (Active, Passive, and Hovered) let you precisely design
    the look of menu items according to the three states that they can be in:


    +   - **Active menu item**: It''s an item that represents the page currently being
    displayed. It''s a good idea to make the active item look different than the others,
    because it allows the visitor to quickly find out which page he is currently viewing.

    +   - **Passive menu item**: It''s an item that is neither active nor hovered.

    +   - **Hovered menu item**: It''s an item under your mouse pointer. Featuring
    an item using mouseover is commonly used for a decorative effect.


    You may wonder, what is the sense of using the Item option, and when will you
    design the look of the items separately for each of their three states? Well,
    I must say that you have a point. The options you find in the Item list have more
    of a general character and apply to all the menu items at once (please note, that
    they don''t give you the possibility to choose something basic such as color).
    In case the basic setting from Item interferes with the settings defined for a
    particular state (active, passive, or hover), then the priority has the more detailed
    settings.


    The Submenu group contains the options that are analogous to those from the Menu
    group, except that they apply not to the top-level items, but to subitems. This
    group has Passive and Hover, but there''s no Active here—and this is not a mistake.
    The horizontal menu expands by mouseover, and when the mouse pointer is moved
    out it collapses, and is shown again only to the top-level items. So the active
    subitem is never visible, it is always collapsed. That''s why the subitems are
    never in the active state.


    # Levels


    Have a look at the first button called Items in the Submenu group. This is the
    one of the most important buttons in the Menu tab. It defines the look and feel
    of the whole menu. Click on it, and you will see a list of the following five
    options:


    +   - **No submenu (no subitems)**

    +   - **One column**

    +     - **Multilevel**

    +     - **Extended**

    +   - **Multi-column**

    +     - **Megamenu**

    +     - **Megamenu extended**'
  - '[PAGE 62]


    To better understand the meaning of these variants, let''s consider a site with
    the following structure:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_62_0.png)


    We have three items on the top level. Each of these items has three of its own
    subitems, and each of those subitems also has three of its own subitems. Let''s
    see how each variant of the the horizontal menu will look for a site with the
    structure as presented in the previous diagram.


    # No submenu (no subitems)


    This is the first and most basic variant of the horizontal menu. In this variant,
    the horizontal menu displays only the top-level items. Subitems aren''t displayed
    at all:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_62_1.png)


    # One column – multilevel


    In this variant, our menu shows the top-level items and also the subitems. The
    subitems are presented in a column, just below the parent top-level item. The
    next level items are presented in the column on the right (or on the left if the
    parent item is displayed on the right edge of the screen). This menu resembles
    the standard menu of the classic desktop applications:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_62_2.png)'
  - '[PAGE 63]


    # One column – extended


    This kind of menu is very similar to the one described in the previous section.
    The only difference is how the top-level item is marked when expanding. While
    in the previous example the column containing subitems was separated from its
    parent (top-level item), in this case they together make a simple unit:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_63_0.png)


    # Multi-column – megamenu


    This kind of menu (introduced in Artisteer 4) presents the subitems in many columns.
    The second-level items are displayed in a row (they are in bold), and the third-level
    items are displayed below in the form of columns. If the menu includes further
    levels, they are displayed just like in the previous variants (new column to the
    right of the parent item):


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_63_1.png)'
  - '[PAGE 64]


    # Multi-column – megamenu extended


    The difference between Megamenu and Megamenu Extended is analogous to the difference
    between Multilevel and Extended in one-column styles. Megamenu Extended is Megamenu
    with those difference, that is, the top-level item is joined with subitems.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_64_0.png)


    For our project, we will choose One-column | Multilevel.


    We will also define the look of our menu, but instead of designing every aspect
    individually, we will use the Menu Styles option. Click on the button and choose
    the first option in the fifth row. Our template should currently look like this:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_64_1.png)


    # Vertical menu


    Even if you are satisfied with our horizontal menu, we can''t forget about our
    vertical menu. Click on the Vertical Menu tab on the ribbon and we can start.'
  - '[PAGE 65]


    The available options located in the **Vertical Menu** tab are ordered similar
    to the those on the **Menu** tab. First on the left (as always) we have **Suggestion
    Tool**, followed by the **Layout** group (don''t confuse it with the **Layout**
    tab!), which contains only one button (it''s rather a small group, isn''t it?).
    This is an important button, which determines the location of the vertical menu.
    Let''s click on it.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_65_0.png)


    This list that is displayed is divided into two groups: **No block** and **Block
    Position**. The second group contains several options that change the location
    of the vertical menu. The target position is marked as filled area on the icon.
    Switch among the options and observe that the vertical menu is moving from one
    position to another. Note that you don''t have to necessarily display the vertical
    menu in a side column, although in most cases displaying the vertical menu above
    or below the content is not the best idea.


    > The content of this list changes according to the layout of the project. Had
    we chosen a three-column layout for example, you would see many more options in
    it.


    The first group (**No Block**) contains only one icon. By enabling this option
    you decide not to display the vertical menu at all.


    > Choosing the **No Block** option is the same as if you delete the vertical menu
    using the icon located on its top-right corner (remember how we removed the search
    block?). If you remove the vertical menu, you can restore it to the project at
    any time by choosing any other position in the **Position** list.'
  - '[PAGE 66]


    The **Styles** button works analogically to the **Menu Styles** button from the
    **Menu** tab. It lets you define the look of the whole menu very quickly, by choosing
    one of predefined options. Similarly, the options from the **Menu Area**, **Item**,
    and **Submenu** groups work analogically to their equivalents, which we used while
    designing the horizontal menu. As they are very similar, we won''t describe them
    one by one, but rather focus on the differences between the vertical and horizontal
    menus (of course, the main difference is that one is vertical, and the other horizontal).


    The vertical menu is actually a kind of block (anything displayed in the side
    column is a block). Like any other block, the vertical menu may or may not have
    a header (title text). You can hide (or show, if it''s already hidden) this header,
    and also choose one of the predefined styles of the vertical menu with the list
    of options on the **Menu Block** button. Note that there is no other way to remove
    the header. You can edit and change its text, but even if you remove all the characters,
    you will still have a header (although an empty one). You also cannot remove the
    header from a block using the icon in the top-right corner. Even if the border
    or frame encloses only the header and not the whole block, clicking on the icon
    removes the whole block.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_66_0.png)


    The horizontal menu always expands on mouseover and collapses automatically. The
    vertical menu may behave differently, depending on the settings. The active subitems
    may be visible, so it makes sense to design the look for all the three states
    (active, passive, and hovered). That''s why **Active**, **Passive**, and **Hovered**
    buttons are present for both the items and subitems of the vertical menu.


    # Vertical menu behavior


    The possible options for defining the vertical menu behavior are available with
    the **Levels** button, which is located in the **Submenu** group.'
  md: "\nThe last three options (Active, Passive, and Hovered) let you precisely design\
    \ the look of menu items according to the three states that they can be in:\n\n\
    - **Active menu item**: It's an item that represents the page currently being\
    \ displayed. It's a good idea to make the active item look different than the\
    \ others, because it allows the visitor to quickly find out which page he is currently\
    \ viewing.\n- **Passive menu item**: It's an item that is neither active nor hovered.\n\
    - **Hovered menu item**: It's an item under your mouse pointer. Featuring an item\
    \ using mouseover is commonly used for a decorative effect.\n\nYou may wonder,\
    \ what is the sense of using the Item option, and when will you design the look\
    \ of the items separately for each of their three states? Well, I must say that\
    \ you have a point. The options you find in the Item list have more of a general\
    \ character and apply to all the menu items at once (please note, that they don't\
    \ give you the possibility to choose something basic such as color). In case the\
    \ basic setting from Item interferes with the settings defined for a particular\
    \ state (active, passive, or hover), then the priority has the more detailed settings.\n\
    \nThe Submenu group contains the options that are analogous to those from the\
    \ Menu group, except that they apply not to the top-level items, but to subitems.\
    \ This group has Passive and Hover, but there's no Active here—and this is not\
    \ a mistake. The horizontal menu expands by mouseover, and when the mouse pointer\
    \ is moved out it collapses, and is shown again only to the top-level items. So\
    \ the active subitem is never visible, it is always collapsed. That's why the\
    \ subitems are never in the active state.\n\n## Levels\n\nHave a look at the first\
    \ button called Items in the Submenu group. This is one of the most important\
    \ buttons in the Menu tab. It defines the look and feel of the whole menu. Click\
    \ on it, and you will see a list of the following five options:\n\n- **No submenu\
    \ (no subitems)**\n- **One column**\n  - **Multilevel**\n  - **Extended**\n- **Multi-column**\n\
    \  - **Megamenu**\n  - **Megamenu extended**\n\nTo better understand the meaning\
    \ of these variants, let's consider a site with the following structure:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_62_0.png)\n\
    \nWe have three items on the top level. Each of these items has three of its own\
    \ subitems, and each of those subitems also has three of its own subitems. Let's\
    \ see how each variant of the horizontal menu will look for a site with the structure\
    \ as presented in the previous diagram.\n\n### No submenu (no subitems)\n\nThis\
    \ is the first and most basic variant of the horizontal menu. In this variant,\
    \ the horizontal menu displays only the top-level items. Subitems aren't displayed\
    \ at all:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_62_1.png)\n\n### One column\
    \ – multilevel\n\nIn this variant, our menu shows the top-level items and also\
    \ the subitems. The subitems are presented in a column, just below the parent\
    \ top-level item. The next level items are presented in the column on the right\
    \ (or on the left if the parent item is displayed on the right edge of the screen).\
    \ This menu resembles the standard menu of the classic desktop applications:\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_62_2.png)\n\n### One column – extended\n\
    \nThis kind of menu is very similar to the one described in the previous section.\
    \ The only difference is how the top-level item is marked when expanding. While\
    \ in the previous example the column containing subitems was separated from its\
    \ parent (top-level item), in this case they together make a simple unit:\n\n\
    ![](img/7f889df2ffdb68108cff34d798a2b9a3_63_0.png)\n\n### Multi-column – megamenu\n\
    \nThis kind of menu (introduced in Artisteer 4) presents the subitems in many\
    \ columns. The second-level items are displayed in a row (they are in bold), and\
    \ the third-level items are displayed below in the form of columns. If the menu\
    \ includes further levels, they are displayed just like in the previous variants\
    \ (new column to the right of the parent item):\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_63_1.png)\n\
    \n### Multi-column – megamenu extended\n\nThe difference between Megamenu and\
    \ Megamenu Extended is analogous to the difference between Multilevel and Extended\
    \ in one-column styles. Megamenu Extended is Megamenu with that difference, that\
    \ is, the top-level item is joined with subitems.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_64_0.png)\n\
    \nFor our project, we will choose One-column | Multilevel.\n\nWe will also define\
    \ the look of our menu, but instead of designing every aspect individually, we\
    \ will use the Menu Styles option. Click on the button and choose the first option\
    \ in the fifth row. Our template should currently look like this:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_64_1.png)\n\
    \n## Vertical menu\n\nEven if you are satisfied with our horizontal menu, we can't\
    \ forget about our vertical menu. Click on the Vertical Menu tab on the ribbon\
    \ and we can start.\n\nThe available options located in the **Vertical Menu**\
    \ tab are ordered similar to those on the **Menu** tab. First on the left (as\
    \ always) we have **Suggestion Tool**, followed by the **Layout** group (don't\
    \ confuse it with the **Layout** tab!), which contains only one button (it's rather\
    \ a small group, isn't it?). This is an important button, which determines the\
    \ location of the vertical menu. Let's click on it.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_65_0.png)\n\
    \nThis list that is displayed is divided into two groups: **No block** and **Block\
    \ Position**. The second group contains several options that change the location\
    \ of the vertical menu. The target position is marked as filled area on the icon.\
    \ Switch among the options and observe that the vertical menu is moving from one\
    \ position to another. Note that you don't have to necessarily display the vertical\
    \ menu in a side column, although in most cases displaying the vertical menu above\
    \ or below the content is not the best idea.\n\n> The content of this list changes\
    \ according to the layout of the project. Had we chosen a three-column layout\
    \ for example, you would see many more options in it.\n\nThe first group (**No\
    \ Block**) contains only one icon. By enabling this option you decide not to display\
    \ the vertical menu at all.\n\n> Choosing the **No Block** option is the same\
    \ as if you delete the vertical menu using the icon located on its top-right corner\
    \ (remember how we removed the search block?). If you remove the vertical menu,\
    \ you can restore it to the project at any time by choosing any other position\
    \ in the **Position** list.\n\nThe **Styles** button works analogically to the\
    \ **Menu Styles** button from the **Menu** tab. It lets you define the look of\
    \ the whole menu very quickly, by choosing one of predefined options. Similarly,\
    \ the options from the **Menu Area**, **Item**, and **Submenu** groups work analogically\
    \ to their equivalents, which we used while designing the horizontal menu. As\
    \ they are very similar, we won't describe them one by one, but rather focus on\
    \ the differences between the vertical and horizontal menus (of course, the main\
    \ difference is that one is vertical, and the other horizontal).\n\nThe vertical\
    \ menu is actually a kind of block (anything displayed in the side column is a\
    \ block). Like any other block, the vertical menu may or may not have a header\
    \ (title text). You can hide (or show, if it's already hidden) this header, and\
    \ also choose one of the predefined styles of the vertical menu with the list\
    \ of options on the **Menu Block** button. Note that there is no other way to\
    \ remove the header. You can edit and change its text, but even if you remove\
    \ all the characters, you will still have a header (although an empty one). You\
    \ also cannot remove the header from a block using the icon in the top-right corner.\
    \ Even if the border or frame encloses only the header and not the whole block,\
    \ clicking on the icon removes the whole block.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_66_0.png)\n\
    \nThe horizontal menu always expands on mouseover and collapses automatically.\
    \ The vertical menu may behave differently, depending on the settings. The active\
    \ subitems may be visible, so it makes sense to design the look for all the three\
    \ states (active, passive, and hovered). That's why **Active**, **Passive**, and\
    \ **Hovered** buttons are present for both the items and subitems of the vertical\
    \ menu.\n\n### Vertical menu behavior\n\nThe possible options for defining the\
    \ vertical menu behavior are available with the **Levels** button, which is located\
    \ in the **Submenu** group.\n"
  mdcn: "\n最后三个选项（活动、非活动和悬停）让你能够根据菜单项可能存在的三种状态精确设计其外观：\n\n-   **活动菜单项**：它代表当前正在显示的页面的项目。让活动项看起来与其他项不同是个好主意，因为它能让访客快速知道自己当前正在查看哪个页面。\n\
    -   **非活动菜单项**：它既不是活动状态也不是悬停状态的项目。\n-   **悬停菜单项**：它是指鼠标指针下的项目。使用鼠标悬停突出显示项目通常用于装饰效果。\n\
    \n你可能会想，使用“项目”选项有什么意义，又在什么时候会为其三种状态分别设计项目的外观呢？好吧，我必须说你说得有道理。项目列表中的选项更具通用性，并同时适用于所有菜单项（请注意，它们不会让你选择诸如颜色之类的基本属性）。如果来自“项目”的基本设置与为特定状态（活动、非活动或悬停）定义的设置冲突，则更详细的设置具有优先权。\n\
    \n“子菜单”组包含与“菜单”组类似的选项，只是它们不适用于顶级项目，而是适用于子项目。该组有“非活动”和“悬停”，但这里没有“活动”——这不是错误。水平菜单通过鼠标悬停展开，当鼠标指针移开时它会折叠，并且仅对顶级项目再次显示。因此活动子项目永远不可见，它始终处于折叠状态。这就是为什么子项目永远不会处于活动状态。\n\
    \n## 级别\n\n请查看“子菜单”组中第一个名为“项目”的按钮。这是“菜单”选项卡中最重要的按钮之一。它定义了整个菜单的外观和感觉。点击它，你将看到以下五个选项的列表：\n\
    \n-   **无子菜单（无子项目）**\n-   **单列**\n  -   **多级**\n  -   **扩展**\n-   **多列**\n  -\
    \   **巨型菜单**\n  -   **巨型菜单扩展**\n\n为了更好地理解这些变体的含义，让我们考虑一个具有以下结构的网站：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_62_0.png)\n\
    \n我们顶层有三个项目。每个项目都有三个自己的子项目，而每个子项目也有三个自己的子项目。让我们看看对于上一个图表中所示结构的网站，水平菜单的每个变体会是什么样子。\n\
    \n### 无子菜单（无子项目）\n\n这是水平菜单的第一种也是最基本的变体。在此变体中，水平菜单仅显示顶级项目。子项目根本不显示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_62_1.png)\n\
    \n### 单列 – 多级\n\n在此变体中，我们的菜单显示顶级项目以及子项目。子项目以列的形式呈现，位于父顶级项目的正下方。下一级项目显示在右侧的列中（如果父项目显示在屏幕右侧边缘，则在左侧）。此菜单类似于经典桌面应用程序的标准菜单：\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_62_2.png)\n\n### 单列 – 扩展\n\n这种菜单与上一节描述的非常相似。唯一的区别是展开时顶级项目的标记方式。在前一个示例中，包含子项目的列与父级（顶级项目）分离，而在这种情况下，它们共同构成一个简单的单元：\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_63_0.png)\n\n### 多列 – 巨型菜单\n\n这种菜单（在\
    \ Artisteer 4 中引入）以多列形式呈现子项目。第二级项目以一行显示（它们为粗体），第三级项目以列的形式显示在其下方。如果菜单包含更多层级，它们将像前面的变体一样显示（父项目右侧的新列）：\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_63_1.png)\n\n### 多列 – 巨型菜单扩展\n\n“巨型菜单”与“巨型菜单扩展”之间的区别类似于单列样式中“多级”与“扩展”之间的区别。“巨型菜单扩展”就是在“巨型菜单”基础上有所不同，即顶级项目与子项目合并。\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_64_0.png)\n\n对于我们的项目，我们将选择单列 | 多级。\n\
    \n我们还将定义菜单的外观，但与其逐一设计每个方面，我们将使用“菜单样式”选项。点击按钮并选择第五行中的第一个选项。我们的模板目前应如下所示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_64_1.png)\n\
    \n## 垂直菜单\n\n即使你对我们的水平菜单满意，我们也不能忘记垂直菜单。点击功能区上的“垂直菜单”选项卡，我们就可以开始了。\n\n位于**垂直菜单**选项卡中的可用选项与**菜单**选项卡上的排列方式相似。最左侧（与往常一样）我们有**建议工具**，随后是**布局**组（不要将其与**布局**选项卡混淆！），它只包含一个按钮（这更像是一个小组，对吧？）。这是一个重要的按钮，它决定了垂直菜单的位置。让我们点击它。\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_65_0.png)\n\n显示的此列表分为两个组：**无区块**和**区块位置**。第二组包含多个更改垂直菜单位置的选项。目标位置在图标上以填充区域标记。切换选项并观察垂直菜单从一个位置移动到另一个位置。请注意，你不一定必须在侧栏中显示垂直菜单，尽管在大多数情况下在内容上方或下方显示垂直菜单并不是最好的主意。\n\
    \n> 此列表的内容会根据项目布局而变化。例如，如果我们选择了三列布局，你会看到其中有更多选项。\n\n第一个组（**无区块**）只包含一个图标。通过启用此选项，你决定完全不显示垂直菜单。\n\
    \n> 选择**无区块**选项与使用其右上角的图标删除垂直菜单相同（还记得我们如何移除搜索区块吗？）。如果你移除了垂直菜单，你可以随时通过在**位置**列表中选择其他位置来将其恢复到项目中。\n\
    \n**样式**按钮的工作方式与**菜单**选项卡中的**菜单样式**按钮类似。它让你能够通过选择预定义选项之一，快速定义整个菜单的外观。同样，**菜单区域**、**项目**和**子菜单**组中的选项也与我们在设计水平菜单时使用的对应选项类似。由于它们非常相似，我们不会逐一描述它们，而是重点关注垂直菜单和水平菜单之间的差异（当然，主要区别是一个是垂直的，另一个是水平的）。\n\
    \n垂直菜单实际上是一种区块（在侧栏中显示的任何内容都是一个区块）。与其他区块一样，垂直菜单可能有标题（标题文本），也可能没有。你可以隐藏（或显示，如果它已被隐藏）此标题，并使用**菜单区块**按钮上的选项列表选择垂直菜单的预定义样式之一。请注意，没有其他方法可以移除标题。你可以编辑并更改其文本，但即使删除所有字符，你仍然会有标题（尽管是空的）。你也不能使用右上角的图标从区块中移除标题。即使边框或框架仅包围标题而不是整个区块，点击图标也会移除整个区块。\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_66_0.png)\n\n水平菜单始终在鼠标悬停时展开并自动折叠。垂直菜单的行为可能不同，这取决于设置。活动子项目可能可见，因此为三种状态（活动、非活动和悬停）设计外观是有意义的。这就是为什么垂直菜单的项目和子项目都存在**活动**、**非活动**和**悬停**按钮。\n\
    \n### 垂直菜单行为\n\n定义垂直菜单行为的可能选项可通过**子菜单**组中的**级别**按钮获得。\n"
