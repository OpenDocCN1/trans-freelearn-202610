- raw:
  - '[PAGE 114]


    # Importing content


    I''m sure you have marked the **Import Content from Template** button while entering
    text for the header Headline and Slogan. We are going to use it now and import
    the content from Artisteer template into a Joomla! site. Perform the following
    steps:


    +   1. In the Joomla! Administration Panel, navigate to **Extensions** | **Template
    Manager**.

    +   2. Go to **Template Manager** | **Styles** and look for and click on your
    template, within the **Style** column.

    +   3. In the **Template Manager: Edit Style** screen, click on **Import Content
    From Template** button.

    +   4. Click on **Import** in the confirmation dialog box.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_114_0.png)


    Click on the Import button to import the content from the template into Joomla!


    All the content you have entered in Artisteer will be imported to Joomla!. Horizontal
    menu, vertical menu, footer, and pages will be automatically created and displayed.
    Even the Lightbox effect for our images works!


    We can observe the way the content was imported:


    +   - A new category called `Articles` was created. All imported articles (text
    from all pages) have been put into this new category.

    +   - A new module for the horizontal menu has been created, with the name `Content/Horizontal
    Menu`, and all the items are of Single Article type.

    +   - A new module for the vertical menu has been created, with the name `Content/Vertical
    Menu`, and all the items are of Single Article type.'
  - '[PAGE 115]


    +   - A menu by the name `Content/Special Menu` has been created, but without
    any associated module. This menu contains two standard items. The first item is
    of the Category Blog type, associated with articles from the Featured category.
    The second one is a Single Article item, currently not associated to any article.

    +   - The footer has been imported as a new Custom HTML module, with a name **Footer**
    that has been placed in **position-27**. Some new empty pages have been added
    (as articles without any content). Joomla! doesn''t allow you to save empty articles.
    So if you tried to edit and save them unchanged, there will be an error text displayed
    informing you that you have to enter some content first.

    +   - All the images have been put in `Media`, in the `template-content` folder.

    +   - A block containing our contact information has been inserted as a new module
    of the Custom HTML type.


    Also note that both aliases of menu items and articles show neither titles nor
    file names for pages that we entered in Artisteer. Menu aliases are created with
    the use of *ct-menu-item-number* pattern.


    > For SEO purposes, you should modify aliases in imported articles and menu items.


    # WordPress templates


    WordPress is another very popular CMS, written in PHP language. To use it, you
    will need a hosting account with support for PHP and access to one MySQL database.
    You can also sign up for your free instance of the system at the `wordpress.com`
    domain. The software is released under the GPL license and you can download it
    for free from the official project page `wordpress.org`. WordPress is the successor
    of b2/cafelog blogging system, and initially was also a blogging platform. With
    time and new releases, the system has matured and by now it can be considered
    as a full CMS system.


    What differentiates WordPress from other solutions is its ease of use and administration,
    making WordPress one of the best choices for beginners. Not only is WordPress
    a very user-friendly solution, but also the system''s core functionality can be
    extended with various plugins (there are thousands of them on the market, both
    free and commercial), making this CMS an extendable solution, appropriate for
    many projects. At the time of writing this book, the latest WordPress version
    available is 3.5.1.'
  - '[PAGE 116]


    # Widget areas


    Like other CMS systems, WordPress templates have special areas to place special
    elements (called widgets). Artisteer exports WordPress themes with the following
    widget areas:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_116_0.png)


    Source: www.artisteer.com


    # Exporting a WordPress template


    When exporting a template for WordPress, you have to choose WordPress as the target
    platform. Make sure that in the Export window, WordPress Theme is chosen in the
    Template field.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_116_1.png)


    Exporting WordPress theme


    The rest of the settings are analogical, such as export for Joomla!. Make sure
    that the ZIP archive option is checked. This will allow you to install the template
    directly from the WordPress Administration Panel.'
  - '[PAGE 117]


    You can also click on the **Options** button and set WordPress-specific settings.
    There are not plenty of them. You can define the text for Home Page in menu item,
    and whether this item should be displayed or not.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_117_0.png)


    WordPress related export options


    After you export a WordPress template, it''s then time to install it into the
    CMS:


    +   1. Log into Administration Panel.

    +   2. From the menu, navigate to **Appearance** | **Themes**.

    +   3. Click on the **Install Themes** tab (on top of the screen).

    +   4. Click on the **Upload** link.

    +   5. Click on the **Browse** button, point to the exported theme file, and click
    on **Install Now**.


