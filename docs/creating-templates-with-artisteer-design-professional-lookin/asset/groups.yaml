- raw:
  - '[PAGE 17]


    # 1


    # Meet the Artisteer


    In this book, you will see that you are able to design and prepare a professional-quality
    website template all alone, without anybody''s help. You don''t need to know how
    to draw or how to code. You don''t need to worry about HTML, CSS, PHP, and all
    that complicated stuff. All you need is your copy of Artisteer.


    You may ask, "What is Artisteer?"


    # What is Artisteer


    Artisteer is an Automated Web Designer. What does it mean? In simple words, it''s
    an application that lets you prepare great websites, even if you don''t know anything
    about drawing, programming, web technology, and all that stuff. With Artisteer,
    you can design your website, fill it with content, and in the end, generate the
    ready-to-use HTML/CSS files that you can upload to your web server (in fact, this
    can also be done in Artisteer). You can also automatically generate any layout
    in the form of a template dedicated to one of several well-known CMS systems,
    such as Joomla!, Drupal, WordPress, or DotNetNuke. The design process looks totally
    different in comparison to the traditional way in which it''s usually done. While
    you still have a lot of control and can decide many aspects of your design, the
    drawing process is done automatically and doesn''t demand any graphic skills from
    you, except a good eye for what looks good on a page. And it''s fast. Indeed very,
    very fast.


    Artisteer was the first application of its kind in the market and still remains
    one of the best tools in this category.'
  - '[PAGE 18]


    # Artisteer versus other software tools


    Because Artisteer is a new kind of tool, it is hard to give a proper definition
    of what it is. There are a lot of easier ways to say what Artisteer is not. This
    will allow us to avoid any confusion about what it should be compared with. If
    we consider the typical process of building a website, it usually consists of
    several stages as follows:


    +   1. Firstly, a designer prepares a design. He usually works with a graphics
    editor.

    +   2. When the design is ready, it''s analyzed in detail to qualify what can
    be achieved with HTML/CSS, and what has to stay as pictures. Then the whole layout
    is sliced into small pictures.

    +   3. A web developer prepares the layout in the HTML language and places every
    single picture into its proper position with the help of CSS. To illustrate the
    look of the site and to be able to choose the appropriate typography, the places
    for content are usually filled with some dummy text (for example, "`Lorem ipsum
    dolor sit amet...`"). He does this usually with a code editor.

    +   4. The dummy text gets replaced with the target content. This task is usually
    done with the help of a WYSIWYG editor. At the end of this stage, we have a complete
    static website.

    +   5. If the website should contain some more sophisticated elements, such as
    photo galleries, fancy tooltips, movies, forms, and so on, or if it should be
    transformed into a template for a CMS, an additional code has to be written. This
    is the job of a programmer, who writes the code in a code editor using a client-side
    or server-side language (according to what should be achieved).


    This allocation of tasks is of course quite hypothetical, and it may vary in particular
    teams and companies, but the goal was to show you the flow of the overall process.
    Sometimes the entire process is done by a single person, but in the case of bigger
    projects, it''s not uncommon that every stage is realized by a group of people.
    Therefore, we''re talking about a group of people (a team of various specialists)
    using different tools, such as graphics editors, WYSIWYG HTML editors, code editors,
    and so on.


    +   - Artisteer is not a graphics editor. In a graphics editor, you must design
    everything by hand, while in Artisteer all the elements (for example, header,
    menu, and so on) are generated automatically, according to the parameters you
    set via the program''s interface. Graphic editors offer sophisticated tools, which
    Artisteer doesn''t contain, to process pictures and photos. In a graphics editor
    you can create any graphic, while in Artisteer the only thing you can design is
    a website.'
  - '[PAGE 19]


    +   - Artisteer is not a WYSIWYG editor. In a **What You See Is What You Get**
    (**WYSIWYG**) editor, you can type the words and insert the graphic elements into
    a website in a similar way as you would use a word processor (for example, MS
    Word) and the application automatically transforms everything into an HTML code.
    The layout elements in Artisteer are not just graphics, they are highly interactive
    and you have a lot of control over them. You can resize them, change the color,
    border, placement, and almost any other aspect of their look and feel. Your actions
    are not transformed into HTML immediately. You work with a binary Artisteer project
    (.artx files), and only when you press the **Export** button, the layout is exported.
    What it means is that all the layout is processed in one go and the HTML/CSS/JavaScript/PHP
    code is generated. But it''s also true, that the way of working with Artisteer
    is practically WYSIWYG – you don''t see any code, but the final design.

    +   - Artisteer is not a code editor. You can press the **Show the code** button
    and take a look at the HTML file that will be generated (and even change it),
    but this is not the native way you will work with this application. The native
    way is "point and click". In a code editor you write the code and preview the
    results. In Artisteer you modify the results and preview the generated code.

    +   - Artisteer is also not a collection of predesigned layouts, as many people
    seem to think. There is no upper limit on the unique layouts that can be created,
    because the answer is unlimited. It''s true that the program contains a limited
    number of graphics and predefined elements, for example, menu. But the possibility
    of inserting your own images and determining almost any aspect of the elements
    (size, colors, fonts, and so on) suggests that you are a real designer, and not
    just someone who selects a template from the predefined options.


    The tools that are most similar to Artisteer are other web builder applications.
    The difference is in what you can change and set up. As I mentioned earlier, you
    can change almost everything in Artisteer.'
  - '[PAGE 20]


    # Who can use Artisteer


    So who is Artisteer dedicated to? The potential audience of this program is very
    large. I can''t be sure, but I feel that the intention of Artisteer''s creators
    was to create a tool that allows the nongraphic and nontechnician people to create
    complete and great-looking websites. This would place Artisteer as a tool for
    hobbyists and enthusiasts, but the scope of users is much larger. Let''s consider
    this problem from several different points of view.


    # Hobbyists


    A hobbyist is somebody who wants to have a website because of his/her private
    passion. It''s not his/her job, it''s not his/her business, he/she won''t gain
    any money on it. It may be a private blog on Blogger or WordPress, or just a simple
    family website, often based on the cheapest hosting service possible. For such
    a person, hiring a professional web development company or freelancer is usually
    not an option because of the cost. Usually, the only available option is to try
    to prepare the page on his/her own (the results will be adequate to his/her skills),
    or to buy a ready-made template (accepting the fact that there are a lot of different
    websites that look the same). Artisteer gives such people a third option: buy
    the program and prepare a unique and good-looking site all alone. The cost will
    be less than the usual price for a ready-made, standard layout on the market.


    # Designers


    A designer is an artistically talented person who can use the graphics editors
    and create good-looking designs for web pages. In a team, a designer usually does
    the first stage of work, creating an overall concept of how the site will look,
    and preparing the graphics. While a designer is good at drawing, he/she can''t
    code. To create a website a designer needs the help of a web developer. But with
    Artisteer, he/she can design the template and enrich it with his/her own custom
    graphic elements, which he/she can prepare. He/she can even enter the content
    and transfer this all into a CMS skin, offering the end user a complete solution.'
