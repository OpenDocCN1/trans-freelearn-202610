    \    </li>\n<!-- Next subitems... -->\n    <li>\n        <a href=\"offer/joomla.html\"\
    >Joomla!</a>\n    </li>\n    <li>\n        <a href=\"offer/dotnetnuke.html\">DotNetNuke</a>\n\
    \    </li>\n</ul>\n</ul>\n```\n\n11. Because we don't have any parent item in\
    \ our menu anymore, there's no sense to have two nested lists in our code (the\
