    # Another way of modifying CSS files


    This tip applies to all kind of templates. An example would be the `OneDayBlue.artx`
    file.


    In the *Styling from scratch* and *Adding additional CSS to the project* tips,
    we have modified the CSS stylesheets of the relevant project. Each of these examples
    presents a different approach to the problem:


    +   - We modified an exported CSS template file

    +   - We added some CSS definitions directly in Artisteer


    Each of these techniques has its advantages and disadvantages. If you edit the
    exported CSS file, you can do it with your favorite text editor, which is probably
    equipped with many tools that make the job more comfortable (like code highlighting).
    Also, while editing the exported CSS file, you will see all of the content (CSS
    definitions used in the template) and don''t have to write blindfolded. The disadvantage
    of this approach is that if you modify your project in Artisteer (using GUI) and
    export the new version once again, your file will be overwritten with the new
    one, and your modifications will be lost. You will have to rewrite your changes.'
  - '[PAGE 150]


    If you add CSS directly in Artisteer, your modifications are stored in the .artx
    project. You can modify the project and export it as many times as you want, and
    your additional CSS code will be preserved. While this sounds like a better way,
    the discomfort of writing CSS in Artisteer (with its lack of editorial tools)
    and the fact that you don''t see the rest of the code, makes this really inconvenient.


    The third way is to write and save all the modifications in a separate CSS file
    and then connect it with the rest of the exported files. You can store a copy
    of your CSS file along with the Artisteer project. If you change something in
    Artisteer, you can export the project and connect it with your file once again,
    with minimum effort and time. This way, you can comfortably edit the CSS code
    with your favorite text editor and you won''t lose your work at the next export.


    Let''s see this technique in practice. Open the example file (OneDayBlue.artx)
    and take a look at the template. This is just Artisteer''s Blank template, with
    only one page and a standard orange title in the header:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_150_0.png)


