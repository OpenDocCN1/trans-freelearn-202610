    \ changes. The examples here are the common questions that I have been asked by\
    \ many Artisteer users. I'm sure you will have your own questions too. A good\
    \ source of tips and tricks is the subscription of the Extensoft newsletter, in\
    \ which some nice tips are published. Also a good source of knowledge is Artisteer's\
    \ official website www.artisteer.com and Szablonik (www.szablonik.net) – another\
    \ website devoted to Artisteer. You may also look at my blog: http://artisteer.fajnyblog.eu,\
    \ where I publish tips from time-to-time.\n\n### Image links in a slideshow\n\n\
    This tip applies to HTML templates. An example project would be the `slidesAsLinks.artx`\
    \ file.\n\nIn this tip, I will show you how to modify the slideshow to make each\
    \ slide (or some of them, it's up to you) linked to other websites.\n\nWhen you\
    \ create a slideshow, you can define particular images, but you can't set any\
    \ of the slides as links. The first idea is of course to click anywhere in the\
    \ article and then navigate to Edit | HTML in the menu to show the source of the\
    \ article containing the slideshow and do the proper modification without going\
    \ out of the program. Let's do it.\n\n- 1. In place of the slideshow, you will\
    \ find something like the following:\n\n```\n<div class=\"image-caption-wrapper\"\
    \ style=\"width: 55%;\nfloat: left\">\n[collage_79]\n</div>\n```\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_126_0.png)\n\
    \n### Downloading the example code\n\nYou can download the example code files\
    \ for all Packt books you have purchased from your account at http://www.packtpub.com.\
    \ If you purchased this book elsewhere, you can visit http://www.packtpub.com/support\
    \ and register to have the files e-mailed directly to you.\n\n- 2. Oops! It looks\
    \ like Artisteer presents the slideshow not as source code, but as a special tag.\
    \ The whole slideshow is presented as [collage_79] (the number may differ, but\
    \ the overall pattern is always the same).\n\n- 3. Well, we have no other choice\
    \ but to export the template, and then edit the source. Export the template as\
    \ a folder and open the index.html file in the text editor. Look for the part\
    \ of code responsible for displaying the slideshow. You will find something similar\
    \ to the following:\n\n```\n<div class=\"art-slider art-slidecontainer79\">\n\
    \  <div class=\"art-slider-inner\">\n    <div class=\"art-slide-item art-slide790\"\
    ></div>\n    <div class=\"art-slide-item art-slide791\"></div>\n    <div class=\"\
    art-slide-item art-slide792\"></div>\n    <div class=\"art-slide-item art-slide793\"\
    ></div>\n  </div>\n</div>\n```\n\n- 4. Let's add some comments to the code to\
    \ make it more clear:\n\n```\n<!-- The external container, containing the slideshow\
    \ -->\n<div class=\"art-slider art-slidecontainer79\">\n  <!-- slideshow container\
    \ -->\n  <div class=\"art-slider-inner\">\n    <!-- first slide -->\n    <div\
    \ class=\"art-slide-item art-slide790\"></div>\n    <!-- second slide -->\n  \
    \  <div class=\"art-slide-item art-slide791\"></div>\n    <!-- third slide -->\n\
    \    <div class=\"art-slide-item art-slide792\"></div>\n    <!-- fourth slide\
    \ -->\n    <div class=\"art-slide-item art-slide793\"></div>\n  </div>\n</div>\n\
    ```\n"
  mdcn: "\n在特定 CMS 中安装 Artisteer 和非 Artisteer 模板的整体方式是相同的；因此，这更像是使用某个 CMS 解决方案的问题，而不是\
    \ Artisteer 本身的问题。\n\n在为特定 CMS 设计时，你应该知道的最重要的一点是 Artisteer 为各种平台生成的模板区域布局。\n\n\
    ## Drupal\n\nArtisteer 生成的模板在 Drupal 主题中包含以下区域：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_120_0.png)\n\
    \n来源: www.artisteer.com\n\n## DotNetNuke\n\nArtisteer 生成的模板在 DotNetNuke 主题中包含以下区域：\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_121_0.png)\n\n来源: www.artisteer.com\n\
    \n## 内容编辑 – Artisteer 或 CMS\n\n我们已自动将 Artisteer 项目中的所有内容导入到 Joomla! 和 WordPress。\
    \ 我们在 Artisteer 中准备的所有内容——即页面（带文字和图片）、菜单、菜单项和页脚——现在都存在并且在我们的 CMS 网站中正常工作。整个过程虽然简单快捷，但你可能会想知道最好的工作方式是什么：应该在\
    \ Artisteer 中准备所有内容然后导入到 CMS，还是安装空模板并直接在 CMS 中输入内容？\n\n这个问题的答案并不那么明显。两种方法都可行，选择权在你。但你应该考虑每种方法的优缺点。以下是直接在\
    \ Artisteer 中准备内容的优缺点：\n\n| 在 Artisteer 中准备内容的优点 | 在 Artisteer 中准备内容的缺点 |\n|---|---|\n\
    | 可以非常快速完成，无需切换到 CMS 甚至安装它。你可以在拥有主机账户之前就进行操作。 | 内容是根据 Artisteer 设定的规则导入的。你别无选择，只能接受它们。例如，在\
    \ WordPress 中，所有文章都将被放入名为“未分类”的一个分类中。 |\n| 只要内容仍在 Artisteer 项目中，它就保持平台无关（当然不包括特定平台的功能）。你可以在决定使用特定\
    \ CMS 之前准备好整个网站。 | 你无法设置一些重要属性，例如 Joomla! 中文章和菜单项的别名。它们是自动设置的。这对 SEO 地址有直接影响。如果你想修复它们，就必须手动在\
    \ CMS 中纠正。这需要时间。 |\n| 如果你为他人准备网站，你可以在不触碰其系统的情况下准备好带内容的整个网站。你只需将整个网站导出为一个可安装的 ZIP\
    \ 包即可。 | 你无法使用在 CMS 中安装的任何第三方扩展提供的功能，也无法使用已上传的图片。你在目标系统之外。 |\n| 你可以为模板准备示例内容。\
    \ |  |\n\n以下是直接在 CMS 中准备内容的优缺点：\n\n| 直接在 CMS 中准备内容的优点 | 直接在 CMS 中准备内容的缺点 |\n|---|---|\n\
    | 你可以使用 CMS 的全部功能，包括所有已安装的扩展和已上传的图片。 | Web 应用的响应速度不如桌面应用。你可能使用 Artisteer 编写一篇简单文章所需的时间会比使用\
    \ CMS 少一些。 |\n| 你可以完全控制内容和 CMS 功能。你可以为文章和菜单项设置适当的别名，为各种文章分配各种分类，设置分类名称、上传图片的位置等等。\
    \ |  |\n| 内容可以由一队人同时插入。 |  |\n\n从上述分析可以得出的结论是，如果你制作一个简单的网站，或需要非常快速地完成某些工作，你可以在\
    \ Artisteer 中准备内容然后导入到 CMS 系统。如果你要构建一个相当复杂的网站，并且已经决定使用哪个 CMS，直接在 CMS 中输入内容是更好的选择。你将完全控制自己的工作。\n\
    \n## 摘要\n\n在本章中，你学习了如何为 CMS 平台设计模板。我们讨论了由 CMS 驱动的网站与静态 HTML 网站之间的总体差异，并了解了 Artisteer\
    \ 的一些新功能。我们已成功在 Joomla! 和 WordPress——两个最受欢迎的 CMS 解决方案中导出并安装了模板。\n\n但我们与 Artisteer\
    \ 的冒险还未结束。通过对生成代码做少量修改，你可以实现“看似在 Artisteer 中无法完成”的事情。\n\n## 4 个技巧和窍门\n\n我们已经[content]\n\
