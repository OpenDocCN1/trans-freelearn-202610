    # 4


    # Tips and Tricks


    We have gone through most of the Artisteer features and you can by now design
    and use your own templates. The last thing to cover is some tips and tricks –
    techniques that will allow us to achieve effects, not available in Artisteer directly.
    They would require a little modification of the exported code, but don''t worry,
    the changes won''t be difficult, and I will always describe the changes. The examples
    here are the common questions that I have been asked by many Artisteer users.
    I''m sure you will have your own questions too. A good source of tips and tricks
    is the subscription of the Extensoft newsletter, in which some nice tips are published.
    Also a good source of knowledge is Artisteer''s official website www.artisteer.com
    and Szablonik (www.szablonik.net) – another website devoted to Artisteer. You
    may also look at my blog: http://artisteer.fajnyblog.eu, where I publish tips
    from time-to-time.


    # Image links in a slideshow


    This tip applies to HTML templates. An example project would be the `slidesAsLinks.artx`
    file.


    In this tip, I will show you how to modify the slideshow to make each slide (or
    some of them, it''s up to you) linked to other websites.


    When you create a slideshow, you can define particular images, but you can''t
    set any of the slides as links. The first idea is of course to click anywhere
    in the article and then navigate to Edit | HTML in the menu to show the source
    of the article containing the slideshow and do the proper modification without
    going out of the program. Let''s do it.


    +   1. In place of the slideshow, you will find something like the following:


    ```

    <div class="image-caption-wrapper" style="width: 55%;

    float: left">

    [collage_79]

    </div>

    ```'
  - "[PAGE 126]\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_126_0.png)\n\n# Downloading\
    \ the example code\n\nYou can download the example code files for all Packt books\
    \ you have purchased from your account at http://www.packtpub.com. If you purchased\
    \ this book elsewhere, you can visit http://www.packtpub.com/support and register\
    \ to have the files e-mailed directly to you.\n\n2. Oops! It looks like Artisteer\
    \ presents the slideshow not as source code, but as a special tag. The whole slideshow\
    \ is presented as [collage_79] (the number may differ, but the overall pattern\
