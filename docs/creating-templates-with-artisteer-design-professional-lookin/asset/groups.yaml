    ## About the Author


    **Jakub Sanecki** is an experienced web developer and programmer, with over 11
    years of experience. He was born in 1977 in Poland. In 2001, right before graduation
    (he graduated in company management) he founded Fregata — a company where he works
    until today, and took up his true passion, information technology. Starting with
    providing services related to a popular ERP system, the company evolved in the
    direction of programming services and custom software development. With the increasing
    popularity of the Internet, it concentrated on web applications'' and websites''
    development. Author of many web and desktop applications, Jakub works as an independent
    IT consultant and freelancer, realizing projects of various size and complexity,
    for companies of various sizes. He also provides training courses related to IT
    and web technologies and the techniques to use them in the company environment.
    For some years he worked as a university teacher, teaching web and desktop programming.


    Fregata is an authorized reseller of Extensoft. You can visit www.szablonik.net,
    as it provides support and additional information about this software tool.


    Privately, a husband and father of two children, Jakub lives with his family in
    Sosnowiec (in Poland), spending little moments of free time playing piano or reading
    books.


    ## Acknowledgement


    Almost every book starts with some words, in which the authors thank people who
    have supported him/her and allowed him/her to finish the writing of the book.
    Following this nice and proper tradition, I would also like to thank the people,
    without whom this book would not have come into existence. First of all, I would
    like to thank to my wife, Hania, who supported me all the time and forgave all
    my whims while I was writing, taking care of our home and our son, and forgiving
    me for spending less time with them.


    I would like to thank my parents who bought me my first computers and who always
    took care and trusted in me, even if my decisions seemed controversial to them.
    Without their acceptance and trust, I couldn''t have realized my passion and started
    to make a living by founding a small IT company.


    I would like to thank the rest of my family and my friends, for their patience
    and understanding while I was writing, as I didn''t find time to meet them.


    Last but not least, I would like to thank the people from Packt Publishing, who
    gave me a chance to write this book and did a great job, spending a lot of their
    time and work by correcting my initial drafts and providing valuable suggestions.
    Without their experience, knowledge, and commitment, I wouldn''t have been able
    to finish this project.


    ## About the Reviewer


    Mark Conroy is a web developer and public speaker based in Galway, Ireland. A
    former English teacher by profession, he began designing websites as a hobby for
    friends'' bands and local community groups. Since his humble beginning with Adobe
    Dreamweaver, he has graduated to working, almost exclusively, with Drupal, embracing
    open source technology whenever possible. As a speaker, he mostly presents on
    uses of digital media for effective campaigning. He has also presented at Drupal
    for Government days in Dublin on creating social networks using Drupal. Mark is
    a co-organizer of the monthly Galway Drupal Meetup.


    As a freelance developer working under the name A Design For Life—www.adesignforlife.net,
    Mark has worked on a number of large projects, not least of which was the redevelopment
    of the Ireland Reaching Out website (www.irelandxo.com) that he built single-handedly
    from the ground up, using a combination of Drupal Commons (and some extra contributed
    Drupal modules), Artisteer, CSS, and CiviCRM. All functionality on the site was
    completed using innovative approaches to pre-existing modules from drupal.org.
    He also built and continues to maintain the political campaigns and contacts website
    contact.ie, which has become the most popular online method for contacting politicians
    in Ireland.


    This is the first technical book Mark has worked on. He has, however, published
    a textbook for English students, *In Transition: An Anthology of Texts and Tasks
    for Transition Year Students*, is awaiting publication of a second English textbook,
    and is about to start work on his third.


    Mark is available for long and/or short-term freelance work, especially in the
    area of Drupal and campaign technologies. You can contact him at info@adesignforlife.net
    or info@contact.ie.


