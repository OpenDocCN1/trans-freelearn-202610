  - '[PAGE 95]


    Preparing a template for CMS is more difficult than preparing a template for a
    static website. Every CMS has its own rules for creating templates, and a template
    for CMS must contain not only HTML/CSS code, but also some code written in a programming
    language. Those pieces of additional code are necessary for CMS to know what kind
    of content should be connected with a particular area in the template.


    But don''t worry, we have good news, Artisteer can generate templates to various
    CMSs automatically! That''s why the question of what is better: CMS or Artisteer
    has one proper answer, that is, both. The most comfortable way of designing and
    managing a bigger website is to:


    +   - Use Artisteer for designing the template (and maybe fill it with initial
    content)

    +   - Export the template into CMS

    +   - Use CMS for managing the site


    # Static page template versus CMS template


    CMS template creation is a different process from creating templates for static
    websites, and requires consideration from a different point of view. Let''s try
    to describe in detail the differences between those two cases, and keep in mind
    some hints that can be useful.


    > Focus on the design. The content is out of scope.


    When designing a static site, you do it usually considering the concrete, or at
    least planned content. Think about what we did in the previous chapter. We started
    with the preparation of the scheme that showed the structure of the site. We knew
    all the subpages it will consist of and what content will be presented on every
    page. On this basis, we made the decision that the main menu will be a horizontal
    one, and that we will also have the complementary vertical menu. In the case of
    the CMS template, the situation looks quite different; often you will not even
    know what kind of content will be published. You can''t assume that the site administrator
    will use your template according to your assumptions. Nor can you prepare the
    template based on your own plans about the possible content. Such an approach
    would limit the site owner. That''s why, when creating a template for CMS system,
    you should focus on the design, not on the content.'
  - '[PAGE 96]


    To better illustrate what I mean by "approach focused on design, not on the content",
    let''s consider a concrete template element, that is, vertical menu. At the beginning
    of this chapter, I wrote that particular pages consist of fixed template elements,
    and the variable factor, content. The content differs from one page to another.
    This is true. But if we consider the nature of some fixed elements, we realize
    they are not absolutely fixed. The menu contains links for existing pages. If
    CMS lets us not only to edit existing pages, but also delete and add new ones,
    the menu must also be adjusted to the site''s changing structure. Every time a
    new page is added, a new menu item should appear (at the right place!), and when
    a page is deleted, the corresponding menu item should be deleted with it.


    Otherwise, it might happen that the page just added won''t have the corresponding
    item in the menu, so the visitor will not be able to browse to it. Or that menu
    will still contain the item of a page that has been deleted.


    In the case of a static website, you can design the menu as a whole. You know
    the exact number and titles of the items. You can adjust the size of buttons to
    item number and make the menu take exactly as much place on the screen as you
    want. In the case of designing a CMS template, you don''t know how many items
    the menu will contain. You can''t predict the size of the menu, because after
    a new page is added, a new button in the menu will appear making your vertical
    menu higher. The only solution is to think about the vertical menu as an overall
    area, filled with items (menu buttons). You can, and you should design the look
    of the particular menu item, the border of the whole menu, the font of the menu
    header, but it will still be an overall template and not a concrete menu. You
    have to accept the fact that you don''t have all the information, and you have
    to do your job despite this. This is what I mean by writing that you should focus
    on the design, not on the content.


    > Template elements lead to completeness of the project.


    Because you don''t know the content that will be published using your template,
    you can''t limit your job only to designing elements that you know will appear.
    Your template must be complete and should enable the user to enter every possible
    kind of content. Your template should provide a uniform look for the entire site.
    You can''t omit some elements, because you don''t know if they will be used or
    not.


    For example, while designing the static template in Chapter 2, The Template Step-by-Step,
    we had omitted the third level of headers. We knew the content and that such elements
    won''t be used; so, there wasn''t a need to design them. But while designing a
    CMS template, you can''t do that. You should design all possible elements that
    can occur.'
  - '[PAGE 97]


    In particular, remember to design:


    +   - Complete typography (headers on all six levels, links in all states, normal
    text font, quotation, and so on)

    +   - The look of the tables (table header font, table content font, and border)

    +   - Form controls (buttons, radio buttons, and checkboxes)

    +   - Border and margins of images

    +   - Bullets

    +   - Horizontal and vertical menus (you don''t know if the user wants to use
    one of them or both)


    Also, you can''t omit the special blocks, which are supported by particular CMSs.
    The most commonly used special blocks are login form and search field. Although
    the basic approach of all CMS solutions is similar (like online content editing),
    particular systems differ from each other. Each system has its own specific and
    typical uses. To design a good template, you have to know the features and properties
    of the CMS you design for. Artisteer lets you insert the most common blocks with
    the use of **Widgets** list (it''s located on the **Layout** tab on the ribbon).
    It''s not a bad idea to check this list to assure yourself that you didn''t forget
    something important.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_97_0.png)


    If your target CMS uses one of these blocks, you should account it in your project


    > The knowledge of possibilities and properties of concrete CMS is a basic requirement
    that allows you to produce a good template for it.'
  - '[PAGE 98]


    # CMS Templates


    Most modern CMS solutions have a modular design. It means that the core functionality
    can be expanded by installing extensions. There are thousands of various extensions
    in the market, dedicated to various popular CMSs. They are provided by third-party
    companies and offer very diverse functionality. Of course, you can''t know which
    plugins the user will use, and your template doesn''t have to support them all.
    The minimum requirement is to design a template that supports all core functionality
    of a particular CMS.


    In most cases, it''s a good idea to choose a three-column layout. To understand
    why, we will have to go back to the explanation of the way a CMS works. We know
    that the content is inserted into a page before displayed. We also know that some
    elements (that is, the menus) have dynamic nature, and their look depends on the
    site''s structure, or other system settings. The next feature is that the site
    administrator can decide if some of the available elements should be displayed
    at all. The administrator can, for example, decide that the horizontal menu should
    be displayed on all the pages, while the vertical menu should be displayed only
    on some of them (as a supplementary menu), and the search field only on the Home
    page. From one perspective, it gives the huge freedom of managing site, but from
    another one, it shows how complicated is the problem.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_98_0.png)


    Having columns on both sides gives big freedom when placing elements'
  - '[PAGE 99]


    Based on the previous information, we can assume that the process of displaying
    the page through CMS system looks something like this:


    +   1. Get the settings of the page that is going to be displayed.

    +   2. Check which elements should be displayed and which not.

    +   3. Display all the static fixed elements of the template, positioning them
    into right places.

    +   4. Render dynamic elements of the template, positioning them into right places.

    +   5. Get the proper content, and display it in the content area.


    Because dimensions of dynamic elements can change, it is not possible to define
    their location. You cannot, for example, predict the login field that should be
    displayed under the vertical menu to be 400 pixels below the top of the page,
    because we don''t know how high the vertical menu will be. The only information
    we really have is that it should be displayed on the left, under the vertical
    menu. To solve this problem, CMS templates are based on something we will call
    Areas.


    Area is a place in the template, in which you can display a particular element.
    In Area, you can display various kind of elements, or the Area can be also left
    empty. A special kind of Area is the Content Area. Content is an element than
    can occur only once on every page.


    Does it mean that other elements can occur several times on the same page, for
    example two vertical menus, one under another, looking the same? Yes. Even though
    it would be illogical, it is technically possible.


    Areas are always rectangular in shape and they divide a template into rows and
    columns, so any template can be considered as a grid. The number of cells of this
    grid (number of areas in template) varies for particular templates.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_99_0.png)


    > A template for a CMS is a combination of available areas and look definitions
    of elements.


    When you write code for your template from the scratch, by hand, you decide about
    the number and placing of areas. When using Artisteer, you must accept the grid
    generated by the application.


    Artisteer, for CMS systems generates a three-column layout, with Areas in the
    left and the right column. While designing with Artisteer, you should respect
    this rule and also base your project on a three-column layout.'
