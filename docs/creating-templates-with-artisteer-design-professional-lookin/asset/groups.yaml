    >Joomla!</a>\n    </li>\n    <li>\n    <a href=\"offer/dotnetnuke.html\">DotNetNuke</a>\n\
    \    </li>\n</ul>\n</li>\n</ul>\n```\n\n10. Let's open the offer.html file and\
    \ change this into a one-level list containing only our subpages. We don't need\
