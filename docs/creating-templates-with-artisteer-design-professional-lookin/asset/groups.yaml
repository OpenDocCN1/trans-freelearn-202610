    ## The Template Step-by-Step


    In the previous chapter, we discussed some overall features of Artisteer. So far,
    you have learned what the software is for and have acquired a little experience
    with its interface and work style.


    Now we are going to prepare a template together. I will lead you through all the
    steps, from the beginning to the end. At the end of this chapter, you will have
    a complete template that you can directly implement for your website or modify
    to fulfill your needs. This will be a template for a static web page.


    ## Templates


    Before we can begin with creating a template, we have to define what exactly is
    a template.


    A **template** is a set of common elements of the website. And you may then ask,
    what is a website? A **website** is a set of logically connected web pages, concerning
    one particular subject. When we talk about a company website, the subject will
    be the company. In case of a private website, the subject will be the person who
    the website is about, and so on.


