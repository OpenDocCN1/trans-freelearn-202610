    \ MySpecialModule\">\n    <h3>Second Block</h3>\n    <!-- begin nostyle content\
    \ -->\n        <div class=\"customart-nostyle MySpecialModule\">\n        <!--\n\
    content of our block:\n<p> elements, image and list\n        -->\n        </div>\n\
    \    <!-- end nostyle content -->\n</div>\n<!-- end nostyle -->\n```\n\nThis time\
    \ our task is easier because Artisteer inserts comments informing us about the\
    \ beginning and the end of the unstyled fragment of the page. The whole block\
    \ resides in a DIV element, which belongs to two classes, namely, `art-nostyle`\
    \ and `MySpecialModule` (`class=\"art-nostyle MySpecialModule\"`), according to\
    \ what we have typed as a suffix in Joomla!. The header of the block is just an\
    \ h3 element, without any class. The content of our block is in another DIV element,\
    \ which also belongs to the classes `custom art-nostyle` and `MySpecialModule`\
    \ (`class=\"custom art-nostyle MySpecialModule\"`). We would like to compose styles\
    \ that will make our **Second Block** look similar to our previous example.\n\n\
    - 4. So, let's open the `template.css` file and add a definition to our classes.\
    \ Because we have decided not to expand the existing style for block elements\
    \ (the `art-block` class) but to design everything on our own, we must define\
    \ more properties than the previous time:\n\n```\n/*** My Classes ***/\n/* Main\
    \ container of our block */\n.MySpecialModule\n{\n    /* rounded corners of main\
    \ container */\n    -webkit-border-radius: 6px 6px 0 0;\n    -moz-border-radius:\
    \ 6px 6px 0 0;\n    border-radius: 6px 6px 0 0;\n    /* margins, border and background\
    \ color */\n    margin: 7px;\n    border: 1pt solid red;\n    background-color:\
    \ #FFFF99;\n}\n\n/* Block header */\n.MySpecialModule h3\n{\n    padding: 12px\
    \ 3px;\n    color: green;\n    font-size: 20px;\n    font-family: Moul, Arial,\
    \ 'Arial Unicode MS', Helvetica, Sans-Serif;\n    font-weight: normal;\n    margin:\
    \ 0 5px;\n}\n\n/* Paragraph in block content */\n.MySpecialModule p\n{\n    font-family:\
    \ \"Tahoma\";\n    font-size: 10pt;\n    font-style: italic;\n    line-height:\
    \ 180%;\n}\n\n/* Image border */\n.MySpecialModule img\n{\n    border: 1px solid\
    \ #000000;\n}\n\n/* List inside block content */\n.MySpecialModule ul\n{\n   \
    \ margin-left: 10px;\n}\n```\n\n```\n.MySpecialModule ul li\n{\n  list-style-image:\
    \ url('./images/blockbullets.png');\n  margin: 10px 15px;\n}\n```\n\n- 5. Save\
    \ the changes, refresh the site, and the following screenshot will appear:\n\n\
    ![](img/7f889df2ffdb68108cff34d798a2b9a3_144_0.png)\n\nCurrent state of our changes\n\
    \n- 6. Everything seems to be quite OK, but we don't want to have the border around\
