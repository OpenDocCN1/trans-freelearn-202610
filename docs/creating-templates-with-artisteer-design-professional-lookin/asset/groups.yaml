    Activation** window, where you should enter your license key into the **License
    Key.** field", as shown in the following screenshot:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_23_0.png)


    Activation window


    After you have entered your license key, click on the **Activate** button. After
    a few seconds, your copy of Artisteer will be fully activated.


    # Creating a new project


    After you start the program, the first screen you will see is a window titled
    **New Project**. Here you can decide whether you want to open a previously saved
    project, or start a new one. The main part of this window consists of three rows.
    In the first row you can filter among the available, pre-made templates (if you
    want to start by modifying one of them). The pre-made templates are presented
    in the third row, according to which category and sorting rule you choose.


    The second row always contains only one icon. Click on it when you want to start
    with a **Blank** template and style everything from scratch.'
  - '[PAGE 24]


    # Meet the Artisteer


    In the column to the right-hand side of the window, there is a list of recently
    opened projects, as in the following screenshot:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_24_0.png)


