- raw:
  - '[PAGE 50]


    The way we have changed the text inside our new block is the standard way for
    editing content in Artisteer. Up to Version 2.6 of the program, content editing
    was impossible. Starting from Version 3.0, you can freely edit the content on
    all pages of the project. Starting from Version 4.0, this is possible not only
    in HTML templates, but also when designing for CMS. The content can be exported
    along with the design and imported into the CMS.


    Note that while you write the content, the ribbon automatically switches to the
    Edit tab, where you can find typical editorial functions. Here you can, for example,
    set the font, alignment, and insert pictures or tables. The symbols used to designate
    the various options are similar to those you find in any popular word processor
    – if you have experience with MS Word, this will be very intuitive.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_50_0.png)


    # Colors


    The default Blank project is in white. Before we start designing the various elements
    of our template, we are going to change the color theme, by choosing one of the
    available themes in blue. To do this, follow these steps:


    +   1. Choose the Colors & Fonts tab on the ribbon.

    +   2. Click on the Color Themes button.

    +   3. Find the Sky Blue group on the list, and choose the Depth theme.


    > > Perhaps you have already noticed that Artisteer dynamically shows you the
    results of the changes not only after you choose an option (that is, the color
    theme), but also while you move the mouse pointer over the various options.


    # Background


    After we have chosen the color scheme, it''s time to set up the background of
    our site. Choose the Background tab on the ribbon to see the available options.'
  - '[PAGE 51]


    At the beginning, we must decide whether our background should be a solid color,
    gradient, a texture, or maybe a picture. Some of these options are mutually exclusive,
    while some can coexist. The relationships between them are shown in the following
    diagram:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_51_0.png)


    If you set up a color for your background, it doesn''t exclude the use of a gradient.
    But the simultaneous use of a texture and picture is impossible. If you want your
    background to be a solid color or a gradient, you have to choose No Texture in
    the Picture or Image list. Otherwise, the chosen picture or texture will override
    the chosen color.


    The last group of tools include Light Effect, which adds to your background a
    delicate effect that resembles a light glow. The options from the Light Effect
    group relate to both the colors and gradients, and the textures and pictures.


    For our project, we are going to set up a color background with a gradient. Click
    on the Fill Color button, and from the Theme Colors list, choose the third color
    from the left in the second row. Then click on the Gradient button and in the
    Light to Dark group choose the first option from the left, in the second row:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_51_1.png)'
  - '[PAGE 52]


    For the light effect, choose the first option in the Classic group.


    # Pages


    We should now add the pages to our project according to the schema. We have to
    delete the pages that Artisteer has inserted by default and replace them with
    our set of pages, maintaining the relationship among them. You can manage the
    pages with the help of the side panel on the left side.


    # Adding, removing, and renaming the pages


    In the first step we will remove the redundant pages. If you look at the Pages
    panel, you will see that the first page contains two subpages. But in our project
    (look at the schema again), the first page does not contain any subpages. We are
    going to remove these subpages, since we don''t need them. Follow these steps:


    +   1. Click on the small triangle symbol on the left of Page 1 to expand its
    subpages (another way to do it is to just double-click on the page name).

    +   2. Right-click on Page 3 and from the context menu choose Delete (you can
    also select the page with a single left mouse click and pressing Delete on the
    keyboard).

    +   3. Repeat this procedure for all subpages of Page 1 to remove them.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_52_0.png)


    > A single mouse click selects a page, but in case the clicked page was already
    selected, a single mouse click is used to rename it.


    Now we are going to add the missing pages. Our project assumes four pages on the
    top level, so we need to add two more pages:


    +   1. Right-click on Page 2 and from the context menu choose New Page. Artisteer
    will add a new page and name it as Page 3. The name of this page will be highlighted
    to enable you to rename it.

    +   2. Type Offer and press Enter.

    +      Similarly, add the Contact page and rename the first two pages by choosing
    from the Rename context menu. You should have following pages: Home, About Me,
    Offer, and Contact.

    +   3. Right-click on the Offer page and from the context menu choose New Child
    Page. Name the new subpage as Websites. Analogically add the other missing subpages.'
  - '[PAGE 53]


    # Page properties


    OK, our project now contains all the pages we wanted. You can observe that all
    the pages are displayed as items in both our menus (the horizontal menu expands
    by hovering, while the vertical menu expands on clicking, by default). We have
    renamed the pages, but the names we have given them are not the names of the files
    that will be generated during the export process, but only the names that appear
    in the menu.


    > The name of the page that you see in the **Pages** panel is the name shown in
    the menu. It is neither the name of the file that will be generated, nor the page
    title that will be shown in the browser. These parameters have to be defined in
    the **Properties** window. In this window, we can also define the menu in which
    the page should be displayed.


    Let''s define the properties for the **Home** page:


    +   1. In the **Pages** panel, right-click on the **Home** page, and from the
    context menu choose **Properties**. It will display the **Properties** window.

    +   2. Make sure that the **General** tab (from the list on the left side of the
    window) is active.

    +   3. In the **Name/URL** field, type: `index`.

    +   4. In the **Title** field, type: `Welcome to my page`.

    +   5. Click on the **OK** button to close the window.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_53_0.png)


    The **Name/URL** field defines the name of the file that will be generated during
    the export process, and this name appears in the browser''s address bar. Because
    it''s a filename it cannot contain characters that are forbidden in filenames
    (for example, "?"). Also, it cannot contain any spaces. If the desired name consists
    of two or more words, you can use the "-" character instead of a space (for example,
    for our **About Me** page, a good name would be: `about-me`). Remember that Linux
    is case-sensitive (in most cases, the server where you have your hosting account
    is powered by Linux), so to avoid any trouble, a good practice is to use only
    lowercase letters.'
  - '[PAGE 54]


    The Title field contains the title of the page that is displayed in the browser''s
    window (and in the browser''s tab). In this field, you can use any character you
    want. This title is also displayed by the search engines, such as Google, Bing,
    and Yahoo!. As you can see, it''s an important property.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_54_0.png)


    > For most web servers, the default file that is displayed when no specific file
    is specified is index.html or index.htm. That''s why you should insert index in
    the Name/URL field for the main page of your website. Artisteer will generate
    this page as the index.html file. Thanks to this, your home page will be displayed
    by default when the visitor puts only your domain name into the browser''s address
    bar (without specifying the concrete page).


    Similarly, define these parameters for the rest of the pages in our project.


    # Header


    Now that we have designed the overall layout, page width, and background, and
    added pages, it is time to design the various elements of our template. We are
    going to start with the header. First of all, we want it (the header) to be a
    little higher. Click on the Header tab on the ribbon and look for the Height button.
    Click on it and from the list of available options choose 150px. The header will
    adopt the new size.


    Next, we will define the header''s background. Just like the background of the
    page, the header''s background can be a solid color, a gradient, a texture, or
    a picture. Expand the Background Image list, and from the Abstract group choose
    the first option from the left in the second row.


    # Title and slogan


    In Artisteer, the template''s header contains two standard texts: Title and Slogan.


    Title is just the title of your website presented in the header (do not confuse
    this text with the title you defined in the Page Properties window). Slogan is
    the second standard text in the header and usually contains a motto.'
