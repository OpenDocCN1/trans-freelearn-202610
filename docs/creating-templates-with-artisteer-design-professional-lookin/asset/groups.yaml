    can compare it with cars: all cars have much in common. Cars have four wheels,
    a room for the driver and the passengers, an engine, a trunk, and so on. But do
    they all look the same? Certainly not. And now think of the different models of
    Porsche. Do they look similar enough to let everybody know it is a Porsche? I
