    > If you preview this site in a browser, you will see that the Lightbox effect
    not only displays the larger image, but also the navigation buttons to the next
    and the previous images. This way we have created a gallery.


    In the end, our site should look like this:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_79_0.png)


    ## Inserting a slideshow


    Besides inserting images and image galleries (with the Lightbox effect), Artisteer
    also offers the possibility of creating slideshows. A slideshow is a set of images,
    displayed one by one, at the same place. The slides that are shown change according
    to one of the predefined transition effects. You can create a slideshow in the
    content area and in the header.


    ## Slideshow in the content area


    We start preparing a slideshow by inserting a single image. This image will be
    the first slide to show, and it sets the dimensions of the overall slideshow.
    Every slide has the same size, so it''s good practice to prepare the set of images
    and resize them accordingly before you start preparing the slideshow. You can
    insert several images into one slide, making a collage, or even combine pictures
    with shapes.


    After you have inserted an image, click on it once with a left mouse click. The
    ribbon will show the Edit tab, and the New Slide button in the Slideshow group
    will be enabled. Click to insert a new slide from one of the available sources:
    you can insert a blank slide, duplicate the current slide, add an image from a
    file, add an image from Artisteer''s library, or add an image from Flickr:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_80_0.png)


    If you decide to insert a new slide from a file, you will also have the possibility
    to resize the image. The available options are:


    - **Resize collage to image**: This option resizes the whole slideshow according
    to the dimensions of the new picture. Works only for those images that are smaller
    than the slideshow.

    - **Resize image to collage**: This option adjusts the size of the inserted picture
    to fit the actual slideshow dimensions.

    - **Use original size**: This option doesn''t change the size of the inserted
    image. If the image is larger than the slideshow, only a part of the image will
    be displayed. If the image is smaller than the slideshow, it will be surrounded
    with a background.


    You can also insert new images and shapes into an existing slide. To do that,
    use the **Add Image** or **Add Shape** buttons, which are located on the right
    side of the **New Slide** button that we used to insert a new slide. They work
    in a very similar fashion, but instead of inserting a new image (or shape) as
    a new slide, they just add it into the current one. You can create interesting
    effects by combining several images and shapes in one slide.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_81_0.png)


    Two images and a shape combined into one slide


    The **Background** button lets you choose a background for the slide. The background
    will be visible if the displayed picture (or pictures) is smaller than the dimensions
    of the slide. You can set up a different background for each slide.


    The last three buttons in the **Slideshow** group are: **Play**, **Motion**, and
    **Navigator**.


    - The **Play** button starts the slideshow and lets you see how it will look on
    the live site.

    - The **Motion** button lets you choose one of the available transition effects.
    By default, the slides change with a fade effect. You can also set up the speed
    of the transition effect, the delay (for how long each slide is displayed), and
    whether the slideshow will be repeated or not.

    - The **Navigator** button lets you design the navigator. A navigator is a group
    of pointers displayed in the bottom-right corner of the slideshow by default.
    It indicates which slide is currently displayed and lets you click and go to another
    one:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_81_1.png)


    ## Slideshow in header


    Creating a slideshow in the header is very similar to the process of placing a
    slideshow in the content. The difference is that you can have only one slideshow,
    and every slide covers the whole header. In fact, it''s not a *slideshow in the
    header*, but rather *a slideshow of headers*.


    In the **Header** pane on the ribbon, you will find the **Slide Show** group with
    buttons analogous to those we saw before in the **Edit** pane.


    To create a slideshow, design your header as usual. Set up the background and
    insert images and shapes. This header will be the first slide. When everything
    is ready, click on the **New Slide** button and choose the image. A new slide
    (new header) will be inserted, and the chosen image will become its background.
    Design the header once again, and this will be the second slide, and so on.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_82_0.png)


    > Think of every slide as a separate header, with its own background, images,
    and shapes. The only elements that are common to all slides are the headline,
    slogan, and a search field.


    ## Typography


    We have talked a little about typography. You know that you can use the styles
    instead of changing fonts for every header, and that the typography contains definitions
    for links, button text, and so on.


    Now we will take a closer look into this template''s parameters.


    The typography tools are located on the **Colors & Fonts** tab on the ribbon.
    Click on it. As the name suggests, this tab contains the tools for typography
    and for working with template colors. The typography tools are placed on the **Fonts**
    group (beside **Suggestion Tool**). On this group you can find three buttons:
    **Font Sets**, **Typography**, and **Font Scale**.


    The **Font Sets** button lets you choose the set of fonts to be used in your project.
    Every set consists of two fonts: the first font is the one that is used for headers,
    and the second is the font used for paragraph text. When you click on this button,
    you will see the list with the available font sets. Every list item displays the
    name of the font set, and also the names of the fonts used. The names of the fonts
    used are displayed with those fonts, giving you a preview of how they look.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_83_0.png)


    At the bottom of this list there''s a button called **Edit Font Set**. Clicking
    on this button displays the **Edit Font Set** window, in which you can change
    the fonts used in the active state.


    Let''s pretend that we want the heading to be written in Arial, and the paragraphs
    in Times New Roman. We have to:


    1. Display the **Edit Font Set** window.

    2. Choose **Arial** in the **Heading Font** field.

    3. Choose **Tahoma** in the **Text Font** field.

    4. Click on the **OK** button to close the window.


    Artisteer has changed the font, and if we click on the **Font Sets** button again,
    we will see that our set is now displayed in the **Custom** group as **Unsaved**.
    Indeed, this is our custom set, and we haven''t saved it yet. Click on the **Save
    Font Set** button at the bottom (now that it''s active) and save the file with
    the name `My favorite fonts`. Our new set will be displayed in the **Custom**
    group.


    > The font we have saved is not stored with only our template, it''s stored in
    Artisteer on the application level. You can restart the program, open any other
    layout, or start creating a new one, and you will see that our **My favorite fonts**
    font set is available. This way the sets that you prepare can be reused in your
    future projects.


    But typography is far more complex than the definition of font for headers and
    paragraphs. We have six levels of header, so it is obvious that there should be
    a possibility to define more properties. To edit the advanced features of typography,
    click on the **Typography** button. The list that will expand contains the available
    typographies. The active one is probably **Unsaved** on the **Custom** group.


    Click on the **Edit Typography...** button at the bottom of the list to show the
    **Typography** window. In this window you can see all the text elements of the
    template. Below the list there''s a **Modify** button, a **Preview** field where
    you can see how the selected element looks, and the element''s CSS definition:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_84_0.png)


    We will do the following modifications to our typography:


    - We will modify the **Heading 6** element

    - We will change the style of our text "Look at my latest projects..." from **Heading
    2** to **Heading 6**. As a result, the look of our text should change.


    To make these changes, do the following:


    1. Click on the **Heading 6** element on the list to select it.

    2. Click on the **Modify** button. A new window will appear.

    3. In the **Font** tab of this window, set the font name as **Aguafina Script**,
    choose **Bold** as font style, and choose **28** as **Font Size**.

    '
  mdcn: '

    > 如果你在浏览器中预览此网站，你会看到 Lightbox 效果不仅显示更大的图片，还显示下一张和上一张图片的导航按钮。这样我们就创建了一个画廊。


    最后，我们的网站应该看起来像这样：


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_79_0.png)


    ## 插入幻灯片


    除了插入图片和图片画廊（带 Lightbox 效果）之外，Artisteer 还提供创建幻灯片的可能性。幻灯片是一组图片，按顺序一张一张地在同一位置显示。显示的幻灯片会根据预定义的其中一种转场效果而变化。你可以在内容区域和页眉中创建幻灯片。


    ## 内容区域中的幻灯片


    我们通过插入一张图片开始准备幻灯片。这张图片将是首先显示的幻灯片，并且它决定了整个幻灯片的尺寸。每张幻灯片大小相同，因此在开始准备幻灯片之前，先准备好图片集并相应调整大小是良好的做法。你可以在一张幻灯片中插入多张图片，制作拼贴，甚至将图片与形状结合。


    在插入图片后，用鼠标左键单击一次。功能区将显示编辑选项卡，并且幻灯片组中的新建幻灯片按钮将被启用。点击以从可用来源之一插入新幻灯片：你可以插入空白幻灯片，复制当前幻灯片，从文件添加图片，从
    Artisteer 库添加图片，或从 Flickr 添加图片：


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_80_0.png)


    如果决定从文件插入新幻灯片，你还将有调整图片大小的可能性。可用的选项有：


    - **调整拼贴以适应图片**：此选项根据新图片的尺寸调整整个幻灯片的大小。仅适用于小于幻灯片的图片。

    - **调整图片以适应拼贴**：此选项调整插入图片的大小以适应实际幻灯片尺寸。

    - **使用原始大小**：此选项不改变插入图片的大小。如果图片大于幻灯片，则只会显示图片的一部分。如果图片小于幻灯片，则会用背景环绕。


    你也可以向现有幻灯片中插入新的图片和形状。为此，使用位于我们用于插入新幻灯片的新建幻灯片按钮右侧的**添加图片**或**添加形状**按钮。它们的工作方式非常相似，但不是将新的图片（或形状）作为新幻灯片插入，而是将其添加到当前幻灯片中。你可以通过在一张幻灯片中组合多张图片和形状来创建有趣的效果。


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_81_0.png)


    两张图片和一个形状组合成一张幻灯片


    **背景**按钮让你为幻灯片选择背景。如果显示的图片（或图片）小于幻灯片的尺寸，背景将可见。你可以为每张幻灯片设置不同的背景。


    **幻灯片**组中的最后三个按钮是：**播放**、**运动**和**导航器**。


    - **播放**按钮启动幻灯片并让你看到它在实际网站上的效果。

    - **运动**按钮让你选择其中一种可用的转场效果。默认情况下，幻灯片以淡入淡出效果切换。你还可以设置转场效果的速度、延迟（每张幻灯片显示的时间）以及幻灯片是否重复。

    - **导航器**按钮让你设计导航器。导航器默认显示在幻灯片右下角的一组指针。它指示当前显示的是哪张幻灯片，并允许你点击前往另一张：


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_81_1.png)


    ## 页眉中的幻灯片


    在页眉中创建幻灯片与在内容中放置幻灯片的过程非常相似。不同之处在于你只能有一个幻灯片，并且每张幻灯片都覆盖整个页眉。事实上，它并不是*页眉中的幻灯片*，而是*页眉的幻灯片*。


    在功能区的**页眉**面板中，你会找到**幻灯片放映**组，其中包含与我们在**编辑**面板中看到的类似的按钮。


    要创建幻灯片，请像往常一样设计你的页眉。设置背景并插入图片和形状。此页眉将是第一张幻灯片。当一切准备就绪后，点击**新建幻灯片**按钮并选择图片。将插入一张新幻灯片（新页眉），所选图片将成为其背景。再次设计页眉，这将是第二张幻灯片，以此类推。


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_82_0.png)


    > 将每张幻灯片视为一个独立的页眉，具有自己的背景、图片和形状。唯一对所有幻灯片都通用的元素是标题、标语和搜索字段。


    ## 排版


    我们已经稍微谈过排版。你知道可以使用样式而不是为每个标题更改字体，并且排版包含链接、按钮文本等的定义。


    现在我们将更仔细地查看此模板的参数。


    排版工具位于功能区的**颜色和字体**选项卡上。点击它。如名称所示，此选项卡包含排版工具和模板颜色操作工具。排版工具放置在**字体**组中（在**建议工具**旁边）。在此组中你可以找到三个按钮：**字体集**、**排版**和**字体比例**。


    **字体集**按钮让你选择项目中使用的字体集。每个集合包含两种字体：第一种字体用于标题，第二种字体用于段落文本。点击此按钮后，你将看到可用字体集的列表。每个列表项都显示字体集的名称，以及所用字体的名称。所用字体的名称以这些字体显示，让你预览它们的外观。


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_83_0.png)


    在此列表底部有一个名为**编辑字体集**的按钮。点击此按钮会显示**编辑字体集**窗口，在其中你可以更改活动状态下使用的字体。


    假设我们希望标题使用 Arial 字体，段落使用 Times New Roman 字体。我们需要：


    1. 显示**编辑字体集**窗口。

    2. 在**标题字体**字段中选择**Arial**。

    3. 在**文本字体**字段中选择**Tahoma**。

    4. 点击**确定**按钮关闭窗口。


    Artisteer 已更改字体，如果再次点击**字体集**按钮，你会看到我们的集合现在在**自定义**组中显示为**未保存**。确实，这是我们的自定义集合，我们尚未保存它。点击底部（现在已激活）的**保存字体集**按钮并将文件保存为名称
    `My favorite fonts`。我们的新集合将显示在**自定义**组中。


    > 我们保存的字体并非仅存储在模板中，而是存储在 Artisteer 的应用程序级别。你可以重新启动程序，打开其他布局，或开始创建新布局，你会看到我们的**My
    favorite fonts**字体集可用。这样，你准备的集合可以在未来的项目中重复使用。


    但排版远比标题和段落的字体定义复杂。我们有六个标题级别，因此显然应该有定义更多属性的可能性。要编辑排版的高级功能，请点击**排版**按钮。展开的列表包含可用的排版。活动的一个可能是在**自定义**组中的**未保存**。


    点击列表底部的**编辑排版...**按钮以显示**排版**窗口。在此窗口中你可以查看模板的所有文本元素。列表下方有一个**修改**按钮、一个**预览**字段，可在其中查看所选元素的外观，以及元素的
    CSS 定义：


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_84_0.png)


    我们将对排版进行以下修改：


    - 我们将修改**标题 6**元素

    - 我们将把文本“Look at my latest projects...”的样式从**标题 2**改为**标题 6**。结果，我们的文本外观应发生变化。


    要进行这些更改，请执行以下操作：


    1. 在列表中点击**标题 6**元素以选择它。

    2. 点击**修改**按钮。将会出现一个新窗口。

    3. 在此窗口的**字体**选项卡中，将字体名称设置为**Aguafina Script**，将字体样式选择为**粗体**，并将**字体大小**选择为**28**。

    '
