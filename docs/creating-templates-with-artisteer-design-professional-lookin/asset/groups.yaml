    >DotNetNuke</a>\n    </li>\n</ul>\n</ul>\n```\n\n11. 因为菜单中不再有任何父项目，所以在代码中保留两个嵌套列表（<ul>\
    \ 标签）没有意义。让我们删除内部列表。现在得到以下代码：\n\n```\n<ul class=\"art-vmenu\">\n    <li>\n   \
    \     <a href=\"offer/websites.html\">Websites</a>\n    </li>\n    <li>\n    \
    \    <a href=\"offer/websites.html\">Websites</a>\n    </li>\n    <li>\n     \
