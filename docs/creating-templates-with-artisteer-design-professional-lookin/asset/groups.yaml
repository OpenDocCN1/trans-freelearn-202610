    ![](img/7f889df2ffdb68108cff34d798a2b9a3_106_1.png)'
  - '[PAGE 107]


    The exported footer’s cells that are available module positions in Joomla! are
    as follows:


    | position-32[artstyle outline] | n-32 | position-33[artstyle outline] | n-33
    | position-34[artstyle outline] | n-34 |

    |---|---|---|---|---|---|

    | position-35[artstyle outline] | n-35 | position-36[artstyle outline] | n-36
    | position-37[artstyle outline] | n-37 |

    | position-38[artstyle outline] | n-38 | position-39[artstyle outline] | n-39
    | position-40[artstyle outline] | n-40 |

    | position-41[artstyle outline] |  | position-41 |  |  |  |


    This feature, introduced in Artisteer 4.1, shows all the possibilities when you
    stop to think about the footer as a place not only for inserting copyrights, but
    when you treat this area as "everything below the main content". There are kinds
    of websites (especially multimedia portals), in which the layout is a custom grid
    of different modules/widgets. You can achieve such a template with Artisteer by
    designing any grid of positions. Remember that the dimensions of template areas
    adapt to the content they display, and the dimensions of empty areas are zero.
    According to your needs, you may decide to use one, several, or all areas you
    have created. You can even decide not to display any article at all, hiding the
    main Content Area and using only this grid for displaying modules/widgets.


    # Joomla! templates


    Joomla! is a very popular CMS, written in PHP language. To be able to use it,
    you will need a hosting account that supports PHP and access to one database on
    MySQL database server. Joomla! is a free, open source software, licensed under
    the terms of GPL 2, which simply means that you can use it free of charge for
    commercial purposes too (you can find text of this license at http://www.gnu.org/licenses/gpl-2.0.html).
    You can download the newest version of Joomla! installer from www.joomla.org.
    While I’m writing this book, the newest, long-term, stable version is 2.5.9, and
    this is the version we are going to work with in this chapter.'
  md: '

    Does it mean, that every website based on an Artisteer-generated theme has to
    have a three-column layout? No. The dimensions of Areas are dynamic – an Area
    adopts its size to the elements that it contains. The empty Area although exists,
    but its vertical and horizontal size is zero. From the site administrator''s point
    of view, this is a very good solution, because he has the possibility to display
    any element in the side column if he wants, but if he doesn''t, this column will
    remain invisible for the visitor.


    Designing three-column layouts don''t force the user to use all three columns.
    You give him only the possibility to do this. He still has a free choice to use
    only one or two of the available columns.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_100_0.png)


    > By designing a three-column layout, you give the site administrator the possibility
    to insert and display any element in side columns. But if he decides not to use
    these columns at all, they won''t even be visible (its width will be zero).


    ## Specific CMS template elements


    There are some elements that are specific for CMS templates. Not every CMS system
    supports all of them. Also, site administrators can decide not to use them, even
    if they are supported. Nevertheless, if you design a platform that supports these
    elements, you should include them in your project.


    ## Post header icons


    Post header icons are displayed next to the post header. Artisteer supports the
    **Author**, **Date**, **Edit**, **Email**, **PDF**, and **Print** icons. The last
    position on the list (**Date**) contains its own subelements.


    We will choose the **Print** icon as an example, but the procedure is the same
    for each icon. To set the **Print** icon, do the following:


    - 1. Select a blog page on the **Pages** panel on the left. If you don''t have
    any, create one. Also, create at least one post to be able to observe the inserted
    icon.

    - 2. In the **Content** tab on the ribbon, navigate to **Post Header** | **Icons**
    | **Print**. Enable the **Show Print** option. This enables our template to support
    this icon. After enabling this option, additional options will appear with the
    collection of available icons. Choose the icon you prefer.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_101_0.png)


    Setting Print icon


    ## Post footer icons


    Post footer icons are displayed under the post. Artisteer supports three kinds
    of these icons, namely Category, Comments, and Tags. The procedure is analogous
    to inserting post header icons, but instead of the Post header button, we use
    Post footer.


    We will style Icons for Comments:


    - 1. Select a blog page on the Pages panel on the left. If you don''t have any,
    create one. Also, create at least one post to be able to observe the inserted
    icon.

    - 2. In the Content tab on the ribbon, navigate to Post Footer | Icons | Comments.
    Enable the Show Comments option. This makes our template to support this icon.
    After enabling this option, additional options will appear with the collection
    of available icons.

    - 3. Choose the icon you prefer.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_102_0.png)


    Setting Comments icon


    Actually, you don''t need a blog page to set up the post icons, but working with
    a blog page (with at least one post) has the advantage that you immediately see
    all changes.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_102_1.png)


    Example post in Artisteer, with all icons enabled


    ## Advanced techniques


    In this section, we will go through the more advanced functionality in Artisteer
    that enables you to extend the number of template positions generated by default.
    But before we start, we will learn how to display the available positions and
    their names in Joomla!. You will need this information to use additional positions
    efficiently.


    ## Displaying positions in a Joomla! template


    To check the position of a Joomla! Template, do the following:


    - 1. Log in to the Joomla! administrative panel.

    - 2. Navigate to **Extension** | **Template Manager** from the menu.

    - 3. Click on the **Options** button on the toolbar.

    - 4. Enable the **Preview Module Positions** option.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_103_0.png)


    - 5. Click on **Save & Close**.


    With this function enabled, go to your page, using the address that is in the
    format `http://address-of-your-site/index.php?tp=1`.


    You should see your home page, but its name will be displayed in every template
    position:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_103_1.png)


    Special address displays positions'' names and locations in Joomla!


    ## Additional template position in the header


    This functionality applies to Joomla!, WordPress, and Drupal templates.


    You can add a new position in the header area. This is handy if you need a special
    position to show in the header''s additional menu, image link (logo), and so on.
    You can add only one position in the header. In our example, we use .artx project
    from Chapter 2, The Template Step-by-Step:


    - 1. Choose the **Header** tab on the ribbon.

    - 2. Click on the **Controls** button (in the **Insert** group) and select **Position**
    from the list.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_104_0.png)


    Inserting new area into the header


    - 3. Click anywhere within the header area.


    The new position will be inserted in the place you have clicked. You can move
    it and resize using the mouse, like any other shape.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_104_1.png)


    Our header with new template position inserted


    You can''t insert something into this position using Artisteer, but after exporting
    template to CMS (that is, Joomla!), this position can be used as any another.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_105_0.png)


    Our new, empty position-31 in Joomla!


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_105_1.png)


    Some content inserted into our new position (as Custom HTML module, Joomla!)


    ## Additional template positions in the footer


    This functionality applies to Joomla! and WordPress templates.


    You can also insert new template positions into the footer. It''s very easy. You
    edit the footer area just like the page''s content, inserting new rows and cells,
    using tools from the Edit tab.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_105_2.png)


    Buttons from Content group on the ribbon''s Edit tab work also for the footer


    Footers containing many rows and cells won''t be exported as one template position,
    but Artisteer will create new template positions for each cell.


    ## CMS Templates


    The following screenshot contains an example grid in the project''s footer. All
    cells will be exported as template positions:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_106_0.png)


    The exported footer''s cells that are available Widget Areas in WordPress are
    as follows:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_106_1.png)


    The exported footer’s cells that are available module positions in Joomla! are
    as follows:


    | position-32[artstyle outline] | n-32 | position-33[artstyle outline] | n-33
    | position-34[artstyle outline] | n-34 |

    |---|---|---|---|---|---|

    | position-35[artstyle outline] | n-35 | position-36[artstyle outline] | n-36
    | position-37[artstyle outline] | n-37 |

    | position-38[artstyle outline] | n-38 | position-39[artstyle outline] | n-39
    | position-40[artstyle outline] | n-40 |

    | position-41[artstyle outline] |  | position-41 |  |  |  |


    This feature, introduced in Artisteer 4.1, shows all the possibilities when you
    stop to think about the footer as a place not only for inserting copyrights, but
    when you treat this area as "everything below the main content". There are kinds
    of websites (especially multimedia portals), in which the layout is a custom grid
    of different modules/widgets. You can achieve such a template with Artisteer by
    designing any grid of positions. Remember that the dimensions of template areas
    adapt to the content they display, and the dimensions of empty areas are zero.
    According to your needs, you may decide to use one, several, or all areas you
    have created. You can even decide not to display any article at all, hiding the
    main Content Area and using only this grid for displaying modules/widgets.


    ## Joomla! templates


    Joomla! is a very popular CMS, written in PHP language. To be able to use it,
    you will need a hosting account that supports PHP and access to one database on
    MySQL database server. Joomla! is a free, open source software, licensed under
    the terms of GPL 2, which simply means that you can use it free of charge for
    commercial purposes too (you can find text of this license at http://www.gnu.org/licenses/gpl-2.0.html).
    You can download the newest version of Joomla! installer from www.joomla.org.
    While I’m writing this book, the newest, long-term, stable version is 2.5.9, and
    this is the version we are going to work with in this chapter.

