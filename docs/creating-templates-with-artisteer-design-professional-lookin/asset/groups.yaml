    \n```\n<ul class=\"art-vmenu\">\n    <li>\n        <a href=\"offer/websites.html\"\
    >Websites</a>\n    </li>\n    <li>\n        <a href=\"offer/websites.html\">Websites</a>\n\
    \    </li>\n    <li>\n        <a href=\"offer/wordpress.html\">WordPress</a>\n\
    \    </li>\n    <li>\n        <a href=\"offer/joomla.html\">Joomla!</a>\n    </li>\n\
    \    <li>\n        <a href=\"offer/dotnetnuke.html\">DotNetNuke</a>\n    </li>\n\
    </ul>\n```\n\n12. Save the file and refresh the site. Your vertical menu should\
    \ now be displayed as shown in the following screenshot:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_134_0.png)\n\
    \nOur vertical menu, displaying only subpages as top level items\n\n## Styling\
    \ a particular module\n\nThis tip applies to Joomla! templates. An example would\
    \ be the `specialModule.artx` file.\n\nThis tip is based on standard techniques\
    \ used in Joomla!, but in the case of Artisteer, it requires some more explanation.\n\
    \nIt's quite a common situation that you want to have one of your modules looking\
    \ different from the others. For example, you may want the login module or some\
    \ other module to be distinguished from others. In the case of custom HTML modules,\
    \ you can of course modify HTML directly in the module, but this tip allows you\
    \ to do it without touching HTML and is based only on CSS modification.\n\n> This\
    \ technique works for modules taking their CSS from the template stylesheet. It\
    \ won't work with custom extensions that are rendered separately with their own\
    \ styles. In such cases, you will have to take a look into the source of a particular\
    \ extension and modify the code accordingly.\n\nIn our example, we will distinguish\
    \ the login module to make it more eye-catching for visitors.\n\nWhile designing\
    \ in Artisteer, you can't make a particular module different from others, as changes\
    \ spread into the others blocks. That's the reason we need a solution.\n\nWe are\
    \ working on the `specialModule.artx` project with content. Open it and export\
    \ it to Joomla!. Your site should look like the following screenshot:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_135_0.png)\n\
    \nSample site with two identical modules on the left-hand and right-hand columns\n\
    \nThe site contains only one page, has a three-column layout, and two identical\
    \ modules on the left-hand and right-hand columns. They were imported as two separate\
    \ custom HTML modules, but both were created in Artisteer. Our task is to distinguish\
    \ the second module, without modifying its HTML, as follows:\n\n- 1. In Joomla!'s\
    \ administrative panel, navigate to **Extensions | Module Manager**. You will\
    \ go to the **Modules** screen in **Module Manager**, which will present all installed\
    \ modules. Find and click on the **Second Block** module to go to its settings.\n\
    - 2. In **Module Manager: Module Custom HTML** (**Second Block** module settings),\
    \ expand the **Advanced Options** area and find the **Module Class Suffix** field.\
    \ In this field, we are going to type a suitable suffix.\n\n3. Type _SpecialModule\
    \ into the Module Class Suffix field as shown in the following screenshot:\n\n\
    ![](img/7f889df2ffdb68108cff34d798a2b9a3_136_0.png)\n\nType _SpecialModule as\
    \ Module Class Suffix\n\n4. On the basis of the Module Class Suffix name you type\
    \ in this field, Joomla! will search for a new class definition defined in template\
    \ CSS style. It's done according to the pattern art-block + space + clearfix +\
    \ what-you-type-in-the-field.\n\nIn our case this means art-block + _SpecialModule\
    \ = art-block clearfix_SpecialModule\n\nJoomla!, while rendering the page, will\
    \ look for art-block clearfix_SpecialModule definition in the CSS stylesheet.\
    \ This means that our block will use styles from two classes: art-block and clearfix_SpecialModule.\n\
    \nThe art-block class is defined originally by Artisteer. Look in the source for\
    \ this class and analyze it. This class defines the block's background, border,\
    \ and rounded corners. The fact that our block will get styles from two classes\
    \ is quite handy – we don't need to define everything from scratch, but only add\
    \ supplementary definitions. What's more, because our class is defined second,\
    \ our definitions will cover the original one coming from Artisteer. We can just\
    \ remove our class any time to revert back to the original look of the template.\n\
    \n5. We need to add our class in the CSS template file. This file is called template.css\
    \ and is located in the CSS folder in the template folder. Open this file in the\
    \ editor and at the end write:\n\n```\n/*** My Classes ***/\n.clearfix_SpecialModule\n\
    {\nborder: 1pt solid red;\n  background-color: #FFFF99;\n}\n```\n\nWe have overwritten\
    \ the width and color of the border, and have also set the background color as\
    \ a delicate shade of yellow. Save the file and refresh the page. You should see\
    \ something like the following screenshot:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_137_0.png)\n\
    \nOur block on the right looks quite different from its twin brother on the left\n\
    \n6. So far, so good. Let's perform the next step and change the font of the text.\
    \ Add another line of code to our class and make it look like the following:\n\
    \n```\n.clearfix_SpecialModule\n{\n  border: 1pt solid red;\n  background-color:\
    \ #FFFF99;\n  color: blue;\n}\n```\n\n7. Save the changes, refresh the page, and...\
    \ nothing happened! Something is wrong. Revert the changes (delete the last definition\
    \ from our class) and then let's look at the source code of the page. The piece\
    \ of code that displays our block looks like the following:\n\n```\n<div class=\"\
    art-block clearfix_SpecialModule\">\n  <div class=\"art-blockheader\">\n    <h3\
    \ class=\"t\">Second Block</h3>\n  </div>\n  <div class=\"art-blockcontent\">\n\
    \    <div class=\"custom_SpecialModule\"  >\n```\n\n```\n    <!--\n    content\
    \ of our block:\n    <p> elements, image and list\n    -->\n    </div>\n    </div>\n\
    \    </div>\n```\n\nSo now we need to keep in mind the following rules:\n\n- The\
    \ `DIV` element that contains the whole block belongs to the following two classes:\n\
    \  - `art-block`\n  - `clearfix_SpecialModule` (according to our suffix)\n- The\
    \ header is inside a `DIV` element. This element belongs to the `art-blockheader`\
    \ class. The header itself is an `h3` element and belongs to the `t` class.\n\
    - The content of our block is inside a `DIV` element. This element belongs to\
    \ the `custom_SpecialModule` (according to our suffix) class and is located inside\
    \ another `DIV` element, which belongs to the `art-blockcontent` class.\n\nThe\
    \ structure of our block displays the following scheme:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_138_0.png)\n\
    \nScheme of elements that make up our block\n"
  mdcn: "\n8. 我们的工作已经完成，但如果仔细查看垂直菜单，你会发现它显示了两级项目，如以下截图所示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_132_0.png)\n\
    \n我们的垂直菜单显示了两级项目\n\n9. 第一级只包含一个项目，**Offer**。我们必须保留这个项目，因为在 Artisteer 中设计时，菜单不能只包含其子项目而不显示其父项目。但很明显，在这种情况下\
    \ **Offer** 是不必要的，所以让我们查看代码并尝试修复它。如我们在第 4 步的先前代码中所见，菜单项构成列表。每一级下一级项目都表示为一个新的嵌套列表：\n\
