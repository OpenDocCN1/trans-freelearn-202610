    versions of Artisteer, there was an additional field in the startup window where
    you could set it up. But with the current version, you don''t have such an option.
    It''s not a restriction of functionality, but rather a change in the philosophy
    of working with the application. You are just designing, no matter which platform
    you will choose later. That''s because you choose the platform at the end, not
    at the beginning. It also highlights the fact that Artisteer enables you to focus
    on the design, and not the platform that you choose. Think of design as something
    that is platform independent.


    Because we want to start with a blank template, let''s click on the solitary icon
    in the second row. Artisteer will load its default data. In the following steps
