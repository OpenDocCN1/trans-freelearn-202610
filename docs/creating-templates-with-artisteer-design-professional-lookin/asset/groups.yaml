- raw:
  - '[PAGE 37]


    # Elements


    The list of elements may vary for particular websites, but in general we can distinguish
    them.


    # Header


    A header is a container that identifies the site. It is usually as long as the
    whole page and is located at the top of the page. It''s also the first element
    that you see while reading the page. According to the subject of the site, a header
    contains other elements in it, such as the company logo (on a company website),
    the author''s photo (in a blog), a slogan, a picture of a product, or an image
    that refers to the content. A header can also contain some additional elements,
    such as language flags or contact data.


    # Horizontal menu


    If a page has a horizontal menu, it''s usually located either just below the header
    or above the footer. It is a navigation element, containing links to other pages.


    # Vertical menu


    A vertical menu is a navigation element, usually located on the left or right
    side of a page. Like the horizontal menu, it contains links to other pages.


    # Content area


    Content area is the place where you read content (information that you get from
    the page). It may contain text, pictures, galleries, movies, tables, forums, links,
    and any other kind of information you can publish on a website. Content area is
    the main and biggest part of the page.


    # Special blocks


    Special blocks includes additional elements that may be required by some pages
    and that appear on all (or almost all) subpages, for example, a login form.'
  - '[PAGE 38]


    > The division of what is an element and what is content is rather smooth and
    may vary in particular cases. We are trying to list the elements that are common
    for the whole site (they appear on all the subpages). Depending on your design,
    the same information can once be an element, while at another time, it can be
    just content. For example, consider a phone number. If you write it on the Contact
    page, in the content area, it is content. But you can also conclude that this
    is such an important piece of information that you want to display it on every
    page in a special Contact block, or even in the header. In that case, it will
    be an element. It''s not uncommon either for information on a website to be both
    content and an element.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_38_0.png)


    # Footer


    A footer is the last element of a page. It usually contains the copyright information.
    It may also contain the bottom menu, some additional information, and a backlink
    to the webmaster.


    # Attributes


    Attributes are the characteristics that apply to the whole page. Typically we
    can distinguish them as follows:


    # Page width


    There are many devices you can surf the Internet with: we have desktops, laptops,
    netbooks, tablets, smartphones, and so on. Each of these devices has a different
    screen size and resolution. This means that layout size is important. Your site
    should be displayed correctly on as many different devices as possible. This usually
    leads to a compromise. You shouldn''t design your page too wide (making it look
    good, but only for the visitors with new, high-end monitors), but prepare it for
    a wider public, and also for those with older hardware. That''s why the layouts
    are usually centered with an empty space or a background around it.


    The first point of interest is the width. The height is not so important because
    you can scroll the site with the mouse without breaking the flow of reading, while
    horizontal scrolling is burdensome. Nevertheless, you shouldn''t totally forget
    about the height either, especially when designing the header. Nowadays, screens
    are increasingly becoming panoramic, and it''s not too good if your visitor can
    see only the header.'
  - '[PAGE 39]


    # Typography


    Typography is a set of fonts and its styles that appear on a page. You should
    avoid using different fonts on different subpages. Instead, the content on every
    subpage should be written with the same, consistent fonts. Just imagine reading
    a book in which every page is printed with different fonts. You would not think
    it was very professional, would you? According to the complexity of the content,
    you will have to define at least the font for the headers (titles), for the paragraphs
    (normal text), and for the hyperlinks. If your content is more sophisticated,
    you may need more header levels, table headers, table contents, quotations, and
    so on. Also, you shouldn''t forget about line spacing and margins. Typography
    is an important part of design and can greatly improve or spoil the final effect.


    # Colors


    The colors of all elements (their borders, backgrounds, and so on) should be chosen
    in such a way so as to create a coherent whole. We''re going to call this set
    of colors a color theme. A color theme is a very important factor of any design
    because it can define the ambience of a whole website. The right color theme for
    a design is like the right rhythm for a song.


    # Layout


    A layout is an arrangement of all the elements of the page. When talking about
    layout, we talk about the columns that a layout usually contains. A column is
    the vertical part of a page that can contain elements such as a vertical menu,
    special blocks, or a content area. The columns are usually located between the
    header and the footer.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_39_0.png)'
  - '[PAGE 40]


    You can say that every layout has *at least* one column. Even if it seems that
    a layout doesn''t contain any columns at all, in reality it''s a one-column layout.


    > Every layout has at least one column.


    Remember that when we talk about a layout column, we do not talk about a column
    of text (in newspapers, the text is divided into several columns) but about separate
    areas (containers) of a page, where you can put elements. If a column contains
    a content area, the content can itself be divided into many columns, but this
    is still one column according to our definition.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_40_0.png)


    We can distinguish three typical layouts.


    # One-column layout


    A one-column layout is usually used for blogs, private websites, and simple company
    websites. A one-column layout contains only a horizontal menu.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_40_1.png)'
  - '[PAGE 41]


    # Two-column layout


    The two-column layout is the most popular one. The first column usually contains
    a vertical menu, while the second one is used for displaying the content area.

    A two-column layout can contain a vertical menu, a horizontal menu, or both.

    If a two-column layout contains only a horizontal menu, the side column is used
    for additional blocks, for example, the login box. The following figure shows
    a two-column layout with a vertical menu on the left:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_41_0.png)


    The following figure shows a two-column layout with a vertical menu on the right:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_41_1.png)'
  - '[PAGE 42]


    # Three-column layout


    The three-column layout is used usually for the more advanced websites. It consists
    of two side columns (usually left and right) and one large column in the middle.
    The side columns contain various special blocks and the middle column displays
    the content. The diagram for three-column layout is as follows:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_42_0.png)


    # Creating a template


    Now we are going to prepare our first layout. We will do this together, one step
    at a time, explaining every step we go through. But before we begin, let me first
    explain what we are going to achieve.


    We are going to prepare a website advertising you as a web designer. The structure
    of the site is shown in the following diagram:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_42_1.png)'
  - "[PAGE 43]\n\nAs you can see, our site will consist of eight pages. The first\
    \ page (drawn a little bit above the other pages in the diagram) is the Home page.\
    \ This is the first page that the visitor will see on coming to our site, and\
    \ also the first page that we have to design. Logically, it is on the same level\
    \ as the other pages from the first row. The second row shows the subpages for\
    \ the Offer page. For our project we will create a two-column layout, with the\
    \ first column on the left side, showing a vertical menu and a block with the\
    \ contact information. Our site will have also a horizontal menu. Are you ready?\
    \ If so, start Artisteer on the startup screen, click on the **Blank** template,\
    \ and follow the next part of this chapter!\n\nUnfortunately, in Artisteer you\
    \ cannot set one menu to act as the submenu of another. Neither can you decide\
    \ on which pages should the menu be displayed. Both the menus are displayed on\
    \ all the pages. All you can do is decide which pages should be presented on which\
    \ menu (after you add a new page into your project, it immediately appears in\
    \ both the menus, but you can then exclude some of the pages). In our project,\
    \ the ideal solution would be to make our vertical menu act as a submenu of the\
    \ horizontal menu and show only the pages with our offer. This menu should be\
    \ visible only when the Offer page is selected in the horizontal menu and is invisible\
    \ on all the other pages. Such a thing is, alas, something that we are not able\
    \ to achieve. Let's hope that the next version of Artisteer will be extended for\
    \ such possibilities. Because we cannot do it this way, we are going to design\
    \ both menus, and then you can decide which one you prefer to use and which should\
    \ be deleted. We will also prepare a compromise solution that you may also find\
    \ acceptable in this case.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_43_0.png)\n\
    \n> To make the vertical menu act as a submenu is possible, but it requires a\
    \ manual change of the exported code. In Chapter 4, Tips and Tricks, you can find\
    \ a description of how to do this.\n> \n> Fortunately, this limitation has no\
    \ importance at all while using any old supported CMS platform."
