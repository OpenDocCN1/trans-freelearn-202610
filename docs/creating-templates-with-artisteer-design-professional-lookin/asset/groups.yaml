    \n## 本书涵盖内容\n\n*第1章，认识 Artisteer*，帮助您了解 Artisteer 到底是什么以及它如何对您有用。我们将熟悉应用程序的界面和一些基本功能。您还将制作自己的第一个模板。\n\
    \n*第2章，逐步制作模板*，涵盖使用 Artisteer 设计的典型流程，逐一解释模板的所有典型元素。本章结束时，您将能够独自准备自己的简单网站。\n\n\
    *第3章，CMS 模板*，讨论使用内容管理系统（CMS）相对于静态网站的优势，以及如何使用 Artisteer 为此类解决方案设计模板。我们将把示例项目转换为可安装的\
    \ Joomla! 和 WordPress 包，并将内容从 Artisteer 导入到 CMS。\n\n*第4章，技巧与窍门*，向您展示通过稍微修改程序生成的源代码，可以为项目增添的一些额外效果。\n\
    \n## 阅读本书所需\n\n为了充分欣赏本书，我们建议您使用可从 http://www.artisteer.com/ 下载的 Artisteer 版本 4，以及可从\
    \ http://notepad-plus-plus.org/ 下载的 Notepad++。\n\n## 本书适合谁阅读\n\n本书面向希望自行构建个人或公司网站，而无需学习\
    \ HTML、CSS 或编程等技术知识的任何人，以及考虑将 Artisteer 纳入其工具包的专业人士。它还面向所有希望获得印刷指南的较少经验的 Artisteer\
    \ 用户。\n\n## 约定\n\n在本書中，您会找到多种文本样式，用以区分不同类型的信息。以下是这些样式的一些示例及其含义。\n\n正文中出现的代码词如下所示：\"\
    再次编辑 template.css 文件并在末尾添加以下代码：\"\n\n代码块设置如下：\n\n```\n.customart-nostyle.MySpecialModule\n\
    {\n  margin-top: 0;\n  border: none;\n}\n```\n\n新术语和重要词语以粗体显示。您在屏幕上看到的文字，例如菜单或对话框中的文字，在文本中如下所示：\"\
    在功能区上选择颜色和字体选项卡。\"。\n\n警告或重要说明以如下框显示。\n\n技巧和窍门如下所示。\n\n## 读者反馈\n\n我们始终欢迎读者的反馈。请让我们知道您对本书的看法——您喜欢或可能不喜欢的地方。读者反馈对我们开发您真正受益的书籍标题非常重要。\n\
    \n如需发送一般反馈，只需发送电子邮件至 `feedback@packtpub.com`，并在邮件主题中提及书名。\n\n如果您在某个主题方面具有专业知识，并且有兴趣撰写或为书籍做出贡献，请参阅\
    \ `www.packtpub.com/authors` 上的作者指南。\n\n## 客户支持\n\n现在您已成为 Packt 书籍的自豪拥有者，我们提供多项服务来帮助您充分利用您的购买。\n\
