    for each of them. While this is possible, such a solution would have several serious
    disadvantages. They are listed as follows:


    - If the pages don''t have a consistent design and layout, visitors may get the
    impression that they have been redirected to another website and may feel lost

    - If each page has a different, individual menu, located in different places,
    navigating between the pages would be difficult, and the visitor would have to
    focus on how to navigate instead of on the content

    - The website will not look uniform throughout


    To avoid such disadvantages (and to not leave the visitors confused), we have
    to make all the subpages look similar. This is achieved by the use of the same
    graphics elements (for example, the company logo on each subpage) and the same
    (or different, but consistent in some way) layout.


    But it would be too little to say that the only element that should be common
    to all subpages is the company logo (in the case of a company website, of course).
    There are many elements that you can distinguish as a common part of a website.
    The combination of all of them together is a template.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_36_0.png)


    > You may be under the impression that using a template restricts the creativity
    of the designer and reduces the individuality of particular subpages. While this
    is true, remember that the goal is to create a good website, not a single subpage.
