- raw:
  - '[PAGE 91]


    # 3

    CMS Templates


    Until this moment, we have focused on designing static websites (it''s called
    an Website Template in Artisteer). The term **static website** can be a little
    bit embarrassing for you, because it''s naturally considered with a "page on which
    nothing moves". You may think that if you add, for example, a slideshow to a static
    website, it will cease to be static. This is a very natural and logical way of
    thinking, but in this case, the commonly used terminology is quite different.
    By saying static website, we don''t think about its content, but about the way
    the page is generated.


    # What is CMS


    In a static HTML website, the content is hardcoded – it is a part of the code
    of the page. Such a website consists of numerous HTML files and all of them are
    written separately, one-by-one. They could be prepared with the use of various
    tools (more or less simplifying the job), but each file contains both the look
    definitions and the content. All those files are copied to the web server, which
    make them available for the visitors. This is the most natural and easy-to-understand
    kind of website.


    A dynamic page is definitely more technically advanced. It doesn''t exist as a
    file, but is generated on-the-fly by the web server. After getting the signal
    that a particular page is to be displayed, a special kind of software gets the
    proper content (usually from database) and puts it into an available template.
    After content and template have been successfully combined, the page is ready
    and is sent to the browser.


    **Dynamic website** is thus, not a collection of static pages (HTML files), but
    a software installed on the web server for managing content, templates, and merging
    them into dynamic pages.


    Dynamic websites work slower than their static equivalents because each page must
    be generated before being displayed. They have more server requirements, because
    the server not only displays, but also generates the pages.'
  - '[PAGE 92]


    So what are the advantages? Well, this is for sure a much more universal solution,
    and "once the software, known as a content management system (CMS), is prepared,
    it can be used many times, for various websites. Let''s recall our definition
    of a template. I have written that a template is a collection of common, fixed
    elements of a website, like the background, header, and footer.


    Those elements are common for the entire website. What differentiates individual
    pages is the content. With the use of a CMS, the content is separated from the
    layout and stored in an external store (usually in the database). Right before
    the page is displayed, CMS gets the appropriate content and puts it into a template.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_92_0.png)


    While the page is diplayed, CMS connects fixed elements of the page (template)
    with proper content from the database


    Because the fixed elements are defined only once (they are not duplicated on every
    page, but exist in only one instance of the template), it means saving of data.
    But what''s even more important is that the separation of look and content allows
    you to change the template at any time, without any influence to the content.
    You can change the look of the site at any time and leave the content untouched.
    If you administer a website or blog over a long period of time, you will surely
    appreciate such a possibility. The technical separation of appearance and content
    doesn''t mean that you have to enter the content separately, without seeing the
    template at all (that would be very hard). The more advanced CMS solutions enable
    you to enter the content online, directly into the browser, with a WYSIWYG editor.


    Knowing all the information mentioned earlier, we can form our definition of a
    CMS.'
  - '[PAGE 93]


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_93_0.png)


    > CMS is a universal software for managing websites. It separates the look of
    the site from its content by using templates and allows the administrator to enter
    the content directly into the browser. Usually, CMS systems allow you to manipulate
    the menu structure, too.


    There are various types of CMS available in the market. Some of them are commercial,
    while others are free, and the possibilities of the most well-known solutions
    go far beyond our definition. Artisteer supports creating templates for several
    popular CMSs.


    Because content editing has a place directly in the browser, there''s no need
    to upload new pages to the server. It really speeds up managing a website as well
    as adding new content and pages.


    Using CMS system has another, maybe the most important advantage, which is the
    time needed to add new content to the site.


    Imagine that you have a website consisting of 50 pages. (You may think that it''s
    a lot by now, but it''s not. After you start to develop your site seriously, you
    will exceed this number quite easily.) Imagine that it''s a static website, consisting
    of separate HTML documents. The common elements are the header, a vertical menu
    on the left, and the footer. You want to add just one page and want it to be accessible
    from the menu. The first step is of course preparing the new page. But after that,
    you will realize that this was a less time-consuming task (if you use any WYSIWYG
    editor, you can display the template in it and enter the content very fast). The
    real problem is with modifying the menu. It''s not enough to modify the menu on
