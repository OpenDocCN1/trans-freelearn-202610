  - '[PAGE 104]


    # Additional template position in the header


    This functionality applies to Joomla!, WordPress, and Drupal templates.


    You can add a new position in the header area. This is handy if you need a special
    position to show in the header''s additional menu, image link (logo), and so on.
    You can add only one position in the header. In our example, we use .artx project
    from Chapter 2, The Template Step-by-Step:


    +   1. Choose the **Header** tab on the ribbon.

    +   2. Click on the **Controls** button (in the **Insert** group) and select **Position**
    from the list.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_104_0.png)


    Inserting new area into the header


    3. Click anywhere within the header area.


    The new position will be inserted in the place you have clicked. You can move
    it and resize using the mouse, like any other shape.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_104_1.png)


    Our header with new template position inserted'
  - '[PAGE 105]


    You can''t insert something into this position using Artisteer, but after exporting
    template to CMS (that is, Joomla!), this position can be used as any another.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_105_0.png)


    Our new, empty position-31 in Joomla!


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_105_1.png)


    Some content inserted into our new position (as Custom HTML module, Joomla!)


    # Additional template positions in the footer


    This functionality applies to Joomla! and WordPress templates.


    You can also insert new template positions into the footer. It''s very easy. You
    edit the footer area just like the page''s content, inserting new rows and cells,
    using tools from the Edit tab.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_105_2.png)


    Buttons from Content group on the ribbon''s Edit tab work also for the footer


    Footers containing many rows and cells won''t be exported as one template position,
    but Artisteer will create new template positions for each cell.'
  - '[PAGE 106]


