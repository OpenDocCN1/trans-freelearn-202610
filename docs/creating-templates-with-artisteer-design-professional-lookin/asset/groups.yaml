    ## 10 分钟内制作你的第一个模板


    够了，开始动手。像大多数编程书中第一个练习是显示“Hello World！”文本一样，我们将创建第一个“Hello World！”模板。开始吧。


    该程序有两种版本：Home & Academic 和 Standard，功能不同。Home & Academic 是 Standard 的精简版。本书使用
    Standard 版。


    你可以在生产商网站 `http://www.artisteer.com/?p=downloads` 下载最新版本。两个版本共用一个安装程序，根据你拥有的许可证号激活
    Standard 或 Home & Academic 版。同一安装程序也可安装试用版，让你了解程序并决定是否购买。


    试用版没有使用时间限制或功能限制。你可以无限期使用并体验所有功能。试用版与完整版的区别是试用版无法保存项目，且导出的模板会显示 Trial 水印。


    安装过程全自动，若接受许可条款且无需指定安装位置，只需一直点击 **下一步** 按钮直至完成。


    要将试用版转为完整版，需要激活。激活需要网络连接。点击欢迎屏幕上的 **激活** 按钮（也可通过菜单选择 **文件** | **激活**）。你将进入 **Artisteer
    激活** 窗口，在 **许可证密钥** 字段输入你的许可证密钥，如下图所示：


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_23_0.png)


    激活窗口


    输入许可证密钥后，点击 **激活** 按钮。几秒后，你的 Artisteer 副本将被完全激活。


    ## 创建新项目


    启动程序后，第一个看到的窗口标题为 **新建项目**。这里可选择打开之前保存的项目或新建项目。该窗口主体由三行组成。第一行可筛选可用的预制模板（若想在修改其一的基础上开始）。预制模板在第三行显示，根据你选择的分类和排序规则。


    第二行始终只有一个图标。点击它即可从 **空白** 模板开始，从零开始设计样式。


    ## 认识 Artisteer


    窗口右侧列出了最近打开的项目，如下图所示：


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_24_0.png)


    Artisteer 启动窗口


    你可能会说：“等等！你说在 Artisteer 中我可以设计静态网站，也可以为各种 CMS 设计模板。我在哪里设置我要做什么？”你说得对。而且在 Artisteer
    早期版本中，启动窗口有额外字段可设置。但在当前版本中没有此选项。这不是功能限制，而是工作方式的理念变化。你只是在设计，无论后来选择哪个平台。因为你是在最后而不是开始时选择平台。这也突出了
    Artisteer 让你专注于设计而非平台。将设计视为平台无关的东西。


    由于我们想从空白模板开始，点击第二行的单独图标。Artisteer 将加载默认数据。接下来的步骤我们将把它变成自定义布局。


    > 正如你所见，**空白** 模板并非真正空。它包含一些基本元素和示例内容。然而，这是使用 Artisteer 时最初始的状态，用于从零开始设计模板。


    ## 程序界面


    下图显示的是 Artisteer 的默认界面。如果你熟悉现代应用，会感到宾至如归。主菜单采用功能区形式（源自 Microsoft Office 2007），主选项如
    **编辑、颜色和字体、布局、内容、背景、表格、页眉、菜单、区块、垂直菜单、控件 和 页脚** 对应设计布局的主要阶段（我们将在下一章详细讨论）。第一个选项
    **主页** 包含影响整个网站的通用选项。


    你对如何开始有点困惑吗？别担心！在使用更高级选项之前，我们将从一个非常简单直观的工具开始：建议模式功能。


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_25_0.png)


    程序界面

