    ## Web developers and programmers


    The frontier that divides web developers and programmers is often very thin, and
    various companies use different names for the same jobs. In this book, we assume
    that a web developer is someone with the skills for creating HTML/CSS code. Additionally,
    he or she often has good knowledge of administrating the CMSs, can install and
    configure various extensions, and is able to prepare the whole website, including
    stylesheet modifications, as there''s no requirement of individual programming.
    The programmers are usually "next-level web developers", with programming skills.
    Usually, they code the core of the CMS systems or its additional functionality
    (create extensions). In short, we can assume that a web developer is someone who
    builds websites using the things that a programmer codes.


    Web developers and programmers are able to build the whole website on their own,
    if not for one problem — they can''t draw. They may be great technicians, but
    not graphics designers, and even the most technically advanced site without graphics
    does not impress anybody. That''s why they often use ready-made templates as a
    basis for further work. The problem arises when there is a need to modify not
    the functionality, but the look of the site. In that case they have to cooperate
    with the designers.


    Designers are the people who have an artistic taste. They can assess what looks
    good and what doesn''t, even if they couldn''t draw it on their own. Artisteer
    offers them the possibility to design a template independently, by determining
    the look of the site and its various elements, by changing their parameters such
    as colors, position, size, and so on. As you will see later, working with Artisteer
    resembles a situation wherein the designer is sitting next to you, listening to
    your suggestions, making the changes on the fly, and presenting the results immediately.


    ## Web development companies


    One of the main reasons that people work together is that nobody is perfect, nobody
    possesses all the talent. It would seem that for an individual, Artisteer may
    be a good option, because it allows him to avoid cooperation (which can be costly)
    with other specialists and to create the whole project alone. But in case of a
    team consisting of people with different complementary skills, there''s no need
    to use such a tool at all. Based on my personal experience, I disagree with such
    a thought, and I can quote several arguments to support my words as follows:


    - The main cost factors of any work or project is always the time and the skills
    required for the job to be done. Designing and programming are very time-consuming
    tasks, and any automation saves time and money.

    - One of the biggest and most frustrating things in the web-design business is
    that your customer usually won''t pay for something that he or she hasn''t seen
    before. With Artisteer, the first stage of concept can really be done very fast.


    The previously discussed examples of why Artisteer can be useful for various groups
    of people doesn''t mean that everything can be done with Artisteer, of course.
    For example, you can''t add any logic to the site, as this would demand a programming
    work. Similarly with the graphics, even the best automated generator won''t replace
    the real artist. Like with every other thing, the custom and handmade products
    are the best, and websites are not an exception to this. For example, cars. Do
    you agree that a representative, handmade limousine, or a sports car is better
    than a popular compact from serial production? You probably do, but do you have
    a handmade sports car? Millions of people everyday drive the cheap compacts to
    commute, and they are pretty happy with it. Price is the factor. The same is with
    websites.


    ## Your first template in 10 minutes


    Ok, enough of just talking. Let''s see Artisteer in action. Like in most programming
    books, where the first exercise is displaying the "Hello World!" text, we are
    going to create our first "Hello World!" template. So let''s begin.


    The program comes in two editions: Home & Academic and Standard, which differ
    in functionality. The Home & Academic edition is a truncated version of the Standard
    edition. In this book we work with the Standard edition.


    You can download the latest version from the producer''s website under the address
    `http://www.artisteer.com/?p=downloads`. There is one installer for both the versions
    and according to the license number you have, the Standard or Home & Academic
    edition will be activated. The same installer can also be used to install the
    trial version that allows you to know the program and make the decision if you
    want to buy it or not.


    The trial version has no time limit for usage or feature limitations. You may
    use it for as long as you wish and play with all functionalities. The difference
    between the trial and full versions is that the trial version doesn''t allow you
    to save a project, and the exported templates show the Trial watermark.


    The installation process is fully automated, and if you accept the license terms
    and don''t need to install the application in a specific location, all you have
    to do is just click on the **Next** button until the process is finished.


    To transform the trial version into the full version, the application needs to
    be activated. This process requires an Internet connection. To activate, click
    on the **Activate** button shown on the welcome screen (you can also choose the
    **File** | **Activation** option from the menu). You will go to the **Artisteer
    Activation** window, where you should enter your license key into the **License
    Key** field, as shown in the following screenshot:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_23_0.png)


    Activation window


    After you have entered your license key, click on the **Activate** button. After
    a few seconds, your copy of Artisteer will be fully activated.


    ## Creating a new project


    After you start the program, the first screen you will see is a window titled
    **New Project**. Here you can decide whether you want to open a previously saved
    project, or start a new one. The main part of this window consists of three rows.
    In the first row you can filter among the available, pre-made templates (if you
    want to start by modifying one of them). The pre-made templates are presented
    in the third row, according to which category and sorting rule you choose.


    The second row always contains only one icon. Click on it when you want to start
    with a **Blank** template and style everything from scratch.


    ## Meet the Artisteer


    In the column to the right-hand side of the window, there is a list of recently
    opened projects, as in the following screenshot:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_24_0.png)


    The startup window in Artisteer


    You may say, "Wait a minute! You have said that in Artisteer I can design not
    only static websites, but also templates for various CMSs. Where can I set up
    what exactly I''m going to do?" Yes, you are right. What''s more, in the previous
    versions of Artisteer, there was an additional field in the startup window where
    you could set it up. But with the current version, you don''t have such an option.
    It''s not a restriction of functionality, but rather a change in the philosophy
    of working with the application. You are just designing, no matter which platform
    you will choose later. That''s because you choose the platform at the end, not
    at the beginning. It also highlights the fact that Artisteer enables you to focus
    on the design, and not the platform that you choose. Think of design as something
    that is platform independent.


    Because we want to start with a blank template, let''s click on the solitary icon
    in the second row. Artisteer will load its default data. In the following steps
    we are going to turn it into our custom layout.


    > As you can see, the **Blank** template is not really empty. It contains some
    basic elements and some example content. However, this is the most initial state
    while working with Artisteer, used when you are going to design a template from
    scratch.


    ## The program interface


    What you see in the next screenshot is Artisteer''s default interface. If you''re
    familiar with modern applications, you will feel right at home. The main menu
    is in the form of a ribbon (introduced in Microsoft Office 2007), and the main
    options, such as **Edit, Colors & Fonts, Layout, Content, Background, Sheet, Header,
    Menu, Blocks, Vertical Menu, Controls, and Footer** correspond to the main stages
    while designing a layout (we will talk about those things in detail in the next
    chapter). The first option, called **Home**, contains the options that affect
    the whole site in general.


    Are you a little bit confused about how to start? Don''t worry! Before we use
    the more advanced options, we will start with a very simple and intuitive tool:
    the Suggest Mode function.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_25_0.png)


    Program interface

