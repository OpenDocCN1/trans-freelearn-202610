    # Web developers and programmers


    The frontier that divides web developers and programmers is often very thin, and
    various companies use different names for the same jobs. In this book, we assume
    that a web developer is someone with the skills for creating HTML/CSS code. Additionally,
    he or she often has good knowledge of administrating the CMSs, can install and
    configure various extensions, and is able to prepare the whole website, including
    stylesheet modifications, as there''s no requirement of individual programming.
    The programmers are usually "next-level web developers", with programming skills.
    Usually, they code the core of the CMS systems or its additional functionality
    (create extensions). In short, we can assume that a web developer is someone who
    builds websites using the things that a programmer codes.


    Web developers and programmers are able to build the whole website on their own,
    if not for one problem — they can''t draw. They may be great technicians, but
    not graphics designers, and even the most technically advanced site without graphics
    does not impress anybody. That''s why they often use ready-made templates as a
    basis for further work. The problem arises when there is a need to modify not
    the functionality, but the look of the site. In that case they have to cooperate
    with the designers.


    Designers are the people who have an artistic taste. They can assess what looks
    good and what doesn''t, even if they couldn''t draw it on their own. Artisteer
    offers them the possibility to design a template independently, by determining
    the look of the site and its various elements, by changing their parameters such
    as colors, position, size, and so on. As you will see later, working with Artisteer
    resembles a situation wherein the designer is sitting next to you, listening to
    your suggestions, making the changes on the fly, and presenting the results immediately.


    # Web development companies


    One of the main reasons that people work together is that nobody is perfect, nobody
    possesses all the talent. It would seem that for an individual, Artisteer may
    be a good option, because it allows him to avoid cooperation (which can be costly)
    with other specialists and to create the whole project alone. But in case of a
    team consisting of people with different complementary skills, there''s no need
    to use such a tool at all. Based on my personal experience, I disagree with such
    a thought, and I can quote several arguments to support my words as follows:


    +   - The main cost factors of any work or project is always the time and the
    skills required for the job to be done. Designing and programming are very time-consuming
    tasks, and any automation saves time and money.'
