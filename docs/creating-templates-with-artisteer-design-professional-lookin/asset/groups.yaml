    .art-headline a:link,\n.art-headline a:visited,\n.art-headline a:hover\n{\nfont-size:\
    \ 36px;\nfont-family: Arial, 'Arial Unicode MS', Helvetica, Sans-Serif;\nfont-weight:\
    \ normal;\nfont-style: normal;\ntext-decoration: none;\ntext-shadow: 0px 2px 3px\
    \ rgba(0, 0, 0, 0.3);\npadding: 0;\nmargin: 0;\ncolor: #FA6114 !important;\nwhite-space:\
    \ nowrap;\n}\n```\n"
