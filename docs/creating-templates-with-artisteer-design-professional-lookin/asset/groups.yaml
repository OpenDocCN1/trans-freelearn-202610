  - '[PAGE 44]


    To start with, our template looks like this:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_44_0.png)


    We are now on the first tab of the ribbon, called **Home**. It contains the **Design
    Ideas** area, **Website**, and **Export**. In **Design Ideas**, you can find different
    scopes of **Suggestion Tool**. The first button on the left is **Suggest Design**,
    and it fires automatic suggestions for the whole design. The next few buttons,
    **Suggest Colors**, **Suggest Fonts**, **Layout**, **Background**, and **Styles**
    fire automatic suggestions that change the appearance of the corresponding parts
    of the page.'
  - "[PAGE 45]\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_45_0.png)\n\n> The tabs\
    \ on the ribbon group functions are logically connected with the tab's name. For\
    \ example, all the buttons on the **Background** tab apply to the background of\
    \ the page. The first tab, **Home**, is the parent tab.\n> \n> It is also a rule\
    \ that the first button on every tab is always **Suggestion Tool** for the elements\
    \ that apply to the tab.\n> \n> It so happens that the same function is available\
    \ on different tabs. This is because some buttons logically apply to more than\
    \ one tab. For example, the **Sheet Width** (on the **Layout** tab) and **Width**\
    \ (on the **Sheet** tab) buttons are the same. Setting the width of the page is\
    \ something that applies equally well to **Layout** and **Sheet**, so Artisteer's\
    \ authors decided to put this option on both tabs.\n\nOther buttons are used to\
    \ add and delete pages and blog posts, insert special blocks, and to export the\
    \ template quickly.\n\n# Layout\n\nThe first thing that we should set up while\
    \ designing a new website is its width. If you are interested in creating web\
    \ pages, you probably have a monitor with a large widescreen and good resolution.\
    \ But we have to remember that not all of your visitors will have such good hardware.\
    \ All the templates generated by Artisteer are centered, and almost all modern\
    \ browsers enable you to freely zoom the page. It's far better to let some of\
    \ your visitors enlarge the site than to make the rest of them use the horizontal\
    \ scroll bar while reading.\n\nThe resolution you choose will depend on the target\
    \ audience of your site. Usually, private computers have better parameters than\
    \ the typical PCs used for just office work in companies. So if you design a site\
    \ that you know will be viewed mostly by private individuals, you can choose a\
    \ slightly wider layout than you might for a typical business site. But you cannot\
    \ forget that many nonbusiness websites, such as community sites, are often accessed\
    \ from offices.\n\nSo what is the answer? In my opinion, a layout with a width\
    \ of 1,000 pixels is still a good choice for most of the cases. Such width ensures\
    \ that the site will be displayed correctly on a pretty old, but still commonly\
    \ used, nonwide 17\" monitor. (The typical resolution for this hardware is 1,024\
    \ x 768 and such a layout will fill the whole screen.) As more and more users\
    \ have now started using computers that are equipped with a far better screen,\
    \ you can consider increasing the resolution slightly, to, for example, 1,150\
    \ pixels. Remember that not every user will visit your site using a desktop. Many\
    \ laptops, and especially netbooks and tablets, don't have wide screens either."
  - '[PAGE 46]


    > Remember that the width of the page must be a little lower than the total resolution
    of the screen. You should reserve some space for the vertical scrollbar.


    We are going to set up the width of our project traditionally to 1,000 pixels.
    To do this, click on the **Layout** tab on the ribbon, and next to the **Sheet
    Width** button. Choose **1000 pixels** from the available options on the list.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_46_0.png)


    The **Sheet Options** window is divided into two areas: on the left you can choose
    from the values expressed in pixels, while on the right, as a percentage. The
    percentage value means that the page doesn''t have a fixed width, but it will
    change according to the parameters of the screen it is displayed on (according
    to the chosen percentage value). Designing layouts with the width defined in percentage
    might seem to be a great idea; and indeed, this technique, when properly used,
    can lead to great results. But you have to remember, that in such a case, all
    page elements have to be similarly prepared in order, to be able to adapt to the
    dynamically changing width of the site. It is far simpler to achieve good results
    for the layout with fixed values (expressed in pixels).'
  - '[PAGE 47]


    It is a common rule while working with Artisteer that after clicking on a button
    on the ribbon, you get the list containing the most commonly used standard values.
    If you need a custom value, however, you can click on the button located at the
    bottom of the list to go to a window where you can freely set up and choose the
    required value. For example, while choosing the width of a layout, clicking on
    the **More Sheet Widths...** button (located just under the list) will lead you
    to a window where you can set up the required width with an accuracy up to 1 pixel.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_47_0.png)


    We can set the required value in three ways:


    +   - We can click on the up and down arrows that are located on the right side
    of the field.

    +   - We can move the mouse cursor on the field and use the slider that appears.

    +   - We can click on the field. The text cursor will appear. Then we can type
    the required value using the keyboard. For me, this is the most comfortable way,
    especially since the slider''s minimal progress is more than 1.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_47_1.png)'
  - "[PAGE 48]\n\n# Panel mode versus windows mode\n\nIf you look carefully at the\
    \ displayed windows, on the bottom-right corner you will see a panel mode button.\
    \ This button switches Artisteer's interface between panel mode and windows mode.\
    \ In the windows mode, the advanced settings are displayed in windows. In the\
    \ panel mode, the advanced settings are displayed on the side panel located on\
    \ the right side of Artisteer's window. If you are using a wide screen, you may\
    \ find the panel mode to be more comfortable. Its advantage is that the side panel\
    \ doesn't cover anything on your project, so you have a better view to observe\
    \ the changes. Such a change is persistent and if you switch to the panel mode,\
    \ all the advanced settings will be displayed in the right panel, as long as you\
    \ decide to go back into the windows mode. To reverse, find and click on the icon\
    \ located in the top-right corner of the side panel (just next to the x button\
    \ that closes the panel).\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_48_0.png)\n\
    \n# Columns and their content\n\nThe next step while designing a template with\
    \ Artisteer is usually to decide how many columns should the layout contain. In\
    \ our project, we are going to use the two-column layout, with the bigger column\
    \ for the content and the other, narrower one, on the left. In this column, we\
    \ want to display a vertical menu and put a block with the contact information.\
    \ These two elements will be displayed on all pages.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_48_1.png)\n\
    \n> When you add a special block to your project, it is displayed on every page.\
    \ Unfortunately you can't exclude a block from being displayed on specific pages.\
    \ That's why we have to choose the blocks whose display on every page makes sense.\n\
    > \n> Fortunately, this limitation has no importance when you're designing for\
    \ CMS.\n\nWe are beginning with setting up the number of columns. Click on the\
    \ Columns button in the Layout tab on the ribbon. From the available options,\
    \ choose the one with two columns, with the narrower one on the left.\n\nNow have\
    \ a look at the content of the left column. There is a vertical menu with a search\
    \ block. We wanted a vertical menu there, but we didn't plan for a search block.\
    \ We have to delete this block and replace it with one presenting our contact\
    \ information. Perform the following steps:"
  - '[PAGE 49]


    +   1. Move the mouse pointer over the search block. According to the location
    of the pointer, Artisteer will highlight various elements inside the block. Place
    the mouse pointer a little below the block''s title to make the program frame
    the whole block.

    +   2. In the top-right corner of the block, you will find two icons. The first
    one, which looks like a bulb, is used to start **Suggestion Tool**, whose scope
    is limited to the elements inside the border. The second one, which looks like
    a list with a red cross, removes from the project all the elements inside the
    border. If you click on that icon, the whole block will disappear. You will have
    to confirm your decision in a confirmation dialog box that Artisteer displays
    to make sure you are not removing anything by mistake.

    +   3. Click on the **New Block** button (we are still in the **Layout** tab).
    Artisteer will put a brand new block under the vertical menu:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_49_0.png)


    Now we have to change the title of our new block and write some content in it.
    Perform the following steps:


    +   1. Click on the block''s title (**New Block**) and delete the `Block` text
    using your keyboard. Then type the new title: Contact.

    +   2. Click a little below (the border will show you the place) and type your
    own contact information: telephone number and email address.


    When all the changes are done, your new block should look similar to the following:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_49_1.png)'
