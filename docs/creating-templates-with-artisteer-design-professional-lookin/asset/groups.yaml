    that will be generated during the export process, but only the names that appear
    in the menu.


    > The name of the page that you see in the **Pages** panel is the name shown in
    the menu. It is neither the name of the file that will be generated, nor the page
    title that will be shown in the browser. These parameters have to be defined in
    the **Properties** window. In this window, we can also define the menu in which
    the page should be displayed.


    Let''s define the properties for the **Home** page:


    - 1. In the **Pages** panel, right-click on the **Home** page, and from the context
    menu choose **Properties**. It will display the **Properties** window.

    - 2. Make sure that the **General** tab (from the list on the left side of the
    window) is active.

    - 3. In the **Name/URL** field, type: `index`.

    - 4. In the **Title** field, type: `Welcome to my page`.

    - 5. Click on the **OK** button to close the window.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_53_0.png)


    The **Name/URL** field defines the name of the file that will be generated during
    the export process, and this name appears in the browser''s address bar. Because
    it''s a filename it cannot contain characters that are forbidden in filenames
    (for example, "?"). Also, it cannot contain any spaces. If the desired name consists
    of two or more words, you can use the "-" character instead of a space (for example,
    for our **About Me** page, a good name would be: `about-me`). Remember that Linux
    is case-sensitive (in most cases, the server where you have your hosting account
    is powered by Linux), so to avoid any trouble, a good practice is to use only
    lowercase letters.


    The Title field contains the title of the page that is displayed in the browser''s
    window (and in the browser''s tab). In this field, you can use any character you
    want. This title is also displayed by the search engines, such as Google, Bing,
    and Yahoo!. As you can see, it''s an important property.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_54_0.png)


    > For most web servers, the default file that is displayed when no specific file
    is specified is index.html or index.htm. That''s why you should insert index in
    the Name/URL field for the main page of your website. Artisteer will generate
    this page as the index.html file. Thanks to this, your home page will be displayed
    by default when the visitor puts only your domain name into the browser''s address
    bar (without specifying the concrete page).


    Similarly, define these parameters for the rest of the pages in our project.


    ## Header


    Now that we have designed the overall layout, page width, and background, and
    added pages, it is time to design the various elements of our template. We are
    going to start with the header. First of all, we want it (the header) to be a
    little higher. Click on the Header tab on the ribbon and look for the Height button.
    Click on it and from the list of available options choose 150px. The header will
    adopt the new size.


    Next, we will define the header''s background. Just like the background of the
    page, the header''s background can be a solid color, a gradient, a texture, or
    a picture. Expand the Background Image list, and from the Abstract group choose
    the first option from the left in the second row.


    ## Title and slogan


    In Artisteer, the template''s header contains two standard texts: Title and Slogan.


    Title is just the title of your website presented in the header (do not confuse
    this text with the title you defined in the Page Properties window). Slogan is
    the second standard text in the header and usually contains a motto.

    '
  mdcn: '

    我们新区块内更改文本的方式是 Artisteer 中编辑内容的标准方式。程序到 2.6 版本时，内容编辑是不可能的。从 3.0 版本开始，你可以在项目的各个页面上自由编辑内容。从
    4.0 版本开始，这不仅适用于 HTML 模板，在为 CMS 设计时也同样可行。内容可以与设计一起导出并导入到 CMS 中。


    注意在你编写内容时，功能区会自动切换到编辑标签页，在那里你可以找到典型的编辑功能。在这里，例如，你可以设置字体、对齐方式，并插入图片或表格。用于表示各种选项的符号与你在任何流行文字处理软件中找到的符号相似——如果你有
    MS Word 的使用经验，这将会非常直观。


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_50_0.png)


    ## Colors


    默认的空白项目为白色。在开始设计模板的各个元素之前，我们将通过选择蓝色中的一个可用主题来更改配色主题。为此，请按照以下步骤操作：


    - 1. 在功能区上选择“颜色和字体”标签。

    - 2. 单击“配色主题”按钮。

    - 3. 在列表中找到“天蓝”组，并选择“深度”主题。


    > 也许你已经注意到 Artisteer 在动态显示更改结果时，不仅在你选择一个选项（即配色主题）之后，也会在你将鼠标指针移动到各个选项上时显示。


    ## Background


    选择配色方案后，是时候设置我们网站的背景了。选择功能区上的“背景”标签以查看可用选项。


    开始时，我们必须决定背景应该是纯色、渐变、纹理还是图片。有些选项互斥，而有些可以共存。它们之间的关系在下图中显示：


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_51_0.png)


    如果为背景设置颜色，并不排除使用渐变。但纹理和图片的同時使用是不可能的。如果希望背景为纯色或渐变，你必须在“图片或图像”列表中选择“无纹理”。否则，所选图片或纹理将覆盖所选颜色。


    工具的最后一组包含“光效”，它为背景添加一种类似光晕的细腻效果。光效组的选项与颜色和渐变以及纹理和图片相关。


    对于我们的项目，我们将设置一个带渐变的彩色背景。单击“填充颜色”按钮，并从“主题颜色”列表中选择第二行从左数第三个颜色。然后单击“渐变”按钮，并在“从浅到深”组中选择第二行从左数第一个选项：


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_51_1.png)


    对于光效，选择“经典”组中的第一个选项。


    ## Pages


    我们现在应根据方案向项目中添加页面。我们必须删除 Artisteer 默认插入的页面，并用我们的页面集替换它们，保持它们之间的关系。你可以使用左侧的侧面板来管理页面。


    ### Adding, removing, and renaming the pages


    第一步我们将删除冗余页面。如果你查看“页面”面板，你会看到第一页包含两个子页面。但在我们的项目中（再次查看方案），第一页不包含任何子页面。我们将删除这些子页面，因为我们不需要它们。请按照以下步骤操作：


    - 1. 单击 Page 1 左侧的小三角形符号以展开其子页面（另一种方法是直接双击页面名称）。

    - 2. 右键单击 Page 3 并从上下文菜单中选择“删除”（你也可以通过单击左键选择页面并按键盘上的 Delete 键）。

    - 3. 对 Page 1 的所有子页面重复此操作以删除它们。


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_52_0.png)


    > 单击鼠标一次可选择一个页面，但如果所单击的页面已被选中，则单击一次鼠标用于重命名它。


    现在我们将添加缺失的页面。我们的项目假设顶层有四个页面，因此我们需要再添加两个页面：


    - 1. 右键单击 Page 2 并从上下文菜单中选择“新建页面”。Artisteer 将添加一个新页面并将其命名为 Page 3。该页面的名称将被高亮显示以便你重命名它。

    - 2. 输入 Offer 并按 Enter。同样地，添加 Contact 页面并通过从“重命名”上下文菜单中选择来重命名前两个页面。你应该拥有以下页面：Home、About
    Me、Offer 和 Contact。

    - 3. 右键单击 Offer 页面并从上下文菜单中选择“新建子页面”。将新子页面命名为 Websites。类似地添加其他缺失的子页面。


    ### Page properties


    好的，我们的项目现在包含了我们想要的所有页面。你可以观察到所有页面都显示为两个菜单中的项目（水平菜单默认通过悬停展开，而垂直菜单通过单击展开）。我们已重命名页面，但我们赋予它们的名称并不是导出过程中将生成的文件的名称，而只是菜单中显示的名称。


    > 你在 **Pages** 面板中看到的页面名称是菜单中显示的名称。它既不是将生成的文件的名称，也不是将在浏览器中显示的页面标题。这些参数必须在 **Properties**
    窗口中定义。在此窗口中，我们还可以定义页面应显示在哪个菜单中。


    让我们为 **Home** 页面定义属性：


    - 1. 在 **Pages** 面板中，右键单击 **Home** 页面，并从上下文菜单中选择 **Properties**。它将显示 **Properties**
    窗口。

    - 2. 确保 **General** 选项卡（窗口左侧列表中）处于活动状态。

    - 3. 在 **Name/URL** 字段中，输入：`index`。

    - 4. 在 **Title** 字段中，输入：`Welcome to my page`。

    - 5. 单击 **OK** 按钮关闭窗口。


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_53_0.png)


    **Name/URL** 字段定义导出过程中将生成的文件的名称，该名称会出现在浏览器的地址栏中。因为它是一个文件名，所以不能包含文件名中禁止的字符（例如“?”）。此外，它也不能包含任何空格。如果所需名称由两个或多个单词组成，可以使用“-”字符代替空格（例如，对于我们的
    **About Me** 页面，一个好的名称将是：`about-me`）。请记住 Linux 是区分大小写的（在大多数情况下，你的托管账户所在的服务器由 Linux
    驱动），因此为了避免任何麻烦，最好只使用小写字母的做法是良好的实践。


    Title 字段包含在浏览器窗口（以及浏览器标签页）中显示的页面的标题。在此字段中，你可以使用任何字符。此标题也由搜索引擎显示，例如 Google、Bing
    和 Yahoo!。正如你所见，这是一个重要的属性。


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_54_0.png)


    > 对于大多数 Web 服务器而言，当未指定特定文件时显示的默认文件是 index.html 或 index.htm。这就是为什么你应该在网站主页的 Name/URL
    字段中插入 index。Artisteer 将生成此页面作为 index.html 文件。得益于此，当访客仅在浏览器地址栏中输入你的域名（而不指定具体页面）时，你的主页将默认显示。


    同样，为我们项目中其余的页面定义这些参数。


    ## Header


    现在我们已经设计了整体布局、页面宽度和背景，并添加了页面，是时候设计模板的各个元素了。我们将从页眉开始。首先，我们希望它（页眉）稍微高一些。单击功能区上的
    Header 选项卡并查找 Height 按钮。单击它并从可用选项列表中选择 150px。页眉将采用新的尺寸。


    接下来，我们将定义页眉的背景。就像页面的背景一样，页眉的背景可以是纯色、渐变、纹理或图片。展开“背景图像”列表，并从“抽象”组中选择第二行从左数第一个选项。


    ## Title and slogan


    在 Artisteer 中，模板的页眉包含两个标准文本：Title 和 Slogan。


    Title 只是你在页眉中展示的网站标题（不要将其与你在“页面属性”窗口中定义的标题混淆）。Slogan 是页眉中的第二个标准文本，通常包含一个口号。

    '
