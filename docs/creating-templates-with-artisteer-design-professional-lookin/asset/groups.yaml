  - '[PAGE 31]


    In all of the discussed situations, it will be suitable to have a copy of your
    work to modify or restore the website. The simplest (and I think the best) way
    to achieve this goal is to save the project in the native Artisteer binary format.
    That''s right. Although Artisteer generates the templates as a set of HTML/CSS/JavaScript/PHP
    files (or one ZIP archive), it also has its own native binary file with the `.artx`
    extension. Those files contain all the components of your project design and its
    content.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_31_0.png)


    > You may think of it as an analogy to writing a document in MS Word. The resulting
    form of a document is the printed sheets of paper, but you can save and archive
    your document in the form of a MS Word `.docx` file. Then you can load your `.docx`
    file into Word at any time, modify it, and print it once again. Printed sheets
    of paper are rather hard to change – it''s possible only by hand, with a pencil.
    The same situation is with Artisteer and the exported web pages. You can open
    an `.artx` file at any time, make some changes, and export the template once again,
    but changing the exported files is possible only with manual coding. There is
    no way to reverse the export process and import the exported template back into
    Artisteer. It is also not possible to take, for example, a template from `drupal.org`
    and import it into Artisteer for editing.


    To save your project, click on the icon on the shortcuts menu on the ribbon, or
    expand the **File** menu and choose the **Save** or **Save As...** option. Then
    type the name of your project, set the target location of the file (the default
    saving path is `C:\users\YourUser\Documents\Artisteer Templates`), and click on
    **Save**.


    Note that Artisteer shows a list of the recent projects on startup; so the next
    time you start Artisteer, you will see your project on the list.


    As I mentioned earlier, if you choose to store your projects in the form of HTML
    files, you can''t open and edit the project with Artisteer anymore, and you''ll
    have to code all the possible modifications manually. Even if you have a good
    understanding of how to do it, you can be sure that manual coding takes a lot
    more effort and time than working with Artisteer. There is also one more reason
    in favor of choosing the native files for your archive. The `.artx` files are
    independent of the CMS platforms. Let''s say you run your site with WordPress
    and want to port it into Joomla! (or vice versa). No problem, you just open the
    `.artx` file and export it once again, choosing Joomla! as the target. If you
    had only the exported template files, to do such a migration, you would need to
    recode the whole template. Of course, here we skip the situation that you work
    on a more complicated project, in which Artisteer is used only as a middle tool,
    and the exported template undergoes further modifications to add some additional
    functionality. But in such cases, I''m sure you will decide to archive everything
    possible, for example, `.artx` files, source graphic files, read template, and
    so on.'
