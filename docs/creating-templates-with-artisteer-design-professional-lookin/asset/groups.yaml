    # Combinations with other Artisteer-generated classes


    In the first example, we combined our class with Artisteer-generated class art-block.
    In the second example, we styled our module from scratch, combining our class
    with the art-nostyle Artisteer class. According to your needs, it may be useful
    to combine the module suffix with other standard Artisteer-generated classes (that
    is, art-article, used for posts). It''s a good idea and a good exercise to analyze
    the template.css file of the exported template. It''s also a good exercise to
    analyze the main Joomla! template file entirely (the index.php file in your template
    directory) and the source generated by Joomla!. A good understanding of how Artisteer-generated
    templates are built and how they work is useful when it comes to custom modifications
    of the templates.'
  md: "\n8. Knowing this, we can write some additional definitions and make our block\
