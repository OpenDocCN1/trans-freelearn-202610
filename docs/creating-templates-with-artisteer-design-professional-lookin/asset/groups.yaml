    websites.


    # Your first template in 10 minutes


    Ok, enough of just talking. Let''s see Artisteer in action. Like in most programming
    books, where the first exercise is displaying the "Hello World!" text, we are
    going to create our first "Hello World!" template. So let''s begin.


    The program comes in two editions: Home & Academic and Standard, which differ
    in functionality. The Home & Academic edition is a truncated version of the Standard
    edition. In this book we work with the Standard edition.


    You can download the latest version from the producer''s website under the address
    `http://www.artisteer.com/?p=downloads`. There is one installer for both the versions
    and according to the license number you have, the Standard or Home & Academic
    edition will be activated. The same installer can also be used to install the
    trial version that allows you to know the program and make the decision if you
    want to buy it or not.


    The trial version has no time limit for usage or feature limitations. You may
    use it for as long as you wish and play with all functionalities. The difference
    between the trial and full versions is that the trial version doesn''t allow you
    to save a project, and the exported templates show the Trial watermark.'
