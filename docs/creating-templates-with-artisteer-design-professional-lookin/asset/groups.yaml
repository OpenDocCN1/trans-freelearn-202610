  - '[PAGE 141]


    # Styling from scratch


    In the earlier example, we had styled our **Second Block** mixing our class with
    the standard `art-block` Artisteer class. But sometimes, you will be more interested
    in removing all the template styles and styling a particular module from scratch.
    For such purposes, Artisteer provides a special class called `art-nostyle`. The
    name of this class should be the first part of your suffix.


    > > In fact, when you use the `art-nostyle` class to compose your suffix, the
    module will also get the definitions from two classes, namely, `art-nostyle` and
    your own (which name comes from the suffix). But the use of the `art-nostyle`
    class causes the module to be displayed omitting template styles, so in reality
    the effect is as if the module wasn''t styled at all.


    In this example, we will work with the same **Second Block** in our project. The
    steps are as follows:


    +   1. If you have modified the template CSS file according to our previous example,
    delete the template and install it once again. This will prevent you from having
    an untidy `template.css` file. Assuming that both **First Block** and **Second
    Block** look the same, edit the **Second Block** module properties and in the
    **Module Class Suffix** field type `art-nostyle MySpecialModule`.

    +   2. Save the changes and refresh the site. You will see that our **Second Block**
    again looks different from the **First Block**, but this time it looks like it
    wasn''t styled at all:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_141_0.png)


    After enabling new suffix, our Second Block on the right-hand column has no defined
    look at all'
  - "[PAGE 142]\n\n> This time we didn't start the name of our class in the suffix\
    \ with the _ character. We didn't do it because when we compose our suffix with\
    \ one of the predefined Artisteer classes (in this case, `art-nostyle`), the word\
    \ `clearfix` won't be added to our class name.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_142_0.png)\n\
    \n3. Using the suffix in this form will cause Joomla!, while rendering our **Second\
    \ Block**, to seek for both `art-nostyle` and `MySpecialBlock` classes. The first\
    \ one is a standard Artisteer class. We need to add the second definition to the\
    \ `template.css` file. But before we do that, let's take a look at the source\
    \ of the generated page:\n\n```\n<!-- begin nostyle -->\n<div class=\"art-nostyle\
