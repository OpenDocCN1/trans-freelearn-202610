    # The Suggestion tool


    Suggest Mode is a function that suggests a look of the element you are currently
    working on. Because the **Home** tab refers to the scope of the whole project,
    using this function at this level suggests the whole design with all the dependent
    elements. Let''s click on the icon. It''s the yellow bulb, first on the left,
    with the **Suggest Design** label.


    The whole design has changed. Amazing, isn''t it? It''s not just switching to
    the next available template from a collection. When you clicked on the icon, Artisteer
    generated a whole new layout, consisting of randomly generated elements. What
    you see is unique. If you don''t believe it, you can very easily test it on your
    own. Just restart the program and try to do it once again. You will probably never
    see exactly the same layout twice.


    Click over and over on the **Suggest Design** icon, until you really like what
    you see.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_26_0.png)


    > What''s interesting is that although a new proposal is generated every time
    randomly, the **Undo** function works correctly. It seems that the full history
    of generated layouts is stored as long as the program runs.


    # Previewing the project


    At any time, you can see the live preview of your project in the browser. To get
    it, perform the following steps:


    +   1. Click on the **File** menu (above the ribbon).

    +   2. Choose the **Preview In Browser** function. A list of browsers installed
    in your system will expand.

    +   3. Choose the browser you want to see your project in.'
