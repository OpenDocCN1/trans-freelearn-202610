    设计静态网站时，你通常会考虑具体的或至少是计划中的内容。想想我们在上一章中所做的工作。我们首先准备了显示网站结构的方案。我们知道它将由哪些子页面组成，以及每个页面上会呈现什么内容。在此基础上，我们决定主菜单将是水平的，并且我们还将拥有互补的垂直菜单。对于
    CMS 模板而言，情况则大不相同；通常你甚至不知道会发布什么类型的内容。你不能假设网站管理员会按照你的假设使用你的模板。也不可以根据你对可能内容的设想来准备模板。这种方法会限制网站所有者。因此，在为
    CMS 系统创建模板时，你应专注于设计，而不是内容。


    为了更好地说明我所说的“以设计为中心而非以内容为中心的方法”，让我们考虑一个具体的模板元素，即垂直菜单。本章开头我写道，特定页面由固定的模板元素和可变因素内容组成。内容因页面而异。这是正确的。但如果我们考虑某些固定元素的性质，就会意识到它们并非绝对固定。菜单包含现有页面的链接。如果
    CMS 不仅允许我们编辑现有页面，还允许删除和添加新页面，则菜单也必须根据网站结构的变化进行调整。每当添加新页面时，就应出现新的菜单项（在正确的位置！），而当页面被删除时，对应的菜单项也应随之删除。


    否则，可能会出现刚添加的页面在菜单中没有对应项的情况，因此访客无法浏览到它。或者菜单仍包含已被删除页面的项。


    对于静态网站，你可以将菜单作为一个整体来设计。你知道项目的确切数量和标题。你可以根据项目数量调整按钮大小，并使菜单在屏幕上占据你想要的精确空间。对于 CMS
    模板设计，你不知道菜单将包含多少项。你无法预测菜单的大小，因为在添加新页面后，菜单中会出现新的按钮，使你的垂直菜单变高。唯一的解决方案是将垂直菜单视为一个整体区域，由项目（菜单按钮）填充。你可以，也应该设计特定菜单项的外观、整个菜单的边框、菜单标题的字体，但它仍然是一个整体模板，而不是具体的菜单。你必须接受自己没有所有信息这一事实，并且必须在这种情况下完成工作。这就是我写道你应专注于设计而非内容的意思。


    > 模板元素导致项目的完整性。


    由于你不知道使用你的模板会发布什么内容，你不能仅将工作限制在设计你知道会出现元素上。你的模板必须是完整的，并且应使用户能够输入各种可能的内容。你的模板应为整个网站提供统一的外观。你不能省略某些元素，因为你不知道它们是否会被使用。


    例如，在第 2 章《逐步构建模板》中设计静态模板时，我们省略了标题的第三级。我们知道内容，并且此类元素不会被使用；因此，没有必要设计它们。但在设计 CMS
    模板时，你不能这样做。你应该设计所有可能出现的元素。


    特别要记住设计：


    - 完整的排版（所有六级的标题、所有状态下的链接、普通文本字体、引用等等）

    - 表格的外观（表格标题字体、表格内容字体和边框）

    - 表单控件（按钮、单选按钮和复选框）

    - 图片的边框和边距

    - 项目符号

    - 水平和垂直菜单（你不知道用户是否想使用其中一个或两者）


    此外，你不能省略特定 CMS 支持的特殊区块。最常用的特殊区块是登录表单和搜索字段。虽然所有 CMS 解决方案的基本方法相似（例如在线内容编辑），但特定系统之间存在差异。每个系统都有其特定的典型用途。要设计一个好的模板，你必须了解为之设计的
    CMS 的特性和属性。Artisteer 允许你使用 **Widgets** 列表插入最常见的区块（它位于功能区的 **Layout** 选项卡上）。查看此列表以确保自己没有遗漏重要内容并不是坏主意。


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_97_0.png)


    如果你的目标 CMS 使用了这些区块之一，你应该在项目中予以考虑


    > 对具体 CMS 的可能性和属性的了解是制作其良好模板的基本要求。


    ## CMS 模板


    大多数现代 CMS 解决方案采用模块化设计。这意味着核心功能可以通过安装扩展来扩展。市场上针对各种流行 CMS 有成千上万的各种扩展。它们由第三方公司提供，提供非常多样化的功能。当然，你无法知道用户会使用哪些插件，你的模板不必全部支持它们。最低要求是设计一个支持特定
    CMS 所有核心功能的模板。


    在大多数情况下，选择三列布局是个好主意。要理解原因，我们必须回到对 CMS 工作方式的解释。我们知道内容是在显示前插入到页面中的。我们也知道某些元素（即菜单）具有动态特性，其外观取决于网站结构或其他系统设置。下一个特点是网站管理员可以决定是否显示某些可用元素。管理员可以，例如，决定水平菜单应显示在所有页面上，而垂直菜单仅显示在其中一些页面上（作为补充菜单），搜索字段仅显示在主页上。从一个角度看，它提供了巨大的网站管理自由度，但从另一个角度看，它也显示了问题的复杂性。


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_98_0.png)


    两侧都有列时，在放置元素时具有很大的自由度


    基于前面的信息，我们可以假设通过 CMS 系统显示页面的过程大致如下：


    - 1. 获取将要显示的页面的设置。

    - 2. 检查哪些元素应显示，哪些不应显示。

    - 3. 显示模板中的所有静态固定元素，并将其定位到正确的位置。

    - 4. 渲染模板的动态元素，并将其定位到正确的位置。

    - 5. 获取适当的内容，并在内容区域显示它。


    由于动态元素的尺寸可能会发生变化，因此无法定义其位置。例如，你无法预测应显示在垂直菜单下方的登录字段距离页面顶部 400 像素，因为我们不知道垂直菜单有多高。我们唯一真正拥有的信息是它应显示在左侧，垂直菜单下方。为了解决这个问题，CMS
    模板基于我们称之为区域的东西。


    区域是模板中可以显示特定元素的位置。在区域中，你可以显示各种类型的元素，也可以将区域留空。一种特殊的区域是内容区域。内容是一个元素，每个页面上只能出现一次。


    这是否意味着其他元素可以在同一页面上多次出现，例如两个垂直菜单，一个在另一个之下，看起来相同？是的。即使这在逻辑上不合理，从技术上讲也是可能的。


    区域始终呈矩形形状，并将模板划分为行和列，因此任何模板都可以视为网格。此网格的单元格数量（模板中的区域数量）因特定模板而异。


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_99_0.png)


    > CMS 的模板是可用区域和元素外观定义的组合。


    当你从头开始手工编写模板代码时，你决定区域的数量和放置位置。使用 Artisteer 时，你必须接受应用程序生成的网格。


    Artisteer 为 CMS 系统生成三列布局，左侧和右侧列中有区域。使用 Artisteer 设计时，你应遵守此规则，并以三列布局为项目基础。

    '
