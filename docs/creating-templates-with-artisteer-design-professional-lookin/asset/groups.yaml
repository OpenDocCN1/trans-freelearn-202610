- raw:
  - "[PAGE 151]\n\n2. To achieve our goal and make the title blue, we need to cover\
    \ the color property. The definition is as follows:\n\n```\n.art-headline,\n.art-headline\
    \ a,\n.art-headline a:link,\n.art-headline a:visited,\n.art-headline a:hover\n\
    {\n    color: blue !important;\n}\n```\n\n3. We could append the above definition\
    \ at the end of the style.css file. We could type it directly in Artisteer in\
    \ the Additional CSS styles: field by navigating to Export | Options | CSS Options.\
    \ The result is the same and it works (title is blue).\n\n4. Instead of this,\
    \ let's create a brand new file and call it myStyles.css.\n\n5. Write our definition\
    \ in this file and save it in the exported template folder (OneDayBlue). View\
    \ the site in the browser. Our modification isn't working yet, because we haven't\
    \ connected our file with the template.\n\n6. To connect our file with the template,\
    \ edit the index.html file. Rather in the beginning of the file, you will find\
    \ the lines where the CSS files are connected:\n\n```\n<!--[if lt IE 9]><script\n\
    src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"></script>\n<![endif]-->\n\
    <link rel=\"stylesheet\" href=\"style.css\" media=\"screen\">\n<!--[if lte IE\
    \ 7]><link rel=\"stylesheet\" href=\"style.ie7.css\"\nmedia=\"screen\" /><![endif]-->\n\
    <link rel=\"stylesheet\" href=\"style.responsive.css\" media=\"all\">\n```\n\n\
    7. Under the code given in step 6, add the following line:\n\n```\n<link rel=\"\
    stylesheet\" href=\"myStyles.css\" />\n```\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_151_0.png)\n\
    \n> The overall pattern when connecting your own CSS file with the web page is\
    \ <link rel=\"stylesheet\" href=\"path-to-your-file\" />\n\n8. Save the file and\
    \ refresh the site in the browser. Now, when our CSS file is connected to the\
    \ page, our changes are applied."
  - "[PAGE 152]\n\nIf your site contained more than one web page, you would have had\
    \ to connect your CSS file with every page. Fortunately, in the case of CMS templates,\
    \ there's usually only one main template file.\n\n9. Using this technique, you\
    \ should remember several rules, including:\n\n+   o **Always cover, never remove:**\
    \ In CSS, every element can be defined many times. Following definitions complement\
    \ each other. In case of conflict, the last definition has the top priority. Instead\
    \ of removing a property from the original definition, write this definition once\
    \ again and cover the particular property with the new value.\n+   \n+   o **Connect\
    \ your CSS file as the last one:** Every page can be connected with many CSS files.\
    \ In a case where definitions from various files stay in conflict, definitions\
    \ from the last connected file will have top priority. Connecting your file as\
    \ the last one gives you confidence that your changes will cover the original\
    \ definitions generated by Artisteer.\n\n# Making a copy of a web page\n\nSometimes\
    \ it happens that you need to have an exact copy of an article of a page that\
    \ you already have in your project. This can be when you want to have several\
    \ similar pages, differing in some details. Then, instead of manually copying\
    \ elements one by one, it would be useful to copy the source page, modify the\
    \ details, and make the next one.\n\nUnfortunately, you can't just select the\
    \ content of the page with the mouse and then press Ctrl + C to copy the content,\
    \ as that won't work. You can do it within just one cell of content.\n\nThe solution\
    \ is quite simple:\n\n+   1. Click anywhere within the content area in the page\
    \ you want to copy from.\n+   2. Click on the Edit pane on the ribbon, and then\
    \ on the HTML button in the Source group.\n+   3. Check the Edit whole Article\
    \ HTML field.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_152_0.png)"
  - '[PAGE 153]


    +   4. You will get a warning message that reads **After editing, the content
    will be combined into one cell**; click on **OK**.

    +   5. Now in the HTML editor you will see all the contents of your page (article).
    Select the whole text with the mouse (or press *Ctrl + A*), press the right mouse
    button, and from the content menu choose **Copy** (or just press *Ctrl + C*) to
    copy the text into the clipboard.

    +   6. Click on the **OK** button to close the HTML editor.

    +   7. Create a new page and click anywhere in the content area.

    +   8. Click on the **HTML** button on the ribbon.

    +   9. Delete everything in the HTML editor and paste the code from the clipboard
    (press *Ctrl + V*, or press the right mouse button and choose **Paste** from the
    content menu).

    +   10. Click on the **OK** button to close the HTML editor.


    You will notice that the entire content of your source article has been copied.


    # Adding Lightbox


    This tip applies to HTML templates. In case you use a CMS, you should rather use
    one of the available extensions.


    The Lightbox effect is a really cool Artisteer feature that enables you to enrich
    your projects with image galleries. But Artisteer''s Lightbox is not as impressive
    as the real one. Wouldn''t it be nice to have a gallery with the real Lightbox?
    In this tip, I will show you how to modify the code, to get the gallery with real
    Lightbox. In this example, we will use the `betterImageGallery.artx` project file.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_153_0.png)


    > Lightbox is the generic name for the group of techniques that display images
    using modal dialogs. The name comes from original JavaScript plugin, created by
    Lokesh Dhakar (for more information, visit http://lokeshdhakar.com/projects/lightbox/).
    Lightbox-like scripts show images in a nice border, with navigation controls and
    description text.'
  - '[PAGE 154]


    We will use the Lightbox2 effect, based on the jQuery library. There are many
    Lightbox-like effects available, but this one is quite powerful and easy to use.
    Artisteer uses jQuery for its own Lightbox effect and attaches this library to
    exported projects by default, so it is a good idea to use an effect based on this
    library. Here is our procedure:


    +   1. Before we start, we need to prepare some additional files. Artisteer will
    include the jQuery library, but we need our Lightbox2 effect. You can download
    it for free from its author website `http://lokeshdhakar.com/projects/lightbox2/`.
    Go to this page and download the file. This will be a ZIP archive, containing
    several folders and files. Not all of these files are really needed, but for simplicity
    just extract the archive. You will get a `Lightbox` folder.

    +   2. The installation package contains not only the necessary files, but also
    an example page, jQuery library, and some example images. If you want to have
    only what you really need, you can delete the unnecessary files and keep only
    the files appearing in the scheme shown in the following screenshot:

    +   3. The second asset we need are the images we want to show in our gallery.
    For this example, I have prepared a simple images packet into the ZIP archive.
    Unzip the `galleryImages.zip` file. You should have the `galleryImages` folder
    with eight simple images inside.

    +   4. Now, when we have prepared the additional files that we need, start Artisteer
    and open the `betterImageGallery.artx` project file. You will see that it''s just
    a one-page template, with eight empty cells in the content area. The concept of
    an image gallery using Lightbox is that the thumbnails of images are displayed
    on the page. Each thumbnail is a link to the corresponding big image. Without
    Artisteer, we would need to prepare thumbnails of our images, but we don''t have
    to worry about this, as Artisteer will correctly resize each image while inserting
    them into cells.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_154_0.png)'
  - '[PAGE 155]


    5. Put one image from our collection in each cell. Your project should look similar
    to the one shown in the following screenshot:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_155_0.png)


    Initial state of our gallery where we have thumbnails in cells in content area


    6. Now export the project into a folder, giving it the name `ImageGallery`. Open
    this folder and double-click on the `index.html` file to view the site in the
    browser.


    7. By default, every picture has the Lightbox effect enabled. Because we are going
    to replace Artisteer''s Lightbox effect with another one, we need to turn it off.
    Go back to Artisteer, press the right mouse button on every image, choose the
    **Image Options** option from the content menu, and in the **Image Options** window
    set the value of the **Preview** field to **No**.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_155_1.png)


    We need to turn off the Lightbox effect for each image in the gallery


    8. Export the project once again, under the same name and location, overwriting
    any previous files.'
