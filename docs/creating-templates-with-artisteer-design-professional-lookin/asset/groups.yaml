- raw:
  - '[PAGE 55]


    Title and slogan editing is done in the same way as editing the rest of the text
    in the page (remember how we edited the block with the contact information?).
    To edit the slogan and title, perform the following steps:


    +   1. Double-click on the title **Enter Site Title**.

    +   2. Using the keyboard, delete the existing text and type:

    +      `Stunning Web Design.`

    +   3. Click on anything other than the header to apply the changes.


    The title gets deactivated when you click on something else. If you click on it
    once, a delicate border will appear around it, and you will be able to freely
    move and rotate the text. Note that it''s impossible to move the title outside
    the header.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_55_0.png)


    > The previous technique of moving and rotating an object can be applied not only
    to the title, but also to the slogan and the shapes.


    Now we will add the slogan to our header:


    +   1. Click on the **Slogan** button on the ribbon. In the header''s area a new
    text **Enter Site Slogan** will appear.

    +   2. Delete the original text and replace it with `We design your needs` in
    the same way that we modified the title.

    +   3. Place the slogan under the title.


    Note that while editing the title and the slogan, the ribbon does not switch automatically
    to the **Edit** tab, and even if you do it manually, all the options located on
    the **Edit** tab are unavailable. Does it mean that you can''t influence the appearance
    of these elements? Oh no! If you want to change the look of the title or slogan,
    you have to use the **Text** button that is located in the **Edit Shape** group,
    on the **Header** tab on the ribbon. This group of options is displayed only if
    the title or slogan is selected. Experiment with all the available options and
    make these two elements look exactly like you want.'
  - '[PAGE 56]


    # Pictures


    Besides the title and slogan you can insert images into the header. We are now
    going to insert a picture into the header:


    +   1. Click on the lower part—the arrow—of the **Image** button. This button
    consists of two elements. Clicking on the upper part fires the **From File...**
    option, while clicking on the bottom arrow expands the full list of options.

    +   2. Find the **Animals** group on the list.

    +   3. Choose the picture of two colorful parrots.


    You can freely move and resize the inserted picture with the mouse (while resizing,
    the Artisteer program maintains the aspect ratio of the picture). Note that while
    a picture is selected, a new group of options, **Edit Shape**, is displayed on
    the ribbon. It''s at the same place where we found the **Edit Image** group, while
    we were editing the title and the slogan. This group contains the options by which
    you can align a picture, convert it to grayscale, or add the glow effect.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_56_0.png)


    > You can put as many pictures as you want in the header.


    # Shapes


    **Shapes** are graphic objects (in the form of geometric figures) that you can
    insert into the header. You can also move and rotate the shapes like you did with
    the title and the slogan, and you can resize them just like you did with the picture
    (even better because you can resize the shapes with or without maintaining the
    aspect ratio). You can also type text inside them by double-clicking on the shape
    and enabling the text cursor in it. The background of the shape can be a solid
    color, gradient, or texture.


    Each shape can have one of the several predefined forms. The available forms contain
    simple geometric figures and also some more advanced shapes. The list of available
    forms is displayed after clicking on the **Shape** button on the ribbon:'
  - '[PAGE 57]


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_57_0.png)


    The last option on this list (Form) expands another list, with more advanced forms:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_57_1.png)


    Using shapes can be very handy. They are especially useful when combined with
    images:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_57_2.png)


    Example of the combination of a shape (on the left, with phone number) and an
    image


    One of the most interesting features offered by shapes is the ability to use masks.'
  - '[PAGE 58]


    A Mask is the transparent area within the shape. Because shapes are always displayed
    over images, moving a shape with a mask over the image makes the image visible
    through the shape. The possibility of uncovering only a part of the image allows
    you to achieve interesting effects, as in the following screenshot:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_58_0.png)


    # Ordering shapes and pictures


    If you use many pictures and shapes in your header, sooner or later you will come
    across the problem of deciding which one of them should be on top of the other
    and which one should be covered. In Artisteer, you can set the order of these
    objects by choosing the Send to Back or Bring to Front option from the context
    menu that appears when you right-click on the shape/image:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_58_1.png)


    > The order of the shapes and images should be considered separately. You can
    display one picture over/under another picture, or display one shape over/under
    another shape. But you can''t display a picture over any shape. The shapes are
    always displayed over the pictures.


    # Flash


    If you want, you can add one of the available Flash effects to the header. To
    do this, click on the Flash button (it''s on the right side of the ribbon, on
    the Header tab) and choose one of the effects from the list (I chose the second
    effect from the Special group). You can also insert your own Flash movie (in the
    swf format) from the disc.


    The characteristic feature of the Flash effects that Artisteer offers out-of-the-box
    is that they don''t replace the content of the header, but display the rather
    delicate additional effects over it.'
  - '[PAGE 59]


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_59_0.png)


    > Although adding Flash to the header can make it look more attractive, you should
    remember that Flash is not natively supported on the devices working under iOS,
    such as iPad or iPhone. If you expect visitors to browse your site using one of
    these devices, using Flash is not the best option.


    # Menu


    The next elements we are going to design are our menus. We will style their look
    and also decide which pages they should display as their items.


    # Horizontal menu


    All the options that Artisteer provides to design the horizontal menu are located
    on the Menu tab on the ribbon. Click on it.


    Currently our horizontal menu is located inside the header and is aligned to the
    right. Because this place is now occupied by an image, the menu isn''t clearly
    visible. The first thing we are going to do is find a better place for our menu.
    We will put it under the header and align it to the left.


    The position of the vertical menu is determined by the Position option, located
    as the second icon from the left, next to Suggest Menu. Expand the available positions
    and see how the position of the menu changes according to each one. For our project,
    choose the second position in the Inside Sheet group. The menu will move under
    the header.


    If you want to have some space between the menu and the header, use the Margin
    option. The Length option lets you set the menu''s width to be equal to the header
    or as wide as the whole screen.


    Our next step is the alignment of menu items to the left. It''s a little bit tricky
    because the correct option is located not inside the Menu Area group, but in Item.
    (I must admit it''s logical, since you don''t align the menu area but the menu
    items. On the other hand you can''t align a single item, but all of them at once.
    Anyway, it took me some time to find this option when I started my adventure with
    Artisteer.) To change the alignment of the menu, do the following:


    +   1. Click on the Item button.

    +   2. On the list, find the Layout group and expand the Align option by moving
    the mouse pointer over it.'
  - '[PAGE 60]


    +   3. From the available options choose the icon that represents alignment to
    the left:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_60_0.png)


    If you want to quickly change the look of the whole menu, use one of the options
    available in the Menu Styles list. Each one of the options listed there changes
    the look of the whole menu, including all of its elements. If you want to define
    each menu element separately, you should use the options available in the Menu
    and Submenu groups.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_60_1.png)


    The Menu group contains options to modify the top level of the menu. The group
    is divided into four main options, each of which has its own, more detailed properties.


    # Menu Area


    Menu Area is a container (rectangular area) in which the menu is displayed. It
    doesn''t define the look of the menu items. The items are located inside the menu
    area. In other words, the menu area is just the menu bar.


    # Item


    With the help of this option you can define the look of the top-level items in
    the menu.


    # Coloring


    This option lets you set up the style in which the active item is marked.'
