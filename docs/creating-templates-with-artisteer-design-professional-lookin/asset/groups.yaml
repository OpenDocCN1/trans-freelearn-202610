  - "[PAGE 146]\n\n# Adding additional CSS to the project\n\nThis tip applies to all\
    \ kinds of templates. In this example, we will work with the HTML template.\n\n\
    If you need to add some of your own CSS to the original template's stylesheet,\
    \ you can do it directly from Artisteer. This feature may also be useful if you\
    \ want to modify original Artisteer classes. Here are the steps for this tip:\n\
    \n+   1. In this example, we work with the AddCssToProject.artx project file.\
    \ Open it. This is the site that we saw in Chapter 2, The Template Step-by-Step,\
    \ but I have added a simple contact form in the Contact page.\n+   \n+      In\
    \ this example, we will add some CSS definitions to achieve three goals:\n+  \
    \    - We want to change the default Artisteer prefix for CSS classes.\n+    \
    \  - We want to distinguish images when moving the mouse cursor over them (roll-over\
    \ effect). This effect should apply only to images with the Lightbox effect.\n\
    +      - We want to distinguish active controls in the Contact form.\n\n+   2.\
    \ To add CSS to the generated code, click on the Export button and in the Export\
    \ window, click on the Options button. In the Options window that will appear,\
    \ click on the CSS Options pane on the left. The right-hand side of the window\
    \ will show you the available options. You will see that there are two fields,\
    \ namely, CSS Prefix: and Additional CSS Styles:\n\nThe CSS Prefix: field contains\
    \ the prefix that will be used to name CSS classes generated in the exported template.\
    \ The default value is art-.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_146_0.png)"
  - "[PAGE 147]\n\n3. Recall the standard classes we worked with in the *Styling from\
    \ scratch* tip. We worked with the `art-block`, `art-nostyle`, and `art-article`\
    \ classes. The first part of its name is the prefix you type in this field. Let's\
    \ assume that I would write `jakub-` here (from my name). In such a case, instead\
    \ of the `art-block`, `art-nostyle`, or `art-article` class, Artisteer would generate\
    \ the class names, namely, `jakub-block`, `jakub-nostyle`, or `jakub-article`,\
    \ respectively. Changing the default CSS class prefix doesn't change anything\
    \ in the code, but class names. So why would you do that? There are two reasons:\n\
    \n+   - Sometimes you may want to hide the fact that you prepare your projects\
    \ with Artisteer. There are people who think that the Artisteer-generated templates\
    \ are less expensive than the templates made manually or with other tools. Whether\
