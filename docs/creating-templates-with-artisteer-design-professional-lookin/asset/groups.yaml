    \ better because you can resize the shapes with or without maintaining the aspect\
    \ ratio). You can also type text inside them by double-clicking on the shape and\
    \ enabling the text cursor in it. The background of the shape can be a solid color,\
    \ gradient, or texture.\n\nEach shape can have one of the several predefined forms.\
    \ The available forms contain simple geometric figures and also some more advanced\
    \ shapes. The list of available forms is displayed after clicking on the **Shape**\
    \ button on the ribbon:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_57_0.png)\n\
    \nThe last option on this list (Form) expands another list, with more advanced\
    \ forms:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_57_1.png)\n\nUsing shapes\
    \ can be very handy. They are especially useful when combined with images:\n\n\
    ![](img/7f889df2ffdb68108cff34d798a2b9a3_57_2.png)\n\nExample of the combination\
    \ of a shape (on the left, with phone number) and an image\n\nOne of the most\
    \ interesting features offered by shapes is the ability to use masks.\n\n## Ordering\
    \ shapes and pictures\n\nA Mask is the transparent area within the shape. Because\
    \ shapes are always displayed over images, moving a shape with a mask over the\
    \ image makes the image visible through the shape. The possibility of uncovering\
    \ only a part of the image allows you to achieve interesting effects, as in the\
    \ following screenshot:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_58_0.png)\n\
    \nIf you use many pictures and shapes in your header, sooner or later you will\
    \ come across the problem of deciding which one of them should be on top of the\
    \ other and which one should be covered. In Artisteer, you can set the order of\
    \ these objects by choosing the Send to Back or Bring to Front option from the\
    \ context menu that appears when you right-click on the shape/image:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_58_1.png)\n\
    \n> The order of the shapes and images should be considered separately. You can\
    \ display one picture over/under another picture, or display one shape over/under\
    \ another shape. But you can't display a picture over any shape. The shapes are\
    \ always displayed over the pictures.\n\n## Flash\n\nIf you want, you can add\
    \ one of the available Flash effects to the header. To do this, click on the Flash\
    \ button (it's on the right side of the ribbon, on the Header tab) and choose\
    \ one of the effects from the list (I chose the second effect from the Special\
    \ group). You can also insert your own Flash movie (in the swf format) from the\
    \ disc.\n\nThe characteristic feature of the Flash effects that Artisteer offers\
    \ out-of-the-box is that they don't replace the content of the header, but display\
    \ the rather delicate additional effects over it.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_59_0.png)\n\
    \n> Although adding Flash to the header can make it look more attractive, you\
    \ should remember that Flash is not natively supported on the devices working\
    \ under iOS, such as iPad or iPhone. If you expect visitors to browse your site\
    \ using one of these devices, using Flash is not the best option.\n\n## Menu\n\
    \nThe next elements we are going to design are our menus. We will style their\
    \ look and also decide which pages they should display as their items.\n\n###\
    \ Horizontal menu\n\nAll the options that Artisteer provides to design the horizontal\
    \ menu are located on the Menu tab on the ribbon. Click on it.\n\nCurrently our\
    \ horizontal menu is located inside the header and is aligned to the right. Because\
    \ this place is now occupied by an image, the menu isn't clearly visible. The\
    \ first thing we are going to do is find a better place for our menu. We will\
    \ put it under the header and align it to the left.\n\nThe position of the vertical\
    \ menu is determined by the Position option, located as the second icon from the\
    \ left, next to Suggest Menu. Expand the available positions and see how the position\
    \ of the menu changes according to each one. For our project, choose the second\
    \ position in the Inside Sheet group. The menu will move under the header.\n\n\
    If you want to have some space between the menu and the header, use the Margin\
    \ option. The Length option lets you set the menu's width to be equal to the header\
    \ or as wide as the whole screen.\n\nOur next step is the alignment of menu items\
    \ to the left. It's a little bit tricky because the correct option is located\
    \ not inside the Menu Area group, but in Item. (I must admit it's logical, since\
    \ you don't align the menu area but the menu items. On the other hand you can't\
    \ align a single item, but all of them at once. Anyway, it took me some time to\
    \ find this option when I started my adventure with Artisteer.) To change the\
    \ alignment of the menu, do the following:\n\n- 1. Click on the Item button.\n\
    - 2. On the list, find the Layout group and expand the Align option by moving\
    \ the mouse pointer over it.\n- 3. From the available options choose the icon\
    \ that represents alignment to the left:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_60_0.png)\n\
    \nIf you want to quickly change the look of the whole menu, use one of the options\
    \ available in the Menu Styles list. Each one of the options listed there changes\
    \ the look of the whole menu, including all of its elements. If you want to define\
    \ each menu element separately, you should use the options available in the Menu\
    \ and Submenu groups.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_60_1.png)\n\n\
    The Menu group contains options to modify the top level of the menu. The group\
    \ is divided into four main options, each of which has its own, more detailed\
    \ properties.\n\n### Menu Area\n\nMenu Area is a container (rectangular area)\
    \ in which the menu is displayed. It doesn't define the look of the menu items.\
    \ The items are located inside the menu area. In other words, the menu area is\
    \ just the menu bar.\n\n### Item\n\nWith the help of this option you can define\
    \ the look of the top-level items in the menu.\n\n### Coloring\n\nThis option\
    \ lets you set up the style in which the active item is marked.\n"
  mdcn: "\n标题和标语的编辑方式与编辑页面中其余文本的方式相同（还记得我们如何编辑联系信息块吗？）。要编辑标语和标题，请执行以下步骤：\n\n- 1. 双击标题\
    \ **输入站点标题**。\n- 2. 使用键盘删除现有文本并输入：\n  `Stunning Web Design.`\n- 3. 点击除页眉以外的任何位置以应用更改。\n\
    \n标题在点击其他位置时会处于非激活状态。如果单击一次，周围会出现细腻的边框，并且您可以自由移动和旋转文本。请注意，标题无法移出页眉。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_55_0.png)\n\
    \n> 之前移动和旋转对象的技术不仅可以应用于标题，还可以应用于标语和形状。\n\n现在我们将为页眉添加标语：\n\n- 1. 在功能区上单击 **标语**\
    \ 按钮。页眉区域会出现新的文本 **输入站点标语**。\n- 2. 删除原始文本并以修改标题相同的方式将其替换为 `We design your needs`。\n\
    - 3. 将标语放置在标题下方。\n\n请注意，在编辑标题和标语时，功能区不会自动切换到 **编辑** 选项卡，即使手动切换，所有位于 **编辑** 选项卡上的选项也不可用。这是否意味着您无法影响这些元素的外观？当然不是！如果您想更改标题或标语的外观，您必须使用位于功能区\
    \ **页眉** 选项卡上 **编辑形状** 组中的 **文本** 按钮。只有在选择标题或标语时才会显示该选项组。尝试所有可用选项，使这两个元素完全符合您的期望。\n\
    \n## 图片\n\n除了标题和标语，您还可以向页眉中插入图像。现在我们将向页眉中插入一张图片：\n\n- 1. 单击 **图像** 按钮的下部——箭头。该按钮由两个元素组成。单击上部会触发\
    \ **从文件...** 选项，而单击底部箭头会展开完整的选项列表。\n- 2. 在列表中找到 **动物** 组。\n- 3. 选择两只彩色鹦鹉的图片。\n\
    \n您可以使用鼠标自由移动和调整插入图片的大小（调整大小时，Artisteer 程序会保持图片的宽高比）。请注意，在选择图片时，功能区上会显示一个新的选项组，**编辑形状**。它位于我们编辑标题和标语时找到的\
    \ **编辑图像** 组的位置。此组包含可用于对齐图片、将其转换为灰度或添加发光效果的选项。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_56_0.png)\n\
    \n> 您可以在页眉中放置任意数量的图片。\n\n## 形状\n\n**形状** 是您可以插入到页眉中的图形对象（以几何图形的形式）。您也可以像处理标题和标语一样移动和旋转形状，并且可以像处理图片一样调整其大小（甚至更好，因为您可以有或没有保持宽高比地调整形状大小）。您还可以通过双击形状并在其中启用文本光标来在形状内输入文本。形状的背景可以是纯色、渐变或纹理。\n\
    \n每个形状可以有几种预定义形式之一。可用形式包含简单的几何图形以及一些更高级的形状。可用形式的列表在单击功能区上的 **形状** 按钮后显示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_57_0.png)\n\
    \n此列表上的最后一个选项（形式）会展开另一个列表，其中包含更高级的形式：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_57_1.png)\n\
    \n使用形状非常方便。它们在与图像结合使用时尤其有用：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_57_2.png)\n\
    \n形状（左侧，带电话号码）与图像组合的示例\n\n形状提供的最有趣功能之一是使用蒙版的能力。\n\n## 排序形状和图片\n\n蒙版是形状内的透明区域。由于形状始终显示在图像之上，将带有蒙版的形状移过图像会使图像通过形状可见。仅揭开图像的一部分的可能性使您能够实现有趣的效果，如以下屏幕截图所示：\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_58_0.png)\n\n如果您在页眉中使用许多图片和形状，迟早会遇到需要决定哪一个在上、哪一个被覆盖的问题。在\
    \ Artisteer 中，您可以通过右键单击形状/图像时出现的上下文菜单中选择 发送到后方 或 置于前方 选项来设置这些对象的顺序：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_58_1.png)\n\
    \n> 形状和图像的顺序应分别考虑。您可以将一张图片显示在另一张图片之上/之下，或将一个形状显示在另一个形状之上/之下。但您不能将图片显示在任何形状之上。形状始终显示在图片之上。\n\
    \n## Flash\n\n如果您愿意，可以向页眉添加其中一个可用的 Flash 效果。为此，单击 Flash 按钮（它位于功能区的右侧，位于页眉选项卡上）并从列表中选择其中一个效果（我选择了特殊组中的第二个效果）。您还可以从光盘插入自己的\
    \ Flash 电影（swf 格式）。\n\nArtisteer 原生提供的 Flash 效果的特征在于它们不会替换页眉的内容，而是在其上显示相当精致的附加效果。\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_59_0.png)\n\n> 尽管向页眉添加 Flash 可以使其看起来更具吸引力，但您应该记住，Flash\
    \ 在 iOS 设备（如 iPad 或 iPhone）上不受原生支持。如果您预计访客会使用其中一种设备浏览您的网站，使用 Flash 并不是最佳选择。\n\n\
    ## 菜单\n\n接下来我们要设计的元素是我们的菜单。我们将设置它们的外观，并决定它们应以哪些页面作为其项目显示。\n\n### 水平菜单\n\nArtisteer\
    \ 用于设计水平菜单的所有选项都位于功能区的菜单选项卡上。单击它。\n\n目前我们的水平菜单位于页眉内部并右对齐。由于此位置现在被图像占据，菜单并不清晰可见。我们要做的第一件事是为菜单找到更好的位置。我们将把它放在页眉下方并左对齐。\n\
    \n垂直菜单的位置由位置选项决定，该选项位于建议菜单旁边，从左侧数起的第二个图标。展开可用位置，查看菜单位置如何根据每个位置而变化。对于我们的项目，请在内部工作表组中选择第二个位置。菜单将移至页眉下方。\n\
    \n如果您希望菜单和页眉之间有一些空间，请使用边距选项。长度选项可让您将菜单宽度设置为等于页眉或与整个屏幕一样宽。\n\n我们下一步是对菜单项进行左对齐。这有点棘手，因为正确的选项不在菜单区域组内，而在项目中。（我必须承认这是合乎逻辑的，因为您不对齐菜单区域而是对齐菜单项。另一方面，您不能对齐单个项目，只能同时对齐所有项目。无论如何，当我开始使用\
    \ Artisteer 的冒险时，找到此选项花了我一些时间。）要更改菜单的对齐方式，请执行以下操作：\n\n- 1. 单击项目按钮。\n- 2. 在列表中找到布局组并通过将鼠标指针移过它来展开对齐选项。\n\
    - 3. 从可用选项中选择代表左对齐的图标：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_60_0.png)\n\
    \n如果您想快速更改整个菜单的外观，请使用菜单样式列表中可用的其中一个选项。列出的每个选项都会更改整个菜单的外观，包括其所有元素。如果您想分别定义每个菜单元素，则应使用菜单和子菜单组中可用的选项。\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_60_1.png)\n\n菜单组包含修改菜单顶层的选项。该组分为四个主要选项，每个选项都有自己的更详细属性。\n\
    \n### 菜单区域\n\n菜单区域是菜单显示的容器（矩形区域）。它不定义菜单项的外观。项目位于菜单区域内。换句话说，菜单区域只是菜单栏。\n\n### 项目\n\
    \n借助此选项，您可以定义菜单中顶级项目的外观。\n\n### 着色\n\n此选项可让您设置活动项目标记的样式。\n"
