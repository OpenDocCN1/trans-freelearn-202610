  - "[PAGE 139]\n\n8. Knowing this, we can write some additional definitions and make\
    \ our block look a little more different. We will set up the header's color as\
    \ green, display content text in italics style, change its font style, and add\
    \ a border to the picture:\n\n```\n/*** My Classes ***/\n.clearfix_SpecialModule\n\
    {\n    border: 1pt solid red;\n    background-color: #FFFF99;\n}\n\n.clearfix_SpecialModule\
    \ .art-blockheader h3\n{\n    color: green;\n}\n\n.custom_SpecialModule p\n{\n\
    \    font-family: \"Tahoma\";\n    font-style: italic;\n}\n\n.clearfix_SpecialModule\
    \ .custom_SpecialModule img\n{\n    border: 1px solid #000000;\n}\n```\n\nOK,\
    \ we have achieved our goal and made our block look different. But the best advantage\
    \ of this technique is that after the styles are defined, you can use them for\
    \ any module, without additional work. To illustrate this, we will remove the\
    \ styles from our **Second Block** and apply them to the login box:\n\n+   1.\
    \ Edit the **Second Block** module in the administration panel and clear the **Module\
    \ Class Suffix** field. **Second Block** will look again exactly like **First\
    \ Block**.\n+   2. Create the **Login** module and place it under **Second Block**\
    \ in the right-hand column. Display the module (**position-7**).\n+   3. Edit\
    \ preferences of your **Login** module and type `_SpecialModule` (that's our suffix)\
    \ in the **Module Class Suffix** field.\n+   4. Save the changes and refresh the\
    \ site. You will notice that the **Login** module has adopted the styles that\
    \ we defined previously."
