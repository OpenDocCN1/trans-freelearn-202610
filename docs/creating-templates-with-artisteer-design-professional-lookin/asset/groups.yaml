  - '[PAGE 108]


    # Template Areas


    Artisteer-generated Joomla! templates contain the following Areas:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_108_0.png)


    Source: www.artisteer.com


    If you look closely at the figure, you will see that every area has two names.
    The first name is associated with the area''s destination, while the second name
    is given in brackets and is built on the position-number pattern (that is, position-30).
    The first convention was a standard in Joomla! 1.5 (which is still a very popular
    release), the second was introduced with version 1.6. Because Artisteer exports
    templates for various versions (1.5 or 2.5-3.0), you can choose the target version
    of Joomla! and the name convention for template areas while exporting the template.'
  - '[PAGE 109]


    # Exporting a Joomla! template


    Exporting of CMS template goes very similar to exporting static page templates
    that we did in the previous chapter.


    The first thing to do is to choose a target platform—in this case Joomla! To do
    this, click on the arrow beside the Export button located in the Quick Access
    Toolbar of the Ribbon (you can also choose File | Export | Joomla Template from
    the menu).


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_109_0.png)


    The Export window will appear as follows:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_109_1.png)


    Set the following fields:


    +   - **Template: Joomla Template** (target platform for template)

    +   - **Version: 2.5** (target Joomla! version)

    +   - **Positions: position-1, p...** (Areas'' naming convention. We chose the
    newer one, default for Joomla! 1.6+)

    +   - **FileName: MyJoomlaTemplate** (template filename)

    +   - **Path: C:\Users\Jakub\Desktop** (destination path of a created file. In
    this case, my desktop)'
  - '[PAGE 110]


    There are three important options under **Path:** that you can check:


    +   - **ZIP archive**

    +   - **Include ARTX Project**

    +   - **Include Content**


    Checking the first one, **ZIP archive**, causes the generated files to be automatically
    compressed into a ZIP archive. You definitely should check this option, because
    a ZIP archive is the correct format supported by Joomla! for installing new templates.
    Such templates can be installed directly from the Joomla! administrative panel.


    > > You should always check the **ZIP archive** option when exporting for Joomla!.


    Checking the option **Include ARTX Project** causes the native Artisteer project
    file (`.artx`) to be added to exported files. This has no influence on installing
    or working with the template, and the choice is up to you.


    The last option (**Include Content**), introduced in Artisteer 4.0, allows you
    to export all the content—the pages, text, menu, images, and footer—you have entered
    in Artisteer along with the template. If your job is to build the entire website
    and you have entered the final content in Artisteer, checking this option may
    be a good idea (thanks to this, you won''t have to reenter it once again, this
    time in Joomla!). If your job is just to create the template, you probably won''t
    check this option (although, providing the template with an example content, to
    show the end user the potential of your template, may be a good idea).


    # Installing a Joomla! template


    Installation of an Artisteer-generated template is done in exactly the same way
    as installation of any other template. After logging in to administrative panel,
    do the following:


    +   1. Navigate to **Extensions | Extension Manager** in the menu.

    +   2. In the **Upload Package File** field, click on the **Browse** button.

    +   3. In the open dialog box, point to your template file.

    +   4. Click on **Upload & Install**.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_110_0.png)


    After pointing to your template file, click Upload & Install to install the template'
  - '[PAGE 111]


    The template will be sent from your local computer to the server (it can take
    some time, according to the quality of your Internet connection), and will be
    installed. At the end of this operation, the confirmation text **Installing template
    was successful** will be shown.


    But, when you refresh your site, you will see no changes. Our template is installed,
    but is not set to be displayed (you can install as many templates as you wish
    in Joomla!; you may even set up which template should be used to display which
    page).


    Our next step will be to activate our template.


    +   5. To set our template as default:

    +      - From the menu, navigate to **Extensions | Template Manager**. You will
    be redirected to the **Template Manager: Styles** screen.

    +      - Find your template on the list and click on the corresponding star on
    the right (in the **Default** column). The icon (star) will fill itself, which
    means that from this moment our template is the default one.

    +   6. Refresh the page. You will see that the site is displayed with the use
    of our template, although some key elements, like menu, aren''t displayed. Don''t
    worry, we will fix this problem soon!


    # Setting up the template


    It''s time to make our template look like the one we designed in Artisteer.


    # Title and Slogan


    The first elements missing that we are going to display are the Title and Slogan
    in the header. The text that you have entered for the Title and Slogan in Artisteer
    are not exported with the template. What is exported is the style (look) of these
    text, but you have to enter them in Joomla! once again. Let''s go back to the
    Joomla! Administration Panel and perform the following steps:


    +   1. From menu, navigate to **Extensions | Template Manager**. We will go back
    to the **Template Manager: Styles** screen.

    +   2. Click on your template in the Style column area. You will go into the **Template
    Manager: Edit Style** screen.

    +   3. On the right-hand side, you will see the **Basic Options** area, with the
    fields **Headline** and **Slogan**. Enter the appropriate text in them.

    +   4. Click on the **Save** button on the toolbar to save the changes.'
  - '[PAGE 112]


    After refreshing the page, you will see the Title and Slogan being displayed.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_112_0.png)


    Entering text for Headline and Slogan


    # Horizontal menu


    The creation of a horizontal menu for an Artisteer-generated template looks the
    same as creation of a horizontal menu for any other template in Joomla! The only
    thing you must remember is to place it in the position-1 (user3) area.


    > If you place horizontal menu in another area, it will work, but it won''t look
    as designed. To make them look as in Artisteer, you have to place it in the position-1
    (user3) area.


    # Vertical menu


    The vertical menu is usually placed in the left or right column. The creation
    of the vertical menu involves some more steps than the horizontal menu, because
    you have to define a suffix module for it.


    To display the vertical menu correctly, including the entire look designed in
    Artisteer, perform the following steps:


    +   1. Create a new vertical menu module.

    +   2. Place the menu in the target area (usually left or right column).

    +   3. Edit module settings, and in the Module Manager screen expand the Advanced
    Options area.

    +   4. In the Module Class Suffix field, enter `art-vmenu`.

    +   5. Save the changes.'
  - '[PAGE 113]


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_113_0.png)


    To display the vertical menu correctly, you have to set Module Class Suffix as
    art-vmenu


    # Footer modification


    The last thing to modify is the footer of our site. In Artisteer-generated templates,
    you can achieve this by modifying position-27 (copyright) area. All we need to
    do is create a new module of the Custom HTML kind, and place it in this area.
    Our module will become the new site footer. Let''s perform the following steps:


    +   1. Create a new Custom HTML module and give it the Title: Footer.

    +   2. Disable displaying module title.

    +   3. Put it in position-27 (copyrights).

    +   4. Enter the text you want to have in the footer.

    +   5. Save the changes and enable the new module.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_113_1.png)


    Footer module settings


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_113_2.png)


    Example text in the footer—of course, you should put your data here


    After page refresh, you will see that our site has the new footer, which we have
    already designed.'
  md: "\n## Template Areas\n\nArtisteer-generated Joomla! templates contain the following\
    \ Areas:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_108_0.png)\n\nSource: www.artisteer.com\n\
    \nIf you look closely at the figure, you will see that every area has two names.\
    \ The first name is associated with the area's destination, while the second name\
    \ is given in brackets and is built on the position-number pattern (that is, position-30).\
    \ The first convention was a standard in Joomla! 1.5 (which is still a very popular\
    \ release), the second was introduced with version 1.6. Because Artisteer exports\
    \ templates for various versions (1.5 or 2.5-3.0), you can choose the target version\
    \ of Joomla! and the name convention for template areas while exporting the template.\n\
    \n## Exporting a Joomla! template\n\nExporting of CMS template goes very similar\
    \ to exporting static page templates that we did in the previous chapter.\n\n\
    The first thing to do is to choose a target platform—in this case Joomla! To do\
    \ this, click on the arrow beside the Export button located in the Quick Access\
    \ Toolbar of the Ribbon (you can also choose File | Export | Joomla Template from\
    \ the menu).\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_109_0.png)\n\nThe Export\
    \ window will appear as follows:\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_109_1.png)\n\
    \nSet the following fields:\n\n- **Template: Joomla Template** (target platform\
    \ for template)\n- **Version: 2.5** (target Joomla! version)\n- **Positions: position-1,\
    \ p...** (Areas' naming convention. We chose the newer one, default for Joomla!\
    \ 1.6+)\n- **FileName: MyJoomlaTemplate** (template filename)\n- **Path: C:\\\
    Users\\Jakub\\Desktop** (destination path of a created file. In this case, my\
    \ desktop)\n\nThere are three important options under **Path:** that you can check:\n\
    \n- **ZIP archive**\n- **Include ARTX Project**\n- **Include Content**\n\nChecking\
    \ the first one, **ZIP archive**, causes the generated files to be automatically\
    \ compressed into a ZIP archive. You definitely should check this option, because\
    \ a ZIP archive is the correct format supported by Joomla! for installing new\
    \ templates. Such templates can be installed directly from the Joomla! administrative\
    \ panel.\n\n> You should always check the **ZIP archive** option when exporting\
    \ for Joomla!.\n\nChecking the option **Include ARTX Project** causes the native\
    \ Artisteer project file (`.artx`) to be added to exported files. This has no\
    \ influence on installing or working with the template, and the choice is up to\
    \ you.\n\nThe last option (**Include Content**), introduced in Artisteer 4.0,\
    \ allows you to export all the content—the pages, text, menu, images, and footer—you\
    \ have entered in Artisteer along with the template. If your job is to build the\
    \ entire website and you have entered the final content in Artisteer, checking\
    \ this option may be a good idea (thanks to this, you won't have to reenter it\
    \ once again, this time in Joomla!). If your job is just to create the template,\
    \ you probably won't check this option (although, providing the template with\
    \ an example content, to show the end user the potential of your template, may\
    \ be a good idea).\n\n## Installing a Joomla! template\n\nInstallation of an Artisteer-generated\
    \ template is done in exactly the same way as installation of any other template.\
    \ After logging in to administrative panel, do the following:\n\n1. Navigate to\
    \ **Extensions | Extension Manager** in the menu.\n2. In the **Upload Package\
    \ File** field, click on the **Browse** button.\n3. In the open dialog box, point\
    \ to your template file.\n4. Click on **Upload & Install**.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_110_0.png)\n\
    \nAfter pointing to your template file, click Upload & Install to install the\
    \ template\n\nThe template will be sent from your local computer to the server\
    \ (it can take some time, according to the quality of your Internet connection),\
    \ and will be installed. At the end of this operation, the confirmation text **Installing\
    \ template was successful** will be shown.\n\nBut, when you refresh your site,\
    \ you will see no changes. Our template is installed, but is not set to be displayed\
    \ (you can install as many templates as you wish in Joomla!; you may even set\
    \ up which template should be used to display which page).\n\nOur next step will\
    \ be to activate our template.\n\n5. To set our template as default:\n   - From\
    \ the menu, navigate to **Extensions | Template Manager**. You will be redirected\
    \ to the **Template Manager: Styles** screen.\n   - Find your template on the\
    \ list and click on the corresponding star on the right (in the **Default** column).\
    \ The icon (star) will fill itself, which means that from this moment our template\
    \ is the default one.\n6. Refresh the page. You will see that the site is displayed\
    \ with the use of our template, although some key elements, like menu, aren't\
    \ displayed. Don't worry, we will fix this problem soon!\n\n## Setting up the\
    \ template\n\nIt's time to make our template look like the one we designed in\
    \ Artisteer.\n\n### Title and Slogan\n\nThe first elements missing that we are\
    \ going to display are the Title and Slogan in the header. The text that you have\
    \ entered for the Title and Slogan in Artisteer are not exported with the template.\
    \ What is exported is the style (look) of these text, but you have to enter them\
    \ in Joomla! once again. Let's go back to the Joomla! Administration Panel and\
    \ perform the following steps:\n\n1. From menu, navigate to **Extensions | Template\
    \ Manager**. We will go back to the **Template Manager: Styles** screen.\n2. Click\
    \ on your template in the Style column area. You will go into the **Template Manager:\
    \ Edit Style** screen.\n3. On the right-hand side, you will see the **Basic Options**\
    \ area, with the fields **Headline** and **Slogan**. Enter the appropriate text\
    \ in them.\n4. Click on the **Save** button on the toolbar to save the changes.\n\
    \nAfter refreshing the page, you will see the Title and Slogan being displayed.\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_112_0.png)\n\nEntering text for Headline\
    \ and Slogan\n\n### Horizontal menu\n\nThe creation of a horizontal menu for an\
    \ Artisteer-generated template looks the same as creation of a horizontal menu\
    \ for any other template in Joomla! The only thing you must remember is to place\
    \ it in the position-1 (user3) area.\n\n> If you place horizontal menu in another\
    \ area, it will work, but it won't look as designed. To make them look as in Artisteer,\
    \ you have to place it in the position-1 (user3) area.\n\n### Vertical menu\n\n\
    The vertical menu is usually placed in the left or right column. The creation\
    \ of the vertical menu involves some more steps than the horizontal menu, because\
    \ you have to define a suffix module for it.\n\nTo display the vertical menu correctly,\
    \ including the entire look designed in Artisteer, perform the following steps:\n\
    \n1. Create a new vertical menu module.\n2. Place the menu in the target area\
    \ (usually left or right column).\n3. Edit module settings, and in the Module\
    \ Manager screen expand the Advanced Options area.\n4. In the Module Class Suffix\
    \ field, enter `art-vmenu`.\n5. Save the changes.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_113_0.png)\n\
    \nTo display the vertical menu correctly, you have to set Module Class Suffix\
    \ as art-vmenu\n\n### Footer modification\n\nThe last thing to modify is the footer\
    \ of our site. In Artisteer-generated templates, you can achieve this by modifying\
    \ position-27 (copyright) area. All we need to do is create a new module of the\
    \ Custom HTML kind, and place it in this area. Our module will become the new\
    \ site footer. Let's perform the following steps:\n\n1. Create a new Custom HTML\
    \ module and give it the Title: Footer.\n2. Disable displaying module title.\n\
    3. Put it in position-27 (copyrights).\n4. Enter the text you want to have in\
    \ the footer.\n5. Save the changes and enable the new module.\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_113_1.png)\n\
    \nFooter module settings\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_113_2.png)\n\
    \nExample text in the footer—of course, you should put your data here\n\nAfter\
    \ page refresh, you will see that our site has the new footer, which we have already\
    \ designed.\n"
  mdcn: "\n## 模板区域\n\nArtisteer 生成的 Joomla! 模板包含以下区域：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_108_0.png)\n\
    \n来源：www.artisteer.com\n\n如果仔细观察该图，您会看到每个区域都有两个名称。第一个名称与区域的目的相关，而第二个名称放在括号中并基于位置-数字模式构建（即\
    \ position-30）。第一种约定是 Joomla! 1.5 的标准（它仍然是一个非常流行的版本），第二种是在 1.6 版本中引入的。由于 Artisteer\
    \ 为各种版本（1.5 或 2.5-3.0）导出模板，因此在导出模板时您可以选择 Joomla! 的目标版本以及模板区域的命名约定。\n\n## 导出 Joomla!\
    \ 模板\n\n导出 CMS 模板的方式与我们在上一章中完成的导出静态页面模板非常相似。\n\n首先要做的是选择目标平台——本例中为 Joomla！为此，请单击功能区快速访问工具栏上导出按钮旁边的箭头（您也可以从菜单中选择\
    \ 文件 | 导出 | Joomla 模板）。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_109_0.png)\n\
    \n导出窗口将如下所示：\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_109_1.png)\n\n设置以下字段：\n\
    \n- **Template: Joomla Template**（模板的目标平台）\n- **Version: 2.5**（目标 Joomla! 版本）\n\
    - **Positions: position-1, p...**（区域命名约定。我们选择了较新的一个，是 Joomla! 1.6+ 的默认值）\n- **FileName:\
    \ MyJoomlaTemplate**（模板文件名）\n- **Path: C:\\Users\\Jakub\\Desktop**（创建文件的目标路径。在本例中为我的桌面）\n\
    \n**Path:** 下有三个重要的选项可以勾选：\n\n- **ZIP archive**\n- **Include ARTX Project**\n\
    - **Include Content**\n\n勾选第一个选项 **ZIP archive** 会使生成的文件自动压缩为 ZIP 归档。您绝对应该勾选此选项，因为\
    \ ZIP 归档是 Joomla! 用于安装新模板所支持的正确格式。此类模板可以直接从 Joomla! 管理面板安装。\n\n> 导出 Joomla! 时应始终勾选\
    \ **ZIP archive** 选项。\n\n勾选 **Include ARTX Project** 选项会将原生 Artisteer 项目文件（`.artx`）添加到导出的文件中。这对安装或使用模板没有影响，选择由您决定。\n\
    \n最后一个选项（**Include Content**）是在 Artisteer 4.0 中引入的，允许您将 Artisteer 中输入的所有内容——页面、文本、菜单、图像和页脚——与模板一起导出。如果您的工作是构建整个网站，并且已在\
    \ Artisteer 中输入了最终内容，勾选此选项可能是一个好主意（这样您就无需再次在 Joomla! 中重新输入）。如果您的工作只是创建模板，您可能不会勾选此选项（尽管，提供示例内容以展示模板的潜力给最终用户，可能也是一个好主意）。\n\
    \n## 安装 Joomla! 模板\n\nArtisteer 生成的模板的安装方式与任何其他模板完全相同。登录管理面板后，请执行以下操作：\n\n1. 在菜单中导航至\
    \ **Extensions | Extension Manager**。\n2. 在 **Upload Package File** 字段中，单击 **Browse**\
    \ 按钮。\n3. 在打开的对话框中，指向您的模板文件。\n4. 单击 **Upload & Install**。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_110_0.png)\n\
    \n指向模板文件后，单击 Upload & Install 以安装模板\n\n模板将从您的本地计算机发送到服务器（根据您的互联网连接质量可能需要一些时间），并将被安装。此操作结束时，将显示确认文本\
    \ **Installing template was successful**。\n\n但是，刷新网站后您将看不到任何变化。我们的模板已安装，但未设置为显示（您可以在\
    \ Joomla! 中安装任意多个模板；甚至可以设置哪个模板用于显示哪个页面）。\n\n我们的下一步将是激活我们的模板。\n\n5. 将我们的模板设为默认：\n\
    \   - 从菜单导航至 **Extensions | Template Manager**。您将被重定向到 **Template Manager: Styles**\
    \ 屏幕。\n   - 在列表中找到您的模板并单击右侧对应的星标（在 **Default** 列中）。图标（星标）将被填满，这意味着从此刻起我们的模板是默认模板。\n\
    6. 刷新页面。您将看到网站使用我们的模板显示，尽管一些关键元素，如菜单，未显示。别担心，我们很快会修复这个问题！\n\n## 设置模板\n\n是时候让我们的模板看起来像我们在\
    \ Artisteer 中设计的那样了。\n\n### 标题和标语\n\n我们将要显示的第一个缺失元素是页眉中的标题和标语。您在 Artisteer 中为标题和标语输入的文本不会随模板一起导出。导出的只是这些文本的样式（外观），但您必须在\
    \ Joomla! 中再次输入它们。让我们回到 Joomla! 管理面板并执行以下步骤：\n\n1. 从菜单导航至 **Extensions | Template\
    \ Manager**。我们将返回到 **Template Manager: Styles** 屏幕。\n2. 在 Style 列区域单击您的模板。您将进入\
    \ **Template Manager: Edit Style** 屏幕。\n3. 在右侧，您将看到 **Basic Options** 区域，其中包含\
    \ **Headline** 和 **Slogan** 字段。在其中输入适当的文本。\n4. 单击工具栏上的 **Save** 按钮保存更改。\n\n刷新页面后，您将看到标题和标语正在显示。\n\
    \n![](img/7f889df2ffdb68108cff34d798a2b9a3_112_0.png)\n\n输入 Headline 和 Slogan\
    \ 的文本\n\n### 水平菜单\n\n为 Artisteer 生成的模板创建水平菜单的方式与为 Joomla! 中任何其他模板创建水平菜单的方式相同。您唯一需要记住的是将其放置在\
    \ position-1 (user3) 区域。\n\n> 如果您将水平菜单放置在其他区域，它会工作，但外观不会如设计。要使其看起来像 Artisteer\
    \ 中的那样，您必须将其放置在 position-1 (user3) 区域。\n\n### 垂直菜单\n\n垂直菜单通常放置在左侧或右侧列中。创建垂直菜单比水平菜单涉及更多步骤，因为您必须为其定义模块后缀。\n\
    \n要正确显示垂直菜单，包括 Artisteer 中设计的整体外观，请执行以下步骤：\n\n1. 创建一个新的垂直菜单模块。\n2. 将菜单放置在目标区域（通常为左侧或右侧列）。\n\
    3. 编辑模块设置，并在模块管理器屏幕中展开高级选项区域。\n4. 在 Module Class Suffix 字段中输入 `art-vmenu`。\n5.\
    \ 保存更改。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_113_0.png)\n\n要正确显示垂直菜单，您必须将\
    \ Module Class Suffix 设置为 art-vmenu\n\n### 页脚修改\n\n最后需要修改的是我们网站的页脚。在 Artisteer\
    \ 生成的模板中，您可以通过修改 position-27 (copyright) 区域来实现。我们需要做的就是创建一个新的 Custom HTML 类型的模块，并将其放置在此区域。我们的模块将成为新的网站页脚。让我们执行以下步骤：\n\
    \n1. 创建一个新的 Custom HTML 模块并将其标题设为：Footer。\n2. 禁用模块标题的显示。\n3. 将其放置在 position-27\
    \ (copyrights) 中。\n4. 输入您希望在页脚中显示的文本。\n5. 保存更改并启用新模块。\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_113_1.png)\n\
    \n页脚模块设置\n\n![](img/7f889df2ffdb68108cff34d798a2b9a3_113_2.png)\n\n页脚中的示例文本——当然，您应该在此处放置您的数据\n\
    \n刷新页面后，您将看到我们的网站具有新的页脚，我们已经设计好了。\n"
