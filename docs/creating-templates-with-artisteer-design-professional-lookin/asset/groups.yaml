  - '[PAGE 73]


    We have to remove the current content. We could, of course, click on every row
    and cell and remove the text one by one, but we will make it faster and a little
    tricky. If you change the layout, the content is preserved and automatically adopted
    to the new layout. So, we can use this feature to delete all the content at once.
    Perform the following steps:


    +   1. Click on the **Content Layout** button.

    +   2. From the list, choose the only available option in the **One Column** group.
    The current content layout will be replaced with only one row, which will contain
    all the content.

    +   3. Click anywhere within the content and press *Ctrl + A*. All the content
    will be selected.

    +   4. Press *Delete* to remove the current content.


    Now we can start designing our layout. Because there''s no such layout on the
    **Content Layout** list, we will design it manually. Click on the **Layout...**
    button to display the **Layout Editor** window:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_73_0.png)'
  - '[PAGE 74]


    In the previous window you can almost freely design your own layout. The frames
    on the left side represent the rows and cells. The first button to the right (in
    the shape of an inverted triangle) allows you to change the style of the row (the
    number and proportion of the cells) by displaying a list with the available options.
    The second button (the red minus sign) removes the whole row.


    > You can delete the whole row, with all its columns, but you can''t delete a
    single cell.


    We are going to modify the layout from scratch. Do the following:


    +   1. Delete all the rows using the buttons with the red minus sign. Actually
    we could just modify the existing rows, but we want to design it from scratch.

    +   2. Add a new row by clicking on the button with the green plus sign, and from
    the list of the available row variations choose the first option—the row that
    is not divided into more cells. We want to have the article with photo in this
    first row.

    +   3. Add a second row to the content layout. This one will contain our Look
    at our latest projects... statement. This is also a single-cell row.

    +   4. Add the third and last row. This row will contain our three thumbnail pictures.
    Because they will be put as separate elements (and not inserted into the article),
    we need to have three cells in this row. Choose and click on the correct option.

    +   5. Click on OK to close this window. Apparently nothing has happened. But
    if you move your mouse cursor over the content area, you will see the borders
    appearing on the new areas. Thus, Artisteer has indeed modified the layout.


    # Writing articles


    Now that we have defined the areas in our content layout, we can start filling
    our site with content.'
  - '[PAGE 75]


    We will first change the title. Right-click on the **Home** page on the left panel,
    and from the context menu choose **Show Article Title**:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_75_0.png)


    The title will be shown above the first row in the content area. We haven''t edited
    it yet so it still contains the text **Page 1**. Click on the title and change
    it to `Welcome to my site!`.


    Now we are going to write our article. It wouldn''t be very useful to write all
    the articles in the book. Instead of this, we will copy and paste some dummy text.


    > This is a common practice that when designing a layout, you fill it with sample
    text. Without this the end customer won''t know how the template will look as
    a live website. It also allows you to design and present the typography. There
    is a common standard for a sample text—lorem ipsum.


    To get dummy text just go to http://www.lipsum.com and find the **Generate Lorem
    Ipsum** button. Change the number of generated paragraphs to three and click on
    it. Then copy the generated text to the clipboard and return to Artisteer. In
    Artisteer, click on the first row in your content area and press Ctrl + V to paste
    the text. From the **Paragraph** group on the ribbon click on the icon that will
    justify the text:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_75_1.png)


    You can type the text just like in any text editor. If you would like to change
    the font or start a list, all the tools you need are located in the **Style and
    Font** and **Paragraph** groups.'
  - '[PAGE 76]


    While writing the content you should remember one particular rule: if you need
    to change the font (that is, you want to write a header), you should use the styles
    instead of manipulating the font property directly. Thanks to this, your content
    will look consistent throughout the site. Remember that all the typography, including
    six levels of headers, links, and button texts is defined with your layout. On
    a regular basis, there''s hardly ever a need to use something other than the defined
    styles.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_76_0.png)


    # Inserting images


    We have our first row filled with text, so now it''s time to enrich the article
    with a picture. We want the picture be placed at the beginning of the article.
    To achieve this, do the following:


    +   1. Click on the beginning of the article. The text cursor will blink right
    before the first word in the article.

    +   2. Click on the triangle under the Image button (it''s in the Insert group
    on the ribbon) and from the available options choose Clip Art. Another list presenting
    thumbnails of the pictures provided by Artisteer will expand.

    +   3. Choose the fourth image in the second row.


    The image is inserted, but not exactly as we expected. Firstly, it''s far too
    large. Secondly, we would like the text to flow around the picture, and what we
    have is the picture with an empty space on the right!'
  - '[PAGE 77]


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_77_0.png)


    Don''t worry! We are going to correct this. Right-click on the image and from
    the context menu choose **Image Options....** The **Image Options** window will
    appear. This window has three tabs on the left: **Image**, **Layout**, and **Link**.
    Make sure that the first tab is selected. Do the following:


    +   1. Set the width of the picture to 150 px. The values in the **Height** and
    **Scale** fields will change automatically.

    +   2. In the **Alt Text** field, type `My photo` (remember that we are designing
    your site, so you can exchange this picture with your real photo).

    +   3. Click on the **Layout** tab on the left.

    +   4. From the **Position** combobox choose left. Also, set the bottom margin
    to 0 px and the border to 2 px. Click on **OK** to close the window.


    After the changes your site should look like this:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_77_1.png)'
  - '[PAGE 78]


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_78_0.png)


    > You should never leave the **Alt Text** field empty. **Alt Text** is the text
    that will be displayed when it''s impossible to display the picture. For example,
    people with disabilities, who use a screen reader, will get only the alt text.
    Putting an image without any alt text may also cause problems with site validation.


    There is another important feature that we have to discuss when talking about
    inserting images. By default, when an image is clicked, the bigger, overlaid version
    of this image is displayed on top of your page. This effect is called **Lightbox
    Style** (the name comes from the famous JavaScript library that had introduced
    this effect). It''s perfect for creating image galleries, but sometimes you don''t
    want the picture to behave like that.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_78_1.png)


    To check whether the picture should have the Lightbox effect or not, you have
    to change the **Preview** settings in the **Image Options** window. It is the
    last option in the **Image** tab and contains two options: **Yes** and **No**.
    Set this value to **No** to turn off this effect for the image.


    To finish our first page, we have to complete the content in the rest of our cells.


    Click on the row below, and from the **Style and Font** group choose **Header
    2** as the style (we want this text to be larger than the default text in the
    paragraphs). Type `Look at my latest project...`, click on the first cell in the
    third row, and click on the **Image** button. An **Open** dialog will appear.
    Select the file with a screenshot of any other project that you did in Artisteer
    (if you didn''t, you can select any other image from your disk). Similarly, insert
    images into the last two cells. This time we won''t turn off the Lightbox effect,
    because it''s good that the visitor can click and enlarge these thumbnails.'
  md: '

    We have to remove the current content. We could, of course, click on every row
    and cell and remove the text one by one, but we will make it faster and a little
    tricky. If you change the layout, the content is preserved and automatically adopted
    to the new layout. So, we can use this feature to delete all the content at once.
    Perform the following steps:


    - 1. Click on the **Content Layout** button.

    - 2. From the list, choose the only available option in the **One Column** group.
    The current content layout will be replaced with only one row, which will contain
    all the content.

    - 3. Click anywhere within the content and press *Ctrl + A*. All the content will
    be selected.

    - 4. Press *Delete* to remove the current content.


    Now we can start designing our layout. Because there''s no such layout on the
    **Content Layout** list, we will design it manually. Click on the **Layout...**
    button to display the **Layout Editor** window:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_73_0.png)


    In the previous window you can almost freely design your own layout. The frames
    on the left side represent the rows and cells. The first button to the right (in
    the shape of an inverted triangle) allows you to change the style of the row (the
    number and proportion of the cells) by displaying a list with the available options.
    The second button (the red minus sign) removes the whole row.


    > You can delete the whole row, with all its columns, but you can''t delete a
    single cell.


    We are going to modify the layout from scratch. Do the following:


    - 1. Delete all the rows using the buttons with the red minus sign. Actually we
    could just modify the existing rows, but we want to design it from scratch.

    - 2. Add a new row by clicking on the button with the green plus sign, and from
    the list of the available row variations choose the first option—the row that
    is not divided into more cells. We want to have the article with photo in this
    first row.

    - 3. Add a second row to the content layout. This one will contain our Look at
    our latest projects... statement. This is also a single-cell row.

    - 4. Add the third and last row. This row will contain our three thumbnail pictures.
    Because they will be put as separate elements (and not inserted into the article),
    we need to have three cells in this row. Choose and click on the correct option.

    - 5. Click on OK to close this window. Apparently nothing has happened. But if
    you move your mouse cursor over the content area, you will see the borders appearing
    on the new areas. Thus, Artisteer has indeed modified the layout.


    ## Writing articles


    Now that we have defined the areas in our content layout, we can start filling
    our site with content.


    We will first change the title. Right-click on the **Home** page on the left panel,
    and from the context menu choose **Show Article Title**:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_75_0.png)


    The title will be shown above the first row in the content area. We haven''t edited
    it yet so it still contains the text **Page 1**. Click on the title and change
    it to `Welcome to my site!`.


    Now we are going to write our article. It wouldn''t be very useful to write all
    the articles in the book. Instead of this, we will copy and paste some dummy text.


    > This is a common practice that when designing a layout, you fill it with sample
    text. Without this the end customer won''t know how the template will look as
    a live website. It also allows you to design and present the typography. There
    is a common standard for a sample text—lorem ipsum.


    To get dummy text just go to http://www.lipsum.com and find the **Generate Lorem
    Ipsum** button. Change the number of generated paragraphs to three and click on
    it. Then copy the generated text to the clipboard and return to Artisteer. In
    Artisteer, click on the first row in your content area and press Ctrl + V to paste
    the text. From the **Paragraph** group on the ribbon click on the icon that will
    justify the text:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_75_1.png)


    You can type the text just like in any text editor. If you would like to change
    the font or start a list, all the tools you need are located in the **Style and
    Font** and **Paragraph** groups.


    While writing the content you should remember one particular rule: if you need
    to change the font (that is, you want to write a header), you should use the styles
    instead of manipulating the font property directly. Thanks to this, your content
    will look consistent throughout the site. Remember that all the typography, including
    six levels of headers, links, and button texts is defined with your layout. On
    a regular basis, there''s hardly ever a need to use something other than the defined
    styles.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_76_0.png)


    ## Inserting images


    We have our first row filled with text, so now it''s time to enrich the article
    with a picture. We want the picture be placed at the beginning of the article.
    To achieve this, do the following:


    - 1. Click on the beginning of the article. The text cursor will blink right before
    the first word in the article.

    - 2. Click on the triangle under the Image button (it''s in the Insert group on
    the ribbon) and from the available options choose Clip Art. Another list presenting
    thumbnails of the pictures provided by Artisteer will expand.

    - 3. Choose the fourth image in the second row.


    The image is inserted, but not exactly as we expected. Firstly, it''s far too
    large. Secondly, we would like the text to flow around the picture, and what we
    have is the picture with an empty space on the right!


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_77_0.png)


    Don''t worry! We are going to correct this. Right-click on the image and from
    the context menu choose **Image Options....** The **Image Options** window will
    appear. This window has three tabs on the left: **Image**, **Layout**, and **Link**.
    Make sure that the first tab is selected. Do the following:


    - 1. Set the width of the picture to 150 px. The values in the **Height** and
    **Scale** fields will change automatically.

    - 2. In the **Alt Text** field, type `My photo` (remember that we are designing
    your site, so you can exchange this picture with your real photo).

    - 3. Click on the **Layout** tab on the left.

    - 4. From the **Position** combobox choose left. Also, set the bottom margin to
    0 px and the border to 2 px. Click on **OK** to close the window.


    After the changes your site should look like this:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_77_1.png)


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_78_0.png)


    > You should never leave the **Alt Text** field empty. **Alt Text** is the text
    that will be displayed when it''s impossible to display the picture. For example,
    people with disabilities, who use a screen reader, will get only the alt text.
    Putting an image without any alt text may also cause problems with site validation.


    There is another important feature that we have to discuss when talking about
    inserting images. By default, when an image is clicked, the bigger, overlaid version
    of this image is displayed on top of your page. This effect is called **Lightbox
    Style** (the name comes from the famous JavaScript library that had introduced
    this effect). It''s perfect for creating image galleries, but sometimes you don''t
    want the picture to behave like that.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_78_1.png)


    To check whether the picture should have the Lightbox effect or not, you have
    to change the **Preview** settings in the **Image Options** window. It is the
    last option in the **Image** tab and contains two options: **Yes** and **No**.
    Set this value to **No** to turn off this effect for the image.


    To finish our first page, we have to complete the content in the rest of our cells.


    Click on the row below, and from the **Style and Font** group choose **Header
    2** as the style (we want this text to be larger than the default text in the
    paragraphs). Type `Look at my latest project...`, click on the first cell in the
    third row, and click on the **Image** button. An **Open** dialog will appear.
    Select the file with a screenshot of any other project that you did in Artisteer
    (if you didn''t, you can select any other image from your disk). Similarly, insert
    images into the last two cells. This time we won''t turn off the Lightbox effect,
    because it''s good that the visitor can click and enlarge these thumbnails.

