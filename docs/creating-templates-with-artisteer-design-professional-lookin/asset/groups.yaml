    ![](img/7f889df2ffdb68108cff34d798a2b9a3_67_0.png)


    ## Available styles that define the vertical menu behavior


    We can choose from six kinds of vertical menu behavior:


    - **One Level** is the most basic kind of menu that you can choose. It displays
    only the top-level items. No subitems are displayed at all.

    - The **Expand with Reload** menu shows both items and subitems. The items containing
    subitems expand on a mouse click. After the click, the page is reloaded.

    - The **Expand on Click** menu is very similar to **Expand with Reload** with
    the difference that the items expand without reloading.


    > You may think that **Expand on Click** is better than **Expand with Reload**
    (it looks the same, but without the need of reloading the page). But the most
    important difference is not about reloading. Rather, it is that in **Expand with
    Reload**, the item containing subitems is a link to the page, while in Expand
    on Click it''s only the menu item without any corresponding page. Consider our
    project: we have an **Offer** page that contains three subpages. Set the vertical
    menu as **Expand on Click** and export the page, then open the exported folder
    and click twice on the `index.html` file. The page will open in your system''s
    default browser. Click on the **Offer** item in the vertical menu. The page is
    reloaded and you may see that the **Offer** page is displayed (look at the address
    bar of your browser, where you will see `offer.html` at the end of the address).
    Then go back to Artisteer, change the vertical menu, type Expand on Click, export
    the page, and run again. You will see that when you click on the **Offer** item
    in the vertical menu, the menu expands, but you can''t access the **Offer** page
    at all.


    I don''t mean to tell you that **Expand on Click** is bad. There certainly are
    projects where it will be far better than **Expand with Reload** and vice versa.


    - In the **Expand on Hover** menu, the item containing subitems expands on hover,
    without the need to click. The parent item is still a link to a page.

    - The **Popup on Hover** menu expands on hover, just like a horizontal menu, but
    vertically.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_68_0.png)


    - The **All Open** menu always displays all of its subitems (it is never collapsed).


    We are going to design the look of our menu very quickly using one of the available
    options in **Styles**. Click on the **Styles** button, and from the list choose
    the second option in the second row. We would also like to hide the header of
    this menu. Click on the **Menu Block** button, and from the **Simple** group choose
    the second option. As the menu type, choose **All Open** by clicking on the last
    option from the list on the **Level** button. The last thing we want to change
    is the radius of an item. Click on the **Item** button (in the **Menu** group),
    expand the **Radius** option, and choose **10% of Height**.


    ## Determining the pages displayed in menus


    In both the **Menu** and **Vertical Menu** tabs on the ribbon you can find the
    **Pages** group containing only one button, **Show in Menu**. Clicking on this
    button displays the **Select pages in menu** window in which you can decide which
    pages should be displayed in the menu, and which should not. We want all the pages
    to be displayed in the horizontal menu, and only the **Offer** page (with all
    of its subpages) to be displayed in the vertical menu. Check the appropriate pages.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_69_0.png)


    For vertical menu we want to display only Offer page with its subpages


    Note that you cannot check the subpages without checking their parent page too
    (or more precisely, you can; but if you do that, they won''t be displayed although
    you have checked them). That''s why we have to not only check the Websites, WordPress,
    Joomla!, and DotNetNuke pages, but also their parent page Offer.


    By now, your vertical menu should look like the following screenshot:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_69_1.png)


    We have designed the look and feel of the horizontal and vertical menus and have
    also set up the pages to be displayed in each of them. Our next step will be designing
    the content area.


    ## Content


    Before we start writing our content, we must design the overall layout of our
    content. In Artisteer, the content area can be divided into any number of rows
    and columns. Skilful identification of rows and columns is the key to achieve
    well-designed content.


    The first thing to plan is the look of the site. We are going to design the main
    site with following content:


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_70_0.png)


    At the top of the content we want to have the title. In the large area below it
    we want to have a description about who we are and what we do (remember that we
    are creating a site advertising you as a web designer). We want to enrich the
    text with a photo. Below it we want just a one row of text: `Look at our latest
    projects...` The last area will contain three pictures with a thumbnail of your
    latest projects. If you haven''t done any projects yet, don''t worry! Design something
    quickly using the Auto Suggestion tool and customize it using the information
    you have read up till now. Actually, it will be a good exercise to get some practice
    with the program. If you feel you can''t do that yet, you can just insert any
    pictures from Artisteer''s library here and replace them later.


    In our case, the combination of rows and cells should be similar to the following
    picture (for better clarity, the rows and cells are bordered):


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_71_0.png)


    We need three rows for our content. The first row is for the biggest section of
    text (description), the second is for the short text below it, and the last row
    – divided into three cells – is for inserting three logos.


    You may wonder why we don''t create a row for the page title. It''s because Artisteer
    creates the container for the title automatically. It''s a similar situation to
    that of the vertical menu header. You can hide the page title, but you cannot
    design any page without it. We will learn how to hide the page title a little
    later in this chapter.


    You may wonder why the first photo isn''t placed into a separate cell while the
    next three logos are. It''s because the photo in the first row is not a separate
    element of our content. The first row contains an article, and the photo is a
    part of it.


    Before we can set up the layout for our content, we have to remove the actual
    content that the program put here automatically. And to do that efficiently, we
    have to know the tools that Artisteer offers for creating the content layout.


    All of the tools to design the content layout are located in the **Content** pane
    on the ribbon. Click on it. There are not too many options. But when you click
    anywhere in the content area, the number of tools (displayed in the **Content**
    pane) increases and many new buttons appear. You will see that many new buttons
    appear.


    > Artisteer shows the full range of content-designing tools only when you''re
    editing the content.


    The tools applied to the layout design are located in the **Content** group.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_72_0.png)


    The first button, **Content Layout**, displays a list of the most used content
    layouts. You may think of it as a kind of template that you can assign to your
    page with just one mouse click. Choosing one of the available options will replace
    your current layout with the chosen one, and all of your content will be automatically
    updated to the new structure of rows and cells.


    The second button, **Styling**, lets you style your content. While in the previous
    list you could define the layout, this is the place where you can define how it
    looks. The **Styling** options define various borders and backgrounds for your
    rows and cells.


    > The options displayed in the **Styling** list depend on the layout you chose
    in **Content Layout**.


    The last option in the **Styling** list lets you define the layout for your current
    row and also defines some settings that apply to all pages, such as the border
    of the cells, margins, and radius.

