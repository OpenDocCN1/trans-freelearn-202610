  - '[PAGE 100]


    Does it mean, that every website based on an Artisteer-generated theme has to
    have a three-column layout? No. The dimensions of Areas are dynamic – an Area
    adopts its size to the elements that it contains. The empty Area although exists,
    but its vertical and horizontal size is zero. From the site administrator''s point
    of view, this is a very good solution, because he has the possibility to display
    any element in the side column if he wants, but if he doesn''t, this column will
    remain invisible for the visitor.


    Designing three-column layouts don''t force the user to use all three columns.
    You give him only the possibility to do this. He still has a free choice to use
    only one or two of the available columns.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_100_0.png)


    > By designing a three-column layout, you give the site administrator the possibility
    to insert and display any element in side columns. But if he decides not to use
    these columns at all, they won''t even be visible (its width will be zero).


    # Specific CMS template elements


    There are some elements that are specific for CMS templates. Not every CMS system
    supports all of them. Also, site administrators can decide not to use them, even
    if they are supported. Nevertheless, if you design a platform that supports these
    elements, you should include them in your project.


    # Post header icons


    Post header icons are displayed next to the post header. Artisteer supports the
    **Author**, **Date**, **Edit**, **Email**, **PDF**, and **Print** icons. The last
    position on the list (**Data**) contains its own subelements.


    We will choose the **Print** icon as an example, but the procedure is the same
    for each icon. To set the **Print** icon, do the following:


    +   1. Select a blog page on the **Pages** panel on the left. If you don''t have
    any, create one. Also, create at least one post to be able to observe the inserted
    icon.

    +   2. In the **Content** tab on the ribbon, navigate to **Post Header** | **Icons**
    | **Print**. Enable the **Show Print** option. This enables our template to support
    this icon. After enabling this option, additional options will appear with the
    collection of available icons. Choose the icon you prefer.'
  - '[PAGE 101]


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_101_0.png)


    Setting Print icon


    # Post footer icons


    Post footer icons are displayed under the post. Artisteer supports three kinds
    of these icons, namely Category, Comments, and Tags. The procedure is analogous
    to inserting post header icons, but instead of the Post header button, we use
    Post footer.


    We will style Icons for Comments:


    +   1. Select a blog page on the Pages panel on the left. If you don''t have any,
    create one. Also, create at least one post to be able to observe the inserted
    icon.

    +   2. In the Content tab on the ribbon, navigate to Post Footer | Icons | Comments.
    Enable the Show Comments option. This makes our template to support this icon.
    After enabling this option, additional options will appear with the collection
    of available icons.'
  - '[PAGE 102]


    3. Choose the icon you prefer.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_102_0.png)


    Setting Comments icon


