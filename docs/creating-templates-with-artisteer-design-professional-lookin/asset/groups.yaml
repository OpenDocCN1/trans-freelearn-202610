    ## 关于作者


    **Jakub Sanecki** 是一位经验丰富的网页开发人员和程序员，拥有超过 11 年的经验。他出生于 1977 年的波兰。2001 年，在毕业前夕（他毕业于公司管理专业），他创立了
    Fregata——一家他至今仍在工作的公司，并投身于他真正的热情——信息技术。起初提供与一种流行 ERP 系统相关的服务，公司逐渐发展为提供编程服务和定制软件开发。随着互联网的日益普及，公司专注于
    Web 应用和网站的开发。作为众多 Web 和桌面应用的作者，Jakub 担任独立 IT 顾问和自由职业者，为各种规模的公司实现各种规模和复杂度的项目。他还提供与
    IT 和 Web 技术相关的培训课程，以及在企业环境中使用这些技术的技巧。数年间他曾担任大学教师，教授 Web 和桌面编程。


    Fregata 是 Extensoft 的授权经销商。您可以访问 www.szablonik.net，因为它提供有关此软件工具的支持和额外信息。


    私下里，Jakub 是两个孩子的丈夫和父亲，与家人住在 Sosnowiec（波兰），在业余的片刻时间里弹钢琴或读书。


    ## 致谢


    几乎每本书都以一些文字开始，作者在其中感谢支持他/她并使其完成书籍写作的人。遵循这一美好而得体的传统，我也想感谢那些没有他们这本书就不可能存在的人们。首先，我要感谢我的妻子
    Hania，她在整个过程中一直支持我，宽恕我在写作期间所有的任性，照顾我们的家和儿子，并原谅我花在他们身上的时间减少。


    我要感谢我的父母，他们为我买了第一台电脑，并且始终关心我、信任我，即使我的决定对他们来说似乎有争议。没有他们的接纳和信任，我不可能实现我的热情并通过创办一家小型
    IT 公司谋生。


    我要感谢我的其他家人和朋友们，在我写作期间的耐心和理解，因为我没有时间与他们见面。


    最后但同样重要的是，我要感谢 Packt Publishing 的人们，他们给了我写这本书的机会，并做了出色的工作，花费大量时间和精力修改我的初稿并提供宝贵的建议。没有他们的经验、知识和奉献精神，我不可能完成这个项目。


    ## 关于审阅者


    Mark Conroy 是一位居住在爱尔兰戈尔韦的网页开发人员和公众演讲者。职业上曾是英语教师，他最初为朋友的乐队和当地社区团体设计网站作为爱好。自从他使用
    Adobe Dreamweaver 的谦逊起步以来，他几乎完全转向使用 Drupal 工作，尽可能拥抱开源技术。作为演讲者，他主要介绍数字媒体在有效竞选中的用途。他还在都柏林的
    Drupal for Government 日活动中就使用 Drupal 创建社交网络进行了演讲。Mark 是每月 Galway Drupal Meetup
    的联合组织者。


    作为以 A Design For Life 之名工作的自由职业开发人员——www.adesignforlife.net，Mark 参与了多个大型项目，其中最值得注意的是
    Ireland Reaching Out 网站（www.irelandxo.com）的重新开发，该网站他独自从零开始构建，使用了 Drupal Commons（以及一些额外的贡献
    Drupal 模块）、Artisteer、CSS 和 CiviCRM 的组合。网站上的所有功能均使用对 drupal.org 上现有模块的创新方法完成。他还构建并继续维护政治竞选和联系网站
    contact.ie，该网站已成为爱尔兰联系政治人物的最受欢迎的在线方式。


    这是 Mark 参与的第一本技术书籍。然而，他已出版了一本英语学生教科书，*In Transition: An Anthology of Texts and
    Tasks for Transition Year Students*，正在等待第二本英语教科书的出版，并即将开始第三本的工作。


    Mark 可接受长期和/或短期自由职业工作，尤其是在 Drupal 和竞选技术领域。您可以通过 info@adesignforlife.net 或 info@contact.ie
    联系他。


    ## www.PacktPub.com


