  - '[PAGE 86]


    # Color theme


    We have chosen the color theme for our template, but we didn''t go deeper into
    this topic. This was because we wanted to start with designing quickly, and also
    because we needed to know more about using Artisteer before we could take care
    of this problem.


    Color theme is a set of colors used in a template. Logically it is similar to
    font sets and typography. Typography defines the text used in various template
    elements while a color theme defines their color.


    To modify the color of the theme you can use the three buttons located in the
    Paints group (we are still in the Fonts & Colors tab). These three buttons, in
    the form of rectangles filled with a particular color, let you choose the color
    for paints.


    Paints are the main colors used in a color theme. You may think of them as the
    basis on which the whole color theme is built. Every color theme in Artisteer
    has three paints.


    ![](img/7f889df2ffdb68108cff34d798a2b9a3_86_0.png)


    > There''s no fixed relationship between a particular paint and a template element.
    You cannot say, for example, that changing the second paint will always change
    the color of the background. The distribution of theme colors will change in various
    templates.


    With the last button, having the label Adjust, you can change the brightness and
    saturation of all paints in the color theme. The available options are divided
    into four groups, whose names suggest the changes (Basic, Normal, Contrast, and
    Pastel).


    If you have modified the paints in a color theme and you are happy with the changes,
    you can save it under any name, and use it in your future projects.


    # Footer


    The last thing we need to design is the footer. All the tools that apply to the
    footer are located on the Footer tab—although, you will see that''s not so evident
    in this case. The problem is that many of the things you can define with the tools
    from the Footer tab, you can also achieve using the analogous tools from the Edit
    tab. What''s more, the settings made by the tools from the Edit tab have a higher
    priority than the settings made from the tools located in the Footer tab. For
    example, you can align the footer text to the right using the Align button in
    the Footer tab, and at the same time align the same text to the left, using the
    align icon from the Edit tab. As a result, the text will be aligned to the left.'
