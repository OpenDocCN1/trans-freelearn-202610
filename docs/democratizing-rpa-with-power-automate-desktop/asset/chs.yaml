  \ Platform environment(s) structure and elements\n\n如果任何客户想要使用 Microsoft 云服务，必须创建一个客户租户。在这里，我们会找到\
  \ Azure 中可用的所有资源，也包括所谓的 环境。 这个术语与 Power Platform 功能相关，可以被视为一种服务于特定主题或目的的容器。租户中可以有多个环境，例如用于开发、测试，当然还有生产环境，也可以为\
  \ HR 工作负载、内部服务管理或任何其他主题设置单独的环境。\n\n在每个环境中，我们可以找到 Power Platform 提供的不同工具，例如 Power\
  \ Apps、Power BI、Power Automate 等等。此外，每个环境的访问权限也可以单独控制。前图显示了可在环境中提供的服务的选集。这也取决于公司已购买的具体许可和订阅。环境的全部工件都存储在\
  \ Dataverse 仓库中。Power Automate 与本章的主题相关。让我们来看看将云流连接到 UI 流所需的内容。\n\n## Machine and\
  \ Machine Runtime\n\n正如我们所知，UI 流是在本地机器上执行的，通常在公司的本地网络内。为了能够将 Microsoft 云和环境连接到该本地机器，Microsoft\
  \ 提供了 **Power Automate Machine Runtime**。下图显示了组件之间的关系：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_258_0.png)\n\
