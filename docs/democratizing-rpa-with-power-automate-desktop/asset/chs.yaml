  ## Additional thoughts and automation options


  当然，对于每个挑战，通常有几种可能的解决方案，这里介绍的方法并不是唯一一种。例如，也可以在处理完 SAP 中的数据并向用户发送电子邮件后才打开 Outlook。这对于内存较小的计算机来说可能也是更好的变体。而且正如前面提到的，SAPGUI
  也可以通过其他方式进行自动化。


  微软最近在其文档中添加了关于 SAPGUI 集成和自动化的大量信息，这也再次强调了这种可能性的重要性。


  在这里，我们将讨论多种实现选项：


  - - **Pro-code**：在此方法中，使用 VBScript 与底层的 SAPGUI Scripting API 交互。这里，SAPGUI 以 VBScript
  命令的形式记录要执行的动作，然后可以导入并在 PAD 中使用。乍一看听起来很简单。然而，除非你恰好是这种脚本语言的专家，否则流程的更改将难以实现。

  - - **Low-code/no-code**：这两种方法使用记录器来捕获特定的字段，如按钮和文本字段，然后进行调整


  > 之后。这遵循了我们在 *第 5 章和第 6 章* 中学到的创建 UI 元素的概念。


  本节介绍了一个非常流行的业务应用程序，我们学习了如何使用 PAD 来自动化这个有时非常复杂的程序。下一节将介绍所有业务应用程序 IT 的开端，并展示如何自动化和集成仍然非常流行的主机应用程序。


  ## Integrating mainframe scenarios


  术语 **mainframe** 指的是一个可追溯到 1950 年代的计算机家族。这些机器的操作较少依赖图形界面，而更多依赖基于字符的用户界面。它们的特点是可靠性非常高，以及对输入/输出和算术运算的吞吐量非常高。尽管从今天的角度来看该技术似乎过时，但主机仍然被广泛使用。在经典
  IT 领域，区分了批处理和对话程序。此类环境中不存在 API。信息交换大多基于文件或通过数据库访问。主机应用程序最常用于 **企业资源规划 (ERP)**、财务会计、仓储、订购等领域。因此，可以设想许多集成主机应用程序可能有用的场景：


  - - 网上商店接收客户订单，这些订单必须输入到中央仓储系统

  - - 供应商使用网络门户确认其交付，这些交付反过来必须输入到中央系统


  特别是在必须通过对话程序进行输入时，自动化是一个挑战，但我们可以用 PAD 很好地应对。主机的主要制造商有 Unisys、Fujitsu Siemens，当然还有最大的
  IBM，其 zSeries 和 AS/400 机器。其中最常用的操作系统之一是 **Multiple Virtual Storage (MVS)**，后来更名为
  OS/390，最后为 zSeries 机器提供 64 位支持的 z/OS。幸运的是，对于我们这些没有主机可用或无法连接到这些主机的人来说，有一个较旧版本的 MVS
  的仿真可用，它在 Linux 安装上运行得非常好。此外，在我们的 PAD Windows 机器上，必须安装终端仿真软件，并且必须存在对仿真的网络访问。如果一切都已配置好，我们可以启动终端仿真并会看到
  MVS 的欢迎屏幕：


  ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_239_0.png)


  图 8.11 – 用于访问 MVS 的终端仿真


  ## Software prerequisites


  要控制终端应用程序，需要终端仿真软件以及对主机的访问。PAD 提供了与 Micro Focus Reflection 或任何提供 HLLAPI 实现的其他软件（如
  RocketSoftware BlueZone、IBM Personal


  Communications 和 Cybelesoft zScope）配合使用的终端仿真动作。对于本书，我使用了一个 Micro Focus Reflection
  的试用版，并创建了一个基于 IBM 技术的常见主机系统的仿真虚拟机。请参阅相应章节了解更多信息。


  现在我们已经具备了所有先决条件，可以登录系统并探索其功能。要访问程序，需要提供有效的用户 ID 和密码。此版本附带了文档中提供的预配置用户和密码。主机场景的虚拟设计足够复杂。通常，用户会找到满足特定目的的某些程序，例如
  **update inventory** 和 **trigger supplier order**。这些程序以库的形式组织；最终用户可以通过键盘输入直接启动这些程序，然后使用数据和参数启动业务流程。在我们的测试环境中，不幸的是，我们没有触发业务流程的程序，但原理是相同的，因此我们可以使用示例流程来演示这种交互模式。


  我们可用于终端会话的动作列表显示此类应用程序完全通过键盘操作：


  - - **Open/close terminal session**：当使用 **Open terminal session** 时，会创建一个包含终端会话对象的变量。在这里，可以在不同的提供商之间进行选择（*Micro
  Focus Reflection* 或通用 HLLAPI），也可以选择安装路径和要连接的会话。在我的示例中，我创建了一个包含连接信息的会话文件并将其提供给参数：


  ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_241_0.png)


  # 图 8.12 – “Open terminal session” 动作参数


  - - **Move cursor on the terminal session:** 有时需要将光标放在特定位置以输入一些数据。此动作可用于通过提供行号和列号的值将光标放在所需位置。

  - - **Get/set text from or to the terminal session:** 这些动作用于向主机程序输入或读取数据——例如，要输入的订单的数据，包括订单项目，可以使用
  `set text` 输入。然后，后来可以读取自动创建的订单号 `get text`。

  - - **Send key to terminal session:** 此动作用于在终端仿真中执行控制——例如，通过发送 `Transmit`





  在再次发送 `<transmit>` 消息两次之前，需要一些时间进行处理。我们需要这样做，因为在到达主屏幕之前，操作系统将呈现两个额外的屏幕（广播消息）：


