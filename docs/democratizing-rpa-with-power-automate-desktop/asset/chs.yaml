  \ on a local machine\n- How the application is built up\n- How to create our first\
  \ flow by using the built-in recorder\n\nTo use PAD effectively, a basic understanding\
  \ of the application is essential, as we will spend most of our time on the very\
  \ areas presented here. Also, knowledge of the PAD recorder will be extremely helpful\
  \ throughout this book because it can also save us a lot of time when creating flows.\
  \ Now, let’s look at how we can get PAD running on our computers.\n\n### Understanding\
  \ the prerequisites for installing PAD\n\nLet’s begin by taking a look at what you\
  \ need to get Power Automate up and running on a local machine. Two things are required\
  \ to install Power Automate:\n\n- A Windows operating system (Windows 10 or Windows\
  \ 11 Home edition or above) and some hardware requirements/recommendations\n- A\
  \ Microsoft work or school account to sign in to Power Automate\n\nSince there are\
  \ specific things to consider, let’s take a closer look at each of these topics\
  \ now.\n\n### Microsoft account\n\nTo be able to access the files for installing\
  \ PAD, a Microsoft account (formerly known as Windows Live ID) is required. There\
  \ are different types of accounts and all of them are suitable for using PAD:\n\n\
  - **(Personal) Microsoft account:** This is probably the most commonly used type\
  \ of account in the private area. It is free and provides access to Microsoft’s\
  \ consumer services such as **Outlook.com, OneDrive, and Office applications**.\
  \ To sign up, an existing email address can be used or a new one can be created.\
  \ This account can also be used to sign in to a Windows machine.\n- **Work or school\
  \ account:** This type of account is created by an organization that uses **Azure\
  \ Active Directory (AAD)** as the authentication and authorization platform. Typically,\
  \ additional services or subscriptions are purchased that offer additional functionality\
  \ to users.\n- **Organization premium account:** This is a special form of work\
  \ or school account. In this case, the organization is not only managing users via\
  \ AAD but has also moved certain or all parts of IT to the cloud, such as Exchange,\
  \ Teams, and Business applications.\n\nWith all three types, the full potential\
  \ of PAD can be unleashed. The organization’s premium account has the following\
  \ capabilities on top:\n\n- Connecting and integrating with cloud flows (see the\
  \ previous comments on the operating system)\n- Collaboration and advanced functionality\
