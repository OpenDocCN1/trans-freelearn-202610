  ## 使用消息框的交互式流程


  整本书中多次使用消息框。这些操作有助于使流程具有交互性。不仅可以在消息框中显示变量或文本，还可以请求用户输入、选择文件等。当然，这些输入可以而且应该在后续操作中使用。有用于显示消息和输入的对话框，以及从列表中选择日期或条目，以及选择文件或文件夹的对话框。


  同样值得注意的是，可以选择创建自己的对话框。为此，必须将**显示自定义表单**操作拖到设计器上。会显示一个按钮，用于打开**自定义表单设计器**，如下所示：


