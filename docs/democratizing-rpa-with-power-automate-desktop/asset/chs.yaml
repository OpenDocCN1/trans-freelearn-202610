  \nFigure 9.18 – Working with AWS EC2 instances\n\n## Working with Azure actions\n\
  \nIn the first section of this chapter, we saw that Azure is the foundation for\
  \ all Microsoft Cloud services. To explain the concept of Azure without going too\
  \ much into the details, take a look at the following diagram:\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_283_0.png)\n\
  \nFigure 9.19 – Azure relationship between different components\n\nThe tenant is\
  \ equivalent to an organization or a company. Typically, the tenant contains an\
  \ Azure Active Directory where we can define and register new applications that\
  \ need to access resources within the tenant.\n\nA subscription is a financial boundary\
  \ for any kind of resource. Because resources consume CPU and/or memory, there must\
  \ be financial coverage of the consumption. There can be multiple subscriptions\
  \ within a tenant.\n\nThe next level is a resource group, which usually relates\
  \ to a specific purpose or topic. For example, it could be possible to create a\
  \ resource group that contains all resources for automating a specific workload\
  \ or application. These resources can be storage (disk or volume to persist data)\
  \ or virtual machines and many more types of resources.\n\nFor PAD to be able to\
  \ access resources in Azure, we need to register a new app within Azure Active Directory.\
  \ This would have a new client ID as a result, which we can use for the corresponding\
  \ field in the Actions Parameter dialog. Within this app registration, it is also\
  \ possible to create a client secret, which is a fixed password to use for logging\
  \ in with this client. In the Azure portal, go to Azure Active Directory | App registrations\
  \ and create a new registration:\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_284_0.png)\n\
  \nFigure 9.20 – Azure Active Directory – App registrations\n\nTogether with the\
  \ Tenant ID (or Directory (tenant) ID in the preceding screenshot) and Subscription\
  \ ID properties (needs to be looked up in the subscription), we have all the information\
  \ for the Azure session to log on:\n\n### Create session\nCreates an Azure session\
  \ using service principal More info\n\n### Select parameters\nClient ID :\n\nClient\
  \ secret:\n\nTenant ID:\n\nSubscription ID:\n\nVariables produced AzureClient\n\n\
  On error\n\nSave\n\nCancel\n\nFigure 9.21 – Creating a connection to Azure\n\n###\
  \ Configuring additional security settings\n\nFor the Azure session to work, additional\
  \ security-related steps must be taken. First, the app registration must be granted\
  \ API permissions for Azure resources to access. These include permission for Azure\
  \ Service Management and Azure Storage. Second, the app registration must be given\
  \ additional role assignments at the subscription level. For this, go to the subscription\
  \ management in the Azure portal, switch to the Access Control (IAM) area, select\
  \ the Role Assignment tab, and use the +Add button to start the wizard. Select the\
  \ Virtual Machine Contributor role and add the app registration that was previously\
  \ created as a member of the role assignment.\n\nThe following example shows how\
  \ to work with actions for Azure virtual machines and disks:\n\nthe background.\
  \ Finally, the new disk is attached to the VM and is available directly in **Disk\
  \ Management** as an unformatted drive.\n\nAs a consequence, other scenarios can\
  \ be feasible. For example, it would be possible to fill a new disk with data from\
  \ a snapshot or another storage account.\n\nFurthermore, the VM could also be equipped\
  \ with an agent for virtual desktops so that UI elements can be identified and used\
  \ in a flow.\n\nIn this section, we learned that we can use IaaS providers such\
  \ as Microsoft or AWS via the native PAD actions to move workloads from on-premises\
  \ machines to VMs and then control them through a locally executed UI flow.\n\n\
  This can save resources, especially if an application is not used for automation\
  \ daily or uses a lot of compute capacity (CPU/memory).\n\n## Summary\n\nThrough\
  \ integration with Power Platform, PAD can close the gap between workflows in the\
  \ cloud and the local network. We have seen that this can create a seamless overall\
  \ concept for an automation solution, as the various components are very well integrated.\n\
  \nAdditionally, we learned about native actions for using IaaS offerings from Microsoft\
  \ and AWS, which allow us to outsource the execution of desktop programs or add\
  \ more resources to our flow as needed.\n\nIn the next chapter, we’ll look at how\
  \ we can incorporate artificial intelligence into a UI flow while learning about\
  \ offerings from various vendors.\n\n## Further reading\n\nFurther information is\
