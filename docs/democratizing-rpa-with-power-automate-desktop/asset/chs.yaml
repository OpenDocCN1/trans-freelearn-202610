  ## 使用 PAD 进行分布式用户管理


  让我们想象一下，我们负责为下个月入职我们小公司的用户设置账号。除了登录名和邮箱之外，当然还需要 SAP 登录名。人力资源部门已经在 Active Directory
  中创建了账号，并在 Excel 电子表格中收集了这些用户的信息。我们的任务是在 SAP 中创建其中列出的用户，并通过电子邮件发送登录信息。这也包括创建初始密码。因此，我们需要一个流程来为我们执行以下操作：


  - 从 Excel 电子表格中读取所有用户并提取数据

  - 启动 SAPGUI 并调用创建新用户的相应事务（SU01）

