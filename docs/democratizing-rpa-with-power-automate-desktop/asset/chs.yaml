  ## Google cognitive


  Google 的 AI 功能可通过 **Google Cloud Platform（GCP）** 访问。首先，您需要创建一个相应账户。提供商提供一定的配额，可用于试用服务。入口通过
  [https://cloud.google.com](https://cloud.google.com) 进行，也可以在此处创建新账户。然后您将进入 Cloud
  Console，您可以在其中搜索资源并创建新项目以使用这些 API。例如，您可以使用 **搜索** 框并查找术语 `sentiment`，它是 Cloud Natural
  Language API 的一部分。每个 API 都需要单独启用。您可以通过屏幕左上角的汉堡菜单查看所有已启用的 API，如下图所示：


