  激活 API 后，还必须创建凭据才能从外部调用此接口。这也适用于 PAD 中的操作，因为这些操作需要 API 密钥才能执行。对于每个服务，都有一个 **凭据**
  部分，可用于创建 API 密钥（见下图）。


