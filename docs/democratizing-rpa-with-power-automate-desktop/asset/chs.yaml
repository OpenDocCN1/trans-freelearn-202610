  IP 地址和适当的用户凭据创建与 AD 的连接。在这种情况下，运行该 UI 流程的计算机不需要是该域的成员，并且可以通过 IP 地址建立连接。但是，要使用操作，例如创建用户，需要对域有一定的了解，以便提供可分辨名称的信息。


