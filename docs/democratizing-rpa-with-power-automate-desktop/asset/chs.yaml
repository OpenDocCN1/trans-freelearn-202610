- '## Leveraging Artificial Intelligence


  The topic of **artificial intelligence (AI)** has been hotly debated for some time
  and has gained further popularity with the advent of OpenAI and ChatGPT. In this
  chapter, we want to shed light on what possibilities we have within PAD in this
  regard and look at the following areas:


  - An introduction to cognitive services

  - Diving into the offerings of Microsoft, Google, and IBM

  - Classification in the practical work with PADT


  After reading this chapter, we will have a solid understanding of what AI means,
  in which areas this technology helps optimize business processes, and how these
  functionalities can be deployed and used with PAD.


  ## Technical requirements


  The services addressed in this chapter are accessed online by the respective providers.
  This requires a corresponding subscription with the vendors, who all provide a test
  period with certain credits free of charge. The process for starting a trial and
  subsequent steps are different in each case and are highlighted in the corresponding
  sections.


  ## Introduction to cognitive services and artificial intelligence


  The functionalities discussed in this chapter all deal with AI and **machine learning
  (ML)**. Before we turn to the individual providers and their functionality, we will
  first classify the topic in general and consider what benefits AI can bring to everyday
  life and in the business context.


  In general, it can be said that AI can help to recognize structures in text, image,
  or sound information so that they become machine-readable. Cognitive services hereby
  refer to a set of cloud-based **application programming interfaces (APIs)** and
  tools provided by Microsoft, IBM, Google, and other vendors that enable developers
  and creators to add advanced AI capabilities to their applications without needing
  to have deep expertise in ML or data science. The actions offered in PAD by the
  different vendors provide more or less the same functionalities, shown in the following
  diagram. Only the naming of the services is slightly different in some cases.


  ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_290_0.png)


  Figure 10.1 – An overview of cognitive services


  Let’s take a slightly closer look at these capabilities and how they can be used
  in a business context.


  ## An overview of cognitive services


  Cognitive services can also be described as a set of APIs and tools that use ML
  algorithms to enable computers to perform tasks that normally require human-level
  intelligence. These services are typically hosted in the cloud and can be accessed
  through a REST API or **software development kit (SDK)**. The technology behind
  cognitive services can be broken down into a few key components:



  - **ML**：认知服务的核心是 ML，即人工智能的一个子领域，涉及训练计算机在数据中识别模式。认知服务使用的 ML 模型通常在大量标记数据上进行训练，并且随着接触新数据，其准确性会随时间推移而提高。最新的
  ML 模型起步时就已使用 100 个数据集，并且仍在不断改进。

  - **深度学习**：许多认知服务还使用深度学习，这是一种涉及训练具有多层的人工神经网络的 ML 类型。深度学习模型对于图像和语音识别以及**自然语言处理（NLP）**尤其有效。

  - **NLP**：一些认知服务，例如语言翻译和文本转语音，使用 NLP 算法来分析和理解人类语言。NLP 涉及将文本解析为其组成部分，例如单词和句子，并使用统计模型来识别这些部分之间的模式和关系。**语言理解（LUIS）**例如，就是一种
  NLP 服务，使开发人员能够构建聊天机器人和其他对话界面。

  - **计算机视觉**：计算机视觉是人工智能的一个分支，涉及训练计算机从图像和视频中识别和解释视觉信息。使用计算机视觉的认知服务可以执行对象检测、人脸识别和图像分类任务。

  - **云计算**：最后，认知服务通常托管在云中，这使得开发人员可以从世界任何地方访问它们。云计算还提供可扩展的按需计算资源，有助于降低成本并提高性能。


  总体而言，认知服务由先进的 ML、深度学习、NLP 和计算机视觉算法的组合提供动力，并通过云计算技术实现访问。这些服务可以帮助自动化许多原本需要人类水平智能的任务，例如语音识别、语言翻译和图像分析。认知服务使人们更容易在应用程序中添加强大的
  AI 功能，而无需具备 ML 或数据科学方面的广泛专业知识。


  ## AI 在业务背景下的应用


  但这些技能如何在业务背景下有意义地应用呢？以下是认知服务和图像分析在不同业务场景中如何使用的一些示例：


  - **客户服务**：由认知服务驱动的聊天机器人可用于 24/7 提供客户服务，回答常见问题，帮助客户查找产品和服务，并解决简单问题。这些聊天机器人可以集成到网站、消息应用程序和社交媒体平台中。通过包含情感分析，此类聊天机器人可用于分析社交媒体平台和评论网站上的客户反馈和情绪。这可以帮助企业快速识别问题并加以解决，同时识别出表现优异的领域。认知服务可用于驱动可用于客户服务的语音助手。例如，客户可能会使用语音助手来跟踪订单、更新其账户信息或请求产品推荐。认知服务可用于根据通过电子邮件、聊天或社交媒体收到的客户咨询自动创建支持工单。这可以帮助客户服务团队更高效地管理工作量并及时响应客户。

  - **电子商务**：认知服务可用于分析产品图像并根据客户偏好推荐类似产品（向上销售和交叉销售）。例如，客户可能会拍摄他们喜欢的连衣裙的照片，而电子商务网站可以使用图像识别来建议不同款式或颜色的类似连衣裙。认知服务可用于分析客户作为支持请求的一部分提交的产品图像。这可以帮助客户服务代表快速了解问题并提供更准确、更高效的支持。认知服务可用于检测电子商务中的欺诈活动，例如使用


  - 所有请求都需要 API 密钥来授权请求

  - 所有结果都附带一定的置信度以及作为响应的状态码


  让我们来看看每个厂商在 PAD 中提供的 AI 功能。


