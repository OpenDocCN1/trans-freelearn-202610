  \ and unattended execution of flows\n\nFor the vast majority of use cases, a personal\
  \ Microsoft account is sufficient. Nevertheless, in the following chapters of this\
  \ book, we will see scenarios where a premium account is necessary to access specific\
  \ services.\n\n### Additional notes on accounts\n\nTo install PAD, a user with administrator\
  \ privileges on the device is required. A Windows local or domain account with these\
