  ## 操作计算机外设


  本节介绍的动作完善了 PAD 管理工作站的能力，通过模拟操作或当然覆盖其他用例。以下组件可以被控制，并作为动作组存在：


  +   - 工作站本身和连接的打印机

  +   - 鼠标和键盘

  +   - 剪贴板


  通过这些动作组，可以通过移动鼠标或按下按键来模拟完整的用户会话。


  这在例如无法使用之前讨论的选项（UI 元素或图像）与应用程序通信时也可能有所帮助。也许我们无法捕获 UI 元素，但仍然可以将鼠标导航到特定位置并发送点击甚至按键。


  然而，在这一点上，我们必须非常精确，原因如下。我们将在本示例中看到，**Send mouse click** 动作使用屏幕的 X 和 Y 坐标。这意味着鼠标会被精确引导到这些坐标，然后触发点击。这将一直有效，直到本地机器的屏幕分辨率最终被更改或流程在具有不同分辨率的另一台机器上运行。相同的坐标随后会导致完全不同的


  位置，因此流程不再正常工作。关系如下图所示：


  ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_206_0.png)


  图 7.13 – 不同的屏幕分辨率和相同的坐标


  正如我们在前面的图中看到的，坐标 **X=960** 和 **Y=540** 在左侧屏幕的正中间。但当屏幕分辨率发生变化时，这些坐标位于左上角而不是中间。这意味着在使用使用鼠标坐标的动作时，必须始终确保屏幕分辨率与创建流程时使用的分辨率相同。通过
  **Get screen resolution** 和 **Set screen resolution** 动作，可以检查这些设置并在必要时进行更改。


  让我们详细看看选项。


  ### 工作站


  此动作组包含所有与工作站更狭义相关的动作。包括以下内容：


  +   - **Workstation: Lock Workstation/Log off User/Shutdown computer:** 区分不同的动作很重要。**Lock**
  对应于 Windows 中的相同锁定功能，也可通过 *Windows* 键 + L 快捷方式使用。流程随后将在后台继续运行。注销当前用户将从该点起终止流程，**Shutdown
  computer** 动作也是如此。最后一个




  也提供了一个参数来定义是仅关机、重启、休眠，还是将工作站设为睡眠。


  +   - **Print: Print document/Get default printer/Set default printer:** 这些操作使用文档名称的文本字段，获取或设置打印机。

  +   - **Screen: Get screen resolution/Set screen resolution/Control screen saver:**
  这些操作需要一个已连接的控制台会话才能工作。此会话在用户登录到工作站并且 PAD 由该用户执行时可用。这意味着用户已登录并启动了 PAD 控制台。在无人值守场景中，这些操作没有任何效果。设置屏幕分辨率有助于以标准化方式运行场景，例如使用屏幕坐标的场景，如鼠标移动（参见下一节）。

  +   - **Miscellaneous other actions: Show desktop/Play sound/Empty recycle bin/Take
  screenshot:** 这里值得一提的是，**Show desktop** 既可以显示桌面，也可以恢复所有窗口。此外，**Take screenshot**
  对于收集和记录有关系统的信息非常有用，适用于整个桌面或前台窗口。


  在查看另一个示例之前，让我们先来看一下键盘和鼠标的操作。


  ## Mouse, keyboard, and clipboard


  该组中的操作完成了本章关于模拟用户会话的可能性，并提供了真实用户可以执行的所有操作，从特定的鼠标序列到发送快捷键和预定义键组合。以下是详细信息：


  +   - **Block Input**: 此操作有一个开关，可阻止或解除阻止用户进行的任何按键或鼠标点击。这在执行期间很有用，可以防止用户额外的按键或鼠标点击干扰流程。但请注意。一方面，请务必在流程的末尾插入
  `Unblock` 操作。并且

  请不要在中间创建断点，因为这会停止流程，并且由于输入被阻止，没有机会继续流程。

  +   - **Get mouse position**: 这会将鼠标指针的坐标存储在两个变量中（x 位置和 y 位置），相对于屏幕或前台窗口。

  +   - **Move mouse / to image / to text on screen (OCR)**: 可用于将鼠标指针移动到屏幕上的特定位置。你也可以将鼠标指针放置在所需位置并按
  Ctrl + Shift。这会将当前坐标传输到操作参数中。还有多种运动行为，从 **instant** 到 **with animation (high speed)**。使用
  **Move mouse to image** 操作时，可以定义或选择一个图像（参见 *第 5 章* 关于图像）来移动鼠标，甚至在移动后发送点击。PAD 还可以通过使用
  **光学字符识别 (OCR)** 技术来检测屏幕上的文本。**Move mouse to text on screen (OCR)** 允许你选择 OCR 引擎、应查找的文本以及一些附加选项。例如，如果你已确定屏幕上想要执行鼠标点击的区域，该区域可能带有文本标签，则可以使用此操作成功地将鼠标移动到该区域并触发点击。

  +   - **Send mouse click**: 此操作可以发送各种鼠标事件，从标准的左键单击和右键单击、双击到中键单击。也可以仅发送按钮按下事件，并在另一个时间发送按钮抬起事件。此操作还包括一个开关，允许将鼠标指针移动到特定坐标，这本质上与
  **Move mouse** 操作相同。

  +   - **Wait for mouse**: 当应用程序接收到鼠标点击时，鼠标光标可能会变为 **wait** 光标或 **hourglass** 光标。此操作可用于等待光标再次变为普通光标/不变为普通光标。


  通过这些鼠标控制操作，可以模拟工作站前可能不存在的硬件，例如，如果鼠标上没有中键。我们还可以实现并模拟 *click-and-drag*

  或 *drag-and-drop* 操作。然而，大多数应用程序不仅可以通过鼠标操作，通常还可以通过键盘直接输入的一整套快捷键立即触发操作。为了使 PAD 也能使用这种非常高效的操作方式，提供了以下键盘操作：


  **Send keys**: 如果我们想在前台窗口/窗口实例/标题或类或 UI 元素中光标当前位置输入一些文本，这就是要使用的操作。以下屏幕截图显示了此操作的<|message|>


