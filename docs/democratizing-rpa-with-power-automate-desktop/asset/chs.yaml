  \n## Unattended execution (Run mode)\n\n到目前为止，我们手动启动了 PAD 流程，并能够交互式地观察流程如何运行操作。在这里，系统上有一个用户已登录。这就是所谓的\
  \ **attended execution**。相应地，**unattended execution** 在没有查看执行选项的情况下运行。这也意味着执行流程的机器上不能有活动用户会话。流程的无人值守执行只能由云流触发。这是因为我们提供了流程登录机器并启动流程所需的所有必要信息。在执行期间，会创建一个锁定的\
  \ Windows 用户会话。执行完成后，该会话将被释放。\n\n要以无人值守模式运行前面的示例，只需在 Power Automate 连接器中进行相应的设置并退出本地\
  \ Windows 会话即可。当然，如果在流程执行期间不希望有观众——例如因为正在处理敏感数据——这尤其有意义。\n\n正如我们在本节中所看到的，借助 Power\
  \ Platform 中的连接器功能，可以无缝地将桌面流整合到更大的集成场景中，而无需编写一行代码。借助 PAD 的这些功能，本地应用程序不再孤立，可以将其功能和数据提供给业务，从而做出宝贵的贡献。\n\
  \nMicrosoft 云中另一个非常受欢迎的服务是 SharePoint。我们将在下一节中查看其交互功能。\n\n## Managing lists, files,\
  \ and folders with SharePoint\n\n\n\n\n\nMicrosoft SharePoint 仍然非常受欢迎，是 Microsoft\
  \ 365 产品套件中用于管理团队页面、项目工作区、列表和文档库的平台。 通常，该平台还被用作文档管理系统，并作为 Microsoft Teams 管理文档的基础结构：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_271_0.png)\n\n图 9.13 – 标准 SharePoint\
  \ 示例团队站点\n\n文档库包含许多有用的设置，例如版本控制、文档协作工作等。 因此，如果经常使用的系统如 SharePoint 也可以被 PAD 原生访问，则提供很大的优势。\
  \ 桌面流创建者不再需要转向云流来处理 SharePoint。 因此，存储在 SharePoint 中的所有数据都将自动对更大的团队甚至整个公司可用。 在撰写本文时，SharePoint\
  \ 的操作仍处于预览阶段。 让我们看看按类型分组的操作：\n\n- File:\n  - 从一个站点地址复制或移动文件到另一个站点地址\n  - 从二进制数据创建或更新（新）文件\n\
  \  - 签入、签出或丢弃文件以防止他人覆盖更改\n  - 通过文件标识符获取元数据、删除文件并获取文件内容\n- Folder:\n  - 从一个站点地址复制或移动文件夹到另一个站点地址\n\
  \  - **List folder and list root folder**: 返回给定文件夹或 SharePoint 根文件夹中包含的文件\n  - **Get\
  \ folder metadata**: 返回有关文件夹的元数据信息\n  - **Extract folder**: 将 ZIP 文件的内容提取到文件夹\n\
  - List:\n  - **Get lists, get all lists and libraries**: 返回给定 SharePoint 站点中的所有列表或列表和库\n\
  \  - **Get list views**: 返回给定 SharePoint 列表中的所有视图\n\n文件和文件夹在这里应理解为与本地计算机上的方式相同。\
