  当然，我们还需要 PAD 中的函数来处理数据、创建、转换和显示数据。其中一些功能也可以在变量操作组中找到，例如创建随机数以及处理列表和对象。然而，也经常出现需要处理日期值的情况，尤其是在业务环境中：


