  \ 桌面流完成后，会为机会创建一个任务活动，其中包含生成的发票号码，以便销售代表也知道为销售交易记录创建了哪个发票号码。\n\n当云流最初创建时，会在后台为所使用的连接器设置适当的连接。这些包含指向它们后面的服务的凭据，这些凭据与连接器一起使用。因此，当首次使用时，必须为桌面流创建连接。要添加此步骤，可以使用两个现有步骤之间的\
