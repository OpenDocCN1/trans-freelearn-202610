- '# Power Automate Desktop RPA 民主化





  '
- '## 前言


  在我们的私人生活和职业生活中，我们都熟悉这样的场景：不得不执行重复且乏味的 IT 任务。微软提供了 Power Automate Desktop，这是一个免费工具，可用于解决从小型到大型的自动化场景。


  在本书中，您将学到使用 Power Automate Desktop 自动化重复且单调的流程所需的一切，从而释放出更多时间去做更重要的事情。本书介绍了该程序的历史及其在
  Microsoft Power Platform 中的当前角色，然后解释了用户界面自动化的概念，以及如何利用 Power Automate Desktop 实现本地安装的程序或进程以及
  Web 浏览器的自动化。


  随着学习的深入，您将通过大量示例了解 Power Automate Desktop 的完整功能集，从变量、条件和分支等基本概念，到本地桌面的功能（如文件和文件夹管理），再到连接数据库、大型机计算机和
  SAP 自动化。


  最后几章还涉及人工智能的主题以及如何将其融入流程，同时介绍了 Power Automate Desktop 如何用于大型企业，在大型企业中，治理、合规性、扩展和安全性等额外主题也发挥着作用。


  ## 本书读者对象


  本书不要求读者具备特殊的 IT 知识，因此一个有抱负且对流程感兴趣的 Windows 用户将能够很好地掌握本书内容，因为所有必要的概念都已解释清楚。对于更复杂系统的连接，如
  SAP、大型机或 Web 服务，本书解释了基本功能。要实现这些，则需要具备相关领域的知识。


  流程。


  *第11章*，*使用 API 和 Web 服务*，展示了 Power Automate Desktop 如何与不同的 API 和 Web 服务协同工作，以设计自动化流程。


  *第12章*，*PAD 企业最佳实践*，解释了 Power Automate Desktop 如何作为更大自动化项目的一部分发挥作用，以及需要考虑哪些方面。


