  \ Power Platform，此出站连接场景现在可以扩展为入站场景——例如，UI 流程可以从外部自动调用并执行其工作。在这方面，PAD 可以弥合云与本地网络之间的差距，从而确保互联的流程。\n\
  \n为了更好地理解这一概念以及所有这些如何融入 Microsoft 生态系统，我想从高层次解释一下这意味着什么。下图显示了 Microsoft 云的概念结构：\n\
