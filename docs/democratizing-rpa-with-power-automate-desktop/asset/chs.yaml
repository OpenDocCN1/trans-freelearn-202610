  ## 使用 SAP


  SAP 既是公司名称，也是企业管理软件。至少从名称上看，这个软件产品应该为所有人所知，因为它在全球范围内非常普及，尤其是该公司代表了软件和编程领域全球第四大公司。在很长一段时间里，**SAP
  ERP** 是 **企业资源规划（ERP）** 领域的标准软件，而它又基于 **SAP R/3**，该软件于 1992 年首次推出。SAP ERP 的最新版本是
  6.0 版，于 2006 年推出，此后一直通过服务包和小型增强功能进行维护。它现在被视为遗留技术，新版本是 **SAP S/4HANA（高性能分析设备）**。


  然而，不久前，SAP 宣布 SAP ERP 将继续支持到 2027 年或 2030 年（提供扩展支持；详情请参阅 *延伸阅读* 部分），这当然是有充分理由的。这种向新版本
  S/4HANA 的迁移和切换对许多客户来说都伴随着高昂的成本。除了软件，硬件通常也必须更换，如果不同时计划使用云，这对 ERP 软件来说可能代价高昂——所有这些原因使得我们今天仍然能找到许多
  SAP R/3 安装。PAD 自动化可能非常有用，因为公司会非常仔细地考虑是否以及愿意在一个过时的软件系统上投入多少资金。那么，为什么不使用一个轻量级集成解决方案，把节省下来的钱投入到未来
  ERP 系统的项目中呢？那么，让我们来看看如何使用 PAD 连接到称为 **SAPGUI** 的 SAP 界面，以下示例需要在本地安装该界面，它是 SAP ERP
  系统的标准客户端软件。该软件包含在用于开发目的的 SAP 测试系统试用版中，本示例就是在此基础上构建和使用的。


