  \ F5。\n\n果然，出现了一个输入对话框，要求我们输入姓名，现在我们可以将其输入到文本框中：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_49_1.png)\n\
  \n图 2.17 – 运行我们的第一个流程 – 第 1 部分\n\n另外，请注意，后台程序的界面发生了一点变化。带有蓝色背景的条目表示流程的当前步骤。输入姓名并点击**确定**按钮。流程将继续执行下一步，并显示一个消息框，其中包含你输入的姓名：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_50_0.png)\n\n图 2.18 – 运行我们的第一个流程 – 第\
  \ 2 部分\n\n再次强调，应用程序中的蓝色背景表示当前步骤。点击**确定**关闭消息框并结束流程。恭喜——你已经创建并执行了第一个 UI 流程！\n\n##\
  \ 用户界面构成详解\n\n现在我们已经了解了 PAD 的基本功能，接下来仔细看看这个应用程序及其可能性。PAD 由两个窗口组成：\n\n- 容器窗口或 Power\
  \ Automate 控制台\n\n### Power Automate 容器窗口\n\n启动程序时，我们看到的第一个窗口是容器窗口，也称为 Power Automate\
  \ 控制台。以下截图显示了该窗口：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_51_0.png)\n\n图 2.19\
  \ – PAD 容器窗口\n\n它包含以下元素：\n\n- 1. **UI 流程列表：** 如果将鼠标悬停在列表中的某个项目上，系统会显示其他附加选项，例如*播放*按钮或*编辑*按钮。*编辑*按钮只会打开设计器窗口（见下图），而*启动*按钮会立即运行流程，而无需先打开设计器窗口。\n\
  \n你还会在桌面上收到有关流程状态的通知（已启动、已成功等）：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_52_0.png)\n\
  \n图 2.20 – 有关流程的 Windows 通知\n\n编辑按钮右侧的三个点会打开一个上下文菜单，你可以在其中运行或编辑流程，还可以重命名、删除或复制流程：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_53_0.png)\n\n图 2.21 – 流程列表上下文菜单\n\n**详细信息**选项会显示流程的属性，包括其名称和说明、所有者、创建日期和最后修改时间。\n\
  \n- 2. **控制台区域切换**：你还可以从**我的流程**选项卡切换到**示例**选项卡。这里展示的是 Microsoft 提供的各种不同示例，包括 Excel、桌面、Web\
  \ 等自动化。虽然这些示例并未涵盖程序的所有功能，但还是值得一看，或许可以尝试其中某个示例。\n\n- 3. **创建新流程**：此按钮会启动一个对话框，你可以在其中输入新\
  \ UI 流程的名称。虽然这不是必填项，但为流程提供一个有意义的名称是合理的。有一个**创建**按钮，用于确认名称并启动带有空白画布的设计器窗口。\n\n- 4.\
  \ **PAD 设置**：此按钮会启动**设置**对话框。在这里，我们可以修改 PAD 的启动行为，还可以使用热键停止正在运行的流程。此外，还可以更改监控和通知设置（Windows\
  \ 通知、流程监控窗口或什么都不通知）。\n\n- 5. 登录信息：单击标题栏中的姓名，会提供有关当前用户及其登录信息的信息。在这里，也可以注销并以其他用户身份登录。\n\
  \n### 设计器窗口\n\n现在让我们仔细看看设计器窗口：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_54_0.png)\n\
  \n图 2.22 – PAD 的设计器窗口\n\n这里包含以下元素：\n\n- 1. 操作窗格：窗口左侧属于操作窗格。操作代表流程能够执行的功能，例如“打开 Excel”或“获取文件夹中的文件”。这些操作被分组到不同的类别中，例如“系统”或“文件夹”。展开相应的项目，即可看到属于某个类别的所有操作。只需点击类别左侧的箭头图标即可。在整本书中，我们都会逐一介绍这些操作。列表顶部还有一个**搜索**框。如果你在此输入搜索词，操作列表就会根据该搜索词进行筛选。我们在第一个流程中就使用了这个功能。\n\
  \n- 2. **流程设计器区域**：窗口中间是一个画布，包含构成此流程的所有操作。可以通过从**操作**窗格中拖放操作来将其放置到画布上。当流程启动时，操作将按照此处列出的顺序运行。只需单击并拖拽现有条目并将其放到其他位置，即可重新排列此操作列表。系统会显示一条水平线，指示操作可以放置的位置。我们在前面的示例中见过这一点。你还可以双击某个操作以打开该操作的设置对话框并修改条目。在此区域中，还有一个查看子流程的选项。子流程只是封装了一组特定操作的另一个\
  \ UI 流程。通过使用子流程，可以将大型流程划分为不同的部分。子流程始终属于某个常规流程，不会在其他流程之间共享。\n\n- 3. **流程控制栏**：操作列表顶部的小工具栏允许你保存、启动、停止和录制流程。还有一个选项可以启动流程并逐步执行操作，这也称为**调试**。我们将在下一节中更详细地介绍这一点以及录制器。\n\
  \n- 4. **变量查看器窗格**：右侧是一个显示流程变量的区域。变量是流程在运行时存储信息的重要方面。变量将在*第 5 章*中介绍。\n\n- 5. **输入元素切换器**：还需注意变量图标\
  \ {x} 下方的两个额外小图标。这些图标可用于切换到包含 UI 元素和图像的区域，该区域也将在后面介绍。你可以通过单击图标隐藏此区域。\n\n- 6. **操作与执行摘要**：底部有一个小工具栏，用于汇总当前流程。还可以为流程运行设置特定的延迟——在此示例中为\
  \ 100 毫秒。\n\n这是应用程序的菜单栏。除典型的保存和编辑功能外，调试功能也再次在此提供，其中还可以设置断点。这样可以让流程执行到某个特定点，以便在发生错误时检查设置和变量：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_56_0.png)\n\n图 2.23 – 调试菜单\n\n当流程运行出错时，设计器窗口还会出现在屏幕底部的另一个区域中。这里将显示流程在何处停止以及停止原因的详细信息。现在我们已经了解了更多细节，我们将在下一节使用录制器创建另一个流程。\n\
  \n### 使用录制器\n\n正如你在上一章中看到的，PAD 设计器窗口不仅允许我们将操作拖放到设计画布上，还允许我们录制 UI 流程。此概念类似于屏幕录制器，它记录每一个步骤、每一次鼠标点击和键盘按键，以便之后按相同方式回放此系列操作。\n\
  \n我们想使用这一功能来创建 PacktPub 出版社所有书名的概览，以便在其他地方（例如数据库中）使用这些信息。遗憾的是，我们无法直接访问 PacktPub\
  \ 的底层数据源，但可以通过其网站 https://subscription.packtpub.com/search 获取书名。然而，我们不想在网站上逐个高亮每一个书名，然后再复制粘贴到另一个工具中。那将花费很长时间，而且相当枯燥。PAD\
  \ 可以替我们完成这项工作。\n\n在下面的示例中，我们将使用一种称为网页抓取的概念——即从网页中结构化地提取信息。请注意，这也适用于许多其他网站，因此该技术可以通用。但是，使用此方法的前提是，我们必须为所使用的浏览器安装并激活一个小扩展程序，以便\
  \ PAD 可以访问网页中的元素。那么，让我们开始吧：\n\n- 1. 创建一个新流程，并为其指定一个有意义的名称，例如**网页抓取 PacktPub**。\n\
  - 2. 在操作窗格中找到**浏览器自动化操作**组并展开它。你会看到来自 Google、Firefox 和 Microsoft Edge 的每种浏览器都有一个**启动新的...**操作。我的机器上安装了\
  \ Microsoft Edge，因此我会单击并将此操作拖到画布上：\n\n\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_58_0.png)\n\
  \n# 图 2.24 – 将浏览器操作拖到画布上\n\n3. 此时，系统可能会要求你为 PAD 安装浏览器扩展：\n\n# 你需要 Power Automate\
  \ 扩展。\n\n+   1. 要在你的流程中使用网页自动化，请选择“获取扩展”以下载并安装到所选浏览器。\n+   2. 安装后，请确保在浏览器中启用该扩展。\n\
  \n# 图 2.25 – 浏览器扩展安装对话框\n\n4. 这只会发生一次。获取扩展并确保其已激活。\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_60_0.png)\n\
  \n图 2.27 – 录制按钮\n\n此时，PAD 设计器将消失，而是一个较小的录制窗口会出现。 它应该看起来像这样：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_60_1.png)\n\
  \n图 2.28 – 录制窗口\n\n现在，有趣的部分开始了。 通过点击屏幕中间的按钮或顶部的按钮开始录制。 录制窗口将发生变化，并在 **Recorded actions**\
  \ 下方显示一个空区域。 使用鼠标将光标悬停在网站上的不同元素上，例如书籍图片。 你会看到 PAD 尝试识别网站上的不同元素并相应地框出它们。 在下面的屏幕截图中，我将光标悬停在书籍图片上：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_61_0.png)\n\n图 2.29 – 检测网页元素\n\n为了让录制器正确识别网页元素，有时需要一点技巧。\
  \ 将鼠标移出所需区域然后移回也有助于获得正确的标记。 一旦正确的元素被突出显示，请点击鼠标右键以便选择我们想要从该元素中提取的信息。 该元素的上下文菜单将出现，以便我们可以选择不同的条目：\n\
  \n图 2.31 – 录制器中的一个已录制操作\n\n## 重要说明 – 删除额外操作\n\n你可能会有其他操作被录制器记录下来，这取决于你点击的位置和可能按下的键。\
  \ 对于我们的示例，录制器中只能有一个操作。 使用 **Delete** 按钮（垃圾桶符号）删除任何额外的操作。\n\n现在，对书籍的标题重复相同的过程。 使用鼠标将光标悬停在元素和标题上，然后点击鼠标右键：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_64_0.png)\n\n图 2.32 – 从网页元素中提取数据\n\n\
  这次，我们想要提取元素的标题。 这样，我们就捕获了网页上的两个元素，它们在录制器窗口中表示如下：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_65_0.png)\n\
  \n图 2.33 – 录制器中的提取数据\n\n这里有一个重要的区别：PAD 已经识别出我们从网页上的一个记录中捕获了两条信息。 我们的下一步将是转到下一个元素，而这就是一些魔法的开始。\
  \ 如果你重复第一步并标记下一本图书图片并再次提取 Src 信息，PAD 将识别出这种模式并假设你想要对第一个元素做同样的操作。 我们可以在网页上看到这一点，因为\
  \ PAD 已用绿色虚线标记了相应的元素：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_66_0.png)\n\n\
  图 2.34 – 录制器的模式识别\n\n## 模式识别\n\n请注意，有时需要捕获不止两个结构，录制器才会识别出模式。 因此，如果 PAD 没有立即识别出模式，请继续进行下一个元素。\
  \ 识别\n\n还取决于 HTML 的底层结构。 最迟在第三或第四个元素后，模式将被识别。\n\n这意味着 PAD 现在将捕获此页面上的所有元素。 但下一页的书籍怎么办？\
  \ 让我们向下滚动以便可以看到该网站上的分页控件：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_67_0.png)\n\
  \n图 2.35 – 加入导航\n\n我们现在可以使用单个箭头按钮加载下一页。 右键单击以下屏幕截图中显示的元素并选择 Set this element as\
  \ pager：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_68_0.png)\n\n图 2.36 – 在录制中使用分页器\n\
  \n元素现在会带有一个小蓝色的虚线边框，表示分页功能。 查看录制器窗口，这里应该只看到一个元素：\n\nHelp\n\nDone\n\nCancel\n\n#\
  \ 图 2.37 – 已录制的网页抓取操作\n\n如果错误捕获了其他元素，只需删除它们即可。 你现在可以通过点击 Done 按钮停止录制。 现在，已录制的动作将被传输到主\
  \ PAD 设计窗口：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_70_0.png)\n\n# 图 2.38 –\
  \ 将已录制操作传输到设计器\n\n操作列表中还有注释，描述了录制器生成的动作的开始和结束。 让我们通过双击它来更详细地研究 Extract data from\
  \ web page 操作：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_71_0.png)\n\n图 2.39 –\
  \ 显示网页数据提取\n\n这里有趣的部分是 **Extract data from** 和 **Store data mode**。 在流程中第一个操作加载浏览器后，此操作会提取网页上的所有数据，除非我们另有说明。\
  \ 在某些情况下这可能很有用，但对于我们的测试，我们只想提取前 10 页。 点击 **All available** 条目的下拉菜单并将其更改为 **Only\
  \ the first**。 现在会出现另一个文本框，我们可以在其中输入要处理的网页数量。\n\n此示例的最后一个设置是 **Store data mode**。\
  \ 到目前为止，所捕获的数据存储在一个变量中（在我的示例中为 `DataFromWebPage`）。 但当然，还有其他方法可以处理这些数据。 例如，你可以取该变量并在提取网页数据后将其用作另一个操作的输入，或者你可以选择将其存储在\
  \ Excel 中。 因此，点击 **Store data mode** 的下拉菜单并将值从 **Variable** 更改为 **Excel spreadsheet**：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_72_0.png)\n\n图 2.40 – 修改网页数据提取参数\n\n\
  现在，网页数据提取将仅运行前 10 页，获取数据，启动 Excel 并新建一个电子表格，然后将捕获的数据粘贴其中。 现在保存对话框，让表演开始吧。 在我的机器上，提取\
  \ 120 条记录并将其粘贴到 Excel 中花费了 45 秒。\n\n## 总结\n\n安装 PAD 很简单，就像安装任何其他 Microsoft 工具一样。\
  \ 一旦你为 Microsoft 帐户注册，你就可以登录该程序并立即开始创建你的 UI 流程。\n\n建议尝试操作并使用该工具即使是自动化简单的任务。 这将使你更熟悉该程序，正如我在本章中解释的那样。\
  \ 录制器可以为你节省大量工作，并且可用于新的或现有的流程。 尤其是当网页抓取是一项任务时，此工具非常方便。\n\n在下一章中，我们将继续我们的旅程并查看 PAD\
  \ 的编辑和调试功能。\n\n## 进一步阅读\n\n要了解更多本章涵盖的主题，请查看以下资源：\n\n- *Install Power Automate Browser\
  \ extensions:* https://learn.microsoft.com/en-us/power-automate/desktop-flows/install-browser-extensions\n\
  - *Record desktop flows:* https://learn.microsoft.com/en-us/power-automate/desktop-flows/recording-flow\n\
  \n图 3.2 – 操作 kebab 菜单选项\n\n我们有以下选项：\n\n- **Edit**: 这会弹出特定操作的 **Parameter** 对话框。\
  \ 此对话框可能会根据我们使用的操作而变化。 **Launch Outlook** 操作的设置与其他 **Get files in folder** 不同。\n\
  - **Run from here**: 如果我们使用此命令（或 *Alt+F5*），流程将从此操作开始执行。 所有之前的操作都不会被执行。 如果在此之前有其他操作对于所选操作被执行是必要的，这可能会导致错误。\
  \ 但尽管如此，如果流程之前出现错误，你只想从此处开始，这也可能是一个方便的功能。\n- **Undo / Redo / Cut / Copy / Paste**:\
  \ 这些是从其他程序（如 Office）中熟知的编辑功能。\n- **Move up / Move down**: 而不是点击并拖动操作，我们可以使用这些命令或使用快捷键。\n\
  - **Disable action**: 这也是设计流程时非常有用的功能。 它允许你禁用一个操作，使其不会被执行。\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_76_0.png)\n\
  \n\n\n\n\n例如，你可能希望在流程结束时做一些清理工作并删除文件或关闭程序。但是，如果你仍处于设计的中间阶段，你可以禁用这些操作，以便更专注于设计。这在调试流程时也很有帮助（我们将在下一节中进行）。但请注意不要禁用循环或条件语句中的步骤。这些操作用一个开始和一个结束将一个或多个其他操作封装起来。下面的图片显示了一个\
  \ if 条件操作和另一个 if 流程操作。后者条件的对应结束语句被禁用，这导致了错误。\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_77_0.png)\n\
  \n图 3.3 – 禁用操作和错误消息\n\n删除：与其禁用操作，也可以直接删除它，这会将操作及其所有参数设置从流程中移除。\n\n## 参数对话框\n\n一旦我们从\
  \ **Actions** 面板将一个操作拖放到工作区，就会弹出一个对话框，要求我们提供信息——参数对话框。下面的屏幕截图显示了 **Get files in\
  \ folder** 操作的参数对话框：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_78_0.png)\n\n图\
  \ 3.4 – 参数对话框\n\n此对话框显示所选操作的特定参数。由于几乎每个操作都不同，对应的参数对话框也会显示不同的参数。确实有一些操作具有相似的参数，例如\
  \ **Copy file(s)** 和 **Move file(s)**，但这些更多是例外。\n\n参数对话框让你输入操作执行所需的所有必要信息。这些信息可以是文本或数字、下拉菜单的选择、切换开关，例如上一张截图中的\
  \ **Include subfolders**，有时甚至更复杂的信息。\n\n有时，参数也会分为最常用和高级的。它们在对话框首次出现时是隐藏的，但可以通过展开\
  \ **Advanced** 区域来显示。我们也可以在前面的截图中看到此区域。\n\n### 重要说明\n\n参数对话框不会显示操作正常工作所需的必填字段。判断某个参数是否为必填的唯一方法是将其留空并保存操作。缺失的信息将作为错误显示在窗口底部的消息窗口中。UI\
  \ 流程在这些错误被纠正之前不会运行。\n\n操作还可以产生或捕获可在流程中后续步骤中使用的信息。例如，在 *Figure 3.4* 中，**Get files\
  \ in folder** 操作会创建给定文件夹中的文件列表。为了使此信息可供后续操作使用，会生成变量来存储它。在前面的示例中，操作创建了一个名为 **Files**\
  \ 的变量。下面的屏幕截图显示此对话框部分也可以展开：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_79_0.png)\n\
  \n图 3.5 – 展开的变量区域\n\n展开后，可以相应地重命名变量。在这里，我们将变量重命名为 `MySpecialVariable`。命名约定将在下一章中更详细地讨论。如果变量的数据在流程中不会被使用，可以通过按下相应的切换开关来禁用变量的创建。\n\
  \n在为操作提供所有所需信息后，即可保存它。操作产生的变量随后会显示在右侧的 **Flow variables** 区域中。现在，这些变量也可以作为另一个操作的输入来使用。要使用变量作为输入，\n\
  \n我们不会将信息硬编码到参数输入框中，而是使用右侧的 {x} 符号。有关变量的更多信息以及所有细节，请参阅第 5 章。\n\n现在我们知道了设计器窗口的细节，让我们来看看全局菜单选项提供的额外功能。\n\
  \n## 全局菜单选项\n\n我们在上一章中已经涉及过菜单栏。这些功能在我们编辑流程时非常有价值。让我们来看看最重要的菜单选项：\n\n- **File | Save\
  \ / Save As...**：保存流程或使用 Save As... 选项创建副本并为流程提供新名称。\n- **Edit | Undo / Redo**：这些是众所周知的选项，允许你在设计器中撤消或重做任何操作。如果不小心删除了操作，这也非常有用。\n\
  - **Edit | Select all / Clear selection / Invert selection**：工作区中的一个或多个操作可以被 *selected*。如果你点击一个操作，它就会被选中。按住\
  \ shift 键并选择另一个操作时，中间的所有操作也会被选中。现在，这组操作可以被删除、激活或停用，甚至可以一起移动到工作区的其他位置。这些菜单选项处理此选择。\n\
  - **Edit | Go to line**：有时能够立即跳转到特定行会很方便，例如在处理大型流程和许多操作时，或出现错误时，因为错误消息也包含行号。\n-\
  \ **Debug | Toggle breakpoint / Remove all breakpoints**：当选择一个操作时，此菜单选项会在该行放置一个断点。另一种方法是直接点击行号左侧。我们将在下一节中更详细地讨论断点。\n\
  \n如果流程被停止，在该断点之前的所有操作执行结果都会被保留。如图 3.6 所示，断点位于 **Launch Outlook** 操作之后。如果我们现在停止流程执行，Outlook\
  \ 仍会保持打开状态。这种行为在遵循分阶段的流程设计方法时也很方便（参见下一节）。断点在控制变量的值时也非常有用。我们将在下一节中使用断点。\n\n暂停流程的另一种选项是使用\
  \ *pause* 按钮，该按钮在流程运行时可见。实际上，*play* 按钮会变为 *pause* 按钮，如下图所示：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_82_0.png)\n\
  \n图 3.7 – 暂停按钮\n\n这也允许你在不使用断点的情况下在任何位置暂停流程。\n\n## 使用子流程\n\n在每个流程中，我们还可以创建子流程。这是一种将较大的\
  \ UI 流程结构化为不同部分的概念，这些部分反过来可以在主流程中调用和引用：\n\n### 主流程\n\n大型流程带循环\n\n### 主流程\n\n起始操作\n\
  \n子流程中的循环\n\n清理和流程结束\n\n图 3.8 – 分解流程\n\n包含任务整体逻辑的主流程因此变得更易读、更易理解。所有变量都在主流程中可用并且可以更改，无需指定传递参数。甚至可以在子流程中调用不同的子流程，如果你想进一步结构化工作的话。下面的图显示了我们之前示例中的主流程和两个子流程：\n\
  \n### 主流程\n\n### HandlWordDocument 子流程\n\n### WriteToExcel 子流程\n\n### 图 3.9 – 主流程和子流程\n\
  \n子流程存储在流程本身内，只能在包含的流程中使用。如果你查看 **Actions** 面板，你也可以看到有一个 **Run flow** 操作组，其中包含一个\
  \ **Run desktop flow** 操作。此附加选项将在 *第 4 章* 中讨论。\n\n要创建子流程，请点击工作区顶部的 **Subflows**\
  \ 下拉菜单，如下图所示。在下拉菜单中，你也可以看到任何已存在的子流程：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_84_0.png)\n\
  \n### 图 3.9 – 创建子流程\n\n新的子流程会作为主流程旁边的额外标签出现，它开始时有一个空白工作区可供拖入操作。另一个选项是从主流程剪切并粘贴一个或多个操作到子流程中。在主流程中，你现在可以使用\
  \ **Flow control | Run subflow** 操作在相应的参数对话框中指定要运行的子流程。\n\n现在我们已经学习了一些编辑流程的方法，让我们探索如何利用这些技能有效地创建它们。\n\
  \n\n\n\n# 创建有效流程的策略\n\n我们已经在上一节中介绍了流程设计器窗口和菜单选项。在本节中，我们想看看如何利用这些可能性，将其纳入 UI 流程的设计中。\n\
  \n让我们回顾一下第一章中的初始示例。挑战是自动从通过电子邮件发送给我们的多个 Word 文档中提取信息。我们希望将这些信息保存到 Excel 电子表格中以便进一步报告。最终，这个流程大约有\
  \ 22 个操作、13 个流程变量和 2 个输入/输出变量。这个流程已经具有相当大的复杂性，因此让我们探讨如何减少这种复杂性并实现该流程。\n\n## 从简单开始\n\
  \n第一个建议是鼓励你从简单开始并逐步进行。以我们给出的示例为例，只需将 **Launch Outlook**、**Retrieve email messages\
  \ in Outlook** 和 **Process email messages in Outlook** 操作拖到工作区并尝试使用它们。一旦你熟悉了这个主题，就可以继续下一个任务。也可以创建单独的流程来测试，然后将所学知识纳入另一个流程。\n\
  \n## 分解整体任务\n\n在前一个概念的基础上，对于较大的任务，通常将整体任务分解为几个部分是有用的，如 *Figure 3.8* 所示。你可以通过使用子流程来实现这一点。参考我们之前的示例，这可能看起来像这样：\n\
  \n- **Part 1 — message and attachment retrieval:** 我们需要从家长那里检索所有新消息\n- **Part 2\
  \ — processing of each attachment:** 我们想查看每个 Word 文档并提取相关信息以存储在电子表格中\n- **Part 3\
  \ — cleanup and housekeeping:** 关闭所有打开的程序\n\n我们现在可以分别处理各个任务，这立即降低了复杂性。\n\n## 在循环之前先处理单个项目\n\
  \n在我们的示例中，我们希望处理家长发送给我们的多个 Word 文档。我们可以使用 XY 操作来访问列表中的所有文档。\n\n然而，在遍历文档列表之前，我们必须首先为单个文档明确我们想要提取什么数据以及如何存储它。因此，在对所有文档进行循环之前，先用单个文档通过流程并设计这些步骤是有意义的。稍后，可以将循环操作拖到工作区并将单个处理放在其中。为此，你可以简单地拖放所需的操作，正如我们在本章前面学到的那样。\n\
  \n## 禁用以测试步骤\n\n在某个时刻，会出现一个较长的流程，需要反复运行以进行测试。相同的步骤会一遍又一遍地从头到尾运行。然而，如果只需要测试或完善特定部分，则有意义地省略那些不在焦点上的操作。这些操作可以简单地为此目的而停用，并可以使用断点在所需操作处停止。\n\
  \n在我们的示例中，在 **Get files in folder** 操作中列出文档时可能会遇到错误。对于错误检测，Outlook 是否先启动以及是否获取了所有电子邮件并不重要。因此，我们可以简单地为此测试禁用这些步骤。此外，在这种情况下，在\
  \ **Get files in folder** 操作中设置断点是有意义的，以便流程在错误发生时或稍早时恰好暂停。我们可以在以下屏幕截图中看到此条件：\n\n\
  ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_87_0.png)\n\nFigure 3.10 – Disabled actions\
  \ and breakpoint\n\n通过这种方式，本章中学到的技术可用于快速高效地开发和排除 UI 流程的故障。\n\n## 适应可用选项\n\n有时你会有关于流程的绝佳想法，以及如何让日常任务更轻松。但随后你意识到，不幸的是，流程无法按照你想象的方式映射和设计，因为没有合适的\n\
  \n# 基本结构元素和流程控制\n\n流程通常从上到下执行。然而，有时我们需要包含分支甚至重复某些操作。在本章中，我们将研究如何控制处理中操作的顺序，因为控制流程逻辑是其创建的重要组成部分。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- Using conditionals\n- Handling repetitive tasks with Loop\
  \ statements\n- Error handling\n\n## 技术要求\n\n你需要一台安装了 PAD 的工作站，并且应该知道该应用程序的工作原理以及如何创建一个简单的流程。\n\
  \n## 使用条件\n\n条件用于确保在执行操作或一系列操作之前先检查某个状态。它们是编程中的基本概念之一，可以在没有编程知识的情况下构建流程。我们已经在之前的示例之一中使用了条件，在那里我们需要在创建文件夹之前检查文件夹是否存在。条件通常被称为\
  \ `If` 语句。\n\n要使用条件，我们需要将 **Conditionals** 操作组中的一个操作拖到工作区。我们可以在列表顶部找到该操作组，如以下屏幕截图所示：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_90_0.png)\n\nFigure 4.1 – Elements in\
  \ the Conditionals action group\n\n需要注意的是，*Figure 4.1* 中列出的这些操作必须按特定顺序和序列使用。以下小节将解释如何在上下文中使用每个操作。\n\
  \n## 从 If 和 Else 开始\n\n在大多数情况下，当我们需要检查条件时，`If` 语句操作是起点。如果你将 `If` 操作拖到工作区，操作参数对话框会出现并需要信息，如\
  \ *Figure 4.2* 所示：\n\n- **First operand:** 确定我们想要检查什么\n- **Operator:** 确定检查时要使用哪个操作\n\
  - **Second operand:** 确定要与什么进行比较\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_91_0.png)\n\
  \nFigure 4.2 – If action parameter dialog\n\n本质上，这里发生的是我们可以将两个值（第一个和第二个操作数）相互比较（相等或不相等、大于等），然后决定如果它们匹配或不匹配时会发生什么。如果我们现在用一些有意义的值（或一些静态文本用于演示目的）填充第一个和第二个操作数，工作区将如下所示：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_92_0.png)\n\nFigure 4.3 – A generic If\
  \ block\n\n正如我们所见，End 操作已自动放置在 If 操作下方，以标记此块的结束。\n\nDo not disable or delete the\
  \ End block\n\nEnd 关闭块只是另一个操作，它可以被移动、禁用甚至删除。如果你这样做，流程设计器会立即显示一个错误，提示 End 语句丢失。如果你不小心删除了\
  \ End 语句，你可以转到 Flow control 操作组并将新的 End 操作拖到工作区中的正确位置。请注意也要将 End 放在条件块的末尾，而不是仅在\
  \ If 之后。\n\n我们现在可以将其他操作直接拖到此块中。这些操作只有在 If 操作和运算符评估为真时才会被执行。例如，我们可以简单地将 Display message\
  \ 操作拖到块中，如果评估返回 true，则显示消息框。但如果结果为 false 呢？嗯，在这种情况下，除非我们在 If 和 End 语句之间还拖入一个 Else\
  \ 操作，否则什么也不会发生。现在放置在 Else 块下方的所有操作将在 `If` 块评估为 *false* 时执行。为了测试这一点，我们也可以将 **Display\
  \ message** 操作拖到工作区中 `Else` 块下方并显示不同的消息，如以下屏幕截图所示：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_93_0.png)\n\
  \nFigure 4.4 – If-Else block with different messages\n\n另一个重要概念是 `If` 语句可以嵌套；也就是说，在\
  \ `If` 块内，可以放置另一个 `If` 块。我们将在本章的后续部分学习一些示例。\n\n由于比较两个静态值并没有多大意义，我们希望比较存储在变量中的值。我们将在下一章更深入地探讨变量的主题，但为了本章的目的，让我们创建一些简单的变量。为此，使用工作区右侧\
  \ **Input / output variables** 区域的 *plus* 按钮，并选择 **Input**。\n\n\n\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_94_0.png)\n\
  \n图 4.5 – 创建一个新的输入变量\n\n在下面的对话框中，我们有选项为变量指定名称、数据类型和默认值。现在使用此对话框五次来创建以下变量：\n\n| 变量名/外部名称\
  \ | 数据类型 | 默认值 |\n|---|---|---|\n| NumberVar1 | Number | 12345 |\n| NumberVar2 |\
  \ Number | 5 |\n| TextVar1 | Text | The quick brown fox |\n| TextVar2 | Text | fox\
  \ |\n| TextVar3 | Text | 12345 |\n\n表 4.1 – 条件测试的变量列表\n\n以下截图显示了 **Edit input variable**\
  \ 对话框以创建变量，在此例中为 `NumberVar1`。点击 **Save** 按钮保存变量。\n\n## Edit input variable\n\n\
  编辑现有输入或输出变量的属性 More info\n\n变量名: NumberVar1\n\n数据类型: Number\n\n默认值: 1\n\n外部名称: NumberVar1\n\
  \n描述: Add an input description\n\nMark as sensitive\n\nSave Cancel\n\n图 4.6 – 编辑输入变量\n\
  \n最后，你应该能看到所有变量如 *图 4.5* 所示。我们现在可以用这些变量替换 If 语句开头处的静态值。为此，双击 If 块以再次调出参数对话框。现在，我们可以用一些变量编辑第一个和第二个操作数：\n\
  \n- 1. 删除现有的静态值（在我们的示例中为 123）。\n- 2. 按下输入框右侧的 {x} 按钮。这会启动子窗口以选择变量。你应该能看到所有变量\n-\
  \ 3. 为第一个操作数选择 **NumberVar1**。\n- 4. 按下 **Select** 按钮。\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_96_0.png)\n\
  \n图 4.7 – 在操作参数对话框中使用变量\n\n对第二个操作数重复上述步骤并选择 **NumberVar2** 作为变量。最终结果显示在以下截图中：\n\n\
  ## Does not contain, Is empty / Isn’t empty, as well as Starts with / Doesn’t start\
  \ with / Ends with / Doesn’t end with.\n\n比较结果在很大程度上取决于变量的内容。我鼓励你重建本示例中的简单流程并尝试不同的选项，更改运算符和变量的值。通过使用\
  \ Display message 操作，你立即可以看到操作的结果。PAD 在这里非常友好，也允许使用不同类型的变量。\n\n## Use Variables\
  \ of the Same Type\n\n尽管 Microsoft 关于条件语句的文档（https://learn.microsoft.com/en-us/power-automate/desktop-flows/use-conditionals）说明不同，并且在比较文本类型变量与数字类型变量时不会报错。对于此操作，两个变量都需要转换为相同类型。此转换的结果并不总是可预测的，即使在某些情况下结果是有意义的，也建议使用相同类型的变量以避免不一致或意外行为。\n\
  \n## Else If action\n\n有时一个条件操作不足以分支到需要执行的动作的正确路径。使用常规 Else 语句时，该部分中的动作始终作为唯一的替代分支执行，因为条件不会再次评估。\n\
  \n使用 Else If，也可以在 Else 部分定义另一个条件，该条件也可以完全独立于第一个条件。为此，只需将 Else If 操作拖放到开始的 If 块和\
  \ Else 块之间，Else 块必须始终是此构造中的最后一个块。以下示例应说明条件语句的使用。思路如下：\n\n- - 评估某支曲棍球队是否赢得了一场比赛，如果赢了，净胜球是多少。\n\
  - - 这只是一个示例实现，其中球队可以在获胜信息中获得特别认可或公平信息。这只是为了演示 `Else if` 语句的使用，并不意味着一支球队不能同时获胜且非常公平，当然。\n\
  - - 运行此流程时只会显示一条消息。流程完全分支到评估条件为真的部分。如果都不匹配，则分支到 `Else` 分支。你可以在循环内使用多个 `else if`，\n\
  - - 你可以轻松更改变量及其值以测试不同的分支。\n\n条件语句在设计流程时非常有帮助。PAD 创建 UI 流程的简单性使你能够立即上手设计。然而，在更复杂的场景中，退一步在流程图中绘制逻辑也非常有用。多个嵌套的条件语句和\
  \ `Else if` 尤其难以以后维护，因此始终最好尽可能简化逻辑。\n\n## Special If actions\n\n上一节描述的条件概念能够处理硬编码值和变量。但如果我们需要做一些更复杂的事情，例如检查文件是否存在呢？\n\
  \nPAD 为这些目的提供了特殊的 `If` 操作，我们将在相应章节中介绍它们。为了先有个印象，这里列出了特殊 `If` 操作及其功能简要说明：\n\n| 操作名称\
  \ | 位于操作组 | 功能 |\n|---|---|---|\n| `If file exists` | Files | 检查文件是否存在或不存在 |\n|\
  \ Name of the action | Located in action group | Functionality |\n| If Folder exists\
  \ | Folder | 检查文件夹是否存在或不存在 |\n| If service | Windows services | 检查服务是否已停止、已安装或未安装、正在运行或已暂停\
  \ |\n| If process | System | 检查进程是否正在运行或未运行 |\n| If window | UI automation | 检查窗口是否打开或未打开，以及是否为前台窗口\
  \ |\n| If window contains | UI automation | 检查窗口中是否存在特定的文本或 UI 元素 |\n| If image\
  \ | UI automation | 检查屏幕上是否找到选定的图像 |\n| If web page contains | Browser automation\
  \ | 检查网页上是否存在特定的文本或元素 |\n| If text on screen (OCR) | OCR | 检查屏幕上是否出现字符串/字符序列 |\n\
  \n表 4.2 – 特殊 If 操作列表\n\n正如我们在前表中看到的，PAD 提供了大量功能来利用我们流程中的条件动作序列。甚至可以为条件设置多个分支，这将在下一节中探讨。\n\
  \n## Conditionals with multiple branches\n\n有时也需要将一个值分类到多个类别之一，而不是执行单一测试。例如，可以根据达到的百分比确定学校成绩。有多个分支，每个分支都可以列出自己的动作序列。这时我们会使用\
  \ `Switch-Case` 构造。\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_103_0.png)\n\n图\
  \ 4.10 – 使用 Switch-Case 操作评估学生成绩\n\n在前面的示例中，我们可以看到如何使用 `Switch-Case` 构造确定学生成绩。这些操作也位于\
  \ **Conditionals** 操作组中。在前面的示例中，我们希望创建一个流程，根据以下规则根据成绩百分比显示单独的消息框：\n\n- - Grade A\
  \ > 90 – 100%\n- - Grade B > 80 – 89%\n- - Grade C > 70 – 79%\n- - Grade D > 60\
  \ – 69%\n\nGrade F > 0 - 59%\n\n要创建前面的流程，请按照以下说明操作：\n\n- 1. 创建一个名为 `StudentGradePercentage`\
  \ 的输入流程变量，类型为 `Number`，并赋予一些默认值，在我的例子中为 85。\n- 2. 在 **Conditionals** 操作组中找到 **Switch**\
  \ 语句并将其拖到工作区。注意也会创建对应的 `End` 语句。\n- 3. 在该操作的操作参数对话框中，使用 *步骤 1* 中的变量作为要检查的值。\n- 4.\
  \ 从 **Conditionals** 操作组拖动一个 **Case** 操作到 `Switch` 和 `End` 操作之间。\n- 5. 使用 `Greater\
  \ than or equal to (>=)` 作为运算符，并使用值 90 作为比较值。\n- 6. 使用搜索栏或 **Messages** 操作组找到或定位\
  \ `Display message box` 操作，并将其拖到 `Case` 操作正下方。\n- 7. 在该操作对话框中，输入标题和根据成绩的消息。\n- 8.\
  \ 对成绩 `A` 到 `D` 重复 *步骤 4 到 7*，使用不同的值和消息。\n- 9. 对于成绩 `F`，我们使用 `Default case` 操作，它是整个语句中的最后一个操作。我们不需要为此指定任何值。如果之前的条件都不为\
  \ `true`，则会执行此操作。别忘了在这里也放置 **Display message**。\n\n请注意，在 `Switch` 语句中，即使某个值可能适用于多个条件，也一次只执行一个分支，并且将是第一个匹配条件的分支。顺序起决定性作用。例如，如果我先列出\
  \ `Case >= 80` 指令，值 95 将落入其中，对应的操作将被执行，构造将被退出，尽管实际上另一个分支（`Case >= 90`）才是正确的。我们现在已经了解了如何控制\n\
  \n\n\n动作序列，取决于某些条件，无论是单分支还是多分支。下一节将介绍我们需要做什么才能根据参数重复执行某些动作。\n\n## 使用循环语句处理重复任务\n\
  \n在编程语言中，另一个有价值的概念是通过列表迭代或在特定次数内运行一组特定的语句和动作。这也可以在 PAD 中通过使用循环动作来实现。这些位于 **Loops**\
  \ 动作组中。\n\n### 循环动作\n\n让我们从循环动作开始，并为 *Ludo* 桌游创建一个骰子模拟器。在这个桌游中，玩家必须使用在游戏开始前选择的颜色的棋子绕行棋盘。骰子掷三次。如果结果为\
  \ 6，玩家可以移动棋子。如果不是，他们需要再次尝试。以下是模拟此情况的流程：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_105_0.png)\n\
  \n*Figure 4.11 – Roll the dice flow with a loop statement*\n\n以下是前一图中步骤的详细说明：\n\n\
  1. 打开 **Loops** 动作组并找到 `Loop` 动作。将其拖到工作区并设置以下值：\n\n   - **Start from:** 1\n   -\
  \ **End to:** 3\n   - **Increment by:** 1\n\n   这将导致循环执行三次。\n\n2. 我们现在需要创建一个随机数作为掷骰子的结果。使用\
  \ **Actions** 组上方搜索栏搜索 `random` 关键字。你会找到一个名为 **Generate random number** 的动作。将其拖到\
  \ `Loop` 动作正下方。在动作参数对话框中，最小值输入 `1`，最大值输入 `6`。还尝试通过展开 `Variables produced` 区域并双击名称，将默认变量名\
  \ `RandomNumber` 重命名为 `DiceResult`。确保新变量名被百分号包围，像这样：`%DiceResult%`。\n\n3. 现在，我们需要检查结果是否等于\
  \ `6`，这意味着我们将继续游戏并停止再次掷骰子。我们现在将使用本章上一节中的条件来检查 `DiceResult` 的值。如果结果等于 `6`，我们将显示一个消息框确认这一点。\n\
  \n### Important Note\n\n在消息框之后，我们使用 `Exit loop` 动作来停止再次掷骰子。该动作也位于 **Loops** 动作组中，不需要任何额外配置。\n\
  \n4. 在 If 动作的 Else 分支中，我们只想在结果不等于 6 时显示骰子的结果。\n\n请注意，在前面的示例中，我们使用了 Exit loop 动作来离开循环过程。还有一个\
  \ Next Loop 动作，可以在 Loop 动作内部使用。根据动作在 Loop 动作内部放置的位置，所有后续动作将被跳过，并强制进行下一次迭代。\n\n###\
  \ 循环条件\n\n另一种遍历动作列表的方式是使用循环条件动作。在编程语言中，这被称为 while 循环。只要特定条件为真，一组动作就会被重复执行。\n\n在下一个示例中，我们将看到这是如何工作的。以下流程实现了一个猜数字游戏。开始时，会确定一个随机数，用户必须猜出它是什么数字。如果用户输入正确数字，游戏获胜且循环结束；否则，尝试次数会增加。以下是流程的实现：\n\
  \n*Figure 4.12 – The guessing game implementation*\n\n以下是步骤的详细说明：\n\n1. 流程从定义两个变量开始，Counter（一个数字，初始化为\
  \ 0）和 GuessRight（一个布尔值，初始化为 False，用于存储用户猜测的状态），以及一个 Generate random number 动作。为了让用户更容易一些，将在\
  \ 1 到 20 之间生成一个数字并存储在 RandomNumber 变量中。\n\n2. 接下来，将使用循环条件动作。操作参数对话框中的第一个操作数将是 GuessRight\
  \ 变量，我们希望将其与固定值 False 进行比较。这意味着只要 GuessRight 的值为 false（用户未输入正确数字），循环就会继续。\n\n3.\
  \ 接下来，我们想显示一个输入屏幕，允许用户输入数字。我们为此使用 Display input dialog 动作，该动作也位于 Message boxes 动作组中。我们只需在此处输入标题和消息。输入值将存储在名为\
  \ UserInput 的变量中。\n\n4. 用户输入猜测后，我们需要检查随机数是否等于用户输入。我们使用 If 条件来执行此操作。如果两个值相同，我们使用\
  \ Set variable 动作将 GuessRight 变量修改为 true 并显示成功消息。通过修改变量，我们也导致循环结束。\n\n**Set variable**\n\
  \n设置新变量或现有变量的值，创建新变量或覆盖先前创建的变量 More info\n\n| Field | Value |\n| --- | --- |\n|\
  \ Variable | GuessRight |\n| Value | True |\n\nSave Cancel\n\n*Figure 4.13 – Set\
  \ variable action*\n\n5. 在 Else 分支中，我们只是增加用户的尝试次数计数器，如图 4.12 所示，并显示一个消息框。\n\nSpoiler\
  \ alert: 你可以在窗口右侧的 Flow variables 部分看到你需要猜的数字。\n\n### For each\n\n另一个非常常见的场景是遍历给定元素，例如文件夹中的文件，就像我们在之前的示例中已经看到的那样。For\
  \ each 动作用于此目的，并且需要一个项目列表、数据表或数据行作为输入，以便为每个元素执行一组动作。\n\n有一些内置动作已经生成项目列表，例如 Get files\
  \ in folder 或 Get subfolders in folder，但也可以创建自己的项目列表作为变量并使用它们。\n\n我们将在下一章详细讨论变量和列表的主题，并查看如何使用\
  \ For each 动作的示例。\n\n### 流程控制的附加动作\n\n在前面的章节中，我们学习了条件和循环结构，控制流程的基本构建块。在本节中，我们将查看影响流程中动作流程的额外方法。这些动作包含在相应的动作组\
  \ Flow control 中。\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_110_0.png)\n\n*Figure\
  \ 4.14 – Flow control actions*\n\n让我们看看这些动作能带来什么。我们还将在一个示例中看到这些动作的使用：\n\n- **Comment:**\
  \ 此动作可用于在流程中添加注释并记录动作。\n- **End:** 不能单独工作，但如果我们意外删除了属于 `If` 动作或循环的 `End` 动作，我们可以使用此动作来完成流程。\n\
  - **Exit subflow and Run subflow:** 我们已经在一个早期的示例中使用了 **Run subflow**。**Exit subflow**\
  \ 只能在子流程中使用以停止子流程并返回调用它的位置。\n- **Get last error:** 检索流程中发生的最后一个错误并将其存储在变量中以供进一步处理。\n\
  - **Go to and Label:** `Label` 在流程中设置一个标记，即动作列表中的特定位置。通过 **Go to**，可以使用标签将执行流程转移到该位置。例如，可以将\
  \ **Label** 动作拖到流程中的任何位置并将其命名为 `Position1`。使用 **Go to**，我们现在可以说 `jump to the label\
  \ called Position1` 并从那里执行。\n- **On block error:** 允许我们将一组动作封装在块中并最终捕获执行中的错误。我们将在下一节讨论这一点。\n\
  - **Stop flow:** 当此动作执行时立即停止流程。可以配置流程是成功结束还是以错误消息结束。如果是后者，还可以定义错误消息。\n- **Wait:**\
  \ 此动作暂停流程特定秒数。这在流程需要等待程序启动或屏幕刷新时尤其有帮助。\n\n让我们使用我们之前猜数字游戏来制作一个不使用循环语句但利用我们额外流程控制元素的替代实现。流程的工作方式完全相同，看起来如下：\n\
  \n\n\n# 图 4.15 – 第二个猜数字游戏实现\n\n详细流程说明如下：\n\n+   1. 这里，我们插入了注释以便更好地记录流程。\n+   2.\
  \ 在输入对话框之前放置了一个名为 StartOver 的标签动作。这是当答案错误时我们希望执行重新开始的流程位置。\n+   3. Wait 动作会暂停流程一段时间。为了让它更有趣一些，我们可以使用失败尝试次数的计数器作为这里的数值。这意味着用户需要的尝试次数越多，下一次猜测的新消息框出现所需的时间就越长。\n\
  +   4. Go to 动作会跳回到 StartOver 标签并从那里执行。\n\n创建一个新的流程并定义一个简单的文本类型变量，FileToDelete，默认值为\
  \ C:\\deletethis.txt。\n\n接下来，在 File 动作组中定位 Delete file(s) 动作并将其拖到工作区。动作参数对话框会出现，我们可以将变量名作为要删除的文件填入。但在现在按下\
  \ OK 之前，我们希望使用 On error 功能来处理错误。如果我们按下对话框中的相应按钮，它应该看起来像这样（我稍微展开了对话框）在左侧：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_114_0.png)\n\
  \n图 4.16 – On error 对话框\n\n这里我们可以选择两个主要选项：\n\n+   - **Throw error**（右侧）：这是默认设置，会停止流程的运行。\n\
  +   - **Continue flow run**（左侧）：如果我们点击此选项，对话框会变为前一张截图左侧的那个。现在我们可以决定如果发生错误会发生什么。\n\
  \n当我们选择继续流程运行时，我们可以通过该选项下方的下拉框来确定会发生什么。这里，我们有以下选项：\n\n# Delete file(s)\n\n如果动作失败，以下规则将适用\
  \ 更多信息\n\n发生错误时重试动作\n\n# All errors\n\n变量 NewVar {x} 文件在哪里？ {x}\n\nContinue flow\
  \ run\n\nThrow error\n\n异常处理模式\n\n转到下一个动作\n\n# Advanced\n\n文件路径包含无效字符\n\n文件未找到\n\
  \n无法删除文件\n\n返回参数\n\n保存\n\n取消\n\n# 图 4.17 – 高级错误处理\n\n只能有一个部分处于活动状态，可以通过图 4.17 中显示的蓝色盾牌图标来识别。Advanced\
  \ 部分包含与应删除的文件相关的所有可能发生的错误。如果我们选择另一个动作，这些选项会相应改变。但这允许针对某个动作检查特定错误。\n\n在我的示例中，我选择使用\
  \ **All errors** 部分并设置一个名为 **NewVar** 的新变量，其中包含一些附加信息。在这里按下 **Save** 并设计其余流程后看起来像这样：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_117_0.png)\n\n图 4.18 – 带有错误的流程\n\n请注意，第一个动作\
  \ **Delete file(s)** 现在在行号左侧有一个新图标，表示错误处理已激活。我们也可以使用 **Get last error** 动作来获取错误本身并将其存储在另一个变量中，然后在消息框中显示。\n\
  \n现在我们知道如何为动作提供错误处理了。现在，让我们看看如果我们不确定列表中哪个动作会发生错误时该怎么办，以及如何捕获它。\n\n# On block error\n\
  \n我们在之前的示例中看到，为动作定义错误处理并让流程在发生错误时仍运行到结束是很容易的。但如果我们有多个可能失败的动作呢？或者甚至是一组带有某些逻辑的特定动作可能会出错？On\
  \ block error 动作可以在这里提供帮助。此动作允许将一个或多个动作放在此块内并定义发生错误时应做什么。这与我们之前查看的错误处理非常相似，只是没有针对动作特定错误的高级部分。在编程中，这被称为\
  \ try-catch 块。\n\n与之前相同的示例，但现在使用 On block error 动作看起来像这样：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_118_0.png)\n\
  \n图 4.19 – 使用 Onblockerror 的错误处理\n\nOn block error 的动作参数对话框定义与单个动作相同。流程将运行到结束，消息框将显示相应的错误消息。\n\
  \n# 总结\n\n能够控制流程执行对于流程设计师来说至关重要。在本章中，我们学习了如何使用条件和循环以及控制流程的其他方法一起使用。最后，我们研究了如何在流程中处理错误并使流程有序结束。\n\
  \n在本书的其余部分，我们将继续应用本章学到的内容，而下一章也同样如此，在下一章中我们将学习另一个重要概念：变量。\n"
- "# 变量、UI 元素和图像\n\n通常，流程会使用来自外部的输入，无论是传递的值还是需要远程控制的应用程序。在本章中，我们将查看这些输入元素。它们位于设计器窗口的右侧，也是我们可以在此处找到变量、UI\
  \ 元素和图像区域的地方（见图 5.1）。我们将详细介绍以下主题：\n\n+   - 变量到底是什么，有哪些类型的变量？\n+   - UI 元素是什么，它们在\
  \ UI 流程中如何使用？\n+   - 图像在 PAD 的上下文中扮演什么角色，如何使用它们？\n\n这三个主题的共同点是它们都可以作为自动化的输入使用。\n\
  \n# 变量及其使用方法\n\n**变量**是一个可以存储值的对象（或设计元素）。你也可以把它想成一个可重用的组件，可以存储任何值。没有至少一个变量就没有有意义的流程。变量可以在设计器窗口的右侧创建和使用，如下图所示：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_120_0.png)\n\n图 5.1 — 设计器工作区中的变量\n\n\
  在最右侧，还有 UI 元素和图像的符号，我们在本章中也会介绍它们。通过此面板，我们可以搜索变量、创建新的输入/输出变量（见下一节），并检查变量值。以下图显示了同一区域，称为\
  \ **Variable value viewer** 区域，其中包含一些已填充的值和附加功能：\n\n变量始终具有特定类型，例如 **text** 或 **number**。这决定了可以存储在该变量中的数据类型。有多种类型可用，我们将在后续部分深入探讨。\n\
  \n我们可以区分我们自己创建的变量（输入和输出）或由动作创建的变量（流程变量）。这些变量都会显示在相应的区域。让我们逐一查看它们。\n\n# ## 流程变量\n\
  \n这组变量是由流程动作产生的，以便在流程中稍后使用。让我们看一下：\n\n+   - **Run application** 动作（`System` 组）启动给定应用程序并创建一个名为\
  \ `AppProcessId` 的变量，其中包含该应用程序的 Windows 进程标识符。我们可以使用 `Terminate process` 和此变量来关闭应用程序。\n\
  +   - **Get files in folder** 动作（`Folder` 组）创建一个包含该文件夹中文件列表的变量。此列表可用于迭代并读取或修改这些文件。\n\
  +   - **Display message** 动作（`Message boxes` 组）显示一个用于确认（例如 **Ok** 或 **Cancel**）的消息框，因此会创建一个包含所按按钮文本的变量。\n\
  \n流程变量不能直接在设计器中设置。但是，可以使用 `Set variable` 动作为其分配值。根据动作的不同，会创建不同类型和不同类型的变量。在前面的列表中，第一个变量将是\
  \ `number` 类型，而第二个将是 `list` 类型。此类型无法更改，因此我们必须按原样使用这些变量。\n\n让我们创建一个新的流程并仅将 **Display\
  \ message** 动作拖到工作区。在即将出现的对话框中，查看下半部分\n\n\n**生成的变量**部分，并使用向下箭头符号展开。  \n它看起来应该像这样：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_123_0.png)\n\n图5.3 – 流程变量的创建\n\n由于此操作会显示一条消息并提供按钮来关闭对话框，因此会创建一个名为**ButtonPressed**的变量。请注意，我还将**消息框按钮**的值更改为了**OK\
  \ – Cancel**，这样在对话框中就不会只提供一个**OK**按钮，而是两个。`ButtonPressed`变量的值将包含用户将要按下的按钮的名称：**OK**或**Cancel**。这样，流程设计者就可以根据按下的按钮来评估该值并执行相应的操作。Microsoft提供的示例大量使用了此功能。提醒一下，您可以在PAD主窗口中访问这些示例，点击**我的流程**右侧的**示例**即可：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_124_0.png)\n\n图5.4 – Microsoft提供的PAD示例\n\
  \n另外，请注意，我们可以使用相应的切换开关来禁用变量的生成。这适用于PAD中所有可能暴露变量的操作。如果我们对变量的内容不感兴趣，并且在后续处理中不需要它，这样做也是合理的，并且可以使变量列表更清晰（参见*图5.3*）。\n\
  \n为了清晰起见，也可以重用流程变量。假设我们稍后需要在流程中使用另一个消息框。将另一个操作拖入设计器将产生另一个变量——在本例中为`ButtonPressed2`。如果我们不想保留第一个消息框的结果，我们可以将变量重命名为`ButtonPressed`。要做到这一点，我们可以双击对话框中的变量名称并进行更改。这样，我们可以覆盖现有变量的名称，而不是创建一个新变量。但是，我们也可以使用另一种方法，可以在kebab菜单中找到，以及其他操作，如下图所示：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_125_0.png)\n\n图5.5 – 流程变量的选项\n\n可以选择以下操作；每个操作都针对选中的变量：\n\
  \n- **查看**：显示一个包含该变量当前值的对话框。\n- **重命名**：为这个变量赋予另一个名称。\n- **查找使用位置**：在流程中搜索此变量，并在窗口下部的单独窗口中显示结果。这是一个非常方便的功能，可以找到使用变量的所有位置。\n\
  - **标记为敏感**：详见下文说明。\n- **固定**：将此变量固定到窗口顶部。所有其他变量将显示在固定的变量下方。\n\n如果将一个流程变量重命名为现有名称，我们需要确认这两个变量是否应合并。如果我们采用前面两个消息框的示例，并将**ButtonPressed2**重命名为**ButtonPressed**，效果如下：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_126_0.png)\n\n图5.6 – 合并流程变量\n\n合并仅适用于流程变量\n\
  \n合并功能仅适用于流程变量，不适用于输入/输出变量。要更改输入/输出变量的名称，只需编辑它并更改名称，但该名称在所有其他输入/输出变量中必须是唯一的。否则，变量编辑器中会直接显示错误消息。但是，流程变量可以与输入/输出变量同名。流程变量不能被显式删除。当相应的操作（依赖关系将自动设置）从流程中移除时，这些变量会被移除。但是，如果某个操作重用了某个变量（如我们的示例所示），则流程变量将一直保留，直到最后一个使用该变量的操作被移除（这是出于安全原因）。\n\
  \n如果相应的操作被禁用，流程变量也会消失。稍后在流程逻辑中使用此变量的任何操作都将失败。\n\n## 输入和输出变量\n\n我们在前面的示例中使用了输入变量。输入和输出变量使我们能够将外部数据引入流程（输入变量），也可以将数据暴露给外部（输出变量）。后者尤其有意义，例如，当流程是更大体系的一部分，并且需要将某些值返回给另一个云流程时。\n\
  \n我们在前面的示例中使用这些类型的变量来定义一些输入数据，方法是手动设置值（我们在定义变量时可以将其设置为默认值），这在某些情况下非常有用，而流程变量则不能这样做。当我们在流程的不同位置需要相同的数据时，应该为此数据使用变量。\n\
  \n例如，假设我们想要创建一个流程，在特定文件夹中执行一些复杂的文件夹操作和文件移动。这个特定文件夹将用于流程中的多个操作。如果我们出于某种原因想要更改这个基础文件夹，我们需要在许多位置进行更改。相反，可以引入一个变量来存储所有操作都将运行的基础文件路径。更改此变量将导致它在所有使用它的位置更新。\n\
  \n创建变量非常简单。在*图5.1*中，输入/输出变量字段中间有一个小的+号。单击它，我们可以在输入或输出变量之间进行选择。以下创建变量的对话框对于两种类型都是相同的：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_130_0.png)\n\n图5.8 – 一个简单的计算流程\n\n这是此流程的操作列表，具有以下功能：\n\
  \n- 使用**设置变量**操作，将`op1`和`op2`相加的结果赋值给`output1`变量。请注意`%`表示法，我们将在本章后面介绍：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_130_1.png)\n\
  \n图5.9 – 使用带有%表示法的设置变量\n\n创建一个**显示消息**操作，在标题中使用`username`变量，并在消息文本中显示计算结果：\n\n###\
  \ 显示消息\n\n显示一个消息框 更多信息\n\n选择参数\n\n消息框标题：欢迎 %username%\n\n要显示的消息：结果是：%output1%\n\n\
  图5.10 – 显示计算结果\n\n请注意，您可以手动输入变量，也可以使用 {x} 按钮访问变量查看器。现在，保存并关闭流程设计器，然后通过按播放按钮从控制台窗口启动流程。您应该会看到以下对话框：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_132_0.png)\n\n图5.11 – 流程输入对话框\n\n您将看到不同输入的外部变量名称。如果您为操作数输入一些值和一个名称，流程将继续执行，并显示消息框和输出值。\n\
  \n## 变量类型\n\n输入/输出变量可以是简单类型（文本、数字或布尔值），也可以是复杂类型（自定义对象、列表或数据表）。简单类型只能包含一个值（text =\
  \ “some text value”，number = 5，或 boolean = True 或 False），而复杂类型可以包含多个条目甚至记录。这很有意义，特别是当桌面流程是更大场景的一部分时，不仅要传输和处理简单值，还要传输和处理列表和表格。让我们探讨有哪些可用的复杂变量类型。\n\
  \n要使用变量，我们在操作组列表的最顶部有一个专门的操作组，叫做**变量**。在这里，我们会发现许多处理复杂数据类型的操作，但也有一些针对简单类型的操作，例如数字数据类型：\n\
  \n- **截断数字**：允许您提取数值的整数部分或小数部分。\n- **生成随机数**：用于在给定边界内创建随机数。我们在上一章的骰子模拟中使用了这个功能。\n\
  - **增加变量**和**减少变量**：顾名思义。\n\n其余操作与复杂数据类型相关，我们接下来将介绍。\n\n### 列表数据类型\n\n如果需要分别存储多个值，可以使用列表。在编程术语中，这相当于一维数组。可以使用相应的操作**创建新列表**来创建列表，或者定义具有该类型的输入/输出变量。其他操作也会创建列表，例如**从Outlook检索电子邮件**或**获取文件夹中的文件**。当您有一个列表时，使用`for\
  \ each`循环遍历所有项目非常方便。我们在前面的章节中见过。尽管如此，也可以通过索引访问列表的各个成员，索引以0作为第一个元素。语法如下：\n\n```\n\
  %Listname[StartIndex:NumberOfEntries]%\n```\n\n示例：假设有一个汽车列表，包含以下条目：`Mercedes, Aston\
  \ Martin, BMW, Chrysler, Fiat, Toyota, and so on.` `%Cars[0:3]%`表达式会选择`Mercedes,\
  \ Aston Martin, and BMW.` 记住：我们从0开始计数。\n\n我们还有其他可用于列表的操作。要操作列表的内容，我们可以使用以下方法：\n\n\
  - 清除列表\n\n\n\n\n\n- 添加项目到列表\n- 从列表中移除项目\n- 排序列表，洗牌列表\n- 反转列表\n- 从列表中移除重复项目\n\n所有这些都相当自解释，并且会按其名称所暗示的方式执行。它们不会暴露任何额外的变量。\n\
  \n某些操作需要两个列表来运行。这些是合并列表、查找公共列表项和减去列表。然而，这些操作会创建一个新的列表，即相应操作的运算结果。\n\n## 数据表\n\n\
  除了单维列表数据类型之外，我们还可以使用二维或表格型数据表来存储值。你可以将数据表视为一个简单的 Excel 电子表格。有一个特定的操作可以从 Excel 电子表格中读取数据并返回一个数据表。这些操作会创建和操作数据行，它们也位于\
  \ Variables 操作组中，但在 Data table 文件夹下。\n\n要创建数据表变量，我们可以使用创建新的数据表选项。操作参数对话框中包含一个编辑按钮用于定义表格：\n\
  \nFigure 5.12 – Creating a data table\n\n我们可以双击现有列来重命名它们，或按 + 按钮添加新列和行。保存将存储值并返回到操作参数对话框，显示新数据表包含的行数和列数。为了演示数据表的不同操作，我创建了一个包含六行两列的简单表格，并将其命名为\
  \ CarsTable，如以下屏幕截图所示：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_135_0.png)\n\n\
  Figure 5.13 – The Cars table\n\n现在，如果我们想向该表格添加新行，可以使用 **Insert row into data table**\
  \ 操作。在相应的操作参数对话框中，我们需要选择数据表及其 **Into location**。在这里，我们可以选择 **End of the data table**\
  \ 或 **before a row index**，选择后需要指定。添加的新值必须符合特定的语法。要添加一条制造商为 Chevrolet 且国家为 USA 的新汽车记录，我们需要输入\
  \ `%['Chevrolet', 'USA']%`。\n\n我们将在下一节讨论 `%` 记法，但本质上，我们需要在 **New value(s)** 参数中传递一个列表或数据行，并用百分号封装。\n\
  \n**Update data table item** 的工作方式略有不同，因为它只是更新某个特定的单元格或项目。我们需要将列和行号作为参数值传递，以及要设置的新值。\n\
  \n要删除一行，请使用 **Delete row from data table** 并将行索引作为参数传递。\n\n**Find or replace in\
  \ data table** 操作是最复杂的，因为它具有很多功能。如其名称所示，它可以只是查找或查找并替换。可以利用正则表达式查找某些文本，并指定是否使用大小写敏感搜索。此操作的结果是另一个数据表，其中包含匹配项的列和行作为单独记录。\n\
  \n让我们看一下以下示例，看看它是如何工作的。\n\n基于 Cars 表，我们想要插入包含一辆新汽车的新行。现在，我们想在所有位置将文本 USA 替换为 United\
  \ States。我们可以创建一个如下所示的流程：\n\nFigure 5.14 – Working with data tables\n\n这里使用了 **Find\
  \ or replace in data table** 操作来查找术语 USA 的所有出现。我将其配置如下：\n\n**Main**\n\n| Action\
  \ | Description |\n| --- | --- |\n| Create new data table | Create a new data table\
  \ and store it into CarsTable |\n| Insert row into data table | Appends the row\
  \ `['Chevrolet', 'USA']` at the end of CarsTable |\n| Find or replace in data table\
  \ | Finds all items in CarsTable containing the text `'USA'` and stores the matched\
  \ cells into DataTableMatches |\n| For each CurrentItem in DataTableMatches | |\n\
  | Update data table item | Updates the data table CarsTable at row index `CurrentItem['Row']`\
  \ and column `CurrentItem['Column']` with the value `'United States'` |\n| End |\
  \ |\n\n## Variables\n\nSearch variables\n\nInput / output variables 0\n\nThere aren't\
  \ any input or output variables here yet\n\nFlow variables 3\n\n- CarsTable\n- CurrentItem\n\
  - DataTableMatches\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_138_0.png)\n\nFigure\
  \ 5.15 – The Find and replace in data table action\n\n此操作会创建一个名为 **DataTableMatches**\
  \ 的新数据表，在我们的例子中包含两条记录，即美国汽车的记录。流程运行后双击此变量会显示此表格的内容：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_141_0.png)\n\
  \nFigure 5.18 – The data table before and after the update\n\n### Find and replace\
  \ with “Replace” mode\n\n请注意，我们本可以使用“Replace”模式的 Find and replace 操作，而不是仅查找。通过这样做，我们可以在参数操作对话框中确定用于替换的文本片段。这将是一种更方便的方式来替换数据表中的文本，我们就不需要遍历此操作产生的数据表了。但有时，我们只需要查找给定的文本片段，而不直接用其他文本替换它或执行更复杂的操作。前面示例中展示的技术就可以用来完成这些任务。\n\
  \n这个小例子说明了数据表的工作方式。在本书中，我们还将使用其他会产生数据表的操作。它们如下：\n\n- Read from Excel worksheet (the\
  \ Excel action group)\n- Execute SQL statement (the Database action group)\n- Extract\
  \ data from web page (the Browser automation action group in the Web data extraction\
  \ subfolder)\n\n这些操作将在相应的章节中介绍。\n\n## 自定义对象\n\n到目前为止，我们查看的数据类型都表现出相似的结构，例如数据表，其中相关记录始终具有相同的结构。然而，我们也可以使用一种称为\
  \ **object** 的数据类型，它由一组属性和相关值描述。让我们以本章前面出现的 `cars` 示例为例。例如，一辆汽车具有以下属性：品牌、颜色、制造年份、车辆类型等。有一段时间以来，所谓的\
  \ **JavaScript Object Notation (JSON)** 格式在此类对象的表示中占据主导地位。这可能看起来如下：\n\n```\n{\n\
  \  'Brand': 'BMW',\n  'Color': 'blue',\n  'year of manufacture': '2020',\n  'type\
  \ of vehicle': 'SUV'\n}\n```\n\n可以为自定义对象创建输入/输出变量。你所要做的就是选择 **Custom object** 作为数据类型。然后，你可以在单独的对话框中编辑对象的数据：\n\
  \n**Tip:** If you want to have a readable JSON file that you can easily edit, you\
  \ can use the free JSON Formatter at https://jsonformatter.org/.\n\nFigure 5.19\
  \ – Creating and editing a custom object\n\n当我们需要创建与某些外部 Web 服务通信的流程时，此数据类型特别有用，这些服务期望或返回\
  \ JSON 对象。我们将在本书后面发现这一点。\n\n要将自定义对象转换为有效的 JSON 字符串，我们可以使用 Convert custom object\
  \ to JSON 操作，它期望自定义对象作为输入并生成包含 JSON 字符串的新变量。反向操作是 Convert JSON to custom object。两个操作都在\
  \ Variables 操作组中。我们将在本书后面查看这些操作的使用示例。\n\n## 文本数据类型及对应操作\n\n我们现在已经了解了 PAD 自带复杂的复杂数据类型。文本数据类型不属于这一组数据类型，但有大量操作仅处理此数据类型。因此，从我的角度来看，在这里简要提及是有意义的。\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_143_0.png)\n\n这些操作位于 Text 操作组中，执行你期望文本编辑器完成的所有任务，并且在流程设计中非常有用。其中包括\
  \ Split text、Get subtext、Crop text 等等。我想特别强调 Recognize entities in text 操作，它能够使用\
  \ AI 从一段文本中提取某些实体。我鼓励你为此目的尝试 Microsoft 的相应示例。为此，切换到 Console 窗口并进入 Examples 部分。在\
  \ Text Manipulation 标题下，你会找到一个名为 Extract phone numbers and emails from text 的条目。编辑此流程并查看调用，以体验首次与\
  \ PAD 交互时 AI 的强大功能。\n\n## % 记法\n\n在我们之前看到的所有示例中，我们都需要使用 % 记法，每当我们想使用变量时都需要它。变量或其中包含一个或多个变量的表达式必须始终用\
  \ % 字符括起来，因为正是这部分会被 PAD 评估。在两个 % 字符之间，可以使用变量或硬编码值一起使用简单的算术运算、逻辑比较或表达式。以下是一些示例：\n\
  \n- `%CarName%`: Returns the content of a variable called `CarName`.\n- `%'CarName'%`:\
  \ Please notice the quotes. This returns the hard-coded `CarName` value.\n- `%Counter\
  \ + 1%`: Returns the value of the `Counter` variable increased by 1.\n- `%(Counter\
  \ + 1) > 15%`: Makes use of parenthesis and returns a Boolean value of `True` if\
  \ the `Counter` variable has a value of 15; otherwise, it returns False.\n- `%NettoPrice\
  \ + VAT%`: Returns the sum of the values of the `NettoPrice` and `VAT` variables.\n\
  \n### Using the % sign as a simple character\n\n\n\n\n\n有时，我们可能想使用 % 符号而不是在表达式中，而只是作为一个普通字符。在这种情况下，可以通过另一个百分号（%%）来转义该字符。\n\
  \n这种记法非常直接易用，有时在我们本应只放置变量本身的字段中直接进行简单计算非常方便。除此之外，在这些表达式中，还可以使用变量的数据类型属性。这指的是由非内置数据类型提供的那些属性。例如，日期、列表、文件、文件夹、Outlook\
  \ 消息、Web 浏览器实例等。例如，**获取文件夹中的文件** 操作会返回一个文件列表，每个文件都是 **File** 数据类型。我们可以遍历此列表，并在名为\
  \ `currentItem` 的变量中保存当前项，以访问以下等属性：\n\n- `% currentItem.FullName%` 包含文件的完整路径\n-\
  \ `% currentItem.Size%` 是文件的大小（以字节为单位）\n\n请参阅 *进一步阅读* 部分，以获取所有数据类型及其属性的官方文档链接。\n\
  \n变量和 % 记法是创建流的极其重要部分。熟悉这一概念以及如何创建和操作变量至关重要。现在，让我们看看如何创建 UI 元素以远程控制外部应用程序。\n\n##\
  \ 识别和创建 UI 元素\n\n在 *第 1 章* 中，我们了解到 PAD 来自 **机器人流程自动化（RPA）** 领域，这涉及远程控制本地应用程序。正是这些应用程序提供了可用于流程处理的输入选项。这些输入选项由\
  \ PAD 识别\n\n## 图 5.20 – 使用录制器捕获 UI 元素\n\n如你所见，我使用了按钮序列 3，然后是 *（乘以），然后是 9，后跟 =（等于按钮），最后点击结果文本字段内部。\n\
  \n现在你可以在录制器中按下 Done 按钮，将捕获的元素传输到流程设计器。UI 元素窗格应如下所示：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_148_0.png)\n\
  \n图 5.21 – UI 元素层次结构\n\n现在我们有了一些 UI 元素，也可以演示其用法。PAD 为不同 UI 元素提供了专用操作。由于我们捕获了按钮，因此可以使用\
  \ Press button in window 操作（UI 自动化 | 表单填充 操作组）来模拟 PAD 的计算。只需将此操作四次拖入设计器并选择正确的 UI\
  \ 元素序列。应如下所示：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_149_0.png)\n\n图 5.22 –\
  \ 模拟计算的流程\n\n我们也可以使用 Get details of the UI element in window 操作来提取结果文本字段的数据以在其他地方使用。执行此流程将根据流程中的序列神奇地按下按钮。这就是\
  \ UI 自动化。\n\n也可以为桌面图标或任务栏图标创建 UI 元素。结合 UI 自动化操作组中的操作，这为我们提供了广泛的自动化选项。\n\n然而，不仅 Windows\
  \ 应用程序可以被远程控制。PAD 还可以访问和远程控制 Web 应用程序和页面。流程与 Windows 应用程序相同。但是，必须为所使用的浏览器安装相应的浏览器扩展，以便\
  \ PAD 能够识别 Web 元素。Microsoft 提供了\n\n适用于 Google Chrome、Mozilla Firefox 和 Microsoft\
  \ Edge 的浏览器扩展（有关更多信息，请参阅 *进一步阅读* 部分）。\n\n虚拟桌面也可以纳入自动化。然而，要在其中识别 UI 元素，也需要一个小型扩展——所谓的虚拟桌面\
  \ Power Automate 代理。有关此内容的更多信息可在本章的最后一节以及 *进一步阅读* 部分找到。\n\n因此，识别 UI 元素发挥着非常重要的作用，以便可以执行相应的操作，例如点击或\
  \ *按下按钮*。PAD 将每个 UI 元素在所谓的 selector 下进行层次化排列，并分配名称和属性，使该元素在相应应用程序和操作系统中唯一。双击创建的\
  \ UI 元素会显示该选择器及其属性，如下图所示：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_150_0.png)\n\
  \n图 5.23 – Windows 按钮的选择器视图\n\n也可以创建选择器并禁用元素的现有选择器。这在测试时尤其有帮助，因为正确识别 UI 元素对自动化至关重要。\n\
  \n我们将在 *第 6 章* 中查看更多细节和示例。\n\n## 如何在 PAD 中使用图像\n\n正如我们在上一节中所了解的，PAD 可以通过特定的选择器识别\
  \ UI 元素。但在某些情况下，我们需要其他机制来执行某些操作，例如将鼠标移动到特定位置并执行操作。这时图像就派上用场了。我们有以下使用图像作为输入的操作：\n\
  \n- **if image** 检查屏幕上是否存在图像\n- **Wait for image** 等待图像出现在屏幕上或从屏幕上消失\n- **Move mouse\
  \ to image** 将鼠标移动到屏幕上的图像\n\n结合 **Send mouse click**，甚至可以在不知道 UI 元素的情况下执行操作。这种技术也很有用，如果我们需要在没有代理的虚拟或远程桌面上进行自动化，例如\
  \ Linux 或 Unix。任何系统上的任何程序都可以通过这种技术远程执行和控制。因此，例如，如果有一个在 Linux 系统上运行且没有任何 API 的业务应用程序，也可以用\
  \ PAD 自动化该程序。\n\nPower Automate agent for virtual desktops\n\n运行 PAD 的计算机原则上也可以远程控制\
  \ **远程桌面协议（RDP）** 会话。如果远程系统也是 Windows 系统，可以在该系统上安装 Power Automate agent for virtual\
  \ desktops。这使得在 RDP 会话内也能使用 UI 元素成为可能。这适用于 Citrix 和 Microsoft Remote Desktop。\n\n\
  对于所有其他操作系统，你只能使用 PAD 图像进行远程控制。\n\n要创建或捕获图像，我们可以使用流程设计器窗口最右侧的第三个选项，它会显示图像区域。按下 **Capture\
  \ image** 按钮即可让你在屏幕上点击并拖动选择区域。这由放大镜支持，以便尽可能精确。释放鼠标后，你将被提示为图像输入名称。如果我们对屏幕上任何所需区域执行此操作，我们将很快拥有一个图像库，可以使用\
  \ PAD 操作进行操作。\n\n以下基本示例演示了图像的用法。因此，我通过 Microsoft Remote Desktop 程序访问 Linux 会话。对于此演示，我只想在该会话中启动文件资源管理器。为此，请执行以下步骤：\n\
  \n- 1. 导航到 **Activities** 菜单并左键单击它。\n- 2. 等待任务栏出现。\n- 3. 按下文件资源管理器的按钮，如下图所示：\n\n\
  ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_153_0.png)\n\n图 5.24 – 远程控制 Linux 系统\n\n\
  为了能够做到这一点，我需要通过前面描述的流程在 PAD 中创建两个图像：一个用于 Activities 菜单项，另一个用于文件资源管理器图标。下图显示了执行此操作所需创建的流程：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_154_0.png)\n\n图 5.25 – 流程中的图像\n\n让我们看一下流程的各个步骤：\n\
  \n- 1. **Move mouse to image**：要使用此操作，需要提供图像——在本例中为 **Activities** 图像。此操作还允许我们在移动后直接发送鼠标点击。此外，我使用了高级图像识别算法在屏幕上查找图像：\n\
  \n\n\n\n\n- Power Automate 浏览器扩展：https://learn.microsoft.com/en-us/power-automate/desktop-flows/install-browser-extensions\n\
  - 在虚拟桌面上自动化：https://learn.microsoft.com/en-us/power-automate/desktop-flows/virtual-desktops\n\
  - 在虚拟桌面上自动化：https://learn.microsoft.com/en-us/power-automate/desktop-flows/virtual-desktops?source=recommendations\n\
  \n## UI 自动化的操作\n\n在上一章中，我们学习了 UI 元素以及它们如何识别应用程序交互的区域。在本章中，我们将重点介绍 PAD 可以通过 UI 元素操作实现的功能。这包括涵盖以下内容：\n\
  \n- 探索不同的 UI 操作及其用途\n- 使用 UI 操作实现数据交换（提取数据和表单填写）以及两个应用程序之间的自动化\n\n到本章结束时，你将了解识别必要的按钮和\
  \ UI 元素所需的内容，并通过 UI 操作触发它们，以安全可靠地重复所需任务并在流程中配置它们。\n\n### 为什么我们需要 UI 操作？\n\n随着时间的推移，创建了无数适用于\
  \ Windows 的应用程序，其中许多至今仍然存在。微软本身也创建了出色的选项，可以使用 Visual Basic 和 Visual Studio 等工具定制你的应用程序。然而，其中许多应用程序仍然无法通过\
  \ API 访问，必须手动操作——也称为人机界面。\n\n正如我们将在本书后面看到的那样，PAD 可以直接与众多广泛使用的标准应用程序（如 Office 和 Outlook）一起工作，但不可能用专用操作覆盖各种不同的应用程序的丰富内容。而这正是\
  \ UI 元素操作存在的理由。术语 **UI 自动化** 指的是 PAD 的通用能力，可以与任何应用程序窗口一起工作，从而远程控制任何应用程序和控制元素。\n\n\
  为了强制执行这种非常通用的方法，该操作组中的操作相应地通用，可以分为以下几部分：\n\n- 识别一个窗口\n- 与应用程序控件交互\n- 从窗口中提取数据\n\
  - 在窗口中填写数据\n\n在深入另一个示例以利用这些操作之前，让我们先仔细看看每个操作。\n\n### 识别一个窗口\n\n我们需要做的第一件事是获取我们想要控制的应用程序的窗口。我们已经知道有几种启动程序的方法，例如使用\
  \ *run application* 操作或使用 Excel 或 Outlook 等程序的专用操作。以下操作可识别窗口或使其可供 PAD 访问，尤其是在与其他窗口结合使用时：\n\
  \n- **Get window/focus window**：可在 **Windows** 子组中找到。你可以获取或聚焦正在运行的窗口并返回标题和/或窗口句柄。\n\
  - **Set window state/set window visibility**：可在 **Windows** 子组中找到。你可以将窗口的状态设置为 **restored**、**maximized**\
  \ 或 **minimized**，从而隐藏窗口或使其再次可见。\n- **Move/resize/close window**：也在 **Windows**\
  \ 子组中，此操作可通过提供 *X* 和 *Y* 坐标将窗口移动到桌面的特定位置，可将窗口大小更改为特定宽度和高度，或直接关闭窗口。\n- **If window/wait\
  \ for window/wait for window content**：此操作根据窗口是否打开/聚焦与否，在条件块中执行操作，等待窗口打开/关闭/成为焦点/失去焦点，并等待应包含在窗口中的特定\
  \ UI 元素。\n\n这些操作在应用程序打开或操作期间可能存在延迟的情况下尤其有帮助。如果 PAD 要访问尚未显示的 UI 元素，则可以使用这些操作等待元素出现。\n\
  \n### 与窗口交互\n\nPAD 还需要能够远程控制应用程序。这意味着单击按钮或区域或拖放元素。这可以通过以下操作实现，这些操作不言自明：\n\n- Select\
  \ a tab in a window\n- Hover the mouse over a UI element in a window\n- Click on\
  \ a UI element in a window\n- Drag and drop a UI element in a window\n- Expand/collapse\
  \ a tree node in a window\n\n这些操作使用之前已定义的 UI 元素；例如，使用录制器。在本章的示例中，我们将使用其中一些操作来远程控制应用程序。\n\
  \n### 从窗口中提取数据\n\n我们在之前的示例之一中使用了一些这些操作，在其中提取了 Word 文档中复选框的值。提取应用程序数据时还有更多可能性：\n\n\
  - **Get the details of window**：此操作会生成一个包含窗口属性（如其标题或源文本）的变量。所需属性可在操作对话框中选择。\n- **Get\
  \ the details of a UI element in a window**：此操作与前一个操作相同，只是它针对特定 UI 元素以及不同的数据库和 Windows\
  \ 桌面应用程序。此场景在下图中说明：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_162_0.png)\n\n图\
  \ 6.1 – Orders to Invoices 结构视图\n\n在此场景中，使用 MS Access 创建了一个数据库应用程序。此应用程序可能通过网络共享被多个用户使用，并包含有关客户和供应商的信息。用户还可以在此数据库中存储来自客户的订单，但出于某种原因，客户的发票需要通过另一个应用程序处理。此应用程序是一个在用户桌面上运行的\
  \ Windows 可执行程序。\n\n### Microsoft Access 数据库作为源系统\n\n我们在本示例中使用的数据库是微软提供的一个示例数据库。从\
  \ Windows 程序任务栏启动 MS Access 也会提供大量示例数据库，其中 *Northwind* 数据库是其中之一。我们可以使用搜索功能查找此示例，双击它，并将其本地存储在我们的\
  \ `Documents` 文件夹中。\n\n此数据库包含大量功能，从具有不同用户角色的可能性和输入数据的漂亮对话框开始（见下图）：\n\nNorthwind\
  \ Login\n\nSelect Employee\nAndrew Cencini\nLogin\n\nNorthwind Traders\n\nI am:\
  \ Andrew Cencini\n\n- Quick Links\n- View Inventory\n- View Orders\n- View Customers\n\
  - View Purchase Orders\n- View Suppliers\n- View Employees\n- View Shippers\n- Sales\
  \ Reports\n\nActive Orders\n\n| Status | Date | Customer |\n| --- | --- | --- |\n\
  | New | 25/04/2006 | Company C |\n| New | 25/04/2006 | Company D |\n\nInventory\
  \ to Reorder\n\n| Product | Qty Available | Reorder Level |\n| --- | --- | --- |\n\
  | Northwind Traders Boysenberry Spread | 0 | 25 |\n| Northwind Traders Dried Pears\
  \ | 0 | 10 |\n| Northwind Traders Curry Sauce | 0 | 10 |\n| Northwind Traders Fruit\
  \ Cocktail | 0 | 10 |\n| Northwind Traders Scones | 0 | 5 |\n| Northwind Traders\
  \ Beer | 0 | 15 |\n| Northwind Traders Clam Chowder | 0 | 10 |\n| Northwind Traders\
  \ Chocolate | 0 | 25 |\n| Northwind Traders Gnocchi | 1 | 30 |\n\nOrder List\n\n\
  Add New Order\n\n| Status | Salesperson | Customer | Ship Date | Shipping | Taxes\
  \ | Total |\n| --- | --- | --- | --- | --- | --- | --- |\n| New | Nancy Freehafer\
  \ | Company A |  | 0.00 € | 0.00 € | 1,674.75 € |\n| New | Nancy Freehafer | Company\
  \ A |  |  |  | 736.00 € |\n\nOrder # (New)\n\nOrder Details\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_165_0.png)\n\
  \n图 6.2 – Northwind Access 应用程序\n\n在我们的示例中，我们假设多个用户会将订单添加到数据库中。但要创建发票，数据必须传输到开票应用程序。两个应用程序都没有内置将数据传输到其他地方的能力。\n\
  \n将 Access 数据库作为核心应用程序之一是非常常见的场景，在小型甚至有时较大的公司中也是如此。这对于我们场景中将要使用的第二个应用程序也是如此。\n\n\
  ### Windows 可执行文件作为目标系统\n\n我们将使用微软提供的一个示例应用程序 Contoso Invoicing 作为目标系统。这只是一个普通 Windows\
  \ 应用程序的示例，具有导航树、菜单、工具栏以及用于查看和捕获数据的一些表单等特定特征。请参阅进一步阅读部分，了解有关如何安装此应用程序的更多详细信息，其外观如下：\n\
  \n\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_166_0.png)\n\n**图 6.3 – “Contoso\
  \ 发票”应用程序**\n\n安装过程中还会创建一个桌面图标，我们很快就会用到它。这里还需要说明的是，安装程序还会提供一个 Excel 工作簿，其中包含此应用程序的所有数据。该文件位于标准用户的文档文件夹中，路径为\
  \ Contoso Invoicing - 1.0.15.0。我们可以根据需要修改此 Excel 工作簿，例如再次删除示例数据。\n\n要创建发票，我们必须调用导航树中的“发票”菜单项，如前一张屏幕截图所示，然后输入数据。这概括了中小型企业中一种非常典型的设置示例。\n\
  \n## 分解工作流\n\n这是一个并不简单的流程，因此最佳实践是将其拆分成更小的部分。由于 UI 元素交互始终会使用大量操作，这些较小的流程将更易于维护和测试：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_167_0.png)\n\n**图 6.4 – 分解“订单到发票”工作流**\n\
  \n1. 要确定需要创建哪些新发票，我们首先需要在 Northwind 数据库中识别这些订单，并将订单存储在数据表中。接下来，我们必须遍历此数据表，并在 Contoso\
  \ Invoicing 应用程序中创建新发票。每张新发票都会生成一个发票 ID，我们也可以将其保存到数据表中。\n2. 最后一个例程会获取这些新的发票 ID，并使用相关信息更新数据库。\n\
  \n提示：这三个例程被拆分为以下子流程。这样做的原因是，可以识别与特定操作相关的问题，并改进流程的维护：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_167_1.png)\n\
  \n**图 6.5 – “订单到发票”的子流程**\n\n要创建整个工作流，我们需要应用本书中讨论的所有知识，包括流程控制、变量和 UI 元素。下面来看看可以使用哪些不同的子流程来完成这些任务。\n\
  \n### GetNorthWindNewOrders 子流程\n\n在此子流程中，我们希望启动数据库应用程序，并最终获取数据库中所有新到达订单的列表。\n\n\
  要远程控制该应用程序，我们需要定义或捕获相应的 UI 元素，以便实现所需的结果。在上一章中，我们学习了如何完成此操作。此外，还需要定义一些变量。以下是获取新订单的详细流程：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_168_0.png)\n\n**图 6.6 – 提取新订单的子流程**\n\
  \n以下是对不同步骤（行号）的说明。\n\n*步骤 2* 使用 Northwind 数据库启动 Microsoft Access。这里使用了两个变量。`MSAccessApp`\
  \ 包含 Microsoft Access 可执行文件的完整路径，而 `NorthWindDB` 包含数据库本身的路径。\n\n在*步骤 3*中，我们使用第一个\
  \ UI 操作，称为**等待窗口**。旧程序或性能较低的计算机（处理器、RAM 等）在启动程序时可能会有一定延迟。此操作会暂停流程，直到指定窗口出现。在本例中，流程会等待登录屏幕出现。登录窗口之前已被捕获为\
  \ UI 元素。\n\n*步骤 4*会触发登录按钮的单击操作。如*图 6.2*所示，数据库应用程序首先要求用户登录。这里，我们只需选择第一个用户，然后按下登录按钮。\n\
  \n现在，我们应该等待主应用程序窗口出现。因此，在*步骤 5*中，我们再次使用**等待窗口**操作。\n\n在*步骤 6*中，我使用图像来定位应用程序右侧的**查看订单**链接。记录器无法将其检测为独立的\
  \ UI 元素，因此我必须使用 PAD 的图像功能将鼠标移动到该链接并单击它。这是一个很好的示例，说明 PAD 甚至可以处理这类情况。\n\n在*步骤 8 到\
  \ 11*中，我使用 MS Access 功能区按钮筛选订单列表，使其只包含新订单，然后选中所有新订单并将其复制到剪贴板。这样，便可以在下一个子流程中解析其内容。\n\
  \n请注意，此时我们并没有关闭应用程序。\n\n### ExtractNewOrders 子流程\n\n此时，我们只有剪贴板中的一些文本。但要遍历新订单列表，我们需要以某种方式将这些文本转换为数据表。下图展示了相应流程以及实现方法：\n\
  \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_170_0.png)\n\n**图 6.7 – 从剪贴板文本生成数据表**\n\
  \n在步骤 1 中，我们通过使用剪贴板操作组中的“获取剪贴板文本”操作，将剪贴板文本存储到文本变量中。现在，我们可以将该文本拆分为文本列表（步骤 3）。\n\n\
  接下来，我们创建一个具有正确列的数据表变量。这些列包括 MS Access 订单表中的所有列，以及一个额外的发票 ID 列，该 ID 稍后由 Contoso Invoicing\
  \ 应用程序生成：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_171_0.png)\n\n**图 6.8 – 内部订单数据表定义**\n\
  \n在步骤 5 中，我们开始遍历文本列表。对于列表中的每个条目，都需要再次拆分文本，以获取每一列的单独值。这些值会在步骤 7 中存储到数据表中。\n\n最后，我们需要清理数据表并删除前两行（第\
  \ 1 行为空行，是在定义数据表时创建的；第 2 行包含剪贴板文本中的列标题信息）。\n\n现在，我们就有了一个包含所有新订单的数据表，可以对其进行处理。\n\n\
  ### InvoiceOrders 子流程\n\n此子流程负责在 Contoso Invoicing 应用程序中创建发票。这里，我们也需要首先识别相应的 UI\
  \ 元素，例如“发票”树节点、新建按钮（加号图标）、保存按钮（加号图标）等。下图展示了所需的 UI 元素：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_172_0.png)\n\
  \n**图 6.9 – Contoso Invoicing 中的 UI 元素**\n\n如我们所见，我们需要更多 UI 操作来填充数据并提取数据。下图展示了为我们完成所需步骤的流程：\n\
  \n- 保存\n- 运行\n- 停止\n- 运行下一个操作\n- 记录器\n- 子流程\n- 主流程\n- ExtractNewOrders\n- GetNorthWindNewOrd...\n\
  - InvoiceOrders\n- WriteBackInvoiceIDs\n\n| 步骤 | 动作类型 | 动作详情/注释 |\n|------|---------|---------------|\n\
  | 1 | 运行应用程序 | 使用参数运行应用程序 ContosoInvoiceApp，并将其进程 ID 存储到 ContosoInvoiceAppID |\n\
  | 2 | 等待窗口 | 等待窗口 Window 'Contoso Invoicing' 打开 |\n| 3 | 在窗口中单击 UI 元素 | 单击 UI 元素\
