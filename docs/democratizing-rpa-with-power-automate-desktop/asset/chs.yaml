  ## 总结


  本章表明，PAD 可以集成和自动化没有 API 的应用程序。能够处理带接口的系统使 PAD 成为完整且自给自足的自动化工具，因为通常在自动化场景中，既需要集成旧版应用程序，也需要集成带接口的现代应用程序。本章介绍的操作使
  PAD 能够执行原本由云流覆盖的所有任务，例如包含 Web 服务、传输和接收数据以及在 UI 流中进一步处理。这使得 PAD 非常适合作为中小型集成和自动化任务的唯一工具。然而，在某些情况下，这也可能变得复杂，例如，无法为
  Web 应用程序使用专用连接器，而专用连接器可以隐藏很多复杂性。此外，在本地计算机上使用 PAD 几乎无法扩展。


  在下一章中，我们将更详细地了解如何应对这些挑战，并看到一个示例，说明这里介绍的操作如何发挥作用。


