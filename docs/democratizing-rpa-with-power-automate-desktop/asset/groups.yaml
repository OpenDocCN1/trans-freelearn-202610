  mdcn: '


    ## 章节前提条件


    在本章中，我们将学习 PAD 的功能，其中大部分仅在 Premium RPA 功能下可用。这需要相应的许可证，也在 *合规* 部分有更详细的描述。Microsoft
    为这些功能提供 30 天试用期，适合尝试这些功能。


    此外，在此类场景中通常会使用多台本地或虚拟 Windows 机器，例如用于测试负载均衡。更多信息请参阅 *安装和部署* 部分。


    ## 企业中的典型需求


    到目前为止，我们一直专注于 PAD 的功能，并查看了应执行特定任务的单个 UI 流程。这使我们能够查看某个业务流程的自动化选项，并使用 UI 流程实现它们。然而，在企业环境中，今天的许多组织通常都有额外的挑战，我们将对其进行详细研究。


    ## 超自动化


    自动化业务流程通常需要同时考虑传统技术和新技术。公司的应用环境往往非常多样化，从云和本地系统开始，到有 API 和无 API 的应用、现有的工作站和移动应用、用于大规模数据处理的应用等等。这可能还需要一套工具来连接和自动化所有这些应用，而且在大多数情况下，已经在使用各种工具。这里建立统一的方法通常需要使用能够处理
    API、UI（RPA）和 AI 的技术。这个三元组合催生了 **超自动化** 这一术语，通过这个工具箱，可以实现比较以满足任何自动化需求，从而变得更高效、更具生产力。


    ## 开发方面


    正如我们所知，PAD UI 流程是使用相应的 Windows 应用程序开发的。我们也知道该应用程序始终连接到 Power Platform 环境。UI 流程在物理上存储在此处。对环境的访问通过用户进行控制。重要的是要考虑与
    Power Automate Desktop 以及所有其他 Power Platform 组件一起使用的环境策略。除此之外，还应考虑以下方面：


    - **使用通用数据模型：** 使用通用数据模型以确保所有工作流中数据的一致性和准确性。也许数据模型的大部分可以直接映射到 Dataverse，因为该存储库提供了企业级数据模型所需的许多功能。然而，PAD
    还集成和自动化无法插入其中的应用程序。因此，有必要在业务流程中设计一个包含所有集成应用程序的概念性整体数据模型。

    - **使用集中式容器：** 为了打包自动化项目所需的所有工件，建议使用集中式存储库来存储和管理工作流、数据和其他资源。在 Power Platform 世界中，这些存储库称为
    **解决方案**。桌面流是解决方案感知的，这意味着它可以包含在解决方案中。然后，可以使用应用程序生命周期方法将解决方案导出并导入到另一个环境中。

    - **利用应用程序生命周期管理（ALM），包括版本控制系统以及测试和验证流程：** 通常存在不同的阶段，在这些阶段中开发和运行应用程序和解决方案，例如 *开发*、*测试*
    和 *生产*。ALM 技术允许以自动化的方式将此类解决方案从一个阶段传输到另一个阶段。使用版本控制系统来管理对工作流和其他资源所做的更改。此领域还包括使用
    Git 等版本控制存储库以及测试流程，以确保解决方案在后续阶段也能正常工作。阅读更多


    关于这些主题的信息请访问 https://learn.microsoft.com/en-us/power-platform/alm/。


    下图说明了关于开发方法的最佳实践：


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_338_0.png)


    图 12.1 – 使用 PAD 的企业开发方法


    在 PAD 的特殊情况下，我们还需要考虑 UI 流程在物理或虚拟桌面上运行。这些机器需要在本地安装 PAD，并且可以在公司的本地网络中运行，也可以在 Azure
    或其他任何提供虚拟机（VM）的云提供商中虚拟运行。这就是为什么也很重要要涵盖解决方案的这一部分，并确保为开发、生产和所有其他阶段维护 VM。我们将在下一节中查看我们在这里拥有的选项。


    然而，考虑到所有这些，我们也不要忘记，本书中介绍的概念，例如子流程、异常处理等，有助于创建有意义且健壮的 UI 流程。


    ## 安装和部署


    PAD 应用程序是先决条件，必须安装在用于执行大型自动化场景的物理机器或 VM 上。不要忘记我们最终需要在该机器上安装一个传统应用程序。由于手动选项的可扩展性不佳，因此还有其他选项：


    - 使用系统管理软件，如 Microsoft **System Center Configuration Manager (SCCM)** 或 Microsoft
    Intune 来部署和配置本地机器

    - 使用 Azure 或任何其他云提供商中的 VM 来为 PAD 和相应的管理工具提供虚拟环境


    Microsoft 提供了使用其名为 **Desktop-as-a-Service (DaaS)** 的功能 **Azure Virtual Desktop**
    来直接在 Power Platform 内管理 PAD 的 VM。已创建了一个入门套件，其中包含不同的流程和一个用于配置设置的附加应用（见以下屏幕截图）：


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_339_0.png)


    图 12.2 – 入门套件配置应用


    此选项需要在后台配置适当的机器时设置一些参数。然而，这也允许非常轻松地添加（扩展）或删除（缩减）额外的机器，这在负载高峰期非常有帮助。更多内容将在下一节中介绍。


    ## Starter Kit 不是官方的 Microsoft 产品


    应提及的是，Starter Kit 并不是 Power Platform 中的官方模块，应被理解为使用 Microsoft 技术实现自动配置和扩展的示例实现。所有实现工件都已发布在
    GitHub 上。如果此产品出现问题，Microsoft 不提供任何支持，因为它不受官方支持。相反，鼓励客户为 GitHub 项目做出贡献并在那里提出问题。


    部署的另一个方面是 UI 流程本身的部署。当用户创建并保存 UI 流程时，它会存储在给定环境的 Dataverse 存储库中。但是，默认情况下，其他用户无法查看或使用此流程。


    有多种方式可以向另一用户提供对 UI 流程的访问权限。下图显示了这些选项：


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_340_0.png)


    图 12.3 – 分享流程的方式


    请注意，选项 1 和 2 会创建原始流程的副本。让我们看一下细节。


    ## 使用文本文件


    第一个选项是将流程及其操作复制到文本文件并与用户共享。为此，您需要执行以下步骤：


    1. 打开一个 UI 流程。

    2. 通过按 Ctrl + A 选择所有操作。

    3. 通过按 Ctrl + C 将操作复制到剪贴板。

    4. 打开一个新文本文档（例如使用记事本）。

    5. 将剪贴板内容粘贴到文本文件中。

    6. 保存文本文件。


    我们现在可以将此文本文件与另一用户共享，该用户可以打开它，复制内容并将其粘贴到空白 UI 流程设计器窗口中。


    ## 使用解决方案


    如前所述，解决方案是可包含各种 Power Platform 工件的容器，因此可被视为完整的业务解决方案包。它们代表 Power Platform 中的一个非常重要的概念，并用于使用
    ALM 技术将工件（如应用、流程等）从一个环境传输到下一个环境。要创建解决方案，请转到 Power Automate 门户中的解决方案菜单项，然后在菜单栏中单击
    + New solution 按钮，如以下屏幕截图所示：


    '
