  - '[PAGE 20]


    +   - **Cloud flows**: These kinds of flows run in the cloud, meaning they are
    running on the Microsoft Cloud infrastructure within Power Platform. A cloud flow
    runs on a specific trigger event – for example, *a new contact was created*. It
    could also run instantly, for example by the press of a button in a Power App,
    or scheduled – for example, every hour. A cloud flow can be designed in the designer
    in the browser, and it can incorporate any data or systems that are also available
    online.

    +   - **Business Process flows**: Dynamics 365 contains a lot of predefined business
    processes, such as *lead qualification*. This describes the path of a prospect
    to a real customer, as well as the measures and actions required to achieve this.
    All these actions are recorded in a BPF and help the user determine what needs
    to be done next to further qualify the prospect. These flows are used exclusively
    in so-called model-driven apps and are not relevant in the context of this book.
    For more effective business processes, it is possible to merge cloud flows and
    BPFs.

    +   - **Desktop flows or UI flows**: These kinds of flows run on a local machine
    or workstation that could also be a virtual machine. PAD is used to create and
    design these kinds of flows, which can access resources such as locally installed
    applications or the operating system.


    # Note


