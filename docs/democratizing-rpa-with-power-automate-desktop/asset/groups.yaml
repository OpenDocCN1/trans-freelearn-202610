    ### Why do we need UI actions?


    Over time, countless applications for Windows were created, of which a great many
    still exist to this day. Microsoft itself has created excellent options for tailoring
    your applications with tools such as Visual Basic and Visual Studio. However,
    many of these applications are still not accessible via an API and have to be
    operated manually – also known as the human interface.


    As we will see later in this book, PAD can work directly with numerous and widely
