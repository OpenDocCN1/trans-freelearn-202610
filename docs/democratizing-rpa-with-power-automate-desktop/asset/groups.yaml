    4. 步骤 18 使用提取的发票 ID 更新订单数据表。

    5. 在步骤 20 中，我们点击 Save 按钮。


    在这一阶段，我们已经建立了两个应用程序之间的通信，并将新订单作为发票插入到 Contoso Invoicing 应用中。此外，我们现在知道每个订单的所有发票
    ID，以便我们可以为参考而更新 MS Access 数据库本身。让我们看看这里需要做什么。


    ### WriteBackInvoiceIDs 子流程


    最后，我们希望更新 MS Access 数据库，以便用户可以看到已创建发票。现在，这可以通过多种方式实现。不幸的是，数据库本身并没有为我们提供一种简单的方法来标记订单以便开具发票。这就是为什么我们可以选择一种简单的方法将此信息传回数据库，通过更新每个订单中的
    Notes 字段。我们将通过动态创建包含订单 ID 以及发票 ID 的 SQL 语句来实现这一点（两者都在我们的数据表中）。该语句可能如下所示，例如：


    ```sql

    UPDATE Orders SET Notes = "Invoice ID: 1159" WHERE [Order ID] = 59

    ```


