    # # Microsoft account


    To be able to access the files for installing PAD, a Microsoft account (formally
    known as Windows Live ID) is required. There are different types of accounts and
    all of them are suitable for using PAD:


    +   - **(Personal) Microsoft account:** This is probably the most commonly used
    type of account in the private area. It is free and provides access to Microsoft’s
    consumer services such as **Outlook.com, OneDrive, and Office applications**.
    To sign up, an existing email address can be used or a new one can be created.
    This account can also be used to sign in to a Windows machine.

    +   - **Work or school account:** This type of account is created by an organization
    that uses **Azure Active Directory (AAD)** as the authentication and authorization
    platform. Typically, additional services or subscriptions are purchased that offer
    additional functionality to users.

    +   - **Organization premium account:** This is a special form of work or school
    account. In this case, the organization is not only managing users via AAD but
    has also moved certain or all parts of IT to the cloud, such as Exchange, Teams,
    and Business applications.


    With all three types, the full potential of PAD can be unleashed. The organization’s
    premium account has the following capabilities on top:


    +   - Connecting and integrating with cloud flows (see the previous comments on
    the operating system)

    +   - Collaboration and advanced functionality (such as central Dataverse storage,
    sharing of flows, as well as centralized management and reporting)

    +   - Additional premium functionality such as access to AI Builder and unattended
    execution of flows'
