  mdcn: "\n\n- 添加项目到列表\n- 从列表中移除项目\n- 排序列表，洗牌列表\n- 反转列表\n- 从列表中移除重复项目\n\n所有这些都相当自解释，并且会按其名称所暗示的方式执行。它们不会暴露任何额外的变量。\n\
    \n某些操作需要两个列表来运行。这些是合并列表、查找公共列表项和减去列表。然而，这些操作会创建一个新的列表，即相应操作的运算结果。\n\n## 数据表\n\n\
    除了单维列表数据类型之外，我们还可以使用二维或表格型数据表来存储值。你可以将数据表视为一个简单的 Excel 电子表格。有一个特定的操作可以从 Excel\
    \ 电子表格中读取数据并返回一个数据表。这些操作会创建和操作数据行，它们也位于 Variables 操作组中，但在 Data table 文件夹下。\n\n\
    要创建数据表变量，我们可以使用创建新的数据表选项。操作参数对话框中包含一个编辑按钮用于定义表格：\n\nFigure 5.12 – Creating a data\
    \ table\n\n我们可以双击现有列来重命名它们，或按 + 按钮添加新列和行。保存将存储值并返回到操作参数对话框，显示新数据表包含的行数和列数。为了演示数据表的不同操作，我创建了一个包含六行两列的简单表格，并将其命名为\
    \ CarsTable，如以下屏幕截图所示：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_135_0.png)\n\
    \nFigure 5.13 – The Cars table\n\n现在，如果我们想向该表格添加新行，可以使用 **Insert row into data\
    \ table** 操作。在相应的操作参数对话框中，我们需要选择数据表及其 **Into location**。在这里，我们可以选择 **End of the\
    \ data table** 或 **before a row index**，选择后需要指定。添加的新值必须符合特定的语法。要添加一条制造商为 Chevrolet\
    \ 且国家为 USA 的新汽车记录，我们需要输入 `%['Chevrolet', 'USA']%`。\n\n我们将在下一节讨论 `%` 记法，但本质上，我们需要在\
    \ **New value(s)** 参数中传递一个列表或数据行，并用百分号封装。\n\n**Update data table item** 的工作方式略有不同，因为它只是更新某个特定的单元格或项目。我们需要将列和行号作为参数值传递，以及要设置的新值。\n\
    \n要删除一行，请使用 **Delete row from data table** 并将行索引作为参数传递。\n\n**Find or replace in\
    \ data table** 操作是最复杂的，因为它具有很多功能。如其名称所示，它可以只是查找或查找并替换。可以利用正则表达式查找某些文本，并指定是否使用大小写敏感搜索。此操作的结果是另一个数据表，其中包含匹配项的列和行作为单独记录。\n\
    \n让我们看一下以下示例，看看它是如何工作的。\n\n基于 Cars 表，我们想要插入包含一辆新汽车的新行。现在，我们想在所有位置将文本 USA 替换为 United\
    \ States。我们可以创建一个如下所示的流程：\n\nFigure 5.14 – Working with data tables\n\n这里使用了 **Find\
    \ or replace in data table** 操作来查找术语 USA 的所有出现。我将其配置如下：\n\n**Main**\n\n| Action\
    \ | Description |\n| --- | --- |\n| Create new data table | Create a new data\
    \ table and store it into CarsTable |\n| Insert row into data table | Appends\
    \ the row `['Chevrolet', 'USA']` at the end of CarsTable |\n| Find or replace\
    \ in data table | Finds all items in CarsTable containing the text `'USA'` and\
    \ stores the matched cells into DataTableMatches |\n| For each CurrentItem in\
    \ DataTableMatches | |\n| Update data table item | Updates the data table CarsTable\
    \ at row index `CurrentItem['Row']` and column `CurrentItem['Column']` with the\
    \ value `'United States'` |\n| End | |\n\n## Variables\n\nSearch variables\n\n\
    Input / output variables 0\n\nThere aren't any input or output variables here\
    \ yet\n\nFlow variables 3\n\n- CarsTable\n- CurrentItem\n- DataTableMatches\n\n\
    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_138_0.png)\n\nFigure 5.15 – The Find\
    \ and replace in data table action\n\n此操作会创建一个名为 **DataTableMatches** 的新数据表，在我们的例子中包含两条记录，即美国汽车的记录。流程运行后双击此变量会显示此表格的内容：\n\
    \n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_141_0.png)\n\nFigure 5.18 – The data\
