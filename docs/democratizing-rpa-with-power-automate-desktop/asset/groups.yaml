    流程是否显示在流程列表中取决于是否选择了正确的环境。我们将在本书的示例中始终考虑这一点。


    在本节中，我们了解到 PAD 不仅是用于自动化本地应用程序的程序，而且它处于 Microsoft Power Platform 的更大背景中。PAD 可以集成到更大的场景中，并在企业环境中使用。下一节展示了
