    # Additional notes on accounts


    To install PAD, a user with administrator privileges on the device is required.
    A Windows local or domain account with these privileges should be used. To access
    PAD installation files, however, one of the Microsoft accounts mentioned previously
    is necessary. The Windows local account can be associated with the Microsoft account
    in the corresponding Windows account settings.


    Now that we know the prerequisites, let’s take a look at how to install the software.


    # Installing PAD


    The installation files for PAD are not on the local Windows medium – you must
    download these from the Microsoft download center. Therefore, an active internet
    connection and a modern browser are required – Microsoft Edge version 80 or higher
    or Google Chrome. For this book, I am using a machine with Windows 11 Home edition
    and a freshly created personal Microsoft account. To install PAD, do the following:


    +   1. Open your browser and navigate to https://www.office.com. If you are not
    already logged in, do so with your Microsoft account.

    +   2. On the right-hand side, you should see a list of familiar icons such as
    those for Word, Excel, and more. Click on the last one, called Apps. Clicking
    this icon will make additional apps appear:'
