    refers to the general capability of PAD to work with any application window and
    therefore remote control any application and control element.


    To enforce this very general approach, the actions in this action group are correspondingly
    general and can be divided into the following parts:


    - Identify a window

    - Interact with application controls

    - Extract data from a window

    - Fill in data in a window


    Let’s take a closer look at each of these actions before we dive into another
    example to leverage these actions.


