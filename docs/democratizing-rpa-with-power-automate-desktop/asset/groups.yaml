    ## Chapter prerequisites


    In this chapter, we will learn about the functionality of PAD, most of which is
    only available with the Premium RPA features. This requires a corresponding license,
    also described in more detail in the *Compliance* section. Microsoft offers a
    30-day trial period for these features, which is suitable for trying out these
    functionalities.


    Furthermore, several local or virtual Windows machines are typically used in such
    scenarios, for example, to test load balancing. For more information, see the
    *Installation and deployment* section.


    ## Typical requirements in enterprises


    So far, we have focused on the functionalities of PAD and looked at individual
    UI flows that should perform a specific task. This allowed us to look at the automation
    options for a certain business process and implement them with UI flows. However,
    in an enterprise context, many organizations today generally have additional challenges,
    which we will closely examine.


    ## Hyperautomation


    Automating business processes typically requires taking both legacy and new technology
    into account. Application landscapes at companies are often very diverse starting
    from cloud and on-premises systems, applications with and without APIs, existing
    workstations and mobile applications, applications used for mass data processing,
    and so on. This may also require a whole set of tools to connect and automate
    all these applications, and in most cases, various tools are already in use. Establishing
    a unified approach here typically requires the use of technologies that can handle
    APIs, UIs (RPA), and AI. This triad has given rise to the term **hyperautomation**,
    as with this toolbox, compare can be enabled to meet any automation need and thus
    become more efficient and productive.


    ## Development aspects


    As we already know, PAD UI flows are developed using the corresponding Windows
    application. We also already know that the application is always connected to
    a Power Platform environment. This is where the UI flows are physically stored.
    Access to the environment is controlled via the user. It is important to think
    about an environment strategy that is used in connection with Power Automate Desktop
    and also all other Power Platform components. In addition to this, the following
    aspects should be considered:


    - **Use a common data model:** Use a common data model to ensure consistency and
    accuracy of data across all workflows. Perhaps a larger portion of the data model
    could be mapped directly into Dataverse, as this repository brings many features
    that an enterprise-wide data model requires. However, PAD also integrates and
    automates applications that cannot be inserted here. Therefore, it is necessary
    to design a conceptual overall data model with all integrated applications in
    the business process.

    - **Use a centralized container:** To package all artifacts that are required
    for an automation project, it is recommended to use a centralized repository to
    store and manage workflows, data, and other resources. These repositories are
    called **solutions** in the world of Power Platform. A desktop flow is solution-aware,
    meaning it can be contained in a solution. The solution can then be exported and
    imported into another environment by using application life cycle methods.

    - **Leverage application life cycle management (ALM), including a version control
    system as well as test and validation processes:** Typically, there are different
    stages where applications and solutions are developed and operated, such as *development*,
    *test*, and *production*. ALM technology allows transporting such solutions from
    one stage to another in an automated way. Use a version control system to manage
    changes to workflows and other resources. This area also includes the usage of
    a version control repository such as Git and test processes to ensure that the
    solution also works in subsequent stages. Read more


    about these topics at https://learn.microsoft.com/en-us/power-platform/alm/.


    The following diagram illustrates best practices regarding development approaches:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_338_0.png)


    Figure 12.1 – Enterprise development approach with PAD


    In the special case of PAD, we also need to consider that UI flows are running
    on a physical or virtual desktop. These machines need PAD installed locally and
    can run in the company’s local network or virtually in Azure or other any other
    cloud provider offering virtual machines (VMs). That’s why it is also important
    to cover this part of the solution and make sure that VMs for development, production,
    and all other stages are maintained. We take a look at the options we have here
    in the next section.


    However, with all this to consider, let’s also not forget that the concepts introduced
    in this book, such as child flows, exception handling, and more, help to create
    meaningful and robust UI flows.


    ## Installation and deployment


    The PAD application is a prerequisite and must be installed on the physical machine
    or VM used to execute large automation scenarios. Let’s not forget that we will
    eventually need to install a legacy application on that machine. Since the manual
    option does not scale very well, there are also other options:


    - Use systems management software such as Microsoft **System Center Configuration
    Manager (SCCM)** or Microsoft Intune to deploy and configure local machines

    - Use VMs in Azure or any other cloud provider to provide virtual environments
    for PAD and corresponding management tools


    Microsoft offers to use its **Desktop-as-a-Service (DaaS)** functionality called
    **Azure Virtual Desktop** to manage VMs for PAD directly within Power Platform.
    A starter kit has been created, containing different flows and an additional app
    to configure the setup (see the following screenshot):


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_339_0.png)


    Figure 12.2 – The Starter Kit Configuration App


    This option requires some setting parameters to provision appropriate machines
    in the background. However, this also allows adding (scale-up) or removing (scale-down)
    additional machines very easily, which can be very helpful in load peak periods.
    More on this in the next section.


    ## The Starter Kit is not an official Microsoft product


    It should be mentioned that the Starter Kit is not an official module in the Power
    Platform and should be understood as a sample implementation to achieve automatic
    provisioning and scaling with Microsoft technologies. All implementation artifacts
    are published on GitHub. Microsoft does not offer any support if there is an issue
    with this product, as it is not officially supported. Instead, customers are encouraged
    to contribute to the GitHub project and raise their issues there.


    Another aspect of deployment is the deployment of the UI flows itself. When a
    user creates and saves a UI flow, this is stored in the Dataverse repository for
