    # The Power Automate container window


    The first window we will see when we start the program is the container window,
    also known as the Power Automate console. The following screenshot shows this
    window:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_51_0.png)


    Figure 2.19 – PAD container window


    It contains the following elements:


    +   1. **List of UI flows:** If you hover over an item in the list, you will be
    presented with different additional options, such as the *play* button or the
    *edit* button. While the *edit* button just opens the designer window (see the
    following figure), the *start* button runs the flow immediately without opening
    the designer window first.'
  - '[PAGE 52]


    You will also get some desktop notifications on the flow’s status (has been started,
    was successful, and so on):


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_52_0.png)


    Figure 2.20 – Windows notification on the flow


