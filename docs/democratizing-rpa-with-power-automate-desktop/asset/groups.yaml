    ## Note on DLP policies


    At the time of writing, this feature is in preview, and the use of these capabilities
    must be confirmed by an opt-in (announcement to Microsoft). Subsequently, the
    action groups and also individual actions can be blocked or restricted so that
    UI flows are disabled if a DLP policy is violated in the flow (prohibited connector
    or unauthorized combination with another connector).


    When the feature comes into general availability, it will only be available for
    managed environments for which additional security mechanisms exist beyond that.
    The Further reading section contains a link to get more information about managed
    environments.


    Apart from the actual data, there is also other information worth protecting,
    such as access data and passwords. We will look at the possibilities for this
