    in natural language across multiple languages More info

    >

    > Select parameters

    >

    > Text to recognize from %NewOrders[LoopIndex][8]% {x}

    > Entity type: Currency

    > Language: English

    >

    > Variables produced RecognizedEntities

    >

    > Save Cancel


    **图 6.11 – Recognize entities in text 配置**


    3. 提取生成的发票 ID 数据并将其存储在数据行的最后一个元素中。这里，我们使用 Extract data from window 操作来捕获生成的发票
