    \ exhibited similar structures, such as a data table in which the associated records\
    \ always had the same structure. However, we can also work with a data type called\
    \ **object**, which is described by a set of properties and related values. Let’s\
    \ take the `cars` example from earlier in this chapter. For example, a car has\
    \ the following properties: brand, color, year of manufacture, type of vehicle,\
    \ and more. For some time now, the so-called **Javascript Object Notation (JSON)**\
    \ format has prevailed here for the notation of such an object. This could look\
    \ as follows:\n\n```\n{\n  'Brand': 'BMW',\n  'Color': 'blue',\n  'year of manufacture':\
    \ '2020',\n  'type of vehicle': 'SUV'\n}\n```\n\nIt is possible to create an input/output\
    \ variable for a custom object. All you have to do is select **Custom object**\
    \ as the data type. Then, you can edit the data for the object in a separate dialog:\n\
    \nTip\n\nIf you want to have a readable JSON file that you can easily edit, you\
