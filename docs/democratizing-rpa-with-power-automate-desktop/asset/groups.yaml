    最后但同样重要的是，我们还可以使用 PAD 原生压缩文件或文件夹，以及解压缩文件。**压缩**操作组包含用于此目的的两个操作。如果我们需要创建存档（ZIP
    文件），可以提供以下参数：


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_328_0.png)


