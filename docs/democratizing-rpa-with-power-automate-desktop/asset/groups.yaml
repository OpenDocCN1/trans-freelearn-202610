    # Summary


    In this chapter, we learned about a large number of actions that allow us to manage
    workstations. Furthermore, more information is available through scripting integration,
    and it is possible to execute more operations than would be possible through PAD
    alone. Also, the use of a mouse and keyboard extends the reach of PAD in the use
    of any program. Building on this, in the next chapter, we will look at special
    applications, including SAP and mainframe automation.


