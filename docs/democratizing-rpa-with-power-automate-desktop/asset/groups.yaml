    The **Details** option gives shows the properties of the flow, including its name
    and description, owner, the date for creation, and the last modification.


    +   2. **The console area switch**: You can also switch from the **My flows**
    tab to the **Examples** tab. Here, different examples provided by Microsoft are
    presented, including automation for Excel, desktop, the web, and more. Although
    the examples do not cover the scope of the program, it may be worthwhile to have
    a look there to possibly try out one of them.


    +   3. **Create a new flow**: This button launches a dialog where you can enter
    the name for a new UI flow. Although this is optional, it is reasonable to provide
    a meaningful name for the flow. There is a **Create** button to confirm the name
