    \ 1 到 20 之间生成一个数字并存储在 RandomNumber 变量中。\n\n2. 接下来，将使用循环条件动作。操作参数对话框中的第一个操作数将是\
    \ GuessRight 变量，我们希望将其与固定值 False 进行比较。这意味着只要 GuessRight 的值为 false（用户未输入正确数字），循环就会继续。\n\
    \n3. 接下来，我们想显示一个输入屏幕，允许用户输入数字。我们为此使用 Display input dialog 动作，该动作也位于 Message boxes\
