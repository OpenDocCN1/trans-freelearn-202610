  mdcn: "\n\n动作序列，取决于某些条件，无论是单分支还是多分支。下一节将介绍我们需要做什么才能根据参数重复执行某些动作。\n\n## 使用循环语句处理重复任务\n\
    \n在编程语言中，另一个有价值的概念是通过列表迭代或在特定次数内运行一组特定的语句和动作。这也可以在 PAD 中通过使用循环动作来实现。这些位于 **Loops**\
    \ 动作组中。\n\n### 循环动作\n\n让我们从循环动作开始，并为 *Ludo* 桌游创建一个骰子模拟器。在这个桌游中，玩家必须使用在游戏开始前选择的颜色的棋子绕行棋盘。骰子掷三次。如果结果为\
    \ 6，玩家可以移动棋子。如果不是，他们需要再次尝试。以下是模拟此情况的流程：\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_105_0.png)\n\
    \n*Figure 4.11 – Roll the dice flow with a loop statement*\n\n以下是前一图中步骤的详细说明：\n\
    \n1. 打开 **Loops** 动作组并找到 `Loop` 动作。将其拖到工作区并设置以下值：\n\n   - **Start from:** 1\n\
    \   - **End to:** 3\n   - **Increment by:** 1\n\n   这将导致循环执行三次。\n\n2. 我们现在需要创建一个随机数作为掷骰子的结果。使用\
    \ **Actions** 组上方搜索栏搜索 `random` 关键字。你会找到一个名为 **Generate random number** 的动作。将其拖到\
    \ `Loop` 动作正下方。在动作参数对话框中，最小值输入 `1`，最大值输入 `6`。还尝试通过展开 `Variables produced` 区域并双击名称，将默认变量名\
    \ `RandomNumber` 重命名为 `DiceResult`。确保新变量名被百分号包围，像这样：`%DiceResult%`。\n\n3. 现在，我们需要检查结果是否等于\
    \ `6`，这意味着我们将继续游戏并停止再次掷骰子。我们现在将使用本章上一节中的条件来检查 `DiceResult` 的值。如果结果等于 `6`，我们将显示一个消息框确认这一点。\n\
    \n### Important Note\n\n在消息框之后，我们使用 `Exit loop` 动作来停止再次掷骰子。该动作也位于 **Loops** 动作组中，不需要任何额外配置。\n\
    \n4. 在 If 动作的 Else 分支中，我们只想在结果不等于 6 时显示骰子的结果。\n\n请注意，在前面的示例中，我们使用了 Exit loop 动作来离开循环过程。还有一个\
    \ Next Loop 动作，可以在 Loop 动作内部使用。根据动作在 Loop 动作内部放置的位置，所有后续动作将被跳过，并强制进行下一次迭代。\n\n\
    ### 循环条件\n\n另一种遍历动作列表的方式是使用循环条件动作。在编程语言中，这被称为 while 循环。只要特定条件为真，一组动作就会被重复执行。\n\
    \n在下一个示例中，我们将看到这是如何工作的。以下流程实现了一个猜数字游戏。开始时，会确定一个随机数，用户必须猜出它是什么数字。如果用户输入正确数字，游戏获胜且循环结束；否则，尝试次数会增加。以下是流程的实现：\n\
    \n*Figure 4.12 – The guessing game implementation*\n\n以下是步骤的详细说明：\n\n1. 流程从定义两个变量开始，Counter（一个数字，初始化为\
