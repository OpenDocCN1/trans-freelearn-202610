    ## 如何在 PAD 中使用图像


    正如我们在上一节中所了解的，PAD 可以通过特定的选择器识别 UI 元素。但在某些情况下，我们需要其他机制来执行某些操作，例如将鼠标移动到特定位置并执行操作。这时图像就派上用场了。我们有以下使用图像作为输入的操作：


    - **if image** 检查屏幕上是否存在图像

    - **Wait for image** 等待图像出现在屏幕上或从屏幕上消失

    - **Move mouse to image** 将鼠标移动到屏幕上的图像


    结合 **Send mouse click**，甚至可以在不知道 UI 元素的情况下执行操作。这种技术也很有用，如果我们需要在没有代理的虚拟或远程桌面上进行自动化，例如
    Linux 或 Unix。任何系统上的任何程序都可以通过这种技术远程执行和控制。因此，例如，如果有一个在 Linux 系统上运行且没有任何 API 的业务应用程序，也可以用
    PAD 自动化该程序。


    Power Automate agent for virtual desktops


    运行 PAD 的计算机原则上也可以远程控制 **远程桌面协议（RDP）** 会话。如果远程系统也是 Windows 系统，可以在该系统上安装 Power Automate
    agent for virtual desktops。这使得在 RDP 会话内也能使用 UI 元素成为可能。这适用于 Citrix 和 Microsoft
