    前几章重点关注了 PAD 本身的详细功能。我们已经看到了许多以交互方式执行的**用户界面（UI）**流示例。然而，在大型企业中的部署通常看起来有所不同。在这里，UI
    流通常是更大概念的一部分，其中安全性和扩展性等问题起着重要作用。本章重点介绍以下方面：


    - 企业中的典型需求，包括开发方面、安装、可扩展性、安全性、治理和合规性，以及如何使用 PAD 解决这些需求

