    *步骤 12* 中，我们告诉 PAD 执行此操作。


    接下来，我们希望关闭查询窗口并重新开始。在 *步骤 13* 中，我们按下关闭查询窗口的按钮；再次，我们需要让 PAD 确认我们不希望保存查询。这标志着循环的结束，以便我们可以重新开始：


