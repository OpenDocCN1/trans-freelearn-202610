    the name, a location, the group scope (global, local, or universal), and the group
    type (security or distribution). The `location` attribute specifies the container/folder
    where the group should be created as a distinguished name. The **Modify** action
    allows you to rename or delete a group and also to add or remove users from it.

    +   - **Get group info / Get group members**: This provides a distinguished name
    for the group you wish to get information about. The first action returns a list
    of attributes for that group, and the second a list of group members.

    +   - **Create / Delete / Move / Rename object**: An AD object in this case is
    a *computer* or an *OU*. Again, we need to provide a location (distinguished name)
    to execute these actions.

    +   - **Create / Modify / Unlock user**: The **Create** action also wants a location
    where the user should be created, but also common attributes such as their first
    name, initials, last name, username, and password. It also allows you to specify
    whether the password should never expire or whether the user account will be disabled
    (the user cannot log on).

    +   - **Get user info / Update user info**: This provides a distinguished name
    for the user to retrieve or update user object attributes.


