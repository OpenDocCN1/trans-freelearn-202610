    # Figure 12.13 – The Power Platform maturity model


    This model can help determine the current state of automation capabilities and,
    from there, take the next steps, if necessary, to achieve a better level of automation
    and thus increase the company’s efficiency and productivity. In general, the idea
    here is not to look at individual applications but to take a holistic view of
    automation practices across an enterprise to embed them in an overall concept.
    For each individual automation project, so-called *holistic enterprise automation
    techniques (HEAT)* techniques can then be used to help design and roll out the
    solution in the context of the organization and manage the overall life cycle
    of the solution.


