    操作的设置与其他 **Get files in folder** 不同。

    - **Run from here**: 如果我们使用此命令（或 *Alt+F5*），流程将从此操作开始执行。 所有之前的操作都不会被执行。 如果在此之前有其他操作对于所选操作被执行是必要的，这可能会导致错误。
    但尽管如此，如果流程之前出现错误，你只想从此处开始，这也可能是一个方便的功能。

    - **Undo / Redo / Cut / Copy / Paste**: 这些是从其他程序（如 Office）中熟知的编辑功能。

    - **Move up / Move down**: 而不是点击并拖动操作，我们可以使用这些命令或使用快捷键。

    - **Disable action**: 这也是设计流程时非常有用的功能。 它允许你禁用一个操作，使其不会被执行。


