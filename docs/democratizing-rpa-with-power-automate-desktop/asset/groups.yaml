    再次，让我们逐步了解细节：


    1. *步骤 1* 启动应用程序。

    2. *步骤 2* 等待主应用程序窗口出现。

    3. *步骤 3* 点击 **Invoices** 树节点。现在我们准备插入发票了。

    4. *步骤 4* 启动一个循环并遍历新订单的数据表。


    请注意，我选择使用索引版本进行迭代。这样在最后填充生成的发票 ID 数据时更容易，因为我可以通过循环索引引用当前迭代步骤。


    在循环中，我们对表中的每一行数据都做同样的操作：


