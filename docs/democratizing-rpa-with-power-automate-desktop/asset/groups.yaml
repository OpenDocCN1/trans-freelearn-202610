    - **Run application/Terminate process**：之前已讨论过。

    - **Ping**：此动作向远程计算机发送网络消息并检查远程机器是否可访问。

    - **Set/Get/Delete Windows environment variable**：这些环境变量可以以中央位置存储数据和值，供操作系统和所有其他已安装程序使用。存在标准环境变量，例如
    **WINDIR**（Windows 操作系统的安装位置）或 **PATH**（包含可通过命令行直接访问的重要程序的目录列表）。这些对应的动作可以在 PAD
    流程中管理这些条目。


    除了使用 UI 运行应用程序（进程）外，操作系统还具有不与用户交互的后台服务概念。这些服务也是进程，因为一旦启动，它们就会出现在活动进程列表中，通常由名为
    `svchost.exe`（服务的宿主应用程序）的应用程序包装。但它们需要特殊处理，我们为此专门提供了 PAD 动作，位于 **Windows services**
    动作组中（见下图）：


