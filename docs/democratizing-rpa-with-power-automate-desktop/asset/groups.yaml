    根据学生人数以及需要查阅的信息量，这是一项繁琐且耗时的任务。正如前面的图表所示，这个过程相当枯燥且耗时。此外，我们还需要在达到报告截止日期之前每天重复此操作。


    PAD 可以在这种情况下提供帮助。可以创建一个流程来检查属于特定主题的所有电子邮件并将 Word 文档保存到特定文件夹中。另一个流程可以检查该文件夹中的所有文件或文档，提取相关信息，并将其传输到
    Excel 电子表格中。你只需创建一次此流程，它就会自动完成剩下的工作。


    如果信件以打印输出的形式返回，甚至可以使用 **光学字符识别 (OCR)**。


    ## 示例 2 – 遗留应用的集成


    即使在今天，仍然有大量专门为特定用例创建且因各种原因无法现代化改造的遗留应用。这些原因包括预算不足、技术过时，以及缺乏资源、能力和时间。


    员工几乎被迫使用该应用，而且非常经常地，这样的应用无法通过 **应用程序编程接口 (API)** 或任何其他兼容接口以编程方式访问数据或流程。


    那么，当这样的应用必须集成到更大的上下文中时会发生什么呢？例如，可能存在一个销售平台，其中记录了订单和发票。然而，这些数据也必须流入遗留应用以保持数据库一致。或者，也许在遗留应用中生成了一个唯一的客户编号，该编号必须在其他地方使用（有关示例，请参阅
    *第 7 章*）。


    无论如何，必须有一种方法来处理这个遗留应用并将其集成到更大的上下文中——而这正是 PAD 发挥作用的地方。


    借助 PAD，我们可以远程控制任何桌面应用，记录一个始终相同的序列，然后再次运行它。借助 PAD，我们还可以远程执行此流程或从外部事件触发（作业在系统中在线输入），读取计算或输入结果，并将其作为值回放到工作流中。


    这意味着一个无法从外部调用且只能手动操作的应用，仍然可以被自动化并集成。这也意味着在系统环境中，多个应用参与一个流程但没有技术连接时，可以使用 PAD 设计一个连贯的流程并在这些应用之间交换数据。


    凭借其近 400 个操作（截至撰写时；可用操作的数量不断增长），PAD 可以覆盖所有用户场景，从 Web 和桌面应用到数据库、文件和文件夹，再到电子邮件和脚本集成。下面的图表说明了
    PAD 在连接方面的能力：


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_14_0.png)


    图 1.2 – PAD 功能


    除了远程控制本地安装的程序外，PAD 还可以连接到众多外部系统和环境，例如来自 Microsoft 或 AWS 的云环境，并将人工智能纳入脚本和 Web 自动化中。所有这些连接都可以在
    PAD 的流程中使用，从而实现跨系统流程的映射。


    这说明 PAD 可以覆盖广泛的用例。然而，这并不意味着 PAD 适用于所有事情。在下一节中，我们将看看流程应满足哪些标准才能使使用 PAD 变得合理。


    ## 哪些流程应该被自动化？


    正如我们在前几节中看到的，PAD 功能非常强大，可用于私人以及商业环境。流程和工作流无处不在，我们每天都在使用它们，但哪个流程适合自动化呢？


    使用 PAD 创建流程也需要一定的工作量，因此值得仔细研究是否值得自动化某个流程。以下是做出选择时可以参考的一些方面：


    - 你是否充分理解该流程并且其执行方式是否一致？如果存在太多变体或不可预测的行为，自动化将非常困难，甚至不可能。

    - 是否有足够多的重复次数或甚至高频执行该流程，以使投入的工作物有所值（**投资回报率 – ROI**）？

    - 该流程是否主要为手动操作，并且存在许多可以通过自动化消除的错误？


    可能还有其他影响自动化流程决策的方面，但如果你以这些问题作为起点，你就走在正确的道路上。


    ## 一切的开始 – 机器人流程自动化


    RPA 的历史可以追溯到 1990 年代至 2000 年代。当时 **用户界面 (UI)**，有时也称为 **图形用户界面 (GUI)** 软件测试的需求变得更加强烈——即能够自动点击软件
    GUI、输入值并查询输出。为此，开发了第一批工具，使首次使用记录和回放方法进行 UI 和回归测试成为可能。屏幕抓取技术也用于此目的，通过它可以实现从一个应用中提取数据的自动化，以便在其他地方进一步使用。由此产生的自动运行流程也可以称为
    **bot**（**robot** 的简称）。


    稍晚一些，在 2005 年，一家名为 Softomotive 的公司成立，将记录和回放的概念扩展到能够在不同 Windows 应用之间实现工作流和数据传输，从而跨应用自动化流程。该产品名为
    WinAutomation，并与其他制造商一起长期成为 RPA 软件的领先提供商之一。


    Softomotive 于 2020 年被 Microsoft 收购，其产品 WinAutomation 的功能被集成到 Power Automate 模块中，该模块当时对自动化基于桌面的流程的功能非常有限。尽管如此，Power
    Platform 在此阶段作为整体概念已经非常强大；我们将在 *第 2 章* 中讨论这一点。


    ## Microsoft Power Platform 一览


    Power Platform 的真正起源可以追溯到很久以前，当时人们还在谈论 Microsoft 业务解决方案。那时，Microsoft


    进入市场推出了一款新的 CRM 系统，为今天的 Power Platform 奠定了基础。该生态系统由多个子组件组成，它们可以非常紧密地协同工作，也可以单独使用：


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_17_0.png)


    跨越 Microsoft 365、Azure、Dynamic 365 和独立应用的低代码平台。


    图 1.3 – Microsoft Power Platform


    这些是组件：


    - **Power BI：** 一种用于在仪表板和报告中可视化任何类型数据的工具。Power BI 还可以从其他组件捕获实时数据，并利用连接器功能访问几乎任何数据源中的数据，并将其与其他数据结合以创建跨系统仪表板。

    - **Power Apps：** 这允许用户创建可用于特定业务流程的不同类型的应用。有不同类型的应用，它们又可根据表单因素（手机/平板电脑）或创建方式（画布与模型驱动）进行划分。Power
    Apps 也利用连接器概念在应用中使用任何数据源。

    - **Power Automate（原 Microsoft Flow）：** 这是 Power Platform 内创建的工作流和业务流程的通用术语。PAD
    也属于这一类别；我们将在下一章更详细地介绍它。但这里还有其他组件，例如 **业务流程流 (BPFs)**。

    - **Power Virtual Agents：** 该模块允许你创建所谓的聊天机器人。它可以嵌入到网站或其他渠道中，为网站访问者提供一种交互方式来联系公司、询问订单状态等。

    - **Power Pages（原 PowerApps Portal）：** 该模块在撰写时处于预览阶段，源自已存在相当长时间的门户领域。它是一个内容管理系统，可用于创建外部网站。


    前面的图表还显示了 Power Platform 的另外三个重要构建块：


    ### 数据连接器


    借助数据连接器，可以访问并使用通过 Power Platform 提供的所有数据源。今天已有超过 400 个可用，并且每天都在增加。然而，如果 Microsoft
    或第三方制造商未提供连接器，也可以在组件中创建自己的连接器并使用它。


    ### AI Builder


    AI Builder 允许你在应用或工作流中包含人工智能。提供的模型涵盖信息提取和文本识别，以及翻译，但也包括情感识别或根据你的标准对客户反馈进行分类。在这里，你也可以创建自己的
    AI 模型，使其在平台中可用，并由应用或工作流创建者使用。


