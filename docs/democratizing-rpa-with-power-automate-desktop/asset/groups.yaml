    the right place in the workspace. Be careful as well to put End at the end of
    your conditional block and not just after If.


    We can now drag additional actions right inside this block. These actions will
    only be executed if the If action and the operator evaluation will be true. For
    example, we could simply drag a Display message action into the block to display
    a message box if the evaluation returns true. But what if the result is false?
