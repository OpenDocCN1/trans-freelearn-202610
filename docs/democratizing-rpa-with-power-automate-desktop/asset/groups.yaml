    到目前为止，我们使用 PAD 使没有 API 的应用程序能够通过其 **用户界面 (UI)** 与自动化流程一起使用。尽管这是 PAD 的主要用途，但我们也可以在
    UI 流程的上下文中与 API 通信，以实现最佳的集成选项。这些可能性形成了闭环，使我们能够完全在 PAD 中实现完整的业务流程，而无需添加其他机制。因此，在本章中，我们将了解
    PAD 可以直接通信的哪些 API 和协议，以及 PAD 可以处理的哪些基于 Web 的数据格式。我们将重点介绍以下几点：


    - 管理本地 **Active Directory (AD)** 服务并访问本地数据库和电子邮件服务

    - 利用使用 **超文本传输协议 (HTTP)** 和 **文件传输协议 (FTP)** 的 Web 服务以及处理 Web 格式（**Javascript
    对象表示法 (JSON)**、**可扩展标记语言 (XML)** 和 **便携式文档格式 (PDF)**）

    - 密码学和 CyberArk

    - 内置数据功能 – 日期时间、文本、压缩和消息框


    学习完本章后，我们将能够在 UI 流程中使用内部服务，例如数据库和 AD，以及任何 Web 服务，并处理各种数据格式。*第 12 章* 中将展示此处介绍的操作的示例流程。


    ## 技术要求


    在第一个示例中，我将使用本地安装的 SQL Server，并安装了 Microsoft 示例数据库 **AdventureWorks2019**。此外，我已在此服务器上设置了一个数据库用户，并授予其访问该数据库的权限。


    ## 本地网络服务的使用和自动化


    在许多大公司和小公司中，都使用基于 Windows 的本地网络，提供额外的 Microsoft 服务。首先，当然包括 AD，但也包括 Microsoft Exchange、SQL
    Server 等。这些和其他服务被分配到 Office Server 产品线。


    由于 PAD 非常适合自动化管理任务，因此为这些服务提供相应的操作也是显而易见的。与我们在 *第 7 章* 中了解的本地 Windows 服务不同，这些是本地网络上的网络服务，因此不在云中。因此，这里介绍的操作也仅用于本地安装的服务器产品。为了自动化相应的云服务，Microsoft
    建议使用在线产品的相应连接器（Azure AD、Exchange Online 等）。越来越多的公司选择云技术的原因可能也在于此，因为 Microsoft
    Exchange 支持的服务器版本有些老旧（Microsoft Exchange Server 2010-2013 Service Pack 1）。虽然 AD
    的操作允许有限的管理，但 Exchange 和数据库的操作只能用于使用这些服务，例如检索消息或执行 SQL 命令。让我们来看一下操作的细节。


    ### 访问和管理本地 AD


    AD 基于 **轻量级目录访问协议 (LDAP)**，该协议基于 X.500 标准中包含的更简单的子集。Microsoft AD 是本地 Windows 网络中管理网络对象（例如用户和组、计算机、打印机等）的中央系统。


    ### AD 服务的背景信息


    Microsoft AD 由诸如 **联合服务 (FS)**、**证书服务 (CS)** 以及 **域服务 (DS)** 等服务集组成。在各种 AD 服务中，这里指的是所谓的
    DS，可以通过 PAD 操作与之交互。它们是 Windows 域网络的基础。


    在使用 AD 和相应的 PAD 操作时，您通常会遇到以下术语：


    - **对象**：这是 AD 内管理的每个项目的通用术语。每种不同的对象类型都有特定的属性。

    - **用户**：此对象类型由用户登录名、名字和姓氏等属性组成，表示使用此用户帐户登录 Windows 域的某个人。

    - **组**：由用户帐户、其他组或计算机帐户组成。

    - **计算机**：这是域内计算机的相关信息。

    - **组织单位 (OU)**：这些是逻辑容器，可以包含对象，也可以包含其他 OU。通常，OU 用于镜像组织结构。它们还允许委派管理控制。


    AD 通过随 Windows Server 提供的管理工具进行管理。下面的屏幕截图显示了用于管理前面列表中描述的对象的 **Active Directory
    用户和计算机** 控制台。


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_312_0.png)


    图 11.1 – 使用服务器工具进行 AD 管理


    另一个重要概念是区别名称。此名称由域名、位置和对象的名称组成。这些条目的组合必须是唯一的，这也是不能有两个具有完全相同名称的用户帐户的原因。区别名称是描述
    AD 中对象的特殊语法。在前面的屏幕截图中，我们看到 Users 文件位置中名为 **powerautomate01** 的用户帐户。此条目的区别名称为


    `CN=powerautomate01,CN=Users,DC=mlndw0rx,DC=virtual.`


    ### 专业提示 – 在管理控制台中查看区别名称


    前面显示的管理控制台还能够公开任何对象的区别名称。要查看此信息，您需要在控制台中打开 **高级功能** 选项，方法是单击 **查看** 菜单并选择 **高级功能**。这会在对象列表中显示一些额外条目，也会在对象的
    **属性** 对话框中显示额外的选项卡。现在右键单击一个用户帐户并从上下文菜单中选择 **属性**。您将看到一个额外的选项卡，称为 **属性编辑器**。向下滚动列表，直到找到
    `distinguishedName` 属性并双击它以查看条目。


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_313_0.png)


    # 字符串属性编辑器


    **属性：** distinguishedName


    **值：** `CN=powerautomate01,CN=Users,DC=m1nd0rX,DC=virtual`


    按钮：清除、确定、取消


    图 11.2 – AD 中的 distinguishedName


    文档中提供了 AD 操作的其他示例（请参阅进一步阅读部分）。现在，让我们利用这些知识来了解 PAD 在管理 AD 方面提供了哪些操作：


    - **连接到服务器 / 关闭连接**：这通过提供目录的 LDAP 路径、完全限定的服务器名称（包括域信息）或甚至 IP 地址来建立与 AD 服务器的连接。还有一个选项可以提供用户名和密码，如果当前用户没有访问服务的权限。

    - **创建 / 修改组**：**创建** 操作通过提供名称、位置、组范围（全局、本地或通用）和组类型（安全或分发）来创建组。`location` 属性指定组应作为区别名称创建的容器/文件夹。**修改**
    操作允许您重命名或删除组，还可以向其中添加或删除用户。

    - **获取组信息 / 获取组成员**：这为要获取信息的组提供区别名称。第一个操作返回该组的属性列表，第二个操作返回组成员列表。

    - **创建 / 删除 / 移动 / 重命名对象**：此处的 AD 对象是 *计算机* 或 *OU*。同样，我们需要提供一个位置（区别名称）来执行这些操作。

    - **创建 / 修改 / 解锁用户**：**创建** 操作也需要用户应创建的位置，以及常见的属性，例如名字、姓名缩写、姓氏、用户名和密码。它还允许您指定密码是否永不过期或用户帐户是否将被禁用（用户无法登录）。

    - **获取用户信息 / 更新用户信息**：这为要检索或更新用户对象属性的用户提供区别名称。


    提示 – 无需成员资格管理 AD


    '
