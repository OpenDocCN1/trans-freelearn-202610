    A business application such as Dynamics 365 has a sufficiently complex HTML structure.
    The interface is mostly the result of a rendering process performed by an underlying
    framework. In Dynamics 365, for example, the React framework is used for this
    purpose. However, this also means that the selector for an HTML element can have
    a very complex structure. So, if you have any doubts, some manual work is required
    to find the right element. More about this will be provided in Chapter 12.


    The ideas and concepts presented here are also applicable to normal and public
    websites. As a rule, simpler structures can be found here, which are also better
    recognized by the **Web Data Extraction** action – for example, HTML tables.


    However, this example is already a good transition to our next chapter, in which
    we will take a closer look at the capabilities of Power Platform, which is also
    home to Dynamics 365.


