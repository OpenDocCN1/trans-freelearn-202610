    chosen. The new value we add must comply with a specific syntax. To add a new
    car record with Manufacturer = Chevrolet and Country = USA, we would need to enter
    %[ ''Chevrolet'', ''USA'' ]%.


    We will talk about the % notation in the next section, but essentially, we need
    to pass a list or a data row in the New value(s) parameter that is encapsulated
