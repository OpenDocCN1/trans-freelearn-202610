    +   - Remove duplicate items from list


    All of these are quite self-explanatory and do what their names suggest. They
    do not expose any additional variables.


    Some actions need two lists to operate. These are Merge lists, Find common list
    items and Subtract lists. However, these actions create a new list, which is the
    result of the corresponding operation.


    # Data table


    In addition to the one-dimensional list data type, we could also use a two-dimensional
    or tabular data table to store values. You can think of a data table as a simple
    Excel spreadsheet. There is a specific action that reads data from an Excel spreadsheet
    and returns a data table. These actions create and manipulate data rows that are
    also located in the Variables action group but in the Data table folder.


    To create a data table variable, we could use the Create new data table option.
    The actions parameter dialog contains an Edit button for defining the table:'
