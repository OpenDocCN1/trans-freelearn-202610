    ## Mouse, keyboard, and clipboard


    The actions in this group complete the possibilities from this chapter in terms
    of simulating user sessions and provide all the actions that a real user can perform,
    starting from specific mouse sequences to sending shortcuts and predefined key
    combinations. Here are the details:


    +   - **Block Input**: This action has a switch to block or unblock any keystroke
    or mouse click made by the user. This is useful so that a flow is not disturbed
    by additional keystrokes or mouse clicks from the user during execution. But be
    careful. On the one hand, please do not forget to insert an `Unblock` action at
    the end of the flow in any case. Also,

    please do not create a breakpoint in between because this will stop the flow,
    and there is no chance to continue the flow because of blocked input options.

    +   - **Get mouse position**: This stores the coordinates of the mouse pointer
    in two variables (the x position and y position) relative to the screen or a foreground
    window.

    +   - **Move mouse / to image / to text on screen (OCR)**: Can be used to move
    the mouse pointer to a specific position on the screen. You could also place the
    mouse pointer in the desired position and press Ctrl + Shift. This transfers the
    current coordinates into the action parameters. There are also multiple motion
    behaviors from **instant** to **with animation (high speed)**. When using the
    **Move mouse to image** action, it is possible to define or select an image (see
    *Chapter 5* on images) to move the mouse to and even to send a click after the
    move. PAD can also detect text on the screen by using **optical character recognition
    (OCR)** technology. The **Move mouse to text on screen (OCR)** allows you to select
    an OCR engine, text that should be found, and some additional options. For example,
    if you have identified an area of the screen where you want to perform a mouse
    click, which may be labeled with text, this action can be used successfully to
    move the mouse to that area and trigger the click.

    +   - **Send mouse click**: This action can send a wide range of mouse events
    starting from standard left- and right-click, double-click, and middle-click.
    It is also possible to just send the button down event and the button up event
    at another time. This action also includes a switch that allows moving the mouse
    pointer to specific coordinates, which is essentially the same as the **Move mouse**
    action.

    +   - **Wait for mouse**: When an application receives a mouse click, the mouse
    cursor might change to a **wait** cursor or an **hourglass** cursor. This action
    can be used to wait for the cursor to become/not become a regular cursor again.


    With these mouse control actions, it is possible to simulate hardware that may
    not exist in front of the workstation, for example, if there is no middle button
    on the mouse. We can also implement and simulate *click-and-drag*

    or *drag-and-drop* operations. However, most applications can be operated not
    only by the mouse but usually also have a whole set of shortcuts that are entered
    directly from the keyboard and immediately trigger an action. To enable PAD to
    also use this very productive way of operating, there are the following keyboard
    actions:


