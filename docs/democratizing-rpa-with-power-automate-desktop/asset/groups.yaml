    # # Strategies for effective flow creation


    We have already covered the flow designer window and the menu options in the last
    section. In this section, we want to look at how we can make use of these possibilities
    to incorporate them in the design of a UI flow.


    Let’s take our initial example from the very first chapter. The challenge was
    to automatically extract information from multiple Word documents sent to us via
    email. We want to save that information into an Excel spreadsheet for further
    reporting. In the end, this flow had about 22 actions, 13 flow variables, and
    2 input/output variables. This flow already has a significant complexity, so let’s
    explore how we can reduce this complexity and implement the flow.


    # ## Start simple


    The first suggestion is to encourage you to start simply and work incrementally.
    Taking our given example, just start by dragging the **Launch Outlook**, **Retrieve
    email messages in Outlook**, and **Process email messages in Outlook** actions
    onto the workspace and play around with them. Once you have familiarized yourself
    with this topic, you can then move on to the next task. It is also possible to
    create separate flows to test things out and then take the knowledge to incorporate
    it into another flow.


    # ## Split the whole task


    Building on the previous concept, it is often useful on larger tasks to break
    the overall task into several pieces, as already shown in *Figure 3.8*. You can
    do this by using subflows. Referring to our previous example, this could look
    like this:


    +   - **Part 1 — message and attachment retrieval:** We need to retrieve all new
    messages from parents'
  - '[PAGE 86]


    +   - **Part 2 — processing of each attachment:** We want to look into each Word
    document and extract relevant information to store in the spreadsheet

    +   - **Part 3 — cleanup and housekeeping:** Close all open programs


    We can now work on separate tasks, which straight away reduces the complexity.


    # Work on a single item before looping


    In our example, we want to process several Word documents sent to us by parents.
    We can use the XY action to access all documents in a list.


    However, before we loop through the list of documents, we must first clarify for
    a single document what data we want to extract and how we want to store it. So
    it makes sense to go through the flow with a single document and design these
    steps before doing the whole thing in a loop for all documents. Later, it is possible
    to drag a loop action into the workspace and place the single processing there.
    To do this, you can simply drag and drop the required actions, as we learned previously
    in this chapter.


    # Deactivate to test steps


    At some point, a longer flow will come up that will be run through very often
    to test it. The same steps will be run through again and again from start to finish.
    However, if only a specific part is to be tested or refined, it makes sense to
    omit those actions that are not in focus. These actions can then simply be deactivated
    for this purpose, and a breakpoint can be used to stop at the desired action.


    In our example, we could run into an error when listing the documents in the **Get
    files in folder** action. For error detection, it is irrelevant whether Outlook
    was started before and all emails were fetched. Therefore, we can simply disable
    those very steps for this test. In addition, it makes sense in this situation
    to set a breakpoint in the **Get files in folder** action to pause'
  - '[PAGE 87]


