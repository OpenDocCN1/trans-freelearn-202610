    有时，我们可能想使用 % 符号而不是在表达式中，而只是作为一个普通字符。在这种情况下，可以通过另一个百分号（%%）来转义该字符。


    这种记法非常直接易用，有时在我们本应只放置变量本身的字段中直接进行简单计算非常方便。除此之外，在这些表达式中，还可以使用变量的数据类型属性。这指的是由非内置数据类型提供的那些属性。例如，日期、列表、文件、文件夹、Outlook
    消息、Web 浏览器实例等。例如，**获取文件夹中的文件** 操作会返回一个文件列表，每个文件都是 **File** 数据类型。我们可以遍历此列表，并在名为
    `currentItem` 的变量中保存当前项，以访问以下等属性：


