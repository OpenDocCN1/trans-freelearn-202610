    如我们所见，我们需要更多 UI 操作来填充数据并提取数据。下图展示了为我们完成所需步骤的流程：


    - 保存

    - 运行

    - 停止

    - 运行下一个操作

    - 记录器

    - 子流程

    - 主流程

    - ExtractNewOrders

