    Figure 2.23 – The Debug menu


    This designer window will also show up in another area at the bottom of the screen
    when a flow runs into an error. There will be detailed information about where
    the flow stopped and why. Now that we have a few more details, we’ll use the recorder
    to create another flow in the next section.


    # Making use of the recorder'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'As you saw in the previous chapter, the PAD designer window allows us not only
    to drag and drop actions onto the design canvas but also allows us to record a
    UI flow. This concept is comparable to a screen recorder that records every step,
    every mouse click, and keyboard stroke to play back this sequence the same way
    later.


    We want to use this functionality once to create an overview of all book titles
    of the PacktPub publisher so that we can use this information elsewhere – for
    example, in a database. Unfortunately, we don’t have direct access to PacktPub’s
    underlying source, but we can get the book titles via their website at https://subscription.packtpub.com/search.
    However, we don’t want to highlight every single title on the website and then
    copy and paste them into another tool. That would take a very long time and also
    be quite boring. PAD can do this job for us.


    In the following example, we will use a concept known as web scraping – that is,
    structurally extracting information from web pages. Note this also works with
    numerous other websites, so this technique can be used universally. However, the
    prerequisite for using this method is that we must install and activate a small
    extension for the browser we’re using so that PAD can access the elements of a
    web page. So, let’s get started:


    +   1. Create a new flow and give it a meaningful name, such as **Web Scraping
    PacktPub**.

    +   2. Locate the **Browser automation actions** group in the actions pane and
    expand it. You will see a **Launch new...** action for each of the browsers from
    Google, Firefox, and Microsoft Edge. I have Microsoft Edge installed on my machine,
    so I will click and drag this action onto the canvas:'
  merge: -1
  img_proc: true
- pgno: 58
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_58_0.png)


    # Figure 2.24 – Dragging the browser action onto the canvas


    3. At this point, you might be requested to install the browser extension for
    PAD:


    # You need the Power Automate extension.


    +   1. To use web automation in your flows, select ''Get Extension'' to download
    and install to the selected browser.

    +   2. After installing, be sure to enable the extension in the browser.


    # Figure 2.25 – Browser extension installation dialog


    4. This will only happen once. Get the extension and make sure that it is activated.'
  merge: -1
  img_proc: true
