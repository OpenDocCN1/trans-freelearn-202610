- pgno: 283
  md: 'In the first section of this chapter, we saw that Azure is the foundation for
    all Microsoft Cloud services. To explain the concept of Azure without going too
    much into the details, take a look at the following diagram:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_283_0.png)


    Figure 9.19 – Azure relationship between different components


    The tenant is equivalent to an organization or a company. Typically, the tenant
    contains an Azure Active Directory where we can define and register new applications
    that need to access resources within the tenant.


    A subscription is a financial boundary for any kind of resource. Because resources
    consume CPU and/or memory, there must be financial coverage of the consumption.
    There can be multiple subscriptions within a tenant.


    The next level is a resource group, which usually relates to a specific purpose
    or topic. For example, it could be possible to create a resource group that contains
    all resources for automating a specific workload or application. These resources
    can be storage (disk or volume to persist data) or virtual machines and many more
    types of resources.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'For PAD to be able to access resources in Azure, we need to register a new
    app within Azure Active Directory. This would have a new client ID as a result,
    which we can use for the corresponding field in the Actions Parameter dialog.
    Within this app registration, it is also possible to create a client secret, which
    is a fixed password to use for logging in with this client. In the Azure portal,
    go to Azure Active Directory | App registrations and create a new registration:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_284_0.png)


    Figure 9.20 – Azure Active Directory – App registrations


    Together with the Tenant ID (or Directory (tenant) ID in the preceding screenshot)
    and Subscription ID properties (needs to be looked up in the subscription), we
    have all the information for the Azure session to log on:'
  merge: -1
  img_proc: true
