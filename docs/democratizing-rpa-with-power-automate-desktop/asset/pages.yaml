- pgno: 330
  md: 'Of course, we also need functions within PAD to work with data, to create,
    transform, and display it. Some of these functionalities can also be found in
    the action group for variables, for example, creating a random number and dealing
    with lists and objects. However, there are also frequent situations, especially
    in the business context, where it is necessary to work with date values:


    +   - The current date should be saved for a quotation

    +   - The due date for an invoice is to be calculated 2 weeks from now

    +   - The age in days between two dates is to be calculated


    For these purposes, the actions in the **Date Time** group can be used. Here we
    have the following actions:


    +   - **Add to datetime**: This expects a value for a date and a number to add.
    A **Time unit** field allows us to determine whether the value to add is interpreted
    as seconds, minutes, hours, days, months, or years.

    +   - **Subtract dates**: This needs two dates to subtract and produces a `Time
    difference` variable. The resulting number can be influenced by a third parameter,
    which allows us to choose a value between days, hours, minutes, and seconds.

    +   - **Get current date and time**: This produces a variable that contains the
    current date and time. It is possible to use different time zones.


    # ## Actions for working with text


    In addition to date and time, manipulating text values is also very important.
    PAD offers numerous actions for this as well, which reside in the **Text** action
    group. Apart from the language, you can select what exactly should be recognized:


    +   - **Conversion actions**: Convert text to number / number to text / text to
    datetime / datetime to text / replace'
  merge: -1
  img_proc: true
- pgno: 331
  md: '+   - **Creation actions:** Create random text, Recognize entities in text,
    and Join / Split / Append line to text

    +   - **Manipulation actions:** Pad / Trim / Reverse / Change case / Escape text
    for regular expression

    +   - **Extraction actions:** Get subtext / Crop / Parse


    The individual actions are largely self-explanatory and the Microsoft documentation
    contains good information on this. However, I would like to take a closer look
    at the following actions.


    +   - The **Recognize entities in text** action is very helpful if there is a
    requirement to identify specific topics or facts in a given text and the exact
    position is unknown. Apart from the language, you can select what exactly should
    be recognized. Entries range from date and time to dimension, temperature, currency,
    email, URL, IP address, **globally unique identifier (GUID)**, and more. Imagine
    you need to determine a delivery date or phone number from a supplier’s email
    response. A regular expression could be used for this task, but this requires
    knowledge about how it works. It is simpler to use this action. It generates a
    result variable as a list containing the identified terms. A suitable example
    of this has already been presented in *Chapter 2*.

    +   - Another useful function is **Create random text**, as shown in the following
    screenshot. As you can see in the screenshot, numerous parameters can be set for
    creating random text. This action is especially useful for creating random passwords
    or keys for encryption.'
