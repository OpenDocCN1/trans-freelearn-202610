- pgno: 89
  md: '# # Basic Structure Elements and Flow Control


    A flow is typically executed from top to bottom. Sometimes, however, we need to
    include branches or even repeat certain actions. In this chapter, we will look
    at how the sequence of actions in processing can be controlled, because controlling
    the flow logic is an essential part of its creation.


    In this chapter, we will cover the following topics:


    +   - Using conditionals

    +   - Handling repetitive tasks with Loop statements

    +   - Error handling


    # ## Technical requirements


    You will need a workstation with PAD installed on your desktop, and you should
    know how the application works and how to create a simple flow.


    # ## Using conditionals


    Conditionals are used to ensure that a certain state is checked in advance before
    an action or a list of actions is executed. They are one of the basic concepts
    in programming and can be used to build a flow without programming knowledge.
    We already used conditionals in one of the previous examples where we needed to
    check whether a folder existed before we created one. Conditionals are commonly
    referred to as `If` statements.


    To use a conditional, we need to drag one of the actions in the **Conditionals**
    action group onto the workspace. We can locate this action group at the top'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'of the list, as shown in the following screenshot:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_90_0.png)


    Figure 4.1 – Elements in the Conditionals action group'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'It should be noted that these actions, listed in *Figure 4.1*, must be used
    in a specific order and sequence. The following subsections explain how to use
    each action in context.


    # Starting with If and Else


    In most cases, when we need to check a condition, the `If` statement action is
    the starting point. If you drag an `If` action onto the workspace, the actions
    parameter dialog appears and needs information, as we can see in *Figure 4.2*:


    +   - **First operand:** Determines what we want to check

    +   - **Operator:** Determines which operation to use for the check

    +   - **Second operand:** Determines what to check against


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_91_0.png)'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Figure 4.2 – If action parameter dialog


    Essentially, what happens here is that we can compare two values (first and second
    operands) with each other (equal or not, greater than, etc.) and then decide what
    should happen if they do or don’t match. If we now populate the first and second
    operands with some meaningful values (or some static text for demonstration purposes),
    the workspace will look like this:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_92_0.png)


    Figure 4.3 – A generic If block


    As we can see, an End action has automatically been placed below the If action
    to mark the end of this block.


    Do not disable or delete the End block


    The End closing block is just another action in that it can be moved around, disabled,
    or even deleted. If you do this, the flow designer immediately shows an error
    saying that the End statement is missing. If you accidentally delete the End statement,
    you can just go to the Flow control actions group and drag a new End action to
    the right place in the workspace. Be careful as well to put End at the end of
    your conditional block and not just after If.


    We can now drag additional actions right inside this block. These actions will
    only be executed if the If action and the operator evaluation will be true. For
    example, we could simply drag a Display message action into the block to display
    a message box if the evaluation returns true. But what if the result is false?
    Well, in this case, nothing would happen unless we also drag an Else action into
    the workspace between the If and End statement. All actions that are now placed
    below the Else block will be executed when'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'the `If` block evaluates to *false*. To test this out, we could also drag a
    **Display message** action into the workspace below the `Else` block and display
    a different message, as shown in the following screenshot:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_93_0.png)


    Figure 4.4 – If-Else block with different messages


    Another important concept is that `If` statements can be nested; that is, within
    an `If` block, it is possible to place another `If` block. We will learn some
    examples of this in the course of the chapter.


    As it does not really make sense to compare two static values, we would want to
    compare values that are stored in variables. We will dive deeper into the topic
    of variables in the next chapter, but for the purpose of this chapter, let’s create
    some simple variables. To do this, use the *plus* button on the right side of
    the workspace in the **Input / output variables** area, and choose **Input**.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_94_0.png)


    Figure 4.5 – Create a new input variable


    In the following dialog, we have the option to give the variable a name, a data
    type, and a default value. Use this dialog now five times to create the following
