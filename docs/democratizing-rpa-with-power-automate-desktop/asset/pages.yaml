- pgno: 301
  md: '# Figure 10.6 – Create an API key in Google Cloud


    After this, API key is displayed in a window so that it can be copied and pasted
    into one of the actions for PAD. This process must be repeated for each API that
    is to be used. Two APIs can be used within PAD, Natural Language and Vision:


    +   - Natural Language: This allows us to analyze the sentiment (the mood in this
    text), entities (what the text is about), or syntax (how the text is structured)
    of a given text.

    +   - Vision: This takes an image and can detect different objects such as labels
    (or objects), landmarks, text, logos, and image properties. It also allows to
    detect saved search.


    Let’s take a look at a very simple UI flow to demonstrate these results.


    # Sentiment analysis in PAD'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'In this example, we take a text document with some content:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_302_0.png)


    Figure 10.7 – A sample text file for AI analysis


    We can now create a flow and drag the Analyze sentiment and Analyze entities actions
    into the designer, equipped with an API key and the location of this file.


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_302_1.png)


