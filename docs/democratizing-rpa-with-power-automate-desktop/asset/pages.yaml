- pgno: 31
  md: '# # Using Power Automate Desktop and Creating Our First Flow


    In the previous chapter, we saw how **Power Automate Desktop (PAD)** was born
    and how powerful the tool can be for automating repetitive tasks. In this chapter,
    we will take a detailed look into the following:


    +   - What is necessary for installing PAD on a local machine

    +   - How the application is built up

    +   - How to create our first flow by using the built-in recorder


    To use PAD effectively, a basic understanding of the application is essential,
    as we will spend most of our time on the very areas presented here. Also, knowledge
    of the PAD recorder will be extremely helpful throughout this book because it
    can also save us a lot of time when creating flows. Now, let’s look at how we
    can get PAD running on our computers.


    # ## Understanding the prerequisites for installing PAD


    Let’s begin by taking a look at what you need to get Power Automate up and running
    on a local machine. Two things are required to install Power Automate:


    +   - A Windows operating system (Windows 10 or Windows 11 Home edition or above)
    and some hardware requirements/recommendations

    +   - A Microsoft work or school account to sign in to Power Automate


    Since there are specific things to consider, let’s take a closer look at each
    of these topics now.'
  merge: -1
  img_proc: true
- pgno: 32
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # Microsoft account


    To be able to access the files for installing PAD, a Microsoft account (formally
    known as Windows Live ID) is required. There are different types of accounts and
    all of them are suitable for using PAD:


    +   - **(Personal) Microsoft account:** This is probably the most commonly used
    type of account in the private area. It is free and provides access to Microsoft’s
    consumer services such as **Outlook.com, OneDrive, and Office applications**.
    To sign up, an existing email address can be used or a new one can be created.
    This account can also be used to sign in to a Windows machine.

    +   - **Work or school account:** This type of account is created by an organization
    that uses **Azure Active Directory (AAD)** as the authentication and authorization
    platform. Typically, additional services or subscriptions are purchased that offer
    additional functionality to users.

    +   - **Organization premium account:** This is a special form of work or school
    account. In this case, the organization is not only managing users via AAD but
    has also moved certain or all parts of IT to the cloud, such as Exchange, Teams,
    and Business applications.


    With all three types, the full potential of PAD can be unleashed. The organization’s
    premium account has the following capabilities on top:


    +   - Connecting and integrating with cloud flows (see the previous comments on
    the operating system)

    +   - Collaboration and advanced functionality (such as central Dataverse storage,
    sharing of flows, as well as centralized management and reporting)

    +   - Additional premium functionality such as access to AI Builder and unattended
    execution of flows'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'For the vast majority of use cases, a personal Microsoft account is sufficient.
    Nevertheless, in the following chapters of this book, we will see scenarios where
    a premium account is necessary to access specific services.


    # Additional notes on accounts


    To install PAD, a user with administrator privileges on the device is required.
    A Windows local or domain account with these privileges should be used. To access
    PAD installation files, however, one of the Microsoft accounts mentioned previously
    is necessary. The Windows local account can be associated with the Microsoft account
    in the corresponding Windows account settings.


    Now that we know the prerequisites, let’s take a look at how to install the software.


    # Installing PAD


    The installation files for PAD are not on the local Windows medium – you must
    download these from the Microsoft download center. Therefore, an active internet
    connection and a modern browser are required – Microsoft Edge version 80 or higher
    or Google Chrome. For this book, I am using a machine with Windows 11 Home edition
    and a freshly created personal Microsoft account. To install PAD, do the following:


    +   1. Open your browser and navigate to https://www.office.com. If you are not
    already logged in, do so with your Microsoft account.

    +   2. On the right-hand side, you should see a list of familiar icons such as
    those for Word, Excel, and more. Click on the last one, called Apps. Clicking
    this icon will make additional apps appear:'
  merge: -1
  img_proc: true
