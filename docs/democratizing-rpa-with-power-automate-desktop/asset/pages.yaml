  md: 'Figure 9.14 – Creating a SharePoint connection and reference


    # Connections and connection references


    To use the SharePoint actions in PAD, we need a connection, as well as a connection
    reference. Both can be created from within PAD. The concept of connection references
    was introduced by Microsoft to abstract from a specific connection to an API or
    service, which can be different in different environments. Additionally, a connection
    reference can be part of a solution (a transportable unit of customization). All
    this is just background information and not necessarily important in the context
    of PAD unless we enter the enterprise area.


    As an example, I created a simple page in SharePoint. This already contains lists,
    as well as a document library. The individual actions should be familiar to SharePoint
    users and are largely self-explanatory. Only the connection with data from a local
