- pgno: 300
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_300_0.png)


    Figure 10.5 – The Google Cloud Console


    After an API has been activated, credentials must still be created to be able
    to call this interface from outside. This also applies to the actions in PAD,
    as these require an API key for execution. For each service, there is a **Credentials**
    section, which can be used to create an API key (see the following screenshot).'
