- pgno: 222
  md: '# Working with SAP


    SAP is both the company and the enterprise management software. At least by name,
    this software product should be known to everyone, since it is very widespread
    around the world, especially since the company represents the world’s fourth largest
    company in the field of software and programming. For a very long time, **SAP
    ERP** was the standard software in the **enterprise resource planning (ERP)**
    area, which, in turn, was based on **SAP R/3**, which was first introduced in
    1992. The latest version of SAP ERP is version 6.0, which was introduced back
    in 2006 and has been maintained with service packs and small enhancements since
    then. It is now considered legacy technology and the new version is **SAP S/4HANA
    (High-performance ANalytical Appliance)**.


    A while ago, however, SAP announced that SAP ERP will continue to be supported
    until 2027 or 2030 (with extended support; see the *Further reading* section for
    details), and certainly for good reason. This migration and switch to the new
    version, S/4HANA, is associated with high costs for many customers. Apart from
    the software, the hardware usually also has to be replaced, which can be very
    costly for ERP software if cloud use is not planned at the same time – all of
    which are reasons why we still find many SAP R/3 installations to this day. Automation
    with PAD can be very useful because companies think very carefully about whether
    and how much they still want to invest in an outdated software system. So, why
    not use a lightweight integration solution and put the money that’s been saved
    into the project for the future ERP system? So, let’s take a look at how we can
    use PAD to connect to the SAP interface, called **SAPGUI**, which needs to be
    installed locally for the following example and which is the standard client software
    for SAP ERP systems. This software is contained in the trial version of an SAP
    test system for development purposes, which was built up and used for this example.


    # Hint


    Scripting must be installed and enabled for PAD to capture and target elements
    in this program. The following screenshot shows how to allow scripting within
    SAPGUI:'
  merge: -1
  img_proc: true
- pgno: 223
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_223_0.png)


    Figure 8.1 – Enabling scripting for SAPGUI


    # Distributed user management with PAD


    Let’s imagine that we are responsible for setting up users who will start in our
    small company next month. Besides a login name and a mailbox, of course, an SAP
    login is also needed. The HR department has already created accounts in Active
    Directory and collected the users for them in an Excel spreadsheet. Our task is
    to create the users listed there in SAP and to send the login information by email.
    This also includes creating an initial password. So, we need a flow that does
    the following for us:


    +   - Read all users from the Excel spreadsheet and extract data

    +   - Launch SAPGUI and call the corresponding transaction to create new users
    (SU01)

    +   - Iterate through the Excel data, generate a new password, store this in the
    corresponding row of the table, and use the data to create a user in SAP

    +   - Send an email to the user with the initial password'
  merge: -1
  img_proc: true
