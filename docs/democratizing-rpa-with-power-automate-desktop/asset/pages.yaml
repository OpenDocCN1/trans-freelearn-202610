- pgno: 205
  md: 'we cannot discuss every action in detail; that would go beyond the scope of
    the book. However, it is important to understand what basic functionalities are
    hidden in the action groups so that you know where to look to master a particular
    task.


    In the last section, we will explore the actions to interact with a workstation
    and address the peripherals.


    # # Operating computer peripherals


    The actions presented in this section complete the capabilities of PAD to manage
    workstations by simulating an operation or, of course, to cover other use cases.
    The following components can be controlled and can be found as action groups:


    +   - The workstation itself and connected printers

    +   - The mouse and keyboard

    +   - The clipboard


    With these action groups, it is possible to simulate complete user sessions by
    moving the mouse or pressing keystrokes.


    This can also be helpful, for example, when none of the previously discussed options
    (UI elements or images) are available to communicate with an application. Maybe
    we are not able to capture UI elements, but then we can still navigate the mouse
    to specific positions and send clicks or even keys.


    However, at this point, we have to be very precise, and this is for the following
    reason. We will see in this example that the **Send mouse click** action works
    with the X and Y coordinates of the screen. This means that the mouse is guided
    exactly to these coordinates, and then the click is triggered. This will work
    until the screen resolution of the local machine is eventually changed or the
    flow is run on another machine with a different resolution. The same coordinates
    then lead to a completely different'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'location, so the flow no longer works properly. The relationship is shown in
    the following diagram:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_206_0.png)


    Figure 7.13 – Different screen resolutions and the same coordinates


    As we can see in the preceding diagram, the coordinates **X=960** and **Y=540**
    are exactly in the middle of the screen on the left side. But when the screen
    resolution changes, these coordinates are in the top left area rather than in
    the middle. This means that when using actions that work with mouse coordinates,
    you must always make sure that the screen resolution is also the same as the one
    used to create the flow. With the **Get screen resolution** and **Set screen resolution**
    actions, these settings can be checked and changed if necessary.


    Let’s take a look at the options in detail.


    # ## Workstation


    This action group comprises all actions that have to do with the workstation in
    the narrower sense. These include the following:


    +   - **Workstation: Lock Workstation/Log off User/Shutdown computer:** It is
    important to distinguish the different actions. **Lock** corresponds to the same
    locking function in Windows, also available via the *Windows* key + L shortcut.
    The flow will continue to run afterward in the background. Logging off the current
    user instead will terminate the flow from that point on, as will the **Shutdown
    computer** action. The last one'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'also has a parameter to define whether to just shut down, restart, hibernate,
    or set the workstation to sleep.


    +   - **Print: Print document/Get default printer/Set default printer:** These
    work with a text field for the document name, getting or setting the printer.

    +   - **Screen: Get screen resolution/Set screen resolution/Control screen saver:**
    These actions need a connected console session to work with. This session is available
    when a user is logged in to the workstation and PAD is executed by this user.
    That means that a user is logged in and has started the PAD console. In unattended
    scenarios, these actions don’t have any effect. Setting the screen resolution
    can help to run scenarios in a standardized way, which works with screen coordinates,
    for example, mouse movements (see next section).

    +   - **Miscellaneous other actions: Show desktop/Play sound/Empty recycle bin/Take
    screenshot:** It is worth mentioning here that **Show desktop** can both show
    the desktop and restore all windows. Furthermore, **Take screenshot** is useful
    for collecting and documenting information about a system for the entire desktop
    or foreground window.


    Before we look at another example, let’s first look at the actions for the keyboard
    and mouse.


    # Mouse, keyboard, and clipboard


    The actions in this group complete the possibilities from this chapter in terms
    of simulating user sessions and provide all the actions that a real user can perform,
    starting from specific mouse sequences to sending shortcuts and predefined key
    combinations. Here are the details:


    +   - **Block Input**: This action has a switch to block or unblock any keystroke
    or mouse click made by the user. This is useful so that a flow is not disturbed
    by additional keystrokes or mouse clicks from the user during execution. But be
    careful. On the one hand, please do not forget to insert an `Unblock` action at
    the end of the flow in any case. Also,'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'please do not create a breakpoint in between because this will stop the flow,
    and there is no chance to continue the flow because of blocked input options.


    +   - **Get mouse position**: This stores the coordinates of the mouse pointer
    in two variables (the x position and y position) relative to the screen or a foreground
    window.

    +   - **Move mouse / to image / to text on screen (OCR)**: Can be used to move
    the mouse pointer to a specific position on the screen. You could also place the
    mouse pointer in the desired position and press Ctrl + Shift. This transfers the
    current coordinates into the action parameters. There are also multiple motion
    behaviors from **instant** to **with animation (high speed)**. When using the
    **Move mouse to image** action, it is possible to define or select an image (see
    *Chapter 5* on images) to move the mouse to and even to send a click after the
    move. PAD can also detect text on the screen by using **optical character recognition
    (OCR)** technology. The **Move mouse to text on screen (OCR)** allows you to select
    an OCR engine, text that should be found, and some additional options. For example,
    if you have identified an area of the screen where you want to perform a mouse
    click, which may be labeled with text, this action can be used successfully to
    move the mouse to that area and trigger the click.

    +   - **Send mouse click**: This action can send a wide range of mouse events
    starting from standard left- and right-click, double-click, and middle-click.
    It is also possible to just send the button down event and the button up event
    at another time. This action also includes a switch that allows moving the mouse
    pointer to specific coordinates, which is essentially the same as the **Move mouse**
    action.

    +   - **Wait for mouse**: When an application receives a mouse click, the mouse
    cursor might change to a **wait** cursor or an **hourglass** cursor. This action
    can be used to wait for the cursor to become/not become a regular cursor again.


    With these mouse control actions, it is possible to simulate hardware that may
    not exist in front of the workstation, for example, if there is no middle button
    on the mouse. We can also implement and simulate *click-and-drag*'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'or *drag-and-drop* operations. However, most applications can be operated not
    only by the mouse but usually also have a whole set of shortcuts that are entered
    directly from the keyboard and immediately trigger an action. To enable PAD to
    also use this very productive way of operating, there are the following keyboard
    actions:


    **Send keys**: If we want to type some text to the current location of the cursor
    in the foreground window/window instance/title or class of a window or a UI element,
    this would be the action to use. The following screenshot shows the parameters
    for this action:


    # Send keys


    Sends keys to the application that is currently active More info


    # Select parameters


    Send keys to: Foreground window


    Text to send: Input as text, variable or expression


    Insert special keys Insert modifier


    Delay between keystrokes: 10


    Send Text as hardware keys:


    On error Save Cancel'
  merge: -1
