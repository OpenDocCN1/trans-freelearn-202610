- pgno: 320
  md: '| Feature/Action group | Outlook | Exchange Server | Email |

    |---|---|---|---|

    | Connection capability | Any mailbox that is connected through Outlook, including
    Outlook 365 | One personal or shared mailbox | Any IMAP server |

    | Retrieve email messages | Yes | Yes | Yes |

    | Send email messages | Yes | Yes | Yes |

    | Process email messages | Yes | Yes | Yes |

    | Save messages | Yes | No | No |

    | Respond to messages | Yes | No | No |


    Table 11.1 – A comparison between different email options in PAD


    As we can see here, there are many similarities between the different action groups
    and one major difference. While the **Exchange Server** and **Email** action groups
    work with network requests to execute the actions, the Outlook actions address
    the functionality of a locally installed Outlook client. This has the following
    consequences:


    +   - When using Outlook, a local program is started; for example, this program
    must also be available, installed, and set up.

    +   - The advantage is that the actions can be used with all mailboxes that Outlook
    is set up for, including Outlook 365, local Exchange Server, or any other mailbox.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '+   - The use of Outlook Actions also offers more advanced options such as
    **Save messages** or **Reply to a message** for this very reason.

    +   - If Outlook is not installed on the computer running the UI flow, one of
    the other action groups must be used.

    +   - However, this also has the advantage that local computer resources can be
    saved and, thus, resources can be made available for other tasks.


    The lightest option for emails is to use the **Retrieve email messages**, **Process
    email messages**, and **Send email** actions in the **Email** action group. The
