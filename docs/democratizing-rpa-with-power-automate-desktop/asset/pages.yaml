    # Variable types


    Input/output variables can have a simple type (text, number, or boolean) or a
    complex type (custom object, list, or data table). While a simple type can contain
    only one value (text = “some text value”, number = 5, or boolean = True or False),
    complex types can contain multiple entries or even records. This makes sense,
    especially if desktop flows are part of a larger scenario, in which not only simple
    values but lists and tables are to be transferred and processed. Let’s explore
    which complex variable types are available.


    To work with variables, we have a dedicated actions group called **Variables**
    at the very top of the list of action groups. Here, we will find a lot of actions
    that deal with complex data types, but also some for the simple types, such as
    the number data type:'
  merge: -1
  img_proc: true
- pgno: 133
  md: '+   - **Truncate number**: Allows you to extract the integral or fractional
    part of a numeric value.

    +   - **Generate random number**: Useful for creating a random number within given
    boundaries. We used this in the previous chapter in the dice simulation.

    +   - **Increase variable** and **decrease variable**: Does what it sounds like.


    The remaining actions are related to complex data types, which we’ll look at next.


    # List data type


    If we need to store multiple values separately, we could use a list. In programming
    terms, this would be a one-dimensional array. A list can be created by using the
    corresponding action, **Create new list**, or defining an input/output variable
    with that type. Other actions also create lists, such as **Retrieve email messages
    from Outlook** or **Get files in folder**. When you have a list, it is very convenient
    to iterate through all the items by using a `for each` loop. We saw this in previous
    chapters. Nevertheless, it is also possible to access individual members of a
    list through an index that starts with 0 as the first element. The syntax is as
    follows:


    ```

    %Listname[StartIndex:NumberOfEntries]%

    ```


    Example: Imagine a list of cars with the following entries: `Mercedes, Aston Martin,
    BMW, Chrysler, Fiat, Toyota, and so on.` The `%Cars[0:3]%` expression would select
    `Mercedes, Aston Martin, and BMW.` Remember: we start to count at 0.


    We have different additional actions that can be used with a list. To manipulate
    the content of the list, we could use the following:


    +   - Clear list'
  merge: -1
  img_proc: true
- pgno: 134
  md: '+   - Add item to list

    +   - Remove item from list

    +   - Sort list, Shuffle list

    +   - Reverse list

    +   - Remove duplicate items from list


    All of these are quite self-explanatory and do what their names suggest. They
    do not expose any additional variables.


    Some actions need two lists to operate. These are Merge lists, Find common list
    items and Subtract lists. However, these actions create a new list, which is the
    result of the corresponding operation.


    # Data table


    In addition to the one-dimensional list data type, we could also use a two-dimensional
    or tabular data table to store values. You can think of a data table as a simple
    Excel spreadsheet. There is a specific action that reads data from an Excel spreadsheet
    and returns a data table. These actions create and manipulate data rows that are
    also located in the Variables action group but in the Data table folder.


    To create a data table variable, we could use the Create new data table option.
    The actions parameter dialog contains an Edit button for defining the table:'
