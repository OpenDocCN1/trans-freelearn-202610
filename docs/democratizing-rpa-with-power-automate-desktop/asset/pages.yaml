- pgno: 289
  md: '# Leveraging Artificial Intelligence


    The topic of **artificial intelligence (AI)** has been hotly debated for some
    time and has gained further popularity with the advent of OpenAI and ChatGPT.
    In this chapter, we want to shed light on what possibilities we have within PAD
    in this regard and look at the following areas:


    +   - An introduction to cognitive services

    +   - Diving into the offerings of Microsoft, Google, and IBM

    +   - Classification in the practical work with PADT


    After reading this chapter, we will have a solid understanding of what AI means,
    in which areas this technology helps optimize business processes, and how these
    functionalities can be deployed and used with PAD.


    # Technical requirements


    The services addressed in this chapter are accessed online by the respective providers.
    This requires a corresponding subscription with the vendors, who all provide a
    test period with certain credits free of charge. The process for starting a trial
    and subsequent steps are different in each case and are highlighted in the corresponding
    sections.


    # Introduction to cognitive services and artificial intelligence


    The functionalities discussed in this chapter all deal with AI and **machine learning
    (ML)**. Before we turn to the individual providers and their functionality, we
    will first classify the topic in general and consider what benefits AI can bring
    to everyday life and in the business context.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'In general, it can be said that AI can help to recognize structures in text,
    image, or sound information so that they become machine-readable. Cognitive services
    hereby refer to a set of cloud-based **application programming interfaces (APIs)**
    and tools provided by Microsoft, IBM, Google, and other vendors that enable developers
    and creators to add advanced AI capabilities to their applications without needing
    to have deep expertise in ML or data science. The actions offered in PAD by the
    different vendors provide more or less the same functionalities, shown in the
    following diagram. Only the naming of the services is slightly different in some
    cases.


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_290_0.png)


    Figure 10.1 – An overview of cognitive services


    Let’s take a slightly closer look at these capabilities and how they can be used
    in a business context.


    # An overview of cognitive services


    Cognitive services can also be described as a set of APIs and tools that use ML
    algorithms to enable computers to perform tasks that normally require human-level
    intelligence. These services are typically hosted in the cloud and can be accessed
    through a REST API or **software development kit (SDK)**. The technology behind
    cognitive services can be broken down into a few key components:'
  merge: -1
  img_proc: true
- pgno: 291
  md: '+   - **ML**: At the heart of cognitive services is ML, a subfield of AI that
    involves training computers to recognize patterns in data. The ML models used
    by cognitive services are typically trained on large amounts of labeled data and
    are designed to improve their accuracy over time as they are exposed to new data.
    The latest ML models start already by 100 datasets and are still improving.

    +   - **Deep learning**: Many cognitive services also use deep learning, a type
    of ML that involves training artificial neural networks with multiple layers.
    Deep learning models are particularly effective for image and speech recognition,
    as well as **natural language processing (NLP)**.

    +   - **NLP**: Some cognitive services, such as language translation and text-to-speech,
    use NLP algorithms to analyze and understand human language. NLP involves parsing
    text into its constituent parts, such as words and sentences, and using statistical
    models to identify patterns and relationships between these parts. **Language
    Understanding (LUIS)**, for example, is an NLP service that enables developers
    to build chatbots and other conversational interfaces.

    +   - **Computer vision**: Computer vision is a branch of AI that involves training
    computers to recognize and interpret visual information from images and videos.
    Cognitive services that use computer vision can perform object detection, facial
    recognition, and image classification tasks.

    +   - **Cloud computing**: Finally, cognitive services are typically hosted in
    the cloud, which enables them to be accessed by developers from anywhere in the
    world. Cloud computing also provides scalable, on-demand computing resources,
    which can help to reduce costs and improve performance.


    Overall, cognitive services are powered by a combination of advanced ML, deep
    learning, NLP, and computer vision algorithms, made accessible through cloud computing
    technologies. These services can help to automate many tasks that would otherwise
    require human-level intelligence, such as speech recognition, language translation,
    and image analysis. Cognitive services make it easier for people to add powerful
    AI capabilities to their'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'applications without needing to have extensive expertise in ML or data science.


    # AI in the context of business


    But how can these skills be applied meaningfully in a business context? Here are
    some examples of how cognitive services and image analysis can be used in different
    business scenarios:


    +   - **Customer service**: Chatbots powered by cognitive services can be used
    to provide customer service 24/7, answering frequently asked questions, helping
    customers find products and services, and resolving simple issues. These chatbots
    can be integrated into websites, messaging apps, and social media platforms. By
    including sentiment analysis, such chatbots can be used to analyze customer feedback
    and sentiment on social media platforms and review sites. This can help businesses
    to identify issues and address them quickly, as well as identify areas where they
    are excelling. Cognitive services can be used to power voice assistants that can
    be used for customer service. For example, a customer might use a voice assistant
    to track an order, update their account information, or ask for product recommendations.
    Cognitive services can be used to automatically create support tickets based on
    customer inquiries received via email, chat, or social media. This can help customer
    service teams to more efficiently manage their workload and respond to customers
    in a timely manner.

    +   - **E-commerce**: Cognitive services can be used to analyze images of products
    and recommend similar products to customers based on their preferences (upselling
    and cross-selling). For example, a customer might take a picture of a dress they
    like, and an e-commerce site could use image recognition to suggest similar dresses
    in different styles or colors. Cognitive services can be used to analyze images
    of products that customers submit as part of their support requests. This can
    help customer service representatives quickly understand the issue and provide
    more accurate and efficient support. Cognitive services can be used to detect
    fraudulent activities in e-commerce, such as the use of'
  merge: -1
  img_proc: true
- pgno: 293
