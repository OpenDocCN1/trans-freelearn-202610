    # Additional thoughts and automation options


    Of course, for every challenge, there are usually several possible solutions and
    the approach presented here is not the only one. It would also be possible, for
    example, to open Outlook only after processing the data in SAP and sending the
    emails to the users. This would probably also be the better variant for computers
    with little RAM. And as also mentioned, SAPGUI can be automated in other ways
    as well.


    Microsoft has recently added extensive information about SAPGUI integration and
    automation to its documentation, which also underlines the importance of this
    possibility once again.


    Here, we will talk about multiple implementation options:


    +   - **Pro-code**: In this approach, VBScript is used to interact with the underlying
    SAPGUI Scripting API. Here, actions to be executed are recorded by SAPGUI in the
    form of VBScript commands, which can then be imported and used in PAD. This sounds
    simple at first. However, unless you happen to be an expert in this scripting
    language, changes in the process will be difficult to implement.

    +   - **Low-code/no-code**: These two approaches use the recorder to capture specific
    fields such as buttons and text fields, which are tweaked'
  merge: -1
  img_proc: true
- pgno: 238
  md: '> afterward. This follows the concept of creating UI elements, which we learned
    about in *Chapters 5 and 6*.


    This section covered a very popular business application where we learned how
    to use PAD to automate this sometimes very complex program. The next section looks
    at the beginning of all IT concerning business applications and shows how to automate
    and integrate mainframe applications, which are still greatly popular.


    # Integrating mainframe scenarios


    The term **mainframe** refers to a family of computing machines that dates back
    to the 1950s. These are operated less by a graphical interface and more by a character-based
    user interface. They are characterized by very high reliability and very high
    throughput regarding input/output and arithmetic operations. Although the technology
    seems old-fashioned from today’s point of view, mainframes are still widely used.
    In this area of classic IT, a distinction is made between batch processing and
    dialog programs. APIs do not exist in such environments. Information exchange
    is mostly file-based or via database access. Mainframe applications are most commonly
    used in the area of **enterprise resource planning (ERP)**, financial accounting,
    warehousing, ordering, and more. Thus, many scenarios are conceivable in which
    integrating a mainframe application can be useful:


    +   - A web store takes orders from customers, which have to be entered into the
    central warehousing system

    +   - Suppliers use a web portal to confirm their deliveries, which, in turn,
    have to be entered into the central system


    Especially when the entry has to be done via dialog programs, automation is a
    challenge, but one that we can tackle very well with PAD. There are several manufacturers
    of mainframes such as Unisys, Fujitsu Siemens, and, of course, IBM as the major
    one with their zSeries and AS/400 machines. One of the most commonly used operating
    systems is **Multiple Virtual Storage (MVS)**, which was later renamed OS/390
    and finally z/OS with'
  merge: -1
  img_proc: true
- pgno: 239
  md: '64-bit support for zSeries machines. Fortunately, for those of us who don’t
    have a mainframe available or a connection to one of these, there is an emulation
    available for a slightly older version of MVS that runs very well on a Linux installation.
    In addition, on our PAD Windows machine, the terminal emulation software must
    be installed and network access to the emulation must exist. If everything has
    been configured, we can launch the terminal emulation and will see the welcome
    screen for MVS:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_239_0.png)


    Figure 8.11 – Terminal emulation for accessing MVS


    # Software prerequisites


    To control terminal applications, terminal emulation software is required, as
    well as access to a mainframe. PAD offers terminal emulation actions that work
    with Micro Focus Reflection or any other software that provides the HLLAPI implementation,
    such as RocketSoftware BlueZone, IBM Personal'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'Communications, and Cybelesoft zScope. For this book, I have used a trial version
    of Micro Focus Reflection and also created a virtual machine with an emulation
    of a common mainframe system based on IBM technology. Please refer to the corresponding
    section for more information.


    Now that we have all the prerequisites in place, we can log on to the system and
    explore its capabilities. To access programs, a valid user ID and password need
    to be provided. This version comes with pre-configured users and passwords that
