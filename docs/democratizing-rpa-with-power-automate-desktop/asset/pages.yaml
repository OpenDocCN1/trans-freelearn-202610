    # The designer window


    Let’s take a closer look at the designer window now:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_54_0.png)


    Figure 2.22 – The designer window of PAD


    Here, we have the following elements:


    +   1. The Actions pane: The left-hand side of the window belongs to the Actions
    pane. Actions represent functionality that a flow is capable of, such as “Open
    Excel” or “Get files in a folder.” These actions are grouped into different categories
    such as System or Folder You can see all the actions that belong to a category
    by expanding the'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'corresponding item. Just click on the arrow icon on the left of the category.
    Throughout this book, we will look at each of these actions. At the top of the
    list, there is also a **Search** box. If you enter a search term here, the list
    of actions gets filtered by this search term. We used this in our first flow.


    +   2. **The flow designer area**: In the middle of the window, there is a canvas
    that contains all the actions this flow is made of. Actions can be placed there
    by dragging them from the **Actions** pane. When a flow is started, the actions
    will run in the sequence in which they are listed here. This action list can be
    rearranged by just clicking and dragging an existing entry and putting it somewhere
    else. There will be a horizontal line displayed showing where an action can be
    placed. We saw this in our previous example. You can also double-click on an action
    to bring up the settings dialog for that action and modify the entries. In this
    area, there is also an option to look at the subflows. A subflow is just another
    UI flow that encapsulates a specific set of actions. By using subflows, it is
    possible to structure a large flow into different pieces. A subflow always belongs
    to a regular flow and is not shared between other flows.


    +   3. **The flow control bar**: The little bar at the top of the action list
    allows you to save, start, stop, and record a flow. There is also an option to
    start the flow and go action by action, which is also called **debugging**. We
    will take a closer look at this, as well as the recorder, in the next section.


    +   4. **The Variables viewer pane**: On the right-hand side, there’s an area
    that displays the variables of the flow. Variables are an important aspect of
    a flow for storing information during runtime. Variables will be covered in *Chapter
    5*.


    +   5. **The input elements switch**: Please also notice the two additional little
    icons below the variables icon, {x}. These can be used to switch to the area containing
    UI elements and images, which will also be covered later. You can hide this area
    by clicking on the icon.


    +   6. **Action and execution summary**: At the bottom, there is a little bar
    that summarizes the current flow. It is also possible to set a specific delay
    for the flow to run – in this example, 100 milliseconds.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'This is the applications menu bar. In addition to the typical functionality
    for saving and editing, the debug functionality is also available here once again,
    in which breakpoints can also be set. This allows a flow to be executed up to
    a certain point so that we can check the settings and variables in the event of
    an error:


