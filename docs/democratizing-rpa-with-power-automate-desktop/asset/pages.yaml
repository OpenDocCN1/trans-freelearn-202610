  md: 'A process in Windows represents a program that has been started. Such a process
    has both a name and a unique ID. We can view all started processes in Windows
    by executing the `tasklist` command on the command line. So, if we run Microsoft
    Word or any other program, the corresponding process will be started for it. Typically,
    users interact with processes that are started for a specific program. PAD has
    a **Run application** action that also does this. We have already used this action
    multiple times in our previous examples. We could use this action to start any
    application on the desktop or open a document that is associated with a specific
    application by providing some command-line arguments, as we see in the following
    screenshot:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_186_0.png)


    Figure 7.2 – Run application action parameters'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'The **Application path** parameter determines the executable program, including
    the full path to the application.


    In the **Command line arguments** parameter, we can enter all additional parameters
    that the application knows and that we want to bring in. In the preceding example,
    we used the command-line switch for opening a document.


    Tip for finding out the complete path of an application


    If you want to find out what the full path to an application is and there only
    is an entry in the Windows start menu, do the following:


    +   1. Identify the application by typing its name, then right-click on the icon,
    and choose **Open file location**. This will open Windows Explorer to the shortcut
    of the application


    +   2. Now right-click on the shortcut and choose **Open file location** again.
    This will locate the executable program in Windows Explorer.


    +   3. Finally, right-click on the application and choose **Copy as path** or
    *Ctrl + Shift + C* and paste this value into the **Application path** parameter
    field.


    If you want to use a specific working folder for the application, you can specify
    this in the corresponding parameter. **Window style** determines whether the application
    window will be displayed as normal, maximized, minimized, or hidden.


    Some applications take some time before they reveal an application window. This
    means the process has already started, but the **user interface (UI)** is not
    yet displayed. Another reason for this might be the performance of the local computer.
    But if we need this application window for further processing, we could specify
    what to do when the application launches: continue immediately or wait for the
    application to load or complete.


    When this action has been executed, the process ID of the application will be
    stored in the corresponding variable. This variable can be used later to close
    the program by terminating the process.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'To compensate for the latency of rather poorly equipped computers, it is helpful
    if PAD can wait for the availability of an application and thus a process or check
    whether a process is already running (or no longer running) in order to start
    the next resource-hungry application if necessary. This is where the **If process**
    and **Wait for process** actions come into play, doing exactly what they say they
    do, and for which they need a process name:


    +   - **If process:** This checks whether a given process name is or isn’t running

    +   - **Wait for process:** This suspends the execution of the flow


    Next, let’s discuss a scenario where these actions might be very useful:


    +   - We assume that there is a very heavy, large desktop application that we
    can only afford to run once on the computer because of limitations of CPU and
    RAM.

    +   - When we launch the application manually, it takes some time before the UI
    gets loaded and the application is operational. Here, we could use the **Run application**
    action and set the **After application launch** parameter to **Wait for the application
    to complete**.

    +   - We have to make sure that there is only one instance of this application.
    Otherwise, the computer won’t be responsive anymore. The application also sometimes
    crashes, so we want to make sure that any orphaned process gets terminated before
    we start a new one. The **If process** action could help here to check whether
    there is still another process running for the application, and we would use the
    **Terminate process** action to shut this process down.

    +   - We need some operations to run in that application very frequently, so we
    want to use PAD to automate these tasks. In this step, we would design our flow
    and create UI elements and actions to perform the tasks that we need.

    +   - After our work on the application, we want to ensure that the application
    is closed properly and completely. We could make use of the'
  merge: -1
  img_proc: true
- pgno: 189
  md: '**Wait for process** action here and check whether the process is terminated.
    We could also take care of any timeouts for this action and retry terminating
    the process.


    # Tip to avoid many configurations of different devices


    Introducing a device policy taken care of by the IT department will avoid fragmented
    hardware across your organization.


    The **System** action group also has additional actions, and we have summarized
    them as follows:


    +   - **If process/Wait for process**: Previously discussed.

    +   - **Run application/Terminate process**: Previously discussed.

    +   - **Ping**: This action sends a network message to a remote computer and checks
    whether the remote machine is accessible.

    +   - **Set/Get/Delete Windows environment variable**: These environment variables
    can store data and values in a central place used by the OS and all other installed
    programs. There are standard environment variables such as **WINDIR** (the installation
    location of the Windows OS) or **PATH** (a list of directories that contain important
    programs that are directly accessible via the command line). These corresponding
    actions can manage these entries within a PAD flow.


    In addition to running applications (processes) with a UI, an OS also has the
    concept of background services that don’t interact with a user. These services
    are also processes because once they are started, they appear in the list of active
    processes commonly wrapped by an application called `svchost.exe` (host application
    for a service). But they need special handling, which we have dedicated PAD actions
    for, located in the **Windows services** action group (see the following screenshot):'
  merge: -1
  img_proc: true
