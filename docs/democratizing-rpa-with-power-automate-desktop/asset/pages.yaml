- pgno: 219
  md: '# # Automating Standard Business Applications


    So far, we have encountered numerous examples in which we have integrated and
    automated various applications with PAD. This chapter serves to deepen some of
    these things and also to connect new widespread business application areas using
    PAD. This chapter will cover the following topics:


    +   - Automating Microsoft 365 (also known as Office) applications

    +   - Integrating and automating SAP

    +   - Connecting and working with mainframe applications

    +   - Automating browser-based business applications


    By the end of this chapter, we will know how to automate two very common business
    application scenarios so that you can connect other applications. Furthermore,
    you will have a deeper understanding of how to automate web-based business applications.


    # ## Technical requirements


    The sections in this chapter cover how to automate different software products,
    each of which also has different prerequisites. The details of these prerequisites
    are listed at the beginning of the respective sections.


    The last section of this chapter provides an example of how to automate a web-based
    business application such as Dynamics 365. You will need to request a trial instance
    of Dynamics 365 for Sales. This trial is free of charge and quite sufficient for
    this exercise (you can request the trial here: https://dynamics.microsoft.com/en-us/dynamics-365-free-trial/).
    However, since this is a business solution, you will also require a Microsoft
    business account to request a trial version.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Automating Microsoft Office


    In the previous chapters of this book, we used almost all Office products in our
    examples. We used Excel and Outlook in the introductory example in *Chapter 1*,
    while in the last two chapters, we saw how Microsoft Access and PowerPoint can
    be used as part of UI automation. While the latter concept can be used in conjunction
    with mouse and keyboard actions to include any application, there are dedicated
    PAD actions for Outlook and Excel that can be used within flows. We’ll take a
    closer look at these action groups in this section.


    # Automating Outlook with actions


    Being able to integrate Outlook into PAD can be very helpful in many situations.
    As already seen in our example in *Chapter 1*, it is possible to receive many
    emails or attachments of the same nature, move them to a specific folder, save
    them, and even reply if necessary. Another scenario could be that you retrieve
    messages from a support address, for example, and use that information to trigger
    further internal processing, such as entering certain data into other systems.
    The example in this chapter will show you another use case. Here, new users must
    be regularly provided with information so that they can log on to an SAP system.
    Here, too, Outlook can be integrated directly into a flow and send this notification
    directly. The following actions are available in the corresponding *Outlook* actions
    group to help us with these tasks:


    +   - **Launch/Close Outlook**: This action starts or ends an Outlook instance.
    A corresponding variable is created in the **launch** action, which can be used
    in the **close** action later to terminate the program.

    +   - **Retrieve email messages**: This action can accept an email account and
    allows you to define filter parameters for the emails to be received. In addition,
    settings can be made for any attachments.

    +   - **Send a message/Respond to a message**: These actions create a new message
    with all the required fields, such as email body, subject, and'
  merge: -1
  img_proc: true
