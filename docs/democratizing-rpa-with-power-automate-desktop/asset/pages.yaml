- pgno: 198
  md: '+   2. **Set variable**: Here, we set the `InputValue` input variable to the
    text that has been entered by the user.

    +   3. **Run JavaScript**: We use the **Run JavaScript** action as an example
    here. In the script, an `inputVariable1` internal variable is set to the value
    of the `InputValue` flow variable. It is also possible to transfer multiple variables
    into the script. The script then defines an `outputVariable` output variable and
    assigns the value of the input variable in capital letters by calling the `toUpperCase()`
    JavaScript function and writes this value to the standard output via `Wscript.Echo(outputVariable)`.
    With this, that value is subsequently available in the `JavascriptOutput` flow
    output variable.

    +   4. **Display message**: The last step in the flow just displays the result
    of the processing in JavaScript.


    I would like to add the following comments to the previous example:


    +   - The flow is just an example to show the basic functionality when working
    with **Scripting** actions. The result of this process could also be achieved
    by using built-in functions, of course.

    +   - The underlying Scripting hosts have a specific version that also defines
    which Scripting features are available. The **Windows Script Host (WScript)**
    had version number 5.812 (just output `WScript.Version` in a variable). The Python
    host allows Python 2 scripting, and the PowerShell version is 5.1.22621. Since
    we operate on a Windows machine with PAD, it is also possible to instantiate an
    ActiveX object, for example, an instance of Microsoft Word, and do everything
    possible with this kind of technology (see https://learn.microsoft.com/en-us/power-automate/desktop-flows/how-to/extract-text-word-document).

    +   - Each **Scripting** action has a switch to separate the output of the script
    from a potential script error. It is recommended to enable this switch and have
    a dedicated variable for the script error. This makes it easier to debug the script
    because the second variable directly contains the error message. For the sake
    of simplicity, we did not implement any error'
  merge: -1
  img_proc: true
- pgno: 199
  md: '+   - You probably noticed that there is also a **Run DOS command** action
    in this action group. The difference from **CMD session** is that there we can
    issue one command after the other and check the result, while with **Run DOS command**,
    we define a script with several commands and run them as one block.


    In this section, we learned that PAD offers a lot of possibilities for configuring
    a local computer. In the next section, we will look at the possibilities for handling
    folders and files.


    # # Handling files and folders on your desktop


    Working with folders and files can also be automated with PAD, for example, to
    perform copy or sort operations or to file files in specific folder structures.
    We have already learned about some of these actions in our opening example in
    this book. First, let’s take a look at the actions that have to do with folders,
    which include the following:


    +   - `If folder exists`: This starts a conditional block and checks whether a
    folder exists or not

    +   - `Get files in folder / Get subfolders in folder`: This creates a list of
    files or folders that are contained in a specific folder

    +   - `Create / delete / empty / copy / move / rename folder`: These perform the
    specific action on a given folder

    +   - `Get special folder`: This retrieves the path of a special folder in Windows
    such as **Desktop**, **Internet Cache**, and so on


    As we see here, no wishes remain unfulfilled. In combination with the following
    actions for files, these capabilities are further completed:'
  merge: -1
  img_proc: true
- pgno: 200
  md: '+   - `If file exists / Wait for file`: These can be used to check whether
    a file exists/does not exist or whether a file is created/deleted.

    +   - `Copy / Move / Delete / Rename files`: Operations for one or more files.

    +   - `Read / Write text to file / CSV file`: Has been used in the previous example
    (CMD sessions).

    +   - `Get file path`: This action produces several variables containing the root
    path, the directory, the file name with and without extension, and the extension
    itself.

    +   - `Get temporary file`: Unlike the name suggests, a temporary empty file is
    created here that can be used for further purposes.

    +   - `Convert file to Base64 or back/t4o binary or back`: File conversion might
    be necessary in some cases to transfer files over a specific protocol and back
    to make it readable again. Base64 encoding, for example, encodes binary data as
    printable text.


    Another action group worth mentioning in this context is **Compression**, which
    deals with one or more files that need to be compressed or decompressed. This
    is the same functionality that is also available when we use Windows Explorer
    and right-click any file and choose **Compress to Zip**.


    Now let’s look at an example of how these actions can be used to create a flow
    to copy daily backups of specific files to a network share. Conceptually, the
    flow should perform the following actions:'
  merge: -1
