    you could use the **Search** box and look for the term `sentiment`, which is part
    of the Cloud Natural Language API. Each of the APIs needs to be enabled separately.
    You can take a look at all enabled APIs from the burger menu at the top left of
    the screen, as can be seen in the following screenshot:'
  merge: -1
