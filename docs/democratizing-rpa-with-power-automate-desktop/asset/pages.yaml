    # Summary


    Through integration with Power Platform, PAD can close the gap between workflows
    in the cloud and the local network. We have seen that this can create a seamless
    overall concept for an automation solution, as the various components are very
    well integrated.


    Additionally, we learned about native actions for using IaaS offerings from Microsoft
    and AWS, which allow us to outsource the execution of desktop programs or add
    more resources to our flow as needed.


    In the next chapter, we’ll look at how we can incorporate artificial intelligence
    into a UI flow while learning about offerings from various vendors.


