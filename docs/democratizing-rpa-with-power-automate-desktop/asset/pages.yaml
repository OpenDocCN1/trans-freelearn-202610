    will be shown below the pinned variables.


    If a flow variable is renamed to an existing name, we need to confirm that these
    two variables should be merged. If we take our example with two message boxes
    from earlier and rename **ButtonPressed2** to **ButtonPressed**, this is what
    it looks like:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_126_0.png)


    Figure 5.6 – Merging flow variables


    Merging is only possible with flow variables


    The merge functionality is only available for flow variables and not for input/output
    variables. To change the name of an input/output variable, you can just edit it
    and change the name, but the name must be unique between all other input/output
    variables. Otherwise, an error message will be shown directly in the variable
    editor. However, a flow variable could have the same name as an input/output variable.
    Flow variables cannot be deleted explicitly. These get removed when the corresponding
    action (dependency will be set automatically) is removed from the flow. If, however,
    an action'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'reuses a variable, as in our example, the flow variable will be kept until
    the last action is removed that uses this variable (this is because of security
    reasons.).


    Flow variables also disappear if the corresponding action is disabled. Any action
    that uses this variable later in flow logic will fail.


    # Input and output variables


    We made use of input variables in our previous examples. Input and output variables
    enable us to bring in data from the outside into the flow (input variable) and
    also expose data to the outside (output variable). The latter especially makes
    sense if the flow is part of a larger construct and needs to return some values
    to another cloud flow, for example.


    We used these kinds of variables in the previous examples to define some input
    data by setting the values manually (we can set them as default values when we
    define the variable), which could be very helpful in some situations and is not
    possible with flow variables. When we need the same data in different locations
    in a flow, a variable should be used for this data.


    As an example, let’s assume we want to create a flow that does some complex folder
    operations and file movement within a specific folder. This specific folder will
    be used in multiple actions in the flow. If we want to change this base folder
    for some reason, we would need to do this in many locations. Instead, a variable
    could be introduced for storing the base file path from where all operations will
    run. Changing this variable will result in it being updated in all locations where
    it is used.


    It is very easy to create a variable. In *Figure 5.1*, there is a little + sign
    in the middle of the field for input/output variables. Clicking this gives us
    the option to choose between an input or output variable. The following dialog
    to create the variable is the same for both types:'
