- pgno: 255
  md: '# Leveraging Cloud Services and Power Platform


    In this chapter, we will cover how to integrate PAD with Power Platform and learn
    how this technology can be used to bridge the gap between the cloud world and
    a locally executed UI flow. In addition, we will look at the actions to work with
    Microsoft SharePoint from a UI Flow.


    Finally, we will work with the actions for **Amazon Web Services (AWS)** and Microsoft
    Azure to use the **Infrastructure-as-a-Service (IaaS)** offering for outsourced
    UI Flows. We will cover the following topics in this chapter:


    +   - Power Platform and related services

    +   - Managing lists, files, and folders with SharePoint

    +   - Working with IaaS offerings (Azure/AWS)


    # Technical requirements


    This chapter shows how to integrate and use a Desktop Flow with Microsoft’s Power
    Platform. This scenario requires a Work or School account, which can be used to
    create a trial version of Dynamics 365. The example in this chapter uses the Dynamics
    365 Sales module, which can be set up in just a few steps (a link for detailed
    information is contained in the *Further reading* section). Basic knowledge of
    calling and operating SaaS services is a prerequisite. Additionally, a license
    for Power Automate is required, which includes UI flows. This can also be a test
    license.


    To showcase functionality with Microsoft Azure and AWS, a trial of both environments
    is required. The providers provide free offers for the limited use of resources,
    which are completely sufficient for our purposes.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'In addition, basic knowledge of the providers and their offerings is required,
    as well as knowledge of how to create a simple standardized virtual machine.


    # Power Platform and related services


    In *Chapter 1*, we learned that Power Automate Desktop is a part of Power Platform.
    With this direct relationship comes a unique advantage that can be used in conjunction
    with the other members of the Power Platform family. In the previous examples,
    we saw that a UI flow connects to another application based on specific use cases,
    or browser automation is used to retrieve information remotely. By using Power
    Platform, this scenario of outbound connections can now be extended to an inbound
    scenario – for example, a UI Flow can be called automatically from outside and
    do its work. In this respect, PAD can close the gap between cloud and local networks
    and thus ensure an interconnected process flow.


    To gain a bit more understanding of this concept and how all this fits into the
    Microsoft ecosystem, I want to explain what all this means at a high level. The
    following figure shows the conceptual structure of the Microsoft cloud:'
  merge: -1
  img_proc: true
- pgno: 257
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_257_0.png)


    # Figure 9.1 – Power Platform environment(s) structure and elements


    If any customer wants to use a Microsoft cloud service, a customer tenant must
    be created. Here, we would find all the resources that are available in Azure
    but also the so-called environments. This term is related to Power Platform capabilities
    and can be considered a kind of container that serves a specific topic or purpose.
    There can be multiple environments in a tenant, such as for development, testing,
    and, of course, production, but also separate environments for HR workloads, internal
    service management, or any other topic.


    Within each environment, we can find the different tools that are provided by
    Power Platform such as Power Apps, Power BI, Power Automate, and so on. Also,
    the access for users can be controlled for each environment separately. The preceding
    figure shows a selection of the services that can be available in an environment.
    This also depends on the specific license and subscriptions that have been purchased
    by the company. All artifacts of the environment are stored in a Dataverse repository.
    Power Automate is'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'relevant to our topic in this chapter. Let’s take a look at what is necessary
    to connect a cloud flow to a UI flow.


    # Machine and Machine Runtime


    As we know, a UI flow is executed on a local machine, typically within the local
    network of a company. To be able to connect the Microsoft cloud and the environment
    to that local machine, Microsoft provides the **Power Automate Machine Runtime**.
    The following figure shows the relationship between the components:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_258_0.png)


    Figure 9.2 — PAD and Power Platform


    This is installed automatically on Windows Professional and Enterprise, but not
    on Windows Home Edition. **Power Automate Machine Runtime** allows you to create
    direct connectivity between the cloud environment and the local network. To use
    this component, a couple of prerequisites are required:


    +   - This type of connection is supported by Power Automate version 2.8.73.21119
    or later

    +   - The environment needs a specific solution called **MicrosoftFlowExtensionCore**
    of version 1.2.4.1 or greater'
  merge: -1
  img_proc: true
- pgno: 259
  md: '+   - A premium per-user plan with attended RPA is required, which is a special
    license that needs to be purchased

    +   - The user that needs to register a new machine must have at least the **Environment
    Maker** or **Desktop Flow Machine Owner** user role in the environment


    Installing the runtime is straightforward. The user with the appropriate privileges
    can select and register the local machine in the environment. The following screenshot
    shows a successfully registered machine:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_259_0.png)


    Figure 9.3 – Power Automate Machine runtime settings


    If a high load is expected for one machine, it is also possible to define a machine
    group and add the machine there. Presuming that there are several machines available
    for execution, execution can be distributed among them. Creating a machine group
    is very easy. It can be accomplished via the Power Automate portal or within Power
    Automate Machine Runtime. Only a name and an optional description must be assigned.
    Then, the group is'
  merge: -1
