- pgno: 180
  md: '+   - All the UI elements that we used were previously inserted into PAD via
    the recorder. [Chapter 5](Chapter 5) described how this can be achieved in detail.


    In this section, we learned how PAD bridges the gap between two different applications
    that need to exchange data with each other. By performing data extraction, we
    can read information from one application, convert it into another format, and
    insert it back into a second application by using form-filling UI actions.


    # Summary


    In this chapter, we learned how PAD allows two applications to exchange data that
    would otherwise have no connection. By defining UI elements and using UI actions,
    any application can be remotely controlled and thus integrated into a larger automation
    context. Here, PAD acts as a high-level entity that allows the application landscapes
    to communicate with each other; otherwise, no data exchange would be possible
    at all unless you were to do it manually.


    In the next chapter, we will look at other actions that can be used to manage
    and remotely control a computer, its files, and its services.


    # Further reading


    The following walkthrough, *Microsoft ‘RPA in a Day’ Training Material Update*,
    provides a full course with different modules that also leverage the sample application
    used in this chapter. The article contains a link for you to download the material.
    In the `Lab data packages` folder, there is another folder called `Prerequisites`
    that contains the installer for the Windows application: https://powerautomate.microsoft.com/en-us/blog/announcing-microsoft-rpa-in-a-day-version-2/.


    UI automation reference: https://learn.microsoft.com/en-us/power-automate/desktop-flows/actions-reference/uiautomation'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Automate Your Desktop and Workstation


    In this chapter, we will take a look at the huge number of actions that that are
    part of system management and that also have high practical relevance. Some of
    these actions that we will cover in this chapter are the following:


    +   - Actions for workstation management, including scripting

    +   - Files and folders

    +   - Computer peripherals such as the mouse and keyboard, printers, and clipboard


    We will dedicate the first part of the chapter to the action groups that make
    the management of a system possible before exploring the possibilities in the
    area of folder and file management.


    The last part deals with the automatic operation of the peripheral devices of
    a computer. We will create a PowerPoint slide deck to document the status of a
    local workstation. By the end of this chapter, we will have learned that Power
    Automate desktop (PAD) can manage all important aspects of the local computer
    and that this provides a powerful tool for folder and file management.


    # Technical requirements


    Operating system (OS) processes and Windows services are crucial components, and
    incorrect manipulation could have an impact on the stability and reliability of
    the Windows OS. That’s why administrator permissions are required to work with
    these components.


    You can find the technical requirements at the following link:

    https://learn.microsoft.com/en-us/power-automate/desktop-'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'flows/requirements.


    # # Windows and desktop management


    The mass management of workstations in small and large networks can be supported
    by numerous tools today, such as Active Directory group policies, Microsoft Intune,
    Microsoft System Center, and so on. Typical administration tasks in the administration
    area are as follows:


    +   - Installing and setting up the OS

    +   - Creating, configuring, and authorizing user access

    +   - Installing additional standard software for users, such as Office or other
    applications

    +   - Regular maintenance and health checks are performed by executing commands
    or scripts and monitoring and managing processes and Windows services


    As mentioned previously, these tasks can be partly covered by other mechanisms,
    such as Active Directory group policies, Microsoft Intune, Microsoft System Center
    functionality, or other third-party management software. Typically, however, such
    tools require greater effort to procure and administer, and the software is aimed
    at professional IT administrators in larger environments. These tools also require
    local agent software (a Windows service that is installed) that frequently contacts
    the central administration instance for new updates, which can subsequently be
    deployed.


    Looking at the capabilities of PAD in the following section, it appears to be
    a useful tool in this area. To clarify the positioning of the different approaches
    to remote management software and PAD, we can look at the following table:


    | Feature | Remote Management Software | Power Automate Desktop |

    |---|---|---|'
  merge: -1
  img_proc: true
- pgno: 183
  md: '| Feature | Remote Management Software | Power Automate Desktop |

    |---|---|---|

    | General approach | Consistently manage desktops and OSes by providing a set
    of software packages and monitoring devices and OS security | Executes desktop
    actions that cannot be performed automatically and remotely controls the operation
    of software by simulating a user |

    | Provide management of desktops | Centrally, with remote agents to be installed
    on each machine | Distributed – a desktop flow is created on one machine and can
    be shared afterward |

    | Install software packages | Automatically after central configuration | The
    creation of a flow is required for each package to be installed |

    | Ability to operate software | Not available | The creation of a flow is required
    for operating software |


    Table 7.1 – Comparison of Remote Management Software and PAD


    As we can see in the preceding table, PAD is not intended to cover centralized
    network management, although we find several action groups that could be used
    to create a flow to perform administrative tasks, some of which are not possible
    or not available with centralized network management.


    On the other hand, it is not possible with such management software to map individual
    operations of one or more software products on a desktop.


    Therefore, the following use cases arise for PAD in this environment:


    +   - There is a need for the management of workstations, but no management software
    is available

    +   - A task must be executed on a local computer that cannot be mapped by such
    management software'
  merge: -1
