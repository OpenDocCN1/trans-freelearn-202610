- pgno: 309
  md: '# Working with APIs and Services


    So far, we have used PAD to enable applications without an API to be used with
    automated processes via their **user interface (UI)**. Even though this is the
    main purpose of PAD, we can also communicate with APIs in the context of UI flows
    to wherever is the best integration option. These possibilities close the loop
    and allow us to implement a complete business process exclusively in PAD without
    adding other mechanisms. Accordingly, in this chapter, we will look at which APIs
    and protocols PAD can communicate with directly and which web-based data formats
    PAD can handle. We will highlight the following points:


    +   - Managing local **Active Directory (AD)** services and accessing local database
    and email services

    +   - Leveraging web services with **Hypertext Transfer Protocol (HTTP)** and
    **File Transfer Protocol (FTP)** and working with web formats (**Javascript object
    notation (JSON)**, **Extensible Markup Language (XML)**, and **portable document
    format (PDF)**)

    +   - Cryptography and CyberArk

    +   - Built-in data functionality – date-time, text, compression, and Messageboxes


    After studying this chapter, we will be able to use internal services such as
    databases and AD, as well as any web services within a UI flow, working with the
    various data formats. An example flow for the actions presented here will be shown
    in *Chapter 12*.


    # Technical requirements


    In the first example, I will use a locally installed SQL Server with the Microsoft
    sample database **AdventureWorks2019** installed. In addition, I have set up a
    database user on this server with access permission to this database.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# # The use and automation of local network services


    In many large and small companies, Windows-based local networks are used, providing
    additional Microsoft services. First and foremost, of course, this includes AD,
    but also Microsoft Exchange, SQL Server, and so on. These and other services are
    assigned to the Office Server product line.


    Since PAD is perfectly suited to automate administrative tasks, it is obvious
    that corresponding actions are also provided for these services. Unlike the local
    Windows services we learned about in *Chapter 7*, these are network services on
    the local network and, therefore, not in the cloud. Accordingly, the actions presented
    here are also to be used only for the on-premises installed server products. To
    automate the corresponding cloud services, Microsoft refers to the use of the
    respective connectors for the online products (Azure AD, Exchange Online, and
    so on). The fact that more and more companies are opting for cloud technologies
    is probably also due to the fact that the supported server version for Microsoft
    Exchange is somewhat older (Microsoft Exchange Server 2010-2013 Service Pack 1).
    While the actions for AD allow a limited amount of administration, the actions
    for Exchange and Database can only be used to use these services, for instance,
    retrieve messages or execute SQL commands. Let’s look at the details of the actions.


    # ## Accessing and managing local AD


    AD is based on the **lightweight directory access protocol (LDAP)**, which is
    based on a simpler subset of standards contained in the X.500 standard. Microsoft
    AD is the central system in local Windows networks to manage network objects such
    as users and groups, computers, printers, and more.


    # Background information on AD services


    Microsoft AD consists of a set of services such as **Federation Services (FS)**,
    **Certificate Services (CS)**, and also **Domain Services (DS)**. Among'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'the various AD services, the so-called DS are meant here, which can be interacted
    with via the PAD actions. These are the foundation of a Windows domain network.


    When working with AD and the corresponding PAD actions, you will typically come
    across these terms:


    +   - **Object**: This is the general term for every item that is managed within
    AD. Each different object type has specific attributes.

    +   - **User**: This object type consists of attributes such as the user’s logon
    name, first name, and last name, and represents someone logging on to a Windows
    domain with this user account.

    +   - **Group**: This consists of user accounts, other groups, or computer accounts.

    +   - **Computer**: This is information that relates to a computer within a domain.

    +   - **Organizational unit (OU)**: These are logical containers that can contain
    objects and also other OUs. Often, OUs are used to mirror the organization’s structure.
    They also allow the delegation of administrative control.


    AD is managed through management tools that come with Windows Server. The following
    screenshot shows the **Active Directory Users and Computers** console used to
    manage the objects described in the previous list.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_312_0.png)


    Figure 11.1 – AD management with Server tools


    Another important concept is the distinguished name. This name consists of the
    domain name, the location, and the object’s name. The combination of those entries
    must be unique, which is also the reason why there cannot be two user accounts
    with the exact same name. The distinguished name is a special syntax to describe
    objects in AD. In the preceding screenshot, we see a user account called **powerautomate01**
    in the Users file location. The distinguished name for this entry would be


    `CN=powerautomate01,CN=Users,DC=mlndw0rx,DC=virtual.`


    # Pro tip – viewing the distinguished name in the management console


    The management console shown previously is also able to expose the distinguished
    name for any object. To see this, you need to turn on the **Advanced Features**
    option in the console by clicking on the **View** menu and **Advanced Features**.
    This results in some more entries in the list of objects but also in additional
    tabs in the **Properties** dialog of an object. Right-click on a user account
    now and select **Properties** from the context menu. You will see an additional
    tab called **Attribute Editor**. Scroll down the list until you find the `distinguishedName`
    attribute and double-click it to see the entry.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_313_0.png)


    # String Attribute Editor


    **Attribute:** distinguishedName


    **Value:** `CN=powerautomate01,CN=Users,DC=m1nd0rX,DC=virtual`


    Buttons: Clear, OK, Cancel'
  merge: -1
