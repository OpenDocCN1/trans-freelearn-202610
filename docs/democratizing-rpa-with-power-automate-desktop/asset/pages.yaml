- pgno: 76
  md: 'Figure 3.2 – Action kebab menu options


    We have the following options:


    +   - **Edit**: This pops up the **Parameter** dialog for the specific action.
    This dialog can change depending on the action we are using. A **Launch Outlook**
    action has other settings than **Get files in folder**.

    +   - **Run from here**: If we use this command (or *Alt+F5*), the flow will start
    to execute from this action onward. All previous actions will not be executed.
    If there are other actions before, which are necessary for our selected action
    to be executed, this might lead to an error. But nevertheless, it could also be
    a handy function if the flow ran into an error previously, and you just want to
    start right there.

    +   - **Undo / Redo / Cut / Copy / Paste**: These are well-known editing functions
    from other programs, such as Office.

    +   - **Move up / Move down**: Instead of clicking and dragging an action, we
    could use these commands or use shortcuts.

    +   - **Disable action**: This is also a very useful feature when designing a
    flow. It allows you to disable an action so that it will not be executed.


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_76_0.png)'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'For example, you might want to do some housekeeping at the end of a flow and
    delete files or close a program. But, if you are still in the middle of the design,
    you could disable these actions so that you can concentrate more on the design.
    This is also helpful when debugging a flow (which we will do in the next section).
    But be careful not to disable steps that are part of loops or conditionals. These
    actions encapsulate one or more other actions with a beginning and an ending.
    The following picture shows an if conditional action and another if process action.
    The corresponding end statement for the latter condition is disabled, which leads
    to an error.


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_77_0.png)


    Figure 3.3 – Disabling an action and error message


    Delete: Instead of disabling an action, it could, of course, be deleted, which
    removes the action and all the parameter settings from the flow.


    # The parameters dialog'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'As soon as we drop an action from the **Actions** pane onto the workspace,
    a dialog pops up requesting us to provide information – the parameters dialog.
    The following screenshot shows the parameters dialog of the **Get files in folder**
    action:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_78_0.png)


    Figure 3.4 – The parameters dialog


    This dialog shows the specific parameters for the chosen action. Since almost
    every action is different, the corresponding parameters dialog will also show
    different parameters. There are indeed actions that have similar parameters, for
    example, **Copy file(s)** and **Move file(s)**, but these are more or less the
    exceptions.


    The parameters dialog lets you enter all the necessary information that the action
    needs to be executed. This information can be text or numbers, the selection of
    a drop-down menu, a toggle switch such as the one in the previous screenshot (**Include
    subfolders**), and sometimes even more complex information.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Sometimes, the parameters are also divided into the most used and advanced
    ones. These are hidden when the dialog first appears but can be revealed by expanding
    the **Advanced** area. We can also see this area in the preceding screenshot.


    # Important Note


    The parameters dialog does not show the mandatory fields required for the action
    to work. The only way to find out whether a parameter is mandatory is to leave
    it blank and save the action. Missing information will be displayed as an error
    in a message window at the bottom of the window. The UI flow will not run until
    these errors have been corrected.


    Actions can also produce or capture information that could be used in some of
    the next steps in the flow. For example, in *Figure 3.4*, the **Get files in folder**
    action creates a list of files in the given folder. To make this information available
    for subsequent actions, variables are produced to store this. In the preceding
    example, a variable called **Files** is created by the action. The following screenshot
    shows that this section of the dialog can also be expanded:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_79_0.png)


    Figure 3.5 – Expanded variables area


    When expanded, it is possible to rename the variable accordingly. Here, we renamed
    the variable to `MySpecialVariable`. There are naming conventions which we will
    discuss in the next chapter in more detail. If the data of a variable will not
    be used in the flow, it is possible to disable the creation of the variable by
    pressing the corresponding toggle switch.


    After an action has been provided with all the required information, it can be
    saved. Variables that are produced by the action will then be displayed in the
    **Flow variables** area on the right side. And now, these variables are also available
    to be used as input for another action. To use a variable as input,'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'we don’t hardcode information into the parameters input box, but instead, use
    the {x} symbol on the right. Check out Chapter 5 for more information on variables
    and to get all the details.


    Now that we know the details of the designer window, let’s take a look at the
    additional functionality provided by the global menu options.


    # Global menu options


    We already touched upon the menu bar in the previous chapter. These functions
    can be very valuable when we are editing a flow. Let’s take a look at the most
    important menu options:


    +   - **File | Save / Save As...**: Save a flow or create a copy by using the
    Save As... option and provide a new name for the flow.

    +   - **Edit | Undo / Redo**: These are well-known options that allow you to undo
    or redo any action in the designer. This is also very useful if you accidentally
    delete an action.

    +   - **Edit | Select all / Clear selection / Invert selection**: One or more
    actions in the workspace can be *selected*. If you click on one action, it becomes
    selected. Holding down the shift key and selecting another action will result
    in all the actions in between will also be selected. This group of actions can
    now be deleted, activated or deactivated, or even moved together to some other
    position in the workspace. These menu options deal with this selection.

    +   - **Edit | Go to line**: Sometimes it is nice to be able to jump to a specific
    line immediately, for example, when working with large flows and many actions
    or in case of an error because the error message also contains the line number.

    +   - **Debug | Toggle breakpoint / Remove all breakpoints**: When an action is
    selected, this menu option will place a breakpoint on that line. Another way to
    do this is by clicking directly on the left side of the line number. We will discuss
    breakpoints more in the next section.'
  merge: -1
  img_proc: true
