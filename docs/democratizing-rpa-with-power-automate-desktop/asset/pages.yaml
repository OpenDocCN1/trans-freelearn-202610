- pgno: 111
  md: '+   - **Comment:** This action is useful to bring comments into the flow and
    document the actions.

    +   - **End:** Does not work on its own, but if we accidentally delete an `End`
    action that was part of an `If` action or a loop, we could just use this action
    to complete the flow.

    +   - **Exit subflow and Run subflow:** We already used **Run subflow** in one
    of our earlier examples. **Exit subflow** can only be used in a subflow to stop
    the subflow and return to the point it was called from.

    +   - **Get last error:** Retrieves the last error that occurred in the flow and
    stores it in a variable for further processing.

    +   - **Go to and Label:** `Label` sets a marker in a flow, which is a specific
    position in the list of actions. With **Go to**, a label can be used to transfer
    the flow of execution to it. For example, it is possible to drag the **Label**
    action anywhere in the flow and give it the name `Position1`. With **Go to**,
    we now could say `jump to the label called Position1` and execute from there.

    +   - **On block error:** Allows us to encapsulate a set of actions in a block
    and capture errors in execution eventually. We will discuss this in the next section.

    +   - **Stop flow:** Stops the flow immediately when this action executes. It
    is possible to configure whether the flow has ended successfully or with an error
    message. If the latter, it is also possible to define the error message.

    +   - **Wait:** This action pauses the flow for a specific amount of seconds.
    This can be especially helpful if the flow needs to wait for a program to start
    or for a screen to refresh.


    Let’s use our guessing game from previously to make an alternative implementation
    without a loop statement but leveraging our additional flow control elements.
    The flow works exactly the same way and looks like this:'
