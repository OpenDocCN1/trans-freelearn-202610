    |  | AWS | Azure |

    |---|---|---|

    | Name of the offering | Elastic Compute Cloud (EC2) | Azure Virtual Machines
    |

    | PAD actions group | AWS and subgroups | Azure and subgroups |

    | Connection via | Create EC2 session and end EC2 session | Create session and
    End session |

    | VM capabilities |  |  |

    | Start/Stop/Reboot | Start EC2 instance, Stop EC2 instance, Reboot EC2 instance
    | Start virtual machine, Stop virtual machine, Shutdown virtual machine, Restart
