  md: 'list of processes and use it afterward in our flow. And, of course, it is still
    possible to use a variable in these parameters.


    # # Command-line sessions and scripting


    In this section, we will look at the possibilities of using PAD to execute your
    own commands via the Windows command line (CMD) and scripting statements, intercepting
    the results and processing them further. To do this, we will look at the following
    action groups:


    +   - **CMD session**: This performs the following actions: **Open CMD session**/**Close
    CMD session** as well as **Read from CMD session**/**Write to CMD session**/**Wait
    for text on a CMD session**

    +   - **Scripting**: Run a DOS command/VBScript/JavaScript/PowerShell Script/Python
    script


    Every OS has a command line (sometimes also referred to as a **console**), and
    sometimes that is the only form of access to the system. Therefore, the possibilities
    are very extensive, and any action that would otherwise be done with a UI can
    be performed and much more. The Windows CMD is the standard tool for issuing commands
    at this point. The command line can, of course, also be started manually via the
    Windows program menu, the Windows key + R shortcut, and the cmd command. The following
    flow uses all actions that we find in the **CMD session** actions group:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_194_0.png)'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Figure 7.6 – Using the command-line actions in PAD


    This flow has the following steps:


    +   1. **Open CMD session**: This is always the first action when working with
    the CMD because this action creates the `CmdSession` variable, which is used by
    the subsequent actions to issue the command. It is also possible to set a specific
    working folder for the session in the parameters.

    +   2. **Write to CMD session**: Here, the command specified in the corresponding
    parameter is passed to the command line and executed. In our example, we use the
    `net start` command, which returns a list of all started services on the workstation.

    +   3. **Wait for text on CMD session**: If a command takes some time to execute,
    this action pauses the further execution of the flow and waits for specific text
    to appear on the command line. In our example, the command returns the `The command
    completed successfully` text, which we use here. Other commands may return other
    results or even nothing. Please note that this action blocks the flow until the
    given text is returned. It may be necessary to also set the timeout for this action
    and handle the error.

    +   4. **Read from CMD session**: This action takes the output of the command
    and stores it in a `CmdOutput` variable. Apart from the regular return value,
    there is also an error output for which a variable is also created and can be
    processed further.

    +   5. **Write text to file**: This action does not belong to the **CMD session**
    action group but to the **File** action group, which is discussed later in this
    chapter. The action takes a variable and writes the content to a text file which
    can be defined in the parameters. We are creating a file saved on the desktop
    of the user workstation.

    +   6. **Close CMD session**: The previously opened session is closed.


    We have created a text file containing all the started services in this flow,
    and we could do some more investigation or send this now via email to a central
    maintenance mailbox for further processing.'
  merge: -1
  img_proc: true
- pgno: 196
  md: "Another way of executing a specific set of commands is by using the **scripting**\
    \ functionality in PAD. The **Scripting** action group provides five scripting\
    \ engines that work as illustrated in the following diagram:\n\n![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_196_0.png)\n\
    \nFigure 7.7 – The basic function of a Run Script action\n\nLet’s take a closer\
    \ look at the concept depicted in the preceding diagram:\n\n+   1. The first thing\
    \ to notice is that there is a **Run Script** action mentioned, and this allows\
    \ us to use all of the representative engines available in PAD, which include\
    \ DOS command, VBScript, JavaScript, PowerShell Script, and Python Script. Scripting\
    \ can be very useful for smaller blocks of code for certain functionalities that\
    \ would otherwise be very cumbersome or not available at all. The different scripting\
    \ engines each have their own strengths and give us the option to select the scripting\
    \ language we already know. It is also conceivable that certain functionalities\
    \ have already been implemented elsewhere with a scripting language so that this\
    \ implementation can be used again here.\n+   \n+   2. Now, to integrate a script\
    \ into a PAD flow, we need to pass data and values to the script and play the\
    \ result back. We can do this very easily using the % notation we already learned\
    \ about in the chapter on variables."
  merge: -1
  img_proc: true
- pgno: 197
