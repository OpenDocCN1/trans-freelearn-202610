    predictable and even if the result would make sense in some cases, it is recommended
    to use variables of the same type to avoid inconsistencies or unexpected behavior.


    # Else If action


    Sometimes one conditional action is not enough to branch to the right path of
    actions that need to be executed. With the regular Else statement, the actions
    in that section are always executed as the only one alternative branch because
    the condition is not evaluated again.


    With Else If, it is also possible to define another conditional in the Else part,
    which can also be totally independent of the first conditional. To do this, simply
    drag the Else If action between the beginning If block and the Else block, which
    must always be the last block in this construct. The following example should
    illustrate the use of conditionals. The idea is the following:


