  md: '# Does not contain, Is empty / Isn’t empty, as well as Starts with / Doesn’t
    start with / Ends with / Doesn’t end with.


    The result of the comparison is largely dependent on the content of the variables.
    I want to encourage you to rebuild the simple flow in this example and try different
