    Figure 6.11 – The Recognize entities in text configuration


    +   3. Extract data for the generated invoice ID and store it in the last element
    of the data row. Here, we make use of the Extract data from window action to capture
    the generated invoice ID.

    +   4. Step 18 updates the orders data table with the extracted invoice ID.

    +   5. In step 20, we click the Save button.


    At this stage, we have established the communication between the two applications
    and inserted new orders as invoices into the Contoso Invoicing app. In addition,
    we now know all the invoice IDs for each order so that we can update the MS Access
    database itself for reference. Let’s see what we need to do here.


    # The WriteBackInvoiceIDs subflow


    Finally, we want to update the MS Access database so that users can see that invoices
    have been created. Now, this could be facilitated in many ways. Unfortunately,
    the database itself does not provide us with an easy way to mark an order to be
    invoiced. That’s why we can just choose an easy'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'way to pass this information back into the database by updating the Notes field
    in each order. We will do that by dynamically creating a SQL statement that contains
    the order ID, as well as the invoice ID (both are in our data table). This statement
    could be like this, for example:


    ```

    UPDATE Orders SET Notes = "Invoice ID: 1159" WHERE [Order ID] = 59

    ```


    The flow that does this for us is displayed in the following figure:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_176_0.png)


    Figure 6.12 – Navigating to the SQL pane


    To be able to paste the query text into MS Access, we need PAD to navigate to
    a place where we can work with queries. You can do this by clicking the Create
    ribbon, then the Query Design button. After that, we need to switch'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'to the SQL view to be able to enter the query there. This is what the flow
    does in *steps 3 to 6*.


    Please notice that we are running through this routine for every record in the
    orders data table. In *step 8*, we create the updated SQL statement and again
    use the form-filling UI action called **Populate text field in window**.


    There is a **Run** button in MS Access that can be used to execute the query.
