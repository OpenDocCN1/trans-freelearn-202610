    # Loop statements


    Another valuable concept in programming languages is to iterate through a list
    or run through a specific set of statements and actions a defined number of times.
    This can also be achieved in PAD by using loop actions. These are located in the
    **Loops** action group.


    # ## The Loop action


    Let’s start with the Loop action and create a dice simulator for the *Ludo* board
    game. In this board game, players have to circumnavigate the board using pieces
    of a color chosen before the start of the game. The dice is rolled three times.
    If the result is a 6, the player can move a piece. If not, they need to try again.
    Here is the flow to simulate this situation:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_105_0.png)'
