- pgno: 82
  md: 'If the flow is stopped, all execution results of the actions before that breakpoint
    will be preserved. As seen in Figure 3.6, the breakpoint is after the **Launch
    Outlook** action. If we stop the flow execution now, Outlook would still be open.
    This behavior is also helpful when following a phased approach for flow design
    (see the next section). Breakpoints can also be very useful in controlling the
    values of the variables. We will make use of breakpoints in the next section.


    Another option to pause a flow is to use the *pause* button, which becomes visible
    when the flow is running. In fact, the *play* button changes to a *pause* button,
    as you can see in the following screenshot:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_82_0.png)


    Figure 3.7 – The pause button


    This also allows you to pause the flow anywhere without using a breakpoint.


    # Working with subflows


    Within each flow, we can also create subflows. This is a concept to structure
    a larger UI flow into different pieces, which in turn can then be called and referenced
    in the main flow:'
