    # Using local exchange and other email services


    We have already learned in *Chapter 2* and *Chapter 8* how to work with a locally
    installed Outlook application and the corresponding PAD actions to receive, process,
    and send emails. In addition to this possibility, PAD provides other action groups
    to work with emails. These behave very similarly to what we have already learned
    about before, except for the connection setup. These action groups are **Exchange
    Server** and **Email**. To provide an overview and to see the difference between
    those action groups, including the one for **Outlook**, let’s look at the following
    table.


    | Feature/Action group | Outlook | Exchange Server | Email |

    |---|---|---|---|

    | Connection through | Local Outlook client | Local/on-premises Exchange Server
    deployment | Any **Internet Message Access Protocol (IMAP)** mailbox |'
  merge: -1
