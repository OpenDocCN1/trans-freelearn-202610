    Conditionals can be very helpful when designing flows. The simplicity of creating
    a UI flow with PAD allows you to jump right in and design. In a more complex scenario,
    however, it is also very useful to step back and draw the logic in a flow chart.
    Multiple nested conditionals with `Else if` can especially be very hard to maintain
    later, so it is always a good idea to simplify the logic as much as possible.


