- pgno: 304
  md: 'Figure 10.10 – The result of entity analysis


    Here, I expanded the `entities` branch by clicking on the **More** link in the
    dialog. We can see that the person’s name was recognized, even with a link to
    Wikipedia, and also other entities in the text.


    All these functions may not be particularly helpful on their own at first. However,
    when viewed in a larger context, important and helpful insights and automatisms
    can be gained through these functionalities. For example, by extracting this information
    and intelligently connecting it afterward, summaries of longer texts can also
    be created. This inevitably also leads companies to create very large language
    models that can analyze and understand texts and also provide intelligent answers.
    This can be seen, among other things, in the increasing popularity of models such
    as ChatGPT.


    # Working with IBM cognitive


    Maybe some of you remember the headlines from 1997, which talked about a computer
    program called Deep Blue, which won the world championship against Garry Kasparov,
    the reigning world chess champion, in only 19 moves. The program ran on a supercomputer
    built by IBM. The victory against the world chess champion was a milestone in
    the history of AI. Today, IBM offers its AI-based solutions under the name Watson.
    As mentioned earlier in the chapter, the functionalities of the individual providers
    overlap. IBM provides the following functionalities:


    +   - **Visual recognition**: This action group contains a **Classify image**
    action, which allows us to provide an image

    +   - **Language translator**: This allows us to identify the language and translate
    a given text

    +   - **Document conversion**: This converts a given document into another format'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'The **Tone analyzer** action group contains an **Analyze tone** action, which
    is deprecated by now and will not be considered further here. If there are already
    investments in IBM Cloud with AI, these offers can also be used in the actions
    available in PAD.


    As with the other providers, an account for IBM Cloud is also required here, via
    which a corresponding API key can then be generated. This information must also
    be specified for the PAD actions to execute the request. Otherwise, the basic
    functionality is exactly the same as with the providers shown so far.


    Now that we have learned about the functionalities of the different providers,
    let’s take a look at the context in which the use of these capabilities makes
    sense.


    # Practical relevance to PAD


    The actions provided under PAD are not unique to PAD, other than launching a local
    application and controlling it. All APIs called by these actions are available
    in the cloud and, therefore, available to any application.


    The reason we see these actions in PAD as well is that it gives us direct access
    within the context of UI flows without the need to add more cloud flows or other
    technologies. This allows us to build some intelligence into our UI flows. In
    selected scenarios, these actions can certainly make sense, but typically, this
    functionality will be used primarily in cloud scenarios. However, in cases where
    the content of an image is to be determined within PAD or the mood in an email
    is to be determined, the availability of these actions is, of course, very helpful.
    The availability of these actions can be helpful, all of which rely on pre-built
    and trained AI models. Another way of using AI that is more adapted to a business
    is described in the following section.


    # More ways to use AI'
  merge: -1
  img_proc: true
