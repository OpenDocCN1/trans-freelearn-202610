- pgno: 158
  md: '# Actions for UI Automation


    In the previous chapter, we learned about UI elements and how they can identify
    areas an application interacts with. In this chapter, we will highlight the possibilities
    of PAD that can be accomplished with actions for UI elements. This includes covering
    the following:


    +   - Exploring the different UI actions and their purpose

    +   - Using UI actions to enable data exchange (extract data and form filling)
    and automation between two applications


    By the end of this chapter, you will understand what is required to identify the
    necessary buttons and UI elements and trigger them with UI actions to safely and
    reliably repeat the desired tasks and configure them in a flow.


    # Why do we need UI actions?


    Over time, countless applications for Windows were created, of which a great many
    still exist to this day. Microsoft itself has created excellent options for tailoring
    your applications with tools such as Visual Basic and Visual Studio. However,
    many of these applications are still not accessible via an API and have to be
    operated manually – also known as the human interface.


    As we will see later in this book, PAD can work directly with numerous and widely
    used standard applications such as Office and Outlook, but it would be impossible
    to cover the wealth of different applications with dedicated actions. And that
    is the reason why the actions for UI elements exist. The term **UI automation**
    refers to the general capability of PAD to work with any application window and
    therefore remote control any application and control element.


    To enforce this very general approach, the actions in this action group are correspondingly
    general and can be divided into the following parts:'
  merge: -1
  img_proc: true
- pgno: 159
  md: '+   - Identify a window

    +   - Interact with application controls

    +   - Extract data from a window

    +   - Fill in data in a window


    Let’s take a closer look at each of these actions before we dive into another
    example to leverage these actions.


    # Identify a window


    The first thing we need to do is get the window of the application we want to
    control. We already know that there are several ways to start a program, such
    as by utilizing the *run application* action or using a dedicated action for a
    program such as Excel or Outlook. The following actions identify a window or make
    it accessible for PAD, especially in combination with other windows:


    +   - **Get window/focus window**: This can be found in the **Windows** subgroup.
    You can get or focus a running window and return a title and/or Window handle.

    +   - **Set window state/set window visibility**: This can be found in the **Windows**
    subgroup. You can set the state of a window to **restored**, **maximized**, or
    **minimized**, which hides a window or makes it visible again, respectively.

    +   - **Move/resize/close window**: Also in the **Windows** subgroup, this action
    can move a window to a specific position of the desktop by providing *X* and *Y*
    coordinates, can change the size of a window to a specific width and height, or
    just close a window.

    +   - **If window/wait for window/wait for window content**: This action executes
    actions in a conditional block, depending on whether a window is open/focused
    or not, waits until a window is opened/closed/becomes the focus/loses focus, and
    waits for a specific UI element that should be contained in a window.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'These actions are especially helpful in situations where an application might
    have some latency when opening or during the operation. If PAD were to access
    a UI element that hasn’t been displayed yet, these actions could be used to wait
    for the element to appear.


    # Interact with a window


    PAD also needs to be able to remote control an application. This means clicking
    on a button or area or dragging and dropping an element. This is possible with
    the following actions, which are self-explanatory:


    +   - Select a tab in a window

    +   - Hover the mouse over a UI element in a window

    +   - Click on a UI element in a window

    +   - Drag and drop a UI element in a window

    +   - Expand/collapse a tree node in a window


    These actions work with UI elements that have been previously defined; for example,
    with the recorder. In the example for this chapter, we will make use of some of
    these actions to remote control the application.


    # Extract data from a window


    We used some of these actions in one of our previous examples where we extracted
    the values of checkboxes in a Word document. There are more possibilities when
    it comes to extracting data from an application:


    +   - **Get the details of window**: This action produces a variable containing
    properties of a window such as its title or source text. The desired property
    can be chosen in the actions dialog.

    +   - **Get the details of a UI element in a window**: This action is the same
    as the previous one, except it’s for a specific UI element and different'
  merge: -1
  img_proc: true
