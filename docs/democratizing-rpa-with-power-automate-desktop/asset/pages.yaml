- pgno: 246
  md: 'So far in this chapter, we have talked about business applications that are
    installed locally on a computer. Although there are many of these applications
    today, developing business applications for browsers has also become more popular
    and widespread. Of course, this also is related to the fact that many software
    products are developed and provided as **Software-as-a-Service (SaaS)** by major
    manufacturers. These include, for example, ServiceNow, Salesforce, SAP, Microsoft,
    and many more. As a rule, these software products also have an **application programming
    interface (API)** through which all functions and data are available. In the Microsoft
    ecosystem, we have Power Automate as part of Power Platform, where a constantly
    growing number of connectors can be used, for example, to establish a data connection
    to the aforementioned systems and to work with them.


    But sometimes, the possibilities of API usage are not available and data must
    be entered via the interface. This is where PAD can help. For this use case, a
    pattern can be derived that applies to all browser-based business applications:


    +   - There are no default actions for the applications in PAD; instead, the actions
    from the **Browser automation** action group can be used

    +   - UI elements must be created for the flow to be mapped and to work with the
    interface

    +   - For interaction (entering data, reading information, and so on) with the
    applications, the actions in the **Web data extraction** and **Web form filling**
    action subgroups can be used


    Before we dive into an example, let’s look at the different actions that we can
    use for browser automation.


    Browser automation action group:


    +   - **Launch new browser/close web browser**: PAD offers standard actions to
    open a new instance or connect to a running instance of Internet Explorer, Firefox,
    Chrome, or Microsoft Edge. These actions also allow you to clear the browser cache,
    clear cookies, and wait for a'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'given web page to load with a given timeout. A variable called `Browser` is
    created to be referenced from other actions. The **Close web browser** action
    contains no surprises.


    +   - **Create a new tab/go to web page**: This action expects a running browser
    instance that it can use to create the new tab with a specific URL or use to navigate.
    The **Go to web page** action can also use browser navigation for **Back** or
    **Forward** or even for **Reload**.

    +   - **Click a link/download link**: The former action is probably one of the
    most used in these kinds of scenarios. To use it, a UI element must be selected.
    Then, there are different click types to choose from (a simple left click but
    also a right click, middle click, double-click, and separate types for left/right
    and down/up). To download a file to a specific folder, the latter action can be
    used.

    +   - **Run JavaScript function on web page**: This action allows you to execute
    a self-written JavaScript function to be executed on the web page. Any JavaScript
    function can be injected here. One example could be to use this to scroll down
    on a web page to fill in or extract more data.

    +   - **Hover mouse over element**: Sometimes, valuable information is already
    displayed when the mouse hovers over a certain element – that is exactly what
    this action is built for. A UI element has to be provided for this action to work.

    +   - **Wait for web page content/If web page contains**: These two conditional
    actions also work with UI elements. To make sure that a certain element exists
    on a web page – for example, after a button was pressed and some processing has
    been triggered – these elements can be used to interrupt the flow’s execution
    until a certain element appears (or disappears) on the web page. The second action
    can also check if a given piece of text is contained/not contained on the web
    page.


    In addition to these general actions, there is also a subgroup for **Web form
    filling** and **Web data extraction**. To transfer data from PAD to the web application,
    we have actions to focus and populate a text field, set a check box, radio button,
    or a drop-down list value, and to press a button on a web'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'page. These are all located in the **Web form filling** subgroup and also work
    with UI elements.


    The **Web data extraction** subgroup contains actions to get more details about
    the web page itself or an element, as well as a generic **Extract data from web
    page** action that needs a bit more explanation. If we just drag this action into
    the flow designer, we won’t be able to define any additional meaningful parameter.
    Instead, this action should be used in conjunction with the PAD recorder. We learned
    about it in *Chapter 2*, where we saw an example of how to capture a list of data
    from a web page.


    This action is pretty sophisticated and allows us to extract single values, lists,
    rows, or even complete tables, depending on the structure of the web page we want
    to extract data from. We can describe a general procedure for extracting web data
    as follows:


    +   1. Determine the URL of the web page to work on.

    +   2. Start the PAD recorder and walk through the actions that should be performed.
    The recorder will also create corresponding UI elements that must be executed
    later.

    +   3. Use the context menu for the web elements to insert data or capture data.
    A single click would just select the web element and capture this action, but
    by right-clicking on an element, there are more options, especially for data extraction.

    +   4. Observe the list of recorded actions. The click sequence does not have
    to be perfect and if you accidentally clicked on an unwanted element, just delete
    it in the recorder.

    +   5. Once you’re finished, review the generated UI elements and give them meaningful
    names. It is much easier to identify the elements afterward in the corresponding
    actions.

    +   6. Test your flow and modify the selectors. During the recording, the web
    elements are captured, but sometimes, they will need further tweaking. This can
    be done from out of the designer by editing the selector.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'Now, it is time for a little example of how to use browser automation. For
    this, we are going to insert a new quote into Dynamics 365 Sales, one of the CRM
    modules of Dynamics 365. In this scenario, we want to use the Dynamics 365 Sales
    module to create a quote, read the generated quote number, and store it in a variable
    for further processing.


    Like any other web-based business solution, Dynamics 365 has a few features to
    consider:


    > > A general setup and login are required for a user to work with the application.
    If you just started the trial, everything will be set up for you in the background.
    In the following example, the user who is logged on to the workstation is also
    logged on to the underlying Azure Active Directory instance, as well as Dynamics
    365. This means that the browser window will not ask for a login separately. A
    login to the system may need to be considered independently — for example, via
    stored credentials.


    Optional: Do the authentication upfront before starting the PAD. This will ensure
    your automations work smoothly.


    > > A specific URL is used to access the system and that URL needs to be provided
    for the **Launch new Browser** action. For Dynamics 365, it is even possible to
    use dedicated URLs for specific business actions such as **create account** or
    **edit contact**. In this example, we will use the URL for creating a new quote
    directly.


    With these prerequisites in place, the PAD flow shown in the following figure
    can be recorded right away. Here, we need to do the following:


    +   1. Create a new flow and give it a meaningful name (for example, `Dynamics
    365 Quote Creation`).

    +   2. Once the designer shows up, press the recording button in the top button
    menu.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '+   3. Perform the steps that are needed for the quote to be created. In our
    case, we need to enter a quote name, select a price list and a customer, save
    the record, and extract the generated quote identifier.

    +   4. Beautify the generated UI elements and variables to make this a little
    bit more readable.


    In the following figure, we can see the flow that could be generated out of this
