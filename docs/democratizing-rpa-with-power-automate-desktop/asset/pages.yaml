- pgno: 334
  md: '# # Summary


    This chapter has shown that PAD can integrate and automate applications that do
    not have an API. The ability to address systems with interfaces makes PAD a complete
    and self-sufficient tool for automation since, typically, in automation scenarios,
    both legacy applications and modern applications with interfaces have to be integrated.
    The actions presented in this chapter allow PAD to perform all tasks that would
    otherwise be covered by a cloud flow, such as including a web service, transmitting
    and receiving data, and further processing in a UI flow. This makes PAD quite
    suitable as the sole tool for small to medium integration and automation tasks.
    However, this can also become complex in some circumstances, as it is not possible
    to use a dedicated connector for a web application, for example, which can hide
    a lot of complexity. Furthermore, there are hardly any possibilities for scaling
    on a local machine with PAD.


    We’ll take a closer look at how we can meet these challenges in the next chapter
    and also see an example of how the actions presented here come into play.


    # # Further reading


    +   - Power Automate Desktop AD actions reference: [https://learn.microsoft.com/en-us/power-automate/desktop-flows/actions-reference](https://learn.microsoft.com/en-us/power-automate/desktop-flows/actions-reference)

    +   - AD: [https://en.wikipedia.org/wiki/Active_Directory](https://en.wikipedia.org/wiki/Active_Directory)

    +   - PAD custom objects and JSON: [https://learn.microsoft.com/en-us/previous-versions/troubleshoot/winautomation/product-documentation/best-practices/variables/custom-objects](https://learn.microsoft.com/en-us/previous-versions/troubleshoot/winautomation/product-documentation/best-practices/variables/custom-objects)

    +   - XPath Syntax: [https://www.w3schools.com/xml/xpath_syntax.asp](https://www.w3schools.com/xml/xpath_syntax.asp)

    +   - Text action reference: [https://learn.microsoft.com/en-gb/power-automate/desktop-flows/actions-reference/text](https://learn.microsoft.com/en-gb/power-automate/desktop-flows/actions-reference/text)'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# PAD Enterprise Best Practices


    The previous chapters have focused on the detailed functionality of PAD as such.
    We have seen numerous **user interface (UI)** flow examples that have been executed
    interactively. However, deployment in large enterprises typically looks somewhat
    different. Here, UI flows are usually part of a larger concept in which issues
    such as security and scaling play an important role. This chapter focuses on these
    aspects:


    +   - Typical requirements in enterprises, including development aspects, installation,
    scalability, security, governance, and compliance, and how to address them with
    PAD

    +   - Microsoft best practices for hyperautomation and the Automation Kit

    +   - Representation of an enterprise automation scenario with PAD'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# # Chapter prerequisites


    In this chapter, we will learn about the functionality of PAD, most of which is
    only available with the Premium RPA features. This requires a corresponding license,
    also described in more detail in the *Compliance* section. Microsoft offers a
    30-day trial period for these features, which is suitable for trying out these
    functionalities.


    Furthermore, several local or virtual Windows machines are typically used in such
    scenarios, for example, to test load balancing. For more information, see the
    *Installation and deployment* section.


    # # Typical requirements in enterprises


    So far, we have focused on the functionalities of PAD and looked at individual
    UI flows that should perform a specific task. This allowed us to look at the automation
    options for a certain business process and implement them with UI flows. However,
    in an enterprise context, many organizations today generally have additional challenges,
    which we will closely examine.


    # # Hyperautomation


    Automating business processes typically requires taking both legacy and new technology
    into account. Application landscapes at companies are often very diverse starting
    from cloud and on-premises systems, applications with and without APIs, existing
    workstations and mobile applications, applications used for mass data processing,
    and so on. This may also require a whole set of tools to connect and automate
    all these applications, and in most cases, various tools are already in use. Establishing
    a unified approach here typically requires the use of technologies that can handle
    APIs, UIs (RPA), and AI. This triad has given rise to the term **hyperautomation**,
    as with this toolbox, compare can be enabled to meet any automation need and thus
    become more efficient and productive.'
  merge: -1
  img_proc: true
- pgno: 337
  md: "# # Development aspects\n\nAs we already know, PAD UI flows are developed using\
    \ the corresponding Windows application. We also already know that the application\
    \ is always connected to a Power Platform environment. This is where the UI flows\
    \ are physically stored. Access to the environment is controlled via the user.\
    \ It is important to think about an environment strategy that is used in connection\
    \ with Power Automate Desktop and also all other Power Platform components. In\
    \ addition to this, the following aspects should be considered:\n\n+   - **Use\
    \ a common data model:** Use a common data model to ensure consistency and accuracy\
    \ of data across all workflows. Perhaps a larger portion of the data model could\
    \ be mapped directly into Dataverse, as this repository brings many features that\
    \ an enterprise-wide data model requires. However, PAD also integrates and automates\
    \ applications that cannot be inserted here. Therefore, it is necessary to design\
    \ a conceptual overall data model with all integrated applications in the business\
    \ process.\n+   \n+   - **Use a centralized container:** To package all artifacts\
    \ that are required for an automation project, it is recommended to use a centralized\
    \ repository to store and manage workflows, data, and other resources. These repositories\
    \ are called **solutions** in the world of Power Platform. A desktop flow is solution-aware,\
    \ meaning it can be contained in a solution. The solution can then be exported\
    \ and imported into another environment by using application life cycle methods.\n\
    +   \n+   - **Leverage application life cycle management (ALM), including a version\
    \ control system as well as test and validation processes:** Typically, there\
    \ are different stages where applications and solutions are developed and operated,\
    \ such as *development*, *test*, and *production*. ALM technology allows transporting\
    \ such solutions from one stage to another in an automated way. Use a version\
    \ control system to manage changes to workflows and other resources. This area\
    \ also includes the usage of a version control repository such as Git and test\
    \ processes to ensure that the solution also works in subsequent stages. Read\
    \ more"
  merge: -1
  img_proc: true
- pgno: 338
  md: 'about these topics at https://learn.microsoft.com/en-us/power-platform/alm/.


    The following diagram illustrates best practices regarding development approaches:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_338_0.png)


    Figure 12.1 – Enterprise development approach with PAD


    In the special case of PAD, we also need to consider that UI flows are running
    on a physical or virtual desktop. These machines need PAD installed locally and
    can run in the company’s local network or virtually in Azure or other any other
    cloud provider offering virtual machines (VMs). That’s why it is also important
    to cover this part of the solution and make sure that VMs for development, production,
    and all other stages are maintained. We take a look at the options we have here
    in the next section.


    However, with all this to consider, let’s also not forget that the concepts introduced
    in this book, such as child flows, exception handling, and more, help to create
    meaningful and robust UI flows.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# # Installation and deployment


    The PAD application is a prerequisite and must be installed on the physical machine
    or VM used to execute large automation scenarios. Let’s not forget that we will
    eventually need to install a legacy application on that machine. Since the manual
    option does not scale very well, there are also other options:


    +   - Use systems management software such as Microsoft **System Center Configuration
    Manager (SCCM)** or Microsoft Intune to deploy and configure local machines

    +   - Use VMs in Azure or any other cloud provider to provide virtual environments
    for PAD and corresponding management tools


    Microsoft offers to use its **Desktop-as-a-Service (DaaS)** functionality called
    **Azure Virtual Desktop** to manage VMs for PAD directly within Power Platform.
    A starter kit has been created, containing different flows and an additional app
    to configure the setup (see the following screenshot):


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_339_0.png)'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'Figure 12.2 – The Starter Kit Configuration App


    This option requires some setting parameters to provision appropriate machines
    in the background. However, this also allows adding (scale-up) or removing (scale-down)
    additional machines very easily, which can be very helpful in load peak periods.
    More on this in the next section.


    # The Starter Kit is not an official Microsoft product


    It should be mentioned that the Starter Kit is not an official module in the Power
    Platform and should be understood as a sample implementation to achieve automatic
    provisioning and scaling with Microsoft technologies. All implementation artifacts
    are published on GitHub. Microsoft does not offer any support if there is an issue
    with this product, as it is not officially supported. Instead, customers are encouraged
    to contribute to the GitHub project and raise their issues there.


    Another aspect of deployment is the deployment of the UI flows itself. When a
    user creates and saves a UI flow, this is stored in the Dataverse repository for
    the given environment. By default, however, other users cannot view or use this
    flow.


    There are multiple ways to provide access to a UI flow to another user. The following
    diagram shows these options:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_340_0.png)


    Figure 12.3 – Ways to share a flow'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'Please note that options 1 and 2 create a copy of the original flow. Let’s
    look at the details.


    # Using a text file


    The first option is to copy the flow and its actions to a text file and share
    this with a user. To do this, you need to take the following steps:


    +   1. Open a UI flow.

    +   2. Select all actions by pressing Ctrl + A.

    +   3. Copy the actions to the clipboard by pressing Ctrl + C.

    +   4. Open a new text document (for example, with Notepad).

    +   5. Paste the content of the clipboard to the text file.

    +   6. Save the text file.


    We can now share this text file with another user who can open it, copy the content,
    and paste it into a blank UI flow designer window.


    # Using a solution


    As mentioned before, solutions are containers that can contain various Power Platform
    artifacts and thus can be considered a complete business solution package. They
    represent a very important concept in Power Platform and are used to transport
    artifacts such as apps, flows, and so on from one environment to the next using
    ALM techniques. To create a solution, go to the Solution menu item in the Power
    Automate portal and click the + New solution button in the menu bar, as shown
    in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 342
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_342_0.png)


    Figure 12.4 – Create a solution in Power Automate


    A dialog will appear on the right-hand side, where you must enter the solution’s
    data. The general solution concept is explained very well in the Microsoft documentation,
    including the publisher, versioning, and so on. For this example, the default
    publisher can be selected so that the solution is created. New solution components
    can then be created, or existing ones added to the solution. We can now use the
    **Add existing** button to select a desktop flow and add it to the solution (see
    the following screenshot):


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_342_1.png)


    Figure 12.5 – Add existing Desktop flow to a solution'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'You will be presented with a list of desktop flows that reside in this environment
    and you can add them to this solution. Afterward, there is an **Export solution**
    button, which creates a downloadable ZIP archive that can be shared with other
    users and other environments. Just like the previous solution, importing this
    solution creates a copy of the UI flow. Changes to the original flow are not applied
    to this copy; you will need to export/import solutions as well to update the copy
    of the flow in the second environment with the changes applied to the first one.


    # Managing and sharing a UI flow in Power Platform


    The easiest way to make a UI flow (and indeed any other artifact) available to
    another user is to use the **Share** feature in the **Power Automate** portal.
    The following screenshot shows where to find this function:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_343_0.png)


    Figure 12.6 – Share feature in the Power Automate portal'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'In the left navigation panel, go to **My flows**, and afterward, switch to
    the **Desktop flows** tab. You will see a list of all Desktop flows in this environment.
    By selecting one flow, you can press the *Share* icon in the corresponding row
    or the **Share** button in the top button bar to launch the sharing dialog. This
    dialog lets you choose another user to share the flow with. You can also specify
    whether the user is just able to see and execute the flow (user) or will also
    be allowed to change it (co-owner). If there are flows that have been shared with
    you, these will appear under the **Shared with me** tab. Please notice that we
    are not creating a copy here. This is especially important if you grant co-owner
    access to another user. If you want to create a copy, you could use the **Save
    as** button in the top button bar.


    Another option would be to assign a flow to another user. This would hand over
    the ownership to that user. To accomplish this, we need to edit the corresponding
    flow in Dataverse in the environment where this UI flow is stored. For simplicity,
    we can think of Dataverse as a relational database with various business process
    tables. UI flows are stored in a table called `Process`. The documentation (refer
    to *Manage Desktop flows* in the *Further reading* section) describes well which
    steps have to be taken for this. Reassigning a UI flow to another owner can be
    useful if the creator of the flow should not be the executing user, for example,
    because this user needs special permissions or already owns and should execute
    other flows.


    Please note that it is also possible to execute administration operations on UI
    flows using web APIs. Just like any other artifact in Dataverse, it is possible
    to list available desktop flows, get schema information and status, get flow output,
    and, of course, trigger flows or cancel UI flow runs. This means that UI flows
    can be called not only via the corresponding connector in Power Automate but in
    principle, also by any program or script. It offers a whole range of new possibilities
    regarding integration and could lead to a situation where a whole series of UI
    flows is to be executed in parallel or at a high frequency. That’s why we discuss
    how to create a scalable PAD environment in the following section.


    # Scalability'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'For an enterprise-ready deployment, the scalability of the processing platform
    is an important criterion. This means that it must be possible to distribute any
    peak loads to several working nodes and, if necessary, implement a queuing concept
    to ensure that requests are processed in an orderly and reliable manner. This
    can be achieved by one or a few individual machines or by load-balance management
    with corresponding machine management, which we will now take a closer look at.
    For both scenarios, we assume that the machines are registered within Power Platform
    so they can be included in a cloud flow and that the legacy applications are installed
    on the corresponding machines. Please refer to Chapter 9 for more details.


    # A single-machine approach


    Sufficient capacity in terms of **random-access memory (RAM)** and processor time
    could result in better-equipped workstations on which PAD is installed and used
    for processing. In fact, by using Windows Server 2016, 2019, or 2022 and running
    flows unattended, it is possible to have multiple flows running simultaneously
    on the same machine, thus reducing infrastructure costs. This scenario can be
    illustrated like this:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_345_0.png)


    Figure 12.7 – Scalability with a single machine concept


    However, this would also require adjustments to the UI flows as they would need
    to be run by different users to create different user sessions on the'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'server. But this scenario runs the risk of creating a single point of error.
    In other words, if the machine goes down, no single UI flow will run.


    # Machine groups and flow queues


    A more dynamic approach is the use of machine groups and a load-balancing concept
    provided by Power Platform directly. The concept is depicted in the following
    diagram:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_346_0.png)


    Figure 12.8 – Machine groups and flow queues


    In this setup, a machine for UI flow execution is registered in Power Platform
    and also inserted in a machine group. In the corresponding cloud flow action for
    PAD, we can select this machine group as the execution environment, and everything
    else is handled by the platform. If several flows need to be executed simultaneously
    or in quick succession, the requests are first pooled in a queue. The platform
    then decides which machine to send an execution request to and distributes the
    request load evenly. If a machine should fail here, this initially represents
    a lower capacity on the one hand but does not lead to the complete collapse of
    the overall processing. On the other hand, it is very easy to add more machines
    to the pool to increase the total capacity without interrupting the process. The
    automated deployment of workstations with PAD, along with silent registration
    and silent join of a machine group, allow this to carry out.


    Microsoft also offers the option to use VMs for UI flow execution directly in
    the platform, which can be provisioned by using the Starter Kit (also'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'refer to the *Installation and deployment* section). With that option, it would
    also be possible to define a scaling strategy, which allows measuring the load
    and provisioning or deprovisioning additional machines.


    # # Security


    Among the various requirements for security in automation scenarios, we will take
    a closer look at two aspects in this section that are important in the context
    of PAD and for enterprise use: **data loss prevention (DLP)** policies and secure
    credential storage.


    # ## Protecting data with policies


    In every integration and automation scenario, data plays a central role. At the
    same time, it is precisely this data that is also a very valuable asset worthy
    of protection, so it must be ensured in every case that no data leaks out unintentionally.
    Especially in environments such as Power Platform, where essentially every employee
    can help optimize processes through low-code applications, policies must be able
    to be applied to prevent unwanted data flow. Data access and provision (sending
    to a receiver) are done using connectors, which we already learned about in *Chapter
    9*. We can now use the DLP policies, with which it is possible to define which
    connectors can be used with each other in a flow and which cannot. This can prevent,
    for example, a connector for an internal system being used in the same flow as
    a connector for the external provision of data and thus inadvertently leaking
    data to the outside. DLP policies are defined in **Power Platform admin center**,
    as depicted in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 348
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_348_0.png)


    Figure 12.9 – Definition of DLP policies


    # Note on DLP policies


    At the time of writing, this feature is in preview, and the use of these capabilities
    must be confirmed by an opt-in (announcement to Microsoft). Subsequently, the
    action groups and also individual actions can be blocked or restricted so that
    UI flows are disabled if a DLP policy is violated in the flow (prohibited connector
    or unauthorized combination with another connector).


    When the feature comes into general availability, it will only be available for
    managed environments for which additional security mechanisms exist beyond that.
    The Further reading section contains a link to get more information about managed
    environments.


    Apart from the actual data, there is also other information worth protecting,
    such as access data and passwords. We will look at the possibilities for this
    in the next section.


    # Secure credential storage'
  merge: -1
  img_proc: true
- pgno: 349
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 350
  md: 'not been released yet. The *Further reading* section contains the link to the
    announcement for this. It is strongly recommended to use this service for the
    storage of sensitive information. Now let’s take a look at additional considerations
    for governance and compliance.


    # Governance and compliance


    In Microsoft’s documentation, there is a separate article on the topic of governance,
    which describes in detail the settings for the Windows operating system (registry
    settings) to restrict and monitor the functionality of PAD. We want to take the
    topic of governance a bit further here and look at what options are available
    to monitor UI flows and thus monitor the overall operations. Furthermore, on the
    topic of compliance, we will take a look at licensing.


    # Monitoring flow execution


    Two portals can be used to monitor the execution of flows: the **Power Automate**
    portal and **Power Automate admin center.**


    The **Power Automate** portal provides a more operational monitoring capability.
    These functions are addressed to those who want to develop the flows, test them,
    and also monitor their operational functionality. The first view provides various
    charts, aggregated views, and filtering options (see the following screenshot):'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Figure 12.11 – Monitoring PAD flows


    The second view in the Power Automate portal provides a section for monitoring
    the real-time execution of Power Automate Cloud and UI flows. This shows each
    execution of the flows and their status: Queued, Running, Succeeded, or Failed.
    This makes it very easy to monitor which flows are routed to which machine and
    which flows fail.


    The reports in Power Platform admin center are aimed more at administrators who
    monitor the workload in the context of the environments. To do this, we need to
    go to Power Platform admin center and go to the Analytics | Power Automate section
    (see the following screenshot):


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_351_0.png)'
  merge: -1
  img_proc: true
- pgno: 352
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_352_0.png)


    # Figure 12.12 – Flow monitoring in Power Platform admin center


    There are different tabs available to provide information about the runs, usage,
    number of flows created and shared, and analysis of the connectors being used
    in flows. Governance requirements about the monitoring of Power Automate can thus
    be addressed very well. Another part is licensing, which we will look at in the
    following section.


    # Licensing


    In the course of the book, we have already learned about many functionalities
    of PAD, most of which are available with the free version. This is especially
    true for single use on a workstation, where flows are started manually and run
    interactively. Requirements such as scaling, parallel execution, centralized management,
    and rolling out flows are more typical for use in large enterprises and require
    the appropriate licensing. There are several license types available for this
    purpose, which then unlock a number of features and benefits and include the following
    features:'
  merge: -1
  img_proc: true
- pgno: 353
  md: <!-- no content -->
  merge: -1
