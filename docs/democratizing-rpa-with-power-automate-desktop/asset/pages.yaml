    vendor and the actions that it provides.


    # Google cognitive


    Google’s AI functionalities are accessible via the **Google Cloud Platform (GCP)**.
    First, you need to create a corresponding account. The provider provides a certain
    allowance that can be used to try out the services. The entry is carried out via
    [https://cloud.google.com](https://cloud.google.com), where a new account can
    also be created. You will then be in the Cloud Console, where you can search for
