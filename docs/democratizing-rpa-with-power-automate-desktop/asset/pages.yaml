    +   - VMs can be ramped up and down at will. This means that if an application
    is only needed once a month for a certain workload, for example, a lot of resources
    can be saved and the machine can only be booted for the time of use.


    So, the respective PAD actions are designed to control virtual machines (start,
    stop, restart). In addition, it is possible to work with virtual disks, which
    can be created and deleted. Once created, a disk needs to be attached. Please
    note that we don’t have any actions to create or delete a VM. Thus, it is assumed
    that the applications that are to run on the VM are already installed.


    The following table shows the actions that can be used within PAD for managing
