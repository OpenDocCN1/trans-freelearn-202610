  md: 'Now that we have some UI elements, we can also demonstrate their use. PAD has
    dedicated actions for different UI elements. Since we have captured buttons, we
    could use the Press button in window action (the UI automation | Form Filling
    action group) to simulate the calculation by PAD. Just drag this action four times
    into the designer and select the right sequence of UI elements. It should look
    like this:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_149_0.png)


    Figure 5.22 – Flow simulating a calculation


    We can also use the Get details of the UI element in window action to extract
    the data of the result text field to use this somewhere else. Executing this flow
    will press the buttons according to the sequence in the flow magically. This is
    UI automation.


    It is also possible to create UI elements for desktop icons or taskbar icons.
    In conjunction with the actions in the UI automation actions group, this provides
    us with an extensive repertoire of automation options.


    However, not only Windows applications can be controlled remotely. PAD can also
    access and remotely control web applications and pages. The procedure is the same
    as for Windows applications. However, a corresponding browser extension must be
    installed for the browser being used so that PAD can recognize the web elements.
    Microsoft provides'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'browser extensions for Google Chrome, Mozilla Firefox, and Microsoft Edge (see
    the *Further reading* section for more information).


    Virtual desktops can also be included in automation. However, for UI elements
    to be recognized there, a small extension is also required – the so-called Power
    Automate agent for virtual desktops. Further information on this can be found
    in the last section of this chapter, as well as in the *Further reading* section.


    Therefore, recognizing UI elements plays a very important role so that corresponding
    actions such as clicks or *button pressed* can be executed. PAD arranges each
    UI element hierarchically under a so-called selector and assigns names and properties
    to make the element unique in the corresponding application and the operating
    system. Double-clicking on a created UI element shows that selector and its properties,
    as shown in the following figure:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_150_0.png)


    Figure 5.23 – The selector view for a Windows button'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'It is also possible to create a selector and disable an existing selector for
    an element. This can be especially helpful when testing because correctly identifying
    UI elements is crucial for automation.


    We will look at more details and examples of this in *Chapter 6*.


    # How to use images with PAD


    As we learned in the previous section, PAD can identify UI elements by using specific
    selectors. But there are situations where we need other mechanisms to perform
    certain actions, such as moving the mouse to a certain place and performing an
    action. This is where images come into play. We have the following actions that
    use images as input:


    +   - **if image** checks whether an image is available on the screen

    +   - **Wait for image** waits for an image to appear or disappear on the screen

    +   - **Move mouse to image** moves the mouse to an image on the screen


    Combined with **Send mouse click**, it is even possible to perform actions without
    knowing the UI element. This technique is also useful if we need to automate on
    virtual or remote desktops where there is no agent available, such as Linux or
    Unix. Any program on any system can be executed and controlled remotely via this
    technique. So, for example, if there is a business application that runs on a
    Linux system and does not have any API, it would be possible to automate this
    program with PAD as well.


    Power Automate agent for virtual desktops


    The computer running PAD can, in principle, also remotely control a **remote desktop**
    protocol (**RDP**) session. If the remote system is also a Windows system, the
    Power Automate agent for virtual desktops can be installed on that system. This
    makes it possible to use UI elements within the RDP session as well. This works
    with both Citrix and Microsoft Remote Desktop.'
  merge: -1
  img_proc: true
