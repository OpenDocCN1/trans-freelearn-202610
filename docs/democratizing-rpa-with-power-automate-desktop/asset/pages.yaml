  md: "# Custom object\n\nSo far, we have looked at data types that have exhibited\
    \ similar structures, such as a data table in which the associated records always\
    \ had the same structure. However, we can also work with a data type called **object**,\
    \ which is described by a set of properties and related values. Let’s take the\
    \ `cars` example from earlier in this chapter. For example, a car has the following\
    \ properties: brand, color, year of manufacture, type of vehicle, and more. For\
    \ some time now, the so-called **Javascript Object Notation (JSON)** format has\
    \ prevailed here for the notation of such an object. This could look as follows:\n\
    \n```\n{\n  'Brand': 'BMW',\n  'Color': 'blue',\n  'year of manufacture': '2020',\n\
    \  'type of vehicle': 'SUV'\n}\n```\n\nIt is possible to create an input/output\
    \ variable for a custom object. All you have to do is select **Custom object**\
    \ as the data type. Then, you can edit the data for the object in a separate dialog:\n\
    \nTip\n\nIf you want to have a readable JSON file that you can easily edit, you\
    \ can use the free JSON Formatter at https://jsonformatter.org/."
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Figure 5.19 – Creating and editing a custom object


    This data type is especially useful when we need to create a flow that communicates
    with some external web services that expect or return JSON objects. We will discover
    this later in this book.


    To convert the custom object into a valid JSON string, we can make use of the
    Convert custom object to JSON action, which expects a custom object as input and
    produces a new variable containing the JSON string. The reverse operation is Convert
    JSON to custom object. Both actions are also in the Variables action group. We
    will look at examples of how these actions are used later in this book.


    # Text data type and corresponding actions


    We have now learned about the complex data types that PAD contains out of the
    box. The text data type does not belong to this group of data types, but there
    is a large number of actions that deal only with this data type. Therefore, it
    makes sense from my point of view to mention it briefly here.


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_143_0.png)'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'These actions are in the Text action group and perform all the tasks you would
    expect from a text editor and can be very useful in flow design. These include
    Split text, Get subtext, Crop text, and many more. I would like to pay special
    attention to the Recognize entities in text action, which is capable of extracting
    certain entities from a piece of text using AI. I encourage you to try the corresponding
    example of Microsoft for this purpose. To do so, switch to the Console window
    and go to the Examples section. Under the Text Manipulation heading, you will
    find an entry called Extract phone numbers and emails from text. Edit this flow
    and look at the call to experience the power of AI while interacting with PAD
    for the first time.


    # The % notation


    In all the examples we saw earlier, we needed to use the % notation, which is
    needed whenever we want to use a variable. A variable or an expression in which
    one or more variables occur must always be enclosed with the % character since
    it is precisely this part that is evaluated by PAD. Within the two % characters,
    simple arithmetic operations, logical comparisons, or expressions can be used
    together with variables or hard-coded values. Here are some examples:


    +   - `%CarName%`: Returns the content of a variable called `CarName`.

    +   - `%''CarName''%`: Please notice the quotes. This returns the hard-coded `CarName`
    value.

    +   - `%Counter + 1%`: Returns the value of the `Counter` variable increased by
    1.

    +   - `%(Counter + 1) > 15%`: Makes use of parenthesis and returns a Boolean value
    of `True` if the `Counter` variable has a value of 15; otherwise, it returns False.

    +   - `%NettoPrice + VAT%`: Returns the sum of the values of the `NettoPrice`
    and `VAT` variables.


    Using the % sign as a simple character'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Sometimes, we may want to use the % sign not in an expression but just as a
    normal character. In this case, it is possible to escape the character with another
    percentage sign (%%).


    This notation is very straightforward to use and sometimes it is very handy to
    do a simple calculation right in the field where we would otherwise just place
    the variable itself. On top of that, within these expressions, it is also possible
    to make use of the variable’s data type properties. This refers to those properties
    that are provided by the non-built-in data types. These include, for example,
    dates, lists, files, folders, Outlook messages, web browser instances, and more.
    For example, the **Get files in folder** action returns a list of files, each
    of them being of the **File** data type. We could iterate through this list and
    have the current item in a variable called `currentItem` to access properties
    such as the following:


    +   - `% currentItem.FullName%` contains the full path to the file

    +   - `% currentItem.Size%` is the size of the file in bytes


    Please consult the *Further reading* section for a link to the official documentation
    of all data types and their properties.


    Variables and the % notation are extremely important parts of creating flows.
    It is vital to become familiar with this concept and how variables can be created
    and manipulated. Now, let’s look at how we can create UI elements to remotely
    control external applications.


    # Identifying and creating UI elements


    In *Chapter 1*, we learned that PAD comes from the **robotic process automation
    (RPA)** area and that this involves remotely controlling local applications. It
    is those applications that supply input options, which can be used for flow processing.
    These input options are identified by PAD'
  merge: -1
  img_proc: true
