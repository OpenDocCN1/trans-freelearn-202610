    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_197_0.png)


    Figure 7.8 – Using a Scripting action in PAD


    This flow shows the general concept of using **Scripting** actions in a PAD flow
    by implementing some simple scripting. In this example, we want to ask the user
