- pgno: 252
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_252_0.png)


    Figure 8.19 – A new quote created by PAD


    # Notes on this example


    At this point, we could ask ourselves whether it makes sense to use this method
    to perform actions in Dynamics 365. There may be several reasons for this:


    +   - There is currently no one else available to feed us this data via another
    interface, such as a cloud flow

    +   - This flow is possibly only a sub-flow and other systems have to be served
    locally


    In addition, it should be noted that due to space limitations, we have only mapped
    a portion of the flow here. Of course, a quotation also consists of quotation
    items, which would naturally have to be taken into account and considered accordingly.
    Information such as the name of the offer, the customer, and also the price list
    would be provided via variables in a real scenario.'
  merge: -1
