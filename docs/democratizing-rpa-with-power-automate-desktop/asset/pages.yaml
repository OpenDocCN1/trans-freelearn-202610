    If you want to work with the actions for accessing a local Exchange Server, please
    note that Exchange Server up to version **2013 Service Pack 1** is supported.


    Apart from the differences presented here, the actions for working with emails
    all work the same. The only thing to decide is whether the Outlook client can
    and should be used or not. This decision has to be made individually and I would
