    # Summary


    Installing PAD is straightforward, just like installing any other Microsoft tool.
    Once you have signed up for a Microsoft account, you can log in to the program
    and start creating your UI flows right away.


    It is recommended to try things out and use the tool even to automate simple tasks.
    This will make you more familiar with the program, as I explained in this chapter.
    The recorder can save you a lot of work and it can be used for new or existing
    flows. Especially if web scraping is a task, this tool can be very handy.


    In the next chapter, we will continue our journey and look at the editing and
    debugging capabilities of PAD.


    # Further reading


    To learn more about the topics that were covered in this chapter, take a look
    at the following resources:


    +   - *Install Power Automate Browser extensions:* https://learn.microsoft.com/en-us/power-automate/desktop-flows/install-browser-extensions

    +   - *Record desktop flows:* https://learn.microsoft.com/en-us/power-automate/desktop-flows/recording-flow'
