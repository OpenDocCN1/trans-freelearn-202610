    by verbal and natural language description (see https://powerautomate.microsoft.com/en-us/blog/new-ways-to-innovate-with-ai-and-microsoft-power-automate/).


    However, there is one scenario that I would like to discuss briefly here, which
    could certainly have relevance for practical use. There are always situations
    where certain paper-based forms need to be processed in day-to-day business:


    +   - The school form where parents are supposed to tick certain things to give
    their consent or fill in the information

    +   - The order confirmation or delivery bill from a supplier with transaction
    data

    +   - The form at the hospital or doctor’s office for patient registration


    The basic mechanism is always the same, as there is always a specific form on
    which data is always entered in the same place. Microsoft and Google, for example,
    offer prefabricated but not yet trained models for digitizing and reading out
    these forms. The Microsoft Power Platform contains such a'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'service, which is called AI Builder. Here, we find predefined models for the
    following purposes:


    +   - Extracting data from PDF documents, identity documents, business cards,
    and so on

    +   - Classifying customer feedback or any other text into predefined categories

    +   - Extracting key elements from text or the most relevant words and phrases
    from text


    If these models are not sufficient, it is also possible to create your own AI
    models. After the models have been equipped with training and test data, they
    can be deployed directly and used within a cloud flow. Accordingly, this technology
    allows you to use your own forms with AI and incorporate them into a process.


    In principle, such a model would also be retrievable via a standard HTTP request.
    In the following chapter, we will learn how this and other web protocols can be
    used with PAD.


    # Summary


    In this chapter, we looked at the topic of AI and the options for adding intelligence
    to UI flows. We learned that these options usually play a role in a larger context
    and that, within PAD, we also have access to the common models today. However,
    if we find the need to access such functionality as part of a UI flow, we can
    do so within PAD using the actions presented here, without having to consider
