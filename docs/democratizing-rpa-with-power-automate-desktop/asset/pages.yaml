  md: 'part of the preceding figure, you can see how this information is used in a
    subsequent step to generate the information activity for the sales representative.


    # Unattended execution (Run mode)


    So far, we have started PAD flows manually and were able to observe interactively
    how the flow ran through the actions. Here, there was a user logged on to the
    system. This is what is called an **attended execution**. Accordingly, an **unattended
    execution** runs without the option to look at the execution. This also means
    that an active user session can’t be on the machine that executes the flow. An
    unattended execution of a flow can only be triggered from a cloud flow. This is
    possible because we provided all the necessary information for the flow to log
    in to the machine and start the flow. During execution, a locked Windows user
    session is created. This session is released when the execution finishes.


    To run the previous example in unattended mode, it would only be necessary to
    make the appropriate setting in the connector for Power Automate and log out of
    the local Windows session. Of course, this makes sense, especially if no spectators
    are desired during the execution of the flow – for example, because sensitive
    data is being processed.


    As we have seen in this section, it is possible to seamlessly incorporate Desktop
    Flows into larger integration scenarios thanks to the connector capabilities in
    Power Platform, and without having to code a single line. With these capabilities
    of PAD, local applications are no longer isolated and can provide their capabilities
    and data to the business, making a valuable contribution.


    Another very popular service in the Microsoft Cloud is SharePoint. We’ll take
    a look at its interaction capabilities in the next section.


    # Managing lists, files, and folders with SharePoint'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'Microsoft SharePoint continues to be very popular and is the platform for managing
    team pages, project workspaces, lists, and document libraries within the Microsoft
    365 product suite. Often, this platform is also used as a document management
    system and serves Microsoft Teams as a substructure for managing documents:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_271_0.png)


    Figure 9.13 – Standard SharePoint example team site


    Document libraries contain many useful settings such as versioning, collaborative
    work on documents, and many more. Therefore, they offer a great advantage if frequently
    used systems such as SharePoint can also be addressed natively by PAD. Desktop
    flow creators no longer have to turn to cloud flows to work with SharePoint. All
    data stored in SharePoint is thus automatically available to a larger team or
    even an entire company. At the time of writing, the actions for SharePoint are
    still in the preview stage. Let’s take a look at the actions grouped by type:


    +   File:

    +     Copy or move a file from one site address to another site address'
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   - Create or update a (new) file from binary data

    +   - Check in, check out, or discard a file to prevent someone else from overriding
    changes

    +   - Get metadata and delete and get file content by the file identifier

    +   - Folder:

    +     - Copy or move a folder from one site address to another site address

    +     - **List folder and list root folder**: Returns files contained in a given
    folder or the root SharePoint folder

    +     - **Get folder metadata**: Returns metadata information about the folder

    +     - **Extract folder**: Extracts the content of a ZIP file to a folder

    +   - List:

    +     - **Get lists, get all lists and libraries**: Returns all lists or both
    (lists and libraries) from a given SharePoint site

    +     - **Get list views**: Returns all views from a given SharePoint list


    Files and folders should be understood here in the same way as on a local computer.
    Lists and libraries represent a superordinate container in which files and folders
    can be contained accordingly. Please note that there are no actions to upload
    or download a file directly. But this can be accomplished by using additional
    PAD actions, which is what we will see in this section’s example.


    SharePoint actions can work with both the online version and a local installation.
    For the latter, a connection must be established via the Data Gateway.'
