- pgno: 211
  md: 'The following example uses some of the actions that we just learned about.
    We want to create a flow that collects some information about the current system,
    stores this in a PowerPoint slide deck, and saves that report on OneDrive. This
    would require a series of mouse clicks and key sends for this operation.


    Please notice that we are not using UI elements for this example, which would
    also be a very good option. Instead, we want to simulate the user session with
    the previously defined actions. So, let’s take a look at what the flow looks like:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_211_0.png)


    Figure 7.15 – A flow to create a PowerPoint system report


    As we can see here, the flow is again structured into some subflows for easier
    readability and maintainability. The first subflow opens PowerPoint by using the
    Windows button, and the second one creates the first introduction slide with the
    current date. The third subflow launches the Windows System Information pane,
    takes a screenshot, and puts this into the clipboard. In the fourth flow, this
    screenshot is inserted into a second slide, and after some formatting, we save
    and close the slide deck in the'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'default OneDrive folder. All subflows are embedded in a **Block Input** action,
    where the first turns on blocking and the second unblocks it.


    Let’s see the details of the first subflow:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_212_0.png)


    Figure 7.16 – Launch PowerPoint with the Send mouse click action


    In the first action, we trigger a click on the Windows button to activate the
    **Start** menu. The coordinates shown here are for my desktop. They are probably
    different on another desktop.


    Different desktops for flow creation and execution


