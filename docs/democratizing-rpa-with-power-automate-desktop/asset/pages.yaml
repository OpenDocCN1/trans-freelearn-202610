- pgno: 303
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_303_0.png)


    # Figure 10.9 - The result of the sentiment analysis


    We can see that we receive a scoring and a magnitude for the overall sentiment
    of the document. Additionally, each sentence is also evaluated separately for
    the sentiment. According to the documentation, a score of about 0.0 would be neutral,
    as well as a magnitude with a low value. This would allow a slightly positive
    sentiment as an interpretation.


    The result of the second **Analyze entities** action gives us some insight into
    what this text is about (see the following screenshot):


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_303_1.png)'
