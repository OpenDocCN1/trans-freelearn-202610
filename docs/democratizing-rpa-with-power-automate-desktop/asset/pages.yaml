    # SAP and transaction codes


    When working with SAP ERP, we often talk about so-called reports and transactions,
    which are used to execute business requirements and processes. A transaction code
    (for example, SU01) starts a program for entering parameters and very often starts
    a report afterward. The transaction used here, for example, allows a username
    to be entered, which can either be searched for or created. Therefore, the process
    shown here represents a very typical routine for working with SAP.


