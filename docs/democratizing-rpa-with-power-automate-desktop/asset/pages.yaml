- pgno: 11
  md: '# Getting Started with Power Automate Desktop


    **Power Automate Desktop (PAD)** is based on principle known as **robotic process
    automation (RPA)**. In this chapter, we will look at the essential concepts of
    PAD and explore the fundamentals that Microsoft leveraged to create the product.
    In addition, we will look at how the product fits into the ecosystem of Power
    Platform and what possibilities exist with it.


    In this chapter, we will cover the following topics:


    +   - What is PAD and what can it do?

    +   - How it all started – robotic process automation

    +   - Microsoft Power Platform at a glance

    +   - UI flows demystified and their role in Power Platform

    +   - A first example of the incredible potential of PAD and Power Platform


    By the end of this chapter, you will have a thorough understanding of the concept
    of RPA and how PAD fits into the Microsoft automation strategy. The first example
    will show you the potential of PAD and provide a taste of what you will learn
    in this book.


    # What is PAD and what can it do?


    To best understand the functionality of PAD, we will go through a few examples
    in the following subsections where PAD is ideally used.


    # Example 1 – automatic response letter processing'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Imagine you are part of an organizing team at your child’s school and an event
    is to be organized at the school.


    Someone in the organization team has already created a form letter in which all
    the parents of the students are contacted and in which the parents should indicate
    by ticking whether they agree with the participation of their child. All these
    cover letters now come back as Word documents and contain the student’s names,
    as well as a ticked box for acceptance or rejection in each case.


    You should now generate an Excel list to create an overview of the acceptances
    and rejections. To do this, you would have to open each Word document and see
    which student it is and which box was ticked. This whole process is depicted in
    the following diagram:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_12_0.png)


    Figure 1.1 – How to generate a report out of email attachments'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Depending on the number of students and the information that would need to
    be looked up, this is a tedious and lengthy task. As you can see from the preceding
    diagram, this process can be quite boring and time-consuming. On top of that,
    we would also need to repeat this every day until we reach the reporting deadline.


    PAD could help in this situation. It is possible to create a flow that checks
    all emails belonging to a specific topic and saves the Word document into a specific
    folder. Another flow can examine all files or documents in that folder, extract
    the relevant information, and transfer it into an Excel spreadsheet. You would
    need to create this flow once and it would do the rest of the job automatically.


    It would even be possible to make use of **optical character recognition (OCR)**
    if the letters come back as printed output.


    # Example 2 – integration of a legacy application


    Even today, there are still a high number of legacy applications that were created
    specifically for certain use cases and can’t be modernized for a variety of reasons.
    These reasons include a lack of budget, outdated technology, and a lack of resources,
    competencies, and time.


    The employees are virtually forced to work with this application and very often,
    such applications cannot access the data or processes programmatically via an
    **application programming interface (API)** or any other compatible interface.


    But what happens when such an application must be integrated into a larger context?
    For example, there could be a sales platform in which orders and invoices are
    recorded. However, this data must then also flow into the legacy application to
    keep the database consistent. Or perhaps, a unique customer number is generated
    in the legacy application that must be used elsewhere (see *Chapter 7* for an
    example).'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'In any case, there must be a way to address this legacy application and integrate
    it into a larger context – and this is where PAD comes in.


    With PAD, we can remotely control any desktop application, record a sequence that
    is always the same, and then run it again. With PAD, we can also execute this
    flow remotely or from an external event (the job is entered online in a system),
    read out the calculation or input results, and play them back as values in the
    workflow.


    This means that an application that cannot be called from the outside and can
    only be operated manually can nevertheless be automated and integrated. It also
    implies that in system landscapes, where many applications are involved in a process
    but have no technical connection, PAD can be used to design a coherent flow and
    exchange data between these applications.


    With its almost 400 actions (at the time of writing; the number of available actions
    is constantly growing), PAD can cover all user scenarios, beginning with web and
    desktop applications to databases, files, and folders to email and scripting integration.
    The following diagram illustrates the capabilities of PAD in terms of connections:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_14_0.png)


    Figure 1.2 – PAD capabilities'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Apart from remotely controlling locally installed programs, PAD can also connect
    to numerous external systems and environments, such as cloud environments from
    Microsoft or AWS, and incorporate artificial intelligence into scripting and web
    automation. All these connections can be used in a flow of PAD, allowing cross-system
    processes to be mapped.


    What this illustrates is that PAD can cover a wide range of use cases. However,
    it also doesn’t make sense to use PAD for everything and anything. In the following
    section, we’ll take a look at what criteria a process should fulfill so that the
    use of PAD makes sense.


    # What processes should be automated?


    As we saw in the previous sections, PAD is very powerful and can be used in private
    as well as business contexts. Processes and workflows are all around us and we
    work with them every day, but which process lends itself to automation?


    Creating a flow with PAD also involves a certain amount of work, so it’s worth
    taking a closer look to see if it’s worth automating a process. Here are some
    aspects that can be consulted when making a choice:


    +   - Do you understand the process well and is it consistent in how it will be
    executed? If there are too many variations or unpredictable behavior, it will
    be very difficult, if not impossible, to automate.

    +   - Is there a sufficient number of repetitions or even a high frequency in
    which a flow should be executed so that the investment in the work is worthwhile
    (**return on investment – ROI**)?

    +   - Is the process mainly manual and are there many errors that could be eliminated
    by automation?


    There may be also additional aspects that influence a decision to automate processes,
    but if you take these questions as a starting point, you are on the right track.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# # How it all started – robotic process automation


    The history of RPA started back in the 1990s–2000s. The need for **user interface
    (UI)**, sometimes also **graphical user interface (GUI)**, software tests became
    stronger at that time – that is, to be able to automatically click on a software
    GUI, enter values, and query outputs. For this, the first tools were developed
    that enabled the first UI and regression tests with the record-and-playback method.
    Screen scraping technology was also used for this purpose, with which the automation
    of extracting data from one application was made possible, to use these further
    in another place. The resulting automatic running process can also be referred
    to as a **bot** (the short form of **robot**).


    Somewhat later in 2005, a company called Softomotive was founded that extended
    the concept of record-and-playback to enable workflows and data between different
    Windows applications and thus automate processes even across applications. The
    product was called WinAutomation and was one of the leading providers of RPA software
    for a long time, along with other manufacturers.


    Softomotive was acquired by Microsoft in 2020 and their product WinAutomation
    was integrated with its functionality in the Power Automate module, which at that
    time had very limited functionality to automate desktop-based processes. Nevertheless,
    Power Platform was already very powerful as an overall concept at this point;
    we will discuss this in *Chapter 2*.


    # # Microsoft Power Platform at a glance


    The actual origins of Power Platform go back very far to the time when there was
    still talk of Microsoft business solutions. At that time, Microsoft'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'entered the market with a new CRM system, which laid the foundation of today’s
    Power Platform. This ecosystem consists of several subcomponents that can work
    very closely together but also separately:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_17_0.png)


    The low code platform that spans Microsoft 365, Azure, Dynamic 365, and standalone
    apps.


    Figure 1.3 – Microsoft Power Platform


    These are the components:


    +   - **Power BI:** A tool for visualizing any kind of data in dashboards and
    reports. Power BI can also capture real-time data from the other components and
    makes use of the connector capabilities to access data virtually in any data source
    and combine this with other data to create cross-system dashboards.

    +   - **Power Apps:** This allows users to create different types of apps that
    can be used for specific business processes. There are different types of apps,
    which, in turn, can be divided into the form factor (phone/tablet) or the way
    of creation (canvas versus model-driven). Power Apps also leverages the connector
    concept to use any data source in an app.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   - **Power Automate (ancient Microsoft Flow):** This is the general term
    for workflows and business processes that are created within Power Platform. PAD
    also falls under this category; we will take a closer look at this in the next
    chapter. But there are also other components here, such as **Business Process
    Flows (BPFs)**.

    +   - **Power Virtual Agents:** This module allows you to create a so-called chatbot.
    This can then be embedded into a website or other channel and represents an interactive
    way for the website visitor to contact the company, ask about the status of an
    order, and more.

    +   - **Power Pages (ancient PowerApps Portal):** This module is in preview at
    the time of writing and comes from the area of portals, which has been around
    for quite some time. It is a content management system that can be used to create
    external websites.


    The preceding figure also shows three other important building blocks of Power
    Platform:


    # Data connectors


    With data connectors, it is possible to access and work with all data sources
    offered through Power Platform. There are already more than 400 available today
    and more are being added every day. However, if Microsoft or a third-party manufacturer
    does not offer a connector, it is also possible to create your own connector and
    use it in the components offered.


    # AI Builder


    AI Builder allows you to include artificial intelligence in your apps or workflows.
    The offered models cover information extraction and text recognition, as well
    as translation, but also sentiment recognition or classification of customer feedback
    according to your criteria. Here, too, it is possible to create your own models
    of the AI, make them available in the platform, and have them used by the app
    or workflow creators.'
  merge: -1
  img_proc: true
- pgno: 19
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   - **Cloud flows**: These kinds of flows run in the cloud, meaning they
    are running on the Microsoft Cloud infrastructure within Power Platform. A cloud
    flow runs on a specific trigger event – for example, *a new contact was created*.
    It could also run instantly, for example by the press of a button in a Power App,
    or scheduled – for example, every hour. A cloud flow can be designed in the designer
    in the browser, and it can incorporate any data or systems that are also available
    online.

    +   - **Business Process flows**: Dynamics 365 contains a lot of predefined business
    processes, such as *lead qualification*. This describes the path of a prospect
    to a real customer, as well as the measures and actions required to achieve this.
    All these actions are recorded in a BPF and help the user determine what needs
    to be done next to further qualify the prospect. These flows are used exclusively
    in so-called model-driven apps and are not relevant in the context of this book.
    For more effective business processes, it is possible to merge cloud flows and
    BPFs.

    +   - **Desktop flows or UI flows**: These kinds of flows run on a local machine
    or workstation that could also be a virtual machine. PAD is used to create and
    design these kinds of flows, which can access resources such as locally installed
    applications or the operating system.


    # Note


    This book focuses on desktop flows and PAD is the tool dedicated to creating these
    kinds of flows.


    PAD contains over 450 so-called actions that can be used to design a flow. These
    actions and all design capabilities will be explored in the subsequent chapters.
    In the following subsections, the on-premises data gateway will be explained,
    as well as the concept of an environment.


    # Connecting PAD to the cloud


    In the previous section, we learned that cloud flows can access data and systems
    that are online. However, there are scenarios where a cloud flow needs to access
    a local machine that resides in a home or corporate network'
  merge: -1
  img_proc: true
- pgno: 21
  md: '(on-premises) – that is, it needs to enable a connection from Microsoft Cloud/Power
    Platform to a local machine, as we will see in the following example.


    In such scenarios, the issue of security takes on a special focus. For example,
    companies do not want external access to an internal system, or only under very
    limited and controlled conditions. The concern is justified, because such scenarios
    typically require firewalls and ports to be adjusted, which potentially allows
    an attack from the outside.


    Without downplaying the issue on the one hand, but not diving too deeply into
    the topic of security on the other, the concept of the Power Automate machine
    runtime is presented here. This provides a secure way to allow access from a Microsoft
    Cloud system to a local computer.


    Within the installation and configuration of the machine runtime on your local
    computer, you would need to connect to Power Platform and specify the corresponding
    credentials to register the local machine in the environment. After this, different
    components within Microsoft Cloud could make use of this connection.


    # Gateways for Desktop flows are deprecated


    A commonly used tool for connecting on-premise data sources is the so-called on-premise
    data gateway. This tool still exists but is no longer supported for connecting
    desktop flows. Instead, the Power Automate machine runtime is used to invoke local
    desktop flows from the cloud. For the use of the machine runtime, certain requirements
    must be met concerning the version and also the licenses. This will be described
    in more detail in Chapter 9.


    # Introducing Power Platform environments


    Power Platform is the ecosystem in which individual components are created, stored,
    and executed in environments.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Accordingly, an environment is a container that can wrap around the various
    components, such as apps and flows, and conversely, each component (app, flow,
    and so on) always belongs to exactly one environment.


    Whether a flow is displayed in the flow list depends on whether the correct environment
    is selected. We will take this into account in our examples throughout this book.


    In this section, we learned that PAD is not only a program for automating local
    applications, but that it is in a larger context with Microsoft’s Power Platform.
    PAD can be integrated into larger scenarios and can be used in enterprise environments.
    The next section shows an initial example of how PAD uses Office programs to map
    an overarching process.


    # Understanding the potential of PAD by looking at an example with MS Office


    Let’s take another look at the opening example, in which you were asked to help
    organize a school event as a parent council. This scenario looks like this:


    +   1. A school event is to take place and the parent council needs to obtain
    parental consent for the students.

    +   2. Letters have already been sent out to this effect and a Word document has
    been included. In this document, parents can check off whether or not they consent
    to their child’s participation. Afterward, the parents should send the Word document
    back to a specific email address. A document for this example has been defined
    and looks like this:'
  merge: -1
  img_proc: true
- pgno: 23
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_24_0.png)


    Figure 1.5 – Structural view of the flow


    The idea here is that you can execute this flow according to your need to collect
    all responses from parents arriving in the mailbox. Based on this structured flow
    chart, it is very easy to create a UI flow that does exactly this. Let’s take
    a look at the main building blocks here and how they have been created in PAD.
    In the subsequent chapters, we will learn how to create a flow like this in detail:


    +   1. Launch Outlook and save messages to a specific folder.


    The following screenshot shows the first part of the Desktop flow:'
  merge: -1
  img_proc: true
- pgno: 25
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_25_0.png)


    Figure 1.6 – PAD Outlook actions


    Each box with a symbol represents an action that can be placed on the design canvas
    via drag and drop. There are over 450 actions available in PAD grouped into different
    categories such as **Outlook**, **Files**, and **Folders**. The first four actions
    are Outlook-related and self-explanatory:


    +   - **Launch Outlook:** Starts the Outlook program on the desktop.

    +   - **Retrieve email messages from Outlook:** Retrieves messages in a specific
    folder and also allows you to store attachments in messages to be stored in specific
    folders.

    +   - **Process email messages in Outlook:** This allows you to move messages
    to some other folder. We will use this to move the messages from the inbox to
    some subfolder.

    +   - **Close Outlook:** Closes the program.


    2.  *Open Excel with the tracking workbook.*


    The second step is responsible for storing the attached Word documents in a specific
    folder that is used in the next building block:'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Launch Excel

    Launch Excel and open document SaveAttachmentsFolder \Activity Tracker.xlsx using
    an existing Excel process and store it into Excel instance ExcelInstance


    Get files in folder

    Retrieve the files in folder SaveAttachmentsFolder and its subfolders that match
    *.docx and store them into Files


    Get current date and time

    Retrieve the current datetime and store it into CurrentDateTime


    Figure 1.7 – PAD Excel and filesystem actions


    Let’s look at these actions:


    +   - **Launch Excel**: Opens Excel and also a specific workbook to store the
    responses.

    +   - **Get Files in a folder**: This action checks the local filesystem and creates
    a list of files in a specific folder. A filter for files can also be applied.
    In our case, we only want Word documents with the .docx extension.

    +   - **Get Current date and time**: Here, the flow determines the current date
    and time, which we can subsequently include in the corresponding entry in Excel.


    # 3. Handle each document in the attachments folder.


    The following block contains the handling for each Word document. The last sentence
    contains the for each keyword, which is also used in PAD to iterate through a
    list of items. In the last building block, this list of items/documents has been
    created by the Get files in folder action and the following block starts with
    that for each loop, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Figure 1.8 – Handling each document in a loop


    The actions are as follows:


    Rename file(s): Used to rename one or more files. Since we are iterating through
    the list of Word documents, each iteration contains a'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'different file in the folder. To identify the current file, this gets renamed
    to `work-in-progress.docx`.


    +   - **Run application**: PAD does not have specific actions for Microsoft Word,
    but like any other application, this program can also be automated. With this
    action, we start Microsoft Word on the local machine with a specific document,
    called `work-in-progress.docx`, which is the current document.

    +   - **Get selected checkboxes in window**: This action can extract `true` (for
    checked) or `false` (for unchecked) from any window of an application. In our
    example, we extract the information from the checkboxes of the Word document.
    We need this for the two checkboxes in the document, which is based on a template
    that was generated and sent in advance.

    +   - **Extract data from window**: Similar to a checkbox, this action allows
    us to extract text data from a window. We use this to extract the name of the
    child in the document.

    +   - **Get first free column/row from Excel workbook**: The workbook has already
    been opened in one of the actions. This action helps activate the first empty
    cell so that we can put content in it.

    +   - **Write to Excel worksheet**: This action writes data to the Excel cell
    specified. We need to perform this action four times to put all the data in.

    +   - **Terminate process**: This closes the Word application so that it can be
    opened with the next document in the next iteration.


    # 4. *Housekeeping.*


    Finally, we need to do some housekeeping, which will be covered by the actions
    shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 29
  md: '21 Delete file(s)

    Delete file(s) : SaveAttachmentsFolder "work-in-progress.docx"

    22 Save Excel

    Save the Excel document stored into ExcelInstance

    23 Close Excel

    Save the Excel document and close the Excel instance ExcelInstance


    Figure 1.9 –Housekeeping PAD actions


    In detail, these actions do the following:


    +   - **Delete file(s)**: Microsoft Word creates a hidden file when it opens a
    document that sometimes isn’t deleted and stays in the filesystem. To make sure
    that we will have valid documents in our folder the next time we run the flow,
    we just delete the hidden file, if it exists.

    +   - **Save Excel**: Saves our entries in the workbook.

    +   - **Close Excel**: Closes the program.


    This UI flow might look quite extensive because of multiple repetitions to store
    data in Excel, but it is nevertheless easy to create and very powerful. The time
    saved is enormous and it increases the more that parents need to be contacted
    and the more messages that need to be processed. In addition, this process could
    also be extended to using physical letters as input or responding to email messages.


    There are, of course, other examples of Desktop Flows and Power Automate that
    create connections to some external systems or UI flows that get triggered from
    some cloud system. We will see examples of this throughout this book.


    # Summary


    In this chapter, we started by providing an overview of PAD and how this product
    has been integrated by Microsoft into their Power Platform'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'ecosystem. We saw that the product fits perfectly into Microsoft’s strategy
    and fills the gap in desktop software integration very well.


    In our first example, we learned how different Office programs can be integrated
    to automate a repetitive process. Instead of handling each message and document
    separately, PAD saved the documents and extracted the relevant information. Thereby,
    we were able to save a lot of time by automating this process.


    In the next chapter, we will create a flow by taking a small and very useful tool
    to help us: the recorder.


    # Further reading


