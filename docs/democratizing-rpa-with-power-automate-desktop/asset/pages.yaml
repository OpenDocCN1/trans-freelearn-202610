- pgno: 354
  md: '![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_354_0.png)


    # Figure 12.13 – The Power Platform maturity model


    This model can help determine the current state of automation capabilities and,
    from there, take the next steps, if necessary, to achieve a better level of automation
    and thus increase the company’s efficiency and productivity. In general, the idea
    here is not to look at individual applications but to take a holistic view of
    automation practices across an enterprise to embed them in an overall concept.
    For each individual automation project, so-called *holistic enterprise automation
    techniques (HEAT)* techniques can then be used to help design and roll out the
    solution in the context of the organization and manage the overall life cycle
    of the solution.


    Another important building block is to build a team that addresses the various
    aspects of an automation solution and includes or builds experts to look at the
    solution from any facet, such as business content, ALM, infrastructure, security,
    and governance, as well as operational reporting and analytics. Another term for
    such a team is **Center of Excellence (CoE)**, and in relation to automation projects,
    **Automation Center of Excellence**.


    In the meantime, many companies have also implemented these concepts in tools
    and processes. Microsoft has embedded this information into a so-called Automation
    Kit and, thus, a collection of applications and flows'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'based on Power Platform. This kit can be installed and configured as a solution
    in an environment. The basic idea is to use the artifacts and apps installed there
    to support an automation project from start to finish, including the following
    aspects:


    +   - Definition of goals

    +   - Review and release of the project

    +   - Development and deployment

    +   - Operational use and monitoring


    This also supports different enterprise roles such as CVP, process owner, end
    user, and others. The following diagram illustrates the life cycle of such a project:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_355_0.png)


    Figure 12.14 – Automation project life cycle


    The fact that the kit can also be customized and that not all functions necessarily
    have to be used makes it easy to get started and shows what is possible with this
    technology. It is thus definitely worth a look and can bring added value and acceleration
    to automation projects.


    # Enterprise automation scenarios with PAD'
  merge: -1
  img_proc: true
- pgno: 356
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 357
  md: '+   - The CRM system is implemented with Dynamics 365, and Power Platform with
    Power Automate is also in use.

    +   - The internal invoicing system is represented by Contoso Invoicing (a desktop
    application), and the ERP system is accessible via a database (SQL Server).


    At this point, we probably already have enough information to sketch an initial
    idea for the overall process. This could look as follows:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_357_0.png)


    Figure 12.15 — Automation project scenario


    Now, as always, there are several ways to implement this requirement, but there
    is a lot to be said for using a UI flow for this:


    +   - The processing should be started individually by a team leader, which can
    be enabled via a shortcut on the desktop thanks to the advanced features.

    +   - Outlook actions enable us to retrieve and process emails.

    +   - We can extract the relevant information by using the text actions from *Chapter
    11* (**Parse text** or **Recognize entities in text**). Of course, it would be
    beneficial if the email were standardized, making it easier to identify the customer
    ID.

    +   - The next step would be to call the Dynamics 365 web API, retrieve all opportunities
    for the customer, and close these. An HTTP action will help us here to accomplish
    this action (**Invoke web service**).'
  merge: -1
  img_proc: true
- pgno: 358
  md: '+   - From a design perspective, we can outsource the processing for the invoice
    program to a separate cloud flow, which, in turn, includes the integration of
    the invoice program using the Desktop Flow connector. For the invoice application,
    we can then use the concepts for scaling that we learned about in this chapter.

    +   - The ERP database will be updated by using the database actions, which we
    learned about in *Chapter 11*.


    So, we can divide the overall processing into the following sections as subflows:


    +   - `GetEmailMessages`: This should retrieve all emails and create a list of
    customers we need to feed into our systems.

    +   - `CloseOpportunities`: For each customer, this subflow queries all open opportunities
    in Dynamics 365 and closes them. This will automatically trigger a cloud flow
    that listens to the **Opportunity Close** event and starts the processing with
    the invoicing app.

    +   - `UpdateERP`: This will also take the customer information and create new
    customer records in the database.

    +   - Subflow `NotifySeller`: This will send out a confirmation to the external
    seller.


    You will notice during the projects that in many places, already known concepts
    can be reused, as in this case, we have already covered the use of Outlook, information
    extraction with text actions, as well as database queries in this book. So let’s
    take a look at a topic that hasn’t been looked at in detail yet: using the **Invoke
    web service** action to integrate Dynamics 365 from our UI flow.


    # Calling web services within PAD


    Another very powerful tool within PAD is the **Invoke web service** action. Almost
    all applications today provide web services as interfaces to trigger processes
    or work with data, and so does Dynamics 365. However, in an'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'enterprise environment, these web services are usually protected from unauthorized
    access, and some form of login must be performed. Here, it all depends on the
    service, as there are different options for authentication and authorization.
    In the case of Dynamics 365 and generally all resources in the Microsoft environment,
    we use login via a so-called service principal, for example, a login via an instance
    registered in Azure **Active Directory (AD)** with a corresponding password (client
    secret). We already learned about this type of login in *Chapter 9*, where we
    worked with Azure VMs. Microsoft and most other providers use the OAuth login
    procedure for this. The goal of this processing is to do the following:


    +   - Log in to Dynamics 365 by providing a tenant ID, client ID, and a client
    secret and obtain an access token, which can be used to access subsequent services

    +   - Query Dynamics 365 with the given customer and retrieve all open opportunities

    +   - Close each opportunity by calling the corresponding Web Service action in
    Dynamics 365


    The following screenshot shows this subflow:'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# Figure 12.16 – Calling Dynamics 365 web services


    This flow does the following:


    +   1. Calls the authentication URL for Microsoft services with the required parameters
    to retrieve an access token. This is stored in the corresponding variable and
    is converted into a custom object to use in subsequent actions (lines 1 and 2).

    +   2. Calls the Dynamics 365 web service and a query parameter to retrieve all
    opportunity records for the given account name, which has been set by the previous
    subflow. The result of this is a list of opportunities for that customer that
    we need to close. The list is also converted to a custom object (lines 3 and 4).

    +   3. In the loop, call a specific Dynamics 365 action to close an opportunity
    (lines 5 to 7).


    Please note that we are calling a SaaS service from a UI flow here. It would otherwise
    be very inconvenient to use a cloud flow for this in our current'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'situation. The communication is very fast and stable and is a real productivity
    gain, as these records would otherwise have to be closed manually, which would
    definitely take much more time.


    However, as mentioned earlier, it could be that multiple team leaders start this
    process at the same time. It must therefore be ensured that possible load peaks
    are absorbed. We will take a look at this setup in the following section.


    # Providing scalability and reliability with machine groups and queues


    The execution of desktop flows is usually slower than that of cloud flows. There
    are the following reasons for this:


    +   - A connection must be established to a remote machine

    +   - The legacy application may need to be started

    +   - The actual processing, calling different screens, and so on must take place


    All these things take their time, during which a cloud flow may be blocked from
    execution. And during this process, no other flow would be able to start another
    process on this machine.


    The queuing and scaling options in Power Platform can address these issues. The
    execution of desktop flows is managed by queues and can be distributed to multiple
    machines within a machine group.


    This concept is described in detail in this chapter. For this setup here, I created
    two Windows 11 machines equipped with PAD and in the same machine group.


    If the Desktop Flow described here is now executed on another machine, this will
    result in several opportunities being marked as Won very quickly. This happens
    so quickly that individual processing cannot even be started.'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'Nevertheless, the request is recorded by the queuing, and the platform controls
    to which machine the next execution is sent (refer to the *Machine groups and
    flow queue* section in this chapter). The following screenshot shows the **Run
    queue** tab for a machine group that has queued some flows:


    ![](img/ce6bfe9c712dcd60fc2c4e058dc84e6a_362_0.png)


    Figure 12.17 – Run queue in Power Automate


    # Summary


    The concepts presented in this chapter build on the full range of Power Platform
    tools to address all automation requirements. PAD is a building block in these
    concepts and fits in seamlessly. The use of Power Platform also has the advantage
    that the general requirements for all tools, such as monitoring and management,
    as well as compliance with legal requirements, can be carried out at a central
    location.


    PAD is constantly being extended and improved and already offers numerous features
    that enable its use in large companies and support automation projects, as we
    have seen in this chapter.


    It is expected that deeper integration into Power Platform will occur, building
    on the concepts and capabilities presented in this book. This'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'provides a very solid foundation for further automation projects based on Power
    Automate Desktop.


