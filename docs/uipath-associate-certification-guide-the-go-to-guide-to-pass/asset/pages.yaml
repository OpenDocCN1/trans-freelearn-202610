  md: '# # Automating filter and download attachments from an email


    In email automation, processing attachments is one of the most essential tasks.
    In UiPath Studio, we will use the Get Outlook Message activities to read the attachments
    and store them in a destination folder. We are going to use the attachment documents
    from the output emails generated in the previous section (Step 9 of Automating
    sending email messages) to process the attachments. For all Outlook activities,
    the Outlook application needs to be installed on the machine in which the automation
    is executed. Finally, we will learn about various filtering options, such as email
    address and subject line.


    Use the following step-by-step instructions to download the attachments:


    +   1. **Create a new project**

    +   Create a new process from the UiPath Studio backstage view.


    +   2. **Get the Outlook mail message**

    +   In the Main file, drag the **Get Outlook Mail Message** activity from the
    **Activities** panel, as shown in Figure 12.38:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_386_0.png)


    Figure 12.38 – Get Outlook Mail Message activity'
  merge: -1
