- pgno: 15
  md: '# Preface


    UiPath is the most popular vendor in the Robotic Process Automation (RPA) industry.
    If you''re an RPA enthusiast or citizen developer who wants to succeed in the
    industry, achieving this certification can help you get accredited and ready for
    real-world challenges using UiPath.


    UiPath Associate Certification Guide offers complete, up-to-date coverage of the
    UiPath RPA Associate certification exam to help you pass on the first attempt
    and get certified. The book is written in a clear, succinct way with self-assessment
    questions, quizzes with answers at the end of each lesson, exam tips, and mock
    exams with detailed answers and explanations. You''ll start by getting to grips
    with the basic concepts of UiPath RPA, and then progress to an in-depth discussion
    of all the concepts required for Associate certification. Finally, you''ll develop
    UiPath skills by gaining the required knowledge and implement these skills using
    sample business cases.


    By the end of this UiPath book, you''ll have covered everything you need to pass
    the exam, gained the knowledge you need to work on real-world case studies, and
    learned how to apply various concepts to build enterprise-level use cases.


    # Who this book is for


    This RPA book is for those in technical and semi-technical roles such as citizen
    RPA developers, junior RPA developers, RPA developers, solution architects, business
    analysts, system administrators, college or university students and graduates,
    and UiPath and partner employees in pre-sales, services, support, and so on. If
    you are looking to get certified and meet the industry standard with the largest
    RPA vendor, then this book is for you.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# What this book covers


    Chapter 1, The Automation Journey and Identifying Suitable Business Processes,
    explores the importance of digital transformation and what factors drive it. The
    chapter also illustrates some RPA use cases in business, followed by the essential
    steps needed to identify a suitable automation process. Knowledge of these points
    is necessary before starting the RPA journey, as the topics addressed in this
    chapter give you an idea about the current state of process automation in the
    world, why it is important, and the critical resources involved.


    Chapter 2, UiPath Ecosystem, provides an overview of each and every component
    of the UiPath Enterprise RPA platform for building simple to complex automation
    using UiPath Studio. Information about installing UiPath and setting up the UiPath
    Studio profile is also included in this chapter.


    Chapter 3, Introducing UiPath Orchestrator, focuses on introducing the UiPath
    cloud platform and UiPath Orchestrator. UiPath Orchestrator plays a significant
    role in automation as it acts as the central controlling unit for all deployed
    robots and processes. Hence, it is crucial to understand the use and concepts
    of Orchestrator to manage your virtual workforce.


    Chapter 4, Create, Deploy, and Execute RPA Process on the UiPath Ecosystem, provides
    step-by-step instructions to create a robot and establish a connection between
    the robot and UiPath Orchestrator. A sample automation project is created in UiPath
    Studio and then published to Orchestrator and executed by the Robots using the
    UiPath Assistant and attended automation.


    Chapter 5, Learning about Variables and Arguments, looks at variables and arguments
    – two crucial components of any programming language. This chapter introduces
    you to how UiPath Studio works with variables and arguments, along with the most
    common data types used.


    Chapter 6, Understanding Different Control Flows, covers control flows, which
    give more power to the robot to make crucial decisions while evaluating any business
    conditions. Various control flow activities, such as sequences, flowcharts, and
    loops, are explored using real-time examples for better understanding.


    Chapter 7, Manipulating Data Using UiPath, focuses on data – the most critical
    resource in every organization. We need to modify, structure, format, and sort
    data to convert it into meaningful information. This chapter introduces different
    methods of manipulating data based on various data types.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Chapter 8, Exploring UiPath Selectors, looks at one of the major important
    topics when it comes to automation – selectors. Various selector types, such as
    full selector, partial selector, static selector, and dynamic selector are discussed
    with examples. Certain selector tools, such as UI Explorer and Selector Editor,
    are also used effectively for optimal usage of selector features.


    Chapter 9, Learning the Uses of Data Tables and Exploring Excel Automation, homes
    in on Microsoft Excel – used almost every day to perform different functions.
    The data we process in Excel is more structured in a tabular form. In this chapter,
    we focus on learning how to automate Excel using UiPath, and how we can use data
    table variables to support our Excel automation.


    Chapter 10, Exploring User Interfaces and User/Robot Interactions, looks at the
    automation of the user interface. Automation of UI elements such as windows, text
    fields, buttons, dropdowns, checkboxes, textboxes, and so on are discussed in
    this chapter. Various input actions and output actions are explored for effective
    automation. Some advanced UI automation such as image automation and text automation
    is also discussed.


    Chapter 11, Automating PDF Data Extraction, covers PDF files – widely used across
    organizations to share information. This chapter focuses on learning how to automate
    PDF files using UiPath, and what activities are available to build a successful
    PDF automation.


    Chapter 12, Exploring UiPath Email Automation, focuses on email – one of the most
    often used forms of digital communication by individuals and organizations. This
    chapter explores how to automatically send emails, receive emails, respond to
    emails, attach and download document attachments, and use defined message templates
    for emails. Various email activities and email features are explored with real-time
    examples for better clarity.


    Chapter 13, Debugging, shows you how to debug a process that involves identifying
    and removing bugs from a given project to make it function correctly.


    Chapter 14, Invoice Processing – Dispatcher, shows you how to design the dispatcher
    model of invoice processing to extract relevant details from the invoice and upload
    it to Orchestrator queues.


    Chapter 15, Invoice Processing – Performer, shows you how to design the performer
    model of invoice processing by retrieving transaction items from Orchestrator
    queues and entering the invoice data onto the CRM.


    Chapter 16, How to Prepare and What to Expect, helps you understand more about
    the exam and the certification credential.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Chapter 17, Mock Exam 1, is a practice test designed to help you prepare for
    the UiPath RPA Associate v1.0 exam. The practice test tests your knowledge and
    helps you get a feel for what the actual exam is like.


    Chapter 18, Mock Exam 2, is a practice test designed to help you prepare for the
    UiPath RPA Associate v1.0 exam. The practice test tests your knowledge and helps
    you get a feel for what the actual exam is like.


    # # To get the most out of this book


    In this book, we use UiPath Studio, UiPath Orchestrator, and the UiPath Assistant,
    so ensure that you have the correct version installed.


    You also need access to a few applications, as documented in the *Technical requirements*
    section of each chapter.


    | Software/hardware covered in the book | Operating system requirements |

    | --- | --- |

    | UiPath Studio 202X.X | Windows 8.1+ |

    | UiPath Orchestrator 202X.X | |

    | UiPath Assistant 202X.X | |


    This book is compatible with the latest version of UiPath Studio, Orchestrator,
    and Assistant at the time of publishing (UiPath 202X.X).


    The entire UiPath Associate Certification is based on the Classic Design experience
    of UiPath Studio. The Modern Design experience is not a part of the certification;
    hence, the book is also based on the Classic Design experience.


    **If you are using the digital version of this book, we advise you to type the
    code yourself or access the code from the book’s GitHub repository (a link is
    available in the next section). Doing so will help you avoid any potential errors
    related to the copying and pasting of code.**


    # # Download the example code files


    You can download the example code files for this book from GitHub at https://github.com/PacktPublishing/UiPath-Associate-Certification-Guide.
    If there’s an update to the code, it will be updated in the GitHub repository.


    We also have other code bundles from our rich catalog of books and videos available
    at https://github.com/PacktPublishing/. Check them out!'
  merge: -1
  img_proc: true
