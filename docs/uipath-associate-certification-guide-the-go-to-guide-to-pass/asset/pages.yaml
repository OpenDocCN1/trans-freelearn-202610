  md: '# Methods of recording the GUI


    Recording is one of the important features in UiPath Studio, and allows users
    to capture the actions performed on the screen and convert them into sequences;
    this saves a lot of time and effort in automating business processes. To start
    recording, you need to access the **DESIGN (1)** panel and click on **Recording
    (2)**, which will display all the available recording options (3), as shown in
    Figure 10.16:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_312_0.png)


    Figure 10.16 – Different recording options


    There are six types of recordings: **Basic**, **Desktop**, **Web**, **Image**,
    **Native Citrix**, and **Computer Vision**. However, we will be exploring only
    the first three types (Basic, Desktop, and Web), as those are the most commonly
    used options and are more relevant for the RPA Associate certification.


    # Basic


    **Basic** generates a **full selector** for each activity but does not create
    a container for the activities. This is better suited for creating *linear sequences
    within a container* and can be used for recording both web applications and desktop
    applications but is the *slowest* of all recorders.


    Let''s use the same example of the Packtpub web page to read and write data used
    in the previous section, but this time using the **Basic** recording:


    +   1. Create a new sequence and name it `Recordings`.

    +   2. Click on **Recording (1)** and then on **Basic (2)**, as shown in Figure
    10.17:'
  merge: -1
  img_proc: true
