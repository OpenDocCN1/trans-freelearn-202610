- pgno: 21
  md: '# # Part 1: Importance of RPA


    In this part, we will discuss the importance of **Robotic Process Automation (RPA)**
    and

    how we can use it to support the automation journey. The main objective of this
    section

    is to better understand the concepts behind automation and what factors to consider
    to

    identify the best processes for it. This is the most important aspect of any automation

    project. Furthermore, we will also be focusing on understanding the entire ecosystem
    of

    UiPath to get started with deep-dive sessions.


    In this part, we will cover the following chapters:


