- pgno: 365
  md: '# # 12 Exploring UiPath Email Automation


    **Email** is one of the most popular forms of digital communication and is widely
    used

    by individuals and organizations. When it comes to manual and repetitive tasks
    in our

    daily life, activities such as reading emails, performing business processes based
    on email

    inputs, and responding to emails consume most of our time. UiPath offers various
    email

    ways to read emails, filter emails, and respond to emails to help us automate
    repeated

    business processes.


    As part of this chapter, you will become familiar with **email automation**, the
    different

    email automation types, and the different activities that support email automation.

    You will learn how to send and receive emails, respond to emails, attach and download

    document attachments, and use defined message templates for emails.


    This chapter consists of the following sections:


