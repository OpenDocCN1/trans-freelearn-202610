- pgno: 185
  md: '# Exploring decisions and types of decisions


    The decision activities allow you to control the execution of the data flow when
    a decision must be evaluated on a business scenario. Based on that, one of two
    actions must be performed. These two actions form the branches of the decision
    activity and are performed based on the outcome of the decision, which can be
    either True or False. In cases where multiple outcomes are expected, it is recommended
    that the Switch activity is used.


    The If statement activity is used in a sequence, while a flow decision activity
    is used in a flowchart. For example, you can check for a specific value in some
    input text and act based on the outcome of the text. Let''s look at this in more
    detail.


    # Example of an If activity


    In this example, we will create a sequence that asks for an input number and then
    displays whether the given number is even or odd. Let''s get started:


