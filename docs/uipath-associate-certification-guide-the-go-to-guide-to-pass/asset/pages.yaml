    Now we have learned about the different debugging panels available in UiPath Studio
    and

    how to use them to detect and correct bugs in the workflow. Next, let’s look at
    how we can

    perform tests on activities in UiPath Studio.


    # Testing activities


    UiPath Studio allows testing activities while you are in the design phase of process

    automation. Depending upon the scenario within Studio, you can do the testing
    of

    activities in four different ways:


    +   - Test Activity

    +   - Create Test Bench

    +   - Run to this Activity

    +   - Run from this Activity


    Let’s understand each one of them in detail.


    # Test Activity


    Selecting the **Test Activity** option from the context menu on a selected activity
    allows you

    to run a test on that particular activity. Choosing the **Test Activity** option
    will open it in

    debug mode, highlighting the selected activity.


    You can use Test Activity in the following scenarios:


    +   - For adding default values to properties and then testing it

    +   - Using the **Locals** panel to add values for testing the activity'
  merge: -1
  img_proc: true
- pgno: 414
  md: 'Let''s understand more about Test Activity through a use case. Here, we will
    program a Robot that checks whether a number entered by the user is an even or
    odd number:


    +   1. Create a new sequence named **Even_Odd** sequence, and inside it, create
    a variable named **num** of the datatype as **Int32** (note that no default value
    has been assigned to the variable):


    | Name | Variable type | Scope | Default |

    |---|---|---|---|

    | num | Int32 | Even_Odd | Enter a VB expression |


    Figure 13.33 – An integer variable "num" declaration


    +   2. Drag and drop the following three sets of activities inside the Even_Odd
    sequence:


    +   - Input Dialog: Asks the user for a number


    +   - If: Checks whether the number is even or odd and displays the appropriate
    message


    +   - Write Line: Displays the even and odd messages:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_414_0.png)


    Figure 13.34 – The Even Odd sequence'
  merge: -1
  img_proc: true
- pgno: 415
  md: '3. Before running the sequence, we will test the If activity to check whether
    the conditional logic is working correctly. To do so, select the If activity and
    right-click for the context menu. Then, select Test Activity from the context
    menu:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_415_0.png)


