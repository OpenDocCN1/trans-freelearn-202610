- pgno: 65
  md: '# 3 Introducing UiPath Orchestrator


    **UiPath Orchestrator** is a web application and an essential UiPath component
    through which the automation workflows developed in **UiPath Studio** are published,
    assigned to robots, and executed. It enables the management of robots, activity
    packages, data to be processed, execution schedules, and many other assets. Orchestrator
    can manage all types of processes, from simple to complex.


    This chapter focuses on introducing the **UiPath Cloud** platform and Orchestrator.
    Similar to UiPath Studio, UiPath Orchestrator plays a significant role in automation.
    Orchestrator acts as the central control unit for all deployed robots and processes;
    therefore, it is crucial to understand Orchestrator''s use and the key concepts
    used in Orchestrator to manage a virtual workforce.


    This chapter consists of the following sections:


    +   - Introducing the UiPath Automation Cloud platform

    +   - Introducing UiPath Orchestrator

    +   - Understanding the fundamental concepts of UiPath Orchestrator

    +   - Creating your first Orchestrator instance in Automation Cloud

    +   - Connecting a local robot to Orchestrator'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# # Technical requirements


    Before starting with this chapter, please have UiPath Studio and **UiPath Robot**
    installed. This chapter requires a general idea of how to use Studio and **UiPath
    Assistant**.


    Additionally, use the following link to sign up or sign in to the Cloud platform:
    https://cloud.uipath.com/portal_/cloudrpa.


    The features of the Cloud platform are discussed in detail throughout this chapter.


    # # Creating your first cloud Orchestrator instance


    UiPath offers the cloud platform in three versions: Community, Enterprise Trial,
    and Enterprise. In either version, signing up for the cloud platform creates the
    UiPath Orchestrator service automatically. The completed service is visible on
    the **Home** page. However, if the Orchestrator service is not available on the
    Home page, you can easily create it by navigating to the **Admin** page and then
    the **Services** page.


    Follow these steps to create your first Orchestrator service if it is not available:


    +   1. Log in to the Cloud platform via the following link: https://cloud.uipath.com/portal_/cloudrpa.

    +   2. If the Orchestrator service is not available on the **Home** screen, navigate
    to the **Admin** page.

    +   3. Navigate to the **Tenants** page and click on the **Add Tenant** button.

    +   4. Fill in the **Tenant Name** field and make sure the Orchestrator service
    is checked in the service options.

    +   5. Click on the **Save** button.

    +   6. If the Orchestrator service is available, click on **Orchestrator service**
    to navigate to Orchestrator.


    Following these steps helps to create the first Orchestrator service easily. Setting
    up the service is the first step. The UiPath Robot service requires a few configurations
    to connect with the created Orchestrator service.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# # Introducing the UiPath Cloud platform


    The Cloud-based Enterprise platform is provided as a platform as a service to
    all users. The Cloud platform enables users to create and manage all automation
    resources. It allows users to automate instantly without any changes to their
    existing infrastructure, and to quickly scale up. Furthermore, the Cloud platform
    enables easy management of licensing plans by requesting a trial or purchasing
    additional licenses for other services that UiPath offers.


    The following are some of the primary functions of the Cloud platform:


    +   - Managing who can access the Cloud platform and their roles based on the
    task they are required to perform

    +   - Managing licenses by allocating them to Orchestrator instances

    +   - Managing multiple UiPath Orchestrator tenants and services associated with
    each tenant

    +   - Managing the robots and the processes that require execution based on triggering
    schedulers

    +   - Managing other cloud-based solutions offered by UiPath

    +   - Managing logs for auditing purposes


    UiPath manages all the system updates in the Cloud platform, removing the burden
    of system updates from the user. Further, the Cloud platform offers state-of-the-art
    defense mechanisms, proven by many government organizations to ensure data security.
    The Cloud platform is available for Enterprise users as well as Community users.


    Signing in to the Cloud platform provides you with the ability to access the sections
    listed next.'
  merge: -1
  img_proc: true
