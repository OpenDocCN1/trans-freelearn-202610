    from a `List` type to an `Enumerable` type. The `ToList()` function converts the
    combined `Enumerable` list into a `List` data type for further processing:


    ```

    Enumerable.Concat(StudentsList.AsEnumerable,

    EmployeeList.AsEnumerable).ToList

    ```


    By now, we have one `List` variable that we can use for further processing. Further,
    if we look closely at the data values we have in both lists, we can see that the
    name "Daniel" is available in both lists. Once we merge the two lists into `CombinedPeopleList`,
    the new list now contains duplicate entries for "Daniel". The next section of
    the chapter focuses on how to remove duplicate entries.


    # Removing data in lists


    Data removal from a list is made easy by the **Remove From Collection** activity.
    We can use this activity to remove the duplicate entry we have for "Daniel" by
    following these next guidelines:


    +   1. Search for the **Remove From Collection** activity from the **Activities**
    panel and place it below the **Assign** activity.


    +   2. Configure the **Remove From Collection** activity by configuring the `Item`
    property as "Daniel" and configuring the `Collection` property by providing the
    `CombinedPeopleList` variable. This activity removes the first occurrence of the
    name "Daniel" from the list.


    The data is now ready for modification. The next section of the chapter focuses
    on how to convert data in a list to uppercase.


    # Modifying data in lists


    Lists contain multiple data values that we can access using an index. Similarly,
    this functionality also enables the user to loop through data elements while performing
    different actions for each data element.'
