- pgno: 393
  md: '# # 13 Debugging


    Software development projects will rarely be perfect, as various kinds of errors
    can hamper the project execution. **Debugging** is a multistep process that involves
    identifying and removing these errors/bugs from a given project to make it function
    correctly as intended and without errors.


    Just like any other **Integrated Development Environment (IDE)**, UiPath Studio
    offers several options to help you with the debugging process of locating bugs
    quickly, especially in large and complex workflows. It helps you view each activity’s
    execution, verify what data it gets, and check whether there are errors in producing
    output. In addition, it provides a real-time engine that checks for errors while
    working with the workflow.


    In this chapter, you will learn how to use the different debugging actions from
    the **DEBUG** ribbon bar, and how different debugging panels and breakpoints help
    rectify bugs during the debugging process. You will also learn how to test an
    individual activity and create a test bench with activities, and then how to work
    with the **Run from this Activity** option.


    This chapter consists of the following topics:


    +   - Understanding the debugging actions

    +   - Working with the debugging panels

    +   - Testing activities'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# Technical requirements


    Before starting this chapter, please have UiPath Studio and Robot installed.


    Later in the chapter, we will go through a process that causes runtime exceptions
    and fix it with the help of the Debug option in UiPath Studio.


    You can download the process from the GitHub repository: https://github.com/PacktPublishing/UiPath-Associate-Certification-Guide.git.


    # Understanding the debugging actions


    Debugging a single workflow or the entire project can be performed from the DESIGN
    and DEBUG ribbon bars. Clicking on the Debug options from the ribbon bar opens
    up the Debug panel. The following screenshot shows the DEBUG ribbon bar in UiPath
    Studio:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_394_0.png)


    Figure 13.1 – The DEBUG ribbon bar


    The Debug tabs allow the user to perform debugging of a single file or the whole
    project. The ribbon consists of several debugging actions. Let''s understand each
    one of them in detail.


    # Debug File


    Clicking on Debug File will start the debugging process for that particular workflow.


    # Stop


    Clicking on the Stop button ends the debugging process irrespective of which activity
    is executing. The keyboard shortcut for the Stop button is F12.


    # Step Into


    When you want to debug one activity at a time, select the Step Into option from
    the debug ribbon bar. When the Step Into action is triggered, the debugger opens
    and highlights activities in the workflow container, such as the Flowchart or
    Sequence activity. Clicking Step Into once will highlight the activity to be executed.
    Clicking on Step Into one more time will execute the highlighted activity and
    then highlight the next activity.'
  merge: -1
  img_proc: true
- pgno: 395
  md: 'Using **Step Into** with the `Invoke Workflow File` activity opens the workflow
    in a new tab in _read-only_ mode, and each activity inside it is executed one
    at a time.


    The keyboard shortcut for **Step Into** is `F11`.


    > Note

    > Activities such as `Sequence`, `Flowchart`, and `Invoke Workflow File` are referred
    to as **containers**.


    # Step Over


    **Step Over** is the opposite of **Step Into**. It does not open the current container
    and then debug one activity at a time. Instead, it executes the container in one
    go with all the activities present in it. It is useful when you want to skip containers
    with all the activities that are unlikely to trigger any issues during execution.


    Also, when the debugger is inside the container and you hit the **Step Over**
    action, it will jump through all the activities in it one after the other, as
    with **Step Into**, but it will not highlight a particular activity.


    The keyboard shortcut for **Step Over** is `F10`.


    # Step Out


    The **Step Out** action completes the execution of all activities in a current
    container. After the execution of all activities, the control moves out of that
    container and then pauses the debugging. This action is beneficial when you are
    working with nested sequences.


    The keyboard shortcut for **Step Out** is `Shift + F11`.


    # Retry


    While debugging, when an activity has thrown an exception and you want to debug
    this activity again, choose the **Retry** action. **Retry** re-executes the previous
    activity and throws an exception if it is encountered once again during the debugging
    process. The activity that threw the exception is highlighted, and details about
    the error are shown in the **Locals** and **Call Stack** panels (you will learn
    about the **Locals** and **Call Stack** panels in the _Working with the debugging
    panels_ section).'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# # Ignore


    While debugging, you can use the **Ignore** action to skip the current exception
    and resume execution from the next activity in the flow.


    You can continue debugging the remaining set of activities by ignoring or jumping
    over the activities that threw the exception.


    > **Note**

    > The **Retry** and **Ignore** actions are available when an exception is thrown
    and the debugging process goes into a paused state.


    # # Restart


    In the middle of the debugging process, at times, if you want to debug the project
    from the start, choose the **Restart** action. This action restarts the debugging
    process from the first activity of the project.


    # # Break


    The **Break** action is available once the debugging process has started. You
    can pause the debugging process at any moment using the **Break** action. When
    the **Break** action is applied, the activity that is currently being executed
    will be stopped and highlighted in Studio.


    You can choose the **Continue** action to resume the debugging process or the
    **Step Into**, **Step Out**, or **Stop** action, depending upon the situation.


    # # Focus


    Ideally, during the debugging process, execution goes into a paused state when
    an exception occurs or a breakpoint is encountered. The **Focus** action takes
    you back to the breakpoints you mentioned in your flow or the location of an error
    when debugging the flow in a paused state. The **Focus** action is an easy way
    to return to that particular activity and resume the debugging process.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# Slow Step


    The **Slow Step** action can be enabled both before or during the debugging process.
    When enabled, the **Slow Step** action highlights the activity that is executing.
    The **Slow Step** action comes with four different speeds – _1x_, _2x_, _3x_,
    and _4x_.


    Debugging speed changes by one step from 1x to 4x with each click on the **Slow
    Step** button. Thus, debugging with **Slow Step** at 1x runs the slowest and at
    4x the fastest. The speed determines how fast the debugger jumps from one activity
    to the next.


    # Execution Trail


    **Execution Trail** shows the execution path while debugging. By default, the
    **Execution Trail** button is disabled. While each activity is getting executed,
    they are highlighted and marked with a color code, depending upon the execution
    status:


    +   Partially executed activities are marked with a golden yellow clock symbol:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_397_0.png)


    +   Successfully executed activities are marked with a green checkbox symbol:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_397_1.png)


    +   Activities that throw an exception are marked with a red color:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_397_2.png)'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# Highlight Elements


    The UI element of a process is highlighted for each activity during the debugging
    process if the **Highlight Elements** action is enabled. Thus, you can use it
    both with a regular and a step-by-step debugging process – for example, if a `Type
    Into` activity is placed on a text field in a web form, during execution, the
    text field of the web form is first highlighted before the Robot types into that
    text field.


    **Log Activities** helps you determine where issues might be occurring in your
    flow. All the debugged activities are displayed as _trace logs_ in the **Output**
    panel if the **Log Activities** action is enabled. If the log feature is disabled,
    then trace logs are not displayed in the **Output** panel; instead, you only get
    to see the debug start and end time along with any exceptions thrown.


    In addition, if connected to UiPath Orchestrator, logs are automatically sent
    to Orchestrator. If you disable the **Allow Development Logging** option from
    the **Robot Settings** tab in the **Add** or **Edit** user window, you can store
    the logs locally.


    > Note

    > The **Highlight Elements** and **Log Activities** actions can only be enabled
    before debugging and persist when you reopen the automation project next time.


    # Continue on Exception


    When the **Continue on Exception** action is enabled during debugging and an exception
    is thrown, that exception is logged in the **Output** panel, and the execution
    continues with the further activities without stopping the debugging process.


    # Open Logs


    Clicking on the **Open Logs** button opens up the locally stored logs folder.
    The folder path where logs are stored is `%localappdata%\UiPath\Logs`. The naming
    convention of logs is `YYYY-DD-MM_Component.log` – for example, `2021-07-08_Studio.log`.


    In this section, you have learned about the debug action menu of the ribbon bar.
    In the next section of the chapter, you will see the different debugging panels
    available in UiPath Studio.


    # Working with the debugging panels


    Apart from the actions available in the **DEBUG** ribbon bar, UiPath Studio provides
    you with an array of panels that help you in the debugging process.'
  merge: -1
  img_proc: true
- pgno: 399
  md: 'There are five panels available for debugging in UiPath:


    +   1. The Locals panel

    +   2. The Watch panel

    +   3. The Immediate panel

    +   4. The Call Stack panel

    +   5. The Breakpoints panel


    Each panel is marked in the following screenshot. Each number corresponds with
    the position of the panel in the preceding list:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_399_0.png)


    Figure 13.5 – The debug panels


    Once debugging has started, all five panels become visible. But, first, let''s
    look at each panel and understand what purpose they serve.


    # The Locals panel


    The Locals panel window has three properties – Name, Type, and Value. The panel
    shows the following information with their corresponding properties:


    +   - Variables: Displays all the variables within the scope of the executing
    container

    +   - Arguments: Displays all the arguments of the executing workflow

    +   - Activity Properties: Displays the properties of the previously executed
    activity and the current activity'
  merge: -1
  img_proc: true
- pgno: 400
