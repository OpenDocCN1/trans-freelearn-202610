    So, the Replace function is beneficial when you want to remove special characters
    or any unwanted text from a string.


    At this point, you are now familiar with several methods under string manipulation.
    Along with these methods, we sometimes need to search for a location of a string
    and get the position to perform certain actions. The following section describes
    the use of the IndexOf method to perform search operations.


    # IndexOf function


    The IndexOf function returns the index of the first occurrence of a specified
    character in a string. An index in programming always starts at 0. Hence, in an
    actual string, the first letter is the zeroth letter, the second letter is the
    first letter, and so on. It is not just another method; it is one of many overload
    methods in VB.NET that perform several search mechanisms based on different input
    parameters we provide. In general, it uses the following expression to obtain
    the index of a specified character:


    ```

    StrVariable.IndexOf("<search string>")

    ```


    Let''s get the index of the first occurrence of a letter in our previous output
    string, as follows:


    +   1. Open the same workflow file we worked on previously.

    +   2. Place a **Message Box** activity at the end of the workflow.

    +   3. Configure the new **Message Box** activity with the following code:


    ```

    CleansedValue.IndexOf("d").ToString

    ```'
