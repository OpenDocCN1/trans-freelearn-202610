- pgno: 421
  md: '# Run from this Activity


    The Run from this Activity option is the opposite of Run to this Activity. Here,
    you can start running the automation from any particular activity. Let''s take
    the previous example and understand more about Run from this Activity.


    In this scenario, we want the output from the fourth Write Line activity to be
    printed. To do so, right-click on the fourth Write Line activity in the Designer
    panel and click on Run from this Activity from the context menu:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_421_0.png)


    Figure 13.44 – Run from this Activity


    It enters debugging in a paused state, allowing you to change the values of variables
    and arguments from the Locals panel. Then, you can choose the Continue, Step Into,
    Step Over, or Step Out actions from the DEBUG ribbon bar to start the debugging
    process. In our case, values from the last two Write Line activities are printed
    in the Output panel:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_421_1.png)


    Figure 13.45 – The Write Line activities printed in the Output panel


    > Note

    > Using Run from this Activity on an activity added inside the Try Catch, Switch,
    Parallel, Pick, Trigger Scope, or Retry Scope container will result in an error.

    > The debugging is restarted from the previously indicated activity if the Restart
    action from the DEBUG ribbon bar is used after the Run from this Activity action.'
  merge: -1
  img_proc: true
- pgno: 422
  md: 'Testing activities plays a vital role in removing any errors while you are
    still in the building phase. **Test Activity** debugs an activity from the existing
    workflow where you can pass values of the variables or arguments using the **Locals**
    panel. **Create Test Bench** allows you to create a temporary sequence to play
    around with the activities before adding them to the workflow. Finally, **Run
    to this Activity** or **Run from this Activity** allows you to debug to or from
    a particular activity in the workflow. In the next section, you will gain hands-on
    experience in debugging a workflow.


    # Fixing the workflow


    Now that you have learned all about debugging in UiPath Studio, let''s apply the
    skills you have learned so far and debug a workflow to fix a bug.


    Your co-worker was assigned to build a bot for the **Voter Registration** campaign.
    The Robot needs to fetch **First Name**, **Last Name**, **Email**, **Age**, and
    **State** information from an Excel file and insert them in the correct fields
    on the web voter''s registration form.


    The Robot is throwing an error at some point, and your co-worker needs your help
    to make it work. So, let''s apply all the knowledge that we have learned so far
    on debugging and fix this workflow. You can download the code from the GitHub
    repository mentioned in the *Technical requirements* section of this chapter.


    Let''s examine the input data file and the workflow. The **Voters Details.xlsx**
    file contains four columns named **First Name**, **Last Name**, **Email**, **Age**,
    and **State**. In addition, it has multiple rows of data that have to be entered
    into the web form:


    | First Name | Last Name | Email | Age | State |

    | :--- | :--- | :--- | :--- | :--- |

    | Marie | Kenny | marie.kenny@ui.com | 28 | Maharashtra |

    | Lloyd | Wong | lloyd.wong@ri.com | 37 | Karnataka |


    Figure 13.46 – A snippet of the Voters Details.xlsx file'
  merge: -1
  img_proc: true
- pgno: 423
