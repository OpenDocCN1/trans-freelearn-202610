    ```


    The scores on the list are of the String type. We cannot use the String data type
    to perform the calculations. As a result, we need to convert them to numeric data
    types while we perform the calculation.


    5. Create a new variable named TotalScore of type Int32.


    6. Create another variable named AverageScore of type Double.


    7. Drag and drop a For Each activity to allow us to loop through the items in
    the list.


    8. Configure the TypeArgument property of the loop with the String type.


    9. Drag and drop an Assign activity into the body of the For Each loop. We will
    be using the Assign activity to calculate the total of scores by adding up each
    item''s value in the loop.


    10. Configure the To segment of the Assign activity by providing the variable
    name TotalScore.


    11. Configure the Value segment of the Assign activity with the following code.
    There are values with decimals in the list. Decimal values cannot be converted
    directly to Int32. Therefore, for our scenario, we will first convert the string
    to Double and round it off to the nearest integer before converting it to Int32:


    ```

    TotalScore + Convert.ToInt32(Math.Round(Double.Parse(item)))

    ```


    12. Drag and drop a Write Line activity below the For Each activity and configure
    it to write the TotalScore variable value as a string in the Output panel.


    13. Place another Assign activity below the last activity and configure the Value
    segment with the following code, which uses the value in the TotalScore variable
    to generate the average score. We need the number of items in the list to calculate
    the average—the StudentMarks.Count code gives us the number of subjects the student
    completed:


    ```

    TotalScore / StudentMarks.Count

    ```


    14. Configure the To segment of the Assign activity by specifying the AverageScore
    variable. The AverageScore variable will hold the average marks derived from the
    previous calculation.'
