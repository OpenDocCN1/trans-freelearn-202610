- pgno: 58
  md: 'In this example, I have provided Exploring UiPath Interface as the process
    name and Blank Process as the process description. Once we have clicked on Create,
    we will be taken to a new project screen where we will see how we can best use
    the different panels and features for designing our automation workflows.


    # The Designer panel


    The Designer panel is used to design automation projects by dragging and dropping
    activities into it.


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_58_0.png)


    Figure 2.11- The Designer panel


    The Designer panel is the main space for designing or creating an automation project
    that has quick access to the Activities, Properties, Variables, and Arguments
    panels. Activities can be collapsed or expanded for better viewability and the
    panel is highly intuitive as it supports all Microsoft Windows operations, such
    as cut, copy, and paste.


    # The Project panel


    The Project panel is displayed as a tree structure, where the root node is the
    name of the project and the branches contain the dependencies, inputs, settings,
    and project files. You can see the process you just created displayed in Figure
    2.12:'
