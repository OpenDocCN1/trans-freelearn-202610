    # Figure 13.22 – Disable all breakpoints


    Let''s now see how you can parameterize individual breakpoints to meet a particular
    condition for the breakpoint to get executed.


    # Breakpoint Settings


    Individual breakpoints can be further modified by clicking on the gear icon from
    the **Breakpoints** panel. This opens up the **Breakpoint Settings** tab for that
    particular breakpoint:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_408_1.png)


    # Figure 13.23 – The gear icon for Breakpoint Settings'
  merge: -1
  img_proc: true
- pgno: 409
  md: 'The **Breakpoint Settings** tab has four parameters named **Condition**, **Hit
    Count**, **Log Message**, and **Continue execution when logging**:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_409_0.png)


    Figure 13.24 – The Breakpoint Settings tab


    Let''s understand these four parameters in detail:


    +   • **Condition**: Provide a conditional statement for the execution to break.
    If the condition on the breakpoint becomes TRUE, then the debugging is paused,
    and the corresponding activity is highlighted.


    +   • **Hit Count**: This specifies the number of times the condition is met before
    debugging goes into a paused state – for example, a variable `num` default value
    is set as 1. If a breakpoint with the `num Mod 2 = 0` condition is inside a `While`
    activity and **Hit Count** is set as 2, then debugging goes into a paused state
    when the condition is met for the second time:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_409_1.png)


    Figure 13.25 – Hit Count with Condition'
  merge: -1
  img_proc: true
- pgno: 410
  md: 'Note

    The maximum hit count value is 32,767.


    +   - **Log Message:** You can add a `trace_level` log message to the breakpoint
    when the condition is met. You can also add a log message when there is no condition
    provided.

    +   - **Continue execution when logging:** This checkbox is only available if
    the **Log Message** parameter is set. If the checkbox is checked, the execution
    is not paused when the condition is met, and the specified message is logged in
    the **Output** panel:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_410_0.png)


    Figure 13.26 – Breakpoint Settings with all the parameters initialized


    A breakpoint on an activity can be categorized in four ways, depending upon the
    parameter(s) applied in the **Breakpoint Settings** tab. The four categories are
    as follows:


    +   - Standard breakpoints

    +   - Conditional breakpoints

    +   - Tracepoints

    +   - Conditional tracepoints


    Let''s understand each one of them in detail.


    # Standard breakpoints


    A standard breakpoint is one where no **Condition**, **Hit Count**, and **Log
    Message** parameters are added in the **Breakpoint Setting** tab.'
  merge: -1
