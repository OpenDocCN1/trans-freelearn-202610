- pgno: 403
  md: '# The Immediate panel


    The **Immediate** panel can be used for checking the data/output of a variable,
    arguments, or statements at a given point during the debugging process:


    ```

    Immediate

    > firstName.Contains("Jane")

    < true

    > firstName.ToUpper

    < "JANE"

    > companyName.GetType

    < [System.String]

    >

    ```


    Figure 13.12 – The Immediate panel


    To get the output, type the variable or argument name in the **Immediate** window
    and press *Enter*. The output doesn''t get updated during the debugging process;
    rather, it keeps the history of previously evaluated statements.


    Using the context menu, you can copy the previously evaluated expression or use
    the **Clear All** option to clear all lines in the panel. Using *Ctrl + spacebar*
    opens up IntelliPrompt, which helps to select the desired functions or properties
    associated with the variable or argument:


    ```

    Immediate

    > firstName.Contains("Jane")

    < true

    > firstName.ToUpper

    < "JANE"

    > companyName.GetType

    < [System.String]

    CompareTo

    Concat(Of ...)

    Contains

    Contains(Of ...)

    ContainsUnmatchedParentheses

    CopyTo

    Count(Of ...)

    >

    companyName.co

    ```


    Figure 13.13 – IntelliPrompt using Ctrl + spacebar'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# # The Call Stack panel


    While debugging is in a paused state, the **Call Stack** panel displays the activity
    to be executed along with its parent containers:


    | Activity Name | Activity Type | File Path |

    | :--- | :--- | :--- |

    | Type Into ''INPUT'' | TypeIntoFactory | Main.xaml |

    | Body | Sequence | Main.xaml |

    | For Each Row | ForEachRow | Main.xaml |

    | Do | Sequence | Main.xaml |

    | Open Browser | OpenBrowserFactory | Main.xaml |

    | Sequence | Sequence | Main.xaml |


    Figure 13.14 – The Call Stack panel


    The **Call Stack** panel gets populated in the following two scenarios:


    +   * When **Step Into**, **Break**, and **Slow Step** are used

    +   * If the execution goes into a paused state because an error or a breakpoint
    was encountered


    Double-clicking on an activity name in the **Call Stack** panel highlights the
    activity in the **Designer** panel. Also, when an activity throws an exception
    during debugging, it is marked in the **Call Stack** panel, and that particular
    activity is highlighted in red.


    # # The Breakpoints panel


    Before we start with the **Breakpoints** panel, let''s understand what **breakpoints**
    are. As with any other IDE, UiPath Studio supports breakpoints. They are used
    to intentionally pause the debugging process on an activity that may trigger execution
    issues. A breakpoint can also be used to monitor the value of variables or arguments
    at that point and also take control of execution by using the **Step Into**, **Step
    Over**, and **Step Out** actions.


    Let''s now see how can you add, remove, or delete a breakpoint in UiPath Studio.
    We need to know how to add a breakpoint first, as the **Breakpoint Settings**
    tab is only available after that point.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# # How to place a breakpoint


    You can add a breakpoint on an activity in the following three ways:


    +   - Right-click on the particular activity for which you want the breakpoint
    and click on Toggle Breakpoint from the context menu:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_405_0.png)


    Figure 13.15 – Applying a breakpoint from the context menu


    +   - Clicking on Toggle Breakpoint will apply the breakpoint to that particular
    activity, and it will be marked with a red disk at the top left of the activity.
    Breakpoints are always marked with a red disk:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_405_1.png)


    Figure 13.16 – A breakpoint applied to the Write Line activity


    +   - Select an activity and click the Breakpoints action from the DEBUG ribbon
    bar:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_405_2.png)


    Figure 13.17 – Click on the Breakpoints button to apply a breakpoint


    +   - Select the desired activity and press the F9 key on your keyboard.


    You can use any of these methods to apply breakpoints, depending on your preferences.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# How to disable a breakpoint


    Disabling a breakpoint will not pause the debugging process on a particular activity.
    The disabled breakpoint is marked with a red circle at the top left of the activity:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_406_0.png)


    Figure 13.18 – A disabled breakpoint on the Write Line activity


    You can disable a breakpoint using any one of the three ways used to create a
    breakpoint. So, you can either select the breakpoint activity and then click on
    **Toggle Breakpoint** from the context menu, click on the **Breakpoints** button
    from the **DEBUG** panel, or press the F9 key from your keyboard to disable the
    breakpoint.


    # How to delete a breakpoint


    You can delete a disabled breakpoint by repeating any one of the three steps used
    to create and disable a breakpoint. Either select the breakpoint activity and
    then click on **Toggle Breakpoint** from the context menu, click on the **Breakpoints**
    button from the **DEBUG** panel, or press the F9 key from your keyboard to delete
    the breakpoint.


    Now that we have learned how to add, disable, and delete breakpoints on an activity,
    let’s see where we can see all the breakpoints of a particular process together.


    # The Breakpoints panel


    The **Breakpoints** panel displays all the breakpoints in the current project,
    along with the workflow name in which they are contained:


    | Activity Name | File Path | Condition | Log Mess... |

    |---|---|---|---|

    | Type Into ''First Name'' | Main.xaml | | |

    | Assign ''last name'' | Main.xaml | lastName... | |

    | Assign ''company name'' | Main.xaml | | "The comp... |

    | Assign ''role in company'' | Main.xaml | companyN... | "Company... |

    | Write Line | Breakpoint_Ex.xaml | | |


    Figure 13.19 – The Breakpoints panel'
  merge: -1
  img_proc: true
- pgno: 407
