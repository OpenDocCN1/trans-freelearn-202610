    | DelayMS | InArgument<int32> | ... |

    | DelayBefore | InArgument<int32> | ... |

    | DelayBetweenKeys | InArgument<int32> | ... |


    Figure 13.6 - The Locals panel


    All the Arguments, Properties, and Variables categories can be compressed or expanded
    in the Locals panel.


    When debugging is in a paused state, clicking on the pencil icon button under
    the Value property allows you to modify the variables'' and arguments'' values:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_400_0.png)


    Figure 13.7 - The firstName variable value changed to Micheal from Jane by clicking
    on the pencil icon'
  merge: -1
