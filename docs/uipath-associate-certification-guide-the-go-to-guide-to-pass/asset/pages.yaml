- pgno: 249
  md: '![](img/84b06ad2832c53c5f677f8ce4c80f184_249_0.png)


    Figure 8.8 – Revalidate the selector


    +   2. **Indicate Element**


    This is used to select the new UI targets or to *overwrite* the previously selected
    targets on the screen.


    +   3. **Repair**


    This button is enabled when the selector is *invalid* and is used to *repair the
    existing selector* by indicating the same target UI element on the screen.


    +   4. **Highlight**


    This button is used to *ensure* that the modified selector is still *valid* for
    the target element. Once clicked, the target element will be highlighted on the
    screen.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '+   5. Edit Attributes


    This option lists all the target element attribute''s tag names and attribute
    values.


    +   6. Edit Selector


    This box contains the XML fragment that provides the tag names and attribute values
    of the target element. These can be edited to help fine-tune the selector.


    +   7. Open in UI Explorer


    This is a separate tool that can be used to refine the selector options and is
    only displayed for valid selectors.


    In this section, we looked at the various options within the Selector Editor and
    how to manipulate selectors and attributes using the basic options provided. For
    more advanced editing options, we can look at UI Explorer.


    # UI Explorer


    UI Explorer is used to analyze and edit selectors, particularly when the existing
    selectors are not stable enough for automation. "Not stable enough" means that
    the properties of the selectors of the target application keep changing on every
    execution. UI Explorer has several options to overcome these challenges by fine-tuning
    the properties of the selector to make it more reliable. Let''s explore these
    options one by one. Click on Open in UI Explorer, as shown in Figure 8.5, to open
    UI Explorer, as follows:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_250_0.png)


    Figure 8.9 – UI Explorer'
  merge: -1
  img_proc: true
- pgno: 251
  md: "Let's look at the available options in more detail:\n\n+   1. **Validate**\n\
    +   \n+   Click on this button if you want to *verify* the validity of your Selector.\
    \ The target element must be on the screen before you click this button.\n\n+\
    \   2. **Indicate Element**\n+   \n+   Click on this option to *select* the target\
    \ element and generate the selector with all the necessary properties.\n\n+  \
    \ 3. **Indicate Anchor**\n+   \n+   This option is used to *identify* the target\
    \ element by using the relative elements surrounding the target element.\n\n+\
    \   4. **Repair**\n+   \n+   This button is enabled when the selector is invalid\
    \ and is used to *repair* the existing selector by indicating the same target\
    \ UI element on the screen.\n\n+   5. **Highlight**\n+   \n+   This option is\
    \ used to *highlight* the target on the screen for the current selector to ensure\
    \ it is working.\n\n+   6. **UI Frameworks**\n+   \n+   The **Framework settings**\
    \ options are *changed* based on the application being used. There are three types\
    \ of frameworks:\n+   \n+   * **Default**\n+   \n+     This specifies the **default\
    \ settings**, which typically work with all types of user interfaces.\n+   \n\
    +   * **Active Accessibility**\n+   \n+     This option is used for **legacy applications**\
    \ such as mainframes or if the Default option did not work as expected.\n+   \n\
    +   * **UI Automation**\n+   \n+     This is used for **any new applications**\
    \ or if the other two types did not work as expected."
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 7. Visual Tree


    This section gives you the option to *explore the elements* of the target user
    interface in a **folders and subfolders** tree structure. To make the analysis
    more effective, a **Highlight** option is provided so that you can examine the
    UI elements from the tree.


    # 8. Property Explorer


    This section gives the option to *explore* the available properties of the target
    application.


    # 9. Edit Selector


    This section contains the **XML fragment** that has the **tag names** and **attribute
    values** of the target element. These can be *edited* to fine-tune the selector.


    # 10. Edit Attributes


    This section is used to *edit* the attributes of the selected items in the **node**.


    # 11. Select Unselect Attributes


    This section *displays* the list of selected and unselected attributes of the
    selector. This gives us the option to analyze the selector by selecting and unselecting
    attributes.


    In this section, we explored the different options that are available within **UI
    Explorer** to enhance the selector so that it can handle dynamic target elements.
    In the next section, we''ll compare the different selector types and how they
    can be applied in different scenarios.


    # Types of selectors


    The selector types depend on the type of recorders or activities that are being
    used inside the UiPath workflows. There are two types:


    +   - Partial selectors

    +   - Full selectors


    Let''s look at them in more detail.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Partial selectors


    Partial selectors are generated when you use the Desktop Recorder. It does not
    contain information about the top-level window. Partial selectors are enclosed
    inside a container. While we’re on the same application screen and interacting
    with multiple elements, it is a good option to use partial selectors. With partial
    selectors, the top element (which is grayed out) is inherited from the parent.
    Let’s look at an example where an Attach Window activity is being used in a Notepad
    application and the selector of the Click activity looks as follows, where the
    first line can’t be edited:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_253_0.png)


    Figure 8.10 – Partial selector


    If you want to edit the attributes of the top-level window, you may need to take
    a different recording approach known as full selectors, which we will look at
    in the next section.


    # Full selectors


    Full selectors are generated when we are using the Basic Recorder. Full selectors
    contain all the necessary nodes, including the top-level window. This contains
    the application node and the final node, which are required to identify the UI
    element.


    Full selectors should be used when you’re switching between multiple windows or
    activities.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'For example, when you''re switching between multiple applications for data
    such as Notepad, Word, or Excel, you should use full selectors:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_254_0.png)


    # Figure 8.11 – Full selector


    The following table shows the differences between partial selectors and full selectors:


    | Partial Selector | Full Selector |

    | :--- | :--- |

    | Generated by the Desktop Recorder. | Generated by the Basic Recorder. |

    | Does not contain top-level elements. | Contains top-level elements. |

    | Used when switching between multiple windows. | Used when staying inside the
    same window. |

    | Enclosed inside containers. | Containers are not needed. |

    | All attributes are editable. | Only elements related to partial selectors can
    be edited. |


    # Figure 8.12 – Comparison of partial selectors and full selectors'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'In this section, we looked at the differences between partial selectors and
    full selectors.

    In the next section, we will learn about dynamic selectors and see how they can
    be

    implemented by looking at a real-life example.


    # Dynamic selectors


    Before we begin discussing dynamic selectors, let''s look at static selectors.
    **Static selectors**

    are used to indicate an element in the user interface that does not change its
    properties

    or that the element is stable enough. So, we do not need to change the properties
    in

    the **Selector Editor** window, such as the tags and attributes of the selector.
    A **dynamic

    selector** is used to easily identify the target element, which changes its selector
    properties

    more frequently at runtime. A dynamic selector is created using a **variable**
    or **argument**

    instead of the static attributes in the selector tags. Instead of hardcoding the
    values of the

    target element, the attribute values can be represented using a variable or an
    argument to

    handle the target dynamically. The syntax of the dynamic selector is shown here:


    ```

    <tag attribute = ''{{Value}}'' />

    ```


    Figure 8.13 – Syntax of the dynamic selector


    Dynamic selectors can be **analyzed** and **modified** inside the **Edit Selector**
    window. This

    window displays all the basic options, such as **Edit Attributes** and **Edit
    Selector**, so that

    you can dynamically modify the selector. However, for more advanced options, such
    as

    **Visual Tree**, **Property Explorer**, and **Selected Items**, you can use **UI
    Explorer** to easily

    identify the dynamic properties.


    The following table shows the differences between static selectors and dynamic
    selectors:


    | Static Selector | Dynamic Selector |

    |---|---|

    | Used to identify elements that are highly stable by having standard properties.


    You can hardcode the Property values inside the Edit selector window.


    Uses tags and attributes to identify the target element.


    Indicates the target element for any required changes. | Used to identify elements
    that are unstable by changing their properties frequently.


    You can parameterize the Property values using variables or arguments inside the
    Edit selector window.


    Uses tags, attributes, variables, and arguments to identify the target element.


    Indicates the target element and makes the necessary changes to the value of the
    variable or argument. |


    Figure 8.14 – Comparison of static selectors and dynamic selectors'
  merge: -1
  img_proc: true
- pgno: 256
