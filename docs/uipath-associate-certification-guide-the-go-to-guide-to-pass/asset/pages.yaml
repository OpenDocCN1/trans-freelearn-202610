    Figure 8.5 – Selector Editor'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'The various options are as follows:


    +   1. **Validate**


    The **Validate** button displays the *status of the selector* based on the availability
    of the target UI element that''s displayed on the screen. It has three different
    states:


    +   I. **A green Validate button with a tick** (as shown in the following screenshot)
    indicates that the target element is *valid* and can be executed:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_247_0.png)


    Figure 8.6 – Valid selector'
  merge: -1
  img_proc: true
- pgno: 248
  md: '+   II. A red Validate button with a cross indicates that the target element
    is invalid and cannot be executed:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_248_0.png)


    Figure 8.7 – Invalid selector


    +   III. A yellow Validate button with a question mark indicates that the selector
    that corresponds to the target element has been modified and needs to be revalidated
    to correct its status:'
  merge: -1
