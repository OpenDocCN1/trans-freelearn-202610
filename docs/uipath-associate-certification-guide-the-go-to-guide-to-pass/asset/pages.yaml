- pgno: 46
  md: 'You should have a fair understanding of hyperautomation and the stages of an
    RPA journey from the previous chapter. Now, let''s explore a little further to
    see what tools and technologies are used in each stage to implement hyperautomation.


    # Discover


    The Discover phase covers the process of understanding, identifying, and defining
    the requirements for the Automation process by engaging multiple stakeholders
    within the organization, such as business users, **Centre of Excellence (CoE)**
    leaders, and RPA developers. The different tools used in this phase are **Automation
    Hub**, **Task Capture**, **Process Mining**, and **Task Mining**; let''s discuss
    each of these in more detail:


    +   - **Automation Hub**: The main idea of this tool is to encourage any employees
    in the organization to contribute Automation ideas using a simple submission process
    so that the idea can be converted into a working solution by engaging relevant
    stakeholders. This tool has several features, such as exporting the process as
    XAML or PDD files, taking screenshots of the process, and checking the ROI forecast.


    +   - **Task Capture**: UiPath Task Capture is used to understand more about the
    daily automation processes directly by gathering detailed information from employees.
    Once the potential automation candidate is identified, your **Subject Matter Experts
    (SMEs)** can provide their expertise about the particular task and help to achieve
    your RPA goals.


    +   - **Process Mining**: Process Mining is a process analysis tool that offers
    solutions to the operational and procedural challenges experienced by organizations.
    It improves business and customer engagement by implementing a fact-based technique
    in order to clearly differentiate between useful processes and time-consuming
    processes, which shows the internal functionality of processes in a pictorial
    representation.


    +   - **Task Mining**: UiPath Task Mining is an automation opportunity discovery
    tool that collects information, such as desktop data comprising of screenshot
    and log data (for example, mouse clicks and keystrokes), and then runs a **Machine
    Learning (ML)** model to analyze the data and suggest a list of processes with
    high automation potential that benefits different stakeholders in many possible
    ways.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Build


    With the UiPath platform, everyone should be able to build automations, no matter
    their prior coding skills. The UiPath automation building tool comes in three
    types:


    +   - **StudioX** (for citizen developers): UiPath StudioX is a complete solution
    for automating business applications. It aims to enable every business user to
    automate repetitive tasks by offering seamless integration with Microsoft Office
    applications and has an intuitive user interface that makes it easy to create
    automations. As a business user, you can create step-by-step graphical representations
    of your projects by dragging the corresponding activities to the designer panel.
    This can be further reviewed with the RPA stakeholders for analysis and development.


    +   - **Studio** (for RPA developers): UiPath Studio is a professional development
    tool that addresses the creation of complex business processes. It enables team
    collaboration while enforcing standards, reducing errors, and cutting down on
    development times. UiPath Studio is ideal for developers with a programming background
    who are looking to create complex automation projects.


    +   - **Studio Pro** (for specialized developers): In addition to all the capabilities
    of Studio, UiPath Studio Pro offers access to advanced features such as Test Automation,
    Application Testing, RPA Testing, API Testing, and Mobile Automation. In short,
    it is a superset of UiPath Studio with direct integration with UiPath Test Manager
    and specific capabilities for software test automation.


    There is a single installer for all three products. Once you download and run
    the installation steps, you can select the profile that best suits you. Switching
    between profiles is allowed at any time from the **Settings** panel.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# # Manage


    Once you have built a robot, it has to be efficiently managed so that it does
    not create any issues later in deployment or in production. The Manage phase is
    a centralized location to control all other automation resources. The Manage phase
    uses different tools for you to start from scratch and work up to production deployment
    in a minimal number of days.

    This can also be deployed in scenarios involving short and repetitive processes
    and fewer robots. Let’s look at the tools one by one:


    +   • **Orchestrator**: UiPath Orchestrator helps control robots remotely to perform

    +   single or multiple executions of business processes. It supports the management

    +   of various resources, such as Assets, Queues, and Triggers, and helps manage

    +   the robots and their environments. This can also be seamlessly integrated
    with

    +   third-party applications and solutions to perform continuous executions on

    +   multiple environments.


    +   • **AI Fabric**: UiPath AI Fabric is used to integrate ML with RPA. The ML
    models

    +   developed for business processes can be imported to UiPath using AI Fabric
    for the

    +   robots to execute business processes. The ML models are built externally to
    UiPath

    +   using third-party applications, such as Python and AutoML, and then integrated

    +   with RPA using AI Fabric.


    +   • **Test Suite**: UiPath Test Suite is a tightly integrated bundle of tools
    that consolidates

    +   the testing process through integrations with your test management and **Application

    +   Lifecycle Management (ALM)** tools. UiPath Test Suite consists of combinations
    of

    +   tools, such as Studio Pro, Orchestrator, Test Manager Hub, and Test Manager.


    +   • **Data Service**: UiPath Data Service is a persistent data storage service
    bringing more

    +   advanced data modeling and powerful data storage features to your RPA projects.

    +   This central place is built to securely store and manage your business data
    within

    +   UiPath, and it is integrated with UiPath Studio and UiPath Robots, allowing
    you to

    +   build automations that can leverage capabilities such as rich relational data
    types,

    +   integrated security, and instantaneous provisioning and deployments, while
    taking

    +   scale into account.


    +   • **Insights**: Insights provides a reporting platform in UiPath Orchestrator
    using the

    +   existing metrics and operational data in executing businesses processes. Using

    +   custom-designed dashboards to visualize company data across desired metrics,
    it

    +   enables you to discover new analytical insights and track performance indicators,

    +   and it can alert you to errors and irregularities.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Run


    There are two types of robot development – separating the capabilities of the
    attended and unattended robot and adding integrations to make robots part of your
    work without too much struggle. Let’s briefly look at both:


    +   Attended robots: These robots work together with human users to execute business
    processes. These are typical RPA candidates that do most of the repetitive and
    boring work, which the robot will take care of executing. Human intervention is
    still essential in these kinds of executions, mainly to enter credentials or authorize
    transactions during the business process execution.


    +   Unattended robots: These robots perform complex, repetitive tasks that are
    carried out in batches. They are also used in cases where human intervention is
    not required and few sensitive processes (such as signature verification and invoice
    approvals) are involved during execution.


    # Engage


    In the Engage phase, people and robots work together to achieve common automation
    goals. There are certain actions the robots are not allowed to perform, such as
    approving an invoice or verifying signatures, which robots are entirely dependent
    on humans to complete. Similarly, people depend on robots to perform all repeated,
    manual, and boring tasks. In the Engage phase, we have different tools to achieve
    automation goals as follows:


    +   Apps: UiPath Apps is a cloud-based, low-code application development platform
    that enables you to build and share enterprise-grade custom applications that
    deliver engaging user experiences. Using UiPath Apps, you can quickly build custom
    business applications that connect to data in any underlying cloud or on-premises
    system using the power of automation.


    +   Action Center: UiPath Action Center offers a way for business users to handle
    actionable items and provide business inputs to robots. It enables support for
    long-running unattended workflows that require human intervention, as workflow
    execution is split into multiple manageable workflows and can be executed later
    based on the inputs from human users. For example, if signature verification is
    required to perform an approval process, the robot notifies the human approver
    and performs the approval process based on the input from the human.


    +   Assistant: UiPath Assistant is the center of all your attended automation
    needs. It is an application that allows you to view, manage, and set reminders
    for processes. As a client of the service, it can request to start or stop jobs
    and change settings based on user input.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'In this section, we discussed the hyperautomation platform/life cycle of RPA.
    We also discussed different tools used in various stages of the RPA Enterprise
    platform. Although we have encountered several tools, UiPath Studio in the Build
    phase is our primary focus for the Associate Certification, and you will be learning
    about how to install and use UiPath Studio in the upcoming sections.


    # Setting up UiPath Studio


    The best way to explore the UiPath Studio components is to start using them for
    your daily automation requirements. In this book, you will have lots of opportunities
    to learn and practice, so let''s start by installing UiPath Studio.


    # Exploring the different editions


    First, let''s take a brief look at the different editions of UiPath:


    +   Community Edition: The Community Edition is always free and comes with two
    Studios, three Robots, and a cloud-hosted Orchestrator for designing automation.
    Users have access to UiPath Forum support and UiPath Academy courses.


    +   Enterprise Server Edition: This UiPath Studio version is mainly targeted at
    on-premises enterprise deployments for large businesses. It can have unlimited
    Studios, an on-premises Orchestrator, and unlimited Robots for designing automation.
    It offers premium support from the UiPath technical support team in case of any
    issues and provides access to specialized training from UiPath official training
    partners.


    +   Enterprise Cloud Edition: The UiPath Enterprise Cloud Edition accommodates
    the automation needs of both Community- and Enterprise-level users by maintaining
    the infrastructure in the cloud. It offers instant access to all tools and services
    required over the cloud to build automation processes and supports the unlimited
    scaling of automation resources for complete enterprise-level capacity. This edition
    is highly secure and compliant and provides access to centralized user access
    management. Additionally, this edition offers premium support from the UiPath
    technical support team in case of any issues and provides access to specialized
    training from UiPath official training partners.


    Although there are three different UiPath Studio editions available, the one best
    suited to this book is the UiPath Community Edition.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Installing UiPath Studio


    In this section, we are going to see how we can install UiPath Studio from scratch.

    You may come across two types of installers: UiPath.Studio.msi and

    UiPathStudioSetup.exe. UiPath.Studio.msi installs the Enterprise version, or

    Enterprise Trial version, of the UiPath platform. This supports all users logged
    in on the

    machine, offers command-line support and customizable installation, and requires
    Admin

    privileges to install Studio. UiPathStudioSetup.exe installs the Community Edition
    of

    UiPath Studio and is available for only the user who performs the installation
    and does

    not have command-line support or customizable installation and does not require
    admin

    privileges to install Studio. Follow these step-by-step instructions to download
    and install

