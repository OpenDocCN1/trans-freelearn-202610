    ![](img/84b06ad2832c53c5f677f8ce4c80f184_420_0.png)


    Figure 13.42 – Run to this Activity


    This starts the debugging process, prints the value in the Output panel, and pauses
    before the third Write Line activity is executed while highlighting it in the
