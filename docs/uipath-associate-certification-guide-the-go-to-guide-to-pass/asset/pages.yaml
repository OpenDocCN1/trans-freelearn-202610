    The practice steps you followed in this section give you a good understanding
    of the different ways of creating a variable and how a variable''s scope affects
    the workflow. The knowledge gained on variables will come in handy when we explore
    arguments. Arguments are quite similar to variables, but they have different properties.
    However, they use the same concept as variables, with slight differences.


    # Exploring arguments


    In UiPath, the goal of a variable is to store data within the specified scope
    and pass it on to other variables or activities as required. A real-world automation
    project includes more than one workflow, hence the use of variables is not enough
    to connect the workflows. Arguments in UiPath come into play to fill this gap
    by acting as a container that allows the transfer of data between multiple workflows.
    Arguments are very similar to workflows as they store data dynamically based on
    their defined data types. However, the difference is that arguments have a Direction
    property that describes how the data is transferred between workflows. Further,
    the use of arguments enables users to reuse automation workflows in multiple projects.


    Let''s take a look at the properties of arguments.


    # Properties of an argument


    Let''s take a look at the properties of an argument, as follows:


    +   • Name: Similar to variables, this property indicates the name of the argument.
    To differentiate between variables and arguments, we use the direction of the
    argument as a prefix for the name as a best practice (for example, In_UserName;
    Out_CustomerData; IO_AccountData).


    +   • Data Type: Specifies the type of data the argument holds.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   • Direction: Specifies the direction from/to which the data is passed.
    There are three directions in UiPath, as shown in the following screenshot:


    | Direction | Description |

    | :--- | :--- |

    | In | Argument can only be used within the given workflow as the data is passed
    into the workflow |

    | Out | Argument can be used to pass data outside the given workflow |

    | In/Out | Argument can be used for both receiving and sending data out |


    Figure 5.14 – Argument directions


    +   • Default: The default value the argument holds. However, this property is
    disabled for arguments with the Direction type defined as Out or In/Out.


    As we now know the properties of an argument, let''s take a look at the different
    approaches we can take to create arguments.


    # # Creating arguments in UiPath


    Arguments are created when you want to pass data between multiple workflows. Argument
    creation is similar to variable creation, described in the Practicing variable
    creation section. The following methods are used to create arguments:


    +   • Through the Arguments panel: Clicking on the Create Argument option on the
    Arguments panel allows for the easy creation of arguments by configuring the properties
    discussed previously. The following screenshot illustrates this option:


    | Name | Direction | Argument type | Default value |

    |---|---|---|---|

    | In CustomerName | In | String | Enter a VB expression |

    Create Argument


    Figure 5.15 – Arguments panel in UiPath Studio'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Clicking on the **Create Argument** option creates a new row in the panel to
