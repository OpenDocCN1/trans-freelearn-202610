    first occurrence of the letter "d" is in the word "Good". It is the fourth letter
    in the string; hence, in a zero-based string, the index of the letter is "3",
    which is similar to the output we got.


    Apart from what we discussed, there are several overload methods that return the
    index of a string. We will not get into the detail of each and every method; however,
    we need to know the basics. Some overload methods are listed here:


    +   - `IndexOf(String, Int32, Int32, StringComparison)`: Provides the index of
    the first occurrence of a specified string in the current string. The parameters
    specify the starting search position in the current string, the number of characters
    in the current string to search, and the type of search to use for the specified
    string.

    +   - `IndexOf(String, Int32, StringComparison)`: Provides the index of the first
    occurrence of a specified string in the current string. The parameters specify
    the starting search position in the current string, along with the type of search
    to use for the string.

    +   - `IndexOf(Char, Int32, Int32)`: Provides the index for the first occurrence
    of a specified character. The parameters specify the starting search position
    and the number of characters to search in the current string.

    +   - `IndexOf(String, StringComparison)`: Provides the index of the first occurrence
    of a specified string in the current string. The parameters specify the type of
    search to use for the specified string.

    +   - `IndexOf(String, Int32, Int32)`: Provides the index of the first occurrence
    of a specified string. The parameters define the search position in the current
    string and the number of characters to search.

    +   - `IndexOf(Char)`: Provides the index of the first occurrence of a specified
    Unicode character in the current string.


    As we tried one type out of the different overload methods, you can also try out
    some of the other types mentioned to get more practice on obtaining the index
    of a given string.


    Let''s now apply the knowledge gained on indexes and try out another method for
    string manipulation.'
