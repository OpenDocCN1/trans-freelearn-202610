    # # Understanding numeric calculations


    Numeric data types come in handy while performing different simple-to-complex
    calculations. We can perform many calculations using numeric values, such as summing
    up, calculating averages, finding minimum and maximum values, and so on. Performing
    numeric calculations in UiPath is pretty easy. Let''s try a straightforward example.


    Create a `List` variable that holds the marks a student obtained during the last
    semester for all five subjects. Our task is to calculate the total and the average
    of the marks. Proceed as follows:


    +   1. Open UiPath Studio and create a new **Blank Process** activity.

    +   2. Double-click on the `Main.xaml` file to open the file in the **Designer**
