  md: 'We can also look at another function that is similar to String.Concat. The
    String.Format function, however, provides the ability to change values at designated
    locations in a defined string. The next section explains this concept in detail.


    # Format function


    The Format function is similar to the Concat function. However, the Format function
    can convert objects into strings and insert them into another string at specified
    locations. The Format function also allows the combining of any number of strings
    into one string variable. The Format function uses specific identifiers (IDs)
    to locate where to insert new text in the primary string. Such IDs are referred
    to as {0}, {1}, and {2}, in which the numeric values describe the order of merging
    text.


    Let’s take a look at how we can apply the Format function through a simple example,
    as follows:


    +   1. Let’s continue to work on the same workflow we built previously. Drag and
    drop an Assign activity below the If activity.

    +   2. Create a new string variable named ConcatenatedText and specify it in the
    To segment of the Assign activity.


    +   3. Use the following code in the Value segment of the Assign activity to assign
    it a value. This function assigns the concatenated value to another string variable
    for us to further process the output:


    ```

    String.Concat(DisplayText, FirstName, LastName)

    ```


    +   4. Drag and drop another Assign activity below the previous activity.


    +   5. Configure the To segment of the Assign activity by creating a new string
    variable named FormatString and assign it the following string:


    ```

    "Good day... Let me introduce myself. {0} and I am {1} years old. I''m currently
    based in {2}"

    ```


    +   6. Use another Assign activity and place it below the previous activity.

    +   7. Create a new string variable named DisplayResult and configure the To segment
    of the Assign activity with the variable name.


    +   8. Configure the Value segment of the same Assign activity using the following
    code. The following code uses the String.Format function to fill in the text portions
    for {0}, {1}, and {2} indicators:


    ```

    String.Format(FormatString, ConcatenatedText, "29", "Sri Lanka")

    ```'
