    This section focused on learning how to split a string by providing the split
    character. This function comes in handy when you want to extract specific text
    elements from a given string. Further, we also learned that the elements in the
    split array can be accessed through a zero-based index. Having said that, let’s
    now look at how we can merge data in collection variables—such as arrays—into
    one string.


    # Join function


    The `Join` function combines all the elements in a string array into one string
    by introducing a character as a separator between each element. For example, if
    the array consists of two elements such as "Hello" and "World", the separator
    introduced in the `Join` function is included in the output string to indicate
    which position it was split originally. Hence, in our example here, if we introduce
    " | " as the separator, the `Join` function returns "Hello|World" as the output.
    The expression used for the `Join` function is shown here:


    ```

    String.Join("<separator>", <Collection Variable>)

    ```'
