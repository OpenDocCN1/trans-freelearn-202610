    # # Exploring loops and types of loops


    **Loops** are used to execute a given statement on repetitions based on a specific
    condition in an automation process. They are mainly used to automate repetitive
    automation tasks. The key loops in UiPath are **Do While**, **While**, and **For
    Each**. Let''s explore these in turn.'
