- pgno: 203
  md: '# # 7 Manipulating Data Using UiPath


    Today, every software application, business process, or human deals with data.
    Data is the most critical resource in every organization and it''s available to
    us in many different forms. We need to modify, structure, format, or sort data
    to convert it into meaningful information in a business process.


    This chapter focuses on introducing different methods of manipulating data based
    on various data types. Data used in a business process undergoes many transformational
    steps before it''s ready for consumption at various stages of the process, hence
    it is crucial to understand how to perform such manipulations.


    This chapter consists of the following sections:


    +   - Explaining the concept of data manipulation

    +   - Understanding string manipulation

    +   - Understanding date and time manipulation

    +   - Understanding list manipulation

    +   - Understanding numeric calculations

    +   - Understanding dictionary manipulation

    +   - Understanding pattern-based data extraction using regular expressions (regexes)'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# # Technical requirements


    As a prerequisite, please have UiPath Studio and UiPath Robot installed and connected
    with Orchestrator. Furthermore, it is essential to understand the different data
    types, control flows, and UiPath Studio features before starting this chapter.


    # # Explaining the concept of data manipulation


    Data manipulation is a process that alters data through various operations to
    convert it into a usable format. It is a vital function for business operations
    and management as it provides many benefits, such as the following:


    +   - Converts data into a more consistent format to improve reliability, readability,
    and organization

    +   - Enables customization and generation of more meaningful data according to
    business requirements

    +   - Removes unwanted data to ensure only the required information is processed


    Data manipulation operations consist of four primary functions, as outlined here:


    +   - Extracting data by specifying extraction conditions such as filtering, summarizing,
    and so on

    +   - Adding new data

    +   - Removing unwanted data

    +   - Changing existing data by updating new values or converting unstructured
    data into a more meaningful and process-friendly format


    There are many different methods of manipulating data, depending on the type of
    data. Let''s now take a look at various data manipulation techniques.


    # # Understanding string manipulation


    Strings are one of the most commonly used data types in any automation solution.
    A string data type refers to a series of text values that we frequently use to
    extract, display, process, and send data between multiple applications for further
    processing. String operations help perform business scenarios such as sending
    out emails for users, extracting a portion of text from a larger text, and so
    on.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'UiPath uses string manipulation methods in **Visual Basic .NET (VB.NET)** or
    C#, depending on the language you choose to use in UiPath Studio. In this chapter,
    we will use the methods in VB.NET. The following sections describe some of the
    commonly used string manipulation methods in UiPath.


    # Concat function


    The Concat function enables the user to concatenate two or more string representations
    into one string representation. The Concat function is capable of concatenating
    up to four string objects at a time. The following code snippet shows the expression
    we use to concatenate strings:


    ```

    String.Concat(StrVariable1, StrVariable2)

    ```


    Let’s take a look at a simple example of how to use this function. Proceed as
    follows:


    +   1. Open UiPath Studio and create a new project.

    +   2. Once the project is ready, double-click on the Main.xaml file on the **Project**
    panel to open it in the **Designer** panel.

    +   3. Click on the **Activities** panel, search for a **Sequence** activity,
    and drag it to the **Designer** panel.

    +   4. Select the **Sequence** activity you added, and click on the **Variables**
    panel.

    +   5. Create a new variable named DisplayText of type String.

    +   6. Drag and drop an **Assign** activity and assign the following value to
    the DisplayText variable: "Hello... My name is".

    +   7. Create another String variable named FirstName.

    +   8. Use another **Assign** activity below the previous and assign a FirstName
    variable with the value "John".

    +   9. Create a third String variable named LastName.

    +   10. Use a third **Assign** activity below the previous one and assign a LastName
    variable with the value "Doe".

    +   11. Now, search for a **Message Box** activity in the **Activities** panel
    and drag and drop it after the last **Assign** activity.

    +   12. Configure your **Message Box** activity with the following code:


    ```

    String.Concat(DisplayText, FirstName, LastName)

    ```'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Once you reach this point, your workflow should look similar to this:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_206_0.png)


    Figure 7.1 – String.Concat function example


    Now we know how to combine two strings, let’s look at how we can check whether
    a particular string exists in another string.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Contains function


    The Contains function checks whether a specified substring exists in another string.
    The function returns a Boolean value depending on the result. The function returns
    True as the output when the substring exists in the main string and returns False
    if not. An important point to remember is that this function is case-sensitive;
    hence, it may return False as the output even when two strings match, but the
    casing of the letters is different. As we discussed in Chapter 5, Learning about
    Variables and Arguments, Boolean results enable the user to control the workflow
    execution. Since the Contains function returns a Boolean result, this function
    is mainly associated with a control flow activity. We can either use an If activity
    or Flow Decision activity depending on whether we are using a Sequence or a Flowchart
    container.


    Let''s look at the same workflow we designed and change it by adding this function
    to test its functionality, as follows:


    +   1. In the same workflow, drag and drop an **If** activity from the **Activities**
    panel and place it in between the last **Assign** activity and the **Message Box**
    activity.


    +   2. Configure the **If** activity using the following code for the **Expression**
    section:


    ```

    String.Concat(DisplayText, FirstName, LastName).Contains("John")

    ```


    The expression concatenates all the string variables and checks whether the "John"
    substring is available in it.


    +   3. Select the **Message Box** activity located below the **If** activity,
    and move it into the **Then** segment of the **If** activity.


    +   4. Drag and drop a **Write Line** activity from the **Activities** panel into
    the **Else** segment of the **If** activity.


    +   5. Configure the **Write Line** activity with the following string:


    ```

    "The name you are looking for is not available"

    ```'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Once you configure the **Write Line** activity, your workflow should look similar
    to this:


