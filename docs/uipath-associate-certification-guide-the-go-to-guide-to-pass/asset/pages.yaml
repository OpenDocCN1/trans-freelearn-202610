    With the completion of the steps, you now understand how to use arguments to pass
    data between workflow files. The use of arguments and variables is very important
    for the chapters to come. It is essential and mandatory that you practice using
    different variables and arguments. Variables and arguments may have many data
    types, and it is important to understand the different data types to use specific
    functions related to those data types. The following section of the chapter explains
    the different data types used in UiPath.


    # ## Understanding data types


    UiPath uses multiple data types to perform and store different data elements.
    This section does not address all the available data types. However, it explains
    the commonly used data types across different automation solutions.


    Let’s take a look at some of the commonly used variables, as follows:


    +   * **String variables**: Store any sequence of text. There are many methods
    specific for string processing, which are addressed later in *Chapter 7, Manipulating
    Data Using UiPath*.


    +   * **Boolean variables**: Used to store only two values, `True` and `False`,
    to be used with control statements to help determine the flow of the program'
  merge: -1
  img_proc: true
- pgno: 166
  md: '+   • Number variables: Used to store numeric values to execute equations or
    perform comparisons, and so on. There are many sub-types of numeric variables,
    and the following screenshot describes some of those types:


    | Numeric Type | Description |

    | :--- | :--- |

    | Int16/32/64 | Signed integers (for example, 10, 20, 100, -250). |

    | Long | Holds signed integers ranging from -9,223,372,036,854,775,808 through
    9,223,372,036,854,775,808 |

    | Double | Allows you to store the largest and smallest possible floating point
    integers. |

    | Decimal | Decimal supports the storage of values up to 29 significant digits
    and can represent values above 7.9228 x 10 ^ 28. The Decimal type is more suitable
    for financial calculations as it supports large numbers and does not provide errors
    while rounding values. |


    Figure 5.24 – Numeric data types


    +   • Date and time variables: These variable types contain two categories of
    data, as shown in the following screenshot:


    | Data Type | Description |

    | :--- | :--- |

    | DateTime | Used to store specific date and time information regarding a given
    date. This allows you to perform date-related calculations, such as calculating
    date durations and substracting and adding dates. |

    | TimeSpan | Used to measure the duration between two given Time values. |


    Figure 5.25 – Date-related data types


    +   • DataTable variables: Used to store tabular data in rows and columns, hold
    large data pieces, and act as a database. DataTable variables are useful for performing
    operations such as filtering large amounts of data, searching, and copying.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '+   GenericValue variables: GenericValue variables come in handy when you are
    unsure what type of data is returned from a process. They have the capability
    of automatically converting their kind according to the first value assigned to
    the variable. UiPath recommends the use of GenericValue variables as a temporary
    solution in the workflow until the point you derive the actual data type. GenericValue
    variables can hold any data type, including String, Number, and arrays. For example,
    you are comparing two Excel sheets column by column and each column has a different
    data type. In such scenarios, we can use GenericValue variables to perform a comparison.


    +   Collection type variables: Includes all collection objects, such as arrays,
    lists, and dictionaries. The following screenshot describes commonly used collection
    objects:


    | Collection Type | Description |

    |---|---|

    | Arrays | Used to store multiple values of the same data type. The size of the
    object is defined at creation. |

    | Lists | Used to store multiple values of the same data type (similar to Arrays).
    However, the size of the List may change during execution. |

    | Dictionary | Used to store data values in the form of key-value pair where its
    unique key refers to each value. In simple words, every value in a Dictionary
    variable is referenced using a unique key that describes the value in the collection.
    |


    Figure 5.26 – Collection data types


    By now, you should have an initial understanding of commonly used data types.
    We will discuss how to use these data types and their unique functions in Chapter
    7, Manipulating Data Using UiPath.'
