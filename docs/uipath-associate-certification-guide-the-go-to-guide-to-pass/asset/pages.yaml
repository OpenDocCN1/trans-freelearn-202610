    Job creation requires the user to configure the Job creation display fields before
    clicking the START button:


    +   - **Process Name**: Select the process intended to run from the drop-down
    list. The drop-down menu shows the display names given for each process at the
    time of process creation.

    +   - **Job priority**: The job priority has three values: Low, Normal, and High.
    The default priority is Normal.

    +   - **Runtime License**: Orchestrator supports two main Runtime License options:
    Unattended and Non production. Unattended is used when you have production unattended
    runtime licenses assigned to the tenant. Non production is used for non production
    licenses, but it is also similar to unattended.

    +   - **Execute the process X times**: Enables the process to run X number of
    times.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '+   - **Account**: If not mentioned, the user/robot is dynamically allocated
    from the assigned group of users for the process.

    +   - **Machine**: If not mentioned, the runtime machine is dynamically allocated
    for the process.

    +   - **START button**: Clicking the **Start** button starts the job immediately
    and it will be visible on the **Jobs** page.


    # # Triggers


    **Triggers** enable the robot to run specific processes at a given timeslot. A
    Schedule allows users to trigger processes iteratively without human intervention.
    The **Triggers** page in Orchestrator gives you access to creating schedules based
    on regular working days or custom calendars that include non-working days.


    The following screenshot of the **Triggers** page shows the two different types
    of triggers available:


    +   - **Queue Trigger**: This trigger is associated with queues. It gets fired
    automatically whenever a specified number of new items are inserted into the queue.
    The queue trigger helps in situations where you cannot define a particular time
    frame to trigger a process, but you need to run it as soon as the data is available.


    +   - **Time-Based Trigger**: This trigger is programmed to trigger a specific
    process at a particular time on an hourly, daily, weekly, or monthly basis. The
    users can configure custom time frequencies as required using cron expressions
    under advanced options. The **Trigger Details** column specifies the time and
    the running frequency of time-based triggers.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'In addition, the **Triggers** page includes the trigger name, the process associated
