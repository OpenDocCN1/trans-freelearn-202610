    \ fills out an application form and submits an application with any other required\
    \ documents, the bank representative verifies the submitted data. The data verification\
    \ usually includes validating the customer’s personal information, cross-checking\
    \ for other facilities obtained from other banks, repayment capabilities, and\
    \ so on. Such checks are done by connecting to multiple external applications,\
    \ which usually takes a long time. After the background checks, approval is carried\
    \ out by the manager of the bank, based on specific criteria. The introduction\
    \ of RPA for loan processing has brought a lot of benefits as most of these functions—such\
    \ as reading the application form, performing background checks, calculating the\
    \ grantable loan amount, and so on—are easily automated.\n\nAs well as the processes\
    \ mentioned, there are many more exciting processes out in the world that robots\
    \ take care of, allowing them to focus on more value-added activities.\n\n> **Important\
    \ Note**\n> \n> RPA in businesses allows employees to focus on more strategic\
    \ initiatives while robots take care of transactional activities. This section\
    \ of the chapter covered some of the commonly automated processes across multiple\
    \ organizations around the world. Most business processes that require automation\
    \ are complex and require many steps to be carried out. It is essential to understand\
    \ all the activities that an RPA robot can perform to meet such complex business\
    \ requirements. The simple actions performed by RPA robots sometimes require a\
    \ combination of multiple technologies.\n\n# # What can RPA automate?\n\nAs we\
    \ discussed in the previous sections, RPA robots can mimic human interactions\
    \ in a digital platform. Listed here are some of the very few actions that RPA\
