    Now, we can see that the value of `age` is 4z. Because of z, the typecasting couldn''t
    happen, hence the exception was thrown.


    +   4. Navigate to the **Locals** panel and change the value of **age** from **4z**
    to **48** by clicking on the pencil icon.


    +   5. Click on **Continue** to resume the debugging:


