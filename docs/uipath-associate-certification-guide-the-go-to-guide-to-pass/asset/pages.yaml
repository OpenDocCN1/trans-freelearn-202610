    # Summary


    This chapter introduced you to the topic of processing PDF files using UiPath.
    PDF files are a prevalent type of file that we interact with every day. Today,
    all organizations deal with documents, and it is a very time-consuming process.
    The concepts we covered in this chapter will help you easily extract graphs, text,
    and other information from PDF files using a simple set of activities. Additionally,
    the chapter covered the activities involved in PDF automation, extracting text/images
    from pages, and extracting key fields from a PDF file using UI automation.


    The concepts you learned in this chapter will be very helpful in future projects.
    It is essential to practice how to best interact with PDF files and what activities
    to use based on different scenarios. Similar to PDF processing, emails also play
    a significant role in our daily activities. We read and send emails to communicate
    with other parties. UiPath also supports the automation of emails to improve the
    work-life of employees. In the next chapter, we will address how you can automate
    the actions you perform in emails. Email automation is a part of almost all the
    automation solutions that we build in the present day. Therefore, it is essential
    to learn how to interact with emails even though the process you automate does
    not have email processing activities.'
