- pgno: 426
  md: 'More about the exception can be found from the **Locals** panel by clicking
    on the magnify icon from the **Exceptions** section:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_426_0.png)


    Figure 13.52 - The Exceptions window


    From the exception, we can make out that it is **InvalidCastException**, which
    occurs when the conversion of an instance of one data type to another is not supported.
    In the **Type Into** activity for entering the age, the **CInt ()** function is
    used for converting **String** to **Integer**. Since the typecasting couldn''t
    happen, the exception was thrown:


    +   1. Apply a conditional breakpoint at this **Type Into** activity with the
    condition as **Not age.IsNumeric** and restart the debugging process:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_426_1.png)


    Figure 13.53 - A conditional breakpoint on the Type Into activity


    The execution will then go into a paused state when the age cannot be converted
    to an integer. As expected, the debugging goes into a paused state while entering
    the age of the third person without throwing an exception.'
  merge: -1
  img_proc: true
