- pgno: 6
  md: '# About the reviewers


    After earning his master’s degree in computer science, **Mukesh Kala** started
    his career as a software developer. He has over 8 years of professional experience
    and presently works as a senior RPA analyst, automating work in the banking and
    financial services industry.


    A strong believer in the power of learning and knowledge sharing, Mukesh regularly
    attends UiPath community events, training and helping out beginners in technology.
    Mukesh was recognized as a UiPath MVP in 2021 and is behind the YouTube channel
    _Tutorials by Mukesh Kala_. In his leisure time, he loves to read books and speedcubing.


    **Andy Menon** is a UiPath MVP for 2021. In his day job, he is an integrations
    engineer, with experience in integrating systems for the enterprise.


    Andy is also the founder of RPA Vanguard and the namesake channel on YouTube,
    teaching RPA with real-world examples. His Udemy course on enterprise RPA is ranked
    amongst the top 20% of almost 100,000 courses on CourseMarks!


    In his free time, Andy dabbles in hobby electronics, 3D printing, and the **Internet
    of Things (IoT)**, experimenting with Arduino, Raspberry Pi, and the ESP8266 family
    of microcontrollers.


    Andy is also a Kindle-published author of the book _Give Yourself IoT Super Powers_.


    He has published several of his hobby projects and designs online at Instructables
    and Thingiverse.'
