- pgno: 401
  md: 'Also, when debugging is in a paused state, you can inspect the values of items
    from the Value properties column by clicking on the magnifier button:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_401_0.png)


    Figure 13.8 – Inspecting all rows inside a DataTable variable by clicking on the
    magnifier button


    # The Watch panel


    The Watch panel window has three properties – Expression, Type, and Value.


    You can display the values of variables, arguments, and user-defined expressions
    that are in the scope of the executing container. The values in the Watch panel
    are updated, depending on the execution of the related activity during the debugging
    process – for example, debugging a process inside a For Each activity. The values
    get updated in the Watch panel for every iteration:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_401_1.png)


    Figure 13.9 – The Watch panel displaying the type and value of the variables and
    expressions'
  merge: -1
  img_proc: true
- pgno: 402
  md: 'You can add variables, arguments, or expressions to the **Watch** panel by
    clicking on the **Add Watch** option in the **Expression** property.


    You can also add variables or arguments to the **Watch** panel using the **Locals**
    panel by performing a right-click on a variable or argument and selecting **Add
    to Watch**:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_402_0.png)


    Figure 13.10 – Adding a variable to the Watch panel from the Locals panel


    Alternatively, you can add variables or arguments to the **Watch** panel using
    the **Variables** and **Arguments** panels. To do so, right-click a variable or
    argument and select **Add to Watch**:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_402_1.png)


    Figure 13.11 – Adding a variable to the Watch panel from the Variables panel'
  merge: -1
