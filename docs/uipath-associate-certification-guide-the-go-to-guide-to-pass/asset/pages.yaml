    +           * Customer phone number

    +           * Customer email ID

    +       * **Invoice Particulars:**

    +           * Invoice date

    +           * Invoice number

    +       * **Order Information:**

    +           * Item quantity

    +           * Item description

    +           * Item unit price

    +           * Line total amount

    +           * Subtotal amount

    +           * Shipping amount

    +           * Total amount'
