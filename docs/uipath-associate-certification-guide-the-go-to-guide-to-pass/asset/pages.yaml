- pgno: 145
  md: '# # 5 Learning about Variables and Arguments


    **Variables and arguments** are two critical components of any programming language.
    As

    with any other programming language, UiPath Studio also uses variables and arguments

    to store, read, and process data. Variables and arguments enable users to build
    an

    automation flow by connecting different actions based on each step’s input and
    output.


    By the end of this chapter, you will understand the most common data types used
    in

    UiPath and how to configure arguments and variables according to the requirements.


    The chapter consists of the following sections:


    +   - Exploring variables

    +   - Practicing variable creation

    +   - Exploring arguments

    +   - Practicing argument creation

    +   - Understanding data types'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# # Technical requirements


    Before starting this chapter, please ensure UiPath Studio and UiPath Robot are
    installed.

    This chapter requires a general idea of how to use Studio and the UiPath Assistant
    tool.

    You can refer back to _Chapter 2, UiPath Ecosystem_, to better understand the
    basics of

    UiPath Studio.


    # # Exploring variables


    A variable can be defined as a container that holds values of the same data type.
    There are

    different methods for changing the value of a variable, such as the following:


    +   - **External input**: A user or another system provides a value to store in
    the variable.

    +   - **Data manipulation**: A variable used in a data manipulation process may
    hold the

    +   derived values. A data manipulation process is a series of steps that are
    carried out

    +   to extract, filter, modify, and clean data. Data manipulation is further described
    in

    +   _Chapter 7, Manipulating Data Using UiPath_.

    +   - **Passing from one activity to another**: Executing multiple workflow activities
    may

    +   use the same variable as the input or output of an activity.


    Let''s now explore the main properties of a variable.


    # # Properties of a variable


    There are four main properties used in UiPath to configure variables. You can
    find

    these four properties through the **Variables** panel of UiPath Studio, as shown
    in the

    following screenshot:


    | Name | Variable type | Scope | Default |

    | :--- | :--- | :--- | :--- |

    | SumValue | Int32 | Sequence | Enter a VB expression |

    | Create Variable | | | |

    | Variables: Arguments Imports ... | | | |


    Figure 5.1 – Variables panel in UiPath Studio


    Let''s explore each property in detail for a better understanding, as follows:


    +   - **Name**: This property contains the name of the variable. The name specified
    here is

    +   used throughout the automation workflow to refer to the variable. It is always
    best

    +   practice to provide a short but descriptive name for a variable based on its
    use.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '+   • **Variable type**: This defines the type of data stored in the variable.
    The type of the variable is defined when creating a variable and can be changed
    if needed. Some specific types are more generic and can accommodate different
    types of data. These data types are unique to UiPath. In general, the commonly
    used data types are **Text**, **Number**, **Array**, **Date/Time**, **Boolean**,
    and **Data Tables.**


    +   • **Scope**: Describes the region of the workflow where a variable can be
    used. Containers such as **Sequence**, **Flowchart** and **Scope Activities**
    (described in detail in *Chapter 6, Understanding Different Control Flows*) define
    the region in which a variable can work. It is always good to assign a variable
    to the required scope to ensure efficient execution and avoid confusion because
    many variables are used in a real automation workflow.


    +   • **Default**: Every variable is assigned with a default value by default.
    The default value property enables the user to set a custom default value to the
    variable.


    As we now know the properties of a variable, let’s take a look at the different
    approaches we can take to create variables. Variable creation involves configuring
    the properties described earlier.


    # # Creating variables in UiPath


    Variable creation and modification are quite frequent when building automation
    workflows. Hence, UiPath has introduced three methods of creating variables in
    a workflow, as described here:


    +   • **Through the Variables panel**: Clicking on the **Create Variable** option
    in the **Variables** panel allows for the easy creation of variables by configuring
    the properties discussed previously. The following screenshot shows how this is
    done:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_147_0.png)


    Figure 5.2 – Variables panel in UiPath Studio


    Clicking on the **Create Variable** option creates a new row in the panel to provide
    a name, variable type, scope, and the default value for the new variable.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '+   • Through the Designer panel: Use the activity you want to associate the
    variable with, and press the Ctrl + K shortcut keys to enable variable creation
    mode in the Designer panel. You can provide the variable name and other additional
    configurations through the Variables panel as needed. The variable created through
    the Designer panel picks the scope and the data type of the variable automatically,
    based on the configurations of the activity and the scope of the activity. The
    container the activity is in determines the scope of the variable.


    +   • Through the Properties panel: The Properties panel of the activity includes
    all configuration options for the activity. As with the Designer panel, pressing
    the Ctrl + K shortcut keys in the property that the variable needs to interact
    with will enable the variable creation mode. The rest of the variable''s properties
    are automatically configured based on the activity''s configurations and the activity''s
    scope.


    Variables are common containers that we use across all programming languages to
    hold different types of data. UiPath uses all the data types available with the
    Microsoft .NET Framework, with a few additional data types unique to UiPath. As
    we now know the basic properties of a variable, the next section of the book provides
    you with guidelines to practice the creation of variables and scope management.
    Practicing variable creation now will come in handy in future chapters as we talk
    about more complex scenarios.


    # # Practicing variable creation


    Since we have covered the basics of variables, let''s now practice a little bit.
    The following steps will guide you on how to create a simple variable in a UiPath
    workflow:


    +   1. Run UiPath Studio from the Windows Start menu.


    +   2. Click on the Process option on the Studio Start screen under the New Project
    section to create a new blank project, as illustrated in the following screenshot:'
  merge: -1
