    The sections of the **RegEx Builder** screen are explained as follows:


    +   • **Test Text**: A text editor where the user can test a specific text against
    an expression. The parts of matching text patterns in the test text will be highlighted,
    validating the expression.


    +   • **RegEx**: Allows searching for a given text, number, character, or a combination
    of many.


    +   • **Value**: Contains precisely the text, number, or character that needs
    to be retrieved.


    +   • **Quantifiers**: A drop-down list that consists of types of results to be
