    additional information related to the queue. Figure 3.27 shows the information
    related to each queue on the Queues page:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_96_1.png)


    Figure 3.27 – Information shown on the Orchestrator Queues page'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'The following describes the information in more detail:


    +   * **Name**: The name of the queue

    +   * **Description**: A short description of the queue

    +   * **In Progress**: The number of transaction items with the In Progress status

    +   * **Remaining**: The number of transaction items remaining to be processed

    +   * **Average Time**: The average time taken to complete a transaction

    +   * **Successful**: The number of transaction items completed successfully

    +   * **App Exception**: The number of failed transactions due to application
    exceptions

    +   * **Biz Exception**: The number of failed transactions due to business exceptions

    +   * **Process**: Displays the associated queue triggers


    Clicking the + Add Queue button in the top-right corner navigates to the queue
    creation screen. Figure 3.28 shows the required configurations to create a queue:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_97_0.png)


    Figure 3.28 – Queue creation page in UiPath Orchestrator'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'The following describes each required field for easy understanding:


    +   - **Name**: Workflows created in UiPath Studio refer to the queue using the
    name provided.

    +   - **Description**: A short description of the queue and its usage.

    +   - **Enforce unique references**: Each transaction created in a queue has a
    reference. This property is selected as **Yes** if you want the transaction references
    to be unique. The user cannot change this property after creating the queue.

    +   - **Auto Retry**: This property is selected as **Yes** if the automatic retry
    of failed transactions is required.

    +   - **Max # of retries**: Specifies the maximum number of times that a failed
    transaction needs to be retried. As a best practice, three maximum retries are
    recommended before terminating.


    UiPath Studio offers a unique set of activities that can easily interact with
    the created queues. These activities allow robots to insert items, bulk insert
    items, retrieve queue items, and process them. The following are the activities
    used in UiPath workflows to interact with queues:


    +   - **Add Queue Item**: Used to add a transaction item to a queue. Each transaction
    item may contain multiple data elements. Queue item uses a key-value to refer
    to each data element in the transaction. Each transaction item added with this
    activity gets added to the queue with the **New** status.

    +   - **Add Transaction Item**: Like **Add Queue Item**, this activity also adds
    a transaction item to the queue, but with an **In Progress** status. This activity
    allows immediate processing of the item after adding it to the queue.

    +   - **Get Transaction Item**: Retrieves the next available transaction item
    in the queue with the status of **New**. The status of each retrieved item is
    changed to **In Progress** automatically.

    +   - **Postpone Transaction Item**: Used to add a date parameter that defines
    the date and time the item should get processed.

    +   - **Set Transaction Progress**: Some transactions have longer processing times
    and may have several stages to pass depending on business requirements. This activity
    helps to introduce and track custom statuses for such transactions.

    +   - **Set Transaction Status**: Used to change the status of the transaction
    item in the event of failure or success. The status gets changed to **Failed**
    if a failure is due to a business or an application rule exception. Similarly,
    the status gets changed to **Successful** when the transaction gets processed
    successfully.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '+   - **Get Queue Items**: Retrieves all the queue items that have the defined
    status in the activity.

    +   - **Wait Queue Item**: Waits for a transaction to be available in the queue
    for processing and sets its status to In Progress.

    +   - **Bulk Add Queue Items**: Allows the user to add a set of items to the queue
    at one time. All added items will have a New status.

    +   - **Delete Queue Item**: Used to delete specified items with the New status.


    UiPath Orchestrator plays a significant role in the entire automation solution
    you build, so understanding the fundamentals is one of the main essential points
    when learning about the UiPath platform. The knowledge and familiarity gained
    from the topics discussed in this chapter will help in understanding and practicing
    the features discussed in the following chapters. The next section focuses on
    creating the first Orchestrator instance and connecting the local robot as the
    first step of the journey.


    # ## Summary


    This chapter introduced the UiPath Cloud platform and UiPath Orchestrator. UiPath
    Orchestrator is the heart of UiPath’s platform as it is the control center for
    all robots. As part of the introduction, the chapter described each available
    component of the Cloud platform and Orchestrator in detail. We also described
    some of the activities that can be used to interact with Orchestrator assets and
    queues. Finally, we looked at how to configure the Cloud platform to create the
    first UiPath Orchestrator instance.


    The fundamental concepts of UiPath Orchestrator that have been discussed will
    be useful in the following chapters. The next chapter describes UiPath Robot,
    the different types of robots, and how they are configured and connected to Orchestrator.
    To better understand the configuration of robots, it is essential to have a good
    understanding of the concepts described there.'
  merge: -1
  img_proc: true
