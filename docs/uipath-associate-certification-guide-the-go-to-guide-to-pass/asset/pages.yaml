    Figure 13.50 – A snippet of the Voter Registration form


    Now that we have seen all the input files and the code, let''s debug the automation
    and see what the error is. The bot does the registration of the first two individuals
    successfully.

    When entering the age of the third person, it throws an exception, and the debugging
    goes

    into a paused state. The `Type Into` activity for age is highlighted in the **Designer**
    panel,

    since it caused the exception. An error log is logged in the **Output** panel:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_425_1.png)


    Figure 13.51 – An exception thrown at the Type Into activity'
  merge: -1
