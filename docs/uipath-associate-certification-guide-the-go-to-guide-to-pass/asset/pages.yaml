- pgno: 169
  md: '# # Understanding Different Control Flows


    To create robust automation workflows using UiPath Studio, you must understand
    how to control the project efficiently using control flows. UiPath provides a
    lot of control flow activities so that you can effectively drive the automation
    workflows of the project. Control flows provide the robot with more power so that
    it can make decisions while evaluating any business conditions as it’s being executed.
    In this chapter, we will learn about these essential skills by covering important
    control flow activities using real-time examples.


    In this chapter, we will cover the following topics:


    +   • Overview of control flows

    +   • What are sequences?

    +   • What are flowcharts?

    +   • Exploring decisions and types of decisions

    +   • Exploring loops and types of loops'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'By the end of this chapter, you will be able to understand all the key concepts
    behind control flows and be able to implement these ideas in your robots.


    # Technical requirements


    To work on control flows, you need to have UiPath Studio and UiPath Robot installed.


    For this chapter, you will need a general idea of how to use Studio and Robot.
    Please refer to Chapter 2, UiPath Ecosystem, and Chapter 5, Learning about Variables
    and Arguments, to learn about the basics of UiPath Studio.


    # Overview of control flows


    Control flows are activities that are used to convert the decision requirements
    into business workflows in UiPath. In an RPA project, control flows are sequentially
    executed on RPA code. This code may contain UiPath activities, control statements,
    and workflows. There are two key workflows in an RPA project, as follows:


    +   - **Sequence**: Sequence workflows are easy to read, and they are executed
    from top to bottom or executed in a sequence of activities. They are mainly used
    in simple or linear business processes, which involve performing a sequence of
    automation executions *once* for the given input data.


    +   - **Flowchart**: Flowchart business processes are used to address complex
    business requirements that involve many decision points and complex logic.


    RPA workflows use control flow activities to drive the execution of statements.
    The most frequently used control activities are as follows:


    +   - **If**: This activity is used to verify a condition and the outcome is either
    `True` or `False`. It''s useful for making decisions based on the input value
    of the variables. This rule uses the *If-Then-Else* rule to evaluate any given
    input. For example, if you want to check a voter''s eligibility by reading the
    value from the `Age` field, you need to evaluate the business condition if the
    given age is greater than or equal to 18 to find their eligibility status, as
    shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 171
  md: '![](img/84b06ad2832c53c5f677f8ce4c80f184_171_0.png)


    Figure 6.1 – Example of If-Then-Else


    +   • **Loops**: These are used to verify a set of statements based on a conditional
    requirement or to execute statements multiple times until a certain condition
    is satisfied. The key loops are **DoWhile**, **While**, and **For Each**.


    +   • **Switch**: This activity is used when there are more than two decision
    points and corresponding actions must be performed on each decision outcome.


    In this section, we provided a high-level overview of control flows. We''ll explore
    control flows in more detail in the upcoming sections.


    # What are sequences?


    Sequences are easy to understand, and they are the simplest type of project. They
    are commonly used in processes that are linear and have step-by-step instructions
    to be performed one after the other in a single block of activity. The main use
    of sequences is **reusability**, in that they can be used in a single workflow
    or invoked from any other automation workflows by passing the arguments that we
    will discuss in _Chapter 5_, _Learning about Variables and Arguments_.


    For example, you can create a sequence that takes information from a spreadsheet
    and enter it into a registration web page. Let''s explore an example.'
  merge: -1
  img_proc: true
