    next section of the chapter focuses on some of the commonly used functions when
    working with list variables.


    # # Understanding list manipulation


    Lists are data types of a specific type that can contain multiple data values.
    All list data values have a fixed memory location, which is known as an **index**.
    Arrays are of fixed size and defined at the creation of a variable. However, lists
    allow us to add, modify, and remove items during runtime. Similar to arrays, lists
    provide specific methods to manipulate their data, such as the following:


    +   - Adding items

    +   - Removing items

    +   - Looping through elements in the list and performing specific actions on
    each

    +   - Sorting items in the list

    +   - Searching for an item

    +   - Clearing items in a list


    UiPath offers a collection of activities to perform the aforementioned actions
    efficiently. The activities that UiPath offers are listed here:


    +   - **Add to Collection**: Adds new items to a specified collection variable.
    It is the equivalent of the `List.Add()` function.

    +   - **Clear Collection**: Deletes all data from a specified collection variable.
    This function comes in handy when working with list variables that hold data temporarily.
    This activity helps such scenarios by deleting everything in the list before loading
    it with the next batch.

    +   - **Remove from Collection**: Removes a specified item from a collection variable.
    In addition to the removal operation, the activity also returns a Boolean result
    indicating whether the removal operation has been successful or not.

    +   - **Exists in Collection**: The activity returns a Boolean result indicating
    whether a specified item exists in the collection or not. This activity provides
    an efficient mechanism to check the existence of items without looping through
    the list.'
  merge: -1
  img_proc: true
