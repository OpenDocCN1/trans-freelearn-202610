    # Assets


    Assets allow you to store a single data element for later use within the automation
    process. The typical types of assets available in Orchestrator allow the storage
    of text values, Boolean values, integer values, and credentials for applications.


    Assets also provide the capability to store and pass different values for different
    robots. If an asset is configured to store a single value, all robots use the
    same value. However, if an asset is configured with the **Value Per Robot** option,
    different robots will obtain the value assigned to each. Assets can be created
    and configured through the **Assets** page in Orchestrator.


    Assets come in handy when robots need credentials to access applications or in
    scenarios where it does not make sense to store values in a workflow. Orchestrator
    allows the creation of assets for each folder. An asset created in one folder
    will only be visible within the scope of the folder.


    *Figure 3.23 illustrates the **ASSETS** option on the Orchestrator home page for
    the selected folder:*'
  merge: -1
