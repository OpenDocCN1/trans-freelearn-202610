    31. Configure the join type as Left and Full and explore how the output differs
    from the one previously.


    In addition to the points covered, explore the different operation types available
    in the Join Wizard. We used the operation = for our matching because we wanted
    an exact match. However, there are many operations available that may fit into
    different types of joins based on the scenario. Alternatively, sometimes, you
    may receive data tables without a proper column name. In scenarios where you do
    not know the exact column names, you can always refer to the columns using the
    column index. Similar to the Collection type variables, DataTable also has zero-based
    indexes for rows and columns. In other words, if you want to access the first
    row in a data table using an index, it would always be zero. The same concept
    is applied to accessing columns.


    Imagine we want to use the index to configure our Join Wizard instead of the column
    names. In such a case, we need to use the following approach.


    The first data table (employee) has five fields, and Department ID is the last.
    Considering the zero-based index, Department ID will hold index 4. Regarding the
    Department data table, you need to use index 0 because the Department ID field
    is the first column. If you are to configure the Join Wizard with the identified
    indexes, you use index 4 for the **Column Table 1** field and **index 0** for
    the **Column Table 2** field.


    By now, you should have an understanding of the basic concepts of a data table
    and how to use it with our activities in UiPath. As you have already seen, there
    is a wide range of activities in UiPath to perform different manipulations with
    data tables. Try exploring the other activities on the same example and see what
    other things you can do. You can expect the same functionality when working with
    Excel files; therefore, data in Excel files is easy to export into data tables.
    The next section explains how to interact with Excel files. There are many automation
    solutions built around Excel data manipulation. It is essential to understand
    the different methods available to interact with Excel files.'
