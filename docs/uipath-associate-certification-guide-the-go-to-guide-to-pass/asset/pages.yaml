- pgno: 267
  md: '# # Learning the Uses of Data Tables and Exploring Excel Automation


    We discussed different types of variables and arguments in the previous chapter.
    However, there is another very special type of variable, which we call **data
    tables**. We use data table variables to process more structured data that is
    organized in a tabular form. We use Microsoft Excel almost every day to perform
    different functions in an organization. For example, a finance department may
    use Excel regularly to generate reports, perform calculations, and reconcile financial
    data. As a result, many companies and/or departments have already started automating
    the actions performed manually in Excel.


    This chapter focuses on learning how to automate Excel using UiPath and how data
    table variables can be used to support Excel automation.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'The chapter consists of the following sections:


    +   - Exploring data tables

    +   - Creating and customizing data table variables

    +   - Interacting with Excel files

    +   - Practicing Excel automation


    At the end of this chapter, you will understand the most common methods used to
    perform data manipulation in Excel using different Excel interaction methods.


    # Technical requirements


    Before starting with this chapter, please have UiPath Studio and the Assistant
    installed. This chapter requires a general idea of how to use Studio to create
    variables and simple workflows. Furthermore, you must have the Microsoft Office
    package installed on your machine.


    # Exploring data tables


    We have all used Microsoft Excel at some point in our life. In every Excel file,
    we see the following concepts:


    +   - *Workbook*: This refers to the Excel file itself. From now on in our course,
    we will be using this word to refer to Excel files.

    +   - *Worksheet*: Every workbook can have multiple worksheets that contain data.

    +   - *Row*: Every worksheet consists of rows of data.

    +   - *Column*: Every data row consists of multiple columns that contain different
    data values referring to the type of data each column holds.

    +   - *Cell*: A cell in an Excel sheet contains a single value or a formula. Every
    row consists of multiple cells.


    Similarly, a data table is a variable type that can store data in the same structural
    format as an Excelsheet.


    You might wonder about the differences between a data table and a worksheet. A
    data table is a memory representation of a single database table that can hold
    multiple rows consisting of multiple columns of different data types. Alternatively,
    a worksheet has the same structure, but it can visually represent its data using
    tables and graphics.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Creating and customizing data tables


    This section of the chapter will look at how we can create and customize data
    tables.


    # Creating data tables


    If you have covered Chapter 5, Learning about Variables and Arguments, you are
    now familiar with creating variables and arguments in UiPath Studio. The same
    concept applies to data table variables. The only difference is that, for the
    Data Type property of the variable/argument, we have to select System.Data.DataTable
    from the drop-down menu.


    Apart from the variable/argument creation, you will also encounter specific activities
    that help to create data tables:


    +   Build Data Table: This activity provides a wizard that you can use to graphically
    build your data table by adding columns, changing column properties (auto increment,
    null value handling, the maximum length of a value, and the default value), and
    adding rows with static values. This activity is handy when you explicitly expect
    data table output with a particular structure from an operation.


    +   Read Range: This is an activity that enables the user to read data from an
    Excel worksheet. The output of this activity is a data table that holds all columns
    and rows of a specified range in the sheet. The activity requires configuring
    the output property by creating a data table variable using variable/argument
    creation shortcut keys or creating it through the Variables/Arguments panel.


    +   Read CSV: Similar to Read Range but used to read data from CSV files. The
    configuration of the output properties is identical to the Read Range configuration.


    +   Data Scraping: This is an advanced functionality provided by UiPath to extract
    structured data from web pages or documents and save it in data table variables.
    This topic is covered in more detail in Chapter 10, Exploring User Interfaces
    and User/Robot Interactions.


    +   Generate Data Table: Used to generate data tables from unstructured data.
    The user can configure the activity to specify how to split the rows and columns
    based on separators.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'We can perform multiple manipulations on data in created data tables, such
    as sorting, filtering, cleansing, and joining with other data tables. These manipulation
    functions are made easy by a wide range of activities that UiPath offers specifically
    for data tables. Some of those activities are as follows:


    +   - **Clear Data Table**: Erases all the data in the data table variable. Clearing
    does not remove the structure of the data table. This activity can come in handy
    when working with temporary data generated inside a loop or an iterative part
    of the workflow to prepare the final data set. Clearing the data in the temporary
    data table ensures that the intermediary variable is cleared and ready for the
    next round of data.


    +   - **Add Data Column**: Adds a new column to an existing data table variable.
    We could provide different inputs to this activity. The input can be an existing
    **Data Column** variable, or we could give the column name and the data type to
    create an empty column. The **Properties** panel for this activity contains several
    other configurable properties such as default value, auto-incrementing, unique
    value check, and an option to allow null values.


    +   - **Remove Data Column**: Removes a data column from an existing data table
    variable. We could provide different inputs to this activity. The input can be
    an existing Data Column variable, or we could give the column name or column index
    of the column to be removed.


    +   - **Add Data Row**: Adds a new data row to an existing data table variable.
    We could provide different inputs to this activity. The input can be an existing
    **Data Row** variable, or we can give the column values of the row as an **Array
    Row** that contains values for each column. The number of objects in the Array
    Row should match the number of columns in the data table.


    +   - **Remove Data Row**: Removes an existing row from an existing data table
    variable. We could provide different inputs such as a **Data Row** variable or
    the index of the row to be removed.


    +   - **Remove Duplicate Rows**: This activity provides an easy mechanism to look
    for all duplicate rows and remove them from the provided data table.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '+   • **Filter Data Table**: Provides the user the ability to filter data in
    an existing data table according to their requirements. The filtering can be done
    in a couple of different ways. It allows the user to filter out unwanted columns
    by specifying the columns they need to remove or keep. Alternatively, you can
    write the conditions to filter data rows.


    +   • **Sort Data Table**: Sorts the data table using a specified column in ascending
    or descending order.


    +   • **For Each Row for Data Table**: Like the **For Each** activity, this activity
    is specially designed to loop through data tables. By default, the activity allows
    looping through rows. If you want to access a specific column in the row while
    looping, the `CurrentRow ("<Column Name>") .ToString` or `CurrentRow(<Column Index>)
    .ToString` command can be used.


    +   • **Join Data Table**: There are scenarios where we need to work with multiple
    data table variables to generate the required output. The **Join Data Table**
    activity enables the user to join two data tables using one or more commonly available
    columns in both data tables. The table join is carried out in different ways,
    as specified in the following table.


    Let''s explore joins by using a simple example to provide a better understanding.
    Imagine you have two data tables:


    +   • **Data Table 1**: Contains information about all employees.


    +   • **Data Table 2**: Includes information on all the available departments
    in the organization.


    +   • **Join rule**: Two tables have a common column, `Department ID`, that specifies
    which employee is assigned to which department.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'The following figure describes the different join rules available in the Join
    Data Table activity along with their use:


    | Join Type | Description |

    | :--- | :--- |

    | **Inner Join** | It is used when we are sure that we only need the records that
    match the join conditions specified. The records that do not match are removed
    from the resulting data table.


    In simple words, it checks for matching records based on the defind commonly available
    columns and returns only rows that have match on both data tables.


    Example:


    Returns only the employees that is assigned to a department |

    | **Left Join** | As we know, a Join includes two data tables. The first data
    table we specify for the Data Table 1 property is considered as your Left data
    table. The data table you specify for the Data Table 2 property is considered
    as your Right data table. You are giving priority to your Left data table the
    moment you select the join condition as Left Join. Unlike in Inner Join, Left
    join returns all the rows on your Left data table. However, it also returns all
    the matching rows it finds from the second data table and empty rows that did
    not have a match.


    Example:


    Returns all the employees along with the information of their assigned department.
    Further, the result also contains employees with no assigned department. |

    | **Full Join** | Keep all the records from both data tables irrespective of the
    join condition. It is more like a combination of both Left Join and Right Join.
    Full Join adds null values for both sides for the records that do not match. |


    Figure 9.1 – The join types in the Join data table activity


    We can also look at these joins using the following diagrams to understand the
    concept graphically. According to the explanations, the inner join looks for similar
    data points. If we include the two data tables in a Venn diagram, it should give
    us the following result:'
