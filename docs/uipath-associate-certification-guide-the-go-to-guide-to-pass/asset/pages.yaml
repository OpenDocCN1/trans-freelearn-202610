  img_proc: true
- pgno: 283
  md: '# Interacting with Excel files


    Many business users use Excel to carry out their daily activities, such as performing
    financial calculations and maintaining expense records. Excel is one of the most
    widely used applications in all the departments of any organization. UiPath offers
    a fantastic set of activities that enables seamless integration and interaction
    with Excel files with or without Excel installed on your computer. The Excel dependency
    is added to the new solutions you create in Studio by default. However, if you
    specifically need to add it to your solution, you can look for UiPath.Excel.Activities
    from the Dependency Manager.


    UiPath offers two different ways of interacting with Excel files:


    +   * File access level: We call these **workbook activities**, which are part
    of Excel activities. Workbook activities do not require the Microsoft Office package
    to be installed on your computer. These activities work in the background and
    are faster compared to actual Excel integration. These activities only work for
    .XLSX files.


    +   * Excel app integration: We call these **Excel activities**, which allow us
    to directly integrate with excel. Unlike the workbook activities, Excel activities
    require the Microsoft Office package to be installed on a computer. The use of
    these activities will open the Excel application, just as a human user would do
    before interacting with it. Excel activities enable the user to interact with
    CSV, XLS, SLSB, and XLSM files. Furthermore, all Excel activities can be configured
    to be visible or hidden when executing.


    Regardless of the method used to interact with Excel files (the access level),
    both approaches share common actions. However, though the action is common, there
    are different activities to perform for each type. For example, you can find activities
    that can read an excel file under both Excel and Workbook activities. These are
    located in two separate sections in the **Activities** panel, as shown in *Figure
    9.12*.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'The following screenshot shows the **Read Range** activity, which is used to
    read data from Excel files. As shown in Figure 9.15, all CSV and Excel activities
    are located in the **App Integration** category, whereas workbook activities are
    located in the **System** -> **File** -> **Workbook** category. The main difference
    between the two types is that activities under the **App Integration** category
    require the **Excel Application Scope** activity to hold all the other activities,
    whereas the others do not. The following figure shows the two activities located
    separately under the **Workbook** and **Excel** categories:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_284_0.png)


    Figure 9.15 – The Excel and workbook activities location


    Let''s explore the common activities that are available for both methods:


    +   - **Read Range**: Reads data from a specified range in an Excel file into
    a data table variable. Using the **Read Range** activity with **Excel Application
    Scope** enables the user to read the data based on the filters applied in the
    Excel file. Alternatively, the workbook activities read all the data available
    in the sheet irrespective of filters.

    +   - **Write Range**: Provides the ability to write data in a data table variable
    to a spreadsheet. The writing starts from the cell indicated by the user.

    +   - **Read Cell**: Reads the content of a specified cell into a string variable.

    +   - **Write Cell**: Writes to the content of a variable into a specified cell
    in the specified worksheet.

    +   - **Read Cell Formula**: Enables the user to read the available formula in
    a specified cell and store it in a string variable.

    +   - **Read Column**: Enables the user to read the content of a specified column
    in the Excel file. The extracted content is stored in an `IEnumerable<object>`
    type variable.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '+   Read Row: Similar to **Read Column**, but this activity reads the content
    of a row, starting with the cell identifier provided by the user. The extracted
    data of the row is stored in an `IEnumerable<object >` type variable.


    +   Append Range: Enables the easy addition of content in a data table variable
    to the end of a specified spreadsheet without overwriting data. Furthermore, if
    the specified sheet is not available in the Excel file, the sheet is created automatically.


    +   Get Table Range: Works especially with the tables we have created in the Excel
    file. This activity enables the user to locate the specified table in a selected
    spreadsheet and extract the range of the table. This activity’s output can be
    fed into other activities such as **Read Range** to extract the data from the
    range returned from the **Get Table Range** activity.


    Apart from the common activities described, there are many other activities that
    UiPath offers to interact with Excel files through **Excel Application Scope**.


    # Excel Application Scope


    **Excel Application Scope** is a container that holds all the Excel app integration
    category activities. The **Excel Application Scope** activity triggers the Excel
    file to open to perform the actions specified within the activity scope. You now
    have a general idea about the commonly available activities for both categories.
    However, Excel App Integration offers more functionalities apart from what we
    discussed earlier. There are many other functions that we can perform using the
    app integration approach. These actions can be categorized based on the different
    aspects of Excel functions.


    # CSV activities


    Excel app integration offers the capability to interact with CSV files using data
    table variables easily. Although CSV activities are placed under the Excel app
    integration category, the main difference between CSV and Excel app integration
    activities is that they can still work without **Excel Application Scope**. UiPath
    offers three unique activities to interact with CSV files:


    +   Read CSV: Reads all the records from a CSV file and stores them in a data
    table variable.


    +   Write CSV: Writes the content of a data table variable into a CSV file. The
    activity is also capable of creating the CSV file if the file is not available.


    +   Append to CSV: Like **Append Range**, the **Append to CSV** activity adds
    the content of a data table variable at the end of an existing CSV file without
    overwriting the data. However, the activity also can create the file if it does
    not exist.'
  merge: -1
  img_proc: true
- pgno: 286
  md: "# Range activities\n\nThe activities that fall under this subcategory can easily\
    \ interact with specified ranges\nin Excel. These activities are similar to the\
    \ activities we came across when learning data\ntable activities. However, these\
    \ activities directly perform the same function in the Excel\nfile itself:\n\n\
    +   • Select Range: Enables the user to select a specific range in an Excel file.\
    \ This action\n+   is similar to the function that the user performs to highlight\
    \ a particular range in an\n+   Excel spreadsheet.\n+   \n+   • Delete Range:\
    \ Enables the user to delete a specific range in an Excel spreadsheet.\n+   \n\
    +   • Get Selected Range: Returns the given range as a string that can be used\
    \ in other\n+   activities that work with ranges.\n+   \n+   • Insert Column:\
    \ Like Add Data Column, this activity directly adds a new table\n+   column at\
    \ a particular position in the Excel file itself.\n+   \n+   • Delete Column:\
    \ Removes the specified Excel table column from the spreadsheet.\n+   The deletion\
    \ takes place based on the column name.\n+   \n+   • Insert/Delete Columns: This\
    \ activity can either add blank columns or remove\n+   existing columns from a\
    \ spreadsheet.\n+   \n+   • Insert/Delete Rows: This activity can either add blank\
    \ rows or remove existing\n+   rows, based on the action type the user selects.\n\
    +   \n+   • Auto Fill Range: Like auto-population in Excel, this activity will\
    \ apply the given\n+   formula over a specified range in a spreadsheet.\n+   \n\
    +   • Copy Paste Range: Enables the user to copy and paste an entire range from\n\
    +   one spreadsheet to another. The copied content can include values, formatting,\n\
    +   and formulas.\n+   \n+   • Lookup Range: Similar to the Lookup function in\
    \ data tables and Excel, the\n+   Lookup Range activity can search for a value\
    \ in all cells in a given range.\n+   \n+   • Remove Duplicate Range: Deletes\
    \ all duplicate rows in the specified range.\n\n# Excel table activities\n\nThe\
    \ table activities interact with the tables you have created in Excel spreadsheets.\
    \ The\nactivities allow you to perform the basic functions related to sorting,\
    \ filtering, and\ncreating tables. The following activities are available to complete\
    \ the previously mentioned\nfunctions on tables:\n\n+   • Create Table: Creates\
    \ the specified table in the specified range."
  merge: -1
  img_proc: true
- pgno: 287
  md: '+   - **Filter Table**: Filters a table on an Excel spreadsheet based on the
    conditions provided. The **Filter Table** activity can be used with **Read Range**
    when you want to read filtered results. The filtering action is identical to the
    filter function in Excel. Once the filter is applied, the rows that do not qualify
    will be hidden in the spreadsheet.


    +   - **Sort Table**: Sorts a specified table based on the values of a given column
    in ascending or descending order.


    # ## Excel file activities


    The file activities are mainly associated with the file itself:


    +   - **Save Workbook**: Saves a specified workbook. The **Excel Application Scope**
    activity automatically saves the file before exiting if the **Save Changes** option
    is enabled in the **Properties** panel. However, this activity can also be used
    to save the file.


    +   - **Close Workbook**: Enables the user to close a specific Excel spreadsheet.


    # ## Cell color activities


    Preparing Excel files often requires a little bit of coloring to highlight specific
    values. The activities under the cell color subcategory enable the user to perform
    coloring actions as follows:


    +   - **Get Cell Color**: Returns the background color of a specific cell in an
    Excel file and stores it in a `Color` variable.


    +   - **Set Range Color**: Enable the user to change the background of a specified
    cell range to the user-specified color. The input is a `Color` variable type.


    # ## Sheet activities


    The sheet activities provide the ability to perform different actions related
    to Excel worksheets, such as copying and retrieving the sheet information. The
    following activities enable you to work with Excel sheets:


    +   - **Copy Sheet**: This enables the user to create a copy of a sheet in the
    same Excel file or a different file.


    +   - **Get Workbook Sheet**: Retrieves the name of the sheet by its index.


    +   - **Get Workbook Sheets**: Retrieves all the available sheets in a workbook
    file as a `String` array.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# # Pivot table activities


    Working with financial information often requires pivoting and converting the
    data into a more graphical and summarized format for better insights. Usually,
    once the pivot is created, it needs refreshing. UiPath provides two activities
    to create and refresh pivot tables:


    +   - **Create Pivot Table**: Creates a pivot table using specified parameters.
    The data in Excel has to be first converted into a table in order to use this
    activity for the `Pivot` function.


    +   - **Refresh Pivot Table**: Enables the user to refresh a pivot table to update
    its content based on the source.


    # # Macro activities


    Microsoft Excel is capable of automating simple application-specific actions using
    macros and VB scripts. UiPath can interact with the macros available and even
    create macros using VBA scripts:


    +   - **Execute Macro**: Executes a macro available in a `.xlsm` file


    +   - **Invoke VBA**: Invokes a macro available in another file using VBA scripts


    Based on the content we covered, you are now familiar with the activities that
    UiPath can perform on Excel files. A few of these activities function similarly
    to data table activities. However, the rest mainly focus on functions that Microsoft
    Excel offers. The following section focuses on some hands-on practice on some
    of the Excel activities. The practice session does not cover all the activities
    we described. However, the practice session will help you to better understand
    how to use the activities discussed, when needed.


    # # Practicing Excel automation


    In this section, you will practice the concepts learned by interacting with some
    data in an Excel file. The Excel file consists of employee information such as
    `employee ID`, `first name`, `last name`, `hourly rate`, and `work hours`. Our
    task is to go through the data and add two new columns in the Excel file.


    One column should include the full name (combining the first and the last name)
    and the other column should consist of the total payment (the hourly rate * work
    hours) for the employee. Once the report is generated, the robot should also filter
    the data to find employees who earn more than $2,000 and create a separate Excel
    file for this data.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'Go through the following steps to complete this task:


