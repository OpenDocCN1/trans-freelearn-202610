- pgno: 417
  md: '# # Create Test Bench


    Building automation in UiPath Studio is just like LEGO, where you keep on adding
    blocks to complete a character. For example, let''s say you are building a LEGO
    robot. Ideally, you build the hands or legs of the robot individually to test
    whether they move correctly as expected and then attach them to the body. With
    the help of **Create Test Bench**, the same scenario can be created in UiPath
    Studio while building a bot. So, using **Create Test Bench** allows you to create
    automation building blocks that can then be individually tested and added to the
    final workflow.


    From the **Activities** panel, you can choose any activity and create a test bench
    for it:


    +   1. To do so, right-click on the selected activity and choose **Create Test
    Bench** from the context menu:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_417_0.png)


    Figure 13.39 – Creating a test bench for the Write Line activity'
  merge: -1
  img_proc: true
- pgno: 418
  md: 'Clicking on **Create Test Bench** will open it in a test bench workflow. The
    Test Bench workflow is a temporary sequence that''s not part of the current project
    and is discarded when closed:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_418_0.png)


    Figure 13.40 – A temporary test bench workflow created


    The selected activity is automatically added to a new temporary sequence file
    not included in your project. You can edit the properties of this activity or
    add new activities and later debug the test bench workflow.


    +   2. To save the file, use the **Save as** option in the **DESIGN** ribbon bar
    to add a filename, and save it to the same file path as your project. Later, you
    can use the **Invoke Workflow File** activity and call the sequence in the desired
    workflow.


    > > **Note**

    > > **Create Test Bench** does not work with the `Pick Branch` activity because
    it requires the `Pick` activity as a container to execute.


    # Run to this Activity


    Let''s say, for example, you have five activities inside a workflow, and you want
    to run till the second activity only. Then, choose the **Run to this Activity**
    option from the context menu by selecting the third activity.'
  merge: -1
  img_proc: true
- pgno: 419
  md: 'Let''s understand this concept with the help of an example. In the Main.xaml
    file, we have five Write Line activities inside a Sequence activity. The Write
    Line activities print messages starting from “First”, “Second”, and so on till
    “Fifth”:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_419_0.png)


    Figure 13.41 – The Write Line activities inside a sequence'
  merge: -1
