- pgno: 243
  md: '# Exploring UiPath Selectors


    Selectors are one of the major and most important topics when it comes to automation.
    Selectors are automatically created using standard XML code, which identifies
    the user interface elements. The XML code consists of several nodes, which is
    a combination of tags and attributes in a structured and hierarchical order.


    In this chapter, you will learn what selectors are, how they work, and how to
    use the correct selector types and settings when automating. You will learn about
    the user interface, how to perform element exploration, and how to fine-tune selectors
    to improve the accuracy of element identification.


    In this chapter, we will cover the following topics:


    +   • Tags and attributes of selectors

    +   • Selector Editor

    +   • UI Explorer

    +   • Full versus partial selectors

    +   • Dynamic selectors

    +   • An example implementation of dynamic selectors using Packtpub.com'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Technical requirements


    This chapter requires that you have UiPath Studio and UiPath Robot installed,
    along with a basic understanding of Studio''s user interfaces. Please refer to
    Chapter 2, UiPath Ecosystem, to learn about the basics of Studio.


    # Tags and attributes of selectors


    In this section, we''ll learn more about how to use the tags and attributes of
    selectors. As we mentioned previously, selectors consist of a group of nodes of
    a specific element in a detailed hierarchical order. This is very similar to the
    address order we use for identification; that is, country > city > ZIP code >
    street name > street number > apartment number. The structure of selectors can
    be represented as follows:


    ```

    <Node_1 >

    <Node_2>

    ......

    <Node_N>

    ```


    Figure 8.1 – Structure of selectors


    <Node 1> will primarily be the parent node or root node; the last node, <Node
    n>, will be the one you are likely to be interested in because it usually represents
    the UI element and the previous nodes are the parents of that element. Each node
    has attributes to help you identify the element in the user interface such as
    windows, tables, links, text boxes, buttons and so on and it''s essential to understand
    the attributes of each node to apply constant values to accurately identify the
    correct element. Let''s look at an example of such selectors:


    ```

    <wnd app=''notepad.exe'' cls=''Notepad'' title=''Untitled - Notepad'' />

    <wndcls=''Edit'' />

    <ctrl name=''Text Editor'' role=''editable text'' />

    ```


    Figure 8.2 – Example of selectors


    In the <Node 1> code section, wnd (Window) is a tag and app=''notepad.exe'' cls=''Notepad''
    title=''Untitled – Notepad is an attribute. Similarly, in <Node 2>,Ctrl (Control)
    is a tag and name=''Text Editor'' role=''editable text'' is an attribute.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Now that you are aware of selectors and their usage, you need to how to edit
    them so that you can identify the target element based on your requirements. We
    will learn how to edit selectors in the next section.


    # # Selector Editor


    Selectors are usually stored inside the **Properties** panel of the activities
    used in the workflow and can be accessed via **Input > Target > Selector**, in
    the **Properties** window as shown in the following screenshot:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_245_0.png)


    Figure 8.3 – Selector in Properties'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'The Selector Editor tool helps you view the selectors that have been used and
    edit their attributes to fine-tune the selector for better reliability. To access
    the tool, you can either click on the three dots in the Properties panel, as highlighted
    in the previous screenshot, or click on the Edit Selector option via the Options
    menu for any specific activity. In this case, the activity used in Type Into,
    as shown in the following screenshot:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_246_0.png)


    Figure 8.4 – Edit Selector


    A new window will appear, where you have multiple options. Each has significance
    in terms of overcoming any selector challenges. Let’s explore these options one
