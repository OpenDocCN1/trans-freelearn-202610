  md: '# Contributors


    # About the authors


    **Niyaz Ahmed** is a technical program manager at UiPath, where he is working
    toward enabling the future and current workforce for the automation-ready world.
    He manages the UiPath Academic Alliance and Learning Partner program by working
    with leading institutions, including universities, colleges, and high schools.
    He is also an instructor at Udacity for the RPA Developer Nanodegree program.
    In addition, he continues to evangelize RPA by mentoring learners to develop professional-level
    skills focused on developing and deploying software robots.


    > *A special thanks to Alok Shrivastava, Rajesh Nambiar, Leah Hojem, and all my
    colleagues at UiPath who have helped me in the different phases of the book.*


    **Lahiru Fernando** is a UiPath MVP, executive team lead for RPA, UiPath community
    leader, mentor, lecturer, and public speaker, and has over 11+ years of experience
    in the IT industry. He started his career in 2011 after completing a degree in
    specialized software engineering at Staffordshire University. He has been engaged
    in multiple business intelligence projects in the banking, finance, market research,
    and agriculture sectors. Moving into RPA in 2019, he has led multiple successful
    RPA projects in the finance, retail, banking, child welfare, oil and gas, telecommunication,
    and apparel sectors as a lead RPA solution architect. He also leads the RPA enablement
    and training fronts for Boundaryless Automation.'
  merge: -1
  img_proc: true
- pgno: 5
  md: Rajaneesh Balakrishnan is the founder of 2AutomateAnything and has been a UiPath
