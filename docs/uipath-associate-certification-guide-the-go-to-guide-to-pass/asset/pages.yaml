- pgno: 95
  md: '+   - **Global Value**: If enabled, every user will receive the value unless
    it is explicitly overridden by the user in the Specific Value section.


    +   - **Add robot Asset Value**: The asset can provide different values for each
    user/robot if configured. The default is a single value.


    UiPath Studio provides a set of activities that enables interaction with assets
    in Orchestrator. The following describes each activity and how they interact with
    assets:


    +   - **Get Asset**: Retrieves the value of the specified asset


    +   - **Set Asset**: Updates the specified asset with a new value


    +   - **Get Credential**: Retrieves credentials from the specified Credential
    type asset


    +   - **Set Credential**: Updates the specified Credential type asset with new
    credentials


    # Queues


    **Queues** offer the capability to store and process items in the queue in sequential
    order. The records added to the queue are known as **transaction items**. The
    execution order of transactions is decided based on the priority and SLA levels
    of each transaction item. One or multiple robots access the queue to process each
    transaction separately. The queue can also trigger jobs upon inserting new queue
    items through the **Queue Trigger** option. There are many advantages of using
    queues in complex automation solutions. The following are some of these advantages:


    +   - A central repository for all transaction items.


    +   - Reporting capability for each transaction item as well as for the queue
    itself.


    +   - In-built transaction item prioritization based on transaction priority and
    **Service-Level Agreement (SLA)** levels. SLAs are the agreed service delivery
    timelines that everyone in the organization needs to follow to ensure customer
    satisfaction and quality delivery.


    +   - Efficient processing of items using one or many robots.


    +   - Advanced auto retrying capabilities of failed transaction items.


    These capabilities come in handy when processing large amounts of data that require
    independent processing and monitoring. For example, processing customer complaints,
    customer loan application processing, and client enrollments represent excellent
    use cases for queue processes. These examples are ideal candidates for processing
    queues because each complaint or each loan application is independent of one another.
    Each item has its unique characteristics that require separate processing.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Similar to assets, folders in Orchestrator house queues. A queue available
    in one folder is not visible to another folder. Figure 3.26 shows the option available
