- pgno: 333
  md: '# When to use which types of recording?


    Let''s discuss the different types of available recordings, their usage, advantages,
    and disadvantages, as shown in Figure 10.50:


    | Recording Type | Usage, Advantages, and Disadvantages |

    |---|---|

    | Basic | • Best suited for linear workflows where not many windows or web pages
    are involved.

    • It is the slowest type of recording.

    • Can automate desktop and web applications.

    • SimulateType / SimulateClick is not enabled (False) by default. |

    | Desktop | • Suitable for all types of desktop applications where multiple windows
    and web pages are involved.

    • Generates partial selectors for each activity.

    • It is faster than the Basic recording. |

    | Web | • Best suited for recording web applications where multiple pages and
    actions are involved.

    • Generates partial selectors for each activity (for example, Attach Browser).

    • It is faster than the Basic recording.

    • SimulateType / SimulateClick is enabled (True) by default. |

    | Image | • Only use it if you want to record virtualized environments (such as
    Virtual Networking Computers, virtual machines, and Citrix) or SAP.

    • It allows only image, text, and keyboard automation, and requires explicit positioning.
    |

    | Native Citrix | • Only used in native Citrix automation projects.

    • As a prerequisite, you need to install the UiPath Citrix extension on the client
    machine and the UiPath Remote Runtime component (Citrix XenApp) on the application
    servers.

    • You can use activities such as Click, Type Into, Get Text, and Extract Data.

    • Selectors are natively generated for Citrix application elements. |

    | Computer Vision | • It uses computer vision neural networks to identify UI elements
    such as buttons, texts, and checkboxes.

    • It does not use selectors.

    • Used to record virtualized environments (such as VNC, virtual machines, Citrix,
    and remote desktops).

    • Automating local applications where the other mentioned recording options are
    not reliable. |


    Figure 10.50 – Different types of recordings and their uses'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'This has provided us with better clarity about recordings and guided us to
    select the right recording tool for different situations.


    # Advanced UI Automation tools


    Let''s discuss a few advanced recording options available to automate complex
    GUIs, such as Citrix, SAP, and mainframes:


    +   • **Image**: This recording is used to record images, text, and keyboard inputs,
    and is suitable for virtual environment automations such as VMs, Citrix, SAP,
    and mainframes. It captures the exact user interface position of the element and
    the value of the coordinates of elements to automate the GUI.


    +   • **Native Citrix**: This recording is used to record images, text, and keyboard
    inputs, and is suitable for applications within the Citrix environment. It is
    like the desktop recorder, which can be used for recording different types of
    applications inside the Citrix environment.


    +   • **Computer Vision**: This recording is mainly used to record images, text,
    and keyboard inputs, and is suitable for applications within the Citrix environment
    and Windows environment where any other previously discussed recording options
    failed to identify UI elements. It is a smart recorder that uses a built-in neural
    network to capture the UI element more accurately to overcome any selector inconsistency.


    +   • **Object repository**: An advanced feature used to capture UI elements from
    applications and store them as **reusable objects** in the repository so that
    they can be used as and when required, or can be shared with other projects. These
    objects can be dragged and dropped from the object repository to the workflows
    for faster automation development, which is easily manageable, reusable, and reliable.


    We have discussed a few advanced concepts and have seen how the GUIs such as Citrix,
    mainframes, and SAP can be automated using different tools and techniques. In
    the next section, we will explore a bit more about the input and output methods
    to develop a more efficient automation solution.


    # Input actions and methods


    Automation requires certain properties to be configured to work seamlessly during
    the execution of the process. To perform either foreground or background automation,
    the input needs to be actioned in a GUI either directly by the user or by the
    robot. There are three types of input methods, which we will discuss now.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Default or hardware events


    The default application mimics a mouse event or keyboard event using the hardware
    driver to communicate with the GUI. This is selected when **SendWindowMessages**
    and **SimulateType** are disabled by default, as shown in Figure 10.51. In the
    case of this event, the robot exactly mimics human actions, such as moving the
    cursor and clicking on a UI element. The UI elements need to be visible for this
    event to be successful.


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_335_0.png)


    Figure 10.51 – Default method


    The key characteristics of the default method are as follows:


    +   - It is 100% compatible with all applications.

    +   - It runs only in the foreground and no background execution is possible.

    +   - The execution speed is generally slow and is only 50% of Simulate Type.

    +   - This supports hotkeys by default.

    +   - It does not auto-empty the input fields by default, which means it does
    not clear any existing values available in the input field that may include any
    spaces or previous executed input values.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# # SendWindowMessages


    SendWindowMessages mimics a mouse event or keyboard event by sending a specific
    message directly to the GUI element. This can be activated when SendWindowMessages
    is selected in the Options section, as shown in Figure 10.52. The UI element does
    not need to be visible for this event to be successful as its work in the background.


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_336_0.png)


    Figure 10.52 – SendWindowMessages


    The key characteristics of the SendWindowMessages method are as follows:


    +   * It is 80% compatible with all applications.

    +   * It runs only in background execution.

    +   * The execution speed is slightly better than the default and is around 50%
    of Simulate Type.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '+   - This supports hotkeys by default.


    +   - It does not auto-empty the input fields by default.


    # # SimulateType


    The SimulateType method mimics a mouse event or keyboard event by communicating
    using the API, which provides a set of functions that allows applications to access
    specific features or data from the target application and is the fastest of all
    three input methods. This is selected when the SimulateType method is selected
    in the Options section, as shown in Figure 10.53. It is compatible with both desktop
    and web applications, and the UI element does not need to be visible for this
    event to be successful as its works in the background.


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_337_0.png)


    Figure 10.53 – SimulateType'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'The key characteristics of the SimulateType method are as follows:


    +   • It is 99% compatible with web applications and 60% compatible with desktop
    applications.

    +   • It runs in both foreground and background execution.

    +   • The execution speed is the fastest of all three types of input actions.

    +   • It does not support hotkeys by default.

    +   • It auto-empties the input fields by default.


    In this section, we have explored the different input methods and have seen how
    to use them in practical situations. In the next section, we will learn about
    output data extraction using **output methods**.


    # # Output actions and methods


    Automation requires certain screen scraping methods and scrape options to be configured
    to extract values from GUI elements, PDFs, or documents. There are three types
    of output methods, which we will discuss here.


    # # FullText


    **FullText** is the default output method and is the most frequently used. You
    need to follow the next steps to work with the FullText method:


    +   1. Click on **Screen Scraping** from the **Design** panel, as shown in _Figure
    10.54_, which gives you a cursor to select the **Target** element:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_338_0.png)


    Figure 10.54 – Screen Scraping'
  merge: -1
  img_proc: true
- pgno: 339
  md: '2. Click on the element to be extracted, which will open **Screen Scraper Wizard**,
    and then complete the following:


    +   - I. Select **FullText (1)** for Scraping Method.

    +   - II. Check **Ignore Hidden (2)** under **Scrape Options** to ignore any hidden
    texts.

    +   - III. Click on the **Refresh (3)** button if there''s any change in **Scrape
    Options**.

    +   - IV. Verify the output in **Scrape Result Preview (4)**.


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_339_0.png)


    Figure 10.55 – Screen Scraping Wizard


    The characteristics of the **FullText** scraping method are as follows:


    +   - The fastest execution of all scraping methods.

    +   - The accuracy of the method is 100%.

    +   - It supports background execution.

    +   - It does not extract text position.

    +   - It can extract hidden text.

    +   - It does not extract output from Citrix.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Native


    The Native method is capable of extracting data from applications that are compatible
    with the **graphics device interface (GDI)** and **Microsoft API**, which are
    used for identifying graphical objects.


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_340_0.png)


    Figure 10.56 – Screen Scraping Wizard – Native


    The characteristics of the Native scraping method are as follows:


    +   - It has the fastest execution and the rate of speed is 80% of FullText.

    +   - The accuracy of the method is 100%.

    +   - It does not support background execution.

    +   - It can extract text position.

    +   - It cannot extract hidden text.

    +   - It does not extract output from Citrix.


    # OCR


    If the other two methods do not provide the desired results, then it is advisable
    to go for **OCR**. That extracts data from scanned documents or images and converts
    the inputs into machine-readable text. It is not 100% accurate and works with
    different types of applications. By default, OCR uses the **Google Tesseract**
    and **Microsoft Modi OCR** engines.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '![](img/84b06ad2832c53c5f677f8ce4c80f184_341_0.png)


    Figure 10.57 – Screen Scraping Wizard – OCR


    The characteristics of the Native scraping method are as follows:


    +   - It is the slowest of all three output methods and a rate of speed of 30%
    of FullText.

    +   - The accuracy of the method is 98%.

    +   - It does not support background execution.

    +   - It can extract text position.

    +   - It cannot extract hidden text.

    +   - It can extract test outputs from Citrix.


    In this section, we have explored the different output methods and have seen the
    applications of each method to use in extracting outputs from various applications.


    # Summary


    We have explored everything about UI Automation interaction in this chapter: analyzed
    how to deal with different UI Automation activities, the different types of recording,
    and different types of input and output methods. We have explored more about activities
    and have performed a few projects to scrape data from web applications and desktop
    applications. We have also introduced some advanced UI Automation concepts, such
    as image and computer vision recording.


    In the next chapter, you will be working with PDF automation, where you can implement
    the concept of UI interaction to retrieve data from PDFs using Get Full Text as
    well as OCR. You will be also implementing most of the activities, input, and
    output methods to deal with PDF data.'
  merge: -1
  img_proc: true
