  md: '+   2. Use the **Immediate** panel to check whether the data present in the
    **age** variable is numeric. Providing **age.IsNumeric** prints the answer as
    **false**:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_427_0.png)


    Figure 13.54 – The Immediate panel


    +   3. Add the **age** variable to the **Watch** panel to check what value it
    is currently holding:


