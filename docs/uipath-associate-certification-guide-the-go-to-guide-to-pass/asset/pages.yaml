- pgno: 343
  md: '# # Automating PDF Data Extraction


    In previous chapters, we discussed different interaction methods that you can
    use to interact with multiple applications. In addition, we discussed how PDF
    files play a significant role in our day-to-day operations. PDF files are one
    of the most used document types across organizations/individuals to share information.
    The information shared in PDF files could include invoices, purchase orders, letters,
    financial information, legal documents, and more. Therefore, it is essential that
    you gain an understanding of how you can use UiPath to extract data from PDF files
    to perform manual actions automatically.


    This chapter focuses on learning how to automate PDF files using UiPath and what
    activities are available to perform a successful PDF automation.


    This chapter consists of the following sections:


    +   * Creating robots that read PDF text

    +   * Extracting text from a PDF using the Extract PDF Text and Extract PDF with
    OCR activities

    +   * Extracting PDF text using Screen Scraping

    +   * Extracting single dynamic values from PDF files

    +   * Extracting individual values using the Anchor Base activity'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'At the end of this chapter, you will have a clear understanding of the most
    common methods used to perform PDF automation.


    # Technical requirements


    Before starting with this chapter, please ensure UiPath Studio and the robot have
    been installed.


    This chapter requires a general idea of how to use Studio to create variables
    and simple workflows. In addition, a general idea of how to work with UI selectors
    (as explained in Chapter 10, Exploring User Interfaces and User/Robot Interactions)
    will help you to understand some of the concepts presented in this chapter. Further,
    you must have Adobe Reader installed on your machine.


    # Creating robots that read PDF files


    Based on our previous experience in creating automation solutions, we know that
    the UiPath solution, by default, has the following dependencies:


    +   - UiPath.Excel.Activities

    +   - UiPath.System.Activities

    +   - UiPath.UIAutomation.Activities

    +   - UiPath.Mail.Activities


    However, the default activities do not contain specialized activities for PDF
    automation. Therefore, we need to add a new dependency to the automation project
    that requires PDF interaction. Let''s go through the following steps to create
    a project that contains PDF automation activities:


    +   1. Open UiPath Studio and create a new project by providing the **Project
    Name** and **Path** details.

    +   2. Once the project has been opened, click on the **Manage Packages** button
    from the top-level ribbon of the **Design** tab. This will open the **Manage Packages**
    window, as follows:'
  merge: -1
  img_proc: true
- pgno: 345
  md: '![](img/84b06ad2832c53c5f677f8ce4c80f184_345_0.png)


    # Figure 11.1 – The Manage Packages option


    +   3. Select the All Packages option in the Manage Packages window and search
    for UiPath.PDF.Activities using the Search option.


    +   4. Select UiPath.PDF.Activities from the package list panel. Then, click on
    the Install button to install the package for your solution:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_345_1.png)


    # Figure 11.2 – Installing UiPath.PDF.Activities


    +   5. Click on the Save button to complete the installation process and close
    the Manage Packages window.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '6. Click on the Activities panel and navigate to App Integration and PDF to
    locate all of the activities related to PDF interaction.


    Now we are ready to build our first PDF automation. However, first, we need to
    understand the usage of each activity:


    +   - **Export PDF Page As Image**: This option enables a user to export a specified
    page of a PDF file as an image file. This feature can be used whenever a user
    needs to export specified pages from a large PDF file into multiple files for
    later usage.

    +   - **Extract Images From PDF**: This option enables a user to extract all of
    the images of a PDF file and save them in a specified folder for later use.

    +   - **Extract PDF Page Range**: This option enables a user to extract specified
    pages or a range of pages into another PDF file. Using this activity to only extract
    the required pages can reduce any unnecessary processing times in the downstream
    process actions. A user can provide the page range or individual page numbers
    separated by a comma, as shown in the following example: "1, 2, 10, 15-20".

    +   - **Get PDF Page Count**: This option returns the number of pages that are
    available in a specified PDF file.

    +   - **Join PDF Files**: This option enables a user to merge two specified PDF
    files into one PDF file.

    +   - **Manage PDF Password**: This option enables a user to password protect
    or unprotect a PDF file.

    +   - **Read PDF Text**: This option reads all of the text from a specified PDF
    file and stores the extracted text inside a string variable. This activity can
    only read text from computer-generated PDF files. Note that the images or scanned
    documents of the PDF file are not extracted through this activity.

    +   - **Read PDF with OCR**: This option enables users to use any OCR engine to
    extract and read a PDF file text. This activity enables the user to extract text
    from a PDF file that contains scanned documents.

    +   - **Read XPS Text**: In addition to the PDF files, the PDF activities also
    enable a user to read text from XPS files and store the data inside a string variable.
    This activity is similar to the **Read PDF Text** activity.'
