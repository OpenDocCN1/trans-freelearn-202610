    a name, data type, scope, and a default value for the new variable.


    +   • **Through the Designer panel**: Use the activity you want to associate the
    argument

    +   with, and press the *Ctrl + M* shortcut keys to enable argument creation mode

    +   in the **Designer** panel. You can provide an argument name and do additional

