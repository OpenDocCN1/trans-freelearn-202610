- pgno: 299
  md: '# # 10


    Exploring User Interfaces and User/Robot Interactions


    The automation of **user interfaces** (**UIs**) is one of the most important automation
    topics and is most frequently used in today’s automation world. UI elements are
    the building blocks of the UI (for example, windows, text fields, buttons, drop-down
    menus, checkboxes, and text boxes). Your robot should be capable of communicating
    with the UI elements easily to perform actions such as clicking, typing inputs,
    and reading output values to achieve a perfect automation solution.


    As part of this chapter, you will understand various techniques to interact with
    UI elements faster and more easily. You will learn about recorders and see how
    to efficiently use them for faster automation. You will also learn about some
    advanced UI automation, such as image and text automation. Finally, you will learn
    more about input and output actions, and explore various useful methods for effective
    automation.


    This chapter consists of the following sections:


    +   - Introducing UI interactions

    +   - Recording the graphical user interface'
  merge: -1
  img_proc: true
- pgno: 300
  md: '+   - Advanced UI automation

    +   - Input actions and methods

    +   - Output actions and methods


    # Technical requirements


    This chapter requires you to have UiPath Studio and Robot installed, along with
    a basic understanding of Studio UIs, variables, data types, control flows, and
    data manipulation. You can refer to Chapters 5 to 9 to gain all the required knowledge.


    # Introducing UI interactions


    The **graphical user interface (GUI)** is made up of various graphical objects,
    such as windows, text fields, buttons, dropdowns, checkboxes, text boxes, tables,
    and URLs.

    UiPath can seamlessly interact with most types of desktop and web applications
    as it

    has deep integration with major GUI frameworks, such as HTML, Java, .NET, and
    SAP.

    GUI automation interacts with these GUI objects by clicking, typing, selecting,
    checking values, copying data, and pasting data using various UiPath activities.
    The interaction

    of the UiPath robots exactly replicates the human interaction in a logical, faster,
    and

    error-free way as instructed by the RPA developer who designs or develops the
    process

    workflows or automation projects.


    # Foreground versus background automation


    **Foreground processes** are run by attended robots and are usually performed
    under

    human supervision. The Robot uses foreground activities to interact with the GUI

    elements. **Background processes** are performed by unattended robots in a dedicated

    machine that uses background activities. You need to use the appropriate activities
    to

    achieve efficient UI automation and, for that, let''s explore the key UiPath UI
    Automation

    elements in UiPath Studio as follows:


    +   - **Activities**: This instructs the Robot to perform actions on the GUI bases
    on the type

    +   of activities selected, configured inputs, properties of activities, and output
    generated

    +   by the GUI. As a prerequisite, you need to ensure the `UiPath.UIAutomation.Activities`
    dependency package is available by default in the **Dependencies** node. In case
    the package is not available or has been removed by mistake, you need to install
    the same package from **Manage Packages**. We will explore more about the key
    activities in the upcoming sections, as shown in *Figure 10.1*:'
  merge: -1
  img_proc: true
