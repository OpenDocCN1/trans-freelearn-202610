  img_proc: true
- pgno: 33
  md: 'We, as humans, interact with software applications by simple mouse or keyboard
    actions. However, we perform these steps in different environments such as our
    desktop or laptop computers and remote or **virtual machines (VMs)**. Today''s
    technology has allowed RPA robots to mimic the same actions with higher precision,
    irrespective of the environment in which they are working. All activities performed
    by robots require monitoring to ensure the best utilization of the digital workforce.
    Also, monitoring allows administrators to track and monitor execution times and
    failures and track the idle times of robots. Today''s data analytics power provides
    precise tracing and analysis of such data to calculate the **return on investment
    (ROI)**, utilization, robot idle times, and so on. Hyperautomation is a concept
    that not only covers the development and monitoring of robots but also enables
    organizations to precisely monitor and analyze the business process itself. Business
    process mining is a concept that hyperautomation offers to explore the process
    and identify the nature of the process, exceptions, different methods of performing
    the procedure, steps carried out, bottlenecks, and automation possibilities.


    RPA today is not just one technology—it is a combination of multiple technologies
    such as AI, ML, NLP, ICR, and much more. The combination allows RPA robots to
    perform various simple-to-complex activities without human intervention. RPA has
    to be applied wisely to business processes, and there are many factors to consider
    to identify a business process for automation.


    # # Identifying processes for RPA


    There are a few main characteristics we look at when deciding the automation potential
    of a process. At a high level, we could categorize these characteristics into
    two main segments, as follows:


    +   - Process fitness

    +   - Automation complexity'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'A few factors are involved in the process of calculating the fitness of a process
    for automation. The following table illustrates the factors considered in identifying
    the fitness of a process:


    | Process fitness | |

    |---|---|

    | The process should be rule-based | The decisions taken on the data processed
    are required to be backed by a predefined set of rules. |

    | Low exception rates | The process should not have many scenarios where we cannot
    complete the process due to unknown conditions. |

    | Repetitive actions | Considering the repetitive nature of the processes, they
    require further categorization:

    • Manual and non-repetitive: Processes that require manual executions, but the
    steps executed in each run are different and nonrepetitive. The functions of such
    nature are not suitable for automation because automation requires a standard
    set of steps.

    • Manual and repetitive: The processes that require manual execution and the steps
    executed in each run are the same and repetitive. The functions of such nature
    are highly suitable for automation. However, the repeated actions require proper
    standards to ensure high efficiency.

    • Semi-automated and repetitive: The steps performed in the process are repetitive,
    but some of the steps are already automated using macros or other automation methods.
    With proper analysis of the process, possible automation opportunities can be
    identified.

    • Automated: If the process is already automated, introducing RPA is not required.
    |

    | Standard input | Inputs provided to the process should either be electronic
    and easily readable, or readable using the technology that RPA is associated with
    (such as OCR). |

    | Stable process | The process should not undergo frequent changes in the steps
    performed. |'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'A business process should meet all the factors listed in Figure 1.2 to qualify
    for automation.

    In addition to the process fitness factors, the automation complexity is also
    one crucial

    aspect of identifying a suitable automation process. The following screenshot
    illustrates the

    required characteristics to consider to determine the process automation complexity:


    | Automation Complexity | |

    |---|---|

    | Types of applications | Some of the applications we use today, such as the Office
    suite, are easy to automate. However, we do come across very complex applications
    such as mainframe applications that increase the automation effort. A complete
    process may require the interaction of multiple applications of such nature. This
    point plays a significant role when identifying the automation suitability of
    a process. |

    | Number of screens that require interaction in the application | Similar to a
    human worker, RPA robots interact with the elements shown on a specific screen
    of an application. The actions performed might require navigation to multiple
    screens of an application. The robot is programmed to perform different actions
    based on the elements shown on the application screen. The higher the number of
    screens that require interaction, the more effort needed to program the robot.
    |

    | Types of input | As stated already, the more standard the input is, the less
    effort is needed to manipulate and prepare the data. However, there are cases
    where the information is not standardized, and it requires conversion to a standard
    format, which requires additional effort. The complexity depends on how standard
    the input is. For example, if the RPA robot requires data extraction from a paragraph
    of text, it is one of the most complex inputs. On the other hand, if the RPA robot
    requires data extraction from a structured Excel file, it is one of the least
    complex inputs. |

    | Number of input | The higher the number of inputs, the higher the complexity
    is. |

    | Business decisions | The higher the number of decisions taken within the process
    flow, the higher the complexity is. |


    Figure 1.3 – Process complexity factors in identifying a process for automation'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Deciding on the automation suitability of a process requires consideration
    of all the factors discussed. The process is mapped into a process assessment
    matrix based on the results of the factors discussed to compare and identify the
    best process. The following diagram illustrates a process assessment matrix that
    each process is mapped onto after assessment. Each process is assessed based on
    the complexity and benefits it generates after automation and is mapped into the
    matrix’s respective box. The matrix shown here plays a significant role in prioritizing
    and categorizing the assessed processes:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_36_0.png)


    Figure 1.4 – Process assessment matrix


    Having identified which bucket the process falls into, the organization can prioritize
    the automation initiatives based on the previous matrix. Organizations can prioritize
    quick-win processes in the initial stages, as those are less complicated and provide
    the highest benefits within a shorter period. Low-hanging fruits are the best
    to start off with and demonstrate how automation improved the way people work.
    The processes that fall into the long-term improvements bucket are usually ignored
    in automation since they do not offer a significant advantage compared to the
    effort required. The processes that fall into the low-hanging fruits and must-do
    improvements categories get prioritized for RPA based on the organization''s strategic
    plans. Additionally, the processes that fall into the must-do improvements category
    usually require standardization to improve the process. The improved processes
    are assessed again and prioritized based on the bucket they fall into after the
    assessment.


    It is not a good practice to automate every process in the organization or the
    department. It is important to identify the benefits gained, efforts and resources
    needed, and the suitability of the process itself for automation before implementing
    RPA. The inability to perform process assessment and standardization where necessary
    may lead to more inefficiencies and high costs after applying RPA without a proper
    strategy. Hence, the following assessment strategy is crucial in any RPA project.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# # Understanding the stages of an RPA journey


    Analyzing the processes and correctly categorizing them can result in obtaining
    quick wins in RPA projects; however, not all functions are quick wins. To achieve
    long-term effects from these projects, the organization must have the proper mindset,
    proper resources, and reasonable goals to get the best outcome. Hence, every RPA
    project requires the involvement of multiple essential resources during different
    stages of the journey.


    Every RPA project needs to go through six stages during its automation journey.
    These stages are depicted in the following diagram:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_37_0.png)


    Figure 1.5 – RPA journey


    The following sections describe each stage in more detail.


    # ## Discovery


    Discovery is the initial phase of any RPA project. This phase’s primary goal is
    to spread the word about automation within the organization and find the most
    suitable process candidates for automation. There are two approaches to perform
    discovery, as follows:


    +   • The organization already knows the process that requires automation.

    +   • Discover all possible candidate processes for automation.


    If the organization does know the process that requires automation, the scope
    of the discovery phase will be limited to the already identified processes. Critical
    resources in the RPA team, such as BAs and RPA solution architects, can sit together
    with the business team to understand the process in detail. The RPA experts and
    the business teams conduct multiple requirement-gathering sessions to capture
    all the information needed to understand the process. The teams’ tasks include
    process assessment and detailed mapping of the as-is process. The BAs draw the
    as-is process in detail, explaining all the subprocesses involved. The process
    map helps to discover standardization requirements and the steps that require
    automation. The RPA team documents all the information and presents two standard
    documents, as outlined here:


    +   • **Process definition document (PDD)**: This contains details about the as-is
    process and how it is standardized and automated.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '+   • Solution design document (SDD): This contains all the technical details
    of the automated solution.


    However, if the organization does not have a specific process that requires automation,
    it requires a thorough analysis of all the available functions to identify possible
    candidates. In such scenarios, the RPA experts such as BAs and solution architects
    sit together with all the critical business people to understand the existing
    processes and identify suitable automation opportunities. The team follows the
    same steps as those explained previously to carry out the assessment. All the
    analyzed processes are documented and put into the assessment matrix discussed
    in the previous section. Once the assessment matrix is updated, the most important
    and the most suitable business processes are selected based on different factors
    such as cost, ROI, and so on. The rest of the functions are kept in the automation
    pipeline to keep track of the identified processes that require automation over
    the next couple of months. All these processes go through some level of standardization
    and governance procedures to improve the process before automating.


    # Build


    Development of the automation opportunities identified in the discovery phase
    takes place in the build phase. There are two different approaches to carry out
    the development of the automation project, as outlined here:


    +   • Center of Excellence (CoE)-driven: The core development team consists of
    RPA experts such as RPA solution architects, RPA developers, and experienced BAs
    who carry out discovering and developing automation solutions. The RPA team works
    with the business users throughout the automation journey to ensure successful
    delivery.


    +   • Democratized approach: With this approach, business users carry out the
    development by themselves. Not all business users may have technical experience,
    hence they are enabled to perform actions using tools that do not require specialized
    or programming knowledge.


    Once development is complete, all the automation solutions will undergo rigorous
    testing to ensure efficiency, accuracy, reliability, and that coding meets development
    standards and best practices.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# # Manage


    The automation solutions that are built are required to be deployed and updated
    from time to time. It is vital to keep track of each deployment and update carried
    out for the project for many reasons, such as the following:


    +   - Keeping track of the changes carried out

    +   - Comparing different versions when needed for bug fixing

    +   - Rolling back to previous versions in an emergency

    +   - Monitoring the usage of automation solutions created

    +   - Accessing management of the solutions


    # # Run


    The run stage is crucial in every automation project. Robots execute the solutions
    deployed in this stage. The execution and allocation of robots are configured
    based on organizational requirements. Depending on the organization''s needs,
    the robots execute the processes developed in the user''s machine or virtual environments
    without human intervention.


    # # Engage


    Every business process includes steps that require decision-making by the users
    who perform it. Some of these decisions are rule-based, but some require expertise
    and user experience (UX). In such scenarios, the robot and the user must work
    together to perform certain steps while the robot takes care of the most complex
    activities. This concept is called "human in the loop", whereby robots assign
    tasks for the user, and once the user completes these, the robot takes over control
    of the rest of the activities.


    # # Measure


    Introducing RPA makes an impact within the organization. The effect created requires
    measurement to understand how to scale RPA initiatives. These measures provide
    insights into the automation outcomes and the impact made to align the RPA strategy
    to achieve organizational goals.


    Similar to any software development project, RPA projects also have a life cycle.
    Every RPA project must go through a mandatory set of steps during its life cycle
    to ensure efficient and worthy delivery. Each stage of the life cycle requires
    different resources. The following section explains the resources needed during
    an RPA project and the responsibilities of each resource.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Knowing the RPA resources and responsibilities in an RPA project


    As we discuss the different phases of the RPA journey, we also encounter many
    experts in various projects. These experts perform several tasks depending on
    their expertise to ensure high-quality and on-time delivery of RPA projects, and
    we''ll now look at them in more detail.


    # RPA solution architect


    The solution architect is in charge of designing the RPA solution''s architecture
    for the proposed business process. The solution architect works alongside the
    BA to capture the requirement and translate the identified business scenario into
    a technical solution. The solution architect transfers the technical architecture
    knowledge to the BA, the business users, and the RPA developers to finalize the
    solution before development. The solution architect also acts as the development
    team lead (but does not perform code development) to ensure code quality and standards.
    The architect is involved from the first stage of the process until the solution
    is accepted and deployed.


    # RPA developer


    The RPA developer is responsible for developing the solution architecture provided
    by the solution architect. An RPA developer interacts with development tools and
    has an excellent knowledge of different development techniques to deliver the
    final output within the expected standards. The RPA developer is mostly involved
    in the build stage of the project life cycle, performing development, testing,
    and bug fixes.


    # BA


    The BA is primarily responsible for gathering all the required information to
    understand the process and map its as-is version. The BA also works hand-in-hand
    with the RPA solution architect to develop a to-be business process that involves
    process standardization and automation. The BA should also have a general idea
    of RPA capabilities and how they work to provide better solutions. Further, the
    BA is also responsible for transforming the captured requirements and the solution
    into a PDD to hand over to the business and development teams. The BA is mostly
    involved during the discovery stage of a project. However, BAs also get involved
    during a project''s development stage from time to time to ensure the proper delivery
    of requirements.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Implementation manager


    The implementation manager manages the overall project and the involved teams.
    The implementation manager ensures the timely achievement of project milestones
    by managing the project overall. Usually, the implementation manager is the single
    point of contact for the business stakeholders.


    # Infrastructure engineer/manager


    Infrastructure is a crucial aspect of any RPA project. The infrastructure engineer/manager
    is responsible for robots'' security and efficient execution of the processes
    developed by providing the required hardware and software configurations.


    # RPA support


    This role provides support for business users during their day-to-day concerns
    or issues while working with robots.


    The roles mentioned previously are involved in the project as a part of the CoE
    team. More stakeholders from the business users will also join the team to ensure
    successful project knowledge transfer and delivery.


    # Summary


    This chapter introduced RPA and discussed why it is the driving force of digital
    transformation. We further discussed the benefits RPA brings to an organization,
    as well as which processes are automated across different industries using RPA,
    and their results. Some of those processes were discussed in more detail, explaining
    how RPA is applied. Further, we also looked at the factors that need to be considered
    to identify a business process as suitable for RPA.


    Additionally, we also covered how these factors contribute to comparing processes
    in a process assessment matrix and segments in the matrix to consider for automation.
    The RPA journey is common to every process that goes through automation. This
    chapter also addressed the critical stages of an RPA journey and who the involved
    vital resources are. Finally, the chapter covered each essential resource''s roles
    and responsibilities in the CoE team.


    Now that we understand what RPA is, it''s the right time to introduce you to the
    UiPath ecosystem and the tools UiPath has to build automation solutions. Chapter
    2, UiPath Ecosystem, will introduce you to the UiPath ecosystem, development tools,
    and setting up the development environment.'
  merge: -1
  img_proc: true
