    # # Conventions used


    There are a number of text conventions used throughout this book.


    Code in text: Indicates code words in text, database table names, folder names,
    filenames, file extensions, pathnames, dummy URLs, user input, and Twitter handles.
    Here is an example: “Create the EmailAddress, Password, FirstName, LastName, and
    TermsAndConditions variables of the String type, and have the default values of
    EmailAddress, FirstName, and LastName.”


    A block of code is set as follows:


    ```

    "Hello " + In_UserName + ", It''s nice to see you. This is my first attempt to
    join two workflows."

    ```


    **Bold:** Indicates a new term, an important word, or words that you see onscreen.
    For instance, words in menus or dialog boxes appear in **bold**. Here is an example:
    “Click on the **DataTable...** button on the activity to open the **Build Data
