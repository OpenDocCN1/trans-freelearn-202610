  md: 'Now, start updating the Excel file from the data we extracted.


    +   20. Place a **Write Cell** activity below the last **Get Row Item** activity
    to update the **Full Name** column with data for the current row.


    +   21. Since you are updating each row for the **Full Name** column, you cannot
    have a hardcoded value for the **Range** property because the row number is dynamic.
    As a result, you need to use the **CurrentRowIndex** variable of the **For Each
    Row** activity to find the row number in the Excel file.


    +   22. Remember that the variable generates a zero-based index, whereas in Excel,
    the rows start with 1. Now, take a look at the Excel file again. The first row
    in Excel has the headers. The actual data starts from row number 2. Therefore,
    you need to match our zero-based index to the row numbers starting from 2 in Excel.
    Use the following expression in the **Range** property of the **Write Cell** activity.


    Note that you need to convert the row number generated dynamically to a String
    type because the field only accepts string values:


    ```

    "G" + (CurrentRowIndex + 2).ToString

    ```


    +   23. Configure the **Value** property of the activity using the following expression
    to combine the first and last names:


    ```

    FirstName + " " + LastName

    ```


    +   24. Place another **Write Cell** activity below the previous activity to update
    the rows for the next column, "**Total Payment**".


    +   25. Configure the **Range** property of the activity using the following formula.
    It is almost similar to the previous formula. The only difference is the column
    in Excel:


    ```

    "H" + (CurrentRowIndex + 2).ToString

    ```


    +   26. Configure the **Value** property of the activity by specifying the following
    expression:


    ```

    (HourlyRate * WorkHours).ToString

    ```


