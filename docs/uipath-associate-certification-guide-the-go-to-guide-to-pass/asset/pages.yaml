- pgno: 471
  md: '# # 15

    # Invoice Processing - Performer


    In Henry''s Food Mart, the finance and accounting department has selected the
    Invoice Processing process for automation. The Invoice Processing process reads
    through emails and downloads the invoices that have been received in an email
    attachment as a PDF. Then, it extracts customer information and invoice particulars
    from the invoices and enters them onto the Order Entry CRM web page.


    You started building this process by following the Dispatcher-Performer model.
    In Chapter 14, Invoice Processing – Dispatcher, you learned how to build an automation
    that downloads the unread invoices from emails, extracts the customer details
    and invoice particulars from each invoice, and then uploads them to the Orchestrator
    queue named HenryFoodMartInvoice.


    In this chapter, you will build the Performer model to enter the invoice data
    onto the Order Entry CRM web page.'
  merge: -1
  img_proc: true
