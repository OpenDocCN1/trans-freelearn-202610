- pgno: 429
  md: '# # Invoice Processing - Dispatcher


    **Henry''s Food Mart** is a chain of convenience stores in the US with headquarters
    in New York, and there are currently 400+ stores located in the US. The **invoice
    processing** process has been selected for RPA automation as part of the larger
    project initiative conducted within Henry''s Food Mart''s finance and accounting
    department.


    The objective of this process automation is linked to the project business case
    and is primarily intended to do the following:


    +   - Deliver faster processing of the invoices.

    +   - Reduce redundant activities in the invoice processing.

    +   - Improve overall performance and reliability by eliminating errors.


    The invoice processing process reads through emails and downloads the invoices
    received in the form of an email attachment as a PDF. Then, it extracts customer
    information and invoice particulars from the invoices and enters them into the
    **order entry CRM**.'
  merge: -1
  img_proc: true
- pgno: 430
  md: 'You will be building this process in two parts. You will follow the **dispatcher-performer**
    model and create two different processes. In this chapter, you will build the
    dispatcher model, and in the next chapter, you will build the performer model.


    Here is what you will learn as part of this *Invoice Processing – Dispatcher*
    project:


    +   • Creating and consuming orchestrator assets

    +   • Using mail automation

    +   • Manipulating data in UiPath Studio

    +   • Automating PDF files to read data

    +   • Modifying selectors

    +   • Using regular expressions

    +   • Working with the UiPath Studio data scraping wizard

    +   • Creating and uploading data to Orchestrator queues

    +   • Exception handling in UiPath Studio

    +   • Logging in UiPath Studio


    # # Technical requirements


    Let’s understand the requirements for this project:


    +   • UiPath Studio Community/Enterprise/Academic Alliance Edition version 20.10
    and above, connected to UiPath Orchestrator

    +   • Access to the UiPath Orchestrator services

    +   • A Gmail account

    +   • Adobe Acrobat PDF Reader

    +   • Access to the internet

    +   • Read-write permission in the machine where UiPath Studio is installed


    You can get the entire code for the invoice processing dispatcher at GitHub: `https://github.com/PacktPublishing/UiPath-Associate-Certification-Guide.git`.'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# The project overview


    In this chapter, you will be designing the dispatcher model of invoice processing.
    Let’s understand the process in detail. Here are the steps that you will need
    to perform:


    +   1. Program a robot that will read the last unread emails from your Gmail account.


    +   2. Program a robot that will download all the invoice attachments from the
    read mails. The conditions for downloading the attachment are as follows:


    +   * The subject line of the mail must be Invoice-Henry-FM-Invoice Number-Customer
    Name.


    +   * The naming convention of the attachment must be Invoice-Henry FM-Invoice
    Number-Customer Name.pdf.


    +   3. Program a robot to save all invoice attachments in a folder named Invoice,
    created in the project directory.


    +   4. Program a robot to extract the following relevant fields from the invoice:


    +   * Customer Details:


    +   * Customer Name


    +   * Customer Address


    +   * Customer Phone Number


    +   * Customer Email ID


    +   * Invoice Particulars:


    +   * Invoice Date


    +   * Invoice Number


    +   * Order Information:


    +   * Item Quantity


    +   * Item Description


    +   * Item Unit Price


    +   * Line Total Amount


    +   * Subtotal Amount


    +   * Shipping Amount


    +   * Total Amount'
  merge: -1
  img_proc: true
- pgno: 432
  md: '5. Program a robot to upload the following details to the Orchestrator queue:


    +   - Customer Details

    +   - Invoice Particulars


    6. Repeat steps 4–5 for the remaining invoices.


    7. Program the robot to successfully end the process if all the attachments downloaded
    from the mail in step 2 are processed.


    Let''s understand the entire process with the help of a diagram:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_432_0.png)


    Figure 14.1 – A high-level process diagram


    Before you begin designing the process automation, download all the provided invoices
    from the Input File – Invoice folder from this GitHub repository: https://github.com/PacktPublishing/UiPath-Associate-Certification-Guide/tree/main/Chapter14/Input%20File%20%E2%80%93%20Invoice.


    Send a separate email for every individual invoice to your own Gmail account from
    where the bot will read the email. The subject line must be Invoice-Henry-FM-Invoice
    Number-Customer Name (the invoice number and customer name are present in the
    invoice file name) – for example, if the customer''s name is Adam Smith and the
    invoice number is 8745, then the subject line of the mail should be Invoice-Henry-FM-8745-Adam
    Smith.


    Here are some examples:'
  merge: -1
  img_proc: true
