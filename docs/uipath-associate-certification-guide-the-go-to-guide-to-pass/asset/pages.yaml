- pgno: 274
  md: 'This is a very common concept when working with multiple datasets to find similar
    values. It is important to understand the difference between these join types,
    as they are used quite often in real-world projects.


    Join rules enable users to join two data tables to generate the required data
    as described. However, data table variables support many more functions, as specified
    in the following points:


    +   • Lookup Data Table: This function allows the user to look up a value in a
    specified data table and return the row index at which it was found. The activity
    also allows the user to configure it to return the value from a cell with given
    coordinates. The coordinates are usually the row index of the lookup result and
    the column name of the cell from which you want to extract the value.


    +   • Merge Data Table: This is used to append another data table to the current
    data table. Merging requires handling the changes in the schema (structure) of
    the two data tables. The activity provides a property that handles missing schema
    in four different ways.


    The following figure illustrates the options provided to handle the missing schema
    in the Merge Data Table activity:


    | Missing Schema Handle Option | Description |

    |---|---|

    | Add | Adds the missing schema to the destination data table |

    | Ignore | Ignores the schema changes and merges columns already available on
    both data tables |

    | Error | Throws an error if any schema changes detected |

    | Add with Key | Adds new columns with a built-in key |


    Figure 9.5 – Schema change handling while merging


    +   • Output Data Table: This converts the data in a data table variable into
    a single string using CSV format.'
  merge: -1
  img_proc: true
