- pgno: 59
  md: '![](img/84b06ad2832c53c5f677f8ce4c80f184_59_0.png)


    # Figure 2.12 – The Project panel


    In the **Project** panel, you can perform almost all the operations you perform
    on a Windows folder. You can copy and paste files, drag files from another folder,
    rename files, and change project settings. This section is used to manage the
    project files, dependencies, and project settings.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# The Activities panel


    The **Activities** panel helps you select the right activity to be added to your
    automation. You can search for an activity by its name or description in the **Search**
    field provided.


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_60_0.png)


    Figure 2.13 – The Activities panel


    Once an activity is found in the panel, you can either click and drag it or press
    the *Enter* button on your keyboard to add it to the **Designer** panel. You can
    also right-click on the activity and add the activity to your **Favorites** panel.


    # The Properties panel


    This section is used to manage the properties of various activities and to manage
    variables. The **Properties** panel looks similar to *Figure 2.14*, but changes
    based on the selected activities:'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/84b06ad2832c53c5f677f8ce4c80f184_61_0.png)


    Figure 2.14 – The Properties panel


    Once you have clicked on an activity from the **Designer** panel, the **Properties**
    panel is displayed on the right by default. This allows you to analyze or change
    the properties specific to the selected activity. Hovering over the **Properties**
    field provides more information regarding the field. There are certain properties,
    such as the **Text** field of a **Type Into** activity, or the **Output** field
    of an **OpenBrowser** activity, that allows variables to be created from the **Properties**
    panel.


    # # The Variables panel


    The **Variables** panel enables you to create variables and make changes to them.


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_61_1.png)


    Figure 2.15 – The Variables panel


    There are certain details you need to be aware of while creating a variable:


    +   - **Name**: You should give an accurate and meaningful name to the variable,
    and it needs to be created in camel case (for example, userName), which helps
    the user to read the name easily. Renaming a variable in this panel automatically
    updates all occurrences in the current file.

    +   - **Variable type**: You need to select the correct variable type from the
    list of options available in UiPath. Click on **Browse for Types...** in the **Variable
    Type** column to explore all the available variable type options. Examples of
    variable types are **String**, **Int32**, **Boolean**, **DataTable**, and **DateTime**.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   • **Scope**: You need to decide the level of access the variable can have,
    either locally to a specific sequence or globally to the entire project.


    > **Important Note**

    > You can refer to the *Practicing variable creation* section in *Chapter 5, Learning
    about Variables and Arguments*, to find more information on best practices for
    using variables.


    # # The Argument panel


    The **Argument** panel is mainly used when accessing a workflow to pass input
    through an argument or get the output from an argument.


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_62_0.png)


    Figure 2.16 – The Argument panel


    There are three mandatory fields to be filled:


    +   • **Name**: You can use either lower or upper camel case, followed by the
    direction of the data flow of the variable. For example, the input username can
    be given as `in_username` or `in_UserName` and the output can be given as `out_username`
    or `out_UserName`.


    +   • **Direction**: It can be either **In**, **Out**, or **In/Out**, depending
    on the direction of the data flow.


    +   • **Argument type**: This needs to be selected based on the nature of the
    variables or the argument.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# # The Output panel


