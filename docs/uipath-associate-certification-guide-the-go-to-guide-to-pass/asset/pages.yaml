- pgno: 442
  md: 'Now that we have completed the downloading of the invoices from the mail, let''s
    look at the next section on how to read the downloaded invoices to extract the
    required information from them.


    # # Reading the invoice


    In this section, you will read the invoices that have been downloaded from the
    mail. The following diagram explains the high-level process of reading the invoices:


    ![](img/84b06ad2832c53c5f677f8ce4c80f184_442_0.png)


    Figure 14.15 – Reading the invoice details


    Here, you will be extracting the customer details and invoice particulars from
    the read invoices. Let''s begin designing this process:


    +   1. Let''s start by creating a new sequence with the name Read_Invoice.

