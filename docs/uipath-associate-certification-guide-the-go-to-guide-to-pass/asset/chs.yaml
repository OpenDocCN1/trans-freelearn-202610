  \ Extract_Invoice_Particular.xaml\n\n- 9. 单击**导入参数**按钮，并将 `invoicePath` 变量作为值传递给\
  \ `in_InvoicePath` 参数。\n\n- 10. 使用 `Ctrl + K` 创建三个新变量，命名为 `invoiceDate`、`invoiceNumber`\
  \ 和 `dt_invoiceParticulars`，并将它们作为**值**传递给所有**输出**参数，如下图所示：\n\n| 名称 | 方向 | 类型 |\
  \ 值 |\n| :--- | :--- | :--- | :--- |\n| in_invoicePath | In | String | invoicePath\
  \ |\n| out_invoiceDate | Out | String | invoiceDate |\n| out_invoiceNumber | Out\
  \ | String | invoiceNumber |\n| out_dt_invoiceParticulars | Out | DataTable | dt_invoiceParticulars\
  \ |\n\n图 14.39 – 导入参数\n\n恭喜！您已从发票中提取所有必要字段。让我们将所有这些值上传到 Orchestrator 队列。\n\n## 将发票数据上传到\
  \ Orchestrator 队列\n\n在本节中，您将客户详细信息和发票详细信息上传到 Orchestrator 队列。以下图表说明了将数据上传到队列的高级流程：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_460_0.png)\n\n图 14.40 – 上传到 Orchestrator\
  \ 队列\n\n将客户详细信息和发票详细信息上传到队列将帮助您构建此过程的执行者模型，您可以在其中从队列中取用数据并对其进行处理。\n\n让我们开始吧：\n\n\
  - 1. 首先，让我们在 Orchestrator 中创建一个队列。单击队列部分并创建一个新队列。输入 HenryFoodMartInvoice 作为队列名称，然后单击“添加”按钮创建队列：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_461_0.png)\n\n图 14.41 – 创建队列\n\n- 2.\
  \ 在 Studio 中，创建一个新序列并将其命名为 Upload_To_Queue。\n\n- 3. 然后，单击“导入”面板并搜索 Newtonsoft.Json\
  \ 命名空间并将其添加。您将使用它来序列化 in_dt_invoiceParticulars 参数，以便整个数据表可以作为单个事务添加到队列中：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_462_0.png)\n\
  \n图 14.42 – 添加 Newtonsoft.Json 命名空间\n\n- 4. 创建七个输入参数，如下图所示：\n\n| 名称 | 方向 | 参数类型\
  \ | 默认值 |\n|---|---|---|---|\n| in_invoiceDate | In | String | 输入 VB 表达式 |\n| in_invoiceNumber\
  \ | In | String | 输入 VB 表达式 |\n| in_customerName | In | String | 输入 VB 表达式 |\n|\
  \ in_customerAddress | In | String | 输入 VB 表达式 |\n| in_customerPhoneNo | In | String\
  \ | 输入 VB 表达式 |\n| in_customerEmail | In | String | 输入 VB 表达式 |\n| in_dt_invoiceParticulars\
  \ | In | DataTable | 输入 VB 表达式 |\n\n图 14.43 – 参数面板\n\n- 5. 将 Try Catch 活动拖放为第一个活动。\n\
  \n- 6. 然后，将“添加队列项”活动拖放到 Try 块内。然后，在“添加队列项”活动的“属性”面板下，在 QueueName 部分中输入 \"HenryFoodMartInvoice\"\
  \ 作为队列名称。\n\n- 7. 在此场景中，队列是在 Orchestrator 中名为 Packt 的文件夹下创建的，因此您必须在“添加队列项”活动属性中传递文件夹名称。在\
  \ Folder Path 部分中，输入 \"Packt\"：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_463_0.png)\n\
  \n图 14.44 – “添加队列项”活动的属性面板\n\n\n\n\n\n8. 在 **属性** 面板下，单击 **ItemInformation** 属性的省略号图标：\n\
  \n| 属性 | 值 |\n|---|---|\n| 截止日期 | 队列...之前的日期 |\n| ItemInformation | (集合) |\n| ItemInformationCollection\
  \ | 用于添加...的集合变量 |\n| 推迟日期 | 队列...之后的日期 |\n| 优先级 | 正常 |\n| 队列名称 | \"HenryFoodMartInvoice\"\
  \ |\n\n图 14.45 – ItemInformation 集合属性\n\n9. 在 **ItemInformation** 窗口中，创建名为 invoiceDate、invoiceNumber、customerName、customerAddress、customerPhoneNo、customerEmail\
  \ 和 invoiceParticulars 的七个 String 类型参数。\n\n10. 让我们为所有参数赋值：\n\n- invoiceDate = in_invoiceDate.Split(\"\
  :\", StringSplitOptions.None)(1).ToString.Trim\n- invoiceNumber = in_invoiceNumber.Split(\"\
  #\", StringSplitOptions.None)(1).ToString.Trim\n- customerName = in_customerName\n\
  - customerAddress = in_customerAddress\n- customerPhoneNo = in_customerPhoneNo\n\
  - customerEmail = in_customerEmail\n- invoiceParticulars = JsonConvert.SerializeObject(in_dt_invoiceParticulars)\n\
  \n在 **值** 部分为所有值赋值后，您的 **ItemInformation** 窗口应如下所示：\n\n| 名称 | 方向 | 类型 | 值 |\n|---|---|---|---|\n\
  | invoiceDate | In | String | in_invoiceDate.Split(\":\", StringSplitOptions.None)(1).ToString.Trim\
  \ |\n| invoiceNumber | In | String | in_invoiceNumber.Split(\"#\", StringSplitOptions.None)(1).ToString.Trim\
  \ |\n| customerName | In | String | in_customerName |\n| customerAddress | In |\
  \ String | in_customerAddress |\n| customerPhoneNo | In | String | in_customerPhoneNo\
  \ |\n| customerEmail | In | String | in_customerEmail |\n| invoiceParticulars |\
  \ In | String | JsonConvert.SerializeObject(in_dt_invoiceParticulars) |\n\n图 14.46\
  \ – 已分配所有值的 ItemInformation 窗口\n\n11. 发票日期和发票号中包含额外字符。要去除这些字符，请使用带有适当分隔符的 Split()\
  \ 函数。如前所述，DataTable 参数在上传到队列之前必须序列化。JsonConvert 类的 SerializeObject() 函数可帮助将其序列化为\
  \ JSON 对象。\n\n12. 最后，在 Catches 块中，捕获 SystemException。\n\n13. 另外，记录一条消息，日志级别为 Error，消息为\
  \ \"Unable to Upload to Queue\" + vbLf + exception.Message + vbLf + exception.Source。\n\
  \n14. 返回到 Read_Invoice 序列，从 **项目** 面板将 Upload_To_Queue.xaml 工作流拖放到 For Each 活动主体中\
  \ Invoke_Extract_Invoice_Particular 工作流活动的下方：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_466_0.png)\n\
  \n图 14.47 – 调用 Upload_to_Queue.xaml\n\n15. 单击 **导入参数** 按钮，为所有七个 In 参数传递变量，如下图所示：\n\
  \n| 名称 | 方向 | 类型 | 值 |\n|---|---|---|---|\n| in_invoiceDate | In | String | invoiceDate\
  \ |\n| in_invoiceNumber | In | String | invoiceNumber |\n| in_customerName | In\
  \ | String | customerName |\n| in_customerAddress | In | String | customerAddress\
  \ |\n| in_customerPhoneNo | In | String | customerPhoneNo |\n| in_customerEmail\
  \ | In | String | customerEmail |\n| in_dt_invoiceParticulars | In | DataTable |\
  \ dt_invoiceParticulars |\n\n图 14.48 – 导入参数\n\n现在，您已完成上传到队列部分，是时候组装 Main.xaml 文件以运行流程了。\n\
  \n## 组装 Main.xaml\n\n是时候运行流程了，但在运行流程之前，让我们先在 Main.xaml 文件中调用 Download_Invoice.xaml\
  \ 和 Read_Invoice.xaml 工作流：\n\n1. 在 Main.xaml 工作流中，创建名为 isMail 的布尔类型变量。然后，从 **项目**\
  \ 面板将 Download_Invoice.xaml 工作流拖放到 Main.xaml 工作流中。\n\n2. 单击 **导入参数** 按钮，将 isMail\
  \ 变量作为值传递给 out_isMail 参数：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_468_0.png)\n\
  \n| 名称 | 方向 | 类型 | 值 |\n|---|---|---|---|\n| out_isMail | Out | Boolean | isMail\
  \ |\n| 创建参数 | | | |\n\n图 14.49 – 调用 Download_Invoice 工作流\n\n3. 接下来，拖放 **如果** 活动，并在\
  \ **条件** 中传递 **isMail** 变量。如果 **isMail** 变量的值为 **真**，则可以开始读取发票；否则，将停止流程。\n\n4. 从\
  \ **项目** 面板将 **Read_Invoice.xaml** 工作流拖放到 **如果** 活动的 **然后** 块中。\n\n5. 在其下方，添加 **记录消息**\
  \ 活动，日志级别设为 **信息**，并将消息设置为 \"All invoices details uploaded to queue\"。\n\n6. 在 **否则**\
  \ 块中，添加 **信息** 级别的 **记录消息** 活动，并将消息设置为 \"No invoice to process\"：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_469_0.png)\n\
  \n图 14.50 – Main.xaml 工作流\n\n7. 现在，通过单击 **设计** 功能区选项卡上的 **运行** 按钮运行整个流程。流程在没有任何错误的情况下完成，所有发票详细信息都已上传到\
  \ Orchestrator 队列：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_470_0.png)\n\n图 14.51\
  \ – 队列中的事务项目\n\n恭喜！您已成功构建发票处理分派器模型的自动化。现在，您可以将代码发布到 Orchestrator，以便从 Orchestrator\
  \ 页面或 UiPath Assistant 运行机器人。\n\n## 摘要\n\n在本章中，您开发了一个从发票中提取相关数据以供进一步处理的自动化流程。首先，机器人阅读电子邮件并下载以电子邮件附件形式以\
  \ PDF 接收的发票。然后，它从发票中提取特定数据并将其上传到 Orchestrator 队列。\n\n在下一章中，您将学习如何构建执行者模型，以从 Orchestrator\
  \ 队列中获取值并将其输入到订单录入 CRM 中。\n"
- "## 15\n\n## 发票处理 - 执行者\n\n在 Henry's Food Mart，财务和会计部门已选择发票处理流程进行自动化。发票处理流程阅读电子邮件并下载以电子邮件附件形式以\
  \ PDF 接收的发票。然后，它从发票中提取客户信息和发票详细信息，并将其输入到订单录入 CRM 网页中。\n\n您通过遵循分派器-执行者模型开始构建此流程。在第\
  \ 14 章“发票处理 – 分派器”中，您学习了如何构建一个从电子邮件下载未读发票、从每张发票中提取客户详细信息和发票详细信息，然后将其上传到名为 HenryFoodMartInvoice\
  \ 的 Orchestrator 队列的自动化流程。\n\n在本章中，您将构建执行者模型，以将发票数据输入到订单录入 CRM 网页中。\n\n以下是您将在本发票处理\
  \ – 执行者项目中学习的内容列表：\n\n- 浏览器自动化\n- 使用不同类型的工作流\n- 使用 Orchestrator 队列\n- 修改选择器\n- 在\
  \ UiPath Studio 中记录日志\n- 处理异常\n- 反序列化 JSON\n- 使用 DataTables\n- 更新队列状态\n\n### 技术要求\n\
  \n让我们了解此项目所需的要求：\n\n- UiPath Studio Community/Enterprise/Academic Alliance Edition\
  \ 20.10 及更高版本，且必须连接到 UiPath Orchestrator 服务。\n- 访问 UiPath Orchestrator 服务\n- 订单录入\
  \ CRM 网页\n- Google Chrome 浏览器\n- 互联网访问权限\n\n您可以从 GitHub 上的 https://github.com/PacktPublishing/UiPath-Associate-Certification-Guide/tree/main/Chapter15/Solution\
  \ 获取发票处理分派器的完整代码。\n\n### 项目概览\n\n在本章中，您将设计发票处理流程的执行者模型。让我们详细了解此过程。以下是您应该执行的步骤：\n\
  \n1. 编写机器人以启动订单录入 CRM 网页。\n2. 编写机器人以从 Orchestrator 工作流中名为 **HenryFoodMartInvoice**\
  \ 的队列读取事务项目。\n3. 编写机器人以从从队列中读取的事务项目中提取以下相关字段：\n    - **客户详细信息：**\n        - 客户姓名\n\
  \        - 客户地址\n        - 客户电话号码\n        - 客户电子邮件 ID\n    - **发票详细信息：**\n    \
  \    - 发票日期\n        - 发票号\n    - **订单信息：**\n        - 项目数量\n        - 项目描述\n  \
  \      - 项目单价\n        - 行总金额\n        - 小计金额\n        - 运费金额\n        - 总金额\n\n\
  \n\n\n\n- 4. 程序化机器人，在 **订单录入 CRM** 网页上输入以下详细信息：\n  - 客户详细信息\n  - 发票详情\n- 5. 对剩余的队列项目重复步骤\
  \ 2、3 和 4。\n- 6. 如果 Orchestrator 中没有新的队列项目，则程序化机器人成功结束流程。\n\n让我们通过图表来了解整个流程：\n\n\
  ![](img/84b06ad2832c53c5f677f8ce4c80f184_474_0.png)\n\n图 15.1 – 高级别流程图\n\n现在您已了解流程概览，让我们开始构建自动化。\n\
  \n## 设置项目\n\n在开始构建流程之前，首先，让我们正确设置所有 UiPath Studio 配置：\n\n- 1. 打开 UiPath Studio，创建名为\
  \ *Invoice_Processing_Performer* 的新流程：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_475_0.png)\n\
  \n图 15.2 – 创建新流程\n\n- 2. 单击设计器功能区中的管理包，并将当前项目依赖项更新为以下版本：\n  - UiPath.Excel.Activities\
  \ - v2.10.4\n  - UiPath.Mail.Activities – v1.10.5\n  - UiPath.System.Activities\
  \ – v21.4.1\n  - UiPath.UIAutomation.Activities – v21.4.4：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_475_1.png)\n\
  \n图 15.3 – 已更新的依赖项\n\n- 3. 现在您已将依赖项更新为正确版本，还需安装另一个依赖项，UiPath.WebAPI.Activities –\
  \ v1.7.0：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_476_0.png)\n\n图 15.4 – 已添加\
  \ WebAPI 依赖项\n\n现在您已配置好所需的一切，让我们开始构建流程。\n\n## 启动 CRM\n\n在本节中，您将启动订单录入 CRM。在继续构建机器人之前，请从\
  \ https://github.com/PacktPublishing/UiPath-Associate-Certification-Guide/tree/main/Chapter15/Input%20File%20-%20Order%20Entry%20CRM\
  \ 的 GitHub 仓库中的输入文件 – 订单录入 CRM 文件夹下载订单录入 CRM。\n\n订单录入 CRM 具有与发票对应的字段，如下面的屏幕截图所示：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_477_0.png)\n\n图 15.5 – 订单录入 CRM\n\n在项目目录中创建名为\
  \ CRM 的文件夹，并将订单录入 CRM 页面移入此文件夹：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_477_1.png)\n\
  \n图 15.6 – 订单录入 CRM 已移入 CRM 文件夹\n\n现在您已下载 CRM，让我们开始构建自动化：\n\n- 1. 在 UiPath Studio\
  \ 中，打开 Main.xaml 文件。\n- 2. 将 **活动** 面板中的 Open Browser 活动拖放到 **设计器** 面板中。\n- 3. 接下来，单击\
  \ Open Browser 活动的 **属性** 面板，并在 **URL** 下方键入 Environment.CurrentDirectory+\"\\CRM\\\
  Order Entry.html\"。\n- 4. 将 **Chrome** 选为 **浏览器类型** 选项：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_478_0.png)\n\
  \n图 15.7 – Open Browser 活动\n\n- 5. 将 Maximize Window 活动拖放到 Open Browser 活动内部。这将确保订单录入\
  \ CRM 网页始终在最大化窗口中打开。\n\n太棒了！现在您已打开订单录入 CRM 网页，让我们开始从队列读取数据。然后，我们将把记录输入到 CRM 中。\n\
  \n## 处理队列\n\n在本节中，您将从队列读取事务项目，并将其输入到订单录入 CRM 网页中。\n\n让我们从构建工作流开始：\n\n- 1. 创建名为 Read_From_Queue\
  \ 的新流程图工作流。\n- 2. 接下来，拖放一个序列活动，将其重命名为获取事务项目，并将其设置为起始节点：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_479_0.png)\n\
  \n图 15.8 – 获取事务项目序列已设置为起始节点\n\n- 3. 在获取事务项目序列内部，拖放 Try Catch 活动。\n- 4. 在 `Try Catch`\
  \ 活动的 **尝试** 块内部，拖放 `Get Transaction Item` 活动：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_480_0.png)\n\
  \n图 15.9 – 获取事务项目活动\n\n- 5. 单击 **获取事务项目** 活动的 **属性** 面板，并传入以下属性：\n  - `QueueName\
  \ = \"HenryFoodMartInvoice\"`\n  - `Folder Path = \"Packt\"`\n\n在此示例中，Orchestrator\
  \ 中的队列位于名为 `Packt` 的文件夹中。因此，要从 `Packt` 文件夹获取队列，已在 **文件夹路径** 部分中传入 `Packt`。\n\n-\
  \ 6. 向 **输出** 下的 **事务项目** 属性添加名为 `transactionItem` 的新变量：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_481_0.png)\n\
  \n图 15.10 - 属性面板\n\n- 7. 在 Try Catch 活动的 **捕获** 块内部，捕获 `Exception` 值并添加 `Log Message`\
  \ 活动。**日志级别** 属性应为 `Error`，而 **消息** 部分应为 \"No queue found at the mentioned folder\
  \ path\"+vbLf+exception.Message+vbLf+exception.Source。\n- 8. 导航到 Read_From_Queue\
  \ 流程图工作流，并拖放与获取事务项目序列相连的流程决策活动。\n- 9. 在流程决策活动的 **条件** 属性下键入 transactionItem IsNot\
