  \n图 6.9 – 输出消息框\n\n在本节中，我们了解了如何在自动化中使用序列。在下一节中，我们将探索其他控制流选项。\n\n## 什么是流程图？\n\n**流程图**\
  \ 用于业务流程复杂且具有多个决策点的项目设置中。流程图支持使用各种类型的活动（例如 **If/Else**、**循环** 和 **开关**）进行多个逻辑分支。\n\
  \n例如，您可以创建一个流程图，通过 **输入文本框** 从用户处获取 `Year` 等输入信息，并验证其是否为闰年。在此示例中，可能有两种可能的结果。一种是\
  \ *闰年*，而另一种基于所提供的输入则是 *非闰年*。让我们来看一个示例。\n\n## 流程图示例\n\n在本节中，我们将创建一个流程图示例，用于识别给定年份是否为闰年。执行以下步骤以使用流程图构建自动化：\n\
