  \ **至** 部分中，创建名为 invoiceDate、类型为 String 的新变量：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_485_0.png)\n\
  \n图 15.14 – 获取发票日期\n\n- 5. 在获取发票日期序列下方拖放一个序列活动，并将其重命名为获取发票编号。\n- 6. 在获取发票编号序列内添加一个赋值活动。在\
