  ## 使用 Anchor Base 活动提取单个值


  我们之所以能够为文档构建可靠的选择器，是因为文档中始终存在单词 "invoice"。但是，如果您查看 **小计**、**信用** 和 **总计** 等值，它们只包含一个可能会更改的数字。图
  11.16 显示了 **小计** 字段提取的选择器：


  ```

  <wnd app=''acrord32.exe'' cls=''AcrobatSDIWindow'' title=''Invoice #38645 - Adobe
  Acrobat Reader DC (32-bit)'' />

  <wnd aaname=''Document Pane'' cls=''AVL_AVView'' title=''AVScrolledPageView'' />

  <wnd cls=''AVL_AVView'' title=''AVPageView'' />

  <ctrl name=''$40.00 USD '' role=''text'' />

