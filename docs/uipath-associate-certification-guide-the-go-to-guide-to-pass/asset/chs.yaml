  \ Set Name 值设置为 idx（1），将 Set Value 值设置为 1（2）。然后，单击 OK（3）：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_262_0.png)\n\
  \n图 8.25 – 参数化值\n\n- 12. 选择器将类似于以下内容，并准备好动态选择值。但是，我们必须相应地更改值：\n\n```\n<html app='chrome.exe'\
