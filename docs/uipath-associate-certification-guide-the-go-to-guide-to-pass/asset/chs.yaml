  数据表 1: 员工 数据表 2: 部门


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_273_0.png)


  DT1 部门 ID = DT2 部门 ID


  图 9.2 – 数据表内连接的维恩图


  左连接略有不同。根据说明，左连接提供第一个数据表中的所有内容以及共同部分，如下：


  数据表 1: 员工 数据表 2: 部门


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_273_1.png)


  DT1 部门 ID = DT2 部门 ID


  图 9.3 – 数据表左连接的维恩图


  下一个连接类型是全连接，它提供来自两个数据表的结果。在这种情况下，图表如下：


  数据表 1: 员工 数据表 2: 部门


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_273_2.png)


  DT1 部门 ID = DT2 部门 ID


  图 9.4 – 数据表全连接的维恩图


  在处理多个数据集以查找相似值时，这是一个非常常见的概念。理解这些连接类型之间的区别非常重要，因为它们在实际项目中被频繁使用。


  连接规则使用户能够连接两个数据表以生成所需数据，如上所述。但是，数据表变量支持更多功能，如下所述：


  - **查找数据表**：此功能允许用户在指定数据表中查找值，并返回找到该值的行索引。该活动还允许用户将其配置为返回具有给定坐标的单元格中的值。坐标通常是查找结果的行索引以及要从中提取值的单元格的列名。


  - **合并数据表**：用于将另一个数据表追加到当前数据表。合并需要处理两个数据表架构（结构）中的更改。该活动提供一个属性，以四种不同的方式处理缺失的架构。


  以下图表说明了合并数据表活动中用于处理缺失架构的选项：


  | 缺失架构处理选项 | 说明 |

  |---|---|

  | 添加 | 将缺失的架构添加到目标数据表 |

  | 忽略 | 忽略架构更改，并合并两个数据表中已有的列 |

  | 错误 | 如果检测到任何架构更改，则抛出错误 |

  | 添加带键 | 添加带内置键的新列 |


  图 9.5 – 合并过程中的架构更改处理


  - **输出数据表**：此功能使用 CSV 格式将数据表变量中的数据转换为单个字符串。





  数据表变量常被用于处理结构化数据的操作。

  到目前为止，您已经熟悉数据表支持的函数以及 UiPath 中可用于执行这些函数的活动。掌握这些函数和活动的知识在处理几乎所有 RPA 项目时都非常有用。以下部分将提供使用先前讨论过的某些活动的实际经验。


