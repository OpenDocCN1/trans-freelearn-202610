  \n## 设计器面板\n\n设计器面板用于通过拖放活动来设计自动化项目。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_58_0.png)\n\
  \n图 2.11 – 设计器面板\n\n设计器面板是设计或创建自动化项目的主要空间，可快速访问活动、属性、变量和参数面板。活动可以折叠或展开以便更好地查看，该面板非常直观，因为它支持所有Microsoft\
  \ Windows操作，例如剪切、复制和粘贴。\n\n## 项目面板\n\n项目面板以树形结构显示，其中根节点是项目名称，分支包含依赖项、输入、设置和项目文件。您可以在图2.12中看到您刚刚创建的流程：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_59_0.png)\n\n图 2.12 – 项目面板\n\n在**项目**面板中，您可以执行几乎在Windows文件夹上执行的所有操作。您可以复制和粘贴文件、从另一个文件夹拖动文件、重命名文件并更改项目设置。此部分用于管理项目文件、依赖项和项目设置。\n\
