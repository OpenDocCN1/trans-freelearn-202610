  \n图 8.29 – 运行项目\n\n- 16. 观察 **Output** 部分中生成的输出，如以下屏幕截图所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_264_1.png)\n\
  \n图 8.30 – 验证结果\n\n至此，我们已使用 PacktPub 网站的实际示例成功实现了动态选择器，以动态检索书名。您可以将相同概念应用于不同场景，从而处理动态目标元素。\n\
  \n## 摘要\n\n在本章中，我们介绍了选择器，包括如何使用标记、属性和选择器属性。接着，我们探讨了静态、动态、部分和完整选择器之间的差异。随后，我们学习了\
  \ UI Explorer 以及如何在挑战性情况下使用选择器属性。最后，我们介绍了使用动态选择器的实际示例，以实践本章所学概念。\n\n在下一章中，您将使用 Excel\
  \ 和数据表来操作数据。在此，您将使用选择器从与 Excel 和数据表通信的应用程序中检索数据。\n"
- '## 了解数据表用途并探索 Excel 自动化


  在上一章中，我们讨论了不同类型的变量和参数。然而，还有一种非常特殊的变量类型，我们称之为 **数据表**。我们使用数据表变量来处理以表格形式组织的更多结构化数据。我们几乎每天都会使用
  Microsoft Excel 来执行组织中的不同功能。例如，财务部门可能会定期使用 Excel 生成报告、执行计算和对账财务数据。因此，许多公司和/或部门已经开始自动化在
  Excel 中手动执行的操作。


  本章重点介绍如何使用 UiPath 自动化 Excel，以及数据表变量如何用于支持 Excel 自动化。


  本章包含以下各节：


  - 探索数据表

  - 创建和自定义数据表变量

  - 与 Excel 文件交互

  - 实践 Excel 自动化


  本章结束时，您将了解使用不同的 Excel 交互方法在 Excel 中执行数据操作的最常用方法。


  ## 技术要求


  在开始本章之前，请确保已安装 UiPath Studio 和助手。本章要求您熟悉使用 Studio 创建变量和简单工作流。此外，您的计算机上必须安装 Microsoft
  Office 套件。


  ## 探索数据表


  我们都曾在某个时候使用过 Microsoft Excel。在每个 Excel 文件中，我们都会看到以下概念：


  - *工作簿*：指 Excel 文件本身。从现在起，在我们的课程中，我们将使用此词来指代 Excel 文件。

  - *工作表*：每个工作簿可以包含多个包含数据的工作表。

  - *行*：每个工作表由数据行组成。

  - *列*：每个数据行包含多个列，这些列包含不同的数据值，指的是每个列所持有的数据类型。

  - *单元格*：Excel 表中的单元格包含单个值或公式。每行包含多个单元格。


  同样，数据表是一种变量类型，可以以与 Excel 表相同的结构格式存储数据。


  您可能会想知道数据表和工作表之间的区别。数据表是单个数据库表的内存表示，可以包含多行，每行由多个不同数据类型的列组成。或者，工作表具有相同的结构，但可以使用表格和图形直观地表示其数据。


  ## 创建和自定义数据表


  本章这一节将介绍如何创建和自定义数据表。


  ### 创建数据表


  如果您已学习第 5 章“了解变量和参数”，那么您现在已熟悉在 UiPath Studio 中创建变量和参数。相同的概念适用于数据表变量。唯一的区别是，对于变量/参数的
  Data Type 属性，我们必须从下拉菜单中选择 System.Data.DataTable。


  除了变量/参数创建之外，您还将遇到帮助创建数据表的特定活动：


  - Build Data Table：此活动提供一个向导，您可以使用它通过添加列、更改列属性（自动增量、空值处理、值的最大长度和默认值）以及添加具有静态值的行来以图形方式构建数据表。当您明确期望来自某个操作的数据表输出具有特定结构时，此活动非常有用。

  - Read Range：这是一项允许用户从 Excel 工作表读取数据的活动。此活动的输出是一个数据表，其中包含工作表中指定范围的所有列和行。该活动需要通过使用变量/参数创建快捷键创建数据表变量或通过
  Variables/Arguments 面板创建它来配置输出属性。

  - Read CSV：与 Read Range 类似，但用于从 CSV 文件读取数据。输出属性的配置与 Read Range 的配置相同。

  - Data Scraping：这是 UiPath 提供的一种高级功能，用于从网页或文档中提取结构化数据并将其保存在数据表变量中。该主题在第 10 章“探索用户界面和用户/机器人交互”中有更详细的介绍。

  - Generate Data Table：用于从非结构化数据生成数据表。用户可以配置该活动以指定如何根据分隔符拆分行和列。






  我们可以在创建的数据表中对数据执行多种操作，例如排序、筛选、清洗以及与其他数据表进行连接。UiPath 专门为数据表提供了大量活动，使这些操作功能变得简单易用。其中一些活动如下：


  - **清除数据表**：擦除数据表变量中的所有数据。清除操作不会移除数据表的结构。在处理循环或工作流迭代部分中生成的临时数据以准备最终数据集时，此活动非常实用。清除临时数据表中的数据可确保中间变量被清空，并准备好进行下一轮数据处理。


  - **添加数据列**：向现有数据表变量添加新列。我们可以为此活动提供不同的输入。输入可以是现有的 **数据列** 变量，也可以提供列名和数据类型以创建空列。此活动的
  **属性** 面板包含多个其他可配置属性，例如默认值、自动递增、唯一值检查以及允许空值的选项。


  - **移除数据列**：从现有数据表变量中移除一个数据列。我们可以为此活动提供不同的输入。输入可以是现有的数据列变量，也可以提供要移除的列名或列索引。


  - **添加数据行**：向现有数据表变量添加新数据行。我们可以为此活动提供不同的输入。输入可以是现有的 **数据行** 变量，也可以将行的列值作为包含每列值的
  **数组行** 提供。数组行中的对象数量应与数据表中的列数匹配。


  - **移除数据行**：从现有数据表变量中移除现有行。我们可以提供不同的输入，例如 **数据行** 变量或要移除的行的索引。


  - **移除重复行**：此活动提供了一种简便机制，用于查找所有重复行并将其从提供的数据表中移除。


  - **筛选数据表**：使用户能够根据其要求筛选现有数据表中的数据。筛选可以采用几种不同的方式。它允许用户通过指定需要移除或保留的列来筛选掉不需要的列。或者，您可以编写条件来筛选数据行。


  - **排序数据表**：使用指定列按升序或降序对数据表进行排序。


  - **数据表的逐行处理**：类似于 **逐项** 活动，此活动专门用于遍历数据表。默认情况下，该活动允许遍历行。如果在遍历时想要访问行中的特定列，可以使用 `CurrentRow
  ("<Column Name>") .ToString` 或 `CurrentRow(<Column Index>) .ToString` 命令。


  - **连接数据表**：在某些场景中，我们需要使用多个数据表变量来生成所需输出。**连接数据表** 活动使用户能够使用两个数据表中共同可用的一个或多个列来连接两个数据表。表连接以多种方式执行，如下表所示。


  让我们通过一个简单的示例来探索连接，以便更好地理解。假设您有两个数据表：


  - **数据表 1**：包含所有员工的信息。

  - **数据表 2**：包含组织中所有可用部门的信息。

  - **连接规则**：两个表具有共同列 `Department ID`，用于指定哪个员工被分配到哪个部门。


  以下图表描述了连接数据表活动中可用的不同连接规则及其用途：


  | 连接类型 | 说明 |

  | :--- | :--- |

  | **内连接** | 当我们确定只需要匹配指定连接条件的记录时使用。不匹配的记录将从结果数据表中移除。<br><br>简单来说，它基于定义的共同可用列检查匹配记录，仅返回两个数据表中都有匹配的行。<br><br>示例：<br><br>仅返回已分配到部门的员工
  |

  | **左连接** | 众所周知，连接包含两个数据表。我们为“数据表 1”属性指定的第一个数据表被视为左数据表。您为“数据表 2”属性指定的数据表被视为右数据表。一旦将连接条件选择为左连接，即表示给予左数据表优先级。与内连接不同，左连接会返回左数据表中的所有行。但是，它也会从第二个数据表中返回找到的所有匹配行，以及没有匹配的空行。<br><br>示例：<br><br>返回所有员工及其分配部门的信息。此外，结果还包含未分配部门的员工。
  |

  | **全连接** | 无论连接条件如何，保留两个数据表中的所有记录。它更像是左连接和右连接的组合。全连接会为不匹配的记录的两侧添加空值。 |


  图 9.1 – 连接数据表活动中的连接类型


