- "## 16 如何准备以及预期内容\n\n您是否打算参加 **UiPath RPA Associate 考试** 以获得认证凭据（**UiRPA**）并提升您的\
  \ RPA 专业知识？如果是，本章连同 UiPath Certified Professional 网站（**https://www.uipath.com/learning/certification**）上提供的信息，将帮助您更深入了解考试和认证凭据。备考认证考试可能会非常有压力，因为它会给您带来很大的表现压力，但这些资源旨在为您备考提供指导和帮助。\n\
  \n在本章中，我们将介绍以下主题：\n\n- 介绍 UiRPA 及其目标受众\n- 考试章节和主题\n- 题型及可用的模拟测试\n- 考试详情及考试报名\n-\
  \ 管理您的认证\n\n### 介绍 UiRPA 及其目标受众\n\nUiRPA 认证考试适用于任何使用 UiPath 平台或希望在设计和开发 RPA 解决方案方面建立专业知识的人。\n\
  \n本考试要求具备扎实的基础 RPA 知识和/或实操经验。考试将评估您的问题解决能力和流程识别能力，以及使用 UiPath Studio、Robot 和 Orchestrator\
  \ 构建简单自动化解决方案的能力。此外，UiRPA 认证凭据是成为高级 RPA 开发人员、解决方案架构师或 RPA 架构师的第一步。\n\n截至 2022 年\
  \ 3 月，UiPath Certified Professional 考试分为两个轨道：\n\n- 通用轨道，适用于任何使用 UiPath 平台且需要具备扎实基础技术知识和技能的人员\n\
  - RPA 开发者轨道，适用于任何处于技术岗位且希望获得和/或已拥有在机器人企业框架（Robotic Enterprise Framework）中设计和开发复杂\
  \ RPA 解决方案的更深层次专业知识的人员\n\nUiRPA 认证包含在这两个轨道中。\n\nUiPath RPA Associate 考试的目标受众包括任何处于技术或半技术岗位的人员。这包括担任初级\
  \ RPA 开发人员、RPA 开发人员、解决方案架构师、业务分析师或系统管理员的任何人。\n\n至少，合格的考生应符合以下类别之一：\n\n- 希望从事 RPA\
  \ 行业职业的应届毕业生或大学/学院学生\n- UiPath 或 UiPath 合作伙伴的员工，担任售前、服务、支持等职位\n- 拥有 3-6 个月 RPA 实操经验的人员\n\
  \n现在您已初步了解 UiRPA 考试，我们将深入了解考试的章节和主题。\n\n### 考试章节和主题\n\n作为一家公司，UiPath 的产品组合涵盖多种产品。但是，UiRPA\
  \ 认证考试将对以下三款产品进行考核：\n\n- UiPath Studio\n- UiPath Robot\n- UiPath Orchestrator\n\n\
  了解每个考试章节及其相关考试主题非常重要。清晰地了解这些内容，并结合相关产品的实操练习，将有助于您备考。现在我们就开始。\n\n### 考试章节\n\nUiPath\
  \ RPA Associate 考试包含以下考试章节：\n\n- RPA 基础知识\n- UiPath Studio 概览\n- UiPath Studio –\
  \ 变量和参数\n- UiPath Studio – 选择器\n- UiPath Studio – 控制流程\n- UiPath Studio – 数据操作\n\
  - UiPath 自动化概念和技术\n- UiPath Orchestrator 概览\n\n### 考试主题\n\n现在，让我们来看每个章节中的主题。\n\n\
  ### RPA 基础知识\n\n- 描述适合自动化的流程以及使用不同机器人类型执行的流程；例如，有监督与无监督。\n- 解释 UiPath Studio、Orchestrator\
  \ 和 Robot/Assistant 的功能及其交互。\n\n### UiPath Studio 概览\n\n- 了解调试功能及其用法；例如，使用断点。\n\
  - 识别如何使用 Manage Dependencies，并了解将自动化项目连接到版本控制方案的重要性。\n\n### UiPath Studio – 变量和参数\n\
  \n- 描述不同的变量类型、其用法以及使用变量作用域的最佳实践。\n- 描述变量和参数之间的功能和差异，包括参数的使用、管理及其最佳实践。\n\n### UiPath\
  \ Studio – 选择器\n\n- 动态选择器与静态选择器的使用方式。\n- 部分选择器与完整选择器的使用方式。\n- 何时以及如何在 UI Explorer\
  \ 和锚点基础活动中使用指示锚点（Indicate Anchor）。\n- 演示并描述可靠选择器的使用方法，以及如何使用 UI Explorer 修改选择器。\n\
  \n### UiPath Studio – 控制流程\n\n- 如何使用控制流程活动以及序列和流程图等工作流类型。\n- 识别并描述各种控制流程活动，例如 If、Switch、While、DoWhile、For\
  \ Each 等。\n- 解释错误处理的重要性及其实施方法。\n\n### UiPath Studio – 数据操作\n\n- 描述数据操作的重要性及使用原因；例如，将一种数据类型转换为另一种。\n\
  - 解释如何操作字符串；例如，使用 VB 字符串方法和 RegEx。\n- 解释如何遍历和操作各种集合类型和数据表中的数据。\n\n### UiPath 自动化概念和技术\n\
  \n- 识别并解释电子邮件自动化的使用方式。\n- 识别并描述 Microsoft Excel 和数据表功能，以及 Excel 活动如何用于数据操作目的。\n\
  - 描述用于从 PDF 文件提取数据的功能；例如，读取原生文本或使用 OCR 扫描 PDF。\n\n### UiPath Orchestrator 概览\n\n\
  - 识别并描述 UiPath Orchestrator 队列和资产的使用方式。\n- 识别并解释如何将项目发布到 UiPath Orchestrator。\n\n\
  现在您已熟悉考试主题，让我们来看 UiRPA 考试中可能会问到的题型。\n\n### 题型及可用的模拟测试\n\nUiPath RPA Associate 考试不是基于实验室的，也不包括或要求任何项目提交。相反，考试包含以下题型：\n\
  \n- 多选题：\n  - 带有或不带图形的直接问题\n  - 基于场景的问题\n  - 作为答案选项的图形\n  - 作为答案选项的代码\n- 拖放题：\n\
  \  - 旨在测试考生对特定“流程”的理解\n  - 涉及考生的逻辑思考和推理\n- 模拟题：\n  - 交互式屏幕允许与不同显示元素进行交互和自动评分。\n\
  \  - 模拟用户与 UiPath Studio 和/或 Orchestrator 显示界面的交互。\n  - 与其他题型完全集成。\n  - 无需退出测试事件。\n\
  \n本书包含两套模拟测试 – *第 17 章，模拟考试 1*，和 *第 18 章，模拟考试 2*。这些测试将允许您在参加受监考的 UiPath RPA Associate\
  \ 考试之前进行练习。此外，UiPath Certified Professional 计划在 `https://uipath.onlinetests.app/assess.aspx?aid=UIPATH-RPAV1-PT&pass=uippassword`\
  \ 提供一套模拟测试。\n\n这些模拟测试旨在帮助您准备 UiPath RPA Associate 考试。它们允许您熟悉考试主题以及可能在受监考考试中遇到的题型。\n\
  \n### 考试详情及考试报名\n\n在本节中，您将了解更多有关考试以及如何报名的信息。\n\n### 考试详情\n\n以下是有关 UiPath RPA Associate\
  \ 考试的一些其他详细信息：\n\n- **考试编号：** UiPath-RPAv1\n- **考试名称：** UiPath RPA Associate v1.0\
  \ 考试\n- **考试时长：** 90 分钟\n- **及格分数：** 70%\n- **考试费用：** $150.00（美元）\n\n如果您选择错误答案，不会被\
  \ *扣分*。因此，请尝试 UiRPA 考试中的所有问题。\n\n根据您的所在地，$150 考试费可能需缴纳当地税费。此外，UiPath Academic Alliance\
  \ 合作院校的学生有资格获得 50% 的折扣。如果您是教育工作者，请联系 UiPath Academic Alliance 团队获取学生折扣考试券，电子邮件地址为\
  \ `academic.alliance@uipath.com`。\n\n\n\n\n现在，让我们学习如何注册考试。\n\n## 考试注册\n\nUiPath\
  \ Certified Professional 考试在全球 Pearson VUE 考试中心的安全受监考环境中提供，也可以通过 OnVUE 在您的私人位置进行远程受监考考试。\n\
  \n要安排考试，请访问 https://home.pearsonvue.com/uipath 进行注册、支付考试费用，并安排考试的日期和时间。如果您有考试代金券，可以在结账流程前输入代金券编号。\n\
  \n现在您应该已简要了解如何注册考试。下一步是了解如何在成功通过考试后管理您的认证凭证。\n\n## 管理您的认证\n\n您的所有考试和认证凭证详细信息都将保存在\
  \ UiPath Certification Manager (CertMetrics) 网站上，您可以在其中查看和下载电子证书和数字徽章。CertMetrics\
  \ 位于 https://www.certmetrics.com/uipath。出于跟踪目的，每个电子证书都将包含一个唯一验证码。如有需要，您的雇主可以通过在\
  \ UiPath Certification Manager 验证页面 (https://www.certmetrics.com/uipath/public/verification.aspx)\
  \ 上输入验证码来验证和确认您的凭证。\n\n## 摘要\n\n在本章中，您学习了如何准备、注册并参加 UiPath RPA Associate 考试。这包括考试详情、考试目标受众、考试部分和主题，以及您将遇到的问题类型。最后，您获得了其他考试详情，并学习了如何在成功通过考试后管理您的凭证。\n\
  \n如果您需要关于 UiPath Certified Professional 计划、其计划政策、考生协议以及常见问题解答 (FAQs) 的更多信息，请访问 https://www.uipath.com/learning/certification。\n\
  \n祝您顺利通过 UiPath RPA Associate 考试并获得 UiRPA 凭证！\n\n在下一章中，您将有机会通过完成本书的第一个模拟考试来练习考试。\n"
- "## 模拟考试 1\n\n这是模拟考试 1。它用于测试您的知识，并让您了解实际考试的情况。此模拟考试不包含实际考试题目。如果您感觉已准备就绪，请不要查看答案直接参加此考试。如果在此考试中得分达到\
