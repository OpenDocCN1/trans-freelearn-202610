  \n图 6.22 – 最终假分支输出消息\n\n到目前为止，我们已了解如何使用实时示例在 **设计器** 面板中使用序列和流程图进行自动化。在即将到来的章节中，我们将学习如何使用控制流活动来增强自动化。\n\
  \n\n\n\n\n## 探索决策和决策类型\n\n决策活动允许您在需要对业务场景进行决策评估时控制数据流的执行。基于此，必须执行两个操作之一。这两个操作构成决策活动的分支，并根据决策结果执行，结果可以是\
  \ True 或 False。在预期有多个结果的情况下，建议使用 Switch 活动。\n\nIf 语句活动用于序列，而流程决策活动用于流程图。例如，您可以检查某些输入文本中的特定值，并根据文本的结果采取行动。让我们详细了解一下。\n\
  \n### If 活动示例\n\n在此示例中，我们将创建一个序列，要求输入一个数字，然后显示给定数字是偶数还是奇数。让我们开始：\n\n- 1. 在 UiPath\
