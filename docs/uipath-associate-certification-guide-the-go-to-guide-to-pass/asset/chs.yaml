  集合类型变量 类似，DataTable 也对行和列使用基于零的索引。换句话说，如果您想使用索引访问数据表中的第一行，则始终为零。同一概念也适用于访问列。


  假设我们想使用索引而不是列名来配置我们的 合并向导。在这种情况下，我们需要使用以下方法。


  第一个数据表（员工）有五个字段，部门 ID 是最后一个字段。考虑到基于零的索引，部门 ID 的索引将为 4。关于部门数据表，您需要使用索引 0，因为部门 ID
  字段是第一列。如果要使用识别的索引配置 合并向导，则对 **表 1 列** 字段使用索引 4，对 **表 2 列** 字段使用 **索引 0**。


  到目前为止，您应该了解数据表的基本概念以及如何在 UiPath 中将其与我们的活动一起使用。如前所述，UiPath 中有大量活动可用于对数据表执行不同操作。尝试在相同示例中探索其他活动，看看还可以做什么。使用
  Excel 文件时，您可以期望获得相同的功能；因此，Excel 文件中的数据易于导出到数据表。下一节将解释如何与 Excel 文件进行交互。围绕 Excel 数据操作构建了许多自动化解决方案。了解可用于与
  Excel 文件交互的不同方法至关重要。





  ## 与 Excel 文件交互


  许多业务用户使用 Excel 执行日常活动，例如执行财务计算和维护费用记录。Excel 是任何组织所有部门中最广泛使用的应用程序之一。UiPath 提供了一组出色的活动，可在计算机上安装或未安装
  Excel 的情况下，实现与 Excel 文件的无缝集成和交互。Excel 依赖项默认添加到在 Studio 中创建的新解决方案中。但是，如果您特别需要将其添加到解决方案中，可以从依赖项管理器中查找
  UiPath.Excel.Activities。


  UiPath 提供了两种与 Excel 文件交互的不同方式：


  - 文件访问级别：我们称这些为 **工作簿活动**，它们是 Excel 活动的一部分。工作簿活动不需要在计算机上安装 Microsoft Office 软件包。这些活动在后台工作，与实际的
  Excel 集成相比速度更快。这些活动仅适用于 .XLSX 文件。


  - Excel 应用程序集成：我们称这些为 **Excel 活动**，它们允许我们直接与 Excel 集成。与工作簿活动不同，Excel 活动需要在计算机上安装
  Microsoft Office 软件包。使用这些活动将打开 Excel 应用程序，就像人类用户在与其交互之前所做的那样。Excel 活动使用户能够与 CSV、XLS、XLSB
  和 XLSM 文件交互。此外，所有 Excel 活动都可以配置为在执行时可见或隐藏。


  无论使用哪种方法与 Excel 文件交互（访问级别），两种方法都共享常见操作。但是，尽管操作是常见的，但每种类型都有不同的活动需要执行。例如，您可以在 Excel
  活动和工作簿活动下找到可以读取 Excel 文件的活动。这些活动位于 **活动** 面板的两个不同部分中，如 *图 9.12* 所示。


  以下屏幕截图显示了 **读取范围** 活动，该活动用于从 Excel 文件中读取数据。如图 9.15 所示，所有 CSV 和 Excel 活动都位于 **应用集成**
  类别中，而工作簿活动位于 **系统** -> **文件** -> **工作簿** 类别中。两种类型的主要区别在于，**应用集成** 类别下的活动需要 **Excel
  应用程序作用域** 活动来容纳所有其他活动，而其他活动则不需要。以下图显示了分别位于 **工作簿** 和 **Excel** 类别下的两个活动：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_284_0.png)


  图 9.15 – Excel 和工作簿活动位置


  让我们探讨两种方法都可用的常见活动：


  - **读取范围**：从 Excel 文件的指定范围读取数据到数据表变量。使用带有 **Excel 应用程序作用域** 的 **读取范围** 活动，使用户能够根据在
  Excel 文件中应用的筛选器读取数据。或者，工作簿活动会读取工作表中可用的所有数据，而不考虑筛选器。


  - **写入范围**：提供将数据表变量中的数据写入电子表格的功能。写入从用户指示的单元格开始。


  - **读取单元格**：将指定单元格的内容读取到字符串变量中。


  - **写入单元格**：将变量的内容写入指定工作表中的指定单元格。


  - **读取单元格公式**：使用户能够读取指定单元格中的可用公式，并将其存储在字符串变量中。


  - **读取列**：使用户能够读取 Excel 文件中指定列的内容。提取的内容存储在 `IEnumerable<object>` 类型变量中。


  - 读取行: 类似于 **读取列**，但此活动读取行的内容，从用户提供的单元格标识符开始。该行的提取数据存储在 `IEnumerable<object>` 类型变量中。


  - 追加范围: 使将数据表变量中的内容轻松添加到指定电子表格的末尾而不覆盖数据。此外，如果指定的工作表在 Excel 文件中不可用，则该工作表会自动创建。


  - 获取表格范围: 特别适用于我们在 Excel 文件中创建的表格。此活动使用户能够在选定的电子表格中定位指定表格并提取表格的范围。此活动的输出可以馈入其他活动，例如
  **读取范围** 以从 **获取表格范围** 活动返回的范围中提取数据。


  除上述常见活动之外，UiPath 还提供了许多其他活动，用于通过 **Excel 应用程序作用域** 与 Excel 文件交互。


  ## Excel 应用程序作用域


  **Excel 应用程序作用域** 是一个容器，用于容纳所有 Excel 应用程序集成类别活动。**Excel 应用程序作用域** 活动会触发 Excel 文件打开以执行活动范围内指定的操作。您现在对两个类别中常见的可用活动有了大致了解。但是，Excel
  应用程序集成除了我们之前讨论的内容之外，还提供了更多功能。我们可以使用应用程序集成方法执行许多其他功能。这些操作可以根据 Excel 函数的不同方面进行分类。


  ## CSV 活动


  Excel 应用程序集成提供了使用数据表变量轻松与 CSV 文件交互的功能。虽然 CSV 活动位于 Excel 应用程序集成类别下，但 CSV 与 Excel
  应用程序集成活动的主要区别在于，它们可以在没有 **Excel 应用程序作用域** 的情况下仍然工作。UiPath 提供了三个独特的活动来与 CSV 文件交互：


  - 读取 CSV: 读取 CSV 文件中的所有记录，并将其存储在数据表变量中。


  - 写入 CSV: 将数据表变量的内容写入 CSV 文件。如果文件不可用，该活动还能够创建 CSV 文件。


  - 追加到 CSV: 类似于 **追加范围**，**追加到 CSV** 活动会将数据表变量的内容添加到现有 CSV 文件的末尾而不覆盖数据。但是，如果文件不存在，该活动也可以创建文件。


  ## 范围活动


  属于此子类别的活动可以轻松与 Excel 中的指定范围交互。这些活动类似于我们在学习数据表活动时遇到的活动。但是，这些活动直接在 Excel 文件本身中执行相同的功能：


  - 选择范围: 使用户能够在 Excel 文件中选择特定范围。此操作类似于用户在 Excel 电子表格中突出显示特定范围所执行的功能。


  - 删除范围: 使用户能够删除 Excel 电子表格中的特定范围。


  - 获取所选范围: 将给定范围作为字符串返回，可用于处理范围的其他活动。


  - 插入列: 类似于添加数据列，此活动直接在 Excel 文件本身中的特定位置添加新表格列。


  - 删除列: 从电子表格中删除指定的 Excel 表格列。删除基于列名进行。


  - 插入/删除列: 此活动可以向电子表格添加空白列或删除现有列。


  - 插入/删除行: 此活动可以根据用户选择的操作类型添加空白行或删除现有行。


  - 自动填充范围: 类似于 Excel 中的自动填充，此活动将给定公式应用于电子表格中的指定范围。


  - 复制粘贴范围: 使用户能够将整个范围从一个电子表格复制并粘贴到另一个电子表格。复制的内容可以包括值、格式和公式。


  - 查找范围: 类似于数据表和 Excel 中的查找函数，查找范围活动可以在给定范围的所有单元格中搜索值。


  - 删除重复范围: 删除指定范围中的所有重复行。


  ## Excel 表格活动


  表格活动与您在 Excel 电子表格中创建的表格进行交互。这些活动允许您执行与排序、筛选和创建表格相关的基本功能。以下活动可用于在表格上完成先前提到的功能：


  - **创建表格**：在指定范围中创建指定表格。






  - **筛选表格**：根据提供的条件筛选 Excel 电子表格中的表格。**筛选表格** 活动可与 **读取范围** 活动配合使用，当您想要读取筛选后的结果时。筛选操作与
  Excel 中的筛选功能相同。应用筛选后，不符合条件的行将在电子表格中隐藏。


  - **排序表格**：根据给定列的值以升序或降序排序指定表格。


  ## Excel 文件活动


  文件活动主要与文件本身相关：


  - **保存工作簿**：保存指定的工作簿。**Excel 应用程序范围** 活动在退出前会自动保存文件，前提是 **属性** 面板中启用了 **保存更改** 选项。不过，此活动也可用于保存文件。


  - **关闭工作簿**：使用户能够关闭特定的 Excel 电子表格。


  ## 单元格颜色活动


  准备 Excel 文件时通常需要添加一些颜色来突出显示特定值。单元格颜色子类别下的活动使用户能够执行以下着色操作：


  - **获取单元格颜色**：返回 Excel 文件中特定单元格的背景颜色，并将其存储在 `Color` 变量中。


  - **设置范围颜色**：使用户能够将指定单元格范围的背景更改为用户指定的颜色。输入为 `Color` 变量类型。


  ## 工作表活动


  工作表活动提供执行与 Excel 工作表相关的不同操作的功能，例如复制和检索工作表信息。以下活动使您能够处理 Excel 工作表：


  - **复制工作表**：使用户能够在同一 Excel 文件或不同文件中创建工作表的副本。


  - **获取工作簿工作表**：按索引检索工作表名称。


  - **获取工作簿工作表**：检索工作簿文件中所有可用工作表，并将其作为 `String` 数组返回。


  ## 数据透视表活动


  处理财务信息时通常需要对数据进行透视并将其转换为更具图形化和摘要的格式，以便获得更好的洞察。通常，创建透视表后，需要刷新它。UiPath 提供了两个活动来创建和刷新数据透视表：


  - **创建数据透视表**：使用指定参数创建数据透视表。Excel 中的数据必须首先转换为表格，才能使用此活动的 `Pivot` 功能。


  - **刷新数据透视表**：使用户能够刷新数据透视表，以根据源更新其内容。


  ## 宏活动


  Microsoft Excel 能够使用宏和 VB 脚本来自动执行简单的应用程序特定操作。UiPath 可以与现有宏进行交互，甚至可以使用 VBA 脚本创建宏：


  - **执行宏**：执行 `.xlsm` 文件中可用的宏


  - **调用 VBA**：使用 VBA 脚本调用另一文件中可用的宏


  根据我们所讲的内容，您现在已经熟悉 UiPath 可以在 Excel 文件上执行的活动。其中少数活动的功能与数据表活动类似。不过，其余活动主要侧重于 Microsoft
  Excel 提供的功能。下一部分将重点介绍一些 Excel 活动的实际操作练习。实践环节不会涵盖我们描述的所有活动。不过，实践环节将帮助您更好地了解在需要时如何使用所讨论的活动。


  ## 实践 Excel 自动化


  在本节中，您将通过与 Excel 文件中的一些数据进行交互来实践所学概念。该 Excel 文件包含员工信息，如 `employee ID`、`first name`、`last
  name`、`hourly rate` 和 `work hours`。我们的任务是遍历数据并在 Excel 文件中添加两个新列。


  一列应包含全名（合并名和姓），另一列应包含员工的总支付金额（时薪 × 工时）。报告生成后，机器人还应筛选数据，找出收入超过 2,000 美元的员工，并为这些数据创建一个单独的
  Excel 文件。


  执行以下步骤以完成此任务：


  - 1. 打开 UiPath Studio 并创建新项目。


  - 2. 打开 Microsoft Excel 并创建如图 9.16 所示的数据：


  | ID | 名 | 姓 | 年龄 | 时薪 ($) | 工时 |

  |---|---|---|---|---|---|

  | E0001 | Dany | Joe | 25 | 5 | 20 |

  | E0002 | John | Smith | 36 | 25 | 100 |

  | E0003 | John | Doe | 27 | 15 | 120 |

  | E0004 | Mary | Ann | 30 | 15 | 50 |

  | E0005 | Emmy | Elissa | 21 | 10 | 200 |


  图 9.16 – Excel 集成示例数据


  - 3. 将 Excel 文件保存在可用作我们进程输入的文件夹中。


  - 4. 在 UiPath Studio 中打开 Main.xaml 文件。


  - 5. 拖放 Excel 应用程序范围活动，并通过提供您创建的 Excel 文件的文件路径来配置“工作簿路径”属性。


  Excel 应用程序范围活动中包含一个 DO 序列。这就是您放置所有需要在 Excel 文件上执行的活动的位置。从“活动”面板的 Excel 应用集成部分拖动“读取范围”活动，将其放置在
  DO 序列中。以下图示说明了如何通过将“读取范围”活动放在其中来使用 Excel 活动范围读取数据：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_289_0.png)


  图 9.17 – 从 Excel 读取数据


  - 6. 配置 **读取范围** 活动的 **SheetName** 属性，提供您在 Excel 文件中看到的工作表名称。默认情况下，两者均具有 "Sheet1"
  值，匹配成功。


  - 7. 配置该活动的 **Range** 属性，指定开始读取数据的位置。我们的数据从 **A1** 单元格开始，您需要将其设置为 "A1"。


  - 8. 配置该活动的 **Output DataTable** 属性，创建并指定一个新数据表变量，用于保存其从文件中读取的数据：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_290_0.png)


  图 9.18 – Excel 读取范围活动的配置


  - 9. 在 Excel 中指定我们的两个新列。从 **Excel 应用集成** 部分拖动 **写入单元格** 活动，并将其放置在 **读取范围** 活动下方。


  - 10. 配置 **写入单元格** 活动，将 **Range** 属性指定为 "G1"，并将 **Value** 属性指定为单元格值（列名）"Full Name"。


  - 11. 添加另一个 **写入单元格** 活动，并将 Range 属性配置为 "H1"，将 Value 属性指定为新列名 "Total Payment"，如以下屏幕截图所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_291_0.png)


  图 9.19 – 添加写入单元格活动


  - 12. 现在，遍历数据表中的数据并执行操作。在最后一个 **写入单元格** 活动下方添加 **For Each Row** 活动。


  - 13. 配置 **For Each Row** 活动，指定先前为 **读取范围** 创建的数据表变量名。


  - 14. 配置该活动的 **输出索引** 属性，创建并指定名为 `CurrentRowIndex` 的新 **Int32** 变量。该属性为正在处理的每一行生成基于零的索引。此活动生成的值在以后更新
  Excel 文件中的行时将有所帮助。以下图示显示了 **For Each Row** 活动属性的配置，以获取行索引：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_292_0.png)


  图 9.20 - 在 For Each 循环中生成当前迭代值


  - 15. 搜索 **获取行项** 活动，并将其放置在 **For Each Row** 活动的主体中。此活动使用户能够从当前行的指定列获取数据。


  - 16. 配置该活动的 **Row** 属性，指定 **For Each Row** 活动的 `CurrentRow` 变量。


  - 17. 配置该活动的 **列名** 属性，指定 Excel 文件中的 "`First Name`" 列。列名必须与您在 Excel 文件中看到的完全一致。


  - 18. 配置该活动的输出 **Value** 属性，创建并指定名为 `FirstName` 的新字符串变量，如以下图示所示：




  ![](img/84b06ad2832c53c5f677f8ce4c80f184_293_0.png)


  ### 图 9.21 – 从当前行提取数据


  - 19. 放置三个额外的 **获取行项目** 活动，并为每个需要提取的列配置它们。列为 **姓氏**、**每小时费率** 和 **工作小时数**。像处理第一个一样为每个列创建单独的变量来保存数据。确保为
  **每小时费率** 和 **工作小时数** 创建的变量为 `System.Double` 类型：


  | 名称 | 变量类型 | 作用域 |

  |---|---|---|

  | FirstName | String | 主体 |

  | LastName | String | 主体 |

  | HourlyRate | Double | 主体 |

  | WorkHours | Double | 主体 |

  | ExcelData | DataTable | 执行 |

  | CurrentRowIndex | Int32 | 执行 |

  | ProcessedData | DataTable | Excel自动化 |

  | 创建变量 | | |


  ### 图 9.22 – 定义流程的变量


  完成该步骤后，工作流应类似于以下截图：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_294_0.png)


  ### 图 9.23 – 提取数据以执行操作


  现在，开始使用提取的数据更新 Excel 文件。


  - 20. 在最后一个 **获取行项目** 活动下方放置一个 **写入单元格** 活动，使用当前行的数据更新 **全名** 列。


  - 21. 由于您正在更新 **全名** 列的每个行，因此 **范围** 属性不能使用硬编码值，因为行号是动态的。因此，您需要使用 **对每个行** 活动的 **当前行索引**
  变量来查找 Excel 文件中的行号。


  - 22. 请记住，该变量生成从零开始的索引，而在 Excel 中，行号从 1 开始。现在，再次查看 Excel 文件。Excel 中的第一行包含标题。实际数据从第
  2 行开始。因此，您需要将从零开始的索引与 Excel 中从 2 开始的行号匹配。在 **写入单元格** 活动的 **范围** 属性中使用以下表达式。


  请注意，您需要将动态生成的行号转换为 String 类型，因为该字段仅接受字符串值：


  ```

  "G" + (CurrentRowIndex + 2).ToString

  ```


  - 23. 使用以下表达式配置活动的 **值** 属性，以合并名和姓：


  ```

  FirstName + " " + LastName

  ```


  - 24. 在前一个活动下方放置另一个 **写入单元格** 活动，以更新下一列 "**总付款**" 的行。


  - 25. 使用以下公式配置活动的 **范围** 属性。它与之前的公式几乎相同。唯一的区别是 Excel 中的列：


  ```

  "H" + (CurrentRowIndex + 2).ToString

  ```


  - 26. 通过指定以下表达式配置活动的 **值** 属性：


  ```

  (HourlyRate * WorkHours).ToString

  ```


  - 27. 在 **对每个行** 活动下方放置一个 **保存工作簿** 活动，以在关闭文件前保存更改。


  - 28. 运行流程并查看 Excel 文件中的输出。流程完成后，您应在 Excel 文件中看到以下输出：


