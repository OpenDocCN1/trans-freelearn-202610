- "## 10 探索用户界面和用户/机器人交互\n\n**用户界面**（**UI**）自动化是当今自动化世界中最重要的自动化主题之一，也是使用最频繁的主题。UI\
  \ 元素是 UI 的构建块（例如，窗口、文本字段、按钮、下拉菜单、复选框和文本框）。您的机器人应能够轻松与 UI 元素通信，以执行单击、输入和读取输出值等操作，从而实现完美的自动化解决方案。\n\
  \n作为本章的一部分，您将了解各种更快速、更轻松地与 UI 元素交互的技术。您将学习录制器，并了解如何高效使用它们来实现更快的自动化。您还将学习一些高级 UI\
  \ 自动化，例如图像和文本自动化。最后，您将了解更多关于输入和输出操作的内容，并探索各种有效的自动化方法。\n\n本章包含以下部分：\n\n- UI 交互简介\n\
  - 录制图形用户界面\n- 高级 UI 自动化\n- 输入操作和方法\n- 输出操作和方法\n\n### 技术要求\n\n本章要求您已安装 UiPath Studio\
  \ 和 Robot，并对 Studio UI、变量、数据类型、控制流和数据操作有基本了解。您可以参考第 5 至 9 章以获取所需的所有知识。\n\n### UI\
  \ 交互简介\n\n**图形用户界面（GUI）**由各种图形对象组成，例如窗口、文本字段、按钮、下拉列表、复选框、文本框、表格和 URL。\n\nUiPath\
  \ 能够与大多数类型的桌面和 Web 应用程序无缝交互，因为它\n与 HTML、Java、.NET 和 SAP 等主要 GUI 框架有深度集成。\n\nGUI\
  \ 自动化通过单击、输入、选择、检查值、复制数据和粘贴数据等各种 UiPath 活动与这些 GUI 对象进行交互。UiPath 机器人的交互完全按照 RPA 开发人员设计或开发的流程工作流或自动化项目的指示，以逻辑清晰、更快速、无错误的方式精确复制人类交互。\n\
  \n### 前台与后台自动化\n\n**前台进程**由有人值守的机器人运行，通常在人工监督下执行。机器人使用前台活动与 GUI\n元素进行交互。**后台进程**由无人值守的机器人在专用机器上执行，使用后台活动。您需要使用适当的活动来\n\
  实现高效的 UI 自动化，为此，让我们按如下方式探索 UiPath Studio 中的关键 UiPath UI 自动化\n元素：\n\n- **活动**：这会指示机器人根据所选活动类型、配置的输入、活动属性以及\
  \ GUI 生成的输出，在 GUI 上执行操作。作为先决条件，您需要确保 `UiPath.UIAutomation.Activities` 依赖项包默认可用于\
  \ **依赖项** 节点。如果该包不可用或被意外移除，则需要从 **管理包** 安装相同的包。我们将在即将到来的章节中进一步探讨关键活动，如 *图 10.1*\
  \ 所示：\n\n\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_301_0.png)\n\n图 10.1 – UI\
  \ 自动化关键活动\n\n- **录制**: 这使 RPA 开发人员能够捕获逐步过程以及与 GUI 元素的所有关键交互，并将其转换为 UiPath Studio\
  \ 中的排序工作流，以便更快速地开发 UI 自动化，如下图所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_302_0.png)\n\
  \n图 10.2 – 录制\n\n- **目标**: 这指示机器人根据配置的**目标**属性，确定需要对哪些 UI 元素执行操作，如图 10.3 所示。最重要的元素是**选择器**，我们已在第\
  \ 8 章，探索 UiPath 选择器 中讨论过。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_302_1.png)\n\
  \n图 10.3 – 定位方法\n\n- 输入和输出: 这些是 UiPath 中的重要功能，用于决定您正在开发的 UI 自动化类型，例如前台或后台自动化。您将启用\
  \ SendWindowsMessages 或 SimulateType，如图 10.4 所示。如果您的自动化需要在后台运行且无需任何人工干预，则会选中这些选项：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_303_0.png)\n\n图 10.4 – 输入和输出方法\n\n##\
  \ 活动\n\nUI 自动化活动用于为机器人开发**任务**或**工作流**，以便与多个应用程序的 GUI 进行通信。活动本质上分为四种不同的类型，如 *图 10.5*\
  \ 所示：\n\n| 活动 | 描述 |\n| :--- | :--- |\n| **容器** | 这些用于定位任何 GUI 应用程序（桌面、Web 或大型机）或识别活动窗口或弹出窗口，以与所选窗口范围内的元素进行通信。打开浏览器、打开应用程序、附加浏览器和附加窗口是容器的示例。\
  \ |\n| **输入** | 这些活动用于向 UI 元素提供输入或执行操作。示例包括单击、键入和发送热键。 |\n| **输出** | 这些活动指示机器人从\
  \ GUI 提取数据。示例包括获取文本、获取 URL 和获取 OCR 文本。 |\n| **同步** | 这些活动指示机器人根据 GUI 行为执行定义的操作，以克服任何意外的\
  \ UI 行为。示例包括元素是否存在、图像是否存在和等待元素消失。 |\n\n图 10.5 – UI 自动化活动类型\n\n## 属性\n\n活动的属性决定了机器人将根据所使用的活动如何与\
  \ GUI 进行交互。不同的属性选项可在**属性**面板部分中找到，该部分通常默认显示在 UiPath Studio 的右侧。让我们按照以下方式探索 GUI 自动化中使用的一些关键属性：\n\
  \n- **活动后延迟**和**活动前延迟**: 指示机器人在执行活动之前或之后等待指定的毫秒数。**活动后延迟**的默认延迟时间为 300 毫秒，**活动前延迟**的等待时间为\
  \ 200 毫秒。您可以根据 UI 元素的响应增加或减少延迟时间。\n\n- **继续出错**: 指示机器人在执行活动之前或之后等待指定的毫秒数。默认情况下，**继续出错**为\
  \ **假**，这意味着在发生任何错误或异常时，其余活动将不会执行。如果您希望在发生应用程序异常的情况下继续执行，可以将其选择为 **真**。\n\n- **裁剪区域**:\
  \ 使用 **左**、**右**、**上** 和 **下** 等坐标来定位特定区域。裁剪区域中的值默认为空。如果可用，您可以输入坐标值。\n\n- **发送窗口消息**:\
  \ 向目标应用程序发送特定消息，可以在后台运行，但不是最快的选项，并且与所有桌面应用程序不兼容。默认情况下，**发送窗口消息**复选框未被选中。\n\n- **模拟输入**和**模拟点击**:\
  \ 向目标应用程序发送特定消息，可以在后台运行；这是最快的选项，并且与所有桌面应用程序兼容。默认情况下，**模拟输入**或**模拟点击**复选框未被选中。\n\n\
  - **目标**: 通过以选择器、模糊选择器、图像或锚点形式提供输入，以不同的方式帮助机器人识别目标元素。**选择器**是常用的标识元素的方法；它是机器人用来识别目标元素的关键属性，使用带有多个属性的\
  \ XML 片段来定位唯一的目标元素。\n\n- **输出**: 使用变量或参数存储活动的输出，以便在项目中使用。默认情况下，**输出**字段将为空。您可以在该字段中创建变量，以存储所选活动生成的输出。\n\
  \n让我们通过 https://www.packtpub.com/ 举个示例，应用迄今所学的几个 UI 自动化活动和属性，以确保我们可以与 Web 应用程序通信。编写本课时时，我可以在此\
  \ URL 上看到“免费 7 天试用”页面。如果您找不到相同的页面，可以使用任何其他类似页面。在此示例中，您将访问 Web 应用程序并与 Web 元素进行交互以提供输入，并从网页中访问数据：\n\
  \n- 1. 启动 https://www.packtpub.com/。\n\n- 2. 单击“启动 7 天免费试用”按钮，如图 10.6 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_306_0.png)\n\
  \n图 10.6 – Packtpub 免费试用访问\n\n- 3. 下一页显示我们将要自动化的“帐户详细信息”部分，如图 10.7 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_306_1.png)\n\
  \n图 10.7 – Packtpub 免费试用注册\n\n- 4. 按以下步骤启动 UiPath，并创建用于处理“帐户详细信息”部分数据的序列工作流，如图 10.8\
