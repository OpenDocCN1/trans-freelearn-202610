  \n- Enterprise Cloud Edition：UiPath Enterprise Cloud Edition通过将基础架构维护在云端，满足Community级和Enterprise级用户的自动化需求。它提供通过云端即时访问构建自动化流程所需的所有工具和服务，并支持自动化资源的无限扩展，以实现完全的企业级容量。此版本安全性高且合规，并提供集中式用户访问管理。此外，此版本还提供UiPath技术支持团队的高级支持，以防出现任何问题，并提供来自UiPath官方培训合作伙伴的专业培训。\n\
