  图 15.21 – 流程决策活动\n\n既然您已在 Order Entry CRM 网页上完成客户详细信息的输入，接下来让我们在 CRM 中输入发票详细信息。\n\
  \n## 输入发票详细信息\n\n在本节中，您将在 Order Entry CRM 网页上输入发票详细信息的详情。为此，请执行以下步骤：\n\n- 1. 创建一个名为\
