  \n图 6.44 – 大于 10 的输入的输出窗口\n\n在本节中，我们探索了 Do While 活动，它在许多编程场景中用于循环处理输入或值，直到满足特定条件为止。在下一节中，我们将了解\
  \ `For Each` 活动，以了解如何处理每一条可用的输入数据。\n\n## For Each\n\nFor Each 活动可帮助您遍历列表、数组或字典中定义的数据集合中的每个项目，如您在\
