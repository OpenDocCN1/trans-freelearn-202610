  完成上述步骤后，您现在了解如何使用参数在工作流文件之间传递数据。参数和变量的使用对接下来的章节非常重要。必须使用不同的变量和参数进行练习，这一点至关重要且不可或缺。变量和参数可能有多种数据类型，了解不同的数据类型以使用与这些数据类型相关的特定函数非常重要。本章的下一部分将解释
  UiPath 中使用的不同数据类型。


  ## 了解数据类型


  UiPath 使用多种数据类型来执行和存储不同的数据元素。本节不涵盖所有可用的数据类型。但是，它解释了不同自动化解决方案中常用的数据类型。


  让我们来看看一些常用的变量，如下所示：


  - **字符串变量**：存储任何文本序列。有许多专门用于字符串处理的方法，将在 *第 7 章，使用 UiPath 操作数据* 中详细介绍。


  - **布尔变量**：仅用于存储两个值 `True` 和 `False`，用于控制语句以帮助确定程序流程






  - Number variables: 用于存储数值以执行方程或执行比较等。有许多数值变量子类型，以下屏幕描述了其中一些类型：


  | Numeric Type | Description |

  | :--- | :--- |

  | Int16/32/64 | 有符号整数（例如，10、20、100、-250）。 |

  | Long | 包含范围从 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,808 的有符号整数 |

  | Double | 允许存储最大和最小可能的浮点数。 |

  | Decimal | Decimal 支持存储最多 29 位有效数字的值，并可表示高于 7.9228 x 10 ^ 28 的值。Decimal 类型更适合财务计算，因为它支持大数字，并且在舍入值时不会提供错误。
  |


  图 5.24 – 数值数据类型


  - Date and time variables: 日期和时间变量：这些变量类型包含两类数据，如以下屏幕截图所示：


  | Data Type | Description |

  | :--- | :--- |

  | DateTime | 用于存储特定日期的日期和时间信息。这允许执行日期相关的计算，例如计算日期持续时间以及添加和减去日期。 |

  | TimeSpan | 用于测量两个给定时间值之间的持续时间。 |


  图 5.25 – 日期相关数据类型


  - DataTable variables: DataTable 变量：用于以行和列存储表格数据，容纳大块数据，并充当数据库。DataTable 变量对于执行过滤大量数据、搜索和复制等操作很有用。


  - GenericValue variables: GenericValue 变量：当您不确定进程返回哪种类型的数据时，GenericValue 变量非常有用。它们能够根据分配给变量的第一个值自动转换其类型。UiPath
  建议将 GenericValue 变量用作工作流中的临时解决方案，直到您推导出实际数据类型为止。GenericValue 变量可以容纳任何数据类型，包括 String、Number
  和数组。例如，您正在按列比较两个 Excel 表格，每个列都有不同的数据类型。在这种情况下，我们可以使用 GenericValue 变量来执行比较。


  - Collection type variables: 集合类型变量：包括所有集合对象，例如数组、列表和字典。以下屏幕截图描述了常用集合对象：


  | Collection Type | Description |

  |---|---|

  | Arrays | 用于存储相同数据类型的多个值。对象大小在创建时定义。 |

  | Lists | 用于存储相同数据类型的多个值（类似于数组）。但是，列表的大小在执行期间可能会更改。 |

  | Dictionary | 用于以键值对形式存储数据值，其中唯一键引用每个值。简单来说，字典变量中的每个值都使用描述集合中值的唯一键来引用。 |


  图 5.26 – 集合数据类型


  到现在，您应该已初步了解常用数据类型。我们将在第 7 章《使用 UiPath 操作数据》中讨论如何使用这些数据类型及其独特功能。


  ## Summary


  本章向您介绍了变量和参数。变量和参数是特定定义类型的容器，使用户能够在执行期间保留数据。在 UiPath 中，变量/参数的属性定义了它们在自动化工作流中的用途。本章介绍了属性，并提供了配置和使用变量及参数的分步实践指南。此外，本章还对常用数据类型进行了初步介绍，将在数据操作章节中详细介绍。


  讨论的变量和参数概念及其用法在后续章节中将非常有用。下一章介绍了设计自动化工作流时使用的控制流。控制流章节使您能够了解如何构建工作流，包括条件语句和循环。构建用于支持业务流程的自动化解决方案包含许多决策点，并可能要求您迭代执行相同步骤，因此掌握构建执行流程的概念至关重要。

