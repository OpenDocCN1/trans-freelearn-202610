  这让我们对录制有了更清晰的认识，并指导我们为不同场景选择合适的录制工具。\n\n## 高级 UI 自动化工具\n\n让我们讨论几种可用于自动化复杂 GUI（如\
  \ Citrix、SAP 和大型机）的高级录制选项：\n\n- **图像**：此录制用于录制图像、文本和键盘输入，适用于 VM、Citrix、SAP 和大型机等虚拟环境自动化。它会捕获元素的精确用户界面位置以及元素的坐标值，以实现\
  \ GUI 自动化。\n\n- **原生 Citrix**：此录制用于录制图像、文本和键盘输入，适用于 Citrix 环境中的应用程序。它类似于桌面录制器，可用于录制\
  \ Citrix 环境中的不同类型的应用程序。\n\n- **计算机视觉**：此录制主要用于录制图像、文本和键盘输入，适用于 Citrix 环境和 Windows\
  \ 环境中的应用程序（在这些环境中，之前讨论的任何其他录制选项均无法识别 UI 元素）。它是一种智能录制器，使用内置神经网络更准确地捕获 UI 元素，以克服任何选择器不一致的问题。\n\
  \n- **对象存储库**：一种高级功能，用于从应用程序中捕获 UI 元素并将其作为**可重用对象**存储在存储库中，以便按需使用或与其他项目共享。这些对象可以从对象存储库拖放到工作流中，以便更快地开发自动化，且易于管理、可重用且可靠。\n\
  \n我们已讨论几种高级概念，并了解了如何使用不同的工具和技术来自动化 Citrix、大型机和 SAP 等 GUI。在下一部分中，我们将进一步了解输入和输出方法，以开发更高效的自动化解决方案。\n\
  \n## 输入操作和方法\n\n自动化需要配置某些属性，以便在流程执行期间无缝运行。要执行前台或后台自动化，输入需要由用户或机器人在 GUI 中直接执行。有三种输入方法，我们将立即讨论。\n\
  \n### 默认或硬件事件\n\n默认应用程序使用硬件驱动程序模拟鼠标事件或键盘事件，以与 GUI 通信。当 **发送窗口消息** 和 **模拟键入** 默认禁用时会选中此项，如图\
  \ 10.51 所示。在这种情况下，机器人会精确模拟人类操作，例如移动光标和单击 UI 元素。UI 元素需要可见，此事件才能成功。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_335_0.png)\n\
  \n图 10.51 – 默认方法\n\n默认方法的主要特征如下：\n\n- 与所有应用程序 100% 兼容。\n- 仅在前台运行，无法进行后台执行。\n- 执行速度通常较慢，仅为模拟键入的\
  \ 50%。\n- 默认支持热键。\n- 默认不会自动清空输入字段，这意味着它不会清除输入字段中可能包含空格或先前执行的输入值等任何现有值。\n\n### 发送窗口消息\n\
  \n发送窗口消息通过直接向 GUI 元素发送特定消息来模拟鼠标事件或键盘事件。在“选项”部分中选择“发送窗口消息”时可激活此功能，如图 10.52 所示。此事件无需\
  \ UI 元素可见即可成功，因为它在后台工作。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_336_0.png)\n\
  \n图 10.52 – 发送窗口消息\n\n发送窗口消息方法的主要特征如下：\n\n- 与所有应用程序 80% 兼容。\n- 仅在后台运行。\n- 执行速度略好于默认方法，约为模拟键入的\
  \ 50%。\n- 默认支持热键。\n- 默认不会自动清空输入字段。\n\n### 模拟键入\n\n模拟键入方法通过使用 API 进行通信来模拟鼠标事件或键盘事件，API\
  \ 提供了一组函数，允许应用程序访问目标应用程序的特定功能或数据，并且是所有三种输入方法中最快的一种。在“选项”部分中选择“模拟键入”方法时会选中此项，如图 10.53\
  \ 所示。它与桌面应用程序和 Web 应用程序兼容，并且此事件无需 UI 元素可见即可成功，因为它在后台工作。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_337_0.png)\n\
  \n图 10.53 – 模拟键入\n\n模拟键入方法的主要特征如下：\n\n- 与 Web 应用程序 99% 兼容，与桌面应用程序 60% 兼容。\n- 在前台和后台执行中均可运行。\n\
  - 执行速度是所有三种输入操作中最快的。\n- 默认不支持热键。\n- 默认会自动清空输入字段。\n\n在本节中，我们探索了不同的输入方法，并了解了如何在实际情况下使用它们。在下一节中，我们将了解使用**输出方法**进行输出数据提取。\n\
  \n## 输出操作和方法\n\n自动化需要配置某些屏幕抓取方法和抓取选项，以便从 GUI 元素、PDF 或文档中提取值。这里有三种输出方法，我们将在此讨论。\n\
  \n### 全文\n\n**全文** 是默认输出方法，也是使用最频繁的方法。使用全文方法需要遵循以下步骤：\n\n- 1. 从**设计**面板中单击**屏幕抓取**，如\
  \ _图 10.54_ 所示，这将为您提供一个光标来选择**目标**元素：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_338_0.png)\n\
  \n图 10.54 – 屏幕抓取\n\n- 2. 单击要提取的元素，这将打开**屏幕抓取向导**，然后完成以下操作：\n\n- I. 为抓取方法选择 **全文\
  \ (1)**。\n- II. 在“抓取选项”下选中**忽略隐藏 (2)**，以忽略任何隐藏文本。\n- III. 如果“抓取选项”中有任何更改，请单击**刷新\
  \ (3)** 按钮。\n- IV. 在**抓取结果预览 (4)** 中验证输出。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_339_0.png)\n\
  \n图 10.55 – 屏幕抓取向导\n\n**全文** 抓取方法的特征如下：\n\n- 所有抓取方法中执行速度最快。\n- 该方法的准确率为 100%。\n\
  - 支持后台执行。\n- 不提取文本位置。\n- 可以提取隐藏文本。\n- 不提取来自 Citrix 的输出。\n\n### 原生\n\n原生方法能够从与 **图形设备接口\
  \ (GDI)** 和 **Microsoft API** 兼容的应用程序中提取数据，这些接口用于识别图形对象。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_340_0.png)\n\
  \n图 10.56 – 屏幕抓取向导 – 原生\n\n原生抓取方法的特征如下：\n\n- 执行速度最快，速度为全文的 80%。\n- 该方法的准确率为 100%。\n\
  - 不支持后台执行。\n- 可以提取文本位置。\n- 不能提取隐藏文本。\n- 不提取来自 Citrix 的输出。\n\n### 光学字符识别\n\n如果其他两种方法无法提供所需结果，则建议使用\
  \ **光学字符识别**。它从扫描的文档或图像中提取数据，并将输入转换为可机器读取的文本。它的准确率不是 100%，并且适用于不同类型的应用程序。默认情况下，光学字符识别\
  \ 使用 **Google Tesseract** 和 **Microsoft Modi OCR** 引擎。\n\n\n\n\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_341_0.png)\n\
  \n图 10.57 – 屏幕抓取向导 – OCR\n\n本机抓取方法的特点如下：\n\n- 它是所有三种输出方法中最慢的一种，速率为 FullText 的 30%。\n\
  - 该方法的准确率为 98%。\n- 它不支持后台执行。\n- 它可以提取文本位置。\n- 它不能提取隐藏文本。\n- 它可以从 Citrix 提取文本输出。\n\
  \n在本节中，我们探索了不同的输出方法，并了解了各种方法在从各种应用程序中提取输出时的应用。\n\n## 摘要\n\n本章我们探索了关于 UI 自动化交互的所有内容：分析如何处理不同的\
  \ UI 自动化活动、不同类型的录制，以及不同类型的输入和输出方法。我们进一步探索了活动，并执行了几个项目从 Web 应用程序和桌面应用程序中抓取数据。我们还介绍了一些高级\
  \ UI 自动化概念，例如图像和计算机视觉录制。\n\n在下一章中，您将使用 PDF 自动化，您可以使用 UI 交互的概念通过“获取完整文本”以及 OCR 从\
  \ PDF 中检索数据。您还将实现大部分活动、输入和输出方法来处理 PDF 数据。\n"
- '## 自动化 PDF 数据提取


  在前几章中，我们讨论了可用于与多个应用程序交互的不同交互方法。此外，我们讨论了 PDF 文件在日常运营中发挥着重要作用。PDF 文件是组织/个人之间共享信息时最常用的文档类型之一。PDF
  文件中共享的信息可能包括发票、采购订单、信函、财务信息、法律文档等。因此，您必须了解如何使用 UiPath 从 PDF 文件中提取数据以自动执行手动操作。


  本章着重介绍如何使用 UiPath 自动化 PDF 文件以及可用于成功执行 PDF 自动化的活动。


  本章包含以下各节：


  - 创建可读取 PDF 文本的机器人

  - 使用提取 PDF 文本和使用 OCR 提取 PDF 活动从 PDF 提取文本

  - 使用屏幕抓取提取 PDF 文本

  - 从 PDF 文件中提取单个动态值

  - 使用锚点基活动提取单个值


  在本章结束时，您将对执行 PDF 自动化所使用的最常见方法有清晰的了解。


  ## 技术要求


  在开始本章之前，请确保已安装 UiPath Studio 和机器人。


  本章要求您大致了解如何使用 Studio 创建变量和简单工作流。此外，了解如何使用 UI 选择器（如第 10 章 探索用户界面和用户/机器人交互中所述）将有助于您理解本章中介绍的一些概念。此外，您的机器上必须安装
  Adobe Reader。


  ## 创建可读取 PDF 文件的机器人


  基于我们在创建自动化解决方案方面的以往经验，我们知道 UiPath 解决方案默认包含以下依赖项：


  - UiPath.Excel.Activities

  - UiPath.System.Activities

  - UiPath.UIAutomation.Activities

  - UiPath.Mail.Activities


  但是，默认活动不包含用于 PDF 自动化的专用活动。因此，我们需要向需要 PDF 交互的自动化项目添加新依赖项。请执行以下步骤，创建包含 PDF 自动化活动的项目：


  - 1. 打开 UiPath Studio，提供 **项目名称** 和 **路径** 详细信息以创建新项目。

  - 2. 项目打开后，单击 **设计** 选项卡顶级功能区上的 **管理程序包** 按钮。这将打开 **管理程序包** 窗口，如下所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_345_0.png)


  图 11.1 – 管理程序包选项


  - 3. 在 **管理程序包** 窗口中选择 **所有程序包** 选项，并使用搜索选项搜索 UiPath.PDF.Activities。

  - 4. 从程序包列表面板中选择 UiPath.PDF.Activities。然后，单击 **安装** 按钮为您的解决方案安装该程序包：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_345_1.png)


  图 11.2 – 正在安装 UiPath.PDF.Activities


  - 5. 单击 **保存** 按钮以完成安装过程并关闭 **管理程序包** 窗口。

  - 6. 单击 **活动** 面板，导航到 **应用集成** 和 **PDF**，以查找所有与 PDF 交互相关的活动。


  现在我们准备构建第一个 PDF 自动化。但是，首先，我们需要了解每个活动的用法：


  - **将 PDF 页面导出为图像**：此选项允许用户将 PDF 文件的指定页面导出为图像文件。当用户需要将大型 PDF 文件中的指定页面导出为多个文件以供以后使用时，可以使用此功能。

  - **从 PDF 提取图像**：此选项允许用户提取 PDF 文件中的所有图像，并将其保存在指定文件夹中以供以后使用。

  - **提取 PDF 页面范围**：此选项允许用户将指定页面或页面范围提取到另一个 PDF 文件中。使用此活动仅提取所需页面可以减少下游流程操作中的任何不必要的处理时间。用户可以提供由逗号分隔的页面范围或单个页码，如以下示例所示："1,
  2, 10, 15-20"。

  - **获取 PDF 页数**：此选项返回指定 PDF 文件中可用的页数。

  - **合并 PDF 文件**：此选项允许用户将两个指定的 PDF 文件合并为一个 PDF 文件。

  - **管理 PDF 密码**：此选项允许用户对 PDF 文件进行密码保护或取消保护。

  - **读取 PDF 文本**：此选项读取指定 PDF 文件中的所有文本，并将提取的文本存储在字符串变量中。此活动只能读取计算机生成的 PDF 文件中的文本。请注意，PDF
  文件中的图像或扫描文档不会通过此活动提取。

  - **使用 OCR 读取 PDF**：此选项允许用户使用任何 OCR 引擎提取和读取 PDF 文件文本。此活动使用户能够从包含扫描文档的 PDF 文件中提取文本。

  - **读取 XPS 文本**：除了 PDF 文件之外，PDF 活动还允许用户从 XPS 文件读取文本，并将数据存储在字符串变量中。此活动类似于 **读取 PDF
  文本** 活动。

  - **使用 OCR 读取 XPS**：此选项允许用户使用 OCR 引擎读取 XPS 文件的所有字符。此活动类似于 **使用 OCR 读取 PDF** 活动。


  现在您已经初步了解了 PDF 包中可用的活动，我们将了解如何使用其中一些活动。在下一节中，我们将重点介绍使用一些已讨论的活动来生成一些输出。


  ## 使用提取 PDF 文本和使用 OCR 提取 PDF 活动从 PDF 提取文本


  可以按文本列或单个元素从 PDF 文件中提取数据。首先，我们将了解如何提取页面中的所有数据。使用 **读取 PDF 文本** 和 **使用 OCR 读取 PDF**
  活动，用户可以读取大型文本文件。PDF 文件的一页可能包含计算机生成的文本，也可能包含图像格式的文本。一旦文件在 Adobe Reader 中打开，您可以轻松地单独高亮显示计算机生成的文本，而图像格式的文本则会作为一部分被高亮显示。找到包含此类文本的
  PDF 文件，并尝试用于我们的作业。让我们通过执行以下步骤，使用先前提到的活动构建一个简单的工作流：


