  图 5.3 – 工作室开始页


  3. 在弹出的菜单中，提供解决方案名称和要保存解决方案的文件路径，然后单击 **创建** 按钮以创建您的空白解决方案，如下图所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_149_1.png)


  图 5.4 – UiPath Studio 项目创建页面


  4. 创建项目后，您的屏幕将类似于下图所示。现在，单击 Main.xaml 文件在设计器面板中打开它。


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_150_0.png)


  图 5.5 – UiPath Studio 项目主页


  5. 单击活动面板，搜索序列活动，并将其拖放到工作流主体中。


  6. 打开变量面板，创建一个名为 UserName 的字符串类型变量，如下图所示：


  | 名称 | 变量类型 | 作用域 | 默认值 |

  |---|---|---|---|

  | UserName | 字符串 | 序列 | 输入 VB 表达式 |

  | 创建变量 | | | |


  图 5.6 – 变量创建


  7. 从 **活动** 面板搜索 **输入对话框** 活动，并将其拖放到设计器中。**输入对话框** 活动会提示用户在运行时输入一个值。


  8. 配置 **输入对话框** 活动，如下图所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_151_0.png)


  图 5.7 – 配置输入对话框活动


  9. 从 **活动** 面板搜索 **消息框** 活动，并将其放置在 **输入对话框** 活动下方。


  10. 通过键入以下命令配置 **消息框** 活动：


  ```

  "Hello " + UserName + ", Nice to see you!"

  ```


  11. 现在，单击 **设计** 功能区上的 **调试文件** 按钮（或按 F6）以运行进程。


  12. 一旦 **输入对话框** 活动在您的屏幕上显示，提供一个名称并单击确定。


  13. 您将看到一个 **消息框** 活动，其中包含文本 "Hello John, Nice to see you!"（如果您提供 John 作为名称）。根据您提供的名称，**消息框**
  活动可能会更改。


  完成此实践任务后，您现在知道如何使用变量来分配用户输入的值并在消息框中显示它。


  现在，让我们看一个变量作用域更改会影响工作流的场景，如下所示：


  1. 使用您刚刚构建的相同工作流，现在选择另一个 **序列** 容器，并将其定位在 **输入对话框** 和 **消息框** 活动之间，如下图所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_152_0.png)


  图 5.8 – 向工作流添加内部序列


  2. 双击新添加的 **序列** 容器的标题，并将其重命名为 **内部序列**，如下图所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_153_0.png)


  图 5.9 - 重命名内部序列


  3. 从 **活动** 面板搜索 **赋值** 活动，并将其放置在 **内部序列** 容器内。


  4. 为 **赋值** 活动的 **值** 段提供以下值：


  ```

  "Welcome to my first RPA program"

  ```


  5. 单击 **赋值** 活动的 **对象** 段，并按 Ctrl + K 以启用变量创建模式。


  6. 将变量名提供为 `WelcomeMessage` 并按 `Enter` 创建此变量。


  7. 现在，您的工作流和 **变量** 面板应类似于此：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_154_0.png)


  | 名称 | 变量类型 | 作用域 |

  | --- | --- | --- |

  | UserName | 字符串 | 序列 |

  | WelcomeMessage | 字符串 | 内部序列 |

  | 创建变量 | | |


  图 5.10 – 配置赋值活动后的工作流


  仔细查看 **变量** 面板，我们注意到新 `WelcomeMessage` 变量的 **作用域** 值自动设置为 **内部序列**。这意味着 `WelcomeMessage`
  变量仅在 **内部序列** 作用域内可访问。但是，在选择 **赋值** 活动时，您仍然可以在 **变量** 面板中看到 `UserName` 变量。这意味着您可以在
  **内部序列** 作用域内访问 `UserName` 变量，因为 `UserName` 变量的作用域是容纳内部序列的外部序列。


  8. 现在，单击 **消息框** 活动，同时密切监视 **变量** 面板。一旦单击 **消息框** 活动，`WelcomeMessage` 变量将从 **变量**
  面板中消失，如下图所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_155_0.png)


  图 5.11 – 解释变量作用域


  变量消失是因为 **内部序列** 变量无法在其定义作用域之外使用。


  9. 如果您尝试通过包含 WelcomeMessage 变量来配置 **消息框** 活动，该活动将向您显示一条错误消息，如下所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_156_0.png)


  图 5.12 – 解释由于作用域不正确导致的错误


  错误消息指出 WelcomeMessage 变量未声明，因为它找不到该变量。


  10. 现在，再次选择 **内部序列** 容器，并将 WelcomeMessage 变量的 **作用域** 值更改为外部序列。配置完成后，您的 **变量** 面板应类似于此：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_156_1.png)


  | 名称 | 变量类型 | 作用域 | 默认值 |

  |---|---|---|---|

  | WelcomeMessage | 字符串 | 序列 | 输入... |

  | UserName | 字符串 | 序列 | 输入... |

  | 创建变量 | | | |


  图 5.13 – 修复变量作用域问题


  您现在可以看到 **消息框** 活动的错误已消失，因为该变量现在可访问了。


  11. 单击调试文件按钮（或按 F6）运行进程以体验输出。


  您在本节中遵循的实践步骤让您很好地了解了创建变量的不同方式以及变量的作用域如何影响工作流。关于变量的知识在我们探索参数时将会非常有用。参数与变量非常相似，但具有不同的属性。然而，它们使用与变量相同的概念，只是略有不同。


  ## 探索参数


  在 UiPath 中，变量的目标是在指定作用域内存储数据，并根据需要将其传递给其他变量或活动。现实世界的自动化项目包含多个工作流，因此使用变量不足以连接工作流。UiPath
  中的参数派上用场以填补这一差距，充当允许在多个工作流之间传输数据的容器。参数与工作流非常相似，因为它们根据其定义的数据类型动态存储数据。然而，区别在于参数具有方向属性，用于描述数据如何在工作流之间传输。此外，使用参数使用户能够在多个项目中重用自动化工作流。


  让我们看看参数的属性。


  ### 参数的属性


  让我们看看参数的属性，如下所示：


  - 名称：类似于变量，此属性指示参数的名称。为了区分变量和参数，我们将参数的方向作为名称的前缀作为最佳实践（例如，In_UserName；Out_CustomerData；IO_AccountData）。


  - 数据类型：指定参数持有的数据类型。






  - Direction：指定数据传入/传出的方向。UiPath 中有三个方向，如下图所示：


  | Direction | Description |

  | :--- | :--- |

  | In | 参数只能在给定工作流内使用，因为数据是传入工作流的 |

  | Out | 参数可用于将数据传出给定工作流 |

  | In/Out | 参数可用于同时接收和发送数据 |


  图 5.14 – 参数方向


  - 默认值：参数保持的默认值。但是，对于 Direction 类型定义为 Out 或 In/Out 的参数，此属性被禁用。


  现在我们了解了参数的属性，让我们来看看创建参数的不同方法。


  ## 在 UiPath 中创建参数


  当您希望在多个工作流之间传递数据时，会创建参数。参数创建与变量创建类似，如“练习创建变量”部分所述。使用以下方法创建参数：


  - 通过“参数”面板：单击“参数”面板上的“创建参数”选项，可以通过配置之前讨论的属性来轻松创建参数。下图演示了此选项：


  | 名称 | 方向 | 参数类型 | 默认值 |

  |---|---|---|---|

  | In CustomerName | In | 字符串 | 输入 VB 表达式 |


  创建参数


  图 5.15 – UiPath Studio 中的“参数”面板


  单击 **“创建参数”** 选项会在面板中创建一个新行，用于为新变量提供名称、数据类型、作用域和默认值。


  - **通过“设计器”面板**：使用要与之关联参数的活动，并按 *Ctrl + M* 快捷键在 **“设计器”** 面板中启用参数创建模式。您可以根据需要提供参数名称并通过
  **“参数”** 面板进行其他配置。通过 **“设计器”** 面板创建的参数会根据活动的配置自动选择参数的数据类型。


  - **通过“属性”面板**：活动的 **“属性”** 面板包含活动的所有配置选项。与 **“设计器”** 面板类似，在参数需要交互的属性中按 *Ctrl +
  M* 快捷键将启用参数创建模式。参数的 **Direction** 值默认自动设置为 **In**。但是，如果要更改 **Direction** 值，则必须通过
  **“参数”** 面板完成。


  与变量类似，参数是支持工作流之间传输数据的容器，从而实现组件的可重用性。既然您现在了解了参数的属性和创建方法，下一部分将为您提供练习创建参数的指南。此练习还可帮助您了解如何在
  UiPath 解决方案中使用多个工作流。


  ## 练习创建参数


  现在，既然我们已熟悉变量和参数的属性，让我们尝试构建一个简单的工作流来测试我们的知识，步骤如下：


