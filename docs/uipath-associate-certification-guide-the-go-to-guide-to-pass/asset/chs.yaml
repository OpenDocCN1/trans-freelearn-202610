  \ Studio中可用的不同部分和功能来实现自动化。\n\n## 探索UiPath Studio界面\n\nUiPath Studio有多种用于多种目的的菜单选项。屏幕上的每个项目都有悬停文本来解释功能。\n\
  \n让我们通过创建一个基本流程来探索UiPath Studio的各个部分，并更熟悉Studio界面。要创建流程，请在新建项目部分单击**流程**，如图2.9所示：\n\
