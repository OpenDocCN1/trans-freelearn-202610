- "## Understanding Different Control Flows\n\n要使用 UiPath Studio 创建强大的自动化工作流，您必须了解如何使用控制流高效地控制项目。UiPath\
  \ 提供了许多控制流活动，因此您可以有效地驱动项目的自动化工作流。控制流为机器人提供了更多能力，使其在执行过程中评估任何业务条件时能够做出决策。在本章中，我们将通过使用实时示例介绍重要的控制流活动来学习这些基本技能。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 控制流概述\n- 什么是序列？\n- 什么是流程图？\n- 探索决策和决策类型\n- 探索循环和循环类型\n\n\
  本章结束时，您将能够理解控制流背后的所有关键概念，并能够在机器人中实现这些想法。\n\n### Technical requirements\n\n若要使用控制流，您需要安装\
  \ UiPath Studio 和 UiPath Robot。\n\n本章您需要大致了解如何使用 Studio 和 Robot。请参阅第 2 章 UiPath\
  \ 生态系统和第 5 章 学习变量和参数，了解 UiPath Studio 的基础知识。\n\n### Overview of control flows\n\n\
  控制流是用于在 UiPath 中将决策要求转换为业务工作流的活动。在 RPA 项目中，控制流在 RPA 代码中按顺序执行。此代码可能包含 UiPath 活动、控制语句和工作流。RPA\
  \ 项目中有两个关键工作流，如下所示：\n\n- **序列**：序列工作流易于阅读，并且按从上到下或按活动序列执行。它们主要用于简单或线性业务流程，这些流程涉及对给定输入数据执行一次自动化执行序列\
  \ *一次*。\n\n- **流程图**：流程图业务流程用于解决涉及许多决策点和复杂逻辑的复杂业务要求。\n\nRPA 工作流使用控制流活动来驱动语句的执行。最常用的控制活动如下：\n\
  \n- **If**：此活动用于验证条件，结果为 `True` 或 `False`。它对于根据变量的输入值做出决策非常有用。此规则使用 *如果-那么-否则* 规则来评估任何给定输入。例如，如果您想通过读取\
  \ `Age` 字段的值来检查选民的资格，则需要评估给定年龄是否大于或等于 18 的业务条件，以查找其资格状态，如以下屏幕截图所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_171_0.png)\n\
  \n图 6.1 – 如果-那么-否则 示例\n\n- **循环**：这些用于根据条件要求验证一组语句，或在满足某个条件之前多次执行语句。关键循环是 **DoWhile**、**While**\
  \ 和 **For Each**。\n\n- **Switch**：当存在两个以上的决策点，并且必须对每个决策结果执行相应操作时，使用此活动。\n\n在本节中，我们提供了控制流的高级概述。我们将在即将到来的章节中更详细地探讨控制流。\n\
  \n### What are sequences?\n\n序列易于理解，并且是最简单的项目类型。它们通常用于线性流程，并具有逐步说明，需在单个活动块中依次执行。序列的主要用途是\
  \ **可重用性**，即它们可以在单个工作流中使用，也可以通过传递参数从任何其他自动化工作流中调用，我们将在 _第 5 章_、_学习变量和参数_ 中讨论这些参数。\n\
  \n例如，您可以创建一个从电子表格获取信息并将其输入注册网页的序列。让我们探索一个示例。\n\n\n\n\n\n## 序列示例\n\n在本示例中，我们将创建一个序列，用于询问名、姓和年龄，然后在句子中显示答案：\n\
  \n- 1. 在 UiPath Studio 的“新建项目”部分中创建一个新空白流程，并将其命名为 Sequence_Example，如下图所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_172_0.png)\n\
  \n图 6.2 – 创建新空白流程\n\n- 2. 输入首选的项目位置以保存项目。\n\n- 3. 在描述字段中输入项目详细信息，并单击创建以创建设计器面板。\n\
  \n- 4. 将“序列”活动从活动面板拖放到设计器面板中。\n\n- 5. 创建三个名为 FirstName、LastName 和 Age 的字符串变量，用于存储从用户接收的信息，如下所示：\n\
  \n| 名称 | 变量类型 | 范围 | 默认值 |\n| :--- | :--- | :--- | :--- |\n| FirstName | String\
  \ | Sequence_Example | 输入 VB 表达式 |\n| LastName | String | Sequence_Example | 输入\
  \ VB 表达式 |\n| Age | String | Sequence_Example | 输入 VB 表达式 |\n\n图 6.3 – 创建变量\n\n\
  - 6. 将三个 **输入对话框** 活动依次拖到项目的序列中。\n\n- 7. 按以下步骤编辑输入对话框的属性，以便其接受并存储 FirstName（以下选项如下图所示）：\n\
  \n  - 将第一个 **输入对话框** 的 **显示名称** 属性设置为 First Name。\n  - 将 **对话框标题** 设置为 \"Enter First\
  \ Name\"。\n  - 将 **输入标签** 设置为 \"What's your First Name?\"。\n  - 将 **输入类型** 设置为 Text\
