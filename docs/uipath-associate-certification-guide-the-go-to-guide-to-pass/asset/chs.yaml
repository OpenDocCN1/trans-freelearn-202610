  \n## 属性面板\n\n此部分用于管理各种活动的属性并管理变量。**属性**面板看起来类似于*图 2.14*，但会根据所选活动而变化：\n\n\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_61_0.png)\n\
  \n图 2.14 – 属性面板\n\n单击**设计器**面板中的某个活动后，**属性**面板将默认显示在右侧。这样，您可以分析或更改所选活动特定的属性。将鼠标悬停在**属性**字段上可获取有关该字段的更多信息。某些属性（例如**键入文本**活动的**文本**字段，或**打开浏览器**活动的**输出**字段）允许从**属性**面板创建变量。\n\
  \n### 变量面板\n\n**变量**面板可让您创建变量并对其进行修改。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_61_1.png)\n\
  \n图 2.15 – 变量面板\n\n创建变量时需要注意以下几个细节：\n\n- **名称**：应为变量指定准确且有意义的名称，并且需使用驼峰命名法创建（例如，userName），这有助于用户轻松读取名称。在此面板中重命名变量会自动更新当前文件中的所有出现位置。\n\
  - **变量类型**：需要从 UiPath 提供的选项列表中选择正确的变量类型。单击**变量类型**列中的**浏览类型...**以浏览所有可用的变量类型选项。变量类型示例包括**字符串**、**Int32**、**布尔值**、**数据表**和**日期时间**。\n\
  - **作用域**：需要决定变量可访问的级别，可以是特定序列的局部作用域，也可以是整个项目的全局作用域。\n\n> **重要说明**\n> 您可以参阅*第 5\
  \ 章，了解变量和参数*中的*练习创建变量*部分，以获取有关使用变量的最佳实践的更多信息。\n\n### 参数面板\n\n**参数**面板主要用于访问工作流时，通过参数传递输入或从参数获取输出。\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_62_0.png)\n\n图 2.16 – 参数面板\n\n需要填写三个必填字段：\n\
  \n- **名称**：可以使用小写或大写驼峰命名法，后跟变量的数据流向。例如，输入用户名可表示为 `in_username` 或 `in_UserName`，输出可表示为\
  \ `out_username` 或 `out_UserName`。\n- **方向**：可以是 **入**、**出** 或 **入/出**，具体取决于数据流向。\n\
  - **参数类型**：需要根据变量或参数的性质进行选择。\n\n### 输出面板\n\n输出面板的主要用途是使用日志消息或写入行活动来验证工作流的结果：\n\n\
  ![](img/84b06ad2832c53c5f677f8ce4c80f184_63_0.png)\n\n图 2.17 – 输出面板\n\n输出面板中提供不同选项，可根据日志消息类型（例如错误或警告）来显示或隐藏消息。还提供一个搜索字段，用于搜索特定日志；在此搜索过程中，匹配结果会被高亮显示。单击“错误列表”面板会显示工作流执行期间的任何错误，单击“警告”面板会显示自动化工作流执行期间生成的任何警告。\n\
