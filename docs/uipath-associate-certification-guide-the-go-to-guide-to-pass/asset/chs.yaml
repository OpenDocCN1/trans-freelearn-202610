  11. 保存新工作流。配置应类似于此：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_162_0.png)


  图 5.20 – 新工作流：消息框配置


  12. 单击 Main.xaml 文件。

  13. 从 **“活动”** 面板搜索 **“调用工作流文件”** 活动，并将其放置在 **“输入对话框”** 活动下方。

  14. 单击 **“调用工作流文件”** 活动上的 **“文件夹”** 图标，并选择我们创建的新工作流文件。此命令指示机器人在执行期间执行/调用指定的工作流文件。现在，您可以在屏幕上看到
  **“调用工作流文件”** 活动的 **“导入参数”** 按钮已橙色突出显示，如下图所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_163_0.png)


