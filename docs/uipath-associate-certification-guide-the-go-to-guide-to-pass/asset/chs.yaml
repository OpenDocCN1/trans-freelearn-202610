  ## 前言


  UiPath 是机器人流程自动化（RPA）行业中最受欢迎的厂商。如果您是渴望在该行业取得成功的 RPA 爱好者或公民开发者，获得此认证可以帮助您获得认可，并使用
  UiPath 应对现实世界的挑战。


  《UiPath Associate Certification Guide》（UiPath 助理认证指南）全面、最新地覆盖了 UiPath RPA 助理认证考试的内容，帮助您一次通过并获得认证。本书以清晰、简洁的方式编写，每章末尾均附有自评问题、带答案的测验、考试技巧以及附有详细答案和解析的模拟考试。您将首先掌握
  UiPath RPA 的基本概念，然后深入探讨助理认证所需的所有概念。最后，您将通过获取所需知识并使用示例业务案例来实施这些技能，从而培养 UiPath 技能。


  阅读完本 UiPath 书籍后，您将掌握通过考试所需的一切，获得处理现实世界案例研究所需的知识，并学习如何应用各种概念来构建企业级用例。


  ## 本书适用人群


  本 RPA 书籍适用于技术及半技术岗位人员，例如公民 RPA 开发者、初级 RPA 开发者、RPA 开发者、解决方案架构师、业务分析师、系统管理员、大学生和毕业生，以及
  UiPath 和合作伙伴在售前、服务、支持等方面的员工。如果您希望获得认证并满足最大 RPA 厂商的行业标准，那么本书适合您。





  ## 本书涵盖的内容


  第 1 章，自动化之旅与识别适合的业务流程，探讨了数字化转型的重要性及其驱动因素。本章还展示了业务中的一些 RPA 用例，随后介绍了识别合适自动化流程所需的关键步骤。在开始
  RPA 之旅之前，了解这些要点是必要的，因为本章涵盖的主题能让你了解全球流程自动化的现状、其重要性以及涉及的关键资源。


  第 2 章，UiPath 生态系统，概述了使用 UiPath Studio 构建简单到复杂自动化所需的 UiPath 企业级 RPA 平台的每个组件。本章还包含关于安装
  UiPath 和设置 UiPath Studio 配置文件的信息。


  第 3 章，UiPath Orchestrator 简介，重点介绍 UiPath 云平台和 UiPath Orchestrator。UiPath Orchestrator
  在自动化中扮演着重要角色，因为它充当所有已部署机器人和流程的中央控制单元。因此，了解 Orchestrator 的使用和概念以管理你的虚拟劳动力至关重要。


  第 4 章，在 UiPath 生态系统中创建、部署和执行 RPA 流程，提供了创建机器人并在机器人与 UiPath Orchestrator 之间建立连接的分步说明。示例自动化项目在
  UiPath Studio 中创建，然后发布到 Orchestrator，并通过 UiPath Assistant 和有人值守自动化由机器人执行。


  第 5 章，了解变量和参数，探讨变量和参数——任何编程语言的两个关键组件。本章介绍了 UiPath Studio 如何使用变量和参数，以及最常用的数据类型。


  第 6 章，了解不同的控制流，涵盖控制流，它使机器人在评估任何业务条件时能够做出关键决策。各种控制流活动（如序列、流程图和循环）通过实时示例进行探讨，以便更好地理解。


  第 7 章，使用 UiPath 处理数据，关注数据——每个组织中最关键的资源。我们需要修改、构建、格式化和排序数据，将其转化为有意义的信息。本章介绍了基于各种数据类型处理数据的不同方法。


  第 8 章，探索 UiPath 选择器，探讨自动化中一个主要的重要主题——选择器。各种选择器类型（如完整选择器、部分选择器、静态选择器和动态选择器）均有示例进行讨论。某些选择器工具（如
  UI Explorer 和 Selector Editor）也被有效使用，以充分利用选择器功能。


  第 9 章，了解数据表的用途并探索 Excel 自动化，聚焦于 Microsoft Excel——几乎每天都用于执行不同功能的工具。我们在 Excel 中处理的数据更具结构化表格形式。在本章中，我们重点介绍如何使用
  UiPath 自动化 Excel，以及如何使用数据表变量来支持 Excel 自动化。


  第 10 章，探索用户界面和用户/机器人交互，探讨用户界面的自动化。本章讨论了窗口、文本字段、按钮、下拉列表、复选框、文本框等 UI 元素的自动化。为实现有效的自动化，探讨了各种输入操作和输出操作。图像自动化和文本自动化等一些高级
  UI 自动化也有讨论。


  第 11 章，自动化 PDF 数据提取，涵盖 PDF 文件——广泛用于组织之间共享信息。本章重点介绍如何使用 UiPath 自动化 PDF 文件，以及可用于构建成功
  PDF 自动化的活动有哪些。


  第 12 章，探索 UiPath 电子邮件自动化，关注电子邮件——个人和组织最常用的数字通信形式之一。本章探讨如何自动发送电子邮件、接收电子邮件、回复电子邮件、附加和下载文档附件，以及为电子邮件使用定义的消息模板。通过实时示例探讨了各种电子邮件活动和电子邮件功能，以便更清晰地理解。


  第 13 章，调试，向你展示如何调试一个流程，即从给定项目中识别并删除错误，使其正确运行。


  第 14 章，发票处理 – 分发器，向你展示如何设计发票处理的分发器模型，从发票中提取相关详细信息并将其上传到 Orchestrator 队列。


  第 15 章，发票处理 – 执行器，向你展示如何设计发票处理的执行器模型，即从 Orchestrator 队列中检索事务项目并将发票数据输入到 CRM 中。


  第 16 章，如何准备以及预期内容，帮助你更多地了解考试和认证凭证。


  第 17 章，模拟考试 1，是一份旨在帮助你准备 UiPath RPA Associate v1.0 考试的练习测试。练习测试测试你的知识，并帮助你了解实际考试的情况。


  第 18 章，模拟考试 2，是一份旨在帮助你准备 UiPath RPA Associate v1.0 考试的练习测试。练习测试测试你的知识，并帮助你了解实际考试的情况。


