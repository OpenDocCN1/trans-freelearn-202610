  \ 将第二个 **输入对话框** 的 **显示名称** 属性设置为 Last Name。\n  - 将 **对话框标题** 设置为 \"Enter Last Name\"\
  。\n  - 将 **输入标签** 设置为 \"What's your Last Name?\"。\n  - 将 **输入类型** 设置为 Text Box。\n\
