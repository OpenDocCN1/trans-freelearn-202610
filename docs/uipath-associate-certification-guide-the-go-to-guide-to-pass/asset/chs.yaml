  ## 创建机器人帐户


  在本节中，您将通过执行以下步骤创建机器人帐户：


  - 1. 单击 Admin | 帐户和组 菜单导航到机器人帐户部分，如以下屏幕截图所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_106_0.png)


  图 4.9 – 帐户和组部分


  - 2. 单击 + 添加机器人帐户 按钮：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_107_0.png)


  图 4.10 – Robot 菜单


  - 3. 输入机器人名称并选择适当的组名称以创建机器人服务帐户。单击 **添加** 按钮创建机器人。


  - 4. 如果 UiPath Assistant 未显示在任务栏上，请从 Windows 开始菜单打开 UiPath Assistant，如以下屏幕截图所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_108_0.png)


  图 4.11 – 启动助手


  - 5. 现在，您将能在任务栏上看到 UiPath Assistant。


  - 6. 在任务栏上右键单击 UiPath Assistant，将出现上下文菜单。从列表中选择 Orchestrator 设置，这将显示 Orchestrator
  设置 窗口：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_108_1.png)


  图 4.12 – 上下文菜单


  - 7. 在 **Orchestrator 设置** 窗口中验证连接状态。如果状态为 **已连接，已授权**，请单击 **登出** 按钮，如以下屏幕截图中高亮所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_109_0.png)


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_109_1.png)


  图 4.13 – Orchestrator 设置 – 登出


  - 8. 确保 **Orchestrator 设置** 窗口中的连接状态为 **脱机**，如以下屏幕截图所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_110_0.png)


  图 4.14 – Orchestrator 设置 – 脱机连接


  - 9. 在 **连接类型** 下，在 **Orchestrator 配置** 屏幕上选择 **机器密钥**。 **机器名称** 已自动填充。但是，您需要 **Orchestrator
  URL** 和 **机器密钥** 的值才能连接到 Orchestrator，这些值可从上一部分 _创建 Orchestrator 中的机器模板_ 的 _步骤 9
  和 10_ 中获取。


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_111_0.png)


  图 4.15 – 连接类型 – 机器密钥


  - 10. 输入 **Orchestrator URL** 和 **机器密钥** 详细信息并单击 **连接** 以使机器人连接到 Orchestrator。连接后，状态将更改为
  **已连接，已授权**，如以下屏幕截图所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_112_0.png)


  图 4.16 – 连接成功 – 机器密钥


  本节中您遵循的逐步说明让您对在 Orchestrator 中创建机器人、机器和环境的端到端流程以及建立与其连接有了良好的理解。让我们通过使用实际用例示例创建您的第一个
  RPA 进程来深入了解。


  ## 创建您的第一个 RPA 进程


  为帮助您更好地理解 UiPath Studio 和 RPA 进程，让我们将所学知识应用到一个简单的项目中，在消息框中显示 `Hello World`。


  按照以下步骤创建您的第一个自动化进程：


  - 1. 启动 UiPath Studio，并通过单击 **主页** 选项卡导航到主页视图：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_113_0.png)


  图 4.17 – 主页视图


  - 2. 在新建项目部分单击 进程 以创建新项目。随后将显示新建空白进程窗口：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_113_1.png)


  图 4.18 – 新建进程


  - 3. 为项目输入合适的名称并选择保存位置的驱动器。请注意，项目名称不能超过 128 个字符，描述不能超过 500 个字符。


  - 4. 输入所有详细信息后，单击 创建 。新项目将在 Studio 中打开。


  - 5. 在新创建的项目的 **设计** 视图上单击 打开主工作流 ：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_114_0.png)


  图 4.19 – 设计视图


  - 6. 在活动面板的搜索框中输入 序列 以从活动拖放序列。双击 序列 标题并将其重命名为 MyFirstRobot：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_114_1.png)


  图 4.20 – 创建序列


  - 7. 右键单击序列以添加注释，或按 Shift + F2 以添加有关项目的更多描述性信息：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_115_0.png)


  图 4.21 – 添加注释


  - 8. 现在，在活动面板的搜索框中输入 消息框 以将 消息框 活动拖放到 MyFirstRobot 序列活动中：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_115_1.png)


  图 4.22 – 添加消息框


  - 9. 默认情况下，消息框没有任何默认值。但是，消息框会显示一个警报，并期望为消息框提供文本值：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_116_0.png)


  图 4.23 – 了解警报消息


  - 10. 在双引号内向 **消息框** 活动中输入文本 "Hello World! "：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_116_1.png)


  图 4.24 – 在消息框中输入消息


  - 11. 现在，通过单击 **运行** 按钮或按 *Ctrl + F5* 运行工作流：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_117_0.png)


  图 4.25 – 运行工作流


  - 12. 验证机器人生成的 **消息框** 输出。单击 **确定** 以结束机器人执行：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_117_1.png)


  图 4.26 – 运行工作流


