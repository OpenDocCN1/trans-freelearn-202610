- '## 5 了解变量和参数


  **变量和参数** 是任何编程语言中的两个关键组件。与其他任何编程语言一样，UiPath Studio 也使用变量和参数来存储、读取和处理数据。变量和参数使用户能够根据每个步骤的输入和输出连接不同的操作，从而构建自动化流。


  到本章结束时，您将了解 UiPath 中使用的最常见数据类型，以及如何根据要求配置参数和变量。


  本章包含以下部分：


  - 探索变量

  - 练习创建变量

  - 探索参数

  - 练习创建参数

  - 了解数据类型


  ### 技术要求


  在开始本章之前，请确保已安装 UiPath Studio 和 UiPath Robot。本章需要对如何使用 Studio 和 UiPath Assistant
  工具有大致了解。您可以参考 _第 2 章，UiPath 生态系统_ 以更好地了解 UiPath Studio 的基础知识。


  ### 探索变量


  变量可定义为存储相同数据类型值的容器。更改变量值的方法有多种，例如：


  - **外部输入**：用户或另一系统提供要存储在变量中的值。

  - **数据操作**：在数据操作过程中使用的变量可能保存派生值。数据操作过程是一系列执行步骤，用于提取、过滤、修改和清理数据。数据操作在 _第 7 章，使用 UiPath
  操作数据_ 中有详细描述。

  - **在活动之间传递**：执行多个工作流活动时，可能将同一变量用作活动的输入或输出。


  现在让我们详细了解变量的主要属性。


  ### 变量属性


  UiPath 中用于配置变量的主要属性有四个。您可以通过 UiPath Studio 的 **变量** 面板找到这四个属性，如下屏幕截图所示：


  | 名称 | 变量类型 | 范围 | 默认值 |

  | :--- | :--- | :--- | :--- |

  | SumValue | Int32 | 序列 | 输入 VB 表达式 |

  | 创建变量 | | | |

  | 变量：参数 导入 ... | | | |


  图 5.1 – UiPath Studio 中的变量面板


  为更好地理解，让我们详细探讨每个属性，如下：


  - **名称**：此属性包含变量的名称。此处指定的名称用于在整个自动化工作流中引用变量。根据变量的用途，为其提供简短但具有描述性的名称始终是最佳实践。

  - **变量类型**：这定义了变量中存储的数据类型。变量类型在创建变量时定义，如有需要可以更改。某些特定类型更通用，可以容纳不同类型的数据。这些数据类型是 UiPath
  特有的。通常，常用数据类型包括 **文本**、**数字**、**数组**、**日期/时间**、**布尔值** 和 **数据表**。

  - **范围**：描述变量可用的工作流区域。**序列**、**流程图** 和 **范围活动**（在 *第 6 章，了解不同控制流* 中有详细描述）等容器定义了变量可工作的区域。将变量分配到所需范围始终是个好主意，以确保高效执行并避免混淆，因为实际自动化工作流中使用了许多变量。

  - **默认值**：每个变量默认都分配有一个默认值。默认值属性使用户能够为变量设置自定义默认值。


  既然现在了解了变量的属性，让我们看看可以采用哪些不同的方法来创建变量。变量创建涉及配置前面描述的属性。


  ### 在 UiPath 中创建变量


  在构建自动化工作流时，变量的创建和修改非常频繁。因此，UiPath 在工作流中引入了三种创建变量的方法，如下所述：


  - **通过变量面板**：单击 **变量** 面板中的 **创建变量** 选项，可通过配置前面讨论过的属性来轻松创建变量。以下屏幕截图展示了此操作：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_147_0.png)


  图 5.2 – UiPath Studio 中的变量面板


  单击 **创建变量** 选项会在面板中创建一行新行，以便为新变量提供名称、变量类型、范围和默认值。





  - 通过设计器面板：使用您要将变量关联到的活动，并按 Ctrl + K 快捷键在设计器面板中启用变量创建模式。您可以根据需要通过变量面板提供变量名称和其他附加配置。通过设计器面板创建的变量会根据活动的配置和活动的作用域自动选择变量的作用域和数据类型。活动所在的容器决定了变量的作用域。


  - 通过属性面板：活动的属性面板包含活动的所有配置选项。与设计器面板类似，在变量需要交互的属性中按 Ctrl + K 快捷键将启用变量创建模式。变量的其余属性将根据活动的配置和活动的作用域自动配置。


  变量是我们在所有编程语言中用于存储不同类型数据的常见容器。UiPath 使用 Microsoft .NET Framework 提供的所有数据类型，以及一些 UiPath
  特有的其他数据类型。既然我们现在了解了变量的基本属性，本书的下一部分将为您提供关于变量创建和作用域管理的实践指南。现在练习变量创建在未来章节中将会非常有用，因为我们将讨论更复杂的场景。


  ## 练习变量创建


  既然我们已经介绍了变量的基础知识，现在让我们稍加练习。以下步骤将指导您如何在 UiPath 工作流中创建一个简单变量：


  1. 从 Windows 开始菜单运行 UiPath Studio。


  2. 在 Studio 开始画面的新建项目部分，单击“进程”选项以创建一个新的空白项目，如下图所示：


