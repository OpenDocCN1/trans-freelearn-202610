  您现在已了解可以对数据表和 Excel 文件执行的基本操作。还有许多其他函数可供您探索和尝试。建议使用您构建的相同解决方案来练习不同的函数。探索并了解这些活动的工作原理，在处理包含多个文件且含有复杂数据结构（例如透视表）的大型项目时将会有所帮助。


  ## 摘要


  本章向您介绍了数据表和 Excel 文件。数据表变量类型是一种广泛使用的数据类型，用于保存结构化和表格数据。由于数据表与 Excel 文件共享相同的数据结构，因此它们可以轻松与
  Excel 文件交互。在进行实操练习时，您已经体验到，数据表及其相关概念在与 Excel 文件交互时是密不可分的。本章学习的概念和活动在处理大型 Excel 相关自动化项目时将非常有用。


  此外，关于使用 Excel 文件和数据表所讨论的概念在后续章节中将非常有用，尤其是在用例章节中。下一章描述了 UiPath 机器人如何与用户界面交互以执行单击、输入和数据抓取等不同操作。学习如何执行用户界面交互对于任何
  RPA 项目都非常重要。UI 自动化是一个复杂但重要的主题，它使用户能够编程机器人像人类一样与软件应用程序交互。

