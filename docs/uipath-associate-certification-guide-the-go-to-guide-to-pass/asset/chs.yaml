  - 3. 单击开始按钮以安装包并从 UiPath Assistant 启动流程执行：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_140_0.png)


  图 4.64 – UiPath Assistant 安装和执行过程


  - 4. 验证 UiPath Assistant 中自动化的状态，并确保流程的自动化执行已完成：


