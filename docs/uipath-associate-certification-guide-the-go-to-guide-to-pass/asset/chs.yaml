  图 11.16 – 小计字段的选择器


  如示例选择器所示，它不包含我们可以依赖的字段来定位正确的字段。我们有一个简单的解决方法来处理此类场景。我们可以使用 **锚点基** 活动来查找锚点（即，我们可以依赖的其他字段）来提取相应的值。**锚点基**
  活动包含两个部分：**锚点** 部分和 **值** 部分：


  - • **锚点** 部分专门用于查找带有可靠选择器的适当 UI 元素，该元素位于需要提取的值旁边。**锚点基** 活动的 **锚点** 部分使用 **查找元素**
  活动进行配置，以查找锚点元素。





  - 锚点基准活动的 Value 部分配置了需要与要读取或写入的字段执行的交互。


  现在，我们将尝试通过引入“锚点基准”活动来更新相同的工作流，以提取 Credit Total 值。由于我们要读取一个值，可以在“锚点基准”活动的 Value 部分中使用“获取文本”活动。我们将使用单词
  Credit Total 作为可靠的锚点，因为文本是静态的，但值不是。


  为此，请执行以下步骤：


  - 1. 从活动面板中搜索“锚点基准”活动，并将其放置在“写入行”活动下方。

  - 2. 搜索“查找元素”活动，并将其放置在“锚点基准”活动的锚点部分中。

  - 3. 单击“查找元素”活动的“在屏幕上指示”选项，并在文档中指示单词 Credit Total。

  - 4. 如您已知，指示元素后，选择器将指向特定文档。因此，如同在上一节中所做的那样，我们需要编辑选择器的 title 标记，使其动态化。导航到 UI 探测器，为选择器
  title 标记中波动的部分引入通配符字符 ` * `，并保存更改。修改后的选择器类似于图 11.17：


  ```

  <wnd app=''acrord32.exe'' cls=''AcrobatSDIWindow'' title=''*'' - Adobe Acrobat Reader
  DC (32-bit)'' />

  <wnd aaname=''Document Pane'' cls=''AVL_AVView'' title=''AVScrolledPageView'' />

  <wnd cls=''AVL_AVView'' title=''AVPageView'' />

  <ctrl name=''Credit '' role=''text'' />

  ```


  图 11.17 - Credit Total 标签的动态选择器


  - 5. 现在，使用“获取文本”活动，并将其放置在“锚点基准”活动的 Value 部分（右侧部分）中。

  - 6. 通过“在屏幕上指示”选项，在文档中指示 Credit Total 标签的 Value 部分，以配置“获取文本”活动。

  - 7. 为 Output Value 属性提供一个字符串变量，以完成“获取文本”活动的配置。

  - 8. 在 **锚点基准** 活动中还有一个其他属性需要定义，即相对于需要从中获取值的 UI 元素，锚定元素的位置。在我们的场景中，`total_Credit`
  标签位于信用总额值的左侧。因此，需要将 **锚点基准** 活动的 **锚点位置** 属性更改为 **左侧**。

  - 9. 添加另一个 **写入行** 活动，并打印变量中的 **CreditTotal** 值。完成的进程工作流应类似于图 11.18：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_363_0.png)


  图 11.18 – 使用锚点基准提取单个值


  - 10. 运行进程并检查输出。示例输出如图 11.19 所示：


  ![](img/84b06ad2832c53c5f677f8ce4c80f184_364_0.png)


  图 11.19 – 单个值提取的示例输出


  到此，您将熟悉可以对 PDF 文件执行以提取数据的基本操作。您可以将更多高级函数应用于文档，以生成不同类型的非固定结构文档。但是，这不在本章的范围内。文档处理是一个令人兴奋的领域，您可以在其中使用多种技术，正如您在阅读本章各节时所经历的那样。我们强烈建议您应用迄今所获得的知识，并继续练习处理不同类型的文档。


  ## 摘要


  本章向您介绍了使用 UiPath 处理 PDF 文件的主题。PDF 文件是我们每天交互的一种普遍文件类型。当今，所有组织都要处理文档，这是一个非常耗时的过程。本章涵盖的概念将帮助您使用一组简单的活动，轻松从
  PDF 文件中提取图表、文本和其他信息。此外，本章还涵盖了 PDF 自动化中涉及的活动、从页面提取文本/图像，以及使用 UI 自动化从 PDF 文件中提取关键字段。


  您在本章学到的概念在未来项目中将非常有帮助。掌握如何最佳地与 PDF 文件交互以及根据不同场景使用什么活动至关重要。与 PDF 处理类似，电子邮件在我们的日常活动中也发挥着重要作用。我们阅读和发送电子邮件以与其他各方通信。UiPath
  还支持电子邮件自动化，以改善员工的工作生活。在下一章中，我们将探讨如何自动化您在电子邮件中执行的操作。电子邮件自动化是当今我们构建的几乎所有自动化解决方案的一部分。因此，即使您自动化的进程不包含电子邮件处理活动，学习如何与电子邮件交互也是至关重要的。

  '
- "## 12 探索 UiPath 电子邮件自动化\n\n**电子邮件**是最流行的数字通信形式之一，被个人和组织广泛使用。在日常生活中，就手动和重复性任务而言，读取电子邮件、根据电子邮件输入执行业务流程以及回复电子邮件等活动消耗了我们大部分时间。UiPath\
  \ 提供了多种电子邮件方式来读取电子邮件、筛选电子邮件和回复电子邮件，以帮助我们自动化重复的业务流程。\n\n作为本章的一部分，您将熟悉 **电子邮件自动化**、不同的电子邮件自动化类型以及支持电子邮件自动化的不同活动。您将学习如何发送和接收电子邮件、回复电子邮件、附加和下载文档附件，以及为电子邮件使用定义的消息模板。\n\
  \n本章包含以下部分：\n\n- 探索电子邮件活动\n- 使用接收消息提取电子邮件内容\n- 自动化发送电子邮件消息\n- 从电子邮件筛选和下载附件\n\n###\
  \ 技术要求\n\n本章要求您已安装 UiPath Studio 和 Robot，并且对变量、数据类型、控制流、数据操作、Excel 和数据表以及选择器有良好的理解。您可以参考第\
  \ 5 至第 10 章来获取所需的所有知识。\n\n### 探索电子邮件活动\n\n电子邮件活动包用于自动化使用 IMAP、POP3 和 SMTP 等协议执行的电子邮件相关任务，我们将在即将到来的章节中探讨这些协议。要识别可用的不同电子邮件活动，需要在\
  \ UiPath Studio 中安装 UiPath Mail Activities 包。在本节中，我们将探讨如何安装 UiPath.Mail.Activities\
  \ 包，然后使用逐步说明调查不同的电子邮件活动。\n\n让我们开始吧：\n\n- 1. 创建新项目\n\n通过在 UiPath 主页视图的新建项目部分中单击 Process，创建新的电子邮件项目。这将打开新建空白进程窗口。填写名称\
  \ (1) 和描述 (2) 的详细信息，然后单击创建按钮 (3)，如图 12.1 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_366_0.png)\n\
  \n图 12.1 – 创建新进程\n\n- 2. 验证邮件活动\n\n在创建进程时，UiPath.Mail.Activities 选项默认可用于项目的依赖项分支中，如图\
  \ 12.2 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_367_0.png)\n\n图 12.2 – 电子邮件活动依赖项\n\
  \n但是，如果它被意外卸载或删除，您可能需要从包中手动安装电子邮件依赖项。\n\n- 3. 安装 UiPath.Mail.Activities\n\n确保 Dependencies\
  \ 部分中没有 UiPath.Mail.Activities 选项，如图 12.3 所示。如果已存在，可以单击依赖项并单击卸载按钮进行卸载，如以下屏幕截图所示：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_368_0.png)\n\n图 12.3 – 电子邮件活动依赖项不可用\n\
  \n现在，单击设计选项卡中的管理包，并执行以下步骤，如图 12.4 所示：\n\n- I. 在搜索文本框 (1) 中输入 UiPath.Mail.Activities。\n\
  - II. 单击左侧的“官方” (2) 选项。这将填充所需的包 (3)。\n- III. 单击包 (3)，然后单击安装 (4)。\n\n\n\n\n\n## IV.\
  \ 在屏幕底部单击“保存”按钮以安装包：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_369_0.png)\n\n\
  图 12.4 - 安装电子邮件依赖项\n\n## 4. 验证已安装的包\n\n在 Project 中展开 Dependencies 部分，以验证已安装的 UiPath.Mail.Activities\
  \ 依赖项，如图 12.5 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_369_1.png)\n\n图 12.5\
  \ – 验证已安装的依赖项\n\n## 5. 验证活动\n\n单击 **“活动”** (1) 选项卡并在搜索字段中键入 **“邮件”** (2) 以验证邮件活动。您将看到六个不同的类别，Exchange、IBM\
  \ Notes、IMAP、Outlook、POP3 和 SMTP，以及 **“创建 HTML 内容”**、**“保存附件”** 和 **“保存邮件消息”**，如\
  \ **图 12.6** 中的 (3) 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_370_0.png)\n\
  \n图 12.6 - 验证已安装的活动\n\n这些活动用于不同的自动化目的，我们将在即将推出的章节中了解它们。请注意，如果不安装 `UiPath.Mail.Activities`\
  \ 包，这些活动将不会显示。现在让我们来看看不同的邮件活动：\n\n### I. Exchange\n\n**Exchange** 是指 Microsoft 企业级电子邮件解决方案，这些活动可用于执行各种电子邮件操作，例如发送电子邮件、接收电子邮件、在文件夹之间移动电子邮件以及删除电子邮件。可用活动如\
  \ **图 12.7** 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_371_0.png)\n\n图 12.7\
  \ – Exchange\n\n### II. IBM Notes\n\nIBM Notes 活动可用于在 IBM Notes 客户端中自动执行各种电子邮件任务，用于发送电子邮件、接收电子邮件、在文件夹之间移动电子邮件以及删除电子邮件。可用活动如图\
  \ 12.8 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_371_1.png)\n\n图 12.8 – IBM\
  \ Notes\n\n### III. IMAP\n\n互联网消息访问协议 (IMAP) 仅用于接收电子邮件。还有其他功能可将电子邮件标记为已读，并在文件夹内移动电子邮件。可用活动如图\
  \ 12.9 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_371_2.png)\n\n图 12.9 – IMAP\n\
  \n### IV. Outlook\n\nOutlook 活动用于自动执行已配置 Outlook 帐户上的电子邮件任务。它们可以执行各种自动化任务，包括发送电子邮件、接收电子邮件、在文件夹之间移动电子邮件和删除电子邮件。作为先决条件，您的计算机上应安装\
  \ Microsoft Outlook 应用程序，以便活动能够正常运行。可用活动如图 12.10 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_372_0.png)\n\
  \n图 12.10 – Outlook\n\n### V. POP3\n\n邮局协议 (POP3) 是最古老且使用频率较低的协议之一，仅用于接收电子邮件。可用活动如图\
  \ 12.11 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_372_1.png)\n\n图 12.11 –\
  \ POP3\n\n### VI. SMTP\n\n简单邮件传输协议 (SMTP) 是最基本的协议之一，仅用于发送电子邮件。可用活动如图 12.12 所示：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_372_2.png)\n\n图 12.12 – SMTP\n\n在本节中，我们探讨了如何安装\
  \ UiPath.Mail.Activities 包并验证了已安装的依赖项。我们还查看了每个活动的高级别介绍，并将在即将推出的章节中探讨所有重要的电子邮件活动。\n\
  \n## 使用“接收消息”提取电子邮件内容\n\n在本节中，我们将学习如何自动接收电子邮件，机器人将读取 Google (Gmail) 帐户中电子邮件的内容。我们将使用\
  \ IMAP 来实现此目标。假设电子邮件地址和密码已作为参数在工作流中传递，我们仅考虑前五封未读电子邮件：\n\n- 1. **创建进程**\n  在 UiPath\
  \ Studio 中创建名为 `Email_Automation` 的新进程。要继续此开发，您需要向 Gmail 帐户发送一封示例电子邮件。\n\n- 2. **发送电子邮件**\n\
  \  向需要自动化的 Google 电子邮件发送一封测试电子邮件，如图 12.13 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_373_0.png)\n\
  \n图 12.13 – 示例电子邮件\n\n### 3. 在 Gmail 设置中启用 IMAP\n\n您需要在 Gmail 设置中启用 IMAP，如图 12.14\
  \ 所示。为此，首先登录您的 Gmail 帐户并单击设置图标，然后单击“查看所有设置”按钮。在设置屏幕上单击“转发和 POP/IMAP”，如图 12.14 所示：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_374_0.png)\n\n图 12.14 – 设置屏幕\n\n在 IMAP\
  \ 访问部分单击“启用 IMAP”，如图 12.15 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_374_1.png)\n\
  \n图 12.15 – 启用 IMAP\n\n### 4. 在 Google 中创建应用密码\n\n接下来，您需要创建一个应用密码，以便在 UiPath Studio\
  \ 中用于访问 Gmail 并连接到 IMAP。为此，请访问 https://myaccount.google.com/apppasswords 创建应用密码。单击“生成”按钮（如图\
  \ 12.16 所示）并复制生成的密码，该密码将在即将进行的步骤中复制到 UiPath 活动中。\n\n选择要为其生成应用密码的应用和设备。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_374_2.png)\n\
  \n图 12.16 – 生成应用密码\n\n### 5. 创建接收电子邮件的工作流\n\n- I. 按以下步骤创建用于自动接收电子邮件的进程工作流。将“获取密码”活动拖入工作流，如图\
  \ 12.17 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_375_0.png)\n\n图 12.17 –\
  \ “获取密码”活动\n\n- II. 创建以下变量以存储电子邮件 ID、密码和实际电子邮件。在 **“默认”** 字段中输入要自动化的电子邮件地址，如图 12.18\
  \ 所示：\n\n| 名称 | 变量类型 | 作用域 | 默认值 |\n| :--- | :--- | :--- | :--- |\n| email | String\
  \ | Sequence | \"processadminhr@gmail.com\" |\n| password | String | Sequence |\
  \ 输入 VB 表达式 |\n| Emails | List<MailMessage> | Sequence | 输入 VB 表达式 |\n\n图 12.18\
  \ – 进程的变量\n\n- III. 单击步骤 I 中的“获取密码”活动，将上一节步骤 4 中复制的密码输入到属性窗格中的“密码” (1) 字段，并将结果存储在名为\
  \ password (2) 的变量中，如图 12.18 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_375_1.png)\n\
  \n图 12.19 – “获取密码”属性\n\n- IV. 将“获取 IMAP 邮件消息”活动拖入工作流，如图 12.19 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_375_2.png)\n\
  \n图 12.20 – “获取 IMAP 邮件消息”活动\n\n- V. 配置 **IMAP** 设置属性以访问 Gmail 中的电子邮件，如 *图 12.21*\
  \ 和以下步骤所示：\n  - i. 在 **“邮件文件夹”** (**1**) 中，输入 \"`Inbox`\"。\n  - ii. 在 **“端口”** (**2**)\
  \ 中，输入 993。\n  - iii. 在 **“服务器”** (**3**) 中，输入 \"`imap.gmail.com`\"。\n  - iv. 在\
  \ **“电子邮件”** (**4**) 中，输入 `email` 字符串变量，在变量面板中定义要自动化的电子邮件地址，如步骤 II 中“5. 创建接收电子邮件的工作流”所述。\n\
  \  - v. 在 **“密码”** (**5**) 中，输入从步骤 III 中“5. 创建接收电子邮件的工作流”获得的 `password` 变量。\n  -\
  \ vi. 选中 **“仅未读邮件”** (**6**) 复选框。\n  - vii. 在 **“数量”** (**7**) 中，输入 5，以仅读取前五封未读电子邮件。\n\
  \  - viii. 在 **“消息”** (**8**) 中，输入 `Emails List<MailMessage>` 变量以存储所有电子邮件。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_376_0.png)\n\
  \n图 12.21 – 配置 IMAP 设置属性\n\n- VI. 鉴于您已阅读了前一步骤中描述的前五封电子邮件，现在，您可以使用邮件变量 (1) 通过 **“For\
  \ Each”** 活动循环每封电子邮件 (2) 以查找预期的电子邮件，如图 12.22 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_377_0.png)\n\
  \n图 12.22 – “For Each”活动\n\n- VII. 配置 **“For Each”** 活动的属性，以验证 **“TypeArgument”**\
  \ 是 `System.Net.Mail.MailMessage`，如图 12.23 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_377_1.png)\n\
  \n图 12.23 – “For Each”活动属性\n\n\n\n\n\n## VIII. 执行以下步骤以过滤包含 IMAP 主题的电子邮件，如图 12.25\
  \ 所示：\n\n- i. 添加一个 If 活动。\n- ii. 在条件 (1) 中，输入 mail.Subject.Contains(\"IMAP\")。\n\
  - iii. 在 Then 部分添加一个 Assign 活动，并将匹配的电子邮件存储到 emailBody (2) 变量中，如图 12.24 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_378_0.png)\n\
  \n图 12.24 – Assign 活动的值\n\n- iv. 使用 Write Line 活动 (3) 输出捕获的电子邮件。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_378_1.png)\n\
  \n图 12.25 – For Each 内的 If 条件\n\n## IX. 使用 **运行** 按钮或 `Ctrl + F5` 运行项目，以验证 **输出**\
  \ 面板中的输出是否按预期工作。确保在 *步骤 2* 中发送的电子邮件显示为输出，如 *图 12.26* 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_379_0.png)\n\
  \n图 12.26 - 输出面板\n\n在本节中，我们了解了如何在 UiPath Studio 中使用 IMAP 自动化接收来自 Gmail 的电子邮件。此外，我们了解了如何使用\
  \ Gmail 安全地创建密码并将其传递到 UiPath Studio。最后，我们探索了许多不同的活动，例如 Get Password 和 Get IMAP Mail\
  \ Messages，并了解了如何在电子邮件自动化中实现它们。现在，让我们看看如何在下一节中自动化发送电子邮件，我们将使用 UiPath Studio 自动发送带有附件的电子邮件。\n\
  \n## 自动化发送电子邮件消息\n\n在本节中，我们将了解如何自动化发送电子邮件，机器人将读取 Gmail 账户中电子邮件的内容。我们将使用 SMTP 来实现此目标。假设电子邮件地址和密码已作为参数在工作流中传递，我们只关注前五条未读电子邮件，就像我们在上一节“使用接收消息提取电子邮件内容”中阅读电子邮件的示例一样。你只需要一个\
  \ Gmail 账户来发送带有附件的电子邮件，以及一个配置在 Outlook 中的另一个电子邮件来接收 UiPath 机器人发送的电子邮件。\n\n以下提供了从\
  \ UiPath Studio 发送电子邮件的逐步说明：\n\n- 1. **创建进程**\n  在 UiPath Studio 中创建一个新的 `SMTPMailMessages`\
  \ 进程。\n\n- 2. **使用 Get Password 配置 Gmail 密码**\n\n- 3. 向工作流中添加一个新活动，**Get Password**，如图\
  \ 12.27 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_380_0.png)\n\n图 12.27 –\
  \ Get Password\n\n配置在上一节“步骤 4，在 Google 中创建应用密码”中创建的应用密码，如图 12.28 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_380_1.png)\n\
  \n图 12.28 – Get Password 属性\n\n- 4. 设置包含要处理的输入文件的输入文件夹\n\n将要处理的输入文件保留在输入文件夹中。我们有两个文件，Invoice1.pdf\
  \ 和 Invoice2.pdf，需要附加到电子邮件中，如图 12.29 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_381_0.png)\n\
  \n图 12.29 – 输入文件夹\n\n- 5. 定义输入变量\n\n创建一个用于发票的字符串变量数组以定义输入文件，如图 12.30 所示：\n\n| 名称\
  \ | 变量类型 | 作用域 | 默认值 |\n|---|---|---|---|\n| invoices | String[] | _02_SMTPEmailMessages\
  \ | [\"Invoice1.pdf\",\"Invoice2.pdf\"] |\n\n图 12.30 – 已定义的输入文件\n\n- 6. 处理附件\n\n\
  将 For Each 活动添加到工作流，并使用变量 invoice (1) 循环每个 invoices (2)，为每个发票发送单独的电子邮件，如图 12.31\
  \ 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_381_1.png)\n\n图 12.31 – 每个发票文件的\
  \ For Each\n\n- 7. 发送 SMTP 电子邮件活动\n\n使用两个 **Assign** 活动分配 `filename` (1) 和使用变量 `filefullPath`\
  \ (2) 的文件完整路径。接下来，添加 **Send SMTP Mail Message** (3) 活动，如 *图 12.32* 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_382_0.png)\n\
  \n图 12.32 – For Each 内的 Send SMTP Mail Message\n\n确保将正确的变量分配给 filename，如图 12.33\
  \ 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_383_0.png)\n\n图 12.33 – 作为字符串的文件名\n\
  \n确保将正确的变量分配给 filefullPath，以便机器人可以访问正确的文件名，如图 12.34 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_383_1.png)\n\
  \n图 12.34 – 分配输入文件的完整路径\n\n- 8. 配置 Send SMTP Mail Message 活动的属性\n\n在 (集合) 字段 (1)\
  \ 中配置 Attachments 文件名变量，用主题和正文内容更新电子邮件部分 (2)，更新主机详细信息（如端口和服务器）以发送 SMTP 电子邮件 (3)，传递电子邮件登录详细信息（如电子邮件和密码）(4)，最后，在\
  \ To 字段 (5) 中传递接收者详细信息变量，即接收者的电子邮件 ID，如图 12.35 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_384_0.png)\n\
  \n图 12.35 – Send SMTP Mail Message 的属性\n\n确保将正确的变量分配给 **附件**，以便机器人在发送电子邮件时可以附加正确的文档，如图\
  \ 12.36 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_385_0.png)\n\n图 12.36 –\
  \ Send SMTP Mail Message 的附件\n\n- 9. 输出验证\n\n使用 **运行** 按钮或 *Ctrl + F5* 运行项目以验证输出。检查目标电子邮件，看是否收到了两封带有附件的电子邮件。确保在\
  \ *步骤 7* 中发送的电子邮件显示为电子邮件中的输出，如 *图 12.37* 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_385_1.png)\n\
  \n图 12.37 – 目标电子邮件中的输出验证\n\n在本节中，我们已使用 UiPath 机器人和 SMTP 自动化了电子邮件发送。我们使用 Gmail 账户通过\
  \ **附件** 属性发送带有附件文档的电子邮件，并使用 Outlook 账户接收电子邮件。最后，我们执行了机器人以验证输出。在下一节中，我们将了解如何自动处理来自电子邮件的附件。\n\
  \n## 自动化过滤和下载来自电子邮件的附件\n\n在电子邮件自动化中，处理附件是最基本的任务之一。在 UiPath Studio 中，我们将使用 Get Outlook\
  \ Message 活动来读取附件并将其存储在目标文件夹中。我们将使用上一节（自动化发送电子邮件中的步骤 9）生成的输出电子邮件中的附件文档来处理附件。对于所有\
  \ Outlook 活动，Outlook 应用程序需要安装在执行自动化的计算机上。最后，我们将了解各种筛选选项，例如电子邮件地址和主题行。\n\n使用以下逐步说明下载附件：\n\
  \n- 1. **创建新项目**\n  从 UiPath Studio 后台视图创建一个新进程。\n\n- 2. **获取 Outlook 邮件消息**\n \
  \ 在 Main 文件中，从 **活动** 面板拖动 **Get Outlook Mail Message** 活动，如图 12.38 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_386_0.png)\n\
  \n图 12.38 – Get Outlook Mail Message 活动\n\n- 3. 配置 Get Outlook Mail Message 属性\n\
  \n单击 Get Outlook Mail Message 活动以查看属性面板。在输入部分，在 Account 字段 (1) 中输入 Outlook 账户的电子邮件地址，以及将访问电子邮件的相应\
  \ MailFolder (2)。现在，是时候使用 Options 部分中的 Filter 字段 (3) 筛选预期的电子邮件了，您需要在其中输入发件人的电子邮件地址。或者，您可以使用\
  \ Subject 或任何其他电子邮件参数来筛选电子邮件。启用 OnlyUnreadEmails 选项 (4) 并将 Top 字段设置为 10 (5) 以读取前\
  \ 10 封未读电子邮件。最后，将所有读取的电子邮件保存到输出字段 (6) 中的 emails 变量中，如图 12.39 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_387_0.png)\n\
  \n图 12.39 – Get Outlook Mail Message 属性\n\n\n\n\n\n## 4. 使用“保存附件”活动提取并保存附件\n\n到目前为止，我们已读取所有筛选后的电子邮件，并将其保存到名为\
  \ emails 的变量中。现在，我们将使用 For Each 活动 (1) 处理每封电子邮件，并在“条件”字段 (2) 中检查主题行包含 Invoice# 的电子邮件。使用\
  \ Split 函数 (3) 从主题行中提取发票号，以创建输出文件夹来保存附件。现在，使用“保存附件”活动 (4) 提取附件，如图 12.40 所示：\n\n\
  ![](img/84b06ad2832c53c5f677f8ce4c80f184_388_0.png)\n\n图 12.40 – “保存附件”属性\n\n有关创建输出文件夹以保存附件的更多信息，如图\
  \ 12.41 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_389_0.png)\n\n图 12.41 –\
  \ 使用 Split 函数创建输出文件夹\n\n## 5. 输出验证\n\n使用“运行”按钮或 Ctrl + F5 运行项目以验证输出。检查目标文件夹以验证附件。确保您从\
  \ Gmail 发送的文件显示为项目中的输出，如图 12.42 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_389_1.png)\n\
  \n图 12.42 – 运行项目并验证输出\n\n在本节中，我们探索了不同功能，以处理来自指定输入电子邮件的电子邮件，读取主题、电子邮件内容并下载附件。我们还探索了\
  \ **获取 Outlook 邮件消息** 活动的属性，其中了解了 **帐户** 和 **邮件文件夹** 等字段的用法。最后，我们使用不同选项根据某些条件筛选电子邮件，例如来自电子邮件列表的\
  \ **仅未读消息 from**，比如前 100 封电子邮件。这些概念可以轻松应用于处理电子邮件中的附件。\n\n## 摘要\n\n本章我们探索了电子邮件自动化的所有内容。我们执行了大部分电子邮件操作，例如发送电子邮件、接收电子邮件以及使用\
  \ UiPath Studio 自动下载附件——这些是我们经常手动执行的操作。此外，我们讨论了各种电子邮件协议，例如 IMAP、SMTP、POP3、Exchange\
  \ 和 Outlook，以及它们的用法。我们还实现了实际示例，以理解所有基本的电子邮件自动化概念，从发送电子邮件到接收电子邮件、筛选电子邮件和处理附件。\n\n\
  在下一章中，我们将了解更多关于调试的内容。我们将使用 UiPath 轻松故障排除、识别错误，并在创建自动化项目时的任何挑战性情况下练习解决问题。\n"
- '# 第 3 部分：用例和考试准备


  在本部分中，您将学习如何在分发者 - 执行者（Dispatcher - Performer）模型的帮助下构建发票处理自动化。在分发者模型中，您将把发票详细信息上传到
  Orchestrator 队列，而在执行者模型中，您将从队列中获取值并将其输入 CRM。之后，您将了解 UiPath RPA (UiRPA) associate
  考试，其中您将了解考试的目标受众、考试主题和章节、如何注册考试以及更多考试信息。最后，您将解决两份 UiRPA 考试的模拟测试，评估您迄今所学的技能。


  在本部分中，我们将涵盖以下章节：


  - 第 13 章，调试

  - 第 14 章，发票处理 – 分发者

  - 第 15 章，发票处理 – 执行者

  - 第 16 章，如何准备以及预期内容

  - 第 17 章，模拟考试 1

  - 第 18 章，模拟考试 2

  '
- "## 13 调试\n\n软件开发项目很少完美，因为各种错误可能会阻碍项目执行。**调试**是一个多步骤过程，涉及识别并从给定项目中删除这些错误/缺陷，使其按预期正确运行且无错误。\n\
  \n就像任何其他 **集成开发环境 (IDE)** 一样，UiPath Studio 提供了多个选项，帮助您快速定位错误，特别是在大型和复杂的工作流中。它可以帮助您查看每个活动的执行情况，验证它获取的数据，并检查生成输出时是否存在错误。此外，它提供了一个实时引擎，在使用工作流时检查错误。\n\
  \n在本章中，您将学习如何从 **调试** 功能区使用不同的调试操作，以及不同的调试面板和断点如何在调试过程中帮助纠正错误。您还将学习如何测试单个活动并使用活动创建测试平台，然后如何使用\
  \ **从此活动运行** 选项。\n\n本章包含以下主题：\n\n- 了解调试操作\n- 使用调试面板\n- 测试活动\n\n## 技术要求\n\n在开始本章之前，请安装\
  \ UiPath Studio 和 Robot。\n\n本章稍后，我们将介绍一个会导致运行时异常的过程，并使用 UiPath Studio 中的调试选项修复它。\n\
  \n您可以从 GitHub 仓库下载该过程：https://github.com/PacktPublishing/UiPath-Associate-Certification-Guide.git。\n\
  \n## 了解调试操作\n\n可以从“设计”和“调试”功能区对单个工作流或整个项目进行调试。单击功能区中的调试选项将打开调试面板。以下截图显示了 UiPath\
  \ Studio 中的 **调试** 功能区：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_394_0.png)\n\
  \n图 13.1 – **调试** 功能区\n\n调试选项卡允许用户对单个文件或整个项目进行调试。功能区包含多个调试操作。让我们详细了解每个操作。\n\n##\
  \ 调试文件\n\n单击“调试文件”将启动该特定工作流的调试过程。\n\n## 停止\n\n单击“停止”按钮将结束调试过程，无论哪个活动正在执行。“停止”按钮的键盘快捷键是\
  \ `F12`。\n\n## 逐过程\n\n当您想要一次调试一个活动时，请从调试功能区选择“逐过程”选项。触发“逐过程”操作时，调试器将打开并高亮显示工作流容器（如流程图或序列活动）中的活动。单击一次“逐过程”将高亮显示即将执行的活动。再次单击“逐过程”将执行高亮显示的活动，然后高亮显示下一个活动。\n\
  \n将 **逐过程** 与 `Invoke Workflow File` 活动一起使用时，工作流会在新标签页中以 _只读_ 模式打开，其中的每个活动会逐个执行。\n\
  \n**逐过程** 的键盘快捷键是 `F11`。\n\n> 注意\n> `Sequence`、`Flowchart` 和 `Invoke Workflow File`\
  \ 等活动称为 **容器**。\n\n## 跳过\n\n**跳过** 是 **逐过程** 的相反操作。它不会打开当前容器并逐个调试活动，而是一次性执行容器及其中的所有活动。当您想要跳过不太可能在执行期间触发任何问题的容器及其中的所有活动时，这非常有用。\n\
  \n另外，当调试器位于容器内且您执行 **跳过** 操作时，它将像 **逐过程** 一样一个接一个地跳过其中的所有活动，但不会高亮显示特定活动。\n\n**跳过**\
  \ 的键盘快捷键是 `F10`。\n\n## 跳出\n\n**跳出** 操作完成当前容器中所有活动的执行。执行完所有活动后，控制权会移出该容器并暂停调试。当您处理嵌套序列时，此操作非常有用。\n\
  \n**跳出** 的键盘快捷键是 `Shift + F11`。\n\n## 重试\n\n调试过程中，当某个活动抛出异常且您想要再次调试此活动时，请选择 **重试**\
  \ 操作。**重试** 会重新执行前一个活动，如果在调试过程中再次遇到异常，则会抛出异常。抛出异常的活动会被高亮显示，错误详细信息会在 **本地变量** 和 **调用堆栈**\
  \ 面板中显示（您将在 _使用调试面板_ 部分了解 **本地变量** 和 **调用堆栈** 面板）。\n\n\n\n\n\n### 忽略\n\n调试时，您可以使用\
  \ **Ignore** 操作跳过当前异常，并从流中的下一个活动恢复执行。\n\n您可以通过忽略或跳过抛出异常的活动，继续调试其余活动。\n\n> **注意**\n\
  > 当抛出异常且调试过程进入暂停状态时，**Retry** 和 **Ignore** 操作可用。\n\n### 重新启动\n\n在调试过程中，有时如果您想从头开始调试项目，请选择\
  \ **Restart** 操作。该操作将从项目的第一个活动重新启动调试过程。\n\n### 中断\n\n调试过程启动后，**Break** 操作即可用。您可以随时使用\
  \ **Break** 操作暂停调试过程。应用 **Break** 操作后，当前正在执行的活动将停止并在 Studio 中高亮显示。\n\n根据情况，您可以选择\
  \ **Continue** 操作来恢复调试过程，或选择 **Step Into**、**Step Out** 或 **Stop** 操作。\n\n### 聚焦\n\
  \n理想情况下，在调试过程中，当发生异常或遇到断点时，执行会进入暂停状态。**Focus** 操作可让您在调试流程处于暂停状态时，返回流中提到的断点或错误位置。**Focus**\
  \ 操作是返回该特定活动并恢复调试过程的简便方法。\n\n### 慢步\n\n**Slow Step** 操作可在调试前或调试过程中启用。启用后，**Slow\
  \ Step** 操作会高亮显示正在执行的活动。**Slow Step** 操作提供四种不同速度 – _1x_、_2x_、_3x_ 和 _4x_。\n\n每次单击\
  \ **Slow Step** 按钮，调试速度会在 1x 到 4x 之间变化一级。因此，使用 **Slow Step** 以 1x 调试运行最慢，以 4x 最快。速度决定调试器从一个活动跳转到下一个活动的快慢。\n\
  \n### 执行轨迹\n\n**Execution Trail** 显示调试过程中的执行路径。默认情况下，**Execution Trail** 按钮处于禁用状态。在执行每个活动时，它们会根据执行状态被高亮显示并用颜色代码标记：\n\
  \n- 部分执行的活动标记为金色黄色时钟符号：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_397_0.png)\n\
  \n- 成功执行的活动标记为绿色复选框符号：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_397_1.png)\n\n\
  - 抛出异常的活动标记为红色：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_397_2.png)\n\n### 高亮显示元素\n\
  \n如果启用了 **Highlight Elements** 操作，则在调试过程中，每个活动的 UI 元素都会被高亮显示。因此，您可以将其与常规调试和逐步调试一起使用\
  \ – 例如，如果将 `Type Into` 活动放置在 Web 表单的文本字段上，在执行期间，Web 表单的文本字段会在机器人输入该文本字段之前先被高亮显示。\n\
  \n**Log Activities** 帮助您确定流中可能出现问题的位置。如果启用了 **Log Activities** 操作，所有调试的活动都会在 **Output**\
  \ 面板中显示为 _跟踪日志_。如果禁用日志功能，则 _跟踪日志_ 不会在 **Output** 面板中显示；相反，您只能看到调试开始和结束时间以及任何抛出的异常。\n\
  \n此外，如果已连接到 UiPath Orchestrator，日志会自动发送到 Orchestrator。如果在 **Add** 或 **Edit** 用户窗口的\
  \ **Robot Settings** 选项卡中禁用 **Allow Development Logging** 选项，则可以将日志本地存储。\n\n> 注意\n\
  > **Highlight Elements** 和 **Log Activities** 操作只能在调试前启用，并且在下次重新打开自动化项目时会保持启用状态。\n\
  \n### 发生异常时继续\n\n在调试过程中启用 **Continue on Exception** 操作且抛出异常时，该异常会在 **Output** 面板中记录，并且执行会在不停止调试过程的情况下继续进行后续活动。\n\
  \n### 打开日志\n\n单击 **Open Logs** 按钮将打开本地存储的日志文件夹。存储日志的文件夹路径是 `%localappdata%\\UiPath\\\
  Logs`。日志的命名约定是 `YYYY-DD-MM_Component.log` – 例如，`2021-07-08_Studio.log`。\n\n在本节中，您已了解功能区上的调试操作菜单。在本章的下一节中，您将看到\
  \ UiPath Studio 中可用的不同调试面板。\n\n## 使用调试面板\n\n除了 **DEBUG** 功能区中可用的操作外，UiPath Studio\
  \ 还提供了一系列面板来帮助您进行调试过程。\n\nUiPath 中有五个可用于调试的面板：\n\n- 1. Locals 面板\n- 2. Watch 面板\n\
  - 3. Immediate 面板\n- 4. Call Stack 面板\n- 5. Breakpoints 面板\n\n以下截图中标记了每个面板。每个数字对应前面列表中面板的位置：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_399_0.png)\n\n图 13.5 – 调试面板\n\n一旦调试开始，所有五个面板都会变得可见。但是，首先，让我们来看看每个面板并了解它们的用途。\n\
  \n### Locals 面板\n\nLocals 面板窗口有三个属性 – Name、Type 和 Value。该面板显示带有相应属性的以下信息：\n\n- Variables：显示执行容器范围内的所有变量\n\
  - Arguments：显示执行工作流的所有参数\n- Activity Properties：显示先前执行的活动和当前活动的属性\n- Exceptions：显示异常的描述和类型\n\
  \n| Name | Type | Value |\n|---|---|---|\n| Variables | | |\n| firstName | String\
  \ | \"Jane\" |\n| lastName | String | \"Dorsy\" |\n| companyName | String | \"MediCare\"\
  \ |\n| row | DataRow | DataRow HasErrors=false... |\n| DT_Contact | DataTable |\
  \ [First Name,Last Name...] |\n| ContextTarget | Object | Browser ... |\n| Properties\
  \ of Assign 'company name' (previous) | | |\n| To | OutArgument | \"MediCare\" |\n\
  | Value | InArgument | \"MediCare\" |\n| DisplayName | String | \"Assign ' company\
  \ name ' -\" |\n| Properties of Type into 'INPUT' (current) | | |\n| Text | InArgument<string>\
  \ | InArgument<string> ... |\n| DeselectAfter | InArgument<Boolean> | ... |\n| SimulateType\
  \ | InArgument<Boolean> | ... |\n| SendWindowMessages | InArgument<Boolean> | ...\
  \ |\n| AlterIfDisabled | InArgument<Boolean> | ... |\n| DelayMS | InArgument<int32>\
  \ | ... |\n| DelayBefore | InArgument<int32> | ... |\n| DelayBetweenKeys | InArgument<int32>\
  \ | ... |\n\n图 13.6 - Locals 面板\n\nLocals 面板中的所有 Arguments、Properties 和 Variables\
  \ 类别都可以压缩或展开。\n\n当调试处于暂停状态时，单击 Value 属性下的铅笔图标按钮，可以修改变量和参数的值：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_400_0.png)\n\
  \n图 13.7 - 通过单击铅笔图标，将 firstName 变量的值从 Jane 更改为 Michael\n\n同样，当调试处于暂停状态时，您可以单击放大镜按钮来检查\
  \ Value 属性列中项目的值：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_401_0.png)\n\n图 13.8\
  \ – 通过单击放大镜按钮检查 DataTable 变量中的所有行\n\n### Watch 面板\n\nWatch 面板窗口有三个属性 – Expression、Type\
  \ 和 Value。\n\n您可以显示执行容器范围内的变量、参数和用户定义表达式的值。Watch 面板中的值会根据调试过程中相关活动的执行情况进行更新 – 例如，调试\
  \ For Each 活动内部的过程。Watch 面板中的值会在每次迭代时更新：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_401_1.png)\n\
  \n图 13.9 – Watch 面板显示变量和表达式的类型和值\n\n\n\n\n\n您可以通过在 **Expression** 属性中单击 **Add Watch**\
  \ 选项，将变量、参数或表达式添加到 **Watch** 面板。\n\n您也可以使用 **Locals** 面板，通过右键单击变量或参数并选择 **Add to\
  \ Watch**，将变量或参数添加到 **Watch** 面板：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_402_0.png)\n\
  \n图 13.10 – 从 Locals 面板向 Watch 面板添加变量\n\n或者，您可以使用 **Variables** 和 **Arguments**\
  \ 面板将变量或参数添加到 **Watch** 面板。为此，请右键单击变量或参数并选择 **Add to Watch**：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_402_1.png)\n\
  \n图 13.11 – 从 Variables 面板向 Watch 面板添加变量\n\n## The Immediate panel\n\n**Immediate**\
  \ 面板可用于在调试过程的特定点检查变量、参数或语句的数据/输出：\n\n```\nImmediate\n> firstName.Contains(\"Jane\"\
  )\n< true\n> firstName.ToUpper\n< \"JANE\"\n> companyName.GetType\n< [System.String]\n\
  >\n```\n\n图 13.12 – Immediate 面板\n\n要获取输出，请在 **Immediate** 窗口中键入变量或参数名称并按 *Enter*\
  \ 键。输出在调试过程中不会更新；相反，它会保留先前评估过的语句的历史记录。\n\n使用上下文菜单，您可以复制先前评估过的表达式，或使用 **Clear All**\
  \ 选项清除面板中的所有行。使用 *Ctrl + 空格* 可打开 IntelliPrompt，这有助于选择与变量或参数关联的所需函数或属性：\n\n```\n\
  Immediate\n> firstName.Contains(\"Jane\")\n< true\n> firstName.ToUpper\n< \"JANE\"\
  \n> companyName.GetType\n< [System.String]\nCompareTo\nConcat(Of ...)\nContains\n\
  Contains(Of ...)\nContainsUnmatchedParentheses\nCopyTo\nCount(Of ...)\n>\ncompanyName.co\n\
  ```\n\n图 13.13 – 使用 Ctrl + 空格的 IntelliPrompt\n\n### The Call Stack panel\n\n当调试处于暂停状态时，**Call\
  \ Stack** 面板会显示要执行的活动及其父容器：\n\n| 活动名称 | 活动类型 | 文件路径 |\n| :--- | :--- | :--- |\n\
  | Type Into 'INPUT' | TypeIntoFactory | Main.xaml |\n| Body | Sequence | Main.xaml\
  \ |\n| For Each Row | ForEachRow | Main.xaml |\n| Do | Sequence | Main.xaml |\n\
  | Open Browser | OpenBrowserFactory | Main.xaml |\n| Sequence | Sequence | Main.xaml\
  \ |\n\n图 13.14 – Call Stack 面板\n\n**Call Stack** 面板在以下两种情况下会被填充：\n\n- 使用 **Step\
  \ Into**、**Break** 和 **Slow Step** 时\n- 如果执行因遇到错误或断点而进入暂停状态\n\n在 **Call Stack**\
  \ 面板中双击活动名称会在 **Designer** 面板中突出显示该活动。此外，当活动在调试期间抛出异常时，它会在 **Call Stack** 面板中被标记，并且该特定活动会以红色突出显示。\n\
  \n### The Breakpoints panel\n\n在开始介绍 **Breakpoints** 面板之前，让我们先了解什么是 **breakpoints**。与其他任何\
  \ IDE 一样，UiPath Studio 支持断点。它们用于在可能触发执行问题的活动上有意暂停调试过程。断点还可用于监控该点处变量或参数的值，并通过使用 **Step\
  \ Into**、**Step Over** 和 **Step Out** 操作来控制执行。\n\n现在让我们看看如何在 UiPath Studio 中添加、禁用或删除断点。我们需要知道如何先添加断点，因为\
  \ **Breakpoint Settings** 选项卡仅在该点之后可用。\n\n### How to place a breakpoint\n\n您可以通过以下三种方式在活动上添加断点：\n\
  \n- 右键单击要为其添加断点的特定活动，并从上下文菜单中单击 Toggle Breakpoint：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_405_0.png)\n\
  \n图 13.15 – 从上下文菜单应用断点\n\n- 单击 Toggle Breakpoint 会将断点应用到该特定活动，并且它会在活动的左上角标记一个红色磁盘。断点始终标记为红色磁盘：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_405_1.png)\n\n图 13.16 – 应用于 Write Line\
  \ 活动的断点\n\n- 选择一个活动，然后从 DEBUG 功能区栏中单击 Breakpoints 操作：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_405_2.png)\n\
  \n图 13.17 – 单击 Breakpoints 按钮以应用断点\n\n- 选择所需的活动并按键盘上的 F9 键。\n\n您可以根据偏好使用上述任何方法来应用断点。\n\
  \n### How to disable a breakpoint\n\n禁用断点不会在特定活动上暂停调试过程。禁用的断点在活动的左上角标记为红色圆圈：\n\n\
  ![](img/84b06ad2832c53c5f677f8ce4c80f184_406_0.png)\n\n图 13.18 – Write Line 活动上的禁用断点\n\
  \n您可以使用创建断点时使用的三种方式中的任何一种来禁用断点。因此，您可以选择断点活动，然后从上下文菜单中单击 **Toggle Breakpoint**，单击\
  \ **DEBUG** 面板上的 **Breakpoints** 按钮，或按键盘上的 F9 键来禁用断点。\n\n### How to delete a breakpoint\n\
  \n您可以通过重复用于创建和禁用断点的三个步骤中的任何一个来删除已禁用的断点。要么选择断点活动，然后从上下文菜单中单击 **Toggle Breakpoint**，单击\
  \ **DEBUG** 面板上的 **Breakpoints** 按钮，或按键盘上的 F9 键来删除断点。\n\n现在我们已经了解如何在活动上添加、禁用和删除断点，让我们看看在哪里可以一起查看特定进程的所有断点。\n\
  \n### The Breakpoints panel\n\n**Breakpoints** 面板显示当前项目中的所有断点，以及它们所在的工作流名称：\n\n\
  | 活动名称 | 文件路径 | 条件 | 日志消息 |\n|---|---|---|---|\n| Type Into 'First Name' | Main.xaml\
  \ | | |\n| Assign 'last name' | Main.xaml | lastName... | |\n| Assign 'company name'\
  \ | Main.xaml | | \"The comp... |\n| Assign 'role in company' | Main.xaml | companyN...\
  \ | \"Company... |\n| Write Line | Breakpoint_Ex.xaml | | |\n\n图 13.19 – Breakpoints\
  \ 面板\n\nCondition 列显示特定断点上设置的条件（如果有），Log Message 列显示在该断点上设置的记录消息。\n\n您可以通过从 Breakpoints\
  \ 面板中选择相应操作来删除、启用或禁用项目中的所有断点。\n\n单击 Delete all breakpoints 按钮会删除工作流中存在的所有断点：\n\n\
  ![](img/84b06ad2832c53c5f677f8ce4c80f184_407_0.png)\n\n图 13.20 – 删除所有断点\n\n单击 Enable\
  \ all breakpoints 按钮会启用工作流中存在的所有已禁用断点：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_407_1.png)\n\
  \n图 13.21 – 启用所有断点\n\n单击 **Disable all breakpoints** 按钮会禁用工作流中存在的所有断点：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_408_0.png)\n\
  \n图 13.22 – 禁用所有断点\n\n现在让我们看看如何为各个断点参数化，以满足断点执行所需的特定条件。\n\n### Breakpoint Settings\n\
  \n可以通过从 **Breakpoints** 面板中单击齿轮图标来进一步修改各个断点。这将为该特定断点打开 **Breakpoint Settings** 选项卡：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_408_1.png)\n\n图 13.23 – Breakpoint Settings\
  \ 的齿轮图标\n\n**Breakpoint Settings** 选项卡有四个参数，分别名为 **Condition**、**Hit Count**、**Log\
  \ Message** 和 **Continue execution when logging**：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_409_0.png)\n\
  \n图 13.24 – Breakpoint Settings 选项卡\n\n让我们详细了解这四个参数：\n\n- **Condition**：提供用于中断执行的条件语句。如果断点上的条件变为\
  \ TRUE，则调试暂停，并且相应的活动会被突出显示。\n\n- **Hit Count**：这指定在调试进入暂停状态之前条件被满足的次数 – 例如，变量 `num`\
  \ 的默认值设置为 1。如果在 `While` 活动中带有 `num Mod 2 = 0` 条件的断点且 **Hit Count** 设置为 2，则当条件第二次被满足时，调试将进入暂停状态：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_409_1.png)\n\n图 13.25 – 带有条件的 Hit Count\n\
  \n\n\n\n\n注意\n最大命中计数值为 32,767。\n\n- **日志消息:** 当条件满足时，您可以向断点添加 `trace_level` 日志消息。即使未提供条件，也可以添加日志消息。\n\
  - **记录时继续执行:** 仅当设置了 **日志消息** 参数时，此复选框才可用。如果选中该复选框，则在满足条件时不会暂停执行，并将指定消息记录在 **输出**\
  \ 面板中：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_410_0.png)\n\n图 13.26 – 已初始化所有参数的断点设置\n\
  \n对活动的断点可根据 **断点设置** 选项卡中应用的参数分为四类。四个类别如下：\n\n- 标准断点\n- 条件断点\n- 跟踪点\n- 条件跟踪点\n\n\
  让我们详细了解每一类。\n\n## 标准断点\n\n标准断点是在 **断点设置** 选项卡中未添加 **条件**、**命中计数** 和 **日志消息** 参数的断点。\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_411_0.png)\n\n图 13.27 – 断点\n\n## 条件断点\n\
  \n在 **断点设置** 选项卡中仅添加 **条件** 和/或 **命中计数** 参数的断点称为条件断点：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_411_1.png)\n\
  \n图 13.28 – 条件断点\n\n## 跟踪点\n\n在 **断点设置** 选项卡中仅添加 **日志消息** 参数的断点称为跟踪点：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_411_2.png)\n\
  \n图 13.29 – 跟踪点\n\n## 条件跟踪点\n\n在 **断点设置** 选项卡中添加 **条件** 和/或 **命中计数** 以及 **日志消息**\
  \ 参数的断点称为条件跟踪点：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_411_3.png)\n\n图 13.30\
  \ – 条件跟踪点\n\nUiPath Studio 为不同类型的断点提供了不同图标。如下所示：\n\n| 图标 | 断点 |\n|---|---|\n| \U0001F534\
  \ | 已启用的断点 |\n| ⚪ | 已禁用的断点 |\n| ⊕ | 已启用的条件断点 |\n| ⊕ | 已禁用的条件断点 |\n| ◆ | 已启用的跟踪点\
  \ |\n| ◇ | 已禁用的跟踪点 |\n| ◆⊕ | 已启用的条件跟踪点 |\n| ◇⊕ | 已禁用的条件跟踪点 |\n\n图 13.31 – 断点分类摘要\n\
  \n现在让我们查看 **断点** 面板中各个断点可用的上下文菜单。\n\n## 断点的上下文菜单\n\n从 **断点** 面板右键单击某个断点将打开该断点的上下文菜单：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_412_0.png)\n\n图 13.32 – 断点上下文菜单\n\n上下文菜单显示五个选项：\n\
  \n- **删除**: 从项目中删除所选断点。\n- **聚焦**: 导航到 **设计器** 面板中的断点。\n- **启用**: 此选项仅在禁用的断点上可用。它启用所选断点。\n\
  - **禁用**: 此选项仅在启用的断点上可用。它禁用所选断点。\n- **设置**: 打开 **断点设置** 选项卡，您可以在其中通过传递参数对其进行自定义。\n\
  \n现在我们已经了解了 UiPath Studio 中可用的不同调试面板以及如何使用它们来检测和纠正工作流中的错误。接下来，让我们看看如何在 UiPath Studio\
  \ 中对活动进行测试。\n\n## 测试活动\n\nUiPath Studio 允许您在流程自动化的设计阶段测试活动。根据 Studio 中的场景，您可以以四种不同的方式对活动进行测试：\n\
  \n- 测试活动\n- 创建测试台\n- 运行至此活动\n- 从此活动运行\n\n让我们详细了解每一种方式。\n\n### 测试活动\n\n在所选活动的上下文菜单中选择\
  \ **测试活动** 选项，可以对该特定活动运行测试。选择 **测试活动** 选项将以调试模式打开它，并突出显示所选活动。\n\n您可以在以下场景中使用测试活动：\n\
  \n- 为属性添加默认值，然后对其进行测试\n- 使用 **局部变量** 面板为测试活动添加值\n\n让我们通过一个用例详细了解测试活动。在此，我们将编程一个机器人，用于检查用户输入的数字是偶数还是奇数：\n\
  \n1. 创建一个名为 **Even_Odd** 的新序列，并在其中创建一个名为 **num** 的变量，数据类型为 **Int32**（请注意，未为该变量分配默认值）：\n\
  \n| 名称 | 变量类型 | 作用域 | 默认值 |\n|---|---|---|---|\n| num | Int32 | Even_Odd | 输入 VB\
  \ 表达式 |\n\n图 13.33 – 整型变量 \"num\" 的声明\n\n2. 将以下三组活动拖放到 Even_Odd 序列中：\n\n  - 输入对话框：要求用户输入一个数字\n\
  \  - If：检查数字是偶数还是奇数并显示相应消息\n  - 写入行：显示偶数和奇数消息：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_414_0.png)\n\
  \n图 13.34 – 偶奇数序列\n\n3. 在运行序列之前，我们将测试 If 活动以检查条件逻辑是否正确。为此，请选择 If 活动并右键单击以打开上下文菜单。然后，从上下文菜单中选择\
  \ 测试活动：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_415_0.png)\n\n图 13.35 – 从上下文菜单中选择\
  \ 测试活动\n\n4. 单击 测试活动 将以调试模式打开 If 活动并突出显示该活动。所有调试操作和面板均可用：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_415_1.png)\n\
  \n图 13.36 – 在调试模式下打开的 If 活动\n\n5. 由于 num 变量未分配默认值，我们可以在测试 If 活动之前使用 **局部变量** 面板为变量添加值。单击铅笔图标可让我们编辑变量的值。这里，我们将\
  \ 5 作为值传递给 num 变量：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_416_0.png)\n\n图 13.37\
  \ – 将 num 变量赋值为 5\n\n太棒了！既然变量已赋值，您可以运行 If 活动了。\n\n6. 为此，请从 **调试** 功能区单击 步入 或 继续。\n\
  \n在这种情况下，If 活动 else 块中的 写入行 活动已执行，并在 **输出** 面板中写入了消息 奇数，这意味着 If 活动中编写的条件是正确的：\n\n\
  ![](img/84b06ad2832c53c5f677f8ce4c80f184_416_1.png)\n\n图 13.38 – **输出** 面板中打印的 奇数\n\
  \n### 创建测试台\n\n在 UiPath Studio 中构建自动化就像玩乐高一样，您不断添加积木以完成一个角色。例如，假设您正在构建一个乐高机器人。理想情况下，您会单独构建机器人的手或腿，以测试它们是否按预期移动，然后将其连接到机身上。借助\
  \ **创建测试台**，在构建机器人时可以在 UiPath Studio 中创建相同的场景。因此，使用 **创建测试台** 允许您创建自动化构建块，然后可以单独测试并添加到最终工作流中。\n\
  \n从 **活动** 面板中，您可以选择任何活动并为其创建测试台：\n\n1. 为此，请右键单击所选活动，并从上下文菜单中选择 创建测试台：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_417_0.png)\n\
  \n图 13.39 – 为 写入行 活动创建测试台\n\n单击 创建测试台 将在测试台工作流中打开它。测试台工作流是一个临时序列，不属于当前项目，关闭时会被丢弃：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_418_0.png)\n\n图 13.40 – 创建的临时测试台工作流\n\
  \n所选活动会自动添加到不包含在您的项目中的新临时序列文件中。您可以编辑此活动的属性或添加新活动，然后再调试测试台工作流。\n\n2. 要保存文件，请使用 **设计**\
  \ 功能区中的 **另存为** 选项添加文件名，并将其保存到与项目相同的文件路径中。稍后，您可以使用 **调用工作流文件** 活动并在所需工作流中调用该序列。\n\
  \n> **注意**\n> **创建测试台** 不适用于 `Pick Branch` 活动，因为它需要 `Pick` 活动作为容器来执行。\n\n### 运行至此活动\n\
  \n例如，假设工作流中有五个活动，您只想运行到第二个活动为止。那么，请选择第三个活动，并从上下文菜单中选择 运行至此活动 选项。\n\n\n\n\n让我们通过一个示例来理解这一概念。在\
  \ Main.xaml 文件中，一个 Sequence 活动内包含五个 Write Line 活动。这些 Write Line 活动将打印从“First”、“Second”开始直至“Fifth”的消息：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_419_0.png)\n\n图 13.41 – 序列中的 Write Line\
  \ 活动\n\n在我们的场景中，我们希望打印直到第二个 Write Line 活动的输出。为此，在 Designer 面板中右键单击第三个 Write Line\
  \ 活动，并从上下文菜单中单击“运行至此活动”：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_420_0.png)\n\
  \n图 13.42 – 运行至此活动\n\n这将启动调试过程，在 Output 面板中打印值，并在第三个 Write Line 活动执行前暂停，同时在 Designer\
  \ 面板中将其高亮显示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_420_1.png)\n\n图 13.43 –\
  \ 与 Output 面板一起高亮显示的 Write Line 活动\n\n> **注意**\n> 调试期间，如果工作流处于暂停状态并且触发了“运行至此活动”，则执行将继续直到到达此活动。\n\
  \n## 从此活动运行\n\n“从此活动运行”选项与“运行至此活动”相反。在这里，您可以从任何特定活动开始运行自动化。让我们以之前的示例为例，进一步了解“从此活动运行”。\n\
  \n在这个场景中，我们希望打印来自第四个 Write Line 活动的输出。为此，在 Designer 面板中右键单击第四个 Write Line 活动，并从上下文菜单中单击“从此活动运行”：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_421_0.png)\n\n图 13.44 – 从此活动运行\n\n它将以暂停状态进入调试，允许您从\
  \ Locals 面板更改变量和参数的值。然后，您可以从 DEBUG 功能区中选择“继续”、“步入”、“步过”或“步出”操作来启动调试过程。在我们的案例中，最后两个\
  \ Write Line 活动的值将在 Output 面板中打印：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_421_1.png)\n\
  \n图 13.45 – 在 Output 面板中打印的 Write Line 活动\n\n> 注意\n> 在 Try Catch、Switch、Parallel、Pick、Trigger\
  \ Scope 或 Retry Scope 容器内添加的活动上使用“从此活动运行”将导致错误。\n> 如果在使用“从此活动运行”操作后使用 DEBUG 功能区中的“重启”操作，调试将从先前指示的活动重新开始。\n\
  \n在构建阶段，测试活动在消除任何错误方面起着至关重要的作用。**测试活动** 可调试现有工作流中的某个活动，您可以使用 **Locals** 面板传递变量或参数的值。**创建测试基准**\
  \ 允许您在将活动添加到工作流之前创建一个临时序列来试用这些活动。最后，**运行至此活动** 或 **从此活动运行** 允许您调试到工作流中的特定活动或从中调试。在下一节中，您将获得调试工作流的实践经验。\n\
  \n## 修复工作流\n\n既然您已经了解了 UiPath Studio 中关于调试的所有知识，让我们应用迄今所学的技能来调试工作流并修复一个错误。\n\n您的同事被指派为\
  \ **选民登记** 活动构建一个机器人。机器人需要从 Excel 文件中获取 **名字**、**姓氏**、**电子邮件**、**年龄** 和 **州** 信息，并将其插入到\
  \ Web 选民登记表单的正确字段中。\n\n机器人在某个点抛出错误，您的同事需要您的帮助使其正常工作。因此，让我们应用迄今所学的所有调试知识来修复此工作流。您可以从本章\
  \ *技术要求* 部分中提到的 GitHub 仓库下载代码。\n\n让我们检查输入数据文件和工作流。**Voters Details.xlsx** 文件包含名为\
  \ **名字**、**姓氏**、**电子邮件**、**年龄** 和 **州** 的四列。此外，它还有多行需要输入到 Web 表单中的数据：\n\n| 名字 |\
  \ 姓氏 | 电子邮件 | 年龄 | 州 |\n| :--- | :--- | :--- | :--- | :--- |\n| Marie | Kenny |\
  \ marie.kenny@ui.com | 28 | Maharashtra |\n| Lloyd | Wong | lloyd.wong@ri.com |\
  \ 37 | Karnataka |\n\n图 13.46 – Voters Details.xlsx 文件的片段\n\nMain.xaml 文件包含两个主要的\
  \ Sequence 活动：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_423_0.png)\n\n图 13.47\
  \ – 选民登记序列\n\n这两个活动如下：\n\n- **读取 Excel 文件** 活动：从 Voters Details.xlsx 读取数据并将其存储在名为\
  \ dt_votersDetails 的 datatable 变量中。\n- **打开浏览器** 活动：使用表单 URL 打开一个新的浏览器窗口，并将 dt_votersDetails\
  \ 变量中的值输入到选民登记表单中。为 Web 表单的相应字段声明了五个名为 firstName、lastName、email、age 和 state 的变量：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_424_0.png)\n\n图 13.48 – 打开浏览器序列\n\n此外，Open\
  \ Browser 活动在一个 For Each Row 活动内包含五个 Type Into 活动，用于在 Web 表单中输入详细信息：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_424_1.png)\n\
  \n图 13.49 – 用于向表单输入值的 Type Into 活动\n\n选民登记 Web 表单总共有五个字段（在这里，我们只向您展示两个）：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_425_0.png)\n\
  \n图 13.50 – 选民登记表单的片段\n\n既然我们已经查看了所有输入文件和代码，让我们调试自动化并查看错误是什么。机器人成功完成了前两个人的登记。\n\n\
  在输入第三个人的年龄时，它抛出一个异常，调试进入暂停状态。用于年龄的 `Type Into` 活动在 **Designer** 面板中被高亮显示，因为它导致了异常。一个错误日志在\
  \ **Output** 面板中记录：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_425_1.png)\n\n图\
  \ 13.51 – 在 Type Into 活动中抛出的异常\n\n有关异常的更多信息可以通过单击 **Exceptions** 部分中的放大镜图标从 **Locals**\
  \ 面板中找到：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_426_0.png)\n\n图 13.52 - 异常窗口\n\
  \n从异常中我们可以看出，这是 **InvalidCastException**，当不支持将一个数据类型的实例转换为另一个数据类型时会发生此异常。在用于输入年龄的\
  \ **Type Into** 活动中，使用 **CInt()** 函数将 **String** 转换为 **Integer**。由于类型转换无法进行，因此抛出了异常：\n\
  \n- 在该 Type Into 活动上应用条件为 Not age.IsNumeric 的条件断点并重新启动调试过程：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_426_1.png)\n\
  \n图 13.53 - Type Into 活动上的条件断点\n\n然后，当年龄无法转换为整数时，执行将进入暂停状态。如预期，在输入第三个人的年龄时，调试进入暂停状态而不抛出异常。\n\
  \n- 使用 Immediate 面板检查 age 变量中是否存在数值数据。使用 age.IsNumeric 将打印答案为 false：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_427_0.png)\n\
  \n图 13.54 – 立即面板\n\n- 将 age 变量添加到 Watch 面板以检查它当前持有的值：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_427_1.png)\n\
  \n图 13.55 – 监视面板\n\n现在，我们可以看到 `age` 的值是 4z。因为 z，类型转换无法进行，因此抛出了异常。\n\n- 导航到 Locals\
  \ 面板，通过单击铅笔图标将 age 的值从 4z 更改为 48。\n- 单击 Continue 以恢复调试：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_427_2.png)\n\
  \n图 13.56 – 局部面板\n\n工作流继续执行，没有任何进一步的错误。您已成功调试了自动化的选民登记流程！\n\n\n\n\n## 摘要\n\n在本章中，您了解了什么是调试以及它如何帮助排查并从进程中移除\
  \ bug。首先，您看到了 DEBUG 功能区条中存在的各种调试操作菜单，这些菜单可帮助您导航以对单个文件或整个项目进行调试。接着，您了解了多个调试面板，它们可帮助您修复错误。您还了解了在流程开发的构建阶段内，UiPath\
  \ Studio 中的测试活动。最后，您使用之前学到的所有技能调试了一个工作流以修复 bug。\n\n在下一章中，您将学习如何使用分发器和执行器的概念构建自动化项目。\n"
- "## 发票处理 - 分发器\n\n**亨利食品超市** 是美国的一家连锁便利店，总部位于纽约，目前在美国有 400 多家门店。**发票处理** 流程已被选为\
  \ RPA 自动化，作为亨利食品超市财务和会计部门内更大规模项目计划的一部分。\n\n此流程自动化的目标与项目商业案例相关，主要旨在完成以下任务：\n\n- 加快发票处理速度。\n\
  - 减少发票处理中的冗余活动。\n- 通过消除错误来提升整体性能和可靠性。\n\n发票处理流程会读取电子邮件，并下载以电子邮件附件形式接收的 PDF 发票。然后，它从发票中提取客户信息和发票详情，并将其录入到\
  \ **订单录入 CRM** 中。\n\n您将分两部分构建此流程。您将遵循 **分发器-执行器** 模型并创建两个不同的流程。在本章中，您将构建分发器模型，在下一章中，您将构建执行器模型。\n\
  \n作为 *发票处理 – 分发器* 项目的一部分，您将学习以下内容：\n\n- 创建和使用 Orchestrator 资产\n- 使用邮件自动化\n- 在 UiPath\
  \ Studio 中操作数据\n- 自动化 PDF 文件以读取数据\n- 修改选择器\n- 使用正则表达式\n- 使用 UiPath Studio 数据抓取向导\n\
  - 创建并上传数据到 Orchestrator 队列\n- UiPath Studio 中的异常处理\n- UiPath Studio 中的日志记录\n\n##\
  \ 技术要求\n\n让我们了解本项目的要求：\n\n- UiPath Studio Community/Enterprise/Academic Alliance\
  \ Edition 版本 20.10 及以上，已连接到 UiPath Orchestrator\n- 访问 UiPath Orchestrator 服务\n-\
  \ 一个 Gmail 账户\n- Adobe Acrobat PDF Reader\n- 访问互联网\n- 在安装了 UiPath Studio 的计算机上具有读写权限\n\
  \n您可以在 GitHub 上获取发票处理分发器的完整代码：`https://github.com/PacktPublishing/UiPath-Associate-Certification-Guide.git`。\n\
  \n## 项目概述\n\n在本章中，您将设计发票处理的分发器模型。让我们详细了解流程。以下是您需要执行的步骤：\n\n- 1. 编程一个机器人，以从您的 Gmail\
  \ 账户中读取最后一封未读邮件。\n- 2. 编程一个机器人，以下载已读邮件中的所有发票附件。下载附件的条件如下：\n  - 邮件主题行必须为 Invoice-Henry-FM-Invoice\
  \ Number-Customer Name。\n  - 附件的命名规范必须为 Invoice-Henry FM-Invoice Number-Customer\
  \ Name.pdf。\n- 3. 编程一个机器人，将所有发票附件保存在项目目录中名为 Invoice 的文件夹中。\n- 4. 编程一个机器人，从发票中提取以下相关字段：\n\
  \  - 客户详细信息：\n    - 客户姓名\n    - 客户地址\n    - 客户电话号码\n    - 客户电子邮件 ID\n  - 发票详情：\n\
  \    - 发票日期\n    - 发票编号\n  - 订单信息：\n    - 商品数量\n    - 商品描述\n    - 商品单价\n    - 行总金额\n\
  \  - 小计金额\n  - 运费金额\n  - 总金额\n- 5. 编程一个机器人，将以下详细信息上传到 Orchestrator 队列：\n  - 客户详细信息\n\
  \  - 发票详情\n- 6. 对剩余发票重复步骤 4–5。\n- 7. 编程机器人，如果步骤 2 中从邮件下载的所有附件都已处理，则成功结束流程。\n\n让我们借助流程图来了解整个流程：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_432_0.png)\n\n图 14.1 – 高级流程图\n\n在开始设计流程自动化之前，请从此\
  \ GitHub 仓库的 Input File – Invoice 文件夹下载所有提供的发票：https://github.com/PacktPublishing/UiPath-Associate-Certification-Guide/tree/main/Chapter14/Input%20File%20%E2%80%93%20Invoice。\n\
  \n从您自己的 Gmail 账户为每张单独的发票发送一封单独的邮件，机器人将从此处读取邮件。主题行必须为 Invoice-Henry-FM-Invoice Number-Customer\
  \ Name（发票编号和客户姓名出现在发票文件名中）– 例如，如果客户姓名是 Adam Smith，发票编号是 8745，那么邮件的主题行应为 Invoice-Henry-FM-8745-Adam\
  \ Smith。\n\n以下是一些示例：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_433_0.png)\n\n\
  图 14.2 – 显示主题行和附件的 Gmail 收件箱片段\n\n现在您已将发票发送到您的邮件 ID，让我们开始构建自动化。\n\n## 设置项目\n\n在开始构建流程之前，让我们先正确设置所有\
  \ UiPath Studio 配置：\n\n- 1. 打开 UiPath Studio，创建名为 Invoice_Processing_Dispatcher\
  \ 的新流程：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_433_1.png)\n\n图 14.3 – 创建新流程\n\
  \n- 2. 单击设计器功能区条上的管理程序包，并将项目依赖项更新为以下版本：\n  - UiPath.Excel.Activities – v2.10.4\n\
  \  - UiPath.Mail.Activities – v1.10.5\n  - UiPath.System.Activities – v21.4.1\n\
  \  - UiPath.UIAutomation.Activities – v21.4.4\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_434_0.png)\n\
  \n图 14.4 – 更新依赖项\n\n- 3. 现在您已将依赖项更新为正确版本，让我们再安装一个依赖项，UiPath.PDF.Activities – v3.4.0：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_435_0.png)\n\n图 14.5 – 已添加 PDF 依赖项\n\n\
  - 4. 在 Orchestrator 网页的您的租户下，导航到 **文件夹** 部分并创建名为 Packt 的新文件夹。\n\n现在您已配置好所需的一切，让我们开始构建流程。\n\
  \n## 下载发票\n\n在本节中，您将设计机器人以从 Gmail 账户下载所有发票。以下流程图说明了下载发票的高级流程：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_436_0.png)\n\
  \n图 14.6 – 下载发票\n\n下载发票是整个流程的第一步。让我们构建它：\n\n- 1. 单击 **设计** 功能区条上的 **新建** 按钮，并选择\
  \ **序列**。\n- 2. 将序列命名为 `Download_Invoice` 并单击 **创建** 按钮：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_436_1.png)\n\
  \n图 14.7 – 创建 Download_Invoice 序列\n\n- 3. 登录到您的 `cloud.uipath.com` 账户并启动 Orchestrator\
  \ 服务。在 **资产** 部分下，创建一个名为 `Mail Credential` 的资产，并为 **类型** 选择 **凭据**。接着，输入您的 Gmail\
  \ ID **用户名** 和 **密码** 详细信息，然后单击 **创建** 按钮：\n\n资产 / 添加资产\n\n**资产名称** `Mail Credential`\
  \ **类型** `Credential`\n\n**描述** `Gmail email id and password`\n\n**凭据存储** `Orchestrator\
  \ Database`\n\n**全局值**\n**用户名** `@gmail.com` **密码** `********`\n\n启用全局值后，每个用户都将收到它，除非在下表中特别替换。\n\
  \n图 14.8 - 创建凭据资产以存储 Gmail 凭据\n\n在此场景中，**Mail Credential** 资产是在个人工作区文件夹中创建的。如果您愿意，可以在\
  \ `Packt` 文件夹中创建该资产。\n\n\n\n\n\n- 4. 在 Studio 中，在 `Download_Invoice` 序列内，拖放 Try\
  \ Catch 活动，然后将 `Get Credential` 活动放入 Try 块中。接下来，单击 `Get Credential` 活动的 **属性** 面板。对于\
  \ **输入** 属性，在 **资产名称** 下提供 \"Mail Credential\"。然后，在 **输出** 下，使用 `Ctrl + K` 为 **密码**\
  \ 和 **用户名** 属性创建新变量。为 **密码** 键入 `pwd` 并按 `Enter`，然后为 **用户名** 键入 `email` 并再次按 `Enter`：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_438_0.png)\n\n图 14.9 – Get Credential\
  \ 活动的属性面板\n\n- 5. 在 `Get Credential` 活动之后拖放 `Get IMAP Mail Messages` 活动。单击 `Get\
  \ IMAP Mail Messages` 的 **属性** 面板，按如下配置属性：\n  - **邮件文件夹** - \"Inbox\"。\n  - **端口**\
  \ - 993。\n  - **服务器** - \"imap.gmail.com\"。\n  - **电子邮件** - 传递 email 变量。\n  - **安全密码**\
  \ - 传递 pwd 变量。\n  - **筛选表达式** - \"SUBJECT Invoice-Henry-FM\"。\n  - 选中 **标记为已读**\
  \ 选项。\n  - **顶部** - 10。\n  - 在 **输出** 下的 Messages 属性中添加名为 mails 的新变量：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_439_0.png)\n\
  \n图 14.10 – Get IMAP Mail Messages 活动的属性面板\n\n- 6. 接下来，使用 For Each 活动遍历所有邮件。然后，在\
  \ **值** 部分传递 mails 变量，将参数名从 item 改为 mail，并将 TypeArgument 更改为 System.Net.Mail.MailMessage。\n\
  \n- 7. 在 For Each 活动的主体内，使用 If 活动来检查邮件是否将发票作为附件。在 If 活动条件下，键入 mail.Attachments.Count\
  \ > 0 And mail.Attachments.Count < 2 And mail.Attachments.Item(0).Name.ToString.StartsWith(\"\
  Invoice-Henry FM-\") And mail.Attachments.Item(0).Name.ToString.EndsWith(\".pdf\"\
  。\n\n- 8. 布尔条件检查单个附件和发票的命名约定。如果布尔条件为 TRUE，则保存附件；否则，记录一条消息，日志级别为 Info，消息内容为 \"No\
  \ invoice attachment in the mail\"。\n\n- 9. 然后，将 Save Attachments 活动拖放到 If 活动的 Then\
  \ 块中以下载发票。最后，在 Message 属性中传递 mail 参数。现在，在 Save Attachments 活动的 FolderPath 属性中键入\
  \ \"Invoice\"（保存发票的文件夹名）。\n\n- 10. 在 **参数** 面板中，创建名为 out_isMail 的参数。将其方向设置为 Out，并将参数类型选择为\
  \ boolean。\n\n- 11. 然后，在 Save Attachments 下方使用 Assign 活动，在 **To** 部分传递 out_isMail，在\
  \ **值** 部分传递 True。您稍后将在 Main.xaml 中使用 out_isMail 参数来读取发票：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_440_0.png)\n\
  \n图 14.11 – 从邮件中保存发票附件\n\n- 12. 最后，在 Catches 块内，捕获 SystemException 并记录一条消息。\nLog\
  \ Level 值应为 Error，Message 应为 \"Unable to fetch the mail, please check Logon or host\
  \ properties setting\"+vbLf+exception.Message+vbLf+exception.Source：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_441_0.png)\n\
  \n图 14.12 – 带有 Log Message 活动的 Catches 块\n\n在完成此 Download_Invoice 序列之前，让我们对其进行最终检查。Download_Invoice\
  \ 序列的 **变量** 面板应包含三个变量，如以下屏幕截图所示：\n\n| 名称 | 变量类型 | 作用域 | 默认值 |\n|---|---|---|---|\n\
  | pwd | SecureString | Download_Invoice | 输入 VB 表达式 |\n| email | String | Download_Invoice\
  \ | 输入 VB 表达式 |\n| mails | List<MailMessage> | Download_Invoice | 输入 VB 表达式 |\n\n\
  图 14.13 – 变量面板\n\nDownload_Invoice 序列的 **参数** 面板应包含一个 Out 参数，如以下屏幕截图所示：\n\n| 名称\
  \ | 方向 | 参数类型 | 默认值 |\n|---|---|---|---|\n| out_isMail | Out | Boolean | 不支持默认值\
  \ |\n\n图 14.14 – 参数面板\n\n现在我们已完成从邮件中下载发票，让我们查看下一节，了解如何读取下载的发票以从中提取所需信息。\n\n## 读取发票\n\
  \n在本节中，您将读取从邮件中下载的发票。以下图表说明了读取发票的高级流程：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_442_0.png)\n\
  \n图 14.15 – 读取发票详细信息\n\n在此过程中，您将从已读取的发票中提取客户详细信息和发票明细。让我们开始设计此过程：\n\n- 1. 让我们先创建一个名为\
  \ Read_Invoice 的新序列。\n- 2. 然后，在 **变量** 面板中，创建名为 `currentDirectoryPath` 的变量，将类型选择为\
  \ `String`，并在 **默认** 部分键入 `Directory.GetCurrentDirectory()`。\n- 3. 另外，再创建两个变量，第一个名为\
  \ `invoices`，类型为 `String[]`（`String` 数组），第二个名为 `invoicePath`，类型为 `String`。\n- 4.\
  \ 在 `Read_Invoice` 序列中，拖放第一个 `Assign` 活动。在 **To** 部分传递 `invoices` 变量，在 **值** 部分传递\
  \ `Directory.GetFiles(currentDirectoryPath+\"\\Invoice\")`。这将从 `Invoice` 文件夹获取所有发票名称，并将其存储在名为\
  \ `invoices` 的变量中。\n\n- 5. 接下来，拖放 `For Each` 活动，以便您可以遍历每个发票并从中提取信息。然后，在 **值** 部分传递\
  \ `invoices`，并在 `For Each` 活动中将 `item` 更改为 `invoice`。\n\n- 6. 在 `For Each` 活动的主体内添加一个\
  \ `Assign` 活动，在 **To** 部分传递 `InvoicePath` 变量，在 **值** 部分传递 `invoice.ToString`：\n\n\
  ![](img/84b06ad2832c53c5f677f8ce4c80f184_443_0.png)\n\n图 14.16 – Read_Invoice 序列\n\
  \n现在我们可以遍历每个发票，先从发票中提取客户详细信息。之后，我们也将提取发票明细。\n\n### 提取客户详细信息\n\n在本节中，您将从已读取的发票中提取客户详细信息。以下图表说明了从发票中提取客户详细信息的高级流程：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_443_1.png)\n\n图 14.17 – 提取客户详细信息\n\n\
  在此序列中，您将从发票中提取客户的姓名、地址、电话号码和电子邮件：\n\n- 1. 让我们先创建一个新序列并将其命名为 Extract_Customer_Details。\n\
  - 2. 创建四个 Out 参数和一个 In 参数，如以下屏幕截图所示：\n\n| 名称 | 方向 | 参数类型 | 默认值 |\n|---|---|---|---|\n\
  | out_customerPhoneNo | Out | String | 不支持默认值 |\n| out_customerName | Out | String\
  \ | 不支持默认值 |\n| out_customerEmail | Out | String | 不支持默认值 |\n| out_customerAddress\
  \ | Out | String | 不支持默认值 |\n| in_invoicePath | In | String | 输入 VB 表达式 |\n\n图 14.18\
  \ – 参数面板\n\n- 3. 要提取客户姓名，拖放一个 Sequence 活动并将其重命名为 Customer Name。\n- 4. 如果您查看发票名称，它中间已包含客户姓名。因此，您可以使用字符串操作方法，仅从完整字符串中提取客户姓名。\n\
  - 5. 在 Customer Name 序列中，添加一个 Assign 活动并在 **To** 部分传递 out_customerName。然后，在 **值**\
  \ 部分键入 `in_invoicePath.Split({\" -\"},StringSplitOptions.None)(3).Split({\".\"},StringSplitOptions.None)(0)`：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_444_0.png)\n\n图 14.19 – 提取客户姓名\n\n- 6.\
  \ 现在让我们提取客户地址。我们将使用 Read PDF Text 活动来读取发票。在 **文件名** 属性下传递 `in_invoicePath` 参数。接下来，使用\
  \ `Ctrl + K` 在 **输出** 下的 **文本** 属性中创建新变量；然后键入 `invoiceData` 并按 `Enter`。使用 Read PDF\
  \ Text 活动读取的所有发票数据都将保存在 `invoiceData` 变量中：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_445_0.png)\n\
  \n图 14.20 – Read PDF Text 活动\n\n- 7. 如果您查看发票，客户地址位于客户姓名和电话号码之间。因此，要查找客户地址，您将再次使用字符串操作方法。\n\
  - 8. 拖放一个 Sequence 活动并将其重命名为 `Customer Address`。\n- 9. 创建一个名为 `custNameIndex`（用于从发票中获取客户姓名的索引位置）的\
  \ `Int32` 类型新变量。\n- 10. 在 `Customer Address` 序列中，添加一个 `Assign` 活动，在 **To** 部分传递\
  \ `custNameIndex`，并在 **值** 部分键入 `invoiceData.IndexOf(out_customerName)`。\n\n\n\n\
  \n\n- 11. 将另一个 Assign 活动拖放进来，在 **目标** 部分传入 out_customerAddress 参数，并在 **值** 部分键入\
  \ `invoiceData.Substring(custNameIndex + out_customerName.Length, invoiceData.IndexOf(\"\
  \ Ph No:\", custNameIndex + out_customerName.Length) - custNameIndex - out_customerName.Length)`：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_446_0.png)\n\n### 图 14.21 – 提取客户地址\n\n\
  让我们现在提取客户的电话号码。您将遵循与客户地址相同的逻辑。客户电话号码位于 **电话号码:** 和 **电子邮件:** 文本之间。同样，您将在此处使用字符串操作方法。\n\
  \n- 12. 将一个 Sequence 活动拖放进来，并将其重命名为 Customer Phone Number。\n\n- 13. 创建一个名为 `custPhoneNoIndex`（用于从发票中获取\
  \ **电话号码:** 的索引位置）的 `Int32` 类型变量。\n\n- 14. 在 Customer Phone Number 序列内，添加一个 Assign\
  \ 活动，在 To 部分传入 custPhoneNoIndex，并在 Value 部分键入 invoiceData.IndexOf(\"Ph No: \")。\
  \  \n\n- 15. 将另一个 Assign 活动拖放进来，在 To 部分传入 out_customerPhoneNo 参数，并在 Value 部分键入 `invoiceData.Substring(custPhoneNoIndex\
  \ + 6, invoiceData.IndexOf(\"Email:\", custPhoneNoIndex + 6) - custPhoneNoIndex\
  \ - 6)`：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_447_0.png)\n\n### 图 14.22 -\
  \ 提取客户电话号码\n\n- 16. 让我们现在提取客户的电子邮件地址。为此，您将使用第 7 章“使用 UiPath 操作数据”中介绍的正则表达式 (RegEx)\
  \ 技术。将一个 Sequence 活动拖放进来，并将其重命名为 Customer Email。\n\n- 17. 接下来，在 Customer Email 序列内，拖放\
  \ Matches 活动。\n\n- 18. 单击配置正则表达式按钮以传入电子邮件正则表达式。\n\n- 19. 在 **正则表达式生成器** 窗口中，从 **正则表达式**\
  \ 下拉菜单中选择 **电子邮件**，并单击 **保存** 按钮：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_448_0.png)\n\
  \n### 图 14.23 – 从正则表达式生成器中选择电子邮件\n\n- 20. 在 Matches 活动的属性部分，在 **输入** 下传入 invoiceData。然后，在\
  \ **结果** 部分，创建一个新变量（使用 `Ctrl + K`），命名为 emails。\n\n- 21. 在 Matches 活动之后，拖放一个 Assign\
  \ 活动以分配从正则表达式中提取的电子邮件。在 **目标** 部分传入 out_customerEmail 参数。然后，在 Assign 活动的 **值** 部分键入\
  \ emails.ElementAt(0).ToString。\n\n由于发票只有一个电子邮件地址，您将仅通过第 0 个索引访问它：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_449_0.png)\n\
  \n### 图 14.24 – 提取客户电子邮件\n\n- 22. 返回到 Read_Invoice 序列。从 **项目** 面板中，将 Extract_Customer_Details.xaml\
  \ 工作流拖放到 For Each 活动主体中的 Assign 活动下方：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_449_1.png)\n\
  \n### 图 14.25 – 调用 Extract_Customer_Details.xaml\n\n- 23. 单击 **导入参数** 按钮，并将 `invoicePath`\
  \ 变量作为值传递给 `in_InvoicePath` 参数。\n\n- 24. 使用 `Ctrl + K` 创建四个新变量，名为 `customerName`、`customerAddress`、`customerEmail`\
  \ 和 `customerPhoneNo`。然后，将它们作为 **值** 传递给所有 **输出** 参数，如下截图所示：\n\n| 名称 | 方向 | 类型 |\
  \ 值 |\n| :--- | :--- | :--- | :--- |\n| in_invoicePath | 输入 | 字符串 | invoicePath\
  \ |\n| out_customerName | 输出 | 字符串 | customerName |\n| out_customerAddress | 输出\
  \ | 字符串 | customerAddress |\n| out_customerEmail | 输出 | 字符串 | customerEmail |\n\
  | out_customerPhoneNo | 输出 | 字符串 | customerPhoneNo |\n\n### 图 14.26 – 导入参数\n\n现在我们已成功提取客户的姓名、电话号码、地址和电子邮件，让我们来看看如何提取发票明细。\n\
  \n## 提取发票明细\n\n在本节中，您将从已读取的发票中提取发票明细。下图说明了从发票中提取客户详细信息的高级流程：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_450_0.png)\n\
  \n### 图 14.27 – 提取发票明细\n\n在此序列中，我们将提取发票日期、发票编号和订单信息：\n\n- 1. 让我们先创建一个新序列，并将其命名为\
  \ `Extract_Invoice_Particular`。\n\n- 2. 现在，创建三个 `Out` 参数和一个 `In` 参数，如下截图所示：\n\n\
  | 名称 | 方向 | 参数类型 | 默认值 |\n|---|---|---|---|\n| out_invoiceNumber | 输出 | 字符串 | 不支持默认值\
  \ |\n| out_invoiceDate | 输出 | 字符串 | 不支持默认值 |\n| out_dt_invoiceParticulars | 输出 |\
  \ 数据表 | 不支持默认值 |\n| in_invoicePath | 输入 | 字符串 | 输入 VB 表达式 |\n\n### 图 14.28 – 参数面板\n\
  \n- 3. 将 Start Process 活动拖放进来，并在 FileName 属性部分传入 in_invoicePath 参数。当机器人运行时，此场景中的\
  \ Start Process 活动将在 Adobe Acrobat Reader 中打开发票 PDF 文件：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_451_0.png)\n\
  \n### 图 14.29 – Start Process 活动\n\n- 4. 现在，在后台，在 Adobe Acrobat Reader 中打开任意一张发票（注意，此流程中使用的\
  \ Adobe Acrobat Reader 是 32 位版本）。然后，在 UiPath Studio 中，在 Start Process 活动之后，拖放 Attach\
  \ Window 活动。\n\n- 5. 接下来，单击“指示屏幕上的窗口”，将鼠标悬停在 Adobe Reader (Invoice) 上，然后右键单击它。这将捕获发票\
  \ PDF：\n\n- 6. 让我们来看看 Attach Window 活动的选择器。选择器代码如下：\n\n```\n<wnd app='acrord32.exe'\
  \ cls='AcrobatSDIWindow'\ntitle='Invoice-Henry FM-Henry Dough.pdf - Adobe Acrobat\n\
  Reader DC (32-b*' />\n```\n\n- 7. 如果您查看 title 属性，其值为 'Invoice-Henry FM-Henry Dough.pdf\
  \ - Adobe Acrobat Reader DC (32-b*'。在此处，还包含了客户名称，这意味着这将仅针对名为 Henry Dough 的客户运行，但我们有多张发票并需要遍历它们，因此此选择器对其他发票无效。因此，我们需要使选择器动态化，以便它适用于所有发票。\n\
  \n- 8. 为此，向选择器添加 * 通配符（如第 8 章“探索 UiPath 选择器”中所述）。编辑选择器，将客户名称部分替换为 *，并单击 **验证** 按钮。这将变为绿色，表明新选择器正确。\n\
  \n- 9. 添加 * 通配符后，新的选择器代码应如下所示 – <wnd app='acrord32.exe' cls='AcrobatSDIWindow' title='Invoice-Henry\
  \ FM-*.pdf - Adobe Acrobat Reader DC (32-b*' />：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_452_0.png)\n\
  \n### 图 14.30 – Attach Window 活动的选择器编辑器窗口\n\n- 10. 将 Get Text 活动拖放到 Attach Window\
  \ 活动内部。您将使用此 Get Text 活动从 PDF 中捕获发票日期。单击 Get Text 活动的 **指示窗口内元素** 操作。然后，将鼠标光标悬停在发票的\
  \ **日期** 字段上，并通过右键单击将其记录下来，如下截图所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_453_0.png)\n\
  \n### 图 14.31 – 从发票中捕获日期\n\n- 11. 让我们来看看此 Get Text 活动的选择器。在此例中，发票中提到的日期由选择器捕获。以下是选择器的一部分：\n\
  \n```\n<ctrl name=' Date: 16/07/2021 ' role='text' />\n```\n\n由于我们希望它能动态化以适用于任何其他日期，我们将再次使用动态选择器概念。将\
  \ 16/07/2021 部分替换为 * 并单击 **验证** 按钮。验证按钮将变为绿色，表明新选择器正确。新的选择器代码应如下所示：\n\n```\n<ctrl\
  \ name=' Date: * ' role='text' />\n```\n\n* 将确保其适用于发票中提供的任何日期：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_453_1.png)\n\
  \n### 图 14.32 – 用于发票日期的 Get Text 活动的选择器编辑器窗口\n\n\n\n\n\n- 12. 既然我们已捕获发票日期，请将其保存到已创建的参数中。在**属性**面板下，将\
  \ out_invoiceDate 传递到**输出**属性的**值**部分。\n\n我们已成功提取发票日期。现在，让我们提取发票号码。\n\n- 13. 将“获取文本”活动拖放到发票日期的“获取文本”活动下方。您将使用此“获取文本”活动从\
  \ PDF 中捕获发票号码。\n\n- 14. 单击**指示窗口内元素**，将鼠标光标悬停在发票的**发票号码**字段上，然后通过右键单击将其记录下来。\n\n\
  - 15. 让我们来看看此“获取文本”活动的选择器。在此示例中，发票中提到的发票号码由选择器捕获。以下是选择器的部分内容：\n\n```\n<ctrl name='\
  \ Invoice No # 5321 ' role='text' />\n```\n\n由于我们希望选择器具有动态性，以适用于任何其他提供的发票号码，我们将再次使用动态选择器概念。将\
  \ 5321 部分替换为 * 并单击**验证**按钮。**验证**按钮会变为绿色，这确认新选择器是正确的。您的新选择器代码应如下所示：\n\n```\n<ctrl\
  \ name=' Invoice No # * ' role='text' />\n```\n\n* 将确保它适用于发票中提供的任何发票号码：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_455_0.png)\n\
  \n图 14.33 – 发票号码的“获取文本”活动的选择器编辑器窗口\n\n- 16. 既然我们已捕获发票号码，请将其保存到已创建的参数中。在**属性**面板下，将\
  \ out_invoiceNumber 传递到**输出**属性的**值**部分。\n\n> > **注意**\n> >\n> > 发票日期和发票号码的选择器是部分生成的，因为两个“获取文本”活动都在“附加窗口”活动内部使用。\n\
  \n让我们现在提取发票详细信息。由于数据是以表格形式呈现的结构化数据，我们将使用 UiPath Studio 的数据抓取向导工具来提取它：\n\n- 1. 单击\
  \ DESIGN 功能区中的“数据抓取”按钮。将打开一个新的“提取向导”窗口；然后，单击“下一步”按钮以启动数据抓取过程：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_456_0.png)\n\
  \n图 14.34 – 数据抓取向导\n\n- 2. 将光标悬停在表格的任何单元格上并右键单击：\n\n| 数量 | 描述 | 单价 | 行总计 |\n| ---\
  \ | --- | --- | --- |\n| 2 | 牛油果和鹰嘴豆意面 | 10.00 | 20.00 |\n| 5 | 牛油果和西柚贝果 | 8.00\
  \ | 40.00 |\n| 1 | 杏枣碎蛋糕 | 10.00 | 10.00 |\n| 1 | 车切达干枣沙拉 | 15.00 | 15.00 |\n| 1\
  \ | 马斯卡彭和桑葚沙拉 | 20.00 | 20.00 |\n| | | 小计 | 105.00 |\n| | | 运费 | 2.00 |\n| | | 总计\
  \ | $107.00 |\n\n图 14.35 – 选择表格单元格\n\n- 3. 将出现一个新窗口，显示所有提取的表格单元格值。在**最大结果数**字段中输入\
  \ 0（零），然后单击**完成**按钮：\n\n### 预览数据\n\n| 数量 | 描述 | 单价 | 行总计 |\n| --- | --- | --- |\
  \ --- |\n| 2 | 牛油果和鹰嘴豆意面 | 10.00 | 20.00 |\n| 5 | 牛油果和西柚贝果 | 8.00 | 40.00 |\n| 1\
  \ | 杏枣碎蛋糕 | 10.00 | 10.00 |\n| 1 | 车切达干枣沙拉 | 15.00 | 15.00 |\n| 1 | 马斯卡彭和桑葚沙拉 |\
  \ 20.00 | 20.00 |\n| | | 小计 | 105.00 |\n| | | 运费 | 2.00 |\n| | | 总计 | $107.00 |\n\
  \n编辑数据定义 最大结果数（0 表示全部）0\n\n帮助 < 返回 完成 取消\n\n- 4. 单击**完成**按钮会将**提取结构化数据**活动放置在 Studio\
