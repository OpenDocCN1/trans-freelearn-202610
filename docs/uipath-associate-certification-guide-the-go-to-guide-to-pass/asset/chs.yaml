- '## 3 介绍 UiPath Orchestrator


  **UiPath Orchestrator** 是一个 Web 应用程序，也是必不可少的 UiPath 组件，通过它，在 **UiPath Studio** 中开发的自动化工作流会被发布、分配给机器人并执行。它可以管理机器人、活动包、待处理数据、执行计划以及许多其他资产。Orchestrator
  可以管理各种类型的流程，从简单到复杂。


  本章重点介绍 **UiPath Cloud** 平台和 Orchestrator。与 UiPath Studio 类似，UiPath Orchestrator
  在自动化中发挥着重要作用。Orchestrator 是所有已部署机器人和流程的中央控制单元；因此，了解 Orchestrator 的用途以及在 Orchestrator
  中用于管理虚拟劳动力的关键概念至关重要。


  本章包含以下部分：


  - 介绍 UiPath Automation Cloud 平台

  - 介绍 UiPath Orchestrator

  - 了解 UiPath Orchestrator 的基本概念

  - 在 Automation Cloud 中创建您的第一个 Orchestrator 实例

  - 将本地机器人连接到 Orchestrator


  ### 技术要求


  在开始本章之前，请确保已安装 UiPath Studio 和 **UiPath Robot**。本章需要您大致了解如何使用 Studio 和 **UiPath
  Assistant**。


  此外，请使用以下链接注册或登录 Cloud 平台：https://cloud.uipath.com/portal_/cloudrpa。


  本章将详细讨论 Cloud 平台的功能。


  ### 创建您的第一个云 Orchestrator 实例


  UiPath 提供三个版本的云平台：社区版、企业试用版和企业版。无论哪个版本，注册云平台都会自动创建 UiPath Orchestrator 服务。已完成的服务可见于
  **主页** 页面。但是，如果 Orchestrator 服务在主页上不可用，您可以通过导航到 **管理** 页面，然后进入 **服务** 页面来轻松创建它。


  如果不可用，请按照以下步骤创建您的第一个 Orchestrator 服务：


  1. 通过以下链接登录 Cloud 平台：https://cloud.uipath.com/portal_/cloudrpa。

  2. 如果 **主页** 界面上不可用 Orchestrator 服务，请导航到 **管理** 页面。

  3. 导航到 **租户** 页面并单击 **添加租户** 按钮。

  4. 填写 **租户名称** 字段，并确保在服务选项中选中了 Orchestrator 服务。

  5. 单击 **保存** 按钮。

  6. 如果 Orchestrator 服务可用，请单击 **Orchestrator 服务** 以导航到 Orchestrator。


  按照这些步骤可以轻松创建第一个 Orchestrator 服务。设置服务是第一步。UiPath Robot 服务需要进行一些配置才能连接到创建的 Orchestrator
  服务。


  ### 介绍 UiPath Cloud 平台


  基于云的 Enterprise 平台以平台即服务形式提供给所有用户。Cloud 平台使用户能够创建和管理所有自动化资源。它允许用户无需更改现有基础架构即可即时自动化，并快速扩展。此外，Cloud
  平台还能通过请求试用或购买 UiPath 提供的其他服务的额外许可证，轻松管理许可证计划。


  以下是 Cloud 平台的一些主要功能：


  - 管理谁可以访问 Cloud 平台及其基于所需执行任务的角色

  - 通过将许可证分配给 Orchestrator 实例来管理许可证

  - 管理多个 UiPath Orchestrator 租户及其关联的服务

  - 管理基于触发器调度程序需要执行的机器人和流程

  - 管理 UiPath 提供的其他基于云的解决方案

  - 管理出于审计目的的日志


  UiPath 在 Cloud 平台中管理所有系统更新，从而让用户免受系统更新负担。此外，Cloud 平台提供业界领先的防御机制，许多政府组织已验证其可确保数据安全。Cloud
  平台面向企业用户和社区用户提供。


