  \ 工作流活动的 **导入参数** 按钮，以打开 **Invoked workflow's arguments** 窗口：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_499_0.png)\n\
  \n图 15.29 - 导入参数\n\n- 27. 将 flag、invoiceDate、invoiceNumber 和 invoiceParticulars\
  \ 变量传递到 **“值”** 部分，如下面的屏幕截图所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_499_1.png)\n\
  \n图 15.30 - 调用工作流的参数窗口\n\n- 28. 最后，拖放连接到 **Invoke Enter_Invoice_Particulars** 工作流活动的\
  \ **流程决策** 活动。\n\n\n\n\n\n- 29. 将 `flag` 变量传递给 `Flow Decision` 活动的 **Condition**\
  \ 属性。这样做可确保如果 `flag` 变量的结果为 True，则可以继续处理新的事务项目。否则，如果 `flag` 变量的结果为 False，则表示在将发票详细信息输入到\
  \ Order Entry CRM 网页时发生了异常：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_500_0.png)\n\
  \n图 15.31 – Flow Decision 活动\n\n现在，您已完成在 Order Entry CRM 网页中输入发票详细信息。在下一节中，我们将根据\
  \ `Flow Decision` 活动中 `flag` 变量的结果设置事务项目的状态。\n\n## 设置事务项目状态\n\n在本节中，对于读取和处理的每个事务项目，您将状态设置为\
  \ **Successful** 或 **Failed**：\n\n- 对于来自 `Invoke Enter_Invoice_Particulars` 工作流活动的\
  \ `Flow Decision` 活动的 `True` 分支，您将事务项目的 **Status** 设置为 **Successful**。\n- 对于其余 `Flow\
  \ Decision` 活动的 `False` 分支，您将事务项目的 **Status** 设置为 **Failed**。\n\n那么，让我们设置事务项目的状态：\n\
  \n- 1. 将连接 `True` 分支的 `Set Transaction Status` 活动拖放到工作流中：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_501_0.png)\n\
  \n图 15.32 – 成功的事务\n\n- 2. 编辑 Set Transaction Status 的属性，如下所示：\n\n  - 将 Status 设置为\
  \ Successful。\n  - 将 transactionItem 变量传递到 TransactionItem 文本字段中。\n  - 对于此流程，队列已在\
  \ Orchestrator 工作流中名为 Packt 的文件夹内创建。因此，您将在 Folder Path 部分键入 \"Packt\"：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_501_1.png)\n\
  \n图 15.33 – 成功的 Set Transaction Status 活动的属性面板\n\n- 3. 将 Set Transaction Status\
  \ 活动连接到 Fetch transaction item 序列。这样做将允许机器人从队列中获取下一个事务项目并对其进行处理。\n\n- 4. 将新的 Set\
  \ Transaction Status 活动拖放到工作流中以连接 False 分支，如下图所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_502_0.png)\n\
  \n图 15.34 – 失败的事务\n\n- 5. 编辑 Set Transaction Status 的属性，如下所示：\n\n  - 将 Status 设置为\
  \ Failed。\n  - 将 transactionItem 变量传递到 TransactionItem 文本字段中。\n  - 在 Folder Path\
  \ 部分键入 \"Packt\"。\n  - 将 ErrorType 设置为 Application。\n  - 在 Reason 部分键入 \"Failed\
  \ while retrieving the transaction item or entering invoice data\"：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_503_0.png)\n\
  \n图 15.35 – 失败的 Set Transaction Status 活动的属性面板\n\n将 transactionItem 状态设置为 Failed\
  \ 将把 Orchestrator 中的状态从 In Progress 更新为 Retried。对于每个 Retried 状态，都会向队列添加一个具有 New\
  \ 状态的新事务项目。\n\n既然 transactionItem 的状态已设置为 Failed，让我们看看如何从队列中获取下一个事务项目。\n\n## 关闭和打开\
  \ CRM\n\n由于事务项目的状态已设置为失败，在从队列中获取下一个事务之前，您需要关闭 Order Entry CRM 网页并再次打开 CRM：\n\n-\
  \ 1. 在 Read_From_Queue 工作流中，将连接到 Set Transaction Status (Failed) 活动的 Sequence 活动拖放到工作流中。然后，将其重命名为关闭和打开\
  \ CRM。\n\n- 2. 在关闭和打开 CRM 序列内，将元素存在活动拖放到工作流中，并在 Order Entry CRM 网页上指示 Henry's Food\
  \ Mart Order Entry。在属性面板中，使用 Ctrl + K 在 Exists 下创建一个名为 isCrmExists 的新变量。\n\n以下屏幕截图显示了元素存在活动指示\
  \ Henry's Food Mart Order Entry：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_504_0.png)\n\
  \n图 15.36 – CRM 页面上的元素存在活动\n\n在关闭 CRM 之前，您可以检查 CRM 是打开还是已关闭。元素存在活动将返回一个布尔值作为输出：\n\
  \n- TRUE 表示 CRM 仍然打开。\n- FALSE 表示 CRM 不可用。\n\nTRUE 表示机器人需要关闭 CRM 并再次打开 CRM，FALSE\
  \ 表示机器人只需再次打开 CRM，因为它已关闭。\n\n- 3. 为实现前述逻辑，您将在元素存在活动下方使用如果活动。将 isCrmExists 传递到 Condition\
  \ 字段中。\n\n- 4. 在如果活动的 Then 块中，将附加浏览器活动拖放到工作流中，附加已打开的 Order Entry CRM 网页，并将关闭选项卡活动放置在附加浏览器活动的范围内。\n\
  \n- 5. 在附加浏览器活动下方，将打开浏览器活动拖放到工作流中，并将 Environment.CurrentDirectory+\"\\\\CRM\\\\\
  Order Entry.html\" 键入 Url 字段中。然后，将最大化窗口活动放置在打开浏览器活动的范围内。\n\n- 6. 在如果活动的 Else 块中，将打开浏览器活动拖放到工作流中，并将\
  \ Environment.CurrentDirectory+\"\\\\CRM\\\\Order Entry.html\" 键入 Url 字段中。然后，将最大化窗口活动放置在打开浏览器活动的范围内：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_505_0.png)\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_505_1.png)\n\
  \n图 15.37 – 关闭和打开 CRM 序列\n\n- 7. 返回 Read_From_Queue 工作流，并将关闭和打开 CRM 序列连接到获取事务项序列。\n\
  \n如果事务项目失败，您已成功构建一段逻辑来关闭并再次打开 CRM。接下来，是时候组装 Main.xaml 文件以运行流程了。\n\n## 组装 Main.xaml\
  \ 文件\n\n是时候运行流程了，但在运行流程之前，让我们先在 Main.xaml 文件中调用 Read_From_Queue 工作流：\n\n- 1. 在 Main.xaml\
  \ 工作流中，从 **Project** 面板将 Read_From_Queue 工作流拖放到最大化窗口活动下方。\n- 2. 在其下方添加关闭选项卡活动：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_506_0.png)\n\n图 15.38 – Main.xaml 工作流\n\
  \n现在，让我们单击 **Design** 功能区上的 **Run** 按钮来运行整个流程。流程无错误完成，队列中的所有新事务项目均已处理并标记为成功：\n\n\
  ## 队列/事务：HenryFoodMartInvoice\n\n| 状态 | 参考 | 修订 | 优先级 |\n| :--- | :--- | :--- |\
  \ :--- |\n| Successful | | None | Normal |\n| Successful | | None | Normal |\n|\
  \ Successful | | None | Normal |\n| Successful | | None | Normal |\n\n图 15.39 –\
  \ 队列中的成功事务项目\n\n恭喜！您已成功构建发票处理流程的执行者模型自动化。现在您可以将代码发布到 Orchestrator，以便从 Orchestrator\
  \ 页面或使用 UiPath 助手运行机器人。\n\n## 总结\n\n在本章中，您开发了一个从名为 **HenryFoodMartInvoice** 的队列中获取事务项目的自动化流程。随后，您从事务项目中检索了所有特定数据并将其存储在局部变量中。一旦从事务项目中检索完所有数据，您就在\
  \ Order Entry CRM 网页上输入了客户详细信息和发票详细信息。\n\n最后，您为 Henry's Food Mart 完成了发票处理流程的调度-执行者模型。在\
  \ _第 14 章，发票处理 – 调度器_ 中，您从邮件中下载了发票并从发票中提取了客户详细信息和发票详细信息，并将其上传到队列。在本章中，您从队列中检索了客户详细信息和发票详细信息，并将它们输入到\
  \ Order Entry CRM 中。\n\n在下一章中，您将了解更多有关 **UiPath RPA Associate Exam (UiRPA)** 的信息。\n\
