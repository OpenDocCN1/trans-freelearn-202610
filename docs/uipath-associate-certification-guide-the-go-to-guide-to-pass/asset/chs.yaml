  \ 所示：\n\n- 6. 在 **输出** 面板中验证输出，以确保 **TermsAndConditions** 文本已从网页中提取，并且 **继续** 按钮可用，如图\
  \ 10.15 所示：\n\n```\nDebug started for file: Main\nExploring_UiInteraction execution\
  \ started\nBy creating an account, you agree to the Terms And Conditions set out\
  \ by this site, including our Cookie Use\nTrue\nExploring_UiInteraction execution\
  \ ended in:\n00:00:17\n```\n\nFigure 10.15 – 检查 UiPath Studio 中的输出\n\n在本节中，我们了解了机器人如何与网页交互以读取和写入数据。我们还了解了机器人如何使用自动化活动和属性与\
  \ GUI 交互以自动化 Web 应用程序。您已了解在执行 GUI 自动化时需要注意的不同类型的活动和属性。我们还在示例中使用了这些活动和属性，以更好地理解其功能。您将在即将到来的章节中了解更多有关可用录制选项以及输入和输出方法的信息，这将帮助您更快地进行开发并执行后台自动化。\n\
  \n## 记录 GUI 的方法\n\n录制是 UiPath Studio 中的重要功能，允许用户捕获屏幕上执行的操作并将其转换为序列；这在自动化业务流程时节省了大量时间和精力。要开始录制，您需要访问\
  \ **设计 (1)** 面板并单击 **录制 (2)**，这将显示所有可用的录制选项 (3)，如图 10.16 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_312_0.png)\n\
  \nFigure 10.16 – 不同的录制选项\n\n共有六种录制类型：**基本**、**桌面**、**Web**、**图像**、**原生 Citrix**\
  \ 和 **计算机视觉**。但是，我们将仅探索前三种类型（基本、桌面和 Web），因为这些是最常用的选项，并且与 RPA Associate 认证更相关。\n\n\
  ### 基本\n\n**基本** 为每个活动生成 **完整选择器**，但不为活动创建容器。这更适合在容器中创建 *线性序列*，可用于录制 Web 应用程序和桌面应用程序，但它是所有录制器中\
  \ *最慢* 的。\n\n让我们使用上一节中用于在 Packtpub 网页上读取和写入数据的相同示例，但这次使用 **基本** 录制：\n\n- 1. 创建一个新序列并将其命名为\
  \ `Recordings`。\n- 2. 单击 **录制 (1)**，然后单击 **基本 (2)**，如图 10.17 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_313_0.png)\n\
  \nFigure 10.17 – 启动基本录制\n\n- 3. 将显示 **基本录制** 面板，其中包含不同选项，您可以执行以下操作，如图 10.18 所示。\n\
  \n- 4. 使用 **记录** 选项 (1) 记录一系列操作或事件（例如启动应用程序、单击菜单、在字段中输入文本）。为此，您需要单击 **记录** 按钮并执行所有所需操作，在操作完成后按\
  \ *Esc* 键停止录制。使用不同的录制工具 (2) 执行逐步录制（例如使用 **启动应用** 启动应用程序、使用 **单击** 单击菜单、使用 **输入**\
  \ 在文本字段中输入文本），或者您可以同时使用选项 1 和 2 的组合。在完成所有操作后，按 *Esc* 键停止录制。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_313_1.png)\n\
  \nFigure 10.18 – 启动基本录制\n\n- 5. 单击上一屏幕上的 **记录** 按钮，以记录 `https://www.packtpub.com/`\
  \ 的 **订阅** 页面中 **账户详细信息** 部分的元素，元素顺序编号如 **图 10.19** 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_314_0.png)\n\
  \nFigure 10.19 – Packtpub 账户详细信息部分\n\n- 6. 按键盘上的 *Esc* 键或右键单击鼠标以停止录制，录制完成后，您将看到以下内容，其中可以看到保存录制或使用各种录制选项开始新录制的选项：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_314_1.png)\n\nFigure 10.20 – 基本录制工具\n\
  \n- 7. 单击 **保存并退出** 按钮，将录制的活动保存到工作流并退出 **基本录制**：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_315_0.png)\n\
  \nFigure 10.21 – 基本录制保存并退出\n\n- 8. 验证录制是否生成了用户名和密码，如图 10.22 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_315_1.png)\n\
  \nFigure 10.22 – 用户名和密码的工作流验证\n\n- 9. 验证是否记录了 **名**、**姓** 和 **继续** 按钮，如图 10.23 所示：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_316_0.png)\n\nFigure 10.23 – 工作流验证，其他记录的字段\n\
  \n- 10. 单击 **选项** 菜单 (1)，然后从某个活动中单击 **编辑选择器** (2)，如图 10.24 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_317_0.png)\n\
  \nFigure 10.24 – 编辑选择器菜单选项\n\n- 11. 验证编辑选择器部分，以确保选择器的完整 HTML 片段显示且可编辑。另外，验证显示的浏览器详细信息；这就是我们称基本录制为完整选择器的原因，如图\
  \ 10.25 所示。请注意，在部分选择器中，HTML 片段部分不可编辑。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_317_1.png)\n\
  \nFigure 10.25 – 编辑选择器 – 完整选择器\n\n- 12. 请注意，尽管它是从 Web 应用程序录制的，但基本序列中未录制任何容器（如 Open\
  \ Browser 或 Attach Browser），如图 10.22 所示。\n\n现在，让我们探索另一个基本录制示例，其中机器人将文本 UiPath 输入到记事本中。为此，请执行以下步骤生成\
  \ **基本** 序列，如图 10.26 所示：\n\n- 1. 启动记事本。\n- 2. 单击 UiPath Studio 中的 **基本录制** 选项。\n\
  - 3. 在录制期间，单击基本录制工具 (2) 中的 **输入** 选项，如图 10.18 所示，并将光标导航到记事本。\n- 4. 在记事本中键入 UiPath。\n\
  - 5. 按 *Esc* 键停止录制。\n- 6. 单击 **保存并退出** 按钮。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_318_0.png)\n\
  \nFigure 10.26 – 将文本输入记事本应用程序（基本录制）\n\n- 7. 单击 **选项** 菜单 (1)，然后从某个活动中单击 **编辑选择器**\
  \ (2)，如图 10.27 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_319_0.png)\n\nFigure\
  \ 10.27 – 编辑选择器\n\n- 8. 验证 **输入** 活动的 **编辑选择器** 框，以确保生成的 HTML 代码遵循 **完整选择器** 的结构，这意味着\
  \ HTML 标记中的每个属性均可编辑，如 *图 10.28* 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_319_1.png)\n\
  \nFigure 10.28 – 完整选择器的选择器编辑器视图（输入到记事本）\n\n\n\n\n\n无论是桌面应用程序还是 Web 应用程序，基础录制都会生成完整选择器，这意味着不会生成单独的容器，例如\
  \ **Attach Browser** 或 **Attach Window**。因此，这种录制是 _最慢_ 的，最适合容器内的单个活动或线性工作流。\n\n\
  ## 桌面\n\n**桌面** 为每个活动生成一个 **部分选择器**，并为活动创建容器。这更适合于自动化桌面应用程序。这比基础录制 _更快_。让我们看一个自动将文本输入到记事本应用程序的示例：\n\
  \n- 1. 创建一个新序列并将其命名为 `Desktop Recording`。\n\n- 2. 单击 **录制** 按钮 (1)，然后单击 **桌面** (2)，如\
  \ *图 10.29* 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_320_0.png)\n\n图 10.29\
  \ – 启动桌面录制\n\n- 3. **桌面录制** 面板显示多个录制选项，如 *图 10.30* 所示。请参阅 *基础录制的步骤 3* 以了解更多关于录制功能的信息：\n\
  \n![](img/84b06ad2832c53c5f677f8ce4c80f184_320_1.png)\n\n图 10.30 – 桌面录制工具\n\n- 4.\
  \ 启动新的记事本应用程序并单击 **记录** 按钮。然后，键入 `UiPath` (1)，单击 **格式** 选项卡 (2)，将字体大小更改为 55 (3)，最后，单击\
  \ **确定** (4)，如 *图 10.31* 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_321_0.png)\n\
  \n图 10.31 – 录制期间的记事本\n\n- 5. 录制完成后，按键盘上的 Esc 按钮以查找保存录制或开始新录制的选项，如图 10.32 所示：\n\n\
  ![](img/84b06ad2832c53c5f677f8ce4c80f184_321_1.png)\n\n图 10.32 – 桌面录制工具\n\n- 6.\
  \ 单击 **保存并退出** 按钮以将录制的活动保存到工作流，如图 10.33 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_321_2.png)\n\
  \n图 10.33 – 保存活动\n\n- 7. 验证是否记录了记事本条目，如图 10.34 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_322_0.png)\n\
  \n图 10.34 – 记录的活动验证\n\n- 8. 验证是否记录了字体更改，如图 10.35 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_323_0.png)\n\
  \n图 10.35 – 记录的活动验证（续）\n\n- 9. 单击 **选项** 菜单 (1)，然后从活动中单击 **编辑选择器** (2)，如 **图 10.36**\
  \ 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_324_0.png)\n\n图 10.36 – 编辑选择器\n\
  \n- 10. 验证 **编辑选择器** 部分，以确保显示了选择器的 HTML 片段，且部分 HTML 不可编辑，在 **编辑选择器** 部分的第一行显示为灰色。这就是我们称桌面录制为部分选择器的原因，如\
  \ **图 10.37** 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_324_1.png)\n\n图 10.37\
  \ – 编辑选择器\n\n- 11. 验证录制的活动具有容器，例如 Attach Window 或 Use Application，以确保桌面录制支持容器，如图\
  \ 10.38 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_325_0.png)\n\n图 10.38 –\
  \ 容器验证\n\n我们已经了解如何使用桌面录制来记录桌面应用程序，并体验了记录每个事件是多么快速和简单。\n\n## Web\n\nWeb 为每个活动生成一个部分选择器，并为活动创建容器。这更适合于自动化\
  \ Web 应用程序，并且比基础录制更快。\n\n让我们看看如何使用 Web 自动将文本输入到记事本应用程序的示例：\n\n- 1. 创建一个新序列并将其命名为\
  \ web_Recording。\n\n- 2. 单击 **录制** 按钮 (1)，然后单击 **Web** (2)，如图 10.39 所示：\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_326_0.png)\n\
  \n图 10.39 – 启动 Web 录制\n\n- 3. **Web 录制** 面板显示多个选项，如图 10.40 所示。这与前一部分的基础录制类似，不同之处在于\
  \ Web 录制具有 **打开浏览器** 选项，而不是基础录制中的 **打开应用程序**。\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_326_1.png)\n\
  \n图 10.40 – Web 录制工具\n\n- 4. 单击前一张截图中显示的 **记录**，以记录 https://www.packtpub.com/ 的订阅页面中的\
  \ **账户详细信息** 部分，并按图 10.41 中编号的顺序捕获元素：\n\n1. 账户详细信息\n\n![](img/84b06ad2832c53c5f677f8ce4c80f184_327_0.png)\n\
  \n图 10.41 – 录制期间的 Packtpub 账户详细信息\n\n- 5. 在录制过程中键入密码时，会显示一个弹出框，如图 10.42 所示，您需要执行以下操作：\n\
