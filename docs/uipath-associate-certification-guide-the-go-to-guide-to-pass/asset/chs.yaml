  \ 显示队列中没有新事务项目\n\n如果流程决策活动条件为 TRUE，您可以继续从事务项目中检索客户详细信息和发票详情。因此，让我们构建从事务项目中检索发票详细信息的流程。\n\
  \n### 从事务项目中检索数据\n\n在本节中，您将从已从队列中读取的事务项目中提取 **客户详细信息** 和 **发票详情**：\n\n- 1. 拖放一个序列活动，并将其连接到流程决策活动的\
