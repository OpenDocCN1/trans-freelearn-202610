  \n图 2.18 – 大纲面板\n\n本节介绍了在自动化过程中经常会遇到的 UiPath Studio 的所有关键用户界面组件。这将帮助您更好地理解 UiPath\
  \ Studio，并在即将到来的章节中创建自动化项目。\n\n### 摘要\n\n本章介绍了 UiPath Enterprise 平台及其组件。作为介绍的一部分，本章详细描述了\
