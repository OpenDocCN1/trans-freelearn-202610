- pgno: 72
  md: 'when they stop challenging themselves. If you remember back to when you were
    first learning development, it seemed like your knowledge was skyrocketing each
    day.


    The reason for this was because each of the concepts you were learning were completely
    new to you. However, after a certain period of time it seems like it''s natural
    for us to want to become comfortable. Instead of trying to learn something new
    each day, we simply try to duplicate the work that we''ve done up to a certain
    point.


    This approach is less taxing mentally. However, it has the nasty side effect of
    limiting how we improve. Whenever I feel like I''m getting into a rut, I will
    look at popular websites and I''ll start to put together a list of features that
    I want to learn how to build. From that point, I can put a plan together for what
    concepts I need to learn in order to implement them.


    # Frustration = skill


    One of my favorite illustrations of getting past skill plateaus was made by the
    calligrapher, Jamin Brown:'
