- pgno: 85
  md: '# Chapter 13. Slowing Down to Learn How to Code Faster


    Nowadays, it seems like everyone wants to do things faster. We want to pay without
    taking out a credit card or cash. Social media lets us share images and videos
    from our lives in a split second. And we get frustrated if Netflix takes more
    than 3 seconds to start streaming our latest TV show series binge. However, if
    you want to learn how to code faster, I''m going to present an odd idea: go slower.


    This may seem like a counterintuitive concept. After all, don''t coding bootcamps,
    even DevCamp where I teach, tell you how you can learn how to code in a few months?
    Well yes, and research shows that 8 weeks is a powerful number when it comes to
    learning. The Navy Seal training program specifically chose 8 weeks as its timeframe
    for conditioning candidates. And if you search the web for the phrase 8 Week Training
    programs, you''ll find courses ranging from running 10ks to speaking Spanish fluently.


    So yes, I''m huge believer that individuals can learn an incredible amount of
    information in a short period of time. But what I''m talking about here is becoming
    more deliberate when it comes to learning new information.


    # Learn how to code faster


    If you''re like me, when you learn a new topic the first thing you''ll do is either
    move onto the next topic or repeat the concept as quickly as humanly possible.
    For example, when I learn a new Ruby or Scala programming method I''ll usually
    jump right into using it in as many different situations as possible. However,
    I''ve discovered that this may not be the best approach because it''s very short-sighted.


    # Our default mind


    When it comes to learning how to code, one of the most challenging'
  merge: -1
  img_proc: true
- pgno: 86
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 87
  md: 'rushing through it. When it comes to working with our long-term memory, this
    approach is more effective than simply flying through a concept because it forces
    our minds to think through each keystroke.


    # Bend it like Beethoven


    I didn''t learn this technique from another developer. Instead, I heard about
    how one of the most successful classical music institutions in the world, the
    Meadowmount School of Music in New York, taught students new music compositions.
    As a game, the school gives out portions of the sheet music. So, where most schools
    will give each student the full song, Meadowmount splits the music up into pieces.


    From there, it hands each student a single piece for them to focus on. From that
    point, the student will only learn to place that single piece of music. They will
    start out very slowly. They won''t rush through notes because they don''t even
    know how they fit into the song. This approach teaches them how to concentrate
    on learning a new song one note at a time.


    From that point, the students trade note cards and then focus on learning another
    piece of the song. They continue with trading cards until each student has been
    able to work through the entire set of cards.


    By forcing the students to break a song into pieces they no longer will have any
    weak points in a song. Instead, the students will have focused on the notes themselves.
    From this point, it''s trivial for all the students in the class to combine their
    knowledge and learn how to play the song all the way through.


    # From classical music to coding


    So, can this approach help you learn how to code faster? I think so. The research
    shows that by slowing down and breaking concepts into small pieces, it''s easier
    for students to transfer information from the short-term to long-term memory.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# A practical system


    So, the next time you are learning a coding concept, take a step back. Instead
