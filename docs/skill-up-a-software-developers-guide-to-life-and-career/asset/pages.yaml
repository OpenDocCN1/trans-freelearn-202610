  md: '# Chapter 35. Top Freelance Bookkeeping Options for Developers


    In this chapter, I''m going to review the top freelance bookkeeping options. Keeping
    track of finances is probably one of my least favorite parts of being a freelancer.
    To properly manage a freelance business, you have to manage a wide range of accounting
    components:


    +   - Profit and loss reports to capture your overall profitability

    +   - Aging reports to see how long it takes to get paid

    +   - Expense logging to ensure you capture all potential deductions

    +   - Accounts receivable system so that you can get paid

    +   - Project tracking tools if you''re working on large-scale projects for clients


    # Freelance bookkeeping options


    I''ve used a number of bookkeeping solutions over the years, and the following
    are some of the ones that I''ve had the best experience with.


    # FreshBooks


    FreshBooks is the system that I use for my freelance business. As far as accounting
    software goes, it covers 100% of the requirements I have:'
