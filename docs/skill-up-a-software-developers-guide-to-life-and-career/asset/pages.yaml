  md: '# Summary


    In summary, when it comes to organically growing a freelance business I focus
    on three approaches. First, once you have happy clients, work on getting them
    to refer you to their friends and colleagues. Next, make sure that you''re constantly
    blogging and positioning yourself as an expert in your space. And lastly, find
