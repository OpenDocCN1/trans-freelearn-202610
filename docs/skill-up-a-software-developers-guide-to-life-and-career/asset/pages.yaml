  md: '# Chapter 55. Best Practices Versus Creativity as a Developer


    In this chapter, I''m going to discuss how you can find the balance of best practices
    versus creativity as a developer.


    To be honest, this was initially a difficult chapter to write, mainly because
    I had a hard time organizing my thoughts on the topic since it''s a little abstract.
    I had the high-level concept of the strained relationship between best practices
    vs creativity as a developer, in the sense that many developers, especially the
    ones new to coding who will fall into two camps:


    +   - Those attempting to follow standardized conventions in every way, essentially
    duplicating code from tutorials and a language or framework''s documentation page.

    +   - Those ignoring all common practices and building applications in whatever
    way that makes the most sense to them (at the time).


    There are pros and cons with both approaches, and like many other topics, a cross
    between the two is going to result in the best strategy. Let''s look at the pros
    and cons of following best practices and ignoring the idea of being creative.


    Pros:


    +   - Application code will be easier for future developers to pick up and add
    features to since they''ll know how the code is structured and where all of the
    methods and classes are located.

    +   - Programs should be well-tested via unit and integration tests.


    Cons:


    +   - Code structure may have more of a cookie-cutter approach.

    +   - Code may suffer from the square peg/round hole syndrome.


    Before I go on, please don''t misunderstand me by thinking that I''m saying'
  merge: -1
