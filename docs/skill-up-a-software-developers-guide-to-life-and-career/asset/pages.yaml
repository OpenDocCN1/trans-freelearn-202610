  md: '# Getting new clients as a freelancer


    Since I''m a little bit on the stubborn side it took me a while to admit it, but
    I finally came to terms with the fact that I wasn''t getting new clients as a
    freelancer, especially with the methods that I''d been trying up to that time.
    So, I put a plan into action that involved hiring some freelancers of my own.
    I assembled a team that helped fill in my weak areas.


    To start getting new clients as a freelancer, I knew I had to have clearly written
    proposals that described my services. And I also knew that the proposals would
    have to be sent out 24/7.


    # Proposal material


    With that in mind I researched sales copy writers on Upwork and hired a talented
    marketer who created three different proposals that I could use.


    This included sales copy that advertised my experience, portfolio, and expertise
    as a developer. I had three versions created because I wanted each one to be targeted
    to a specific type of project. For example, one of the proposals focused on enterprise
    projects. Another proposal was targeted at building APIs, while the third had
    content geared toward startups.


    # Sending out constant proposals


    With a full set of professional proposals, I was ready to implement the second
    step of my plan: consistently sending out proposals. For this, I hired a detail-oriented
    and fluent virtual assistant from the Philippines named Sy.


    I could hire Sy for $6.50 an hour and he paid for himself in the first week! I
    walked him through the proposals and described the types of projects that I wanted
    to get hired for.'
