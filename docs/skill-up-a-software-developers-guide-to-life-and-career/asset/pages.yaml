  md: 'that developers who follow best practices have these issues. I''m simply referring
    to developers who throw creativity out the door and simply try to build programs
    using standardized methods and attempt to copy code that they see from other developers.


    Now let''s take a look at the pros and cons of developers who only embrace creativity:


    # Pros:


    +   - They have fun, this is very important since it keeps them motivated to build
    interesting projects. They''re also able to express their unique perspectives
    on how applications should be structured.

    +   - They''re constantly trying new things and finding new ways to build features.
    This can result in learning quite a bit about the language or framework that they''re
    using.


    # Cons:


    +   - Programs that only rely on the developer''s creativity can be nearly impossible
    to manage later. Even the developer who built the application may have a hard
