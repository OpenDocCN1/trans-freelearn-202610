  md: '# Chapter 43. How to Create Accurate Freelance Bids?


    Being able to give good estimates is one of the most critical tasks you can do
    as a freelancer. If you quote too low, you''ll end up with an angry customer because
    even if you did great work, he''s having to pay more than he budgeted. And if
    you bid too high, there''s a good chance you won''t get the job and the potential
    client will go to a competitor who gave a lower bid.


    Over the years, I''ve been guilty of erring on both sides of the spectrum and
    I''ve had to deal with the consequences. Those consequences were not fun, which
    is why I''ve put together a formula for you in this chapter that I follow for
    building bids:


    +   1. Get a detailed drill down of the project requirements. Without this you
    won''t be able to create an accurate bid no matter what else you do. Imagine if
    an architect had to give an estimate to a client who said, "I want a nice house
    with a cool fence." He wouldn''t be able to accurately estimate how much the house
    would cost to build. An architect will get a detailed breakdown of square footage,
    number of bedrooms, along with a list of all the bells and whistles. In the same
    way, you need a detailed breakdown of every feature that the application needs
    to have.

    +   2. After you have the list of features, break them into categories, such as:
    database setup, frontend design, user permission configurations, and so on. And
    then put each of the features into one of the category buckets.

    +   3. Put all the data into a spreadsheet segmented by the categories you created
    in step two.

    +   4. Give a conservative estimate on each feature in the spreadsheet.

    +   5. Have the spreadsheet tally up the total hours or cost and that is the project
    estimate.


    Does this formula seem like common sense? Good, because creating accurate freelance
    bids should be a simple process!'
  merge: -1
  img_proc: true
