- pgno: 334
  md: '# Good answers to your greatest weakness


    Now let''s see some great answers to the question about what is your great weakness
    when you''re in that interview:


    +   - *Can be slow to take action:* This is an interesting answer because it could
    be a bad answer if you leave it at this since it might tell the interviewer that
    you are timid, which would be a poor character trait. However, if you follow it
    up by saying that you are very detailed and that before you start a task you want
    to have a clear strategy for how to move forward, that is an employee I want to
    have on my team!

    +   - *Can be overly critical on myself:* This will tell the interviewer that
    you care about your work and that doing it well is very important to you. Make
    sure to follow up with how you''re working on yourself so that you still are working
    on being a craftsman at your work but to not get on yourself for irrelevant reasons.

    +   - *Can be quiet:* This is one of my favorite things to hear, assuming that
    the individual follows it up by saying that they can be quiet because he or she
    thinks that it''s important to listen to all of the details of a project or challenge
    before giving an answer. This tells me that the individual is going to be detail
    oriented and won''t miss key items because they were too busy thinking what they
    were going to say next.


    I hope that these strategies help you answer the question of: What''s your greatest
    weakness? And good luck with the interview!'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Chapter 65. Enterprise Software Job Strategy and Guide


    If you''re a developer and have worked with startups or freelance clients, you''ll
    find that the world of enterprise software jobs is quite different, in both good
    and challenging ways.


    Some of the pros to working in the **enterprise software industry** is that large
    organizations typically are stable, have systems in place for development, and
    allow you to specialize on a specific piece of functionality instead of having
    to cover the full range of software features.


    Some of the challenges that are unique to enterprise development are that there
    is typically quite a bit of red tape for developers. If you''re used to being
    able to grab any code library and stick it in your application you''ll find that
    enterprises are pretty picky about what outside libraries you bring in. For example,
    I was just talking with a enterprise software developer a few days ago who expressed
    how frustrating it was that it took two months for his company to give him permission
    to use the jQuery library, which is one of the most commonly used user interface
    libraries in the application space.


    So what types of questions should be prepared for when applying for an enterprise
    software job?


    +   - Questions about how well you work with **formal processes**.

    +     Depending on the company''s level of formality you''ll most likely need
    to explain how you have worked with different project management processes such
    as Scrum, Extreme Programming, and processes such as that.

    +   - At large enterprises software bugs can cause millions of dollars in damages,
    so the **testing systems** are typically quite thorough. With that in mind, make
    sure that you are prepared to answer questions related to unit testing and behavior-driven
    development.

    +   - Considering that we''re living in a **Microsoft-based enterprise world**,
    having a solid knowledge of how well you understand ways to integrate with Windows
    servers, Active Directory, and tools such as'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'SharePoint will be very important. I''ve personally been asked how I would
    integrate Active Directory **single sign on (SSO)** into a Ruby on Rails application,
    along with how to run Rails on a Windows server during various interviews. And
    if you know the Rails development system you''ll know that these are not standard
    requirements at all.


    +   - As with most development positions, you''ll also need to have a solid understanding
    of the **technical skills** of the position. This usually includes being able
    to give accurate answers to questions related to object-oriented principles and
    a walkthrough of popular algorithms.


    The technical portion of interviews will most likely be specific to the job. For
    example, if you''re applying for a frontend enterprise software job they probably
    won''t ask you about Quicksort, but they will ask you about how to properly manage
    JavaScript callbacks.


    # Summary


    Hopefully, these four areas of questions will help you prepare and feel confident
    about applying for an enterprise software job, and good luck with the interview!'
  merge: -1
  img_proc: true
