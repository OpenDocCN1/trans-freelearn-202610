  md: '# Chapter 45. Should I Learn to Code? – A Balanced Perspective on Programming


    To start off this part of the book that covers all about what it takes to have
    a successful career as a developer, I''m going to talk about the question: should
    I learn to code?


    This question was sparked by the controversial post on TechCrunch by Basel Farag
    (https://techcrunch.com/2016/05/10/please-dont-learn-to-code/), where he urges
    people to not learn coding. As the founder of Rails bootcamp you may think that
    my reaction would be to spout off a full list of all the reasons why everyone
    should learn how to code, because that''s good for business, right?


    However, I went through his post in detail and I also reviewed a slew of response
    posts that called for Basel''s head, denouncing him as a modern-day heretic.


    # Should I learn to code? – a balanced look at both sides


    After going through all the content around Basel Farag''s argument, my belief
    is that both sides of the argument have valid points that should be considered
    by anyone deciding whether to learn to code or not!


    Let''s first explore the idea that *not everyone* should learn to program. Farag
    proposes that coding is hard, which it is, and therefore, the dream that you can
    take a few online tutorials and become a professional developer is a lie... and
    he''s 100% right about that. Development, especially for true production applications,
    is very hard and takes years of study to become truly proficient. It''s not enough
    to simply learn how to build an application that lets users create records in
    a database from a'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'form, for example. A professional developer needs to have expertise in:


    +   - Managing dependencies between code libraries

    +   - Working with object-oriented programming best practices

    +   - Having clean code

    +   - Implementing automated testing for continuous development

    +   - Knowing how to transition seamlessly between various frameworks


    And the list goes on and on…


    In fact, even though I''m a professional developer and have worked for clients
    as big as Eventbrite and Chevron, I spend several hours a day going through development
    books and online guides to simply keep up with all of the new coding techniques
    and systems that are continually emerging.


    So, all that is to say that Basel Farag is right in that if you want to become
    a professional developer, you have a challenging road ahead of you. Of course,
    if you make it through, you will have gained a tremendous skill and you could
    well find yourself in demand by a number of industries.


    Let''s now explore the opposite side of the argument, that everyone should learn
    how to code. I really appreciate the VentureBeat article by Edward Chiu (https://venturebeat.com/2016/05/22/how-coding-kick-started-my-sales-career/),
    where he describes how he went through a coding bootcamp and he did not become
    a professional developer… but that he did get a great job as a sales engineer
    that he never would have gotten if he wouldn''t have learned coding!


    This is the side of the argument that is ignored all too often, because learning
    to code does not mean that you have to become a professional developer, but it
    will give you a new skill set that can be used across many different jobs. Steve
    Jobs said it best when he said:


    > > "I think everybody in this country should learn how to program a computer
    because it teaches you how to think."


    To me, Jobs hit the nail on the head here: learning how to code is not'
  merge: -1
