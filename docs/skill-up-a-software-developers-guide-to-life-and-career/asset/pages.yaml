    +   - Even though programs built ignoring best practices and relying solely on
    the developer''s creativity are fun to build at first, as the codebase grows the
    level of fun decreases exponentially. In fact, it''s common for new developers
    to kill an entire project and have to start from scratch because the codebase
    became such a mess following a non-standardized approach.


    So, if there are pros and cons to both approaches, which is the best way to go?
    I am a self-taught developer, and originally, I definitely fell into the second
    camp of building apps simply using creativity.


    However, I ended up building some horrible applications, I did learn a lot about
    various languages through the process, so it was a beneficial strategy from a
    learning perspective. Over the years, since I matured as a developer, I realized
    that I had to find a balance between following standardized best practices and
    being able to add my own creative touches into a program.'
