  md: '# Chapter 50. Developer Soft Skills – Learning How to Gain an Edge in the Marketplace


    I''ve talked quite a bit in this book about improving as a developer. Most of
    the time I focus on how you can learn new technical skills, such as becoming more
    proficient in a programming language or framework.


    However, if you limit your knowledge to technical talent you will be decreasing
    your chances for success in the marketplace. In this chapter, I''m going to walk
    through five key developer soft skills that you can utilize to become a well-rounded
    coder.


    # Developer soft skills


    The list of developer soft skills I''m about to present you is by no means comprehensive.
    But what it does offer you is a representation of the soft skills that I''ve personally
    used and had success with.


    From being the IT Director of a national energy company in my late 20s to the
    CTO of a coding bootcamp with locations around the world, I''ve seen these skills
    help me at every level of my career. And as you''ll notice, they have very little
    to do with actual technical ability.


    As a caveat, I do not mean for this list to overshadow skills such as practicing
    clean coding habits or focusing on improving as a developer. Instead these skills
    should complement your engineering talent.


    # Writing


    First on the list is the ability to write. In the book *Rework*, by *Jason Fried
    and David Hansson*, who are also the founders of Basecamp and the Ruby on Rails
    framework, wrote that one of the skills they look for in job candidates is their
    ability to write. This includes positions that you would'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'think writing skill would be pointless, such as developers and system administrators.


    Obviously, a developer needs to be able to be skilled as a coder.

    However, the book explains that if a developer can write, it is a sign that he
    or she is a good communicator. Writing skill doesn''t mean that each memo you
    write has to sound like a riveting novel. Instead it means that:


    +   - You can organize your thoughts properly

    +   - You can communicate what you want to say so that others can understand


    # Conversation


    Next on the list of developer soft skills is the ability to converse well with
    others. Now if you''re like me, this is by far the most challenging skill on this
    list. If I had my way I''d stay behind my desk building applications all day and
    never interact with another human. It''s simply the way I was wired, and I know
    I''m not alone in that desire.


    However, conversational skills are an absolute requirement when it comes to advancing
    in your career. Whether you are a freelance developer looking for new clients
    or a software engineer looking to get promoted, you''ll discover that the top
    prerequisite to your success is not technical skill, it''s likability.


    If someone likes you they are going to want to give you a chance to succeed. And
    one of the most straightforward ways to get people to like you is by becoming
    a good conversationalist.


    # Conversation tips


    Thankfully, I''ve discovered that the system for having great conversations is
    pretty straightforward. Here are some tips that I''ve used to improve at this
    skill:


    +   - *Think back through your life and come up with some entertaining stories
    about yourself.* People love stories, especially if they are funny. And I''ve
    discovered that telling a few well-timed stories has'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'been able to get me in the good graces with CEOs and executives over the years.


    +   - *Make the focus of conversation be on the other person.* People love talking
    about themselves, so by simply asking insightful questions you will be considered
    a great conversationalist... even though you let the other person do all the talking!
    Like your stories, come up with a list of questions that you can recall at a moment''s
    notice.


    +   - *Do not complain.* I have yet to find the person that likes to converse
    with someone who constantly complains. With that being said, countless people
    seem to enjoy bringing up every negative thing that has happened in their lives
    when they meet someone. The good thing about this is that if you can have a conversation
    without complaining you will stand out as being an upbeat and likable person.


    # Management


    Moving down the list of developer soft skills, the next item is management. Now
    if you''re an entry-level developer, don''t tune out. Management doesn''t have
    to mean managing people or projects.


    When I say management, I''m referring to how you attack each task you''re given.
    For example, if you are handed a new feature to build, do you jump right in and
    start coding? Or are you more organized with your approach? If a client or managers
    see that you take a systematic approach to every task you''re given they are going
    to feel more confident giving you more responsibility.


    To improve this skill, I recommend you read up on project management books or
    take an online course on the topic. The few days that you''ll spend learning about
    management practices will help serve you well the rest of your career.


    # Design


    Next on the list is design. In Scott Adams''s (the creator of Dilbert) book *How
    to Fail at Almost Everything and Still Win Big*, Adams describes how knowing the
    basic fundamentals of design should be required knowledge'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'for all engineers.


    I can''t tell you how many times I''ve heard a developer say something like *"design
    really isn''t my thing"*. It''s fine if your top skill isn''t design. However,
    learning the basics of what qualifies as a well-crafted design takes such little
    work that anyone who doesn''t learn about it is simply being lazy.


    As a developer, if you haven''t researched what it takes to create a good design,
    you are going to be quickly bypassed by others who read a single book on the topic.
    There have been multiple times early on in my career where I neglected design
    and it cost me dearly.


    I remember one time where I spent weeks building an incredibly complex feature
    to only have management spend the entire meeting talk about how much they hated
    the design, while completely ignoring the actual functionality. If I would have
    spent a few hours to design the look and feel of the product the meeting and project
    would have had a more favorable result.


    # ## Public speaking


    Last on the list of developer soft skills is public speaking. This may seem like
    a useless skill for a software developer. However, let me give you two scenarios
    to think about:


    +   - In scenario 1 there is a brilliant developer with poor public speaking skills.
    When asked to present a project that he built, an incredibly well-built project
    I may add, the developer talks in a monotone voice during the whole presentation
    and the product demo is filled with him simply moving from one page to another.

    +   - In scenario 2 there is another great developer. But this engineer has worked
    on his public speaking skills and gives a well-organized demo. His time in front
    of the room is filled with clear language, amusing anecdotes, and analogies for
    each feature to make the project understandable for everyone in the room.


    If you were in the room, which one of the projects would seem more appealing?
    It doesn''t take a MBA to know that the developer in scenario'
  merge: -1
