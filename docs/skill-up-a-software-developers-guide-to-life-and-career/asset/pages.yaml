- pgno: 254
  md: '# # Chapter 48. How to Choose a Developer Specialty?


    Through many years of training developers, I''ve discovered that it''s vital for
    coders to decide about their specialty and focus. In this chapter, I''ll share
    with you how I personally view the different developer directions and areas of
    expertise that are available.


    You''ll quite possibly make this choice more than once in your career as a developer,
    so I recommend that you always observe and be aware of the choices that can be
    made in your career.


    # ## How to choose a developer specialty?


    The world of software development is so vast that it''s impossible for someone
    to master every aspect of the process. Consider if I approached a world-class
    track and field coach and said that I wanted to train for the Olympics and win
    a gold medal in track and field. The coach would most likely give me a once over
    and chuckle to himself. But after that his first question would be: *“What event
    do you want to train in?”* He would ask this question because the training regime
    for the 100-yard dash is dramatically different from the high jump.


    In the same way, as a developer, you need at least once, and quite possibly several
    times, to narrow your focus on what type of developer you want to be in the years
    ahead.


    I''m going to walk you through each type of developer category so you can see
    what they entail.


    # ### #1 – the full stack developer


    In deciding how to choose a developer specialty I always like to start off'
  merge: -1
  img_proc: true
- pgno: 255
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 256
  md: 'Additionally, server-side developers typically spend quite a bit of time building
    APIs. This is because most server-based applications need to communicate with
    the outside world in some form or another. This layer of the development stack
    will require you to specialize in a language, such as Ruby, Python, Java, or C++.


    # #3 – the frontend developer


    When it comes to choosing a developer specialty, the third layer to choose from
    is the frontend component. Not too long ago a frontend developer was considered
    someone who spent all day working with HTML and CSS. Their main goal was to make
    applications look *pretty*.


    However, the definition of a frontend developer has changed dramatically with
    the advent of client-side frameworks. These frameworks, such as Angular and React,
    have made it possible for frontend programmers to build complete apps with little
    server-side interaction.


    These applications are rendered completely in the browser because they''re written
    in JavaScript. And whenever the app needs to get additional data it simply communicates
    with APIs. A common pattern that I work with is building a number of server-side
    Ruby applications and then having a single Angular frontend app that renders the
    user interface in the browser.


    So, if you love building applications that users will directly interact with and
    the idea of working with APIs doesn''t scare you off, frontend development might
    be the right choice for you.


    # #4 – the mobile developer


    Next on the list of developer types is mobile. If the idea of building the next
    Angry Birds or Instagram excites you, the mobile development field may be a good
    fit.


    Mobile programming used to be a very difficult field to enter. Only a few years
    ago you would have had to master multiple languages (Objective C and Java) to
    build smartphone apps. However, JavaScript frameworks'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'such as Ionic and React Native have made it possible to use JavaScript to build
    apps that behave like native smartphone applications.


    You can still use languages such as Swift, Objective C, and Java to build truly
    native applications. And there will always be a great set of jobs for developers
    who specialize in these languages. However, if you are a freelance or full stack
    developer, by leveraging a JavaScript framework you can build smartphone and tablet-based
    apps for all platforms.


    And it''s been my experience that the learning curve for these JavaScript frameworks
    is quite a bit lower than the traditional mobile languages. Additionally, you
    may have noticed that the tools used for JavaScript-based mobile apps and frontend
    programming are similar. Because of this synergy, I have had a number of developer
    friends who have moved away from server-side development and moved into frontend
    coding because it allows them to tackle building applications for desktops, tablets,
    and phones.


    # #5 – the data scientist


    This used to be considered the data field, and a few years ago I''d have called
    this something like the data developer category. However, data and big data have
    rapidly morphed into the fields of statistic data analysis and using artificial
    intelligence, such as neural networks, to gain insight into the huge amount of
    information now available.


    These new fields are changing the face of how we process data and understand information,
    and it''s a huge new career field for developers to explore. Right now, the mathematics
    involved can be quite intimidating, so you''ll need to decide if you''re ready
    for some heavy math and deep algorithmic learning. The math is going to become
    more abstracted over time, and if you''re drawn to the idea of artificial intelligence
    and deep algorithmic learning systems, this is certain an area to consider for
    an ambitious developer today. Some of the most modern Python libraries provide
    an excellent way for a developer to immerse themselves into this field.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Making the decision


    If you are new to development, don''t feel pressured to pick out a specialty immediately.
    Instead, my recommendation is to explore each type of development layer until
    you find a focus that you truly love.


    In this chapter, I''ve provided a very high-level view of the developer types.
    However, in reality, you will need to become even more specific with your development
    focus.


    For example, if you''re a server-side developer, you may want to focus on building
    eCommerce applications or implementing accounting systems. If you are an aspiring
    frontend developer, you may want to become a world-class security specialist.


    A key insight that I''ve discovered helps quite a few people, especially newer
    programmers, is to look at developer job boards. Job boards are great for listing
    out the specialties that companies are hiring for. And by going through a list
    of potential job descriptions it may help you figure out what you want to focus
    on next in your career.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Chapter 49. How to Choose Your Next Programming Language?


    We have discussed the importance of picking a development specialty, such as frontend,
    server side, or mobile. However, simply choosing a specialty is not enough. You
    also need to decide on what programming language you want to focus on for the
    initial, or next, stage of your career.


    No book or guide can tell you what language you should learn next, of course.
    That''s a decision that can be made only by your. So, in this chapter my goal
    is to help you decide how to pick a programming language based on your current
    objectives.


    # How to pick a programming language?


    If you went through the exercise for picking your developer specialty, you will
    notice a similar pattern for deciding on a programming language. A quick perusal
    of Wikipedia will reveal that there are literally hundreds of programming languages
    to choose from. If you take the approach of looking at each language one at a
    time, you might be able to make an informed decision sometime in the next hundred
    or so years!


    Since iteratively going through the full list of languages isn''t practical, I
    recommend two processes for helping you decide how to pick a programming language.


    # The next job you want


    First on the list is basing your programming language choice on the job you want.
    If you''ve heard the phrase "dress for the job you want", it also applies to development.


    For example, if you want to work for Microsoft or with Microsoft-based'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'products it wouldn''t make sense for you to spends years learning Python and
    Django. Instead, you will want to focus on learning the .NET development stack
    and languages such as *C#*.


    This strategy can be smart in certain cases, such as with Microsoft, since there
    are countless .NET framework positions available on the job market. This means
    that even if you can''t get hired on with Microsoft, you can still get a job for
    an organization that utilizes the .NET stack.


    However, this approach doesn''t work quite as well for more specialized languages
    and companies. For example, imagine that you spend years learning Facebook''s
    flavor of PHP, codenamed HipHop. If you fail to get a job working for Facebook
    you will discover that not very many companies utilize the HipHop framework and
    your job opportunities will be limited. I view this approach as a bit risky because
    it tends to place all your eggs in one basket.


    # ## Your specialty


    My personal favorite approach is to pick a language that fits in with your development
    specialty. I''m partial to this strategy because it''s what I used in my development
    journey and it worked quite well for me.


    Deciding how to pick a programming language based on your development specialty
    means that you look at the types of applications you want to build. And then you
    work backwards to put together a list of languages that are best suited for your
    objectives.


    For example, let''s take the case study of you deciding that your development
    specialty is going to be building big data applications. By taking this approach,
    you can dramatically narrow down the list of programming languages that fit with
    your goals. Many languages can perform big data processing, but only a few languages
    truly specialize in it, such as:


    +   - R

    +   - Scala

    +   - Python'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'So, by looking at your specialty first, you have just narrowed down the list
    of languages from thousands... down to three.


    # Specialty-based mapping


    Since I find this approach to be the most effective, let''s walk through a mapping
    of development specialties to popular languages:


    +   - **Full stack development**: If you want to be a full stack developer, the
    Ruby on Rails stack may be the best choice for you. This stack offers a great
    set of tools for web developers and allows for the build out of robust applications.

    +   - **Frontend development**: For frontend developers the path to follow resides
    on the JavaScript track. The JavaScript programming language has emerged as the
    clear winner in the frontend development space. And by becoming fluent in JavaScript
    you will be able to work with popular frontend frameworks such as React and Angular.

    +   - **Server-side development**: The world of server-side development can be
    a bit intimidating. If you review the server-side languages you''ll discover lower-level
    languages such as C, C++, and Java. However, programming languages such as Ruby,
    Python, and Go also specialize in server-side development.

    +   - **The data scientist**: The world of data science can appear at first sight
    to have impossible demands on a developer to also be a high mathematician. However,
    if you explore the modern Python libraries, you''ll find a rich set of ready-made
    algorithms so you can be creating your own neural networks and machine learning
    systems very quickly indeed. I''d recommend Python for this reason if you''re
    already familiar with the language. If you have a bit more of a statistical background,
    then I''d recommend that you explore further how the R language can get a gateway
    into a new career path.


    Through my programming journey, I have worked to specialize in one interpreted
    language and one compiled language. I chose Ruby for my interpreted language,
    and for my compiled language I started with C. However, I haven''t found very
    many practical uses for my C knowledge over the years. Also, I have moved onto
    the Scala language since it is a good fit for building big data algorithms.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Summary


    In summary, as with picking your development specialty, my recommendation to aspiring
    students is to experiment with a number of languages before deciding on which
    ones to learn extensively. There are a number of tools online that make it helpful
    to see a side by side comparison for various languages.


    For example, one of the deciding factors that led me to learning Scala was looking
    through the Scala algorithm implementations on Rosetta code (https://rosettacode.org/wiki/Category:Scala).
    So, don''t rush into picking out a programming language. Give the decision plenty
