  img_proc: true
- pgno: 198
  md: '![](img/de22e3e00f8df753e0d57f7da4d1c581_198_0.png)


    Thankfully, it is also easy to use, which means that I didn''t have to spend time
    learning how to use the software. It has an intuitive interface and allows me
    to log in, perform whatever tasks I have to, and then get back to working.


    # How it works


    Here''s an important screen for me in FreshBooks:'
