  md: '# Chapter 39. Importance of Test-Driven Development for Coders


    Let`s discuss the importance of **test-driven development**. First and foremost,
    if the terms TDD or BDD, which are short for test- and behavior-driven development,
    are foreign to you, they are the practice of building code tests for applications.


    And even more specifically, TDD and BDD are *software development processes in
    which you create a test that sets an expectation before implementing any code.*


    An example of using TDD to create a feature for returning a full name from a user
    class would be to:


    +   1. Create a test that calls a new method, such as `full_name`, that combines
    the first and last name of a user and returns a string combining the names into
    a single value:


    ![](img/de22e3e00f8df753e0d57f7da4d1c581_216_0.png)


    +   2. Then we''d run the test, knowing that it will fail:'
  merge: -1
  img_proc: true
- pgno: 217
  md: "# The test fails\n\n3. Then we would go and add a barebones implementation\
    \ of the code:\n\n# Implement the code\n\n```\ndef full_name(first, last)\n  first\
    \ + \" \" + last\nend\n```\n\nThis will get the test passing:"
  merge: -1
  img_proc: true
- pgno: 218
  md: "# The test passes\n\n4. Then we'd go back and refactor the implementation to\
    \ ensure it conforms to best practices and that the refactor doesn't break anything:\n\
    \n# Refactor the code\n\n```\ndef full_name(first, last)\n  return \"\" unless\
    \ first && last\n  first + \" \" + last\nend\n```\n\nThis process is known as\
    \ the Red, Green, Refactor workflow and is a pretty standard practice across all\
    \ languages and frameworks."
  merge: -1
  img_proc: true
- pgno: 219
  md: <!-- no content -->
