- pgno: 16
  md: '# # About the Author


    **Jordan Hudgens** is the CTO and founder of DevCamp, where he leads instruction
    and curriculum development for all the DevCamp and Bottega code schools around
    the US.


    As a developer over the past decade, Jordan has traveled the world building applications
    and training individuals on a wide variety of topics, including Ruby development,
    big data analysis, and software engineering.


    Jordan focuses on project-driven education as opposed to theory-based development.
    This style of teaching is conducive to learning how to build real-world products
    that adhere to industry best practices.


    Additionally, Jordan has published multiple books on programming and computer
    science along with developing training curriculum for Learn.co, DevCamp, and AppDev
    on the topics, namely Ruby on Rails, Java, AngularJS, NoSQL, API development,
    and algorithms.'
  merge: -1
