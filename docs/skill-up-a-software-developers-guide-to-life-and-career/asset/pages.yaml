- pgno: 34
  md: '# # Why we love the prodigy myth


    Before I end this chapter, I want to address a subtle issue that explains the
    reason of why we, as humans, love the idea of prodigies.


    The concept of prodigies, individuals born with a natural ability to be successful
    at a certain skill, such as sports, math, or programming, can be detrimental to
    our own success. This belief is dangerous because it causes our minds to have
    negative responses to failure.


    For example, if you''re an aspiring developer who thinks that programmers are
    born and not made, when you come across a bug that you can''t seem to figure out
    or a feature you can''t build, your first reaction might be:


    > *I guess I wasn''t born to be a developer.*


    Or:


    > *I wish I had talent like XYZ programmer, everything seems to come so easy to
    him.*


    If you catch yourself with thoughts like these, remind yourself that prodigies
    aren''t real.


    Developers achieve greatness through smart work and perseverance. The 10,000-hour
    rule from the *Tipping Point* book by *Malcolm Gladwell* may not be exactly accurate.
    However, it does give a general guide for how much work is required to reach a
    level of mastery.


    If you feel like you weren''t born with the "developer gene", go and knock out
    10,000 hours of focused practice on building applications. I think you''ll be
    pleasantly surprised to find that you''ll become so good, that other people will
    look at you, and they''ll think... that you were just born this way.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# # Chapter 3. Do You Have to Be a Genius to Be a Developer?


    We''ve discussed the topic of whether great developers are born or made. And in
    this chapter, we''re going to look at a similar topic from a different angle.
    And we''re going to answer the question *do you have to be a genius to be a developer?*


    Because of the near-magical nature of coding, one of the most common remarks I
    hear from individuals who hear what I do is:


    > > "Oh wow, you''re so smart!"


    In fact, just recently I traveled to meet with a group of developers and the head
    of the company introduced me by saying:


    > > "This is Jordan, he''s just here to be smart."


    I know that when people say things like this it comes from a good place. However,
    it bothers me. And it bothers me for a couple reasons:


    +   1. First and foremost, these type of comments make it seem like all it takes
    to become a great developer is being smart.

    +   2. Following up on the above point, these remarks devalue the countless hours
    of work that are required to learn development.


    # ## The running man


    I''m going to get off my soap box for a moment and discuss the life of Steve Prefontaine.
    If you''ve never heard of him before, Prefontaine was one of the world''s greatest
    runners during his time. Before tragically dying in a car accident at 24 years
    old, he had already broken seven track world records.


    During his climactic rise to success, many people would try to compliment Prefontaine
    by saying how talented he was, and by calling'
