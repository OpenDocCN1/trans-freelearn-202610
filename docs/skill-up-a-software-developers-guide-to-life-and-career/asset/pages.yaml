  md: '# Chapter 38. Examples of Freelance Portfolios That Help Acquire New Clients


    In this chapter, I''m going to discuss *examples of freelance portfolios* that
    you can use to attract clients. Before deciding on the types of projects you want
    to include in your portfolio, it''s important to answer a few key questions:


    +   - Who will I be showing this portfolio to?

    +   - What type of features do I love developing?


    The first question is pretty standard; you need to know you your audience to ensure
    that your work will have its greatest impact. For example, if you want to attract
    small mom and pop businesses, it wouldn''t make much sense to fill your portfolio
    with 3D Unity zombie game renderings.


    The second question speaks to your passions as a developer. Too many coders create
    a portfolio full of generic projects that they don''t truly love and it''s apparent
    to potential employers and clients. Make sure that the projects you build fit
    your personality as a developer and that you are happy with the end result. Portfolio
    projects are not an item meant to be simply crossed off your developer checklist,
    they should be projects that you''re personally proud of and enjoyed building.


    # Examples of freelance portfolios


    The following examples of freelance portfolio projects entail a comprehensive
    feature set and should impress a wide variety of clients. However, they are simply
    starting points, not hard and fast rules.


    # Social network utility


    This is where you build a basic social network with a clean design and'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'features such as having posts, followers, and comments, and integrate at least
    one unique/advanced feature, such as giving users the ability to edit each other''s
    posts.


    When I''m looking to hire a new developer, I like to see that they know how to
    work comfortably with complex data models such as the ones required by a social
    networking application, and being able to work with advanced permissions structures
    is very important, so this makes a good portfolio project.


    # An API tool


    An example would be to develop a search engine for Stack Overflow that enables
    more advanced features than the main web application. A project like this would
    show that you can work with APIs and can implement a search engine feature.


    # An accounting application


    You don''t have to rebuild QuickBooks. However, an accounting project can illustrate
    that you know how to work with financial calculations, callbacks, advanced database
    queries, and information security.


    # A scheduling application


    I''ve built several scheduling applications. This type of app will show that you
    know how to work with dates and times (which is no easy task for any developer),
    along with complex validations.


    # A frontend application


    Create an app using a frontend framework such as AngularJS or React and integrate
    it with a server-side backend such as Ruby on Rails. This will show that you know
    how to work with service-based architecture and design, which is a prerequisite
    for my clients.


    If you build these apps (or apps that contain the same level of'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'sophistication), you will be able to clearly showcase your expertise to potential
    clients, colleagues, and future employers. These projects will also give you a
    great code library that you can reference for future projects.


    I''ve lost count of how many times I''ve reviewed past portfolio projects to see
    how I implemented a specific feature so I could use it on an app I was working
    on at the moment. I hope this list has inspired you to build out your own portfolio
    of projects.'
  merge: -1
  img_proc: true
