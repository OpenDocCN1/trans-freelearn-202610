- pgno: 27
  md: '# Chapter 1. Discovering the Tipping Point for Developers


    If you''ve been programming for a while, a question that has most likely crossed
    your mind is this:


    > "Am I a good developer?"


    Before we go on, let me share a little secret with you... Every developer, even
    senior developers, have insecurities when it comes to programming. Few individuals
    like to share that information, mainly because confidence and even arrogance has
    become a developer stereotype for some stupid reason.


    However, I won''t BS you. I can tell you that the more experience I have as a
    coder, the more I realize how much more there is to learn and how far I still
    have to go.


    # Tipping point for developers


    With all that being said, I want to discuss topic of defining the tipping point
    for developers, which is essentially the point at which a developer goes from
    a beginner to a pro. Since this topic is a bit abstract, it''s not possible to
    point to a specific point in time and say:


    > "Here it is, this is when it all clicks and makes sense."


    There''s not a sentinel moment when programming mastery occurs. It''s different
    for every individual.


    # My own experience'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'I remember when I was originally learning programming. Understanding the syntax
    and context did not come easy for me. It seemed like I spent 99% of my time looking
    things up and copying and pasting code from others just to get my programs running.


    # The doubt machine


    Needless to say, my confidence as a programmer was very low in the beginning.
    I kept being plagued by nagging doubts, such as:


    +   - Maybe programming isn''t for you

    +   - Even if you code works you won''t be able to write your own programs

    +   - You''re only typing in what the book is saying to do, you won''t be able
    to build anything custom


    And the negative thoughts continued from there


    # The painful process


    If you''re a new developer maybe some of this sounds familiar to you, or maybe
    it doesn''t and I simply lacked confidence. Either way, I trudged along, trying
    everything I could think of to improve as a developer:


    +   - Going through dozens upon dozens of programming books in various languages

    +   - Trying to build up a portfolio of project

    +   - Following online guides


    However, back when I was originally learning how to code, the online resources
    weren''t quite as good as they are today.


    # The tipping point(s)


    So, what did the trick and pushed me over the edge to become a professional developer?
    None of those things… and all those things. I persevered through project after
    project and I consumed every training resource I could find. And slowly something
    amazing started to happen:'
  merge: -1
  img_proc: true
- pgno: 29
  md: '> "Everything started to make sense."


    # The first tipping point


    Even though it was a while ago, I still remember the moment my first development
    tipping point happened. I was sitting in front of my computer in a coffee shop
    and working on a web application.


    A few hours went by and I stopped dead in my tracks, realizing that I had just
    spent the afternoon building a project and hadn''t looked up a single code snippet.
    It wasn''t like I programmed the space station, the project was incredibly basic.
    However, it was one of the most exciting moments I can remember in my life.


    # The second tipping point


    As great as that was, I still had very far to go. I remember the next moment when
    I felt like I reached another key milestone. Even though my confidence had increased
    as a developer, the thought of anyone seeing my code was a very scary thought.
    However, I had started to build my freelance business and a client (who was also
    a developer) asked me to perform a pair programming session with him.


    He had run into a bug with the program we were building and asked me to jump on
    a screen sharing session where we could work on the project at the same time.
    Honestly, I was scared to death when he asked. I had never coded in front of anyone
    before and the thought of doing it with this client pretty much gave me a panic
    attack. However, I didn''t really have a choice in the matter so I started the
    session with him. After a few minutes of nervousness, I started to relax and to
    my surprise not only did I not make a fool of myself, I actually figured out the
    bug in his code and got the feature working.


    # The secret


    So, what was my secret to getting over the hump and going from a beginner to a
    professional developer? Unfortunately, there is no easy-to-follow recipe. However,
    there is a process that is guaranteed to work.'
  merge: -1
  img_proc: true
