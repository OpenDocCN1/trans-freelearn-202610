- pgno: 37
  md: '# Do you have to be a genius to be a developer?


    It''s important to take the same approach that Prefontaine took as developers.
    If you fall into the trap of thinking that only geniuses can become good coders,
    it will most likely lead to quitting when tasks become challenging. This is because
    our minds constantly are searching for ways to work less. And if you believe that
    being a genius is a requirement for development, you will have a built-in excuse
    for faltering on your developer learning journey.


    # The way the mind works


    In a comprehensive educational study published in Scientific American (http://www.scientificamerican.com/article/the-secret-to-raising-smart-kids1/),
    kids were broken into two groups and taken through some academic assignments.
    Both groups scored around the same for the assignments. One of the groups were
    praised by their parents and teachers, and the focus of the compliments centered
    around how smart and talented the kids were.


    The second group of students were complimented in a different manner. Instead
    of complimenting students on their innate ability, students were complimented
    on how hard they worked.


    After going through this cycle of compliments, the same two groups of students
    were presented with new, and very challenging assignments.


    The first group of students, the ones that had been told that they were brilliant,
    ended up giving up and not completing the tasks that were assigned to them. However,
    the second group of students, the ones that were complimented on their hard work,
    performed dramatically better than group 1.


    # The reason'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'So why did two groups of students have such different results when, by all
    appearances, the students had the same level of actual skill?


    The researchers concluded that the students from group 1 felt like the top priority
    was maintaining their *genius* status. So, they quit the second assignment early
    because they didn''t want to look bad and tarnish the *genius* label that they
    had been given.


    However, the second group of students didn''t feel the pressure to maintain a
    genius status. Instead, they wanted to maintain their new reputations as hard
    workers. With this mindset, the second set of students worked through the challenging
    topics instead of giving up.


    # A smarter approach


    So, instead of taking the mindset that you need to be a genius to become a developer,
    take the mindset that best developers are also the hardest working developers.
    With this approach, your potential for skill is literally limitless. You are 100%
    in control of how good you will become as a coder. And your success will completely
    be determined how hard (and how smart) you are willing to work.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Chapter 4. How to Study and Understand Complex Topics?


    When I was younger I used to struggle learning a new or difficult subject, and
    over the years and about a decade of university and grad school have helped me
    put together a strategy for how to study and understand complex topics. Typically,
    I apply this learning system to subjects such as algorithms and software engineering;
    however, it can be applied to any topic.


    While there is a near infinite set of study strategies out there, I like this
    approach because it utilizes a divide and conquer strategy, focusing on breaking
    a complex topic into easy-to-understand components, and putting the pieces back
    together at the end to see how they all work together.


    # A system for how to study


    Let''s take a case study example: understanding how logarithms work. Logarithms
    are used throughout the fields of mathematics and computer science; however, unless
    you use them regularly it''s easy to get rusty on them:


    +   1. The first task that I will do is take a piece of paper and write Logarithm
    in the center and circle it.

    +   2. Next, I''ll go to a comprehensive post on the topic, such as one on Wikipedia.
    When reading the first sentence, I come across a few terms that are a bit fuzzy:

    +      - Inverse operation

    +      - Exponentiation


    I will stop reading the logarithm article and go and read those two articles until
    I feel comfortable with what they represent. After I feel good about those two
    items, I write them as their own circles that connect to the Logarithm circle.
    I will also add any examples that will'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'help me understand what the terms mean if necessary.


    3. Next, I''ll go back to the original Logarithm post and keep going through the
    article repeating this process until the entire page is filled with a mind map
    that explains each component that makes up logarithms and how they work together.
    This may include base case examples, such as:


    64 = 2^6 is the same as log 2 (64) = 6


    If this seems like a dead simple approach to study...it is. The goal of studying
    is to learn a topic, and one of the easiest ways to understand a complex subject
    is to break it into easy to comprehend components. For example, if you''re trying
    to understand an advanced algorithm in computer science from scratch, you may
    feel a little intimidated.


    However, if you break the algorithm down into small enough components you''ll
    see that it''s essentially a process of steps made up of connecting simple modules
    such as loops, manipulating variables, and using conditionals. A problem is only
    hard when you try to think of it as a whole. However, any concept can be understood
    if you simplify it down to easy to comprehend pieces.


    Obviously, the more complex the topic, the longer it will take to deconstruct;
    however, I am a firm believer that anyone can understand any topic assuming they
    dedicate themselves and put the work in. I hope that you can leverage this mind
    mapping process to understand complex topics and that it will help you learn how
    to study properly and truly learn.'
  merge: -1
  img_proc: true
