- pgno: 161
  md: 'Alternatively, you can let the client decide on what approach they want you
    to take. In this situation, you propose the pros and cons to building a full test
    suite compared with only building the application itself. If you have an intelligent
    client they will most likely see the benefits of including tests and choose for
    the pricier option.


    This is an effective strategy because it allows for you to bring the client into
    the decision-making process, which will make them feel involved in the work. And
    if the client is still looking at other freelancers, this approach may help win
    him over.


    Another benefit to letting the client decide is that his response may give you
    insight into how he thinks. If he acts like tests are a pointless luxury and says
    that he simply cares about getting the project complete, he might be a nightmare
    client. And in cases like that you are better off moving onto more informed people
    to work for.


    # Using common sense


    Lastly, make sure that you''re using common sense. Imagine being asked to build
    out a simple corporate website. In cases like this you only need to write some
    basic tests. At the most this should only add an hour or so to the project.


    There is no need to bog down the process writing tests that verify that every
    CSS class and ID are shown on the page. As with most concepts in freelancing and
    life, common sense is one of your greatest tools.'
  merge: -1
  img_proc: true
