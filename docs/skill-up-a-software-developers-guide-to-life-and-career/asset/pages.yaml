- pgno: 20
  md: '# What this book covers


    Part 1, *Coder Skills*, contains advice for people starting out in a coding career,
    or those who are already working as in a programming role but want to improve
    their general skills. It includes such subjects as how to study and understand
    complex topics, defining deep work and what it means for developers, and getting
    past skill plateaus when learning new languages.


    Part 2, *Freelancer Skills*, contains advice for developers working as freelancers
    and trying to manage their careers and bid on new tenders. It includes such subjects
    as knowing when to fire a client, practical tips for taking over legacy applications,
    and a guide to automating client update messages.


    Part 3, *Career Skills*, contains advice for having a successful career as a developer.
    It provides information on how to advance your career, and practical tips, such
    as interview guides. It includes such subjects as how to practice programming
    techniques and improve as a developer, how to balance best practice and creativity
    as a developer, and developer salary negotiation strategies.'
  merge: -1
  img_proc: true
