  md: '# Chapter 32. How to Remotely Demo Work for Freelance Clients?


    So, you have a freelance client and you''re ready to show off your work, but how
    can you showcase a project when you work remotely? If the entire application is
    completed, you could simply send the client a link to test it out. However, it''s
    been my experience that this approach is not a great idea. As the designer or
    developer, you know the inner workings of the app.


    The client, on the other hand, especially if they''re of the non-technical variety,
    will stumble through testing the application out. Even if you did a great job
    on the project, if the client doesn''t know how to use the software they''re not
    going to be happy with your work.


    # Why proper demonstrations are important


    Over the years, I''ve discovered that well thought-out demonstrations are a key
    to successful projects. There are two main reasons for this:


    +   1. A proper demo will let you control the flow of the app. You can control
    the focus of the work and spend time showcasing how the system works. This will
    essentially function as a tutorial for the client of the app. A well-organized
    demo will educate the client on the application and remove many of the common
    issues related to user experience confusion.

    +   2. You will get practical feedback. No matter how well you think you understood
    the client requirements, there will always be misunderstandings, especially early
    in the development process.


    Thankfully, if you put together a proper demonstration of the software you'
  merge: -1
  img_proc: true
- pgno: 174
  md: can get a clearer view of the client's vision. If you simply sent off a link
    to the app for the client to test, many of the feedback items they would send
    back would be related to not understanding how the system functions. However,
    if you can clearly show how the app works, it will shortcut this process and let
    you understand the actual fixes sooner.
  merge: -1
  img_proc: true
