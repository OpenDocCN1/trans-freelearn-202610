  md: '# Poor questions to ask during a job interview


    You will want to stay away from questions that appear that you want to get out
    of work such as asking about the amount of paid time off, tiers of vacation days,
    and so on. It''s important to know these parts of the job, however it will reflect
    better on you if you instead ask questions such as:


    > "What types of benefits are associated with the position?"


    This question will get the interviewer to give answers to the PTO and vacation
    time without you coming across like someone who''s already trying to see when
    they won''t have to work, but still get paid.


    Typically, you will also want to not ask questions that start with why, because
    why questions will immediately make the interviewer defensive and will give the
    conversation a feeling of being confrontational. These types of questions can
    usually be changed to start with how, which will tell the interviewer that you
    are wanting to know more about the company instead of accusing the company of
    doing something wrong.


    An example of this would be "Why does the company pay by check instead of direct
    deposit?" This makes it seem like you''re saying that the organization isn''t
    staying up with modern payroll procedures (which may or may not be the case),
    however nothing good can come from this type of question.


    Hopefully this gives you an idea of what questions not to ask, but just in case
    a few more case studies would help, here are some more questions that you should
    avoid:


    > "Is telecommuting a possibility for the position?"


    If it was they would''ve already mentioned it, if telecommuting is your top goal
    you should consider freelancing.


    > "How much does the position pay?"'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'You should already have a decent idea of how much the job pays if you''re interviewing
    for it. You can worry about the wage after it''s been offered to you, it''s never
    a good thing when the interviewer thinks that you''re top priority is how much
    money you''re going to make because they''ll assume that you will leave the company
    if another organization offers you a modest raise.


    "What type of hours would I be expected to work?"


    Interviewers and managers hate this question! Based on the job you should already
    know this. However, you can reframe this question by asking something like "What
    does a typical day for this position look like?".


    Lastly, never ask "How did I do?" or "Do I have the job?". Asking how you did
    sounds like you just finished a spelling test in 3rd grade and doesn''t reflect
    much confidence. And if you had the job they would have told you. Wait and follow
    up with the interviewer in a week and you''ll be considered a mature and experienced
    candidate.'
  merge: -1
  img_proc: true
