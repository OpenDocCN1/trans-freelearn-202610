  md: '# Chapter 5. Effective Study Practices for Developers


    Let''s imagine that you''re back in school and midterm exams are coming up. How
    would you study? Some common approaches might be:


    +   - Re-read the study materials or lecture notes

    +   - Highlight and memorize the key terms

    +   - Go over your notes constantly until test day comes


    Those all sound like effective study practices. However, cognitive research has
    shown that many of the traditional study patterns that students have followed
    for decades simply do not work.


    I didn''t make up that list of study patterns. That''s exactly what I used to
    do in preparing for exams. However, I discovered (after failing a number of tests)
    that these strategies failed miserably when it came to helping me to truly learn
    new concepts.


    # Why traditional study habits don''t work


    This type of approach to studying doesn''t work because our minds don''t function
    like computers. A computer can take in information and then spit it back out.
    However, our minds are more relational in nature.


    By relational in nature, I mean that our brain functions like a graph-based network.
    If new information attempts to enter the brain without being connected to any
    of our previous knowledge, it will simply be rejected.


    For example, let''s imagine that you are new to learning programming. If you simply
    run through a list of programming terms and syntax rules, you might memorize them
    in the short run.


    However, because your brain hasn''t been properly introduced to the'
