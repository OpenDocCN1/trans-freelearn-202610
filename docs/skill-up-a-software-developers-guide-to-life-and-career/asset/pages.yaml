- pgno: 144
  md: '# A caveat


    Before you go out and take on a dozen jobs that you have no clue how to build,
    let me add a word of caution.


    I have seen freelancers and even large software development agencies take the
    approach of believing that they can simply hire outsourcers to do all their work
    for them. This approach will fail every time.


    To work with outside contractors, you need to work with them daily. Did you notice
    how one of the prerequisites to the mobile application I worked on in this chapter
    was that I had a clear communication channel with the mobile developer?


    If I would have simply sent him a list of requirements and waited for the finished
    product the project would have failed miserably. Working with contractors is typically
    just as time consuming as writing the code yourself. So, don''t think that outside
    contractors are a magic bullet that will do all of your work for you.'
  merge: -1
