- pgno: 200
  md: '# FreshBooks additional features


    It would take hours to go through the full system, so I will simply gloss over
    some of the other features I find the most useful:


    +   - **Invoice sending flexibility**: As great as it is to send invoices electronically,
    I still have a few clients who prefer paper-based invoices. Thankfully, not only
    does FreshBooks allow me to print out invoices, they actually mail them for me
    directly to the client.

    +   - **Expense tracking**: Tracking business expenses is a tedious exercise.
    However, with the FreshBooks mobile app I can take pictures from my phone, enter
    the expense details, and the expense will be logged into the system.

    +   - **Creating estimates**: In the past, I would create an estimate in Excel
    or Word, and then send it to the client. If they approved it I would then have
    to enter the details into an invoice. However, with FreshBooks I can create an
    estimate and email that directly to the client. If they decide to move forward
    with the project, the estimate will automatically transfer into an invoice.


    # Weaknesses


    As much as I love the FreshBooks system, it does have a few weaknesses. First
    and foremost, it can get a little expensive if you get a large number of clients.
    Also, if you start hiring a large number of employees it can become a little unwieldy
    to manage. Personally, I''d recommend using Freshbooks for any business with under
    20 employees. When you grow beyond that point, you''ll want to move to a more
    scalable system.


    # QuickBooks


    If you''ve grown out of FreshBooks, QuickBooks may be a good option for our business.
    QuickBooks has been the industry leader for small business accounting software
    as long as I''ve been around. Even though the company has acquired the reputation
    for being difficult to manage, over the past few years they''ve done a good job
    in making the system more flexible.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'When you list all the potential features needed by accounting software for
    a small business, QuickBooks has it all. Also, due to its popularity, there is
    a good chance that any admins that you hire will already have experience using
    the system.


    With all that being said, I personally wouldn''t choose to use QuickBooks for
    DevCamp or any of the companies I work with. The main reason is because I''ve
    seen too many times where companies grow out of QuickBooks and found it very hard
    to migrate to a new system. I also don''t like the reporting engine that the software
    uses. For example, if you plan on running your financial data through a big data
    analysis reporting engine, QuickBooks makes it difficult to export it in a format
    that''s easy to use.


    # NetSuite


    If your business is growing, both in clients and employees, NetSuite is a great
    bookkeeping option. Technically, NetSuite is probably overkill for the typical
    freelance business. However, if your development shop starts to turn into a full-fledged
    digital agency you''ll need a robust ERP system. ERP systems are different from
    traditional bookkeeping software, they''ll offer tools such as:


    +   - **Resource planning**: This means you can allocate developer time on a project
    basis.

    +   - **Advanced tax planning tools**: Once your business hits a certain size,
    it''s important to ensure you''re taking advantage of all the potential tax deductions
    available. Tools such as an ERP system do this for you.

    +   - **Payroll integrations**: Being able to manage your employees, track turnover,
    and tasks such as that get important as your business grows. However, they''re
    hard to track manually. A system such as NetSuite calculates all your employee
    tracking metrics so you can use them to manage your team.'
  merge: -1
  img_proc: true
