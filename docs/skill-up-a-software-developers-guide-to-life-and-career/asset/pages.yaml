  md: '# Chapter 51. Developer Learning Options – A Practical Analysis


    The entire world seems to be talking about the importance of becoming a coder.
    However, many of these discussions aren''t practical. This chapter will walk through
    the various developer learning options available today, and help you decide on
    which option is right for you and your goals.


    # Degrees of programming expertise


    If you''re new to development the first task you should complete is to decide
    why you want to learn programming. There are a number of reasons for learning
    how to code, including:


    +   - Becoming a professional developer

    +   - Improving your skill in your current profession

    +   - Learning for fun or for hobby projects


    It''s important to decide on your goals since they will dictate what learning
    strategy to take when it comes to how to learn programming. Let''s look at each
    of them.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Becoming a professional

    developer


    If your goal is to become a professional developer, congratulations! You''ll be
    joining one of the fastest growing industries that the world has ever seen. The
    pay is great and the right developer jobs are both fun and rewarding. However,
    with all those benefits comes a strict set of learning requirements.


    Pro coding jobs will require you to become proficient in a programming language
    and several frameworks. And simply building applications that function properly
    isn''t enough for most jobs. Instead, you''ll need to be able to build apps that
    follow processes such as:


    +   - Test- and behavior-driven development

    +   - Clean coding styles that are scalable and adhere to industry best practices

    +   - Coordinate with developer teams and seamlessly work with code version control
    systems


    And the list goes on and on…


    # Developer bootcamps


    Any platforms or guides that say you can become a professional developer in a
    month or claims like that are simply lying to you. Becoming a professional developer
    takes years. I''ve been a developer for over a decade and I''m still learning
    each day. With that being said, if you want to make a career as a developer there
    are countless resources for achieving your goal.


    Personally, I''d recommend starting with a developer bootcamp. Bootcamps allow
    you to become fully immersed in a language or framework over a course of several
    months. And many of them, including the one I run, DevCamp, offer job guarantees
    after you''ve completed the course.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'These immersive programs aren''t easy or cheap. They''ll usually require around
    40 hours a week of study and practice. And you''ll find they range from around
    $5k to $20k. This may seem like a pricey option; however, how many training platforms
    can guarantee that you''ll get a job after a few months of study?


    # Is this practical?


    It may seem like I said a contradictory statement when I said that developer bootcamps
    can help you get a coding job in a few months. But I also said it takes years
    to become a professional developer. Let me let you in on a dirty little secret
    in the software world… many individuals working in developer jobs aren''t professional
    programmers!


    After getting hired from a coding bootcamp you''ll most likely be a junior developer.
    The companies that hire bootcamp graduates understand that they''re usually new
    to programming and they take it upon themselves to continue the new hire''s education.


    This is a win-win scenario. Developers can get great paying jobs with limited
    experience. And software companies can train developers to follow the procedures
    specific to their organization.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Improving your skill in your current profession


