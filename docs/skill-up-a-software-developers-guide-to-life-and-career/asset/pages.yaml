- pgno: 46
  md: '# The comprehensive study system


    In addition to the process of reification, there are a number of other study strategies
    that research is showing to be more effective than traditional study practices.
    In their book *Make It Stick*, cognitive psychologists *Brown, Roediger, and McDaniel*
    give the following recommendations for studying:


    +   - When learning from a textbook, use the key terms from the back of each chapter
    to test yourself.

    +   - List out key terms and use each one in a paragraph; this will test to see
    if you understand a concept outside of the realm of how the textbook or instructor
    supplied it.

    +   - While reading new material, convert the main concepts into a series of questions
    and then go back and answer the questions when you''re done reading the chapter.

    +   - Rephrase the main ideas in your own words as you go through the material.

    +   - Relate the main concepts to your own experiences, much like the reification
    process we''ve already discussed.

    +   - Look for examples of key concepts outside of the text. When I''m learning
    a new programming language I never rely on a single source. If I come across a
    concept that doesn''t make sense I''ll usually review 2- 3 other sources that
    provide alternative explanations to what I''m attempting to learn.'
  merge: -1
  img_proc: true
