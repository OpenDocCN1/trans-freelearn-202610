    as:


    +   - Zooming in to specific screen zones

    +   - I highlight sections of the screen that I want to focus on


    This process only takes a short period of time. However, it is well worth it because
    it enables clients to have a tangible walk-through of the system.


    You can use a number of tools for recording screencasts. My personal favorite
