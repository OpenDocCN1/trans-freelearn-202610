  md: '# Chapter 34. Top Project Management Tools for Freelancers


    In this chapter, I''m going to discuss the top project management tools I''ve
    used on coding projects. In preparing for this chapter, I went through some directories
    that listed all the known project management software applications on the market.


    To be 100% honest, I was a bit shocked. There are literally thousands of project
    management options available to freelancers. Thankfully, I''ve been able to work
    for a number of clients and worked with various project management apps over the
    years.


    For this chapter, I want to give you a list of the top project management tools
    along with their respective strengths and weaknesses. With this knowledge, you
    can decide on which one is the best fit for your project and freelance business.


    The following are six of the top project management tools that I''ve used. I''ve
    probably used around a dozen tools; however, I only wanted to list applications
    that:


    +   - I had actually used on production projects

    +   - I had a good experience with and that I''d recommend to others


    # Top project management tools


    We''ll now look at each tool one by one.


    # Basecamp


