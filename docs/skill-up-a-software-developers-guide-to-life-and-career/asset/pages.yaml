  md: '# # Chapter 36. Learning the Secret to Get New Clients as a Freelancer


    If you''re wanting to start a freelance business, the most pressing challenges
    typically revolve around getting new clients. When I initially launched my freelance
    business, I struggled to acquire customers.


    However, after a few months of trudging through the traditional channels I discovered
    a great solution that resulted in generating over $290,000 in revenue last year.
    And it''s what I want to discuss in this chapter.


    # ## Where to find new clients


    Let''s begin by reviewing the list of options for where you can find new clients
    as a freelancer. I''ve read countless blog posts and a number of books on the
    subject, and the following were the most popular recommendations:


    +   - **Friends and family:** This may seem like a natural place to start; however
    it''s been my experience that friends and family typically expect you to work
    for free or incredibly cheap. This channel can be good if you''re just starting
    out and you need to build a portfolio; however, it is not scalable and usually
    not too profitable.

    +   - **Network events:** For networking, you can join your local chamber of commerce
    or find networking groups where you can promote your business. This approach can
    work well in some cases. However, each time I''ve tried it I''ve discovered that
    there were already several other developers attending working on getting new clients
    for their own freelance businesses.


    I wouldn''t let my experience with this option stop you from trying it, but make
    sure you''re prepared to compete with others. I remember attending a chamber of
    commerce "meet and greet" a few years ago. When everyone around the room introduced
    themselves and their'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'business, there were half a dozen freelance developers who were all offering
    the same services.


    +   - Outsourcing services. This is the option that I want to focus on here. Interestingly
    enough, I was told by a number of freelance "experts" that this avenue was too
    difficult. However, I found a great way to use it for getting new clients as a
    freelancer.'
