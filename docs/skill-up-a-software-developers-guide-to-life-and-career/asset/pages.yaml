    where you and another developer both take turns working on a project at the same
    time, preferably in the same room and on the same computer. When one of you is
    coding, the other developer is watching and giving advice or warnings. Whenever
    I''m building a complex feature, I will always use pair programming since it''s
    akin to working with two brains on the same feature.

    +   - **Continuing education**: No matter how long you''ve been a developer, you''ll
