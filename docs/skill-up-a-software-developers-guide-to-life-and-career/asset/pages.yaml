  md: '# Chapter 8. How to Use Willpower Limits Instead of Letting Them Use You?


    There are a number of common characteristics among great developers. However,
    few virtues are as important as willpower. World class coders constantly are forced
    to work through complex concepts, and without willpower they would give up before
    experiencing any kind of breakthrough. In this chapter, I''m going to walk through
    the topic of willpower limits.


    This will include a practical walk through on:


    +   - What willpower limits are

    +   - How you can improve your personal willpower limits

    +   - A plan for being intentional about managing willpower limits


    # What are willpower limits?


    For graduate school I have performed extensive research on the topic of task switching
    costs. While studying about task switching, I came across the topic of willpower
    limits and how they related to performance. Essentially, the study of willpower
    limits says that *individuals have a limited amount of decision making power each
    day.*


    # How many decisions do you make each day?


    If that sounds weird to you, don''t worry, I had a hard time with the concept
    right away too. So, let''s go through a typical day for a developer. What are
    some decisions that you make each day?


    +   - Deciding to get up or press snooze on the alarm clock'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   - Picking out what to eat for breakfast

    +   - Selecting your clothes for the day

    +   - Deciding if you want to go to the gym, a run, or walk around and play Pokémon
    Go

    +   - Deciding on which route to take to work

    +   - And the list goes on and on


    Notice how none of those items are related to development at all. And in fact,
    those were all common decision items that you have to make each morning before
    you even get into work. If you actually count the number of decisions that you
    have to make each day, you''d discover the number is probably in the hundreds
    or even thousands. If you include subconscious decisions such as staying in your
    lane while driving, the number is most likely in the millions every day!


    # Why is willpower important?


    Hopefully, I''ve helped you see all of the decisions that we make daily. So why
    do willpower limits matter when it comes to making decisions? Mainly because without
    willpower the quality of our decisions will suffer dramatically.


    Imagine yourself without willpower for a second. With no willpower, you:


    +   - Would eat whatever you wanted, harming your overall health

    +   - Wouldn''t study, thus never improving as a developer

    +   - Would recklessly spend money on whatever popped into your mind, forcing
    you into debt and eventually bankruptcy


    It''s not a pretty picture, which is why willpower is so important when it comes
    to making decisions. Willpower gives you the self-control to make the right decision,
    even when it''s not the easy one.


    # Are willpower limits real?


    So, with all of that in mind, is there really a limit to the amount of willpower
    you have each day? I recently went through the book, The Willpower Instinct, written
    by Dr. Kelly McGonigal (no relation to'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Professor McGonagall that I''m aware of). In the book Kelly presents research
    and countless case studies that clearly show that we do indeed have a limit to
    our daily willpower.


    Imagine that your willpower is like a bottle of water. Each morning you start
    with the bottle filled to the top. And each time you make a decision or have to
    use willpower, such as deciding to get up instead of hitting snooze on the alarm
    clock, a little of the water gets poured out. As you go through your day you''ll
    eventually "pour out" all of your stored-up willpower.


    # When the willpower well runs dry


    So, what happens when the willpower well runs dry? Typically, it leads to poor
    behavior, such as:


    +   - Procrastination

    +   - Making bad decisions

    +   - Poor performance


    If you find yourself experiencing these types of thought patterns, it could very
    well be due to hitting your willpower limit too quickly.


    I know from experience that I typically write my best code in the morning when
    I''m fresh, whereas I find myself running into more development bugs when I work
    later in the evening. When I realized this pattern, it made me believe even deeper
    in the concept of willpower limits and how they can negatively affect performance.


    # Saving up willpower


    With all of this in mind, the concept of saving up our willpower reserves seems
    like a pretty important concept. Let''s go back to the water bottle analogy. If
    you were in a desert and had a limited supply of water, what would you do? I think
    the obvious answer is that you would only use the water when it was needed.


    So, if we treat our willpower like a precious resource, it would make the'
