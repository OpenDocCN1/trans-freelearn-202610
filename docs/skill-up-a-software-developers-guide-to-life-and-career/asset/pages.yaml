- pgno: 148
  md: '# Tips for taking over a legacy application


    While there are a number of techniques you need to apply to work with a legacy
    application, the first should be building a comprehensive test suite.


    # Creating a test suite


    No matter what language or framework that you work in, you will be able to create
    automated tests that capture the functionality of the application. So, in the
    legacy application I was working on I started creating tests for each model.


    I began with basic unit tests and then started branching out to integration tests
    that ensured that the various elements of the codebase were communicating properly
    with each other. Going through this process had the added bonus that I became
    more familiar with the structure of the app and I could refactor the code as I
    implemented the tests.


    # Adding new features via TDD


    Once the test suite was built, I started building all new features via the TDD
    (test-driven development) method, which ensured that the test suite was up to
    date. By utilizing this process, it also made it possible to ensure that the new
    features that I added wouldn''t break pre-existing functionality. This is called
    regression testing.


    # Breaking out specific features into microservices


    The further I got into the codebase, I started to notice that the app had become
    bloated with features, and many of the components didn''t need to be included
    in the core application.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Therefore, I slowly started creating microservice applications that handled
    isolated pieces of functionality. Some examples were: creating a microservice
    that managed the user notification system and building an app that processed the
    reporting engine. After creating the microservices, I could get rid of significant
    portions of the legacy code and then simply wire up the legacy application with
    the new microservices so they communicated properly.


    # DRY up the codebase


    In many legacy applications, you''ll run into duplicate code that causes a number
    of problems, including the issue of having to make one change in multiple places
    in the codebase.


    An example of this was how the application I was working on dealt with view templates.
    There were a number of view files with identical HTML code. I could refactor these
    components into partials that could be shared across the application, which allowed
    me to make a single code change that would populate throughout the app.


    The topic of taking over a legacy application is important to understand, not
    only for the reason of being prepared for what steps you need to take to work
    on a legacy app, but also so you will have a better idea of how to build applications
    from scratch.


    Remembering the Eventbrite application that I mentioned earlier, that application
    was easy to work with and add features to because it had been built from day one
    using each of the techniques mentioned in this chapter.


    If you develop an application from scratch using these best of breed techniques,
    you will make it easier on yourself when you''re adding features in the future.
    It will have the added benefit that any new developers that may work on the application
    in the future will be able to start adding new features easily and they''ll appreciate
    the extra work you put into the development process.'
  merge: -1
  img_proc: true
