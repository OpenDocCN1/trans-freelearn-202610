  md: 'retention of what I was learning, which meant I had to go back and relearn
    the topics that I had already forgotten from the previous semester. I don''t have
    to tell you how stressful this made my academic life, not to mention the fact
    that I was working as a full-time developer at the same time. So, I knew that
    something had to change and I put together a system for helping me retain what
    I learned each day through a consistent study pattern. Much like a function in
    programming, my system for consistent study takes in a few parameters:


    +   - Scheduling

    +   - Fighting procrastination


    For scheduling I created a to-do list, segmented by day, for what I needed to
    study, which included academic papers, books, and watching online lectures. I
    put these in a drag and drop to-do list on Basecamp. After I studied a particular
    item I would drag it up to the next day''s to-do list so I would have a visual
    cue that I was done for that day.


    For me, I would procrastinate studying because staring at the list of the books
    I had to read was intimidating, and this was mainly due to the fact that I didn''t
    set any practical goals for studying. If you stare at a Discrete Mathematics textbook
    and tell yourself to study, it''s natural to want to put it off; however, if you
    set small goals, you''re less likely to put it off.


    With that in mind, I''ll put a note, such as read 3 pages of my Information Retrieval
    textbook, and 3 pages doesn''t sound nearly as scary as the vague "just study"
    mindset. The interesting result in making small, manageable goals for studying
    is that not only does it help curb procrastination, but typically I will also
    read much more than the 3 pages. There have been plenty of times where I set of
    goal of a few pages of a book and ended up reading a few chapters.


    With all this being said, there are times where I plan deep work study sessions.
    In one of these sessions I will set aside 2-3 hours of time to sit down, without
    distractions, and work through a complex topic. However, I always limit the time
    to no more than 2-3 hours per day, and I will usually not study any other topics
    on these days since I''m usually mentally drained by the end of them.'
