  md: '# Chapter 12. Developer Learning Curve – Why Learning How to Code Takes So
    Long


    When it comes to becoming a developer, one of the questions I get asked the most
    is: why does it take so long to learn how to code? I''ve discovered the answer
    can be found in research related to learning curves.


    # What is the learning curve?


    The concept of learning curves has been around since 1885. Typically, the research
    has been performed in the psychological and cognitive sciences. However, the concept
    can be clearly utilized when it comes to learning development.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# The developer learning curve


    The following graph shows the standard learning curve. This was generated by a
    big data analysis algorithm that analyzed the learning patterns of individuals
    in a number of industries. The curve is smooth because it takes the average learning
    process and averages the process.


    ![](img/de22e3e00f8df753e0d57f7da4d1c581_76_0.png)


    Later in this chapter, we''ll take a look at what a learning curve looks like
    for a single person. Over the years I''ve had the privilege of teaching students
    how to become developers. I''ve witnessed this learning curve play out again and
    again. And in this chapter, I want to examine the three stages that all developers
    go through. Additionally, I''ll discuss about how long it takes to traverse from
    one stage to another. The three stages that I''ll discuss are:


    +   - Liftoff

    +   - The twilight zone

    +   - The zone'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# # Liftoff


    Let''s start off by taking a look at the liftoff stage. This is an exciting time
    for new students. During this time students are immersed in learning skills that
    they''ve never seen before:


    ![](img/de22e3e00f8df753e0d57f7da4d1c581_77_0.png)


    Because all the topics that students learn during this stage are new, their expertise
    skyrockets. I like to call this the liftoff stage because it''s easy to visualize
    a new student''s expertise like a rocket ship soaring into the sky into places
    it has never been before. During this time, a student will learn how to:


    +   - Configure a development machine

    +   - Learn a programming language

    +   - Work with various frameworks

    +   - Build functional applications


    This stage usually lasts for the first 250-300 hours that a developer is learning
    how to code. This estimate is based on what I''ve seen with the DevCamp bootcamp
    students and equals around 6-8 weeks of intensive learning.


    As fun as this stage is, it has drawbacks. One of the key problems is that it
    can give students false confidence. When they see themselves building applications
    that actually work, it''s natural to believe that they can dive right into building
    production apps for clients. However, they don''t realize'
  merge: -1
  img_proc: true
- pgno: 78
  md: that they're about to enter... the twilight zone of learning how to code.
  merge: -1
  img_proc: true
- pgno: 79
  md: '# The twilight zone


    After the exciting liftoff stage of the developer learning curve, aspiring developers
    will enter the twilight zone:


    ![](img/de22e3e00f8df753e0d57f7da4d1c581_79_0.png)


    This is a challenging time for students and many students decide to quit programming
    entirely during this stage.


    So why is this time so challenging? After seeing countless students go through
    it, I''ve discovered that there are a number of contributing factors:


    +   - While in this stage, many of the core concepts and commands haven''t cemented
    themselves in a student''s long-term memory. This results in them having to constantly
    look up documentation, query Stack Overflow, and things like that.

    +   - During this time, the novelty of simply having an application work has worn
    off. Now students are asked to perform advanced tasks such as:

    +     - Working with legacy applications

    +     - Debugging defects

    +     - Improving performance

    +     - Building features that they don''t have a step-by-step tutorial for

    +   - Additionally, while working through the twilight zone, students are'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'expected to start implementing best practices. In the launch stage, the primary
    goal was to get applications functional.


    During this next phase, students start learning how to build applications that
    can be used in real-world scenarios. This means that a student may spend five
    times longer to build an application with the identical feature of something they
    created during the launch stage.


    This can be frustrating; however, the increased time spent implementing best practices
    allow the applications to be scalable and flexible enough to be used in production.
    This is in stark contrast to the apps created during the launch phase that don''t
    adhere to industry standards.'
  merge: -1
