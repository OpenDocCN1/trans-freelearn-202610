- pgno: 143
  md: '# Summary


    So, when a client asks you to build a feature that you have zero experience with,
    my advice is to partner with a specialist in that area. The example I gave in
    this chapter was specific to situations where a freelancer has literally no experience
    building a feature.


    There have also been times where I was asked to build a feature I had experience
    with, but I wasn''t comfortable committing to building a production application.
    In those cases, I hired a mentor to answer questions that I had during the development
    process, and those projects turned out quite well. And they had the added bonus
    of teaching me how to build advanced features I had limited experience with.


    In summary, when it comes to managing advanced features for clients, don''t let
    your lack of experience stop you from getting jobs. As a freelancer, you have
    access to a nearly limitless supply of resources to help you build any project.'
  merge: -1
