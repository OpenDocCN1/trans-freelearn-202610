- pgno: 132
  md: '# # Chapter 23. Freelancing Tips – Knowing When to Fire a Client


    If you''re starting on your freelance journey, or still even considering it, the
    topic of this chapter may seem insane. However, I can ensure you that knowing
    when to fire a client is a critical component of building a successful freelance
    business. It can also sharpen up the same decision-making skills you use every
    day as a developer in general.


    # ## My urgent client


    A few years ago, I was hired by a fast-rising startup. The company had skyrocketing
    growth, and I was hired to build their platform. After going through the interview
    process, I was hired. Soon after taking the client, I met with a developer who
    was leaving the organization.


    After the developer walked me through the system he gave me a word of warning.
    He mentioned that the CEO of the company had a favorite word: **urgent**. I filed
    the information in the back of my mind and started working on the application.
    Within days, I learned why the previous developer left the fast-growing startup.
    Literally EVERY email the CEO sent me contained the word urgent in some form or
    another.


    Through the course of around a year I worked with the company and built out the
    full system. However, I noticed that my quality of life was negatively affected
    by this single client. My nights and weekends were no longer filled with spending
    time with my family. Instead that time was spent working through countless urgent
    tasks from the client.


    # ## When to fire a client


    After a while it dawned on me that if I continued to work with this client, I
    was actually losing the benefits of being a freelancer. Being a freelancer is
    supposed to result in freedom and making my own schedule, right?'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Once I realized that this client was making my life worse instead of better,
    I put a plan in place and told him that I would no longer be working with him.
    Through that experience I developed a system for deciding when to fire a client.
    There are three criteria that have to be met, and I''ve listed them here.


    # #1 – being treated like an employee


    First on the list for deciding when to fire a client is when you are treated like
    an employee. Being treated like an employee typically means that you''re expected
    to be on the company''s schedule and thus limit your own freedom/flexibility.
    I have had multiple times where a client appeared to forget that I was a freelancer.
    Some telltale signs of this happening are:


    +   - *When a client is frustrated that they can''t communicate with you 24/7.*
    I once had a client that I had to fire because their employees would send me Skype
    messages all day and night for trivial issues. And then they would be frustrated
    if I didn''t respond immediately.

    +   - *No organized communication.* Over the years, I''ve had clients who would
    let multiple employees message or call me any time they needed a task completed.
    It''s important to have a set number of project stakeholders. If a client lets
    any/all employees send you requests it''s pretty much guaranteed that communication
    conflicts will occur.


    When I realize that a client is treating me like an employee, I''ll approach the
    CEO or whoever my direct report is, and I''ll convey my concerns. Many times,
    this will fix the issue. However, there have been times where the problem persists
    and I have been forced to fire the client.


    # #2 – tyranny of urgent


    Returning to my story from the beginning of this chapter, a top reason for knowing
    when to fire a client is when they can''t separate urgent from normal tasks. I
    remember a time where this specific client set up a project management job board.
    I kid you not, 90% of the tasks were marked with the tag urgent.


    Not only is this a stressful situation, it is also a recipe for failure. When
    all'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'tasks are marked as urgent it essentially means that none of them are urgent
    because there''s no designation between the projects.


    In the book *Rework*, *Fried* and *Hansson* recommend that companies remove the
    word urgent from their dictionaries. I highly recommend this approach.


    Typically, when a client marks tasks as **urgent** or **ASAP**, it means that
    they don''t know how to properly manage a project. And poor project management
    skills are not an attribute you want in a client, because a client who doesn''t
    know how to manage a project will eventually blame you for not implementing their
    plan properly.


    # #3 – toxic environment


    Last on the list for knowing when to fire a client is when it''s a toxic environment.
    I''ve been fortunate to not run into this situation very often. However, over
    the years I have a had a few toxic clients. Being toxic can take a number of forms,
    including:


    +   - Constant negativity

    +   - Poor communication

    +   - Unrealistic deadlines

    +   - Moral/integrity issues


    I can think of one client that embodied each of these traits. He hired me to build
    an application and gave an incredibly vague list of requirements. Throughout the
    build of the project I would send daily project updates and he would go weeks
    without giving feedback at all.


    When I would hear from him, all his comments were negative. In many of the cases
    he would be upset for not implementing features that he had never even mentioned
    in his vague list of features. Needless to say, I fired the client on the spot
    and moved on to greener pastures.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# The joy of firing a client


    When I started out as a freelancer the thought of firing a client seemed crazy.
    However, as I built up my business, I came to the realization that firing a client
    that constantly brought stress into my life actually resulted in making me a better
    freelancer.


    Toxic clients are not fun to work with. They cause anxiety and kill the joy that
    freelancing should bring. So, I''m constantly pruning my client list. And the
    more experienced I get as a freelancer, the better my client list has become.
    This has resulted in more joy for me and better performance in regard to what
    I produce for clients.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# # Chapter 24. Dodging Silver Bullets for Scalable Freelance Projects


    Does the idea of a code library fulfilling a significant portion of a freelance
    project that you''re contracted into, sound appealing? It''s OK, you can be honest
    and say yes, whether you''re an active freelance developer today, or will be in
    the future.


    When I started out on my freelance journey, any time I came across a large feature
    request, the first thing I''d do was check to see if there was a code library
    that took care of the requirement. In the development world, code libraries like
    these are called silver bullets.


    However, as appealing as it may sound for a plugin or library to take care of
    the lion''s share of a project, it''s been my experience that this approach ends
    up taking longer to implement than simply building the components from scratch.


    # ## The problem with silver bullets


    Let''s start off with a practical case study. A few years ago, I took on a fleet
    management project. The set of requirements included features such as:


    +   - Having full CRUD capabilities for a number of database tables

    +   - Creating a search engine that could search through various attributes of
    each database table

    +   - The ability to use filters to drill down data

    +   - And a number of other items related to a reporting dashboard


    After starting the project, I started to research code libraries that would work
    as silver bullets and take care of the key features. After a few days, I came
    across the RubyGem called rails admin. The rails admin gem is pretty impressive.
    It includes features such as:'
  merge: -1
  img_proc: true
- pgno: 137
  md: '+   - Easily querying database tables

    +   - Implement custom filters for running advanced queries

    +   - Export records to Excel/CSV

    +   - Add new records from the dashboard

    +   - Edit/delete records


    As you may have noticed, this code library looks like it fits nicely with the
    set of requirements for the project I had.


    # Silver bullet customization


    I quickly went to work building out the application. And I integrated the rails
    admin gem as a cornerstone component of the project. The client was ecstatic during
    the demo. They absolutely loved the application and they were shocked I could
    build the app so quickly.


    So, what was the problem? The issues started when the client started to ask for
    new features. After testing the application out for a few weeks, they came back
    with feature requests such as:


    +   - Being able to save common queries

    +   - Export out to rare file formats that worked with their accounting system

    +   - Integrate a tax API to calculate depreciation


    Each of these new features are relatively common requests for a fleet management
    system. There was just one problem. Because I built the entire application around
    the rails admin code library I was limited to the features that the gem offered.
    And this was a problem because rails admin turned out to be incredibly difficult
    to modify.


    In fact, after several weeks of tedious work, I concluded that it would take less
    time to build the entire system from scratch as opposed to customize the gem itself.
    So, the end result was that I wasted quite a bit of time and the project was delayed,
    all because I thought a single silver bullet code library was going to be able
    to take care of a significant portion of the application.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Becoming a sharp shooter with code libraries


    So, does this mean that I''m suggesting that you stay away from code libraries
    entirely? No, not at all! Part of the reason why freelancing is possible (and
    affordable for clients) is that you don''t have to create 100% of an app''s functionality
    from scratch.


    Instead, I''ve learned to be selective about the code libraries that I integrate.
    Let''s look at a couple of the code libraries that I regularly use on projects:


    +   - **Pundit**, for building a permission structure. Pundit is a lightweight
    code library that is easy to customize and doesn''t lock you into a narrow set
    of permission features.

    +   - **Devise**, for authentication. Writing an authentication system from scratch
    is time consuming. The Devise gem allows Rails developers to quickly integrate
    features such as registration, login, logout, and advanced components such as
    secure password retrieval. Additionally, Devise is customizable and I''ve rarely
    run into a situation where it didn''t work for an app''s requirements.


    Do you notice how these code libraries operate like helper libraries for specific
    features? My rule for integrating code libraries into projects is that I pick
    out packages that assist with small elements of a project. And I shy away from
    silver bullets that promise to take care of large portions of a project''s functionality,
    but are difficult to customize.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Chapter 25. A Freelance Guide to Managing Advanced Features


    One issue that every freelancer comes across at some time or another is managing
    advanced features. And by advanced features I mean that a client asks you to build
    functionality that you''ve never built before when this happens to you.


    Notice that I said *when* and not *if*? That''s because every freelancer, no matter
    how experienced, has been asked to build something they''ve never created before.


    # Managing advanced features


    Over the years, I''ve been asked to build a wide range of features. Some of them
    I had experience with, and others... not so much. A good example of this was a
    number of years ago when I was asked to build out a GPS tracking iPhone app. The
    client wanted to track their employees in the field and allow them to remotely
    submit tickets. Sounds like a great idea, right? I thought so too. There were
    just a couple of issues:


    +   - At the time, I hadn''t built a single mobile application, much less a production
    app

    +   - My experience with real-time GPS tracking was minimal


    Due to my lack of experience, my first thought was to pass on the project. However,
    the client was a Fortune 500 company and at the time I did have long-term plans
    on building out my mobile portfolio. Not to mention that the job paid well over
    $100,000. With these factors in mind I took the offer.'
  merge: -1
  img_proc: true
