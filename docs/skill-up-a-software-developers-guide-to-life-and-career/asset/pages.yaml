- pgno: 155
  md: '# When should you start over?


    So far, this chapter has heavily favored refactoring an application. However,
    there are times when starting over from scratch is a better approach. Some of
    the rationales that make starting over a wise decision for the client are:


    +   - **A complete change in architecture**: I have had clients who requested
    that I migrate an application from being a monolith (a large single application)
    to becoming microservice-based (a number of applications that each perform a single
    feature). In cases like this, it wouldn''t make any sense to try to keep the legacy
    application since the core application structure would have to change.

    +   - **Moving to a different language/framework**: Over the years, I''ve had
    a number of clients who had old ASP .NET and PHP applications approach me to rebuild
    their systems in Ruby. When it comes to changes languages or web frameworks it
    wouldn''t be possible to retain the legacy application.


    Notice how both these key reasons had nothing to do with bugs or messy code? The
    only time I''d recommend for a client to start over from scratch is if it''s literally
    impossible to retain the legacy application.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Summary


    In summary, the key to remember is to go through the system of checks whenever
    you''re asked to decide between starting over versus refactoring. The more experienced
    you get as a developer, the more you''ll realize that it''s incredibly rare that
    a functioning legacy application cannot be saved.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# # Chapter 29. Should You Use TDD on Freelance Projects? – Comparing Quality
    Versus Speed


    When approaching a new freelance project, one of the first questions many developers
    and designers ask is:


    > *Do you want it done fast… or properly?*


    In this chapter, I''m going to specifically discuss if you should use TDD on freelance
    projects. However, the concepts I''ll discuss now apply to any type of quality
    control system. So, this is great advice for any developer.


    # ## Quality versus Speed


    There''s an old software engineering rule that states that there are three options
    you have when building a project:


    +   - Quality

    +   - Speed

    +   - Cost'
  merge: -1
  img_proc: true
- pgno: 158
  md: '![](img/de22e3e00f8df753e0d57f7da4d1c581_158_0.png)


    This diagram represents the principle as a Venn diagram. The elusive center is
    where you have a project that''s built quickly, for a low price, and was created
    with industry-wide best practices. In my experience, it''s rare for a project
    to reside inside of this sweet spot. Instead, I''ll tell clients that they can
    pick two out of the three. For example:


    +   - You can have the project built properly for a low cost, but it''s going
    to take quite a while to develop. This is because the project will need to sit
    on the back burner since higher paying projects will need to take precedence.

    +   - Alternatively, the project can be built quickly at a low cost. However,
    this approach won''t allow for the time needed to follow best practices, such
    as building automated tests into the application. I'
  merge: -1
