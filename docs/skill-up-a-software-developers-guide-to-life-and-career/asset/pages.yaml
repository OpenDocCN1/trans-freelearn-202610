- pgno: 276
  md: '# Chapter 52. Is it Possible to Lose Your Coding Skills?


    This topic was inspired by a Boing Boing article (http://boingboing.net/2016/06/08/coder-fired-after-6-years-for.html)
    that tells the story of a QA developer who spent 6 years working for a company
    and literally did nothing besides playing computer games, browsing Reddit, and
    wasting his time.


    The Reddit user, FiletOfFish1066, posted his story to the site and it instantly
    became a supreme case study for what happens when you don''t continue to develop
    your coding skills.


    After not working for 6 years, he says that he has completely forgotten how to
    develop and now he''s out of a job. The story goes that he started working as
    a software tester and realized that, by writing some scripts, he could fully automate
    his job. So, he worked for about 8 months building testing scripts and after that
    he simply let the tests run. He didn''t have to do anything besides kick back
    and play video games all day. There are a number of lessons that developers can
    learn from this story and that''s what I want to cover.


    I don''t really blame the employee in this case. Apparently, there was such little
    oversight in his organization that he could get away with not working for 6 years.
    That tells me that the company he worked for has serious structural problems to
    let that go on for so long. It should be noted that many organizations are employing
    people to do work that software can do, but instead are choosing to waste money
    with archaic manual processes.


    This developer started his job doing exactly what he should have done. He recognized
    that there was a way to automate his job, which was a great first step. If he
    would have gone to the management and shown what his automated script did, he
    would have most likely been promoted for his expertise and would have a great
    career right now.


    It''s possible to lose your coding skills. If a world class bodybuilder'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'would stop going to the gym, eventually he''d lose his muscles. In the same
    way if you stop honing your craft as a developer, you''ll eventually lose your
    programming skills.


    A few years ago, I met with a gentleman who was the vice president of software
    development at a large energy services company. He got into the position by selling
    software that he had built himself, which has become the industry standard and
    currently processes billions of dollars in transactions each month. Even though
    this individual used to be at the top of his field as a developer, since he became
    an executive, he got further and further away from coding the application, and
    he admitted to me that he wouldn''t even be able to build a simple program now.


