  md: '# # Chapter 62. Best Questions to

    # Ask During a Job Interview


    In this chapter, I''m going to discuss the **best questions to ask during a job
    interview**, and I will also discuss the other side of the spectrum and list out
    some key interview questions to avoid at all costs.


    If you haven''t been through many job interviews for a while, or haven''t really
    ever prepared for one before, you may have the thought:


    > > "I thought the interview was about them asking me questions."


    However, one very important, and many times overlooked facet of a good interview
    is asking strategic questions of the interviewer. In fact, Forbes researchers
    have outlined three goals that your questions should achieve:


    +   - Make sure the interviewer has no reservations about you

    +   - Demonstrate your interest in the employer

    +   - Find out if you feel the employer is the right fit for you


    Interviewers like being asked questions. The questions you ask can reveal quite
    a bit about yourself, good and bad, therefore it''s critical to ask the right
    questions. If you don''t ask an interviewer questions, he or she may assume that
    you don''t really care about the job itself and you''re simply looking to make
    enough money to pay your rent.


    Interviewers want to find candidates excited about working with their company.
    Remember that if you''re hired, you are going to be a reflection of the interviewer
    and will help or hurt their reputation. Anytime that I''ve hired an employee that
    turned out to be bad for an organization, the management has approached me and
    asked why I hired them and how did I miss their shortcomings.


    I kid you not, I hired an individual for a job around five years ago that turned
    out to be a horrible employee and our CEO still gives me a hard time about the
    hire half a decade later! So, make sure to take all of that'
