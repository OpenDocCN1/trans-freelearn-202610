  md: '# # Chapter 17. Practical Ways to Use the Pomodoro Technique as a Developer


    As we continue to work through ways to hack the developer''s mind, the focus of
    this chapter is going to be on increasing productivity. Specifically, we''re going
    to analyze practical ways to use the Pomodoro Technique.


    I''m constantly researching new ways to improve my personal productivity. And
    through my journey as a developer, a popular approach that I''ve discovered is
    the Pomodoro Technique. This is a process that I''ve utilized and I credit it
    with allowing me to focus on a large number of tasks each day.


    Don''t let the weird name scare you away. The Pomodoro Technique is a dead simple
    productivity system that focuses on splitting tasks into timed intervals throughout
    the day.


    # ## Practical ways to use the Pomodoro Technique


    One of the greatest strengths of the Pomodoro Technique is how easy it is to implement.
    The process that I follow is:


    +   1. Each morning I pick out the tasks that I want to accomplish that day.

    +   2. I then decide how long each task will take. The Pomodoro Technique works
    on point system. Each time you work through a 25-minute task you earn a point.

    +   3. Typically, I try to earn 10 Pomodoro points each day. This means that if
    I have 3 tasks that I know will take an hour each, I will earn 6 points for those
    tasks. And it means that I have 4 additional 25-minute slots available for the
    rest of the day.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Taking a break


    Did you notice how I kept saying 25-minute time slots? There is a reason for the
    odd number. The Pomodoro Technique places a high priority on taking scheduled
    breaks. After completing each 25-minute task, you take a 5-minute break. During
    this free time, you can do anything you want. You can get on social media, you
    can take a walk around the block, or anything that you want to do. Just make sure
    that your break does not exceed 5 minutes.


    Also, after you''ve completed 4 tasks it''s recommended that you take a 15-minute
    break. However, you can tailor your breaks and intervals to what works best with
    your schedule. By planning breaks throughout the day, you will decrease your chances
    of burn out. And I''ve noticed that I no longer feel bad about doing things such
    as checking my Instagram account or Hacker News throughout the day, because I
    can fit my guilty pleasures into my scheduled free time.


    This is one of the aspects that I truly love about the Pomodoro Technique. Many
    of the other productivity systems I''ve tried in the past tend to lead individuals
    towards burning out. However, the Pomodoro approach allows you to have a sense
    of balance.


    # Lifestyle versus fads


    Have you ever tried dieting before? When I was younger I struggled with my weight
    and to help fix it, I tried a number of intense diets. This included nutrition
    strategies such as dramatically decreasing calories, or killing off carbs. However,
    I noticed that I''d stay true to the diet for a few weeks or even a few months,
    but eventually I would fall back into poor eating habits.


    Once I recognized this trend I moved to having a balanced approach to eating.
    I stopped trying nutritional fads and I transitioned my focus into eating in a
    way I felt I could eat for the rest of my life.


    I made this change in my nutritional approach a few years ago and it''s completely
    stopped my roller coaster dieting and weight loss and weight'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'gain.


    # A lifestyle of productivity


    In the same way when I was younger I fell into the same pattern with working on
    tasks. I''d get excited about working on a project or learning a new programming
    language. And I would spend countless hours working on what I wanted to accomplish.


    However, this approach inevitably led to burning out and large stretches of time
    where I didn''t want to work at all. I look at the Pomodoro Technique in the same
    way that I look at having a balanced diet. By limiting the number of tasks that
    I work on each day and by implementing planned breaks between each task, I no
    longer burn myself out.


    Additionally, after I have finished my work for the day and have earned my 10
