    and can be understood even by non-technical individuals.

    4. **Leads the development process**: One of the most important keys to writing
    good software is to break code into as many small, manageable chunks as possible.
    When you use TDD you should naturally write small methods, efficient class definitions,
    and you should have minimal code bloat. When you''re following TDD practices the
    tests themselves should lead the software''s development, and the end result should
    be a well-organized and scalable code base.


    One caveat to TDD is that testing is pointless if the test suite is not well structured.
    If you simply create a myriad of tests that do nothing more than test the core
    functionality of a language or framework, your test suite isn''t going to have
    any benefit. However, if you build an application and let the tests drive your
    development and code structure, you will end up with a great application that
    you should be proud of.


    For further information, I recommend reading the full series by *Martin Fowler*,
    which is seen as one of the most in-depth discussions on TDD ever produced.'
