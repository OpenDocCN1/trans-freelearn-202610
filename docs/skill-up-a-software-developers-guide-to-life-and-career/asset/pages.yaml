  md: '# Chapter 37. Managing Client Conflicts as a Freelancer


    In this chapter, I''m going to discuss *managing client conflicts*. It''s simply
    a matter of life and business that you will run into conflicts with clients.

    Some of the most common confrontations seem to be:


    +   - Going over the time you originally estimated

    +   - Going over the budget for the project

    +   - Not delivering a feature that matched the client''s expectations

    +   - A bug occurring in an application


    None of these are fun to work through, and most of them can be avoided if the
    proper care is taken at each stage of the project management process. However,
    I want to discuss what happens when conflicts occur and how to best manage them.


    # Strategies for managing client conflicts


    First and foremost, do not let emotions take over. This is probably one of the
    hardest ones for me because I love what I do and when bad things happen in a project
    my first response is to get defensive, which is one of the worst responses to
    have. So, when I see an angry message come through from a client or take a phone
    call, I make sure that before I respond I sit back and try to look at the situation
    from the client''s perspective.


    It''s pretty rare that a client will get upset for no reason. The majority of
    people are rational and prefer to stay away from confrontation, so if the client
    is mad there is probably a legitimate reason for it. Therefore, the first step
    I take is pretending that I''m the client and then I feel like I can give a better
    response from that perspective.


    If a project went over budget and I''m imagining that I''m the client, I can'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'understand why they''re not happy because I don''t like spending more money
    on something than I originally was told it would cost. So instead of responding
    with some defensive messages, such as:


    > "It wasn''t my fault, you were the ones that changed the scope"


    Or


    > "I can''t control that the fact that the designer took twice as long to deliver
    the mocks"


    I''ll start with saying things that show that I understand their perspective,
    for example I''ll say:


    > "I completely understand how frustrating it is, the project scope has grown
    and it''s been hard to meet all of the requirements based on the original timeline"


    Or


    > "I am sorry, I should have allotted more time for the design phase, it''s my
    fault and I will work to get it taken care of"


    If you pretend that you''re a client hearing those four responses, which ones
    would put you more at ease? The ones where I was defensive and tried to blame
    everyone else or the ones where I took responsibility for the project and gave
    a calm reply?


    The easy thing to do in a confrontation is to become defensive or respond aggressively;
    however, neither of those approaches will fix the issue and they''ll most likely
    make things worse.


    > Your first goal when a conflict arises between yourself and a client should
    be to see if you can see the issue from their perspective.


    With that being said, there will be times where the core problem is the client''s
    fault. They may be very bad at stating project requirements or they may simply
    be poor communicators.I once had a client who hired me a few years ago and asked
    me to build an application and simply gave me about 4-5 screenshots from another
    website and then they'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'completely disappeared. I did my best to build what I guessed they wanted and
    I sent daily updates to them, and then a month later he messaged me furious that
    the app wasn''t what he wanted and then went on to list all of the features it
    was missing, even though they were features he had never asked for originally.


    I calmly fired him as a client on the spot and informed him that I wouldn''t be
    able to work on the project any longer. I didn''t raise my voice, I didn''t explain
    how he gave me little to no guidance for building the app, but I knew it wasn''t
