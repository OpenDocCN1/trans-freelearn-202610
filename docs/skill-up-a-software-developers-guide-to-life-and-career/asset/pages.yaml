  md: 'effective:


    +   - **TDD/BDD**: Regardless of your thoughts on test- or behavior-driven development,
    there''s no denying that if they''re implemented properly it can lead to a well-constructed
    codebase. TDD naturally leads to following best practices such as low coupling
    and small methods, and with its refactoring step, I''m a huge fan of using it
    to ensure that an application is built the right way.

    +   - **Continuous integration**: Assuming that you have a comprehensive automated
    test suite, continuous integration tools such as Codeship or Travis will make
    sure that code will not be pushed to production until it''s passed the full test
    suite. I''ve had a number of times where Codeship has blocked a bad deploy that
