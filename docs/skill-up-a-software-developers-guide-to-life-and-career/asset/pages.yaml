    *Skill Up: A Software Developer''s Guide to Life and Career* is an all-purpose
    toolkit for your programming career. It has been built by Jordan Hudgens over
    a lifetime of coding and teaching coding. It helps you identify the key questions
    and stumbling blocks that programmers encounter, and gives you the answers to
