    to go through the processes I''ve used throughout the past few years and discuss
    when each option is ideal.


    # Screencast


    The first option I''ll review is creating a screencast. This is a great option
    if there are a number of clients that will need to review the feature:


    ![](img/de22e3e00f8df753e0d57f7da4d1c581_175_0.png)


    At its core, a screencast is you recording yourself walking through the application.
    If it''s a web-based application, you can have the video'
  merge: -1
