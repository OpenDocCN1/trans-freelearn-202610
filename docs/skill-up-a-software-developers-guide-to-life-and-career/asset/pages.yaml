  md: "# Chapter 56. A Practical Guide to Approaching Project Development\n\nOne of\
    \ my favorite parts of being a teacher is interacting with students. And this\
    \ chapter will focus on answering a viewer's question regarding strategies to\
    \ **approaching project development**.\n\n# Student question\n\nThe following\
    \ is a letter I received from Christian, a developer from Germany:\n\n> *Starting\
    \ web development a year ago, I'm currently building my first own commercial product\
    \ (a classified ad site) using Rails. I really would like to hear your advice\
    \ on how you approach building features on apps, as I have the following problems:*\n\
    > \n> *I can't really plan a feature from start to end because I always think\
    \ I'm missing something important*\n> \n> *Procrastination and being afraid to\
    \ make errors that will be costly to correct in the future*\n> \n> *How do you\
    \ approach building features when you don't know the scope exactly?*\n> \n> *What`s\
    \ your process, how do you get unstuck?*\n> \n> *Best regards,*\n> \n> *Christian*"
