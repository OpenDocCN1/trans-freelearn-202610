- pgno: 152
  md: '# Starting over versus refactoring


    When I was a young and naive freelancer I dreaded the idea of refactoring a legacy
    application. The second that the client brought up the possibility of starting
    over from scratch, I jumped on it!


    However, the more projects I work on, the more my mindset has changed. Over the
    years I''ve put together a system to help me decide between starting over versus
    refactoring a project. And that''s what I''m going to walk through here. The steps
    I follow are:


    +   1. Removing the fear factor.

    +   2. Analyzing the 80/20 principle.

    +   3. Building an automated bug list.

    +   4. Becoming the client.


    # #1 – removing the fear factor


    One of the reasons why inexperienced freelancers tend to opt for starting a project
    over is because of fear. And fear is rarely a good reason to make any decision
    (unless you''re running away from a wild animal or something like that). So, before
    I make a decision, the first task I perform is taking fear out of the equation.
    I''ll ask myself:


    > "If you weren''t afraid of the unknown issues with this codebase, what would
    your decision be?"


    Once fear has been removed I can look at the project from an unbiased viewpoint.


    # #2 – analyzing the 80/20 principle


    The 80/20 principle has a number of practical ramifications. You may have heard
    it being used to say that 20% of the people make 80% of the wealth. Or that 20%
    of a customer base generates 80% of a company''s revenue. However, I''ve also
    seen that the 80/20 principle can work well for deciding between starting over
    versus refactoring.'
  merge: -1
  img_proc: true
