- '## 第51章 开发者学习选项——实际分析


  整个世界似乎都在谈论成为程序员的重要性。然而，其中许多讨论并不切合实际。本章将梳理当今可用的各种开发者学习选项，并帮助你判断哪种选项适合你和你的目标。


  ### 编程专业程度


  如果你是开发新手，应该做的第一件事就是确定自己为什么想学编程。学习编写代码的原因有很多，包括：


  - 成为专业开发者

  - 提升当前职业的技能

  - 为乐趣或业余项目而学习


  确立目标很重要，因为它们将决定你在学习编程时应采用何种学习策略。我们来逐一看看。


  ### 成为专业开发者


  如果你的目标是成为专业开发者，那么恭喜你！你将加入世界有史以来增长最快的行业之一。薪酬优厚，合适的开发者职位既有趣又有回报。然而，伴随所有这些好处而来的是一套严格的学习要求。


  专业编程职位要求你精通一门编程语言和几个框架。而且，对大多数工作来说，仅仅构建能够正常运行的应用是不够的。相反，你需要构建遵循以下流程的应用：


  - 测试驱动开发和行为驱动开发

  - 可扩展且符合行业最佳实践的整洁编码风格

  - 与开发团队协作，并熟练使用代码版本控制系统


  而且这样的要求还有很多很多……


  ### 开发者训练营


  任何平台或指南如果说你能在一个月内成为专业开发者，或者诸如此类的说法，那纯粹是在骗你。成为专业开发者需要数年时间。我已经做了十多年开发者，而且我每天仍在学习。话虽如此，如果你想把开发作为职业，有无数资源可以帮助你实现目标。


  就我个人而言，我建议从开发者训练营开始。训练营让你在几个月的时间内完全沉浸于一门语言或框架。而且很多训练营——包括我自己运营的 DevCamp——会在你完成课程后提供就业保障。


  这些沉浸式项目并不轻松，也不便宜。它们通常需要每周约40小时的学习和实践。而且你会发现费用从大约5千美元到2万美元不等。这看起来可能很贵；但是，有多少培训平台能保证你学习几个月后就找到工作呢？


  ### 这实际吗？


  我一方面说开发者训练营能帮你在几个月内获得编程工作，另一方面又说成为专业开发者需要数年时间，这看起来像是自相矛盾。让我告诉你软件世界里一个鲜为人知的小秘密……许多从事开发者工作的人并不是专业程序员！


  从编码训练营被录用后，你很可能是一名初级开发者。那些聘用训练营毕业生的公司明白，他们通常是编程新手，因此公司会主动承担起继续培养新员工的责任。


  这是一个双赢的局面。开发者可以在经验有限的情况下获得高薪工作。而软件公司可以培训开发者遵循其组织特定的流程。


  ### 提升当前职业技能


  对学习编程产生兴趣的另一个绝佳理由是提升当前职业。我来举一个很好的例子说明这一点。我有一个好朋友，他整个求学期间都专注于商科。大学毕业后，他去一家能源公司工作，然后意识到自己攀爬企业晋升阶梯的速度远不及预期。他最初来找我商量，想知道要怎样才能转行成为一名全职开发者。和他聊了几分钟后，事情变得很明显：他并不是真的想成为一名程序员，他只是对当前的工作感到沮丧。


  于是，我开始问他工作中需要处理哪些类型的任务。他在公司的供应链部门工作，他的职责是仔细梳理车队管理数据并生成报告。我建议他学习编程基础知识，然后把重点放在数据科学上。


  几个月后，他成功构建了一个大数据分析程序，能够管理他的整个部门。当他向公司高管展示成果时，他们对该程序印象深刻，于是他得到了晋升和大幅加薪。现在我和他聊天时，他不再提离开工作的事了。相反，他谈论的是他多么热爱这份工作，以及他不断寻找将自动化机制整合到工作中的新方法，以改进他所做的工作。


  ### 这实际吗？


  如果你认为这种情况符合你的目标，那么你可以走一条与专业开发者截然不同的路。你可以参加在线课程，这些课程会带你完成一些实践项目，你可以根据自己的需要重新调整这些项目。


  例如，我刚才提到的这位员工并不是从头学习如何构建机器学习算法。事实上，即使上一门入门级计算机科学课，他也会完全摸不着头脑。相反，他参加了我的一门编程课程，并看到了我构建的决策树如何能被用到他的部门。在修改了数据点之后，他就能将其用于自己的具体需求。


  ### 为乐趣或作为爱好而学习


  这是一种有趣而放松的学习方式。如果你有一个一直想构建的业余项目，或者你只是单纯喜欢学习，那么你会发现有各种各样的资源能帮助你实现目标。


  当人们问我为了好玩而构建代码项目该从哪里开始时，我通常会把实用教程指给他们看。如果你只是为乐趣而学习，你完全不必浪费时间在复杂的计算机科学主题上。相反，你可以专注于那些一步一步指导你如何构建项目的指南。


  对于这类指南，你可以在 Udemy 等网站上获取价格亲民的课程。这类课程的好处在于它们附带：


  - 视频

  - 书面指南

  - 你将构建的项目的源代码


  这种学习方法是一种了解开发的绝佳方式。你永远无法预料，从业余项目开始，或许最终会让你更上一层楼，去学习专业编程。


  ### 总结


  总而言之，我希望以上内容对可用的各种开发者学习选项有所帮助。我建议你了解每种选项，并诚实地审视哪一种适合你。无论你如何决定，学习编码都是一次很棒的经历，我建议每个人都以某种形式去学习它。

  '
- '## 第52章 你的编码技能有可能丧失吗？


  这个话题源于 Boing Boing 上的一篇文章（http://boingboing.net/2016/06/08/coder-fired-after-6-years-for.html），该文章讲述了一位
  QA 开发者的故事：他为一家公司工作了6年，除了玩电脑游戏、浏览 Reddit 和浪费时间之外，简直什么也没做。


  Reddit 用户 FiletOfFish1066 将他的故事发布到该网站，故事立刻成了一个绝佳案例研究，说明了当你不再持续培养编码技能时会发生什么。


  他说，在6年没实际工作之后，他已经完全忘记了如何开发，而现在他失业了。故事是这样的：他一开始做软件测试员，就意识到通过编写一些脚本，他可以把工作完全自动化。于是，他花了大约8个月时间构建测试脚本，之后他就只是让测试自己运行。他什么也不用做，只需整天悠闲地玩电子游戏。开发者可以从这个故事中吸取很多教训，这正是我想谈的。


  在这个案例中，我其实并不责怪那名员工。显然，他的公司监管如此松懈，以至于他可以6年不工作而不受处罚。这让我觉得，他所在的公司有严重的结构性问题，才会让这种情况持续这么久。值得注意的是，许多组织雇佣人来完成软件本可以完成的工作，却宁愿用过时的人工流程浪费钱。


  这位开发者在工作一开始做了他完全应该做的事。他意识到有办法让他的工作自动化，这是很棒的第一步。如果他当时去找管理层，展示他的自动化脚本做了什么，他很可能已经凭自己的专业能力获得晋升，并且现在就拥有一个很好的职业前途。


  编码技能是有可能丧失的。如果一位世界级健美运动员




  就会停止去健身房，最终他会失去肌肉。同样，如果你停止磨练作为开发者的手艺，你最终会失去编程技能。


  几年前，我见过一位先生，他是某大型能源服务公司软件开发副总裁。他是通过销售自己构建的软件进入这个职位的，该软件已成为行业标准，目前每月处理数十亿美元的交易。即使这位人士曾经作为开发者处于自己领域的顶峰，自从他成为高管以来，他与编码应用的距离越来越远，他承认自己现在甚至连一个简单的程序都构建不了。


  我刚读完 *Anders Ericsson* 和 *Robert Pool* 合著的书 *Peak*，书中提供了医学领域的案例研究，显示最有经验的全科医生并不总是比经验较少的医生更优秀。书中解释说，平均而言，全科医生在行业中工作的时间越长，他们专注于学习的时间就越少，因此他们开始失去部分专业技能。


  令人惊讶的是，实际上是最近完成进修并接受过大量培训的医生表现最好。作者也指出，在专科医生方面存在例外情况。例如，每天进行手术并不断磨练手艺的癌症专科医生，表现比经验较少的外科医生更好。


  我认为这对开发者来说是一个很好的例子，因为根据我自己的经验，如果我不每天使用开发技能，它们就会萎缩。说到开发，真的没有中间地带，你要么在变好，要么在变差，不会保持不变。


  那么你如何确保自己始终在进步并且不会失去编码技能呢？以下是一些我使用的实用建议。


  **每天学习关于开发的新知识**并有意识地进行学习。事实上，就在昨天，我自学了如何将 growl 通知集成到 Rails 应用中 (https://rails.devcamp.com/professional-rails-development-course/advanced-user-features/how-to-integrate-growl-type-notifications-rails-app#.V2G-uD4TDUQ.twitter)，这是我以前从未做过的事情。


  **如果你只是重复过去做过的工作，你就不会进步。** 回顾我们关于全科医生的案例研究，研究表明，老年医生技能下降的原因是他们每天重复做相同的工作，最终他们唯一能正确执行的就是每天重复的事情。


  说实话，这部分并不太有趣，这也是为什么只有少数人会这样做。学习新且具有挑战性的技能可能会令人望而生畏和压力。在同一本书 *Peak* 中，作者说他们研究的每个领域中所有顶尖表演者都有的一个共同特征是，他们愿意刻意练习自己觉得困难的技能，因为只有通过掌握这些技能，他们才能在职业上成长。


  开发者实施这种刻意练习方法的实用方式是写下你从未在应用中构建过的功能列表。然后，每天花时间直到你成功构建每个组件。完成该功能列表后，再创建一个新列表。我个人有一个我工作和学习用的列表，它帮助我确信我每天都在学习新东西，并且我作为程序员不断进步。


  最后顺便说一下，我有多个人给我发消息询问 Boing Boing 上的那个故事，问开发者是如何创建脚本来自动化他的工作的。没有进一步的细节，不可能确定；然而，由于他在测试部门，我猜他构建了一个测试套件，使用诸如
  Capybara (https://rails.devcamp.com/professional-rails-development-course/application-build/bdd-index-view)
  之类的工具来运行软件并生成功能报告。所以这就是我的猜测。


  ### Summary


  我希望本指南能激励你有意识地进行练习，并且你将不断作为开发者进步。

  '
- '## Chapter 53. Is Writing Bad Code Immoral for Developers?


  在本章中，我将讨论一个有点奇怪的问题：为开发者编写坏代码是否不道德？这引出了编写良好代码的重要性这一概念。


  这个问题乍一看似乎很奇怪，因为大多数开发者的思维方式是代码项目既不道德也不不道德，它们只是执行各种功能的编程文件。我希望大多数开发者为自己的工作感到自豪，因此希望编写符合最佳实践的代码。然而，由于进度和预算限制，许多项目会退化，首要目标变成仅仅能工作并尽快完成。


  然而，这种思维方式可能导致诸如：功能缺少边界情况以及难以维护的组织不良的代码库等问题。关于编写坏代码是否不道德的问题，我听了我的德克萨斯理工大学计算机科学教授之一
  Dr. Michael Gelfond 的一个精彩故事，这也是我写这一章的想法。


  在我们的一次讲座中，Dr. Gelfond 提出了这个问题，然后讲了一个故事。几十年前，当他作为软件组织的程序员工作时，他遇到了一个糟糕的代码错误。他花了好几天才弄明白，之前的开发者构建了一个结构不良的函数，导致他正在工作的模块崩溃。


  Dr. Gelfond 告诉我们这个故事后，他再次问我们编写坏代码是否不道德；大多数同学回答说不是。但随后他问，如果我们在一人死前几天杀死他，“这不道德吗？”对此，每个人都一致回答“是”。他结束讲座时说：“那么上一个开发者的代码偷走了我生命中的两天，这难道不不道德吗？”


  这个故事和问题在我脑海中留下了深刻印象，现在我对“编写坏代码是否不道德？”这个问题给出的答案是响亮的“是”！作为开发者，我们应该为自己生产的工作感到自豪，不仅仅是为了客户或雇主的利益，而是仅仅因为我们的目标应该是成为我们所做的一切的真正工匠。


  编码是我们这个世界最接近魔法的东西，我感到很荣幸能够每天与之工作，并能够教导他人如何做同样的事情。并且有了这个想法，它应该激励我们有一个明确的目标，即在我们的手艺上做到卓越。


  我一生中最喜欢的棒球运动员之一是 Joe DiMaggio，他有一句很棒的引言，我认为非常适用于开发者。他说：


  > *There is always some kid who may be seeing me for the first time. I owe him my
  best.*


  我尝试将其应用于我所做的所有代码项目，很容易陷入懒惰的习惯。然而，我提醒自己，有人可能会查看这个项目，这可能是他们对我作为开发者的第一印象，如果我走了捷径，即使应用程序能工作，也可能对我的工作产生负面影响。


  这并不意味着你不能犯错误，恰恰相反。 我不断努力成为更好的开发者，正因为如此，我总是尝试构建我以前从未创建过的功能和项目，这自然会在学习过程中导致错误。然而，尝试构建雄心勃勃的功能时犯下的错误，与由于懒惰和编写不良代码而出现的项目错误之间存在明显区别。


  ### How to write better code


  那么，如果编写坏代码是不道德的，可以做些什么来对抗它呢？值得庆幸的是，我们有一套不错的工具和工作流程可以实施。以下是其中我发现最有用的




  有效做法：


  - **TDD/BDD（测试驱动开发/行为驱动开发）**：无论你对测试驱动或行为驱动开发持何种看法，不可否认的是，只要实施得当，它们就能打造出结构良好的代码库。TDD
  自然会引导你遵循低耦合、小方法等最佳实践，并且借助其重构步骤，我非常喜欢用它来确保应用程序以正确的方式构建。

  - **持续集成**：假设你拥有全面的自动化测试套件，那么 Codeship 或 Travis 等持续集成工具将确保代码在通过全部测试套件之前不会被推送到生产环境。我有多次
  Codeship 阻止了可能导致网站宕机的错误部署经历。此外，它还会在尝试错误部署时向开发团队提供需要修复内容的报告。

  - **结对编程**：这是开发者可以使用的最强大的工具之一。如果你不熟悉它，结对编程是指你与另一位开发者在同一时间轮流在同一项目上工作，最好是在同一房间、使用同一台电脑。当其中一人编码时，另一人负责观察并提出建议或警告。每当我在构建复杂功能时，总会使用结对编程，因为这就像用两个大脑来处理同一功能。

  - **持续学习**：无论你成为开发者多久，永远不会有学习终结的阶段。我每天都尝试学习新东西，无论是通过教程、书籍还是其他程序员写的博客文章。


  ### 总结


  希望这一章能引发你的思考，并帮助你在成为代码工匠的道路上不断前行。

  '
- "## 第 54 章：来自霍华德·罗克的鼓舞人心的编程建议\n\n在本章中，我将讨论一句作为开发者时我经常寻求灵感的名言。\n\n这句名言出自安·兰德的小说《源泉》。书中的主角霍华德·罗克是一位技艺精湛的建筑师，是真正工匠精神的典型代表，而我们作为开发者，也应该以同样的态度对待自己的项目。\n\
  \n这句名言阐述了每个项目都是独特的、值得拥有专属实现方式的道理，内容如下：\n\n> “规则？我的规则是这样的：能用一种材料做到的事，绝不能用另一种材料来做。没有两种材料是相同的。地球上没有两块场地是相同的。没有两座建筑有着相同的用途。用途、场地和材料决定了形态。除非由一个核心思想所创造，并让这个思想贯穿每个细节，否则任何事物都不可能合理或优美。建筑是有生命的，就像人一样。它的完整性在于遵循自身的真理、自身唯一的主题，并服务于自身唯一的目的。”\n\
  > \n> ——霍华德·罗克，《源泉》\n\n尽管这段话写于 20 世纪初，且针对的是建筑行业，但罗克的工匠精神理念同样可以轻松应用于编程领域。人们很容易陷入舒适区，在各个项目中简单地复制实现方式和功能。然而，这可能会产生两个问题：\n\
  \n- 1. 你作为开发者无法成长。提升自己的唯一途径就是走出舒适区，构建你从未做过的功能，这样才能学习新概念。\n- 2. 项目会受到损害，变成“方枘圆凿”。每个应用程序都有一套独特的需求，因此应该有定制的实现方案。\n\
  \n希望你能从罗克的智慧中获得启发，并将其应用到自己的开发项目中。\n"
- '## 第 55 章：作为开发者，最佳实践与创造力之间的博弈


  在本章中，我将探讨作为开发者，如何在最佳实践与创造力之间找到平衡。


  说实话，这章起初很难写，主要是因为我很难梳理自己在这个话题上的想法，因为它有点抽象。我对开发者面临的最佳实践与创造力之间的紧张关系有一个宏观概念，即许多开发者，尤其是刚接触编码的新手，往往会分为两大阵营：


  - 那些试图在各个方面遵循标准化约定的人，基本上是从教程以及语言或框架的文档页面复制代码。

  - 那些完全无视常见实践、以（当时）他们认为最合理的方式构建应用程序的人。


  这两种方法各有利弊，就像许多其他话题一样，两者之间的结合才能产生最佳策略。让我们来看看遵循最佳实践和忽视创造力这两种方式的利弊。


  优点：


  - 未来的开发者会更容易接手并添加功能，因为他们能了解代码的结构以及所有方法和类的位置。

  - 程序应该通过单元测试和集成测试得到充分验证。


  缺点：


  - 代码结构可能更偏向“千篇一律”的模式。

  - 代码可能患上“方枘圆凿”综合征。


  在我继续之前，请不要误解我的意思，我不是说遵循最佳实践的开发者都有这些问题。我只是在指那些将创造力抛之脑后，仅仅试图用标准化方法来构建程序，并尝试抄袭其他开发者代码的人。


  现在让我们来看看只拥抱创造力的开发者的利弊：


  ### 优点：


  - 他们乐在其中，这非常重要，因为这能让他们保持动力去构建有趣的项目。他们也能够表达自己对于应用程序应该如何构建的独特见解。

  - 他们不断尝试新事物，寻找构建功能的新方法。这可以让他们深入了解正在使用的语言或框架。


  ### 缺点：


  - 仅依赖开发者创造力的程序，后期可能几乎无法管理。即使是构建该应用程序的开发者本人，如果回头添加新功能，也可能很难理解自己的代码。

  - 即使最初构建时充满乐趣，但随着代码库的增长，乐趣程度会呈指数级下降，无视最佳实践、仅依赖开发者创造力的程序也不例外。事实上，新开发者经常因为非标准化方法导致代码库一团糟，而不得不废弃整个项目、从头开始。


  那么，既然两种方法各有利弊，哪种才是最佳方式呢？我是一名自学成才的开发者，最初我绝对属于第二阵营，纯粹依靠创造力来构建应用程序。


  然而，虽然我最终构建了一些糟糕的应用程序，但在过程中我确实学到了很多关于各种语言的知识，所以从学习的角度来看，这算是一种有益的策略。随着多年过去，我作为开发者逐渐成熟，我意识到必须在遵循标准化最佳实践和为程序添加自己的创意之间找到平衡。


  忽视行业内公认的最佳实践纯粹是愚蠢之举。正确结构化、面向对象的代码等概念既能提高项目的可维护性，也能让将来添加新功能更有效率。世界上最杰出的一些头脑在过去一个世纪里不断完善开发流程，优秀的开发者应该在这一积累的知识基础上有所建树。


  尽管如此，将你自己的创造力融入开发项目中仍然有其价值。随着我作为开发者的技能不断提升，我意识到我的代码比以往任何时候都更具创造力。当我最初开始编程时，我的“创造力”实际上只是试图以我脑海中认为应有的结构来让功能运作的杂乱尝试。然而，大约十年的经验磨练了我构建程序的方式，这些经验让我学会了如何在编写应用程序时更具表现力。


  随着我作为开发者越来越自信，我能够探索更多不同的项目构建方式，并且我现在比以往任何时候都更享受编程。最后，我想用桑迪·梅茨的一段话作为结尾。她是我个人最钦佩的软件开发者之一，也是《面向对象设计实践指南：Ruby
  语言描述》一书的作者。当她谈到在遵循千篇一律的方法与在开发中实施创造力之间寻求平衡时，她说道：


  > “设计不是一条由技能相似的工人制造完全相同产品的流水线，而是一个由志同道合的艺术家雕琢定制应用的工作室。因此，设计是一门艺术，一门编排代码的艺术。”


  希望这次讨论对你有所启发，并帮助你在自己的项目中找到作为开发者的最佳实践与创造力之间的平衡。





  '
- "## 第56章. 项目开发实践指南\n\n作为一名教师，我最喜欢的部分就是与学生互动。而本章将重点回答一位观众关于**项目开发方法**策略的问题。\n\n###\
  \ 学生提问\n\n以下是德国开发者 Christian 写给我的信件：\n\n> *一年前开始学习网页开发，我目前正在使用 Rails 构建我的第一个商业产品（一个分类广告网站）。我真的很想听听你关于如何在应用上构建功能的建议，因为我有以下问题：*\n\
  > \n> *我无法从头到尾规划一个功能，因为我总觉得自己遗漏了什么重要内容*\n> \n> *拖延和害怕犯下未来纠正成本高昂的错误*\n> \n> *当你不确定范围时，你如何构建功能？*\n\
  > \n> *你的流程是什么，你如何摆脱困境？*\n> \n> *此致，*\n> \n> *Christian*\n\n### 项目开发方法策略\n\n在这封信中，每个问题都围绕着项目开发方法策略展开。而在本章中，我将逐一为每个问题提供解答。\n\
  \n### 从头到尾规划功能\n\n我们开发者 Christian 的第一个问题是：\n\n> “当你不确定范围时，你如何构建功能？”\n\n这是一个很好的问题。虽然从项目开始就拥有明确定义的范围会很有帮助，但这种情况很少发生。即使你被提供了一个完美制定的项目范围，它在开发的某个阶段也最有可能发生变化。这本质上会让范围变得毫无意义。我们的开发者\
  \ Christian 在邮件中说他正在构建一个分类广告网站，所以我们将在本章中以此作为案例研究。\n\n### 从需求到用户故事\n\n其中一个说法是，你不习惯从头到尾规划功能，因为你觉得自己遗漏了某些东西。当你基于一组需求构建应用程序时，这是一个常见问题。你可能尝试列出需求清单，例如：\n\
  \n- 用户应该能够注册\n- 记录只能由创建该帖子的用户编辑\n\n如果你采用这种方法，感觉自己遗漏了功能是很自然的，尤其是如果你是开发新手。与其使用需求，我建议创建用户故事。我给你一个我去年构建的分类广告应用中的一个例子：\n\
  \n*用户登录到应用程序。从那里，她会看到创建新帖子或编辑之前创建的帖子的按钮。她只能看到自己创建的帖子，并且在未登录应用的情况下无法访问此页面。除了查看她的帖子外，她还可以点击一个帖子来查看用户对该帖子的所有回复。*\n\
  \n注意到这比简单列出需求实用得多吗？你的应用应该有数十个用户故事，包含你想要构建的所有初始功能。\n\n### 从基础案例开始\n\n现在你的应用已经有一组不错的用户故事了，它们应该详细到什么程度？老实说，我建议你尽可能保持功能基础。当我构建应用程序时，我甚至不包含我知道以后会需要的全部参数。\n\
  \n在项目开发方法上，我采用基础案例策略。这意味着我将功能钻研到最基本的组件。回到你的分类广告应用，假设它有一个这样的故事：\n\n*当用户在创建新列表的页面上时，她可以添加标题、描述和最多5张图片。从那里她可以点击保存来创建帖子，这会将她重定向到帖子展示页面。*\n\
  \n如果你尝试构建整个功能会非常令人望而生畏。所以，我的方法是首先简单创建一个表单页面。从那里我只会添加使用标题创建帖子的能力。描述可以在未来轻松添加。\n\n\
  因此，我认为在开始时浪费时间毫无意义。我会在开始时完全忽略图片上传功能，因为这需要使用诸如嵌套属性之类的工具。所以，在用户可以用标题创建帖子之后，我可以回头一次一个地添加其他组件。这种方法使整个过程不那么令人望而生畏。\n\
  \n### 未知恐惧\n\n在邮件中，他提到害怕遗漏重要内容。这种对未知的恐惧完全自然，让我说：你会遗漏重要内容。创建用户故事应该有助于捕捉关键项目。然而，我保证总会有组件最初会从缝隙中溜走。然而，不要让这吓到你，你可以在以后添加新功能。\n\
  \n从我个人经验来看，我记得有一次我在构建企业应用时，完全忘记给经理查看他们应该批准的帖子的能力！然而，在我意识到遗漏了关键功能后，我可以添加它，客户也很满意。\n\
  \n所以，不要让害怕遗漏关键功能阻止你构建。记住最初的 Facebook 开发者策略。\n\n### 快速行动，打破常规\n\n在成为上市公司后，Facebook\
  \ 在项目开发方法上已略微偏离了这种方式。然而，就构建应用程序而言，这仍然是我所拥抱的策略。而且我发现它能带来更多成果。此外，快速行动、打破常规也将有助于解决你的第二个问题。\n\
  \n### 应对拖延\n\n我非常感谢 Christian 的坦率（这也是我决定给他写 1,500 字的回复而不是指向其他资源的主要原因）。在邮件中，他承认自己在拖延方面挣扎。而我很高兴他这么做了，因为拖延是我认识的每位开发者，包括我自己，都必须对抗的问题。\n\
  \n我用来对抗拖延的顶级工具之一是思考要小。我们作为开发者，自然倾向于将具有挑战性的功能推迟。相反，我们喜欢专注于我们已经熟悉的组件。这对每个人来说都是自然的，然而这并不好。我必须每天提醒自己这一点。\n\
  \n在他的书 *Deep Work* 中，Cal Newport 讨论了深度工作（将某人从优秀带到卓越的那种工作）并不有趣。事实上，在研究顶尖表现者时，Newport\
  \ 发现 100% 的个人都不喜欢从事具有挑战性的任务。所以，就项目开发方法而言，请理解最可怕的功能可能是你作为程序员进步的最大催化剂。\n\n### 小而实用的步骤\n\
  \n所以，我的个人建议是，你要拥抱困难的功能，但采取增量方法。例如，想象你对在分类应用中构建让用户为每个列表上传多张图片的能力感到畏惧。这个功能甚至会让经验丰富的开发者感到畏惧。你需要使用嵌套属性并结合许多\
  \ JavaScript 元素以允许动态行为。\n\n这就是可能导致你拖延的功能，因为它有点可怕。然而，我建议你立即着手处理该功能。你可以写下你将如何构建组件的策略，例如：\n\
  \n1. 为帖子集成嵌套属性。\n2. 构建一个可以动态创建新文件上传元素的 JavaScript 脚本。\n3. 在数据库中的示例记录中硬编码一些图片 URL。\n\
  4. 最后将系统连接到存储引擎。\n\n然后猜猜怎么着，你完成了！注意到当你将其分解为更小的步骤时，功能似乎不那么令人望而生畏了吗？这就是对抗拖延的关键。\n\n\
  \n\n\n\n### 摆脱困境\n\n在开发过程中，开发者可能会以多种方式陷入困境。\n\n#### 应用中的错误\n\n如果你发现自己在某个错误上卡住了，我强烈建议你将不工作的功能进行隔离。太多时候，开发者在试图保持整个系统正常运行的同时修复某个组件。\n\
  \n在调试时，我会抛开最佳实践和规范。修复错误时一切手段都可使用。例如，如果页面上的数据没有正确显示，就在视图模板中放入一个数据库查询。惊讶吧！不用担心，在你发现错误原因后，你可以立即重构代码以符合最佳实践。\n\
  \n我发现在使用 Rails 控制台运行脚本以及使用 Pry 等调试工具时，对摆脱困境非常有帮助。这些工具让你能够隔离问题并专注于问题本身，而不是让应用程序的其余部分干扰你。\n\
  \n#### 消息优于模型\n\n最后，我发现好开发者和伟大开发者之间一个关键的区别在于他们看待应用程序开发的方式。好开发者可以查看一个程序或功能，并首先列出所有模型、它们的属性和关系。\n\
  \n然而，伟大开发者首先关注的是类与类之间将发送的消息。这是一种完全不同的思考开发的方式。与其将类视为静态的对象蓝图，它迫使你思考类的实际行为。\n\n这不是我提出的想法。著名开发者\
  \ Sandi Metz 最好地描述了这一概念，她说：\n\n> “你并不是因为拥有对象才发送消息，你拥有对象是因为你发送消息。”\n"
- '## 第 57 章。如何练习编程技巧并提升作为开发者的能力？


  无论你是编程新手还是已经从事多年，练习都很重要。你练习编程技能越多，你就会越好。你有多种练习编程技巧的选项。这些选项将帮助你提升技能并不断作为开发者进步。


  ### 参与结对编程


  编程不必是孤立的活动。与其独自承担，不如参与结对编程。由于结对编程是人们在一台电脑上共同工作，因此它是学习不同解决问题策略和处理流程的好方法。只要你选择了合适的搭档，这种练习方式会让你迅速成为更好的程序员。


  ### 利用开源软件


  开源软件是练习编程技巧的好方法。首先阅读各种开源项目的代码。这将帮助你理解程序员是如何打造如此成功的项目的。


  然后，参与各种开源项目。在你工作的过程中，人们会给你即时反馈。偶尔听到批评可能很难接受，但它会帮助你精进技能，从而让你成为更好的程序员。


  ### 访问 Reddit 上的 DailyProgrammer 子版块


  Reddit 是一个充满分享想法和互相帮助的人的社区。你可以通过 DailyProgrammer 子版块加入其中（[https://www.reddit.com/r/dailyprogrammer/](https://www.reddit.com/r/dailyprogrammer/)）。该子版块每周发布三个编程挑战。第一个挑战相对简单，然后难度会逐渐增加。社区会评审解决方案并提供反馈。利用这个子版块在享受乐趣的同时提升你的技能。


  ### 参加在线课程


  有时你不需要重返校园来提升编程技能。**大规模开放在线课程（MOOCs）**是提升技能的绝佳方式。你可以按自己的节奏学习并练习需要改进的技术，而不会感到仓促。最棒的是，你可以在课程中获得反馈，这将帮助你成为更好的程序员。


  如果你想学习如何最好地利用 Rails 框架，可以查看我的 *Professional Rails Course*（[https://www.udemy.com/professional-ruby-on-rails-coding-course/](https://www.udemy.com/professional-ruby-on-rails-coding-course/)）。


  ### 代码 kata


  kata 这个术语最早由 *Dave Thomas* 在书中引入，*The Pragmatic Programmer*。他从武术中借用并将其应用于编程世界。要进行代码
  kata，你需要取一个小的需求并创建代码。然后一遍又一遍地重复，改进它直到完美。这是一种在练习编码的同时让代码变得更好的简单方法。


  ### 总结


  不要犯 ofs 的错误。之所以没有明确的答案，是因为开发本质上是一门艺术。因此，关于编程的这个问题与询问什么造就伟大艺术家类似。


  ### 成为伟大开发者的技巧


  为准备本章，我询问了各种开发者，我阅读了博客文章，并收听了许多讨论该主题的播客。正如我所预料，成为一名伟大程序员的要素是广泛的。


  在本章中，我想概述我发现最有效的流程和要求。以下六个特质概括了伟大开发者中发现的关键特征。我还包含了在日常工作中与这些属性配合使用的一些实用策略。


  ### 攻克困难功能


  从最具挑战性的特质开始，我发现我作为开发者的进步唯一方式就是攻克具有挑战性的概念。


  我发现自己令人不安地容易陷入一种例行公事中，反复执行相同的任务。我已经从事开发多年，因此我拥有一个我很 comfortable 构建的工具和功能库。


  然而，我发现如果我只是不断构建我已经很 comfortable 创建的功能，我就不会成长为开发者。只有当我下定决心并致力于完成从未做过困难任务时，我才会变得更好。


  要求攻克困难练习并不是仅与开发相关的概念。*Anders Ericsson* 和 *Robert Pool* 合著的书籍 *Peak* 研究了音乐、体育和几乎所有其他熟练职业中的巅峰表现者。研究结果显示，个人只有在攻克具有挑战性的概念时才会显示出进步。这意味着如果小提琴家每天演奏相同的音乐并且从不挑战自己，他们的技能就会停滞。


  对开发者来说也是同样的概念。如果你想成为一名伟大开发者，你需要不断攻克困难主题。如果你不知道从哪里开始寻找具有挑战性的功能来构建，请访问你最喜欢的网站。你可以查看
  Twitter、Airbnb 或 Pinterest。从那里你可以列出你从未构建过的先进功能。示例包括组件，如：无限滚动、异步通知或多页身份验证。


  ### 社区贡献


  随着编程行业的增长，开源社区呈指数级扩张。世界上最流行的语言和框架，如 Python 和 Ruby，并非由公司创建，而是由对公共利益感兴趣的程序员创建的。


  根据你的经验水平，社区贡献会差异很大。如果你是高级工程师，你可以构建一个开源代码库或为一种编程语言构建功能。然而，即使你几乎没有任何经验，你仍然可以贡献。新开发者可以帮助刚开始编码的其他人。





  回馈开发者社区固然很好，但参与贡献也能带来巨大的益处。如果你正在构建一个其他开发者会看到的代码库，你很可能会格外小心，确保代码库经过充分测试且功能正常。这种开发方式会让你成为更优秀的程序员，并对你长远发展有所帮助。


  ### 艺术性


  在开发过程中，很容易陷入项目日常的琐碎细节，而忘记编程的核心其实是一门艺术。代码要具有艺术性，就必须优雅；而要优雅，就必须简洁。我曾参与过的一些最优秀的项目，最终都拥有最直截了当的代码库。然而，编写简洁的代码并不像你想象的那么容易。Sandi
  Metz 曾这样评价简洁代码：


  > “新手程序员还没有能力写出简洁的代码。”


  爱因斯坦曾这样谈论简洁：


  > “如果你不能向一个六岁孩子解释清楚，那说明你自己也没真正理解。”


  这似乎是一个奇怪的概念。然而，如果你曾尝试构建一个保持易于理解的代码设计的复杂项目，你就会明白这是真的。作为开发者，你进步越大，你的工作就应该越直截了当。


  ### 工匠精神


  工匠精神与艺术性密切相关，但有一个重要的区别。当你是一名工匠时，你会真正为自己的工作感到自豪。


  多年来，我遇到过各种各样的开发者——从把每个项目都当作流水线上的零件来对待的程序员，到确保自己处理的每个代码文件都像艺术品一样的开发者。


  就我个人而言，我发现将这两种概念结合起来最为有效。与许多其他概念一样，工匠精神并不局限于编程。从小到大，我的父亲——他曾是美国职业棒球大联盟的球员，现在是一名教练——一直教导我要拥有他所谓的“卓越精神”。这意味着无论我做什么或正在做什么，我都必须为之自豪。他会告诉我，如果我花时间去做一件事，那就不如把它做好。


  虽然我觉得自己对自己的工作感到自豪，但工匠精神是我最难把握的概念之一。我觉得这一原则很有挑战性，因为很难在编写良好的代码和完美的代码之间找到平衡。正如俗话所说，*完美是伟大的敌人*。因此，确保你努力正确地设计你的代码库是很重要的。


  然而，不要强迫自己追求完美。拥有“没有任何项目是真正完成”的心态也很重要。这意味着如果你试图达到完美，你会不断感到沮丧。这主要是因为你的代码库永远不会达到一个可以被视为“完成”的阶段。


  #### 史蒂夫·乔布斯的工匠精神


  说到工匠精神，很少有人能像史蒂夫·乔布斯那样对自己的工作抱有同样的自豪感。这是他对工匠精神的看法：


  > “当你是一个木匠，正在制作一个漂亮的五斗柜时，你不会在背面用一块胶合板，即使它靠着墙，没人会看到。你知道它就在那里，所以你会在背面用一块漂亮的木头。为了让你晚上睡得安稳，美学和品质必须贯穿始终。”


  ——史蒂夫·乔布斯


  ### 适应变化


  如果你参与过任何真实的代码项目，你可以证明唯一不变的真理就是：变化。伟大的开发者通过他们如何适应应用程序不断变化的需求来区别于新手。新程序员在应对变化时有两种常见的挣扎方式：


  - *代码设计缺乏灵活性。* 这意味着当项目中添加新需求时，他们需要完全重新配置代码以支持额外的功能。

  - *为错误的未来做规划。* 开发者可能对最终项目的样子有了一种心智模型，但这种预估很少与现实相符。想象一下，你正在构建一个会计应用程序，你认为客户最终会要求系统完全基于项目。你会根据你脑海中的工作流层级来做设计决策。然而，如果你错了，你将被迫重新配置整个应用程序。


  这两种陷阱在编码之旅中都很常见。然而，一位伟大的开发者会在无设计和过早设计之间找到平衡。


  通过构建结构良好的代码库，优秀的程序员编写的模块具有灵活的接口，能够适应变化。他们也理解项目需求会变化，并且他们编写的代码具有低耦合性。


  这意味着应用程序中某个功能的更改应该对其他部分影响很小甚至没有影响。例如，回到会计应用程序，如果工资模块需要更改，不应该要求你重写人事管理功能。


  ### 不懈学习


  最后，在回答“成为一名伟大的程序员需要什么？”这个问题时，我将讨论不懈学习的重要性。


  实现你的开发目标的最重要因素之一是对知识的渴望。幸运的是，你对这一要求有100%的控制权。无论你作为程序员有多少经验，你永远不会达到一个可以停止学习的阶段。总会有改进的流程、新的框架和新的语言需要学习。


  我问过一些与我共事的高级开发者，他们是如何组织学习方法的。他们给出了以下建议：


  - *每年学习一门新语言或框架。* 这也意味着你在那一年里要构建一个生产级应用程序。跟着教程做并构建“Hello World”应用很容易。然而，当你创建一个真实的程序时，你会被迫解决具有挑战性的结构问题。

  - *每天阅读多本书。* 我个人每天阅读十几本与开发相关的书。事实上，我在本书中讨论的许多主题都直接来源于我当时阅读的内容。

  - *跟随高级教程。* 与我共事的许多开发者承认，他们更喜欢通过阅读其他程序员的博客来学习新的编码技术。网上有许多指南可供你学习，它们会教你如何在应用程序中构建高级功能。

  - *订阅新闻通讯。* 我订阅了许多每周发送给我的新闻通讯，包括关于 Ruby、Rails 和 JavaScript 的通讯。这类通讯是了解语言变化的好方法。它们精选了来自网络的一些最佳博客文章和教程。


  ### 总结


  我希望这是一个有帮助的章节，并能帮助你回答这个问题：“成为一名伟大的程序员需要什么？”

  '
- '## 第59章 作为开发者如何保持敏锐？


  当我想到**保持敏锐**这个概念时，脑海中浮现的是专注技能的画面。从编程的角度来看，一位敏锐的开发者是那种对处理具有挑战性的项目充满信心，并能冷静适应不断变化的需求的人。


  我在前几章中提到过，开发者的技能水平永远不会停滞不前。作为一名程序员，你要么在进步，要么在失去你的专长，没有中间地带。那么，作为开发者，你该如何保持敏锐呢？


  ### 保持敏锐的开发者小贴士


  以下是我关于保持开发者敏锐度的五个重要建议。如果你遵循这些建议，你总会感到准备好专注于职业生涯中的下一个目标或挑战。


  #### #1 – 编码练习


  我列表中的第一项是编码练习。归根结底，没有什么比直接深入代码更能帮助你提高编程能力了。


  你可能会认为从事工作或业余项目就足以保持你的技能敏锐。然而，根据我的经验，我管理的许多工作项目并不会考验我作为开发者的技能。当然也有例外，但我在工作项目上做的很多编码都是围绕应用程序配置，而不是算法设计。


  从小到大，我可以观看我父亲执教的棒球运动员。这些是处于职业巅峰的美国职业棒球大联盟运动员。我仍然记得他们是如何保持击球手状态的。参加比赛并不是他们提高的方式，比赛是他们展示




  他们的技能。相反，他们通过练习和练习变得更好，这些练习和练习专注于提高他们游戏的特定组成部分。


  同样，我们作为开发者，需要花时间提高编码技术的特定元素。


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_310_0.png)


  这张图片是我定期进行的编程练习的 GitHub gist（https://gist.github.com/jordanhudgens/8033986）。在每个代码片段上方都有一个任务，我的工作是将实现代码放在目标下方。这些编程练习迫使我不断完善我的技能，并为复杂问题找到新的更好的解决方案。


  ### 示例编程练习


  一些示例问题可能包括：


  - *从以 "system." 开头的数组中删除字符串：* 这要求我使用数组数据结构，集成正则表达式匹配器，并知道如何删除选定的元素。

  - *将字符串数组转换为哈希，以字符串作为键，以字符串长度作为值：* 这个练习迫使我理解哈希数据结构如何工作，如何使用可枚举的 Map 方法，以及如何使用块。


  清单还在继续。我不断添加新的问题来解决，我每天尝试花一些时间。花费大约 30 分钟到一个小时来完成这些练习。如果你正在寻找一个很棒的编程问题列表，请查看 Project
  Euler（https://projecteuler.net/）。在那里你会找到数百个很棒的挑战，你可以逐一完成。


  ### #2 – 教别人编程


  接下来是教别人如何编程。我在家上学长大，大约 12 岁时我必须开始自学代数。我最初在学习新概念时很挣扎，我感到沮丧。我妈妈意识到当我独自学习时，我很难理解我在读什么。但当我向她解释课程时，我的理解力飙升。


  她在教我所有的兄弟姐妹，所以她不能整天在我身边。所以，她拿来我姐姐的一个娃娃，把它放在我桌子旁边。她指示我阅读课程计划，然后向娃娃解释。


  起初，我认为这是我听过的最愚蠢的想法。向一个娃娃解释代数，这个娃娃由于体型大而得名 *Big Dolly*，似乎就像一个无家可归的人在公交车站自言自语。所以，我做了每个
  12 岁孩子都会做的事，我忽略了这个建议……直到我进行下一课时，我意识到我不知道我刚刚读了什么。所以，在盯着娃娃看了几秒钟尴尬的几秒钟后，我开始向她解释概念。令人震惊的是，通过与娃娃一起讲解课程，我开始理解它！而没有人比我自己更惊讶。所以，*Big
  Dolly* 帮助我完成了代数、三角和微积分。


  #### 这如何适用于开发？


  那么我关于教娃娃代数的奇怪故事如何适用于作为开发者保持敏锐？好吧，当我开始学习编程时，我并没有马上掌握。事实上，我真的很难理解如何构建应用程序。但后来我想起了高中数学时代。但我没有把
  Big Dolly 从阁楼里带回来，而是开始创建编程教程。


  正是通过教别人，我才开始比以往任何时候都更好地理解开发。事实上，*DevCamp* 和 *CronDose* 的起源可以追溯到我通过教别人来提高自己技能的愿望。所以，如果你想学习编程或作为开发者提高自己，我强烈建议你教别人，你自己的专业知识将会增长。


  ### #3 – 阅读


  保持开发者敏锐的技巧列表中的下一个是阅读。我订阅了 Safari Books Online，这本质上是开发者的 Netflix。通过该订阅，我可以访问数千本编程书籍。在我的日常待办事项清单上，我有大约
  7-8 本书要阅读。


  有时我读几小节，有时我会读几章，这取决于我有多少时间。阅读开发书籍帮助我不断完善我的编程技能，我一直在寻找新的好书来阅读。


  ### #4 – 新闻通讯


  名单上的第四项是开发新闻通讯。我试图让我的时间非常专注。因此，我限制了我订阅的新闻通讯数量，以便我可以在它们发布时花时间审阅每一份。


  我最喜欢的一些是来自：*thoughtbot* 和 *Codeship* 的新闻通讯。这类资源包含全面的指南，将帮助你对开发以及如何实现新功能有一个独特的视角。


  ### #5 – 教程


  保持开发者敏锐的技巧列表的最后一项是教程。每当我学习一种新语言或框架时，教程是我最喜欢的学习资源之一。


  Screencasts 是你能得到的离有讲师在房间里与你在一起最近的东西。为你提供逐步指南，你可以按照这些指南从头开始构建应用程序。值得庆幸的是，随着在线教育行业的增长，几乎你想要学习的一切都有教程。


  ### # 总结


  我希望这套技巧对你保持作为开发者的敏锐有所帮助，祝你编程顺利！

  '
- '## 第 60 章. 开发者简历技巧 – 如何创建有效的简历？


  多年来，我听程序员说他们只有在想要一份正常工作时才需要简历。然而，根据我的经验，简历对于传统的工作面试、自由职业客户，甚至为初创公司筹集资金都是必需的。考虑到这一点，我整理了这份
  **开发者简历技巧** 集合。


  ### 开发者简历技巧


  我经历过招聘流程的两面。我曾处于向数百家公司发送简历、希望得到回应的位置。我也曾处于接收端，收到了来自申请者的无数简历。


  我制定的清单多年来经过了精细调整。策略来自于与我产生最大共鸣的简历，以及当我向潜在雇主发送时效果最好的元素。在本章中，我整理了三个直接的开发者简历技巧，将帮助你最优地定位自己以面对招聘经理。


  ### 保持简洁


  名单的开始是 **保持简洁**。我已经跳过了许多包含大量描述和解释开发者经验的页面的简历。如果开发者发给我的简历超过 1 页，我很少会花时间去浏览信息。


  简历公司 Novorésumé 为埃隆·马斯克制作了一份简历，他们将马斯克的职业生涯浓缩到一页。如果马斯克可以有一页简历，你也可以。所以，考虑到这一点，你的简历中应该包含哪些相关内容？一份精心制作的简历通常会包括以下信息：


  - *你的姓名和联系信息*：你会震惊有多少人会写多页列出他们的成就，却忘记留下他们的电子邮件、电话和社交媒体链接。

  - *你的教育*：当我说教育时，我指的不仅仅是传统的教育来源，如你的高中和大学。简历的教育部分应包括你完成的任何训练营或在线教育机构。

  - *你的工作经验*：在你的工作经验部分，简洁是美德。招聘经理不想阅读你参与的每个项目的每一个细节。他们只想确保你适合他们想要填补的职位。就这样。没那么复杂。

  - *你的技能*：我从申请中看到的另一个常见错误是忘记列出他们的完整技能集。与简历的所有其他元素一样，也要保持这个列表简单。例如，我将我的技能列表总结为几行，讨论我使用的编程语言和框架。

  - *你的成就*：最后，你应该列出你在职业生涯中获得的任何成就或认证。


  ### 保持相关


  名单上的下一个是 **保持相关**。如果你申请的是前端开发者职位，请根据你的前端技能和经验定制你的简历。当我向公司发送简历时，我会为每个组织定制简历内容。如果一家公司说它正在寻找服务器端专家，我会制作一份突出我服务器端专业知识的简历。


  如果你认为创建定制简历是狡猾的，你就错了。招聘经理通常在浏览简历的几秒钟内决定是否联系你。通过创建一份概述与公司需求相符的技能和经验的定制简历，你是在帮助招聘经理的工作更轻松。所以，这是一个双赢的局面。






  ### 保持专业


  开发者简历提示中的第三条是**保持专业**。招聘经理真的不太在乎你是否喜欢动物或热衷于跑马拉松。你可以在面试过程中讨论自己的爱好。然而，在简历上，爱好会占用宝贵的页面空间，而这些空间可以用来列出额外的技能或经验。


  ### 总结


  总而言之，写简历确实是一门艺术。简历应当简洁、针对职位定制，并清楚说明为什么你是最适合这个职位的人。如果你以前从未写过简历，我强烈建议你与能够帮助你完成这一过程的个人或服务合作。像Novorésumé这样的服务非常适合这类工作，你也可以从Upwork等网站上以不到100美元的价格聘请经验丰富的简历撰写人。考虑到一份写得好的简历可能会决定你是否能获得工作，我认为这是一项明智的投资。

  '
- '## 第61章 开发者薪资谈判策略


  谈论金钱对许多人来说是一个敏感话题，而在谈判薪资时，你还会额外承受压力：如果你要求过高，可能得不到这份工作；如果要求过低，则可能对你的生活方式产生负面影响。考虑到这一点，我整理了一份开发者薪资谈判技巧清单。


  ### 了解你的技能组合


  这似乎是常识，但至关重要的是，你必须了解并能够清晰阐述自己的全部技能，因为这是决定你薪资的主要因素之一。


  你可以从列出你掌握的编程语言、使用过的框架开始，并整理一份展示你专业能力的作品集。例如，如果你是一名全栈开发人员，同时还拥有数据科学经验，那么对于需要你这样独特技能组合的公司来说，你将更有价值。


  ### 了解行业


  多年来，我有幸在油气行业担任工程副总裁和软件总监。与其他行业相比，油气行业历来很难吸引软件开发人员，因此开发人员能够获得更高的薪资。如果我申请汽车制造业的工作，我的薪资将与在油气行业时大不相同。


  因此，重要的是要了解哪些行业愿意为开发者支付高薪，而不是简单地认为同样的技能在所有行业都能获得相同的薪资。


  ### 了解组织


  无论你的技能组合如何，无论你从事哪个行业，没有什么因素比组织本身更能决定你的薪资。如果你申请加入一家自筹资金的初创公司，你的薪资将明显低于一家刚刚完成2000万美元风险融资的初创公司。


  根据我的经验，拥有约500-1000名员工的中小型公司支付薪资最高。如果你申请加入一家自筹资金的初创公司，他们可能愿意通过股票期权进行谈判，这最终可能会带来比任何薪资都高得多的回报，这一点也很重要。


  ### 研究薪资水平


  考虑到所有这些，你如何研究薪资水平？你只需在谷歌上搜索*软件开发人员薪资*，然后再加上你感兴趣的行业名称。通常，带有招聘广告的职业网站能给你很大参考。不过，我通常喜欢使用*Glassdoor*，我发现它的薪资数据最为准确。


  你还可以让Glassdoor按你想要工作的地点进行筛选。要记住的一个关键点是尝试多种职位类型。例如，当我搜索亚利桑那州斯科茨代尔的*Web开发人员*职位时，它显示平均薪资为65,000美元；然而，当我查找斯科茨代尔的“软件开发人员”职位时，返回的平均薪资为78,000美元。仅仅一个词的不同，薪资就有相当大的提升，所以一定要查看所有你感兴趣的潜在职位类型。


  另一个有趣的选择是关注一些大型网站进行的年度开发者调查，例如Stack Overflow的年度开发者调查。这类调查会将行业划分为不同领域，并收集典型的薪资水平信息。虽然你不能把这些调查当作事实，但它们是非常好的参考指标。


  我希望这份指南能为你提供一个协商下一份薪资的系统方法。

  '
- '## 第62章 求职面试时应提出的最佳问题


  在本章中，我将讨论**求职面试时应提出的最佳问题**，同时也会谈谈另一面，列出一些无论如何都要避免的关键面试问题。


  如果你有一段时间没有经历过很多求职面试，或者以前从未真正为面试做过准备，你可能会想：


  > “我以为面试就是他们问我问题。”


  然而，一场好的面试中一个非常重要且经常被忽视的方面是向面试官提出有策略的问题。事实上，《福布斯》的研究人员列出了你的问题应该实现的三个目标：


  - 确保面试官对你没有保留意见

  - 展示你对雇主的兴趣

  - 了解你是否觉得雇主适合你


  面试官喜欢被提问。你提出的问题会反映出很多关于你自己的信息，有好有坏，因此提出正确的问题至关重要。如果你不向面试官提问，他或她可能会认为你并不真正关心这份工作本身，而只是希望赚够钱来付房租。


  面试官想要找到对加入他们公司感到兴奋的候选人。请记住，如果你被录用，你将代表面试官的形象，并会帮助或损害他们的声誉。每当我雇用的员工最终对组织不利时，管理层都会找我，问我为什么雇用他们，以及我怎么会忽略他们的缺点。


  我不是在开玩笑，大约五年前我雇了一个人，结果他是个糟糕透顶的员工，五年后我们的CEO还在为那次招聘让我难堪！所以，请务必牢记所有这些。


  “公司文化怎么样？”


  我喜欢这个问题，因为它会让你感受到员工之间以及与管理人员之间的互动方式，也会让面试官知道你不只是在找一份朝九晚五的工作，你有兴趣与团队合作并融入其中。


  “员工平均会在公司待多久？”


  与公司文化问题类似，这会巧妙地让面试官知道，你不是想在公司短暂任职，而是希望与公司建立长期关系。


  对这个问题的回答还将帮助你了解公司在留住员工方面的宽容度。如果员工的平均任职时间只有几年，可能存在导致人员快速流失的问题。反之，如果员工能待上十年以上，那说明这家公司是一个很好的工作场所。


  “你对我的资历或经验有任何疑虑吗？”


  这是一个大胆的问题，你可以根据自己的自信程度决定是否要问。但它会让面试官知道你并不害怕提出尖锐的问题，而且愿意听取建设性的批评。我个人从来没有被应聘者问过这个问题，但我会敬佩任何愿意提出这个问题的人。


  ### 求职面试时不宜提出的问题


  你应该避免那些看起来想要逃避工作的问题，比如询问带薪休假天数、度假日等级等等。了解这些工作内容很重要，但如果你换一种方式提问，比如这样提问，会给你带来更好的印象：


  > “这个职位附带哪些类型的福利？”


  这个问题会让面试官回答有关带薪休假和假期时间的问题，同时又不会让你显得像是一个已经在盘算什么时候不用工作但还能拿薪水的人。


  通常，你也不应问以“为什么”开头的问题，因为“为什么”会立刻让面试官产生戒备心理，并让对话带有对抗感。这类问题通常可以改成以“如何”开头，这会告诉面试官，你想更多地了解公司，而不是指责公司做错了什么。


  例如，“为什么公司用支票支付而不是直接存入银行？”这会让你看起来像是在说公司没有跟上现代的薪酬支付流程（事实也许并非如此），但这种问题不会带来任何好处。


  希望这能让你了解到哪些问题不该问，但为了以防万一，下面再提供几个案例，这里还有一些你应该避免的问题：


  > “这个职位可以远程办公吗？”


  如果可能，他们早就提到了。如果远程办公是你的首要目标，你应该考虑做自由职业。


  > “这个职位薪资多少？”






  你应该已经对这份工作的薪资水平有一个大致的了解，如果你正在为它面试。你可以在它被提供给你之后再担心工资，当面试官认为你最优先考虑的是你将赚多少钱时，这从来都不是一件好事，因为他们会假设如果你另一家组织给你一个适度的加薪，你就会离开公司。


  “期望我工作什么类型的时间？”


  面试官和管理者讨厌这个问题！根据工作内容，你应该已经知道这一点。然而，你可以通过问类似“这个职位一个典型的工作日是什么样的？”这样的问题来重新表述这个问题。


  最后，永远不要问“我的表现如何？”或“我有这份工作吗？”。问你表现如何听起来就像你在三年级刚完成拼写测试一样，并不能体现出多少自信。而如果你有这份工作，他们会告诉你。等待并在一周后跟进面试官，你将被视为一个成熟且经验丰富的候选人。


  ### Summary


  我希望这篇指南对你有所帮助，并能帮助你制定在求职面试中提出最佳问题的策略。面试的许多方面在开始时是未知的，然而你始终有能力控制你提出的问题，因此提前准备好一份问题清单以便你在面试过程中保持一定的掌控力是很有益的。

  '
- '## Chapter 63. Answering in an Impossible Interview


  ### Questions


  你希望在面试中如何被问到这个问题：


  > *“对 1 万亿个数字进行排序需要多长时间？”*


  或


  > *“在某一时刻天上有多少架飞机？”*


  如果这听起来不像你的乐趣所在，你并不孤单，许多组织已经停止提问不可能或看似不可能的问题；然而，仍然有一些面试官喜欢问它们，所以我认为讨论这个问题会很有帮助。


  首先，如果你被问到这些问题中的一个，面试官的首要目标并不是看你是否知道答案，而是观察你的解决问题的能力。通常，最好的方法是采取系统性的策略，以便你能展示出你有条理的思考过程。


  ### Answering impossible interview questions – case studies


  让我们以第一个问题为例：“对 1 万亿个数字进行排序需要多长时间？”在你建立一个基准案例之前，这似乎是一项具有挑战性的任务，例如：“对 10 个数字进行排序需要多长时间？”


  如果你了解算法，你很可能会选择使用排序算法，例如 Quicksort，因为它平均排序时间为 O(n lg n)，这将是 O(100 lg 100) 在用总整数数替换
  n 之后。所以，实际上对 1 万亿个整数进行排序是微不足道的，因为它将是 O(1,000,000,000,000 lg 1,000,000,000,000)。


  在这个问题中，面试官首先希望确保你了解流行的算法，并且你清楚地了解哪种算法适合该任务。


  对于“在某一时刻天上有多少架飞机？”这是一个估算问题，实际答案根本不重要，相反面试官想看到你如何逐步分析问题以及你有多注重细节。


  对于这个问题，我会先向面试官提出筛选问题，例如：是全世界的飞机还是仅美国的？这是否只包括商业飞机还是私人喷气式飞机和军用飞机？以及能表明你知道如何正确思考回答该问题所需每个参数的问题。


  从那里将问题分解为子问题；例如，如果面试官说他们只想要美国空中商业飞机的清单，那么你可以开始估算每个机场每小时有多少航班起飞，设定航班的平均持续时间，等等。然后你可以将该基准案例乘以美国机场的估计数量，你就会得到你的估算值，更重要的是你会向面试官展示你已经思考过这个问题。


  ### Good answers to your greatest weakness


  现在让我们看看在面试中关于你最大弱点的问题的一些很好的回答：


  - *行动缓慢：* 这是一个有趣的回答，因为如果你就此止步，这可能是一个糟糕的回答，因为它可能会告诉面试官你很胆怯，这将是一个不良的性格特征。然而，如果你接着说你在开始一项任务之前非常注重细节，并且想要有一个明确的策略来推进，这正是我想要在我的团队中拥有的员工！

  - *对自己过于苛刻：* 这会告诉面试官你在乎你的工作，并且做得好对你来说非常重要。确保跟进说明你如何改进自己，以便你仍然努力成为工作中的工匠，但不要为无关的原因责怪自己。

  - *可以很安静：* 这是我最喜欢听到的事情之一，前提是个人接着说他或她可以很安静，因为他或她认为在给出答案之前倾听项目或挑战的所有细节很重要。这告诉我这个人会注重细节，并且不会因为太忙于思考接下来要说什么而错过关键项目。


  我希望这些策略能帮助你回答“你的最大弱点是什么？”这个问题。祝面试顺利！

  '
- "## Chapter 65. Enterprise Software Job Strategy and Guide\n\n如果你是一名开发者，并且曾与初创公司或自由客户合作过，你会发现企业软件工作的世界在好和具有挑战性的方面都相当不同。\n\
  \n在 **enterprise software industry** 工作有一些优点，即大型组织通常稳定，有开发流程，并且允许你专注于特定功能，而不是必须涵盖软件功能的全部范围。\n\
  \n企业开发独有的一些挑战是，对于开发者来说通常有相当多的官僚程序。如果你习惯于能够抓取任何代码库并将其放入你的应用程序中，你会发现企业对你引入的外部库非常挑剔。例如，我就在几天前刚与一位企业软件开发者交谈，他表达了他的沮丧，因为他的公司花了两个月才允许他使用\
  \ jQuery 库，而 jQuery 是应用程序领域最常用的用户界面库之一。\n\n那么申请企业软件工作时应该准备哪些类型的问题呢？\n\n- 关于你如何与\
  \ **formal processes** 合作的问题。\n  根据公司的正式程度，你很可能需要解释你如何与不同的项目管理流程合作，例如 Scrum、极限编程，以及诸如此类的流程。\n\
  - 在大型企业中，软件错误可能导致数百万美元的损失，因此 **testing systems** 通常相当彻底。考虑到这一点，请确保你准备好回答与单元测试和行为驱动开发相关的问题。\n\
  - 考虑到我们生活在一个 **Microsoft-based enterprise world**，拥有扎实的关于你如何理解与 Windows 服务器、Active\
  \ Directory 以及诸如\nSharePoint 等工具集成的方式的知识将非常重要。我个人曾被问到我将如何将 Active Directory **single\
  \ sign on (SSO)** 集成到 Ruby on Rails 应用程序中，以及如何在 Windows 服务器上运行 Rails，在各种面试中。并且如果你了解\
  \ Rails 开发系统，你会知道这些根本不是标准要求。\n- 与大多数开发职位一样，你还需要对该职位的 **technical skills** 有扎实的理解。这通常包括能够对与面向对象原则相关的问题以及流行算法的讲解给出准确的答案。\n\
  \n面试的技术部分很可能特定于工作。例如，如果你申请的是前端企业软件工作，他们可能不会问你关于 Quicksort 的问题，但他们会问你如何正确管理 JavaScript\
  \ 回调。\n\n### Summary\n\n希望这四个方面的提问能帮助你准备并对申请企业软件工作充满信心，祝面试顺利！\n\n\n\n\n"
