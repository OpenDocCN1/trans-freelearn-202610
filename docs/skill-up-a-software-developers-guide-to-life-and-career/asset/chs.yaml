- '## 第45章 我该学编程吗？——关于编程的平衡观点


  在开始本书这一部分（涵盖作为开发者获得成功职业生涯所需的一切）之前，我要先讨论一个问题：我该学编程吗？


  这个问题源于Basel Farag在TechCrunch上发表的有争议的文章（https://techcrunch.com/2016/05/10/please-dont-learn-to-code/），他在文中敦促人们不要学习编程。作为Rails训练营的创始人，你可能会认为我的反应是列出一大堆为什么每个人都应该学习编程的理由，因为这对生意有利，对吧？


  然而，我详细阅读了他的文章，也浏览了大量抨击Basel的回应文章，将他斥为现代异端。


  ### 我该学编程吗？——对双方观点的平衡审视


  在仔细研究了围绕Basel Farag论点的大量内容之后，我的观点是，争论双方都有合理的观点，任何决定是否学习编程的人都应该考虑这些观点！


  让我们首先探讨“*并非每个人*都应该学习编程”这一观点。Farag提出，编程很难，事实确实如此，因此，你只需上一些在线教程就能成为专业开发者的梦想是谎言……他在这一点上100%正确。开发，尤其是真正的生产级应用程序开发，非常困难，需要多年的学习才能真正精通。仅仅学习如何构建一个让用户从数据库创建记录的应用程序是远远不够的，而




  form, for example. 一名专业开发者需要具备以下方面的专业知识：


  - 管理代码库之间的依赖关系

  - 遵循面向对象编程的最佳实践

  - 保持代码整洁

  - 为持续开发实施自动化测试

  - 知道如何在各种框架之间无缝切换


  而且列表还在不断延续……


  事实上，尽管我是一名专业开发者，并且曾为 Eventbrite 和 Chevron 等大型客户工作，我每天仍花费数小时阅读开发书籍和在线指南，只是为了跟上不断涌现的新编码技术和系统。


  所以，所有这些都说明 Basel Farag 说得对，如果你想成为一名专业开发者，你面前有一条充满挑战的道路。当然，如果你能坚持下来，你将获得一项巨大的技能，并且很可能受到多个行业的青睐。


  让我们现在来探讨论点的另一面，即每个人都应该学习编程。我非常欣赏 Edward Chiu 在 VentureBeat 的文章（https://venturebeat.com/2016/05/22/how-coding-kick-started-my-sales-career/），其中他描述了自己参加了编程训练营，他并没有成为一名专业开发者……但他确实获得了一份销售工程师的绝佳工作，如果他没有学习编程的话，他永远不会得到这份工作！


  这是经常被忽视的论点的一面，因为学习编程并不意味着你必须成为一名专业开发者，但它会给你一套新的技能，可以在许多不同的工作中使用。史蒂夫·乔布斯说得最好，他说：


  > "我认为这个国家每个人都应该学习如何编程计算机，因为它教会你如何思考。"


  对我来说，乔布斯在这里一针见血：学习编程不仅仅是成为一名专业开发者的先决条件，尽管这种情况也可能发生。它为你的思维提供了一个结构化思考的系统，你可以将其应用于所有学科。


  从个人例子来说，我以前记笔记很困难。我会在一页纸上随意写下各种词语，没有任何真正连贯的流程，当我稍后回头看时，它们对学习来说完全毫无价值。然而，在我学习编程之后，我开始以代码形式做笔记以赋予其结构，我会为重复的项目设置循环，为主题的属性和流程设置类，并为我试图学习的东西的最终结果设置返回语句。这听起来可能很书呆子，而且可能确实如此，但它给了我一个有组织的系统来做笔记和学习新主题。


  ### Summary


  总之，我希望这种平衡的观点能帮助你回答这个问题：我应该学习编程吗？

  '
- '## Chapter 46. Following Your Passion – Good or Bad Advice for Developers?


  作为一名开发者，你应该追随你的热情吗？我经常听到这个术语和这个建议，我不喜欢人云亦云，所以我想深入研究这个概念并在这里回顾一下。


  从高层次来看，这个建议的核心思想是，如果你从事一个你真正热爱的领域，你就会快乐。许多人引用史蒂夫·乔布斯在斯坦福大学的毕业演讲时他说：


  > " 最重要的是，有勇气追随你的心和直觉。它们某种程度上已经知道你真正想要成为什么。"


  ### Following your passion – a case study


  在撰写和研究这本书时，我读到了 Cal Newport 的书《So Good They Can''t Ignore You》，他在书中深入研究了史蒂夫·乔布斯的生活。他表明，如果乔布斯一生都遵循追随热情的建议，他永远不会创立苹果，而是会成为住在亚洲的佛教僧侣。


  乔布斯创立苹果的实际原因是他看到了一种通过向当地电子商店出售一套电脑来快速赚钱的方法，而这次销售激发了他对技术的兴趣。所以，看起来追随热情并不是一个简单明了的过程，即做你热爱的工作。


  然而，我的建议不是让你忽视你的热情，而是利用它们建立一个你真正热爱并能擅长的职业生涯。


  继续以史蒂夫·乔布斯为例，乔布斯的另一个热情是书法，如果你从未见过，这本质上就是花哨的书写。在为苹果操作系统创建用户界面时，乔布斯利用了他对书法的广泛专业知识，将字体集成到程序中。这就是乔布斯将他的热情与实际实施相结合的一个例子。


  作为开发者，我们处于一个独特的地位，我们可以在各种各样的行业中工作：如果你热爱体育，你可以为职业体育队工作，或者如果你喜欢娱乐，那么你可以为媒体公司工作。可能性真的无穷无尽。


  我最大的热情之一是棒球。我在游戏中长大，我喜欢关于它的所有事情。我没有足够的天赋去职业打球，但现在我正在攻读计算机科学博士，我的研究课题是棒球中的大数据分析。


  我不可能浪费不知道多少年去尝试成为一名职业棒球运动员，但我可以利用我作为开发者的技能，仍然从事我喜欢做的工作。我也有幸拥有多家体育行业的客户，这使我能够在自己热爱的领域工作，同时仍然利用我作为开发者的技能。


  ### Summary


  希望我的研究和个人经历能帮助你决定追随热情是否是正确的决定，或者是否存在一个中间路线会带来更好的最终结果。

  '
- '## Chapter 47. How to Learn to Code from Scratch? – A Practical Strategy


  成为一名开发者是一项有益但具有挑战性的任务。人们理解编程的最大障碍之一就是简单地制定计划并决定从哪里开始。


  在本章中，我将介绍一些策略来帮助你从零开始学习编程。我已经从事开发工作多年了。我自学编程，并且在过去十年中见证了各种各样的编程学习教育技术。


  我看到的一些策略是好的，其他的则是浪费时间。本章包含经受住时间考验的策略，将帮助你开启你的编程之旅。


  ### Small bites


  首先，在从零开始学习编程的技巧清单上，最重要的是**小口吃**的原则。


  我有一个朋友训练阿迪达斯的专业和奥运运动员，名叫 Mark Verstegen。 当我以前在他的学院训练时，他总是会说一些让我印象深刻的话。当任何运动员提出一个艰难的目标，例如获得奥运会资格或进入大联盟时，他会问他们：


  > "你怎么吃掉一头大象？"


  在运动员用困惑的眼神看着他之后，他会接着说：


  > "这不是一个 trick 问题，唯一吃大象的方法是一口一口地吃。"


  这对生活的许多方面都是很好的建议。然而，我发现这对开发者来说是一个特别重要的概念。当我回想起我学习开发的时候，我最大的障碍和挑战来自于我试图做太多。


  例如，当我试图构建一个新功能时，我会尝试一次性编写整个功能。大多数时候，这会导致程序无法工作，然后我必须逐行检查代码，直到我弄清楚出了什么问题。


  然而，随着我成为一名开发者的经验越来越丰富，我越发意识到将概念分解成小而易于管理的块的重要性。


  让我们想象一下，你正在构建与 Twitter API 的连接。与其尝试构建整个功能，不如先专注于连接到 API。然后打印 Twitter 返回的值。最后，你可以格式化数据使其看起来漂亮。通过将你正在学习的内容分解成小组件，你会发现你对正在进行的流程会有更好的理解。你也将能够记住如何在现实世界项目中实现这些功能，因为概念会更具体。






  ### 教程


  过去几年里，在线教育领域呈指数级增长。无论你想学习 Java 还是 Ruby，你都能找到无数教程来帮助你理解编程。这些工具本身最不可能让你成为一名专业开发者，因为达到专业水平需要数年时间，通常还需要你在各种真实项目上实践。


  然而，教程可以成为学习编程的绝佳入门方式。除了提供构建应用的分步指南外，屏幕录像教程也非常适合展示特定语言或框架能构建出何种类型的应用。当我学习一门新语言时，我会观看整套教程系列，甚至不尝试输入代码。我这样做是为了熟悉该语言的能力。


  教程的一个弱点是，很难复制你的个人环境。例如，如果你正在学习几年前的一份 Java 编程语言教程，那么讲师使用的语言版本很可能与你不同。这会导致一些令人困惑的错误，而在没有帮助的情况下，许多人会因挫败感而放弃编程梦想。


  但不要让这吓退你使用教程。我承认有许多教程帮助我自学开发。我也强烈推荐它们作为一个很好的起点，尤其是在你想从零开始学习如何编程时。


  ### 阅读


  接下来是阅读。市面上的编程书籍数量多到足以填满图书馆。我甚至写过几本！


  我喜欢阅读编程书籍，因为它们允许我按自己的节奏进行。当我观看视频教程时，通常意味着我每天需要抽出固定时间来观看视频。然而，有书的话我可以读几段，也可以读几章。当你有一份全职工作并且业余学习编程时，书籍是极好的资源。


  这是因为它们允许你按自己的节奏学习。书籍在以后需要查阅特定主题时也很有用。此外，当你阅读编程书籍时，我强烈建议你编写并运行书中的代码。这会比单纯阅读更好地帮助你记住编程语言语法。


  记住，大多数人的阅读记忆保留率极低。然而，如果你将阅读与在学习过程中实际编写代码结合起来，你会看到好得多的效果。


  阅读编程书籍时另一个技巧是，在编写代码时不要看书。例如，如果你正在阅读我的 Ruby 编程书，你在学习如何使用面向对象编程时会看到代码片段。如果你强迫自己在整个过程中不看书就输入代码，你会发现你的记忆保留率会大幅提升。


  ### 真实项目


  学习如何从零开始编程的最后一项是构建真实项目。在你完成了一些教程并阅读了几本书后，你就可以尝试动手构建应用了。


  一个自然的问题是：“*我应该构建什么类型的项目？*”这个问题其实没有对错之分。如果你有一个商业想法，那么你可以尝试用你新获得的编程知识来构建它。


  你也可以尝试重建现有应用，例如创建一个 Pinterest 克隆。我发现创建克隆网站这种技术非常有益，因为它让我专注于构建功能，而不必浪费时间去想点子。


  例如，当我学习 Swift 编程语言时，我构建了一个 Instagram 克隆。很多年前，当我学习 HTML 和 CSS 时，我从零开始重建了 Google 首页。关于构建真实项目最重要的是要记住要挑战自己。没有任何开发者是通过复制他们已经很熟悉的功能来提升的。相反，确保你挑战自己实现从未创建过的功能。


  ### 编程很难


  最后说一点，不要让任何人告诉你不同：编程很难！从设置开发环境到构建功能应用，编程在每个阶段都会给你带来挑战。


  ### 但你可以学习编程


  然而话虽如此，你可以成为一名开发者。并没有天生的神奇程序员基因。归根结底取决于：


  - 你有多坚定

  - 你是否愿意持续工作

  - 你在学习方面的策略有多好

  '
- '## 第 48 章。如何选择开发者专长？


  通过多年的培训开发者，我发现对程序员来说，决定自己的专长并专注于此至关重要。在本章中，我将与你分享我个人如何看待可用的不同开发者方向和专业领域。


  你很可能在开发者职业生涯中不止一次做出这个选择，所以我建议你始终观察并意识到职业生涯中可以做出的选择。


  ### 如何选择开发者专长？


  软件开发的世界如此庞大，以至于一个人不可能精通流程的每个方面。设想我走近一位世界级的田径教练并说我想为奥运会训练并在田径项目中赢得金牌。教练很可能会扫我一眼然后自嘲地笑。但之后他的第一个问题会是：*“你想训练哪个项目？”*
  他会问这个问题，因为 100 码短跑的训练制度与跳高截然不同。


  同样，作为一名开发者，你至少需要一次，很可能多次，缩小你的关注范围，确定未来几年你想成为什么类型的开发者。


  我将带你了解每种开发者类别，以便你了解它们包含的内容。


  ### #1 – 全栈开发者


  在决定如何选择开发者专长时，我总是喜欢从


  此外，服务器端开发者通常会花费大量时间构建 API。这是因为大多数基于服务器的应用都需要以某种形式与外部世界通信。开发堆栈这一层将要求你专精于某种语言，例如 Ruby、Python、Java
  或 C++。


  ### #3 – 前端开发者


  在选择开发者专长时，第三层选择是前端部分。直到不久前，前端开发者被认为是一整天都在处理 HTML 和 CSS 的人。他们的主要目标是让应用看起来*漂亮*。


  然而，随着客户端框架的出现，前端开发者的定义发生了巨大变化。这些框架，例如 Angular 和 React，使得前端程序员能够用很少的服务器端交互构建完整的应用。


  这些应用完全在浏览器中渲染，因为它们是用 JavaScript 编写的。每当应用需要获取额外数据时，它只需与 API 通信。我常用的一个模式是构建多个服务器端
  Ruby 应用，然后使用一个 Angular 前端应用在浏览器中渲染用户界面。


  因此，如果你喜欢构建用户会直接交互的应用，并且不害怕与 API 合作，前端开发可能就是适合你的选择。


  ### #4 – 移动开发者


  开发者类型列表中的下一个是移动开发。如果你对构建下一个 Angry Birds 或 Instagram 的想法感到兴奋，移动开发领域可能是不错的选择。


  移动编程曾经是一个非常难以进入的领域。仅在几年前，你就需要掌握多种语言（Objective C 和 Java）来构建智能手机应用。然而，JavaScript 框架


  例如 Ionic 和 React Native 已经让用 JavaScript 构建行为类似原生智能手机应用的应用程序成为可能。


  你仍然可以使用 Swift、Objective C 和 Java 等语言来构建真正的原生应用。而且，对于专精于这些语言的开发者来说，始终会有大量工作岗位。然而，如果你是自由职业者或全栈开发者，通过利用
  JavaScript 框架，你可以为所有平台构建基于智能手机和平板电脑的应用。


  而且，根据我的经验，这些 JavaScript 框架的学习曲线比传统移动语言要低不少。此外，你可能已经注意到，用于基于 JavaScript 的移动应用和前端编程的工具是相似的。正是由于这种协同效应，我有不少开发者朋友已经从服务端开发转向了前端编码，因为这样可以让他们着手构建适用于桌面、平板和手机的应用。


  ### #5 – 数据科学家


  这过去被认为是数据领域，几年前我会把它称为数据开发者类别。然而，数据和大数据已经迅速演变为统计数据分析以及使用人工智能（如神经网络）来洞察现在可用的大量信息的领域。


  这些新领域正在改变我们处理数据和理解信息的方式，对开发者来说也是一个巨大的新职业领域。目前，所涉及的数学可能相当令人生畏，因此你需要决定自己是否准备好应对大量的数学和深入的算法学习。随着时间的推移，数学会变得更加抽象，如果你对人工智能和深度算法学习系统的想法感兴趣，这无疑是当今有抱负的开发者可以考虑的一个领域。一些最现代的
  Python 库为开发者沉浸于这一领域提供了极好的途径。


  ### 做出决定


  如果你是开发新手，不要感到有压力要立刻选择一个专业方向。相反，我的建议是探索每一种开发层面，直到找到你真正热爱的焦点。


  在本章中，我提供了开发者类型的非常高层面的视图。然而，在现实中，你需要让你的开发焦点变得更加具体。


  例如，如果你是服务端开发者，你可能希望专注于构建电子商务应用或实现会计系统。如果你是一名有抱负的前端开发者，你可能想成为一名世界级的安全专家。


  我发现的一个关键见解是，查看开发者招聘公告板对相当多的人（尤其是较新的程序员）有帮助。招聘公告板非常适合列出各公司正在招聘的专业方向。通过浏览一系列潜在的职位描述，它可能帮助你弄清楚在职业生涯中下一步想要专注的方向。

  '
- '## 第 49 章 如何选择你的下一门编程语言？


  我们已经讨论了选择开发专业方向（如前端、服务端或移动端）的重要性。然而，仅仅选择一个专业方向是不够的。你还需要决定在职业生涯的初始阶段或下一阶段，你想专注于哪种编程语言。


  当然，没有哪本书或指南能告诉你接下来应该学习什么语言。这个决定只能由你自己做出。因此，在本章中，我的目标是帮助你根据当前目标决定如何选择编程语言。


  ### 如何选择编程语言？


  如果你经历了选择开发者专业方向的练习，你会注意到决定编程语言也有类似的模式。快速浏览维基百科就会发现，可供选择的编程语言有数百种之多。如果你采取逐一看每种语言的方法，你可能要等到未来一百年左右才能做出明智的决定！


  由于逐一遍历完整的语言列表并不实际，我推荐两个过程来帮助你决定如何选择编程语言。


  ### 你想要的下一份工作


  列表中的第一个是基于你想要的工作来选择编程语言。如果你听过“为想要的工作而打扮”这句话，它也适用于开发。


  例如，如果你想为微软工作或从事基于微软的产品开发，花数年时间学习 Python 和 Django 是没有意义的。相反，你应该专注于学习 .NET 开发技术栈以及诸如
  *C#* 之类的语言。


  这种策略在某些情况下是明智的，例如微软，因为就业市场上有无数 .NET 框架的职位。这意味着即使你没有被微软录用，你仍然可以在使用 .NET 技术栈的组织中找到工作。


  然而，这种方法对于更专门的语言和公司并不那么有效。例如，想象一下你花数年时间学习 Facebook 定制的 PHP 版本，代号 HipHop。如果你没能得到 Facebook
  的工作，你会发现使用 HipHop 框架的公司并不多，你的工作机会将受到限制。我认为这种方法有点冒险，因为它往往把所有的鸡蛋放在一个篮子里。


  ### 你的专业方向


  我个人最喜欢的方法是选择一种与你的开发专业方向相匹配的语言。我偏爱这种策略，因为这是我在开发之旅中使用的，而且对我很有效。


  基于你的开发专业方向来决定如何选择编程语言，意味着你要考虑自己想构建的应用程序类型。然后逆向推导，整理出一份最适合你目标的语言列表。


  例如，假设你决定自己的开发专业方向是构建大数据应用。通过这种方法，你可以大幅缩小符合你目标的编程语言列表。许多语言都能进行大数据处理，但真正专门从事这一领域的语言只有少数，例如：


  - R

  - Scala

  - Python


  所以，通过先确定你的专业方向，你就已经把语言列表从数千种……缩小到了三种。


  ### 基于专业方向的映射


  既然我认为这种方法最有效，那就让我们来看一看开发专业方向与流行语言之间的映射：


  - **全栈开发**：如果你想成为全栈开发者，Ruby on Rails 技术栈可能是你的最佳选择。这个技术栈为 Web 开发者提供了一套很棒的工具，并支持构建健壮的应用程序。

  - **前端开发**：对于前端开发者来说，要走的路径就在 JavaScript 轨道上。JavaScript 编程语言已成为前端开发领域的明显赢家。而当你精通
  JavaScript 后，你将能够使用 React 和 Angular 等流行的前端框架。

  - **服务端开发**：服务端开发的世界可能有点令人生畏。如果你查看服务端语言，你会发现 C、C++ 和 Java 等底层语言。然而，Ruby、Python 和
  Go 等编程语言也专注于服务端开发。

  - **数据科学家**：数据科学的世界乍一看似乎对开发者提出了不可能的要求，即同时要成为高级数学家。然而，如果你探索现代 Python 库，你会发现丰富的现成算法，因此你确实可以很快创建自己的神经网络和机器学习系统。如果你已经熟悉
  Python，基于这个原因我推荐它。如果你有更多统计背景，那么我建议你进一步探索 R 语言如何成为新职业路径的入口。


  在我的编程之旅中，我努力专精于一门解释型语言和一门编译型语言。我选择 Ruby 作为我的解释型语言，至于编译型语言，我从 C 开始。然而，这些年来我并没有发现我的
  C 知识有多少实际用途。此外，我已经转向了 Scala 语言，因为它非常适合构建大数据算法。





  ### 总结


  总而言之，与选择你的开发专业方向一样，我给有志于学习的学生们的建议是：在决定深入学习哪些语言之前，先尝试多种语言。网上有许多工具可以帮助你并排比较各种语言。


  例如，促使我学习 Scala 的决定性因素之一，就是浏览 Rosetta Code（https://rosettacode.org/wiki/Category:Scala）上的
  Scala 算法实现。所以，不要急于挑选一种编程语言。多花些时间思考和调研，你会更有能力做出正确的选择。

  '
- '## 第 50 章 开发者软技能——学会如何在市场中占据优势


  我在本书中已经谈了很多关于如何提升开发者能力的内容。大多数时候，我关注的是如何学习新的技术技能，比如更熟练地掌握一种编程语言或框架。


  然而，如果你把知识仅局限于技术才能，就会降低自己在市场中取得成功的机会。在本章中，我将介绍五种关键的开发者软技能，你可以利用它们成为一名全面发展的程序员。


  ### 开发者软技能


  我即将向你展示的开发者软技能清单绝非详尽无遗，但它确实代表了我个人使用过并取得成功的那些软技能。


  从二十多岁时担任一家全国性能源公司的 IT 总监，到如今担任在全球多地设有校区的编程训练营的 CTO，我亲眼看到这些技能在我职业生涯的每个阶段都帮到了我。而且你会注意到，它们与实际技术能力关系不大。


  需要说明的是，我并不是要用这份清单来盖过诸如养成整洁编码习惯或专注于提升开发者能力等技能。相反，这些技能应当对你的工程技术才能起到补充作用。


  ### 写作


  清单上的第一项是写作能力。在*《重来》*这本书中，*贾森·弗里德和大卫·汉森*（同时也是 Basecamp 和 Ruby on Rails 框架的创始人）写道，他们在求职者身上寻找的一项技能就是写作能力。这甚至包括那些你原本认为写作技能毫无用处的职位，比如开发者和系统管理员。


  显然，开发者需要具备熟练的编码能力。然而，书中解释道：如果一位开发者能写，这标志着他/她是一位良好的沟通者。写作技能并不意味着你写的每份备忘录都要像一本引人入胜的小说，而是意味着：


  -   你能够恰当地组织自己的想法

  -   你能够表达你想说的话，让其他人理解


  ### 交谈


  开发者软技能清单上的下一项，是能够与他人良好交谈的能力。如果你像我一样，这无疑是这份清单上最具挑战性的技能。如果能随心所欲，我会整天待在办公桌后面构建应用程序，绝不与任何其他人互动。这是我天生的性格，而且我知道有这种想法的绝不止我一个。


  然而，在职业发展方面，交谈能力是绝对必要条件。无论你是寻找新客户的自由开发者，还是希望获得晋升的软件工程师，你都会发现你成功的首要先决条件不是技术技能，而是讨人喜欢。


  如果人们喜欢你，他们就会愿意给你成功的机会。而让人们喜欢你的最直接方法之一，就是成为一位善于交谈的人。


  #### 交谈技巧


  谢天谢地，我发现进行高质量交谈的方法其实相当简单。以下是我用来提升这一技能的一些技巧：


  -   *回想你过去的生活，想出一些关于自己的有趣故事。* 人们喜欢故事，尤其是有趣的故事。多年来我发现，适时地讲几个故事让我赢得了 CEO 和高管们的好感。


  -   *把交谈的重心放在对方身上。* 人们喜欢谈论自己，所以只需提出有洞察力的问题，你就会被视为一位出色的交谈者……即使你让对方一直在说话！和你的故事一样，准备一列可以随时想得起来的问题。


  -   *不要抱怨。* 我还没遇到过喜欢和一个不断抱怨的人交谈的人。尽管如此，无数人似乎在遇到别人时，都喜欢提起自己生活中发生的每一件负面事情。好在，如果能做到在交谈中不抱怨，你就会脱颖而出，成为一个乐观而讨人喜欢的人。


  ### 管理


  沿着开发者软技能清单往下看，下一项是管理。如果你是一名初级开发者，别走神。管理并不一定意味着管理人或者管理项目。


  我所说的管理，是指你如何应对交给你的每一项任务。例如，如果交给你一个新功能需要构建，你会直接跳进去开始编码吗？还是你的方法更有条理？如果客户或经理看到你对每项任务都采取系统化的方法，他们就会更有信心给你更多的责任。


  为了提升这项技能，我建议你阅读一些项目管理方面的书籍，或者参加一个相关的在线课程。你花几天时间学习管理实践，会让你在职业生涯的剩余时间里受益匪浅。


  ### 设计


  清单上的下一项是设计。在斯科特·亚当斯（《呆伯特》的创作者）著的*《几乎在任何事情上失败，却依然大获全胜》*一书中，亚当斯描述了懂得设计基础原理应当是所有工程师的必备知识。


  我没法告诉你我曾多少次听到开发者说类似*“设计真的不是我的强项”*的话。你的首要技能不是设计也没关系。然而，学习什么才算优秀设计的基础知识只需要做很少的努力，不学的人纯粹是懒惰。


  作为开发者，如果你没有研究过如何做出好的设计，你很快就会被那些只读了一本相关书籍的人超越。在我职业生涯的早期，有多次我忽视了设计，结果付出了惨痛的代价。


  我记得有一次，我花了数周时间构建一个极其复杂的功能，结果管理层在整场会议上只谈论他们有多讨厌这个设计，而完全无视实际功能。如果我当时花几个小时来设计产品的观感和体验，那场会议和项目本来会有更好的结果。


  ### 公开演讲


  开发者软技能清单上最后一项是公开演讲。对于软件开发者来说，这似乎是一项毫无用处的技能。然而，让我给你两个场景思考一下：


  -   场景一中，有一位才华横溢但不擅长公开演讲的开发者。当被要求展示他构建的项目时——顺便提一句，那是一个构建得非常好的项目——这位开发者在整个演示过程中都用单调的语气讲话，产品演示也只是他一页接一页地切换。

  -   场景二中，有另一位出色的开发者。但这位工程师在公开演讲方面下了功夫，并呈现出一个组织良好的演示。他在房间里众人面前的时间充满了清晰的语言、有趣的轶事以及对每个功能的类比，让房间里的每个人都能理解这个项目。


  如果你在房间里，哪个项目看起来更有吸引力？不需要 MBA 学位也知道，场景中的那位开发者


  ### 软技能的重要性


  那么，现在你已经知道了这份清单。开发者软技能有多重要？我无法告诉你我曾多少次看到，一名能力较差的开发者仅仅因为在会议上能言善道或能与同事交谈，就被提升到管理岗位。


  请记住，这份清单中每一项技能的关键在于：它们让人们在你身边感到更自在，并且让他们相信你能完成任务。讨人喜欢和自信，是你在市场中取得优势所需的两个关键前提。





