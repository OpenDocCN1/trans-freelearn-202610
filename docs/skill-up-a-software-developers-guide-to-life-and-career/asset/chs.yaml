  ### DevCamp — Permissions

  - Permissions for campers to orgs 8 comments Jordan Hudgens


  ### DevCamp — Billing

  - Finish implementing payments from students to orgs via stripe 20 comments Jordan
  Hudgens · Mon, May 16


  关于使用 Basecamp 的缺点，根据你之前使用项目管理软件的经验，Basecamp 可能感觉不太自然。如果你习惯于基于甘特图的仪表板和类似的跟踪机制，Basecamp
  需要一些适应时间。


  它确实可以通过其附加模块拥有所有这些功能。然而，其核心 Basecamp 更专注于团队成员之间的消息传递、待办事项列表和调度。


  Basecamp 的移动端选项也不是最好的，我的手机上安装了它的 iOS 应用。然而，它并不最直观，尤其是与 Trello 等一些竞争对手相比。


  话虽如此，Basecamp 仍然是我的首选项目管理软件，因为它简单、快速，并且我被其待办事项列表结构所吸引。


  ### Trello


  我在大量项目中使用的另一个很棒的工具是 Trello。Trello 使用 Kanban 风格的项目管理。Kanban 是精益制造倡导者推广的工作流程，在高层面上它使用将卡片通过项目开发的不同阶段移动直到完成的概念：


  Trello 本质上为你提供了一个虚拟的 Kanban 看板，让你可以将任务通过产品开发生命周期的每个阶段移动。例如，在这里的图像中，我会将任务从 **To-Do**
  移动到 **Assigned**，到 **Working**，到 **Under Review**，最后到 **Finished**：


  然而，当我管理非常大规模的项目时，例如向 800 多名员工推出企业应用程序，它对我来说效果非常好。


  与 Trello 类似，LeanKit 也利用了 Kanban 的项目管理策略。然而，它更专注于企业而不是小型团队。LeanKit 提供的移动和平板应用程序直观且帮助我在旅行时管理项目，这是一个不错的额外好处。


  LeanKit 的优势在于它允许你嵌套和组织项目和子项目的能力。学习系统的工作方式后，管理大型团队相对直接。


  LeanKit 最大的缺点之一是我认为非常奇怪。他们有一种相当古老且需要大量手工操作的付款方式。我记得有几次我被迫通过电子邮件联系公司只是为了向我们的账户计划添加新用户。这对我来说不是致命问题。然而，这使其成为自由职业者不佳的选择，因为他们希望从同一个账户中开展多个项目。


  ### ProWorkflow


  ProWorkflow 是本顶级项目管理工具列表中较为标准的项目管理选项之一。它很好地结合了时间线、任务管理和团队协作等功能。我只做过一个使用 ProWorkflow
  的项目。然而，这是一次很好的体验，我使用该软件时没有任何抱怨。


  ### Wrike


  我对 Wrike 作为项目管理工具有一点爱恨交织的关系。如果你管理着一支开发团队，Wrike 是一个很棒的应用。作为项目经理，你可以使用它来查看每个项目的状态以及正在进行工作的每个任务的详细分析。


  然而，如果你是使用 Wrike 的开发人员，学习曲线相当陡峭。我很想认为我对理解如何使用新软件相当熟练。然而，我在 Wrike 的仪表板中不断迷路，很难找到向客户发布更新的地方。最终，我要求客户进行屏幕共享会话，我们一起浏览了我将使用的每个仪表板。


  话虽如此，如果你管理着多项目中的自由职业者团队，Wrike 是一个不错的选择，这就是为什么我把它列入此清单的原因。


  ### GitHub


  这可能看起来是一个奇怪的选择，列入顶级项目管理工具清单，因为从技术上讲，GitHub 并没有将自己定位为项目管理软件。


  然而，当我只与开发人员合作的项目时，我发现使用 GitHub 的问题跟踪模块可以充当项目管理工具：


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_195_0.png)


  正如你在特定问题的此屏幕截图中看到的，你能够：

  - 创建问题，这也可以是功能

  - 将用户分配给每个任务

  - 通过 Markdown 语法添加链接和图像

  - 将问题标记为已完成


  此外，对于经验丰富的开发团队，使用 GitHub 管理项目还有额外的好处，即使任务管理高效。例如，开发人员可以根据 Git 提交自动关闭任务。而且你使软件更易于使用，开发团队就会更喜欢它。





  '
- '## 第35章 开发者最佳自由职业记账选项


  在本章中，我将回顾最佳的自由职业记账选项。记账可能是我作为自由职业者最不喜欢的部分之一。要妥善管理自由职业业务，你必须管理各种各样的会计组件：


  - 利润与亏损报告，用于掌握你的整体盈利情况

  - 账龄报告，用于查看收款所需时间

  - 费用记录，确保你捕捉到所有潜在扣除项

  - 应收账款系统，以便你能收到款项

  - 项目跟踪工具，如果你正在为客户处理大型项目


  ### 自由职业记账选项


  多年来我用过许多记账解决方案，以下是我使用体验最好的一些。


  ### FreshBooks


  FreshBooks 是我用于自己自由职业业务的系统。就会计软件而言，它覆盖了我100%的需求：


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_198_0.png)


  幸运的是，它也很容易使用，这意味着我不必花时间学习如何使用该软件。它拥有直观的界面，让我能够登录、完成必须执行的任务，然后继续回去工作。


  ### 工作原理


  这是 FreshBooks 中对我来说很重要的一个界面：


  ### FreshBooks 附加功能


  完整浏览整个系统需要花上好几个小时，所以我只简单介绍一下我觉得最有用的其他功能：


  - **发票发送灵活性**：虽然电子发送发票很方便，但我仍有一些客户更喜欢纸质发票。幸运的是，FreshBooks 不仅允许我打印发票，他们还能直接替我把发票邮寄给客户。

  - **费用跟踪**：跟踪业务费用是一件乏味的事。不过，借助 FreshBooks 移动应用，我可以用手机拍照、输入费用详情，费用就会被记录到系统中。

  - **创建估算单**：过去，我会在 Excel 或 Word 里创建估算单，然后发给客户。如果他们批准了，我就必须把详细信息输入到发票中。然而，有了 FreshBooks，我可以创建估算单并直接通过电子邮件发送给客户。如果他们决定继续推进项目，估算单会自动转换为发票。


  ### 不足之处


  尽管我非常喜欢 FreshBooks 系统，但它确实有一些缺点。首先，如果你的客户数量很多，费用可能会有点高。此外，如果你开始雇佣大量员工，管理起来会变得有些笨重。就个人而言，我建议任何员工少于20人的企业使用
  FreshBooks。当你的业务增长超过这一规模时，你就需要转向一个更具可扩展性的系统。


  ### QuickBooks


  如果你已经超出了 FreshBooks 的适用范围，QuickBooks 可能是你业务的不错选择。在我印象中，QuickBooks 一直是小型企业会计软件领域的行业领导者。尽管该公司因系统难以管理而闻名，但在过去几年中，他们在让系统更灵活方面做得很好。


  当你列出小型企业会计软件可能需要的所有功能时，QuickBooks 应有尽有。此外，由于其普及程度，你雇用的任何管理员很可能已经拥有使用该系统的经验。


  话虽如此，我个人不会选择为 DevCamp 或我合作的其他任何公司使用 QuickBooks。主要原因是，我见过太多次公司发展超出 QuickBooks 的能力范围后，发现迁移到新系统非常困难。我也不喜欢该软件使用的报表引擎。例如，如果你计划通过大数据分析报表引擎运行财务数据，QuickBooks
  很难将数据导出为易于使用的格式。


  ### NetSuite


  如果你的业务在客户和员工方面都在增长，NetSuite 是一个很棒的记账选项。严格来说，NetSuite 对于典型的自由职业业务来说可能有些大材小用。然而，如果你的开发团队开始转变为一家成熟的全方位数字代理机构，你就需要一个强大的
  ERP 系统。ERP 系统与传统记账软件不同，它们会提供诸如以下工具：


  - **资源规划**：这意味着你可以按项目分配开发人员的时间。

  - **高级税务规划工具**：一旦你的业务达到一定规模，确保你利用所有可用的潜在税收扣除就变得很重要。ERP 系统这样的工具可以帮你做到这一点。

  - **薪资集成**：随着业务增长，管理员工、跟踪离职率以及诸如此类的任务变得越来越重要。然而，这些很难手动跟踪。NetSuite 这样的系统会计算你所有的员工跟踪指标，这样你就可以用它们来管理你的团队。


  ### 总结


  我希望这些自由职业记账选项能帮助你为业务选择合适的系统。

  '
- '## 第36章 掌握自由职业者获取新客户的秘诀


  如果你想要开展自由职业业务，最紧迫的挑战通常围绕如何获得新客户。当我最初启动自由职业业务时，我很努力地争取客户。


  然而，在传统渠道中挣扎了几个月后，我发现了一个很棒的解决方案，去年带来了超过29万美元的收入。这正是我在本章想要讨论的内容。


  ### 去哪里寻找新客户


  让我们先来看看自由职业者可以寻找新客户的选项清单。我读过无数关于这个主题的博客文章和多本书，以下是其中最受欢迎的建议：


  - **朋友和家人**：这可能看起来是自然的起点；然而，根据我的经验，朋友和家人通常希望你免费或以极低的价格工作。如果你刚刚起步并且需要建立作品集，这个渠道可能不错；但它不可扩展，而且通常利润不高。

  - **社交活动**：对于人脉拓展，你可以加入当地的商会，或寻找可以推广业务的社交群体。这种方法在某些情况下效果不错。然而，每次我尝试时都发现已经有好几位开发人员参加，他们也在为自己的自由职业业务寻找新客户。


  我不会因为自己的经历而阻止你尝试这个选项，但请确保你准备好与他人竞争。我记得几年前参加过一次商会的“见面会”。当房间里每个人介绍自己和业务时，有六位自由职业开发人员都在提供相同的服务。


  -   **外包服务**：这是我想在这里重点讨论的选项。有趣的是，许多自由职业“专家”告诉我这条路太难走。然而，我找到了一种很好的方式来利用它为自由职业者获取新客户。


  ### 自由职业者获取新客户


  我有点固执，所以花了一段时间才承认，但最终我接受了一个事实：我没有以自由职业者的身份获得新客户，尤其是用我当时一直尝试的方法。于是，我制定了一个计划，其中涉及雇佣一些我自己的自由职业者。我组建了一个团队，帮助弥补我的薄弱领域。


  为了开始以自由职业者身份获取新客户，我知道我必须拥有清晰编写的提案，描述我的服务。而且我也知道这些提案必须全天候地发送出去。


  ### 提案材料


  带着这个想法，我在 Upwork 上研究了销售文案撰稿人，并雇佣了一位有才华的营销人员，他为我创作了三份不同的提案。


  其中包括宣传我作为开发人员的经验、作品集和专业知识的销售文案。我制作了三个版本，因为我希望每个版本都能针对特定类型的项目。例如，其中一份提案专注于企业级项目。另一份提案针对
  API 开发，而第三份的内容则面向初创公司。


  ### 持续发送提案


  有了全套专业提案，我准备好实施计划的第二步：持续发送提案。为此，我从菲律宾雇佣了一位注重细节、英语流利的虚拟助理，名叫 Sy。


  我以每小时6.50美元的价格雇佣了 Sy，而他第一周就为自己赚回了成本！我向他介绍了这些提案，并描述了我希望承接的项目类型。





  在我确信 Sy 已经完全理解了我的目标之后，我就放手让他在 Elance 上大展拳脚。他审阅了市场上所有潜在的项目，并针对符合我标准的每个项目发送了我的定向提案。不到一周，我就开始收到客户的回复；不到两周，我就被多个项目雇佣了。三个月后，我不得不雇佣自己的开发人员，因为找我构建应用的客户太多了。


  #### 结果


  那么，我作为自由职业者获取新客户的策略效果如何？嗯，这是我的 FreshBooks 仪表盘截图。去年，我的自由职业业务创造了超过 29 万美元的收入：


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_207_0.png)


  有一个月甚至超过了 4 万美元：


  我不会假装这很容易。这与快速致富的计划截然相反。然而，通过实施这一策略，我可以经济高效地将自由职业业务的营销外包出去，从而专注于实际的开发工作。


  ### 总结


  我希望这是一份有用的指南，帮助你作为自由职业者获取新客户，并给你带来一些关于如何建立自己业务的想法。

  '
- '## 第 37 章 作为自由职业者管理客户冲突


  在本章中，我将讨论*管理客户冲突*。在生活和商业中，你难免会遇到与客户的冲突。一些最常见的冲突似乎包括：


  - 超出你最初估算的时间

  - 超出项目预算

  - 未能交付符合客户期望的功能

  - 应用程序中出现 bug


  处理这些问题都不是什么愉快的事，如果项目管理的每个阶段都加以适当的注意，大多数问题是可以避免的。然而，我想讨论的是冲突发生时会发生什么，以及如何最好地管理它们。


  ### 管理客户冲突的策略


  首先，不要让情绪失控。这对我来说可能是最难做到的一点，因为我热爱自己所做的事情，当项目中发生不好的事情时，我的第一反应是防御性的，这是最糟糕的反应之一。所以，当我看到客户发来愤怒的消息或接到电话时，我会确保在回应之前坐下来，试着从客户的角度来看待情况。


  客户很少会无缘无故地生气。大多数人都是理性的，并且倾向于避免对抗，所以如果客户生气，很可能有正当的理由。因此，我采取的第一步是假装自己是客户，然后我觉得我可以从那个角度给出更好的回应。


  如果项目超出预算，而我想象自己是客户，我就能理解他们为什么不高兴，因为我不喜欢为一件事花比原先被告知的更多的钱。因此，与其用一些防御性的消息回应，比如：


  > “这不是我的错，是你们改变了范围”


  或者


  > “我无法控制设计师花了双倍时间才交付设计稿这一事实”


  我会先说一些表明我理解他们观点的话，例如我会说：


  > “我完全理解这有多令人沮丧，项目范围扩大了，在原有的时间线内满足所有需求确实很困难”


  或者


  > “我很抱歉，我应该为设计阶段分配更多时间，这是我的错，我会努力解决”


  如果你假装自己是客户，听到这四种回应，哪一种会让你更安心？是我防御性地试图责怪别人，还是我承担责任并冷静回复的那些？


  在面对冲突时，最容易做的事情是变得防御性或咄咄逼人；然而，这两种方法都无法解决问题，而且很可能会让事情变得更糟。


  > 当你和客户之间出现冲突时，你的首要目标应该是尝试从他们的角度看问题。


  话虽如此，有时核心问题确实出在客户身上。他们可能很不擅长陈述项目需求，或者可能只是沟通不畅。几年前，我有一位客户雇佣我构建一个应用程序，只给了我其他网站的 4-5
  张截图，然后他就完全消失了。我尽最大努力构建我以为他想要的东西，并每天向他发送更新，但一个月后，他愤怒地给我发消息说应用不是他想要的，然后列出了一堆缺少的功能，尽管这些功能他最初从未要求过。


  我冷静地当场解雇了他这位客户，并告知他我无法继续在这个项目上工作。我没有提高嗓门，也没有解释他几乎没有为构建应用提供任何指导，但我知道他不是那种我能有效合作的客户。


  我希望这是一套关于如何管理客户冲突的好建议。在写这份指南之前，我做了相当多的研究，看看是否有遗漏的内容，结果发现基于冲突解决的信息几乎可以装满一座图书馆。


  关于人格类型的讨论和缩写词多到我不想在这里一一列举，然而，我在本指南中为你写的内容是我多年使用的方法，它帮助我应对了许多具有挑战性的情况和各种不同性格类型的客户。我相信它同样也会对你和你的客户有效。

  '
- '## 第 38 章 帮助获取新客户的自职业作品集示例


  在本章中，我将讨论*自由职业作品集示例*，你可以用它们来吸引客户。在决定要在作品集中包含哪些类型的项目之前，回答几个关键问题很重要：


  - 我要向谁展示这个作品集？

  - 我喜欢开发哪些类型的功能？


  第一个问题相当标准；你需要了解你的受众，以确保你的作品能够产生最大的影响。例如，如果你想吸引小型夫妻店，那么在作品集中塞满 3D Unity 僵尸游戏渲染图就没有太大意义了。


  第二个问题关系到你作为开发者的热情。太多的程序员创建了充满普通项目的作品集，他们并不真正热爱这些项目，这一点潜在雇主和客户都能看得出来。确保你构建的项目符合你作为开发者的个性，并且你对最终结果感到满意。作品集项目不是简单地从你的开发者清单上划掉的条目，它们应该是你个人引以为豪并且喜欢构建的项目。


  ### 自由职业作品集示例


  以下自由职业作品集项目示例包含了全面的功能集，应该会给各种客户留下深刻印象。不过，它们只是起点，不是硬性规定。


  #### 社交网络工具


  这类项目是构建一个设计简洁的基本社交网络，具备帖子、关注者和评论等功能，并整合至少一个独特/高级功能，例如让用户能够互相编辑帖子。


  当我想雇佣新开发者时，我希望看到他们能够自如地处理复杂的数据模型，例如社交网络应用所需的数据模型，并且能够处理高级权限结构非常重要，所以这是一个不错的作品集项目。


  #### 一个 API 工具


  例如，为 Stack Overflow 开发一个搜索引擎，使其具备比主 Web 应用更高级的功能。这样的项目可以证明你能够使用 API，并且能够实现搜索引擎功能。


  #### 一个会计应用程序


  你不需要重建 QuickBooks。不过，一个会计项目可以展示你懂得如何处理财务计算、回调、高级数据库查询和信息安全。


  #### 一个日程安排应用程序


  我构建过几个日程安排应用。这类应用可以展示你懂得如何处理日期和时间（这对任何开发者来说都不是容易的任务），以及复杂的验证。


  #### 一个前端应用程序


  使用 AngularJS 或 React 等前端框架创建一个应用，并将其与 Ruby on Rails 等服务端后端集成。这将展示你懂得如何运用基于服务的架构和设计，而这正是我的客户的一个先决条件。


  如果你构建了这些应用（或包含同等水平的应用


  这种专业水平将让你能够向潜在客户、同事和未来的雇主清晰地展示你的专业能力。这些项目还会为你提供一个出色的代码库，供你在未来的项目中参考。


  我已记不清有多少次回看过去的作品集项目，只为查看自己当时是如何实现某个特定功能的，以便在我当时正在开发的应用中使用同样的做法。希望这份清单能激励你构建出自己的项目作品集。

  '
- "## 第 39 章 测试驱动开发对程序员的重要性\n\n让我们来讨论**测试驱动开发**的重要性。首先，如果你对 TDD 或 BDD 这些术语感到陌生——它们分别是测试驱动开发和行为驱动开发的缩写——那么它们指的是为应用程序构建代码测试的做法。\n\
  \n更具体地说，TDD 和 BDD 是*软件开发流程，即在实现任何代码之前，先创建一个测试来设定预期结果。*\n\n下面是一个使用 TDD 为用户类创建“返回全名”功能的示例：\n\
  \n1. 创建一个测试，调用名为 `full_name` 的新方法；该方法将用户的名和姓组合起来，并返回一个把两部分合并为单个值的字符串：\n\n![](img/de22e3e00f8df753e0d57f7da4d1c581_216_0.png)\n\
  \n2. 然后运行测试，同时知道它会失败：\n\n### 测试失败\n\n3. 接着，添加一个最基本的代码实现：\n\n### 实现代码\n\n```ruby\n\
  def full_name(first, last)\n  first + \" \" + last\nend\n```\n\n这样测试就会通过：\n\n###\
  \ 测试通过\n\n4. 然后回头重构实现，以确保其符合最佳实践，并且重构不会破坏任何东西：\n\n### 重构代码\n\n```ruby\ndef full_name(first,\
  \ last)\n  return \"\" unless first && last\n  first + \" \" + last\nend\n```\n\n\
  这个过程被称为“红、绿、重构”工作流，是所有语言和框架中相当标准的实践。\n\n在*极限编程*中，贝克（Beck）说，测试是让开发过程不偏离轨道、不超出预算的最大关键之一。\n\
  \n3. **文档**：当一个使用 TDD 构建的应用程序完成后，测试应该能够提供该软件 100% 的文档。某些测试框架（如 RSpec）甚至能够以文档形式输出测试，完整描述应用的行为，即使是非技术人员也能理解。\n\
  \n4. **引导开发过程**：编写优秀软件的最重要关键之一，是尽可能将代码拆分成许多小而易于管理的块。使用 TDD 时，你自然会写出小方法、高效的类定义，并且代码膨胀会降到最低。当你遵循\
  \ TDD 实践时，测试本身应当引领软件开发，最终结果应该是一个组织良好且可扩展的代码库。\n\nTDD 有一个告诫：如果测试套件结构不佳，测试就毫无意义。如果你只是创建大量测试，而这些测试除了测试某个语言或框架的核心功能外没有任何作用，那么你的测试套件将不会带来任何好处。然而，如果你在构建应用时让测试驱动你的开发和代码结构，你最终会得到一个值得骄傲的优秀应用。\n\
  \n如需了解更多信息，我建议阅读*马丁·福勒*（Martin Fowler）的完整系列文章，这被视为有史以来对 TDD 最深入的讨论之一。\n\n### 小结\n\
  \n希望本章能帮助你回答与 TDD 重要性相关的问题，祝你面试顺利！\n"
- '## 第 40 章 自由职业者的 SEO 最佳实践与策略


  如果你构建的是用户通过网络访问的应用，那么你很可能被客户要求提供一个对 SEO 友好的网站，以帮助将新客户引导到他们的网站。你可能也意识到，SEO 的世界如此广阔，即使你把余下的职业生涯都用来研究它，也无法完全掌握。


  话虽如此，我发现只要遵循一套 SEO 最佳实践，我创建的网站就会对搜索引擎友好，客户也会对其获得的自然流量感到满意。搜索趋势似乎每天都在变化，而我个人没有时间去追踪谷歌搜索算法的每一次更新。因此，我专注于
  SEO 最佳实践；这些实践对我来说效果不错，而且它们遵循搜索引擎的白帽营销做法，这样我就不用冒被谷歌或必应惩罚的风险。


  ### SEO 最佳实践教程


  首先，*内容为王*。独一无二的优质内容永远是 SEO 最重要的标准。


  ### 内容为王


  作为一个从计算机科学角度花了无数小时研究谷歌搜索算法的人，我可以说，这个算法想要做的全部事情，就是把搜索用户与他们正在寻找的最佳、最相关的内容连接起来。


  算法的所有细微之处，例如页面排名、链接计数等，都只是谷歌试图自动在互联网上找到最佳内容的方式。话虽如此，优质内容本身并不能保证流量，但没有它，你无法在搜索引擎中获得很长时间的关注。


  ### 反向链接


  第六是反向链接。这是一个危险的领域，因为反向链接曾经是决定网站页面排名的首要标准。我记得大约 15 年前，刚开始做网站时，如果我能让一个热门网站链接到我发布的网站，新网站就会开始获得搜索引擎流量，并在
  24 小时内出现在搜索结果中更靠前的位置。


  不过，情况已经发生了很大变化，反向链接如今不像过去那么重要，但仍然很有帮助。我之前说反向链接可能很危险，是因为谷歌在检测试图钻空子的用户方面已经变得出奇地擅长。如果你使用黑帽技术获取反向链接，很快就会发现自己的网站受到惩罚，甚至被谷歌完全除名。


  所以，我现在获取反向链接的做法是：使用 HARO 等工具联系记者和其他博主，在其他网站贡献引言并接受采访。作为回报，他们通常会链接到我的某个网站。


  这种建立反向链接的方式较慢，但从长远来看是个好策略。谷歌还会关注那些向你收费、让你发布客座文章并链接回你网站的站点，所以我强烈建议远离这类服务。


  ### 内容聚焦


  这份清单的最后一项是，你的内容要有焦点。射箭时，有靶子会更有帮助；写博客文章或发布页面时，有一个目标关键词也很重要。创作内容时，我会选择一个短语，并让整篇内容围绕它展开。


  如果没有焦点词或短语，你的文章很难获得关注。因此，请确保你创作的每一篇文章都始终保持聚焦。市面上也有很多不错的工具，可以确保你遵循搜索引擎最佳实践。通常，我会使用一款名为
  Yoast 的工具，它对每篇文章采用复选框式的方式。


  ### 小结


  希望这份 SEO 最佳实践总结对你有所帮助，你可以将其用在自己的项目中，为自己或客户的网站带来更多流量。

