- '## 第1章 发现开发者的临界点


  如果你编程已有一段时间，那么你可能想过这样一个问题：


  > “我是一个优秀的开发者吗？”


  在继续之前，让我和你分享一个小秘密……每一位开发者，甚至资深开发者，在编程时都会有不安全感。很少有人愿意分享这一点，主要是因为出于某种愚蠢的原因，自信甚至傲慢已成为开发者的刻板印象。


  不过，我不会对你胡说。我可以告诉你，作为程序员，我的经验越丰富，就越意识到还有多少东西要学，还有多长的路要走。


  ### 开发者的临界点


  话虽如此，我想讨论如何定义开发者的临界点，这个点本质上就是开发者从新手变为专家的时刻。由于这个主题有点抽象，我们不可能指向某个具体时点说：


  > “就是这里，这是所有一切都豁然开朗、变得有意义的时刻。”


  编程精通并非发生在一个标志性的瞬间。每个人各不相同。


  ### 我自己的经历




  我记得最初学习编程的时候，理解语法和上下文对我来说并不容易。我似乎花了99%的时间去查资料，复制粘贴别人的代码，才勉强让程序跑起来。


  ### 怀疑的机器


  不用说，作为程序员，我一开始的信心非常低。我不断被挥之不去的怀疑所困扰，比如：


  - 也许编程不适合你

  - 即使你的代码能运行，你也写不出自己的程序

  - 你只是在照着书上的指示输入，你无法构建任何定制的东西


  消极的想法就这样继续下去。


  ### 痛苦的过程


  如果你是一名新开发者，也许其中一些听起来很熟悉，或者也许并不熟悉，只是我缺乏信心。无论如何，我艰难前行，尝试了一切我能想到的方法来提升自己：


  - 翻阅几十本不同语言的编程书籍

  - 尝试建立项目作品集

  - 跟随在线指南


  然而，在我最初学习编码的时候，在线资源可没有今天这么好。


  ### 转折点


  那么，是什么让我最终跨越障碍，成为一名专业开发者呢？不是那些事情……也是那些事情。我坚持一个又一个项目，并尽可能消化所有能找到的训练资源。慢慢地，一些奇妙的事情开始发生：


  > “一切都开始变得有意义了。”


  ### 第一个转折点


  尽管那是很久以前的事，但我仍然记得第一次开发转折点发生的时刻。我坐在咖啡店的电脑前，正在开发一个 Web 应用程序。


  几个小时过去了，我突然停下来，意识到自己整个下午都在构建项目，而没有查阅任何一段代码。我并不是说我在编写空间站程序，那个项目真的非常基础。然而，那是我生命中最激动人心的时刻之一。


  ### 第二个转折点


  虽然那很好，但我还有很长的路要走。我记得接下来那个让我感觉自己达到另一个关键里程碑的时刻。尽管作为开发者的信心有所增长，但一想到有人会看到我的代码，我还是非常害怕。不过，那时我已经开始经营我的自由职业业务，一位客户（同时也是开发者）邀请我和他进行一次结对编程。


  他在我们正在构建的程序中遇到了一个 bug，请我加入屏幕共享会话，这样我们可以同时处理项目。说实话，当他提出时我吓得要死。我以前从没在任何人面前写过代码，想到要和这位客户一起写代码，我几乎要惊恐发作了。然而，在那件事上我别无选择，于是我和他开始了会话。紧张了几分钟后，我开始放松下来，令我惊讶的是，我不仅没有出丑，还真的找出他代码中的
  bug，并使那个功能正常工作了。


  ### 秘密


  那么，我跨越难关、从新手变成专业开发者的秘密是什么呢？遗憾的是，并没有简单易行的配方。然而，有一个过程是必定有效的。


  ### 解决方案


  如果你希望得到快速修复的方法，我很抱歉。我可以从经验告诉你，成为开发者没有捷径。你需要学习：


  - 编码的基础知识

  - 如何独立构建项目

  - 处理 bug 的各种流程


  成为一名优秀的开发者并非易事。然而，可以感到安慰的是，你对自己能达到的水平有 100% 的掌控力。公式很简单：越努力，就越好。所以，尽可能获取你想学习的语言和框架的所有资料。挑战有难度的应用程序，你就会走上精通之路。


  很快，当一切都开始串联起来时，你也会拥有那个令人兴奋的清晰时刻。

  '
- '## 第 2 章 开发者是天生的还是后天培养的？——破除天才神话


  在与开发学习者交谈时，我发现有一个话题总会出现在对话中。那就是一个错误观念：优秀的开发者天生就有一种特殊的编程基因。那么，让我们从实际的角度来探讨这个问题：*开发者是天生的还是后天培养的？*


  ### 天才存在吗？


  在讨论这个问题之前，让我们先退一步，谈谈天才这个话题。因为每当人们认为某个群体天生就拥有超人的天赋时，他们本质上是在说这些特殊的人是天才。


  ### 莫扎特案例研究


  但天才真的存在吗？让我们看看有史以来最著名的天才之一——莫扎特。莫扎特 5 岁时就能为皇室演奏音乐会级别的乐曲。这当然算得上是天才，对吧？


  在*安德斯·艾利克森*的著作《*刻意练习：如何从新手到大师*》中，他破除了一系列常见的天才神话。关于莫扎特，他是这样说的：


  > “如果你将莫扎特在不同年龄能演奏的乐曲类型与今天接受铃木教学法的孩子们相比，他并不出众。如果要说有什么的话，他相对普通。”


  在书中，艾利克森用整整一章来揭穿天才的概念。在每一个案例中，他都说明这些人是通过大量的努力才达到各自的成功水平的。


  ### 开发者是天生的还是后天培养的？


  延续莫扎特的案例，我们来谈谈这如何应用到开发者身上。每当我们看到一个熟练的程序员，很容易认为他们天生就有构建应用程序的才能，并且学习新语言和框架对他们来说轻而易举。


  然而，事实远非如此。多年来，我认识的开发者多到数不清，但我还没有发现一个天生就是开发者的。我认识为谷歌和亚马逊工作的程序员，也认识研究领域让我难以想象的计算机科学教授。尽管这些人都非常出色，但他们每一个人都是通过努力和奉献才成为优秀开发者的。


  ### 转折点


  在[第 1 章](#) *发现开发者的转折点*中，我已经讨论了开发者的转折点。我教得越久，自己编码技能提升得越多，就越相信卓越的关键就是专注的练习，如此简单。


  如果你足够渴望成为一名熟练的开发者，并且你愿意：


  - 投入时间

  - 向有经验的老师学习

  - 克服令人沮丧的挑战

  - 不断构建包含你从未开发过功能的项目


  那么，总有一天你醒来时会发现，一切都在顺利运转，你已经成了一名专业程序员。


  ### 为什么我们喜欢天才神话


  在结束本章之前，我想谈谈一个微妙的问题，它解释了为什么我们人类喜欢天才这个概念。


  天才的概念，即某些人天生就具备在特定技能（如体育、数学或编程）上取得成功的能力，可能对我们自己的成功有害。这种信念很危险，因为它会让我们的头脑对失败产生消极反应。


  例如，如果你是一位有抱负的开发者，认为程序员是天生的而非后天培养的，那么当你遇到一个似乎无法解决的 bug 或无法构建的功能时，你的第一反应可能是：


  > *我猜我天生就不是当开发者的料。*


  或者：


  > *我希望能像某位程序员那样有天赋，对他来说一切似乎都那么轻松。*


  如果你发现自己有这样的想法，请提醒自己：天才并不存在。


  开发者是通过聪明的努力和坚持不懈才取得卓越成就的。*马尔科姆·格拉德威尔*《异类》一书中的 10,000 小时法则可能并不完全准确。但它确实给出了达到精通水平所需工作量的通用指南。


  如果你觉得自己没有“开发者基因”，那就去完成 10,000 小时的专注练习，用来构建应用程序。我想你会惊喜地发现，你会变得如此优秀，以至于别人看着你时，会以为……你天生就是如此。





  '
- '## 第三章：成为开发者必须是天才吗？


  我们已经讨论了“伟大的开发者是天生的还是后天培养的”这一话题。在本章中，我们将从一个不同的角度来审视类似的话题，并回答这个问题：*成为开发者必须是天才吗？*


  由于编码近乎神奇的特性，我从那些听说我职业的人那里听到的最常见的评价之一是：


  > “哦，哇，你太聪明了！”


  事实上，就在最近，我去见了一群开发者，公司负责人这样介绍我：


  > “这是乔丹，他就是来这里负责聪明的。”


  我知道人们说这些话是出于好意。然而，这让我感到困扰。困扰我的原因有几个：


  1. 首先，这类评论让人觉得，成为一名出色的开发者只需要聪明就够了。

  2. 承接上一点，这些言论贬低了学习开发所需的无数小时的努力。


  ### 奔跑的人


  我暂时先放下说教，来聊聊史蒂夫·普雷方丹（Steve Prefontaine）的生平。如果你从未听说过他，普雷方丹是当时世界上最伟大的跑步运动员之一。在24岁不幸死于车祸之前，他已经打破了七项田径世界纪录。


  在他走向成功的巅峰时期，许多人会试图通过称赞他多么有天赋、并称他


  作为开发者，采取与普雷方丹相同的态度很重要。如果你陷入“只有天才才能成为优秀程序员”的陷阱，那么当任务变得有挑战性时，你很可能会放弃。这是因为我们的大脑总在寻找更省力的方式。而如果你认为成为天才是开发工作的必要条件，你就有了一个内置的借口，可以在开发者学习之旅中动摇。


  ### 大脑的运作方式


  在《科学美国人》上发表的一项综合教育研究（http://www.scientificamerican.com/article/the-secret-to-raising-smart-kids1/）中，孩子们被分成两组，并完成了一些学术任务。两组在任务中的得分大致相同。其中一组受到了父母和老师的表扬，表扬的重点集中在孩子们有多聪明、多有才华上。


  第二组学生则受到了不同的表扬。他们没有因天生的能力而受到称赞，而是因学习有多努力而受到称赞。


  在这一轮表扬结束后，同样的两组学生接到了新的、非常有挑战性的任务。


  第一组学生，也就是那些被称赞聪明的学生，最终放弃了，没有完成分配给他们的任务。然而，第二组学生，即那些因努力学习而受到表扬的学生，表现得比第一组好得多。


  ### 原因


  那么，为什么两组学生在表面上看实际技能水平相同的情况下，结果却如此不同呢？


  研究人员得出结论：第一组的学生认为最优先的事情是维持自己的*天才*地位。于是，他们早早退出了第二项任务，因为不想表现不佳，玷污自己得到的*天才*标签。


  然而，第二组学生并没有感到维持天才身份的压力。相反，他们想要维护自己作为勤奋者的新声誉。带着这种心态，第二组学生坚持攻克了具有挑战性的课题，而不是放弃。


  ### 更明智的方法


  因此，不要抱持“成为开发者需要你是天才”的心态，而要抱持“最优秀的开发者同时也是最努力的开发者”的心态。采用这种方法，你的技能潜力实际上是无限的。你百分之百掌控着作为程序员你会变得多优秀。你的成功将完全取决于你愿意付出多大的努力（以及多聪明的努力）。

  '
- "## 第四章：如何学习和理解复杂主题？\n\n年轻时，我学习新的或困难的科目时常常很吃力。经过多年以及大约十年的大学生活和研究生院经历，我总结出了一套学习与理解复杂主题的方法。通常，我会将这套学习系统应用于算法和软件工程等科目；不过，它可以应用于任何主题。\n\
  \n尽管市面上有近乎无穷无尽的学习策略，但我喜欢这种方法，因为它采用了分而治之的策略，专注于将复杂主题分解成易于理解的组成部分，最后再将这些部分重新组合起来，看看它们是如何协同工作的。\n\
  \n### 一套学习体系\n\n让我们看一个案例研究：理解对数的工作原理。对数广泛用于数学和计算机科学领域；然而，如果你不经常使用它们，就很容易生疏：\n\n\
  1. 我要做的第一件事是拿一张纸，在中心写下“Logarithm（对数）”并画个圈把它圈起来。\n2. 接下来，我会去找一篇关于该主题的综合性文章，比如维基百科上的一篇。在阅读第一句话时，我遇到了一些有点模糊的术语：\n\
  \   - 逆运算（Inverse operation）\n   - 求幂（Exponentiation）\n\n   我会停止阅读对数文章，转而去读关于这两个术语的文章，直到我对它们所代表的含义感到清楚为止。当我对这两个概念理解透彻后，我会把它们分别写成自己的圆圈，并与“对数”圆圈连接起来。如果有必要，我还会添加一些有助于理解这些术语含义的示例。\n\
  3. 接下来，我会回到最初的对数文章，继续阅读，并重复这一过程，直到整张纸被一张思维导图填满，这张图解释了对数的各个组成部分以及它们如何协同工作。其中可能包括基础案例示例，例如：\n\
  \n   64 = 2^6 等同于 log 2 (64) = 6\n\n如果这看起来是一种极其简单的学习方法……确实如此。学习的目的是掌握一个主题，而理解复杂主题最简单的方法之一就是将其分解成易于理解的组成部分。例如，如果你想从头理解计算机科学中的一个高级算法，你可能会感到有点畏惧。\n\
  \n然而，如果你把算法分解到足够小的组件，你会发现它本质上是一个由连接简单模块组成的步骤过程，比如循环、变量操作和使用条件语句。只有当你试图把问题作为一个整体来思考时，它才是困难的。然而，任何概念都可以理解，只要你把它简化成易于理解的部分。\n\
  \n显然，主题越复杂，解构所需的时间就越长；然而，我坚信，只要全身心投入并付出努力，任何人都能理解任何主题。希望你能利用这种思维导图方法去理解复杂主题，并希望它能帮助你学会如何正确地学习、真正地学会。\n"
- '## 第五章：开发者的高效学习实践


  想象一下，你回到了学校，期中考试即将来临。你会怎么学习？一些常见的方法可能是：


  - 重读学习资料或课堂笔记

  - 高亮并记忆关键术语

  - 不断复习笔记，直到考试来临


  这些听起来都像是有效的学习实践。然而，认知研究表明，学生们几十年来遵循的许多传统学习模式根本不起作用。


  那个学习模式清单并不是我编造的。那正是我以前备考时所做的。然而，在经历多次考试失败后，我发现这些策略在帮助我真正学习新概念方面彻底失败了。


  ### 为什么传统学习习惯不起作用


  这种学习方法之所以不起作用，是因为我们的大脑不像电脑那样运作。电脑可以接收信息，然后再原样输出。然而，我们的大脑本质上更具关联性。


  所谓本质上的关联性，是指我们的大脑像一个基于图结构的网络那样运作。如果新信息在进入大脑时没有与我们已有的任何知识建立联系，它就会被直接拒绝。


  例如，假设你刚开始学习编程。如果你只是过一遍编程术语和语法规则列表，你也许能在短期内记住它们。


  然而，因为你的大脑还没有被适当地引入





  #### 一个有效的学习实践案例研究


  每当我向学生教授一个新的编程概念时，我都会尝试为其绘制一个与现实世界概念相符的类比。这个过程被称为再物化（reification），我认为这是作为一名教师最重要的任务之一。


  让我们想象一下，你正在学习软件开发中的 MVC（Model, View, Controller）设计模式。你可以采取试图记住 Model、View 和 Controller
  各自角色的方法。然而，这种策略并不能帮助你回答关于各组件如何协同工作相关的问题。而且，如果你死记硬背测验题目和答案，你很可能会在遇到未背诵的内容时出现问题。


  #### 再物化示例


  如果不是试图记住 MVC 模式的关键术语，而是专注于为该过程绘制一个现实世界的类比会怎样？我最喜欢理解这种架构的方式是将其与一家餐厅进行比较：


  - **Model：** 模型就像厨房里的厨师。厨师为顾客准备餐食的方式与模型直接处理应用程序数据的方式相同。

  - **Controller：** 控制器的工作方式就像餐厅服务员。在应用程序中，控制器的角色基于接收请求并管理模型与视图之间的通信。这就像服务员接收顾客订单、与厨师沟通，最终将食物端到餐桌上一样。

  - **View：** 视图就像顾客坐着的桌子。它除了提供放置食物的平台外几乎什么都不做。这与视图在应用程序中应有的运作方式完全相同。如果构建得当，视图应该只是一个向用户展示数据的地方。


  你看我们刚才做了什么？我们学习了 MVC 设计模式


  ### 综合学习系统


  除了再物化过程之外，研究还表明有许多其他学习策略比传统学习方法更有效。在他们的著作 *Make It Stick* 中，认知心理学家 *Brown, Roediger,
  and McDaniel* 给出了以下学习建议：


  - 在从教科书学习时，使用每章末尾的关键术语来测试自己。

  - 列出关键术语并在一段文字中使用每一个术语；这将测试你是否在教科书或讲师提供的范围之外理解了概念。

  - 在阅读新材料时，将主要概念转换为一系列问题，然后在读完章节后回头回答这些问题。

  - 在学习材料的过程中，用自己的话重新表述主要思想。

  - 将主要概念与你自己的经历联系起来，就像我们已经讨论过的再物化过程一样。

  - 在文本之外寻找关键概念的示例。当我学习一种新的编程语言时，我从不依赖单一来源。如果我遇到一个不明白的概念，我通常会查阅 2-3 个其他来源，这些来源提供对我试图学习的内容的替代解释。

  '
- '## 第 6 章. 定义深度工作及其对开发者的意义


  站在领奖台上，迈克尔·菲尔普斯凝视着美国国旗，在再次赢得金牌后聆听国歌。观看菲尔普斯赢得 21 枚金牌（在我撰写本文时）后，自然会问：“他是否天生就是伟大的？”我不知道。是的，他的身体类型帮助他利用了游泳的身体要素。


  然而，有数百万与他身高和臂展相同的人每四年从沙发上观看他在奥运会上的比赛。菲尔普斯并没有天生拥有某种神奇的游泳基因。相反，他成功的秘诀在于他对一种名为 *deep
  work* 的实践的自律。Muscle Prodigy (https://www.muscleprodigy.com/michael-phelps-workout-and-diet/)
  研究声称：


  > “菲尔普斯每周至少游泳 80,000 米，几乎是 50 英里。他每天练习两次，如果在高海拔训练，有时练习更多。菲尔普斯每周训练六天，每天训练大约五到六小时。”


  如果马尔科姆·格拉德威尔的 1 万小时定律即使接近准确，迈克尔·菲尔普斯早在多年前就已超过这一基准。


  如果你想知道这如何适用于编码，不用担心，我没有忘记这是一个面向开发者的节目。


  ### 深度工作的定义


  在阅读这些章节时，你可能会发现我最喜欢的书籍之一是 *Cal Newport* 的 *Deep Work*。（我引用了这本书几十次的事实可能已经说明了一切）。那么，深度工作到底是什么？深度工作一个非常简单的解释是：


  > “深度工作是指能够专注于认知要求高的任务而不受干扰的能力。”


  无论你是否认为游泳是认知要求高的，还是不是，我认为菲尔普斯的例子很贴切。如果你曾经尝试过以菲尔普斯的强度进行训练，你可以证明训练对精神的消耗。因此，本质上，深度工作可以简化为具有以下特征：


  - 1. 它是一个现实世界的行动。它不是一个理论概念，而是一个你可以实际实施的东西。

  - 2. 要正常工作，你必须消除 100% 的干扰。

  - 3. 该任务必须具有挑战性。


  ### 面向开发者的深度工作策略


  让我们剖析深度工作的定义，并为其如何从开发者角度实施构建一个实用策略。让我们想象一下，你想学习计算机科学主题渐近分析。如果你从未听说过渐近分析，不用担心，你可以相信我它确实是一个具有挑战性的主题。


  ### 采取行动


  让我们从深度工作是一个行动这一事实开始。有了这个认识，你需要设定一个明确定义的时间段。如果你从未练习过深度工作学习，我建议将时间段限制在大约两小时左右。正如你会发现的，深度工作是一项消耗性的任务。就我们的例子而言，让我们想象你已将上午
  9 点至 11 点指定为学习渐近分析的时间。


  ### 消除干扰


  时间段设定后，现在是时候消除所有潜在的干扰了。让我 100% 明确地说，这意味着：


  - 1. 你不能查看电子邮件。

  - 2. 不接电话。事实上，将你的手机调至飞行模式，以确保没有人打电话或发短信给你。

  - 3. 不要甚至想查看 Instagram、Facebook、Twitter 或 Tinder。你的所有滑动权限都必须等待几个小时。


  如果我遗漏了任何干扰，你可以将其添加到列表中。听古典音乐以阻隔潜在的声音干扰在学习时也可能有所帮助。


  ### 努力学习并聪明学习


  现在你已经为学习渐近分析分配了几个小时，并且移除了所有干扰，是时候开始工作了。如果你认为现在你可以简单地开始阅读几篇维基百科文章，我很抱歉，那不会为你赢得深度工作徽章。


  要使深度工作真正有效，它必须是困难的。如果我第一次学习渐近分析并想在学习时练习深度工作，我会采取以下方法：


  - 1. 我会先阅读该主题的多个在线资源。

  - 2. 接下来我会观看在线讲座并做笔记。

  - 3. 我会找到练习题并尝试从头开始解决问题。

  - 4. 接下来，我会写一篇博客文章或录制自己教授该概念的过程。

  - 5. 最后，我会让另一名学生或讲师审阅我的教学和练习，以确保我正确理解了概念。


  你是否看到了这种学习方式比以往更全面？即使在深度工作学习会议之前你从未听说过渐近分析，在你完成之后你也会精通它。






  ### 总结


  我希望这能帮助你了解什么是深度工作，以及作为一名开发者如何实际运用它。如果你想了解更多关于这个话题的内容，我建议你读一读纽波特的书。它会为你提供一套很好的工具，帮助你学会如何利用深度工作不断提升自己。在学习方面，深度工作最接近“兴奋剂”。祝你编码顺利！

  '
- '## 第7章 开发者的任务切换成本


  在本章，我将讨论**任务切换成本**的概念。任务切换，通常被称为**多任务处理**，可能对你的开发者表现产生不利影响，甚至可能导致项目出错。过去十年，我们的世界发生了巨大变化，但好坏与否不是本章要讨论的话题。不过，有一点是确定的：我们不断被各种干扰所轰炸。


  在我研究本章时，我收到了十几封电子邮件、7 条 Snapchat 消息、30 条 Instagram 通知、7 条 Twitter 通知、5 条 Skype 即时消息，而且令人意外的是，只有
  9 条短信。如果你在计数的话，过去两个小时里，我收到了大约 72 条各种通知。此外，我是在一家充满潜在干扰的咖啡店里研究本章的。


  那么，干扰到底有多糟糕呢？来自加州大学欧文分校信息学系教授 Gloria Mark 的研究（https://www.fastcompany.com/944128/worker-interrupted-cost-task-switching）表明，在受到干扰后，平均需要
  23 分 15 秒才能完全重新回到任务上。这对生产力来说是非常、非常糟糕的事情；然而，我自己也亲眼见过，我记不清有多少次，我在开发项目进行到一半时收到一封完全不相关的电子邮件，而我并没有忽略它继续工作，而是读了它，然后花时间处理另一项任务，之后才回到项目上。


  这听起来可能不是什么大问题，但问题是，当我回到项目时，我并不是从上次离开的地方继续，而是不得不重新熟悉我在被打断那一刻正在做的事情。如果问题很复杂，我可能需要比
  23 分钟更长的时间才能回到状态并继续项目工作。


  那么，在一个充满电子邮件和社交媒体干扰的世界里，人们怎么能真正完成工作呢？在读过卡尔·纽波特的*深度工作*之后，我开始整理一些既能高效工作又能与世界保持联系的实用方法。


  ### 一套降低任务切换成本的方法


  - 1. 如果我在做一个项目，我会在那天早上留出特定的时间。例如，如果我计划花 2 小时做项目 X，我会把它放到日历上，并标注从上午 9 点到 11 点我在做项目
  X。

  - 2. 在那段时间里，我会清除所有负面干扰。这意味着我通常会把手机调到飞行模式，这样我就不会收到任何社交媒体通知。注意我说的是“负面干扰”吗？我之所以这样区分，是因为
  UC Irvine 的同一份研究报告表明，并非所有干扰都是坏事。如果干扰与你正在做的工作相关，它实际上可能是有益的。例如，如果我在开发一个 Web 应用的路由引擎，客户给我发消息讨论应用，他们所说的内容可能真的会影响我正在做的工作，或者给我一个改进它的想法。这是一种好的干扰，也是为什么我在工作时通常会保持电子邮件和即时通讯工具在线。然而，如果我看到
  Skype 消息或电子邮件来自另一个客户，或者完全不相关，我会直接忽略它。我确实认识许多深度工作的支持者，他们会说你必须消除 100% 的干扰；但这并不总是现实的。

  - 3. 无论你是在学习还是工作，都要有一个明确的终点。如果你不为任务设定结束点，你的思想很容易走神，就像没有终点的赛跑者无法有效比赛一样。关于任务切换成本的研究还表明，即使是计划中的干扰也是有害的，所以如果你计划连续工作
  2 小时，不要计划中途休息。在分配的时间内保持专注，之后你就可以自由放松了。


  我希望这些内容能帮助你了解任务切换成本，并让你掌握一些保持专注的实用方法。

  '
- '## 第8章 如何利用意志力极限，而不是让极限利用你？


  优秀的开发者有许多共同特点。然而，很少有品质能像意志力一样重要。世界级的程序员经常被迫攻克复杂的概念，如果没有意志力，他们在取得任何突破之前就会放弃。在本章中，我将深入探讨意志力极限这个话题。


  这将包括一个实用的讲解，涵盖：


  - 什么是意志力极限

  - 如何提升你的个人意志力极限

  - 一个有意识地管理意志力极限的计划


  ### 什么是意志力极限？


  在研究生阶段，我对任务切换成本进行了广泛的研究。在研究任务切换时，我遇到了意志力极限这个话题，以及它们与表现的关系。本质上，意志力极限的研究表明，*每个人每天都有有限的决策能力。*


  ### 你每天要做多少个决定？


  如果这听起来很奇怪，别担心，我一开始也很难接受这个概念。那么，让我们来看看开发者典型的一天。你每天会做哪些决定？


  - 决定起床还是按下闹钟的贪睡按钮

  - 挑选早餐吃什么

  - 选择当天穿的衣服

  - 决定是去健身房、跑步，还是四处走动玩 Pokémon Go

  - 决定上班走哪条路线

  - 这样的例子不胜枚举


  注意，这些项目中没有一项与开发相关。事实上，这些都是你在每天上班之前必须做出的常见决定。如果你真的数一数每天必须做的决定数量，你会发现这个数字可能有几百甚至上千。如果把开车时保持在自己的车道这样的潜意识决定也算进去，这个数字很可能每天都有数百万！


  ### 为什么意志力很重要？


  希望我已经帮助你看到了我们每天做出的所有决定。那么，在做出决定时，为什么意志力极限很重要？主要是因为如果没有意志力，我们决策的质量会大幅下降。


  想象一下没有意志力的自己。没有意志力，你会：


  - 想吃什么就吃什么，损害整体健康

  - 不学习，因此永远不会成长为更好的开发者

  - 冲动地花钱买任何脑海中闪现的东西，导致债务缠身，最终破产


  这幅画面可不太美好，这正是意志力在决策时如此重要的原因。意志力赋予你自控力，让你做出正确的决定，即使这个决定并不容易。


  ### 意志力极限是真的吗？


  那么，考虑到这一切，你每天的意志力真的有限吗？我最近读了一本书，名为《意志力本能》，作者是凯利·麦格尼格尔博士（据我所知，她和麦格教授没有关系）。在书中，凯利展示了研究和无数案例，清楚表明我们的日常意志力确实有限。


  想象一下，你的意志力就像一瓶水。每天早上，你都从满满一瓶水开始。每当你做出一个决定或不得不使用意志力时，比如决定起床而不是按闹钟的贪睡按钮，就会倒掉一点水。随着一天过去，你最终会“倒空”所有储存的意志力。


  ### 当意志力之井干涸时


  那么，当意志力之井干涸时会发生什么？通常，这会导致不良行为，例如：


  - 拖延

  - 做出糟糕的决定

  - 表现不佳


  如果你发现自己出现了这些思维模式，很可能是因为你太快触及了意志力极限。


  根据经验，我知道我通常在早上精力充沛时能写出最好的代码，而晚上较晚工作时则会遇到更多开发 bug。当我意识到这种规律后，我更加深信意志力极限的概念，以及它们会如何对表现产生负面影响。


  ### 储蓄意志力


  考虑到这一切，储蓄意志力储备的概念似乎非常重要。让我们回到水瓶的类比。如果你在沙漠中，水供应有限，你会怎么做？我认为显而易见的答案是，你会只在需要时才用水。


  那么，如果我们把意志力视为宝贵资源，它将使



  确保你每天都能充分利用自己的意志力，你需要有意识地使用它。


  例如，我之前提到过我有一份每日待办事项清单，并且严格遵循。为了确保充分利用一天的时间，我总是把最具挑战性的任务安排在早上。通过这种方式，在处理重要项目时，我就不用担心意志力耗尽。然后，我会把优先级较低的事项，比如阅读，留到一天结束时再做。


  通过遵循这种模式，我注意到过去几个月我的工作有了显著改善，而且一天结束时我也感觉更放松。


  我对所学内容的记忆保持不足，这意味着我不得不回头重新学习那些上一学期已经忘记的主题。不用说，这让我的学术生活压力重重，更不用说当时我还同时是一名全职开发者。所以，我知道必须做出改变，于是我建立了一个系统，通过一致的学习模式帮助我每天保持所学内容。就像编程中的函数一样，我的持续学习系统接收几个参数：


  - 日程安排

  - 对抗拖延症


  在日程安排方面，我创建了一个按天划分的待办事项清单，列出我需要学习的内容，包括学术论文、书籍和观看在线讲座。我把这些放在 Basecamp 上的一个可拖拽待办事项列表中。每当我学完某一项，就把它拖到第二天的待办事项清单里，这样我就能直观地看到当天已经完成了任务。


  对我来说，我之所以拖延学习，是因为盯着那堆要读的书单让我望而生畏，而这主要是因为我没有为学习设定实际可行的目标。如果你盯着一本离散数学教科书，告诉自己要学习，那么想拖延是很自然的；然而，如果你设定一些小目标，就不太可能拖延。


  考虑到这一点，我会写一条备注，比如“读3页我的信息检索教科书”，而“读3页”听起来远没有模糊的“只要学习”心态那么吓人。设定小而可控的学习目标带来的有趣结果是，这不仅有助于遏制拖延，而且通常我读的也会远远超过3页。很多时候，我设定读几页书的目标，最后却读完了好几章。


  虽然说了这么多，但有时我也会安排深度工作学习时段。在这种时段里，我会留出2-3小时坐下来，不受干扰，钻研一个复杂的课题。不过，我总是把时间限制在每天不超过2-3小时，而且在这些日子里我通常不会再学习其他课题，因为到结束时我往往已经心力交瘁。


  我希望本章对你有帮助，并能帮助你建立自己的学习系统，这样你就能记住所学内容，并在最关键的时候加以运用。

  '
- '## 第10章 阅读对开发者重要吗？


  在本书中，我写了很多关于如何提升开发者能力的内容，特别是从实践角度讨论了各种学习方式。然而，在本章中，我想专门回答这个问题：*阅读对开发者来说重要吗？*


  这个问题的简短答案是：是的！然而，作为计算机科学家，仅凭一句话就轻信他人是很不可取的。所以，让我们深入探讨为什么阅读对自我提升至关重要。


  ### 为什么阅读对开发者重要？


  让我们分析一下与阅读相关的一些关键统计数据。


  #### 首席执行官与阅读


  你目前每年读多少本书？如果你的回答是你太忙了，没时间读完一整本书，那让我再问你一个问题：你比世界上那些最成功公司的首席执行官还忙吗？大概不是吧。


  然而，来自 Rype Academy 的研究（http://rypeapp.com/blog/5-easy-ways-to-read-more-books-and-double-your-knowledge/）显示，埃隆·马斯克、马克·库班和彼得·蒂尔等首席执行官每年阅读约60本书！即每月4-5本。


  #### 复利式学习


  那么，为什么世界上一些最成功的人会花时间读完这么多书呢？粗略一看，这可能显得有些过分，但如果你真心相信知识就是力量，那么投入所需的时间去获取更多知识，难道不是理所当然的吗？


  如果你把阅读看作一种线性学习，那么是的，阅读会浪费时间。线性学习是一种1比1的知识转移。例如，如果一本书的作者花了10年研究一个课题，而我也花了10年才读完这本书，那将毫无意义。归根结底，这种阅读是没有意义的。


  然而，我把阅读看作复利式学习。什么是复利式学习？问得好！复利式学习是指获取某个人的知识，但不必花费与该个人研究该课题相同的时间。


  ### 一个复利式学习案例研究


  例如，想象你读了一本关于*如何成为更好的开发者*的书。这本书的作者花了数年时间研究这个课题（假设这是一本写得很好、研究扎实的书）。然而，如果你在几周内读完这本书，那就意味着你能够在几周内获得数年的知识！


  研究（http://blogs.plos.org/neurotribes/2011/06/02/practical-tips-on-writing-a-book-from-22-brilliant-authors/）显示，顶尖作者至少会花两年时间研究一本书。而且，这个研究时间还没有考虑到作者是毕生积累来写一本书这一事实。所有这些都意味着，每当你读一本书，就如同能够从作者那里获得一生的经验和智慧。


  ### 那位没有时间阅读的首席执行官


  几年前，我收到一份纽约市一家初创公司的首席技术官（CTO）职位邀请。这份工作薪水优厚、股票期权可观，而且产品也很出色。


  然而，在与他们的创始人/首席执行官的一次晚餐会上，我问起一本我刚读完的、讨论科技初创公司最佳实践的书。他说他从没听说过这本书。


  这倒没什么，世上有数百万本书，我不会因为别人的文学品味和我不一样就去评判他们。然而，这位首席执行官接着又说他没时间阅读。他忙于打造业务。


  在考虑这份工作的过程中，这位首席执行官对阅读的看法让我产生了共鸣。最后我拒绝了这份工作。如果首席执行官不花时间阅读并向他人学习，那就意味着他将完全依赖自己的知识和人生经验。即便是最杰出的商界人士，如果认为自己已经掌握了所有正确答案，也终将失败。


  ### 我的阅读系统


  说“阅读很重要”是一回事，定期阅读大量书籍则完全是另一回事。基于这一点，我开发了自己的阅读系统。这个系统也考虑到了我听到过的许多人对阅读的抱怨。


  ### 阅读日程


  首先，我每天都会安排固定的时间用于阅读。通常，这大约是1-2小时；不过在周末，这个时间可能会翻倍。在任何时候，我通常都会同时阅读十几本书，范围涉及从思维/技能提升到技术编程书籍。


  ### 有声书也是书！


  我不太确定有声书这种污名从何而来。然而，考虑到我的旅行行程，我发现有声书是我学习武器库中一项非常宝贵的工具。显然，你没法通过 Audible 阅读编程书籍。然而，你可以通过它阅读技能和商业——


  文字书籍。而我自己在 Audible 账户里有数百本书，其中很多我都听过不止一遍。事实上，我讨论和引用过的许多书，都是我听完的，而不是读完的。


  ### 书籍过于昂贵


  我从学生那里听到最多的抱怨之一就是书籍太贵。我的回答始终是：如果你不愿意为提升自己而做出牺牲，那你就无法实现目标。这包括在金钱上做出牺牲。


  话虽如此，即使预算有限，也有办法阅读大量书籍。首先，你当地的图书馆有数不清的书，你可以每天从中学习。只要你按时归还图书，图书馆就完全是一个免费的选择。我在亚利桑那州斯科茨代尔的住处附近就有一家图书馆，步行即可到达。我每周都会去几次，发掘新书。


  此外，你还可以注册图书会员。Safari Books Online 提供一种 *不限量阅读* 的订阅套餐。我就订阅了这个会员服务，多年来已经读完了他们数据库中大量的技术编程书籍。


  ### 小结


  总之，阅读对开发者重要吗？我认为确实重要。阅读让你能够启动复利式学习。如果你有机会在几周内获得别人多年积累的知识和经验，放弃这样的机会简直是疯了。

  '
- '## 第 11 章　学习如何编程——跨越技能瓶颈期


  我在学生学习编程时经常看到的一种模式是：


  1. 快速掌握大量信息。

  2. 然后遇到一堵看起来无法逾越的墙。在这个阶段，学生通常会觉得自己已经达到了开发能力的顶峰。


  第二个阶段被称为瓶颈期。在本章中，我们将会讨论一些突破技能瓶颈期的策略。


  重要的是要明白，在学习一项新技能时，每个人都遵循类似的模式。这意味着你会经历一些每天都能吸收大量新信息的时期；但也意味着你会遇到一些感觉自己的大脑限制了新知识进入的时期。


  ### 什么是学习瓶颈期？


  当遇到学习瓶颈期时，重要的是找出其发生的潜在根本原因。根据我的经验，没有任何两个瓶颈期是完全相同的。如果你没有诊断出自己为什么学不进去，就无法进入下一个技能水平。


  ### 虚假的天花板


  在继续之前，我想重申一点：*你的技能永远不可能达到完全饱和的状态。* 也许如果你是一名职业运动员并且年纪渐长，身体机能自然会下降。但就理解开发这样的概念而言，只要你继续全心投入，并且愿意倾听专家的意见，你的技能就永远不会登上顶峰。


  当他们不再挑战自己时。如果你回忆一下自己最初学习开发的时光，你会发现自己的知识似乎每天都在突飞猛进。


  这是因为你当时学习的每一个概念对你来说都是全新的。然而，一段时间之后，我们似乎自然而然就想要进入舒适区。我们不再每天尝试学习新事物，而只是重复自己已经会做的事情。


  这种做法对脑力消耗较小，但它有一个坏副作用：限制我们进步。每当我感觉自己陷入一成不变的状态时，就会翻看一些热门网站，开始整理一份我想要学会如何构建的功能清单。然后，我就可以制定一个计划，明确自己需要学习哪些概念来实现这些功能。


  ### 挫败感 = 技能


  关于突破技能瓶颈期，我最喜欢的例证之一出自书法家 Jamin Brown：


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_73_0.png)


  注意这幅插图，学习过程中充满了瓶颈期。这是任何技能进步过程中的自然组成部分。


  但同样要注意，克服瓶颈期的关键被称为“挫败区”。我觉得这个名称起得非常好。学习复杂的主题并不轻松。你很可能已经无数次听人说过：“如果这事儿容易，那谁都能做到。”


  成为开发者可能是一个人所能拥有的最有回报的经历之一。学习编程之所以如此令人满足，部分原因就在于你必须克服许多挑战才能成功。


  ### 小结


  希望这份指南对你有帮助，也希望你现在掌握了一些突破技能瓶颈期的实用策略。祝编程顺利。

  '
- "## 第 12 章　开发者学习曲线——为什么学习编程需要这么长时间\n\n在成为开发者的过程中，我最常被问到的问题之一是：为什么学习编程需要这么长时间？我发现，答案可以在与学习曲线相关的研究中找到。\n\
  \n### 什么是学习曲线？\n\n学习曲线的概念从 1885 年就存在了。相关研究通常是在心理学和认知科学中进行的。然而，这个概念完全可以应用到学习开发的过程中。\n\
  \n### 开发者学习曲线\n\n下图展示了标准的学习曲线。它是由一个大数据分析算法生成的，该算法分析了多个行业中个体的学习模式。曲线之所以平滑，是因为它对学习过程取了平均。\n\
  \n![](img/de22e3e00f8df753e0d57f7da4d1c581_76_0.png)\n\n在本章后面，我们会看到单个人的学习曲线是什么样子。多年来，我有幸教学生如何成为开发者，一次又一次地目睹这条学习曲线。在本章中，我想探讨所有开发者都会经历的三个阶段。此外，我还会讨论从一个阶段跨越到另一个阶段需要多长时间。我要讨论的三个阶段是：\n\
  \n- 起飞期\n- 迷茫期\n- 巅峰期\n\n### 起飞期\n\n让我们先来看看起飞期。这对新学生来说是一个激动人心的时期。在这段时间里，学生沉浸在学习从未见过的技能中：\n\
  \n![](img/de22e3e00f8df753e0d57f7da4d1c581_77_0.png)\n\n由于学生在这一阶段学到的所有主题都是全新的，他们的专业水平会飞速提升。我喜欢把这一阶段称为起飞期，因为新学生的专业水平很容易被想象成火箭飞船，飞向从未到达过的天空。在这段时间里，学生将学习如何：\n\
  \n- 配置开发机器\n- 学习一种编程语言\n- 使用各种框架\n- 构建可用的应用程序\n\n这一阶段通常会在开发者学习编程的前 250-300 小时内经历。这一估计基于我在\
  \ DevCamp 训练营学生中观察到的结果，大约相当于 6-8 周的强化学习。\n\n尽管这一阶段很有趣，但也有缺点。一个关键问题是它可能给学生带来虚假的自信。当他们看到自己能构建出真正可运行的应用程序时，自然会相信自己可以立刻上手为客户构建生产级应用。然而，他们没有意识到自己即将进入……学习编程的迷茫期。\n\
  \n### 迷茫期\n\n在令人振奋的开发者学习曲线起飞期之后，有抱负的开发者将进入迷茫期：\n\n![](img/de22e3e00f8df753e0d57f7da4d1c581_79_0.png)\n\
  \n这对学生来说是一个充满挑战的时期，许多学生正是在这一阶段决定彻底放弃编程。\n\n那么，为什么这个时期如此艰难？在见证过无数学生经历这一阶段后，我发现有若干促成因素：\n\
  \n- 在这一阶段，许多核心概念和命令还没有固定在学生的长期记忆中。这导致他们不得不频繁查文档、到 Stack Overflow 上搜索，以及诸如此类的事情。\n\
  - 在这段时间里，“能跑起一个应用”的新鲜感已经消退。现在学生需要完成更高级的任务，例如：\n  - 处理遗留应用\n  - 排查缺陷\n  - 提升性能\n\
  \  - 构建没有分步教程的功能\n- 此外，在度过迷茫期的过程中，学生会\n\n预期开始实施最佳实践。在启动阶段，主要目标是让应用程序能够正常运行。\n\n\
  在接下来的这个阶段，学生开始学习如何构建可用于真实场景的应用程序。这意味着，学生构建一个与启动阶段所创建的应用程序功能相同的应用，可能需要花费五倍的时间。\n\n\
  这可能会让人感到沮丧；然而，花费更多时间实施最佳实践，能让应用程序具备足够的可扩展性和灵活性，从而可以投入生产环境。这与启动阶段创建的那些不符合行业标准的应用程序形成了鲜明对比。\n\
  \n无数次，学习对于开发者来说永无止境。不过，学习的方式确实会发生变化。在这一阶段，开发者主要关注以下主题：\n\n-   渐进式性能优化\n-   构建辅助代码库\n\
  -   优化应用程序代码流程\n\n### 一段独特的旅程\n\n在整章内容中，你可能已经注意到开发者学习曲线是平滑的。然而，这并不是现实。曲线之所以平滑，是因为它平均了大量个体的学习路径。对于单个学生来说，学习曲线更像是下图这样：\n\
  \n![](img/de22e3e00f8df753e0d57f7da4d1c581_83_0.png)\n\n学习周期中会有起起落落。作为学生，你可能会在几年后决定更换编程语言（就像我大约\
  \ 5 年前从 PHP 切换到 Ruby 那样）。\n\n即使你不必从零开始，学习一门新语言或框架仍然需要时间。在你的开发之旅中，你会经历许多起伏。因此，如果你对自己的技能水平不满意，不要气馁，因为我要告诉你一个秘密：优秀的开发者从来不觉得自己已经学有所成、无需再学。\n\
  \n### 小结\n\n我希望这份指南能帮助你理解开发者学习曲线，祝你在编码时好运。\n"
- '## 第 13 章 放慢脚步，才能更快学会编码


  如今，似乎每个人都想更快地做事。我们希望在支付时无需拿出信用卡或现金。社交媒体让我们能在瞬间分享生活中的图片和视频。如果 Netflix 播放我们最新追的剧集耗时超过
  3 秒，我们就会感到不耐烦。然而，如果你想更快地学会编码，我要提出一个奇特的建议：放慢速度。


  这似乎是一个违反直觉的概念。毕竟，编码训练营，甚至是我任教的 DevCamp，不都在告诉你如何在几个月内学会编码吗？嗯，是的，而且研究表明，在学习方面，8 周是一个强有力的数字。海豹突击队训练计划专门选择了
  8 周作为其训练候选人的时间框架。如果你在网上搜索“8 周训练计划”这个短语，你会找到从跑 10 公里到流利说西班牙语等各种课程。


  所以，是的，我坚信人们可以在短时间内学到大量信息。但我在这里想说的是，在学习新信息时要更加深思熟虑。


  ### 如何更快地学会编码


  如果你和我一样，在学习一个新主题时，你要么会立刻跳到下一个主题，要么会以最快速度重复这个概念。例如，当我学到一种新的 Ruby 或 Scala 编程方法时，我通常会立刻尽可能多地将其应用到不同的场景中。然而，我发现这可能不是最好的方法，因为它非常短视。


  ### 我们默认的思维模式


  说到学习编码，最具挑战性的事情之一


  就是匆匆忙忙地完成学习。在涉及长期记忆时，这种方法比简单地把概念一带而过更有效，因为它会迫使我们的思维去思考每一次击键。


  ### 像贝多芬一样弯曲它


  我不是从另一位开发者那里学到这个技巧的。相反，我听说了世界上最成功的古典音乐机构之一——纽约的梅多蒙特音乐学校——是如何教学生新音乐作品的。作为一项游戏，学校会分发部分乐谱。大多数学校会把整首歌曲交给每个学生，而梅多蒙特则把音乐拆分成片段。


  然后，学校会给每个学生一个片段，让他们专注于这一部分。从那时起，学生只会学习演奏这一段音乐。他们会从非常慢的速度开始。他们不会急着弹完音符，因为他们甚至不知道这些音符在整首歌中如何衔接。这种方法教会他们如何一次一个音符地专注于学习一首新歌。


  之后，学生们会交换音符卡片，然后专注于学习歌曲的另一部分。他们会一直交换卡片，直到每个学生都能把整套卡片学完。


  通过迫使学生将歌曲拆分成片段，他们就不再会有任何薄弱环节。相反，学生会把注意力集中在音符本身。从这一点来看，班级中所有学生都很容易结合各自所学，学会完整演奏整首歌曲。


  ### 从古典音乐到编码


  那么，这种方法能帮助你更快地学会编码吗？我认为可以。研究表明，通过放慢速度并将概念拆分成小片段，学生更容易将信息从短期记忆转移到长期记忆。


  ### 一套实用的方法


  所以，下次你在学习编码概念时，请退后一步。不要只是照搬老师正在教授的内容，而是把它写在纸上。逐步梳理程序中到底发生了什么。


  如果采用这种方法，你会发现你不再只是简单地跟随老师的一系列步骤，而是真正理解了这些概念的工作原理。一旦你达到了理解的阶段，你就能把知识转移到长期记忆中，并且永远记住它们。

  '
- '## 第 14 章 学习编码和提升开发者水平的心智模型


  我已经说了很多关于成为一名优秀开发者需要具备什么。为了实现精通水平，我讨论了一系列标准，在这一章中，我想在上面这个列表中加上一个新的前提条件。


  让我先问你一个问题。如果我给你看一些代码，你能在几秒钟内告诉我它好不好吗？软件开发领域极其复杂。然而，多年来我发现，最优秀的开发者具备一种不可思议的能力，能够立刻判断出某人代码的质量。


  我在第 2 章《开发者是天生的还是后天培养的？——揭穿神童神话》中与你讨论过，神童和奇才是一种神话。但如果是这样，专家级开发者怎么能如此迅速地分析程序？要回答这个问题，我们需要回到假的古希腊。


  ### 库罗斯的心智模型


  我说“假的古希腊”，是因为我最喜欢的心智模型例证是在现代艺术史上最大的一次伪造事件中一同被发现的。


  在马尔科姆·格拉德威尔的《眨眼之间》一书中，他讲述了希腊库罗斯雕像的故事。1985 年，盖蒂博物馆以超过 900 万美元的价格购买了一尊名为“库罗斯”的希腊雕像。起初，博物馆对购买这尊雕像持犹豫态度，因为人们非常担心这座雕塑是赝品。库罗斯雕像极为罕见，发现一尊真实且保存完好的雕像的可能性微乎其微。


  然而，博物馆愿意冒这个险，并展开了一项查证任务。他们让这座雕像接受了当时所有可用的科学测试。


  库罗斯以优异的成绩通过了所有测试。在完成全面检查后，博物馆以 900 万美元买下了这尊库罗斯雕像。


  来自世界各地的艺术史学家被专机接来参加库罗斯的揭幕仪式。但可怕的事情发生了。这些专家在看到雕像的那一刻，就知道库罗斯是赝品。有意思的是，他们说不出任何实际理由。


  **他们就是知道有些地方不太对劲。** 他们的怀疑后来被证明是正确的，库罗斯最终被证实是一个骗局。但这些人是如何做到无数科学研究都没能做到的事情呢？这一切都归结为心智模型。


  ### 什么是心智模型？


  在准备这一章时，我和一位朋友讨论心智模型这个话题，当她一脸困惑地看着我时，我很惊讶。在告诉我她从未听说过心智模型之后，我决定增加这一部分来解释什么是心智模型。之后我们会进一步讨论如何构建心智模型来学习开发。


  心智模型是对某个特定主题或技能的心智表征。你不可能在一夜之间或通过临时抱佛脚来创建心智模型。心智模型是通过多年的重复和无数小时的精进技艺培养出来的。


  我父亲是休斯顿太空人队的职业棒球大联盟打击教练。在我的一生中，我一直能看到他指导击球手如何改进他们的挥棒动作。


  而我一直惊叹于这样一个事实：他看一个新击球手的挥棒，瞬间就能指出该球员可以在多个方面进行改进。我可以告诉你，他并不是在短时间内培养出这种技能的。他花在观看击球手和录像上的时间比我认识的任何人都多。多年来，他已经建立了一个关于完美挥棒应该是什么样子的心智模型。





  ### 开发者的心智模型


  好了，我们已经讨论了艺术史学家和棒球教练，但作为开发者，我们如何创建心智模型呢？你可能喜欢也可能不喜欢这个答案，但这并不重要，因为它是事实。心智模型是通过重复建立起来的。


  然而，仅仅重复本身是不够的。例如，如果你连续10年每天构建一个相同的程序，你会非常非常擅长构建那个应用程序。但是，你作为开发者的能力并不会提升。我之前谈到过，医学研究表明，多年来只治疗同类患者的医生，其熟练程度反而不如刚结束住院医师培训的医生。同样，作为开发者，当我们每天不断挑战自我时，我们才会进步。


  你可以通过以下方式挑战自己：


  - 学习一门新的编程语言或框架

  - 教别人如何学习编程

  - 创建一个开源代码库，并允许其他开发者使用它


  爱因斯坦说得最好：


  > *“知识的唯一来源是经验。”*


  ### 小结


  如果你每天投入足够的时间来提升自己作为开发者的能力，那么对于本章开头提出的问题，你就能诚实地回答“是”。你将能够一眼看出代码的好坏。而且你会明白，这并非某种编程超能力；相反，这是你通过不断追求进步而赢得的一项技能。


  潜力。


  ### 攻克拖延症


  我把这一章命名为“攻克拖延症”，因为我认为**攻克（hacking）**是最贴切的词，用来描述为了取得成功需要做的事情。开发者通过破解应用程序来添加功能或修复缺陷。同样，我们也需要“攻克”自己的思维模式，让大脑正常运作。


  在我们深入这套方法之前，我想先厘清一个概念。作为人类，我们天生就是为行动而生的。拖延是一种消极习惯，是我们通过恐惧驱动的思维模式习得的。要在生活中任何领域取得成功，无论是开发还是商业，克服拖延都是必要条件。


  #### 攻克完美主义


  拖延症的原因清单上，第一个就是完美主义。你见过婴儿第一次尝试站起来吗？婴儿尚未学会“失败是坏事”，他们会花无数个小时尝试站起来。


  每次摔倒，似乎对他们毫无影响。你永远不会看到一个婴儿因为完美主义而放弃目标。相反，他们会不断尝试，直到站起来，最终自己能走路。


  然而，从婴儿到成人的某个阶段，我们形成了“不应该失败”的思维模式。于是，我们不再反复尝试、从失败中走向成功，而只会去做那些我们确信能做得好的任务。要攻克完美主义，我们必须清除大脑中害怕失败的那一部分。


  如果你是一名开发者，正在学习构建一个从未做过的新功能，让我把话说清楚：你第一次一定会做错！


  这完全没问题。如果你以为只要等待，就能神奇地学会如何完美地完成任务，那你可就大错特错了。所以，第一步是：拥抱失败，放下对完美主义的执念。


  #### 攻克对成功的恐惧


  清单上的下一个是攻克对成功的恐惧。如果你已经克服了完美主义的陷阱，恭喜你。然而，我见过同样多的开发者，因为害怕成功而陷入困境，就像因为害怕失败而停滞不前一样。


  这个概念可能看起来很奇怪，因为成功似乎并不令人恐惧。然而，我记得自己初学开发的时候。当我阅读一本编程书时，每发现一个新概念都会兴奋不已。但随后我就会僵住。我脑海中的第一反应是：


  > “如果你学会了这个，那你接下来要做什么？”


  例如，当我第一次学习如何建立数据库连接时，我放下了书，直到几周后才重新拿起。学习数据库概念，为我打开了一个全新且令人恐惧的新世界，里面有此后我必须学习的各种新主题。突然间，我不得不理解：


  - SQL 查询

  - 如何在数据库表之间建立关系

  - SQL 注入的要求

  - 而且这个清单在我脑海中似乎无穷无尽


  要攻克对成功的恐惧，我们需要让内心平静下来。对成功的恐惧实际上源于对未知的恐惧。所以，每当你感到这种恐惧时，退后一步。为自己学到了新知识而感到高兴，然后继续下一个功能或主题。


  不要让你的思绪在将来可能需要的所有未知概念中肆意驰骋。就像学习其他任何东西一样，你需要一步一步来。


  #### 攻克计划


  攻克拖延症的最后一个要点是制定切实可行的计划。


  当我意识到自己在拖延时，我会告诉自己看看行动计划。通常我会发现计划太笼统了。


  例如，如果我正在构建一个薪资应用程序，我的待办事项清单上可能会有这样一项：**构建报表引擎**。这是一个可怕的功能！这种项目会在我待办清单上滞留数周，而我却毫无行动。


  为了解决这个问题，我明白了，如果把需求拆分成一系列非常小的任务，就能打破拖延的循环。对于报表引擎这个功能，我可以创建一系列更小、更易管理的任务，例如：


  - 创建一个用户访问报表的页面

  - 实现一个数据库查询，用于从数据库中提取报表

  - 为报表构建一个文件下载器


  当我把一个庞大而可怕的功能拆分成小块时，我立刻感觉好多了。这个功能不再可怕，我也不再想把它推迟到明天。相反，我只需要每天按照一系列小任务执行，直到功能完成。


  ### 小结


  我希望这份指南能帮助你打破自己项目中的拖延循环，并且你能利用它成为更高效的开发者。最后，我想引用*爱德华·B. 伯格*和*迈克尔·斯塔伯德*合著的*《高效思维的五个要素》*中的一句话：


  > “愿意失败是变革性思维的一种解放性特质。”


  所以，勇敢行动起来，制定切实可行的计划，停止拖延，开始编码吧！

  '
- '## 第16章 开发者的拖延症问题


  关于拖延症的书籍，足以塞满整座图书馆。在我的生活和职业生涯中，我读过许多自助类书籍，它们试图解释人们拖延的原因，并提供抑制拖延的策略。


  尽管这些书都很棒，但在我看来，没有谁能比*史蒂文·普雷斯菲尔德*在他的*《艺术之战》*中更准确地描述拖延症的真正问题。


  ### 拖延症的问题


  在*《艺术之战》*中，普雷斯菲尔德把拖延比作酗酒。如果你和我一样，第一次听到这个比较时会心存怀疑。我很难把自己把博客文章推迟到明天，与一个醉倒在酒吧门前人行道上的酒鬼联系起来。


  然而，我选择继续读下去。普雷斯菲尔德给拖延起了个名字，称之为“阻力”。而这是我感同身受的。每当我遇到有挑战性的任务时，脑海中仿佛有一个持续不断的声音在说：


  > “把这件事推到明天不是很好吗？

  >

  > 明天你会有干劲去做的。”


  当我屈服于这个声音时，就像吃了一颗快乐药丸。我立刻感到如释重负，心情愉快。然而，到了第二天，我发现了一些事情……那个声音又回来了，而且它仍然在怂恿我再次把任务推迟。






  ### 即时满足


  经历了多年拖延的循环后，我终于认出了这种模式。而普雷斯菲尔德说得对，拖延任务的根源与酗酒相同。酗酒者愿意用长期的快乐换取短期的幸福。我的意思是，酗酒者会冒着健康、事业和家庭的风险，只为换取喝酒时那一刻的感觉。


  当我们拖延时，我们所有人的脑海中都会上演这种模式。当我们不断把任务推迟到明天时，我们就是在用长期的成功换取短期的便利。


  ### 用小步伐击溃拖延


  我已经介绍了我的对付拖延的系统。然而，我不想在不给出解决方案的情况下描述一个问题。因此，我将总结说，我发现对抗拖延最好的方法是采取小步伐。


  在他撰写的书籍 *Mini Habits* 中，*Stephen Guise* 让每天做一个俯卧撑的概念变得家喻户晓。Guise 自称是一个拖延者，他讨厌去健身房或锻炼。然而，有一天他决定为自己设定一个微小目标，每天做一次俯卧撑。通过这种方法，他意识到锻炼的想法不再是一个可怕的概念。因此，也就不再是需要拖延的事情。


  当然，每天做一个俯卧撑的健康益处有限。但 Guise 发现的是，做完俯卧撑后他通常会有继续做俯卧撑的欲望。最终，他的日常习惯演变成了一套完整的日常健身计划。


  ### 小步编程


  我发现同样的办法也适用于学习和发展。当我觉得想推掉某个任务时，我告诉自己我只需要工作三十分钟。


  通过给自己一个可实现的目标，任务就没那么令人望而生畏了，因此，我不会产生同样的抵触和想推掉它的欲望。而且通常情况下，我会发现自己想在该任务上工作的时间超过 30
  分钟。最终的结果是我完成了更多的工作，我不再害怕我的日常待办清单。

  '
- '## 第 17 章。作为开发者的番茄工作法的实用用法


  在我们继续探索如何破解开发者思维的方式时，本章的重点将放在提高生产力上。具体来说，我们将分析作为开发者的番茄工作法的实用用法。


  我一直在不断研究提高个人生产力的方法。在我作为开发者的旅程中，我发现的一种流行方法是番茄工作法。这是我使用过的一种流程，我认为它让我每天能够专注于大量任务。


  不要让奇怪的名字吓跑你。番茄工作法是一个非常简单的生产力系统，专注于将任务分割成一天中的定时间隔。


  ### 番茄工作法的实用用法


  番茄工作法最伟大的优势之一就是它实施起来非常容易。我遵循的流程是：


  - 1. 每天早上我挑选出当天想要完成任务。

  - 2. 我然后决定每个任务需要多长时间。番茄工作法采用积分系统。每次你完成一个 25 分钟的任务，你就获得一分。

  - 3. 通常，我每天尝试获得 10 个番茄积分。这意味着如果我有 3 个我知道每个需要一小时的任务，我将为这些任务获得 6 分。这也意味着我当天剩余时间还有
  4 个额外的 25 分钟时段可用。


  ### 休息一下


  你是否注意到我一直说 25 分钟的时间段？这个奇怪的数字是有原因的。番茄工作法非常重视安排休息。在完成每个 25 分钟的任务后，你休息 5 分钟。在这段自由时间里，你可以做任何你想做的事情。你可以上社交媒体，你可以绕着街区散步，或者做任何你想做的事情。只要确保你的休息时间不超过
  5 分钟。


  另外，完成 4 个任务后，建议你休息 15 分钟。然而，你可以根据自己的日程安排来调整休息和间隔。通过在一天中安排休息，你会降低倦怠的几率。而且我注意到，我不再为在一天中查看我的
  Instagram 账户或 Hacker News 而感到内疚，因为我可以将我的愧疚式享受融入到我安排的自由时间中。


  这是我真正喜欢番茄工作法的一个方面。我过去尝试过的许多其他生产力系统往往会导致个人倦怠。然而，番茄工作法的方法让你能够保持一种平衡感。


  ### 生活方式 vs 时尚


  你有没有尝试过节食？当我年轻时，我为体重挣扎，为了改善它，我尝试了许多激进的饮食。我包括了营养策略，例如大幅减少卡路里，或戒掉碳水化合物。然而，我注意到我会坚持饮食几周甚至几个月，但最终我会回到不良的饮食习惯。


  一旦我认识到这种趋势，我就转向了均衡的饮食方法。我停止尝试营养时尚，我将重点转移到以我认为可以吃一辈子的方式进食。


  我在几年前做出了这种营养方法的改变，它完全停止了我过山车式的节食、减肥和体重增加。


  ### 生产力生活方式


  同样的方式，当我年轻时我在处理任务时也陷入了同样的模式。我会对某个项目或学习一门新的编程语言感到兴奋。我会花无数小时在我想完成的事情上工作。


  然而，这种方法不可避免地导致了倦怠和长时间不想工作。我看待番茄工作法的方式与我看待均衡饮食的方式相同。通过限制我每天工作的任务数量并在每个任务之间实施计划休息，我不再让自己筋疲力尽。


  此外，当我完成一天的工作并获得我的 10 个番茄积分后，我感受到一种以前从未有过的成就感。工作结束后，我不会因为花时间陪伴家人和朋友而感到内疚，因为我知道我完成了当天设定的所有任务。


  ### 实际实施


  那么你如何实施这个计划呢？有几种方法。首先，你可以简单地使用手机上的计时器，然后统计每天完成的任务/积分。这就是我开始使用番茄工作法的方式。


  此外，还有许多智能手机应用程序具有番茄计时器，甚至允许创建任务列表，你可以用它作为每天任务的挑选清单。我喜欢这类应用程序，因为它们还能提供历史分析，让你可以看到每天完成了多少任务。番茄专注应用
  (https://itunes.apple.com/us/app/pomodoro-time-focus-timer/id973134470?mt=12) 是我个人最喜欢的（而且是免费的）。

  '
- '## 第 18 章。犯错的力量 – 通过失败学习


  让我们把时间倒回到我计算机科学研究生第一学期的时光。踏入我的第一堂课时，我充满了紧张的兴奋。这门课由 Dr. Gelfond 教授，他是人工智能领域最受尊敬的人物之一。


  随着课程的进行，我目睹了一个令人不安的趋势。与其他教授不同，Dr. Gelfond 不只是给我们讲课，他不断让学生上前在黑板上写程序或描述他讨论的概念。这本不是什么大事，除了他习惯在我们明显不理解概念时
  specifically 把我们叫到前面。他是残忍的吗？他想让我们在全班面前显得无知吗？


  ### 精通的秘密武器 – 犯错


  实际上，恰恰相反。相反，Dr. Gelfond 足够在乎我们，他传授给我们精通的秘密武器：犯错。等等，犯错是我们大脑告诉我们不要做的事情的反面，对吧？犯错很尴尬。错误告诉世界我们不理解一个概念。然而，犯错也提供了许多强大的工具，任何对学习感兴趣的人都应该了解。


  ### 犯错 – 记忆类固醇


  首先，当你犯错时，尤其是在公开场合，你会感觉自己在服用记忆类固醇。为什么呢？当我回想起 Dr. Gelfond 的课时，我仍然记得被叫到讲台前时犯的每一个错误。通过犯错产生的记忆如此生动，以至于多年后仍然可以回忆起来，像




  mine. Now obviously simply remembering the mistakes by themselves would be pointless.


  However, in addition to remembering what I did wrong, more importantly I remember
  what I had to do to correct my mistake. It''s been over three years since I took
  that class, but I can still remember each of the key concepts that he taught us.
  And I can tell you from experience that I cannot say the same thing about all of
  the classes I''ve taken.


  ### Mistakes force learning


  Another benefit to making mistakes is that they force you to learn. No one likes
  being wrong. So, assuming that you have a passion for knowledge, you can use the
  memory of making mistakes to help motivate you to learn a concept properly.


  If Dr. Gelfond would have simply stood in front of the class and lectured for the
  entire semester, I most likely would have studied enough to do well on the tests
  and leave it at that. However, because I constantly had the thought in the back
  of my mind that I may have to be called up in front of the class to write a program
  or describe a concept, it forced me to study harder than I would have for a test.
  This healthy fear took me from simply being able to remember a concept to truly
  mastering it.


  ### Mistakes kill pride


  Lastly, making mistakes helps to kill pride. Proverbs 16:18 says:


  > "Pride goes before destruction, a haughty spirit before a fall."


  One of the largest obstacles to learning is pride. Anyone puffed up with pride will
  find that their learning progress will come to a halt. When someone is filled with
  pride they can''t see beyond their own limited knowledge. Thankfully, if you embrace
  the process of learning by making mistakes, pride will never be able to stake a
  claim in you. By their very nature mistakes force you to realize that you don''t
  know everything, and that you have more to learn... which we all do.


  ### Summary


  So, whether you are just learning to code from scratch or if you''re a seasoned
  developer, never be afraid to make mistakes. Mistakes reveal that you''re traversing
  into new territory that you''ve never been before, which is what you need to do
  to go from mediocrity to mastery.

  '
- '## Chapter 19. Learn How to Code – The Guide to Memorization


  During a recent bootcamp teaching session where I was walking through a number of
  frontend development techniques, a student asked a great question. Referencing the
  CSS styles, she asked:


  > "What is the best way to remember all of the specific style names and properties?"


  This is a vital question to answer, especially for new students. For example, if
  you look at the CSS documentation you''ll find thousands of potential style options.
  If you''re learning these styles for the first time that list can be pretty intimidating.
  And that doesn''t even bring in the idea of learning how the styles work together
  with applications as a whole!


  Obviously, this issue does not only apply to CSS styles. When it comes to learning
  development, whether it''s a programming language or framework, you will be greeted
  with a large amount of information that you''ll need to memorize, or at least know
  where to reference it.


  ### The guide to memorization


  At first glance, this may seem like a daunting task. And many aspiring developers
  have given up on their learning journey because it seems like an insurmountable
  challenge.


  However, I''m here to tell you that it''s completely realistic for you to learn
  how to work with a large number of complex concepts. And if you follow the system
  I outline in this chapter, you''ll be amazed at how quickly you pick up on memorizing
  more information than you ever thought possible.


  ### Repetition


  Before I go into the memorization system I have used over the years, it''s important
  to say that repetition is the key to memorizing large amounts of information. None
  of the techniques I will give you are going to help if you don''t take the time
  to work through them consistently.


  #### Smarter, not harder


  With that being said, it''s important to know that, by itself, repetition is a slow
  and naive memory training technique. As a development student, imagine that I had
  a list of a few hundred method names and tell you to memorize them. If you were
  to simply stare at the sheet of paper and try to memorize the names, how do you
  think you''d do? If you''re like me and the majority of the world, probably not
  very well.


  The reason why dry repetition isn''t a great way to memorize names is because it
  doesn''t give you a frame of reference for the names.


  #### Visual mental mapping


  In the first memory technique, we''re going to walk through visual mental mapping.
  Our minds are incredible at memorization. However, at the same time, our minds are
  also picky with how they store information. Let''s run a quick test. If I show you
  15 random digits, such as:

  - 234

  - 348532

  - 984

  - 234523

  - 34534

  - 35234

  - 234

  - 25345

  - 234

  - 985

  - 553

  - 37434

  - 740

  - 423

  - 9812


  And I give you 5 seconds to look at each number. How many of the numbers will you
  repeat back to me? Unless your name is Dustin Hoffman, you probably won''t be able
  to name very many!


  However, what if I showed you the pictures of 15 celebrities? Now if I give you
  the same test as with the numbers, do you think you''d do a better job remembering
  the list of celebrities or the random numbers? Assuming you know who the celebrities
  are, you''d be able to repeat back a significantly larger number of celebrities
  than numbers.


  The reason for this difference is because you have a frame of reference for the
  celebrities and in this exercise, you had a visual reference. By combining these
  two things your brain was fully prepared to recite back a larger number of items
  from the second list.


  With this knowledge in mind we can apply the same principles for memorizing anything.


  ### Short-term versus long-term memory


  Because our brains are efficient machines they naturally sort information based
  on priority. You are most likely aware that you have short-term and long-term memory.
  This concept is the reason why you can instantly remember your second-grade teacher''s
  name decades later, but may forget a new acquaintance''s name 30 seconds after hearing
  it.


  Typically, the brain doesn''t log knowledge into our long-term memory bank unless
  it thinks we''re going to need it in the future. This is kind of like how a computer
  works. If you add text to a document and save the file on the hard drive, that''s
  like storing information in the mind''s long-term memory.


  However, if you run a calculation in the terminal the computer processes the information
  in memory and then discards it, which is like how our short-term memory system works.


  ### Implementing visual mental mapping


  So, when it comes to implementing the visual mental mapping technique, we''re essentially
  tricking our brain into thinking that it needs to move a piece of information into
  long-term memory. In this process, we associate a visual image with the term that
  we want to memorize. A key prerequisite for this to work is that the visualization
  needs to be relevant to the term (or the behavior of the term).


  Getting back to the developer''s initial question. Let''s see how we can use visual
  mental mapping to memorize a CSS style. I''m going to use the `text-decoration`
  property as a case study. In the world of CSS, the `text-decoration` element allows
  you to add or remove an underline style to a piece of text. With this in mind, I
  would create an image in my mind that would look something like this:


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_113_0.png)


  So, in this example I have an image filled with decorations. And on top of the image,
  I have some text that is underlined. And it''s sitting on the decorated fireplace
  mantle. By creating this visual image, I''ve mapped:

  - Decoration to underlined text

  - A familiar image to something abstract


  And with this mental image in place, I don''t have to think about the term `text-decoration`,
  instead I will think of a decorated fireplace with underlined text sitting on the
  mantle. This visual is much easier for my brain to accept into long term memory
  because it has a direct frame of reference.






  - `border-bottom-color`

  - `border-bottom-style`

  - `border-bottom-width`

  - `border-color`

  - `border-left`

  - `border-left-color`

  - `border-left-style`

  - `border-left-width`

  - `border-radius`

  - `border-right`

  - `border-right-color`

  - `border-right-style`

  - `border-right-width`

  - `border-style`

  - `border-top`

  - `border-top-color`

  - `border-top-style`

  - `border-top-width`

  - `border-width`


  如你所见，有21个可用属性。而这仅仅是为了管理网页上的边框样式！可以想象，要记住这个列表会相当令人生畏，尤其是当你意识到这只是开发所需CSS样式中很小的一部分。


  然而，如果你开始分析这个列表，你会注意到一些规律。例如，有许多样式仅仅引用了 `top`、`bottom`、`left` 和 `right`。这些样式只是为元素的特定一边指定边框样式的方式。


  此外，你可能还会注意到每一边也有一组关于颜色、样式和宽度的选项。所以实际上，如果你知道这些元素都可用于边框元素集，这个列表就可以缩减到5项：


  - `border`

  - `border-color`

  - `border-radius`

  - `border-style`

  - `border-width`


  这样就更易于管理了。


  ### 复制粘贴是学习的敌人


  除了创建视觉思维导图和利用模式之外，我还要补充最后一条记忆技巧：不要复制粘贴你试图学习的新概念。


  我第一次听到这个建议是从 *泽德·A·肖* 那里，他是 *《硬核学习》* 编程书系列的作者。他告诉读者，在编写代码时甚至不要同时看书。他认为，强迫自己在不参考文档的情况下敲代码，会迫使大脑真正思考每一次击键。


  以我作为开发者和教师的个人经验来看，我发现那些复制粘贴代码或只是跟着教程走的学生，与那些尝试（即使失败了）自己实现代码的学生之间存在显著差异。


  ### 并非所有东西都需要记忆


  最后，我想消除一个常见的误区。作为开发者，你不需要记住每个类和方法才能构建项目。


  即使是专业程序员也会经常查阅文档。与其觉得必须记住所有东西，不如专注于记住你最常用的术语。这将使记忆过程更加实际和自然。

  '
- '## 第20章 学习新编程语言的系统


  在本章中，我将讨论如何学习一门新的编程语言。我会带你了解我在学习一门新语言或框架时使用的五个步骤。


  多年来，我受雇于 Learn.co 和 AppDev 等机构，为以下内容编写编程课程：


  - Ruby on Rails

  - Ruby编程

  - Python

  - Java

  - 多种JavaScript框架


  我真正用来构建应用的唯一语言是 Ruby，这意味着我不得不熟练使用多种我实际上没有太多经验的语言，有时时间非常短。多年来，我形成了一套学习新语言或框架的系统，这正是本章要介绍的。


  当我学习一门新的编程语言时，我会遵循以下步骤：


  1. 观看该语言的完整教程系列。观看时我不试图跟着做，只是观察讲师在演示中的操作，从而对语言语法和流程有一个宏观了解。

  2. 创建一个 *你好，世界* 应用。我会加入一些基础知识，例如 **运行循环**、**创建并实例化一个类**，以及我从教程中记住的其他高级概念。

  3. 选择一种排序算法并用该语言实现。即使排序算法是像选择排序或冒泡排序这样的基础算法也没关系。排序算法会迫使你使用数据结构、循环、变量和函数。将这些元素结合起来，你就能很好地掌握这门语言的工作方式。

  4. 学习该语言的高级教程，这次要跟着讲师一起构建程序。

  5. 学习该语言的编程面试题。能够自信地回答这些问题，能让你很好地了解自己是否对该语言有扎实的理解。


  我已经将这五个步骤用于多种语言，并且我可以告诉你，一旦你精通了一门语言，你会发现学习新编程语言容易得多，因为大多数语言都有不少共通之处，你只需要学习语法上的差异。


  希望这些技巧能帮助你学习一门新的编程语言。如果你在学习过程中发现了其他有用的方法，欢迎随时写信告诉我。祝你好运，编码愉快！

  '
- '## 第21章 开发学习技巧——反向记笔记


  在本章中，我们将回到过去，回顾我开发反向记笔记系统的那段经历。用 Google 快速搜索一下就会发现，这个词是我创造的；然而，这个流程并非我发明的。


  当我刚开始在得州理工大学读计算机科学研究生时，有一门课让我很吃力。距离我上次坐在教室里已经有大约十年了，我很难在1.5小时的讲座中保持专注。


  ### 传统记笔记的问题


  那段时间，我花费了大量时间与理查德·沃森博士会面。在一次会面中，我提出了自己遇到的问题。他的第一个问题与我是如何为课程记笔记有关。


  我把笔记拿给他看，他立刻告诉我，我记笔记的方法完全错了。他指出了我笔记中多处遗漏了作为统一元素的关键概念。如果不记下这些内容，我根本无法理解这些主题。


  在重新审视笔记时，我意识到他说得完全正确。我把时间花在了记录事实和我以为是关键术语的内容上，却常常未能阐明所有内容是如何协同工作的。


  例如，在关于树形数据结构的笔记中，我列出了二叉搜索树和B树的每个关键元素，但未能从行为角度描述树组件之间的内在差异。


  这就像在历史课上记笔记，写下拿破仑在滑铁卢战役中战败的人名、日期和地点，却没有描述他旧军队与战败时那支军队之间的关键差异。


  ### 反向记笔记


  发现自己记笔记的方法是错的，这很好。但如果没学到一种替代方法，也不会有太大用处。于是，沃森博士让我尝试一种不同类型的记笔记技巧。


  他说，上课时要把笔和纸收起来。他建议我上课时不要记笔记，只需专心听讲。他还指示我，讲座一结束，就应该找一个安静的地方，写下我从讲座中记住的所有主题。


  起初，我对这种方法持怀疑态度，主要是因为我担心重要的概念会左耳进右耳出。他补充说，我应该把讲座录下来，这样我可以把录音作为安全网，以防忘记某些主题。


  尽管我对这种方法持否定看法，我还是决定试一试。（显然，我自然的记笔记方法并不有效，所以我没什么可失去的。）我严格按照沃森博士的建议去做。结果我惊喜地发现，与在讲座中只顾着写下概念相比，这种反向记笔记的方法让我记住了更多信息。


  ### 反向记笔记的好处


  多年前我就开始采用这种反向记笔记的流程，今天仍在沿用。在这段时间里，我注意到了这种方法的一些关键好处。


  ### 更集中的专注力


  首先也是最重要的，知道自己之后必须复述讲座的关键内容，这会迫使我在听讲时保持更高的专注程度。






  of focus. This is opposite to how I used to take notes. My old way of taking notes
  would many times distract me from the concepts being discussed. I would hear a concept
  that I felt was important and I would take my focus away from the speaker and focus
  on writing down the topic.


  Many times, this would inadvertently result in stealing my focus away from another
  important concept, or a description of how the topic I was writing down worked at
  a high level.


  Additionally, as a naturally competitive person I would make a game of how much
  I could remember from each lecture. If I could remember enough to write down two
  pages of notes on Monday, I would try to write down two and a half pages on Tuesday.
  By making a game of the practice it forced me to narrow my focus even more on the
  content.


  ### Story-based mindset


  Another benefit of reverse note-taking is that it forced me to think of the lecture
  as a unified story instead of a series of facts. Let''s go back to our illustration
  of Napoleon''s battle at Waterloo. If you listen to a lecture about the battle and
  take notes during the class, you''d probably do things like write down the following:


  - General names

  - Cities where battles took place

  - Dates


  However, if you simply listen intently to the lecture and recite it back afterwards
  you won''t repeat dates and locations. Instead you will naturally remember the battle
  in story form. You''ll discuss the struggles that the Duke of Wellington had to
  overcome to lead the charge against the French army. And because it''s a story,
  your retention of the topics will be considerably higher compared with attempting
  to memorize facts and figures.


  If I were to ask you to remember a high school history class and a movie you saw
  in high school, would you have a better chance of remembering the plot of the movie
  or the history lecture?


  ### Summary


  This approach is not for everyone. I know students who excel with a more traditional
  note-taking strategy. However, if you find yourself in a situation like mine, I
  highly recommend you give reverse note-taking a chance. You may be surprised how
  effective it can be.

  '
- '## Chapter 22. Tips for Organically Growing a Freelance Business


  I strongly recommend that you think about freelance techniques whether you''re a
  freelance developer today or you are working with freelancers in some capacity.
  You''ll gain insights into thinking and coding, whatever type of developer you are
  today.


  Your career will be smarter if you''re able to think—at least when it''s a help—like
  a successful freelance developer. That''s what this part of this guide is all about:
  thinking smartly and for yourself as a developer!


  We''ll begin by discussing how to organically grow a freelance business as a developer.
  When I say organically, I mean that these are strategies that should work while
  you sleep. For example, I have had some of my largest clients contact me out of
  the blue based on them coming across a blog post or GitHub project I published.


  ### Organically growing a freelance business


  Having an organic marketing strategy is key for building a sustainable business.
  And in my experience the marketing mechanisms that have been the most effective
  are the six I will discuss.


  ### Referral requests


  Starting off the list are referral requests. Word of mouth marketing is one of the
  most powerful tools you can use for acquiring new clients. Imagine a real-world
  scenario of referrals. If someone opens up a new restaurant in your town, are you
  more likely to be influenced by the restaurant advertisements or one of your close
  friends telling you how great the food was? If you''re like me, if a friend sings
  the praises of the restaurant I''m going to, I value their opinion much more than
  an ad from the restaurant itself. The reason for this is because I trust my friend
  more than the restaurant. It works the same way when it comes to marketing yourself
  as a freelancer. If you have happy clients they can help grow your business.


  Over the years I''ve had multiple clients refer their friends and colleagues to
  me. However, I''ve also discovered that sometimes it helps to give them a little
  push. After you have successfully completed a project is a great time to ask a client
  if they have any friends that may need your services.


  ### Blogging


  Next on the list of organic marketing strategies is blogging. I considered placing
  blogging at the top of the list because it''s such a powerful tool. Over the years
  I have been contacted by multiple clients that told me they found me via my blog
  and subsequently hired me.


  Blogging is content marketing at its finest. With your blog, you can showcase your
  skills, position yourself as an expert in the field, and give clients a taste of
  your personality. If you have never blogged before and are wondering what type of
  content to write, here are some high-level topics that have worked for me:


  - *Tutorials showing how to build features I specialize in.* For example, if you
  focus on building eCommerce websites, you could write blog posts explaining how
  to connect an application to a payment gateway.

  - *Soft-skill strategies.* For this you can write posts related to experiences you
  have had while learning how to become a freelancer. An example could be writing
  about a time when you had a challenging client and how you were able to work with
  them effectively. These types of posts have multiple benefits since they are effective
  for content marketing and allow you to contribute to the freelancer community.


  ### Expert positioning


  Blogging is a great way to position yourself as an expert. However, writing blog
  posts is not the only way to be considered an expert. Another great way to accomplish
  this feat is to contribute to other blogs and news outlets.


  If you look at my personal site you''ll see that I''ve been interviewed or quoted
  in dozens of blogs and magazines over the years. These outlets include sites such
  as ReadWriteWeb and the magazine CIO.


  And don''t worry, you don''t have to pay a high-priced PR firm to be quoted on these
  types of sites. I personally use a service called HARO (https://www.helpareporter.com/),
  which stands for Help A Reporter Out. HARO pairs individuals with reporters around
  the world. The way it works is that reporters can post requests on HARO asking for
  interviews or quotes on a topic they are researching. Each day I monitor HARO and
  when I see a topic that I am familiar with I''ll write up a few sentences and send
  them to the reporter.


  Don''t let the expert moniker scare you away. There are many times where I am far
  from an expert in a field that I''ve been quoted in. However, I''ll perform a little
  time researching a reporter''s question and then I''ll simply give my opinion. This
  type of marketing is great because:


  - It''s free

  - Credible reporters are the ones positioning you as an expert

  - Many times, the reporter will link back to your website, which helps from an SEO
  perspective


  ### Open source contribution


  Next on the list of strategies for organically growing a freelance business is contributing
  to the open source community. When it comes to open source contributions, there
  are a number of strategies that you can take:


  - **Direct code contribution**: This usually comes in the form of creating a code
  library that other developers can use. One of the more successful Rails development
  firms in the world, thoughtbot, has taken this approach to the extreme. The thoughtbot
  team has built libraries such as FactoryGirl, Paperclip, and Administrate. These
  Ruby gems are some of the most popular gems in the Ruby development ecosystem and
  the thoughtbot team released these libraries completely for free. However, I can
  assure you that the company''s open source contributions are directly related to
  acquiring clients.

  - **Tutorials**: If you don''t feel that you''re quite ready for building a code
  library that other developers will use, that''s perfectly fine. You can find a feature
  that you feel comfortable developing and you can create a screencast in which you
  walk through your process for building the component.

  - **Contributing to pre-existing libraries**: Another great way to contribute to
  the open source community is to help add features or fix bugs on pre-existing code
  libraries. You can easily discover the full list of requested features for a code
  library by looking at its issue list on GitHub. By taking this approach, you don''t
  have to worry about building a code library from scratch. You can simply add onto
  another app, which helps the original development team and will give you experience
  and confidence in working with professional code bases. Personally, I contributed
  to multiple Eventbrite API RubyGems and built-in functionality that previously didn''t
  exist.


  ### Social media marketing


  No guide that discusses organically growing a freelance business would be complete
  without mentioning social media marketing. I have to admit that this is probably
  my least favorite marketing channel. If you peruse Twitter, Facebook, or Instagram
  it seems like they are cluttered with annoying sales pitches.


  However, I have been discovered by multiple clients via my social media accounts.
  Each day I try to post a development picture on Instagram. And by taking this approach,
  I have received a number of unsolicited project requests. And several of these requests
  have turned into freelance clients.


  When it comes to social media marketing my recommendation is to find an outlet that
  you enjoy working with. And once you''ve picked your favorite channel, put all of
  your available energy into that specific service.






  这一点很重要，因为如果你选了一个自己不喜欢的社交媒体渠道，你就不会想定期在上面发布内容。而在社交媒体营销中，保持一致性是成功的关键。


  ### 总结


  总而言之，在自然增长自由职业业务方面，我专注于三种方法。首先，一旦你有了满意的客户，就努力让他们把你推荐给朋友和同事。其次，确保你持续写博客，并把你自己定位为所在领域的专家。最后，找一个你喜欢运营的社交媒体渠道，并每天在上面发布内容。

  '
- '## 第23章 自由职业技巧——知道何时辞退客户


  如果你刚开始踏上自由职业之旅，或者甚至还在考虑这件事，本章的主题可能看起来有点疯狂。不过，我可以向你保证，知道何时辞退客户是建立成功自由职业业务的关键组成部分。它还能锻炼你在日常开发工作中每天都会用到的决策能力。


  ### 我的“紧急”客户


  几年前，一家快速崛起的初创公司聘用了我。这家公司增长迅猛，我受雇为他们搭建平台。经过面试流程后，我被录用了。接下这个客户不久，我遇到了一位即将离开公司的开发者。


  在带我熟悉系统之后，那位开发者给了我一句忠告。他说这家公司的CEO有一个最喜欢的词：**紧急**。我把这句话记在脑海深处，然后开始开发应用程序。没过几天，我就明白了之前的开发者为什么离开这家快速成长的初创公司。说真的，CEO发给我的每封邮件都以某种形式包含“紧急”这个词。


  在近一年的时间里，我与这家公司合作，构建了完整的系统。然而，我注意到，这唯一一个客户对我的生活质量造成了负面影响。我的夜晚和周末不再是和家人一起度过，而是花在处理客户数不清的紧急任务上。


  ### 何时辞退客户


  过了一段时间，我意识到，如果继续和这个客户合作，我实际上正在失去作为自由职业者的好处。做自由职业者本来应该意味着自由和自主安排时间，对吧？


  一旦我意识到这个客户让我的生活变得更糟而非更好，我就制定了一个方案，并告诉他我不会再继续与他合作。通过那次经历，我总结出了一套决定何时辞退客户的方法。有三个标准必须满足，我列在这里。


  ### #1 – 被当成员工对待


  决定何时辞退客户的第一个标准是：当你被当成员工对待时。被当成员工对待通常意味着你被期望按照公司的日程安排工作，从而限制了自己的自由和灵活性。我多次遇到过客户似乎忘了我是一名自由职业者的情况。这种情况发生的一些典型迹象包括：


  - *当客户因无法与你24/7随时沟通而感到不满。* 我曾经有一个不得不辞退的客户，因为他们的员工会为了琐碎的问题整天整夜给我发Skype消息。如果我没有立即回复，他们就会很不满。

  - *没有有条理的沟通。* 多年来，我遇到过一些客户，他们让多名员工在任何需要完成任务的时候随时给我发消息或打电话。设定固定数量的项目干系人是很重要的。如果客户让任何/所有员工都向你发送请求，那几乎可以肯定会发生沟通冲突。


  当我意识到客户把我当成员工对待时，我会去找CEO或我的直接上级，表达我的顾虑。很多时候，这能解决问题。但也有一些时候，问题依然存在，我不得不辞退客户。


  ### #2 – “紧急”的暴政


  回到本章开头我的故事，决定何时辞退客户的一个首要原因是，客户无法区分紧急任务和普通任务。我记得有一次，这个特定客户搭建了一个项目管理任务板。我没开玩笑，90%的任务都被标上了“紧急”标签。


  这不仅让人压力巨大，也是失败的根源。当所有任务都被标记为紧急时，实际上就等于它们全都不紧急，因为这些项目之间毫无区分。


  在*重来*这本书中，*弗里德*和*汉森*建议公司把“紧急”这个词从词典中删除。我非常赞同这种做法。


  通常，当客户把任务标记为**紧急**或**ASAP**时，意味着他们不知道如何正确地管理项目。而糟糕的项目管理能力并不是你希望客户拥有的特点，因为一个不懂管理项目的客户最终会因为你没有正确执行他们的计划而责怪你。


  ### #3 – 有毒的环境


  决定何时辞退客户的最后一点是：当合作环境有毒时。我很幸运，不常遇到这种情况。然而，多年来我确实也遇到过几个有毒客户。有毒的表现形式有很多，包括：


  - 持续的消极情绪

  - 沟通不畅

  - 不切实际的截止期限

  - 道德/诚信问题


  我想起一个客户，他集以上所有特质于一身。他雇我开发一个应用，却给了一份模糊得令人难以置信的需求清单。在整个项目开发期间，我每天发送项目进度更新，而他往往几周都不给任何反馈。


  当我收到他的消息时，他的评论全是负面的。在很多情况下，他会因为我没有实现他模糊功能清单上甚至从未提过的功能而生气。不用说，我当场辞退了他，转向了更好的发展机会。


  ### 辞退客户的乐趣


  刚开始做自由职业者时，辞退客户的想法似乎很疯狂。然而，随着业务不断发展，我意识到，辞掉一个不断给我的生活带来压力的客户，实际上让我成为了更好的自由职业者。


  与有毒客户合作并不愉快。他们会带来焦虑，也会扼杀自由职业本应带来的乐趣。因此，我一直在精简我的客户名单。随着自由职业经验越来越丰富，我的客户名单质量也越来越高。这让我更加快乐，也让我在为客户产出作品时表现更好。

  '
- '## 第24章 避开银弹，打造可扩展的自由职业项目


  一个代码库就能完成你签约承接的自由职业项目中的很大一部分工作，这种想法听起来是不是很诱人？没关系，你可以诚实地说“是”，无论你现在是活跃的自由职业开发者，还是将来会成为其中一员。


  在我开始自由职业之旅时，每当我遇到一个大型功能需求，第一件事就是看是否有现成的代码库能满足这个需求。在开发领域，这类代码库被称为银弹。


  然而，尽管让插件或代码库承担项目的大部分工作听起来很诱人，但根据我的经验，这种做法最终比从零开始构建这些组件还要耗时。


  ### 银弹的问题


  我们先来看一个实际案例。几年前，我接了一个车队管理项目。需求清单包括以下功能：


  - 对多个数据库表具备完整的CRUD能力

  - 创建一个能够搜索每个数据库表各种属性的搜索引擎

  - 能够使用筛选器下钻数据

  - 以及与报表仪表板相关的若干其他项目


  项目开始后，我开始研究能够充当银弹并处理关键功能的代码库。几天后，我遇到了一个名为 rails admin 的 RubyGem。这个 rails admin gem
  非常强大。它包含的功能包括：




  - 轻松查询数据库表

  - 实现自定义过滤器以运行高级查询

  - 导出记录到 Excel/CSV

  - 从仪表板添加新记录

  - 编辑/删除记录


  正如你可能已经注意到的，这个代码库看起来与我当时项目的需求集合非常契合。


  ### 银弹式定制


  我很快着手构建应用程序。并且将 rails admin gem 集成作为项目的基础组件。客户在演示期间非常兴奋。他们绝对喜欢这个应用程序，并且对我能如此快速地构建应用感到震惊。


  那么，问题出在哪里？问题开始出现时，客户开始要求新功能。在试用应用程序几周后，他们提出了诸如以下的功能请求：


  - 能够保存常用查询

  - 导出到与他们的会计系统兼容的罕见文件格式

  - 集成税务 API 以计算折旧


  这些新功能对于车队管理系统来说都是相对常见的请求。只有一个问题。因为我围绕 rails admin 代码库构建了整个应用程序，所以我受限于 gem 提供的功能。而这是一个问题，因为
  rails admin 事实证明难以修改。


  事实上，经过数周的繁琐工作后，我得出的结论是，从头构建整个系统所需的时间比定制 gem 本身还要少。因此，最终结果是我浪费了大量时间，项目被延迟了，这一切都因为我以为某个单一的银弹代码库能够处理应用程序的很大一部分。


  ### 成为代码库的精准射手


  那么，这是否意味着我建议你完全远离代码库？不，完全不是！自由职业之所以可行（对客户来说也负担得起）部分原因在于你不必从头创建应用程序 100% 的功能。


  相反，我学会了在集成代码库时保持选择性。让我们看看我在项目中经常使用的几个代码库：


  - **Pundit**，用于构建权限结构。Pundit 是一个轻量级代码库，易于定制，并且不会将你锁定在狭窄的权限功能集合中。

  - **Devise**，用于身份验证。从头编写身份验证系统耗时耗力。Devise gem 允许 Rails 开发者快速集成注册、登录、注销等功能，以及诸如安全密码检索等高级组件。此外，Devise
  是可定制的，我很少遇到它无法满足应用程序需求的情况。


  你是否注意到这些代码库如何像特定功能的辅助库一样运作？我将代码库集成到项目中的规则是，我挑选出有助于项目小元素的包。而我避开那些承诺能处理项目功能大块部分但难以定制的银弹。

  '
- '## 第 25 章. 自由职业者管理高级功能的指南


  每个自由职业者在某个时候都会遇到的问题是管理高级功能。而我所说的高级功能是指客户要求你构建你从未构建过的功能，当这种情况发生在你身上时。


  注意我说的 *when* 而不是 *if*？那是因为每个自由职业者，无论多么有经验，都曾被要求构建他们从未创建过的事情。


  ### 管理高级功能


  多年来，我被要求构建各种各样的功能。其中一些我有经验，其他的……就没那么多。一个很好的例子是几年前，当我被要求构建一个 GPS 跟踪 iPhone 应用时。客户希望跟踪他们在外勤的员工并允许他们远程提交工单。听起来是个好主意，对吧？我也这么认为。只是有几个问题：


  - 当时，我还没有构建过任何移动应用程序，更不用说生产级应用了

  - 我对实时 GPS 跟踪的经验极少


  由于缺乏经验，我的第一反应是放弃这个项目。然而，客户是一家财富 500 强公司，当时我确实有长期计划来构建我的移动作品集。更不用说这份工作支付超过 10 万美元。考虑到这些因素，我接受了这个
  offer。


  ### 总结


  因此，当客户要求你构建一个你完全没有经验的功能时，我的建议是与该领域的专家合作。本章中我给出的例子专门针对自由职业者对构建功能几乎没有任何经验的情况。


  也有我被要求构建一个我有经验的功能，但我不愿承诺构建生产级应用程序的情况。在那些情况下，我聘请了一位导师来回答我在开发过程中遇到的问题，而那些项目进行得相当不错。它们还有额外的好处，即教会了我如何构建我经验有限的高级功能。


  总之，在为客户管理高级功能时，不要让你的缺乏经验阻止你获得工作。作为自由职业者，你可以访问几乎无限的资源来帮助你构建任何项目。


  ### 一个警告


  在你出去接手十几个你完全不知道如何构建的工作之前，让我加一句警告。


  我见过自由职业者甚至大型软件开发机构采取这样一种做法：认为他们只需雇佣外包人员来为他们做所有工作。这种做法每次都会失败。


  要与外部承包商合作，你需要每天与他们合作。你是否注意到本章中我处理的移动应用程序的前提之一是我与移动开发者有清晰的沟通渠道？


  如果我只是给他一份需求清单然后等待成品，项目就会惨败。与承包商合作通常与自己写代码一样耗时。所以，不要认为外部承包商是会为你做所有工作的魔法子弹。

  '
- '## 第 26 章. 自由职业者访谈 – 接手遗留应用程序的实用技巧


  在本章中，我采访了一位我非常尊敬的自由职业开发者 Derek Harrington。事实上，当我决定推出 DevCamp 时，我不得不放弃了我的一批自由职业客户。而
  Derek 是我把大部分客户交给的人。基于我多年来与他的经验，我知道他会很好地照顾客户，并且他们会对他的专业知识感到满意。


  在本章中，我向 Derek 提出了一些与自由职业相关的问题。具体来说，我们讨论了接手遗留应用程序的实用技巧。


  Derek 的技巧当然可以适用于任何开发者，无论你是自由职业者还是不是在你目前的情况下——这就是为什么我建议任何开发者都学习 Derek 对这种常见编码情况的自由职业方法！


  ### 你接手遗留应用程序时做的第一件事是什么？


  编写测试。当你识别出需要重构的代码部分时，先编写规范来覆盖该功能的功能，然后重构代码并确保你的测试仍然通过。


  ### 过去在接手遗留应用程序时，对你有效还有哪些其他实用技巧？


  在评估遗留代码库时，如果你能接触到之前的开发者，就利用他/她。依靠他们获取信息。问诸如“他会怎么做不同？”、“他真的很想重构但从未有时间处理的代码片段是什么？”、“代码中他/她最自豪的部分是什么？”之类的问题。






  “是吗？”借鉴他们的经验来指导你的评估。很多时候，糟糕的历史代码与其说是不称职的开发者的产物，不如说是项目管理不善和截止日期压力造成的。


  ### 对于从头重写代码库，你有什么看法？《技能提升：开发者的职业生活指南》


  要抵制把所有东西都重写得完美无缺的冲动。我们都继承过一些令人头疼的代码库，说实话，我们在职业生涯中也都不止一次当过那个罪魁祸首。但不要为了重写而重写。那是不负责任的。


  如果你打算从头重写，请确保理由正当。我们都想从事全新的项目，使用每个新技术框架的最新版本。这确实有趣得多。


  但有时这对项目和客户来说并不是最好的选择。确保你的决定不仅仅是因为“你想这么做”。草率的代码可以清理，测试可以添加，版本可以升级。如果旧代码应用架构糟糕，充斥着脆弱、不稳定的功能，并且没有使用任何通用的最佳实践或第三方工具，那才是重写的好理由。对混乱应用缺乏理解并不是正当理由。


  ### 什么时候是修复编写糟糕代码的最佳时机？


  就像从头重写应用一样，留下每个团队成员都会碰到的混乱代码也是不负责任的。有时候应该让糟糕的代码待着。但不要在你每次处理应用时都被它绊倒。


  ### 接手遗留应用的技巧


  虽然处理遗留应用需要应用多种技术，但第一步应该是构建一套全面的测试套件。


  ### 创建测试套件


  无论你使用什么语言或框架，你都可以创建自动化测试来捕获应用的功能。所以，在我处理的遗留应用中，我开始为每个模型创建测试。


  我先从基本的单元测试开始，然后逐步扩展到集成测试，确保代码库的各个元素能够正确相互通信。这个过程还有一个额外的好处，那就是我更加熟悉了应用的结构，并且可以在实现测试的同时重构代码。


  ### 通过 TDD 添加新功能


  测试套件构建完成后，我开始通过 TDD（测试驱动开发）方法构建所有新功能，这确保了测试套件保持最新。通过利用这个过程，还可以确保我添加的新功能不会破坏现有的功能。这被称为回归测试。


  ### 将特定功能拆分成微服务


  我越深入代码库，越开始注意到应用已经因功能过多而变得臃肿，许多组件并不需要包含在核心应用中。


  因此，我慢慢开始创建处理独立功能模块的微服务应用。一些例子包括：创建一个管理用户通知系统的微服务，以及构建一个处理报表引擎的应用。创建微服务后，我可以删除大量遗留代码，然后简单地将遗留应用与新的微服务连接起来，使它们能够正确通信。


  ### 让代码库 DRY


  在许多遗留应用中，你会遇到重复代码，这会导致许多问题，包括不得不在代码库的多处进行修改的问题。


  一个例子是我处理的应用如何处理视图模板。有许多视图文件包含相同的 HTML 代码。我可以将这些组件重构为可在整个应用中共享的局部模板，这样我只需修改一处代码，就能在整个应用中生效。


  接手遗留应用这个话题很重要，不仅是为了让你准备好应对处理遗留应用所需采取的步骤，也是为了让你对如何从头构建应用有更好的想法。


  还记得我之前提到的 Eventbrite 应用吗？那个应用之所以易于操作和添加功能，是因为它从第一天起就使用了本章提到的每一种技术。


  如果你使用这些最佳实践技术从头开发应用，将来添加功能时会更加轻松。这还会带来额外的好处：未来可能参与该应用的新开发者能够轻松开始添加新功能，并且他们会感谢你在开发过程中付出的额外努力。


  ### 总结


  我希望这份指南能对你接手遗留应用有所帮助，并且你能将其应用到你正在处理的项目中。


  ### 从头开始 versus 重构


  当我还是一个年轻天真的自由职业者时，我对重构遗留应用感到恐惧。客户一提到从头开始的可能性，我就立刻抓住了！


  然而，随着我参与的项目越来越多，我的想法发生了很大变化。多年来，我总结了一套系统来帮助我在从头开始和重构项目之间做出决定。这就是我接下来要讲的内容。我遵循的步骤是：


  - 1. 消除恐惧因素。

  - 2. 分析 80/20 法则。

  - 3. 构建自动化缺陷列表。

  - 4. 站在客户的角度。


  ### #1 – 消除恐惧因素


  经验不足的自由职业者倾向于选择重新开始项目的原因之一是恐惧。而恐惧很少是做出任何决定的好理由（除非你在躲避野生动物之类的）。所以，在做决定之前，我做的第一件事就是把恐惧从等式中移除。我会问自己：


  > “如果你不害怕这个代码库中的未知问题，你会做出什么决定？”


  一旦消除了恐惧，我就能从无偏见的视角看待这个项目。


  ### #2 – 分析 80/20 法则


  80/20 法则有许多实际意义。你可能听说过它被用来表达 20% 的人拥有 80% 的财富。或者说 20% 的客户群创造了公司 80% 的收入。然而，我也发现
  80/20 法则在决定从头开始还是重构时也很适用。


  ### 什么时候应该从头开始？


  到目前为止，本章主要在支持重构应用。然而，有些时候从头开始是更好的方法。一些让从头开始成为对客户明智决定的理由是：


  - **架构的彻底改变**：我有客户要求我将应用从单体架构（一个大型单一应用）迁移到基于微服务的架构（多个各自执行单一功能的应用）。在这种情况下，试图保留遗留应用是没有意义的，因为核心应用结构必须改变。

  - **迁移到不同的语言/框架**：多年来，我有不少使用旧 ASP .NET 和 PHP 应用的客户找我，希望用 Ruby 重建他们的系统。在更换语言或 Web
  框架时，保留遗留应用是不可能的。


  注意到这两个关键理由都与缺陷或混乱代码无关了吗？我唯一会建议客户从头开始的时候，是当保留遗留应用实在不可能时。


  ### 总结


  总之，需要记住的关键是，每当你需要决定从头开始还是重构时，都要经过这套检查系统。随着你作为开发者的经验越来越丰富，你会越发意识到，一个仍在运行的遗留应用无法被拯救的情况极其罕见。





  '
- '## 第29章。你应该在自由职业项目中使用 TDD 吗？——比较质量与速度


  在着手一个新的自由职业项目时，许多开发者和设计师首先会问的问题是：


  > *你想要它做得快……还是做得好？*


  在本章中，我将专门讨论你是否应该在自由职业项目中使用 TDD。然而，我现在要讨论的概念适用于任何类型的质量控制系统。所以，这对任何开发者来说都是很好的建议。


  ### 质量与速度


  有一条老牌的软件工程规则指出，在构建项目时你有三个选择：


  - 质量

  - 速度

  - 成本


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_158_0.png)


  该图以韦恩图的形式表示了这一原则。其难以捉摸的中心是项目快速构建、价格低廉且采用行业最佳实践创建的地方。根据我的经验，很少有项目能位于这个甜蜜点内。相反，我会告诉客户，他们只能在三者中选择其二。例如：


  - 你可以让项目以低成本妥善构建，但开发时间会相当长。这是因为项目需要放在一边，因为更高报酬的项目需要优先处理。

  - 另外，项目可以以低成本快速构建。然而，这种方法不会留出遵循最佳实践所需的时间，例如在应用程序中构建自动化测试。


  另外，你可以让客户决定他们希望你采取什么方法。在这种情况下，你提出构建完整的测试套件与仅构建应用程序本身的利弊。如果客户足够明智，他们很可能会看到包含测试的好处并选择价格更高的选项。


  这是一种有效的策略，因为它允许你让客户参与决策过程，这会让他们感觉参与到工作中。而且如果客户仍在寻找其他自由职业者，这种方法可能有助于赢得他的青睐。


  让客户决定的另一个好处是，他的回应可能会让你了解他的想法。如果他认为测试是毫无意义的奢侈品并说他只关心完成项目，他可能是一个噩梦客户。在这种情况下，你最好转向更明智的人合作。


  ### 使用常识


  最后，确保你在使用常识。想象一下被要求构建一个简单的企业网站。在这种情况下，你只需要编写一些基本测试。最多这只会增加一小时左右的项目时间。


  没有必要拖慢流程，编写测试来验证每个 CSS 类和 ID 是否都显示在页面上。就像自由职业和生活中的大多数概念一样，常识是你最强大的工具之一。


  - 继续处理右侧页面上井的错误修复

  - 更新城市页面上位置小部件的 CSS

  - 集成城市特定展示页面上帖子的检查器

  - 更新注册按钮

  - 暂时隐藏赞助商文本

  - 实现联系我们文本的更改

  - 为表单实现自定义子分区与主分区注释

  - 更新帖子展示视图上的编辑标签


  注意这些更新是实用且信息丰富的。没有任何项目过于技术化，因为过于技术化的更新只会让客户感到困惑。


  ### 自动化客户更新


  所以，我们已经确定客户更新很重要，我们也知道一个好的客户更新是什么样的。然而，如果我们每天为多个客户从头输入这些更新，会累计花费大量时间。我不喜欢浪费时间，我怀疑你也不喜欢，这就产生了一个困境：


  1. 我们需要创建我们每天所做工作的详细更新。

  2. 但我们不想浪费时间写报告（而且我们对写枯燥的报告的厌恶，不正是我们想成为自由职业者的原因吗？！）。


  每当我遇到这种情况时，我都会尝试看看是否有办法自动化一个无聊的任务。幸运的是，有办法。


  ### 版本控制来救援


  起初，我是手动编写所有日常更新的。然而，如果我在一天结束时写它们，我必须回顾所有 GitHub 提交信息来参考我所做的工作。


  在经历了这个过程一段时间后，我意识到如果我只是给我的 GitHub 更新添加更多细节，我就可以每天复制粘贴它们，而不必从头再写。


  这个过程最终为我每天节省了相当多的时间，因为出于最佳实践的原因，我已经为我实现的每个新功能编写了 GitHub 提交信息。所以，现在我可以消除我一直在做的重复工作。


  以下是使用利用提交信息来自动化客户更新的技巧的 GitHub 项目截图：


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_164_0.png)

  '
- '## 第31章。自由职业需求获取——功能开发指南


  想象一下，你是一名自由职业开发者，客户交给你一个新功能来构建。然后想象你构建了一个优雅的功能，所有代码都完美运行。你遵循最佳实践并确保覆盖所有潜在的边缘情况场景。


  现在想象你在向客户演示这个光鲜亮丽的新功能。但他们没有告诉你你是世界上最好的开发者并要以你的名字命名他们的第一个孩子，而是他们困惑地看着应用程序，因为你构建的东西完全不符合他们脑海中的预期。


  这是在自由职业开发世界中经常上演的场景。在许多情况下，这是由于需求获取过程不佳造成的。我刚才提到的故事不是编造的寓言，它最近发生在我身上。而且当我说最近时，我的意思是昨天（在我写这篇文章时）。


  > *我的名字是 Jordan，我写了一个糟糕的需求文档……“嗨，Jordan…”*


  那么，我做错了什么？问题是我在需求获取阶段仓促进行。我已经为这个特定客户工作了超过 5 年，我在确认该功能所需的确切需求集时变得懒惰。


  ### 自由职业需求获取


  让我们回顾一下发生了什么，这样你就可以避免同样的尴尬和浪费时间。


  #### 如何开始


  几周前，客户联系我并说我为他们构建的一个应用程序需要一个新功能。该应用程序是他们的司机用来为客户生成发票的发票系统：


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_167_0.png)


  在电子邮件中，客户附上了这张电子表格。他说应用程序必须生成此发票以交给客户。


  #### 构建


  收到电子邮件后，我花了几天时间对新功能进行建模。我列出了模块之间传递的所有消息。我构建了 UML 图表以确保数据被正确建模。之后


  #### 更好的结局


  如果我遵循了这两种步骤，从几分钟到几个小时就能确定实际需要的功能。正如你所想象的，这比浪费数周的开发时间要好得多。


  ### 总结


  我希望本章对自由职业需求获取有所帮助，你能够从我的错误中学习并将其应用到自己的业务中。

  '
- '## 第32章。如何远程向自由职业客户演示工作？


  所以，你有一个自由职业客户，你准备展示你的工作，但当你远程工作时，如何展示项目呢？如果整个应用程序已完成，你可以简单地向客户发送一个链接让他们测试。然而，根据我的经验，这种方法并不是一个好主意。作为设计师或开发者，你了解应用程序的内部运作。


  另一方面，客户，尤其是非技术类型的客户，会在测试应用程序时磕磕绊绊。即使你对项目做得很好，如果客户不知道如何使用软件，他们也不会对你的工作感到满意。


  ### 为什么适当的演示很重要


  多年来，我发现深思熟虑的演示是成功项目的关键。有两个主要原因：


  1. 适当的演示会让你控制应用程序的流程。你可以控制工作的重点并花时间展示系统的工作方式。这本质上将作为客户对应用程序的教程。井组织的演示将教育客户了解应用程序并消除与用户体验困惑相关的许多常见问题。

  2. 你将获得实际反馈。不管你认为自己多么理解客户需求，总会有误解，尤其是在开发过程的早期。


  幸运的是，如果你准备好软件的适当演示，你



  可以更清楚地了解客户的愿景。如果你只是将应用程序的链接发送给客户测试，他们回馈的许多内容都将与不理解系统功能有关。然而，如果你能清楚地展示应用的工作方式，就能缩短这一过程，并让你更快地了解实际需要修复的问题。


  ### 远程演示工作服务回顾


  有许多方法可以让你远程向客户演示工作。我将回顾过去几年中我使用过的流程，并讨论每种选项在什么时候最理想。


  #### 录屏


  我将回顾的第一个选项是创建录屏。如果有多个客户需要查看该功能，这是一个很好的选择：


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_175_0.png)


  从核心上讲，录屏就是你自己录制自己演示应用程序的过程。如果是基于 Web 的应用程序，你可以让视频展示应用程序的每个功能。在我自己的工作中，我会使用以下工具：


  - 放大特定屏幕区域

  - 我会高亮我想要关注的屏幕部分


  这个过程只需花费很短的时间。然而，它非常值得，因为它能让客户对系统有一个切实的演示体验。


  你可以使用多种工具来录制屏幕。我个人最喜欢的是 Camtasia；不过它有点贵。所以，如果你预算有限，还有无数免费选项，例如 Screencast-O-Matic。


  录制完屏幕演示后，你可以将其上传到 YouTube、Vimeo 或视频托管网站。然后，你可以让客户在方便的时候查看链接。


  #### 远程桌面


  在远程演示工作工具列表中，接下来是远程桌面会话。每个客户都略有不同。许多客户对电子邮件和视频演示感到满意。然而，其他客户希望有更多个性化互动：


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_177_0.png)


  如果客户希望在演示过程中与你进行充分互动，远程桌面工具可能是展示你工作的最佳选择。我还发现，当我为其他开发者工作时，这个选项也很理想。这主要是因为远程桌面演示支持结对编程。在远程桌面工具方面，有几种不同的选择：


  - **GoToMeeting**：如果你的客户想要传统的实时演示，GoToMeeting 或 Join.me 等服务就很不错。它们可以让客户查看你的屏幕，而且如果你与多个利益相关者合作，它们还附带专门的电话会议线路。

  - **屏幕共享**：有时你需要能够与客户同时进行演示。这适用于我刚才提到的场景，即你为开发者工作，他希望与你同时浏览应用程序。我最喜欢用于此类演示的服务是 Screenhero。它提供了一种让多个用户同时控制屏幕的简单方法，而且价格相当实惠。

  - **免费选项**：如果你预算有限，有许多免费的屏幕共享和远程桌面选项。其中值得一提的是 Google Hangouts、TeamViewer 和 Skype。


  #### PowerPoint


  在远程演示工作工具列表中，最后一种是 PowerPoint 类型的演示文稿。我说类型是因为你不一定非要使用 PowerPoint 不可。我曾使用 PowerPoint、Google
  Slides 和 Keynote 进行产品演示。在项目开发初期，我喜欢使用基于幻灯片的演示。


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_178_0.png)


  很多时候，我构建了后端功能后，想确认其配置是否正确。然而，我意识到如果客户看到一个丑陋的用户界面，他们无法欣赏已完成的工作。于是，我借鉴了 Google Ventures
  的做法，创建了一个 Keynote 幻灯片组。我设计这套幻灯片来模拟我计划最终添加的用户界面。


  然后，我简单地将我实际在应用程序中构建的行为加载到幻灯片中。这种方法效果很好，客户也很满意。更重要的是，这个选项让客户专注于我所构建的内容，而不是那些仍在待办清单上的需求。


  这个选项也非常适合移动应用演示。移动应用对客户来说，在手机上演示是相当复杂的。因此，基于幻灯片的方法可以更高效地展示应用的设计和行为。


  ### 总结


  我希望这是一份有用的自由职业者指南，能帮助你远程向客户演示工作。


  ### 当范围蔓延失控时


  应用完成后，客户对系统没有动态可点击的推送通知感到不满。我本可以指出他们从未要求过这个功能。但在我看来，这个行为是一个常识性功能，所以我不收取额外费用就为客户添加了。


  范围蔓延很少有这么简单。你会发现，通常客户会提出新想法，然后试图让你免费实现它们。如果你没有为项目成功建立明确的定义，你最终会面对一个愤怒的客户，认为你想多收他的钱。请记住，在客户看来，他们可能没有意识到他们要求的功能超出了原始需求集合。定义项目成功有两种方式。我们将逐一讨论。


  #### 基于需求


  首先也是最重要的是传统方法，即基于一组需求。这种方法还可以；然而，它在现实世界中很少奏效。该过程遵循以下工作流程：


  1. 写出一整套全面的项目需求。

  2. 需求听起来像是：用户应能够登录。

  3. 每个功能都有自己的需求。

  4. 一旦所有需求都实现，项目即视为完成。


  理论上，这似乎是一个很好的计划。然而，在真实项目中，它很少奏效。问题主要在于，即使是最有经验的开发人员或项目经理也无法列出每一个……单独……细小的功能。实际情况是，功能会被遗漏，而你或客户将不得不妥协才能完成项目。


  #### 基于故事


  那么，如果基于需求来定义项目成功并不切实际，更好的方法是什么呢？就我个人而言，我通过构建易于理解的应用程序故事取得了最大的成功。什么是应用程序故事？让我看看我最近为一个项目编写的故事：


  *当管理员用户登录应用程序时，她会看到一个自定义仪表盘，其中呈现她管理的所有项目。从那里，她可以编辑项目详情。她还可以导航到资源部分、用户管理仪表盘和用户审计日志。*


  注意到故事与一组需求有什么不同了吗？当向客户展示故事时，他们更容易想象最终产品。这让他们在项目开始时而不是在项目结束时，向你提供完整的需求行为。最后，构建良好的用户故事为你提供了清晰的项目成功定义。这些故事能否正常运作？如果可以，那么项目就完成了，就是这么简单。


  #### 正式签署


  在客户批准完整的应用程序故事集后，务必让客户正式签署确认。通常，这意味着让他们签署一份包含所有故事的文件。这提供了一份实用的协议，当所有功能都实现后，你可以以此作为依据。


  ### 总结


  我希望这是一份有用的指南，帮助你作为自由职业者定义项目成功，并且你可以在下一个项目中使用这种方法。





  '
- '## 第34章。自由职业者顶级项目管理工具


  在本章中，我将讨论我在编码项目中使用的顶级项目管理工具。在准备本章时，我浏览了一些目录，其中列出了市场上所有已知的项目管理软件应用程序。


  说实话，我有点震惊。自由职业者可用的项目管理选项 literally 有数千种。值得庆幸的是，多年来我为多家客户工作，并使用过各种项目管理应用。


  在本章中，我想为你提供一份顶级项目管理工具的清单，以及它们各自的优缺点。有了这些知识，你就可以决定哪一个最适合你的项目和自由职业业务。


  以下是六款我使用过的顶级项目管理工具。我可能使用过大约十几种工具；然而，我只想列出我：

  - 实际上在生产项目中使用的应用程序

  - 我有良好体验并且会推荐给别人的


  ### 顶级项目管理工具


  我们现在将逐一查看每个工具。


  ### Basecamp


  我最喜欢的项目管理应用程序是 Basecamp。我可能对它有偏爱，因为它的创始人 David Heinemeier Hansen 也是


  ![](img/de22e3e00f8df753e0d57f7da4d1c581_187_0.png)


  除了项目管理之外，我还将 Basecamp 用作我的日常计划器。基本上，我会将我的待办事项从一天移动到另一天。我喜欢我可以在一个页面上看到我的多个项目及其各自的待办事项列表，如下所示：


  ### 所有待办事项列表


  ### Camera Monitoring — Bandwidth Usage

  - 尝试确定导致使用量激增的原因（高于预期）

  - 调查压缩选项，包括 H.265 和谷歌的新方法

  - 添加一个待办事项


  ### Camera Monitoring — Camera Configuration

  - 在摄像机上测试运动检测

  - 制定设置运动检测的最佳实践

  - 添加一个待办事项


  ### Camera Monitoring — Compression

  - 添加一个待办事项


