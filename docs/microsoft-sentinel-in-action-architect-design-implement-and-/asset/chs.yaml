- '# Microsoft Sentinel 实战：架构、设计、实施和运营 Microsoft Sentinel 作为您安全解决方案的核心，第二版






  ## 贡献者


  ## 关于作者


  **Richard Diver** 是 Microsoft 安全解决方案组的资深技术业务战略经理，专注于开发安全合作伙伴。总部位于芝加哥，Richard 与高级安全和合规合作伙伴合作，帮助他们在整个
  Microsoft 平台上构建解决方案，包括 Microsoft Sentinel、Microsoft Defender、Microsoft 365 安全解决方案等。在加入
  Microsoft 之前，Richard 在多个行业和多家 Microsoft 合作伙伴工作，为全球各地的各种客户设计和实施云安全解决方案。他所有的空闲时间通常都花在家人身上。


  **Gary Bushey** 是一位拥有超过 25 年 IT 经验的 Azure 安全专家。他很早就开始了自己的职业生涯，当时他在五年级时帮助数学老师完成编程作业，并工作了一个整个夏天来负担得起他的第一台电脑，一台
  Commodore 64。当他 14 岁时出售了他的第一个程序——一套公寓管理系统后，他就上瘾了。在他的职业生涯中，他曾担任开发人员、顾问、培训师和架构师。当不花时间在电脑前时，你会发现他在树林里徒步旅行、拍照，或只是随意选一个方向，看看下一个拐角有什么。


  **John Perkins** 是 Threat Angler 的创始人兼负责人，这是一家网络安全服务提供商，专注于托管服务、专业服务和培训，重点是为各种规模的客户提供网络安全成果。John
  在网络安全领域拥有超过 20 年的经验，并在职业生涯中涉足了几乎所有网络安全学科。他拥有使用 Microsoft Sentinel 等众多应用的经验，并为多家大型服务提供商设计、构建和领导托管安全服务。在业余时间，John
  喜欢与家人共度时光、旅行和保持活跃。


  ## 关于审阅者


  **Ashwin Patil** 目前担任 **Microsoft Threat Intelligence Center (MSTIC)** 的高级项目经理，拥有超过
  10 年完全专注于安全监控和事件响应的经验，负责防御企业网络。在他目前的角色中，他主要从事威胁狩猎、为 Microsoft Sentinel 在 **Kusto
  Query Language (KQL)** 中的检测研究，以及开发用 Python/R 编写的 Jupyter 笔记本，用于在各种云和本地安全事件日志数据源中进行威胁狩猎和调查。他拥有计算机工程学士学位，并拥有多个
  SANS 认证，包括 GCIA、GCFE 和 GCIH，专业领域为 **Digital Forensics and Incident Response (DFIR)**。


  **Dennis Pike** 是 Island 的原始销售工程师，这是一家隐秘模式的安全初创公司。他会告诉你更多，但他们可能会把他放到一个只有排球的孤岛上。他出生于肯塔基州，令人惊讶的是他不喜欢波旁威士忌，反而成为了一名全国排名的啤酒评委。他拥有弗吉尼亚大学系统工程学士学位，并在过去
  25 年里从事 IT 工作，包括担任 Microsoft 的全球黑带 – 高级安全分析师，专注于 Microsoft Sentinel。


  > *我想感谢我的妻子 Heather 的耐心、爱和支持。*


  **Rod Trent** 是 Microsoft 的高级云安全倡导者，也是 Microsoft Sentinel 全球 SME，帮助客户从现有 SIEM 迁移到
  Microsoft Sentinel，以实现通过提高效率而实现更好安全且不妥协的承诺。他是一位丈夫、父亲和首次成为祖父的人，所以请慢慢说大声点。他在业余时间（如果真的存在的话）同时观看
  *Six Million Dollar Man* 系列剧集并编写 KQL 查询。

