  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_99_0.png)\n\n图 3.8 – AWS 分析模板\n\n我们可以在“**相关分析模板**”部分看到目前有\
  \ 16 个可用模板。每个模板都需要启用，以确保数据正在被分析。选择第一个分析模板，然后逐步完成配置步骤，如下面的截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_100_0.png)\n\
  \n图 3.9 – 针对已知 IRIDIUM IP 的 AWS 分析规则\n\n根据您所需的配置要求配置向导的每个页面，然后完成向导，并观察对引发的事件数产生的影响。如果数量过高，请重新配置规则以减少生成警报的频率，或者启用将警报分组到单个实例的功能。请注意不要将警报过度调整到不产生任何事件的程度，因为这可能会隐藏需要调查的合法警报。\n\
  \n在下一节中，我们将配置 Log Analytics 可用的存储选项。\n\n## 配置 Log Analytics 存储选项\n\n完成几个数据连接器的配置后，您将开始看到每天将引入并存储到\
  \ Log Analytics 中的数据量。您存储和保留的数据量直接影响其相关成本（有关详细信息，请参阅第 1 章“Microsoft Sentinel 入门”）。您可以通过导航到\
  \ Log Analytics 工作区，然后从“常规”菜单中选择“使用情况和估计成本”来查看当前的使用情况和成本，如下面的截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_101_0.png)\n\
  \n图 3.10 – Log Analytics 导航菜单\n\n选择该选项后，系统会向您显示一个信息仪表板，该仪表板将在左侧显示定价层和当前成本，在右侧显示图表，以显示最近\
  \ 31 天的每日消耗变化。第二个图表显示每个解决方案的保留数据总大小。以下截图显示了仪表板的示例：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_102_0.png)\n\
  \n图 3.11 – Log Analytics 使用情况和成本仪表板\n\n在此页面上，可以了解顶部菜单栏中可用的两个选项：\n\n- **每日上限：** 通过此选项，您可以启用或禁用每天限制\
  \ Log Analytics 工作区中引入数据量的功能。虽然这是限制成本的有效控制手段，但存在一种风险：封顶的数据可能会导致丢失对检测环境中威胁有价值的安全信息。我们建议仅将此项用于非生产环境。\n\
  \n\n\n\n- **数据保留：** 此选项允许您配置日志分析工作区中应保留数据的天数。Log Analytics 的默认天数为 31 天；然而，当在 Log\
  \ Analytics 工作区中启用 Microsoft Sentinel 时，默认免费额度为 90 天。如果您选择将保留期增加到 90 天以上，您将按每 **千兆字节\
  \ (GB)** 每月收取固定费用。\n\n在下一节中，我们将了解如何计算 Microsoft Sentinel 和 Log Analytics 的数据摄取和保留成本。\n\
  \n## 计算数据摄取和保留的成本\n\n许多组织需要将安全日志数据保留超过 90 天，并为其预算，以确保根据业务需求拥有足够的容量。例如，如果我们考虑将数据保留\
  \ 2 年的需求，日均摄取量为 10 GB，那么我们可以计算初始摄取和分析的成本，然后将其与保留成本进行比较。这将为这两个方面提供年度成本估算。\n\n下表显示了将数据摄取到\
  \ Log Analytics 并在 Microsoft Sentinel 中分析该数据的成本。此价格包含 90 天的免费保留：\n\n| | 每日 | 每月\
  \ | 每年总计 | 2 年总计 |\n|---|---|---|---|---|\n| Azure Sentinel | $20 | $600 | $7,200\
  \ | $14,600 |\n| Log Analytics | $23 | $690 | $8,280 | $16,790 |\n| 总计 | $43 | $1,290\
  \ | $15,480 | $30,960 |\n\n图 3.12 – Microsoft Sentinel 示例定价表\n\n下表显示了在摄取 10 GB/天的条件下，超出前述定价中包含的免费\
  \ 90 天后被保留的数据量：\n\n| | 第 91 天 | 第 120 天 | 第 270 天 | 第 330 天 | 第 365 天 | 第 730 天\
  \ |\n|---|---|---|---|---|---|---|\n| 总数据大小 (GB) | 910 | 1,200 | 2,700 | 3,300 |\
  \ 3,650 | 7,300 |\n| 保留成本（每月） | $91 | $120 | $270 | $330 | $365 | $730 |\n\n图 3.13\
  \ – 保留成本示例定价表\n\n现在，如果我们将这些加在一起，就可以看到 12 个月期间解决方案的总成本，如下表所示：\n\n|  | 数据大小 (GB) |\
  \ Log Analytics | Azure Sentinel | 数据保留 | 总成本（每月） |\n|---|---|---|---|---|---|\n\
  | 第 1 个月 | 300 | $690 | $600 | $0 | $1,290 |\n| 第 2 个月 | 600 | $690 | $600 | $0\
  \ | $1,290 |\n| 第 3 个月 | 900 | $690 | $600 | $0 | $1,290 |\n| 第 4 个月 | 1,200 | $690\
  \ | $600 | $120 | $1,410 |\n| 第 5 个月 | 1,500 | $690 | $600 | $150 | $1,440 |\n|\
  \ 第 6 个月 | 1,800 | $690 | $600 | $180 | $1,470 |\n| 第 7 个月 | 2,100 | $690 | $600\
  \ | $210 | $1,500 |\n| 第 8 个月 | 2,400 | $690 | $600 | $240 | $1,530 |\n| 第 9 个月\
  \ | 2,700 | $690 | $600 | $270 | $1,560 |\n| 第 10 个月 | 3,000 | $690 | $600 | $300\
