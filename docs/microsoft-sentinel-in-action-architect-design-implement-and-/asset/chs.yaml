  可以渲染的其他图表包括饼图、面积图和时间图，每种图表可能需要不同数量的列来呈现数据。


  ## Scalar functions


  标量函数接收一个值并对其进行某种操作以返回不同的值。它们对于在数据类型之间进行转换、查看变量的一部分以及执行数学计算非常有用。


  ### The ago() function


  ago() 函数用于从当前 UTC 时间中减去特定时间跨度。请记住，Log Analytics 日志中存储的所有时间均基于 UTC 时间，除非它们是专门设计为不基于
  UTC 的自定义日志中的时间。一般来说，可以安全地假设存储的时间基于 UTC 时间。


  如果我想查找 StormEvents 中结束时间在不到一小时前的事件，我将使用以下命令。请注意，此命令不返回任何值，因为存储的时间来自 2007 年：


  ```

  StormEvents

  | where EndTime > ago(1h)

  ```


  除了使用 h 表示小时外，你还可以使用 d 表示天数等。


  ## String operators


  字符串和数字运算符用于 where 子句中的比较。我们已经看到 ==，它是一个字符串相等运算符。正如我们之前所说，这是一个区分大小写的运算符，这意味着 ABC
  == ABC 为真，但 ABC == abc 为假。


  > Note

  > 你可能需要使用 =~ 进行不区分大小写的比较。在这种情况下，ABC =~ abc 返回 true。虽然有命令可以将文本更改为大写或小写，但最好不要仅为比较而这样做，而是进行不区分大小写的比较。


  以下是可使用的其他字符串运算符：




  | Operator | 描述 | 区分大小写 | 示例（返回 True） | 示例（返回 False） |

  |---|---|---|---|---|

  | == | 等于 | 是 | "One" == "One" | "One" == "ONE" |

  | =~ | 等于 | 否 | "one" =~ "ONE" | "one" =~ "two" |

  | contains_cs | 右侧字符串在左侧字符串中 | 是 | "ONEtwo" contains_cs "ONE" | "ONEtwo" contains_cs
  "one" |

  | contains | 右侧字符串在左侧字符串中 | 否 | "ONEtwo" contains "one" | "ONEtwo" contains "three"
  |

  | startswith_cs | 右侧字符串位于左侧字符串开头 | 是 | "ONEtwo" startswith_cs "ONE" | "ONEtwo" startswith_cs
  "one" |

  | startswith | 右侧字符串位于左侧字符串开头 | 否 | "ONEtwo" startswith "one" | "ONEtwo" startswith
  "two" |

  | endswith_cs | 右侧字符串位于左侧字符串结尾 | 是 | "oneTWO" endswith_cs "TWO" | "oneTWO" endswith_cs
  "two" |

  | endswith | 右侧字符串位于左侧字符串结尾 | 否 | "oneTWO" endswith "two" | "oneTWO" endswith "one"
  |

  | in | 左侧字符串在右侧字符串列表中的一个 | 是 | "one" in ("alpha", "beta", "one") | "ONE" in ("alpha",
  "beta", "one") |

  | in~ | 左侧字符串在右侧字符串列表中的一个 | 否 | "ONE" in ("alpha", "beta", "one") | "TWO" in ("alpha",
  "beta", "one") |


  **表 5.2**


  此外，通过在任何命令前放置 !，该命令将被否定。例如，!contains 表示不包含，!in 表示不在。


  有关运算符的完整列表，请访问 https://docs.microsoft.com/en-us/azure/data-explorer/kusto/query/datatypes-string-operators。

