- "# 第 8 章 创建和使用工作簿\n\n# 创建和使用工作簿\n\nMicrosoft Sentinel 工作簿是一种创建和显示可自定义和交互式报告的方式，可以显示图表、图表和表格。信息可以使用您已经熟悉的相同的\
  \ **Kusto Query Language (KQL)** 查询从 Log Analytics 工作区呈现。这些工作簿基于已与 Azure Monitor\
  \ 和 Log Analytics 工作区等其他 Azure 资源一起使用的 workbook 技术。\n\nMicrosoft Sentinel 提供了多个可直接使用的模板。您可以使用这些模板创建自己的工作簿，然后根据需要进行修改。大多数用于摄取数据的连接器都附带自己的工作簿，以便您更好地了解使用表格和可视化效果（包括条形图和饼图）摄取的数据。您也可以根据需要从头创建自己的工作簿。\n\
  \n在本章中，您将学习以下主题：\n\n- - Workbooks 页面概述\n- - 浏览现有工作簿\n- - 创建工作簿\n- - 编辑工作簿\n\n- -\
  \ 管理工作簿\n- - 工作簿步骤类型\n\n## Workbooks 页面概述\n\n要转到 Workbooks 页面，请从 Microsoft Sentinel\
  \ 导航刀片中选择 Workbooks。会出现一个新屏幕，其外观如下所示的屏幕截图：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_240_0.png)\n\
  \n图 8.1 – Microsoft Sentinel Workbooks 页面\n\n前述屏幕截图中页面顶部的标题显示了 Refresh 和 Add workbook\
  \ 按钮。添加新工作簿将在 添加新工作簿从头开始 部分中讨论。\n\n\n\n\n\n让我们在以下各节中详细讨论工作簿页面的不同组件。\n\n## 工作簿标题\n\
  \n在刷新和添加工作簿按钮下方是已保存的工作簿总数。以下屏幕截图中的数字 9 包括我们在实例上保存的所有工作簿：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_241_0.png)\n\
  \n图 8.2 – 工作簿标题\n\n其右侧是可用的模板总数。随着新的工作簿模板被添加，该数字可能会发生变化。\n\n最右侧是可更新的模板总数。如图 8.1 所示，Azure\
  \ AD 登录日志工作簿有更新可用。如果选择该工作簿，详细信息窗格底部会出现一个按钮，上面写着更新。点击它即可更新工作簿。\n\n> 注意\n> 请注意，这将更新模板以及此模板的已保存版本（如果存在）。这将覆盖对已保存版本所做的任何更改。为避免这种情况，建议的最佳做法是更改从模板保存的工作簿的名称，以便不会被覆盖。\n\
  \n让我们来看一下模板视图。\n\n## 模板视图\n\n工作簿标题下方有两个选项卡，分别是我的工作簿和模板，如以下屏幕截图所示。我的工作簿选项卡将显示用户有权访问的所有工作簿。模板选项卡显示所有可用的模板：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_242_0.png)\n\n图 8.3 – 模板视图\n\n无论选择哪个选项卡，每个模板或报表都将显示在一行上。每个模板的最左侧可能会看到一条垂直的绿色条，表示该模板之前已保存，可以在我的工作簿下查看，或黄色条表示该模板有更新等待中。如果您查看的是我的工作簿选项卡，则每个报表都将具有绿色条，因为每个报表都可供查看，或者如果模板有更新可用，则可能为橙色条。颜色条右侧是创建模板的公司的图标，其后是模板名称，其下是公司的名称。\n\
  \n查看前述屏幕截图中列出的第一个模板，您可以看到亚马逊网络服务（AWS）的图标。其后是模板名称 AWS 网络活动，创建它的公司 MICROSOFT 在模板名称下方。\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_245_0.png)\n\n图 8.7 – 已保存模板按钮\n\n让我们详细讨论这些按钮：\n\
  \n- 如果您已将模板保存为工作簿，显示的第一个按钮将是 **查看已保存工作簿**。这将允许您查看从模板创建的工作簿，包括您对其所做的任何更改。此活动将在本章后面的\
  \ *创建工作簿* 部分中讨论。如果您尚未将模板保存为工作簿，则将显示 **保存** 按钮，如 *图 8.6* 所示。点击它将允许您从模板创建新的工作簿。有关更多信息，请参阅\
  \ *使用模板创建工作簿* 部分。\n- 下一个按钮是 **查看模板**。这将显示您是否已将模板保存为工作簿，如 *图 8.6* 和 *8.7* 所示。这将允许您查看模板。这是对模板的完全交互式视图，虽然您可以执行的操作仅限于刷新模板。您将无法从此视图保存或修改模板。\n\
  - 下一个按钮将取决于您是否已将模板保存为工作簿。如果您已保存模板，则将显示 **删除** 按钮，如 *图 8.7* 所示。点击它将导致出现验证弹出窗口。如果您确认删除，已保存的工作簿，包括您所做的任何更改，将被删除。\n\
  \n**我的工作簿** 选项卡将显示与 **模板** 选项卡相同的信息，只是它只显示从模板保存或从头创建的工作簿。此外，在详细描述窗口底部，按钮已更改。\n\n\
  如果您是从头创建的工作簿，而没有从现有模板创建，则按钮将显示如下屏幕截图所示。由于没有模板可查看，**查看模板** 按钮将不会显示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_245_1.png)\n\
  \n图 8.8 – 从头创建工作簿的按钮\n\n其下是查询部分的第一个示例。这使用 KQL 查询获取数据，然后以不同方式显示。在这种情况下，信息显示为平铺；每列返回一个平铺。\n\
  \n其下是另一个查询部分的示例。在这种情况下，信息显示为表格，但各个列已修改以显示图形信息，而其他列则显示为纯文本。如果您查看从左数起的第二列，它会显示热图以及文本值。第三列，称为趋势，则显示迷你图而不是文本值。\n\
  \n关于这些查询部分还有一个有趣的点需要注意，它们是并排显示的。通常，当向工作簿页面添加新查询时，它将被设置为占据页面的整个宽度。这可以修改，以便各个查询占据所需的多或少的宽度。如果另一个查询可以与第一个查询并排放置，它就会这样做。\n\
  \n请记住，工作簿是交互式的，这意味着它们可以以这样的方式定义，如果您点击一个值，其他值可能会发生变化。在此工作簿中，如果您从前述屏幕截图中显示的按位置登录查询中选择一行，位置登录详细信息将被过滤，仅显示属于所选位置的用户。\n\
  \n工作簿其余部分的部分与已讨论的大致相同。这应该让您了解您可以用工作簿做什么来显示相关信息。\n\n继续查看一些其他可用的工作簿模板，看看还能做什么。记住：您可以直接点击模板并查看提供的报表，以了解工作簿的外观。您会看到可以显示条形图、饼图、面积图等。\n\
  \n现在您知道如何查看现有工作簿以了解其工作原理，让我们来看一下如何创建自己的工作簿。\n\n## 创建工作簿\n\n现在您对工作簿可以做什么有了一些了解，是时候看看如何创建自己的工作簿了。有两种方法可以做到这一点：\n\
  \n- 使用工作簿模板\n- 从头创建\n\n无论哪种方式，我们都会得到一个可用的工作簿；然而，您可能会发现一开始从模板创建工作簿更容易，以便更好地了解工作簿的功能以及您可以做的事情。您完全可以使用从模板创建的工作簿中的查询作为起点来创建自己的工作簿，原因无他。\n\
  \n要能够创建新工作簿，您需要拥有适当的权限。请参阅 https://docs.microsoft.com/en-us/azure/sentinel/roles#roles-and-allowed-actions\
  \ 以查看创建和编辑工作簿所需的权限。\n\n### 使用模板创建工作簿\n\n以下步骤展示了如何使用模板创建工作簿。这使得创建新工作簿变得更容易，因为它为您提供了一个起点：\n\
  \n1. 在查看模板的详细信息页面时，点击保存按钮。\n2. 一个弹出窗口，如以下屏幕截图所示，将询问您要使用哪个位置来保存新工作簿。选择适当的位置。这应与您的\
  \ Log Analytics 工作区所在位置相同，以避免出口费用：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_249_0.png)\n\
  \n图 8.10 – 选择工作簿位置\n\n3. 点击确定。这将在我的工作簿下创建一个新的工作簿，其名称与模板相同。\n\n您现在知道如何使用模板作为基线创建工作簿。这是一种非常简单的方法，可以创建一个工作簿，然后根据需要进行修改。接下来，我们将讨论如何从头创建工作簿，而不使用模板作为基线。\n\
  \n\n\n\n\n| Name | Description |\n|---|---|\n| Title | 工作簿的名称。应描述得足够清晰，以便用户能够轻松判断将显示何种信息。\
  \ |\n| Subscription | 选择此工作簿所在的订阅。它应与您的 Log Analytics 工作区相同。 |\n| Resource group\
  \ | 选择此工作簿所在的资源组。它是否与您的 Log Analytics 工作区位于同一资源组并不重要。例如，您可以为 Microsoft Sentinel\
  \ 实例的所有资源创建一个资源组，或仅为工作簿创建一个资源组，或两者结合。如果适用，请遵循贵公司关于放置项目的标准。 |\n| Location | 选择工作簿所在的区域。您希望将其与\
  \ Log Analytics 工作区设为同一区域，以避免产生出站费用。 |\n\nTable 8.1\n\n下面有一个复选框，标签为 Save content\
  \ to an Azure Storage Account。如果您需要保护工作簿中存储的信息，可以通过将工作簿内容保存到 Azure 存储帐户来保护它。请参阅本章末尾的\
  \ Further reading 部分，其中包含有关如何执行此操作的链接。\n\n- 4. 点击 **Save** 保存工作簿。\n\n**Note**\n\n\
  实际上，您在编辑新工作簿之前并不一定需要保存它。通常建议您这样做，以确保您拥有可恢复的已保存副本，以防编辑未按预期工作。\n\n就这样。现在，您需要编辑工作簿，以便可以编辑或删除现有步骤，或添加自己的新步骤。请参阅下一节，我们将在其中介绍可以对工作簿进行修改的更多详细信息。\n\
  \n## Editing a workbook\n\n您有时需要编辑工作簿。正如您在上一节中看到的，您需要编辑从头创建的工作簿以添加所需内容。您也可以编辑从模板创建的工作簿以使其符合您的需求。\n\
  \n如果您尚未查看工作簿，则首先需要查看它。如果您已在查看工作簿，则可以跳过下一步，直接进入编辑部分。\n\n要编辑工作簿，请执行以下步骤：\n\n- 1. 转到\
  \ **My workbooks** 或 **Templates** 选项卡。\n- 2. 选择相关的工作簿。\n- 3. 然后，在工作簿的详细信息窗格中选择\
  \ **View saved workbook** 按钮。\n\n> **Note**\n> 您不能直接编辑工作簿模板。必须先保存它，然后才能编辑已保存的工作簿。如果您是从头创建的工作簿，则必须转到\
  \ **My workbooks** 选项卡，因为这些工作簿不是从模板创建的，仅会显示在那里。\n\n页面顶部有一个包含按钮的标题，如下所示。我们在本节中关心的按钮是左侧第一个，名为\
  \ Edit：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_252_0.png)\n\nFigure 8.13 –\
  \ Saved workbook header bar\n\n下表简要描述了每个按钮：\n\n| Icon | Name | Description |\n|---|---|---|\n\
  |  | Done Editing | 此按钮将从编辑模式切换到查看模式。所有单独的编辑按钮将消失。 |\n|  | Open | 打开另一个仪表板。请参阅 *Managing\
  \ workbooks* 部分了解更多信息。 |\n|  | Save | 保存对该工作簿所做的所有更改。 |\n|  | Save as | 使用另一个名称保存此工作簿。\
  \ |\n|  | Settings | 允许您更改此工作簿的一些高级设置，包括资源、样式、标签和受信任主机。这些主题的讨论超出了本章的范围。 |\n|  |\
  \ Revert changes | 丢弃任何更改并恢复到上次保存的版本。 |\n|  | Refresh | 刷新页面。这将重新计算页面上的任何查询。 |\n\
  |  | Share | 允许您直接与他人共享此工作簿。这将打开一个窗格，其中包含 URL，您可以复制并发送给他人。请注意，工作簿必须属于 Shared Workbooks\
  \ 组后才能共享它。如果工作簿未共享，则在共享之前会提示您将其移至 Shared Workbooks。 |\n|  | Show pin options | 这将打开固定选项，您可以在其中将整个工作簿固定到仪表板，或将每个可固定的部分固定到仪表板。\
  \ |\n|  | Advanced editor | 切换屏幕以显示自动生成的 JSON 或 Azure Resource Manager (ARM) 代码。请参阅\
  \ *Advanced editing* 部分了解更多信息。 |\n|  | Feedback | 这允许您向 Microsoft 提供有关工作簿的反馈。这与在\
  \ Azure 门户其余部分的工作方式相同。 |\n| ? Help | Help | 在另一个选项卡中打开 Microsoft 工作簿文档页面。 |\n\n\
  Table 8.2\n\n如果您查看正在编辑的工作簿的底部，您将看到与以下屏幕截图相匹配的链接列表。这就是您添加新步骤的方式，每个步骤将在 *Workbook\
  \ step types* 部分中单独描述：\n\nAdd text | Add query | Add metric | Add parameters | Add\
  \ links/tabs\n\nFigure 8.16 – Edit mode add links\n\n完成所有更改后，点击标题栏中的 **Done Editing**\
  \ 按钮以恢复到查看模式。所有单独的编辑按钮将消失，已设置为隐藏的任何步骤、参数或列也将消失。\n\n查看您的工作簿，确保刚刚所做的编辑按预期工作。一旦对更改感到满意，请点击\
  \ **Save** 按钮保存更改。\n\n## Advanced editing\n\n虽然工作簿的编辑 **graphical user interface\
  \ (GUI)** 允许您完全创建和编辑 Microsoft Sentinel 工作簿，但有时您可能需要直接在代码中调整设置。您可能还希望获取 ARM 模板，这将允许您在其他位置轻松复制此工作簿或将其作为\
  \ DevOps 流程的一部分存储。\n\n在任何一种情况下，点击 **Advanced Editor** 按钮都允许您执行此操作。点击该按钮后，您将被带到高级编辑器的\
  \ **Gallery Template** 视图，如以下屏幕截图所示。此视图允许您直接修改 JSON 代码。完成更改后，点击 **Apply** 按钮应用更改，或点击\
  \ **Cancel** 按钮返回 GUI 而不保存更改：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_255_0.png)\n\
  \nFigure 8.17 – Advanced Editor – Gallery Template view\n\n下面是所有工作簿的列表。点击任何工作簿将更改您正在查看的工作簿。\n\
  \n每个工作簿将显示在单独的行中。它将显示名称，然后是一个图标，显示工作簿是否已从模板创建，然后是一个上下文相关菜单。点击上下文相关菜单图标将显示如图 8.20\
  \ 所示的菜单。\n\n此菜单允许您删除此工作簿，重命名它，将其移至 **Shared reports**（或如果此工作簿已共享，则允许您将其移至 **My reports**），与他人共享它（或如果它不是\
  \ **shared report**，则在共享之前会要求您使其成为 **shared report**），并将其固定到仪表板，这提供了直接访问此工作簿的快捷方式。所有这些都可以在以下屏幕截图中看到：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_258_0.png)\n\nFigure 8.20 – Managing\
  \ the workbook context menu\n\n我们已经完成了对如何管理现有工作簿的介绍。您已了解 Saved Workbooks 窗格，以及上下文相关菜单，该菜单允许您对工作簿执行各种管理任务。现在，是时候查看构成工作簿的各个部分以及如何使用它们了。\n\
  \n## Workbook step types\n\n每个工作簿由一个或多个步骤组成。如前所述，工作簿由称为步骤的小节组成。每个步骤都有一个唯一名称，可以是几乎任何内容，并且该名称可以在其他步骤中引用。每个步骤都可以独立运行，尽管有些可能需要参数，无论是从参数步骤还是从其他步骤获取。\n\
  \n共有六种不同类型的步骤：text、query、metric、parameters、links/tabs 和 groups。每种类型的步骤将在以下各节中更详细地讨论。\n\
  \n要在编辑工作簿时添加新步骤，屏幕底部是 +Add 按钮，点击后将显示步骤类型的列表，如以下屏幕截图所示。点击您希望添加的步骤类型的相应选项：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_259_0.png)\n\
  \nFigure 8.21 – Edit mode Add option\n\n无论点击哪个链接，步骤底部都将有一系列选项，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_259_1.png)\n\
  \nFigure 8.22 – Edit mode add options after adding a step\n\n点击 Done Editing 按钮将所选步骤更改为查看模式，以便您可以查看更改的外观。\n\
  \n点击 Add 按钮添加新步骤。\n\n\n\n\n**时间范围**下拉框如下所示：\n\n- 在查询中设置\n- 最近30分钟\n- 最近1小时\n- 最近4小时\n\
  - 最近12小时\n- 最近24小时\n- 最近48小时\n- 最近3天\n- 最近7天\n- 最近30天\n- 自定义\n- Time Range Pa...\n\
  - TimeRange\n\n图8.25 – 时间范围下拉框\n\n- **可视化**下拉框决定输出的显示方式。这些值之前已经讨论过，但另一个可用的选项是**在查询中设置**。如果选择了此值，则意味着代码本身已通过`render`命令决定了如何可视化数据。\n\
  - **大小**下拉框用于确定步骤将占用的垂直空间大小，其值显示在以下截图中。选择最适合你的值，并注意实际空间大小可能因所选可视化类型的不同而有所变化：\n\n\
  - 极小\n- 小\n- 中\n- 大\n- 全尺寸\n\n图8.26 – 可用大小\n\n另一个有用的选项是**隐藏**。选择此项将导致该列不显示在网格中。有时你可能需要保留该列，但不想显示它。将列的渲染器设置为**隐藏**即可实现这一点。详细说明如何使用这些不同的渲染器超出了本书的范围，但可以查看**Azure\
  \ AD登录日志**工作簿来了解如何使用**热图**和**迷你趋势线**。\n\n在标题栏下方是**Log Analytics工作区日志查询**区域。你可以在此处输入要运行的\
  \ KQL 查询。在此屏幕的右侧有三个图标，如下所示：\n\n查询帮助\n\n图8.27 – 查询步骤结果按钮\n\n以上按钮列表的说明如下：\n\n- **查询帮助**图标将打开一个新标签页，并带你进入一个讨论如何编写\
  \ KQL 查询的页面。\n- 它旁边的图标将在同一标签页中打开**日志**页面，并加载你在**Log Analytics工作区日志查询**区域中的查询。如果你在使用查询时遇到问题并需要找出问题所在，这将会很有用。\n\
  - 最后一个图标只会在你运行查询后出现。它允许你将结果导出到 Excel 以进行进一步处理。\n\n直接位于**Log Analytics工作区日志查询**区域下方的区域是结果显示的位置。它们将根据在**可视化**下拉框中选择的值进行显示。运行我们之前使用的\
  \ Heartbeat 查询，然后更改**可视化**下拉框中的值，看看该区域如何变化。\n\n## 指标\n\n指标步骤允许你查看不同 Azure 资源上的指标。这种步骤类型在\
  \ Microsoft Sentinel 中不太常用，因此本章不讨论它。有关如何使用指标步骤的更多信息，请参阅 https://docs.microsoft.com/en-us/azure/azure-monitor/app/usage-workbooks#adding-metrics-sections。\n\
  \n## 参数\n\n尽管查询步骤是 Microsoft Sentinel 工作簿的中坚力量，但如果没有参数，工作簿也不会如此有用。一个无法更改任何输入的工作簿还不如一张图片，而非一个你可以通过操作以不同方式查询结果的交互式工作簿。\n\
  \n参数有两种类型：一种是在参数步骤中设置的参数，我们将在本节讨论；另一种是在查询步骤中选择某个项目时填充的参数，将在本章后面的“高级设置”部分讨论。\n\n\
  当你单击“添加参数”链接时，将看到以下屏幕。请注意，截图中已删除大量空白区域，以便显示全部内容：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_266_0.png)\n\
  \n图8.28 – 新建参数步骤\n\n输入参数后，它们将显示在表格中，每行一个参数，如下面的截图所示。你可以选中单个复选框来编辑单个参数的所有设置。你也可以直接在此屏幕上更改“必需？”、“参数名称”和“显示名称”字段。屏幕会显示“参数类型”和“说明”字段，但你不能在此屏幕上编辑这些字段。有关这些字段的说明，请参阅“添加新参数”部分：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_266_1.png)\n\n图8.29 – 带示例参数的参数步骤\n\n\
  ## 参数类型\n\n共有七种不同的参数类型：\n\n- 文本\n- 下拉列表\n- 时间范围选择器\n- 资源选择器\n- 订阅选择器\n- 资源类型选择器\n\
  - 位置选择器\n\n每种类型的工作方式都不同，并且选择后可能会在“新建参数”窗格中显示额外字段。例如，“文本”类型非常基础，将显示一个用于输入的文本框；而“下拉列表”类型将显示\
  \ KQL 窗口，以便通过查询填充其值；还会出现一个新字段，询问是否允许进行多项选择。具体讨论如下：\n\n- 文本：这是基本的参数类型。它允许你输入文本——例如电子邮件地址——然后可用于过滤其他查询。\n\
  - 下拉列表：下拉列表类型允许你输入 KQL 查询或 JSON 字符串，为下拉框提供选项。此类型还有五个附加字段：\n\n| 名称 | 描述 |\n|---|---|\n\
  | 允许多选 | 如果选中，用户可以从下拉框中选择多个条目。 |\n| 限制多选 | 如果选中，这将设置用户可以从下拉框中选择条目的上限数量。将出现另一个字段，用于输入上限数值。\
  \ |\n| 分隔符 | 如果允许多选，这是用于区分一个条目与另一个条目的分隔符。 |\n| 引用符号 | 如果允许多选，这是包裹每个条目开头和结尾的字符。 |\n\
  | 包含在下拉框中 | 如果选中“任意一个”复选框，则此参数将不会用于过滤。 |\n\n## 预览部分\n\n“新建参数”面板的第二部分位于屏幕底部，显示变量的显示方式以及在代码中使用变量的预览。以下截图显示了一个未填写任何值的参数：\n\
  \n预览\n编辑时，你的参数将如下所示：\n<unnamed>：输入值\n不编辑时，你的参数将如下所示：\n<unnamed>：<unset>\n在查询或文本项中替换时，{<unnamed>}将变为：\n\
  {<unnamed>} ==> `\n{<unnamed>:label} ==> <unset>\n{<unnamed>:value} ==> \"\n\n图8.34\
  \ – 新建参数屏幕 – 预览部分\n\n最后一部分非常重要，因为它展示了如何在代码中使用该变量。这是参数名称（而非显示名称），用花括号 { } 括起来。\n\n\
  ## 链接/选项卡\n\n链接/选项卡步骤允许你以不同格式或选项卡形式显示链接。这允许你打开新网站以显示更多信息、显示所选单元格的详细信息，或显示不同的选项卡。\n\
  \n当你单击“添加链接/选项卡”按钮时，将添加一个新步骤，如下所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_272_0.png)\n\
  \n图8.35 – 新建链接/选项卡步骤\n\n此屏幕允许你添加、编辑、删除或更改已添加链接的顺序。请记住，就工作簿而言，选项卡是以不同方式显示的链接。\n\n\
  **更新链接**按钮将使用编辑过程中所做的任何修改来更新链接。**样式**下拉框将更改链接在列表中的显示方式。下表显示了不同样式如何影响链接的显示：\n\n|\
  \ 显示名称 | 示例 |\n|---|---|\n| 项目符号列表 | • 第一个链接\n• 第二个链接\n• 第三个链接 |\n| 列表 | 第一个链接\n\
  第二个链接\n第三个链接 |\n| 段落 | 第一个链接 第二个链接 第三个链接 |\n| 导航 | 第一个链接 \\| 第二个链接 \\| 第三个链接 |\n\
  | 选项卡 | 第一个链接 第二个链接 第三个链接 |\n\n表8.5\n\n其余标题按钮如下所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_273_0.png)\n\
  \n图8.36 – 链接/选项卡步骤标题按钮\n\n\n\n头部按钮按从左到右的顺序说明如下：\n\n- **复制**按钮将创建所选链接的副本。\n- **插入**按钮将在所选行上方插入一个空行，以便创建新链接。\n\
  - **上移**和**下移**按钮分别允许将链接在列表中向上和向下移动。\n- **移至顶部**和**移至底部**按钮分别将链接移至列表顶部或底部。\n- **删除**按钮将删除链接。\n\
  \n我们来看看如何添加新链接。\n\n## 添加新链接\n\n要添加新链接，请在列表中显示的空行中输入信息。\n各个字段说明如下：\n\n- **链接前文本**：在**链接前文本**文本框中输入的信息将显示在实际链接之前。如果所选**样式**为**选项卡**，则此字段不显示。\n\
  - **链接文本**：**链接文本**是将要显示的URL的实际文本。\n- **链接后文本**：在**链接后文本**文本框中输入的信息将显示在实际链接之后。如果所选**样式**为**选项卡**，则此字段不显示。\n\
  - **操作**：这是选择链接时将执行的操作。有许多不同的条目可供选择，但本章我们只介绍**Url**、**设置参数值**和**滚动到步骤**。根据选择的值不同，**设置**字段上可能会显示一个按钮或文本框以提供更多信息，但这些字段的简要说明见下表：\n\
  \n## 组\n\n组允许将多个控件视为一个单元。当需要对多个步骤执行相同任务（例如，设置条件可见性设置）时，这将使操作更加容易。\n\n当您单击“添加组”按钮时，将添加一个新窗口，如以下屏幕截图所示：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_276_0.png)\n\n图8.38 – 新组\n\n有两种不同的组类型：**可编辑**和**来自模板**。**可编辑**组类型是默认类型，允许您在此工作簿中对组进行所有更改。\n\
  \n如果选择**来自模板**，则会要求您提供模板ID，即工作簿的资源ID。您可以通过转到工作簿的资源组，选择相关工作簿，然后选择“概述”页面中显示的资源ID来获取此ID。\n\
  \n如果您有多个工作簿可能使用相同的步骤分组，则可以使用此设置，以避免每次都要创建这些步骤。请记住，如果您想对模板进行更改，则必须转到模板进行实际更改，并且这将影响所有使用此模板的工作簿。\n\
  \n**加载**类型将确定何时加载该组。有关这些值，请参阅下表：\n\n| 名称 | 描述 |\n|------|-------------|\n| 延迟 |\
  \ 该组仅在屏幕上可见时才会加载。这可以加快初始加载速度，但在首次显示该组时会有延迟。 |\n| 显式 | 将出现一个**加载更多**按钮，并且在该按钮被点击之前，该组不会加载。这使您可以更好地控制组何时加载，但需要手动执行加载该组的步骤。\
  \ |\n| 始终 | 该组将在工作簿打开时加载。这与**延迟**选项相反，它可能会减慢工作簿的初始加载速度，但显示该组时不会有延迟。 |\n\n表8.7\n\n\
  还有一个名为**编辑组**的链接，允许您在另一个窗口中打开该组以进行编辑。如果您有很多步骤，这很有用，可以更轻松地仅查看属于该组的那些步骤。完成编辑后，您可以关闭窗口返回主编辑屏幕。请注意，仅当组内至少有一个步骤时，此按钮才会变为活动状态。\n\
  \n值得注意的是，如果删除一个组，您也会删除该组内的所有步骤。\n\n现在，让我们在下一节中看看如何添加新选项卡。\n\n## 添加新选项卡\n\n添加新选项卡时，需要将标题中的**样式**字段设置为**选项卡**。将仅显示**选项卡名称**、**操作**、**值**、**设置**和**上下文窗格**字段。您不能设置任何文本在选项卡之前或之后显示。\n\
  \n> **注意**\n> \n> 您完全可以使用其他任何样式来实现与**选项卡**条目相同的效果。**选项卡**样式旨在最大限度地减少创建选项卡界面所需的工作量，包括隐藏不需要的字段，以及更改链接的显示方式，使其看起来像传统的选项卡式界面。\n\
  \n- **选中项目时导出参数**：如果选中此项，则在此步骤中选中某个项目时，参数将设置为相应的值。这可以实现诸如根据状态过滤用户列表等功能。如果选中此项，其下方将显示一个新按钮，称为**添加参数**。点击该按钮将打开一个新窗口，您可以在其中设置参数，如以下屏幕截图所示：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_280_0.png)\n\n图8.41 – 高级设置 – 添加要导出的新参数\n\
  \n**要导出的字段**用于指定查询中用于填充参数值的字段名称。**参数名称**用于指定参数的名称，**参数类型**用于指定参数的类型。在本书中，我们将始终使用文本、整数、日期/时间和布尔值。\n\
  \n您可以同时导出多个参数。请记住在查询中使用该参数时，用括号{ }将参数名括起来。\n\n- **不编辑时显示查询**：如果选中此项，KQL查询将始终显示。这通常不是一个好主意，因为它可能会让普通用户感到困惑。\n\
  \n以上我们讨论完了步骤的高级设置。如您所见，这些设置允许您执行许多操作，包括指定步骤何时可见、导出工作簿中其他步骤可以使用的变量，以及确定步骤将占据页面宽度的多少。\n\
  \n## 总结\n\n在本章中，您了解了Microsoft Sentinel工作簿，以及如何使用其交互式显示向用户展示信息。工作簿可用于帮助确定您的环境中是否有需要调查的内容。\n\
  \n您学习了如何使用提供的各种步骤类型创建和编辑新工作簿。您学习了如何使用新步骤定义参数，以及如何从查询中获取参数，并如何使用这些参数进一步过滤查询。\n\n\
  它们可以显示文本、各种图表、指标和链接（包括选项卡）的组合。使用参数，我们可以更改工作簿中呈现的信息，以帮助确定是否存在需要调查的事件。\n\n最后，您学习了如何更改步骤的高级设置以修改其操作方式和外观。您学习了如何让多个步骤在图表中显示在同一行，以及一个图表如何通过参数与另一个图表通信。\n\
  \n在下一章中，您将了解Microsoft Sentinel事件（由警报和其他查询生成），以及如何管理和调查这些事件。\n\n## 问题\n\n- 1. 创建新工作簿的两种方法是什么？\n\
  - 2. 如果我想向用户展示如何使用工作簿的说明，应该使用哪种最佳步骤类型？\n- 3. 如果我想允许工作簿的用户更改工作簿中每个查询回顾的时间范围，我需要采取哪两个操作？（提示：第二个操作需要在每个查询步骤上执行。）\n\
  - 4. 是否可以让工作簿步骤仅在满足某些条件时显示？\n- 5. 如何让同一工作簿中的两个步骤并排显示？\n\n\n\n"
- "# 9 事件管理\n\n在第 7 章《创建分析规则》中，你学习了分析规则如何在分析中创建事件。这些事件可能代表环境中潜在的问题，需要查看以确定它们是否确实是问题。它们是误报、与环境无关，还是实际问题？确定方法是通过事件管理。\n\
  \n事件管理没有一成不变的规则，除了查看事件并确定它们是否是实际问题之外。实现这一点的方法有很多，本章将介绍 Microsoft Sentinel 提供的用于执行这些调查的选项，包括事件的图形表示、查看事件的完整详细信息以及运行其他查询以获取更多信息。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 使用 Microsoft Sentinel 事件页面\n- 探索完整详细信息页面\n- 调查事件\n\n### 使用\
  \ Microsoft Sentinel 事件页面\n\n要查看 Microsoft Sentinel 事件页面，请单击左侧导航面板中的事件链接。这将带你进入事件页面，如以下屏幕截图所示。实际数字和列出的事件当然可能不同：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_286_0.png)\n\n图 9.1 – Microsoft Sentinel\
  \ 事件页面\n\n页面已被划分为标题栏、摘要栏、搜索和筛选部分、事件列表以及事件详细信息窗格。这些部分将在后面详细介绍。\n\n### 标题栏\n\n页面顶部如以下屏幕截图所示的标题栏，具有通常的刷新按钮和时间跨度下拉选项。还有一个名为操作\
  \ 的按钮：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_286_1.png)\n\n图 9.2 – 事件页面的标题栏\n\
  \n**操作** 按钮将允许你对多个事件同时执行操作，包括更改严重性、分配所有者、更改状态和添加标签。有关更多信息，请参阅 *使用操作按钮* 部分。\n\n右侧是\
  \ **安全效率工作簿** 按钮。单击它将带你进入安全运营效率工作簿，它将为你提供事件的总体概述，包括它们创建的时间线、事件的关闭分类（如有）、按严重性、所有者、状态等的细分，以及更多信息。\n\
  \n**列（预览）** 链接将允许你选择在视图中显示哪些列。这将允许你自定义事件页面的视图，并且更改将保留。有关所有列的列表，请参阅本章的 *事件列表* 部分。\n\
  \n最右侧是 **指南和反馈** 按钮。单击它将打开一个窗格，其中包含有关事件的一些指南，并允许你与 Microsoft 共享有关 **事件** 页面的反馈。\n\
  \n### 摘要栏\n\n标题栏下方是如以下屏幕截图所示的摘要栏。这显示了未解决事件的总数、新事件的数量以及正在进行的事件的数量：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_287_0.png)\n\
  \n图 9.3 – 事件页面的摘要栏\n\n摘要栏右侧是按严重性划分的未解决事件列表。通过查看事件的两种不同摘要，你可以了解事件的分布情况。\n\n### 搜索和筛选部分\n\
  \n摘要栏下方是搜索和筛选部分。在这里，你可以筛选在所有事件列表中看到的结果：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_287_1.png)\n\
  \n图 9.4 – 事件页面的筛选部分\n\n让我们查看搜索和筛选部分下的所有参数：\n\n- **按 ID、标题、标签、所有者或产品搜索：** 此筛选器允许你输入搜索词以查找特定事件。这可以是事件标题中出现的文本或事件\
  \ ID 号码。\n\n> **重要说明**\n>\n> 如果按 ID 号码搜索，输入的值必须与事件的 ID 号码完全匹配。\n\n你还可以按构成事件显示的各个字段进行筛选，如下所述。如你所见，你可以按\
  \ **严重性、状态、产品** 名称（哪个产品生成了事件）和/或 **所有者**（分配给事件的人员）进行筛选。\n\n- **严重性：** 此筛选器允许你选择一个或多个\
  \ **全选**、**信息**、**低**、**中**、**高** 和/或 **严重**。默认情况下选择 **全选**，在摘要栏中显示为仅 **全部**，如前面的屏幕截图所示。\n\
  - **状态：** 此筛选器允许你选择一个或多个 **全选**、**新建**、**进行中** 或 **已关闭**。默认情况下仅选择 **新建** 和 **进行中**\
  \ 值。\n- **产品名称：** 此筛选器允许你选择一个或多个 **全选**、**Defender for Cloud Apps**、**Microsoft\
  \ Defender**、**Defender for Identities**、**Microsoft Information Protection**、**Defender\
  \ for Endpoint**、**Defender for IoT**、**Defender for Office 365**、**Microsoft 365\
  \ Defender** 和/或 **Microsoft Sentinel**。默认情况下选择 **全选**，在摘要栏中显示为仅 **全部**，如前面的屏幕截图所示。\n\
  \n> **其他产品**\n>\n> 随着 Microsoft 将更多安全相关产品添加到 Azure，并且在 Microsoft Sentinel 中添加基于这些产品创建警报规则的能力，预计此列表将扩展以包含它们。\n\
  \n- **所有者：** 此筛选器允许你选择一个或多个人员进行筛选。由于任何人都可以成为事件的所有者，实际列表太长，这里不会列出值。请注意，有一些特殊条目，包括\
  \ **所有用户** 和 **分配给我**。**所有用户** 将显示分配给任何人的事件，包括未分配的事件。**分配给我** 将仅显示分配给当前登录用户的事件。\n\
  \n### 全选 / 所有用户\n\n筛选器部分中的 **全选 / 所有用户** 条目是一个快捷方式，允许你一次选择列表中的所有条目，而无需逐一选择。取消选择它将取消选择所有单个条目，然后可以逐个选择。\n\
  \n搜索和筛选部分对于查找特定事件非常有用。你可以使用这些功能帮助你快速定位事件，尤其是在列表很长时，特别是如果你只需要查看分配给你的事件。接下来，我们将讨论当你找到想要的事件时该怎么做。\n\
  \n### 事件列表\n\n搜索和筛选部分下方是每个事件的列表，每行一个，如以下屏幕截图所示。在这里，你可以看到事件的摘要，包括事件 ID、标题、构成事件的警报数量、创建事件的产品名称、创建日期和时间、所有者和状态：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_289_0.png)\n\n图 9.5 – 事件列表\n\n最左侧是一个复选框。此复选框用于表示你想要对该事件执行操作。有关更多信息，请参阅使用操作按钮部分。你也可以选中此部分顶部的全选复选框以一次选择所有事件。\n\
  \n之后是一个彩色条。彩色条表示事件的严重性：高为红色，中为橙色，低为黄色，信息为灰色。\n\n其余字段在下表中描述：\n\n| 名称 | 描述 |\n| ---\
  \ | --- |\n| 事件 ID | 这是公开显示的事件的 ID 号码。 |\n| 标题 | 事件的标题。这将与生成它的警报规则的名称相匹配。 |\n| 警报\
  \ | 创建此事件的警报数量。 |\n| 产品名称 | 生成此事件的产品名称。 |\n| 创建时间 | 此事件创建的时间。 |\n| 最后更新时间 | 此事件最后更新的时间。\
  \ |\n| 所有者 | 拥有此事件的人员姓名。 |\n| 状态 | 事件的状态。 |\n| 标签 | 与事件关联的任何标签。 |\n| 战术 | 与此事件关联的任何\
  \ MITRE ATT&CK 战术。 |\n| 关闭原因 | 如果此事件已关闭，关闭原因将显示在此处。 |\n| 分析规则名称 | 创建此事件的分析规则的名称。\
  \ |\n| 事件团队 | 已创建用于调查此事件的 Microsoft Teams 团队的名称。 |\n\n表 9.1\n\n你可以按事件 ID、标题、创建时间、最后更新时间、所有者和状态字段进行排序。单击任何这些字段将按升序对列表进行排序。再次单击将更改排序为降序。\n\
  \n每个事件在列表中都有自己的行及其自己的属性，正如我们刚才看到的那样。你可以使用其中大多数属性对行进行排序，以帮助你找到想要的事件。接下来，我们将查看事件详细信息窗格，它将提供有关所选事件的更多信息。\n\
  \n\n\n\n\n## 事件详细信息窗格\n\n当你从列表中选择任何事件时，事件详细信息窗格将打开，其中显示有关所选事件的更多信息。当然，显示的信息会因你选择的事件而不同：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_291_0.png)\n\n图 9.6 – 事件详细信息页\n\n页面顶部是标题，事件编号直接显示在其下方。标题左侧有一条彩色条带，表示事件的严重程度：红色表示高，橙色表示中，黄色表示低，灰色表示信息。\n\
  \n在这几个下拉菜单下方是事件的描述。这提供了有关事件的更多详细信息，可能包括事件正在查找的内容、如何确定事件，甚至外部链接以获取更多信息。\n\n在其下方是创建此事件的产品名称，位于\
  \ Alert product names 标题下。此信息很有用，因为它可以帮助你判断 Microsoft Sentinel 中是否存储了更多信息。如果此事件来自另一个\
  \ Azure 安全产品，那么在 Microsoft Sentinel 中可能不会有太多额外信息，甚至没有。\n\n其下是 Evidence 部分。在这里你会找到此事件中的事件数、警报数和书签数。如图\
  \ 9.6 所示，所查看的事件有 24 个事件、24 个警报和 0 个书签。点击其中任何一项即可获取更多信息。\n\n向下滚动详细信息窗格，我们会找到 最后更新时间、创建时间、实体、策略、事件工作簿链接、分析规则链接\
  \ 和 标签，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_294_0.png)\n\n图 9.10\
  \ – 事件详细信息页续\n\n正如你所期望的，**创建时间** 和 **最后更新时间** 字段显示事件的创建时间以及最后更新时间。\n\n**实体** 部分显示与此事件关联的一些实体。请记住，在创建分析规则时它们需要被映射，并且至少要填入一个，以便\
  \ **调查** 链接启用，该链接在下图中描述。点击 **查看完整详细信息** 链接即可查看有关事件的所有信息。有关更多信息，请参阅以下 *实体选项卡* 部分。\n\
  \n**策略** 部分显示与此事件关联的 MITRE ATT&CK 策略。图标和文本均用于描述各种策略。\n\n**事件工作簿** 链接将带你进入事件概览工作簿，在那里你可以获取有关事件的额外信息，包括关闭类似事件的原因、此事件发生的所有活动日志以及所有评论。\n\
  \n**分析规则** 链接将带你进入创建此事件的分析规则。这将允许你查看分析规则中使用的查询和其他参数。\n\n**标签** 部分将显示与此事件关联的所有标签（如果有）。点击\
  \ + 按钮即可添加新标签。\n\n再次向下滚动，我们会找到 **事件链接** 和 **最后评论**，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_296_0.png)\n\
  \n图 9.11 – 事件详细信息页续\n\n**事件链接** 字段提供了一个 URL，你可以将其提供给他人，该链接将直接带他们进入事件的完整详细信息页，见 *探索完整详细信息页*\
  \ 部分。这使得访问事件变得更容易，因为该人员无需遍历 Azure 门户的菜单然后再搜索它。\n\n页面底部是已添加到事件的最后一条评论。**最后评论** 字段右侧是与此事件关联的评论总数。点击该数字将带你进入完整详细信息页中的\
  \ **评论** 选项卡，见 *评论选项卡* 部分的更详细说明。要添加新评论，请在 **写评论** 文本框中输入文本，然后点击右侧的 **提交** 按钮。它看起来像一个指向右侧的箭头。\n\
  \n**查看完整详细信息** 按钮将打开完整详细信息页，将在 *探索完整详细信息页* 部分中讨论。\n\n**操作** 按钮（不要与页眉中的 **操作** 按钮混淆）将显示以下操作：\n\
  \n| 名称 | 描述 |\n|---|---|\n| 调查 | 这将打开图形化事件调查页面。有关更多信息，请参阅以下 *调查事件* 部分。 |\n| 创建自动化规则\
  \ | 这将允许你为此事件类型创建特定的自动化规则。有关更多详细信息，请参阅 *第 11 章，创建剧本和自动化*。 |\n| 创建团队 | 这将允许你创建 Microsoft\
  \ Teams 团队以促进此事件的调查。此功能的使用超出了本书的范围。 |\n\n表 9.2\n\n现在你已经了解了如何查看和更新单个事件，让我们看看如何同时更新多个事件。这是通过使用页面页眉中的\
  \ **操作** 按钮完成的。\n\n## 使用操作按钮\n\n你刚刚学习了如何更改单个事件。如果需要同时更改多个事件怎么办？页眉栏中的 **操作** 按钮将允许你这样做。\n\
  \n**操作** 按钮将允许你同时对多个事件进行更改。回顾 *图 9.2* 中的页眉，你会看到 **操作** 按钮。此按钮将允许你在多个选定的事件上执行相同的操作。\n\
  \n首先，在所有事件的列表中，选择要在其上执行操作的事件左侧的复选框。你也可以选择 **全选** 复选框以选择列表中显示的所有事件。\n\n## 探索完整详细信息页\n\
  \n完整详细信息页显示有关事件的更多信息，远不止事件列表和事件详细信息窗格中显示的信息。附加信息包括构成事件的警报的详细信息、与此事件关联的任何书签、此实体中任何实体的详细信息以及添加到此事件的任何评论。\n\
  \n点击事件详细信息窗格中的 查看完整详细信息 按钮将带你进入事件的完整详细信息页，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_299_0.png)\n\
  \n图 9.13 – 事件完整详细信息页\n\n页面的左侧将显示我们在 事件详细信息窗格 部分中看到的相同信息。事实上，页面的左侧与事件详细信息窗格相同。页面的右侧分为选项卡，显示有关警报本身的的信息、此事件的任何书签、此事件的实体以及所有评论的列表。每个选项卡在以下各节中进一步详细描述。\n\
  \n## 警报选项卡\n\n此选项卡将显示构成此事件的一个或多个警报。以下屏幕截图显示了它的外观，其后是字段的描述：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_301_0.png)\n\
  \n图 9.15 – 事件警报选项卡\n\n首先是一条彩色条带。彩色条带表示警报的严重程度：红色表示高，橙色表示中，黄色表示低，灰色表示信息。\n\n其余字段在下表中描述：\n\
  \n| 名称 | 描述 |\n|---|---|\n| 警报名称 | 生成此事件的警报的名称。 |\n| 警报状态 | 警报的状态。 |\n| 警报 ID |\
  \ 警报的内部 ID。点击它将带你进入日志页面，在那里将自动生成并运行查询以向你显示有关此警报的更多信息。 |\n| 产品名称 | 用于在警报规则中生成此事件的产品名称。\
  \ |\n| 事件 | 分析规则在生成此警报时找到的事件数。点击该数字将带你进入日志页面，在那里将自动生成并运行查询以向你显示有关事件的更多信息。 |\n| 创建时间\
  \ | 生成此事件的警报的创建时间。 |\n| 时间范围 | 这将显示警报在生成此事件时查看的开始和结束日期。 |\n\n表 9.3\n\n\n\n\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_303_0.png)\n\
  \n图 9.17 – 事件书签标签页\n\n你可以使用搜索文本框搜索特定的书签。对于每个书签，将显示创建时间、名称、创建者以及标签字段。每条列表的最右侧是一个上下文菜单，其中唯一选项是“从事件中移除”。\n\
  \n请注意，在每行 Created By 条目右侧的信息图标。鼠标悬停在此图标上会显示该书签创建时关联的备注。如果没有备注，则不会显示此图标。\n\n点击上下文菜单会自动选择该书签，点击“从事件中移除”条目会提示你确认是否确实要移除该书签。选择“是”将从此事件中移除该书签。请注意，如果你选择了多个书签，该条目将更改为“从事件中移除\
  \ X 个书签”，其中 X 为所选书签的数量。\n\n## 实体标签页\n\n此标签页将显示与此事件关联的所有实体，如以下屏幕截图所示。每个与事件关联的实体将有一行：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_303_1.png)\n\n图 9.18 – 事件实体标签页\n\n你可以使用\
  \ **Search** 文本框搜索特定实体。**Entities** 过滤器允许你选择一个或多个 **All**、**Account**、**Host**、**IP**\
  \ 和/或 **URL**。默认情况下选择 **All**。\n\n每个实体将列在单独的行中。实体的名称（也是其值）和类型将被显示。如果实体显示为 URL，你可以点击它以转到\
  \ **User Entity Behavior Analytics (UEBA)** 页面以获取有关此实体的更多信息。有关更多信息，请参阅 *第 10 章，配置和使用实体行为*。\n\
  \n实体是在开始调查时非常有用的信息片段。它们提供了分析规则公开的基本信息，让你可以看到事件涉及的内容。\n\n## 评论标签页\n\n此标签页将显示与事件关联的所有评论。请注意，链接还将显示评论总数——在本例中为\
  \ 1。你也可以使用此页面添加新评论（如有需要）：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_304_0.png)\n\
  \n图 9.19 – 事件评论标签页\n\n如前图所示，在创建评论时你可以使用一些有限的格式功能。已添加的评论使用了粗体、下划线和删除线文本修改，并添加了一个链接。\n\
  \n在执行调查时添加评论将有助于你记住自己在做什么。它也有助于可能稍后需要查看同一事件或调查类似事件的其他人员。接下来，我们将介绍如何进行事件调查。\n\n标题栏提供了有关事件的一般信息，包括标题、严重程度、状态、所有者和最后更新时间。\n\
  \n屏幕右侧有两个按钮列。左侧列包含屏幕控制按钮。顶部按钮将图表适配到屏幕上。如果放大或缩小过度，这很有用。其下是放大按钮，底部是缩小按钮。如果你有鼠标中键，也可以使用鼠标中键进行缩放。页面最右侧是与事件本身相关的按钮，并在以下各节中详细介绍。\n\
  \n这是一个交互式 UI，因此你可以根据需要移动屏幕上显示的各种对象以及整个图像。这可以在放大时更轻松地查看你感兴趣的部分。\n\n虽然能够以图形方式查看事件很好，但真正的益处在于查看相关警报以获得事件的整体视图。\n\
  \n## 显示相关警报\n\n如果将鼠标悬停在实体上，将显示一个弹出窗口，其中包含更多选项。这会根据你选择的实体类型略有不同，但它们都会显示相关警报操作，如以下屏幕截图所示：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_306_0.png)\n\n图 9.21 – 相关警报\n\n选择此项将调出与该实体相关的所有警报。在以下屏幕截图中，显示了用户实体的相关警报：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_307_0.png)\n\n图 9.22 – 与所选用户实体相关的警报\n\
  \n这将帮助你确定与此实体相关的其他发生情况。通过查看与此用户相关的其他警报，在本例中，你可以看到他们还做了什么。我们可以看到用户实体也是其他警报中的实体，因此我们可以查看它们以获取更多信息。\n\
  \n虽然它被称为 **related entities**，由于你正在查看警报而不是实体，你可以执行我们刚刚讨论的操作。在以下屏幕截图中，**Suspicious\
  \ granting of rights** 已展开。这显示警报使用与我们正在调查的事件相同的实体：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_308_0.png)\n\
  \n图 9.23 – 调查用户活动\n\n当将鼠标移过实体时可用的其他操作，称为 **exploration queries**，其工作原理与 **Related\
  \ alerts** 操作类似。回顾 *图 9.21*，你可以看到有名为 **User account successful logons** 等条目。在本例中，该条目有一个结果，由其名称后的\
  \ **(1)** 值表示，而所有其他条目在其名称后都有 **(0)**，表示查询未找到任何结果。如果其中任何条目有一个或多个结果，选择它以查看结果作为调查的一部分是值得的。\n\
  \n现在我们知道了如何查看事件、其相关事件以及其探索查询，让我们详细讨论屏幕最右侧的事件按钮。\n\n## 时间线按钮\n\n时间线按钮显示屏幕上显示的所有事件的时间线。如果此事件刚刚打开，则可能只显示一个事件，但如果你显示大量相关警报，则时间线将显示警报发生的时间历史，如以下屏幕截图所示：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_309_0.png)\n\n图 9.24 – 调查时间线\n\n在前面的屏幕截图中，请注意时间线列表中已选择\
  \ Suspicious granting of permissions 事件。当你选择单个事件时，只有与该事件相关的实体会在视图中突出显示；其余将被灰显，如图所示。这使得很容易在时间线上推进并查看哪些实体与哪些事件相关。\n\
  \n## 信息按钮\n\n**Info** 按钮将显示你所选实体的信息。对于 IP、主机和帐户，这将显示 **Address**、**Hostname** 或\
  \ **AccountName**，具体取决于你选择的的类型，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_310_0.png)\n\
  \n图 9.25 – 实体信息\n\n请注意，刀片底部有 **View full details** 按钮。对于 IP 地址、主机和帐户条目，此按钮将显示。这会带你到\
  \ **Entity Behavior** 屏幕，在那里你可以获取有关所选实体的更多信息。有关更多信息，请参阅 *第 10 章，配置和使用实体行为*。\n\n\
  ## 实体按钮\n\n**Entities** 按钮将显示与屏幕上显示的所有信息相关的所有实体、警报和书签的列表。如果你刚开始调查此事件，则这很可能只是你的事件的信息。但是，如果你正在查看大量相关警报，这也将显示这些警报的所有信息：\n\
  \n\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_311_0.png)\n\n图9.26 – 相关实体列表\n\n\
  如果将鼠标悬停在列表中的任何项目上，界面会高亮显示与该项目相关的实体，就像时间线中的操作一样。\n\n## 见解按钮\n\n见解按钮会显示有关所选实体的一些额外信息（如果有）。这些信息会因所选实体类型而异，并将在第10章“配置和使用实体行为”中进一步介绍。\n\
  \n## 帮助按钮\n\n帮助按钮显示此屏幕的常规帮助。此页面的主屏幕显示实体及其相互关系。这是一个完全交互式的屏幕，这意味着您可以移动对象以获得更好的视图，也可以放大和缩小。\n\
  \n以上介绍了如何在 Microsoft Sentinel 中开始对事件进行调查。进行调查还有更多内容，进一步阅读部分中的链接应该会有所帮助。\n\n单击 **配置\
  \ UEBA** 按钮以激活和配置实体行为。执行此操作后，您将进入 **实体行为配置** 页面，如以下截图所示。首先，您必须启用实体行为：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_317_0.png)\n\
  \n图10.2 – 实体行为配置\n\n要启用实体行为，请将 *步骤1* 下的滑块移动到 **开启** 位置。完成此操作后，*步骤2* 下的数据源将被启用。\n\
  \n选择任何要与实体行为一起使用的数据源。建议您全部选择，以便获得最佳结果。\n\n如果在 **连接以下数据源后，您将能够为实体行为分析启用它们** 部分下列出了某些数据源，这意味着数据连接器尚未启用以摄取该类型的数据。如果可能，请启用数据连接器，然后返回此屏幕选择这些数据源。\n\
  \n> **注意**\n> 当您启用这些数据源时，它们可能会为您提供直接在 **数据连接器** 页面中为实体行为启用它们的选项。\n\n选择所有数据源后，单击\
  \ **应用** 按钮开始在实体行为中使用这些数据源。\n\n现在，您的数据已流入实体行为。接下来，我们将了解如何在调查中使用这些数据。\n\n## 实体行为页面概述\n\
  \n有几种方法可以进入实体行为页面：\n\n- 在事件的“查看完整详细信息”页面的“实体”选项卡中查看时\n- 在事件图形调查屏幕上查看特定实体信息，然后单击“查看完整详细信息”按钮时\n\
  - 通过 Microsoft Sentinel 导航菜单选择“实体行为”链接\n\n这三种方式的主要区别在于，前两种会直接将您带到实体的详细信息页面，而第三种会带您到实体行为的主屏幕，如以下截图所示。请注意，屏幕上的一些空白区域已被移除：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_318_0.png)\n\n图10.3 – 实体行为主屏幕\n\n> **注意**\n\
  > 在撰写本文时，只能在实体行为屏幕上查看“帐户”、“主机”和“IP 地址”实体类型。将来可能会添加其他类型。\n\n让我们更详细地了解每个部分。\n\n##\
  \ 标题栏\n\n标题栏位于页面顶部，包含有用的链接，例如查找数据的时间范围、配置实体行为、自定义实体页面以及提供反馈，如以下截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_319_0.png)\n\
  \n图10.4 – 实体行为标题栏\n\n用于确定数据回溯时间范围的下拉框，您应该已经很熟悉了，因为它在 Microsoft Sentinel 中几乎随处可见。使用此下拉框来确定要查找的数据的时间范围，请记住，回溯得越远，数据显示所需的时间就越长。\n\
  \n“实体行为设置”链接将带您到一个页面，您可以在其中找到要摄取的数据源，如上一节所述。\n\n“自定义实体页面（预览）”链接将带您到一个页面，您可以在其中添加针对实体运行的查询，以及查看开箱即用的查询。有关更多信息，请参阅本章的“创建实体行为查询”部分。\n\
  \n“指南和反馈”链接将打开一个新窗格，其中包含关于实体行为的更多信息，并允许您向 Microsoft 发送反馈。\n\n## 搜索部分\n\n搜索部分允许您搜索实体。这是您可以找到与事件无关的那些项目信息的地方。\n\
  \n如果您开始在搜索文本框中输入内容，下方会开始显示建议，如以下截图所示。您可以选择任何建议来查看相关信息。如您所见，在您搜索时，它会建议任何实体类型：\n\n\
  ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_320_0.png)\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_320_1.png)\n\
  \n图10.5 – 实体行为搜索\n\n单击列出的任何条目将带您到实体详细信息页面，该页面在本章的“实体行为详细信息页面概述”部分中进行了描述。\n\n## 具有警报的实体\n\
  \n屏幕底部是拥有最多警报的实体。它显示每个实体有多少警报，如以下截图所示。您可以单击任何实体以转到该实体的详细信息页面：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_320_2.png)\n\
  \n图10.6 – 具有警报的实体\n\n如果实体类型是帐户，则会有来自 Azure Active Directory 的信息，包括其电子邮件地址和联系信息。IP\
  \ 地址将显示信息，包括地理定位数据、日志活动以及此 IP 地址连接到了哪些主机。\n\n无论显示的是哪种类型的实体，它们都会有一个“实体”链接，该链接直接提供到已选择该实体的此页面的链接，以及一个“调查”按钮，该按钮将带您进入用于事件的图形调查部分。但是，不是显示事件及其所有实体，而是显示实体及其所有警报：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_322_0.png)\n\n图10.8 – 实体链接和调查按钮\n\n如您所见，此部分将提供大量关于实体身份的信息。使用此部分来确保您正在查看的实体是您想要调查的实体。如果您从任何事件屏幕进入，也可以使用它来确定您正在查看的是哪个实体。\n\
  \n## 值得注意的事件\n\n此部分是实体信息的重要组成部分。它不仅会显示与此事件关联的警报，还会显示其他活动。如下一节“创建实体行为查询”中所述，您甚至可以添加自定义活动查询。\n\
  \n虽然显示的实际信息将取决于正在查看的实体类型，但信息的格式将是相同的。以下截图显示了此部分的详细视图：\n\n## 概述\n\n搜索\n\n时间范围：6/12/2021,\
  \ 4:33:49 PM - 6/13/2021, 4:33:49 PM\n\n时间线内容：全部\n\n警报：检测到异常活动\n\n活动：显示计算机 IP\n\n\
  警报严重性：全部\n\n桶大小：6\n\n## 随时间变化的事件和警报\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_323_0.png)\n\
  \n## 警报和活动时间线\n\n检测到异常活动\n由 Azure Sentinel 检测到 6/13/2021, 4:30:10 PM\n检测到异常活动\n\
  相关事件：61\n\n显示计算机 IP\n6/13/2021, 12:34:04 PM\n此计算机已出现在 Heartbeat 中，IP 地址为 75.181.242.11，来自美国\n\
  \n显示计算机 IP\n6/13/2021, 8:34:01 AM\n此计算机已出现在 Heartbeat 中，IP 地址为 75.181.242.11，来自美国\n\
  \n图10.9 – 值得注意的事件\n\n如您所见，此部分分为三个主要子部分：搜索和筛选区域、随时间变化的事件和警报，以及警报和活动时间线子部分。每个子部分将在以下部分中更详细地描述。\n\
  \n\n\n\n\n## 搜索和筛选子部分\n\n此区域允许你搜索特定的警报或操作。此外，你可以使用下表中描述的各类筛选器来筛选显示的信息：\n\n| 筛选器名称\
  \ | 描述 |\n|---|---|\n| 时间范围 | 用于指定要使用的时间范围。单击它时，将显示一个弹出窗口，允许你选择要使用的时间范围。此处可以选择与主页面上选择的时间范围不同的范围。\
  \ |\n| 时间线内容 | 用于选择要在时间线上显示的项目。选项包括安全警报、书签、活动和全选。 |\n| 警报 | 选择此选项可以筛选要显示的警报。你可以选择单个警报名称进行显示，或选择“全选”以查看所有警报。请注意，如果此实体没有任何警报，则此筛选器将被禁用。\
  \ |\n| 操作 | 选择此选项可以筛选要显示的操作。你可以选择单个操作名称进行显示，或选择“全选”以查看所有操作。请注意，如果此实体没有任何操作，则此筛选器将被禁用。\
  \ |\n| 警报严重性 | 选择此选项可以筛选要显示的警报严重性。你可以选择单个严重性名称进行显示，或选择“全选”以查看所有严重性。请注意，如果此实体没有任何警报，则此筛选器将被禁用。\
  \ |\n| 桶大小 | 选择此选项可以更改用于对活动进行分组的桶大小。这将决定各项内容如何分组。 |\n\n表 10.1\n\n现在我们来讨论其他子部分。\n\
  \n## 随时间变化的事件和警报子部分\n\n此部分提供一个时间线，显示该实体在选定时间范围内于某些表上的活动量。其工作方式与 Microsoft Sentinel\
  \ 概述页面上显示的“随时间变化的事件和警报”类似，但此处仅显示所选实体的信息。\n\n实际显示的表将取决于正在查看的实体以及启用的数据连接器。\n\n在“**实体行为**”主页面上单击“**自定义实体页面**”按钮，将转到“**实体设置**”页面，如以下屏幕截图所示：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_326_0.png)\n\n图 10.10 – 实体设置页面\n\n该页面分为三个部分：标题栏、活动列表和活动详细信息窗格。以下各节将对每个部分进行描述。\n\
  \n## 标题栏\n\n标题栏允许你刷新页面、添加新活动、删除活动、禁用/启用活动以及了解有关自定义活动的更多信息，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_326_1.png)\n\
  \n图 10.11 – 实体设置标题栏\n\n“**刷新**”按钮允许你刷新页面。\n\n“**添加活动**”按钮将启动新建活动向导。有关详细信息，请参阅“*添加新活动*”部分。\n\
  \n“**删除**”按钮将删除所选的一项或多项活动。如果未选择任何项目，此按钮将被禁用。\n\n“**启用/禁用**”按钮将启用已禁用的活动或禁用已启用的活动。\n\
  \n“**关于自定义活动**”按钮将在浏览器中打开一个新选项卡，并显示一个页面，其中提供了有关如何添加自定义活动的更多信息。\n\n## 活动详细信息窗格\n\n\
  此窗格将显示有关活动的信息，并允许你编辑自定义活动，或基于开箱即用的活动创建自定义活动。下面的屏幕截图显示了查看自定义活动（左侧）与开箱即用活动（右侧）时窗格的外观：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_328_0.png)\n\n图 10.13 – 活动详细信息窗格\n\n\
  两者都显示许多相同的信息，包括名称、描述、标识符（稍后会详细介绍）以及正在使用的查询。但是，自定义活动还会显示 Id 属性，而开箱即用的活动则显示数据源属性。\n\
  \n你可以通过单击“编辑”按钮修改现有活动。如果你正在查看开箱即用的活动，可以单击“创建活动”按钮创建自定义活动，该按钮将启动“活动向导”窗口，并预填许多字段。有关详细信息，请参阅“添加新活动”部分。\n\
  \n在这里，你将看到“实体设置”页面的概览。它提供了大量信息，不仅涉及开箱即用的活动，还涉及你创建的活动。\n\n接下来，我们来看看如何创建自定义活动。\n\n\
  这是向导的第一个选项卡。它提供了一些有关向导用途的基本信息。你还必须填写以下字段：\n\n- “**名称**”字段用于输入自定义活动的名称。请确保名称具有足够的描述性，以便让人很好地了解此活动的作用。\n\
  - “**描述**”字段可以包含此活动的更详细描述。\n- “**实体类型**”下拉列表列出了编写自定义活动时可以使用的所有不同实体。目前，只有“**账户**”和“**主机**”可用。\n\
  - “**按参数筛选**”下拉列表允许你通过附加参数筛选实体。可用的参数列表会根据所选实体类型而变化。如果选择了某个参数，则“**参数值**”下拉列表将激活，并列出可用选项。\n\
  - “**状态**”字段允许你选择操作是“**已启用**”还是“**已禁用**”。\n\n填写完所有这些值后，单击“**下一步：活动配置**”按钮进入向导的下一页。\n\
  \n## 活动配置\n\n此页面允许你输入活动的查询和其他信息，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_330_0.png)\n\
  \n图 10.15 – 活动向导 – 活动配置选项卡\n\n每个字段的描述如下。\n\n“**活动查询**”是你为此活动输入 KQL 查询的位置。此文本框会提供有关你输入的\
  \ KQL 的信息，就像你在 Microsoft Sentinel 的“**日志**”页面中操作时一样。请注意文本框右上角有一个看起来像双向箭头的图标。单击该图标可以展开或收起此文本框，以便更轻松地查看所有代码。\n\
  \n你将使用传递给查询的变量来针对特定实体进行操作。例如，如果我要编写一个针对主机实体类型的操作，我可以这样编写我的查询：\n\n```\nHeartbeat\n\
  | where Computer == '{{Host_HostName}}'\n```\n\n这会调查 Heartbeat 表，并按当前主机实体进行筛选。请注意，该变量由\
  \ {{ 和 }} 包围。这用于指定变量的名称。你不限于只使用一个变量，在很多情况下，你的查询中会有许多不同的变量。\n\n请注意，如果使用此查询，将显示一条错误消息和一条警告消息。错误消息会告诉你，只允许从查询中返回最多\
  \ 10 列，因此你应使用 project 命令来筛选结果。\n\n> **注意**\n> 虽然错误消息会说只能返回 10 列，但 **TimeGenerated**\
  \ 必须是其中之一，因此从技术上来说，只有九列可以选择返回。\n\n警告会说明你选择的标识符很弱，应考虑使用其他标识符以确保结果的可靠性。如果你愿意，可以仅使用所选标识符来运行查询，但结果可能不准确。\n\
  \n\n\n\n\n如果在 **Activity query** 文本框下方，你会看到一行列出可用标识符的文本。根据你在上一屏幕中选择的实体类型，该列表会有所不同。\n\
  \n由于在本示例中选择了 Host 实体类型，可用值是 **Name**、**NTDomain**、**UPNSuffix**、**AadUserId** 和\
  \ **Sid**。点击其中任何一个条目都会将适当的代码添加到 **Activity query** 文本框中，从而使创建查询变得更加容易。\n\n在 **Activity\
  \ query** 文本框正下方是 **View query results** 链接。点击它会带你到 **Logs** 页面，查询已填入并自动运行。这对于测试查询很有用，但请记住变量不会被填充，因此按原样运行查询时不会返回数据。\n\
  \n**Activity title** 允许你输入要在时间线中显示的标题。此功能的一个优点是，你可以在标题中使用从查询中返回的变量。请记住，你最多只能返回 10\
  \ 列（根据我们之前讨论的错误消息），因此在编写查询时要确定要在标题中使用的列。\n\n在 **Activity title** 下方，可以展开或折叠，有一个名为\
  \ **Available values** 的子部分。点击它会显示你可以使用字段，如以下屏幕截图所示。这些字段将取自你输入的查询，因此实际条目会有所不同。还将提供其他变量，包括可在查询中使用的标识符、一些不同的时间字段以及结果数量的计数。你可以点击每个值右侧的\
  \ **Copy to clipboard** 图标（看起来像两张纸），然后将其粘贴到 **Activity title** 文本框中。当活动在时间线中显示时，变量的实际值将被填入：\n\
  \n在此选项卡上，所有你输入的值都将被审核，以确保没有错误。如果没有错误，你将看到如下屏幕。在这种情况下，一切都已正确输入，因此屏幕顶部的消息会通知你这一事实，并且\
  \ Create 按钮将被激活：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_334_0.png)\n\n图 10.17\
  \ – Activity wizard – Review and create – good entries\n\n如果有任何错误，屏幕顶部的消息将说明存在错误，并且\
  \ **Create** 按钮将被禁用。你需要返回并检查你的条目，看看错误可能发生在哪里。很可能是在查询本身，如以下屏幕截图所示。请注意，没有 `project`\
  \ 命令来限制返回的列数：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_335_0.png)\n\n图 10.18\
  \ – Activity wizard – Review and create – bad entries\n\n一切就绪后，点击 **Create** 按钮创建你的新活动。再次说明，从头创建新活动与从现有的开箱即用模板创建的区别仅在于，从模板创建时，字段会为你预先填好。\n\
  \n至此，你已了解有关 Microsoft Sentinel 的实体行为的所有内容以及如何使用它。这将使你未来的调查变得更加容易。\n\n## Summary\n\
  \n在本章中，你学习了如何激活和配置 Microsoft Sentinel 的实体行为功能。你学习了在查看实体时查看信息的方法以及查找要查看实体的不同方式。你还学习了如何编写用于调查的活动。\n\
  \n通过你所学到的知识，你现在可以快速轻松地使用实体进行调查。你可以使用开箱即用的活动，以及你编写的活动，以获取有关实体的详细信息。\n\n在下一章中，你将学习为使\
  \ Microsoft Sentinel 实例平稳运行而必须执行的运营任务。\n\n## Questions\n\n回答以下问题以测试你对本章的了解：\n\n\
  - 1. 在 Entity behavior 中可以查看哪三种类型的实体？\n- 2. 实体的时间线中可以呈现哪三种类型的信息？\n- 3. 如果我正在查看一个实体，并且只想查看其活动，我该怎么做？\n\
  - 4. 我可以通过哪两种方式创建自定义活动？\n- 5. 可以用于创建自定义活动的两种实体类型是什么？\n\n## Further reading\n\n请参阅以下链接，了解本章所涵盖主题的更多信息：\n\
  \n- - Enable User and Entity Behavior Analytics (UEBA) in Microsoft Sentinel: https://docs.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics\n\
  - - Microsoft Sentinel UEBA enrichments reference: https://docs.microsoft.com/en-us/azure/sentinel/ueba-enrichments\n\
  - - Customize activities on entity page timelines: https://docs.microsoft.com/en-us/azure/sentinel/customize-entity-activities\n\
  - - Microsoft Sentinel entity types reference: https://docs.microsoft.com/en-us/azure/sentinel/entities-reference\n\
  \n在本章中，我们将涵盖以下主题：\n\n- - Introducing the Microsoft Sentinel Hunting page\n- - Working\
  \ with Microsoft Sentinel hunting queries\n- - Working with livestream\n- - Working\
  \ with bookmarks\n- - Using Microsoft Sentinel notebooks\n- - Performing a hunt\n\
  \n## Introducing the Microsoft Sentinel Hunting page\n\n要访问 Microsoft Sentinel |\
  \ Hunting 页面，请在 Microsoft Sentinel 导航菜单中选择 Hunting 链接。这将显示 Microsoft Sentinel |\
  \ Hunting 页面，其外观如下所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_338_0.png)\n\n\
  图 11.1 – Hunting page overview\n\n这些部分将在以下各节中详细介绍。\n\n## The header bar\n\n页面的顶部是标题栏，其中有通常的\
  \ **Refresh** 按钮和时间跨度下拉菜单。还有一个 **New Query** 按钮，允许你创建新查询（请参阅 *Adding a new query*\
  \ 部分了解更多信息）。标题栏如下图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_339_0.png)\n\n\
  图 11.2 – Hunting page's header bar\n\n接下来，我们有 **Run all queries (Preview)** 按钮。此按钮将在后台运行所有狩猎查询，然后用找到的结果数量更新狩猎查询列表部分。这比一个接一个地运行每个查询更容易。你也可以选择要运行的查询；在这种情况下，按钮将被重新标记为\
  \ **Run selected queries (Preview)**，并且只运行你选择的查询。\n\n> **Important Note**\n> 如果你读过本书的第一版，你可能会注意到这个按钮以前叫做\
  \ **Run all queries**。之所以现在称为预览功能，是因为在第一版发布和本版撰写之间，这个按钮被更改为仅运行页面上显示的查询，因此如果你想运行第\
  \ 51 个查询，你必须转到下一页。由于客户需求强烈，最近已将其改回运行所有查询。你也可以只选择要运行的查询。\n\n还有 **Columns** 按钮，允许你选择或取消选择要查看的列。请记住，根据你选择的列数，你可能需要向右滚动才能看到它们。\n\
  \n可用的选择如下：\n\n| Name | Description |\n|---|---|\n| Favorites | 星形图标决定这是否是收藏，如果是，则会填满，否则只显示轮廓。收藏也会在查询列表中首先出现。\
  \ |\n| Query | 这是查询的标题，而不是 KQL 查询。 |\n| Provider | 这是提供查询的来源。这通常是 Microsoft 或 Custom\
  \ Queries。 |\n| Created By | 这是编写查询的人。它将包含创建自定义威胁狩猎查询的人员的名称（或电子邮件），如果是由 Microsoft\
  \ 提供，则为空。 |\n| Created Time | 查询创建的日期和时间。 |\n| Entities | 这将显示查询将提供的实体。 |\n| Data\
  \ Source | 这将列出此查询所需的数据源。如果需要多个数据源，将列出第一个数据源，并附带一个数字，告诉你还有多少个其他数据源。你可以鼠标悬停在信息图标上，该图标看起来像一个圆圈中的\
  \ i，以查看其他数据源。 |\n| Results | 如果查询尚未运行，这将显示两个破折号以表示该情况。如果已运行，它将显示返回的结果数量，或在由于缺少数据源而无法运行的情况下显示\
  \ N/A。 |\n| Results delta (preview) | 这将显示查询当前运行结果与上次运行结果之间的差异。 |\n| Tactics | 这将显示此查询使用的\
  \ MITRE ATT&CK® 战术。 |\n| Techniques (preview) | 这将显示此查询使用的 MITRE 技术。请注意，这些只会显示在\
  \ Microsoft 提供的查询中，因为在创建自己的查询时无法选择这些。 |\n\n\n\n\n标题栏显示启动查询所需的链接。它还可以通过显示或隐藏特定列来更改威胁搜寻屏幕显示的信息。\n\
  \n## 摘要栏\n\n摘要栏显示处于活动状态的查询总数、可运行的查询数量、有结果的查询总数、已运行的查询总数、实时流结果的总数（有关更多信息，请参阅“使用实时流”部分）、您拥有的书签总数（有关更多信息，请参阅“使用书签”部分），以及最右侧的一个用于了解有关威胁搜寻的更多信息的链接，如下面的截图所示：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_341_0.png)\n\n图 11.3 – 搜寻页面的摘要栏\n\n您可能已经注意到，在上面的截图中，虽然总共有\
  \ 194 个查询，但只有 131 个被列为活动状态。这是因为截图所在的 Microsoft Sentinel 环境并未包含运行这些查询所需的全部表。\n\n\
  ## 搜寻查询列表\n\n标题下方是所有搜寻查询的列表。列表顶部是 MITRE ATT&CK® 分解图。在 MITRE ATT&CK® 分解图中单击任意图标，将只显示与该特定攻击类型关联的查询。因此，如果您单击“初始访问”图标（看起来像显示器的第一个图标），则只会显示那些在“策略”字段中将“初始访问”作为其条目之一的搜寻查询。\n\
  \n摘要栏让您很好地了解搜寻查询的分布情况。这样可以更轻松地找到调查中所需的查询。\n\n> **重要说明**\n> 您可以访问 https://attack.mitre.org/tactics/enterprise/\
  \ 以了解有关 MITRE ATT&CK® 的更多信息。\n\n其下方是搜索和筛选部分。它的工作方式与其他页面的搜索和筛选部分相同，因此此处不再赘述。如需复习其工作原理，请参阅第\
  \ 9 章“事件管理”中的“搜索和筛选”部分。\n\n每一行都会显示一个星形图标，表示它是否为收藏项。如果是收藏查询，星形图标将被选中；否则不会。将查询设为收藏的另一个好处是，每次访问“搜寻”页面时，收藏查询都会自动运行。\n\
  \n每一行还会列出查询的名称、来源、所需的第一个数据源（请注意，在下面的截图中，鼠标悬停在“更多信息”图标上以显示如果存在多个所需数据源时工具提示的外观）、查询获得的结果数、结果增量、为此查询选择的任何\
  \ MITRE ATT&CK® 策略，然后是 MITRE 技术，如下所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_342_0.png)\n\
  \n图 11.4 – 搜寻查询列表\n\n您可以查看上方“标题栏”部分中的表格，了解可能显示的其他列及其用途。\n\n最右侧是上下文相关菜单，您可以在此运行查询、在“收藏”列表中添加/移除查询、编辑查询（如果是您创建的）、克隆查询（以便编辑）、删除查询（同样，如果是您创建的）、将查询添加到实时流，以及从查询创建分析规则。有关更多信息，请参阅“使用\
  \ Microsoft Sentinel 搜寻查询”部分。\n\n这涵盖了 Microsoft Sentinel | 搜寻页面的所有字段。如您所见，您可以从此处了解有关每个搜寻查询的很多信息。但是，还有更多与查询相关的信息，您将在下一节中读到。\n\
  \n## 搜寻查询详细信息窗格\n\n当您从列表中选择任意查询时，搜寻查询详细信息窗格将打开该查询并显示有关它的更多信息。当然，显示的信息将取决于所选的查询。下面的截图中可以看到一个示例：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_343_0.png)\n\n## 图 11.5 – 搜寻查询详细信息窗格\n\
  \n页面顶部是查询的标题。紧接着是查询编写者的名称。在本例中是 Microsoft，但如果是您创建的查询，则显示“自定义查询”。其旁边是此查询的结果数。其右侧是此查询使用的第一个数据源。如果此查询有多个数据源，则需要将鼠标悬停在“更多信息”图标上才能看到它们，如图\
  \ 11.4 所示。其下方是查询的描述。这将为您提供有关查询如何工作及其所查找内容的信息。\n\n在“描述”字段下方是“创建时间”字段，它会告诉您此查询的创建时间。对于\
  \ Microsoft Sentinel 随附的任何查询，此时间将是创建此 Microsoft Sentinel 实例的时间。\n\n滚动后，您会发现更多字段，如上面的截图所示。其中有一个\
  \ **实体** 列表，将在运行此查询时填充。\n\n> **重要说明**\n> 如果没有实体，此部分将完全不会出现。\n\n其下方是 **策略** 部分，该部分将提供与此查询关联的每个策略的更多详细信息，以及获取有关这些策略的更多信息的链接。如果没有策略，此部分将完全不会出现。\n\
  \n最后，还有一个与此查询关联的 **技术** 部分。单击其中一项技术将打开一个新页面，其中包含相关技术的描述。\n\n在详细信息页面底部是 **运行查询**\
  \ 和 **查看结果** 按钮。**运行查询** 按钮将在后台运行查询，并在 **搜寻查询列表** 部分中显示结果数。**查看结果** 按钮的工作方式与前面描述的\
  \ **查看查询结果** 链接相同。\n\n现在您已经了解了 **搜寻** 页面的各个部分，接下来让我们看看可以运行哪些搜寻查询来开始调查。\n\n## 使用\
  \ Microsoft Sentinel 搜寻查询\n\n虽然已有大量查询，而且还在不断添加更多查询，但有时您可能需要添加自己的查询或修改现有查询，以更好地满足您的需求。\n\
  \n## 添加新查询\n\n要添加新查询，请单击“搜寻”页面顶部的“新建查询”按钮。这将打开“创建自定义查询”页面，如下面的截图所示。这与第 7 章“创建分析规则”中讨论的创建新的计划查询非常相似，因此您可以阅读“使用向导创建新规则”部分作为复习：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_346_0.png)\n\n图 11.7 – 添加新查询\n\n填写“名称”、“描述”和“自定义查询”字段。如果您的查询包含任何实体，请使用“实体映射”部分将实体映射添加到查询中。请记住要逐个添加。最后，选择此查询使用的一个或多个策略（截图中未显示）。\n\
  \n> 重要说明\n> 在撰写本章时，还没有地方可以输入或选择 MITRE 技术。这些技术仅在开箱即用的搜寻查询中提供。\n\n填写完所有信息后，单击“创建”按钮以创建新查询。\n\
  \n既然您已添加了新查询，如果需要对其进行更改该怎么办？下一节将讨论编辑查询，并回答这个问题。\n\n## 编辑查询\n\n如果查询的运行方式不太符合您的预期，或者您想更新有关查询的信息，可以编辑它以进行必要的更改。\n\
  \n要编辑查询，请在查询列表中查询名称右侧的上下文相关菜单（由行最右侧的三个点表示）上单击，然后选择“编辑查询”，如下面的截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_347_0.png)\n\
  \n这将打开与之前讨论添加查询时图 11.7 中显示的页面相同的页面。进行必要的更改，然后单击“保存”以保存更改。\n\n您随时可以单击窗口右上角的 X 来关闭窗口而不保存任何更改。如果您进行了任何更改，系统将提示您确认是否要在不保存更改的情况下关闭窗口。\n\
  \n现在您知道了如何按需更改查询。如果您想创建一个新查询并更改这个新查询，该怎么办？您可以克隆查询，如下一节所述。\n\n## 克隆查询\n\n您可能已经注意到，您无法编辑已有的查询。如果需要修改已有查询，您需要先克隆它来创建自定义查询，然后再更改这个新的自定义查询。\n\
  \n要克隆查询，请按上一节所示单击上下文相关菜单，然后单击“克隆查询”。这将打开与添加新查询时相同的窗口，并且除了“名称”字段外，所有字段都将填充与原始查询相同的信息。\n\
  \n\n\n\n回顾图 11.8，上下文菜单中的最后一项称为 Add to livestream。选择它会将查询添加到 Livestream 窗口，如下所示：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_349_0.png)\n\n图 11.9 – 将查询添加到 Livestream\n\
  \n对于每个已添加的实时流，你可以看到其状态、查询名称、运行时间、找到的结果数量、最后一个结果、最后一个结果发生的时间，以及一条显示结果随时间线找到数量的微型折线图（未显示）。\n\
  \n点击每个实时流会显示详细信息窗格，其中包含有关查询的信息，包括完整的 KQL 代码，以及查看查询结果的能力，就像你从 Queries 选项卡运行它一样。此窗格底部是\
  \ Pause 按钮，可暂停正在运行的实时流，或在已暂停时播放实时流，以及 Open livestream 按钮。\n\n点击 Open livestream\
  \ 按钮会打开 Livestream 窗口。在这里，你可以启动或停止查询，将其提升为警报规则，修改查询，并查看结果，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_349_1.png)\n\
  \n图 11.10 – Livestream 页面\n\n屏幕顶部是标题栏，在此执行针对实时流的操作。你可以播放或暂停实时流，保存实时流，删除它，从实时流创建分析，将任何选定的结果保存为书签，并显示或隐藏查询返回的列。\n\
  \n屏幕底部是查询开始运行以来添加的所有结果。显示的列将取决于正在运行的查询。\n\n将查询添加到 **Livestream** 并启用它会导致该查询每分钟运行一次。如果查询运行且显示递增，则意味着存在潜在威胁处于活动状态。此外，你可以离开\
  \ **Livestream** 选项卡，它仍会继续运行。当 **Livestream** 会话期间有新的工件递增时，你将通过 Azure 控制台通知系统收到通知。你还可以选择结果的各个行并将它们添加为书签，这将在下一节中描述。\n\
  \n将查询添加到 **Livestream** 可以成为一个非常有用的工具，用于几乎实时地观察环境中正在发生的事情。通过监视一个或多个查询，你将看到结果在发生时出现。\n\
  \n在下一节中，我们将讨论书签，它允许你保存查询结果并将其与事件关联，以进一步协助你的调查。\n\n## Working with bookmarks\n\n\
  在进行调查时，可能需要跟踪之前运行查询的结果。也许你需要处理另一个项目并稍后返回此调查，或者另一位用户将接管调查。你可能还需要将某些结果保留为事件的证据。无论如何，使用书签将允许你将此信息保存以供以后使用。\n\
  \n### Creating a bookmark\n\n要创建新的书签，你必须从 Logs 页面运行查询 – 参阅第 6 章 Microsoft Sentinel\
  \ Logs and Writing Queries，或，正如我们刚才看到的那样，从实时流的结果中运行。在 Hunting 页面上，点击查询详细信息窗格中的 Viewing\
  \ Results 按钮将打开 Logs 页面，显示你的结果，如下所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_351_0.png)\n\
  \n图 11.11 – 查看查询结果\n\n你可能已经注意到每个结果左侧都有复选框。要创建新的书签，请选择一个或多个复选框。当至少选择了一个复选框时，结果的标题栏中的\
  \ Add bookmark 链接将被启用。\n\n当你点击 **Add bookmark** 时，将打开一个新的刀片，如以下屏幕截图所示（如果选择一个复选框而不是多个复选框，刀片的实际标题会有所不同）：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_352_0.png)\n\n图 11.12 – 添加书签刀片\n\n**Bookmark\
  \ Name** 将用查询的名称填充，后跟一个随机的 12 位十六进制数字，以便如果你从同一查询创建多个书签，它们每个都有唯一的名称。下方是所有可用实体的列表。如果查询与任何实体相关联，它们将被填入。当然，你可以手动填写任何实体。\n\
  \n添加所需的任何 **Tags** 和 **Notes**。添加 **Notes** 时，请确保它们提供足够的信息，以便当你或他人返回此书签时，很容易理解发生了什么。输入任何在需要时用于过滤查找各种书签的有用的\
  \ **Tags**。\n\n当所有字段都已填写后，点击 **Create** 创建书签。\n\n### Important Note\n\n如果你在创建书签时选择多个复选框，第一个创建的书签将遵循前面所述的命名约定。对于其余的，每个选定的结果将创建一个新的书签，并且\
  \ **Name** 将附加 (x)，其中 x 是书签的副本编号。例如，如果选择了四个复选框并且书签名称设置为 Test Bookmark - 123456789012，则第一个书签将具有该名称；第二个将命名为\
  \ Test Bookmark - 123456789012 (1)，第三个将命名为 Test Bookmark - 123456789012 (2)，第四个将命名为\
  \ Test Bookmark-123456789012 (3)。这样，你可以轻松地分辨出哪些书签是同时创建的。\n\n在执行查询时添加书签非常容易。在下一节中，我们将讨论如何使用它们。\n\
  \n### Viewing bookmarks\n\n如果返回到 **Hunting** 主页面，你会看到在所有查询列表上方有一个 **Bookmarks**\
  \ 选项卡。点击它将更改页面以显示 **Bookmarks** 选项卡，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_353_0.png)\n\
  \n图 11.13 – Bookmarks 选项卡\n\n当选择一个书签时，详细信息窗格将在右侧打开，显示有关书签的更多信息，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_354_0.png)\n\
  \n图 11.14 – 书签详细信息窗格\n\n页面顶部是书签的名称，其下是创建者、最后更新者和查询创建书签时使用的数据源，或如果有多个数据源则为第一个数据源。\n\
  \n下方是另一个包含书签名称的字段。此字段可编辑，因此如果你想更改书签的名称，可以在此处进行更改。一旦离开该字段，新更改将自动应用，或按 Enter 键保存数据而不离开该字段。\n\
  \n其下是结果创建的时间、与书签关联的任何标签，以及与此书签关联的实体。你可以点击主机、IP 或帐户实体以获取有关它们的更多信息。有关更多信息，请参阅第 10\
  \ 章 Configuring and Using Entity Behavior。\n\n**Important Note**\n你可能会看到一条消息，说明\
  \ **Investigation cannot be used to investigate this bookmark because some of the\
  \ data related to this bookmark is no longer stored.** 如果存储在书签中的结果由于你的数据保留策略而被删除，则可能发生这种情况。有关设置数据保留策略的信息，请参阅\
  \ *第 2 章 Azure Monitor – Introduction to Log Analytics*。\n\n屏幕底部是 **Investigate**\
  \ 按钮，只有当至少有一个实体具有值时才会被启用。点击该按钮将打开调查屏幕，该屏幕已在 *第 9 章 Incident Management* 中详细描述。\n\
  \n**Investigate** 屏幕有一个更改；由于你正在处理书签而不是事件，主图标将如下所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_356_0.png)\n\
  \n图 11.16 – 书签调查\n\n你现在知道如何查看已创建的书签。你可以获取有关它们的更多详细信息，并了解如何使用 **Investigate** 按钮查看信息。接下来，我们将学习如何将书签与事件关联。\n\
  \n\n\n\n现在，我们来详细了解上下文菜单下的各个字段：\n\n- 如果选择**新建事件**，将打开新建事件边窗，如下所示。\n- 这将允许你基于所选书签创建新事件：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_358_0.png)\n\n图 11.18 – 从书签创建事件\n\n这些字段与任何其他事件相同，因此此处不再赘述。有关事件的更多信息，请参阅第\
  \ 9 章“事件管理”。单击“创建”即可从该书签创建新事件。\n\n- 单击**添加到现有事件**将打开一个新的边窗，你可以从中选择一个或多个事件来关联此书签，如下面的屏幕截图所示。选择要与此书签关联的事件，然后单击“添加”：\n\
  \n## 使用 Microsoft Sentinel 笔记本\n\n有时，仅使用 KQL 查询日志不足以帮助正确执行搜寻活动。在这种情况下，你可以使用托管在 Microsoft\
  \ Azure 机器学习 (AML) 服务中的 Jupyter notebook 来执行其他工作。Jupyter Notebook 将文本与代码相结合，以提供威胁搜寻活动的整体视图。代码可以用\
  \ Python、PowerShell 和其他语言编写，因此威胁搜寻者可以使用他们很可能已经熟悉的语言进行工作。\n\n> **重要说明**\n> Jupyter\
  \ Notebook 的全部功能不在本书的讨论范围之内。有关详细信息，请访问 https://jupyter.org/。\n\n单击 Microsoft Sentinel\
  \ 导航区域中的“笔记本”，进入“笔记本”页面，该页面如下图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_360_0.png)\n\
  \n图 11.20 – 笔记本页面概览\n\n本页中的每个区域将在以下各节中更详细地介绍。\n\n## 标题栏\n\n标题栏允许你使用笔记本，如下面的屏幕截图所示：\n\
  \n对于每个笔记本，会显示笔记本名称，其下方是创建公司。右侧会显示上次更新时间，其下方是笔记本类型。目前类型有四种不同选项：入门、配置、搜寻和调查。以后可能会添加更多类型。\n\
  \n## 笔记本详细信息窗格\n\n选择笔记本将显示笔记本详细信息边窗，如下面的屏幕截图所示。页面顶部会显示笔记本名称，其下方是创建者的名称和最后更新时间。\n\
  \n其下方是笔记本的说明，它会告诉你笔记本要查找什么。再往下是“所需数据类型”字段，它指的是笔记本将查询的 Microsoft Sentinel 日志。再往下是用于填充数据类型的数据源列表（未显示），最后是与笔记本相关的一幅或多幅图像：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_362_0.png)\n\n图 11.23 – 笔记本详细信息窗格\n\n\
  此边窗底部是**保存笔记本**按钮。该按钮用于保存所选笔记本。如果你已经保存过此模板，则可以选择覆盖现有笔记本。如果你不选择覆盖现有笔记本，并且已存在一个笔记本，则不会发生任何操作。\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_363_0.png)\n\n图 11.24 – 保存笔记本模板\n\n单击**保存笔记本**按钮后，除非你取消该操作，否则按钮将变为**启动笔记本**。如果此时单击该按钮，笔记本将在\
  \ AML 工作区中打开。如果你选择另一个笔记本，然后返回此笔记本，按钮将恢复为**保存笔记本**。\n\n> **重要说明**\n> \n> 如果你尚未创建\
  \ Azure 机器学习工作区，当你尝试保存笔记本时，系统将显示一条消息，提示你需要先创建工作区。有关详细信息，请参阅后面的*创建工作区*一节。\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_365_0.png)\n\
  \n图 11.26 – Microsoft Azure 机器学习页面\n\n在此处，你可以选择笔记本并开始使用。笔记本的实际用法不在本书的讨论范围之内。\n\n\
  Azure 笔记本允许你在 Microsoft Sentinel 外部执行查询。它们可以包含文本和代码，也可以包含 Microsoft Sentinel 内部和外部的数据。它们还可以利用\
  \ Microsoft Sentinel 不可用的图形包来创建在 Microsoft Sentinel 中无法创建的图表。\n\n接下来，我们将介绍如何执行威胁搜寻的机制。本节将重点介绍你将执行的任务，而不是如何在\
  \ Microsoft Sentinel 中执行这些任务。\n\n如前面的图所示，执行调查涉及多个步骤。下面将更详细地介绍每个步骤。\n\n## 制定前提\n\n\
  在此步骤中，你需要确定你试图发现或证明什么。你想找出什么？是确定你的环境中是否发现恶意 IP 地址？新用户账户是否执行了其不应执行的操作？是否有外部实体的人试图访问你的系统？\n\
  \n在制定前提时，你是在明确你要查找的内容。可能是有人告诉你你要找什么，也可能你是在寻找你认为可能已经发生的事情。利用威胁情报源等工具作为前提，开始你的威胁搜寻。\n\
  \n请记住，威胁搜寻是一种弥补空白的措施，用于在分析规则可用之前确保覆盖新报告的威胁。\n\n## 确定数据\n\n在此步骤中，你将确定开始调查所需的数据。你需要查看哪些数据来验证你的假设？这些数据全部在\
  \ Log Analytics 中，还是会在其他地方找到？你已经了解环境中的哪些情况，还需要了解什么？\n\n在调查过程中，你可能会确定需要其他信息，因此不要觉得你只能使用此步骤中获取的数据。\n\
  \n你还可能会发现，你没有处理前提所需的所有数据。也许你需要的数据没有被记录下来，在这种情况下，你需要看看是否可以开始收集这些信息。无论如何，如果你无法获得所需的数据，你可能需要返回并修改你的前提。\n\
  \n一旦你开始在拥有的各种日志中发现特定类型的活动，就有必要记录这些活动，以便将来更容易找到数据。下面的屏幕截图展示了一种跟踪信息的方法的开头：使用 Microsoft\
  \ Excel 来跟踪日志名称、所查询的数据类型以及日志中是否找到该数据。如果找到该数据，则输入保存该数据的列的名称：\n\n## 执行调查\n\n在此步骤中，你将执行上一步中获得的查询，无论这些查询是你自己编写的，还是你找到的现成可用的查询。你可以在\
  \ Microsoft Sentinel 中执行查询，也可以在笔记本中执行查询，或者两者均可。\n\n无论你在何处运行查询，一旦开始查看结果，你可能会发现需要修改前提，或者确定需要更多数据，因此你可能需要返回到前面的某个步骤（请参阅图\
  \ 10.24）。\n\n## 响应\n\n既然你已经掌握了所需的信息，就可以对调查结果做出响应。你可能只需弥补你发现的安全漏洞，也可能需要上报给另一个团队并展示你的发现。受众可能只是你的团队，而在发生重大违规事件时，可能是首席信息安全官\
  \ (CISO)、首席信息官 (CIO)，甚至董事会。\n\n如果响应很简单，例如在防火墙中阻止某个端口或阻止某个 IP 地址范围，那么很可能只需要通知相关人员、更新工单，然后继续前进即可。\n\
  \n然而，很可能在某些情况下，你需要对你的发现做完整的演示。听众可能只是你的团队，但也可能是其他受众。演示的方式取决于你的公司及其企业文化；在工作中要时刻思考“这些信息在演示中是否有用？”，并考虑你会如何呈现它。向团队演示时，信息表格可能就足够了，但其他不熟悉数据的人可能需要图形和图表。\n\
  \n至少，如果这是新信息，你应该在团队内展示你的发现以及你是如何得到这些结果的，以便每个人都了解最新发现并采取最适当的行动。\n\n## 监控\n\n如果可能，请开发新的分析查询；否则，继续定期运行调查以验证发现。有关创建分析查询的复习，请参阅第\
  \ 7 章“创建分析规则”。\n\n\n\n\n在本步骤中，你将确定如何执行持续监控，以帮助防范你正在调查的情况，或提高下次再次调查的能力。你能否在日志中添加更多信息？是否可以对操作流程进行更改，以帮助避免未来出现这种情况？是否可以对网络进行更改？\n\
  \n最好的结果之一是创建分析查询，以便可以自动发现这种情况，并可能通过剧本进行处理。有关创建剧本的更多信息，请参阅第 12 章《创建剧本和自动化》。\n\n##\
  \ 改进\n\n根据调查中获得的任何经验教训，在可能的情况下改进调查代码和技术。\n\n在本步骤中，你——以及很可能还有其他人——将努力确定如何改进本次狩猎中使用的查询，以及如何避免未来再次需要进行此项狩猎。可能你的查询可以重写以提高效率，可以对操作流程进行更改以完全避免这种情况，或者可以根据团队、合作伙伴和领域专家技能和经验提出其他建议。\n\
  \n这些是可以采取的步骤来开始你的威胁狩猎调查。再次强调，这些都不是一成不变的，这些步骤仅供指导。你可能会发现你的公司有自己的步骤，或者你想要添加自己的步骤。真正的收获是，你应该有一个可重复的过程，并且不断改进，使你能够至少与同事分享你的结果，如果可以的话，还能与更广泛的威胁狩猎社区分享。\n\
  \n## 总结\n\n现在，你已经了解了如何在 Microsoft Sentinel 中开始进行威胁狩猎。你了解了狩猎页面、带有 Jupyter 笔记本的笔记本页面，并对如何执行威胁狩猎调查进行了简要介绍。\n\
  \n我们查看了 Microsoft Sentinel 提供的用于协助威胁狩猎的工具。这包括仅定期运行的查询，要么是因为需要查找特定信息，要么是因为它们返回的结果太多，在定期运行的基础上没有用处。\n\
  \n- *Create and manage Azure Machine Learning workspaces* (https://docs.microsoft.com/en-us/azure/machine-learning/how-to-manage-workspace?tabs=azure-portal#create-a-workspace)\n\
  - *Azure Machine Learning documentation* (https://docs.microsoft.com/en-us/azure/machine-learning/)\n\
  - *Microsoft Sentinel Notebook Ninja series* (https://techcommunity.microsoft.com/t5/azure-sentinel/becoming-an-azure-sentinel-notebooks-ninja-the-series/ba-p/2693491)\n"
- '# Section 4:

  集成与自动化


  在本节中，你将学习如何创建解决方案以自动化处理安全事件所需的响应并与票务系统集成。


  本节包含以下章节：


  - 第 12 章，创建剧本和自动化

  - 第 13 章，ServiceNow 集成用于警报和案例管理

  '
- "# 第 12 章 创建剧本\n\n## 创建剧本\n和自动化\n\n在前几章中，你了解了 Microsoft Sentinel 的 **Security Information\
  \ and Event Management (SIEM)** 方面。现在，是时候了解其 **Security Orchestration, Automation,\
  \ and Response (SOAR)** 能力了。\n\nMicrosoft Sentinel 的 SOAR 功能允许针对警报和事件创建自动或半自动响应。这使你能够开发可以执行诸如阻止\
  \ IP 地址通过防火墙、阻止可疑用户名，或发送电子邮件给安全团队通知生成了新的高严重性警报等简单任务的工作流。当你将 Microsoft Sentinel 提供的自动化功能与部署的众多其他安全产品的保护功能相结合时，一切皆有可能！\n\
  \n在本章中，你将了解 Microsoft Sentinel 剧本，包括如何编写和编辑它们、配置其工作流以及管理它们。你还将了解 Microsoft Sentinel\
  \ 的 Automation 功能，该功能允许你在不使用剧本的情况下执行某些操作。\n\n在本章结束时，我们将逐步介绍创建简单剧本的过程。到本章结束时，你应该能够舒适地编写剧本。\n\
  \n本章将涵盖以下主题：\n\n- Microsoft Sentinel 剧本简介\n- Microsoft Sentinel Automation 简介\n\
  - 添加新的 Automation 规则\n- 剧本定价\n- 剧本类型\n- Microsoft Sentinel 连接器概述\n- 探索剧本选项卡\n- Logic\
  \ Apps 设置页面\n- 创建新的剧本\n- 使用 Logic Apps Designer 页面\n- 创建简单的 Microsoft Sentinel 剧本\n\
  \n## 介绍 Microsoft Sentinel 剧本\n\nMicrosoft Sentinel 使用 Azure Logic Apps 进行工作流自动化。Microsoft\
  \ Sentinel 剧本是一个使用 Microsoft Sentinel 连接器触发工作流的逻辑应用。随着我们阅读本章，我们将看到的许多屏幕截图将是逻辑应用页面，这强化了这一概念。Logic\
  \ Apps 的全部使用方法超出了本书的范围，因此我们将只介绍 Microsoft Sentinel 连接器，其中包含用于 Microsoft Sentinel\
  \ 的逻辑应用触发器和操作。\n\n> Note\n> 在本章中，术语剧本和逻辑应用将互换使用。\n> 有关 Azure Logic Apps 的更多信息，请访问\
  \ https://azure.microsoft.com/en-us/services/logic-apps/。\n\n逻辑应用使用连接器（不要与 Microsoft\
  \ Sentinel 数据连接器混淆）和操作来执行工作流的活动。逻辑应用连接器提供对事件和数据的访问。操作将执行特定任务，例如发送电子邮件、在 Microsoft\
  \ Teams 上发布消息、提取 JavaScript Object Notation (JSON) 对象等等。\n\n通过使用 Azure Logic Apps\
  \ 作为后端技术，Microsoft Sentinel 剧本已经拥有丰富的连接器和操作生态系统，可以调用以执行其活动。让我们看一下其中一种使用方式。\n\n##\
  \ 介绍 Microsoft Sentinel Automation\n\n当 Microsoft Sentinel 首次发布时，每个剧本都必须单独分配给每个分析规则，并且所有操作都需要使用剧本。Microsoft\
  \ Sentinel Automation 被引入以使使用剧本变得更加容易，同时允许用户在无需编写剧本的情况下执行操作，包括更改事件的严重性。\n\n> Note\n\
  > 当本章撰写时，Automation 功能处于预览状态，因此某些功能可能已更改。\n\n让我们先来看一下 Automation 页面。要访问此页面，请从 Microsoft\
  \ Sentinel 导航窗格中选择 Automation 导航菜单项。Automation 屏幕将显示，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_379_0.png)\n\
  \n图 12.1 – Microsoft Sentinel Automation 主屏幕\n\n我们将在以下各节中查看此页面的每个部分。\n\n## 标题栏\n\
  \n标题栏，如以下屏幕截图所示，包含各种按钮：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_380_0.png)\n\
  \n图 12.2 – Microsoft Sentinel Automation 页面标题栏\n\n让我们详细讨论每个字段：\n\n- **+Create**\
  \ 按钮允许你添加新的自动化规则（称为 **Add new rule**）或新的剧本（在 *Adding a new playbook* 部分中描述）。\n-\
  \ **Refresh** 按钮将刷新显示。\n- **Edit** 按钮将允许你编辑现有的自动化规则。请注意，必须先选择单个自动化规则，然后才能启用此功能。\n\
  - **Enable** 和 **Disable** 按钮仅在选择一个或多个规则时可用，将启用已禁用的规则或禁用已启用的规则。\n- **Move up** 和\
  \ **Move Down** 按钮仅在选择一个或多个规则时可用，将使自动化规则在运行顺序中上移或下移。有关更多详细信息，请参阅本章的 *Adding a new\
  \ automation rule* 部分。\n- **Remove** 按钮将删除所选的自动化规则。\n- **Guides & Feedback** 按钮将打开一个新窗格，并为你提供有关\
  \ Microsoft Sentinel Automation 的更多信息，以及允许你向 Microsoft 提供反馈。\n\n标题栏可用于创建新的自动化规则和剧本，以及更改顺序、状态，并为你提供有关如何使用自动化规则的更多文档。\n\
  \n\n\n\n\n## 摘要栏\n\n标题下方是状态栏，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_381_0.png)\n\
  \n图 12.3 – Microsoft Sentinel 自动化页面摘要栏\n\n此处呈现的所有信息显示可用的自动化规则和 playbook 数量：\n\n\
  - 左侧是自动化规则数量。这显示了自动化规则的总数量，以及它们是否已启用。\n- 其右侧是已启用的规则，即已启用的自动化规则总数。\n- 之后是已启用的 playbook，显示可在自动化规则中使用的\
  \ playbook 数量。\n\n让我们来看一下自动化规则列表。\n\n## 自动化规则列表\n\n摘要栏下方是所有自动化规则的列表，如以下屏幕截图所示。请注意，有一个\
  \ Automation rules（预览）选项卡和一个 Playbooks 选项卡。Playbooks 部分将在本章后面的 Exploring the Playbooks\
  \ tab 部分中介绍：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_381_1.png)\n\n图 12.4 –\
  \ 自动化规则列表\n\n对于列出的每个自动化规则，都有一个选择复选框，后跟以下字段：\n\n| 字段名称 | 描述 |\n|---|---|\n| Order\
  \ | 这是自动化规则运行的顺序。如果与某个分析规则关联的自动化规则不止一个，则编号最低的规则会先运行。 |\n| Display Name | 规则的名称。单击规则即可编辑它。\
  \ |\n| Analytic rule names | 如果此规则要应用于每个分析规则，则会显示 All，或列出此规则将应用于的各个分析规则。 |\n| Actions\
  \ | 显示此规则激活时将运行的操作。 |\n| Expiration Date | 显示此规则到期的日期。如果显示 **Indefinite**，则规则不会过期。\
  \ |\n| Created by | 创建规则的人员姓名。 |\n| Rule creation time | 规则的创建日期和时间。 |\n| Last modified\
  \ by | 最后修改此规则的人员姓名。 |\n| Rule last modified | 规则最后修改的日期和时间（未在前面的屏幕截图中显示）。 |\n|\
  \ Status | 显示规则的状态，为 **Enabled** 或 **Disabled**（未在前面的屏幕截图中显示）。 |\n\n表 12.1\n\n现在，我们将学习如何创建这些规则。\n\
  \n## 添加新的自动化规则\n\n如前所述，要创建新的自动化规则，请单击标题中的 +Create 按钮并选择 **Add new rule**。\n\n这将打开\
  \ **Create new automation rule** 面板，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_383_0.png)\n\
  \n图 12.5 – 创建新的自动化规则\n\n在 **Automation rule name** 文本框中输入规则的名称。您希望此规则的名称足够描述性，以便有人通过阅读标题就能理解它将做什么。例如，`Get\
  \ IP Address information` 告诉用户规则将获取一些 IP 地址信息，而 `Testing 123` 则什么也没告诉用户，而且没人会给规则起这样的名字。\n\
  \n名称下方，请注意 **Trigger** 已自动设置为 **When incident is created**。有关此内容的更多信息，请参阅本章中的 *Types\
  \ of playbooks* 部分。\n\n如果单击 + Add condition 链接，您可以添加更多筛选规则。每次单击此链接时，都会出现另一个筛选下拉菜单，如以下屏幕截图所示。这将允许您根据事件的属性添加筛选器，包括标题、描述、严重性、状态等。此外，还可以筛选其他字段，包括事件提供程序、Azure\
  \ 资源 ID、主机名等。\n\n如以下屏幕截图所示，您还可以选择比较的条件并输入用于比较的字符串。如果您希望能够筛选多个字符串值，请单击字符串右侧的图标。这将添加另一个文本框，您可以在其中输入另一个字符串值。请注意，在这种情况下，它将执行\
  \ OR 搜索。\n\n您还可以单击垃圾桶图标根据需要删除整个规则或其中一个附加文本框：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_385_0.png)\n\
  \n一旦确定哪些分析规则将触发此自动化规则，就需要确定此规则将做什么。这可以通过设置 Actions 来完成。\n\n如以下屏幕截图所示，您可以执行不同的操作：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_386_0.png)\n\n图 12.8 – 自动化规则操作\n\n每个可用操作在下表中进行了描述：\n\
  \n| Action | Description |\n|---|---|\n| Run playbook | 这将允许您选择可以运行的 playbook。仅显示使用事件触发器的\
  \ playbook。有关更多信息，请参阅本章中的 Types of playbooks 部分。 |\n| Change status | 这将自动更改事件的状态。如果选择，则会显示另一个下拉菜单，您可以在其中选择其状态。\
  \ |\n| Change severity | 这将自动更改事件的严重性。如果选择，则会显示另一个下拉菜单，您可以在其中选择其严重性。 |\n| Assign\
  \ owner | 这将自动更改事件的所有者。如果选择，则会显示另一个下拉菜单，您可以在其中选择所有者。 |\n| Add tags | 这将自动向事件添加标签。如果选择，将显示一个新部分，可在其中输入标签。\
  \ |\n\n表 12.2\n\n同一个规则中可以有多个操作。如果有多个操作，则第一个操作会运行，然后第二个操作在第一个操作之后开始，以此类推。\n\nRule\
  \ expiration 字段允许您选择此规则保持活动状态的时间。默认情况下，它将为 Indefinite，在这种情况下，规则永远不会停止活动。您可以选择规则到期的日期和时间，在这种情况下，规则在达到该日期和时间时将被停用。\n\
  \n**Order** 决定此规则应用的顺序。回顾 *Figure 12.5*，您可以看到此规则的顺序默认为 4，因为已经有另外三个规则先运行，顺序为第一、第二和第三。您可以在此处更改数字以更改规则的运行顺序。\n\
  \n如果有两个规则具有相同的顺序号，您将无法确定哪一个会先运行，因此最好确保规则具有唯一的顺序号，以便在顺序很重要时始终知道顺序。不管顺序如何，所有条件与新事件匹配的规则都将运行。\n\
  \n填写所有字段后，单击 **Apply** 按钮创建新规则。\n\n现在，让我们来看一下使用 playbook 时的定价考虑因素。\n\n## Playbook\
  \ 定价\n\n如 *Chapter 1, Getting Started with Microsoft Sentinel* 中所述，运行 Microsoft\
  \ Sentinel playbook 不包含在 Microsoft Sentinel 或 Log Analytics 的摄取成本中。它有单独的费用，虽然可能被认为很小，但会迅速累积。\n\
  \n例如，在美国东部区域，每次运行的每个逻辑应用操作（这包括查找信息、提取 JSON 和发送电子邮件等操作）每次使用将花费 $0.000025。每个标准连接器还有额外的\
  \ $0.000125 费用。 granted，这看起来很小，但如果您编写了一个包含 100 个操作和 1 个连接器的逻辑应用，并且每天每秒运行一次，持续一个月，那么这一个逻辑应用每月将花费\
  \ $3,564！\n\n> **Note**\n> \n> 有关 Azure Logic Apps 定价的更多信息，请访问 https://azure.microsoft.com/en-us/pricing/details/logic-apps/。\n\
  \n现在，这是一个极端的例子，但它提醒您在设计 playbook 时，需要让它们尽可能简单，并且不要做太多多余的工作。接下来，我们将讨论 Microsoft Sentinel\
  \ 连接器，您需要在所有 Microsoft Sentinel playbook 中使用它。\n\n\n\n\n\n## 剧本的类型\n\n目前，有两种类型的剧本：一种使用\
  \ **当 Microsoft Sentinel 警报的响应被触发时** 逻辑应用触发器，另一种使用 **当 Microsoft Sentinel 事件创建规则被触发时**\
  \ 逻辑应用触发器。每种类型都有其用途，如下文所述。\n\n对于使用 **当 Microsoft Sentinel 警报的响应被触发时** 触发器的剧本，以下称为\
  \ **警报剧本**，它们仅对警报生效。这很有用，因为在撰写本文时，它们是唯一可以手动运行的剧本，这意味着当你在事件的“查看完整详细信息”页面中查看警报时，这些是唯一可以通过单击“剧本”链接来运行的剧本。但是，要在分析规则中使用这些剧本，必须将它们应用到每条规则上。\n\
  \n使用 **当 Microsoft Sentinel 事件创建规则被触发时** 触发器的剧本，以下称为 **事件剧本**，是唯一可以与自动化规则一起使用的剧本。但是，由于它们目前无法手动执行，因此除了通过自动化规则之外，它们不能对事件运行。\n\
  \n何时应使用哪种？这取决于用例。\n\n如前所述，只有警报剧本可以手动执行，因此如果你需要在警报创建后对其运行，它们非常合适。但是，要在分析规则中使用它们，你需要进入每条分析规则并指定使用此剧本。\n\
  \n事件剧本是唯一可以在自动化规则中使用的剧本，因此如果你想在事件创建时运行剧本，就应该使用这些剧本。请记住，它们无法手动运行。\n\n总的来说，你可能会混合使用这些不同类型的剧本以满足不同需求。现在，让我们看看用于创建剧本的逻辑应用连接器。\n\
  \n## Microsoft Sentinel 连接器概述\n\n虽然逻辑应用连接器有很多，而且还在不断增加，但我们关注的是 Microsoft Sentinel\
  \ 连接器。它为我们提供了可以启动剧本的触发器。它还包含各种操作，可以执行诸如获取特定事件的信息、获取与警报关联的实体的信息、更新事件等任务。\n\n> **注意**\n\
  > 在撰写本文时，Microsoft Sentinel 连接器的所有功能都处于预览阶段，因此它们可能与这里显示和讨论的有所不同。\n\n如前一节所述，该连接器目前有两个触发器，分别名为\
  \ **当 Microsoft Sentinel 警报的响应被触发时** 和 **当 Microsoft Sentinel 事件创建规则被触发时**。这意味着无论何时创建警报或事件，所选的那个触发器都会被触发。\n\
  \n值得注意的是，虽然警报触发器返回大量信息，但它不会返回实际创建的事件——如果确实创建了事件的话。要获取事件的信息，你需要使用 *表 12.3* 中给出的操作之一。\n\
  \n下表列出了 Microsoft Sentinel 连接器的所有当前操作：\n\n| 名称 | 描述 |\n|---|---|\n| 向事件添加评论 | 向所选事件添加评论。\
  \ |\n| 向事件添加标签（即将弃用） | 向所选事件添加标签。请注意，建议今后使用“更新事件”。 |\n| 更改事件描述（即将弃用） | 更改所选事件的描述。请注意，建议今后使用“更新事件”。\
  \ |\n| 更改事件严重性（即将弃用） | 更改所选事件的严重性。请注意，建议今后使用“更新事件”。 |\n| 更改事件状态（即将弃用） | 更改所选事件的状态。请注意，建议今后使用“更新事件”。\
  \ |\n| 更改事件标题（即将弃用） | 更改所选事件的标题。请注意，建议今后使用“更新事件”。 |\n| 实体 – 获取账户 | 获取所有账户实体的列表。\
  \ |\n| 实体 – 获取文件哈希 | 获取所有文件哈希实体的列表。 |\n| 实体 – 获取主机 | 获取所有主机实体的列表。 |\n| 实体 – 获取 IP\
  \ 地址 | 获取所有 IP 地址实体的列表。 |\n| 实体 – 获取 URL | 获取所有 URL 实体的列表。 |\n| 警报 – 获取事件 | 返回与所选警报关联的事件。\
  \ |\n| 从事件中删除标签（即将弃用） | 从所选事件中删除标签。请注意，建议今后使用“更新事件”。 |\n| 更新事件 | 这允许你设置事件的各种属性，包括标记、所有者、严重性、状态、标题和描述。它还允许你移除标记。\
  \ |\n| 监视列表 – 添加新的监视列表项 | 允许你向现有监视列表添加新条目或创建新监视列表。 |\n| 监视列表 – 更新现有监视列表项 | 允许你更新现有监视列表中的条目。\
  \ |\n\n表 12.3\n\n由于页眉和摘要栏与前面讨论自动化规则时介绍的相同，这里不再赘述。如有需要，请参阅相关章节以了解更多信息。\n\n## 逻辑应用列表\n\
  \n在摘要栏下方是所有逻辑应用的列表，如下面的屏幕截图所示。对于列出的每个逻辑应用，都有一个选择复选框，后面是以下字段：\n\n| 字段名称 | 描述 |\n\
  |---|---|\n| 名称 | 规则的名称。单击规则以转到其逻辑应用页面。 |\n| 状态 | 显示逻辑应用的状态，即 **已启用** 或 **已禁用**。\
  \ |\n| 触发器类型 | 显示此逻辑应用使用的触发器。在本章中，我们只关心包含 Azure Sentinel 的触发器。 |\n| 订阅 | 显示此逻辑应用所属的\
  \ Azure 订阅。 |\n| 位置 | 显示此逻辑应用所在的位置。 |\n\n表 12.4\n\n以上就是剧本概述页面的构成。接下来，我们将使用逻辑应用设置页面来查看特定剧本。\n\
  \n## 逻辑应用设置页面\n\n你已经看到了概述部分。但如果想查看特定项目呢？我们现在就来讨论。\n\n单击图 11.9 中所示的逻辑应用的名称，将进入逻辑应用设置页面。在这里，你可以创建、编辑或删除单个逻辑应用，查看有关逻辑应用的更多信息，以及查看逻辑应用运行历史记录，如下面的屏幕截图所示：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_392_0.png)\n\n图 12.10 – 逻辑应用概述页面\n\n\
  让我们更详细地讨论每个部分。\n\n### 菜单栏\n\n在这里，你可以对此逻辑应用执行更多操作。我们不会讨论左侧导航菜单中的所有选项，因为它们超出了本书的范围。但我们鼓励你花些时间研究逻辑应用的全部功能。\n\
  \n### 标题栏\n\n标题栏包含以下按钮，可用于快速管理逻辑应用：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_392_1.png)\n\
  \n图 12.11 – 逻辑应用概述页面标题栏\n\n每个字段如下：\n\n-   **运行触发器** 按钮将使逻辑应用运行。这对大多数剧本来说并不是很有用，因为它们需要警报触发器的信息才能运行。\n\
  -   **刷新** 按钮将刷新页面。当你运行剧本时，这很有用，可以告诉你何时运行完成，因为运行结果将显示在 **运行历史记录** 部分中。\n-   **编辑**\
  \ 按钮将允许你编辑逻辑应用的工作流。有关更多信息，请参阅 *使用逻辑应用设计器页面* 部分。\n-   **删除** 按钮将允许你在确认要删除后删除此逻辑应用。\n\
  -   **禁用** 按钮将禁用逻辑应用，以便即使连接器被触发，它也不会运行。如果逻辑应用被禁用，则此按钮将变为 **启用**。\n-   **更新架构** 按钮很少会启用，只有在逻辑应用发生更改而需要更新底层架构时才会启用。\n\
  -   **克隆** 按钮将允许你复制此逻辑应用。如果你想尝试一些更改而不丢失原始应用，这将很有用。\n-   **导出** 按钮将允许你将逻辑应用导出到 Power\
  \ Automate 和 Power Apps。由于剧本无法导出，因此此处不介绍此功能。\n\n让我们看看下一部分。\n\n### 基本信息部分\n\n此部分显示逻辑应用的最基本信息。大多数字段与其他所有类型的\
  \ Azure 资源一同显示，并且不言自明，因此这里不再介绍，但有两个例外：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_393_0.png)\n\
  \n图 12.12 – 逻辑应用概述页面的基本信息部分\n\n\n\n\n\n本页我们将重点关注两个主要项目：页眉中的“编辑”按钮，用于修改 playbook；以及页面底部的“运行历史记录”，用于了解逻辑应用的哪个实例成功或失败，以及失败的原因。\n\
  \n> 提示\n> 有关调试逻辑应用的详细信息，请访问 https://docs.microsoft.com/en-us/azure/logic-apps/logic-apps-diagnosing-failures。\n\
  \n现在你已经了解如何查看现有 playbook，接下来该如何添加一个 playbook 呢？下一节将介绍如何添加新的 playbook。\n\n## 创建新的\
  \ playbook\n\n你将需要创建 playbook，因此现在正是学习如何创建它们的时候。\n\n在 Microsoft Sentinel 自动化页面（参见图\
  \ 11.1）中，单击页眉中的“添加 Playbook”链接。这将在浏览器中打开一个新选项卡，并转到“逻辑应用”屏幕，如下面的屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_395_0.png)\n\
  \n图 12.14 – 添加新的 playbook\n\n下面介绍不同的字段：\n\n- 在**逻辑应用名称**字段中输入描述性名称。不允许使用空格，但可以使用下划线。名称应足够具有描述性，以便其他用户了解该\
  \ playbook 的用途。\n- 从**订阅**下拉列表中选择适当的订阅。该订阅应与 Log Analytics（以及 Microsoft Sentinel）工作区所在的订阅相同。\n\
  - 在**资源组**字段中选择现有资源组，或创建新的资源组。playbook 是否与 Log Analytics 工作区位于同一个资源组并不重要。不过，如果组织制定了\
  \ Azure 架构设计策略，则应遵循这些策略。\n- 从**位置**下拉列表中选择适当的位置。该位置应与 Log Analytics 工作区所在的位置相同，以避免产生出口费用。\n\
  - 在**Log Analytics**字段中，如果希望将此 playbook 的运行时事件信息存储在 Log Analytics 中，请启用此选项。如果需要允许其他系统（例如\
  \ Microsoft Sentinel）对这些信息执行查询，此选项将非常有用。\n\n填写完这些信息后，单击**查看 + 创建**按钮。系统将验证你输入的信息是否正确；如果正确，则允许你创建逻辑应用。如果不正确，系统会告知你存在的问题，并允许你返回主页进行修复。\n\
  \n逻辑应用可能需要一些时间才能创建完成。在此期间，你将返回 playbook 主页。\n\n这样，你就创建了 playbook 的基础。目前它还不能执行任何操作，因为其中没有工作流步骤。接下来，我们将了解如何添加工作流组件，使\
  \ playbook 发挥作用。\n\n## 使用 Logic Apps Designer 页面\n\n创建 playbook 后，你将进入**Logic Apps\
  \ Designer**页面。该页面有两种不同的视图。\n\n单击此按钮后，将显示第二种视图，其外观如下方屏幕截图所示。根据你最近使用的连接器和操作，工作流编辑器部分中“最近使用”下的列表会有所不同，也可能为空：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_398_0.png)\n\n图 12.16 – Logic Apps Designer\
  \ 第二种视图\n\n下一节将更详细地介绍此页面的各个部分。\n\n## Logic Apps Designer 页眉栏\n\n如下方屏幕截图所示，页眉栏包含用于处理此工作流的所有按钮。在这里，你可以保存或放弃更改、在\
  \ GUI 视图和代码视图之间切换、添加参数等：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_398_1.png)\n\
  \n图 12.17 – Logic Apps Designer 页面页眉栏\n\n各个按钮的功能如下：\n\n- “保存”按钮用于保存更改。只有在对工作流进行了更改后，该按钮才会处于活动状态。\n\
  - “放弃”按钮将放弃你所做的所有更改，并将工作流还原到上次保存的状态。只有在对工作流进行了更改后，该按钮才会处于活动状态。\n- **运行**按钮将运行当前正在查看的工作流。\n\
  - **设计器**和**代码视图**按钮配合使用，用于显示设计器视图或代码视图。单击**代码视图**按钮后，将显示构成此 playbook 的 JSON 代码。单击**设计器**按钮后，将进入\
  \ GUI 视图。你可以在任一视图中工作；但是，两个按钮中一次只能有一个处于活动状态。如果当前处于**设计器**模式，则**代码视图**按钮将处于活动状态。同样，如果当前处于**代码视图**模式，则**设计器**按钮将处于活动状态。\n\
  - **参数**按钮将打开**参数**窗格，用于添加、编辑或删除此 playbook 的参数。参数是一种向逻辑应用传递信息的方式，主要用于自动化部署。\n\n\
  > **注意**\n> 请访问 https://docs.microsoft.com/en-us/azure/logic-apps/logic-apps-azure-resource-manager-templates-overview，了解有关在逻辑应用部署中使用参数的更多信息。\n\
  \n- **模板**将打开一个预置模板列表，你可以据此创建 playbook。请注意，单击此按钮并从列表中选择模板后，现有 playbook 的设计将被模板覆盖。\n\
  - **连接器**按钮将打开一个新页面，介绍逻辑应用连接器，并提供现有的非预览版连接器和操作列表。如果需要了解连接器的相关信息，这是一个很好的起点。\n\n>\
  \ **注意**\n> 请访问 https://docs.microsoft.com/en-us/connectors/connector-reference/，在*连接器参考*部分查看所有可用连接器。\n\
  \n现在，让我们讨论工作流编辑器部分。\n\n10. 完成后，你的警报应如下所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_404_0.png)\n\
  \n图 12.22 – 警报 – 获取事件完成\n\n现在我们已经获得了事件的信息，接下来该如何处理呢？场景要求：如果引发高严重性警报，则需要通知分析师。“警报\
  \ – 获取事件”操作会返回所有事件，因此我们需要仅筛选出高严重性的事件：\n\n- 1. 单击“新建步骤”链接，然后搜索 Condition。\n- 2. 当\
  \ Control 连接器出现时，选择它。我们将使用 If 语句，但所有控制类型的语句都归属于这一个连接器。\n- 3. 选择 Condition 操作，该操作将被添加，如下面的屏幕截图所示。请注意，它由三部分组成：顶部用于输入实际条件；左下部分用于指定测试结果为\
  \ true 时要执行的操作；右下部分用于指定测试结果为 false 时要执行的操作：\n\n图 12.23 – Condition 步骤选项\n\n4. 根据本节所学内容设置条件，检查\
  \ Severity 是否等于 High。\n\n提示\n\nMicrosoft Sentinel 连接器的触发器和“警报 – 获取事件”操作都会返回严重性，因此选择其中任意一个都可以。\n\
  \n下面的屏幕截图显示了应有的效果：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_405_0.png)\n\n图 12.24\
  \ – Condition 步骤选项已完成\n\n如果将来需要，你可以轻松添加更多条件。\n\n6. 为此，我们将混合使用普通文本和动态内容字段。首先，添加刚刚列出的硬编码文本。然后，使用动态内容变量列表弹出窗口，选择\
  \ Number 变量。你可能需要在此弹出窗口中展开“警报 – 获取事件”列表，才能看到所有可用变量。\n\n7. 完成后，你应看到如下内容：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_407_0.png)\n\
  \n图 12.26 – 发布消息已完成\n\n8. 全部完成后，单击 Logic Apps Designer 页眉中的“保存”按钮，保存此 playbook。如果存在任何错误，系统会通知你；如果没有错误，playbook\
  \ 将被保存。你会注意到，在进行新的更改之前，页眉中的“保存”按钮会显示为灰色。\n\n9. 最后一步是将此 playbook 附加到警报，以验证代码是否按设计运行。有关如何执行此操作的说明，请参阅第\
  \ 7 章“创建分析规则”。\n\n现在，你已经拥有了一个功能完整且极其有用的 Microsoft Sentinel playbook，而且无需编写代码。你只需要确定每个字段应在何处使用。这只是一个非常简单的示例，但希望它能让你了解\
  \ playbook 的用途。\n\n\n\n\n\n## Summary\n\n在本章中，你学习了如何创建一个可以在分析查询规则中使用的工作簿，以执行 SOAR\
  \ 操作。Playbooks 基于 Azure Logic Apps构建，唯一的区别是，只有使用 Microsoft Sentinel 连接器，Logic App\
  \ 才能成为 playbook。\n\n通过你所学到的知识，你现在可以创建 playbooks 来自动化许多以前必须手动执行的操作。你阅读了其中一个示例，但你可以做的事情没有限制！\n\
  \n在下一章中，我们将使用本章学到的知识构建一个 playbook，该 playbook 将创建一个新的 ServiceNow 工单并使用工单号更新事件。\n\n\
  ## Questions\n\n回答以下问题以测试你对本章的了解：\n\n- 1. 在 logic app 能够用作 Microsoft Sentinel playbook\
  \ 之前需要做什么？\n- 2. 如何判断某个特定的 playbook 上次运行是否成功？\n- 3. 在 playbook 的工作流中，我如何获取有关事件的信息？\n\
  - 4. 什么是动态内容？\n- 5. 我可以在一个字段中组合动态内容和静态内容吗？\n\n## Further reading\n\n请参考以下链接以获取有关本章所涵盖主题的更多信息：\n\
  \n- Logic Apps overview: https://docs.microsoft.com/en-us/azure/logic-apps/logic-apps-overview\n\
  - Connectors for Azure Logic Apps: https://docs.microsoft.com/en-us/azure/connectors/apis-list\n\
  - Sample Azure logic apps: https://docs.microsoft.com/en-us/samples/browse/?products=azure-logic-apps\n\
  - Sample Microsoft Sentinel playbooks: https://github.com/Azure/Azure-Sentinel/tree/master/Playbooks\n\
  - Testing logic apps with mock data but setting up static results: https://docs.microsoft.com/en-us/azure/logic-apps/test-logic-apps-mock-data-static-results\n\
  \n让我们来看下一个方法。\n\n## Integrating Azure security alert sources (not just Sentinel)\
  \ with ServiceNow Security Incident Response via the Microsoft Graph Security API\n\
  \n自本书第一版发布以来，Microsoft 和 ServiceNow 已合作通过 Microsoft Graph Security API 实现 Microsoft\
  \ Sentinel 和 ServiceNow Security Incident Response 集成。\n\nMicrosoft Graph Security\
  \ API 是“一个中间服务（或代理），它提供单一的编程接口来连接多个 Microsoft Graph Security 提供商（也称为安全提供商或提供商）。对\
  \ Microsoft Graph Security API 的请求会被分发到所有适用的安全提供商。结果会被聚合并以通用模式返回给请求的应用。” – https://docs.microsoft.com/en-us/graph/security-concept-overview\n\
  \n使用 Microsoft Graph Security API 将 Microsoft Sentinel 与 ServiceNow 集成的一个关键优势是：它不需要将\
  \ Azure 中的所有安全警报都流经 Sentinel。它甚至不需要你使用 Sentinel。这些是较少见的用例。大多数组织都会使用 Sentinel，并使用\
  \ Sentinel 聚合和关联其所有 Azure 安全警报。\n\n使用 Microsoft Graph Security API 将 Microsoft Sentinel\
  \ 与 ServiceNow 集成存在一些限制，包括以下内容：\n\n- Microsoft Graph Security API 不支持将数据从 ServiceNow\
  \ 发送回 Sentinel。例如，当 ServiceNow 中的安全事件关闭时，组织通常希望 Sentinel 中对应的警报自动关闭。\n- ServiceNow\
  \ 为 Microsoft Graph Security API 提供的集成插件不支持在将多个 Sentinel 警报聚合到同一个 ServiceNow 安全事件时使用复杂条件。例如，基于两个字段的聚合将要求两个字段都匹配；没有一个字段或另一个字段匹配的选项。\n\
  \n> Note\n> 有办法绕过这个问题，但需要将创建的集成配置文件数量加倍，增加很多复杂性。但可以做到。\n\n## Figure 13.5 – Add a\
  \ client secret pane\n\n输入密钥的描述，并使用 Expires 下拉菜单确定你希望此密钥存在多长时间。你需要在密钥存在的时间长度与你需要进入、创建新密钥并使用此新信息更新插件的频率之间取得平衡。\n\
  \n5. 点击 **Add** 按钮添加新密钥。完成后，窗格将关闭，你将被带回 **Certificates & secrets** 页面，如下所示：\n\n\
  ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_420_0.png)\n\nFigure 13.6 – New secret\
  \ created\n\n从此页面，你需要复制密钥的 **Value** 字段。这就是我们需要提供给插件的 **client secret key**。再次提醒，请将此文本保密并考虑将其存储在安全保管库中并以编程方式检索和轮换密钥。将它视为用户的密码一样对待。\n\
  \n我们现在已经获得了提供给插件所需的六个信息中的三个：Client ID、Tenant ID 和 client secret。要获取 Subscription\
  \ ID、Resource Group 名称和 Workspace 名称，我们需要进入 Microsoft Sentinel。\n\n## Installing\
  \ the Microsoft Sentinel integration plugin in ServiceNow\n\n此插件可在 ServiceNow 商店中使用。确保阅读发行说明以确认你满足所有要求，例如\
  \ ServiceNow 实例版本。\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_422_0.png)\n\nFigure\
  \ 13.8 – ServiceNow Sentinel plugin\n\n建议在开发时使用插件的最新版本，并在生产环境中始终使用开发时所使用的相同版本。\n\
  \n## Configuring the ServiceNow Sentinel plugin to authenticate to Microsoft Sentinel\n\
  \n这是你将输入在 Configuring the Microsoft Azure portal 部分收集的变量的步骤。请记住，不要向第三方服务提供商提供你的\
  \ client secret。相反，使用屏幕共享和桌面控制解决方案，在他们进行到此步骤时自行输入。\n\n此步骤的一个陷阱是，点击提交后会有轻微延迟，并且不会告诉你是否成功。它会告诉你是否有错误。如果窗口在没有错误的情况下关闭，则表示你已成功将\
  \ ServiceNow 实例认证到 Microsoft Sentinel 实例。如果出现错误，通常是由 Configuring the Microsoft Azure\
  \ portal 部分遗漏步骤或表单数据中的拼写错误引起的（如果复制/粘贴，请注意前导或尾随空格）。请耐心等待——大约需要 20 秒来判断是否成功：\n\n-\
  \ **Retrieve recent Microsoft Sentinel incidents**：这将从 Sentinel 导入最近的示例事件。由于你之前更改了此设置，你应该获得\
  \ 20 个。这取决于 Sentinel 实例是否有可用的事件：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_427_0.png)\n\
  \nFigure 13.12 – Mapping form\n\n将下拉菜单设置为 **Retrieve recent Microsoft Sentinel incidents**\
  \ 后，点击 **Import Sample Data** 按钮。这需要几分钟时间，正如表单上消息所指示的那样。我们看到它可能不到一分钟，但也可能需要几分钟，达到你可能想去喝杯咖啡或散步然后再回来查看的程度。一旦示例记录出现，你可以点击查看它们是由哪些产品生成的。我们在这里使用术语\
  \ *catching samples*，因为你正在尝试捕获产品类型的示例记录，以便你可以为该产品类型创建特定的配置文件。从样本中首先出现的产品开始。然后，继续处理示例记录，直到无法捕获任何新产品为止。可能需要多次导入尝试和特定的时间来捕获不常见产品的示例事件。\n\
  \n\n\n\n\n## 其他选项\n\n配置文件最后部分用于 Sentinel 与 ServiceNow 之间的双向字段映射。例如，ServiceNow 可以在\
  \ ServiceNow 中对应的安全事件关闭时，通知 Sentinel 关闭相应的 Sentinel 警报。本节中有多个选项，功能丰富。我们建议充分利用它们。但是，请注意，如果你的\
  \ ServiceNow 处于开发环境，而你正与生产环境的 Sentinel 集成，请不要启用它们。这会让你的实验室活动弄乱 Sentinel 生产记录：\n\n\
  ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_432_0.png)\n\n图 13.15 – 其他选项\n\n你的 Sentinel\
  \ 到 ServiceNow 集成（如果启用了这些选项，可能也是反向）现在已配置完成。导航到 ServiceNow 中的 Microsoft Azure Sentinel\
  \ Integration | Azure Sentinel Incident to Task 路径，等待记录开始填充。\n\n当你处于 ServiceNow\
  \ 的该区域时，尝试按任务列进行分组。这将显示聚合发生的位置。任何具有多条记录的组都代表一次聚合。\n\n你也可以导航到安全事件记录（在任务列中）以查看你配置的字段映射结果。\n\
  \n## 总结\n\n本章向你展示了如何创建一个与解决方案的集成——在我们的示例中是 ServiceNow——以提供处理安全事件的单一位置。无论安全事件源自何种警报源，或由谁处理，都无关紧要。实现这一结果的方法不计其数。本章仅涵盖了一种更常见的方法。\n\
  \n发挥创意，注重简化和许可成本降低。例如，如果 Sentinel 未对来自警报源的警报进行关联，因为该警报源具有非常高的保真度，那么请考虑将这些警报直接摄取到\
  \ ServiceNow 中并绕过 Sentinel，以节省许可成本并降低架构复杂性。\n\n我们也只是触及了在 ServiceNow Security Incident\
  \ Response 中自动创建安全事件后可以执行的操作的表面。ServiceNow 不仅仅是一个具有花哨表单和仪表板的流程和案例管理解决方案。ServiceNow\
  \ Security Incident Response 是一个行业领先的安全编排、自动化和响应（SOAR）平台，能够简化并自动化大部分安全事件检测和响应流程。在下一章中，我们将讨论可以执行的一些运营任务，以在\
  \ Microsoft Sentinel 中保持最佳运营效率。\n"
- '# 14 Microsoft Sentinel 的运营任务


  与任何服务或解决方案一样，持续的维护例行程序是确保及时的服务改进、保持运营效率、控制成本并——最重要的是——确保服务在检测和响应安全问题方面保持高度有效性的关键流程。


  总体而言，安全运营中心（SOC）运营由两个不同的角色执行：SOC 工程师和 SOC 分析师。在小型组织中，这可能是由一个人同时承担两个角色；在大型组织中，这些角色将跨多个团队展开，并由专职专业人员执行。在本章中，我们将提供每个角色所需的日常、每周和每月任务的详细信息，以及根据需要执行的任何临时任务。你可以将此列表用作构建自己的任务列表的起点，以确保
  SOC 运营最佳。


  本章中的信息旨在为你的规划和持续改进提供起点，以便你执行必要的流程，打造高绩效团队并确保 Microsoft Sentinel 解决方案得到良好管理。


  B. 确保每日总摄取量不超过预期的摄取速率。单日摄取率增加可能有多种原因，例如威胁数量激增或业务活动增加，例如销售额上升或远程工作增加。然而，如果用量持续日复一日地增加，将会影响预期预算的成本，需要与管理团队进行审查。


  有可用的工作簿可协助此监控：https://docs.microsoft.com/en-us/azure/sentinel/monitor-data-connector-health。


  - **监控所有核心组件的服务运行状况：**


  监控所有核心组件的服务运行状况，例如 Azure 平台、用于**身份和访问管理（IAM）**的**Azure AD**，以及任何数据收集服务器（syslog），确保仪表板可用且警报按预期触发。


  - **审查 Microsoft Azure 平台的计划维护、服务运行状况和可用性监控：**


  使用以下资源执行此操作：


  - A. 公开可查看的信息：https://status.azure.com/en-us/status


  - B. 登录你的 Azure 门户并查看特定详细信息：https://portal.azure.com/#blade/Microsoft_Azure_Health/AzureHealthBrowseBlade/serviceIssues


  ## 每周任务


  SOC 工程师的每周任务列表如下：


  - 审查数据连接器，确保每个已启用的连接器仍能正常运行。检查是否有新的或预览版连接器，以及现有连接器的更新。如果新连接器可以替代自定义连接器（或 syslog
  服务器），请尽快计划替换，以受益于新功能并减少对定制和基于服务器的解决方案的依赖。


  - 审查 **Workbooks** 页面和 **News & Guides** 页面，查找新的工作簿模板、连接器公告和任何新更新。确保现有工作簿在更新后仍能正常运行。


  ## 每月任务


  SOC 工程师的每月任务列表如下：


  - 审查数据摄取趋势以进行预测成本分析；调整 **pricing** 层级以反映最具成本效益的选项（有关更多详细信息，请参阅*第 1 章《开始使用 Microsoft
  Sentinel》*中的*Microsoft Sentinel 服务定价*部分）。

  - 验证摄取日志的质量并进行降噪调优，尤其是在引入新的数据源之后。

  - 验证为每种数据类型设置的当前保留期，并确认其适合调查要求和预算指南。

  - 与 SOC 分析师一起进行场景映射练习，以识别额外的检测和响应需求（有关更多详细信息，请参阅*第 1 章《开始使用 Microsoft Sentinel》*中的*场景映射*部分）。将这些知识传递给业务和技术团队的关键利益相关者。

  - 审查授予的角色和访问权限，确保分配的权限最少，并且只有**活跃**的团队成员保留所需的角色。


  ## 临时任务


  SOC 工程师的临时任务列表如下：


  - 审查对 IT 基础设施所做的任何更改；寻找整合额外日志数据的机会，以获得关键洞察并根据攻击场景配置自动化响应。

  - 审查任何可能适用于威胁狩猎场景的新数据资源。

  - 通过 Microsoft 的网站、博客、技术社区或活动（如 Microsoft **Ignite** 和 Microsoft **Build**）查看 Microsoft
  的公告，以了解 Microsoft Sentinel 平台的潜在更改或任何集成服务和解决方案的更改。如果你部署了非 Microsoft 解决方案，也请检查相应的公告以获取受支持的产品更新。

  - 更新 Microsoft Sentinel 架构文档以反映所做的任何更改。

  - 与提供高级安全实践的外部服务合作，进一步测试和训练你的 SOC 能力，包括**渗透测试**、**社会工程**，以及定义高级 SOC 活动。





