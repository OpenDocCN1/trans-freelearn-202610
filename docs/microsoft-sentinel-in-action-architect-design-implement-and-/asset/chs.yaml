  虽然它显示了 2007 年 1 月 5 日发生了一次造成大量损失的风暴事件，但它是造成损失最多的那一次吗？我们可以查看行并查看每行的 DamageProperty
  列来找出答案，但有更简单的方法。


  如果我们运行以下命令，将生成折线图，以图形视图显示相同数据：


  ```

  StormEvents

  | project State, EndTime, DamageProperty

  | where State =="CALIFORNIA"

  | render linechart

  ```


