- "# 第 15 章 附录\n持续学习与社区贡献\n\n感谢您抽出时间阅读本书，并全面了解这一新解决方案。在本章最后，我们将提供一些实用资源，帮助您继续学习，并参与基于社区的知识分享活动。您还可以找到直接向\
  \ Microsoft 提供反馈的资源，从而确保这一解决方案得到持续改进。\n\n本章将介绍 Microsoft 提供的官方资源、安全运营中心（SOC）运营的其他资源，以及\
  \ GitHub 提供的其他资源。\n\n本章将涵盖以下主题：\n\n- Microsoft 官方资源\n- SOC 运营资源\n- 使用 GitHub\n-\
  \ 特定组件和支持技术\n\n### 功能请求\n\n如果您有改进 Microsoft Sentinel 的好想法，或者发现 Microsoft 安全解决方案中存在需要解决的空白，可以通过\
  \ Azure 门户中的反馈选项提交您的想法。反馈选项位于屏幕右上角，其外观如下方屏幕截图所示。您可以选择笑脸来提供积极反馈，也可以选择哭脸来说明您在使用相关功能时遇到的问题，如下方屏幕截图所示：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_448_0.png)\n\n图 15.1 – Azure 反馈选项\n\n\
  虽然博客和论坛是开展研究及提问的良好资源，但对于正在产生即时影响、且可能需要特定技术专长才能解决的问题，不应依赖这些渠道。如果您需要立即获得 Microsoft\
  \ Sentinel 实施方面的帮助，应通过官方渠道之一联系 Microsoft 支持。\n\n如果您没有支持计划，可以在此处注册：https://azure.microsoft.com/en-us/support/plans。\n\
  \n如果您签订了 Microsoft Premier 支持协议，Microsoft 将向您提供专属支持团队的直接联系方式。\n\n### Jupyter Notebook\n\
  \nJupyter Notebook 是一种开源应用程序，可用于创建和共享包含笔记、可视化内容、实时代码及其他资源的文档。SOC 分析师之间可以共享这些文档，以提升威胁搜寻和响应能力。\n\
  \n您可以通过以下链接查找更多 Jupyter Notebook 资源：https://jupyter.org/。\n\n### 使用 Fusion 进行机器学习\n\
  \nMicrosoft 使用机器学习算法帮助 Microsoft Sentinel 检测多阶段攻击，这项功能称为 Microsoft Fusion。该技术通过组合两个或更多警报活动来运行，例如异常行为和可疑活动，而这些活动可能原本只是低级别警报。随后，Microsoft\
  \ Sentinel 可以生成准确且高保真的事件，减少误报，并检测出原本可能被忽略的攻击。要成功实现这一点，您必须确保已启用适当的数据连接器，并且至少拥有 30\
  \ 天的历史数据，以便训练机器学习算法。\n\n此功能默认处于启用状态，目前支持多种场景，包括以下场景：\n\n- 监视触发不可能旅行警报的用户，随后检测到异常的\
  \ Office 365 活动\n- 用户从不熟悉的位置执行登录活动，随后检测到异常的 Office 365 活动\n- 用户从受感染的设备执行登录活动，随后检测到异常的\
  \ Office 365 活动\n- 用户从匿名 IP 地址执行登录活动，随后检测到异常的 Office 365 活动\n- 使用已泄露凭据的用户执行登录活动，随后检测到异常的\
  \ Office 365 活动\n\n若要详细了解此技术并掌握最新进展，请访问以下网站：https://docs.microsoft.com/en-us/azure/sentinel/fusion。\n\
  \n### Azure Logic Apps\n\nAzure Logic Apps 可用于执行各种自动化任务，包括以下任务：\n\n- **基于计划的工作流**：创建任务，以便按照固定频率自动执行操作，例如收集数据，然后将该值与上次收集的值进行比较，并在该值超过阈值时发出警报。\n\
  - **基于审批的工作流**：创建任务来监视指定的触发器，然后发送审批请求（例如电子邮件），并在收到批准后继续执行请求的操作。\n- **Azure Functions**：可以将其与\
  \ Azure Logic Apps 集成，以执行其他任务和集成，例如：\n  A. 根据 HTTP 请求运行代码\n  B. 安排代码在预定义的时间运行\n\
  \  C. 处理新增和修改的 Azure Cosmos DB 文档\n  D. 处理新增和修改的 Azure Storage Blob\n  E. 响应 Azure\
  \ Storage 队列消息\n  F. 通过订阅和筛选器响应 Azure Event Grid 事件\n  G. 响应大量 Azure Event Hubs\
  \ 事件\n  H. 通过响应 Service Bus 队列或主题消息，连接到其他 Azure、本地或其他云服务\n- **存储工作流**：支持与 Azure\
  \ Storage 集成，以实现数据的自动收集和检索。\n\n为了启用此自动化功能，Azure Logic Apps 可以使用连接器，快速访问其他应用、服务、系统、协议和平台中的事件、数据与操作。此集成适用于本地工作负载、Azure\
  \ 以及其他云平台。有关连接器的详细信息，请访问以下链接：https://docs.microsoft.com/en-us/connectors/。\n\n我们建议您进一步研究这些功能，以确保在\
  \ Microsoft Sentinel 中引发警报和事件时能够自动触发操作，相关信息请访问：https://docs.microsoft.com/en-us/azure/logic-apps/logic-apps-overview。\n\
  \n### 总结\n\n如您所见，这里有许多机会可以继续学习，并贡献自己的专业知识来帮助他人。随着 Microsoft 为 Microsoft Sentinel\
  \ 添加新功能，请通过其博客和官方文档了解改进内容，然后将最适合的更改应用到您自己的实施中。\n\n我们鼓励您积极参与，并将自己的经验和专业知识传授给他人。正如我们在撰写本书的过程中所认识到的，只有分享自己的知识并听取他人的反馈，您才能真正掌握这一主题，并体会到还有多少内容值得学习！\n\
  \n## 评估\n\n### 第 1 章\n\n- 1. 用于协助发现和映射当前的安全解决方案，并规划未来状态。\n- 2. 三个主要组件是 Azure Monitor、Microsoft\
  \ Sentinel 和 Logic Apps。\n- 3. 主要平台包括身份和访问管理（IAM）、终结点检测和响应（EDR）、云访问安全代理（CASB）、云工作负载保护平台（CWPP）以及下一代防火墙（NGFW）。\n\
  - 4. 第三方解决方案提供商包括 AWS、Cisco、Palo Alto Networks、Fortinet 和 Symantec。\n- 5. 场景映射练习包含七个步骤。\n\
  \n### 第 2 章\n\n- 1. 查询语言的名称是 Kusto 查询语言（KQL）。\n- 2. Azure Lighthouse 支持集中管理多个 Azure\
  \ 租户，通常由托管服务提供商进行部署，但也可用于复杂环境。\n- 3. Log Analytics 中保护数据的一些方式包括由 Microsoft 管理的事件管理流程、数据保留和删除策略、按数据源类型进行管理，以及通过地理主权实现的数据分隔和隔离。\n\
  - 4. 可以通过 Web 门户、PowerShell 和命令行界面创建 Log Analytics 工作区。\n- 5. 应向工程师分配 Microsoft\
  \ Sentinel 参与者和 Log Analytics 读取者角色。\n\n\n\n\n\n2. 这需要查看 StormEvents 表并获取每个州的一个实例。对此使用\
  \ distinct 操作符：\n\n```\nStormEvents\n| distinct State\n```\n\n3. 你需要查看 StormEvents\
  \ 表中的 DamageProperty 字段，并确保该字段大于 10,000 且小于 15,000：\n\n```\nStormEvents\n| where\
  \ DamageProperty >10000 and DamageProperty <15000\n```\n\n4. StormEvents 表中已有四个列中的三个。第四列，即总损害金额，可以通过将\
  \ DamageProperty 列和 DamageCrop 属性相加来创建。在以下答案中，它被称为 TotalDamage，但实际上你怎么称呼它并不重要，只要在\
  \ extend 和 project 命令中使用相同的名称即可。如果将 extend 和 project 合并为一个则可获得额外分数。虽然这在 KQL 中完全合法，但如果你想再次使用该变量，则需要\
  \ extend，因为 project 只是输出结果：\n\n```\nStormEvents\n| extend TotalDamage = DamageCrops\
  \ + DamageProperty\n| project State, DamageProperty, DamageCrops, TotalDamage\n\
  ```\n\n## 第 6 章\n\n- 1. 你可以通过使用示例查询和查询资源管理器来查看预先制作的查询。\n- 2. 使用结果窗格顶部的筛选图标来显示特定计算结果，而无需更改查询。\n\
  - 3. 要预览日志条目，请转到表窗格，将鼠标悬停在所需日志上，然后单击眼睛图标。\n- 4. 要更改查看所有结果页面时每页的结果数，请转到页面设置，并将“每页行数”下拉菜单更改为\
  \ 200。\n- 5. 要更改查看单个结果页面时每页的结果数，请转到结果页脚，并将“每页项目数”下拉菜单更改为 200。\n\n- 4. 要获取警报的完整详细信息，请按照以下步骤操作：\n\
  - 5. 在事件列表中找到事件。\n- 6. 单击“查看完整详细信息”链接。\n- 7. 在“警报”选项卡中，单击警报的 ID。\n- 8. 查看事件的详细信息窗格，在“分析规则”条目下将有一个指向创建此事件的分析规则的链接。单击该链接即可进入分析规则的配置。\n\
  \n## 第 10 章\n\n- 1. 可以在实体行为中查看的三种实体类型是帐户、主机和 IP 地址。\n- 2. 可以在实体时间线中呈现的三种信息类型是警报、书签和活动。\n\
  - 3. 使用时间线内容筛选器并将其设置为仅显示活动。\n- 4. 可以通过以下方式创建自定义活动：\n  - 在实体设置页面单击“添加活动”链接。\n  -\
  \ 或者，选择即用型模板并在详细信息窗格中单击“创建活动”按钮。\n- 5. 可以用于创建自定义活动的两种实体类型是主机和帐户。\n\n## 第 11 章\n\n\
  - 1. 要运行单个狩猎查询，请选择查询，并在详细信息窗格中单击“运行查询”按钮。\n- 2. 要运行所有狩猎查询，请单击狩猎页面标题中的“运行所有查询”按钮。\n\
  - 3. 要查看单个狩猎查询的结果，请选择查询并在详细信息窗格中单击“查看查询结果”链接。\n- 4. 要创建新书签，请在日志页面上运行查询，选择要添加到书签的结果，然后单击“添加书签”按钮。\n\
  \n5. 要将书签与事件关联，可以使用两种方法之一：\n\n- 从书签创建新事件。\n- 或者，将书签添加到现有事件。\n\n## 第 12 章\n\n- 1.\
  \ 要将逻辑应用用作 Microsoft Sentinel 剧本，它必须使用 **Microsoft Sentinel 连接器**。\n- 2. 要判断剧本是否成功运行，请从\
  \ **剧本** 页面选择剧本，然后查看 **运行历史记录** 部分。\n- 3. 使用剧本的工作流获取事件信息时，使用 **Alert | Get Incident**\
  \ 操作并传入必要的参数。\n- 4. 动态内容是连接器或操作提供的、每次剧本实例运行时可能发生变化的信息 - 例如，在 *创建简单的 Microsoft Sentinel\
  \ 剧本* 部分中用于获取事件的 **系统警报 ID** 字段。\n- 5. 是的，你可以在一个字段中组合动态内容和静态内容。\n\n## 第 14 章\n\n\
  - 1. 两个角色是 SOC 工程师和 SOC 分析师。\n- 2. 两个角色都需要参与场景映射练习的执行。\n- 3. SOC 工程师应至少每月检查一次日志摄取速率和定价层。\n\
  - 4. SOC 分析师应每天检查 **事件** 页面。\n- 5. 你应该在实例创建的第一时间就开始查看日志摄取。这将提供最大程度的安全事件可见性。\n\n\
