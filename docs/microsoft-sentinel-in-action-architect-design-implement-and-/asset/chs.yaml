  \ | $690 | $600 | $360 | $1,650 |\n| 年度总计 | 3.6 TB | $8,280 | $7,200 | $2,160 |\
  \ $17,645 |\n| 2 年总计 | 7.2 TB | $16,560 | $14,400 | $8,820 | $39,780 |\n\n图 3.14\
  \ – 比较容量选项的示例定价表\n\n根据这些示例，运行 Microsoft Sentinel、每天摄取 10 GB 并将数据保留 2 年的总成本为 $39,780。数据保留占成本的\
  \ 22%。\n\n> 注意\n> 这些价格基于适用于美国东部 Azure 区域的当前费率，数字已四舍五入以简化。实际数据使用量每月可能有所波动。\n\n您可以使用\
  \ Azure 定价计算器进行自己的计算，它将考虑承诺层级、保留期，并为 Log Analytics 和 Microsoft Sentinel 提供合并成本。访问此\
  \ URL 并修改设置以查看不同的定价：https://azure.microsoft.com/en-us/pricing/calculator/。\n\n以下解决方案可作为\
  \ Log Analytics 之外的长期存储替代方案考虑：\n\n- **Azure Blob Storage**：您可以在 Azure Monitor 中创建查询，选择要从\
  \ Log Analytics 工作区移动的数据，并将其指向适当的 Azure 存储帐户。这允许按类型过滤信息（或选择全部），并且仅移动即将达到其生命周期结束的数据，即您为\
  \ Log Analytics 工作区中数据保留设定的限制。一旦查询定义完成，您可以使用 **Azure Automation** 运行 PowerShell\
  \ 并将结果作为 CSV 文件加载，然后复制到 **Azure Blob Storage**。使用此解决方案，数据可存储长达 400 年！有关更多信息，请参阅本文：https://docs.microsoft.com/en-us/azure/azure-monitor//powershell-samples。\n\
  - **Azure Data Explorer (ADX)**：使用扩展存储和归档额外安全数据的最常见方法是 Azure Data Explorer，它可实现长达\
  \ 100 年的扩展存储。使用此解决方案，您可以对摄取、编目、分析和呈现信息所需的存储和计算进行极大优化，同时全部使用您在 Microsoft Sentinel\
  \ 中使用的相同 **Kusto 查询语言 (KQL)** 查询。在配置此服务时，您可以根据执行调查的安全团队的需求在存储优化和计算优化实现之间进行选择。在安静时期，您可以优化存储保留，然后在需要进行深入调查时按需增加计算容量，以确保搜索查询的响应性。将此数据存储在\
  \ Microsoft Sentinel 中的平均成本节省约为十分之一。您可以使用在线计算器进行自己的价值计算：https://dataexplorer.azure.com/AzureDataExplorerCostEstimator.html。\n\
  \n正如您所见，有多种选项可将数据存储在替代位置，既用于扩展归档/保留，也用于使用替代工具进行额外分析。我们预计 Microsoft 将增加可用选项的数量。\n\
  \n本章将涵盖以下主题：\n\n- TI 简介\n- 了解 STIX 和 TAXII\n- 为您的需求选择合适的情报源\n- 实现 TI 连接器\n\n## TI\
  \ 简介\n\n由于网络安全性质复杂且现代攻击日益 sophisticated，任何组织都很难跟踪漏洞以及攻击者可能入侵系统的多种方式，尤其是当网络安全不是组织的重点时。了解要寻找什么以及在发现系统异常或其他潜在威胁时该做什么，是一项复杂且耗时的任务。这就是\
  \ TI 大显身手的地方。\n\nTI 在对抗对手的斗争中至关重要，现已集成到大多数安全产品中；它提供了设置检测和阻止恶意活动的指标列表的能力。您可以订阅 TI\
  \ 源，从行业其他安全专业人员那里获取知识，并创建特定于您所处环境的指标。\n\n如果您是该主题的新手，有一些新的关键词和缩写需要学习：\n\n- **威胁指标**：这是一份可疑或已知恶意实体的列表，例如\
  \ IP 地址、URL 和文件。它们用于在环境中发现内部文件或地址的可疑使用时发出警报。\n- **入侵指标 (IoCs)**：这表明已知且独特的可能表明恶意意图或实际入侵的行为和活动。这些指标有开源和付费服务。\n\
  - **警报定义**：通过组合多个威胁指标和 IoCs，您可以构建一个仅在正确上下文中触发的警报定义。这将减少因向 SOC 发送过多误报而导致的警报疲劳。\n\
  - **恶意软件信息共享项目 (MISP)**：这是一个开源 **威胁情报平台 (TIP)** 和威胁信息共享的开放标准集。MISP 涵盖恶意软件指标、欺诈和漏洞信息。阅读更多信息：https://www.misp-project.org/。\n\
  \n\n\n\n\n## 理解 STIX 和 TAXII\n\nMITRE 公司是一家非营利性公司，提供框架和标准形式的指导，以协助开发更强大的网络安全控制措施；STIX\
  \ 语言和 TAXII 协议就是这一开发工作的一些例子。\n\n这两个标准由一个开放的社区共同开发，由美国国土安全部（DHS）赞助，与 MITRE 公司合作。这些不是软件产品，而是产品可以使用的标准，以实现在与您的安全社区和业务合作伙伴共享\
  \ TI 信息时实现自动化和兼容性。\n\n根据 MITRE 提供的描述：*STIX 是一个协作的社区驱动的努力，旨在定义和开发一种标准化的语言来表示结构化的网络威胁信息。*\
  \ STIX 语言的开发是为了确保威胁信息能够以一致的方式共享、存储和使用，以促进自动化和人工辅助分析。您可以在此处阅读有关 STIX 标准的更多信息：https://stixproject.github.io/。\n\
  \nTAXII 协议的开发是为了支持来自开源情报（OSINT）和 TIP 的 TI 源，这些源支持该标准协议和 STIX 数据格式。您可以在此处阅读有关 TAXII\
  \ 协议的更多详细信息：https://www.mitre.org/sites/default/files/publications/taxii.pdf。\n\n\
  Microsoft 已开发了一个连接器，以实现与使用 TAXII 协议的服务的集成，从而能够摄取 STIX 2.0 威胁指标供 Microsoft Sentinel\
  \ 使用。\n\n> **公开预览**\n> \n> 由于敏捷开发的性质和常青云环境，Microsoft 首先通过私人预览向少数精选评审员提供新功能，然后发布到公开预览，以允许更广泛的受众参与反馈。您的组织需要确定是否可以接受在生产租户中使用预览功能，或将其访问限制为仅开发/测试环境。截至撰写本文时，TAXII\
  \ 数据连接器处于公开预览中。您可以在 Microsoft Sentinel 租户中查看可用数据连接器的列表，以查看它是否当前可用。\n\n在下一章中，我们将回顾情报源的选项，并选择最适合您组织需求的选项。\n\
  \n## 为您的需求选择合适的情报源\n\n借助 Microsoft Sentinel，您可以从多个来源导入 TI，以提高安全分析师识别和优先处理已知威胁和 IoC\
  \ 的能力。配置后，以下 Microsoft Sentinel 工具中将提供多个可选功能：\n\n- **分析**：提供包含 ThreatIntelligenceIndicator\
  \ 字段的能力，以确保分析规则可以将日志事件与已识别的域、电子邮件帐户、文件哈希、IP地址或 URL 匹配。\n- **工作簿**：创建了一个新的工作簿，用于显示摄取到\
  \ Microsoft Sentinel 中的 TI 的数量、类型和置信度，以及有多少警报是由匹配威胁指标的分析规则生成的。\n- **狩猎**：与分析规则类似，启用\
  \ TI 为狩猎查询提供将日志事件与 TI 信息进行比较的能力，使安全调查人员在狩猎场景中具有更大的能力。\n- **笔记本**：笔记本可用于集成 TI 的指导狩猎，这使分析师和安全调查人员能够寻找异常并搜寻恶意行为。\n\
  \n有几种可用的选项可以获取 TI 源，您也可以根据通过内部 IT 调查收集的特定信息生成自己的指标；这使您可以开发一个已知特定于您组织的指标的独特列表。根据您的行业和地区，您可以选择与合作伙伴组织和社区共享这些信息，以获取与医疗保健、政府、能源等相关的特定信息。\n\
  \n您可以选择利用与 **Microsoft Graph Security tiIndicator** API 的直接集成，其中包含 Microsoft 自己的\
  \ TI，收集自其庞大的互联网服务环境（例如 Azure、Office 365、Xbox 和 Outlook）。\n\n为了实现最广泛的情报范围，建议您还从开源平台获取\
  \ TI 源，例如以下内容：\n\n- MISP 开源 TIP\n- Palo Alto Networks 的 MineMeld\n- 任何基于 MITRE STIX/TAXII\
  \ 标准的内容\n\n- 概述\n- 开始使用\n- 预览功能\n- 诊断和解决问题\n\n## 管理\n\n- 用户\n- 组\n- 外部身份\n- 角色和管理员\n\
  - 管理单元\n- 企业应用程序\n- 设备\n- 应用注册\n- 身份治理\n- 应用程序代理\n- 许可证\n\n图 4.3 – Azure AD 应用注册\n\
  \n2. 在工具栏中，选择 + New registration，如以下屏幕截图所示：\n\n- + New registration\n- Endpoints\n\
  - Troubleshooting\n- Download\n- Preview features\n\n图 4.4 – 创建新的应用注册\n\n当您配置集成的\
  \ TIP 产品时，您将需要参考这些 ID 值。\n\n5. 接下来，我们将为我们注册的应用程序配置 API 权限。为此，请转到左侧菜单并选择 **API permissions**，如以下屏幕截图所示：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_119_0.png)\n\n图 4.7 – API 权限菜单选项\n\n\
  6. 创建时，将有默认权限 **User.Read**。选择 **+ Add a permission**。\n\n现在应用已在 Azure AD 中注册，我们可以在\
  \ TI 服务器/服务的注册过程中使用它来运行并向 Microsoft Sentinel 发送信息。\n\n接下来，我们可以开始配置 MineMeld 服务器，这涉及设置新的\
  \ **虚拟机（VM）** 来收集和转发 TI 源。\n\n## 配置 MineMeld TI 源\n\n完成之前的步骤后，您就可以配置将 TI 数据发送到 Microsoft\
  \ Sentinel 的服务。本节将指导您完成 MineMeld TI 共享解决方案的配置。\n\n> **注意**\n> 如果 MineMeld TI 服务器尚未在您的环境中运行，您将需要配置该产品；此指导仅适用于\
  \ Microsoft Sentinel 连接器。\n\n此过程包含三个步骤：\n\n- 1. 构建 VM 并安装 MineMeld\n- 2. 在 MineMeld\
  \ 中安装 Microsoft Graph Security API 扩展\n- 3. 配置扩展以通过 Security API 连接到 Microsoft Graph\n\
  \n要执行此操作，您需要对 Azure 租户和 MineMeld 服务具有管理员访问权限。\n\n## 构建 VM 并安装 MineMeld\n\n> **注意**\n\
  > 在测试时，有必要确保仅使用 Ubuntu 版本 16.04；其他版本可能不兼容。\n\n理想情况下，您已在环境中配置并运行 MineMeld VM；但是，如果没有，您可以通过\
  \ Palo Alto Networks 官方网站在线找到配置说明：https://live.paloaltonetworks.com/t5/MineMeld-Articles/Manually-Install-MineMeld-on-Ubuntu-16-04/ta-p/253336。\n\
  \n## 在 MineMeld 中安装 Microsoft Graph Security API 扩展\n\n以下是安装 API 扩展的步骤：\n\n- 1.\
  \ 登录 MineMeld Web 门户，然后转到 **SYSTEM** 然后 **EXTENSIONS**。\n- 2. 单击 Git 图标并输入以下地址：`https://github.com/PaloAltoNetworks/minemeld-msgraph-secapi.git.`\n\
  - 3. 单击 **RETRIEVE**，然后从下拉列表中选择 master 并单击 **INSTALL**，如以下屏幕截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_123_0.png)\n\
  \n图 4.12 – 从 Git 安装扩展\n\n4. 确认安装已完成，然后选择十字旁边的 **Activate** 按钮。为了确认激活，API 扩展应显示白色背景而不是灰色哈希背景，如以下屏幕截图所示：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_123_1.png)\n\n图 4.13 – 确认 API 扩展的安装\n\
  \n\n\n\n\n现在 Microsoft Graph Security API 扩展已在 MineMeld 服务器上设置完成，我们可以配置 Microsoft\
  \ Sentinel 连接器。\n\n## 配置 Microsoft Sentinel 连接器\n\n以下是配置 API 扩展的步骤：\n\n- 1. 登录 MineMeld\
  \ Web 门户。转到 CONFIG，然后选择页面底部的原型图标，即三条水平线（即汉堡菜单），如下图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_124_0.png)\n\
  \n图 4.14 – MineMeld 配置页面\n\n2. 如你所见，有很多选项可供选择。查看列表以了解可能想要实现的额外 TI 源，然后搜索 Microsoft\
  \ 并查看结果。选择名为 microsoft_graph_secapi.output 的原型：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_125_0.png)\n\
  \n图 4.15 – Microsoft 原型\n\n4. 在下一页，提供节点的名称，然后为 INPUTS 字段选择 inboundaggregator：\n\n\
  ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_127_0.png)\n\n图 4.17 – 配置新节点\n\n5. 通过查看节点列表确认新节点处于活动状态，如以下屏幕截图所示。选择页面顶部的\
  \ COMMIT 按钮。这将保存更改并重启流程以启用新功能：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_128_0.png)\n\
  \n图 4.18 – 确认新节点已添加\n\n6. 现在转到 NODES 选项卡并选择新的 API 扩展，然后输入来自 Azure AD 中之前注册的应用程序的相关详细信息（见图\
  \ 4.6）：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_129_0.png)\n\n图 4.19 – 为 Microsoft\
  \ Sentinel 配置 API 扩展\n\n7. 对于 **CLIENT SECRET** 字段，你需要在 Azure AD 应用中生成一个新的密钥。转到之前创建的\
  \ Azure AD 应用并选择 **Certificates & secrets**，然后选择 **+ New client secret** 并按照出现的步骤创建新的密钥（确保复制详细信息，因为你只有一次机会；否则，你需要再次生成新的客户端密钥）：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_130_0.png)\n\n图 4.20 – 创建新的客户端密钥\n\n\
  8. 将此新密钥添加到设置后，你应该会看到以下完成的屏幕：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_131_0.png)\n\
  \n图 4.21 – 完成配置\n\n至此，MineMeld 服务的配置要求已完成。TI 源现在应发送到你的 Microsoft Sentinel 实例。\n\n\
  ## 确认数据正在被 Microsoft Sentinel 接收使用\n\n要确认数据正在发送到 Microsoft Sentinel，请按照以下步骤操作：\n\
  \n- 1. 转到 Azure 门户，然后 Microsoft Sentinel。\n- 2. 选择 Logs。\n- 3. 在命令窗口中输入以下命令并选择 Run：\n\
  \n```\nThreatIntelligenceIndicator\n| take 100\n```\n\n4. 你应该会看到以下显示结果的屏幕：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_132_0.png)\n\
  \n图 4.22 – 检查 TI 源活动\n\n5. 以下屏幕截图显示了其中一个事件的详细信息示例：\n\nCompleted. Showing partial\
  \ results from the last 24 hours.\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_133_0.png)\n\
  \n图 4.23 – TI 数据源详细信息\n\n你现在已将 MineMeld 服务器配置并连接到你的 Microsoft Sentinel 工作区，并且可以看到\
  \ TI 数据源出现在日志中。你现在可以使用此信息来帮助在 Microsoft Sentinel 中创建新的分析和狩猎查询、笔记本和工作簿。\n\n我们建议定期审查以确保此信息既相关又经常更新。新的\
  \ TI 源会定期提供，你不想错过这些有用的信息，如果它可以帮助你找到新的和高级威胁。\n\n## 总结\n\n在本章中，我们探讨了 TI 的概念、新术语和解决方案选项，以及作为社区协作创建和共享\
  \ TI 源的概念。有多个选项可用于向 Microsoft Sentinel 添加 TI 源，我们知道 Microsoft 正在努力进一步开发此功能。TI 源将协助分析和检测不受欢迎的行为和潜在的恶意活动。选择范围很广，为组织选择合适的源是配置\
  \ Microsoft Sentinel 的重要部分。\n\n下一章将介绍 Kusto 查询语言（KQL），这是一种强大的手段，可搜索为 Microsoft Sentinel\
