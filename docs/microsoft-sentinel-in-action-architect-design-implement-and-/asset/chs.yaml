  ```\n\n要添加的角色\n\n在此处放置您的 AWS 角色 ARN\n\n| 角色 ARN | 最后收到的事件 |\n|---|---|\n| arn:aws:iam::881823274746:role/AzureSentinel\
  \ | 05/16/21, 05:19 PM |\n\n图 3.6 – 数据连接器配置说明\n\n如上面的截图所示，AWS 连接器具有以下两个关联的工作簿：\n\
