- "# 第 1 部分：\n设计和\n实施\n\n在本节中，你将对 Microsoft Sentinel 有一个概述，包括当前的云环境、云安全参考框架、安全运营中心\
  \ (SOC) 平台组件以及如何映射架构。你还将了解 Azure Monitor Log Analytics 资源，包括规划你的 Log Analytics 实例、如何创建新实例以及将其附加到\
  \ Microsoft Sentinel。\n\n本节包含以下章节：\n\n- 第 1 章，开始使用 Microsoft Sentinel\n- 第 2 章，Azure\
  \ Monitor – Log Analytics 简介\n\n- Microsoft Sentinel 的服务定价\n- 场景映射\n\n## 当前的云安全环境\n\
  \n要了解你的安全架构需求，你必须首先确保对你试图保护的 IT 环境有扎实的理解。在部署任何新的安全解决方案之前，需要绘制出当前部署的解决方案以及它们如何保护\
  \ IT 环境的各个区域。以下列表提供了任何现代 IT 环境的主要组件：\n\n- 不利于安全工作的终端用户习惯\n- 用于身份验证和授权系统访问的身份\n-\
  \ 用于访问内部资源和互联网的网络\n- 用于内部应用程序和敏感信息的数据中心中的存储和计算\n- 终端用户设备及其用于与数据交互的应用程序\n- 在某些环境中，你还可以包括工业控制系统\
  \ (ICS) 和物联网 (IoT)\n\n当我们开始查看这些组件的威胁和漏洞时，我们很快就会发现自己深陷于问题和解决方案的字母汤中。\n\n## 网络安全的字母汤\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_22_0.png)\n\n7. **物联网和工业控制系统：** ICS 通常在与企业环境隔离的情况下运行和维护，被称为\
  \ **信息技术/运营技术 (IT/OT)** 分隔。这些是高度定制的系统，可能存在数十年且不易更新或更换。网络和设备可能对任何延迟或扫描尝试高度敏感；推荐的方法是被动监控网络流量。\n\
  \n对物联网的引用是不同的，但相似；在这些系统中，将会有大量小型设备收集数据并控制关键业务功能，而无需在同一网络上工作。其中一些设备可以智能化以实现自动化；其他则是单用途的（振动或温度传感器）。从这些系统收集的数据量和速度可能非常高。如果可以从数据中获得有用信息，则考虑在将其摄取到\
  \ Microsoft Sentinel 进行分析和短期或长期保留之前先过滤信息。\n\n8. **私有云基础设施：** 这可能托管在本地服务器机房、专门设计的数据中心或第三方提供商处。该组件涉及的技术包括存储、网络、内部防火墙以及物理和虚拟服务器。数据中心是许多公司过去\
  \ 2-3 十年的支柱，但大多数现在正在转变为混合解决方案，结合云（公共）和本地（私有）解决方案的优点。这里的关键考虑是你可以收集多少日志数据并传输到云中以供\
  \ Microsoft Sentinel 摄取。我们将在 *第 3 章，管理和收集数据* 中更详细地介绍数据连接器。\n\nActive Directory 是应包含在此组件中的关键解决方案。它将被扩展到公共云基础设施（组件\
  \ 09）并在 *特权访问管理* 部分（组件 10）中进行处理。保护 Azure Active Directory 的最佳防御是部署 Microsoft Defender\
  \ for Identity 解决方案，微软专门为保护 Active Directory 域控制器而开发。\n\n9. **公共云基础设施：** 这些解决方案现在是大多数现代\
  \ IT 环境的主流，最初可能是现有本地虚拟化服务器工作负载的扩展、灾难恢复解决方案或由开发人员创建和维护的隔离环境。成熟的公共云部署将在创建和运营的整个生命周期中嵌入多层治理和安全。此组件可能包括\
  \ **基础设施即服务 (IaaS)、平台即服务 (PaaS) 和软件即服务 (SaaS)** 服务；每个公共云服务提供商都提供可集成到 Microsoft Sentinel\
  \ 的自身安全保护。\n\n\n\n\n\nSOC 的核心组件包括日志管理与 SIEM、SOAR、漏洞管理、威胁情报和事件响应。所有这些组件都由 Microsoft\
  \ Sentinel 的部署来解决。还需要集成其他解决方案，以提供其他 SOC 平台功能，例如入侵预防/检测、文件完整性监控和灾难恢复。\n\n使用 Microsoft\
  \ Sentinel 的 SOC 部署包含以下组件：\n\n- **Azure Monitor** 为数据收集和分析创建 Log Analytics 工作区。这些最初是为确保云规模的日志管理解决方案而创建的，适用于基于云的工作负载和基于物理数据中心的工作负载。一旦数据被收集，就可应用一系列解决方案来分析数据的健康、性能和安全状况。部分解决方案由\
  \ Microsoft 创建，其他则由合作伙伴创建。\n\n- **Microsoft Sentinel** 是为解决对云原生解决方案的需求而开发的，作为现有基于服务器的\
  \ SIEM 解决方案的替代方案，后者已成为过去十年安全和合规的主流。Microsoft Sentinel 建立在 Azure Monitor 和 Log Analytics\
  \ 的现有服务之上。它还与 Logic Apps 和 Azure Data Explorer 等其他服务集成。\n\n云服务的普及提供了一些关键优势，包括降低存储成本、快速扩展计算、自动化服务维护，以及随着\
  \ Microsoft 根据客户和合作伙伴反馈创建新功能而实现持续改进。\n\n部署 Microsoft Sentinel 的即时好处之一是无需在支持基础设施（如服务器、存储和复杂许可）上进行昂贵投资即可快速启用。Microsoft\
  \ Sentinel 服务按数据消耗计费，每月每千兆字节计费。这允许初始部署从小规模开始，并在需要时增长，直到实现全面部署和成熟度。\n\n持续维护也变得更加简单，因为无需维护服务器或续订许可证。您需要确保通过审查数据的摄取和保留的相关性和适用性来定期优化解决方案。这将保持成本合理并提高用于威胁狩猎的数据质量。\n\
  \n- **Logic Apps** 可与大量企业解决方案集成，确保工作流在多个云平台之间以及与现有本地解决方案之间保持连接。这是平台集成和自动化（SOAR）能力的重要组成部分。\n\
  \nLogic Apps 是一种基于标准的解决方案，提供强大的功能集。如果您已投资其中一个平台，也可以使用第三方 SOAR 解决方案。\n\nSOC 平台组件是一个起点，但在\
  \ SOC 实施中您可能还希望部署其他多个服务。在下一节中，我们将研究一种映射 SOC 架构当前状态和需求的方法。\n\n## 映射 SOC 架构\n\n为了为您的\
  \ SOC 平台实施一个连贯的技术解决方案，您需要确保以下组件得到审查并彻底实施。这最好定期进行，并通过渗透测试专家定期测试每个能力的强度，他们将提供反馈和指导以帮助改进任何弱点。\n\
  \n## 日志管理与数据源\n\nSOC 平台的第一个组件是从 IT 环境中多样化的系统和服务收集和存储日志数据。这需要仔细规划，以确保您收集和保留最合适的数据。我们可以从其他完善的大数据指导中借鉴的一些关键考虑因素如下：\n\
  \n- **Variety**：您需要确保从多个来源获取数据馈送，以在整个组织中硬件和软件解决方案的光谱范围内获得可见性。\n- **Volume**：体积过大可能会导致高昂的摄取和存储费用；过小可能会错过一些可能导致无法完全分析入侵的重要事件。\n\
  - **Velocity**：收集实时数据对于减少响应时间至关重要，但同样重要的是数据也必须实时处理和分析。\n- **Value/veracity**：数据质量对于理解含义很重要；过多的噪音会阻碍调查。\n\
  - **Validity**：准确性和完整性必须得到验证，以确保可以做出正确的决策。\n- **Volatility**：数据有多长时间有用？并非所有数据都需要长期保留；在分析后，部分数据可以快速丢弃。\n\
  - **Vulnerability**：某些数据比其他数据更敏感，当在同一位置收集并关联在一起时，可能成为潜在攻击者极其宝贵的数据来源。\n- **Visualization**：人类对数据的解释需要一定程度的可视化。了解如何向相关受众展示这些信息是报告的关键要求。\n\
  \nMicrosoft Sentinel 提供一系列数据连接器，以确保所有类型的数据都可以被摄取和分析。Azure Monitor 的保护将在 *第 2 章，Azure\
  \ Monitor – Log Analytics 简介* 中介绍，连接器详细信息将在 *第 3 章，管理和收集数据* 中提供。\n\n## 运营平台\n\n\
  传统上，SIEM 用于查看所有日志数据并对其进行推理，寻找跨多样化技术范围的任何潜在威胁。如今，有多个平台可用于执行自我监控和警报功能，就像 SIEM 的工作方式一样，只是它们是针对特定专业领域而设计的。每个平台可能会自行进行日志收集和分析，提供特定的威胁情报和漏洞扫描，并使用机器学习算法检测用户和系统行为模式的变化。如果它们是高级系统，它们还将提供对检测到的威胁做出反应的自动化响应级别。\n\
  \n以下每个解决方案都内置了一系列功能，用于收集和分析日志、执行即时补救措施，并将发现报告给 SIEM 以供进一步调查和交叉分析：\n\n- **身份和访问管理\
  \ (IAM)**：IAM 解决方案可能由多个解决方案组成，结合起来以确保从创建到销毁的身份全生命周期管理。IAM 系统应包括治理操作，例如审批、证明以及组成员资格和权限管理的自动化清理。IAM\
  \ 还涵盖实施多因素身份验证的能力：一种挑战登录过程的方法，以提供超出简单用户 ID 和密码组合的验证。管理员执行的所有操作和用户驱动的活动都应记录并报告给 SIEM\
  \ 以提供上下文和终端用户行为分析。\n\nCASB 将附带许多连接器，可深度集成到云服务中，并连接到 IAM 系统以帮助管理对其他云服务的访问（通过单点登录（SSO）），充当反向代理并强制执行基于会话的控制。CASB\
  \ 还将提供许多检测规则模板以立即部署，并提供定义适用于您组织独特且几乎无限用例的自定义规则的能力。CASB 的响应能力取决于您与相关云服务的特定集成；这些可以包括限制或撤销对云服务的访问、防止文档的上传或下载，或将特定文档从他人的视野中隐藏。\n\
  \n- **云工作负载保护平台 (CWPP)**：CWPP 也可能被称为 **云安全态势管理 (CSPM)** 解决方案。两者都将提供扫描和持续监控系统的独特能力，以确保它们符合合规性和治理要求。该解决方案为漏洞扫描和在多个云服务（例如\
  \ **Amazon Web Services (AWS)** 和 **Microsoft Azure**）中进行持续审计提供集中方法，同时集中策略和补救措施。这些服务中的资源可以通过实施策略和技术（包括\
  \ **即时 (JIT)** 访问和 **攻击面减少 (ASR)**）来保护。\n\n当这些解决方案部署时，我们就少了一个 SIEM 需要提供的功能；相反，它可以从服务获取信息以了解潜在风险，并为补救措施提供集成点。\n\
  \n- **下一代防火墙 (NGFW)**：防火墙自 1980 年代以来一直是网络安全的支柱，仍然是内部网络分段和隔离的核心组件，也是许多面向互联网服务的入口。随着\
  \ NGFW，您不仅可以获得以前防火墙技术的全部好处，还可以对应用层安全进行深度数据包检查并集成入侵检测/预防系统。部署 NGFW 解决方案还将有助于检测和补救网络上的恶意软件和高级威胁，防止其传播到更多主机和基于网络的系统。\n\
  \n\n\n\n\n从这些示例可以看出，需要部署 SIEM 来完成集中收集和分析日志的所有工作的做法已成为过去。随着这些针对各自专业领域进行管理的先进解决方案的部署，SIEM\
  \ 的重点转变为在各解决方案之间查找常见模式，以及监控这些单独解决方案未覆盖的系统。以 Microsoft Sentinel 作为 SIEM，它还将充当 SOAR，实现对每个单独解决方案中威胁的协调响应，避免每次警报、报告和响应需求发生变化时都需要重新设计它们。\n\
  \n## 威胁情报和威胁狩猎\n\n威胁情报为收集到的日志数据提供了额外的上下文。知道在日志中寻找什么以及如何识别严重事件，需要威胁狩猎技能与来自深耕网络犯罪研究领域的各类专家持续的情报源相结合。其中许多工作都通过人工智能（AI）平台得到增强；然而，人类的参与始终是必需的，以增加那种直觉元素，许多侦探和警察会告诉你，他们在执法调查中工作时会产生这种感觉。\n\
  \n## SOC 映射总结\n\n下图提供了构成 SOC 架构的多个组件的汇总，并对实施每个组件提出了一些额外建议：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_32_0.png)\n\
  \n该解决方案在有丰富的日志数据流向日志管理解决方案时效果最佳，并与来自威胁情报和漏洞扫描及数据库的数据源相连。这些信息用于发现和威胁狩猎，并可能表明配置漂移的任何问题。SOC\
  \ 运营的核心解决方案包括 SIEM、CASB 和 EDR 等，每个解决方案都有其自己的 **End User Behavior Analytics (EUBA)**\
  \ 和 SOAR 能力。集成这些解决方案是减少噪音并提高响应速度的关键步骤。结果应能够准确报告当前风险状况、合规状态，并在需要立即响应和准确数据的情况下清晰沟通。\n\
  \n## 安全解决方案集成\n\nMicrosoft Sentinel 设计为可与多个安全解决方案协同工作，而不仅仅是微软开发的解决方案。\n\n在最基本层面，任何可以通过\
  \ Syslog 收集器传输日志的系统都可实现日志收集和分析。支持 CEF 编码 Syslog 端点并共享 Windows 事件日志的系统可提供更详细的日志。然而，首选方法是直接通过\
  \ API 集成，以实现双向通信并帮助管理集成解决方案。有关这些选项的更多详细信息包含在 *Chapter 3, Managing and Collecting\
  \ Data.* 中。\n\n> **Common Event Format (CEF)**\n> \n> CEF 是一种应用于 Syslog 消息的行业标准格式，被大多数安全厂商采用以确保平台间的通用性。Microsoft\
  \ Sentinel 提供集成以便轻松对 CEF 数据运行分析和查询。有关 Microsoft Sentinel CEF 源配置的完整列表，请查看 https://aka.ms/SentinelGrandlist\
  \ 上的文章。\n\n## 与 Amazon Web Services (AWS) 集成\n\n**AWS** 为平台上的大多数功能提供 API 访问，这使得\
  \ Microsoft Sentinel 成为丰富的集成解决方案。以下列表提供了如果在 AWS 账户中启用，应与 Microsoft Sentinel 集成的一些常见资源：\n\
  \n- AWS CloudTrail 日志提供 AWS 用户活动的洞察，包括失败的登录尝试、IP地址、区域、用户代理和身份类型，以及使用假设角色的潜在恶意用户活动。\n\
  - AWS CloudTrail 日志还提供与网络相关资源的活动，包括安全组、网络 **access control lists (ACLs)** 和路由、网关、弹性负载均衡器、\
  \ **Virtual Private Cloud (VPC)**、子网和网络接口的创建、更新和删除。\n\n部署在 AWS 账户中的某些资源可以配置为直接将日志发送到\
  \ Microsoft Sentinel（如 Windows 事件日志）。您还可以在 AWS 账户中部署日志收集器（Syslog、CEF 或 Logstash）以集中日志收集，就像您为私有数据中心所做的那样。\n\
  \n## 与 Google Cloud Platform (GCP) 集成\n\nGoogle 为 **GCP** 和 G Suite 解决方案的大多数功能提供\
  \ API 访问。G Suite Connector 目前正在开发中。如果您管理 G Suite 或 **GCP** 实例并希望使用 Microsoft Sentinel\
  \ 来保护它们，您应考虑以下选项（直到完全支持的连接器可用）：\n\n- REST API——该功能仍在开发中；发布后，您将能够创建自己的调查查询。\n- 部署\
  \ CASB 解决方案，该解决方案可以与 GCP 日志交互、控制会话访问并将相关信息转发到 Microsoft Sentinel。\n- 部署 Syslog、CEF\
  \ 或 Logstash 等日志收集器。确保所有部署的资源可以通过日志收集器将日志转发到 Microsoft Sentinel。\n\n## 与 Microsoft\
  \ Azure 集成\n\n**Microsoft Azure** 平台可与许多 Microsoft 安全解决方案直接集成，且每月都在增加：\n\n- Azure\
  \ Active Directory，用于收集审计和登录日志，以获取有关应用使用、条件访问策略、旧版身份验证、自助密码重置使用情况以及用户、组、角色和应用管理的洞察。\n\
  - Azure Active Directory Identity Protection，提供用户和登录风险事件和漏洞，并能够立即缓解这些风险。\n- Azure\
  \ Activity，提供有关订阅级事件的洞察，例如 Azure Resource Manager、服务运行状况、资源上的写入操作以及在 Azure 中执行活动的状态。\n\
  - Azure DDoS Protection，用于保护可能通过 **DDoS** 攻击的 Web 服务。\n- Microsoft Defender，用于跨\
  \ Azure、AWS、GCP 和混合部署进行安全管理的集成 CWPP。\n- Microsoft Defender for IoT，提供物联网和 OT 网络的洞察，并根据风险严重程度提供建议。\n\
  - Azure Firewall，受管理的基于云的网络安全服务，用于保护 Azure 虚拟网络。\n- Microsoft Information Protection，用于分类并选择性地保护敏感信息。\n\
  - Azure Key Vault，用于安全存储和访问密钥，包括 API 密钥、密码、证书或加密密钥。\n- **Azure Kubernetes Service\
  \ (AKS)**，一种开源、完全托管的容器编排服务，用于管理和部署 Docker 容器。\n- Azure SQL Database，一种完全托管的 PaaS\
  \ 数据库引擎。此连接器可让您将审计和诊断日志流式传输到 Microsoft Sentinel。\n- Azure 存储账户，用于现代数据存储场景的云解决方案。\n\
  - DNS，用于改进对尝试解析恶意域名、话痨 DNS 客户端和其他 DNS 健康相关事件的客户端的调查。\n- Dynamics 365，提供有关该平台上管理员、用户和支持活动的洞察。\n\
  \nAzure Monitor 和 Microsoft Sentinel 的成本由消耗的数据量计算得出，这直接受连接器影响：您连接的信息类型以及每个节点产生的数据量。这可能在整个月内每天有所变化，因为您的基础设施和云服务中的活动发生变化。一些客户注意到基于客户销售波动或在遭受\
  \ DDoS 攻击时发生了变化。\n\n定价还受数据在 Microsoft Sentinel 中保留时间的影响。默认值为 90 天，但可延长至最长 2 年。大多数安全运营需要\
  \ 6 至 12 个月的热数据保留。在设定的保留期后，使用 Azure Data Explorer (ADX) 保留数据所需的时间（最长 99 年）。\n\n\
  初始定价选项是按使用付费（PAYG）。使用此选项，您按每千兆字节（GB）摄取的固定价格付费，按每日计费。微软已提供承诺不同用量层级的选项，以换取基于更大数据量的折扣。\n\
  \n值得注意的是，微软已提供一些不产生数据摄取成本的连接器。这些连接器的数据可能占您总数据摄取量的 10-20%，从而降低总体成本。目前，以下数据连接器不收取摄取费用（通常免费摄取仅限于警报；某些连接器确实提供完整的数据摄取）。详情请参见：https://azure.microsoft.com/en-us/pricing/details/azure-sentinel/#faq。\n\
  \n- Azure Activity（Azure 操作的活动日志）\n- Azure Active Directory Identity Protection（适用于具有\
  \ Azure Active Directory P2 许可证的租户）\n- Microsoft Information Protection\n- Microsoft\
  \ Defender\n- Azure Security Center\n- Microsoft 365 Defender\n- Microsoft Defender\
  \ for Cloud Apps\n- Microsoft Defender for Endpoint\n- Microsoft Defender for Office\
  \ 365\n- Microsoft Defender for Identity\n- Office 365 audit logs（所有 Teams、Exchange\
  \ 管理员和 SharePoint 活动日志）\n\n\n\n\n定价按每日即用即付（PAYG）方式计费，基于实际数据消耗量。当定期引入的数据量达到预留限制时，可使用容量承诺层级获得折扣定价：\n\
  \n- 100 GB\n- 200 GB\n- 300 GB\n- 400 GB\n- 500 GB\n- 1,000 GB (1 TB)\n- 2,000 GB\
  \ (2 TB)\n- 5,000 GB (5 TB)\n\n使用容量预留时，每日在该层级为数据支付固定价格，超出该层级的部分按每GB的PAYG价格计费。PAYG定价设置为与承诺层级折扣价格相同的金额。当你计算定价层级时，当预留费用低于按PAYG定价支付的费用时（通常在50%到80%之间），升级到下一层级在经济上是合理的。\n\
  \n例如，如果平均每天引入130 GB数据，你将按每GB固定价格支付前100 GB，然后为额外30 GB按每GB的PAYG价格付费（例如每天=296美元）。现在，如果将每日使用量增加到185\
  \ GB，将计划升级到200 GB选项（例如每天=276美元）并为额外容量付费，而不是支付100 GB（固定）+85 GB（PAYG）（每天总计=384.80美元），这样会更省钱。\n\
  \n当你查看正在使用的数据量时，可能会发现随着解决方案扩展以覆盖更多安全领域，每月消耗的数据量呈增长趋势。当你接近下一个层级时，应考虑更改定价模式；你可以每30天更改一次。\n\
  \n接下来要考虑的成本管理领域是Microsoft Sentinel数据的保留和长期存储。默认情况下，上述定价包含90天的保留期。对于某些公司来说，这足以确保对其环境中过去3个月活动的可见性；而对于其他公司，则需要更长时间保留这些数据，有时根据所在国家或行业的监管要求需要保留2到7年。有两种主要的长期数据保留方式，应根据价格和技术要求综合考虑并选择：\n\
  \n- **Azure Monitor**：这是Microsoft Sentinel的原生存储，提供默认90天的热存储选项，可升级为将热数据存储长达2年。\n\n\
  \  **优点**：数据在Azure Monitor中在线可用，可使用KQL搜索直接查询，并且可以筛选数据，仅保留必要信息。\n\n  **缺点**：与其他选项相比，这可能是最昂贵的每GB选项。\n\
  \n- **Azure Data Explorer (ADX)**：此解决方案可以无限期保留数据；定价基于数据量和执行搜索所需的计算量组合。通常，长期存储的成本约为Microsoft\
  \ Sentinel的十分之一。\n\n  **优点**：数据在Azure中在线可用，可使用KQL搜索直接查询。数据可被筛选以仅保留必要信息。\n\n  **缺点**：这是一项独立服务，对于不支持的表需要一些初始配置和集成工作。\n\
  \n- **其他存储选项**：可以使用基于云或基于物理的存储解决方案来无限期存储数据，通常通过*事件中心*或*Azure存储*发送数据来实现。\n\n  **优点**：可从各种合作伙伴处获得更便宜的选项。\n\
  \n  **缺点**：如果将数据发送到Azure之外，将产生额外费用，且Microsoft Sentinel无法查询这些数据。使用这些数据需要实施另一个解决方案，以便在需要时查询数据。\n\
  \n这些组件在不同部署中差异很大，因此你需要在设计中开展此项研究。此外，还要研究最新的区域可用性，并确认Microsoft Sentinel是否在各种政府云（例如中国）中得到支持。\n\
  \n## 情景映射\n\n在本章的最后一节，我们将探讨SOC开发的一个重要部分：情景映射。该过程定期执行，以确保工具和流程针对有效分析进行调整，并具有正确的数据流，以及响应得到良好定义，确保在检测到潜在和实际威胁时采取适当行动。为了使这项演练有效，我们建议让一系列具备不同技能和观点的人员参与，包括技术与非技术人员。你还可以邀请在威胁狩猎、防御和攻击技术方面具有特定技能和经验的外部顾问参与。\n\
  \n以下流程作为起点提供。我们鼓励你定义自己的情景映射方法，并在每次演练后不断改进。\n\n### 第1步 – 定义新情景\n\n在第一步中，我们一次阐述一个情景；你可能需要使用电子表格或其他文档方法来确保信息被收集、审查并根据需要更新：\n\
  \n- **影响分析**：这是基于后续组件的完整分析摘要。你可能需要提供一个评分系统，以确保根据潜在影响的严重程度，按优先级顺序处理安全控制的实施。\n\n-\
  \ **风险与可能性**：虽然某些情景一旦发生会带来很高的灾难风险，但我们也必须将该风险与其发生的可能性进行权衡。风险计算有助于证明缓解风险所需的预算和控制措施是合理的，但请记住，你不太可能实现完全缓解，并且始终需要优先安排你所拥有的资源来实施控制措施。\n\
  \n- **成本与价值评估**：评估资源对你组织的价值以及保护它的成本。这可以是货币价值或IT安全预算的百分比，也可以是其他可定义的指标，例如时间和精力。如果成本超过价值，你可能需要找到更经济实惠的方式来保护该资源。\n\
  \n### 第5步 – 哪些操作会立即发生？\n\n由于我们的目标是最大限度地实现检测和响应的自动化，请考虑应立即执行哪些操作，然后专注于实现这些操作的自动化。\n\
  \n操作可能包括：\n\n- 记录日志和发出警报\n- 通知/警告最终用户\n- 阻止该操作\n- 提供替代选项/操作\n- 触发工作流\n\n### 第6步\
  \ – 严重级别和输出\n\n在此步骤中，你应该能够根据前几个步骤中的影响分析，分配一个数字来关联严重级别。对于每个严重级别，定义所需的适当输出：\n\n- **级别0**\
  \ – 日志和报告\n- **级别1** – 仪表板通知\n- **级别2** – 在工单系统中生成事件\n- **级别3** – 向群组/个人发送警报\n-\
  \ **级别4** – 自动升级到高级管理团队（警笛和闪光灯是可选的！）\n\n### 第7步 – 分析师应采取什么行动？\n\n而*第5步 – 哪些操作会立即发生？*部分是自动化操作，此步骤则定义了安全分析师应该做什么。对于每个情景，定义应采取哪些行动，以确保适当的响应、修复和恢复。\n\
  \n下图是一个简单参考图表，可在情景映射演练中使用：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_46_0.png)\n\
  \n图1.4 – 情景映射过程\n\n通过遵循这个七步流程，你的团队可以为任何可能性做好更好的准备。通过遵循可重复的流程，并每次改进该流程，你的团队可以相互分享知识，并进行测试，以确保防护和检测高效且有效，同时识别解决方案中必须优先处理的新差距。\n\
  \n你应该承诺离开电脑，抽出时间定期开展此类桌面演练。有些组织每年仅进行一次，而其他组织则根据其系统和公司文化中看到的需求，每周进行一次或按需进行。\n\n\n\
  \n"
- "## 2 Azure Monitor – Log Analytics 简介\n\n在本章中，我们将探索 Azure Monitor Log Analytics\
  \ 平台，该平台用于存储将由 Microsoft Sentinel 分析的所有日志数据。这是实施 Microsoft Sentinel 时需要设计和配置的第一个组件，并且需要一些持续的维护来配置数据存储选项并控制与解决方案相关的成本。\n\
  \n本章还将解释如何使用 Azure 门户、PowerShell 和 CLI 创建新的 Log Analytics 工作区。创建工作区后，我们将学习如何将各种资源附加到工作区，以便收集信息，并将探索其他导航菜单选项。\n\
  \n我们将在本章中涵盖以下主题：\n\n- Azure Monitor Log Analytics 简介\n- 使用门户创建工作区\n- 使用 PowerShell\
  \ 或 CLI 创建工作区\n\n一旦创建，工作区可用于从许多不同来源收集信息，包括以下来源：\n\n- 同一订阅中的 Azure 资源\n- 不同订阅中的 Azure\
  \ 资源\n- 来自其他云服务的数据（例如**Amazon Web Services**和**Google Cloud Platform**）\n- 来自您的私有数据中心的数据（本地或第三方托管）\n\
  - 来自本地资源的数据（通过安全的互联网连接）\n- 来自物联网和工业控制系统的数据\n\n为了保护收集的数据，该解决方案内置了安全和治理控制；Log Analytics\
  \ 服务在安全的云数据存储库中管理您的数据，并确保数据通过多层保护得到保障，包括以下内容：\n\n- 数据隔离和隔离，具有地理主权\n- 按数据源类型的数据保留和删除策略\n\
  - 继承自 Azure 订阅（商业和政府）的物理安全国际认证标准\n- Microsoft 管理的突发事件处理流程\n- 对多种合规性和监管标准的认证符合性\n\
  - 用于将数据发送到 Log Analytics 的安全通道；通过端口443使用基于证书的身份验证进行SSL加密\n- 由客户管理的工作区和基于角色的访问权限；本章稍后将提供更多详细信息\n\
  \n有关数据安全方式的更多信息，我们建议阅读微软官方文档：https://docs.microsoft.com/en-us/azure/azure-monitor/logs/data-security。\n\
  \n## 规划工作区\n\n虽然直接去创建工作区很容易，但最好事先规划好工作区配置，以避免之后返工。需要考虑的一些方面包括：\n\n- **工作区的名称**：在整个\
  \ Azure 中必须是唯一的。名称应具有足够的描述性，以便仅通过查看名称就能了解该工作区提供的服务。建议在名称中包含您的公司名称和`Sentinel`一词。\n\
  \n如果担心这个名称会使它成为恶意行为者更大的目标，请使用任何有意义的并符合公司标准的命名约定。有关 Azure 命名最佳实践的详细信息，请使用此链接：https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/ready/azure-best-practices/naming-and-tagging。\n\
  \n- **工作区所属的订阅**：建议仅为 Microsoft Sentinel 使用创建一个单独的订阅，以限制对其的访问。如果这不可行，请选择一个合适的订阅来使用。\n\
  \n- **工作区的位置**：工作区应与其提供数据的资源位于同一位置，以防止将数据从一个位置发送到另一个位置时会产生出口费用。大公司很可能在许多不同位置都有资源，在这种情况下，使用资源最多且工作区价格最低的位置是合理的。请记住，可能有一些法律规定了数据必须驻留的位置。\n\
  \n有关 Log Analytics 定价的更多信息，请参阅 https://azure.microsoft.com/en-us/pricing/details/monitor。\n\
  \n- **工作区将位于哪个资源组**：建议所有 Microsoft Sentinel 资源都位于同一资源组中，尽管这不是硬性规定。如果将所有工作区放在一个资源组、Microsoft\
  \ Sentinel 放在另一个资源组、工作簿放在第三个资源组中更有意义，那么就这样做。这完全不会影响 Microsoft Sentinel 的性能。\n\n\
  - **使用哪个定价层**：如果用于容纳工作区的订阅在2018年4月2日之前创建过工作区，或者该订阅是2019年2月1日之前生效的 Microsoft 企业协议的一部分，您将继续访问旧版定价层。否则，只会显示**Per\
  \ GB (2018)**，并且按 GB 对数据摄取和保留收费。旧版选项如下：\n\n- **免费**：摄取的数据不收费，但每日限制为500 MB，数据仅保留7天。这仅可用于实验室和研究目的。\n\
  - **独立（按 GB）**：与**Per GB (2018)**相同。\n- **按节点 (OMS)**：如果已购买**OMS E1 套件**、**OMS E2\
  \ 套件**或**适用于 System Center 的 OMS 附加组件**，则使用此选项，以使用这些购买带来的授权。\n\n在创建工作区之前对其进行规划非常重要。确保选择一个唯一且有意义的名称、合适的位置以避免出口费用、正确的资源组，并在部署前做出其他决定，这将使您免于沮丧或以后的完全返工。Tiander\
  \ Turpijn 写了一篇关于这个主题的非常好的文章：https://techcommunity.microsoft.com/t5/azure-sentinel/best-practices-for-designing-an-azure-sentinel-or-azure-security/ba-p/832574。\n\
  \n## 使用门户创建工作区\n\n本节将描述如何使用 Azure 门户创建 Log Analytics 工作区。这是稍后讨论的 PowerShell 和 CLI\
  \ 命令的图形化表示，因此可能是开始使用工作区的最简单方式：\n\n1. 在 Azure 门户中，在屏幕顶部的搜索栏中输入`Log Analytics workspaces`。这将显示与输入的搜索词相关的服务列表。找到并单击**Log\
  \ Analytics workspaces**链接。\n2. 单击**添加**按钮以创建工作区：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_55_0.png)\n\
  \n图 2.2 – 创建新的 Log Analytics 工作区\n\n3. 在新的边栏选项卡中输入所需的值：\n\n- A. 输入工作区的名称。\n- B.\
  \ 选择此工作区将驻留的**订阅**。\n- C. 为此工作区选择**资源组**。\n- D. 选择此工作区将驻留的**位置**。\n- E. 对于**定价层**选项，将自动选择**Per\
  \ GB (2018)**。\n\n边栏选项卡将如下所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_56_0.png)\n\
  \n图 2.3 – Log Analytics 工作区选项\n\n4. 当所有值都填写完毕后，单击屏幕底部的**确定**按钮以继续。即使按钮会变为**正在验证**，它也会在后台创建工作区。\n\
  \n5. 创建工作区后，您将返回所有工作区的列表。您可能需要刷新此列表以查看新的工作区。\n\n这就是使用 Azure 门户创建 workspace 的全部内容。虽然这非常容易，但有时您可能希望使用命令行操作来执行相同的操作，这将在接下来描述。\n\
  \n## 使用 PowerShell 或 CLI 创建工作区\n\n有时您需要能够一致地重新创建 Azure Sentinel 环境。也许您只是在测试各种配置选项，为一家国际公司的许多不同订阅创建环境，或者为客户创建实例。无论原因如何，如果您需要创建许多相同的\
  \ Microsoft Sentinel 环境，使用 PowerShell 或**命令行界面 (CLI)** 比在 Azure 门户中操作更好。\n\n###\
  \ 创建 Azure 资源管理模板\n\n在本实验中使用 PowerShell 创建新的 Log Analytics 工作区时，您将使用**Azure 资源管理\
  \ (ARM)** 模板来执行实际配置。虽然您可以直接使用这两种技术中的任何一种来创建工作区，但使用 ARM 模板提供了额外的好处，包括能够轻松地重新创建工作区、在\
  \ DevOps 工作流中使用 ARM 模板，或在 Azure Blueprints 中使用它。\n\n> **注意**\n> \n> 对 ARM 模板的完整讨论超出了本实验的范围，但简而言之，ARM\
  \ 模板是一个描述需要在 Azure 中创建什么的 JSON 文件。它包含参数，即用户将提供的用于确定名称、位置和定价层等项的值。它还可以有变量，即可用于确定其他值的内部值。它还将有一个或多个资源的列表，即要创建的\
  \ Azure 资源。\n\n转到 `https://docs.microsoft.com/en-us/azure/azure-monitor/platform/template-workspace-configuration`\
  \ 并复制 JSON 文本。您将把它粘贴到稍后创建的文件中。\n\n在此示例中，系统将提示您输入工作区名称和位置，但由于存在`defaultValue`条目，定价层将默认为`pergb2018`。如果您不希望使用这些默认值，您可以更改显示的值，或删除整个`defaultValue`行（包括末尾的逗号），在这种情况下，执行命令时将提示您输入这些值。\n\
  \n\n\n\n\n> Note\n> 如果你想在自己的电脑上而不是通过 Azure 门户运行，请访问 https://docs.microsoft.com/en-us/powershell/azure/install-az-ps\
  \ 以了解如何安装 Azure PowerShell 模块，或访问 https://docs.microsoft.com/en-us/cli/azure/install-azure-cli?view=azure-cli-latest\
  \ 安装 Azure CLI 模块。\n\nCloud Shell 加载完成后，输入以下内容：\n\n```\ncode deployworkspacetemplate.json\n\
  ```\n\n这将启动可在 Cloud Shell 中使用的 Visual Studio Code 版本。输入前述代码段中的代码。在屏幕右侧，点击上下文菜单并点击保存。然后你可以点击\
  \ X 关闭编辑器，或点击上下文菜单并点击关闭编辑器：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_59_0.png)\n\
  \n图 2.6 – 使用 JSON 模板进行 PowerShell 部署\n\n这就是如何使用 CLI 创建新的 Log Analytics ARM 模板的方法。这是我们在以下各节中用于创建新工作区的外部文件。\n\
  \n## 使用 PowerShell\n\nPowerShell 是一种脚本语言，可在各种机器上使用，包括 Windows 和 Linux 计算机，并建立在 .NET\
  \ 之上。正因如此，它可以接受 .NET 对象，使其功能强大无比。PowerShell 拥有许多不同的命令，其中一些专门用于与 Azure 协作，我们将在此处使用它们。\n\
  \n按照以下步骤使用 PowerShell 创建新的工作区：\n\n- 1. 确定工作区将驻留在哪个资源组中。如果已有资源组，请跳至步骤 3。\n- 2. 要创建新的资源组，运行此命令：\n\
  - 3. 输入以下命令：\n- 4. 你将被提示输入 Log Analytics 工作区名称。输入有效名称并按 Enter 继续。\n- 5. 命令运行完成后，将显示成功屏幕，其中包含所使用值的摘要，如下所示：\n\
  \n```\nNew-AzResourceGroup -Name <resource-group-name> -Location <location>\n```\n\
  \n将 <resource-group-name> 替换为新资源组的名称，将 <location> 替换为资源组所在的位置，例如 EastUS 或 WestUS。如果不知道位置应使用什么，运行此命令：\n\
  \n```\nGet-AzLocation\n```\n\n找到所需的位置并使用 Location 下列出的值。\n\n```\nNew-AzResourceGroupDeployment\
  \ -Name <deployment-name> -ResourceGroupName <resource-group-name> -TemplateFile\
  \ $HOME/deployworkspacetemplate.json\n```\n\n将 <deployment-name> 替换为此部署的名称。你可以使用类似\
  \ <labworkspace> 的名称。输入什么并不重要，因为这只是一个占位符名称，以便你在查看资源组时可以区分各种部署。将 <resource-group-name>\
  \ 替换为工作区将驻留的资源组的名称。\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_61_0.png)\n\n图 2.7\
  \ – 在 PowerShell 中运行 New-AzResourceGroupDeployment\n\n如果出现错误屏幕，请务必阅读消息，因为消息通常会非常具体地说明错误原因。\n\
  \n- 6. 关闭 Cloud Shell 会话。\n\n这就是如何使用 ARM 模板和 PowerShell 创建新的 Log Analytics 工作区。与使用\
  \ Azure 门户相比，这种方法更具可重复性。接下来，我们将查看如何使用 Azure CLI 并了解如何在不使用 ARM 模板的情况下创建新的工作区。\n\n\
  ## 使用 CLI\n\nAzure CLI 也是微软开发的跨平台脚本工具。最初，它是唯一跨平台的工具，因此如果你在非 Windows 计算机上工作，它是你的唯一选择。PowerShell\
  \ 现在也是跨平台的，因此两者之间的主要区别在于 Azure CLI 可以直接创建 Azure 资源，而无需使用 ARM 模板。\n\n3. 从页面顶部的 Essentials\
  \ 列表开始，我们可以查看以下项目：\n\n- A. **资源组**：工作区所在资源组。\n- 选择 [change] 将允许你移动到另一个资源组。\n- B.\
  \ **状态**：工作区状态应显示为 **Active**。\n- C. **位置**：工作区所在的 Azure 位置。\n- D. **订阅名称**：此资源关联的订阅。\n\
  - 选择 [change] 将允许你移动到另一个订阅。\n- E. **订阅 ID**：前述订阅的唯一 GUID，在致电微软寻求技术支持时很有用。\n- F.\
  \ **工作区名称**：Log Analytics 工作区的名称。\n- G. **工作区 ID**：工作区的 GUID，在致电微软寻求技术支持时也很方便。\n\
  - H. **定价层**：工作区的定价层。\n- I. **管理服务**：查看工作区的活动日志。\n- J. **访问控制模式**：这决定了用户如何获得访问此工作区中信息的权限。有关更多信息，请参阅以下部分。\n\
  \n前面的部分描述了使用 Microsoft Sentinel 创建新的 Log Analytics 工作区的各种方法。这可以通过 Azure 门户完成，也可以通过\
  \ PowerShell 或 CLI 命令以编程方式完成。工作区创建后，我们接下来需要确保访问仅限于需要访问它的用户。\n\n## 管理工作区的权限\n\n在我们连接并将数据存储到工作区并启用\
  \ Microsoft Sentinel 对数据进行分析之前，让我们回顾一下保护此新资源访问的选项。\nAzure 提供对资源的三个主要访问级别：\n\n- -\
  \ **所有者**：对资源具有最高级别的访问权限\n- - **参与者**：可以创建和修改资源，但不能授予或撤销访问权限\n- - **读取者**：可以查看所有资源\n\
  \n如果需要额外的权限，请坚持提供最小权限的原则，并仅应用所需的特定资源。可能需要一些反复试验才能获得正确的结果，但这比提供广泛且过度的权限更安全。如需进一步信息，请查看以下文章：\n\
  \n```\nhttps://docs.microsoft.com/en-us/azure/azure-monitor/logs/manage-access\n\
  ```\n\n现在我们已经了解了权限管理，让我们继续启用 Microsoft Sentinel。\n\n## 启用 Microsoft Sentinel\n\n\
  一旦你创建了要与 Microsoft Sentinel 一起使用的 Log Analytics 工作区，将其附加到 Microsoft Sentinel 非常容易：\n\
  \n- 1. 如果你的租户尚未启用 Microsoft Sentinel，请登录 Azure 门户，在搜索框中输入 Microsoft Sentinel，并选择\
  \ Microsoft Sentinel 选项，如下所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_67_0.png)\n\
  \n2. 点击 Add 按钮将工作区添加到 Microsoft Sentinel：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_68_0.png)\n\
  \n图 2.11 – 将工作区添加到 Microsoft Sentinel\n\n3. 从提供的列表中选择工作区，或点击 Create a new workspace\
  \ 使用 Creating a workspace using the portal 部分中列出的说明添加新工作区，然后选择它。然后，点击屏幕底部的 Add Microsoft\
  \ Sentinel 按钮继续：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_68_1.png)\n\n图 2.12\
  \ – 选择工作区\n\n4. 工作区创建后，你将被带到 Microsoft Sentinel 的概览页面。此页面将显示事件、警报和事件的摘要。有关更多信息，请参阅以下屏幕截图：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_69_0.png)\n\n图 2.13 – Microsoft Sentinel\
  \ 概览页面\n\n恭喜！你现在已创建 Microsoft Sentinel 环境并准备就绪。News & guides 页面是在将 Log Analytics\
  \ 工作区附加到 Microsoft Sentinel 后你会自动前往的页面。如果你离开 Microsoft Sentinel 并返回，你将自动进入 Microsoft\
  \ Sentinel 概览页面，接下来将对此进行描述。\n\n\n\n\n## 探索 Microsoft Sentinel 概览页面\n\nMicrosoft\
  \ Sentinel 概览页面是你在将 Log Analytics 工作区与其关联后进入 Microsoft Sentinel 时自动访问的页面。此页面提供 Microsoft\
  \ Sentinel 环境中信息的总体概览，外观如下图所示。当然，实际显示的数字和数据会因环境而异：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_70_0.png)\n\
  \n图 2.14 – Microsoft Sentinel 概览页面\n\n上图中显示的页面可以分为多个部分，后续章节将对每个部分进行说明。\n\n## 标题栏\n\
  \n标题栏允许你刷新屏幕以查看任何更新，还可以选择回看数据的时间范围。你可以选择类似时钟的图标来更改你想回看的时间范围。\n\n以上就是 Microsoft Sentinel\
  \ **概览**页面。它是了解 Microsoft Sentinel 环境中动态的好去处，也是 Microsoft Sentinel 的登录页面。虽然*图 2.14*\
  \ 显示了大量数据，但当你首次创建 Log Analytics 工作区时，它将是空的。下一节将说明如何开始将数据导入工作区。\n\n## 连接第一个数据源\n\n\
  在深入探讨 Microsoft Sentinel 数据连接器的细节之前（参见*第 3 章，管理和收集数据*），我们将回顾 Log Analytics 如何实现与一系列不同源的连接，以接收数据供存储和分析。一些数据源选项包括：\n\
  \n- 应用程序和操作系统诊断\n- 虚拟机日志数据\n- Azure 存储帐户日志\n- Azure 活动日志\n- 其他 Azure 资源\n\n在本节中，我们将向你展示如何启用来自\
  \ Azure 虚拟机的日志收集。\n\n## 从 Azure 虚拟机获取信息\n\n要让**虚拟机**（VM）填充 Log Analytics 工作区，它们需要连接到工作区。这可以通过\
  \ Log Analytics 工作区的**概览**页面完成。\n\n有两种不同的方式可以到达此页面。首先，你可以在 Azure 门户导航菜单中选择 **Log\
  \ Analytics**，然后选择相应的工作区。第二种（也许更简单）方式是从 Microsoft Sentinel 导航菜单中选择 **设置**，然后从页面顶部的选项中选择\
  \ **工作区设置**，如下图所示：\n\n## Log Analytics 的高级设置\n\nLog Analytics 的高级设置允许你执行各种操作，例如连接本地和其他非\
  \ Azure 的 Windows 和 Linux 服务器、Azure 存储以及 System Center 管理组。你还可以设置从 Windows 和 Linux\
  \ 服务器导入哪些信息，导入 IIS 日志和 Syslog 事件，并添加自定义日志和字段。最后，你还可以创建计算机组，或使用已在 Active Directory、Windows\
  \ Server Update Service（WSUS）和 SCCM 中创建的组，这些组可以在你的查询中使用。\n\n要进入“高级设置”页面，请按照上一节中的说明进入\
  \ Log Analytics 概览页面，但不要选择 Azure 虚拟机（VM），而是选择“代理管理”。这将打开一个新页面，如下图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_76_0.png)\n\
  \n图 2.19 – Microsoft Sentinel 代理管理\n\n如你所见，有两个选项卡分别用于连接 Windows 和 Linux 服务器以摄取数据。下一节将分别讨论它们。\n\
  \n## 代理管理\n\n此区域允许你附加非 Azure 的 Windows 和 Linux 服务器：\n\n- **Windows 服务器：** 你可以将基于非\
  \ Azure Windows 的 VM 附加到工作区，以收集 Windows 事件日志和性能计数器。单击 **下载 Windows 代理（64 位）** 或\
  \ **下载 Windows 代理（32 位）** 以匹配你正在使用的 Windows 版本，并在服务器上运行该程序。复制 **工作区 ID** 以及 **主键**\
  \ 或 **辅助键** 详细信息，并在系统要求时填写。\n\n- **Linux 服务器：** 其工作方式与 Windows 服务器相同 – 单击 **下载 Linux\
  \ 代理** 链接并阅读文档以获取安装说明。\n\n> **注意**\n> 虽然这可用于连接 Azure VM，但使用上一节中的步骤要容易得多。\n\n接下来，我们将查看\
  \ **代理配置** 页面，它提供了从代理摄取数据的选项。\n\n- **Windows 性能计数器：** 这将显示默认包含的所有性能计数器及其轮询间隔的列表。在这里，你可以更改间隔或完全删除计数器。你还可以添加其他要监视的计数器。\n\
  \n- **Linux 性能计数器：** 这将显示默认包含的所有 Linux 性能计数器以及使用轮询间隔的计数器的轮询间隔列表。在这里，你可以更改间隔或完全删除计数器。你还可以添加其他要监视的计数器。\n\
  \n- **Syslog：** 此部分启用从 Syslog 服务器收集数据。为每个设施选择严重性以确保收集消息，所有其他消息将被排除。有关更多详细信息，请查看此页面：https://docs.microsoft.com/en-us/azure/azure-monitor/agents/data-sources-syslog。\n\
  \n- **IIS 日志：** 这决定是否将从 Windows Web 服务器摄取 W3C 格式的 IIS 日志文件。例如，来自基于 Linux 的 Web 服务器的\
  \ Web 日志。\n\n如你所见，配置要导入的数据有很多方式。在所需或想要的数据与摄取和存储数据的成本之间，始终存在权衡。在下一节中，我们将了解 **计算机组**，它可以帮助你进行查询。\n\
  \n## 计算机组\n\n此部分将显示所有已创建的自定义计算机组，并提供创建自己的计算机组的方法。然后，这些组可以用于查询。你可以使用这些组创建引用特定服务器集的查询，并且无需更改查询本身即可轻松更改这些服务器集。\n\
  \n有多种创建计算机组的方法可以帮助你进行查询。以下各节将更详细地讨论每种方法。\n\n## 通过查询添加计算机组\n\n使用查询添加计算机组涉及运行一个将返回计算机列表的查询，然后将该信息保存为计算机组：\n\
  \n1. 在 **计算机组** 下的 **已保存组** 部分中，单击 **转到日志** 链接以进入 **日志** 页面。输入任何将生成计算机列表的查询。下面是一个示例：\n\
  \n```\nHeartbeat\n| where TimeGenerated > ago(30m)\n| distinct Computer\n```\n\n\
  不必担心此查询的含义，它将在*第 5 章，使用 Kusto 查询语言*中解释。目前，它将返回在过去 30 分钟内已向工作区发送心跳的所有计算机的列表。请注意，你需要有一台连接到\
  \ Azure 的服务器（参见*从 Azure 虚拟机获取信息和连接源*部分）才能从该查询中获取任何信息。\n\n2. 单击 **运行** 按钮以获取计算机列表。如果没有返回计算机，请将\
  \ 30 改为更大的值，直到返回一些计算机。\n\n3. 获得列表后，单击 **保存** 按钮以保存此查询：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_81_0.png)\n\
  \n图 2.22 – 计算机心跳查询\n\n4. 选择 **另存为函数** 选项，然后为函数提供名称。\n\n5. 确保勾选 **将此查询保存为计算机组** 选项，否则它将仅保存为查询，该查询可以与名称相同。\n\
  \n\n\n\n\n+   6. 最后，添加一个 **Legacy 类别**，它仅用于将计算机组组合在一起。\n\n+   7. 点击 **Save** 按钮，如以下屏幕截图所示：\n\
  \n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_82_0.png)\n\nFigure 2.23 – Save query\
  \ options\n\n当你返回到 **Saved Groups** 页面时，你会看到你的已保存组，其外观如下图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_82_1.png)\n\
  \nFigure 2.24 – Saved Groups\n\n要使用已保存的组，输入如下查询：\n\n```\nPerf\n| where Computer\
  \ in (ListComputerGroups)\n```\n\n将 ListComputerGroups 替换为你刚刚创建的查询的名称。同样，不必担心此查询的含义；它只是使用已保存组的示例。在阅读第\
  \ 5 章《使用 Kusto 查询语言》后会更容易理解。\n\n## Summary\n\n在本章中，我们探讨了 Azure Monitor Log Analytics\
  \ 解决方案，包括如何使用 Azure 门户、PowerShell 或 CLI 创建新的工作区，以及如何配置安全选项以确保每个用户具有适当的访问级别。我们还查看了如何连接数据源并配置一些高级设置。这些信息在你需要首次配置\
  \ Microsoft Sentinel 时非常有用，并且在未来如果需要对支持你运营和业务需求的 Log Analytics 平台进行任何更改时也很有用。\n\n\
  在下一章中，我们将研究如何选择最适合安全威胁狩猎的数据、用于从任何系统收集数据的连接器，以及在控制成本的同时实现长期数据保留的可用选项。\n\n## Questions\n\
  \n回答以下问题以测试你对本章的了解：\n\n+   1. Azure Monitor Log Analytics 中使用的查询语言的名称是什么？\n+   2.\
  \ Azure Lighthouse 的目的是什么？\n+   3. 你能列出 Log Analytics 中保护数据的三种方式吗？\n+   4. 创建新的\
  \ Log Analytics 工作区的三种方法是什么？\n+   5. 工程师角色的推荐权限是什么？\n"
- "# 第 3 章 数据连接与摄取\nManaging and Collecting Data\n\n安全信息和事件管理（SIEM）解决方案的主要目的之一是在提供组织\
  \ IT 基础设施保护的各种产品中集中存储和分析安全事件。为此，该解决方案需要连接到这些数据源，将数据拉取到中央存储库中，并管理该数据的生命周期，以确保其可用于分析和持续调查。\n\
  \n在本章中，我们将回顾对安全运营最有趣和最有用的数据类型，然后探索可用于连接到多个数据源并将该数据摄取到 Microsoft Sentinel 中并将其存储在\
  \ Log Analytics 工作区中的功能。一旦数据被摄取，我们需要确保适当的数据保留配置，以最大化搜寻事件和其他安全信息的能力，同时确保解决方案的成本保持在合理水平。\n\
  \n我们将涵盖以下与数据收集相关的领域：\n\n+   - 选择重要的数据\n+   - 了解连接器\n+   - 配置 Microsoft Sentinel\
  \ 连接器\n\n每个解决方案都已从各自的数据源收集了大量数据；在某些情况下，你可能希望将这些产品的原始日志收集到 SIEM 中以进行跨多个数据源的相关性分析。然而，你应逐案考虑以证明成本合理。作为替代方案，而不是收集原始数据，这些解决方案可以配置为仅发送警报或可操作信息的具体事件。这可以使\
  \ SIEM 成为分析、警报和工单的中央通信点。净结果是减少重复并降低整体解决方案成本。这一想法在以下图表中进行了总结：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_89_0.png)\n\
  \nFigure 3.1 – Data for security operations\n\n在处理大量数据时，我们可以使用大数据七要素来指导我们根据分配的优先级决定收集哪些合适的数据：\n\
  \n+   - **Volume:** 这直接影响移动和存储数据的成本。\n+   - **Velocity:** 这影响对事件的响应时间。\n+   - **Variety:**\
  \ 我们是否包含了应用程序和基础设施的各个方面？\n+   - **Variability:** 信息是否易于理解和采取行动？\n+   - **Veracity:**\
  \ 我们是否信任数据源和数据的准确性？\n+   - **Visualization:** 我们能否使用此数据创建可视化和比较？\n+   - **Value:**\
  \ 持续审查数据的价值，减少浪费并保留价值。\n\n以下是如何使用每个要素来优先考虑数据并为摄取提供一些理由的示例。不要专注于总数据量，而应考虑数据质量和多样性的需求，以在多个系统之间提供准确且可操作的信息。\n\
  \n本主题的摘要如下图所示：\n\n| 7 Vs of Big Data |\n|---|---|\n| Volume | How much is enough,\
  \ or too much? |\n| Velocity | How fast can we gather and analyze? |\n| Variety\
  \ | Can we see all points of view? |\n| Variability | Standardized or requires formatting?\
  \ |\n| Veracity | How accurate and verified is the data? |\n| Visualization | Can\
  \ the data show trend analysis? |\n| Value | Is there value in retaining old data?\
  \ |\n\nFigure 3.2 – The seven Vs of big data\n\n你可以使用此图表来指导你对需要摄取到 Microsoft Sentinel\
  \ 中的数据类型以及可以排除的类型进行初步评估。作为示例：如果你实施了 EDR 解决方案，该解决方案将摄取、分析和警报许多客户端数据源，你真的需要将完整的遥测数据摄取到\
  \ SIEM 中，还是只需使用警报？EDR 遥测数据确实需要保留更长时间，但 SIEM 可能不是放置它的合适位置。相反，考虑使用 Azure Data Explorer\
  \ 等数据湖。\n\n一个可以立即改进的领域是删除任何非安全目的的数据，例如应用程序的性能指标和统计数据。这些可以重定向到存储在另一个未启用 Microsoft\
  \ Sentinel 的 Log Analytics 工作区中。我们建议你定期审查数据管道，以确保你维护着健康的数据集，通过添加更多数据源或通过调整不再满足要求但有存储和处理成本的数据来实现。\n\
  \n在下一节中，我们将查看 Microsoft Sentinel 中可用的不同类型的连接器。\n\n## Native connections – service\
  \ to service\n\nMicrosoft Sentinel 已开发为可直接与 Microsoft 解决方案中的多个资源集成，包括（但不限于）以下内容：\n\
  \n+   - **Azure Active Directory**（Azure AD），包括 Azure AD 高级身份保护解决方案\n+   - **Office\
  \ 365**，包括 Exchange Online、Teams、SharePoint Online 和 OneDrive for Business\n+  \
  \ - **Microsoft Defender 365**，包括 Microsoft Defender for Endpoint、Microsoft Defender\
  \ for Identity、Microsoft Defender for Office 365 和 Microsoft Cloud App Security\n\
  +   - **Azure Security Center**，包括 Azure Defender\n+   - **Microsoft Defender for\
  \ Identity**\n\n如果有此选项可用，这是连接资源的首选方法。让我们来看一下直接连接。\n\n## Direct connections – service\
  \ to service\n\nMicrosoft Sentinel 中一些连接器需要在源位置进行配置。连接器通常会提供所需的信息以及指向适当位置的链接。数据可能通过事件中心发送，也可能直接发送到\
  \ Log Analytics 工作区。这些连接器的示例包括以下内容：\n\n+   - **Amazon Web Services**（AWS），用于 AWS\
  \ CloudTrail\n+   - Azure Firewall\n+   - Azure Front Door\n+   - Azure **Network\
  \ Security Groups**（NSGs）；流日志和规则激活\n+   - Microsoft Intune；审计日志和操作日志\n\n现在，让我们来看一下\
  \ API 连接。\n\n\n\n\n## Syslog 服务器\n\n这是一种传输机制，通过在一台 Linux 主机上部署代理（agent）来实现，该主机可以作为许多来源的日志集中器，这些日志随后被转发到\
  \ Log Analytics 进行集中存储。有关实现 Syslog 连接器的详细指导，请参阅此文章：https://docs.microsoft.com/en-us/azure/sentinel/connect-syslog。支持此方法的第三方解决方案示例包括（但不限于）以下：\n\
  \n- Carbon Black\n- Cisco（IronPort Web 安全、Meraki 等）\n- Citrix\n- F5 BIG-IP\n- NetApp\n\
  - Palo Alto Cortex\n- Trend Micro\n\n虽然这些选项为收集数据源提供了广泛的选择，但还有另一种方法，如果服务提供商支持的话，可以提供更丰富的数据集。接下来，让我们看看通用事件格式（CEF）选项。\n\
  \n## 使用 CEF 的 Syslog 服务器\n\n这与前面提到的 Syslog 服务器部署非常相似。有关更详细的信息，请参阅此文章：https://docs.microsoft.com/en-us/learn/modules/connect-common-event-format-logs-to-azure-sentinel/。CEF\
  \ 日志格式是可扩展的，并且被希望在生成的日志中提供更多细节的多个产品供应商所采用。支持此方法的解决方案示例包括：\n\n- Cisco（Umbrella、云安全网关等）\n\
  - CyberArk\n- F5 防火墙\n- McAfee Web 网关\n- Palo Alto Networks 防火墙\n- Varonis\n- Zscaler\n\
  \n有了这一系列可用的连接器，您可以从所有操作环境中的多个资源中连接并收集信息，包括本地环境、托管服务、公有云，甚至工业运营环境或物联网（IoT）。\n\n接下来，我们将逐步介绍\
  \ Microsoft Sentinel 中连接器的配置。\n\n## 配置 Microsoft Sentinel 连接器\n\nMicrosoft Sentinel\
  \ 数据连接器页面显示连接器总数、当前已连接的数量以及正在开发中的数量（通过预览状态标识）。以下截图显示了数据连接器页面的示例：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_95_0.png)\n\
  \n图 3.4 – Microsoft Sentinel 数据连接器页面\n\n如上面的截图所示，在此 Microsoft Sentinel 实例中有超过 100\
  \ 个可用的连接器可供实施。随着更多解决方案被原生集成，该列表将继续增长，这就是为什么您可以看到可以筛选列表并搜索特定数据连接器的原因。通过选择左侧的连接器，我们可以在右侧查看连接器详细信息。在此示例中，我们将使用\
  \ AWS 的数据连接器，如下面的截图所示：\n\n![](img/387db4214c5424f3a9b9dfa5ccc56a9d_96_0.png)\n\n\
