- pgno: 67
  md: 'If additional permissions are required, keep to the idea of providing minimal
    permissions and applying only the specific resources required. It may take some
    trial and error to get the right outcome, but it is a safer option than providing
    broad and excessive permissions. For further information, please look at the following
    article:


    ```

    https://docs.microsoft.com/en-us/azure/azure-monitor/logs/manage-access

    ```


    Now that we have learned about managing permissions, let''s move on to enabling
    Microsoft Sentinel.


    # Enabling Microsoft Sentinel


    Once you have created a Log Analytics workspace that you want to use with Microsoft
    Sentinel, it is very easy to attach it to Microsoft Sentinel:


    +   1. If you do not have Microsoft Sentinel enabled for your tenant, sign in
    to the Azure portal, enter Microsoft Sentinel in the search box, and select the
    Microsoft Sentinel option, as shown here:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_67_0.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: '2. Click the Add button to add a workspace to Microsoft Sentinel:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_68_0.png)


    Figure 2.11 – Adding a workspace to Microsoft Sentinel


    3. Select the workspace from the list provided or click Create a new workspace
    to add a new workspace using the instructions listed in Creating a workspace using
    the portal section, and then select it. Then, click the Add Microsoft Sentinel
    button at the bottom of the screen to continue:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_68_1.png)


    Figure 2.12 – Choosing a workspace'
  merge: -1
