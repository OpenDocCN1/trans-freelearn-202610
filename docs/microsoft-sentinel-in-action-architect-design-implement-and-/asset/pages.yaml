  md: '# # Contributors


    # ## About the authors


    **Richard Diver** is a senior technical business strategy manager for the Microsoft
    Security Solutions group, focused on developing security partners. Based in Chicago,
    Richard works with advanced security and compliance partners to help them build
    solutions across the entire Microsoft platform, including Microsoft Sentinel,
    Microsoft Defender, Microsoft 365 security solutions, and many more. Prior to
    Microsoft, Richard worked in multiple industries and for several Microsoft partners
    to architect and implement cloud security solutions for a wide variety of customers
    around the world. Any spare time he gets is usually spent with his family.


    **Gary Bushey** is an Azure security expert with over 25 years of IT experience.
    He got his start early on when he helped his fifth-grade math teacher with their
    programming homework and worked all one summer to be able to afford his first
    computer, a Commodore 64. When he sold his first program, an apartment management
    system, at 14 he was hooked. During his career, he has worked as a developer,
    consultant, trainer, and architect. When not spending time in front of a computer,
    you can find him hiking in the woods, taking pictures, or just picking a direction
    and finding out what is around the next corner.


    **John Perkins** is the founder and principal of Threat Angler, a cybersecurity
    service provider that specializes in managed services, professional services,
    and training with a focus on delivering cybersecurity outcomes to customers of
    all shapes and sizes. John has over 20 years of experience in cybersecurity and
    has contributed to nearly all cybersecurity disciplines during his career. He
    has experience with numerous applications, including Microsoft Sentinel, and has
    designed, built, and led managed security services for several large service providers.
    In his free time, John enjoys spending time with his family, traveling, and staying
    active.'
  merge: -1
  img_proc: true
