- pgno: 276
  md: '# Groups


    Groups allow multiple controls to be treated as one unit. This will make it much
    easier when needing to perform the same task (for instance, setting up the conditionally
    visible setting) for multiple steps.


    When you click on the Add group button, a new window will be added as shown in
    the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_276_0.png)


    Figure 8.38 – New group


    There are two different group types: Editable and From Template. The Editable
    group type is the default and allows you to make all the changes to your group
    in this workbook.


    If you select From Template, then you will be asked for the template ID, which
    is the resource ID for the workbook. You can obtain this by going to the workbook''s
    resource group, selecting the workbook in question, and then selecting the resource
    ID that is displayed in the Overview page.


    You can use this setting if you have multiple workbooks that may use the same
    grouping of steps to avoid having to create the steps each time. Keep in mind
    that if you want to make a change to the template, you will have to go to the
    template to make the actual change and it will affect all the workbooks that are
    using this template.'
  merge: -1
  img_proc: true
- pgno: 277
  md: "The **Load** type will determine when to load the group. Refer to the following\
    \ table for the values:\n\n| Name | Description |\n|------|-------------|\n| Lazy\
    \ | The group will only load when it becomes visible onscreen. This can lead to\
    \ faster initial loads but there will be a delay the first time this group is\
    \ displayed. |\n| Explicit | There will be a **Load More** button and the group\
    \ will not load until that button is clicked. This gives you much more control\
    \ over when the group will load but requires a manual step to load the group.\
    \ |\n| Always | The group will load when the workbook opens. This is the opposite\
    \ of the **Lazy** option in that it may slow down the initial loading of the workbook\
    \ but there will not be a delay when the group is displayed. |\n\nTable 8.7\n\n\
    There is also a link called **Edit Group** that allows you to open just this group\
    \ in another window where you can make the edits. This can be useful if you have\
    \ a lot of steps to make it easier to see just those steps that belong to this\
    \ group. Once you have finished your edits, you can close the window to return\
    \ to the main edit screen. Note that this button will only become active if you\
    \ have at least one step inside the group.\n\nIt is worth noting that if you remove\
    \ a group, you will also remove all the steps that are inside the group.\n\nNow,\
    \ let's look at how to add a new tab in the following section.\n\n# Adding a new\
    \ tab\n\nWhen adding a new tab, the **Style** field in the header needs to be\
    \ set to **Tabs**. The only fields that will be shown are **Tab Name**, **Action**,\
    \ **Value**, **Settings**, and **Context Pane**. You cannot set any text to show\
    \ before or after the tab.\n\n> **Note**\n> \n> There is no reason why you cannot\
    \ use any of the other styles to do the same thing as the **Tabs** entry. The\
    \ **Tabs** style is set up to minimize the amount of work needed to create a tab\
    \ interface, including hiding unneeded fields, and changing how the links are\
    \ displayed to look like a traditional tabbed interface."
  merge: -1
  img_proc: true
