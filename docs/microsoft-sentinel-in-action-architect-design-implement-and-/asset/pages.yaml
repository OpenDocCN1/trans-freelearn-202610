- pgno: 22
  md: '+   - Service pricing for Microsoft Sentinel

    +   - Scenario mapping


    # The current cloud security landscape


    To understand your security architecture requirements, you must first ensure that
    you have a solid understanding of the IT environment that you are trying to protect.
    Before deploying any new security solution, there is a need to map out the solutions
    that are currently deployed and how they protect each area of the IT environment.
    The following list provides the major components of any modern IT environment:


    +   - End user habits that are counter-productive to security endeavors

    +   - Identity for the authentication and authorization of access to systems

    +   - Networks to gain access to internal resources and the internet

    +   - Storage and compute in the data center for internal applications and sensitive
    information

    +   - End user devices and the applications they use to interact with data

    +   - And in some environments, you can include Industrial Control Systems (ICS)
    and the Internet of Things (IoT)


    When we start to look at the threats and vulnerabilities for these components,
    we quickly find ourselves deep in the alphabet soup of problems and solutions.


    # The Alphabet Soup of Cyber Security


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_22_0.png)'
  merge: -1
  img_proc: true
