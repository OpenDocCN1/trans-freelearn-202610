- pgno: 45
  md: '# Step 5 – what actions will occur instantly?


    As we aim to maximize the automation of detection and response, consider what
    actions should be carried out immediately, and then focus on enabling the automation
    of these actions.


    Actions may include the following:


    +   - Logging and alerting

    +   - Notifying/warning the end user

    +   - Blocking the action

    +   - Offering alternative options/actions

    +   - Triggering a workflow


    # Step 6 – severity and output


    In this step, you should be able to assign a number to associate with the severity
    level, based on the impact analysis in the previous steps. For each severity level,
    define the appropriate output required:


    +   - **Level 0** – Logs and reports

    +   - **Level 1** – Dashboard notifications

    +   - **Level 2** – Generate events in the ticketing system

    +   - **Level 3** – Alerts sent to groups/individuals

    +   - **Level 4** – Automatic escalation to the senior management team (sirens
    and flashing lights are optional!)


    # Step 7 – what action should the analyst take?


    Whereas the *Step 5 – what actions will occur instantly?* section was an automated
    action, this step is a definition of what the security analysts should do. For
    each scenario, define what actions should be taken to ensure an appropriate response,
    remediation, and recovery.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'The following diagram is a simple reference chart that can be used during the
    scenario-mapping exercise:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_46_0.png)


    Figure 1.4 – The scenario-mapping process


    By following this seven-step process, your team can better prepare for any eventuality.
    By following a repeatable process, and improving that process each time, your
    team can share knowledge with each other, and carry out testing to ensure that
    protection and detection are efficient and effective as well as identifying new
    gaps in solutions that must be prioritized.


    You should commit to taking time away from the computer and start to develop this
    type of tabletop exercise on a regular basis. Some organizations only do this
    once per year, while others will do it on a weekly basis or as needed based on
    the demands they see in their own systems and company culture.'
