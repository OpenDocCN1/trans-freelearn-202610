- pgno: 189
  md: 'Underneath the grouping area, if it is enabled, is the listing of the result
    columns that have been selected to be shown. Click on the name of the column to
    sort the results using that column. The first time you click on the column, it
    will sort in ascending order. Clicking it again will sort in descending order.


    Each column name will have a funnel icon to the right of the name. Click on the
    funnel icon to perform a filter on the column as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_189_0.png)


    Figure 6.28 – Column filter


    This is different than filtering using the Filter pane. If you were to select
    a value with which to filter a column using the Filter pane, the query itself
    would change, and the query would need to be rerun to see the changes. If you
    just enter a value to filter a column in the results window, the query itself
    will not change; only the rows displayed will change to match the filter immediately.
    Note that this will not be a list of possible values that you can filter on.


    You can also change the comparison operator from Is equal to to other options,
    including Not equal to, Contains, Has value, Has no value, and others. This can
    give you a much more precise filtering experience than using the Filter pane,
    although it takes a bit more work to set up the filter since you have to know
    the filtering values.'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'To the left of each row is a greater-than button (>). Click on that to expand
