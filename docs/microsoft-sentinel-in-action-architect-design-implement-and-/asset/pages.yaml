- pgno: 122
  md: 'Now that the app is registered in Azure AD, we can use this in the registration
    process for the TI server/service to run and send information to Microsoft Sentinel.


    Next, we can start to configure the MineMeld server, which involves setting up
    a new **virtual machine (VM)** to collect and forward the TI feed.


    # Configuring the MineMeld TI feed


    With the previous steps complete, you are ready to configure the services that
    will send TI data to Microsoft Sentinel. This section will walk you through the
    configuration of the MineMeld TI sharing solution.


    > **Note**

    > If the MineMeld TI server is not already running in your environment, you will
    need to configure the product; this guidance is only for the Microsoft Sentinel
    connectors.


    There are three steps to this process:


    +   1. Building the VM and installing MineMeld

    +   2. Installing the Microsoft Graph Security API extension in MineMeld

    +   3. Configuring the extension to connect to Microsoft Graph via the Security
    API


    To carry out this procedure, you will need administrative access to the Azure
    tenant and the MineMeld service.


    # Building the VM and installing MineMeld


    > **Note**

    > At the time of testing, it was necessary to ensure only Ubuntu version 16.04
    was used; other versions may not be compatible.


    Ideally, you will already have the MineMeld VM configured and running in your
    environment; however, if you do not, you can find configuration instructions online
    via the official Palo Alto Networks website: https://live.paloaltonetworks.com/t5/MineMeld-Articles/Manually-Install-MineMeld-on-Ubuntu-16-04/ta-p/253336.'
  merge: -1
