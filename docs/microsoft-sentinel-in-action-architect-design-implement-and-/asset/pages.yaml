- pgno: 453
  md: '# Jupyter Notebook


    Jupyter Notebook is an open-source application used to create and share documents
    that contain notes, visualizations, live code, and other resources you can share
    between SOC analysts to improve threat-hunting and response capabilities.


    Find more resources for Jupyter Notebook at the following link: https://jupyter.org/.


    # Machine learning with Fusion


    Microsoft uses machine learning algorithms to help Microsoft Sentinel detect multi-stage
    attacks, which is known as Microsoft Fusion. The technique works by combining
    two or more alert activities, such as anomalous behavior and suspicious activities
    that may have been low-level alerts. Microsoft Sentinel can then produce accurate,
    high-fidelity incidents, reducing false positives and detecting attacks that may
    otherwise have gone unseen. For this to be successful, you must ensure the appropriate
    data connectors are enabled and you have at least 30 days of historical data to
    train the machine learning algorithms.


    This feature is enabled by default and currently supports multiple scenarios,
    including the following:


    +   - Monitoring users that trigger impossible travel alerts, followed by anomalous
    Office 365 activity

    +   - User sign-in activity for an unfamiliar location, which is then followed
    by anomalous Office 365 activity

    +   - User sign-in activity from an infected device, which is then followed by
    anomalous Office 365 activity

    +   - User sign-in activity from an anonymous IP address, which is then followed
    by anomalous Office 365 activity

    +   - User sign-in activity from a user with leaked credentials, which is then
    followed by anomalous Office 365 activity


    To learn more about this technology and keep up with the latest developments,
    visit the following site: https://docs.microsoft.com/en-us/azure/sentinel/fusion.'
