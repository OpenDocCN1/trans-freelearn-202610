- pgno: 432
  md: '# Additional options


    The final section of the profile configuration is for bi-directional field mapping
    between Sentinel and ServiceNow. For example, ServiceNow can tell Sentinel to
    close a Sentinel alert when the corresponding security incident in ServiceNow
    is closed. There are several options in this section, and they are rich in features.
    We recommend utilizing them. However, be careful not to turn them on if your ServiceNow
    is in a development environment and you are integrated with a production Sentinel
    environment. It will mess up your Sentinel production records with your lab activity:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_432_0.png)


    Figure 13.15 – Additional Options


    Your Sentinel to ServiceNow integration (and possibly back if you enabled those
    options) is now configured. Navigate to the Microsoft Azure Sentinel Integration
    | Azure Sentinel Incident to Task path in ServiceNow and wait for the records
    to begin populating.


    When you are in this area of ServiceNow, try grouping by the task column. This
    will show you where the aggregation is occurring. Any groups that have more than
    one record represent an aggregation.


    You also can navigate to Security Incident Records (in the task column) to review
    the results of the field mappings you configured.'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# Summary


    This chapter showed you how to create an integration with a solution – in our
    example, ServiceNow – to provide a single place to process security incidents.
    It does not matter what alert source the security incident started from or who
    needs to work on it. There are countless ways to achieve this outcome. We only
    covered a more common approach in this chapter.


    Be creative and focus on simplicity and licensing reduction. For example, if Sentinel
    does not provide correlation for alerts coming from an alert source because that
    alert source has very high fidelity, then consider ingesting those alerts directly
    into ServiceNow and bypassing Sentinel to save on licensing costs and to reduce
    complexity in your architecture.


    We also only scratched the surface of what can be done with a security incident
    once it is automatically created in ServiceNow Security Incident Response. ServiceNow
    is not just a workflow and case management solution with fancy forms and dashboards.
    ServiceNow Security Incident Response is an industry-leading Security Orchestration,
    Automation and Response (SOAR) platform capable of streamlining and automating
    much of the security incident detection and response process. In the next chapter,
    we will discuss some of the operational tasks we can perform to maintain peak
    operational efficiency in Microsoft Sentinel.'
  merge: -1
  img_proc: true
