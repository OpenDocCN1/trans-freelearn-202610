- pgno: 135
  md: '# 5

    Using the Kusto Query Language (KQL)


    The Kusto Query Language (KQL) is a plain-text, read-only language that is used
    to query data stored in Azure Log Analytics workspaces. Much like SQL, it utilizes
    a hierarchy of entities that starts with databases, then tables, and finally columns.
    In this chapter, we will only concern ourselves with the table and column levels.


    In this chapter, you will learn about a few of the many KQL commands that you
    can use to query your logs.


    In this chapter, you will learn the following:


    +   - How to test your KQL queries

    +   - How to query a table

    +   - How to limit how many rows are returned

    +   - How to limit how many columns are returned

    +   - How to perform a query across multiple tables

    +   - How to graphically view the results'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'The chapter covers the following main topics:


    +   - Running KQL queries

    +   - Introduction to KQL commands

    +   - Query statements

    +   - Scalar functions


    # Running KQL queries


    For this chapter, we will be using the sample data available in the **Azure Data
    Explorer (ADX)**. This is a very useful tool for trying simple KQL commands. Feel
    free to use it to try the various commands in this chapter. All the information
