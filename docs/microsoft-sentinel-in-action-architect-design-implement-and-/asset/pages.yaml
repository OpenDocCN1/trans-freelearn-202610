- pgno: 283
  md: 'That ends our discussion of the advanced settings for steps. As you have seen,
    these settings allow you to perform many actions, including specifying when the
    step is to be visible, being able to export variables that other steps in the
    workbook can use, and determining how much of the width of the page the step will
    take up.


    # Summary


    In this chapter, you learned about Microsoft Sentinel workbooks and how their
    interactive display is used to show information to users. Workbooks can be used
    to help determine whether there is something in your environment that needs investigation.


    You learned how to create and edit a new workbook using the various step types
    provided. You learned how to define parameters using a new step, as well as coming
    from a query, and how to use those parameters to further filter your queries.


    They can display a combination of texts, various graphs, metrics, and links including
    tabs. Using parameters, we can change what information is presented in our workbooks
    to help us determine whether there is an incident that needs to be investigated.


    Finally, you learned how to change the advanced settings of a step to modify how
    it operates and looks. You learned how to get multiple steps to show up on the
    same row in a graph, and how one graph can communicate with another through parameters.


    In the next chapter, you will learn about Microsoft Sentinel incidents, which
    are generated from alerts and other queries, along with how to manage and investigate
    them.


    # Questions


    +   1. What are the two ways to create a new workbook?

    +   2. If I wanted to show the user instructions on how to use a workbook, what
    would be the best step type to use?

    +   3. If I want to allow a user of a workbook to be able to change how far back
    in time every query in the workbook looks, which two actions would I need to take?
    (Hint: The second action would need to be performed on every query step.)

    +   4. Is it possible to have a workbook step only show up when certain conditions
    are met?

    +   5. How can I have two steps in the same workbook show side by side?'
  merge: -1
  img_proc: true
- pgno: 284
  md: <!-- no content -->
  merge: -1
