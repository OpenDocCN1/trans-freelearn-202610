- pgno: 266
  md: '# Parameters


    As much as the query step is the mainstay of Microsoft Sentinel workbooks, they
    would not be as useful without parameters. A workbook that cannot change any of
    its inputs may just as well be an image rather than an interactive workbook that
    you can manipulate to query the results in different ways.


    There are two types of parameters: those that get set in a parameter step, which
    we will discuss here, and those that are populated when an item in a query step
    is selected, which will be discussed in the Advanced Settings section later in
    this chapter.


    When you click the Add Parameter link, you will see the following screen. Note
    that a lot of white space has been removed from the screenshot so it can all be
    shown:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_266_0.png)


    Figure 8.28 – New parameter step


    Once you have entered the parameters, they will be displayed in a table, one per
    row, as shown in the following screenshot. You can select a single checkbox to
    edit all the settings of an individual parameter. You can also change the Required?,
    Parameter name, and Display name fields directly from this screen. It will show
    the Parameter type and Explanation fields, although you cannot edit those fields
    from this screen. Refer to the Adding a new parameter section for an explanation
    of these fields:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_266_1.png)


    Figure 8.29 – Parameter step with sample parameters'
