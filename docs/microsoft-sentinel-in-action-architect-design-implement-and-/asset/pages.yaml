- pgno: 70
  md: '# Exploring the Microsoft Sentinel Overview page


    The Microsoft Sentinel Overview page is the page that you will automatically go
    to when entering Microsoft Sentinel after you have associated the Log Analytics
    workspace with it. This page provides a general overview of the information in
    your Microsoft Sentinel environment and will look like the following screenshot.
    The actual numbers and data being shown will vary depending on your environment,
    of course:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_70_0.png)


    Figure 2.14 – Microsoft Sentinel Overview page


    The page shown in the preceding screenshot can be broken up into various parts
    and each of these is described in the following sections.


    # The header bar


    The header bar allows you to refresh the screen to see any updates, as well as
    to select how far back in time to look for the data. You can select the icon that
    looks like a clock to change how far back you want to look.'
  merge: -1
