- pgno: 285
  md: '# 9

    Incident Management


    In Chapter 7, Creating Analytic Rules, you learned that rules in analytics create
    incidents. These incidents can represent potential issues with your environment
    and need to be looked at to determine whether they are indeed an issue. Are they
    false positives, irrelevant to your environment, or actual issues? The way to
    determine this is through incident management.


    There are no hard-and-fast rules for incident management, other than to look at
    the incidents and determine whether they are actual issues. There are various
    ways to do this, and this chapter will look at the options Microsoft Sentinel
    provides to perform these investigations, including a graphical representation
    of the incident, viewing the full details of the incident, and running other queries
    to obtain more information.


    In this chapter, we will cover the following topics:


    +   - Using the Microsoft Sentinel Incidents page

    +   - Exploring the full details page

    +   - Investigating an incident'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Using the Microsoft Sentinel Incidents page


    To look at the Microsoft Sentinel Incidents page, click on the Incidents link
    in the left-hand navigation panel. This will take you to the Incidents page, as
    shown in the following screenshot. The actual numbers and incidents listed may
    be different, of course:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_286_0.png)


    Figure 9.1 – The Microsoft Sentinel Incidents page


    The page has been broken up into the header bar, the summary bar, the search and
    filtering section, the incidents listing, and the incident details pane. Each
    of these sections is described in more detail next.


    # The header bar


    The header bar at the top of the page, shown in the following screenshot, has
    the usual Refresh button and timespan drop-down option. There is also another
    button called Actions:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_286_1.png)


    Figure 9.2 – The Incidents page''s header bar'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'The **Actions** button will allow you to perform actions against multiple incidents
    at once, including changing the severity, assigning an owner, changing the status,
    and adding tags. See the *Using the Actions button* section for more information.


    To the right is the **Security efficiency workbook** button. Clicking this will
    take you to the Security Operations Efficiency workbook, which will give you a
    general overview of the incidents, including a timeline of when they were created,
    the closing classification (if any) of the incidents, breakdowns by severity,
    owner, status, and much more.


    The **Columns (preview)** link will allow you to select which columns to show
    in your view. This will allow you to customize the view of the Incidents page,
    and the changes will persist. See the *Incident listing* section in this chapter
    for a listing of all the columns.


    On the far right is the **Guides & Feedback** button. Clicking this will open
    a pane that has some guides on incidents and will allow you to share feedback
    with Microsoft regarding the **Incidents** page.


    # The summary bar


    Under the header bar is the summary bar, shown in the following screenshot. This
    shows the total number of open incidents, the number of new incidents, and the
    number of incidents that are in progress:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_287_0.png)


    Figure 9.3 – The Incidents page''s summary bar


    On the right side of the summary bar is a listing of the open incidents, broken
    down by severity. By looking at the two different summaries of the incidents,
    you can get an idea of how your incidents are broken down.


    # The search and filtering section


    Below the summary bar is the search and filtering section. This is where you can
    filter what results you see in the listing of all the incidents:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_287_1.png)


    Figure 9.4 – The Incidents page''s filtering section'
  merge: -1
  img_proc: true
- pgno: 288
  md: "Let's look at all the parameters under the search and filtering section:\n\n\
    +   - **Search by id, title, tags, owner or product:** This filter allows you\
    \ to enter a search term to find specific incidents. This can either be text found\
    \ in the title of the incident(s) or the incident ID number.\n\n> **Important\
    \ Note**\n> \n> If you search by ID number, the value entered must be an exact\
    \ match to an incident's ID number.\n\nYou can also filter by the various fields\
    \ that make up the incident display, discussed next. As you can see, you can filter\
    \ by **Severity, Status, Product** name (which product generated the incident),\
    \ and/or **Owner** (which is the person that is assigned to the incident).\n\n\
    +   - **Severity:** This filter allows you to select one or more of **Select All,\
    \ Informational, Low, Medium, High,** and/or **Critical**. By default, **Select\
    \ All** is selected, which appears as just **All** in the summary bar, as shown\
    \ in the preceding screenshot.\n+   - **Status:** This filter allows you to select\
    \ one or more of **Select All, New, In Progress,** or **Closed**. By default,\
    \ only the **New** and **In Progress** values are selected.\n+   - **Product Name:**\
    \ This filter allows you to select one or more of **Select All, Defender for Cloud\
    \ Apps, Microsoft Defender, Defender for Identities, Microsoft Information Protection,\
    \ Defender for Endpoint, Defender for IoT, Defender for Office 365, Microsoft\
    \ 365 Defender,** and/or **Microsoft Sentinel**. By default, **Select All** is\
    \ selected, which appears as just **All** in the summary bar, as shown in the\
    \ preceding screenshot.\n\n> **Additional products**\n> \n> As Microsoft adds\
    \ more security-related products to Azure and the ability to create alert rules\
    \ based on those products are added to Microsoft Sentinel, it is expected that\
    \ this list will expand to include them.\n\n+   - **Owner:** This filter allows\
    \ you to select one or more people to filter. Since anyone could be an owner of\
    \ an incident, the actual list is too long, and the values will not be listed\
    \ here. Note that there are some special entries, including **All Users** and\
    \ **Assigned to me**. **All Users** will show the incidents assigned to anyone,\
    \ including those that are unassigned. **Assigned to me** will just show those\
    \ incidents that are assigned to the user currently logged in."
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Select All / All Users


    The Select All / All Users entry in the filters section is a shortcut that allows
    you to select all the entries in the listing rather than having to select each
    one individually. By deselecting it, all the individual entries will be deselected
    as well, and each one can then be selected individually.


    The search and filtering section is very useful for finding a specific incident.
    You can make use of these features to help you quickly locate incidents when there
    is a long list, especially if you just need to view those incidents to which you
    are assigned. Next, we will discuss what you do when you''ve found the incident
    you want.


    # Incident listing


    Below the search and filtering section is a list of each incident, one per row,
    shown in the following screenshot. Here, you can see a summary of the incident,
    including the incident ID, title, the number of alerts that make up the incident,
    the product names that created the incident, the date and time of creation, the
    owner, and the status:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_289_0.png)


    Figure 9.5 – Incident listing


    On the far left is a checkbox. This checkbox is used to state that you want to
    perform an action on this incident. Refer to the Using the Actions button section
    for more information. You can also check the Select All checkbox at the top of
    this section to select all the incidents at once.


    After that is a colored strip. The colored strip indicates the incident''s severity:
    red for high, orange for medium, yellow for low, and gray for informational.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'The remaining fields are described in the following table:


    | Name | Description |

    |---|---|

    | Incident ID | This is the ID number of the incident that is publicly shown.
    |

    | Title | The title of the incident. This will match the name of the alert rule
    that generated it. |

    | Alerts | The number of alerts that created this incident. |

    | Product names | The name of the product that generated this incident. |

    | Created time | The time this incident was created. |

    | Last update time | The time this incident was last updated. |

    | Owner | The name of the person that owns the incident. |

    | Status | The status of the incident. |

    | Tags | Any tags associated with the incident. |

    | Tactics | Any of the MITRE ATT&CK tactics that are associated with this incident.
    |

    | Reason for closing | If this incident has been closed, the reason for closing
    will show here. |

    | Analytic rule name | The name of the analytic rule that created this incident
    |

    | Incident team | The name of the Microsoft Teams team that has been created to
    investigate this incident. |


    Table 9.1


    You can sort by the Incident ID, Title, Created time, Last update time, Owner,
    and Status fields. Clicking on any of these fields will sort the listings in ascending
    order. Clicking again will change the sort to descending order.


    Each incident has its own row in the listing with its own properties, as we have
    just seen. You can use most of these properties to sort the rows to help you find
    the incident you want. Next, we will look at the incident details pane, which
    will provide even more information about the selected incident.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Incident details pane


    When you select any incident from the list, the incident details pane will open,
    which shows more information about the selected incident. Of course, the information
    will be different depending on which incident you select:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_291_0.png)


    Figure 9.6 – Incident details page


    At the top of the page is the title, and the incident number appears directly
    beneath it. To the left of the title is a colored strip, indicating the severity
    of the incident: red for high, orange for medium, yellow for low, and gray for
    informational.'
  merge: -1
  img_proc: true
- pgno: 292
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 293
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 294
  md: 'Under those dropdowns are descriptions of the incidents. This provides more
    details about an incident and can include items such as what the incident is looking
    for, how it was determined, and even external links to get more information.


    Directly below that is the name of the product that created this incident under
    the Alert product names header. This information is useful in that it can help
    you determine if there will be more information that is stored in Microsoft Sentinel.
    If this incident is coming from another Azure security product, chances are there
    will not be as much additional information in Microsoft Sentinel, if any.


    Under that is the Evidence section. This is where you will find the number of
    events, alerts, and bookmarks that are in this incident. As shown in Figure 9.6
    previously, the incident being looked at has 24 events, 24 alerts, and no bookmarks.
    Click on any of these entries to get more information.


    Scrolling down the details pane, we find Last update time, Creation time, Entities,
    Tactics, the Incident workbook link, the Analytics rule link, and Tags, as shown
    in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_294_0.png)


    Figure 9.10 – Incident details page continued'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'As you would expect, the **Creation time** and **Last update time** fields
    show when the incident was created and when it was last updated.


    The **Entities** section shows some of the entities that are associated with this
    incident. Remember that they need to be mapped when creating an analytics rule
    and at least one must be filled in so that the **Investigate** link, described
    in the following figure, will be enabled. Click on the **View full details** link
    to see all the information about the incidents. Refer to the following *Entities
    tab* section for more information.


    The **Tactics** section shows the MITRE ATT&CK tactics that are associated with
    this incident. Both an icon and text are used to describe the various tactics.


    The **Incident workbook** link will take you to the Incident Overview workbook,
    where you can obtain additional information about the incident, including the
    reasons why similar incidents were closed, a log of all the activity that has
    occurred with this incident, and all the comments.


    The **Analytics rule** link will take you to the analytics rule that created this
    incident. This will allow you to see the query and other parameters that were
    used in the analytics rule.


    The **Tags** section will show you all the tags that are associated with this
    incident, if any. Click on the + button to add a new tag.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Scrolling down again, we find **Incident link** and **Last comment**, as shown
    in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_296_0.png)


    Figure 9.11 – Incident details page continued


    The **Incident link** field provides a URL that you can provide to others that
    will take them directly to the incident''s full details page, described in the
    *Exploring the full details page* section. This makes it easier to get to an incident,
    as the person will not need to traverse the Azure portal''s menus and then search
    for it.


    At the bottom of the page is the last comment that has been added to the incident.
    To the right of the **Last comment** field is the total number of comments associated
    with this incident. Clicking on this number will take you to the **Comments**
    tab in the full details page, described in more detail in the *The Comments tab*
    section. To add a new comment, enter the text in the **Write a comment** textbox
    and click on the **submit** button on the right. It will look like an arrow pointing
    to the right.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'The **View full details** button will open the full details page, which will
    be discussed in the *Exploring the full details page* section.


    The **Actions** button (not to be confused with the **Actions** button in the
    header) will show the following actions:


    | Name | Description |

    |---|---|

    | Investigate | This will open the graphical incident investigation page. Refer
    to the following *Investigating an incident* section for more information. |

    | Create automation rule | This will allow you to create an automation rule specifically
    for this incident type. Refer to *Chapter 11, Creating Playbooks and Automation*,
    for more details. |

    | Create team | This will allow you to create a Microsoft Teams team to facilitate
    the investigation of this incident. The use of this feature is outside the scope
    of this book. |


    Table 9.2


    Now that you have seen how to look at and update a single incident, let''s look
    at how you can update multiple incidents at once. This is done by using the **Actions**
    button in the page''s header.


    # Using the Actions button


    You have just learned how to change a single incident. What if you need to change
    more than one at a time? The **Actions** button from the header bar will allow
    you to do that.


    The **Actions** button will allow you to make changes to multiple incidents at
    once. Looking back at the header in *Figure 9.2*, you will see the **Actions**
    button. This button will allow you to perform the same action on multiple selected
    incidents.


    First, in the listing of all the incidents, select the checkbox to the left of
    the incidents on which you want to perform the action. You can also select the
    **Select All** checkbox to select all the incidents shown in the list.'
  merge: -1
  img_proc: true
- pgno: 298
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Exploring the full details page


    The full details page shows you a lot more information about the incident than
    you would see in just the incident listings and the incident details pane. Some
    additional information includes details on the alert(s) that make up the incident,
    any bookmarks associated with this incident, details on any entities that are
    part of this entity, and any comments added to this incident.


    Clicking on the View full details button in the incident details pane will take
    you to the incident''s full details page, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_299_0.png)


    Figure 9.13 – Incident full details page


    The left side of the page will show the same information as we saw in the Incident
    details pane section. As a matter of fact, the left side of the page is the same
    as the incident details pane. The right side of the page is broken up into tabs
    that show information about the alert itself, any bookmarks for this incident,
    the entities for this incident, and a list of all the comments. Each tab is described
    in further detail in the following sections.'
  merge: -1
  img_proc: true
- pgno: 300
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 301
  md: '# The Alerts tab


    This tab will show the one or more alerts that make up this incident. The following
    screenshot shows what it looks like, with a description of the fields following:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_301_0.png)


    Figure 9.15 – Incident Alerts tab


    First is a colored strip. The colored strip indicates the alert''s severity: red
    for high, orange for medium, yellow for low, and gray for informational.


    The rest of the fields are described in the following table:


    | Name | Description |

    |---|---|

    | Alert name | The name of the alert that generated this incident. |

    | Alert status | The status of the alert. |

    | Alert ID | The internal ID of the alert. Clicking on it will take you to the
    Logs page, where a query will automatically be generated and run to show you more
    information regarding this alert. |

    | Product name | The name of the product that was used in the alert rules to generate
    this incident. |

    | Events | The number of events that the analytics rule found when generating
    this alert. Clicking on the number will take you to the Logs page, where a query
    will automatically be generated and run to show you more information on the events.
    |

    | Creation time | The creation time of the alert that generated this incident.
    |

    | Time frame | This will show the beginning and end dates that the alert looked
    at when generating this incident. |


    Table 9.3'
  merge: -1
  img_proc: true
- pgno: 302
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 303
  md: '![](img/387db4214c5424f3a9b9dfa5ccc56a9d_303_0.png)


    Figure 9.17 – Incident Bookmarks tab


    You can use the Search textbox to search for a specific bookmark. For each bookmark,
    the Create Time, Name, Created By, and Tags fields will be displayed. At the far-right
    side of each listing is a context-sensitive menu where the only option is Remove
    from incident.


    Note that just to the right of the Created By entry for each row is the information
    icon. Mousing over that icon will show the note that was associated with the bookmark
    when it was created. If there is no note, this icon will not be shown.


    Clicking on the context-sensitive menu will automatically select the bookmark
    and clicking on the Remove from incident entry will prompt you to confirm that
    you meant to remove the bookmark. Selecting Yes will remove the bookmark from
    this incident. Note that if you have selected multiple bookmarks, the entry will
    change to say Remove X bookmarks from incident, where X is the number of selected
    incidents.


    # The Entities tab


    This tab will show all the entities associated with this incident, as shown in
    the following screenshot. There will be one row for each of the entities associated
    with the incident:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_303_1.png)


    Figure 9.18 – Incident Entities tab'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'You can use the **Search** textbox to search for specific entities. The **Entities**
    filter allows you to select one or more of **All**, **Account**, **Host**, **IP**,
    and/or **URL**. By default, **All** is selected.


    Each entity will be listed on a separate row. The name of the entity (which is
    also its value) and the type will be shown. If the entity is shown as a URL, you
    can click on it to go to the **User Entity Behavior Analytics (UEBA)** page to
    obtain more information about this entity. Refer to *Chapter 10, Configuring and
    Using Entity Behavior*, for more information.


    Entities are very useful pieces of information to look at when starting your investigation.
    They provide the basic information that the analytics rule has exposed to allow
    you to see what the incident pertains to.


    # The Comments tab


    This tab will show all the comments associated with the incident. Note that the
    link will also show the total number of comments – in this case, 1. You can also
    use this page to add new comments if desired:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_304_0.png)


    Figure 9.19 – Incident Comments tab


    As you can see in the preceding figure, you have some limited formatting capabilities
    available to you when you create a comment. The comment that has been added has
    made use of the bold, underline, and strikethrough text modification, and also
    added a link.


    Adding comments while performing your investigation will help you remember what
    you were doing. They will also help others that may need to come in later and
    either look at the same incident or investigate one that is similar. Next, we
    will look at how to go about investigating an incident.'
  merge: -1
  img_proc: true
- pgno: 305
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 306
  md: 'The header bar gives you general information regarding the incident, including
    the title, severity, status, owner, and last update time.


    On the right side of the screen are two columns of buttons. The column on the
    left contains the screen control buttons. The top button will fit your diagram
    to the screen. This is useful if you zoom in or out too far. Under that is the
    zoom-in button, and at the bottom is the zoom-out button. You can also use your
    mouse''s middle button to perform zooming if you have one. On the far right of
    the page are the buttons related to the incident itself, and each is described
    in more detail in the following sections.


    This is an interactive UI, so you can move the various objects shown on the screen
    around as needed, as well as the entire image. This can make it easier to see
    the part you are interested in when you zoom in.


    While being able to see the incident graphically is nice, the real benefit comes
    when you look at the related alerts to get a bigger picture of the incident.


    # Showing related alerts


    If you hover your mouse over an entity, this will show a pop-up window with more
    options. This will vary a bit depending on the type of entity you have selected,
    but they will all show the Related alerts actions, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_306_0.png)


    Figure 9.21 – Related alerts'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Selecting this will bring up all the alerts related to that entity. In the
    following screenshot, the related alerts for the user entity are shown:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_307_0.png)


    Figure 9.22 – Alerts related to the selected user entity


    This will help you determine what else has occurred that is related to this entity.
    By seeing what other alerts are related to this user, in this example, you can
    see what else they have done. We can see that the user entity is also an entity
    in other alerts, so we could look at those to get more information.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'Although it is called **related entities**, since you are looking at an alert
    rather than an entity, you can perform the action that we just discussed. In the
    following screenshot, **Suspicious granting of rights** was expanded. This shows
    that the alert uses the same entities as the incident we are investigating:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_308_0.png)


    Figure 9.23 – Investigating user activities


    The other actions available when you move the mouse over an entity, called **exploration
    queries**, will work similarly to how the **Related alerts** action works. Looking
    back at *Figure 9.21*, you can see that there are entries called **User account
    successful logons**, and more. In this case, this entry has one entry, designated
    by the **(1)** value after its name, and all the entries have **(0)** after the
    name, indicating that the query did not find any results. If any of these entries
    had one or more results, it would be worth selecting it to see what the results
    are as part of your investigation.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Now that we know how to look at an incident, its related incidents, and its
    exploration queries, let''s discuss the incident buttons located on the far-right
    side of the screen in detail.


    # The Timeline button


    The Timeline button shows the timeline of all the incidents being shown on screen.
    If this incident was just opened, then there will probably only be one incident
    shown, but if you show a lot of related alerts, then the timeline will show a
    history of when the alerts occurred, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_309_0.png)


    Figure 9.24 – Investigation timeline


    In the preceding screenshot, notice that the Suspicious granting of permissions
    incident is selected in the Timeline list. When you select a single incident,
    only those entities related to that incident will be highlighted in the view;
    the rest will be grayed out, as shown. This makes it easy to progress through
    the timeline and see what entities are related to which incidents.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# The Info button


    The **Info** button will show information on whichever entity you have selected.
    For the IP, host, and account, this will show either **Address**, **Hostname**,
    or **AccountName**, depending on which type you have selected, as shown in the
    following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_310_0.png)


    Figure 9.25 – Entity information


    Notice at the bottom of the blade is the **View full details** button. This will
    show up for the IP address, host, and account entries. This will take you to the
    **Entity Behavior** screen, where you can get more information about the selected
    entity. Refer to *Chapter 10, Configuring and Using Entity Behavior*, for more
    information.


    # The Entities button


    The **Entities** button will show a list of all the entities, alerts, and bookmarks
    related to all the information being shown on the screen. If you are just starting
    to investigate this incident, then this will most likely just be the information
    for your incident. However, if you are looking at a lot of related alerts, this
    will show all the information for those alerts as well:'
  merge: -1
  img_proc: true
- pgno: 311
  md: '![](img/387db4214c5424f3a9b9dfa5ccc56a9d_311_0.png)


    Figure 9.26 – List of related entities


    If you hover your mouse over any of the items listed, the UI will highlight the
    entities related to the item, much as it did for Timeline.


    # The Insights button


    The Insights button will show some additional information about the selected entity
    if there is anything. This information will vary depending on the selected entity
    type and will be covered more in Chapter 10, Configuring and Using Entity Behavior.


    # The Help button


    The Help button shows general help for this screen. The main screen of this page
    shows the entities and how they are related to each other. This is a fully interactive
    screen, which means you can move around the objects to get a better view, as well
    as zoom in and out.


    That was an introduction to how to start performing an investigation into an incident
    in Microsoft Sentinel. There is much more to performing investigations, and the
    links in the Further reading section should help.'
  merge: -1
  img_proc: true
