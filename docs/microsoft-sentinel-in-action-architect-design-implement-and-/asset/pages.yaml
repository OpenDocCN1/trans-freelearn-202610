    Add any **Tags** and **Notes** that are needed. When adding **Notes**, make sure
    they provide enough information so that when you or someone else comes back to
    this bookmark, it will be easy to understand what is going on. Enter any **Tags**
    that will be useful to filter to find the various bookmarks when needed.'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'Click **Create** to create the bookmark when all the fields have been filled
    in.


    # Important Note


    If you select multiple checkboxes when creating a bookmark, the first bookmark
    created will follow the naming convention stated earlier. For the rest, a new
    bookmark will be created for each selected result, and the **Name** will have
    (x) appended to it, where x is the copy number of the bookmark. For example, if
    there are four checkboxes selected and the bookmark name was set to Test Bookmark
    - 123456789012, then the first bookmark will have that name; the second will be
    named Test Bookmark - 123456789012 (1), the third will be named Test Bookmark
    - 123456789012 (2), and the fourth will be named Test Bookmark-123456789012 (3).
    This way, you can easily tell which bookmarks were created together.


    It is very easy to add bookmarks when you are performing your queries. In the
    next section, we will discuss how to use them.


    # Viewing bookmarks


    If you go back to the **Hunting** main page, you will see that there is a **Bookmarks**
