- pgno: 236
  md: '# Managing analytic rules


    Once your rules are created, you will need to manage them on an ongoing basis
    to ensure they remain useful. You may need to tweak a rule to give better results,
    change the Playbooks assigned to a scheduled rule, disable a rule, or even delete
    ones that are no longer needed.


    You can only manage those rules listed in the Active rules tab. So, follow along
    to complete these two simple steps:


    +   1. First, click on the Active rules link.

    +   2. In the listing of rules, to the right of the LAST MODIFIED column, is the
    context menu, and the three periods in a row, for each rule. Click on it and you
    will see a drop-down list, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_236_0.png)


    Figure 7.28 – Analytic rule context-sensitive menu


    Let''s see how to use these options:


    +   - Edit: This entry will allow you to edit the rule so that you can modify
    any of the fields as needed. You can also edit the rule by clicking on the Edit
    button on the details blade. Editing a rule will take you through the same pages
    as creating the rule with all the saved parameters filled in. Make the necessary
    changes and save them.

    +   - Disable: This entry will allow you to disable the rule. If the rule is disabled,
    then this entry will be labeled Enable and it will allow you to enable the rule.
    You can disable a rule if you think it is no longer needed before deleting it
    or if you are going to perform operations that you know will trigger the rule
    unnecessarily. Just remember to re-enable it when you are done!'
  merge: -1
  img_proc: true
