- pgno: 204
  md: '# # Types of analytic rules


    There are currently five types of rules: **scheduled, Microsoft Security, machine
    learning, Fusion, and anomaly.** Each type of rule fills a specific niche. Let''s
    explore each of these in turn.


    # ## Scheduled


    As the name suggests, these rules run on a set schedule to detect suspicious events.
    For instance, you can have a rule run every few minutes, every hour, every day,
    or at another interval. The queries for these rules will use KQL to define what
    they are trying to find. These rules will make up a large proportion of your analytic
    rules and, if you have used other **Security Information and Event Management
    (SIEM)** systems, these are probably the ones you are most familiar with.


    # ## Microsoft Security


    Microsoft Security rules are used to create Microsoft Sentinel incidents from
    alerts generated from other Microsoft Security solutions.


    > > **Note**

    > >

    > > Microsoft has recently renamed some of its Azure security offerings. While
    most documentation has been updated to use the new names, the Microsoft Sentinel
    rule templates have not. In the following list, the actual name of the rule temple
    is spelled out with the new name of the product in parentheses. It is recommended
    that when you create an alert rule from the template, you rename it to use the
    new name to avoid confusion.


    At the time of writing, the following security solutions can have their alerts
    passed through the following:


    +   - **Microsoft Defender for Cloud Apps**

    +   - **Microsoft Defender for Cloud**

    +   - **Microsoft Defender for Identities**

    +   - **Microsoft Defender for Endpoint**

    +   - **Microsoft Defender for Office 365**

    +   - **Microsoft Defender for IoT**'
  merge: -1
  img_proc: true
- pgno: 205
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Another difference that this type of rule has is the ability to set its **mode**.
    The mode can either be **Flighting** or **Production**. Production mode means
    the rule is running in production, while Flighting mode means you are testing
    your changes to see whether the changes work the way you desire. While you could
    have many different copies of a specific rule, only one of them at a time can
    be set to run in Production mode. If you set one of your copies to Production
    mode, then the one that was running in Production mode previously will be set
    to Flighting mode.


    Those are the various types of analytic rules available. As you can see, they
    cover a wide variety of use cases, from fully automated machine learning to scheduled
    rules that you create yourself. In the next section, we will look at the **Analytics**
    home page.


    # Navigating through the Analytics home page


    The **Analytics** home page is where you can view, create, and manage various
    alerts. Let''s navigate through this page.


    To access the **Analytics** home page, select **Analytics** from the left-hand
    navigation bar. The following screen will open:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_206_0.png)


    Figure 7.1 – Analytics home page'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'You will notice that the home page is arranged into three main parts:


    +   - The header bar

    +   - The listing of rules and templates

    +   - The detailed information section


    Each of these parts will be described in further detail in the following sections.


    # The header bar


    The following screenshot shows the header bar. Take a closer look at it. On the
    left is the number of **Active rules**; this is the number of rules that are currently
    in use. To the right of that is a listing of those rules broken down by the severity
    of the alert they will create. On the far right is a link that will open a new
    tab where you can learn more about analytic rules.


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_207_0.png)


    Figure 7.2 – Analytics header bar


    Under the heading bar is a selector to select either **Active rules** or **Rule
    templates**. Each of these tabs has different information. Let''s look at them
    now.


    # Rule and template listings


    Click on **Rule templates**. This will show all the rule templates that Microsoft
    has pre-loaded from Microsoft Sentinel''s GitHub repository for you to use. Note
    that these are templates only – you must create a rule from them to use them.
    There will be more on this later.


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_207_1.png)


    Figure 7.3 – Active rules/rule templates'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'If you observe in the preceding screenshot, the first rule template in the
    list states it is **IN USE**. This means that a rule has been created from this
    template already. Some of the rule templates, mainly any machine learning behavioral
    analytics or Fusion rules, will only allow you to create a single rule from the
    template, so if you see this message on those rule types, you know you cannot
    create another rule from the template. The other rule types have no such restrictions,
    so the message is more of a notification that there is at least one rule created
    from that template. Refer to the *Creating a rule from a rule template* section
    for more information.


    You may also see a **NEW** indicator on some of the rule templates. This means
    that the rule template has been recently added and you should probably look to
    see whether it is a rule that you can use.


    For each rule, the name, rule type, required data sources, and tactics (see the
    **MITRE ATT&CK®** callout later) will be displayed. You can sort the name and
    rule type fields but not the required data sources or tactics fields since they
    can have multiple values.


    Now, click on **Active rules** and you will see those rules that you have either
    created yourself or have used a rule template to create. The following screenshot
    shows an example of what this looks like. We will go into more detail about this
    view later in this chapter.


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_208_0.png)


    Figure 7.4 – Active rules'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Immediately under those tabs are a search box and filters, as shown in the
    following screenshot. The tab you are viewing will determine where the search
    and filters will look. If you are viewing the Rule templates tab, then the filter
    and search will only look for rule templates that match. Likewise, if you are
    viewing the Active rules tab, the search and filter will only look for active
    rules that match.


    Use the search box to search for the Rule templates or Active rules for which
    you know at least part of the title. Filters allow you to filter your view based
    on Severity, Rule Type, Tactics, and/or Data Sources. If you are looking at the
    Active rules tab on the Data Sources filter, it has been replaced by Status. Click
    on the filter to see a drop-down list of all the available options.


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_209_0.png)


    Figure 7.5 – Active rules search box and filters


    Under the filters is a listing of either Rule templates or Active rules, depending
    on which tab you are in. Let’s explore these next.


    Now, draw your focus to the left of the NAME field in both the tabs (Active rules
    and Rule templates). There is a color-coded column. This shows the severity of
    the alert that will be created. Red is for high, orange for medium, yellow for
    low, and gray for informational. This field is used as the default for sorting
    the rows.


    # Details pane


    Click on any row (in the following screenshot, we clicked on the Alsid Password
    Guessing template from the rule templates). This will show the details pane to
    the right of the listing, as shown in the following screenshot. In that pane,
    you can see as much of the full name that fits, preceded by an icon to match the
    rule type.'
  merge: -1
