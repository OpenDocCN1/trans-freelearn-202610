    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_148_0.png)


    Figure 5.10 – The project command


    The project command is like extend in that they can both create new columns. The
    main difference is that the extend command creates a new column at the end of
    the result set, while the project command creates the column wherever it is in
    the list of variables. It''s good practice to use the extend command for anything
    other than the simplest of computations to make it easier to read the query. There
    are two commands that produce the same results. The first command is as follows:


    ```

    StormEvents

    | extend Duration = EndTime - StartTime

    | project StartTime, EndTime, EventId, Duration

    ```


    The other command is as follows:


    ```

    StormEvents

    | project StartTime, EndTime, EventId, Duration = EndTime - StartTime

    ```


    Here, you can see that the project command is quite useful for cleaning up the
    results by removing those columns you don''t care about.'
