- pgno: 87
  md: '# 3

    Managing and Collecting Data


    One of the primary purposes of a Security Information and Event Management (SIEM)
    solution is to centralize the storage and analysis of security events across a
    diverse range of products that provide protection across your organization''s
    IT infrastructure. To do this, the solution needs to connect to those data sources,
    pull the data into a central store, and manage the life cycle of that data to
    ensure it is available for analysis and ongoing investigations.


    In this chapter, we will review the types of data that are most interesting and
    useful for security operations, and then explore the functionality available to
    connect to multiple data sources and ingest that data into Microsoft Sentinel
    by storing it in the Log Analytics workspace. Once the data is ingested, we need
    to ensure the appropriate configuration for data retention to maximize the ability
    to hunt for events and other security information, while also ensuring the cost
    of the solution is maintained at a reasonable level.


    We will cover the following areas specific to data collection:


    +   - Choosing data that matters

    +   - Understanding connectors

    +   - Configuring Microsoft Sentinel connectors'
  merge: -1
  img_proc: true
- pgno: 88
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Each of these solutions already gathers large volumes of data from their respective
    data sources; there may be certain cases where you may want to collect raw logs
    from these products into the SIEM for correlation across multiple data sources.
    However, you should consider this on a case-by-case basis to justify the cost.
    As an alternative, instead of collecting the raw data, these solutions can be
    configured to only send alerts or specific events that are actionable information.
    This can enable the SIEM to act as the central point of communication for analysis,
    alerting, and ticketing. The net result is a reduction in duplication and overall
    solution cost. This idea is summarized in the following diagram:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_89_0.png)


    Figure 3.1 – Data for security operations


    When dealing with large data volumes, we can use the seven Vs of big data to guide
    our decisions on what is the right data to collect, based on the priorities assigned:


    +   - **Volume:** This directly impacts the cost of moving and storing the data.

    +   - **Velocity:** This impacts the time to respond to an event.

    +   - **Variety:** Are we including every aspect of apps and infrastructure?

    +   - **Variability:** Is the information easy to understand and act upon?

    +   - **Veracity:** Do we trust the source and accuracy of the data?

    +   - **Visualization:** Can we use this data to create visualizations and comparisons?

    +   - **Value:** Consistently review the value of the data, reduce waste, and
    retain value.


    Here is an example of how to use each of these values to prioritize the data and
    provide some justification for the ingestion. Instead of focusing on total volume,
    consider the need for the quality and variety of the data to provide accurate
    and actionable information across multiple systems.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'A summary of this topic is shown in the following figure:


    | 7 Vs of Big Data |

    |---|---|

    | Volume | How much is enough, or too much? |

    | Velocity | How fast can we gather and analyze? |

    | Variety | Can we see all points of view? |

    | Variability | Standardized or requires formatting? |

    | Veracity | How accurate and verified is the data? |

    | Visualization | Can the data show trend analysis? |

    | Value | Is there value in retaining old data? |


    Figure 3.2 – The seven Vs of big data


    You can use this chart to guide your initial assessment of the types of data you
    need to ingest into Microsoft Sentinel and those that can be excluded. As an example:
    if you have implemented an EDR solution that will ingest, analyze, and alert on
    many client data sources, do you really need to ingest the full telemetry data
    into the SIEM, or can you just use the alerts? The EDR telemetry does need to
    be retained for longer periods, but the SIEM may not be the right place to put
    it. Instead, consider using a data lake such as Azure Data Explorer.


    One area for immediate improvement is to remove any data that is not for security
    purposes, such as performance metrics and statistical data from applications.
    These can be redirected to store in another Log Analytics workspace that does
    not have Microsoft Sentinel enabled. We recommend you review the data pipeline
    periodically to ensure you are maintaining a healthy dataset, either by adding
    more data sources, or by tuning out some of the data that no longer meets the
    requirements but has costs to store and process.


    In the next section, we will look at the different types of connectors available
    in Microsoft Sentinel.'
  merge: -1
  img_proc: true
- pgno: 91
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Native connections – service to service


    Microsoft Sentinel has been developed to integrate directly with several resources
    across Microsoft solutions, including (but not limited to) the following:


    +   - **Azure Active Directory** (Azure AD), including the Azure AD Advanced Identity
    Protection solution

    +   - **Office 365**, including Exchange Online, Teams, SharePoint Online, and
    OneDrive for Business

    +   - **Microsoft Defender 365**, including Microsoft Defender for Endpoint, Microsoft
    Defender for Identity, Microsoft Defender for Office 365, and Microsoft Cloud
    App Security

    +   - **Azure Security Center**, including Azure Defender

    +   - **Microsoft Defender for Identity**


    This is the preferred method for connecting to resources if the option is available.
    Let''s look at direct connections.


    # Direct connections – service to service


    Some connectors available in Microsoft Sentinel need to be configured from the
    source location. The connector will usually provide the information required and
    a link to the appropriate location. The data may be sent via an event hub or could
    be sent directly to the Log Analytics workspace. Examples of these connectors
    include the following:


    +   - **Amazon Web Services** (AWS), for AWS CloudTrail

    +   - Azure Firewall

    +   - Azure Front Door

    +   - Azure **Network Security Groups** (NSGs); flow logs and rule activations

    +   - Microsoft Intune; audit logs and operational logs


    Now, let''s look at API connections.'
  merge: -1
  img_proc: true
- pgno: 93
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Syslog server


    This is a transport mechanism implemented by deploying an agent on a Linux host
    that can act as a concentrator for many sources to send logs to, which are then
    forwarded on to Log Analytics for central storage. For detailed guidance on implementing
    a Syslog connector, please see this article: https://docs.microsoft.com/en-us/azure/sentinel/connect-syslog.
    Examples of third-party solutions that support this method include (but are not
    limited to) the following:


    +   - Carbon Black

    +   - Cisco (IronPort web security, Meraki, and others)

    +   - Citrix

    +   - F5 BIG-IP

    +   - NetApp

    +   - Palo Alto Cortex

    +   - Trend Micro


    While these options provide a wide range of options for data sources to gather,
    there is another method that, if available from the service provider, will give
    a richer dataset. Let’s look at the Common Event Format (CEF) option next.


    # Syslog server with CEF


    This is very similar to the Syslog server deployment mentioned previously. For
    more detailed information, see this article: https://docs.microsoft.com/en-us/learn/modules/connect-common-event-format-logs-to-azure-sentinel/.
    The CEF log format is extensible and adopted by multiple product vendors that
    want to provide greater detail in the logs generated. Examples of solutions that
    support this method include the following:


    +   - Cisco (Umbrella, cloud security gateway, and others)

    +   - CyberArk

    +   - F5 Firewall

    +   - McAfee Web Gateway

    +   - Palo Alto Networks firewall

    +   - Varonis

    +   - Zscaler'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'With this range of connectors available, it is possible to connect to and gather
    information from multiple resources across all your operating environments, including
    on-premises, a hosted service, the public cloud, and even industrial operations
    environments or the Internet of Things (IoT).


    Next, we will walk through the configuration of connectors in Microsoft Sentinel.


    # Configuring Microsoft Sentinel connectors


    The Microsoft Sentinel Data connectors page shows the total number of connectors,
    how many are currently connected, and how many are in development (identified
    by the Preview status). An example of the Data connectors page is shown in the
    following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_95_0.png)


    Figure 3.4 – Microsoft Sentinel Data connectors page'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'As you can see in the preceding screenshot, there are over 100 connectors available
    to implement in this Microsoft Sentinel instance. The list will continue to grow
    over time as more solutions become natively integrated, which is why you can see
    there is an ability to filter the list and search for specific data connectors.
    By selecting the connector on the left-hand side, we can view the connector details
    on the right-hand side. For this example, we will use the data connector for AWS,
    as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_96_0.png)


    Figure 3.5 – Data connector details


    At the top of the page in the preceding screenshot, we can see the status of the
    connector (Connected), the provider (Amazon), and the Last Log Received date/timestamp
    (should be within 1 hour).'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'The next section provides a description and further details about the connector,
    including a graph that will show the last 7 days of active log ingestion rate
    (when connected).


    At the bottom of the page, we can see the data types that are included in this
