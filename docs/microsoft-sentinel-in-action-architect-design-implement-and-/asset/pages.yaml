- pgno: 169
  md: '4. Clicking on any entry will also load that query into the KQL window. In
    the following screenshot, the All Syslogs query was clicked on but not yet run.
    Notice that the title of the KQL code window has been changed to match the name
    of the selected query:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_169_0.png)


    Figure 6.9 – Selected query from Query explorer


    # Important Note


    It should be noted that when you click on the query, a new query tab will open.
    However, if you were to click the same query again, it would not open a new tab
    for that query again. It would switch back to the original tab that held the query.'
  merge: -1
