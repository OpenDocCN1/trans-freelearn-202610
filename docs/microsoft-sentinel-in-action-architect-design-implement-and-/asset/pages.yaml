- pgno: 170
  md: '# Settings (the gear icon)


    The Microsoft Sentinel Logs page has a few settings that can be modified.


    Click on the Settings button. This will open the Settings blade as follows:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_170_0.png)


    Figure 6.10 – Logs page Settings pane


    Here you can choose from the following options:


    +   - **Date & Time**: Select which time zone to use when displaying the date
    and time. This will change how any of the date and time fields, such as **TimeGenerated**,
    are displayed. By default, the fields will be displayed using **Universal Time
    Coordinated (UTC)**, which is also known as **Greenwich Mean Time (GMT)** or **Zulu
    (Z)**. Use the drop-down menu to change this to the time zone you desire. You
    can also use the **Local Time** entry to have the date and time displayed in whatever
    local time zone your computer is using.'
  merge: -1
  img_proc: true
- pgno: 171
  md: "> Tip\n> Changing the date and time field here will change how the date and\
    \ time are displayed whenever you show a time field in the results. You can also\
    \ change the time zone used to display the time on a result-by-result basis in\
    \ the header of the Results section. See The results window section for more information.\n\
    \n+   - **Tables pane**: Choose what happens when you double-click on a table\
    \ in the **Tables** pane. If you select **Run preview query**, the KQL Query pane\
    \ will have the table name followed by:\n+   \n+     ```\n+     | where TimeGenerated\
    \ > ago(24h)\n+     | limit 10\n+     ```\n+   \n+     If you select **Adds the\
    \ table name to the query editor**, then only the table name will be placed in\
    \ the KQL Query pane and not any of the code.\n+   \n+     You can also determine\
    \ if you want empty tables to show up or not. If you enable the slider called\
    \ **Show tables with no data**, then any table that is part of your workspace,\
    \ even if it has no data, will show up.\n+   \n+     This can be useful if you\
    \ need to see what tables you have available to query, but could be frustrating\
    \ if you are expecting to see data in all the tables.\n\n```\n| where TimeGenerated\
    \ > ago(24h)\n| limit 10\n```\n\n+   - **Sort results**: Choose whether you want\
    \ to automatically sort the results using the **TimeGenerated** field or not.\
    \ If this is set to **On** (the default), then whenever the results are shown,\
    \ they will be sorted using the **TimeGenerated** field. If this is set to **Off**,\
    \ the results are shown in whatever order they were stored. Note that any sorting\
    \ performed in the query will override this selection.\n\n+   - **Table view**:\
    \ How many rows to show on each page. The drop-down menu allows you to select\
    \ **50**, which is the default, along with **100**, **150**, and **200**. Selecting\
    \ higher values will allow more rows to be shown on a single page.\n\n+   - **History\
    \ Queries** (not shown in the screenshot): There is nothing to modify here; it\
    \ is just to tell you how long the query history is stored for and how to clear\
    \ the query history.\n\nLet's look at the book icon next."
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Help (the book icon)


    This icon has no name assigned to it, but it is the one on the far-right side
    of the header that looks like a book.


    Click on it to find other options that can help you learn more about the Logs
    page and writing queries in general:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_172_0.png)


    Figure 6.11 – Logs page help


    Here you have the following options:


    +   - **Online course** will open a new tab and will take you to **Pluralsight**''s
    page, where you can view the free *Kusto Query Language (KQL) from Scratch* course.

    +   - **Language reference** will open the **KQL reference** page in a new tab.

    +   - **What''s new** will open the Azure Log Analytics updates page in a new
    tab.

    +   - **Using Log Analytics** will open the Log Analytics tutorial page.

    +   - **Getting started with Logs** will open a video on how to use Azure Monitor
    Log Analytics.

    +   - **Community Forum** will open the Microsoft Sentinel tech community page
    where you can ask questions about Azure Monitor.

    +   - **Community Git repo** will open the Microsoft Sentinel GitHub repository
    page.


    Tip

    Notice that all these entries are also duplicated on the right-hand side of the
    page under the **Learn more** heading.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'That''s it for the page header section of the Logs page. Next, we will look
    at the Tables pane, on the left side of the page.


    # The Tables pane


    The Tables pane will list all the tables that are part of your Log Analytics workspace,
    grouped together using predefined groups.


    Click on Tables and, looking at Figure 6.12, you will see that some of the logs
    are listed under a group called Microsoft Sentinel. There can also be groups called
    Office365, SecurityInsights, WindowsFirewall, and others.


    > **Tip**

    > Do not be concerned if you have greater or fewer groups than those shown here.
    The group will only be shown if there are any logs in it and the logs will only
    show if they are either part of Microsoft Sentinel or a connector is being used
    to populate them. For instance, the Office365 group will only show if the underlying
    OfficeActivity log is present, and that will only show if the Office365 connector
    has been enabled and has received data.


    Expanding a group will show all the tables under that group. In the following
    screenshot, the Microsoft Sentinel group was expanded, showing all the logs under
    it:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_173_0.png)


    Figure 6.12 – The Tables pane'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'If you hover over any of the tables, a new window will pop up showing some
    information about the table, as shown in Figure 6.13.


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_174_0.png)


    Clicking on the star icon will save this entry as a favorite. It will show up
    at the top of the list under the Favorites section. This will be an identical
    entry so that you can expand it to see its columns and hover over it to see the
    eye icon, described next.


    Clicking on the See preview data link will expand the pop-up window and will show
    the first 10 rows of the table, as shown in Figure 6.14. Notice that there are
    two new links added as well.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'The Use in editor button, shown at the top of the window, will place the name
    of the table into the KQL Query pane. The name of the table, under the Useful
    links header, will take you to a page that has detailed information regarding
    the table, including the fields and descriptions.


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_175_0.png)


    Figure 6.14 – Sample records from the log


    Note

    Some of the tables'' pages are more complete than others with regard to the information
