- pgno: 13
  md: '# Preface


    Microsoft Sentinel is an intelligent security service developed by Microsoft with
    a focus on integrating and bringing together cloud security and artificial intelligence.
    *Microsoft Sentinel in Action* will help you to gain enough understanding to make
    the most of Azure services to secure your environment against modern cybersecurity
    threats.


    During Ignite 2021, Microsoft announced that Azure Sentinel will be renamed to
    Microsoft Sentinel. However, changing the name everywhere is a very time consuming
    task and, as of when this book was finished, the process was not yet completed.
    Due to this, some images shown still show Azure Sentinel rather than Microsoft
    Sentinel as the name change were yet to be completed in the Azure portal, however,
    the functionality is still the same.


    # Who this book is for


    If you are an IT professional with prior experience in other Microsoft security
    products and Azure and are now looking to expand your knowledge to incorporate
    Microsoft Sentinel, then this book is for you. Security experts using an alternative
    SIEM tool who want to adopt Microsoft Sentinel as an additional service or as
    a replacement will also find this book useful.


    # What this book covers


    *Chapter 1, Getting Started with Microsoft Sentinel*, includes an overview of
    the cloud security architecture as we see it today. This information lays a foundation
    for understanding what a modern **Security Operations Center (SOC)** is and why
    Microsoft Sentinel plays a key role. We will focus on the specific components
    needed to create a SOC platform and how Microsoft Sentinel brings all the data
    together to provide a central analysis and action capability.


    *Chapter 2, Azure Monitor – Introduction to Log Analytics*, focuses on the creation
    of the Azure Log Analytics workspace, which is where we store all the log data
    for Microsoft Sentinel to analyze. This is an important first step in configuring
    Microsoft Sentinel.'
  merge: -1
  img_proc: true
