  md: '| Name | Description |

    |---|---|

    | Title | The name of the workbook. This should be descriptive enough so that
    users can easily tell what kind of information will be shown. |

    | Subscription | Select the subscription where this workbook will reside. It should
    be the same subscription as your Log Analytics workspace. |

    | Resource group | Select the resource group where this workbook will reside.
    It does not matter if it resides in the same resource group as your Log Analytics
    workspace. For instance, you could have one resource group for all resources related
    to your Microsoft Sentinel instance, or one resource group just for your workbooks,
    or a combination of both. Follow your corporate standards on where to place items
    if these apply. |

    | Location | Select the location where your workbook will reside. You will want
    this to be the same location as your Log Analytics workspace to avoid egress charges.
    |


    Table 8.1


    Below that is a checkbox labeled Save content to an Azure Storage Account. If
    you need to protect the information stored in the workbook, you can secure it
    by saving the workbook''s content to an Azure Storage account. See the Further
    reading section at the end of this chapter for a link to get more information
    on how to do this.


    4. Click Save to save the workbook.


    **Note**

    It is not actually necessary for you to save the new workbook before you edit
    it. It is generally recommended that you do so to make sure you have a saved copy
    of it that you can revert to should your edits not work correctly.


    That is all there is to it. Now, you will need to edit the workbook so that you
    can edit or remove the existing steps or add your own new steps. Refer to the
    next section, where we will cover more details on what can be done to modify your
    workbook.'
