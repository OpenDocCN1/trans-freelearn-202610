    Figure 10.9 – Notable events


    As you can see, this section is broken into three main subsections: the search
    and filter area, Events and alerts over time, and the Alerts and activities timeline
    subsection. Each subsection will be described in more detail in the following
    sections.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Search and filter subsection


    This area allows you to search for a specific alert or action. In addition, you
    can filter the information that''s shown using the various filters described in
    the following table:


    | Filter Name | Description |

    |---|---|

    | Time range | This allows you to specify what time range you want to use. When
    you click on it, you will be shown a pop-up window that will allow you to select
    what time range you want to use. This can be different from the time range that
    was selected on the main page. |

    | Timeline content | This allows you to select which items to show on the timeline.
    The options are Security Alerts, Bookmarks, Activities, and Select All. |

    | Alerts | Selecting this will allow you to filter which alerts to show. You can
    select the individual alert names to show or Select All to see all the alerts.
    Note that if this entity does not have any alerts, then this filter will be disabled.
    |

    | Actions | Selecting this will allow you to filter which actions to show. You
    can select the individual action names to show or Select All to see all the alerts.
    Note that if this entity does not have any actions, then this filter will be disabled.
    |

    | Alert Severity | Selecting this will allow you to filter which alert severities
    to show. You can select the individual severity names to show or Select All to
    see all the severities. Note that if this entity does not have any alerts, then
    this filter will be disabled. |

    | Bucket size | Selecting this will allow you to change the bucket size that is
    used to group activities. This will determine how the various items are grouped.
    |


    Table 10.1


    Let''s now discuss about the other subsections.


    # Events and alerts over time subsection


    This presents a timeline that shows how much activity this entity has had on certain
    tables over the selected time range. This works just like Events and alerts over
    time, which is shown on the Microsoft Sentinel overview page, but it just shows
    the information for the selected entity.


    The actual table(s) displayed will depend on which entity is being viewed, as
    well as what data connectors are enabled.'
  merge: -1
  img_proc: true
- pgno: 325
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 326
  md: 'Clicking on the **Customize entity page** button from the **Entity behavior**
    main page will take you to the **Entity Settings** page, as shown in the following
    screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_326_0.png)


    Figure 10.10 – Entity Settings page


    The page is broken into three sections: the header bar, the activities list, and
    the activities detail pane. Each section will be described in the following sections.


    # Header bar


    The header bar allows you to refresh the page, add a new activity, delete an activity,
    disable/enable an activity, and learn more about custom activities, as shown in
    the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_326_1.png)


    Figure 10.11 – Entity Settings header bar


    The **Refresh** button will allow you to refresh the page.


    The **Add activity** button will start the new activity wizard. See the *Adding
    a new activity* section for more information.


    The **Delete** button will delete the selected activity or activities. If none
    are selected, this button will be disabled.


    The **Enable/Disable** button will enable a disabled activity or activities or
    disable enabled ones.


    The **About Custom Activities** button will open a new tab in the browser and
    show a page that provides more information on how to add custom activities.'
  merge: -1
  img_proc: true
- pgno: 327
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Activity details pane


    This pane will show information about the activity and will allow you to edit
    a custom activity or create a custom activity from an out-of-the-box one. The
    following screenshot shows what the pane will look like when looking at a custom
    activity (left-hand side) as opposed to an out-of-the-box activity (right-hand
    side):


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_328_0.png)


    Figure 10.13 – Activity details pane


    They both show a lot of the same information, including Name, Description, Identifiers
    (more on those later), and the query that is being used. However, the custom activity
    also shows the Id property, while the out-of-the-box activity shows the Data source
    property.


    You can modify an existing activity by clicking on the Edit button. If you are
    looking at an out-of-the-box activity, you can create a custom activity by clicking
    on the Create activity button which, will start the Activity wizard window with
    a lot of the fields already filled in. See the Adding a new activity section for
    more details.


    Here, you will see an overview of the Entity Settings page. It shows a lot of
    information regarding not just the out-of-the-box activities but also those that
    you have created.


    Next, we will look at how to create a custom activity.'
  merge: -1
  img_proc: true
- pgno: 329
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 330
  md: 'This is the first tab of the wizard. It provides some basic information regarding
    the purpose of the wizard. You must also fill in the following fields:


    +   - The **Name** field is where you enter the name of the custom activity. Make
    it descriptive enough that it gives someone a good idea of what this activity
    will do.

    +   - The **Description** field can contain a more detailed description of this
    activity.

    +   - The **Entity type** dropdown lists all the different entities that you can
    use when writing the custom activity. Currently, only **Account** and **Host**
    are available.

    +   - The **Filter by parameter** dropdown allows you to filter the entity by
    an additional parameter. The list of parameters will vary, depending on which
    entity type was selected. If a parameter is selected, then the **Parameter value**
    dropdown will activate, and the available options will be listed.

    +   - The **Status** field allows you to select whether the action is **Enabled**
    or **Disabled**.


    Once you have entered all these values, click on the **Next: Activity configuration**
    button to go to the next page of the wizard.


    # Activity configuration


    This page allows you to enter the query for your activity and other information,
    as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_330_0.png)


    Figure 10.15 – Activity wizard – Activity configuration tab'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'Each field is described as follows.


    **Activity query** is where you will enter the KQL query that this activity will
    be used for. This text box will provide information about the KQL you are entering,
    much like you were when working on the **Logs** page of Microsoft Sentinel. Notice
    at the top right-hand corner of the text box that there is an icon that looks
    like a double-headed arrow. Clicking on that will allow you to expand or contract
    this text box to make it easier to see all your code.


    You will be using variables that get passed into the query to work against a specific
    entity. For instance, if I am writing an action to work against a Host entity
    type, I could write my query like so:


    ```

    Heartbeat

    | where Computer == ''{{Host_HostName}}''

    ```


    This investigates the Heartbeat table and filters by the current host entity.
    Notice that the variable is surrounded by {{ and }}. This is used to designate
    the variable''s name. You are not limited to just using one variable and, in many
    cases, you will have many different variables in your query.


    Note that if you use this query, an error and a warning message will be displayed.
    The error message will tell you that you are only allowed to return a maximum
    of 10 columns from your query, so you should use the project command to filter
    your results.


    > **Note**

    > While the error message will say you are limited to 10 columns being returned,
    **TimeGenerated** must be one of them, so you technically only have nine columns
    that you can choose to return.


    The warning will say that the identifier you have chosen is weak and that you
    should consider using additional identifiers to ensure the reliability of the
    results. You can use the query with just the identifier you have selected if you
    so choose but the results may not be accurate.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'If you look below the **Activity query** text box, you will see a line of text
    that lists the available identifiers. This listing will be different, depending
    on which entity type you selected on the previous screen.


    Since, in this example, the Host entity type was selected, the available values
    are **Name**, **NTDomain**, **UPNSuffix**, **AadUserId**, and **Sid**. Clicking
    any of these entries will add the appropriate code to the **Activity query** text
    box, making it much easier to create your queries.


    Directly underneath the **Activity query** text box is the **View query results**
    link. Clicking on that will take you to the **Logs** page, with the query filled
    and automatically running. This can be useful to test your queries but remember
    that the variables will not be filled in, so no data will be returned when running
    the query as-is.


    **Activity title** will allow you to enter the title that you want to appear in
    the timeline. One great feature of this is that you can use the variables that
    have been returned from your query in the title. Keep in mind that you are limited
    to 10 columns being returned (as per the error message we discussed previously),
    so determine which columns you will want to use in your title when writing your
    query.


    Looking under **Activity title**, which can be expanded or collapsed, is a subsection
    called **Available values**. Clicking on it will show the fields that you can
    use, as shown in the following screenshot. These fields will be taken from the
    query you have entered, so the actual entries will be different. Other variables
    will be available as well, including the identifiers you can use in your query,
    some different time fields, and a count of the number of results. You can click
    on the **Copy to clipboard** icon (which looks like two sheets of paper) on the
    right of each value so that you can then paste them into the **Activity title**
    text box. The actual value of the variable will be filled in when the activity
    is displayed in the timeline:'
  merge: -1
  img_proc: true
- pgno: 333
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 334
  md: 'On this tab, all the values you have entered will be reviewed to make sure
    there are no errors. If there are none, you will see a screen like the following.
    In this case, everything was entered correctly, so a message at the top of the
    screen will inform you of that fact and the Create button will be activated:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_334_0.png)


    Figure 10.17 – Activity wizard – Review and create – good entries'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'If there are any errors, the message at the top of the screen will state that
    there is an error and the **Create** button will be disabled. You will need to
    go back and review your entries to see where any errors may have occurred. It
    will likely be in the query itself, as shown in the following screenshot. Notice
    that there is no `project` command to limit the number of columns being returned:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_335_0.png)


    Figure 10.18 – Activity wizard – Review and create – bad entries


    Once everything is ready to go, click on the **Create** button to create your
    new activity. Again, the only difference between creating a new activity from
    scratch and one from an existing out-of-the-box template is that when you''re
    doing this from a template, the fields will already be filled in for you.


    With that, you know all about Microsoft Sentinel''s Entity behavior and how to
    use it. This will make your investigations much easier in the future.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Summary


    In this chapter, you learned how to activate and configure Microsoft Sentinel''s
    Entity behavior functionality. You learned how to view information when looking
    at an entity and the different ways to find the entities to view. You also learned
    how to write activities to use in your investigations.


    With what you have learned, you can now perform investigations using entities
    quickly and easily. You can use the out-of-the-box activities, plus the ones you
    have written, to get detailed information about your entities.


    In the next chapter, you will learn about the operational tasks you must perform
    to keep your Microsoft Sentinel instance running smoothly.


    # Questions


    Answer the following questions to test your knowledge of this chapter:


    +   1. What three types of entities can be viewed in Entity behavior?

    +   2. What are the three types of information that can be presented in the entity''s
    timeline?

    +   3. If I am looking at an entity and only want to see its activities, how would
    I do that?

    +   4. In which two ways can I create a custom activity?

    +   5. What are the two entity types that can be used to create a custom activity?


    # Further reading


    Please refer to the following links for more information on the topics that were
    covered in this chapter:


    +   - Enable User and Entity Behavior Analytics (UEBA) in Microsoft Sentinel:
    https://docs.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics

    +   - Microsoft Sentinel UEBA enrichments reference: https://docs.microsoft.com/en-us/azure/sentinel/ueba-enrichments

    +   - Customize activities on entity page timelines: https://docs.microsoft.com/en-us/azure/sentinel/customize-entity-activities

    +   - Microsoft Sentinel entity types reference: https://docs.microsoft.com/en-us/azure/sentinel/entities-reference'
  merge: -1
  img_proc: true
- pgno: 337
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 338
  md: 'In this chapter, we will cover the following topics:


    +   - Introducing the Microsoft Sentinel Hunting page

    +   - Working with Microsoft Sentinel hunting queries

    +   - Working with livestream

    +   - Working with bookmarks

    +   - Using Microsoft Sentinel notebooks

    +   - Performing a hunt


    # Introducing the Microsoft Sentinel Hunting page


    To access the Microsoft Sentinel | Hunting page, select the Hunting link in the
    Microsoft Sentinel navigation menu. This will show the Microsoft Sentinel | Hunting
    page, which will look like the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_338_0.png)


    Figure 11.1 – Hunting page overview


    Each of these sections will be described in more detail in the following sections.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# The header bar


    The header bar, at the top of the page, has the usual **Refresh** button and timespan
    dropdown. There is also a **New Query** button that will allow you to create a
    new query (refer to the *Adding a new query* section for more information). The
    header bar can be seen in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_339_0.png)


    Figure 11.2 – Hunting page''s header bar


    Next, we have the **Run all queries (Preview)** button. This button will run all
    the hunting queries in the background and will then update the hunting query list
    section with the number of results found. This is easier than running each query
    one after another. You can also select which queries you want to run; in which
    case the button will be relabeled to read **Run selected queries (Preview)** and
    will only run those queries you have selected.


    > **Important Note**

    > If you have read the first edition of this book, you may have noticed that this
    button used to be **Run all queries**. The reason this is now called a preview
    feature is that between the time the first edition was released and when this
    edition was being written, this button was changed to only run those queries that
    are shown on the page, so you would have to go to the next page if you wanted
    to run the fifty-first query. Due to overwhelming customer demand, this has recently
    been changed back to run all queries. You can also select just the ones you want
    to run.


    There is also the **Columns** button, which will allow you to select or unselect
    which columns you want to see. Keep in mind that, depending on the number of columns
    you select, you will need to scroll to the right to see some of them.'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'The available choices are as follows:


    | Name | Description |

    |---|---|

    | Favorites | The star icon determines whether this is a favorite, in which case
    it will be filled in, or not, and only the outline will show. Favorites will also
    appear first in the listing of queries. |

    | Query | This is the title of the query and not the KQL query. |

    | Provider | This is who provided the query. This will typically be either Microsoft
    or Custom Queries. |

    | Created By | This is who wrote the query. It will either contain the name (or
    email) of the person who created the custom threat hunting query or be blank if
    it was provided by Microsoft. |

    | Created Time | The date and time the query was created. |

    | Entities | This will show which entities the query will provide. |

    | Data Source | This will list the data source that this query requires. If there
    is more than one data source required, the first one will be listed along with
    a number telling you how many more data sources there are. You can mouse over
    the information icon, which looks like an i inside a circle, to see the other
    data sources. |

    | Results | If the query has not yet been run, this will show two dashes to indicate
    that. If it has been run, it will either show the number of results returned or
    N/A if it was unable to run due to missing data sources. |

    | Results delta (preview) | This will show the delta between the results from
    the current run of the queries and the results from the last run of the queries.
    |

    | Tactics | This will show the MITRE ATT&CK® tactics that this query uses. |

    | Techniques (preview) | This will show the MITRE techniques that this query uses.
    Note that these will only show up for Microsoft-provided queries, as there is
    no way to select these when creating your own queries. |'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'The header bar shows the links needed to start your query. It also can change
    what information the threat hunting screen shows by showing or hiding specific
    columns.


    # The summary bar


    The summary bar shows the total number of queries that are active and the number
    that are available to run, the total number of queries that have results and the
    total number of queries run, the total number of livestream results (refer to
    the Working with livestream section for more information), the total number of
    bookmarks that you have (refer to the Working with bookmarks section for more
    information), and, on the far right, a link to learn more about threat hunting,
    as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_341_0.png)


    Figure 11.3 – Hunting page''s summary bar


    You may have noticed in the previous screenshot that while there are 194 queries
    in total, only 131 are listed as active. This is due to the Microsoft Sentinel
    environment where this screenshot was captured not having all the needed tables
    for the queries to run.


    # The hunting queries list


    Below the header is a listing of all the hunting queries. At the top of the listing
    is the MITRE ATT&CK® breakdown. Clicking on any of the icons in the MITRE ATT&CK®
    breakdown will show you only those queries that have that specific attack type
    associated with them. So, if you click on the Initial Access icon (the first icon
    that looks like a monitor), it will only show those hunting queries that have
    Initial Access as one of their entries in the Tactics field.


    The summary bar gives you a good overview of how your hunting queries are broken
    down. This can make it easier to find those queries that you need in your investigations.


    > **Important Note**

    > You can visit https://attack.mitre.org/tactics/enterprise/ to learn more about
    MITRE ATT&CK®.


    Below that is the search and filtering section. This works like other pages''
