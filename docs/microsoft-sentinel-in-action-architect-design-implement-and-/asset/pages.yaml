- pgno: 388
  md: '# Types of playbooks


    Currently, there are two types of playbooks, those that use the **When a response
    to an Microsoft Sentinel alert is triggered** logic app trigger and those that
    use the **When Microsoft Sentinel incident creation rule was triggered** logic
    app trigger. Each has its uses, as described in the following section.


    For those playbooks that use **When a response to an Microsoft Sentinel alert
    is triggered**, referred to as **Alert Playbooks** going forward, they only work
    against alerts. This can be useful since, at the time of writing, they are the
    only playbooks that can be run manually, meaning that when you are looking at
    the alerts in the incident''s view full details page, these are the only ones
    that can be run by clicking on the playbooks link. However, to use these on analytic
    rules, they must be applied to each one.


    Those playbooks that use **When Microsoft Sentinel incident creation rule was
    triggered**, referred to as **Incident playbooks** going forward, are the only
    ones that can be used with Automation rules. However, since they currently cannot
    be executed manually, they cannot be run against an incident other than through
    automation rules.


    When should you use each? That depends on the use case.


    As we mentioned previously, only the Alert playbooks can be executed manually,
    so they are good if you need to run them against alerts after they have been created.
    However, to use them on Analytic rules, you will need to go into each Analytic
    rule and state that this playbook will be used.


    Incident playbooks are the only ones that can be used in Automation rules, so
    if you want to run the playbook when an incident is created, these are the ones
    to use. Just remember that they cannot be run manually.


    Overall, you will probably have a mixture of these different types of playbooks
    to meet the different needs. Now, let''s look at the logic app connector that''s
    used to make the playbooks.


    # Overview of the Microsoft Sentinel connector


    While there are many logic app connectors, and more are being added all the time,
    the one we are concerned with is the Microsoft Sentinel connector. It provides
    us with the triggers that can kick off our playbook. It also contains various
    actions that can perform tasks such as obtaining information about a specific
    incident, getting information about the entities associated with an alert, updating
    an incident, and more.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '> **Note**

    > At the time of writing, all the features of the Microsoft Sentinel connector
    were in preview, so they could have changed from what is shown and discussed here.


    As discussed in the previous section, the connector currently has two triggers
    called **When a response to an Microsoft Sentinel alert is triggered** and **When
    Microsoft Sentinel incident creation rule was triggered**. This means that the
    trigger will fire whenever an alert or incident is created, depending on which
    one is selected.


    It is worth noting that while the alert trigger returns a lot of information,
    it does not return the actual incident that gets created – if one gets created
    at all. To get the incident’s information, you need to use one of the actions
    given in *Table 12.3*.


    The following table lists all the current actions for the Microsoft Sentinel connector:


    | Name | Description |

    |---|---|

    | Add comment to incident | Adds a comment to the selected incident. |

    | Add labels to incident (to be deprecated) | Adds a label to the selected incident.
    Note that it is recommended to use Update Incident going forward. |

    | Change incident description (to be deprecated | Changes the description of the
    selected incident. Note that it is recommended to use Update Incident going forward.
    |

    | Change incident severity (to be deprecated) | Changes the severity of the selected
    incident. Note that it is recommended to use Update Incident going forward. |

    | Change incident status (to be deprecated) | Changes the status of the selected
    incident. Note that it is recommended to use Update Incident going forward. |

    | Change incident title (to be deprecated) | Changes the title of the selected
    incident. Note that it is recommended to use Update Incident going forward. |

    | Entities – Get Accounts | Gets a list of all the account entities. |

    | Entities – Get FileHashes | Gets a list of all the filehash entities. |

    | Entities – Get Hosts | Gets a list of all the host entities. |

    | Entities – Get IPs | Gets a list of all the IP entities. |

    | Entities – Get URLs | Gets a list of all the URL entities. |

    | Alert – Get incident | Returns the incident associated with the selected alert.
    |

    | Remove labels from incident (to be deprecated) | Removes the labels from the
    selected incident. Note that it is recommended to use Update Incident going forward.
    |

    | Update incident | This allows you set various attributes of the incident, including
    tags, owner, severity, status, title, and description. It also allows you to remove
    tags. |

    | Watchlists – Add a new watchlist item | Allows you to add a new entry to an
    existing watchlist or create a new one. |

    | Watchlists – Update an existing watchlist item | Allows you to update an entry
    in an existing watchlist. |


    Table 12.3'
  merge: -1
  img_proc: true
