- pgno: 33
  md: "This solution works best when there is a rich source of log data streaming\
    \ into the log management solution, tied in with data feeds coming from threat\
    \ intel and vulnerability scans and databases. This information is used for discovery\
    \ and threat hunting and may indicate any issues with configuration drift. The\
    \ core solutions of the SOC operations include the SIEM, CASB, and EDR, among\
    \ others, each with its own **End User Behavior Analytics (EUBA)** and SOAR capabilities.\
    \ Integrating these solutions is a critical step in minimizing the noise and working\
    \ toward improving the speed of response. The outcome should be the ability to\
    \ report accurately on the current risk profile, compliance status, and clearly\
    \ communicate in situations that require an immediate response and accurate data.\n\
    \n# Security solution integrations\n\nMicrosoft Sentinel is designed to work with\
    \ multiple security solutions, not just those that are developed by Microsoft.\n\
    \nAt the most basic level, log collection and analysis are possible from any system\
    \ that can transmit its logs via the Syslog collectors. More detailed logs are\
    \ available from those that support CEF-encoded Syslog endpoints that share Windows\
    \ event logs. The preferred method, however, is to have direct integration via\
    \ APIs to enable two-way communication and help to manage the integrated solutions.\
    \ More details relating to these options are included in *Chapter 3, Managing\
    \ and Collecting Data.*\n\n> **Common Event Format (CEF)**\n> \n> CEF is an industry-standard\
    \ format applied to Syslog messages, used by most security vendors to ensure commonality\
    \ between platforms. Microsoft Sentinel provides integrations to easily run analytics\
    \ and queries across CEF data. For a full list of Microsoft Sentinel CEF source\
    \ configurations, review the article at https://aka.ms/SentinelGrandlist."
  merge: -1
  img_proc: true
