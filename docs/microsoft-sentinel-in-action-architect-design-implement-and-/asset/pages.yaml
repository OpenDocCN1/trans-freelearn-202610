  md: '![](img/387db4214c5424f3a9b9dfa5ccc56a9d_245_0.png)


    Figure 8.7 – Saved template buttons


    Let''s discuss each of these buttons in detail:


    +   - If you have saved the template as a workbook, the first button that will
    be shown is **View saved workbook**. This will allow you to look at the workbook
    you have created from the template, including any changes that you have made to
    it. This activity will be discussed in the *Creating workbooks* section later
    in this chapter. If you have not saved the template as a workbook, then the **Save**
    button will be displayed, as shown in *Figure 8.6*. Clicking this will allow you
    to create a new workbook from a template. Refer to the *Creating a workbook using
    a template* section for more information.

    +   - The next button is **View template**. This will show whether you have saved
    the template as a workbook already, as you can see in both *Figures 8.6* and *8.7*.
    This will allow you to view the template. This is a fully interactive view of
    the template, although the only action you can perform is to refresh the template.
    You will not be able to save or modify the template from this view.

    +   - The next button will depend on whether you have saved the template as a
    workbook. If you have saved the template, the **Delete** button will be displayed,
    as shown in *Figure 8.7*. Clicking this will cause a validation popup to appear.
    If you confirm the deletion, the saved workbook, including any changes you have
    made, will be deleted.


    The **My workbooks** tab will show the same information as the **Templates** tab,
    except that it will only show those workbooks that have been saved from a template
    or created from scratch. Also, at the bottom of the detailed description window,
    the buttons have changed.


    If you have created a workbook from scratch, without creating it from an existing
    template, then the buttons will be shown as in the following screenshot. Since
    there is no template to view, the **View template** button will not be shown:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_245_1.png)


    Figure 8.8 – Buttons for creating a workbook from scratch'
