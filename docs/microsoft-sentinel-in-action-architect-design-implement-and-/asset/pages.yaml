- pgno: 60
  md: '# Using PowerShell


    PowerShell is a scripting language that can be used across various machines, including
    Windows and Linux computers, and was built on top of .NET. Because of this, it
    can accept .NET objects, making it incredibly powerful. PowerShell has many different
    commands, including some which are specifically created for working with Azure,
    which we will use here.


    Follow these steps to create a new workspace using PowerShell:


    +   1. Determine in which resource group the workspace will reside. If you have
    one already created, skip to step 3.

    +   2. To create a new resource group, run this command:

    +   3. Enter the following command:

    +   4. You will be prompted for the Log Analytics workspace name as well. Enter
    a valid name and press Enter to continue.

    +   5. Once the command has finished running, it will show a success screen with
    a summary of the values used as follows:


    ```

    New-AzResourceGroup -Name <resource-group-name> -Location <location>

    ```


    Replace <resource-group-name> with the name of the new resource group and <location>
    with the location where the resource group will reside, such as EastUS or WestUS.
    If you do not know what to use for your location, run this command:


    ```

    Get-AzLocation

    ```


    Find the location you want and use the value listed under Location.


    ```

    New-AzResourceGroupDeployment -Name <deployment-name> -ResourceGroupName <resource-group-name>
    -TemplateFile $HOME/deployworkspacetemplate.json

    ```


    Replace <deployment-name> with the name of this deployment. You can use something
    like <labworkspace>. It is not important what you enter, as this is just a placeholder
    name so that when you look at the resource group, you can distinguish the various
    deployments. Replace <resource-group-name> with the name of the resource group
    where the workspace will reside.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/387db4214c5424f3a9b9dfa5ccc56a9d_61_0.png)


    Figure 2.7 – Running New-AzResourceGroupDeployment in PowerShell


    If you get an error screen, make sure to read the message, as the messages are
    usually quite specific as to what caused the error.


    +   6. Close the Cloud Shell session.


    That is how you can create a new Log Analytics workspace using an ARM template
    and PowerShell. This can be preferable to using the Azure portal as it is repeatable.
    Next, we will look at using the Azure CLI and see how to create a new workspace
    without using the ARM template.


    # Using the CLI


    The Azure CLI is also a cross-platform scripting tool developed by Microsoft.
    Initially, it was the only tool that was cross-platform, so if you were working
    on a computer that was not running Windows, it was your only option. PowerShell
    is now cross-platform as well, so the main difference between the two is that
    the Azure CLI can create Azure resources directly without using an ARM template.'
  merge: -1
  img_proc: true
