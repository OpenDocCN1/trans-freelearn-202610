- pgno: 252
  md: '# Editing a workbook


    There will be times when you need to edit a workbook. As you saw in the previous
    section, you need to edit a workbook created from scratch to add what you need
    to it. You can also edit workbooks created from templates to modify them to suit
    your needs.


    If you are not already viewing your workbook, you will need to view it first.
    If you are already viewing your workbook, you can skip this next step and move
    directly to the editing portion.


    To edit a workbook, perform the following steps:


    +   1. Go to either the **My workbooks** or the **Templates** tab.

    +   2. Select the workbook in question.

    +   3. Then, select the **View saved workbook** button in the workbook''s detail
    pane.


    > **Note**

    > You cannot edit a workbook template directly. It must be saved first, and then
    the saved workbook can be edited. If you have created a workbook from scratch,
    you must go to the **My workbooks** tab since these workbooks have not been created
    from a template and only show up there.


    At the top of the page is a header containing buttons, shown as follows. The one
    we care about in this section is the first one on the left, called Edit:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_252_0.png)


    Figure 8.13 – Saved workbook header bar'
  merge: -1
  img_proc: true
- pgno: 253
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 254
  md: 'The following table briefly describes each button:


    | Icon | Name | Description |

    |---|---|---|

    | Done Editing | Done Editing | This button will change from edit mode to view
    mode. All the individual edit buttons will disappear. |

    |  | Open | Open another dashboard. See the *Managing workbooks* section for more
    information. |

    |  | Save | Save all the changes made to this workbook. |

    |  | Save as | Save this workbook with another name. |

    |  | Settings | Allows you to change some of the advanced settings for this workbook,
    including resources, styles, tags, and trusted hosts. The discussion of these
    topics is outside the scope of this chapter. |

    |  | Revert changes | Discard any changes made and revert to the last saved version.
    |

    |  | Refresh | Refresh the page. This will recalculate any queries on the page.
    |

    |  | Share | Allows you to share this workbook directly with others. This will
    open a pane with the URL, which you can copy and send to others. Note that a workbook
    must belong to the Shared Workbooks group before you can share it. If the workbook
    is not shared, you will be prompted to move it to Shared Workbooks before you
    can share it. |

    |  | Show pin options | This will open the pin options, where you can pin the
    entire workbook to a dashboard or pin each section that can be pinned to a dashboard.
    |

    |  | Advanced editor | Switches the screen to show the JSON or Azure Resource
    Manager (ARM) code that gets generated automatically. See the *Advanced editing*
    section for more information. |

    |  | Feedback | This allows you to provide feedback to Microsoft about workbooks.
    This works here as it does throughout the rest of the Azure portal. |

    | ? Help | Help | Opens the Microsoft workbook documentation page in another tab.
    |


    Table 8.2


    If you look at the bottom of the workbook you are editing, you will see a list
    of links matching the following screenshot. This is how you will add new steps,
    and each step will be described individually in the *Workbook step types* section:


    Add text | Add query | Add metric | Add parameters | Add links/tabs


    Figure 8.16 – Edit mode add links'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Once you have finished making all your changes, click on the **Done Editing**
    button in the header bar to revert to the view mode. All the individual edit buttons
    will disappear, as will any steps, parameters, or columns that have been set to
    be hidden.


    Look at your workbook to make sure the edits you just made are working as desired.

    Once you are satisfied with your changes, click on the **Save** button to save
    your changes.


    # Advanced editing


    While the workbook''s editing **graphical user interface (GUI)** allows you to
    completely create and edit an Microsoft Sentinel workbook, there may be times
    when you need to tweak a setting directly in the code. You may also wish to get
    the ARM template, which will allow you to easily reproduce this workbook elsewhere
    or store it as part of your DevOps process.


    In either case, clicking on the **Advanced Editor** button will allow you to do
    that. When you click on the button, you will be taken to the **Gallery Template**
    view of the advanced editor, as shown in the following screenshot. This view will
    allow you to directly modify the JSON code. When you are done making the changes,
    click the **Apply** button to apply your changes, or the **Cancel** button to
    return to the GUI without saving your changes:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_255_0.png)


    Figure 8.17 – Advanced Editor – Gallery Template view'
