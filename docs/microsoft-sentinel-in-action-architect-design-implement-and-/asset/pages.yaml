- pgno: 248
  md: 'Under that is the first example of a query section. This uses a KQL query to
    obtain the data, and then displays it in different ways. In this case, the information
    is displayed as tiles; one tile per column is returned.


    Below that is another example of a query section. In this case, the information
    is displayed as a table, but the individual columns have been modified to show
    graphical information, while other columns show as straight text. If you look
    at the second column from the left, it shows a heatmap along with the textual
    value. The third column, called Trend, shows a sparkle line instead of text values.


    Another interesting thing to note about these query sections is that they are
    shown side by side. Normally, when a new query is added to a workbook page, it
    is set to take up the entire width of the page. This can be modified so that the
    individual queries take up as much or as little width as desired. If another query
    can fit beside the first one, it will do so.


    Remember that workbooks are interactive, meaning that they can be defined in such
    a way that if you click on one value, others can change. In this workbook, if
    you select a row from the Sign-ins by Location query shown in the preceding screenshot,
    Location Sign-in details will be filtered to show only those users who belong
    to the selected location.


    The rest of the workbook’s sections are pretty much the same as the ones already
    discussed. This should give you an idea of what you can do with your workbooks
    to display relevant information.


    Go ahead and look at some of the other workbook templates available to see what
    else you can do. Remember: you can just click on the template and look at the
    provided report to get an idea of what the workbook will look like. You will see
    that you can show bar charts, pie charts, area charts, and more.


    Now that you know how to look at an existing workbook to see how they work, let''s
    look at how to create your own workbooks.


    # Creating workbooks


    Now that you have an idea of what you can do with workbooks, it is time to see
    how to create your own. There are two ways of doing this:


    +   - Using a workbook template

    +   - Creating one from scratch'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'Either way, we will get a working workbook; however, you may find it easier
    to create workbooks from templates to begin with, to get a better understanding
    of how workbooks function and what you can do with them. There is no reason why
    you cannot create your own workbook using the queries from a workbook created
    from a template as your starting point.


    To be able to create a new workbook, you will need to have the proper rights.
    Refer to https://docs.microsoft.com/en-us/azure/sentinel/roles#roles-and-allowed-actions
    to see the rights that are required to create and edit workbooks.


    # Creating a workbook using a template


    The following steps show how to create a workbook using a template. This makes
    it easier to create a new workbook, as it gives you a basis to start from:


    +   1. While looking at a template''s details page, click on the Save button.

    +   2. A pop-up window, as shown in the following screenshot, will ask you which
    location to use to save the new workbook. Select the appropriate location. This
    should be the same location as where your Log Analytics workspace resides, to
    avoid egress charges:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_249_0.png)


    Figure 8.10 – Choosing your workbook location


    +   3. Click OK. This will cause a new workbook to be created under My workbooks,
    with the same name as the template.


    You now know how to create a workbook using a template as the baseline. This is
    a very easy method to get a workbook created that you can then modify as needed.
    Next, we will discuss creating a workbook from scratch, without using a template
    as the baseline.'
