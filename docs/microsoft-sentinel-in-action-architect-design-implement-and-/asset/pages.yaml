- pgno: 27
  md: 'The core components of the SOC include log management and SIEM, SOAR, vulnerability
    management, threat intelligence, and incident response. All these components are
    addressed by the deployment of Microsoft Sentinel. Additional solutions will be
    required, and integrated, for other SOC platform capabilities such as intrusion
    prevention/detection, file integrity monitoring, and disaster recovery.


    An SOC deployment using Microsoft Sentinel comprises the following components:


    +   - **Azure Monitor** Log Analytics workspaces are created for data collection
    and analysis. These were originally created to ensure a cloud-scale log management
    solution for both cloud-based and physical data center-based workloads. Once the
    data is collected, a range of solutions can then be applied to analyze the data
    for health, performance, and security considerations. Some solutions were created
    by Microsoft, and others were created by partners.


    +   - **Microsoft Sentinel** was developed to address the need for a cloud-native
    solution as an alternative to existing server-based SIEM solutions that have become
    a mainstay of security and compliance over the last decade. Microsoft Sentinel
    is built upon the existing services of Azure Monitor and Log Analytics. It is
    also integrated with other services such as Logic Apps and Azure Data Explorer.


    The popularity of cloud services provides some key advantages, including reduced
    storage costs, rapid scale compute, automated service maintenance, and continuous
    improvement as Microsoft creates new capabilities based on customer and partner
    feedback.


    One of the immediate benefits of deploying Microsoft Sentinel is rapid enablement
    without the need for costly investment in the supporting infrastructure, such
    as servers, storage, and complex licensing. The Microsoft Sentinel service is
    charged based on data consumption, per gigabyte per month. This allows the initial
    deployment to start small and grow as needed until full-scale deployment and maturity
    can be achieved.


    Ongoing maintenance is also simplified as there are no servers to maintain or
    licenses to renew. You will want to ensure regular optimization of the solution
    by reviewing the data ingestion and retention for relevance and suitability. This
    will keep costs reasonable and improve the quality of data used for threat hunting.


    +   - **Logic Apps** provides integration with a vast array of enterprise solutions,
    ensuring workflows are connected across the multiple cloud platforms and to existing
    on-premises solutions. This is a core part of the integration and automation (SOAR)
    capabilities of the platform.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Logic Apps is a standards-based solution that provides a robust set of capabilities.
    You can also use third-party SOAR solutions if you have already invested in one
    of those platforms.


    The SOC platform components are a starting point, but there may be several other
    services you will want to deploy in your SOC implementation. In the next section,
    we will look at an approach to mapping the SOC architecture''s current state and
    requirements.


    # Mapping the SOC architecture


    To implement a cohesive technical solution for your SOC platform, you will need
    to ensure that the following components are reviewed and thoroughly implemented.
    This is best done on a routine basis and incorporates regularly testing for the
    strength of each capability using penetration testing experts that will provide
    feedback and guidance to help improve any weaknesses.


    # Log management and data sources


    The first component of an SOC platform is the gathering and storing of log data
    from a diverse range of systems and services across your IT environment. This
    is where you need careful planning to ensure that you are collecting and retaining
    the most appropriate data. Some key considerations we can borrow from other well-documented
    big data guidance are listed here:


    +   - **Variety**: You need to ensure you have data feeds from multiple sources
    to gain visibility across the spectrum of hardware and software solutions across
    your organization.

    +   - **Volume**: Too large a volume and you could face some hefty ingestion and
    storage fees; too small and you could miss some important events that may lead
    to preventing you from fully analyzing a breach.

    +   - **Velocity**: Collecting real-time data is critical to reducing response
    times, but it is also important that the data is processed and analyzed in real
    time too.

    +   - **Value/veracity**: The quality of data is important to understand the meaning;
    too much noise will hamper investigations.

    +   - **Validity**: The accuracy and integrity must be verified to ensure that
    the right decisions can be made.

    +   - **Volatility**: How long is the data useful for? Not all data needs to be
    retained long term; once analyzed, some data can be dropped quickly.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   - **Vulnerability**: Some data is more sensitive than other data, and when
    collected and correlated together in one place, can become an extremely valuable
    data source to a would-be attacker.

    +   - **Visualization**: Human interpretation of data requires some level of visualization.
    Understanding how you will show this information to the relevant audience is a
    key requirement for reporting.


    Microsoft Sentinel provides a range of data connectors to ensure that all types
    of data can be ingested and analyzed. Securing Azure Monitor will be covered in
    *Chapter 2, Azure Monitor – Introduction to Log Analytics*, and connector details
    will be available in *Chapter 3, Managing and Collecting Data.*


    # Operations platforms


    Traditionally, a SIEM was used to look at all log data and reason over it, looking
    for any potential threats across a diverse range of technologies. Today, there
    are multiple platforms available that carry out self-monitoring and alerting functionality,
    like the way a SIEM would work, except they are designed with a specific focus
    on a particular area of expertise. Each platform may carry out its own log collection
    and analysis, provide specific threat intelligence and vulnerability scanning,
    and make use of machine learning algorithms to detect changes in user and system
    behavior patterns. If they are advanced systems, they will also provide a level
    of automated response in reaction to the threats detected.


    The following solutions each have a range of capabilities built in to collect
    and analyze logs, carry out immediate remediations, and report their findings
    to the SIEM solution for further investigation and cross-analysis:


    +   - **Identity and Access Management (IAM)**: The IAM solution may be made up
    of multiple solutions, combined to ensure the full life cycle management of identities
    from creation to destruction. The IAM system should include governance actions,
    such as approvals, attestation, and the automated cleanup of group membership
    and permissions management. IAM also covers the capability of implementing multi-factor
    authentication: a method of challenging the sign-in process to provide more than
    a simple combination of user ID and password. All actions carried out by administrators
    and user-driven activities should be recorded and reported to the SIEM for context
    and end user behavior analytics.'
  merge: -1
  img_proc: true
- pgno: 30
  md: <!-- no content -->
  merge: -1
