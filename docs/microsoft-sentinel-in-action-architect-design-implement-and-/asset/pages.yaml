    Again, this screenshot is only showing a partial list of the results.


    # The extend command


    There may be times when you need information that the table does not provide but
    can be generated from the data that has been provided. For example, the StormEvents
    table provides a start time and an end time for the event but does not provide
    the actual duration of the event. We know we can get the duration by subtracting
    the start time from the end time, but how can we tell KQL to do this?


    The extend command does this. It allows you to create new columns from existing
    columns, or other data, such as hardcoded values. The following command will create
    a new column called Duration that will then be populated by the difference between
    the EndTime and the StartTime in each row of the StormEvents table:


    ```

    StormEvents

    | extend Duration = EndTime - StartTime

    ```'
