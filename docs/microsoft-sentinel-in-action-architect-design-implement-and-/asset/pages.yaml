    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_176_0.png)


    Next, let''s move on to the **Queries** pane.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# The Queries pane


    Selecting the Queries pane will show the same information as if you clicked on
    the Queries entry in the page header. The only difference is that you only see
    the title in a tree-view format. If you click on the title, the query will be
    placed into the KQL Query window as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_177_0.png)


    Figure 6.16 – Query pane


    This shows the same query as was selected in Figure 6.5 earlier. It is worth noting
    that to see the description, you must hover over the query name, much like mousing
    over a table name that was discussed in the previous section.


    We saw how to look at the queries that have been saved. Now, let''s look at any
    of the functions that are available.


    # The Functions pane


    Functions are code that you have saved so that you can reuse them easily. Selecting
    the Functions pane will show you all the functions that have been created, grouped
    by their tags. Much like tables, you can change the grouping selection. However,
    with functions, there is an additional one called Legacy category that you can
    enter when creating your own functions, which is discussed later.


    In the following screenshot, the _GetWatchlist function was double-clicked, to
    add the query to the KQL Query pane, and then hovered over, to show the description
    pop-up window.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'If you notice in the pop-up window, in addition to the name and description
    of the function, any of the parameters that the function needs will be displayed.
    You can also see that the KQL Query window''s help option, shows the needed variable.
    It also shows another function that has a similar name to make sure you did click
    on the correct one.


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_178_0.png)


    Figure 6.17 – Functions page


    The last pane we need to look at is the Filter pane, and we discuss that next.


    # The Filter pane


    You may have noticed that the Filter pane does not show up in Figure 6.2. This
    is because there are more tabs than can be shown in the space allocated to the
    panes. If you do not see the Filter pane, select the context menu (the three dots
    on the right side of the pane) and the panes that are not shown will be listed
    there. You can select the Filter pane from that list.'
  merge: -1
  img_proc: true
