- pgno: 258
  md: 'Below that is a listing of all the workbooks. Clicking on any of the workbooks
    will change the workbook that you are viewing.


    Each workbook will be shown in a separate row. It will display the name, and then
    an icon that will show whether the workbook has been created from a template,
    and then a context-sensitive menu. Clicking on the context-sensitive menu icon
    will show the menu as shown in Figure 8.20.


    This menu will allow you to delete this workbook, rename it, move it to **Shared
    reports** (or if this workbook is already shared, it will allow you to move it
    to **My reports**), share it with others (or if it is not a **shared report**,
    you will be asked to make it a **shared report** before you can share it), and
    pin it to a dashboard, which provides a shortcut to get directly to this workbook.
    All of this can be seen in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_258_0.png)


    Figure 8.20 – Managing the workbook context menu'
