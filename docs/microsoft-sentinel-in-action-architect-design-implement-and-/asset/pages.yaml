- pgno: 422
  md: '# Installing the Microsoft Sentinel integration plugin in ServiceNow


    This plugin is available on the ServiceNow store. Be sure that you read the release
    notes to confirm you meet all the requirements, such as the ServiceNow instance
    version.


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_422_0.png)


    Figure 13.8 – ServiceNow Sentinel plugin


    It is recommended to work with the latest version of the plugin when developing,
    as well as to always use the same version in production as the version that was
    used during development.


    # Configuring the ServiceNow Sentinel plugin to authenticate to Microsoft Sentinel


    This step is where you will input the variables you collected in the Configuring
    the Microsoft Azure portal section. Remember to not provide a third-party service
    provider with your client secret. Instead, use a screen sharing and desktop control
    solution to input it yourself when they get to this step.


    A gotcha of this step is that there is a slight delay after clicking submit and
    it will not tell you it was successful. It will, however, tell you if there is
    an error. If the window closes without error, then you have successfully authenticated
    your ServiceNow instance to your Microsoft Sentinel instance. If there is an error,
    it is typically caused by either missing a step in the Configuring the Microsoft
    Azure portal section or a typo in the data of the form (watch out for leading
    or trailing spaces if you''re copying/pasting). Be patient – it takes 20 seconds
    or so to decide if it worked:'
