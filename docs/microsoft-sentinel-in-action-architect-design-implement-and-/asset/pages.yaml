- pgno: 69
  md: '4. Once the workspace has been created, you will be taken to the Overview page
    of Microsoft Sentinel. This page will show a summary of the events, alerts, and
    incidents. Refer to the following screenshot for more information:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_69_0.png)


    Figure 2.13 – Microsoft Sentinel Overview page


    Congratulations! You now have your Microsoft Sentinel environment created and
    are ready to go. The News & guides page is where you will go automatically after
    attaching a Log Analytics workspace to Microsoft Sentinel. If you leave Microsoft
    Sentinel and go back to it, you will automatically go to the Microsoft Sentinel
    Overview page, which is described next.'
