- pgno: 161
  md: '# 6

    Microsoft Sentinel Logs and Writing Queries


    In the previous chapter, we looked at the Kusto Query Language (KQL) and gave
    a brief introduction to how to use it. In this chapter, we will learn about the
    Microsoft Sentinel Logs page. The Microsoft Sentinel Logs page is where you can
    see the various logs in your workspace, determine the type of data that makes
    up the logs, create the queries that will be used in the Analytics rules and threat
    hunting, as well as save these queries for later use. This will help you in creating
    rules and is an integral part of investigating incidents.


    As part of this chapter, we will provide an overview of the Microsoft Sentinel
    Logs page, learn about the various sections, and look at how to use KQL to write
    queries. We will review the Logs screen in Microsoft Sentinel and show how to
    look at columns that make up the table, using both the UI and KQL. We will also
    look at the steps you can take to help develop your queries.


    In a nutshell, the following topics will be covered:


    +   - An introduction to the Microsoft Sentinel Logs page

    +   - Navigating through the Logs page

    +   - Writing a query'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# An introduction to the Microsoft Sentinel Logs page


    The **Log Analytics** workspace follows a hierarchical pattern regarding how it
    organizes its information. At the top is the Log Analytics workspace. This is
    the container for all the individual tables for your instance of Microsoft Sentinel.
    This is equivalent to a database in **SQL**.


    Within each workspace are individual tables. These are equivalent to a table in
    SQL and are the entities that hold data. They have a set of columns and zero or
    more rows of data.


    Within each of those tables are the columns that hold the data. The columns can
    hold different data types including text, date/time, integers, and others.


    > **Note**

    > A lot of the documentation you will read will use the terms *table* and *log*
    interchangeably. We are choosing to use the term *table*, as that is the term
    **Microsoft** uses inside the Logs page and most documentation, even though the
    page itself is called **Logs**.


    # Navigating through the Logs page


    The **Logs** page is where you can see a listing of all the tables that belong
    to your workspace, view some existing queries, write your own queries, view the
    results, and much more. Let''s explore this page.


    To get to the **Logs** page, select **Logs** from the Microsoft Sentinel navigation
    section. This will open the following page:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_162_0.png)


    Figure 6.1 – Microsoft Sentinel Logs page'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'The page is broken down into different sections, such as the following:


    +   - The page header

    +   - The Tables/Queries/Functions/More Tools panes

    +   - The KQL code window

    +   - The sample queries/results window


    These sections can be seen in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_163_0.png)


    Figure 6.2 – Microsoft Sentinel Logs page sections


    Let’s describe each of these sections in more detail.


    # The page header


    The page header is located at the top of the page and contains useful links, such
    as feedback, sample queries, query explorer, settings, and help, as shown in the
    following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_163_1.png)


    Figure 6.3 – Logs page header


    You will not need to use these links to create new queries, although they can
    assist with some predefined code, as you will read about. We will look at each
    individual button, starting from the left side.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Feedback


    This feature allows you to send feedback to Microsoft regarding the Logs page.
    If this is clicked, you can select what you were doing, whether you liked it or
    not, provide a description, and select whether it is OK for Microsoft to contact
    you.


    This is a great way to provide feedback as to how well you feel a feature is working,
    or to request new features.


    # Queries


    Microsoft Sentinel has a few sample queries that have been provided to help you
    get started looking at tables. Follow these steps to use them:


    +   1. Click on the Queries button. This will open a new window and show some
    sample queries as follows:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_164_0.png)


    Figure 6.4 – Logs page sample queries


    # Note


    You may have seen this page when you first went into the Logs page. If you notice
    at the top of the screen, there is a slider called Always show Queries. If this
    is enabled, this page will show up each time you go into the Logs page. By disabling
    this, the page will not show up automatically.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Also, the **Applications** tab will be shown by default. The queries are all
    related to showing information on the various applications that are logging data
    in your Log Analytics workspace.


    If you hover over one of the queries, it will look like the **Response time trend**
    query shown in *Figure 6.4*. You can run the query, load the query’s KQL code
    in the editor without running it, get more information on the query (that is the
    icon that looks like a letter i inside a circle), or mark it as a favorite, which
    is the icon that looks like a star, in which case this query will show up when
    you click on the **Favorites** link in the menu.


    You can either scroll through the entire listing of queries or you can select
    one of the entries in the navigation menu, that is, **Applications**, **Audit**,
    **Azure Monitor**, and so on, to jump to that section.


    2. Click the **Run** button on any of the entries to load the query and run it.
    In the following screenshot, the **Last heartbeat of each computer** query under
    the **Azure Monitor** section was run. Your results will vary depending on how
    many computers are reporting. If you do not see any results, it may be that you
    do not have the proper data connector set up – in this case, you need to have
    at least one computer associated with this Log Analytics workspace. For a refresher,
    see *Chapter 3, Managing and Collecting Data*, on setting up data connectors,
    and *Chapter 2, Azure Monitor – Introduction to Log Analytics*, on attaching computers
    to the Log Analytics workspaces.


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_165_0.png)


    Figure 6.5 – Sample query results'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Look at the other query sections to see what other queries are available to
    use.


    > **Note**

    > You can also access these same queries by going to the **Queries** tab that
    was called out in *Figure 6.2*.


    Let''s move on to the next button on the page header, which is the **Query explorer**.


    # Query explorer


    The **Query explorer** button is like the **Queries** button, except that you
    can add your own queries to this list, which will be discussed later. If you have
    marked any queries as favorites or saved any queries yourself, these will show
    in this window:


    +   1. Click on the **Query explorer** button. This will open the **Query explorer**
    blade as follows:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_166_0.png)'
  merge: -1
  img_proc: true
- pgno: 167
  md: '2. Expand the **Solution Queries** tree; you will see that there are other
    groupings under it. Let''s try this out. Expand the **Log Management** entry to
    see a list of queries that are related to log management, as shown in the following
    screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_167_0.png)


    Figure 6.7 – Query explorer sample queries'
  merge: -1
  img_proc: true
- pgno: 168
  md: '3. As you can see in the preceding screenshot, the **All Syslogs** query has
    been selected. If the star on the right side of the name is selected, then that
    query will be saved as a favorite. The entry will be listed under the **Favorites**
