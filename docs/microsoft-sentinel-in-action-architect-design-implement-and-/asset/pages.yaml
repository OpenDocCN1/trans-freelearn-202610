- pgno: 31
  md: "A CASB will come with many connectors for deep integration into cloud services,\
    \ as well as connection to the IAM system to help govern access to other cloud\
    \ services (via Single Sign-On (SSO)), acting as a reverse proxy and enforcing\
    \ session-based controls. The CASB will also provide many detection rule templates\
    \ to deploy immediately, as well as offering the ability to define custom rules\
    \ for an almost infinite set of use cases unique to your organization. The response\
    \ capabilities of the CASB are dependent on your specific integrations with the\
    \ relevant cloud services; these can include the ability to restrict or revoke\
    \ access to cloud services, prevent the upload or download of documents, or hide\
    \ specific documents from the view of others.\n\n+   - **Cloud Workload Protection\
    \ Platform (CWPP)**: The CWPP may also be known as a **Cloud Security Posture\
    \ Management (CSPM)** solution. Either of these will provide the unique capability\
    \ of scanning and continuously monitoring systems to ensure that they meet compliance\
    \ and governance requirements. This solution provides a centralized method for\
    \ vulnerability scanning and for carrying out continuous audits across multiple\
    \ cloud services (such as **Amazon Web Services (AWS)** and **Microsoft Azure**),\
    \ while also centralizing policies and remediation actions. Resources within these\
    \ services can be protected by implementing policies and technologies including\
    \ **Just In Time (JIT)** access and **Attack Surface Reduction (ASR)**.\n+   \n\
    +   When these solutions are deployed, it is one less capability that we need\
    \ the SIEM to provide; instead, it can take a feed from the service to understand\
    \ the potential risk and provide an integration point for remediation actions.\n\
    +   - **Next-Generation Firewall (NGFW)**: Firewalls have been the backbone of\
    \ network security since the 1980s and remain a core component of the segmentation\
    \ and isolation of internal networks, as well as acting as the front door for\
    \ many internet-facing services. With NGFW, not only do you get all the benefits\
    \ of previous firewall technologies, but now you can carry out deep packet inspection\
    \ for the application layer security and integrated intrusion detection/prevention\
    \ systems. The deployment of NGFW solutions will also assist with the detection\
    \ and remediation of malware and advanced threats on the network, preventing the\
    \ spread to more hosts and network-based systems."
  merge: -1
  img_proc: true
- pgno: 32
  md: 'As you can see from these examples, the need to deploy a SIEM to do all the
    work of centrally collecting and analyzing logs is in the past. With each of these
    advanced solutions deployed to manage their specific area of expertise, the focus
    of SIEM changes to look for common patterns across the solutions as well as monitoring
    those systems that are not covered by these individual solutions. With Microsoft
    Sentinel as the SIEM, it will also act as the SOAR, enabling a coordinated response
    to threats across each of these individual solutions, preventing the need to re-engineer
    them all each time there is a change in requirements for alerting, reporting,
    and responding.


    # Threat intelligence and threat hunting


    Threat intelligence adds additional context to the log data collected. Knowing
    what to look for in the logs and how to identify serious events requires a combination
    of threat hunting skills and the ongoing intelligence feed from a range of experts
    that are deep in the field of cybercrime research. Much of this work is augmented
    by Artificial Intelligence (AI) platforms; however, a human touch is always required
    to add that gut-feeling element that many detectives and police officers will
    tell you they get from working their own investigations in law enforcement.


    # SOC mapping summary


    The following diagram provides a summary of the multiple components that come
    together to help to make up the SOC architecture, with some additional thoughts
    when implementing each one:


