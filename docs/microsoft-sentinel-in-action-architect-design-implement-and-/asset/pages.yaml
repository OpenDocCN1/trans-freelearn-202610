- pgno: 76
  md: '# Advanced settings for Log Analytics


    The advanced settings for Log Analytics allow you to perform actions such as connecting
    on-premises and other non-Azure Windows and Linux servers, Azure Storage, and
    System Center Management groups. You can also set what information to import from
    Windows and Linux servers, import IIS logs and Syslog events, and add custom logs
    and fields. Finally, you can create groups of computers, or use groups already
    created in Active Directory, Windows Server Update Service (WSUS), and SCCM, which
    can be used in your queries.


    To get to the Advanced settings page, follow the instructions to get to the Log
    Analytics overview page in the previous section, but instead of selecting Azure
    virtual machines (VMs), select Agents management. This will open a new page, as
    shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_76_0.png)


    Figure 2.19 – Microsoft Sentinel Agents management'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'As you can see, there are two tabs for connecting to Windows and Linux servers
    respectively to ingest data. Each one will be discussed in the next section.


    # Agents management


    This area allows you to attach non-Azure Windows and Linux servers:


    +   - **Windows servers:** You can attach a non-Azure Windows-based VM to the
    workspace to collect Windows event logs and performance counters. Click on either
    **Download Windows Agent (64bit)** or **Download Windows Agent (32bit)** to match
    the Windows version you are using and run the program on the server. Copy the
    **Workspace ID** and either the **Primary key** or **Secondary key** details and
    fill them in when asked.

    +   - **Linux servers:** This works the same as for Windows servers – click on
    the **Download Linux Agent** link and read the documentation for installation
    instructions.


    > **Note**

    > While this can be used to connect Azure VMs, it is far easier to use the steps
    in the previous section to do so.


    Next, we will look at the **Agents configuration** page, which provides options
    for ingesting data from the agents.'
  merge: -1
  img_proc: true
- pgno: 78
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 79
  md: '+   - **Windows performance counters:** This will show a listing of all the
    performance counters that will be included by default and their polling intervals.
    From here, you can change the interval or remove the counter completely. You can
    also add other counters to monitor.

    +   - **Linux performance counters:** This will show a listing of all the Linux
    performance counters that will be included by default and the polling interval
    for those counters that use a polling interval. From here, you can change the
    interview or remove the counter completely. You can also add other counters to
    monitor.

    +   - **Syslog:** This section enables the collection of data from Syslog servers.
    Select the severity for each facility to ensure messages are collected, and all
    others will be excluded. For more details review this page: https://docs.microsoft.com/en-us/azure/azure-monitor/agents/data-sources-syslog.

    +   - **IIS Logs:** This determines whether W3C-format IIS log files will be ingested
    from Windows web servers. An example of this is the web logs from a Linux-based
    web server.


    As you can see, there are a lot of ways in which you can configure the data to
    import. There will always be a trade-off between what data you need or want and
    the cost of ingesting and storing the data. In the next section, we will look
    at **Computer Groups**, which can help you with your queries.


    # Computer Groups


    This section will show all the custom computer groups that have been created and
    provide a way to create your own. These groups can then be used in queries. You
    can use these groups to create queries that reference a specific set of servers
    that can then easily be changed without having to change the query itself.'
  merge: -1
  img_proc: true
- pgno: 80
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 81
  md: 'There are various ways to create computer groups to help you with your queries.
    Each of these will be discussed in more detail in the following sections.


    # Adding a computer group from a query


    Adding a computer group using a query involves running a query that will return
    a list of computers and then save that information as a computer group:


    +   1. In the **Saved Groups** section under **Computer Groups**, click on the
    **Go to Logs** link to go to the **Logs** page. Enter any query that will generate
    a listing of computers. Here''s an example:


    ```

    Heartbeat

    | where TimeGenerated > ago(30m)

    | distinct Computer

    ```


    Don''t worry about what the query means, it will be explained in *Chapter 5, Using
    the Kusto Query Language*. For now, this will return a listing of all those computers
    that have sent a heartbeat to the workspace in the last 30 minutes. Note that
    you will need to have a server connected to Azure (see the *Obtaining information
    from Azure virtual machines and Connected sources* sections) to get any information
    from this query.


    +   2. Click on the **Run** button to get a list of computers. If no computers
    are returned, change 30 to a larger value until some are returned.


    +   3. Once you have a list, click on the **Save** button to save this query:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_81_0.png)


    Figure 2.22 – Computer heartbeat query


    +   4. Choose the **Save as function** option, then provide a name for the function.


    +   5. Make sure to check the **Save this query as a computer group** option,
    otherwise it will just save as a query that can be the same as the Name.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   6. Finally, add a **Legacy category**, which is just used to group the
    computer groups together.


    +   7. Click the **Save** button, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_82_0.png)


    Figure 2.23 – Save query options


    When you go back to the **Saved Groups** page, you will see your saved group,
    which will look like what is shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_82_1.png)


    Figure 2.24 – Saved Groups'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'To use a saved group, enter a query like this:


    ```

    Perf

    | where Computer in (ListComputerGroups)

    ```


    Substitute ListComputerGroups for the name of the query you just created. Again,
    do not worry about what this query means; it is just an example of how to use
    a saved group. It will make more sense after reading Chapter 5, Using the Kusto
    Query Language.


    # Summary


    In this chapter, we explored the Azure Monitor Log Analytics solution, including
    how to create a new workspace using the Azure portal, PowerShell, or CLI, and
    how to configure the security options to ensure each user has the appropriate
    level of access. We also looked at how to connect a data source and configure
    some of the advanced settings. This information is very useful when you need to
    first configure Microsoft Sentinel, and for the future should you need to make
    any changes to the Log Analytics platform supporting your operational and business
    needs.


    In the next chapter, we will look at how to select data that is most useful for
    security threat hunting, which connectors to use to gather the data from any system,
    and the options available to enable long-term data retention while keeping costs
    under control.


    # Questions


    Answer these questions to test your knowledge of this chapter:


    +   1. What is the name of the query language used in Azure Monitor Log Analytics?

    +   2. What is the purpose of Azure Lighthouse?

    +   3. Can you list three ways in which data is protected in Log Analytics?

    +   4. What are the three ways to create a new Log Analytics workspace?

    +   5. What are the recommended permissions for an engineer role?'
  merge: -1
