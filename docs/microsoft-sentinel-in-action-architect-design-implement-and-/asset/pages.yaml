- pgno: 377
  md: '# 12


    # Creating Playbooks

    and Automation


    In the previous chapters, you learned about the **Security Information and Event
    Management (SIEM)** side of Microsoft Sentinel. Now, it is time to learn about
    its **Security Orchestration, Automation, and Response (SOAR)** capabilities.


    Microsoft Sentinel''s SOAR features allow automated or semi-automated responses
    to be created regarding alerts and incidents. This allows you to develop workflows
    that can perform tasks such as blocking an IP address from getting through a firewall,
    blocking a suspicious username, or something simple such as sending an email to
    the security team, letting them know a new high-severity alert was generated.
    When you combine the automation capabilities offered by Microsoft Sentinel with
    the protection capabilities of the many other security products you deploy, the
    sky''s the limit!


    In this chapter, you will learn about Microsoft Sentinel playbooks, including
    how to write and edit them, configuring their workflow, and managing them. You
    will also learn about Microsoft Sentinel''s Automation feature, which allows you
    to perform certain actions without the use of playbooks.


    At the end of this chapter, we will walk through the process of creating a simple
    playbook. By the end of the chapter, you should feel comfortable writing playbooks.'
  merge: -1
  img_proc: true
- pgno: 378
  md: 'We will cover the following topics in this chapter:


    +   - Introduction to Microsoft Sentinel playbooks

    +   - Introduction to Microsoft Sentinel Automation

    +   - Adding a new Automation rule

    +   - Playbook pricing

    +   - Types of playbooks

    +   - Overview of the Microsoft Sentinel connector

    +   - Exploring the Playbooks tab

    +   - Logic Apps settings page

    +   - Creating a new playbook

    +   - Using the Logic Apps Designer page

    +   - Creating a simple Microsoft Sentinel playbook


    # Introduction to Microsoft Sentinel playbooks


    Microsoft Sentinel uses Azure Logic Apps for its workflow automation. An Microsoft
    Sentinel playbook is a logic app that uses the Microsoft Sentinel connector to
    trigger the workflow. As we go through this chapter, many of the screenshots we
    will be looking at will be logic app pages, which reinforces this concept. The
    full extent of how to use Logic Apps is beyond the scope of this book, so we will
    just cover the Microsoft Sentinel connector, which contains logic app triggers
    and actions for Microsoft Sentinel.


    > Note

    > For this chapter, the terms playbook and logic app will be used interchangeably.

    > For more information on Azure Logic Apps, go to https://azure.microsoft.com/en-us/services/logic-apps/.


    Logic apps use connectors (not to be confused with Microsoft Sentinel data connectors)
    and actions to perform a workflow''s activities. A logic app connector provides
    access to events and data. Actions will perform a specific task, such as sending
    an email, posting a message on Microsoft Teams, extracting JavaScript Object Notation
    (JSON) objects, and so much more.'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'By using Azure Logic Apps as the backend technology, Microsoft Sentinel playbooks
    already have a rich ecosystem of connectors and actions that they can call upon
    to perform their activities. Let''s look at one of the ways to use them.


    # Introduction to Microsoft Sentinel Automation


    When Microsoft Sentinel was first released, each playbook had to be assigned to
    each analytic rule individually and all actions required the use of a playbook.
    Microsoft Sentinel Automation was introduced to make using playbooks much easier,
    while, at the same time, allowing a user to perform actions, including changing
    an incident''s severity, without needing to write a playbook.


    > Note

    > When this chapter was being written, the Automation features were in preview,
    so some features may have changed.


    Let''s start by looking at the Automation page. To access this page, select the
    Automation navigation menu entry from the Microsoft Sentinel navigation pane.
    The Automation screen will be displayed, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_379_0.png)


    Figure 12.1 – Microsoft Sentinel Automation home screen


    We shall look at each part of this page in the following sections.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# The header bar


    The header bar, as shown in the following screenshot, contains various buttons:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_380_0.png)


    Figure 12.2 – The Microsoft Sentinel Automation page header bar


    Let''s discuss each field in detail:


    +   - The **+Create** button allows you to add a new automation rule (called **Add
    new rule**) or a new playbook (which is described in the *Adding a new playbook*
    section).

    +   - The **Refresh** button will refresh the display.

    +   - The **Edit** button will allow you to edit an existing automation rule.
    Note that a single automation rule must be selected before this can be enabled.

    +   - The **Enable** and **Disable** buttons are only available if one or more
    rules are selected and will either enable a disabled rule or disable an enabled
    rule.

    +   - The **Move up** and **Move Down** buttons are only available if one or more
    rules are selected and will either move the automation rule higher or lower in
    the run order. Refer to the *Adding a new automation rule* section of this chapter
    for more details.

    +   - The **Remove** button will delete the selected automation rule(s).

    +   - The **Guides & Feedback** button will open a new pane and provide you with
    more information regarding Microsoft Sentinel Automation, as well as allow you
    to provide feedback to Microsoft.


    The header bar can be used to create new automation rules and playbooks, as well
    as change the order, status, and give you more documentation on how to work with
    automation rules.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# The summary bar


    Under the header is the status bar, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_381_0.png)


    Figure 12.3 – The Microsoft Sentinel Automation page summary bar


    All the information presented here shows how many automation rules and playbooks
    are available:


    +   - On the left-hand side is the Automation rules number. This shows the total
    number of automation rules there are, and whether they are enabled or not.

    +   - To the right of that is Enabled rules, which is the total number the automation
    rules that are enabled.

    +   - After that is Enabled playbooks, which shows how many playbooks are available
    that can be used in the automation rules.


    Let’s look at the automation rules listing.


    # Automation rules listing


    Under the summary bar is a list of all the automation rules, as shown in the following
    screenshot. Notice that there is a tab for Automation rules (Preview) and one
    for Playbooks. The Playbooks section will be covered in the Exploring the Playbooks
    tab section, later in this chapter:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_381_1.png)


    Figure 12.4 – Automation rules list'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'For each automation rule listed, there is a selection checkbox, followed by
    the following fields:


    | Field Name | Description |

    |---|---|

    | Order | This is the order in which the automation rule will be run. If there
    is more than one automation rule associated with a given analytic rule, then the
    rule with the lowest number will be run first. |

    | Display Name | The name of the rule. Click on the rule to edit it. |

    | Analytic rule names | This will show All if this rule is to be applied to every
    analytic rule or a listing of those individual analytic rules that this rule will
    be applied to. |

    | Actions | Shows the action(s) that this rule will run when activated. |

    | Expiration Date | Shows the date when this rule will expire. If it shows **Indefinite**,
    then the rule will not expire. |

    | Created by | The name of the person that created the rule. |

    | Rule creation time | The date and time that the rule was created. |

    | Last modified by | The name of the person who last modified this rule. |

    | Rule last modified | The date and time the rule was last modified (not shown
    in the preceding screenshot). |

    | Status | Shows the rule''s status, either **Enabled** or **Disabled** (not shown
    in the preceding screenshot). |


    Table 12.1


    Now, we will learn how these rules can be created.


    # Adding a new automation rule


    As we mentioned previously, to create a new automation rule, click on the +Create
    button in the header and select **Add new rule**.'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'This will open the **Create new automation rule** pane, as shown in the following
    screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_383_0.png)


    Figure 12.5 – Create new automation rule


    Enter the rule''s name in the **Automation rule name** text box. You will want
    to make this rule''s name descriptive enough so that someone will understand what
    it will do by reading the title. For example, `Get IP Address information` tells
