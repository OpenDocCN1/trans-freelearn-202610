- pgno: 454
  md: '# Azure Logic Apps


    Azure Logic Apps can be used for a wide variety of automation tasks, including
    the following:


    +   - **Schedule-based workflow**: Creating a task to automatically carry out
    actions on a frequent basis, such as gathering data, then comparing that value
    to the last time it was gathered and raising an alert if the value exceeds a threshold.

    +   - **Approval-based workflow**: Creating a task to monitor for a given trigger,
    then sending an approval request (such as an email) and continuing the requested
    action once the approval is received.

    +   - **Azure Functions**: This can be integrated with Azure Logic Apps to carry
    out additional tasks and integrations, such as the following:

    +     A. Running code based on HTTP requests

    +     B. Scheduling code to run at predefined times

    +     C. Processing new and modified Azure Cosmos DB documents

    +     D. Processing new and modified Azure Storage blobs

    +     E. Responding to Azure Storage queue messages

    +     F. Responding to Azure Event Grid events via subscriptions and filters

    +     G. Responding to high volumes of Azure Event Hubs events

    +     H. Connecting to other Azure, on-premises, or other cloud services by responding
    to a Service Bus queue or topic messages

    +   - **Storage workflow**: Enables integration with Azure Storage to enable the
    automated collection and retrieval of data.


    To enable this automation, Azure Logic Apps can use connectors to provide quick
    access to events, data, and actions across other apps, services, systems, protocols,
    and platforms. This integration works for on-premises workloads, Azure, and other
    cloud platforms. Learn more about connectors at the following link: https://docs.microsoft.com/en-us/connectors/.


    We recommend studying these capabilities further, to ensure you can automatically
    trigger actions when alerts and incidents are raised in Microsoft Sentinel, at
    https://docs.microsoft.com/en-us/azure/logic-apps/logic-apps-overview.'
  merge: -1
  img_proc: true
