    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_180_0.png)


    Figure 6.19 – Filter pop-up window


    # Tip


    Be cautious when selecting new columns to show in the Filter pane. There is usually
    a good reason they were not chosen initially, including having too many entries,
    or just one entry.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'To use a filter, select the checkbox next to the name. You can select any number
    of entries under any number of columns to perform a filter. Each entry you select
    will be treated as an and in the query, so that if you select an entry called
    Alpha and one called Beta, the row must have both Alpha and Beta in it for it
    to be shown in the result set.


    When you have selected all the needed filters, click on the Apply & Run button
    to apply the new filters. You can also click the Clear button to remove all the
    selected filters.


    In the following screenshot, the EventLog of Application and the Source of Microsoft-Windows-Security-SPP
    were selected and the Apply & Run button was clicked. It shows the new query and
    the updated results. Note that the Filter values have changed due to the new results:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_181_0.png)


    Figure 6.20 – Updated result-filtering pane


    Next, let’s explore the KQL code window.'
  merge: -1
  img_proc: true
- pgno: 182
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/387db4214c5424f3a9b9dfa5ccc56a9d_183_0.png)


    Figure 6.22 – Query IntelliSense


    Just like the page header, the KQL code window also has its own header. Let''s
    explore it.


    # The KQL code window header


    The KQL code window has its own header comprised of buttons that allow you to
    perform actions against your queries, including running, saving, copying, and
    exporting them, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_183_1.png)


    Figure 6.23 – The KQL code window header


    Each of the buttons will be discussed, working from the left to the right.


    # Run


    Click on the Run button to execute whatever KQL code is in the window. Make sure
    that the query is selected before clicking this button to make sure your query
    is run.


    It is worth noting that you can select just part of your query, and then if you
    click the Run button only the selected lines will run. In the same way, you can
    have multiple queries in the same window with at least one blank line separating
    them, and only the one that is selected will be run. This can save time if you
    find yourself needing to run different queries many times.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Time range


    This will determine how far back your query will look, unless there is a statement
    in your KQL code that specifically states how far back to look. This works the
    same as all the other Time range buttons and will not be discussed here in more
    detail.


    # Save


    This will allow you to save your query for future use. Clicking on this button
    will open the Save pane as follows:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_184_0.png)


    Figure 6.24 – The Save pane


    Fill in the necessary fields as follows:


    +   - **Name**: Provide a useful name for this query so that it can easily be
    determined what this query does.

    +   - **Save as**: Select either **Query** or **Function**. If **Function** is
    selected, you will be asked to provide a **Function Name**, which is a short identifier
    so the function can easily be referenced in a query; a Legacy category that can
    be used for grouping; as well as a checkbox, asking whether this should be saved
    as a computer group. Refer to *Chapter 2, Azure Monitor – Introduction to Log
    Analytics*, for a refresher on computer groups. You can also enter whatever parameters
    the function will require.

    +   - **Category**: Enter the name of the category that will be used to group
    queries together. You can use the lookup icon to find ones that have already been
    used.


    Click the **Save** button to save your query or function.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Share link


    This will allow you to copy either the link, the query, or the results to the
    clipboard.

    The options under this are as follows:


    +   - **Copy link to query**: This will copy the URL for this specific query to
    the clipboard. This can be useful if you want to share a query with others.

    +   - **Copy query text**: This will copy the query text to the clipboard. This
    is useful if you need to save your KQL query somewhere else.

    +   - **Copy result**: This will copy the URL for the results (which is basically
    the same as the URL for the query) to the clipboard.

    +   - **Share to community**: This will open an email that gets sent to the Microsoft
    Sentinel community email address and will include your query for submission to
    the Azure Monitor GitHub repository.


    Let''s look at the **New alert rule** button.


    # New alert rule


    This has an entry under it called **Create Microsoft Sentinel alert** and once
    clicked, it will take you to the new **Analytics rule** page, where you can create
    a new scheduled rule that has the query already filled in. Refer to *Chapter 7,
    Creating Analytic Rules*, for more information.


    # Export


    This will provide you with three options:


    +   - **Export to CSV – All Columns**: This will export all the columns, visible
    and hidden, into a CSV file. When this is clicked, a file called `query_data.csv`
    will be created and downloaded with the actual step determined by your browser
    settings.

    +   - **Export to CSV – Displayed Columns**: This will work as in the first bullet
    point, except that only those columns that are shown in the results window will
    be saved. Refer to the *The results window* section to see how to hide/show columns.

    +   - **Export to Power BI (M Query)**: This will create and download a file called
    `PowerBIQuery.txt` and will provide you with instructions on how to load this
    query into the **Microsoft PowerBI** application.


    Let''s look at the **Pin to dashboard** option.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Pin to dashboard


    This will allow you to pin this query to an Azure portal dashboard so that you
    can easily see the results of the query. The creation and usage of dashboards
    is out of the scope of this chapter. However, you can go to https://docs.microsoft.com/en-us/azure/azure-portal/azure-portal-dashboards
    for more information.


    # Format query


    This will reformat the KQL code to make it more readable. It has internal rules
    that it uses to determine what is more readable, so you may or may not agree with
    how it reformats the code.


    # Running a query


    Once you are satisfied with your query, click on the Run button to see the results.
    As stated previously, make sure that all the code in your query that you want
    to run is selected before clicking on the Run button. If you want to run all the
    lines in the query, you only need to make sure that the cursor is in the query
    and the UI will select the entire query for you.


    The results will be shown in the Results window, which is described next.


    # The Results window


    Immediately below the Query window is the Results window. As the name implies,
    this is where you will view the results of your queries. You can also perform
    tasks such as hiding or showing columns, filtering the results, and changing how
    the results look:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_186_0.png)


    Figure 6.25 – Query results'
  merge: -1
  img_proc: true
- pgno: 187
  md: '> Note

    > If you have not run any queries yet, this will display the History tab, which
    will show queries that you have run previously, if you have any, as well as the
    tabs for the various categories of sample queries.


    # The Results window header


    At the very top of this window is a header that provides information regarding
    the results. On the left side is a message telling you information regarding the
    query. In Figure 6.20, the message states that the query is Completed and that
    it is showing a partial listing from the last 24 hours. The reason it is showing
    only partial results, in this case, is that there is a hard limit of 10,000 results
    that can be shown and there are more rows than the query can return. This message
    will change depending on the query results, and it provides valuable information
    regarding your query''s results.


    > Important Note

    > The maximum number of records that are returned when running a query in the
    Logs page is 30,000.


    To the right of that is a stopwatch icon and the time it took your query to run,
    just over 0.3 seconds in the preceding screenshot. This is a valuable tool to
    help determine whether your query is running inefficiently. While your query is
    running, this value will be updated periodically so you can see it is still running.


    On the far right is the total number of records returned. This can be any number
    from 0 to 30,000 and lets you know whether you need to refine your query further.


    If you click on the double down arrow icon to the right of the total numbers returned,
    you will be shown additional information regarding how long it took the query
    to run in milliseconds, as well as other information. For more information regarding
    these values and how you can use them to help optimize your query, see the Optimizing
    log queries in Azure Monitor link in the Further reading section.


    # The Results tab


    On the left side of the page are two tabs to help you define and filter your queries.
    On the far left is a tab that shows the default Results view, which shows the
    results in a column/row format. Next to that is the Chart tab, which will try
    to show the results in a chart if possible.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Depending on which of those tabs is selected, there will be different information
    shown to the right. The following screenshot shows what it will look like when
    the **Results** tab has been selected:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_188_0.png)


    Figure 6.26 – Table results


    The **Columns** drop-down menu will allow you to select which columns you want
    to show or hide.


    To the right of the **Columns** drop-down menu is the **Add bookmark** link. This
    allows you to create bookmarks from selected result items. Refer to *Chapter 11,
    Threat Hunting in Microsoft Sentinel*, for more information on bookmarks.


    No matter whether you have selected the **Table** or the **Chart** tab, the next
    two items will always be shown:


    +   - **Display time:** This shows you what time zone is being used to show the
    time in the **Results** window. Use the drop-down menu to change the time zone.
    Refer to the **Settings** section to see how to change this for all the results
    windows.

    +   - There is also a slider called **Group columns** that presents the option
    to group your results based on a column.


    If this is enabled, then you will see a gray area under the **Results** tab where
    you can drag columns to categorize them by that column. The following screenshot
    shows the results when they are grouped by **Source**. Compare this to the results
    shown in *Figure 6.25*:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_188_1.png)


    Figure 6.27 – Grouped query results'
