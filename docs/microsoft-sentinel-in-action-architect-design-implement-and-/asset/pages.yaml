- pgno: 392
  md: 'Clicking on the name of the logic app, shown in Figure 11.9, will bring you
    to the logic app settings page. This is where you can create, edit, or delete
    an individual logic app and see more information regarding your logic app, as
    well as see the history of your logic app''s runs, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_392_0.png)


    Figure 12.10 – Logic app overview page


    Let''s discuss each section in more detail.


    # The menu bar


    This is where you perform more actions against this logic app. We will not discuss
    all the options available in the left-hand navigation menu as they are beyond
    the scope of this book. However, we encourage you to take some time to study the
    full capabilities of logic apps.


    # The header bar


    The header bar contains the following buttons, which allow you to quickly manage
    the logic app:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_392_1.png)


    Figure 12.11 – Logic app overview page header bar'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'Each field is as follows:


    +   - The **Run Trigger** button will cause the logic app to run. This is not
    very useful with most playbooks as they will require an alert trigger''s information
    to run.

    +   - The **Refresh** button will refresh the page. This can be useful when you''re
    running a playbook to tell you when it is finished running, as the results of
    the run will show up in the **Runs history** section.

    +   - The **Edit** button will allow you to edit the logic app''s workflow. Refer
    to the *Using the Logic Apps Designer page* section for more information.

    +   - The **Delete** button will allow you to delete this logic app after confirming
    you want to do this.

    +   - The **Disable** button will disable the logic app so that it will not run,
    even if the connector is triggered. If the logic app is disabled, then this button
    will be called **Enable**.

    +   - The **Update Schema** button will only rarely be enabled and only if a change
    has been made to a logic app that requires you to update the underlying schema.

    +   - The **Clone** button will allow you to make a copy of this logic app. This
    can be useful if you want to try out some changes without losing the original.

    +   - The **Export** button will allow you to export the logic app to Power Automate
    and Power Apps. As playbooks cannot be exported, this feature will not be covered
    here.


    Let''s look at the next field.


    # The essentials section


    This section shows the most essential information for the logic app. Most of the
    fields are shown with all other types of Azure resources and are self-explanatory,
    so they will not be covered, with two exceptions:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_393_0.png)


    Figure 12.12 – The logic app overview page''s essentials section'
  merge: -1
  img_proc: true
- pgno: 394
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 395
  md: 'The main items on this page that we will focus on are the Edit button in the
    header, so that we can make changes to our playbook, and Runs history at the bottom
    of the page, which lets us know which instance of the logic app succeeded or failed,
    and if it failed, why.


    > Tip

    > For more information on debugging logic apps, go to https://docs.microsoft.com/en-us/azure/logic-apps/logic-apps-diagnosing-failures.


    Now that you know how to look at existing playbooks, how do you go about adding
    one? The next section will cover adding a new playbook.


    # Creating a new playbook


    You are going to want to create playbooks, so now is the time to learn how to
    do that.


    On the Microsoft Sentinel Automation page (see Figure 11.1), click on the Add
    Playbook link in the header. This will open a new tab in your browser that will
    lead to the Logic App screen, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_395_0.png)


    Figure 12.14 – Adding a new playbook'
  merge: -1
  img_proc: true
- pgno: 396
  md: 'Let''s discuss the different fields:


    +   - In the **Logic App name** field, enter a descriptive name. No blanks are
    allowed but you can use underscores. Make the name descriptive enough so that
    other users will know what the playbook intends to do.

    +   - From the **Subscription** dropdown, select the appropriate subscription.
    This should be the same subscription as where your Log Analytics (and Microsoft
    Sentinel) workspace is located.

    +   - In the **Resource group** field, select an existing resource group or create
    a new one. It does not matter whether your playbooks are in the same resource
    group as your Log Analytics workspace. However, you should follow your organization''s
    Azure architecture design policies if there are any.

    +   - From the **Location** dropdown, select the appropriate location. This should
    be the same location as where your Log Analytics workspace is located to avoid
    egress charges.

    +   - In the **Log Analytics** field, if you want information about this playbook''s
    runtime events to be stored in Log Analytics, turn this option on. This will be
    useful if you need to allow another system, such as Microsoft Sentinel, to perform
    queries against this information.


    Once this information has been filled in, click the **Review + create** button.
    This will validate that the information you have entered is correct and, if it
    is, will allow you to create the logic app. If not, it will inform you of what
    is wrong and allow you to go back to the main page to fix the issues.


    It may take a little while for your logic app to be created. You will be taken
    back to the main playbook page while this happens.


    That is how you create the basis for your playbook. As it stands right now, it
    does nothing as there are no workflow steps in it. Next, we will explore how to
    add the workflow components to make your playbook useful.


    # Using the Logic Apps Designer page


    Once the playbook has been created, you will be taken to the **Logic Apps Designer**
    page. There are two different views for this page.'
  merge: -1
  img_proc: true
