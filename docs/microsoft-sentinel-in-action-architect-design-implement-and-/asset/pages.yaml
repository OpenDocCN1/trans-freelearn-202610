- pgno: 349
  md: 'Looking back at Figure 11.8, the last entry in the context menu is called Add
    to livestream. Selecting this will add the query to the Livestream window, as
    follows:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_349_0.png)


    Figure 11.9 – Adding a query to Livestream


    For each livestream that has been added, you can see its status, the query name,
    how long it has been running, how many results have been found, what the last
    result was, the time that the last result occurred, and a sparkline showing how
    many results were found along the timeline (not shown).


    Clicking on each livestream will show the details pane where you get information
    about the query, including the full KQL code and the ability to view the query
    results as if you were running it from the Queries tab. At the bottom of this
    pane is the Pause button, which will pause a running livestream or, if it is paused,
    play the livestream, and the Open livestream button.


    Clicking the Open livestream button will open the Livestream window. Here, you
    can start or stop the query, promote it to an alert rule, modify the query, and
    see the results, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_349_1.png)


    Figure 11.10 – Livestream page'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'At the top of the screen is the header bar where you perform actions against
    the livestream. You can play or pause the livestream, save the livestream, delete
    it, create analytics from the livestream, save any selected results as bookmarks,
    and show or hide the columns that the query returns.


    At the bottom of the screen are all the results that have been added since the
    query started running. The columns that are displayed will depend on the query
    that is being run.


    Adding a query to the **Livestream** and enabling it causes that query to be run
    every minute. If the query runs and the display increments, it means that a potential
    threat is active. Additionally, you can move away from the **Livestream** tab,
    and it will continue running. You will be notified through the Azure console notification
    system as new artifacts are incrementing during the **Livestream** session. You
    can also select the individual rows of the results and add them as bookmarks,
    which will be described in the next section.


    Adding queries to **Livestream** can be a very useful tool to watch what is happening
    in your environment in almost real time. By watching one or more queries, you
    will get to see the results show up when they happen.


    In the next section, we will discuss bookmarks, which allow you to save the results
    from queries and associate them with an incident, to assist you further with your
    investigations.


    # Working with bookmarks


    While carrying out investigations, there may be times when you need to keep track
    of the results from previously run queries. It could be that you need to work
    on another project and will come back to this investigation later, or another
    user will be taking over the investigation. You may also need to keep certain
    results as evidence of an incident. In any case, using a bookmark will allow you
    to save this information for later.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Creating a bookmark


    To create a new bookmark, you must run a query from the Logs page – refer to Chapter
    6, Microsoft Sentinel Logs and Writing Queries, or, as we just saw, from the results
    of a livestream. While on the Hunting page, clicking the Viewing Results button
    in the query''s details pane will open the Logs page, showing your results, as
    follows:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_351_0.png)


    Figure 11.11 – Viewing query results


    You may have noticed that there are checkboxes to the left of each result. To
    create a new bookmark, select one or more checkboxes. When at least one checkbox
    has been selected, the Add bookmark link will be enabled in the result''s header
    bar.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'When you click on **Add bookmark**, a new blade will open, as shown in the
    following screenshot (the actual title of the blade will be different if you select
    one checkbox instead of multiple checkboxes):


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_352_0.png)


    Figure 11.12 – Adding a bookmark blade


    The **Bookmark Name** will be filled in with the name of the query, followed by
    a random 12-digit hexadecimal number so that if you create multiple bookmarks
    from the same query, they will each have a unique name. Below that is a list of
