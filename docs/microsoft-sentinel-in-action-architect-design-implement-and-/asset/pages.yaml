  md: '# Configuring Log Analytics storage options


    Once you have completed the configuration of a few data connectors, you will begin
    to see how much data you will ingest and store in Log Analytics daily. The amount
    of data you store and retain directly impacts its associated costs (see Chapter
    1, Getting Started with Microsoft Sentinel, for further details). You can view
    the current usage and costs by navigating to the Log Analytics workspace, then
    selecting Usage and estimated costs from the General menu, as shown in the following
    screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_101_0.png)


    Figure 3.10 – Log Analytics navigation menu'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'Once it’s selected, you are then presented with a dashboard of information
    that will show the pricing tier and current costs on the left-hand side, and graphs
    on the right-hand side to show the variation in daily consumption for the last
    31 days. A second graph shows the total size of retained data per solution. An
    example of the dashboard is shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_102_0.png)


    Figure 3.11 – Log Analytics usage and cost dashboard


    From this page, explore two of the options available along the top menu bar:


    +   - **Daily cap:** With this option, you can enable or disable the ability to
    limit how much data is ingested into the Log Analytics workspace on a per-day
    basis. While this is a useful control to have to limit costs, there is a risk
    that the capped data will result in a loss of security information that’s valuable
    for detecting threats across your environment. We recommend only using this for
    non-production environments.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '+   - **Data Retention:** This option allows you to configure the number of
    days data should be retained in the Log Analytics workspace. The default number
    for Log Analytics is 31 days; however, when Microsoft Sentinel is also enabled
    on the Log Analytics workspace, the default free amount is 90 days. If you choose
    to increase beyond 90 days, you will be charged a set fee per **gigabyte (GB)**
    per month.


    In the next section, we will look at how we calculate the costs involved in data
    ingestion and retention for Microsoft Sentinel and Log Analytics.


    # Calculating the cost of data ingestion and retention


    Many organizations need to retain security log data for longer than 90 days, and
    budget for it to ensure they have enough capacity based on business needs. For
    example, if we consider the need to keep data for 2 years, with an average daily
    ingestion rate of 10 GB, then we can calculate the cost of the initial ingestion
    and analysis, then compare this to the cost of retention. This will provide an
    annual cost estimate for both aspects.


    The following table shows the cost for ingesting data into Log Analytics and analyzing
    that data in Microsoft Sentinel. This price includes 90 days of free retention:


    | | Per day | Per month | Per year total | 2 year total |

    |---|---|---|---|---|

    | Azure Sentinel | $20 | $600 | $7,200 | $14,600 |

    | Log Analytics | $23 | $690 | $8,280 | $16,790 |

    | Total | $43 | $1,290 | $15,480 | $30,960 |


    Figure 3.12 – Example pricing table for Microsoft Sentinel


    The following table shows the amount of data being retained past the free 90 days
    included in the preceding pricing, based on ingesting 10 GB per day:


    | | Day 91 | Day 120 | Day 270 | Day 330 | Day 365 | Day 730 |

    |---|---|---|---|---|---|---|

    | Total Data Size (GB) | 910 | 1,200 | 2,700 | 3,300 | 3,650 | 7,300 |

    | Retention Costs (per month) | $91 | $120 | $270 | $330 | $365 | $730 |


    Figure 3.13 – Example pricing table for retention costs'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Now, if we add these together, we can see the total cost of the solution over
    a 12-month period, shown in the following table:


    |  | Data Size (GB) | Log Analytics | Azure Sentinel | Data Retention | Total
    Cost (per month) |

    |---|---|---|---|---|---|

    | Month 1 | 300 | $690 | $600 | $0 | $1,290 |

    | Month 2 | 600 | $690 | $600 | $0 | $1,290 |

