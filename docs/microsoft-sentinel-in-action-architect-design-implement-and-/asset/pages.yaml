- pgno: 385
  md: 'If you click on the + Add condition link, you can add more filtering rules.
    Each time you click this link, another filter dropdown will appear, as shown in
    the following screenshot. This will allow you to add filters based on the properties
    of the incident, including Title, Description, Severity, Status, and others. In
    addition, other fields can be filtered on, including Incident Provider, Azure
    Resource id, Host name, and many more.


    As shown in the following screenshot, you can also select the condition for the
    comparison and enter the string that will be used for the comparison. If you want
    to be able to filter on the multiple string values, click on the icon to the right
    of the string. This will add another text box that you can use to enter another
    string value. Note that in this case, it will be doing an OR search.


    You can also click on the trash icon to delete either the entire rule or one of
    the additional text boxes as needed:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_385_0.png)


    Once you have determined which analytic rules will kick off this automation rule,
    you need to determine what this rule will do. This can be done by setting Actions.'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'As shown in the following screenshot, there are different actions that you
    can perform:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_386_0.png)


    Figure 12.8 – Automation rule actions


    Each of the available actions is described in the following table:


    | Action | Description |

    |---|---|

    | Run playbook | This will allow you to select which playbook you can run. Only
    those playbooks using the incident trigger will be shown. Refer to the Types of
    playbooks section in this chapter for more information. |

    | Change status | This will automatically change the incident''s status. If selected,
    another dropdown will be shown where you can choose its status. |

    | Change severity | This will automatically change the incident''s severity. If
    selected, another dropdown will be shown where you can choose its severity. |

    | Assign owner | This will automatically change the incident''s owner. If selected,
    another dropdown will be shown where you can choose the owner. |

    | Add tags | This will automatically add the tag(s) to the incident. If selected,
    a new section where the tags can be entered will be shown. |


    Table 12.2


    You can have multiple actions in the same rule. If there is more than one action,
    the first one will run, then the second one will be started after the first, and
    so on.


    The Rule expiration field allows you to select how long this rule will be active.
    By default, it will be Indefinite, in which case the rule never stops being active.
    You can select a date and time when the rule will expire, in which case the rule
    will be deactivated when it reaches that date and time.'
  merge: -1
  img_proc: true
- pgno: 387
  md: "**Order** determines the order in which this rule will be applied. Looking\
    \ back at *Figure 12.5*, you can see that the order for this rule has defaulted\
    \ to 4 since there are already three other rules that are being run first, second,\
    \ and third. You can change the number here to change the order that the rules\
    \ will be run.\n\nIf there are two rules with the same order number, you will\
    \ not be able to determine which one will be run first, so it is a good idea to\
    \ make sure the rules have unique order numbers so that the order is always known\
    \ if that matters. No matter the order, all the rules whose conditions match the\
    \ new incident will be run.\n\nOnce all the fields have been filled in, click\
    \ the **Apply** button to create the new rule.\n\nNow, let's look at the pricing\
    \ considerations when using playbooks.\n\n# Playbook pricing\n\nAs mentioned in\
    \ *Chapter 1, Getting Started with Microsoft Sentinel*, running an Microsoft Sentinel\
    \ playbook is not included in the ingestion costs of Microsoft Sentinel or Log\
    \ Analytics. It has separate charges that, though they may be considered small,\
    \ can add up quickly.\n\nFor example, in the East US region, each logic app action\
    \ that is run (and this includes things such as looking up information, extracting\
    \ JSON, and sending emails) will cost $0.000025 each time it is used. There is\
    \ also an additional $0.000125 charge for each standard connector. Granted, this\
    \ seems small, but if you write a logic app that has 100 actions with 1 connector\
    \ that gets run every second of every day for a month, that one logic app would\
    \ cost $3,564 each month!\n\n> **Note**\n> \n> For more information on Azure Logic\
    \ Apps pricing, go to https://azure.microsoft.com/en-us/pricing/details/logic-apps/.\n\
    \nNow, this is an extreme example, but it serves to remind you that when designing\
    \ playbooks, you need to keep them as simple as needed and that you should not\
    \ do a lot of extraneous work. Next, we will discuss the Microsoft Sentinel connector,\
    \ which you will need to use in all Microsoft Sentinel playbooks."
  merge: -1
