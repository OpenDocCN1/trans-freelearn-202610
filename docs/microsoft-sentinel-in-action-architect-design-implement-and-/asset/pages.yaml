- pgno: 413
  md: 'Let''s look at the next method.


    # Integrating Azure security alert sources (not just Sentinel) with ServiceNow
    Security Incident Response via the Microsoft Graph Security API


    Since the release of the first edition of this book, Microsoft and ServiceNow
    have partnered to enable Microsoft Sentinel and ServiceNow Security Incident Response
    integration via the Microsoft Graph Security API.


    The Microsoft Graph Security API is "an intermediary service (or broker) that
    provides a single programmatic interface to connect multiple Microsoft Graph Security
    providers (also called security providers or providers). Requests to the Microsoft
    Graph Security API are federated to all applicable security providers. The results
    are aggregated and returned to the requesting application in a common schema."
    – https://docs.microsoft.com/en-us/graph/security-concept-overview


    This method of integrating Microsoft Sentinel with ServiceNow has one key benefit:
    it does not require all your security alerts in Azure to flow through Sentinel.
    It does not even require you to utilize Sentinel. These are less common use cases,
    though. Most organizations do utilize Sentinel and do aggregate and correlate
    all their Azure security alerts using Sentinel.


    Some of the limitations of integrating Microsoft Sentinel with ServiceNow using
    the Microsoft Graph Security API include the following:


    +   - The Microsoft Graph Security API does not support sending data back to Sentinel
    from ServiceNow. For example, when a security incident in ServiceNow closes, organizations
    often want the corresponding alerts in Sentinel to automatically close.

    +   - The integration plugin provided by ServiceNow for the Microsoft Graph Security
    API does not support complex conditions on aggregating multiple Sentinel alerts
    into the same ServiceNow security incident. For example, aggregation on two fields
    will require both fields to match; there is no option for one field OR another
    field to match.


    > Note

    > There are ways to work around this that require doubling the number of integration
    profiles created, adding a lot of complexity. But it can be done.'
  merge: -1
  img_proc: true
