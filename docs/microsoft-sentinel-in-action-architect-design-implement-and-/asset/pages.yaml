- pgno: 461
  md: '+   4. To get the full details of an alert, follow these steps:

    +   5. Find the incident in the incident list.

    +   6. Click on the View full details link.

    +   7. In the Alerts tab, click on the alert''s ID.

    +   8. Look at the incident''s detail pane and under the Analytics rule entry
    will be a link to the analytic rule that created this incident. Click that link
    to be taken into the analytic rule''s configuration.


    # Chapter 10


    +   1. The three types of entities that can be viewed in Entity behavior are accounts,
    hosts, and IP addresses.

    +   2. The three types of information that can be presented in the entity''s timeline
    are alerts, bookmarks, and activities.

    +   3. Use the Timeline content filter and set it to show only Activities.

    +   4. A custom activity can be created in the following ways:

    +      - Click the Add activity link on the Entity settings page.

    +      - Or, select an out-of-the-box template and click on the Create activity
    button in the details pane.

    +   5. The two entity types that can be used to create a custom activity are hosts
    and account.


    # Chapter 11


    +   1. To run a single hunting query, select the query, and in the details pane
    click the Run Query button.

    +   2. To run all hunting queries, click the Run all queries button in the hunting
    page''s header.

    +   3. To view the results of a single hunting query, select the query and in
    the details pane, click the View query results link.

    +   4. To create a new bookmark, run the query on the Logs page, select the results
    to add to the bookmark, and then click the Add bookmark button.'
  merge: -1
  img_proc: true
- pgno: 462
  md: '5. To associate a bookmark with an incident, you can use one of two methods:


    +   - Create a new incident from a bookmark.

    +   - Or, add a bookmark to an existing incident.


    # Chapter 12


    +   1. To use a logic app as an Microsoft Sentinel playbook, it must use the **Microsoft
    Sentinel connector**.

    +   2. To tell whether a playbook ran successfully, select the playbook from the
    **Playbooks** page and then look at the **Run History** section.

    +   3. When using a playbook''s workflow to get information about an incident,
    use the **Alert | Get Incident** action and pass in the necessary parameters.

    +   4. Dynamic content is information provided by either a connector or an action
    that can change for each instance of the playbook – for example, the **System
    Alert ID** field that was used to get the incident in the *Creating a simple Microsoft
    Sentinel playbook* section.

    +   5. Yes, you can combine dynamic and static content in one field.


    # Chapter 14


    +   1. The two roles are SOC engineer and SOC analyst.

    +   2. Both roles need to be involved in carrying out the scenario mapping exercise.

    +   3. The log ingestion rate and pricing tier should be checked at least once
    per month by the SOC engineer.

    +   4. The SOC analyst should check the **Incidents** page every day.

    +   5. You should look at ingesting logs the first moment the instance is created.
    This will provide maximum visibility of security events.'
