- pgno: 440
  md: 'B. Ensure the total ingestion per day does not exceed the expected ingestion
    rates. There may be multiple reasons for an increased ingestion rate on a single
    day, such as a spike in the volume of threats or an increase in business activity,
    such as higher sales or increased remote work. However, if the volume continues
    to increase day by day, there will be an impact on the expected budget for the
    costs, and this will need to be reviewed with the management teams.


    There is a workbook available to assist with this monitoring: https://docs.microsoft.com/en-us/azure/sentinel/monitor-data-connector-health.


    +   - **Monitor the service health of all core components:**


    Monitor the service health of all core components, for example, the Azure platform,
    **Azure AD** for **Identity and Access Management (IAM)**, and any data collection
    servers (syslog), ensuring dashboards are available and alerts are triggering
    as expected.


    +   - **Review the planned maintenance, service health, and availability monitoring
    of the Microsoft Azure platform:**


    Do this using the following resources:


    +   A. Publicly viewable information: https://status.azure.com/en-us/status


    +   B. Signing in to your Azure portal and viewing specific details: https://portal.azure.com/#blade/Microsoft_Azure_Health/AzureHealthBrowseBlade/serviceIssues


    # Weekly tasks


    A list of weekly tasks for SOC engineers is as follows:


    +   - Review the data connectors to ensure each connector that is enabled is still
    functioning correctly. Check for any new or preview connectors, as well as updates
    to existing connectors. If a new connector can be used instead of a custom connector
    (or a syslog server), plan to replace this as soon as possible to benefit from
    the new capability and reduce the reliance on customizations and server-based
    solutions.


    +   - Review the **Workbooks** page and the **News & Guides** page for new workbook
    templates, connector announcements, and any new updates. Ensure that existing
    workbooks are functioning correctly after the updates.'
  merge: -1
  img_proc: true
- pgno: 441
  md: '# Monthly tasks


    A list of monthly tasks for SOC engineers is as follows:


    +   - Review the trends for data ingestion to carry out projected cost analysis;
    adjust the **pricing** tier to reflect the most cost-effective option (see the
    *Service pricing for Microsoft Sentinel* section in *Chapter 1, Getting Started
    with Microsoft Sentinel*, for more details).

    +   - Validate the quality of the logs ingested and carry out noise-reduction
    tuning, especially after the introduction of new data sources.

    +   - Validate the current retention period set for each data type and confirm
    it is suitable for investigation requirements and budgeting guidelines.

    +   - Carry out a scenario-mapping exercise with the SOC analysts to identify
    additional detection and response requirements (see the *Scenario mapping* section
    in *Chapter 1, Getting Started with Microsoft Sentinel*, for more details). Transfer
    this knowledge to key stakeholders across the business and technology teams.

    +   - Review the roles and access permissions granted, ensuring minimum permissions
    are assigned and only **active** team members retain roles as required.


    # Ad hoc tasks


    A list of ad hoc tasks for SOC engineers is as follows:


    +   - Review any changes made to the IT infrastructure; look for opportunities
    to integrate additional log data to gain key insights and configure automated
    responses based on attack scenarios.

    +   - Review any new data resources that may be suitable to assist in threat hunting
    scenarios.

    +   - Review announcements from Microsoft via their website, blogs, technical
    community, or events (such as Microsoft **Ignite** and Microsoft **Build**) for
    potential changes to the Microsoft Sentinel platform or changes to any integrated
    services and solutions. If you have non-Microsoft solutions deployed, also check
    the appropriate announcements for supported product updates.

    +   - Update the Microsoft Sentinel architecture documentation to reflect any
    changes made.

    +   - Engage with external services that offer advanced security practices to
    further test and train your SOC capabilities, including **penetration testing**,
    **social engineering**, and defining advanced SOC activities.'
