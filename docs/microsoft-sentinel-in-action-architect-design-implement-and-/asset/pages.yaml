- pgno: 110
  md: 'This chapter will cover the following topics:


    +   - Introduction to TI

    +   - Understanding STIX and TAXII

    +   - Choosing the right intel feeds for your needs

    +   - Implementing TI connectors


    # Introduction to TI


    Due to the complex nature of cybersecurity and the sophistication of modern attacks,
    it is difficult for any organization to keep track of vulnerabilities and the
    multiple ways that an attacker may compromise a system, especially if cybersecurity
    is not the focus of the organization. Understanding what to look for and deciding
    what to do when you see a system anomaly, or another potential threat, is complex
    and time-consuming. This is where TI comes in handy.


    TI is critical in the fight against adversaries and is now integrated with most
    security products; it provides the ability to set a list of indicators for detection
    and blocking malicious activities. You can subscribe to TI feeds to gain knowledge
    from other security professionals in the industry and create your own indicators
    that are specific to the environment you are operating in.


    If you are new to this topic, there are some new keywords and abbreviations to
    learn:


    +   - **Threat indicators**: This is a list of suspicious or known malicious entities,
    such as IP addresses, URLs, and files. They are used to alert when suspicious
    usage of internal files or addresses is discovered in your environment.

    +   - **Indicators of Compromise (IoCs)**: This indicates uniquely known behaviors
    and activities that show signs of potential malicious intent or an actual breach.
    These are available as open source and some as paid-for services.

    +   - **Alert definitions**: By combining multiple threat indicators and IoCs,
    you can build an alert definition that only triggers in the right context. This
    will reduce alert fatigue from overloading the SOC with too many false positives.

    +   - **Malware Information Sharing Project (MISP)**: This is an open source **Threat
    Intelligence Platform (TIP)** and a set of open standards for threat information
    sharing. MISP covers malware indicators, fraud, and vulnerability information.
    Read more here: https://www.misp-project.org/.'
  merge: -1
  img_proc: true
- pgno: 111
  md: <!-- no content -->
  merge: -1
