- pgno: 259
  md: 'We have finished looking at how to manage your existing workbooks. You have
    learned about the Saved Workbooks pane, as well as the context-sensitive menu
    that will allow you to perform various management tasks on a workbook. Now, it
    is time to look at the various parts that make up a workbook, and how to use them.


    # Workbook step types


    Each workbook is comprised of one or more steps. As stated earlier, a workbook
    is made up of small sections called steps. Each step has a unique name, which
    can be pretty much anything, and this name can be referenced in other steps. Each
    step can run on its own, although some may require parameters, either from a parameter
    step or from other steps.


    There are six different types of steps: text, query, metric, parameters, links/tabs,
    and groups. Each type of step will be discussed in more detail in the following
    sections.


    To add a new step when editing a workbook, at the bottom of the screen is the
    +Add button, which, when clicked, will present a listing of the step types, as
    shown in the following screenshot. Click on the appropriate option for the type
    of step you wish to add:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_259_0.png)


    Figure 8.21 – Edit mode Add option


    No matter which links you click, the step will have a list of options at the bottom
    of the step that looks like the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_259_1.png)


    Figure 8.22 – Edit mode add options after adding a step


    Clicking the Done Editing button will change the selected step to view mode so
    that you can see how your changes look.


    Click the Add button to add a new step.'
  merge: -1
