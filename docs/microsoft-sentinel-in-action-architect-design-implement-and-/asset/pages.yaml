- pgno: 35
  md: '# Integrating with Amazon Web Services (AWS)


    **AWS** provides API access to most features across the platform, which enables
    Microsoft Sentinel to be a rich integration solution. The following list provides
    some of the common resources that should be integrated with Microsoft Sentinel
    if enabled in an AWS account(s):


    +   - AWS CloudTrail logs provide insights into AWS user activities, including
    failed sign-in attempts, IP addresses, regions, user agents, and identity types,
    as well as potentially malicious user activities with assumed roles.


    +   - AWS CloudTrail logs also provide network-related resource activities, including
    the creation, update, and deletion of security groups, network **access control
    lists (ACLs)** and routes, gateways, elastic load balancers, **Virtual Private
    Cloud (VPC)**, subnets, and network interfaces.


    Some resources deployed within an AWS account(s) can be configured to send logs
    directly to Microsoft Sentinel (such as Windows event logs). You may also deploy
    a log collector (Syslog, CEF, or Logstash) within an AWS account(s) to centralize
    the log collection, the same as you would for a private data center.


    # Integrating with Google Cloud Platform (GCP)


    Google provides API access to most features of both **GCP** and the G Suite solution.
    G Suite Connector is currently in development. If you are managing either a G
    Suite or a **GCP** instance and want to use Microsoft Sentinel to secure them,
    you should consider the following options (until a fully supported connector is
    available):


    +   - REST API—this feature is still in development; when released, it will allow
    you to create your own investigation queries.


    +   - Deploy a CASB solution that can interact with GCP logs, control session
    access, and forward relevant information to Microsoft Sentinel.


    +   - Deploy a log collector such as Syslog, CEF, or Logstash. Ensure that all
    deployed resources can forward their logs via the log collector to Microsoft Sentinel.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Integrating with Microsoft Azure


    The **Microsoft Azure** platform provides direct integration with many Microsoft
    security solutions, and more are being added every month:


    +   - Azure Active Directory, for collecting audit and sign-in logs to gather
    insights about app usage, Conditional Access policies, legacy authentication,
    self-service password reset usage, and the management of users, groups, roles,
    and apps.

    +   - Azure Active Directory Identity Protection, which provides user and sign-in
    risk events and vulnerabilities, with the ability to remediate these risks immediately.

    +   - Azure Activity, for insights into subscription-level events such as Azure
    Resource Manager, service health, write operations on resources, and the status
    of activities performed in Azure.

    +   - Azure DDoS Protection, for the protection of web services that could be
    susceptible to attack through **DDoS**.

    +   - Microsoft Defender, the integrated CWPP for security management across Azure,
    AWS, GCP, and hybrid deployments.

    +   - Microsoft Defender for IoT, for insights into the IoT and OT networks with
    recommendations based on the severity of the risk.

    +   - Azure Firewall, the managed, cloud-based network security service to protect
    Azure Virtual Networks.

    +   - Microsoft Information Protection, to classify and optionally protect sensitive
    information.

    +   - Azure Key Vault, for securely storing and accessing secrets including API
    keys, passwords, certificates, or cryptographic keys.

    +   - **Azure Kubernetes Service (AKS)**, an open source, fully managed container
    orchestration service to manage and deploy Docker containers.

    +   - Azure SQL Database, a fully managed PaaS database engine. This connector
    lets you stream the audit and diagnostic logs into Microsoft Sentinel.

    +   - An Azure storage account, a cloud solution for modern data storage scenarios.

    +   - DNS, to improve investigations for clients that try to resolve malicious
    domain names, talkative DNS clients, and other DNS health-related events.

    +   - Dynamics 365, for insights into admin, user, and support activities on this
    platform.'
  merge: -1
