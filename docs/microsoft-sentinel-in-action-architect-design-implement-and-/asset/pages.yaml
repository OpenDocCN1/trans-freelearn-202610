- pgno: 368
  md: 'As you can see from the preceding diagram, there are various steps to performing
    an investigation. Each step is described in further detail next.


    # Developing a premise


    In this step, you need to determine what it is you are trying to find or prove.
    What is it you are trying to find out? Is it to determine whether a malicious
    IP address has been found in your environment? Did a new user account perform
    actions it should not have? Is someone from a foreign entity trying to gain access
    to your system?


    When you develop a premise, you are specifying what it is you are trying to find.
    It may be that you are told what it is you are looking for, or it may be that
    you are looking for something that you think may have happened. Utilize tools
    such as threat intelligence sources as premises to being your threat hunt.


    Keep in mind that threat hunting is a gap measure to ensure coverage of newly
    reported threats until analytics rules are available.


    # Determining data


    In this step, you will determine which data you need to start your investigation.
    Which data will you need to look at to work your hypotheses? Is it all in Log
    Analytics, or will it be found elsewhere? What do you already know about your
    environment and what do you need to learn?


    It may be that during your investigation, you determine that there is additional
    information that you may need, so do not feel that you are locked into just the
    data you have acquired in this step.


    You may also find that you do not have all the data needed to work on your premise.
    It may be that there is data you need that is not being logged, in which case
    you will need to see whether you can start gathering that information. In any
    event, if you cannot obtain the needed data, you may need to go back and revise
    your premise.


    Once you start finding specific types of activities in the various logs you have,
    it will make sense to keep track of these to make it easier to find the data in
    the future. The following screenshot shows the beginning of one method to track
    information: using Microsoft Excel to keep track of the log name, the type of
    data being queried, and whether the data is found in the log. If the data is found,
    the name of the column holding the data is entered:'
  merge: -1
  img_proc: true
- pgno: 369
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 370
  md: '# Executing an investigation


    In this step, you will execute the queries that you obtained in the previous step,
    whether you wrote them or found ones that were already written that will work.
    You may be performing queries in Microsoft Sentinel as well as, or instead of,
    in a notebook.

    Wherever you run the queries, once you start looking at the results, you may find
    that you need to revise your premise or determine that you need more data, so
    you may need to go back to a previous step (refer to Figure 10.24).


    # Responding


    Now that you have the information you need, you can respond to the results of
    the investigation. You may just have to plug the security gap you found, or you
    may need to escalate to another team and present what you found. This may be just
    your team, or in the event of a major breach, it could be the Chief Information
    Security Officer (CISO), Chief Information Officer (CIO), or even the board.


    If the response is simple, such as blocking a port in a firewall or blocking an
    IP address range, most likely it is just a matter of notifying the appropriate
    people, updating the ticket, and moving on.


    However, there will most likely be cases where you need to do a full presentation
    on your findings. This could be just to your team, but it could also be to a different
    audience. How you do the presentation is up to your company and its corporate
    culture; just keep thinking while you are doing your work, Would this information
    be useful in a presentation?, and think about how you would present it. A table
    of information may be enough when presenting to your team, but others who are
    not as familiar with the data may need graphs and charts.


    At the very least, your findings and how you got to your results should be presented
    within your team if it is new information, so that everyone is kept up to date
    with the latest findings and can take the most appropriate action.


    # Monitoring


    Develop new analytic queries if possible; otherwise, continue to periodically
    run the investigation to validate findings. Refer to Chapter 7, Creating Analytic
    Rules, for a refresher on creating analytic queries.'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'In this step, you will determine how you can perform continuous monitoring
    to help safeguard against the situation you were investigating or improve the
    ability to investigate again next time. Can you add more information to the log?
    Is there a change in the operating procedures that can be performed to help avoid
    this situation in the future? Is there a change to your network that can be performed?


    One of the best outcomes would be to create an analytic query so that this situation
    can be found automatically and perhaps handled via a playbook. Refer to Chapter
    12, Creating Playbooks and Automation, for more information on creating playbooks.


    # Improving


    Based on any learnings that came from the investigation, improve the investigation
    code and techniques, if possible.


    In this step, you – and, most likely, others – will work to determine how to improve
    the queries used in this hunt, as well as how to avoid needing this hunt in the
    future. It may be that the queries you used could be rewritten to be more efficient,
    changes could be made to operating procedures to avoid the situation altogether,
    or other recommendations may be made based on the skills and experience of your
    team, partners, and domain-specific experts.


    Those are the steps that can be taken to start your threat-hunting investigation.
    Again, none of these are set in stone, and the steps are only provided for guidance.
    You may find that your company has its own steps or that you want to add your
    own. The real takeaway from this is that you should have a repeatable process
    that is always improving, enabling you to share your results at least with your
    co-workers and with the threat-hunting community at large, if you can.


    # Summary


    Now, you have learned about how to start doing threat hunting in Microsoft Sentinel.
    You learned about the Hunting page, the Notebooks page with its Jupyter notebooks,
    and got a brief introduction on how to perform a threat-hunting investigation.


    We looked at the tools that Microsoft Sentinel provides to assist with threat
    hunting. This includes queries that only get run periodically, either due to factors
    such as needing to look for a specific piece of information or the fact that they
    would return too many results to be useful on a scheduled basis.'
