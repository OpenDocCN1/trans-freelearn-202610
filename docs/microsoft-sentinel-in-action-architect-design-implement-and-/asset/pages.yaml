- pgno: 53
  md: 'Once created, a workspace can be used to gather information from many different
    sources, including the following:


    +   - Azure resources in the same subscription

    +   - Azure resources in different subscriptions

    +   - Data from other cloud services (such as **Amazon Web Services** and **Google
    Cloud Platform**)

    +   - Data from your private data center (on-premises or third-party hosted)

    +   - Data from on-premises resources (via secure internet connections)

    +   - Data from IoT and industrial control systems


    To protect the collected data, security and governance controls are built into
    this solution; the Log Analytics service manages your data in a secure cloud data
    repository and ensures that the data is secured with multiple layers of protection,
    including the following:


    +   - Data segregation and isolation, with geographic sovereignty

    +   - Data retention and deletion policies, per data source type

    +   - Internationally certified standards for physical security, inherited from
    the Azure subscription (commercial and government)

    +   - Microsoft-managed incident management processes

    +   - Certified conformity to multiple compliance and regulatory standards

    +   - Secure channels for sending data to Log Analytics; SSL encrypted with certificate-based
    authentication via port 443

    +   - Workspace and role-based access permissions, managed by the customer; more
    details are provided later in this chapter


    For more information on the way data is secured, we recommend reading the official
    Microsoft documentation: https://docs.microsoft.com/en-us/azure/azure-monitor/logs/data-security.'
  merge: -1
  img_proc: true
- pgno: 54
  md: "# Planning a workspace\n\nWhile it is easy to just go and create a workspace,\
    \ it is better to plan out the workspace configuration beforehand to avoid having\
    \ to perform reworking later. Some of the aspects to consider include the following:\n\
    \n+   - **The name of the workspace**: This must be unique across all of Azure.\
    \ It should be descriptive enough to show what service this workspace provides\
    \ just by looking at the name. It is recommended that your company name and the\
    \ word `Sentinel` are used in the name.\n+   \n+   If this raises concerns that\
    \ the name will make it a bigger target for bad actors, use whatever naming convention\
    \ that makes sense and meets corporate standards. For detailed information on\
    \ Azure naming best practices, use this link: https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/ready/azure-best-practices/naming-and-tagging.\n\
    \n+   - **The subscription the workspace belongs to**: It is recommended that\
    \ a separate subscription is created just for Microsoft Sentinel use to limit\
    \ access to it. If this is not feasible, choose an appropriate subscription to\
    \ use.\n\n+   - **The location of the workspace**: The workspace should reside\
    \ in the same location as the resources feeding it to prevent egress charges that\
    \ would occur if you sent the data from one location to another. Large companies\
    \ will most likely have resources in many different locations, in which case it\
    \ would make sense to use the location that has the most resources and has the\
    \ lowest price for the workspace. Keep in mind that there may be laws in place\
    \ that denote where the data must reside.\n+   \n+   For more information on Log\
    \ Analytics pricing, see https://azure.microsoft.com/en-us/pricing/details/monitor.\n\
    \n+   - **Which resource group will the workspace reside in**: It is recommended\
    \ that all the Microsoft Sentinel resources reside in the same resource group,\
    \ although that is not a hard and fast rule. If it makes more sense to have all\
    \ your workspaces in one resource group, Microsoft Sentinel in another, and the\
    \ workbooks in a third resource group, then do that. This will not affect the\
    \ performance of Microsoft Sentinel at all.\n\n+   - **Which pricing tier to use**:\
    \ If the subscription being used to house the workspace has had a workspace created\
    \ in it before April 2, 2018, or if the subscription is part of a Microsoft Enterprise\
    \ Agreement that was in place prior to February 1, 2019, you will continue to\
    \ have access to the legacy pricing tiers. Otherwise, only **Per GB (2018)** is\
    \ shown, and data is charged for ingestion and retention per GB. The legacy options\
    \ are as follows:"
  merge: -1
  img_proc: true
- pgno: 55
  md: '+   - **Free**: There is no charge for the data being ingested, although there
    is a 500 MB daily limit, and the data is retained for only 7 days. This can only
    be used for lab and research purposes.

    +   - **Standalone (Per GB)**: This is the same as **Per GB (2018)**.

    +   - **Per Node (OMS)**: Use this one if **OMS E1 Suite**, **OMS E2 Suite**,
    or **OMS Add-On for System Center** have been purchased to use the authorization
    that came from those purchases.


    Planning your workspace before you create it is very important. Make sure to select
    a unique and meaningful name, the proper location to avoid egress charges, the
    correct resource group, and other decisions prior to deployment will save you
    from frustration or complete reworking later. A very good article on this topic
    was written by Tiander Turpijn: https://techcommunity.microsoft.com/t5/azure-sentinel/best-practices-for-designing-an-azure-sentinel-or-azure-security/ba-p/832574.


    # Creating a workspace using the portal


    This section will describe how to create the Log Analytics workspace using the
    Azure portal. This is a graphical representation of the PowerShell and CLI commands
    discussed later and, as such, may be the easiest way to start working with workspaces:


    +   1. In the Azure portal, enter `Log Analytics workspaces` in the search bar
    at the top of the screen. This will show a list of services that are related to
    the search term entered. Locate and click on the **Log Analytics workspaces**
    link.

    +   2. Click the **Add** button to create a new workspace:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_55_0.png)


    Figure 2.2 – Creating a new Log Analytics workspace'
  merge: -1
  img_proc: true
- pgno: 56
  md: '3. Enter the required values in the new blade:


    +   A. Enter the name for the workspace.

    +   B. Select a **Subscription** where this will reside.

    +   C. Choose the **Resource group** for this workspace.

    +   D. Select the **Location** where this workspace will reside.

    +   E. For the **Pricing tier** option, **Per GB (2018)** will automatically be
    selected.


    The blade will look something like this:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_56_0.png)


    Figure 2.3 – Log Analytics workspace options


    4. When all the values have been filled in, click the **OK** button at the bottom
    of the screen to continue. Even though the button will change to say **Validating**,
    it is also creating the workspace in the background.


    5. Once the workspace has been created, you will be taken back to the listing
    of all the workspaces. You may need to refresh this listing to see your new workspace.'
  merge: -1
