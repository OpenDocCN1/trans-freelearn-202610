- pgno: 346
  md: '# Adding a new query


    To add a new query, click on the New Query button at the top of the Hunting page.
    This will open the Create custom query page, as shown in the following screenshot.
    This is very similar to creating a new scheduled query, as discussed in Chapter
    7, Creating Analytic Rules, so you can read the Creating a new rule using the
    wizard section as a refresher:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_346_0.png)


    Figure 11.7 – Adding a new query


    Fill in the Name, Description, and Custom query fields. If your query has any
    entities, use the Entity mapping section to add the entity mapping to the query.
    Remember to add them one at a time. Finally, select one or more tactics (not shown
    in the screenshot) that this query is using.


    > Important Note

    > At the time of writing this chapter, there is no place to enter or select MITRE
    techniques. These are only available with out-of-the-box hunting queries.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'Once all the information has been filled in, click on the Create button to
    create the new query.


    Now that you have added a new query, what happens if you need to make a change
    to it? The next section talks about editing a query and will answer that very
    question.


    # Editing a query


    If a query is not working quite as you expect, or you want to update information
    about the query, you can edit it to make the needed changes.


    To edit a query, click on the context-sensitive menu (denoted by the three periods
    at the far right of the line) to the right of the query''s name in the Query list
    and select Edit Query, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_347_0.png)


    This will bring up the same page that was shown in Figure 11.7, when adding a
    query was discussed earlier. Make the necessary changes and click on Save to save
    your changes.


    You can always click on the X in the upper right-hand corner of the window to
    close the window without saving any changes. If you have made any changes, you
    will be prompted for verification that you want to close the window without saving
    your changes.


    Now you know how you can change a query as needed. What if you want to make a
    new one and change the new one? You can clone the query, as described in the next
    section.


    # Cloning a query


    You may have noticed that you cannot edit a pre-existing query. If you need to
    modify a pre-existing query, you will need to clone it first to make a custom
    query, and then change the new custom query.


    To clone a query, click on the context-sensitive menu, as shown in the previous
    section, and click Clone Query. This will open the same window that is shown when
    adding a new query, and all the fields will be filled in with the same information
    that the original query has, except for the Name field.'
  merge: -1
  img_proc: true
- pgno: 348
  md: <!-- no content -->
