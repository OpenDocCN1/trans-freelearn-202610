- pgno: 239
  md: '# 8


    # Creating and

    Using Workbooks


    Microsoft Sentinel workbooks are a way to create and show customizable and interactive
    reports that can display graphs, charts, and tables. Information can be presented
    from Log Analytics workspaces using the same **Kusto Query Language (KQL)** queries
    that you already know how to use. These workbooks are based on the workbook technology
    that has already been used with other Azure resources, including Azure Monitor
    and Log Analytics workspaces.


    Microsoft Sentinel provides several templates that are ready for use. You can
    use these templates to create your own workbook that can then be modified as needed.
    Most of the data connectors that are used to ingest data come with their own workbooks,
    to allow you better insight into the data that is being ingested using tables
    and visualizations, including bar and pie charts. You can also make your own workbooks
    from scratch, if required.


    In this chapter, you will learn the following topics:


    +   - An overview of the Workbooks page

    +   - Walking through an existing workbook

    +   - Creating workbooks

    +   - Editing a workbook'
  merge: -1
  img_proc: true
- pgno: 240
  md: '+   - Managing workbooks

    +   - Workbook step types


    # An overview of the Workbooks page


    To go to the Workbooks page, select Workbooks from the Microsoft Sentinel navigation
    blade. A new screen will appear that will look like the one shown in the following
    screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_240_0.png)


    Figure 8.1 – Microsoft Sentinel Workbooks page


    The header at the top of the page in the preceding screenshot shows the Refresh
    and Add workbook buttons. Adding a new workbook will be discussed in the Adding
    a new workbook from scratch section.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Let''s discuss the different components of the Workbooks page in detail in
    the following sections.


    # The workbook header


    Under the Refresh and Add workbook buttons is the total number of workbooks that
    have been saved. The number 9 in the following screenshot includes all the workbooks
    that have been saved on our instance:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_241_0.png)


    Figure 8.2 – Workbook header


    To the right of that is the total number of templates available to use. This number
    may change as new workbook templates are added.


    On the far-right side is the total number of templates that can be updated. As
    you can see in Figure 8.1, there is an update available for the Azure AD Sign-in
    logs workbook. If you select the workbook, there will be a button at the bottom
    of the details pane that reads Update. Click it to update the workbook.


    > Note

    > Note that this will update the template and the saved version of this template
    if there is one. This will overwrite any changes made to the saved version. To
    avoid this, it is considered a best practice to change the name of the workbook
    that you saved from a template so it will not get overwritten.


    Let''s look at the Templates view.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# The Templates view


    Below the workbook header are two tabs, My workbooks and Templates, as shown in
    the following screenshot. The My workbooks tab will show all the workbooks to
    which the user has access. The Templates tab shows all the templates that are
    available for use:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_242_0.png)


    Figure 8.3 – Templates view


    No matter which tab you select, each template or report will be shown on a single
    row. On the far left of each template you may see a vertical green bar, indicating
    that this template has been saved previously and can be viewed under My workbooks,
    or a yellow bar to indicate that template has an update waiting. If you are looking
    at the My workbooks tab, then every report will have a green bar since every report
    is available to view, or maybe an orange bar if there is an update available to
    the template. To the right of the colored bar is an icon representing the company
    that created the template, followed by the template name, and the name of the
    company under this.


    Looking at the first template listed in the preceding screenshot, you can see
    the icon for Amazon Web Services (AWS). This is followed by the template name,
    AWS Network Activities, with the company that created it, MICROSOFT, under the
    template name.'
  merge: -1
