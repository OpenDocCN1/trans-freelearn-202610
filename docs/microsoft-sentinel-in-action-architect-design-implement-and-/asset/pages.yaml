- pgno: 280
  md: '+   - **When items are selected, export parameters**: If this is selected,
    when an item in this step is selected, a parameter will be set to the corresponding
    value. This allows functionality such as filtering a listing of users based on
    status. If this is selected, a new button will show under it, called **Add Parameter**.
    Clicking on that button will open a new window where you can set the parameter,
    as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_280_0.png)


    Figure 8.41 – Advanced Settings – adding a new parameter to export


    **Field to export** is for the name of the field from the query that will be used
    to populate the parameter''s value. **Parameter name** is for the name of the
    parameter, and **Parameter type** is for the type of the parameter. For this book,
    we will always use text that includes integer, date/time, and Boolean values.


    You can have multiple parameters exported at the same time. Remember to use the
    parameter in a query, surrounding the parameter name with brackets, { }.


    +   - **Show query when not editing**: If this is selected, the KQL query will
    always be displayed. This is not usually a good idea as it may confuse the casual
    user.'
