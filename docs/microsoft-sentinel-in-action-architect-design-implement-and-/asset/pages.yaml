- pgno: 194
  md: "# Learn more\n\nThis section contains all the same links as the book icon in\
    \ the page header. Refer to the *Help* (the book icon) section for a refresher.\n\
    \nThe information is duplicated here as an easy way to refer to the links when\
    \ entering the **Logs** page for the first time. As soon as a query is run, the\
    \ results window will expand to overwrite this area, so you will need to use the\
    \ book icon to get to these links.\n\nYou have learned quite a bit about the Microsoft\
    \ Sentinel **Logs** page and how to select and run built-in queries to get the\
    \ results. You have also learned how to manipulate those results further and how\
    \ to change how they are displayed.\n\nNow it is time to start learning how to\
    \ write your own queries. You already have the basic knowledge of KQL from *Chapter\
    \ 5, Using the Kusto Query Language*, so now let's go over the steps to consider\
    \ when writing your own query.\n\n# Writing a query\n\nNow that you have seen\
    \ how to use the **Logs** page in Microsoft Sentinel, it's time to use your new\
    \ skills to write your own queries. No matter what the query is, there are a few\
    \ basic steps you will take to create your query:\n\n+   1. Have an idea of what\
    \ information you are looking for. Do you need to know which computers are currently\
    \ active? What actions a user performed in SharePoint? What data has been ingested?\
    \ This will give you an idea of what log(s) you will need to look at. Look at\
    \ *Chapter 11, Threat Hunting in Microsoft Sentinel*, for information on one way\
    \ to keep track of this data.\n+   2. Once you have an idea of which table you\
    \ want to look at, the next step is to look at a small number of rows in that\
    \ table to get a better understanding of the data that is stored in it.\n+   \n\
    +   One of the easiest ways to do this is to find the table in the **Tables**\
    \ pane, hover over it, and click on the **See preview data** link in the pop-up\
    \ window. This will show up to 10 rows from the selected log. Look at some of\
    \ the rows. Is this some, or possibly, all the information that will be needed?\n\
    +   3. If it is, now you can create the query using the table and applying any\
    \ filtering that may be needed.\n+   4. Finally, determine what would be the best\
    \ way for these results to be displayed. If you are using these in an analytics\
    \ query, then they must be returned as a table view. However, if this is for threat\
    \ hunting or for use in a workbook, then possibly a graphical view would be better."
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Now that you have seen how to write your own queries, here are some that are
    not part of Microsoft Sentinel that you may find useful. As you are reading these,
    keep in the back of your head what steps would have been needed to develop these
    queries. What table would be needed? What information would be needed from the
    table? How would you filter it? How would you display it?


    # The billable data ingested


    You have already seen the query to get a pie chart based on the amount of data
    being ingested. While this is useful, it only shows the percentage against the
    total; it does not show the size of the data being ingested.


    If you want to see how much billable data has been ingested in the last 31 days,
    use the following query:


    ```

    Usage

    | where TimeGenerated > startofday(ago(31d))

    | where IsBillable == true

    | summarize TotalVolumeGB = sum(Quantity) / 1024 by

    bin(TimeGenerated, 1d), Solution

    | render barchart

    ```


    This will look at the Usage log, which holds all the information regarding log
    ingestion for the last 31 days and check the IsBillable column to make sure the
    ingested data is billable. If you want to see all the data, billable or not, remove
    the following line:


    ```

    | where IsBillable == true

    ```


    It then summarizes the data by gigabytes (the Quantity field stores information
    in megabytes, hence the division by 1024), by the day that the data was ingested,
    and by the solution, which is where the data came from. Finally, it will generate
    this data in a stacked column bar chart for easier viewing.


    If you want to see the amount of data from a single solution, you can add the
    following line after the other lines that begin with where, substituting Security
    for whichever solution you wish to view:


    ```

    | where Solution == "Security"

    ```


    This query is very useful to make sure that you are ingesting the amount of data
    you have planned to ingest.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Map view of logins


    Another query that is useful when used in conjunction with the map visualization
    in the workbooks (see Chapter 8, Creating and Using Workbooks, for more information)
    is one that looks at all the Azure sign-ins and gets the latitude and longitude
    so the location can be mapped. This query will look at all the sign-ins and shows
    a summary of the location where the user logged in on a map:


    ```

    SigninLogs

    | extend latitude = toint(LocationDetails.geoCoordinates.latitude), longitude
    = toint(LocationDetails.geoCoordinates.longitude)

    | extend country = strcat(tostring(LocationDetails.countryOrRegion)," - ",tostring(LocationDetails.state))

    | summarize count() by latitude, longitude, country

    ```


    This query will look at all the entries in the SigninLogs log, which holds all
    the login information. Since there is no time limit applied in the code, it will
    use the default time limit based on the Time range drop-down menu.


    Rather than having to pass in the long string to obtain the latitude and longitude,
    it creates new variables for the latitude and longitude. A toint() function is
    used to convert LocationDetails.geoCoordinates.latitude from a dynamic data type
    into an integer data type so they can be used in the summarize command at the
    end:


    ```

    | extend latitude = tostring(LocationDetails.geoCoordinates.latitude)

    ```


    The same conversion will take place for the longitude variable.


    There is a new feature of KQL exposed here: using a period to access information
    stored within a dynamic type. In the case of the latitude value, it is part of
    the geoCoordinates value, which is in turn part of the LocationDetails value,
    hence the need to traverse down the variable chain using the period to get to
    the value that is needed.'
  merge: -1
  img_proc: true
