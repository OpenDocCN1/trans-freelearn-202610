    > Note

    > These prices are based on the current rates applicable to the US East Azure
    region, and figures are rounded for simplicity. Actual data usage may fluctuate
    each month.


    You can carry out your own calculations using the Azure pricing calculator, which
    will account for the commit tiers, retention, and provide a combined cost for
    both Log Analytics and Microsoft Sentinel. Go to this URL and modify the settings
    to see the different pricing: https://azure.microsoft.com/en-us/pricing/calculator/.'
