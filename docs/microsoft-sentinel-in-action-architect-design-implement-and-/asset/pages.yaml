- pgno: 317
  md: 'Click on the **Configure UEBA** button to activate and configure Entity behavior.
    When you do so, you will be taken to the **Entity behavior configuration** page,
    as shown in the following screenshot. First, you must enable Entity behavior:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_317_0.png)


    Figure 10.2 – Entity behavior configuration


    To enable Entity behavior, move the slider under *Step 1* to the **On** position.
    Once you have done that, the data sources under *Step 2* will be enabled.


    Select any of the data sources that you want to use with Entity behavior. It is
    recommended that you select all of them so that you can get the best results.


    If there are some data sources listed under the **After connecting the following
    data sources you will be able to enable them for entity behavior analytics** section,
    this means that the data connectors aren''t enabled to ingest that type of data.
    Enable the data connector if possible and then come back to this screen to select
    those data sources.


    > **Note**

    > When you are enabling these data sources, they may provide you with the option
    to enable them in Entity behavior, right from the **Data connector** page.


    Once you have selected all the data sources, click the **Apply** button to start
    using those data sources in Entity behavior.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'You now have your data flowing into Entity behavior. Next, we will look at
    how you can use this data in your investigations.


    # Overview of the Entity behavior page


    There are a few ways to get to the Entity behavior page:


    +   - When looking at the Entities tab of the incident''s View full details page

    +   - When looking at a specific entity''s information on the incident graphical
    investigation screen and then clicking on the View full details button

    +   - Selecting the Entity behavior link via the Microsoft Sentinel navigation
    menu


    The main difference between these three ways is that the first two will take you
    directly to the entity''s details page, while the third will take you to the main
    screen of Entity behavior, as shown in the following screenshot. Note that some
    of the white space on the screen has been removed:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_318_0.png)


    Figure 10.3 – Entity behavior main screen


    > **Note**

    > At the time of writing, only the Account, Hosts, and IP Address entity types
    can be viewed on the Entity behavior screen. Others may be added in the future.


    Let''s look at each of these sections in more details.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# The header bar


    The header bar is located at the top of the page and contains useful links, such
    as the timeframe to look for data, configuring Entity behavior, customizing the
    entity page, and providing feedback, as shown in the following screenshot:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_319_0.png)


    Figure 10.4 – Entity behavior header bar


    The timeframe dropdown for determining how far back to look for data should be
    familiar to you by now as it is used almost everywhere in Microsoft Sentinel.
    Use this drop-down to determine how far to look for the data, keeping in mind
    that the further you look back, the longer it will take for the data to show up.


    The Entity behavior settings link will take you to a page where you can find what
    data sources to ingest, as described in the previous section.


    The Customize entity page (Preview) link will take you to a page where you can
    add queries to run against the entities, as well as view out-of-the-box ones.
    See the Creating Entity behavior queries section of this chapter for more information.


    The Guides & Feedback link will open a new pane that contains more information
    about Entity behavior and will allow you to send feedback to Microsoft.


    # The search section


    The search section will allow you to search for entities. This is the one place
    where you can find information regarding those items that are not entities associated
    with an incident.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'If you start typing in the search text box, suggestions will start to show
    up below it, as shown in the following screenshot. You can select any of those
    suggestions to see the information about them. As you can see, it will suggest
    any of the entity types as you perform your search:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_320_0.png)


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_320_1.png)


    Figure 10.5 – Entity behavior search


    Clicking on any of the entries listed will take you to the entity details page
    described in the Overview of the Entity behavior details page section of this
    chapter.


    # Entities with alerts


    At the bottom of the screen are those entities that have the largest number of
    alerts. It shows how many alerts each entity has, as shown in the following screenshot.
    You can click on any of the entities to go to the details page for that entity:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_320_2.png)


    Figure 10.6 – Entities with alerts'
  merge: -1
  img_proc: true
- pgno: 321
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 322
  md: 'If the entity type is an account, there will be information from Azure Active
    Directory, including its email address and contact information. An IP address
    would show information including the geolocation data, log activity, and which
    hosts this IP address was connected to.


    Regardless of what type of entity is being shown, they will all have an Entity
    link, which provides a link directly to this page with the entity already selected,
    as well as an Investigate button, which will take you into the graphical investigation
    portion, which is used for incidents. However, instead of having the incident
    shown with all its entities, the entity will be shown with all its alerts:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_322_0.png)


    Figure 10.8 – Entity link and the Investigate button


    As you can see, this section will provide a lot of information regarding the identity
    of the entity. Use this section to make sure that the entity you are viewing is
    the one that you want to investigate. You can also use it to determine which one
    you are looking at if you are coming in from any of the incident screens.


    # Notable events


    This section is a major part of the entity’s information. It will show not only
    the alerts that this incident is associated with but also other activities. As
    described in the next section, Creating Entity behavior queries, you can even
    add custom activity queries.


    While the actual information shown will depend on the entity type being viewed,
    the format of the information will be the same. The following screenshot shows
    a detailed view of this section:'
  merge: -1
  img_proc: true
- pgno: 323
