- pgno: 112
  md: "# Understanding STIX and TAXII\n\nThe MITRE Corporation is a not-for-profit\
    \ company that provides guidance in the form of frameworks and standards to assist\
    \ with the development of stronger cybersecurity controls; the STIX language and\
    \ TAXII protocol are some examples of this development effort.\n\nThese two standards\
    \ were developed by an open community effort, sponsored by the US Department of\
    \ Homeland Security (DHS), in partnership with The MITRE Corporation. These are\
    \ not software products, but standards that products can use to enable automation\
    \ and compatibility when sharing TI information with your security community and\
    \ business partners.\n\nAs per the description provided by MITRE: *STIX is a collaborative\
    \ community-driven effort to define and develop a standardized language to represent\
    \ structured cyber threat information.* The STIX language was developed to ensure\
    \ threat information can be shared, stored, and used in a consistent manner to\
    \ facilitate automation and human-assisted analysis. You can read more about the\
    \ STIX standard here: https://stixproject.github.io/.\n\nThe TAXII protocol was\
    \ developed to provide support for TI feeds from OpenSource Intelligence (OSINT)\
    \ and TIP supporting this standard protocol and STIX data format. You can read\
    \ more details about the TAXII protocol here: https://www.mitre.org/sites/default/files/publications/taxii.pdf.\n\
    \nMicrosoft has developed a connector to enable integration with services using\
    \ the TAXII protocol, enabling the ingestion of STIX 2.0 threat indicators for\
    \ use in Microsoft Sentinel.\n\n> **Public previews**\n> \n> Due to the nature\
    \ of agile development and an evergreen cloud environment, Microsoft makes new\
    \ features available first through private previews to a select few reviewers\
    \ and then releases the feature to public preview to allow wider audience participation\
    \ for feedback. Your organization needs to determine whether it is acceptable\
    \ to use preview features in your production tenants or restrict access to only\
    \ a development/testing environment. At the time of writing, the TAXII data connector\
    \ is in public preview. You can check the list of available data connectors in\
    \ your Microsoft Sentinel tenant to see whether it is currently available.\n\n\
    In the next chapter, we will review the options for intel feeds and choose which\
    \ ones are right for your organization's needs."
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Choosing the right intel feeds for your needs


    With Microsoft Sentinel, you can import TI from multiple sources to improve the
    ability of a security analyst to identify and prioritize known threats and IoCs.
    When configured, several optional features become available within the following
    Microsoft Sentinel tools:


    +   - **Analytics**: Provides the ability to include the ThreatIntelligenceIndicator
    field to ensure the analytics rule can match log events to identified domains,
    email accounts, file hashes, IP addresses, or URLs.

    +   - **Workbooks**: There is a new workbook created to show the volume, type,
    and confidence level of the TI that is ingested into Microsoft Sentinel and how
    many alerts were generated from analytics rules that match your threat indicators.

    +   - **Hunting**: Like analytics rules, enabling TI provides the hunting queries
    the capability of comparing log events to TI information, allowing security investigators
    greater ability in their hunting scenarios.

    +   - **Notebooks**: Notebooks are enabled for guided hunting with integrated
    TI, which enables analysts and security investigators to look for anomalies and
    hunt for malicious behavior.


    There are several options available to gain access to TI feeds, and you may choose
    to generate your own indicators based on specific information gathered through
    internal IT investigations; this allows you to develop a unique list of indicators
    that are known to be specific to your organization. Depending on your industry
    and region, you may choose to share these with partner organizations and communities
    to gain specific information related to healthcare, government, energy, and so
    on.


    You can choose to leverage direct integration with the **Microsoft Graph Security
    tiIndicator** API, which contains Microsoft''s own TI, gathered across their vast
    internet services landscape (such as Azure, Office 365, Xbox, and Outlook).


    To achieve the broadest range of intelligence, it is recommended that you also
    obtain TI feeds from opensource platforms, such as the following:


    +   - The MISP opensource TIP

    +   - MineMeld by Palo Alto Networks

    +   - Any that are based on the MITRE STIX/TAXII standards'
