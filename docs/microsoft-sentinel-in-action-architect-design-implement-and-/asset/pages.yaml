- pgno: 106
  md: 'The following solutions may be considered as an alternative for long-term storage,
    outside of Log Analytics:


    +   - **Azure Blob Storage**: You can create a query in Azure Monitor to select
    the data you want to move from the Log Analytics workspace and point it to the
    appropriate Azure storage account. This allows for filtering of the information
    by type (or select everything), and only moving data that is about to come to
    the end of its life, which is the limit you have set for data retention in the
    Log Analytics workspace. Once you have the query defined, you can use **Azure
    Automation** to run PowerShell and load the results as a CSV file, then copy to
    **Azure Blob Storage**. With this solution, data can be stored for up to 400 years!
    For further information, see this article: https://docs.microsoft.com/en-us/azure/azure-monitor//powershell-samples.

    +   - **Azure Data Explorer (ADX)**: The most common method of using extended
    storage and archive of additional security data is Azure Data Explorer, which
    enables up to 100 years of extended storage. With this solution, you can gain
    great optimization of both the storage and compute required to ingest, catalog,
    analyze, and present the information, all using the same **Kusto Query Language
    (KQL)** queries you are using in Microsoft Sentinel. When configuring this service,
    you can choose between storage-optimized and compute-optimized implementation
    depending on the need of the security team that will carry out the investigations.
    During quiet times, you can optimize for storage retention, then when you need
    to carry out in-depth investigations you can increase the compute capacity on
    demand to ensure responsive search queries. There is an average cost saving of
    one-tenth of the price to store this data in Microsoft Sentinel. You can use the
    online calculator for your own value calculations: https://dataexplorer.azure.com/AzureDataExplorerCostEstimator.html.


    As you can see, there are several options available to store the data in alternative
    locations, both for extended archive/retention and for additional analysis with
    alternative tools. We expect Microsoft will increase the number of options available.'
  merge: -1
  img_proc: true
