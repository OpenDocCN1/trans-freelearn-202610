- pgno: 138
  md: 'In the following screenshot, a simple query was entered and run. The query
    was entered in the query window, and you can see that the results are shown below
    it:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_138_0.png)


    Figure 5.3 – Executed query


    There is a lot more you can do with the ADX, so feel free to play around with
    it. Now that you understand how we are going to run the queries and view the results,
    let''s look at some of the various commands KQL has to offer.


    # Introduction to KQL commands


    Unlike SQL, the query starts with the data source, which can be either a table
    or an operator that produces a table, followed by commands that transform the
    data into what is needed. Each command''s output can be passed into the next command
    by using the pipe ( | ) delimiter.


    What does this mean? If you are familiar with SQL, you would write a statement
    such as Select * from table to get the values from the table. The same query in
    KQL would just be table, where table refers to the name of the log. It is implied
    that you want all the columns and rows. Later, we will discuss how to minimize
    what information is returned.


    We will only be scratching the surface of what KQL can do here, but it will be
    enough to get you started writing your own queries so that you can develop queries
    for Microsoft Sentinel.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'The following table provides an overview of the commands, functions, and operators
    we will be covering in the rest of this chapter:


    | Type | Name | Description |

    |---|---|---|

    | Tabular Operators | print | Prints the results of a query |

    |  | search | Searches for specific data throughout the logs |

    |  | where | Filters a table to the subset of rows that satisfy a comparison |

    |  | take/limit | Returns up to the specified number of rows |

    |  | count () | Returns the number of records in the input record set |

    |  | summarize | Produces a table that summarizes the content of the selected
    columns |

    |  | extend | Creates calculated columns and appends them to the result set |

    |  | project | Selects the columns to include |

    |  | distinct | Produces a table with the distinct combination of the provided
    columns of the input table |

    |  | sort/order | Sorts the rows of the input table into order by one or more
    columns |

    |  | join | Merges the rows of two tables to form a new table by matching the
    values of the specified column(s) from each table |

    |  | union | Takes two or more tables and returns the rows of all of them |

    |  | render | Displays the output in a chart, including pie, bar, and line charts,
    among others |

    | Query Statements | let | Creates variables |

    | Scalar Functions | ago() | Subtracts the given timespan from the current UTC
    clock time |

    | String Operators | operators | Not a command but a discussion of operators to
    use with the where command |'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Again, this is just a brief overview of the commands available to you when
    using KQL. There are a lot more commands you can use, including some that add
    machine learning capabilities to your queries.


    > **Note**

    > For a complete list of all the KQL commands and more examples, go to https://docs.microsoft.com/en-us/azure/kusto/query/index.


    Let''s start looking at the various commands in more detail in the following sections.


    # Tabular operators


    A tabular operator in KQL is one that can produce data in a mixture of tables
    and rows. Each tabular operator can pass its results from one command to another
    using the pipe delimiter. You will see many examples of this throughout this chapter.


    # The print command


    The print command will print the results of a simple query. You will not be using
    this in your KQL queries, but it is useful for trying to figure out how commands
    work and what output to expect.


    A simple print command such as print "test" will return a single row with the
    text test on it.


    # The search command


    As we stated earlier, to search using KQL, you just need enter the table name
    in the editor, rather than in SQL where you use the select command. This will
    return all the columns and all the rows of the table, up to the maximum your application
    will return.


    So, in the ADX, if you enter StormEvents in the search window and click Run, you
    will see a window like the one shown in the following screenshot. Note that there
    are a lot more rows available; the following screenshot just shows a small sample:'
