    There is also a section called Tags that, when expanded, will show you the tags
    that are used when grouping the tables. The current entries are Solution and Category.
    If you see multiple tags of the same type, that means the table will show up under
    multiple solutions or categories.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'You can also expand a single table to see all the columns that make up the
    table, as well as the data type of the column. In the following screenshot, the
    **Event** log was expanded. You can see the various columns that make up the log
    and to the left of the name is an icon that shows the data type: an italic t for
    text, and a pound sign, #, for number. There is also a clock for date/time, B
