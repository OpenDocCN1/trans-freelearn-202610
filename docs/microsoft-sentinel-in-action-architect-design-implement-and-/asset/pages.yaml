- pgno: 270
  md: '# Parameter types


    There are seven different parameter types:


    +   - Text

    +   - Drop down

    +   - Time-range picker

    +   - Resource picker

    +   - Subscription picker

    +   - Resource-type picker

    +   - Location picker


    Each works differently and can have additional fields show up in the New Parameter
    pane when selected. For instance, the Text type is very basic and will show a
    textbox for input, while the Drop down type will show the KQL window so that its
    values can be populated from a query; there will be a new field asking whether
    multiple selections can be made. These are discussed as follows:


    +   - Text: This is the basic parameter type. It will allow you to enter text—for
    instance, an email address—that can then be used to filter other queries.

    +   - Drop down: The Drop down type allows you to enter a KQL query, or a JSON
    string, to provide the choices for the dropdown. This type will also have five
    additional fields:


    | Name | Description |

    |---|---|

    | Allow multiple selections | If selected, the user can select more than one entry
    from the dropdown. |

    | Limit multiple selections | If selected, this will set the upper limit to how
    many items a user can select from the dropdown. Another field will show where
    the upper limit number can be entered. |

    | Delimiter | If multiple entries are allowed to be selected, this is the delimiter
    that will be used to distinguish one entry from another. |

    | Quote with | If multiple entries are allowed to be selected, this is the character
    that will wrap each entry at the beginning and end of that entry. |

    | Include in the drop down | If the Any one checkbox is selected, then this parameter
    will not be used to filter. |'
  merge: -1
  img_proc: true
- pgno: 271
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 272
  md: '# The Previews section


    The second part of the New Parameter blade, at the bottom of the screen, shows
    a preview of how the variable will be displayed and how to use the variable in
    code. The following screenshot shows a parameter with no values filled in:


    Previews

    When editing, your parameter will look like this:

    <unnamed>: Enter value

    When not editing, your parameter will look like this:

    <unnamed>: <unset>

    When replaced in a query or text item, {<unnamed>} will become:

    {<unnamed>} ==> `

    {<unnamed>:label} ==> <unset>

    {<unnamed>:value} ==> "


    Figure 8.34 – New Parameter screen – Previews section


    The last part is very important as it shows how to use the variable in code. This
    is the parameter name, not the display name, surrounded by brackets, { }.


    # Links/tabs


    The links/tabs step allows you to either display links in different formats, or
    tabs. This allows you to open a new website to show more information, show details
    about a selected cell, or display different tabs.


    When you click on the Add links/tabs button, a new step will be added, as follows:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_272_0.png)


    Figure 8.35 – New links/tabs step'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'This screen will allow you to add, edit, delete, or change the order of the
    links that you have added. Keep in mind that as far as workbooks are concerned,
    tabs are links that are displayed differently.


    The **Update Links** button will update the links with any modifications that
    have been made during the edit process. The **Style** dropdown will change how
    the links will be displayed in the list. The following table shows how the various
    styles will affect how the links are shown:


    | Display Name | Sample |

    |---|---|

    | Bullet List | • First Link

    • Second Link

    • Third Link |

    | List | First Link

    Second Link

    Third Link |

    | Paragraph | First Link Second Link Third Link |

    | Navigation | First Link | Second Link | Third Link |

    | Tabs | First Link Second Link Third Link |


    Table 8.5


    The rest of the header buttons are as follows:


    ![](img/387db4214c5424f3a9b9dfa5ccc56a9d_273_0.png)


    Figure 8.36 – Links/tabs step header buttons'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'The header buttons are discussed as follows, from left to right:


    +   - The **Copy** button will create a duplicate of the selected link.

    +   - The **Insert** button will insert a blank row above the selected row to
    allow for a new link to be created.

    +   - The **Move Up** and **Move Down** buttons will allow a link to be moved
    up and down in the list, respectively.

    +   - The **Move to Top** and **Move to Bottom** buttons will move the link to
    the top or to the bottom of the list, respectively.

    +   - The **Delete** button will delete the link.


    Let''s look at how to add a new link.


    # Adding a new link


    To add a new link, start entering information in the blank row shown in the list.

    The different fields are described as follows:


    +   - **Text before link**: Information entered into the **Text before link**
    textbox will be shown before the actual link. This field will not show if the
    selected **style** is **Tabs**.

    +   - **Link text**: The **link text** is the actual text of the URL that will
    be shown.

    +   - **Text after link**: Information entered into the **Text after link** textbox
    will be shown after the actual link. This field will not show if the selected
    **style** is **Tabs**.

    +   - **Action**: This is the action that will be performed when the link is selected.
    There are many different entries to choose from, but for this chapter, we will
    only look at **Url**, **Set a parameter value**, and **Scroll to a step**. Depending
    on which value you select, there may be a button or textbox showing up on the
    **Settings** field to provide more information, but a brief description of these
    fields is given in the following table:'
  merge: -1
  img_proc: true
- pgno: 275
  md: <!-- no content -->
  merge: -1
