- pgno: 25
  md: '7. **IoT and Industrial Control Systems:** ICS are usually operated and maintained
    in isolation from the corporate environment, known as the **Information Technology/Operational
    Technology (IT/OT)** divide. These are highly bespoke systems that may have existed
    for decades and are not easily updated or replaced. The networks and devices may
    be highly sensitive to any latency or attempts to scan; instead, the recommended
    approach is passive monitoring of network traffic.


    The reference to IoT is different, yet similar; in these systems, there will be
    a lot of small devices that collect data and control critical business functions
    without working on the same network. Some of these devices can be smart to enable
    automation; others are single-use (vibration or temperature sensors). The volume
    and velocity of data that can be collected from these systems can be very high.
    If useful information can be gained from the data, then consider filtering the
    information before ingesting it into Microsoft Sentinel for analysis and short-
    or long-term retention.


    8. **Private Cloud Infrastructure:** This may be hosted in local server rooms,
    a specially designed data center, or hosted with a third-party provider. The technologies
    involved in this component will include storage, networks, internal firewalls,
    and physical and virtual servers. The data center has been the mainstay of many
    companies for the last 2-3 decades, but most are now transforming into hybrid
    solutions, combining the best of cloud (public) and on-premises (private) solutions.
    The key consideration here is how much of the log data you can collect and transfer
    to the cloud for Microsoft Sentinel ingestion. We will cover data connectors more
    in *Chapter 3, Managing and Collecting Data.*


    Active Directory is a key solution that should also be included in this component.
    It will be extended to public cloud infrastructure (component 09) and addressed
    in the *Privileged Access Management* section (component 10). The best defense
    for Azure Active Directory is to deploy the Microsoft Defender for Identity solution,
    which Microsoft developed to specifically protect Active Directory domain controllers.


    9. **Public Cloud Infrastructure:** These solutions are now a mainstay of most
    modern IT environments, beginning either as an expansion of existing on-premises
    virtualized server workloads, a disaster recovery solution, or an isolated environment
    created and maintained by the developers. A mature public cloud deployment will
    have many layers of governance and security embedded into the full life cycle
    of creation and operations. This component may include **Infrastructure as a Service
    (IaaS), Platform as a Service (PaaS), and Software as a Service (SaaS)** services;
    each public cloud service provider offers its own security protections that can
    be integrated into Microsoft Sentinel.'
  merge: -1
  img_proc: true
