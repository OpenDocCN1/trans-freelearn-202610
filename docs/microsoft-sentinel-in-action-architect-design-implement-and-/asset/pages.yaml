- pgno: 158
  md: '# Scalar functions


    Scalar functions take a value and perform some sort of manipulation on it to return
    a different value. They are useful for performing conversions between data types,
    looking at only part of the variable, and performing mathematical computations.


    # The ago() function


    The ago() function is used to subtract a specific timespan from the current UTC
    time. Remember that all times stored in the Log Analytics log are based on UTC
    time, unless they are times in a custom log that are specifically designed not
    to be. Generally, it is safe to assume that the times stored are based on UTC
    time.


    If I wanted to look for events in StormEvents that ended less than an hour ago,
    I would use the following command. Note that this command doesn''t return any
    values as the times stored are from 2007:


    ```

    StormEvents

    | where EndTime > ago(1h)

    ```


    In addition to using h for hours, you can also use d for days, among others.


    # String operators


    String and numeric operators are used in the comparisons of a where clause. We
    have already seen ==, which is a string equals operator. As we stated earlier,
    this is a case-sensitive operator, meaning that ABC == ABC is true but ABC ==
    abc is false.


    > Note

    > You may need to carry out a case-insensitive comparison using =~. In this case,
    ABC =~ abc returns true. While there are commands to change text to uppercase
    or lowercase, it is good practice to not do that just for a comparison but rather
    do a case-insensitive comparison.


    Some other string operators that can be used are as follows:'
  merge: -1
  img_proc: true
- pgno: 159
  md: '| Operator | Description | Case Sensitive | Example (returns True) | Example
    (returns False) |

    |---|---|---|---|---|

    | == | Equal | Yes | "One" == "One" | "One" == "ONE" |

    | =~ | Equals | No | "one" =~ "ONE" | "one" =~ "two" |

    | contains_cs | Right-hand string is in left-hand string | Yes | "ONEtwo" contains_cs
    "ONE" | "ONEtwo" contains_cs "one" |

    | contains | Right-hand string is in left-hand string | No | "ONEtwo" contains
    "one" | "ONEtwo" contains "three" |

    | startswith_cs | Right-hand string is at the beginning of the left-hand string
    | Yes | "ONEtwo" startswith_cs "ONE" | "ONEtwo" startswith_cs "one" |

    | startswith | Right-hand string is at the beginning of the left-hand string |
    No | "ONEtwo" startswith "one" | "ONEtwo" startswith "two" |

    | endswith_cs | Right-hand string is at the end of the left-hand string | Yes
    | "oneTWO" endswith_cs "TWO" | "oneTWO" endswith_cs "two" |

    | endswith | Right-hand string is at the end of the left-hand string | No | "oneTWO"
    endswith "two" | "oneTWO" endswith "one" |

    | in | Left-hand string is in one of the right-hand list of strings | Yes | "one"
    in ("alpha", "beta","one") | "ONE" in ("alpha", "beta","one") |

    | in~ | Left-hand string is in one of the right-hand list of strings | No | "ONE"
    in ("alpha", "beta","one") | "TWO" in ("alpha", "beta","one") |


    Table 5.2


    In addition, by placing ! in front of any command, that command is negated. For
    example, !contains means does not contain and !in means not in.


    For a complete list of operators, go to https://docs.microsoft.com/en-us/azure/data-explorer/kusto/query/datatypes-string-operators.'
  merge: -1
  img_proc: true
