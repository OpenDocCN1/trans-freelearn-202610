- pgno: 223
  md: '# Query scheduling


    Run query every *


    Lookup data from the last *


    # Alert threshold


    Generate alert when number of query results *


    # Event grouping


    Configure how rule query results are grouped into alerts


    Group all events into a single alert


    Trigger an alert for each event (preview)


    # Suppression


    Stop running query after alert is generated


    Figure 7.17 – Create new rule, Set rule logic page continued


    The following table provides further details for each entry:


    | Field Name | Description |

    |---|---|

    | Run query every | Select the numeric value and the time span (minutes, hours,
    or days) to determine how often the query runs. While there are no additional
    charges for running a query often, consider how often the suspicious activity
    would occur and how quickly you need to know about it. It is tempting to run every
    query as quickly as possible, but that can lead to alert overload. Do you need
    to be notified as quickly as possible of the low-severity event of someone entering
    the wrong password 5 times in 10 minutes?


    This is the rule frequency when viewing the rule on the Overview page. |'
  merge: -1
  img_proc: true
- pgno: 224
  md: '| Field Name | Description |

    |---|---|

    | **Lookup data from the last** | Select the numeric value and the time span (minutes,
    hours, or days) to determine how far back in time to look for data. Usually, this
    will be the same as the rule frequency.


    This is the rule period when viewing the rule on the **Overview** page. |

    | **Stop running query after alert is generated** | This determines whether the
    rule will be paused after an alert has been generated. This can either be on or
    off. If on, elect the numeric value and the time span (minutes or hours) to determine
    how long the rule will be paused before reactivating. This can be very useful
    when testing a new query. You want to be able to validate that it is working correctly
    and that the alert generated, and possibly the incident, is accurate before continuing.
    So, by setting this, you can get one new incident that you can investigate to
    make sure the query is accurate. |

    | **Alert threshold** | This determines how many times the rule finds a positive
    result before an alert gets generated. This can be set to **Is greater than**,
    **Is less than**, **Is equal to**, or **Is not equal to** a numeric value. This
    can be used to limit the number of incidents that get generated to avoid overload.
    For instance, you may set the number of times a failed login occurs before generating
    an incident much higher than you would set something like a new account being
    granted admin rights.


    This is the alert threshold when viewing the rule on the **Overview** page. |

    | **Event grouping** | By default, every event found when this rule''s query runs
    will be placed into the same alert. There may be times when you will want each
    event to have its own alert (for instance, to keep the various entities separated).
    If that is the case, select the **Trigger an alert for each event (preview)**
    radio button. It should be noted that only the first 20 events will get their
    own alert and then the 21st alert will include all the events. |

    | **Suppression** | Enable this if you want to stop running the analytic rule
    after it has created an alert. This is especially useful for testing purposes
    to make sure that all the data is correct before having this run and potentially
    create false positives. |'
  merge: -1
  img_proc: true
