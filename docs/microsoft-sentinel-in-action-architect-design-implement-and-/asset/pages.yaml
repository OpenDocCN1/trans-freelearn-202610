- pgno: 265
  md: 'One other useful entry is **Hidden**. Selecting this will cause the column
    to not display in the grid. There may be times when you will need to have the
    column around, but do not want to show it. Set the column''s renderer to **Hidden**
    for this to happen. It''s outside the scope of the book to go into more detail
    on how to use these different renderers but look at the **Azure AD Sign-in logs**
    workbook to get an idea of how to use **Heatmap** and **Spark line**.


    Beneath the header bar is the **Log Analytics workspace Logs Query** area. This
    is where you enter your KQL query to be run. On the right side of this screen
    are three icons, as shown here:


    Query help


    Figure 8.27 – Query step results buttons


    The preceding list of buttons is explained as follows:


    +   - The **Query help** icon will open a new tab and will take you to a page
    discussing how to write KQL queries.

    +   - The icon next to it will open the **Logs** page, in the same tab, and load
    the query you have in the **Log Analytics workspace Logs Query** area. This can
    be useful if you are having issues with your query and need to figure out what
    the problem is.

    +   - The last icon will only show up once you have run a query. It will allow
    you to export your results into Excel for further processing.


    The area directly under the **Log Analytics workspace Logs Query** area is where
    your results will show up. They will be displayed according to the value selected
    in the **Visualization** dropdown. Run the Heartbeat query we used earlier, and
    then change the values in the **Visualization** dropdown to see how this area
    changes.


    # Metric


    The metrics step allows you to view metrics on different Azure resources. This
    step type is not used that much in Microsoft Sentinel, so we will not discuss
    it in this chapter. To get more information on how to use the metrics step, refer
    to https://docs.microsoft.com/en-us/azure/azure-monitor/app/usage-workbooks#adding-metrics-sections.'
