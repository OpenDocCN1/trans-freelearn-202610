- pgno: 65
  md: '3. Starting with the Essentials listing at the top of the page, we can review
    the following items:


    +   A. **Resource group**: The resource group where the workspace resides.

    +   Selecting [change] will allow you to move to another resource group.

    +   B. **Status**: The status of the workspace should show **Active**.

    +   C. **Location**: The Azure location where the workspace resides.

    +   D. **Subscription name**: The subscription this resource is associated with.

    +   Selecting [change] will allow you to move to another subscription.

    +   E. **Subscription ID**: The unique GUID for the preceding subscription, which
    is useful when calling Microsoft for technical support.

    +   F. **Workspace name**: The name of the Log Analytics workspace.

    +   G. **Workspace ID**: The GUID for the workspace, which is also useful when
    calling Microsoft for technical support.

    +   H. **Pricing tier**: The pricing tier for the workspace.

    +   I. **Management services**: View the activity log for the workspace.

    +   J. **Access control mode**: This determines how users are granted permission
    to access the information in this workspace. Refer to the following section for
    more information.


    The previous sections described the various ways that you can create a new Log
    Analytics workspace to use with Microsoft Sentinel. This can be done either through
    the Azure portal or programmatically using either PowerShell or CLI commands.
    Once the workspace has been created, we next need to ensure that access is restricted
    to only those users who need to access it.


    # Managing permissions for the workspace


    Before we connect and store data in the workspace and enable Microsoft Sentinel
    to carry out analytics on the data, let''s review the options to secure access
    to this new resource.

    Azure provides three main levels of access to resources:


    +   - **Owner**: Has the highest level of access to resources

    +   - **Contributor**: Can create and modify resources, but cannot grant or revoke
    access

    +   - **Reader**: Can view all resources'
  merge: -1
  img_proc: true
- pgno: 66
  md: <!-- no content -->
