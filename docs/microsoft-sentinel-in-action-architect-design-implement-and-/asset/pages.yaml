- pgno: 72
  md: 'That is the Microsoft Sentinel **Overview** page. It is a great place to go
    to get an overview of what is going on in your Microsoft Sentinel environment
    and is the landing page of Microsoft Sentinel. While *Figure 2.14* shows lots
    of data, when you first create a Log Analytics workspace, it will be empty. The
    next section will explain how to start getting data into your workspace.


    # Connecting your first data source


    Before we dig into the details of the Microsoft Sentinel data connectors (see
    *Chapter 3, Managing and Collecting Data*), we will review how Log Analytics enables
    connectivity to a range of different sources to receive data to store and analyze.
    Some of the data source options include the following:


    +   - Application and OS diagnostics

    +   - Virtual machine log data

    +   - Azure storage account logs

    +   - Azure Activity log

    +   - Other Azure resources


    In this section, we will show you how you can enable log collection from Azure
    virtual machines.


    # Obtaining information from Azure virtual machines


    To have the **virtual machines** (VMs) populate a Log Analytics workspace, they
    need to be connected to it. This is done from the Log Analytics workspace **Overview**
    page.


    There are two different ways to get to this page. First, you can select **Log
    Analytics** in the Azure portal navigation menu and then select the appropriate
    workspace. The second, and perhaps easier, way is to select **Settings** from
    the Microsoft Sentinel navigation menu and then select **Workspace settings**
    from the options at the top of the page, as shown in the following screenshot:'
