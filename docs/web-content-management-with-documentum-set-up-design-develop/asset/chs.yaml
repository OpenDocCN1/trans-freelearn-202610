  \n### 6.2 安装 Web Publisher Server Files 和 DocApp\n\nDocbase 就绪后，我们可以在新 Docbase 上安装\
  \ Web Publisher Server Files，以便 Documentum WebPublisher DocApp 安装并可供我们使用。\n\n> 许多人将“Web\
  \ Publisher Server Files”安装与应用程序服务器安装混淆。请注意，Web Publisher 安装包含两个组件：\n> \n> - Web\
  \ Publisher 安装\n> - Web Publisher Server Files 安装\n\n\nWeb Publisher 安装通常在托管应用程序服务器的单独机器上进行。另一方面，Web\
  \ Publisher Server Files 安装在 Content Server 机器上。\n\n请注意，Web Publisher Server Files\
  \ 安装是必需的，因为我们将使用 Web Publisher Web 客户端输入内容，并且需要默认的 Web Publisher 对象来工作。默认的 Web Publisher\
  \ 对象可从 WebPublisher DocApp 获得，该 DocApp 在 Content Server 主机上安装 Web Publisher Server\
  \ Files 时进行配置。\n\nDocumentum 建议以 Content Server 安装所有者的身份安装 Web Publisher Server\
  \ Files 和 DocApp。在 Windows 上，Web Publisher Server Files 安装在 Content Server 上的以下位置：\n\
  \n```\n%DM_HOME%, for example: C:\\Documentum\\product\\<product version>\n```\n\
  \n### 6.2.1 Web Publisher Server Files 包含什么？\n\n'Web Publisher Server Files' 包含\
  \ wcm 和 wcmMethods JAR 文件，其中包含一些由 Documentum Java 方法服务器在 Content Server 上运行的 Java\
  \ 方法。这些方法调用从 Web Publisher 工作流活动中需要执行的类。\n\n### 6.2.2 WebPublisher DocApp 包含什么？\n\
  \n'WebPublisher DocApp' 包含 Web Publisher 与相关 Docbase 配合工作所需的一些基础 Web Publisher 对象。\n\
  \n例如：\n- Web Publisher 作业和方法\n- Web Publisher 工作流模板\n- Web Publisher 生命周期\n- Web\
  \ Publisher 对象类型\n- WebPublisher 用户默认 ACL\n- Web Publisher 组：内容作者、内容管理员、Web 开发人员和管理员\n\
  - Web Publisher 角色：wcm_content_author_role、wcm_content_manager_role、wcm_web_developer_role\
  \ 和 wcm_administrator_role\n\n## 6.3 开始安装\n\n首先从 Documentum 网站下载 web_Publisher_Server_Files_5.2.5_SP2_windows.exe。\n\
