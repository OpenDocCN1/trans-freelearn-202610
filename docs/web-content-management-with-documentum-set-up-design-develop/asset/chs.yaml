  图 20.5：选择工作流模板


  单击 OK。


  - 3. 如图 20.6 所示，为工作流实例提供简要描述以通过其名称（例如：workflow_Testing）识别它。


  您还可以为工作流任务选择优先级并为路由内容（在 Documentum 中称为 change set）提供生效日期。请注意，change set 的生效日期会覆盖路由内容的现有生效日期。


