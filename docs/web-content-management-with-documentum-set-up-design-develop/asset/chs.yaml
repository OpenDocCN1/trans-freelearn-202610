  \nDocumentum 通过 XML 配置文件中的 two_way_dctm attr 元素提供此功能，我们现在将看到。\n\n## 18.6 使用双向属性提取\n\
  \n让我们创建一个模板文件，允许内容创建者在文档的属性屏幕中输入 subject 属性。我们将创建一个自定义 XML Application，将此值填充到模板文件的\
  \ SUBJECT 元素中。\n\n- 1. 在 Web Publisher 中创建并导入一个模板（例如 Two_way_Template.xml）并将其附加到具有默认生命周期的\
  \ dm_document 对象类型。以下是模板文件 Two_way_Template.xml：\n- 2. 为上述模板创建一个 Rules 文件（例如 Two_Way_TemplateRule.xml）并将模板文件与此\
  \ Rules 文件关联。以下是 Rules 文件 Two_Way_TemplateRule.xml：\n- 3. 创建一个 XML 配置文件 TwoWayXMLApp.xml，并在模板\
  \ TwoWayXMLApp.xml 的 Category 字段中提供 XML 配置文件名称（不带 .xml）。这将设置模板的 a_category 属性。TwoWayXMLApp.xml\
  \ 文件如下所示：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<INFORMATION>\n<SUBJECT/>\n\
  </INFORMATION>\n```\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<rules>\n\
  \    <tagcontent tag_name=\"SUBJECT\">\n        <textline charlength=\"150\" instruction=\"\
  Enter a subject here\" label=\"Subject:\">\n        </textline>\n    </tagcontent>\n\
  </rules>\n```\n\n## 自动属性提取 (APE)\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE application SYSTEM \"config_5.2.dtd\">\n<application>\n    <name>TwoWayXMLApp</name>\n\
  \    <app_pattern>\n        <element>INFORMATION</element>      <!-- Specifying\
  \ the XML Root element INFORMATION -->\n    </app_pattern>\n    <map_rules>\n  \
  \      <xml_content_rule>\n            <element_selection_pattern>\n           \
  \     <element>INFORMATION</element>\n            </element_selection_pattern>\n\
  \            <variables>      <!-- Defining variable to map values in object attribute\
  \ subject -->\n                <variable>\n                    <name>subjectValue</name>\
  \      <!--Getting the value of SUBJECT template element -->\n                 \
  \   <content_of_element>\n                        <element_selection_pattern>\n\
  \                            <element>SUBJECT</element>\n                      \
  \  </element_selection_pattern>\n                    </content_of_element>\n   \
  \             </variable>\n            </variables>\n            <object_type>dm_document</object_type>\
  \      <!-- Specifying the object type -->\n            <metadata>\n           \
  \     <two_way_dctmattr>\n                    <name>subject</name>    <!-- Saving\
  \ value in subject attribute-->\n                    <var name=\"subjectValue\"\
  />\n                </two_way_dctmattr>\n            </metadata>\n            <make_entity/>\n\
  \        </xml_content_rule>\n    </map_rules>\n</application>\n```\n\n在这段代码中，<two_way_dctmattr>\
  \ 设置单个 Documentum 对象属性和映射的模板 XML 文件元素的值。\n\n在这里，我们已通过变量 subjectvalue 将 subject 属性的值映射到内容创建者在模板文件中的\
  \ SUBJECT 元素中输入的值。\n\n> 对于具有重复值的 Documentum 对象属性，请在您的 XML 配置文件中使用 <two_way_dctmattr_repeating>\
  \ 元素。\n\n- 4. 按照我们为之前的 XML 应用程序所做的方式，完成配置此 XML 应用程序所需的所有步骤。\n\n### 18.7 测试双向属性提取\
