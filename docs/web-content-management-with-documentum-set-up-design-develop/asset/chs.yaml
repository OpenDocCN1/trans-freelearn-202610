  \ Map 在运行时创建的 folder abc 中。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_265_0.png)\n\
  \n图 16.18：根据指定的重复属性值在运行时创建的文件夹\n\n## Documentum 5.3 更新\n\nDocumentum Web Publisher\
  \ 版本 5.3 为您提供创建和配置多个 Folder Maps 的功能。\n\nFolder Mapping 的内容远不止本章所讨论的。Documentum\
  \ Web Publisher 手册详细介绍了 Folder Mapping，您可以阅读它们以更好地理解该主题。\n\n## 16.4 摘要\n\nWeb Publisher\
  \ Folder Map (FolderMap.xml) 是一个 XML 文件，由规则组成，这些规则根据内容文件的匹配 Docbase 属性将创建的内容文件映射到\
  \ Web Cabinets 中的指定文件夹位置。\n\n在本章中，我们最初在示例产品制造商公司的背景下讨论了 Folder Maps 以及其网站的结构。我们继续研究了\
  \ Folder Map 文件中的各种 XML 元素以及 Web Publisher 中 Folder Maps 的一些限制。\n\n最后，我们查看了多个配置\
  \ Folder Maps 的示例，使用各种属性匹配机制、单属性和重复属性，以及运行时的动态文件夹映射。\n\n\n\n## 17 使用指令文件\n\n## 使用指令文件\n\
  \n在运行中的 Documentum 中最常见的问题之一是模板的更改。在任何给定时间，都有一定量的内容是从模板文件创建的。如果由于某些业务需求，该模板文件的结构需要更改，使用旧版本模板已创建的现有内容会怎样？\n\
  \n模板是否仍能正常运行？新的模板结构是否会自动反映在现有内容中？您是否必须重新创建所有现有内容，以便使其符合更新后的模板结构？\n\n极其相关的问题——简短的回答是：不！Documentum\
  \ 开发者预见到了这种情况，并在 Web Publisher 中加入了指令文件，以帮助您根据更新后的模板文件更新现有内容的结构。\n\n让我们考虑一个小例子。\n\
  \n想象一个模板文件，内容创建者用它来为其网站创建常见问题解答（FAQ）部分。该模板在编辑器中有以下字段：\n\n- 一个可重复的块，允许为模板字段输入多个值\n\
  - 问题字段\n- 答案字段\n\n假设内容创建者基于上述模板结构创建内容，为多个问答集提供值。然而，经过一段时间后，业务团队意识到他们需要在创建内容时根据相关性对问题进行标记。简而言之，他们希望在从同一模板创建内容时将问题分类为非常重要、重要和中等。\n\
  \n在这种情况下，我们只能采取以下两种方法：\n\n- 通过包含所有必需字段（如问题、答案和相关性顺序）制作单独的模板，并使用此新模板重新创建所有现有内容。\n\
  - 通过引入名为相关性顺序的第三个字段修改现有模板，并手动编辑/更新所有现有内容。\n\n通常，大多数业务用户会采用第二种方法，原因如下：\n\n- 它节省了他们维护同一模板两个版本的开销。\n\
  - 它节省了他们重新创建内容的精力。\n\nWeb Publisher 指令文件通过提供可配置的 XML 元素帮助我们实现这一点，这些元素可根据更新后的模板结构更新现有的\
  \ XML 内容文件，而无需我们手动编辑/更新现有内容文件。\n\n指令文件可以对现有 XML 内容文件执行各种功能，如图 17.1 所示。\n\n| 执行的功能\
  \ | 指令文件元素 |\n|---|---|\n| 插入新的 XML 元素 | `<insert-element>` |\n| 删除现有的 XML 元素 |\
  \ `<delete-element>` |\n| 向 XML 元素插入属性 | `<insert-attribute>` |\n| 从 XML 元素删除属性\
  \ | `<delete-attribute>` |\n| 更新现有 XML 元素的值 | `<update-element-value>` |\n\n图 17.1：指令文件的一些\
  \ XML 元素\n\nDocumentum 开发者网站提供了一个用于创建指令文件的向导工具。请访问以下 URL 了解更多详情：\n\nhttp://customernet.documentum.com/developer/tippage.htm\n\
  \n您可以下载此工具并按照 Instruction File Builder PDF 中提到的说明进行操作，以避免手动创建指令文件。\n\n> 请注意，本书中的指令文件是使用标准文本/XML\
  \ 编辑器创建的，而不是使用指令文件构建器工具。\n\n### 17.1 指令文件的限制\n\n在深入了解其具体用法之前，值得提及指令文件的一些限制。\n\n\
  为了更新现有 XML 元素的值，使用 <update-element-value> 指令文件元素。然而，前提是正在更新的 XML 元素不应包含任何子元素。\n\n\
  例如，如果使用 <update-element-value> 更新 <BOOK> XML 元素，则 <BOOK> 元素不应有任何子元素。以下 <BOOK> 元素无法更新：\n\
  \n```\n<BOOK>\n  <AUTHOR></AUTHOR>\n</BOOK>\n```\n\n类似地，<update-element-value> 仅在正在更新的\
  \ XML 元素不为空时才能正常工作。简而言之，元素中存在一些文本（可能包括空白）。以下 <BOOK> 元素无法更新：\n\n```\n<BOOK></BOOK>\n\
  ```\n\n然而，以下 XML 元素是 <update-element-value> 的有效候选：\n\n```\n<BOOK>ABC</BOOK>\n```\n\
  \n对于熟悉 XML/XSL 的人来说，相对路径在指令文件中不起作用。XML 路径语言（XPath）//（双斜杠）表达式在使用指令文件时失败，应作为规则避免使用。\n\
  \n在以下条件下，XML 文件无法使用指令文件进行更新：\n\n- 如果 XML 文件处于其生命周期的暂存状态\n- 如果 XML 文件处于签出状态\n- 如果\
  \ XML 文件是更改集的一部分\n\n指令文件始终对文件进行版本控制（即为 XML 文件提供新的版本号），即使指令未对相关 XML 文件的结构进行任何更改。此外，文件将被置于其生命周期的\
  \ WIP 状态。\n\n例如，让我们考虑一个场景，其中在指令文件中使用 <delete-attribute> 指令从 XML 元素 <BOOK> 中删除属性\
  \ bookname。\n\n如果 <BOOK> XML 元素不包含名为 bookname 的属性，<delete-attribute> 指令仍会对 <BOOK>\
  \ XML 元素起作用，并且当它找不到名为 bookname 的属性时，仍会将 XML 文件保存为新版本。\n\n### 17.2 指令文件示例\n\n让我们举几个例子来了解指令文件在\
  \ Documentum 中是如何工作的。\n\n### 17.2.1 使用 <delete-element> 从 XML 文件中删除 XML 元素\n\n让我们通过一个非常简单的例子来说明，其中内容是从一个简单的模板\
  \ XML 文件创建的，后来模板文件中的一个 XML 元素被移除。现有内容通过使用 <delete-element> 指令的简单指令文件进行更新。\n\n1.\
  \ 根据以下结构创建模板文件（original_Template.xml）及其关联的规则文件（original_TemplateRules.xml）：\n\n\
  模板文件 original_Template.xml：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
  <PRODUCTINFO>\n  <NAME/>\n  <SHORTDESC/>\n  <COST/>\n  <PRODUCTTYPE/>\n</PRODUCTINFO>\n\
  ```\n\n规则文件 Original_TemplateRules.xml：\n\n```\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<rules>\n  <tagcontent tag_name=\"NAME\">\n    <textline instruction=\"\
  Please enter a name\" label=\"Product name:\" required=\"Y\">\n    </textline>\n\
  \  </tagcontent>\n  <tagcontent tag_name=\"SHORTDESC\">\n    <content instruction=\"\
  please provide a short description for product\" label=\"Product Description:\"\
  \ lines=\"5\">\n    </content>\n  </tagcontent>\n  <tagcontent tag_name=\"COST\"\
  >\n    <textline instruction=\"Please enter cost in dollars\" label=\"Cost:\">\n\
  \    </textline>\n  </tagcontent>\n  <tagcontent tag_name=\"PRODUCTTYPE\">\n   \
  \ <choice instruction=\"Please choose a type\" label=\"Product Type:\" values=\"\
  Type A,Type B,Type C\">\n    </choice>\n  </tagcontent>\n</rules>\n```\n\n2. 使用模板文件\
  \ Original_Template.xml 创建两组内容并为其命名（参见图 17.2 和 17.3）。例如：Testing1_Original_Template.xml\
  \ 和 Testing2_Original_Template.xml。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_269_0.png)\n\
  \n图 17.2：从模板 Original_Template.xml 创建的第一个内容\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_270_0.png)\n\
  \n图 17.3：从模板 Original_Template.xml 创建的第二个内容\n\n您可以通过 Web Publisher 中的文件 | 导出查看已创建内容的\
  \ XML 结构，并将内容 XML 文件导出到访问 Web Publisher 的本地机器上。\n\n以下是上述创建的内容的内容 XML 文件。这些文件是从模板文件\
  \ original_Template.xml 版本 1.0 创建的：\n\n```\nTesting1_Original_Template.xml:\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<PRODUCTINFO>\n    <NAME>Prod A</NAME>\n\
  \    <SHORTDESC>\n        <p>\nThis is of type A\n        </p>\n    </SHORTDESC>\n\
  \    <COST>$ 120</COST>\n    <PRODUCTTYPE>Type A</PRODUCTTYPE>\n</PRODUCTINFO>\n\
  ```\n\n```\nTesting2_Original_Template.xml:\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<PRODUCTINFO>\n    <NAME>Prod B</NAME>\n    <SHORTDESC>\n        <p>\nThis is\
  \ of type B\n        </p>\n    </SHORTDESC>\n    <COST>$ 175</COST>\n    <PRODUCTTYPE>Type\
  \ B</PRODUCTTYPE>\n</PRODUCTINFO>\n```\n\n\n\n3. 通过移除 <COST/> XML 元素来修改原始模板 XML\
  \ 文件。\n以下是修改后的模板文件（版本 2.0）original_Template.xml。\n\n```\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<PRODUCTINFO>\n  <NAME/>\n  <SHORTDESC/>\n  <PRODUCTTYPE/>\n</PRODUCTINFO>\n\
  ```\n\n4. 使用任意 XML 编辑器，创建一个指令文件（Delete_Element_Instruction.xml），该文件通过移除其包含的 <COST>\
  \ XML 元素来更新内容 XML 文件。\n以下指令文件（Delete_Element_Instruction.xml）可在此类场景中使用：\n\n```\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<instructions xmlns=\"http://www.documentum.com/wp\"\
  \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
  http://www.documentum.com/wp instructions.xsd\">\n  <delete-element>\n    <path>/PRODUCTINFO</path>\n\
  \    <nodename>COST</nodename>\n    <comments>Deleting COST element</comments>\n\
