  \n在 WDK 中看到一个非常简单的配置示例后，我们现在将更进一步，在 WDK 中开发我们自己的自定义组件。我们将在 Web Publisher 中创建一个新的菜单选项，点击它将带我们进入用于创建新闻文章内容的自定义屏幕。\n\
  \n图 24.6 显示在菜单选项 File | New 下新增的自定义菜单选项 Create New News Article。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_395_0.png)\n\
  \n图 24.6：用于创建新闻文章内容的新的菜单选项\n\n当你点击菜单选项 Create New News Article 时，会显示一个用于创建新闻文章内容的自定义屏幕，如图\
  \ 24.7 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_395_1.png)\n\n图 24.7：用于创建新闻文章内容的自定义屏幕\n\
  \n让我们现在逐步通过这个示例来理解如何使用 WDK 框架创建我们自己的自定义组件：\n\n- 1. 将 \\wp\\wp\\config\\app 中的 menubar_component.xml\
  \ 复制到 Web Publisher 服务器上的以下位置：\\wp\\custom\\config\\app。\n  （毋庸置疑，在复制 XML 文件之前，你需要在\
  \ custom 文件夹内创建适当的文件夹结构。）\n\n修改 custom 文件夹中的 menubar_component.xml 文件，如下所示：\n\n\
  ```\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n\n<!--**************************************************************-->\n\
  <!-- Component xml file for menubar Component                     -->\n<!--**************************************************************-->\n\
  <!-- File            menubar_component.xml                        -->\n<!-- Author\
  \          Gaurav Kathuria                               -->\n<!-- Description \
  \    Extends the menubar component to display the  -->\n<!--                 the\
  \ new custom menu option                    -->\n<!-- Created on      Nov 28, 2005\
  \                                  -->\n<!--****************************************************************-->\n\
  \n<config version='1.0'>\n    <scope>\n        <desc>\n            menubar component\
  \ : Extends the menubar component to display the\n            new custom menu option\n\
  \        </desc>\n        <!-- Component Contract -->\n        <!-- <component id=\"\
  menubar\"\n            extends=\"menubar:webtop/config/menubar_component.xml\">\
  \ -->\n        <component id=\"menubar\"\n            extends=\"menubar:wp/config/app/menubar_component.xml\"\
  >\n\n        <!-- Component Layout -->\n        <pages>\n            <start>/custom/app/custom_menubar.jsp</start>\n\
  \        </pages>\n\n        <!-- NLS properties file -->\n        <nlsbundle>com.newsarticle.app.wpMenuBarNlsProp</nlsbundle>\n\
  \    </component>\n    </scope>\n</config>\n```\n\n请注意，在 <component> XML 元素内，我们已从\
  \ wp/config/app/menubar_component.xml 扩展而来，并且根据突出显示的行，指向了我们的自定义 JSP 页面：custom_menubar.jsp。\n\
  \n除了指向自定义 JSP 页面外，我们还创建了自定义 NLS 属性文件，用于在 wpMenuBarNlsProp.property 文件中存储菜单选项标签的自定义字符串。\n\
  \n- 2. 将 \\wp\\wp\\app 中的 menubar.jsp 复制并重命名为 custom_menubar.jsp，然后复制到 Web Publisher\
  \ 服务器上的以下位置：\\wp\\custom\\app。\n\n修改 custom 文件夹中的 custom_menubar.jsp 文件，如下所示：\n\n\
  ```\n<dmf:menu name='file_menu' nlsid='MSG_FILE' width='50'>\n<dmf:menu name='file_new_menu'\
  \ nlsid='MSG_NEW'>\n<dmf:actionmenuitem dynamic='genericnoselect'\nname='file_new_webhtml_template'\n\
  nlsid='MSG_NEW_WEBHTML_TEMPLATE' action='createwebhtmltemplate'\nshowifinvalid='false'\
  \ showifdisabled='false'/>\n<dmf:actionmenuitem dynamic='generic' name='file_newcontent'\n\
  nlsid='MSG_NEW_CONTENT'\n```\n\n```\naction='newcontent' showifinvalid='false' showifdisabled='true'/>\n\
  \n<!-- Customized to add a new menu option -->\n<dmfx:actionmenuitem dynamic='generic'\
  \ name='custom_new_news'\nnlsid='NLS_NEW_NEWS_MENU'\naction='newnewsarticlelink'\
  \ showifinvalid='false' showifdisabled='true'/>\n\n<dmfx:actionmenuitem dynamic='generic'\
  \ name='create_changeset'\nnlsid='MSG_NEW_CHANGESET'\naction='newchangeset' showifinvalid='false'\
  \ showifdisabled='false'/>\n```\n\n请注意，前两行对应于菜单选项 File 和 New。我们需要在该菜单选项下引入新的菜单项\
  \ Create New News Article。\n\n```\n<dmfx:actionmenuitem dynamic='generic' name='custom_new_news'\n\
  nlsid='NLS_NEW_NEWS_MENU'\naction='newnewsarticlelink' showifinvalid='false' showifdisabled='true'/>\n\
  ```\n\n我们以与其他菜单选项在 JSP 中添加的方式类似引入这些行。\n\nnlsid NLS_NEW_NEWS_MENU 是新引入菜单选项的属性字符串名称。该属性字符串的实际值将在\
  \ wpMenuBarNlsProp.properties 文件中提供。\n\n当用户选择此新菜单选项时要启动的操作在 action 属性中指定为 newnewsarticlelink。这是\
  \ WDK 框架启动的操作配置的 ID。我们将在本章后面为 ID newnewsarticlelink 创建一个 Action 配置 XML 文件。\n\n-\
  \ 3. 将 \\wp\\strings\\com\\documentum\\wp\\app 中的 wpMenuBarNlsProp.properties 复制到\
  \ Web Publisher 服务器上的以下位置：\\wp\\custom\\strings\\com\\newsarticle\\app\n\n修改 custom\
  \ 文件夹中的 wpMenuBarNlsProp.properties 文件，如下所示：\n\n```\n##################################################\n\
  #\n# Author      Gaurav Kathuria\n# Description WebPublisher menu NLS Properties\
  \ File\n# Date        Nov 28th, 2005\n#\n##################################################\n\
  NLS_INCLUDES=com.documentum.wp.app.wpMenuBarNlsProp\n\n# Generic Action Name\n\n\
  # File menu\nNLS_NEW_NEWS_MENU=Create New News Article\n##################################################\n\
  #$\n#\n##################################################\n```\n\n我们在修改后的菜单栏 NLS\
  \ 属性文件中使用字符串 NLS_INCLUDES 来包含来自所包含 NLS 属性文件的所有键值对：\n\n```\ncom.documentum.wp.app.wpMenuBarNlsProp\n\
  ```\n\n这有两个目的：\n\n- 在整个 WDK 应用程序中保持字符串值的一致性\n- 减少属性文件中大量 NLS 字符串的单独包含\n\n- 4. 在\
  \ Web Publisher 服务器上 \\wp\\custom\\config\\newsarticle 的以下位置创建一个新的 Action 配置 XML\
  \ 文件 custom_news_article_action.xml。\n\n新创建的 Action 配置文件的详细信息如下所示：\n\n```\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n\n<!--**************************************************-->\n\
  <!---->\n<!-- Action xml file for creating new news article Action -->\n<!---->\n\
  <!--**************************************************-->\n<!-- File custom_news_article_action.xml\
  \ -->\n<!-- Author Gaurav Kathuria -->\n<!-- Description This Action launches custom\
  \ new news -->\n<!-- article creation screen -->\n<!---->\n<!-- Created on Nov 28,\
  \ 2005 -->\n<!---->\n<!--**************************************************-->\n\
  \n<config version='1.0'>\n <scope>\n  <action id=\"newnewsarticlelink\">\n   <desc>\n\
  \     New news article Action : Check the condition to create\n     the news article\
  \ Link\n   </desc>\n   <!-- Component Contract -->\n   <params>\n    <param name=\"\
  objectId\" required=\"true\"></param>\n    <param name=\"folderPath\" required=\"\
  true\"></param>\n   </params>\n\n   <!-- Precondition class -->\n   <preconditions>\n\
  \    <precondition class=\"com.documentum.web.formext.action.RolePrecondition\"\
  >\n     <role>administrator</role>\n    </precondition>\n   </preconditions>\n\n\
  \   <!-- Component Name -->\n   <execution class=\"com.documentum.web.formext.action.LaunchComponent\"\
  >\n    <arguments>\n     <argument name=\"component\" value=\"new_news_article\"\
  ></argument>\n    </arguments>\n    <container>dialogcontainer</container>\n   </execution>\n\
  \  </action>\n </scope>\n</config>\n```\n\nNote that the ID provided to this action\
  \ configuration newnewsarticlelink is the same as we had provided for the attribute\
  \ action in the custom_menubar.jsp file.\n\n```\n<precondition\nclass=\"com.documentum.web.formext.action.RolePrecondition\"\
  >\n```\n\nHere we have designated that only a user with administrator role has access\
  \ to this particular action. This is termed as a precondition in WDK terminology\
  \ and is implemented by the default com.documentum.web.formext.action.RolePrecondition\
  \ class.\n\nOn clicking the menu option Create New News Article, this action needs\
  \ to launch a particular component that will correspond to the custom screen we\
  \ discussed for creating new news articles.\n\n```\n<argument name=\"component\"\
  \ value=\"new_news_article\"></argument>\n```\n\nThis line designates the component\
  \ ID of the launched component as new_news_article. The subsequent step will talk\
  \ about creating this component configuration XML file and associated JSP, Java,\
  \ and property files.\n\n- 5. Create a new component configuration XML file custom_news_article_component.xml\
  \ at the following location in Web Publisher server: \\wp\\custom\\config\\newsarticle.\n\
  \nThe details of the newly created component configuration file are shown below:\n\
  \n```\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\" standalone=\"no\"?>\n\n<!------------------------------------------------------------------------------->\n\
  <!----------------------------------------------------------------------------->\n\
  <!-- Component xml file for New Navigation Link Component                     -->\n\
  <!----------------------------------------------------------------------------->\n\
  <!------------------------------------------------------------------------------->\n\
  <!----------------------------------------------------------------------------->\n\
  <!-- File              custom_news_article_component.xml                     -->\n\
  <!-- Author            Gaurav Kathuria                                        -->\n\
  <!-- Description       New News Article Component                            -->\n\
  <!--                    allows creating new news article                      -->\n\
  <!--                    and properties file.                                  -->\n\
  <!-- Created on        Nov 28, 2005                                           -->\n\
  <!----------------------------------------------------------------------------->\n\
  <!------------------------------------------------------------------------------->\n\
  \n<config version='1.0'>\n    <scope>\n        <component id=\"new_news_article\"\
  >\n            <desc>\n                New News Article Component: Provides UI for\
  \ creating new news\n                articles\n            </desc>\n           \
  \ <!-- Component Contract -->\n            <params>\n                <param name=\"\
  objectId\" required=\"true\"></param>\n                <param name=\"folderPath\"\
  \ required=\"true\"></param>\n            </params>\n```\n\n```\n<!-- Component\
  \ Layout -->\n<pages>\n<start>/custom/library/newsarticle/custom_newnewsarticle.jsp</start>\n\
  </pages>\n\n<!-- Component Behaviour -->\n<class>com.newsarticle.content.NewNewsArticle</class>\n\
  \n<!-- NLS properties file -->\n<nlsbundle>com.newsarticle.content.NewNewsArticleNlsProp</nlsbundle>\n\
  </component>\n</scope>\n</config>\n```\n\nWe have provided the ID for this component\
  \ as new_news_article as we discussed in the last step for launching via Action\
  \ configuration.\n\n```\n<start>/custom/library/newsarticle/custom_newnewsarticle.jsp</start>\n\
  ```\n\nIn this line, we have specified the custom JSP for this component as custom_newnewsarticle.jsp,\
