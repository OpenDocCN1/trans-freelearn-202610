- '## 20 测试自定义工作流


  一旦您创建、验证、安装并在 Web Publisher 中使自定义工作流模板可用后，您可以通过从自定义工作流模板创建的工作流实例发送内容来测试它。


  图 20.1 描述了我们在上一章中创建的自定义工作流中的活动序列。在测试工作流步骤时，这应作为很好的帮助。


