  \ 3.10 中所示的方法 wcmLifecycleMonitor。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_56_1.png)\n\
  \nFigure 3.10: 'Monitor_Lifecycles' 作业调用的 'wcmLifecycleMonitor' 方法\n\n## Documentum\
  \ 5.3 更新\n\nDocumentum 5.3 版本引入了名为 Job Sequences 的新功能。这允许您配置多个作业按顺序（按指定顺序）在指定时间运行。\n\
  \n就目前而言，这就是我们希望在 Documentum 高级概念部分涵盖的全部内容。随着您阅读以下章节，您将更好地理解这些概念。\n\n如果您对术语感到困惑或想再次复习概念，请将本章视为随时可查阅的参考。随时需要时都可以返回本章。\n\
  \n## 3.13 摘要\n\n本章我们涉及了一些 Documentum 的高级概念。\n\n我们讨论了 DMCL（Documentum 客户端库）作为客户端库，充当客户端与\
  \ Content Server 之间的 RPC 层。另一方面，DFC（Documentum 基础类）作为 DMCL 的包装器，公开 API 以执行基本内容管理功能。DFC\
  \ 由一组 Java 接口和类组成，并内置了 Business Objects Framework（BOF），可帮助您通过扩展和自定义内容管理功能创建可重用的业务组件。\n\
  \n我们继续讨论了 Documentum WDK（Web 开发工具包），它作为一个框架，由多个服务器端可重用组件组成，使我们能够快速开发和部署需要与 Content\
  \ Server 通信的基于 Web 的应用程序。\n\nWebtop 是 Documentum 基于 WDK 提供的参考 Web 客户端实现。Web Publisher\
