  \ 11.2 设计和创建对象类型的自定义属性\n\n一旦您设计了自定义对象类型，它将继承其超类型对象类型的所有属性（属性）。您可能还想额外创建一些在超类型中不可用且仅特定于此对象类型的自定义属性。\n\
  \n对于我们的 cust_newsarticle 对象类型，我们可能需要以下自定义属性（例如）：\n\n- 新闻文章一句话摘要\n- 用于标识该新闻文章是否为新闻稿的标志\n\
  - 新闻文章优先级：在所有已发布的新闻文章中，该文章需要在网站上按什么顺序显示。\n- 新闻文章编辑者和审批者姓名\n\n最好准备一个小表格来设计自定义对象类型的属性，并根据您的业务特定需求填写表格的相应列。让我们在我们的示例网站的上下文中讨论这个问题（请参见图\
  \ 11.16）：\n\n| 属性名称 | 属性标签 | 数据类型 | 长度 | 单值/重复 | 必填 | 值 |\n|---|---|---|---|---|---|---|\n\
  | cust_news_summary | 新闻文章摘要 | String | 200 | 单值 | 是 | 无 |\n| cust_news_is_press_rel\
  \ | 是否为新闻稿？ | Boolean | 0 | 单值 | 否 | 无 |\n| cust_news_display_order | 显示顺序 | Integer\
  \ | 0 | 单值 | 否 | 条件：\n- 如果新闻文章为新闻稿，则为 1,3,5,7\n- 如果新闻文章不是新闻稿，则为 0,2,4,6 |\n| cust_news_edit_approvers\
  \ | 编辑者/审批者 | String | 100 | 重复 | 否 | 无 |\n\n图 11.16：属性设计表\n\n应非常仔细地设计属性，因为在属性创建并检入\
  \ Docbase 后，以下内容无法修改：\n\n- 属性名称\n- 属性数据类型\n- 属性是单值还是重复\n- 属性长度（只能增加）\n\n## 11.3\
  \ 向对象类型添加属性\n\n在 DocApp 中选择相关对象类型并选择 插入 | 属性。我们将首先通过为对象类型 cust_newsarticle 创建属性\
  \ cust_news_summary 来举例说明。\n\n如图 11.17 所示，在新的属性创建屏幕中填写相关字段。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_154_0.png)\n\
  \n图 11.17：属性常规选项卡\n\n### 11.3.1 属性名称\n\n与对象类型名称类似，属性名称也有某些限制需要严格遵守。图 11.18 列出了属性名称的一些限制。\n\
  \n### 11.3.2 对象类型属性名称的限制\n\n| 限制 |\n|---|\n| 应为小写 |\n| 不应以空格、单引号 (') 或数字开头 |\n|\
  \ 不应以 'dm_'、'i_'、'r_' 和 'a_' 开头，因为 Documentum 在其对象属性命名方案中内部使用这些前缀 |\n| 不应使用与 Documentum\
  \ 中以下保留字匹配的名称：'from'、'where' 和 'select' |\n\n图 11.18：属性命名约定限制\n\n### 11.3.2.1 标签\n\
  \n标签字段将是对象属性页中显示在此属性字段旁边的实际标签。您也可以用 HTML 标记包围文本，以在属性页中显示属性时获得视觉效果。我们将在第 24 章中更详细地介绍这一点。\n\
  \n### 11.3.2.2 数据类型\n\n从“数据类型”下拉列表中为属性选择数据类型。下拉列表中显示的可用数据类型有：\n\n- Boolean\n- Integer\n\
  - String\n- ID\n- Time\n- Double\n\n### 11.3.2.3 长度\n\n长度字段仅对 String 数据类型的属性启用。请注意，使用\
  \ Application Builder 时，我们为字符串属性指定的最大长度为 2000。\n\n### 11.3.2.4 重复\n\n为了将属性指定为多值，可以选择“重复”复选框。如果未选中，则表示单值属性。\n\
  \n根据您的具体要求填写“常规”选项卡下显示的其他属性字段。在我们的例子中，我们已确定 cust_news_summary 属性为必填项（参见图 11.16 中的属性设计），因此我们选中了“属性不能为空”字段旁边的复选框。\n\
  \n在“高级”选项卡下（参见图 11.19），您可以指定客户端应用程序根据其属性值在 Docbase 中搜索对象的搜索参数。默认情况下，每个属性都是可搜索的。您可以通过取消选中图中显示的“可搜索”复选框来否定此条件。\n\
  \n### 11.3.2.5 默认搜索值\n\n您可以在使用客户端应用程序根据此特定属性搜索对象时，始终显示一些默认搜索值。\n\n### 11.3.2.6 允许的搜索运算符\n\
  \n您可以添加/删除客户端应用程序将用于根据所讨论属性的某些条件搜索 Docbase 对象的搜索运算符。\n\n\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_156_0.png)\n\
  \n图 11.19：属性高级选项卡\n\nDocumentum 提供了众多搜索运算符，例如：\n\n- 包含\n- 以...结尾\n- 大于\n- 是\n- 小于\n\
  \n## 11.3.2.7 输入掩码\n\n这是一个重要的字段，如果使用得当，可以发挥奇效。输入掩码字段可以作为对象属性的有用验证机制。\n\n例如，根据您的业务需求，您希望内容创建者为属性\
  \ cust_news_summary 提供仅 15 个字符长的字母数字值。以下属性中的输入掩码可以在无需任何脚本/编码的情况下实现所需条件：\n\n```\n\
  AAAAAAAAAAAAAAA\n```\n\n连续的十五个 A 表示只允许 A 类性质的 15 个字符，即字母数字。\n请参阅图 11.20，了解 Documentum\
  \ 提供的所有可用掩码字符和符号：\n\n| Symbol | Interpretation |\n|---|---|\n| A | 仅允许字母数字字符。即 a-z、A-Z\
  \ 和 0-9 |\n| # | 仅允许纯数字值。即 0-9 |\n| ? | 仅允许纯字母值。即 a-z 和 A-Z |\n| & | 允许任何 ASCII\
  \ 字符 |\n| U | 允许大写字母字符 |\n| L | 允许小写字母字符 |\n\n图 11.20：Documentum 中可用的掩码字符\n\n1.\
  \ 与我们在对象类型中看到的类似，在约束选项卡中（请参阅图 11.21），您可以使用 Docbasic 表达式为对象类型的属性值指定一致性检查。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_157_0.png)\n\
  \n图 11.21：属性约束选项卡\n\n2. 当您希望用户为属性选择一些预定义值时，值辅助功能非常有用。使用值辅助功能，您可以将属性字段转换为属性屏幕中的下拉列表（选择列表），用户在创建新对象时可以从中选择现有值。单击“添加默认值”按钮（请参阅图\
  \ 11.22）为属性添加值。默认“值辅助”弹出窗口显示（图 11.23）。\n\n这里值得一提的是，当属性的数据类型为 Boolean 时，值辅助功能不可用。在这种情况下，“添加默认值”按钮为灰色。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_158_0.png)\n\n图 11.22：属性值辅助选项卡\n\n您可以提供各个值，每行一个（按\
  \ Enter 键），并通过选中复选框“列表已完成....”将选择列表标记为完整。请参阅图 11.23 了解详情。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_159_0.png)\n\
  \n图 11.23：值辅助固定列表弹出窗口\n\n或者，您可以改选“查询”选项旁边的单选按钮，而不是“固定列表”选项（请参阅图 11.24）。这将允许您使用通过\
  \ DQL 查询的对象类型或 Documentum 中的注册表动态填充下拉列表的值。我们将在本章后面详细介绍这一点。现在，请不要关心“查询”选项如何用于查询注册表。对于\
  \ cust_news_summary 属性，我们不需要在下拉列表中显示任何预定义值。但是，对于 cust_news_display_order 属性，我们将查询注册表并详细介绍“查询”选项的使用。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_159_1.png)\n\n图 11.24：查询选项的值辅助弹出窗口\n\n\
  ## 11.3.2.8 条件值辅助\n\nDocumentum 通过允许开发人员根据某些属性值有条件地配置下拉值，进一步改进了值辅助功能。让我们通过一个快速示例来了解\
  \ Documentum 中条件值辅助的工作原理。\n\n在为属性提供默认“值辅助”后，“添加条件”按钮将被启用，如图 11.25 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_160_0.png)\n\
  \n图 11.25：使用条件值辅助\n\n单击“添加条件”按钮会显示如图 11.26 所示的值辅助子句弹出窗口。条件可以以 Docbasic 表达式的形式提供（如我们在创建对象类型时在约束选项卡中看到的）。输入的\
  \ Docbasic 表达式可以通过单击“检查语法”按钮进行验证。根据输入的 Docbasic 表达式（属性条件）的评估，将在弹出窗口的值辅助部分下为用户提供下拉列表。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_161_0.png)\n\n图 11.26：值辅助子句弹出窗口\n\n您可以通过以与输入第一个条件子句相同的方式提供额外的\
  \ Docbasic 表达式来提供额外的条件和子句。所有现有条件均以“如果...则...”子句的形式显示，如图 11.27 所示。\n\n它表示如果 title\
  \ 属性的值为字母，则下拉列表将显示值：A、B、C。\n\n如果 title 属性的值为数字，则下拉列表将显示值：1、2、3、4、5。\n\n如果没有满足任何条件，则下拉列表中显示的默认值是：1、2、3。\n\
  \n但是，请记住，由于 Docbasic 的限制，您不能在 Application Builder 中提供超过 35 条此类条件值辅助语句。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_162_0.png)\n\
  \n图 11.27：现有条件子句\n\n一个常见的需求是在下拉值中显示一些用户友好的文本，同时为应用程序读取和理解的每个值保存简短代码。\n\n在我们的示例中，我们可能希望用户在下拉列表中看到的值为“One、Two、Three”，而实际上在\
  \ Docbase 后台分别将其保存为 1、2 和 3。\n\n在“值映射”选项卡下，如图 11.28 所示，在“数据”列中输入 Docbase 值，并在“显示字符串”列中输入其映射的下拉显示值。\n\
  \n“显示字符串”下的值仅用于在下拉列表中视觉显示。“数据”列中的值将作为属性的值保存在 Docbase 中。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_163_0.png)\n\
  \n图 11.28：属性值映射选项卡\n\n在所有必要的选项卡中填写相关数据后，右键单击对象类型 cust_newsarticle（在左侧树窗格中）并选择选项“检入所选对象(s)”以将对象类型（连同其属性）检入\
  \ Docbase。这样做使新创建的属性在 Docbase 中可供应用程序使用。\n\n根据属性设计表 11.16 中的规范创建其他属性 cust_news_is_press_rel\
  \ 和 cust_news_edit_approvers。我们现在将通过创建属性 cust_news_display_order 如下，介绍使用查询选项的条件值辅助的示例。\n\
  \n> 您可能希望跳回第 3 章，在继续以下部分之前快速回顾我们之前关于注册表的讨论。\n\n## 11.4 使用 DQL 查询注册表以进行值辅助\n\n创建一个新属性\
  \ cust_news_display_order 并如 11.29 图所示填写“常规”选项卡。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_164_0.png)\n\
  \n图 11.29：cust_news_display_order 属性常规选项卡\n\n如果属性 cust_news_is_press_rel 的值为 true，则该属性需要显示下拉值：1、3、5、7；如果属性\
  \ cust_news_is_press_rel 的值为 false，则显示值：0、2、4、6。\n\n这可以通过条件值辅助和使用注册表来实现，如下所示：\n\n\
  1. 根据以下设计在底层 RDBMS 中创建表：\n  - **表名：** cust_values_table\n  - **列 1 (int)：** cust_odd_values\n\
  \  - **列 2 (int)：** cust_even_values\n\n将值插入两列，如图 11.30 所示：\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_165_0.png)\n\
  \n图 11.30：cust_values_table 数据库表\n\n2. 以管理员身份登录 Documentum Administrator 并通过以下 DQL\
  \ 查询注册 RDBMS 表 cust_values_table：\n\n```\nregister table dm_dbo.cust_values_table\
  \ (cust_odd_values int,cust_even_values int)\nupdate dm_registered_object set owner_table_permit=15\
  \ where object_name='cust_values_table'\nupdate dm_registered_object set group_table_permit=15\
  \ where object_name='cust_values_table'\nupdate dm_registered_object set world_table_permit=15\
  \ where object_name='cust_values_table'\n```\n\n请注意，这里 dm_dbo 是 Docbase 所有者的别名，而权限级别\
  \ 15 用于选择、插入、更新和删除权限。\n\n现在通过 DQL 查询编辑器在 Documentum Administrator 中发出以下 SELECT 查询，以确定注册表中的值是否返回：\n\
  \n```\nselect cust_odd_values, cust_even_values from dm_dbo.cust_values_table\n\
  ```\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_165_1.png)\n\n图 11.31：通过 DQL 查询注册表时显示的结果\n\
  \n\n\n图 11.31 所示的结果证明注册表已正确设置，并且可以通过 Application Builder 中的值辅助子句中的查询选项访问。\n\n3.\
  \ 转到“值辅助”选项卡并单击“添加默认值”按钮，以输入要为该属性显示的默认值集。\n\n选择“查询”单选按钮，并在文本框“请输入查询...”中输入以下 DQL\
  \ 查询（参见图 11.32）：\n\n```\nselect cust_odd_values, cust_even_values from dm_dbo.cust_values_table\n\
  ```\n\n这将在运行时评估注册表中可用的值并将结果集返回给客户端应用程序。请注意，Documentum 在运行时内部查询实际的底层 RDBMS 表，而不是注册表对象。\n\
  \n在“查询属性...”文本框中提供将用于填充下拉列表的注册表列名。我们将其设置为 cust_odd_values，因此如果未满足任何条件/子句，cust_news_display_order\
  \ 属性将在下拉列表中显示以下值：1, 3, 5, 7。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_166_0.png)\n\
  \n图 11.32：通过查询选项的默认值辅助\n\n填写完默认值辅助后，单击“添加条件”按钮并输入如图 11.33 所示的条件子句。如表 11.15 属性设计中所述，cust_news_display_order\
  \ 属性将在属性 cust_news_is_press_rel 的值为 true 时显示下拉值：1, 3, 5, 7，而在属性 cust_news_is_press_rel\
  \ 的值为 false 时显示值：0, 2, 4, 6。\n\n- 条件/子句：cust_news_is_press_rel = true\n- 提供显示数据的查询属性：cust_odd_values\n\
  - 条件/子句：cust_news_is_press_rel = false\n- 提供显示数据的查询属性：cust_even_values\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_167_0.png)\n\
  \n图 11.33：使用查询选项的值辅助子句弹出窗口\n\n4. 填写完所有必要选项卡中的相关数据后，在左侧树窗格中右键单击对象类型 cust_newsarticle，然后选择“签入所选对象(s)”选项以将对象类型（连同其属性）签入\
  \ Docbase。这样，新创建的属性 cust_news_display_order 即可在 Docbase 中供应用程序使用。\n\n新添加的属性 cust_news_summary、cust_news_is_press_rel、cust_news_display_order\
  \ 和 cust_news_edit_approvers 可以通过自定义默认的新内容页面添加到新的内容属性页面中。图 11.34 显示了新属性在实际场景中的外观。要完成此自定义所需的代码更改超出了本章的范围。我们将在第\
  \ 24 章讨论 WDK 配置时再研究这个问题。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_168_0.png)\n\
  \n图 11.34：属性页面中显示的新添加的属性\n\n## 11.5 $value() 关键字\n\n$value() 是一个重要的关键字，在设计条件值辅助时应考虑。让我们通过一个简单的示例来了解其使用方法和好处。\n\
  \n考虑一个属性 cust_name，它代表某些办公室员工姓名的下拉列表，例如 Tom、Harry 和 Chris，如图 11.35 所示。\n\n| cust_name\
  \ |\n|-----------|\n| Tom       |\n| Harry     |\n| Chris     |\n\n图 11.35：员工姓名表\n\
  \n另一个属性 cust_age 需要代表每个办公室工作人员的年龄下拉列表。根据 cust_name 中选择的姓名，需要填充 cust_age 中的值。\n\n\
  例如，代表办公室工作人员姓名和对应年龄的表如表 11.36 所示：\n\n| Name | Age |\n|------|-----|\n| Tom | 23\
  \ |\n| Harry | 45 |\n| Chris | 19 |\n\n图 11.36：员工姓名和年龄表\n\n可以建立如下的条件值辅助：\n\n```\n\
  If cust_name = \"Tom\"\nThen cust_age = 23\nElse If cust_name = \"Harry\"\nThen\
  \ cust_age = 45\nElse If cust_name = \"Chris\"\nThen cust_age = 19\nElse ...\n```\n\
  \n如果办公室工作人员人数接近 100 人？您会定义这么多条件语句吗？这既不是好的实现，Application Builder 也不支持这么多条件值辅助语句。\n\
  \n$value() 在这种情况下可以帮到你。让我们看看如何操作。\n\n设计一个注册表（例如 cust_employee_data），其列为 emp_name\
  \ 和 emp_age。用所有员工的实际值及其年龄填充底层表中的行。按如下方式为属性 cust_age 定义值辅助：\n\n```\nselect emp_age\
  \ from dm_dbo.cust_employee_data where emp_name = '$value(cust_name)'\n```\n\n得益于\
  \ $value()，在运行时 Documentum 会在 where 子句中替换属性 cust_name 的值，因此查询会返回正确的员工年龄，而无需编写多个条件语句！有趣且非常有用，不是吗？\n\
  \n现在我们已经创建了自定义对象类型和属性，我们可以扩展我们的新闻文章示例并创建新闻文章 Web 发布者模板（类似于 UI 中的“表单”），以便在创建内容时，在填写新闻属性页面后，用户可以提供实际的新闻文章内容。在此之前，让我们先创建一个自定义生命周期并将其附加到本章中创建的自定义对象类型。\n\
  \n## 11.6 摘要\n\n本章介绍了 Documentum 对象类型及其属性（属性）。我们详细介绍了如何使用 Documentum Application\
  \ Builder 工具在 Docbase 中创建对象类型。我们看到了对象类型命名约定的一些限制。\n\n然后我们看到了如何创建示例新闻文章对象类型并将其与 Documentum\
  \ 生命周期关联。\n\n在本章后半部分，我们设计了示例新闻文章对象类型的一些属性，并讨论了使用 Documentum Application Builder\
  \ 工具创建属性的详细步骤。\n\n我们介绍了值辅助的使用，用于为对象类型的属性显示预定义的数据集，以及如何根据某些条件有条件地显示不同的值。\n\n值辅助可以通过提供一组固定的硬编码数据或通过在运行时查询对象和注册表来使用。\n\
  \n我们讨论了如何在 Documentum 中创建注册表以及如何使用值辅助查询它们。\n\n我们以简要介绍 $value() 关键字如何帮助避免在值辅助中编写多个条件语句结束本章。\n"
- "## 12 创建生命周期、别名集和权限集\n\n在上一章中，我们为新闻文章对象创建了自定义对象类型和一些属性。现在让我们为新闻文章对象设计一个自定义生命周期，以便从新闻文章对象类型创建的实例（或内容对象）可以在将内容上线之前在各个生命周期阶段（如暂存（或审查）、审批等）之间移动。Documentum\
  \ 中的生命周期对象与一些相关对象（如别名集、权限集（ACL）等）相关联，建议快速浏览介绍性章节以回顾我们之前讨论的基础知识。\n\n总体而言，在设计生命周期时，您需要牢记三个重要组件：\n\
  \n- 生命周期用的别名集(s)\n- 生命周期流程中各个阶段的权限集（ACL）\n- 实际生命周期设计，如阶段、标签、预处理或后处理的任何脚本等。\n\n我们将在本章中通过非常简单的示例介绍这些内容，以便您获得一定的理解和舒适度，而这些理解和舒适度可以在软件项目中设计实时应用程序时进一步扩展和丰富。\n\
  \n### 12.1 生命周期中的别名集\n\n在生命周期的上下文中，别名集是一组别名，使生命周期能够在众多环境中移植。别名只不过是在给定上下文中称为别名名称的某些实际值的占位符或符号名称。别名值是别名名称的实际值。别名名称和值的配对构成一个别名，而一组这样的别名构成一个别名集。\n\
  \n想象一下，新闻文章的内容对象是由内容作者创建并由内容经理审阅的。在某个部门，内容作者可能是 Mr. X，内容经理可能是 Ms. Y。在另一个部门，内容作者和经理可能是不同的人，不一定是\
  \ Mr. X 和 Ms. Y。\n\n\n\nAn Alias Set comes in handy in such circumstances, helping\
  \ us design an application with symbolic names for content author/manager groups,\
  \ the actual values for which are resolved by the system at run time as per the\
  \ current context/environment.\n\nYou can specify multiple Alias Sets for a Lifecycle\
  \ and have one of them designated as the default Alias Set; the others are treated\
  \ as Additional Alias Sets. This is just the right time to discuss something called\
  \ the scope of an Alias within Documentum. The scope of an Alias is the context\
  \ in Documentum within which the system resolves the actual value for a given Alias\
  \ name.\n\nDocumentum recognizes the following scopes:\n\n- **生命周期作用域：** 生命周期对应的别名集。附加到特定生命周期的\
  \ Documentum 中的 SysObjects 有助于系统解析值。\n- **工作流作用域：** 附加到工作流流程模板的别名集在运行时通过查找工作流中所有执行者的实际值来解析，每当从给定的工作流流程定义启动工作流时。\n\
  - **会话作用域：** 特定 Docbase 会话（会话配置对象）的生命周期内的别名集有助于系统解析别名的实际值。\n- **用户作用域：** 用户作用域用于从在\
  \ Documentum 中创建给定用户和组时定义的别名集中解析别名值。\n- **系统作用域：** 此作用域用于解析为给定 Docbase 的服务器配置对象定义的别名集的别名名称的值。\n\
  \n每当内容对象附加到 Documentum 中的生命周期时，系统首先根据附加到生命周期对象的别名集评估所有别名值。这体现了别名集在生命周期上下文中的重要性。因此，在本章中，我们将首先学习如何为生命周期创建别名集，然后继续在各个生命周期阶段构建安全性（使用\
  \ ACL），最终创建完整的生命周期对象。\n\n## 12.2 创建别名集\n\n本节将详细介绍创建别名集涉及的步骤。\n\n在我们的自定义 DocApp TestDocApp\
  \ 中，选择菜单选项 Insert | Alias Set 以创建新的别名集。图 12.1 显示了空的别名集屏幕。为自定义别名集提供一个唯一名称以及简短描述以说明其用途。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_174_0.png)\n\n图 12.1：空白别名集屏幕\n\n要在别名集中添加新的别名，请单击\
  \ Add。单击此按钮将打开别名对象对话框，如图 12.2 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_174_1.png)\n\
  \n图 12.2：在别名集中添加新的别名\n\n在 Name 文本框中为别名提供名称。从 Type 下拉列表中选择别名类型。下拉列表中可用的别名类型有：\n\n\
  - Unknown\n- User\n- Group\n- User or Group\n- Cabinet Path\n- Cabinet or Folder\
  \ Path\n- Permissions Set\n\n根据所选的别名类型，单击省略号按钮 (...) 时，Value 字段中的值将被填充。\n\n如果希望系统在解析别名时提示别名的值，请选择\
  \ Prompt for value at installation 复选框。\n\nAlias Category 未被系统使用，但可用于对自定义应用程序的别名集进行分类。\n\
  \n可以提供简短描述来解释别名的意图/用途。单击 OK 按钮。\n\n在为别名集提供别名后，添加的别名将作为单独的行显示在别名集屏幕中，如图 12.3 所示。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_175_0.png)\n\n图 12.3：新创建的别名集\n\n选择 Documentum\
  \ Application Builder 左窗口窗格中显示的 Custom_AliasSet 别名集，右键单击并选择 Check in selected object(s)\
  \ 以将别名集签入 Docbase。\n\n## 12.3 创建权限集\n\n需要采取安全措施，以便在生命周期的不同阶段，只有处理内容对象的特定授权用户才能获得特定的权限或权利来操作内容。例如，我们的自定义生命周期有四个阶段：\n\
  \n- Start（内容创建时）\n- WIP（Work in progress 的缩写）\n- Staging（内容审核中）\n- Approved（内容最终审核并批准，准备在实时站点上显示）\n\
  \n您可以为每个生命周期阶段设计 ACL（访问控制列表或权限集）。例如，在生命周期的 Staging 阶段，管理员、内容管理员、内容作者和 Web 开发人员用户可以拥有\
  \ VERSION 权限，而内容所有者可以获得 WRITE 权限，其余用户（称为“world”）可以获得 READ 权限。\n\n请参阅第 3 章中关于 ACL\
  \ 的早期讨论，以快速了解 Documentum 中的基本和扩展权限级别及其语义。\n\n现在让我们为生命周期的 WIP 生命周期状态创建一个权限集模板（ACL），并相应地为其他生命周期状态创建\
  \ ACL。\n\n1. 在我们的自定义 DocApp TestDocApp 中，选择 Insert | Permission Set Template。为自定义权限集提供一些唯一名称（如\
  \ Custom WIP ACL）以及简短描述以说明其用途（参见图 12.4）。\n2. 选择第一个单选按钮 Show Alias-Sets in Application\
  \ 以在我们的自定义 DocApp 中选择一个别名集。选择第二个单选按钮 Show All Alias-Sets in Docbase 以从 Docbase 中现有的别名集中选择一个现有别名集。选择第三个单选按钮\
  \ Show Users and Groups 以直接从 Docbase 中所有现有组中选择一个组。如果选择了前两个单选按钮之一，则从别名名称中选择一个条目；如果选择了第三个单选按钮，则选择一个组名，并为涉及的每个实体提供基本和扩展权限。从\
  \ Permissions 下拉列表中选择七个基本权限级别之一，并根据需要选择扩展权限级别的复选框（如果有）。Documentum 中共有五个扩展权限级别。因此，您可以单击\
  \ Add to Set 按钮将权限包含在 ACL 中，或单击 Remove from Set 按钮删除已添加的权限。请注意，当您开始创建新的权限集时，Documentum\
  \ 会自动为 dm_owner 和 dm_world 别名包含条目。您可以显然修改这两个别名的特定权限。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_177_0.png)\n\
  \n图 12.4：创建权限集\n\n3. 在提供必要的权限后，可以在 Documentum Application Builder 的左窗口窗格中选择权限集，右键单击并通过选择\
  \ Check in selected object(s) 选项将其签入 Docbase。\n\n请注意，我们不需要为生命周期的 Start 阶段创建 ACL，因为一旦在\
  \ Web Publisher 中创建内容，Documentum 会自动将其推送到 WIP 生命周期状态。实际上，需要为 Start 状态之外的所有生命周期状态创建权限集。\n\
  \n图 12.5 基于 Documentum 默认生命周期的开箱即用 ACL，列出了 WIP、Staging 和 Approved 每个生命周期状态的权限集设计。毋庸置疑，您可以根据业务需求更改权限级别。\n\
  \n| 生命周期阶段 | 别名 | 基本权限 | 运行流程 | 更改位置 | 更改状态 | 更改权限 | 取得所有权 |\n|---|---|---|---|---|---|---|---|\n\
  | WIP | administrator | DELETE | Y | Y | Y | Y | N |\n|  | content author | DELETE\
  \ | Y | Y | Y | Y | N |\n|  | content manager | DELETE | Y | Y | Y | Y | N |\n|\
  \  | web developer | DELETE | Y | Y | Y | Y | N |\n|  | dm_owner | DELETE | Y |\
  \ Y | Y | Y | N |\n|  | dm_world | READ | Y | Y | N | N | N |\n| Staging | administrator\
  \ | VERSION | Y | Y | Y | Y | N |\n|  | content author | VERSION | Y | Y | Y | Y\
  \ | N |\n|  | content manager | VERSION | Y | Y | Y | Y | N |\n|  | web developer\
  \ | VERSION | Y | Y | Y | Y | N |\n|  | dm_owner | WRITE | Y | Y | Y | Y | N |\n\
  |  | dm_world | READ | Y | Y | N | N | N |\n| Approved | administrator | VERSION\
  \ | Y | Y | Y | Y | N |\n|  | content author | VERSION | Y | Y | Y | Y | N |\n|\
  \  | content manager | VERSION | Y | Y | Y | Y | N |\n|  | web developer | VERSION\
  \ | Y | Y | Y | Y | N |\n|  | dm_owner | WRITE | Y | Y | Y | Y | N |\n|  | dm_world\
  \ | READ | Y | Y | N | N | N |\n\n图 12.5：不同生命周期状态的权限\n\n## 12.4 创建自定义生命周期\n\n本节将讨论创建自定义生命周期的详细步骤。\n\
  \n1. 在我们的自定义 DocApp TestDocApp 中，选择菜单选项 Insert | Document Lifecycle 以创建新的生命周期。为自定义生命周期提供一些唯一名称（如\
  \ `Custom_Lifecycle`）（参见图 12.6）以及简短描述以说明其用途。\n\n\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_179_0.png)\n\
  \nFigure 12.6: 创建新的生命周期对象\n\n生命周期编辑器用于创建**生命周期状态图**，在其中您可以创建生命周期的各个状态及其特定的行为/属性。\n\
  \n请注意，此时 Validate 按钮处于禁用状态。生命周期正在创建中，因此被称为处于草稿状态。当您完成生命周期的创建并将其签入 Docbase 后，Validate\
  \ 按钮将被启用。单击 Validate 按钮相当于进行系统验证，以检查生命周期参数是否一致。如果验证检查通过，生命周期将被验证，并且 Install 按钮将被启用。单击\
  \ Install 按钮后，生命周期将被安装到 Docbase 中，并最终可供适当的对象使用。\n\n### 2. 通过单击对应于 Default Alias\
  \ Set 选项的省略号按钮为生命周期附加别名集。Select Alias Sets 对话框如图所示 12.7 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_180_0.png)\n\
  \nFigure 12.7: 为生命周期指定默认别名集\n\n从下拉列表中选择我们之前创建的别名集 Custom_AliasSet。您还可以通过单击 Add...\
  \ 按钮将 Docbase 中存在的其他别名集附加到生命周期。\n\n### 3. 现在您需要提供对象类型，其对象实例可以附加到自定义生命周期。例如，我们要求我们的自定义生命周期附加到新闻文章对象。\n\
  \n单击对应于 Primary Type 字段的省略号按钮并选择 dm_document 作为 Primary Type（参见图 12.8）。这意味着 dm_document\
  \ 对象类型的对象实例可以附加到我们的自定义生命周期。此外，基本对象类型（在我们例子中为 dm_document）的子类型显示在 Available Subtypes\
  \ 列表下。选择 dm_document 的子类型，其对象实例也可以附加到相关生命周期。单击 → 按钮将把 dm_document 子类型包含在 Acceptable\
  \ Subtypes 列表下。单击 OK 按钮。\n\n请注意，如图 12.8 所示，我们已将 dm_document 指定为自定义生命周期的基本对象类型，并将\
  \ cust_newsarticle 对象类型指定为生命周期的 dm_document 的可接受子类型。\n\n这确保了从新闻文章类型创建的内容对象可以附加到我们的自定义生命周期。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_181_0.png)\n\nFigure 12.8: 指定基本对象类型和可接受子类型\n\
  \n我们现在准备一个包含四个正常生命周期状态的生命周期状态图：\n\n- Start\n- WIP\n- Staging\n- Approved\n\n请注意用于描述生命周期状态的单词\
  \ normal。生命周期中也可能存在异常状态，以表示在状态的否则顺序且线性的正常流程中的异常流程或偏离。\n\n您可以通过单击 Add State 并为状态提供一些独特易懂的名称来在生命周期中引入状态。单击\
  \ Add State 会在生命周期状态图（如图 12.9 所示）中添加一个五边形状态。\n\n第一个状态称为**基本状态**，而结束状态称为**最终状态**。我们的自定义生命周期有四个正常状态，包括一个基本状态（称为\
  \ Start）和一个最终状态（称为 Approved）。\n\n当您将文档附加到生命周期时，您实际上是将文档与生命周期关联。这样做允许您将文档提升到下一个顺序线性正常状态，或将其降级回其上一个正常状态。让我们举一个快速例子。\n\
  \n我们创建一个 Word 文档 abc.doc 并将其与我们的自定义生命周期关联。此时，文档处于生命周期的 WIP 状态。提升文档会将其推到下一个正常状态——Staging。在\
  \ Staging 状态下，如果您降级文档，它将返回到 WIP 状态。简单，不是吗？\n\n尽管我们不会在自定义生命周期中涵盖异常状态，但值得在此提及，与提升和降级类似，从正常状态移动到异常状态称为**挂起**，而从异常状态返回到正常状态称为**恢复**。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_182_0.png)\n\nFigure 12.9: 一个生命周期状态图\n\
  \n### 4. 双击添加的状态或选择该状态并单击 Edit State 按钮以打开生命周期状态编辑器。我们将以创建生命周期的 WIP 状态为例。同样，其他生命周期状态也可以使用生命周期编辑器创建。\n\
  \n在 General 选项卡下（参见图 12.10），您可以指定生命周期状态的名称和描述，并提供以下状态转换（状态更改）设置：\n\n- **允许直接附加到此状态**：如果对象满足生命周期状态的进入条件，则此生命周期状态将是它们的初始状态。\n\
  - **允许降级到上一个状态**：这允许从此状态降级到其上一个正常状态。对于生命周期的第一个状态，此选项处于禁用状态。\n- **允许从此状态进行计划转换：**\
  \ 这允许基于时间计划进行生命周期状态更改，而无需用户发起的任何明确操作。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_183_0.png)\n\
  \nFigure 12.10: 生命周期状态编辑器 General 选项卡\n\n- **在这些条件下将文档降级到基本状态：** 如果满足提及的条件（例如保存、签入等），此选项允许将文档降级到生命周期中的基本状态。\n\
  \n### 5. 在 Entry Criteria 选项卡下（参见图 12.11），您可以指定系统在文档进入生命周期中特定状态之前执行的某些条件或检查。\n\n\
  请注意，在降级期间，Documentum 不会检查生命周期状态的进入条件。\n\n进入条件检查可以通过属性值和表达式测试执行。您可以指定多个条件，Documentum\
  \ 将从列表顶部到底部对其进行评估。此外，系统确保一旦某个条件失败，就不会评估其他条件，从而节省执行时间。\n\n单击 Add Value Test 按钮，选择属性名称和关系运算符（=、<、>、<>、<=\
  \ 和 >=）并指定属性需要对其进行评估的值。单击 Add Expression Test...，选择一个属性，然后单击 Validate 后跟 OK，以引入系统在进入此特定生命周期状态时需要检查的表达式。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_184_0.png)\n\nFigure 12.11: 生命周期状态编辑器\
  \ Entry Criteria 选项卡\n\n您甚至可以编写自定义 Docbasic 过程，系统在评估属性表达式后可以运行它。自定义过程可以以编程方式评估 Docbase\
  \ 中的某些条件，这些条件在文档进入生命周期中此特定状态之前必须为真。\n\n您可以通过单击 Docbase Path Name 字段旁边的省略号按钮并浏览到正确\
  \ Docbase 位置下的过程，来选择性地指定 Documentum 即用型过程。\n\n### 6. 现在让我们转到生命周期状态编辑器中的 Actions\
  \ 选项卡。系统评估生命周期状态的进入条件后，在给定生命周期状态下系统需要执行的操作集合在 Actions 选项卡中指定。\n\nDocumentum 按以下执行顺序执行操作：\n\
  \n- 首先评估标准操作\n- 运行可选的 Docbasic 操作过程\n\n在 Actions 选项卡中单击 Add Action... 按钮会显示 Define\
  \ Action 屏幕（参见图 12.12），允许用户选择众多操作类型之一并定义系统需要执行的具体操作。通过 GUI 向导定义操作非常简单。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_185_0.png)\n\
  \nFigure 12.12: Actions 选项卡下的 Define Action 向导\n\n使用 Define Action 向导，您可以指定多个操作，例如在文档处于给定生命周期状态时向文档添加特定版本标签或从文档中删除特定版本标签。\n\
  \n除此之外，您还可以设置文档的所有者或其一个属性的特定值，以及其他多个操作定义。\n\n要在文档处于生命周期的 WIP 状态时向文档添加 WIP 版本标签，请从\
  \ Define Action 向导中选择 Add Version Label 选项，并在后续屏幕中输入值 WIP（参见图 12.13）。\n\n\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_186_0.png)\n\
  \n图 12.13：为给定生命周期状态提供版本标签值\n\n同样，你可以指定当文档处于 WIP 生命周期状态时需要从文档中移除的以下版本标签：Approved、Active、Expired。这可以通过从\
  \ Define Action 向导中选择 Remove Version Label 选项来实现。\n\n此外，你还可以使用相同的 Define Action\
  \ 向导，将我们之前创建的自定义权限集（Custom WIP ACL）附加到处于 WIP 生命周期状态的文档上。\n\n正如我们在设置 Entry Criteria\
  \ 选项卡时所看到的，可以指定一个 Docbasic 过程供系统在执行指定的标准操作后执行。\n\n图 12.14 显示了为 WIP 生命周期状态添加的所有标准操作。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_187_0.png)\n\n图 12.14：Lifecycle 状态编辑器\
  \ Actions 选项卡下列出的指定操作\n\n## Documentum 5.3 更新\n\nDocumentum 5.3 版本允许您在生命周期入口条件、操作、PostChange\
  \ 以及验证中指定 Java 类作为过程。\n\n7. 在 PostChange 选项卡下（参见图 12.15），您可以指定一个 post-change Docbasic\
  \ 过程，系统可在状态转换完成后执行该过程。\n\n单击 Docbase Path Name 字段旁显示的省略号按钮，并浏览到正确的 Docbase 位置以指定\
  \ Docbasic 过程。\n\n请注意，对于 WIP 生命周期状态，我们已指定执行开箱即用的过程 wcmLifecycleScript，该过程负责多个标准生命周期操作和文档的系统检查。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_188_0.png)\n\n图 12.15：生命周期状态 PostChange\
  \ 选项卡\n\n8. 指定 PostChange 过程后，您可以转到生命周期状态编辑器中的 Attributes 选项卡（参见图 12.16）。此功能允许您在文档达到特定生命周期状态时修改所选文档属性的某些属性。\n\
  \n选择您希望修改其属性的文档属性。这里我们以选择属性 subject 并单击 Change Properties... 按钮为例。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_189_0.png)\n\
  \n图 12.16：生命周期状态 Attributes 选项卡\n\n属性窗口打开（参见图 12.17），显示所选属性并允许用户以任意组合更改以下内容：\n\n\
  - **Label Text:** 在客户端应用程序（例如 Web Publisher）中显示在属性旁边的文本（描述属性的名称）。\n- **Help Text:**\
  \ 有关该属性的一些帮助文本。\n- **Comment:** 属性的简短描述或注释。\n- 其他属性，例如设为只读、隐藏等。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_190_0.png)\n\
  \n图 12.17：更改所选属性的属性\n\n9. 生命周期中的文档通过某些客户端应用程序（如 Desktop Client、Web Publisher 等）进行操作。客户端程序将文档的功能（例如：签出、链接到位置等）与实现这些功能的实际组件（功能类）相匹配。\n\
  \n如果您还记得我们关于对象类型的讨论，我们看到对象类型定义包含实现其功能的一定功能类。\n\n使用生命周期状态编辑器，您可以修改与对象类型定义关联的功能类、添加新组件及其实现类以及执行其他此类操作。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_191_0.png)\n\n图 12.18：生命周期状态编辑器 Functionality\
  \ 选项卡\n\n10. 与设置 WIP 状态类似，请根据图 12.19 所示的定义创建 Start、Staging 和 Approved 生命周期状态。这些基于\
  \ Documentum 的默认生命周期，并且可以根据您的具体业务需求进行更改。\n\n创建所有生命周期状态后，您可以像权限集和别名集一样将自定义生命周期签入\
  \ Docbase。\n\nDocumentum 允许您对文档和生命周期进行版本控制。在某一时刻，多个文档版本可以附加到同一生命周期的多个版本。\n\n例如，假设您有一个新闻文章文档\
  \ news_story001.xml，由新闻文章对象类型 cust_newsarticle 创建，并与我们的自定义生命周期 Custom_Lifecycle\
  \ 相关联。\n\n此时该文档与生命周期版本 1.0 相关联。开发人员修改了生命周期并将修改后的生命周期以版本 1.1 的形式签入 Docbase。\n\n然而，这并不意味着文档\
  \ news_story001.xml 现在会自动与生命周期版本 1.1 相关联。它仍然链接到生命周期版本 1.0，这在某些情况下可能会造成混淆。\n\n> 除非在您的业务场景中绝对需要，否则不要以次要版本或主要版本的形式将生命周期签入\
  \ Docbase。相反，将生命周期以修改前的同一版本签入，以便文档不会丢失关联。\n\n图 12.19 显示了我们自定义生命周期的生命周期状态定义：\n\n\
  | 生命周期状态 | 通用 | 入口条件 | 操作 | 更改后 | 属性 | 功能 |\n|---|---|---|---|---|---|---|\n| Start\
  \ | 允许附加：是<br>允许降级：否<br>允许计划转换：是 | N/A | N/A | N/A | N/A | N/A |\n| WIP | 允许附加：是<br>允许降级：是<br>允许计划转换：是\
  \ | N/A | 添加版本标签：WIP<br>移除版本标签：Active、Approved、Expired<br>设置权限集：Custom WIP ACL |\
  \ 过程 Docbase 路径名称：/System/Applications/WebPublisher/wcmLifecycleScript | N/A | N/A\
  \ |\n| Staging | 允许附加：是<br>允许降级：是<br>允许计划转换：是 | N/A | 添加版本标签：Staging<br>移除版本标签：Approved<br>设置权限集：Custom\
  \ Staging ACL | N/A | N/A | N/A |\n| Approved | 允许附加：是<br>允许降级：是<br>允许计划转换：是 | \
  \ | 添加版本标签：Approved<br>设置权限集：Custom Approved ACL | 过程 Docbase 路径名称：/System/Applications/WebPublisher/wcmLifecycleScript\
  \ | N/A | N/A |\n\n图 12.19：各种生命周期状态的定义\n\n11. 将生命周期签入 Docbase 后，请按本章前面讨论的方式安装生命周期，以便应用程序可以使用它。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_193_0.png)\n\n图 12.20：已完成的已安装生命周期\n\n\
  ## 12.5 通过生命周期提升和降级内容\n\n附加到生命周期的创建内容可以通过以下一种机制在各种生命周期状态之间推进：\n\n- Web Publisher\
  \ 的 Promote 和 Demote 菜单选项\n- 工作流\n- 服务器 API 命令：promote 和 demote\n- BATCH_PROMOTE\
  \ 管理方法\n\n我们将在 Web Publisher 中创建示例内容，并查看如何使用上述机制通过其各种生命周期状态提升和降级它。\n\n使用以下任一方法在\
  \ Web Publisher 中创建附加到 Custom_Lifecycle 的新闻文章：\n\n- 使用我们在第 13 章中介绍的新闻文章 Web Publisher\
  \ 模板\n- 通过菜单选项 File | Import 在 Web Publisher Web 文件柜中导入内容文件，并将其附加到自定义对象类型 cust_newsarticle\
  \ 和生命周期 Custom_Lifecycle（参见图 12.21）\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_194_0.png)\n\
  \n图 12.21：导入内容文件并将其附加到 Custom_Lifecycle\n\n您可以通过图 12.22 中显示的 Status 列验证新创建/导入的内容处于\
  \ WIP 生命周期状态。选择内容旁边的复选框并选择菜单选项 Document | Lifecycle | Promote。\n\n\n\n## 创建生命周期、别名集和权限集\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_195_0.png)\n\n图 12.22：推广内容\n\n系统需要花费一点时间将内容提升到生命周期中的下一个正常状态。您可以点击“任务状态”按钮查看生命周期提升操作的进度。系统提升内容后，内容将显示在其下一个正常生命周期状态（以\
  \ Custom_Lifecycle 为例为 Staging），如图 12.23 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_195_1.png)\n\
  \n图 12.23：降级内容\n\n为了将内容从其当前正常生命周期状态降级，请选中内容旁边的复选框并选择菜单选项 Document | Lifecycle |\
  \ Demote（参见图 12.23）。\n\n为了强制提升内容，请选中内容旁边的复选框并选择菜单选项 Document | Lifecycle | Power\
  \ promote。强制提升会将内容直接推送到其 Approved 生命周期状态（即生命周期中的最后状态）。此时，讨论 Web Publisher Monitor_Lifecycles\
  \ 作业至关重要（参见图 12.24）。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_196_0.png)\n\n\
  图 12.24：Documentum 中的 Monitor_Lifecycles 作业\n\nDocumentum 中的 Monitor_Lifecycles\
  \ 作业按预定义间隔运行并执行以下功能：\n\n如果 Approved 对象的生效日期（a_effective_date 属性）与当前系统日期匹配，Monitor_Lifecycles\
  \ 作业会通过将其版本标签更改为 Active 使对象处于活动状态。\n\n如果 Active 对象的到期日期（a_expiration_date 属性）与当前系统日期匹配，Monitor_Lifecycles\
  \ 作业会通过将其版本标签更改为 Expired 使对象过期。\n\n默认情况下，如果内容的生效日期为空，强制提升会立即使文件处于活动状态并发布内容。但是，通过提供\
  \ Web Publisher 系统设置，您可以更改此行为。\n\n以管理员身份登录 Web Publisher，并在 Lifecycles 部分下进入 Administration\
  \ | Web Publisher Admin | Settings。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_197_0.png)\n\
  \n如图 12.25 所示，如果您选中 Delay Publish Active 复选框，则提升到 Active 状态的强制提升将由 Monitor_Lifecycles\
  \ 作业处理。\n\n以下 API 命令（通过 Documentum Administrator 中的 IAPI 实用程序或 API Tester 执行）也可用于推广和降级内容。请参阅第\
  \ 26 章以更好地了解服务器 API 命令。\n\n- **推广内容**\n  `API>id,c,cust_newsarticle where object_name\
  \ = Testing_Promote_Demote.xml`\n  `090015558000bc5b`\n  请注意，API 命令 id 返回与指定限定条件匹配的对象的对象\
  \ ID。在我们的例子中，090015558000bc5b 是名称为 Testing_Promote_Demote.xml 的新闻文章内容的对象 ID（r_object_id\
  \ 属性）。\n  `API>promote,c,090015558000bc5b`\n  `...`\n  `OK`\n- **降级内容**\n  `API>demote,c,090015558000bc5b`\n\
  \  `...`\n  `OK`\n- **批量推广内容**\n  管理方法 BATCH_PROMOTE 可通过简单的 API 命令将多个对象提升到其下一个生命周期状态。BATCH_PROMOTE\
  \ 的有趣之处在于它可用于存在于不同生命周期状态并附加到不同生命周期的多个对象。您可以在一次 BATCH_PROMOTE 执行中提升多达 200 个对象。\n\
  \  现在让我们使用 BATCH_PROMOTE 提升两个内容文件 Testing_Promote_Demote.xml 和 Testing_Promote_Demote002.xml：\n\
  \  `API>id,c,cust_newsarticle where object_name = Testing_Promote_Demote002.xml`\n\
  \  `...`\n  `090015558000bc71`\n  `API>id,c,cust_newsarticle where object_name =\
  \ Testing_Promote_Demote.xml`\n  `...`\n  `090015558000bc5b`\n  获取两个内容文件的 r_object_id\
  \ 后，发出以下简单的 API 命令进行批量提升。\n  `API> apply,c,NULL,BATCH_PROMOTE,ARGUMENTS,S,090015558000bc71,090015558000bc5b`\n\
  \nBATCH_PROMOTE 方法反过来调用 dm_bp_batch Documentum 方法，并在执行后返回包含一个结果对象的集合。\n\n### 12.5\
  \ 过期内容\n\n有时，网站上出现的内容在内容过时或需要进行任何更改时需要从网站上移除。Documentum 提供了一些机制，允许您使内容过期并将其从网站上移除。\n\
  \n首先，您需要了解 Documentum 提供了 SysObject 属性 a_expiration_date，内容作者可以填写该属性以指定内容需要过期的时间。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_198_0.png)\n\n图 12.26：创建内容期间显示的到期日期字段\n\
  \n图 12.26 显示了在 Web Publisher 中创建新内容时，新内容屏幕中的到期日期字段。如果您在创建内容时忘记指定到期日期，您始终可以通过属性（信息）屏幕中的\
  \ Publishing 选项卡指定它。\n\n以下是过期 Documentum 中创建内容的某些机制：\n\n- 指定了到期日期的内容的 Monitor_Lifecycles\
  \ 作业\n- Web Publisher Expire now 菜单选项\n\n当活动内容的到期日期与当前系统日期匹配时，Monitor_Lifecycles\
  \ 作业会使内容过期，并在发布后将其从网站上移除。\n\n使用 Web Publisher Expire now 菜单选项（Document | Lifecycle\
  \ | Expire now），您可以在其指定的到期日期之前使内容过期，如图 12.27 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_199_0.png)\n\
  \n图 12.27：在 Web Publisher 中手动过期内容项\n\n请注意，如图 12.28 所示，内容的版本标签更改为 Expired（参见状态列）。过期的内容仍保留在\
  \ Docbase 中，尽管它已从活动网站中移除。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_199_1.png)\n\
  \n图 12.28：在 Web Publisher 中看到的过期内容\n\n> 为了对处于 Active 状态的内容进行更改，请先使用 Expire now 功能使内容过期，然后再根据需要进行编辑。值得注意的是，以下状态的内容无法降级：WIP、Approved、Active\
  \ 和 Expired。\n\n这完成了我们对生命周期及其在 Documentum 中用法的讨论。您可以使用生命周期与工作流结合使用。虽然生命周期只是表示文档生命中的阶段，例如草稿、审阅和已批准，但工作流实际上将文档路由通过这些生命周期阶段，并定义谁在何时以及在什么条件下处理文档。从本质上讲，生命周期和工作流互为补充。我们将在第\
  \ 19 章讨论工作流。现在，您已准备好开始创建 Web Publisher 模板并将其与自定义对象类型关联。从这些创建的内容对象可以与本章中创建的自定义生命周期关联。\n\
  \n### 12.6 摘要\n\n在本章中，我们详细讨论了 Documentum 别名集、权限集（ACL）和生命周期。我们提到了为生命周期创建别名集、为生命周期的各种状态创建权限集以及自定义生命周期对象的详细步骤。\n\
  \n我们还看到了 Documentum 如何在生命周期范围、工作流范围、会话范围、用户范围和系统范围内解析别名的别名值。\n\n本章中创建的自定义生命周期包含四个状态：Start、WIP、Staging\
  \ 和 Approved，并将 dm_document 作为链接到的主要对象类型。我们将 News Article 对象类型添加为生命周期中的可接受子类型，允许从\
  \ News Article 对象类型创建的对象附加到此自定义生命周期。\n\n最后，我们看到了在生命周期的不同状态下提升、强制提升和降级对象的各种机制，以及从网站过期内容的某些方法。\n\
  \n\n\n## 13 使用 Web Publisher 模板文件工作\n\n## 使用 Web Publisher 模板文件工作\n\n一旦您创建了自定义对象类型并将其作为可接受的对象类型包含在自定义生命周期中，您就可以继续为该对象类型创建\
  \ **Template**。回顾我们之前关于模板和对象类型的讨论：对象类型是对对象的定义，其中包含诸如对象创建者、最后修改时间、标题、主题、描述以及一些自定义属性等信息。\n\
  \n每当从特定对象类型创建对象时，它都会继承所有属性，并允许用户为每个属性分配特定值。对象类型仅充当从其创建的所有实时对象的模板。然而，这仅涵盖对象的元数据或属性。那么此类对象的实际内容数据（网页）怎么办，例如关联的图像、段落/文本摘要、关联的超链接以及其他可归类为实际内容而非元数据、在网站上显示的信息？这就是\
  \ Web Publisher Templates（或宽松地说 **UI forms**）发挥作用的地方。\n\n使用 Web Publisher Templates，您可以设计并创建带有占位符字段的表单，供业务用户为创建的对象填写实际数据。同一\
  \ Template 可被多个业务用户在创建内容时使用，以便根据具体的业务场景在模板字段中填写适当的值。\n\n简而言之，如果我们以我们的虚拟新闻网站示例为例，我们谈论的是两种类型的信息：\n\
  \n- **Content**：在网站上显示的 HTML 内容/网页（新闻文章），显示实际的新闻信息，如头版图片、主要新闻内容等。\n- **Properties**：新闻文章的元信息/属性，例如谁创建了新闻文章、何时创建、这是否是新闻稿新闻文章以及其他相关属性信息。\n\
  \n如果您仍然感到困惑，请不要担心，但请继续。 我们将在本章中举出详细的示例来了解 Templates 是什么以及它们如何在 Documentum 架构中发挥作用。\
  \ 目前，只需理解 Documentum 开发人员只需为网站上不同种类的网页创建带有占位符字段的不同 Templates。 业务用户使用适当的模板来创建网站上众多类别的网页，而无需了解任何网页语言或脚本方法，例如\
  \ HTML 和 JavaScript。 Documentum 模板通过演示文件（样式表）将输入的数据转换为具有所需外观的 HTML 网页。\n\n您可能希望参考第\
  \ 10 章，快速回顾 Templates 是什么以及它们如何在 Documentum 中与其他 Web Publisher 文件耦合。\n\n为了方便起见，让我们再次讨论\
  \ Web Publisher **template-rules-presentation** 架构（参见图 13.1），以便修复任何遗漏的螺栓和松散的末端。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_203_0.png)\n\n图 13.1：Web Publisher 模板-规则-演示架构\n\
  \nWeb Publisher Template 文件可以在 Documentum 中作为 XML 文件创建，其元素对应于模板中的各个字段。\n\n**Rules\
  \ file** 在 Documentum 中作为 XML 文件创建，并为模板字段元素添加了语义。 字段类型（复选框、文本框等）、字段长度和字段验证（必填、只读等）均在\
  \ Rules file 中定义。\n\nWeb Publisher 内部解释 Template 和 Rules XML 文件，以在 Web Publisher\
  \ 中创建并显示模板字段，形成用户可用于创建网页的表单。 在 Web Publisher 编辑器模板字段中填写的实际值会创建一个内容文件，该文件不过是将数据分配给模板\
  \ XML 元素。\n\n**Presentation files**（XSL 样式表）使用 Documentum 的 Xerces XSL 转换引擎对内容 XML\
  \ 文件进行样式设置，以创建所需格式/呈现形式的网页（例如 HTML、WML 等）\n\n如果要谈论业务用户（内容创建者）和 IT 开发团队之间的职责划分，则可以总结如下：\n\
  \nIT 开发团队创建对象类型、生命周期、Templates、Rules 文件、演示文件以及其他 Documentum 配置项/相关对象，而业务用户只需使用这些对象和模板来填写并为其网站创建内容，而无需了解任何编程语言/脚本/配置设置！\n\
  \nWeb Publisher Template 在 Documentum 中使用以下支持文件：\n\n- **Rules files：** 用于在 Web Publisher\
  \ 编辑器中定义模板字段以供编辑。\n- **Presentation files：** 用于从内容文件设置样式并生成网页格式/呈现形式。\n- **Previews：**\
  \ 这些是模板的图形表示（缩略图），让内容作者可以轻松识别模板。\n\n在此阶段讨论对象类型与模板之间的关系是值得的。 图 13.2 应能让您了解这两个对象之间的关系以及它们在内容创建过程中如何协同工作。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_204_0.png)\n\n图 13.2：对象类型和 Web Publisher\
  \ 模板\n\n正如我们之前讨论的那样，对象类型与生命周期相关联（在我们的示例中，cust_newsarticle 对象类型与 custom_Lifecycle\
  \ 生命周期相关联）。 Template 反过来在 Documentum 中链接到特定对象类型。 每当从对象类型创建内容时：\n\n- 新创建的内容继承对象类型定义中定义的属性（或元数据），并使用内容作者指定的实际值。\n\
  - 实际的网页内容继承自业务用户在填写模板字段时指定的值。\n\n讨论了这一点后，让我们现在开始我们的之旅，通过为我们的虚拟新闻网站示例创建 Template。\
  \ 我们将看到在 Documentum 中创建 Templates 和支持文件是多么简单。\n\n### 13.1 创建模板文件\n\n在创建 Template\
  \ 之前，第一步是在 Web Publisher 中创建一个类别（或分类法），模板将与之关联。\n\n明智的做法是先整理网站上所有类型的网页，然后再提出众多内容类别。\
  \ 根据每个类别，可以创建 Templates，以便内容作者确切知道要查看哪个类别以找到相关 Templates 来创建网页内容。\n\n- 1. 以管理员或\
  \ Web 开发人员用户身份登录 Web Publisher。 请注意，Web Publisher Templates 位于 Docbase 内的 Site Manager\
  \ | Templates 文件夹中。 在 Web Publisher 中转到 Site Manager | Templates 并单击 File | New\
  \ | Category。 新类别屏幕如图 13.3 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_205_0.png)\n\
  \n图 13.3：为模板创建类别\n\n为类别提供信息丰富且自解释的名称，然后单击 Finish。 如有需要，还可以通过转到 Permissions 选项卡来设置类别的安全设置。\
  \ 在 Permissions 选项卡中，您可以为类别分配一个 Permission Set（ACL），允许仅特定组访问该类别，并禁止/限制其他人访问同一类别。\n\
  \n- 2. 下一步也是无可争议的最重要的一步是创建 Template XML 文件，以便将其与上一步中创建的类别关联。 Template 文件可以在市场上提供的众多和多样的\
  \ XML 编辑器和网页创作应用程序中的任何一种中创建，例如 XML Spy®、Dreamweaver，甚至是 WordPad 或 Notepad 等文本编辑器。\n\
  \n即使 Web Publisher 允许您创建基于 HTML 的 Templates 以及 XML Templates，使用 XML Template 文件也是更明智的选择。\
  \ 使用 XML Templates 可以更灵活地使用 XSL 样式表设置样式和解析内容 XML 文件，而使用 HTML Template 文件则不具备这种灵活性。\n\
  \n为 Template XML 文件提供一些合理的名称（例如 cust_news_art_temp1.xml），以表明它是新闻文章的自定义 Template\
  \ 文件。\n\n每当使用此 Template 文件创建新内容时，内容创建者可以为内容文件提供一些有效名称，例如 news_article_oct31_2005.xml。\n\
  \n可能存在内容文件的名称对业务团队无关紧要的情况，或者他们可能希望为从 Template 文件创建的内容文件提供某种系统生成的自动命名方案，以避免手动提供名称的麻烦。\n\
  \n在这种情况下，您可以使用以下命名约定创建 Template 文件，例如 cust_news_art_temp1###.xml。\n\n每当使用此 Template\
  \ 创建内容时，在运行时 Documentum 会用按顺序生成的数字值替换哈希符号（#），并将内容文件命名如下：\n\n```\ncust_news_art_temp1_001.xml\n\
  ```\n\n```\ncust_news_art_temp1_002.xml ... and so on.\n```\n\n此功能在 Web Publisher\
  \ Templates 中称为自动命名。\n\n为我们的新闻文章示例创建的示例 Template XML 文件如下所示：\n\n```\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<NEWSART>\n<BANNERIMG></BANNERIMG>\n<IMGALTTEXT></IMGALTTEXT>\n\
  <DATE></DATE>\n<BODYTEXT></BODYTEXT>\n<REPEATBLOCK>\n<NEXTLINKNAME></NEXTLINKNAME>\n\
  <NEXTLINKURL></NEXTLINKURL>\n</REPEATBLOCK>\n</NEWSART>\n```\n\n让我们讨论一下典型的 XML 模板文件的解剖结构：\n\
  \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n```\n\n这是带有字符编码的标准 XML 声明标签。\
  \ 将编码指定为 UTF-8 可以支持扩展字符，例如 ®、© 而不仅仅是 ASCII 字符。\n\n<NEWSART> 是 XML 文件的根标签。 其他 XML\
  \ 元素表示模板编辑器中的各个字段。 例如，<DATE> 表示在模板编辑器中输入日期的字段，而 <BANNERIMG> 表示在模板编辑器中提供横幅图像的字段。\n\
  \n\n\n在 Web Publisher XML 文件（模板文件、规则文件、演示文件）中使用特殊字符时，请使用字符引用而不是 HTML 实体引用。\n\n例如，使用\
  \ &#163; 表示英镑符号 (£)，而不是使用 &pound;\n\n这是由于 Documentum 内部用于解析 XML 文件的 Xerces XML 解析器的限制所致。\n\
  \n- 3. 将上一步创建的模板文件复制到机器本地驱动器上的某个位置。进入上一步 1 中新建的分类，并选择菜单选项 File | Import。点击 Add Files（参见图\
  \ 13.4），并浏览机器的本地驱动器直到找到要导入的模板文件。然后点击 Next 按钮。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_207_0.png)\n\
  \nFigure 13.4: 在 Docbase 中导入模板文件\n\n- 4. 图 13.5 显示了 Import: Object Definition 屏幕。为相关模板文件提供一个具有信息性的描述性名称，并选择需要关联的对象类型。选择我们之前为新闻文章示例创建的\
  \ cust_newsarticle 对象类型。\n\n选择对象类型后，Lifecycle 下拉菜单会填充 Docbase 中所有已安装的生命周期，其中包含所选对象类型作为其可接受的主类型/子类型。\n\
  \n从 Lifecycle 下拉菜单中选择 Custom_Lifecycle 并点击 Import 按钮。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_208_0.png)\n\
  \nFigure 13.5: 将模板文件与对象类型关联\n\n- 5. 导入的模板文件在关联的分类中显示为 Unavailable 状态，如图 13.6 所示。这表示即使它已导入到\
  \ Docbase 中，内容创建者仍无法使用它。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_208_1.png)\n\
  \nFigure 13.6: 模板文件处于不可用状态\n\n使用 IDQL 实用程序或通过 Documentum Administrator 中的 DQL 编辑器运行以下\
  \ DQL 查询：\n\n```\nDQL> select object_name, a_is_template, r_version_label, r_object_type\n\
  from cust_newsarticle where a_is_template = '1'\n```\n\n> 请注意，所有从 cust_newsarticle\
  \ 对象类型创建的内容对象，其 a_is_template 系统属性都将被设置为 0，而只有模板文件才会将此值设置为 1。\n\n### 上述 DQL 查询的结果：\n\
  \nr_version_label 属性的值将为 CURRENT, 1.0。\n\n现在通过选择它并点击工具栏中显示的 Make Available 按钮（参见图\
  \ 13.6）使模板文件对内容作者可用。\n\n再次运行上述 DQL 查询，注意此时模板文件的 r_version_label 属性的值将为 Approved,\
  \ WIP, CURRENT, 1.0。\n\n- 6. 模板文件现在可以供内容作者使用，但仍需要将其与支持文件（如规则文件和演示文件）关联。\n\n选择模板文件并选择\
  \ View | Associations 查看关联的支持文件，如图 13.7 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_209_0.png)\n\
  \nFigure 13.7: 模板文件与支持文件的关联\n\n恭喜！您已成功在 Documentum 中创建了一个模板文件，内容作者可使用它为其网站输入内容。在我们进一步进行并开始将模板文件与其支持文件关联之前，至关重要的是首先为上述模板文件创建支持文件。请移至下一章，了解如何为本章创建的模板文件创建规则文件。\n\
  \n## 13.2 摘要\n\n我们讨论了 Documentum 对象的两种信息类型；显示在网站上的实际内容以及内容对象的元数据或属性。\n\n在 Web Publisher\
  \ 中，内容作者使用模板文件创建内容。内部，Documentum 根据用于内容创建的模板 XML 文件的结构创建内容 XML 文件。\n\n在 Web Publisher\
  \ 中创建的模板附加到 Docbase 对象类型。每当使用模板创建内容时，关联的对象都会作为链接对象类型的运行时实例创建。\n\n如第 10 章所述，我们再次简要讨论了\
  \ Web Publisher 规则文件和演示文件。最后，我们查看了为我们的新闻文章示例创建示例模板的详细步骤。\n"
- "## 14 创建规则文件\n\n在上一章为我们的新闻文章示例创建了模板文件后，我们已准备好继续为该模板设计规则文件。请记住，规则文件是一个简单的 XML 文件，用于定义模板文件中的各个字段。规则文件位于\
  \ Documentum Web Publisher 的 Docbase 中的 Site Manager | Rules 文件夹内。请按照以下部分中提到的步骤为您的模板文件创建规则文件。请注意，Documentum\
  \ 允许您将特定规则文件与多个模板文件关联。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_210_0.png)\n\n\
  Figure 14.1: 规则文件与模板文件的关联\n\n### 14.1 创建规则文件\n\n本节将讨论创建规则文件的详细步骤。\n\n- 1. 以管理员或\
  \ Web 开发人员用户身份登录 Web Publisher 并进入 Site Manager | Rules 文件夹。在 Rules 文件夹内创建一个新文件夹以标识和分离自定义应用程序的特定规则文件是一个不错的做法。\n\
  \n选择菜单选项 File | New | Folder。新文件夹创建屏幕如图所示 14.2 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_211_0.png)\n\
  \nFigure 14.2: 用于存储规则文件的新文件夹\n\n为您的自定义规则文件夹提供一个有效名称（例如 Custom_Rules）并点击 Finish 按钮。出于安全原因，您还可以将一些\
  \ ACL（权限集）附加到自定义规则文件夹，以允许或禁止某些组和用户访问它。这可以通过点击图 14.2 所示的 Permissions 选项卡来完成。\n\n\
  - 2. 规则文件可以使用任何可用的 XML/文本编辑器创建，但这需要您理解并学习 Documentum 的规则文件语法并遵循 Documentum 手册中提供的说明。相反，Documentum\
  \ 在 Web Publisher 中开发了一个简单的规则文件编辑器应用程序，可帮助您根据通过简单的规则文件创建 GUI 屏幕选择的/指定的参数自动创建规则文件。\n\
  \n在开始使用规则文件编辑器应用程序之前，需要执行一个简单的配置步骤。点击 Web Publisher 中的 Preferences 按钮并进入图 14.3 所示的\
  \ Web Developers 选项卡。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_212_0.png)\n\n\
  Figure 14.3: 设置 Documentum 规则编辑器应用程序的首选项\n\n在 Rules Editor 部分，选择 Web-based application\
  \ 的单选按钮。点击 Apply 然后点击 OK。这可确保在创建新规则文件或编辑现有规则文件时，Documentum 内部的规则文件编辑器会自动调用。\n\n\
  - 3. 设置规则编辑器首选项后，进入自定义规则文件夹 custom_Rules 并选择菜单选项 File | New | Rule。新规则创建屏幕如图所示 14.4\
  \ 所示。为规则文件提供一个有效名称（例如 cust_news_art_rule.xml）并点击 OK。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_213_0.png)\n\
  \nFigure 14.4: 为自定义规则文件提供名称\n\n- 4. 系统要求您浏览 Docbase 中的现有分类并选择需要为其创建规则文件的模板，如图 14.5\
  \ 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_213_1.png)\n\nFigure 14.5: Docbase\
  \ 中的现有分类\n\n参考图 14.6；选择包含我们在上一章创建的模板的分类（News_Articles）并选中模板文件（就我们而言为 cust_news_art_templ.xml）旁边的复选框。最后，点击\
  \ OK。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_214_0.png)\n\nFigure 14.6: 选择需要为其创建规则文件的模板文件\n\
  \nDocumentum 调用如图 14.7 所示的规则文件编辑器。我们现在可以为模板文件中的各个字段添加规则。\n\n模板文件中的所有 XML 元素都显示在规则编辑器的\
  \ Tree View 选项卡下。您只需单独选择这些 XML 元素并为其添加规则即可。\n\n请注意，在 Tree View 选项卡内，模板 XML 元素处于只读模式，阻止您修改模板文件结构。但是，通过切换到\
  \ Text View 选项卡，您可以灵活地更改关联模板文件中 XML 元素的结构。\n\n\n\n## 创建规则文件\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_215_0.png)\n\
  \n图 14.7：规则文件编辑器\n\n建议在创建过程中通过选择 File | Save 保存规则文件。在任何时候都可以关闭规则编辑器并退出，选择选项 File\
  \ | Close。\n\n5. 参考图 14.8；在 Tree View 选项卡下从模板文件选择一个 XML 元素（例如 <BANNERIMG>）并选择菜单选项\
  \ Rules | Add Rule。\n\n在 Web Publisher 编辑器中可以为模板 XML 元素创建以下类型的部件：\n\n- **文本行**：这是一个单行文本字段部件，允许内容作者在没有任何格式的情况下输入文本\n\
  - **内容**：这是一个多行文本字段部件，允许内容作者输入文本并通过可用的菜单选项对其进行格式化，例如：加粗、斜体、更改字体等。\n- **选择**：这是一个下拉选择列表，允许内容作者从现有值中选择特定值。列表中的值可以从硬编码的固定列表中填充，也可以通过\
  \ Docbase 中的 DQL 查询动态填充。\n- **文本选择器**：这是一个部件，允许内容作者从 Docbase 中选定的现有文件中选择一些文本。\n\
  - **图形**：这是一个选择列表部件，允许内容作者从 Docbase 中现有的图像中选择图像。\n- **复选框：** 这是一个复选框部件，允许内容作者选择或取消选择它。\n\
  - **X 选择器：** 这是一个文件选择部件，允许内容作者从 Docbase 中现有文件列表中选择文件。\n- **重复块：** 这是一个用作其他元素容器的部件。将一组元素/字段指定为可重复允许您在编辑器中多次呈现这些元素。这允许内容作者复制特定字段或为同一字段的多个实例指定多个值。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_216_0.png)\n\n图 14.8：添加 Graphic 规则\n\n\
  如图所示 14.8，选择 Graphic 选项为 <BANNERIMG> 模板元素添加规则。\n\n6. 填写图 14.9 所示的图形部件的字段。为字段提供一些标签，例如\
  \ Banner Image。为内容作者的方便提供一些说明性标签，例如 Please choose a banner image。通过选择 Required 旁边的复选框使字段成为必填项。\n\
  \n7. 定义用于显示 Docbase 中现有图像的选择列表，内容作者可以从中进行选择。将显示选项选择为 List control。\n输入 DQL 查询以填充选择列表：\n\
  \n```\ndm_document where folder(/Test_WebCabinet/Custom_Images)\n```\n\n请注意，您无需提供关键字\
  \ select * from。\n\n这里的假设是，在 Test_WebCabinet Web 柜内的 Docbase 中预先存在一个包含图像文件的 Custom_Images\
  \ 文件夹。如果不存在，请创建它并在其中放置一些图像。\n\n要在 select 查询中使用的属性名称需要提供，例如 object_name。这最终转换为以下\
  \ DQL：\n\n```\nselect object_name from dm_document where\nfolder(/Test_WebCabinet/Custom_Images)\n\
  ```\n\n单击 Test Query 按钮以检查输入的 DQL 语法是否正确，并找出在运行时将在部件中显示的查询结果。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_217_0.png)\n\
  \n图 14.9：为图形元素定义规则\n\n8. 您可以通过选择 Allow import 复选框，可选地提供内容作者通过图形部件在 Docbase 中指定文件夹内导入图像的选项。\n\
  9. 单击图 14.10 中显示的 Browse Docbase 按钮并选择图像文件将被导入并保存到的文件夹。\n10. 通过单击 Type 字段旁边的 Select\
  \ 按钮，选择导入的图像将与其关联的对象类型。\n\n11. 通过单击 Lifecycle 字段旁边的 Select 按钮，选择导入的图像将附加到的生命周期。\n\
  \n12. 通过单击 Category 字段旁边的 Select 按钮，选择导入的图像将与其关联的类别。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_218_0.png)\n\
  \n图 14.10：在图形元素中允许图像导入选项\n\n13. 保存规则文件并单击 Preview 选项卡（参考图 14.11），以查看当内容作者使用 News\
  \ Article 模板创建内容时横幅图像字段的外观。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_218_1.png)\n\
  \n图 14.11：横幅图像图形部件的预览\n\n请注意，Import 按钮也已添加，允许您从本地计算机导入图像文件到 Docbase 内的指定文件夹位置。\n\
  \n14. 为了查看图形元素的自动系统生成的规则文件代码，请单击 Rule XML 选项卡（参考图 14.12）：\n\n```\n<tagcontent tag_name=\"\
  BANNERIMG\">\n<graphic enable_locale_fallback=\"N\"\n    import=\"Y\"\n    instruction=\"\
  Please choose a banner image\"\n    label=\"Banner Image:\"\n    lifecycle=\"Default\
  \ Lifecycle\"\n    location=\"/Test_WebCabinet/Custom_Images\"\n    output_property=\"\
  folderPath\"\n    property=\"object_name\"\n    query=\"dm_document where folder(&#39;/Test_WebCabinet/Custom_Images&#39;)\"\
  \n    query_type=\"query\"\n    required=\"Y\"\n    type=\"dm_document\">\n</graphic>\n\
  </tagcontent>\n```\n\n图 14.12：系统生成的规则文件代码\n\n同样，您可以通过选择图 14.13 中显示的规则编辑器部件类型为剩余的模板字段创建其他部件。\n\
  \n| 模板 XML 元素 | 规则文件部件 |\n|---|---|\n| BANNERIMG | Graphic |\n| IMGALTTEXT | Textline\
  \ |\n| DATE | Textline |\n| BODYTEXT | Content |\n| REPEATBLOCK | Repeating Block\
  \ |\n| NEXTLINKNAME | Textline |\n| NEXTLINKURL | Textline |\n\n图 14.13：规则文件部件\n\
  \n15. 在突出显示相应的模板 XML 元素并为其添加规则后，您可以保存规则文件并通过选择菜单选项 File | Close 退出编辑器。\n\n检入新创建的规则文件（cust_news_art_rule.xml）并通过单击\
  \ Make Available 按钮使模板文件（cust_news_art_temp1.xml）可用，如上一章所述。\n\n为方便起见，下面显示了一些在为剩余模板\
  \ XML 元素创建规则时拍摄的屏幕截图。您可以在创建规则文件时将其作为指南：\n\n### 14.1.1 IMGALTTEXT 元素\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_220_0.png)\n\
  \n图 14.14：IMGALTTEXT 元素的 Textline 部件\n\n### 14.1.2 DATE 元素\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_220_1.png)\n\
  \n图 14.15：DATE 元素的 Textline 部件\n\n请注意，图 14.15 中的默认日期格式已设置为：TODAY+0,MMM dd, yyyy。\n\
  \n每当使用 News Article 模板创建内容时，News date: 字段将以指定格式预先填充当天的日期。\n\n### 14.1.3 BODYTEXT\
  \ 元素\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_221_0.png)\n\n图 14.16：BODYTEXT\
  \ 元素的 Content 部件\n\n在图 14.16 中，可以为多行文本字段选择众多格式选项。此外，您可以选择 Links 选项旁边的复选框，以允许内容作者创建指向\
  \ Docbase 中现有文件的超链接。Link browser formats 允许您指定希望为内容作者选择显示的各种文件格式。默认情况下，仅启用 html\
  \ 和 crtext 格式，允许显示具有 .htm、.html 和 .txt 扩展名的文件。\n\n### 14.1.4 REPEATBLOCK 元素\n\n\
  ![](img/b18244e6621ecc39cef03ff6c0e55e7c_221_1.png)\n\n图 14.17：为 REPEATBLOCK 元素设置重复块\n\
  \n<REPEATBLOCK> 模板元素包含 <NEXTLINKNAME> 和 <NEXTLINKURL> 元素，表示内容作者可以在此块内提供多个文章链接名称及其\
  \ URL。为了使 <REPEATBLOCK> 成为重复块部件，请突出显示它并选择菜单选项 Rules | Set Repeating Block，如图 14.17\
  \ 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_222_0.png)\n\n图 14.18：定义重复块\n\n\
  为方便内容作者，在重复块中提供标签和说明性文本，如图 14.18 所示。\n\n### 14.1.5 NEXTLINKNAME 元素\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_222_1.png)\n\
  \n图 14.19：NEXTLINKNAME 元素的 Textline 部件\n\n\n\n### 14.1.6 NEXTLINKURL 元素\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_223_0.png)\n\
  \nFigure 14.20: NEXTLINKURL 元素的文本行小部件\n\n## 14.2 Web Publisher 编辑器中的最终模板\n\n假设您已按照屏幕截图中显示的规范创建了\
  \ Rules 文件并将其签入 Docbase，让我们通过浏览 News_Articles 类别并选择菜单选项 File | New | Content 来创建新的新闻文章内容。\n\
  \n填入新内容的属性信息后，Web Publisher 编辑器打开，显示根据我们创建的 Rules 文件中定义的 Rules 显示的新闻文章模板。图 14.21\
  \ 和 14.22 显示了在 Web Publisher 编辑器中看到的新闻文章模板。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_224_0.png)\n\
  \nFigure 14.21: 新闻文章模板\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_224_1.png)\n\n\
  Figure 14.22: 新闻文章模板——续\n\n请参阅图 14.22；注意在“下一篇文章链接”重复块中添加的重复块小部件。您可以使用重复块小部件复制新闻文章链接名称/URL\
  \ 字段、重新排列多个字段，甚至删除新添加的字段。\n\n## 14.3 杂项 Rules 文件小部件\n\n我们已经看到了一些 Web Publisher Rules\
  \ 文件小部件，如文本行、内容、图形和重复块。以下是 Web Publisher 编辑器中显示的其他一些小部件。视觉吸引力会留下持久的影响，并有助于您更好地设计模板。\n\
  \n### 14.3.1 选择小部件\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_225_0.png)\n\n请注意，选择小部件中的分隔符是逗号（,）。这意味着字符串（Sarah,\
  \ Timothy）在下拉列表中会显示为两个值，Sarah 和 Timothy。解决此类情况的唯一方法是用分号或其他分隔符代替逗号将它们分开。示例：Sarah;Timothy。\n\
  \n### 14.3.2 复选框小部件\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_225_1.png)\n\n###\
  \ 14.3.3 文本选择器小部件\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_225_2.png)\n\n###\
  \ 14.3.4 X 选择器小部件\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_226_0.png)\n\nFigure\
  \ 14.26: 在 X 选择器小部件中单击 Browse 按钮\n\n可能值得快速讨论一下 Documentum 版本 5.3 中对 Web Publisher\
  \ 所做的一些增强功能：\n\n- Web Publisher 编辑器中的增强功能，具有富文本编辑功能并支持内容小部件中的链接管理\n- 浏览器拖放支持，允许\
  \ Internet Explorer 用户将项目从桌面拖到系统文件夹并在 Web Publisher 内拖动项目\n- 通过新的改进搜索算法改进搜索\n- 支持指定应在文件夹列表、收件箱、搜索结果页面等中显示的列\n\
  \n本章应已让您对 Rules 文件是什么以及如何创建和与模板文件关联有了良好的了解。您应阅读 Documentum Web Publisher 管理手册，以更详细地了解\
  \ Rules 文件、不同小部件类型及其众多特定属性。现在，您可以继续前进，进入下一章，以便为我们的新闻文章模板创建 Presentation 文件。\n\n\
  ## 14.4 摘要\n\nRules 文件定义了 Web Publisher 模板文件中各种 XML 元素的验证和行为。我们从详细示例开始了我们的介绍，即在\
  \ Web Publisher 中为我们的新闻文章模板创建 Rules 文件。我们了解了如何设置首选项以调用 Web Publisher Rules 编辑器来创建\
  \ Rules 文件。\n\n我们简要讨论了以下可用的 Rules 文件小部件：\n\n- 文本行\n- 内容\n- 选择\n- 文本选择器\n- 图形\n-\
  \ 复选框\n- X 选择器\n- 重复块\n\n最后，我们看到了在 Web Publisher 编辑器中查看时某些 Rules 文件小部件的外观。\n"
- "## 15 创建 Presentation 文件\n\n我们在前几章中创建了模板文件并将其与 Rules 文件关联起来。现在剩下的就是创建 Presentation\
  \ 文件（XSL）以将内容文件中的数据格式化为 HTML、WML 等合适的呈现形式。网站页面不过是通过 Web Publisher presentation 文件对内容\
  \ XML 文件的网络呈现，因此在网络内容管理项目中，Presentation 文件的设计和创建至关重要。\n\n此外，Presentation 文件将内容的结构与其布局分离。虽然模板和\
  \ Rules 文件只是捕获内容作者输入的内容的结构，但 Presentation 文件侧重于输入内容如何格式化以生成网络呈现。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_228_0.png)\n\
  \nFigure 15.1: 通过样式表创建呈现\n\n每当内容文件被保存并签入 Docbase 时，Documentum 都会创建呈现。在幕后，Web Publisher\
  \ 将 Presentation 文件（XSL 样式表）应用于内容 XML 文件并生成规定的呈现。Web Publisher 中的 Presentation 文件有两种类型：\n\
  \n- **Editor Presentation 文件（XSL 样式表）**：用于格式化 Web Publisher 编辑器 XML 内容并存储在 Docbase\
  \ 中的以下位置：Site Manager | Presentations | Editor.\n- **External Presentation 文件（HTML\
  \ 包装器）**：用于外部应用程序并存储在 Docbase 中的以下位置：Site Manager | Presentations | External。External\
  \ presentation 文件为嵌入在 HTML 内容文件的 <body></body> 元素中的内容提供标准框架和包装器。\n\n### 15.1 创建\
  \ Presentation 文件\n\n在 Documentum 中创建 Presentation 文件并不是什么大问题，以下步骤说明了如何轻松构建它们并将其与模板文件关联。\n\
  \n1. 以管理员或 Web 开发人员用户身份登录 Web Publisher 并转到 Site Manager | Presentations | Editor。正如我们在\
  \ Rules 文件中所看到的，在 Editor 文件夹内创建一个新文件夹以标识和分离自定义应用程序的特定 Presentation 文件是一个好方法。\n2.\
  \ 选择菜单选项 File | New | Folder。新文件夹创建屏幕出现，如图 15.2 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_229_0.png)\n\
  \nFigure 15.2: 用于存储 Presentation 文件的新文件夹\n\n3. 为您的自定义 Presentation 文件夹提供一个有效名称（例如\
  \ Custom_Presentations）并单击 Finish 按钮。您还可以像 Rules 文件的情况一样将一些 ACL（权限集）附加到此文件夹。\n4.\
  \ 在您喜欢的编辑器（如 XML Spy®、Notepad 等）中创建有效的/格式良好的行业标准 XSL 样式表，并为其提供有意义的名称（例如 cust_news_art_pres.xsl\
  \ 用于新闻文章模板）。将新创建的 Presentation 文件保存在机器硬盘上的方便文件夹位置中。\n\n图 15.3 和 15.4 显示了新闻文章模板的示例\
  \ presentation 文件。请注意，您可以根据特定的业务需求对其进行改进（并且肯定有足够的改进空间！）。\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE xsl:stylesheet [View Source for full doctype...]>\n\
  <xsl:stylesheet version=\"1.0\" xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
  \ xmlns:fo=\"http://www.w3.org/1999/XSL/Format\" xmlns:java=\"http://xml.apache.org/xslt/java\"\
  \ xmlns:xalan=\"http://xml.apache.org/xalan\" exclude-result-prefixes=\"xalan java\
  \ fo\">\n  <xsl:output method=\"html\" encoding=\"ISO-8859-1\" indent=\"yes\" />\n\
  \  <xsl:strip-space elements=\"*\" />\n  <xsl:template match=\"*|@*|comment()|processing-instruction()|text()\"\
  >\n    <xsl:copy>\n      <xsl:apply-templates select=\"*|@*|comment()|processing-instruction()|text()\"\
  \ />\n    </xsl:copy>\n  </xsl:template>\n  <!-- Matching content XML file root\
  \ element -->\n  <xsl:template match=\"NEWSART\">\n    <table border=\"0\">\n  \
  \    <tr>\n        <th>News web site:</th>\n      </tr>\n      <tr>\n        <td>\n\
  \          <br />\n        </td>\n      </tr>\n      <tr>\n        <!-- Capturing\
  \ location path of inserted banner image -->\n        <xsl:variable name=\"imagePath\"\
  >\n          <xsl:value-of select=\"BANNERIMG/img/@src\" />\n        </xsl:variable>\n\
  \        <!-- Capturing alternative text of inserted banner image -->\n        <xsl:variable\
  \ name=\"imageAltText\">\n          <xsl:value-of select=\"IMGALTEXT\" />\n    \
  \    </xsl:variable>\n        <td>\n          <img src=\"{$imagePath}\" alt=\"{$imageAltText}\"\
  \ />\n        </td>\n      </tr>\n      <tr>\n        <td>\n          <br />\n \
  \       </td>\n      </tr>\n      <tr>\n        <!-- Displaying news article date\
  \ -->\n```\n\nFigure 15.3: 新闻文章 Presentation 文件示例\n\n\n\n```\n<!-- Displaying news\
  \ article date -->\n- <td>\n  - <b>\n    - <u>\n      <xsl:copy-of select=\"DATE\"\
  \ />\n    </u>\n  </b>\n</td>\n</tr>\n- <tr>\n  - <td>\n    <br />\n  </td>\n</tr>\n\
  - <tr>\n<!-- Displaying news article body text -->\n- <td>\n  <xsl:copy-of select=\"\
  BODYTEXT\" />\n</td>\n</tr>\n- <tr>\n  - <td>\n    <br />\n  </td>\n</tr>\n<!--\
  \ Iterating through multiple next article links -->\n<xsl:for-each select=\"REPEATBLOCK\"\
  >\n- <tr>\n  - <td>\n    - <a href=\"{NEXTLINKURL}\">\n      <xsl:copy-of select=\"\
  NEXTLINKNAME\" />\n    </a>\n  </td>\n</tr>\n</xsl:for-each>\n</table>\n</xsl:template>\n\
  </xsl:stylesheet>\n```\n\n图 15.4：示例新闻文章演示文件——续\n\n请仔细注意 XSL 样式表中各种模板文件 XML 元素的格式。研究上述演示文件时，将模板\
  \ XML 文件翻到第 13 章并放在旁边可能很有价值。\n\n- 5. 进入步骤 1 中创建的 Custom_Presentations 文件夹并选择 File\
  \ | Import。文件导入选择屏幕会显示，如图 15.5 所示。点击 Add Files 按钮；浏览机器的文件夹路径以选择新创建的演示文件。选择演示文件后，点击\
  \ Next。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_232_0.png)\n\n图 15.5：导入新创建的演示文件\n\
  \n6. 会显示 File Name 字段（参见图 15.6），供您为所选文件提供有效名称。保持演示文件名不变，不要更改它，然后点击 Import。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_232_1.png)\n\
  \n图 15.6：导入演示文件的最后一步\n\n7. 演示文件被导入到 Docbase 中，路径为 /Site Manager/Presentations/Editor/Custom_Presentations。\n\
  现在您已在 Docbase 中创建并导入了演示文件，需要将其与我们在第 13 章中创建的新闻文章模板文件关联起来。但是，请理解，将演示文件与模板文件关联需要为\
  \ Web Publisher 的输出指定一个呈现格式。\n\n## 创建演示文件\n\n呈现格式可以是 Documentum 默认识别的格式，例如 html（标准\
  \ HTML 格式）或 crtext（文本格式），也可以是为业务需求确定的自定义格式。如果您需要我们的演示文件对新闻文章内容文件进行样式设置，并创建 MIME\
  \ 类型为 html 但具有自定义文件扩展名（例如 .cshtml）的呈现格式，那么您需要执行以下操作：\n\n以管理员用户身份登录 Documentum Administrator\
  \ 并进入 Administration | Formats。\n\n选择菜单选项 File | New | Format 并提供新格式的详细信息，如图 15.7\
  \ 所示。详细信息如下：\n\n- Name: `custom_format`\n- Default File Extension: `cshtml`\n- Description:\
  \ `Custom format`\n- Mime Type: `Text/html`\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_233_0.png)\n\
  \n图 15.7：在 Docbase 中创建自定义格式\n\n不要忘记在 Site Publishing 配置中，在 Content Selection Settings\
  \ 部分的 Formats 字段下包含自定义格式。这可确保在发布操作期间，以自定义格式生成的呈现会从 Docbase 发布出去。有关更多信息，请参阅第 21 章。\n\
  \n8. 此步骤需要将演示文件与现有的新闻文章模板文件关联。登录 Web Publisher 并进入 Site Manager | Templates，选择 News_Articles\
  \ 类别。选中 cust_news_art_templ.xml 模板旁边的复选框，并选择菜单选项 View | Associations | Presentations，如图\
  \ 15.8 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_234_0.png)\n\n图 15.8：将演示文件与模板文件关联\n\
  \n9. 显示 Associations | Presentations 屏幕，未显示关联的演示文件。请注意，您可以将特定模板文件与多个演示文件关联，每个演示文件生成不同的呈现格式。点击\
  \ Add 并浏览 Site Manager | Presentations | Editor 文件夹内的自定义演示文件夹（Custom_Presentations）。选择演示文件\
  \ cust_news_art_pres.xsl 并点击 OK。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_234_1.png)\n\
  \n图 15.9：选择要与模板文件关联的演示文件\n\n10. 如图 15.10 所示，选择用于通过演示文件转换内容 XML 文件的呈现格式。在我们的例子中，选择我们在步骤\
  \ 5 中创建的 custom_format。从下拉菜单中选择 custom_format 后，其描述会自动填充到下拉菜单旁边的字段中。\n\n## 创建演示文件\n\
  \n您有选项可以为今后基于所讨论模板创建的所有内容以及已从模板创建并已存在于 Docbase 中的内容指定所选的呈现格式。\n\n点击 OK，然后点击 Close\
  \ 以完成演示文件与模板文件的关联。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_235_0.png)\n\n图 15.10：为演示文件选择呈现格式\n\
  \n### 15.2 查看内容呈现\n\n从内容文件创建的呈现存储在 Docbase 中，与内容文件一起存储。查看呈现的便捷方法是选择已创建的内容文件并选择 View\
  \ | Renditions，如图 15.11 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_235_1.png)\n\
  \n图 15.11：查看内容呈现\n\nWeb Publisher 显示主内容 XML 文件及其呈现格式（如我们的例子中，仅为 Custom 格式呈现），如图\
  \ 15.12 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_236_0.png)\n\n图 15.12：与内容文件关联的呈现\n\
  \n### 15.3 重新应用演示文件\n\n网站中最常见的场景之一是网页布局需要更改。从技术上讲，这需要在演示层（Documentum 中的 presentation/XSL\
  \ 文件）进行修改，而不是在模板文件或规则文件中。一旦演示文件被修改并将其更改版本签入 Docbase，已存在于 Docbase 中的内容会怎样？其呈现是否会根据修改后的演示文件自动更新？对于今后创建的新内容，系统肯定会生成正确的呈现。然而，在运行中的网站中可能存在大量现有内容，所有这些内容都需要根据修改后的演示布局进行更新。\n\
  \n不用担心——在这种情况下，Documentum 提供了名为 reapply presentation 的功能，允许您根据修改后的演示文件更新现有内容的呈现。\n\
  \n以下是实现此目的的一些简单步骤：\n\n- 1. 在 Web Publisher 中浏览现有演示文件，并选中修改后的演示文件旁边的复选框。点击工具栏中显示的\
  \ Apply Presentation 按钮（参见图 15.13）。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_236_1.png)\n\
  \n图 15.13：选择要重新应用的修改后演示文件\n\n## 创建演示文件\n\n- 2. 显示与所选演示文件关联的所有现有内容文件的列表；参见图 15.14。选中这些内容文件旁边的复选框并点击\
  \ OK。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_237_0.png)\n\n图 15.14：与演示文件关联的内容文件列表\n\
  \n系统需要一些时间将修改后的演示布局重新应用到所选内容文件。您可以通过点击 Web Publisher 浏览器状态栏中的 Task Status 按钮来检查重新应用操作的进度。\n\
  \n### 15.4 在样式表中使用 XDQL\n\nXDQL 是 eXtensible Document Query Language 的缩写，正如名称所示，是一种从\
  \ XML 中触发 DQL 查询并通过 XML 处理查询结果的便捷机制。演示文件（或 XSL 样式表）可以从 XDQL 中极大地受益。\n\nDQL 查询（仅选择，不进行任何更新！）可以使用\
  \ Documentum 的 XDQL 接口从演示文件中调用：com.documentum.xml.xdql.IDfXmlQuery。\n\n此接口中定义的一组方法已由类\
  \ DfXmlQuery 实现。\n\nDQL 查询结果以 XML 文档的形式存在，可以通过标准 XPath 语言和 XSL 样式表中可用的其他语言语义进行解析/处理。\n\
  \n这通过一个简单易用的 Documentum 接口利用了 XML 和 XSL 的工业标准且广泛使用的处理能力，该接口充当 DQL 的 XML 包装器。\n\n\
  从性能角度来看，这相当合理，因为 DQL 查询在 Docbase 中触发，结果通过 Documentum 层中的 XSLT 进行处理。一旦通过 XDQL 从 Docbase\
  \ 获取 XML 内容文件中的动态数据，它就会通过 XSLT 转换为 Web 呈现格式（网页）并发布到网站！\n\n\n\n请注意，XDQL 通常在 XSL 样式表中使用，只要您需要在网页上显示来自\
  \ Docbase 的实时（动态）数据。如果没有 XDQL，过时的数据将通过静态网页呈现在网站上。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_238_0.png)\n\
  \n图 15.15：XDQL 的工作原理\n\n## 15.5 XSL 样式表中的 XDQL 示例\n\n让我们通过一个简单的示例来了解 XDQL 如何在演示文件（XSL\
  \ 样式表）中动态获取 Docbase 数据。\n\n以下示例模板文件将通过 XSL 样式表进行转换：\n\n```\n<?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?>\n<ROOTTAG>\n  <TITLEOFPAGE/>\n  <SHORTDESC/>\n</ROOTTAG>\n\
  ```\n\n此示例中的 XSL 样式表将用于创建上述模板 XML 文件的 HTML 转换。转换后的文件（HTML 网页呈现）将显示使用上述模板创建的内容文件的名称（object_name\
  \ 属性）。\n\n创建 XSL 文件（如图 15.16 和 15.17 所示），并将其导入 Docbase 中的以下位置：/Site Manager/Presentations/Editor/Custom_Presentations。\n\
  \n## 创建演示文件\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE xsl:stylesheet\
  \ (View Source for full doctype...)>\n<xsl:stylesheet version=\"1.0\" xmlns:xsl=\"\
  http://www.w3.org/1999/XSL/Transform\" xmlns:fo=\"http://www.w3.org/1999/XSL/Format\"\
  \nxmlns:java=\"http://xml.apache.org/xalan/java\" xmlns:xalan=\"http://xml.apache.org/xalan\"\
  \ exclude-result-prefixes=\"xalan java fo\">\n<xsl:output method=\"html\" encoding=\"\
  ISO-8859-1\" indent=\"yes\" />\n<xsl:param name=\"DMS_SESSION_ID\" select=\"'default\
  \ value'\" />\n<xsl:param name=\"DMS_INPUT_OBJECT_ID\" />\n<xsl:strip-space elements=\"\
  *\"/>\n<xsl:template match=\"*|@|comment()|processing-instruction()|text()\">\n\
  \  <xsl:copy>\n    <xsl:apply-templates select=\"*|@|comment()|processing-instruction()|text()\"\
  \ />\n  </xsl:copy>\n</xsl:template>\n<!-- variable storing the DQL query -->\n\
  <xsl:variable name=\"dqlQuery\">\nselect r_object_id, object_name from dm_document\
  \ where r_object_id = '\n<xsl:value-of select=\"$DMS_INPUT_OBJECT_ID\" />\n'\n</xsl:variable>\n\
  <!-- variable storing the DQL query results -->\n<xsl:variable name=\"query_results\"\
  >\n  <xsl:call-template name=\"XDQL\">\n    <xsl:with-param name=\"dql\" select=\"\
  string($dqlQuery)\" />\n  </xsl:call-template>\n</xsl:variable>\n<!-- variable storing\
  \ the 'object_name' attribute from query results -->\n<xsl:variable name=\"ObjectName\"\
  >\n  <xsl:for-each select=\"xalan:nodeset($query_results)/xdql/object\">\n    <xsl:value-of\
  \ select=\"object_name\" />\n  </xsl:for-each>\n</xsl:variable>\n<!-- Matching content\
  \ XML file root element -->\n<xsl:template match=\"ROOTTAG\">\n<table border=\"\
  0\">\n  <tr>\n    <th>File name:</th>\n  </tr>\n</tr>\n  <tr>\n    <td>\n      <br\
  \ />\n    </td>\n  </tr>\n</tr>\n  <!-- Displaying the name of the file 'object\
  \ name' attribute -->\n```\n\n图 15.16：使用 XDQL 的示例 XSL 文件\n\n```\n<!-- Displaying\
  \ the name of the file ('object_name' attribute) -->\n<td>\n  <b>\n    <u>\n   \
  \     <xsl:value-of select=\"$ObjectName\" />\n      </u>\n    </b>\n  </td>\n</tr>\n\
  <tr>\n  <td>\n      <br />\n    </td>\n  </tr>\n<tr>\n  <!-- Displaying short description\
  \ -->\n  <td>\n    <xsl:copy-of select=\"SHORTDESC\" />\n  </td>\n</tr>\n<tr>\n\
  \  <td>\n      <br />\n    </td>\n  </tr>\n</table>\n</xsl:template>\n<!-- Template\
  \ code for integrating DQL queries in XSL Starts -->\n<xsl:template name=\"XDQL\"\
  >\n  <xsl:param name=\"dql\" />\n  <xsl:param name=\"rootTag\" select=\"string('xdql')\"\
  \ />\n  <xsl:param name=\"UpperTags\" select=\"string('false')\" />\n  <xsl:param\
  \ name=\"MaxRows\" select=\"10\" />\n  <xsl:param name=\"RowIDAttrName\" select=\"\
  ID\" />\n  <xsl:param name=\"RowsetTag\" select=\"Row\" />\n  <xsl:param name=\"\
  UseGivenCaseTagNames\" select=\"true\" />\n  <xsl:param name=\"UseNullAttrIndicator\"\
  \ select=\"false\" />\n  <xsl:variable name=\"xdql\" select=\"java:com.documentum.xml.xdql.DfXmlQuery.new()\"\
  \ />\n  <xsl:variable name=\"init\" select=\"java:init($xdql)\" />\n  <xsl:variable\
  \ name=\"param\" select=\"java:setDql($xdql,$dql)\" />\n  <xsl:variable name=\"\
  param1\" select=\"java:setRootNode($xdql,$rootTag)\" />\n  <xsl:variable name=\"\
  param3\" select=\"java:includeContent($xdql,false())\" />\n  <xsl:variable name=\"\
  setContentEncoding\" select=\"java:setContentEncoding($xdql,string('dom'))\" />\n\
  \  <xsl:variable name=\"setContentFormat\" select=\"java:setContentFormat($xdql,string('xml'))\"\
  \ />\n  <xsl:variable name=\"execute\" select=\"java:execute($xdql, 'DF_READ_QUERY',\
  \ $DMS_SESSION_ID)\" />\n  <xsl:variable name=\"queryresult\" select=\"java:getXMLDOM($xdql)\"\
  \ />\n  <xsl:copy-of select=\"$queryresult\" />\n</xsl:template>\n<!-- Template\
  \ code for integrating DQL queries in XSL Ends -->\n</xsl:stylesheet>\n```\n\n图\
  \ 15.17：使用 XDQL 的示例 XSL 文件——续\n\n我们现在将讨论上述 XSL 样式表的结构：\n\n- **Namespaces**：在演示文件的\
  \ `<xsl:stylesheet>` 标签中添加以下 Java 和 Xalan 命名空间。例如：\n  ```xml\n  <xsl:stylesheet\
  \ version=\"1.0\"\n  xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\n  xmlns:fo=\"\
  http://www.w3.org/1999/XSL/Format\"\n  xmlns:java=\"http://xml.apache.org/xslt/java\"\
  \n  xmlns:xalan=\"http://xml.apache.org/xalan\" exclude-result-prefixes=\n  \"xalan\
  \ java fo\">\n  ```\n- **Parameters**：声明系统传递给样式表的参数。例如：\n  ```xml\n  <xsl:param\
  \ name=\"DMS_SESSION_ID\" select=\"'default value'\"/>\n  <xsl:param name=\"DMS_INPUT_OBJECT_ID\"\
  />\n  ```\n- **XDQL classes**：使用 `<xsl:template>` 标签定义一个 XSL 模板，以实例化 `DFxmlQuery()`\
  \ 类，传递 XDQL 参数，并在 XSL 样式表内部执行 DQL 查询。例如：\n  ```xml\n  <xsl:template name=\"XDQL\"\
  >\n  <xsl:param name=\"dql\"/>\n  <xsl:param name=\"roottag\" select=\"string('dql')\"\
  />\n  <xsl:param name=\"UpperTags\" select=\"string('false')\"/>\n  <xsl:param name=\"\
  MaxRows\" select=\"10\"/>\n  <xsl:param name=\"RowIDAttrName\" select=\"ID\"/>\n\
  \  <xsl:param name=\"RowSetTag\" select=\"Row\"/>\n  <xsl:param name=\"UseGivenCaseTagNames\"\
  \ select=\"true\"/>\n  <xsl:param name=\"UseNullAttrIndicator\" select=\"false\"\
  />\n  <xsl:variable name=\"xdql\" select=\"java:com.documentum.xml.xdql.DFxmlQuery.new()\"\
  />\n  <xsl:variable name=\"init\" select=\"java:init($xdql)\"/>\n  <xsl:variable\
  \ name=\"param\" select=\"java:setDql($xdql,$dql)\"/>\n  <xsl:variable name=\"param1\"\
  \ select=\"java:setRootNode($xdql,$roottag)\"/>\n  <xsl:variable name=\"param3\"\
  \ select=\"java:includeContent($xdql,false())\"/>\n  <xsl:variable name=\"setContentEncoding\"\
  \ select=\"java:setContentEncoding($xdql,string('dom'))\"/>\n  <xsl:variable name=\"\
  setContentFormat\" select=\"java:setContentFormat($xdql,string('xml'))\"/>\n  <xsl:variable\
  \ name=\"execute\" select=\"java:execute($xdql, 'DF_READ_QUERY', $DMS_SESSION_ID)\"\
  />\n  <xsl:variable name=\"queryresult\" select=\"java:getXMLDOM($xdql)\"/>\n  <xsl:copy-of\
  \ select=\"$queryresult\"/>\n  </xsl:template>\n  ```\n\nDMS_SESSION_ID 是对当前 Docbase\
  \ 会话的引用，而 DMS_INPUT_OBJECT_ID 是对当前对象 ID（r_object_id 属性）的引用。\n\n建议查阅 com.documentum.xml.xdql.IDFxmlQuery\
  \ 接口的 DFC Javadocs，以了解上文所示的 <xsl:template name=\"XDQL\"> 中使用的众多方法的参数和返回类型。\n\n变量：\n\
  定义一个变量来存储从样式表内部调用的 DQL 查询。\n例如：\n```xml\n<xsl:variable name = \"dqlQuery\">select\
  \ r_object_id, object_name from dm_document where r_object_id = '<xsl:value-of select=\"\
  $DMS_INPUT_OBJECT_ID\"/>' </xsl:variable>\n```\n\n此代码存储用于获取当前内容文件（即其对象 ID 与当前对象\
  \ ID DMS_INPUT_OBJECT_ID 匹配）的对象 ID（r_object_id 属性）和文件名（object_name 属性）的 DQL 查询字符串。\n\
  \n此外，通过调用预定义的 XDQL 模板并向其传递 DQL 查询字符串，定义一个变量来存储上述 DQL 查询的结果。例如：\n\n```\n<xsl:variable\
  \ name = \"query_results\">\n  <xsl:call-template name=\"XDQL\">\n    <xsl:with-param\
  \ name=\"dql\" select=\"string($dqlQuery)\"/>\n  </xsl:call-template>\n</xsl:variable>\n\
  ```\n\n一旦将查询结果保存在变量中，就遍历它，检索所需的属性（在本例中为 object_name）并将其保存在变量中。\n\n```\nFor example:\n\
  <xsl:variable name=\"ObjectName\">\n  <xsl:for-each select=\"xalan:nodeset($query_results)/xdql/object\"\
  >\n    <xsl:value-of select=\"object_name\"/>\n  </xsl:for-each>\n</xsl:variable>\n\
  ```\n\n在 Web Publisher 中在 XSL 样式表中使用 XDQL 时，这就是需要处理的所有内容。在我们的示例中，显示内容文件的名称（object_name\
  \ 属性）只需访问 objectName 变量的值即可。例如：\n\n```\n<!-- Displaying the name of the file (object_name\
  \ attribute) -->\n<td><b><u><xsl:value-of select=\"$objectName\"/></u></b></td>\n\
  ```\n\n请注意，通过使用 $(variableName)，系统会在运行时替换变量中包含的值。\n\n## 15.6 Create_Dynamic_Content\
  \ 作业\n\n使用 XDQL 查询的演示文件可以在以下情况下检索 Docbase 内容及其属性：\n\n- 从模板创建新内容文件并在 Web Publisher\
  \ 编辑器中保存\n- 编辑并保存现有内容文件\n- 对现有内容使用重新应用演示功能\n\n然而，对于那些已发布并在网站上显示的活动内容文件，但其底层数据（属性或内容值）在\
  \ Docbase 中已被修改，会发生什么情况？内容作者是否必须再次编辑/保存并重新发布这些内容文件，以确保再次触发 XDQL 查询并在运行的网站上显示修改后的数据？答案是否定的。\n\
  \n\n\n## 创建演示文稿文件\n\n在以下情况下需要执行以下步骤以利用 Documentum 提供的开箱即用功能：\n\n- 1. 在 Web Publisher\
  \ 中浏览到模板 XML 文件，并点击模板旁的信息图标（i）。选择 Publishing 选项卡并选中“当相关内容被修改时自动刷新此页面”旁边的复选框（参见图\
  \ 15.18）。点击确定。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_243_0.png)\n\n图 15.18：为内容模板设置内容刷新标志\n\
  \n- 2. 以管理员身份登录 Documentum Administrator 并进入 Job Management | Jobs。选择如图 15.19 所示的\
  \ Create_Dynamic_Content 作业。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_243_1.png)\n\
  \n图 15.19：Documentum Administrator 中的 Create_Dynamic_Content 作业\n\n首先确保此作业处于活动状态，然后为其设置在\
  \ Docbase 中定期运行的便捷计划。这是一个 Web Publisher 作业，可以设置为定期运行，以转换处于活动状态且其模板的内容刷新标志设置为 true\
  \ 的内容文件。该作业会重新应用活动内容文件上的演示文稿文件，从而确保正确的 DQL 查询结果保存到转换后的输出网页呈现中。\n\nCreate_Dynamic_Content\
  \ 作业转换现有活动对象后，您可以通过 Site Caching Service 站点发布配置将其发布到网站（SCS 目标）。\n\n请注意，发布操作的详细信息将在第\
  \ 21 章中介绍。\n\n以上全部关于演示文稿文件、其用途以及 Documentum 中可用的功能。您可以通过浏览互联网来探索样式表。一般来说，网络上存在大量专门介绍\
  \ XSL 及其高级功能的网站。要深入了解 Web Publisher 演示文稿文件，您应阅读 Web Publisher 管理手册。\n\n## 15.7 摘要\n\
  \n演示文稿文件是用于格式化内容文件以在网站上以所需呈现形式显示的样式表。在本章中，我们简要讨论了 Documentum 如何使用 Xerces XSL 转换引擎将演示文稿文件应用于内容\
  \ XML 文件以创建呈现。\n\n然后我们看到了在 Web Publisher 中创建演示文稿文件并将其与模板文件关联的详细步骤。我们还看到了如何在 Documentum\
  \ 中创建自定义格式并以自定义格式输出呈现。然后我们讨论了如何将更新的演示文稿文件重新应用于 Docbase 中现有内容。\n\n接下来，我们讨论了 X DQL（可扩展文档查询语言）及其优势，并通过示例了解了它如何从\
  \ XML 内部触发 DQL 查询并通过 XML 处理查询结果。\n\n最后，我们提到了一个 Web Publisher 作业 Create_Dynamic_Content，可以将其安排为定期运行，以自动将演示文稿文件重新应用于活动内容文件，从而在\
  \ Docbase 中创建更新的呈现。\n\n## 16 文件夹映射\n\n## 文件夹映射\n\n所有内容贡献者在为其网站创建内容时都会面临一个共同问题。为了创建内容，他们需要了解网站结构，以便在\
  \ Documentum 中将内容创建在正确的文件夹下。如果他们在错误的文件夹下创建内容，已发布的内容将被网站应用程序错误读取，内容将显示在网站的错误部分！\n\
  \n通常，企业网站的文件夹结构相当复杂，培训用户在 Documentum 中在完全镜像的文件夹下输入内容既困难又存在人为错误的可能性。下面举一个简单的例子来说明这一点：\n\
  \n假设一家假设的企业生产一些产品，根据其专有的业务分类分为 category 1、2 和 3。然而，显示产品信息的最终网站分别在网站部分 Low end output、Average\
  \ performance 和 High throughput products 下显示这些产品。\n\n在创建内容时，业务用户将其归类为 category 1、2\
  \ 或 3。Folder Map 在幕后将内容放置在网站上的适当文件夹结构下，而无需业务用户了解网站的确切文件夹结构。如果出于某种原因需要在网站上更改这些部分的名称，则无需对内容创建者进行培训。只需更新\
  \ Folder Map 配置，内容创建过程即可无缝继续。\n\n图 16.1 显示了业务用户如何使用简单类别创建内容，以及 Documentum 如何使用 Folder\
  \ Map 将其映射到网站所需的实际文件夹结构。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_247_0.png)\n\
  \n图 16.1：Folder Map 的工作原理\n\nWeb Publisher Folder Map (`FolderMap.xml`) 是一个简单的 XML\
  \ 文件，其中包含根据内容文件的 Docbase 属性将创建的内容文件映射到 Web Cabinets 中指定文件夹所需的规则。\n\n如果 Documentum\
  \ 发现内容文件的属性与 Folder Map 规则中定义的属性值匹配，则 Documentum 会将内容文件放置在 `FolderMap.xml` 中指定的文件夹位置。\n\
  \n值得一提的是，每当创建新内容或更新内容属性时，Documentum Web Publisher 都会读取 `FolderMap.xml`。\n\n- 如果您以管理员身份登录\
  \ Web Publisher，您可以在 Site Manager | Configurations | Foldermaps 文件夹下查看默认的 `FolderMap.xml`\
  \ 文件，如图 16.2 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_248_0.png)\n\n图 16.2：Web\
  \ Publisher 中看到的 FolderMap.xml 文件\n\n空 FolderMap.xml 文件的结构如下所示：\n\n```\n<folder_map>\n\
  \  <rule>\n    <attr_list>\n      <attr>\n        <name></name>\n        <value></value>\n\
  \      </attr>\n    </attr_list>\n    <path_list>\n      <path></path>\n    </path_list>\n\
  \  </rule>\n  <rule>\n    <attr_list>\n      <attr>\n        <name></name>\n   \
  \     <value></value>\n      </attr>\n    </attr_list>\n    <path_list>\n      <path></path>\n\
  \    </path_list>\n  </rule>\n</folder_map>\n```\n\n### 16.1 FolderMap.xml 文件的结构\n\
  \n请参阅图 16.3 以了解 FolderMap.xml 中的各种 XML 元素。\n\n| 文件夹映射元素 | 执行的功能 |\n|---|---|\n|\
  \ `<rule>` | 表示 Folder Map 中指定的每个规则。每个 `<rule>` 可以有 0 个或多个 `<attr_list>` 标签和 1 个或多个\
  \ `<path_list>` 标签。 |\n| `<attr_list>` | 表示属性规则/条件列表。只有当此标签中指定的所有属性值条件都满足时，Folder\
  \ Map 规则才适用。 |\n| `<attr>` | 这是一个名称-值对，表示一个属性名称及其值。 |\n| `<name>` | Docbase 属性的名称，例如\
  \ subject。 |\n| `<value>` | Docbase 属性的值。 |\n| `<path_list>` | 表示如果规则匹配，内容文件将被放置的一组路径/位置。\
  \ |\n| `<path>` | Web Publisher Docbase 中内容文件将被放置的完整路径。 |\n\n图 16.3：Folder Map XML\
  \ 元素\n\n### 16.2 Folder Map 的局限性\n\n就像所有优秀的系统一样，Folder Map 也有其局限性，在设计内容映射规则时我们应注意。\n\
  \n下面列出了 Web Publisher 中 Folder Map 的一些局限性。要全面了解文件夹映射，请阅读 Documentum Web Publisher\
  \ 管理员指南。\n\n- Web Publisher 不允许您更改文件夹映射文件 (`FolderMap.xml`) 的名称。\n- `FolderMap.xml`\
  \ 的权限集（ACL）默认情况下为 WebPublisher User Default ACL 且无法更改。\n- 如果在 Docbase 中不存在 `FolderMap.xml`\
  \ 中指定的文件夹结构，Folder Mapping 会自动在 Docbase 中创建文件夹。但是，如果指定的 Web Cabinet 在 Docbase 中不存在，Folder\
  \ Mapping 不会自动创建它，而是会抛出错误。\n- 文件夹映射从 `FolderMap.xml` 文件的最顶层规则工作到文件中指定的最后一条规则。我们需要先定义具体的规则，然后再跟进一些通用规则。对于熟悉\
  \ Java 中异常处理最佳实践的人来说，这类似于在处理通用异常之前捕获特定于应用程序的异常。\n- 一旦匹配到特定规则，Folder Mapping 就会停止进一步扫描\
  \ `FolderMap.xml` 文件。\n\n理论够多了？让我们借助几个实际示例来了解 Folder Mapping 的工作原理。\n\n\n\n## 16.3\
  \ 文件夹映射示例\n\n本节包含示例，解释如何在 Documentum 中实际实现文件夹映射。\n\n### 16.3.1 属性匹配：使用通配符 (*)\n\n\
  让我们从一个简单的示例开始，其中文件夹映射配置为：仅当用户在创建内容时为其 subject 属性提供非空白值时，内容文件才会被放置在 Web Cabinet 中的指定位置。\n\
  \n1. 以管理员身份登录 Web Publisher，并在 Site Manager | Configurations | Foldermaps 下检出 FolderMap.xml\
  \ 文件。按如下所示修改 FolderMap.xml 文件，然后将其签回 Docbase。\n\n```\n<folder_map>\n    <rule>\n\
  \        <attr_list>\n            <attr>\n                <name>subject</name>\n\
  \                <value>*</value>\n            </attr>\n        </attr_list>\n \
  \       <path_list>\n            <path>/Test_webCabinet/Subject_Content</path>\n\
  \        </path_list>\n    </rule>\n    <rule>\n        <attr_list>\n          \
  \  <attr>\n                <name></name>\n                <value></value>\n    \
  \        </attr>\n        </attr_list>\n        <path_list>\n            <path></path>\n\
  \        </path_list>\n    </rule>\n</folder_map>\n```\n\n尝试使用模板创建一些内容并将 Subject:\
  \ 字段留空。会抛出以下错误；可在 Web Publisher 状态栏中点击 All Messages 按钮查看：\n\n新内容无法创建。根据文件夹映射，此文件无法链接到任何\
  \ Web 柜。您的文件将不会被创建。\n\n## 文件夹映射\n\n2. 通过为 Subject: 字段提供非空白值来创建新内容，如图 16.4 所示。\n\n\
  ![](img/b18244e6621ecc39cef03ff6c0e55e7c_251_0.png)\n\n图 16.4：为 Subject 属性提供非空白值\n\
  \n3. 请注意，新内容已成功创建（参见图 16.5），位于 Web Cabinet 中指定的 Docbase 位置 /Test_WebCabinet/Subject_Content\
  \ 下。\n\n> 确保 Web Cabinet Test_WebCabinet 已存在于 Docbase 中。如果不存在，请在开始创建内容并尝试文件夹映射示例之前先创建它。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_252_0.png)\n\n图 16.5：在 Web Cabinet 文件夹中成功创建内容\n\
  \n### 16.3.2 属性匹配：在 <attr_list> 中使用多个属性\n\n现在让我们举一个示例，其中文件夹映射配置为：仅当内容满足以下两个属性条件时，内容文件才会被放置在\
  \ Web Cabinet 中的指定位置：\n\n它应具有非空白的 Name: 字段（object_name 属性），并且其 Subject: 字段（subject\
  \ 属性）的值应为 office。在同时满足这两个条件之前，内容文件不会被创建。\n\n1. 以管理员身份登录 Web Publisher，并在 Site Manager\
  \ | Configurations | Foldermaps 下检出 FolderMap.xml 文件。按如下所示修改 FolderMap.xml 文件，然后将其签回\
  \ Docbase。\n\n```\n<folder_map>\n    <rule>\n        <attr_list>\n            <attr>\n\
  \                <name>object_name</name>\n                <value></value>\n   \
  \         </attr>\n            <attr>\n                <name>subject</name>\n  \
  \              <value>office</value>\n            </attr>\n        </attr_list>\n\
  \        <path_list>\n            <path>/Test_WebCabinet/official docs</path>\n\
  \        </path_list>\n    </rule>\n    <rule>\n        <attr_list>\n          \
