  \ 字段\n\n在 Web Publisher 编辑器中打开另一个内容文件 Testing2_Original_Template.xml 仍会根据模板文件的旧版本显示\
  \ Cost: 字段。\n\n这是一个从内容文件中删除现有 XML 元素的简单示例。让我们继续进行更多示例，以便更好地理解指令文件的强大功能。\n\n## 17.2.2\
  \ 使用 <insert-element> 向 XML 文件添加 XML 元素\n\n让我们举一个示例，其中内容是从简单的模板 XML 文件创建的，然后向模板文件添加新的\
  \ XML 元素。现有内容通过使用 <insert-element> 指令的指令文件进行更新。\n\n1. 根据以下结构更新现有模板文件（original_Template.xml）及其关联的规则文件（original_TemplateRules.xml）：\n\
  \n更新后的模板文件 Original_Template.xml：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<PRODUCTINFO>\n    <NAME/>\n    <SHORTDESC/>\n    <PRODUCTTYPE/>\n    <PRICEINFO/>\n\
  </PRODUCTINFO>\n```\n\n请注意，我们已向模板文件添加了新的 <PRICEINFO> XML 元素。\n\n更新后的规则文件 Original_TemplateRules.xml：\n\
  \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<rules>\n    <tagcontent tag_name=\"\
  NAME\">\n        <textline instruction=\"Please enter a name\" label=\"Product name:\"\
  \ required=\"Y\">\n        </textline>\n    </tagcontent>\n\n    <tagcontent tag_name=\"\
  SHORTDESC\">\n        <content instruction=\"please provide a short description\
  \ for product\" label=\"Product Description:\" lines=\"5\">\n        </content>\n\
  \    </tagcontent>\n\n    <tagcontent tag_name=\"COST\">\n        <textline instruction=\"\
  Please enter cost in dollars\" label=\"Cost:\">\n        </textline>\n    </tagcontent>\n\
  \n    <tagcontent tag_name=\"PRODUCTTYPE\">\n        <choice instruction=\"Please\
  \ choose a type\" label=\"Product Type:\" values=\"Type A,Type B,Type C\">\n   \
  \     </choice>\n    </tagcontent>\n\n    <tagcontent tag_name=\"PRICEINFO\">\n\
  \        <textline charlength=\"50\" instruction=\"Please enter a price for the\
  \ product\" label=\"Enter price:\">\n        </textline>\n    </tagcontent>\n</rules>\n\
  ```\n\n图 17.13 显示了 Web Publisher 模板编辑器屏幕。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_278_0.png)\n\
  \n图 17.13：创建新内容时显示的 Web Publisher 编辑器\n\n2. 使用任意 XML 编辑器，创建一个指令文件（Add_Element_Instruction.xml），该文件通过添加新的\
  \ <PRICEINFO> XML 元素来更新内容 XML 文件。\n\n以下指令文件（Add_Element_Instruction.xml）可在此类场景中使用：\n\
  \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<instructions xmlns =\"http://www.documentum.com/wp\"\
  \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:schemaLocation=\"\
  http://www.documentum.com/wp instructions.xsd\">\n<insert-element>\n<path>/PRODUCTINFO</path>\n\
  <nodename>PRICEINFO</nodename>\n<value>$ 100</value>\n<comments>testing insert element\
  \ PRICEINFO</comments>\n</insert-element>\n</instructions>\n```\n\n\n\nAnatomy of\
  \ the above Instruction File:\n\n- `<insert-element>`: Instruction File element\
  \ to add an XML element to an XML content file\n- `<path>`: XPath expression to\
  \ identify the path where the XML element to be inserted/added currently exists\n\
  - `<nodename>`: Name of the target node (XML element) to be inserted\n- `<value>`:\
  \ Text value of the XML element to be set\n- `<comments>`: Optional comments stating\
  \ the purpose of the Instruction File\n\n3. Browse to Site Manager | Instructions\
  \ from the left tree pane in Web Publisher as an administrator and import the Add_Element_Instruction.xml\
  \ Instruction File by choosing the File | Import option. Complete all the steps\
  \ described in the previous example.\n\n4. Update the content file Testing1_Original_Template.xml\
  \ with the Instruction File Add_Element_Instruction.xml. You can verify that the\
  \ version of the Testing1_Original_Template.xml file has been updated.\n\nChoose\
  \ the file and click on File | Export to export the updated content file on your\
  \ client machine.\n\nHere is the updated content file Testing1_Original_Template.xml\
  \ after the Add_Element_Instruction.xml Instruction File has been applied:\n\n```\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<PRODUCTINFO>\n    <NAME>Prod A</NAME>\n\
  \    <SHORTDESC>\n<p>\nThis is of type A\n</p>\n    </SHORTDESC>\n\n    <PRODUCTTYPE>Type\
  \ A</PRODUCTTYPE>\n<PRICEINFO>$ 100</PRICEINFO>\n</PRODUCTINFO>\n```\n\nNotice that\
  \ the <PRICEINFO> XML element has been added in this content file with the value\
  \ $ 100.\n\nThe other content file (Testing2_Original_Template.xml) is still in\
  \ version 1.0 since it was not updated via the Instruction File.\n\nIf you edit\
  \ the content Testing1_Original_Template.xml using Web Publisher editor, the Enter\
  \ price: field will be shown as per the updated template structure (refer to figure\
  \ 17.14).\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_280_0.png)\n\nFigure 17.14:\
  \ Enter price field shown as per updated template file\n\n### 17.2.3 Updating the\
  \ Value of an XML Element in an XML File with <update-element-value>\n\nLet us now\
  \ take an example where content is created from a simple template XML file and then\
  \ the value of an XML element in content files is to be updated. The existing content\
  \ is updated via an Instruction File using the <update-element-value> instruction.\n\
  \n+   1. Using any XML editor, create an Instruction File update_Element_value_Instruction.xml\
  \ that updates content XML files by updating the value of their <PRICEINFO> XML\
  \ element.\n\nThe following Instruction File (update_Element_value_Instruction.xml)\
  \ can be used in such a scenario:\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<instructions xmlns =\"http://www.documentum.com/wp\"\nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \nxsi:schemaLocation=\"http://www.documentum.com/wp instructions.xsd\">\n<update-element-value>\n\
  <path>/PRODUCTINFO</path>\n<nodename>PRICEINFO</nodename>\n<value>Price Not available</value>\n\
  <comments>Updating the value of PRICEINFO element</comments>\n</update-element-value>\n\
  </instructions>\n```\n\nAnatomy of this Instruction File:\n\n- `<update-element-value>`:\
  \ Instruction File element to set a new text value for the specified XML element\
  \ in an XML content file\n- `<path>`: XPath expression to identify the path where\
  \ the XML element to be updated currently exists\n- `<nodename>`: Name of the target\
  \ node (XML element) whose value needs to be updated\n- `<value>`: The new text\
  \ value that needs to be set for the XML element in question\n- `<comments>`: Optional\
  \ comments stating the purpose of the Instruction File\n\n+   2. Browse to Site\
  \ Manager | Instructions from the left tree pane in Web Publisher as an administrator\
  \ and import the Update_Element_Value_Instruction.xml Instruction File by choosing\
  \ the File | Import option. Complete all the steps as described in the first example.\n\
  +   3. Update the content file Testing1_Original_Template.xml with the Instruction\
  \ File Update_Element_Value_Instruction.xml. You can verify that the version of\
  \ the Testing1_Original_Template.xml file has been updated.\n+   4. Choose the file\
  \ and click on File | Export to export the updated content file on your client machine.\n\
  \nThe updated content file Testing1_Original_Template.xml after Update_Element_Value_Instruction.xml\
  \ Instruction File has been applied:\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<PRODUCTINFO>\n  <NAME>Prod A</NAME>\n  <SHORTDESC>\n    <p>\nThis is of type\
  \ A\n    </p>\n  </SHORTDESC>\n  <PRODUCTTYPE>Type A</PRODUCTTYPE>\n  <PRICEINFO>\n\
  \    Price Not available\n  </PRICEINFO>\n</PRODUCTINFO>\n```\n\nNotice that the\
  \ value of the <PRICEINFO> XML element has been updated in this content file with\
  \ the value Price Not available.\n\nThe other content file (Testing2_Original_Template.xml)\
  \ is still in version 1.0 since it was not updated via the Instruction File.\n\n\
  If you edit the content Testing1_Original_Template.xml using Web Publisher editor,\
  \ the Enter price: field will be shown as per the updated template structure (refer\
  \ to figure 17.15).\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_282_0.png)\n\nFigure\
  \ 17.15: Updated value of Enter price field in Web Publisher editor\n\nThis should\
  \ give you all a fairly good understanding of Instruction Files and their usage\
  \ scenarios. For a comprehensive understanding of Instruction Files, go through\
  \ the Documentum Web Publisher Administration guide.\n\n## 17.3 Summary\n\nIn this\
  \ chapter we learned that Web Publisher Instruction Files provide configurable XML\
  \ elements allowing us to update the structure of existing XML content files as\
  \ per the updated template structure.\n\nWe also looked at some of the XML elements\
  \ in Instruction Files and discussed the limitations of using Instruction Files\
  \ in Web Publisher.\n\nWith the help of detailed examples, we saw how to use Instruction\
  \ Files to delete an XML element from a content XML file, add a new XML element,\
  \ and update the existing value of an XML element.\n\n## 18 Automatic Property Extraction\
  \ (APE)\n\n## Automatic Property Extraction (APE)\n\nAutomatic property extraction\
  \ (or APE in short) is one of the most powerful and useful features provided by\
  \ Documentum DFC. One of the most frequent business needs is to automatically set\
  \ a document's attributes (properties) based on the values set by the content creator\
  \ in the content template (XML file). Let us understand this through a very simple\
  \ example.\n\nImagine a fictitious template that requires users to fill in an Article\
  \ Title field in the XML template. The requirement is that the value entered by\
  \ the content creator in this field should be automatically saved in the title attribute\
  \ (property) of the document as well.\n\nLet's say that the content creator provides\
  \ the following value for Article Title: Major breakthrough in financial investments.\
  \ The value is saved in the <ARTICLE TITLE> XML element (for example) in the content\
  \ file created by the user.\n\nThrough its Automatic Property Extraction feature\
  \ (and if configured correctly), Documentum automatically copies the value specified\
  \ by the user in the <ARTICLE TITLE> field in to the title attribute (property)\
  \ of the document, whenever the user saves and checks in the document.\n\nThrough\
  \ some other configuration settings, it could even work the other way round. The\
  \ XML element can also be populated automatically based on the value provided by\
  \ a user in the attribute for the document.\n\nProperty extraction adds value for\
  \ the business content creators in the following ways:\n\n- It saves the effort\
  \ of manually entering the same value at two places—the properties page and the\
  \ content file (template editor).\n- It saves the effort (and time) to open Web\
  \ Publisher editor by allowing them to enter values in the Properties page itself.\n\
  \nNote that Automatic property extraction works with the following Web Publisher\
  \ widgets only:\n\n- textline\n- checkbox\n- choice\n\n### 18.1 How Automatic Property\
  \ Extraction Works\n\nInternally Documentum uses the following two object types\
  \ for managing Automatic property extraction for XML elements:\n\n- `dm_xml_application`\
  \ (supertype: `dm_folder`): Used for creating a folder under the \\System\\Applications\
  \ folder in Docbase to store the XML configuration objects (`dm_xml_config`).\n\
  - `dm_xml_config` (supertype: `dm_document`): Specifies the XML configuration file\
  \ to be used for the specified XML application.\n\nThe property extraction rules\
  \ need to be specified within the XML configuration file. Once you have created\
  \ the XML application folder and saved the XML configuration file within it, you\
  \ need to set the a_category attribute of the content file. DFC queries this attribute\
  \ and detects the Automatic Property Extraction rules to be applied to the content\
  \ file based on its XML configuration file. You, however, need to ensure that the\
  \ dm_xml_application folder and the dm_xml_config application file have exactly\
  \ the same names, since Documentum Content Server searches for the XML application\
  \ file based on the exact name that we specify in the content file's a_category\
  \ attribute.\n\nWe are free to not specify any XML Application for the content file.\
  \ In such cases, the Default XML Application provided by Documentum is used.\n\n\
  ![](img/b18244e6621ecc39cef03ff6c0e55e7c_285_0.png)\n\nFigure 18.1: How XML Application\
  \ works\n\nInternally, Documentum uses a SAX parser for XML processing of documents\
  \ against the associated XML Application and DOM for reading the XML configuration\
  \ file.\n\n\n\n## 18.2 自动属性提取的简单示例\n\n让我们通过一个简单的示例来了解如何在 Documentum 中使用自动属性提取。我们将看到\
  \ XML 应用程序是如何创建的，如何将其附加到内容文件，以及它最终是如何工作的。\n\n- 1. 请参阅图 18.2；在 Web Publisher 中创建并导入一个模板（例如\
  \ First_XMLApp_Template.xml）并将其附加到具有 Default Lifecycle 的 dm_document 对象类型。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_286_0.png)\n\
  \n图 18.2：为我们的第一个 XML 应用程序创建模板文件\n\n以下是模板文件 First_XMLApp_Template.xml：\n\n```\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<ROOTTAG>\n    <TITLEOFPAGE/>\n    <SHORTDESC/>\n\
  </ROOTTAG>\n```\n\n- 2. 为模板创建一个规则文件（例如 First_XMLApp_TemplateRule.xml）并将模板文件与此规则文件关联。以下是规则文件\
  \ First_XMLApp_TemplateRule.xml：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<rules>\n    <tagcontent tag_name=\"TITLEOFPAGE\">\n        <textline charlength=\"\
  200\" instruction=\"Enter Title of the page\" label=\"Page Title\" required=\"Y\"\
  >\n        </textline>\n    </tagcontent>\n    <tagcontent tag_name=\"SHORTDESC\"\
  >\n        <textline charlength=\"200\" instruction=\"Enter a small description/subject\
  \ of the page\" label=\"Page subject\" required=\"Y\">\n        </textline>\n  \
  \  </tagcontent>\n</rules>\n```\n\n- 3. 单击信息图标（i）并在模板的 Category 字段中提供 XML 配置文件的名称，如图\
  \ 18.3 所示。这将设置模板的 a_category 属性。\n\n- 4. 您甚至可以通过 IAPI 按如下方式执行此操作：\n\n```\nAPI>id,c,dm_document\
  \ where object_name = 'First_XMLApp_Template.xml' and a_is_template = '1'\nAPI>set,c,l,a_category\n\
  Data: FirstXMLApp\nAPI>save,c,l\n```\n\n请注意，API 命令中显示的 'l' 是对执行查询时返回的对象 ID 的别名引用。有关\
  \ API 命令的更多信息请参见第 26 章。\n\n我们将在接下来的几个步骤中创建 XML 应用程序文件 FirstXMLApp.xml。\n\n请注意，在填写\
  \ Category 字段时，必须从 XML 配置文件名的名称中去掉 .xml 扩展名。如果未执行此操作，则针对该模板的 XML 应用程序将无法工作。\n\n\
  ![](img/b18244e6621ecc39cef03ff6c0e55e7c_288_0.png)\n\n图 18.3：为模板指定 a_category 属性\n\
  \n- 5. 在您喜欢的 XML 编辑器中创建 XML 应用程序配置文件。我们将创建第一个名为 FirstXMLApp.xml 的 XML 配置文件。此 XML\
  \ 应用程序的目的是将模板 XML 文件中 <TITLEOFPAGE> 元素和 <SHORTDESC> 元素中的值分别映射到 dm_document 对象的 title\
  \ 和 subject 属性。XML 配置文件 FirstXMLApp.xml 如下所示：\n\n```\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE application SYSTEM \"config_5.2.dtd\">\n<application>\n  <name>FirstXMLApp</name>\n\
  \  <app_pattern>\n<element>ROOTTAG</element>    <!-- Specifying the XML Root element-->\n\
  </app_pattern>\n\n<map_rules>\n    <xml_content_rule>\n        <element_selection_pattern>\n\
  \            <element>ROOTTAG</element>\n        </element_selection_pattern>\n\n\
  \        <variables>    <!-- Defining variables to map values in object\n      \
  \      attribute-->\n            <variable>\n                <name>TitleOfPage</name>\
  \    <!-- Storing the value of\n                TITLEOFPAGE template element -->\n\
  \                <content_of_element>\n                    <element_selection_pattern>\n\
  \                        <element>TITLEOFPAGE</element>\n                    </element_selection_pattern>\n\
  \                </content_of_element>\n            </variable>\n            <variable>\n\
  \                <name>ShortDescOfPage</name>    <!-- Storing the value of\n   \
  \             SHORTDESC template element -->\n                <content_of_element>\n\
  \                    <element_selection_pattern>\n                        <element>SHORTDESC</element>\n\
  \                    </element_selection_pattern>\n                </content_of_element>\n\
  \            </variable>\n        </variables>\n        <object_type>dm_document</object_type>\
  \    <!-- Specifying the object\n        type-->\n        <metadata>\n         \
  \   <dctmatt>\n                <name>title</name>    <!-- Saving value in title\n\
  \                attribute-->\n                <template><var name=\"TitleOfPage\"\
  /></template>\n            </dctmatt>\n            <dctmatt>\n                <name>subject</name><!--\
  \ Saving value in subject attribute-->\n                <template><var name=\"ShortDescOfPage\"\
  /></template>\n            </dctmatt>\n        </metadata>\n        <make_entity/>\n\
  \    </xml_content_rule>\n</map_rules>\n\n</application>\n```\n\n让我们讨论上述 XML 配置文件的结构：\n\
  \n```\n<!DOCTYPE application SYSTEM \"config_5.2.dtd\">\n```\n\n这是 XML 文件序言。由于 XML\
  \ 配置是一个 XML 文档，其将遵循的 DTD 在此处指定。XML 应用程序文件中引用的 config_5.2.dtd 文件可在 Web Publisher\
  \ 中的以下位置找到：Cabinets | System | Applications | Default XML Application.\n\n```\n\
  <application>\n```\n\n这是 XML 配置文件的根元素。\n\n```\n<name>FirstXMLApp</name>\n```\n\n\
  这是 XML 应用程序的名称。\n\n```\n<element>ROOTTAG</element>\n```\n\n需要通过 XML 应用程序处理的模板 XML\
  \ 文件的大小写敏感根元素。\n\n```\n<element>ROOTTAG</element>\n```\n\n这是需要通过 XML 应用程序处理的模板 XML\
  \ 文件的根元素名称。\n\n> 您在 XML 配置文件中看到的 XML 元素均在 config_5.2.dtd 文件中声明。\n\n<variable> 表示定义的变量名及其值，例如\
  \ XML 元素名和属性值。在此声明了两个变量：变量 TitleOfPage 存储 TITLEOFPAGE XML 元素的值，变量 ShortDescOfPage\
  \ 存储 SHORTDESC XML 元素的值。\n\n```\n<object_type>dm_document</object_type>\n```\n\n\
  <object_type> 指定需要由 XML 元素映射其属性的 Documentum 对象类型。\n\n<dctmatt r>：设置单个值的 Documentum\
  \ 对象属性的值。\n\n在这里，我们通过变量 TitleOfPage 设置 title 属性的值，通过变量 ShortDescOfPage 设置 subject\
  \ 属性的值。\n\n> 对于重复值的 Documentum 对象属性，请在 XML 配置文件中使用 <dctmatt r_repeating> 元素。我们将在本章后面查看一个相关示例。\n\
  \n- 6. 现在我们将执行使 XML 应用程序正常工作所需的必要配置。以管理员身份登录 Web Publisher 并转到 Cabinets | System\
  \ | Applications。\n\n选择 File | New folder 并创建新的 XML 应用程序文件夹，如图 18.4 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_291_0.png)\n\
  \n图 18.4：创建 XML 应用程序文件夹\n\n- 7. 在创建了 FirstXMLApp 文件夹后，单击它并在此文件夹内导入 XML 配置文件。\n\n\
  在导入 XML 配置文件之前，请确保 config_5.2.dtd 和 FirstXMLApp.xml 文件位于您机器本地硬盘上的同一位置。选择 File |\
  \ Import 并从本地机器中选择 FirstXMLApp.xml 文件，如图 18.5 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_291_1.png)\n\
  \n图 18.5：导入 XML 配置文件\n\n- 8. 在导入 XML 配置文件时，选择类型为 dm_xml_config，格式为 XML Document，XML\
  \ Category 为 Default XML Application，如图 18.6 所示。导入此配置文件时请记住去掉名称中的 .xml。\n\n这完成了将\
  \ XML 应用程序与内容模板 XML 文件关联所需的步骤。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_292_0.png)\n\
  \n图 18.6：创建 dm_xml_config 对象\n\n## 18.3 测试我们的第一个 XML 应用程序\n\n现在让我们在 Web Publisher\
