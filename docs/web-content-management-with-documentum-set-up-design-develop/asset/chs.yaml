  \ Server Manager 中的 DocBroker 选项卡，您可以按图 6.20 所示启动和停止 DocBroker(s)。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_95_1.png)\n\
  \n图 6.20：Documentum Server Manager 显示现有 DocBroker(s)\n\n## 6.5 dmcl.ini\n\ndmcl.ini\
  \ 文件定义客户端应用程序的配置信息，每个客户端都需要有此文件的一份副本。此文件的位置取决于 Documentum 客户端以及客户端的主机机器。\n\n图 6.21\
  \ 列出了 dmcl.ini 文件中定义的一些键及其解释：\n\n| 键 | 默认值 | 说明 |\n|---|---|---|\n| client_caching_enabled\
  \ | T | 这默认允许客户端持久缓存查询结果和对象。 |\n| cache_queries | F | 如果键 client_caching_enabled\
  \ 设置为 False，将此键设置为 True 仅允许缓存查询结果。 |\n| client_cache_size | -1 | 这用于定义最大客户端缓存大小，其值被解释为对象数。\
  \ |\n| connect_pooling_enabled | F | 这用于启用连接池。 |\n| max_collection_count | 10 |\
  \ 这控制会话的最大查询集合 ID 数。 |\n| max_session_count | 10 | 这控制任何给定客户端应用程序允许的最大会话数。请确保其与\
  \ server.ini 中的 concurrent_sessions 键一致。 |\n| trace_file | Server log | 这控制 DMCL\
  \ 异常发生时 DMCL 堆栈跟踪日志的路径和文件名。 |\n| trace_level | 3 | 这设置 DMCL 跟踪的跟踪级别。 |\n\n图 6.21：dmcl.ini\
  \ 文件中的一些键\n\n## 6.6 server.ini\n\n与包含客户端所需配置信息的 dmcl.ini 文件相反，server.ini 文件中的信息由服务器使用。server.ini\
  \ 在 Windows Content Server 主机上的位置为：\n\n```\n$DOCUMENTUM\\dba\\config\\<Docbase name>\n\
  ```\n\n在我们的例子中，server.ini 的位置为：C:\\Documentum\\dba\\config\\dev_doc。\n\n图 6.22 提到了\
  \ server.ini 中定义的一些键及其解释。\n\n| 键 | 默认值 | 说明 |\n|---|---|---|\n| client_session_timeout\
  \ | 5 minutes | 这定义了服务器在断开会话之前等待客户端通信的持续时间。 |\n| concurrent_sessions | 100 | 这控制服务器在给定时间内可以处理的最大会话数。\
  \ |\n| database_conn |  | 这包含 Content Server 为建立与 RDBMS 服务器的连接而所需的数据库连接字符串。 |\n\
  |  |  | （由 Oracle 和 DB2 需要，而 Sybase 和 SQL Server 不需要。） |\n| database_name |  | 这标识\
  \ RDBMS 中的数据库或表空间。 |\n|  |  | （由 Sybase 和 SQL Server 需要，而 Oracle 和 DB2 不需要。） |\n\
  | distinct_query_results | F | 这可用于指示服务器在查询结果中返回重复行。 |\n|  |  | 设置为 True 会指示服务器仅返回没有重复的唯一行。\
  \ |\n| login_ticket_timeout | 5 minutes | 这确定登录票证在生成后保持有效的时间。 |\n| mail_notification\
  \ | T | 这控制当工作项或事件已被排队时是否向用户发送电子邮件消息。 |\n\n图 6.22：server.ini 文件中的一些键\n\n就这样！我们已创建了第一个\
  \ Docbase 并在其上安装了 WebPublisher DocApp，使其可供 Web Publisher 使用。根据第 5 章图 5.1 中显示的安装路线图，我们现在可以继续安装站点缓存服务（SCS）源和目标，以便将\
  \ Docbase 内容发布到 Documentum 系统之外。\n\n## 6.7 摘要\n\n本章我们讨论了在 Documentum Content Server\
  \ 中创建 Docbase。我们简要谈到了创建 Documentum Docbase 的先决条件。然后我们讨论了为 Docbase 创建 DSN（数据源名称）以连接到其底层数据库的步骤。\n\
  \n我们随后讨论了创建 Docbase 的详细步骤，然后在新创建的 Docbase 上安装了 Web Publisher Server Files。服务器文件安装设置了\
  \ WebPublisher DocApp 和对象，以便新的 Docbase 能与 Web Publisher 应用程序良好配合。\n\n我们还看到了如何通过简单的\
