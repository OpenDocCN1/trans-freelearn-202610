  \ 11.10：对象类型功能选项卡\n\n图 11.10 显示了 Documentum Application Builder 中对象类型的功能选项卡。\n\n\
  5. 在事件选项卡下（参见图 11.11），会显示该对象类型的系统事件（只读）。\n\n您可以通过分别点击“添加”、“删除”和“编辑...”按钮来添加、修改和删除特定于应用程序的事件。这些事件用于\
