  恭喜！您已创建自己的自定义工作流模板，并已准备好通过将内容提交到此自定义工作流来对其进行测试。


  如果您有兴趣了解有关工作流及其高级功能的更多信息，请阅读 Application Builder 用户手册、Web Publisher 管理手册和 Workflow
  Manager 在线帮助。Documentum 还提供了一个名为 Business Process Manager（简称 BPM）的先进工作流管理工具，扩展了
  Workflow Manager 提供的许多功能。讨论 BPM 及其功能超出了本书的范围。不过，您可能希望从 Documentum 的下载站点下载 BPM 软件并阅读其管理手册。


