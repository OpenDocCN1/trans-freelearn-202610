  \ File | Check In 将内容检入。\n\n\n\n## 自动属性提取 (APE)\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_293_0.png)\n\
  \nFigure 18.7: 新内容属性屏幕\n\n在 Web Publisher 模板编辑器中填写一些虚拟数据（参考图 18.8）到 Page Title 和\
