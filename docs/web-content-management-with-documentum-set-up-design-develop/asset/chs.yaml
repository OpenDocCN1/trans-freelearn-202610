  \n这是控制特定对象类型对象的访问或修改权限级别的良好机制\n\n要指定权限集，请从 Name: 下拉列表中选择现有权限集。所有其他字段，如 Owner、Description、Permissions\
  \ 和 Your Permission 均为只读字段，在您从下拉列表中选择权限集后由 Documentum 自动填充。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_146_0.png)\n\
