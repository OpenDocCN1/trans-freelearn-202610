  \ Documentum 架构中各种实体的占位符，以便同一对象可以在多个上下文中重复使用。\n\n我们了解了 Documentum 中组和用户如何被视为对象。用户是\
  \ Documentum 系统中一个或多个组的一部分。Documentum 中的渲染是与原始版本仅在格式上不同的文档。注册表是与 Docbase 注册的 RDBMS\
  \ 表，以便可以在 Docbase 的上下文中使用这些数据中的数据。Documentum 中的数据字典是一个存储有关所有 Documentum 对象类型及其属性（属性）信息的存储库。最后，我们讨论了方法，即\
  \ Documentum Docbase 中的可执行程序，可以通过 Documentum 作业自动安排运行。\n\n\n"
- '## 4 网站内容管理系统


  在前几章讨论了一些 Documentum 的关键特性之后，让我们开始踏上 Documentum 的世界之旅，通过帮助一家实际企业解决在网站中管理大量内容的古老难题。


  可以合理假设，阅读本书的人要么是真心想了解更多关于 Documentum 的信息，要么需要评估它是否能成为满足其特定业务需求的良好内容管理选项。


  无论哪种情况，我们首先应弄清当前项目是否真的需要网页内容管理（简称 WCM）。所有 WCM 系统都有各自的优缺点。我们应细致分析业务需求，以验证业务需求能否由一个良好的内容管理系统满足。


  Documentum 是一款企业内容管理系统，提供众多丰富的工具来满足不断增长的企业需求。然而，我们不能忘记其中存在 caveat。良好的 CMS 系统成本高昂，并且会给最终使用者带来培训开销。此外，我们还需要一个开发/系统团队来搭建和配置
  CMS 系统，以及一名系统管理员来监控 CMS 系统以确保平稳运行。


  ### 4.1 何时应使用 WCM 系统？


  当企业需要在网站/门户上频繁更新内容时，Documentum 作为 WCM 系统就显得很有价值。这意味着，需要不断更新其网站上展示的业务信息，以确保网站用户在特定时间点能够查看最新信息的企业，是
  WCM 的良好候选者。


  这可以通过几个例子更好地解释：


  - **一个在线购物网站：** 在线购物网站会上传其产品信息，如产品描述、产品图片、价格和库存可用性详情等。在任何时间点，这些信息都需要保持最新，否则客户可能会以过时的价格购买商品！如果网站上的库存信息未及时更新，将导致对商店中实际不可用产品的采购订单！


  而不是每天/每周手动更新网站的 HTML/JSP 页面，在线购物网站公司可以通过 WCM 系统有效管理。最新的内容信息可以通过 WCM 内容创作工具进行更新，并且可以在无需了解网页脚本工具的情况下轻松录入新产品信息。


  - **一个在线报纸网站：** 报纸网站的结构/布局基本保持不变，但其实际内容每天都在变化。事实上，旧新闻每天都会从网站上过期，并在某些情况下被归档。此外，出现在网站上的新闻文章在最终批准前必须通过工作流机制经过一组审阅者审核。安装了
  WCM 系统后，内容创建者和编辑无需学习网页技术/脚本语言即可在网站上上传/编辑内容。经过培训后，他们可以通过内容管理系统本身提供的创作工具进行内容创作。因此，报纸网站可被视为
  WCM 系统的良好候选者。


  ### 4.2 何时不应使用 WCM 系统？


  这是一个很有争议的领域，可能因企业类型和性质以及客户需求而异。


  然而，以下内容可作为一些实用建议，基于过去涉及“内容密集型”网站项目的经验。需要注意的是，这些是个人观点，不应被视为通用行业标准或全球公认的规则。


  如果符合以下情况，请在启动 WCM 系统前三思：


  - 网站上的大部分数据相当静态，且不易更新。

  如果您不需要在网站上频繁更新内容，请尝试想出另一种管理内容的方式。在这种情况下使用自动化内容管理系统可能会过度设计并导致额外且不必要的成本。


  - 您既没有时间也没有资金来培训员工。

  对于利润率较低的小型公司而言，购买 CMS 系统、请一批软件开发人员/专家安装/设置，然后再培训业务用户使用系统，可能是一件成本过高的事情。此类组织应在投入之前详细分析并规划其费用和/或时间，并详细核算资源需求。


  - 网站上没有太多内容需要展示。

  有一些交易密集型网站，如银行网站、在线航班预订网站等，不需要由网站内容贡献者手动输入大量数据。


  只有需要管理大量非结构化数据的网站才应被视为内容管理系统的合适候选者。


  ### 4.3 Documentum WCM 架构


  如果您已做好功课并确信自己对像 Documentum 这样有效的 Web 内容管理系统有业务需求，那么欢迎加入！


  让我们使用 Documentum 产品套件讨论一个典型的 Web 内容管理架构。


  我们接下来要讨论的并不是“最佳”的 WCM 架构，而是一个相当标准化的架构，能够满足许多企业的大多数常见基于网络的内容需求。


  先进的 WCM 架构并不仅限于图 4.1 中所示的产品/组件。根据业务需求，设计和架构可能会有所变化，并且可以向图 4.1 中添加更多组件或移除现有组件。


  如果您无法理解架构中描绘的所有组件，请不要担心。随着您继续阅读本书的其余部分，所有这些内容都会变得更清晰、更易理解。


  ![](img/b18244e6621ecc39cef03ff6c0e55e7c_60_0.png)


  图 4.1：使用 Documentum 的 WCM 架构


  ### 4.4 如何在系统中录入内容？


  **Web Publisher** 是在 Documentum 系统中录入内容的最简单工具之一，也是进入 WCM 系统的入口。它是一款基于 Web 的客户端工具，连接到
  Content Server Docbase，并协助内容作者、经理和管理员为业务站点创建、管理和管理内容。


  ### 4.4.1 Web Publisher


  使用 Web Publisher 的好处在于，它只需在应用服务器上对 Web Publisher 系统和业务特定的自定义文件进行一次性设置。Web Publisher
  的终端用户（或客户端）无需在其笔记本电脑/桌面上进行任何安装，只需通过一系列受支持的浏览器访问 Web Publisher URL 即可。


  安装了 Web Publisher 的应用服务器主机上的 dmc1.ini 文件指向正确的 DocBroker 和端口。正是通过它建立了与 Docbase 的连接。


  示例 dmc1.ini 文件：


  ```

  [DOCBROKER_PRIMARY]

  host ==<<Your DocBroker host Name>>

  port =1489 # default port

  ```


  Web Publisher 中可用的广泛操作不仅限于为网站创建或管理内容。Web Publisher 是 Documentum WCM 架构不可或缺的一部分，并具有直观的
  GUI，可实现以下功能：


  - 为 Web Publisher 终端用户设置组、用户和角色

  - 创建直观的分类或分类法，业务用户可借此为其组织创建分类内容。

  - 创建交付（Web）柜，创建的内容可从 Documentum 系统中发布。

  - 通过将权限集（ACL）附加到相关对象，为 Docbase 对象设置安全权限。

  - 在生命周期状态中提升和降级对象。使用 Web Publisher 的 ''Promote''、''Demote'' 和 ''Power promote''
  功能，可以将文档推送到其生命周期的下一个状态或将其降级到先前的状态。

  - 创建内容模板及相关规则和演示文件，以便用户无需学习任何网页脚本技术即可使用模板创建内容。

  - 通过将内容项推送到工作流以供其他用户审阅和批准。值得一提的是，Documentum Web Publisher 提供了一些开箱即用的工作流可供使用。示例：Request
  new content, submit to website workflow, etc.

  - 与实用服务和工具集成，如自动属性提取、Content Intelligence 服务、企业间工作流服务、In-Context 编辑、eWebEditPro
  富文本编辑器等。




  - 运行大量报告以管理系统对象，例如可用的生命周期、工作流、活动内容等。


  根据登录的 Web Publisher 用户的 ''role''，Web Publisher GUI 对不同用户显示不同，有时提供受限功能。例如，内容作者不会看到交付
  Web 柜，而 Web 开发人员或管理员可以查看这些。此外，并非所有内容管理功能都对所有 Web Publisher 用户可用。


  例如，内容作者不允许导入文件，而内容管理员可以这样做；内容管理员不能 ''power promote'' 对象，而 Web 开发人员拥有这些权限；等等。


  这些设置可以通过更改一些上下文敏感的角色配置文件并在 Web Publisher 系统中重新加载更新后的文件来进行调整。


  ![](img/b18244e6621ecc39cef03ff6c0e55e7c_62_0.png)


  图 4.2：Web Publisher 显示可用的工作流模板


