  \ 18.8: 创建新内容时显示的模板编辑器\n\n你可以看到（参考图 18.9），Title 和 Subject 字段已被自动填充为用户在模板中 Page Title\
  \ 和 Page subject 字段中保存的值。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_294_0.png)\n\
  \nFigure 18.9: 创建内容的属性屏幕\n\n> 请注意，使用 Web Publisher 模板编辑器的 content widget 来填充对象属性的值会带来问题。例如，你希望从内容模板字段捕获格式化的數據并填充到对象属性中。在这种情况下，不要使用\
  \ content widget，而应使用 textline widget。\n\n你可以在 textline 字段中按如下方式输入格式化数据：<b>某些数据</b>。\n\
  \n这会通过我们的 XML Application 保存到属性中。现在你已经看到了一个非常简单的 XML Application 工作模型，让我们通过一些复杂示例进一步探索\
  \ XML Application。\n\n## 18.4 使用自动属性提取填充重复属性\n\n让我们创建一个模板文件，允许内容创建者在重复块中输入多个书籍名称以及其作者名称。\n\
  \n我们将开发一个自定义 XML Application，将文档的 authors 多值重复属性填充为在模板文件中输入的作者名称。\n\n- 1. 在 Web\
  \ Publisher 中创建并导入一个模板（例如 Second_XMLApp_Template.xml）并将其附加到具有默认生命周期的 dm_document\
  \ 对象类型。模板文件 Second_XMLApp_Template.xml 如下：\n\n```\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<BOOK>\n    <REPEATBLOCK>\n        <BOOKNAME/>\n        <AUTHORNAME/>\n\
  \    </REPEATBLOCK>\n</BOOK>\n```\n\n为上述模板创建一个 Rules 文件（例如 Second_XMLApp_TemplateRule.xml）并将模板文件与此\
  \ Rules 文件关联。Rules 文件 Second_XMLApp_TemplateRule.xml 如下：\n\n```\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<rules>\n    <tagcontent tag_name=\"BOOKNAME\">\n  \
  \      <textline charlength=\"100\" instruction=\"Please provide the name of the\
  \ book\" label=\"Book Name\">\n        </textline>\n    </tagcontent>\n\n    <tagcontent\
  \ tag_name=\"AUTHORNAME\">\n        <textline charlength=\"100\" instruction=\"\
  Please provide the name of the author\" label=\"Author Name\">\n        </textline>\n\
  \    </tagcontent>\n\n    <repeatdef instruction=\"Provide as many values as you\
  \ want\" label=\"repeating block for books and authors\" tag_list=\"REPEATBLOCK\"\
  >\n    </repeatdef>\n</rules>\n```\n\n- 2. 创建一个 XML 配置文件 SecondXMLApp.xml，并在模板 Second_XMLApp_Template.xml\
  \ 的 Category 字段中提供 XML 配置文件名称（不带 .xml）。这将设置模板的 a_category 属性。\n\nSecondXMLApp.xml\
  \ 文件如下所示：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE application\
  \ SYSTEM \"config_5.2.dtd\">\n<application>\n  <name>SecondXMLApp</name>\n  <app_pattern>\n\
  \    <element>BOOK</element>    <!-- Specifying the XML Root element BOOK-->\n \
  \ </app_pattern>\n\n  <map_rules>\n    <xml_content_rule>\n      <element_selection_pattern>\n\
  \        <element>BOOK</element>\n      </element_selection_pattern>\n\n      <variables>\
  \    <!-- Defining variable to map values in object attribute authors-->\n     \
  \   <variable>\n          <name>authorName</name>    <!--Getting the value of AUTHORNAME\
  \ template element -->\n          <content_of_element>\n            <element_selection_pattern>\n\
  \              <element>AUTHORNAME</element>\n            </element_selection_pattern>\n\
  \          </content_of_element>\n        </variable>\n      </variables>\n    \
  \  <object_type>dm_document</object_type>    <!-- Specifying the object type -->\n\
  \      <metadata>\n        <dctm attr_repeating>\n          <name>authors</name>\
  \    <!-- Saving value in authors repeating attribute-->\n          <template><var\
  \ name=\"authorName\"/></template>\n        </dctm attr_repeating>\n      </metadata>\n\
  \      <make_entity/>\n    </xml_content_rule>\n  </map_rules>\n</application>\n\
  ```\n\n<dctm attr_repeating>: 设置多值（重复）Documentum 对象属性的值。\n\n在这里，我们通过变量 authorName\
  \ 设置 authors 多值属性的值。\n\n变量 authorName 捕获内容创建者在模板文件的 AUTHORNAME 重复元素中输入的多个值。\n\n\
  - 3. 完成配置此 XML Application 的所有必需步骤，与我们为第一个 XML Application 所做的完全相同。\n\n## 18.5 测试第二个\
  \ XML Application\n\n让我们再次使用 Second_XMLApp_Template.xml 模板在 Web Publisher 中创建示例内容，看看\
