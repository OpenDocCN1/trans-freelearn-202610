  \ |\n|  | user_group_name |\n| 组 (dm_group) | group_name |\n|  | users_names |\n\
  \n图 2.7：示例对象类型及其部分属性\n\n### 2.7 DQL\n\nDQL 是 Document Query Language（文档查询语言）的缩写，使用的是\
  \ ANSI 标准 SQL（结构化查询语言）的超集语法。对于熟悉 SQL 的人来说，DQL 可以简单地被视为 Documentum 对 SQL 的封装。\n\n\
  DQL 用于在 Docbase 中执行以下操作：\n\n- 在 Docbase 中查询、更新和删除对象\n- 在 Docbase 中创建新对象\n- 在 Docbase\
  \ 中搜索内容\n- 查询已注册表\n\n简单 DQL 查询示例：\n\n```\nselect r_object_id from dm_document where\
  \ object_name = 'SampleDocument.xml'\n```\n\n上述查询选择了名称为 SampleDocument.xml 的 dm_document\
  \ 类型对象的唯一对象 ID\n\nDQL 查询可以从以下位置发出：\n\n- Documentum Administrator（Documentum Web\
  \ 客户端）\n- DFC（Documentum Foundation Classes）\n- IDQL 实用工具\n\nIDQL 是一个与 Content Server\
  \ 一同安装的交互式实用工具/工具，允许我们针对 Docbase 执行 DQL 查询。图 2.8 显示了如何使用 IDQL 实用工具发出示例 DQL 查询。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_36_0.png)\n\n图 2.8：IDQL 工具\n\n### Documentum\
  \ 5.3 更新\n\nDocumentum 5.3 版本引入了一种新的查询方法，称为 FTDQL 查询，其类似于 SELECT 语句，不同之处在于查询针对全文索引而不是\
  \ Docbase（存储库）运行，以获得性能提升。\n\n如需了解更多关于 DQL 查询的信息，请参阅第 26 章。\n\n### 2.8 API\n\nAPI\
  \ 命令（也称为 Server API）是通过 DMCL（Documentum Client Library）由客户端发送给 Content Server 的指令。与\
  \ DQL 类似，API 命令用于：\n\n- 在 Docbase 中查询、更新和删除对象\n- 在 Docbase 中创建新对象\n\n与可以一次操作多个对象的\
  \ DQL 查询不同，API 命令旨在一次对一个对象执行。\n\n示例：\n\n```\nget,c,0900223280023fc2,object_name\n\
  ...\n```\n\n结果：SampleDocument.xml\n\n让我们分解 API 命令来解释示例：\n\n- get: 用于检索特定属性值信息的 Server\
  \ API 方法\n- c: 表示当前 Docbase 会话\n- 0900223280023fc2: 相关对象的 r_object_id\n- object_name:\
  \ 需要检索其值的属性名称\n\n请注意，Server API 方法的参数是按位置排列的，不应包含任何空白字符。\n\nIAPI 是一个与 Content Server\
  \ 一同安装的交互式实用工具/工具，允许用户针对 Docbase 执行 Server API 方法。图 2.9 显示了如何使用 IAPI 实用工具发出示例 API\
  \ 命令。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_38_0.png)\n\n图 2.9：IAPI 工具\n\n\
  如需了解更多关于 API 命令的信息，请参阅第 26 章。\n\n### 2.9 文件柜和文件夹\n\nDocbase 中的对象通过放置在文件柜和文件夹中来组织。文件柜构成最高级别的组织，包含文件夹、文档和其他对象。对象可以驻留在文件柜中或文件夹中。文件夹存在于文件柜中或其它文件夹中。\n\
  \n在文件柜和文件夹中组织对象可以帮助我们更好地对内容进行分类，并实现对关键信息的更快搜索。\n\nDocumentum 中文件柜对象类型为 dm_cabinet，文件夹对象类型为\
  \ dm_folder。需要注意的是，dm_folder 是 dm_cabinet 对象类型的超类型。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_38_1.png)\n\
  \n图 2.10：文件柜-文件夹结构\n\n图 2.10 显示了在 'Web Publisher' 客户端中看到的 Docbase 中的示例文件柜-文件夹结构。\n\
  \n### 2.10 版本控制\n\n与任何优秀的 CMS 一样，Documentum 内部管理同一文档的多个版本，并维护自文档初始创建以来所有更新的历史记录。**版本控制**是通过\
  \ **版本标签** 由 Content Server 提供的自动功能。\n\n除文件夹、文件柜及其子类型外，所有 SysObjects 均由 Content\
  \ Server 进行版本控制。文档的各个版本存储在 **版本树** 中。版本标签存储在 SysObjects 或其子类型的 r_version_label 重复属性中。\n\
  \n版本标签有两种类型：\n\n- **数字（或隐式）标签**：这些是由服务器生成的数字标签，并存储在 r_version_label 属性的第一位置。\n \
  \ 示例：`r_version_label[0]=1.0`\n- **符号标签**：这些是系统定义或用户定义的描述性标签。与数字标签不同，这些标签传达有意义的信息，因此对应用程序有用。它们存储在\
  \ r_version_label 属性的第二位置及以后，并且区分大小写。\n  示例：`r_version_label[1]=WIP`\n\n需要注意的是，CURRENT\
  \ 是 Content Server 自动分配给文档最后一次签入版本的唯一符号标签。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_39_0.png)\n\
  \n由于我们正在讨论版本控制，这里是讨论 Documentum 中 SysObjects 的 r_object_id 和 i_chronicle_id 属性的好地方。Documentum\
  \ 中的版本树包含原始对象及其所有修改版本。Content Server 如何推断特定对象属于哪个版本树？答案是：通过 i_chronicle_id 属性。\n\
  \n请注意，i_chronicle_id 属性存储对象的原始（根）版本的 object ID（r_object_id）。每次创建新版本时，Content Server\
  \ 都会将 i_chronicle_id 值复制到新创建的对象。让我们举一个小例子。\n\n创建一个新文档。Content Server 为文档分配对象 ID\
  \ 和编年史 ID。签出并签入。服务器现在分配一个新的对象 ID 但保留原始\n\nchronicle ID。再次签出并签回。服务器再次分配一个新的对象 ID，但保留原始的编年史\
  \ ID。\n\n请参考图 2.12 以了解 Content Server 如何管理原始文档的不同版本。对于文档的原始（根）版本，对象 ID 和编年史 ID 的值相同。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_40_0.png)\n\n图 2.12：对象 ID 与编年史 ID 之间的关系\n\
  \n### 2.11 生命周期\n\n企业中的文档会经过一个定义明确的编写-审阅流程。\n\n让我们以这样一个流程为例：\n\n- 1. 文档由作者创建。在此创建的初始阶段，文档处于草稿状态。\n\
  - 2. 文档正在由作者处理，因此属于“进行中”状态。\n- 3. 当它被送出进行第一轮审阅时，可能处于“审阅中”状态\n- 4. 当文档最终获得批准时，它就属于“已批准”状态（假设）。\n\
  \nContent Server 提供生命周期来自动化文档生命周期中的这些各个阶段。\n\n简单来说，生命周期是一系列状态，描述了对象的各个生命周期阶段。Documentum\
  \ 以策略对象（dm_policy）的形式将生命周期存储在 Docbase 中。\n\n图 2.13 显示了在 Documentum Application Builder\
  \ 中看到的示例生命周期。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_41_0.png)\n\n图 2.13：Documentum\
  \ 测试生命周期\n\n我们将在第 12 章更深入地探讨生命周期。\n\n### 2.12 工作流\n\n简单来说，工作流对业务流程进行建模。以下示例可以更好地解释这一点：\n\
  \n一家在线报纸出版公司在将内容发布到其实时报纸网站之前需要对创建的内容进行各种审批。无需手动将内容的纸质副本转移给各个审阅者组，工作流可以规范、标准化和自动化整个流程。\n\
  \n工作流由众多活动组成，每个活动包含各种需要执行的任务。用户或指定的自动化脚本执行任务并将相关文档传递给后续活动。工作流本质上所做的是通过不同用户将内容路由到其生命周期的各个阶段。每个用户在其收件箱中收到指定的任务，并可能同时收到电子邮件通知。Documentum\
  \ 以业务流程对象（'dm_process'）的形式将工作流定义存储在 Docbase 中。\n\n图 2.14 显示了在 Workflow Manager 工具中看到的示例\
  \ Documentum 工作流模板。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_42_0.png)\n\n图 2.14：一个示例\
  \ Documentum 工作流\n\n我们将在第 19 章后面详细介绍工作流。\n\n至此，我们对 Documentum 基础的讨论结束。如果您仍然不太理解本章所涵盖的许多主题，请不要感到困惑。随着您开始动手使用\
  \ Documentum 系统，您将更好地理解这些概念并更加欣赏它们。如果您觉得现在对 Documentum 有了基本的了解，您可以继续阅读下一章，了解 Documentum\
  \ 中的一些高级功能。\n\n### 2.13 摘要\n\n本章我们讨论了 Content Server，即 Documentum 架构的核心，托管 Docbase。Docbase\
  \ 可以被视为一个逻辑存储库，由内容文件及其关联的元数据组成。另一方面，DocApp 是 Docbase 的打包单元，由 Docbase 中的对象组成。\n\n\
  我们继续讨论了 DocBrokers，它充当中间件，允许客户端与 Content Server 建立连接。\n\n我们看到了 Documentum 系统如何以对象的形式处理所有实体。在\
  \ Documentum 中，对象可以被视为称为对象类型的模板的运行时实例。Documentum 中的对象具有自己的元数据，称为属性或特性。\n\n我们看到了使用\
  \ DQL（Document Query Language）和 Server API 命令查询和操作 Docbase 中对象的示例。\n\n我们还涉及了 Content\
  \ Server 的版本控制功能，并对生命周期和工作流进行了简要介绍。生命周期代表了对象生命中的逻辑阶段，而工作流则对业务流程进行建模，并定义对象在何种条件下移动到不同的生命周期状态，以及参与实体是谁。\n"
- "## 3 Documentum 高级概念\n\n我们现在可以假设您已经复习了关于 Documentum 系统的基本概念。在本章中，我们将讨论 Documentum\
  \ 架构的更多重要方面。毋庸置疑，如果您已经理解下面列出的概念，可以跳过本章继续阅读。\n\n我们不要忘记 Documentum 系统极其庞大，并不仅仅局限于我们讨论的基础/高级概念。\n\
  \n> 为了全面了解该系统，强烈建议阅读 Documentum 的产品手册。\n\n### 3.1 DMCL\n\nDMCL 代表 Documentum Client\
  \ Library，它在终端客户端和 Content Server 之间提供通信层（RPC）。\n\n客户端请求通过 DMCL 层到达 Content Server，该层由在\
  \ Content Server 上执行的 C++ API 库组成。\n\n建议不要从客户端直接执行 DMCL API 调用。相反，应该使用一组 Documentum\
  \ Java 类或下面描述的 DFC。\n\n### 3.2 DFC\n\nDFC 代表 Documentum Foundation Classes，是一种面向对象（OO）框架，由用于访问和扩展\
  \ Content Server 功能的 API 组成。简单来说，它是一组作为 DMCL 包装器编写的 Java 接口和类。除了常规的 DMCL 功能外，DFC\
  \ 还提供诸如数据验证、虚拟文档管理等功能。\n\n此外，DFC 还提供 Documentum Java-COM Bridge（DJCB），以便 Java 接口可以在\
  \ Microsoft COM 环境中使用，也可被 Visual Basic 等程序使用。DFC 还包括 Business Objects Framework（BOF），使开发人员能够以可重用的模块化组件/元素形式建模应用程序业务规则。\n\
  \n图 3.1 显示了客户端与 Content Server 之间通过 DMCL 和 DFC 层如何进行请求-响应范式的工作。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_45_0.png)\n\
  \n图 3.1：DFC-DMCL 架构\n\n我们将在第 23 章的众多示例中更深入地了解 DFC。\n\n### Documentum 5.3 更新\n\n\
  Documentum 5.3 版本对 DFC 进行了一些增强。5.3 版本中作为 DFC 引入的一些新功能包括：\n\n- 支持统一客户端设施（UCF），以协助诸如签出、签入、导入和导出等内容相关服务，作为基于\
  \ WDK 的应用程序的内容传输机制\n- 与 .NET 的更深层次集成\n\n### 3.3 BOF\n\nBusiness Objects Framework（BOF）内置于\
  \ DFC 中，帮助开发人员创建称为 Business Objects 的可重用业务逻辑组件。使用 DFC 的应用程序可以轻松访问 BOF，并可以将 BOF 作为中间层或客户端应用程序中的可插拔组件/实体使用。让我们举一个简单的例子来理解这一点。\n\
  \n假设您需要在特定对象类型的特定文档签入 Docbase 时执行特定验证的特定业务功能。这可以通过使用 BOF 并覆盖特定对象类型的签入功能来实现。一旦编写完成，无论使用的是\
  \ Webtop、Web Publisher、某些桌面应用程序还是某些自定义 DFC 类，相同的业务对象都会被调用。简而言之，我们实现的是可重用组件/功能。\n\
  \nBusiness Objects 有两种类型：\n\n- **基于类型（TBO）**：这对于扩展特定的 Content Server 对象类型并添加新的自定义方法或覆盖现有方法很有用。此类\
  \ Business Object 仅在 Docbase 中特定对象类型的所有对象上工作。\n  示例：为对象类型 `my_custom_document` 添加了一些自定义行为（其中\
  \ `my_custom_document` 对象类型扩展了 Documentum `dm_document` 对象类型）\n- **基于服务（SBO）**：与基于类型的\
  \ Business Objects 不同，此类 Business Object 不限于特定的 Docbase 对象类型。相反，它作为为 Docbase 中所有对象类型提供的通用服务，而不仅仅是一个特定对象类型。\n\
  \  示例：无论对象类型如何，Docbase 中全局覆盖的签入方法、Documentum 收件箱对象等。\n\n注意：对于来自 EJB（Enterprise Java\
  \ Beans）背景的人来说，可将 TBO 类比为实体 Bean，将 SBO 类比为会话 Bean。\n\n### Documentum 5.3 更新\n\n\
  在 Documentum 5.3 版本中，TBO 不仅与对象类型相关联，还与 Docbase（存储库）相关联。此外，Documentum 在本版本中增加了通过\
  \ Web Services 访问 Business Objects 的支持。\n\n### 3.4 WDK\n\nWeb Development Kit（简称\
  \ WDK）是 Documentum 提供的框架，可在此基础上构建用于与 Content Server 通信的 Web 应用程序。\n\nWDK 编程模型完全基于\
  \ J2EE 和 XML，WDK 应用程序可以部署在符合 J2EE 标准的任何应用程序服务器上。WDK 应用程序通过 DFC 调用与 Content Server\
  \ 交互并获取数据。\n\n以下是 WDK 框架的一些功能：\n\n- 由可重用和可配置的组件组成，这些组件生成 HTML 控件/小部件，提供对 Content\
  \ Server Docbase 的访问\n- 提供可配置 UI 控件的标签库\n- 提供框架服务，如品牌、历史、错误处理、消息传递、国际化和内容传输\n\n\n\
  \nIn short, WDK is a set of server-side reusable components supported by Documentum\
  \ that allow one to rapidly develop and deploy web-based applications.\n\nWDK architecture\
  \ consists of:\n\n- **表示模型**: Incorporates JSP tag libraries to separate the UI\
  \ from business logic.\n- **组件模型**: Incorporates server-side components that extend\
  \ the Content Server functionality.\n\nFigure 3.2 represents a simplified version\
  \ of the WDK architecture, showing how the various Documentum entities fit in the\
  \ various layers.\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_47_0.png)\n\nFigure\
  \ 3.2: Simplified WDK architecture\n\n**Webtop** is a Documentum reference implementation\
  \ with WDK components. Web Publisher tool is built over Webtop and is used mostly\
  \ for content authoring and publishing.\n\nWDK and its usage are discussed in detail\
  \ in Chapter 24.\n\n### 3.5 Web 发布器\n\nWeb Publisher is a browser-based web application\
  \ provided by Documentum for content creation, review, and finally publishing to\
  \ websites.\n\nIn the Documentum architecture, Web Publisher utilizes the content\
  \ management services from Content Server, publishing services from **SCS** (Site\
  \ Caching Services), and rendition (see section 3.9) management from **CRS** (Content\
  \ Rendition Services).\n\nApart from these, Web Publisher also works with a host\
  \ of other Documentum products.\n\nWeb Publisher defines its own specific groups\
  \ in order to divide the responsibilities of the participating entities. For example,\
  \ a content author can use Web Publisher to use predefined templates and create\
  \ content for the website without requiring any knowledge of web design/construction.\n\
  \nA web developer on the other hand, understands web design and uses Web Publisher\
  \ to create content templates, automates the review process through workflows, and\
  \ maintains the website categories and structures.\n\nAn administrator has the highest\
  \ privileges and maintains the Web Publisher system, administering and monitoring\
  \ it and running reports for various objects and events.\n\nThroughout this book,\
  \ we shall explore Web Publisher in great detail and utilize it for various operations\
  \ such as content authoring, categorizing, and publishing.\n\n### 3.6 ACL\n\nACL\
  \ (Access Control List) forms a part of Documentum's security mechanism to restrict\
  \ certain groups/users from accessing a particular object. Documentum stores restricted\
  \ objects as dm_acl objects. Note that all SysObjects in Docbase have an ACL assigned\
  \ to them.\n\nAn ACL, also called a permission set, stores information regarding\
  \ the groups/users that have access to a particular object as well as their access\
  \ levels (or privilege levels).\n\nKeep in mind that the permission levels are hierarchical,\
  \ which means a permission level of 'READ' for example would grant permission levels\
  \ above it as well—'NONE' and 'BROWSE'.\n\nGo through the table shown in figure\
  \ 3.3 to understand the basic access levels available in Documentum:\n\n| 许可级别（r_accessor_permit\
  \ 属性） | 权限 | 简短说明 |\n|---|---|---|\n| 1 | NONE | 对对象无访问权限。 |\n| 2 | BROWSE | 用户可以查看对象的属性但不能查看其关联内容。\
  \ |\n| 3 | READ | 用户可以查看内容但不能修改它。 |\n| 4 | RELATE | 用户可以向对象附加注释（即评论）。 |\n| 5 | VERSION\
  \ | 用户可以创建对象的新版本但不能更新现有版本。 |\n| 6 | WRITE | 用户可以写入并更新对象的现有版本。 |\n| 7 | DELETE |\
  \ 用户可以删除对象。 |\n\nFigure 3.3: Basic permissions in Documentum\n\nApart from providing\
  \ the above basic permission levels, Documentum provides some extended permission\
  \ levels as well.\n\nThe table in figure 3.4 shows the extended permissions available\
  \ in Documentum pre version 5.3:\n\n| 权限 | 简短说明 |\n|---|---|\n| Change State | 用户可以更改对象的生命周期状态。\
  \ |\n| Change Permission | 用户可以更改对象的权限。 |\n| Change Ownership | 用户可以更改对象的所有者。 |\n\
  | Execute Procedure | 用户可以执行与对象关联的外部过程。 |\n| Change Location | 用户可以更改对象的位置，例如从一个文件夹到另一个文件夹。\
  \ |\n\nFigure 3.4: Extended permissions in Documentum (pre 5.3)\n\nIt is worth mentioning\
  \ here that Documentum uses two reserved aliases in ACLs:\n\n- `dm_owner`: Symbolizes\
  \ the current owner of the object\n- `dm_world`: This is an alias for all the users\
  \ present in the Docbase\n\nLet us take an example of a sample ACL attached to a\
  \ folder in the Docbase:\n\n**ACL 名称:** `OrganizationHR_ACL`\n\nThe permissions\
  \ are as follows:\n\n- `dm_owner`: DELETE\n- `Hr_group`: WRITE\n- `Finance_group`:\
  \ READ\n- `dm_world`: NONE\n\nThis means that the owner of the ACL (i.e. the one\
  \ who created this ACL) has the highest rights—DELETE. The Human Resources (HR)\
  \ group in the organization has WRITE access to the folder. The Finance group in\
  \ the organization has just READ access to the folder. All other groups can not\
  \ even see the folder since they have NONE access to the folder.\n\n### 3.7 别名集\n\
  \nAn Alias Set, as the name suggests is a list of Aliases. Now what exactly is an\
  \ Alias? An Alias in plain terms should be considered to be a placeholder for value.\
  \ An Alias resolves to a particular value called the Alias value. Alias sets are\
  \ stored as dm_alias_set objects in Docbase.\n\nLet us take an example here, in\
  \ order to clear up all confusions.\n\nAn organization's workflow needs to go through\
  \ a sequence of reviewers before it can be finally approved and published over to\
  \ the website. A content author creates the content and needs to send it to his\
  \ or her content manager for review. After the initial review, it needs to be finally\
  \ approved by an approver.\n\nNow, for each individual content author, his or her\
  \ manager and approver would be different. Should a separate workflow be created\
  \ individually for each content author? Or should it be hard-coded with the actual\
  \ names of all the content authors in the organization and their content managers\
  \ and approvers? What would happen if a new author or manager joins the organization\
  \ in the future?\n\nAn alias set comes to our rescue! An alias set can be created\
  \ for the workflow with placeholders for content authors, content managers, and\
  \ approvers, etc. At run time, when the workflow is executed, the alias names can\
  \ be substituted with their actual values.\n\nIn Documentum, an Alias Set can have\
  \ placeholders for the following entities:\n\n- Unknown (this is for the case when\
  \ no existing entity fits)\n- User\n- Group\n- User or Group\n- Cabinet Path\n-\
  \ Folder Path\n- Permission Set\n\nFigure 3.5 shows a sample Alias Set in the Docbase\
  \ as seen in Documentum Application Builder.\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_50_0.png)\n\
  \nFigure 3.5: Sample alias set\n\nWe shall create custom Alias Sets in Chapter 12.\n\
  \n### 3.8 用户和组\n\nIt might sound bizarre, but Documentum stores users and groups\
  \ in the form of objects!\n\n#### 3.8.1 用户\n\nUsers are stored as dm_user objects\
  \ in the Docbase. We will now discuss some important attributes of the dm_user object:\n\
  \n- user_name: This is the actual name of the user and can contain spaces, for example\
  \ 'Gaurav Kathuria'. Internally Content Server assigns this value to the owner_name\
  \ attribute for the objects created by this particular user.\n- user_os_name: This\
  \ is what Documentum uses to validate the user's credentials for authentication\
  \ purposes, for example 'gauravk'.\n- user_address: This stores the user's email\
  \ address and is used by Content Server to send notifications.\n\nThese three attributes\
  \ are mandatory for a user object and should always be filled in when creating a\
  \ Documentum user.\n\nEach user has certain user privileges assigned to him or her:\n\
  \n- None (no special privileges)\n- Create Type (can create object types)\n- Create\
  \ Cabinet (can create cabinets)\n- Create Group (can create groups)\n- Sysadmin\
  \ (system administration privileges)\n- Superuser (highest-level privileges)\n\n\
  Users in Documentum can be created through numerous mechanisms:\n\n- DQL queries\n\
  - API commands\n- LDIF file (import users)\n- Documentum Administrator user interface\n\
  - DFC classes\n\n#### 3.8.2 组\n\nDocumentum groups are nothing but sets of Documentum\
  \ users and groups. Documentum stores groups as dm_group objects. Let us take an\
  \ example to understand the importance of groups in Docbase.\n\n\n\n假设有一个权限集（ACL）分配给一个对象，并且特定用户可以访问它。例如，人力资源部门的所有用户对其具有写入访问权限，而财务部门的用户具有读取权限。\n\
  \n如果我们为人力资源部和财务部的每个用户单独设计 ACL 以授予特定权限，我们就会陷入混乱。每当人力资源部或财务部有新用户加入时，我们就必须重新审视 ACL。\n\
  \n组帮我们避免了这种麻烦。不是为每个用户单独分配权限，而是将所有人力资源用户归为一个 HR 组，将所有财务用户归为一个 Finance 组，然后在组级别而不是针对特定用户分配权限。组可以分为两种类型：\n\
  \n- **公开：** 如果系统管理员或超级用户创建组，则该组被标记为公开。\n- **私有：** 如果具有“Create group”权限的用户创建组，则该组被标记为私有。\n\
  \n在内部，Documentum 并不会对这两种类型的组进行区别对待。具体如何解释则取决于各个应用程序根据业务需求来决定。\n\n组可以通过以下方式创建：\n\n\
  - DQL 查询\n- API 命令\n- Documentum Administrator 用户界面\n- DFC 类\n\n### 3.9 渲染\n\n文档的渲染基本上是原始文档的表示，仅在格式上有所不同。Content\
  \ Server 内部具有转换器来支持众多渲染。此外，将 Media Services 与 Content Server 集成还可以提供对富媒体格式的支持。\n\
  \n渲染的示例如下：\n\n一名 Web 开发人员创建了一个内容模板，例如 create_article.xml，并将演示 XSL 文件附加到它，以便将其转换为\
  \ HTML 文件和 WML 文件。从此模板创建的内容将以 HTML 文件和 WML 文件的形式呈现，分别用于在网站和无线应用程序上显示。\n\nHTML 和\
  \ WML 文件与原始内容文件仅在格式上不同，而内容相同。\n\n图 3.6 以简化的方式解释了这一点。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_53_0.png)\n\
  \nFigure 3.6: 渲染\n\n## 3.10 注册表\n\n大多数应用程序维护一些应用程序表以存储特定于应用程序的数据。这些应用程序表可能包含 Documentum\
  \ 客户端需要访问的记录。例如，Documentum 客户端应用程序中的下拉菜单可能需要从外部数据库表中显示世界上所有国家的列表，以便内容作者在创建内容时进行选择。\n\
  \n在注册之前，Content Server 不会知道外部数据库表。简而言之，注册表是 Content Server 所知的普通 RDBMS 表，尽管它们不是\
  \ Docbase 的一部分。\n\nDocumentum 为“Registered”表创建一个 dm_registered 对象，允许开发人员使用 DQL 查询从表中获取信息。\n\
  \ndm_registered 对象包含有关表名、表所有者、表列以及定义谁有权查询表并执行插入/更新/删除行等操作的信息。\n\n我们将在第 11 章更详细地讨论注册表。\n\
  \n## 3.11 数据字典\n\nDocbase 中的数据字典（DD）存储有关 Documentum 对象类型及其属性的信息。数据字典在以下场景中非常有用：\n\
  \n- **向用户显示的值帮助**\n  示例：显示属性可能取值集合的下拉菜单\n- **应用某些业务特定规则**\n  示例：对属性值的约束，如“not null”和“unique\
  \ key”\n\nDD 可以支持多种语言环境，因此可以根据各种终端用户的默认语言环境对存储的信息进行本地化。此外，DD 信息由 Content Server\
  \ 内部管理，一旦我们发布其中包含的数据，就可以将其提供给终端用户。\n\n在撰写本书时，安装 Content Server 时 Documentum 提供的以下语言环境的数据字典信息为：\n\
  \n- 英语\n- 法语\n- 德语\n- 意大利语\n- 日语\n- 韩语\n- 西班牙语\n\n## 3.12 方法和作业\n\n方法是在 Docbase\
  \ 中可执行的程序和脚本，可以由作业自动安排运行，作业是 Documentum 对象（dm_job），用于自动执行方法对象。以下各节将详细介绍方法和作业。\n\n\
  ### 3.12.1 方法\n\n方法脚本可以用 Java、Docbasic（Documentum 的专有语言）或其他语言编写。在 Documentum 中，方法被视为方法对象（dm_method），其属性定义了各种方法参数，例如执行代理、方法类型、超时时间和方法参数。方法可以由以下服务器执行代理执行：\n\
  \n- **Content Server：** 这是方法的默认执行代理，除非指定了特定的执行代理。Content Server 用于执行与 Docbasic 脚本或其他编程语言脚本相关的方法对象。\n\
  - **Method Server：** 这是一个守护进程，只要 Docbase 运行就一直运行，并由 Content Server 管理。注意，Method\
  \ Server 默认随 Content Server 一起安装。Method Server 可用于执行与 Docbasic 脚本相关的方法对象。\n- **Java\
  \ 方法服务器：** 在 Content Server 安装期间，Documentum 在 Content Server 主机上将 Apache Tomcat\
  \ 应用服务器安装为 Java 方法服务器。Java 方法服务器可用于执行调用 Java 方法的方法对象。\n\nDocumentum 方法可以在 Documentum\
  \ Administrator 中的以下位置创建、修改和查看：Administration | Job Management | Methods。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_55_0.png)\n\
