  \ |\n\n图 21.20：SCS Source 发布状态 XML 的解释\n\n## 21.8 摘要\n\n我们简要讨论了站点缓存服务（SCS）允许您轻松配置并从\
  \ Docbase 发布文档及其属性（如标题、作者、关键字等）到网站主机和数据库表。\n\n然后我们查看了使用 SCS 的一些限制，并讨论了各种类型的发布操作：完全刷新、增量刷新/发布、强制刷新和单个对象发布。\n\
