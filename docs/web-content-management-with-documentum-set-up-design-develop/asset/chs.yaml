  \ 对象属性定义作业参数，如关联方法、执行计划、方法参数等。\n\n作业由随 Content Server 安装的 Documentum agent exec\
  \ 进程执行。图 3.8 显示了作业和方法在 Documentum 架构中如何协同工作。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_55_1.png)\n\
  \nFigure 3.8: 作业和方法执行\n\nDocumentum 作业可以在 Documentum Administrator 中的以下位置创建、修改和查看：Administration\
  \ | Job Management | Jobs。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_56_0.png)\n\
