  \ Server Files 安装日志\n\n9. 安装完成后，在 Content Server 主机上停止并重新启动 Documentum Java Method\
  \ Server。\n\n## 6.4 停止和启动 Docbase 和 DocBroker\n\nDocumentum Server Manager 在 Content\
