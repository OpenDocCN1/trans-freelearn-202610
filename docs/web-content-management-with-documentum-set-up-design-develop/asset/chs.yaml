  </asynchronous-publishes>\n<active-publishes>\n<count>0</count>\n</active-publishes>\n\
  </state>\n```\n\n图 21.20 解释了上述 XML 结果集传达的有价值信息。\n\n| XML 元素 | 解释 |\n|---|---|\n\
