  \n图 17.11：导出更新后的内容文件\n\n更新后的内容文件 Testing1_Original_Template.xml：\n\n```\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<PRODUCTINFO>\n    <NAME>Prod A</NAME>\n    <SHORTDESC>\n\
  <p>\nThis is of type A\n</p>\n</SHORTDESC>\n    <PRODUCTTYPE>Type A</PRODUCTTYPE>\n\
  </PRODUCTINFO>\n```\n\n请注意此内容文件中不存在 <COST> XML 元素。\n\n另一个内容文件（Testing2_Original_Template.xml）仍为版本\
  \ 1.0，因为它未通过指令文件进行更新。\n\n如果您使用 Web Publisher 编辑器编辑内容 Testing1_Original_Template.xml，则\
  \ Cost: 字段将不会显示，符合更新后的模板结构。图 17.12 显示了在 Web Publisher 编辑器中查看的、没有 Cost 字段的更新后内容文件。\n\
