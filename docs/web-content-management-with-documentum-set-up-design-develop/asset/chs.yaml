  \ 用于删除现有 XML 元素的指令文件元素\n- `<path>`: 用于标识要删除的 XML 元素当前存在的路径的 XPath 表达式\n- `<nodename>`:\
  \ 要删除的目标节点（XML 元素）的名称\n- `<comments>`: 说明指令文件用途的可选注释\n\n5. 以管理员身份从 Web Publisher\
  \ 左侧树窗格浏览至 Site Manager | Instructions。创建文件夹以存储自定义指令文件。在创建的文件夹内，通过选择 File | Import\
  \ 导入 Delete_Element_Instruction.xml 指令文件，如图 17.4 和 17.5 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_272_0.png)\n\
  \n图 17.4：导入 Delete_Element_Instruction.xml 文件（步骤 1）\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_272_1.png)\n\
  \n图 17.5：导入 Delete_Element_Instruction.xml 文件（步骤 2）\n\n6. 就指令文件的配置而言，我们已全部准备就绪。现在，在\
  \ Site Manager | Templates 下浏览到修改后模板文件 `original_Template.xml` 的相应类别。选择修改后的模板文件\
