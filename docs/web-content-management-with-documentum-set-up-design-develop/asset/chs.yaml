- "## 23 使用 DFC\n\n在几乎所有基于 Documentum 执行的项目中，您可能需要自定义和扩展内容服务器提供的基本内容管理功能。\n\n您可能需要编写自定义生命周期或工作流方法，或对现有\
  \ Documentum 产品（如 Desktop 或 Web Publisher）进行业务特定的自定义。如果要实现这些目标，您必须先了解和学习 Documentum\
  \ 原生服务器 API 调用以及 Docbasic 等专有语言，那不是很困难吗？\n\n好吧，Documentum 为您提供了一个更简单的包装接口，使您无需直接进行原生调用，并减少了熟悉任何专有语言及其语法的学习曲线。答案是\
  \ DFC。\n\nDFC 是 Documentum Foundation Classes 的缩写，以一组 Java 接口及其实现类提供。然而，对于在 Microsoft\
  \ COM（组件对象模型）环境中工作的人来说，DFC 提供了 Documentum Java-COM 桥（DJCB）来访问 Java 接口。最后，在 .NET\
  \ 环境中，您可以使用 DFC PIA（Primary Interop Assembly）来访问 DFC 接口。此外，DFC 包含一个业务对象框架（BOF），使您能够以可重用组件的形式封装业务规则，从而扩展\
  \ DFC 实现类提供的功能。\n\n简而言之，DFC 作为一个框架存在，公开内容服务器的内容管理功能供您有效利用。\n\n> DFC 暴露了一些服务器 API\
  \ 方法，如 apiGet 和 apiSet，通过进行原生服务器 API 调用来访问内容服务器功能。这仅为与未基于 DFC 的旧模型向后兼容而提供。您应避免使用此类服务器\
  \ API 方法，而应改用 DFC 中可实现相同目的的替代方法。\n\n例如，考虑为 SysObject 设置 object_name 属性：\n\n- **错误方式：**\
  \ `sysObj.apiSet(\"set\", \"object_name\", objectNameToBeSet);`\n- **推荐方式：** `sysObj.setObjectName(objectNameToBeSet);`\n\
  \n### 23.1 DFC 简介\n\n入门的最佳方式是查看 DFC Javadocs 中的 API 规范。如果您已安装 DFC（独立安装或与 Application\
  \ Builder 或 Content Server 等其他 Documentum 产品一起安装），请浏览本地计算机上的以下位置：\n\n示例：`c:\\Program\
  \ Files\\Documentum\\help\\dfc\\api`\n\n打开 index.html 查看 DFC API，并花一些时间浏览可用的包、接口和类。\n\
  \nDFC API 中必须遵循以下命名约定：\n\n- **包均以** `com.documentum.` 开头\n  DFC 中有许多包，例如 `com.documentum.xml.xdql`，它提供用于使用\
  \ XDQL 的接口和类，以及 `com.documentum.fc.client`，它提供用于创建/管理 Docbase 会话和操作 Docbase 中数据的接口和类。\n\
  - **接口均以** `IDf.` 开头\n  两个常用的 DFC 接口是 `IDfSessionManager` 和 `IDfSysObject`。\n- **类均以**\
  \ `Df.` 开头\n  DFC 中两个常用的类是 `DfClient` 和 `DfQuery`。\n\n如果您浏览 DFC Javadocs，您会注意到 DFC\
  \ 中的接口遵循层次模式。这意味着每个接口继承层次链中在其之上的接口的所有方法和常量。例如，在图 23.1 中，请注意 `IDfPersistentObject`\
  \ 接口从其超接口 `IDfTypedObject` 继承 `getObjectId()` 等方法，并添加了 `destroy()` 和 `save()` 等特定于它的\
  \ 方法。\n\n\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_372_0.png)\n\nFigure 23.1:\
  \ Sample DFC interface hierarchy\n图 23.1：示例 DFC 接口层次结构\n\n## 23.2 Environment Readiness\n\
  ## 23.2 环境准备\n\nOnce you have DFC available on your machine, you need to ensure\
  \ that the following entries are present in your system classpath (CLASSPATH environment\
  \ variable) before you can start programming:\n一旦你的机器上已安装 DFC，在开始编程之前，你需要确保以下条目存在于系统类路径（CLASSPATH\
  \ 环境变量）中：\n\n```\nC:\\Documentum\\config\nC:\\Program Files\\Documentum\\dctm.jar\n\
  C:\\Program Files\\Documentum\\shared\\dfc.jar\nC:\\Program Files\\Documentum\\\
  shared\\dfcbase.jar\n```\n\nAssuming that you are working in a Java environment,\
  \ find out the supported JRE (Java Runtime Environment) for DFC from the published\
  \ Documentum release notes and install the correct JRE on your machine.\n假设你正在 Java\
  \ 环境中工作，请从发布的 Documentum 发行说明中查明 DFC 支持的 JRE（Java 运行时环境），并在你的机器上安装正确的 JRE。\n\nIn\
  \ this book, all DFC examples will be compiled and executed using JDK1.4.2_04.\n\
  本书中的所有 DFC 示例都将使用 JDK1.4.2_04 编译和执行。\n\nIn order to establish a connection to Docbase\
  \ via DFC, the dmc1.ini file on your machine should contain correct entries for\
  \ DocBroker host and port number.\n为了通过 DFC 建立到 Docbase 的连接，你机器上的 dmc1.ini 文件应包含\
  \ DocBroker 主机和端口号的正确条目。\n\nOn Windows machines, the dmc1.ini file is usually found\
  \ under the %SystemRoot% location (such as C:\\WINDOWS or C:\\WINNT).\n在 Windows\
  \ 机器上，dmc1.ini 文件通常位于 %SystemRoot% 位置下（如 C:\\WINDOWS 或 C:\\WINNT）。\n\n## 23.3 Simple\
  \ Example Demonstrating DFC Usage\n## 23.3 演示 DFC 用法的简单示例\n\nLet us create a simple\
  \ Java file (save it as FirstDFC.java) as shown below to create and establish a\
  \ Docbase session via DFC.\n让我们创建一个简单的 Java 文件（保存为 FirstDFC.java），如下所示，通过 DFC 创建并建立\
  \ Docbase 会话。\n\n```java\nimport com.documentum.fc.client.*;\nimport com.documentum.fc.common.*;\n\
  \nimport java.io.IOException;\n\npublic class FirstDFC{\n\n//Main method\npublic\
  \ static void main(String args[]){\n\n    IDfSession session = null;\n    IDfSessionManager\
  \ sMgr = null;\n\n    try\n    {\n        IDfClient client = new DfClient().getLocalClient();\n\
  \        sMgr = client.newSessionManager();\n        IDfLoginInfo loginInfo = new\
  \ DfLoginInfo();\n\n        loginInfo.setUser(\"documentum\");\n        loginInfo.setPassword(\"\
  solutions\");\n        sMgr.setIdentity(\"dev_doc\", loginInfo);\n        session\
  \ = sMgr.getSession(\"dev_doc\");\n\n        System.out.println(\"Session created\
  \ !!\");\n    }catch(DfException dfe){\n        System.out.println(\"DfException\
  \ caught in main: \" +\n                dfe.getMessage());\n    }\n    catch(Exception\
  \ e){\n        System.out.println(\"Catching generic exception in main: \" +\n \
  \               e.getMessage());\n    }\n    finally {\n        sMgr.release( session\
  \ );\n    }\n\n}// end of Main\n\n}// end of class\n```\n\nLet's discuss the anatomy\
  \ of this DFC code:\n让我们讨论这段 DFC 代码的结构：\n\n```\nimport com.documentum.fc.client.*;\n\
  import com.documentum.fc.common.*;\n```\n\nThe DFC Packages imported are com.documentum.fc.client\
  \ and com.documentum.fc.common. Package com.documentum.fc.client provides interfaces\
  \ and classes for establishing Docbase sessions and controlling Docbase data. Package\
  \ com.documentum.fc.common provides some utility functions for manipulating Docbase\
  \ objects.\n导入的 DFC 包为 com.documentum.fc.client 和 com.documentum.fc.common。包 com.documentum.fc.client\
  \ 提供了用于建立 Docbase 会话和控制 Docbase 数据的接口和类。包 com.documentum.fc.common 提供了用于操作 Docbase\
  \ 对象的一些实用函数。\n\n```\nIDfClient client = new DfClient().getLocalClient();\n```\n\n\
  The IDfClient interface is used for making connections with Documentum servers.\
  \ The handle to IDfClient interface is obtained by calling the getLocalClient()\
  \ method on class DfClient. The IDfClient interface is used as a factory for IDfSessionManager\
  \ objects (see line 18), which are used for creating sessions (IDfSession objects).\n\
  IDfClient 接口用于与 Documentum 服务器建立连接。IDfClient 接口的句柄是通过在 DfClient 类上调用 getLocalClient()\
  \ 方法获得的。IDfClient 接口用作 IDfSessionManager 对象的工厂（参见第 18 行），后者用于创建会话（IDfSession 对象）。\n\
  \nNote that you can use the IDfClientX interface for facilitating DFC access through\
  \ the COM environment.\n请注意，你可以使用 IDfClientX 接口通过 COM 环境促进 DFC 访问。\n\n```\nIDfLoginInfo\
  \ loginInfo = new DfLoginInfo();\n```\n\nThis references the IDfLoginInfo object\
  \ required for encapsulating login information such as user name and password for\
  \ a user in the Docbase.\n这引用了用于封装 Docbase 中用户登录信息（如用户名和密码）的必需 IDfLoginInfo 对象。\n\
  \n```\nsMgr.setIdentity( \"dev_doc\", loginInfo );\n```\n\nThe setIdentity() method\
  \ of IDfSessionManager sets the identity for user authentication in Docbase. You\
  \ need to provide two parameters—the Docbase name (dev_doc) and the IDfLoginInfo\
  \ set in the steps above.\nIDfSessionManager 的 setIdentity() 方法设置 Docbase 中用户身份验证的身份。你需要提供两个参数——Docbase\
  \ 名称（dev_doc）和上面步骤中设置的 IDfLoginInfo。\n\n```\nsession = sMgr.getSession( \"dev_doc\"\
  \ );\n```\n\nThe getSession() method in IDfSessionManager is used to obtain Docbase\
  \ sessions. You need to provide the Docbase name as a parameter to this method.\n\
  IDfSessionManager 中的 getSession() 方法用于获取 Docbase 会话。你需要将 Docbase 名称作为参数提供给此方法。\n\
  \n```\n}catch(DfException dfe){\n```\n\nDfException extends java.lang.Exception\
  \ and is thrown while invoking DFC methods.\nDfException 扩展 java.lang.Exception，并在调用\
  \ DFC 方法时抛出。\n\n```\nsMgr.release( session );\n```\n\nThe release() method in IDfSessionManager\
  \ is used to release the session. This makes it available to Session Manager so\
  \ that the same session can be recycled and made available to anyone who issues\
  \ a getSession() call. This is good practice and should be followed as a rule.\n\
  IDfSessionManager 中的 release() 方法用于释放会话。这使其可供会话管理器使用，以便可以回收同一会话并使其可供发出 getSession()\
  \ 调用的任何人使用。这是良好的实践，应作为规则遵循。\n\nThat's it! Compile the code by running javac FirstDFC.java\
  \ and run it by calling java FirstDFC. You will see the Session created! message\
  \ on the console, indicating that a successful Docbase session has been established.\n\
  就这样！通过运行 javac FirstDFC.java 编译代码，并通过调用 java FirstDFC 运行它。你将在控制台上看到 Session created!\
  \ 消息，表明已成功建立 Docbase 会话。\n\n## 23.4 Creating and Linking a File in a Docbase Cabinet\n\
  ## 23.4 在 Docbase 文件柜中创建并链接文件\n\nWe saw a very simple example to establish a session\
  \ with the Docbase. Once the Docbase session has been created, you can perform a\
  \ host of operations in the Docbase. In this example, we will see how to create\
  \ a document object in the Docbase, associate it with a text file, and link this\
  \ object to a cabinet in the Docbase via DFC methods.\n我们看到了一个非常简单的示例来建立与 Docbase\
  \ 的会话。一旦 Docbase 会话创建完成，你就可以在 Docbase 中执行大量操作。在本示例中，我们将了解如何通过 DFC 方法在 Docbase 中创建文档对象，将其与文本文件关联，并将此对象链接到\
  \ Docbase 中的文件柜。\n\nCreate a simple Java file LinkingFileDFC.java as shown below:\n\
  创建一个简单的 Java 文件 LinkingFileDFC.java，如下所示：\n\n```java\nimport com.documentum.fc.client.*;\n\
  import com.documentum.fc.common.*;\nimport java.io.IOException;\n\npublic class\
  \ LinkingFileDFC{\n\n//Main method\npublic static void main(String args[]){\n\n\
  IDfSession session = null;\nIDfSessionManager sMgr = null;\n\ntry\n{\n    String\
  \ strDocbaseName = \"dev_doc\";\n\n    //Connecting to DocBase\n    IDfClient client\
  \ = new DfClient().getLocalClient();\n    sMgr = client.newSessionManager();\n \
  \   IDfLoginInfo loginInfo = new DfLoginInfo();\n\n    loginInfo.setUser(\"documentum\"\
  );\n    loginInfo.setPassword(\"solutions\");\n    sMgr.setIdentity(strDocbaseName,\
  \ loginInfo);\n    session = sMgr.getSession(strDocbaseName);\n\n    System.out.println(\"\
  Connected to DocBase..\");\n\n    //Linking a text document to a DocBase cabinet\n\
  \    IDfDocument document = null;\n    document = (IDfDocument)session.newObject(\"\
  dm_document\");\n    document.setObjectName(\"testing_link_file\");\n    document.setContentType(\"\
  crtext\");\n    document.setFile(\"C:\\\\test\\\\DummyLinkedFile.txt\");\n    document.link(\"\
  /Custom_Cabinet/Custom_Fld\");\n    document.save();\n\n    System.out.println(\"\
  Object saved and linked!!\");\n}catch(DfException dfe){\n    System.out.println(\"\
  DfException caught in main: \" + dfe.getMessage());\n}catch(Exception e){\n    System.out.println(\"\
  main::Exception is \" + e.getMessage());\n}\nfinally {\n    sMgr.release( session\
  \ );\n}\n}// end of Main\n} // end of class\n```\n\nThe anatomy of the DFC code\
  \ follows:\nDFC 代码的结构如下：\n\n```\nIDfClient client = new DfClient().getLocalClient();\n\
  sMgr = client.newSessionManager();\nIDfLoginInfo loginInfo = new DfLoginInfo();\n\
  \nloginInfo.setUser(\"documentum\");\nloginInfo.setPassword(\"solutions\");\nsMgr.setIdentity(strDocbaseName,\
  \ loginInfo);\nsession = sMgr.getSession(strDocbaseName);\n```\n\nA session is established\
  \ with the Docbase.\n与 Docbase 建立了会话。\n\n```\ndocument = (IDfDocument)session.newObject(\
  \ \"dm_document\" );\n```\n\nThe newObject() method of IDfSession is invoked to\
  \ create a new persistent object in the Docbase of the type specified as a parameter\
  \ (dm_document). The returned object is cast to the required interface (IDfDocument).\n\
  调用 IDfSession 的 newObject() 方法在 Docbase 中创建指定为参数的类型（dm_document）的新持久对象。返回的对象被强制转换为所需的接口（IDfDocument）。\n\
  \nIt is worth mentioning that Documentum does not commit this object to the Docbase\
  \ until and unless an explicit save() call is made via DFC (see line 36).\n值得一提的是，除非通过\
  \ DFC 显式调用 save()（参见第 36 行），否则 Documentum 不会将此对象提交到 Docbase。\n\n```\ndocument.setObjectName(\
  \ \"testing_link_file\" );\n```\n\nHere we set the name of the document object by\
  \ passing the name as a parameter to the setObjectName() method of IDfDocument.\n\
  在这里，我们通过将名称作为参数传递给 IDfDocument 的 setObjectName() 方法来设置文档对象的名称。\n\n```\ndocument.setContentType(\
  \ \"crtext\" );\n```\n\nHere we set the file format of the document's content by\
  \ calling the setContentType() method of IDfSysObject object. (Remember that IDfSysObject\
  \ is a superinterface of IDfDocument.)\n在这里，我们通过调用 IDfSysObject 对象的 setContentType()\
  \ 方法来设置文档内容的格式。（请记住 IDfSysObject 是 IDfDocument 的超接口。）\n\nPass the Documentum format\
  \ name (of the type dm_format) as a parameter to the method. In our case we have\
  \ passed crtext as the format name to the setContentType() method since we need\
  \ to link a Windows text file with the document object.\n将 Documentum 格式名称（类型为 dm_format）作为参数传递给该方法。在我们的例子中，我们将\
  \ crtext 作为格式名称传递给 setContentType() 方法，因为我们需要将 Windows 文本文件与文档对象链接。\n\nNote that\
  \ for UNIX, the format name for a text document is text while it is mactext for\
  \ Mac OS.\n请注意，对于 UNIX，文本文档的格式名称为 text，而对于 Mac OS 则为 mactext。\n\n```\ndocument.setFile(\
  \ \"C:\\\\test\\\\DummyLinkedFile.txt\" );\n```\n\nThis line creates a sample .txt\
  \ file on your machine by providing the complete path to this file in the setFile()\
  \ method of the IDfSysObject object.\n此行通过在 IDfSysObject 对象的 setFile() 方法中提供此文件的完整路径，在你的机器上创建一个示例\
  \ .txt 文件。\n\nThis method sets the content file for the newly created document object\
  \ in Docbase.\n此方法设置 Docbase 中新创建的文档对象的内容文件。\n\n```\ndocument.link(\"/custom_cabinet/custom_Fld\"\
  );\n```\n\nThe document object is associated with a folder existing in the Docbase\
  \ by calling the link() method. We have provided the folder path (custom_Fld folder\
  \ within custom_cabinet cabinet) where the document object needs to be linked in\
  \ the Docbase.\n通过调用 link() 方法，文档对象与 Docbase 中已有的文件夹关联。我们提供了文件夹路径（custom_cabinet\
  \ 文件柜内的 custom_Fld 文件夹），文档对象需要在 Docbase 中链接到该位置。\n\nNote that you can also provide\
  \ the object ID of the folder instead of its cabinet path in the link() method.\n\
  请注意，在 link() 方法中，你也可以提供文件夹的对象 ID 而不是其文件柜路径。\n\nWhen you compile and execute the\
  \ LinkingFileDFC.java code, the following messages are printed on your console:\n\
  当你编译并执行 LinkingFileDFC.java 代码时，以下消息会打印在你的控制台上：\n\nConnected to DocBase. followed\
  \ by Object saved and linked!!.\nConnected to DocBase. 后跟 Object saved and linked!!。\n\
  \n\n\n你可以登录 Web Publisher 并在 Docbase 中浏览 Custom_Cabinet 文件柜内的 Custom_Fld 文件夹。你会注意到一个名为\
  \ testing_link_file 的文本文件对象已创建并通过 DFC 链接，如图 23.2 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_377_0.png)\n\
  \n图 23.2：Docbase 文件柜中可见的已链接文本文件\n\n## 23.5 通过 DFC 运行 Docbase 方法\n\nDocbase 方法可以通过多种方式运行：\n\
  \n- 通过 Documentum Administrator 中的 Documentum 作业进行调度和运行\n- 直接从 Documentum Administrator\
  \ 运行方法\n- 运行 DQL 命令 EXECUTE do_method\n- 执行服务器 API 调用 apply\n\n除了上述机制之外，你还可以通过进行\
  \ DFC 调用来调用和运行方法，正如我们在本示例中将看到的那样。\n\n创建一个 Java 文件并将其保存为 RunningMethodThroughDFC.java。\n\
  \n声明常量，存储方法名称、其关联作业和方法参数，如下面的代码所示。\n\n在本示例中，我们将通过 DFC 代码运行 Data Dictionary Publisher\
  \ 方法。Documentum 提供的此管理工具将 Content Server 数据字典信息发布到客户端应用程序。回顾我们在第 3 章中对数据字典的早期讨论。\n\
  \n```\nimport com.documentum.fc.client.*;\nimport com.documentum.fc.common.*;\n\n\
  import java.io.IOException;\n\npublic class RunningMethodThroughDFC{\nstatic final\
  \ String methodName = \"dm_DataDictionaryPublisher\";\nstatic final String jobName\
  \ = \"dm_DataDictionaryPublisher\";\nstatic final String methodArguments = \"-docbase_name\
  \ dev_doc.dev_doc -user_name documentum -method_trace_level 5\";\n//Main method\n\
  public static void main(String args[]){\n```\n\n请注意，所示 Data Dictionary 工具的方法参数为\
  \ docbase_name（dev_doc.dev_doc，即 <server>.<Docbase 名称>）、user_name（documentum，即用于运行方法的\
  \ Docbase 用户）以及 method_trace_level（5，即方法执行的跟踪级别）。\n\n首先建立 Docbase 会话，然后按照下面显示的代码片段操作：\n\
  \n```\nIDfQuery q = null;\nIDfCollection coll = null;\nString methodCmd = null;\n\
  String methResult = null;\nString methObjectId = null;\n\n// Fetching method reference\n\
  q = new DfQuery();\nq.setDQL(\"select r_object_id from dm_method where object_name='\"\
  \ + methodName + \"'\");\n\ncoll = q.execute(session, DfQuery.DF_READ_QUERY);\n\
  while (coll.next()) {\n    methObjectId = coll.getId(\"r_object_id\").toString();\n\
  }\n\ncoll.close();\n\nSystem.out.println(\"Object ID of the method:  \" + methObjectId\
  \ );\n\n// Fetching associated job reference\nIDfQuery qry = null;\nIDfCollection\
  \ colln = null;\nString jobObjectId = null;\n\nqry = new DfQuery();\nqry.setDQL(\"\
  select r_object_id from dm_job where object_name='\" + jobName + \"'\");\n\ncolln\
  \ = qry.execute(session, DfQuery.DF_READ_QUERY);\nwhile (colln.next()) {\n    jobObjectId\
  \ = colln.getId(\"r_object_id\").toString();\n}\n\ncolln.close();\n\nmethodCmd=\"\
  DO_METHOD,METHOD,S,\" + methodName +\n          \",TIME_OUT,I,200,SAVE_RESULTS,B,T,ARGUMENTS,S,\"\
  \ \n          + methodArguments + \" -job_id \" + jobObjectId;\n\n//Obtaining handle\
  \ to the method\nIDfId sysobjID = new DfId(methObjectId);\nIDfSysObject sysObject\
  \ = (IDfSysObject)session.getObject(sysobjID);\n// Executing the method\nmethResult\
  \ = sysObject.apiGet(\"apply\", methodCmd);\n\nSystem.out.println(\"Result of executing\
  \ the method:  \" + methResult );\n\nsysObject.save();\n\nSystem.out.println(\"\
  method executed successfully!!\");\n\n}catch(Exception e){\n    System.out.println(\"\
  main::Exception is \" + e.getMessage());\n}\nfinally {\nsMgr.release( session );\n\
  ```\n\n```\n}\n}\n}\n```\n\n下面讨论 DFC 代码的结构：\n\n```\nq = new DfQuery();\n```\n\n\
  这会获取对 IDfQuery 对象的引用以对 Docbase 运行 DQL 查询。\n\n```\nq.setDQL(\"select r_object_id\
  \ from dm_method where object_name='\" + methodName + \"'\");\n```\n\n这调用 IDfQuery\
  \ 对象的 setDQL() 方法，将要执行的 DQL 查询作为参数传递。确保 DQL 查询在语法上是正确的。\n\n```\ncoll = q.execute(session,\
  \ DfQuery.DF_READ_QUERY);\n```\n\n这调用 IDfQuery 对象的 execute() 方法，将 Docbase 会话和要执行的查询类型作为参数传递。在我们的例子中，由于我们只需要从\
  \ Docbase 检索对象引用（换句话说是一个只读的 select 查询），因此我们将查询类型指定为 DfQuery.DF_READ_QUERY。\n\n```\n\
  while (coll.next()) {\n```\n\n执行 DQL 查询会返回一个集合结果（IDfCollection 对象）。\n\n通过调用 next()\
  \ 方法遍历集合，直到它返回 false。\n\n关闭集合以节省系统资源是良好的实践。\n\n```\nmethObjectId = coll.getId(\"\
  r_object_id\").toString();\n```\n\n我们调用 IDfTypedObject 对象的 getId() 方法来获取检索到的 Data\
  \ Dictionary Publisher 方法的对象 ID（r_object_id）。\n\n```\nIDfQuery qry = null;\nIDfCollection\
  \ colln = null;\nString jobObjectId = null;\n\nqry = new DfQuery();\nqry.setDQL(\"\
  select r_object_id from dm_job where object_name='\" + jobName + \"'\");\ncolln\
  \ = qry.execute(session, DfQuery.DF_READ_QUERY);\nwhile (colln.next()) {\n    jobObjectId\
  \ = colln.getId(\"r_object_id\").toString();\n}\ncolln.close();\n```\n\n在上面的行中，我们获取关联的\
  \ Data Dictionary Publisher 作业的对象 ID。\n\n```\nmethodCmd=\"DO_METHOD,METHOD,S,\"\
  \ + methodName + \",TIME_OUT,I,200,SAVE_RESULTS,B,T,ARGUMENTS,S,\" + methodArguments\
  \ + \" -job_id \" + jobObjectId;\n```\n\n我们按如下方式定义方法执行命令参数：\n\n- DO_METHOD 用于执行\
  \ Docbase 脚本和方法。\n- METHOD 表示需要执行一个方法。\n- S 表示方法名称的数据类型为字符串。\n- TIME_OUT 表示方法执行的时间限制（秒）。\n\
  - I 表示超时的数据类型为整数。\n- 200 表示方法的超时期限（秒）。\n- SAVE_RESULTS 表示是否希望将执行结果保存到 Docbase 中的文档中。\n\
  - B 表示 SAVE_RESULTS 选项的布尔数据类型（true 或 false）。\n- T 代表选项 true，要求将结果保存到文档中。\n- ARGUMENTS\
  \ 表示方法执行的命令行参数。\n- S 表示方法参数的数据类型为字符串。\n- job_id 参数捕获关联的 Data Dictionary Publisher\
  \ 作业的对象 ID。\n\n以下语句调用 IDfPersistentObject 对象的 apiGet() 方法来执行 apply 服务器 API 调用，并传递我们为\
  \ methodCmd 构造的参数。\n\n```\nmethResult = sysObject.apiGet(\"apply\", methodCmd);\n\
  ```\n\n执行方法的结果会返回一个结果对象。\n\n当你编译并执行 RunningMethodThroughDFC.java 代码时，Data Dictionary\
  \ Publisher 方法将被执行。如果你在方法中选中了 Trace Launch 字段旁边的复选框（参见图 23.3），则在运行上述 DFC 代码时，可以在\
  \ Docbase 服务器日志中看到方法执行的跟踪。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_380_0.png)\n\
  \n图 23.3：Data Dictionary Publisher 方法\n\n请注意，可以通过浏览 Administration | Job Management\
  \ | Methods 在 Documentum Administrator 中看到 Data Dictionary Publisher 方法。\n\n## 23.6\
  \ 使用 DFC 在 Docbase 中创建用户\n\n可以通过 DFC IDfUser 接口及其相关方法在 Docbase 中创建用户。\n\n创建一个名为\
  \ CreateUsersDFC.java 的 Java 文件，如下所示。查阅 DFC Javadocs 以了解本示例中使用的 IDfUser 接口的各种方法。\n\
  \n```java\nimport com.documentum.fc.client.*;\nimport com.documentum.fc.common.*;\n\
  import java.io.IOException;\n\npublic class CreateUsersDFC{\n\n//Main method\npublic\
  \ static void main(String args[]){\n\nIDfSession session = null;\nIDfSessionManager\
  \ sMgr = null;\n\ntry\n{\nIDfClient client = new DfClient().getLocalClient();\n\
  sMgr = client.newSessionManager();\nIDfLoginInfo loginInfo = new DfLoginInfo();\n\
  loginInfo.setUser(\"documentum\");\nloginInfo.setPassword(\"solutions\");\nsMgr.setIdentity(\"\
  dev_doc\", loginInfo);\nsession = sMgr.getSession(\"dev_doc\");\n\nSystem.out.println(\"\
  Session created !!\");\n\nIDfUser userObj = null;\nuserObj = (IDfUser)session.newObject(\"\
  dm_user\");\n// Setting client capability as 'contributor'\nuserObj.setClientCapability(2);\n\
  userObj.setDefaultFolder(\"/Dummy User\",false);\nuserObj.setDescription(\"User\
  \ created via DFC\");\nuserObj.setHomeDocbase(\"dev_doc\");\nuserObj.setUserAddress(\"\
  user001@xyz.com\");\n// Setting user as member of 'content author' group\nuserObj.setUserGroupName(\"\
  content author\");\nuserObj.setUserName(\"Dummy User\");\n// Setting user's OS name\
  \ and Windows domain\nuserObj.setUserOSName(\"user001\",\"sysdomain\");\n// Setting\
  \ extended privileges as 8(config audit) + 16(purge audit) + 32(view audit)\nuserObj.setUserXPrivileges(56);\n\
  userObj.save();\n\nSystem.out.println(\"User created in DocBase!!\");\n}catch(Exception\
  \ e){\nSystem.out.println(\"Catching generic exception in main: \" +\ne.getMessage());\n\
  }\nfinally {\nsMgr.release( session );\n}\n}// end of Main\n}// end of class\n```\n\
  \n\n\n请注意，上述 DFC 代码在 Docbase 中创建了一个名为 Dummy User 的用户对象，其操作系统名称为 user001，电子邮件 ID\
  \ 为 user001@xyz.com。\n\n用户已被设为内容作者组的一部分，并被授予 Config、View 和 Purge Audit 等扩展权限。\n\n\
  当您编译并执行 `createUsersDFC.java` 代码时，Docbase 中会创建名为 Dummy User 的用户对象！您可以通过以管理员身份登录\
  \ Documentum Administrator 并进入 Administration | User Management | Users 部分来验证这一点。\n\
  \n搜索名为 Dummy User 的用户会显示有效结果。点击其旁边的信息 (i) 图标会显示用户属性，如图 23.4 所示：\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_382_0.png)\n\
  \n图 23.4：Docbase 中创建的用户在 Documentum Administrator 中的显示\n\n可通过 DFC 执行的其他有趣功能不胜枚举。阅读\
  \ Documentum DFC 开发指南和 Business Objects Framework（BOF）手册是值得的。BOF 在本书中未涉及，但如果您对编写\
  \ DFC 代码感到自如，完全可以更进一步开始探索 BOF 框架！\n\n## 23.7 摘要\n\nDocumentum Foundation Classes（DFCs）是一组\
  \ Java 接口和实现类，用于公开 Documentum 内容管理功能。\n\n在本章中，我们简要讨论了 DFC 中的命名约定：接口以 IDf 开头，类以 Df\
  \ 开头。我们进一步查看了为使 DFC 正常工作需要在系统类路径中指定的 Documentum JAR。我们随后通过详细示例介绍了如何使用 DFC 以编程方式创建\
  \ Docbase 会话、在 Docbase 文件柜中创建并链接文件，以及在 Documentum 中创建用户。\n\n我们还看到了通过 DFC 在 Docbase\
  \ 中运行 Data Dictionary Publisher 方法的示例。\n"
- "## 24 使用 WDK 进行配置和自定义\n\n到目前为止，我们已经了解了如何通过默认 Web Publisher 屏幕提供的用户友好界面创建 Docbase\
  \ 对象并管理它们。我们已了解内容文件如何通过 Web Publisher 中的 New Content 屏幕创建，以及现有对象的属性如何通过 Properties（属性）屏幕修改。事实上，我们在\
  \ Web Publisher 中看到的所有其他屏幕，例如显示现有 Web Publisher 类别的 Categories 页面、显示工作流任务的 Inbox\
  \ 屏幕以及其他服务器通知等，都是由 Web Publisher 应用程序提供的默认屏幕。Webtop、Digital Asset Manager 和 Documentum\
  \ Administrator 是 Documentum 中具有各自特定用户界面的其他基于 Web 的应用程序的示例。\n\n如果您需要修改这些默认屏幕的外观或更改与这些屏幕相关的某些基本功能怎么办？欢迎来到\
  \ Documentum WDK（Web Development Kit 的简称）世界！\n\nWDK（我们在第 3 章中讨论过）是 Documentum 提供的一个框架，用于构建和部署可连接\
  \ Documentum Content Server 的 J2EE Web 应用程序。WDK 由一组可重用且可扩展的服务器端 Java 组件组成，这些组件通过\
  \ DFC 调用与 Content Server 交互。\n\nWebtop 是 Documentum 使用 WDK 框架提供的用于基本内容管理功能的参考实现。本书中介绍的\
  \ Web Publisher 和 Documentum Administrator 工具都是基于 Webtop 构建的。使用 WDK，您可以更改 Web Publisher/Documentum\
  \ Administrator 屏幕的用户界面，甚至通过自定义扩展和修改其功能！WDK 框架编写良好，提供了覆盖默认功能并添加您自己的自定义组件的灵活性！\n\n\
  使用 WDK，您主要可以执行两类任务：\n\n- **配置：** 这包括诸如引入新的菜单选项、修改屏幕中的标签和文本、更改外观（如按钮控件关联的图像）以及在各种屏幕中隐藏/显示属性/字段等简单操作。使用\
  \ WDK 提供的 XML 配置文件和 JSPs（Java Server Pages），您可以实现 Web 应用程序的简单配置。\n- **自定义：** 这比简单配置需要更多的精力，包括在\
  \ WDK 框架中添加新操作和组件等任务。此外，这还包括扩展框架行为类以覆盖默认功能并引入自定义逻辑和功能。使用 WDK 中的行为 Java 类，您可以自定义\
  \ Web 应用程序。\n\n图 24.1 显示了使用 WDK 框架可以执行的配置和自定义工作的性质。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_385_0.png)\n\
  \n### Documentum WDK 5.3 更新：\n\n- WDK 支持三种内容传输模式：HTTP、Unified Client Facilities（UCF）和\
  \ Content Transfer Applets\n- 支持在集群环境中将会话故障转移到运行相同 WDK 基于应用程序的其他服务器\n- 支持多个 Docbase\
  \ 仓库搜索\n\n### 24.1 WDK 目录结构\n\n在通过示例讨论 WDK 配置和自定义之前，让我们先了解一下 WDK 目录结构及其包含的文件夹和文件。WDK\
  \ 应用程序的根目录具有以下目录和文件：\n\n- **WDK 应用程序配置文件（config.xml）：** WDK 应用程序的起始页面（index.html/default.html）以及包含嵌入式注释用于调试目的的\
  \ WDK 应用程序文件的 unstripped.jar。\n- **WEB-INF：** 包含 web.xml 文件（用于 J2EE Web 应用程序）、WDK\
  \ Web 应用程序 Java 类，以及其他应用程序层（如 wdk、webcomponent）的类，以及 WDK 框架和 JSP 标签库所需的 jars。\n\
  - **help：** 包含 WDK 客户端应用程序帮助文件。\n- **plugins：** 包含 WDK 客户端应用程序的 JRE 插件。\n- **应用程序层目录**（`wdk`、`webcomponent`、`webtop`、`dam`、`wp`\
  \ 和 `custom`）：应用程序层目录包含应用程序的配置文件（`app.xml`）、应用程序组件的配置文件、外化的字符串、主题、组件 JSPs 以及应用程序所需的\
  \ JavaScript 文件。\n\n不要被我们讨论的术语数量吓倒——WDK、Webcomponent、Webtop 等。这些只是各种 WDK 应用程序层，每一层都在层次结构中扩展其下方的层。请查看图\
  \ 24.2 以了解 WDK 应用程序层层次结构链。\n\n如果您打开每个 WDK 中间层的应用程序配置文件 app.xml，您会注意到它扩展自图 24.2 中显示在其正下方的层。\n\
  \n例如，Webtop 的 app.xml 将扩展 webcomponent 层的 app.xml。WDK 是层次结构中的基础层，不扩展任何其他层。\n\nWebtop\
  \ app.xml 文件中的片段：`<application extends=\"webcomponent/app.xml\">`。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_386_0.png)\n\
  \n图 24.2：WDK 应用程序层次结构\n\n请注意，每个 WDK 组件都有一个与其关联的 XML 配置文件来定义它、一个行为 Java 类、至少一个用于定义其布局的\
  \ JSP 页面，以及一个用于外化字符串的 NLS 属性文件。\n\n**Custom 层**是一个非常有趣的概念，如果您是 Documentum WDK 的新手，一定会引起您的注意。Custom\
  \ 层位于层次结构链的顶部，由 Documentum 提供以供您存放所有自定义内容。它包含任何自定义的配置 XML 文件、JSP 页面、品牌主题和外化字符串。如果您将自定义组件定义配置和其他文件放在\
  \ custom 目录中，WDK 框架将在加载 custom 层以下层的文件之前先加载它。\n\n在将 WDK 应用程序从一个版本升级到另一个版本期间，您需要在执行升级之前备份\
  \ custom 文件夹，并在升级完成后将其恢复。这确保您的自定义文件存储在集中位置，并可根据需要轻松恢复。\n\n### 24.2 WDK 应用程序元素\n\n\
  Documentum WDK 应用程序框架庞大，由组件、操作和控件等多个单元组成。在进行配置/自定义和开发自己的自定义组件之前，了解其中每一个及其相互关系至关重要。图\
  \ 24.3 大致描述了各种 WDK 应用程序元素如何在 WDK 框架范围内相互交互。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_387_0.png)\n\
  \n图 24.3：WDK 应用程序元素的关系\n\n\n\n现在让我们详细讨论图 24.3：\n\n-   **Components**：这些由 JSP 页面以及这些\
  \ JSP 页面中的控件组成。组件是 WDK 框架中的可重用单元，执行诸如检出、检入、导出等 Docbase 操作。每个 WDK 组件由一个 XML 配置文件、一个关联的行为\
  \ Java 类以及至少一个 JSP 页面组成。\n-   **Controls**：这些代表 UI 功能（按钮或链接），并提供标准 Web 功能和操作，例如验证、格式化等。控件可以在多个\
  \ JSP 页面中重用，并在 UI 表单中对这些元素进行更改时引发事件。\n-   **Forms (JSP pages)**：WDK 将 JSP 页面建模为服务器上的\
  \ Form 对象，以实现两个目的：\n    -   维护 HTML 表单的状态\n    -   维护浏览器历史记录\n-   **Actions**：操作要么由\
  \ Docbase 操作（例如 check-out）触发，要么通过 UI 表单元素（例如按钮、菜单项等）触发。操作将 UI 事件与应用程序功能关联起来。\n-\
  \   **Events**：每当用户操作导致 UI 表单中元素状态发生变化时，就会引发事件。事件要么通过关联 JSP 页面中的 JavaScript 在客户端处理，要么由关联组件在服务器端处理。\n\
  \n其中一些术语现在可能还不是很清楚。然而，您可以查阅 Documentum WDK 开发指南以获得更好的理解。随着我们在本章中继续进行示例，这些概念肯定会变得更加清晰。\n\
  \n## 24.3 一个简单的 WDK 配置示例\n\n不再浪费时间，让我们从一个非常简单的 WDK 配置示例开始。\n\n我们将覆盖 Web Publisher\
  \ 中的默认新建内容（属性）屏幕，并为新闻文章模板引入新属性。\n\n### 24.3.1 配置更改前的新建内容屏幕\n\n如果您使用模板类别在 Web Publisher\
  \ 中创建新内容，则会向您显示新建内容（属性）屏幕以提供内容的属性（元数据）信息，例如：\n\n-   内容名称（属性：`object_name`）\n-  \
  \ 描述性名称（属性：`title`）\n-   主题（属性：`subject`）\n-   生效日期（属性：`a_effective_date`）\n-  \
  \ 到期日期（属性：`a_expiration_date`）\n\n图 24.4 展示了该默认屏幕在 Web Publisher 中的外观。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_389_0.png)\n\
  \n图 24.4：Web Publisher 中的默认新建内容屏幕\n\n### 24.3.2 配置更改后的修改新建内容屏幕\n\n图 24.5 显示了新闻文章模板的同一新建内容屏幕，其中包含新添加的属性。\n\
  \n![](img/b18244e6621ecc39cef03ff6c0e55e7c_390_0.png)\n\n图 24.5：为新闻文章新增属性后的修改新建内容屏幕\n\
  \n以下步骤将解释如何使用 WDK 框架在 Documentum 中实现此简单配置。\n\n1.  从 Web Publisher 服务器中的以下位置复制新建内容组件的\
  \ XML 配置文件（newcontent_component.xml）：\n    `\\wp\\config\\library\\newcontent.`\n\
  \    请注意，本章所有示例中，我们将假设 Web Publisher 应用程序的名称为 wp。\n    在 Web Publisher 服务器中 custom\
  \ 文件夹内的 config 文件夹中创建以下目录：\n    `\\library\\newcontent.`\n    将复制的 newcontent_component.xml\
  \ 放置在以下位置：\n    `\\wp\\custom\\config\\library\\newcontent.`\n    我们将在下面的步骤中查看对复制的\
  \ newcontent_component.xml 文件需要做的更改。\n2.  从 Web Publisher 服务器中的以下位置复制新建内容 JSP 文件（newContent.jsp）：`\\\
  wp\\library\\newcontent.`\n    在 Web Publisher 服务器中 custom 文件夹内创建以下目录：\n    `\\\
  library\\newcontent.`\n    将复制的 newContent.jsp 重命名为（例如）custom_newContent.jsp 并将其放置在以下位置：\n\
  \    `\\wp\\custom\\library\\newcontent.`\n    我们将在下面的步骤中查看对 custom_newContent.jsp\
  \ 文件需要做的更改。\n3.  按如下所示修改 `\\wp\\custom\\config\\library\\newcontent` 下的 newcontent_component.xml\
  \ 文件：\n    ```xml\n    <?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"\
  ?>\n    <!------------------------------------------------------------------------------>\n\
  \    <config version='1.0'>\n        <scope wpcontext=\"wpview\">\n            <!--\
  \ the document list component definition -->\n            <!-- <component id=\"\
  newcontent\"> -->\n            <component id=\"newcontent\"\n            extends=\"\
  newcontent:wp/config/library/newcontent/\n                    newcontent_component.xml\"\
  >\n                <!-- Component Contract -->\n                <params>\n     \
  \               <param name=\"objectId\" required=\"false\"/>\n    ```\n    \n \
  \   ```\n    </params>\n    <!-- Component Layout -->\n    <pages>\n    <!--<start>/wp/library/newcontent/newContent.jsp</start>-->\n\
  \    <start>/custom/library/newcontent/custom_newContent.jsp</start>\n    <return>/wp/library/componentReturn.jsp</return>\n\
  \    </pages>\n    \n    <!-- Component Behavior -->\n    <class>com.documentum.wp.library.newcontent.NewContent</class>\n\
  \    <nlsbundle>com.documentum.wp.library.newcontent.NewContentNlsProp</nlsbundle>\n\
  \    \n    <!-- Component specific Configuration -->\n    <!-- Allow the user to\
  \ import a file from file system. Default is true. -->\n    <allow_import>true</allow_import>\n\
  \    \n    <enable_full_text_index>true</enable_full_text_index>\n    \n    <!--\
  \ Component specific Configuration -->\n    <helpcontextid>newcontent</helpcontextid>\n\
  \    </component>\n    </scope>\n    </config>\n    ```\n\n    该 XML 文件的结构如下所示：\n\
  \n    ```\n    <?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n  \
  \  ```\n\n    这是标准的 XML 声明\n\n    ```\n    <config version='1.0'>\n    ```\n\n \
  \   这是 XML 配置文件的根元素。\n\n    ```\n    <scope wpcontext=\"wpview\">\n    ```\n\n \
  \   这是配置文件的范围，定义了此配置定义有效的上下文。\n\n    在标签 <scope wpcontext=\"wpview\"> 中，wpcontext\
  \ 是限定符名称，wpview 是限定符值。上下文匹配针对限定符值进行。限定符在相应 WDK 应用程序层的 app.xml 文件中指定。\n\n    以下是\
  \ WDK、Webtop、Web Publisher 等各种 WDK 应用程序层提供的一些限定符：\n\n    -   Docbase 名称\n    - \
  \  Docbase 类型\n    -   权限\n    -   应用程序\n    -   Web Publisher 上下文\n    -   Web\
  \ Publisher 角色\n\n    如有必要，您甚至可以在 WDK 应用程序中引入自定义限定符。Documentum 根据限定符在应用程序的 app.xml\
  \ 文件中指定的顺序解析范围。\n\n    ```\n    <component id=\"newcontent\"\n    ```\n\n    这是\
  \ XML 配置文件中的主要元素。除了 component 之外，其他有效元素可以是 action（Action 组件）和 application（app.xml\
  \ 文件）。id 属性使用应用程序中的唯一标识符标记组件/操作名称。您可以通过在主要元素中使用 extends 属性来扩展其他组件/操作/应用程序。\n\n \
  \   ```\n    <params>\n        <param name=\"objectId\" required=\"false\"/>\n \
  \   ```\n\n    这些行定义从配置传递到关联行为类的参数。\n\n    ```\n    <pages>\n    ```\n\n    <pages>\
  \ 定义了问题组件布局的关联 JSP 页面（页）。您可以看到我们已注释掉默认 newContent.jsp 的路径，而是提供了我们自定义 JSP 文件 custom_newContent.jsp\
  \ 的路径。\n\n    ```\n    <class>com.documentum.wp.library.newcontent.NewContent</class>\n\
  \    ```\n\n    该行定义组件的关联行为 Java 类。在此特定配置示例中，由于我们只是修改新建内容组件的 xml 配置文件和 JSP 文件，因此我们没有扩展默认的\
  \ NewContent.class。\n\n    ```\n    <nlsbundle>com.documentum.wp.library.newcontent.NewContentNlsProp</nlsbundle>\n\
  \    ```\n\n    该行定义用于本地化组件字符串的关联 NLS 属性文件。请注意，在 WDK 框架中，从另一个组件扩展的组件会继承为基组件的 NLS\
  \ 属性文件定义的字符串。\n\n    其他 XML 元素所示的代码特定于 newcontent 组件，不适用于所有 XML 配置文件。\n\n4.  按如下代码片段所示修改\
  \ \\wp\\custom\\library\\newcontent 下的 custom_newContent.jsp 文件。\n\n    请注意，在 JSP\
  \ 文件中，我们为新闻文章对象类型（cust_newsarticle）的以下自定义属性添加了第 137-151 行：cust_news_summary、cust_news_is_press_rel、cust_news_edit_approvers\
  \ 和 cust_news_display_order。\n\n    这些是 Docbase 属性，其行为由 WDK 框架默认处理。我们在 JSP 中引入这些新属性的方式与下面所示的\
  \ keywords 和 authors 等属性的默认实现类似（请参阅突出显示的行）。\n\n    ```\n    <dmfx:docbaseattribute\
  \ object=\"<%=NewContent.CONTENT_OBJECT%>\"\n    attribute=\"keywords\"\n    pre=\"\
  <tr><td align='right' valign='top'><b>\"\n    col1=\":</b></td><td>&nbsp;</td><td>\"\
  />\n    <tr><td colspan='4' height='5'></td></tr>\n    ```\n\n\n```\n<dmfx:docbaseattribute\
  \ object=\"%=NewContent.CONTENT_OBJECT%.\"\nattribute=\"authors\"\npre=\"<tr><td\
  \ align='right' valign='top'><b>\"\ncol1=\":</b></td><td>&nbsp;</td><td>\"/>\n<tr><td\
  \ colspan='4' height='5'></td></tr>\n%>-- To add more attributes, make a copy of\
  \ the following two\nlines and enter the attribute name.\nOr you can use the data-dictionary.\n\
  <dmfx:docbaseattribute object=\"%=NewContent.CONTENT_OBJECT%\"\nattribute=\"attribute_name\"\
  \npre=\"<tr><td align='right' valign='top'><b>\"\ncol1=\":</b></td><td>&nbsp;</td><td>\"\
  />\n<tr><td colspan='4' height='5'></td></tr>\n--%>\n<!-- Added by Gaurav for configuration:\
  \ begins -->\n<tr><td colspan='4' height='5'></td></tr>\n<dmfx:docbaseattribute\
  \ object=\"%=NewContent.CONTENT_OBJECT%.\"\nattribute=\"cust_news_summary\"\npre=\"\
  <tr><td align='right' valign='top'><b>\"\ncol1=\":</b></td><td>&nbsp;</td><td>\"\
  />\n\n<tr><td colspan='4' height='5'></td></tr>\n<dmfx:docbaseattribute object=\"\
  %=NewContent.CONTENT_OBJECT%.\"\nattribute=\"cust_news_is_press_rel\"\npre=\"<tr><td\
  \ align='right' valign='top'><b>\"\ncol1=\":</b></td><td>&nbsp;</td><td>\"/>\n\n\
  <tr><td colspan='4' height='5'></td></tr>\n<dmfx:docbaseattribute object=\"%=NewContent.CONTENT_OBJECT%.\"\
  \nattribute=\"cust_news_edit_approvers\"\npre=\"<tr><td align='right' valign='top'><b>\"\
  \ncol1=\":</b></td><td>&nbsp;</td><td>\"/>\n\n<tr><td colspan='4' height='5'></td></tr>\n\
  <dmfx:docbaseattribute object=\"%=NewContent.CONTENT_OBJECT%.\"\nattribute=\"cust_news_display_order\"\
  \npre=\"<tr><td align='right' valign='top'><b>\"\ncol1=\":</b></td><td>&nbsp;</td><td>\"\
  />\n\n<!-- Added by Gaurav for configuration: ends -->\n<tr>\n<td align='right'\
  \ valign='top'>\n<b><dmf:label nlsid=\"MSG_EFFECTIVE\"\ncssclass=\"defaultDocbaseAttributeStyle\"\
  />:</b>\n</td>\n```\n\n- 5. 你现在需要停止并重新启动 Web Publisher 应用服务器，以查看新添加的自定义文件的效果。一旦你在\
  \ Web Publisher 中创建新的新闻文章内容，修改后的新建内容屏幕（如图 24.5 所示）就会显示给你。\n\n## 24.4 一个简单的 WDK 自定义示例\n\
  \n在 WDK 中看到一个非常简单的配置示例后，我们现在将更进一步，在 WDK 中开发我们自己的自定义组件。我们将在 Web Publisher 中创建一个新的菜单选项，点击它将带我们进入用于创建新闻文章内容的自定义屏幕。\n\
  \n图 24.6 显示在菜单选项 File | New 下新增的自定义菜单选项 Create New News Article。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_395_0.png)\n\
  \n图 24.6：用于创建新闻文章内容的新的菜单选项\n\n当你点击菜单选项 Create New News Article 时，会显示一个用于创建新闻文章内容的自定义屏幕，如图\
  \ 24.7 所示。\n\n![](img/b18244e6621ecc39cef03ff6c0e55e7c_395_1.png)\n\n图 24.7：用于创建新闻文章内容的自定义屏幕\n\
  \n让我们现在逐步[content]\n\n```\n<dmfx:docbaseattribute object=\"%=NewContent.CONTENT_OBJECT%.\"\
  \nattribute=\"authors\"\npre=\"<tr><td align='right' valign='top'><b>\"\ncol1=\"\
  :</b></td><td>&nbsp;</td><td>\"/>\n<tr><td colspan='4' height='5'></td></tr>\n%>--\
  \ To add more attributes, make a copy of the following two\nlines and enter the\
  \ attribute name.\nOr you can use the data-dictionary.\n<dmfx:docbaseattribute object=\"\
  %=NewContent.CONTENT_OBJECT%\"\nattribute=\"attribute_name\"\npre=\"<tr><td align='right'\
  \ valign='top'><b>\"\ncol1=\":</b></td><td>&nbsp;</td><td>\"/>\n<tr><td colspan='4'\
  \ height='5'></td></tr>\n--%>\n<!-- Added by Gaurav for configuration: begins -->\n\
  <tr><td colspan='4' height='5'></td></tr>\n<dmfx:docbaseattribute object=\"%=NewContent.CONTENT_OBJECT%.\"\
  \nattribute=\"cust_news_summary\"\npre=\"<tr><td align='right' valign='top'><b>\"\
  \ncol1=\":</b></td><td>&nbsp;</td><td>\"/>\n\n<tr><td colspan='4' height='5'></td></tr>\n\
  <dmfx:docbaseattribute object=\"%=NewContent.CONTENT_OBJECT%.\"\nattribute=\"cust_news_is_press_rel\"\
