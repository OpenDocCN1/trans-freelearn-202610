    # Exercise 2 – deploying Azure SQL Database elastic pools


    If we want to manage and scale multiple databases that have various and unpredictable
    usage requirements, we will use Azure SQL Database elastic pools.


    Pools are suitable for large numbers of databases with specific usage patterns.
    For a given database, this pattern is characterized by infrequent usage peaks
    and low average usage. Otherwise, do not place multiple databases under moderate
    sustained load in the same elastic pool.


    Pools simplify management tasks by running scripts in elastic jobs. Elastic jobs
    eliminate most of the tedious work associated with numerous databases.


    Pooled databases generally support the same business continuity features available
    with single databases.


    Azure SQL Database elastic pools are a simple and cost-effective solution. They
    are a deployment option, which means we purchase Azure compute resources (eDTUs)
    and storage resources to be shared between all the included databases. Why? Because
    the databases in an elastic pool reside on a single server and share a fixed number
    of resources for a fixed price. **Software as a service (SaaS)** developers can
    optimize the pricing performance of a group of databases within a well-defined
    budget by benefiting from performance elasticity for each database, by using the
    elastic pools in Azure SQL Database. In an elastic pool, we are able to add databases
    to the pool and set the maximum and minimum resources (DTUs or vCore) for the
    databases according to our budget.


    We will follow these steps to create a SQL database elastic pool:


    +   1. Open the Azure portal, select **Create a resource**, and search for `SQL
    Elastic database pool`. You will see the following screen:


    ![](img/66aceec30d3e7dead2f71bb68a887688_172_0.png)


    Figure 7.14 – Create SQL elastic database pool'
