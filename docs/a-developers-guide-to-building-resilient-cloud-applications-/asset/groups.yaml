    # Azure Functions’ development


    A function is composed of two important elements:


    +   - **Your code**: It can be written in any language

    +   - **Configuration JSON file**: `function.json`, which is generated automatically
    from annotations in the code


    The following example presents a `function.json` file. We defined the triggers,
