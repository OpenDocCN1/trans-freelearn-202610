    3. 递交至所属地区社会福利署办事处。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_256_0.png)\n\n\
    查询热线：2343 2255\n办公时间：星期一至五 上午九时至下午六时\n\n## Part 3:\nEnsuring Continuous Integration\
    \ and Continuous Container Deployment on Azure\n\nIn this part of the book, we\
    \ will focus on the continuous integration and continuous deployment of containerized\
    \ applications to deploy to Azure containers and orchestrator cloud services.\n\
    \nThis part comprises the following chapter:\n\n- Chapter 11, Containers and Continuous\
    \ Deployment on Azure\n\n## 11\n\n## Containers and Continuous Deployment on Azure\n\
    \nContainers are a simple way for developers to build, test, deploy, update, and\
    \ redeploy applications to a variety of environments, from a developer’s local\
    \ machine to an on-premises data center, and even to the cloud across multiple\
    \ vendors.\n\nAzure offers multiple services to deploy containers. Containers\
