    NoSQL 数据库从零开始构建，用于大规模存储和处理海量数据，支持不断增长的现代业务。


    以下是最受欢迎的 NoSQL 数据库类型的定义：


    - **Key-value store:** Key-value 存储将相关数据分组到集合中，以便可以通过唯一键轻松检索记录。Key-value 存储保留了
    NoSQL 数据库结构的优势，同时具有足够的结构来反映关系数据库的值（与非关系数据库相反）。我们可以在下图中看到一个示例：


    ![](img/66aceec30d3e7dead2f71bb68a887688_206_0.png)


    Figure 9.1 -- Key-value NoSQL database type


    Microsoft Azure Table Storage 是这种类型 NoSQL 数据库的一个示例。


    - **Document:** 纯文档数据库主要用于以文档形式存储以文档为中心的数据，例如 JSON 文档。这些系统也可以用于存储 XML 文档，例如 NoSQL
    数据库。Azure Cosmos DB 是这种类型的示例。


    - **Table style:** 这种类型是基于稀疏填充表的數據模型。它们也称为宽列数据库。它们使用关系数据库的表格格式，但同一表中每一行中数据的命名和格式可能大不相同。与
    key-value 存储类似，宽列数据库具有基本的 NoSQL 结构，同时保留了高度的灵活性。


    - **Graph:** 图类型通常以键-数据格式存储的记录。我们用它来定义存储数据点之间的关系。图数据库允许我们识别非结构化和半结构化信息中的模式。在下图中，我们可以看到不同的图组件：


    ![](img/66aceec30d3e7dead2f71bb68a887688_207_0.png)


    Figure 9.2 – Graph NoSQL database type


    跨多个非关系型（NoSQL）数据存储的多语言持久性会增加显著的复杂性和开销。因此，Microsoft 提供了一个多模型、地理分布式的数据库 Azure Cosmos
    DB，其数据结构可用于原生存储键值对、JSON 层次结构和图。


    Azure Cosmos DB 是一种完全托管的 PaaS 服务，其内部存储对不同用户是抽象的。


    ## Exercise 1 – creating an Azure Cosmos DB account using the Azure portal


    Azure Cosmos DB 是一种分布式数据库引擎，无论如何使用数据库，都具有核心功能集。这些功能包括能够弹性地分发数据库，能够双向扩展存储和吞吐量，低延迟并提供财务支持的
    SLA、各种一致性选项以及企业级安全功能。


    Azure Cosmos DB 专为大多数现代云应用程序提供高响应性和始终在线的可用性而设计。Cosmos DB 被视为 NoSQL 数据库，主要使用四种数据模型（键值、文档、列族或表样式、图）。


    Azure Cosmos DB 包括存储的数据文档，其中数据无模式且最有可能存储为 JSON 文档。许多文档数据库使用 JSON 来表示文档结构、以图为导向的模型，其中数据表示为节点和边的图表结构，以及最简单的形式的键值存储。数据库管理系统仅存储键值对，并具有宽列存储，可存储具有许多动态列的数据。Cosmos
    DB 对高可用性、地理分布和速度的关注提供了一些相当酷的优势。


    Cosmos DB 将数据管理为一组分区的文档。文档由一组字段组成，每个字段由键标识。每个文档中的字段可能各不相同，并且一个字段可能包含子文档。在 Cosmos
    DB 数据库中，文档被组织到容器中，容器被分组到分区中。


    一个文档最多可包含 2 MB 的数据，包括小型二进制对象。但如果需要存储与文档相关的更大 blob，则需要使用 Azure Blob Storage。然后，您可以在文档中添加对创建的
    blob 的引用。


    让我们开始使用 Azure 门户创建 Azure Cosmos DB 资源。我们将遵循以下步骤：


    - 1. 在 Azure 门户的主页上，选择 **Create a resource**。您可以使用搜索输入并输入 Cosmos，或者您可以选择 **Databases**
    类别。在 **Azure Cosmos DB** 下选择 **Create**：


    ![](img/66aceec30d3e7dead2f71bb68a887688_208_0.png)


    Figure 9.3 – Azure Cosmos DB | Create


    2. 在 Select API 选项页面上，我们必须选择一个 API 来创建新帐户。请注意，帐户创建后我们无法更改它：


    Select API option ...


    ![](img/66aceec30d3e7dead2f71bb68a887688_209_0.png)


    Figure 9.4 – The Select API option page in Cosmos DB


    我们有以下 API 可供选择：


    - Core (SQL) 推荐用于新应用程序。它是用于文档的原生 API。它是 Azure Cosmos DB 的核心。

    - Azure Cosmos DB API for MongoDB 是一个原生 SQL API，具有 MongoDB 的 API。MongoDB 是一个文档数据库。如果您已有现有的
    MongoDB 工作负载并希望将其迁移到 Azure，则推荐此 API，例如。

    - Cassandra 是一个专用于 Apache Cassandra 应用的完全托管数据库服务。如果您已有现有的 Cassandra 工作负载，可以使用此
    API 将其迁移到 Azure。Cassandra 是一个用于大数据管理的分布式 NoSQL 数据库管理系统。

    - Azure Table 也是一个专用于 Azure Table Storage 应用的完全托管数据库服务。如果我们决定将现有的 Azure Table
    Storage 资源迁移到 Cosmos DB，可以使用此 API。

    - Gremlin (Graph) 是 Apache TinkerPop 的图遍历语言。Gremlin 是一种函数式数据流语言，允许用户简洁地表达应用程序属性图的复杂遍历（或查询）。Cosmos
    DB 是一个使用 Gremlin 的完全托管图数据库服务。如果我们希望添加需要存储数据之间关系的新工作负载，则推荐此选项。


    3. 选择任何 API 选项。我们将在 **Create Azure Cosmos DB Account - Core (SQL)** 页面上拥有相同的选项。从
    **Basics** 选项卡开始：


    ![](img/66aceec30d3e7dead2f71bb68a887688_210_0.png)


    Figure 9.5 – Project Details on the Basics tab


    在 **Basics** 选项卡上，我们有项目详细信息，其中包括与任何 Azure 服务相关的通用信息，例如 **Subscription** 和选择资源组。然后，我们可以添加实例详细信息所需的信息，例如
    Cosmos DB 帐户名称、位置以及数据库操作的容量模式。我们有两种不同的容量模式可供选择：


    - **Provisioned throughput:** 您可以配置数据库预期提供的吞吐量，但您需要规划应用程序需求的最佳性能级别。此模式以 **request
    units per second (RU/s)** 表示。有两种类型：*standard (manual)* 和 *autoscale*。Azure Cosmos
    DB SQL API 数据库是一个无模式的容器管理单元集合。每个容器都是吞吐量和存储的可扩展单元。吞吐量可以在数据库级别、容器级别或两者上进行预配。预配给数据库的吞吐量由数据库中的所有容器共享。所有容器共享吞吐量资源，因此我们可能无法为数据库中的某些容器获得可预测的性能。


    ![](img/66aceec30d3e7dead2f71bb68a887688_211_0.png)


    Figure 9.6 – Azure Cosmos DB components


    - **Serverless**: 我们选择此选项以创建无服务器模式的帐户，这意味着我们可以在容器中运行数据库操作，而无需配置预先预配的容量。它是一种基于消耗的模型，其中每个请求消耗请求单位。消耗模型消除了预先预配吞吐量请求单位的需求：


    > **Important note**

    > 当我们使用 Azure Cosmos DB 时，我们通常以 RU/s 表示的成本来表达数据库选项。


    ![](img/66aceec30d3e7dead2f71bb68a887688_211_1.png)


    Figure 9.7 – Instance Details on the Basics tab


