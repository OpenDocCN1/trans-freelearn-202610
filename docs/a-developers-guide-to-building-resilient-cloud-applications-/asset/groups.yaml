    # Creating an Azure Data Lake instance using the Azure portal


    Azure Data Lake Storage is built on top of Azure Storage; so, we will create a
    new storage account and enter the different information needed in the **Basics**
    tab.


    In the **Advanced** tab, check **Enable hierarchical namespace** under **Data
    Lake Storage Gen2**. This setting will convert the standard Blob storage account
    into an Azure Data Lake storage account:


    ![](img/66aceec30d3e7dead2f71bb68a887688_234_0.png)


    Figure 10.2 – Creating an Azure Data Lake instance using the Azure portal


    Select **Review + Create** to review your storage account settings and create
    the account.


    To enable Data Lake Storage capabilities on an existing account, open your storage
    account; then, under **Settings**, select **Data Lake Gen2 upgrade**. The **Upgrade
    to a storage account with Azure Data Lake Gen2 capabilities** page will be displayed,
    which includes three steps. The first step consists of reviewing the account changes
    before the launch of the upgrade and the second step will validate the different
    features that cannot be supported with Azure Data Lake Storage Gen2. We will get
    a list of discrepancies. The last step starts the upgrade once the validation
    succeeds:'
