  md: "\n## Exploring Azure message queues\n\nMicrosoft Azure Service Bus is a fully\
    \ managed enterprise integration message broker. Some common messaging scenarios\
    \ are included in Service Bus, such as messaging in case of transferring data\
    \ or decoupling applications to improve their reliability and their scalability\
    \ and message sessions by implementing workflows that require message ordering,\
    \ for example, or topics and subscriptions.\n\nAzure supports the following two\
    \ types of queuing mechanisms:\n\n- Queue Storage is a simple message queue service\
    \ for storing large numbers of messages\n- Service Bus queues are part of a broader\
    \ set of messaging services that support queuing, publishing/subscribing, and\
    \ advanced integration patterns\n\nAzure Queue Storage is a service for sending\
    \ and receiving messages but is also used to store a large number of messages;\
    \ a queue message can be up to 64 KB in size.\n\n## Exercise 2 – creating an Azure\
    \ Service Bus namespace and a queue\n\nIn this exercise, we will perform the following\
    \ actions:\n\n- Create an Azure Service Bus namespace\n- Create an Azure Service\
    \ Bus queue\n\nThe queues can be created using the interactive interface of the\
    \ Azure portal, using the command line via PowerShell or Azure CLI, or using Resource\
    \ Manager templates. We will look at only the first two methods here: Azure Portal\
    \ and Azure CLI.\n\n### Using the Azure portal\n\nLet’s open the Azure portal\
    \ and select **All services**. In the **Integration** category, we can find the\
