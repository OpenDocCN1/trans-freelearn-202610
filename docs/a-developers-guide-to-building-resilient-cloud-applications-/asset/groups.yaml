    \ We also add the connection string to the target Azure Service Bus namespace\
    \ and the queue name.\n\nIn the Azure portal, go back to the Service Bus namespace\
    \ and select Settings | Shared access policies, then copy the Primary Connection\
    \ String value:\n\n![](img/66aceec30d3e7dead2f71bb68a887688_84_0.png)\n\nFigure\
    \ 3.25 – Shared access policies in the Azure Service Bus namespace\n\nThis is\
    \ the Program class that allows us to publish messages to the Service Bus queue:\n\
    \n```\nprivate const string ServiceBusConnectionString = \"Endpoint=sb://appointmentqueue.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=1CqAJhjCv5M284qwRuLtApely83Ju9G48RxGuED2Zs0=\"\
    ;\n    private const string QueueName = \"myqueue\";\n    static List<Appointment>\
