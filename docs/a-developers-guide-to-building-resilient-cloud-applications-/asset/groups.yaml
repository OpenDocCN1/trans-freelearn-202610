    # Deploying the application in a local cluster using Visual Studio


    To deploy the application in a local cluster, we will use the **Publish** tool
    of Visual Studio. Right-click on the application with the **Service Fabric** icon
    and select **Publish**. In the target file, we will select the number of nodes
    configured in our cluster. In this case, we configured a single node in the connection
    endpoint. Ensure that your application will publish to a local cluster. In the
    end, the .xml files that include the application parameters and the startup service
    parameters are requested to finish the publishing process.


    ![](img/66aceec30d3e7dead2f71bb68a887688_149_0.png)'
  - '[PAGE 150]


    Click on the **Publish** button, then we will check our application in Service
    Fabric Explorer.


    ![](img/66aceec30d3e7dead2f71bb68a887688_150_0.png)


    Figure 5.25 – Service Fabric Explorer – application deployment


    A solution includes multiple services. To fully take advantage of the Service
    Fabric platform, we need to communicate from one service to another. To do this,
    we can implement an interface or API, for example. In this case, the interface
    is the public-facing API for all the services that want to invoke the hospital’s
    functionality. Another service, such as a search service, can use the same interface.
    Both services are going to reference the interface. In a microservices architecture,
    it’s perfectly valid to invoke one service directly from another. You can do this
    through the HTTP protocol and by exposing an API from the target microservice.


