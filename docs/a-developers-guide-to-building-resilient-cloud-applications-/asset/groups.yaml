    \n```\ndotnet add package Azure.Messaging.EventGrid -version 4.10.0\n```\n\nTo\
    \ build the application, we use the following command:\n\n```\ndotnet build\n\
    ```\n\n### Using Visual Studio 2022\n\nWe select **Create a new project**, then\
