    1800b09f-2b66-425c-b16c-3d7dde051282\",\n  \"type\": \"Microsoft.ManagedIdentity/userAssignedIdentities\"\
    \n}\n```\n\n图 10.5 – 创建托管标识的结果\n\n3. 创建具有 Data Lake Storage Gen2 的新存储区域，但在那之前，先向\
