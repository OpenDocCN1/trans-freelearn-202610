    ## Exercise 1 – creating an Azure Cosmos DB account using the Azure portal


    Azure Cosmos DB is a distributed database engine with a core set of features no
    matter how you use your database. These features include the ability to elastically
    distribute databases, the ability to scale both storage and throughput bi-directionally,
    low latency with financially backed SLAs, various consistency options, and enterprise-class
    security features.


    Azure Cosmos DB is designed for high responsiveness and always-on availability
    for most modern applications in the cloud. Cosmos DB is considered a NoSQL database
    and works primarily with four data models (key-value, documents, column-family
    or table-style, and graph).


    Azure Cosmos DB includes documents stored where data is schemeless and most likely
    stored as JSON documents. Many document databases use JSON to represent the document
    structure, graph-oriented models where data is represented as diagrammatic structures
    such as nodes and edges, and key-value stores in their simplest form. A database
    management system stores only key-value pairs and has a wide column store that
    can store data with many dynamic columns. Cosmos DB’s focus on high availability,
    geographic distribution, and speed provides some pretty cool advantages.


    Cosmos DB manages data as a partitioned set of documents. A document is made up
    of a set of fields, and each field is identified by a key. The fields in each
    document may vary and a field may contain child documents. In a Cosmos DB database,
    the documents are organized into containers that are grouped into partitions.


    A document can contain up to 2 MB of data, including small binary objects. But
    if you need to store larger blobs related to a document, you’ll need to use Azure
    Blob Storage. You can then add a reference to the blob created in the document.


    Let’s start by creating an Azure Cosmos DB resource by using the Azure portal.
    We will follow these steps:


    - 1. On the home page of the Azure portal, select **Create a resource**. You can
    use the search input and enter Cosmos or you can select the **Databases** category.
    Select **Create** under **Azure Cosmos DB**:


