    \ 3 – 扩缩容 Azure Service Fabric 集群\n\n有三种机制可以扩缩容 Service Fabric 集群。\n\n### 手动扩缩容\n\
    \n第一个是手动指定想要的节点实例数量。因此，让我们导航到虚拟机规模集资源。我们需要选择包含 Service Fabric 实例的资源组。然后，如以下屏幕截图所示，选择虚拟机规模集作为类型。\n\
    \n![](img/66aceec30d3e7dead2f71bb68a887688_142_0.png)\n\n图 5.14 – 虚拟机规模集资源类型\n\
    \n我们将单击打开它。在 **设置** 部分，你会找到 **扩缩容** 选项。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_142_1.png)\n\
    \n图 5.15 – 扩缩容设置\n\n如前一屏幕截图所示，默认选项是 **手动扩缩容**，但你可以指定节点实例的数量。在图中，我们有 5 个节点实例，但我们可以将其设置为\
    \ 20，例如。保存此选项后，虚拟机规模集将从 5 个实例增加到 20 个实例。\n\n### 自定义自动扩缩容\n\n第二个选项是使用自定义自动扩缩容。如果你选择此选项，你可以在\
    \ **自定义自动扩缩容** 窗口中指定扩缩容规则，如以下屏幕截图所示：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_143_0.png)\n\
    \n图 5.16 – 自定义自动扩缩容窗口\n\n我们可以添加扩缩容条件。我们默认有一个自动创建的扩缩容条件，但我们可以组合多个条件以实现扩缩容自动化：\n\
    \n![](img/66aceec30d3e7dead2f71bb68a887688_143_1.png)\n\n图 5.17 – 创建扩缩容条件\n\n\
    规则基于你选择的指标来确定集群是否需要扩容或缩容。例如，基于过去 5 分钟的 CPU 百分比值，如果大于 75，我们将计数增加 1。你可以在最后单击保存按钮保存。\n\
    \n### 编码你的扩缩容\n\n第三个选项是编程扩缩容。换句话说，你创建代码来增加或减少集群中的实例数量。\n\n在创建集群并配置扩缩容后，我们现在将学习如何创建\
    \ .NET Service Fabric 应用程序。\n\n## 练习 4 – 创建 .NET Service Fabric 应用程序\n\nService\
    \ Fabric 支持多种应用程序模型。它是一种灵活的技术，允许你托管和执行任何工作负载。安装 Service Fabric SDK 后，你将能够使用其可用的模板。\n\
    \n当我们运行 Visual Studio 2022 并选择 Service Fabric 模板时，会出现许多模型，如屏幕截图所示：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_144_0.png)\n\
    \n图 5.18 – Service Fabric 模板模型\n\n我们将从一种被认为具有可靠服务的应用程序模型开始。这些服务使用 Service Fabric\
    \ 的原生 API。我们有三种不同类型的可靠服务：无状态、有状态和参与者。无状态服务与有状态服务的区别在于，在无状态服务中，服务不维护任何状态，而对于有状态服务，状态会与服务一起存储。\n\
    \n此外，我们可以使用 .NET Core 和 .NET Framework 运行时来构建可靠服务。这就是为什么我们可以使用 Service Fabric\
    \ 迁移旧应用程序的原因。参与者是一个依赖的计算单元，在单个线程上运行。参与者模型适用于并发或分布式系统，因为大量这些参与者可以同时且独立地运行，通过消息进行通信。\n\
    \n另一种应用程序模型是容器。Service Fabric 支持 Linux 和 Windows 容器。\n\n还有来宾可执行模型。它允许我们将使用任何开发平台和任何编程语言构建的任何类型的可执行文件带到\
    \ Service Fabric。\n\n有了这些应用程序模型，我们可以在任何需要高可用性、可靠性和用于部署和运行应用程序的强大平台的场景中使用 Service\
    \ Fabric。\n\n我们将基于 Service Fabric 的 **无状态可靠服务** 创建一个示例解决方案。该应用程序用于管理非洲和欧洲一些国家的医院。\n\
    \n## 创建 Service Fabric 应用程序\n\n让我们回到 Visual Studio 2022。当我们选择 **创建新项目** 时，我们需要通过指定名称、位置、解决方案名称和框架来配置项目。之后，我们将单击\
    \ **创建** 按钮。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_145_0.png)\n\n图 5.19\
    \ – 创建 Service Fabric 应用程序\n\n之后，我们将选择 **无状态服务 ASP.NET Core**，它将使用 .NET Core 运行时。如以下图所示，我们将指定服务名称和位置（可选），然后单击\
    \ **创建**。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_146_0.png)\n\n图 5.20 – Azure\
    \ Service Fabric 上的无状态服务\n\n在下一个窗口中，我们可以选择应用程序类型。我们将选择 **ASP.NET Core Web App\
    \ (Model-View-Controller)**。\n\n"
