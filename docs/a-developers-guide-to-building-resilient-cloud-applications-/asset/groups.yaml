    \ a namespace using the Azure portal\n\nIn the **Basics** tab, we have the following\
    \ interface:\n\n![](img/66aceec30d3e7dead2f71bb68a887688_78_0.png)\n\nFigure 3.18\
    \ – Creating a Service Bus namespace\n\nIf you select **Basic** in the **Pricing\
    \ tier** field, note that you will not be able to create **Topics**, only **Queues**,\
    \ as presented in the following screenshot:\n\n![](img/66aceec30d3e7dead2f71bb68a887688_79_0.png)\n\
    \nIn the **Networking** tab, you can leave the default values for the connectivity\
    \ method that is public access, or you can select your private access if you have\
    \ already configured the landing zone. In the landing zone, you configure your\
    \ account, security governance, networking, and identity.\n\nWe will select **Review\
    \ + create** then select **Create** and the Service Bus namespace will be created.\n\
    \nOnce finished, we will create a queue in the portal. Let’s open the Service\
    \ Bus namespace and select **Overview** from the left-hand menu. Next, at the\
    \ top of the screen, select **+ Queue** and fill in all the information required\
    \ to create the queue, including the name, the queue max size, the max delivery\
    \ count, message time to live (days, hours, minutes and seconds), the lock duration\
    \ (days, hours, minutes and seconds). Additionally, we need to enable the following\
    \ options:\n\n- Auto-delete on idle queue\n- Duplicate detection\n- Dead lettering\
    \ on message expiration\n- Partitioning\n- Sessions\n\nWe can enable forwarding\
    \ messages to queues and topics:\n\n![](img/66aceec30d3e7dead2f71bb68a887688_80_0.png)\n\
    \nFigure 3.20 – Creating a queue\n\nWe used the Azure portal to create an Azure\
    \ Service Bus namespace and a queue. In the next section, we will see how to do\
    \ this using the Azure CLI.\n\n### Using the Azure CLI\n\nTo begin, we need to\
    \ create a resource group if one doesn't exist already:\n\n```\nAz group create\
    \ --name packrg --location eastus\n```\n\nA message queue uses a namespace, so\
    \ we will need to create a namespace:\n\n```\nAz servicebus namespace create --resource-group\
    \ packrg --name appointmentQueue --location eastus\n```\n\nNext, we create a queue\
    \ using the following command:\n\n```\naz servicebus queue create --resource-group\
