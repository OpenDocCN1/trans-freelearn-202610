    Resource Orchestration, and Lifecycle Orchestration. There is a relationship of
    dependency and continuity between the functions. You can also run multiple instances
    of an orchestrator function in parallel to each other functions. Orchestrator
    functions can have multiple statuses, such as Started, Consulted, or Canceled.
