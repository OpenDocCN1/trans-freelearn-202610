    using these APIs.


    To create and publish a product, you need to follow these steps:


    - 1. Sign in to the Azure portal and navigate to your API Management instance.

    - 2. In the left navigation pane, select **Products**; after that, select the
    + **Add** button.


    3. In the **Add product** window, fill in the fields, as displayed in the following
    screenshot, to create your product:


    ![](img/66aceec30d3e7dead2f71bb68a887688_42_0.png)


    Figure 2.11 – Add product part 1


