  - '[PAGE 237]


    Once our deployment has finished, and we have the JSON output, we can go back
    to the portal and go to our resource groups. We will see that our new resource
    group has been created. Inside it, we have the Data Lake Storage account and the
    new user:


    ![](img/66aceec30d3e7dead2f71bb68a887688_237_0.png)


    Figure 10.6 – Displaying a Data Lake Storage Gen2 resource


    We can add the new user-assigned managed identity to the Storage Blob Data Contributor
    role on the storage account.


    If we want to upgrade Azure Blob Storage with Azure Data Lake Storage Gen2 capabilities
    using the Azure CLI, we can run the following command:


    ```

    $ az storage account hns-migration start --type validation -n your-storage-account-name
    -g the-resource-group-name

    ```


    In Azure, you can implement data ingestion at scale by creating pipelines that
    orchestrate the process of extracting, transforming, and loading data. This process
    is called ETL. A lot of work based on coordinating all of the sources, destinations,
    and transformations, as well as multiple databases, file formats, and data types,
    is often required, and this is the task of Azure Data Factory (ADF). You can use
    ADF to build and run pipelines. We will explore this service in the next section.


    # Exploring Azure Data Factory


    ADF is an Azure cloud-based data integration service, a Platform-as-a-Service
    (PaaS) solution that allows you to orchestrate and automate data movement and
    data transformation. Data integration is the process of combining data from multiple
    sources and providing an integrated view of it.'
  - '[PAGE 238]


    ADF allows you to define and schedule data pipelines so that you can transfer
    and transform data. You can integrate your pipelines with other Azure services,
    making it easy for you to integrate data from cloud data stores. You can also
    process data using cloud-based compute resources and keep the results in another
    data store.


    ADF is serverless, which means that you only pay for what you use.


    With ADF, we can bring data into a common format. We can generate new insights
    we’d probably never have by keeping this data separately.


    ADF is enterprise data ready because it has almost 90 different data connectors
    where we don’t need to use a server. It is also a code-free transformation capability
    because we have mapping data flows, which provide a different transformation type
    that allows us to modify data. With ADF, we can run code on any Azure compute
    instance for any hands-on data transformations. It includes multiple SQL Server
    Integration Services (SSIS) packages that we can run on Azure, which optimize
    the ability to rehost on-premises databases in ADF. ADF uses Azure DevOps and
    GitHub to manage the data pipeline operations. We can use built-in multiple activities
    to simplify data publication to any data warehouse, database, or BI analytics
    engine. ADF simplifies data pipeline operations by allowing the automated provisioning
    of simple templates. It provides secure data integration because it uses a virtual
    network manager to prevent data exfiltration.


    # ADF components


    We need to understand the key terms and basic concepts in ADF. There are six main
    components, which we will cover in this section, that we have to create our projects:
    pipelines, activities, datasets, linked services, data flows, and integration
    runtimes. Then, we will explore control flows, pipeline runs, triggers, parameters,
    and variables:


    +   - **Pipelines** are logical groups of activities that perform a single unit
    of work. We can have more than one active pipeline. A group of activities in a
    pipeline performs a task. An activity can be scheduled in a sequence (run as a
    chain) or independently (run in parallel) within a pipeline. With pipelines, we
    can manage correlated activities in a single entity.


    +   - **Activities** are processing steps inside a pipeline, as defined previously.
    Three types of activities are supported: data movement, so we can copy data from
    a store (source) to another store, which is the destination, data transformation,
    and activity orchestration.


    +   - **Datasets** are data structures that give us a selected view into a data
    store, ideally to point to or reference the data used as inputs and outputs of
    a particular activity.


    +   - **Linked services** are the connection strings that activities can use to
    connect to external services, which means that they are the connection information
    needed by ADF to connect to external resources, typically pointing to data sources
    (ingestion) or compute resources (transformation) required for execution.'
