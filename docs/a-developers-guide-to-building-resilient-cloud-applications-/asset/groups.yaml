    \ Apache Spark 集群，它们用作计算引擎，在 Azure Databricks 中运行工作负载。我们可以在一个工作区的用户之间共享集群。集群支持自动伸缩，这意味着我们可以根据运行作业的组件来分配资源。我们还可以在特定闲置时间后自动终止任何不活跃的集群。我们还有笔记本，它们是工作区的一部分，允许我们读取、写入、查询、可视化或探索数据集。我们可以将笔记本连接到集群以运行项目。笔记本中还有更多选项，例如在工作区中保存、共享、导入和导出笔记本。现在，我们将使用\
