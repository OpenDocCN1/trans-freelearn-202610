    > API Management pricing tiers vary in computing capacity per unit and the offered
    feature set – for example, support for virtual networks, multi-regional deployments,
    or self-hosted gateways. To accommodate more API requests, consider adding API
    Management service units instead. Learn more

    >

    > The Developer tier of API Management does not include an SLA and should not
    be used for production purposes. Your service may experience intermittent outages,
    for example during upgrades. Learn more

    >

    > **Pricing tier:** Developer (no SLA)

