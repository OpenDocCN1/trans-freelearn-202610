    We have three main features that emerge from this scenario, thanks to redundant
    servers: we ensure availability, the creation of several replicas of data, as
    well as an evolution in terms of the partitioning of services ensuring reliability.
    Partitioning is a key feature of the reliable services programming model. Service
    Fabric is undoubtedly an excellent option for hosting and running the most critical
    software solutions.


    # The differences between Service Fabric and Kubernetes


    Containers are used in cloud-native applications. This technology has impacted
    the software development industry and has changed how systems are designed, operated,
    distributed, and monitored. If we have multiple containers to manage, we need
    an orchestrator so that we’ll have various container orchestrators. One of the
    main features of an orchestrator is container life cycle management, such as container
    provisioning, the scaling of existing containers, and resource allocation. Kubernetes
    is one of the most widely used container orchestrators in the industry.


    The main difference between Kubernetes and Service Fabric is that Service Fabric
    has three mechanisms to deploy and run applications:


    +   - **A proprietary programming model that you can optionally use in your applications**:
    This programming model allows you to build a stateful or a stateless reliable
    service, and also reliable actors. The actor model is based on having distributed
    objects that communicate with each other through messages.

    +   - **The use of containers**: Both Linux and Windows containers are supported.

    +   - **The use of any secure build with any platform and any language, with no
    modification required at all**: Kubernetes supports both Linux and Windows containers.
    Likewise, Microsoft Azure includes Azure Kubernetes Service, which is a fully
    managed platform for Kubernetes.


    # The Azure Service Fabric development environment


    We have many different options to adopt Service Fabric. Service Fabric is a free,
    open source project whose source code is available on GitHub. Service Fabric supports
    three different execution environments:


    +   - **On-premises environment**: You can install Service Fabric locally on your
    servers or VMs. This scenario is suitable for the first cloud migration of your
    workloads.

    +   - **Public cloud**: Azure Service Fabric allows cluster creation. Note that
    we have the same Service Fabric functionalities as the previous environment because
    we can use the same runtime and SDK.

    +   - **Public cloud with other providers**: We can install Service Fabric on
    any VM using any operating system.'
