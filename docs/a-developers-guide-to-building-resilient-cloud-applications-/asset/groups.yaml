    # Securing the API


    When publishing APIs via API Management, access to these APIs is secured by using
    subscription keys. Developers must include a valid subscription key in HTTP requests
    when calling an API; otherwise, these calls will be rejected by the API Management
    gateway. However, the transmission to the backend is not ensured.


    If a developer wants to consume published APIs, a subscription is required. Developers
    who want to consume the published APIs must include a valid subscription key in
    HTTP requests when calling those APIs. But the calls can be rejected immediately
    by the API Management gateway or will not be forwarded to the backend services
    without a valid subscription key. They can get a subscription without approval
    from API publishers, although API publishers can even create subscriptions directly
    for API consumers.


    Several API access security mechanisms are supported for Azure API Management
    Service, such as OAuth 2.0, client certificates, and IP allow lists.


    # Subscriptions and keys


    A subscription key is a unique auto-generated key. This key can be passed through
    in the headers of the client request or as a query string parameter.


    A subscription offers full and detailed control over authorizations and policies.
    A key is linked directly to a subscription and can be extended to different domains.


    Each application must include the key in every request when calling a protected
    API.


    Regeneration of subscription keys is easy and possible if we want to share a key
    with another unauthorized user.


    ![](img/66aceec30d3e7dead2f71bb68a887688_44_0.png)


    Figure 2.13 – Subscription in Azure API Management'
  - '[PAGE 45]


    The preceding screenshot shows that a subscription has two keys, a primary and
    a secondary key, which makes it easier to regenerate it. For example, in the case
    of modifying the primary key, in order to avoid downtime, you can use the secondary
    key in your applications.


    Going back to the product that already includes our APIs where subscriptions are
    enabled, each customer must provide a key during the product API call.


    Developers will submit a subscription request to obtain a key. If this request
    is approved, then the subscription key will be sent in a secure (encrypted) way.


    # The process of calling an API with the subscription key


    The default header name is Ocp-Apim-Subscription-Key, and the default query string
    is subscription-key. Applications making calls to subscription-protected API endpoints
    must include a valid key in all of their HTTP requests passed in the request header
    or as a query string in the URL.


    If we want to test the API calls, we can use the developer portal or command-line
    tools, such as cURL.


    Check out this example to pass a key in the request header using cURL:


    ```

    curl --header "Ocp-Apim-Subscription-Key: <your key string>"

    https://<yourapim gateway>.azure-api.net/api/path

    ```


    Here’s another example cURL command that passes a key in the URL as a query string:


    ```

    curl https://<yourapim gateway>.azure-api.net/api/

    path?subscription-key=<keystring>

    ```


    A 401 Access Denied response will be received from the API gateway if the key
    is not passed in the header for any reason, the same as a query string in the
    URL.


    # Securing APIs by using certificates


    In the previous section, we used keys, but we can also use certificates to provide
    Transport Layer Security (TLS) mutual authentication between the client and the
    API gateway.


    We have to configure the API Management gateway to only allow requests with certificates
    containing a specific thumbprint. The authorization at the gateway level is handled
    through inbound policies.'
  - '[PAGE 46]


    A certificate can include the following properties:


    +   - **Certificate authority (CA)**: The API allows only certificates signed
    by a particular CA

    +   - **Thumbprint**: The API allows only certificates including a specified thumbprint

    +   - **Subject**: The API allows a specific subject (mentioned in the certificate)

    +   - **Expiration date**: The API only allows certificates that have not expired
    and are still available


    # Accepting client certificates in the consumption tier


    If you build your APIs from serverless technologies, such as Azure Functions,
    the Consumption tier in API Management is designed to meet serverless design principles.


    You must explicitly enable the use of client certificates for the Consumption
    tier, which you can do on the **Custom domains** page.


    A custom domain is a domain or subdomain we can buy from a provider and use for
    personal or professional purposes (e.g., `yourdomain.com` or `pages.yourdomain.com`).


    ![](img/66aceec30d3e7dead2f71bb68a887688_46_0.png)


    In the previous screenshot, we can see that we are able to add one or more client
    certificates. We can enable requesting a client certificate by selecting **Yes**.
    Next, we will create policies.


    # Certificate authorization policies


    There are the following different authorization policies:


    +   - Inbound policies are executed when the API Management API is called

    +   - Backend policies are executed when API Management calls the backend APIs

    +   - Outbound policies are executed when API Management returns the response
    to the caller'
