    Azure Blob Storage 为非结构化数据提供大规模可扩展存储。非结构化数据是任何未以结构化数据库格式存储的数据。这可以是任何内容：二进制、文本文件、图像或视频。Microsoft
    Azure 虚拟机将磁盘映像存储在 Blob Storage 中。


    Blob 是二进制大对象的缩写。

