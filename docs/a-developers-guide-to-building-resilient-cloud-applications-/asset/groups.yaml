    # Big Data Storage Overview


    A data lake is a form of file storage, typically on a distributed filesystem for
    high-performance data access. The technologies that are commonly used to process
    queries against stored files and return data for reporting and analysis are Spark
    and Hadoop. These systems rely on a read-schema approach, which defines a tabular
    schema for semi-structured data files, where the data is parsed as it is read
    and no restrictions are applied when it is saved. Data lakes are ideal for supporting
    a mix of structured, semi-structured, and unstructured data that you want to analyze
    to avoid applying schemas when the data is written to storage.


    Azure Data Lake Gen2 technology is created on top of Azure Blob Storage and supports
    most Blob Storage features. More benefits are related to Azure Data Lake, such
    as supporting the hierarchical namespaces, which means that we can store data
    in a file-like structure. This benefit improves the performance of the directory-managed
    operations to provide better support for a large-scale analytical engine.


    In this section, we will start by exploring Azure Data Lake Storage. Azure Data
    Lake Storage combines the power of a high-performance filesystem with a large-scale
    storage platform to give you quick insights into your data.


    Azure Data Lake Storage Gen2 builds on Azure Blob Storage features to optimize
    it, especially for analytical workloads. If you’ve used Hadoop Distributed File
    System, we can treat the data in the same way. With this feature, you can store
    your data in one place and access it through various Azure compute services, such
    as Azure Databricks, HDInsight, and SQL Data Warehouse. Data Lake Storage Gen2
    supports ACLs and POSIX permissions. We can set a granular level of permissions
    at the directory or file level for data stored within the data lake. Azure Data
    Lake Storage organizes stored data by following a hierarchy of directories and
    subdirectories, such as a filesystem for easy navigation, which improves the performance
    of each directory-managed operation. This organization allows us to provide better
    support for a large-scale analytical engine, improved querying performance using
    data partitioning, and better file and data management.


    The cost of storing data in Azure Data Lake Storage is the same as storing data
    in Azure Blob Storage. There is a slight increase in transaction costs for data
    access, but in many cases, these cost increases must be balanced against the need
    for fewer transactions due to more efficient queries. Overall, Azure Data Lake
    Storage allows you to build secure, enterprise-scale data lakes. It offers many
    of the benefits of Azure Blob Storage while doing so at minimal additional cost.


    A good use case for Blob storage is archiving infrequently used data or storing
    website assets such as images and media. Azure Data Lake Storage Gen2 plays a
    fundamental role in any Azure data architecture. These architectures include building
    modern data warehouses, advanced analytics on big data, and real-time analytics
    solutions.'
