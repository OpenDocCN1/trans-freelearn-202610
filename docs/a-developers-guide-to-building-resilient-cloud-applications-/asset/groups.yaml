    +   - **Event consumers**: These listen to the events\n+   For more details, see\
    \ the *Understanding event-driven architecture section.*\n\n+   2. What are the\
    \ different Azure database services?\n+   The different Azure database services\
    \ are as follows: Azure SQL Database, Azure SQL Managed Instance, SQL Server on\
    \ Azure Virtual Machines, Azure Database for PostgreSQL, Azure Database for MySQL,\
    \ Azure Database for MariaDB, Azure Cache for Redis, Azure Database Migration\
    \ Service, and Azure Managed Instance for Apache Cassandra.\n+   For more details,\
    \ see the *Exploring cloud databases section.*\n\n## Chapter 3\n\n+   - Which\
    \ packages need to be added to read messages from a Service Bus queue using a\
    \ .NET Core application?\n+   `Azure.Messaging.ServiceBus.` For more details,\
    \ see *Exercise 3 – publishing messages to a Service Bus queue using a .NET Core\
    \ application.*\n\n## Chapter 4\n\n+   1. Do we need to add more packages for\
    \ Durable Functions?\n+   We need to add `Microsoft.Azure.WebJobs.Extensions.DurableTask`\n\
