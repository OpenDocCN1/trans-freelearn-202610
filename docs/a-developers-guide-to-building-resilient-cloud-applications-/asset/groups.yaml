    # <packt>


    # 第一版


    # Azure 构建弹性云应用的开发者指南


    使用云数据库在无服务器和事件驱动架构上部署应用程序


    # HAMIDA REBAI TRABALSI


    前言由 Lori Lalonde 撰写，微软高级云解决方案架构师经理


    # Azure 构建弹性云应用的开发者指南


    使用云数据库在无服务器和事件驱动

    架构上部署应用程序


    Hamida Rebai Trabelsi


    ![](img/66aceec30d3e7dead2f71bb68a887688_1_0.png)


    伯明翰—孟买


    # Azure 构建弹性云应用的开发者指南


    Copyright © 2023 Packt Publishing


    *保留所有权利。* 未经出版商事先书面许可，本书的任何部分不得以任何形式或任何手段复制、存储在检索系统中或传播，但嵌入在评论或评论文章中的简短引文除外。


    在编写本书时已尽一切努力确保所提供信息的准确性。然而，本书所包含的信息按“现状”出售，不提供任何明示或暗示的担保。作者、Packt Publishing 及其经销商和分销商不对因本书直接或间接造成的任何损害承担责任。


    Packt Publishing 已尽力提供本书中提及的所有公司和产品的商标信息，并以适当的大写形式使用。然而，Packt Publishing 不能保证此信息的准确性。


    **产品组经理：** Rahul Nair

    **出版产品经理：** Surbhi Suman

    **高级编辑：** Divya Vijayan/Romy Dias

    **技术编辑：** Arjun Varma

    **校对编辑：** Safis Editing

    **项目协调员：** Ashwin Kharwa

    **校对：** Safis Editing

    **索引：** Hemangini Bari

    **制作设计师：** Aparna Bhagat

    **市场协调员：** Nimisha Dua


    首次出版：2023 年 1 月


    生产参考：1250123


    由 Packt Publishing Ltd 出版。

    Livery Place

    35 Livery Street

    Birmingham

    B3 2PB, UK.


    ISBN 978-1-80461-171-5


    https://www.packtpub.com


    献给我的母亲 Rafika Boukari，以及我父亲 Mongi Rebai 的记忆，感谢他们的牺牲、祝福，以及他们一直给予我的支持。献给我丈夫 Mohamed
    Trabelsi，感谢他在我写作旅程中的支持。献给我儿子 Rayen Trabelsi 和我小女儿 Eya Trabelsi，感谢他们每天的笑容，始终激励着我。


    ## 前言


    2020 年 3 月 11 日，世界卫生组织在全球 COVID-19 爆发中正式宣布大流行。随着世界进入封锁，企业必须迅速转变并利用创新方式继续运营。我们见证了各行各业的组织采用创造性技术。许多零售企业在被要求关闭门店或限制店内顾客数量时提供了在线订购和路边取货服务。


    当超市货架空空如也且难以补货时，餐馆也利用其直接供应商为客户提供包括农产品、乳制品和生肉在内的杂货套装。健身房提供在线虚拟课程以保持会员活跃和参与。医生为患者提供在线虚拟预约。传统上要求员工到场的办公室转向使用
    Microsoft Teams 等协作工具实现远程办公。他们有什么共同点？他们都利用了云服务。


    在疫情期间的首次财报电话会议上，微软首席执行官 Satya Nadella 表示：“我们见证了两年数字转型的成果在两个月内完成。” 启用远程办公、加速向云的数字化转型以及构建创新解决方案使组织不仅得以生存，而且得以蓬勃发展。


    三年后，世界已缓慢恢复到一种新常态——一种混合世界，既参与在线体验，也参与面对面体验。然而，组织并未放缓脚步。他们正在加速其数字化转型和应用现代化计划。Gartner
    预测，到 2025 年云支出将继续增长，企业组织将继续投资其向云的转变。我在日常工作中亲眼目睹了这一点，我领导着一个云解决方案架构师团队，帮助组织在 Azure
    上实现现代化并进行创新。


    这对你意味着什么，无论你是架构师、开发者、学生还是有志于技术的专业人士？随着对云原生技能的需求持续增长，现在是学习这些关键开发技能的时候，否则你可能会被落下。在
    LinkedIn 上简单搜索“云原生”职位就会产生数千个结果。这是一项需求旺盛的技能，可作为职业加速器。你已经通过购买 Hamida 的这本书迈出了第一步，这对你来说是一项明智的投资。


    Hamida 凭借多年在 Azure 上开发云原生解决方案的经验，将她的专业知识提炼于此。这是一份全面的资源，超越了“什么是云原生应用开发？”这个问题。这不是另一本关于容器和编排服务的书籍。Hamida
    为你提供了“如何做”。她提供了构建端到端云原生应用的路线图，从开发到部署。


    你将带着准备好将这些页面中学到的所有内容付诸实践。你将更深入地了解使用哪种云服务、为什么以及它如何结合起来创建和部署可扩展、可靠、高可用的应用。


    祝你在旅程中好运！


    Lori Lalonde


    微软高级云解决方案架构师经理


    ## 贡献者


    ### 关于作者


    **Hamida Rebai Trabelsi** 在计算领域工作超过 12 年。她在突尼斯开始了职业生涯，曾为**跨国公司 (MNCs)**担任软件开发人员，然后在加拿大
    CGI 担任 .NET 顾问。她目前是 Revenu Québec 加拿大的高级顾问和信息与解决方案集成架构师。她曾被微软授予开发者技术领域最有价值专家和
    Microsoft DevHeros，并持有多个 Azure 认证。除了是微软认证讲师和 .NET 基金会成员外，Hamida 还是一名博主、国际演讲者，并在
    2019 年加拿大 Women in IT 奖中成为决赛选手之一。


    > 我被所有团队给予的支持所感动。他们在这个期间鼓励了我，我感到自豪的是我能够完成这本书并分享我作为开发者开始使用 Azure 的经验。献给我父亲 Mongi
    Rebai 的记忆，我将这本书献给你，希望你与我同在，分享这项添加到我职业生涯中的新冒险。感谢我的妈妈 Rafika Boukari 你的牺牲和支持。感谢我的丈夫
    Mohamed Trabelsi 相信我。每天醒来，我看到我的儿子 Rayen Trabelsi 和我的小女儿 Eya Trabelsi，我感到更有动力，所以感谢你们的能量。


    ### 关于审阅者


    **Ryan Mangan** 是一名专注于应用迁移和现代化的云和终端用户计算技术专家。他是各种主题的国际演讲者、作者，并在过去十年中帮助客户和技术社区。Ryan
    是英国计算机学会的特许会员、微软**最有价值专家 (MVP)**、VMware vExpert 以及**非常重要的 Parallels 专业人士 (VIPP)**。


    **Stefano Demiliani** 是微软业务应用最有价值专家、**微软认证解决方案开发者 (MCSD)**、Azure 认证架构师，也是其他微软相关技术的专家。他的主要活动是基于微软技术全栈（主要专注于
    ERP 和云）进行企业解决方案的架构和开发。他曾与 Packt Publishing 合作过许多与 Azure 云应用和 Dynamics 365 Business
    Central 相关的 IT 书籍，并在欧洲各地的会议上发表演讲。你可以通过 Twitter (@demiliani) 或 LinkedIn 联系他。


