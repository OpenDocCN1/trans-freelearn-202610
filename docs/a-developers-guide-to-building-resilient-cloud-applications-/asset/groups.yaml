    But how does it work? The SDK figures out how to set up the HTTP headers, make
    the REST call, and parse the response back from Cosmos DB. There is great flexibility
    in the types of objects we can use to represent our documents. These can be typical
    C# classes or Plain Old CLR Object (POCOS) or plain old Common Language Runtime
    (CLR) objects, or we can use dynamic types with no predefined properties, which
    fits with the flexible schema that we have in a document database. Most operations
    performed will be asynchronous, where the code doesn''t get blocked while waiting
    for a response from Cosmos DB after making a request. That''s where the Task Parallel
    Library in .NET comes in.


    > **Important note**

    > If you prefer using Language-Integrated Query (LINQ) rather than SQL, the SDK
    also includes a LINQ provider that can translate LINQ queries that you write in
    C# into Cosmos DB SQL for execution.


