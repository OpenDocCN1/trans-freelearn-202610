    ## 前言


    Azure 是微软的公有云计算提供商。它提供一系列云服务，包括计算、网络、存储和分析。用户将继续使用 Azure 中的无服务器和事件驱动技术构建面向云的应用程序，将他们的应用程序与关系型或非关系型数据库集成，在
    Azure 中使用数据库即服务，并使用 Docker 容器在 Azure 上构建 CI/CD 管道。


    为了在市场中保持竞争力并以更快的速度和更低的成本交付软件，拥有稳定遗留系统且数据量不断增长的公司正在对其应用程序进行现代化改造并加速创新。然而，许多企业难以满足现代化改造的需求。本书将通过示例帮助你在
    Azure 上构建安全可靠的基于云的应用程序，并展示如何将它们连接到数据库，以克服应用程序现代化改造的挑战。本书将带你了解 Azure 中的各种服务，即使用网关模式的
    Azure API 管理、事件驱动架构、Event Grid、Azure Event Hubs、Azure 消息队列、使用 Azure Functions
    的函数即服务，以及面向数据库的云。在此过程中每一步，你都将学习如何在 Azure 中创建、导入和管理 API 与 Service Fabric，以及如何确保
    Azure 中的持续集成和部署，从而完全自动化软件交付流程（构建和发布流程）。


    ## 本书读者对象


    本书面向云开发者、软件架构师、系统管理员、DBA、数据工程师、开发人员以及希望理解云世界中软件架构师或开发者新角色的计算机科学学生。希望提升云和云原生编程概念的专业人士也会发现本书非常有用。


    ## 本书涵盖内容


    第 1 章“无服务器架构、事件驱动架构和云数据库简介”涵盖无服务器架构的定义，以及 API 在应用程序及其生态系统中的定义、生命周期、类型和角色。本章还涵盖事件驱动架构和面向数据库的云。


    第 2 章“API 管理——导入、管理和发布你的第一个 API”涵盖 Azure API 管理的不同功能，并定义 API 网关模式。本章还涵盖 API 安全性。


