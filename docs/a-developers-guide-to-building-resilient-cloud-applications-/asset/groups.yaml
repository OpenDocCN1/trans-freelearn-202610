    \ | 200 - 5,000 |\n| 不适切住房津贴 | 300 - 1,200 |\n| 低收入家庭津贴 | 1,000 / 个月 |\n\n本计划旨在纾缓低收入家庭的经济压力，改善其生活质素。申请人必须通过入息及资产审查，并符合相关居住要求。\n\
