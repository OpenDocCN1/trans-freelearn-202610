    The following is the workflow of an order processing scenario using Azure Functions:


    ![](img/66aceec30d3e7dead2f71bb68a887688_101_0.png)


    Figure 4.2 – Order processing scenario


    The previous figure presents the workflow of an order processing scenario.'
