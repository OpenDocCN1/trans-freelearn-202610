    \ ServiceManifest.xml 文件。每个服务都有自己的清单。ServiceManifest.xml 文件包含一个 ConfigPackage\
    \ 元素。找到 Resources 元素以及此服务将侦听的终结点。在这种情况下，我们只有一个终结点。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_148_0.png)\n\
    \n如果我们检查 ASP.NET Core 中的应用程序，在 Program.cs 中，服务使用以下代码行向 Service Fabric 注册自身：\n\n\
    ```\nServiceRuntime.RegisterServiceAsync(\"HospitalServiceType\",\n    context\
    \ => new HospitalService(context)).\nGetAwaiter().GetResult();\n```\n\nHospitalService\
    \ 类继承自 StatelessService，后者是 Service Fabric API 中的基类之一。我们有两个用于侦听器的方法。第一个是 CreateServiceInstanceListeners。它返回一个基于\
    \ Kestrel 的侦听器集合 ServiceInstanceListener。Kestrel 是 .NET Core 中包含的 Web 服务器。换句话说，此服务能够接收\
    \ HTTP 请求。\n\n## 使用 Visual Studio 在本地群集中部署应用程序\n\n要将应用程序部署到本地群集，我们将使用 Visual Studio\
    \ 的 **发布** 工具。右键单击带有 **Service Fabric** 图标的应用程序，然后选择 **发布**。在目标文件中，我们将选择群集中配置的节点数。在这种情况下，我们在连接终结点中配置了单个节点。确保您的应用程序将发布到本地群集。最后，需要包含应用程序参数和启动服务参数的\
    \ .xml 文件才能完成发布过程。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_149_0.png)\n\n\
    单击 **发布** 按钮，然后我们将在 Service Fabric Explorer 中检查应用程序。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_150_0.png)\n\
    \n图 5.25 – Service Fabric Explorer – 应用程序部署\n\n一个解决方案包含多个服务。为了充分利用 Service Fabric\
    \ 平台，我们需要在服务之间进行通信。为此，例如，我们可以实现一个接口或 API。在这种情况下，该接口是所有想要调用医院功能的服务的公共 API。另一个服务（例如搜索服务）可以使用相同的接口。两个服务都将引用该接口。在微服务架构中，一个服务直接调用另一个服务是完全有效的。您可以通过\
    \ HTTP 协议以及从目标微服务公开 API 来实现这一点。\n\n## 练习 5 – 将应用部署到 Service Fabric 托管群集和容器\n\n\
    当应用程序在本地测试并部署后，我们可以将其远程发布到之前创建的 Azure Service Fabric 实例。为此，我们将使用 Visual Studio\
    \ 中相同的发布工具。\n\n## 将 ASP.NET Core 应用程序部署到 Azure Service Fabric\n\n右键单击应用程序，然后选择\
    \ **发布**。在目标配置文件中，我们将选择 `PublishProfiles\\Cloud.xml`。我们将选择与 Azure 门户关联的帐户。在连接终结点中，我们可以选择已创建的\
    \ Azure Service Fabric 群集，也可以使用 Visual Studio 创建您的群集。为此，我们将单击 **添加自定义终结点**。\n\n\
    ![](img/66aceec30d3e7dead2f71bb68a887688_151_0.png)\n\n图 5.26 – 添加自定义终结点\n\n接下来，我们将为终结点添加值。在按照之前的步骤创建群集后，我们将单击\
    \ **创建新群集**。下图显示了创建 Service Fabric 群集的窗口：\n\n图 5.27 – 创建 Service Fabric 群集\n\n\
    我们需要定义群集名称，选择订阅和位置，定义节点数，并选择现有资源组或创建新资源组。我们需要填写每个选项卡的所有信息。对于“证书”选项卡，我们需要添加所需的证书信息。在“VM\
    \ 详细信息”中，我们将配置群集使用的 VM。在“高级”中，我们需要添加端口。之后，我们将单击“创建”。\n\n将创建一个新群集。在窗口底部，我们需要选择用于云环境的应用程序参数文件和启动服务参数文件，因此我们将选择\
    \ Cloud.xml。此配置确保每个服务都将部署到群集中的所有节点。之后，我们将单击“完成”。\n\n## 在 Service Fabric 中构建和执行\
    \ Docker 容器\n\nService Fabric 支持的另一种应用程序模型是使用 Docker 容器。\n\n容器是微服务架构的理想补充，因为它们既隔离又轻量级。\n\
    \n让我们创建一个新的 Service Fabric 应用程序。首先，我们需要选择容器模板，设置服务名称，并指定容器映像名称。映像必须是可访问的。容器映像可以是\
    \ Docker Hub 中的公共映像，例如，也可以是 Azure 容器注册表或任何私有注册表中的私有映像。在这种情况下，我们需要添加用户名和密码。您还可以指定要使用的主机端口和容器端口；例如，我们可以使用端口\
    \ 80。然后，我们将单击 **创建**。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_153_0.png)\n\
    \n这种应用程序模型不会添加服务项目，因为您不会编写任何代码。这是因为所有代码都已经在容器内。如果我们展开包的服务清单，`ContainerHost` 元素包含映像名称。可选地，您还可以使用\
    \ `EnvironmentVariables` 元素在容器中设置环境变量。在本地，我们可以将此类型的应用程序部署到本地群集。在远程，您可以将应用程序部署到\
    \ Azure Service Fabric。\n\n如果您需要了解如何创建容器，可以查阅这本书：Packt Publishing 出版的 *使用 Microsoft\
    \ Azure 的云应用开发者指南*。\n\n## 总结\n\n在本章中，我们讨论了 Azure Service Fabric 平台。我们探索了 Service\
    \ Fabric 的不同元素，例如群集和节点、Service Fabric 与 Kubernetes 之间的主要区别，并且我们准备了用于创建和部署应用程序的开发环境。\n\
    \n我们使用 Azure 门户和 Azure CLI 创建了 Service Fabric 应用程序，了解了如何缩放 Azure Service Fabric\
    \ 群集，并进一步了解了 Visual Studio 2022 中 Service Fabric 模板的不同模型。我们还创建了一个 .NET Service\
    \ Fabric 应用程序，并在 Service Fabric 中构建和执行了一个 Docker 容器。\n\n为了将应用程序发布到 Azure Service\
    \ Fabric，我们使用了 Visual Studio 中的 **发布** 工具。\n\n应用程序使用数据库。在下一章中，我们将了解数据的不同分类，以及数据如何定义和存储。我们将识别关系数据和非关系数据的特征，以及用于数据库的不同\
    \ Azure 服务。\n\n我们还将解释 Azure Storage、Azure SQL Database 和 Azure Cosmos DB 或其组合的用法，以确定数据的操作需求、延迟要求和事务要求。\n\
    \n## 问题\n\n- 1. 什么是 Azure Service Fabric 群集？\n- 2. Kubernetes 和 Service Fabric\
    \ 有什么区别？\n- 3. 我们如何在 Azure Service Fabric 上部署容器化应用程序？\n\n"
