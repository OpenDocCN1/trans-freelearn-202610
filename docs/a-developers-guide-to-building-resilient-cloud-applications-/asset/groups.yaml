    有时，我们需要管理多个数据库。在这种情况下，我们将使用 Azure SQL 数据库弹性池。我们将在下一节中了解如何在 Azure 中部署它们。


    ## 练习 2 – 部署 Azure SQL 数据库弹性池


    如果我们想要管理和扩展具有各种且不可预测的使用要求的多个数据库，我们将使用 Azure SQL 数据库弹性池。


    池适用于具有特定使用模式的大量数据库。对于给定的数据库，该模式的特点是使用高峰不频繁且平均使用量低。否则，不要将多个数据库在同一弹性池中处于中等持续负载下。


    池通过在弹性作业中运行脚本来简化管理任务。弹性作业消除了与大量数据库相关的繁琐工作。


    池化数据库通常支持与单个数据库相同的业务连续性功能。


    Azure SQL 数据库弹性池是一个简单且经济高效的解决方案。它是一个部署选项，这意味着我们购买 Azure 计算资源 (eDTUs) 和存储资源供所有包含的数据库共享。为什么？因为弹性池中的数据库驻留在单个服务器上并共享固定数量的资源以固定价格。**软件即服务
    (SaaS)** 开发者可以通过利用 Azure SQL 数据库中的弹性池为每个数据库提供性能弹性，在一个明确定义的预算内优化一组数据库的价格性能。在弹性池中，我们能够将数据库添加到池中并根据我们的预算设置数据库的最大和最小资源
    (DTU 或 vCore)。


    我们将按照以下步骤创建 SQL 数据库弹性池：


    - 1. 打开 Azure 门户，选择 **创建资源**，并搜索 `SQL Elastic database pool`。你将看到以下屏幕：


    ![](img/66aceec30d3e7dead2f71bb68a887688_172_0.png)


    图 7.14 – 创建 SQL 弹性数据库池


