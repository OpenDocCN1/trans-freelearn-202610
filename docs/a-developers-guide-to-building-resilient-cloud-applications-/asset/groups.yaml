    # The API Gateway pattern


    When developing applications based on complex or large microservices established
    on multiple client applications, it is recommended to use the API Gateway pattern.


    # Definition


    The API Gateway pattern is an integration pattern for clients that communicate
    with a system service, designed to provide a single abstraction layer between
    the underlying services and the customer’s needs. This is the single entry point
    for all clients. It is similar to the Façade pattern of **object-oriented programming
    (OOP)** design, but in this case, it’s part of a distributed system.


    The API Gateway pattern is often referred to as *Backend for Frontend* because
    its implementation is based on the needs of the client application. The pattern
    provides a reverse proxy whose purpose is to redirect or route client requests
    to internal microservices endpoints.


    When should you consider using the API Gateway pattern? The following list specifies
    when it is suitable:


    +   - A synchronous response is issued by the system making the call

    +   - Dependencies between microservices are manageable and do not change over
    time

    +   - No latency requirement; there will be no critical issues if there are slow
    responses

    +   - There is a need to expose an API for the purpose of performing data collection
    from various microservices


    After defining the API Gateway pattern, we will discover, in the next section,
    the use case that we will use during this chapter.'
