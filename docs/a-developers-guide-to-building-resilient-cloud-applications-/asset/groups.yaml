    # How can an API be used in API Management?


    The use of an API by developers is really simple and interactive. They must subscribe
    to a product that includes this API, and then they can call the desired operation
    of the API by ensuring enforcement of usage policies that may be in effect.


    APIs provide a simplified experience when integrating applications, enabling the
    reuse and accessibility of new product and service data on a universal scale.


    With the increase of and, above all, the growing dependency on the publication
    and use of APIs, each company must manage these APIs as first-rate assets meeting
    several criteria.


    These criteria are the API life cycle; the diversification and complexity of the
    backend architecture of API consumers; the protection, acceleration, and observation
    of the operation of APIs; as well as the consumption of APIs by the different
    users and the securing of these hosted services that are in or outside Azure.
    All these criteria are supported by Azure API Management.


    Azure API Management is made up of the following components:


