    We will explore the different components of Azure Databricks next.


    # Azure Databricks components


    When we create a new Azure Databricks resource, we must create a new Databricks
    workspace. This is the first component; a workspace is an interactive tool used
    for exploring and visualizing data. In the workspace, we have Apache Spark clusters.
    They are used to serve as a compute engine to run the workloads in Azure Databricks.
    We can share clusters among users in a workspace. A cluster is auto-scalable,
    which means that we can allocate resources based on the component of the running
    job. We can auto-terminate any inactive cluster after a specific period of inactivity.
    We also have notebooks. These are part of the workspace, allowing us to read,
    write, query, visualize, or explore a dataset. We can connect a notebook to a
    cluster to run items. We have more options in notebooks, such as saving, sharing,
    importing, and exporting them in the workspace. Now, we will create a new Databricks
    workspace using the Azure portal.


    # Creating an Azure Databricks workspace


    In this section, to set up our Azure Databricks environment, we will create an
    Azure Databricks cluster and notebooks, and walk through how to use them.


    Open the Azure portal; we will start by clicking the Create a resource button.
    Then, in the search box, type in Azure Databricks. We will click on the Create
    button to create our resource. Follow these steps:


