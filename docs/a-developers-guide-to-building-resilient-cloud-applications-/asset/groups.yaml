  - '[PAGE 153]


    Let’s create a new Service Fabric application. First, we need to select a container
    template, set the service name, and specify the container image name. The image
    has to be reachable. The container image can be a public image in Docker Hub,
    for example, or a private image in Azure Container Registry or any private registry.
    In this case, we need to add a username and a password. You can also specify the
    host port and the container port that you want to use; for example, we can use
    port 80. Then, we will click on **Create**.


    ![](img/66aceec30d3e7dead2f71bb68a887688_153_0.png)


    This type of application model doesn’t add a service project since you won’t write
    any code. This is because all the code is already inside the container. If we
    expand the service manifest for the package, the `ContainerHost` element contains
    the image name. Optionally, you can also set environment variables in the container
    using the `EnvironmentVariables` element. Locally, we can deploy this type of
    application in the local cluster. Remotely, you can deploy the application to
    Azure Service Fabric.


    If you need to learn about creating a container, you can check out this book:
    *A Developer’s Guide to Cloud Apps Using Microsoft Azure* by Packt Publishing.'
  - '[PAGE 154]


    # Summary


    In this chapter, we talked about the Azure Service Fabric platform. We explored
    the different elements of Service Fabric, such as clusters and nodes, the main
    difference between Service Fabric and Kubernetes, and we prepared a development
    environment to create and deploy an application.


    We created a Service Fabric application using the Azure portal and the Azure CLI,
    we learned about scaling an Azure Service Fabric cluster, and we discovered more
    about the different models of Service Fabric template in Visual Studio 2022. We
    also created a .NET Service Fabric application, and we built and executed a Docker
    container in Service Fabric.


    To publish our applications to Azure Service Fabric, we used the **Publish** tool
    in Visual Studio.


    Applications use a database. In the next chapter, we will learn about the different
    classifications of data and how data is defined and stored. We will identify the
    characteristics of relational and non-relational data and the different Azure
    services for databases.


    We will also explain the use of Azure Storage, Azure SQL Database, and Azure Cosmos
    DB, or a combination of them, to determine the operational needs, latency requirements,
    and transaction requirements of your data.


    # Questions


    +   1. What is an Azure Service Fabric cluster?

    +   2. What is the difference between Kubernetes and Service Fabric?

    +   3. How do we deploy a containerized application on Azure Service Fabric?'
