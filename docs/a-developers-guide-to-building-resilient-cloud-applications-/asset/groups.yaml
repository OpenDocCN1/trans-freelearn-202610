    ## 人机交互


    人机交互在业务工作流中非常常见，用于需要手动审批的场景，工作流必须暂停，直到有人以某种方式进行交互。这种模式允许工作流等待某些事件被触发，然后在等待人机交互超时时，可以选择性地执行缓解操作：


    ![](img/66aceec30d3e7dead2f71bb68a887688_126_0.png)


    图 4.34 – 人机交互模式


