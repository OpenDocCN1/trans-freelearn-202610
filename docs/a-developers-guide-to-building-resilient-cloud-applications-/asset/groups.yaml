    database operations. We have two different capacity modes to choose from:


    - **Provisioned throughput:** You can configure the amount of throughput you expect
    the database to deliver, but you are required to plan the best performance level
    for the application’s needs. This mode is expressed in **request units per second
    (RU/s)**. There are two types: *standard (manual)* and *autoscale*. An Azure Cosmos
    DB SQL API database is a schema-agnostic set of container management units. Each
