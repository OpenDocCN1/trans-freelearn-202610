  md: "\n## Creating a web app to deploy the Azure Event Grid viewer\n\nWe will create\
    \ a web app in the same resource group as our Event Grid topic. We will publish\
    \ the web app instance in a Docker container using the following configuration\
    \ settings:\n\nFigure 3.5 – Create Web App – the Basic tab\n\nIn the **Docker**\
    \ tab, configure the settings as shown in the following figure. We use `microsoftlearning/azure-event-grid-viewer:latest`\
    \ in the **Image and tag** field. This image is a web application built using\
