    # Creating and Deploying a Function App in Azure


    One of the critical decisions architects and developers make in the phase of architecting
    a new cloud software or application is how to connect to the backend services,
    run background processing, run backend tasks, and carry out more tasks, such as
    scheduling and sending emails, without affecting the main application processing.
    For this, the Azure Functions app can be useful.


    We can use Azure Functions to execute code in a cloud environment in a serverless
    way. All we need to do is to write less code with a low cost for a specific problem
    without caring about the whole application, even the infrastructure where we will
    run it. We will focus, in this case, on logic and business scope. We can execute
    Azure Functions in response to events as well.


    In this chapter, we will cover the basic concepts of Azure Functions and the hosting
    plan options. We will explore the development of Azure functions and develop durable
    functions, which are an extension of Azure Functions.


    In this chapter, we''re going to cover the following main topics:


    - Exploring Azure Functions

    - Developing Azure functions

    - Developing durable functions


    ## Exploring Azure Functions


    Azure Functions is similar to Azure WebJobs, with some differences related to
    scaling policies, language support, and trigger events. They are both built on
    Azure App Service. Because Azure Functions is built on the WebJobs SDK, it shares
    the same triggers and connections with or to Azure services.


    Azure Functions acts as a modern serverless architecture providing event-driven,
    configured cloud computing for application development.


    In Azure Functions, there are two very important concepts: bindings and triggers.


    When we create Azure Functions, we need to configure the name of the function.
    To call a function, we use triggers. A function must have at least one trigger.
    The function name and the triggers are configured in the `function.json` file.
    We have more information in the configuration file, such as on bindings. We use
    constraints to have input and output bindings, and all of them will allow you
    to connect with databases from your code. All of this saves coding on the connection.
    But with many Azure service pools, you don’t need to do this—you don’t need to
    write code because the bindings take care of those connections.


    In the following figure, we present the different bindings and triggers:


    ![](img/66aceec30d3e7dead2f71bb68a887688_100_0.png)


    Figure 4.1 – Triggers and bindings


    In the next section, we will define more triggers in Azure Functions.


    ## Triggers


    A **trigger** defines how a function is invoked; it provokes the running of a
    function. Triggers can include the following:


    - **Blob Storage**: When a file or folder is uploaded or changed in storage, this
    will invoke your function

    - **HTTP**: Invokes your function similar to a REST API

    - **Queue in a service bus**: When items exist in a queue, it invokes your function

    - **Timer**: This will invoke your function at scheduled intervals


    In the next section, we will define the bindings in Azure Functions further.


    ## Bindings


    Binding to a function is a method of declaratively connecting another resource
    to the function. Bindings can be connected as input bindings, output bindings,
    or both. Some examples of bindings include the following:


    - Cosmos DB: Connect to the database to be able to load or save files easily

    - Table Storage: This uses the key/value storage from your functions app

    - Queue Storage: This retrieves one or more items from a specific queue, or places
    a new one in the queue


    You can use different bindings by mixing or matching them according to your scenario.


    ## Order processing scenario using Azure Functions


    A healthcare company deploys optimized solutions to improve healthcare access
    for patients. It offers multiple applications (mobile, web, and desktop applications)
    for doctors and hospitals. It has a web and mobile application called EparaMed.
    This is an online drugstore that offers several services. Customers log in to
    purchase their products, and these products can be shipped or picked up.


    The following is the workflow of an order processing scenario using Azure Functions:


    ![](img/66aceec30d3e7dead2f71bb68a887688_101_0.png)


    Figure 4.2 – Order processing scenario


    The previous figure presents the workflow of an order processing scenario.


    Let’s describe the workflow. We have all these actions:


    1. When a customer places a new order, the application (web or mobile) submits
    a message to the **service bus queue**. The message includes the order details.

    2. Azure Functions separates the orders placed for the products to be submitted
    to the topic, and the other orders are sent to the service bus queue.

    3. The product order will further be separated based on order category using **topic
    subscription rules**. This topic filters, by category, the orders into two subscriptions
    using **subscription rules**.

    4. Azure Functions retrieves the price of the ordered product from the storage
    table and calculates the price of the order.

    5. An invoice will be created based on the price, and a notification will be sent
    to the customer—including the product details and the invoice—using Microsoft
    Outlook.


    This scenario is an example related to the use case of order processing, and its
    implementation can be found on GitHub:


    ```

    https://github.com/PacktPublishing/A-Developer-s-Guide-to-Building-Resilient-Cloud-Applications-with-Azure/tree/main/Chapter4

    ```


    To accelerate application development, we can use Azure Functions as in our previous
    scenario. We don’t need to think about the infrastructure challenges, and we have
    the ability to abstract the developer away from having to deal with servers—either
    virtual or physical—because the Azure Functions service is based on serverless
    architecture.


    ## Developing Azure functions


    In this section, we will discuss the key components and the structure of a function.
    We will see how we can create triggers and bindings and learn how we can create
    a function by using Visual Studio Code. We will also use Azure Functions Core
    Tools and connect it to the Azure service.


    ### Azure Functions’ development


    A function is composed of two important elements:


    - **Your code**: It can be written in any language

    - **Configuration JSON file**: `function.json`, which is generated automatically
    from annotations in the code


    The following example presents a `function.json` file. We defined the triggers,
    bindings, and more configuration settings needed. Every function includes only
    one trigger. To determine the events to monitor or the workflow of the data in
    the input and output of a function’s execution, the runtime uses this configuration
    file.


    The name property is used for the bound data in the function. In the following
    example, the name is AddAParamName:


    ```

    "bindings": [

    // Add your bindings here

    {

    "type": "YourBindingType",

    "direction": "in",

    "name": "AddAParamName",

    // Add more depending on binding

    }

    ] }

    ```


    Let’s now discuss the function app, which is a way to organize and manage your
    functions. When we create a function, we need an execution context in Azure where
    our created function will run. A function app consists of one or more individual
    functions that are managed, deployed, and scaled together. All functions created
    in a function app will share the same pricing plan, deployment method, and runtime
    version.


    With a code editor such as **Visual Studio** (2019 or 2022) or **Visual Studio
    Code**, it is easy to create and test your function locally. We can even connect
    our local functions to live Azure services.


    There are three ways to create a function app:


    - In the Azure portal, write a script function

    - Using the Azure CLI, create the necessary resources

    - Using your favorite **integrated development environment (IDE)**, such as Visual
    Studio 2022 or Visual Studio Code, build functions locally and publish them to
    Azure


    In the next section, we will create an Azure Functions instance by using Visual
    Studio 2022. Visual Studio provides an Azure Functions template.


    ### Creating an Azure Functions instance by using Visual Studio 2022


    We will create a simple C# function that will respond to HTTP requests. Then,
    after testing it, we will deploy it to Azure Functions.


    The prerequisites for creating the function are as follows:


    - An Azure account where you are able to create any Azure resources. You can sign
    up for a free trial at https://azure.com/free.

    - Visual Studio 2022 Community Edition, which is free to use.

    - .NET Core 6, which is the target framework for the next steps.


    Let’s create a new project using a Visual Studio Azure Functions template.

    '
  mdcn: '

    # 第 2 部分：连接应用程序与 Azure 数据库


    本书的这一部分，我们将重点关注 Azure 数据库解决方案，包括关系型和非关系型数据库、大型数据库以及不同类型的存储。


    本部分包含以下章节：


    - *第 4 章，在 Azure 中创建和部署 Function App*

    - *第 5 章，开发 Azure Service Fabric 分布式应用程序*

    - *第 6 章，应用程序数据简介*

    - *第 7 章，使用 Azure SQL 数据库*

    - *第 8 章，使用 Azure 存储*

    - *第 9 章，使用 Azure Cosmos DB 管理数据库服务*

    - *第 10 章，大数据存储概述*


    ---


    # 在 Azure 中创建和部署 Function App


    在设计新的云软件或应用程序的阶段，架构师和开发人员做出的关键决策之一是如何连接到后端服务、运行后台处理、运行后端任务，并执行更多任务，例如调度和发送电子邮件，而不影响主应用程序的处理。对于此，Azure
    Functions 应用可能很有用。


    我们可以使用 Azure Functions 以无服务器方式在云环境中执行代码。我们需要做的就是为特定问题编写更少的代码，成本低廉，而无需关心整个应用程序，甚至运行它的基础设施。我们将重点关注逻辑和业务范围。我们也可以响应事件执行
    Azure Functions。


    在本章中，我们将介绍 Azure Functions 的基本概念和托管计划选项。我们将探讨 Azure Functions 的开发并开发 Durable Functions，它是
    Azure Functions 的扩展。


    在本章中，我们将涵盖以下主要主题：


    - 探索 Azure Functions

    - 开发 Azure Functions

    - 开发 Durable Functions


    ## 探索 Azure Functions


    Azure Functions 与 Azure WebJobs 类似，但在扩展策略、语言支持和触发事件方面存在一些差异。它们都构建在 Azure App Service
    上。由于 Azure Functions 构建在 WebJobs SDK 上，因此它与 Azure 服务共享相同的触发器和连接。


    Azure Functions 作为现代无服务器架构，提供事件驱动的、配置的云计算用于应用程序开发。


    在 Azure Functions 中，有两个非常重要的概念：绑定和触发器。


    当我们创建 Azure Functions 时，我们需要配置函数的名称。要调用函数，我们使用触发器。函数必须至少有一个触发器。函数名称和触发器在 `function.json`
    文件中配置。我们在配置文件中有更多信息，例如关于绑定。我们使用约束来拥有输入和输出绑定，所有这些都允许您从代码中连接到数据库。所有这些都节省了连接上的编码。但对于许多
    Azure 服务池，您无需这样做——您无需编写代码，因为绑定会处理这些连接。


    在下图中，我们展示了不同的绑定和触发器：


    ![](img/66aceec30d3e7dead2f71bb68a887688_100_0.png)


    图 4.1 – 触发器和绑定


    在下一节中，我们将定义 Azure Functions 中的更多触发器。


    ## 触发器


    **触发器**定义了如何调用函数；它引发函数的运行。触发器可以包括以下内容：


    - **Blob 存储**：当文件或文件夹在存储中上传或更改时，这将调用您的函数

    - **HTTP**：以类似于 REST API 的方式调用您的函数

    - **服务总线中的队列**：当队列中存在项目时，它会调用您的函数

    - **计时器**：这将在计划间隔调用您的函数


    在下一节中，我们将进一步定义 Azure Functions 中的绑定。


    ## 绑定


    绑定到函数是声明性地将另一个资源连接到函数的方法。绑定可以作为输入绑定、输出绑定或两者连接。一些绑定示例包括以下内容：


    - Cosmos DB：连接到数据库以便轻松加载或保存文件

    - 表存储：这使用来自您的 functions 应用的键/值存储

    - 队列存储：这从特定队列检索一个或多个项目，或将新项目放入队列


    您可以通过混合或匹配不同的绑定来根据您的场景使用它们。


    ## 使用 Azure Functions 的订单处理场景


    一家医疗保健公司部署优化解决方案，以改善患者获得医疗保健的机会。它为医生和医院提供多个应用程序（移动、网络和桌面应用程序）。它有一个名为 EparaMed
    的网络和移动应用程序。这是一个在线药店，提供多种服务。客户登录以购买产品，这些产品可以发货或自取。


    以下是使用 Azure Functions 的订单处理场景的工作流程：


    ![](img/66aceec30d3e7dead2f71bb68a887688_101_0.png)


    图 4.2 – 订单处理场景


    上图展示了订单处理场景的工作流程。


    让我们描述工作流程。我们有以下所有操作：


    1. 当客户下新订单时，应用程序（网络或移动）将消息提交到 **服务总线队列**。消息包括订单详细信息。

    2. Azure Functions 将为产品下单的订单分离出来提交到主题，其他订单发送到服务总线队列。

    3. 产品订单将根据订单类别使用 **主题订阅规则**进一步分离。该主题按类别将订单过滤到两个订阅，使用 **订阅规则**。

    4. Azure Functions 从存储表中检索订购产品的价格并计算订单价格。

    5. 将根据价格创建发票，并使用 Microsoft Outlook 向客户发送通知——包括产品详细信息和发票。


    此场景是与订单处理用例相关的示例，其实现可以在 GitHub 上找到：


    ```

    https://github.com/PacktPublishing/A-Developer-s-Guide-to-Building-Resilient-Cloud-Applications-with-Azure/tree/main/Chapter4

    ```


    为了加速应用程序开发，我们可以像之前的场景一样使用 Azure Functions。我们无需考虑基础设施挑战，并且有能力将开发人员从处理服务器——无论是虚拟还是物理——中抽象出来，因为
    Azure Functions 服务基于无服务器架构。


    ## 开发 Azure Functions


    在本节中，我们将讨论函数的关键组件和结构。我们将了解如何创建触发器和绑定，以及如何使用 Visual Studio Code 创建函数。我们还将使用 Azure
    Functions Core Tools 并将其连接到 Azure 服务。


    ### Azure Functions 的开发


    一个函数由两个重要元素组成：


    - **您的代码**：可以用任何语言编写

    - **配置 JSON 文件**：`function.json`，它是从代码中的注释自动生成的


    以下示例展示了 `function.json` 文件。我们定义了触发器、绑定以及更多所需的配置设置。每个函数仅包含一个触发器。为了确定要监视的事件或函数执行输入和输出中数据的工作流程，运行时使用此配置文件。


    name 属性用于函数中绑定的数据。在以下示例中，名称为 AddAParamName：


    ```

    "bindings": [

    // Add your bindings here

    {

    "type": "YourBindingType",

    "direction": "in",

    "name": "AddAParamName",

    // Add more depending on binding

    }

    ] }

    ```


    让我们现在讨论函数应用，它是一种组织和管理函数的方式。当我们创建函数时，我们需要在 Azure 中有一个执行上下文，我们创建的函数将在其中运行。函数应用由一个或多个单独的函数组成，这些函数一起管理、部署和扩展。在函数应用中创建的所有函数将共享相同的定价计划、部署方法和运行时版本。


    使用 **Visual Studio**（2019 或 2022）或 **Visual Studio Code** 等代码编辑器，很容易在本地创建和测试您的函数。我们甚至可以将本地函数连接到实时
    Azure 服务。


    创建函数应用有三种方式：


    - 在 Azure 门户中，编写脚本函数

    - 使用 Azure CLI 创建必要的资源

    - 使用您喜欢的 **集成开发环境（IDE）**，例如 Visual Studio 2022 或 Visual Studio Code，在本地构建函数并将它们发布到
    Azure


    在下一节中，我们将使用 Visual Studio 2022 创建一个 Azure Functions 实例。Visual Studio 提供了一个 Azure
    Functions 模板。


    ### 使用 Visual Studio 2022 创建 Azure Functions 实例


    我们将创建一个简单的 C# 函数来响应 HTTP 请求。然后，在测试之后，我们将部署到 Azure Functions。


    创建函数的先决条件如下：


    - 一个 Azure 账户，您可以在其中创建任何 Azure 资源。您可以在 https://azure.com/free 注册免费试用。

    - Visual Studio 2022 Community Edition，可免费使用。

    - .NET Core 6，这是下一步的目标框架。


    让我们使用 Visual Studio Azure Functions 模板创建一个新项目。


