    -   练习 5 – 将应用部署到 Service Fabric 托管集群和容器


    ### 探索 Azure Service Fabric


    我们可以考虑三类 Azure 服务来部署基于云的应用程序：


    -   **平台即服务（PaaS）**：这提供了一个托管环境，用户可以在其中满足各种计算需求。用户能够在该平台上开发、管理和运行应用程序，而 PaaS 提供商负责管理基础设施。Azure
    提供 **Service Fabric** 和 **Azure App Service** 等 PaaS 服务。

    -   **容器即服务（CaaS）**：虚拟化的出现改变了 IT 行业，使人们能够在单台计算机上同时运行不同的操作系统。这提高了效率和性能。然而，虚拟化并非没有缺点。虚拟环境需要一个单独的操作系统才能运行，因此会占用大量磁盘空间。CaaS
    作为一种卸载硬件资源的手段应运而生。CaaS 提供商让用户可以访问容器化应用或集群。Azure 提供 **Azure Service Fabric**、**Azure
    Container Instances**、**Azure Kubernetes Service**（一个包含易于管理的微服务的容器编排器）以及 **Azure
    Container Apps** 等 CaaS 服务。

    -   **函数即服务（FaaS）**：FaaS 是一种云计算服务，允许代码在响应事件时执行，而无需对代码基础设施进行大规模更改。它推荐给只需要云为应用中的单个函数提供支持的用户。用户无需构建应用开发通常所需的基础设施。


    下图展示了每种类型所使用的不同服务：PaaS、CaaS 和 FaaS。Azure Service Fabric 既可以用作 PaaS，也可以作为 CaaS
    用于容器化应用。


    ![](img/66aceec30d3e7dead2f71bb68a887688_128_0.png)


    图 5.1 – Azure 容器服务


    在本节中，我们讨论了用于构建和部署容器应用的不同 Azure 服务。在下一节中，我们将定义 Service Fabric 以及使用 Service Fabric
    的不同服务。


    ### 定义


    Azure Service Fabric 允许你创建现代、弹性和可扩展的软件解决方案，并提供构建健壮系统所需的功能，例如自动缩放、运行状况监视和容错。


    Service Fabric 平台提供了一种编程模型，你可以使用它基于 Actor 模型创建可靠的服务或组件。对于容器化应用，Service Fabric
    还支持 Docker 容器，因此你可以将该平台用作编排器。Azure Service Fabric 能够运行在任何操作系统（Windows 或 Linux）上。此外，它可以运行在任何环境中：作为私有云在本地运行，在公有云（如
    Azure 或任何其他云提供商，如 AWS 或 Google Cloud Platform）中运行，或者在开发者的本地开发环境中运行。它提供了一整套开发工具和软件开发工具包（SDK），让你能够非常快速地开始在该平台上构建解决方案。这些工具可以用于开发环境或生产环境。云促进了分布式系统软件架构和开发平台的演进。Azure
    Service Fabric 并不是新事物。它是一个开源项目，被用于 Azure 基础设施中的许多服务以及其他 Microsoft 服务中。事实上，它自 Azure
    诞生之初就已存在，当时它仍被称为 Windows Azure。在 Microsoft 内部，该平台具有战略性和基础性地位，因为许多云服务都在使用它，例如 Azure
    SQL Database、Azure Cosmos DB、Azure DevOps、Dynamics 365、Power BI 等等。下图描绘了使用 Service
    Fabric 的不同 Microsoft 服务和工具。


    ![](img/66aceec30d3e7dead2f71bb68a887688_129_0.png)


    图 5.2 – 使用 Service Fabric 为 Azure 和 Microsoft 服务提供支持


    但 Azure Service Fabric 是如何工作的呢？在下一节中，我们将介绍 Azure Service Fabric 的核心功能，它基于两个基本概念：集群和节点。


    '
