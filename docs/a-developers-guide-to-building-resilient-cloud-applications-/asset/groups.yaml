    Figure 2.12 – Add product part 2


    If **Published** is checked, the product will be published, and the APIs in this
    product can be called; else, the unpublished product will be visible only to the
    Administrators group.


    If **Requires subscription** is checked, the user is required to subscribe before
    using the product because the product is protected, and a subscription key must
    be used to access the product''s APIs; else, the product is open and doesn''t
