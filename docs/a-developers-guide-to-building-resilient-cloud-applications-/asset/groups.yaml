    - Exploring the API Management service

    - Securing the API

    - Exercise 1 – creating a backend API and deploying APIs

    - Exercise 2 – using Azure API Management to proxy a public API


    ### Technical requirements


    Before you start exploring our solution, you will need a code editor for C#. Microsoft
    offers code editors and integrated development environments (IDEs), such as the
    following:


    - Visual Studio Code for Windows, macOS, or Linux

    - Visual Studio 2022 for Windows

