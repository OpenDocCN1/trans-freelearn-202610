    credential);\n```\n\nWe add the following source code to create a new event1 variable\
    \ and populate that variable with sample data:\n\n```\nvar event1= new EventGridEvent(\n\
    \    subject: $\"New Patient: Hamida Rebai\",\n    eventType: \"Patients.Registration.New\"\
    ,\n    dataVersion: \"1.0\",\n    data: new\n    {\n        FullName = \"Hamida\
    \ Rebai\",\n        Address = \"Quebec, G2C0L6\"\n    }\n);\n```\n\nNext, we add\
    \ an event2 variable:\n\n```\nvar event2 = new EventGridEvent(\n    subject: $\"\
    New Patient: Mohamed Trabelsi\",\n    eventType: \"Patients.Registration.New\"\
    ,\n    dataVersion: \"1.0\",\n    data: new\n    {\n        FullName = \"Mohamed\
    \ Trabelsi\",\n        Address = \"Quebec, G1X3Z2\"\n    }\n);\n```\n\nAfter,\
    \ we will add the following lines of code to invoke the EventGridPublisherClient.SendEventAsync\
    \ method, and we will see in the following source code how to render the message\
    \ for every event to the console:\n\n```\nawait client.SendEventAsync(event1);\n\
    Console.WriteLine(\"This is the first event published\");\nawait client.SendEventAsync(event2);\n\
    Console.WriteLine(\"This is the second event published\");\n```\n\nLet’s run our\
