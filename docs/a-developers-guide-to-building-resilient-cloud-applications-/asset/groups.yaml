    ## How can an API be used in API Management?


    The use of an API by developers is really simple and interactive. They must subscribe
    to a product that includes this API, and then they can call the desired operation
    of the API by ensuring enforcement of usage policies that may be in effect.


    APIs provide a simplified experience when integrating applications, enabling the
    reuse and accessibility of new product and service data on a universal scale.


    With the increase of and, above all, the growing dependency on the publication
    and use of APIs, each company must manage these APIs as first-rate assets meeting
    several criteria.


    These criteria are the API life cycle; the diversification and complexity of the
    backend architecture of API consumers; the protection, acceleration, and observation
    of the operation of APIs; as well as the consumption of APIs by the different
    users and the securing of these hosted services that are in or outside Azure.
    All these criteria are supported by Azure API Management.


    Azure API Management is made up of the following components:


    - API gateway

    - Azure portal

    - Developer portal


    The following diagram presents the different components of Azure API Management:


    ![](img/66aceec30d3e7dead2f71bb68a887688_35_0.png)


    Figure 2.3 – Azure API Management components


    We have explored the different ways to use API Management and its different components.
    We will look at the API gateway next.


    ## API gateway


    As defined before, the API gateway is the endpoint. It accepts API calls made
    by developers, and they will be routed to one or more backends depending on the
    API’s internal design. A verification of **API keys, JSON Web Tokens (JWTs), certificates**,
    and other credentials are also performed at the endpoint level. If your API is
    called without limit, which slows and generates disturbances in the system, the
    verification of credentials can also be managed by applying the quotas of use
    and the limits of flow. We can perform API transformations on the fly without
    any code changes to the API gateway.


    Metadata will be logged for analysis purposes, as well as backend response caching,
    where configured.


    In the following screenshot, we can see the gateway URL displayed when we create
    an instance of the API Management service in Azure:


    ![](img/66aceec30d3e7dead2f71bb68a887688_36_0.png)


    Figure 2.4 – Gateway URL in Azure API Management


    We will start by creating an API Management service using the Azure portal.


    ## The Azure portal


    The Azure portal includes more than 200 cloud products and services, and API Management
    is an administrative interface where you can configure an API program.


    ![](img/66aceec30d3e7dead2f71bb68a887688_37_0.png)


    Figure 2.5 – API Management in the Azure portal


    Through API Management, we can define or import an API schema, group APIs into
    products, manage users, get insights from analytics, or even configure access
    or consumption policies, such as quotas or the transformations performed on the
    APIs.


    ## Developer portal


    When we create a new API Management instance, an open source developer portal
    is automatically generated. It is used by developers and is a website that can
    be personalized, including the documentation of your APIs.


    ![](img/66aceec30d3e7dead2f71bb68a887688_39_0.png)


    Figure 2.7 – Create a new developer in Azure API Management


    By default, newly created developer accounts have an active status and are assigned
    to the Developers group. An active developer account can be used to access any
    API to which they have a subscription.


    We can invite developers to the developer portal access by sending a notification
    to them from the developer portal. Follow these steps to send an invite:


    - 1. In **Users** under **Developer portal**, select **Invite**.

    - 2. Fill in all the information required to invite a user. An email will be sent
    to the developer. A customized template can be used for the email. If the user
    accepts the invitation, the account will be activated. Note that the invitation
    link is valid for 48 hours.


    ![](img/66aceec30d3e7dead2f71bb68a887688_39_1.png)


    Figure 2.8 – Invite a developer


    To disable a developer account, in order to block their access to the developer
    portal or call any APIs, select **Block** as presented in *Figure 2.9*. To reactivate
    a blocked developer account, select **Activate**. If we want to delete an existing
    active user, we select **Delete**.


    These options are shown in the following screenshot:


    ![](img/66aceec30d3e7dead2f71bb68a887688_40_0.png)


    Figure 2.9 – Block or delete a developer account in Azure API Management


    A user is associated with a group. A group is used to provide product visibility
    management for each developer. API Management has the following immutable system
    groups:


    - **Administrators:** Azure subscription administrators are members of this group.
    Administrators manage the API Management service instance. They create the APIs,
    operations, and products used by developers.

    - **Developers:** This group is for authenticated developer portal users who build
    applications using APIs. They are allowed to access the developer portal and are
    able to build applications that call the operations of an API.

    - **Guests:** Unauthenticated users of the developer portal, such as potential
    customers visiting the developer portal of an API Management instance, belong
    to this group. An administrator can grant them read-only access, such as the ability
    to view APIs without calling them.


    Administrators can create custom groups or make use of external groups in Azure
    Active Directory tenants.


    ## Products


    Products are one or more APIs in API Management that are configured with a title,
    a description, and terms of use with access restrictions: open or protected. The
    only difference between open and protected is that protected products must be
    subscribed to before their use or consumption by developers; open ones can be
    used without a subscription. Configuring subscription approval is done at the
    product level itself, requiring admin approval or auto approval.


    ![](img/66aceec30d3e7dead2f71bb68a887688_41_0.png)


    Figure 2.10 – Products in Azure API Management


    One of the most powerful API Management features that allow the Azure portal to
    modify API behavior through configuration is **policies**.


    Policies present a collection list of statements that can execute sequentially
    on the request or response of an API. The most well-known declarations include
    format conversion from XML to JSON.


    ## Creating and publishing a product


    In Azure API Management, a product includes one or more APIs, a usage quota, and
