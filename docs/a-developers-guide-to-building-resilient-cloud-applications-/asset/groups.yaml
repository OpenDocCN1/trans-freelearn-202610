    ## API Management – Import, Manage, and Publish Your First API


    In this chapter, we will explore the different features of Azure API Management.
    We will understand the API Gateway pattern and the management of API calls. We
    will also publish the web APIs of the healthcare solution to Azure API Management,
    securing the API using subscriptions and certificates and creating a backend API.


