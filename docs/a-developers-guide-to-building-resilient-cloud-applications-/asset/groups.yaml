    of data transformation routines to execute those scalable processes from our pipelines.

    +   - **Integration runtime** is the compute infrastructure used by ADF. It provides
    fully managed data flows for the transformation and data movement processes, an
    activity dispatcher to route the service, and a manager that computes SSIS package
    execution tasks within the data pipelines.


    The following are additional terminologies related to ADF:


    +   - **Pipeline runs or pipeline execution:** We instantiate pipelines by passing
    arguments (values) to parameters (placeholders) that are defined by the activity
    pipeline. These arguments can be passed manually or using a trigger.

    +   - **Trigger:** This is a unit of processing that determines when pipeline
    execution begins. We have different trigger types to use for different events.

    +   - **Parameters:** These are key-value pairs of configuration that are used
    in read-only mode. They are populated from the runtime execution and defined in
    the pipeline. Dataset and linked services are strongly typed, referenceable, and
    reusable parameter entities.

    +   - **Variables:** These are used within pipelines to store temporary values.
    States are used with parameters to pass values between activities, data flows,
    and pipelines.

    +   - **Control flow:** This is the process of orchestrating the pipeline activities.
    It contains the chaining activities, defines parameters, branch activities, and
    custom state passing, and passes arguments for the pipeline running on demand
    or invoked by a trigger.


