    \ following lines of code:\n- 3. Check the entire source code in the Program.cs\
    \ file:\n\n```\nusing Azure;\nusing Azure.Messaging.EventGrid;\n```\n\n```\nusing\
    \ System;\nusing System.Threading.Tasks;\nusing Azure;\nusing Azure.Messaging.EventGrid;\n\
    public class Program\n{\n    private const string topicEndpoint = \"<topic-endpoint>\"\
    ;\n    private const string topicKey = \"<topic-key>\";\n    public static async\
    \ Task Main(string[] args)\n    {\n    }\n}\n```\n\nWe added the System and System.Threading.Tasks\
    \ packages that will be used for asynchronous methods.\n\nIn the code, we added\
    \ a Program class that includes two private properties and a static asynchronous\
    \ method.\n\nThe first property is the topicEndpoint string constant that includes\
