  mdcn: "\n\n## 探索 Azure 文件\n\nAzure Files 存储提供基于云的文件共享，可以从云或本地访问。\n\nAzure Files\
    \ 存储为使用行业标准的 **Server Message Block (SMB)** 协议和 **Network File System (NFS)**\
    \ 协议的应用程序提供共享存储。Azure 虚拟机和云服务可以通过挂载的共享在应用程序组件之间共享文件数据。本地应用程序也可以在共享存储库下访问文件数据。这意味着多个虚拟机可以同时以读写权限共享相同的文件。您也可以使用\
