    \ \"1.0\",\n    data: new\n    {\n        FullName = \"Mohamed Trabelsi\",\n \
    \       Address = \"Quebec, G1X3Z2\"\n    }\n);\n```\n\n之后，我们将添加以下代码行来调用 EventGridPublisherClient.SendEventAsync\
