    the Select SQL deployment option page, as presented in the following figure:


    ![](img/66aceec30d3e7dead2f71bb68a887688_165_1.png)


    Figure 7.2 – Select SQL deployment option page


    Every service is available in two different deployment models. We can create a
    single database for all services or we can select a different option. For example,
    for SQL database services, we can also select Elastic pool or Database Server.
    For SQL Managed Instances, we have a single database in Azure Arc, and in SQL
    virtual machines, we can select the SQL Server image to install it.


    Let’s now discover how to create and deploy a single SQL database in the next
