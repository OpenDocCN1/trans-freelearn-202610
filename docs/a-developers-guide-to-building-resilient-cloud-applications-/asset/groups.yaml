    \ see the azure-pipeline.yml file and the different settings of stages:\n\n![](img/66aceec30d3e7dead2f71bb68a887688_263_1.png)\n\
    \nFigure 11.6 – Settings of the stages in a YAML file\n\nIn the following figure,\
    \ we show how you can build and push an application using .NET Framework to Azure\
    \ Container Registry and App Service:\n\n![](img/66aceec30d3e7dead2f71bb68a887688_265_0.png)\n\
    \nFigure 11.8 – Build and push an application to Azure Container Registry and\
    \ App Service using .NET Framework\n\n## Deploying to Azure Container Registry\n\
    \nWe can follow the same steps presented previously to build and push an application\
    \ to Azure Container Registry.\n\nWe can use another method to create the service\
    \ connection between our project in Azure DevOps and Azure Container Registry\
    \ using these steps:\n\n- 1. Open your project in Azure DevOps and select **project\
    \ settings** at the bottom of the page on the left. Under **Pipelines**, select\
    \ **New Service connection** to define and secure the connection between the Azure\
    \ subscription and your project in Azure DevOps using a service principal. Click\
    \ on the **Create service connection** button:\n\nFigure 11.9 – Create a service\
    \ connection between Azure DevOps and Azure services\n\n2. A new dialog page will\
    \ be displayed, requesting us to select a service connection from the list to\
    \ link our Azure account to our Azure DevOps account. Select Azure Resource Manager\
    \ and click on the Next button to continue the configuration:\n\n![](img/66aceec30d3e7dead2f71bb68a887688_267_0.png)\n\
    \nFigure 11.10 – Configure the new service connection\n\n- 3. On the next dialog\
    \ page, select **Service principal (automatic)** and click on **Next**. Select\
    \ the subscription and the resource group, then enter a service connection. Select\
    \ **Save** to finish the configuration.\n\n> **Important note**\n> \n> If we only\
    \ need to connect our Azure Container Registry with our DevOps account, we can\
    \ select **New Service connection** to add a new connection link. Then, select\
    \ **Docker Registry** and **Azure Container Registry**. Fill in all the parameters\
    \ and select **Save** to confirm the connection.\n\n5. Once the variables are\
    \ saved, we will update vmImageName in the YAML file. Replace the default value,\
    \ 'ubuntu-latest', with 'windows-latest'. We will also add buildContext after\
    \ containerRegistry, as presented in the following screenshot, to make sure that\
    \ all required application files are being copied over to the image filesystem.\
    \ If we don't add this line, we will get an error indicating that the path inside\
    \ of our Dockerfile build can't be found:\n\n![](img/66aceec30d3e7dead2f71bb68a887688_269_0.png)\n\
    \nFigure 11.12 – Pipeline YAML for Container Registry\n\n6. Select Save and run\
    \ to start your pipeline build.\n\n7. Once your image is pushed to the registry,\
    \ push your container to App Service. Your App Service instance should be created.\n\
    \nIn the next section, we will deploy the application to Azure App Service by\
    \ creating a new release pipeline.\n\n## Deploying to Azure App Service\n\nTo\
    \ deploy our application to Azure App Service, we will create a new release pipeline.\n\
    \nTo create a new release pipeline, follow these steps:\n\n- 1. From the dashboard,\
    \ select Pipelines and then Releases.\n- 2. Select New Pipeline, and then select\
    \ Empty job, as presented in the following figure:\n- 4. Select the subscription\
    \ and the application name and specify the fully qualified container image name.\
    \ If you have a multi-container image, provide the names of them all in the Image\
    \ name input. If you use a docker-compose file, add the path in the Configuration\
    \ File input and select Save:\n\n![](img/66aceec30d3e7dead2f71bb68a887688_271_0.png)\n\
    \nFigure 11.15 – Configure Azure Web App on Container Deploy\n\n# Important note\n\
    \nYou will need to enable the admin user for your Container Registry. Select Access\
    \ keys under Settings for your Container Registry and then select Enabled for\
    \ Admin user. This option enables the use of the registry name as the username\
    \ and the admin user access key as the password to allow Docker to log in to your\
    \ Container Registry.\n\n![](img/66aceec30d3e7dead2f71bb68a887688_272_0.png)\n\
    \nFigure 11.16 – Enable Admin user in Azure Container Registry\n\n5. On the Pipeline\
    \ tab, select Add an artifact:\n\nFigure 11.17 – Add an artifact\n\n6. In Add\
    \ an artifact, select Build for Source type, then select the project, the source,\
    \ the default version, and select Add:\n\nFigure 11.18 – Build source type\n\n\
    7. Enable Continuous deployment trigger and save all the modifications:\n\nFigure\
    \ 11.19 – Enable Continuous deployment trigger\n\n8. Select **Create release**,\
    \ add the stage and update the version for the artifact sources for this release.\
    \ Then, click on the **Create** button:\n\n![](img/66aceec30d3e7dead2f71bb68a887688_274_0.png)\n\
    \nFigure 11.20 – Configure a release\n\nWe are ready to again push our local code\
    \ to our repository to start the pipelines. We can add approval requests before\
    \ updating App Service with the latest version.\n\nWe will see in the next section\
    \ how we can integrate Docker Hub with the CI/CD pipeline.\n\n## Integrating Docker\
    \ Hub with the CI/CD pipeline\n\nIn this section, we will set up a CI pipeline\
    \ for building containerized applications. We will build and publish Docker images\
    \ to Docker Hub:\n\n![](img/66aceec30d3e7dead2f71bb68a887688_274_1.png)\n\nFigure\
    \ 11.21 – Scenario: Build and push a Docker image to Docker Hub using Azure DevOps\
    \ pipelines\n"
  mdcn: "\n\n我们将在 GitHub 上使用我们的解决方案。你可以从此仓库 fork 或 clone：https://github.com/didoureba/healthcaresolution.git。我们将部署之前的医疗保健解决方案，其中包括一个\
    \ ASP.NET API 和两个使用 ASP.NET MVC 的应用程序，并按照下图中所示的步骤将应用程序部署到 Azure Container Registry。我们将使用\
    \ Azure DevOps 来确保 CI/CD：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_260_0.png)\n\
    \n请注意，我们可以使用 Azure Repos 代替 GitHub 仓库。Container Registry 资源已经创建。\n\n## 创建管道\n\n\
    在本节中，我们将创建一个管道，因为我们需要一个 Azure DevOps 组织和一个项目已经创建。为此，请按照以下步骤操作：\n\n- 1. 登录到你的 Azure\
    \ DevOps 组织并导航到你的项目：**healthcaresolution**。\n- 2. 选择 **Pipelines** 然后 **Pipelines**，选择\
    \ **Create Pipeline**，然后选择 **New pipeline**，它将显示在底部，以创建新的管道，如下图所示：\n- 4. 添加 GitHub\
    \ 凭据后，从列表中选择你的仓库。\n- 5. 在 Configure 选项卡中，选择 Docker: Build and push an image to\
    \ Azure Container Registry 任务。\n- 6. 选择订阅，然后点击 Continue。\n- 7. 你将被要求连接到你的 Azure\
    \ 账户。身份验证后，选择你的容器注册表。输入镜像名称，然后选择 Validate and configure，如下图所示：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_262_0.png)\n\
    \n图 11.4 – 配置构建和部署镜像到 Azure Container Registry\n\n当 Azure Pipelines 构建你的管道时，它将创建到\
    \ Docker Registry 服务的连接，以便你的管道能够将镜像推送到 Azure Container Registry。最终它会生成一个名为 azure-pipelines.yml\
    \ 的 YAML 文件来定义你的管道。\n\n- 8. 查看生成的 YAML 管道并选择 Save and run：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_263_0.png)\n\
    \n图 11.5 – azure-pipelines.yml 文件\n\n在我们的 YAML 文件中，我们有以下内容：\n\n- - 变量，包括 Container\
    \ Registry 连接，例如镜像仓库、容器注册表和标签\n- - VM 镜像名称，即操作系统环境\n- - 阶段，包括构建作业和不同的设置\n\n在下图中，我们可以看到\
    \ azure-pipeline.yml 文件和阶段的不同设置：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_263_1.png)\n\
    \n图 11.6 – YAML 文件中阶段的设置\n\n在下图中，我们展示了如何使用 .NET Framework 构建和推送应用程序到 Azure Container\
    \ Registry 和 App Service：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_265_0.png)\n\
    \n图 11.8 – 使用 .NET Framework 构建并推送应用程序到 Azure Container Registry 和 App Service\n\
    \n## 部署到 Azure Container Registry\n\n我们可以按照之前介绍的相同步骤构建并推送应用程序到 Azure Container\
    \ Registry。\n\n我们可以使用另一种方法通过以下步骤在 Azure DevOps 中的项目与 Azure Container Registry\
    \ 之间创建服务连接：\n\n- 1. 在 Azure DevOps 中打开你的项目，并在页面左侧底部选择 **project settings**。在 **Pipelines**\
    \ 下，选择 **New Service connection** 以使用服务主体定义并保护 Azure 订阅与 Azure DevOps 项目之间的连接。点击\
    \ **Create service connection** 按钮：\n\n图 11.9 – 在 Azure DevOps 与 Azure 服务之间创建服务连接\n\
    \n2. 将显示一个新对话框页面，要求我们从列表中选择一个服务连接以将 Azure 账户链接到 Azure DevOps 账户。选择 Azure Resource\
    \ Manager 并点击 Next 按钮继续配置：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_267_0.png)\n\
    \n图 11.10 – 配置新的服务连接\n\n- 3. 在下一个对话框页面中，选择 **Service principal (automatic)** 并点击\
    \ **Next**。选择订阅和资源组，然后输入服务连接。选择 **Save** 完成配置。\n\n> **重要说明**\n> \n> 如果我们只需要将 Azure\
    \ Container Registry 与 DevOps 账户连接，我们可以选择 **New Service connection** 添加新的连接链接。然后，选择\
    \ **Docker Registry** 和 **Azure Container Registry**。填写所有参数并选择 **Save** 以确认连接。\n\
    \n5. 变量保存后，我们将更新 YAML 文件中的 vmImageName。将默认值 'ubuntu-latest' 替换为 'windows-latest'。我们还将在\
    \ containerRegistry 之后添加 buildContext，如以下屏幕截图所示，以确保所有必需的应用程序文件都被复制到镜像文件系统中。如果我们不添加这一行，我们将收到错误，提示在\
    \ Dockerfile 构建中找不到内部路径：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_269_0.png)\n\
    \n图 11.12 – Container Registry 的管道 YAML\n\n6. 选择 Save and run 开始你的管道构建。\n\n7.\
    \ 一旦镜像推送到注册表，将你的容器推送到 App Service。你的 App Service 实例应该已创建。\n\n在下一节中，我们将通过创建新的发布管道将应用程序部署到\
    \ Azure App Service。\n\n## 部署到 Azure App Service\n\n要将我们的应用程序部署到 Azure App Service，我们将创建一个新的发布管道。\n\
    \n要创建新的发布管道，请按照以下步骤操作：\n\n- 1. 从仪表板选择 Pipelines 然后 Releases。\n- 2. 选择 New Pipeline，然后选择\
    \ Empty job，如下图所示：\n- 4. 选择订阅和应用程序名称并指定完全限定的容器镜像名称。如果你有多个容器镜像，在 Image name 输入中提供它们全部的名称。如果你使用\
    \ docker-compose 文件，在 Configuration File 输入中添加路径并选择 Save：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_271_0.png)\n\
    \n图 11.15 – 配置 Azure Web App on Container Deploy\n\n# 重要说明\n\n你需要为你的 Container\
    \ Registry 启用管理员用户。选择 Container Registry 的 Settings 下的 Access keys，然后为 Admin user\
    \ 选择 Enabled。此选项允许使用注册表名称作为用户名和管理员用户访问密钥作为密码，以便 Docker 登录到你的 Container Registry。\n\
    \n![](img/66aceec30d3e7dead2f71bb68a887688_272_0.png)\n\n图 11.16 – 在 Azure Container\
    \ Registry 中启用 Admin user\n\n5. 在 Pipeline 选项卡上，选择 Add an artifact：\n\n图 11.17\
    \ – 添加构件\n\n6. 在 Add an artifact 中，选择 Build 作为 Source type，然后选择项目、源、默认版本并选择 Add：\n\
    \n图 11.18 – 构建源类型\n\n7. 启用 Continuous deployment trigger 并保存所有修改：\n\n图 11.19 –\
    \ 启用持续部署触发器\n\n8. 选择 **Create release**，添加阶段并为此版本的构件源更新版本。然后，点击 **Create** 按钮：\n\
    \n![](img/66aceec30d3e7dead2f71bb68a887688_274_0.png)\n\n图 11.20 – 配置发布\n\n我们准备再次将本地代码推送到我们的仓库以启动管道。我们可以在更新\
    \ App Service 的最新版本之前添加审批请求。\n\n我们将在下一节中了解如何将 Docker Hub 与 CI/CD 管道集成。\n\n## 将\
    \ Docker Hub 与 CI/CD 管道集成\n\n在本节中，我们将为构建容器化应用程序设置 CI 管道。我们将构建并发布 Docker 镜像到 Docker\
    \ Hub：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_274_1.png)\n\n图 11.21 – 场景：使用\
    \ Azure DevOps pipelines 构建并推送 Docker 镜像到 Docker Hub\n\n"
