    # Exploring Azure Databricks


    In this section, we will explore the different features of Azure Databricks. However,
    we will start by defining Azure Synapse Analytics.


    # Azure Synapse Analytics


    Databricks is a data, analytics, and AI company. This is a link to their platform:
    https://www.databricks.com/. They were the first creators of the open source versions
    of Apache Spark, Delta Lake, and MLflow. They used some of the architectural components
    of these services to compose Databricks. They tried to unify the innovation of
    the process within data science and data engineering.


    Databricks offers an interactive workspace, helping to automate the production
    workflow. This entire workspace is fully managed, and Azure is the channel that
    Databricks uses to deliver a solution that can be deployed, regardless of the
    underlying infrastructure, such as servers and virtual machines.


    # Azure Databricks features


    Azure Databricks offers multiples features:


