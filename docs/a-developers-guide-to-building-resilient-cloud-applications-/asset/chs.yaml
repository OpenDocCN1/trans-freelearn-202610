  \ Service Fabric。\n\n如果您需要了解如何创建容器，可以查阅这本书：Packt Publishing 出版的 *使用 Microsoft Azure\
  \ 的云应用开发者指南*。\n\n## 总结\n\n在本章中，我们讨论了 Azure Service Fabric 平台。我们探索了 Service Fabric\
  \ 的不同元素，例如群集和节点、Service Fabric 与 Kubernetes 之间的主要区别，并且我们准备了用于创建和部署应用程序的开发环境。\n\n\
  我们使用 Azure 门户和 Azure CLI 创建了 Service Fabric 应用程序，了解了如何缩放 Azure Service Fabric 群集，并进一步了解了\
  \ Visual Studio 2022 中 Service Fabric 模板的不同模型。我们还创建了一个 .NET Service Fabric 应用程序，并在\
  \ Service Fabric 中构建和执行了一个 Docker 容器。\n\n为了将应用程序发布到 Azure Service Fabric，我们使用了 Visual\
