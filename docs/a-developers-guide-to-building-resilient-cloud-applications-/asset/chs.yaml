  ## 练习 1 – 部署单一 SQL 数据库


  在单一数据库中，每个数据库都是隔离的；因此，每个数据库在范围、规模和数据大小方面都是独立计费和管理。我们有两种模型：第一种是基于 DTU 的购买模型，它提供一组价格与性能包，便于轻松配置；第二种是基于
  vCore 的购买模型，它提供广泛的配置控制，还提供超大规模和无服务器选项，可根据您的需求和所需资源自动扩展数据库。在这两种模型中，每个数据库都拥有自己的专用资源和自己的服务层级，即使它们部署在同一逻辑服务器上也是如此。因此，它被认为是
  Azure SQL 数据库的一种部署模型。


