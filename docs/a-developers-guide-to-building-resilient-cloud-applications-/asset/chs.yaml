  \ Core 控制台应用程序。我们需要为接收器应用程序添加与发送器应用程序之前相同的 NuGet 包：Azure.Messaging.ServiceBus 和\
  \ Newtonsoft.Json。我们还将添加 AzureQueueSample.Domains 作为引用。\n\n\n\n\n\n要从 Service Bus\
  \ 队列读取消息，我们使用以下代码：\n\n```csharp\npublic class Program\n{\n    private const string\
  \ ServiceBusConnectionString = \"Endpoint=sb://appointmentqueue.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=1CqAThjCv5M284qwRuItApely83Ju9G48RxGuED2zs0=\"\
  ;\n    private const string QueueName = \"myqueue\";\n    static async Task Main(string[]\
