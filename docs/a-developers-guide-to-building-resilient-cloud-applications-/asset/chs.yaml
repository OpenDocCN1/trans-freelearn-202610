  - Exploring Azure Files\n\n## Azure Storage account\n\n在医疗保健解决方案中，我们有一个用于患者医疗记录的平台。它包括与患者相关的非结构化数据，例如文档、消息、笔记和图像，例如诊断文档、年度检查和疾病监测。所有这些文档都存储在虚拟机上，使用自定义解决方案来提取或加载非结构化数据。\n\
