  \ 存储帐户中添加新条件 – Base blobs 选项卡\n\n我们有创建筛选器集的选项，这将限制规则适用于某些对象。最后，我们选择 Review and Add。现在，该\
  \ blob 将根据自修改以来的天数自动通过该生命周期移动。\n\n## Azure Blob Storage 客户端库 for .NET\n\nBlob 存储旨在存储大量非结构化数据，在本节中，我们将使用\
  \ .NET 的客户端库：Azure Blob Storage。\n\n按照以下步骤安装包并为基本任务编写示例代码：\n\n- 1. 使用 Visual Studio\
  \ 2022 或 .NET CLI 创建 .NET 控制台应用。\n- 2. 为了与 Azure Blob Storage 交互，我们需要使用 NuGet Package\
  \ Manager 或 Package Manager Console 安装 .NET 的 Azure Blob Storage 客户端库，如以下屏幕截图所示：\n\
  \n![](img/66aceec30d3e7dead2f71bb68a887688_198_0.png)\n\n图 8.23 – Azure Blob Storage\
  \ .NET 库\n\n3. 在 Program.cs 中，我们将使用帐户的连接字符串使用 BlobServiceClient 构造函数。为了为容器创建唯一名称，我们将使用\
  \ CreateBlobContainerAsync 方法：\n\n```\nvar blobServiceClient = new BlobServiceClient(\"\
  <your-storage-account-connection-string>\");\nBlobContainerClient containerClient\
  \ = await blobServiceClient.CreateBlobContainerAsync(containerName);\n```\n\n4.\
  \ 我们将为上传和下载文件创建一个本地目录。我们将在文件中写入文本并使用 GetBlobClient 方法获取对 blob 的引用：\n\n```\nstring\
  \ localPath = \"datarepo\";\nDirectory.CreateDirectory(localPath);\nstring fileName\
  \ = \"file-\" + Guid.NewGuid().ToString() + \".txt\";\nstring localFilePath = Path.Combine(localPath,\
  \ fileName);\nBlobClient blobClient = containerClient.GetBlobClient(fileName);\n\
  ```\n\n5. 我们将使用 UploadAsync 方法从本地文件上传数据：\n\n```\nawait blobClient.UploadAsync(localFilePath,\
  \ true);\n```\n\n\n\n\n\n## 探索 Azure 文件\n\nAzure Files 存储提供基于云的文件共享，可以从云或本地访问。\n\
  \nAzure Files 存储为使用行业标准的 **Server Message Block (SMB)** 协议和 **Network File System\
  \ (NFS)** 协议的应用程序提供共享存储。Azure 虚拟机和云服务可以通过挂载的共享在应用程序组件之间共享文件数据。本地应用程序也可以在共享存储库下访问文件数据。这意味着多个虚拟机可以同时以读写权限共享相同的文件。您也可以使用\
  \ **Representational State Transfer (REST)** API 接口或存储客户端库读取文件。在 Azure 虚拟机、Windows、Linux\
  \ 或其他云服务中运行的应用程序可以挂载文件存储共享以访问文件数据，就像应用程序挂载典型的 SMB 或 NFS 共享一样。任意数量的 Azure 虚拟机或角色可以同时挂载并访问文件存储共享。Azure\
  \ Files SMB 文件共享可从 Windows、Linux 和 macOS 客户端访问。NFS 文件共享可从 Linux 和 macOS 客户端访问。\n\
  \n### 文件存储的常见用途\n\nAzure Files 可用于完全替代传统的本地文件服务器或 **Network Attached Storage (NAS)**\
  \ 设备。流行的操作系统，如 Windows、macOS 和 Linux，可以在任何位置直接挂载 Azure 文件共享。Azure Files 使将期望文件共享来存储文件应用程序或用户数据的应用程序轻松迁移到云变得简单。Azure\
  \ 文件共享还可以通过 Azure File Sync 与本地或云上的 Windows 服务器进行复制。为了确保性能并在数据使用位置进行分布式缓存，共享应用程序设置例如存储在配置文件中，以及诊断数据如日志、指标和崩溃转储到共享位置。我们存储开发或管理\
  \ Azure 虚拟机或云服务所需的工具和实用程序。这涵盖了 Azure Files 文件存储的所有常见用例。\n\n### 在 Azure 门户中添加 Azure\
  \ Files\n\n现在，我们将了解如何在 Azure 门户中添加 Azure Files：\n\n1. 返回 **Storage browser** 并选择\
  \ **File shares**：\n\n### 存储账户指标\n\n提供的数据大约每天更新 2-4 次并每小时发布一次。如果您的账户有极大的对象，更新之间可能超过一天。\n\
  \nFigure 8.24 – Storage browser | File shares\n\n2. 选择 Add file share 并添加名称。选择 Tier，然后选择\
  \ Transaction optimized 或 Hot 或 Cool：\n\n   - **Transaction optimized** 用于启用事务繁重的负载。我们将其用于需要文件存储作为后端存储的应用程序。\n\
  \   - **Hot** 是某些文件共享场景的优化选项；例如，如果团队共享文件，Azure Files 将同步它们。\n   - **Cool** 用于归档存储场景。\n\
  \n创建后，我们可以探索不同的设置，如以下屏幕截图所示：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_202_0.png)\n\
  \nFigure 8.25 – Azure Files settings\n\n3. 如果我们选择 **Connect**，我们可以配置从 Windows、Linux\
  \ 或 macOS 连接到 Azure 文件共享的连接。为了保护连接，选择 **Active Directory** 或 **Storage account key**\
  \ 用于 Windows。我们可以将 **Tier** 从 **Transaction optimized** 更改为 **Cold**，例如，或从 **Cold**\
  \ 更改为 **Hot**。\n\n有时，很难决定在解决方案中何时使用 Azure 文件共享而不是 blob 或磁盘共享。如果我们比较不同的功能，我们可以决定哪个解决方案合适。如果我们将\
  \ Azure Files 与 Azure Blob 并排比较，我们会看到 Azure Files 提供 SMB 和 NFS 接口、客户端库和 REST 接口，允许从任何地方访问以存储文件。Azure\
  \ Blob 提供客户端库和 REST 接口，允许以扁平命名空间存储和访问无结构数据，并在 blob 中大规模访问。\n\n### 何时使用 Azure 文件与\
  \ blob\n\n您可以使用 Azure 文件将应用程序迁移到云，该应用程序已使用原生文件系统 API 在其与在 Azure 中运行的其他应用程序之间共享数据。您希望存储开发和调试工具，这些工具需要从许多虚拟机访问。另一方面，Azure\
  \ blob 可用于如果您希望应用程序支持流式传输和随机访问场景，并且希望能够从任何地方访问应用程序数据。还有一些其他区分特性决定何时选择 Azure 文件而不是\
  \ Azure blob。Azure 文件是真正的目录对象，而 Azure blob 是扁平命名空间。Azure 文件可以通过文件共享访问。然而，Azure blob\
  \ 通过容器访问。Azure 文件提供跨多个虚拟机的共享访问，而 Azure 磁盘专用于单个虚拟机。\n\n在选择使用哪个存储功能时，您还应考虑定价并进行成本效益分析。\n\
  \nAzure Storage 可通过 REST API 访问，并为 Microsoft Azure 虚拟机设计，如下图所示：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_203_0.png)\n\
  \nFigure 8.26 – Azure Storage\n\nMicrosoft Azure Storage 服务 REST API 通过存储模拟器提供对\
  \ blob、队列、表和文件服务的编程访问，位于您的 Azure 或开发环境中。您可以在此链接查看有关这些 API 的更多详细信息：https://learn.microsoft.com/en-us/rest/api/storageservices/。\n\
  \n### 总结\n\n在本章中，我们介绍了 Azure Storage 服务中可用的不同存储选项。我们首先创建了一个 Azure 存储账户，其中包含不同类型的存储。我们探索了\
  \ Azure Table Storage、Azure Blob Storage、Azure Disk Storage，最后是 Azure Files。\n\n\
  在下一章中，我们将介绍使用 Microsoft Azure Cosmos DB 设计和实现云原生应用程序。\n\n### 进一步阅读\n\n如需更多信息，您可以查看此链接的\
  \ Microsoft 文档：https://learn.microsoft.com/en-us/azure/storage/。如果您需要使用 .NET 库通过示例使用\
  \ Azure Storage，请使用此链接：https://learn.microsoft.com/en-us/azure/storage/common/storage-samples-dotnet。\n\
  \n### 问题\n\n1. 文件存储的常见用途是什么？\n2. 何时使用 Azure 文件与 blob？\n"
- "## 使用 Azure Cosmos DB 管理数据库服务\n\n如果我们使用关系数据库，我们将数据存储在关系表中。无结构数据可以存储在存储解决方案中，但有时关系数据库的结构可能过于僵化，通常在某些情况下导致性能不佳，需要实施特定的详细调优。有几种模型，称为\
  \ NoSQL 数据库，为某些场景提供解决方案，例如文档、图形、列族存储和键值存储。\n\nNoSQL 数据库由多个特征定义：它们是非关系型，具有 JavaScript\
  \ Object Notation (JSON) 模式，并设计用于扩展。\n\n本章将介绍使用多模型 NoSQL 数据库管理系统 Microsoft Azure\
  \ Cosmos DB 设计和实现云原生应用程序。\n\n在本章中，我们将涵盖以下主要主题：\n\n- NoSQL 数据库\n- Exercise 1 – 使用\
  \ Azure 门户创建 Azure Cosmos DB 账户\n- 探索 Azure Cosmos DB SQL API\n- Exercise 2 – 创建\
  \ Azure Cosmos DB SQL API 账户\n- Exercise 3 – 使用 SDK 连接到 Azure Cosmos DB SQL API\n\
  \n### NoSQL 数据库\n\n组织现在处理的不只是结构化数据。NoSQL 数据库将无结构数据存储在文档中而不是关系表中，我们在其中存储结构化数据。因此，我们将它们归类为“不仅仅是\
  \ SQL”并将其分解为各种灵活的数据模型。NoSQL 数据库类型包括仅文档数据库、键值存储、宽列数据库和图数据库。\n\n\n\n\n\nNoSQL 数据库从零开始构建，用于大规模存储和处理海量数据，支持不断增长的现代业务。\n\
  \n以下是最受欢迎的 NoSQL 数据库类型的定义：\n\n- **Key-value store:** Key-value 存储将相关数据分组到集合中，以便可以通过唯一键轻松检索记录。Key-value\
  \ 存储保留了 NoSQL 数据库结构的优势，同时具有足够的结构来反映关系数据库的值（与非关系数据库相反）。我们可以在下图中看到一个示例：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_206_0.png)\n\
  \nFigure 9.1 -- Key-value NoSQL database type\n\nMicrosoft Azure Table Storage 是这种类型\
  \ NoSQL 数据库的一个示例。\n\n- **Document:** 纯文档数据库主要用于以文档形式存储以文档为中心的数据，例如 JSON 文档。这些系统也可以用于存储\
  \ XML 文档，例如 NoSQL 数据库。Azure Cosmos DB 是这种类型的示例。\n\n- **Table style:** 这种类型是基于稀疏填充表的數據模型。它们也称为宽列数据库。它们使用关系数据库的表格格式，但同一表中每一行中数据的命名和格式可能大不相同。与\
  \ key-value 存储类似，宽列数据库具有基本的 NoSQL 结构，同时保留了高度的灵活性。\n\n- **Graph:** 图类型通常以键-数据格式存储的记录。我们用它来定义存储数据点之间的关系。图数据库允许我们识别非结构化和半结构化信息中的模式。在下图中，我们可以看到不同的图组件：\n\
  \n![](img/66aceec30d3e7dead2f71bb68a887688_207_0.png)\n\nFigure 9.2 – Graph NoSQL\
  \ database type\n\n跨多个非关系型（NoSQL）数据存储的多语言持久性会增加显著的复杂性和开销。因此，Microsoft 提供了一个多模型、地理分布式的数据库\
  \ Azure Cosmos DB，其数据结构可用于原生存储键值对、JSON 层次结构和图。\n\nAzure Cosmos DB 是一种完全托管的 PaaS\
  \ 服务，其内部存储对不同用户是抽象的。\n\n## Exercise 1 – creating an Azure Cosmos DB account using\
  \ the Azure portal\n\nAzure Cosmos DB 是一种分布式数据库引擎，无论如何使用数据库，都具有核心功能集。这些功能包括能够弹性地分发数据库，能够双向扩展存储和吞吐量，低延迟并提供财务支持的\
  \ SLA、各种一致性选项以及企业级安全功能。\n\nAzure Cosmos DB 专为大多数现代云应用程序提供高响应性和始终在线的可用性而设计。Cosmos\
  \ DB 被视为 NoSQL 数据库，主要使用四种数据模型（键值、文档、列族或表样式、图）。\n\nAzure Cosmos DB 包括存储的数据文档，其中数据无模式且最有可能存储为\
  \ JSON 文档。许多文档数据库使用 JSON 来表示文档结构、以图为导向的模型，其中数据表示为节点和边的图表结构，以及最简单的形式的键值存储。数据库管理系统仅存储键值对，并具有宽列存储，可存储具有许多动态列的数据。Cosmos\
  \ DB 对高可用性、地理分布和速度的关注提供了一些相当酷的优势。\n\nCosmos DB 将数据管理为一组分区的文档。文档由一组字段组成，每个字段由键标识。每个文档中的字段可能各不相同，并且一个字段可能包含子文档。在\
  \ Cosmos DB 数据库中，文档被组织到容器中，容器被分组到分区中。\n\n一个文档最多可包含 2 MB 的数据，包括小型二进制对象。但如果需要存储与文档相关的更大\
  \ blob，则需要使用 Azure Blob Storage。然后，您可以在文档中添加对创建的 blob 的引用。\n\n让我们开始使用 Azure 门户创建\
  \ Azure Cosmos DB 资源。我们将遵循以下步骤：\n\n- 1. 在 Azure 门户的主页上，选择 **Create a resource**。您可以使用搜索输入并输入\
  \ Cosmos，或者您可以选择 **Databases** 类别。在 **Azure Cosmos DB** 下选择 **Create**：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_208_0.png)\n\
  \nFigure 9.3 – Azure Cosmos DB | Create\n\n2. 在 Select API 选项页面上，我们必须选择一个 API 来创建新帐户。请注意，帐户创建后我们无法更改它：\n\
  \nSelect API option ...\n\n![](img/66aceec30d3e7dead2f71bb68a887688_209_0.png)\n\
  \nFigure 9.4 – The Select API option page in Cosmos DB\n\n我们有以下 API 可供选择：\n\n- Core\
  \ (SQL) 推荐用于新应用程序。它是用于文档的原生 API。它是 Azure Cosmos DB 的核心。\n- Azure Cosmos DB API for\
  \ MongoDB 是一个原生 SQL API，具有 MongoDB 的 API。MongoDB 是一个文档数据库。如果您已有现有的 MongoDB 工作负载并希望将其迁移到\
  \ Azure，则推荐此 API，例如。\n- Cassandra 是一个专用于 Apache Cassandra 应用的完全托管数据库服务。如果您已有现有的\
  \ Cassandra 工作负载，可以使用此 API 将其迁移到 Azure。Cassandra 是一个用于大数据管理的分布式 NoSQL 数据库管理系统。\n\
  - Azure Table 也是一个专用于 Azure Table Storage 应用的完全托管数据库服务。如果我们决定将现有的 Azure Table Storage\
  \ 资源迁移到 Cosmos DB，可以使用此 API。\n- Gremlin (Graph) 是 Apache TinkerPop 的图遍历语言。Gremlin\
  \ 是一种函数式数据流语言，允许用户简洁地表达应用程序属性图的复杂遍历（或查询）。Cosmos DB 是一个使用 Gremlin 的完全托管图数据库服务。如果我们希望添加需要存储数据之间关系的新工作负载，则推荐此选项。\n\
  \n3. 选择任何 API 选项。我们将在 **Create Azure Cosmos DB Account - Core (SQL)** 页面上拥有相同的选项。从\
  \ **Basics** 选项卡开始：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_210_0.png)\n\nFigure\
  \ 9.5 – Project Details on the Basics tab\n\n在 **Basics** 选项卡上，我们有项目详细信息，其中包括与任何\
  \ Azure 服务相关的通用信息，例如 **Subscription** 和选择资源组。然后，我们可以添加实例详细信息所需的信息，例如 Cosmos DB 帐户名称、位置以及数据库操作的容量模式。我们有两种不同的容量模式可供选择：\n\
  \n- **Provisioned throughput:** 您可以配置数据库预期提供的吞吐量，但您需要规划应用程序需求的最佳性能级别。此模式以 **request\
  \ units per second (RU/s)** 表示。有两种类型：*standard (manual)* 和 *autoscale*。Azure Cosmos\
  \ DB SQL API 数据库是一个无模式的容器管理单元集合。每个容器都是吞吐量和存储的可扩展单元。吞吐量可以在数据库级别、容器级别或两者上进行预配。预配给数据库的吞吐量由数据库中的所有容器共享。所有容器共享吞吐量资源，因此我们可能无法为数据库中的某些容器获得可预测的性能。\n\
  \n![](img/66aceec30d3e7dead2f71bb68a887688_211_0.png)\n\nFigure 9.6 – Azure Cosmos\
  \ DB components\n\n- **Serverless**: 我们选择此选项以创建无服务器模式的帐户，这意味着我们可以在容器中运行数据库操作，而无需配置预先预配的容量。它是一种基于消耗的模型，其中每个请求消耗请求单位。消耗模型消除了预先预配吞吐量请求单位的需求：\n\
  \n> **Important note**\n> 当我们使用 Azure Cosmos DB 时，我们通常以 RU/s 表示的成本来表达数据库选项。\n\n\
  ![](img/66aceec30d3e7dead2f71bb68a887688_211_1.png)\n\nFigure 9.7 – Instance Details\
  \ on the Basics tab\n\n\n\n\n\n4. 我们将选择是否应用 Azure Cosmos DB 免费套餐折扣。创建此账户后，我们将免费获得前\
  \ 1,000 RU/s 和 25 GB 的存储空间。\n\n每个 Azure 订阅最多只能创建一个免费套餐的 Azure Cosmos DB 账户。如果我们已经在使用它，则在创建新的\
  \ Cosmos DB 账户时将不会显示此选项。\n\n5. 建议选择 **限制在此账户上可配置的吞吐量总量**，以防止与配置吞吐量相关的任何意外费用。\n\n\
  6. 在 **Global Distribution** 选项卡中，我们可以启用地理冗余和多区域写入：\n\nA. 地理冗余是指能够向您的账户添加更多区域的能力\n\
  \nB. **Georedundancy writes** 功能允许您将配置的吞吐量用于世界各地的数据库和容器\n\n7. 在 **Networking** 选项卡中，选择连接方法以通过公共\
  \ IP 地址将 Cosmos DB 账户连接到公共端点、专用端点或所有网络。\n\n8. 我们还有 **Backup Policy** 选项卡、**Encryption**\
  \ 选项卡和 **Tags** 选项卡。您可以根据需要更新它们，也可以保持其默认设置。\n\n9. 选择 **Create** 后，选择 **Review +\
  \ create**。\n\n部署完成后，您可以检查 Azure Cosmos DB 账户页面并开始探索使用它的不同元素。\n\n至此，我们已使用 Azure\
  \ 门户创建了一个 Azure Cosmos DB 账户。Azure Cosmos DB 包含多个 API。在下一节中，我们将开始探索 Cosmos DB SQL\
  \ API。\n\n## Exploring the Cosmos DB SQL API\n\nAzure Cosmos DB 支持多种 API 模型，这使您可以为应用程序选择理想的\
  \ API。在本节中，我们将具体深入探讨此 SQL API。Cosmos DB SQL API 是默认的 Azure Cosmos DB API。您可以使用 JSON\
  \ 文档来存储数据以表示您的数据。即使我们使用的是 SQL API，我们仍然可以利用 Cosmos DB 的所有核心功能，这些功能在所有 API 中都是通用的。\n\
  \n当您构建新解决方案时，推荐使用 Cosmos DB 的 Core API。此 API 使用 SQL 作为查询语言，并使用 JavaScript 作为其编程语言。这两种语言都非常通用且流行，使得您更有可能已经具备这两种语言的经验。\n\
  \n具体来说，谈到 SQL 查询语言，您可以使用与 Microsoft SQL Server 等产品相同的 SQL 语法来查询 Cosmos DB。即使您使用的是\
  \ SQL 查询语言，您也可以使用这些查询来查询 JSON 文档，因此您无需做任何特殊操作即可使查询与 JSON 兼容。您可以直接将 JSON 对象嵌入到查询中。如果您查看一些不寻常的场景，则需要塑造\
  \ JSON 文档并测试查询结果的特定模式。\n\nJavaScript 是 Cosmos DB 用于服务器端编程的语言。存储过程、触发器和用户函数都使用 JavaScript\
  \ 编写。由于 JavaScript 可以原生处理 JSON 对象，因此您会发现 JavaScript 非常适合在服务器端代码中操作属性和文档。\n\n## Exercise\
  \ 2 – creating an Azure Cosmos DB SQL API account\n\n我们将通过遵循第一项练习中的相同步骤来创建一个 Azure\
