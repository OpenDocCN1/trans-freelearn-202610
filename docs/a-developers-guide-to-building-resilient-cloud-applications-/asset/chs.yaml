  \ Azure 虚拟机将磁盘映像存储在 Blob Storage 中。\n\nBlob 是二进制大对象的缩写。\n\n\n\n\nAzure 目前支持三种不同类型的\
  \ blob：\n\n- **Block blobs**：块 blob 以一组块的形式管理。每个块的大小变化范围最高可达 100 MB。块 blob 最多可包含\
  \ 50,000 个块。最大大小超过 4.7 TB。块是可作为一个单元读取或写入的最小数据量。块 blob 非常适合存储很少更改的独立大型二进制对象。\n- **Page\
  \ blobs**：页 blob 以固定大小为 512 字节的页集合组织。页 blob 针对随机读写操作进行了优化；如果需要，可以获取和存储单个页的数据。页 blob\
  \ 最多可容纳 8 TB 数据。Azure 使用页 blob 为虚拟机实现虚拟磁盘存储。\n- **Append blobs**：追加 blob 类似于块 blob，但更优化以支持一项新功能，即追加操作。只能向追加\
  \ blob 的末尾添加块。不支持更新或删除现有块。每个块的大小可不同，最高可达 4 MB。追加 blob 的最大大小略高于 195 GB。\n\nBlob 存储在容器中，这使您可以根据业务需求组织\
  \ blob。\n\n此图展示了 Azure Blob Storage 的结构以及我们如何使用 Azure 帐户、容器和 blob：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_190_0.png)\n\
