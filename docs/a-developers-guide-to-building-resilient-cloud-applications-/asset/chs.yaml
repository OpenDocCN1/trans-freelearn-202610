  \ Databricks 工作区连接到 Azure 存储，以便将其用作文件系统，你可以在其中上传文件以供工作区使用\n- 遵循 FedRAMP 和 PCI DSS\
  \ 等行业安全标准与合规要求\n\n接下来，我们将探讨 Azure Databricks 的不同组件。\n\n## Azure Databricks 组件\n\n\
  当我们创建新的 Azure Databricks 资源时，必须创建一个新的 Databricks 工作区。这是第一个组件；工作区是一个用于探索和可视化数据的交互式工具。在工作区中，我们有\
  \ Apache Spark 集群，它们用作计算引擎，在 Azure Databricks 中运行工作负载。我们可以在一个工作区的用户之间共享集群。集群支持自动伸缩，这意味着我们可以根据运行作业的组件来分配资源。我们还可以在特定闲置时间后自动终止任何不活跃的集群。我们还有笔记本，它们是工作区的一部分，允许我们读取、写入、查询、可视化或探索数据集。我们可以将笔记本连接到集群以运行项目。笔记本中还有更多选项，例如在工作区中保存、共享、导入和导出笔记本。现在，我们将使用\
  \ Azure 门户创建一个新的 Databricks 工作区。\n\n## 创建 Azure Databricks 工作区\n\n在本节中，为了设置 Azure\
  \ Databricks 环境，我们将创建一个 Azure Databricks 集群和笔记本，并逐步了解如何使用它们。\n\n打开 Azure 门户；我们首先单击“创建资源”按钮。然后，在搜索框中输入\
  \ Azure Databricks。我们将单击“创建”按钮来创建资源。请按照以下步骤操作：\n\n- 1. 在创建页面上，我们需要完成各个步骤。我们从“基本信息”选项卡开始。第一部分是所有资源共有的：填写订阅和资源组的信息。关于实例详细信息，我们将输入工作区名称，并选择区域和定价层。在“定价层”下，我们有三个选项：\n\
  \  - 标准版，可以使用 Apache Spark 并集成 Azure Active Directory\n  - 高级版，具有另一个涉及基于角色的访问控制的功能\n\
  \  - 试用版，允许我们免费使用高级版 14 天\n\n2. 在“**网络**”和“**高级**”选项卡中，我们可以使用默认值。选择“**查看 + 创建**”。验证通过后，单击“**创建**”按钮。\n\
  \n3. 资源创建完成后，我们将探索 Azure Databricks 服务页面。选择“**启动工作区**”：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_251_0.png)\n\
  \n图 10.20 – 启动 Azure Databricks 工作区\n\n我们将被重定向到浏览器中的另一个页面。\n\n4. 在 Databricks 工作区的登陆页面上，系统会询问我们使用\
  \ Databricks 的原因。我们将选择“**构建数据管道（ETL、流式处理）**”。\n\n5. 创建一个新集群，该集群将作为我们所编写代码的计算引擎。单击“**创建集群**”，然后选择“**创建集群**”按钮：\n\
  \n![](img/66aceec30d3e7dead2f71bb68a887688_252_0.png)\n\n图 10.21 – 在 Databricks\
  \ 工作区中创建集群\n\n6. 让我们使用一些简单的配置来填写各个选项，如下面的截图所示，然后选择“**创建集群**”进行确认：\n\n图 10.22 – 配置新集群\n\
  \n7. 创建一个新笔记本。我们将在左侧窗格中选择“创建”，然后选择“笔记本”，再输入名称。\n\n8. 下一个选项是选择你想要使用的编码语言。我们将选择集群，即我们之前创建的集群。继续按“创建”来创建笔记本：\n\
  \n![](img/66aceec30d3e7dead2f71bb68a887688_254_0.png)\n\n图 10.23 – 创建笔记本\n\n我们可以使用\
  \ Python 将数据导入 Databricks 环境。我们将使用以下代码从保存在 GitHub 存储库（https://raw.githubusercontent.com/didoureba/developerGuideForCloudApps/main/data.csv）中的\
  \ CSV 文件中拉取数据到我们的 Databricks 环境中：\n\n```\nimport pandas as pd ## this import is\
  \ used for data analysis\ncasesdatacsv = pd.read_csv('https://raw.githubusercontent.com/didoureba/developerGuideForCloudApps/main/data.csv');\n\
  print (\"First Databricks Table\")\ndisplay(casesdatacsv)\n```\n\n这段代码的第一行是必需的。我们调用\
  \ pandas，这是一个用于数据分析的 Python 包。下一行将获取一个包含来自 GitHub 存储库数据的 CSV 文件。它将把这些数据保存为一个 DataFrame。我们将这个\
  \ DataFrame 称为 casesdatacsv。如果我们想为结果添加标题，可以使用带有消息的 print。然后，我们可以单击“运行单元格”或使用 Shift\
  \ + Enter。结果如下：\n\n# 图 10.24 – 将数据推送到 Databricks 环境的结果\n\n如果显示的表中有很多行，我们可以展开结果。\n\
  \nAzure 还包含更多数据分析解决方案。在下一节中，我们将探索 Azure Synapse Analytics。\n\n## 探索 Azure Synapse\
  \ Analytics\n\nAzure Synapse Analytics 是一个用于大规模数据分析的集成端到端解决方案。它结合了多种技术和功能，将基于可扩展、高性能\
  \ SQL Server 的关系型数据仓库的数据完整性和可靠性与数据湖和开源 Apache Spark 的灵活性相结合。它还通过使用 Azure Synapse\
  \ Data Explorer 池和用于数据引入与转换的内置数据管道，原生支持日志和遥测分析。\n\n所有 Azure Synapse Analytics 服务都可以通过一个名为\
  \ Azure Synapse Studio 的交互式用户界面进行管理。它允许你创建可组合 Spark 代码和 Markdown 内容的交互式笔记本。Synapse\
  \ Analytics 非常适合在 Azure 上构建统一的分析解决方案。\n\n## 探索 Azure Analysis Services\n\nAzure\
  \ Analysis Services 是一项完全托管的 PaaS 服务。它提供面向云的企业级数据模型。在 Azure Analysis Services 中，我们可以使用高级混合和建模功能，将来自更多数据源的数据组合到一个值得信赖的表格语义数据模型中。我们还可以定义指标并保护数据安全。\n\
