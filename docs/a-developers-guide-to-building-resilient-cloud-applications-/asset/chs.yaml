  图 10.5 – 创建托管标识的结果\n\n3. 创建具有 Data Lake Storage Gen2 的新存储区域，但在那之前，先向 Azure CLI 添加一个扩展，以便它可以使用\
  \ Data Lake Storage Gen2 的不同功能：\n\n```\n$ az extension add --name storage-preview\n\
  $ az storage account create --name myhealthcarestorage1 \\\n  --resource-group healthcareRG\
  \ \\\n  --location eastus --sku Standard_LRS \\\n  --kind StorageV2 --hns true\n\
  ```\n\n一旦部署完成，并且我们获得了 JSON 输出，我们就可以返回门户并进入我们的资源组。我们将看到新的资源组已被创建。在其中，我们有 Data Lake\
  \ Storage 帐户和新用户：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_237_0.png)\n\n图 10.6\
  \ – 显示 Data Lake Storage Gen2 资源\n\n我们可以将新的用户分配托管标识添加到存储帐户上的 Storage Blob Data Contributor\
  \ 角色。\n\n如果我们想使用 Azure CLI 将 Azure Blob Storage 升级为具有 Azure Data Lake Storage Gen2\
  \ 功能，可以运行以下命令：\n\n```\n$ az storage account hns-migration start --type validation\
  \ -n your-storage-account-name -g the-resource-group-name\n```\n\n在 Azure 中，您可以通过创建编排提取、转换和加载数据流程的管道来实现大规模数据摄取。此过程称为\
  \ ETL。基于协调所有源、目标和转换，以及多个数据库、文件格式和数据类型的大量工作通常是必需的，而这就是 Azure Data Factory（ADF）的任务。您可以使用\
  \ ADF 来构建和运行管道。我们将在下一节中探索此服务。\n\n## 探索 Azure Data Factory\n\nADF 是一种基于 Azure 云的数据集成服务，一种平台即服务（PaaS）解决方案，允许您编排和自动化数据移动和数据转换。数据集成是将来自多个来源的数据组合起来并提供其集成视图的过程。\n\
  \nADF 允许您定义和安排数据管道，以便传输和转换数据。您可以将管道与其他 Azure 服务集成，使您轻松集成来自云数据存储的数据。您还可以使用基于云的计算资源处理数据并将结果保存在另一个数据存储中。\n\
  \nADF 是无服务器的，这意味着您只需为所使用的资源付费。\n\n使用 ADF，我们可以将数据带入通用格式。我们可以通过将此数据分开保存而可能永远不会产生的新见解。\n\
  \nADF 已准备好企业数据，因为它几乎有 90 个不同的数据连接器，我们无需使用服务器。它也是无代码转换功能，因为我们有映射数据流，它提供了一种不同的转换类型，允许我们修改数据。使用\
  \ ADF，我们可以在任何 Azure 计算实例上运行代码以进行任何动手数据转换。它包括多个可在 Azure 上运行的 SQL Server Integration\
  \ Services（SSIS）包，可优化在 ADF 中重新托管本地数据库的能力。ADF 使用 Azure DevOps 和 GitHub 来管理数据管道操作。我们可以使用内置的多个活动来简化数据发布到任何数据仓库、数据库或\
  \ BI 分析引擎。ADF 通过允许自动配置简单模板来简化数据管道操作。它提供安全的数据集成，因为它使用虚拟网络管理器来防止数据外泄。\n\n## ADF 组件\n\
  \n我们需要了解 ADF 中的关键术语和基本概念。有六个主要组件，我们将在本节中介绍，我们必须创建我们的项目：管道、活动、数据集、链接服务、数据流和集成运行时。然后，我们将探索控制流、管道运行、触发器、参数和变量：\n\
  \n- **Pipelines** 是执行单一工作单元的活动逻辑组。我们可以有多个活动管道。管道中一组活动执行一项任务。活动可以在管道中按序列安排（作为链运行）或独立运行（并行运行）。使用管道，我们可以在单个实体中管理相关活动。\n\
  \n- **Activities** 是管道中定义的先前定义的处理步骤。支持三种类型的活动：数据移动，以便我们可以将数据从存储（源）复制到另一个存储，即目标，数据转换和活动编排。\n\
  \n- **Datasets** 是数据结构，为我们提供对数据存储的选定视图，最好指向或引用用作特定活动输入和输出的数据。\n\n- **Linked services**\
  \ 是活动可以用来连接到外部服务的连接字符串，这意味着它们是 ADF 连接到外部资源所需的连接信息，通常指向数据管道（摄取）所需的数据源或计算资源（转换）。\n\
  \n\n\n\n+   - **映射数据流**创建并管理数据转换逻辑图，可用于转换任何大小的数据。我们可以构建一个可重用的数据转换例程库，以从管道中执行这些可扩展的过程。\n\
  +   - **集成运行时**是 ADF 使用的计算基础结构。它为转换和数据移动过程提供完全托管的数据流、用于路由服务的活动调度器，以及在数据管道内计算 SSIS\
  \ 包执行任务的管理器。\n\n以下是与 ADF 相关的其他术语：\n\n+   - **管道运行或管道执行：** 我们通过将实参（值）传递给由活动管道定义的形参（占位符）来实例化管道。这些实参可以手动传递，也可以使用触发器传递。\n\
  +   - **触发器：** 这是一个处理单元，用于确定管道执行何时开始。我们有不同的触发器类型，用于不同的事件。\n+   - **参数：** 这些是以只读模式使用的配置键值对。它们由运行时执行填充，并在管道中定义。数据集和链接服务是强类型、可引用且可重用的参数实体。\n\
  +   - **变量：** 它们在管道中用于存储临时值。状态与参数一起用于在活动、数据流和管道之间传递值。\n+   - **控制流：** 这是编排管道活动的过程。它包含链式活动、定义参数、分支活动和自定义状态传递，并为按需运行或由触发器调用的管道传递实参。\n\
  \n现在，我们将使用 Azure 门户创建一个 ADF。\n\n## 使用 Azure 门户创建 ADF\n\n打开 Azure 门户，然后选择 **创建资源**。接下来，按照以下步骤创建\
  \ ADF：\n\n+   1. 选择 **集成**，然后在 **数据工厂** 下单击 **创建**。\n+   2. 在 **创建数据工厂** 页面的 **基础**\
  \ 选项卡中，第一部分与项目详细信息相关，因此我们将选择订阅和资源组。对于实例详细信息，我们将输入 ADF 实例的名称（必须唯一）以及存储 ADF 元数据的区域。版本将为\
