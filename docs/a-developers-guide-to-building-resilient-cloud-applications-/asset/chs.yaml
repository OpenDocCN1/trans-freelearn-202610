  本书的这一部分，我们将重点关注 Azure 数据库解决方案，包括关系型和非关系型数据库、大型数据库以及不同类型的存储。


  本部分包含以下章节：


  - *第 4 章，在 Azure 中创建和部署 Function App*

  - *第 5 章，开发 Azure Service Fabric 分布式应用程序*

  - *第 6 章，应用程序数据简介*

