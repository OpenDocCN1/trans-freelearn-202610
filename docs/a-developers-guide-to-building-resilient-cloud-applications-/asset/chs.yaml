  ## 创建 Event Grid 订阅\n\n我们现在将创建一个新的订阅，验证其注册，然后保存必要的凭据以便在主题上发布新事件。\n\n如果我们返回之前创建的\
  \ Event Grid 主题，我们将在底部看到一个用于创建订阅的按钮，如以下屏幕截图所示：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_68_0.png)\n\
