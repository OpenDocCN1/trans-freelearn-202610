  \nDatabricks 提供了一个交互式工作区，有助于自动化生产工作流。整个工作区完全托管，Azure 是 Databricks 用来交付可部署解决方案的渠道，无论底层基础结构（如服务器和虚拟机）如何。\n\
  \n## Azure Databricks 功能\n\nAzure Databricks 提供多项功能：\n\n+   - 利用 Spark 引擎，提供机器学习、SQL、DataFrame、低延迟流\
