  \ Cosmos DB 的 SDK 以 C# 作为编程语言连接到 Azure Cosmos DB SQL API。\n\n### Adding a new database\
  \ and a new container\n\n让我们看一下步骤：\n\n- 1. 选择 Data Explorer 以创建新容器，然后选择 New container：\n\
