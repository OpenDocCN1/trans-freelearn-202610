- "# 第 1 部分：\n\n# 使用模式和技术构建面向云的应用\n# \n\n在本書的这一部分中，我们将介绍无服务器架构、API、事件驱动架构和面向数据库的云。\n\
  \n本部分包含以下章节：\n\n- *第 1 章，无服务器架构、事件驱动架构和云数据库简介*\n- *第 2 章，API 管理 – 导入、管理和发布您的第一个\
  \ API*\n- *第 3 章，开发基于事件和基于消息的解决方案*\n\n\n\n\n\n## 无服务器架构、事件驱动架构和云数据库简介\n\n第一章介绍本书的内容，包括使用**应用程序编程接口（API）**、**事件驱动架构**、**函数**和\
  \ **Service Fabric** 对应用进行现代化改造，并将其与数据库连接。\n\n**现代化**不仅仅适用于那些已经稳定运行多年、数据量不断增长的公司。组织希望保持盈利能力，不愿因不进行技术现代化、不利用新冠疫情等改变世界的因素带来的市场变化而被淘汰。\n\
  \n现代化是为了加速创新和降低成本。现代化不仅涉及应用，也涉及数据。\n\n在本章中，我们将讨论以下主要内容：\n\n- 理解无服务器架构\n- 理解 API\
  \ 在应用及其生态系统中的作用\n- 理解事件驱动架构\n- 探索云数据库\n\n### 理解无服务器架构\n\n**无服务器架构**是一种软件设计模式，应用由第三方服务托管，使开发人员无需管理底层基础设施即可构建和运行服务。\n\
  \n应用被划分为多个独立的函数，这些函数可以被单独调用和伸缩。\n\n开发人员只实现和部署应用代码，就可以运行由云提供商配置的服务器上托管的应用、数据库和存储系统。\n\
  \n我们将理解 API 在应用和生态系统中的作用。为了在不做任何修改的情况下开始改造遗留应用，我们可以使用 API 与现有代码进行交互。这些 API 将在云端运行，但如果我们需要为应用添加更多功能以实现现代化，我们将通过\
  \ API 将数据和函数封装到服务中。这个封装阶段是一种重用遗留软件组件的技术。其目标是将代码保留在其原有环境中，并通过封装将其连接到新的表示层，从而通过 API\
  \ 访问不同的层。API 允许你定义通用协议（规则），以暴露应用的数据，并有可能解耦表示层。\n\n从技术上讲，封装使用包装器技术，为遗留组件提供新的接口。该组件可以轻松地被其他软件组件访问。\n\
  \n这些最小的修改降低了破坏应用稳定性的风险。即使封装是一种快速、有效且成本较低的解决方案，它也无法解决与维护或升级困难相关的现有问题。\n\n因为我们正在讨论\
  \ API 在数字化转型中的作用及其生命周期，所以我们需要对它们进行定义。\n\n### API 定义\n\nAPI 在不同应用之间架起桥梁，确保它们之间的通信和信息交换。它们甚至可以定义这些应用的行为。\n\
  \nAPI 被视为连接器，因为它们使不同的应用能够交换信息。\n\n交换的信息通常是数据；例如，如果我们在移动应用中发出请求，数据将被发送到服务器，服务器执行读取操作，然后以\
  \ JSON 可读格式返回响应。\n\n有时，微服务会与 API 进行比较。我们经常谈论 API 与微服务之间的关系，但它们之间也存在差异。微服务是一种架构风格，它将应用划分为一组服务；每个服务代表一个非常特定的领域，例如身份验证服务或另一个用于产品管理的服务。另一方面，API\
  \ 是开发人员用来与 Web 应用进行交互的框架（一种可以构建软件的结构）。或者，微服务可以使用 API 来提供服务之间的通信。但 API 是如何工作的呢？\n\
  \n发送请求的应用称为**客户端**，发送响应的应用称为**服务器**。以蜜蜂为例，蜂巢是客户端，花朵是服务器，蜜蜂是通信路径（REST API 请求）。\n\n\
  ### API 生命周期\n\nAPI 管理器——通常是企业架构师或 API 产品经理——负责管理 API 生命周期。\n\nAPI 生命周期由以下三个主要阶段组成：\n\
  \n- **创建阶段：** 包括创建和记录 API。API 创建需要考虑一些关键方面；API 将使用或重用后端资源（服务或业务能力实现）。这些资源通常以 RESTful\
  \ 服务、**简单对象访问协议（SOAP）** 的 Web 服务，或符合**高级消息队列协议（AMQP）** 的消息代理的形式提供。\n- **控制阶段：**\
  \ 包括应用必要的安全策略，以确保交换的安全性。\n- **消费阶段：** 包括发布 API，以便我们可以消费它并从中获利。\n\n在理解了 API 生命周期及其不同阶段之后，接下来我们将了解\
  \ API 在应用间通信方面的重要作用。\n\n### API 的作用\n\n一组规则通过定义应用或机器如何通信来确保 API 的通信，因此 API 是两个希望相互通信的应用之间的中间桥梁。\n\
  \n### API 类型\n\nWeb API 是可以通过 HTTP 协议访问的 API。有许多 API 协议/规范，如下所示：\n\n- 开放 API\n-\
  \ 合作伙伴 API\n- 内部 API\n- 复合 API\n- **表述性状态转移（REST）**\n- SOAP\n- **可扩展标记语言远程过程调用（XML-RPC）**\n\
  - **JavaScript 对象表示法远程过程调用（JSON-RPC）**\n\n最流行的 API 类型是 **RESTful**，因为它在创建满足客户端需求和依赖关系的\
  \ API 时具有多种灵活性优势，因为数据不绑定到方法或资源。RESTful API 支持不同的数据格式，例如 `application/json`、`application/xml`、`application/xhtml+xml`、`multipart/form-data`\
  \ 和 `application/x-www-form-urlencoded`。\n\n**RESTful API** 利用了现有协议——例如，Web API\
  \ 利用了 HTTP 协议。\n\n到目前为止，在本章中，我们已经讨论了通过 API 访问不同层的封装，作为遗留系统现代化的一种技术。我们介绍了 API 生命周期和\
  \ API 角色，这些角色包含多个确保通信的职责，并且我们确定了 API 类型，例如最流行的 RESTful API。在下一节中，我们将介绍用于提高复杂应用敏捷性的事件驱动架构。\n\
  \n### 理解事件驱动架构\n\n事件驱动架构是一种软件架构，它使用事件在解耦的服务之间进行通信。它是一种设计松散耦合应用的模式，用于使用微服务构建的现代应用中。当消费者监听某个事件（可能是状态更改或更新）时，事件生产者无法知道哪些事件消费者在监听，甚至不知道事件发生后的后果。\n\
  \n在事件驱动架构中，我们有以下三个关键组件：\n\n- **事件生产者：** 生成事件流\n- **事件路由器：** 管理生产者和消费者之间的事件传递\n-\
  \ **事件消费者：** 监听事件\n\n下图说明了这些组件：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_27_0.png)\n\
  \n图 1.1 – 事件驱动架构\n\n事件的来源由内部或外部输入触发。事件可以由用户（例如，通过点击或使用键盘输入）、外部源（例如传感器输出）或通过系统（例如加载程序）生成。\n\
  \n在事件驱动架构中，我们可以使用事件流或发布者/订阅者模型。但是事件流和发布者/订阅者模型之间有什么区别？\n\n- **发布者/订阅者模型：** 提供了一种框架，支持发布者和订阅者之间的消息交换。此模式涉及发布者和订阅者，并依赖于消息代理，该代理将消息从发布者重新路由到订阅者。\n\
  - **事件流：** 当事件流发布到代理时，客户端可以订阅该流并随时加入；他们可以访问这些事件，消费多个偏好的流，并且可以从任何位置读取并推进其位置。事件始终写入日志文件中。\n\
  \n事件驱动架构被推荐用于提高敏捷性和快速移动。它们用于现代应用，主要是微服务，或任何包含多个解耦组件的应用。采用事件驱动架构时，你可能需要重新思考如何看待应用设计。\n\
  \n在本节中，我们探讨了事件驱动架构及其不同的关键组件。\n\n\n\n\n\n- **Azure Database for MariaDB**：用于在任何地方构建应用程序，保证低延迟和高可用性，并可扩展至任意规模，或将\
  \ Cassandra、MongoDB 及其他 NoSQL 工作负载迁移到云端。\n- **Azure Cache for Redis**：用于借助兼容开源的内存数据存储来运行快速且可扩展的应用程序。\n\
  - **Azure Database Migration Service**：用于通过简单、自主掌控的迁移过程加速你向云的迁移。\n- **Azure Managed\
  \ Instance for Apache Cassandra**：用于对现有 Cassandra 数据集群和应用进行现代化改造，并通过托管实例服务享受灵活性与自由度。\n\
  \n### 总结\n\n如果你正在构建新应用程序，或正在对旧版应用程序进行现代化改造，你需要了解这些架构：无服务器架构、API 和事件驱动架构。这些架构模式至关重要，必须掌握。\n\
  \n本章介绍了无服务器架构、API 定义、类型、生命周期、应用程序或机器之间的通信、事件驱动架构以及云数据库。\n\n在下一章中，你将学习如何部署 Web API，以及\
  \ API 管理服务的浏览功能。\n\n### 延伸阅读\n\n如果需要更多关于无服务器架构的信息，可以查看这个链接：https://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-serverless-computing/\
  \ 以及这本电子书：https://learn.microsoft.com/en-us/dotnet/architecture/serverless/。\n\n\
  你可以通过以下链接查看事件驱动架构的文档：https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/event-driven\
  \ 和 https://learn.microsoft.com/en-us/azure/architecture/reference-architectures/serverless/event-processing。\n\
  \n### 问题\n\n- 1. 事件驱动架构的三个关键组成部分是什么？\n- 2. Azure 提供哪些不同的数据库服务？\n"
- "## API 管理——导入、管理和发布你的第一个 API\n\n在本章中，我们将探索 Azure API 管理的各种功能。我们将了解 API 网关模式以及 API\
  \ 调用的管理。我们还将把医疗解决方案的 Web API 发布到 Azure API 管理，使用订阅和证书保护 API，并创建后端 API。\n\n在本章中，我们将涵盖以下主要主题：\n\
  \n- 技术要求\n- API 网关模式\n- 探索 API 管理服务\n- 保护 API 安全\n- 练习 1——创建后端 API 并部署 API\n- 练习\
  \ 2——使用 Azure API 管理代理公共 API\n\n### 技术要求\n\n在开始探索我们的解决方案之前，你需要一个用于 C# 的代码编辑器。Microsoft\
  \ 提供了代码编辑器和集成开发环境（IDE），例如：\n\n- 适用于 Windows、macOS 或 Linux 的 Visual Studio Code\n\
  - 适用于 Windows 的 Visual Studio 2022\n- 适用于 Linux 的 Visual Studio 2022\n- GitHub Codespaces\n\
  \n作为先决条件，我们需要一个 Azure 帐户，以便能够在 Azure 应用服务和 Azure API 管理中部署我们的 API。\n\n本章介绍的医疗解决方案使用\
  \ .NET 6 框架。\n\n本书的 GitHub 仓库包含与医疗领域相关的完整应用程序项目解决方案，这些解决方案将在接下来的章节中使用：\n\n```\n\
  https://github.com/didourebaI/developerGuideForCloudApps\n```\n\n### API 网关模式\n\n\
  在基于多个客户端应用程序上建立的复杂或大型微服务开发应用程序时，建议使用 API 网关模式。\n\n### 定义\n\nAPI 网关模式是一种供客户端与系统服务通信的集成模式，旨在底层服务与客户需求之间提供单一抽象层。它是所有客户端的单一入口点。它类似于**面向对象编程（OOP）**设计中的外观模式，但在这种情况下，它是分布式系统的一部分。\n\
  \nAPI 网关模式通常被称为*面向前端的后端*，因为其实现基于客户端应用程序的需求。该模式提供一种反向代理，其目的是将客户端请求重定向或路由到内部微服务端点。\n\
  \n何时应考虑使用 API 网关模式？以下列表说明了适用场景：\n\n- 发起调用的系统会发出同步响应\n- 微服务之间的依赖关系可控且不会随时间变化\n- 没有延迟要求；即使响应缓慢也不会出现严重问题\n\
  - 需要公开 API 以从各个微服务收集数据\n\n在定义 API 网关模式之后，下一节我们将探讨本章要使用的用例。\n\n### 用例\n\n让我们首先看一个与客户端应用和微服务之间直接通信相关的问题。下图展示了我们的解决方案，其中包含多个直接与客户端应用程序交互的前端和后端服务。\n\
  \n在我们的场景中，客户端应用必须直接向微服务发送请求。客户端如何知道要调用哪些端点？例如，如果我们引入新服务，或者决定进行更改并重构现有服务，会发生什么？\n\
  \n服务如何处理身份验证或**安全套接层（SSL）**终止、数据转换和动态请求分发？\n\n客户端应用如何与使用不同协议的服务通信？当我们直接向客户端暴露服务时，存在一些潜在问题：\n\
  \n- 客户端必须跟踪已实现的多个端点以确保弹性的故障处理，这导致客户端代码实现复杂。\n- 客户端与后端之间的耦合。这使得维护客户端更加困难，也使得重构服务更加困难。\n\
  \n![](img/66aceec30d3e7dead2f71bb68a887688_33_0.png)\n\n图 2.1——使用直接客户端到微服务通信架构的场景\n\
  \n所有这些挑战都可以通过实现 API 网关模式来解决，从而将客户端与服务解耦，因为对于基于微服务的应用程序来说，设置一个中间层级或间接层（网关）可能非常方便。API\
  \ 网关位于客户端应用和微服务之间。\n\n下图展示了一个基于微服务并通过自定义 API 网关集成与客户交互的简化架构：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_34_0.png)\n\
  \n图 2.2——使用自定义服务实现 API 网关的场景\n\n除了使用 API 网关模式的优势之外，还有一些不容忽视的缺点：\n\n- 设置可能很复杂，因为\
  \ API 网关是另一个额外部分，需要与微服务及整个解决方案分开开发、部署和管理。\n- 通信过程中可能存在延迟。由于通过 API 网关额外增加了一次网络跳转，响应时间可能比简化架构更慢——但对于大多数应用程序而言，额外的往返开销并不大。\n\
  \n组织之所以采用微服务，是因为该架构具有可扩展性和灵活性。然而，要充分利用微服务战略的优势，需要 API 网关。Azure API 管理包含 API 网关，我们将在下一节中对其进行探索。\n\
  \n### 探索 API 管理服务\n\n在本节中，我们将介绍 API 管理的组件及其功能，并探索 API 管理中使用 API 的产品。\n\n### API\
  \ 管理组件\n\nAzure API 管理是一个混合、可移植、多云 API 管理平台，其核心功能是通过开发者参与、业务洞察、分析、安全和保护来确保 API 项目的成功。每个\
  \ API 可以包含一个或多个操作，并且可以添加到一个或多个产品中。\n\n\n\n\n\n## 如何在 API 管理中使用 API？\n\n开发者使用 API\
  \ 其实非常简单且交互性强。他们必须订阅包含该 API 的产品，然后就可以调用 API 的所需操作，同时确保执行可能生效的使用策略。\n\nAPI 在集成应用时提供了简化的体验，使新产品和服务数据能够在通用规模上实现重用和访问。\n\
  \n随着 API 的增加，尤其是对 API 发布和使用的依赖日益增长，每家公司都必须将这些 API 作为符合多项标准的优质资产进行管理。\n\n这些标准包括 API\
  \ 生命周期；API 消费者后端架构的多样性和复杂性；API 运行的保护、加速和监控；以及不同用户对 API 的消费和对托管在 Azure 内部或外部的这些服务的保障。所有这些标准都由\
  \ Azure API Management 支持。\n\nAzure API Management 由以下组件组成：\n\n- API 网关\n- Azure\
  \ 门户\n- 开发者门户\n\n下图展示了 Azure API Management 的不同组件：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_35_0.png)\n\
  \n图 2.3 – Azure API Management 组件\n\n我们已经探讨了使用 API Management 的不同方式及其不同组件。接下来我们将查看\
  \ API 网关。\n\n## API 网关\n\n如前所述，API 网关是端点。它接收开发者发出的 API 调用，并根据 API 的内部设计将其路由到一个或多个后端。**API\
  \ 密钥、JSON Web Tokens (JWTs)、证书**和其他凭据的验证也在端点级别执行。如果你的 API 被无限制调用，从而减慢系统并产生干扰，则可以通过应用使用配额和流量限制来管理凭据验证。我们可以在不更改\
  \ API 网关代码的情况下即时执行 API 转换。\n\n元数据将被记录以供分析目的，以及在配置时进行的后端响应缓存。\n\n在下面的屏幕截图中，我们可以看到在\
  \ Azure 中创建 API Management 服务实例时显示的网关 URL：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_36_0.png)\n\
  \n图 2.4 – Azure API Management 中的网关 URL\n\n我们将开始使用 Azure 门户创建 API Management 服务。\n\
  \n## Azure 门户\n\nAzure 门户包含 200 多种云产品和服务，API Management 是一个管理界面，您可以在其中配置 API 程序。\n\
  \n![](img/66aceec30d3e7dead2f71bb68a887688_37_0.png)\n\n图 2.5 – Azure 门户中的 API Management\n\
  \n通过 API Management，我们可以定义或导入 API 架构，将 API 分组到产品中，管理用户，从分析中获取洞察，甚至配置访问或消费策略，例如配额或对\
  \ API 执行的转换。\n\n## 开发者门户\n\n当我们创建新的 API Management 实例时，会自动生成一个开源开发者门户。它供开发者使用，是一个可以个性化的网站，包括您\
  \ API 的文档。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_39_0.png)\n\n图 2.7 – 在 Azure\
  \ API Management 中创建新开发者\n\n默认情况下，新创建的开发者账户具有活动状态，并被分配到 Developers 组。活动的开发者账户可用于访问其已订阅的任何\
  \ API。\n\n我们可以通过从开发者门户向他们发送通知来邀请开发者访问开发者门户。发送邀请的步骤如下：\n\n- 1. 在 **Developer portal**\
  \ 下的 **Users** 中，选择 **Invite**。\n- 2. 填写邀请用户所需的所有信息。邮件将发送给开发者。可以为邮件使用自定义模板。如果用户接受邀请，账户将被激活。请注意，邀请链接有效期为\
  \ 48 小时。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_39_1.png)\n\n图 2.8 – 邀请开发者\n\
  \n要禁用开发者账户以阻止其访问开发者门户或调用任何 API，请选择 **Block**，如 *图 2.9* 所示。要重新激活被阻止的开发者账户，请选择 **Activate**。如果我们想删除现有活动用户，则选择\
  \ **Delete**。\n\n这些选项显示在以下屏幕截图中：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_40_0.png)\n\
  \n图 2.9 – 在 Azure API Management 中阻止或删除开发者账户\n\n用户与一个组相关联。组用于为每个开发者提供产品可见性管理。API\
  \ Management 具有以下不可变的系统组：\n\n- **Administrators：** Azure 订阅管理员是该组的成员。管理员管理 API Management\
  \ 服务实例。他们创建开发者使用的 API、操作和产品。\n- **Developers：** 该组面向使用 API 构建应用的已认证开发者门户用户。他们可以访问开发者门户，并能够构建调用\
  \ API 操作的应用。\n- **Guests：** 开发者门户的未认证用户，例如访问 API Management 实例开发者门户的潜在客户，属于该组。管理员可以授予他们只读访问权限，例如查看\
  \ API 而不调用它们。\n\n管理员可以创建自定义组或在 Azure Active Directory 租户中使用外部组。\n\n## 产品\n\n产品是\
  \ API Management 中一个或多个 API 的集合，并配置了标题、描述以及使用条款和访问限制：开放或受保护。开放和受保护的唯一区别是，受保护的产品必须在开发者使用或消费前订阅；开放的产品无需订阅即可使用。配置订阅审批是在产品级别本身完成的，需要管理员审批或自动审批。\n\
  \n![](img/66aceec30d3e7dead2f71bb68a887688_41_0.png)\n\n图 2.10 – Azure API Management\
  \ 中的产品\n\n允许 Azure 门户通过配置修改 API 行为的最强大的 API Management 功能之一是 **policies**。\n\n策略呈现了一组语句列表，可以按顺序在\
  \ API 的请求或响应上执行。最著名的声明包括从 XML 到 JSON 的格式转换。\n\n## 创建和发布产品\n\n在 Azure API Management\
  \ 中，产品包含一个或多个 API、使用配额和服务条款。一旦产品发布，开发者就可以订阅并开始使用这些 API。\n\n要创建和发布产品，您需要按照以下步骤操作：\n\
  \n- 1. 登录 Azure 门户并导航到您的 API Management 实例。\n- 2. 在左侧导航窗格中，选择 **Products**；之后，选择\
  \ + **Add** 按钮。\n\n3. 在 **Add product** 窗口中，填写字段，如以下屏幕截图所示，以创建您的产品：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_42_0.png)\n\
  \n图 2.11 – 添加产品 第 1 部分\n\n如果我们向下滚动 **Add product** 窗口，将看到以下屏幕截图所示的内容。我们需要填写更多信息并选择复选框以定义产品是否可以发布等：\n\
  \n### Add product\n\nAPI Management service\n\nHome > apicollectionpackt >\n\nPublished\n\
  \nRequires subscription\n\nRequires approval\n\nSubscription count limit\n\n2000\n\
  \nLegal terms\n\nYou can include the terms of use for the product which subscribers\
  \ must accept in order to use the product.\n\nAPIs\n\nCreate\n\n图 2.12 – 添加产品 第\
  \ 2 部分\n\n如果选中 **Published**，产品将被发布，此产品中的 API 可以被调用；否则，未发布产品仅对 Administrators 组可见。\n\
