  \ CNAME，然后在 Azure 中注册该名称并添加它。\n\n有两种选择可以执行此操作：\n\n- 第一个选项包括设置自定义域名。\n- 第二个选项包括使用子域名。当您的存储帐户迁移到自定义域名时，不会出现停机。\n\
