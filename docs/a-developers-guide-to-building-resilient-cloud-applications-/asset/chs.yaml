  \n## 探索 Azure Table Storage\n\nAzure Table Storage 提供对结构化数据存储的支持。它实现了一个 NoSQL 键值模型，这意味着它没有任何关系、存储过程、二级索引或外键的概念。\n\
  \nAzure Table Storage 并不是您用于处理半结构化数据的唯一服务。那么，为什么使用此服务而不是其他选项？让我们先列出其优点：\n\n- Azure\
  \ Table Storage 可以以低成本存储 PB 级数据，这对于构建高度可扩展的应用程序非常重要，其中成千上万甚至数百万用户与其交互。\n- Azure\
  \ Table Storage 还支持灵活的数据模式，这对于灵活的数据集（如 Web 应用程序、用户数据、设备信息和元数据）非常出色。灵活的数据模式允许您修改应用程序数据模型，而无需遵循特定模式。\n\
  - 您还可以通过使用聚集索引快速查询数据。聚集索引定义了数据在表中物理存储的顺序，在性能方面非常出色。但除了 Azure Table Storage 中的聚集索引之外，还可以执行基于\
  \ Open Data 的查询（Odata 查询），并且通过使用这些查询，您可以直接从 URL 路径定义查询选项。\n- 使用 Azure Table Storage\
  \ 很简单，因为您可以从 Azure Storage Explorer 操作数据，也可以直接从 .NET 或 .NET Core 应用程序使用 Azure Tables\
  \ 客户端库 for .NET 操作数据。您可以在此链接查看：https://github.com/Azure/azure-sdk-for-net/blob/main/sdk/tables/Azure.Data.Tables/README.md。\n\
  \n在下面的图表中，我们可以看到一个键，它是唯一的，用于标识存储的项目，以及一个值，它是一组字段：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_185_0.png)\n\
  \n图 8.6 – Azure Table Storage 中的键值\n\nAzure Table Storage 内部是如何工作的？它将表拆分为一组分区，这有助于快速访问数据。此机制将具有公共属性或分区键的相关行分组在一起。共享相同分区键的行将存储在同一位置。\n\
  \n在这些 Azure Table Storage 账户内部，我们可以拥有表。表始终表示行集合或单行。没有要求为特定表定义模式，这意味着您可以在同一表中存储具有不同属性的数据。因此，我们说在存储账户内部，我们有表。现在，在表内部，我们有行，而行是一组具有单个属性或多个属性的数据。行类似于\
  \ SQL 数据库中的数据库行。\n\n分区可以通过添加或删除行来更新。表包含任意数量的分区。\n\nAzure Table Storage 表中的键包含两个元素：分区键和行键。分区键被视为已标识，行键在同一分区中是唯一的。\n\
