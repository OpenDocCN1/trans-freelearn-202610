- '## 使用 Azure SQL 数据库


  在本章中，我们将学习如何预配和部署 Azure SQL 数据库和 Azure SQL 托管实例。我们还将学习在执行迁移到 SQL 平台即服务（PaaS）平台时，如何从多个选项中做出选择。一个
  Web API 会将数据存储在 Azure SQL 数据库上。


  在本章中，我们将涵盖以下主要主题：


  - 探索在 Azure 中部署 SQL Server 的 PaaS 选项

  - 练习 1 – 部署单一 SQL 数据库

  - 练习 2 – 部署 Azure SQL 数据库弹性池

  - 练习 3 – 部署 SQL 托管实例

  - 练习 4 – 将 Azure SQL 数据库连接到 ASP.NET 应用


  ### 探索在 Azure 中部署 SQL Server 的 PaaS 选项


  在本节中，我们将了解在 Azure 中部署 SQL Server 的不同 PaaS 选项。如果我们将 SQL Server 用作关系数据库管理系统（RDBMS），我们希望在不进行任何转换的情况下迁移数据库，并且无需考虑重新安装
  SQL Server 并再次配置它。Azure 提供了一种 PaaS，它为面向云的应用程序提供了完整的开发和部署环境，易于使用。


  Azure 中有多个 SQL Server 选项，例如 Azure 虚拟机上的 SQL Server 或 SQL 托管实例。


  ## Azure SQL 数据库


  Azure SQL 数据库是 Azure 中的托管 SQL 数据库服务。它运行在 SQL Server 数据库引擎上。Azure SQL 数据库与传统 SQL
  服务之间存在一些重要差异。但大多数使用 SQL Server 的数据库管理员都可以迁移到 Azure SQL 数据库。Azure SQL 数据库使扩展数据库变得极其容易。我们能够在全球其他一个或多个位置复制数据库，如果您的应用程序在全球范围内使用，这可以提高性能。


  Azure SQL 数据库不仅可作为 PaaS 使用，也可作为无服务器服务使用。它们之间的区别在于，PaaS 选项要求您选择性能级别，并且您需要按小时支付固定费率来访问数据库。您可以通过在
  Azure 门户中选择选项，轻松扩展到更大或更小的性能计划，而不会对应用程序或用户造成中断。无服务器选项允许您仅为使用量付费。实际上，当您不使用数据库时，数据库会关闭。这对于未充分利用的数据库来说非常理想，例如，如果您有一个仅开发人员使用的工具，它需要数据库来运行，但不需要全天候运行，并且可以立即投入使用。Azure
  为 Azure SQL 数据库及其默认配置提供 99.99% 的可靠性。


  Azure 为那些对业务而言是重要资源的数据库提供了高级层。这有时在数据库事务单位（DTU）定价模型中被称为高级层。业务关键型 SQL 数据库使用 SQL 数据库进程集群来响应数据库请求。拥有多个
  SQL 引擎进程使您的数据库更加可靠，因为一个进程的故障不会直接影响您。


  请注意，Azure SLA 在标准层和业务关键层之间不会增长，尽管在实际中您可以预期更高的可用性。但是，您可以通过添加区域冗余部署来进一步提高有保证的正常运行时间
  SLA。您只能进行企业关键型区域冗余部署，这使您的可用性达到 99.995%。区域冗余部署涉及部署数据库的多个副本，这些副本在可用性区域中物理上彼此分离。


  让我们在下一节中了解 Azure SQL 托管实例。


  ## Azure SQL 托管实例


  我们可以使用两种不同的选项将 SQL Server 迁移到 Azure。基础设施即服务（IaaS）允许您创建 Azure SQL Server 虚拟机，而 PaaS
  允许您创建完全托管的 Azure SQL 数据库。还有一个选项位于这两者之间，称为 SQL 托管实例。SQL 托管实例结合了这两种替代方案（PaaS 和 IaaS）的优势。与虚拟机一样，托管实例与本地
  SQL Server 几乎 100% 兼容。这包括 SQL Server 代理支持、临时数据库访问、跨数据库查询、分布式事务和公共语言运行时。这些在完全托管的
  Azure SQL 数据库中不可用。托管实例还支持在同一实例中最多 100 个独立数据库。但与虚拟机不同，托管实例还支持自动备份计划、自动修复和内置高可用性，就像
  Azure SQL 数据库一样。


