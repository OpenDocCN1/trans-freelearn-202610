  - **Service bus queue trigger**：通过侦听消息队列将您的代码连接到其他 Azure 服务或本地服务时使用。

  - **Service bus topic trigger**：用于将您的代码连接到其他 Azure 服务或本地服务。为此，我们将订阅主题。


