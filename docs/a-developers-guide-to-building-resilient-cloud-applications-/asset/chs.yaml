  ## 练习 2 – 部署 Azure SQL 数据库弹性池


  如果我们想要管理和扩展具有各种且不可预测的使用要求的多个数据库，我们将使用 Azure SQL 数据库弹性池。


  池适用于具有特定使用模式的大量数据库。对于给定的数据库，该模式的特点是使用高峰不频繁且平均使用量低。否则，不要将多个数据库在同一弹性池中处于中等持续负载下。


  池通过在弹性作业中运行脚本来简化管理任务。弹性作业消除了与大量数据库相关的繁琐工作。


  池化数据库通常支持与单个数据库相同的业务连续性功能。


  Azure SQL 数据库弹性池是一个简单且经济高效的解决方案。它是一个部署选项，这意味着我们购买 Azure 计算资源 (eDTUs) 和存储资源供所有包含的数据库共享。为什么？因为弹性池中的数据库驻留在单个服务器上并共享固定数量的资源以固定价格。**软件即服务
  (SaaS)** 开发者可以通过利用 Azure SQL 数据库中的弹性池为每个数据库提供性能弹性，在一个明确定义的预算内优化一组数据库的价格性能。在弹性池中，我们能够将数据库添加到池中并根据我们的预算设置数据库的最大和最小资源
  (DTU 或 vCore)。


  我们将按照以下步骤创建 SQL 数据库弹性池：


  - 1. 打开 Azure 门户，选择 **创建资源**，并搜索 `SQL Elastic database pool`。你将看到以下屏幕：


  ![](img/66aceec30d3e7dead2f71bb68a887688_172_0.png)


  图 7.14 – 创建 SQL 弹性数据库池






  2. 在 Basics 选项卡中，填写创建 SQL 弹性池所需的所有信息。在 Project details 下，选择订阅和资源组。在 Elastic pool
  details 下，我们将介绍此池的必需设置，选择一个逻辑服务器，然后配置计算和存储资源。我们有以下屏幕来添加弹性池名称和服务器：


  ## Elastic pool details


  输入此池的必需设置，包括选择逻辑服务器和配置计算和存储资源。


  ![](img/66aceec30d3e7dead2f71bb68a887688_173_0.png)


  图 7.15 – SQL 弹性池中的弹性池详细信息


  3. 在 Compute + storage 中，我们需要配置弹性池以选择多个数据库。点击 Configure elastic pool。我们有 Pool settings
  选项卡，其中包含不同的设置，例如服务层、计算硬件和 vCore 数量。我们可以启用弹性池区域冗余。在 Databases 选项卡中，我们将添加数据库。点击 Add
  databases。另一个窗口将被显示，其中将包含所有单数据库。您可以选择一个或多个数据库添加到弹性池中。它们将共享相同的计算资源：


  ![](img/66aceec30d3e7dead2f71bb68a887688_173_1.png)


  图 7.16 – 向弹性池添加数据库


  4. 点击 Apply，然后选择 Review + create，然后点击 Create，弹性池将被创建。


  5. 创建后，选择 Go to resource，在 Overview 中，我们可以检查资源消耗并识别哪个数据库消耗了最多的资源。这是一个监控工具，可帮助我们对每个数据库的性能问题进行诊断。我们还可以使用
  Monitoring 功能，在 Database Resource Utilization 下，显示池中每个数据库的性能。


  6. 我们也可以通过选择 Configure 来配置我们的弹性池：


  ![](img/66aceec30d3e7dead2f71bb68a887688_174_0.png)


  图 7.17 – 配置弹性池


  7. 如果我们需要通过增加或减少分配的资源来更新弹性池配置，我们可以调整池大小、服务层或每个数据库的资源。我们可以添加或删除池内的数据库：


  ![](img/66aceec30d3e7dead2f71bb68a887688_174_1.png)


  图 7.18 – 弹性池中的池设置


