- "## 前言\n\n2020 年 3 月 11 日，世界卫生组织在全球 COVID-19 爆发中正式宣布大流行。随着世界进入封锁，企业必须迅速转变并利用创新方式继续运营。我们见证了各行各业的组织采用创造性技术。许多零售企业在被要求关闭门店或限制店内顾客数量时提供了在线订购和路边取货服务。\n\
  \n当超市货架空空如也且难以补货时，餐馆也利用其直接供应商为客户提供包括农产品、乳制品和生肉在内的杂货套装。健身房提供在线虚拟课程以保持会员活跃和参与。医生为患者提供在线虚拟预约。传统上要求员工到场的办公室转向使用\
  \ Microsoft Teams 等协作工具实现远程办公。他们有什么共同点？他们都利用了云服务。\n\n在疫情期间的首次财报电话会议上，微软首席执行官 Satya\
  \ Nadella 表示：“我们见证了两年数字转型的成果在两个月内完成。” 启用远程办公、加速向云的数字化转型以及构建创新解决方案使组织不仅得以生存，而且得以蓬勃发展。\n\
  \n三年后，世界已缓慢恢复到一种新常态——一种混合世界，既参与在线体验，也参与面对面体验。然而，组织并未放缓脚步。他们正在加速其数字化转型和应用现代化计划。Gartner\
  \ 预测，到 2025 年云支出将继续增长，企业组织将继续投资其向云的转变。我在日常工作中亲眼目睹了这一点，我领导着一个云解决方案架构师团队，帮助组织在 Azure\
  \ 上实现现代化并进行创新。\n\n这对你意味着什么，无论你是架构师、开发者、学生还是有志于技术的专业人士？随着对云原生技能的需求持续增长，现在是学习这些关键开发技能的时候，否则你可能会被落下。在\
  \ LinkedIn 上简单搜索“云原生”职位就会产生数千个结果。这是一项需求旺盛的技能，可作为职业加速器。你已经通过购买 Hamida 的这本书迈出了第一步，这对你来说是一项明智的投资。\n\
  \nHamida 凭借多年在 Azure 上开发云原生解决方案的经验，将她的专业知识提炼于此。这是一份全面的资源，超越了“什么是云原生应用开发？”这个问题。这不是另一本关于容器和编排服务的书籍。Hamida\
  \ 为你提供了“如何做”。她提供了构建端到端云原生应用的路线图，从开发到部署。\n\n你将带着准备好将这些页面中学到的所有内容付诸实践。你将更深入地了解使用哪种云服务、为什么以及它如何结合起来创建和部署可扩展、可靠、高可用的应用。\n\
  \n祝你在旅程中好运！\n\nLori Lalonde\n\n微软高级云解决方案架构师经理\n\n## 贡献者\n\n### 关于作者\n\n**Hamida\
