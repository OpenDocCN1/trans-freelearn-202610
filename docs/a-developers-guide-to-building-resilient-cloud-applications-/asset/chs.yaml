  \ https://learn.microsoft.com/en-us/azure/event-grid/scripts/event-grid-cli-subscribe-custom-topic\n\
  \n以下屏幕截图展示了 Basic 选项卡中的端点详细信息：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_70_0.png)\n\
  \nFigure 3.9 – Create Event Subscription – the Basic tab part 2\n\n到目前为止，我们已创建了\
  \ Event Grid 主题和订阅。接下来，我们将学习如何使用 .NET 控制台应用程序向 Event Grid 主题发布新事件。\n\n## Create\
  \ a .NET Console project\n\n要创建新的 .NET 控制台项目，我们可以使用两种集成开发环境（IDE）之一：Visual Studio\
  \ Code 或 Visual Studio 2022。\n\n### Using Visual Studio Code\n\n在 Visual Studio\
  \ Code 中，打开集成终端。接下来，运行以下命令在当前文件夹中创建一个名为 EventPublisherSample 的新 .NET 项目：\n\n```\n\
  dotnet new console -name EventPublisherSample -output .\n```\n\n让我们从 NuGet 导入 Azure.Messaging.EventGrid\
  \ 的最新版本，在我们的示例中为版本 4.10.0，并运行以下命令：\n\n```\ndotnet add package Azure.Messaging.EventGrid\
  \ -version 4.10.0\n```\n\n要构建应用程序，我们使用以下命令：\n\n```\ndotnet build\n```\n\n### Using\
  \ Visual Studio 2022\n\n我们选择 **Create a new project**，然后搜索 `console` 模板。我们将项目命名为\
  \ EventPublisherSample 并选择最新的 .NET 框架：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_71_0.png)\n\
  \nFigure 3.10 – Create a new project – Console App\n\n让我们从 NuGet 导入 Azure.Messaging.EventGrid\
  \ 的最新版本。在我们的示例中，它是版本 4.10.0。我们通过右键单击 **Dependencies**，然后选择 **Manage NuGet Packages**，并通过\
  \ NuGet 安装 Azure.Messaging.EventGrid 来使用 NuGet，如以下屏幕截图所示：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_71_1.png)\n\
  \nFigure 3.11 – Import Azure.Messenging.EventGrid\n\n添加包后，我们将在下一节中更新 Program 类。\n\
  \n## Making some modifications to the Program class to be able to connect to Event\
  \ Grid\n\n我们将在以下步骤中继续使用 Visual Studio 2022（我们也可以使用 Visual Studio Code）：\n\n- 1.\
  \ 打开 Program.cs 文件。\n- 2. 导入 Azure 和 Azure.Messaging.EventGrid 命名空间（https://www.nuget.org/packages/Azure.Messaging.EventGrid/）从之前从\
  \ NuGet 导入的 Azure.Messaging.EventGrid 包，使用以下代码行：\n- 3. 检查 Program.cs 文件中的整个源代码：\n\
  \n```\nusing Azure;\nusing Azure.Messaging.EventGrid;\n```\n\n```\nusing System;\n\
  using System.Threading.Tasks;\nusing Azure;\nusing Azure.Messaging.EventGrid;\n\
  public class Program\n{\n    private const string topicEndpoint = \"<topic-endpoint>\"\
  ;\n    private const string topicKey = \"<topic-key>\";\n    public static async\
  \ Task Main(string[] args)\n    {\n    }\n}\n```\n\n我们添加了 System 和 System.Threading.Tasks\
  \ 包，这些包将用于异步方法。\n\n在代码中，我们添加了一个 Program 类，其中包含两个私有属性和一个静态异步方法。\n\n第一个属性是 topicEndpoint\
  \ 字符串常量，其中包含 Event Grid 端点值。第二个属性是 topicKey 字符串常量，其中包含 Event Grid 主题密钥值。\n\n我们可以通过转到\
  \ Event Grid Topic 刀片，选择左侧菜单中的 Overview，并查看 Topic Endpoint 条目来找到这些凭据：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_73_0.png)\n\
  \nFigure 3.12 – Topic Endpoint\n\n主题密钥是通过在设置标题下选择左侧菜单中的 Access keys 获得的。我们需要选择并复制\
  \ Key 1 文本框中的链接。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_73_1.png)\n\nFigure\
  \ 3.13 – Topic key\n\n在下一节中，我们将发布新事件。\n\n## Publishing new events\n\n在 Program.cs\
  \ 文件中，在空的主方法中，我们将创建一个名为 credential 的新变量，它将使用 topicKey，并创建另一个名为 client 的变量，它将在构造函数中使用\
  \ endpoint 和 credential 变量作为参数。因此，我们将在主方法中添加以下代码行：\n\n```\nvar endpoint = new Uri(topicEndpoint);\n\
  var credential = new AzureKeyCredential(topicKey);\n```\n\n```\nvar client = new\
  \ EventGridPublisherClient(endpoint,\ncredential);\n```\n\n我们添加以下源代码来创建一个新的 event1\
  \ 变量并使用示例数据填充该变量：\n\n```\nvar event1= new EventGridEvent(\n    subject: $\"New Patient:\
  \ Hamida Rebai\",\n    eventType: \"Patients.Registration.New\",\n    dataVersion:\
  \ \"1.0\",\n    data: new\n    {\n        FullName = \"Hamida Rebai\",\n       \
  \ Address = \"Quebec, G2C0L6\"\n    }\n);\n```\n\n接下来，我们添加 event2 变量：\n\n```\nvar\
  \ event2 = new EventGridEvent(\n    subject: $\"New Patient: Mohamed Trabelsi\"\
  ,\n    eventType: \"Patients.Registration.New\",\n    dataVersion: \"1.0\",\n  \
  \  data: new\n    {\n        FullName = \"Mohamed Trabelsi\",\n        Address =\
  \ \"Quebec, G1X3Z2\"\n    }\n);\n```\n\n之后，我们将添加以下代码行来调用 EventGridPublisherClient.SendEventAsync\
  \ 方法，并在以下源代码中查看如何将每条事件的消息渲染到控制台：\n\n```\nawait client.SendEventAsync(event1);\n\
  Console.WriteLine(\"This is the first event published\");\nawait client.SendEventAsync(event2);\n\
  Console.WriteLine(\"This is the second event published\");\n```\n\n让我们运行我们的应用程序并在\
  \ Azure Event Grid 查看器 Web 应用程序中观察结果：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_75_0.png)\n\
  \nFigure 3.14 – Console App output for published events\n\n在以下屏幕截图中，我们展示了发布在 Azure\
  \ App Service 上的 **Azure Event Grid Viewer**：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_75_1.png)\n\
  \nFigure 15 – Azure Event Grid viewer result\n\n为了总结本次练习，我们在控制台应用程序中使用了静态数据，但在现实生活中，此数据可以由另一个应用程序（Web\
  \ 或移动）或任何 **software as a service (SaaS)** 解决方案提供。对于我们的用例，此数据来自 Web 和移动应用程序，每次新注册都将发送到\
  \ Event Grid 以供另一系统验证。\n\n\n\n\n\n## 探索 Azure 消息队列\n\nMicrosoft Azure Service Bus\
  \ 是一个完全托管的企业集成消息代理。Service Bus 中包含了一些常见的消息场景，例如在传输数据时进行消息传递或解耦应用程序以提高其可靠性和可扩展性，以及通过实现需要消息排序的工作流来提供消息会话，例如主题和订阅。\n\
  \nAzure 支持以下两种类型的队列机制：\n\n- Queue Storage 是一个用于存储大量消息的简单消息队列服务\n- Service Bus 队列是更广泛的消息服务集的一部分，支持排队、发布/订阅和高级集成模式\n\
  \nAzure Queue Storage 是一个用于发送和接收消息的服务，但也用于存储大量消息；一个队列消息的大小可达 64 KB。\n\n## 练习 2 –\
  \ 创建 Azure Service Bus 命名空间和队列\n\n在本练习中，我们将执行以下操作：\n\n- 创建一个 Azure Service Bus 命名空间\n\
  - 创建一个 Azure Service Bus 队列\n\n队列可以通过 Azure 门户的交互式界面、使用 PowerShell 或 Azure CLI 的命令行，或使用资源管理器模板来创建。我们在这里只介绍前两种方法：Azure\
  \ 门户和 Azure CLI。\n\n### 使用 Azure 门户\n\n让我们打开 Azure 门户并选择 **All services**。在 **Integration**\
  \ 类别中，我们可以找到 **Service Bus** 资源：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_77_0.png)\n\
  \n图 3.16 – 使用 Azure 门户创建 Service Bus\n\n在填写完创建命名空间所需的配置后，该命名空间将包含队列之后，我们点击 **+ Create**\
  \ 或选择 **Create service bus namespace**：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_77_1.png)\n\
  \n图 3.17 – 使用 Azure 门户创建命名空间\n\n在 **Basics** 选项卡中，我们有以下界面：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_78_0.png)\n\
  \n图 3.18 – 创建 Service Bus 命名空间\n\n如果在 **Pricing tier** 字段中选择 **Basic**，请注意您将无法创建\
  \ **Topics**，只能创建 **Queues**，如下图所示：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_79_0.png)\n\
  \n在 **Networking** 选项卡中，您可以保留公共访问的连接方法的默认值，或者如果您已配置登陆区，则可以选择您的私有访问。在登陆区中，您配置您的账户、安全治理、网络和身份。\n\
  \n我们将选择 **Review + create** 然后选择 **Create**，Service Bus 命名空间将被创建。\n\n完成后，我们将在门户中创建一个队列。让我们打开\
  \ Service Bus 命名空间并从左侧菜单中选择 **Overview**。接下来，在屏幕顶部选择 **+ Queue** 并填写创建队列所需的所有信息，包括名称、队列最大大小、最大投递次数、消息生存时间（天、小时、分钟和秒）、锁定持续时间（天、小时、分钟和秒）。此外，我们需要启用以下选项：\n\
  \n- Auto-delete on idle queue\n- Duplicate detection\n- Dead lettering on message\
  \ expiration\n- Partitioning\n- Sessions\n\n我们可以启用将消息转发到队列和主题：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_80_0.png)\n\
  \n图 3.20 – 创建队列\n\n我们使用 Azure 门户创建了 Azure Service Bus 命名空间和队列。在下一节中，我们将了解如何使用 Azure\
  \ CLI 来完成此操作。\n\n### 使用 Azure CLI\n\n首先，如果尚未存在，我们需要创建一个资源组：\n\n```\nAz group create\
  \ --name packrg --location eastus\n```\n\n消息队列使用命名空间，因此我们需要创建一个命名空间：\n\n```\nAz\
  \ servicebus namespace create --resource-group packrg --name appointmentQueue --location\
  \ eastus\n```\n\n接下来，使用以下命令创建队列：\n\n```\naz servicebus queue create --resource-group\
  \ packrg --namespace-name appointmentQueue --name myqueue\n```\n\n要检查消息队列是否已成功创建，您可以在门户中检查或运行以下命令行：\n\
  \n```\naz servicebus queue list -resource-group packrg -namespace-name appointmentQueue\n\
  ```\n\n在下面的屏幕截图中，我们可以看到不同的 Service Bus 队列：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_81_0.png)\n\
  \n图 3.21 – Service Bus 队列\n\n我们演示了两种不同的方法来创建 Azure Service Bus 命名空间和队列 – Azure CLI\
  \ 和 Azure 门户。在下一个练习中，我们将使用应用程序将消息发布到 Service Bus 队列。\n\n## 练习 3 – 使用 .NET Core 应用程序将消息发布到\
  \ Service Bus 队列\n\n我们之前创建了 Azure Service Bus 队列。现在，我们将开始使用 .NET Core 控制台应用程序从 Azure\
