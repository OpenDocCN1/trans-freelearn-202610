  \n如果选中 **Requires approval**，管理员将审查并接受或拒绝对此产品的订阅尝试，否则订阅尝试将自动批准。\n\n**Subscription\
  \ count limit** 对同时订阅数量施加限制，是可选的。\n\n在 **APIs** 下，我们可以选择一个或多个 API 将其添加到要创建的产品中。这是可选的，因为您也可以在创建产品后添加\
  \ API。\n\n- 4. 最后，选择 **Create** 以创建您的新产品。\n\n一旦新产品创建完成，它就可以被开发者或任何应用使用。\n\n\n\n\n\
  \n## 保护 API\n\n通过 API 管理发布 API 时，使用订阅密钥来保护对这些 API 的访问。开发人员在调用 API 时必须在 HTTP 请求中包含有效的订阅密钥；否则，这些调用将被\
  \ API 管理网关拒绝。然而，到后端的传输并不安全。\n\n如果开发人员想要使用已发布的 API，则需要订阅。想要使用已发布 API 的开发人员在调用这些 API\
  \ 时，必须在 HTTP 请求中包含有效的订阅密钥。没有有效的订阅密钥，这些调用会被 API 管理网关立即拒绝，或者不会被转发到后端服务。他们无需 API 发布者批准即可获得订阅，尽管\
  \ API 发布者甚至可以直接为 API 消费者创建订阅。\n\nAzure API 管理服务支持多种 API 访问安全机制，例如 OAuth 2.0、客户端证书和\
  \ IP 允许列表。\n\n### 订阅和密钥\n\n订阅密钥是唯一的自动生成的密钥。此密钥可以通过客户端请求的标头或作为查询字符串参数传递。\n\n订阅提供对授权和策略的全面而详细的控制。密钥直接与订阅关联，并且可以扩展到不同的域。\n\
  \n每个应用程序在调用受保护的 API 时，必须在每个请求中包含密钥。\n\n如果我们想与另一个授权用户共享密钥，则订阅密钥的重新生成既简单又可行。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_44_0.png)\n\
  \n图 2.13 – Azure API 管理中的订阅\n\n前面的截图显示，一个订阅有两个密钥：主密钥和辅助密钥，这使得重新生成更容易。例如，在修改主密钥的情况下，为了避免停机，您可以在应用程序中使用辅助密钥。\n\
  \n回到已经包含我们 API 并启用了订阅的产品，每个客户在产品 API 调用期间必须提供密钥。\n\n开发人员将提交订阅请求以获取密钥。如果此请求获得批准，则订阅密钥将以安全（加密）的方式发送。\n\
  \n### 使用订阅密钥调用 API 的过程\n\n默认标头名称是 `Ocp-Apim-Subscription-Key`，默认查询字符串是 `subscription-key`。调用受订阅保护的\
  \ API 端点的应用程序必须在其所有 HTTP 请求中包含有效的密钥，可以在请求标头中，也可以作为 URL 中的查询字符串。\n\n如果我们想测试 API 调用，可以使用开发人员门户或命令行工具，例如\
  \ cURL。\n\n查看此示例，使用 cURL 在请求标头中传递密钥：\n\n```bash\ncurl --header \"Ocp-Apim-Subscription-Key:\
  \ <your key string>\"\nhttps://<yourapim gateway>.azure-api.net/api/path\n```\n\n\
  下面是另一个 cURL 命令示例，它在 URL 中传递密钥作为查询字符串：\n\n```bash\ncurl https://<yourapim gateway>.azure-api.net/api/path?subscription-key=<keystring>\n\
  ```\n\n如果由于任何原因未在请求标头或 URL 的查询字符串中传递密钥，将从 API 网关收到 `401 Access Denied` 响应。\n\n###\
  \ 使用证书保护 API\n\n在上一节中，我们使用了密钥，但我们也可以使用证书在客户端和 API 网关之间提供传输层安全性（TLS）相互认证。\n\n我们必须将\
  \ API 管理网关配置为只允许包含特定指纹的证书请求。网关级别的授权通过入站策略处理。\n\n证书可以包含以下属性：\n\n- **证书颁发机构（CA）：**\
  \ API 只允许由特定 CA 签名的证书。\n- **指纹：** API 只允许包含指定指纹的证书。\n- **主题：** API 允许特定主题（证书中提及）。\n\
  - **过期日期：** API 只允许尚未过期且仍然有效的证书。\n\n#### 在消耗层中接受客户端证书\n\n如果您使用无服务器技术（如 Azure Functions）构建\
  \ API，则 API 管理中的消耗层旨在满足无服务器设计原则。\n\n您必须显式启用消耗层的客户端证书使用，这可以在**自定义域**页面上完成。\n\n自定义域是我们可以从提供商处购买的域或子域，用于个人或专业目的（例如，`yourdomain.com`\
  \ 或 `pages.yourdomain.com`）。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_46_0.png)\n\
  \n在前面的截图中，我们可以看到我们能够添加一个或多个客户端证书。我们可以通过选择**是**来启用请求客户端证书。接下来，我们将创建策略。\n\n#### 证书授权策略\n\
  \n有以下不同的授权策略：\n\n- 调用 API 管理 API 时执行入站策略。\n- API 管理调用后端 API 时执行后端策略。\n- API 管理向调用方返回响应时执行出站策略。\n\
  \n### 使用 Azure 门户\n\n我们将使用以下链接打开 Azure 门户：https://portal.azure.com/，然后按照以下步骤操作：\n\
  \n1. 在主页上选择**创建资源**。\n2. 在**创建资源**页面上，选择**集成**，然后选择**API 管理**。\n3. 在**安装 API 管理网关**页面上，输入请求的各种设置。以下截图显示了**项目详细信息**和**实例详细信息**部分：\n\
  \n![](img/66aceec30d3e7dead2f71bb68a887688_48_0.png)\n\n图 2.16 – 创建 API 管理实例（第 1\
  \ 部分）\n\n在**项目详细信息**部分，我们需要选择**订阅**字段，并选择**资源组**字段或创建一个新资源组。\n\n在**实例详细信息**部分，我们将指定**区域**字段并输入**资源名称**字段。这是您的\
  \ API 管理服务的唯一名称，创建后无法修改。将按如下方式生成默认域名：`<ResourceName>.azure-api.net`。但是，我们可以配置域名来更改它。\n\
  \n如果我们向下滚动前面截图中显示的窗口，我们会看到需要完成**组织名称**和**管理员电子邮件**字段，并从**定价层**字段中选择一个选项。如下面的截图所示：\n\
  \n> **安装 API 管理网关**\n> API 管理服务\n> 主页 > 创建资源\n>\n> **组织名称** *\n> 输入组织名称\n>\n> **管理员电子邮件**\
  \ *\n> 输入管理员电子邮件\n>\n> **定价层**\n> API 管理定价层因每单位计算容量和提供的功能集而异——例如，对虚拟网络、多区域部署或自托管网关的支持。若要容纳更多\
  \ API 请求，请考虑改为添加 API 管理服务单元。了解详细信息\n>\n> API 管理的开发人员层不包含 SLA，不应用于生产目的。您的服务可能会遭遇间歇性中断，例如在升级期间。了解详细信息\n\
  >\n> **定价层：** 开发人员（无 SLA）\n>\n> **查看 + 创建**\n>\n> < 上一步 | 下一步：监控 >\n\n图 2.17 – 创建\
  \ API 管理实例（第 2 部分）\n\n> **重要说明：** 在此层中创建和启用 API 管理服务可能需要 30-40 分钟。之后，您可以将服务固定到仪表板，以便快速找到它。\n\
  \n\n\n\n\n我们使用 Azure 门户创建了一个 API 管理服务。这是一种交互式方法，但如果你喜欢使用命令行，可以使用 Azure Cloud Shell。我们将在下一节学习关于它的内容。\n\
  \n## 使用 Azure Cloud Shell\n\nAzure Cloud Shell 是一个基于浏览器的交互式、已授权 shell，用于管理 Azure\
  \ 资源。它为你提供了使用 Bash 或 PowerShell 作为 shell 体验的选项，具体取决于你的操作方式：\n\n- 1. 登录到 Azure 门户并打开\
  \ Cloud Shell。\n\n  ![](img/66aceec30d3e7dead2f71bb68a887688_50_0.png)\n\n  图 2.18\
  \ – Azure Cloud Shell\n\n  当 Cloud Shell 门户打开时，你有两个选项：PowerShell 或 Bash。我们将选择 Bash\
  \ 环境：\n\n  ![](img/66aceec30d3e7dead2f71bb68a887688_50_1.png)\n\n  图 2.19 – 使用 Bash\
  \ 环境的 Azure Cloud Shell\n\n- 2. 我们将定义变量以便在命令行界面 (CLI) 命令中使用。在以下代码片段中，我们仅定义了 API\
  \ 管理实例的名称、位置和电子邮件地址：\n\n  ```bash\n  $ myApiName=apicollectionpackt\n  $ myLocation=EastUS2\n\
  \  $ myEmail=rebai.hamida@gmail.com\n  ```\n\n- 3. 我们将创建一个资源组。以下命令将创建一个名为 packtbookrg\
  \ 的资源组：\n\n  ```bash\n  $ az group create --name packtbookrg --location $myLocation\n\
  \  ```\n\n- 4. 我们将创建一个 API 管理实例。`az apim create` 命令用于创建实例。`--sku-name Consumption`\
  \ 选项在我们的案例中仅用于加快演练过程，但我们可以使用任何库存保持单位 (SKU)（定价层）：\n\n  ```bash\n  $ az apim create\
  \ -n $myApiName \\\n  --location $myLocation \\\n  --publisher-email $myEmail \\\
  \n  --resource-group packtbookrg \\\n  --publisher-name First-APIM-Exercise \\\n\
  \  --sku-name Consumption\n  ```\n\n**重要说明**\n操作大约需要 5 分钟完成。\n\n创建 API 管理服务后，我们将在下一节导入并发布\
  \ API。\n\n## 导入 API\n\n本节向你展示如何导入和发布 OpenAPI 规范后端 API（以前称为 Swagger 规范）。\n\n在本节中，你将了解我们在示例中使用的最小\
  \ Web API。\n\n### 最小 Web API 简介\n\n这是一种构建 API 的新方法，无需模型-视图-控制器 (MVC) 的复杂结构，且名称上是最小的。它包含构建\
  \ HTTP API 所需的基本组件。你只需要 csproj 和 program.cs。\n\n使用最小 Web API 的好处如下：\n\n- 它比使用 ASP.NET\
  \ Web API 更简单\n- 它易于学习和使用\n- 你不需要 MVC 结构 – 无需控制器！\n- 它只需最少的代码即可构建和编译应用程序，这意味着应用程序运行速度更快，因此性能更好\n\
  - 它具有 .NET 6 和 C# 10 的最新改进和功能\n\n### 使用 Visual Studio 2022 创建最小 Web API\n\n在本节中，我们将使用\
  \ Visual Studio 2022 创建 ASP.NET Core Web API 应用程序。\n\n按照以下步骤在 Visual Studio 2022\
  \ 中创建最小 Web API：\n\n- 1. 打开 Visual Studio 2022 并选择 **Create a new project**。\n-\
  \ 2. 选择 **ASP.NET Core Web API** 项目模板：\n\n  ![](img/66aceec30d3e7dead2f71bb68a887688_52_0.png)\n\
  \n  图 2.20 – ASP.NET Core Web API 模板\n\n- 3. 禁用 **Use controllers (uncheck to use\
  \ minimal APIs)** 以便能够使用最小 API。\n\n  ![](img/66aceec30d3e7dead2f71bb68a887688_52_1.png)\n\
  \n  图 2.21 – 在 Visual Studio 2022 中启用最小 API\n\n- 4. 当项目创建完成后，打开 program.cs 查看 API\
  \ 实现：\n\n  ```csharp\n  app.MapGet(\"/weatherforecast\", (HttpContext httpContext)\
  \ =>\n  {\n      var forecast = Enumerable.Range(1, 5).Select(index =>\n       \
  \   new WeatherForecast\n          {\n              Date = DateTime.Now.AddDays(index),\n\
  \              TemperatureC = Random.Shared.Next(-20, 55),\n              Summary\
  \ = summaries[Random.Shared.Next(summaries.Length)]\n          })\n          .ToArray();\n\
  \      return forecast;\n  })\n  .WithName(\"GetWeatherForecast\");\n  ```\n\n \
  \ 图 2.22 – Program.cs 中的最小 API 示例\n\n在探索了最小 Web API 后，我们将在下一节学习如何将其导入 API 管理服务。\n\
  \n### 将 API 导入 API 管理\n\n让我们查看将 API 导入 API 管理的步骤：\n\n- 1. 在 Azure 门户中搜索并选择 API 管理服务。\n\
  - 2. 接下来，在 API 管理窗口中，选择你已创建的 API 管理实例。\n- 3. 在 API 管理服务导航窗格中选择 APIs。\n\n  ![](img/66aceec30d3e7dead2f71bb68a887688_53_0.png)\n\
  \n  图 2.23 – API 管理中的 APIs\n\n- 4. 从列表中选择 OpenAPI。之后，我们将在弹出窗口中选择 Full：\n\n  ![](img/66aceec30d3e7dead2f71bb68a887688_54_0.png)\n\
  \n  图 2.24 – 选择 OpenAPI\n\n我们需要在“Create from OpenAPI specification”弹出窗口中填写所有所需信息：\n\
  \n### Create from OpenAPI specification\n\n![](img/66aceec30d3e7dead2f71bb68a887688_55_0.png)\n\
  \n图 2.25 – Create from OpenAPI specification\n\n- 5. 要从 **OpenAPI specification**\
  \ 创建 API，我们需要添加所有配置设置。下表描述了前一个屏幕截图中显示的每个设置：\n\n| 设置 | 描述 |\n|---|---|\n| **OpenAPI\
  \ specification** | 这是指实现 API 的服务。请求将被转发到此地址。一旦输入 URL，表单中大部分所需信息会自动填写。 |\n| **Display\
  \ name** | 配置后，该名称将在开发者门户中显示。 |\n| **Name** | 这是 API 的唯一名称。 |\n| **Description**\
  \ | 这是可选的，用于提供与你的 API 相关的更多信息。 |\n| **API URL suffix** | API 管理通过其后缀区分 API。该后缀对每个\
  \ API 都是唯一的。它将被添加到 API 管理服务的基 URL。 |\n\n点击 **Create** 导入 API。\n\n### 配置后端设置\n\n\
  API 已创建，现在需要指定后端。\n\n我们将选择右侧刀片中的设置并在 **Web service URL** 字段中输入 URL。之后，我们将取消选择 **Subscription\
  \ required** 复选框。\n\n一旦 API 已导入并且后端已配置，就是测试 API 的时候了。在下一节中，我们将学习如何在 Azure API 管理服务中测试我们的\
  \ API。\n\n### 测试 API\n\n我们需要选择 Test 选项卡。在左侧，我们会找到与我们的 API 相关的所有操作。在页面右侧是查询参数和标头（如有）。Ocp-Apim-Subscription-Key\
  \ 会自动填充与此 API 关联的订阅密钥。另一个选择将显示方法列表。我们可以选择一种方法，例如 BillingList，然后点击 Send。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_58_0.png)\n\
  \n图 2.27 – 测试 API\n\n后端响应 200 OK 并返回一些数据。\n\n### HTTP 响应\n\n```http\nHTTP/1.1 200\
  \ OK\ncontent-type: application/json; charset=utf-8\ndate: Sun, 17 Apr 2022 19:00:37\
  \ GMT\nocp-apim-apiid: healthcare-solution-billing-api\n```\n\n图 2.28 – 后端响应 200\
  \ OK\n\n在下一节中，我们将学习如何使用 Azure API 管理来代理公共 API。\n\n## 练习 2 – 使用 Azure API 管理代理公共\
  \ API\n\n当我们设计解决方案以使用一个或多个 API 时，通信在不同服务、系统和脚本之间必须通过 API 进行。在描述这些通信并设计我们的 API 之前，我们必须考虑以下几个要素：\n\
  \n- 路由结构\n- 身份验证和授权\n- 速率限制\n\n使用 Azure API 管理，在数据接收或发送之前，你可以轻松代理现有 API 并修改输入和输出。\n\
  \n在大多数情况下，我们希望修改现有公共 API 的结构、添加身份验证、限制传入请求的数量，甚至缓存获得的结果。这就是本节将要涵盖的内容，我们将发现管理 API\
  \ 和快速使用它的便捷性。\n\n我们可以使用 Azure Logic Apps 代理、Azure App Service 或 Azure Functions\
  \ 应用，但在我们的示例中，我们将使用公共 API。\n\n在本练习中，我们将使用之前导入的 API。\n\n### 导入 OpenAPI 模式以进行代理\n\n\
  Azure API 管理服务将导入的不同格式。\n\n在可用方法列表中，/BillingList 方法以 JSON 格式提供账单明细列表。使用标准 PowerShell\
  \ 查询，如以下代码片段所示，将允许我们通过 API 代理检索结果：\n\n```powershell\n$Result = Invoke-RestMethod\
  \ -URI 'https://healthcarebillingapi.azurewebsites.net/BillingList'\n$Result.data.summary\n\
  ```\n\n开发人员倾向于对返回给他们的输出键进行更改。我们将选择需要修改的方法；之后，我们将在 **Outbound Processing** 中选择相同的方法并选择\
  \ **Add Policy**。之后，选择 **Other policies**，并在 **Transformation policies** 中查找 **Find\
  \ and replace string in body** 选项。\n\n\n\n\n![](img/66aceec30d3e7dead2f71bb68a887688_60_0.png)\n\
  \n图 2.29 – 在正文中查找并替换字符串\n\n我们将按如下方式修改发送回客户端的结果：\n\n```\nfind-and-replace from=\"\
  price_billing\" to=\"price\" />\n```\n\n在出站处理中，我们能够在响应发送到客户端之前对其进行修改。\n\n## 总结\n\
  \n在本章中，我们了解了 API 管理服务的不同组件及其功能。之后，我们重点讨论了 API 网关在管理对我们 API 的调用中的作用。然后，我们学习了如何使用订阅和证书来保护对\
  \ API 的访问。我们创建了一个后端 API，并使用 Azure API 管理来代理公共 API。\n\n在下一章中，我们将学习如何开发基于事件和基于消息的解决方案。我们将探索\
  \ Event Grid、Azure 事件中心和 Azure 消息队列。\n"
- "## 开发基于事件和基于消息的解决方案\n\n在本章中，我们将探索基于事件和基于消息的解决方案的使用。我们将从 Web 应用程序发布和订阅，了解如何使用相同的应用程序从服务总线队列发送和接收消息，发现\
  \ Event Grid 的操作模式以及它如何连接到服务和事件处理程序，并探索 Azure 事件中心。\n\n在本章中，我们将涵盖以下主要内容：\n\n- 探索\
  \ Event Grid 和 Azure 事件中心\n- 练习 1 – 从 .NET 应用向 Event Grid 事件发布和订阅\n- 探索 Azure 消息队列\n\
  - 练习 2 – 创建 Azure 服务总线命名空间和队列\n- 练习 3 – 使用 .NET Core 应用程序向服务总线队列发布消息\n- 练习 4 – 使用\
  \ .NET Core 应用程序从服务总线队列读取消息\n- 练习 5 – 向主题发送消息以及从主题接收消息\n\n### 引言\n\n事件是导致状态发生变化的动作。这种状态变化可以很简单，也可以很复杂，但当状态发生变化时，就被视为一个事件。在事件驱动的架构方法中，消费者*订阅*事件，并能在事件发生时收到通知。这与传统的服务器-客户端模型形成对比，在传统模型中，客户端主动请求一组信息的更新。该模型解决了一个简单的问题——我们如何通知消费者状态变化？基于消息的方法解决了同样的问题，但方式与传统服务器-客户端模型不同。基于消息的方法背后的简单想法是，不要求消费者订阅事件更新，而是各个元素或服务可以拥有包含许多调用的消息队列。这些调用按顺序排列并发送给所有相关方。\n\
  \n总而言之，消息队列不是通过通知让某个事件创建服务，而是接收需要额外处理的事件或输出，然后将其添加到长队列中。\n\n企业组织需要变得事件驱动，并能够实时响应。在事件驱动的架构中，事件用于触发和通信解耦服务，并几乎实时地传递，消费者能够在事件产生时立即响应。\n\
  \n事件可以是状态的变化，也可以是电子商务网站上购物车中某项商品的更新或删除。一系列相关事件代表一种行为或状态。例如，对于已购买的商品，其价格和配送地址，在这种情况下，事件将呈现标识符，例如发送订单已发货的通知。\n\
  \n让我们看一下下面的图示。事件路由器连接不同的服务，并用作发送和接收消息的路由。\n\n当事件生产者生成事件时，事件路由器会将事件作为输入发送给适当的消费者，然后对第一个事件执行响应。我们可以观察到托管服务之间异步处理的事件流，这些服务的结果取决于服务对事件的反应。\n\
  \n![](img/66aceec30d3e7dead2f71bb68a887688_62_0.png)\n\n图 3.1 – 事件驱动架构示例\n\n我们已经了解了基于事件的架构的基本元素。现在我们将继续了解\
  \ **Azure 事件网格**，它使我们能够轻松构建基于事件的架构的应用程序，以及 **Azure 事件中心**，一个可扩展的事件处理服务，允许我们存储和管理事件。\n\
  \n## 探索事件网格和 Azure 事件中心\n\n在本节中，我们将探索事件网格和事件中心的基本元素。\n\n### 事件网格\n\nAzure 事件网格用于轻松构建基于事件的架构的应用程序。\n\
  \n它简单且交互性强。首先，我们选择想要订阅的 Azure 资源，然后指明事件处理程序或我们要将事件发送到的 webhook 端点。\n\n事件网格支持来自 Azure\
  \ 服务的所有事件，例如存储 Blob 和资源组。事件网格还支持使用自定义主题的其他外部事件。\n\n筛选器提供了将特定事件路由到不同端点的能力。我们还可以向多个端点进行多播，以确保事件可靠地流式传输。\n\
  \n![](img/66aceec30d3e7dead2f71bb68a887688_63_0.png)\n\n图 3.2 – 源和处理程序\n\n事件源是事件发生的位置。包括\
  \ Blob 存储、媒体服务、IoT 中心和 Service Bus 在内的多个 Azure 服务会自动配置为发送事件。我们还可以使用自定义应用程序发送事件。请注意，自定义应用程序不需要托管在\
  \ Azure 或云中，即可使用事件网格进行事件分发。\n\n事件处理程序是事件发送到的目标。处理程序会采取进一步的操作来处理事件。多个 Azure 服务（例如\
  \ **Azure Functions**、**逻辑应用**、**队列存储**或任何事件中心）会自动配置为处理事件。我们还可以使用任何 webhook 来处理事件。webhook\
  \ 不需要托管在 Azure 或云中即可处理事件。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_64_0.png)\n\
  \n图 3.3 – 事件网格基本概念\n\n我们将 Azure 事件网格定义为路由来自 Azure 服务的所有事件。事件网格由两个基本元素组成：事件源和事件处理程序。在下一节中，我们将在开始一些练习之前定义事件中心。\n\
  \n### 事件中心\n\nAzure 事件中心是一种可扩展的事件处理服务，用于存储和处理分布式软件和设备产生的大量事件、数据和遥测。它提供了一个低延迟、高可靠性的分布式流处理平台。\n\
  \n## 练习 1 – 从 .NET 应用向 Event Grid 事件发布和订阅\n\n在本练习中，我们可以使用 Visual Studio Code 或 Visual\
  \ Studio 2022 来创建控制台 .NET 应用程序。我们将完成以下步骤：\n\n- 1. 创建事件网格。\n- 2. 创建 .NET 控制台项目。\n\
  - 3. 对程序类进行一些修改，以便能够连接到事件网格。\n- 4. 向事件网格发布新事件。\n\n在下一节中，我们将首先创建一个事件网格主题。\n\n###\
  \ 创建事件网格主题\n\n事件网格主题是相关事件（例如，*存储事件*或*库存事件*）的通道。\n\n事件网格主题提供了源向其发送事件的端点。发布者创建事件网格主题，并决定事件源需要一个主题还是多个主题。主题用于相关事件的集合。订阅者决定订阅哪些主题，以便响应特定类型的事件。\n\
  \n我们将使用 Azure 门户创建事件网格主题，步骤如下：\n\n- 1. 浏览到 Azure 门户（`https://portal.azure.com`），然后使用你的帐户登录。\n\
  - 2. 在 **搜索服务和市场** 文本框中，键入 `Event Grid Topic`，然后按 *Enter*。\n- 3. 选择 **Event Grid\
  \ Topic** 结果，然后选择 **创建**。以下截图显示了 **基本信息** 选项卡中配置的设置。我们输入创建事件网格主题所需的所有信息，然后选择 **查看\
  \ + 创建**，然后选择 **创建**。\n\n![](img/66aceec30d3e7dead2f71bb68a887688_65_0.png)\n\n\
  图 3.4 – 在事件网格中创建主题\n\n- 4. 现在，我们将 Azure 事件网格查看器部署到 Web 应用程序。\n\n我们已经创建了一个事件网格主题。在下一节中，我们将创建一个\
  \ Web 应用程序，以部署 Azure 事件网格查看器。\n\n\n\n\n\n## 创建 Web 应用以部署 Azure Event Grid 查看器\n\n\
  我们将在与 Event Grid 主题相同的资源组中创建一个 Web 应用。我们将使用以下配置设置在 Docker 容器中发布 Web 应用实例：\n\nFigure\
