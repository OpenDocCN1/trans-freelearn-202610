  \ – step 2\n\n容器 ID 是容器的名称，分区键用于自动在分区之间分配数据以确保可扩展性。\n\n3. 单击 OK 以确认创建新容器。创建后，Data\
  \ Explorer 将显示它和新的数据库：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_216_0.png)\n\n\
  Figure 9.11 – New database and new container in Data Explorer\n\n现在，我们将向数据库添加数据。为此，我们将使用\
