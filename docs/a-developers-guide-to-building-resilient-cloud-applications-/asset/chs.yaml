  \ ADF 实例。\n\n+   5. 选择 **查看 + 创建**，然后在校验通过后选择 **创建**。\n\n创建 ADF 资源后，我们必须导航到 ADF\
  \ 页面并开始探索不同的设置。选择 **打开 Azure Data Factory Studio**；将在浏览器的新选项卡中加载一个新页面：\n\n![](img/66aceec30d3e7dead2f71bb68a887688_241_0.png)\n\
  \n图 10.9 – 在 ADF 服务中打开 ADF Studio\n\n开始使用 ADF 时，我们将创建链接服务、数据集和管道。\n\n## 创建链接服务\n\
  \n我们需要遵循以下步骤：\n\n+   1. 要创建链接服务以将数据存储链接到我们的 ADF 实例，我们可以选择任何外部存储或 Azure 存储，或数据库、文件或\
  \ NoSQL 数据库。从左窗格中选择 **管理** 选项卡，然后选择 **+ 新建**：\n\n## 大数据存储概述\n\n![](img/66aceec30d3e7dead2f71bb68a887688_242_0.png)\n\
