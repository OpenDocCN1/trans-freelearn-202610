  \ Git 仓库。我们可以稍后配置 Git：\n\n## 创建数据工厂\n\n基础   Git 配置  网络  高级  标记  查看 + 创建\n\nAzure\
  \ 数据工厂允许你使用 Azure DevOps 或 GitHub 配置 Git 仓库。Git 是一种版本控制系统，可以更轻松地进行更改跟踪和协作。\n\n了解有关\
