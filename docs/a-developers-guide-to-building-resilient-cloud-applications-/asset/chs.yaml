  \ Eya Trabelsi，我感到更有动力，所以感谢你们的能量。\n\n### 关于审阅者\n\n**Ryan Mangan** 是一名专注于应用迁移和现代化的云和终端用户计算技术专家。他是各种主题的国际演讲者、作者，并在过去十年中帮助客户和技术社区。Ryan\
  \ 是英国计算机学会的特许会员、微软**最有价值专家 (MVP)**、VMware vExpert 以及**非常重要的 Parallels 专业人士 (VIPP)**。\n\
  \n**Stefano Demiliani** 是微软业务应用最有价值专家、**微软认证解决方案开发者 (MCSD)**、Azure 认证架构师，也是其他微软相关技术的专家。他的主要活动是基于微软技术全栈（主要专注于\
  \ ERP 和云）进行企业解决方案的架构和开发。他曾与 Packt Publishing 合作过许多与 Azure 云应用和 Dynamics 365 Business\
  \ Central 相关的 IT 书籍，并在欧洲各地的会议上发表演讲。你可以通过 Twitter (@demiliani) 或 LinkedIn 联系他。\n\n\
  \n\n\n\n## 前言\n\nAzure 是微软的公有云计算提供商。它提供一系列云服务，包括计算、网络、存储和分析。用户将继续使用 Azure 中的无服务器和事件驱动技术构建面向云的应用程序，将他们的应用程序与关系型或非关系型数据库集成，在\
  \ Azure 中使用数据库即服务，并使用 Docker 容器在 Azure 上构建 CI/CD 管道。\n\n为了在市场中保持竞争力并以更快的速度和更低的成本交付软件，拥有稳定遗留系统且数据量不断增长的公司正在对其应用程序进行现代化改造并加速创新。然而，许多企业难以满足现代化改造的需求。本书将通过示例帮助你在\
  \ Azure 上构建安全可靠的基于云的应用程序，并展示如何将它们连接到数据库，以克服应用程序现代化改造的挑战。本书将带你了解 Azure 中的各种服务，即使用网关模式的\
  \ Azure API 管理、事件驱动架构、Event Grid、Azure Event Hubs、Azure 消息队列、使用 Azure Functions\
  \ 的函数即服务，以及面向数据库的云。在此过程中每一步，你都将学习如何在 Azure 中创建、导入和管理 API 与 Service Fabric，以及如何确保\
  \ Azure 中的持续集成和部署，从而完全自动化软件交付流程（构建和发布流程）。\n\n## 本书读者对象\n\n本书面向云开发者、软件架构师、系统管理员、DBA、数据工程师、开发人员以及希望理解云世界中软件架构师或开发者新角色的计算机科学学生。希望提升云和云原生编程概念的专业人士也会发现本书非常有用。\n\
  \n## 本书涵盖内容\n\n第 1 章“无服务器架构、事件驱动架构和云数据库简介”涵盖无服务器架构的定义，以及 API 在应用程序及其生态系统中的定义、生命周期、类型和角色。本章还涵盖事件驱动架构和面向数据库的云。\n\
  \n第 2 章“API 管理——导入、管理和发布你的第一个 API”涵盖 Azure API 管理的不同功能，并定义 API 网关模式。本章还涵盖 API 安全性。\n\
  \n\n\n\n\n*第 3 章，开发基于事件和基于消息的解决方案*，涵盖了基于事件和基于消息的解决方案。本章描述了 Event Grid、Azure Event\
  \ Hubs 以及 Service Bus Queue 和 Topic。我们将使用 .NET 应用程序向 Service Bus Queue 或 Topic 发送和接收消息，并使用\
  \ .NET 应用程序发布和订阅 Event Grid 事件。\n\n*第 4 章，在 Azure 中创建和部署 Function App*，涵盖了 Azure\
  \ Functions 的基本概念及其托管计划选项，以及 Azure Functions 的开发。本章还涵盖了 Durable Functions。\n\n*第\
  \ 5 章，开发 Azure Service Fabric 分布式应用程序*，涵盖了 Azure Service Fabric 的基本概念、主要优势以及 Service\
  \ Fabric 应用程序在本地或远程部署到云中的方法。\n\n*第 6 章，应用程序数据简介*，涵盖了数据分类、数据概念以及 Azure 中关系型和非关系型数据的不同概念。本章还涵盖了现代数据仓库分析。\n\
  \n*第 7 章，使用 Azure SQL Database*，涵盖了 Azure SQL Database 和 Azure SQL Managed Instance\
  \ 的配置和部署。本章讨论了单个 SQL 数据库、数据库弹性池和 SQL Managed Instance 的部署。在本章中，我们将 Azure SQL 数据库连接到\
  \ ASP.NET 应用程序。\n\n*第 8 章，使用 Azure Storage*，涵盖了 Azure Storage 服务中可用的不同存储选项。本章讨论了\
  \ Azure 存储账户，包括 Azure Table storage、Azure Blob storage、Azure Disk storage 和 Azure\
  \ Files。\n\n*第 9 章，使用 Azure Cosmos DB 管理数据库服务*，涵盖了使用多模型 NoSQL 数据库管理系统设计和实现云原生应用程序。本章讨论了\
  \ Microsoft Azure Cosmos DB。\n\n*第 10 章，大数据存储概述*，涵盖了大数据存储的不同解决方案。本章概述了 Azure Data\
  \ Lake Storage、Azure Data Factory、Azure Data Factory、Azure Synapse Analytics 和 Azure\
  \ Analysis Services。\n\n*第 11 章，Azure 上的容器和持续部署*，涵盖了在 Azure 上容器的 **持续集成/持续交付 (CI/CD)**。本章讨论了设置持续部署以生成容器映像和编排。\n\
  \n## 为充分利用本书\n\n具备良好的 C#、ASP.NET Core 和 Visual Studio（任何最新版本）背景，以及对云计算和数据库的基本了解，将有助于使用本书。\n\
  \n大多数示例中展示的解决方案引用均使用 .NET 6 呈现；了解 C# 和 .NET 技术的基础知识对于理解所述主题至关重要。\n\n| 书中涵盖的软件/硬件\
