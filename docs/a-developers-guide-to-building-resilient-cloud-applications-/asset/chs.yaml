  \ | 757 bytes |\n| ↓ Per-partition query metrics (CSV) | |\n\nFigure 9.15 – Query\
  \ Stats in Data Explorer\n\n在本节中，我们创建了一个新的 Azure Cosmos DB 容器。我们使用了 SQL API，并添加了一个新数据库和一个新容器。我们向数据库添加了数据以测试\
  \ Data Explorer，并使用 SQL 语言检索了数据。\n\n在下一节中，我们将学习有关 SDK 的知识，我们将使用它以 C# 作为编程语言连接到 Azure\
  \ Cosmos DB SQL API。\n\n## Exercise 3 – connecting to the Azure Cosmos DB SQL API\
  \ with the SDK\n\n在本节中，我们将探索用于 Azure Cosmos DB 的 Microsoft .NET SDL v3 并探索用于创建不同资源的不同方法和类。\n\
  \n将 .NET SDK 添加到解决方案非常简单。一旦我们使用 NuGet 通过添加 Microsoft.Azure.Cosmos 包将 SDK 添加到项目，我们将创建一个\
  \ CosmosClient。我们需要一个 Cosmos DB 账户的端点和主密钥，我们将检索并添加到 CosmosClient 构造函数中。现在 CosmosClient\
  \ 类已配置好，我们只需在其上调用方法即可完成所需的操作。我们可以创建数据库和容器、查询文档并运行存储过程，这意味着我们可以执行在 Data Explorer\
  \ 中可以执行的所有操作。\n\n\n\n\n\n但它是如何工作的？SDK 会确定如何设置 HTTP 标头、发出 REST 调用，并将响应解析回 Cosmos\
  \ DB。我们在表示文档时可以使用多种类型的对象。这些可以是典型的 C# 类或 Plain Old CLR Objects (POCOs) 或普通的 Common\
  \ Language Runtime (CLR) 对象，或者我们可以使用没有预定义属性的动态类型，这与文档数据库中灵活的模式相契合。大多数操作都是异步执行的，在等待\
  \ Cosmos DB 对请求做出响应时，代码不会被阻塞。这就是 .NET 中 Task Parallel Library 的用武之地。\n\n> **重要说明**\n\
  > 如果您更喜欢使用 Language-Integrated Query (LINQ) 而不是 SQL，SDK 还包含一个 LINQ 提供程序，可以将您在 C#\
  \ 中编写的 LINQ 查询翻译成 Cosmos DB SQL 以供执行。\n\n让我们开始使用 .NET Core 6 创建一个新的控制台应用程序。这将是一个简单的演示，只运行一个查询并显示一些结果：\n\
  \n1. 从 NuGet 获取 SDK，搜索 Microsoft.Azure.Cosmos 并安装它。添加 NuGet 包 Microsoft.Extensions.Configuration.Json，以便我们可以使用\
  \ JSON 配置文件来存储我们的 Cosmos DB 连接信息：\n\n   ![](img/66aceec30d3e7dead2f71bb68a887688_221_0.png)\n\
  \n   图 9.16 – 添加 Microsoft.Azure.Cosmos\n\n2. 我们将介绍将添加端点 URI 和主密钥的代码片段。我们将在 Program.cs\
  \ 中替换与端点 URI 和主密钥相关的信息：\n\n   ```\n   private static readonly string EndpointUri\
  \ = \"Add your endpoint here\";\n   private static readonly string PrimaryKey =\
  \ \"add your primary key\";\n   ```\n\n   此信息可以在 Azure Cosmos DB 帐户的 Settings 下的\
  \ Keys 中找到。这是一个示例：\n\n   ![](img/66aceec30d3e7dead2f71bb68a887688_222_0.png)\n\n\
  \   图 9.17 – 从 Keys under Settings 获取端点 URI 和主密钥\n\n3. 如果我们想创建一个新的数据库和一个新的容器，可以使用此代码片段：\n\
  \n   ```\n   private CosmosClient cosmosClient;\n   private Database database;\n\
  \   private Container container;\n   private string databaseId = \"appointmentDB\"\
  ;\n   private string containerId = \"appointmentContainer\";\n\n   // Runs the CreateDatabaseAsync\
  \ method\n   await this.CreateDatabaseAsync();\n\n   // Run the CreateContainerAsync\
  \ method\n   await this.CreateContainerAsync();\n\n   private async Task CreateDatabaseAsync()\n\
  \   {\n       // Create a new database using the cosmosClient\n       this.database\
  \ = await this.cosmosClient.CreateDatabaseIfNotExistsAsync(databaseId);\n   }\n\n\
  \   private async Task CreateContainerAsync()\n   {\n       // Create a new container\n\
  \       this.container = await this.database.CreateContainerIfNotExistsAsync(containerId,\
  \ \"/LastName\");\n   }\n   ```\n\n   我们可以添加一个新的 JSON 文件，其中包含不同的设置。我们将优化代码以在文档中执行查询。因此，我们将创建一个与以下图所示类似的新\
  \ JSON 文件：\n\n   ![](img/66aceec30d3e7dead2f71bb68a887688_223_0.png)\n\n   图 9.18\
  \ – JSON 文件中的应用设置\n\n   Program 类将类似于以下内容：\n\n   ```\n   using Microsoft.Azure.Cosmos;\n\
  \   using Microsoft.Extensions.Configuration;\n\n   var config = new ConfigurationBuilder().AddJsonFile(\"\
  appsettings.json\").Build();\n   var endpointuri = config[\"EndpointURI\"];\n  \
  \ var primarykey = config[\"PrimaryKey\"];\n\n   using (var client = new CosmosClient(endpointuri,\
  \ primarykey))\n   {\n       var container = client.GetContainer(\"HealthcareContainer\"\
  , \"appointments\");\n       var mysqlquery = \"SELECT * FROM c\";\n\n       var\
  \ iterator = container.GetItemQueryIterator<dynamic>(mysqlquery);\n       var page\
  \ = await iterator.ReadNextAsync();\n\n       foreach (var item in page)\n     \
  \  {\n           Console.WriteLine(item);\n       }\n   }\n   ```\n\n   我们将调试解决方案以显示不同的项目。您可以在\
  \ foreach 中显示所需的信息：\n\n   ![](img/66aceec30d3e7dead2f71bb68a887688_224_0.png)\n\n\
  \   图 9.19 – 使用 CosmosClient 和 SELECT 查询获取项目\n\n   如果我们想使用 LINQ 而不是 SQL 查询，操作很简单：您需要添加一个包含对象的类。在我们的例子中，我添加了\
  \ Appointment 类；我们将用以下代码替换代码：\n\n   ```\n   using (var client = new CosmosClient(endpointuri,\
  \ primarykey))\n   {\n       var container = client.GetContainer(\"HealthcareContainer\"\
  , \"appointments\");\n       var q = from d in container.GetItemLinqQueryable<Appointment>(allowSynchronousQueryExecution:\
  \ true)\n               select d;\n\n       var documents = q.ToList();\n      \
  \ foreach (var document in documents)\n       {\n           var d = document as\
  \ dynamic;\n           Console.WriteLine(d);\n       }\n   }\n   ```\n\nAzure Cosmos\
  \ DB 还提供 JavaScript 的语言集成事务执行，这使您可以编写存储过程或触发器、用户定义函数等等。\n\nAzure Cosmos DB 是一种分布式数据库系统，旨在实现低延迟、弹性吞吐量可扩展性、数据一致性的明确语义以及高可用性。它使您可以从数据库的本地副本读取和写入数据。Azure\
  \ Cosmos DB 跨与您的 Azure Cosmos DB 帐户关联的所有区域复制数据。\n\n如果我们构建一个应用程序，要求在不同区域的任何地方都具有快速响应时间、具有无限弹性吞吐量和存储可扩展性以及高可用性，我们将使用\
  \ Azure Cosmos DB。\n\n您必须将数据库配置为全局分布并在任何 Azure 区域可用，以实现 Azure Cosmos DB 的高可用性。Azure\
  \ Cosmos DB 是一种托管的多租户服务。它透明地管理所有单个计算节点的细节。因此，用户不必担心修补和计划维护。我们还拥有副本中断，这是指部署在 Azure\
  \ 区域中的 Azure Cosmos DB 集群中的单个节点故障。Azure Cosmos DB 通过保证每个帐户的每个 Azure 区域中的数据至少有三个副本，在四个副本的法定人数中，自动缓解副本故障。\n\
  \n在下一节中，我们将连接部署在 Azure App Service 上的应用程序的 ASP.NET Core Web API 与 Azure Cosmos DB\
  \ 作为数据库。\n\n## 练习 3 – 连接 Azure App Service 与 Azure Cosmos DB\n\n在本节中，我们将连接 Azure\
  \ App Service 与 Azure Cosmos DB 作为数据库。ASP.NET Web API 将连接到 Cosmos DB 数据库，以管理患者在发送到医生仪表板之前预订的预约。\n\
  \n我们将使用安装了 Azure 工作负载的 Visual Studio 2022。我们将按照以下步骤使用 **Connected Services** 连接到\
  \ Azure Cosmos DB：\n\n1. 在解决方案资源管理器中，右键单击 **Connected Services** 节点，并从上下文菜单中选择 **Add\
  \ Connected Service**：\n\n   ![](img/66aceec30d3e7dead2f71bb68a887688_226_0.png)\n\
  \n   图 9.20 – Connected Services\n\n2. 在 **Connected Services** 中，选择 **Add a service\
  \ dependency** 或 **Service Dependencies** 的 **+** 图标。\n\n3. 在 **Add dependency**\
  \ 页面，选择 **Azure Cosmos DB**：\n\n   ![](img/66aceec30d3e7dead2f71bb68a887688_227_0.png)\n\
  \n   图 9.21 – Add dependency – Azure Cosmos DB\n\n4. 选择 **Next**。在 **Connect to\
  \ Azure Cosmos DB** 页面，选择一个现有数据库，并选择 **Next**。我们可以通过选择 **+ Create new** 创建新的 Azure\
  \ Cosmos DB 实例：\n\n   ![](img/66aceec30d3e7dead2f71bb68a887688_227_1.png)\n\n  \
  \ 图 9.22 – Connect to Azure Cosmos DB\n\n5. 输入连接字符串名称，并选择存储在本地 secrets 文件或 Azure\
  \ Key Vault 中的连接字符串：\n\n   | Connect to Azure Cosmos DB | 提供连接字符串名称并指定如何保存它 |\n\
  \   | --- | --- |\n   | Connection string name | ConnectionStrings:ConnectToCosmosDB\
  \ |\n   | Connection string value | `******************************` |\n   | Save\
  \ connection string value in (Learn more) | Local user secrets file, Azure Key Vault,\
