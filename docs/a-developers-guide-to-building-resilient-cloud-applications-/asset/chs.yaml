  \ id** 是数据库的名称；我们可以添加任何唯一名称或使用现有名称。\n- - 选中 **Share throughput across containers**。这允许您在数据库中的所有容器之间分配数据库的配置吞吐量。我们使用此选项来节省成本。\n\
  - - 关于 **Database throughput (400 - unlimited RU/s)**，我们可以选择 **Autoscale** 或 **Manual**。我们将吞吐量保持在所需的\
