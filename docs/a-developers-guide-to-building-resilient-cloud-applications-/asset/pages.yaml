    and provide secure communication. This certificate must contain a private key
    and have a subject name that matches the domain used to access the cluster. You
    can create a new certificate now or select an existing one from an Azure Key Vault.
    The certificate must be stored in an Azure Key Vault in the same subscription
    and region as the cluster. Learn more about Service Fabric security


