- pgno: 76
  md: '# Exploring Azure message queues


    Microsoft Azure Service Bus is a fully managed enterprise integration message
    broker. Some common messaging scenarios are included in Service Bus, such as messaging
    in case of transferring data or decoupling applications to improve their reliability
    and their scalability and message sessions by implementing workflows that require
    message ordering, for example, or topics and subscriptions.


    Azure supports the following two types of queuing mechanisms:


    +   - Queue Storage is a simple message queue service for storing large numbers
    of messages

    +   - Service Bus queues are part of a broader set of messaging services that
    support queuing, publishing/subscribing, and advanced integration patterns


    Azure Queue Storage is a service for sending and receiving messages but is also
    used to store a large number of messages; a queue message can be up to 64 KB in
    size.


    # Exercise 2 – creating an Azure Service Bus namespace and a queue


    In this exercise, we will perform the following actions:


    +   - Create an Azure Service Bus namespace

    +   - Create an Azure Service Bus queue


    The queues can be created using the interactive interface of the Azure portal,
    using the command line via PowerShell or Azure CLI, or using Resource Manager
    templates. We will look at only the first two methods here: Azure Portal and Azure
    CLI.


    # Using the Azure portal


    Let’s open the Azure portal and select **All services**. In the **Integration**
    category, we can find the **Service Bus** resource:'
