    information for the subscription and the resource group. Regarding the instance
    details, we will introduce the workspace name and select the region and pricing
    tier. Under Pricing Tier, we have three options:

    +      - Standard, where we can use Apache Spark and integrate Azure Active Directory

    +      - Premium, where we have another feature that involves the use of role-based
    access controls

    +      - Trial, which allows us to use the Premium option for free for 14 days'
