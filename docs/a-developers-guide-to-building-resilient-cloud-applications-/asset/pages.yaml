- pgno: 99
  md: '# Creating and Deploying a Function App in Azure


    One of the critical decisions architects and developers make in the phase of architecting
    a new cloud software or application is how to connect to the backend services,
    run background processing, run backend tasks, and carry out more tasks, such as
    scheduling and sending emails, without affecting the main application processing.
    For this, the Azure Functions app can be useful.


    We can use Azure Functions to execute code in a cloud environment in a serverless
    way. All we need to do is to write less code with a low cost for a specific problem
    without caring about the whole application, even the infrastructure where we will
    run it. We will focus, in this case, on logic and business scope. We can execute
    Azure Functions in response to events as well.


    In this chapter, we will cover the basic concepts of Azure Functions and the hosting
    plan options. We will explore the development of Azure functions and develop durable
    functions, which are an extension of Azure Functions.


    In this chapter, we''re going to cover the following main topics:


    +   - Exploring Azure Functions

    +   - Developing Azure functions

    +   - Developing durable functions


    # Exploring Azure Functions


    Azure Functions is similar to Azure WebJobs, with some differences related to
    scaling policies, language support, and trigger events. They are both built on
    Azure App Service. Because Azure Functions is built on the WebJobs SDK, it shares
    the same triggers and connections with or to Azure services.


    Azure Functions acts as a modern serverless architecture providing event-driven,
    configured cloud computing for application development.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'In Azure Functions, there are two very important concepts: bindings and triggers.


    When we create Azure Functions, we need to configure the name of the function.
    To call a function, we use triggers. A function must have at least one trigger.
    The function name and the triggers are configured in the `function.json` file.
    We have more information in the configuration file, such as on bindings. We use
    constraints to have input and output bindings, and all of them will allow you
    to connect with databases from your code. All of this saves coding on the connection.
    But with many Azure service pools, you don’t need to do this—you don’t need to
    write code because the bindings take care of those connections.


    In the following figure, we present the different bindings and triggers:


    ![](img/66aceec30d3e7dead2f71bb68a887688_100_0.png)


    Figure 4.1 – Triggers and bindings


    In the next section, we will define more triggers in Azure Functions.


    # Triggers


    A **trigger** defines how a function is invoked; it provokes the running of a
    function. Triggers can include the following:


    +   - **Blob Storage**: When a file or folder is uploaded or changed in storage,
    this will invoke your function

    +   - **HTTP**: Invokes your function similar to a REST API

    +   - **Queue in a service bus**: When items exist in a queue, it invokes your
    function

    +   - **Timer**: This will invoke your function at scheduled intervals


    In the next section, we will define the bindings in Azure Functions further.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Bindings


    Binding to a function is a method of declaratively connecting another resource
    to the function. Bindings can be connected as input bindings, output bindings,
    or both. Some examples of bindings include the following:


    +   - Cosmos DB: Connect to the database to be able to load or save files easily

    +   - Table Storage: This uses the key/value storage from your functions app

    +   - Queue Storage: This retrieves one or more items from a specific queue, or
    places a new one in the queue


    You can use different bindings by mixing or matching them according to your scenario.


    # Order processing scenario using Azure Functions


    A healthcare company deploys optimized solutions to improve healthcare access
    for patients. It offers multiple applications (mobile, web, and desktop applications)
    for doctors and hospitals. It has a web and mobile application called EparaMed.
    This is an online drugstore that offers several services. Customers log in to
    purchase their products, and these products can be shipped or picked up.


    The following is the workflow of an order processing scenario using Azure Functions:


    ![](img/66aceec30d3e7dead2f71bb68a887688_101_0.png)


    Figure 4.2 – Order processing scenario


    The previous figure presents the workflow of an order processing scenario.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'Let’s describe the workflow. We have all these actions:


    +   1. When a customer places a new order, the application (web or mobile) submits
    a message to the **service bus queue**. The message includes the order details.

    +   2. Azure Functions separates the orders placed for the products to be submitted
    to the topic, and the other orders are sent to the service bus queue.

    +   3. The product order will further be separated based on order category using
    **topic subscription rules**. This topic filters, by category, the orders into
    two subscriptions using **subscription rules**.

    +   4. Azure Functions retrieves the price of the ordered product from the storage
    table and calculates the price of the order.

    +   5. An invoice will be created based on the price, and a notification will
    be sent to the customer—including the product details and the invoice—using Microsoft
    Outlook.


    This scenario is an example related to the use case of order processing, and its
    implementation can be found on GitHub:


    ```

    https://github.com/PacktPublishing/A-Developer-s-Guide-to-Building-Resilient-Cloud-Applications-with-Azure/tree/main/Chapter4

    ```


