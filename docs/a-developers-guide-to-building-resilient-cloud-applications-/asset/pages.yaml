- pgno: 121
  md: 'When choosing between regular functions and durable functions, one of the key
    factors in the decision is whether or not you’re implementing a sequential, multi-step
    workflow as part of your application. If you have functionality in your app that
    depends on previous steps or specific states to trigger the next steps, durable
    functions make several tricky parts of these workflows much easier. So, what are
    durable functions, and how can we develop them?


    # Developing durable functions


    In this section, we will describe the diverse types and patterns used for durable
    functions, and we will explain the use of durable orchestrations, timers, and
    events. Azure Durable Functions is an extension of Azure Functions that is used
    to write stateful functions. Durable Functions supports multiple languages, such
    as C#, JavaScript, Python, F#, and PowerShell.


    Later in this chapter, we will describe the common application patterns that can
    benefit from durable functions:


    +   - Function chaining

    +   - Fan-out, fan-in

    +   - Asynchronous HTTP APIs

    +   - Monitor

    +   - Human interaction


    Now that we have defined durable functions and introduced the different patterns
    used, we will describe durable functions in more detail and the different scenarios
    that require their use.


    # Introduction to durable functions


    To implement more complex scenarios with serverless functions, we need a mechanism
    to allow us to save the state during the execution of these functions.


    This extension of functions allows us to write the stateful functions and define
    orchestrations of other functions. It automatically handles the state, checkpoints,
    and restarts. There are several benefits of using Azure Durable Functions in our
    projects.


    We will start by building a stateful workflow to overcome the platform’s inherently
    stateless nature. Next, the defined functions as orchestrators can invoke other
    functions synchronously or asynchronously. The result of the functions invoked
    by the orchestrator can be saved as local variables. All the progress made by
    the orchestrator and the rest of the functions is stored locally. We must ensure
    that we never lose the state. This is part of the fundamental functionality of
    the platform. When the activity functions are in bold, you can specify an automatic
    retry policy. The functions that are considered orchestrators can be Service Orchestration,
    Resource Orchestration, and Lifecycle Orchestration. There is a relationship of
    dependency and continuity between the functions. You can also run multiple instances
    of an orchestrator function in parallel to each other functions. Orchestrator
    functions can have multiple statuses, such as Started, Consulted, or Canceled.
    Finally, the Azure Durable Functions'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'extension is supported by the local Azure function and the SDK development
    tools that you already have on your computer.


    # Implementing an orchestrator function


    So, here, in the FunctionAppSample project, we will right-click and select the
    Add | New Azure Function... option and name it FunctionOrchestrator:


    ![](img/66aceec30d3e7dead2f71bb68a887688_122_0.png)


    Now, we will use the Durable Functions Orchestration template, as presented in
