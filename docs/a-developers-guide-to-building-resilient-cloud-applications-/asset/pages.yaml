- pgno: 193
  md: '![](img/66aceec30d3e7dead2f71bb68a887688_193_0.png)


    Figure 8.17 – Uploaded file settings


    Let’s go back and look at some of the other options that can be used with Blob
    Storage. You can map a custom domain name to your storage account. To do so, create
    the Canonical Name (CNAME) with your favorite registrar, then register the name
    with Azure and add it.


    There are two options for doing this:


    +   - The first option consists of setting up a custom domain.

