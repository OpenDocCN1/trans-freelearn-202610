    # Exploring Azure Blob Storage


    Azure Blob Storage provides massively scalable storage for unstructured data.
    Unstructured data is any data that isn’t stored in the structured database format.
    This can be anything: binary, text files, images, or videos. Microsoft Azure Virtual
    Machines store the disk images in Blob Storage.


    Blob is an acronym for binary large object.'
  merge: -1
