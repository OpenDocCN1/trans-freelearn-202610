- pgno: 166
  md: 'Every service is available in two different deployment models. We can create
    a single database for all services or we can select a different option. For example,
    for SQL database services, we can also select **Elastic pool** or **Database Server**.
    For SQL Managed Instances, we have a single database in Azure Arc, and in SQL
