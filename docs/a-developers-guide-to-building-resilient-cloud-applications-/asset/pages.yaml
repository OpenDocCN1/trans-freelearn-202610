    testing.

    +   - Geo-redundant storage (GRS): This is used in backup scenarios because it
    is an intermediate option with a failover capability in another secondary region.

    +   - Zone-redundant storage (ZRS): This is also an intermediate option, but it
    provides protection against data center-level failures. It can be used for high-availability
    scenarios.'
