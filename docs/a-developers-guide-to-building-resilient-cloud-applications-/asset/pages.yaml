- pgno: 152
  md: 'Figure 5.27 – Create Service Fabric Cluster


    We need to define the cluster name, select the subscription and location, define
    the number of nodes, and select an existing resource group or create a new one.
    We need to fill in all of the information for every tab. For the Certificate tab,
    we need to add the certification information needed. In VM Detail, we will configure
    the VM that is used by the cluster. In Advanced, we need to add ports. After that,
    we will click on Create.


    A new cluster will be created. At the bottom of the window, we need to select
    the application parameter files and the startup service parameter files that will
    be used for the cloud, so we will select Cloud.xml. This configuration ensures
    that each service is going to be deployed to all the nodes in the cluster. After
    this, we will click on Finish.


    # Building and executing a Docker container in Service Fabric


    Another application model supported in Service Fabric is the use of Docker containers.


    Containers are an ideal complement to the microservices architecture, thanks to
    the fact that they are isolated and lightweight processes.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Let’s create a new Service Fabric application. First, we need to select a container
    template, set the service name, and specify the container image name. The image
    has to be reachable. The container image can be a public image in Docker Hub,
    for example, or a private image in Azure Container Registry or any private registry.
    In this case, we need to add a username and a password. You can also specify the
    host port and the container port that you want to use; for example, we can use
    port 80. Then, we will click on **Create**.


    ![](img/66aceec30d3e7dead2f71bb68a887688_153_0.png)


    This type of application model doesn’t add a service project since you won’t write
    any code. This is because all the code is already inside the container. If we
    expand the service manifest for the package, the `ContainerHost` element contains
    the image name. Optionally, you can also set environment variables in the container
    using the `EnvironmentVariables` element. Locally, we can deploy this type of
    application in the local cluster. Remotely, you can deploy the application to
    Azure Service Fabric.


    If you need to learn about creating a container, you can check out this book:
    *A Developer’s Guide to Cloud Apps Using Microsoft Azure* by Packt Publishing.'
