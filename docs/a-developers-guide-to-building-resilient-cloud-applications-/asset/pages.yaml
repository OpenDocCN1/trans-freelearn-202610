  md: '# Working with Azure Cosmos DB to Manage Database Services


    We store data in relational tables if we are using relational databases. Unstructured
    data can be stored in a storage solution, but sometimes, the structure of a relational
    database can be too rigid and generally leads to poor performance in certain cases,
    requiring the implementation of specific and detailed tuning. There are several
    models, known as NoSQL databases, that present solutions for certain scenarios,
    such as documents, graphs, column family stores, and key-value stores.


    NoSQL databases are defined by multiple characteristics: they are non-relational,
    have a JavaScript Object Notation (JSON) schema, and are designed for scaling
    out.


    This chapter will cover designing and implementing cloud-native applications using
    a multi-model NoSQL database management system, which is Microsoft Azure Cosmos
    DB.


    In this chapter, we’re going to cover the following main topics:


    +   - NoSQL databases

    +   - Exercise 1 – creating an Azure Cosmos DB account using the Azure portal

    +   - Exploring the Azure Cosmos DB SQL API

    +   - Exercise 2 – creating an Azure Cosmos DB SQL API account

    +   - Exercise 3 – connecting to the Azure Cosmos DB SQL API with the SDK


    # NoSQL databases


    Organizations now handle more than structured data. NoSQL databases store unstructured
    data in documents rather than relational tables, where we store structured data.
    So, we categorize them as “more than just SQL” and decompose them into various
    flexible data models. NoSQL database types include document-only databases, key-value
    stores, wide-column databases, and chart databases.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'NoSQL databases are built from the ground up to store and process vast amounts
    of data at scale, supporting the ever-growing modern business.


    The following are definitions for the most popular types of NoSQL databases:


    +   - **Key-value store:** A key-value store groups related data into collections
    so that records can be identified by unique keys for easy retrieval. A key-value
    store retains the benefits of a NoSQL database structure, yet has enough structure
    to reflect the values of relational databases (as opposed to non-relational databases).
    We can see an example in the following figure:


    ![](img/66aceec30d3e7dead2f71bb68a887688_206_0.png)


    Figure 9.1 -- Key-value NoSQL database type


    Microsoft Azure Table Storage is an example of this type of NoSQL database.


    +   - **Document:** Document-only databases are primarily created to store document-centric
    data as documents, such as JSON documents. These systems can also be used to store
    XML documents such as NoSQL databases. Azure Cosmos DB is an example of this type.


    +   - **Table style:** This type is a data model based on sparsely populated tables.
    They are also called wide-column databases. They use the tabular format of relational
    databases, but the naming and formatting of the data in each row can vary greatly,
    even in the same table. Similar to key-value stores, wide-column databases have
    a basic NoSQL structure while retaining a high degree of flexibility.


    +   - **Graph:** The graph type is a record generally stored in key-data format.
    We use it to define the relationships between stored data points. Graph databases
    allow us to identify the patterns in unstructured and semi-structured information.
    In the following figure, we can see the different graph components:'
  merge: -1
  img_proc: true
- pgno: 207
  md: '![](img/66aceec30d3e7dead2f71bb68a887688_207_0.png)


    Figure 9.2 – Graph NoSQL database type


    Polyglot persistence across multiple non-relational (NoSQL) data stores can add
    significant complexity and overhead. As a result, Microsoft provides a multi-model,
    geographically distributed database called Azure Cosmos DB with data structures
    for natively storing key-value pairs, JSON hierarchies, and graphs.


    Azure Cosmos DB is a fully managed PaaS offering and its internal storage is abstracted
    from the different users.


    # Exercise 1 – creating an Azure Cosmos DB account using the Azure portal


    Azure Cosmos DB is a distributed database engine with a core set of features no
    matter how you use your database. These features include the ability to elastically
    distribute databases, the ability to scale both storage and throughput bi-directionally,
    low latency with financially backed SLAs, various consistency options, and enterprise-class
    security features.


    Azure Cosmos DB is designed for high responsiveness and always-on availability
    for most modern applications in the cloud. Cosmos DB is considered a NoSQL database
    and works primarily with four data models (key-value, documents, column-family
    or table-style, and graph).


    Azure Cosmos DB includes documents stored where data is schemeless and most likely
    stored as JSON documents. Many document databases use JSON to represent the document
    structure, graph-oriented models where data is represented as diagrammatic structures
    such as nodes and edges, and key-value stores in their simplest form. A database
    management system stores only key-value pairs and has a wide column store that
    can store data with many dynamic columns. Cosmos DB’s focus on high availability,
    geographic distribution, and speed provides some pretty cool advantages.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Cosmos DB manages data as a partitioned set of documents. A document is made
    up of a set of fields, and each field is identified by a key. The fields in each
    document may vary and a field may contain child documents. In a Cosmos DB database,
    the documents are organized into containers that are grouped into partitions.


    A document can contain up to 2 MB of data, including small binary objects. But
    if you need to store larger blobs related to a document, you’ll need to use Azure
    Blob Storage. You can then add a reference to the blob created in the document.


    Let’s start by creating an Azure Cosmos DB resource by using the Azure portal.
    We will follow these steps:


    +   1. On the home page of the Azure portal, select **Create a resource**. You
    can use the search input and enter Cosmos or you can select the **Databases**
    category. Select **Create** under **Azure Cosmos DB**:


