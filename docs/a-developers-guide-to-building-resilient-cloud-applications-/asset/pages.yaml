    az sf cluster create -g packtrg -c hospitalmanagement -l estus--template-file
    template.json \ --parameter-file parameter.json --secret-identifier https://{KeyVault}.vault.azure.net:443/secrets/{MyCertificate}

    ```


    To create a new Azure Service Fabric cluster, we can use one or more properties
    mentioned here:


    ```

