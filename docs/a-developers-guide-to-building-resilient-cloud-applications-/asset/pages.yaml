- pgno: 15
  md: '# Preface


    Azure is a Microsoft public cloud computing provider. It provides a range of cloud
    services including compute, network, storage, and analytics. Users will continue
    their journey in building cloud-oriented applications using serverless and event-driven
    technologies in Azure., they will integrate their application with relational
    or non-relational databases and use Database-as-a-Service in Azure and build a
    CI/CD pipeline with Docker containers on Azure.


    To remain competitive in the market and deliver software at a faster rate and
    reduced cost, companies with stable, legacy systems and growing volumes of data
    are modernizing their applications and accelerating innovation. However, many
    businesses struggle to meet modernization demands. This book will help you to
    build secure and reliable cloud-based applications on Azure using examples, and
    show you how to connect them to databases in order to overcome the application
    modernization challenges. The book will walk you through the different services
    in Azure, namely, Azure API Management using the gateway pattern, event-driven
    architecture, Event Grid, Azure Event Hubs, Azure message queues, Function-as-a-Service
    using Azure Functions, and the database-oriented cloud. At every step along the
    way, you''ll learn about creating, importing, and managing APIs and Service Fabric
    in Azure, and how to ensure continuous integration and deployment in Azure to
    fully automate the software delivery process (the build and release process).


    # Who this book is for


    This book is for cloud developers, software architects, system administrators,
    DBAs, data engineers, developers, and computer science students looking to understand
    the new role of software architects or developers in the cloud world. Professionals
    looking to enhance their cloud and cloud-native programming concepts will also
    find this book useful.


    # What this book covers


    Chapter 1, Introduction to Serverless Architecture, Event-Driven Architecture,
    and Cloud Databases, covers the definition of serverless architecture, and the
    definition, life cycle, types, and roles of APIs inside an application and their
    ecosystem. This chapter covers also event-driven architecture and the database-oriented
    cloud.


    Chapter 2, API Management – Import, Manage, and Publish Your First API, covers
    the different features of Azure API Management and defines the API gateway pattern.
    This chapter covers also API security.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '*Chapter 3, Developing Event-Based and Message-Based Solutions*, covers event-based
    and message-based solutions. This chapter describes Event Grid, Azure Event Hubs,
    and Service Bus Queue and Topic. We will use a .NET application to send and receive
    messages to Service Bus Queue or Topic, and we will publish and subscribe events
    to Event Grid events using .NET application.


    *Chapter 4, Creating and Deploying a Function App in Azure*, covers the basic
    concepts of Azure Functions and their hosting plan options, and the development
    of Azure Functions. This chapter also covers Durable Functions.


    *Chapter 5, Develop an Azure Service Fabric Distributed Application*, covers the
    essential concepts of Azure Service Fabric, the main benefits, and Service Fabric
    application deployment locally or remotely to the cloud.


    *Chapter 6, Introduction to Application Data*, covers data classification, data
    concepts, and the different concepts of relational and non-relational data in
    Azure. This chapter also covers modern data warehouse analytics.


    *Chapter 7, Working with Azure SQL Database*, covers the provisioning and deployment
    of Azure SQL Database and Azure SQL Managed Instance. This chapter discusses the
    deployment of a single SQL database, database elastic pool, and SQL Managed instance.
    In this chapter, we will connect an Azure SQL database to an ASP.NET application.


    *Chapter 8, Working with Azure Storage*, covers the different storage options
    that are available in Azure Storage services. This chapter discusses Azure storage
    accounts, including Azure Table storage, Azure Blob storage, Azure Disk storage,
    and Azure Files.


    *Chapter 9, Working with Azure Cosmos DB to Manage Database Services*, covers
    the design and implementation of cloud-native applications using a multi-model
    NoSQL database management system. This chapter discusses Microsoft Azure Cosmos
    DB.


    *Chapter 10, Big Data Storage Overview*, covers the different solutions for big
    data storage. This chapter gives an overview of Azure Data Lake Storage, Azure
    Data Factory, Azure Data Factory, Azure Synapse Analytics, and Azure Analysis
    Services.


    *Chapter 11, Containers and Continuous Deployment on Azure*, covers the **continuous
    integration/continuous delivery (CI/CD)** of containers on Azure. This chapter
    discusses the setting up of continuous deployment to produce your container images
    and orchestration.


    # To get the most out of this book


    Having a good background in C#, ASP.NET Core, and Visual Studio (any recent version),
    and a basic knowledge of cloud computing and databases will be helpful when using
    this book.'
  merge: -1
  img_proc: true
