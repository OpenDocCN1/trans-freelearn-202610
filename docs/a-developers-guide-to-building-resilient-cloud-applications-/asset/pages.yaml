- pgno: 128
  md: '# Exploring Azure Service Fabric


    We can consider three categories of Azure services to deploy cloud-based applications:


    +   - **Platform as a Service (PaaS)**: This provides a hosted environment in
    which users can meet various computing needs. Users are able to develop, manage,
    and run applications on the platform while the PaaS provider manages the infrastructure.
    Azure offers PaaS services such as **Service Fabric** and **Azure App Service**.

    +   - **Container as a Service (CaaS)**: The emergence of virtualization has transformed
    the IT industry, allowing people to run different operating systems simultaneously
    on a single computer. This has improved efficiency and improved performance. However,
    virtualization is not without its drawbacks. A separate operating system is required
    for a virtual environment to function. As a result, it takes up a lot of disk
    space. CaaS was born as a means of offloading hardware resources. CaaS providers
    give users access to containerized applications or clusters. Azure offers CaaS
    services such as **Azure Service Fabric**, **Azure Container Instances**, **Azure
    Kubernetes Service**, which is a container orchestrator containing microservices
    that are easy to manage, and **Azure Container Apps**.

    +   - **Function as a Service (FaaS)**: FaaS is a type of cloud computing service
    that allows code to be implemented in response to events without extensive code
    infrastructure changes. It is recommended for users who only need the cloud for
    individual functions within the app. Users do not need to build the infrastructure
    normally required for app development.


    The following diagram presents the different services used for every type: PaaS,
    CaaS, and FaaS. Azure Service Fabric can be used as a PaaS and for containerized
    applications as a CaaS.


    ![](img/66aceec30d3e7dead2f71bb68a887688_128_0.png)


    Figure 5.1 – Azure container services


    In this section, we discussed the different Azure services to build and deploy
    container applications. In the next section, we will define Service Fabric and
    the different services using Service Fabric.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Definition


    Azure Service Fabric allows you to create modern, resilient, and scalable software
    solutions, with features required to build a robust system, such as autoscaling,
    health monitoring, and fault tolerance.


    The Service Fabric platform offers a programming model that you can use to create
    reliable services or components based on the actor model. For containerized applications,
    Service Fabric also supports Docker containers so that you can use the platform
    as an orchestrator. Azure Service Fabric is able to run on any operating system
    (Windows or Linux). Additionally, it can run in any environment, on-premises as
    a private cloud or on a public cloud such as Azure or any other cloud provider,
    such as AWS or Google Cloud Platform, or in the local development environment
    of a developer. It offers a complete set of development tools and software development
    kits (SDKs) to start building solutions on the platform very quickly. These tools
    can be used in a development environment or in a production environment. The cloud
    has allowed the evolution of software architectures and development platforms
    for distributed systems. Azure Service Fabric is not new. It is an open source
    project that is used in many services in the Azure infrastructure as well as other
    Microsoft services. In fact, it has existed since the beginning of Azure, when
    it was still called Windows Azure. Within Microsoft, this platform is strategic
    and fundamental since many cloud services use it, such as Azure SQL Database,
    Azure Cosmos DB, Azure DevOps, Dynamics 365, Power BI, and many more. The following
    diagram depicts the different Microsoft services and tools that use Service Fabric.


    ![](img/66aceec30d3e7dead2f71bb68a887688_129_0.png)


    Figure 5.2 – Powering Azure and Microsoft services with Service Fabric


    But how does Azure Service Fabric work? In the next section, we will present the
    core functionality of Azure Service Fabric, which is based on two essential concepts:
    clusters and nodes.'
  merge: -1
  img_proc: true
- pgno: 130
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 131
  md: 'We have three main features that emerge from this scenario, thanks to redundant
    servers: we ensure availability, the creation of several replicas of data, as
    well as an evolution in terms of the partitioning of services ensuring reliability.
    Partitioning is a key feature of the reliable services programming model. Service
    Fabric is undoubtedly an excellent option for hosting and running the most critical
    software solutions.


    # The differences between Service Fabric and Kubernetes


    Containers are used in cloud-native applications. This technology has impacted
    the software development industry and has changed how systems are designed, operated,
    distributed, and monitored. If we have multiple containers to manage, we need
    an orchestrator so that we’ll have various container orchestrators. One of the
    main features of an orchestrator is container life cycle management, such as container
    provisioning, the scaling of existing containers, and resource allocation. Kubernetes
    is one of the most widely used container orchestrators in the industry.


    The main difference between Kubernetes and Service Fabric is that Service Fabric
    has three mechanisms to deploy and run applications:


    +   - **A proprietary programming model that you can optionally use in your applications**:
    This programming model allows you to build a stateful or a stateless reliable
    service, and also reliable actors. The actor model is based on having distributed
    objects that communicate with each other through messages.

    +   - **The use of containers**: Both Linux and Windows containers are supported.

    +   - **The use of any secure build with any platform and any language, with no
    modification required at all**: Kubernetes supports both Linux and Windows containers.
    Likewise, Microsoft Azure includes Azure Kubernetes Service, which is a fully
    managed platform for Kubernetes.


    # The Azure Service Fabric development environment


    We have many different options to adopt Service Fabric. Service Fabric is a free,
    open source project whose source code is available on GitHub. Service Fabric supports
    three different execution environments:


    +   - **On-premises environment**: You can install Service Fabric locally on your
    servers or VMs. This scenario is suitable for the first cloud migration of your
    workloads.

    +   - **Public cloud**: Azure Service Fabric allows cluster creation. Note that
    we have the same Service Fabric functionalities as the previous environment because
    we can use the same runtime and SDK.

    +   - **Public cloud with other providers**: We can install Service Fabric on
    any VM using any operating system.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'We can consider another environment using containers as if they were nodes
    of a cluster. As we said before, Service Fabric is open source so it is free.
    However, if you deploy to a cloud provider, then you pay for the computing resources
    that you provision.


    Let’s now talk about the development environment and the prerequisites. We will
    present the different tools used to build and deploy a .NET application. The Service
    Fabric SDK also supports the Java programming language and is able to host any
    executable, regardless of the platform or language used to build it.


    We must meet these prerequisites in order to be able to configure the development
    environment to create a Service Fabric cluster:


    +   - Windows 10 or 11, which supports Hyper-V, is required for Docker installation

    +   - Visual Studio 2022 or 2019, or Visual Studio Code

    +   - The .NET Core SDK

    +   - Microsoft Service Fabric SDK

    +   - Docker tools for Windows

    +   - The Azure CLI


    You can download Visual Studio from https://visualstudio.microsoft.com/. The Community
    Edition is always free to use and includes Service Fabric templates. You can also
    use the other editions.


    To download and install the Service Fabric SDK, use this link: https://www.microsoft.com/web/handlers/webpi.ashx?command=getinstallerredirect&appid=MicrosoftAzure-ServiceFabric-CoreSDK.


    You can download Docker for Windows from the Docker website.


    Use this link to install Docker Desktop and to create an account in Docker Hub:
    https://www.docker.com/get-started/.


    Finally, we will install the Azure CLI tool; you can use this link to install
    it for Windows: https://aka.ms/installazurecliwindows.


    Now, we have all the required software to build a Service Fabric application.


    Let’s check the installation now. We will press Start and type fabric to search
