- pgno: 144
  md: '# Coding your scaling


    The third option is to scale programmatically. In other words, you create code
    that increases or decreases the number of instances in your cluster.


    Having created our cluster and configured the scaling, we will now learn how we
    can create a .NET Service Fabric application.


    # Exercise 4 – creating a .NET Service Fabric application


    Service Fabric supports multiple application models. It''s a flexible technology
    that allows you to host and execute any workload. After installing the Service
    Fabric SDK, you will be able to use its available templates.


    When we run Visual Studio 2022 and select Service Fabric template, many models
    appear, as shown in the screenshot:


    ![](img/66aceec30d3e7dead2f71bb68a887688_144_0.png)


    Figure 5.18 – Service Fabric template models


    We will start with an application model that is considered to have reliable services.
    These services use the native API of Service Fabric. We have three different types
    of reliable services: stateless, stateful,'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'and actors. The difference between stateful and stateless services is that
    in stateless services, no state is maintained in the service, but for stateful
    services, the state is stored with the service.


    Moreover, we can use both .NET Core and .NET Framework runtimes to build reliable
    services. This is why we can use Service Fabric to migrate old applications. An
    actor is a dependent computing unit that runs on a single thread. The actor model
    is intended for concurrent or distributed systems since a large number of these
    actors can run simultaneously and independently of each other, communicating through
    messages.


    Another application model is containers. Both Linux and Windows containers are
    supported in Service Fabric.


    There is also the guest executable model. It allows us to bring any type of executable
    that we have built on any development platform and with any programming language
    to Service Fabric.


    With these application models, we can use Service Fabric in any scenario that
    requires high availability, reliability, and a robust platform to deploy and run
    our applications.


    We’re going to create a sample solution based on Service Fabric’s **Stateless
    Reliable Services**. The application is used for managing hospitals around some
    countries in Africa and Europe.


    # Creating a Service Fabric application


    Let’s go back to Visual Studio 2022. When we select **Create a new project**,
    we need to configure the project by specifying the name, the location, the solution
    name, and the framework. After, we will click on the **Create** button.


    ![](img/66aceec30d3e7dead2f71bb68a887688_145_0.png)


    Figure 5.19 – Creating a Service Fabric application'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'After this, we will select the **Stateless Service ASP.NET Core**, which will
    use the .NET Core runtime. As presented in the following figure, we will specify
