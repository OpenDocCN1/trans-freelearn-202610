    under Container registry, add the name of the repository, and select Add to save
    the task:


    Figure 11.24 – Update a YAML file with the Docker Hub connection service


    4. Select Save and Run after updating your YAML file to start your build pipeline.
    You can verify your repository in Docker Hub.'
