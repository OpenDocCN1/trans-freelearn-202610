- pgno: 259
  md: '# 11


    # Containers and Continuous Deployment on Azure


    Containers are a simple way for developers to build, test, deploy, update, and
    redeploy applications to a variety of environments, from a developer’s local machine
    to an on-premises data center, and even to the cloud across multiple vendors.


    Azure offers multiple services to deploy containers. Containers make it easy to
    continuously build and deploy your apps. With Kubernetes orchestration in Azure
    using Azure Kubernetes Service, our clusters of containers are replicable and
    easy to manage.


    In this chapter, we will cover the **continuous integration and continuous delivery
    (CI/CD)** of containers on Azure. We will set up continuous deployment to produce
    our container images and orchestration.


    In this chapter, we’re going to cover the following main topics:


    +   - Setting up continuous deployment for Docker with Azure DevOps and Azure
    Container Registry

    +   - Continuous deployment for Windows containers with Azure DevOps

    +   - Integrating Docker Hub with the CI/CD pipeline


    # Setting up continuous deployment for Docker with Azure DevOps and Azure Container
    Registry


    In this section, we will set up a CI pipeline for building containerized applications.
    We will build and publish Docker images to Azure Container Registry using Azure
    DevOps to increase the reliability and speed of the deployment.'
  merge: -1
  img_proc: true
