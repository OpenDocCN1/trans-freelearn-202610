- pgno: 164
  md: '# Azure SQL Database


    Azure SQL Database is a hosted SQL database service in Azure. It runs on the SQL
    Server database engine. There are some important differences between Azure SQL
    Database and the traditional SQL Service. But most database administrators using
    SQL Server are able to migrate to Azure SQL Database. Azure SQL Database makes
    it extremely easy to scale a database. We are able to replicate a database in
    one or more other locations around the world, which can improve performance if
    your application is used worldwide.


    Azure SQL Database is available not only as a PaaS but also as serverless. The
    difference between them is that the PaaS option requires you to select a level
    of performance, and you will pay that fixed rate per hour for access to the database.
    You can easily scale to a bigger or smaller performance plan without causing disruption
    to your applications or your users by selecting the option within the Azure portal.
    The serverless option allows you to pay only for usage. In fact, the database
    shuts down when you’re not using it. This can be ideal for underused databases,
    such as if you have a developer-only tool that needs a database to run but doesn’t
    need to run 24/7 and can be available immediately. Azure offers 99.99% reliability
    for Azure SQL Database and its default configuration.


    Azure offers a high-level tier if you have a database that is an important resource
    for your business. This is sometimes referred to as the premium tier in the **database
    transaction unit (DTU)** pricing model. Business-critical SQL databases use a
    cluster of SQL database processes to respond to database requests. Having multiple
    SQL engine processes makes your database more reliable because the failure of
    one process doesn’t affect you directly.


    Note that the Azure SLA doesn’t grow between **Standard** and **Business Critical**,
    although you can expect higher availability in practice. But you can further increase
    your guaranteed uptime SLA by adding zone-redundancy deployments. You can only
    do enterprise-critical zone redundancy deployments, which brings you to 99.995%
    availability. Zone-redundant deployments involve deploying multiple replicas of
    a database that are physically separated from each other in availability zones.


    Let’s discover Azure SQL Managed Instance in the next section.


    # Azure SQL Managed Instance


    We are able to move SQL Server to Azure using two different options. **Infrastructure
    as a service (IaaS)** allows you to create an Azure SQL Server virtual machine
    and PaaS allows you to create a fully managed Azure SQL database. There is another
    option that sits right in between these two and it’s called **SQL Managed Instance**.
    SQL Managed Instance combines the benefits of both of the two alternatives (PaaS
    and IaaS). Like a virtual machine, managed instances have almost 100% compatibility
    with on-premises SQL Server. This includes **SQL Server Agent** support, access
    to a temporary database, cross-database queries, distributed transactions, and
    common language runtimes. They are not available in a fully managed Azure SQL
    database. A managed instance also supports up to 100 individual databases in the
    same instance. But unlike virtual machines, managed instances also support automatic
    backup scheduling, automatic remediation, and built-in high availability just
    like Azure SQL Database.'
  merge: -1
  img_proc: true
- pgno: 165
