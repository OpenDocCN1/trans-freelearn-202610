- pgno: 274
  md: '8. Select **Create release**, add the stage and update the version for the
    artifact sources for this release. Then, click on the **Create** button:


    ![](img/66aceec30d3e7dead2f71bb68a887688_274_0.png)


    Figure 11.20 – Configure a release


    We are ready to again push our local code to our repository to start the pipelines.
    We can add approval requests before updating App Service with the latest version.


    We will see in the next section how we can integrate Docker Hub with the CI/CD
    pipeline.


    # Integrating Docker Hub with the CI/CD pipeline


    In this section, we will set up a CI pipeline for building containerized applications.
    We will build and publish Docker images to Docker Hub:


    ![](img/66aceec30d3e7dead2f71bb68a887688_274_1.png)


    Figure 11.21 – Scenario: Build and push a Docker image to Docker Hub using Azure
    DevOps pipelines'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'We will start by adding a service connection to the Azure DevOps project and
    follow the same steps presented in the previous section.


    In Service connections, add a new service connection to link Azure DevOps with
    the Docker Hub account. Select Docker Registry, and in Registry type, check Docker
    Hub. Complete the different settings, select Verify and Save:


    ![](img/66aceec30d3e7dead2f71bb68a887688_275_0.png)


    Figure 11.22 – Link Azure DevOps with Docker Hub Registry


    We will follow the same steps as previously to create a build pipeline. Follow
    these steps:


    +   1. To proceed with configuring your pipeline, select your repository and in
    the Configure tab, select Docker- Build a Docker Image. Then, select Validate
    and configure.

    +   2. Add the following variables:

    +      - imageRepository: your-image-name

    +      - containerRegistry: ''your-docker-hub-registry-name''

    +      - applicationName: your-app-name'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'Figure 11.23 – Build pipeline to Docker Hub


