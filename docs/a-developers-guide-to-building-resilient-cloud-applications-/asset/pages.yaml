  md: '# # Exploring Azure Files


    Azure Files storage provides cloud-based file shares, which can be accessed from
    the cloud or on-premises.


    Azure Files storage offers shared storage for applications using the industry-standard
    **Server Message Block (SMB)** protocol and the **Network File System (NFS)**
    protocol. Azure Virtual Machines and cloud services can share file data across
    application components via mounted shares. On-premises applications can also access
    file data under sharing repositories. That means multiple virtual machines can
    share the same files with both read and write access. You can also read the files
    using the **Representational State Transfer (REST)** API interface or the storage
    client libraries. Applications running in Azure Virtual Machines, Windows, Linux,
    or other cloud services can mount a file storage share to access file data, just
    as an application would mount a typical SMB or NFS share. Any number of Azure
    Virtual Machines or roles can mount and access the file storage share simultaneously.
    Azure Files SMB file shares are accessible from Windows, Linux, and macOS clients.
    NFS file shares are accessible from Linux and macOS clients.


    # ## The common uses of file storage


    Azure Files can be used to completely replace traditional on-premises file servers
    or **Network Attached Storage (NAS)** devices. Popular operating systems, such
    as Windows, macOS, and Linux, can directly mount Azure file shares wherever they
    are in any location. Azure Files makes it easy to lift and shift applications
    to the cloud that expect a file share to store file applications or user data.
    Azure file shares can also be replicated with Azure File Sync to Windows servers,
    either on-premises or on the cloud. To ensure performance and distributed caching
    of data where it is used, shared application settings are stored, for example,
    in configuration files, and diagnostic data such as logs, metrics, and crash dumps
    to a shared location. We store the tools and utilities needed to develop or administer
    Azure virtual machines or cloud services. That has covered all the common use
    cases of file storage for Azure Files.


    # ## Adding Azure Files in the Azure portal


    Now, we will see how we add Azure Files in the Azure portal:


    +   1. Go back to **Storage browser** and select **File shares**:'
  merge: -1
  img_proc: true
