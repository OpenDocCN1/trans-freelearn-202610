- pgno: 31
  md: '# API Management – Import, Manage, and Publish Your First API


    In this chapter, we will explore the different features of Azure API Management.
    We will understand the API Gateway pattern and the management of API calls. We
    will also publish the web APIs of the healthcare solution to Azure API Management,
    securing the API using subscriptions and certificates and creating a backend API.


    In this chapter, we’re going to cover the following main topics:


    +   - Technical requirements

    +   - The API Gateway pattern

    +   - Exploring the API Management service

    +   - Securing the API

    +   - Exercise 1 – creating a backend API and deploying APIs

    +   - Exercise 2 – using Azure API Management to proxy a public API


    # Technical requirements


    Before you start exploring our solution, you will need a code editor for C#. Microsoft
    offers code editors and integrated development environments (IDEs), such as the
    following:


    +   - Visual Studio Code for Windows, macOS, or Linux

    +   - Visual Studio 2022 for Windows

    +   - Visual Studio 2022 for Linux

    +   - GitHub Codespaces'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'As a prerequisite, we need an Azure account where we are able to deploy our
    APIs on Azure App Service and Azure API Management.


    The healthcare solution presented in this chapter uses the .NET 6 framework.


    The GitHub repository for this book has solutions using full application projects
    related to the healthcare domain, and they will be used in the next chapters:


    ```

    https://github.com/didourebaI/developerGuideForCloudApps

    ```


    # The API Gateway pattern


    When developing applications based on complex or large microservices established
    on multiple client applications, it is recommended to use the API Gateway pattern.


    # Definition


    The API Gateway pattern is an integration pattern for clients that communicate
    with a system service, designed to provide a single abstraction layer between
    the underlying services and the customer’s needs. This is the single entry point
    for all clients. It is similar to the Façade pattern of **object-oriented programming
    (OOP)** design, but in this case, it’s part of a distributed system.


    The API Gateway pattern is often referred to as *Backend for Frontend* because
    its implementation is based on the needs of the client application. The pattern
    provides a reverse proxy whose purpose is to redirect or route client requests
    to internal microservices endpoints.


    When should you consider using the API Gateway pattern? The following list specifies
    when it is suitable:


    +   - A synchronous response is issued by the system making the call

    +   - Dependencies between microservices are manageable and do not change over
    time

    +   - No latency requirement; there will be no critical issues if there are slow
    responses

    +   - There is a need to expose an API for the purpose of performing data collection
    from various microservices


    After defining the API Gateway pattern, we will discover, in the next section,
    the use case that we will use during this chapter.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# ## Use case


    Let’s start by looking at a problem relating to the direct communication between
    the client app and microservices. The following figure shows our solution, which
    contains several frontend and backend services that are directly interacting with
    the client applications.


    In our scenarios, the client apps must send requests directly to the microservices.
    How does the client know which endpoints to call? What happens if we introduce
    a new service, for example, or if we decide to make a change and refactor an existing
    service?


    How do services handle authentication or **Secure Sockets Layer (SSL)** termination,
    data transformations, and dynamic request dispatching?


    How can client apps communicate with services that use different protocols? There
    are some potential problems when we expose services directly to clients:


    +   - The client must track multiple endpoints that have been implemented to ensure
    resilient fault handling, resulting in a complex client code implementation.

    +   - Coupling between the client and backend. This makes it more difficult to
    maintain the client and also more difficult to refactor services.


    ![](img/66aceec30d3e7dead2f71bb68a887688_33_0.png)


    Figure 2.1 – Scenario using a direct client-to-microservice communication architecture


    All these challenges can be resolved by implementing an API Gateway pattern to
    decouple clients from services because having an intermediate level or tier of
    indirection (gateway) can be convenient for microservices-based applications.
    The API gateway sits between the client apps and the microservices.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The following figure shows a simplified architecture based on microservices
    and interaction with customers through the integration of a custom API gateway:


    ![](img/66aceec30d3e7dead2f71bb68a887688_34_0.png)


    Figure 2.2 – Scenario using an API gateway implemented as a custom service


    Along with the advantages of using the API Gateway pattern, there are a few disadvantages
    that should not be overlooked:


    +   - It can be complex to set up because the API gateway is yet another additional
    part to be developed, deployed, and managed separately from the microservices
    and the complete solution.

    +   - There is a possibility of latency during communications. The response time
    may be slower than a simplified architecture due to the additional network hop
    through the API gateway – however, for most applications, the additional roundtrip
    is not costly.


    Organizations are adopting microservices because of the architecture''s underlying
    scalability and flexibility. However, an API gateway is required to fully exploit
    the benefits of a microservices strategy. Azure API Management includes an API
    gateway, and we will explore it in the next section.


    # Exploring the API Management service


    We will describe, in this section, the components of API Management and their
    functions, and we will explore the products that use APIs in API Management.


    # API Management components


    Azure API Management is a hybrid, portable, multi-cloud management platform for
    APIs, providing as core functionality the assurance of a successful API program
    through developer engagement, business insights, analytics, security, and protection.
    Each API can include one or more operations and can be added to one or more products.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# How can an API be used in API Management?


    The use of an API by developers is really simple and interactive. They must subscribe
    to a product that includes this API, and then they can call the desired operation
    of the API by ensuring enforcement of usage policies that may be in effect.


    APIs provide a simplified experience when integrating applications, enabling the
    reuse and accessibility of new product and service data on a universal scale.


    With the increase of and, above all, the growing dependency on the publication
    and use of APIs, each company must manage these APIs as first-rate assets meeting
    several criteria.


    These criteria are the API life cycle; the diversification and complexity of the
    backend architecture of API consumers; the protection, acceleration, and observation
    of the operation of APIs; as well as the consumption of APIs by the different
    users and the securing of these hosted services that are in or outside Azure.
    All these criteria are supported by Azure API Management.


    Azure API Management is made up of the following components:


    +   - API gateway

    +   - Azure portal

    +   - Developer portal


    The following diagram presents the different components of Azure API Management:


    ![](img/66aceec30d3e7dead2f71bb68a887688_35_0.png)


    Figure 2.3 – Azure API Management components'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'We have explored the different ways to use API Management and its different
    components. We will look at the API gateway next.


    # API gateway


    As defined before, the API gateway is the endpoint. It accepts API calls made
    by developers, and they will be routed to one or more backends depending on the
    API’s internal design. A verification of **API keys, JSON Web Tokens (JWTs), certificates**,
    and other credentials are also performed at the endpoint level. If your API is
    called without limit, which slows and generates disturbances in the system, the
    verification of credentials can also be managed by applying the quotas of use
    and the limits of flow. We can perform API transformations on the fly without
    any code changes to the API gateway.


    Metadata will be logged for analysis purposes, as well as backend response caching,
    where configured.


    In the following screenshot, we can see the gateway URL displayed when we create
    an instance of the API Management service in Azure:


    ![](img/66aceec30d3e7dead2f71bb68a887688_36_0.png)


    Figure 2.4 – Gateway URL in Azure API Management


    We will start by creating an API Management service using the Azure portal.'
