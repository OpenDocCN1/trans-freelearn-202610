    A user is associated with a group. A group is used to provide product visibility
    management for each developer. API Management has the following immutable system
    groups:


    +   - **Administrators:** Azure subscription administrators are members of this
    group. Administrators manage the API Management service instance. They create
    the APIs, operations, and products used by developers.

    +   - **Developers:** This group is for authenticated developer portal users who
    build applications using APIs. They are allowed to access the developer portal
    and are able to build applications that call the operations of an API.

    +   - **Guests:** Unauthenticated users of the developer portal, such as potential
    customers visiting the developer portal of an API Management instance, belong
    to this group. An administrator can grant them read-only access, such as the ability
    to view APIs without calling them.


    Administrators can create custom groups or make use of external groups in Azure
    Active Directory tenants.


    # Products


    Products are one or more APIs in API Management that are configured with a title,
    a description, and terms of use with access restrictions: open or protected. The
    only difference between open and protected is that protected products must be
    subscribed to before their use or consumption by developers; open ones can be
    used without a subscription. Configuring subscription approval is done at the
    product level itself, requiring admin approval or auto approval.'
