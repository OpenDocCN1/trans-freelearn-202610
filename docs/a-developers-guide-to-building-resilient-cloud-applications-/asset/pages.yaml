- pgno: 23
  md: '# Introduction to Serverless Architecture, Event-Driven Architecture, and Cloud
    Databases


    This first chapter introduces the book''s content, which includes the modernization
    of apps using **application programming interfaces (APIs)**, **event-driven architecture**,
    **functions**, and **Service Fabric**, and connecting them with a database.


    **Modernization** is not just reserved for companies that have been operating
    stable systems for years and whose data volume has evolved. Organizations want
    to remain profitable and not be left behind by not modernizing technology and
    taking advantage of changes in the market due to world-changing factors, such
    as Covid-19.


    Modernization is about accelerating innovation and reducing costs. Modernization
    is not just about the app but also the data.


    In this chapter, we''re going to cover the following main topics:


    +   - Understanding serverless architecture

    +   - Understanding the role of APIs inside an application and their ecosystem

    +   - Understanding event-driven architecture

    +   - Exploring cloud databases'
  merge: -1
