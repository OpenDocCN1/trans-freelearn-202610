    # Exercise 2 – creating a Service Fabric cluster using the Azure CLI


    Another option that we can use to create Azure Service Fabric clusters is the
    Azure CLI tool. You can open PowerShell if it is installed on your machine, or
    open Azure Cloud Shell using this link: https://shell.azure.com/.


    You can find the entire sample command line on GitHub by following this link:
    https://github.com/PacktPublishing/A-Developer-s-Guide-to-Building-Resilient-Cloud-Applications-with-Azure/tree/main/Chapter5.


    We will use PowerShell; we will type this command line to create a new cluster:


    ```

    az sf cluster create -g packtrg -c hospitalmanagement -l estus --cluster-size
    5 --vm-password Password#1234 --certificate-output-folder MyCertificates --certificate-subject-name
    hospitalmanagement

    ```


