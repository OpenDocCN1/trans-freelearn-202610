- pgno: 95
  md: "A queue allows a single consumer to process messages. Unlike queues, topics\
    \ and subscriptions provide a one-to-many form of communication in a publish-subscribe\
    \ model. This is useful when scaling to a large number of recipients. All published\
    \ messages are available to all subscribed subscribers to the topic. When an editor\
    \ posts a message on a topic, one or more subscribers receive a copy of the message.\n\
    \n![](img/66aceec30d3e7dead2f71bb68a887688_95_0.png)\n\nTopic with two subscriptions\
    \ including messages\n\nFigure 3.36 – Topics and subscriptions\n\nSubscriptions\
    \ can use additional filters to limit the messages they receive. Publishers send\
    \ messages to topics the same way they send messages to queues. However, consumers\
    \ do not receive messages directly from topics. Instead, the consumer receives\
    \ messages from the subscription to the topic. A topic subscription is like a\
    \ virtual queue that receives copies of messages sent to the topic. Consumers\
    \ receive messages from subscriptions the same way they receive messages from\
    \ queues.\n\nWe created a topic and a Service Bus subscription to that topic,\
    \ we sent a message to the topic, and in the next section, we will receive these\
    \ messages from the topic’s subscription using C# source.\n\n# Receiving messages\
    \ from a subscription\n\nTo read the previously created messages from the Service\
    \ Bus topic, we start by creating a receiver that we can use to receive the message:\n\
    \n```\nawait using var clientForTopic = new\nServiceBusClient(ServiceBusTopicConnectionString);\n\
    \    ServiceBusReceiver receiver = clientForTopic.\nCreateReceiver(topicName);\n\
    The received is a different type as it contains some\nservice set properties:\
    \      ServiceBusReceivedMessage\nreceivedMessage = await receiver.ReceiveMessageAsync();\n\
    ```\n\nWe will retrieve the message body as a string:\n\n```\nstring body = receivedMessage.Body.ToString();\n\
    Console.WriteLine(body);\nConsole.Read();\n```"
  merge: -1
  img_proc: true
