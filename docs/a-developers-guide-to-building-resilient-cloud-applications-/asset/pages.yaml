- pgno: 155
  md: '# Introduction to Application Data


    Our ability to collect and process large amounts of data has grown over the years
    as technology has allowed us, as humans, to gather and collate significant amounts
    digitally. This has then enabled us to analyze large datasets from longer time
    periods and produce meaningful information that can improve or help to solve a
    problem and understand the cause.


    In this chapter, we will cover the use of Azure Storage, Azure SQL Database, and
    Azure Cosmos DB, or a combination of them, to determine the operational needs,
    latency requirements, and transaction requirements for your data. We will present
    a microservices solution that includes some web APIs, and each API will use a
    different data service.


    In this chapter, we’re going to cover the following main topics:


    +   - An overview of data classification and data concepts

    +   - Exploring relational data concepts in Azure

    +   - Exploring non-relational data concepts in Azure

    +   - Exploring modern data warehouse analytics

    +   - Getting started building with Power BI


    # An overview of data classification and data concepts


    At some point in the design and implementation of your application, the developer
    or architect needs to determine the type, format, and location of the data to
    collect.


    Data is a strategic, valuable asset. A holistic approach to data storage and data
    processing and an openness to new ideas can lead to incredible possibilities for
    taking applications to a new level and ensuring a stable and organized data stock.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Data is a set of collected information and facts, which can be numbers, character
    strings, and/or observations, to help us in decision-making. We can classify data
    into two classes, structured and semi-structured (unstructured):


    +   - **Structured data:** This is tabular data that follows a schema, which implies
    that all data has the same properties, called fields. Structured data can be stored
    in a database table. To search for data inside a table that shares the same schema,
    we have query languages such as **Structured Query Language (SQL)**. A table is
    made up of rows and columns.

    +   - **Unstructured data:** This is also called semi-structured data. It does
    not fit in tables, rows, and columns, and does not reside in a relational database,
    but still has some structure because it uses a data serialization language. Semi-structured
    data uses tags or keys that organize and provide a hierarchy for databases and
    graphs. We can also use the **JavaScript Object Notation (JSON)** format.


    > **Important note**

    > Semi-structured data is also known as non-relational or not only SQL (NoSQL)
    data.


    # Exploring relational data concepts in Azure


    Relational database systems allow us to store and manage transactional and analytical
    data in organizations of all sizes around the world.


    In a relational database, we model collections of entities from the real world
    as tables. Let’s take the example of a solution for booking an appointment with
    a selected doctor. We might create a table for patients, doctors, and appointments.
    Every table will include rows, and each row will represent a single instance of
    an entity. Each row in a patient table contains the data for a single patient,
    each row in a doctor table defines a single doctor, and each row in an appointment
    table represents a patient that booked an appointment with a specific doctor.
    We will get more information related to the time and date of the appointment.


    SQL is used to represent and search for data in a relational database. Common
    SQL statements used are SELECT, INSERT, UPDATE, DELETE, CREATE, and DROP to accomplish
    multiple tasks that need to be done in a database.


    Microsoft Azure provides several services for relational databases, allowing you
    to run popular relational database management systems, such as SQL Server, PostgreSQL,
    and MySQL, in the cloud. You can select the relational database management system
    that best suits your needs and store your relational data in the cloud.


    Most Azure database services are fully managed, which means that we save time
    by not having to manage databases. They have enterprise-class performance with
    built-in high availability that lets you scale quickly and achieve global distribution
    without caring about costly downtime. Developers'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'can take advantage of industry-leading innovations such as built-in security
    with automatic threat detection and monitoring, which automatically adjusts to
    improve performance. In addition to all these features, you have guaranteed uptime.


    When you decide to migrate your database to Azure or extend your on-premises SQL
    Server solution, you can move it to a virtual machine. We can use SQL Server for
    Azure virtual machines, for example. It allows you to run full instances of SQL
    Server in the cloud without having to manage on-premises hardware. However, this
    approach, known as lift and shift or infrastructure as a service, is not recommended
    because you have to manage your database. Azure offers a **Platform as a Service
    (PaaS)** that contains a series of **Database Management Systems (DBMSs)** managed
    by Microsoft in the cloud. Let’s explore them!


    We will start with **Azure SQL Managed Instance**. This is a **PaaS** option that
    is compatible with on-premises SQL Server instances while abstracting the underlying
    hardware and operating system. This service includes the automatic management
    of software updates, backups, and other maintenance tasks, reducing administrative
    costs when supporting database server instances.


    We also have **Azure SQL Database**, which is a fully managed database designed
    for the cloud and is a highly scalable PaaS database service. You are able to
    create a managed database server in the cloud, and then deploy your databases
    on this server. This service contains the core database-level capabilities of
    SQL Server on-premises but not all its features. It is recommended to use it when
    building new cloud-oriented applications.


    We have three options for Azure SQL Database:


    +   - The first is a single database that allows you to set up and run a single
    SQL Server database.

    +   - The second is an elastic pool. This is similar to a single instance – however,
    by default, several databases can share the same resources, such as memory, processing
    power, and data storage space.

    +   - The last is a managed instance, which is a fully managed database instance
    designed for the easy migration of on-premises SQL databases.


    These deployments have three different service tiers that you can choose from:


    +   - **General Purpose**: Designed for standard workloads, this is the default
    tier.

    +   - **Business Critical**: Designed for high-throughput applications and **online
    transaction processing (OLTP)**, this tier offers high resilience and the best
    performance with low latency.

    +   - **Hyperscale**: This is an extension of the Business Critical tier. This
    tier is designed for large-scale OLTP deployments with autoscaling for compute
    resources such as compute and storage.


    Now we have covered the different concepts of relational data in Azure, we’ll
    move on to talking about **Azure SQL Edge**, which is an SQL engine that is optimized
    for **Internet of things (IoT)** scenarios that need to work with streaming time-series
    data.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Exploring non-relational data concepts in Azure


    When we start building a new application, we need to think about how to store
    data. This usually takes the form of a relational database, where data is organized
    in linked tables and managed using SQL. However, many applications don’t need
    the rigid structure of a relational database; we can use non-relational storage
    (commonly known as NoSQL).


    Let’s explore some characteristics of non-relational data. Non-relational data
    doesn’t follow the rules of relational data. In its native form, data can be loaded
    quickly. If you have unknown data or queries, non-relational data will be more
    flexible and better than relational data, but it is less good for known data structures
    and known queries.


    Entities have highly variable structures. For example, in a medical appointment
    database that stores information about patients, a patient can have more than
    a telephone number, landline, and mobile number. They can add multiple telephone
    numbers, such as a business number and another home phone number. Similarly, the
    addresses of patients might not always follow the same format. Addresses can be
    different according to states, regions, postal codes, and countries.


    Let’s discuss another scenario. If you ingest data, you want the process of capturing
    the data and saving it to be fast. When you want to process data and manipulate
    it in a set of rows in several tables of a relational database, at this stage,
    choosing a relational database is not appropriate because we have to transform
    the unstructured data into a compatible format before storing it in the database,
    which can cause latencies; even the search for information will be difficult to
    manage.


    The entities will be stored in a set of collections or a container, not in a table
    like relational databases – but if we have two entities in the same collection,
    what happens? They will have a different set of fields, not like a set of columns
    in a relational table. The absence of a fixed schema leads to a description for
    each entity. For example, a non-relational collection of patient entities might
    look like this:


    ```

    ## Patient 1

    ID: 1

    Name: Hamida Rebai

    Telephone: [ Home: 1-444-9999999, Business: 1-555-5555555,

    Mobile: 1-444-4444444 ]

    Address: [ Home: 2110 Rue De la Cantatrice Quebec, G2C0L6,

    Canada,

    Business: Marly Quebec G1X2Z2]

    ## Patient 2

    ID: 2

    Title: Mr

    Name: Rayen Trabelsi

    Telephone: [ Home: 0044-1999-333333, Mobile: 0044-17545-444444]

    Address: [ FR: 86 High Street, Town X, County Y, 15000, FR,

    US: 333 7th Street, Another Town, City A, CA, 111111]

    ```'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'In the previous example, we have fields that are preceded by a name. These
    fields can have one or more sub-fields, the same as for names. Brackets have been
    used to identify subfields of fields. If we want to add a new patient, we need
    to insert an entity with its fields labeled in a meaningful way. If an application
    queries this data, the application must have the ability to parse the information
    in the retrieved entity.


    Entities inside a collection are usually stored in key-value format. The simplest
    type of non-relational database allows an application to specify a unique key
    or set of keys as a query condition. In the patient example, the database allows
    the application to query the patient by **identity (ID)** only.


    To filter the data based on other fields, you need to scan the entire collection
    of entities and analyze each entity in turn, and then apply any query criteria
    to each entity to find a match. A query that retrieves patient details by identity
    can quickly identify the whole entity. A query that tries to find all customers
    with FR addresses must iterate over each entity and examine each field of each
    entity in turn. If the database includes 1 million entities, this query could
    take a long time to execute.


    Now we have covered the different concepts of non-relational data in Azure, we’ll
    move on to talking about modern data warehouse analytics.


    # Exploring modern data warehouse analytics


    In the age of data mining, most organizations have multiple data stores, often
    with different structures and varying formats because we may need to collect data
    from multiple resources. They often have live incoming streams of data, such as
    sensor data in the case of IoT solutions and it can be expensive to analyze this
    data. There is often a wealth of useful information available outside the organization.
    This information could be combined with local data to add insights and enrich
    understanding. By combining local data with useful external information, it’s
    often possible to gain insights into the data that weren’t previously possible.
    The process of combining all of the local data sources is known as **data warehousing**.
    The process of analyzing streaming data and data from the internet is known as
    **big data analytics**. Azure Synapse Analytics combines data warehousing with
    big data analytics.


    In this section, we will explore the different concepts of data warehousing. We
    will discuss the Azure data services to be used for modern data warehouses and
    the data warehouse architecture and workload.


    # Exploring data warehousing concepts


    A modern data warehouse might contain a mixture of relational and non-relational
    data, including files, social media streams, and IoT sensor data. Azure provides
    a collection of services you can use to build a data warehouse solution, such
    as **Azure Data Factory (ADF)**, Azure Databricks, Azure Synapse Analytics, Azure
    Data Lake Storage, and Azure Analysis Services. You can use tools such as Power
    BI to analyze and visualize the data, generating reports, charts, and dashboards.


    Any modern data warehouse solution should be able to provide access to raw data
    streams and business insights from that data.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Azure data services for modern data warehouses


    In this section, we will further discuss the data services provided by Azure.
    These services allow you to combine data from multiple sources, reformat the data
    into analytic models, and save those models for later queries, reports, and visualizations.


    To implement a modern data warehouse using Azure database services, we will use
    these services:


    +   - **ADF** is an Azure cloud-based data integration PaaS solution that allows
    you to orchestrate and automate data movement and data transformation. Data integration
    is the process of combining data from multiple sources and providing an integrated
    view of it.

    +   - **Azure Data Lake** is built on Azure Blob Storage, Microsoft''s object
    storage solution for the cloud. This solution features cost-effective tiered storage
    and high availability/disaster recovery capabilities. It integrates with other
    Azure services such as ADF, a tool for creating and running **extract, transform,
    load (ETL)**, and **extract, load, transform (ELT)** processes.

    +   - **Azure Databricks** is a cloud-based platform that leverages Spark for
    big data processing with built-in SQL database semantics and management interfaces
    for rich data analytics and machine learning. It is a cloud-integrated version
    of Azure for the Databricks platform. With Databricks, we are able to use existing
    Databricks and Spark skills to create an analytical data store. We can also use
    Azure Databricks'' native notebook support to query and visualize data in an easy-to-use
    web-based interface.

    +   - **Azure Synapse Analytics** is an integrated end-to-end solution for data
    analytics at scale. It includes multiple technologies and capabilities to combine
    the data integrity and reliability of a scalable, high-performance SQL Server-based
    relational data warehouse with the flexibility of a data lake and open source
    Apache Spark. It also contains native support for log and telemetry analytics
    using Azure Synapse Data Explorer pools and built-in data pipelines for data ingestion
    and transformation.

    +   - **Azure Analysis Services** is a fully managed PaaS. It delivers cloud-oriented
    enterprise-grade data models. In Azure Analysis Services, we can use advanced
    mashup and modeling capabilities in order to combine data from multiple data sources
    into a single trusted semantic tabular data model, define metrics, and secure
    our data.

    +   - **Azure HDInsight** is an enterprise-class, open source, managed full-spectrum
    analytics service in the cloud. It is a cloud distribution of Hadoop components.
    With HDInsight, you can use open source frameworks such as Apache Spark, Apache
    Hive, LLAP, Apache Kafka, and Hadoop in your Azure environment.

    +   - **Microsoft Purview** is an enterprise-wide data governance and discoverability
    solution, with features such as the ability to create a map of data and track
    the data lineage across different data sources and systems so you can find reliable
    data for reporting and analytics. In order to enforce data governance across an
    organization, we can use Microsoft Purview. Microsoft Purview ensures the integrity
    of the data used to support analytical workloads.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Getting started building with Power BI


    Microsoft Power BI is a collection of software services, applications, and connectors.
    They work together to transform unrelated data sources into coherent information,
    in a visually immersive and, above all, interactive way, facilitating the exploitation
    of the data afterward.


    Data can be diverse – for example, a Microsoft Excel data workbook or a collection
    of cloud-based and on-premises hybrid data warehouses. Power BI makes it easy
    to connect to these data sources, view (or exploit) what is important, and share
    it according to permissions or for everyone by being public.


    Power BI has a Microsoft Windows desktop application called Power BI Desktop,
    an online Software-as-a-Service (SaaS) service called the Power BI service, but
    another mobile version is available on any device using the native BI mobile application
    for Windows, iOS, and Android apps.


    In the next section, we will see how to install and configure Power BI Desktop.


    # Power BI Desktop


    To install Power BI Desktop, you can follow this link to download it from Windows
    Store: https://aka.ms/pbidesktopstore. Or, you can download it using this link:
    https://go.microsoft.com/fwlink/?LinkID=521662. You must manually update it periodically:


    ![](img/66aceec30d3e7dead2f71bb68a887688_161_0.png)


    Figure 6.1 – Power BI Desktop interface


    Before signing in to Power BI, you need to create an account. Go to this link
    and use your email address: https://app.powerbi.com/. If you need more details
    related to the Power BI service, you can follow this documentation link: https://learn.microsoft.com/en-us/power-bi/consumer/end-user-sign-in.'
  merge: -1
