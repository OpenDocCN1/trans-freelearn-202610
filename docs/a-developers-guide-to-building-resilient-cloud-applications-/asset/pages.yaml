    This is used to choose an account type that matches your storage needs and optimizes
    your costs.


    A storage account contains all Azure Storage data objects, such as blobs, files,
    and disks.


    In the next section, we will start exploring Azure Table Storage.


    # Exploring Azure Table Storage


    Azure Table Storage provides support for storing structured data. It implements
    a NoSQL key-value model, which means that it doesn’t have any concept of relationships,
    stored procedures, secondary indexes, or foreign keys.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Azure Table Storage is not the only service you can use to work with semi-structured
    data. So, why use this service instead of other options? Let’s start by listing
    the benefits:


    +   - Azure Table Storage can store petabytes of data at a low cost, which is
    really important when it comes to building highly scalable applications where
    thousands or even millions of users interact with them.

    +   - Azure Table Storage also supports a flexible data schema, which is excellent
    for flexible datasets, such as web applications, user data, device information,
    and metadata. The flexible data schema allows you to modify application data models
    without having to stick to a particular schema.

    +   - You can also quickly query data by using a clustered index. A clustered
    index defines the order in which data is physically stored in a table and is great
    when it comes to performance. But other than clustered indexes in Azure Table
    Storage, it’s possible to perform Open Data-based queries (Odata-based queries),
    and by using these queries, you can define the query options directly from the
    URL path.

    +   - Working with Azure Table Storage is easy because you can either manipulate
    your data from Azure Storage Explorer or directly from a .NET or .NET Core application
    by using the Azure Tables client library for .NET. You can check it out at this
    link: https://github.com/Azure/azure-sdk-for-net/blob/main/sdk/tables/Azure.Data.Tables/README.md.


    In the following diagram, we can see a key, which is unique and used to identify
    an item stored, and a value, which is a set of fields:


    ![](img/66aceec30d3e7dead2f71bb68a887688_185_0.png)


    Figure 8.6 – Key value in Azure Table Storage


    How does it work inside Azure Table Storage? It splits the table into a set of
    partitions, which facilitates rapid access to data. This mechanism groups the
    related rows that have a common property or partition key. Rows sharing the same
    partition key will be stored in the same place.


    Inside these Azure Table Storage accounts, we can have tables. A table always
    represents either a collection of rows or a single row. There is no requirement
    to define the schema for a specific table, meaning you can store data with different
    properties within the same table. So, we said that inside storage accounts, we
    have tables. Now, inside tables, we have rows, and a row is a set of data with
    a single property or multiple properties. A row is similar to a database role
    in SQL databases.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'A partition can be updated by adding or removing rows. A table includes any
