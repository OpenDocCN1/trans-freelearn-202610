    # Important note


    You will need to enable the admin user for your Container Registry. Select Access
    keys under Settings for your Container Registry and then select Enabled for Admin
    user. This option enables the use of the registry name as the username and the
    admin user access key as the password to allow Docker to log in to your Container
    Registry.'
