    We will be modifying the result sent back to the client as follows:


    ```

    find-and-replace from="price_billing" to="price" />

    ```


    In Outbound Processing, we are able to modify the response before it is sent to
    the client.


    # Summary


    In this chapter, we learned about the different components of the API Management
    service and their functions. After that, we focused on the role of API gateways
    in managing calls to our APIs. Then, we learned how to secure access to APIs using
    subscriptions and certificates. We created a backend API and used Azure API Management
    to proxy a public API.


    In the next chapter, we will learn how to develop event-based and message-based
    solutions. We will explore Event Grid, Azure Event Hubs, and Azure message queues.'
