    A Data Factory is primarily a data orchestration and movement tool that calls
    other services such as Databricks to transform data. We will learn more about
    Azure Databricks in the next section.


    # Exploring Azure Databricks


    In this section, we will explore the different features of Azure Databricks. However,
    we will start by defining Azure Synapse Analytics.


    # Azure Synapse Analytics


    Databricks is a data, analytics, and AI company. This is a link to their platform:
    https://www.databricks.com/. They were the first creators of the open source versions
    of Apache Spark, Delta Lake, and MLflow. They used some of the architectural components
    of these services to compose Databricks. They tried to unify the innovation of
    the process within data science and data engineering.


    Databricks offers an interactive workspace, helping to automate the production
    workflow. This entire workspace is fully managed, and Azure is the channel that
    Databricks uses to deliver a solution that can be deployed, regardless of the
    underlying infrastructure, such as servers and virtual machines.


    # Azure Databricks features


    Azure Databricks offers multiples features:


    +   - Exploiting the Spark engine, providing features such as machine learning,
    SQL, DataFrames, low-latency streaming APIs, as well as graph APIs to help find
    relationships in a dataset

    +   - Several languages, such as Scala, Python, Java, R, and SQL, can be used
    in Azure Databricks'
  merge: -1
  img_proc: true
- pgno: 250
  md: '+   - Seamless and automatic integration of a workspace and Azure Active Directory

    +   - Easy connection with ADF to create data pipelines

    +   - Connecting the Databricks workspace to your Azure Storage so that you can
    use it as a filesystem where you can upload files to use in the workspace

    +   - Adherence to industry security standards and compliance, such as FedRAMP
    and PCI DSS


    We will explore the different components of Azure Databricks next.


    # Azure Databricks components


    When we create a new Azure Databricks resource, we must create a new Databricks
    workspace. This is the first component; a workspace is an interactive tool used
    for exploring and visualizing data. In the workspace, we have Apache Spark clusters.
    They are used to serve as a compute engine to run the workloads in Azure Databricks.
    We can share clusters among users in a workspace. A cluster is auto-scalable,
    which means that we can allocate resources based on the component of the running
    job. We can auto-terminate any inactive cluster after a specific period of inactivity.
    We also have notebooks. These are part of the workspace, allowing us to read,
    write, query, visualize, or explore a dataset. We can connect a notebook to a
    cluster to run items. We have more options in notebooks, such as saving, sharing,
    importing, and exporting them in the workspace. Now, we will create a new Databricks
    workspace using the Azure portal.


    # Creating an Azure Databricks workspace


    In this section, to set up our Azure Databricks environment, we will create an
    Azure Databricks cluster and notebooks, and walk through how to use them.


    Open the Azure portal; we will start by clicking the Create a resource button.
    Then, in the search box, type in Azure Databricks. We will click on the Create
    button to create our resource. Follow these steps:


