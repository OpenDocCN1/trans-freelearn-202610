  md: '# Working with

    Azure SQL Database


    In this chapter, we will learn how to provision and deploy Azure SQL Database
    and Azure SQL Managed Instance. We will also learn how to choose an option from
    multiple options when performing a migration to the SQL **platform as a service
    (PaaS)** platform. A web API will store data on Azure SQL Database.


    In this chapter, we’re going to cover the following main topics:


    +   - Exploring PaaS options for deploying SQL Server in Azure

    +   - Exercise 1 – deploying a single SQL database

    +   - Exercise 2 – deploying Azure SQL Database elastic pools

    +   - Exercise 3 – deploying SQL Managed Instance

    +   - Exercise 4 – connecting Azure SQL Database to an ASP.NET app


    # Exploring PaaS options for deploying SQL Server in Azure


    In this section, we will learn about the different PaaS options to deploy SQL
    Server in Azure. If we use SQL Server as a **relational database management system
    (RDBMS)**, we want to migrate our database without having to make any conversions
    or thinking about reinstalling SQL Server and configuring it again. Azure offers
    a PaaS that provides a complete development and also deployment environment that
    is easy to use for cloud-oriented applications.


    There are a couple of SQL Server options within Azure, such as SQL Server on Azure
    Virtual Machines or SQL Managed Instances.'
