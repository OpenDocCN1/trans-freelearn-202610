    # Importing an API


    This section shows you how to import and publish an OpenAPI Specification backend
    API (formerly known as the Swagger Specification).


    In this section, you''ll learn about the minimal web API used in our sample.


    # Introduction to the minimal web API


    This is a new approach for building APIs without all the complex structure of
    a model-view-controller (MVC) that is minimal according to the name. It includes
    the essential components needed to build HTTP APIs. All you need are csproj and
    program.cs.


    The following are the benefits of using the Minimal Web API:


    +   - It is less complex than using ASP.NET Web API

    +   - It is easy to learn and use

    +   - You don’t need the MVC structure – no controllers!

    +   - It requires minimal code to build and compile the application, which means
    the application runs much faster, so better performance

    +   - It has the latest improvements and functionalities of .NET 6 and C#10'
