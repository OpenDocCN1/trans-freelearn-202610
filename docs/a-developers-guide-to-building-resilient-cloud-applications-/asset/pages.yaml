  md: '+   - **Geo-zone-redundant storage (GZRS)**: This is the best option for critical
    data scenarios because it offers optimal data protection, including a combination
    of the features of GRS and ZRS.


    In the following figure, you can see the options for configuring redundancy:


    ![](img/66aceec30d3e7dead2f71bb68a887688_184_0.png)


