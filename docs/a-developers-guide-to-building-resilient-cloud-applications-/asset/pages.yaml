- pgno: 190
  md: 'Azure currently supports three different types of blobs:


    +   - **Block blobs**: A block blob is managed as a set of blocks. The size of
    each block varies up to 100 MB. A block blob can contain up to 50,000 blocks.
    The maximum size is over 4.7 TB. A block is the smallest amount of data that can
    be read or written as a unit. Block blobs are great for storing separate large
    binary objects that rarely change.

    +   - **Page blobs**: A page blob is organized as a collection of fixed-size 512-byte
    pages. A page blob is optimized to support random read and write operations; you
    can fetch and store data for a single page if necessary. A page blob can hold
    up to 8 TB of data. Azure uses page blobs to implement virtual disk storage for
    virtual machines.

    +   - **Append blobs**: Append blobs are like block blobs but more optimized to
    support a new feature, that is, to append operations. You can only add blocks
    to the end of an append blob. Updating or deleting existing blocks is not supported.
    Each block can be of various sizes up to 4 MB. The maximum size of an append blob
    is slightly over 195 GB.


    Blobs are stored in containers, which allows you to organize your blobs depending
    on your business needs.


    This diagram presents the structure of Azure Blob Storage and how we can use an
    Azure account with containers and blobs:


    ![](img/66aceec30d3e7dead2f71bb68a887688_190_0.png)


    Figure 8.13 – Storage account – containers and blobs


    Now, let’s configure Blob Storage. We will use the same Azure Storage account:


    +   1. Create a new container. Go to **Storage browser**, select **Blob containers**,
    and then click on **Add container**:'
