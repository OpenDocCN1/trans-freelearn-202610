- pgno: 231
  md: '# Big Data Storage Overview


    Companies that use modern systems generate large volumes of heterogeneous data.
    This data must be exploited for marketing reasons or to make internal improvements
    to a product. This heterogeneous data demonstrates that a single data store is
    generally not the best approach.


    It is also recommended to store different types of data in different data stores
    so that each one is geared toward a specific workload or usage pattern. If we
    use a combination of different data storage technologies, we are using what is
    called polyglot persistence. It is important to understand what Azure offers as
    a service for storing data warehouses and how we can use and analyze all that
    data.


    In this chapter, we will explore big data storage and define Azure Data Lake Storage
    scalability, security, and cost optimization work. You will learn how to create
    a more secure, high-performance framework for data analytics.


    In this chapter, we’re going to cover the following main topics:


    +   - Exploring Azure Data Lake Storage

    +   - Exploring Azure Data Factory

    +   - Exploring Azure Databricks

    +   - Exploring Azure Synapse Analytics

    +   - Exploring Azure Analysis Services


    # Exploring Azure Data Lake Storage


    Azure Storage includes five Azure services:


    +   - Azure Blob Storage, which is scalable storage for unstructured data

    +   - Azure Queue Storage, which allows us to build a reliable queue of messages

    +   - Azure Table Storage, which provides support for storing structured data

    +   - Azure Files Storage, which is used for cloud-based file shares

    +   - Azure Disks Storage, which provides managed storage for virtual machines
    disks'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Big Data Storage Overview


    A data lake is a form of file storage, typically on a distributed filesystem for
    high-performance data access. The technologies that are commonly used to process
    queries against stored files and return data for reporting and analysis are Spark
    and Hadoop. These systems rely on a read-schema approach, which defines a tabular
    schema for semi-structured data files, where the data is parsed as it is read
    and no restrictions are applied when it is saved. Data lakes are ideal for supporting
    a mix of structured, semi-structured, and unstructured data that you want to analyze
    to avoid applying schemas when the data is written to storage.


    Azure Data Lake Gen2 technology is created on top of Azure Blob Storage and supports
    most Blob Storage features. More benefits are related to Azure Data Lake, such
    as supporting the hierarchical namespaces, which means that we can store data
    in a file-like structure. This benefit improves the performance of the directory-managed
    operations to provide better support for a large-scale analytical engine.


    In this section, we will start by exploring Azure Data Lake Storage. Azure Data
    Lake Storage combines the power of a high-performance filesystem with a large-scale
    storage platform to give you quick insights into your data.


    Azure Data Lake Storage Gen2 builds on Azure Blob Storage features to optimize
    it, especially for analytical workloads. If you’ve used Hadoop Distributed File
    System, we can treat the data in the same way. With this feature, you can store
    your data in one place and access it through various Azure compute services, such
    as Azure Databricks, HDInsight, and SQL Data Warehouse. Data Lake Storage Gen2
    supports ACLs and POSIX permissions. We can set a granular level of permissions
    at the directory or file level for data stored within the data lake. Azure Data
    Lake Storage organizes stored data by following a hierarchy of directories and
    subdirectories, such as a filesystem for easy navigation, which improves the performance
    of each directory-managed operation. This organization allows us to provide better
    support for a large-scale analytical engine, improved querying performance using
    data partitioning, and better file and data management.


    The cost of storing data in Azure Data Lake Storage is the same as storing data
    in Azure Blob Storage. There is a slight increase in transaction costs for data
    access, but in many cases, these cost increases must be balanced against the need
    for fewer transactions due to more efficient queries. Overall, Azure Data Lake
    Storage allows you to build secure, enterprise-scale data lakes. It offers many
    of the benefits of Azure Blob Storage while doing so at minimal additional cost.


    A good use case for Blob storage is archiving infrequently used data or storing
    website assets such as images and media. Azure Data Lake Storage Gen2 plays a
    fundamental role in any Azure data architecture. These architectures include building
    modern data warehouses, advanced analytics on big data, and real-time analytics
    solutions.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Common to all architectures, there are four phases of processing big data solutions:


    +   1. The ingestion phase identifies the technologies and processes used to ingest
    the source data. This data can come from files, logs, and other types of unstructured
    data that need to be placed in Data Lake Storage.


    +   2. The storage phase identifies where to store the recorded data. In this
    case, we use Azure Data Lake Storage Gen2. This phase is presented in the following
    figure:


    ![](img/66aceec30d3e7dead2f71bb68a887688_233_0.png)


    Figure 10.1 – Ingestion phase – Azure Data Lake Storage Gen2


    +   3. The preparation and training phase identifies the technologies used to
    conduct, prepare, and model the training and subsequent scoring of the data science
    solution. Common technologies used in this phase are Azure Databricks, Azure HDInsight,
    and Azure Machine Learning.


    +   4. Finally, the model and deployment phase includes the technology that presents
    data to users. This includes visualization tools such as Power BI and data stores
    such as Azure Synapse Analytics, Azure Cosmos DB, Azure SQL Database, and Azure
    Analysis Services. Combinations of these technologies are often used, depending
    on business needs.


    Common file formats for general-purpose storage in Azure Data Lake include Excel,
    XML, JSON, binary, Avro, delimited, Optimized Row Columnar (ORC), and Parquet.


    We will create a new Azure Data Lake solution using the Azure portal and the Azure
    CLI in the following subsections.'
  merge: -1
  img_proc: true
