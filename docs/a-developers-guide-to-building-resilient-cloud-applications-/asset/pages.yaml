    # Exercise 1 – deploying a single SQL database


    In a single database, each database is isolated; so, every database is billed
    and managed independently in terms of scope, scale, and data size. We have two
    models; the first one is a DTU-based purchasing model that provides a set of prices
    versus the performance packages to select for easy configuration, and the second
    one is a vCore-based purchasing model that offers a wide range of configuration
    controls and also provides **Hyperscale** and **Serverless** options to automatically
    scale your database according to your needs and the required resources. In both
    models, each database has its own dedicated resources with its own service tier,
    even if they are deployed on the same logical server. This is why it is considered
    a deployment model for Azure SQL Database.


    We will start by creating a SQL database. We’ll use the same page as shown in
