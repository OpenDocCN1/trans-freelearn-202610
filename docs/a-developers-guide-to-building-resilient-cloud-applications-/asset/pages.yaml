  md: 'Don''t forget to add the Microsoft.Azure.WebJobs.Extensions.DurableTask NuGet
    package, as presented in the following screenshot:


    ![](img/66aceec30d3e7dead2f71bb68a887688_123_0.png)


    You can implement your orchestrator according to your needs and add or delete
    the generated methods.


    We can create an orchestrator function using the Azure portal. In Azure Functions,
    we will select Functions from the left pane, then select Add from the top menu.


    In the search field of our new function page, we can use the durable keyword and
    then select the Durable Functions HTTP starter template.


    We are requested to provide a function name. After, we can click on the Create
    function.


    We implemented an orchestrator function using Visual Studio 2022, but let''s review
    some of the orchestration patterns that Durable Functions provides. We will start
    with the function chaining pattern.


    # Function chaining


    Function chaining is where we need to execute a sequence of activity functions
    following a specified order. The orchestrator function will keep track of where
    we are in the sequence:'
  merge: -1
  img_proc: true
- pgno: 124
  md: '![](img/66aceec30d3e7dead2f71bb68a887688_124_0.png)


    Figure 4.30 – Function chaining pattern


    Durable Functions makes it easy to implement this pattern in your code. Another
    pattern will be presented in the next section: fan-out, fan-in.


    # Fan-out, fan-in


    Fan-out, fan-in is a pattern that runs multiple activity functions in parallel
    and then waits for all the activities to finish. The results of the parallel executions
    can be aggregated and used to compute a final result. This pattern is very hard
    to use without a framework such as Durable Functions:


    ![](img/66aceec30d3e7dead2f71bb68a887688_124_1.png)


    Figure 4.31 – Fan-out, fan-in pattern


    This pattern is much more challenging, but the Durable Functions extension handles
    it with simple code.


    # Asynchronous HTTP APIs


    Asynchronous HTTP APIs are useful when you have an API that you need to repeatedly
    pull for progress. We start a long-running operation, and then the orchestrator
    function can manage the pulling until the operation has completed or timed out:'
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/66aceec30d3e7dead2f71bb68a887688_125_0.png)


    Figure 4.32 – Asynchronous HTTP APIs pattern


    The Durable Functions runtime manages the state. We are not going to implement
    the status-tracking mechanism. In the next section, we will explore the monitor
    pattern.


    # Monitor pattern


    The monitor pattern implements a recurring process in a workflow, looking for
    a change in state. We use this pattern to repeatedly call an activity function
    that''s checking to see whether certain conditions are met:


    ![](img/66aceec30d3e7dead2f71bb68a887688_125_1.png)


    Figure 4.33 – Monitor pattern


    To create multiple monitors in order to observe arbitrary endpoints, we use Durable
    Functions with a few lines of code. We will see the last pattern, human interaction,
    in the next section.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Human interaction


    Human interaction is very common in business workflows to require manual approval
    where the workflow must pause until a human has interacted in some way. This pattern
    allows workflows to wait for certain events to be raised and then optionally perform
    a mitigating action if there’s a timeout waiting for the human interaction:


    ![](img/66aceec30d3e7dead2f71bb68a887688_126_0.png)


    Figure 4.34 – Human interaction pattern


    A durable timer is used by the orchestrator function to request approval. If a
    timeout occurs, the orchestrator will escalate. But the orchestrator keeps waiting
    for any external event—for example, a notification generated by human interaction.


    # Summary


    During this chapter, we learned about Azure Functions. We developed Azure Functions
    and durable functions and learned how we deploy them in Azure Functions. We explored
    how we create a function using the portal, Visual Studio 2022, and Visual Studio
    Code.


    In the next chapter, we will learn about Azure Service Fabric’s main benefits,
    as well as how to build Service Fabric applications for the cloud or on-premises.


    # Questions


    +   1. Do we need to add more packages for Durable Functions?

    +   2. What are durable functions in Azure?'
