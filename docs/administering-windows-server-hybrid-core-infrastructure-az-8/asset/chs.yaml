  | 读取 | 获取虚拟机实例视图 | 获取虚拟机及其资源的详细运行时状态 |

  | 读取 | 获取虚拟机度量定义 | 读取虚拟机度量定义 |

  | 读取 | 获取虚拟机运行命令 | 获取虚拟机运行命令的属性 |

