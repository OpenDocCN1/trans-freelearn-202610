  \ 练习 – 创建标准性能 Azure 文件共享\n\n在本练习中，我们将使用标准存储帐户实现 Azure 文件共享。\n\n按照以下步骤开始：\n\n- 1.\
  \ 登录 `https://portal.azure.com` 上的 Azure 门户。或者，可以使用 Azure 桌面应用：`https://portal.azure.com/App/Download`。\n\
  - 2. 在搜索栏中输入 `storage account`；单击显示的 `Services` 列表中的 `Storage accounts`。\n- 3. 从\
  \ `Storage account` 边栏选项卡，为本练习创建一个新存储帐户以创建文件共享，或使用上一练习中的现有存储帐户。本练习中，存储帐户的 `Performance`\
  \ 类型必须为 `Standard`。\n- 4. 在 `Data storage` 部分中，从标准存储帐户单击 `File shares`：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_308_0.png)\n\
  \n- 5. 通过顶部导航菜单单击 `+ File share`：\n\n\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_309_0.png)\n\
  \n图 8.24 – 文件共享边栏\n\n- 6. 在“新建文件共享”边栏中，为文件共享输入名称。\n- 7. 对于层级，将鼠标悬停在信息符号上以获取选择层级的上下文相关帮助。保持层级设置为“事务优化”，并查看该层级显示的信息：\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_309_1.png)\n\n图 8.25 – 新建文件共享边栏\n\n-\
  \ 8. 单击 **创建**。\n- 9. 将收到一条消息，指出文件共享已成功创建。\n- 10. 现在可以在 **“文件共享”** 边栏中看到文件共享：\n\n\
  ![](img/cf35f46a8dd5f11e58349c1d81611b75_310_0.png)\n\n图 8.26 – 文件共享边栏\n\n- 11.\
  \ 单击 *已创建的文件共享*，查看打开的页面上的信息和设置：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_310_1.png)\n\
  \n图 8.27 – 文件共享边栏\n\n- 12. 单击 **连接** 以查看连接信息：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_311_0.png)\n\
  \n图 8.28 – 连接边栏\n\n- 13. 单击 **“访问控制 (IAM)”** 以查看有关 **基于身份的身份验证** 的信息；单击 **“了解详细信息”**\
  \ 超链接以获取更多信息：\n\n主页 > smaz800sa01 | 文件共享 > share01\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_311_1.png)\n\
  \n图 8.29 – “访问控制 (IAM)”边栏\n\n至此，我们已完成此练习。此练习教会了我们使用标准存储创建 Azure 文件共享的技能。在下一个练习中，我们将使用高级存储帐户实现\
  \ Azure 文件共享。\n\n### 练习 – 创建高级性能 Azure 文件共享\n\n在此练习中，我们将使用高级存储帐户实现 Azure 文件共享。\n\
  \n按照以下步骤开始：\n\n- 1. 登录 https://portal.azure.com 中的 Azure 门户。或者，可以使用 Azure 桌面应用：https://portal.azure.com/App/Download。\n\
  - 2. 在搜索栏中输入存储帐户；从显示的服务列表中单击“存储帐户”。\n- 3. 从“存储帐户”边栏中，为此练习创建新存储帐户。存储帐户的性能类型必须为高级，且高级帐户类型必须为文件共享，才能用于此练习。\n\
  - 4. 在高级存储帐户的“数据存储”部分下，单击“文件共享”：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_312_0.png)\n\
  \n图 8.30 – 存储帐户屏幕\n\n- 5. 在“文件共享”边栏的顶部导航栏中单击 + 文件共享 以创建新文件共享。\n- 6. 为文件共享输入名称。\n\
  - 7. 输入预配容量。\n- 8. 查看显示的性能信息。\n\n- 9. 根据需要选择 SMB 或 NFS 协议：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_313_0.png)\n\
  \n图 8.31 – 新建文件共享边栏\n\n- 10. 查看通过端口 445 的通信信息。\n- 11. 单击 **创建**。\n- 12. 将收到一条消息，指出文件共享已成功创建。\n\
  - 13. 现在可以在 **“文件共享”** 边栏中看到文件共享：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_314_0.png)\n\
  \n图 8.32 – 文件共享边栏\n\n- 14. 单击 *已创建的文件共享*，查看打开的页面上的信息和设置。\n- 15. 单击 **连接** 以查看连接信息和端口\
  \ 445 通信问题：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_314_1.png)\n\n图 8.33 – 连接边栏\n\
  \n- 16. 单击访问控制 (IAM) 以查看有关基于身份的身份验证的信息；单击了解详细信息超链接以获取更多信息：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_315_0.png)\n\
  \n图 8.34 – “访问控制 (IAM)”边栏\n\n至此，我们已完成此练习。此练习教会了我们使用高级存储帐户实现 Azure 文件共享的技能。现在，让我们总结本章。\n\
  \n### 摘要\n\n本章首先介绍了 Azure 中可用的存储服务、其用例以及在实际场景中可能选择每种服务的位置。然后，我们探讨了如何实现 Azure 文件服务和\
  \ Azure 文件同步，以及如何将服务从 DFS-R 迁移。我们通过一些实操练习结束本章，为您提供宝贵的实用技能。\n\n我们确保涵盖了 AZ-800 Administering\
  \ Windows Server Hybrid Core Infrastructure：管理存储和文件服务。\n\n本章旨在使您的知识超越考试目标；我们随所提供的内容新增了技能和学习内容。这将帮助您发展本地网络基础设施服务的知识和技能，并使您能够胜任现实世界中以日常混合环境为重点的角色。\n\
  \n在下一章中，您将学习如何在 Windows Server 上实现 Hyper-V。\n\n### 进一步阅读\n\n本节提供其他学习参考和考试信息的链接：\n\
  \n- [Microsoft Certified: Windows Server 混合管理员助理](https://docs.microsoft.com/en-us/learn/certifications/windows-server-hybrid-administrator/)\n\
  - *考试 AZ-800：管理混合核心基础设施的 Windows Server：https://docs.microsoft.com/en-us/learn/certifications/exams/az-800*\n\
  - *考试 AZ-800：学习指南：https://query.prod.cms.rt.microsoft.com/cms/api/am/binary/RWKI0r*\n\
  - *Microsoft Learn：https://docs.microsoft.com/en-us/learn/modules/implement-hybrid-file-server-infrastructure/*\n\
  \n### 技能检查\n\n通过回答以下问题，检查您在本章中学到的内容：\n\n- 1. Azure 中有哪四种存储类型？\n- 2. 什么是存储帐户？\n-\
  \ 3. 可以创建哪些存储帐户类型？\n- 4. 可以更改存储帐户的性能类型吗？\n- 5. 什么是 Azure 文件？\n- 6. Azure 文件有哪些用例？\n\
  - 7. 实现 Azure 文件时需要考虑哪些因素？\n- 8. 存储层级有哪些？\n- 9. Azure 文件有哪些存储冗余选项？\n- 10. Azure\
  \ 文件有哪些加密可用？\n- 11. 存储如何受到保护？\n- 12. 有哪些存储网络/访问选项？\n- 13. 有哪些存储身份验证选项？\n- 14. 可以分配给用户的文件共享权限有哪些？\n\
  - 15. 什么是 Azure 文件同步，其用例有哪些？\n"
- '# 第 4 部分：混合计算


  本部分将全面覆盖考试中“在混合环境中管理 Windows 服务器和工作负载”以及“管理虚拟机和容器”部分所衡量的技能所需的知识和技能。


  本书的这一部分包含以下章节：


  - 第 9 章，在 Windows Server 上实现和管理 Hyper-V

  - 第 10 章，实现和管理 Windows Server 容器

  - 第 11 章，管理 Windows Server Azure 虚拟机

  - 第 12 章，在混合环境中管理 Windows Server

  - 第 13 章，使用 Azure 服务管理 Windows 服务器

