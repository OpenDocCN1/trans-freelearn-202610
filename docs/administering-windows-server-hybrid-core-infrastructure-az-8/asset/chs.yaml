  \n### 技能检查\n\n通过回答以下问题，挑战你对本章所学内容的掌握情况：\n\n- 1. 什么是 Azure AD DS？\n- 2. 说明 Azure\
  \ AD DS 与 AD DS 之间的区别。\n- 3. Azure AD DS 的使用场景有哪些？\n- 4. 在仅云标识场景中，Azure AD 与 Azure\
  \ AD DS 之间是什么关系？\n- 5. 在混合标识场景中，AD、Azure AD 与 Azure AD DS 之间是什么关系？\n- 6. 列出 Azure\
  \ AD DS 的五个关键特性。\n- 7. 创建托管域时，在 Azure AD 租户中创建了哪两个企业应用程序，它们的用途是什么？\n- 8. 在 Azure\
  \ AD 租户中创建 Azure AD DS 实例需要哪些权限？\n- 9. 用于 Azure AD DS 以及将需要使用 Azure AD DS 的工作负载的\
  \ VNet 有哪两种方法？\n- 10. 为 Azure AD DS 选择域名时需要考虑哪些关键因素？\n- 11. Azure AD DS 有哪些 SKU，它们之间有什么区别？\n\
