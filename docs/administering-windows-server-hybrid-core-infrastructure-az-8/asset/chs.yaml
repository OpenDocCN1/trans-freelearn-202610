- "## 实现和管理 Azure Active Directory 域服务\n\n本章涵盖 AZ-800 管理 Windows Server 混合核心基础设施考试的学习目标：在本地和云环境中部署和管理\
  \ AD DS。\n\n在上一章中，我们添加了技能以了解本地环境中 AD DS 的概念、创建和管理。\n\n我们将从一些概念和对 Azure AD 的理解开始本章，然后了解它与\
  \ Active Directory 的比较。接着，我们将查看如何创建和管理 Azure AD DS 托管域。最后，我们将通过一个动手练习来进一步提升您的技能。\n\
  \n本章将涵盖以下主题：\n\n- 什么是 Azure AD？\n- 什么是 Azure AD DS？\n- 创建 Azure AD DS 托管域\n- 管理\
  \ Azure AD DS 托管域\n- 练习 – 安装 Azure AD DS\n\n在深入任何服务创建或管理之前，我们将查看一些定义和概念，以建立知识基线和基础，以便在此基础上构建。我们从定义\
  \ Azure AD 开始本章。\n\n### 什么是 Azure AD？\n\n### AD 何时不是 AD？当它是 Azure AD 时！\n\n我们将简要介绍两个目录的故事。\n\
  \n**Azure AD** 经常被笼罩在一种误解中，即它纯粹是传统基于 Windows Server 的 AD 的云等价物；在某些方面，它非常接近。在其他方面，它并非如此，因此必须理解情况并非如此，我们不应将其视为云中的\
  \ AD；只希望事情那么简单。\n\n虽然 AD 和 Azure AD 都是**身份提供者 (IDP)**，并且名称中都包含 AD，但它们的功能截然不同。\n\n\
  目前，至少在出版时，Azure AD *不能完全替代* 传统 Windows Server AD 实现的功能和能力。然而，这未必是坏事，您需要的解决方案可能不需要我们所称的\
  \ *传统 AD* 的全部功能和能力。\n\nMicrosoft 将 Azure AD 作为完全托管的 IDP 平台提供，作为 **软件即服务 (SaaS)**。\n\
  \nAD 可以使用 *Azure AD Connect* 连接到 Azure AD，这是一个免费下载的工具，允许组织建立混合身份。此工具在两个 IDP 之间同步用户身份、属性和对象。\n\
  \n与 AD 不同，Azure AD 不需要安装任何内容，且不需要域控制器，同时仍允许设备、用户和组作为目录中的对象出现。\n\nAD 和 Azure AD 提供的一些最常见服务如下图所示：\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_72_0.png)\n\n图 2.1 – AD 和 Azure AD\n\n\
  混合身份方法允许用户使用其 AD 身份访问 Azure AD 中的资源；相同的用户名和密码用于访问两个 IDP 环境中访问的资源。如果您希望继续了解混合身份和\
  \ Azure AD Connect 的更多信息，可以在以下网址找到进一步阅读材料：https://docs.microsoft.com/azure/active-directory/hybrid/whatis-azure-ad-connect。\n\
  \n### 什么是 Azure AD DS？\n\nAzure AD DS 是作为平台即服务 (PaaS) 提供的托管 Azure 身份服务；简单来说，它将域服务作为服务提供。\n\
  \n当您将 Azure AD DS 作为 Azure AD 租户的一部分实施时，您会创建一个 Microsoft 托管域，这是 AD DS 的托管实现。它提供\
  \ Kerberos/NTLM 身份验证、轻量目录访问协议 (LDAP)、域加入和组策略的功能。\n\nAzure AD DS 的用例是：在 Azure 中运行的工作负载依赖于域服务功能，且应用程序或服务无法修改或重写以利用\
  \ Azure AD 和现代身份验证（例如 OAuth、SAML 和 REST）。\n\n下图概述了如何在工作负载移至 Azure 后提供与本地相同的域功能，而无需提供您自己管理的\
  \ AD DS 实例：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_73_0.png)\n\n图 2.2 – Azure\
  \ AD DS 用例场景\n\nAzure AD DS 托管域可能是 **Azure Virtual Desktop** (AVD) 等场景的解决方案，在该场景中，您可能只有云标识，但仍依赖于\
  \ Azure AD 尚不支持的域服务。这允许您使用 Azure AD DS 的 PaaS 功能，而不是自管域控制器。结合 Microsoft 365，此方法可以提供紧密集成的解决方案。\n\
  \n将 AD DS 域控制器作为 PaaS 服务提供的优势包括无需考虑物理基础设施或逻辑组件，例如数据存储、架构、信任和分区，以及 AD DS 的可用性和保护。\n\
  \n由 Microsoft 创建的 _托管域_ 实例包含两个域控制器以实现高可用性，如果在该区域可用，则还可跨两个可用性区域实现额外的区域冗余。Microsoft\
  \ 会自动配置域控制器在各区域中的分布。\n\n托管域的一些特征如下：\n\n- 由 Microsoft 管理，而非自行管理。\n- 独立域–无法扩展或将托管域加入现有的\
  \ AD DS 林。\n- 信任仅为单向出站林信任。\n- 无域或企业管理员特权。\n- 支持域加入、LDAP 和 Kerberos/NTLM。\n- 提供两个用于计算机和用户的内置\
  \ OU 容器，以及关联的内置 **组策略对象 (GPO)**。\n- 通过扁平结构支持自定义 OU 结构和组策略。\n- 无架构扩展。\n- 域控制器作为服务提供，并由\
  \ Microsoft 管理。\n- Azure AD DS 已集成到 Azure AD 租户中，用于云标识场景，并可与 AD DS 结合用于混合身份场景。\n\
  - Azure AD DS 可通过 RSAT 工具以类似于 AD DS 的方式进行管理。\n- 对象同步为单向，从 Azure AD 到 Azure AD DS；直接对\
  \ Azure AD DS 所做的任何更改将在下次同步时被覆盖。这些应被视为只读域控制器，不得直接在域控制器上创建或更改对象。\n- 不能在托管域中重置密码；必须在\
  \ AD/Azure AD 中重置，并同步到托管域。\n\n您可以查看本章末尾 _进一步阅读_ 部分提供的链接，了解 Azure AD DS 与 AD DS 之间完整差异列表。\n\
  \n在云标识场景中，用户、密码和组在 Azure AD 租户中创建和管理，Azure AD 租户是权威目录服务和 IDP；这些对象会同步到 Azure AD DS\
  \ 托管域。\n\n托管域中的对象没有直接更改。任何更改都应在权威 IDP（在此场景中为 Azure AD）中进行，然后必须将这些更改同步到托管域才能生效。\n\
  \n如果用户的密码需要重置，则在 Azure AD 中执行此操作。此更改随后同步到托管域域控制器；建议在 AD 租户中启用自助式密码重置 (SSPR)。\n\n\
  下图显示了云标识场景中 Azure AD 与 Azure AD DS 托管域之间的关系：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_75_0.png)\n\
  \n图 2.3 – Azure AD 云标识场景\n\n如果用户的密码需要重置，则在 Azure AD 中重置。此更改随后同步到托管域域控制器；建议在 AD 租户中启用\
  \ SSPR。\n\n下图显示了混合身份场景中 AD、Azure AD 和 Azure AD DS 托管域之间的关系：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_75_1.png)\n\
  \n图 2.4 – Azure AD 混合身份场景\n\n\n\n\n在混合身份场景中，用户、密码和组在 AD 林中创建和管理，AD 林是权威目录服务和 IDP。\n\
  \n然后，这些对象使用 **AD Connect** 双向同步到 Azure AD 租户，接着对象单向同步到 Azure AD DS 托管域。在托管域中不能直接更改对象；任何更改都应在权威\
  \ IDP（在此情况下为 AD 林）中进行。这些更改随后必须使用 AD Connect 同步到 Azure AD 租户，然后再从 Azure AD 租户同步到托管域才能生效。\n\
  \n总结而言，在之前的云只和混合身份场景中，Azure AD DS 托管域不会进行任何更改。所有对象均从 Azure AD 租户同步，因此唯一的问题是对象最初如何在\
  \ Azure AD 中创建。对于云只账户，可以通过直接在 Azure AD 租户中创建对象来实现；或者，允许这些对象从 AD 域控制器通过 AD Connect\
  \ 同步在 Azure AD 租户中创建。\n\n本节总结了本章三个技能领域的第一个：*什么是 Azure AD DS？* 我们探讨了它如何提供托管域服务。在下一节中，我们将探讨本章三个技能领域的第二个：*创建\
  \ Azure AD DS*。\n\n### 创建 Azure AD DS 托管域\n\n本节将介绍创建 Azure AD DS 托管域所需的规划方面和信息，本章将以实践练习部分结束。\n\
  \nAzure AD DS 的安装在 Azure 门户中进行，需要 Azure AD 租户和 Azure 订阅。对象可以是云只对象，也可以为混合身份场景从 AD\
  \ 同步。\n\n在 Azure AD 租户中创建了两个企业应用程序以支持域的操作；这些应用程序不应被移除或编辑，包括以下内容：\n\n- 域控制器服务\n-\
  \ Azure AD 域控制器服务\n\n托管域实例由 Microsoft 创建，它将自动配置托管域控制器在各区域中的分布。\n\n以下部分将探讨在创建 Azure\
  \ AD DS 托管域之前所需的规划方面。\n\n### Azure AD 租户和订阅\n\n要创建 Azure 资源，您需要一个 **Azure 订阅**。它将充当所创建和消耗资源的逻辑容器、访问控制和计费机制。您必须将\
  \ Azure AD 租户与该订阅关联；该租户可以与 AD 同步用于混合身份场景，或采用云只身份方法。\n\nAzure AD 租户只能有一个 Azure AD\
  \ DS 托管域。请确保首先做好充分规划，因为一旦创建了托管域，您将无法更改以下任何字段：`tenant`、`subscription`、`region`、`resource\
  \ group`、`VNet` 或 `subnet`。\n\n### 创建 Azure AD DS 托管域所需的权限\n\n您应确保为希望用于创建 Azure\
  \ AD DS 托管域的帐户拥有以下权限：\n\n订阅级别具有 **所有者** 或 **参与者** 权限的帐户，或具有 **域服务参与者**、**组管理员**\
  \ 和 **应用程序管理员** Azure AD 角色的帐户。\n\n### 网络和 DNS\n\n通过 Azure AD DS 部署向导创建的默认 **虚拟网络\
  \ (VNet)** 使用名为 `aadds-vnet` 的 **专用 Azure AD DS 子网**。在名为 `aadds-subnet` 的 VNet 中仅创建一个子网。此子网不应用于托管域资源以外的任何内容；请勿将任何工作负载添加到此子网。\n\
  \n您创建的 VM 或资源应位于 `aadds-vnet` 中的自身 **工作负载子网** 中；或者，您可以创建另一个 **工作负载 VNet** 并使用 VNet\
  \ 对等互连将其连接到 Azure AD DS VNet。\n\n以下图示概述了网络拓扑的两种方法：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_77_0.png)\n\
  \n图 2.5 – Azure AD DS 网络拓扑\n\n创建 Azure AD DS 后，您将获得 *两个 IP 地址*，即 Microsoft 管理的域控制器；这些作为托管域的\
  \ *DNS 服务器*。\n\n您必须配置对等 VNet 上的 DNS，以允许资源与 Azure AD DS VNet 通信。这可以使用托管域域控制器的 IP\
  \ 地址或对等 VNet 中配置的现有 DNS 服务器来完成。应配置 DNS 以通过允许条件 DNS 转发将查询定向到托管域。\n\n### 域名\n\n您必须为托管域的域名指定一个\
  \ *DNS 名称*。必须确保选择正确的 DNS 域名，因为一旦创建，除非删除托管域并重新创建，否则无法更改它。\n\n> **注意**\n> 应规划域名以避免与任何现有\
  \ DNS 命名空间或计划命名空间冲突。\n\n托管域的 *前缀* 不能超过 **15 个字符**；这是因为这是 *NetBIOS 主机名* 支持的最大长度。\n\
  \n对于 *后缀*，您不应使用带有 *不可路由后缀* 的域名，例如 `.local`；这可能会导致 DNS 相关问题。相反，您可以使用租户目录的默认内置域名；这将使用\
  \ *.onmicrosoft.com* 后缀。这种方法的问题是，*证书颁发机构 (CA)* 不会为您颁发证书，因此您无法保护此域，因为 Microsoft 拥有该域。\n\
  \n为解决此问题，您可以使用您拥有并在 DNS 中注册的 *可路由自定义域*，在那里您有权创建和编辑 DNS 记录，并在需要时生成证书。建议将其与组织中的任何现有域名分开用于自定义域名。它不得与\
  \ VNet 中的任何当前命名空间或通过 VPN 或 ExpressRoute 连接到本地的命名空间冲突。\n\n对于现有域名 *milesbetter.solutions*，建议的命名方法是使用\
  \ *子域* *aadds.milesbetter.solutions*，以避免与现有 *根命名空间* 冲突。\n\n### 位置\n\n您应在实现的工作负载需要使用托管域的同一区域部署\
  \ Azure AD DS 托管域。如果该区域可用，可以选择 Azure 可用性区域以获得额外的冗余。\n\n您应确保部署到正确的区域，因为一旦创建，除非删除并重新创建，否则无法更改。\n\
  \n### SKU\n\nSKU 的用途是选择托管域的性能和备份频率。所有 SKU 都提供相同的无限对象数，尽管会给出建议的对象数作为指导。\n\n发布时的 SKU\
  \ 如下：\n\n- 标准：\n  - 建议身份验证负载（峰值，每小时）：0 到 3,000\n  - 建议对象数：0 到 25,000\n  - 备份频率：每\
  \ 5 天\n  - 仅用户林\n- 企业：\n  - 建议身份验证负载（峰值，每小时）：3,000 到 10,000\n  - 建议对象数：25,000 到\
  \ 100,000\n  - 备份频率：每 3 天\n  - 用户林和资源林\n  - 五个资源林信任\n- 高级：\n  - 建议身份验证负载（峰值，每小时）：10,000\
  \ 到 70,000\n  - 建议对象数：100,000 到 500,000\n  - 备份频率：每 5 天\n  - 用户林和资源林\n  - 十个资源林信任\n\
  \n创建后，您可以在 SKU 之间切换，无需删除和重新创建托管域。\n\n### 林类型\n\n默认创建的林类型是 **用户林**；它将对象从 Azure AD\
  \ 同步到托管域。这些对象也可以是从 AD DS 林创建和同步的对象。**资源林**仅同步在 Azure AD 中创建的用户和组。\n\n本节总结了本章三个技能领域的第二个：*创建\
  \ Azure AD DS*。我们探讨了规划和部署信息。在下一节中，我们将探讨本章三个技能领域的最后一个：*管理 Azure AD DS*。\n\n### 管理\
  \ Azure AD DS 托管域\n\n本节将介绍管理 Azure AD DS 托管域实例的信息。\n\n由于这是一项 Microsoft 托管服务，可执行的管理任务有限制。您无法访问托管域中的某些管理功能；我们将在本节中介绍这些领域。本章将以实践练习部分结束。\n\
  \n### 管理工具\n\n用于管理 AD DS 的同一组管理工具也可用于管理 Azure AD DS 实例，例如 **Active Directory 管理中心\
  \ (ADAC)**、**Active Directory 用户和计算机管理单元** 和 **AD PowerShell**。AAD DC 管理员组成员可以使用这些工具管理托管域。\n\
  \n由于这些是 Microsoft 管理的域控制器，它们被锁定，并且没有直接访问托管域域控制器的权限，例如通过 **远程桌面协议 (RDP)**。所有管理任务旨在从网络上的已加入域的管理计算机远程运行。\n\
  \n这些远程管理工具可以使用 **远程服务器管理工具 (RSAT)** 功能安装在已加入域的 VM（服务器或客户端）上，作为管理计算机。\n\n### 管理 Azure\
  \ AD DS 管理特权\n\n托管域将 *不* 提供访问域管理员或企业管理员权限。相反，创建 Azure AD DS 时，会创建一个用于管理托管域的 *管理组*，该组名为\
  \ **Azure AD DC 管理员**。\n\n此组成员的用户帐户在已加入域的 VM 上获得 *管理员权限*；此组被添加到 **本地管理员组**。该组还提供\
  \ **远程桌面** 权限以连接到已加入域的 VM。\n\n您应从 Azure AD 目录中添加您希望成为此组成员的用户。\n\n\n\n以下是在托管域中可以执行的管理任务：\n\
  \n- 在托管域中加入计算机\n- 管理容器 AADDC Computers 和 AADDC Users 的内置 GPO\n- 创建和管理自定义 OU 和 GPO\n\
  - 管理 DNS\n\n以下是无法在托管域上执行的功能：\n\n- 通过远程桌面连接到域控制器 (DC)\n- 将域控制器添加到托管域\n- 将现有 AD DS\
  \ 林扩展到 Azure AD DS；托管域是独立的林实例\n- 没有域管理员或企业管理员权限\n- 扩展架构\n\n应仔细考虑上述要点，以帮助决策 Azure\
  \ AD 是否是最适合您需求的标识解决方案。\n\n### 配置 VNet 以使用托管域\n\n默认情况下，托管域 VNet 只包含一个子网。该子网仅供托管域服务使用，您不应向其中添加任何其他资源或\
  \ VM。如果您希望在托管域 VNet 中创建资源或 VM，应为这些资源创建其他子网。\n\n但是，您可以使用现有 VNet 或创建新 VNet，并使用网络分段将托管域\
  \ VNet 隔离开来；此推荐方法将根据您的需求而有所不同。\n\n要允许其他 VNet 中的资源使用托管域，第一步是确保这些 VNet 能够连接到托管域 VNet（通过\
  \ VNet 对等互连）。应更新 VNet 的 DNS 服务器设置，以反映能够对托管域 DCs 执行查找的 DNS 服务器。\n\nVM 可能需要重新启动以获取新的\
  \ DNS 设置；您可以在 VM 上运行 `ipconfig /all` CLI 命令，以检查重启前后使用的 DNS 设置。\n\n### 管理用户帐户\n\n\
  用户帐户不会直接在托管域中创建；它们是从 Azure AD 同步的。\n\nAzure AD DS 要求密码哈希采用 NTLM 或 Kerberos 所需的格式，而在托管域在租户上启用之前，Azure\
  \ AD 不提供此格式。现有用户无法立即向托管域进行身份验证；其密码哈希不会以 Azure AD DS 使用的格式同步到 Azure AD DS。因此，我们需要在\
  \ Azure AD 中生成可用的密码哈希，以便它们可以同步到 Azure AD DS 托管域。\n\n必须更改用户密码，才能生成新的密码哈希；可以强制用户在下次登录时更改密码，也可以让用户手动更改。此更改会导致密码以正确的格式重新创建，以便支持\
  \ Azure AD DS 并实现正确的 Kerberos 和 NTLM 身份验证。\n\n更改此密码后，Azure AD 会存储此新密码哈希，帐户将同步到托管域。用户现在可以使用其\
  \ Azure AD 帐户凭据成功登录到托管域。\n\n应注意的是，Azure AD Connect 云同步不支持与 Azure AD DS 一起使用；AD 用户需要使用\
  \ Azure AD Connect 进行同步。\n\n此密码哈希重新生成方案不会发生在托管域在租户中创建后创建的帐户；对于这些帐户，Azure AD 将创建\
  \ Azure AD DS 所需的正确格式的密码哈希。\n\n必须在 Azure AD 租户中实现自助式密码重置 (SSPR)，以允许用户重置其密码。\n\n\
  托管域中有默认密码策略，其中定义了复杂性、存活期和锁定；可以创建自定义密码策略以替代此策略。\n\n### 管理 OU\n\n为托管域创建了两个内置组织单位 (OU)；如下所示：\n\
  \n- AADDC Users：这是从 Azure AD 租户同步到托管域的所有用户和组对象的默认位置。包括从 Azure AD 租户同步的用户和组。\n\n\
  - AADDC Computers：这是加入到托管域的所有计算机对象的默认位置。\n\n在从 AD DS 同步用户帐户和组的混合标识方案中，OU 对象不会同步，因为托管域仅支持扁平\
  \ OU 结构。建议创建自定义 OU 和关联的 GPO 以满足您的需求。\n\n### 管理 VM 域加入\n\nAzure AD DS 提供 *托管域服务*，以便您可以提供\
  \ VM 加入功能，而无需自行管理 IaaS VM 域控制器。您可以使用 *Azure AD 凭据* 向此托管域进行身份验证。用户帐户可以是云专用帐户，也可以通过\
  \ Azure AD Connect 从 AD 同步到 Azure AD。\n\n这为我们提供了可跨 AD DS、Azure AD 和 Azure AD DS\
  \ 使用的 *通用标识*。通过从 AD 将用户帐户密码哈希同步到通过 Azure AD 的托管域，这为我们在随后可能实现的内容方面提供了很多选择。\n\n用于将计算机加入域的帐户必须同步到托管域或来自\
  \ Azure AD 租户；不能使用 *外部目录帐户*。\n\n如果 VM 无法加入托管域，通常是由三个常见原因造成的：\n\n- **连接问题**：确保您可以连接到托管域\
  \ DC 的 IP 地址；如果您的工作负载位于与创建 Azure AD 的 VNet 不同的 VNet 中，您可能需要检查 VNet 是否已对等互连。确保没有网络安全筛选针对托管域的流量。\n\
  - **DNS 问题**：确保 VM 已列出正确的 DNS 服务器以查找托管域；检查托管域 DC 的 IP 是否已设置为 VM 尝试进行 *域加入* 的 VNet\
  \ 所使用的 DNS 服务器。\n- **凭据**：确保所用帐户属于 Azure AD 租户或已成功同步到托管域，并且密码哈希采用 Azure AD DS 所需的正确格式。如前所述，正确的密码哈希可能未同步到托管域，密码重置将生成正确的密码哈希格式；您应等待该操作同步到托管域。\n\
  \n建议帐户凭据采用 *UPN 后缀* 格式；例如，对于 *domainjoin* 用户，您将使用 *domainjoin@aadds.milesbetter.onmicrosoft.com*\
  \ UPN 后缀。或者，可以使用 *SAMAccountName* 格式；例如，对于 *domainjoin* 用户，您将使用 *AADDS\\domainjoin\
  \ SAMAccountName* 格式。\n\n在本节中，我们探讨了管理 Azure AD DS。在下一节中，我们将完成一项实操练习，以加强本章中涵盖的某些概念。\n\
