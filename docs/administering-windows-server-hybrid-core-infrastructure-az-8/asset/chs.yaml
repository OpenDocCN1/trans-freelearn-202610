  20 多年经验。他的经验来自与最终用户和经销商渠道合作，以及在与全球网络和应用安全供应商、全球电信主机、托管托管、托管和数据中心服务提供商以及硬件分销相关的供应商空间和角色中工作。目前，他在英国和都柏林的一家多云**云解决方案提供商**（**CSP**）分销商担任云和混合技术领导职务。


  他目前专注于在混合和多云平台环境中保障、保护和管理身份、Windows 客户端和 Windows Server 工作负载。


