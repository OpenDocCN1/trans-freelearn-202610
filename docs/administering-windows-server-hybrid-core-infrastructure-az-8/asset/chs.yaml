  \n### 技能检查\n\n通过回答以下问题，检查您在本章学到的内容：\n\n- 1. 与传统的物理计算模型相比，虚拟化计算模型有哪些优势和价值？\n- 2.\
  \ 什么是 Hyper-V？\n- 3. 实现 Hyper-V 的一些硬件要求是什么？\n- 4. 在 Server Core 上实现 Hyper-V 而非完整\
  \ GUI 操作系统安装有哪些好处？\n- 5. 支持哪些来宾操作系统类型？\n- 6. 两个主要网络组件是什么？\n- 7. 三种虚拟网络交换机类型是什么，它们在功能上有何不同？\n\
  - 8. 什么是嵌套虚拟化？\n- 9. 嵌套虚拟化的一些要求是什么？\n- 10. 列出 Hyper-V 管理器中可用的至少六个功能。\n- 11. 我们可以通过哪些方式管理\
  \ Hyper-V 主机和来宾虚拟机？\n- 12. 什么是 VM 代版本？\n- 13. 什么是 VM 配置版本？\n- 14. 第 1 代和第 2 代 VM\
  \ 设置有什么区别？\n- 15. 支持哪些 VHD 磁盘格式，它们有何不同？\n- 16. 有哪些不同的 VHD 磁盘类型，这些不同类型的使用场景是什么？\n\
  - 17. 什么是动态内存，如何配置？\n- 18. 什么是 Hyper-V 集成服务？\n- 19. 什么是离散设备分配？\n- 20. 增强会话模式提供哪些功能？\n\
  - 21. VM 资源组和 CPU 组有什么好处？\n- 22. 三种调度器类型是什么？\n- 23. 解释两种 VM 检查点类型。\n- 24. 如何提供高可用性？\n\
  - 25. 解释受保护结构的组件和操作。\n"
- "## 10 实现和管理 Windows Server 容器\n\n在上一章中，我们添加了在 Windows Server 上实现和管理 Hyper-V 的技能。\n\
  \n本章涵盖 AZ-800 管理 Windows Server 混合核心基础结构：创建和管理容器的内容。\n\n本章内容并非旨在涵盖容器及其创建、操作和编排的所有方面；内容范围仅限于考试技能大纲。\n\
  \n在本章中，我们将了解容器化的概念，介绍 Docker，并了解 Windows Server 容器。我们将以一些动手练习结束，帮助您进一步发展技能。\n\n\
  本章包含以下主题：\n\n- 容器简介\n- Docker 简介\n- 保护 Windows Server 容器\n- Windows Server 容器网络\n\
  - 创建 Windows Server 容器映像\n- 管理 Windows Server 容器映像\n- 动手练习\n\n除本章列出的主题外，本章的目标是将您的知识超出考试目标，为面向现实世界日常混合环境的角色做好准备。\n\
  \n### 容器简介\n\n在本节中，我们将介绍**容器**的概念，并了解它们与**虚拟机 (VM)**的关系。\n\n作为一种概念，容器能够实现标准化且隔离的可部署计算资源单元，这些单元轻巧且可移植。\n\
  \n容器围绕封装构建，涉及将应用程序的代码及其依赖项打包，以便可以无缝部署到开发或生产环境中，并获得可重复、可预测且一致的结果。\n\n容器的好处和价值在于，它们是*自包含的计算单元*，轻巧且可移植。\n\
  \n在下一节中，我们将了解容器与 VM 之间的关系。\n\n### 比较容器和 VM\n\n要了解容器模型，我们将简要将其与虚拟化 (VM) 放在一起看待。\n\
  \n与 VM 类似，容器是计算资源单元；它们的目标相同，即托管和执行代码。但是，VM 带有大量开销；它们非标准、体积大、资源密集、整体式、脆弱、难以移动且不敏捷。相比之下，容器可被视为*反\
  \ VM*；其特性正好相反，即它们是标准、轻巧、体积小、资源占用少、可移植、更加敏捷、响应迅速且启动时间更短。它们非常适合数字化转型场景和现代化数据中心工作负载。\n\
  \n使用容器交付代码执行的方法几乎被认为更接近应用程序交付模型，而不是虚拟化模型。\n\n这引出了下一个思考领域，即容器通过虚拟化软件资源（即操作系统）来交付代码执行。这与虚拟化形成鲜明对比，在虚拟化中，VM\
  \ 虚拟化硬件资源。\n\n在以下图表中，我们可以将容器视为与 VM 成比例的计算单元，并将物理服务器视为计算单元：\n\n\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_363_0.png)\n\
  \n图 10.1 – 物理机与虚拟机与容器\n\n前面的图示表明，简而言之，提供相同数量的应用所需的物理服务器更少。\n\n仔细观察，我们可以看到，传统的每台服务器运行单个应用的方式意味着我们需要两台物理服务器来提供两个应用。该图示表明，借助虚拟化，相同的两个应用现在只需要一台物理服务器。不过，我们仍需为每个虚拟机购买、维护、保护和支持操作系统，这可能会带来相当大的成本和运维负担。然而，使用容器时，我们提供相同数量的应用，并且仍然使用与虚拟化相同数量的物理服务器，但只需要一份操作系统副本。\n\
  \n总而言之，使用容器时，我们对软件进行虚拟化；这允许多个计算实例（容器）共享单个主机操作系统的底层主机软件资源。通过这样做，我们能够实现更高的效率、规模和敏捷性。\n\
  \n本节介绍了容器，并将其与虚拟机和传统物理服务器模型进行了比较，以帮助你了解在容器中托管和执行应用程序代码的价值和优势。在下一节中，我们将介绍 Docker。\n\
  \n### Docker 简介\n\nDocker（https://www.docker.com）是一个开源的容器化平台，它将应用程序的代码打包成我们在本章前面几节中介绍的标准化计算单元。由于\
  \ Docker 是开放标准，它可以在所有主要操作系统类型、任何基础设施和任何云平台上运行。\n\nDocker 平台的两个核心组件如下：\n\n- Docker\
  \ 引擎：这是一个轻量级、安全的运行时环境，可运行在基于 Windows 的操作系统、Linux 和 macOS 上\n- Docker 客户端：这是引擎的命令行界面\
  \ (CLI)，并在主机计算机上运行\n\nDocker 可以使用包管理在 Windows Server 上安装。PowerShell PackageManagement\
  \ 模块在 Windows Server 2019 及更高版本中可用。\n\nDocker 还可以使用 PowerShell DockerMicrosoftProvider\
  \ 模块进行安装。\n\n我们将在本章的实操练习部分学习如何安装 Docker。\n\n在本节中，我们介绍了 Docker。在下一节中，我们将介绍保护 Windows\
  \ Server 容器。\n\n### 保护 Windows Server 容器\n\n本节在隔离模式的背景下探讨安全性。\n\nWindows Server\
  \ 容器提供两种隔离模式：进程隔离和 Hyper-V 隔离。每个容器与主机操作系统之间创建的隔离程度区分了这些隔离模式。让我们逐一介绍每种模式：\n\n- 进程隔离（这是传统的隔离模式）：\n\
  \  - 容器与主机之间共享相同的内核\n  - 每个容器都有用户模式\n  - 启动 Docker 容器时，使用 --isolation=process 命令开关\n\
  - Hyper-V 隔离：\n  - 使用这种隔离模式，每个容器都有自己的内核\n  - 每个容器在虚拟机内运行\n  - 每个容器与主机之间提供硬件级别的隔离\n\
  \  - 启动 Docker 容器时，使用 --isolation=hyperv 命令开关\n\n以下图示展示了这两种隔离模式：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_365_0.png)\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_365_1.png)\n\n图 10.2 – 隔离模式\n\n进程隔离是\
  \ Windows Server 主机上 Windows 容器的默认模式。在 Windows 10 主机上运行的 Windows 容器使用 Hyper-V 隔离。\n\
  \n在本节中，我们在 Windows 容器的隔离背景下探讨了安全性。在下一节中，我们将介绍 Windows 容器中的网络。\n\n### Windows Server\
  \ 容器的网络\n\n使用 Windows Server 容器进行网络的概念在功能上与虚拟机类似。一个虚拟网络适配器 (vNIC) 连接到容器，该容器连接到 Hyper-V\
  \ 虚拟交换机 (vSwitch)。可以通过 Docker 创建五个网络驱动程序或模式来支持 Windows，它们如下：\n\n- L2bridge 网络驱动程序\n\
  - L2tunnel 网络驱动程序\n- NAT 网络驱动程序\n- Overlay 网络驱动程序\n- Transparent 网络驱动程序\n\n有关每个驱动程序的更多详细信息，请参阅以下\
  \ Microsoft 文档文章：https://docs.microsoft.com/en-gb/virtualization/windowscontainers/container-networking/network-drivers-topologies。\n\
  \n根据物理网络和主机网络要求，应选择最适合您需求的驱动程序。\n\n您可以运行 `docker network ls` 命令来列出可用网络。\n\nNAT 是\
  \ Docker 引擎首次运行时创建的默认网络类型。它使用 **WinNAT** Windows 组件和内部 vSwitch。\n\n有两个 vSwitch 可用，它们如下：\n\
  \n- **内部 vSwitch**：这不直接连接到容器主机上的网络适配器\n- **外部 vSwitch**：这直接连接到容器主机上的网络适配器\n\n在本节中，我们介绍了\
  \ Windows Server 容器中的网络。在下一节中，我们将介绍创建 Windows Server 容器映像的过程。\n\n### 创建 Windows\
  \ Server 容器映像\n\n基础映像为容器提供操作系统的基础层；所有容器都将基于该映像。基础映像包含用户模式操作系统文件、运行时文件、必需的应用程序依赖项以及任何必需的杂项配置文件。\n\
  \nMicrosoft 为 Windows Server 容器提供以下基础映像：\n\n- **Windows**：这包括完整的 Windows API 和系统服务，但不包含服务器角色。它在\
  \ Windows Server 2022 上不可用。这是最大的映像 (3.4 GB)。\n- **Windows Server**：这包括完整的 Windows\
  \ API，比 Windows 映像具有更多的服务器功能，支持 GPU，并且没有 IIS 限制。它需要 Windows Server 2022，并且比 Windows\
  \ 映像略小 (3.1 GB)。\n- **Server Core**：这与 Nano Server 是最常用的映像。它包括 Windows API 的子集，包括\
  \ **.NET Framework** 和大多数服务器角色，以及中等大小的映像。它最适合 **直接迁移** 场景。\n- **Nano Server**：这包括\
  \ **.NET Core** API 和一些服务器角色；它是一个超轻量映像。关键的映像差异是 API 表面显著更小；PowerShell、WMI 和 Windows\
  \ 服务堆栈不包括在内。\n\n以下信息总结了针对给定场景应使用的适当基础映像：\n\n- *应用程序是否需要完整的 .NET Framework？* 您应该使用\
  \ **Windows Server Core** 基础映像。\n- *该应用是否基于 .NET Core？* 您应该使用 Nano Server 基础映像。\n\
  - *您的应用是否需要 Windows Server Core 中缺少的依赖项？* 您应该使用 Windows 基础映像。\n- *是否需要 GPU 加速支持？*\
  \ 您应该使用 Windows Server 基础映像。\n\n这些基础映像可以在 Docker Hub 上找到：https://hub.docker.com/_/microsoft-windows-base-os-images。\n\
  \n可以通过运行以下 PowerShell 命令找到可用的所有 Microsoft 容器基础映像列表：\n\n```\ndocker search Microsoft\n\
  ```\n\n这些映像可以从 **Microsoft 容器注册表 (MCR)** 下载。\n\n要下载基础映像，可以使用 `docker pull` 命令。以下是示例：\n\
  \n```\ndocker pull mcr.microsoft.com/windows/servercore:ltsc2022\n```\n\n下载映像后，可以运行以下命令来验证现在本地可用的哪些映像并显示元数据：\n\
  \n```\ndocker image ls\n```\n\n在本节中，我们介绍了使用 Docker 进行基于 Microsoft 的容器创建。在下一节中，我们将介绍管理\
  \ Windows Server 容器映像。\n\n### 管理 Windows Server 容器映像\n\nWindows 容器通过 Docker 创建、运行和管理。**Docker\
  \ 引擎** 提供有助于自动化创建过程的工具。实现此功能的 Docker 组件如下：\n\n- **Docker 文本文件**，Dockerfile：此文件包括创建容器映像的说明。这包括识别将要使用的基础映像、创建映像时将要运行的命令，以及识别新实例的映像部署时间。\n\
  - **Docker 命令**，`docker build`：此命令调用 Dockerfile，随后触发映像创建过程。\n\n除了自动化之外，Docker 命令还可以手动运行。以下是一些常用命令供参考：\n\
  \n- `docker images`：此命令列出容器主机上安装的映像\n- `docker run`：此命令使用容器映像创建容器\n\n\n\n\n\n- `docker\
  \ commit`: 此命令将对容器所做的更改提交到新的容器映像\n- `docker stop`: 此命令停止正在运行的容器\n- `docker rm`:\
  \ 此命令删除现有的容器\n\nDocker 方法允许您将映像作为代码存储，使用开发生命周期执行持续集成，并为升级和维护目的重新创建快速且可重复的映像，从而获得一致的结果。\n\
  \n容器还可以通过基于浏览器的 GUI 进行管理，该 GUI 称为 **Windows 管理中心 (WAC)**。必须安装 **容器扩展**，以便在 WAC 中查看容器管理。如以下屏幕截图所示：\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_368_0.png)\n\n图 10.3 – 为 WAC 安装容器扩展\n\
  \n安装扩展后，如果主机上不存在 Docker，系统将提示您安装 Docker，如以下屏幕截图所示：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_369_0.png)\n\
  \n图 10.4 – 通过 WAC 安装 Docker\n\n以下屏幕截图显示了 WAC 容器管理体验：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_369_1.png)\n\
  \n图 10.5 – 使用 WAC 进行容器管理\n\n现在，您可以指定要从 MCR 运行的映像。\n\n### 维护容器映像\n\n应定期更新容器映像，以确保它们接收通过代码和修补程序所做的更改。\n\
  \n基础 OS 层包含主机 OS 不共享的 OS 元素。它由两个映像组成：基础层和更新层。基础层是较大的层，但更改最少，所需维护最少；更新层较小。以下图表表示这些层：\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_370_0.png)\n\n图 10.6 – 容器映像更新层\n\n在更新层中，每个代码更改都会创建一个新映像。基础\
  \ OS 层从更新层获取其更新。\n\n在本节中，我们探讨了管理 Windows 容器。在下一节中，我们将完成一个动手练习，以巩固本章中涵盖的一些概念。\n\n\
  ### 动手练习\n\n为了在获得一些实用技能的同时支持您的学习，我们将利用从本章获得的概念和理解，并将其付诸实践。\n\n我们将查看以下练习：\n\n- 练习\
  \ – 在 Windows Server 上使用 PowerShell 安装 Docker\n- 练习 – 在 Windows Server 上使用 WAC 安装\
  \ Docker\n\n### 开始使用\n\n要开始本节，您需要访问 Windows 服务器；它可以是物理机、虚拟机或 Azure IaaS VM。您需要访问提升的\
  \ PowerShell 会话，并以管理员访问权限安装 WAC。\n\n让我们进入本章的练习。\n\n### 练习 – 在 Windows Server 上使用\
  \ PowerShell 安装 Docker\n\n在此练习中，我们将使用 PowerShell 在 Windows Server 上安装 Docker。为此，我们将使用\
  \ Windows Server 2019 Gen2 VM。\n\n按照以下步骤开始：\n\n1. 使用管理员帐户登录到用于此练习的 Windows Server\
  \ 并打开提升的 PowerShell 会话。\n\n2. 运行以下命令，从 Windows PowerShell 库安装 Docker-Microsoft PackageManagement\
  \ 提供程序：\n\n```\nInstall-Module -Name DockerMsftProvider -Repository PSGallery -Force\n\
  ```\n\n3. 使用 PackageManagement Windows PowerShell 模块安装最新版本的 Docker：\n\n```\nInstall-Package\
  \ -Name docker -ProviderName DockerMsftProvider\n```\n\n以下是命令的输出：\n\n| 名称 | 版本 |\
  \ 源 | 摘要 |\n| --- | --- | --- | --- |\n| Docker | 20.10.9 | DockerDefault | 包含用于\
  \ Windows Server 的 Docker EE。 |\n\n图 10.7 – 安装 Docker\n\n4. Docker 安装完成后，使用以下命令重新启动主机：\n\
  \n```\nRestart-Computer\n```\n\n5. 重新登录服务器并再次打开提升的 PowerShell 会话。\n\n6. 运行以下命令以确保\
  \ Docker 服务在主机上运行：\n\n```\nStart-Service docker\n```\n\n7. 运行以下命令以检查已安装的 Docker\
  \ 版本：\n\n```\ndocker version\n```\n\n```\nWindows PowerShell\nCopyright (C) Microsoft\
  \ Corporation. All rights reserved.\n\nPS C:\\Users\\vmadmin> Start-Service docker\n\
  PS C:\\Users\\vmadmin> docker version\nClient: Mirantis Container Runtime\n Version:\
  \           20.10.9\n API version:       1.41\n Go version:        go1.16.12m2\n\
  \ Git commit:        591094d\n Built:             12/21/2021 21:34:30\n OS/Arch:\
  \           windows/amd64\n Context:           default\n Experimental:      true\n\
  \nServer: Mirantis Container Runtime\nEngine:\n Version:          20.10.9\n API\
  \ version:      1.41 (minimum version 1.24)\n Go version:       go1.16.12m2\n Git\
  \ commit:       9b96ce992b\n Built:            12/21/2021 21:33:06\n OS/Arch:  \
  \        windows/amd64\n Experimental:     false\n\nPS C:\\Users\\vmadmin> _\n```\n\
  \n图 10.8 – 检查 Docker 版本\n\n至此，我们已完成此练习。此练习教会了我们如何在 Windows Server 上使用 PowerShell\
  \ 安装 Docker。\n\n### 练习 – 在 Windows Server 上使用 WAC 安装 Docker\n\n在此练习中，我们将使用 Windows\
  \ 管理中心 (WAC) 在 Windows Server 上安装 Docker。为此，我们将使用 Windows Server 2019 Gen2 VM。\n\
  \n按照以下步骤开始：\n\n1. 登录到已安装 WAC 的 Windows Server，并使用管理员帐户启动 WAC。\n2. 登录到 WAC 后，单击右上角工具栏中的齿轮图标以访问设置屏幕，然后单击\
  \ 扩展：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_373_0.png)\n\n图 10.9 – WAC 设置屏幕\n\
  \n3. 从扩展屏幕，搜索 容器扩展：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_373_1.png)\n\n图\
  \ 10.10 – WAC 容器扩展\n\n4. 单击 容器扩展，然后单击 安装：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_374_0.png)\n\
  \n图 10.11 – WAC 正在安装扩展\n\n5. 已安装的 容器扩展可以在 已安装的扩展 选项卡中查看：\n\n### 扩展\n\n安装扩展后，Windows\
  \ 管理中心 可能会重新启动，暂时影响使用此 Windows 管理中心 实例的任何人。\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_374_1.png)\n\
  \n图 10.12 – WAC 扩展已安装\n\n6. 从左上角菜单导航中，选择 **所有连接**。然后，选择 **网关** 条目以建立连接：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_375_0.png)\n\
  \n图 10.13 – WAC 正在建立连接\n\n7. 从左侧工具菜单，单击 容器：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_375_1.png)\n\
  \n图 10.14 – 打开容器屏幕\n\n8. 页面加载后，单击 安装：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_376_0.png)\n\
  \n图 10.15 – WAC 正在安装 Docker\n\n9. 等待片刻，正在安装 Docker。安装完成后，您的计算机将重新启动：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_376_1.png)\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_376_2.png)\n\n图 10.16 – Docker 已安装\n\n\
  10. 计算机重新启动后，启动 WAC。您将看到 Docker 已安装，并且您已准备好创建和管理容器：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_377_0.png)\n\
  \n图 10.17 – 从 WAC 访问 Docker\n\n至此，我们已完成此练习。此练习教会了我们如何在 Windows Server 上使用 WAC 安装\
  \ Docker。现在，让我们总结本章。\n\n### 摘要\n\n本章通过涵盖 AZ-800 管理 Windows Server 混合核心基础架构：创建和管理容器，帮助您进一步了解容器技术的知识和技能。\n\
  \n首先，您了解了容器并将其与虚拟机进行了比较。然后，您学习了如何创建和管理 Windows Server 容器映像并执行容器网络。\n\n这些新技能将使您的知识超越考试目标，为您从事以现实世界日常混合环境为重点的角色做好准备。\n\
  \n在下一章中，您将学习如何管理 Windows Server 虚拟机。\n\n\n\n\n\n### 进一步阅读\n\n本节提供额外的学习参考和考试信息链接：\n\
  \n- *Microsoft Certified: Windows Server Hybrid Administrator Associate*: https://docs.microsoft.com/en-us/learn/certifications/windows-server-hybrid-administrator/\n\
  - *Exam AZ-800: Administering Windows Server Hybrid Core Infrastructure*: https://docs.microsoft.com/en-us/learn/certifications/exams/az-800\n\
  - *Exam AZ-800: Study Guide*: https://query.prod.cms.rt.microsoft.com/cms/api/am/binary/RWKI0r\n\
  - *Microsoft Learn*: https://docs.microsoft.com/en-us/learn/modules/run-containers-windows-server/\n\
  \n### 技能检查\n\n通过回答以下问题来检查您在本章学到的内容：\n\n- 1. 什么是容器，它们与虚拟机有何不同？\n- 2. 什么是 Docker？\n\
  - 3. Docker 平台的两个核心组件是什么？\n- 4. 隔离模式有哪些，它们有何不同？\n- 5. 什么是容器镜像？\n- 6. 四个基本的 Windows\
  \ Server 容器镜像是什么？\n- 7. 这四个基本的 Windows Server 容器镜像有何不同？\n- 8. 容器基础镜像可以从哪里下载？\n-\
  \ 9. 容器可以通过哪些方式进行管理？\n- 10. 说明 Windows Server 容器的网络。\n"
- "## 管理 Windows Server Azure 虚拟机\n\n在上一章中，我们了解了容器化的概念，并学习了如何实现和管理 Windows Server\
  \ 容器。\n\n本章涵盖 AZ-800 管理 Windows Server 混合核心基础架构：运行 Windows Server 的 Azure 虚拟机的内容。\n\
  \n本内容并非旨在涵盖 Windows Server Azure 虚拟机 (VM) 管理的所有方面；内容范围仅限于考试技能大纲。考试目标中的一些内容已在其他章节中介绍过，且不会重复。\n\
  \n除了涵盖以下主题外，本章的目标是将您的知识提升到考试目标之上，为您在现实世界中日常的、以混合环境为重点的角色做好准备。\n\n本章涵盖以下主题：\n\n-\
  \ 管理 Azure VM 数据磁盘\n- 调整 Azure VM 大小\n- 为 Azure VM 配置持续交付\n- 配置到 VM 的连接\n\n我们将通过一个实践练习来结束，以进一步提升您的技能。\n\
  \n### 管理 Azure VM 数据磁盘\n\n创建 VM 时，必须使用存储操作系统的系统磁盘；这将是 C:\\\\ 驱动器。此外，对于某些 VM 类型，您可以指定在\
  \ VM 创建时自动预配的临时磁盘；这将显示为 D:\\\\ 驱动器。\n\n我们不会关注或介绍系统磁盘类型的内容，因为此考试目标部分讨论的是数据磁盘类型。\n\
  \n**数据磁盘**可以附加到 VM，除系统磁盘和临时磁盘之外，在需要额外磁盘存储或布局时使用。这可能是为了安装 SQL Server 等软件，我们希望为数据、日志等使用不同的磁盘布局，或者您可能出于性能原因选择数据磁盘，因为磁盘缓存会对\
  \ OS 磁盘产生影响。\n\n对于性能敏感的应用程序和操作，您应确保使用数据磁盘进行安装路径和数据存储，而不是 OS 磁盘。这样做的原因是，默认情况下，OS\
  \ 磁盘启用了 *读/写缓存*，这可能会影响某些应用程序（例如数据库）的性能；这包括域控制器的数据库。\n\nMicrosoft 建议域控制器 IaaS VM\
  \ 使用缓存已禁用的数据磁盘（默认情况下为读取缓存），并 *不要* 使用 OS 磁盘，以防止操作出现写入缓存问题。建议是 AD DS 数据库 (*ntds.dit*)、日志和\
  \ **系统卷** (**SYSVOL**) 使用禁用缓存的数据磁盘上的卷。磁盘缓存可以通过 Azure 门户或 PowerShell 进行设置。我们可以使用以下\
  \ PowerShell cmdlet：\n\n```\nAzVMDataDisk\n```\n\n有关缓存性能和配置的更多信息，请参阅以下 Microsoft\
  \ Learn 模块：\n\n- https://docs.microsoft.com/en-us/learn/modules/caching-and-performance-azure-storage-and-disks/\n\
  - https://docs.microsoft.com/en-us/learn/modules/caching-and-performance-azure-storage-and-disks/6-exercise-manage-cache-settings-with-powershell\n\
  \n更改缓存时，数据磁盘会被分离并重新附加，但 VM 不需要重新启动，因此此操作没有停机时间；但是，更改系统磁盘缓存会导致 VM 重新启动。\n\n**添加**新磁盘和**分离**磁盘不会导致\
  \ VM 停机；无需重新启动 VM。如果未分离磁盘且您希望调整磁盘大小，则附加了该磁盘的 VM 需要释放分配；这将导致停机。一项名为 **LiveResize**\
  \ 的功能允许在无需停机的情况下扩展驱动器；有关信息可在以下 Microsoft 文档中找到：https://docs.microsoft.com/en-us/azure/virtual-machines/windows/expand-os-disk#expand-without-downtime。\n\
  \n以下 PowerShell cmdlet 可用于管理数据磁盘：\n\n- **New-AzDiskConfig**：此 cmdlet 创建可配置的磁盘对象\n\
  - Add-AzVMDataDisk：此 cmdlet 将数据磁盘附加到 VM\n- $myVM.StorageProfile.DataDisks：此项提供数据磁盘的信息，例如名称、磁盘大小、缓存、逻辑单元号\
  \ (LUN ID) 等\n\n可以附加到 Azure IaaS VM 的不同磁盘类型如下：\n\n- Standard HDD：提供最低成本存储、最低性能和最低持久性\n\
  - Standard SSD：提供一致性能和低延迟\n- Premium SSD：提供高性能和低延迟\n- Ultra Disk：提供亚毫秒级延迟\n\n可为数据磁盘选择的磁盘存储单元\
  \ (SKU) 在以下屏幕截图中显示：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_381_0.png)\n\n图\
  \ 11.1 – Azure VM 磁盘 SKU\n\n使用 **Ultra Disk** SKU 存在多种限制，这些限制在以下 Microsoft 文档中概述：https://docs.microsoft.com/en-us/azure/virtual-machines/disks-types#ultra-disk-limitations。\n\
  \n若要将 **Premium** 磁盘 SKU 用作数据磁盘并附加到 VM，VM 类型必须支持 Premium 磁盘；这在 Azure 门户中可以看到，如下图所示：\n\
  \n选择 VM 大小 ...\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_382_0.png)\n\n图 11.2\
  \ – Azure VM Premium 磁盘支持\n\n前面的屏幕截图显示，**E2s_v4** VM 大小显示为 **受支持** 以附加 Premium 磁盘，但\
  \ **E2_v4** VM 大小显示为 **不受支持**。VM 名称中的 \"s\" 表示这些 VM 大小可以支持 Premium 磁盘 SKU。\n\n为简化选择满足您要求的\
  \ VM 大小（例如，数据磁盘需要 Premium 磁盘 SKU），您可以为支持 Premium 磁盘的 VM 添加筛选器。如下图所示：\n\n主页 > 虚拟机\
  \ > 创建虚拟机 >\n\n选择 VM 大小 ...\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_382_1.png)\n\
  \n图 11.3 – Azure VM 大小 Premium 磁盘筛选器\n\n在本节中，我们了解了管理 IaaS VM 数据磁盘。在下一节中，我们将了解如何调整\
  \ VM 大小。\n\n### 调整 Azure VM 大小\n\nVM 可以缩小或放大到该区域中任何其他可用的 VM 大小，以满足您的要求。这可能是为了满足在峰值容量下运行的\
  \ VM 的性能需求，或者当 VM 规格过大且资源利用率不足，可以缩小规模以优化成本时需要。\n\n当您希望调整 VM 大小时，选项将取决于 VM 是运行中还是已停止/已释放分配状态。\n\
  \n当 VM 运行时，并非所有 VM 大小都可用，因为底层 VM 硬件群集必须支持您需要的大小。\n\n还值得注意的是，并非所有区域都提供所有 VM 大小供选择。您可以尝试在所有区域中标准化可用的\
  \ VM 大小。\n\n在某些情况下，您可能需要确保 VM 处于已停止/已释放分配状态，这将为您提供该区域中 VM 可用的所有大小的最广泛选择。\n\n如下图所示：\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_383_0.png)\n\n图 11.4 – Azure VM 调整大小\n\
  \n还可能影响调整大小的下一个方面是区域中是否没有足够的容量来支持您的需求。这种情况不常见；但是，例如全球大流行病等场景导致需求激增，这意味着某些地区在一段时间内没有可用容量。这可以通过购买保留的保证容量来解决，但需要考虑成本影响。\n\
  \n纵向扩展大小的另一个影响是订阅对核心数或 VM 类型有配额限制，这意味着您无法调整 VM 大小。下图显示已达到核心配额限制。\n\n\n\n\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_384_0.png)\n\
  \n### 图 11.5 – Azure 核心配额限制达到 100%\n\n以下显示了当新 VM 超出配额时显示的消息：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_384_1.png)\n\
  \n### 图 11.6 – Azure 核心配额超出消息\n\n但是，可以通过向 Microsoft 提交服务请求来解决此问题，Microsoft 可以提高配额，但前提是您的购买计划类型必须支持配额增加；沙盒环境不允许增加核心配额。请求增加配额在以下图中所示：\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_384_2.png)\n\n### 图 11.7 – 配额限制增加请求\n\
  \n您还必须确保调整大小到相同的 VM 类型；例如，如果您的 VM 大小为 Dds4，这意味着您拥有一个具有四个 vCPU 的 D 系列，提供本地临时磁盘并支持\
  \ SSD 磁盘。您希望确保调整大小以保留这些 VM 特性。也就是说，从 Dds4 调整为 Dds8，而不是 D8；D8 不会支持您的 SSD 磁盘或提供本地临时磁盘。\n\
  \n更改 VM 大小会导致其重新启动（撰写时）。如果您使用动态 IP 地址分配，则应考虑这一点，因为这在 VM 重新启动时会丢失；您应配置静态 IP 分配来解决此问题。\n\
  \n本章将在 *实践练习* 部分介绍更改 VM 大小。\n\n在本节中，我们介绍了调整 VM 大小的操作。在下一节中，我们将介绍配置 Azure IaaS VM\
  \ 的持续交付。\n\n### 配置 Azure VM 的持续交付\n\n在 Azure 针对 Azure IaaS VM 的第一方解决方案的上下文中，**持续交付**与\
  \ Azure Pipelines 相关。\n\n**Azure Pipelines** 更广为人知的是一种软件开发工具，但可用于实施**基础设施即代码 (IaC)**\
  \ 方法，以自动将*制品*部署到 Azure 中的 IaaS VM 作为计算目标。以下图表可视化了持续交付在更大的 DevOps 方法论中的位置。\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_385_0.png)\n\
  \n### 图 11.8 – DevOps 方法论中的 CD\n\n持续交付方法如何具体与部署的 IaC 方法相关，在以下图中有所说明，该图概述了流和组件的简化视图；为清晰起见，未显示所有流组件：\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_386_0.png)\n\n### 图 11.9 – 使用 Azure DevOps\
  \ 的持续交付\n\nVM 的 Azure 门户持续交付解决方案基于 Azure Pipelines；如以下屏幕截图所示：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_386_1.png)\n\
  \n### 图 11.10 – Azure VM 持续交付\n\n要使用部署管道配置持续交付，您需要拥有一个可选择的 **Azure DevOps 组织**；如果您没有可选择的\
  \ Azure DevOps 组织，系统将提示您创建一个。如以下图所示：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_387_0.png)\n\
  \n### 图 11.11 – 配置部署管道\n\n有关如何使用 Azure DevOps 为 Azure VM 配置部署管道的完整详细信息，请参阅以下 Microsoft\
  \ 文档：https://docs.microsoft.com/en-us/azure/virtual-machines/linux/tutorial-devops-azure-pipelines-classic。\n\
  \n本节介绍了如何配置 Azure VM 的持续交付。在下一节中，我们将介绍配置到 VM 的连接。\n\n### 配置到 VM 的连接\n\n创建 Azure\
  \ VM 后，必须考虑如何允许管理访问。在以下部分中，我们将介绍 **Windows 远程管理 (WinRM)** 和 **远程桌面服务协议 (RDP)** 的访问方法。\n\
  \n### WinRM 访问\n\n我们可以通过 PowerShell 远程处理在远程计算机（如 Azure IaaS VM）上运行 PowerShell 命令；这使用\
  \ WinRM 协议，并允许我们与计算机建立远程连接。\n\n要启用 PowerShell 远程处理，我们需要使用以下 PowerShell cmdlet：Enable-PSRemoting。WinRM\
  \ 服务将启动，以便可以在远程计算机上操作命令。使用的端口为 HTTP: 5985 和 HTTPS: 5986；无论使用何种协议（HTTP 或 HTTPS），所有\
  \ PowerShell 远程通信始终由 WinRM 加密。\n\n设置 Azure VM WinRM 访问的流程概述如下：\n\n- 1. 创建 Azure\
  \ 密钥保管库。\n- 2. 创建自签名证书。\n- 3. 将自签名证书存储在 Azure Key Vault 中。\n- 4. 检索存储在 Azure Key\
  \ Vault 中的自签名证书的 URL。\n- 5. 创建 VM 时，引用自签名证书的 URL 以进行访问。\n- 6. 确保 VM 已启用 WinRM，方法是使用以下\
  \ PowerShell cmdlet 启用 PSRemoting：\n  ```\n  Enable-PSRemoting -Force\n  ```\n-\
  \ 7. 然后可以使用以下内容建立连接：\n  ```\n  Enter-PSSession -ConnectionUri https://<public-ip-dns-of-the-vm>:5986\
  \ -Credential $cred -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck\
  \ -SkipRevocationCheck) -Authentication Negotiate\n  ```\n\n有关设置的更多信息，请参阅以下 Microsoft\
  \ 文档：https://docs.microsoft.com/en-gb/azure/virtual-machines/windows/connect-winrm.\n\
  \n### RDP 访问\n\n作为替代远程连接方法，我们可以使用 RDP 连接到 Azure VM 以进行完整的交互式桌面会话，适用于 Windows VM，以及使用\
  \ Secure Socket Shell (SSH) 连接到 Linux 服务器。就考试目标范围而言，我们将介绍使用 RDP 的 Windows Server\
  \ 访问。\n\n连接到 Windows Server Azure VM 默认需要使用 TCP 端口 3389。如果您使用防火墙或网络安全组 (NSG)，则需要允许对此端口和协议的入站访问；出于安全目的，您应限制接受连接的\
  \ IP 地址范围。有关配置 RDP 访问 NSG 的更多详细信息，请参阅以下 Microsoft 文档：https://docs.microsoft.com/en-us/troubleshoot/azure/virtual-machines/troubleshoot-rdp-nsg-problem.\n\
  \n如果您不使用 VPN 或 ExpressRoute 连接到 Azure 环境中的资源，则还必须为 VM 关联公共 IP。有关配置此内容的更多详细信息，请参阅以下\
  \ Microsoft 文档：https://docs.microsoft.com/en-gb/azure/virtual-network/ip-services/associate-public-ip-address-vm.\n\
  \n第 6 包含了一个使用 RDP 远程访问 Azure VM 并配置 NSG 以允许入站 RDP 流量的实践练习。\n\n在本节中，我们介绍了配置到 VM 的连接。在下一节中，我们将完成一个实践练习部分，以巩固本章涵盖的一些概念。\n\
  \n### 实践练习\n\n为了在学习中获得一些实用技能，我们将利用本章前几节中获得的概念和理解，并将其付诸实际应用。\n\n我们将介绍以下练习：\n\n- 练习\
  \ – 使用 Azure 门户管理数据磁盘\n- 练习 – 调整 Azure VM 大小\n\n### 开始使用\n\n要开始本节，如果您还没有 Azure 订阅，可以在\
  \ https://Azure.microsoft.com/free 创建一个免费 Azure 帐户。此免费 Azure 帐户提供以下内容：\n\n- 12 个月的免费服务\n\
  - 30 天内探索 Azure 的 200 美元信用额度\n- 25 多个始终免费的服务\n\n让我们继续本章的练习。\n\n### 练习 – 使用 Azure\
  \ 门户管理数据磁盘\n\n此练习将介绍使用 Azure 门户管理数据磁盘。\n\n为此练习，您需要有一个已创建的 Azure VM 来附加和调整数据磁盘大小；创建\
  \ VM 后，返回此处完成练习，或者如果您有现有 VM 可用，请继续。\n\n在以下子部分中，您可以看到完成练习的步骤，已划分为任务以便更好地理解。\n\n\n\
  \n\n\n### Task 1 – accessing the Azure portal\n\nLog in to the Azure portal: https://portal.azure.com.\
  \ You can alternatively use the desktop Azure portal app: https://portal.azure.com/App/Download.\n\
  \n### Task 2 – attaching a data disk to a VM\n\n- 1. In the search bar, type in\
  \ `virtual machines`; click **Virtual machines** from the list of services.\n\n\
  - 2. Locate your VM for this exercise from the **Virtual machines** blade and click\
  \ on the name to open the **Virtual machines** blade.\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_390_0.png)\n\
  \nFigure 11.12 – VM for the exercise\n\n- 3. From the **Virtual machines** blade,\
  \ click **Disks** under **Settings**.\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_390_1.png)\n\
  \nFigure 11.13 – VM disk settings\n\n- 4. From the **Disks** blade for the VM, click\
  \ **+ Create and attach a new disk**.\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_391_0.png)\n\
  \nFigure 11.14 – Data disks\n\n- 5. For the LUN number, leave it at the default\
  \ of 0, set Disk name as Data, set Storage type as Standard HDD, and leave Size\
  \ as the default, then click Save from the top menu bar.\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_391_1.png)\n\
  \nFigure 11.15 – Adding a data disk\n\n- 6. You will receive a message to say that\
  \ the disk was created successfully and will be displayed in the **Disks** blade\
  \ for the VM.\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_392_0.png)\n\nFigure 11.16\
  \ – Data disks\n\n- 7. Repeat the process to add another data disk; this time, call\
  \ the disk **Logs** and create a Premium SSD; we will now see this second disk in\
  \ the **Disk** blade.\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_392_1.png)\n\n\
  Figure 11.17 – Adding a data disk\n\n- 8. Navigate to the **Disks** blade, and you\
  \ will see both the data disks and the OS disk for the VM.\n\n| Name | Storage account\
  \ type | Size (GiB) | Owner |\n|---|---|---|---|\n| data | Standard HDD LRS | 32\
  \ | sm029-az800-vm1 |\n| logs | Premium SSD LRS | 4 | sm029-az800-vm1 |\n| sm029-az800-vm1_OsDisk_1_7e2b81d46abc4ef5a598715b56d8b1c2\
  \ | Standard HDD LRS | 127 | sm029-az800-vm1 |\n\nFigure 11.18 – Data disks\n\n\
  In this task, we attached two data disks to a VM. In the next tasks, we will resize\
  \ the created data disks.\n\n### Task 3 – resizing a data disk for a VM\n\nWe will\
  \ resize a disk for this exercise by deallocating the VM instead of detaching and\
  \ reattaching:\n\n- 1. Stop/deallocate your VM by clicking the **Stop** option.\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_393_0.png)\n\nFigure 11.19 – Stopping\
  \ the VM\n\n- 2. Once the VM has been stopped, click on **Disks** under **Settings**\
  \ to open the **Disks** blade for the VM.\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_394_0.png)\n\
  \nFigure 11.20 – Disks blade\n\n- 3. Click the data disk named **Data** (LUN 0),\
  \ open the blade for that disk, and click **Size + performance**.\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_394_1.png)\n\
  \nFigure 11.21 – Disk size\n\n- 4. From the **Size + performance** blade for the\
  \ disk, select a new size of **64 GiB** and click **Resize**.\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_395_0.png)\n\
  \nFigure 11.22 – Select disk size\n\n- 5. You will see a notification that the disk\
  \ was updated successfully.\n\n- 6. Return to the **Disks** blade, and the new disk\
  \ size will be shown as **64 GiB**; you may need to click **Refresh** on the blade.\n\
  \n| LUN | Disk name | Storage type | Size (GiB) |\n|---|---|---|---|\n| 0 | Data\
  \ | Standard HDD LRS | 64 |\n| 1 | Logs | Premium SSD LRS | 4 |\n\nFigure 11.23\
  \ – Disk size changed\n\n- 7. You should now start the VM to return it to operation.\n\
  \nWith this, we have completed this exercise. This exercise taught us the skills\
  \ needed to add and resize data disks. In the next exercise, we look at resizing\
  \ a VM.\n\n### Exercise – resizing an Azure VM\n\nIn this exercise, we will resize\
  \ a VM; you will need to create a VM or use an existing VM for this exercise.\n\n\
  Follow these steps to get started:\n\n- 1. In the search bar, type in `virtual machines`;\
  \ click Virtual machines from the list of services.\n- 2. Locate your VM for this\
  \ exercise from the Virtual machines blade and click on the name to open the Virtual\
  \ machines blade.\n- 3. From the Virtual machines blade, click Size under Settings.\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_396_0.png)\n\n- 4. The Size blade will\
  \ show the VM’s current size, that is, Standard_D2ds_v5, in the example in the figure.\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_396_1.png)\n\n- 5. Select the **D4ds_v5**\
  \ VM size, which keeps the same VM type and characteristics of local temp disk and\
  \ Premium disk support, and then click **Resize**. Note that this will cause the\
  \ VM to be restarted.\n\n> If the virtual machine is currently running, changing\
  \ its size will cause it to be restarted. Stopping the virtual machine may reveal\
  \ additional sizes. →\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_397_0.png)\n\n\
  Figure 11.26 – Selecting the new VM size\n\n- 6. You will receive a notification\
  \ that the machine has been resized.\n\n- 7. Return to the **Virtual machines**\
  \ blade's **Overview** pane, and the new size will be shown as **Standard D4ds v5\
  \ (4 vcpus, 16 GiB memory)**.\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_397_1.png)\n\
  \nFigure 11.27 – Changed VM size\n\nWith this, we have completed this exercise.\
  \ This exercise taught us the skills needed to resize an Azure VM. Now, let’s summarize\
  \ this chapter.\n\n### Summary\n\nThis chapter has provided coverage for *AZ-800\
  \ Administering Windows Server Hybrid Core Infrastructure: Manage Azure Virtual\
  \ Machines that run Windows Server*.\n\nWe covered content that gave you the skills\
  \ to manage Windows Server VMs on the Azure platform. We looked at aspects such\
  \ as managing disks, resizing VMs, and configuring connections to VMs.\n\nA hands-on\
  \ exercise then finished the chapter to provide you with additional practical skills.\n\
  \nYou gained new skills through the information provided; this chapter’s goal was\
  \ to take your knowledge beyond the exam objectives to prepare you for a real-world,\
  \ day-to-day, hybrid-environment-focused role.\n\nThe next chapter will teach you\
  \ about managing Windows Server in a hybrid environment.\n\n### Further reading\n\
  \nThis section provides links to additional study references and additional exam\
  \ information:\n\n- *Microsoft Certified: Windows Server Hybrid Administrator Associate:*\
  \ https://docs.microsoft.com/en-us/learn/certifications/windows-server-hybrid-administrator/\n\
  - *Exam AZ-800: Administering Windows Server Hybrid Core Infrastructure:* https://docs.microsoft.com/en-us/learn/certifications/exams/az-800\n\
  - *Exam AZ-800: skills outline:* https://query.prod.cms.rt.microsoft.com/cms/api/am/binary/RWKI0r\n\
  - *Microsoft Learn:* https://docs.microsoft.com/en-us/learn/paths/manage-virtualization-containers-hybrid-environment/\n\
  \n### Skills check\n\nChallenge yourself with what you have learned in this chapter:\n\
  \n- 1. When is a data disk used?\n- 2. What is the effect of caching on VM disks?\n\
  - 3. What are the different disk SKUs that can be attached to a VM?\n- 4. What are\
  \ the limitations of an Ultra Disk SKU?\n- 5. What VM type must be used to support\
  \ Premium disks?\n- 6. Will changing the size of a disk or attaching a new disk\
  \ require downtime for the VM?\n- 7. Name some scenarios where not all VM sizes\
  \ are available when needing to resize a VM.\n- 8. Will changing a VM's size require\
  \ downtime?\n- 9. What is continuous delivery in the context of Azure VMs?\n- 10.\
  \ What are the different ways we can configure a remote connection to a VM?\n"
- "## Managing Windows Server in a Hybrid Environment\n\nIn the previous chapter,\
  \ we added skills for managing Windows Server virtual machines (VMs) in Azure.\n\
  \nThis chapter covers content from AZ-800 Administering Windows Server Hybrid Core\
  \ Infrastructure: Manage Windows Servers and workloads in a hybrid environment.\n\
  \nWe will cover implementing Windows Admin Center (WAC) to simplify remote server\
  \ management, covering the different deployment methods of the gateway and Azure\
  \ portal approaches. We will also cover PowerShell remoting and how we can enhance\
  \ security through the use of the Just Enough Administration (JEA) capability that\
  \ can be used in conjunction. We will then conclude with a hands-on exercise to\
  \ develop your skills further.\n\nThis chapter does not aim to cover all aspects;\
  \ the content is limited in scope to only the exam objectives and will cover the\
  \ following topics:\n\n- Deploying a WAC gateway server\n- Deploying WAC within\
  \ the Azure portal\n- PowerShell remoting\n- Hands-on exercise\n\nIn addition to\
  \ the topics listed in this chapter, this chapter's goal is to take your knowledge\
  \ beyond the exam objectives to prepare you for a real-world, day-to-day, hybrid\
  \ environment-focused role.\n\n### Deploying a WAC gateway server\n\nThis section\
  \ will look at managing multiple Azure VMs by manually deploying WAC to an Azure\
  \ VM. Before we jump into the configuration, we should introduce how WAC works.\n\
  \n\n\n\nWAC使用带有Web服务器的已安装网关组件，通过PowerShell远程处理和基于Windows远程管理(WinRM)的Windows管理规范(WMI)来管理服务器。这些组件在以下图中概述：\n\
  \n![](img/cf35f46a8dd5f11e58349c1d81611b75_402_0.png)\n\n图 12.1 – WAC组件\n\n### 脚本部署\n\
  \n可以使用脚本或通过Azure门户手动将WAC网关部署到新的或现有的Azure VM。\n\n若要使用Azure门户将WAC网关部署到Azure VM，首先需要下载Deploy-WACAzVM.ps1脚本(https://aka.ms/deploy-wacazvm)，该脚本运行Microsoft安装程序(MSI)以创建环境所需的所有资源，例如资源组、VM和虚拟网络(VNet)。或者，也可以部署到现有VM并使用已下载的本地MSI，并在脚本中引用文件路径。\n\
  \n在这两种情况下，都需要证书；证书应在Azure Key Vault中创建和存储，也可以使用MSI生成的自签名证书。\n\n该脚本从Azure Cloud Shell运行；以下是示例脚本。\n\
  \n首先，设置变量：\n\n```\n$ResourceGroupName = \"az800-wac-rg\"\n$VirtualNetworkName =\
  \ \"az800-wac-vnet\"\n$SecurityGroupName = \"az800-wac-nsg\"\n$SubnetName = \"az800-wac-subnet\"\
  \n$VaultName = \"az800-wac-keyvault\"\n$CertName = \"az800-wac-cert\"\n$Location\
  \ = \"uksouth\"\n$PublicIpAddressName = \"az800-wac-publiccip\"\n$Size = \"Standard_B2ms_v3\"\
  \n$Image = \"Win2019Datacenter\"\n$Credential = Get-Credential\n```\n\n以下脚本将WAC部署到前面变量中设置的新VM、资源组和VNet；它使用aka.ms/WACDownload中的MSI和MSI生成的自签名证书：\n\
  \n```\n$scriptParams = @{\n    ResourceGroupName = $ResourceGroupName\n    Name\
  \ = \"az800-wac-vm1\"\n    Credential = $Credential\n    VirtualNetworkName = $VirtualNetworkName\n\
  \    SubnetName = $SubnetName\n    GenerateSslCert = $true\n}\n./Deploy-WACAzVM.ps1\
  \ @scriptParams\n```\n\n有关此部署方法的更多详细信息，请参阅以下Microsoft文档文章：https://docs.microsoft.com/en-gb/windows-server/manage/windows-admin-center/azure/deploy-wac-in-azure#deploy-using-script.\n\
  \n### 手动部署\n\n若要手动将WAC网关部署到Azure VM，首先需要创建用作WAC网关的Azure VM。然后，需要将MSI安装程序直接下载到VM或本地计算机，并将安装程序复制到VM；安装程序可从https://www.microsoft.com/en-gb/evalcenter/download-windows-admin-center下载。\n\
  \n在WAC网关VM上启动MSI安装程序并按照向导说明操作。你需要提供一个证书，或让MSI生成自签名证书。\n\n对于通信，安装程序默认使用端口443 (HTTPS)；你应允许此通信通过任何网络筛选器（例如网络安全组(NSG)或防火墙）。\n\
  \n### 访问WAC\n\nWAC通过浏览器使用网关VM的DNS名称进行访问；即，`https://<DNS name of your VM>`。\n\n如果设置了非默认的443端口，则需要使用以下URL进行访问：\n\
  \n```\n`https://<DNS name of your VM>:<custom port>`\n```\n\n浏览器将提示输入凭据以对WAC安装所在的本地VM上的会话进行身份验证。这些凭据应属于VM本地用户组或administrators组的成员的帐户。\n\
  \n以下屏幕截图显示了WAC基于浏览器的界面：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_404_0.png)\n\
  \n图 12.2 – WAC浏览器界面\n\n在本节中，我们探讨了部署WAC网关VM，并介绍了手动安装，以及使用脚本对WAC进行自动安装。在下一节中，我们将探讨在VM上安装WAC，以便可以通过Azure门户中的WAC对其进行管理。\n\
  \n### 在Azure门户中部署WAC\n\n可以使用WAC及其与Azure服务和Azure门户的集成来管理Azure和混合资源。以下是目前可以使用Azure门户通过WAC对其进行管理的三种资源：\n\
  \n- Azure基础设施即服务(IaaS) VM\n- Azure Stack HCI\n- Azure Arc支持的服务器\n\n针对考试目标，本节内容将重点介绍如何针对Azure\
  \ IaaS VM进行管理。\n\n### WAC的要求\n\n要在Azure门户中使用WAC功能，需要在每个要由其管理的Azure VM上安装WAC。在Azure门户中由WAC管理的Azure\
  \ VM必须满足以下要求：\n\n- Windows Server 2016、Windows Server 2019、Windows Server 2022。\n\
  - 至少3 GB内存。\n- 必须位于Azure公有云区域；不支持Azure China、Azure Government和其他非公有云。\n- 允许向WindowsAdminCenter和AzureActiveDirectory服务标记发送HTTPS流量的出站Internet访问。\n\
  - 允许HTTPS流量的入站访问。\n- 入站访问必须指向VM的IP地址；不能从其他服务（例如防火墙）重定向。\n\n除了VM要求之外，用于连接到Azure门户的管理计算机还有要求，如下所示：\n\
  \n- 例如**Microsoft Edge**或**Google Chrome**之类的Web浏览器\n\n建议通过**虚拟私有网络 (VPN)**或ExpressRoute连接到已安装WAC且需要使用WAC进行管理的VM所在的同一VNet。与将VM暴露在公有IP地址下相比，这种访问方式更安全。如果通过公有IP地址访问，则应创建访问规则，仅允许来自已知IP地址的访问，并允许端口443\
  \ HTTPS和6516 TCP的入站规则。\n\n满足所有要求后，可以在每个要管理的Azure VM上安装WAC。\n\n我们将在本章的*动手实践*部分继续以动手安装任务的形式探讨此主题。\n\
  \n在本节中，我们探讨了使用WAC及其与Azure服务和Azure门户的集成来管理Azure和混合资源。我们逐步讲解了在Azure门户中实现WAC以及从Azure门户中的WAC访问Azure\
  \ VM以对其进行管理。\n\n至此，关于部署WAC的部分结束。在下一节中，我们将探讨PowerShell远程处理。\n\n### PowerShell远程处理\n\
  \nPowerShell远程处理允许在数百台计算机或仅一台远程计算机上运行单个命令。PowerShell远程处理使用**WS-Management (WS-Man)**协议。\n\
  \nWindows Server 2012/R2和2016中默认启用了PowerShell远程处理。\n\n使用以下提升的命令启用PowerShell远程处理：\n\
  \n```\nEnable-PSRemoting\n```\n\nPowerShell远程处理的要求如下：\n\n- 在运行命令的本地计算机和远程计算机上均已安装PowerShell\n\
  - 必须启用PowerShell远程处理\n- 每台连接并运行命令的计算机上均已启用WinRM\n\n我们将查看一些可针对远程计算机运行的示例cmdlet。\n\
  \n### PowerShell远程处理示例\n\n以下cmdlet与单个远程计算机启动交互会话：\n\n```\nEnter-PSSession Computer-1\n\
  ```\n\n命令提示符将显示远程计算机的显示名称；输入的所有命令将在本地计算机上显示，但在远程计算机上执行。\n\n可以使用以下cmdlet结束交互会话：\n\
  \n```\nExit-PSSession\n```\n\n可以使用Invoke-Command cmdlet在一台或多台远程计算机上运行脚本；示例如下：\n\n\
  ```\nInvoke-Command -ComputerName Computer-1, Computer-2 -FilePath C:\\az800demo\\\
  az800script.ps1\n```\n\n脚本位于本地计算机的路径上，并在远程计算机上执行；结果将在本地屏幕上显示。\n\n可以使用New-PSSession\
  \ cmdlet用于持久会话；示例如下：\n\n```\n$s = New-PSSession -ComputerName Computer-1,Computer-2\n\
  ```\n\n### 第二跳PowerShell远程处理\n\n当将第一台远程计算机作为第一跳建立会话，但该计算机需要访问第二台计算机上的资源时，会出现挑战。\n\
  \n访问第二台服务器是第二跳，将被拒绝访问。这是因为会话是与第一台服务器建立的；会话凭据不会从第一台服务器传递到存放资源的第二台服务器。\n\n支持和解决此方案的配置方法如下：\n\
  \n- 在Invoke-Command脚本块中传递凭据：提供最简单的配置，但安全性较低\n- 配置基于资源的Kerberos受限委派：提供更高的安全性和更简单的配置\n\
  - Kerberos受限委派：提供最高级别的安全性，但需要域管理员\n- JEA：提供最佳安全性，但具有详细的配置\n- 使用RunAs的PSSessionConfiguration：提供更简单的配置，但凭据管理更复杂\n\
  - 配置凭据安全支持提供程序(CredSSP)：在安全性和配置便捷性之间取得最佳平衡\n- Kerberos不受限制的委派：不推荐\n\nCredSSP默认处于禁用状态，且应仅在最受信任的环境中使用。CredSSP会在第一跳远程服务器上缓存凭据，并使用这些凭据传递到正在直接打开会话的第二跳服务器。如果远程服务器被攻破，这会使我们面临凭据窃取攻击的风险。\n\
  \n\n\n\n### JEA\n\nJEA 通过基于角色的访问控制（**基于角色的访问控制 (RBAC)**）提供委派管理，并构建在 PowerShell 远程处理基础之上。\n\
  \nJEA 限制用户可以执行的操作和可以运行的 cmdlet 的数量和权限范围，并提供审计功能，以便更好地了解会话期间是谁做了什么。它是防御通过 _已妥协的特权帐户_\
  \ 进行横向移动攻击的关键，并基于 _最小特权_ 访问和权限运作。\n\nJEA 包含在 **PowerShell 5.0** 及更高版本中。要检查安装了哪个版本的\
  \ PowerShell，可以运行以下 PowerShell cmdlet：\n\n```\n$PSVersionTable.PSVersion\n```\n\n\
  要开始使用 JEA，希望看到如下所示的结果，其中 **主要版本** 为 5 或更高：\n\n| 主要版本 | 次要版本 | 生成版本 | 修订版本 |\n|-------|-------|-------|----------|\n\
  | 5 | 1 | 14393 | 1000 |\n\n始终建议为计算机提供最新版本的 PowerShell。\n\n以下列表详细说明了通过操作系统类型提供的\
  \ JEA 可用性：\n\n- 预安装：Windows Server 2016+、Windows 10 1607+\n- 功能受限的预安装：Windows 10\
  \ 1603、1511\n- 使用 **Windows Management Framework (WMF)** 5.1 的完整功能：Windows Server\
  \ 2012/R2、Windows 8、8.1\n- 使用 WMF 5.1 的功能受限版本：Windows Server 2008/R2、Windows 7\n\
  - 不可用：Windows 10 1507\n\nPowerShell 远程处理是 JEA 所需的基础，在使用 JEA 之前必须启用它。PowerShell 远程处理在\
  \ Windows Server 2012/R2、2016 中默认启用；使用 `Enable-PSRemoting` 命令启用它。\n\nJEA 创建用户连接的配置终结点；与配置的终结点关联的文件如下：\n\
  \n- 功能角色文件\n- 会话配置文件\n\n功能角色文件可通过 .prsc 文件扩展名标识。会话配置文件可通过 .pssc 文件扩展名标识。\n\n正如其名称所示，功能角色文件描述了基于\
  \ RBAC 在会话中可以执行的操作；其中列出了 cmdlet、提供程序、函数和外部程序。\n\n谁可以使用终结点以及他们有权访问哪些功能角色，在会话配置文件中定义。\n\
  \n可以使用以下命令创建空白配置文件的模板：\n\n```\nNew-PSSessionConfigurationFile -SessionType\nRestrictedRemoteServer\
  \ -Path .\\MyJEAEndpoint.pssc\n```\n\n创建功能角色文件和会话配置文件后，最后一步是注册终结点；为此使用以下 PowerShell\
  \ 命令：\n\n```\nRegister-PSSessionConfiguration -Path .\\AZ800JEAConfig.pssc\n-Name\
  \ 'JEAServeDEsk' -Force\n```\n\n有关配置的详细信息，可在以下 Microsoft 文档文章中找到：https://docs.microsoft.com/en-gb/powershell/scripting/learn/remoting/jea/session-configurations.\n\
  \n本节介绍了配置 PowerShell 远程处理以及一些挑战和风险。在下一节中，我们将完成一个实操练习部分，以加强本章涵盖的一些概念。\n\n### 实操练习\n\
  \n为支持您的学习并掌握一些实用技能，我们将利用本章前面各节获得的概念和理解，并将其应用于实际操作中。\n\n我们将学习以下练习：\n\n- 练习 – 在 Azure\
  \ 门户中实现 WAC\n\n### 开始使用\n\n要开始本节，如果您还没有 Azure 订阅，可以在 https://Azure.microsoft.com/free\
  \ 创建免费 Azure 帐户。此免费 Azure 帐户提供以下内容：\n\n- 12 个月免费服务\n- 30 天内探索 Azure 的 200 美元信用额度\n\
  - 25 多种始终免费的服务\n\n让我们继续本章的练习。\n\n### 练习 – 在 Azure 门户中实现 WAC\n\n本练习将介绍如何在 Azure 门户中实现\
  \ WAC 以管理 Azure VM。\n\n本练习需要具备以下条件：\n\n- 用作管理目标的 Azure VM。\n- 使用本地管理员帐户访问 VM。\n\
  - 从用于连接到 Azure 门户的管理计算机访问与 VM 相同的 VNet；这可以通过 VPN、公共 IP 地址或同一 VNet 上用作跳转主机的另一个 Azure\
  \ VM 实现。如果通过公共 IP 地址连接，应为 HTTP 443 和 TCP 6516 创建入站端口规则。\n\n按照以下步骤开始：\n\n1. 在要管理的\
