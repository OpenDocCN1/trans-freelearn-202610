  \ 从虚拟机边栏，单击边栏顶部菜单中的 + 创建，然后单击虚拟机。可选：单击了解更多超链接以获取更多信息和学习：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_230_1.png)\n\
