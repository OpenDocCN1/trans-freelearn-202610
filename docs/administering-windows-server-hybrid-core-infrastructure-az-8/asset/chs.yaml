  \n图 6.27 – 已创建的 VNet\n\n至此，我们已完成本练习。它教授了实现 Azure VNet 所需的技能。下一个练习将介绍实现 NSG。\n\n\
  ### 练习 – 实现 NSG\n\n在本练习中，我们将创建 VM 并在子网级别关联 NSG。然后，我们将添加规则以允许远程桌面协议 (RDP) 访问并拒绝出站\
  \ Internet 访问。\n\n在以下子部分中，您可以看到完成练习的步骤，已按任务划分，以便更好地理解。\n\n### 任务 1 – 访问 Azure 门户\n\
  \n- 1. 登录 Azure 门户：https://portal.azure.com。您也可以使用 Azure 桌面应用：https://portal.azure.com/App/Download。\n\
  \n\n\n\n\n### 任务 2 – 创建虚拟机\n\n- 在搜索栏中输入 virtual machines；从服务列表中单击 Virtual machines：\n\
