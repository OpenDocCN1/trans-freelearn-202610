- '# Windows Server 混合核心基础设施管理 AZ-800 考试指南：设计、实现和管理本地及云端的 Windows Server 核心基础设施






  本书是我为全球技术学习社区做出的贡献，我想感谢所有投入宝贵时间学习新技能并承诺阅读本书的读者。


  ## 贡献者


