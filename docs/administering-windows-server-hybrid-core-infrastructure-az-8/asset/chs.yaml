  图 13.6 – 角色分配


  可以使用 Cloud Shell 中的 PowerShell 通过 Get-AzRoleAssignment cmdlet 列出角色分配。


  以下是列出用户角色分配的示例：


  ```

  Get-AzRoleAssignment -SignInName smiles@milesbettersolutions.com

