  *谢谢 Steve，信任我对 Azure 的热爱。同时，特别感谢我的妻子支持我实现梦想。*







  ## 前言


  云计算是一种通常被视为平台和机制的技术，用于为组织提供数字化转型的推动器。但是，云计算之旅不必是一个二选一的决定；也不必是一个将所有工作负载都移到云端并下线所有本地资源的全面性决定。


  虽然这对某些组织来说可能是合适的、最佳的发展方向，但同样也有组织，出于数据本地性、合规性、控制权、性能等原因，情况并非如此。对于许多组织来说，仍需要保留适量的本地计算、存储网络及其他相关资源，以满足其技术需求。我们的职责不是评判或裁定对组织而言什么是对的或错的，而是提供选项，以满足和支持所有被授权或需要交付给组织的预期成果。


  怀着对云计算不断变化面貌的这种展望和心态，我们可以考虑将云计算的能力扩展到我们的数据中心，以增强和丰富从这些设施运营的服务。这可以被视为既关于从云端管理，也关于向云端迁移。


  我们承认，毫无疑问，数字化转型有着坚实的理由，对于许多人来说，云原生是首选方法；然而，对于许多人来说，旅程的第一步将是通过混合云计算方法进行数据中心现代化。数据中心还有许多年的使用寿命，而
  Windows Server 是一种计算和核心基础设施平台，应该通过云计算能力来丰富和增强。


  本书内容旨在全面覆盖考试要求，帮助你准备 AZ-800：管理 Windows Server 混合核心基础设施微软认证考试。


  本考试面向那些在混合环境中拥有丰富 Windows Server 操作系统工作经验，并实施和管理核心混合基础设施技术（包括计算、存储、网络、标识和管理）的候选人。


  此外，本书的附加价值在于，它旨在超越考试目标，提供额外的知识深度和实践动手技能，这些技能在日常混合 Windows Server 环境工作中将非常有价值。


  本书最后附有考试准备测试。


  ## 本书适用人群


  本书适用于那些希望通过 AZ-800：管理 Windows Server 混合核心基础设施考试的技术实施和管理人员。


  ## 本书内容概览


  第 1 章，实施和管理 Active Directory 域服务，包含在混合环境中创建和管理 Active Directory 域服务（AD DS）的内容。


  第 2 章，实施和管理 Azure Active Directory 域服务，包含创建和管理 Azure Active Directory 域服务（AAD DS）的内容。


  第 3 章，使用组策略管理用户和计算机，包含在 AD DS 和 AAD DS 中实施和管理组策略的内容。


  第 4 章，实施和管理混合标识，包含使用 Azure AD Connect 和 Azure AD 云同步实施和管理混合标识的内容。


  第 5 章，实施和管理本地网络基础设施，包含在混合环境中实施和管理本地网络基础设施的内容。


  第 6 章，实施和管理 Azure 网络基础设施，包含在混合环境中实施和管理 Azure 网络基础设施的内容。


  第 7 章，实施 Windows Server 存储服务，包含在混合环境中实施 Windows Server 存储服务的内容。


  第 8 章，实施混合文件服务器基础设施，包含在混合环境中实施 Azure 存储服务的内容。


  第 9 章，在 Windows Server 上实施和管理 Hyper-V，包含在混合环境中在 Windows Server 上实施和管理 Hyper-V 的内容。


  第 10 章，实施和管理 Windows Server 容器，包含在混合环境中实施和管理容器的内容。


  第 11 章，管理 Windows Server Azure 虚拟机，包含管理 Azure 虚拟机的内容。


  第 12 章，在混合环境中管理 Windows Server，包含在混合环境中管理 Windows Server 的内容。


  第 13 章，使用 Azure 服务管理 Windows Server，包含使用 Azure 服务管理 Windows Server 和工作负载的内容。


  第 14 章，考试准备模拟测试，为 Exam AZ-800：管理 Windows Server 混合核心基础设施的每个技能部分提供模拟测试。


