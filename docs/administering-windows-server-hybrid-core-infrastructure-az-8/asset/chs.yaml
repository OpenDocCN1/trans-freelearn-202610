- '## 实施和管理混合标识


  本章涵盖 AZ-800 管理 Windows Server 混合核心基础设施考试学习目标：_实施和管理混合标识_。


  在上一章中，我们增加了了解组策略概念、创建和管理的技能。


  本章将从一些概念和对混合标识的理解开始。然后，我们将介绍启用混合标识的 AD Connect 目录同步工具以及可用的混合标识身份验证方法。最后，我们将通过一个动手练习来进一步提升您的技能。本章将涵盖以下主题：


  - 混合标识是什么？

  - Azure AD Connect

  - 混合标识身份验证方法

  - 练习 – 实施 Azure AD Connect


  除了本章列出的主题外，本章的目标是让您的知识超越考试目标，为现实世界中日常混合环境相关的角色做好准备。


  ### 混合标识是什么？


  在本章的第一部分，我们将回顾一些定义和概念，以建立知识的基准和基础，以便在此基础上构建。


  微软提供两种 **身份提供者 (IDP)** 和 **目录服务 (DS)** 解决方案：**Active Directory (AD)** 和 **Azure
  Active Directory (Azure AD)**。


  简而言之，**AD** 是 **IDP** *专用*于 *单个组织* 的。它作为 Windows Server 的一部分以已安装服务的形式运行。


  简而言之，Azure AD 是微软的多租户、基于云且完全托管的 IDP 和 DS。Azure AD 可以被视为微软的 **身份即服务 (IDaaS)**。


  **混合标识** 为用户提供 *通用标识*。这只是一种无论资源和服务是基于云还是本地，都为用户提供访问权限的方式。这种方法意味着用户更少混淆，并且有一个可独立于位置或
  IDP 使用的标识。这可以在以下插图中可视化：


  ![](img/cf35f46a8dd5f11e58349c1d81611b75_128_0.png)


  图 4.1 – AD 和 Azure AD 集成


  在本节中，我们回顾了微软的 IDP、AD 和 Azure AD（在前两章中介绍过），并定义了什么是混合标识。下一节将介绍 Azure AD Connect 工具，即启用混合标识身份验证方法的基础。


  ### Azure AD Connect


  **Azure AD Connect** 是一个免费下载的工具，可启用 *混合标识* 并无缝连接和集成 AD 与 Azure AD。


  Azure AD Connect 通过将服务部署到 Windows Server（通常部署到专用服务器）来实现。但是，根据您的需求，也可以在域控制器上运行。


  在所选 Windows 服务器上安装 AD Connect 时，以下是 AD Connect 的操作：


  - 为目录同步配置的 AD 中存在或添加的用户、组和联系人对象将通过使用 Azure AD Connect 的同步过程复制到 Azure AD。请注意，用户没有自动许可证分配，例如
  M365。


  - AD 中对象属性的任何更改都将更新到 Azure AD 中的同步对象。Azure AD Connect 的 *同步服务管理器*（`miiscclient.exe`
  进程）允许您选择性同步哪些属性，因此如果不需要，并非所有属性都会被复制。


  - 从 AD 删除的任何用户、组和联系人也将从 Azure AD 中删除。


  - 对象的单一权威来源来自作为 *权威 IDP* 的 AD，而不是 Azure AD。这意味着，对 Azure 同步对象所需的任何更改必须在 AD 中进行其属性和更改，并允许通过同步过程将这些更改更新到
  Azure AD 对象中。


  - 前一点意味着 Azure AD 对象是 *只读的*，除非为 Azure AD 中的密码重置实现了回写解决方案，否则无法直接在 Azure AD 中更改它们。**自助式密码重置
  (SSPR) 回写** 是一个可选功能，允许对 Azure AD 进行密码更改，导致相同标识在不同 IDP 之间具有不同密码。这可以通过密码回写来解决，以便在
  Azure AD 中所做的密码更改可以发送回 AD 以更新对象属性，从而在 AD 和 Azure AD 目录中保持相同密码。


  ### Azure AD Connect 云同步


  Azure AD Connect 的类似功能也可在 **Azure AD Connect 云同步** 服务中使用。


  这是基于 *预配代理* 方法，而不是完全可安装的应用程序。配置和编排从 Azure AD 处理，而不是从 AD 本身处理。所有信息均存储在 Azure AD 中，而不是本地（AD
  Connect 工具安装并运行的位置）。该工具用于并购场景，其中许多多个断开连接和隔离的林需要与 Azure AD 集成。可以部署多个预配代理以提供目录同步的高可用性。


  ### Azure AD Connect 规划


  在使用 AD Connect 工具之前，必须考虑以下规划活动。规划是实施混合标识的关键：


  - 识别加入域的服务器以下载和安装 Azure AD Connect 工具和服务组件；根据需求，该工具可以直接安装在要同步的域中的 DC 服务器上，也可以安装在专用服务器上。支持的
  Windows Server OS 版本如下：


  - Windows Server 2016 或更高版本；标准版或数据中心版。


  - Windows Server Essentials 2019。


  - 将安装 AD Connect 的服务器必须运行完整 GUI；不支持 Windows Server Core。


  - 识别架构扩展和自定义属性。


  - 识别域功能级别。


  - 识别 AD 与 AD 对象属性和用户主名称 (UPN) 的准备情况。如果您有一个不可路由的域（例如本地域）用于用户 UPN，则应使用可以通过 Azure AD
  验证的域，例如有效的 Internet 域（如 .com 或 .net）。


  然后，您需要为用户设置 UPN 后缀以使用此 Azure AD 已验证域。如果您希望同步到 Azure AD，可以更改 Azure AD DS 域的主域，但更好的方法是向您希望添加到
  Azure AD 的已验证域添加 UPN 后缀。此更改在 **Active Directory Domains and Trusts** 管理控制台的 **UPN
  Suffixes Properties** 选项卡中进行。以下插图显示了此配置的位置：


  ![](img/cf35f46a8dd5f11e58349c1d81611b75_130_0.png)


  图 4.2 – 添加 UPN 后缀


  本主题将在本章的动手练习部分介绍。


  如果这满足您的需求，您可以添加多个 UPN 后缀并在 Azure AD 中添加和验证它们：


  - 1. 验证您拥有要添加到 Azure AD 以进行目录同步的选定域（域），并确保您有权访问 DNS 记录以进行更改。这是为了在将域添加到 Azure AD
  时能够验证这些域。


  - 2. 一旦同步的任何不可路由域已得到处理和准备，您就可以继续添加和验证用户的 AD DS UPN 后缀域（域）到 Azure AD，以用于目录同步和单点登录
  (SSO)。然后在此域在 Azure AD 中设置为租户的主域，即您不应使用租户的默认 .onmicrosoft.com 域。


  ### 暂存模式


  AD Connect 还可以在暂存模式下使用，允许在服务器激活前对配置进行更改和预览。它还允许通过在暂存模式下运行完整导入和同步来验证所有更改将按预期在生产环境中进行，从而进行预生产测试。暂存模式可用于高可用性、测试、部署配置的新更改以及停用或替换服务器等场景。


  在安装 AD Connect 时可以选择暂存模式，但不会运行任何导出。暂存模式不运行密码同步或回写。当禁用暂存模式时，将运行导出，并启用密码同步和回写。


  ### 快速安装和自定义安装


  快速安装方法旨在支持大多数客户大多数时间都有效的配置，新安装大约 90% 的时间使用此方法。


  快速安装假设以下条件：


  - 单个 Windows Server AD 林

  - 可用于安装的企业管理员帐户

  - Windows Server AD 林中少于 10,000 个对象


  快速安装提供以下配置结果：


  - 从 Windows Server AD 到 Azure AD 的密码哈希同步

  - 所有域和 OU 中所有合格对象的同步


  当您的场景与前面的假设和配置结果不匹配时，使用自定义安装方法。


  自定义安装假设以下条件：


  - 无法访问企业管理员帐户

  - 要同步的多个 Windows Server AD 林

  - 连接服务器无法访问的林域






  - 计划为用户登录使用联合身份验证或直通身份验证

  - Windows Server AD 林中超过 100,000 个对象需要使用完整的 SQL Server

  - 计划使用基于组的筛选，而不仅仅是域或 OU 的筛选


  ### AD 运行状况检查工具


  在通过 Azure AD Connect 实现目录同步之前，拥有一个运行状况良好的 AD 实例至关重要。将被标记并可修复的典型问题将与 UPN 和代理地址相关。IdFix
  工具将检查错误，并在识别后允许进行任何修复。


  在本节中，我们介绍了 Azure AD Connect 工具。我们还查看了 AD 运行状况检查工具。在下一节中，我们将查看混合身份验证方法。


  ### 混合身份验证方法


  混合身份验证需要一种支持 AD 与 Azure AD 集成的身份验证方法。使用 AD Connect，可以为用户配置以下登录方法，以在组织中启用混合身份验证：


  - Azure AD 密码哈希同步 (PHS)

  - Azure AD 直通身份验证 (PTA)

  - AD 联合身份验证服务


  以下屏幕截图显示了可用的登录方法和选项：


  ![](img/cf35f46a8dd5f11e58349c1d81611b75_132_0.png)


  图 4.3 – 云登录方法


  所选身份验证方法将取决于场景的需求。


  这些混合身份验证方法分为 *云身份验证* 和 *联合身份验证*。


  在以下各节中，我们将讨论每种身份验证方法。


  ### 云身份验证


  在云身份验证模型下，用户的登录凭据由 *Azure AD* 作为 IDP 进行处理。


  混合身份验证云身份验证提供两种登录方法：PHS 和 PTA。


  ### PHS


  在 PHS 混合身份验证模型中，用户 AD 密码哈希的哈希值会同步到 Azure AD 作为基于云的 IDP。这意味着每个 IDP 都有一份密码副本，但密码从未以明文形式存储。AD
  存储密码的哈希值，而 Azure AD 作为基于云的 IDP，存储 *哈希的哈希值*。


  现在，基于云的 IDP（即 Azure AD）中存储了用户密码的副本后，用户可以使用 *相同的密码* 登录 Azure AD 验证的服务（例如 Microsoft
  365 和 Dynamics 365），以登录经过 AD 验证的服务。这为用户提供了 *通用身份*，这意味着不再需要记住许多用户名和密码，只需记住一个。这为资源和服务（无论是基于云还是本地）提供了一种简单的身份验证方法。


  PHS 是实现 Azure AD Connect 时实施的默认云身份验证方法。


  以下关系图可视化了此 PHS 云身份验证模型：


  ![](img/cf35f46a8dd5f11e58349c1d81611b75_133_0.png)


  图 4.4 – PHS 身份验证登录


  关于将用户密码存储在基于云的 IDP 中的顾虑（即使密码哈希被进一步哈希），可以通过我们将在以下各节中介绍的 *PTA* 和 *联合身份验证* 模型来缓解。PHS
  可以作为联合身份验证的备份登录方法，但需要在 Azure AD 中存储密码。您的需求和要求将决定您的场景应采用的适当方法。


  ### PTA


  用户也可以在 *PTA* 混合身份验证模型中使用 *通用身份*。这允许使用单个用户名和密码登录使用 Azure AD 进行身份验证的基于云的资源和服务，以及登录经过
  AD 身份验证的资源和服务。与 *PHS* 一样，*PTA* 显著提高了用户生产力、安全性和身份治理。


  此身份验证方法与 PHS 的区别在于，密码 *从不* 存储在 Azure AD 中。所有密码验证都会 *始终* 直接传递到您的 AD 域控制器以执行身份验证，并且不会由
  Azure AD 进行验证。这确实意味着您的域控制器始终需要可用且可由 Azure AD 访问。


  但是，将基于云的身份验证完全依赖于访问本地域控制器以验证凭据并不是一种好的策略——如果由于洪水、火灾、连接丢失甚至全球大流行病而丢失了需要进行身份验证的本地位置，则您无法故障转移到云或访问基于云的资源和服务。


  实现资源访问可用性以及在面临失去与本地位置连接时的业务连续性的一种方法是，在 Azure 中作为 IaaS VM 创建 *副本域控制器*。如果发生本地连接故障，可以使用
  Azure 托管的域控制器来验证凭据，确保业务连续性并继续访问基于云的资源和服务。此方法需要跨本地混合网络，例如站点到站点 VPN 或 ExpressRoute；ADDS
  无法直接通过公共 Internet 终结点进行复制。


  另一种解决方案是将其与 *PHS 目录同步* 结合使用。当无法再联系本地域控制器时，这为用户身份验证提供了备份解决方案。但是，这确实需要将密码哈希存储在 Azure
  AD 中，这对某些人来说可能不可能。那么，在确定哪种方法最适合您的场景时，将存在权衡。联合身份验证也存在相同的本地访问依赖场景，我们将在下一节中再次对此进行说明。


  以下关系图可视化了 PTA 云身份验证模型：


  ![](img/cf35f46a8dd5f11e58349c1d81611b75_135_0.png)


  此身份验证模型的一项好处是，您的 AD 中的密码策略和安全策略可以得到强制执行。从网络安全角度来看，只有从 AD 到 Azure AD 的 *出站流量连接*；不会对您的
  AD 域控制器建立 *入站连接*。所有通信都是 *基于证书* 的，由 Azure AD 作为完全托管的服务颁发和管理。


  本节介绍了云身份验证登录方法。在下一节中，我们将介绍联合身份验证方法。


  ### 联合身份验证


  联合身份验证简单来说就是 *不同 IDP 之间为访问资源和服务而共享的信任*。


  Azure AD 是此场景中用于验证和对用户登录请求进行身份验证的 *受信任 IDP*。我们将在下一节中介绍联合身份验证。


  ### AD FS


  **Active Directory 联合身份验证服务 (AD FS)** 是 Microsoft 提供用于此联合身份验证的登录方法的服务。


  在联合身份验证混合身份验证模型中，用户的登录凭据会传递给除 Azure AD 以外的 IDP 以验证和对用户凭据进行身份验证。用于信任 Azure AD 的其他
  IDP 是 *Windows Server AD*，可以托管在本地服务器上或作为 Azure IaaS VM。还需要实现 AD FS 服务器基础设施，该基础设施需要在边缘网络中配置两台
  ADFS 代理服务器、两台联合身份验证服务器，并根据场景需要可选配置两台 SQL Server 服务器。此外，您还需要考虑网络、防火墙端口和证书；这绝非易事，且最复杂的情况也是如此。


  这与 PTA 方法的工作原理类似；但是，PTA 比联合身份验证更简单、更不复杂，并且不需要像 AD FS 那样配置任何额外的基础设施服务器。您应该考虑在用例允许时评估
  PTA 而非 AD FS；我们认识到在仅存在 AD FS 功能的所有场景中，这并非都可能。


  以下关系图可视化此 *联合身份验证模型*：


  ![](img/cf35f46a8dd5f11e58349c1d81611b75_136_0.png)


  图 4.6 – 联合身份验证登录


  如前一节关于 PTA 云身份验证模型中所了解的，这种方法确实意味着您的域控制器始终需要可用且可由 Azure AD 访问。与 PTA 身份验证模型所见相同的是，*PHS
  目录同步* 可以在 AD FS 基础设施发生故障时用作备份登录方法，以提供业务连续性策略。


  在本节中，我们介绍了混合身份验证方法。在下一节中，我们将根据我们的需求查看一些用例场景。


  ### 选择合适的混合身份验证方法


  由于身份是安全性的控制平面，因此确保每种身份验证方法都得到理解并根据需求选择至关重要。


  云身份验证和联合身份验证方法各有局限性；并非所有身份验证模型都支持所有用例场景。


  当您想要使用以下混合场景时，只能使用 PTA 和 AD FS 方法：


  - 防止密码哈希存储在云中 (Azure AD)






  当您要使用以下混合场景时，只能使用 AD FS 方法：


  - 实施本地多重身份验证 (MFA)

  - 提供智能卡身份验证


  在下图中，我们将查看决策树，以帮助您选择最合适的身份验证方法来满足您的需求：


  ![](img/cf35f46a8dd5f11e58349c1d81611b75_137_0.png)


  图 4.7 – 混合标识身份验证方法


  为清晰起见并降低复杂性，该图不打算表示所有场景的所有决策点。为简化起见，仅显示核心场景。


  本节探讨了如何选择最合适的混合标识方法来满足您的需求。在下一节中，我们将查看 SSO。


  ### SSO


  混合标识也可以提供 SSO 功能选项。这允许已使用其 AD 凭据登录到设备的用户自动登录到云资源和服务。


  SSO 与联合身份验证（例如 AD FS）和云身份验证（例如 PTA）配合工作。这确保了对 Azure AD 经过身份验证的资源的任何访问请求都由 AD 作为
  IDP 而非 Azure AD 进行验证。在网络操作中，它更安全，因为它不需要入站访问；所有流量均从同步代理发出的出站流量，并通过 Microsoft 托管的证书进行保护。


  PTA 为 SSO 提供了与 AD FS 类似的功能，但其实现和操作的复杂性较低，因为它不需要 AD FS 基础结构。


  术语 SSO 不应与“相同登录”（same sign-on）混淆，后者也可能令人困惑地被称为 SSO。


  通过 PHS 云身份验证方法提供的目录同步允许用户使用相同的凭据访问云资源，但在已登录 AD 的情况下访问 Azure AD 经过身份验证的资源时，他们仍需重新输入凭据。


  本节探讨了 SSO 的实现。在下一节中，我们将完成一个动手练习部分，以巩固本章中涵盖的一些概念。


