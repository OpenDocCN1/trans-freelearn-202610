  \n图 9.29 – 连接到 VM\n\n至此，我们已完成本练习。本练习教会了我们如何创建来宾虚拟机。现在，让我们总结本章。\n\n### 摘要\n\n本章内容有助于您发展有关使用\
  \ Hyper-V 进行虚拟化的知识和技能，并涵盖了 AZ-800 管理 Windows Server 混合核心基础结构：管理 Hyper-V 和来宾虚拟机。\n\
