  \n- 7. 单击“下一步: 安全”。\n\n- 8. 保留 BastionHost、DDoS 防护标准和防火墙的默认禁用设置：\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_227_1.png)\n\
