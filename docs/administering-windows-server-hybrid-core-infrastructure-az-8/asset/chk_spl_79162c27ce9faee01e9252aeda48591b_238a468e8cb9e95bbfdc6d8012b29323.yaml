  alternative: 索引/附录部分标题（正文结束后的参考材料）
  counter_evidence:
  - 标题为 `### Index`，三级标题层级远低于正文章节，典型的书末索引区块标记
  - Index 之后是字母表索引列表（Symbols、A、B...），属于参照材料，不满足章标题应统领后续正文的语义特征
  - 该标题出现在所有章节、习题和摘要之后，属于出版物末尾附录，不应作为独立正文章节分割
