  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_369_0.png)


    # Figure 10.4 – Installing Docker via WAC


    The WAC container management experience is shown in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_369_1.png)


    # Figure 10.5 – Container management with WAC'
