- pgno: 370
  md: 'Now, you can specify the image you want to run from MCR.


    # Maintaining container images


    Container images should be regularly updated to ensure they receive changes that
    are made via code and patching.


    The base OS layer contains OS elements that the host OS does not share. It comprises
    two images: the base layer and the update layer. The base layer is the larger
    layer but changes the least amount and needs the least amount of maintenance;
    the update layer is smaller. The following diagram represents these layers:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_370_0.png)


    Figure 10.6 – Container image update layers


    In the update layer, a new image is created for each code change. The base OS
    layer gets its updates from the updates layer.


    In this section, we looked at managing Windows containers. In the next section,
    we will complete a hands-on exercise to reinforce some of the concepts that were
    covered in this chapter.


    # Hands-on exercises


    To support your learning with some practical skills, we will utilize the concepts
    and understanding we gained from this chapter and put them to practical use.


    We will look at the following exercises:


    +   - Exercise – installing Docker on Windows Server using PowerShell

    +   - Exercise – installing Docker on Windows Server using WAC


    # Getting started


    To get started with this section, you will need access to a Windows server; this
    can be physical, virtual, or an Azure IaaS VM. You will need access to an elevated
    PowerShell session and have WAC installed with admin access.


    Let''s move on to the exercises for this chapter.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# # Exercise – installing Docker on Windows Server using PowerShell


    In this exercise, we will install Docker on a Windows Server using PowerShell.
    To do so, we will use a Windows Server 2019 Gen2 VM.


    Follow these steps to get started:


    +   1. Log into your Windows Server for this exercise using an admin account and
    open an elevated PowerShell session.


    +   2. Run the following command to install the Docker-Microsoft PackageManagement
    Provider from the Windows PowerShell Gallery:


    ```

    Install-Module -Name DockerMsftProvider -Repository

    PSGallery -Force

    ```


    +   3. Install the latest version of Docker using the PackageManagement Windows
    PowerShell module:


    ```

    Install-Package -Name docker -ProviderName

    DockerMsftProvider`

    ```


    The following is the output from the command:


    | Name | Version | Source | Summary |

    | --- | --- | --- | --- |

    | Docker | 20.10.9 | DockerDefault | Contains Docker EE for use with Windows Server.
    |


    Figure 10.7 – Installing Docker


    +   4. Restart the host when the Docker installation is complete using the following
    command:


    ```

    Restart-Computer

    ```


    +   5. Log back into the server and re-open an elevated PowerShell session.


    +   6. Run the following command to ensure the Docker service is running on the
    host:


    ```

    Start-Service docker

    ```


    +   7. Run the following command to check the Docker version that''s been installed:


    ```

    docker version

    ```'
  merge: -1
