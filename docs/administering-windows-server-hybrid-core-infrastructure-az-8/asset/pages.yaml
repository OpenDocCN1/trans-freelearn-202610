- pgno: 379
  md: '# # Managing Windows Server Azure Virtual Machines


    In the previous chapter, we learned about containerization as a concept and saw
    how to implement and manage Windows Server containers.


    This chapter covers content from AZ-800 Administering Windows Server Hybrid Core
    Infrastructure: Manage Azure Virtual Machines that run Windows Server.


    This content does not aim to cover all aspects of the management of Windows Server
    Azure Virtual Machines (VMs); the content is limited in scope to only the exam
    skills outline. Some content from the exam objectives has already been covered
    in other chapters and will not be duplicated.


    In addition to covering the following topics, this chapter''s goal is to take
    your knowledge beyond the exam objectives to prepare you for a real-world, day-to-day,
    hybrid-environment-focused role.


    The following topics are covered in this chapter:


    +   - Managing Azure VM data disks

    +   - Resizing Azure VMs

    +   - Configuring continuous delivery for an Azure VM

    +   - Configuring connections to VMs


    We will then conclude with a hands-on exercise to develop your skills further.


    # ## Managing Azure VM data disks


    When a VM is created, it must use a system disk that holds the operating system;
    this will be the C : \\ drive. In addition, for some VM types, you can specify
    a temp disk that is automatically provisioned at the time of VM creation; this
    will appear as the D : \\ drive.'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'We will not focus or cover content on the system disk types as this exam objective
    section discusses the data disk type.


    The **data disk** can be attached to a VM in addition to the system and temp disk
    and is used if additional disk storage or layout is needed. This may be for installing
    software such as SQL Server, where we want different disk layouts for data, logs,
    and so on, or you may select data disks for performance reasons due to the effects
    of disk caching on the OS disk.


    For applications and operations that are performance-sensitive, you should ensure
    you use a data disk for the installation path and storage of data rather than
    the OS disk. The reason for this is that by default, the OS disk has *read/write
    caching* enabled, which can impact performance on certain applications, such as
    a database; this includes a domain controller’s database.


    Microsoft advises domain controller IaaS VMs to use a data disk with caching disabled
    (by default, it’s read caching) and *not* to use the OS disk to prevent write
    caching issues with operations. The recommendation is that the AD DS database
    (*ntds.dit*), logs, and **System Volume** (**SYSVOL**) use a volume on a data
    disk with caching disabled. Disk caching can be set using the Azure portal or
    with PowerShell. We can use the following PowerShell cmdlet:


    ```

    AzVMDataDisk

    ```


    More information can be found on caching performance and configuration in the
    following Microsoft Learn modules:


    +   • https://docs.microsoft.com/en-us/learn/modules/caching-and-performance-azure-storage-and-disks/


    +   • https://docs.microsoft.com/en-us/learn/modules/caching-and-performance-azure-storage-and-disks/6-exercise-manage-cache-settings-with-powershell


    The data disk will be detached and reattached when changing the caching, but the
    VM does not need to be restarted, so there is no downtime with this operation;
    however, changing the system disk caching will cause a reboot of the VM.


    **Adding** a new disk and **detaching** a disk will not require downtime of the
    VM; no VM restart is required. If the disk is not detached and you wish to resize
    the disk, the VM the disk is attached to will need to be deallocated; this will
    cause downtime. One feature, **LiveResize**, allows a drive to be expanded without
    downtime; information can be found in the following Microsoft documentation: https://docs.microsoft.com/en-us/azure/virtual-machines/windows/expand-os-disk#expand-without-downtime.


    The following PowerShell cmdlets can be used for managing data disks:


    +   • **New-AzDiskConfig**: This cmdlet creates a configurable disk object'
  merge: -1
  img_proc: true
- pgno: 381
  md: '+   • Add-AzVMDataDisk: This cmdlet attaches a data disk to a VM


    +   • $myVM.StorageProfile.DataDisks: This provides info on the data disks, such
    as name, disk size, caching, logical unit number (lun id), and so on


    The following are the different disk types that can be attached to an Azure IaaS
    VM:


    +   • Standard HDD: Provides the lowest cost storage, lowest performance, and
    lowest durability


    +   • Standard SSD: Provides consistent performance and low latency


    +   • Premium SSD: Provides high performance and low latency


    +   • Ultra Disk: Provides sub-millisecond latency


    The disk stock-keeping units (SKUs) available to be selected for a data disk are
    represented in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_381_0.png)


    Figure 11.1 – Azure VM disk SKUs'
