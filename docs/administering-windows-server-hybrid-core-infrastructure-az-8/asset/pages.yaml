    2012 R2 and Windows Server 2016 are now considered out of support. The following
    steps cover Enhanced Session Mode:


    +   1. This can be turned on from Hyper-V Settings; select Enhanced Session Mode
    Policy under the Server settings, as shown in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_338_0.png)


    Figure 9.10 – Enabling the Enhanced Session Mode Policy setting


    +   2. Next, under the User settings, select Enhanced Session Mode as shown in
    the following screenshot:'
  merge: -1
