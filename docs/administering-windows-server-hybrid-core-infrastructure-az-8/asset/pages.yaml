- pgno: 339
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_339_0.png)


    # Figure 9.11 – Enable the Enhanced Session Mode setting


    When you open VMConnect, you will see the VM''s local device resources that can
    be accessed and used:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_339_1.png)


    # Figure 9.12 – Accessing local resources via VMConnect'
