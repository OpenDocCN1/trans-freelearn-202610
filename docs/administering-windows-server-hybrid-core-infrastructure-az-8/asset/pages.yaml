  md: "# # To get the most out of this book\n\nFor this book, the following are required:\n\
    \n+   - A device with a browser, such as Edge or Chrome, to access the Azure portal:\
    \ https://portal.azure.com\n+   \n+   - An Azure AD tenancy and Azure subscription;\
    \ you can use an existing account or sign up for free: https://azure.microsoft.com/en-us/free\n\
    +   \n+   - An Owner role for the Azure subscription\n\n| Software/hardware covered\
    \ in the book | |\n|---|---|\n| Windows Server | Azure AD |\n| Hyper-V | Azure\
    \ Compute services |\n| Active Directory | Azure Storage services |\n| iSCSI storage\
    \ | Azure Networking services |\n| Storage Spaces and Storage Spaces Direct |\
    \ Azure Security services |\n| File Storage | Azure Management services |\n\n\
    # # Download the color images\n\nWe also provide a PDF file that has color images\
    \ of the screenshots/diagrams used in this book. You can download it here: https://packt.link/Mc8to.\n\
    \n# # Conventions used\n\nThere are a number of text conventions used throughout\
    \ this book.\n\nCode in text: Indicates code words in text, database table names,\
    \ folder names, filenames, file extensions, pathnames, dummy URLs, user input,\
    \ and Twitter handles. Here is an example: “The primary server is set with the\
    \ Delay configuration attribute in the Scope properties on the secondary server.”\n\
    \nA block of code is set as follows:\n\n```\nInstall-WindowsFeature Web-Application-Proxy\n\
    -IncludeManagementTools\n```\n\n**Bold:** Indicates a new term, an important word,\
    \ or words that you see on screen. For example, words in menus or dialog boxes\
    \ appear in the text like this. Here is an example: “Launch **DNS Manager** from\
    \ **Server Manager** under the **Tools** menu.”"
