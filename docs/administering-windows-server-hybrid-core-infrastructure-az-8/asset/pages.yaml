    settings are as needed, you can click **Create**.

    +   6. You will receive a notification that the resource was **created successfully**.

    +   7. Click **Go to resource** from the **Deployment** blade; alternatively,
    navigate to the **Private DNS zones** blade.


    # **Task 5 – Linking VNets**


    +   1. Search **All resources** for the zone created or navigate to the **Private
    DNS zones** blade and open your created zone.

    +   2. From the **Private DNS zones** blade, under **Settings**, select **Virtual
    network links**.

    +   3. From the **Virtual network links** blade, click + **Add** from the top
    menu of the blade.

    +   4. Enter a **Link name** value.

    +   5. Select a **Subscription** type.

    +   6. Select the **Virtual network** configuration you will link the zone to.

    +   7. Optionally, select whether to enable auto registration.

    +   8. Select **OK**.

    +   9. You will receive a notification that the resource was **created successfully**.

    +   10. Click **Go to resource** from the **Deployment** blade; alternatively,
    navigate to the **Private DNS zones** blade.

    +   11. Adding and testing records is the same process as the steps we completed
    in the **Creating a public zone** task.


