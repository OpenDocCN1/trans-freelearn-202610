    To support your learning with some practical skills, we will utilize the concepts
    and understanding gained from the earlier sections of this chapter and put them
    into practical application.


    We will look at the following exercises:


    +   - Exercise—assigning access to an Azure VM


    +   - Exercise—creating an Azure Policy assignment


    +   - Exercise—setting up Microsoft Defender for Cloud


    +   - Exercise—setting up Microsoft Sentinel'
  merge: -1
  img_proc: true
