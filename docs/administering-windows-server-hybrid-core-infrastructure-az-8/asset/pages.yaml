- pgno: 340
  md: 'The settings for VMConnect can be changed using Command Prompt or PowerShell
    with the following command:


    ```

    VMConnect.exe <ServerName> <VMName> /edit

    ```


    # VM resource groups


    You can use VM resource groups to group VMs and perform orchestrated operations
    at scale on the group rather than individual VMs.


    The following are the PowerShell cmdlets for this function:


    +   - Add-VMGroupMember

    +   - Get-VMGroup

    +   - New-VMGroup

    +   - Remove-VMGroup

    +   - Remove-VMGroupMember

    +   - Rename-VMGroup


    This can only be implemented using PowerShell as there is no Hyper-V Manager option.


    # CPU groups


    VM CPU groups allow you to manage and allocate host CPU resources across guest
    VMs with ease. With CPU groups, you can do the following:


    +   - Create groups of VMs with differing allocations shared across the group
    for the host''s CPU resources. Different classes of services can be created for
    differing VM types.

    +   - Set specific groups so that they have CPU resource limits; this caps the
    group''s amount of host CPU resources it can consume. This can enforce a class
    of service that''s desired for that group.

    +   - Set a group''s constraints to run only on a specific set of the host''s
    CPUs. This can provide VM isolation between different CPU group members.


    The Hyper-V Host Compute Service (HCS) manages CPU groups. Here, the cpugroups.exe
    command-line utility can be used.


    CPU groups can be quite complex and there''s more to them than what''s been detailed
    in this section; please refer to the following Microsoft documentation on this
    functionality: https://docs.microsoft.com/en-us/windows-server/virtualization/hyper-v/manage/manage-hyper-v-cpugroups.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# # Hypervisor schedulers


    Windows Server 2016 introduced new *virtual processor scheduling logic modes*.
    How work is managed and allocated across guest virtual processors by the Hyper-V
    hosts is defined by these *modes* or *scheduler logic types*.


    The scheduler types are as follows:


    +   - Classic scheduler

    +   - Core scheduler

    +   - Root scheduler


    More details on each of these scheduler types can be found in the following Microsoft
    article on the topic: https://docs.microsoft.com/en-gb/windows-server/virtualization/hyper-v/manage/about-hyper-v-scheduler-type-selection.


    Beginning with Windows Server 2019, the *core scheduler* is the default for the
    maximum-security posture to ensure security is by default. For these security
    reasons, Microsoft recommends changing the default *classic scheduler* in Windows
    Server 2016 to enable the *core scheduler* to protect against potentially malicious
    VMs.


    When the *core scheduler* is configured, the guest VMs can optionally use **simultaneous
    multithreading** (SMT), which allows separate, independent execution threads to
    share the same processor resources.


    SMT can be enabled on a guest VM with the following PowerShell command:


    ```

    Set-VMProcessor -VMName <VMName> -HwThreadCountPerCore <n>

    ```


    The scheduler is configured on the host via the entry in the *hypervisorschedulertype*
    BCD. You can change the scheduler type from Command Prompt with administrator
    privileges using the following command:


    ```

    bcdedit /set hypervisorschedulertype "type"

    ```


    Here, "type" is either the *classic*, *core*, or *root* scheduler that can be
    entered into the command.


    > > **Note**

    > > Hyper-V does not support, at the time of writing, the *root scheduler* and
    should *not* be configured for *virtualization scenarios*.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# VM checkpoints


    Each guest VM in Hyper-V can have one of the following checkpoints configured:


    +   * **Production checkpoint**: This is a point-in-time image of a VM that can
    be restored. This uses a backup function within the VM to create the checkpoint
    instead of the saved state function.


    +   * **Standard checkpoint**: This is a running VM’s state, data, and hardware
    configuration capture. It is intended for test and development use cases.


    Checkpoints for each VM can be enabled or disabled. Follow these steps to enable
    checkpoints:


    +   1. From **Hyper-V Manager**, right-click the VM and click **Settings**.

    +   2. Select **Checkpoints** under the **Management** section.

    +   3. Select **Enable checkpoints**; to _disable_ it, clear the checkbox.

    +   4. Click **Apply** to save your changes, then click **OK** to finish.


    To change the checkpoint type, follow these steps:


    +   1. From **Hyper-V Manager**, right-click the VM and click **Settings**.

    +   2. Select **Checkpoints** under the **Management** section.

    +   3. Select **Production** or **Standard** checkpoints.

    +   4. Optionally, you can choose to store the checkpoints in a different location;
    use the **Checkpoint File Location** section and set it as _required_.

    +   5. Click **Apply** to save your changes, then click **OK** to finish.


    The default for new machines is _production_.


    # NIC teaming


    Network Interface Card (NIC) teaming is a technology provided by third-party hardware
    vendors and uses multiple network adapters to aggregate bandwidth. If a network
    adapter fails, traffic failover is provided to avoid connectivity and traffic
    flow loss.


    However, Microsoft provides no support channel for this hardware vendor’s technology
    and no configuration information for the individual hardware vendors implementing
    this technology; your hardware vendor should provide configuration assistance
    for your scenario.


    Please refer to the following official Microsoft support policy for NIC teaming
    with Hyper-V: https://docs.microsoft.com/en-us/troubleshoot/windows-server/virtualization/support-policy-nic-teaming.'
  merge: -1
  img_proc: true
- pgno: 343
  md: "# Hyper-V Replica\n\nHyper-V Replica is a built-in capability in the Hyper-V\
    \ role. It allows you to replicate VMs between Hyper-V hosts to support high availability\
    \ goals; it creates a live copy of a VM that's replicated to an offline VM. The\
    \ data can be configured to synchronize every 30 seconds, 5 minutes, or 30 minutes\
    \ to meet your Recovery Point Objective (RPO) target.\n\nThe primary and secondary\
    \ host servers can be in the same physical location or replicated over a WAN link.\
    \ Hyper-V Replica supports standalone and clustered Hyper-V hosts. There is no\
    \ dependency on Active Directory for the Hyper-V hosts.\n\nFollow these steps\
    \ to configure Hyper-V Replica:\n\n+   1. Configure the Hyper-V hosts:\n+   \n\
    +      I. A minimum of two hosts are required, with one or more VMs on each.\n\
    +   \n+      II. From the *Hyper-V settings* of the host, select **Enable this\
    \ computer as a Replica server** in the **Replication Configuration** section.\n\
    +   \n+      III. Select **Use Kerberos for HTTP** or use **Certificate-based\
    \ authentication** for HTTPS.\n+   \n+      IV. To allow the replica server to\
    \ allow VM replication traffic from any authenticated primary server, select **Allow\
    \ replication from any authenticated server**. To accept VM replication traffic\
    \ only from the specifically selected primary servers, select **Allow replication\
    \ from the specified servers**.\n+   \n+      V. Click OK to complete.\n\n+  \
    \ 2. Configure the firewall(s). VM replication traffic must be permitted across\
    \ the network; you should configure the Windows firewall and any third-party firewalls.\n\
    \n+   3. Enable VM replication. For each VM to replicate, do the following:\n\
    +   \n+      I. From **Hyper-V Manager**, right-click a VM and open the **Enable\
    \ Replication Wizard** area by clicking on **Enable replication**. Complete the\
    \ wizard's steps as per your requirements. Detailed steps can be found in the\
    \ following Microsoft documentation: https://docs.microsoft.com/en-gb/windows-server/virtualization/hyper-v/manage/set-up-hyper-v-replica.\n\
    \n+   4. Carry out a failover. You can run a *test failover*, a *planned failover*,\
    \ or an *unplanned failover*.\n\nOnly a single recovery point with the latest\
    \ replication from the primary server is the default configuration for Hyper-V\
    \ Replica. Additional recovery points can be stored up to a maximum of *24-hourly\
    \ recovery points*. Both *crash-consistent* and *app-consistent* recovery points\
    \ can be created."
  merge: -1
  img_proc: true
- pgno: 344
  md: '# # Managing a VM remotely


    The following tools are all ways to connect remotely to a VM running on a Hyper-V
    Host; this may be useful for automated configuration and operations, as well as
    troubleshooting and support tasks where console access may have been lost:


    +   * **PowerShell Remoting**: This method allows a local user''s PowerShell session
    to send commands to be executed locally on a remote VM running on the Hyper-V
    host. This can be enabled with the PowerShell `Enable-PSRemoting` cmdlet.


    +   * **PowerShell Direct**: This method allows you to directly connect inside
    a VM running on a Hyper-V host without the need for a network connection. This
    uses the _Hyper-V VMBus_ to connect to the VM. You can use the PowerShell `PSession`
    or `Invoke-Command` cmdlet.


    +   * **HVC.exe**: This method allows a direct **secure shell protocol (SSH)**
    connection to a Linux VM on a Hyper-V host.


    In this section, we learned how to create and manage Hyper-V guest VMs. In the
    next section, we will look at securing the workloads running on the Hyper-V hosts.


    # # Securing Hyper-V workloads with Guarded Fabric


    We will introduce this section by looking at the Guarded Fabric security solution
    at an overview level and then explore each component in the following subsections.


    # # Guarded Fabric


    **Guarded Fabric** is a collection of component services and capabilities that
    allows a security solution to protect VMs against inspection, theft, and tampering,
    and malicious actors, humans, or malware from compromised VMs or hosts.


    Guarded Fabric is comprised of the following components at its core:


    +   * **Shielded VM**: You specify templates and images that a VM must use to
    be a Shielded VM.


    +   * **Guarded Host**: You specify which hosts are secure for running Shielded
    VMs.


    +   * **Host Guardian Service (HGS)**: This ensures that only authorized and secure
    Guarded Fabric Hosts can run Shielded VMs. It provides the key service to the
    Guarded Hosts.


    The Guarded Fabric security solution is shown in the following diagram:'
  merge: -1
  img_proc: true
- pgno: 345
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_345_0.png)


    Figure 9.13 – Guarded Fabric components


    The following VM types can run in Guarded Fabric with different security levels:


    +   - Shielded VM: Provides the greatest protection with the highest security
    measures

    +   - Encrypted Standard VMs: Not as protected as Shielded VMs

    +   - Standard VMs: No protection and provides the least security measures


    In this section, we introduced the Guarded Fabric security solution. The following
    subsection will look at the Host Guardian Service’s components and operation.


    # Host Guardian Service


    The Host Guardian Service (HGS) comprises two core components:


    +   - HGS Attestation service: Only authorized and safeguarded hosts can run a
    Shielded VM through Attestation. Two Attestation modes are available to ensure
    Guarded Hosts only run approved code; these are as follows:

    +       - TPM-trusted Attestation: The Guarded Host approval in this mode is based
    on three types of information: Trusted Platform Module identity, Measured Boot
    sequence, and the code integrity policy.

    +       - Host key Attestation: The Guarded Host approval in this model is based
    on a key possession.

    +   - Key Protection Service (KPS): This allows a Guarded Host to power on Shielded
    VMs through provided keys. A Shielded VM can also be migrated to another Guarded
    Host with these security keys.


    The Admin-trusted Attestation mode was included in Windows Server 2016 but was
    deprecated in Windows Server 2019.'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'The following steps can be used to start a Shielded VM in Guarded Fabric:


    +   1. The Shielded VM is requested to be started by a user.

    +   2. The Guarded Host requests Attestation for the HGS before the Shielded VM
    can start.

    +   3. The HGS Attestation service validates the credentials of the Guarded Host.

    +   4. A certificate is sent to the Guarded Host by the HGS Attestation service.

    +   5. The Attestation certificate is submitted to the KPS by the Guarded Host.
    Using an encrypted secret, a key is requested to unlock the Shielded VM.

    +   6. The KPS determines the certificate’s validity from the Guarded Host, retrieving
    the key to unlock the Shielded VM by decrypting the secret.

    +   7. The Guarded Host receives the key from KPS.

    +   8. The Shielded VM is started by it being unlocked with the key.


    The HGS role can be implemented using the **Add Roles and Features Wizard** area
    of Server Manager or with the following PowerShell cmdlet:


    ```

    Install-WindowsFeature HostGuardianServiceRole

    -IncludeManagementTools -Restart

    ```


