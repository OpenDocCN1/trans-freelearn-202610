    # Exercise – Implementing an NSG


    In this exercise, we will look to create a VM and associate an NSG at the subnet
    level. We will then add rules to allow Remote Desktop Protocol (RDP) access and
    deny outbound internet access.


    In the following sub-sections, you can see the procedure to complete the exercise,
