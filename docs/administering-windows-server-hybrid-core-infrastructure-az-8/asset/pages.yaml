- pgno: 262
  md: '# # Managing Windows Server file servers


    This section will look at the file-based storage solutions in Windows Server.
    We will start this chapter by looking at definitions and concepts to help set
    a baseline and foundation of knowledge that you can build from.


    # ## What is a Windows Server filesystem?


    When a disk is presented to a computer, for it to be used for stored data, volumes
    must be created for it, which you then format with a filesystem. In this section,
    we will examine the question of what is a filesystem.


    A filesystem is a mechanism or structure that allows you to hierarchically organize
    files and their access. It contains directories and folders created on a volume.
    It allows you to control a naming convention and format that can be stored. It
    also provides security and protection through access control.


    The following filesystem types can be used with Windows Server storage systems:


    +   - File Allocation Table (FAT), FAT32, Extended File Allocation Table (exFAT)

    +   - New Technology File System (NTFS)

    +   - Resilient File System (ReFS)


    In the following sections, we will look at these filesystems and the other filesystem
    technologies available on Windows Server.


    # ## What are the FAT, FAT32, and exFAT filesystems?


    FAT is the simplest but least secure filesystem used by Windows. It uses a volume-level
    table for filesystem objects; the root directory and tables are fixed on a formatted
    disk. For resiliency, two copies of a table are kept.


    The maximum volume size for FAT is 4 GB; FAT32 and exFAT support a maximum of
    64 GB for partitions.


    There is no security mechanism with FAT or FAT 32, so you should not use these
    volume types on any Windows Server OS computers. External media such as USB flash
    drives are the intended use case for the FAT, FAT32, and exFAT filesystems.


    # ## What is the NTFS filesystem?


    NTFS is the standard Windows Server OS filesystem.


    Unlike FAT, FAT32, and exFAT, NTFS security is built-in and provides file and
    folder access control lists (ACLs) to provide granular access to and control of
    the files and folder structure. NTFS also provides encryption and compression;
    a file or folder can only be encrypted or compressed, but not both.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'The intended use case for NTFS is for the Windows Server OS boot and data volumes.


    Windows Server roles such as Active Directory Domain Services (AD DS), Volume
    Shadow Service (VSS), and Distributed File System (DFS) will require NTFS as the
    filesystem.


    # What is ReFS?


    Resilient File System (ReFS) was introduced with the Windows Server 2012 OS. As
    its name suggests, the primary enhancement over NTFS is its data corruption enhancements.
    ReFS supports a maximum of 35 Petabytes (PB).


    Like NTFS, security is built-in and provides file and folder ACLs to provide granular
    access to and control of the files and folder structure. But unlike NTFS, it provides
    no encryption or compression.


    The intended use case for ReFS is data volumes, not boot volumes or removable
    media.


    # What is FSRM?


    File Server Resource Manager (FSRM) is a feature that''s included in the Window
    Server File and Storage Services server role.


    It is used to manage and classify data stored on file servers. Quotas can be set
    on folders, reports can be created for storage usage monitoring, and files can
    automatically be classified based on those performing tasks. The FSRM management
    console can be seen in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_263_0.png)


    Figure 7.1 – FSRM console'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'The features of FSRM are as follows:


    +   - Quota Management

    +   - File Screening Management

    +   - Storage Reports Management

    +   - File classification infrastructure

    +   - Access-denied assistance


    FSRM is configured and managed using the File Server Resource Manager app or PowerShell.
    FSRM only supports NTFS-formatted filesystems and does not support ReFS.


    Quotas can be created to limit volume or folder size; auto-generated quotas can
    also be applied to existing volumes or folders'' subfolders and any that are created
    in the future. Quota templates can also be created for volumes and folders to
    enforce company-wide governance. Email notifications can be sent for quota limits
    that are met or exceeded.


    The File Screening Management capability allows the file types a user can save
    to be controlled, such as no music files or executables. New volumes and files
    can have file screen templates applied so that company-wide governance can be
    enforced; file screen exceptions can be created. Notifications can be generated
    when users attempt to save unauthorized files.


    # What is SMB?


    Server Message Block (SMB) is a file-sharing protocol used on a TCP/IP-based network.
    The protocol is used by an application to access files on a remote server.


    SMB 3.0 was introduced in Windows Server 2012 and included the following features:


    +   - SMB Multichannel

    +   - SMB Direct

    +   - SMB Transparent Failover

    +   - SMB Scale-Out

    +   - SMB Encryption

    +   - PowerShell management commands


    SMB 3.1.1 was introduced in Windows Server 2016 and provided improved encryption,
    preauthentication integrity to provide man-in-the-middle attack protection, and
    removal of the RequireSecureNegotiate setting with the ability to disable Secure
    Negotiate where required.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# What is VSS?


    Windows Server uses VSS to perform backups. For the data to be backed up, VSS
    coordinates activities to ensure consistent copies of data. These copies of data
    are called **shadow copies** and are also known as **snapshot** or **point-in-time**
    copies. A VSS solution has the following components:


    +   - **VSS service**: This is the OS component that coordinates and orchestrates
    the operations.

    +   - **VSS requester**: A requester is typically a backup software such as Windows
    Server Backup that requests the VSS service. It requests shadow copy operations
    such as *create*, *import*, and *delete*.

    +   - **VSS writer**: This component provides a guaranteed consistent dataset
    for the backup operation. The writer is typically a part of the workload application
    that is backed up, such as Microsoft SQL Server. The Windows OS has VSS writers
    for various components.

    +   - **VSS provider**: This component creates the shadow copies and maintains
    them. They act as proxies for the VSS service.


    These VSS components can be seen in the following diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_265_0.png)


    Figure 7.2 – VSS components


    VSS supports volumes with a maximum size of 64 TB. SMB 3.0 must be used if you
    need SMB file shares to work in conjunction with VSS.


    # How does VSS work?


    The **VSS requestor** (*your backup software*) will query the workload for a backup
    (snapshot copy) to determine the installed **VSS writers**.


    The **VSS writer** is instructed to perform a **data quiesce** task. The snapshot
    copy is then requested to be created by the **VSS provider**.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'When the backup has been completed, the VSS writer performs any other post-backup
    tasks required and then returns the workload to normal operations.


    In this section, we introduced the topic of Windows Server filesystems and their
    related technologies. In the next section, we will look at implementing Windows
    Server iSCSI.


    # # Implementing Windows Server iSCSI


    In this section, we will look at **Internet Small Computer System Interface (iSCSI)**,
    which is pronounced as *scuzzy* (SKUZ-ee), like *fuzzy*.


    # ## What is iSCSI?


    To set the scene, **Small Computer System Interface (SCSI)** is defined as a set
    of standards that connects and transfers data between computers and peripheral
    connected devices, such as disks.


    iSCSI is a **storage area network (SAN)** technology protocol, and its communication
    with storage systems is done over Ethernet networks using TCP/IP. It emulates
    the local bus SCSI disk drive interconnect, making remote storage systems appear
    to the storage clients as local bus storage systems.


    iSCSI is an alternative to the **Fibre Channel (FC)** and **Fibre Channel over
    Ethernet (FCoE)** protocol storage systems. iSCSI is cheaper and less complex
    to implement but has lower reliability and performance as the communications are
    sent using TCP/IP.


    Now, let''s look at its components.


    # ## What are the iSCSI components?


    iSCSI uses the following physical and logical components:


    +   - **Physical components:**


    +   - **Ethernet network**: This is the physical transport medium that connects
    iSCSI clients (computers) to iSCSI storage systems. Standard network switches
    and RJ45 copper Ethernet cables are used; no specialist FC SAN switches or cabling
    is required.


    +   - **iSCSI initiator**: This is the client (computer) interface component.
    It is responsible for packaging the SCSI commands to be sent to the storage system
    and sending them over the Ethernet network as TCP/IP packets. This is included
    in the Windows Server OS. To implement it, the service needs to be started and
    configured.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '+   - iSCSI target: This is the storage system interface component. The iSCSI
    target represents the storage system where SCSI commands will be processed; the
    target will appear as local storage to the initiator side server. The initiator
    scales to 256 iSCSI targets, with 512 virtual disks per server, provides VHD or
    VHDX files for virtual disks, and provides authentication. In the Windows Server
    OS, it is implemented as a server role under File and Storage Services. This role
    is installed and managed using Server Manager, Windows Admin Center, or PowerShell.


    +   - Logical components:


    +   - iSCSI Qualified Name (IQN): This is a logical name component. It provides
    a unique worldwide identifier for identifying an iSCSI node. It uses the IQN and
    does not use an IP address for identification and communication on the network.
    The node can be either an initiator or a target. The iSCSI initiators must be
    configured with an IQN and then use the IQN to contact and communicate with the
    iSCSI targets.


    +   - Internet Storage Name Service (iSNS): This is a logical name component.
    It is a protocol used by iSCSI initiators to locate storage resources through
    discovery (such as DNS for iSCSI) and allows iSCSI devices to be configured and
    managed.


    These components are shown in the following diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_267_0.png)


    Figure 7.3 – iSCSI components


    Both the initiator and target components are included in the Windows Server OS.
    The iSCSI initiator is included in all supported Windows OS versions.


    In this section, we looked at the components of an iSCSI solution. In the next
    section, we will look at how it works.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# # How does iSCSI work?


    As a storage protocol, iSCSI operates within the Open Systems Interconnection
    (OSI) network stack model.


    iSCSI commands sent between a server and a storage system are encapsulated in
    TCP/IP packets and sent over an Ethernet network as any regular network packet;
    the payload can be a SCSI command. The packets are then passed back up through
    the network stack, and the SCSI commands are stripped out and interpreted as local
    device SCSI commands by the storage system. Data transmitted between the storage
    system and client computers follow the same TCP/IP encapsulation.


    This concept is shown in the following diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_268_0.png)


    Figure 7.4 – iSCSI encapsulation


    This contrasts with the FC and FCoE SAN protocols, which are alternative methods
    of transporting the block data.


    To identify initiators and targets, FC uses World Wide Names. For iSCSI addressing,
    IQN iSCSI Qualified Names, as defined in RFC-3271, are used.


    The IQN has a limit of 255 characters, and the format is as follows:


    +   - iqn.yyyy-mm.naming-authority:unique name

    +   - iqn.2004-07.com.example:MBS_Target_1_SN_WC786556


    Next, let''s look at how it is implemented.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# # How is iSCSI implemented?


    iSCSI transmits information in IP packets over an Ethernet network infrastructure.
    This can be dedicated to storage traffic or sharing the data network but segregated
    by using virtual local area networks (VLANs) and Quality of Service (QoS) for
    performance.


    To increase performance, an iSCSI host bus adapter (HBA) or TCP Offload Engine
    (TOE) card can be used to offload the IP packet processing from the server’s processors.


    The following should be considered when implementing iSCSI:


    +   - Workloads

    +   - Network topology

    +   - Performance

    +   - Security

    +   - High availability

    +   - The skill sets of staff and cross-function team collaboration


    We will look at some of these considerations in the following sections.


    # ## Workloads


    You should consider the use cases and types of workloads you need a storage system
    for in your environments, such as block, file, and object-based.


    iSCSI target servers can provide access to block-based storage systems that are
    required by applications such as SQL Server, Exchange, and others.


    The data is accessed at the block level, which refers to the data blocks and the
    SCSI commands; these commands and data are encapsulated in packets and sent over
    an Ethernet network to iSCSI initiators for client access.


    iSCSI-connected storage systems can be heterogenous; the iSCSI initiator is not
    dependent on the Windows OS, meaning support for multi-platform storage clients.


    Diskless and network boot scenarios are also supported using differencing disks
    to save storage space.


    # ## Network topology


    You should consider whether a shared storage and data network topology or a network
    dedicated to storage will be implemented. This is important to evaluate in the
    planning stage as this can impact network performance and has security considerations.
    For shared data and storage networks, QoS should be configured for the network.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'The minimum network speed should be 1 Gbps; a 10 Gbps, 40 Gbps, or 100 Gbps
    infrastructure can be used.


    The following is a reference architecture for a shared storage and data network
    topology:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_270_0.png)


    Figure 7.5 – iSCSI Ethernet network topology


    In this preceding topology, an Ethernet network infrastructure is shared between
    storage and data traffic but segregated logically with separate VLANs for data
    traffic and storage traffic.


    The following is a reference architecture for a dedicated storage network topology:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_270_1.png)


    Figure 7.6 – iSCSI Ethernet network topology


    In this preceding topology, an Ethernet network infrastructure is dedicated to
    storage traffic. The storage traffic is isolated physically by the dedicated storage
    switches.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# ## Security


    You should consider using a dedicated network that is isolated. iSCSI does not
    support zoning, so the initiator and target are configured with password-based
    authentication for spoofing attack protection. To authenticate initiator connections,
    Challenge-Handshake Authentication Protocol (CHAP) is used; reverse CHAP is used
    to authenticate the iSCSI target.


    Logical unit number (LUN) masking is the same as FC, but the IQN is used for client
    identification instead of a WWPN. To enhance security, IPSec can provide end-to-end
    encryption.


    # ## High availability


    You should consider how redundancy will be provided. You can use Microsoft Multipath
    Input/Output (MPIO) or Multiple Connections per Session (MCS) as follows:


    +   - MPIO: This multipathing software can provide redundant network paths to
    a target for multiple sessions to the same target. The multipathing software is
    responsible for choosing the paths to take.


    +   - MCS: This provides the target with multiple TCP/IP connections from the
    initiators for the same iSCSI session.


    In this section, we looked at how iSCSI is implemented and concluded the topic
    of implementing Windows Server iSCSI. The following section will look at implementing
    Storage Spaces and Storage Spaces Direct.


    # ## Implementing Storage Spaces and Storage Spaces Direct


    This section will introduce storage virtualization using Microsoft Storage Spaces
    and Storage Spaces Direct. The first technology we will introduce in this section
    will be Storage Spaces; we will compare it with Storage Spaces Direct in the next
    section and understand the differences.


    # ## What is Storage Spaces?


    Storage Spaces is a Microsoft storage virtualization technology that allows the
    local disks of a computer to be aggregated into an array of disks that can be
    used to create virtual disks. It is also a way to provide storage system redundancy
    through protection against drive failures. This can be used as an alternative
    to the traditional disk failure protection method of a Redundant Array of Independent
    Disks (RAID) solution.


    When selecting a storage technology for a given scenario, Storage Spaces provides
    an inexpensive storage solution that is simple to implement and manage while being
    scalable and reliable.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# # How does Storage Spaces work?


    Storage Spaces is similar in concept to the traditional SAN storage model. In
    this model, physical disks from a storage enclosure are grouped/aggregated to
    provide a RAID pool. From this, we create LUNs, which are presented to a server
    as one or more volumes by initializing them, assigning a drive letter, and then
    formatting them with filesystem such as NTFS. This can be seen in the following
    diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_272_0.png)


    Figure 7.7 – Traditional SAN concept


    In the Storage Spaces model, physical disks are grouped from a pool of disk resources,
    and in this storage pool of physical disks, virtual disks are created; a virtual
    disk is equivalent to a LUN. These virtual disks can be presented to a computer,
    then initialized and brought online so that they can be formatted and have a drive
    letter assigned. A Storage Spaces virtual disk can be formatted with FAT32, NTFS,
    and ReFS.


    Storage Spaces has the following components:


    +   * **Storage pools**: These are physical disks that are combined to create
    a pool of disk resources from which virtual disks can be created. The disks in
    the pool can be of different types and sizes; the pools abstract the underlying
    physical disks, and much like in compute virtualization, the hardware layer is
    abstracted. The physical disk can only be a part of one pool.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   * **Storage spaces**: These are equivalent to RAID sets (pools) and are
    virtual disks in this terminology. They are created on the physical disks from
    the available space in the storage pools. A volume is a virtual disk partition
    and can have a drive letter assigned; volumes are the equivalent of LUNs on a
    SAN.


    The relationship between these components can be seen in the following diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_273_0.png)


    Figure 7.8 – Storage Spaces components


    Storage Spaces can provide the following functionality:


    +   * **Storage tiers**: Different disk types and speeds can be used in a pool,
    such as **hard disk drives (HDD)** and **solid-state drives (SSD)**; USB drives
    can even be used to create a storage pool. Storage Spaces uses tiering to achieve
    capacity and performance balance. It automatically moves data that is more frequently
    accessed to faster disks and to slower disks for less frequently accessed data.
    Data is moved once a day at 01:00 A.M. You can configure which storage is used
    by files and pins as required.


    +   * **Provisioning models**: Storage Spaces provides two provisioning models
    for virtual disks, as follows:


    +   * **Thick (fixed) provisioning**: This creates a fixed size at the point of
    creation.


    +   * **Thin provisioning**: This does not pre-allocate a size at the point of
    creation and utilizes just-enough and just-in-time creation. A trim process can
    reclaim unused allocated space.


    A storage pool can have both *thin* and *fixed* provisioned virtual disks.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '+   - Resiliency levels: Storage Spaces provides three resilience models, as
    follows:

    +     - Simple: Maintains one copy of the data. This level is suitable for workloads
    that have no requirement for resiliency through storage spaces.

    +     - Parity: Maintains two copies of the data with a single parity and three
    copies with dual parity. This level is suitable for sequential large read/write
    operations in pattern workloads.

    +     - Mirror: Maintains two copies of the data in a two-way mirror and three
    copies in a three-way mirror. This level is suitable for all workloads.


    +   - Write-back caching: This allows you to write data to disks so that it can
    be optimized and is enabled by default. This works with tiering to write to faster
    disks automatically when a peak in disk writing is detected.


    +   - Management: Storage Spaces can be managed in Server Manager using the File
    and Storage Services role, Windows Admin Center, PowerShell, and APIs.


    Storage Spaces also has some limitations, as follows:


    +   - No support for boot or system volumes

    +   - No support where the physical disks are abstracted from the storage layer,
    such as VM pass-through disks, and where a separate RAID layer is introduced

    +   - No support for FC, FCoE, or iSCSI

    +   - Formatted or partitioned disks cannot be added to a storage pool

    +   - The same sector size must be used for all disks in a storage pool

    +   - Only Serial Attached SCSI (SAS) storage can be used with failover clusters


    In this section, we looked at how Storage Spaces works. In the next section, we
    will introduce Storage Spaces Direct, which has a similar name, but you should
    be aware that it is a different solution. We will look at how it compares to Storage
    Spaces.


    # What is Storage Spaces Direct?


    Storage Spaces Direct is a software-defined storage solution; it enables multiple
    compute cluster nodes in a converged or hyper-converged technology stack to have
    their local disks presented and aggregated into a single scalable and resilient
    shared storage system. It can be likened to a virtual SAN. It was first introduced
    as a Windows Server storage technology with Windows Server 2012.


    Storage Spaces Direct can be found as a core technology of Azure Stack HCI, an
    Azure service that is Microsoft’s data center modernization and private cloud
    OS platform. Storage Spaces Direct is also supported as an Infrastructure-as-a-Service
    (IaaS) storage solution to be implemented in the Azure public cloud.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'To recap on the previous sections, Storage Spaces, in contrast, was a much
    simpler solution for aggregating local disks on a single computer and using these
    local resources to create virtual disks on which you could create volumes. Storage
    Spaces is not redundant and is still a direct component of Storage Spaces Direct,
    which we will look at in the next section.


    Storage Spaces Direct provides several capabilities and benefits, some of which
    are as follows:


    +   - Scales to 4 PB per cluster.

    +   - USB flash drive witness.

    +   - ReFS volumes compression and deduplication. The first 4 TB of a file is
    deduplicated, with 64 TB supported per volume.

    +   - Mirror accelerated parity.


    In this section, we introduced Storage Spaces Direct. In the next section, we
    will look at how it works.


    # How does Storage Spaces Direct work?


    The Storage Spaces Direct software-defined solution works by creating a cluster
    by connecting several servers (nodes) with local storage drives over Ethernet;
    no storage fabric, special cables, or adapter is required.


    Storage Spaces Direct uses the following components:


    +   - Failover clustering role

    +   - Cluster Shared Volume (CSV) filesystem

    +   - Storage spaces

    +   - Software Storage Bus

    +   - SMB 3


    A core component of Storage Spaces is CSVs, which allow all nodes’ NTFS and ReFS
    volumes to have reads and writes simultaneously. There is no locking, masking,
    change of drive ownership, or dismounting and mounting volumes; this allows for
    faster failovers and provides load balanced distribution of requests to the storage
    from the compute.


    To implement Storage Spaces Direct, you will need to enable Storage Spaces Direct
    on a failover cluster that you have created as a prerequisite step. The next stage
    is to aggregate the storage drives from each server in the cluster and create
    a software-defined pool of virtual shared storage. Volumes will be presented as
    drives to the VMs where you store data, such as virtual hard disk (VHD) files,
    which will then be created in the storage pool. The volumes use the CSV filesystem
    so that each server will see the volumes as locally mounted and can be accessed
    and perform operations simultaneously.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'In this section, we looked at how Storage Spaces Direct works. In the next
    section, we will look at its deployment options.


    # What are the Storage Spaces Direct deployment options?


    Storage Spaces Direct provides deployment options that support both converged
    and hyper-converged infrastructure systems. The hyper-converged deployment is
    the only one supported by Azure Stack HCI.


    # Converged deployment


    The converged deployment uses separate clusters for storage and compute, also
    called disaggregated deployment. Compute and storage clusters can be scaled independently
    to meet your needs. This deployment model is shown in the following over-simplified
    diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_276_0.png)


    Figure 7.9 – Converged deployment model


    This model provides a Scale-out File Server (SoFS) layer above Storage Spaces
    Direct to provide SMB 3 network shares. This may be a use case for a Virtual Desktop
    Infrastructure (VDI) scenario.


    # Hyper-converged deployment


    The hyper-converged deployment uses a single cluster for both compute and storage.
    This deployment model is shown in the following over-simplified diagram:'
  merge: -1
  img_proc: true
- pgno: 277
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_277_0.png)


    Figure 7.10 – Hyper-converged deployment model


    Storage Spaces Direct can be deployed as part of a Windows Server cluster or an
    Azure Stack HCI cluster.


    Storage Spaces Direct is not a complex solution to implement, as would be the
    case with a traditional SAN, due to the software-defined nature of the solution.
    Server Manager, Window Admin Center, and PowerShell can be used.


    In this section, we looked at the deployment options for Storage Spaces Direct,
    which has concluded the topic of implementing Storage Spaces and Storage Spaces
    Direct. In the next section, we will look at Windows Server Data Deduplication.


    # # Implementing Windows Server Data Deduplication


    This section introduces **Data Deduplication** in the context of the technology
    component included in Windows Server.


    # ## What is Windows Server Data Deduplication?


    Windows Server includes **Data Deduplication** as an installable and configurable
    server role. The premise of Data Deduplication as a technology is to use less
    storage space by removing duplicated data while the integrity of the system is
    still maintained.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'The components of Windows Server Data Deduplication are as follows:


    +   - Deduplication service:

    +     - Deduplication and compression

    +     - Garbage collection

    +     - Scrubbing

    +   - Filter driver

    +   - Unoptimization


    The performance impact of deduplication is minimized using multi-threaded post-processing
    and utilizes a variable-size chunk store that can maximize space by using optional
    compression.


    # How does Windows Server Data Deduplication work?


    The Windows Server implementation of Data Deduplication works based on two principles:


    +   - Optimization should not affect *disk writes*. A post-processing model is
    used; all data is *first* written to disk and *then* optimized.

    +   - Optimization should not affect *user access*. It must be transparent to
    the user that they are accessing deduplicated files on an optimized volume.


    The deduplication process consists of the following five steps:


    +   1. The filesystem is scanned for files that match an optimization policy

    +   2. Files are broken into variable-size chunks

    +   3. Unique chunks are identified

    +   4. Chunks are moved to the chunk store and, optionally, compressed

    +   5. The original file data is replaced with a chunk store reparse point


    Before implementing deduplication, you should assess your environment to determine
    whether there is enough duplicate information to make the task worthwhile. The
    following are workloads that are recommended as good candidates for deduplication
    due to the duplicate data that''s often stored:


    +   - General-purpose file servers; shares such as user home folders, work folders,
    and software repository shares

    +   - VDI

    +   - Virtualized backup applications such as **Microsoft Data Protection Manager
    (DPM)**'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'The following will have limited benefits from deduplication:


    +   * General-purpose Hyper-V hosts

    +   * SQL servers

    +   * Line-of-business (LOB) servers


    Data Deduplication cannot process the following data on volumes:


    +   * System state files

    +   * Encrypted files

    +   * Extended attribute files

    +   * Files that are 32 KB or smaller

    +   * Files that have been explicitly excluded from the scope of deduplication

    +   * Files that don''t meet the configured policy for deduplication


    Data deduplication is supported on NTFS. For ReFS volumes, the max volume size
    supported is 64 TB, and files with a maximum size of 4 TB.


    # What disk size savings can be expected?


    The following indicates disk space savings that are typical in deduplication scenarios:


    +   * User documents: 30 to 50 percent saving

    +   * Cab files, software binaries, images, and updates: 70 to 80 percent saving

    +   * Virtual hard disk files: 80 to 95 percent saving

    +   * General file share mix of preceding data types: 50 to 60 percent saving


    The disk size savings that can be achieved will depend on the data type and mix
    factors.


    # How is Windows Server Data Deduplication implemented?


    Data Deduplication is implemented by installing it as a server role using Server
    Manager, Windows Admin Center, or PowerShell.


    The following PowerShell cmdlet can be used:


    ```

    Add-WindowsFeature -Name FS-Data-Deduplication

    ```


    Once the server role has been added, Data Deduplication needs to be enabled; this
    can be done with Server Manager, Windows Admin Center, or PowerShell.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'The following PowerShell cmdlet can be used:


    ```

    Enable-DedupVolume -Volume *VolumeLetter* -UsageType *StorageType*

    ```


    The parameter value for -UsageType should be one of the following three types:


    +   • **Hyper-V**: This type is used for a volume hosting Hyper-V storage

    +   • **Backup**: This type is used for a volume hosting virtualized backup servers

    +   • **Default**: This type is used for general-purpose volumes


    The default settings, if not sufficient, can be changed to meet your scenario,
    as follows:


    +   • Process the optimization of files sooner

    +   • Changes to garbage collection and scrubbing schedules

    +   • Volume directories or file types don''t need to be deduplicated


    To edit the default settings, you can use the following PowerShell cmdlet:


    ```

    Set-DedupVolume

    ```


    Deduplication jobs can be run on-demand or by configuring schedules; we will cover
    this in the following sections.


    # How to run jobs on demand


    The following on-demand job types can be run:


    +   • **Optimization**: Start-DedupJob -Volume *VolumeLetter* -Type Optimization

    +   • **Data scrubbing**: Start-DedupJob -Volume *VolumeLetter* -Type Scrubbing

    +   • **Garbage collection**: Start-DedupJob -Volume *VolumeLetter* -Type GarbageCollection

    +   • **Unoptimization**: Start-DedupJob -Volume *VolumeLetter* -Type Unoptimization


    Due to the intensive nature of processing the garbage collection job, this should
    only be run outside regular operating hours and only when the deletion load threshold
    has been reached.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# How to schedule jobs


    Three schedules are set by default when the server is enabled for Data Deduplication
    for volumes; these are as follows:


    +   - **Optimization**: This job is scheduled to run every hour

    +   - **Garbage collection**: This job is scheduled to run once a week

    +   - **Scrubbing**: This job is scheduled to run once a week


    All jobs run on all volumes; to have a job run on a particular volume, a new job
    must be created.


    Job schedules can be managed with the following PowerShell cmdlets:


    +   - `Get-DedupSchedule`

    +   - `New-DedupSchedule`

    +   - `Set-DedupSchedule`

    +   - `Remove-DedupSchedule`


    The `Get-DedupSchedule` cmdlet cannot be used for Windows Task Scheduler custom
    job schedules.


    In this section, we concluded the topic of implementing Windows Server Data Deduplication.
    In the next section, we will look at Windows Server Storage Replica.


    # Implementing Windows Server Storage Replica


    This section introduces Storage Replica in the context of the technology component
    included in Windows Server.


    # What is Windows Server Storage Replica?


    **Storage Replica** is an installable Windows Server feature that''s used with
    the file server role to provide high availability and disaster recovery of volumes
    for physical or virtual machines. It can be used for standalone servers or clusters
    and stretched failover clusters between physical sites.


    Data Deduplication is supported on NTFS and ReFS volumes; *Windows Server OS volumes*
    cannot be replicated using Windows Server Storage Replica.


    # How does Windows Server Storage Replica work?


    It works at the block level using SMB 3 and thin provisioning and provides unidirectional
    replication with automatic failover.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'Kerberos AES 256 is used for authentication, and delegated administration is
    supported. Designated network adapters can be configured to control replication
    traffic.


    Two NTFS or ReFS volumes are required at each source and destination. One pair
    is used to replicate data between the source data volume (the primary) and the
    target or destination (the secondary); the other pair is used to replicate logs.


    The following replication methods are provided:


    +   - **Synchronous replication**: This method is used when volumes are in close
    network proximity and require low latency between replication nodes. It provides
    crash-consistent replication of volumes, which provides zero filesystem-level
    data loss.


    +   - **Asynchronous replication**: This method is used in stretch cluster scenarios,
    where there is a greater distance between the volumes, and the network latency
    will be greater than 5 **milliseconds (ms)**. This replication method is subject
    to data loss, the amount being dependent on the primary and secondary replication
    volume''s lag time.


    When data loss must be avoided, then synchronous replication should be used.


    This should be enabled on the source server data volumes for Data Deduplication.
    This will automatically replicate the deduplicated content of the volumes between
    the primary and secondary volumes.


    # How is Windows Server Storage Replica implemented?


    Storage Replica can be implemented with the file server role and Storage Replica
    feature using Server Manager, Windows Admin Center, or PowerShell.


    Before Storage Replica can be implemented using one of the previous methods, there
    are some prerequisites; these are as follows:


    +   - The volumes to be replicated must be on servers that are members of an AD
    DS forest; workgroup servers are not permitted.


    +   - Each server requires at least 2 CPU cores and 2 GB of RAM.


    +   - The OS must be one of the following:


    +   - *Windows Server 2016 Datacenter edition*

    +   - *Windows Server 2019 Datacenter edition*

    +   - *Windows Server 2022 Datacenter edition*

    +   - *Windows Server 2019 Standard edition; however, this only supports a single
    volume of up to 2 TB for replication*


    +   - **Remote Direct Memory Access (RDMA)** is preferable for synchronous replication
    for each server; however, at a minimum, a 1-gigabit Ethernet adapter is required.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '+   Each source and destination server must have a volume for data and a volume
    for logs; the specific criteria are as follows:


    +   GUID Partition Table (GPT) - initialized disks; not **master boot record (MBR)**


    +   ReFS- or NTFS- formatted volumes


    +   Matching volume sizes and sector sizes for data and log volumes


    +   More performant storage should be used for the log volumes than the data volumes


    +   No other workloads should access the log volumes


    +   Servers hosting the replicated volume must have the following bi-directional
    communications allowed:


    +   ICMP


    +   SMB (port 445) and SMB Direct (port 4445)


    +   WS-MAN (port 5985)


    +   Less than 5 ms latency is required on the network between replication nodes
    for synchronous replication


    The Test-SRTopology PowerShell cmdlet can validate whether the source and target
    volumes meet the preceding prerequisites; you can access the report that''s been
    generated with TestSrTopologyReport .html.


    In this section, we looked at the prerequisites for implementing Storage Replication,
    thereby concluding the topic of implementing Windows Server Storage Replication.
    In the next section, we will look at implementing the DFS role in Windows Server.


    # Implementing the DFS


    The **Distributed File System (DFS)** in Windows Server comprises two server roles
    that can be installed as follows:


    +   DFS Namespaces (DFSN or DFS-N): This DFS role allows you to group shared folders
    on a collection of file servers into logical namespaces. This allows users to
    navigate shared folders that exist across multiple file servers and maybe across
    different sites. This simplifies the user journey of finding documents and files
    by providing a centralized folder namespace, similar to a global UNC path. It
    provides this through the file server abstraction layer without knowing which
    server holds which share folder, file, and so on.


    +   DFS Replication (DFSR or DFS-R): This DFS role allows you to efficiently replicate
    folders between multiple servers and on multiple sites. It only replicates changed
    blocks, not entire files; it uses the **remote differential compression (RDC)**
    algorithm to do so.'
  merge: -1
  img_proc: true
