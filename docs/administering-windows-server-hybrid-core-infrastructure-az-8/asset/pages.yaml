    Figure 11.2 – Azure VM Premium disk support


    The preceding screenshot shows that the **E2s_v4** VM size is showing as **Supported**
    for attaching a Premium disk, but the **E2_v4** VM size shows as **Not supported**.
    The “s” in the naming of the VM denotes that these VM sizes can support a Premium
    disk SKU.


    To simplify selecting a VM size that meets your requirements, such as needing
    a Premium disk SKU for the data disk, you can add a filter for VMs that support
    Premium disks. This is represented in the following figure:


    Home > Virtual machines > Create a virtual machine >


    # Select a VM size ...


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_382_1.png)


    Figure 11.3 – Azure VM size Premium disk filter


    In this section, we looked at managing IaaS VM data disks. In the next section,
    we will look at how to resize VMs.'
  merge: -1
