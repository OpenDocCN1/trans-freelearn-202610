- pgno: 127
  md: '# # Implementing and Managing Hybrid Identities


    This chapter covers the AZ-800 Administering Windows Server Hybrid Core Infrastructure
    exam learning objective: _Implement and manage hybrid identities_.


    In the previous chapter, we added skills to understand the concepts, creation,
    and management of Group Policy.


    We will start this chapter with some concepts and an understanding of hybrid identity.
    We will then look at the AD Connect directory synchronization tool that is the
    enabler for a hybrid identity and the hybrid identity authentication methods available.
    We will then conclude with a hands-on exercise to develop your skills further.
    The following topics will be covered in this chapter:


    +   • What is a hybrid identity?

    +   • Azure AD Connect

    +   • Hybrid identity authentication methods

    +   • Exercise – Implementing Azure AD Connect


    In addition to the topics listed in this chapter, this chapter’s goal is to take
    your knowledge beyond the exam objectives to prepare you for a real-world, day-to-day
    hybrid environment-focused role.


    # ## What is a hybrid identity?


    In this first section of this chapter, we will recap some definitions and concepts
    to set a baseline and foundation of knowledge to build from.


    Microsoft provides two **identity provider (IDP)** and **Directory Service (DS)**
    solutions; **Active Directory (AD)** and **Azure Active Directory (Azure AD)**.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'In a nutshell, **AD** is an **IDP** *dedicated* to a *single organization*.
    It runs as an installed service as part of Windows Server.


    Azure AD, in a nutshell, is Microsoft''s multi-tenant, cloud-based, and fully
    managed IDP and DS. Azure AD can be considered Microsoft''s **Identity as a Service
    (IDaaS)**.


    A **hybrid identity** provides users with a *common identity*. This is simply
    a means to provide users access to resources and services regardless of whether
    they are cloud-based or on-premises. This approach means less confusion for users
    and one identity that can be used independently of location or IDP. This can be
    visualized in the following illustration:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_128_0.png)


    Figure 4.1 – AD and Azure AD integration


    In this section, we provided a recap of Microsoft''s IDPs, AD, and Azure AD, which
    we covered in the first two chapters, and defined what a hybrid identity is. The
    following section looks at the Azure AD Connect tool, the foundation for enabling
    hybrid identity authentication methods.


    # Azure AD Connect


    **Azure AD Connect** is a free download tool enabling *hybrid identities* and
    seamlessly connecting and integrating AD with Azure AD.


    Azure AD Connect is implemented by deploying the service to Windows Server, usually
    to a dedicated server. However, depending on your needs, it could also be run
    on a domain controller.


    The following are the operations of AD Connect when installed on the chosen Windows
    server:


    +   * Users, groups, and contact objects that exist or are added to AD configured
    for directory synchronization are copied to Azure AD through a synchronization
    process using Azure AD Connect. Note that users have no automatic license assignment,
    such as M365.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '+   • Any changes to an object''s attributes in AD will be updated to the synchronized
    object in Azure AD. The *Synchronization Service Manager* (the `miiscclient.exe`
    process) of Azure AD Connect allows you to be selective about what attributes
    are synchronized, so not all are copied if required.


    +   • Any deleted users, groups, and contacts from AD are also deleted from Azure
    AD.


    +   • The single source of authority for objects comes from AD as the *authoritative
    IDP* and not Azure AD. This means any changes required in the Azure synchronized
    objects must have their attributes and changes made in AD and allow those changes
    to be updated in the Azure AD objects by the synchronization process.


    +   • The previous point means that Azure AD objects are *read-only* and cannot
    be changed directly in Azure AD unless a writeback solution is implemented for
    password resets in Azure AD. **Self-service password reset (SSPR) writeback**
    is an optional feature that allows password changes to Azure AD, leading to the
    same identity having different passwords between IDPs. This can be solved with
    password writeback, so password changes made in Azure AD can be sent back to AD
    to update the objects attribute so that the same password is maintained in both
    AD and Azure AD directories.


    # ## Azure AD Connect cloud sync


    Similar capabilities of Azure AD Connect are also available in the **Azure AD
    Connect cloud sync** service.


    This is based on a *provisioning agent* approach rather than a fully installable
    application. The configuration and orchestration are handled from Azure AD rather
    than from AD itself. All information is stored within Azure AD rather than locally,
    where the AD Connect tool is installed and running. The tool has a use case for
    mergers and acquisitions where many multiple disconnected and isolated forests
    are required to be integrated with Azure AD. Multiple provisioning agents can
    be deployed to provide high availability for directory synchronization.


    # ## Azure AD Connect planning


    The following planning activities must be considered before using the AD Connect
    tool. Planning is everything when it comes to implementing a hybrid identity:


    +   • Identifying a domain-joined server to download and install the Azure AD
    Connect tool and components of the service; based on needs, the tool can be installed
    directly on a DC server in the domain to be synchronized or on a dedicated server.
    The following are the supported Windows Server OS versions:


    +   • Window Server 2016 or later; standard or datacenter edition.


    +   • Windows Server Essentials 2019.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '+   - The server where AD Connect will be installed must run a full GUI; Windows
    Server Core is not supported.

    +   - Identifying schema extensions and custom attributes.

    +   - Identifying domain functional levels.

    +   - Identifying the preparedness of AD with regards to AD object attributes
    and User Principle Names (UPNs). If you have a non-routable domain, such as a
    local one, that is used for user UPNs; then you should use a domain that can be
    validated with Azure AD – for instance, a valid internet domain, such as .com
    or .net.


    You then need to set the UPN suffix for users to use this Azure AD-verified domain.
    You could change the primary domain of your Azure AD DS domain if you wished to
    synchronize to Azure AD, but a better approach would be to add a UPN suffix to
    the verified domain you wished to add to Azure AD. This change is made in the
    **Active Directory Domains and Trusts** management console from the **UPN Suffixes
    Properties** tab. The following illustration shows where this configuration is
    done:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_130_0.png)


    Figure 4.2 – Adding a UPN suffix


    This topic will be covered in the hands-on exercise section of this chapter.


    You can add multiple UPN suffixes and add and verify them in Azure AD if this
    meets your needs:


    +   1. Validate that you own the chosen domain(s) to add to Azure AD for directory
    synchronization and ensure you have access to DNS records to make a change. This
    is to be able to verify the domain(s) when adding the domain to Azure AD.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '+   2. Once any non-routable domains for synchronization have been addressed
    and prepared, you can proceed to add and verify the user''s AD DS UPN suffix domain(s)
    to Azure AD for use with directory synchronization and single sign-on (SSO). Then
    set this domain in Azure AD as the primary domain for the tenant, that is, you
    should not use the tenant''s default .onmicrosoft.com domain.


    # Staging mode


    AD Connect can also be used in staging mode, allowing changes to be made to a
    configuration and previewed before the server is made active. It also allows pre-production
    testing by verifying that all changes will be made as expected in production when
    you run a full import and synchronization through staging mode. Staging mode can
    be used in the scenarios of high availability, testing, the deployment of new
    changes to the configuration, and decommissioning or replacing servers.


    Staging mode can be selected during the installation of AD Connect but does not
    run any exports. Staging mode does not run password sync or writeback. When staging
    mode is disabled, the exports will run, and password sync and writeback will be
    enabled.


    # Express and custom installation


    The express installation method was designed to support a configuration that worked
    for most customers most of the time, and new installations use this about 90%
    of the time.


    The express installation assumes the following:


    +   * A single Windows Server AD forest

    +   * An enterprise administrator account that can be used for the installation

    +   * Less than 10,000 objects in the Windows Server AD forest


    The express installation provides the following configuration outcomes:


    +   * Password hash synchronization from Windows Server AD to Azure AD

    +   * Synchronization of all eligible objects in all domains and OUs


    The custom installation method is used when your scenario does not match the preceding
    assumption and configuration outcomes.


    The custom installation assumes the following:


    +   * No access to an enterprise administrator account

    +   * More than one Windows Server AD forest to be synchronized

    +   * Forest domains that are unreachable from the Connect server'
  merge: -1
  img_proc: true
- pgno: 132
  md: '+   - Federation or pass-through authentication is planned for user sign-in

    +   - More than 100,000 objects in the Windows Server AD forest need to use the
    full SQL Server

    +   - Group-based filtering is planned to be used, not just the filtering of domains
    or OUs


    # AD health check tools


    It is critical to have an operationally healthy AD instance before implementing
    directory synchronization through Azure AD Connect. Typical issues that will be
    flagged and can be remediated will be related to UPNs and proxy addresses. The
    IdFix tool will check for errors and allow for any remediation once identified.


    In this section, we introduced the Azure AD Connect tool. We also looked at the
    AD health-check tools. In the following section, we will look at the hybrid authentication
    methods.


    # Hybrid identity authentication methods


    Hybrid identity requires an authentication method that supports the integration
    of AD and Azure AD. Using AD Connect, the following sign-on methods can be configured
    for users to enable hybrid identity in an organization:


    +   - Azure AD Password Hash Synchronization (PHS)

    +   - Azure AD Pass-Through Authentication (PTA)

    +   - AD Federation Services


    The following screenshot shows the sign-on methods and options that are available:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_132_0.png)


    Figure 4.3 – Cloud sign-on methods'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'The authentication method chosen will depend on the needs of the scenario.


    These hybrid identity authentication methods are categorised as *cloud authentication*
    and *federated authentication*.


    In the following sections, we''ll discuss each of these authentication methods.


    # Cloud authentication


    With the cloud authentication model, the user’s sign-on credentials are processed
    by *Azure AD* as the IDP.


    Two sign-on methods are provided for hybrid identity cloud authentication: PHS
    and PTA.


    # PHS


    In the PHS hybrid identity authentication model, a hash of the user’s AD password
    hash is synchronized to Azure AD as the cloud-based IDP. This means each IDP has
    a copy of the password, but it is never stored in plaintext. AD stores a hash
    of the password, and Azure AD, as the cloud-based IDP, stores a *hash of the hash*.


    With a copy of the user’s password now stored in the cloud-based IDP, Azure AD,
    a user can sign in to Azure AD–authenticated services such as Microsoft 365 and
    Dynamics 365 using the *same password* to sign in to AD authenticated services.
    This provides a *common identity* for users, meaning many usernames and passwords
    no longer have to be remembered, just one. This gives a simple method for authentication
    to resources and services, whether they are cloud-based or on-premises.


    PHS is the default cloud authentication method implemented when implementing Azure
    AD Connect.


    The following diagram visualizes this PHS cloud authentication model:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_133_0.png)


    Figure 4.4 – PHS authentication sign-on'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Concerns around storing the user''s password in a cloud-based IDP (even if
    the password hash is further hashed) can be alleviated with the *PTA* and *federated
    authentication* models we will cover in the following sections. PHS can be a backup
    sign-in method for federated authentication but will require a password to be
    stored in Azure AD. Your needs and requirements will dictate the appropriate approach
    to take for your scenario.


    # # PTA


    Users can also use a *common identity* in the *PTA* hybrid identity authentication
    model. This allows a single username and password for signing on to cloud-based
    resources and services authenticated using Azure AD and signing on to AD-authenticated-based
    resources and services. As with *PHS*, *PTA* significantly improves user productivity,
    security, and identity governance.


    The difference between this authentication method and PHS is that passwords are
    *never stored* in Azure AD. All password validations are *always* passed-through
    to your AD domain controllers to perform the authentication directly and are not
    validated by Azure AD. This does mean your domain controllers always need to be
    available and reachable by Azure AD.


    It is, however, not a good strategy to have your cloud-based authentication solely
    reliant on accessing on-premises domain controllers to validate credentials –
    you can’t fail over to the cloud or access cloud-based resources and services
    if you need to authenticate to an on-premises location you just lost due to flooding,
    fire, loss of connectivity, or even global pandemic.


    One way to achieve this availability of access to resources, and business continuity
    in the face of losing connectivity to an on-premises location, is to create a
    *replica domain controller* in Azure as an IaaS VM. In case of a connectivity
    failure on-premises, the Azure-hosted domain controllers can be used to validate
    the credentials, ensuring business continuity and continued access to cloud-based
    resources and services. This approach requires cross-premises hybrid networking,
    such as a site-to-site VPN or ExpressRoute; ADDS cannot be replicated directly
    over a public internet endpoint.


    Another solution is to use it in conjunction with *PHS directory synchronization*.
    This provides a backup solution for authenticating users when the on-premises
    domain controllers can no longer be contacted. However, this does require the
    password hashes to be stored in Azure AD, which may not be possible for some.
    There will be a trade-off then for determining which approach is most appropriate
    for your scenario. The same on-premises access dependency scenario exists for
    federated authentication, which we will address again in the following section.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'The following diagram visualizes the PTA cloud authentication model:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_135_0.png)


    A benefit of this authentication model can be that your own password policies
    and security policies from your AD can be enforced. From a network security perspective,
    only *outbound traffic connections* from AD to Azure AD are made; *no inbound
    connections* are made to your AD domain controllers. All communication is *certificate-based*,
    issued, and managed by Azure AD as a fully managed service.


    This section looked at the cloud authentication sign-in methods. In the next section,
    we look at the federated authentication method.


    # ## Federated authentication


    Federation simply means a *trust shared between different IDPs for access to resources
    and services.*


    Azure AD is the *trusted IDP* to validate and authenticate user sign-on requests
    in this scenario. We will look at federation in the following section.


    # ### AD FS


    **Active Directory Federation Services (AD FS)** is the Microsoft service that
    provides a sign-on method for this federated authentication.


    In the federated authentication hybrid identity authentication model, the user’s
    sign-on credentials are passed to an IDP other than Azure AD to validate and authenticate
    the user’s credentials. This other IDP used to trust Azure AD is *Windows Server
    AD* and can be hosted on a server on-premises or as an Azure IaaS VM. An AD FS
    server infrastructure is also required to be implemented, which will require two
    servers for the ADFS proxy in the perimeter network, two servers for the federation
    servers, and, depending upon the scenario, an optional two servers for SQL Server.
    In addition, you will need to consider networking, firewall ports, and certificates;
    this is by no means trivial and is complex at best.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'This works similarly to the PTA method; however, PTA is much more straightforward
    and less complex than federation and does not require any additional infrastructure
    servers as AD FS does. You should consider where use cases allow evaluating PTA
    over AD FS; we recognize this is not possible in all scenarios where AD FS-only
    capabilities exist.


    The following diagram visualizes this *federated authentication model*:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_136_0.png)


    Figure 4.6 – Federated authentication sign-on


    As we learned in the previous section on the PTA cloud authentication model, this
    approach does mean your domain controllers always need to be available and reachable
    by Azure AD. The same as we saw with the PTA authentication model is that *PHS
    directory synchronization* can be used as a backup sign-in method in the case
    of failure of the AD FS infrastructure to provide a business continuity strategy.


    In this section, we introduced the hybrid identity authentication methods. In
    the following section, we look at some use case scenarios based on our needs.


    # Choosing a suitable hybrid authentication method


    With identity being the control plane for security, it is vital to ensure that
    each authentication method is understood and chosen based on needs.


    Cloud and federated authentication methods each have some limitations; not all
    authentication models support all use case scenarios.


    Only PTA and AD FS methods can be utilized when you want to use the following
    hybrid scenarios:


    +   • Prevent password hashes from being stored in the cloud (Azure AD)'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Only the AD FS method can be utilized when you want to use the following hybrid
    scenarios:


    +   - Implement on-premises multi-factor authentication (MFA)

    +   - Provide smartcard authentication


    In the following illustration, we look at a decision tree to aid in the process
    of choosing the most appropriate authentication method to meet your needs:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_137_0.png)


    Figure 4.7 – Hybrid identity authentication methods


    For clarity and to reduce complexity, the diagram does not intend to represent
    all decision points for all scenarios. Only core scenarios are shown for simplicity.


    This section looked at choosing the most suitable hybrid identity approach to
    meet your needs. In the next section, we will look at SSO.'
  merge: -1
