- pgno: 319
  md: '# Implementing and Managing Hyper-V on Windows Server


    The previous chapter covered the Storage services available in Azure.


    This chapter covers content from AZ-800 Administering Windows Server Hybrid Core
    Infrastructure: Manage Hyper-V and Guest Virtual Machines.


    First, we will introduce the concept of virtualization and cover implementing,
    managing, and securing Microsoft’s Hypervisor, Hyper-V. We will conclude with
    some hands-on exercises to help you develop your skills further.


    The following topics are included in this chapter:


    +   - Introduction to virtualization and Hyper-V

    +   - Implementing and managing Hyper-V

    +   - Creating and managing Hyper-V virtual machines

    +   - Securing Hyper-V workloads with Guarded Fabric

    +   - Hands-on exercises


    In addition to the topics listed in this chapter, this chapter’s goal is to take
    your knowledge beyond the exam objectives to prepare you for a real-world, day-to-day
    hybrid environment-focused role.


    # Introduction to virtualization and Hyper-V


    In this section, we will introduce the concept of **virtualization**, specifically
    in the context of compute – that is, CPU and memory – as opposed to storage or
    network virtualization.


    Computers (machines), whether virtual or physical, are the core building blocks
    of on-premise solutions and Azure IaaS solutions.'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'The term we use for these virtualized physical machines is **virtual machine
    (VM)**. VMs are the virtualization of a computer’s physical memory and processor
    resources; physical computers are emulated in software. This allows a physical
    machine’s resources to be subdivided and have a portion allocated to each virtual
    machine. Each VM runs its own isolated OS, the same as a physical server. The
    OS accesses virtual compute resources such as **virtual processors (virtual CPU
    or vCPU)** and virtual memory.


    The next section will look at the relationship between physical computers and
    VMs.


    # Comparing virtual and physical machines


    To understand the virtualization model over the physical model, we will briefly
    explore the physical hardware model of operation.


    Historically, an organization operated on a model where, typically, the application
    and dedicated instance of an OS were mapped one-to-one to physical hardware. This
    was not very efficient in terms of costs or operations and also not very scalable
    since each app or new workload requested by the business required a new physical
    server. This led to scale-out server sprawl with increased rack space and associated
    costs.


    This traditional physical approach model is outlined in the following diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_320_0.png)


    Figure 9.1 – Physical server app deployment model


    This traditional app delivery approach with a one-to-one relationship can benefit
    from the virtualization model. Virtualization addresses the following key challenges
    of the traditional physical hardware model:


    +   - Utilization

    +   - Scale

    +   - Cost'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'The concept of virtualization is based on *hardware abstraction*, and for compute
    virtualization, the *hypervisor* is the technology layer that enables this hardware
    abstraction.


    *Abstraction* involves removing dependencies and ignoring or filtering out some
    aspects that are no longer relevant so that what is important can remain the focus.
    In this hardware abstraction context, the VM is no longer dependent on the hardware
    layer it runs on when we abstract it (that is, when we remove the hardware from
    the equation); we no longer need that layer or need to concern ourselves with
    it.


    This means that the value of virtualization is that we can do more with less by
    utilizing resources at more efficient costs and economies of scale.


    We can achieve these efficiencies and optimizations by running multiple VMs from
    one physical server. This also means less rack space, fewer physical assets to
    cool, power, and maintain, and possibly less human capital. Technology can be
    seen as a more tangible value creation center, not a cost center.


    The nutshell version is that when we look at the preceding diagram (*Figure 9.1*),
    we can deliver more apps with fewer physical servers through virtualization, which
    translates to a lower cost to deliver and operate those apps for the business.


    Each VM shares the hardware resources from the underlying physical server (*referred
    to as the host*) that it is located on. These can be referred to as host resources.
    The subdivision of the host resources means we can create many virtual processors
    and memory resources to be assigned to the host VM. The following diagram illustrates
    this virtualization approach:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_321_0.png)


    # Figure 9.2 – Virtualization app deployment model'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'The diagram shown in *Figure 9.1* illustrates that we deployed two physical
    servers to run two applications with virtualization. In the example shown in *Figure
    9.2*, we can deploy one physical server to run four applications; this is the
    benefit and value of virtualization. The underlying physical server host resources
    will determine how many VMs can be run... *your mileage may vary*.


    In this section, we compared physical computers and VMs and learned the value
    and benefits of virtualization. In the next section, we will introduce Hyper-V.


    # What is Hyper-V?


    Now that we have understood virtualization''s value and benefits, we will introduce
    Hyper-V as the enabler.


    *Hyper-V is Microsoft''s hypervisor, a piece of virtualization software and the
    technology layer that enables this hardware abstraction.*


    Example use cases for Hyper-V are as follows:


    +   - Physical computer infrastructure consolidation

    +   - Remote Desktop Virtualization/Virtual Desktop Infrastructure (VDI) implementations

    +   - Test and development environments

    +   - Private and hybrid cloud infrastructure environments, including **Azure
    Stack Hub** and **Azure Stack Hyper-Converged Infrastructure (HCI)** implementations


    The following diagram outlines the Hyper-V system architecture:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_322_0.png)


    Figure 9.3 – Hyper-V system architecture'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'The preceding diagram shows that interaction with the physical machine layer
    is passed through the hypervisor software. The physical machine OS is known as
    the host OS, and the virtual machine OS is known as the guest OS.


    In this section, we introduced Hyper-V as the virtualization software layer that
    allows us to create and run VMs. In the next section, we will learn how to implement
    and manage Hyper-V.


    # Implementing and managing Hyper-V


    **Hyper-V can be installed as a server role** in Windows Server using Server Manager,
    PowerShell, or Windows Admin Center (WAC).


    The PowerShell `Install-WindowsFeature` cmdlet can be used to install the role
    locally or on remote hosts. The PowerShell `Get-WindowsFeature` cmdlet can then
    be run to verify the installation of Hyper-V. We will look at the installation
    steps in the Hands-on exercises section.


    When installing the Hyper-V role, it should be the only server role that''s installed
    on the host server; you should not install roles such as Domain Services or a
    File Server role.


    The Server Core installation of Hyper-V has the following benefits over the full
    GUI OS installation option:


    +   - Minimized hardware resources and better utilization for OS and guest VMs

    +   - Minimized OS resources running and better utilization for OS and guest VMs

    +   - Fewer software updates

    +   - Smaller attack/vulnerable surface area; fewer services are running

    +   - Streamlined deployment and remote management


    The system hardware requirements for implementing Hyper-V are as follows:


    +   - 64-bit processor

    +   - **Second-Level Address Translation (SLAT)**

    +   - VM Monitor Mode extensions

    +   - **Intel Virtualization Technology (Intel VT) or AMD Virtualization (AMD-V)**

    +   - Hardware-enforced **Data Execution Prevention (DEP)**

    +   - Intel XD bit and AMD NX bit


    The Hyper-V hosts should have sufficient processors and memory resources to support
    the number of VMs required to run on each host. Sufficient storage that is fast
    enough, network speed, and capacity should also be planned.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'The OS that runs on a VM is referred to as a guest OS. Hyper-V supports the
    following guest OS types:


    +   - All supported versions of Windows


    +   - CentOS, Red Hat Enterprise Linux, Debian, Oracle Linux, SUSE, Ubuntu, and
    FreeBSD


    Where possible, generation 2 VMs should be used for the guests; this provides
    capabilities such as secure boot, shielded VMs, and hot add/remove virtual network
    adapters.


    # Hyper-V networking


    For communication on the network, the two primary components are as follows:


    +   - Virtual network adapter


    +   - Virtual network switch


    The VM is configured with a virtual network adapter that connects to a port on
    the virtual network switch.


    Two virtual network adapter types are supported:


    +   - Legacy network adapter: These are only in generation 1 VMs and can be used
    for installation tasks using a network boot.


    +   - Network adapter: Also called a synthetic adapter, it can be used with generation
    1 and 2 VMs. It does not support the network boot for generation 1 VMs.


    Three types of virtual network switches are supported:


    +   - Private: This provides communication between VMs on the same Hyper-V host
    only; there is no communication between VMs and the Hyper-V host.


    +   - Internal: This provides communication between VMs on the same Hyper-V host
    and between VMs and the Hyper-V host.


    +   - External: This provides communication outside the host server, such as to
    the internet or another network.


    A Virtual LAN (VLAN) can logically separate networks and partition traffic.


    Virtual switches can be created and managed using Hyper-V Manager, Windows Admin
    Center, or PowerShell. The PowerShell cmdlet for this is New-VMSwitch.


    # Nested virtualization


    Nested virtualization allows an instance of Hyper-V to be installed on a VM, which
    then runs VMs created within this second layer of virtualization; the host VM
    runs as a virtualized Hyper-V host. The following diagram visualizes this concept:'
  merge: -1
  img_proc: true
- pgno: 325
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_325_0.png)


    Figure 9.4 – Nested virtualization


    The preceding diagram shows that _Level 0_ is a physical layer that contains the
    _virtualization host(s)_ hardware, onto which a hypervisor is installed; this
    host-level hypervisor creates the _Level 1 virtualization_ platform.


    The virtualized layer running inside a VM as opposed to running on hardware is
    what we term _Level 2 virtualization_; this means it is running a _nested virtualization
    layer_.


    The following are the requirements for nested virtualization:


    +   - Server 2016 or later

    +   - Enough memory resources

    +   - Version 8.0 or later for guest VMs

    +   - An Intel processor with **Virtual Machine Extensions (VT-x)** and **Extended
    Page Tables (EPTs)** for the physical host server

    +   - MAC address spoofing enabled


    To enable nested virtualization, use the following PowerShell cmdlet from the
    physical host server:


    ```

    ```powershell

    Set-VMProcessor -VMName <VMName>

    -ExposeVirtualizationExtensions $true

    ```

    ```


    The guest VM must be in the Off state.


    Installing the Hyper-V role on the guest VM is the same process as installing
    the physical host server of the Hyper-V role.


    # # Managing Hyper-V


    Hyper-V Manager is a component that provides a GUI for managing _local_ and _remote_
    Hyper-V hosts. Hyper-V Manager is shown in the following diagram:'
  merge: -1
  img_proc: true
- pgno: 326
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_326_0.png)


    # Figure 9.5 - Hyper-V Manager


    The following functions are available in Hyper-V Manager:


    +   - Connect to and manage local and remote Hyper-V host servers

    +   - Configure Hyper-V settings

    +   - Manage Hyper-V Integration Services

    +   - Manage Hyper-V guest VMs

    +   - Manage virtual hard disks

    +   - Manage virtual switches – Virtual Switch Manager

    +   - Manage virtual SANs – Virtual SAN Manager

    +   - Manage Hyper-V replication

    +   - Manage checkpoints

    +   - Support for the WS-Management protocol

    +   - Support for previous versions of Hyper-V hosts


    In addition to Hyper-V Manager, PowerShell and WAC can also be used to manage
    Hyper-V hosts.


    In this section, we learned how to create and manage Hyper-V host computers. In
    the next section, we will learn how to create and manage the VMs that will run
    on the Hyper-V hosts.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Creating and managing Hyper-V virtual machines


    We can create and manage Hyper-V using the **New Virtual Machine Wizard** area
    in the **Hyper-V Manager** console or with PowerShell using the New-VM cmdlet.


    The process for implementing a VM consists of the following steps:


    +   1. Create a VM through Hyper-V Manager or PowerShell.

    +   2. Install the guest OS on the VM using Hyper-V Manager.

    +   3. Install or upgrade Integration Services using Hyper-V Manager.


    We will learn how to create and manage VMs in more detail in the *Hands-on exercises*
    section of this chapter.


    # VM generation versions


    The VM generation determines what hardware features and capabilities are available
    to the VM, such as the OS type supported, size of boot volume, boot methods, and
    so on.


    Hyper-V supports **generation 1** and **generation 2** VMs.


    # Generation 1 VMs support the following features:


    +   • 32-bit and 64-bit guest OS

    +   • Maximum of 2 TB boot volume with four partitions

    +   • Legacy BIOS

    +   • VHD and VHDX format disks


    # Generation 2 VMs support the following features:


    +   • 64-bit only guest OS

    +   • Maximum of 64 TB boot volume

    +   • UEFI

    +   • Secure boot

    +   • Shielded VMs

    +   • VHDX-only formatted disks


    A VM generation is selected at the time of VM creation and *cannot* be changed
    after. The following screenshot shows the VM creation wizard screen:'
  merge: -1
  img_proc: true
- pgno: 328
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_328_0.png)


    There is a negligible difference in performance between generation 1 and generation
    2 VMs; this should not be the main deciding factor. The main difference is 64-bit
    OS only in generation 2 and UEFI only.


    # VM configuration versions


    A VM configuration version provides information about the compatibility of VM
    components. The Hyper-V version determines the VM configuration the VM will receive
    at the time it is created.


    For each VM, its configuration version identifies the following information:


    +   - **Configuration**: This provides information about the processor, memory,
    and storage attached to the VM

    +   - **Checkpoint**: These are files that represent runtime state and configuration
    files, which are used to create checkpoints


    The configuration version of a VM can be found in the Summary tab. Here, you can
    choose the Configuration Version value from Hyper-V Manager.


    The following PowerShell cmdlet can also get the VM version:


    ```

    Get-VM * | Format-Table Name, Version.

    ```


    The VM configuration versions that a Hyper-V host supports can be found using
    the following PowerShell cmdlet:


    ```

    Get-VMHostSupportedVersion

    ```


    The default version that will be used for all VMs that are created on a Hyper-V
    host can be found using the following PowerShell cmdlet:


    ```

    Get-VMHostSupportedVersion -Default

    ```'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'The VM configuration version can be updated with the following PowerShell cmdlet:


    ```

    `Update-VMVersion \<vmname\>`

    ```


    To update the version, the VM must be turned off. It is not possible to downgrade
    a VM configuration version once it has been upgraded.


    The following VM configuration versions are supported for each Hyper-V host Windows
    version:


    +   - Windows Server 2012 R2, 2016, 2019, and 2022

    +   - Windows 10 20H2, Enterprise 2016 LTSC, and 2019 LTSC

    +   - Windows 11


    For additional reference, the following are some examples of the minimum configuration
    versions for compatibility with certain Hyper-V requirements:


    +   - Hibernation support: Version 9.0

    +   - Hot add/remove memory: Version 6.2

    +   - Large memory VMs: Version 8.0

    +   - Nested virtualization: Version 8.0

    +   - PowerShell Direct: Version 6.2

    +   - Secure Boot for Linux VMs: Version 6.2

    +   - Virtual processor count: Version 8.0

    +   - Virtual Trusted Platform Module (vTPM): Version 7.0


    The configuration version is important to know since VMs created on earlier Hyper-V
    hosts may not work on newer Hyper-V hosts with a newer OS version. You may need
    to move a VM between Hyper-V hosts, and you will want to know that the hosts support
    the VM’s configuration. A host that doesn’t support the VM configuration version
    of the VM will not allow that VM to start.


    # VM settings


    The VM’s configuration and properties settings are grouped into Hardware and Management;
    they are represented for each generation type, as shown in the following figure:'
  merge: -1
  img_proc: true
- pgno: 330
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_330_0.png)


    Figure 9.7 – VM generation settings


    The available simulated hardware components that mediate access to the real hardware
    components depend on the generation version of the VM.


    # Generation 1 VMs have the following hardware that can be accessed:


    +   * BIOS

    +   * Memory

    +   * Processor

    +   * Non-Uniform Memory Access (NUMA)

    +   * IDE controller

    +   * SCSI controller

    +   * Network

    +   * COM port

    +   * Diskette drive'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'Generation 2 VMs have the following hardware that can be accessed:


    +   - Firmware

    +   - Memory

    +   - Processor

    +   - SCSI controller

    +   - Network adapter

    +   - Fibre channel adapter


    The management settings provide configuration information on the characteristics
    of a VM; these are as follows:


    +   - **Name**: Used for the display name of the VM; does not change the VM''s
    hostname

    +   - **Integration Services**: Used to configure which integration settings are
    enabled for the VM

    +   - **Checkpoints**: Used to *enable*, *disable*, specify the *type* of checkpoints,
    and specify where they will be stored:

    +     - A VM can be in one of the following states: **Off**, **Starting**, **Running**,
    **Paused**, or **Saved**

    +     - There are two types of checkpoints that are point-in-time snapshots of
    a VM: **production** and **standard** checkpoints

    +     - There are a maximum of 50 *checkpoints* for a VM

    +   - **Smart Paging File Location**: Used to configure the location where Smart
    Paging files are stored

    +   - **Automatic Start Action**: Used to define how a VM responds when you turn
    on a Hyper-V host

    +   - **Automatic Stop Action**: Used to define how a VM responds when you shut
    down a Hyper-V host gracefully


    The Hardware and Management information is stored in configuration files. The
    following two file formats are used:


    +   - **.vmcx files**: This format is used for VM *configuration*

    +   - **.vmrs files**: This format is used for *runtime data*


    These are binary files that cannot be manually edited; Hyper-V Manager or PowerShell
    is required to read these files and make changes to them.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# VM virtual hard disk formats


    A virtual hard disk (VHD) is a software representation of a physical hard disk,
    the same as a VM''s processor, and memory is a software representation of a physical
    computer''s processor and memory. You can create partitions, files, and folders,
    just like you can for a physical disk. You install the VM''s OS and any applications
    and services on these VHDs. Multiple VHDs, such as physical computers, can be
    attached to meet storage requirement use cases.


    VHDs can be created and managed using the following:


    +   - Hyper-V Manager

    +   - Windows Disk Management

    +   - PowerShell, using the New-VHD cmdlet

    +   - The Disk Management console

    +   - The command line, using the Diskpart tool


    Two VHD formats are available when a new VHD is created for a VM; these are as
    follows:


    +   - VHD: This is the format that was created by older Hyper-V versions and can
    create disks with a maximum size of 2,040 GB.

    +   - VHDX: This is the newer format and can create disks up to 64 TB in size.
    It supports large block sizes for better performance.


    You can convert a disk between formats using the Edit Virtual Hard Disk Wizard
    area of Hyper-V Manager or with PowerShell using the Convert-VHD cmdlet. This
    creates a new disk and copies the contents of the existing disk into it.


    # VM disk types


    Hyper-V provides different disk types to suit different needs:


    +   - Fixed-size VHD: Immediately allocates all of the disk space.

    +   - Dynamic size VHD: A maximum size is defined when created and only allocates
    space as needed to grow.

    +   - Differencing VHD: This is linked to a parent VHD with a base configuration.
    Changes are only made to the differencing disk, preserving the configuration on
    the parent. This could be a use case for multiple child disk configuration images
    based on the same parent configuration image.

    +   - Pass-through physical disk: This allows you to directly connect to a physical
    hard disk through the host computer.'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'You can convert a disk between types using the Edit Virtual Hard Disk Wizard
    area of Hyper-V Manager; the same disk format should be used.


    In this section, we looked at implementing and managing Hyper-V VMs; we covered
    generation versions, configuration versions, VM settings, disk formats, and types.
    Now, let''s look at VM memory.


    # ## VM memory


    A VM''s memory can be configured as required from the Hardware section of the
    VM settings in Hyper-V Manager, as shown in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_333_0.png)


    Figure 9.8 – VM memory settings


    A VM can be enabled to use Dynamic Memory. As its name suggests, this allows you
    to dynamically size and allocate the available memory to a VM based on demand.
    A benefit of this is that the VM doesn''t need to be powered off, as in the case
    without Dynamic Memory.'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'There are four aspects of configuring Dynamic Memory when it is enabled; these
    are as follows:


    +   - **Startup RAM**: This is the amount of memory a VM has when it starts, irrespective
    of Dynamic Memory being enabled.

    +   - **Minimum RAM**: This is the minimum level that will be dynamically allocated
    based on the load.

    +   - **Maximum RAM**: This is the maximum level that will be dynamically allocated
    based on the load.

    +   - **Memory Buffer**: This determines the size of memory allocation that will
    grow in chunks of memory and increase to the maximum RAM. It is represented as
    a percentage of the RAM configured. The default is 20%, meaning it will increase
    memory in 204 MB chunks if the total memory is 1,024 MB.


    The settings for configuring VM memory are shown in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_334_0.png)


    Figure 9.9 – Configuring a VM''s memory


    Dynamic Memory cannot be used with NUMA. Integration Services must be updated
    as Dynamic Memory requires these services to control this function.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Hyper-V Integration Services


    Hyper-V Integration Services provides operational functionality to VMs, also called
    integration components. These services (components) allow the VM to communicate
    with the Hyper-V host for its operations. Keeping these services (components)
    updated is important to ensure the smooth operation of the VM''s functions and
    capabilities.


    You will need to install Integration Services on Hyper-V hosts earlier than Windows
    Server 2016 and Windows 10. To install it, from Hyper-V Manager, connect to the
    VM and, from the action menu, select Insert Integration Services Setup Disk. Windows
    Server 2016 and Windows 10 or newer Hyper-V hosts do not require this.


    The following Integration Services are available:


    +   * Hyper-V Heartbeat Service: Reports whether a VM is running correctly


    +   * Hyper-V Guest Shutdown Service: Permits a host to trigger a VM shutdown


    +   * Hyper-V Time Synchronization Service: Synchronizes the VM''s clock with
    the host


    +   * Hyper-V Data Exchange Service (KVP): Provides a metadata exchange between
    the VM and the host


    +   * Hyper-V Volume Shadow Copy Requestor: Provides a VSS backup of the VM without
    it being shut down


    +   * Hyper-V Guest Service Interface: Provides an interface to copy files to
    or from a VM from the host


    +   * Hyper-V PowerShell Direct Service: Provides PowerShell access to a VM without
    a network connection


    Integration Services can be turned on and off using Hyper-V Manager or PowerShell.


    To use Hyper-V Manager, right-click on the VM to access its settings, then select
    Integration Services under the Management section.


    For PowerShell, you can use the following cmdlets:


    ```

    Enable-VMIntegrationService

    Disable-VMIntegrationService

    ```


    To get a list of the Integration Services enabled on a VM, use the following PowerShell
    cmdlet:


    ```

    Get-VMIntegrationService -VMName "VM1 "

    ```'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Discrete Device Assignment


    Discrete Device Assignment (DDA) allows a VM to directly access physical PCIe
    hardware on the host whenever it''s available and supported. Two device classes
    are supported:


    +   - Graphics adapters

    +   - NVMe storage devices


    Generation 1 and 2 VMs support DDA. When a device is attached, the following VM
    features are restricted and not available to the VM:


    +   - Dynamic Memory

    +   - VM save/restore

    +   - Live migration

    +   - High availability cluster member


    The following steps should be taken to configure DDA:


    +   1. Turn off the Automatic Stop Action by using the following PowerShell cmdlet:


    ```

    Set-VM -Name VMName -AutomaticStopAction TurnOff.

    ```


    +   2. Disable the device by using Device Manager or the following PowerShell
    cmdlets:


    ```

    Get-PnpDevice

    Disable-PnpDevice

    ```


    +   3. Dismount the device from the host partition using the following PowerShell
    cmdlet:


    ```

    Dismount-VMHostAssignableDevice -LocationPath $locationPath.

    ```


    +   4. Assign the device to the VM using the following PowerShell cmdlet:


    ```

    Add-VMAssignableDevice -LocationPath $locationPath

    -VMName VMName.

    ```


    If you wish to remove the device from the VM and return to the host, you can run
    the following from PowerShell ISE:


    ```

    #Remove the device from the VM

    Remove-VMAssignableDevice -LocationPath $locationPath -VMName

    VMName

    ```'
  merge: -1
  img_proc: true
- pgno: 337
  md: '```

    #Mount the device back in the host

    Mount-VMHostAssignableDevice -LocationPath $locationPath

    ```


    The device can then be re-enabled on the host. Use Device Manager or the following
    PowerShell cmdlets to do so:


    ```

    Get-PnpDevice

    Enable-PnpDevice

    ```


    # Enhanced session mode


    Enhanced Session Mode allows local computer resources such as *printers, clipboards,
    local drives, USB drives,* and so on to be redirected for use by the guest VMs.
    This is enabled through **Virtual Machine Connection (VMConnect)**.


    The following are the requirements for using the local resources in a VM:


    +   • Both the Enhanced Session Mode policy and Enhanced Session Mode must be
    enabled on the Hyper-V Host

    +   • The computer running VMConnect must use Windows 8.1/10 and Windows Server
    2012 R2/2016

    +   • The VM must use Windows 8.1/10, Windows Server 2012 R2/2016, and have Remote
    Desktop Services enabled


    If available on the computer where *VMConnect* is run, the following local resources
    can be redirected:


    +   • Drives

    +   • USB devices

    +   • Supported plug-and-play devices

    +   • Smart cards

    +   • Printers

    +   • Audio

    +   • Display settings

    +   • Clipboards'
  merge: -1
  img_proc: true
- pgno: 338
