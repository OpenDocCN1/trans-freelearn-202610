    This section looked at configuring continuous delivery for an Azure VM. In the
    next section, we will look at configuring connections to VMs.


    # Configuring connections to VMs


    Once an Azure VM has been created, we must consider how to allow administrative
    access. We will look at the access methods of **Windows Remote Management (WinRM)**
    and **Remote Desktop Services Protocol (RDP)** in the following sections.


    # WinRM access


    We can connect via PowerShell Remoting to run PowerShell commands on remote computers
    such as Azure IaaS VMs; this uses the WinRM protocol and allows us to establish
    a remote connection to the computer.'
  merge: -1
  img_proc: true
- pgno: 388
  md: 'To enable PowerShell Remoting, we need to use the following PowerShell cmdlet:
    Enable-PSRemoting. The WinRM service will be started so that commands can be operated
    on the remote computer. The ports used are HTTP : 5985 and HTTPS : 5986; all PowerShell
    remote communications are always encrypted by WinRM regardless of the protocol
    used (whether HTTP or HTTPS).


    The outline of the process for setting up WinRM access to an Azure VM is as follows:


    +   1. An Azure key vault is created.

    +   2. A self-signed certificate is created.

    +   3. The self-signed certificate is stored in Azure Key Vault.

    +   4. The URL for the self-signed certificate stored in Azure Key Vault is retrieved.

    +   5. When creating a VM, the URL for the self-signed certificate is referenced
    for access.

    +   6. Ensure the VM is enabled for WinRM by enabling PSRemoting with the following
    PowerShell cmdlet:

    +   ```

    +   Enable-PSRemoting -Force

    +   ```

    +   7. A connection can then be made using the following:

    +   ```

    +   Enter-PSSession -ConnectionUri https://<public-ip-dns-of-the-vm>:5986 -Credential
    $cred -SessionOption (New-PSSessionOption -SkipCACheck -SkipCNCheck -SkipRevocationCheck)
    -Authentication Negotiate

    +   ```


    Further information on setting up can be found in the following Microsoft documentation:
    https://docs.microsoft.com/en-gb/azure/virtual-machines/windows/connect-winrm.


    # RDP access


    As an alternative remote connection method, we can connect to an Azure VM using
    a full interactive desktop session using RDP for Windows VMs and Secure Socket
    Shell (SSH) for Linux servers. For the scope of the exam objective, we will cover
    Windows Server access using RDP.


    Connectivity to the Windows Server Azure VM requires using TCP port 3389 by default.
    If you are using a firewall or a Network Security Group (NSG), you will need to
    allow inbound access to this port and protocol; for security purposes, you limit
    the IP address range you will accept connections from. Further details on configuring
    the NSG for RDP access can be found in the following Microsoft documentation:
    https://docs.microsoft.com/en-us/troubleshoot/azure/virtual-machines/troubleshoot-rdp-nsg-problem.'
  merge: -1
  img_proc: true
