- pgno: 118
  md: 'With this, we have installed the Group Policy Management tools that allow you
    to use the GPMC to create and configure GPOs and custom OUs in an Azure AD DS
    managed domain.


    This exercise taught us the skills needed to install Group Policy Management tools.
