- pgno: 161
  md: '# # Implementing and Managing On-Premises Network Infrastructure


    This chapter covers the AZ-800 Administering Windows Server Hybrid Core Infrastructure
    exam learning objective: Implement and manage on-premises network infrastructure.


    In the previous chapter, we added skills to understand Hybrid Identities.


    We will start this chapter by understanding Domain Name System (DNS) for Windows
    Server; we will cover its implementation and management. We will next look at
    the Dynamic Host Configuration Protocol (DHCP) and IP Address Management (IPAM)
    network services and finally cover implementing and managing remote access services.
    We will then conclude with a hands-on exercise to develop your skills further.
    The following topics are included in this chapter:


    +   - Implementing and managing Windows Server DNS

    +   - Implementing and managing DHCP

    +   - Implementing and managing IPAM

    +   - Implementing and managing remote access

    +   - Hands-on exercises


    In addition to these topics, this chapter aims to take your knowledge beyond the
    exam objectives to prepare you for a real-world, day-to-day hybrid environment-focused
    role.


    # ## Implementing and managing Windows Server DNS


    This section will look at implementing on-premises and hybrid name resolution.


    The first skills area we will look at in this section is what is DNS?'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# What is DNS, and how does it work?


    **Name resolution** is translating or resolving a *name* to an *IP address*. IP
    addresses can also be resolved to a name through a reverse lookup.


    DNS is an industry-standard name resolution service and the primary name resolution
    method used by Windows. Other methods include a **host file**, an **LMHOSTS file**,
    and **Windows Internet Name Service (WINS)**, which is a **Network Basic Input/Output
    System (NetBIOS)** name resolution service.


    DNS uses **resource records** to hold the names and information, such as IP addresses
    and arbitrary text information it holds for that domain. As with phone contacts,
    people can remember names more easily than they can numbers, especially in the
    case of multiple numbers (home, work, mobile, and so on) for the same name.


    DNS resource records can be created manually, or clients can automatically register
    records with a DNS server. These records are then stored in *zones*, which are
    stored in *zone files*.


    The DNS service can be installed on Windows Server as a server role. DNS clients
    will then contact the server to look up the name to be resolved to an IP or look
    up arbitrary text in a text field record.


    A typical scenario of name resolution with DNS would be a client wishing to resolve
    a **fully qualified domain name (FQDN)** such as `https://server1.milesbetter.solutions`
    to an IP address.


    In this scenario, the DNS server looks in its local database to see whether it
    has a record of this stored. If it does, the IP address of `10.5.1.4` would be
    returned to the client by the DNS server.


    If the DNS server does not have the information to return to the client for this
    name in its database, it will make a request to another DNS server either through
    **root hints** or *forwarding* to provide the requested information.


    DNS servers also cache this request and look up information, so the next time
    the DNS server is asked for the same request, it now has a copy of this information
    to respond with the next time it is requested; all the while, the cached content
    remains valid. A client needing to resolve DNS records is a *DNS resolver*, and
    it will use a *DNS resolver cache* to hold the DNS server response requests for
    their lifetime.


    This process of name resolution is represented in the following diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_162_0.png)


    Figure 5.1 – Name resolution'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'A hierarchical structure is used for a DNS, and a DNS namespace is used for
    a naming structure. The *root domain* starts the hierarchy with subdomains at
    the next level, which can then have any number of subdomains. This DNS domain
    naming scheme is represented in the following diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_163_0.png)


    Namespaces can be *private* or *public*. A public namespace is where a domain
    you own is registered for public use on the internet, such as *milesbetter.solutions*
    or *stevemiles.cloud*.


    A subdomain can often be used to segment a namespace to represent an **Active
    Directory Domain Services** (AD DS) domain such as *adds.milesbetter.solutions*
    or a geographical basis such as *eu.milesbetter.solutions* or *us.milesbetter.solutions*.


    All these approaches allow aspects such as digital certificates to be issued and
    used for these public internet domains.


    However, in non-internet-facing or private organization networks such as lab,
    test, or that of a highly secure environment, then a private namespace that is
    not internet-published, accessible, or internet-registered may be appropriate.
    Examples of a private namespace would be *milesbetter.local* or *milesbetter.lab*.


    A specific part of a namespace hierarchy is represented on a DNS server by a *zone*—for
    example, a *milesbetter.Solutions* zone would be created on the DNS server responsible
    for responding to clients who request lookups for this domain. These servers that
    hold the copy of the zones are known as **authoritative** name servers for the
    domain.


    The zones hold the information the DNS server uses to respond to client lookup
    requests for this namespace. The information that DNS servers hold and send responses
    from is stored in DNS resource records in the zones.


    There are *forward lookup zones* and *reverse lookup zones*; the following list
    provides examples of *resource records* in forward lookup zones:


    +   - Host (A) record: Resolves a name to an IPv4 address

    +   - Host (AAAA) record: Resolves a name to an IPv6 address

    +   - Alias (CNAME) record: Resolves a name to another name'
  merge: -1
  img_proc: true
- pgno: 164
  md: '+   - **Service location (SRV) record**: Identifies servers hosting a service,
    such as identifying the location of domain controllers

    +   - **Mail exchanger (MX) record**: Identifies email servers

    +   - **Text (TXT) record**: Stores arbitrary strings of information


    Forward lookup zones are represented in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_164_0.png)


    # Figure 5.3 – Forward lookup zones


    Reverse lookup zones contain **pointer (PTR)** records used to resolve an IP to
    a name. There is a specific format of `[IP-Range] .in-add.r.arpa` for a reverse
    lookup zone. An example of a zone name for a reverse lookup zone for 10 .5 .1
    .0 /24 would be 1 .5 .10 .in-add.r.arpa. This is represented in the following
    screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_164_1.png)


    # Figure 5.4 – Reverse lookup zone


    All forward and reverse lookup DNS zones contain a **start of authority (SOA)**
    and a **name server (NS)** record. The SOA record contains zone configuration
    information, with one SOA record per zone. The NS record shows the DNS server
    for the domain, with one NS record for each DNS server with a zone copy.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'You can read more on reverse lookup at the following URL:


    https://en.wikipedia.org/wiki/Reverse_DNS_lookup


    # Implementing DNS


    The DNS service is installed as a role on Windows Server using Server Manager,
    Windows Admin Center, or PowerShell with the following command:


    ```

    Install-WindowsFeature -Name DNS -IncludeManagementTools

    ```


    The installation via Windows Server Server Manager is represented in the following
    screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_165_0.png)


    Figure 5.5 – Adding a DNS role


    Once the DNS server role is installed, it can be managed from Windows Admin Center
    or the DNS Manager console. The DNS Manager console is represented in the following
    screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_165_1.png)


    Figure 5.6 – DNS Manager console'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'The DNS role is commonly installed on AD DS domain controllers and, instead
    of zone files, can use AD-integrated DNS to store the DNS information in the AD
    database. This means the DNS information is made secure and highly available as
    it is replicated by native AD replication and availability mechanisms.


    The following sections look at the topics of zones, records, forwarders, and security.


    # Zone


    When a zone file is created, it must be set as a primary or secondary zone. The
    primary zone is used to create, edit, and delete records. The primary zone records
    can be stored in a zone file or configured to be AD-integrated, which means the
    AD DS database is used to store the zone information. The secondary zone is a
    read-only copy of the primary zone and is always stored in a zone file. PowerShell
    can also be used to manage the DNS zones.


    Zone records can be transferred between primary and secondary zones with a zone
    transfer. The secondary zone servers requesting a zone transfer can be controlled
    by setting the following options:


    +   - To any server


    +   - Only to servers listed on the Name Servers tab


    +   - Only to the following servers


    These zone transfer options are represented in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_166_0.png)


    Figure 5.7 – DNS zone transfer options


    Incremental zone transfers happen after the initial secondary zone synchronization
    from the primary zone is complete.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Records


    Records can be manually managed using the DNS Manager console, Windows Admin Center,
    or PowerShell cmdlets.


    The zone files are represented in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_167_0.png)


    Figure 5.8 – DNS zone files


    All records have a **time-to-live (TTL)** value configured. This defines how long
    the information in the record is valid and how long it is allowed to be cached
    by clients and servers. If a TTL is set for 36000 secs (1 hour), then the response
    to the DNS query can only be cached for that period.


    During that time, the client will only use the information in the cache and not
    make a new request. When the TTL expires, the client will make a new request to
    the DNS server and may receive any updates made to the record since it was requested
    and cached. The cache should always be cleared for troubleshooting.


    Host and PTR records can also be created dynamically, making managing DNS easier.
    The current IP address for a device is automatically registered after its IP is
    changed when dynamic DNS is enabled.


    # Forwarders


    DNS servers can be configured with *forwarders*, typically for internet name resolution.


    Where the DNS server is requested to resolve a name that is not authoritative
    for that zone—that is, it does not hold a primary or secondary zone for that domain—it
    must ask another DNS server for this information. The default is that *root hints*
    will be configured on each server to find the authoritative servers on the internet;
    however, that is only possible if the DNS server has access to the internet and
    the record requested is published on the internet.


    Due to network segmentation and security, the DNS servers will not always be directly
    connected to the internet. They will have to proxy the request through forwarders
    if the records are not stored locally in a cache.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'The forwarders are DNS servers connected to the internet, usually in a perimeter
    network segment or an **external service provider (ESP)** DNS server. These DNS
    servers can resolve the internet names for these requests outside the local network.


    **Conditional forwarding** is another option and is intended to only forward any
    request lookups for a *single specific DNS domain* instead of forwarding all requests
    that cannot be resolved locally.


    # Security


    DNS is secured by validating all responses from a DNS server through the extensions
    suite of **Domain Name System Security Extensions (DNSSEC)**. This aims to make
    the DNS protocol less prone to attacks such as *DNS spoofing* by providing authenticated
    **denial of service (DoS)**, data integrity, and origin authority.


    The DNS zone is secured using a **zone signing** process when supported by an
    authoritative DNS server; this does not change the DNS query and response mechanism
    but adds a validation step. Digital certificates are used for validation in the
    DNS responses. The process generates new DNSSEC resource records containing digital
    certificates during zone signing.


    When a query for a *DNSSEC-signed zone* is received by a DNSSEC-aware forwarding
    or recursive DNS server, it will request that the authoritative DNS server also
    responds with the DNSSEC records. It will then use the digital certificate contained
    in the DNSSEC records to validate the response. The DNS server recognizes a zone
    that supports DNSSEC if the zone has a **DNSKEY** record (trust anchor).


    # Troubleshooting DNS


    This section will look at some commands that can troubleshoot DNS.


    *An adage says that 90% of the time, it''s DNS, and so is the other 10%.*


    Here are some examples of troubleshooting commands:


    +   - NSLOOKUP: Queries for DNS information and looks up resource records and
    the DNS server status

    +   - DNSCMD: Manages the DNS server role

    +   - DNSlint: Diagnoses common DNS issues

    +   - IPConfig: Lists the IP configuration details used by a DNS client


    This section concludes the topic of name resolution using the DNS network service.
    We looked at DNS, how it works, and how to implement, manage, and secure it. In
    the next section, we will look at DHCP and its use to manage leasing IP addresses
    to clients.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# # Implementing and managing DHCP


    This section will look at managing on-premises IP addresses using the DHCP network
    service.


    The first skills area we will look at in this section is what is DHCP?


    # ## What is DHCP?


    DHCP can be considered a network service component of a DNS-DHCP-IPAM (DDI) solution;
    we also cover DNS and IPAM in this chapter.


    Concisely, DHCP is a network management protocol used to simplify IP address management
    through auto-assigning IP addresses and network information.


    DHCP is an extended version of Bootstrap Protocol (BOOTP). The difference between
    the two is that BOOTP provides static configuration of IP addresses, and DHCP
    provides automatic configuration of IP addresses.


    Without DHCP, there would be a need for manual network IP address configuration
    on the network interface for the required network settings and manual assignment
    of IP addresses; this is highly inefficient and error-prone.


    With regards to DHCP version 6, this provides IPAM in IPv6 networks. Stateful
    and stateless configurations are supported.


    The DHCP server assigns the IPv6 addresses and network settings in stateful configurations.
    In stateless configurations, the router assigns the IP addresses, and the DHCP
    server assigns only the network settings.


    # ## How does DHCP work?


    DHCP works on the traditional client/server relationship model. Windows computers
    run the DHCP client service, and when set to Obtain an IP address automatically,
    they will communicate with a DHCP server to receive their network information.
    This setting is found in the Internet Protocol Version 4 (TCP/IPv4) Properties
    dialog, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_170_0.png)


    Figure 5.9 – IP properties


    The DHCP server has an address pool configured and configuration options. The
    DHCP server will communicate with the DHCP client, assign IP addresses, and pass
    the configuration options to the clients requesting.


    The DHCP communication flow is given the acronym DORA; the four steps are set
    out here:


    +   - Discover—DHCPDISCOVER

    +   - Offer—DHCPOFFER

    +   - Request—DHCPREQUEST

    +   - Acknowledge—DHCPACK


    This communication flow is also shown in the following diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_170_1.png)


    Figure 5.10 – DHCP communication flow'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'The DHCP address assigned to a client has an amount of time it can be used
    for before it expires; this period is known as a **lease**, and when 50% of the
    lease time has been reached, the client automatically attempts the lease renewal.


    If the lease length is set to *10 days*, a renewal is attempted on *day 5*.


    The request for a renewal goes to the original server that leased the address,
    which is sent as a unicast DHCPREQUEST command. If this server cannot be contacted,
    the client waits for 87.5% of the lease time to be reached and then sends a broadcast
    (rather than a unicast) DHCPREQUEST command for renewal. This goes to all servers,
    rather than just the lease originating server; renewals are also attempted during
    startup. The lease period *resets* when renewals are successful.


    # DHCP scopes


    The DHCP server contains *scopes*, which define an IP address range for clients.
    Clients will be leased an address assignment from this range; each client will
    be assigned a unique IP from this range—that is, two clients cannot be assigned
    the same address from an IP address range.


    The following PowerShell cmdlets can also be used to manage the configured scopes:


    +   - Add-DhcpServerv4Scope

    +   - Get-DhcpServerv4Scope

    +   - Get-DhcpServerv4ScopeStatistics

    +   - Remove-DhcpServerv4Scope

    +   - Set-DhcpServerv4Scope'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'The scopes can also be added from the DHCP console. Creating scopes using the
    New Scope Wizard dialog is represented in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_172_0.png)


    Figure 5.11 – DHCP scope creation


    # DHCP reservations


    You can specify that a client can be permanently assigned a specific address from
    a range set in the scope; this feature is known as a reservation.


    Reservations are helpful for clients that are static on the network and are always
    required to have the same IP; examples of this could be domain controllers, printers,
    network/firewall appliances, and so on.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'The Reservations capability is set in the DHCP console, as represented in the
    following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_173_0.png)


    # Figure 5.12 – DHCP reservations


    The following information will be required when creating a reservation:


    +   - Reservation name

    +   - IP address

    +   - MAC address

    +   - Description


    These required settings to create an IP address reservation are represented in
    the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_173_1.png)


    # Figure 5.13 – DHCP new reservation'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'The client with the assigned Media Access Control [MAC] address will now always
    receive the set reserved IP. The client will not automatically receive this IP
    address. The client will receive the reserved IP address in the following scenarios:


    +   - Renewal of current lease for the client

    +   - A reboot of the client

    +   - Running the ipconfig command on the client, like so: ipconfig /release and
    then ipconfig /renew


    Reserved IP addresses for a client can be changed; the device is just assigned
    a new reservation, and the current one is removed so that IP can be used again
    for other clients.


    # DHCP options


    Through a capability known as Options, DHCP can provide additional network resource
    information required to be set on a machine’s network interface to communicate
    on the network. These settings are managed via the DHCP console.


    The following screenshot represents this:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_174_0.png)


    Figure 5.14 – DHCP options


    These network settings typically apply to the scope level, which is the subnet
    for clients; they can also be configured to apply at the server or class level
    to meet your needs. The scope- and server-level options are both overridden by
    the class option.


    The following are common DHCP options that could be set at the scope level, to
    be set as network settings on the clients:


    +   - DHCP option 1: subnet mask

    +   - DHCP option 3: router (default gateway)'
  merge: -1
  img_proc: true
- pgno: 175
  md: '+   - DHCP option 6: DNS

    +   - DHCP option 51: lease time


    More information on all the available DHCP options can be found here:


    https://www.efficientip.com/glossary/dhcp-option


    In this section, we looked at what DHCP is. In the next section, we look at how
    to implement DHCP.


    # Implementing DHCP


    DHCP is implemented by adding the DHCP service as a server role to Windows Server,
    which then functions as the DHCP server. You can implement this as a dedicated
    server for this role or install it on an existing server; the server for the DHCP
    role must use a static IP, and local admin rights on the server will be required
    to add the server role.


    # DHCP authorization


    Before a DHCP server can support DHCP clients, it must be authorized; this is
    done to protect the network, as DHCP is based on broadcasts. This is done post-installation
    and can be authorized in an AD domain by using the DHCP console or the following
    PowerShell cmdlet:


    ```

    Add-DHCPServerinDC <hostname or IP address of DHCP server>

    ```


    For a single-domain environment, a Domain Administrator account is used to authorize
    a DHCP server; for a DHCP server that assigns IP addresses for subnets for multiple
    domains, an Enterprise Administrator AD account must be used.


    A standalone DHCP server is not a member of an AD domain. Its behavior is that
    if it detects an authorized DHCP server, it shuts down so as not to lease addresses
    and cause a conflict on the network.


    Any unauthorized DHCP servers detected by clients by running the ipconfig /all
    command should be shut down to prevent clients from getting the wrong networking
    information.


    The DHCP server role can be installed using the GUI or PowerShell.


    For the GUI deployment of the role, you can use Windows Admin Center or Server
    Manager.


    The user account installing the DHCP servers requires local admin rights to the
    server to add the DHCP Server role. The server where the role will be added must
    have a static IP address assigned.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Adding the DHCP Server role via the Server Manager method is represented in
    the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_176_0.png)


    Figure 5.15 – Adding the DHCP role to a server


    From PowerShell, the following cmdlets can also be used to install the DHCP Server
    role:


    ```

    Add-WindowsFeature DHCP -IncludeManagementTools

    ```


    The -IncludeManagementTools parameter is optional.


    # DHCP availability


    A clustering deployment is a high availability (HA) method in Windows Server 2012
    and later OSes for the DHCP service and allows two or more DHCP servers to share
    information about service availability. This is the preferred HA solution; we
    will look at DHCP split scopes next.


    When configured for DHCP failover, the DHCP scope and IP address leases are made
    available between two servers using shared storage. The following diagram represents
    this:'
  merge: -1
  img_proc: true
- pgno: 177
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_177_0.png)


    # Figure 5.16 – DHCP failover cluster


    This allows lease information and IP addresses to be made available if one DHCP
    server is unavailable; only *two* DHCP servers can be configured in a failover
    cluster, and the scopes can only be *IPv4*.


    In DHCP failover, the failover relationship between the two DHCP servers is configured
    in the DHCP console through the **Configure Failover Wizard** dialog. The DHCP
    failover methods that can be configured are as follows:


    +   * Load balance

    +   * Hot standby


    Configuring DHCP failover via the DHCP console is represented in the following
    screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_177_1.png)


    # Figure 5.17 – DHCP failover'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'With **DHCP split scopes**, this HA solution uses two DHCP servers active on
    the network. The scopes are *split horizontally* across both servers, so each
    has control of a portion of the same scope. The following diagram represents this:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_178_0.png)


    The primary server is set with the `Delay` configuration attribute in the **Scope**
    properties on the secondary server; you control the primary and secondary servers.
    In this *split scope* scenario, the primary DHCP server responds to client requests,
    and in the event of becoming unavailable, the secondary server responds to client
    requests.


    In this section, we looked at implementing DHCP, the authorization of DHCP servers,
    and the HA of IP address information and assignment to clients. In the next section,
    we will look at how to manage DHCP.


    # Managing DHCP


    DHCP is managed via the DHCP console and DHCP PowerShell cmdlets. When using Server
    Manager to install the DHCP server role, these tools are installed, or you can
    use **Remote Server Administration Tools (RSAT)**.


    The following screenshot shows the DHCP console:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_178_1.png)


    Figure 5.19 – DHCP console'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'To use Windows Admin Center to manage DHCP, the DHCP PowerShell cmdlets must
    be installed on the DHCP server. If not installed, a message is displayed, and
    a button is provided to perform the remote installation.


    The following PowerShell cmdlet is used to include the management tools when installing
    the DHCP server role:


    ```

    Add-WindowsFeature DHCP -IncludeManagementTools

    ```


    # DHCP groups


    Each DHCP server includes groups used to *delegate management* of DHCP; these
    groups are set out here:


    +   - DHCP Administrators local group: This group is used for local DHCP server
    management

    +   - DHCP Users local group: This group is used to explore configuration and
    provide the status information of the local DHCP server


    When using the Server Manager installation method, these groups are created as
    part of the installation. When the PowerShell cmdlets or Windows Admin Center
    is used to install the DHCP role, then these groups must be *manually added* as
    an extra step using the following PowerShell:


    ```

    Add-DhcpServerSecurityGroup -Computer DhcpServerName

    ```


    This section concluded with the topic of IP address assignment using the DHCP
    network service. We looked at DHCP and how it works, how to implement it, and
    how to manage it. In the next section, we look at IPAM and its use to manage on-premises
    IP addressing.


    # Implementing and managing IPAM


    This section will look at managing on-premises IP addressing using the IPAM functionality.


    The first skills area we will look at in this section is *what is IPAM?*


    # What is IPAM, and how does it work?


    IPAM is a framework to provide visibility and control, planning, allocation, and
    management for IPv4 and IPv6 address spaces, as well as centralized control and
    management of an organization’s DHCP and DNS servers.


    IPAM works within the context of AD DS and is a domain service-aware function
    in that the IPAM servers must be domain-joined and not standalone *workgroup*
    servers.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'IPAM is provided as a built-in set of tools within Windows Server that can
    be implemented through a client/server model, as follows:


    +   IPAM server: Provides the managed server data collection. It utilizes the
    **Windows Internal Database (WID)** or a SQL Server database and provides access
    control through **role-based access control (RBAC)**.


    +   IPAM client: Provides the frontend client interface for the IPAM server. Using
    Windows PowerShell cmdlets, it interacts with the managed servers. It can be installed
    on a *client* or *server* OS.


    When a Windows Server with *Desktop Experience* has the IPAM role installed, the
    IPAM client is automatically installed locally on the same server. If *Server
    Core* is used, another server or client must install the client remotely from
    the IPAM server. The RSAT: IPAM Client feature is used to install the client on
    a server or client OS.


    IPAM consists of four modules; these are set out here:


    +   IPAM discover module: This is used for discovery to add to the database all
    located servers (including domain controllers) with the DNS or DHCP roles installed;
    servers can also be added manually.


    +   IP address space management module: This is used to examine, manage, and monitor
    an IP address space. IP addresses can be dynamically or manually assigned to clients.
    Address space utilization can be tracked, and overlapping DHCP scopes detected.


    +   DHCP and DNS multi-server management and monitoring module: This is used to
    monitor and manage tasks across multiple deployed DHCP and DNS servers and provide
    a DNS health status.


    +   Operational auditing and IP address tracking module: This is used to manage
    and monitor configuration changes. Collects lease information from managed DHCP
    servers and sign-in information and data from AD DS domain controllers and **Network
    Policy Server (NPS)** servers.


    These four modules allow for comprehensive DHCP server, DNS zone, and IP address
    management tasks to be carried out from a *single-pane-of-glass* (SPOG) console
    for greater efficiency and control.


    In this section, we looked at what IPAM is and how it works. In this next section,
    we will look at how to implement IPAM.


    # # Implementing IPAM


    There are two topology choices for data collection: a *centralized* or *decentralized*
    topology.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Centralized topology


    In this topology, a single IPAM server is deployed across all locations. This
    provides visibility, control, and management tasks using a single-console view
    for IP address spaces across a forest and multiple forests when a two-way forest
    trust is in place.


    A centralized topology is represented in the following diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_181_0.png)


    Figure 5.20 – IPAM centralized topology


    IPAM can be managed with the client via Server Manager or another computer with
    the RSAT: IPAM Client feature; this can be a Windows Server OS or client OS.


    # Decentralized topology


    In this topology, an IPAM server is deployed in each location. This is typical
    when dealing with large-scale address space management where there is a need to
    scale out and hand off to distributed local servers. This topology can also be
    used when you wish to give autonomy to a business unit (BU) or individual locations.


    A distributed topology is represented in the following diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_181_1.png)


    Figure 5.21 – IPAM centralized topology'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'In addition, a *hybrid topology* can be implemented. In this topology, IPAM
    servers are deployed at each site as local IPAM servers to monitor the local servers,
    and centralized IPAM servers can monitor managed servers remotely. You should
    consider that in this topology, IPAM servers do not replicate information from
    the data collection of the local servers to the central server; each server is
    a standalone data point—that is, an *island*.


    The following requirements should be considered for deployment:


    +   * The IPAM role should be the only one on the server and perform no other
    functions

    +   * The IPAM server must be *domain-joined*, and you must be signed in with
    a *domain account* to install the role

    +   * Installing the IPAM role on an *AD DS domain controller* is not supported

    +   * If the IPAM server role is installed on a DHCP server, no other DHCP servers
    will be able to be discovered

    +   * The IPAM server requires a WID or SQL Server instance; you cannot run another
    instance of **Structured Query Language (SQL)** on the same server

    +   * An individual IPAM server can support 500 DNS servers, 150 DNS zones, 150
    DHCP servers, and 6,000 DHCP scopes

    +   * The required storage space should be planned; approximately 1 GB is required
    to store the utilization data for 10,000 clients

    +   * There is no checking of routers and switches for IP address consistency


    With the previous requirements met, the high-level implementation steps for IPAM
    servers are outlined as follows:


    +   * Create a server(s) for IPAM based on your chosen topology and domain join.

    +   * Install the IPAM server feature from Server Manager, Windows Admin Center,
    or PowerShell using the following command:

    +   `Install-WindowsFeature IPAM -IncludeManagementTools`

    +   * Provision IPAM servers and required **Group Policy Objects (GPOs)** with
    the following PowerShell command:

    +   `Invoke-IpamGpoProvisioning`

    +   * Configure and run DNS and DHCP server discovery.

    +   * Select and manage discovered servers.


    Regarding the IPAM client, this can be installed on a Windows Server or client
    OS using the IPAM Client feature of RSAT.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'This section looked at implementing IPAM, including the different deployment
    topologies. In this next section, we will look at how to manage IPAM.


    # # Managing IPAM


    In the previous sections, we learned that IPAM provides a unified view of the
    three core networking services areas in an IT estate of a DHCP server, DNS zones,
    and IP address management.


    The following are some of the tasks that can be carried out across these three
    areas:


    +   - Manage DNS server tasks:

    +     - Examine DNS servers and zones

    +     - Create DNS zones and records

    +     - Manage conditional forwarders

    +     - Access the DNS console for any IPAM-managed server

    +   - Manage DHCP server tasks:

    +     - Configure DHCP servers

    +     - Examine, create, and edit scopes

    +     - Discover assignment of specific IP addresses

    +     - Create reservations

    +     - Edit server properties and options

    +     - Import and replication

    +     - Configure failover

    +     - Access the DHCP console for any IPAM-managed server

    +   - Manage IP addressing tasks:

    +     - Discover DHCP server address spaces and data on utilization

    +     - Detect overlapping IP address spaces across DHCP servers

    +     - Import IP address information from CSV files

    +     - Monitor DHCP and DHCP servers

    +     - Collect data from NPS servers and AD DS domain controllers, such as sign-in
    information'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'RBAC is used to provide granular access control for who can carry out tasks.
    You define a **role, access scope**, and **access policies** to manage these operation
    tasks. There are several built-in _role-based security groups_. We will not cover
    these aspects here in this chapter; we have, however, provided links to reference
    information in the _Further reading_ section at the end of this chapter.


    This section concluded with the topic of managing on-premises IP addresses using
    IPAM. We looked at what IPAM is, how it works, how to implement it, and how to
    manage it. In the next section, we look at using Windows Server to provide remote
    access to on-premises environments.


    # # Implementing and managing remote access


    This section will look at implementing on-premises network connectivity using
    the options available in Windows Server.


    The first skills area we will look at in this section is _what are the remote
    access options in Windows Server?_


    # ## What are the remote access options in Windows Server?


    While there are many third-party vendor remote access solutions, in this section,
    we will look to introduce some of Windows Server''s built-in remote access capabilities.


    # ### What is DirectAccess?


    Microsoft''s **DirectAccess** is one of the technology options that can be implemented
    for secure remote network access, although it should probably now be considered
    legacy. This remote network access technology was intended as an alternative to
    the traditional _virtual private network_ (VPN) approach of secure remote access
    to an organization''s resources on its private networks. It was first introduced
    with Windows Server 2008 R2 and Windows 7.


    # ### What is the Remote Access Service?


    The Windows Server **Remote Access Service (RAS)** server role can also be used,
    which implements the following remote network access technology services:


    +   - Routing

    +   - VPN

    +   - Web Application Proxy (WAP)


    The RAS role is installed on Windows Server using Server Manager or PowerShell.
    The RAS role is managed using the **Remote Access Management** console, the **Routing
    and Remote Access (RRAS)** console, or **PowerShell**.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# What is routing?


    This comprises routing protocols and routing tables to direct traffic (network
    packets) across a network(s) to their desired destination using the most efficient
    route. This is represented in the following diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_185_0.png)


    Figure 5.22 – Routing


    To use an analogy, we can think of this as satellite navigation for network packets;
    it requires knowing where the packet is coming from and the destination and will
    calculate and determine the most appropriate and efficient journey. This is less
    commonly performed by a server, and often this function is performed by a vendor’s
    specialized hardware appliance.


    This section introduced the concept of network routing. In the following section,
    we look at using VPNs in Windows Server.


    # What is a VPN?


    This can be considered almost the de facto way to provide users with a secure
    way to access an organization’s resources and services on its internal private
    networks when they are not directly connected. An encrypted tunnel is set up between
    the organization’s sites and the user’s remote location outside the organization’s
    private networks. The following diagram aims to represent this:'
  merge: -1
  img_proc: true
- pgno: 186
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_186_0.png)


    Figure 5.23 – VPN


    When selecting a VPN as the remote access solution in Windows Server, you will
    need to select a tunneling protocol and an authentication option.


    Here are the tunneling protocol options:


    +   - Secure Socket Tunneling Protocol (SSTP)

    +   - Internet Key Exchange version 2 (IKEv2)

    +   - Layer 2 Tunneling Protocol with Internet Protocol Security (L2TP/IPsec)

    +   - Point-to-Point Tunneling Protocol (PPTP)


    Due to security vulnerabilities in PPTP, IKEv2 should be used, offering advantages
    over L2TP.


    Here are the authentication protocol options:


    +   - Password Authentication Protocol (PAP): The least secure as passwords are
    in plain text.

    +   - Challenge-Handshake Authentication Protocol (CHAP): Uses challenge-response
    and a Message Digest 5 (MD5) industry standard hashing for response encryption.
    Due to requiring a reversibly encrypted password, Microsoft-CHAPv2 (MS-CHAPv2)
    should be considered.

    +   - MS-CHAPv2: Uses CHAP but with a one-way encrypted password. Improves on
    CHAP.

    +   - Extensible Authentication Protocol (EAP): More of an authentication framework
    than a protocol. One of the common authentication methods in this framework is
    EAP-Transport Layer Security (EAP-TLS). This is a mutual authentication method
    that is certificate-based for its authentication.


    This section introduced the VPN remote access option in Windows Server. In the
    following section, we look at using NPS.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# What is NPS?


    NPS is a role that can be installed on a Windows Server and is Microsoft''s **Remote
    Authentication Dial-In User Service (RADIUS)** implementation. RADIUS is used
    to provide an authentication exchange between components in a remote access solution
    and is an industry-standard authentication protocol.


    NPS is used to implement authentication, authorization, and accounting for network
    access and is based on enforcing policies. NPS provides *connection request policies*
    and *network policies*. These policies have the following four categories: *Overview*,
    *Conditions*, *Constraints*, and *Settings*.


    The authentication methods available are set out here:


    +   - PAP

    +   - **Shiva Password Authentication Protocol (SPAP)**

    +   - CHAP

    +   - MS-CHAP

    +   - MS-CHAP v2

    +   - EAP


    Due to security concerns with the PAP, CHAP, and MS-CHAP authentication protocols,
    these should not be considered for a production environment.


    For accounting, user authentication requests, access messages, accounting requests,
    responses, and status updates can be stored in a Microsoft SQL Server database.


    NPS cannot be installed on Windows Server Core editions.


    This section introduced NPS in Windows Server. In the following section, we look
    at using a **public key infrastructure (PKI)** in Windows Server.


    # What is a PKI?


    A PKI is a collective terminology that covers implementing, issuing, and managing
    digital certificates. These certificates are issued by a **certification authority
    (CA)** and are used to confirm an identity.


    Two CA types can provide certificates: a **private CA** and a **public CA**. Each
    CA type has advantages and disadvantages, as follows:


    +   - A **private CA** provides greater control and lower costs than a public
    CA and provides customized templates and an auto-enrollment capability. The disadvantage
    is that private CA-issued certificates are not trusted by external clients and
    have a higher administrative burden.

    +   - A **public CA** has the advantage that it will be trusted by most external
    clients and requires lower administration effort. The disadvantage is the higher
    cost and slower procurement of certificates.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Self-signed certificates can also be created using the following PowerShell
    cmdlet:


    ```

    New-SelfSignedCertificate

    ```


    This section introduced the PKI in Windows Server. In the next section, we will
    look at using WAP in Windows Server.


    # What is WAP?


    This provides a way to allow remote users to access internal web applications
    securely over the internet. It does this using the reverse proxy functionality.
    Users are authenticated by the application using pass-through preauthentication
    or AD Federation Services (ADFS) preauthentication.


    The following diagram aims to represent this:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_188_0.png)


    Figure 5.24 – WAP


    WAP is installed via Server Manager on a Windows Server or with the following
    PowerShell cmdlet:


    ```

    Install-WindowsFeature Web-Application-Proxy

    -IncludeManagementTools

    ```


    Once the role is configured from the Remote Access Management console, your internal
    web applications can then be published using the Web Application Proxy console
    or the following PowerShell cmdlets:


    +   - Add-WebApplicationProxyApplication

    +   - Get-WebApplicationProxyApplication

    +   - Set-WebApplicationProxyApplication


    The following information must be provided to publish a web application through
    the pass-through preauthentication method:


    +   - The type of preauthentication should be set to pass-through'
  merge: -1
  img_proc: true
- pgno: 189
  md: '+   - A friendly name for the web application to be published

    +   - The external URL that will be used to access the application—for example,
    https://pizza.milesbetter.solutions

    +   - An external certificate with a subject name for the URL—for example, https://pizza.milesbetter.solutions

    +   - The URL of the backend server will automatically be entered, or you edit
    it—for example, https://mbs-server1.milesbetter.solutions


    The alternative is to publish the web application using _ADFS preauthentication_.
    The benefits of this method are **single sign-on (SSO)** and **multi-factor authentication
    (MFA)**.


    This section introduced WAP in Windows Server. In the next section, we will look
    at using Azure AD Application Proxy.


    # **What is Azure AD Application Proxy?**


    Azure AD Application Proxy functions are comparable to WAP, making on-premises
    web applications available outside corporate networks from a remote client. However,
    the main difference is that the Application Proxy function (reverse proxy) is
    now provided as a Microsoft-managed service and uses Azure AD authentication services
    in place of AD. This replaces the need for a VPN or a reverse proxy with the on-premises-only
    WAP solution.


    Application Proxy works with web applications, web APIs, and applications accessible
    from a **Remote Desktop (RD) Gateway**.


    Azure AD Application Proxy has the components of the _Application Proxy service_
    that runs as a cloud service hosted by Microsoft and the _Application Proxy Connector_,
    which runs in the on-premises environment on a server. A user sign-in token from
    Azure AD is securely passed to the on-premises web application by these two components
    working together. The following diagram aims to represent this:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_189_0.png)


    Figure 5.25 – Azure AD Application Proxy'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# How Application Proxy works


    The following steps outline the process for a user accessing an internal web app
    from a remote client. Users access the application through an endpoint, a URL,
    or a portal interface and are directed to Azure AD to sign in:


    +   - A token is sent to the user’s device by Azure AD.

    +   - The token is sent to the Application Proxy service by the client. The token’s
    user principal name (UPN) and security principal name (SPN) are retrieved and
    sent to the Application Proxy Connector.

    +   - The request is then sent to the on-premises application.

    +   - The response is returned to the user via the Proxy Connector and the Proxy
    service.


    > Note

    > There are no inbound connections required to be opened on firewalls.


    Azure AD Application Proxy is not intended for users on the corporate network,
    only those remote users wishing to connect to internal apps, such as home workers.


    This section introduced Azure AD Application Proxy and concluded with the topic
    of remote access options in Windows Server. In the next section, we will complete
    a hands-on exercise section to reinforce some of the concepts covered in this
    chapter.


    # Hands-on exercises


    To support your learning with some practical skills, we will utilize concepts
    and understanding gained from the earlier sections of this chapter and put them
    into practical application.


    We will look at the following exercises:


    +   - Exercise—implementing DNS

    +   - Exercise—implementing DHCP


    # Getting started


    To get started with this section, if you do not already have an Azure subscription,
    you can create a free Azure account at https://Azure.microsoft.com/free. This
    free Azure account provides the following:


    +   - 12 months of free services

    +   - $200 credit to explore Azure for 30 days

    +   - 25+ services that are always free'
  merge: -1
  img_proc: true
