- pgno: 421
  md: 'We should always follow the principle of least privileged access when planning
    and configuring role assignments, ensuring a user is not assigned a role with
    more access than is required for their task.


    # Network access


    The following are Azure first-party interfaces and tools that can be used to access
    Windows Server Azure VMs for management purposes:


    +   - Azure Bastion: Provides a managed jump-host service from which you can make
    connections to VMs; no public IPs are required on VMs, and no RDP ports are required
    to be open. It uses HTTPS (443).

    +   - Azure Serial Console: Provides a direct connection to an Azure VM without
    connection via the IP network.

    +   - Cloud Shell: Provides access to PowerShell via a browser-based session.

    +   - RDP: Makes a connection using a traditional RDP session; allows an incoming
    rule for RDP (3389), and if connecting over a public IP, restricts to known IP
    addresses.

    +   - Remote PowerShell: Enables you to run commands on a remote computer from
    a local PowerShell session.

    +   - Just-Enough-Administration (JEA) and Just-in-Time (JIT) VM access: Security
    controls to govern access.


    This section looked at managing user access to Windows Server IaaS VMs in Azure
    and tools and interfaces for admin access. The next section will cover connecting
    hybrid Windows servers to Azure Arc.


    # Implementing Azure Arc for hybrid Windows servers


    Azure Arc is a hybrid management and governance tool that supports physical and
    virtual Windows servers. These hybrid servers can be on-premises, in provider
    edge locations, or hosted on other cloud provider''s platforms. This is represented
    in the following diagram:'
  merge: -1
  img_proc: true
- pgno: 422
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_422_0.png)


    Figure 13.9 – Azure Arc for servers


    When connected in this way, a hybrid server becomes an Azure resource that can
    be controlled, secured, and managed the same as an Azure native VM.


    Each hybrid machine is given an Azure resource ID allowing the machine to be added
    to a resource group and be managed by the Azure Resource Manager (ARM); we class
    these Azure Arc-managed servers as Arc-enabled servers.


    To connect a Windows server to Azure Arc, an Azure Connected Machine agent is
    deployed and configured on the server. It should be noted that this does not replace
    the Azure Monitor Agent (AMA) for Windows servers; both agents are required for
    Arc-enabled servers.


    The following hybrid functionality and cloud operations can be performed when
    a hybrid server is Azure Arc-enabled:


    +   - **Configuring:** Azure Automation can be used to speed up routine management
    tasks. Change Tracking and Inventory capabilities are used for configuration changes,
    software installation, services, and registry updates.

    +   - **Governing:** Azure Policy guest configurations can be assigned to perform
    machine settings audits.

    +   - **Monitoring:** VM insights is used to monitor the OS, components, processes,
    services, and software applications. Log data collection and analysis is carried
    out through Log Analytics.

    +   - **Protecting:** Microsoft Defender for Cloud provides endpoint protection
    through Microsoft Defender for Endpoint. Microsoft Sentinel can provide security
    information and event management (SIEM) and orchestrated and automated responses.'
  merge: -1
  img_proc: true
- pgno: 423
  md: 'Azure Arc can be enabled manually on servers or automated through **Windows
    Admin Center** (WAC). This can be used to deploy the **Connected Machine agent**
    and perform the *Azure registration* in a single place.


    # Deployment prerequisites


    The following requirements should be met:


    +   * The hybrid machines must have a supported OS for the **Connected Machine
    agent**; these are as follows: *Windows Server 2008 R2 SP1, 2012 R2, 2016, 2019,
    and 2022*; Desktop and Server Core experiences. *Azure Stack HCI supports Windows
    Server Azure editions.*

    +   * The hybrid machines must access Azure resources directly or via a proxy.

    +   * You must have an administrator account on the local machine to install and
    configure the **Azure Connected Machine agent**.

    +   * The **Azure Connected Machine Onboarding** Azure built-in role is required.

    +   * The **Azure Connected Machine Resource Administrator** Azure built-in role
    is required to *read, modify, and delete a VM*.


    Further information on the prerequisites can be found in the following Microsoft
    documentation article: https://docs.microsoft.com/en-gb/azure/azure-arc/servers/prerequisites.


    # Network connectivity


    Azure Arc provides secure outbound connections to *public endpoints* using HTTPS
    (TCP/443). You can configure the agent to use a proxy for this communication if
    your scenario requires this.


    You can additionally use **Azure Private Link** to ensure the connections are
    private so that you do not need to open any public network access, with a **virtual
    private network (VPN)** or ExpressRoute for private network access.


    If your outbound traffic is filtered, will need to allow the URLs required by
    the **Connected Machine agent**; these can be found in the following Microsoft
    documentation article: https://docs.microsoft.com/en-gb/azure/azure-arc/servers/network-requirements?tabs=azure-cloud#urls.


    # Azure Policy guest configuration


    **Azure Policy** is a *governance tool* that helps determine compliance and identify
    non-compliance of environments. Using **guest configuration policies**, we can
    audit the state of Azure Arc-enabled servers and apply settings within the machines.'
  merge: -1
  img_proc: true
- pgno: 424
  md: 'For any of the provided policies that are assigned, resources can be marked
    as non-compliant with the policy when a condition is found `true` when evaluated.


    In the **Hands-on exercises** section of this chapter, we will walk through creating
    a policy assignment. We will look at the **Log Analytics extension should be installed
    on your Windows Azure Arc machines** policy. This policy audits Windows Azure
    Arc machines if the Log Analytics extension is not installed; if the result is
    `false`—that is, the extension is not installed—then the machine will be marked
    as non-compliant with the policy.


    A list of all the Azure Policy definitions can be found in the following Microsoft
    documentation article: `https://docs.microsoft.com/en-gb/azure/governance/policy/samples/built-in-policies`.


    # Log Analytics agent for hybrid Windows servers


    The **Log Analytics agent** is used for sending data to a **Log Analytics workspace**.
    It is supported for Windows and Linux servers that can be Azure and non-Azure
    VMs; it is also referred to as the **Microsoft Monitoring Agent (MMA)**.


    You should be aware that the Log Analytics agent is being deprecated and will
    not be supported after August 31, 2024; you should migrate to the AMA.


    The primary scenario for deploying the Log Analytics agent is when you need to
    do any of the following:


    +   * Collect log and performance data from any Azure or non-Azure machines, physical
    or virtual

    +   * Send data to a Log Analytics workspace; for use with features such as log
    queries in Azure Monitor

    +   * Monitor machines with VM Insights

    +   * Manage protection of machines with Microsoft Defender for Cloud or Microsoft
    Sentinel

    +   * Use the Azure Automation features of **Update Management**, **State Configuration**,
    or **Change Tracking and Inventory**


    The Log Analytics agent has the following limitations:


    +   * Data cannot be sent to Azure Monitor Metrics, Azure Storage, or Azure Event
    Hubs

    +   * Unique monitoring definitions for individual agents are not possible

    +   * Scale limitations are due to each machine having a unique configuration


    A list of the supported OSEs can be found in the following Microsoft documentation
    article: `https://docs.microsoft.com/en-gb/azure/azure-monitor/agents/agents-overview#supported-operating-systems`.'
  merge: -1
  img_proc: true
- pgno: 425
  md: 'There are several deployment options for deploying the Log Analytics agent
    to hybrid Windows servers; these are as follows:


    +   - Use Azure Arc for servers, which deploys the VM extension to Azure Arc-enabled
    servers

    +   - Manually install the agent

    +   - Integrate System Center Operations Manager (SCOM) with Azure Monitor


    The following types of data can be collected with the Log Analytics agent for
    Windows servers:


    +   - Windows event logs

    +   - Performance

    +   - Internet Information Services (IIS) logs

    +   - Custom logs


    The Log Analytics agent has a wider scope of usage scenarios than just collecting
    data for ingestion into a Log Analytics workspace for Azure Monitor consumption.
    It is also used as a core component in Microsoft Defender for Cloud and Microsoft
    Sentinel, which also use it in conjunction with a connected Log Analytics workspace.


    The agent for Windows Server requires outbound communication over TCP 443, and
    the following URLs will need to be allowed:


    +   - *.ods.opinsights.azure.com

    +   - *.oms.opinsights.azure.com

    +   - *.blob.core.windows.net

    +   - *.azure-automation.net


    If no direct internet connection is allowed, a Log Analytics gateway will need
    to be set up, which then acts as a proxy for the agent and the workspace.


    The Windows agent uses SHA-2 signing. To ensure data in transit to Azure is secure,
    it is recommended the agent should use Transport Layer Security (TLS) 1.2.


    In this section, we looked at Azure Arc for hybrid servers. In the next section,
    we will cover the content for implementing Azure Automation for hybrid Windows
    servers.'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# # Implementing Azure Automation for hybrid Windows servers


    **Process automation** is the automation of frequent management tasks that can
    be error-prone, risk configuration drift, and consume an unequal amount of time
    to the value the task delivers. In this next section, we will introduce this topic.


    # ## Introduction


    Automation can be provided through the **Azure Automation** service and is available
    to hybrid workloads.


    To implement Azure Automation in this manner for non-Azure hybrid workloads, an
    **Azure Automation account** is required. Azure Automation is an Azure cloud service
    responsible for automating the configuration and management of Azure and non-Azure
    platforms.


    The foundation of Azure Automation is **runbooks**, a set of tasks that execute
    on the target machine; these runbooks are executed as jobs. A process called a
    **worker** is responsible for running the jobs when the runbook is executed.


    Azure Automation relies on a **Hybrid Runbook Worker** feature that allows runbooks
    to be executed directly on Azure Arc-enabled servers. Hybrid runbook workers can
    be deployed with two approaches, as follows:


    +   - **Agent-based (v1)**: This deploys **AMA/Log Analytics agent for Windows**
    and uses a **Log Analytics** workspace to report to.

    +   - **Extension-based (v2)**: This is deployed as an Azure VM extension: the
    **Hybrid Runbook Worker VM extension**. It does not rely on AMA for Windows servers
    and does not use a **Log Analytics** workspace to report to.


    The extension-based _Hybrid Runbook Worker_ is the recommended approach for an
    integrated and seamless experience.


    There are two types of runbook worker types: **System** and **User**; only the
    **System** type is supported for the extension-based _Hybrid Runbook Worker_.


    # ## Azure Automation Update Management


    Azure Automation includes **Update Management**, which provides management of
    OS updates for Azure and non-Azure machines that can be virtual and physical,
    located on-premises, at edge locations, or on other cloud platforms.


    **Update Management** uses an automation account and stores update assessments
    and deployment results data in a Log Analytics workspace through integration with
    Azure Monitor. The Log Analytics agent must be deployed and configured for each
    machine that will use **Update Management**. A machine'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'registered for **Update Management** cannot report to *more than one* Log Analytics
    workspace. System information updates from SCOM agents in a management group connected
    to the workspace can be used to collect information.


    Windows machines must use Microsoft Update to report to **Windows Server Update
    Services (WSUS)**.


    When **Update Management** is enabled, a *Hybrid Runbook Worker group* is automatically
    added to the automation account. All machines connected directly to the Log Analytics
    workspace have the *System Hybrid Runbook Worker* configured to support the **Update
    Management** runbooks.


    The following are the supported Windows OSs for **Update Management**:


    +   * Windows Server 2008 R2 (*RTM and SP1 standard*)

    +   * Windows Server 2012

    +   * Windows Server 2012 R2 (Standard/Datacenter)

    +   * Windows Server 2016 (Standard/Datacenter, *not Server Core*)

    +   * Windows Server 2019 (Standard/Datacenter, *including Server Core*)


    At the time of publishing, the *Windows Client OS* (Windows 7/10/11) is not supported
    for **Update Management**. Microsoft Endpoint Configuration Manager is the recommended
    patch management solution for **Azure Virtual Desktop (AVD)**.


    This section introduced Azure Automation for hybrid servers and covered the Azure
    **Update Management** capability. The next section will look at Microsoft Defender
    for Cloud for hybrid Windows servers.


    # # Implementing Microsoft Defender for Cloud for hybrid Windows servers


    Microsoft Defender for Cloud is Microsoft’s **Cloud Security Posture Management
    (CSPM)** and **Cloud Workload Protection Platform (CWPP)** solution. We can use
    it to monitor and manage the security posture of hybrid Windows servers in on-premises
    environments.


    In addition, we can implement Microsoft Sentinel, which provides a cloud-native
    SIEM and **security orchestration, automation, and response (SOAR)** solution
    for onboarded hybrid Windows servers.


    When Defender for Cloud is enabled, the Log Analytics agent needs to be deployed
    to the machines; the agents then send data to a connected Log Analytics workspace.
    Defender for Cloud can then determine the security posture of the machines, applications,
    data, and networks and provide a secure score.


    For Azure VMs, the Log Analytics agent is automatically provisioned by Defender
    for Cloud. For on-premises hybrid machines, the agent can be manually installed
    or automated through a solution such as Microsoft Endpoint Protection Manager.'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'The following are Defender for Cloud-specific roles:


    +   - **Security Reader**: This role has read-only rights; it can view recommendations,
    alerts, security policies, and security states.


    +   - **Security Admin**: This role has the same rights as the **Security Reader**
    role, plus it can update security policies and dismiss alerts and recommendations.


    Microsoft Sentinel''s role is the ingestion of security operations data from many
    different sources to allow correlation and response.


    Onboarding Microsoft Sentinel starts with enabling and connecting security data
    sources with many built-in data connectors that allow data ingestion.


    Microsoft Sentinel needs access to a Log Analytics workspace and should be a separate
    and dedicated instance and not shared with the Defender for Cloud workspace; this
    is referred to as a *Sentinel-enabled Log Analytics workspace*. A Sentinel-enabled
    Log Analytics workspace has its data retention period changed to 90 days.


    To enable Microsoft Sentinel, the following access is required:


    +   - **Contributor** access to the Azure subscription where the Sentinel workspace
    is created


    +   - **Contributor or Reader** access to the same resource group where the Sentinel
    workspace is created should be inherited from the subscription **contributor role**
    access


    This section covered implementing Defender for Cloud and Microsoft Sentinel.


    Next, we will complete a hands-on exercise section to re-enforce some of the concepts
    covered in this chapter.


