    Infrastructure: Manage storage and file services._


    We will start this chapter by understanding the basics of the Windows Server filesystem
    and protocols; then, we will learn how to implement and manage Windows Server-based
    storage services and solutions. We will conclude with a hands-on exercise to develop
    your skills further.


    The following topics are included in this chapter:


    +   - Managing Windows Server file servers

    +   - Implementing Windows Server iSCSI

    +   - Implementing Storage Spaces and Storage Spaces Direct

    +   - Implementing Windows Server Data Deduplication

    +   - Implementing Windows Server Storage Replica

    +   - Implementing a Distributed File System

    +   - Hands-on exercise


    In addition to the topics listed in this chapter, this chapter’s goal is to take
    your knowledge beyond the exam objectives to prepare you for a real-world, day-to-day
    hybrid environment-focused role.'
