- pgno: 383
  md: '# Resizing Azure VMs


    A VM can be scaled up or down to meet your requirements to any other VM size available
    in that region. This may be needed to meet performance demands for a VM running
    at peak capacity or where a VM is oversized and has underutilized resources that
    can be scaled back to optimize costs.


    When you wish to resize a VM, your options will depend upon whether the VM is
    running or in the stopped/deallocated state.


    Not all VM sizes may be available when a VM is running, as the underlying VM hardware
    cluster has to support the size you need.


    It is also worth noting that not all regions hold all VM sizes to choose from.
    It might be considered to try and standardize a VM size(s) that is available across
    all your regions.


    In some cases, you may need to ensure your VM is in the stopped/deallocated state,
    giving you the broadest choice of all sizes available in that region for your
    VM.


    This is represented in the following figure:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_383_0.png)


    # Figure 11.4 – Azure VM resize


    The next aspect that may also impact your resize is if there is insufficient capacity
    in the region to support your needs. This is uncommon; however, scenarios such
    as the global pandemic saw a peak in demand, which meant some regions had no available
    capacity for a period. This can be addressed through the purchase of guaranteed
    reserved capacity, but there is a cost impact to be considered.


    Another impact of scaling up in size is that subscriptions will have a quota limit
    on cores or VM types, meaning you won’t be able to resize the VM. The following
    figure shows a core quota limit being reached.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_384_0.png)


    # Figure 11.5 – Azure core quota limit at 100%


    The following shows the message that is displayed when the quota is exceeded for
    a new VM:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_384_1.png)


    # Figure 11.6 – Azure core quota exceeded message


    However, this can be resolved with a service request to Microsoft, who can raise
    the quota, with the caveat that your purchase plan type must support an increase
    in quota; sandbox environments don''t allow a core quota increase. The request
    quota increase is represented in the following figure:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_384_2.png)


    # Figure 11.7 – Quota limit increase request'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'You must also ensure you resize to the same VM type; for example, if you have
    a VM size of Dds4, this means you have a D series with four vCPUs that provide
    a local temp disk and support SSD disks. You want to ensure you resize to keep
    those VM characteristics. That is, resize from Dds4 to Dds8, not D8; D8 would
    not support your SSD disks or provide the local temp disk.


    Changing the VM size will cause it to be restarted (at the time of writing). This
    should be considered if you are using dynamic IP address allocation, as this will
    be lost when the VM is restarted; you should configure static IP allocation to
    resolve this.


    This chapter will look at changing the VM size in the *Hands-on exercise* section.


    In this section, we looked at the operations of resizing VMs. In the next section,
    we will look at configuring the continuous delivery of an Azure IaaS VM.


    # Configuring continuous delivery for an Azure VM


    **Continuous delivery** in the context of Azure first-party solutions for Azure
    IaaS VMs relates to Azure Pipelines.


    **Azure Pipelines** is better known as a software development tool but can be
    used to implement an **Infrastructure-as-Code (IaC)** approach to automate the
