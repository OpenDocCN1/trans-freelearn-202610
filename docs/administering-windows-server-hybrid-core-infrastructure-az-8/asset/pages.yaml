- pgno: 56
  md: 'Further information and syntax about dcdiag can be found at https://docs.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc731968(v=ws.11).


    # netdom


    This tool allows you to manage AD DS trusts; it can also join a computer to a
    domain, manage computer accounts, query for domain information such as which DCs
    hold the FSMO roles, and more. It is available when the AD DS role is installed
    on a server and is also included as part of the AD DS tools in the RSAT tools.


