- pgno: 362
  md: '# Introduction to containers


    In this section, we will introduce the concept of **containers** and look at their
    relationship with **virtual machines (VMs)**.


    As a concept, containers enable standardized and isolated deployable compute resource
    units that are lightweight and portable.


    Containers are built around encapsulation, which involves packaging the code of
    an application and its dependencies so that it can be deployed into development
    or production environments seamlessly with repeatable, predictable, and consistent
    results.


    The benefit and value of containers are that they are *self-contained computing
    units* that are portable and lightweight.


    In the next section, we will look at the relationship between containers and VMs.


    # Comparing containers and VMs


    To understand the containers model, we will briefly look at it alongside virtualization
    (VMs).


    Like a VM, a container is a compute resource unit; they have the same aim, which
    is to host and execute code. However, VMs carry a lot of overhead; they are non-standard,
    large in size, resource-intensive, monolithic, fragile, hard to move, and anti-agile.
    In contrast, containers could be considered *anti-VM*; their characteristics are
    the opposite in that they are standard, lightweight, small in size, utilize fewer
    resources, are portable, more agile, responsive, and have quicker boot times.
    They are well-positioned for digital transformation scenarios and modernizing
    your data center workloads.


    The approach of using containers to deliver code execution is almost thought of
    as being closer to an application delivery model than a virtualization model.


    This leads us to the next area of thought, where containers consume virtualization
    to deliver code execution by virtualizing the software resources – that is, the
    OS. This is a stark contrast to visualization, where the VMs virtualize the hardware
    resources.


    In the following diagram, we can visualize the concept of containers as compute
    units proportionate VMs, and the physical servers as the compute units:'
  merge: -1
  img_proc: true
- pgno: 363
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_363_0.png)


    Figure 10.1 – Physical versus VM versus containers


    The preceding diagram shows that, in a nutshell, fewer physical servers are required
    to deliver the same number of apps.


    Looking closely, we can see that the traditional approach of having single apps
    per server meant we needed two physical servers to deliver the two apps. This
    diagram shows that the same two apps now only need one physical server with virtualization.
    Still, we needed to purchase, maintain, secure, and support the OS on each VM,
    which can be quite a cost and operations burden. With containers, however, we
    deliver the same number of apps, still on the same number of physical servers
    as virtualization, but we only need one copy of the OS.


    To summarize, with containers, we virtualize the software; this allows many of
    these compute instances (containers) to share the underlying host software resources
    of a single-host OS. By doing so, we achieve greater efficiency, scale, and agility.


    This section introduced containers and compared them to VMs and the traditional
    physical server model to help you understand the value and benefits of running
    containers to host and execute your application’s code. In the next section, we
    will introduce Docker.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# Introduction to Docker


    Docker (https://www.docker.com) is an open source containerization platform that
    packages an app’s code into the standardized unit of compute that we looked at
    in the previous sections of this chapter. Docker, being an open standard, runs
    on all major OS types, any infrastructure, and any cloud platform.


    The two core components of the Docker platform are as follows:


    +   - Docker Engine: This is a runtime environment that is lightweight, secure,
    and can run on Windows-based OSs, Linux, and macOS


    +   - Docker Client: This is the command-line interface (CLI) for the engine and
    runs on the host computer


    Docker can be installed on Windows Server using package management. The PowerShell
    PackageManagement module is available in Windows Server 2019 and later.


    Docker can also be installed using the PowerShell DockerMicrosoftProvider module.


    We will learn how to install Docker in the Hands-on exercises section of this
    chapter.


    In this section, we introduced Docker. In the next section, we will look at securing
    Windows Server containers.


    # Securing Windows Server containers


    This section looks at security in the context of isolation modes.


    Windows Server containers provide two isolation modes: process and Hyper-V isolation.
    The degree of isolation that’s created between each container and the host OS
    differentiates these isolation modes. Let’s outline each mode:


    +   - Process isolation (this is the traditional isolation mode):


    +   - The same kernel is shared between the containers and the host


    +   - There is a user mode per container


    +   - When starting a Docker container, the –isolation=process command switch
    is used


    +   - Hyper-V isolation:


    +   - With this isolation mode, there is a kernel per container


    +   - Each container runs inside a VM


    +   - Hardware-level isolation is provided between each container and the host


    +   - When starting a Docker container, the –isolation=hyperv command switch is
    used'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'These two isolation modes are shown in the following diagram:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_365_0.png)


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_365_1.png)


    Figure 10.2 – Isolation modes


    Process isolation is the default mode for Windows containers on Windows Server
    hosts. Windows containers running on Windows 10 hosts use Hyper-V isolation.


    In this section, we looked at security in the context of isolation in Windows
    containers. In the next section, we will look at networking in Windows containers.


    # Networking for Windows Server containers


    The concept of networking with Windows Server containers is similar in function
    to VMs. A virtual network adapter (vNIC) is attached to a container, which connects
    to a Hyper-V virtual switch (vSwitch). There are five networking drivers, or modes,
    that can be created through Docker to support Windows; these are as follows:


    +   - L2bridge network driver

    +   - L2tunnel network driver

    +   - NAT network driver

    +   - Overlay network driver

    +   - Transparent network driver'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'Further details on each of these can be found in the following Microsoft documentation
    article: https://docs.microsoft.com/en-gb/virtualization/windowscontainers/container-networking/network-drivers-topologies.


    Depending on the physical network and host networking requirements, the one that
    best suits your needs should be chosen.


    You can run the `docker network ls` command to list the available networks.


    NAT is the default network type that''s created the first time Docker Engine runs.
    It uses the **WinNAT** Windows component and an internal vSwitch.


    Two vSwitches are available; these are as follows:


    +   **Internal vSwitch**: This is not connected directly to a network adapter
    on the container host


    +   **External vSwitch**: This is connected directly to a network adapter on the
    container host


    In this section, we looked at networking in Windows Server containers. In the
    next section, we will look at the process of creating Windows Server container
    images.


    # Creating Windows Server container images


    A base image provides a foundation layer of the OS for a container; all containers
    will be based on that image. The base image contains the user mode OS files, runtimes
    files, required app dependencies, and any required miscellaneous configuration
    files.


    Microsoft provides the following base images for Windows Server containers:


    +   **Windows**: This includes the full Windows APIs and system services but no
    server roles. It is not available on Windows Server 2022. This is the largest
    image (3.4 GB).


    +   **Windows Server**: This includes the full Windows APIs and more server features
    than the Windows image, has GPU support, and has no IIS limits. It requires Windows
    Server 2022 and is slightly smaller than the Windows image (3.1 GB).


    +   **Server Core**: This and Nano Server are the most common images. It includes
    a subset of the Windows APIs, including the **.NET Framework** and most server
    roles, and a medium-sized image. It is best for **lift and shift** scenarios.


    +   **Nano Server**: This includes the **.NET Core** APIs and some server roles;
    it is an ultralight image. The key image difference is a significantly smaller
    API surface; PowerShell, WMI, and the Windows servicing stack are not included.


    The following information summarizes the appropriate base image to use for a given
    scenario:


    +   *Is a full .NET Framework required for the application?* You should use the
    **Windows Server Core** base image.'
  merge: -1
  img_proc: true
- pgno: 367
  md: '+   - Is the app based on .NET Core? You should use the Nano Server base image.

    +   - Does your app require a dependency that''s missing from Windows Server Core?
    You should use the Windows base image.

    +   - Is GPU acceleration support required? You should use the Windows Server
    base image.


    These base images can be discovered on Docker Hub: https://hub.docker.com/_/microsoft-windows-base-os-images.


    A list of all the Microsoft container base images available can be found by running
    the following PowerShell command:


    ```

    ```

    docker search Microsoft

    ```

    ```


    These images can be downloaded from the **Microsoft Container Registry (MCR)**.


    To download a base image, you can use the `docker pull` command. The following
    is an example:


    ```

    ```

    docker pull mcr.microsoft.com/windows/servercore:ltsc2022

    ```

    ```


    Once the image(s) have been downloaded, you can run the following command to verify
    which images are now available locally and display metadata:


    ```

    ```

    docker image ls

    ```

    ```


    In this section, we outlined Microsoft-based container creation using Docker.
    In the next section, we will look at managing Windows Server container images.


    # # Managing Windows Server container images


    A Windows container is created, run, and managed through Docker. **Docker Engine**
    provides tools that help automate the creation process. The Docker components
    that enable this are as follows:


    +   - **The Docker text file**, Dockerfile: This file includes instructions for
    creating a container image. This includes identifying the base image that will
    be used and the commands that will be run when creating the image and identifying
    when new instances of the image are deployed.

    +   - **The Docker command**, `docker build`: This command calls the Dockerfile,
    which then triggers the image creation process.


    In addition to automation, Docker commands can be run manually. The following
    are some common commands for reference:


    +   - `docker images`: This command lists installed images on the container host

    +   - `docker run`: This command creates a container using a container image'
  merge: -1
  img_proc: true
- pgno: 368
  md: '+   - `docker commit`: This command commits the changes that have been made
    to a container to a new container image

    +   - `docker stop`: This command stops a running container

    +   - `docker rm`: This command removes an existing container


    The Docker approach allows you to store images as code, perform continuous integration
    with a development life cycle, and recreate quick and repeatable images for upgrade
    and maintenance purposes with consistent results.


    Containers can also be managed by the browser-based GUI known as **Windows Admin
    Center (WAC)**. **Container extensions** must be installed so that container management
    in WAC is seen. This can be seen in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_368_0.png)


    Figure 10.3 – Installing container extensions for WAC


    Once the extensions have been installed, you will be prompted to install Docker
    if it does not exist on the host, as shown in the following screenshot:'
  merge: -1
