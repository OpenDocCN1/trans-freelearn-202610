- pgno: 97
  md: '# # Managing Users and Computers with Group Policy


    This chapter covers the AZ-800 Administering Windows Server Hybrid Core Infrastructure
    exam learning objective: Manage Windows Server by using domain-based Group Policies.


    In the previous chapter, we added skills to understand the concepts, creation,
    and management of Azure AD DS in Microsoft Azure-hosted environments.


    We will start this chapter with some concepts and an understanding of Group Policy.
    We will then look at the Group Policy components, their capabilities and operations,
    management, and troubleshooting. We will then conclude with a hands-on exercise
    to develop your skills further. The following topics will be covered in this chapter:


    +   - What is Group Policy?

    +   - What is a GPO?

    +   - GPO components

    +   - GPO administrative templates

    +   - GPO scope

    +   - GPOs in Azure AD DS

    +   - GPO management and troubleshooting tools

    +   - Exercise – Installing Group Policy Management tools

    +   - Exercise – Implementing Group Policy


    Before we dive into any policy creation or management, we will look at some definitions
    and concepts to set a baseline and foundation of knowledge to build from. We start
    this chapter by defining Group Policy and Group Policy Objects (GPOs).'
  merge: -1
  img_proc: true
- pgno: 98
  md: "# # What is Group Policy?\n\nGroup Policy is a Microsoft governance feature\
    \ and configuration management framework built as part of the Windows OS; it provides\
    \ a method for the centralized configuration and management of users' and computers'\
    \ OS and applications.\n\nIt is used to force a baseline of standardized configuration\
    \ settings on user and computer objects that are part of an AD domain. It is a\
    \ powerful management capability and can manage nearly all configurable settings.\n\
    \nGroup Policy can be used with Azure AD DS to manage user and computer object\
    \ settings in much the same way as for AD DS, with some limitations. We will cover\
    \ this in more detail in the GPOs in the Azure AD DS section.\n\nThere are two\
    \ configuration settings nodes, as follows:\n\n+   - **User Configuration**: These\
    \ apply to a user. These settings can restrict a user from accessing certain functionality\
    \ of the OS, such as removing items from the **Start Menu** and **Taskbar**. These\
    \ settings are applied to a user on whatever domain computer they access.\n+ \
    \  \n+   - **Computer Configuration**: These apply to a computer. These settings\
    \ can be for configuration, such as **Remote Desktop Session** settings. These\
    \ settings apply to all users who log on to this computer.\n\nThe following screenshot\
    \ shows these two nodes:\n\n![](img/cf35f46a8dd5f11e58349c1d81611b75_98_0.png)\n\
    \nFigure 3.1 – GPO configuration nodes\n\nThe policies exist on the domain controllers\
    \ for a domain. Part of the management aspect is ensuring a copy of the latest\
    \ policies is passed through the replication process. With Azure AD DS, this is\
    \ taken care of for you by Microsoft as one of the benefits of having a managed\
    \ domain."
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Group Policy uses built-in management tools to create and manage the policy
    settings. The following screenshot shows the Group Policy Management Console (GPMC)
    tool:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_99_0.png)


    Figure 3.2 – The GPMC tool


    Before we move on to the next section, it would be helpful for us to recap the
    first chapter on OUs. An Organizational Unit (OU) functions as a container object.
    It is used to collectively organize users, groups, and computers, providing a
    framework for targeting administrative control and policies on objects in the
    container.


    In this section, we introduced Group Policy concepts and a recap of OUs. In the
    next section, we will look at GPOs, which form the basis and building blocks of
    Group Policy.


    # What is a GPO?


    GPOs can be considered a store of the collection of individual policy settings
    that can be applied to the user and computer domain objects. These objects are
    much like a manifest document that holds and defines the individual policy settings
    that should be applied to objects for management and configuration in an automated,
    governed, and controlled manner.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'GPOs can be one of the following two types:


    +   - **Local GPO**: Windows OS computers have policies whose settings only apply
    to the *local computer* and cannot be linked to any other object; they are applicable
    for computers that are *not AD joined*.

    +   - **Domain GPO**: These are created and stored on AD domain controllers. These
    GPOs can then be linked to a *site*, *domain*, and *OU container* objects (not
    groups) and provide central management of configuration settings that wish to
    be applied to user and computer objects in the domain.


    There are two default policies created when AD DS is installed on Windows Server,
    and these are as follows:


    +   - **Default Domain Policy**: This is linked to the *domain container* and
    affects all computers. Security filtering settings can be applied to a specific
    security group; the default security filtering will apply to the *Authenticated
    Users* group.

    +   - **Default Domain Controllers Policy**: This is linked to the *domain controllers
    OU* container for the exclusive purpose of applying domain-controller-specific
    settings.


    You should create additional GPOs and link those to the site, domain, or OU container
    objects as required if you need additional settings that are unavailable in these
    GPOs.


    In this section, we defined GPOs. In the next section, we will look at the GPO
    components.


    # GPO components


    An AD domain GPO consists of the following two components:


    +   - **GPO Container**: This is an AD object and is a metadata store for the
    GPOs. The **Directory Replication Agent (DRA)** provides replication between DCs.

    +   - **GPO Template**: This is a store for a set of files for the GPO. **Distributed
    File System Replication (DFSR)** provides replication between DCs.


    For a GPO to be applied to a user or a computer, it must be linked to a site,
    domain, or OU container that contains computer or user objects that require to
    be affected by the policy; a GPO cannot be applied directly to a group. GPOs provide
    two groups of configuration settings, one for computers and one for users; there
    are no configuration settings for groups. The configuration settings nodes in
    any policy are as follows:


    +   - **Computer Configuration**: The policies defined in this section will only
    affect computer objects. These settings are evaluated and applied at computer
    boot time.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '+   • **User Configuration**: The policies defined in this section will only
    affect the user object''s login sessions. These settings are evaluated and applied
    at user logon and only apply to the session while it lasts.


    The following screenshot shows these configuration node sections:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_101_0.png)


    # Figure 3.3 – GPO configuration nodes


    You should plan whether a policy setting should be applied in the computer or
    user settings:


    +   • Computer settings will affect all users that access that computer

    +   • User settings will affect the user no matter what computer they access


    The GPO''s user or computer configuration section can also be disabled independently.
    This is useful if you have no settings configured in one of these, as every section
    will need to be processed if enabled; disabling the section with no settings can
    result in faster policy processing times.


    The individual policy setting is the most granular level and is the most basic
    building block of the GPO hierarchy; the specific setting configured for affecting
    the computer and user objects will be defined here. This setting could prevent
    a user from shutting down the computer, configuring the remote desktop session
    settings, or setting a registry entry.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'The following screenshot shows an individual group policy setting:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_102_0.png)


    Figure 3.4 – Group policy setting


    With Group Policy''s extensible framework, nearly any configurable setting can
    be applied with GPOs.


    In this section, we looked at the GPO components. In the next section, we will
    look at administrative templates and their purpose.


    # GPO administrative templates


    These provide the basis for registry-based policy. As the name implies, the settings
    you configure are used to make changes to the registry; deploying configurations,
    apps, and software in this way is often the most efficient approach for centralized
    deployments.


    Templates have the following settings that can be configured:


    +   Computer-related: The settings defined here will edit the HKEY_LOCAL_MACHINE
    registry hive


    +   User-related: The settings defined here will edit the HKEY_CURRENT_USER registry
    hive


    If settings conflict, the computer settings registry changes take precedence.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Templates are located under the **Administrative Templates** node of the GPOs
    **Computer Configuration** and **User Configuration** nodes, as seen in the following
    screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_103_0.png)


    # Figure 3.5 – Administrative templates


    The administrative template is made up of two file types, as follows:


    +   • **.admx file**: This specifies the group policy settings and is *language-neutral*.
    These should be copied into the `%SYSTEMROOT%\PolicyDefinitions` folder or a central
    location such as SYSVOL; for Azure AD DS, you will not have access to SYSVOL.


    +   • **.adml file**: This specifies the language used with the .admx file. These
    are commonly referred to as *language files*. These should be copied into the
    `%SYSTEMROOT%\PolicyDefinitions\[Language-Country Region]` folder. Each language
    has its own `\PolicyDefinitions` subfolder; that is, the en-US folder should be
    used to store the English files, and so on. The default .adml language file present
    is the language of the installed OS of the computer.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'The following screenshot shows the locations for these files:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_104_0.png)


    Figure 3.6 – Administrative templates location


    This section looked at using administrative templates to configure registry settings
    centrally. In the next section, we will look at the GPO scope.


    # GPO scope


    A GPO contains configuration settings that you specify that could apply to computer
    and user objects. Still, you must define the domain objects you want to be affected
    by the policies. This is the scope, or, defined another way, the blast radius/area
    of impact of where the policy settings will be applied.


    A GPO can have a scope of the following three domain object levels:


    +   - **Site scope**: All users and computers within this site will be affected
    by the linked GPO with a scope set at this level

    +   - **Domain scope**: All users and computers within this domain will be affected
    by the linked GPO with a scope set at this level

    +   - **OU scope**: Only users and computers within this OU will be affected by
    the linked GPO with a scope set at this level


    By default, all users and computers will be affected by the policy linked to the
    container they are part of; a GPO can be linked to multiple sites, domains, or
    OU container objects.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '> **Note**

    > GPOs can only apply/affect users and computers and cannot be applied directly
    to groups.


    However, we can use security group filtering to ensure the right users get the
    policy applied; by default, security filtering is set to the **Authenticated Users**
    group.


    You should consider the effect of linking GPOs to multiple sites in multiple domain
    forests, as this can have an impact on performance; to process the GPOs, they
    may need to be accessed over what could be a slow WAN link.


    GPOs can also be *unlinked*, so their policy settings are not affecting the user
    or computer objects they were linked to; GPOs can also be *disabled* or *deleted*.


    This section looked at the scopes for a GPO. The following section will look at
    the GPO processing order and inheritance.


    # # The order of processing for GPOs


    As we learned in the previous section, GPOs can be linked to an AD site, domain,
    or OU and will be applied to any user or computer object in that container.


    Each GPO will be processed in the following order of inheritance:


    +   1. Local policy

    +   2. Site-level linked GPO

    +   3. Domain-level linked GPO

    +   4. OU-level linked GPO


    The following illustration aims to outline the order of linked GPO processing:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_105_0.png)


    Figure 3.7 – Domain GPO processing order'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'The settings applied to the user and computer objects will be the combined
    effect of policies linked at each level, creating a **Resultant Set of Policies
    (RSoP)**. There can be multiple GPOs linked at each container level.


    When one GPO has the same policy setting as a different value to another linked
    GPO, there will be a conflict; for example, *prevent shutdown* may be *enabled*
    in a site GPO, but the same setting might have a value of *disabled* in a GPO
    linked to a lower container such as an OU GPO. By default, lower-level containers
    override the GPOs set at the higher levels; in this case, the result would be
    that a computer can be shut down, as the policy setting to prevent shutdown has
    been disabled through the order of precedence.


    It is essential to consider that settings you intended to be applied by a GPO
    at one level are not *overridden* by another GPO processed afterward.


    The default behavior, however, can be changed so that you can set **block inheritance**
    of policy settings on a domain or OU container. As its name suggests, this blocking
    action prevents the policy settings from GPOs linked at higher levels in the hierarchy
    from being applied.


    In addition to blocking inheritance, one final control is the ability to *enforce*
    a linked GPO. This GPO’s settings will take precedence over any conflicting settings,
    maybe from a GPO linked at a higher level. An enforce overrides a block, meaning
    the settings will be enforced even if set to block inheritance.


    The challenge with the Group Policy framework is that it can become a governance
    issue. Many GPOs can be created and linked to different containers. With inheritance,
    blocking, and enforcement, it can become very complex to understand the resulting
    or effective settings that would be applied to a user or computer; the use of
    inheritance blocking should be limited.


    When we consider blocking and enforcement, this resulting precedence can be quite
    hard to track; the **Group Policy Inheritance** tab can simplify this, showing
    the resulting precedence of GPOs considering all factors, so you do not need to
    figure it out. This is shown in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_106_0.png)


    # Figure 3.8 – Group Policy inheritance precedence evaluation'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'This section looked at the GPO order of processing and inheritance. The following
    section will look at GPOs specific to Azure AD DS.


    # GPOs in Azure AD DS


    Azure AD DS manages Group Policy in much the same way as AD to manage settings
    for the user and computer objects, but with restrictions on what settings can
    be accessed and configured in the managed domain.


    When Azure AD DS is implemented in an Azure AD tenant, two built-in GPOs are created
    for managing the configuration of users and computers. These are as follows:


    +   - AADDC Users GPO

    +   - AADDC Computers GPO


    These are shown in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_107_0.png)


    Figure 3.9 – Default Azure AD DS GPOS


    You can create custom GPOs if you need additional settings not available in these
    GPOs. These can only be linked to OUs, and you can create additional custom OUs
    as required to meet your needs. For Group Policy administration privileges in
    the managed domain, you need to be a member of the AAD DC administrators group.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'In a hybrid identity environment where both AD DS and Azure AD DS are utilized,
    group policies from the AD DS DCs will not synchronize to the Azure AD DS managed
    domain. You must manually create these settings in Azure AD DS to work around
    this. You should be aware that Azure AD DS only supports a flat GPO structure,
    so you may have to rethink how you will provide the same user and computer configuration
    if your existing GPO design does not translate directly into what is possible
    in Group Policy on Azure AD DS.


    In this section, we defined GPOs in Azure AD DS. The following section will look
    at the tools to create and manage GPOs.


    # # GPO management and troubleshooting tools


    GPOs can be managed primarily through a GUI. The GPMC is the built-in group policy
    management tool in the Windows OS. This has a built-in editor feature, **Group
    Policy Management Editor**. The GPMC can be launched with the `gpedit.msc` command.


    This tool allows you to create, link, edit, and delete GPOs, provide reports,
    and model how they will affect users and the computers they are applied to.


    The following command-line tools can also be used to manage and troubleshoot GPOs:


    +   - GPMC

    +   - GPRESULT

    +   - GPUPDATE

    +   - LDIFDE

    +   - PowerShell


    When you create a new GPO or edit a GPO, the GPO files are replicated to every
    member server every *90 minutes* (DC servers are replicated every 5 minutes).
    You don''t need to have a user log off or reboot to apply the policy. You can
    also force an application if you don''t want to wait by using the `gpupdate /force`
    command.


    The **Group Policy Management Editor** pane in the following screenshot shows
    the configuration settings nodes of **Computer Configuration** and **User Configuration**
    in the GPO settings hierarchy and how they are visually represented:'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/cf35f46a8dd5f11e58349c1d81611b75_109_0.png)


    # Figure 3.10 – GPO configuration nodes


    The Computer Configuration and User Configuration nodes in the GPO settings hierarchy
    are then broken down into sections with folders for Policies and Preferences,
    and beneath those are further configuration areas. The Group Policy Management
    Editor pane shows how the Policies and Preferences folders and subconfiguration
    group folders are visually represented in the following screenshot:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_109_1.png)


    # Figure 3.11 – GPO configuration settings'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'GPOs linked to an object container will have the following attributes to be
    aware of for managing GPOs, including the following:


    +   - The link order

    +   - The GPO name

    +   - Whether the GPO is enforced or not

    +   - Whether the link is enabled

    +   - Whether the GPO is enabled

    +   - Whether there is a WMI filter


    The following screenshot shows the GPOs linked to a domain object container and
    its attributes:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_110_0.png)


    # Figure 3.12 – Linked GPOs


    The Group Policy framework’s strong configuration capabilities mean it can manage
    nearly all configurable settings. The most granular level of the Group Policy
    framework is the individual policy setting. The policies can be one of three states:


    +   - Not Configured

    +   - Enabled

    +   - Disabled'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'The following screenshot shows these individual Group Policy states:


    ![](img/cf35f46a8dd5f11e58349c1d81611b75_111_0.png)


    Figure 3.13 – Group Policy setting states


    When we create a new policy, the default is that all settings are set to **Not
    Configured**. When a policy state is changed between **Enabled** and **Disabled**,
    the changes are applied to the computer and user objects affected by the GPO.


    This section looked at the tools for creating and managing GPOs. In the next section,
    we will complete a hands-on exercise section to re-enforce some of the concepts
    covered in this chapter.


    # Hands-on exercise


    To support your learning with some practical skills, we will utilize the concepts
    and understanding gained from the earlier sections of this chapter and put them
    into practical application.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'We will look at the following exercises:


    +   - Exercise – Installing Group Policy Management tools

    +   - Exercise – Implementing Group Policy


    # Getting started


