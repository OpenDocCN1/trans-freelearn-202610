- pgno: 4
  md: '# # Contributors


    # ## About the author


    **Steve Miles**, aka *SMiles* or *Mr. Analogy*, is a Microsoft Azure Hybrid MVP,
    MCT, and multi-cloud and hybrid technologies author and technical reviewer with
    over 20 years of experience in networking, data center infrastructure, managed
    hosting, and cloud solutions. His experience comes from working with end users
    and reseller channels and in vendor spaces and roles with a global network and
    app security vendor, with global telco hosts, in managed hosting, with colocation
    and data center service providers, and in hardware distribution. Currently, he
    is working for a multi-**Cloud Solution Provider** (**CSP**) distributor based
    in the UK and Dublin in a cloud and hybrid technology leadership role.


    His current focus is on securing, protecting, and managing identities, Windows
    clients, and Windows Server workloads in hybrid and multi-cloud platform environments.


    Most happy in front of a whiteboard, he prefers to communicate using illustrations.
    He is renowned for breaking down complex technologies with analogies and concepts
    into everyday, real-world scenarios.


    His first Microsoft certification was on Windows NT and he is an MCP, MCITP, MCSA,
    and MCSE for Windows Server and many other Microsoft products. He also holds multiple
    Microsoft Fundamentals, Associate, Expert, and Specialty certifications in Azure
    Security, Identity, Network, and M365. He also holds multiple security and networking
    vendor certifications.


    Finally, as part of the multi-cloud domain, he has experience with GCP, AWS, an
    Alibaba Cloud MVP, and is Alibaba Cloud-certified.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# About the reviewer


    **Peter De Tender** has more than 25 years of experience in architecting and deploying
    Microsoft solutions, starting with Windows NT4/Exchange5.5 in 1996. In early 2012,
    he started shifting to cloud technologies and quickly embraced Azure, working
    as a cloud architect and trainer. In September 2019, Peter joined Microsoft''s
    prestigious Microsoft Technical Trainer team, providing Azure readiness workshops
    to their top customers and partners across the globe. Recently having relocated
    to Redmond, WA, Peter is continuing this role. Given his past status as Azure
    Hybrid MVP and his passion for the community, Peter is still actively involved
    in public speaking, technical writing, and mentoring and coaching. You can follow
    Peter on Twitter at @pdtit.


    *Thanks Steve, for trusting my love for Azure. Also, a big thanks to my wife for
    supporting me in realizing my dreams.*'
