  \ Frog 已允许我们在任何媒介或格式中分发、重新混合、改编和在材料之上构建，甚至用于商业目的。\n\n它们可以在这里找到：\n\n- **Pixel Adventure:**\
  \ https://pixelfrog-assets.itch.io/pixel-adventure-1\n- **Pixel Adventure 2:** https://pixelfrog-assets.itch.io/pixel-adventure-2\n\
  \n## 使用 TileMap 构建关卡\n\n使用 TileMaps 构建 2D 关卡是一种高效且有条理的方式，通过重复使用小型的预设计瓦片来创建游戏环境。这种方法不仅节省时间和资源，还允许在关卡设计中轻松调整并保持视觉一致性。\n\
  \n在本节中，我们将通过使用 TileMap 创建关卡来构建 2D 平台游戏的基础，从而高效地设计和组织游戏环境。TileMaps 至关重要，因为它们使创建详细的基于网格的关卡变得容易，同时优化性能，保持游戏世界易于管理且视觉一致。\n\
  \n让我们通过创建新场景并添加必要的节点来开始构建关卡的过程。按照以下步骤使用 TileMapLayer 设置一个功能齐全、组织良好的关卡：\n\n- 1. 创建一个新的\
  \ Godot 项目并为其命名 – 我将其命名为 PixelAdventure。\n- 2. 我们需要一个场景来代表游戏的第一个关卡。为此，我们创建一个新的 2D\
  \ 场景，它将以 Node2D 作为根节点。将 Node2D 重命名为 Level1。\n\n\n\n\n3. 我们现在准备向 Level1 场景添加一个 TileMapLayer\
  \ 节点。TileMapLayer 节点使用一个 TileSet，其中包含用于创建基于网格地图的瓦片列表。TileMaps 在 2D 游戏开发中用于通过重用小型预定义瓦片高效地创建大型、一致的关卡。这提高了游戏性能，也使编辑和自定义关卡变得容易。\n\
  \n4. 将一个新的 TileMapLayer 节点作为 Level1 的子节点添加。你的场景树将类似于图 6.1。图 6.1 显示如下：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_157_0.png)\n\
  \n图 6.1 – 添加 TileMapLayer 节点后的场景树\n\n5. 每个 TileMapLayer 节点都需要一个 TileSet，以便我们可以在场景中放置单个瓦片来创建关卡。要创建\
  \ TileSet，请选择 TileMapLayer 节点，然后在 Inspector 中找到 Tile Set 属性并点击 New TileSet，如图 6.2\
  \ 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_157_1.png)\n\n图 6.2 – 创建新的 Tile\
  \ Set\n\n6. 然后点击 TileSet，这将使屏幕底部中央的 TileMap 和 TileSet 选项卡可见，如图 6.3 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_157_2.png)\n\
  \n图 6.3 – TileSet 和 TileMap 选项卡\n\n7. 在 Pixel Adventure 资源包的 Terrain 文件夹中，有一个名为\
  \ Terrain (16 x 16).png 的图像文件。在你的 Godot 文件系统中创建一个名为 Assets 的文件夹，然后创建一个名为 TileMap\
  \ 的子文件夹。将 Terrain 图像文件拖放到 TileMap 文件夹中，如图 6.4 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_158_0.png)\n\
  \n图 6.4 – Terrain.png 已添加到 TileMap 文件夹\n\n8. 现在图像已在我们的 FileSystem 中，我们可以将其拖放到 TileSet\
  \ 选项卡中，这将允许我们使用单个瓦片。这在图 6.5 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_158_1.png)\n\
  \n图 6.5 – TileSet 现在已加载\n\n9. 我们目前不会更改 TileSet 的任何内容。我们的目标是绘制关卡。为此，切换到 TileMap 选项卡并按\
  \ D 或点击 Paint 按钮。现在在地图中选择瓦片并在屏幕上的 Viewport 中绘制它们，如图 6.6 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_159_0.png)\n\
  \n图 6.6 – 通过选择瓦片并使用 Paint 工具绘制瓦片\n\n图 6.6 显示了如何使用 Paint 工具选择瓦片，然后通过点击将其绘制到场景中。你也可以按住\
  \ shift + 点击同时绘制多个瓦片。现在开始绘制一个关卡。你可以随意做任何事情，也可以复制我的关卡，如图 6.7 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_159_1.png)\n\
  \n图 6.7 – 一个封闭关卡的示例\n\n如 图 6.7 所示，我们现在有一个供玩家探索的关卡。重要的是要理解，这个关卡目前纯粹是装饰性的——我们甚至无法检测碰撞，因为这个世界没有物理！在下一节中，我们将添加玩家，然后返回我们的\
  \ TileSet 来实现物理。\n\n## 创建和控制玩家\n\n现在我们有了世界，我们需要一个玩家来探索它！在本节中，我们将专注于为完全交互式的 2D 关卡构建基础。每个步骤都将帮助我们创建可玩的环境，同时介绍\
  \ Godot 的基本工具和技术。\n\n首先，我们将添加一个背景，为关卡提供视觉上下文。然后，我们将创建一个 CharacterBody2D 节点作为玩家，并配置它，包含一个\
  \ AnimatedSprite2D 节点使其栩栩如生，以及一个 CollisionShape2D 节点以实现物理交互。在设置好玩家的动画后，我们将通过编写角色控制器脚本来结束，允许玩家移动并与关卡交互。\n\
  \n到本节结束时，你将拥有一个功能齐全且视觉上吸引人的玩家角色，可以探索你创建的 2D 世界。\n\n## 添加背景\n\n我们将按照以下步骤为关卡添加背景：\n\
  \n- 1. 添加一个新的 TextureRect 节点作为 Level1 的子节点。在文件系统中创建一个名为 Background 的新文件夹，并将下载资源中\
  \ Background 文件夹中的图像添加到其中。\n- 2. 在 Inspector 中，使用 Brown.png 背景图像作为 Texture。设置 Expand\
  \ Mode 属性为 Keep Size，Stretch Mode 属性为 Tile。\n\n3. 现在，将 TextureRect 拖动以填充整个 Viewport，甚至更多。我们刚刚创建了一个平铺背景。\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_161_0.png)\n\n图 6.8 – 更改 TextureRect\
  \ 的属性\n\n4. 为确保背景出现在场景中每个其他节点的后面，请将 TextureRect 节点定位在场景树的顶部，如图 6.9 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_161_1.png)\n\
  \n图 6.9 – 下方节点出现在上方节点前面\n\n图 6.9 演示了节点在树中处理的顺序。它是自上而下进行的，从根开始依次向下遍历每个分支。关卡现在有了背景，看起来更精致。\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_162_0.png)\n\n图 6.10 – 背景有助于完善关卡\n\n\
  玩家角色现在准备登场。创建一个新场景并添加一个 CharacterBody2D 节点作为根，然后将其重命名为 Player。添加一个 AnimatedSprite2D\
  \ 节点作为子节点，如图 6.11 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_162_1.png)\n\n\
  图 6.11 – 向玩家添加 AnimatedSprite2D 节点\n\n图 6.11 显示了 AnimatedSprite2D 节点。这是一个包含多个纹理作为动画帧的精灵节点。在下一节中，我们将为玩家的操作设置各种动画。\n\
  \n## 设置玩家动画\n\n要为精灵制作动画，我们使用多个帧来描绘精灵在运动各个阶段的样子。这些帧通常被组合在一个单一图像中，称为 **sprite sheet**。要为精灵制作动画，我们首先导入\
  \ sprite sheet，然后将其分割成单独的帧。为此，选择 **AnimatedSprite2D** 节点，并在 **Inspector** 中，在 **Sprite\
  \ Frames** 属性上点击 **New SpriteFrames**。这在图 6.12 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_163_0.png)\n\
  \n图 6.12 – 新建 SpriteFrames\n\n点击 **Inspector** 中的 **SpriteFrames**，如图 6.12 所示，将在屏幕底部打开\
  \ **SpriteFrames** 区域（见图 6.13）。这是我们可以导入帧并创建新动画的空间。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_163_1.png)\n\
  \n图 6.13 – SpriteFrames 区域\n\n如 图 6.13 所示，我们目前只有默认动画，且没有与之关联的图像或帧。我们现在将为玩家的所有操作创建动画，然后从其\
  \ sprite sheet 导入每个操作相关的精灵。为此，请按照以下步骤操作：\n\n- 1. 首先将默认动画重命名为 idle。然后点击 Add Animation\
  \ 按钮或按 Ctrl + N。将该动画重命名为 run。\n- 2. 创建以下动画列表：double_jump、fall、jump 和 wall_slide。这些在图\
  \ 6.14 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_164_0.png)\n\n图 6.14 – 玩家操作的全部动画\n\
  \n现在动画名称已准备好，如图 6.14 所示，我们可以引入与每个动画关联的图像。\n\n- 3. 在 FileSystem 中创建一个名为 Player 的新文件夹。现在，找到从\
  \ Pixel Frog 下载的资源中的 Main Characters 文件夹，并将玩家角色的图像拖到文件系统中的 Player 文件夹中。我选择使用忍者青蛙角色。选择\
  \ idle 动画，然后点击 Add frames from sprite sheet 按钮或按 Ctrl + Shift + O。\n- 4. 现在在你的 Assets\
  \ 文件夹中选择 idle 图像文件。你必须统计玩家图像的数量并按需更新 Horizontal 和 Vertical 帧属性。然后点击 Select All 按钮，然后点击\
  \ Add x Frame(s) 按钮。这在图 6.15 中以忍者青蛙的 idle 帧为例显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_165_0.png)\n\
  \nFigure 6.15 – 设置水平和垂直帧并将它们添加到动画中\n\n5. 如图 6.15 所示，从图像（精灵表）中剪切出单个帧后，你的 SpriteFrames\
  \ 窗口将更新为用于空闲动画的图像。这在图 6.16 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_165_1.png)\n\
  \nFigure 6.16 – 空闲动画的帧\n\n如图 6.16 所示，顶部栏中有动画控件。我已将空闲帧率设置为 8 FPS，并且循环已开启。你可以尝试这些设置以找到自己喜欢的设置。这在图\
  \ 6.17 中可以看到。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_165_2.png)\n\nFigure 6.17\
  \ – 动画控件，突出显示循环和 FPS\n\n要设置其余玩家动画，请遵循并重复你为闲置动画所做的相同步骤。我们的下一个任务将是通过为其分配碰撞盒来确保玩家可以与物体发生碰撞。\n\
  \n> 重要提示\n> \n> 你可能注意到玩家在场景中看起来模糊。这是因为默认纹理过滤器。点击 Project | Project Settings | Rendering\
  \ | Textures 并将 Default Texture Filter 改为 Nearest。这是对像素艺术的最佳设置。\n\n## 检测碰撞\n\n检测游戏中物体何时何地发生碰撞，以及识别涉及的物体，是游戏开发的关键方面。在\
  \ Godot 中，我们通过将每个物体分配给 CollisionShape2D 节点来处理此问题。该节点允许我们定义和调整围绕物体的形状，确保准确的碰撞检测。\n\
  \n以下是为 CollisionShape2D 节点分配的步骤：\n\n- 1. 将 CollisionShape2D 节点作为 Player 的子节点添加。\n\
  - 2. 在 Inspector 中为 Shape 属性选择 RectangleShape2D 并调整其大小以适应你的玩家。这个矩形构成了玩家碰撞的边界框，如图\
  \ 6.18 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_166_0.png)\n\nFigure 6.18\
  \ – 将 RectangleShape2D 分配给 CollisionShape2D 节点以及 resulting 边界框\n\n如图所示 Figure 6.18，任何进入矩形碰撞形状的东西都会注册一次碰撞。游戏过程中形状不可见。\n\
  \n- 3. 将 **Player** 场景保存为 player.tscn，然后从 **FileSystem** 将文件拖放到 **Level1** 场景中。\n\
  \n你现在在关卡中拥有一个玩家！然而，如果你玩游戏，玩家是静止的，因为还没有实现移动。我们稍后会实现这一点。\n\n## TileMap 碰撞\n\n如前所述，我们当前的关卡只是一幅画；没有任何图块具有碰撞检测，我们的玩家无法移动。为了在图块上设置碰撞，我们需要在物理层中添加一个元素。为此，请按照以下步骤操作：\n\
  \n- 1. 在 **Inspector** 中选择 **TileMapLayer** 节点并点击 **Tile Set**。\n- 2. 在 **Physics\
  \ Layers** 属性中，点击 **Add Element**。这在图 6.19 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_167_0.png)\n\
  \nFigure 6.19 - 向 TileSet 的 Physics Layers 添加元素\n\n一旦你如图所示 Figure 6.19 向 TileSet\
  \ 的 **Physics Layers** 添加了一个元素，你的 TileSet 将在 **Physics Layers – Collision Layer**\
  \ 和 **Collision Mask** 中拥有两个新属性。这在图 6.20 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_168_0.png)\n\
  \nFigure 6.20 – TileSet 的 Collision Layer 和 Collision Mask\n\n如图所示 Figure 6.20，Godot\
  \ 4 中碰撞层和掩码的概念在管理游戏世界中不同元素之间的碰撞和交互方面发挥着至关重要的作用。了解如何使用层和掩码对于创建复杂且交互式的游戏环境至关重要。这些将在下一节中更详细地解释。\n\
  \n请确保你已添加两个 **Physics Layers** 元素，因为一组用于地面图块，另一组将用于穿透图块。\n\n## 碰撞层和碰撞掩码\n\n碰撞层是物体所属的类别或组，决定了它可以与哪些其他物体交互。通过将物体分配给特定的\
  \ **Collision Layer**，我们将其置于一个定义其潜在交互的组中。例如，如果物体 X 被分配到第 1 层，它就被视为第 1 层的部分。然后可以根据它们自己的碰撞设置设置其他物体以检测并响应该层中的物体。\n\
  \n碰撞掩码另一方面定义了物体可以检测和交互的层。例如，如果物体 X 在第 1 层但 **Collision Mask** 设置为第 2 层，物体 X 仅会与位于第\
  \ 2 层的物体发生碰撞。层与掩码之间的这种分离使我们能够控制哪些物体交互，从而轻松确保例如敌人只与玩家碰撞而不是彼此碰撞。\n\n在图 6.20 中，Collision\
  \ Layer 1 已开启，且 Collision Mask 1 已开启。这意味着第 1 层的物体将与掩码 1 上的物体发生碰撞。这不是很有用，因为这意味着物体将与自身发生碰撞（这是不可能的），所以我们很快会更改它。\n\
  \n跟踪哪些数字与哪些数字发生碰撞可能非常困难，随着游戏变得更大更复杂则更加困难。因此建议你重命名你的层以表示它们上存在的内容。\n\n在我们的关卡中，大多数图块将作为玩家可以站立并与其碰撞的实体物体发挥作用。然而，为了使关卡更具动态性，一些图块将作为“跳跃穿过”或“穿透”平台发挥作用。这些允许玩家从下方跳起并落在平台上。如果玩家在平台上按下向下键，他们将落回下方的地面，增加游戏玩法的交互性。这在图\
  \ 6.21 中显示。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_169_0.png)\n\nFigure 6.21\
  \ – 一个可跳跃穿过的平台\n\n由于我们的一些图块需要是实体的，而一些需要是穿透的，我们将为 TileSet 的 Physics Layers 添加第二个元素，然后命名层以便我们能跟踪交互。方法是点击层号右侧的三个垂直点并点击\
  \ Edit Layer Names。我已将 Layer 1 命名为 player，Layer 2 命名为 ground，Layer 3 命名为 pass_through。这在图\
  \ 6.22 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_170_0.png)\n\nFigure 6.22\
  \ – 两组物理层和 Edit Layer Names 按钮\n\n如图所示 Figure 6.22，点击 Edit Layer Names 将允许你为每个层命名。你可以在图\
  \ 6.23 中看到我如何命名我的层：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_170_1.png)\n\nFigure\
  \ 6.23 – 为碰撞层命名\n\n如果你查看图 6.22，在第一个物理层中，Collision Layer 2（ground）已开启且 Collision\
  \ Mask 1（player）已开启。这意味着地面将与玩家发生碰撞。\n\n在第二个物理层中，Collision Layer 3（pass_through）已开启，且\
  \ Collision Mask 1 已开启。这意味着穿透将与玩家发生碰撞。\n\n我们还必须记住在 Player 节点中打开相应的层，如图 6.24 所示。这样玩家才会查找地面和\
  \ pass_through 层的碰撞；否则，他们会穿过关卡。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_171_0.png)\n\
  \nFigure 6.24 – 在 Player 中设置碰撞层\n\n在图 6.24 中，我们在 Player 节点中，已打开 Collision Layer\
  \ 1（player）并打开 Collision Mask 2（ground）和 Collision Mask 3（pass_through）。这意味着我们在相反方向启用了碰撞，因此玩家现在将与地面和穿透发生碰撞。\n\
  \n使我们的关卡具有交互性的最后一步是将在 TileSet 中将图块绘制为碰撞图块。\n\n## 绘制图块\n\n要将 TileSet 中的图块绘制为碰撞图块，请按照以下步骤操作：\n\
  \n- 1. 首先，我们需要选择我们的 TileMapLayer 节点，打开屏幕底部的 TileSet，然后点击 Paint。\n- 2. 在 Paint Properties\
  \ 中，选择 Physics Layer 0。这是地面层。现在，涂抹所有你想要作为地面图块的图块。我选择将最右边的图块保留为 pass_through 图块并且没有将它们绘制为碰撞体。这在图\
  \ 6.25 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_172_0.png)\n\nFigure 6.25\
  \ – 地面图块已着色 – 请注意保留用于穿透的未着色图块\n\n快速提示：需要查看此图像的高分辨率版本吗？在 next-gen Packt Reader 中打开本书或在\
  \ PDF/ePub 副本中查看。\n\nnext-gen Packt Reader 和本书的免费 PDF/ePub 副本已包含在你的购买中。扫描二维码或访问\
  \ packtpub.com/unlock，然后使用搜索栏按名称查找本书。仔细检查所示的版本以确保你获得正确的版本。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_172_1.png)\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_172_2.png)\n\n\n\n3. 现在切换到物理层 1。这是 pass_through\
  \ 瓷砖的图层。现在我们将绘制已保存的瓷砖。你可以为每个单独的瓷砖调整碰撞多边形。确保你也将 polygon_0_one_way 设置为已勾选。这样玩家就可以从下方跳过该瓷砖。现在用此画刷绘制所有\
  \ pass_through 瓷砖。这在图 6.26 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_173_0.png)\n\
  \n图 6.26 – 调整碰撞多边形、单向碰撞以及绘制穿透瓷砖\n\n4. 调整瓷砖如 图 6.25 和 图 6.26 所示后，你可以运行并测试游戏。虽然玩家可以与瓷砖发生碰撞，但没有作用于玩家的力（如重力），并且它不会响应输入——你基本上会被卡在放置的位置。\n\
  \n在下一节中，我们将着手为玩家编写脚本，以控制移动、动画和交互，并施加诸如重力之类的力。\n\n## 为玩家脚本添加 CharacterBody2D 模板\n\
  \nGodot 提供了用于基本玩家移动的预写代码模板。这让我们不必重新发明轮子，并能更快地制作游戏。\n\n在 Player 场景中，选择你的 Player 节点并点击如图\
  \ 6.27 所示的附加新脚本图标：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_174_0.png)\n\n图 6.27\
  \ – 附加新脚本按钮\n\n如图 6.27 所见，你可以通过选择节点并点击附加新脚本按钮，将脚本附加到 Godot 中的任何节点来自定义其行为。点击按钮后，你将看到创建脚本的一些选项，如图\
  \ 6.28 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_174_1.png)\n\n图 6.28 – 请注意正在使用的基本移动模板\n\
  \n如图 6.28 所示，脚本将使用模板创建，这意味着将有用于基本移动和重力的预生成代码。脚本如下：\n\n```\nextends CharacterBody2D\n\
  const SPEED = 300.0\nconst JUMP_VELOCITY = -400.0\n\nfunc _physics_process(delta):\n\
  \    # Add the gravity\n    if not is_on_floor():\n        velocity += get_gravity()\
  \ * delta\n\n    # Handle jump\n    if Input.is_action_just_pressed(\"ui_accept\"\
  ) and is_on_floor():\n        velocity.y = JUMP_VELOCITY\n\n    # Get the movement\
  \ direction and handle deceleration\n    var direction = Input.get_axis(\"ui_left\"\
  , \"ui_right\")\n    if direction:\n        velocity.x = direction * SPEED\n   \
  \ else:\n        velocity.x = move_toward(velocity.x, 0, SPEED)\n\n    move_and_slide()\n\
  ```\n\n\U0001F4A1 **快速提示：** 使用 AI 代码解释器和快速复制功能提升你的编码体验。在 next-gen Packt Reader 中打开本书。点击\
  \ **Copy** 按钮 (1) 即可快速将代码复制到你的编码环境，或点击 **Explain** 按钮 (2) 让 AI 助手为你解释一段代码。\n\n```\n\
  function calculate(a, b) {\n    return {sum: a + b};\n};\n```\n\n\U0001F512 **The\
  \ next-gen Packt Reader** 随本书购买免费提供。扫描二维码或访问 packtpub.com/unlock，然后使用搜索栏按名称查找本书。仔细核对所示的版本，以确保获取正确的版本。\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_175_0.png)\n\n![](img/d34207e07c133a9e84d9caf1d479006c_175_1.png)\n\
  \n为了使我们的项目更易于管理并赋予其更多结构，我们将把大量代码移入新函数。在此之前，我们应该逐行理解代码：\n\n- `extends CharacterBody2D`：此行告诉\
  \ Godot 该脚本正在扩展（或使用）名为 **CharacterBody2D** 的内置节点的功 能。该节点专门为 2D 移动角色（如玩家）设计。\n- `const\
  \ SPEED = 300.0` 和 `const JUMP_VELOCITY = -400.0`：这两行定义了 **常量**。常量是在游戏过程中不会改变的值。\n\
  - `SPEED`：这控制角色左右移动的速度。\n- `JUMP_VELOCITY`：这定义了角色跳跃的速度和高度。负值意味着角色跳跃时会向上移动。\n- `func\
  \ _physics_process(delta)`：此函数在游戏处理物理时每次都会被调用，并固定为每秒 60 帧。`delta` 参数表示自上一帧以来经过的时间，确保移动流畅。\n\
  - 接下来，让我们查看以下代码块：\n\n```gdscript\n#### Add the gravity\nif not is_on_floor():\n\
  \    velocity += get_gravity() * delta\n```\n\n此代码块在角色未在地面上（在空中）时为其添加重力：\n\n- `is_on_floor()`\
  \ 检查角色是否接触地面。\n- `get_gravity()` 获取当前重力值，并乘以 delta，确保重力以一致的速率影响角色。\n- `velocity`\
  \ 变量是一个内置变量，表示角色在 x（水平）和 y（垂直）方向上的移动速度。添加重力值会影响 y 速度（使角色下落）。\n\n让我们查看下一个代码块：\n\n\
  ```gdscript\n#Handle jump\nif Input.is_action_just_pressed(\"ui_accept\") and is_on_floor():\n\
  \    velocity.y = JUMP_VELOCITY\n```\n\n此代码块处理跳跃。解释如下：\n\n- Input.is_action_just_pressed(\"\
  ui_accept\") 检查玩家是否按下了跳跃按钮（默认映射到 \"ui_accept\"）。这是 *空格键*。\n- is_on_floor() 确保玩家只有在站在地面上时才能跳跃。\n\
  - 当两个条件都为真时，角色的 y 速度被设置为 JUMP_VELOCITY，使其向上跳跃。\n\n现在，我们继续下一个代码块：\n\n```\n#Get the\
  \ movement direction and handle deceleration\nvar direction = Input.get_axis(\"\
  ui_left\", \"ui_right\")\n```\n\n此行获取玩家左右移动的输入：\n\n- Input.get_axis(\"ui_left\"\
  ,\"ui_right\") 如果玩家按住 *左* 键则返回 -1，如果按住 *右* 键则返回 +1，如果两者都不按则返回 0。\n\n继续下一个代码块：\n\n\
  ```\nif direction:\n    velocity.x = direction * SPEED\nelse:\n    velocity.x =\
  \ move_toward(velocity.x, 0, SPEED)\n```\n\n如果有输入（玩家按下 *左* 或 *右* 键），角色的 x 轴速度将被设置为以\
  \ SPEED 定义的速度向该方向移动。\n\n如果没有输入，角色将使用 move_toward() 逐渐减速，使 x 速度平滑接近 0，模拟减速。\n\n-\
  \ move_and_slide()：这根据速度移动角色。它还处理沿表面（如地面或墙壁）滑动，使移动流畅。\n\n现在我们理解了基本移动代码的工作原理，是时候专注于改进其结构了。编写干净、有组织的代码对于使我们的项目更易于阅读、维护并在复杂性增长时扩展至关重要。为此，我们将通过将其分解为单独的函数来重构移动代码，这将增强可读性和可重用性。\n\
  \n## 清理代码\n\n将代码拆分为 *独立函数* 是 **整洁代码** 概念的一部分，有助于在项目增长时保持组织性和清晰度。通过这种方式构建代码，使其更易于阅读、测试和调试。每个函数专注于特定任务，减少冗余，使在出现问题时更容易发现和修复。此方法还使项目更具可扩展性，因为在不使核心代码混乱的情况下添加新功能或更改变得更顺畅。\n\
  \n添加重力、处理跳跃和获取方向都可以放在各自的函数中。将你的代码更改为与以下代码块中显示的内容相匹配：\n\n```gdscript\nextends CharacterBody2D\n\
  \n#### Constants for how fast the player moves and how high they can jump\nconst\
  \ SPEED = 300.0\nconst JUMP_VELOCITY = -400.0\n\n#### This function runs every physics\
  \ frame (ideal for movement and collision)\nfunc _physics_process(delta):\n    #\
  \ Apply gravity if the player is not on the floor\n    apply_gravity(delta)\n  \
  \  # Check for jump input and apply jump force\n    handle_jump()\n    # Handle\
  \ left/right movement input\n    handle_movement(delta)\n    # Move the character\
  \ and handle collisions with the environment\n    move_and_slide()\n\n#### This\
  \ function adds gravity to the player's velocity\nfunc apply_gravity(delta):\n \
  \   # Only apply gravity if the player is in the air\n    if not is_on_floor():\n\
  \        velocity += get_gravity() * delta\n\n#### This function makes the player\
  \ jump when the jump key is pressed\nfunc handle_jump():\n```\n\n\n\n```\n#### Only\
  \ allow jumping if the player is currently on the ground\nif Input.is_action_just_pressed(\"\
  ui_accept\") and is_on_floor():\n    velocity.y = JUMP_VELOCITY\n\n#### This function\
  \ handles horizontal movement input\nfunc handle_movement(delta):\n    # Get the\
  \ left/right movement input as a value between -1 and 1\n    var direction = Input.get_axis(\"\
  ui_left\", \"ui_right\")\n\n    # If there is movement input, update the velocity\
  \ in that direction\n    if direction:\n        velocity.x = direction * SPEED\n\
  \    else:\n        # If no input, gradually slow the player down to a stop\n  \
  \      velocity.x = move_toward(velocity.x, 0, SPEED)\n```\n\n代码的功能与之前相同，但现在特定的操作位于各自的函数中，因此更容易查找错误并进行改进。\n\
  \n代码现在变得整洁，并被拆分为更小、更易维护的部分。在下一章中，我们将进一步自定义玩家的行为并播放动画。我们还将添加可收集物品、敌人和用于完成关卡的检查点。\n\
  \n## 摘要\n\n在本章中，我们介绍了在 Godot 中构建第一个 2D 平台游戏关卡的基本步骤。我们首先在 TileMapLayer 节点中设置了带有碰撞层的\
  \ TileSet，并使用 TileMap 系统绘制关卡。之后，我们创建了玩家角色，导入了不同动画所需的动画精灵帧。在角色就位后，我们使用 Godot 的 CharacterBody2D\
  \ 模板实现了一个默认脚本。最后，我们花时间通过将其拆分为单独的函数来清理和组织代码，这是遵循整洁代码原则的关键部分。\n\n在下一章中，我们将为玩家制作动画并编码特殊能力，例如双跳和贴墙滑行。我们还将设置可收集物品、需要击败的敌人以及用于完成关卡的检查点。\n\
