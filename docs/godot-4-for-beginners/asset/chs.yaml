  \n安装过程很简单，引擎可在 Windows、macOS 和 Linux 上使用。请务必按照操作系统的说明进行操作，安装完成后，使用第1章熟悉界面。通过使用本书中探索的相同工具和环境，你将获得最佳学习体验，并能顺利跟随代码示例。\n\
  \n如果你使用的是本书的数字版，我们建议你自己输入代码或从本书的 GitHub 仓库访问代码（链接在下一节提供）。这样做有助于避免因复制和粘贴代码而产生的潜在错误。\n\
