  \n![](img/d34207e07c133a9e84d9caf1d479006c_271_0.png)\n\n## 10\n\n## 添加游戏果汁\n\n\
  游戏开发不仅仅关乎机制和关卡设计——它还关乎游戏玩起来的手感。这就是游戏果汁发挥作用的地方。*Game juice* 指的是所有让游戏更令人满意和更具响应性的小改进，从视觉效果和音效设计到\
  \ UI 反馈和动画。添加游戏果汁可以将一个基础游戏转变为玩家喜爱的精致、引人入胜的体验。\n\n在本章中，我们将探讨游戏果汁是什么以及为什么它很重要。你将学习如何通过添加为玩家提供反馈的动态效果，使游戏感觉更精致和更具响应性。我们将实现几个果汁元素来增强体验：玩家到达检查点时爆发的彩带炮、基于\
  \ **抬头显示 (HUD)** 的生命条，随着生命值下降爱心会变灰，以及让关卡栩栩如生的沉浸式背景音频和音效。\n\n在本章中，我们将涵盖以下主要主题：\n\n\
  - 了解游戏果汁\n- 实现生命条 HUD\n- 添加受击动画\n- 创建彩带炮效果\n- 添加音频和音效\n\n到本章结束时，你将理解小的改动如何显著改善游戏的手感。你将拥有实践经验，实现增强玩家沉浸感的视觉和音频反馈，使游戏更愉快、更令人满意。\n\
  \n让我们开始为你的游戏增添应有的额外润色吧！\n\n## 技术要求\n\n到书中此时，你应该知道如何执行以下操作：\n\n- 创建节点和场景（参见 *第 2\
  \ 章*）\n- 从 *第 7 章* 开始完成 Pixel Adventure 项目\n\n你还应该了解变量和函数（参见 *第 8 章*），用于 GDScript。\n\
  \n本章的代码文件可在本书的 GitHub 仓库中获取：https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch10\n\
  \n访问此链接查看代码运行的视频：https://packt.link/W1K5s\n\n## 了解游戏果汁\n\n当游戏玩起来感觉良好时，我们现在知道这通常要归功于一种叫做\
  \ **game juice** 的东西。它指的是微小但影响重大的改进——例如细微的动画、粒子效果或音效设计——使游戏玩法更具响应性、更令人满意且更精致。\n\n\
  果汁不会改变游戏的机制，但它改变了玩家体验它们的方式。因此，为游戏添加 *juice* 涉及取一个可工作的游戏并添加满意度层来改善其手感。对玩家来说，满足感是由感官创造的，因此我们需要喂养这些感官。创建视觉效果和添加音频将增强玩家的体验。你可以想象这就像你正在从一个美味的橙子中挤出每一滴果汁。\n\
  \n使用游戏果汁改善玩家体验的一些例子如下：\n\n- 标准跳跃配合 *squash and stretch* 动画会感觉更有冲击力\n- 收集硬币配合 *闪光效果和令人满意的音效*\
  \ 会感觉更有奖励感\n- 在战斗中受损配合 *屏幕震动和短暂的冲击停顿* 会更具吸引力\n\n在下一节中，我们将探讨润色的基础方面。\n\n## 润色的基础：动画和音频\n\
  \n本节将介绍润色的基础技术，我们很快将在实践中应用它们，例如受击动画、生命条 HUD、彩带炮和音频反馈。这些基础在 3D 中与在 2D 中一样有用，无论类型或视角如何，都能提升你的游戏。\n\
  \n## 视觉反馈（动画和粒子效果）\n\n视觉反馈在使动作感觉有冲击力方面发挥关键作用。游戏果汁中常用的两种技术如下：\n\n- **Squash and stretch**：当角色着陆、跳跃或改变方向时稍微变形其缩放，使其呈现出弹跳、生动的视觉外观。这种动画技术使移动感觉更具表现力。\n\
  - **粒子效果**：在玩家奔跑或跳跃时添加尘埃轨迹，使移动更具动态感和真实感。即使是少量粒子爆发也能清晰地传达能量和运动。\n\n你很快将在自己的游戏中实现这些想法，包括以下内容：\n\
  \n- *受击动画*，使敌人对玩家攻击做出视觉反应\n- *彩带炮*，用粒子爆炸庆祝成功\n\n## 音频反馈（音乐和音效）\n\n音频在创造果汁体验方面与视觉一样重要。它强化玩家动作，增加个性并营造氛围。请考虑以下内容：\n\
  \n- **音效**：着陆时令人满意的挤压声或击中敌人时的脆响可以让场景栩栩如生\n- **背景音乐**：一首精心挑选的曲目可以设定关卡的情感基调，引导玩家在探索时的感受\n\
  \n我们将在本章后面探讨如何实现环境音乐和角色音效。\n\n## 实现生命条 HUD\n\n游戏中常见的用户界面（UI）元素是作为 HUD 一部分的生命条，它直观地表示玩家的生命值。其目的是提供即时反馈，说明玩家受到的伤害程度以及距离死亡有多近。\n\
  \n图 10.1 显示了三种向用户展示生命值的方式：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_276_0.png)\n\
  \n图 10.1 – 游戏中显示生命值的三种不同方式\n\n在后续章节中，我们将实现基于爱心的生命系统，其中每个爱心代表玩家生命值的一部分，随着受到伤害爱心会变灰。这种方法使信息一目了然，同时为\
  \ UI 增添了一点视觉吸引力。\n\n## 开发基于爱心的生命系统\n\n为了实现我们的基于爱心的生命系统，我们将设置 UI，编写根据玩家生命值更新爱心的逻辑，并确保系统在造成伤害时动态反应。让我们逐步了解将其实现的过程。\n\
  \n让我们首先打开 Pixel Adventure Godot 项目，并添加一个以 AnimatedSprite2D 节点作为根节点的新场景。将节点重命名为 HUD\
  \ 并将场景保存为 hud.tscn，如图 10.2 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_276_1.png)\n\
  \n图 10.2 – 表示玩家生命的 HUD 场景\n\n我们将使用一种简单技术来表示生命值的损失。生命条将以三个完整的红色爱心开始。每次玩家受伤时，我们将把其中一个爱心从红色改为灰色。\n\
  \n你可以使用免费的开源图像编辑软件，例如 LibreSprite (https://libresprite.github.io/#!)，来绘制自己的爱心并创建四个代表生命值变化的帧，如我在图\
  \ 10.3 中所做的那样：\n\n\n\n图 10.3 – 表示玩家生命值变化的心形帧\n\n![](img/d34207e07c133a9e84d9caf1d479006c_277_0.png)\n\
  \n图 10.3 – 表示玩家生命值变化的心形帧\n\n## 资源\n\n如果你不习惯自己绘制爱心，可以使用 Shlok Gupta 创建的爱心。然而，你仍需要对其进行修改，以便在不同生命值水平下显示爱心。它可在他们的\
  \ Itch 页面在此处获取：https://gamedevshlok.itch.io/heartpack.\n\n当你的爱心图像准备就绪后，转到名为 HUD\
  \ 的 AnimatedSprite2D 节点的 Sprite Frames 属性，并选择 New SpriteFrames，如图 10.4 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_277_1.png)\n\
  \n图 10.4 – AnimatedSprite2D 节点的 New SpriteFrames\n\n现在，单击属性中的单词 SpriteFrames 以打开\
  \ Animation Frames 窗口。将默认动画重命名为 idle 并添加四个帧，如图 10.5 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_278_0.png)\n\
  \n图 10.5 – 生命条的 idle 动画有四个帧表示生命值总数\n\n如图 10.5 所示，每当玩家失去生命值时，我们将更改动画帧以匹配。我们不需要为生命条添加脚本；我们只需要在附加到\
  \ level1.tscn 的脚本中引用它即可。\n\n在 Level1 场景中，将你新建的 hud.tscn 拖入你的关卡并将其放置在左上角，如图 10.6\
  \ 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_278_1.png)\n\n图 10.6 – HUD 的一个好位置\n\
  \n将 HUD 放置到场景中后，你的 Level1 场景树应包含 HUD 场景，并看起来像图 10.7 所示的场景层次结构：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_279_0.png)\n\
  \n图 10.7 – level 1 的场景层次结构\n\n如图 10.7 所示场景就位后，是时候打开附加到 Level1 的脚本并进行一些添加，以便 HUD\
  \ 根据玩家拥有的生命值更新爱心。\n\n## 在 Level 脚本中更新 HUD\n\n现在我们的基于爱心的生命系统已经就位，我们需要确保玩家的当前生命值在屏幕上得到反映。为此，我们将从\
  \ Level 脚本更新 HUD。HUD 将根据玩家剩余的爱心数量在视觉上发生变化，随着受到伤害，爱心会变灰。\n\n我们将首先添加一个 @onready 变量来引用\
  \ HUD 场景。在 _process() 函数中，我们将更新 HUD 的 frame 属性以匹配玩家的当前生命值。这决定了显示为活动（红色）与非活动（灰色）的爱心数量。例如，如果玩家有三个爱心，我们将把\
  \ HUD 帧设置为 3 以显示三个红色爱心。\n\n以下是更新后的 Level1 脚本：\n\n```gdscript\nextends Node2D\n\n\
  @onready var update_health_hud = $HUD\n@onready var player = $Player\n@onready var\
  \ strawberries = $Collectibles\n\nfunc _ready():\n    player.level_strawberries\
  \ = strawberries.get_child_count()\n\nfunc _process(delta):\n    update_health_hud.frame\
  \ = player.get_hearts()\n```\n\n让我们分解代码以更好地理解它：\n\n- update_hud 存储对 HUD 节点的引用，以便我们可以轻松访问和更新它。\n\
  - 在 _process() 中，每帧运行一次，我们将 HUD 的帧设置为反映玩家的当前爱心数量。这意味着当玩家获得或失去生命值时，HUD 将实时视觉更新。\n\
  \nplayer.get_hearts() 行依赖于我们需要在 Player 脚本内部创建的新函数。该函数仅返回玩家当前拥有的爱心数量：\n\n```gdscript\n\
  func get_hearts():\n    return hearts\n```\n\n为此支持，在 Player 脚本顶部添加一个新变量来存储玩家的生命值：\n\
  \n```gdscript\nvar hearts = 3\n```\n\n问题是：我们为什么要添加这个变量？\n\nhearts 变量跟踪玩家拥有的生命值。我们将其初始化为\
  \ 3，意味着玩家以满生命值开始。随着玩家受到伤害，此值会减少。\n\n接下来，让我们创建一个 hurt() 函数，在玩家受伤时减少其生命值：\n\n```gdscript\n\
  func hurt():\n    hearts -= 1\n    if hearts <= 0:\n        death()\n```\n\n此函数在玩家受伤时减去一个爱心。如果\
  \ hearts 达到 0，我们将触发 death() 函数，我们现在将在以下代码中创建它：\n\n```gdscript\nfunc death():\n \
  \   #shoot the player upward upon death\n    velocity.y = -600\n```\n\n```gdscript\n\
  #disable collisions so the player falls through the level\nset_collision_mask_value(2,\
  \ false)\nset_collision_mask_value(3, false)\n```\n\n以下是前面代码的分解：\n\n- velocity.y\
  \ = -600 在玩家死亡时将其向上射出，增加一点手感使死亡感觉更戏剧化\n- 我们通过关闭关卡的碰撞层来禁用与环境的碰撞，允许玩家从屏幕上掉落\n\n另一个提供出色视觉反馈给玩家的游戏手感——帮助他们快速识别何时受到伤害——是受击闪烁效果。这种常见技术会短暂改变玩家的外观（通常为白色或红色），以示其已受伤，使体验感觉更灵敏和精致。\n\
  \n## 添加受击动画\n\n在本节中，我们将创建一个简单的动画，当玩家受伤时使其短暂变白。这种效果不仅使受损时刻更具戏剧性，还帮助玩家保持对当前生命状态的了解，尤其是在快节奏的时刻。\n\
  \n在你的文件资源管理器中，定位 Pixel Adventure/Main Characters/Ninja Frog 文件夹（你可以在此处下载所有资源：https://pixelfrog-assets.itch.io/）并将\
  \ Hit.png 文件拖入 Godot FileSystem。\n\n在 Player 场景中，选择 AnimatedSprite2D 节点并添加一个名为 hit\
  \ 的新动画。现在，单击 Add Frames from Sprite Sheet 按钮并将其设置为 7 个水平帧和 1 个垂直帧。然后，选择所有帧并导入它们。将动画速度设置为\
  \ 16 FPS 且不循环。受击动画将如 图 10.8 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_281_0.png)\n\
  \n\U0001F50D **快速提示**：需要查看此图像的高分辨率版本吗？在 next-gen Packt Reader 中打开本书或在 PDF/ePub 副本中查看。\n\
  \n\U0001F512 **下一代 Packt Reader** 和一本 **免费的 PDF/ePub 副本** 包含在你的购买中。扫描二维码或访问 packtpub.com/unlock，然后使用搜索栏按名称查找本书。仔细检查所示的版本，以确保你获得正确的版本。\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_282_0.png)\n\n![](img/d34207e07c133a9e84d9caf1d479006c_282_1.png)\n\
  \n为确保我们的动画在需要时运行，在 Player 脚本顶部 vars 组的变量中添加一个名为 isHit 的辅助变量。它将是一个布尔值，默认为 false：\n\
  \n```gdscript\nvar isHit = false\n```\n\n现在，修改 hurt() 函数，以便在玩家受到伤害时将 isHit 设置为 true：\n\
  \n```gdscript\nfunc hurt():\n    isHit = true\n    hearts -= 1\n    if hearts <=\
  \ 0:\n        death()\n```\n\n现在，我们可以修改 animate() 函数以包含对玩家拥有的爱心数量的检查，以及是否已被击中：\n\
  \n```gdscript\nfunc animate():\n    if isHit:\n        animations.play(\"hit\")\n\
  \        await animations.animation_finished\n        animations.play(\"idle\")\
  \ # transition back to idle\n        return # Prevent further changes this frame\n\
  \    if hearts == 0:\n        return  # Dead, don't animate further\n\n    # Stationary\
  \ player\n    if velocity.x == 0 and velocity.y == 0:\n        animations.play(\"\
  idle\")\n\n    # Player moving right\n    elif velocity.x >= 0 and velocity.y ==\
  \ 0:\n        animations.play(\"run\")\n        animations.flip_h = false\n\n  \
  \  # Player moving left\n    elif velocity.x <= 0 and velocity.y == 0:\n       \
  \ animations.play(\"run\")\n        animations.flip_h = true\n\n    # Player is\
  \ falling\n    elif velocity.y > 0 and !is_wall_sliding:\n        animations.play(\"\
  fall\")\n\n    # Player is jumping (initial jump)\n    elif velocity.y < 0 and jump_count\
  \ == 0:\n        animations.play(\"jump\")\n\n    # Player is double-jumping\n \
  \   elif !is_on_floor() and jump_count > 0 and !is_wall_sliding:\n        animations.play(\"\
  double_jump\")\n\n    # Player is wall sliding on the right\n    elif is_wall_sliding\
  \ and Input.is_action_pressed(\"ui_right\"):\n        animations.flip_h = false\n\
  \        animations.play(\"wall_slide\")\n\n    # Player is wall sliding on the\
  \ left\n    elif is_wall_sliding and Input.is_action_pressed(\"ui_left\"):\n   \
  \     animations.flip_h = true\n        animations.play(\"wall_slide\")\n```\n\n\
  \n\nanimate() 函数负责根据玩家的移动、生命值以及是否被击中在不同的动画状态之间切换。让我们逐一查看每个条件以了解其工作原理。\n\n首先，让我们来看一下空闲状态的代码：\n\
  \n```\nif velocity.x == 0 && velocity.y == 0 && hearts > 0 && isHit == false:\n\
  \    animations.play(\"idle\")\n```\n\n如果玩家没有移动（velocity.x == 0 且 velocity.y ==\
  \ 0）、仍然存活（hearts > 0），并且刚刚没有被击中（isHit == false），我们播放 \"idle\" 动画。\n\n接下来，让我们检查受击状态：\n\
  \n```\nelif isHit:\n    animations.play(\"hit\")\n```\n\n如果玩家被击中，我们播放 \"hit\" 动画以显示反应。这通常会短暂播放，然后恢复到其他动画。\n\
  \n这就是我们检测向右奔跑的方式：\n\n```\nelif velocity.x >= 0 && velocity.y == 0 && hearts > 0:\n\
  \    animations.play(\"run\")\n    animations.flip_h = false\n```\n\n如果玩家水平向右移动（x\
  \ 速度为正）、垂直方向没有移动，并且仍然存活，我们播放 \"run\" 动画并确保精灵面向右侧（flip_h = false）。\n\n向左奔跑的代码类似：\n\
  \n```\nelif velocity.x <= 0 && velocity.y == 0 && hearts > 0:\n    animations.play(\"\
  run\")\n    animations.flip_h = true\n```\n\n这与之前的条件相同，但用于向左移动。我们水平翻转精灵（flip_h =\
  \ true）使其面向左侧。\n\n以下是坠落的处理方式：\n\n```\nelif velocity.y > 0 and !is_wall_sliding &&\
  \ hearts > 0:\n    animations.play(\"fall\")\n```\n\n如果玩家向下移动（velocity.y > 0）、没有在墙上滑动，并且仍然存活，我们显示\
  \ \"fall\" 动画。\n\n跳跃逻辑如下：\n\n```\nelif velocity.y < 0 and jump_count == 0 && hearts\
  \ > 0:\n    animations.play(\"jump\")\n```\n\n此条件检查玩家是否向上跳跃（velocity.y < 0）并且是第一次跳跃（jump_count\
  \ == 0），这会触发 \"jump\" 动画。\n\n以下是双跳的检查：\n\n```\nelif !is_on_floor() and jump_count\
  \ > 0 and !is_wall_sliding:\n    animations.play(\"double_jump\")\n```\n\n如果玩家在空中（不在地面上）、已使用至少一次跳跃，并且没有在墙上滑动，我们显示\
  \ \"double_jump\" 动画。\n\n这处理右侧墙壁滑动：\n\n```\nelif is_wall_sliding and Input.is_action_pressed(\"\
  ui_right\"):\n    animations.flip_h = false\n    animations.play(\"wall_slide\"\
  )\n```\n\n如果玩家在墙上滑动并且按住向右移动键，我们播放 \"wall_slide\" 动画并使精灵面向右侧。\n\n最后，这就是我们用于左侧墙壁滑动的内容：\n\
  \n```\nelif is_wall_sliding and Input.is_action_pressed(\"ui_left\"):\n    animations.flip_h\
  \ = true\n    animations.play(\"wall_slide\")\n```\n\n它与右侧墙壁滑动相同，但用于左侧。\n\n一切几乎按我们想要的方式工作。然而，你会注意到玩家卡在受击动画中，这是因为没有事件将\
  \ isHit 变量重置为 false。最后一步是返回到 Mushroom 场景，选择 HurtPlayerZone 节点，选择 Node 选项卡，然后选择 Signals\
  \ 选项卡，并连接 body_exited() 信号。按如下所示编写信号函数：\n\n```\nfunc _on_hurt_player_zone_body_exited(body:\
  \ Node2D):\n    if body.is_in_group(\"Player\"):\n        body.isHit = false\n```\n\
  \n为了保持一致，我们还应该从 Mushroom 脚本中调用 isHit 函数：\n\n```\nfunc _on_hurt_player_zone_body_entered(body):\n\
  \    if \"Player\" in body.name:\n        body.hurt()\n        body.isHit = true\n\
  ```\n\n前面的代码确保如果退出 HurtPlayerZone Area2D 节点的物体属于名为 \"Player\" 的组，则 hit 变量将被重置为 false。这意味着当玩家停止与蘑菇碰撞时，受击动画也会停止。\n\
  \n现在，一切就绪，可以在玩家游戏时提供令人满意的视觉反馈，以提醒他们处于危险之中。\n\n我们的下一步是为检查点旗帜添加一个有趣的视觉效果。我们将发射纸屑大炮，以小规模庆祝完成关卡。\n\
  \n## 创建纸屑大炮效果\n\n为了强化成就感并作为完成关卡的额外奖励，当玩家触碰检查点旗帜时，我们将从旗杆上发射一些多彩纸屑。这将以粒子效果的形式出现，我们将将其作为独立场景设置。让我们开始吧！\n\
  \n我们将首先创建一个以 Node2D 为根节点的新场景。将节点重命名为 Confetti_Cannon，添加一个 GPUParticles2D 节点作为子节点，并将其重命名为\
  \ Blue，因为它代表蓝色纸屑。如下图所示 10.9 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_286_0.png)\n\
  \n图 10.9 – Confetti_Cannon 节点和纸屑粒子\n\n现在，选择 Blue 纸屑粒子节点。在 Inspector 中，找到 Process\
  \ Material 设置，然后添加 New ParticleProcessMaterial，如图 10.10 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_287_0.png)\n\
  \n图 10.10 – 创建新的粒子过程材质\n\n接下来，点击 ParticleProcessMaterial（文字）以展开粒子的设置菜单。\n\n纸屑在飞行时应旋转，但不应远离玩家。在\
  \ Particle Flags 设置中启用 Rotate Y 并禁用 Z，如图 10.11 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_287_1.png)\n\
  \n图 10.11 – 粒子标志设置\n\n纸屑应沿弧线移动，以模仿现实中纸屑的行为。为此，调整纸屑生成的角度。你可以根据需要调整数值——我将最小角度设置为 209，最大角度设置为\
  \ 327，如图 10.12 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_288_0.png)\n\n图 10.12\
  \ – 设置纸屑的最小和最大生成角度\n\n确保将 Direction 变量设置为 x = 0.0、y = -1.0 和 z = 0.0，如图 10.13 所示。\n\
  \n纸屑粒子还应分散开来，而不是全部沿同一路径前进。为了在一定角度范围内分散它们，我选择了 Spread 值为 100，这将为每个新粒子选择介于 −100 到\
  \ 100 度之间的角度。\n\n此外，由于纸屑通常是爆炸性事件，我们希望改变粒子的 Initial Velocity 值。两个更改均显示在图 10.13 中：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_288_1.png)\n\n图 10.13 – 改变纸屑粒子的 Spread\
  \ 和 Initial Velocity 设置\n\n为了使效果更令人印象深刻，我们可以改变每个粒子在关卡中移动时的旋转速率。这可以通过改变 Angular Velocity\
  \ 值来实现。我已将速率锁定在 280，如图 10.14 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_289_0.png)\n\
  \n图 10.14 – 设置粒子的角速度可变速率\n\n纸屑还应以恒定速率从中心加速远离，我们可以轻松地在线性加速度设置（即 Linear Accel）中设置此项，如图\
  \ 10.15 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_289_1.png)\n\n图 10.15 –\
  \ 设置粒子的线性加速度\n\n为了防止纸屑离旗帜太远，我们应在 Accelerations 部分增加 Gravity，如图 10.16 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_289_2.png)\n\
  \n图 10.16 – 增加粒子在 y 方向的重力\n\n要控制纸屑粒子的外观，我们前往 **ParticlesProcessMaterial** 的 **Display**\
  \ 属性。现在，改变纸屑粒子的 **Scale** 值——我将最小尺寸设置为 5，最大尺寸设置为 20。对于 **Color**，我选择了 *天蓝色*。这些更改可在\
  \ *图 10.17* 中看到：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_290_0.png)\n\n*图 10.17\
  \ – 设置粒子的尺寸变化和颜色*\n\n下一步是控制这些粒子在屏幕上停留的时间以及它们在存活期间的行为。这些设置的 **Time** 属性中可以找到。默认生命周期为\
  \ 1 秒，这很好；然而，我们必须打开 **One Shot**，以便纸屑只发射一次且不会持续生成。你可以改变 **Explosiveness** 和 **Randomness**，或使用\
  \ *图 10.18* 中显示的值：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_290_1.png)\n\n*图\
  \ 10.18 – 调整粒子的 Time 属性*\n\n\n\n最后一步是前往 **Drawing** 属性并勾选使用 **Local Coords** 的复选框。这只是确保粒子遵循自身的路径，而不是它们可能附加到的任何父节点的路径。它使粒子保持在我们在场景中放置的位置。如图\
  \ 10.19 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_291_0.png)\n\n*图 10.19 –\
  \ 在 Drawing 属性中设置粒子使用局部坐标*\n\n要预览此彩纸粒子效果，将 **Inspector** 滚动到最顶部并打开 **Emitting**\
  \ 复选框。每次勾选时，你应该能在场景中看到蓝色彩纸粒子发射，如图 10.20 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_291_1.png)\n\
  \n*图 10.20 – 打开 Emitting 会发射粒子*\n\n我们现在有一个天蓝色彩纸粒子的场景，但彩纸炮应该向天空发射彩虹色的粒子。\n\n要实现这一点，请复制蓝色粒子，然后右键单击\
  \ ParticleProcessMaterial 并选择 Make Unique，然后在 Display 属性下更改颜色（我们已在图 10.17 中这样做）并重命名粒子节点以匹配。如图\
  \ 10.21 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_292_0.png)\n\n图 10.21 –\
  \ 彩纸炮场景树\n\n请注意，并非所有彩纸粒子都在发射。我们将在下一节中修复这个问题。\n\n## 脚本化彩纸炮\n\n为了确保所有彩纸粒子在正确的时间发射，我们将脚本附加到\
  \ Confetti_Cannon 节点并按如下方式定义 fire() 函数。\n\n```\nextends Node2D\n\nfunc fire():\n\
  \    $Blue.emitting = true\n    $Orange.emitting = true\n    $Green.emitting = true\n\
  \    $Yellow.emitting = true\n    $Red.emitting = true\n    $Pink.emitting = true\n\
  ```\n\n此 fire() 函数通过将它们的 emitting 属性设置为 true 一次性打开所有彩纸粒子发射器。每一行都针对不同的颜色粒子节点——Blue、Orange、Green、Yellow、Red\
  \ 和 Pink——并同时激活它们。当调用 fire() 函数时，这会产生庆祝性的彩色彩纸爆发效果。\n\n通过将所有发射器保留在 Confetti_Cannon\
  \ 节点内并通过此一个函数触发它们，我们保持代码井然有序，并使使用单个命令发射所有彩纸变得容易。\n\n请回忆，炮在玩家完成关卡并触碰检查点旗帜时发射彩纸作为小小的视觉奖励。因此，将炮附加到检查点是有意义的。我们可以在\
  \ Godot 中通过将 confetti_cannon.tscn 文件拖入 CheckPoint 场景的场景树中轻松实现这一点，如图 10.22 所示：\n\n\
  ![](img/d34207e07c133a9e84d9caf1d479006c_293_0.png)\n\n图 10.22 – 将彩纸炮添加到 CheckPoint\
  \ 场景\n\n一旦彩纸炮成为 CheckPoint 场景的一部分，我们需要在 check_point.gd 中添加一些代码，以便在关卡完成后调用 fire 方法。\n\
  \n在场景树中单击 **CheckPoint (Area2D)** 节点以选中它。现在，单击 **Node** 选项卡，然后单击 **Signals** 选项卡。连接\
  \ on_body_entered() 信号并按如下方式编写代码：\n\n```gdscript\nfunc _on_body_entered(body):\n\
  \    if level_complete:\n        $Confetti_Cannon.fire()\n```\n\n前面的代码在接收到 _on_body_entered()\
  \ 信号时被调用。这意味着玩家已与检查点旗帜发生碰撞。然后，如果 level_complete 布尔值设置为 true，则会调用彩纸炮的 fire() 方法。fire()\
  \ 方法随后将炮中所有彩纸的 emitting 属性设置为 true。\n\n现在一切就绪，当你完成关卡并触碰检查点旗帜时，你将获得一次令人愉悦的彩纸爆发作为奖励。\n\
  \n在最后一节中，我们将学习如何为关卡添加音效和音频，以增加另一层精致感和氛围。\n\n## 添加音频和音效\n\n声音是游戏开发中的强大工具，以视觉 alone\
  \ 无法实现的方式塑造玩家的体验。精心制作的原声带设定了氛围，无论是快节奏的动作序列还是平静的探索场景。[content]\n最后一步是前往 **Drawing**\
