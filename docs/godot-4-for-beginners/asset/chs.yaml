  \n在本章中，我们将涵盖以下主要主题：\n\n- 使用 TileMap 构建关卡\n- 创建和控制玩家\n- 为玩家脚本添加 CharacterBody2D 模板\n\
  - 清理代码\n\n到本章结束时，你将能够创建一个交互式、完全可玩的平台游戏关卡，并理解这些组件如何协同工作以构成许多平台游戏的基础。\n\n## 技术要求\n\
