- "# 第 1 部分\n\n## 学习 Godot 引擎的工作原理\n\n在本书的第一部分中，您将建立使用 Godot 游戏引擎的坚实基础。我们将首先探索 Godot\
  \ 的起源以及使其成为游戏开发独特而强大的工具的原因。然后，您将亲手操作引擎的界面，了解场景、节点和编辑器如何协同工作。您还将迈出进入 3D 游戏开发的第一步，并使用\
  \ GDScript 进行脚本编写，这是一种直观、类似 Python 的 Godot 语言。到本部分结束时，您将准备好自信地开始创建交互式游戏。\n\n本书的这一部分包含以下章节：\n\
  \n- *第 1 章，开始使用 Godot！*\n- *第 2 章，探索 Godot 引擎界面*\n- *第 3 章，3D 简介*\n- *第 4 章，使用 GDScript\
  \ 编程*\n\n## 1\n\n## 开始使用 Godot！\n\n在本章中，我们将探索 Godot 4.0 的历史和核心功能，这是一款以多功能性和易用性著称的游戏开发引擎。无论您是有抱负的独立开发者还是寻求新工具的资深创作者，了解\
  \ Godot 的独特性都将为您的游戏开发之旅奠定基础。\n\n本章有两个主要目的。首先是向您介绍 Godot 的背景和关键功能，展示其为何成为游戏开发社区中备受青睐的选择。其次是指导您设置\
  \ Godot 4.0 并创建第一个项目，确保您拥有开始制作自己的游戏所需的工具和信心。\n\n在本章中，我们将涵盖以下主要主题：\n\n- Godot 是什么？\n\
  - 设置 Godot 4\n- 创建新项目\n\n到本章结束时，您不仅将掌握使 Godot 脱颖而出的基本功能，还将具备在引擎中安装、启动和创建第一个项目的知识。这些是为我们在后续章节中完成的一切奠定基础的基本步骤。\n\
