  \n## 使场景动态化\n\n为此，我们需要将问题分解为更小的部分：\n\n- 1. 给标签一个初始速度（速度和方向）。\n- 2. 找出屏幕的尺寸。\n- 3.\
  \ 找出标签的大小。\n- 4. 测试标签是否已到达左侧或右侧边缘并反转方向。\n- 5. 测试标签是否已到达顶部或底部边缘并反转方向。\n- 6. 不断更新标签的位置使其移动。\n\
  \n速度变量同时控制移动的速度和方向。因为它是一个 Vector2，所以我们可以在一个容器中同时传递 x 和 y 值。\n\n在此示例中，我们将初始速度设置为沿\
  \ x 轴 150 像素/秒（向右，因为它是正值）以及沿 y 轴 120 像素/秒（向下，因为 Godot 的坐标系从左上角开始）。\n\n从程序的第二行开始添加以下行：\n\
  \n```\nvar xVelocity = 150 #150 pixels per second to the right\nvar yVelocity =\
  \ 120 #120 pixels per second downwards\nvar velocity = Vector2(xVelocity, yVelocity)\
  \  #Initial speed and direction\n```\n\n为了让标签移动，我们需要在每一帧中不断更新其位置。_process(delta)\
  \ 函数每帧运行一次，使其成为处理此类更新的理想位置。通过在 _process() 内部添加一行调整标签位置的代码，我们可以创建平滑、持续的移动。\n\n将以下代码作为\
  \ _process() 函数内部的第一行添加并运行游戏。你会看到标签沿对角线向下并向右移动！\n\n```\nposition = position + velocity\
  \ * delta\n```\n\n在前一行中，我们反复将当前位置加上 velocity 乘以 delta 的值。这里，delta 是自上一帧以来经过的时间，用来确保在所有硬件上移动都平滑且一致。\n\
  \n你现在已迈出了让文本移动的第一步——就像经典的 DVD 标志一样！\n\n在我们继续并使运动平滑且一致之前，了解一个控制 Godot 中事物随时间行为的关键概念非常重要：delta。\n\
  \n让我们花点时间探索 delta 是什么以及为什么它如此重要。\n\n## Delta\n\n当我们在游戏中让某物移动时，我们通常希望它以一致的速度移动——例如每秒\
  \ 150 像素。但棘手之处在于，并非所有计算机运行游戏的速度都相同。有些可能以每秒 60 帧运行，而其他则可能根据硬件运行得更慢或更快。\n\n这就是 delta\
  \ 发挥作用的地方。\n\ndelta 是一个小数字，告诉我们自上一帧绘制以来经过了多少时间。如果你的游戏运行很快，delta 可能是 0.016 左右（约 1/60\
  \ 秒）。如果运行较慢，delta 会稍大，例如 0.03。\n\n通过将移动速度乘以 delta，我们的意思是：\n\n> “根据实际经过的时间而不是经过的帧数来移动此对象。”\n\
  \n这意味着无论你的计算机能绘制多少帧，对象都会以正确的每秒速度移动。\n\n因此，与每帧移动 150 像素（这会太快！）不同，我们每帧移动 150 × delta\
  \ 像素，这会根据性能自动调整。\n\n## 继续弹跳标签项目\n\n回到我们的弹跳标签项目，下一步是设置有关屏幕和标签本身的一些重要信息。这将使我们能够检测到标签何时撞到边缘并需要反弹。\n\
  \n现在，我们应该添加变量来存储屏幕大小和标签的大小。重要的是要理解，我们在场景加载之前无法确定这些值。\n\n一旦场景准备就绪，第一个运行的函数是 _ready()\
  \ 函数。因此，我们应该在那里初始化（为其分配值）我们的变量。首先在顶部将变量添加到我们的集合中，然后在设置文本后，将它们作为 _ready() 函数中的第一行赋值：\n\
  \n```\nvar xVelocity = 150 #150 pixels per second to the right\nvar yVelocity =\
  \ 120 #120 pixels per second downwards\nvar velocity = Vector2(xVelocity, yVelocity)\
  \ # Initial speed and direction\nvar screen_size_x #screen horizontal dimension\n\
  var screen_size_y #screen vertical dimension\nvar label_size_x #label width\nvar\
  \ label_size_y #label height\n```\n\n现在，在 _ready() 函数中按如下方式为这些变量赋值：\n\n```\nfunc\
  \ _ready():\n    text = \"Go Go Godot!\"\n    # Get the screen size (viewport size)\n\
  \    screen_size_x = get_viewport_rect().size.x\n    screen_size_y = get_viewport_rect().size.y\n\
  \    label_size_x = size.x\n    label_size_y = size.y\n```\n\n现在剩下的就是测试标签是否已到达屏幕的左侧、右侧、顶部或底部边缘，如果已到达，则将其反转。\n\
  \n我们在设置方向后在 _process() 函数中执行此操作。首先进行左右屏幕边缘的测试，如下所示：\n\n```\n#### Bounce off left/right\
  \ edges\nif position.x < 0 or position.x + label_size_x > screen_size_x:\n    velocity.x\
  \ *= -1\n```\n\n此行检查标签是否已撞到屏幕的左侧或右侧边缘，如果是，则通过反转其水平方向使标签反弹。\n\n从技术上讲，我们的反弹是可行的，可以保留，但存在一些罕见的边缘情况，在其中标签可能在一帧内移动到屏幕边缘之外，方向反转，但我们已经超出边缘，因此标签可能会卡住或抖动。为防止这种情况，我们可以使用内置方法将值限制在最小值和最大值之间：\n\
  \n```\n#### Bounce off left/right edges\nif position.x < 0 or position.x + label_size_x\
  \ > screen_size_x:\n    velocity.x *= -1\n    position.x = clamp(position.x, 0,\
  \ screen_size_x - label_size_x)\n```\n\n顶部和底部边缘的检查类似：\n\n```\n#### Bounce off top/bottom\
  \ edges\nif position.y < 0 or position.y + label_size_y > screen_size_y:\n    velocity.y\
  \ *= -1\n    position.y = clamp(position.y, 0, screen_size_y - label_size_y)\n```\n\
  \n弹跳标签的完整代码如下所示：\n\n```\nextends Label\nvar xVelocity = 150 #150 pixels per second\
  \ to the right\nvar yVelocity = 120 #120 pixels per second downwards\nvar velocity\
  \ = Vector2(xVelocity, yVelocity) # Initial speed and direction\nvar screen_size_x\
  \ #screen horizontal dimension\nvar screen_size_y #screen vertical dimension\nvar\
  \ label_size_x #label width\nvar label_size_y #label height\n\nfunc _ready():\n\
  \    text = \"Go Go Godot!\"\n    # Get the screen size (viewport size)\n    screen_size_x\
  \ = get_viewport_rect().size.x\n    screen_size_y = get_viewport_rect().size.y\n\
  \    label_size_x = size.x\n    label_size_y = size.y\n\nfunc _process(delta):\n\
  \    position = position + velocity * delta\n    # Bounce off left/right edges\n\
  \    if position.x < 0 or position.x + label_size_x > screen_size_x:\n        velocity.x\
  \ *= -1\n        position.x = clamp(position.x, 0, screen_size_x - label_size_x)\n\
  \n    # Bounce off top/bottom edges\n    if position.y < 0 or position.y + label_size_y\
  \ > screen_size_y:\n        velocity.y *= -1\n        position.y = clamp(position.y,\
  \ 0, screen_size_y - label_size_y)\n```\n\n好了——这就是你自己的经典弹跳 DVD 标志版本！现在你已经在 Godot\
  \ 中构建了第一个简单动画，你已准备好更深入地探索创建交互式和动态游戏。\n\n## Summary\n\n在本章中，我们了解了 Godot 的历史及其节点和场景设计理念。我们下载了\
  \ Godot 并运行它。我们创建了第一个项目并在游戏窗口中输出了第一个结果。我们还通过处理标签的位置和速度使场景动态化。我们还了解了屏幕尺寸以及如何将其限制在一定范围内，以及\
  \ delta 变量发挥的重要作用。\n\n在下一章中，我们将更仔细地查看 Godot 编辑器界面以及如何使用它提供的工具。\n\n## Unlock this\
