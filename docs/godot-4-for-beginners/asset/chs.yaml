  \n![](img/d34207e07c133a9e84d9caf1d479006c_30_1.png)\n\n## 技术要求\n\n您可以在 GitHub 仓库中找到本书的示例项目和代码：https://github.com/PacktPublishing/Godot-4-for-Beginners\n\
  \n本章的代码文件可在以下位置获取：https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch1/godotintro\n\
  \n访问此链接查看代码运行的视频：https://packt.link/RjbW3\n\n### Godot 是什么？\n\n简短的回答是 Godot 是一个游戏引擎。它最初由\
  \ Juan Linietsky 和 Ariel Manzur 于 2007 年创建，作为阿根廷多个工作室的内部工具。您接下来的问题可能是，“游戏引擎到底是什么？”以及“Godot\
  \ 有什么特别之处？”\n\n制作游戏很难——真的很难！有无数个 moving parts 都需要完美协同工作。虽然可以从零开始构建一切，但大多数开发者依赖游戏引擎来处理繁重的工作。\n\
  \n因此，游戏引擎是一个简化游戏开发的软件框架。它提供构建游戏的核心工具和系统——例如渲染、物理、输入处理和资源管理——以便开发者可以更多地关注游戏玩法、故事和设计，而不是低级技术代码。\n\
  \n\n\n## 让 Godot 如此特别的原因是什么？\n\n有很多原因让 Godot 成为初学者和经验丰富的游戏开发者都喜爱的选择。以下是让这款引擎脱颖而出的核心特性：\n\
  \n- **开源且免费：** 2014 年，Godot 在 MIT 许可证下作为开源项目发布。这意味着它完全免费使用——即使用于商业项目——并且开发者可以完全访问源代码。这使得\
  \ Godot 具有高度可定制性且由社区驱动。\n- **多样的场景系统：** Godot 最具代表性的特性之一是其场景系统。Godot 中的一切都是一个场景——而场景由节点组成。场景还可以嵌套在其他场景中，使得构建复杂、可重用且模块化的组件变得容易。这种结构使组织和扩展游戏项目变得异常直观。\n\
  - **强大的 2D 和 3D 支持：** Godot 包含专用于 2D 和 3D 开发的工具。无论你是在制作像素艺术平台游戏还是功能齐全的 3D 体验，Godot\
  \ 都为两种维度提供专门的工作流程。虽然其他引擎也支持两者，但 Godot 的 2D 系统尤其常因其精确性和灵活性而受到赞誉。\n- **资源——另一面：**\
  \ 除了场景和节点之外，Godot 使用被称为资源的东西——它们无处不在。精灵上的纹理是一个资源。你播放的音频是一个资源。甚至 Path2D 节点中的路径也是一个资源。资源是可以跨项目重用、在检查器中编辑或从磁盘保存和加载的数据容器。它们促进一致性，减少重复，并使项目保持轻量和有序。\n\
  - **轻量且跨平台：** Godot 轻量、安装快速，即使在较旧的机器上也能流畅运行。这种低系统要求是可访问性和包容性的巨大胜利——任何人无需高端 PC 即可开始制作游戏。此外，当你的游戏完成后，你可以将其导出到多种平台，包括\
  \ Windows、macOS、Linux、Android、iOS 和 HTML5。\n- **蓬勃发展的社区和活跃的开发：** Godot 拥有友好且不断增长的开发者和教育者社区。无论你是刚入门还是经验丰富的编码者，都可以通过论坛、Discord\
  \ 频道、教程和文档获得大量支持。引擎处于持续开发中，定期更新并拥有开放的路线图。\n\n现在你已经了解了使 Godot 成为功能强大且适合初学者的游戏引擎的关键特性——从灵活的节点和场景系统到充满活力的开源社区——你对为什么它是游戏开发之旅的绝佳选择有了坚实的理解。\n\
  \n是时候从理论转向实践了！\n\n在下一节中，我们将指导你下载和安装 Godot，并帮助你首次运行引擎。很快，你将设置自己的项目并逐步构建你的第一个游戏。让我们开始吧！\n\
