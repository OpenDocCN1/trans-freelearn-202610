  - 12. 如图 7.4 所示，顶部栏中有动画控件。我已将 idle 帧率设置为 20 FPS，并且循环已打开。你可以尝试这些设置以找到你喜欢的设置。这在图 7.5\
  \ 中可见：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_193_2.png)\n\nFigure 7.5 – 带有循环和\
  \ FPS 高亮的动画控件\n- 13. 为了完成草莓可收集物品的设置，我们需要在 Area2D 节点的子节点下添加一个 CollisionShape2D 节点。对于该节点的\
  \ Shape 属性，选择 CapsuleShape2D 并在 Viewport 中调整以适应草莓。这在图 7.6 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_193_3.png)\n\
  \nFigure 7.6 – 调整碰撞以适应草莓\n\n草莓现在可以与对象发生碰撞并检测对象是否与其发生碰撞。我们需要编写代码来为草莓制作动画，并在玩家与其碰撞时执行某些操作，例如移除草莓并将玩家的草莓收集分数加\
  \ 1。\n\n## 实现草莓脚本\n\n草莓只需要做两件事：动画播放，并在玩家收集时消失。我们现在将编程草莓执行这两件事。\n\n在草莓场景中，选择你的草莓节点并点击\
  \ Attach New Script 按钮/图标，如图 7.7 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_194_0.png)\n\
  \nFigure 7.7 – Attach New Script 按钮/图标\n\nidle 动画必须重复播放；我们已经将其设置为循环，因此在 ready 函数中，我们只需要启动动画。为了更轻松地引用场景中的其他节点，Godot\
  \ 提供了一个内置快捷方式。通过在节点名称前加上美元符号（$），我们可以直接快速访问该节点及其函数。\n\n此快捷方式在频繁与场景中的其他节点交互时特别有用，例如控制角色的动画或更新\
  \ UI 元素，因为它使代码更易读且高效。使用此快捷方式播放草莓的 idle 动画，如以下代码所示：\n\n```\nfunc _ready():\n    $AnimatedSprite2D.play(\"\
  idle\")\n```\n\n当我们的玩家与草莓发生碰撞或重叠时，我们希望向草莓发出信号以执行一个函数。在该函数中，我们可以从关卡中移除草莓并将玩家收集的草莓数量加\
  \ 1。Area2D 节点可以响应多种内置信号，其中之一是当一个物体进入节点区域时。\n\n要设置此功能，选择草莓节点，然后点击 Node 选项卡（位于 Inspector\
  \ 选项卡右侧）。在 Signals 类别下，在 Area2D 下，选择 body_entered 信号并点击右下角的 Connect，或直接双击信号名称。这在图\
  \ 7.8 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_195_0.png)\n\nFigure 7.8\
  \ – Area2D 的 body_entered 信号\n\n一个新窗口将会弹出，如图 7.9 所示。你现在无需担心细节，只需点击 Connect 按钮即可。\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_195_1.png)\n\nFigure 7.9 – 将信号连接到方法（函数）\n\
  \n\n\n点击 Connect 按钮，如图 7.9 所示，将在 Strawberry 脚本中创建一个名为 _on_body_entered(body) 的新函数。参数\
  \ body 包含与 Strawberry 碰撞的对象的引用。为了确定该 body 是否为玩家，我们可以将玩家标记为 Player 组的一部分。\n\n就是这样做的：\n\
  \n- 1. 切换到你的 Player 场景并选择 Player 节点。\n- 2. 再次点击 Inspector 右侧的 Node 选项卡，然后选择 Groups\
  \ 子选项卡。\n- 3. 点击 + 符号添加一个组。\n- 4. 将组命名为 Player。\n\n这些步骤如图 7.10 所示。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_196_0.png)\n\
  \nFigure 7.10 – Node 选项卡、Groups 子选项卡以及添加新组的 + 符号\n\n组准备好后，我们可以检查进入 Strawberry 的\
  \ body 是否在 Player 组中，如果是则相应地做出反应。我们可以在 Strawberry 脚本中按如下方式实现：\n\n```\nfunc _on_body_entered(body):\n\
  \    if body.is_in_group(\"Player\"):\n        #add to player score\n        #remove\
  \ the strawberry\n```\n\nPlayer 将跟踪它收集了多少个 Strawberries。我们需要在 Player 脚本中添加一个变量来记录玩家收集的\
  \ Strawberry 数量，并在 Player 脚本中添加一个函数，每次收集到 Strawberry 时将分数加一。\n\n返回 Player 脚本并按代码所示添加变量和函数：\n\
  \n```\nvar jumpCount = 0\nvar is_wall_sliding = false\nvar strawberry_count = 0\n\
  \nfunc add_score(amount):\n    strawberry_count += amount\n```\n\n前面的代码每次调用时都会按指定量增加\
  \ strawberry_count 变量。我们将在 Strawberry 的 _on_body_entered(body) 函数中调用它，并在收集后从场景中移除\
  \ Strawberry，如下所示：\n\n```\nfunc _on_body_entered(body):\n    if body.is_in_group(\"\
  Player\"):\n        body.add_score(1)\n        queue_free() #remove strawberry\n\
  ```\n\n内置的 queue_free() 函数会在当前帧结束时，只要安全就立即从内存中删除一个节点。它是移除场景中节点的推荐方法。\n\n有了这段代码，当\
  \ Strawberry 信号有另一个 body 进入其空间时，玩家 Strawberry 计数将增加 1，且 Strawberry 将从场景中移除。\n\n\
  随意多次将 strawberry.tscn 文件拖放到你的关卡中，以便玩家有东西可收集，如图 7.11 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_198_0.png)\n\
  \nFigure 7.11 – 将 Strawberry 拖放到关卡中\n\n玩家可以在关卡中移动并收集 Strawberry。为了增加挑战性，我们需要一个巡逻的敌人。\n\
  \n## 添加巡逻敌人\n\n请注意，敌人可以在此处找到：https://pixelfrog-assets.itch.io/pixel-adventure-2.\n\
  \n我们将使用 **Mushroom** 敌人。创建一个新场景并使用 **CharacterBody2D**、**AnimatedSprite2D** 和 **CollisionShape2D**\
  \ 进行设置，其中 **CapsuleShape2D** 仅覆盖蘑菇的一部分，如 *图 7.12* 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_199_0.png)\n\
  \n*图 7.12 – 设置 Mushroom 场景*\n\n使用 Mushroom 敌人文件夹中提供的精灵表，并设置 SpriteFrames 和动画 **idle**\
  \ 与 **run** 以 **20 FPS** 循环播放。我使用 **idle** 中的一帧并对其进行旋转创建了自己的 **death** 动画，如 *图 7.13*\
  \ 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_200_0.png)\n\n*图 7.13 – Mushroom\
  \ 敌人的动画*\n\n将新脚本附加到 **Mushroom** 节点，并确保使用的模板为空对象，如 *图 7.14* 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_200_1.png)\n\
  \n*图 7.14 – 为 Mushroom 敌人使用 Object: Empty 模板*\n\n使用 Empty 模板可确保我们的脚本以无默认或额外代码的方式创建，并且尽可能简单。\n\
  \n添加代码以设置 Mushroom 的速度、方向和生命值，如代码所示：\n\n```\nextends CharacterBody2D\n\nconst SPEED\
  \ = 75\nvar direction = 1\nvar health = 1\n```\n\n请注意，direction 变量的值为 -1 或 1，分别表示向左或向右移动。\n\
  \n现在，我们有了控制 Mushroom 敌人速度、方向和生命值的变量。\n\n此外，添加一个函数为 Mushroom 应用重力，使其能够下落并接触地面，如以下代码所示：\n\
  \n```\nfunc add_gravity(delta):\n    # Add gravity.\n    if not is_on_floor():\n\
  \        velocity += get_gravity() * delta\n```\n\n如果 Mushroom 不在地面上，重力会将其向下拉。\n\
  \n现在，创建一个使 Mushroom 移动的函数。我将其命名为 update_direction()，它所做的只是让敌人以恒定速度向右移动，如代码所示：\n\n\
  ```\nfunc update_direction():\n    # Move enemy at constant speed\n    velocity.x\
  \ = SPEED * direction\n```\n\nMushroom 在水平面上的速度乘以速度和方向。\n\n这两个函数也必须在 _physics_process(delta)\
  \ 函数中与 move_and_slide() 一起调用，如代码所示：\n\n```\nfunc _physics_process(delta):\n    add_gravity(delta)\n\
  \    update_direction()\n    move_and_slide()\n```\n\n我们还必须设置 Mushroom 的碰撞，使其能够与地面和玩家发生碰撞。通过打开\
  \ Collision Layer 1 并打开 Collision Mask 1、2 和 3 来实现。\n\n如果你现在将 Mushroom 放入关卡并运行游戏，Mushroom\
  \ 将开始向右移动，直到与墙壁碰撞。\n\n我们将使用内置的 is_on_wall() 函数检测 Mushroom 是否与墙壁碰撞并反转其方向，如代码所示：\n\
  \n```\nfunc reverse_direction():\n    #Reverse direction when hitting a wall\n \
  \   if is_on_wall():\n        direction = -direction\n```\n\n请注意，通过反转或否定 direction\
  \ 的值，我们可以确定 Mushroom 是向左还是向右移动。\n\n确保在调用 move_and_slide() 之后调用 reverse_direction()，如下代码所示，否则碰撞将无法正确检测：\n\
  \n```\nfunc _physics_process(delta):\n    add_gravity(delta)\n    moveEnemy()\n\
  \    move_and_slide()\n    reverse_direction()\n```\n\n如果你将 Mushroom 放在一个漂浮平台上，当它到达平台边缘时就会掉落。为防止这种情况，使用\
  \ RayCast2D 节点检测 Mushroom 是否接近边缘然后反转方向。将 RayCast2D 节点作为 Mushroom 的子节点添加，如图 7.15\
  \ 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_202_0.png)\n\nFigure 7.15 – 向我们的\
  \ Mushroom 节点添加 RayCast 节点\n\nRayCast2D 只是由对象投射的不可见射线，用于在发送方向上查找碰撞。在本例中，我们正在寻找下方的碰撞以确定何时不再在地面上。我们的射线投射在\
  \ Mushroom 的右侧一点（我使用 Target Position x: 0, y: 14 和 Transform Position x: 15 和 y:\
  \ 7），这样我们就可以看到何时接近无地面区域并在掉落前反转方向！将你的射线放置如下图 7.16 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_203_0.png)\n\
  \nFigure 7.16 – 从 Mushroom 右侧向下投射射线\n\n现在，我们可以编写一个函数，当射线未与地面碰撞时反转 Mushroom 的方向，并将射线移动到另一侧，使其始终在\
  \ Mushroom 移动方向上寻找无地面，如下所示：\n\n```\nfunc platform_edge():\n    if not $RayCast2D.is_colliding():\n\
  \        direction = -direction\n        $RayCast2D.position.x *= -1\n```\n\n在前面的代码中，只要射线不再与地面碰撞，Mushroom\
  \ 的移动方向就会反转，并且射线会移动到 Mushroom 的另一侧以检测 Mushroom 移动方向上的碰撞。我们还必须为 RayCast2D 节点打开 Collision\
  \ Mask 2 和 3，以便它能够检测到地面。\n\n请记住在 _physics_process() 函数中在 move_and_slide() 之后调用此函数，以便在检测到碰撞后运行。最后，将一个\
  \ Mushroom 放在平台上以测试它是否巡逻平台且不会掉落。\n\n\n\n## 蘑菇踩踏\n\n玩家应该只能从上方攻击蘑菇来伤害它。我们将为蘑菇创建一个受伤区域或死亡区域，它将由一个\
  \ Area2D 和 CollisionShape2D 节点组成，其中放置了一个 RectangleShape2D 节点在蘑菇顶部。\n\n如果玩家从侧面攻击，蘑菇会伤害玩家。我们将在蘑菇两侧创建一个伤害玩家区域，同样由\
  \ Area2D 和 CollisionShape2D 以及 RectangleShape2D 组成。这在图 7.17 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_204_0.png)\n\
  \n图 7.17 – 创建死亡区域和伤害玩家区域\n\n有了这些，我们就可以利用信号来检测玩家是否进入了其中一个区域，然后做出相应反应。\n\n将 _on_death_zone_body_entered()\
  \ 和 _on_hurt_player_zone_body_entered() 信号连接到蘑菇脚本。然后，在空函数中编写代码，如代码所示：\n\n```\nfunc\
  \ _on_death_zone_body_entered(body):\n    if \"Player\" in body.name:\n        body.velocity.y\
  \ = -500\n        health -= 1\n```\n\n```\nfunc _on_hurt_player_zone_body_entered(body:\
  \ Node2D):\n    if \"Player\" in body.name:\n        body.hurt()\n```\n\nPlayer\
  \ 脚本中目前还没有 hurt() 函数。我们现在应该创建它。\n\n打开 Player 脚本并添加以下函数，以便玩家可以被蘑菇敌人伤害：\n\n```\nfunc\
  \ hurt():\n    print(\"Player hurt\")\n```\n\n请注意，目前我们只是使用了一种称为 stub testing 的技术，即简单地显示一条消息来验证函数是否被正确调用。稍后，我们将完成此函数的完整实现。\n\
  \n_on_death_zone_body_entered(body) 函数在有物体进入死亡区域时运行（从上方跳到蘑菇上）。我们检查进入该区域的物体名称中是否包含单词\
  \ Player。这是一种替代且等效于检查 body.is_in_group(\"Player\") 的方法。如果物体的名称中确实包含单词 Player，我们将玩家的速度增加\
  \ 500，使其看起来像是从蘑菇上弹开，并将蘑菇的生命值减 1。\n\n_on_hurt_player_zone_body_entered() 函数在物体从侧面进入蘑菇时运行。同样，如果该物体是玩家，我们将运行玩家的\
  \ hurt() 函数，减少玩家的生命值。\n\n当蘑菇的生命值为 0 时，它应该禁用碰撞，停止与玩家的碰撞检测，并播放死亡动画。这是通过以下所示的自定义函数实现的：\n\
  \n```\nfunc mushroom_death():\n    if health <= 0:\n        $CollisionShape2D.disabled\
  \ = true\n        $HurtPlayerZone.monitoring = false\n        $AnimatedSprite2D.play(\"\
  death\")\n```\n\nmushroom_death() 函数应该在 _physics_process() 函数中调用，如代码所示：\n\n```\n\
  func _physics_process(delta):\n    add_gravity(delta)\n    moveEnemy()\n    move_and_slide()\n\
  \    reverse_direction()\n    platform_edge()\n    mushroom_death()\n```\n\n连接蘑菇的\
  \ AnimatedSprite2D 节点的 _on_animated_sprite_2d_animation_finished() 信号。当死亡动画结束时，它将触发移除蘑菇场景的函数，如代码所示：\n\
  \n```\nfunc _on_animated_sprite_2d_animation_finished():\n    if $AnimatedSprite2D.animation\
  \ == \"death\":\n        queue_free()\n```\n\n在你的关卡中添加更多蘑菇和可收集物。为了防止场景树过于拥挤，添加一个类型为\
  \ Node 的新子节点。将它重命名为 Enemies 并将所有蘑菇拖到其下。你可以对 Collectibles 做同样的操作，如图 7.18 所示：\n\n\
  ![](img/d34207e07c133a9e84d9caf1d479006c_206_0.png)\n\n图 7.18 – 通过分组节点来组织场景树\n\n\
  现在关卡中有敌人和可收集物，我们需要一个胜利条件。对于我们的目的，它将是玩家收集完所有草莓后，检查点旗帜会升起。触碰该旗帜将结束关卡。让我们在下一节了解更多关于关卡完成的知识。\n\
  \n## 实现关卡完成\n\n关卡完成机制是任何游戏的重要组成部分，为玩家提供成就感和 closure。在本节中，我们将创建一个系统，其中收集所有草莓会触发一系列事件：检查点旗帜动画播放并飞出，标志着目标的完成。玩家随后移动到旗帜处，触碰它以结束关卡。\n\
  \n该系统不仅增加了视觉和互动效果，还强化了玩家的进度和目标达成感。到本节结束时，你将拥有一个精致且令人满意的关卡完成序列，以提升游戏的整体体验。\n\n创建一个具有以下内容的新场景：\n\
  \n- **Area2D** 作为根节点（重命名为 CheckPoint）\n- **AnimatedSprite2D**\n- **CollisionShape2D**\
  \ 带有 **RectangleShape2D**\n\n场景树如图 7.19 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_207_0.png)\n\
  \n图 7.19 – 检查点场景的场景树\n\n为旗帜创建三个动画，命名为 flag_fly、idle 和 trigger。在 Pixel Frog 的资源文件夹中，导航到\
  \ Items | Checkpoints | Checkpoint 文件夹。\n\n- 对于 idle 动画，使用名为 Checkpoint (No Flag).png\
  \ 的单帧。\n- 对于 trigger 动画，使用 Checkpoint (Flag Out).png 精灵表。不要循环动画并以 20 FPS 运行。\n-\
  \ 对于 flag_fly 动画，使用 Checkpoint (Flag Idle).png 精灵表。循环动画并以 20 FPS 运行。\n\nflag_fly\
  \ 动画的示例图像如图 7.20 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_208_0.png)\n\n\
  图 7.20 – 为检查点设置旗帜动画\n\n将脚本附加到 CheckPoint 节点以自定义其行为。我们将创建自己的信号来触发旗帜飞出。一旦玩家在关卡中收集了所有草莓，玩家将发出\
  \ trigger 信号。CheckPoint 代码如下所示并进行了解释：\n\n```\nextends Area2D\nsignal trigger\nvar\
  \ level_complete = false\n\n#### signal that runs when the animation is finished\
  \ playing\nfunc _on_animated_sprite_2d_animation_finished():\n    $AnimatedSprite2D.play(\"\
  flag_fly\")\n    level_complete = true\n\n#### our own custom signal\nfunc _on_trigger():\n\
  \    $AnimatedSprite2D.play(\"trigger\")\n\n#### A signal that runs when a body\
  \ enters\nfunc _on_body_entered(body):\n    if level_complete:\n        get_tree().quit()\n\
  ```\n\n如图所示，我们创建自己的信号并将其命名为 trigger。然后，在 Inspector 中，我们将该信号连接到我们的脚本。我们还有一个布尔变量 level_complete\
  \ 用于确定关卡是否完成。链接到我们信号的 trigger 函数播放 trigger 动画，然后发出动画完成的信号，这会切换到 flag_fly 动画并将 level_complete\
  \ 设置为 true。目前，当玩家触碰旗帜时，游戏将退出。\n\n然而，我们需要从 Player 脚本发出 trigger 信号，一旦他们收集了所有草莓。返回\
  \ Player 脚本并添加一个名为 level_strawberries 的新变量来跟踪关卡中草莓的数量，如下所示：\n\n```\nvar strawberry_count\
  \ = 0\nvar level_strawberries\n```\n\n首先，我们应该创建一个名为 checkpoint 的组并将 CheckPoint 节点添加到该组。为此，在\
  \ Inspector 中选择 CheckPoint 节点，选择 Node 选项卡，然后选择 Groups 子选项卡并添加一个名为 checkpoint 的新组。这如图\
  \ 7.21 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_209_0.png)\n\n图 7.21 – 创建检查点组\n\
  \n我们还需要一个自定义函数来检查关卡是否完成，然后发出 trigger 信号。如果 strawberry_count（玩家收集的草莓数量）与 level_strawberries（关卡中草莓的总数量）匹配，则我们通过其组名获取对检查点的引用并发出检查点的\
  \ trigger 信号。最后，我们将草莓重置为 0，以便信号只发出一次而不是不断发出。这在以下代码中显示：\n\n```\nfunc complete_level():\n\
  \    if strawberry_count == level_strawberries:\n        var checkpoint =\n    \
  \    get_tree().get_first_node_in_group(\"checkpoint\")\n        checkpoint.emit_signal(\"\
  trigger\")\n        strawberry_count = 0\n```\n\n\n\n请记住在 _physics_process(delta)\
  \ 函数中调用新的 complete_level() 函数。\n\n由于所有的草莓都在 Level1 场景中，我们需要将一个脚本附加到 Level1 节点上，以便它可以统计场景中的草莓数量并更新玩家变量。这在图\
  \ 7.22 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_210_0.png)\n\n图 7.22 – 将脚本附加到关卡节点\n\
  \n关卡脚本中统计草莓的代码如下所示：\n\n```\nextends Node2D\n@onready var player = $Player\n@onready\
  \ var strawberries = $Collectibles\n\nfunc _ready() -> void:\n    player.level_strawberries\
  \ = strawberries.get_child_count()\n```\n\n在前面的代码中，我们获取了 Player 场景的引用以及 Collectibles\
  \ 场景组（多个草莓）的引用。在 _ready 函数中，我们通过将其设置为关卡中所有草莓的数量来更新玩家的 level_strawberries 变量。\n\n\
  现在，将一个 CheckPoint 场景添加到关卡中，你就有了完成它的方法。\n\n这样，关卡现在就可以游玩了！\n\n## 摘要\n\n在本章中，我们通过基本游戏玩法机制扩展了我们的\
  \ 2D 平台游戏，并改进了玩家交互。我们通过代码控制玩家动画，确保跑步、跳跃和墙滑等动作具有流畅的视觉反馈。我们还实现了墙滑和双跳，增加玩家移动的多样性，并引入了可穿透平台以实现动态关卡导航。同时，我们还添加了可收集物品以鼓励探索、巡逻敌人以增加挑战，以及用于跟踪关卡完成的检查点。\n\
  \n在下一章中，我们将迁移我们的 2D 技能并制作一个 3D 平台游戏！\n\n## 立即解锁本书的独家福利\n\n扫描此二维码或访问 packtpub.com/unlock，然后按书名搜索本书。\n\
  \n*注意：开始前请准备好您的购买发票。*\n\n![](img/d34207e07c133a9e84d9caf1d479006c_211_0.png)\n"
- "# 第 3 部分\n\n## 构建与超越\n你的游戏开发之旅\n\n在本书的这一最终部分，你将通过两个详细的章节从零开始构建一个 3D 小游戏，从而将你的技能提升到下一个水平。然后你将探索如何通过视觉和音频增强——通常称为“游戏精华”——来提升玩家体验。我们还将退一步审视核心游戏设计原则，帮助你批判性地思考是什么让游戏引人入胜且令人愉快。最后，我们将以精心挑选的资源汇编作为收尾，以支持你作为游戏开发者的持续学习和成长。到本部分结束时，你将完全具备开始创建自己的完整游戏并打磨技艺的能力。\n\
  \n本书的这一部分包含以下章节：\n\n- *第 8 章，在 Godot 中创建 3D 小游戏 – 第 1 部分*\n- *第 9 章，在 Godot 中创建\
  \ 3D 小游戏 – 第 2 部分*\n- *第 10 章，添加游戏精华*\n- *第 11 章，理解游戏设计*\n- *第 12 章，下一步去哪里？*\n\n\
  ## 8\n\n## 在 Godot 中创建 3D 小游戏 — 第 1 部分\n\n创建一个结构良好的 3D 游戏世界需要理解如何组合场景、设计关卡以及实现功能性控制器。在本章中，我们将深入\
  \ Godot 中 3D 游戏创建的基本构建块。通过学习如何组合和组织场景，你将为创建动态、交互式环境奠定坚实的基础。\n\n你将首先构建一个 3D 角色场景并附加脚本来控制其移动。接下来，你将学习如何通过组合静态对象、碰撞体和网格来设计关卡。我们还将实现一个摄像机控制器，提供流畅且响应迅速的玩家视角。最后，我们将把所有内容整合到一个完整的关卡中并进行测试以确保功能正常。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 在 3D 中工作：Godot 中的新维度\n- 构建一个 3D 角色\n- 创建关卡设计\n- 使用 Character\
  \ Controller 脚本\n- 使用变量\n- 探索函数\n- 实现摄像机控制器\n- 运行测试\n\n到本章结束时，你将能够创建可重用的 3D 场景、控制玩家角色，并设计在视觉上吸引人且功能正常的关卡。这些技能对于构建沉浸式\
  \ 3D 游戏至关重要，并将为未来章节中的更高级功能奠定基础。\n\n## 技术要求\n\n本章的代码文件可在本书的 GitHub 仓库中获取：https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch8\n\
  \n本项目中使用的游戏资源由 Essssam 以知识共享零许可 Creative Commons Zero (CC0) 发布。Essssam 已允许我们在任何媒介或格式上分发、\
  \ remix、改编并基于该材料进行构建，甚至用于商业目的。\n\n它们可以在这里找到：\n\nhttps://essssam.itch.io/3d-leap-land\n\
  \n访问此链接查看代码运行的视频：https://packt.link/6dr7h\n\n## 在 3D 中工作：Godot 中的新维度\n\n到目前为止，我们一直完全在\
  \ 2D 中工作——通过平面场景、精灵和屏幕空间移动学习 Godot 的基础知识。在本章中，我们将进入 3D，在那里我们将处理深度、透视、光照和更复杂环境中的物理。\n\
  \n虽然从 2D 过渡到 3D 起初可能看起来令人生畏，但 Godot 一致的节点和基于场景的设计使得这一飞跃变得更加容易管理。模块化和层次结构的相同原则仍然适用——只是现在我们处理的是\
  \ Node3D、MeshInstance3D 和 Camera3D 等 3D 节点，并在三维空间中构建场景。\n\n本章将指导你创建基本 3D 角色的过程。你将学习如何组装和组织必要的组件到一个独立的场景中，该场景以后可以像我们在\
  \ 2D 中所做的一样被重用并整合到更大的 3D 世界中。\n\n## 构建一个 3D 角色\n\n仅仅因为我们现在在三维中工作并不意味着 Godot 的节点和场景设计理念发生了变化。我们将继续在各自的场景中设计游戏的不同组件，然后使用它们构建关卡或主场景。\n\
  \n## 重要说明\n\n请注意，你可以通过按住 *右鼠标按钮* 并像大多数游戏中一样使用 *WASD* 键在 3D 场景中飞行。如果在按住 *右鼠标按钮* 的同时使用鼠标滚轮，你可以设置移动速度。\n\
  \n我们将从 Player 场景开始。按照以下步骤，你将创建一个完全功能的 3D 玩家角色——它可以使用键盘输入在你的 3D 世界中移动并对物理做出真实响应。这将为构建完整的\
  \ 3D 游戏奠定基础，从其最基本元素之一——玩家开始。\n\n1. 创建一个新的 Godot 项目并将其命名为 Leap Land。\n2. 现在，单击 **Other\
  \ Node** 并添加一个 **CharacterBody3D** 节点作为根节点，如 *图 8.1* 所示：\n3. 将 **CharacterBody3D**\
  \ 节点重命名为 Player。该节点被设计为物理体，旨在由用户控制。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_217_0.png)\n\
  \n图 8.1 – 开始一个新的 3D 场景\n\n4. 在 FileSystem 中创建一个新文件夹并命名为 assets。将 3D Leap Land 资源包中的\
  \ obj 和 tex 文件夹拖放到此文件夹中。这在图 8.2 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_218_0.png)\n\
  \n图 8.2 – 从 3D Leap Land 导入 obj 和 tex 文件夹\n\n5. 在 2D 中，我们需要在 CharacterBody2D 节点上附加一个精灵以显示其纹理。在\
  \ 3D 中，我们将 MeshInstance3D 节点作为 CharacterBody3D 节点的子节点添加，如图 8.3 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_218_1.png)\n\
  \n图 8.3 – 将 MeshInstance3D 添加为子节点\n\n6. 选择 MeshInstance3D 节点，并在 Inspector 中找到 Mesh\
  \ 属性。它当前为 <empty>，但将 slime.obj 从 FileSystem 拖放到 Mesh 属性上，如图 8.4 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_218_2.png)\n\
  \n图 8.4 - 将 slime.obj 设置为 Mesh\n\n\n\n7. 场景中的史莱姆是*灰色*的。为纠正这一点，我们必须将纹理文件 palette.png\
  \ 从 tex 文件夹拖到视口中的史莱姆上。史莱姆的纹理将如 图 8.5 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_219_0.png)\n\
  \n图 8.5 – 为史莱姆添加纹理\n\n8. 现在，通过添加一个 **CollisionShape3D** 节点作为子节点为玩家添加一个碰撞盒。然后，在 **Inspector**\
  \ 中，找到 **Shape** 属性，并选择一个新的 **SphereShape3D**。使用 *橙色* 的手柄调整碰撞盒大小以适应史莱姆。我为 **CollisionShape3D**\
  \ 节点的 **Position** 值设置为 x: 0.0, y: 0.15, z: 0.0，但你的值可能有所不同。\n\n9. 要看到任何东西，我们需要在场景中添加一个摄像机。添加一个\
  \ **Camera3D** 节点作为子节点并移动它，使其处于可以看到整个史莱姆的位置。我将其放置在 x: 0, y: 1, z: -2.5 处，并将旋转设置为\
  \ x: -15, y: -175, z: -1。这在 图 8.6 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_219_1.png)\n\
  \n图 8.6 – 在场景中定位摄像机\n\n10. 没有光，我们仍然看不到多少。添加一个 **DirectionalLight3D** 节点作为 **CharacterBody3D**\
  \ 根节点的子节点。这是像太阳一样向所有方向无限延伸的光。你可以将光线角度调整到玩家身上。\n\n11. 在 **MeshInstance3D** 节点的 **Transform**\
  \ 属性中，将网格绕 *y* 轴旋转 180 度。\n\n12. 将场景保存为 `player.tscn` 并通过按 *F6* 预览。它应看起来像 *图 8.7*：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_220_0.png)\n\n图 8.7 – 游戏中史莱姆的视图\n\n**Player**\
  \ 场景现在基本完成，可以导入到更复杂的场景中，例如关卡场景，这就是我们接下来要做的工作。\n\n## 创建关卡设计\n\n现在我们已经创建了 3D 玩家角色，下一步是为其构建一个可以存在和移动的关卡。\n\
  \n**Level design** 在 Godot 中指的是创建环境 – 地板、墙壁、平台和景物 – 它们构成了游戏的可玩世界。在 3D 中，这涉及在空间中放置和排列\
  \ 3D 对象，以定义玩家可以去哪里、可以与什么交互以及游戏玩法如何展开。\n\n在本节中，我们将使用 Godot 的内置节点和工具创建一个基本的 3D 关卡。最后，你将拥有一个角色可以走动并测试移动的空间。\n\
  \n## 创建关卡组件\n\n为了构建关卡，我们使用各种 **level components**。这些是构成环境的各个部分，例如地板、墙壁、坡道或平台。关卡组件通常由\
  \ **StaticBody3D**、**MeshInstance3D** 和 **CollisionShape3D** 节点组成。\n\n关卡的大部分部分，例如地面、墙壁、栅栏、桥梁和其他非移动结构，都是使用\
  \ **StaticBody3D** 节点创建的。这些对象在游戏过程中不打算移动，也不受物理力和碰撞的影响。相反，它们为游戏环境提供稳定且优化的基础。\n\n\
  出于以下几个原因，使用 **StaticBody3D** 节点作为静止元素很重要：\n\n- **Performance:** Godot 通过将 **StaticBody3D**\
  \ 节点排除在涉及移动和碰撞解析的昂贵物理计算之外来优化它们。这显著降低了 CPU 使用率，尤其是在复杂场景中。\n- **Physics stability:**\
  \ 因为这些刚体固定在原地，它们为玩家或敌人等移动对象提供可靠的碰撞表面，确保交互一致。\n- **Lighting and baking:** 静态刚体也适用于光照烘焙和全局光照系统。由于它们不会移动，光照贴图和阴影可以准确预先计算，在不影响运行时性能的情况下提高视觉质量。\n\
  \n尽管 **StaticBody3D** 节点不会响应物理力，但它们仍可通过代码或动画手动重新定位，例如在触发时抬起吊桥或降低平台。这在不牺牲效率的情况下提供了灵活性。\n\
  \n为了在 3D 空间中可视化这些组件，我们使用 **MeshInstance3D** 节点，它显示对象的可见形状。为了使这些对象在游戏世界中可交互，例如允许玩家在其上行走或撞击它们，我们将它们与\
  \ **CollisionShape3D** 节点配对。让我们在下一节中看一个创建关卡组件的示例。\n\n### 示例：创建草地平台\n\n创建关卡组件的过程如下所示，并且需要为每个组件重复：\n\
  \n1. 创建一个以 **StaticBody3D** 节点作为根的新场景。将其重命名为 Grass。保存为 grass.tscn。\n2. 添加一个 **MeshInstance3D**\
  \ 节点并将 **Mesh** 属性设置为 ground_grass_4.obj。\n3. 将 palette.png 拖到网格上以设置纹理。\n4. 添加一个\
  \ **CollisionShape3D** 节点并选择 **New BoxShape3D**。\n5. 使用手柄使碰撞盒适应地面模型周围。\n\n场景应如 图\
  \ 8.8 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_222_0.png)\n\n图 8.8 – 地面场景\n\
  \n### 重要说明\n\n请注意，此过程需要为你想要添加到关卡中的每个组件（关卡的一部分）重复。这在 图 8.9 中有注释。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_223_0.png)\n\
  \n图 8.9 – 指向不同关卡组件的箭头（所有单独场景）\n\n在下一节中，我们将学习如何处理不规则碰撞形状。\n\n## 处理不规则碰撞形状\n\n有些模型不符合诸如盒子或球体之类的常规碰撞形状——例如，弯曲或不平整的结构，如桥梁。幸运的是，Godot\
  \ 提供了工具，可以帮助自动为这些更复杂的模型生成碰撞形状。\n\n为了在实践中了解其工作原理，我们将使用不规则网格设置一个 Bridge 场景，并让 Godot\
  \ 为其生成碰撞结构：\n\n1. 创建一个以 **StaticBody3D** 作为根的新场景。将其重命名为 Bridge 并将场景保存为 bridge.tscn。\n\
  2. 添加一个 **MeshInstance3D** 节点并将 **Mesh** 属性设置为 bridge_1.obj。\n3. 将 palette.png 拖到网格上以设置纹理。\n\
  4. 选择 **MeshInstance3D** 节点（Bridge 模型）。\n5. 点击屏幕顶部的 Mesh 菜单并点击 Create Collision\
  \ Shape...，如 图 8.10 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_224_0.png)\n\
  \n图 8.10 – 为 Bridge 场景自动生成碰撞形状\n\n点击 Create Collision Shape... 后，会出现一个弹出菜单。对于碰撞形状放置，选择\
  \ Sibling，对于碰撞形状类型，选择 Trimesh。这在 图 8.11 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_224_1.png)\n\
  \n图 8.11 – Godot 创建碰撞形状的选项\n\n- 选择 **Sibling** 可确保生成的碰撞形状作为单独的节点与网格并列添加，而不是作为其子节点。这保持了场景层次结构的整洁，并使网格及其碰撞形状更容易独立管理。\n\
  - 将 **Trimesh** 作为碰撞类型选择对于不打算移动的静态 3D 模型（如关卡几何体）来说是理想的。**Trimesh** 碰撞会创建与网格表面匹配的详细形状，从而实现准确的碰撞检测。然而，它最好仅用于静态对象，因为它计算成本高，不适合动态或移动对象。\n\
  \n6. Godot 将为 **Bridge** 生成一个碰撞形状多边形，结果的场景树如 *图 8.12* 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_225_0.png)\n\
  \n图 8.12 – Bridge 场景的场景树\n\n### 重要说明\n\n允许 Godot 为对象生成碰撞形状的一个缺点是 *性能*。使用简单或原始形状进行碰撞是首选，因为它减少了场景所需的物理计算。\n\
  \n## 创建关卡布局\n\n开始创建关卡时，我首先探索了资源包中包含的模型。这些模型代表各种环境元素，例如地形、结构和道具。我使用了之前设置草地和桥梁时遵循的相同流程：*将模型导入\
  \ Godot 并将每个模型变成自己的场景。*\n\n通过为各个组件创建单独的场景，我能够构建一套模块化的关卡元素。这些场景随后被组合起来形成完整的关卡布局。你可以遵循相同的方法——从下载的资源包中选择模型（参考\
  \ *Technical requirements* 部分），为每个组件创建场景，然后在新场景中组装它们以设计你的关卡。\n\n最后，请确保在你的关卡场景中添加一个\
  \ **DirectionalLight3D** 节点。这确保环境得到适当的照明，并且模型以逼真的阴影和深度出现。\n\n\n\n我创建的关卡如 图 8.13\
  \ 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_226_0.png)\n\nFigure 8.13 – 一个示例关卡\n\
  \n接下来，我们将学习如何更有效地组织关卡场景。\n\n## 组织关卡场景\n\n在图 8.13 中，关卡中的每个组件都是一个单独的场景，这样可以轻松地重复使用并独立管理它们。图\
  \ 8.14 显示了我用来构建关卡的场景节点列表。请注意，我已将相似或重复的对象——例如 Fences、Grass、Crates 和 Rocks——分组到它们自己的父节点中：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_227_0.png)\n\nFigure 8.14 – 构成关卡的各个场景\n\
  \n**分组**很重要，因为它能保持场景树的整洁，尤其是在较大的关卡中。它允许你一起移动或操作整个类别的对象，从而节省时间并减少错误。例如，如果你想禁用所有栅栏或为所有草地应用着色器，分组会使这变得容易得多。\n\
  \n还值得注意的是，其中大多数对象，例如地面、栅栏、岩石和桥梁，都是静态的。它们在游戏过程中不会移动，应使用 **StaticBody3D** 实现，以获得更好的性能和准确的物理效果。\n\
  \n相比之下，动态对象（如玩家）设计为移动并对环境做出反应，因此使用启用物理的节点（如 **CharacterBody3D**）实现。\n\n这种结构不仅有助于关卡设计，还能确保项目增长时性能流畅、代码管理更清晰。\n\
  \n如图 8.14 所示，我们现在拥有一个复杂的 **Level 1** 场景，它由许多较小的场景组成。尽管场景中已有玩家，但目前无法控制它。在下一节中，我们将处理角色控制器脚本。\n\
  \n## 使用角色控制器脚本\n\n在本节中，我们将编写一个脚本，允许玩家在 3D 世界中移动角色。该脚本至关重要，因为没有它，我们的角色将保持静止——无法在关卡中行走、奔跑或跳跃。到本节结束时，你将拥有一个完全可控的玩家角色，它可以响应输入并以有意义的方式与游戏环境交互。\n\
  \n让我们开始为 Player 场景中的 CharacterBody3D 节点添加一个新脚本。确保在 Empty 中取消选中 Template，这样我们就不会获得任何预制代码，可以像图\
  \ 8.15 所示那样制作一个完全自定义的角色控制器：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_228_0.png)\n\
  \nFigure 8.15 – 为玩家添加一个空脚本\n\n当未选中 Template 复选框时，如图 8.15 所示，我们会看到一个仅有一行的脚本：\n\n\
  ```\nextends CharacterBody3D\n```\n\n这行代码意味着该脚本正在添加或自定义 Godot 中的内置 CharacterBody3D\
  \ 节点。CharacterBody3D 节点用于创建 3D 角色，例如玩家或敌人，它们可以移动、跳跃或与环境交互。通过扩展它，我们可以编写自己的代码，使角色的行为完全符合我们的期望。\n\
  \n尽管我们在 Player 场景中添加了摄像机，但这在游戏过程中不会是唯一的摄像机。相反，我们将在关卡中设置第二个静态摄像机，以便我们可以旋转它从不同角度查看玩家。在\
  \ Godot 中，一个场景可以包含多个摄像机，你可以通过在 Inspector 中将其标记为 Current 来选择哪个摄像机处于活动状态。\n\n## 使用变量\n\
  \n在深入代码之前，让我们花点时间了解它在做什么。在此脚本中，我们将定义一些重要的属性来控制玩家角色的移动方式，例如他们行走的速度或跳跃的高度。我们将使用导出变量，这意味着这些属性不仅在代码中定义，还可以在\
  \ Godot 编辑器的 Inspector 面板中直接查看和编辑。\n\n这使得开发更加灵活和高效。例如，设计师和艺术家可以微调诸如移动速度、跳跃高度或重力等值，而完全无需触及代码。同时，程序员可以将逻辑保持在脚本中有序。这种关注点的分离有助于团队更有效地协作，使每个人都能快速测试和平衡游戏玩法，而不会冒着破坏代码的风险。\n\
  \n## 将玩家脚本与摄像机链接\n\n我们现在可以开始准备角色与游戏世界中的其他组件交互。一个重要元素是摄像机，它需要在玩家穿过关卡时平滑地跟随玩家。为了实现这一点，我们将设置一种方式，让\
  \ Player 脚本与控制摄像机的单独场景进行通信。\n\n稍后，我们将创建一个 View 场景，它将充当摄像机控制器。我们将为摄像机指定一个跟随目标（即玩家）。我们还将添加对该\
  \ View 的引用，以便可以直接从 Player 脚本控制摄像机的行为，例如旋转或缩放。\n\n首先，将这两行添加到 Player 脚本中：\n\n```gdscript\n\
  @export_subgroup(\"Components\")\n@export var view: Node3D\n```\n\n在这里，@export 注解使变量在\
  \ Inspector 中可见。在本例中，它还将变量组织在 CharacterBody3D 节点的属性中名为 Components 的新类别或子组下。view\
  \ 变量现在将出现在该子组中，并设计为引用一个 Node3D 节点，我们稍后将创建它以用作摄像机控制器。这在图 8.16 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_229_0.png)\n\
  \nFigure 8.16 – 导出名为 Components 的组和名为 View 的变量\n\n如图 8.16 所示，添加 @export 注解可使变量直接在\
  \ Godot 编辑器中可编辑，允许你在不修改代码的情况下更改其值。这在测试时尤其有用，因为你可以在游戏运行时实时调整值。\n\n接下来，为玩家的移动属性导出另一个组，并为移动速度和跳跃强度添加变量：\n\
  \n```\n@export_subgroup(\"Properties\")\n@export var movement_speed = 250\n@export\
  \ var jump_strength = 7\n```\n\n因为这些变量在 Inspector 中可用，所以我们可以通过在测试游戏时调整值来找到玩家移动的合适手感。\n\
  \n现在让我们为玩家添加一些通用变量：\n\n- movement_velocity: 存储玩家在 3D 空间中的移动方式\n- rotation_direction:\
  \ 跟踪玩家转向的方向\n- gravity: 模拟重力对玩家的影响\n\n因此，让我们在 Player 脚本中添加以下行：\n\n```\nvar movement_velocity:\
  \ Vector3\nvar rotation_direction: float\nvar vertical_velocity = 0\n```\n\n让我们了解此代码片段中的重要元素：\n\
  \n- movement_velocity 存储基于玩家输入的移动速度向量\n- rotation_direction 保存角色应基于移动方向旋转的角度\n-\
  \ vertical_velocity 跟踪作用在角色上的垂直力\n\n除了移动之外，我们还需要变量来管理玩家的跳跃能力并跟踪可收集物品。具体来说，我们将添加变量来执行以下操作：\n\
  \n- 检测玩家是否在地面上\n- 控制单跳和双跳\n- 统计玩家收集了多少颗宝石\n\n让我们在脚本中定义这些变量：\n\n```\nvar previously_floored\
  \ = false\nvar jump_single = true\nvar jump_double = true\nvar gems = 0\nvar smoothing_factor\
  \ = 10\n\nconst GRAVITY = 25\n```\n\n在此代码片段中，previously_floored 跟踪角色在上一帧是否在地面上，这对于检测着陆很有用。当它在后续代码中使用时，这一点会更清楚。\n\
  \n最后，我们需要一个引用变量来表示角色的 3D 网格。我们将使用此引用在跳跃和着陆期间调整模型的比例——这是一种在动画中称为挤压和拉伸的简单增加视觉吸引力的方法。\n\
  \n```\n@onready var model = $MeshInstance3D\n```\n\n这行代码告诉 Godot 将 MeshInstance3D\
  \ 节点（当前节点的子节点）分配给变量 model，但仅在场景完全加载并准备就绪后。@onready 关键字确保在建立此引用时节点存在。\n\n## 添加引用变量的替代方法\n\
  \n有一种快捷方式可以添加引用变量，例如前面用于玩家模型的引用变量。你将要引用的节点拖入脚本，并在即将释放鼠标按钮时按住键盘上的 Ctrl。Godot 会自动为你输入引用，你也可以重命名它。这在图\
  \ 8.17 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_231_0.png)\n\nFigure 8.17\
  \ – 将节点拖入脚本并在释放时按住 Ctrl\n\n\n\n随着我们的 Player 脚本不断增长，保持其组织性和可读性非常重要。 而不是把所有逻辑写在一个长块中，我们将把它拆分为更小、更专注的函数。\
  \ 函数允许我们将相关的代码行归纳在单个名称下，使脚本更简洁、更易于理解，也更易于维护。\n\n在下一节中，我们将开始定义函数来处理角色行为的关键部分。 每个函数将专注于一项具体任务，帮助我们构建结构良好且可复用的角色控制器。\n\
  \n## Exploring functions\n\n如前所述，随着玩家变得更具交互性，控制它的脚本将变得更复杂。 为了保持代码整洁且易于管理，我们将把它拆分为函数：每个函数处理一项特定任务的可复用逻辑块。\n\
  \n在本节中，我们将定义函数来控制重力、处理移动输入、管理跳跃行为并跟踪 Gem 收集。 以这种方式组织代码是编写可扩展且可维护的 Godot 脚本的关键步骤。\n\
  \n让我们先创建一个处理重力的函数：\n\n```\nfunc handle_gravity(delta):\n    vertical_velocity +=\
  \ GRAVITY * delta\n    if vertical_velocity > 0 and is_on_floor():\n        jump_single\
  \ = true\n        vertical_velocity = 0\n```\n\n让我们分解一下：\n\n- vertical_velocity\
  \ += GRAVITY * delta: 这会随着时间逐渐增加重力，模拟下落效果\n- if vertical_velocity > 0 and is_on_floor():\
  \ 检查玩家是否正在下落（vertical_velocity > 0）并且已着地（is_on_floor() 返回 true）\n- jump_single =\
  \ true: 玩家着地后，我们允许他们再次跳跃\n- vertical_velocity = 0: 将垂直速度重置为零，以免玩家继续向下加速\n\n此函数确保玩家受重力影响，并且只有在着地后才能再次跳跃。\n\
  \n现在，让我们创建一个处理跳跃的函数：\n\n```\nfunc jump():\n    vertical_velocity = -jump_strength\n\
  \    model.scale = Vector3(0.5, 1.5, 0.5)\n\n    if jump_single:\n        jump_single\
  \ = false\n        jump_double = true\n    else:\n        jump_double = false\n\
  ```\n\n让我们详细查看：\n\n- vertical_velocity = -jump_strength: 将重力反转，推动玩家向上并产生跳跃效果。\n\
  - model.scale = Vector3(0.5, 1.5, 0.5): 添加挤压和拉伸视觉效果，压缩宽度并夸大玩家高度以增加游戏韵味。你将在第 10 章学习关于游戏韵味的内容。\n\
  - if jump_single: 检查这是否是第一次跳跃。\n- jump_single = false: 标记第一次跳跃已使用。\n- jump_double\
  \ = true: 在空中启用第二次跳跃。\n- else: 检查第一次跳跃是否已使用。\n- jump_double = false: 禁用进一步跳跃。\n\n\
  此函数在管理单跳和双跳逻辑的同时控制跳跃的物理效果和视觉反馈。\n\n在这一点上，为我们的控制方案创建自定义输入映射是良好的实践。 让我们在下一节深入探讨这一点。\n\
  \n## Creating an input map\n\nGodot 允许我们创建自己的输入映射，这是一个系统，可让我们定义自定义操作，例如 jump 或 move_left，并为每个操作分配一个或多个键、鼠标按钮或手柄输入。\
  \ 这有助于保持代码整洁和灵活，因为我们可以按名称引用操作，而无需直接检查特定的按键。\n\n现在，让我们查看创建输入映射的步骤：\n\n- 1. 首先，单击\
  \ **Project | Project Settings | Input Map**。\n- 2. 单击显示 **Add New Action** 的位置，输入操作名称，例如\
  \ `left`，然后按 *Enter*。 多次重复此操作，为 `right`、`up`、`down` 和 `jump` 添加名称。 稍后，我们需要用于独立移动摄像机的操作，因此添加诸如\
  \ `camera_left`、`camera_right`、`camera_up` 和 `camera_down` 之类的操作。\n- 3. 现在，为每个新操作单击\
  \ + 号，然后按您希望链接到该操作的键。 这在图 8.18 中显示。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_234_0.png)\n\
  \n图 8.18 – 添加我们自己的操作事件和键\n\n如图 8.18 所示，现在我们已创建自己的自定义操作来关联输入，可以继续创建玩家移动的函数。\n\n##\
  \ Implementing player controls and actions\n\n让我们添加 handle_controls 函数来处理玩家移动的控制：\n\
  \n```\nfunc handle_controls(delta):\n    # Movement\n    var input := Vector3.ZERO\n\
  \    input.x = Input.get_axis(\"left\", \"right\")\n    input.z = Input.get_axis(\"\
  up\", \"down\")\n\n    input = input.rotated(Vector3.UP, view.rotation.z)\n    if\
  \ input.length() > 1:\n        input = input.normalized()\n\n    movement_velocity\
  \ = input * movement_speed * delta\n\n    # Jumping\n    if Input.is_action_just_pressed(\"\
  jump\"):\n        if jump_single or jump_double:\n            jump()\n```\n\nhandle_controls\
  \ 函数将玩家方向（左、右、上或下）存储在 input 向量中。 然后，它根据摄像机位置调整玩家移动方向（input），使其与当前视角或方向对齐。 如果不进行此更改，移动将始终基于全局\
  \ x 和 z 位置，而不是根据玩家摄像机的视角而变化。\n\n为了使玩家在所有方向（尤其是对角线）的速度保持一致，我们必须规范化 input 向量（将其长度设为\
  \ 1）。 这可确保对角线移动不会比沿单个轴移动更快，否则同时按下两个键时会给玩家带来意外的速度提升。\n\n现在我们必须根据输入和速度更新移动速度。\n\n\
  为了处理跳跃，我们必须检测跳跃按钮是否已被按下，然后在玩家能够跳跃时（即单跳或双跳）调用 jump() 函数。\n\n## Handling game events\
  \ and feedback\n\n当玩家收集 Gems 时，我们将增加宝石计数并发送信号以提醒游戏的其他部分宝石计数已更改。 为此，我们将在脚本顶部创建自己的自定义信号。\n\
  \n作为脚本中的第二行代码，添加以下内容：\n\n```\nsignal gem_collected\n```\n\n现在，Inspector 中将出现一个新信号，如图\
  \ 8.19 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_236_0.png)\n\n图 8.19 – 创建自定义信号\n\
  \n接下来，我们将在脚本中创建一个名为 collect_gems() 的新函数。 该函数如下所示：\n\n```\nfunc collect_gems():\n\
  \    gems += 1\n    gem_collected.emit(gems)\n```\n\n在此函数中，我们将更新 Gems 的当前计数并发出 gem_collected\
  \ 信号，同时附带当前的 Gem 计数。\n\n现在，创建一个名为 handle_movement(delta) 的函数来处理玩家的移动，如以下代码所示并解释：\n\
  \n```\nfunc handle_movement(delta):\n    var applied_velocity: Vector3\n\n    applied_velocity\
  \ = velocity.lerp(movement_velocity,\n    delta * smoothing_factor)\n    applied_velocity.y\
  \ = -gravity\n    velocity = applied_velocity\n    move_and_slide()\n```\n\n这里，局部变量\
  \ applied_velocity 计算并存储每一帧玩家速度。 该计算使用 lerp 函数，该函数使用线性插值使当前速度（velocity）缓慢地向目标速度（movement_velocity）移动。\
  \ 这使玩家的移动更加平滑。\n\nNote\n\n**Linear interpolation** 是一种技术，通过让计算机计算并填充中间的所有值，从而平滑或逐渐地从一个值移动到另一个值。\n\
  \n将速度的垂直部分设为负重力可确保玩家在水平速度被插值时仍受重力影响。\n\n最后，如代码最后两行所示，我们必须更新当前速度并调用 move_and_slide\
  \ 以移动角色并检测碰撞。\n\n现在我们需要一个函数来处理玩家的旋转：\n\n```\nfunc handle_rotation(delta):\n    if\
  \ Vector2(velocity.z, velocity.x).length() > 0:\n        rotation_direction = Vector2(velocity.z,\n\
  \        velocity.x).angle()\n\n    rotation.y = lerp_angle(rotation.y, rotation_direction,\n\
  \    delta * smoothing_factor)\n```\n\n在前面的代码中，handle_rotation 函数检查玩家是否正在移动，然后通过以弧度计算移动方向的角度来更新\
  \ rotation_direction 全局变量。\n\n最后，角色的 y 轴使用角度插值平滑旋转以面向移动方向，以防止任何突然的旋转变化。\n\n\n\n\
  我们玩家的最终自定义函数将处理着陆时的重生和动画效果。按所示代码创建 handle_respawn() 函数：\n\n```\nfunc handle_respawn(delta):\n\
  \    var border_position_y = -10\n    # Threshold below which the player respawns\n\
  \    if position.y < border_position_y:\n        get_tree().reload_current_scene()\n\
  \n    # Animation for scale (jumping and landing)\n    model.scale = model.scale.lerp(Vector3(1,\
  \ 1, 1), delta\n    * smoothing_factor)\n\n    # Animation when landing\n    if\
  \ is_on_floor() and vertical_velocity > 2 and\n    !previously_floored:\n      \
  \  model.scale = Vector3(1.25, 0.75, 1.25)\n\n    previously_floored = is_on_floor()\n\
  ```\n\n让我们研究 handle_respawn() 函数：\n\n- **场景重载（重生）：** 如果玩家的位置.y 低于 -10（意味着他们已掉出关卡），我们调用\
  \ get_tree().reload_current_scene() 来重新加载当前场景并使玩家在起始位置重生。\n- **重置缩放（恢复大小）：** 我们使用\
  \ model.scale.lerp(Vector3(1, 1, 1), delta * smoothing_factor) 在跳跃或着陆产生的挤压和拉伸效果后，逐渐将玩家的缩放插值回正常状态。\n\
  - **着陆动画（挤压效果）：** 如果玩家当前在地面上（is_on_floor()），下落速度很快（gravity > 2），并且在上一帧不在地面上（!previously_floored），我们通过将\
  \ model.scale 改为 Vector3(1.25, 0.75, 1.25) 触发挤压效果。\n- **地面状态跟踪：** 最后，我们更新 previously_floored\
  \ 变量以跟踪玩家在上一帧是否在地面上。\n\n为了让所有这些机制平稳运行，我们需要在 Godot 的主物理循环中调用自定义函数：\n\n```\nfunc _physics_process(delta):\n\
  \    handle_controls(delta)\n    handle_gravity(delta)\n    handle_movement(delta)\n\
  \    handle_rotation(delta)\n    handle_respawn(delta)\n```\n\n_physics_process(delta)\
  \ 函数是 Godot 用于物理计算的内置循环，每帧物理帧调用一次（默认每秒 60 次）。它确保我们的游戏逻辑在任何帧率下都能一致运行。通过在此处调用自定义函数，我们可使重力、移动、跳跃、摄像机效果和重生与物理引擎保持同步。\n\
  \n现在我们的角色控制器已能正常工作——处理移动、跳跃和着陆动画——是时候设置摄像机，使其在 3D 空间中正确跟随玩家了。配置良好的摄像机通过帮助玩家保持方向感和专注于周围环境来提升游戏体验。在下一节中，我们将把摄像机连接到玩家并编写脚本，使其能平滑响应玩家的移动和旋转。\n\
  \n## 实现摄像机控制器\n\n开始配置摄像机时，我们将先创建一个新场景作为摄像机控制器，然后将其链接到玩家。\n\n- 1. 创建一个新场景并添加一个 Node3D\
  \ 节点作为根节点。将此节点重命名为 View。现在添加一个 Camera3D 节点作为子节点。场景树如图 8.20 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_239_0.png)\n\
  \n图 8.20 - View 的场景组成\n\n- 2. 选择 Camera3D 节点，并在 Inspector 中将 Current 属性设置为 On——标记此摄像机为要使用的摄像机。你还可以通过将\
  \ FOV 属性设置为 40 来调整视野范围。如图 8.21 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_240_0.png)\n\
  \n图 8.21 – 将摄像机设为当前并调整 FOV\n\n- 3. 现在，将脚本附加到 View 节点并将其保存为 view.gd。确保将模板设置为 Empty。\n\
  \n现在我们准备开始构建摄像机控制器脚本，该脚本将允许玩家使用键盘上的按键（我们在输入映射中定义）移动摄像机并调整缩放。\n\n摄像机需要一个目标节点来注视或聚焦。这将是我们的\
  \ Player 节点。我们将按以下代码所示将此目标导出为变量：\n\n```\n@export_group(\"Properties\")\n@export\
  \ var target: Node\n```\n\n此导出的 target 变量将出现在 Inspector 中，允许我们将 Player 节点拖放到其中。摄像机随后将知道它应该跟随什么。\n\
  \n现在导出变量以控制摄像机的缩放级别和旋转速度：\n\n```\n@export_group(\"Zoom\")\n@export var zoom_minimum\
  \ = 16\n@export var zoom_maximum = 4\n@export var zoom_speed = 10\n```\n\n这些变量定义了缩放行为：zoom_minimum\
  \ 和 zoom_maximum 决定摄像机可以缩放的进出范围。此外，zoom_speed 控制在触发输入时缩放发生的速度。\n\n接下来，让我们定义 rotation_speed\
  \ 变量：\n\n```\n@export_group(\"Rotation\")\n@export var rotation_speed = 120\n```\n\
  \n此变量设置摄像机在玩家旋转或使用输入转动摄像机时围绕玩家旋转的速度。\n\n我们将使用两个标准变量来跟踪摄像机的当前旋转和缩放：\n\n```\nvar camera_rotation:\
  \ Vector3\nvar zoom = 10\n```\n\n让我们进一步探讨：\n\n- camera_rotation 将存储摄像机的当前旋转角度（以度为单位）\n\
  - zoom 跟踪当前缩放值，我们将根据玩家输入随时间修改它\n\n最后，我们需要对场景中实际的 Camera3D 节点的引用，以便我们可以操作它：\n\n```\n\
  @onready var camera = $Camera3D\n```\n\n使用 @onready 可确保此变量在节点添加到场景并准备好使用时设置一次。\n\
  \n在内置的 _ready() 函数中，我们将存储摄像机的初始旋转：\n\n```\nfunc _ready():\n    camera_rotation =\
  \ rotation_degrees # Initial rotation\n```\n\n这使用摄像机的当前旋转角度初始化 camera_rotation 变量，以便我们可以从已知的起点更新和修改它。\n\
  \n与玩家类似，摄像机也可以在场景中移动。让我们创建一个函数来处理摄像机输入：\n\n```\nfunc handle_input(delta):\n    #\
  \ Rotation\n    var input := Vector3.ZERO\n    input.y = Input.get_axis(\"camera_left\"\
  , \"camera_right\")\n    input.x = Input.get_axis(\"camera_up\", \"camera_down\"\
  )\n\n    camera_rotation += input.limit_length(1.0) *\n    rotation_speed * delta\n\
  \    camera_rotation.x = clamp(camera_rotation.x, -80, -10)\n\n    # Zooming\n \
  \   zoom += Input.get_axis(\"zoom_in\", \"zoom_out\") *\n    zoom_speed * delta\n\
  \    zoom = clamp(zoom, zoom_maximum, zoom_minimum)\n```\n\nhandle_input(delta)\
  \ 函数根据玩家的输入处理摄像机旋转和缩放。水平和垂直旋转存储在名为 input 的变量中，基于用户按下的键。\n\n接下来，摄像机旋转根据此输入进行更新。输入限制为最大\
  \ 1.0，我们将其乘以 rotation_speed 变量和 delta 以使一切平滑。最后，我们将垂直旋转限制在 -80 到 -10 度之间。这是为了避免过度倾斜。\n\
  \n对于缩放，我们根据玩家输入更新 zoom 变量，然后将其乘以缩放速度和 delta 以确保平滑缩放。同样，我们将缩放级别限制在预定义的最小和最大缩放值之间。\n\
  \n接下来，_physics_process 函数需要按如下方式实现：\n\n```\nfunc _physics_process(delta):\n    #\
  \ Set position and rotation to targets\n    self.position = self.position.lerp(target.position,\n\
  \    delta * 4)\n    rotation_degrees =\n    rotation_degrees.lerp(camera_rotation,\
  \ delta * 6)\n\n    camera.position = camera.position.lerp(Vector3(0, 0,\n    zoom),\
  \ 8 * delta)\n\n    handle_input(delta)\n```\n\n再次使用线性插值使摄像机位置平滑地朝向目标（玩家）移动。\n\n\
  我们乘以 delta * 4 来控制重新定位的速度。\n\n现在当前旋转使用线性插值平滑地朝向期望旋转移动，并乘以 delta * 6 来控制速度。\n\n为了实现平滑的缩放效果，我们沿\
  \ z 轴移动摄像机位置以匹配缩放级别。我们乘以 delta * 8 来控制速度。\n\n最后，我们调用 handle_input(delta) 函数，该函数处理玩家的输入并控制摄像机的移动。\n\
  \n虽然我们希望一切按预期运行，但我们需要对其进行测试、修正，然后再次测试。这使得游戏开发成为一个迭代过程，我们进行更改，测试以查看更改是否产生预期结果，然后继续如此。因此，我们的下一步是测试我们迄今为止所做的工作。\n\
  \n\n\n## 运行测试\n\n返回 Level 1 场景。将 View 场景拖入关卡。将 Player 场景拖入关卡。选择 View 节点并将 Player\
  \ 场景拖入 View 的 Target 属性中，如图 8.22 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_244_0.png)\n\
  \n图 8.22 – 将玩家设为摄像机跟随的目标\n\n现在选择 Player 节点。在 Inspector 中，将 View 场景拖入 View 属性，使玩家使用我们的\
  \ View 场景作为摄像机控制器。这在图 8.23 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_244_1.png)\n\
  \n图 8.23 – 将我们的 View 场景设为玩家的摄像机控制器\n\n现在运行 Level 1 场景并测试游戏。你可以移动玩家和摄像机在关卡中移动！\n\n\
  ## 摘要\n\n本章中，我们探讨了如何为关卡构建和组织场景。我们首先使用 **StaticBody3D**、**MeshInstance3D** 和 **CollisionShape3D**\
  \ 节点创建简单的场景来表示游戏世界中的物体。\n\n接下来，我们设计了一个带有脚本以控制移动的 **Player** 场景，并添加了一个单独的 **View**\
  \ 场景，其中包含玩家可以控制的 **Camera3D** 节点。最后，我们通过组装复杂的关卡场景，将所有单独的场景组件组合在一起。\n\n在下一章中，我们将添加危险物和可收集物。\n\
  \n## 在 Discord 上加入我们的社区\n\n在作者和其他读者之间讨论，请加入我们社区的 Discord 空间：\n\nhttps://packt.link/godot-4-game-dev\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_245_0.png)\n\n## 9\n\n## 在 Godot 中创建\
  \ 3D 小游戏 — 第 2 部分\n\n精通游戏机制和完善玩家体验是创建引人入胜关卡的重要步骤。在本章中，我们将更深入地探讨设计交互式和动态元素，以增强游戏玩法并提升关卡整体手感。你将学习如何创建在短时间内赋予临时能力的收集型增益道具，引入挑战玩家的障碍，并添加视觉和音效效果让环境栩栩如生。\n\
  \n通过实践活动，你将实现一个暂时提升玩家跳跃高度的可收集物，使其能够到达新的平台。你将设计一个发射炮弹的大炮，为玩家提供一个激动人心的躲避挑战。最后，你将通过为动作添加音效反馈、为氛围添加背景音乐以及添加诸如移动云朵等视觉效果来打磨关卡，创造更具沉浸感的体验。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 探索可收集物\n- 引入障碍\n- 完成我们的关卡\n- 打磨我们的关卡\n\n到本章结束时，你将拥有一个完全可玩且视觉上吸引人的关卡，其机制在挑战与奖励之间取得平衡，为你未来处理更复杂的设计做好准备。\n\
  \n## 技术要求\n\n本章的代码文件可在本书的 GitHub 仓库中获取：https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch9\n\
  \n本项目使用的游戏资源由 Essssam 以 **Creative Commons Zero (CC0)** 许可证发布。Essssam 允许我们在任何媒介或格式上分发、remix、改编并基于该材料进行构建，甚至用于商业用途。\n\
  \n可在此处找到：https://essssam.itch.io/3d-leap-land\n\n访问此链接查看代码运行的视频：https://packt.link/SDDNS\n\
  \n## 探索可收集物\n\n**可收集物** 是一种为关卡添加目标的方式。通过分散放置，我们可以鼓励玩家并奖励他们的探索。可收集物还可以赋予玩家新的能力（临时或永久）或只是增加他们的分数。它们可以纯粹为了好玩而收集，也可以作为完成关卡的要求。我们将在关卡中添加一些宝石供玩家收集。\n\
  \n## 创建 Gem 场景\n\n现在我们了解了可收集物的作用，让我们使用 Godot 中的专用场景来构建第一个可收集物——Gem：\n\n1. 创建一个新场景，以\
  \ **Node3D** 节点作为根节点。\n2. 将其重命名为 Gem。3D 中的可收集物的工作方式与 2D 类似。在 2D 示例中，我们使用 **Area2D**\
  \ 节点和 **CollisionShape2D** 节点来检测 **CharacterBody2D** 节点何时进入 **Strawberry** 节点的区域。在\
  \ 3D 中，我们将使用 **Area3D** 节点和 **CollisionShape3D** 节点执行相同的操作，这使我们能够检测 **CharacterBody3D**\
  \ 节点（玩家）何时进入 Gem 的区域。\n3. 将 **Area3D** 节点添加为 **Gem** 的子节点。\n4. 然后添加一个 **MeshInstance3D**\
  \ 节点，以便我们拥有 Gem 本身的视觉模型。在 **MeshInstance3D node** 的 Mesh 属性中使用 `gem.obj` 文件作为网格。这与在\
  \ 2D 中为精灵添加纹理非常相似。请记住将 `palette.png` 纹理文件拖到场景中的 Gem 网格上以赋予其颜色。\n\n5. 最后，将 CollisionShape3D\
  \ 节点添加为 Area3D 的子节点。对于 Shape 属性，最简单的方法就是用 BoxShape3D 包含 Gem。所有这些在图 9.1 中显示：\n\n\
  ![](img/d34207e07c133a9e84d9caf1d479006c_249_0.png)\n\n图 9.1 – 设置 Gem 场景的组件\n\n\
  如 图 9.1 所示，Gem 可以检测到有东西进入其区域。然而，我们需要对其进行编程以按我们预期的方式做出反应。为此，我们将向 Gem 添加一个脚本。\n\n\
  ## 添加 Gem 脚本\n\n你应该问自己当玩家收集到 Gem 时希望它做什么。在我们的 2D 游戏中，我们要求玩家收集所有草莓才能完成关卡。在本游戏中，Gem\
  \ 将暂时提高玩家的跳跃高度，使他们能够到达最高平台，那里将放置检查点旗帜。\n\n在确定了 Gem 的用途后，让我们将其设置为暂时提升玩家跳跃高度的增益道具：\n\
  \n1. 首先将一个新脚本附加到 Gem 节点。\n2. 选择 Area3D 节点并按图 9.2 所示连接 body_entered 信号：\n3. 我们希望检查进入\
  \ Gems 区域的物体是否为玩家。为此，我们首先需要创建一个名为 player 的组并将玩家添加到其中。\n4. 返回 Player 场景。在 Inspector\
  \ 中，单击 Node，然后单击 Groups。单击 + 并添加一个名为 player 的组。将其设为 Global 组。这在图 9.3 中演示如下：\n\n\
  ![](img/d34207e07c133a9e84d9caf1d479006c_250_0.png)\n\n图 9.2 – 连接 Area3D 节点的 body_entered\
  \ 信号\n\n![](img/d34207e07c133a9e84d9caf1d479006c_250_1.png)\n\n图 9.3 – 创建玩家组\n\n\
  5. 一旦你创建了全局 **player** 组，如 *图 9.3* 所示，你会注意到 **Player** 场景现在是该组的一部分，因为 **player**\
  \ 组的复选框已被选中。\n\n6. 因为我们只想暂时提高玩家的跳跃高度，所以需要在玩家中添加一个计时器作为冷却机制。在 **Player** 场景中，添加一个\
  \ **Timer** 节点作为子节点。将其实名重命名为 Jump_cooldown_timer，如 *图 9.4* 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_251_0.png)\n\
  \n*图 9.4 – 为玩家添加计时器以使跳跃强度逐渐消失*\n\n7. 当玩家收集到 Gem 时，我们将启动计时器。如果计时器正在运行，玩家可以跳得更高，但一旦计时器超时，我们将跳跃强度恢复到初始值。在\
  \ **Inspector** 中，将计时器设为 **One Shot** 并将 **Wait Time** 设为 3 秒，如 *图 9.5* 所示：\n\n\
  ![](img/d34207e07c133a9e84d9caf1d479006c_251_1.png)\n\n*图 9.5 – 将跳跃增益道具设为持续 3 秒*\n\
  \n8. 如 *图 9.5* 所见，**Wait Time** 表示增强跳跃的持续时间。如果希望跳跃增益道具持续更久，只需增加此值即可。\n\n9. 接下来，按\
  \ *图 9.6* 所示连接 **Timer** 的 **timeout()** 信号：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_251_2.png)\n\
  \n*图 9.6 – 连接计时器的超时信号*\n\n\n\n10. 在图 9.6 所示的方式将计时器的 timeout() 信号连接到 Gem 脚本后，添加以下代码：\n\
  \n在第 23 行添加一个名为 default_jump_strength 的新变量，并将其值设为 7：\n\n```\nvar default_jump_strength\
  \ = 7\n```\n\n现在，按如下所示编写超时函数：\n\n```\nfunc _on_jump_cooldown_timer_timeout():\n\
  \    jump_strength = default_jump_strength\n```\n\n这段代码将在计时器达到持续时间（等待时间）后将跳跃强度重置为默认值。\n\
  \n\U0001F4A1 快速提示：使用 AI 代码解释器和快速复制功能提升您的编码体验。在 next-gen Packt Reader 中打开本书。点击复制按钮\
  \ (1) 快速将代码复制到您的编码环境，或点击解释按钮 (2) 让 AI 助手为您解释一段代码。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_252_0.png)\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_252_1.png)\n\n\U0001F512 next-gen Packt\
  \ Reader 随本书购买免费提供。扫描二维码或访问 packtpub.com/unlock，然后使用搜索栏按名称查找本书。仔细核对所示版本，确保获取正确的版本。\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_252_2.png)\n\n11. 在离开 Player 脚本之前，我们应该为计时器添加一个引用变量，以便我们可以从\
  \ Gem 场景启动它。在 MeshInstance3D 的 onready 变量下方，添加计时器的变量，如下所示：\n\n```\n@onready var\
  \ model = $MeshInstance3D\n@onready var jump_cooldown_timer = $Jump_cooldown_timer\n\
  ```\n\n12. 在 Player 脚本中，添加一个用于道具跳跃强度的变量：\n\n```\nvar powerup_jump_strength = 10\n\
  ```\n\n现在添加一个函数，在 Gem 被收集时增加跳跃强度并启动计时器：\n\n```\nfunc on_gem_collected():\n    jump_cooldown_timer.start()\n\
  \    jump_strength = powerup_jump_strength\n```\n\n13. Player 场景现在是 player 组的一部分。它还设置了计时器来计时增加的跳跃强度持续时间，并且我们已提供对计时器的访问。现在返回\
  \ Gem 场景以完成 body_entered() 函数：\n\n```\nfunc _on_area_3d_body_entered(body):\n  \
  \  if body.is_in_group(\"player\"):\n        body.on_gem_collected()\n        queue_free()\n\
  ```\n\n当有物体进入 Gem 区域时，这段代码将被触发。如果该物体属于 player 组，则该物体（玩家）会将 jump_strength 增加到 10。物体的\
  \ jump_cooldown 计时器会启动并运行直到超时，queue_free() 确保 Gem 将从场景中移除。\n\n14. 在 Level 场景中实例化一个\
  \ Gem 场景（在 Level 场景中按 Ctrl + Shift + A，然后选择 Gem 场景），并测试玩家在收集 Gem 后现在可以到达最高平台。您现在可以围绕关卡策略性地放置\
  \ Gems。\n\n玩家以 Gem 的形式获得奖励，Gem 会增加跳跃强度。现在我们将在关卡中添加一个障碍，使奖励没有那么容易获得。\n\n## 介绍障碍\n\
  \n障碍通过创建玩家必须绕过或克服的危险，为关卡引入挑战和刺激。它们鼓励玩家制定策略、提高技能，并在游戏中不断保持参与。随着游戏进程，障碍可以采用多种形式，例如移动平台、尖刺或环境陷阱，并可为游戏玩法增添多样性。在本节中，我们将在关卡中添加一些障碍来测试玩家的敏捷性和时机把握，创造更动态和更具奖励性的体验。\n\
  \n## 创建 Cannon 场景\n\n一个有趣且动态的障碍是添加一门大炮，定期发射子弹，玩家必须在到达检查点之前避开它。大炮是静态的，纯粹是装饰性的或布景。然而，子弹将从大炮移动，穿过关卡。按照以下步骤设置\
  \ Cannon 场景：\n\n- 1. 使用 Node3D 节点作为根节点创建一个新场景。将此重命名为 Cannon。\n- 2. 添加一个 StaticBody3D\
  \ 节点作为子节点。\n- 3. 添加一个 MeshInstance3D 节点并使用 cannon.obj 作为 Mesh 属性。\n- 4. 记得将 palette.png\
  \ 拖到大炮对象以进行纹理贴图。\n- 5. 添加一个 CollisionShape3D 节点并使用新的 BoxShape3D 属性将大炮包围。\n- 6. 添加一个\
  \ Timer 节点并将其重命名为 Cannonball_timer。\n- 7. 添加一个 Marker3D 节点并将其放置在大炮的炮口/开口处：x 位置 0.0，y\
  \ 位置 0.5，z 位置 -1.0。\n\n按照这些步骤，Cannon 场景树应如下图所示 9.7：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_254_0.png)\n\
  \n图 9.7 – Cannon 场景的场景树\n\n图 9.7 中的组件将用于使大炮发挥功能。它是一个静态体，因为它不会移动，但玩家可以跳到上面并站在上面。大炮弹计时器将定期生成炮弹，这些炮弹在关卡中移动。标记用于精确定位炮弹应出现的位置。\n\
  \n我们希望大炮每三秒发射一颗球。为此，调整 **Cannonball_timer** 节点的设置，如图 9.8 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_255_0.png)\n\
  \n图 9.8 – 炮弹计时器的设置\n\n使用图 9.8 所示的设置，大炮将每三秒自动发射一颗球。如果您想更改发射频率，请调整 **等待时间**。\n\n大炮现在已准备好进行脚本编写；然而，我们仍然需要一个球或子弹供其发射。我们现在将准备\
  \ **Ball** 场景，以便从大炮发射投射物。\n\n## 创建 Ball 场景\n\n创建一个新场景并使用 **CharacterBody3D** 节点作为根节点。将它重命名为\
  \ Ball。\n\n需要注意的是，我们通常会为投射物使用 **Area3D** 节点，因为这允许我们检测碰撞并触发事件，例如在撞击时应用伤害或销毁投射物。然而，在我们的游戏中，炮弹仅作为物理障碍物——它不会伤害玩家，但如果接触到玩家则应简单地将其推开。\n\
  \n按照以下步骤完成 Ball 场景：\n\n- 1. 您已经使用 **CharacterBody3D** 节点作为根节点创建了一个新场景。\n- 2. 您已将根节点重命名为\
  \ **Ball**。\n- 3. 添加一个 **MeshInstance3D** 节点作为子节点并使用 Bullet.obj 作为 Mesh 属性。\n- 4.\
  \ 将 palette.png 应用为子弹对象的纹理。\n- 5. 添加一个 **CollisionShape3D** 节点并用新的 **CapsuleShape3D**\
  \ 包围子弹。\n- 6. 在 *x* 轴上旋转 **CapsuleShape3D** 并调整其大小以 neat 地贴合模型。\n- 7. 添加一个 **Timer**\
  \ 节点并将其重命名为 `Destroy_timer`。\n\n按照这些步骤，**Ball** 场景树应如下图所示 *图 9.9*：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_256_0.png)\n\
  \n*图 9.9 – Ball 场景的组件*\n\n*图 9.9* 中看到的一个重要组件是球的 **Destroy_timer** 节点。它代表球的生命周期。一旦超时，我们销毁球并将场景从关卡中移除。将计时器的设置调整为\
  \ *图 9.10* 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_256_1.png)\n\n*图 9.10\
  \ – 用于销毁球的计时器设置*\n\n*图 9.10* 将球的生命周期设置为 5 秒；计时器自动启动，但每个球仅运行一次。球需要在关卡中穿行并被销毁。为此，我们将编写脚本。\n\
  \n## 编写 Ball 脚本\n\n没有炮弹，大炮用处不大——所以让我们用脚本赋予它们生命，该脚本处理它们的移动和碰撞。请按照以下步骤操作：\n\n- 1.\
  \ 将脚本附加到 **Ball** 节点。设置一个 speed 变量并赋值为 3。这是一个导出变量，以便您在测试游戏时可以更改此值，从而找到最适合您游戏的值：\n\
  - 2. 在 process 函数中，我们将沿 z 轴移动球。这是深度轴，表示球朝向或远离我们进入或离开屏幕移动。为了平滑移动球，我们将通过 *相乘* speed\
  \ 与 delta 来改变位置，如下所示：\n- 3. 连接 **Destroy_timer** 的 **timeout()** 信号，并在其中编写代码，使球在达到计时器的等待时间后被销毁：\n\
  \n```\n@export var speed = 3\n```\n\n```\nfunc _process(delta):\n    position.z\
  \ -= speed * delta\n```\n\n```\nfunc _on_destroy_timer_timeout():\n    queue_free()\n\
  ```\n\n有了这个脚本，炮弹可以完成我们想要的两个任务。它可以在关卡中移动，并在一定时间后被销毁。现在为大炮编写脚本以生成炮弹。\n\n## 编写 Cannon\
  \ 脚本\n\n要编写 Cannon 脚本，首先，我们将脚本附加到 **Cannon** 节点。在整本书中，我对应在场景首次创建时初始化的变量使用了 @onready\
  \ var。这次，我将向您展示使用 _ready 函数初始化变量的替代快捷方式。让我们在这里看看：\n\n- 1. 我们将实例化 **Ball** 场景（生成一个球），因此我们需要一个场景变量来存储对\
  \ **Ball** 场景的引用。我们还需要一个变量来表示球本身（ball 变量），它将是场景的一个实例。我们还需要一个引用变量（marker 变量）指向 **Marker3D**\
  \ 节点，以便我们可以将球定位到不可见标记所在的位置：\n\n```\nvar ball_scene\nvar ball_instance\nvar marker\n\
  ```\n\n\n\n2. 前述代码中的变量均未初始化，也就是说它们没有初始值。我们将在 _ready() 函数中为它们赋值：\n\n```\n#### Called\
  \ when the node is added to the scene tree\nfunc _ready():\n    # Load (preload)\
  \ the Ball scene so we can create a new instance of it\n    ball_scene = preload(\"\
  res://Assets/Scenes/ball.tscn\")\n\n    # Load (preload) the Smoke Particle scene\
  \ for visual effects\n    particles = preload(\"res://Assets/Scenes/smoke.tscn\"\
  )\n\n    # Create an instance of the Ball from the preloaded scene\n    ball_instance\
  \ = ball_scene.instantiate()\n\n    # Get a reference to the Marker3D node in the\
  \ scene\n    marker = $Marker3D\n\n    # Set the Ball's position to the same location\
  \ as the Marker3D\n    ball_instance.position = marker.position\n\n    # Add the\
  \ ball instance to the current scene as a child\n    add_child(ball_instance)\n\
  ```\n\n_ready 函数在火炮被添加到场景时只调用一次，用于设置火炮的初始状态。下面对这里的代码进行逐行解释：\n\n- 从指定路径加载炮弹场景，并将其存储在\
  \ ball_scene 变量中。preload 关键字确保场景在游戏运行时即可使用，并且在使用 GDScript 时相比 load 函数提供了性能提升。\n\
  - Ball 场景的一个实例（原始场景的副本）存储在 ball_instance 变量中。\n- Marker3D 节点的引用存储在 marker 变量中。\n\
  - 新创建的炮弹的位置被设置为与 marker 的位置相匹配。\n- 最后，球实例被添加到 Cannon 节点层级（场景树）中，使其在场景中可见并处于活动状态。\n\
  \n3. 为了让火炮以规律的速率发射炮弹，我们需要使用 **Cannonball_timer**。连接 timeout() 信号并添加以下代码：\n\n```\n\
  func _on_cannonball_timer_timeout():\n    ball = ball_scene.instantiate()\n    ball.position\
  \ = marker.position\n    add_child(ball)\n```\n\n因为我们将 **Wait Time** 设置为 3 秒，所以\
  \ timeout() 函数中的代码每 3 秒运行一次。将在 marker 位置创建一个新的炮弹实例，并将其添加到 **Cannon** 场景的层级中。此计时器确保炮弹从火炮中重复发射。\n\
  \n4. 在 **Level** 场景中实例化 **Cannon** 场景，并测试一切是否按预期工作。\n\n该关卡现在拥有可收集物和障碍物。我们现在应关注胜利条件或目标。为此，我们将放置一面用户必须到达以完成关卡的旗帜。\n\
  \n## 完成我们的关卡\n\n要完成关卡，玩家必须到达 *flag*。旗帜位于最高平台上，唯一到达它的方式是获得 Gem 来增强玩家的跳跃能力，避开炮弹并冲向旗帜。\n\
  \n这些都是设计决策，关卡中的资源让我们可以考虑不同的选项。我们本可以要求玩家获得钥匙来解锁通往旗帜的大门。这就是游戏开发如此令人满意的原因！现在我们应该为旗帜创建一个场景。\n\
  \n## 创建 Flag 场景\n\n在创建 **Flag** 场景之前，确定旗帜应该做什么会很有帮助，因为这有助于我们确定使用哪些节点。在我们的简单案例中，旗帜唯一需要做的就是在玩家触碰到它时退出游戏。当然，如果我们制作更多关卡，同样可以轻松切换关卡。知道这一点，**Area3D**\
  \ 节点是旗帜的最佳选择。按照以下步骤进行设置：\n\n- 1. 使用 **Area3D** 作为根节点创建一个新场景。\n- 2. 将其重命名为 Flag。\n\
  - 3. 添加一个 **MeshInstance3D** 节点并使用 `flag.obj` 作为 Mesh 属性。\n- 4. 应用 palette.png 来为旗帜贴图。\n\
  - 5. 将 **CollisionShape3D** 节点作为旗帜的子节点添加。\n- 6. 用 **New BoxShape3D** 包围旗帜。\n\n按照步骤操作后，您的\
  \ **Flag** 场景层级将如下图 9.11 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_260_0.png)\n\
  \n图 9.11 – Flag 场景层级\n\n- 7. 我们再次利用 **Area3D** 节点的多功能性来检测 **CharacterBody** 节点（例如玩家）何时进入其空间。为\
  \ **Flag** 节点添加一个脚本并将其保存为 flag.gd。\n- 8. 现在连接 **Flag** 节点的 _on_body_entered 信号，然后按如下方式编写代码：\n\
  \n```\nextends Area3D\nfunc _on_body_entered(body):\n    if body.is_in_group(\"\
  player\"):\n        get_tree().quit()\n```\n\n这段简单的代码测试进入旗帜空间的物体是否在 **player** 组中。如果是，我们就退出游戏。\n\
  \n## 切换场景\n\n创建多个关卡超出了本书的范围；然而，如果你创建了另一个关卡并希望玩家到达旗帜后切换到它，这非常简单。\n\n首先，你需要将第二个关卡创建并保存为场景，例如\
  \ level_2.tscn。将场景文件的路径保存在变量中，然后使用内置的 get_tree().change_scene_to_file() 函数切换到下一个场景。代码如下所示：\n\
  \n```\nextends Area3D\nfunc _on_body_entered(body):\n    if body.is_in_group(\"\
  player\"):\n        var next_scene_file =\n        \"res://scenes/level_2.tscn\"\
  \n        get_tree().change_scene_to_file(next_scene_file)\n```\n\n此代码检查玩家是否进入了特定区域。如果是，则加载游戏的下一关。它使用组来确保只有玩家触发该操作。它使用场景路径来确定要加载哪个关卡。下面逐行解释：\n\
  \n- 当一个物体进入旗帜的区域时\n- 代码检查该物体是否在 \"player\" 组中\n- 将关卡 2 场景文件的路径存储在名为 next_scene 的变量中\n\
  - 使用 change_scene_to_file 方法切换到已保存的场景\n\n现在玩家有可收集的增益道具、可避免的障碍和需要到达的目标，关卡已可基本游玩。让我们现在着手为关卡添加润色，例如粒子、移动和颜色。\n\
  \n## 润色我们的关卡\n\n创建一个功能性关卡是游戏开发中的重要第一步，但要使其在视觉上吸引人并让玩家沉浸其中，需要额外的努力——这就是关卡润色的作用所在。\n\
  \n润色关卡意味着通过动态视觉、流畅动画和鲜艳效果等元素来增强其外观和手感。这些补充不仅使游戏更具沉浸感，还有助于传达氛围、增添个性并使游戏玩法更令人满意。\n\
  \n在本节中，我们将探讨如何添加移动、颜色和粒子效果为关卡注入活力，将其从基本设计转变为玩家会喜欢的体验。\n\nGodot 提供了一个名为 WorldEnvironment\
  \ 的节点，用于设置整个场景的默认环境属性，包括后期处理效果、照明和背景设置。\n\n在 Level 1 场景中，添加一个 WorldEnvironment 节点。在\
  \ Inspector 中，找到 Environment 属性并选择 New Environment。如图 9.12 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_261_0.png)\n\
  \n图 9.12 – 向世界添加新环境\n\n一旦我们加载了新环境，如图 9.12 所示，我们现在可以访问更多属性和设置。\n\n## 设置背景颜色\n\n通过点击\
  \ **Environment**，选择 **Background**，然后选择 **Custom Color**，并找到天蓝色，将关卡的背景颜色更改为天蓝色。如图\
  \ 9.13 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_262_0.png)\n\n图 9.13 – 为关卡设置自定义背景颜色\n\
  \n现在我们已为关卡添加了背景颜色，如图 9.13 所示，我们应该在每次发射后为火炮添加一些烟雾效果。\n\n## 添加粒子效果\n\n**Particle effects**\
  \ 是游戏开发中为游戏增添视觉魅力并增强氛围的强大工具。它们可以模拟各种自然现象，如火焰、烟雾、雨水或爆炸，也可以创建抽象效果，如闪光、轨迹或魔法光晕。通过融入粒子效果，你可以让游戏感觉更具动态性和吸引力，帮助玩家更好地与你创造的世界产生联系。在本节中，我们将探讨如何创建和自定义粒子效果以让场景栩栩如生。\n\
  \n## 创建烟雾场景\n\n如前所述，我们将创建一个小烟雾 puff，在每次炮击后升入天空。我们将使用其中一个云模型，并将其缩小并旋转。按照以下步骤创建烟雾场景：\n\
  \n- 1. 使用 **CPUParticles3D** 作为根节点创建一个新场景。\n- 2. 将节点重命名为 Smoke。\n- 3. 展开 **Drawing**\
  \ 部分并找到 **Mesh** 属性。\n\n\n\n4. 将 cloud_1.obj 文件拖入 Mesh 属性中。这在图 9.14 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_263_0.png)\n\
  \n图 9.14 – 使用其中一个云作为 Mesh 来表示烟雾\n\n5. 记得通过应用 palette.png 纹理来为网格贴图。\n\n6. 展开 Gravity\
  \ 部分并使 y 值变为正值。完成后，烟雾会上升。\n\n7. 将 Amount 属性减少到 1，以便一缕烟雾从大炮中升起。\n\n8. 将 One Shot\
  \ 属性设置为 On。这在图 9.15 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_263_1.png)\n\
  \n图 9.15 - 更改数量并将 One Shot 设置为 On\n\n9. 通过展开 **Node3D** 的 **Transform** 部分并将 z 轴旋转\
  \ 90 度，使云垂直定向。这在图 9.16 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_264_0.png)\n\
  \n图 9.16 – 在 z 轴上旋转模型使其垂直\n\n10. 随时间调整云的缩放比例，从 0 到完整大小（1）。通过展开 **Scale** 部分并将 **Scale\
  \ Amount Minimum** 设置为 0，**Scale Amount Maximum** 设置为 1 来实现。\n\n11. 通过点击 **New Curve**\
  \ 创建 **Scale Amount** 曲线并随时间调整缩放比例，如图 9.17 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_264_1.png)\n\
  \n图 9.17 – 设置最小值、最大值和缩放曲线\n\n这将缩放比例从 0 设置到 1；不过，我建议尝试不同的曲线值，直到找到满意的结果。\n\n烟雾场景已完成，可以在\
  \ Cannon 脚本中实例化。当我们在 Cannon 脚本中实例化一个炮弹时，之后应立即实例化烟雾。现在，让我们返回到 Cannon 脚本。\n\n12. 添加两个新的全局变量\
  \ particles（用于引用粒子场景文件）和 smoke（作为场景的实例）：\n\n```\nextends Node3D\nvar ball_scene\n\
  var ball_instance\nvar marker\nvar particles\nvar smoke\n```\n\n13. 修改 _ready 函数，以便我们也预加载烟雾粒子场景。以下代码中新增的行已注释。创建烟雾实例，将其定位到标记处，使其成为\
  \ Cannon 场景的子节点，并将 emitting 属性设置为 true：\n\n```\nfunc _ready():\n    scene = preload(\"\
  res://scenes/ball.tscn\")\n    particles = preload(\"res://scenes/smoke.tscn\")\n\
  \    ball = scene.instantiate()\n\n    # Create an instance of the smoke particles\n\
  \    smoke = particles.instantiate()\n\n    marker = $Marker3D\n    ball.position\
  \ = marker.position\n\n    # Also place the smoke effect at the Marker3D position\n\
  \    smoke.position = marker.position\n\n    add_child(ball)\n\n    # Add the smoke\
  \ effect to the current scene as a child\n    add_child(smoke)\n```\n\n```gdscript\n\
  #### Start the smoke particle effect so it emits immediately\nsmoke.emitting = true\n\
  ```\n\n14. 最后，我们必须在 timeout 函数中创建新实例，以便每次大炮发射时都出现一缕烟雾：\n\n```gdscript\nfunc _on_cannonball_timer_timeout():\n\
  \    ball_instance = ball_scene.instantiate()\n    smoke = particles.instantiate()\n\
  \    smoke.position = marker.position\n    ball_instance.position = marker.position\n\
  \    add_child(ball_instance)\n    add_child(smoke)\n    smoke.emitting = true\n\
  ```\n\n通过对大炮脚本的这些修改，你可以再次测试关卡。你会注意到每次发射炮弹时，都会有两朵小烟云飘向空中。这是一种为关卡增添动感的简单方法。\n\n另一种使关卡更具吸引力的方法是添加音频，例如音效和背景音乐。在下一节中，我们将学习如何处理音频。\n\
  \n## Adding audio to our level\n\n如果玩家角色在跳跃时发出声音会很有趣！让我们添加一些音频！\n\n- 1. 为此，我们需要自己录制声音或找到一个处于公共领域且具有\
  \ Creative Commons 许可的声音。这里有一个可用于本项目的声音：https://opengameart.org/content/jump-sound-16bit.\n\
  - 2. 下载 jump.wav 文件。在 **FileSystem** 中，进入 assets 文件夹，并创建一个名为 audio 的子文件夹。按图 9.18\
  \ 所示将声音文件拖入其中：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_267_0.png)\n\n图 9.18\
  \ – 将 jump.wav 文件添加到我们的 audio 文件夹\n\n3. 打开 Player 场景并添加一个 AudioStreamPlayer 节点作为子节点。在\
  \ Stream 属性中，拖放音频文件。保持其他属性不变。这在图 9.19 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_267_1.png)\n\
  \n图 9.19 – 为 AudioStreamPlayer 提供要播放的声音文件\n\n4. 打开 Player 脚本并为 AudioStreamPlayer\
  \ 添加一个引用变量到你的 onready 变量列表中：\n\n```\n@onready var model = $MeshInstance3D\n@onready\
  \ var jump_cooldown_timer = $Jump_cooldown_timer\n@onready var audio_stream_player\
  \ = $AudioStreamPlayer\n```\n\n5. 我们只希望在玩家跳跃时播放跳跃音效。为此，我们告诉 AudioStreamPlayer 在\
  \ jump 函数运行时播放文件。将该请求添加为 jump 函数的第一行：\n\n```\nfunc jump():\n    audio_stream_player.play()\n\
  ```\n\n6. 这就是在玩家跳跃时播放音效所需做的全部。\n\n但如果我们想在玩家落地时播放音效呢？\n\n1. 从 Open Game Art 获取另一个\
  \ CC0 许可的音效（https://opengameart.org/content/jump-landing-sound）并将其添加到 audio 文件夹。\n\
  \n2. 为了在正确的时间播放正确的声音，代码必须调整为先将对应的音频文件加载到 AudioStreamPlayer 中，然后再尝试播放。\n\n3. 在 jump\
  \ 函数的第一行添加另一行，先加载文件再播放：\n\n```\nfunc jump():\n    audio_stream_player.stream =\n\
  \    preload(\"res://assets/audio/jump.wav\")\n    audio_stream_player.play()\n\
  ```\n\n4. 同样地，当玩家落地时，我们必须加载对应的音频文件然后播放。在 handle_respawn() 函数中，在玩家落地时缩放玩家之后添加这些行即可：\n\
  \n```\nif is_on_floor() and gravity > 2 and !previously_floored:\n    model.scale\
  \ = Vector3(1.25, 0.75, 1.25)\n    audio_stream_player.stream =\n    preload(\"\
  res://assets/audio/jumpland.wav\")\n    audio_stream_player.play()\n```\n\n5. 使用代码中的技术，我们确保在播放之前将正确的音频文件加载到播放器中。下一步是在关卡中添加背景音乐。首先下载背景音乐（https://opengameart.org/content/background-music-2-the-ice-caves）并将其添加到\
  \ audio 文件夹。\n\n6. 这次，我们将在 **Level 1** 场景中添加一个 **AudioStreamPlayer** 节点。我们将 Background\
  \ Music 2.ogg 文件拖放到 **Stream** 属性中。将 **Autoplay** 属性设置为 **On**。这在图 9.20 中显示：\n\n\
  ![](img/d34207e07c133a9e84d9caf1d479006c_269_0.png)\n\n图 9.20 - 设置 Stream 播放器的 Autoplay\
  \ 属性\n\n7. 还有最后一步，那就是确保音轨循环。展开 **Parameters** 部分并按图 9.21 所示打开循环：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_269_1.png)\n\
  \n图 9.21 - 为背景音乐打开循环\n\n如图 9.21 所示，通过打开循环，我们可以让背景音乐在关卡中重复播放。\n\n在游戏设计中，重复性运动常用于创建动态逼真的效果，例如云朵在天空中漂移、海浪拍打岸边，或道具缓慢旋转或上下悬浮。这类运动通常通过使用正弦波的振荡，以平滑自然的方式来回调整物体的属性（例如位置、大小或角度）来实现。在我们最后的部分中，我们将使用正弦函数使关卡中的云朵缓慢地来回移动。\n\
  \n## Using the sine function\n\n如前所述，与其让云朵静止在天空中，我们将使用正弦波使它们来回漂移。返回 Cloud 场景并将脚本附加到根节点（Cloud）。\n\
  \n使云朵漂移的完整代码如下所示，之后将逐行解释：\n\n```gdscript\nextends Node3D\n@onready var mesh_instance_3d:\
  \ MeshInstance3D = $MeshInstance3D\nvar time: float\nfunc _process(delta):\n   \
  \ time += delta\n    mesh_instance_3d.position =\n    Vector3(get_sine(),get_sine(),get_sine())\n\
  \nfunc get_sine():\n    return sin(time * 0.5) * 0.5\n```\n\n让我们在这里分解这段代码，以便更好地理解：\n\
  \n- 声明一个名为 time 的 float 变量来跟踪经过的时间。它用于计算移动的正弦波。\n- 为云的 StaticBody3D 节点创建了一个引用，因为这本质上是我们将要移动的云对象。\n\
  - 在 process 函数中，我们每帧增加 time 变量。这确保正弦波动画随时间平滑进展。\n- 接下来，在每一帧更新云（StaticBody3D）的 position\
  \ 属性。\n- x,y, 和 z 坐标使用 get_sine() 函数设置，该函数产生平滑的振荡值。\n- get_sine() 函数基于 time 变量计算平滑的振荡。\n\
  \n\n\n- `time * 0.5` 是波的 **频率**，这会减缓振荡。\n- 在括号外将结果乘以 0.5 是波的 **振幅**。在这里，我们减小了它，使运动不那么极端。\n\
  - 整个结果被返回，用于在 transform 属性中更新位置。\n\n本质上，此脚本为云创建了平滑的振荡运动。正弦波使运动更自然。\n\n## 摘要\n\n\
  在本章中，你通过添加关键的游戏玩法元素并完善其整体呈现，将你的关卡转变为动态且引人入胜的体验。你创建了一个可收集的强化道具，它暂时提升了玩家的跳跃高度，使他们能够到达更高的平台并完成关卡。我们引入了大炮障碍物，这增加了挑战层，因为玩家必须躲避其炮弹。\n\
  \n为了完成关卡，你实现了旗帜机制，为玩家提供了清晰且令人满意的目标。最后，你通过添加用于反馈的声音效果、营造氛围的背景音乐以及用于视觉效果的移动云朵来打磨关卡。\n\
  \n在本章结束时，你不仅开发了有趣且互动关卡的基本机制，还增强了其呈现效果，使其对玩家来说更具沉浸感和乐趣。这些技能将为未来创建更复杂和精致的关卡奠定坚实的基础。\n\
