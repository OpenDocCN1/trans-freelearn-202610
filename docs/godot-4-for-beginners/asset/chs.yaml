  ## 原型


  通常，你会想要测试想法、功能和机制。当你开发原型来测试这些想法时，应将其链接到你的 GDD。尽可能提供有关原型的详细信息，包括制作日期、原型的目的以及它在测试什么。你还应包括这如何改变了游戏设计。


  以下是来自 SILENT STATION 的示例：


  - 原型 1：敌人 AI 声音检测测试

  - 原型 2：手电筒电池耗尽与关卡节奏


  ## 试玩测试


  在开发游戏时，你会进行大量试玩测试。这是游戏开发中的一个基本步骤，因为它是一个增量过程。你的文档中应包含你进行的每项测试的结果链接。


  该页面应包含以下内容的概述：


  - 你在测试什么？

  - 为什么要测试它？

  - 从测试中学到了什么？

  - 它如何影响游戏开发？


  以下是来自 SILENT STATION 的示例：


  *Playtest 1 揭示玩家不理解声音如何影响敌人行为 → 在早期关卡中添加了细微的音频教程*


  Figure 11.9 演示了灰盒的概念，这是游戏开发早期测试阶段使用的技术。在灰盒中，使用简单的形状和占位符图形来构建关卡布局，然后再添加最终美术或资源。这使开发人员能够专注于测试核心游戏机制，例如移动、碰撞、关卡流程和挑战平衡，而不会被视觉效果分散注意力。


  ![](img/d34207e07c133a9e84d9caf1d479006c_321_0.png)


  Figure 11.9 – 记录每次测试的所有结果 (Credit: https://kenney.nl/)


  灰盒是更广泛的测试和试玩测试过程的重要组成部分，有助于团队及早发现设计问题、完善玩家体验，并在投入精致视觉效果之前确保游戏有趣且功能正常。


  ## 归档


  随着时间的推移，你会尝试许多不同的想法并测试多个不同的功能来开发你的游戏。这些想法并非全部有效，因此，不要丢弃它们，而是创建一个归档并将它们存储在那里。


  在开发的更后期阶段，这些想法和功能的部分内容可能有用。归档还将让你了解你的设计如何随着时间推移而发展，你可以很好地了解自己取得了多少进展。


  以下是来自 SILENT STATION 的示例：


  *为两名玩家合作的原始想法已归档，但可能在扩展包中回归*


  ![](img/d34207e07c133a9e84d9caf1d479006c_322_0.png)


  Figure 11.10 – 从归档中提取想法并在你的设计其他地方使用它们 (Credit: https://kenney.nl/)


  ## 当前关注点和考虑因素


  由于你会刻意限制范围，通常仅限于 MVP 或垂直切片所需的范围，许多想法和功能将无法进入生产。然而，它们可以被标记为游戏未来扩展的用途。




  同样地，你可能对已实现的功能有所担忧，并且它们目前可能尚未解决或工作方式并不完全符合你的预期。你应该在此列出这些问题，一旦它们得到解决，就应将它们移至已解决问题的新的页面或章节，并详细描述问题是什么以及如何解决的。


  以下是来自 *SILENT STATION* 的示例：


  *对所有平台麦克风支持的不确定性*


  ## 实现细节


  游戏中每个功能、系统和机制都需要文档来详细说明其实现的细节。它们应详细展示开发者如何实现每个元素。这是设计关注度最低的页面，而更侧重于开发。它应回答以下问题：


  - 需要哪些算法和数据结构？

  - 导航、资源和对话等功能是如何实现的？

  - 需要哪些程序化系统？

  - 游戏的经济系统如何运作？

  - 需要什么样的网络架构？

  - 目标硬件是什么？

  - 是否有用于测试目的的游戏作弊码？

  - 项目文件夹结构是什么，文件命名规范是什么？


  以下是来自 *SILENT STATION* 的示例：


  - *声音检测系统使用射线检测和动态分贝阈值*

  - *敌人使用状态机在巡逻、警戒和追击之间切换*


  在实现细节到位后，设计文档从概念性想法转向实际执行。


  本节确保开发者拥有清晰的蓝图，以便有效地构建游戏的系统。在基础工作完成后，下一步是考虑所有这些元素如何在生产、测试和迭代过程中结合在一起。


  ## 摘要


  在本章中，我们探讨了游戏设计在游戏开发中的关键作用，特别关注 GDD 的结构和目的。我们详细分解了 GDD 的每个部分，涵盖从标题和团队构成到货币化策略、游戏系统、原型和游戏测试等各个方面。


  通过梳理关键标题——例如概念陈述、受众、USP、资产、玩家成长和视听风格——我们制定了记录游戏每个重要方面的清晰框架。这种结构化方法确保想法得到良好传达、可行且与项目的目标保持一致。


  创建设计文档，即使是针对一个小型的单屏游戏，也不仅仅是一种形式——它是让你的愿景变为现实的重要一步。它为开发提供了路线图，帮助你保持专注和一致，同时预见潜在挑战。此外，一个清晰且组织良好的
  GDD 充当协作的宝贵工具，无论你是独自工作还是团队合作，都能确保所有参与者理解游戏的核心思想和方向。


  最终，投入时间制作 GDD 可以简化开发流程，减少昂贵的修改，并为精致、引人入胜的玩家体验奠定基础。无论你是在构建一个简单的游戏还是一个复杂的多个关卡冒险，深思熟虑的设计规划是将创意想法转变为可玩现实的东西。


  现在你已经了解如何详细规划和记录你的游戏，下一个章节将指导你在设计完成后会发生什么。你将探索教育资源、练习技能的方法、与游戏开发社区建立联系、找到有用的工具和资产，并开始建立你的作品集。你还将学习如何提出引人注目的游戏创意并为未来的项目遵循设计流程。


