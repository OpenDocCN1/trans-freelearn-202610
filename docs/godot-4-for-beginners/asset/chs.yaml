  ![](img/d34207e07c133a9e84d9caf1d479006c_293_0.png)\n\n图 10.22 – 将彩纸炮添加到 CheckPoint\
  \ 场景\n\n一旦彩纸炮成为 CheckPoint 场景的一部分，我们需要在 check_point.gd 中添加一些代码，以便在关卡完成后调用 fire 方法。\n\
  \n在场景树中单击 **CheckPoint (Area2D)** 节点以选中它。现在，单击 **Node** 选项卡，然后单击 **Signals** 选项卡。连接\
  \ on_body_entered() 信号并按如下方式编写代码：\n\n```gdscript\nfunc _on_body_entered(body):\n\
  \    if level_complete:\n        $Confetti_Cannon.fire()\n```\n\n前面的代码在接收到 _on_body_entered()\
  \ 信号时被调用。这意味着玩家已与检查点旗帜发生碰撞。然后，如果 level_complete 布尔值设置为 true，则会调用彩纸炮的 fire() 方法。fire()\
  \ 方法随后将炮中所有彩纸的 emitting 属性设置为 true。\n\n现在一切就绪，当你完成关卡并触碰检查点旗帜时，你将获得一次令人愉悦的彩纸爆发作为奖励。\n\
  \n在最后一节中，我们将学习如何为关卡添加音效和音频，以增加另一层精致感和氛围。\n\n## 添加音频和音效\n\n声音是游戏开发中的强大工具，以视觉 alone\
  \ 无法实现的方式塑造玩家的体验。精心制作的原声带设定了氛围，无论是快节奏的动作序列还是平静的探索场景。同时，音效为玩家操作提供即时反馈，使游戏世界感觉更生动、更具响应性。\n\
  \n在本节中，我们将探讨如何通过音频增强游戏的感觉。我们将添加背景音乐以营造氛围，并为关键交互引入音效，例如收集物品、受到伤害或完成关卡。到本节结束时，你将了解如何实现和微调音频以使游戏更具沉浸感和吸引力。\n\
  \n那么，让我们通过添加一些有趣的背景音乐使关卡更愉快。**Incompetech** 是一个很好的免版税音乐资源：\n\nhttps://incompetech.com/music/royalty-free/music.html\n\
  \n我从该网站选择了 Kevin MacLeod 的曲目 *Adventures in Adventureland*。该曲目采用知识共享：署名 4.0 许可（http://creativecommons.org/licenses/by/4.0/）。\n\
  \n让我们开始在 Assets 文件夹中新建一个名为 Audio 的子文件夹，并将 Adventures in Adventureland.mp3 文件拖放到其中，如图\
  \ 10.23 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_295_0.png)\n\n图 10.23 –\
  \ 将背景音乐添加到我们的音频文件夹\n\n要播放音频，Godot 有一个名为 AudioStreamPlayer 的特殊节点。它非常适合播放背景音乐，因为它不会以位置方式播放音频。如果你希望音频从屏幕上的不同来源播放，则使用\
  \ AudioStreamPlayer2D 或 AudioStreamPlayer3D 节点。\n\n由于关卡将有背景音乐，请向关场景添加一个新的 AudioStreamPlayer\
  \ 节点，如图 10.24 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_295_1.png)\n\n图 10.24\
  \ – 向关卡场景添加 AudioStreamPlayer 节点\n\n选中 AudioStreamPlayer 后，查看 Inspector 中的属性。这里，Stream\
  \ 属性是它将播放的音频源。将 MP3 文件拖放到 Stream 中。将音量降低到 −20 dB 并将 Autoplay 设置为 On。所有这些更改都反映在图\
  \ 10.25 中：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_296_0.png)\n\n图 10.25 - 设置我们的音频播放器的流\n\
  \n因为 **Autoplay** 设置为 true，曲目将在关卡加载后立即开始播放。如果你想停止音乐，所有这些设置都可以通过附加到关卡的脚本更改，并且可以将播放设置为\
  \ false。\n\n现在我们已经让背景音乐运行起来，让我们继续为游戏添加音效。\n\n### 实现音效\n\n音效不会自动且持续播放。相反，它们由事件触发或与事件配对。一个很好的例子是玩家跳跃或收集东西时。\n\
  \n首先，你需要下载你选择的音效。你可以访问 **Open Game Art**（https://opengameart.org/）并搜索跳跃音效和硬币或可收集物音效。该网站是免费游戏资产的绝佳资源，所有内容均在知识共享\
  \ CC0 许可下提供。\n\n一旦你有合适的跳跃音效和收集音效，请将文件添加到 Godot **FileSystem** 中的 Audio 文件夹中。这在图\
  \ 10.26 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_296_1.png)\n\n图 10.26 -\
  \ 向我们的 Audio 文件夹添加音效\n\n由于我们的游戏中很简单，我们只有两个音效，一个用于 *jumping*，一个用于 *collecting*，我们将在\
  \ **Player** 场景中添加两个 **AudioStreamPlayer** 节点来处理此事。重命名 **AudioStreamPlayer** 节点以反映它们将播放的音效，如\
  \ *图 10.27* 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_297_0.png)\n\n图 10.27\
  \ – 向 Player 场景添加多个音频流\n\n对于具有多个重叠音效的更复杂游戏，添加多个 **AudioStreamPlayer** 节点不是最佳解决方案，你会考虑\
  \ **Sound Manager** 场景或为音乐和音效设置一些音频总线。\n\n每个 **AudioStreamPlayer** 节点都应播放关联的音效，因此请确保将正确的文件拖到每个\
  \ **Stream**，如 *图 10.28* 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_297_1.png)\n\
  \n图 10.28 – 两个不同音效的两个音频流\n\n\n\n在设置好两个音频流的正确音效和默认设置后，打开玩家 GDScript 并为 AudioStreamPlayer\
  \ 节点添加两个 onready 变量引用。你可以通过将节点拖入脚本中，然后在释放之前按住 Ctrl 来实现。代码如下所示：\n\n```\nextends CharacterBody2D\n\
  \n@onready var animations = $AnimatedSprite2D\n@onready var jump = $Jump\n@onready\
  \ var collect = $Collect\n```\n\n现在每个节点的引用都可用了，我们可以找到触发流播放的合适时机。跳跃应在玩家按下跳跃键时触发。\n\
  \n在 standard_player_movement() 函数中，跳跃通过特定的 if 语句处理。\n\n就在检查空格键是否被按下且玩家是否在地面上的条件之后，调用\
  \ jump AudioStreamPlayer 节点的 play() 函数，如下所示：\n\n```\nfunc handle_jump():\n    #\
  \ Handle jump.\n    if Input.is_action_just_pressed(\"ui_accept\") and is_on_floor():\n\
  \        jump.play()\n```\n\n这段代码将确保每次玩家在地面上并按下跳跃键时，跳跃音效也会播放。\n\n接下来是收集音效，它应在玩家与草莓碰撞时播放。幸运的是，我们在\
  \ Player 脚本中已经有一个在这种情况下调用的函数：add_score(amount)。请回忆，该函数在玩家与草莓碰撞时会被调用，以跟踪收集了多少个草莓。我们可以在调用此方法时播放音效，如代码所示：\n\
  \n```\nfunc add_score(amount):\n    collect.play()\n    strawberry_count += 1\n\
  ```\n\n前述代码在玩家在关卡中收集草莓时会被调用。它播放收集音效并将一个草莓添加到已收集草莓计数中。\n\n仅用一行代码，我们就为草莓收集添加了令人满意的音频反馈，有助于让这一刻对玩家来说更有回报感。\n\
  \n## Summary\n\n游戏开发不仅仅关乎机制和关卡设计——它还关乎游戏 *感觉* 起来的感觉。在本章中，我们探讨了游戏精髓的概念以及小幅增强如何使游戏更具吸引力、更精致和更令人满意。\n\
  \n我们实施了多个关键元素以改善玩家反馈和沉浸感。首先，我们引入了使用爱心的生命值条 HUD，随着玩家损失生命值而变灰，提供清晰直观的玩家状态反馈。为了进一步增强响应性，我们集成了受击动画，使受伤害感觉更具冲击力。\n\
  \n接下来，我们在检查点添加了纸屑炮效果以庆祝关卡完成，用视觉冲击强化玩家的成就感。最后，我们通过背景音乐和音效让关卡栩栩如生，使游戏世界更具沉浸感和动态感。\n\
  \n通过应用这些技术，我们展示了小的视觉和音频改进如何显著提升玩家的体验。游戏精髓将基础游戏转变为感觉精致、响应迅速且有趣的游戏，有助于让玩家保持参与并投入到游戏世界中。\n\
  \n在下一章中，我们将从动手编码中退一步，探索游戏开发的更大图景：游戏设计。现在你已经体验到细节如何通过打磨和反馈增强游戏玩法，是时候了解这些元素如何融入精心规划的设计中了。你将学习如何构建想法、定义游戏机制并通过深思熟虑的规划塑造玩家的体验。这一基础将帮助你在项目范围扩大时做出更好的设计选择并避免昂贵的返工。\n\
  \n## Join our community on Discord\n\n加入我们在 Discord 的社区空间，与作者和其他读者讨论：\n\nhttps://packt.link/godot-4-game-dev\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_299_0.png)\n"
- '## 11


  ## Understanding Game Design


  到目前为止，本书的重点是提供动手实践的指导，说明如何在 Godot 中开发游戏。然而，游戏很少是通过打开游戏引擎并毫无计划地创建东西而制作的。游戏设计是游戏开发的第一步。它是打造令人愉快、引人入胜且难忘的游戏的蓝图。


  本章将探讨游戏设计如何作为指导力量，塑造游戏玩法机制、叙事结构和玩家体验。


  在本章中，我们将涵盖以下主要主题：


  - 了解游戏设计的基础

  - 探索游戏设计文档

  - 详细说明 GDD 的关键要素


  在本章结束时，你将理解深思熟虑的游戏设计在简化开发、减少昂贵错误和提高玩家满意度方面的价值。无论你渴望设计自己的游戏还是作为开发团队的一部分有效工作，这些经验都将为你提供更清晰的视角，了解伟大游戏是如何制作的。


  ## Technical requirements


  不需要任何游戏设计的先前经验或知识。


  ## Understanding the foundations of game design


  游戏是一种娱乐形式，成功的游戏通常被描述为 *有趣*。但这实际上意味着什么？哪些元素结合在一起创造了有趣、有回报的体验？这些是游戏设计寻求回答的问题。


  超逼真的视觉效果和优化的编程本身并不能保证游戏会令人愉快。事实上，一些最受喜爱的游戏之所以成功，并不是因为它们的外观或技术先进程度，而是因为它们让玩家感受到什么。无论图形或性能如何，一个引人入胜、令人满意且难忘的游戏都是深思熟虑的游戏设计的产物。


  让我们看一些例子：


  - **Stardew Valley（最初于 2016 年发布）**：这款独立农场模拟游戏之所以成为全球热门，并不是因为尖端图形，而是因为其令人满意的游戏循环、进步感以及与角色的有意义互动。其游戏设计专注于玩家选择、日常
  routine 和社区建设——所有这些都促成了深度引人入胜的体验。

  - **Celeste（最初于 2018 年发布）**：*Celeste* 是一款具有挑战性的 2D 平台游戏，结合了紧凑的控制和情感共鸣的故事讲述。设计鼓励坚持不懈，奖励玩家掌握困难段落，同时提供尊重不同技能水平的辅助选项。它是游戏设计如何同时支持游戏玩法和情感影响的完美例子。

  - **Among Us（最初于 2018 年发布）**：这款社交推理游戏因其巧妙的设计而爆红，该设计鼓励沟通、欺骗和协作。尽管其艺术风格简单，但核心循环——找出谁是冒充者——让玩家保持参与并不断回归。


  这些例子表明，优秀的游戏设计并不总是意味着复杂性或真实性。相反，它意味着创造与玩家产生联系的系统和体验。


  这些体验是在设计过程中打造的，因此尽可能详细和深思熟虑很重要。毕竟，你正在为整个游戏奠定基础。


  游戏设计可能比编程感觉更抽象，因为它更偏向艺术和讲故事。正如你已经体验到的，制作游戏很困难；有很多 moving parts 都需要协同工作。游戏设计可能更具挑战性，因为没有成功的严格公式。与编程不同，没有硬性规则——只有原则、模式以及对玩家认为有意义和愉快的事物的深刻理解。


  ## Introducing the game design document


  有一些用于记录设计的既定框架。一旦你有了游戏的想法，使用这些行业认可的框架（如 **游戏设计文档**（**GDD**）或功能清单）来捕捉它，将帮助你更清晰地发展想法并让你更接近游戏设计的精髓。


  在 Godot 中工作时，拥有一个扎实的设计计划会带来巨大差异。例如，及早明确定义游戏机制可以让你决定需要哪些节点、脚本和场景。如果你的设计包含角色升级、关卡过渡或特定交互，你可以从一开始就考虑到这一点来构建
  Godot 项目。


  将你的设计决策直接链接到 Godot 的场景系统、输入处理以及使用 GDScript 的脚本编写，将帮助你避免猜测和返工，并构建一个不仅有趣而且构建整洁、更易维护的游戏。


  在下一节中，我们将了解如何有效地记录你的游戏设计。这是至关重要的一步，它帮助你将想法转化为清晰、可执行的计划，并确保你在 Godot 中的开发过程保持专注、高效并与你的原始愿景一致。


  ## Why is documentation necessary for your game design?


  你可能会认为，因为你制作的游戏很小，或者因为你是唯一在上面工作的人，所以没有真正需要写下任何东西。然而，这可能是一个短视的决定。即使是最简单的游戏项目也能从清晰的文档中受益——它帮助你保持组织性，更彻底地思考想法，并在开发后期避免昂贵的失误。


  记录你的设计至关重要，这样你——以及任何其他在游戏上工作的人——都能了解游戏的一切以及完成它需要做什么。游戏很复杂，拥有许多交互功能。通常，你只有在解决问题时才会弄清楚如何解决。几个月后，你可能甚至记不起为什么包含某样东西或它是如何工作的。这就是文档变得无价的地方。




  为你的游戏设计开发文档在 Godot 中工作时尤其有帮助，因为它能让你更高效地规划游戏结构，决定需要哪些节点，不同对象如何交互，以及如何在 GDScript 中组织脚本。这种前期清晰度降低了混淆或混乱重写的风险，并在项目复杂度增长时帮助你保持专注。


  创建 GDD 有助于你做到以下几点：


  - 通过明确列出已做出的决策，减少返工并避免重复劳动

  - 在休息后返回项目时，记住设计选择背后的 *why*

  - 在整个开发过程中跟踪变更和想法

  - 识别机制、功能和系统之间的相互依赖关系

  - 保持与你的愿景和范围一致

  - 如果将来引入额外的团队成员或贡献者，使协作更轻松


  你的游戏设计文档承担两项重要工作：回溯以记录迄今为止做出的所有决策，并向前看，指导游戏的开发。它们既是 *你思考的记录*，也是构建游戏的 *roadmap*。


  因此，你的 GDD 成为项目的单一事实来源，在整个开发过程中让你保持脚踏实地、专注且高效。


  ## 了解 GDD 的指导原则


  首先，需要注意的是 GDD 是 *living documents*。这意味着它们经常会发生变化，并且在游戏开发过程中应持续查阅和参考。这是因为，虽然游戏的核心想法可能不会改变，但其周围的许多元素应该不断演进，而文档应通过适应来反映这一点。


  ![](img/d34207e07c133a9e84d9caf1d479006c_304_0.png)


  附加阅读


  你可以通过阅读 **Gamescrye** 和 **Roobyx’s** 的 GitHub 仓库中的 GDD 来了解商业游戏是如何制作的：


  - https://gamescrye.com/resources/game-design-documents/

  - https://github.com/Roobyx/awesome-game-design


  为了准备 GDD，任何好的协作文档和设计软件，例如 **Notion** (https://www.notion.com/)、**Obsidian** (https://obsidian.md/)
  或 **OneNote** (https://www.OneNote.com)，在这里都能很好地发挥作用。然而，也有针对游戏开发行业量身定制的解决方案，例如 **Codecks**
  (https://www.codecks.io/) 和 **HacknPlan** (https://hacknplan.com/)。


  为了让你的游戏设计文档真正有效，它应遵循一些最佳实践。这些原则将有助于确保你的想法清晰传达，并且实际上可以用来指导开发。让我们在后续章节中查看这些内容。


  ### 可视化思考


  使用文字、系统图、流程图、线框图和其他视觉元素混合来传达你的想法。视觉元素充当一种超越障碍的通用语言，使复杂概念更容易理解。它们改善了沟通，使想法对所有参与者来说更易于获取、可操作且可适应。


  ### 保持简洁清晰


  清晰和简洁是关键。你的文档应具备以下特点：


  - **简短扼要：** 使用要点高效传达想法

  - **准确：** 要具体——包括速度或跳跃高度等项目的确切数值，并且始终使用现在时

  - **优先级明确：** 明确哪些功能对你的 **minimum viable product** (MVP) 至关重要，哪些是锦上添花，哪些是纯粹可选的


  ### 保持组织有序


  一个组织良好的文档更易于使用。最佳实践包括以下内容：


  - **使用基于网络的格式：** 这使得访问和更新变得容易，并允许将章节拆分为单独的、专注的页面

  - **逻辑地组织信息：** 从总体概述开始，仅在需要时再进入具体细节


  ### 以例学习


  并没有单一 *correct* 的方式来撰写设计文档。一个有帮助的入门方法是研究现实游戏中示例。**Game Docs** 网站 (https://gamedocs.org/documents/)
  提供了一个精选的商业发行版设计文档集合。探索这些内容，看看他人如何组织想法，并将适合的部分应用到自己的项目中。


  现在你了解了有效文档背后的关键原则，让我们更仔细地看看创建 GDD 需要什么。


  ## 探索游戏设计文档


  到目前为止，我们知道 GDD 是一份高度描述性的、活的视频游戏软件设计文档。对于使用 Godot（或任何游戏引擎）的开发者来说，一份准备充分的 GDD 通过清晰概述游戏玩法系统、场景结构和脚本逻辑来简化开发流程，使将想法转化为
  Godot 的基于节点的架构和 GDScript 变得更容易。


  GDD 的第一页或主页应是对游戏概念的高层次概述，这将为你提供游戏背后的主要想法。这有时也被称为 *pitch* **document**。在以下章节中，我们将查看此页面应包含的部分。


  ### 标题：你将如何命名你的游戏？


  *title* 通常是工作标题，随着游戏的演进可能会发生变化。标题应代表游戏的主要想法，因此值得花一些时间思考这个问题。


  例如，我们的工作标题可以是 *SILENT STATION*。让我们在以下小节中进一步展开。


  ### 团队：谁将构建或开发游戏？


  列出参与游戏工作的人员以及他们具体负责的内容。不要担心头衔；集中关注他们将使项目的哪些方面发挥功能。


  ### 状态：项目的状态是什么？


  最好使用交通灯系统或看板来描述。创建以颜色为主题的标题：**TO DO** *(yellow)*、**DOING** *(orange)*、**DONE** *(green)*
  和 **BLOCKED** *(red)*。在每个标题下列出游戏的功能。任何阻碍游戏进展或任何重大问题都应归入红色类别。*Figure 11.1:* 中显示了此示例：


  ![](img/d34207e07c133a9e84d9caf1d479006c_307_0.png)


  图 11.1 – 开发任务的简单看板示例


  ### 概念陈述：你的游戏用一句话来说是什么？


  用一句话描述游戏的核心功能。尝试包含设定、主角、主要目标和需要克服的障碍。


  这是来自 SILENT STATION 的示例：


  *一名孤独的宇航员必须仅依靠手电筒在废弃的外星空间站（设定）中穿行以寻找失踪的船员（目标），同时避开对声音有反应的敌对生物（障碍）。*


  ### 扩展概念段落和 USP：你的游戏有何独特之处，如何更详细地描述它？


  在本节中，我们扩展概念陈述并描述游戏玩法。请记住，这是一段简要扩展玩家核心循环和进度的段落。突出游戏的独特卖点（USPs），有时也称为钩子——这将使玩家保持投入。


  这是来自 *SILENT STATION* 的示例：


  *玩家必须仅依靠有限的光束探索漆黑、幽闭的走廊，同时管理视野和声音。游戏的独特机制是其对声音有反应的敌人，结合实时语音输入可能会吸引危险，使麦克风成为游戏循环的一部分。*


  ### 类型：你制作的是什么类型的游戏？


  这些是具有相似游戏玩法特征的视频游戏类别。虽然单一类型的游戏仍然存在，但这些市场很可能已饱和，你将更成功地将多种类型融合在一起，创造新的游戏风格和机制。


  这是来自 *SILENT STATION* 的示例：


  *生存恐怖，带有轻度解谜和探索元素。*


  ### 受众：这款游戏面向谁？


  这是你瞄准的市场。在这里，你可能会列出年龄范围和 **Entertainment Software Rating Board (ESRB)** 评级。你将查看该受众玩的游戏类型，甚至可能链接到更详细的玩家画像页面以及游戏如何吸引他们。


  这是来自 *SILENT STATION* 的示例：


  *成熟玩家（ESRB 16+），他们喜欢《异形：隔离》或《死灵空间》等叙事驱动的科幻恐怖游戏。*


  ### 体验：玩家在游戏过程中应感受到或体验到什么？


  玩家的游戏体验会是什么？游戏会让他们感受到什么？体验持续多长时间？此标题可以链接到有关玩家进度和目标的详细页面，细节可在那里揭示。


  这是来自 *SILENT STATION* 的示例：


  *游戏旨在营造一种恐惧和紧张感，并伴有短暂的解脱时刻。它鼓励缓慢探索、注意音频线索，并通过营救幸存者建立情感联系。*




  ## 锚点：核心思想、灵感或参考点是什么？


  这些是游戏中的体验，将玩家与角色联系起来，让他们投入故事并保持游戏进行。这些可能是开场场景、重要的 Boss 战，或解锁叙事发展的重大物品发现。在此突出其中的一些内容，然后链接到提供故事弧线更详细信息的页面是关键。


  这里是来自 *SILENT STATION* 的示例：


  - *宇航员与基地失去联系的初始时刻*

  - *在冷冻舱中发现首位幸存者*

  - *首次遭遇声控敌人*

  - *利用潜行路线为整个区域供电*


  ## 平台：游戏将在哪些平台发布？


  这是你所针对的平台。它可能是 PC、移动设备或主机。它可以是一个或全部，也可以是完全其他的东西。通常，你会缩小范围并专注于单一平台。


  这里是来自 *SILENT STATION* 的示例：


  *PC（初期），未来有望登陆主机。*


  ## 竞品评测：存在哪些类似游戏，你的游戏如何脱颖而出？


  列出一些相似甚至直接竞争的游戏。然后，链接到一个深入分析竞争对手的页面。突出你的游戏与众不同的地方。


  这里是来自 *SILENT STATION* 的示例：


  *类似《异形：隔离》和《Observation》，但通过独特的麦克风输入和以声音为核心的机制实现差异化。*


  ## 资源：游戏需要哪些美术、音效和其他资源？


  你可以包含一些概念艺术来确立游戏的整体基调，并链接到更详细的文档，其中列出了游戏所需的所有已知音效和图像资源。这将包括界面、动画、世界和角色的详细内容。


  这里是来自 *SILENT STATION* 的示例：


  - *音频：环境氛围音、语音台词、生物音效*

  - *视觉：模块化科幻室内瓦片集、动态光照资源*

  - *UI：氧气表、手电筒电量图标、声音探测表*


  ## 盈利模式：游戏将如何产生收入（如果有的话）？


  在此，你解释游戏将如何产生收入。它可能是一次性购买，也可能是免费游戏，或具有内购。无论情况如何，都需要在系统和功能的相关链接页面上进行扩展。


  将这些作为 GDD 第一页的主要标题并链接到 GDD 中的其他页面，其中包含进一步的细节，将为你的游戏概念提供一个很好的概述，并让阅读者清楚地了解这是什么类型的游戏以及面向谁。


  设计过程中的下一步将是专注于现在需要更多细节的游戏关键元素。


  这里是来自 *SILENT STATION* 的示例：


  *付费模式 – 一次性购买。未来 DLC（可下载内容）可增加新的故事线或挑战模式。*


  ## 详细描述 GDD 中的游戏元素


  本节将突出 GDD 中需要更多细节的部分。这些部分需要大量细节的原因是它们是游戏存在的根本要素。


  因此，你和其他团队成员需要对游戏将包含的内容以及其工作原理和如何影响游戏中的其他系统有非常清晰的认识。利用后续各节的指导，为你的游戏创意添加尽可能多的细节。请注意，每个标题代表
  GDD 中的一个或多个新页面。


  ## 玩家成长与目标


  在本节中，你应回答关于 *玩家* 的以下问题：


  - 他们是谁？

  - 他们知道什么？

  - 他们的叙事弧线是什么？

  - 他们的目标是什么？

  - 他们如何成长？

  - 核心循环是什么？

  - 外层循环是什么？


  *玩家成长与目标* 页面链接到主页面上的锚点。作为基于网络的文档，这通常是超链接，但这些点在概念上也相互连接，指导游戏随时间展开的方式。


  为了清晰地定义成长，将其分解为两个层面是有帮助的：


  - **核心游戏循环：** 核心游戏循环代表玩家为玩游戏而重复的基本动作。例如，在平台游戏中，这可能涉及奔跑和跳跃以穿越关卡、攻击敌人和避免危险。

  - **外层循环：** 另一方面，外层循环描述的是更广泛的成长系统——玩家因参与核心循环而获得的奖励。这可能包括解锁新关卡、获得升级或推进故事。


  核心循环应融入外层循环，反之亦然，创造令人满意且相互强化的游戏体验。


  这里是来自 *SILENT STATION* 的示例：


  *玩家成长与目标：*


  - *开始：在医疗舱醒来*

  - *中期：修复通信阵列*

  - *后期：撤离剩余船员*

  - *核心循环：探索 → 寻找工具 → 避免噪音 → 进展*

  - *外层循环：解锁新区域、携带新工具回溯、拼凑故事*


  ## 游戏世界与背景


  在本节中，你应回答关于世界的问题：


  - **世界背景设定：** 是否有设定游戏场景的背景故事？

  - **世界物理：** 可以奔跑、飞行、坠落、漂浮等吗？

  - **世界节点：** 玩家如何在游戏中推进、地点等？

  - **彩蛋：** 是否为玩家准备了任何隐藏惊喜？


  如果需要，本页面可以链接到世界虚构的新文档。


  这里是来自 *SILENT STATION* 的示例：


  *游戏世界与背景：*


  - *空间站背景设定：位于流浪月球上的废弃研究设施*

  - *重力和氧气按房间管理*

  - *通过环境叙事暗示秘密政府实验*


  游戏世界地图如 *图 11.2* 所示，是游戏世界视觉表示的一个示例，有助于传达游戏设定中的结构、规模和关键位置：


  ![](img/d34207e07c133a9e84d9caf1d479006c_312_0.png)


  *图 11.2 – 游戏世界地图（来源：https://kenney.nl/）*


  这张地图以鸟瞰图展示了游戏世界，显示了不同区域如何连接以及关键事件或挑战可能发生的位置。在 GDD 中包含此类视觉效果有助于你和你的团队保持对游戏空间布局和叙事流程的一致认识。


  ## 用户界面


  本节应详细说明玩家与游戏世界交互以及接收关于世界和自身状态信息的所有方式。同时，请务必关注外观和感觉。你应回答以下问题：


  - 控制方案是什么？

  - 从一个屏幕移动到下一个屏幕需要什么？（考虑提供线框图。）

  - 你提供什么帮助或提示系统，它看起来如何？

  - 你如何在屏幕上展示控制？

  - **选项** 菜单看起来如何？

  - **暂停** 菜单看起来如何？


  这里是来自 *SILENT STATION* 的示例：


  *极简 UI，主要为叙事内（手电筒光晕、声音条集成于头盔面罩）*


  图 11.3 显示了一个 UI  mock-up，展示了按钮和滑块等元素：


  ![](img/d34207e07c133a9e84d9caf1d479006c_313_0.png)


  图 11.3 – 一个 UI mockup（来源：https://kenney.nl/）


  ## 音频与视觉风格


  本页提供游戏氛围和环境细节。它应清楚地定义游戏应如何呈现和听起来如何。这所有内容都促成了游戏的整体情绪，你应回答以下问题等：


  - 色彩搭配是什么？

  - 音乐风格是什么？

  - 美术风格是什么？

  - 包含参考、示例和概念艺术

  - 给出环境、角色、敌人、物体等的概念


  本页应链接到你的完整游戏资源列表。


  这里是来自 *SILENT STATION* 的示例：


  - *美术风格：风格化写实*

  - *音效：分层环境音调、定位音频、玩家呼吸声*


