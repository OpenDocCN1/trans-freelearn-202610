- "## 12\n\n## 接下来去哪里？\n\n恭喜你到达 Godot 4 for Beginners 的最后一章！你现在已经在使用 Godot Engine\
  \ 创建游戏方面打下了坚实的基础，并且已经培养出将想法变为现实的实践技能。但旅程并未到此结束——本章旨在帮助你在游戏开发职业生涯中迈出下一步。\n\n本章将介绍各种资源和机会，以支持你作为开发者的持续成长。从\
  \ YouTube 频道和博客到游戏大赛和资产市场，你将发现能够激发、教授并提升你项目的宝贵工具、社区和专家。\n\n在本章中，我们将涵盖以下主要主题：\n\n\
  - 利用教育资源\n- 探索实践机会\n- 社区与人脉\n- 利用工具和资产\n- 建立你的作品集\n- 开发游戏创意\n- 下一个项目的设计指南\n\n到本章结束时，你将拥有一份精选资源列表，以加深你的知识、扩展你的技能并与其他开发者建立联系。你还将发现如何保持动力、了解最新趋势并在游戏开发社区中建立你的影响力。\n\
  \n无论你的游戏开发之旅接下来走向何方，这些资源都将是你持续学习和成功的基石。让我们探索一下有哪些资源！\n\n## 技术要求\n\n无需技术配置——只需愿意探索、实验并在游戏开发中迈出下一步。\n\
  \n## 利用教育资源\n\n学习如何在 Godot 中开发游戏并不止于一个项目或教程；这是一个持续的过程。本节介绍各种值得信赖的教育资源，例如 YouTube\
  \ 频道、博客和书籍，可帮助你加深知识、跟上引擎的演进，并从经验丰富的开发者那里获得灵感。\n\n无论你喜欢观看视频教程、阅读逐步指南，还是从社区见解中学习，这些资源都将在你提升技能并承担更雄心勃勃的游戏项目时支持你的旅程。\n\
  \n## YouTube\n\nYouTube 上有许多免费的游戏开发学习资源。由于 Godot 本身是开源的，围绕该引擎的社区秉持分享和乐于助人的理念。社区中普遍认为\
  \ *我们不应垄断知识，而应通过开放和分享让大家共同学习更多。*\n\n以下是一些最好的 Godot 游戏开发 YouTube 频道：\n\n- **GDQuest**\
  \ (https://www.youtube.com/@Gdquest)：可以说是学习如何使用 Godot Engine 创建游戏的最好资源，GDQuest 是一个专业且成熟的\
  \ Godot 教育团队。这意味着你将获得那些在 Godot Engine 方面经验丰富的专业人士的累积知识。我个人曾使用他们的频道来获取各种节点的简明解释，因为他们解释得简洁明了，直奔主题。\n\
  \n他们 YouTube 频道上的所有资料都是免费的，如果你对他们的教学风格反应良好，那么探索他们在本章后面会讨论的付费课程将是明智之举。\n\n- **Heartbeast**\
  \ (https://www.youtube.com/@uheartbeast)：另一个关于 Godot 的绝佳资源是 YouTube 频道 Heartbeast。Benjamin\
  \ 是 Godot 的早期采用者，他的教程是我见过最全面、详细且对初学者友好的教程之一。他解释事物为何以这种方式完成的方式非常出色，我强烈推荐他的频道。\n\n\
  如果你正在寻找从头到尾在 Godot 中创建游戏的完整体验，并附带细致入微的解释，那么 Heartbeast 就是你的频道。Benjamin 也有付费课程，如果你想超越他在\
  \ YouTube 频道上讨论的基础知识。\n\n- **Godot Tutorials** (https://www.youtube.com/@GodotTutorials)：如果你想更专注于在\
  \ Godot 游戏引擎中进行编码，那么请查看 Godot Tutorials 频道。该频道以详细的方式制作 Godot 游戏，并将其教学中也包含游戏设计元素。该频道专注于使用\
  \ GDScript 在 Godot Engine 中进行编码原则，使其成为深入了解如何在 Godot 中实现事物的好去处。\n\n该频道有一个配套网站，提供所有视频教程的文本版本。我非常欣赏这一点，因为我更喜欢从文本中学习，所以如果你也是这种学习风格，请查看\
  \ https://godottutorials.com/。\n\n- **GameDev Journey** (https://www.youtube.com/@GameDevJourney)：最后，如果你喜欢本书中材料的呈现方式，那么你会喜欢我个人\
  \ YouTube 频道上的教程。它还有一个配套网站，以文本格式呈现相同的教程，你可以访问 https://www.gamedevjourney.co.uk/home。\n\
  \n教程模块化，专注于单个游戏机制。除教程外，还有开发者日志、关于游戏资产和资源的讨论，以及鼓励性视频，提供建议以保持你的动力。\n\n现在，让我们继续介绍一些博客推荐。\n\
  \n## 博客\n\n游戏开发是一个不断发展的领域，永远有更多东西需要学习。网上有一些很棒的博客，涵盖游戏设计和制作游戏背后的理论。\n\n\n\n\n为了保持最新并了解当前最佳实践，以下博客很有用：\n\
  \n- **乐趣解构者** (https://www.deconstructoroffun.com/blog/): 该博客分析了流行免费游戏的设计，对参与度、留存率和货币化方面有效与无效的内容进行了批判性审视。由一支也大量玩游戏的开发团队撰写，其内容对于希望理解乐趣与盈利之间平衡的\
  \ aspiring 游戏制作人尤其有价值。如果你计划靠制作游戏为生，这篇博客提供了在竞争激烈的市场中什么能让游戏成功的现实见解。\n- **游戏设计技能**\
  \ (https://gamedesignskills.com/blog/): 该博客提供了一个丰富且不断增长的文章库，专注于游戏设计的实践，特别是玩家如何与游戏系统互动。它深入探讨了机制、控制、进度和平衡，使其成为有志者和经验丰富的设计师的绝佳资源。无论你是在学习基础知识还是完善技能，这个网站都是探索真实案例和实践设计思维的宝贵场所。\n\
  - **游戏开发者** (https://www.gamedeveloper.com/): Game Developer 是任何从事或学习游戏行业的人的首选中心。它包含详细的复盘、开发者见解以及已发布游戏的幕后文章，同时定期更新行业趋势和新闻。对学生、独立开发者和专业人士来说都是理想选择，这里可以从真实经验中学习并了解游戏开发不断变化的格局。\n\
  \n无论你偏好快速见解还是深入文章，这些博客都是跟上不断发展的设计趋势和行业实践的绝佳方式。如需更结构化和全面的学习方法，请参阅本章末尾进一步阅读部分中推荐的书籍。\n\
  \n## 探索实践机会\n\n在我与许多游戏开发者的交谈中，有一条建议反复出现：在制作游戏时*从小做起*。这种方法的益处如下：\n\n- 从小游戏开始可以让你在不被大型游戏范围压垮的情况下学习核心概念，例如移动、碰撞和基本机制。\n\
  - 更小的项目可以更快完成。这会给你完成某事并看到它运行的满足感。它还能让你体验从头到尾制作游戏的过程，从而增强信心和动力。拥有他人可以游玩的游戏也能让你获得反馈，从中学习。\n\
  - 拥有一个小游戏为你提供了一个犯错并从中学习的安全空间。试错是开始时很好的学习方式。在大型项目中，你的错误会累积且难以修复。\n- 当你从事较小的游戏时，你有机会在无需同时平衡多个系统的情况下培养必备的问题解决技能。\n\
  - 制作许多小游戏可以让你逐步建立作品集。一些精致的小项目集合比许多粗糙未完成的大项目更好。这是一种展示作品的好方法。\n- 一旦你完成了一些较小的游戏，你将更好地理解游戏开发工作流程，并为自己承担更雄心勃勃的项目奠定基础。\n\
  \n练习技能的绝佳方式是参加游戏 Jam。我们将在下一节讨论这个问题。\n\n## 参与游戏 Jam\n\n**游戏 Jam** 是限时活动，个人或团队基于给定主题和一组限制从头到尾创建一个游戏。它们通常持续\
  \ 48 小时到一周，并对所有技能水平参与者开放。\n\n对于初学者来说，游戏 Jam 是获得实践经验的绝佳方式。你将有机会练习从设计机制到编写代码、创作美术和作曲等一切内容——都在短暂的专注创造力爆发中完成。不要担心如果你在每个领域都不够自信——游戏\
  \ Jam 通常吸引各式各样的人，许多参与者会组队并互相学习。\n\n此外，你还将体验完整的游戏开发周期：头脑风暴、原型制作、测试以及完成可玩项目。这可以极大地增强信心并成为一个很棒的作品集项目。更重要的是，这是一种有趣且受欢迎的方式，与同样热爱游戏的人建立联系。你可以在\
  \ **itch.io** (https://itch.io/) 上找到适合你技能水平和时间要求的游戏 Jam。他们有一个 Jam 日历，你可以在 https://itch.io/jams\
  \ 上报名参加适合你的活动。\n\n其他大型 Jam 如下：\n\n- **Godot Wild Jam**: https://godotwildjam.com/\n\
  - **Ludum Dare**: https://ldjam.com/\n- **The Global Game Jam**: https://globalgamejam.org/\n\
  \n游戏 Jam 只是与他人一起学习有多强大的一个例子。无论你是在团队中协作、分享反馈，还是简单地看看他人如何处理同一主题，这些活动都凸显了社区在游戏开发中的重要性。\n\
  \n在下一节中，我们将探讨如何参与更广泛的游戏开发社区并建立专业网络，这可以打开大门、提供支持，并帮助你作为开发者进一步成长。\n\n## 社区与人脉\n\n\
  游戏开发最鼓舞人心的事情之一就是其鼓励和支持的社区。每个游戏开发者都知道制作游戏有多困难，他们也知道起步时感到自己甚至不知道如何做最简单的事情是什么感觉。这就是为什么他们总是愿意帮助他人学习。游戏开发者也相互依赖进行游戏测试和反馈。\n\
  \n### 人脉为何重要\n\n与其他游戏开发者建立人脉可以打开大门，让你形成合作关系并获得指导、职位 offer 和兼职。许多游戏开发者通过建立的联系找到行业第一份工作或结识未来的合作者。\n\
  \n人脉建设还能让你获得曝光度。通过参与社区并在游戏 Jam、会议和聚会等活动中建立人脉，你可以开始被注意到。这种曝光度对于获得工作、获得资金或为游戏发布获得关注至关重要。\n\
  \n### 在哪里建立人脉\n\n你可以在 X、Reddit 和 Discord 服务器等平台上建立人脉并与社区建立联系。参与游戏 Jam 会让你的名字传播开来，甚至可能给你机会加入一个团队。\n\
  \n参加行业活动和会议，例如 Game Developers Conference (GDC)，以及较小的本地聚会，可以提供面对面建立人脉的机会，并向业内资深人士学习。\n\
  \n你也可以在游戏开发新手时为他人提供价值。这不仅仅是寻求帮助；也是提供帮助！如果有人正在寻找反馈或需要有人试玩他们的游戏，请不要犹豫主动请缨。\n\n###\
  \ 需要关注的人\n\n在 LinkedIn 上关注的优秀专业人士如下：\n\n- Sergei Vasiuk (https://www.linkedin.com/in/sergeivasjuk/)\n\
  - Gökhan Üzmez (https://www.linkedin.com/in/gkhnuzmez/)\n- Jakub Remiar (https://www.linkedin.com/in/jakubremiar/)\n\
  - Amir Satvat (https://www.linkedin.com/in/amirsatvat/)\n- Mayank Grover (https://www.linkedin.com/in/mayankgrover/)\n\
  - Mirko Minenza (https://www.linkedin.com/in/mirko-minenza/)\n- Anton Slashcev (https://www.linkedin.com/in/aslashcev/)\n\
  \n通过建立人脉并成为游戏开发社区的一部分，你可以提升技能、学习并培养对创造游戏的热情。围绕自己身边志同道合、兴趣相同的人，你可以找到灵感、指导和同志情谊，这将使你的游戏开发之旅更加充实。\n\
  \n## 利用工具和资源\n\n在游戏开发中，尤其是起步时，拥有合适的工具和资源将你的想法变为现实非常重要。游戏开发是一个复杂的过程，涉及艺术、音频、编程和设计等多个学科。让我们看看一些可以帮助你处理这些方面的工具和资源。\n\
  \n### 工具\n\n在本节中，我们将查看游戏开发关键领域的必备工具：\n\n- **游戏引擎：** 我们选择的游戏引擎是 Godot (https://godotengine.org/)，因为它免费且开源。它对初学者友好、轻量级，非常适合\
  \ 2D 和 3D 项目。\n- **图形工具：** 以下是一些创建图形的推荐工具：\n  - **GIMP** 是 Photoshop 的免费开源替代品：https://www.gimp.org/\n\
  \  - **Krita** 也是一个免费开源工具，用于创建数字绘画和 2D 艺术：https://krita.org/en/\n  - **LibreSprite**\
  \ 是 Aseprite 的免费开源替代品，用于创建像素艺术：https://libresprite.github.io\n\n\n\n- **Blender**\
  \ 是一个免费的开源工具，用于创建 3D 模型和动画：https://www.blender.org/\n- **音频工具：** 这里有一些入门的免费工具列表：\n\
  \  - **Audacity** 是一个用于录音和编辑音频的免费工具：https://www.audacityteam.org/\n  - **LMMS**\
  \ 是用于作曲的免费开源软件：https://lmms.io/\n  - **Bosca Ceoil: The Blue Album** 是一个用于制作复古游戏音乐的免费开源工具：https://yurisizov.itch.io/boscaceoil-blue\n\
  \  - **Bfxr** 是一个用于创建复古音效的免费工具：https://www.bfxr.net/\n- **版本控制：** 为了跟踪项目更改并与其他人协作，Git\
  \ (https://git-scm.com/) 很棒。通常，Git 会与 GitHub 或 GitLab 配对使用。\n\n## 资源\n\n资源市场存在，提供各种资源，包括精灵图、3D\
  \ 模型、音乐和音效。大多数情况下，你需要购买资源；然而，一些供应商提供免费资源。以下是此类供应商的列表：\n\n- **itch.io** 有一个资源部分，包含独立开发者创建的免费和付费资源：https://itch.io/game-assets\n\
  - **Kenney** 提供大量免费游戏资源，且风格简洁干净：https://kenney.nl/\n- **Quaternius** 也提供免费游戏资源，主要专注于低多边形\
  \ 3D：https://quaternius.com/\n- **OpenGameArt** 是免费艺术和音效资源的存储库：https://opengameart.org/\n\
  - **Freesound** 是一个由社区驱动的音效数据库：https://freesound.org\n- **ZapSplat** 是一个免版税音效和音乐曲目的集合：https://www.zapsplat.com/\n\
  - **BBC** 发布了一个供个人使用的音效档案：https://sound-effects.bbc.co.uk/rewind\n- **Lospec** 是色彩理论和调色板的绝佳资源：https://lospec.com/\n\
  - **Pixabay** 和 **Unsplash** 是占位图或背景图像的绝佳资源：\n  - https://pixabay.com\n  - https://unsplash.com/\n\
  - **BlenderKit** 是集成到 Blender 中的免费和高级 3D 模型的良好资源：https://www.blenderkit.com/\n-\
  \ **Google**、**DaFont** 和 **Font Squirrel** 都为你的项目提供优秀的字体：\n  - https://fonts.google.com/\n\
  \  - https://www.dafont.com/\n  - https://www.fontsquirrel.com/\n\n当创建你的第一个游戏或原型时，最好从免费资源开始或自行创建。这样可以在不花钱的情况下学习。如果你使用其他地方的资源，你必须记得检查下载的任何资源的许可。如果计划发布你的游戏，这一点就更加重要。\n\
  \n在开发过程中，在早期阶段使用占位符或基本形状。这让你可以专注于机制和游戏玩法而不是视觉效果。\n\n最后，加入可以分享资源和建议的社区。通过使用合适的工具并知道在哪里找到资源，你可以专注于学习和构建游戏。\n\
  \n## 构建你的作品集\n\n一个 **作品集** 对于任何有志于游戏开发的人来说都是必不可少的。这是因为游戏开发从根本上说是一项实践技能，而不是另一门理论学科。当然，了解设计、编程和艺术的底层概念很重要；然而，游戏开发者能力的真正体现在于他们对这些技能的应用。\n\
  \n你作品的作品集证明了你对这些概念的掌握，并展示了你对游戏开发工具、技术和工作流程的经验。你创建功能性、引人入胜且有趣的游戏的能力将得到清晰展示。包括你的已完成项目和原型，以突出你的实践经验和解决问题的能力，表明你熟悉行业标准的工具，如游戏引擎和资源创建软件。\n\
  \n一个游戏作品集的绝佳起点是 **itch.io**（请参阅 *参与游戏 Jam* 部分了解网站）。你可以在 itch 上创建账户并免费托管你的游戏，只需注册即可。每个\
  \ itch 页面都可以完全自定义，你可以按照这里的实用指南进行操作：https://itch.io/docs/creators/design。\n\n游戏开发者一直在学习，你的作品集也会反映这一点。你作为开发者正处于终身旅程中。你的作品集记录了这段旅程，证明你已将理论付诸实践，并且能够将想法转变为可玩的现实。\n\
  \n## 开发游戏创意\n\n现在你已经掌握了这些信息，你可能急于开始为你的作品集制作游戏。不知道从哪里开始可能会让人望而生畏。创造力并不容易，而一个提示往往非常有助于点燃灵感的火花，这可能迅速变成燎原之势！\n\
  \n如果你为下一个项目的游戏创意苦恼，你可以使用游戏创意生成器：https://letsmakeagame.net/game-idea-generator/。\n\
  \n如果随机创意不吸引你，那么你可以尝试这些经过验证的技巧来产生创意起点：\n\n- **混搭热门游戏：** 查看至少两款热门游戏的核心机制，然后想出一种方法将它们组合成你游戏中的一个机制。这可能导致一些有趣且新颖的游戏玩法。\n\
  - **简化：** 以一些复杂游戏为灵感，创造性地思考如何将体验简化为手机休闲游戏。考虑添加限制，例如只使用一个屏幕或游戏时间不超过一分钟。\n- **打磨：**\
  \ 每天在各种数字商店上发布如此多的游戏。这是一个创意金矿，因为许多游戏仓促上市，明显缺乏打磨。你不必想出一个全新的创意；你只需要很好地执行一个流行的创意即可。\n\
  - **给人惊喜：** 将创意推向荒谬的程度。往往，优秀游戏的关键在于出人意料和惊喜元素。\n- **感受即乐趣：** 吸引玩家的情感。你的受众可能很快会忘记你的游戏内容是什么，但他们永远不会忘记游戏带给他们的感受。这将鼓励口碑传播。\n\
  - **使用新技术：** 随着生成式 AI 的兴起，每个人都可以获得一个用于头脑风暴的平台以及无限的反馈和帮助。利用这项技术。\n- **个人灵感：** 如果你的游戏灵感来自你自己的真实生活经历，它将是独特且易于产生共鸣的。\n\
  - **反转：** 颠倒熟悉的概念可以成为有趣想法的良好来源。例如，与其扮演拯救世界的英雄，不如扮演试图避免被阻止的反派？*Overlord*（最初于 2007\
  \ 年发布）和 *Untitled Goose Game*（最初于 2019 年发布）都玩弄了这个想法——让玩家制造混乱而不是阻止它。\n- **逆向工程：**\
  \ 你可以拆解并重建知名且成功的游戏，并为其添加新转折。例如 *Tetris*（最初于 1984 年发布）。如果你的目标不是拼合方块，而是拆解一个完整结构会怎样？或者想象一个像\
  \ *Stardew Valley*（最初于 2016 年发布）这样的农场游戏，但设定在外星球上，你必须让作物适应奇异的生物群落并管理氧气水平。\n\n现在你已经探索了生成独特且引人入胜的游戏创意的不同方法，是时候迈出下一步——将这些创意转变为一个完整规划的项目了。在下一节中，你将找到一个实用的设计指南，帮助你将概念塑造为可以开始构建的游戏。\n\
  \n## 下一个项目的设计指南\n\n一旦有了创意，以下设计原则可以帮助让你的游戏成为一种令人满意的体验：\n\n- **好奇心应得到回报：** 玩家应被鼓励探索游戏开发者花费大量时间规划和设计的关卡。如果他们偏离主线，那么这段时间投入应该是值得的。奖励故事内容、隐藏宝藏、稀有物品或增益道具将保持玩家的探索欲并使游戏玩法保持新鲜。\n\
  - **胜负条件应清晰区分：** 不要用模糊的胜负条件混淆玩家。玩家需要准确且即时的反馈，了解他们为何失败以及如何成功。视觉提示在这里能帮大忙。使用进度条、生命条、危险符号和颜色参考等元素将给予玩家信心。\n\
  - **一致性是关键：** 教会玩家游戏规则，然后坚持这些规则。模式为玩家建立信任，并创造一个一致的游戏世界，让玩家乐于探索。\n- **展示而非讲述：** 教程关卡可能极其枯燥，而且由于它通常是玩家体验的第一个关卡，有可能让某人完全对游戏失去兴趣。最好的教程会巧妙地引导玩家自行发现解决方案和游戏机制，而不会破坏沉浸感。\n\
  \n\n\n一个极佳的例子是 Valve 于 2007 年首次发行的 *Portal*，它通过巧妙设计的谜题逐步引入每一种新机制，复杂度逐渐提升。玩家通过实践学习，而不是阅读说明。这种互动式学习让玩家保持投入，并使教程感觉像是游戏的自然组成部分。\n\
  \n- **公平即乐趣：** 人类有强烈的正义感，想要事情公平。不要通过允许敌人打破适用于玩家的规则来增加难度。我的意思是能够传送并违背游戏内物理的敌人——基本上就是作弊。\n\
  - **避免负面强化：** 如果玩家努力获得了奖励，就不要把它拿走。如果在玩家没有参与的情况下拿走某样东西，会让人觉得不公平。允许玩家自愿放弃物品，通常是通过出售或交换。\n\
  - **明确的目标：** 玩家最令人沮丧的事情之一就是不知道下一步该做什么。即使在开放世界探索游戏中，玩家也应始终清楚接下来可以做什么。这可以是一条完全线性的路径，也可以是在多个目标之间的选择。旅程可以充满挑战，但目标必须显而易见。\n\
  \n一个很好的例子是最初于 2017 年发行的 *塞尔达传说：旷野之息*。虽然游戏给予玩家探索的自由，但它始终通过环境线索、地图标记和微妙的 NPC 对话提供温和的引导，帮助玩家定位并选择下一步挑战的内容。\n\
  \n- **乐趣的基础：** “乐趣”是一个模糊的词。基本上，我们说一个游戏有趣，是指玩家始终有继续玩下去的动力。核心玩法必须有趣；它必须激励玩家继续旅程，因为如果没有这一点，再多的奖励、内容或故事都无关紧要。\n\
  - **玩家最了解：** 倾听反馈并及早实施更改和建议。玩家感到无聊、沮丧或困惑了吗？玩家会指出真正的问题，即阻止他们想要继续玩下去的事情。玩家反馈可以拯救你的游戏。\n\
  - **尊重玩家：** 如果你为玩家提供选择，就必须尊重他们的决定。不要提供虚假选择来强迫玩家做出 *正确* 的决定。这会破坏沉浸感。你的游戏结果应与玩家的期望相符。\n\
  \n现在你已经为设计游戏打下了坚实的基础，可以开始探索游戏开发的特定领域了。以下资源经过精心挑选，帮助你继续学习并作为开发者成长。\n\n## Further\
