  ```\n\n![](img/d34207e07c133a9e84d9caf1d479006c_180_0.png)\n\n## 7\n\n## 在 Godot\
  \ 中创建 2D 小游戏 — 第 2 部分\n\n在上一章中，我们指导你完成了在 Godot 中创建第一个完整的 2D 平台游戏关卡的过程。我们使用 **TileMap**\
  \ 构建了关卡，设置了带动画的玩家角色，并清理了默认的基础移动脚本。现在，是时候通过添加更复杂的机制并改进玩家与游戏世界的交互方式，让事情更进一步了。\n\n\
  在本章中，你将学习如何直接通过代码触发玩家动画。我们还将深入探讨诸如贴墙滑行、双跳和穿过平台等自定义行为——这些是许多平台游戏中常见的机制。我们还将添加可收集物品和巡逻敌人。最后，我们将为完成关卡编写检查点系统，让玩家能够在游戏中推进。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 使用代码控制玩家动画\n- 贴墙滑行和双跳机制\n- 穿过平台\n- 添加可收集物品\n- 添加巡逻敌人\n\
  - 实现关卡完成\n\n到本章结束时，你将更深入地了解如何通过代码让游戏机制栩栩如生，并创建更具动态性和吸引力的平台游戏体验。\n\n## 技术要求\n\n到本书的这个阶段，你应该知道如何执行以下操作：\n\
  \n- 创建节点\n- 创建场景\n\n你还应该了解 GDScript 中变量和函数的使用方法（参见第 4 章）。\n\n本章的代码文件可在本书的 GitHub\
  \ 仓库中的这里找到：https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch7\n\
  \n访问此链接查看代码运行的视频：https://packt.link/goVK2\n\n本项目中使用的游戏资源由 Pixel Frog 以知识共享零许可 Creative\
  \ Commons Zero (CC0) 发布。Pixel Frog 已允许我们在任何媒介或格式上分发、 remix、改编和基于该材料构建，甚至用于商业目的。\n\
  \n它们可以在这里找到：\n\n- Pixel Adventure 1: https://pixelfrog-assets.itch.io/pixel-adventure-1\n\
  - Pixel Adventure 2: https://pixelfrog-assets.itch.io/pixel-adventure-2\n\n## 使用代码控制玩家动画\n\
  \n动画在让游戏栩栩如生方面发挥着至关重要的作用，使玩家的操作感觉流畅且响应迅速。在本节中，我们将探讨如何在代码中触发不同的玩家动画。通过学习如何以编程方式控制动画，你将能够在空闲、奔跑和跳跃等移动状态之间无缝转换，从而增强游戏的整体感觉和精致度。\n\
  \n花点时间考虑一下我们在上一章中创建的每个动画会触发的条件。我们应该尝试想象是什么原因导致动画播放，以便我们可以在代码中实现它：\n\n- 空闲动画在玩家静止时触发（x\
  \ 和 y 速度均为 0）。\n-奔跑动画在玩家向左或向右移动时触发。为了确保精灵面向正确的方向，我们将根据移动方向翻转它。\n- 下落动画在玩家向下移动（y\
  \ 速度增加）且未贴墙滑行时触发。\n- 跳跃动画在玩家向上移动（y 速度减小）期间的第一次跳跃时播放（以防止玩家通过不断跳跃来漂浮或飞行）。\n\n- *双跳*\
  \ 动画发生在玩家已在空中、再次跳跃且未贴墙滑行时。\n- *贴墙滑行* 动画在玩家沿墙下滑并朝向墙壁按压时触发。精灵将翻转以背向其滑行的墙壁。\n\n在上一章中，我们导入并命名了所有动画，现在我们清楚地了解了在何种条件下应触发每个动画。然而，要有效地实现这些动画，仍缺少一些要素：\n\
  \n- 我们无法知道玩家当前是否正在贴墙滑行\n- 我们无法知道这是玩家的第一次跳跃\n- 我们无法知道这是否是双跳\n\n这些检查至关重要，因为我们的动画需要准确地代表玩家的操作和状态。例如，触发贴墙滑行动画要求我们检测玩家是否正在墙壁上滑动。同样，区分第一次跳跃和双跳可确保为每次操作播放正确的动画。\n\
  \n## 辅助变量\n\n通过使用 **辅助变量** 来解决这些差距，我们可以创建一个更具动态性和响应性的玩家角色，其中动画与上一章中建立的游戏机制无缝对齐。\n\
  \n为了确保我们的角色动画反映玩家的操作，我们需要跟踪某些状态，例如玩家是否正在贴墙滑行或已执行了多少次跳跃。为此，我们将引入两个新变量。\n\n在 Player\
  \ 脚本顶部，在常量之后添加以下变量：\n\n```\nvar jump_count = 0\nvar is_wall_sliding = false\n```\n\
  \n这些变量将帮助我们管理和检测触发正确动画所需的条件。\n\n前述变量将解决我们的问题；我们只需在正确的位置使用它们。从 jump_count 变量开始。当玩家跳跃或双跳时，我们将\
  \ jump_count 增加 1。当玩家再次落地时，我们将 jump_count 重置为 0。\n\n在 handle_jump() 函数中，按如下方式递增\
  \ jump_count：\n\n```\nfunc handle_jump():\n    # Reset jump count if the player\
  \ is on the floor\n    if is_on_floor():\n        jump_count = 0\n    # Jump from\
  \ the floor (first jump)\n    if Input.is_action_just_pressed(\"ui_accept\") and\
  \ is_on_floor():\n        velocity.y = JUMP_VELOCITY\n        jump_count += 1\n\n\
  \    # Double jump in the air\n    elif Input.is_action_just_pressed(\"ui_accept\"\
  ) and jump_count < 2:\n        velocity.y = JUMP_VELOCITY\n        jump_count +=\
  \ 1\n```\n\n在前面的代码中，当玩家跳跃时，jump_count 会增加 1，而当玩家落在地面上时，jump_count 会重置为 0。\n\n现在我们已添加必要的变量来跟踪玩家的状态，我们可以在下一节开始实现使用它们的机制。\n\
  \n## 贴墙滑行和双跳机制\n\n在本节中，我们将创建专用函数来处理贴墙滑行和双跳，确保玩家移动流畅且响应迅速。这些机制不仅能增强游戏玩法，还能直接与触发适当动画相关联。我们还将创建一个\
  \ animate 函数来调用所有特定动画。\n\n贴墙滑行和双跳是需要额外逻辑才能正确运行的独特玩家移动方式。通过将这些操作分离到各自的函数中，我们可以保持代码的有序性和更易于维护，同时确保每个机制按预期运行。让我们开始创建这些专用函数。\n\
  \n## 双跳函数\n\n双跳是平台游戏中经典的机制，可为玩家提供额外的推进力和更大的移动控制。为了实现此功能，我们需要跟踪玩家何时在空中，并确定是否允许第二次跳跃。\n\
  \n\n\n本节将指导你创建一个函数来处理双跳逻辑，确保玩家获得流畅且响应迅速的体验。\n\n让我们来看下面的代码：\n\n```\nfunc double_jump():\n\
  \    # Handle double jump\n    if Input.is_action_just_pressed(\"ui_accept\") and\
  \ !is_on_floor() and jump_count < 2:\n        velocity.y = JUMP_VELOCITY\n     \
  \   jump_count += 1\n```\n\n在前面的双跳函数中，首先检查玩家是否按下了跳跃键、是否当前处于空中（不在地面上）以及跳跃次数是否小于 2（以防止飞行）。如果所有这些条件都为真，则玩家可以进行第二次跳跃。\n\
  \n## 墙滑函数\n\n墙滑功能依赖于另一个值才能工作：摩擦力。这样我们就可以以比自由下落更慢的速度沿墙下滑。要看到其效果，按如下方式在程序顶部添加一个新常量：\n\
  \n```\nconst SPEED = 150.0\nconst JUMP_VELOCITY = -400.0\nconst FRICTION = 100\n\
  ```\n\n前面的名为 friction 的常量将是我们沿墙下滑的速度。100 这个值是经过选择的，因为它能带来最佳效果；不过，你也可以在测试时选择任何你认为看起来最好的数字。\n\
  \n现在，实现 wall_slide 函数：\n\n```\nfunc wall_slide(delta):\n    if is_on_wall() and\
  \ !is_on_floor():\n        if Input.is_action_pressed(\"ui_left\") or Input.is_action_pressed(\"\
  ui_right\"):\n            is_wall_sliding = true\n        else:\n            is_wall_sliding\
  \ = false\n    else:\n        is_wall_sliding = false\n```\n\n```\nif is_wall_sliding:\n\
  \    velocity.y = min(velocity.y, FRICTION)\n```\n\nwall_slide 函数通过检查特定条件并修改玩家的移动来启用墙滑机制。为了更好地理解此函数的工作原理，让我们在以下各节中逐步分解。\n\
  \n### 检查条件\n\n第一个 if 条件检查玩家是否触碰到墙壁（is_on_wall()）并且未着地（!is_on_floor()）。\n\n这验证了两件事：\n\
  \n-   使用 is_on_wall() 函数是否玩家正在触碰墙壁\n-   是否玩家未着地，由 !is_on_floor() 条件决定\n\n### 检测输入\n\
  \n在墙壁检测块内，以下行检查玩家输入：\n\n```\nif Input.is_action_pressed(\"ui_left\") or Input.is_action_pressed(\"\
  ui_right\")\n```\n\n此条件确定玩家是否按下左侧（ui_left）或右侧（ui_right）移动键。这会导致两种情况：\n\n-   如果任一键被按下，代码将\
  \ is_wall_sliding 设置为 true，启用墙滑\n-   如果没有键被按下，该变量将被设置为 false，停止墙滑\n\n### 重置墙滑\n\n\
  else 块确保如果玩家不在墙上或站在地面上，is_wall_sliding 将被设置为 false。这可以防止意外的滑动。\n\n### 限制向下速度\n\n\
  最后的检查 if is_wall_sliding: 在其块内应用行 velocity.y = min(velocity.y, FRICTION)。\n\n在这里，min()\
  \ 函数将当前向下速度（velocity.y）与预定义的 FRICTION 值进行比较。如果 velocity.y 大于 FRICTION（意味着玩家下落过快），min()\
  \ 将返回两者中较小的值——FRICTION 值。这有效地限制了墙滑期间的下落速度，确保玩家以受控的较慢速度下降。\n\n这带来了更流畅、更易控制的墙滑体验，防止沿墙快速失控地坠落。\n\
  \n通过结合这些检查和操作，wall_slide 函数确保玩家可以根据输入和环境无缝地进入和退出受控的墙滑。这为直观的游戏玩法机制奠定了基础。\n\n请记住在\
  \ process 函数中调用我们的新函数，以便我们可以使用它们：\n\n```\nfunc _physics_process(delta):\n    apply_gravity(delta)\n\
  \    double_jump()\n    wall_slide(delta)\n    move_and_slide()\n```\n\n_physics_process(delta)\
  \ 函数是我们调用所有自定义移动和物理相关函数的地方。通过调用它们，我们要求 Godot 将这些函数作为物理引擎的一部分运行。_physics_process()\
  \ 是 Godot 游戏循环的一部分，以固定间隔运行，确保玩家的动作及其与游戏世界的交互能够一致且实时地更新。\n\n使用 _physics_process()\
  \ 处理基于物理的逻辑很重要，因为它与物理引擎同步。如果改用 _process()——它在每个渲染帧运行，并且可能因帧率而异——可能会导致卡顿或不一致的移动，尤其是在性能较低的机器上。这是因为\
  \ _process() 不能保证一致的计时，而这对于物理计算至关重要。\n\n## 动画函数\n\n下一步是重写代码中的动画触发条件。每个动画触发条件都用注释描述。\n\
  \nAnimatedSprite2D 节点将播放相应的动画，但我们需要对该节点的引用来调用其函数。我们可以在场景准备好（加载）时获取引用，因此我们为变量添加 @onready\
  \ 注解，如以下代码所示：\n\n```\nextends CharacterBody2D\n@onready var animations = $AnimatedSprite2D\n\
  ```\n\n接下来，我们将声明一个新函数并将其命名为 animate：\n\n```\n#Handle Animations\nfunc animate():\n\
  \    # Stationary player\n    if velocity.x == 0 and velocity.y == 0:\n        animations.play(\"\
  idle\")\n\n    # Player moving horizontally (left or right)\n    elif velocity.y\
  \ == 0:\n        animations.play(\"run\")\n\n    # Player is falling\n    elif velocity.y\
  \ > 0 and !is_wall_sliding:\n        animations.play(\"fall\")\n\n    # Player is\
  \ jumping (first jump)\n    elif velocity.y < 0 and jumpCount == 0:\n        animations.play(\"\
  jump\")\n\n    # Player is double-jumping\n    elif !is_on_floor() and jumpCount\
  \ > 0 and !is_wall_sliding:\n        animations.play(\"double_jump\")\n\n    # Player\
  \ is sliding on wall\n    elif is_wall_sliding:\n        animations.play(\"wall_slide\"\
  )\n\n    # Flip the sprite based on movement direction\n    animations.flip_h =\
  \ velocity.x < 0\n```\n\n请记住在 _physics_process() 函数中调用 animate() 函数：\n\n```\nfunc\
  \ _physics_process(delta):\n    apply_gravity(delta)\n    standard_player_movement()\n\
  \    double_jump()\n    wall_slide(delta)\n    animate()\n    move_and_slide()\n\
  ```\n\n在前面的代码中，我们再次确保在 physics_process 函数中重复调用所有自定义函数。\n\n现在，测试游戏，你的玩家应该会有动画！我们的下一步是设置穿透平台，以便玩家可以从下方跳过平台并从上方按下以穿过平台。\n\
  \n## 穿过平台\n\n我们在第 6 章中在 TileMap 上创建了两个不同的物理层，以便玩家可以通过某些平台向上跳跃并向下穿过。由于我们将这些图块制作成单向图块，因此可以从下方跳过它们，无需编码。\n\
  \n现在，我们需要设置代码，以便当我们站在这些平台上并按下时，玩家可以穿过这些平台。我们的代码应检查玩家是否按下向下键，然后简单地关闭碰撞掩码编号 3（穿透层）。这意味着玩家将停止在\
  \ pass_through 层上检测碰撞，并将下落直到到达它检测碰撞的层，即地面层。这在 check_pass_through() 函数中有所演示，如下所示：\n\
  \n```\nfunc check_pass_through():\n    if Input.is_action_pressed(\"ui_down\"):\n\
  \        set_collision_mask_value(3, false)\n    else:\n        set_collision_mask_value(3,\
  \ true)\n```\n\n如前面的代码所示，已创建了一个名为 check_pass_through() 的新函数。它随后检查用户是否按下向下键，如果是，则将碰撞掩码层编号\
  \ 3 的值设置为 false（禁用）。如果玩家未按下向下键，该值将被重置为 true（启用）。\n\n\n\n请记住在 _physics_process()\
  \ 中的函数调用列表中添加 check_pass_through()；否则，该函数将不会运行！\n\n```\nfunc _physics_process(delta):\n\
  \    apply_gravity(delta)\n    standard_player_movement()\n    double_jump()\n \
  \   wall_slide(delta)\n    animate()\n    check_pass_through()\n    move_and_slide()\n\
  ```\n\n玩家现在可以奔跑、跳跃、双跳和在关卡中进行墙滑，以及穿过特殊平台掉落。我们的下一步是在关卡中散布一些物品供玩家收集。\n\n## 添加可收集物品\n\
  \n在许多游戏中，**collectible items** 在通过为玩家提供奖励、增益或必要的资源来增强游戏玩法方面发挥着至关重要的作用。这些物品可以营造出一种进展感，鼓励探索，并为游戏增添策略层次。在本节中，我们将探讨如何在\
  \ Godot 中创建可收集物品系统。\n\n你将学习如何设计一个可收集物品，检测玩家何时与其交互，并实现授予奖励或效果的逻辑。到本节结束时，你将拥有一个可重用的系统，可以扩展以包含关卡中各种可收集物品。\n\
  \n对于可收集物品，我们将使用 Items | Fruits 文件夹中的 Strawberry。但是，只要你对以下步骤进行一些调整，你可以使用任何你想要的物品。\n\
  \n## 草莓场景（我们的可收集物品）\n\n对于我们的游戏，玩家将收集草莓。一旦玩家收集了关卡中的所有草莓，一个旗帜就会出现，玩家触碰它即可完成关卡。\n\n\
  请按照以下步骤创建可收集物品场景：\n\n- 1. 创建一个新场景并添加 **Area2D** 作为根节点。**Area2D** 是一个不可见的节点，用于定义\
  \ 2D 空间的区域，可检测对象是否发生碰撞或停止碰撞。\n- 2. 添加一个 **AnimatedSprite2D** 节点作为子节点。\n- 3. 回想一下，要为精灵制作动画，我们使用多个帧来描绘精灵在运动各个阶段的样子。这些帧通常被组合在一个单一图像中，称为\
  \ **sprite sheet**。\n- 4. 要为精灵制作动画，我们首先导入 sprite sheet，然后将其分割成单独的帧。为此，选择 **AnimatedSprite2D**\
  \ 节点，并在 **Inspector** 中的 **Sprite Frames** 属性中，点击 **New SpriteFrames**。这在图 7.1 中显示：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_191_0.png)\n\nFigure 7.1 – 创建新的 SpriteFrames\n\
  - 5. 如图 7.1 所示，在 **Inspector** 中点击 **New SpriteFrames** 将在屏幕底部打开 **SpriteFrames**\
  \ 区域。这里是我们导入帧并创建和命名新动画的空间。这在图 7.2 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_191_1.png)\n\
  \nFigure 7.2 – SpriteFrames 区域\n\n如图 7.2 所示，我们目前只有默认动画，且没有关联的图像或帧。我们现在将为 **idle**\
  \ 动画创建动画，然后从 sprite sheet 导入与其关联的精灵。\n- 6. 首先将默认动画重命名为 **idle**。\n- 7. 在 **FileSystem**\
  \ 中，创建一个名为 **Collectibles** 的新文件夹。\n- 8. 现在，在从 Pixel Frog 下载的资源中找到 **Items | Fruits**\
  \ 文件夹（参见 *技术要求* 部分），并将草莓的图像拖到 **FileSystem** 中的 **Collectibles** 文件夹。\n- 9. 选择 **idle**\
  \ 动画，然后点击 **Add frames from a Sprite Sheet** 按钮或按 *Ctrl + Shift + O*。现在，在你的 Collectibles\
  \ 文件夹中选择 Idle 图像文件。\n- 10. 现在，你必须数出精灵图像的数量并按需更新 **Horizontal** 和 **Vertical** 帧属性（见图\
  \ 7.3）。\n- 11. 然后，点击 Select All 按钮，然后点击 Add x Frame(s) 按钮。这在图 7.3 中以草莓的 idle 帧为例显示：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_192_0.png)\n\nFigure 7.3 – 设置 Horizontal\
  \ 和 Vertical 帧并将它们添加到动画中\n\n现在，如图 7.3 所示，你已从图像（sprite sheet）中裁剪出单独的帧，你的 SpriteFrames\
  \ 窗口将更新为用于 idle 动画的图像。这在图 7.4 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_192_1.png)\n\
  \nFigure 7.4 – 用于 idle 动画的帧\n\n快速提示：需要查看此图像的高分辨率版本吗？在 next-gen Packt Reader 中打开本书或在\
