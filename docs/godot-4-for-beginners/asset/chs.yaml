  \nFigure 2.18 – Sprite2D renamed as Player\n\n- 7. 现在按 Ctrl + S 将场景保存为 player.tscn\
  \ 到我们的 Scenes 文件夹中：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_67_1.png)\n\nFigure\
  \ 2.19 - The saved player.tscn scene\n\n- 8. 确保你处于 2D 视图。如果需要，通过点击屏幕顶部的 2D 切换到它。\n\
  \n- 9. 现在将你选择的角色图像拖放到 Player 节点的 <Empty> Texture 属性上：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_68_0.png)\n\
  \nFigure 2.20 - Place your character image in the Texture property of the Player\
  \ node\n\n- 10. 现在你的角色已在 Player 场景中：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_68_1.png)\n\
  \nFigure 2.21 – The Player sprite in the Viewport\n\n\n\n11. 现在我们将为 Player 附加一个脚本。右键单击\
  \ Player 节点并选择“附加脚本...”或单击“滚动+”图标：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_69_0.png)\n\
  \n图 2.22 – 将新脚本附加到 Player 节点\n\n12. 按 *Ctrl + S* 保存脚本并将其保存在 Scripts 文件夹中。现在你在 Scripts\
  \ 文件夹中将有一个新的 player.gd 脚本：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_70_0.png)\n\
  \n图 2.23 – Scripts 文件夹中的 player.gd 脚本\n\n在我们编写一些代码以允许玩家对不同的用户输入做出反应之前，请记住我们希望对 *左键点击*、*右键点击*\
  \ 和 *Enter/回车* 被按下时显示不同的问候语。\n\n如果你还记得我们的 LEGO 类比，我们需要将 **问候标签** 砖块（节点）附加到我们的 **玩家**\
  \ 砖块（节点）上。我们通过将 greetings_label.tscn 从 **文件系统** 拖到 **玩家** 场景中的 **玩家** 节点来实现这一点：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_71_0.png)\n\n图 2.24 – 将 greetings_label.tscn\
  \ 拖到 Player 节点上使其成为子节点\n\n在 Godot 中，原点或起始位置是从屏幕左上角或位置 0, 0 开始测量的。几乎总是情况下，你会希望保持原点不变，但仅为本示例，我们将移动它。\n\
  \n使用选择工具（看起来像光标）或通过在键盘上按 Q 来在视口中定位 Player 和 GreetingsLabel：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_72_0.png)\n\
  \n图 2.25 – 选择工具\n\n你的 Player 场景应该看起来像这样：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_72_1.png)\n\
  \n图 2.26 – Player 场景\n\n现在我们的精灵已经位于场景中心附近，我们需要编写一个脚本使其对用户输入做出响应。\n\n## 对输入进行玩家反应脚本编写\n\
  \n我们编写本节代码的目标是允许用户根据按下的鼠标按钮从精灵处获得不同的响应。我们将处理三种类型的交互：\n\n- *左键点击：* 显示问候语 **嗨，大家好！**\n\
  - *右键点击：* 显示 **Godot 很棒！**\n- *按下 Enter：* 显示 **你好，世界！**\n\n让我们首先确保问候标签初始时是隐藏的。\n\
  \n### 在用户提供输入之前隐藏标签\n\n我们不希望在场景首次运行时问候语可见。我们希望通过调用其 hide() 函数来隐藏标签。\n\n由于 _ready()\
  \ 函数是在节点及其所有子节点加载到场景树后首先运行的函数，因此我们可以使用 Godot 快捷操作符 $ 访问 GreetingsLabel 节点。\n\n一旦我们获得了对该节点的访问权限，我们只需调用\
  \ hide() 函数即可：\n\n```gdscript\n#### Called when the node enters the scene tree for\
  \ the first time.\nfunc _ready() -> void:\n    $GreetingsLabel.hide()\n```\n\n![](img/d34207e07c133a9e84d9caf1d479006c_73_0.png)\n\
  \n重要提示\n\n请注意 GDScript 是一种缩进语言。这意味着函数后的第一行（如前述代码中所示）会缩进一次。游戏引擎要求这样做才能使代码正常工作。我建议所有使用本书数字版的人手动重新输入代码或从本书的\
  \ GitHub 仓库复制代码文件，以避免因复制和粘贴代码而导致的错误。\n\n有了这段代码，运行游戏时 GreetingsLabel 将不再可见。你可以通过按\
  \ F6 或单击图 2.27 所示的“运行当前场景”按钮来测试此场景：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_73_1.png)\n\
  \n图 2.27 – 运行当前场景按钮\n\n你会注意到你再也看不到问候语了。\n\n### 输入处理\n\n现在，为了让我们的实验保持简单，我们将使用内置方法来处理输入。**内置方法**\
  \ 只是指已经创建并作为 Godot Engine 组成部分的方法。你可以通过方法名以下划线开头来判断它是内置的。你到目前为止已经见过两个：`_ready()`\
  \ 和 `_process()`。\n\n对于输入，我们将使用 `_unhandled_input()`。现在不必太担心它，只要知道如果没有其他函数/方法来捕获用户输入并处理它，那么此方法将被运行。\n\
  \n我们声明 `_unhandled_input` 函数头，然后在函数内部处理不同类型的输入。在我们的实验中，我们正在监听两种类型的输入：*鼠标* 和 *键盘*。对于键盘，我们只监听一个键\
  \ – *Enter*。对于鼠标，我们监听 *左键点击* 和 *右键点击*。让我们更详细地看一下：\n\n- 当我们检测到来自鼠标的输入时，我们需要再次显示标签，因此我们调用标签的\
  \ show() 函数。\n  - 如果听到左键点击，我们将 **问候标签** 的文本更改为 **嗨，大家好！**\n  - 如果是右键点击，我们将其设置为 **Godot\
  \ 很棒！**\n- 当我们检测到来自键盘的输入时，我们需要再次显示标签，因此我们调用标签的 show() 函数。\n  - 如果听到按下 Enter，我们将文本设置为\
  \ **你好，世界！**\n\n现在，让我们来看代码实现：\n\n```gdscript\nextends Sprite2D\n#### This script\
  \ is attached to a Sprite2D node.\n#### It listens for mouse and keyboard input\
  \ and displays\n#### different messages on a Label depending on what was pressed.\n\
  \n#### Called when the node enters the scene tree for the first time (i.e.,\n####\
  \ when the scene starts).\nfunc _ready():\n    # Hide the Label at the beginning\
  \ so it's not visible until an input\n    # event happens.\n    $GreetingsLabel.hide()\n\
  \n#### Called every frame. 'delta' is the time in seconds since the last frame.\n\
  func _process(delta):\n    # We're not doing anything every frame in this example,\
  \ but the\n    # function is here in case we want to later.\n    pass\n\n#### Called\
  \ when the player performs an input action that hasn't already been\nhandled.\n\
  func _unhandled_input(event):\n    # Check if the event was a mouse button press.\n\
  \    if event is InputEventMouseButton:\n        # Show the label whenever a mouse\
  \ button is pressed.\n        $GreetingsLabel.show()\n        # Check which mouse\
  \ button was pressed.\n        if event.button_index == MOUSE_BUTTON_LEFT:\n   \
  \         # If the left mouse button was clicked, set the label's text\n       \
  \     # to \"Hi Folks!\"\n            $GreetingsLabel.text = \"Hi Folks!\"\n\n \
  \       elif event.button_index == MOUSE_BUTTON_RIGHT:\n            # If the right\
  \ mouse button was clicked, set the label's text\n            # to \"Godot is Great!\"\
  \n            $GreetingsLabel.text = \"Godot is Great!\"\n\n    # Check if the event\
  \ was a key press.\n    elif event is InputEventKey:\n        # Only show the label\
  \ and set the text if the Enter key was\n        # pressed.\n        if event.keycode\
  \ == KEY_ENTER:\n            $GreetingsLabel.show()\n            $GreetingsLabel.text\
  \ = \"Hello World!\"\n```\n\n现在我们已经测试了 **玩家** 场景，并且知道它按预期工作。我们可以返回到 **Main** 场景并移除\
  \ **问候标签** 节点，然后将 player.tscn 拖到 **Main** 节点上。然后再次运行游戏并检查一切是否正常工作：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_76_0.png)\n\
  \n图 2.28 – 我们新的 Main 场景\n\n这是一个重要的章节，向你介绍了 Godot 的基本构建块。我建议你经常重温它，甚至可以返回章节末尾的总结，以提醒自己场景、节点和脚本的要点和目的。\n\
  \n## 总结\n\n在本章中，我们探索了 Godot 4 的基础功能，从编辑现有项目和创建额外场景开始。你学习了如何导航界面、有效保存场景，并掌握了 Godot\
  \ 核心的节点和场景设计理念。我们还介绍了如何通过对玩家输入做出反应使你的项目具有交互性。通过掌握这些核心概念和工具，你已迈出了自信使用 Godot 开发游戏的第一步。\n\
  \n在下一章中，我们将对 3D 进行介绍，并了解如何使用材质和光照。\n\n\n\n## 在 Discord 上加入我们的社区\n\n加入我们的 Discord\
  \ 社区空间，与作者和其他读者进行讨论：\n\nhttps://packt.link/godot-4-game-dev\n\n![](img/d34207e07c133a9e84d9caf1d479006c_77_0.png)\n\
  \n## 3\n## 3D 简介\n\n在 Godot 中使用 3D 就像踏入游戏开发的全新维度——几乎就是字面意思！本章是您了解 Godot 中 3D 基础的入口，将引导您学习必备的工具和概念。无论您是在设计广阔的开放世界还是紧凑的\
  \ 3D 拼图，这些基础技能都将为您取得成功奠定基础。\n\n我们将首先学习如何创建 3D 对象，任何 3D 场景的构建块。接下来，我们将探讨如何通过应用材质使这些对象在视觉上更具吸引力，材质赋予它们颜色、纹理和细节。最后，我们将向您介绍光照，这是使\
  \ 3D 环境栩栩如生、增加深度、氛围和真实感的关键组件。\n\n本章我们将涵盖以下主要主题：\n\n- 创建 3D 对象\n- 为您的对象创建材质\n- 为场景创建光照\n\
  \n到本章结束时，您不仅将了解如何构建和照亮一个简单的 3D 环境，还将对在 Godot 的 3D 工作区中导航充满信心。这些技能对于任何有志于游戏开发的人来说都是必不可少的，并为创建沉浸式的\
  \ 3D 体验提供了坚实的基础。\n\n## 技术要求\n\n本章的代码文件可在本书的 GitHub 仓库中获取：https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch3/introto3d\n\
  \n访问此链接查看代码运行的视频：https://packt.link/6Se0U\n\n## 创建 3D 对象\n\n到目前为止，我们一直专注于 2D 场景和\
  \ 2D 节点，以及使用 GDScript 进行一些脚本编写。需要注意的是，您并不局限于 2D，因为 Godot 是一款功能极其强大的 3D 游戏引擎。\n\n\
  我们将通过在项目管理器窗口中点击 +Create 按钮来创建新的 Godot 项目，从而开始探索 3D。请记住为您的项目创建一个文件夹并命名。我将我的项目命名为\
  \ IntroTo3D，如图 3.1 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_80_0.png)\n\n\
  图 3.1 – 创建新的 Godot 项目\n\n默认情况下，新的 Godot 项目以 3D 视图打开——这很方便！现在我们可以创建第一个 3D 场景。由于 Godot\
  \ 使用场景树结构，我们需要为树选择一个根节点。最简单的方法是点击 3D Scene 按钮：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_81_0.png)\n\
  \n图 3.2 – 使用 Node3D 作为根创建新的 3D 场景\n\n您的 Godot 界面现在应如下图 3.3 所示。请注意，我们现在多了一个维度——Z——代表深度，并且我们将\
  \ Node3D 作为场景树的根。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_81_1.png)\n\n图 3.3\
  \ – 我们第一个 3D 场景的概览\n\n\U0001F50D **快速提示：** 需要查看此图像的高分辨率版本吗？在下一代 Packt Reader 中打开本书或在\
  \ PDF/ePub 副本中查看。\n\n\U0001F512 **下一代 Packt Reader** 和一本 **免费的 PDF/ePub 副本** 已包含在您的购买中。扫描二维码或访问\
  \ packtpub.com/unlock，然后使用搜索栏按名称查找本书。请仔细检查所示的版本，以确保您获得正确的版本。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_82_0.png)\n\
  \n现在通过按 *Ctrl + S* 或点击 **Scene** 菜单并选择 **Save Scene** 来保存您的新场景。将场景命名为 main.tscn，如图\
  \ 3.4 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_82_1.png)\n\n图 3.4 – 将我们的场景保存为主\n\
  \n探索场景的舞台已经准备就绪。我们可以利用快捷键轻松完成此操作。\n\n### 在场景中移动\n\n您可以在 3D 场景中移动，就像在大多数 3D 游戏中一样：\n\
  \n- 按住鼠标右键环顾四周\n- 使用 WASD 在场景中飞行（按住右键时）\n- 使用 E 向上飞行\n- 使用 Q 向下飞行\n- 使用鼠标中键围绕屏幕上显示内容的中心飞行\n\
  \n在 2D 中，我们使用 Sprite2D 来可视化事物。在 3D 中，我们将使用 MeshInstance3D。\n\n在 3D 图形中，网格是 3D 对象或形状的数字模型，通过连接点（称为顶点）、线（边）和平面（面）创建。\n\
  \n要在场景中创建网格实例，我们可以拖入预先创建的 3D 模型，也可以与 MeshInstance3D 一起使用基本形状。为此，将新的 MeshInstance3D\
  \ 节点添加到场景树中：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_83_0.png)\n\n图 3.5 – 向我们的场景添加\
  \ MeshInstance3D 节点\n\n虽然我们现在有了网格，但仍然没有任何可见内容。您可以将其视为没有纹理的精灵。我们需要选择一个基本形状。使用右侧的检查器窗口，点击\
  \ Mesh 属性下拉菜单并选择 New BoxMesh。\n\n这将创建一个新的立方体，您可以使用相同的 **Select**、**Move**、**Rotate**\
  \ 和 **Scale** 工具进行操作。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_84_0.png)\n\n\
  图 3.6 – 向我们的 MeshInstance3D 添加 BoxMesh\n\n现在 **MeshInstance3D** 有了网格形状，我们可以在 Viewport\
  \ 中看到立方体或盒子：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_84_1.png)\n\n图 3.7 – MeshInstance3D\
  \ 现在在 Viewport 中作为 3D 立方体可见\n\n> 注意\n> \n> 在 2D 中，对象的大小和位置以 *像素* 为单位测量，而在 3D 中，Godot\
  \ 使用 *公制系统*，因此每个单位为 1 米，表示 1 米乘 1 米的面积。\n\n我们可以使用 *MeshInstance3D* 中的多个简单形状制作一个\
  \ 3D 棍人。查看以下结果并尝试使用 *Selection*、*Move*、*Rotate* 和 *Scale* 工具自行重现。您 *不必* 使用与我相同的形状，因此您的棍人可能看起来与我的非常不同，这也没关系。\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_85_0.png)\n\n*图 3.8 – 使用简单网格形状制作棍人*\n\
  \n如 *图 3.8* 所示，我结合了不同的基本形状来创建一个棍状人形。\n\n请注意，如果您选择 *父级 StickMan* 节点，即原始的 *Node3D*，您对它所做的任何操作——例如使用\
  \ *Scale* 或 *Rotate*——都将作用于所有子节点。\n\n## 为您的对象创建材质\n\n在 2D 中工作时，我们为 Sprite2D 提供纹理，以便在屏幕上看到它。在\
  \ 3D 中，我们使用材质。\n\n材质描述了游戏引擎应如何显示对象。一旦网格具有材质，就可为其分配颜色和阴影等属性。它还可以与场景中的光照交互。我们的棍人已经有一个默认的灰色材质，否则我们就看不到它！\n\
  \n### 创建材质\n\nGodot 将材质保存为资源。这意味着一旦我们创建了一个材质，就可以在不同的对象上反复使用。让我们在 FileSystem 中创建一个名为\
  \ Materials 的新文件夹：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_86_0.png)\n\n图 3.9\
  \ – Materials 文件夹\n\n现在右键单击 Materials 文件夹，选择 Create New，然后选择 Resource...：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_86_1.png)\n\
  \n图 3.10 – 创建新资源\n\n在接下来显示的 Resource 菜单上，搜索 material，选择 StandardMaterial3D，并为其命名。我将其命名为\
  \ stick_material.tres：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_87_0.png)\n\n\
  图 3.11 – 添加 StandardMaterial3D\n\n创建材质后，可以在检查器窗口中修改它。材质具有许多可更改的属性，例如纹理、粗糙度、光泽度、颜色和透明度。我们可以通过点击\
  \ Albedo 下拉菜单并选择喜欢的颜色来更改材质的颜色：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_88_0.png)\n\
  \n图 3.12 – 在 Albedo 下拉菜单中更改材质颜色\n\n单词 albedo 来自拉丁语 albus，简单意思是白色。Albedo 传统上用于更改材质的颜色和透明度。\n\
  \n我选择了棕色，使材质看起来更像木头。现在尝试调整 Roughness 值以进一步改善外观：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_88_1.png)\n\
  \n图 3.13 – Roughness 的值范围为 0 到 1\n\n\n\n可以用来实验的材料选项非常多。然而，如果你真的想创建看起来像要复制的物体的材质，我建议使用诸如\
  \ **Material Maker** 这样的工具，它是免费的，并且使用 Godot Engine 制作：\n\nhttps://rodzilla.itch.io/material-maker\n\
  \n## 应用材质\n\n实际上，将材质应用到网格上就像把材质资源文件拖放到视口中的网格上一样简单！\n\n你可以在图 3.14 中看到这种效果：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_89_0.png)\n\
  \n图 3.14 – 将你的材质拖放到你的网格上\n\n正如你在图 3.14 中看到的，当你把材质放在其中一个网格形状上时，网格会立即采用该材质的颜色和纹理。\n\
  \n如果你更改材质的任何属性，已应用该材质的任何网格也会实时更新。我建议你现在就试试看效果。\n\n你可以在图 3.15 中看到这种效果——所有网格都已用新材质更新：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_90_0.png)\n\n图 3.15 – 更改粗糙度更新了所有网格上的材质\n\
  \n你注意到材质的粗糙度如何改变了棍人看起来？\n\n## 挑战自己\n\n在本小节中，我们将挑战自己练习刚刚学到的技能。\n\n尝试复制图 3.16 中显示的三种材质。第一种仅使用\
  \ Albedo，粗糙度低且金属度值高。第二种使用 Transparency，第三种具有 Texture 值。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_91_0.png)\n\
  \n图 3.16 – 金属（左）、透明（中）和纹理（右）材质\n\n为了完成挑战，首先，在场景中添加三个 MeshInstance3D 节点。在检查器窗口中，选择一个基本的\
  \ CapsuleMesh 并通过按 `Ctrl + D` 复制它。\n\n这些步骤的预期结果如图所示 3.17：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_91_1.png)\n\
  \n图 3.17 – 具有 CapsuleMesh 形状的三个 MeshInstance3D 网格\n\n挑战的下一步是创建第一个材质。\n\n### 第一个材质\n\
  \n现在我们需要在 **Materials** 文件夹中创建三个新资源。我们将为每个材质使用 **StandardMaterial3D** 资源。为了便于识别，将材质命名为\
  \ `metal_material.tres`、`transparent_material.tres` 和 `textured_material.tres`：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_92_0.png)\n\n图 3.18 – 我们的新材质\n\n你可以将每个材质点击并拖放到每个胶囊上，这样如果我们开始更改材质属性，我们将实时看到网格更新：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_92_1.png)\n\n图 3.19 – 将你的材质拖放到胶囊上\n\n\
  在你的金属材质上，打开 Albedo 属性并将颜色更改为挑战中的那种颜色（天蓝色）。另外，调整粗糙度和 Metallic 属性，直到你满意它看起来像金属一样闪亮和反射。\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_93_0.png)\n\n图 3.20 – 创建闪亮的金属材质\n\n注意图\
  \ 3.20 中你应该调整的属性以创建想要的金属效果。\n\n### 第二个材质\n\n再次开始，通过将材质的 **Albedo** 属性更改为明亮的粉红色以匹配挑战。同时将\
  \ **Alpha** 通道降低到大约一半。你会注意到现在没有效果。这是因为我们需要调整 **Transparency** 属性以使用 **Alpha**。\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_94_0.png)\n\n图 3.21 – 创建透明粉红色胶囊\n\n注意图\
  \ 3.21 中材质的属性，你需要调整它们以创建想要的透明效果。\n\n### 第三个材质\n\n最终材质使用纹理而不是颜色。纹理只是一个图像，包裹在胶囊形状周围。我们可以简单地使用我们在第\
  \ 2 章中在 2D 中工作时为精灵使用的相同机器人图像。展开 Albedo 下拉菜单并将图像拖到空的 Texture 属性上：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_95_0.png)\n\
  \n图 3.22 – 向材质添加纹理\n\n你可以看到平面的 2D 机器人图像已被应用到胶囊形状上并被拉伸在其周围。\n\n任何 3D 场景的另一个基本部分是照明。在下一节中，我们将探索不同类型的灯光以及如何在\
  \ 3D 场景中有效地使用它们。\n\n## 为场景创建照明\n\n为了影响情绪和氛围，并视觉上增强游戏，照明至关重要。良好的照明增加深度，突出细节，并可以引导玩家的注意力，这一切都使游戏世界更具沉浸感和吸引力。\n\
  \nGodot 提供了多个照明节点。我们现在将查看其中几个主要节点。我们将把这些节点添加到当前场景并检查它们对三个胶囊的影响。\n\n点击场景树中的 + 以向场景添加新节点。使用关键字\
  \ light 搜索。你会看到 Godot 中有三种与光相关的节点类型，如图 3.23 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_96_0.png)\n\
  \n图 3.23 – Godot 中的三个主要光节点\n\n**Directional light** 通过在整个 3D 场景上投射平行光线来模拟阳光，提供来自特定方向的一致照明，使其非常适合户外环境。现在是时候在\
  \ Godot 中实现定向光了。\n\n### Directional light\n\n添加一个 **DirectionalLight3D** 节点到场景。这种类型的光模仿太阳并以平行光线的形式向单一方向发出无限光线。它用于远离场景且强度高的光线。\n\
  \n在视口中，该节点是一个指向光线来源方向的白色箭头。你可以 *rotate* 该节点以更改光线的方向。该节点的位置不会影响场景，因为光线来自四面八方。\n\n\
  尝试旋转灯光以查看它对场景的影响。你也可以在 **Inspector** 窗口中更改灯光的 **Color** 和 **Energy** 属性。\n\n你可以在图\
  \ 3.24 中看到光线来源方向显示为一个大的 *white arrow*：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_97_0.png)\n\
  \n*图 3.24 – 注意金属胶囊中的反射就像太阳正好在头顶一样*\n\n金属表面会反射光线，如图 3.24 所示。\n\n在图 3.25 中，你可以看到 Color\
  \ 和 Energy 属性，可以调整它们来改变光线的颜色和强度：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_98_0.png)\n\
  \n图 3.25 – DirectionalLight3D 的 Color 和 Energy 属性\n\n在我们向场景添加新灯光之前，点击眼睛图标将 DirectionalLight3D\
  \ 节点的可见性切换为关闭，以便我们可以看到下一个灯光的效果：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_98_1.png)\n\
  \n图 3.26 – 将 DirectionalLight3D 节点的可见性切换为关闭\n\n点击场景树中的 + 以向场景添加新节点。使用关键字 light 搜索（参见图\
  \ 3.23）。\n\n### Omni light\n\n添加一个 OmniLight3D 节点到场景。该节点从单点向所有方向发出光线，就像灯泡一样。与现实生活中的灯泡一样，越靠近它越亮。你可以通过点击其线框边缘出现的橙色圆圈来调整灯光的范围，如图\
  \ 3.27 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_99_0.png)\n\n图 3.27 – OmniLight3D\
  \ 范围手柄\n\n你也可以更改 **OmniLight3D** 的 **Color** 和 **Energy** 属性。然而，没有表面反射时很难看到。按照以下步骤修复此问题：\n\
  \n- 1. 利用你的新技能通过添加另一个 **MeshInstance3D** 节点来为场景添加地面表面。将它重命名为 Ground。\n- 2. 给它 **PlaneMesh**\
  \ 形状。缩放并移动平面，使其看起来像胶囊下方的大地板。\n\n\n\n\n-   3. 创建一个新的材质并将其保存为 `ground_material.tres`。\n\
  -   4. 将材质的 **Albedo** 属性设置为 **白色** 并将其应用到 **Ground**。它应该看起来像 *图 3.28* 一样：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_100_0.png)\n\
  \n*图 3.28 – 添加了白色材质的地面平面网格*\n\n继续尝试更改 **OmniLight3D** 的 **Color** 和 **Energy** 属性。注意它如何改变场景的氛围。\n\
  \n你在 *图 3.29* 中看到地板上灯光的 *红色* 光晕吗？\n\n![](img/d34207e07c133a9e84d9caf1d479006c_101_0.png)\n\
  \n图 3.29 – 更改 OmniLight3D 的颜色属性\n\n你也可以使用 DirectionalLight3D 启用阴影。但是，要看到阴影，你需要将\
  \ DirectionalLight3D 的 Energy 属性设置为 0 以将其关闭。然后阴影将由 OmniLight3D 投射。打开 Shadow 属性下拉菜单并启用它：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_101_1.png)\n\n图 3.30 – 在 DirectionalLight3D\
  \ 上启用阴影\n\n一旦启用了阴影，你就可以看到场景中物体投射的阴影，如图 3.31 所示。有时由于 Godot 4 中的错误，阴影不会出现。在这种情况下，你应该保存你的工作并重新启动引擎。\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_102_0.png)\n\n图 3.31 – 由 DirectionalLight3D\
  \ 投射的阴影\n\n现在我们只有一个灯光可以继续实验。\n\n## Spotlight\n\n就像在剧院一样，SpotLight3D 是一个节点，它以锥形朝单一方向发射光线。这对于前照灯或路灯等灯光效果很好。通过在场景树中点击它们右侧的眼形可见性切换按钮来禁用\
  \ OmniLight3D 和 DirectionalLight3D。\n\n现在向场景中添加一个 Spotlight3D 节点。你将看到灯光的锥形线框，并且我们再次可以使用小橙色圆圈来改变灯光的范围和角度。\n\
  \n你可以在图 3.32 中看到斑点将投射的光锥显示为白色锥体：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_103_0.png)\n\
  \n图 3.32 – 将 SpotLight3D 放在我们的纹理胶囊网格上\n\n当然，我们也可以更改灯光的 **Color** 和 **Energy** 属性，并且我们可以像对\
  \ **DirectionalLight3D** 所做的一样启用阴影：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_104_0.png)\n\
  \n*图 3.33 – 更改聚光灯的颜色和角度并启用阴影*\n\n现在你知道如何在 Godot 中添加和操作三种类型的灯光，你就拥有了为你的 3D *Made\
  \ in Godot* 游戏营造合适氛围的工具。\n\n## Summary\n\n在本章中，你迈出了使用 Godot 进行 3D 游戏开发的第一步。你学习了如何使用网格创建基本的\
  \ 3D 对象，为你的场景提供构建模块。然后我们探讨了如何通过应用材质、添加颜色、纹理和深度来增强这些对象，使其栩栩如生。最后，我们介绍了照明，演示了如何使用不同类型的灯光来营造氛围、突出重要区域并为场景增添真实感。\n\
  \n通过掌握这些技能，你现在拥有设计和照亮简单 3D 环境的工具，为你在游戏开发之旅中继续进行更复杂的项目奠定了基础。\n\n在下一章中，我们将详细了解如何使用\
  \ GDScript，这是一种专为与 Godot Engine 配合使用而设计的内置编程语言。\n\n## Unlock this book’s exclusive\
  \ benefits now\n\n扫描此二维码或访问 packtpub.com/unlock，然后按名称搜索本书。\n\n*注意：在开始之前请准备好你的购买发票。*\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_105_0.png)\n\n## 4\n\n## Scripting with\
  \ GDScript\n\n在本章中，你将开始使用 GDScript 的旅程，GDScript 是 Godot 核心的脚本语言。脚本是游戏开发的关键部分，使你能够控制游戏世界中的行为和交互。通过学习\
  \ GDScript，你将获得定义游戏机制、创建动态交互并构建超出静态资源的功能的能力。\n\n我们将首先向你展示如何在 Godot 中创建、编辑和保存脚本。然后，我们将向你介绍关键的编程概念，例如变量和数据类型，以及它们如何与\
  \ Godot 的执行顺序协同工作。你将探索允许你执行计算和比较的数学和逻辑运算符，然后介绍使用 if、else if 和 else 语句进行决策。\n\n最后，我们将深入探讨函数的使用，包括内置函数和自定义函数，以高效地组织你的代码。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n-   Understanding GDScript\n-   Creating scripts\n-   Understanding\
  \ functions\n-   Understanding variables\n-   Understanding operators\n-   Relational\
  \ and comparison operators\n-   Using custom functions\n\n到本章结束时，你将具备脚本化基本游戏机制的基础知识，并能够自信地控制游戏的逻辑和流程。\n\
  \n## Technical requirements\n\n本章的代码文件可在本书的 GitHub 仓库中获取：https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch4/introtoscripting\n\
  \n访问此链接查看代码运行的视频：https://packt.link/1mzgi\n\n## Understanding GDScript\n\nGodot\
  \ 拥有自己的内置脚本语言 GDScript，这是一种类似于 Python 的高级编程语言。与 Python 不同，GDScript 针对 Godot 的基于场景的设计理念进行了优化，并且可以指定变量的严格类型。\n\
  \n脚本用于为我们的节点编程自定义行为。在接下来的几个小标题中，我们将了解如何创建脚本、编辑它们并保存它们。\n\n## Creating scripts\n\n\
  我们已经使用过脚本，但重复是良好的老师。所以，让我们记住脚本通常附加到节点上。\n\n首先创建一个新的 Godot 项目。我将其命名为 IntroToScripting。现在创建一个新的\
  \ 2D 场景，这将在场景树中为我们提供 Node2D 作为根节点。\n\n有几种不同的方法可以将脚本附加到此节点。选择 **Node2D**，在 **Inspector**\
  \ 中找到 **Script** 属性，然后从 `<empty>` 下拉菜单中选择 **New Script...**。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_109_0.png)\n\
  \n图 4.1 – 通过 Inspector 为节点添加新脚本\n\n你也可以对想要附加脚本的节点进行 *右键单击*，然后在弹出菜单上点击 **Attach Script...**\
  \ 或点击带有加号的脚本图标。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_110_0.png)\n\n图 4.2\
  \ – 通过右键单击节点附加脚本\n\n为你的脚本命名，例如 IntroToScripting，然后点击 Create。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_110_1.png)\n\
  \n图 4.3 – 命名并创建脚本\n\n现在我们面前出现了脚本编辑器。这就像 Godot 中 GDScript 编程语言的内置 **Integrated Development\
  \ Environment (IDE)**。与其它引擎相比，这是 Godot 的一个主要优势，因为你不需要依赖第三方程序进行编码。\n\n如果你查看 *图 4.3*，你会看到我们创建脚本时勾选了\
  \ **Template** 旁边的复选框以使用默认节点。这意味着脚本将被预先填充一些代码。\n\n在 *图 4.4* 中，我们可以看到在脚本编辑器中预先填充的生成代码：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_111_0.png)\n\n图 4.4 – 脚本编辑器\n\n如 *图 4.4*\
  \ 所示，我们的脚本文件现在已出现在 **FileSystem** 下，并带有 .gd 扩展名。此外，我们可以看到两个列表：**Filter Scripts**，其中包含我们的新脚本；以及\
  \ **Filter Methods**，其中包含脚本中存在的函数。请注意，我还将 **Node2D** 重命名为 IntroToScripting 以匹配我的脚本名称。\n\
  \n脚本编辑器带有代码格式化功能。你可以看到格式化是因为代码的不同部分颜色不同。这有助于我们快速理解和识别代码的各个部分。你会注意到 func 关键字为红色，函数名为蓝色。**Auto-complete**\
  \ 也是一个功能，编辑器会尝试预测你正在输入的内容并提示选项。这提高了效率，并在你不确定名称时帮助你找到事物。\n\n\n\n让我们逐行分析图 4.4 中显示的代码：\n\
  \n- 1. **第 1 行：** extends 关键字为红色，因此我们知道它是一个关键字，而 Node2D 为深绿色，表示它是一个类引用。\n\nGDScript\
  \ 是一种面向对象编程语言，这意味着它将代码组织成类。可以把类想象成创建某物的蓝图。Node2D 是 Godot 中的内置类，已由开发者定义。通过编写 extends\
  \ Node2D，我们是在告诉 Godot 我们希望使用 Node2D 的所有功能，同时添加自己的新特性和行为。\n\n- 2. **第 4 行：** 该行为灰色，表示它是一条注释。这行是由程序员编写的，用来解释其后代码的作用。它有助于使代码更易于理解。井号符号（#）告诉计算机在运行程序时忽略该行；它只是给人类阅读的。\n\
  \n- 3. **第 5 行：** func 关键字为红色，表示它是 GDScript 中的特殊关键字。_ready() 为浅绿色，表示它是由开发者为我们创建的内置函数。圆括号\
  \ () 告诉我们这是一个方法，而冒号 : 表示其后缩进的所有内容都属于该方法。\n\n- 4. **第 6 行：** pass 关键字告诉计算机跳过该行。函数不能为空，因此\
  \ pass 可防止程序报错。这里还有一个内联注释，它是一个提醒，提示你用自己的代码替换此行以在此函数中执行操作。\n\n- 5. **第 9 行：** 此处的注释解释了\
  \ _process 函数在游戏的每一帧运行一次。可以把帧想象成快速动画中的一张图片。游戏每秒显示大量帧以创建流畅的运动。delta 变量是当前帧与上一帧之间的时间差，我们使用它来确保游戏的移动和动画保持流畅和一致，无论运行游戏的计算机快慢如何。\n\
  \n- 6. **第 10 行：** 我们再次看到 func 关键字，它告诉我们正在定义一个函数。_process 显示为绿色，表示它是 Godot 提供的内置函数。在括号内，我们看到单词\
  \ delta。这是一个参数，就像一小段信息被传递给函数以帮助它执行任务。在这种情况下，delta 用于表示帧之间的时间，确保游戏流畅运行。\n\n- 7. **第\
  \ 11 行：** pass 关键字再次出现。pass 关键字告诉计算机跳过该行。函数不能为空，因此 pass 可防止程序报错。\n\n现在你已经学习了脚本的基础知识，下一个部分将探讨\
  \ GDScript 中最重要工具之一：函数。我们将深入了解函数的工作原理，从诸如 _ready 和 _process 之类的内置函数开始，它们有助于控制游戏的流程和行为。\n\
  \n## 理解函数\n\n一个 **函数** 就像一组指示计算机执行特定操作的指令。可以把它想象成代码内部的一个迷你程序。你给它一个名字，当你 *调用* 这个名字时，函数就会运行并完成其工作。例如，如果你有一个名为\
  \ player_jump() 的函数，每次调用它时，计算机都会按照该函数中的步骤让玩家跳跃。函数有助于组织代码，因此你不必重复编写相同的指令。\n\n有些函数是内置的，因为编程语言或引擎（如\
  \ Godot）的创建者已经创建了它们来处理常见或必要的任务。\n\n例如，有一个内置函数告诉游戏每帧更新屏幕。你不需要自己编写，因为几乎每个游戏都需要它，而且可以节省时间。\n\
  \n但我们也需要编写自己的函数，因为每个游戏或程序都不同。你可能想要创建一个以特殊方式移动角色的函数，或检查玩家是否赢得关卡的函数。由于只有你知道游戏确切需要做什么，因此可以创建自定义函数来处理这些特定任务。\n\
  \n在 Godot 中，诸如 _ready 和 _process 之类的内置函数在控制游戏行为和随时间更新方面发挥着至关重要的作用。以下是这些函数各自的作用：\n\
  \n- _ready: The _ready 函数就像节点的 *起点*。可以把它想象成一切准备就绪、即将开始的时刻，就像戏剧开场时幕布升起一样。_ready 函数是在节点连同其所有子节点进入场景树后运行的第一个函数。节点从底部到顶部加载，子节点在父节点之前加载。你可以在此函数中放置任何想要在对象准备好时立即运行的代码，例如在屏幕上显示角色或开始动画。\n\
  \n- **_process**: The _process 函数就像游戏对象的 *心跳*。它会重复运行，每帧运行一次（就像游戏的每一张快照）。你可以用它来持续更新事物，例如移动角色或跟踪时间。函数中的\
  \ delta 是一个小值，告诉你自上一帧以来经过了多少时间，这样你就可以确保一切顺利进行，无论计算机运行游戏的速度快慢。\n\n现在你了解了函数的工作原理，可以掌握游戏循环的概念。\n\
  \n## 理解游戏循环\n\n大多数游戏都在一个循环内运行，该循环不断更新游戏中的情况——例如移动角色、检查碰撞以及将图形绘制到屏幕上。这被称为 **游戏循环**。它每秒运行多次（通常为每秒\
  \ 60 次或更多），每次运行时都会更新并重绘游戏。\n\n在 Godot 中，你通常不需要自己编写循环。相反，Godot 会为你处理它，并提供特殊函数供你接入游戏循环。后续章节将讨论其中三种最常见的函数。\n\
  \n### _ready()\n\n此函数在节点及其子节点被添加到场景树并准备就绪时调用一次。它就像在游戏开始前搭建你的乐高模型。\n\n使用 _ready()\
  \ 执行以下操作：\n\n- 设置初始值\n- 连接信号\n- 开始时隐藏或显示内容\n- 准备只需发生一次的内容\n\n### _process(delta)\n\
  \n此函数每帧运行一次。它用于应不断发生的事情，例如检查输入、更改动画或平滑移动某物。\n\n使用 _process(delta) 执行以下操作：\n\n- 玩家输入\n\
  - 动画\n- UI 更新\n- 与物理无关的更新\n\n请注意，delta 是自上一帧以来经过的时间（以秒为单位）。这有助于在帧率变化时保持移动流畅。\n\n\
  ### _physics_process(delta)\n\n这与 _process 类似，但以固定速率运行（默认为每秒 60 次）。这使其非常适合涉及物理的任何事物，例如带碰撞的角色移动。\n\
  \n使用 _physics_process(delta) 执行以下操作：\n\n- 物理计算\n- 使用 move_and_slide() 或 move_and_collide()\
  \ 的移动\n- 重力和跳跃\n\n为了演示 physics_process 函数的工作原理，请按照以下步骤操作：\n\n- 1. 创建一个新场景，以 Sprite2D\
  \ 作为根节点，如图 4.5 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_115_0.png)\n\n图 4.5\
  \ – 将 Sprite2D 节点作为场景的根节点\n\n- 2. 使用 Godot icon.svg 文件作为精灵的纹理。\n\n- 3. 通过右键单击节点并选择\
  \ Attach Script... 或单击带有 + 符号的脚本图标，将脚本附加到节点。将以下代码添加到脚本中：\n\n```\nextends Sprite2D\n\
  var speed = 100\nvar velocity = Vector2.ZERO\n\nfunc _ready():\n    print(\"Sprite\
  \ is ready to move!\")\n\nfunc _process(delta):\n```\n\n```\n#### Check input and\
  \ set direction\nvelocity = Vector2.ZERO\nif Input.is_action_pressed(\"ui_right\"\
  ):\n    velocity.x += 1\nif Input.is_action_pressed(\"ui_left\"):\n    velocity.x\
  \ -= 1\n\nfunc _physics_process(delta):\n    # Move the sprite using physics\n \
  \   position += velocity * speed * delta\n```\n\n\U0001F4A1 **快速提示：** 借助 AI 代码解释器和快速复制功能提升你的编码体验。在\
  \ next-gen Packt Reader 中打开本书。点击复制按钮 (1) 即可快速将代码复制到你的编码环境，或点击解释按钮 (2) 让 AI 助手为你解释一段代码。\n\
  \n```\nfunction calculate(a, b) {\n    return {sum: a + b};\n};\n```\n\n\U0001F512\
  \ 下一代 Packt Reader 随本书购买免费提供。扫描二维码或访问 packtpub.com/unlock，然后使用搜索栏按名称查找本书。请仔细核对所示的版本以确保获取正确版本。\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_116_0.png)\n\n\n\n运行场景时，场景加载后你会在输出窗口中看到消息出现，然后你可以使用方向键将精灵向左和向右移动，游戏循环会不断更新屏幕。\n\
  \n在下一节中，我们将探讨编程中最基础的方面之一——变量。你将了解变量是什么、它们如何存储数据，以及它们如何用于管理游戏信息，例如玩家状态、分数等。\n\n##\
  \ Understanding variables\n\n把变量想象成一个贴了标签的盒子，可以用来存储信息。就像你可以把东西放进盒子里然后稍后再使用一样，变量保存着一段信息，例如数字或单词，你可以在程序运行期间使用并更改它。\n\
  \n例如，如果你正在制作游戏并想跟踪玩家的生命值，你会创建一个名为 health 的变量。每当玩家找到一个心形道具或受伤时，你就可以增加或减少 health 变量。它帮助你的程序记住并处理数据，就像盒子在你需要时保存你的东西一样。\n\
  \n我们可以在变量中存储不同类型的数据，但最常见的是以下几种：\n\n- 整数（整数）例如 1, 2, 3\n- 实数（浮点数或小数）例如 0.1, 0.2,\
  \ 0.3\n- 文本字符串（字符集合）例如 Hello World, ABC, \"@: !3\"\n- 布尔值（真假值）例如 True, False, 0,\
  \ 1\n\n在下一节中，我们将探讨变量这一编程中的基本概念。你将学习如何在 Godot 中定义变量并遵循在脚本中组织它们的最佳实践。\n\n## Creating\
  \ a variable\n\n在编程中，将变量放在脚本顶部、类的定义或扩展之下是一个良好的实践。我们将把变量放在 extends Node2D 行下方。\n\n\
  变量需要通过为其命名并存储值来定义。我们写 var 关键字来告诉编译器这是一个变量。现在我们通过给它命名来标识变量（我们将使用名称 health）。要为其赋值，我们使用等号。这在编程中称为赋值运算符，它与数学中的相等不同。它的作用是将右侧的值赋给左侧的变量。\n\
  \n最后，我们必须分配一个初始或默认值——在本例中，我们将 health 设置为 100：\n\n```gdscript\nextends Node2D\nvar\
  \ health = 100\n```\n\n创建变量并赋值只是为了将值存储在计算机的内存中。我们可以通过使用变量的名称来访问该值。然后我们可以对该值做一些事情，例如将其输出到屏幕上。\n\
  \n为此，我们需要调用内置的 print 函数并提供要打印的变量名称。我们只能在节点准备好后显示此值。调用 print 函数的最佳位置是从 _ready 函数中：\n\
  \n```gdscript\nextends Node2D\nvar health = 100\n\n#Called when the node enters\
  \ the scene tree for the first time.\nfunc _ready():\n    print(health)\n```\n\n\
  接下来，运行程序。如果提示，请选择将当前场景用作主场景。请注意，你不会在游戏窗口中看到任何输出。相反，该值将显示在输出窗口的控制台中。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_118_0.png)\n\
  \n图 4.6 – health 变量的值显示在输出控制台中\n\n在建立了变量之后，了解它们可以保存的不同数据类型非常重要。在下一节中，我们将探讨数据类型，它定义了变量存储的信息类型，从数字到文本等等。\n\
  \n## Data types\n\n我在章节开始时提到了可以在变量中存储的不同数据类型。把数据类型想象成用于保存特定类型信息的不同容器可能会有所帮助。就像你不会把水存放在纸盒里或把食物放在瓶子里一样，在编程中，你会根据处理的数据类型使用不同类型的变量。\n\
  \n这里有一些例子：\n\n- 数字存放在名为 int（用于整数）或 float（用于带小数点的数字）的容器中\n- 文本存放在名为 string 的容器中，表示像串在绳子上的珠子一样分组的字符（字母、数字或符号）\n\
  - Boolean 只保存 true 或 false——就像简单的 yes 或 no 答案\n\n使用正确的类型有助于程序知道预期内容以及如何处理信息。\n\n\
  由于 GDScript 与 Python 一样是一种动态编程语言，我们不必指定要存储的变量类型。这使编程更快。然而，随着程序变大，更多团队成员参与项目，通过指定变量的数据类型更容易找到错误和\
  \ bug。\n\n这将防止人们尝试在错误的变量中存储错误类型的数据。\n\n我们可以按如下方式更改 health 变量：\n\n```\nextends Node2D\n\
  var health : int = 100\n```\n\n这不会影响程序输出。\n\n当我们想要对值进行精细调整时，例如更精细地控制玩家的跳跃高度，我们可以使用\
  \ float。这是一个十进制数，可以按如下方式创建：\n\n```\nextends Node2D\nvar health : int = 100\nvar\
  \ jump_strength : float = 220.5\n```\n\n在这段代码中，我们声明了一个名为 jump_strength 的变量，并指定其数据类型为\
  \ float，这允许它存储十进制数。通过将其设置为 220.5，我们可以更精确地控制角色可以跳多高，因为小数值比整数提供更精细的调整。这对于跳跃高度等游戏机制尤其有用，因为微小的调整可能会对游戏玩法产生很大影响。\n\
  \n在下一节中，我们将探讨编程中的命名约定，这是为变量、函数和其他元素命名的重要指南。遵循这些约定不仅使代码更易于阅读和理解，还有助于避免错误和混淆，防止项目增长时出现问题。\n\
  \n## Naming conventions\n\n我们为节点、场景、变量和函数命名的方式也很重要。命名约定就像是在编程中为事物命名（如变量、函数或类）的指南。它们有助于使你的代码更易于阅读和理解，不仅对你自己，也对可能参与你项目的其他人。\n\
  \n良好的命名约定能清楚地表明某物的作用。想象一下，如果你随意命名，例如将玩家的分数命名为 x，将敌人的生命值命名为 y。这会令人困惑且难以跟进，尤其是在大型项目中。\n\
  \n通过遵循命名约定，你可以保持代码的有序和可读性，使其更易于维护和与他人共享。\n\nGDScript 和 Godot 开发者使用的命名约定如下：\n\n-\
  \ **snake_case**：用于场景、变量和函数。它被称为 snake_case，因为每个新词都用下划线连接，使组合看起来像一条小蛇。\n- **SCREAMING_SNAKE_CASE**：用于常量。所有字母字符均为大写。\n\
  - **PascalCase**：用于场景中的类和节点。每个新词都以大写字母开头。\n\n在命名事物时最重要的要素是名称应有意义且描述性，以便程序具有自文档化特性。\n\
  \n通常，为了冷却和测试游戏中事物的状态，我们会使用 Boolean 值。例如，可以检查玩家是否正在冲刺：\n\n```\nextends Node2D\nvar\
  \ health : int = 100\nvar jump_strength : float = 220.5\nvar is_dashing : bool =\
  \ true\n```\n\n在前面的代码中，声明了一个名为 is_dashing 的 Boolean 变量并将其初始化为值 true。这意味着玩家当前处于冲刺状态。像这样的\
  \ Boolean 变量通常用于跟踪游戏中某个条件是否为真或假。\n\n我们在这里要查看的最后一个变量是 String。String 用于存储字符组合，最常见的是用于存储文本。请注意，当我们定义\
  \ String 时，我们用大写字母书写。这是因为 String 是一个类，与其他数据类型不同，因为它不是原始类型。此外，String 与之关联了许多方法。我们可以使用\
  \ String 来存储玩家的名字。\n\n在下一个示例中，我们声明并初始化一个 String 变量。Strings 用于存储文本，例如玩家的名字。下面的代码行创建了一个名为\
  \ player_name 的变量并为其分配默认值 \"Unknown Player\"。这使我们能够在游戏中存储和显示玩家的名字。\n\n如果你查看以下代码，你会注意到字符串被分配了自己独特的金色，以便在代码中轻松识别。\n\
  \n```\nextends Node2D\nvar health : int = 100\nvar jump_strength : float = 220.5\n\
  var is_dashing : bool = true\nvar player_name : String = \"Unknown Player\"\n```\n\
  \n在即将到来的章节中，我们将探讨编程中运算顺序的概念。理解操作如何按特定顺序执行对于编写准确高效的代码至关重要。这确保计算和逻辑按正确的顺序执行以实现预期结果。\n\
  \n\n\n## 理解运算符\n\n**运算符**是编程中用于执行操作的符号。\n\n这些运算符是必不可少的工具，可让你执行不同的操作，例如数学计算、比较和逻辑评估，帮助你控制代码的行为以及与数据交互的方式。\n\
  \n首先，让我们来看一下**数学运算符：**\n\n- **加法：** + 号用于按一定量增加变量的值\n- **减法：** – 号用于按一定量减少变量的值\n\
  - **乘法：** * 号用于将变量的值乘以另一个值\n- **除法：** / 号用于将变量的值除以另一个值\n\n我们可以用程序中的 player_level\
  \ 变量来尝试使用这些运算符。\n\n在我们的代码中，玩家等级为 23。如果我们加上 7，它将变为 30。看这里的 _ready 函数即可看到实际效果：\n\n\
  ```\nfunc _ready():\n    print(player_name)\n    print(player_level)\n    print(player_exp)\n\
  \    print(has_key)\n\n    player_level = player_level + 7\n    print(player_level)\n\
  ```\n\n你现在会注意到输出首先是 23，然后再次打印时，它会变为 30。\n\n需要注意的是，赋值操作是从右到左执行的。在这种情况下，我们取值为 7，将其加到\
  \ player_level 的当前值上，然后使用赋值运算符 (=) 将结果存储回左侧的 player_level 变量中。这意味着 player_level\
  \ 的现有值会被新的结果更新。\n\n编程时，我们总是希望关注效率，这意味着避免重复。如你所见，我们重复了变量名。为了避免这种情况，我们可以使用一个名为快捷运算符的新运算符，并更有效地重构代码如下：\n\
  \n```\n#player_level = player_level + 7\nplayer_level += 7\nprint(player_level)\n\
  ```\n\n如果我们想将等级降到 0，可以减去 30：\n\n```\nplayer_level -= 30\nprint(player_level)\n```\n\
  \n我们也可以对乘法和除法做同样的操作：\n\n```\n25  >>  player_level *= 2\n26  >>  print (player_level)\n\
  27  >>\n28  >>  player_level /= 2\n29  >>  print (player_level)\n```\n\n图 4.7 –\
  \ 乘法和除法\n\n你也可以将变量相加。如果我们创建一个名为 spike_damage 的变量，那么每次玩家撞到尖刺时，我们就可以按该值减少其生命值：\n\n\
  ```\n30  >>  var spike_damage : int = 10\n31  >>  print(health)\n32  >>  health\
  \ -= spike_damage\n33  >>  print(health)\n```\n\n图 4.8 – 使用 spike_damage 变量\n\n\
  在开始解决更复杂的表达式之前，了解数学中运算执行的顺序非常重要。\n\n## 运算顺序\n\n尽管计算机一次从程序顶部到底部运行一行代码，就像烹饪一样，你需要按一定顺序做事（比如烘烤前先混合配料），在数学和编程中，计算有一个特定的执行顺序。\n\
  \n运算顺序告诉计算机先执行计算的哪一部分。这里有一个简单的方法使用 **PEMDAS** 来记住它：\n\n- **括号：** 先计算括号内的内容\n- **指数：**\
  \ 然后计算幂或根（例如对数字求平方）\n- **乘法和除法：** 接下来，从左到右进行乘法和除法\n- **加法和减法：** 最后，从左到右进行加法和减法\n\
  \n例如，在表达式 3 + 5 * 2 中，计算机首先进行乘法（5 * 2 = 10），然后进行加法（3 + 10 = 13），因为在运算顺序中乘法优先于加法。\n\
  \n理解这一点很重要，因为它确保你的计算是正确的！\n\n## 练习\n\n为了练习使用变量，请尝试创建四个可用于存储玩家信息的变量。这些变量应使用不同的数据类型。\n\
  \n*本练习还引入了一个重要概念：变量作用域 – 请在下面的解释中注意它。*\n\n四个变量如下：\n\n- 玩家姓名\n- 玩家等级\n- 玩家经验值\n-\
  \ 玩家是否有钥匙？\n\n练习的解决方案如下：\n\n- `var player_name : String = \"Riptide\"`\n- `var player_level\
  \ : int = 23`\n- `var player_exp : float = 123.45`\n- `var has_key : bool = false`\n\
  \n我们可以在 _ready 函数中将它们全部打印出来，每行一个：\n\n```\nfunc _ready():\n    print(player_name)\n\
  \    print(player_level)\n    print(player_exp)\n    print(has_key)\n```\n\n执行上述代码将把值打印到控制台。\n\
  \n## 变量作用域\n\n在之前的解决方案中，变量是在 _ready 函数内声明并初始化的。这将变量的作用域限制为局部，意味着它只能在声明它的 _ready\
  \ 函数内访问。与类变量（在程序顶部定义并可在整个类中访问）不同，局部变量只能在定义它的特定函数或代码块中使用。这就是变量作用域。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_125_0.png)\n\
  \n在下一节中，我们将探索 Godot 中的关系运算符和比较运算符。这些运算符允许你比较值，帮助你的代码通过检查条件（例如一个值是否大于、小于或等于另一个值）来做出决策。\n\
  \n## 关系运算符和比较运算符\n\n通常，我们需要比较值以确定它们是否满足特定条件——真或假。这允许我们的代码分支并根据比较结果执行不同的操作。为了评估这些条件，我们使用关系运算符，帮助我们比较值。\n\
  \n可用于比较的不同运算符如下：\n\n- **相等：** 两个等号 (==) 用于测试两个值是否相同\n- **大于：** 使用尖括号 (>)，我们可以比较一个值是否更大\n\
  - **大于或等于：** 使用 (>=)，我们可以测试该值是否大于或等于另一个值\n- **小于：** 使用尖括号 (<)，我们可以比较一个值是否更小\n- **小于或等于：**\
  \ 使用带等号的尖括号 (<=)，我们可以测试该值是否小于或等于另一个值\n- **不相等：** 使用感叹号和等号 (!=)，我们可以测试一个值是否与另一个值不相同\n\
  \n我们将这些运算符与 if 语句一起使用，if 语句是编程中的基础。这些 if 语句允许我们检查条件是否成立，只有在为真时语句内的代码块才会运行。这使我们的游戏更灵活，能够根据测试条件的結果执行不同的操作。\n\
  \n所有这些都在以下代码中演示：\n\n```\nvar player_lives : int = 3\nif health == 0:\n    player_lives\
  \ -= 1\n\nif player_lives < 1:\n    print(\"GAME OVER!\")\n\nif player_lives <=\
  \ 0:\n    print(\"GAME OVER!\")\n\nif spike_damage > health:\n    print(\"GAME OVER!\"\
  )\n\nif player_exp >= 1000:\n    player_level += 1\n    print(\"LEVEL UP\")\n\n\
  if has_key != true:\n    print(\"DOOR LOCKED\")\n```\n\n在上述代码中，我们的游戏会根据比较的变量值产生不同的输出。\n\
  \n为了让游戏根据某些条件做出不同的响应，我们可以使用 if、elif 和 else 关键字。if 语句检查条件是否成立并运行其中的代码。如果条件为假，我们可以使用\
  \ elif（else if 的简写）来检查另一个条件。最后，else 用作默认值，如果之前的所有条件都不成立则运行。\n\n例如，假设我们想检查玩家拥有的生命值数量并相应地做出响应，如以下代码所示：\n\
  \n```\nif player_lives > 0:\n    print(\"Keep playing!\")\nelif player_lives ==\
  \ 0:\n    print(\"Game Over!\")\nelse:\n    print(\"Invalid number of lives!\")\n\
  ```\n\n上述代码允许玩家在仍有生命值时继续游戏；如果没有，则打印游戏结束，对于异常值则显示错误。\n\n## 练习\n\n为了获得一些实践经验，请编写一个脚本，使用我们创建的\
  \ health 变量检查玩家的健康状况。根据其健康状况显示不同的消息。\n\n- 如果 health 为 80 或以上，打印 \"You're in great\
  \ shape!\"\n- 如果 health 在 50 到 79 之间，打印 \"You're doing okay, but be careful!\"\n\
  - 如果 health 低于 50，打印 \"Warning! Your health is low!\"\n- 如果 health 为 0 或更低，打印 \"\
  Game over! You've run out of health.\"\n\n使用 if、elif 和 else 语句完成此任务。\n\n解决方案如下：\n\
  \n```\n#### Check the player's health and print the appropriate message\nif health\
  \ >= 80:\n    print(\"You're in great shape!\")\nelif health >= 50:\n    print(\"\
  You're doing okay, but be careful!\")\nelif health > 0:\n    print(\"Warning! Your\
  \ health is low!\")\nelse:\n    print(\"Game over! You've run out of health.\")\n\
  ```\n\n上述代码会根据玩家 health 变量的值显示正确的消息。\n\n\n\n在下一节中，我们将深入探讨在 Godot 中创建自定义函数。你将学习如何定义自己的函数来组织代码，使其可重用，并为你的游戏项目添加独特功能。\n\
  \n## Using custom functions\n\n保持代码整洁有序的一部分是创建自己的自定义函数。自定义函数允许我们将代码分解为更小、可重用的部分，使其更易于理解和维护。我们并不仅限于使用\
  \ Godot 自带的函数——我们可以定义自己的函数来执行游戏中的特定任务。\n\n要创建自定义函数，我们使用 func 关键字，后跟函数名（这就是我们在代码中识别函数的方式）。在名称之后，我们添加一对圆括号（），其中可以存放我们想要传递给函数的任何信息（参数）。最后，我们用冒号（:）结束函数头，并在下一行定义函数将执行的操作（这称为函数体）。\n\
  \n我们已经有一个变量存储尖刺造成的伤害量。如果我们编写一个自定义函数，每次被尖刺击中时都可以调用它会怎样：\n\n```\n#### Custom function\
  \ to handle spike damage and return remaining health\nfunc take_spike_damage():\n\
  \    health -= damage_amount\n    if health <= 0:\n        print(\"Game Over\")\n\
  \        return 0 # Return 0 if health is depleted\n    else:\n        print(\"\
  Player's current health: \", health)\n```\n\n前述代码可以在玩家受到尖刺伤害时随时被调用（要求运行）。\n\n为了使前述代码正常工作，我们需要将\
  \ spike_damage 移到顶部，使其成为类（脚本）变量。如下所示：\n\n```\nextends Node2D\nvar health : int =\
  \ 100\nvar jump_strength : float = 220.5\nvar is_dashing : bool = true\nvar player_name\
  \ : String = \"Riptide\"\nvar player_level : int = 23\nvar player_exp : float =\
  \ 123.45\nvar has_key : bool = false\nvar spike_damage : int = 10\n```\n\n在前述代码中，spike_damage\
  \ 变量已被移至程序顶部，以将其作用域更改为包含整个脚本（类）。\n\n要运行 take_spike_damage 函数中的代码，我们需要调用它。这将取决于游戏的上下文，但对于我们的示例，我们将从\
  \ _ready 函数中调用它：\n\n```\n#### Called when the node enters the scene tree for the\
  \ first time.\nfunc _ready():\n    take_spike_damage()\n```\n\n在前述代码中，我们调用 take_spike_damage()\
  \ 函数（要求其运行），函数内部的所有代码都会运行，并且游戏会根据结果进行更新。\n\n在下一节中，我们将探讨函数中的参数和参数。你将学习如何将信息传递到自定义函数中，使其更灵活和动态，从而根据你提供的值控制其行为。\n\
  \n## Arguments and parameters or function inputs\n\n函数可以接受输入值并产生输出，使我们能够编写适应性强、可重用的代码。这些输入在\
  \ GDScript 中称为参数，允许我们在调用函数时传递信息。我们发送给函数的数据称为参数，而参数就像一个占位符变量，在函数内部保存该值。\n\n例如，在 Godot\
  \ 内置的 _process(delta) 函数中，delta 参数会被传入，表示自上一帧以来经过的时间。参数使得函数可以根据接收到的数据表现出不同的行为，从而为我们的代码提供灵活性。\n\
  \n我们可以更新 take_spike_damage() 函数，使其接受一个参数来定义尖刺造成的伤害量。这样，无论何时调用函数，它都可以处理不同的伤害值：\n\n\
  ```\n#### Custom function to handle spike damage with a parameter\nfunc take_spike_damage(damage_amount):\n\
  \    health -= damage_amount\n    if health <= 0:\n        print(\"Game Over\")\n\
  \    else:\n        print(\"Player's current health: \", health)\n```\n\n在前述代码中，我们为函数添加了一个参数，以便我们可以更改每个尖刺造成的伤害量。\n\
  \n请记住，我们也必须更改对函数的调用，因为我们必须为伤害量提供一个值：\n\n```\n#### Called when the node enters the\
  \ scene tree for the first time.\nfunc _ready():\n    #Calling the function with\
  \ different damage values\n    take_spike_damage(10) #Spike causes 10 damage\n \
  \   take_spike_damage(5) #Spike causes 5 damage\n```\n\n在前述代码中，我们必须记住向函数提供尖刺造成的伤害量。\n\
  \n在下一节中，我们将通过使用 return 关键字来了解函数如何在 Godot 中返回输出。这允许函数在执行任务后将结果或值发送回，之后可以在游戏的其他地方使用。\n\
  \n## Functions can return output\n\n函数不仅仅接受输入；它们还可以产生输出。在编程中，这通过返回值实现。返回值是函数在执行任务后提供的结果。通过使用\
  \ return 关键字，你可以将值发送回函数被调用的位置。这允许函数执行计算或数据处理，然后将结果返回以供进一步使用。\n\n我们可以修改之前的示例，加入一个函数来计算并返回玩家受到伤害后的剩余生命值。这将演示函数如何提供有用的结果。\n\
  \n```\n#### Custom function to handle spike damage and return remaining health\n\
  func take_spike_damage(damage_amount) -> int:\n    health -= damage_amount\n   \
  \ if health <= 0:\n        print(\"Game Over\")\n        return 0 # Return 0 if\
  \ health is depleted\n    else:\n        print(\"Player's current health: \", health)\n\
  \        return health # Return the remaining health\n```\n\n在前述代码中，我们已更改函数使其返回玩家生命值变量的值。\n\
  \n我们还需要修改对函数的调用并存储和使用结果：\n\n```\n#### Called when the node enters the scene tree\
  \ for the first time.\nfunc _ready():\n    #Example of using the function and storing\
  \ the returned value\n    var remaining_health = take_spike_damage(10)\n    #Assume\
  \ damage_amount is 10\n    print(\"Remaining Health: \", remaining_health)\n```\n\
  \n在前述代码中，我们现在将函数返回的结果存储在新变量中，然后将其打印出来。\n\n现在是时候练习所学内容了。\n\n创建一个函数来根据所受伤害管理玩家生命值。为此，请按照以下步骤操作：\n\
  \n- 1. 创建一个名为 calculate_health_after_damage 的函数。\n- 2. 该函数应有两个参数：current_health\
  \ 和 damage。\n- 3. 在函数内部，从 current_health 中减去 damage 并返回新的生命值。\n\n这是调用该函数时使用示例：\n\
  \n```\n#Called when the node enters the scene tree for the first time.\nfunc _ready():\n\
  \    var player_health = 100\n    var spike_damage = 20\n    var new_health = calculate_health_after_damage(player_health,\
  \ spike_damage)\n    print(\"Player's new health:\", new_health)\n```\n\n在前述代码中，我们将计算玩家受损后生命值的结果存储在新变量中，然后打印出该结果。\n\
  \n练习的解决方案如下所示：\n\n```\n#### Define the function to calculate the player's health\
  \ after taking damage\nfunc calculate_health_after_damage(current_health: int, damage:\
  \ int) -> int:\n    var new_health = current_health - damage\n    return new_health\n\
  ```\n\n在前述代码中，解决方案显示我们必须声明一个接受两个参数的函数，将它们相减，并将结果作为整数返回。\n\n## Summary\n\n在本章中，我们探讨了\
  \ GDScript 的基本概念，从创建、编辑和保存脚本到理解变量、数据类型和执行顺序。我们还深入研究了数学和逻辑运算符、使用 if、elif 和 else 语句的控制流，以及\
  \ ready 和 process 等内置函数和自定义函数的重要性。这些技能对于脚本化基本游戏机制至关重要，为你提供了开始构建动态、交互式游戏世界所需的工具。\n\
  \n在下一章中，我们将深入探讨向量——游戏开发中的一个重要概念，它支撑着游戏中移动、方向和定位。理解向量是下一步的逻辑，因为它们在控制 2D 或 3D 空间中物体的流动和交互方面发挥着关键作用。\n\
  \n\n\n## 在 Discord 上加入我们的社区\n\n加入我们的 Discord 社区空间，与作者和其他读者进行讨论：\n\nhttps://packt.link/godot-4-game-dev\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_133_0.png)\n"
