- "## 5 理解向量\n\n向量是游戏开发中最基础的概念之一，帮助开发者在 2D 和 3D 空间中表示方向、移动和定位。在本章中，你将深入了解向量是什么的基础知识，以及它们为何在游戏机制中发挥至关重要的作用。你将学习如何在\
  \ Godot 引擎中有效使用向量——通过可视化界面和代码——来控制和影响你的游戏对象。\n\n在本章中，我们将涵盖以下主要主题：\n\n- 向量是什么？\n\
  - 在 Godot 中使用向量\n\n到本章结束时，你将获得对如何操作向量、将其应用于移动以及解决涉及方向和位置的游戏开发问题的实践理解。无论你是在开发平台游戏、角色扮演游戏还是\
  \ 3D 冒险游戏，掌握向量都将为你提供强大的工具来控制玩家移动、敌人 AI 和环境交互。\n\n### 技术要求\n\n本章的代码文件可在本书的 GitHub\
  \ 仓库中获取：https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch5/vectors\n\
  \n访问此链接查看代码运行的视频：https://packt.link/6sNsX\n\n### 向量是什么？\n\n如果你熟悉点的概念，可以将 **向量**\
  \ 想象成类似但有一个关键区别：向量不仅表示空间中的 *位置*，还包含有关 *方向* 和 *大小* 的信息（从其起点或原点移动多远以及朝哪个方向移动）。**点**\
  \ 另一方面，只是一个位置，不包含任何关于方向或移动的信息。这在 *图 5.1* 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_138_0.png)\n\
  \n### 向量与点\n\n*图 5.1 – 在 2D 空间中向量与点的演示*\n\n在 *图 5.1* 中，向量显示为箭头。箭头指示向量指向的 *方向*，而箭头的长度（从尾部到头部）代表其\
  \ *大小*，或它从起点延伸多远。位置为 **(8,5)** 的点是一个静态位置，没有方向或大小。\n\n如果我们从原点向我们定义的点画一条箭头，我们就创建了一个向量。这在图\
  \ 5.2 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_139_0.png)\n\n图 5.2 – 向量具有方向（角度）和大小\n\
  \n在电子游戏中，向量用于表示玩家的速度，控制他们的瞄准方向，并确定他们的视野（他们面向的方向）——全部使用一个向量。同时，我们使用点来持续跟踪玩家的位置。这在图\
  \ 5.3 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_139_1.png)\n\n图 5.3 – 表示玩家当前位置的点\n\
  \n在图 5.3 中，我们可以看到玩家位于原点以东 2 个单位、以北 1 个单位。\n\n**速度** 是某物在特定方向上的速度。在游戏开发中，它用于描述对象（如玩家或敌人）移动有多快以及朝哪个方向移动。速度通常由向量表示，向量同时显示\
  \ *速度*（大小）和运动的 *方向*。\n\n如果我们希望玩家向上并向左移动，我们可以使用速度向量 **(-2,3)** 来实现。这在 *图 5.4* 中表示：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_140_0.png)\n\n*图 5.4 – 描述玩家速度的向量*\n\n\
  在 *图 5.4* 中，*速度向量* 表明玩家将向左移动 2 个单位，向上移动 3 个单位。请注意，*x* 坐标始终在 *y* 坐标之前给出。\n\n向量还可以告诉我们玩家面向的方向。*图\
  \ 5.5* 显示了向量如何用于指示游戏中玩家面向的方向。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_140_1.png)\n\
  \n*图 5.5 – 用于指示方向的向量*\n\n在图 5.5 中，*方向向量* 告诉我们玩家正指向右侧（旋转 90 度）。\n\n单独来看，向量只是数字——如果没有上下文，它们意义不大。例如，向量\
  \ (1, 0) 根据使用方式可能表示方向、位置或速度。为了使这些向量有意义，我们需要分配单位。在 Godot 中，2D 单位以 *像素* 计量，而 3D 单位以\
  \ *米* 计量。\n\n例如，如果我们在 2D 游戏中有一个玩家角色，向量 (1, 0) 表示向右移动。在这种情况下，适用以下内容：\n\n- “1” 表示玩家在水平方向（x\
  \ 轴）移动一个单位（或像素）\n- “0” 表示玩家在上下方向（y 轴）不移动\n\n如果玩家在每一帧都按照此向量移动，角色将稳定地每帧向右移动 1 像素。\n\
  \n当我们只想要方向而不关心距离或速度时，我们可以 *归一化* 向量。**归一化向量** 的长度（或大小）为 1，并且仍然指向同一方向。这在将方向与其他值结合时特别有用，例如将方向向量乘以速度以获得速度时。\n\
  \n例如，如果我们对向量 (2, 0) 进行归一化，得到 (1, 0)。它仍然指向右侧，但现在具有标准长度 1，使得在游戏逻辑中易于一致缩放。\n\n### Godot\
  \ 中的坐标\n\n屏幕的一个重要特点是原点 (0, 0) 位于屏幕左上角。这意味着 y 在向上移动时为负，向下移动时为正。这由图 5.6 中的向量 (4, 3)\
  \ 显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_142_0.png)\n\n图 5.6 – 计算机从左上角向下渲染屏幕（此图像由\
  \ Godot Engine 贡献者提供，并根据 CC BY 3.0 许可）\n\n在图 5.6 中，向量 (4, 3) 具有角度 theta 的方向或旋转，以及长度或大小\
  \ m。在这种情况下，箭头是一个位置向量，表示相对于原点的空间中的一个点。\n\n关于向量需要记住的一件重要事情是，它们通常显示方向和大小（某物移动多远或多快），但不显示起始位置。把向量想象成箭头：它告诉你往哪个方向走、多快走，但不告诉你在地图上的位置。要知道物体的实际位置，你需要将向量与起始点或参考点结合起来。\n\
  \n然而，有一个值得提及的特殊情况：位置向量。在数学和游戏开发中（包括 Godot），诸如 Vector2(2, 3) 的向量也可以表示 2D 空间中的位置。这类向量被理解为从原点\
  \ (0, 0) 开始并指向坐标 (2, 3)。在这种情况下，向量告诉你某物相对于原点的位置。\n\n因此，根据上下文，向量可以执行以下任一操作：\n\n- 显示某物移动多远以及朝哪个方向移动（速度或力）\n\
  - 指示相对于原点的位置（就像空间中的坐标）\n\n\n\n\n理解这种差异有助于避免混淆，尤其是在处理游戏中的移动系统、物理或空间推理时。如果反转一个位置向量，你实际上是从该位置指向原点——这也是理解向量在不同上下文中如何工作的一种有帮助的方式。\n\
  \n例如，在游戏中，向量可以告诉你玩家移动的方向和速度，但玩家的起始位置会单独作为一个点给出。这在图 5.7 中有所展示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_143_0.png)\n\
  \n*图 5.7 – 两个相同的向量（此图片由 Godot Engine 贡献者提供，采用 CC BY 3.0 许可）*\n\n在图 5.7 中，两个向量都表示从起始点向右\
  \ 4 个单位、向下 3 个单位的位置。\n\n我们现在对向量有了概念上的理解。在下一节中，我们可以看看如何在 Godot 中实现它们。\n\n## 在 Godot\
  \ 中使用向量\n\n在 Godot 中，有两个类来表示向量。2D 向量使用 Vector2，3D 向量使用 Vector3。Vector2 接受 x 和 y\
  \ 参数，Vector3 接受 x、y 和 z 参数。让我们更详细地了解一下 Vector2。\n\nVector2 是一个类，这意味着它不仅仅是一个像数字一样简单的数据类型——它是一个更高级的结构，包含内置函数（或方法）来处理\
  \ 2D 坐标。虽然它像数据类型一样行为，因为它保存两个数字（x 和 y），但它也允许你执行诸如加法、缩放或旋转向量等操作。\n\n值得注意的是，Godot 将许多看似简单类型的数值作为类来处理。例如，如第\
  \ 4 章所述，即使是 Godot 中的文本也是由 String 类管理的。这与其他一些将字符串视为没有方法的基类型引擎或语言略有不同。\n\n因此，当你使用像\
  \ Vector2 这样的东西时，你实际上是在使用一个强大的工具，它旨在帮助你轻松管理游戏中 2D 位置、方向和移动，内置了大量有用的函数。\n\n如果我们希望玩家在水平方向（x\
  \ 轴）移动一个单位（或像素），并且完全不上下移动，并确保玩家每帧都移动，我们可以使用以下代码：\n\n```\nvar movement_vector = Vector2(1,\
  \ 0)\n\nfunc _process(delta):\n    position += movement_vector\n```\n\n在 Godot 中，这种效果表现为\
  \ Sprite2D 在屏幕上移动，如图 5.8 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_144_0.png)\n\
  \n图 5.8 – Godot 精灵在屏幕上向右移动\n\n图 5.8 显示精灵在屏幕上移动，x 值每帧变化 1，而 y 值完全不变。\n\n需要注意的是，我们可以使用点符号单独访问向量的\
  \ x 和 y 变量，如以下代码所示：\n\n```\n#### Access the individual x and y components of the\
  \ position\nvar x_position = position.x\nvar y_position = position.y\n\n#### Display\
  \ the x and y components in the output console\nprint(\"Sprite Position - X: \"\
  , x_position, \" Y: \", y_position)\n```\n\n在此代码中，我们将精灵当前的 x 和 y 位置存储在单独的变量中，然后打印出来，以观察精灵在屏幕上移动时它们如何变化。\n\
  \n在 Godot 中，这种效果在 Sprite2D 在屏幕上移动时显示在输出控制台中，如图 5.9 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_145_0.png)\n\
  \n图 5.9 – 控制台在精灵移动时显示向量的 x 和 y 参数\n\n图 5.9 演示了我们始终可以访问向量的参数。我们可以使用此信息检测何时接近 Viewport\
  \ 的边缘，然后反转 movement_vector。这将使精灵从屏幕边缘反弹。使用以下代码实现此行为：\n\n```\n#### Store the x and\
  \ y positions of the edges of the screen\nvar horizontal_edge = get_viewport_rect().size.x\n\
  var vertical_edge = get_viewport_rect().size.y\n\n#### Check for screen boundaries\
  \ to reverse direction\nif x_position < 0 or x_position > horizontal_edge:\n   \
  \ # Reverse the x direction\n    movement_vector.x *= -1\nif y_position < 0 or y_position\
  \ > vertical_edge:\n    # Reverse the y direction\n    movement_vector.y *= -1\n\
  ```\n\n此代码成功限制或钳制精灵的移动，使其保持在屏幕边界内。\n\n我们还可以对向量执行诸如加法、减法和乘法等数学运算。这至关重要，因为它允许我们以更动态和灵活的方式操纵物体的位置、移动和方向。值得庆幸的是，游戏引擎会为你执行所有这些计算，但了解它在做什么仍然很好。\n\
  \n## 移动与定位\n\n在游戏开发中，移动和定位是创建动态且引人入胜的游戏玩法的核心。在 Godot 中，向量是定义 2D 和 3D 空间中位置、方向和速度的重要工具。通过了解如何使用向量，你可以在游戏世界中平滑而准确地移动角色、投射物和物体。\n\
  \n本节将介绍你在 Godot 中使用向量的工作方式，展示如何计算方向、处理玩家移动以及有效定位物体。这些概念构成了创建响应迅速且逼真的游戏机制的基础。\n\n\
  ## 向量加法\n\n我们使用 **加法** 通过将移动向量添加到其当前位置来更新物体的位置。例如，当你将角色移过屏幕时，你在每一帧都将方向向量添加到角色的位置向量中。\n\
  \n向量加法在图 5.10 中显示。对应的 x 和 y 值相加（蓝色向量 A(2,5) 加上绿色向量 B(3,1)，结果为红色向量 C(5,6)）。\n\n![](img/d34207e07c133a9e84d9caf1d479006c_147_0.png)\n\
  \n图 5.10 – 将向量 (2,5) 加到向量 (3,1) 上，结果为向量 (5,6)\n\n图 5.10 还显示了相加向量的顺序无关紧要，因为结果向量始终相同。\n\
  \n为了理解这在游戏中如何工作，我们可以考虑角色跳跃的例子。\n这在图 5.11 中显示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_148_0.png)\n\
  \n图 5.11 – 使用向量加法跳跃\n\n为了理解跳跃机制，我们可以逐帧查看。重力始终将角色向下拉；因此，加速度向量始终为 (0, -1)。\n\n起始位置为\
  \ (0,0)。当按下跳跃按钮时，速度向量被设置为 **(1,3)**，角色向上并向右移动。如果我们将速度加到位置向量上，我们会得到新的速度向量 **(1,3)**。然而，我们必须加上加速度向量，新的结果是速度\
  \ **(1,2)**。如果我们以这种方式继续，我们可以完成整个跳跃循环。\n\n## 向量减法\n\n**减法** 有助于计算两点之间的距离或差异，例如玩家与敌人之间的距离，可用于碰撞检测或\
  \ AI 行为。\n\n**向量减法** 以类似的方式工作——逐个减去每个分量，向量减法有助于确定从一个位置指向另一个位置的向量。\n\n例如，想象一个球位于\
  \ **(1,2)**，而洞位于 **(4,3)**。为了找到球滚动到洞所需的方向，你可以通过从洞的位置减去球的位置来找到差异。\n\n这在图 5.12 中有所说明：\n\
  \n![](img/d34207e07c133a9e84d9caf1d479006c_149_0.png)\n\n图 5.12 – 向量减法\n\n图 5.12\
  \ 演示了如何使用向量减法计算到达某一点所需的长度和方向。\n\n我们对向量执行的下一个基本操作是乘法。\n\n## 向量乘法\n\n向量同时具有方向和大小的值，但仅表示大小的值称为标量。\n\
  \n当我们谈论向量时，向量中的每个数字称为分量，而单个数字本身称为标量。例如，(3, 4) 是一个向量，而 5 是一个标量。在游戏中，将向量乘以标量可以用于改变其大小（幅度）而不改变其方向。\n\
  \n归一化向量是一种特殊的向量，其长度（或大小）恰好为 1。它仍然指向同一方向，但其大小已缩减为 1 个单位。这通常用于表示方向而不影响距离或速度。\n\n例如，如果玩家面向右侧，我们可能会使用归一化方向向量，例如\
  \ (1, 0)。如果我们然后将它乘以标量值，例如 100，我们得到 (100, 0)，这可以表示向右 100 像素的位置。这对于计算目标或到达位置很有用：\n\
  \n```\nvar direction = Vector2(1, 0).normalized()\nvar distance = 100\nvar arrival_position\
  \ = player.position + direction * distance\n```\n\n我们还可以看到向量乘法如何用于缩放图像。想象玩家获得一个让他们变大的增益道具。玩家的尺寸表示为向量，例如\
  \ (1, 2)，意味着宽度为 1，高度为 2。如果增益道具使玩家长到原来的两倍，我们将尺寸向量乘以标量 2。\n\n\n\n\nThis is illustrated\
  \ in Figure 5.13:\n\n![](img/d34207e07c133a9e84d9caf1d479006c_150_0.png)\n\n图 5.13\
  \ – 缩放（标量乘法）的影响\n\n在图 5.13 中，将大小向量乘以一个标量会使玩家在宽度和高度上都变大两倍，但其整体形状和比例保持不变。\n\n将向量乘以标量实际上会延长向量而不改变方向。这也可以用箭头来演示，如图\
  \ 5.14 所示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_150_1.png)\n\n图 5.14 – 说明标量乘法（此图像由\
  \ Godot Engine 贡献者提供，并根据 CC BY 3.0 许可）\n\n图 5.14 显示，将向量乘以标量会得到一个更长的向量。还需要注意的是，乘以负标量会反转方向。\n\
  \n## 向量长度\n\n从原点到向量的 x 和 y 位置的距离被称为**向量的长度**。这也被称为**向量的大小**。要找到这个长度，Godot 有一个内置\
  \ length() 函数：\n\n```\nvar vector_length: float = vector.length()\n```\n\n为了理解 length()\
  \ 函数的工作原理，请考虑这个例子。如果一个角色在 2D 平台游戏中以速度向量 v(4, 3) 移动，我们可能想要确定角色移动的速度，以便调整动画或实现落地时产生尘云等效果。\n\
  \n为了找到角色的速度，我们计算速度向量 v 的长度（或大小）。我们可以将该向量可视化为构成一个直角三角形，其中一边为 3（x 分量），另一边为 4（y 分量）。利用毕达哥拉斯定理，我们可以找到斜边，它代表角色的速度。具有分量\
  \ (x, y) 的向量的大小公式以及由此得到的速度如图所示 5.15：\n\nSpeed = √4² + 3² = √16 + 9 = √25 = 5\n\n\
  图 5.15 – 使用毕达哥拉斯定理确定向量大小\n\n图 5.15 演示了 length() 函数如何计算向量的大小。这意味着角色在游戏世界中以每秒 5 个单位的速度移动。这在图\
  \ 5.16 中进行了可视化：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_151_0.png)\n\n图 5.16\
  \ – 长度的可视化表示\n\n图 5.16 演示了如何计算向量的长度。请注意，这也适用于 3D 向量。\n\n## 距离\n\n通常，我们想要找到两个物体之间的**距离**，例如玩家和运动传感器，以确定玩家是否足够接近以触发警报。我们可以使用\
  \ Godot 中的 distance_to() 函数来做到这一点。例如，如果玩家位于位置 (3,3)，而运动传感器位于位置 (1,2)，我们可以计算它们之间的距离，以检查玩家是否在传感器的范围内，这可能会激活警报。\n\
  \ndistance_to() 函数背后的数学原理结合了向量减法和向量长度。要计算距离 [D]，我们从运动传感器向量 [M] 中减去玩家向量 [P]，然后计算所得向量的长度：\n\
  \nD = (P - M).length()\n\nD = √[(3 - 1)² + (3 - 2)²] = √[4 + 1] = √5 ≈ 2.24\n\n\
  该方程在图 5.17 中进行了演示：\n\n![](img/d34207e07c133a9e84d9caf1d479006c_152_0.png)\n\n图 5.17\
  \ - 计算到物体的距离\n\n图 5.17 显示了如何计算到另一个物体的距离。无论是从运动传感器向量中减去玩家向量，还是反过来，结果都是一样的。\n\n##\
  \ 归一化\n\n在处理方向（而不是位置或速度）时，确保它们具有单位长度，即长度为 1 至关重要。这简化了我们的计算。\n\n例如，想象一个机器人需要以 20\
  \ m/s 的恒定速度沿 (1,0) 方向移动以递送包裹。机器人的速度会是多少？由于方向向量的长度为 1，我们可以轻松地将其乘以机器人的速度来计算其速度：(20,0)。如果方向向量有其他长度，机器人就会移动得过快或过慢。\n\
  \n长度为 1 的向量称为**归一化**。那么，我们如何归一化一个向量（将其长度设为 1）？\n\n很简单：我们只需将每个分量除以向量的长度即可。\n\n由于这是一个非常常见的操作，Godot\
  \ 有一个内置函数来为我们完成它。该函数称为 normalized()，可以在我们的示例中如下使用：\n\n```\nextends Node2D\n\n####\
  \ Called when the node enters the scene tree for the first time.\nfunc _ready():\n\
  \    # Normalize direction vector so it has a length of 1\n    direction = direction.normalized()\n\
  \n    # Calculate velocity by multiplying direction by speed\n    velocity = direction\
  \ * speed\n```\n\n关于向量还有很多东西需要学习，还有其他操作，例如**点积**和**叉积**。所有这些都是称为**线性代数**的数学领域的一部分。然而，你现在已经有足够的理解来制作出色的\
  \ Godot 游戏，而引擎会为我们完成所有的数学计算！\n\n## 摘要\n\n在本章中，我们探讨了向量的基本概念及其在游戏开发中的关键作用。你学习了如何在\
  \ Godot 引擎中操作向量，应用向量加法、减法和乘法来控制移动和定位。我们还涵盖了诸如计算向量长度、确定物体之间的距离以及归一化向量以保持方向一致等重要主题。\n\
  \n通过掌握这些概念，你现在能够在游戏项目中有效地使用向量，增强游戏玩法机制和交互。\n\n在下一章中，我们将从理论转向实践，开始在 Godot 中创建我们的第一个\
  \ 2D 小游戏！\n\n## 立即解锁本书的独家福利\n\n扫描此二维码或访问 packtpub.com/unlock，然后按名称搜索本书。\n\n*注意：在开始之前请准备好购买发票。*\n\
