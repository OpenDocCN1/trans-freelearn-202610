- "# 初学者的 Godot 4\n\n\n\n\n本书献给我的家人，他们是我最大的支持者。知道在爱与鼓励下，你可以实现任何事情。还有爸爸，我知道你会为我感到骄傲。\n\
  \n— Robert Henning\n\n## 前言\n\n得益于 Godot 等强大而易于接近的引擎，游戏创作从未如此便捷。然而，深入 Godot 这类引擎——尽管用户友好——仍然需要掌握多样化的技能，从显而易见的编程和数学，到不太明显的软件架构和游戏设计。即使你已经了解游戏引擎的内部工作原理，转换到另一个引擎也可能很繁琐。\n\
  \n本书由专业游戏开发导师 Robert Henning 撰写，正好解决了这个问题，并帮助读者轻松进入广阔的游戏开发领域。通过 Robert 的教学方法，培养新技能将变得更加容易。此外，你甚至会享受这个过程，因为本书包含练习和项目，提供早期成功来提升你的动力。\n\
  \n虽然我从未亲自见过 Robert，但他以非常直接的方式帮助我成为一名专业游戏开发者——通过在 YouTube 上创建教程和与 Godot Engine 相关的内容，这些内容既帮助了我也激励了我。在撰写此序言时，他的频道拥有超过\
  \ 50,000 名订阅者，这证明了他的视频的实用性以及他帮助人们开始使用 Godot 进行游戏开发的热忱。\n\n阅读这些页面并完成练习让我回到了我还是初学者的时候——一张白纸——并让我兴奋地尝试新事物。因为如果有一件事是最重要的，那就是：始终保持初学者的心态并进行实验。每当你学习到某样东西或完成一个练习时，将其推向极限。这里那里改变一个值直到它崩溃，然后退一步。只有当我们离开这条路时，我们才能清楚地看到这条路存在的意义。\n\
  \n所以，我不会再耽搁你了。去探索 Robert 在这本优秀书籍中铺设的道路吧。将其视为一次冒险。自由地实验，探索可能性，找到你自己的风格。你不会后悔的。\n\n\
  Sander Vanhove,\n\n主游戏开发者和技术美术，以及畅销书《Learning GDScript by Developing a Game with\
  \ Godot 4》的作者\n\n## 贡献者\n\n## 关于作者\n\n**Robert Henning** 在计算机科学教育方面拥有超过 20 年的经验，专攻游戏开发。他使用\
  \ Scratch、Java with Greenfoot、Delphi、Construct 3、Unity 和 Godot 教授游戏开发。作为 Godot 的热情倡导者，Robert\
  \ 自早期版本起就推广这一平台。\n\nRobert 还运营着一个受欢迎的 YouTube 频道（https://www.youtube.com/@GameDevJourney），提供教程并展示使用\
  \ Godot 制作的游戏。他实践的方法和对易于学习方式的奉献使他赢得了值得信赖的教育者的声誉。*Godot 4 for Beginners* 是他专业知识的结晶，旨在通过清晰的分步说明指导新手创建自己的游戏。\n\
  \n## 关于审阅者\n\n**Deepak Jadhav** 是一位经验丰富的专业人士，在游戏开发和项目管理方面拥有丰富的经验，尤其是在扩展现实（XR）技术领域。他擅长创建沉浸式的增强现实（AR）和混合现实（MR）体验，在各个行业提供创新解决方案。他的专业知识涵盖游戏编程、游戏引擎（Godot、Unity\
  \ 和 Unreal）、AI 系统实现，以及将这些技能应用于企业应用。Deepak 拥有游戏开发与项目管理硕士学位和计算机技术学士学位，使他具备领导复杂 XR\
  \ 和游戏开发项目的技术和管理技能。\n\n**Ural**，一名驻土耳其的游戏开发者，拥有兽医学博士学位。他的游戏开发之旅始于高中时期的 Python，促使他使用\
  \ Godot、Unity 和 Unreal Engine 等引擎从事多样化项目。他于 2018 年开始使用 Godot 作为第一个游戏引擎，并独立开发了多个游戏。自\
  \ 2021 年起，他担任 Harmonia Games 的主导开发者。Ural 热衷于探索不同的工作流程和游戏架构。他主导了 PC 游戏 *REM the Dreamer*\
  \ 的开发，该游戏已在 Steam 上发布，并使用 C++ 从零开始构建了自己的定制游戏引擎。\n\n**Henrique “Ludonaut” Campos**\
  \ 是一名独立游戏开发者和游戏设计师，多年来一直在业界工作。2015 年起担任大学计算机图形学和人工智能专业的教师，并在 2018 年至 2022 年期间在 GDQuest\
  \ 团队工作，Henrique 也是工作室和学校的独立顾问。以 **Ludonaut** 的化名，Henrique 在他的 YouTube 频道上创建游戏开发内容，制作游戏、资源、电子书和课程，可在其\
  \ itch.io 个人资料中找到。作为《Game Development Patterns with Godot 4》一书的作者，Henrique 为 Godot\
  \ 用户铺平了道路，使其能够为 Godot Engine 项目创建可重用和可扩展的代码库。\n\n## 致谢\n\n你好，欢迎阅读《Godot 4 入门》！我叫\
  \ Robert Henning，我自己也曾是 Godot 初学者，所以我深知在寻找学习如何使用 Godot Engine 制作游戏的资源时是什么感受。正是因为缺乏适合初学者的优质\
  \ Godot 资源，我才写了这本书。\n\n本书采用动手实践、循序渐进的方法教授游戏开发，从下载和安装 Godot 4 游戏引擎的基础开始，逐步通过一系列日益复杂的主题构建你的知识。每章都设计得实用且互动性强，让你能够通过实际示例和项目立即应用所学内容。本书的结构确保即使没有任何编程或游戏开发经验的人也能跟上并取得成功。\n\
  \n在本书中，你将熟悉 Godot 4 界面及其提供的工具，同时学习 Godot 独特的节点、场景、信号和脚本系统背后的基础游戏开发理念。你将使用 GDScript，即\
  \ Godot 的脚本语言，并探索 2D 和 3D 工作流程。在学习过程中，你将构建角色控制器，设计交互元素如敌人和危险，实施计分系统和可收集物品，并发现如何为项目增添更专业的润色。本书还指导你学习游戏设计的基础，帮助你理解不仅如何构建游戏，还如何打造有趣且引人入胜的体验。\n\
  \n到本书结束时，你将对 Godot 4 游戏引擎及其界面有扎实的理解，能够创建 2D 和 3D 游戏，操控灯光，使用 GDScript 编程，并实现玩家、敌人和可收集物品等关键游戏元素。你还将擅长设计和构建引人入胜的游戏关卡，追踪分数并管理游戏结束状态，从而将自己的游戏创意变为现实。\n\
  \n现在轮到你开始了。有了好奇心、耐心和练习，你很快就会开始构建自己的游戏。让我们开始你的游戏开发之旅吧！\n\n## 本书适合谁\n\n本书非常适合任何刚接触游戏开发并希望探索功能强大且易用的\
  \ Godot 引擎的人。无论你是 aspiring 游戏开发者、寻找免费开源工具的独立创作者、渴望构建交互项目的学生，还是好奇如何将创意变为现实的艺术家，本书都将为你使用\
  \ Godot 4 提供坚实的基础。凭借清晰的解释和动手项目，它旨在帮助你从好奇过渡到创作——无需任何先前经验。\n\n此外，希望学习游戏开发基础的学生、寻求全面资源来教授基础的教师，以及希望使用开源、适合初学者的\
  \ Godot 游戏引擎将游戏创意变为现实的 aspiring 游戏开发者，都将发现本书极具价值。\n\n无论你是完全从零开始还是已经了解一些基础，本书都将以清晰、逐步的指导带你学习\
  \ Godot 4。无需任何编程经验——虽然对变量、循环和条件语句等概念有初步了解会有所帮助，但所有必要的编程思想都已在书中从头开始解释。\n\n## 本书涵盖内容\n\
  \n第1章《让我们开始使用 Godot！》探讨了 Godot 4.0 的历史和核心功能，旨在为你提供安装、启动并在引擎中创建第一个项目的知识。\n\n第2章《探索\
  \ Godot 引擎界面》探讨了界面的基本功能，帮助你在 Godot 4 中编辑第一个项目。你还将理解支撑 Godot 的节点和场景设计理念。\n\n第3章《3D\
  \ 入门》解释了如何构建和照亮一个简单的 3D 环境，并帮助你在 Godot 的 3D 工作区中获得信心。\n\n第4章《使用 GDScript 编程》提供了脚本化基本游戏机制的基础知识，让你能够自信地控制游戏的逻辑和流程。\n\
  \n第5章《理解向量》解释了向量是什么以及它们在游戏机制中为何发挥至关重要的作用。你将学习如何在 Godot 引擎中有效使用向量。\n\n第6章《在 Godot\
  \ 中创建 2D 小游戏 – 第1部分》详细介绍了交互式、完全可玩的平台关卡的创建，并解释了这些组件如何协同工作以形成许多平台游戏的基础。本章包括使用 TileMap\
  \ 创建关卡设计、开发玩家角色、为玩家角色编写脚本以及学习干净的代码。\n\n第7章《在 Godot 中创建 2D 小游戏 – 第2部分》探讨了如何通过代码让游戏机制栩栩如生，创建更动态和引人入胜的平台体验。本章包括为玩家制作动画和编程平台游戏机制、可收集物品、巡逻敌人以及关卡完成。\n\
  \n第8章《在 Godot 中创建 3D 小游戏 – 第1部分》解释了如何创建可重复使用的 3D 场景、控制玩家角色并设计既美观又实用的关卡。本章包括创建 3D\
  \ 角色、设计关卡、使用角色控制器脚本以及实现摄像机控制器。\n\n第9章《在 Godot 中创建 3D 小游戏 – 第2部分》继续上一章的工作，包括最终润色，如添加增益道具、引入障碍以及打磨关卡。\n\
  \n第10章《添加游戏质感》详细说明了小改动如何显著改善游戏手感。你将获得在实施视觉和音频反馈方面的实践经验，以增强玩家沉浸感，使游戏更愉快、更令人满意。\n\n\
  第11章《理解游戏设计》阐述了深思熟虑的游戏设计在简化开发、减少昂贵错误和提高玩家满意度方面的价值。\n\n第12章《下一步去哪？》提供了精选资源列表，帮助你加深知识、扩展技能并与其他开发者建立联系。你还将发现如何保持动力、了解最新趋势并在游戏开发社区中建立自己的影响力。\n\
  \n## 如何充分利用本书\n\n为了充分参与本书提供的练习和示例，你需要下载并安装 Godot Engine 4.3。该引擎版本引入了理解和实施我们所涵盖技术所必需的关键功能和更新。无论你是\
  \ Godot 新手还是有早期版本经验，都应使用 4.3 版本，以确保与本书中讨论的项目和概念兼容。\n\n| 书中涵盖的软件/硬件 | 操作系统要求 |\n\
