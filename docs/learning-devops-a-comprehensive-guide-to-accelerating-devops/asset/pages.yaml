- pgno: 147
  md: '# # Executing Packer


    Now that we have created the Packer templates, the next step is to run Packer
    to generate

    a custom VM image, which will be used to quickly provision VMs that are already

    configured and ready to use for your applications.


    As a reminder, to generate this image, Packer will, from our JSON template, _create
    a

    temporary VM_, on which it will perform _all of the configuration actions_ described
    in this

    template, and then it will _generate an image_ from this image. Finally, at the
    end of its

    execution, it _removes the temporary VM_ and all of its dependencies.


    To generate our VM image in Azure, follow these steps:


    +   1. Configure Packer to authenticate to Azure.

    +   2. Check our Packer template.

    +   3. Run Packer to generate our image.


    Let’s look in detail at the execution of each of its steps.


    # # Configuring Packer to authenticate to Azure


    To allow Packer to create resources in Azure, we will use the Azure AD SP that
    we created

    earlier in this chapter in the _Building an Azure image with the Packer template_
    section.

    To execute Packer in Azure, we will use the four pieces of authentication information

    (subscription_id, client_id, client_secret, and tenant_id) of this SP in

    the environment variables provided in our Packer template in the _variables_ section.


    In our following template, we have four variables (_client_id_, _client_secret_,

    _subscription_id_, and _tenant_id_), which take as their values four environment

    variables (_ARM_CLIENT_ID_, _ARM_CLIENT_SECRET_, _ARM_SUBSCRIPTION_ID_, and

    _ARM_TENANT_ID_):


    ![](img/d3344b39c888aab0b832625465f837c9_147_0.png)


    Figure 4.6 – Packer template variables'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'So we can set these environment variables as follows (this is a Linux example):


