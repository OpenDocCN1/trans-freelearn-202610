- pgno: 271
  md: '# # 8 Deploying Infrastructure as Code with CI/CD Pipelines


    In the first part of this book, we learned a lot about **Infrastructure as Code
    (IaC)**, its advantages, and tools such as Terraform, Packer, and Ansible, and
    their command lines. Then, in the second part, we discussed Git and dedicated
    a chapter to the Continuous Integration and Continuous Deployment of applications.


    However, we should not neglect to also put CI/CD into practice as IaC, which will
    allow us to orchestrate and automate the whole process of provisioning the infrastructure.


    It is in this second edition of this book that I wanted to add this chapter to
    reuse all that we have learned in the previous chapters and show how to implement
    IaC with a CI/CD pipeline, which will be composed of Packer, Terraform, and Ansible.'
  merge: -1
  img_proc: true
- pgno: 272
  md: "The pipeline tool that will be used is Azure Pipelines, which we have already\
    \ covered in\ndetail in _Chapter 7, Continuous Integration and Continuous Delivery_.\
    \ So we will learn how\nto write a Azure pipeline in YAML to generate an image\
    \ with Packer. Then, we will see\nhow to write a YAML pipeline to provision a\
    \ **Virtual Machine (VM)** with Terraform and\ncomplete it with the execution\
    \ of Ansible to install nginx on this VM.\n\nThis chapter covers the following\
    \ topics:\n\n+   • Running Packer in Azure Pipelines\n+   \n+   • Running Terraform\
    \ and Ansible in Azure Pipelines\n\n# # Technical requirements\n\nThis chapter\
    \ requires the following:\n\n+   • An Azure subscription for creating the Packer\
    \ image and provisioning the VM; you\n+   can create a free account here: https://azure.microsoft.com/en-us/\n\
    +   free/search/.\n+   \n+   • An Azure DevOps account for creating the YAML pipelines\
    \ definition; you can\n+   create a free account here: https://azure.microsoft.com/en-us/\n\
    +   pricing/details/devops/azure-devops-services/.\n\nThe source code for this\
    \ chapter is available at https://github.com/\nPacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP08.\n\
    \nCheck out the following video to view the Code in Action: https://bit.ly/3BDT9ne\n\
    \n# # Running Packer in Azure Pipelines\n\nTo start our IaC pipeline, we will\
    \ automatically create an Azure VM image using Packer.\nTo perform this operation,\
    \ we will use Azure Pipelines with a pipeline in YAML format.\nThe goal of this\
    \ pipeline is to execute a Packer command automatically.\n\n> > **Important Note**\n\
    > > For more details on how to create a YAML pipeline in Azure DevOps, read\n\
    > > _Chapter 7, Continuous Integration and Continuous Delivery_.\n\nThe Packer\
    \ template that we will use in this section’s lab is the code that we learned\
    \ in\n_Chapter 4, Optimizing Infrastructure Deployment with Packer_. This source\
    \ code is available\nhere: https://github.com/PacktPublishing/Learning-DevOps-Second-\n\
    Edition/blob/main/CHAP08/packer/.pkr.hcl."
