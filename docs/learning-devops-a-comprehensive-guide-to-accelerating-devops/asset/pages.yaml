  md: '# # Authentication at GitLab


    Creating a GitLab account is free and can be done either by creating a GitLab
    account or using external accounts, such as Google, GitHub, Twitter, or Bitbucket.


    To create a GitLab account, we need to go to https://gitlab.com/users/sign_in#register-pane
    and choose the type of authentication.


