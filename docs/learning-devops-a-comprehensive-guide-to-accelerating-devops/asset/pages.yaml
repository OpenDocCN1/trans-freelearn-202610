- pgno: 142
  md: "# # 118 Optimizing Infrastructure Deployment with Packer\n\n+   - The managed_image_resource_group_name\
    \ and managed_image_name properties indicate the resource group as well as the\
    \ name of the image to be created. The name of the image is also placed into a\
    \ variable with a name and a version number.\n+   \n+   - The other properties\
    \ correspond to the information of the OS type (Ubuntu 18), size (Standard_DS2_v3),\
    \ region, and tag.\n\nNow we will write the `variables` section that defines the\
    \ elements that are not fixed:\n\n```\n```\n...\"variables\": {\n\"subscriptionid\"\
    : \"{{env 'AZURE_SUBSCRIPTION_ID'}}\",\n\"clientid\": \"{{env 'AZURE_CLIENT_ID'}}\"\
    ,\n\"clientsecret\": \"{{env 'AZURE_CLIENT_SECRET'}}\",\n\"tenantid\": \"{{env\
    \ 'AZURE_TENANT_ID'}}\",\n\n\"resource_group\": \"rg_images\",\n\"image_name\"\
    : \"linuxWeb\",\n\"image_version\": \"0.0.1\"\n},...\n```\n```\n\nWe have defined\
    \ the variables and their default values with the following:\n\n+   - The four\
    \ pieces of authentication information from the SP will be passed either in the\
    \ Packer command line or as an environment variable.\n+   \n+   - The resource\
    \ group, name, size, and region of the image to be generated are also in `variables`.\n\
    +   \n+   - The `image_version` variable that contains the version of the image\
    \ (used in the name of the image) is defined.\n\nSo, with these variables, we\
    \ will be able to use the same JSON template file to generate several images with\
