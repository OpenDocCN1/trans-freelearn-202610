  md: '![](img/d3344b39c888aab0b832625465f837c9_381_0.png)


    In this section, we have learned how to execute Postman requests in order to test
    an API

    in a unitary way, before executing all the requests in the collection using Postman
    Runner.

    In the following section, we will introduce Newman, which allows us to automate
    the

    execution of Postman tests.


    # # Understanding the Newman concept


    So far in this chapter, we have talked about using Postman locally to test the
    APIs that we

    develop or consume. But what is important in the unit, acceptance, and integration
    tests is

    that they are automated so that they can be executed within a CI/CD pipeline.


    Postman, as such, is a graphical tool that does not automate itself, but there
    is another tool

    called **Newman** that automates tests that are written in Postman.


    ![](img/d3344b39c888aab0b832625465f837c9_381_1.png)


    Newman is a free command-line tool that has the great advantage of automating
    tests

    that are already written in Postman. It allows us to integrate API test execution
    in CI/CD

    scripts or processes.


    In addition, it offers the possibility of generating the test results of reports
    of different

    formats (HTML, JUnit, and JSON).


    Nevertheless, Newman does not allow us to do the following:


    +   - To create or configure Postman requests; as we will see, requests that are
    executed

    +   by Newman will be exported from Postman.


    +   - To execute only one request that is in a collection—it executes all the
    requests in

    +   a collection.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# # Testing APIs with Postman


