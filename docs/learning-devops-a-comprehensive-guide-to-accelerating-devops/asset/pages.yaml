- pgno: 463
  md: '# # 15 Reducing Deployment Downtime


    So far in this book, we have discussed **DevOps** practices such as **Infrastructure
    as Code**

    **(IaC)**, **continuous integration/continuous deployment (CI/CD)** pipelines,
    and the

    automation of different types of tests.


    In _Chapter 1, The DevOps Culture and Infrastructure as Code Practices_, we saw
    that these

    DevOps practices will improve the quality of applications and thus improve the
    financial

    gain of a company. We will now go deeper into DevOps practices by looking at how
    to

    ensure the continuous availability of your applications even during your deployments,

    and how to deliver new versions of these applications more frequently in production.


    Often, what we see is that deployments require your applications to be interrupted

    by—for example—infrastructure changes or service shutdowns. Moreover, what we
    also

    see is that companies are still reluctant to deliver more frequently in production.
    They are

    not equipped to test the application in the production environment, or they are
    waiting

    for other dependencies.'
  merge: -1
  img_proc: true
- pgno: 464
  md: 'In this chapter, we will look at several practices that will help you improve
    application delivery processes. We''ll start with a way to reduce the downtime
    of your infrastructure and applications during Terraform deployments. Then, we
    will discuss the concept and patterns of blue-green deployment and how to configure
    it with some Azure resources. Finally, we will present the details of implementing
    a feature flag in your application, which will allow you to modify the operation
    of an application without having to redeploy it in production.


    You will also learn how to configure Terraform code to reduce application downtime.
    You''ll be able to configure Azure resources with blue-green deployment and implement
    feature flags in your applications with either an open source component or the
    LaunchDarkly platform.


    In this chapter, we will cover the following topics:


    +   - Reducing deployment downtime with Terraform

    +   - Understanding blue-green deployment concepts and patterns

    +   - Applying blue-green deployments on Azure

    +   - Introducing feature flags

    +   - Using an open source framework for feature flags

    +   - Using the LaunchDarkly solution


    # # Technical requirements


    In order to understand the Terraform concepts that will be presented in this chapter,
    you need to have read _Chapter 2, Provisioning Cloud Infrastructure with Terraform_.


    We will look at an example of how to implement blue-green deployment in Azure.
    If you don''t have an Azure subscription, you can create a free Azure account
    here: `https://azure.microsoft.com/en-gb/free/`.


    Then, we will look at an example of how to use feature flags in an ASP.NET Core
    application. To use our example, you will need to install the **.NET Core software
    development kit (SDK)**, which can be downloaded from `https://dotnet.microsoft.com/download`.


    For code editing, we used the free **Visual Studio Code (VS Code)** editor, which
    is available for download here: `https://code.visualstudio.com/`.


    The complete source code for this chapter can be found at `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP15`.'
  merge: -1
  img_proc: true
- pgno: 465
  md: 'Check out the following video to see the Code in Action:

    https://bit.ly/3hcvrVH


    # # Reducing deployment downtime with Terraform


    In Chapter 2, Provisioning Cloud Infrastructure with Terraform, we detailed the
    use of

    Terraform by looking at its commands and life cycle and put it into practice with
    an

    implementation in Azure.


    One of the problems with Terraform is that, depending on the infrastructure changes

    that need to be implemented, Terraform may automatically destroy and rebuild certain

    resources.


    To fully understand this behavior, let''s look at the output of this following
    Terraform

    execution, which provisioned an Azure Web App in Azure and has been modified with
    a

    name change:


    ![](img/d3344b39c888aab0b832625465f837c9_465_0.png)


    Figure 15.1 – Terraform downtime


    Here, we can see that Terraform will destroy the web app and then rebuild it with
    the new

    name. Although destruction and reconstruction are done automatically, while Terraform

    is destroying and rebuilding the web app, the application will be inaccessible

    to users.'
  merge: -1
  img_proc: true
- pgno: 466
  md: "To solve this problem of downtime, we can add the Terraform create_before_\n\
    destroy option, as follows:\n\n```\n```\nresource \"azurerm_app_service\" \"webapp\"\
    \ {\n  name = \"MyWebAppBook1\" #new name\n  location = \"West Europe\"\n  resource_group_name\
    \ = \"${azurerm_resource_group.rg-app.\nname}\"\n  app_service_plan_id = \"${azurerm_app_service_plan.\n\
    serviceplan-app.id}\"\n  app_settings = {\n    WEBSITE_RUN_FROM_PACKAGE = var.package_zip_url\"\
    \n  }\n  lifecycle { create_before_destroy = true }\n}\n```\n```\n\nBy adding\
    \ this option, Terraform will do the following:\n\n+   1. First, Terraform creates\
    \ a new web app with a new name.\n\n+   2. During the provisioning of the new\
    \ web app, it uses the **Uniform Resource\n+   Locator (URL)** for the application\
    \ package in ZIP format that's provided in the\n+   app_settings property. Use\
    \ WEBSITE_RUN_FROM_PACKAGE to launch the\n+   application.\n\n+   3. Then, Terraform\
    \ will destroy the old web app.\n\nUsing the Terraform create_before_destroy option\
    \ will ensure the viability of\nour applications during deployments.\n\nHowever,\
    \ be careful, as this option will only be useful if the new resource that's being\n\
    created allows us to have the application running very quickly at the same time\
    \ as it's\nprovisioning so that a service interruption doesn't occur.\n\nIn our\
    \ example of a web app, this worked when we used the WEBSITE_RUN_FROM_\nPACKAGE\
    \ property of the web app. For a **virtual machine (VM)**, we can use a VM image\n\
    created by **Packer**. As we saw in _Chapter 4, Optimizing Infrastructure Deployment\
    \ with\nPacker_, Packer contains information regarding the VM applications that\
    \ have already been\nupdated inside the VM image."
  merge: -1
  img_proc: true
- pgno: 467
  md: '> Note

    > For more information on the `create_before_destroy` option,

    > please view the following Terraform documentation: https://www.

    > terraform.io/language/meta-arguments/lifecycle.


    We have just seen that, with Terraform and IaC, it is possible to reduce downtime
    during

    deployments in the case of resource changes.


    We will now look at the concepts and patterns of a practice called **blue-green

    deployment**, which allows us to deploy and test an application in production
    with great

    confidence.


    # # Understanding blue-green deployment

    concepts and patterns


    Blue-green deployment is a practice that allows us to deploy a new version of
    an

    application in production without impacting the current version of the application.
    In this

    approach, the production architecture must be composed of **two identical environments**;

    one environment is known as the **blue** environment while the other is known
    as the **green**

    environment.


    The element that allows routing from one environment to another is a router—that
    is,

    a load balancer.


    The following diagram shows a simplified schematic of a blue-green architecture:


    ![](img/d3344b39c888aab0b832625465f837c9_467_0.png)


    Figure 15.2 – Blue-green architecture


    As we can see, there are two identical environments—the environment called **blue**,
    which

    is the current version of the application, and the environment called **green**,
    which is

    the new version or the next version of the application. We can also see a router,
    which

    redirects users'' requests either to the blue environment or the green environment.'
  merge: -1
  img_proc: true
- pgno: 468
  md: 'Now that we’ve introduced the principle of blue-green deployment, we will look
    at how to implement it in practice during deployment.


    # Using blue-green deployment to improve the production environment


    The basic usage pattern of blue-green deployment goes like this: when we’re deploying
    new versions of the application, the application is deployed in the blue environment
    (version _N_) and the router is configured in this environment.


    When deploying the next version (version _N+1_), the application will be deployed
    in the green environment, and the router is configured in this environment.


    The blue environment becomes unused and idle until the deployment of version _N+2_.
    It also will be used in the case of rapid rollback to version _N_.


    This practice of blue-green deployment can also be declined on several patterns—that
    is, the canary release and dark launch patterns. Let’s discuss the implementation
    of each of these patterns in detail. We will start with the canary release pattern.


    # Understanding the canary release pattern


    The canary release technique is very similar to blue-green deployment. The new
    version of the application is deployed in the green environment, but only for
    a small, restricted group of users who will test the application in real production
    conditions.


    This practice is done by configuring the router (or load balancer) to be redirected
    to both environments. On this router, we apply redirection restrictions of a user
    group so that it can only be redirected to the green environment, which contains
    the new version.


    Here is a sample diagram of the canary release pattern:


    ![](img/d3344b39c888aab0b832625465f837c9_468_0.png)


    Figure 15.3 – Blue-green canary release'
  merge: -1
  img_proc: true
- pgno: 469
  md: 'In the preceding diagram, the router redirects 90% of users to the blue environment
    and 10% of users to the green environment, which contains the new version of the
    application.


    Then, once the tests have been performed by this user group, the router can be
    fully configured in the green environment, thus leaving the blue environment free
    for testing the next version (N+2).


    As shown in the following diagram, the router is configured to redirect all users
    to the green environment:


    ![](img/d3344b39c888aab0b832625465f837c9_469_0.png)


    Figure 15.4 – Blue-green architecture with router


    This deployment technique thus makes it possible to deploy and test the application
    in the real production environment without having to impact all users.


    We will look at a practical implementation of this blue-green deployment pattern
    in Azure later in this chapter, in the Applying blue-green deployments on Azure
    section. But before that, let’s look at another blue-green deployment pattern—
    the dark launch pattern.


    # ## Exploring the dark launch pattern


    The dark launch pattern is another practice related to blue-green deployment that
    consists of deploying new features in hidden or disabled mode (so that they’re
    inaccessible) into the production environment. Then, when we want to have access
    to these features in the deployed application, we can activate them as we go along
    without having to redeploy the application.'
  merge: -1
  img_proc: true
- pgno: 470
  md: 'Unlike the canary release pattern, the dark launch pattern is not a blue-green
    deployment

    that depends on the infrastructure but is implemented in the application code.
    To set

    up the dark launch pattern, it is necessary to encapsulate the code of each feature
    of the

    application in elements called **feature flags** (or **feature toggles**), which
    will be used to

    enable or disable these features remotely.


    We will look at the implementation and use of feature flags with an open source

    framework and a cloud platform in the last few sections of this chapter.


    In this section, we have presented the practice of blue-green deployment, along
    with

    its concepts and patterns, such as the canary release and dark launch patterns.
    We have

    discussed that this practice requires changes to be made in the production infrastructure

    since it’s composed of two instances of the infrastructure—one blue and one green—as

    well as a router that redirects users’ requests.


    Now that we’ve talked about blue-green deployment patterns, we will look at how
    to

    implement one in practice in an Azure cloud infrastructure.


    # # Applying blue-green deployments on Azure


    Now that we’ve looked at blue-green deployment, we’ll look at how to apply it
    to an Azure

    infrastructure using two types of components—App Service slots and Azure Traffic

    Manager.


    Let’s start by looking at the most basic component—App Service slots.


    # # Using App Service with slots


    If we have an Azure subscription and want to use blue-green deployment without

    investing a lot of effort, we can use App Service slots (Azure Web Apps or Azure

    Functions).


    In Azure App Services such as a Web App, we can create a second instance of our
    Web

    App by creating a slot for it (up to 20 slots, depending on the App Service plan).
    This slot

    is a secondary web app but is attached to our main web app.


    In other words, the main web app represents the blue environment, and the slot
    represents

    the green environment.'
  merge: -1
  img_proc: true
- pgno: 471
  md: 'To use this web app and its slot as a blue-green architecture, we will perform
    the following configuration steps:


    +   1. Once the web app slot has been created, the new version of the application
    will be deployed in this slot and we can assign a percentage of traffic, as shown
    in the following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_471_0.png)


    Here, we''ve assigned 10% of traffic to the web app slot, which includes changes
    to the new version of the application.


    +   2. As soon as the new version of the application has been tested on the slot,
    we can swap the slot to the main web app (the blue environment), as shown in the
    following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_471_1.png)


    With this swap, the web app takes the content of its slot, and vice versa.'
  merge: -1
  img_proc: true
- pgno: 472
  md: 'The web app now contains the new version (_N+1_) of the application, and the
    slot contains

    the older version (_N_). In case there is an urgent problem, we can recover the
    previous

    version of the application by redoing a swap.


    > Note

    > To learn more about configuring and using Web App slots, you can read the

