- pgno: 399
  md: '# # 12 Static Code Analysis with SonarQube


    In the previous chapter, we looked at how to test the functionality of an **application
    programming interface (API)** with Postman, a free tool for testing APIs, and
    the integration and automation of these tests in a **continuous integration/continuous
    deployment (CI/CD)** pipeline using Newman.


    Testing the functionality of an API or application is a good practice when we
    wish to improve the quality of applications. In a company, the quality of an application
    must be considered by all its members because an application that brings business
    value to users increases the company’s profits.


    However, we often neglect to test the quality of an application’s code because
    we think that what matters is how the application works and not how it is coded.
    This way of thinking is a big mistake because poorly written code can contain
    security vulnerabilities and can also cause performance problems. Moreover, the
    quality of the code has an impact on its maintenance and scalability because code
    that is too complex or poorly written is difficult to maintain and, therefore,
    will cost more for the company to fix.'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'In this chapter, we will focus on static code analysis with a well-known tool
    called

    SonarQube. We will provide a brief overview of it and go over how to install it.
    Then, we

    will use SonarLint to analyze the code locally. Finally, we will integrate SonarQube
    into a

    CI/CD pipeline on Azure Pipelines.


    In this chapter, we will cover the following topics:


    +   - Exploring SonarQube

    +   - Installing SonarQube

    +   - Real-time analysis with SonarLint

    +   - Executing SonarQube in a CI process


    # ## Technical requirements


    To use SonarQube and SonarLint, we have to install the **Java Runtime Environment**

    (JRE), which can be found at `https://www.oracle.com/technetwork/java/

    javase/downloads/jre8-downloads-2133155.html` (an Oracle account

    is required), on the server where we have SonarQube and on the local development

    environment where we have SonarLint.


    To integrate SonarQube into an Azure DevOps pipeline, we must install the

    following extension on our Azure DevOps organization: `https://marketplace.

    visualstudio.com/items?itemName=SonarSource.sonarqube`.


    The complete code source for this chapter is available at `https://github.com/

    PacktPublishing/Learning-DevOps-Second-Edition/tree/main/

    CHAP12`.


    Check out the following video to see the code in action: `https://bit.ly/3s96XTR`.


    # ## Exploring SonarQube


    SonarQube is an open source tool from SonarSource (`https://www.sonarsource.

    com/`) that''s written in Java. It allows us to perform static code analysis to
    verify the

    quality and security of an application''s code.'
  merge: -1
  img_proc: true
- pgno: 401
  md: 'SonarQube is designed for developer teams and provides them with a dashboard
    and reports that are customizable so that they can present the quality of the
    code in their applications.


    It allows for the analysis of static code in a multitude of languages (over 25),
    such as **PHP: Hypertext Preprocessor (PHP)**, Java, .NET, JavaScript, Python,
    and so on. A complete list can be found at `https://www.sonarqube.org/features/multi-languages/`.


    In addition, apart from code analysis with security issues, code smell, and code
    duplication, SonarQube also provides code coverage for unit tests. For more details
    about these issue concepts, read the documentation here: `https://docs.sonarqube.org/latest/user-guide/concepts/`.


    Finally, SonarQube integrates very well into CI/CD pipelines so that it can automate
    the code analysis during developer code commits. This reduces the risk of deploying
    an application that has security vulnerabilities or code complexity that is too
    high.


    On the other hand, it is important to note that they have a multitude of plugins
    that can be paid for. A list of plugins is available here: `https://www.sonarplugins.com/`.


    Now that we''ve provided an overview of SonarQube, we will look at its architecture
    and components. Finally, we will look at the different ways of installing it.


    # # Installing SonarQube


    SonarQube is an on-premises solution—in other words, it must be installed on servers
    or **virtual machines (VMs)**. In addition, SonarQube consists of several components
    that will analyze the source code of applications, retrieve and store the data
    from this analysis, and provide reports on the quality and security of the code.


    Before we install SonarQube, it is essential that we look at its architecture
    and components.


    # # Overview of the SonarQube architecture


    SonarQube is a client/server tool, which means that its architecture is composed
    of artifacts on the server side and also on the client side.'
  merge: -1
  img_proc: true
- pgno: 402
  md: 'A simplified SonarQube architecture is shown in the following diagram:


    ![](img/d3344b39c888aab0b832625465f837c9_402_0.png)


    Figure 12.1 – SonarQube architecture with Client and Server components


    Let’s look at the components that are shown in the preceding diagram. The components
    that make up SonarQube on the server side are listed here:


    +   - A SQL Server, MySQL, Oracle, or PostgreSQL database that contains all the
    analysis data.


    +   - A web application that displays dashboards.


    +   - The compute engine, which is in charge of retrieving the analysis and processes
    and putting them in the database.


    +   - A search engine built with Elasticsearch.


    The client-side components are listed here:


    +   - The scanner, which scans the source code of the applications and sends the
    data to the compute engine.


    +   - The scanner is usually installed on build agents that are used to execute
    CI/CD pipelines.


    +   - SonarLint is a tool that’s installed on developers’ workstations for real-time
    analysis. We will look at it in detail later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 403
  md: "For more details on this architecture, we can consult the SonarQube architecture\
    \ and integration documentation, which can be found at https://docs.sonarqube.org/latest/user-guide/concepts/.\n\
    \nNow that we have looked at its architecture and components, we will learn how\
    \ to install it.\n\n# # SonarQube installation\n\nSonarQube can be installed in\
    \ different ways—either manually or by installing a Docker container from the\
    \ Sonar image. Alternatively, if we have an Azure subscription, we can use a SonarQube\
    \ VM from the Marketplace. Let’s take a closer look at each of these options.\n\
    \n# # Manual installation of SonarQube\n\nIf we want to install the SonarQube\
    \ server manually, we must take the prerequisites into account. These prerequisites\
    \ are that Java must already be installed on the server and that we need to check\
    \ the hardware configuration shown at https://docs.sonarqube.org/latest/requirements/requirements/.\n\
    \nThen, we must manually install the server components in order, like so:\n\n\
    +   1. Install the database. This can be either MSSQL, Oracle, PostgreSQL, or\
    \ MySQL.\n+   \n+   2. Then, for the web application, download the Community Edition\
    \ of SonarQube from https://www.sonarqube.org/downloads/ and unzip the downloaded\
    \ ZIP file.\n+   \n+   3. In the $SONARQUBE-HOME/conf/sonar.properties file, configure\
    \ access to the database we installed in Step 1 and the storage path of Elasticsearch,\
    \ as detailed in the following documentation: https://docs.sonarqube.org/latest/setup/install-server/.\n\
    +   \n+   4. Start the web server.\n\nTo find out about all the details regarding\
    \ this installation according to the chosen database and our **operating system\
    \ (OS)**, we can consult the following documentation: https://docs.sonarqube.org/latest/setup/install-server/."
  merge: -1
  img_proc: true
