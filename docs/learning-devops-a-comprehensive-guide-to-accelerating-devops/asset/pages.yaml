    us/azure/developer/ansible/dynamic-inventory-

    configure?tabs=azure-cli.


    By using a dynamic inventory, we can take full advantage of the scalability of
    the cloud

    with an automatic VM configuration and without having to make any code changes.


    In this section, we learned how to use a dynamic inventory in Azure by implementing

    its configuration and doing the necessary script recovery, before executing this
    dynamic

    inventory with Ansible.


    # # Summary


    In this chapter, we saw that Ansible is a very powerful and complete tool that
    allows us

    to automate server configuration and administration. To work, it uses an inventory
    that

    contains the list of hosts to be configured and a playbook that the list of configuration

    actions is coded in.'
  merge: -1
