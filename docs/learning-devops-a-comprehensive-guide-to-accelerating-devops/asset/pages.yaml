- pgno: 105
  md: "Indeed, once the VM has been provisioned, it must be configured, and all of\
    \ the\nmiddleware needed to run the applications that will be hosted on this VM\
    \ must\nbe installed. Also, it is necessary to perform administrative tasks concerning\
    \ the\nconfiguration of directories and their access.\n\nIn this section, we will\
    \ see what a playbook is made up of, its modules, and how to\nimprove our playbook\
    \ with roles.\n\nNow, let’s start studying how to write a basic playbook.\n\n\
    # # Writing a basic playbook\n\nThe code of a playbook is written in YAML, a declarative\
    \ language that allows us to easily\nvisualize the configuration steps.\n\nTo\
    \ understand what a playbook looks like, let’s look at a simple and classic example;\n\
    that is, installing an NGINX server on an Ubuntu VM. Previously, we created a\
    \ working\ndevopsansible directory, inside which we will create a playbook.yml\
    \ file and insert\nthe following content code:\n\n```\n```\n---\n- hosts: all\n\
    tasks:\n- name: install and check nginx latest version\n  apt: name=nginx state=latest\n\
    - name: start nginx\n  service:\n    name: nginx\n    state: started\n---\n```\n\
    ```\n\nLet’s take a look at this in detail:\n\n+   • First of all, the YAML file\
    \ starts and ends with the optional -- characters.\n\n+   • The `- hosts` property\
    \ contains the list of hosts to configure. Here, we have written\n+   the value\
    \ of this property as `all` to install NGINX on all of the VMs listed in our\n\
    +   inventory. If we want to install it on only a particular group, for example,\
    \ on the\n+   webserver group, we will note this as follows:\n\n```\n```\n---\n\
    - hosts: webserver\n```\n```"
  merge: -1
  img_proc: true
- pgno: 106
  md: '+   - Then, we indicate the list of tasks or actions to be performed on these
    VMs, with the property of the list of tasks.


    +   - Under the `tasks` element, we describe the list of tasks and, for each of
    them, a name that serves as a label, in the `name` property. Under the name, we
    call the function to be executed using the `Ansible modules` and their properties.
    In our example, we have used two modules:


    +   - `apt`: This allows us to retrieve a package (the `apt-get` command) to get
    the latest version of the `nginx` package.


    +   - `service`: This allows us to start or stop a service – in this example,
    to start the NGINX service.


    What we can see is that we do not require any knowledge of development or IT scripting
    to use Ansible; the important thing is to know the list of actions you can perform
    on VMs to configure them. The Ansible playbook is, therefore, a sequence of actions
    that are encoded in Ansible modules.


    We have just seen that the tasks that are used in playbooks use modules. In the
    next section, we will provide a brief overview of modules and their use.


    # # Understanding Ansible modules


    In the previous section, we learned that, in Ansible playbooks, we use modules.
    This has made Ansible so popular today that there is a huge list of public modules
    provided by Ansible natively (+200). The complete list is available here: `https://docs.ansible.com/ansible/latest/collections/index_module.html`.


    These modules allow us to perform all of the tasks and operations to be performed
    on a VM for its configuration and administration, without having to write any
    lines of code or scripts.


    Within an enterprise, we can also create our custom modules and publish them in
    a private registry internally. More information can be found here: `https://docs.ansible.com/ansible/latest/dev_guide/developing_modules_general.html`.


    Now that we''ve learned how to write a simple playbook and how to use modules,
    we will improve the playbook even further with roles.'
  merge: -1
  img_proc: true
- pgno: 107
  md: "# # Improving your playbooks with roles\n\nWithin an enterprise, when configuring\
    \ a VM, we notice a certain repetition of tasks for\neach application. For example,\
    \ several applications require the identical installation of\nNGINX, which must\
    \ be performed in the same way.\n\nWith Ansible, this repetition will require\
    \ duplicating the playbook code, as seen in our\nplaybook example in the *Executing\
    \ a basic playbook* section, between several playbooks\n(because each application\
    \ contains a playbook). To avoid this duplication and, hence,\nsave time, avoid\
    \ errors, and homogenize installation and configuration actions, we can\nencapsulate\
    \ the playbook code in a directory called *role* that can be used by\nseveral\
    \ playbooks.\n\nTo create the `nginx` role corresponding to our example, we will\
    \ create the following\ndirectory and file tree within our `devopsansible` directory:\n\
    \n![](img/d3344b39c888aab0b832625465f837c9_107_0.png)\n\nFigure 3.8 – The Ansible\
    \ architecture folder\n\nThen, in the `main.yml` file, which is located in `tasks`,\
    \ we will copy and paste the\nfollowing code from our playbook in the file that\
    \ is created:\n\n```\n```\n- name: install and check nginx latest version\n  apt:\
    \ name=nginx state=latest\n- name: start nginx\n  service:\n    name: nginx\n\
    \    state: started\n```\n```"
  merge: -1
  img_proc: true
- pgno: 108
  md: "Then, we will modify our playbook to use this role with the following content:\n\
    \n```\n---\n- hosts: webserver\n  roles:\n    - nginx\n```\n\nFollowing the node\
    \ roles, we will provide a list of roles (the names of the role directories) to\
    \ be used. So, this `nginx` role is now centralized and can be used in several\
    \ playbooks without having to rewrite its code.\n\nThe following is the code of\
    \ a playbook that configures a VM web server with Apache and another VM that contains\
    \ a MySQL database:\n\n```\n---\n- hosts: webserver\n  roles:\n    - php\n   \
    \ - apache\n- hosts: database\n  roles:\n    - mysql\n```\n\n> Important Note\n\
    > For more information on role creation, read the official documentation at https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse_roles.html.\n\
    \nHowever, before we start creating a role, we can use Ansible Galaxy (`https://galaxy.ansible.com/`),\
    \ which contains a large number of roles provided by the community and covers\
    \ a high number of configuration and administration needs.\n\nWithin an enterprise,\
    \ we can also create custom roles and publish them in a private galaxy within\
    \ the company. More information can be found here: `https://docs.ansible.com/ansible/latest/dev_guide/developing_modules_general.html`.\n\
    \nIn this section, we learned how to write a playbook, as well as how to improve\
    \ one with roles. All of our artifacts are finally ready, so we will now be able\
    \ to execute Ansible."
  merge: -1
  img_proc: true
- pgno: 109
  md: '# # Executing Ansible


    So far, we’ve learned how to install Ansible, listed the hosts in the inventory,
    and set up

    our Ansible playbook. Now, we can run Ansible to configure our VMs.


    For this, we will run the Ansible tool with the `ansible-playbook` command, like
    this:


    ```

    ansible-playbook -i inventory playbook.yml

    ```


    The basic options for this command are as follows:


    +   • The `-i` argument with the inventory file path


    +   • The path of the playbook file


    The following is the execution of this command:


    ![](img/d3344b39c888aab0b832625465f837c9_109_0.png)


    The execution of this command applies the playbook to the hosts in the inventory
    in

    several steps:


    +   1. Gathering facts: Ansible checks that the hosts can be reached.


    +   2. The task’s playbook is executed on hosts.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# ## 3. PLAY Recap: This is the status of the changes that were executed on
    each host; the value of this status can be as follows:


    | ok | This is the number of playbook tasks that have been correctly applied to
    the host. |

    |---|---|

    | changed | This is the number of changes that have been applied. |

    | unreachable | The host is unreachable. |

    | failed | Execution failed on this host. |


    Table 3.1 – The values of PLAY Recap


    If we need to upgrade our playbook to add or modify middleware on our VMs, during
    the second execution of Ansible with this upgraded playbook, we will see that
    Ansible did not reapply the complete configuration of the VMs; it only applied
    the differences.


    The following screenshot shows the second execution of Ansible with no changes
    made to our playbook:


    ![](img/d3344b39c888aab0b832625465f837c9_110_0.png)


    Here, we can see that Ansible didn’t change anything on the hosts (changed=0).


    We can also add some useful options to this command to provide the following:


    +   - A preview of Ansible changes before applying the changes


    +   - More logs in the execution output


    These options are not only important for the playbook development phase, but also
    for debugging them in case of errors during their execution.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Now, let’s look at how to use these preview options.


    # # Using the preview or dry run option


    When coding an Ansible playbook, we often need to test different steps without
    applying them directly to infrastructure. Hence, it is very useful, especially
    when automating VM configuration with Ansible, to have a preview of its execution.
    This allows us to check that the syntax of the playbook is maintaining good consistency
    with the system configuration that already exists on the host.


    With Ansible, it’s possible to check the execution of a playbook on hosts by adding
    the `--check` option to the command:


    ```

    `ansible-playbook -i inventory playbook.yml --check`

    ```


    Here is an example of this dry run execution:


    ![](img/d3344b39c888aab0b832625465f837c9_111_0.png)


    Figure 3.11 – The Ansible playbook dry run execution


    With this option, Ansible does not apply configuration changes to the host; it
    only checks and previews the changes that have been made to the hosts.


    > > **Important Note**

    > > For more information on the `--check` option, please refer to the following
    documentation: https://docs.ansible.com/ansible/ latest/user_guide/playbooks_checkmode.html.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# # Increasing the log level output


    In case of errors, it is possible to add more logs during the output by adding
    the -v, -vvv, or -vvvv option to the Ansible command.


    The -v option enables basic verbose mode, the -vvv option enables verbose mode
    with more outputs, and the -vvvv option adds verbose mode and the connection debugging
    information.


    Executing the following command applies a playbook and will display more log information
    using the -v option that has been added:


    ```

    `ansible-playbook -i inventory playbook.yml -v`

    ```


    This can be useful for debugging in case of Ansible errors.


    > > **Important Note**

    > >The complete documentation on the `ansible-playbook` command is available here:
    `https://docs.ansible.com/ansible/2.4/ansible-playbook.html`.


    We have just learned how to execute Ansible with its inventory and playbook by
    exploring some options that allow for the following:


    +   - Previewing the changes that will be made by Ansible

    +   - Increasing the level of logs to make debugging easier


    In the next section, we will talk about data security while using Ansible Vault.


    We have just seen that Ansible allows us to check a playbook before applying it
    to a host; it is also necessary to know that there are other tools to test the
    functionality of a playbook (without having to simulate its execution), such as
    Vagrant by HashiCorp.


    Vagrant allows us to locally create a test environment composed of VMs very quickly
    that we can run our playbooks on and see the results. For more information on
    the use of Ansible and Vagrant, refer to the following documentation: `https://docs.ansible.com/ansible/latest/scenario_guides/guide_vagrant.html`.


    We have just learned how to preview the changes that will be applied by Ansible.
    Now, let''s look at how to increase the log level output of Ansible''s execution.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# # Protecting data with Ansible Vault


    So far, we’ve learned how to use Ansible with an inventory file that contains
    the list of

    hosts to configure, and with a playbook that contains the code of the host’s configuration

    actions. But in all IaC tools, it will be necessary to extract some data that
    is specific to

    a context or environment inside variables.


    In this section, we will look at how to use variables in Ansible and how to protect
    sensitive

    data with Ansible Vault.


    To illustrate this use and protection of variables, we will complete our example
    by

    installing a MySQL server on the database server.


    Let’s begin by looking at the use and utility of variables in Ansible.


    # ## Using variables in Ansible for better configuration


    When deploying infrastructure with IaC, the code that’s used is often composed
    of two parts:


    +   - A part that describes the elements or resources that make up the infrastructure.


    +   - Another part that differentiates the properties of this infrastructure from
    one

    +   environment to another.


    This second part of differentiation for each environment is done by using variables,
    and

    Ansible has a whole system that allows us to inject variables into playbooks.


    To learn how to use variables in Ansible, we will complete our code and add a
    role called

    mysql to the roles directory with the following tree structure:


    ![](img/d3344b39c888aab0b832625465f837c9_113_0.png)


    Figure 3.12 – The Ansible role folder structure'
  merge: -1
  img_proc: true
- pgno: 114
  md: "In the main.yml file of this role, we will write the following code:\n\n```\n\
    ---\n- name: Update apt cache\n  apt: update_cache=yes cache_valid_time=3600\n\
    - name: Install required software\n  apt: name=\"{{ packages }}\" state=present\n\
    \  vars:\n    packages:\n    - python-mysqldb\n    - mysql-server\n- name: Create\
    \ mysql user\n  mysql_user:\n    name={{ mysql_user }}\n    password={{ mysql_password\
    \ }}\n    priv=*.*:ALL\n    state=present\n```\n\nIn this code, some static information\
    \ has been replaced by variables. They are as follows:\n\n+   - packages: This\
    \ contains a list of packages to install, and this list is defined in the following\
    \ code.\n+   - mysql_user: This contains the user admin of the MySQL database.\n\
    +   - mysql_password: This contains the admin password of the MySQL database.\n\
    \nThe different tasks of this role are as follows:\n\n+   - Updating packages\n\
    +   - Installing the MySQL server and Python MySQL packages\n+   - Creating a\
    \ MySQL user"
  merge: -1
  img_proc: true
- pgno: 115
  md: "# # Important Note\n\nThe complete source code for this role is available at\
    \ `https://github. com/PacktPublishing/Learning-DevOps-Second- Edition/tree/main/CHAP03/devopsansible/roles/\
    \ mysql.`\n\nAs we can see, in the user creation task, we have put the `mysql_user`\
    \ and `mysql_ password` variables in for the user name and password. Hence, this\
    \ information may be different depending on the environment, or it may be instantiated\
    \ dynamically when running Ansible.\n\nTo define the values of these variables,\
    \ we will create a `group_vars` directory, which will contain all of the values\
    \ of the variables for each group defined in our inventory.\n\nThen, in this `group_vars`\
    \ folder, we will create a `database` subdirectory corresponding to the database\
    \ group defined in the inventory and a `main.yml` subfile.\n\nIn this `main.yml`\
    \ file, we put the desired values of these variables, as follows:\n\n```\n```\n\
    ---\nmysql_user: mydbuserdef\nmysql_password: mydbpassworddef\n```\n```\n\nFinally,\
    \ we will complete our playbook by calling the `mysql` role by adding the following\
    \ code:\n\n```\n```\n- hosts: database\nbecome: true\nroles:\n  - mysql\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 116
  md: "We can execute Ansible with the same command as the previous one, ansible-\
    \ \nplaybook -i inventory playbook.yml. The following output is generated:\n\n\
    ![](img/d3344b39c888aab0b832625465f837c9_116_0.png)\n\nFigure 3.13 – The Ansible\
    \ playbook’s MySQL execution\n\nHere, Ansible has updated the database server\
    \ with two changes: the list of packages to \nbe installed and the MySQL admin\
    \ user. We have just learned how to use variables in \nAnsible, but this one is\
    \ clear in the code, which raises security issues.\n\n> **Important Note**\n>\
    \ \n> For more information about Ansible variables, read the complete \n> documentation\
    \ here: https://docs.ansible.com/ansible/ \n> latest/user_guide/playbooks_variables.html.\n\
    \nNow, let’s learn how to use Ansible Vault to protect playbook variables.\n\n\
    # Protecting sensitive data with Ansible Vault\n\nConfiguring a system often requires\
    \ sensitive information that should not be in the wrong \nhands. In the Ansible\
    \ tool, there is a sub-tool called **Ansible Vault** that protects the data \n\
    that’s transmitted to Ansible through playbooks."
  merge: -1
  img_proc: true
- pgno: 117
  md: 'In this section, we''ll learn how to manipulate Ansible Vault to encrypt and
    decrypt the

    information of the MySQL user.


    The first step is to encrypt the `group_vars/database/main.yml` file, which contains

    the values of the variables, by executing the following command:


    ```

    `ansible-vault encrypt group_vars/database/main.yml`

    ```


    Ansible Vault requests that you include a password that will be required to decrypt
    the file

    and then shows the execution of this command to encrypt the content of a file:


    ![](img/d3344b39c888aab0b832625465f837c9_117_0.png)


    After executing this command, the content of the file is encrypted, so the values
    are no

    longer clear. The following is a sample from it:


    ![](img/d3344b39c888aab0b832625465f837c9_117_1.png)


    To decrypt the file to modify it, you must execute the `decrypt` command:


    ```

    `ansible-vault decrypt group_vars/database/main.yml`

    ```


    Ansible Vault requests the password that was used to encrypt the file, and the
    file becomes

    readable again.


    In an Ansible usage automation process, it is preferable to store the password
    in a file in

    a protected location; for example, in the `~/.vault_pass.txt` file.


    Then, to encrypt the variable file with this file, we must execute the `ansible-vault`

    command and add the `--vault-password-file` option:


    ```

    `ansible-vault encrypt group_vars/database/main.yml --vault-password-file ~/.vault_pass.txt`

    ```'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Now that the file has been encrypted and the data is protected, we will run
    Ansible.

    In **interactive mode**, we will run the following command:

    `ansible-playbook -i inventory playbook.yml --ask-vault-pass`

    Ansible asks the user to enter the password shown in the following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_118_0.png)


    Figure 3.16 – Decrypted file with Ansible Vault


    In **automatic mode** – that is, in a CI/CD pipeline – we can add the `--vault-

    password-file` parameter with the path of the file that contains the password
    to

    decrypt the data:

    `ansible-playbook -i inventory playbook.yml --vault-password-

    file ~/.vault_pass.txt`

    With that, we''ve executed Ansible with data that is no longer clear in the code
    and with

    the use of the `ansible-vault` command.


    > Important Note

    > The entire source code for the inventory, playbook, and roles is

    > available here: https://github.com/PacktPublishing/

    > Learning-DevOps-Second-Edition/tree/main/CHAP03/

    > devopsansible.


    In this section, we learned how to protect sensitive data in our playbooks using
    the

    `ansible-vault` utility. We encrypted and decrypted variable files to protect
    them, and

    then re-ran Ansible with these encrypted files.

    In the following section, we will learn how to use Ansible with a dynamic inventory.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# # Using a dynamic inventory for an Azure infrastructure


    When configuring an infrastructure that is composed of several VMs, along with

    ephemeral environments that are built on demand, the observation that’s often
    made is

    that maintaining a static inventory, as we saw in the _Creating an Ansible inventory_
    section,

    can quickly become complicated and its maintenance takes a lot of time to complete.


    To overcome this problem, Ansible allows inventories to be obtained dynamically
    by

    calling a script (for example, in Python) that is either provided by cloud providers
    or

    a script that we can develop ourselves that returns the contents of the inventory.


    In this section, we will look at the different ways to use Ansible to configure
    VMs in Azure

    using a dynamic inventory. Let’s get started:


    +   1. The first step is to configure Ansible to be able to access Azure resources.
    For

    +   this, we will create an Azure Service Principal in Azure AD, in exactly the
    same

    +   way as we did for Terraform (see the _Configuring Terraform for Azure_ section
    of

    +   _Chapter 2, Provisioning Cloud Infrastructure with Terraform_). Then, we must
    export

    +   the information of the four service principal IDs to the following environment

    +   variables:

    +   ```

    +   export AZURE_SUBSCRIPTION_ID=<subscription_id>

    +   export AZURE_CLIENT_ID=<client ID>

    +   export AZURE_SECRET=<client Secret>

    +   export AZURE_TENANT=<tenant ID>

    +   ```


    > **Important Note**

    > For more information on the Azure environment variables for Ansible, please

    > refer to the Azure documentation here: https://docs.ansible.com/

    > ansible/latest/scenario_guides/guide_azure.html.


    +   2. Then, to be able to generate an inventory with groups and to filter VMs,
    it is better

    +   to add tags to the VMs. Tags can be added using Terraform, an `az cli` command

    +   line, or an Azure PowerShell script.

    +   Here is an example script with `az cli`:

    +   ```

    +   az resource tag --tags role=webserver -n VM01 -g

    +   demoAnsible --resource-type "Microsoft.Compute/

    +   virtualMachines"

    +   ```'
  merge: -1
  img_proc: true
- pgno: 120
  md: "The preceding script adds a `role` tag of the webserver value to the VM01 VM.\n\
    Then, we must perform the same operation on the VM02 VM (just change the value\n\
    of the `-n` parameter to VM02 in the preceding script).\n\nThe following screenshot\
    \ shows the VM tag in the Azure portal:\n\n![](img/d3344b39c888aab0b832625465f837c9_120_0.png)\n\
    \nFigure 3.17 – Azure role tag\n\nNow, we must add to our VM the tag that contains\
    \ the database with this script:\n\n```\n```\naz resource tag --tags role=database\
    \ -n VM04 -g demoAnsible --resource-type \"Microsoft.Compute/virtualMachines\"\
    \n```\n```\n\nThis script adds a `role` tag to VM04, which has a value of `database`.\n\
    \n> > **Important Note**\n> >The `az cli` documentation for managing Azure tags\
    \ can\n> be found here: https://docs.microsoft.com/\n> fr-fr/cli/azure/resource?view=azure-cli-\n\
    > latest&viewFallbackFrom=azure-cli-latest.md#az-\n> resource-tag.\n\n+   3. To\
    \ use a dynamic inventory in Azure, we need to do the following actions:\n+  \
    \ \n+   - Install the Ansible Azure module on the machine with the following script.\n\
    \n```\n```\nwget -q https://raw.githubusercontent.com/ansible-collections/azure/dev/requirements-azure.txt;\n\
    pip3 install -r requirements-azure.txt;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 121
  md: "+   - We can also install the Azure module using Ansible Galaxy by executing\
    \ the following command:\n+   \n+   ansible-galaxy collection install azure.azcollection\n\
    \n> Note\n> For more details about the Azure collection, read the documentation\
    \ at\n> https://galaxy.ansible.com/azure/azcollection.\n\nCreate a new file named\
    \ inv.azure_rm.yml (the name of this file must finish\nwith azure_rm) and write\
    \ in this file the following configuration:\n\n+   - Use the azure_rm plugin.\n\
    +   - Allow the returned VM list to be grouped by role tags.\n+   - Filter only\
    \ in the demoAnsible resource group.\n\nThe contents of this file will look as\
    \ follows:\n\n```\nplugin: azure_rm\ninclude_vm_resource_groups:\n- demoAnsible\n\
    auth_source: auto\nkeyed_groups:\n- key: tags.role\nleading_separator : false\n\
    ```\n\n> Important Note\n> The complete source code for the inv.azure_rm.yml file\
    \ is\n> available here: https://github.com/PacktPublishing/\n> Learning-DevOps-Second-Edition/tree/main/CHAP03/\n\
    > devopsansible/inventories.\n\n+   4. After setting up all of the artifacts for\
    \ our Ansible dynamic inventory in Azure, it is\n+   good to test its functionality,\
    \ which includes doing the following:\n+   \n+   A. Ensuring there are no execution\
    \ errors.\n+   B. Ensuring the connection and authentication to our Azure environment\
    \ are done\n+   correctly.\n+   C. Ensuring its execution returns the Azure VMs\
    \ from our infrastructure."
  merge: -1
  img_proc: true
- pgno: 122
  md: '# # Important Note


    As mentioned in the _Technical requirements_ section, before running the following
    commands, we need to have the Azure Python module installed on the machine.


    To perform this test, execute the following command:


    ```

    ```

    ansible-inventory -i inv.azure_rm.yml --list

    ```

    ```


    This command allows us to display as output the inventory script in list format.
    Here is a small sample screen from this execution:


    ![](img/d3344b39c888aab0b832625465f837c9_122_0.png)


    Figure 3.18 – Dynamic Ansible inventory list of VMs


    We can also display this inventory in graph mode by running the same command but
    with the `--graph` option, as follows:


    ![](img/d3344b39c888aab0b832625465f837c9_122_1.png)


    Figure 3.19 – Dynamic Ansible inventory list of VMs grouped by role


    With the `--graph` option, we get a better visualization of the VMs according
    to their tags.


    With the test concluded, we can proceed to the final step, which is executing
    Ansible with a dynamic inventory.


    +   5. Once we have tested our dynamic inventory in Azure, we just have to run
