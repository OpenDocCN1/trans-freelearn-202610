- pgno: 205
  md: 'From the preceding execution, we indicate the origin alias and master branch
    to be updated in the local repository, and its execution displays the pushed commits.
    At the end of the execution of this command, our local repository is up to date.


    For the rest of the process with the code update, this is the same as we saw earlier
    in the Updating the code section.


    We have just seen the simple process of using Git, but it is also possible to
    isolate its development with the use of branches.


    # # Isolating your code with branches


    When developing an application, we often need to modify part of the code without
    wanting to impact the existing stable code of the application. For this, we will
    use a feature that exists in all VCSs that allows us to create and manage branches.


    The mechanics of using the branches are quite simple, as outlined here:


    +   1. From a branch, we create another branch.


    +   2. We develop this new branch.


    +   3. In case we work in teams, create a PR for a discussion about the code changes.
    If reviewers agree with these changes, they approve the changes'' code.


    +   4. To apply the changes made on this new branch to the original branch, a
    merge operation is performed.


    Conceptually, a branch system is represented in this way:


    ![](img/d3344b39c888aab0b832625465f837c9_205_0.png)


    Figure 6.33 – Branch diagram


    In this diagram, we see that branch B is created from branch A. These two branches
    will be modified by development teams for adding a new feature to our application.
    But in the end, branch A is merged with branch B, and hence the branch B code
    changes.'
