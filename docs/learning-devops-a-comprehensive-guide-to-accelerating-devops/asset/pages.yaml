- pgno: 451
  md: 'The following screenshot shows its execution:


    ![](img/d3344b39c888aab0b832625465f837c9_451_0.png)


    Figure 14-8 – Vault put secret with vault kv put command line


    The command, with the put operation, creates new secret data in memory with the
    title vmadmin of the key-value type, which in this example is the admin account
    of a VM, in the secret/ path.


    In Vault, all protected data is stored in a path that corresponds to an organizational
    location in Vault. The default path for Vault is secret/, and it is possible to
    create custom paths that will allow better management of secret rights and better
    organization by domain, topic, or application.


    In terms of secrets stored in Vault, one of their advantages is that it is possible
    to store multiple data in the same secret; for example, we’ll update the secret
    data that we have created with another secret, which is the login admin of the
    VM.


    For this, we’ll execute the following command that adds another key-value secret
    in the same Vault data:


    vault kv put secret/vmadmin vmpassword=admin123* vmadmin=bookadmin


    As we can see in this execution, we used exactly the same command with the same
    secret, and we added new key-value data—that is, vmadmin.


    Note

    For more information on this kv put command, read the documentation at https://www.vaultproject.io/docs/commands/kv/put
    .html.


    We learned how to use commands to create a secret in Vault and the various uses
    of secrets, and we’ll now have a look at the command to read this secret in order
    to use it inside an application or in infrastructure resources.'
  merge: -1
