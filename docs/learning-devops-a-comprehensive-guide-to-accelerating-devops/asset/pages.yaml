- pgno: 220
  md: 'One of the advantages for the developer of using this type of package manager
    is that they don’t have to store the packages with the application sources but
    can make them a reference in a configuration file so that the packages will be
    automatically retrieved.


    In an enterprise application, things are a little different because, although
    developers use packages from public managers, some elements that are generated
    in an enterprise must remain internal.


    Indeed, it is often the case that frameworks (such as NuGet or npm libraries)
    are developed internally and cannot be exposed publicly. Moreover, as we have
    seen in the CI/CD pipeline, we need to make a package for our application and
    store it in a package manager that will be private to the company.


    That’s why looking at package managers such as NuGet and npm, which can be used
    within an enterprise or for personal needs, is suggested.


    # # Private NuGet and npm repository


    If you need to centralize your NuGet or npm packages, you can create your own
    local repository.


    To create your **NuGet server** instance, here is the Microsoft documentation:
    `https:// docs.microsoft.com/en-us/nuget/hosting-packages/overview`.


    For npm, we can also install it locally with the `npm local-npm` package, whose
    documentation is available here: `https://www.npmjs.com/package/local-npm`.


    The problem with installing one repository per package-type method is that we
    need to install and maintain a repository and its infrastructure for the different
    types of packages.


    This is why it is preferable to switch to universal repository solutions such
    as Nexus (Sonatype), ProGet, and Artifactory for on-premises solutions, and Azure
    Artifacts, MyGet, or Artifactory for SaaS solutions.


    To understand how a package manager works, we will look at Nexus Repository OSS
    and Azure Artifacts.


    # # Nexus Repository OSS


    Nexus Repository is a product of the Sonatype company (`https://www.sonatype.
    com/`), which specializes in **development-security-operations (DevSecOps)** tools
    that integrate security controls in the code of applications.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Nexus Repository exists in an open source/free version, and its documentation
    is available at https://www.sonatype.com/nexus-repository-oss?smtNoRedir=1 and
    https://help.sonatype.com/repomanager3.


    Before installing and using Nexus, please take into consideration the software
    and hardware requirements detailed in the requirements documentation here: https://help.sonatype.com/repomanager3/installation/system-
    requirements.


    For the installation and configuration steps, refer to the installation procedure,
    which is available here: https://help.sonatype.com/repomanager3/installation.


    You can also use it via a Docker container (we will look at Docker in detail in
    the next chapter), and here is the documentation regarding this: https://hub.docker.
    com/r/sonatype/nexus3/.


    Once Nexus Repository is installed, we must create a repository by following these
    steps:


    +   1. In the **Repositories** section, click on the **Create repository** button.


    +   2. Then, choose the type of packages (for example, npm, NuGet, or Bower) that
