  md: '# # Ansible artifacts


    To configure a system, Ansible needs several main artifacts:


    +   - **The hosts**: These are target systems that Ansible will configure; the
    host can also be a local system.


    +   - **The inventory**: This is a file in INI or YAML format that contains the
    list of target hosts that Ansible will perform configuration actions on. This
    inventory can also be a script, which is the case with a dynamic inventory.


    > > **Important Note**

    > > We will look at how to implement an Ansible inventory in the _Creating an
    Ansible inventory_ section, while we will look at how to implement a dynamic inventory
    in the _Using a dynamic inventory for Azure infrastructure_ section.


    +   - **The playbook**: This is the Ansible configuration script that will be
    executed to configure hosts.


    > > **Important Note**

    > > We will learn how to write playbooks in the _Executing the first playbook_
    section, later in this chapter.


    After learning how to install Ansible, we looked at the essential elements of
    Ansible, which are hosts, inventory, and playbooks. Now, let''s learn how to configure
    Ansible.


    # # Configuring Ansible


    By default, the Ansible configuration is in the `/etc/ansible/ansible.cfg` file,
    which is created while Ansible is being installed. This file contains several
    configuration keys, such as an SSL connection, a user, a protocol, transport,
    and many others.


    As we mentioned previously, this file is created by default while Ansible is being
    installed. To help the user get started, initial content is placed in it. This
    content contains a multitude of configuration keys that are commented out so that
    they are not applied by Ansible but can be activated at any time by the user.'
