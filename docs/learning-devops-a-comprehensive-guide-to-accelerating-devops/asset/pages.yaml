- pgno: 254
  md: '# 230 Continuous Integration and Continuous Delivery


    > Note

    > The objective of this section is to demonstrate an overview of the pipeline

    > YAML of Azure DevOps with only the CI steps. It''s not an advanced lab, and

    > if you want to learn more, read the documentation here: https://docs.

    > microsoft.com/en-us/azure/devops/pipelines/yaml-

    > schema.


    In the following lab, we will learn how to create a basic pipeline definition
    in a YAML file.

    Here’s how to do this:


    +   1. In Azure Repos, inside the DemoBook repository created previously, add
    a new file

    +   named azure-pipeline.yml, with the following content:

    +   trigger:

    +   - master

    +   pool:

    +   vmImage: ubuntu-latest

    +   steps:

    +   - task: DotNetCoreCLI@2

    +   displayName: "Restore"

    +   inputs:

    +   command: restore

    +   projects: ''**/*.csproj''

    +   - task: DotNetCoreCLI@2

    +   displayName: "build"

    +   inputs:

    +   command: ''build''

    +   projects: ''**/*.csproj''

    +   arguments: ''--configuration Release''

    +   - task: DotNetCoreCLI@2

    +   displayName: "Run tests"

    +   inputs:

    +   command: ''test''

    +   projects: ''**/tests/*.csproj''

    +   arguments: ''--configuration Release''

    +   - task: DotNetCoreCLI@2

    +   displayName: "Code coverage"

    +   inputs:'
  merge: -1
  img_proc: true
- pgno: 255
  md: '```

    command: test

    projects: ''**/*/Tests/*.csproj''

    arguments: ''--configuration Release --collect "Code coverage"''

    ```


    In this file, we have three sections: `trigger`, `pool`, and `steps`. In the `trigger`
    section, we indicate the branch of the code that triggers the pipeline, so here,
    any commit on the `master` branch will execute the pipeline.


    Then, the `pool` section indicates the agent pool to be used to execute the pipeline.
    Finally, in the `steps` section, we write all tasks that will be executed during
    the pipeline. Here, in our lab, we have declared four tasks, as follows:


    • The restore of the NuGet packages of the project

    • The compilation of the project

    • The execution of the tests

    • The publication of the code coverage of the executed tests


    +   2. We commit and push this file into the root of the repository, as follows:


    ![](img/d3344b39c888aab0b832625465f837c9_255_0.png)


    Figure 7.48 – Azure Pipelines: YAML pipeline'
