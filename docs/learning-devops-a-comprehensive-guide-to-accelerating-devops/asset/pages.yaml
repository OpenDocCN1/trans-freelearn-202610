- pgno: 162
  md: 'You have learned how to install Vagrant manually on a Windows system. In the
    next section, we will discuss the installation of Vagrant using Chocolatey or
    a script.


    # # Installing Vagrant by script on Windows


    On Windows, we can use **Chocolatey**, which is a software package manager.


    > > **Note**

    > > In this chapter, I will not reintroduce Chocolatey, as we have already introduced
    it in the previous chapters. For additional information about Chocolatey, please
    read the documentation at https://chocolatey.org/.


    Once Chocolatey has been installed, we simply need to run the following command
    in PowerShell or the CMD tool:


    ```

    `choco install vagrant -y`

    ```


    The following is a screenshot of the Vagrant installation for Windows using Chocolatey:


    ![](img/d3344b39c888aab0b832625465f837c9_162_0.png)


    To finalize the installation of Vagrant, we need to reboot the machine.'
  merge: -1
