- pgno: 304
  md: '# # Pushing a Docker image to a private registry (ACR)


    In the previous section, we learned how to push a Docker image to Docker Hub,
    which is a public registry. Now, we will learn how to push a Docker image to a
    private registry.


    There are a lot of on-premises or cloud solutions that enable the Docker private
    registry. Here is a list of these solutions:


    +   - Docker registry server: `https://docs.docker.com/registry/deploying/`

    +   - Artifactory from JFrog: `https://www.jfrog.com/confluence/display/JFROG/Docker+Registry`

    +   - Amazon Elastic Container Registry (ECR): `https://aws.amazon.com/ecr/`

    +   - Google Container Registry (GCR): `https://cloud.google.com/container-registry`

    +   - ACR: `https://azure.microsoft.com/en-us/services/container-registry/`


    In this section, we will study the use of one of these solutions—ACR.


    To push a Docker image into ACR, we will proceed with these steps:


    +   1. Before pushing a Docker image, we will create an ACR resource using one
    of the following:


    +   - The Azure CLI (`https://docs.microsoft.com/en-us/azure/container-registry/container-registry-get-started-azure-cli`).
    The az cli script that creates a resource group and an ACR resource is shown here:


    ```

    az group create --name RG-ACR --location eastus

    az acr create --resource-group RG-ACR --name acrdemo --sku Basic

    ```


    +   - PowerShell (`https://docs.microsoft.com/en-us/azure/container-registry/container-registry-get-started-powershell`).
    The PowerShell script that creates a resource group and an ACR resource is shown
    here:


    ```

    New-AzResourceGroup -Name RG-ACR -Location EastUS

    $registry = New-AzContainerRegistry -ResourceGroupName "RG-ARC" -Name "acrdemo"
    -EnableAdminUser -Sku Basic

    ```'
  merge: -1
  img_proc: true
- pgno: 305
  md: '+   - The Azure portal (https://docs.microsoft.com/en-us/azure/

    +   container-registry/container-registry-get-started-portal)


    In the next steps, we will use an ACR resource named demobookacr.


    +   2. Then, we will connect to our Azure account by running the following az
    cli

    +   command:

    +   az login


    +   3. We connect to the created ACR resource (in Step 1) with the following az
    acr

    +   login command by passing the --name argument as the name of the ACR

    +   resource created in Step 1, as follows:

    +   az acr login --name demobookacr


    This command will connect to the Docker registry using the docker login

    command in the background.


    +   4. For pushing a Docker image into this ACR resource, we will execute a couple
    of

    +   commands.


    The first command is to create a tag to the local image, as illustrated here:

    docker tag demobook:v1 demobookacr.azurecr.io/demobook:v1


    The second command is to push the image into the ACR resource, as illustrated

    here:

    docker push demobookacr.azurecr.io/demobook:v1


    These two commands are exactly the same as those we learned for tagging and

    pushing a Docker image into Docker Hub, with the difference being that the URL
    of

    the Docker registry for ACR here is <acr name>.azurecr.io.


    The following screenshot shows the execution of these commands:


    ![](img/d3344b39c888aab0b832625465f837c9_305_0.png)


    Figure 9.21 – Pushing Docker image into ACR'
