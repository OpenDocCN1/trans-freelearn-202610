- pgno: 163
  md: '# # Installing Vagrant by script on Linux


    On Linux, we can execute the following script to install Vagrant automatically:


    ```

    sudo apt-get update && sudo apt-get install -y gnupg software-properties-common
    curl \

    && curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add - \

    && sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com
    $(lsb_release -cs) main" \

    && sudo apt-get update && sudo apt-get install vagrant

    ```


    This script does the following:


    +   - It adds the apt HashiCorp repository.

    +   - It updates the local repository.

    +   - It downloads and installs the Vagrant CLI.


    > > **Note**

    > > For additional information about all installations of Vagrant on other operating
    systems, please refer to the documentation at `https://www.vagrantup.com/downloads`.


    Once Vagrant has been installed, we can test the installation of the Vagrant CLI
    by running the following command:


    ```

    vagrant --version

    ```


    The preceding command displays the version of Vagrant that has been installed,
    and the following screenshot shows the execution of this command:


    ![](img/d3344b39c888aab0b832625465f837c9_163_0.png)


    Figure 5.4 – Displaying the installed version of Vagrant


    We have just learned the manual installation procedure for Vagrant and how to
    install it using a script on Linux.


    Now, we will expose some main Vagrant artifacts and write a Vagrant template configuration
    to create a basic Linux VM locally and configure it with Ansible to test Ansible
    scripts.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# # Writing a Vagrant configuration file


    Before we discuss how to write the Vagrant configuration file, it is important
    to mention a few artifacts of Vagrant.


    The important elements of Vagrant are the following:


    +   - The Vagrant binary (CLI): We learned how to download and install this in
    the previous section, _Installing Vagrant_.


    +   - The base image of the VM, called **Vagrant Boxes**, will be used and mentioned
    in the configuration file. This image can be either public, that is, published
    in the Vagrant cloud, or local on the machine.


    +   - The configuration file defines the composition of our VM that we want to
    create locally.


    Now that we have looked at the different elements of Vagrant, we are going to
    write the configuration file of our VM. To begin, we are going to check which
    base machine we are going to use.


    # # Using Vagrant Cloud for Vagrant Boxes


    To use basic Vagrant images, HashiCorp has set up a portal that allows you to
    publish and publicly share images of VMs that are compatible with Vagrant.


    To gain access to these images, called boxes, you can navigate to the site at
    `https://app.vagrantup.com/boxes/search` and then perform a search on the specific
    box that interests you according to the following criteria:


    +   - The operating system (Windows or Linux)


    +   - The supported hypervisor


    +   - The middleware that has already been installed


    +   - The publisher'
  merge: -1
  img_proc: true
