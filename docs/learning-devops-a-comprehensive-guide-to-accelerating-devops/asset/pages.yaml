    look at how we can install it on a local machine.


    # # Installing Kubernetes on a local machine


    When developing a containerized application that is to be hosted on Kubernetes,
    it is very

    important to be able to run the application (with its containers) on your local
    machine,

    before deploying it on remote Kubernetes production clusters.


    In order to install a Kubernetes cluster locally, there are several solutions,
    which are

    detailed next.


    The first solution is to use **Docker Desktop** by performing the following steps:


