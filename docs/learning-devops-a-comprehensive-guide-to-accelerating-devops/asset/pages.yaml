    # # Installing Ansible


    Before we start using Ansible, we must know which OS we can use it on and how
    to install and configure it. Then, we must learn about some of the concepts surrounding
    the artifacts that it needs to operate.


    In this section, we will look at how to install Ansible on a local or server machine
    and how to integrate Ansible in Azure Cloud Shell. Then, we will talk about the
    different elements or artifacts that make up Ansible. Finally, we will configure
    Ansible.


    To get started, we will learn how to download and install Ansible with an automatic
    script.


    # # Installing Ansible with a script


    Unlike Terraform, Ansible is not multiplatform and can only be installed on Red
    Hat, Debian, CentOS, macOS, or any of the BSDs. You install it using a script
    that differs according to your OS.


    For example, to install the latest version on Ubuntu, we must run the following
    script in a Bash Terminal:


    ```

    ```

    sudo apt-get update

    sudo apt-get install software-properties-common

    sudo apt-add-repository --yes --update ppa:ansible/ansible

    sudo apt-get install ansible

    ```

    ```'
