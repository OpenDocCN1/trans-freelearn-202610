- pgno: 222
  md: 'Nexus is a high-performance and widely used enterprise repository, but it requires
    effort to install and maintain it. This is not the case for SaaS package managers
    such as Azure Artifacts, which we’ll look at now.


    # # Azure Artifacts


    Azure Artifacts is one of the services provided by Azure DevOps. We already looked
    at it in the previous chapter, and we will also cover it again later, in the _Using
    Azure Pipelines for CI/CD_ section of this chapter. It is hosted in the cloud,
    and therefore allows private package feeds to be managed.


    The packages supported today are NuGet, npm, Maven, Gradle, Python, and also universal
    packages. The main difference compared with Nexus is that in Azure Artifacts,
    the feed is not by package type, and one feed can contain different types of packages.


    One of the advantages of Azure Artifacts is that it is fully integrated with other
    Azure DevOps services such as Azure Pipelines, which allows for the management
    of CI/CD pipelines, as we will see shortly.


    In Azure Artifacts, there is also a type of package called a **universal package**
    that allows the storing of all types of files (called a **package**) in a feed
    that can be consumed by other services or users.


    Here is an example of an Azure Artifacts feed containing several types of packages,
    in which we can see one NuGet package, one npm package, one universal package,
    one Maven package, and one Python package:


    ![](img/d3344b39c888aab0b832625465f837c9_222_0.png)


    Figure 7.4 – Azure Artifacts packages'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Azure Artifacts has the advantage of being in SaaS offering mode, so there
    is no installation or infrastructure to manage; for more information, the documentation
    is available here: https://azure.microsoft.com/en-us/services/devops/ artifacts/.


    We finished this overview of package managers with the local NuGet server instance,
    NPM, Nexus, and Azure Artifacts. Of course, there are many other package manager
    tools that should be considered according to the company''s needs.


    After looking at package managers, we will now implement a CI/CD pipeline with
    a well- known tool called Jenkins.


    # # Using Jenkins for CI/CD implementation


    Jenkins is one of the oldest CI tools, initially released in 2011. It is open
    source and developed in Java.


    Jenkins has become famous thanks to the large community working on it and its
    plugins. Indeed, there are more than 1,500 Jenkins plugins that allow you to perform
    all types of actions within your jobs. And if, despite everything, one of your
    tasks does not have a plugin, you can create one yourself.


    In this section, we will look at the installation and configuration of Jenkins
    and will create a CI Jenkins job that will be executed during the commit of code
    that is in a Git repository.


    The source code of the demonstration application is a Java project that is open
    source and available on the GitHub Microsoft repository space here: https://github.com/
    microsoft/MyShuttle2. To be able to use it, you need to fork it into your GitHub
    account.


    Before talking about the Jenkins job, we will see how to install and configure
    Jenkins.


    # # Installing and configuring Jenkins


    Jenkins is a cross-platform tool that can be installed on any type of support,
    such as **virtual machines (VMs)** or even Docker containers. Its installation
    documentation is available here: https://jenkins.io/doc/book/installing/.


    For our demo, and to quickly access the configuration of a CI/CD pipeline, we
    will use Jenkins on an Azure VM. In fact, Azure Marketplace contains a VM with
    Jenkins and its prerequisites already installed.'
  merge: -1
  img_proc: true
