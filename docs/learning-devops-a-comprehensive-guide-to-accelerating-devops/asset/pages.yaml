    });\n```\n\nThe following code illustrates that the response in JSON format is\
    \ not empty:\n\n```\npm.test(\"Json response is not empty\", function () {\n \
    \   pm.expect(pm.response).to.be.json;\n});\n```\n\nThe following code illustrates\
    \ that, in the JSON response, the `userId` property is equal to 1:\n\n```\npm.test(\"\
    Json response userId eq 1\", function () {\n    var jsonRes = pm.response.json();\n\
    \    pm.expect(jsonRes.userId).to.eq(1);\n});\n```\n\nAnd so, finally, the **Tests**\
    \ tab of our request, which tests our API, contains all this code, as shown in\
    \ the following screenshot:\n\n![](img/d3344b39c888aab0b832625465f837c9_376_0.png)\n\
    \nFigure 11.14 – Postman Tests code"
  merge: -1
