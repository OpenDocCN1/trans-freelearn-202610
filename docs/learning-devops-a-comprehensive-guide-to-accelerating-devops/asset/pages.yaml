- pgno: 347
  md: "# # Publishing a Helm chart in a private registry (ACR)\n\nIn the previous\
    \ section, we discussed a public Helm repository called Artifact Hub, which is\
    \ great for public (or community) applications or tools. But for company applications,\
    \ it’s better and recommended to have a private Helm registry.\n\nIn the marketplace,\
    \ there are a lot of private registries such as Nexus or Artifactory, and this\
    \ documentation explains how to create a private Helm repository: `https://helm.sh/docs/topics/chart_repository/`.\n\
    \nIn this section, we will discuss how to use a private Helm repository (that\
    \ is, ACR, which we have already learned about in _Chapter 9, Containerizing Your\
    \ Application with Docker_). So, to start our lab, we consider that we have already\
    \ created an ACR named demobookacr on Azure.\n\n> > **Note**\n> > If you have\
    \ not already created an ACR, follow the documentation here:\n> > `https://docs.microsoft.com/en-us/azure/container-registry/container-registry-get-started-azure-cli`\n\
    \nTo publish a custom Helm chart in ACR, follow these steps:\n\n+   1. The first\
    \ step is to create a package in `tar.gz` format of the chart by running the `helm\
    \ package` command inside the folder where the `chart.yaml` file of the chart\
    \ is located.\n+   \n+   Run the following command with \".\" as a parameter to\
    \ indicate that the `chart.yaml` file is in the current folder:\n+   \n+   ```\n\
    +   helm package .\n+   ```\n+   \n+   The following screenshot shows the execution\
    \ of this command:\n+   \n+   Figure 10.22 – Creating a Helm package\n+   \n+\
    \   The Helm chart package is created with the name `demobook-0.1.0.tgz`.\n\n\
    +   2. Then, authenticate to ACR with the following PowerShell script:\n+   \n\
    +   ```\n+   $env:HELM_EXPERIMENTAL_OCI=1\n+   $USER_NAME=\"00000000-0000-0000-0000-000000000000\"\
    \n+   $ACR_NAME=\"demobookacr\"\n+   ```"
  merge: -1
  img_proc: true
- pgno: 348
  md: '```

    az login

    $PASSWORD=$( az acr login --name $ACR_NAME --expose-token

    --output tsv --query accessToken)

    helm registry login "$ACR_NAME.azurecr.io" --username

    $USER_NAME --password "$PASSWORD"

    ```


    The preceding script performs these operations:


    +   • Sets the HELM_EXPERIMENTAL_OCI environment variable to 1. For more details

    +   about environment variables, read this documentation: https://helm.sh/

    +   docs/topics/registries/.


    +   • Sets the USER_NAME variable with a 000 fake value.


    +   • Sets the ACR_NAME variable with the name of the ACR.


    +   • Sets the PASSWORD variable dynamically by using the az cli command.


    +   • Uses the Helm registry login to authenticate to the ACR registry.


    3. Finally, we push the Helm chart into the ACR registry with the following command:


    ```

    helm push .\demobook-0.1.0.tgz oci://$ACR_NAME.azurecr.

    io/helm

    ```


    After the execution of this command, the pushed Helm chart will be in the helm/

    demobook repository on the ACR.


    4. We can check that the Helm chart is correctly pushed to the ACR by running
    the

    following command:


    ```

    az acr repository show --name $ACR_NAME --repository

    helm/demobook

    ```


    The execution of this command displays the details of the helm/demobook

    Helm chart.'
  merge: -1
  img_proc: true
