    # # Writing secrets to Vault


    When you want to protect sensitive data that will be used by an application or
    infrastructure resources, the first step is to store this data in the secrets
    data manager that has been chosen by the company. We''ll see in practice the steps
    for writing data to Vault.


    To protect data in Vault, we go to a Terminal and execute the following command:


    ```

    `vault kv put secret/vmadmin vmpassword=admin123*`

    ```'
