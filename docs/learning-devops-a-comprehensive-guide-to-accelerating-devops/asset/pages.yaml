- pgno: 477
  md: "In this section, we will look at an example of implementing feature flags within\
    \ a .NET\n(Core) application using a simple framework called RimDev.FeatureFlags.\n\
    \nRimDev.FeatureFlags is a framework written in .NET that's free and open source\n\
    (https://github.com/ritterim/RimDev.FeatureFlags) and is packaged and\ndistributed\
    \ via a NuGet package. It can be found here: https://www.nuget.org/\npackages/RimDev.AspNetCore.FeatureFlags.\n\
    \nTo store the feature flag data, RimDev.FeatureFlags uses a database that must\n\
    be created beforehand. The advantage of RimDev.FeatureFlags is that once\nimplemented\
    \ in our application, it provides a web **user interface (UI)** that allows us\
    \ to\nenable or disable feature flags.\n\nAs a prerequisite for this example,\
    \ we need to have an ASP.NET Core MVC application\nalready initialized. We will\
    \ use a SQL Server database that has been created to store feature\nflag data.\n\
    \nTo initialize RimDev.FeatureFlags in this application, we will perform the\n\
    following steps:\n\n+   1. The first step consists of referencing the NuGet RimDev.FeatureFlags\
    \ package\n+   in our application and modifying (with any text editor) the .csproj\
    \ file of the\n+   application, which is located at the root of the application's\
    \ files and contains some\n+   application parameters, by adding a PackageReference\
    \ element, as follows:\n+   \n+   <ItemGroup>\n+   ...\n+   <PackageReference\
    \ Include=\"RimDev.AspNetCore.\n+   FeatureFlags\" Version=\"2.1.3\" />\n+   </ItemGroup>\n\
    +   \n+   Alternatively, we can execute the following command in a terminal command\
    \ line\n+   to reference a NuGet package in the existing project:\n+   \n+   dotnet\
    \ add package RimDev.AspNetCore.FeatureFlags\n\n+   2. Then, we'll go to the appsettings.json\
    \ configuration file to configure the\n+   connection string to the database we\
    \ created beforehand with the following code:\n+   \n+   \"connectionStrings\"\
    : {\n+   \"localDb\": \"Data Source=<your database\n+   server>;Database=FeatureFlags.AspNetCore;User\
    \ ID=<your\n+   user>;Password=<password data>\"\n+   }"
  merge: -1
  img_proc: true
- pgno: 478
  md: "# ## 3. In the `startup.cs` file, which is located at the root of the application's\
    \ files, we'll add the configuration to `RimDev.FeatureFlags` with this block\
    \ of code:\n\n```\n```csharp\nprivate readonly FeatureFlagOptions options;\npublic\
    \ Startup(IConfiguration configuration)\n{\n    Configuration = configuration;\n\
    \    options = new FeatureFlagOptions()\n        .UseCachedSqlFeatureProvider(Configuration.GetConnectionString(\"\
    localDb\"));\n}\n```\n```\n\nIn the preceding code snippet, we initialized the\
    \ options of RimDev.FeatureFlags by using the database connection. We can configure\
    \ service loading with the following code:\n\n```\n```csharp\npublic void ConfigureServices(IServiceCollection\
    \ services)\n{\n    ...\n    services.AddFeatureFlags(options);\n}\npublic void\
    \ Configure(IApplicationBuilder app, IHostingEnvironment env)\n{\n    ...\n  \
    \  app.UseFeatureFlags(options);\n    app.UseFeatureFlagsUI(options);\n}\n```\n\
    ```\n\nAs soon as the application starts, RimDev will load the feature flag data\
    \ into the application context. With this, we've configured RimDev.FeatureFlags\
    \ in our project."
  merge: -1
  img_proc: true
