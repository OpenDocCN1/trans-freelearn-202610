- pgno: 475
  md: 'In this example code, the `activateFeature` function allows us to find out
    whether the application should add the tax to order according to the `addTaxToOrder`
    parameter, which is specified outside the application (such as in a database or
    configuration file).


    Features encapsulated in feature flags may be necessary either for the running
    of the application or for an internal purpose such as log activation or monitoring.


    The activation and deactivation of features can be controlled either by an administrator
    or directly by users via a graphical interface.


    The lifetime of a feature flag can be either of the following:


    +   • **Temporary**: To test a feature. Once validated by users, the feature flag
    will be deleted.


    +   • **Definitive**: To leave a feature flagged for a long time.


    Thus, using feature flags, a new version of an application can be deployed to
    the production stage faster. This is done by disabling the new features of the
    release. Then, we will reactivate these new features for a specific group of users
    such as testers, who will test these features directly in production.


    Moreover, if we notice that one of the application’s functionalities is not working
    properly, it is possible for the feature flags to disable it very quickly, without
    us having to redeploy the rest of the application.


    Feature flags also allow A/B testing—that is, testing the behavior of new features
    by certain users and collecting their feedback.


    There are several technical solutions when it comes to implementing feature flags
    in an application, as outlined here:


    +   • You develop and maintain your custom feature flags system, which has been
    adapted to your business needs. This solution will be suitable for your needs
    but requires a lot of development time, as well as the necessary considerations
    of architecture specifications such as the use of a database, data security, and
    data caching.'
  merge: -1
  img_proc: true
- pgno: 476
  md: '+   - You use an open source tool that you must install in your project. This
    solution allows us to save on development time but requires a choice of tools,
    especially in the case of open source tools. Moreover, among these tools, few
    offer portal or dashboard administration that allows for the management of feature
    flags remotely. There is a multitude of open source frameworks and tools for feature
    flags. Please go to http://featureflags.io/resources/ to find them. Please refer
    to the following as well:


    +   - RimDev.FeatureFlags (https://github.com/ritterim/RimDev.FeatureFlags)


    +   - Flagr (https://github.com/checkr/flagr)


    +   - Unleash (https://github.com/Unleash/unleash)


    +   - Togglz (https://github.com/togglz/togglz)


    +   - Flip (https://github.com/pda/flip).


    +   - You can use a cloud solution (a platform as a service, or PaaS) that requires
    no installation and has a back office for managing feature flags, but most of
    them require a financial investment for large-scale use in an enterprise. Among
    these solutions, we can mention the following:


    +   - LaunchDarkly (https://launchdarkly.com/)


    +   - Rollout (https://app.rollout.io/signup)


    +   - Featureflag.tech (https://featureflag.tech/)


    +   - Featureflow (https://www.featureflow.io/).


    In this section, we have talked about how the use of feature flags is a development
    practice that allows you to test an application directly in the production stage.


    We also mentioned the different feature flag usage solutions and illustrated their
    implementation. Let’s discuss one of its implementations with an open source tool
    known as RimDev.FeatureFlags.


    # # Using an open source framework for feature flags


    As we’ve seen, there are a large number of open source tools or frameworks that
    allow us to use feature flags in our applications.'
