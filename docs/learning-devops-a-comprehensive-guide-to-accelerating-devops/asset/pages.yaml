- pgno: 266
  md: "# # The following screenshot shows the remote GitLab repository:\n\n![](img/d3344b39c888aab0b832625465f837c9_266_0.png)\n\
    \nFigure 7.63 – GitLab repository\n\nThe code of our application has been deposited\
    \ in GitLab, and we can now create our CI process with GitLab.\n\n# # Creating\
    \ a CI pipeline\n\nIn GitLab CI, the creation of a CI pipeline (and CD) is not\
    \ done via a **graphical UI (GUI)**, but with a YAML file at the root of the project.\n\
    \nThis method, which consists of describing the process of a pipeline in a file\
    \ that is located with the code, can be called **Pipeline as Code (PaC)**, in\
    \ the same way as **Infrastructure as Code (IaC)**. We'll proceed as follows:\n\
    \n+   1. To create this pipeline, we will create, at the root of the application\
    \ code, a `.gitlab-ci.yml` file with the following content:\n+   \n+   ```\n+\
    \   image: microsoft/dotnet:latest\n+   stages:\n+     - build\n+     - test\n\
    +   ```"
  merge: -1
  img_proc: true
- pgno: 267
  md: "```\nvariables:\n  BuildConfiguration: \"Release\"\n\nbuild:\n  stage: build\n\
    \  script:\n    - \"cd app\"\n    - \"dotnet restore\"\n    - \"dotnet build --configuration\n\
    $BuildConfiguration\"\ntest:\n  stage: test\n  script:\n    - \"cd tests\"\n \
    \   - \"dotnet test --configuration\n$BuildConfiguration\"\n```\n\n> Note\n> The\
    \ code of this file is also available here: https://github.com/\n> PacktPublishing/Learning-DevOps-Second-Edition/\n\
    > blob/main/CHAP07/gitlab-ci-demo.yml.\n\nWe can see at the beginning of this\
    \ code that we use a microsoft/\ndotnet:latest Docker image that will be mounted\
    \ in a container and in which\nthe actions of the pipeline will be executed.\n\
    \nThen, we define two stages, one for the build and one for the test execution,\
    \ as well\nas a BuildConfiguration variable that will be used in the scripts.\n\
    \nFinally, we describe each of the stages of the scripts to be executed in their\n\
    respective directories. These .NET core scripts are identical to the ones we saw\n\
    in the Using Azure Pipelines for CI/CD section.\n\n> Note\n> Full documentation\
    \ on the format and syntax of this .gitlab-ci.yml file\n> is available here: https://docs.gitlab.com/ee/ci/yaml/.\n\
    \n+   2. Then, we will commit and push this file into the remote repository.\n\
    +   \n+   3. Just after pushing the code, we can see that the CI process has been\
    \ triggered."
