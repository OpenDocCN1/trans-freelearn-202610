- pgno: 383
  md: '# # Preparing Postman collections for Newman


    As we have just seen, Newman is Postman’s client tool, and in order to work, it
    needs

    the configuration of the collections, requests, and environments that we have
    created

    in Postman.


    That’s why, before running Newman, we will have to export Postman’s collection
    and

    environments, and this export will serve as Newman’s arguments. So, let’s start
    exporting

    the DemoBook collection that we created in Postman.


    # ## Exporting the collection


    The exporting of a Postman collection consists of obtaining a JSON file that contains
    all

    the settings of this collection and the requests that are inside it.


    It is from this JSON file that Newman will be able to run the same API tests as
    when we

    ran them from Postman.


    To do this export, perform the following tasks:


    +   1. Go to the context menu of the collection that we want to export.


    +   2. Choose the **Export** action.


    +   3. Then, in the window that opens, uncheck the **Collection v2.1 (recommended)**

    +   checkbox.


    +   4. Finally, validate by clicking on the **Export** button.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# These steps are shown in the following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_384_0.png)


    Clicking on the **Export** button exports the collection to a JSON format file,
    `DemoBook.postman_collection.json`, which we save in a folder that we create,
    which is dedicated to Newman.


    After exporting the collection, we also need to export the environment and variable
    information because the requests in our collection depend on it.


    # Exporting the environments


    We could stop there for Newman''s configuration, but the problem is that our Postman
    requests use variables that are configured in environments.'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'It is for this reason, therefore, that we will also have to export the information
    from each

    environment in JSON format so that we can also pass it on as an argument to Newman.


    To export the environments and their variables, perform the following tasks:


    +   1. Open **ENVIRONMENTS** from the left panel in Postman.


    +   2. Then, click on the **Export** environment button.


    These steps are shown in the following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_385_0.png)


    Figure 11.24 – Postman Export environment


    So, for each environment, we will export their configurations in a JSON file,
    which we

    save in the same folder where we exported the collection.


    Finally, we have a folder on our machine that contains three Postman JSON files:


    +   • One JSON file for the collection


    +   • One JSON file for the `Local` environment


    +   • One JSON file for the `QA` environment'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'The following screenshot shows the contents of the local folder that contains
    Postman''s exports:


    ![](img/d3344b39c888aab0b832625465f837c9_386_0.png)


    Figure 11.25 – Postman export file folder


    We have just covered the export of all the configurations of our Postman requests,
    including the collection and the environments, and we will now look at the execution
    of the Newman command line.


    # # Running the Newman command line


    After exporting the Postman configuration that we saw earlier, we will run the
    Newman utility on our local machine.


    To execute Newman, go to the Terminal, then to the folder where the JSON configuration
    files are located, and execute the following command:


