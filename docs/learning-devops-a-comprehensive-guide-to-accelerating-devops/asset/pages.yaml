- pgno: 159
  md: '# # 5 Authoring the Development Environment with Vagrant


    In the previous chapters, we learned how to provision a piece of infrastructure
    with Terraform, how to install middleware with Ansible, and, finally, how to create
    Virtual Machine (VM) images with Packer.


    One problem that is frequently pointed out by operational teams is the fact that
    they need to be able to test all of the automation scripts on isolated environments,
    that is, environments that are not on the local machine. Indeed, writing scripts
    with Ansible under Linux, for example, is difficult to test on a local Windows
    machine.


    To answer this problem, we can use virtualization systems such as Hyper-V or VirtualBox,
    which allow you to have VMs with different operating systems that run locally.
    However, to go even further, we can automate the creation and provisioning of
    these VMs using the tiers tool from HashiCorp, called Vagrant.'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'In this chapter, we will learn about the basics of using Vagrant. We will discuss
    its installation, how to write Vagrant files, and, finally, we will examine its
    execution to create and provision a Linux VM.


    In this chapter, we''re going to cover the following main topics:


    +   - Installing Vagrant

    +   - Writing a Vagrant configuration file

    +   - Provisioning a local VM with the Vagrant CLI


    # ## Technical requirements


    Vagrant can create a VM on any hypervisor. In this chapter, we will use VirtualBox
    as a local VM hypervisor. You can download and install it from `https://www.virtualbox.org/wiki/Downloads`.


    On Windows, if you have already installed Hyper-V, to use VirtualBox, you need
    to disable Hyper-V. Please refer to the following documentation:


    `https://www.vagrantup.com/docs/installation#windows-virtualbox-and-hyper-v`


    All of the commands executed in this chapter will be executed in a terminal console
    such as PowerShell or Bash.


    The complete source code for this chapter is available here:


    `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP05/`


    Check out the following video to view the Code in Action: `https://bit.ly/3s5a049`


    # # Installing Vagrant


    Vagrant is a cross-platform tool that can be installed on Windows, Linux, or macOS.
    Installation can be done in two ways: either manually or via a script in Windows.


    # # Installing manually on Windows


    To install Vagrant manually on Windows, perform the following steps:


    +   1. Go to the official download page (`https://www.vagrantup.com/downloads`),
    click on the **Windows** tab, and download the MSI package corresponding to your
    operating system''s CPU type (either 32 bits or 64 bits).'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# ## 2. After downloading, click on the downloaded MSI file and select the
    installation directory (keep the default value):


