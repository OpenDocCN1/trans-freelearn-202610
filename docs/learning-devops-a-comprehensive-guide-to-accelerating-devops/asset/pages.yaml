- pgno: 82
  md: '# # The Terraform life cycle within a CI/CD process


    So far, we have seen and executed, _on the local machine_, the various Terraform
    commands

    that allow us to initialize, preview, apply, and destroy infrastructure and to
    format and

    validate Terraform code. When using Terraform locally, in a development context,
    the

    execution life cycle is as follows:


    ![](img/d3344b39c888aab0b832625465f837c9_82_0.png)


    Figure 2.21 – The Terraform CICD process


    The following steps explain the sequence in the preceding diagram:


    +   1. Code development

    +   2. Code formatting with `terraform fmt`

    +   3. Initialization with `terraform init`

    +   4. Code validation with `terraform validate`

    +   5. Planning with `terraform plan`

    +   6. Manual verification of Terraform changes on the infrastructure


    However, IaC, similar to an application, must be deployed or executed in an **automatic

    CI/CD process**. This begins with the archiving of the Terraform code of the team

    members. Then, it triggers the CI and executes the Terraform commands that we
    have

    studied in this chapter.


    The following is a screenshot of the Terraform life cycle in CI/CD automation:'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/d3344b39c888aab0b832625465f837c9_83_0.png)


    Figure 2.22 – The Terraform CICD workflow


    The steps of CI/CD by the CI server (in which Terraform has been installed) for
    Terraform are as follows:


    +   1. Retrieving the code from the SCM

    +   2. Code formatting with `terraform fmt`

    +   3. Initialization with `terraform init`

    +   4. Code validation with `terraform validate`

    +   5. Displaying a preview of the infrastructure changes with `terraform plan
    -out-out.tfplan`

    +   6. Applying changes in automatic mode with `terraform apply --auto-approve
    out.tfplan`


    By adding the `--auto-approve` option to the `apply` and `destroy` commands, Terraform
    can also be executed in automatic mode. This is to avoid asking for confirmation
    from the user to validate the changes that need to be applied. With this automation,
    Terraform can be integrated with CI/CD tools.


    In the `plan` command, an `out` option is added to specify a file with the `.tfplan`
    format that corresponds to a file that contains the output of the `plan` command.
    This `out.tfplan` file is then used by the `apply` command. The advantage of this
    procedure is that it is possible to execute the application on a later plan, which
    can be used in a rollback case.


    In this section, we have gathered that, aside from the usual Terraform commands
    of `init`, `plan`, `apply`, and `destroy`, Terraform also has options that will
    allow us to improve the readability of the code and validate the code syntax.
    Additionally, we explained that Terraform allows a perfect integration into a
    CI/CD pipeline with a life cycle and automation options.


    In the next section, we will examine what the `tfstate` file is and how to protect
    it with a remote backend.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# # Protecting the state file with a remote backend


    When Terraform handles resources, it writes the state of these resources in a
    Terraform state file. This file is in JSON format and preserves the resources
    and their properties throughout the execution of Terraform.


    By default, this file, called `terraform.tfstate`, is created locally when the
    first execution of the `apply` command is executed. Then, it will be used by Terraform
    each time the `plan` command is executed in order to compare its state (written
    in the state file) with that of the target infrastructure. Finally, it will return
    a preview of what will be applied.


    When using Terraform in an enterprise, this locally stored state file poses many
    problems:


    +   - Knowing that this file contains the status of the infrastructure, it should
    not be deleted. If deleted, Terraform might not behave as expected when it is
    executed.

    +   - It must be accessible at the same time by all members of the team who are
    handling resources on the same infrastructure.

    +   - This file can contain sensitive data, so it must be secure.

    +   - When provisioning multiple environments, it is necessary to be able to use
    multiple state files.


    With all of these points, it is not possible to keep this state file locally or
    even to archive it in an SCM.


    To solve this problem, Terraform allows this state file to be stored in a shared
    and secure storage called the **remote backend**.


    > > **Important Note**

    > > Terraform supports several types of remote backends; the full list is available
    at https://www.terraform.io/docs/backends/types/remote.html.


    In our case, we will use an **azurerm remote backend** to store our state files
    with a storage account and a blob for the state file.


    Therefore, we will implement and use a remote backend in three steps:


    +   1. The creation of the storage account

    +   2. The Terraform configuration for the remote backend

    +   3. The execution of Terraform with the use of this remote backend'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Let’s take a look, in detail, at the execution of these steps:


    +   1. To create an Azure storage account and a blob container, we can use either
    the

    +   Azure portal (https://docs.microsoft.com/en-gb/azure/storage/

    +   common/storage-quickstart-create-account?tabs=azure-portal)

    +   or an az cli script:

    +   ```

    +   # 1-Create resource group

    +   az group create --name MyRgRemoteBackend --location

    +   westeurope

    +   # 2-Create storage account

    +   az storage account create --resource-group

    +   MyRgRemoteBackend --name storageremotetf --sku Standard_

    +   LRS --encryption-services blob

    +   # 3-Get storage account key

    +   ACCOUNT_KEY=$(az storage account keys list --resource-

    +   group MyRgRemoteBackend --account-name storageremotetf

    +   --query [0].value -o tsv)

    +   # 4-Create blob container

    +   az storage container create --name tfbackends --account-

    +   name storageremotetf --account-key $ACCOUNT_KEY

    +   ```

    +   This script creates a MyRgRemoteBackend resource group and a storage account,

    +   called storageremotetf.

    +   Then, the script retrieves the key account from the storage account and creates
    a

    +   blob container, tfbackends, inside this storage account.

    +   This script can be run in Azure Cloud Shell, and the advantage of using a
    script rather

    +   than using the Azure portal is that this script can be integrated into a CI/CD
    process.


    +   2. Then, to configure Terraform to use the previously created remote backend,
    we need

    +   to add the configuration section within the Terraform.tf file:

    +   ```

    +   terraform {

    +    backend "azurerm" {

    +    storage_account_name = "storageremotetfdemo"

    +    container_name = "tfbackends"

    +    key = "myappli.tfstate"

    +    snapshot = true

    +    }

    +   }

    +   ```'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'The storage_account_name property contains the name of the storage account,
    the container_name property contains the container name, the key property contains
    the name of the blob state object, and the snapshot property enables a snapshot
    of this blog object at each edition by Terraform execution.


    However, there is still one more piece of configuration information to be provided
    to Terraform so that it can connect and have permissions on the storage account.
    This information is the access key, which is a private authentication and authorization
    key on the storage account. To provide the storage key to Terraform, as with the
    Azure SP information, set an ARM_STORAGE_KEY environment variable with the storage
    account access key value.


    The following is a screenshot of the Azure storage access key:


    ![](img/d3344b39c888aab0b832625465f837c9_86_0.png)


    Figure 2.23 – The Azure storage access key


    > Important Note Terraform supports other types of authentications on the storage
    account such as the use of a SAS token or by using an SP. For more information
    on how to configure Terraform for an azurerm remote backend, please refer to the
    documentation at https://www.terraform.io/docs/ backends/types/azurerm.html.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '3. Finally, once the Terraform configuration is complete, Terraform can be
    run with this new remote backend. It is during `init` that Terraform initializes
    the context of the state file. By default, the `init` command remains unchanged
    with `terraform init`.


    However, if multiple Terraform states are used to manage multiple environments,
    it''s possible to create several remote backend configurations with the simplified
    code in the `.tf` file:


    ```

    terraform {

    backend "azurerm" {}

    }

    ```


    Then, create several `backend.tfvars` files that only contain the properties of
    the backends.


    These `backend` properties are the storage account name, the name of the blob
    container, and the blob name of the state file:


    ```

    storage_account_name = "storageremotetf"

    container_name = "tfbackends"

    key = "myappli.tfstate"

    snapshot = true

    ```


    In this scenario, when executing the `init` command, we can specify the `backend.tfvars`
    file to use with the following command:


    ```

    terraform init -backend-config="backend.tfvars"

    ```


    The `-backend-config` argument is the path to the backend configuration file.


    Personally, I prefer this way of doing things as it allows me to decouple the
    code by externalizing the values of the backend properties for better readability
    of the code.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# # So, here is the execution of Terraform:


    ![](img/d3344b39c888aab0b832625465f837c9_88_0.png)


    Figure 2.24 – The terraform init command with backend configuration


    In this execution, we can view the export of the ARM_ACCESS_KEY environment variable,
    along with the Terraform init command that determines the backend configuration
    with the -backend-config option.


    With this remote backend, the state file will no longer be stored locally but
    on a storage account, which is a shared space. Therefore, it can be used at the
    same time by several users. At the same time, this storage account offers security
    to protect the sensitive data of the state file and the possibility of any backups
    or restorations of the state files, which are both essential and critical elements
    of Terraform, too.


    > > **Note**

    > >

    > > The entire source code of this chapter is available at `https://github. com/PacktPublishing/Learning-DevOps-Second-
    Edition/tree/main/CHAP02`, and the final Terraform code is located inside the
    `terraform_vars_interp` folder.'
  merge: -1
