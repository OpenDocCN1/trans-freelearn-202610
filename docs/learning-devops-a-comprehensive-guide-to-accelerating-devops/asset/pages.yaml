- pgno: 367
  md: '# # Creating a collection


    In Postman, any request that we test must be added to a directory called `Collection`,
    which provides storage for requests and allows for better organization.


    We will, therefore, create a `DemoBook` collection that will contain the requests
    to the demo API, and for this, we will perform the following tasks:


    +   1. In Postman, in the left-hand panel, click on the **Collections | +** button.

    +   2. Once the tab opens, we will enter the name `DemoBook`. These steps for
    creating a new collection are illustrated in the following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_367_0.png)


    Figure 11.3 – Postman collection creation


    So, we have a `Demobook` collection that appears in the left-hand panel of Postman.


    This collection is also synchronized with our Postman web account, and we can
    access it at `https://web.postman.co/me/collections`.


    This collection will allow us to organize the requests of our API tests, and it
    is also possible to modify its properties in order to apply a certain configuration
    to all the requests that will be included in this collection.


    These properties include request authentication, tests to be performed before
    and after requests, and variables common to all requests in this collection.


    To modify the settings and properties of this collection, perform the following
    actions:


    +   1. Click on the ... button of the context menu of the collection.

    +   2. Choose the **Edit** option, and the edit form appears, in which we can
    change all the settings that will apply to the requests in this collection.

    +   3. Switch between all configuration tabs for the edit authorization, scripts,
    tests, or variables options.'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# # Creating our first request


    In Postman, the object that contains the properties of the API to be tested is
    called a **request**.


    This request contains the configuration of the API itself, but it also contains
    the tests that are to be performed to check that it is functioning properly.


    The main parameters of a request are as follows:


    +   - The URL of the API

    +   - Its method: GET/POST/DELETE/PATCH

    +   - Its authentication properties

    +   - Its querystring keys and its body request

    +   - The tests that are to be performed before or after execution of the API


    The following screenshot shows the steps that are taken to modify the properties
    of a collection:


    So, we have discussed the procedure that is followed in order to create a collection
    that is the first Postman artifact, and this will allow us to organize our API
    test requests.


    We will now create a request that will call and test the proper functioning of
    our demo API.


    ![](img/d3344b39c888aab0b832625465f837c9_368_0.png)'
  merge: -1
  img_proc: true
