    Our Packer template is correct in its syntax, so we can launch Packer to generate

    our image.


    # Running Packer to generate our VM image


    To generate our image with Packer, we will execute Packer with the `build` command

    on the template file as follows:


    ```

    `packer build azure_linux.json`

    ```'
