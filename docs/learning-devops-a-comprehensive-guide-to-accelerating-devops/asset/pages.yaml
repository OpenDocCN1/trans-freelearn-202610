- pgno: 433
  md: '# # 14 Security in the DevOps Process with DevSecOps


    So far in this book, we have discussed in detail the **development-operations
    (DevOps)** culture as well as the DevOps tools that will facilitate communication
    and collaboration between developers and operations people (**information technology-operations**,
    or **ITOps**).


    However, in this union, we have noticed that a very important aspect is often
    missing, which is security. Indeed, **continuous integration/continuous deployment
    (CI/CD)** pipelines and **infrastructure as code (IaC)** allow faster deployment
    of infrastructure and applications, but the problem is that to deploy faster,
    we do not include security teams, which causes the following:


    +   - Security teams block or slow down deployments and therefore lead to longer
    deployment cycles.


    +   - Security problems are detected very late in the infrastructure and in applications.'
  merge: -1
  img_proc: true
- pgno: 434
  md: 'This is why, for some time now, security has been included in the DevOps culture
    by becoming a **development-security-operations (DevSecOps)** culture more broadly.
    There is nothing outside the ambit of security. Since we are developing at rapid
    speeds, it makes ample sense to make security part of the process rather than
    outside it.


    The DevSecOps culture or approach is, therefore, the union of developers and operations
    with the integration of security as early as possible in the implementation and
    design of projects. The DevSecOps approach is also the automation of compliance
    and security verification processes in CI/CD pipelines, to guarantee constant
    security and not slow down application deployment cycles.


    Today, the DevOps culture must absolutely integrate security teams but also all
    security processes, whether on tools, infrastructure, or applications. This is
    to provide not only better quality but also more secure applications.


    In this chapter, we''ll focus on the DevSecOps approach. First, we''ll see how
    to test the compliance of an Azure infrastructure using InSpec from Chef. Then,
    we''ll learn how to protect all infrastructure and application secrets with Vault
    from HashiCorp.


    This chapter will cover the following topics:


    +   - Testing Azure infrastructure compliance with Chef InSpec

    +   - Keeping sensitive data safe with HashiCorp Vault


    # ## Technical requirements


    In this chapter, we''ll see the use of InSpec, which requires **Ruby** version
    2.4 or later to be installed on the local machine. To install Ruby according to
    your specific **operating system** (OS), read this documentation: `https://www.ruby-lang.org/en/documentation/installation/`.


    In the _Keeping sensitive data safe with HashiCorp Vault_ section, we''ll discuss
    the integration between Vault and Terraform without looking into the details of
    Terraform, so I suggest you first read _Chapter 2, Provisioning Cloud Infrastructure
    with Terraform_.


    The complete source code for this chapter is available here:


    `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP14`


    Check out the following video to see the Code in Action:


    `https://bit.ly/3In9kb2`'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# # Testing Azure infrastructure compliance with Chef InSpec


    One of the important practices of DevOps culture is IaC, detailed in _Chapter
    1, The DevOps Culture and Infrastructure as Code Practices_, which consists of
    coding the configuration of an infrastructure and then being automatically deployed
    via CI/CD pipelines. IaC allows cloud infrastructure to be deployed and provisioned
    very quickly, but the question that often arises is: _Does the automatically provisioned
    infrastructure meet functional compliance and security requirements?_


    To answer this question, we''ll have to write and automate infrastructure tests
    that will verify the following:


    +   - The infrastructure deployed corresponds well to the application and enterprise
    architecture specifications.

    +   - The company''s security policies are properly applied to the infrastructure.


    These tests can be written in any scripting language that can interact with our
    cloud provider, and if we have an Azure subscription, we can use—for example—the
    Azure **command-line interface (CLI)** or Azure PowerShell commands to code the
    tests of our Azure resources. Also, if we use PowerShell, we can use **Pester**
    (`https://pester.dev/docs/quick-start/#what-is-pester`), which is a library that
    allows us to perform PowerShell tests and, combined with Azure PowerShell, allows
    us to perform infrastructure compliance tests.


    > > **Note**

    > > To get an example of how to use Pester to test an Azure infrastructure, I
    suggest you read this article: `https://dzone.com/articles/azure-security-audits-with-pester`.
    Also, have a look at this blog post: `https://dev.to/omiosec/unit-testing-in-powershell-introduction-to-pester-1de7`.


    The problem with these scripting tools is that they require a lot of code to be
    written. Also, these tools are dedicated to a specified cloud provider, and they
    require learning a new scripting language.


    One of the IaC tools is **InSpec** (`https://www.inspec.io/`), which performs
    infrastructure compliance tests.


    In this section, we''ll see in detail the use of InSpec to test the compliance
    of Azure infrastructure and, to start with its implementation, I will provide
    you with an overview of InSpec.'
