- pgno: 190
  md: '# # Git configuration


    Git configuration requires us to configure our username and email, which will
    be used during code commit. To perform this configuration, we execute the following
    commands in a Terminal—either the one that is native to your **operating system
    (OS)** or Git Bash for Windows:


    ```

    ```

    git config --global user.name "<your username>"

    git config --global user.email "<your email>"

    ```

    ```


    Then, we can check the configuration values by executing the following command:


    ```

    ```

    git config --global --list

    ```

    ```


    Refer to the following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_190_0.png)


    Figure 6.19 – Git configuration


    Git is now configured and ready to use, but before using it, we will provide an
    overview of its vocabulary.


    # # Useful Git vocabulary


    Git is a tool that is very rich in objects and terminology and has its own concepts.
    Before using it, it is important to have some knowledge of its artifacts and the
    terms that compose it. Here is a brief list of this vocabulary:


    +   • **Repository**: A repository is the basic element of Git; it is the storage
    space where the sources are tracked and versioned. There are **remote repositories**
    that centralize a team’s code and allow team collaboration. There is also the
    **local repository**, which is a copy of the local repository on the local machine.


    +   • **Clone**: Cloning is the act of making a local copy of a remote repository.


    +   • **Commit**: A commit is a change made to one or more files, and the change
    is saved to the local repository. Each commit is unique and is identified by a
    unique number called SHA-1, by which code changes can be tracked.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '+   - **Branch**: The code that is in the repository is stored by default in
    a `master` branch. A branch can create other branches that will be a replica of
    the master on which developers make changes, and that will allow us to work in
    isolation without affecting the master branch. At any time, we can merge one branch
    with another.

    +   - **Merge**: This is an action that consists of merging the code of one branch
    with another.

    +   - **Checkout**: This is an action that allows us to switch from one branch
    to another.

    +   - **Fetch**: This is an action of retrieving the code from the remote repository
    without merging it with the local repository.

    +   - **Pull**: This is an action that consists of updating your local repository
    from the remote repository. A pull is equivalent to a fetch and merge operation.

    +   - **Push**: A push is the reverse action of a pull—it allows us to update
    the remote repository from the local repository.

    +   - **Pull request (PR)**: A PR is a Git feature (initiated by GitHub) that
    provides a **graphical user interface (GUI)** client or web interface for discussing
    proposed changes, between teams’ users, before integrating them into the main
    branch. If you want more information about PRs, read the GitHub documentation
    at `https://docs.github.com/en/github/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests`.


    These are the concepts to know when using Git and its workflow. Of course, this
    list is not exhaustive, and there are other important terms and notions; we can
    find information on several sites. Here is a small list:


    +   - **GitHub vocabulary**: `https://help.github.com/en/articles/github-glossary`

    +   - **Atlassian glossary**: `https://www.atlassian.com/git/glossary/terminology`

    +   - **Linux Academy**: `https://linuxacademy.com/blog/linux/git-terms-explained/`


    With these concepts explained, we can now see how to use Git with its command
    lines.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# # Git command lines


    With everything we''ve seen so far on Git, we can now start manipulating it. The
    best way to do so is to first learn to use Git on the command line; then, once
    the process is assimilated, we can use the graphical tools better.


    Here is a presentation of the main Git command lines that are now part of (or
    should be part of) developers'' daily lives. We will see their application in
    practice in the next section, _Understanding the Git process and Gitflow pattern_.


    The first command is the one that allows us to retrieve code from a remote repository.


    # ## Retrieving a remote repository


    The first command line to know is the `clone` command, which makes a copy of a
    remote repository to create a local repository. The command to execute is shown
    here:


    ```

    `git clone <url of the remote repository>`

    ```


    The only mandatory parameter is the repository **Uniform Resource Locator** (URL)
    (any repository is identifiable by a unique URL). Once this command is executed,
    the content of the remote repository is downloaded to the local machine, and the
    local repository is automatically created and configured.


    # ## Initializing a local repository


    Note that `init` is the Git command that allows you to create a local repository.
    To do this in the directory that will contain your local repository, run the following
    simple command:


    ```

    `git init`

    ```


    This command creates a `.git` directory that contains all of the folders and configuration
    files of the local repository.


    # ## Configuring a local repository


    After the `init` command, the new local repository must be configured by setting
    up the linked remote repository. To make this setting, we will add `remote` with
    the following command:


    ```

    `git remote add <name> <url of the remote>`

    ```'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'The name passed as a parameter allows this remote repository to be identified
    locally; it is the equivalent of an alias. It is also possible to configure several
    remote devices on our local repository.


    # Adding a file for the next commit


    Making a commit (which we will see next) is to archive our changes in our local
    repository. When we edit files, we can choose which ones will be included in the
    next commit; it’s a staged concept. The other files not selected will be set aside
    for a later commit.


    To add files to the next commit, we execute the add command, as follows:


    ```

    git add <files path to add>

    ```


    So, for example, if we want all of the files modified at the next commit, execute
    the git add . command. We can also filter the files to be added with **regular
    expressions** (RegEx), such as `git add *.txt`.


    # Creating a commit


    A commit is a Git entity that contains a list of changes made to files and that
    have been registered in the local repository. Making a commit, therefore, consists
    of archiving changes made to files that have been previously selected with the
    add command.


    The command to create a commit is shown here:


    ```

    git commit -m "<your commit message>"

    ```


    The -m parameter corresponds to a message, or description, that we assign to this
    commit. The message is very important because we will be able to identify the
    reason for the changes in the files.


    It is also possible to commit all files modified since the last commit, without
    having to execute the add command, by executing the `git commit -a -m "<message>"`
    command.


    Once the commit is executed, the changes are archived in the local repository.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# # Updating the remote repository


    When we make commits, they are stored in the local repository, and when we are
    ready to share them with the rest of the team for validation or deployment, we
    must publish them to the remote repository. To update a remote repository from
    commits made on a local repository, a push operation is performed with this command:


    ```

    `git push <alias> <branch>`

    ```


    The alias passed as a parameter corresponds to the alias of the remote repository
    configured in the Git configuration of the local repository (done by the `git
    remote add` command).


    And the branch parameter is the branch to be updated—by default, it is the `master`
    branch.


    # # Synchronizing the local repository from the remote


    As we discussed previously, the Git command line is used to update the remote
    repository from the local repository. Now, to perform the reverse operation—that
    is, update the repository with all of the changes of the other members that have
    been pushed on the remote repository—we will perform a pull operation with this
    command:


    ```

    `git pull`

    ```


    The execution of this command leads to two operations:


    +   1. Merging the local code with the remote code.

    +   2. Committing to the local repository.


    On the other hand, if we do not want to commit—to be able to make other changes,
    for example—instead of the pull command, we must execute `fetch` with this command:


    ```

    `git fetch`

    ```


    Its execution only merges the local code from the remote code, and to archive
    it, we will have to execute `commit` to update the local repository.


    # # Managing branches


    By default, when creating a repository, the code is placed in the main branch
    called `master`. In order to be able to isolate the developments of the `master`
    branch—for example, to develop a new feature, fix a bug, or even make technical
    experiments—we can create new branches from other branches and merge them together
    when we want to merge their code.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'To create a branch from the current locally loaded branch, we execute the following
    command:


    ```

    git branch <name of the desired branch>

    ```


    To switch to another branch, we execute the following command:


    ```

    git checkout <name of the branch>

    ```


    This command changes the branch and loads the current working directory with the
    contents of that branch.


    To merge a branch to the current branch, execute the merge command, as follows:


    ```

    git merge <branch name>

    ```


    With the name of the branch, we want to merge as a parameter.


    Finally, to display a list of local branches, we execute the branch command, as
    follows:


    ```

    git branch

    ```


    Branch management is not easy to use from the command line. The graphical tools
    of Git, already mentioned, allow better visualization and management of the branches.
    We will see their uses in detail in the next section, which will deal with the
    Git process. That''s all for the usual Git command lines, although there are many
    more to handle.


    In the next section, we will put all of this into practice by applying the work
    and collaboration process with Git, and look at an overview of the Gitflow pattern.


    # # Understanding the Git process and Gitflow pattern


    So far, we have seen the fundamentals of a very powerful VCS, which is Git, with
    its installation, configuration, and some of its most common command lines. In
    this section, we will put all of this into practice with a case study that will
    show which Git process to apply throughout the life cycle of a project.


    In this case study, for remote repositories, we will use **Azure Repos** (one
    of the Azure DevOps services), which is a free Git cloud platform that can be
    used for personal or even business projects. To learn more about Azure DevOps,
    consult the documentation here: `https://azure.microsoft.com/en-us/services/devops/`.
    We will often talk about it in this book.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# # Starting with the Git process


    In this lab, we will explain the Git collaboration process with a team of two
    developers who start a new application development project.


    Here are the steps of the Git process that we will discuss in detail in this section:


    +   1. The first developer commits the code on the local repository and pushes
    it to the remote repository.


    +   2. Then, the second developer gets the pushed code from the remote repository.


    +   3. The second developer updates this code, creates a commit, and pushes the
    new version of the code to the remote repository.


    +   4. Finally, the first developer retrieves the last version of the code in
    the local repository.


    The Gitflow data flow that we''ll learn about is illustrated in the following
    diagram:


    ![](img/d3344b39c888aab0b832625465f837c9_196_0.png)


    Figure 6.20 – Git data flow'
  merge: -1
  img_proc: true
