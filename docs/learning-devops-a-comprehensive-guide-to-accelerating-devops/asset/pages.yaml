- pgno: 17
  md: '# # Preface


    Today, with the evolution of technologies and ever-increasing competition, companies
    are facing a real challenge to design and deliver products faster – all while
    maintaining user satisfaction.


    One of the solutions to this challenge is to introduce (to companies) a culture
    of collaboration between different teams, such as development and operations,
    testers, and the security team. This culture, which has already been proven and
    is called a DevOps culture, can ensure that teams and certain practices reduce
    the time to market of companies through this collaboration – with shorter application
    deployment cycles and by bringing real value to the company''s products and applications.


    Moreover, with the major shift of companies toward the cloud, application infrastructures
    are evolving and the DevOps culture will allow better scalability and performance
    of applications, thus generating a financial gain for companies.


    If you want to learn more about the DevOps culture and apply its practices to
    your projects, this book will introduce the basics of DevOps practices through
    different tools and labs.


    In this book, we will discuss the fundamentals of the DevOps culture and practices,
    and then we will examine different labs used for the implementation of DevOps
    practices, such as IaC, using Git and CI/CD pipelines, test automation, code analysis,
    and DevSecOps, along with the addition of security to your processes.


    A part of this book is also dedicated to the containerization of applications,
    with coverage of the simple use of Docker and the management of containers in
    Kubernetes. It includes downtime reduction topics during deployment and DevOps
    practices on open source projects.


    This book ends with a chapter dedicated to some good DevOps practices that can
    be implemented throughout the life cycle of your projects.


    In this second edition, all tools are upgraded and we will learn about Vagrant
    from HashiCorp and more on Kubernetes deployment.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'The book aims to guide you through the step-by-step implementation of DevOps
    practices using different tools that are mostly open source or are leaders in
    the market.


    In writing this book, my goal is to share my daily experience with you; I hope
    that it will be useful for you and be applied to your projects.


    # # Who this book is for


    This book is for anyone who wants to start implementing DevOps practices. No specific
    knowledge of development or system operations is required.


    # # What this book covers


    Chapter 1, The DevOps Culture and Infrastructure as Code Practices, explains the
    objectives of the DevOps culture and details the different DevOps practices –
    IaC and CI/CD pipelines – that will be seen throughout this book.


    Chapter 2, Provisioning Cloud Infrastructure with Terraform, details provisioning
    cloud infrastructure with IaC using Terraform, including its installation, its
    command line, its life cycle, practical usage for provisioning a sample of Azure
    infrastructure, and the protection of Terraform state files with remote backends.


    Chapter 3, Using Ansible for Configuring IaaS Infrastructure, concerns the configuration
    of VMs with Ansible, including Ansible''s installation, command lines, setting
    up roles for an inventory and a playbook, its use in configuring VMs in Azure,
    data protection with Ansible Vault, and the use of a dynamic inventory.


    Chapter 4, Optimizing Infrastructure Deployment with Packer, covers the use of
    Packer to create VM images, including its installation and how it is used for
    creating images in Azure.


    Chapter 5, Authoring the Development Environment with Vagrant, explains how to
    build a local development environment using IaC and Vagrant.


    Chapter 6, Managing Your Source Code with Git, explores the use of Git, including
    its installation, its principal command lines, its workflow, an overview of the
    branch system, and an example of a workflow with GitFlow.


    Chapter 7, Continuous Integration and Continuous Delivery, shows the creation
    of an end-to-end CI/CD pipeline using three different tools: Jenkins, GitLab CI,
    and Azure Pipelines. For each of these tools, we will explain their characteristics
    in detail.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Chapter 8, Deploying Infrastructure as Code with a CI/CD Pipeline, discusses
    the usage of CI/CD pipelines with Azure Pipelines to automatically execute Packer,
    Terraform, and Ansible.


    Chapter 9, Containerizing Your Application with Docker, covers the use of Docker,
    including its local installation, an overview of the Docker Hub registry, writing
    a Dockerfile, and a demonstration of how it can be used. An example of an application
    will be containerized, executed locally, and then deployed in an Azure container
    instance via a CI/CD pipeline.


    Chapter 10, Managing Containers Effectively with Kubernetes, explains the basic
    use of Kubernetes, including its local installation and application deployment,
    and then an example of Kubernetes managed with Azure Kubernetes Services.


    Chapter 11, Testing APIs with Postman, details the use of Postman to test an example
    of an API, including its local use and automation in a CI/CD pipeline with Newman
    and Azure Pipelines.


    Chapter 12, Static Code Analysis with SonarQube, explains the use of SonarQube
    to analyze static code in an application, including its installation, real-time
    analysis with the SonarLint tool, and the integration of SonarQube into a CI pipeline
    in Azure Pipelines.


    Chapter 13, Security and Performance Tests, discusses the security and performance
    of web applications, including demonstrations of how to use the ZAP tool to test
    OWASP rules and Postman to test API performance.


    Chapter 14, Security in the DevOps Process with DevSecOps, explains how to use
    security integration in the DevOps process through testing compliance of the infrastructure
    with InSpec, and the usage of Vault for protecting sensitive data.


    Chapter 15, Reducing Deployment Downtime, presents the reduction of deployment
    downtime with Terraform, the concepts and patterns of blue-green deployment, and
    how to apply them in Azure. Significant focus is also given to the use of feature
    flags within an application.


    Chapter 16, DevOps for Open Source Projects, is dedicated to open source. It details
    the tools, processes, and practices for open source projects with collaboration
    in GitHub, pull requests, changelog files, binary sharing in GitHub releases,
    and an end-to-end example of a CI pipeline in Travis CI and in GitHub Actions.
    Open source code analysis and security are also discussed with SonarCloud and
    WhiteSource Bolt.


    Chapter 17, DevOps Best Practices, reviews a DevOps list of good practices regarding
    automation, IaC, CI/CD pipelines, testing, security, monitoring, and project management.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# # To get the most out of this book


    No development knowledge is required to understand this book. The only languages
    you will see are declarative languages such as JSON or YAML. In addition to this,
    no specific IDE is required. If you do not have one, you can use Visual Studio
    Code, which is free and cross-platform. It is available here: `https://code.visualstudio.com/`.


    The cloud provider that serves as an example in this book is Microsoft Azure.
    If you don''t have a subscription, you can create a free account here: `https://azure.microsoft.com/en-us/free/`.


    As regards the operating systems you will need, there are no real prerequisites.
    Most of the tools we will use are cross-platform and compatible with Windows,
    Linux, and macOS. Their installations will be detailed in their respective chapters.


    | Software/hardware covered in the book | Operating system requirements |

    |---------------------------------------|-------------------------------|

    | Terraform                             | Windows, macOS, or Linux      |

    | Ansible                               | Linux or macOS                |

    | Packer                                | Windows, macOS, or Linux      |

    | Vagrant                               | Windows, macOS, or Linux      |

    | Docker                                | Windows, macOS, or Linux      |

    | Azure CLI                             | Windows, macOS, or Linux      |

    | Helm                                  | Windows, macOS, or Linux      |

    | Postman                               | Windows, macOS, or Linux      |

    | SonarLint                             | Windows, macOS, or Linux      |

    | Java Runtime                          | Windows, macOS, or Linux      |


    If you are using the digital version of this book, we advise you to type the code
    yourself or access the code from the book''s GitHub repository (a link is available
    in the next section). Doing so will help you avoid any potential errors related
    to the copying and pasting of code.


    # # Download the example code files


    You can download the example code files for this book from GitHub at `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition`.
    If there''s an update to the code, it will be updated in the GitHub repository.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'We also have other code bundles from our rich catalog of books and videos available
    at

    https://github.com/PacktPublishing/. Check them out!


    # # Code in Action


    The Code in Action videos for this book can be viewed at https://bit.ly/36xzV7u.


    # # Download the color images


    We also provide a PDF file that has color images of the screenshots and diagrams
    used

    in this book. You can download it here: https://static.packt-cdn.com/

    downloads/9781801818964_ColorImages.pdf.


    # # Conventions used


    There are a number of text conventions used throughout this book.


    Code in text: Indicates code words in text, database table names, folder names,

    filenames, file extensions, pathnames, dummy URLs, user input, and Twitter handles.

    Here is an example: "Navigate to the folder in which we created the Vagrantfile
    file."


    A block of code is set as follows:


    ```

    pool:

    vmImage: ubuntu-latest

    steps:

    - task: DotNetCoreCLI@2

    displayName: "Restore"

    inputs:

    ```


    When we wish to draw your attention to a particular part of a code block, the
    relevant

    lines or items are set in bold:


    ```

    [ inputs:

    command: ''test''

    projects: ''**/tests/*.csproj''

    arguments: ''--configuration Release''

    - task: DotNetCoreCLI@2

    ```'
