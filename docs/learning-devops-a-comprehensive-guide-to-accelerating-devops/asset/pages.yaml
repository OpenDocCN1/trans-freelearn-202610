    # ## Installing SonarQube on Kubernetes


    For installing SonarQube on a Kubernetes cluster, we will use the helm-chart package
    provided here: https://github.com/SonarSource/helm-chart-sonarqube/ tree/master/charts/sonarqube.


    Before installing SonarQube on Kubernetes, it’s important to read about the requirements
    here: https://docs.sonarqube.org/latest/setup/sonarqube-on- kubernetes/.


    For installing SonarQube on Kubernetes, run the following script:


    ```

    ```

    helm repo add sonarqube https://SonarSource.github.io/helm- chart-sonarqube

    helm repo update

    kubectl create namespace sonarqube

    helm upgrade --install -n sonarqube sonarqube/sonarqube

    ```

    ```


    The first line of this script adds the SonarQube Helm registry locally.


    The second line updates the index of this registry.


    Then, the script creates the sonarqube namespace.


    Finally, the last line installs the sonarqube Helm chart.'
