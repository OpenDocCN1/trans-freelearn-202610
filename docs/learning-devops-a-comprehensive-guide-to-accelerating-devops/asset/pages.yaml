    \ list of available Azure resources, refer to the InSpec documentation for the\
    \ InSpec Azure resource pack:\n> https://www.inspec.io/docs/reference/\n> resources/#azure-resources\n\
    \nAfter generating our directories that contain the tests and profile file updates,\
    \ we’ll write our infrastructure compliance tests.\n\n# Writing compliance InSpec\
    \ tests\n\nTo answer our example specification, we’ll write tests that will verify\
    \ our provisioned infrastructure contains a resource group, VM, and subnet.\n\n\
    All of the tests we’ll be drafting are located in the controls folder and are\
    \ written in a Ruby file (.rb) with very simple code that’s human-readable.\n\n\
    To begin, we’ll write a test that checks the existence of the resource group,\
    \ and for this, we’ll delete the example.rb example file in the controls folder,\
    \ which is an example of the tests provided in the test templates, and create\
    \ a new file named resourcegroup. rb that contains the following code content:\n\
    \n```\ncontrol 'rg' do\n describe azure_resource_groups do #call the azurerm_resource_\n\
    \ groups of Azure Resource Pack\n its('names') { should include 'bookRg' } #test\
    \ assert\n end\nend\n```"
