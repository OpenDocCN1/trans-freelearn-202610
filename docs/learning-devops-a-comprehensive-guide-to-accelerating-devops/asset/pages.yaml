- pgno: 426
  md: '# # The performance of an application is determined by metrics such as the
    following:


    +   - Its response times

    +   - What resources it uses (CPU, RAM, and network)

    +   - The error rates

    +   - The number of requests per second


    Performance tests are divided into several types of tests, such as load tests,
    stress tests, and scalability tests.


    Many tools are available to perform performance tests. The following article lists
    the 15 best ones: https://www.softwaretestinghelp.com/performance-testing-tools-load-testing-tools/.
    Among the tools we’ve already seen in this book, Postman is not a dedicated tool
    for performance testing, especially since it focuses mainly on APIs and not on
    monolithic web applications. However, Postman can provide a good indication of
    the performance of our API.


    We discussed its usage in detail for API testing in Chapter 11, Testing APIs with
    Postman. When you’re executing a request that tests an API in a unitary way, Postman
    provides the execution time of that API, as shown in the following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_426_0.png)


    Figure 13.5 – Postman performance test'
  merge: -1
