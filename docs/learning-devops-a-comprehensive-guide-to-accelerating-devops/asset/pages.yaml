- pgno: 317
  md: "Another use case of Docker is to be able to run command-line tools that are\
    \ in Docker containers.\n\nTo illustrate this, we will run a sample of Terraform\
    \ configuration using the **Terraform** binary, which is not located on a local\
    \ machine but in a Docker container.\n\nThe Terraform configuration that we use\
    \ in this section is the same as that in the previous section, _Deploying a container\
    \ to ACI with a CI/CD pipeline_, and the source code is available here: `https://github.com/PacktPublishing/Learning-DevOps-\
    \ Second-Edition/tree/main/CHAP09/terraform-aci`.\n\nThe goal of this lab is to\
    \ run this Terraform configuration using the Terraform binary that is in the Docker\
    \ container. To run this lab, following these steps:\n\n+   1. First we pull the\
    \ official Terraform image from the Docker Hub with this command:\n+   \n+   `docker\
    \ pull hashicorp/terraform`\n\nThe following screenshot shows the execution of\
    \ this command:\n\n![](img/d3344b39c888aab0b832625465f837c9_317_0.png)\n\nFigure\
    \ 9.35 - docker pull command to pull Terraform image\n\n+   2. Then, inside the\
    \ folder that contains the Terraform configuration, we will run the Terraform\
    \ workflow using the following three `docker run` commands:\n+   \n+   First,\
    \ we run the `terraform init` command, as follows:\n+   \n+   `docker run -i -t\
    \ -v ${PWD}:/usr/tf -w /usr/tf ' --env ARM_CLIENT_ID=\"<azure clientId>\" ' --env\
    \ ARM_CLIENT_SECRET=\"<azure client secret>\" ' --env ARM_SUBSCRIPTION_ID=\"<azure\
    \ subscription>\" ' --env ARM_TENANT_ID=\"azure tenant id\" ' --env ARM_ACCESS_KEY=\"\
    azure access key \" ' hashicorp/terraform:latest ' init -backend-config=\"backend.tfvars\"\
    `\n+   \n+   In this `docker run` command, we use the following arguments:\n+\
    \   \n+   - `-v` to create a volume for mounting the current local directory that\
    \ contains the Terraform code inside the `/usr/tf` directory on the container"
  merge: -1
  img_proc: true
- pgno: 318
  md: '+   - -w to specify the working directory

    +   - --env with the environment variable necessary for Terraform to authenticate
    to Azure

    +   - Hashicorp/terraform:latest, which is the name of the image

    +   - init -backend-config="backend.tfvars", which is the argument for the Terraform
    command to run


    Now, we run the terraform plan command, as follows:


    ```

    docker run -i -t -v ${PWD}:/usr/tf -w /usr/tf ''

    --env ARM_CLIENT_ID="<azure clientId>" ''

    --env ARM_CLIENT_SECRET="<azure client secret>" ''

    --env ARM_SUBSCRIPTION_ID="<azure subscription>" ''

    --env ARM_TENANT_ID="azure tenant id" ''

    --env ARM_ACCESS_KEY="azure access key " ''

    hashicorp/terraform:latest ''

    plan -var dockerhub-username="<docker hub username>" -out plan.tfplan

    ```


    In this preceding command, we use the same argument, with the plan command for
    Terraform.


    Finally, we run the terraform apply command, as follows:


    ```

    docker run -i -t -v ${PWD}:/usr/tf -w /usr/tf ''

    --env ARM_CLIENT_ID="<azure clientId>" ''

    --env ARM_CLIENT_SECRET="<azure client secret>" ''

    --env ARM_SUBSCRIPTION_ID="<azure subscription>" ''

    --env ARM_TENANT_ID="azure tenant id" ''

    --env ARM_ACCESS_KEY="azure access key " ''

    hashicorp/terraform:latest ''

    apply plan.tfplan

    ```


    We have just studied a basic example of using a tool (here with Terraform) that
    runs in a Docker container. This use of Docker has the following advantages:


    +   - It''s not necessary to install these tools on its local machine; the installation
    process is done by the tool editor in the Docker image.

    +   - You can run several versions of the same tool.'
