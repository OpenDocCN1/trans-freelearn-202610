    # # Creating an Ansible inventory


    The inventory contains the list of hosts that Ansible will perform administration
    and

    configuration actions on.


    There are two types of inventories:


    +   • **Static inventory**: Hosts are listed in a text file in INI (or YAML) format;
    this is the

    +   basic mode of Ansible inventory. The static inventory is used in cases where
    we

    +   know the host addresses (IP or FQDN).


    +   • **Dynamic inventory**: The list of hosts is dynamically generated by an
    external

    +   script (for example, with a Python script). The dynamic inventory is used
    if we do

    +   not have the addresses of the hosts, for example, as with an infrastructure
    that is

    +   composed of on-demand environments.


    In this section, we will learn how to create a static inventory in `init` format,
    starting with

    a basic example, and then we will look at the groups and host configuration.


    Let’s start by learning how to create a static inventory file.


    # # The inventory file


    For Ansible to configure hosts when running the playbook, it needs to have a file
    that

    contains the list of hosts; that is, the list of IP or **Fully Qualified Domain
    Name (FQDN)**

    addresses of the target machines. This list of hosts is noted in a static file
    called the

    **inventory file**.


    By default, Ansible contains an inventory file that’s created while it’s being
    installed; this

    file is `/etc/ansible/hosts` and it contains several inventory configurations
    examples.

    In our case, we will manually create and fill this file in a directory of our
    choice, such as

    `devopsansible`.


    Let’s do this step by step:


    +   1. First, we must create the directory with the following basic command:


    ```

    ```

    mkdir devopsansible

    cd devopsansible

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 101
  md: '2. Now, let’s create a file named myinventory (without an extension) where
    we will write the IP addresses or the FQDN of the targets hosts, as shown in the
    following example:


    ```

    192.10.14.10

    mywebserver.entreprise.com

    localhost

    ```


    When Ansible is executed based on this inventory, it will execute all of the requested
    actions (playbook) on all the hosts mentioned in this inventory.


    > Important Note

    > For more information about the inventory file, read the documentation at https://docs.ansible.com/ansible/latest/user_guide/intro_inventory.html.


    However, when you’re using Ansible in an enterprise, the same Ansible code (or
    playbook) contains the configuration actions that are performed for all of the
    VMs of an application. Since these VMs have different roles within the application,
    such as an application that consists of one (or more) web server and one database
    server, we must divide our inventory to separate the VMs by functional roles.


    To group VMs by role in the inventory, we will organize our VMs into groups that
    will be noted between [], which gives us the following inventory:


    ```

    [webserver]

    192.10.20.31

    mywebserver.exemple.com

    [database]

    192.20.34.20

    ```


    In this example, we have defined two groups, webserver and database. All the hosts
    are distributed into these groups.


    As another example, we can also group the hosts by environments with this sample
    inventory:


    ```

    [dev]

    192.10.20.31

    192.10.20.32

    [qa]

    ```'
  merge: -1
  img_proc: true
- pgno: 102
  md: '```

    192.20.34.20

    192.20.34.21

    [prod]

    192.10.12.10

    192.10.12.11

    ```


    Later in this chapter, we will learn how these groups will be used in playbook
    writing.


    Now, let’s learn how to complete our inventory by configuring hosts.


    # # Configuring hosts in the inventory


    As we have seen, the entire Ansible configuration is in the `ansible.cfg` file.
    However,

    this configuration is generic and applies to all Ansible executions, as well as
    connectivity

    to hosts.


    However, when using Ansible to configure VMs from different environments or roles

    with different permissions, it is important to have different connectivity configurations,

    such as different admin users and SSL keys per environment. For this reason, it
    is possible

    to override the default Ansible configuration in the inventory file by configuring
    specific

    parameters per host, as defined in this inventory.


    The main configuration parameters that can be overridden are as follows:


    +   - `ansible_user`: This is the user who connects to the remote host.

    +   - `ansible_port`: It is possible to change the default value of the SSH port.

    +   - `ansible_host`: This is an alias for the host.

    +   - `ansible_connection`: This is the type of connection to the remote host
    and can

    +   be Paramiko, SSH, or local.

    +   - `ansible_private_key_file`: This is the private key that’s used to connect
    to

    +   the remote host.


    > > **Important Note**

    > > The complete list of parameters is available in the following documentation:

    > > https://docs.ansible.com/ansible/latest/user_

    > > guide/intro_inventory.html#list-of-behavioral-

    > > inventory-parameters.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# # Testing the inventory


    Once the inventory has been written, it is possible to test whether all of the
    hosts mentioned can be accessed from Ansible. To do this, we can execute the following
    command:


    ```

    ```

    ansible -i inventory all -u demobook -m ping

    ```

    ```


    The `-i` argument is the path of the inventory file, the `-u` argument corresponds
    to the remote username that''s used to connect to the remote machine, and `-m`
    is the command to execute. Here, we execute the `ping` command on all the machines
    in the inventory.


    Here is an example of an inventory where we have configured the connection of
    the hosts:


    ```

    ```

    [webserver]

    webserver1 ansible_host=192.10.20.31 ansible_port=2222

    webserver2 ansible_host=192.10.20.31 ansible_port=2222

    [database]

    database1 ansible_host=192.20.34.20

    ansible_user=databaseuser

    database2 ansible_host=192.20.34.21

    ansible_user=databaseuser

    [dev]

    webserver1

    database1

    [qa]

    webserver2

    database2

    ```

    ```


    The following can be seen in this inventory example:


    +   - The connection information has been specified beside each host.

    +   - The alias implementation (such as `webserver1` and `webserver2`) is used
    in another group (such as the `qa` group in this example).


    Having implementing an Ansible inventory, we will now learn how to test this inventory.'
  merge: -1
  img_proc: true
