- pgno: 319
  md: 'In the next section, we will discuss the use of Docker Compose, which allows
    us to mount several Docker images to the same group of containers.


    # # Getting started with Docker Compose


    So far in this chapter, we have studied how to write a Dockerfile, create a Docker
    image, and run a container of this Docker image.


    Today, applications are not working in standalone mode; they need other dependencies
    such as a service (for example, another application; an **application programming
    interface** (API)) or a database. This implies that for these applications, the
    Docker workflow is more consistent. Indeed, when we work with several Docker applications,
    we have to execute for each of them the `docker build` and `docker run` commands,
    which requires some effort.


    Docker Compose is a more advanced Docker tool that allows us to deploy several
    Docker containers at the same time in the same deployment cycle. Docker Compose
    also allows us to manage elements that are common to these Docker containers,
    such as data volumes and network configuration.


    > > **Note**

    > > For more details about Docker Compose, read the official documentation here:

    > > `https://docs.docker.com/compose`


    In Docker Compose, this configuration—which contains the Docker images, the volumes,
    and the network that constitutes the artifacts of the same application—is done
    simply in a configuration file in **YAML Ain''t Markup Language** (**YAML**) format.


    In this section, we will learn about the basic mode installation of Docker Compose.
    Then, we will write a simple Docker Compose configuration file to run an nginx
    application with a MySQL database in the same context. Finally, we will execute
    this Docker Compose configuration file and view the result in Docker containers.


    # # Installing Docker Compose


    On Windows or macOS, the **Docker Compose** binary is already installed with Docker
    Desktop.


    Follow this documentation to install the Docker Compose binary on Linux: `https://
    docs.docker.com/compose/install/#install-compose-on-linux- systems`.'
  merge: -1
  img_proc: true
- pgno: 320
  md: "We can check if Docker Compose is correctly installed by running the following\
    \ command:\n\n```\n`docker-compose version`\n```\n\nThe following screenshot shows\
    \ the result of this command:\n\n![](img/d3344b39c888aab0b832625465f837c9_320_0.png)\n\
    \nFigure 9.36 – docker-compose version command\n\nThis command displays the version\
    \ of the installed `docker-compose` binary.\n\nNow that Docker Compose is installed,\
    \ we will write the Docker Compose configuration YAML file.\n\n# # Writing the\
    \ Docker Compose configuration file\n\nFor deploying containers using Docker Compose,\
    \ we will write a configuration file to run an nginx container coupled with a\
    \ `mysql` container.\n\nFor this, we will create a new file named `docker-compose.yml`\
    \ with the following content that is in two blocks of code.\n\nThe first code\
    \ snippet, in YAML, is for creating an nginx container, as follows:\n\n```\n`version:\
    \ '3' #version of the Docker Compose YAML schema\nservices:\n  nginx:\n    image:\
    \ nginx:latest\n    container_name: nginx-container\n    ports:\n      - 8080:80`\n\
    ```\n\nIn the preceding code snippet, we start with the `services` property, which\
    \ contains a list of services (or Docker applications) to run in Docker. The first\
    \ service is the nginx service. We configure the `nginx` `docker` image to use,\
    \ the name of the container, and the exposed port, which is `8080`, for the local\
    \ access of the nginx service."
  merge: -1
  img_proc: true
- pgno: 321
  md: "# # Executing Docker Compose\n\nFor running the Docker containers described\
    \ in the YAML configuration file, we will run\nthe basic operation of Docker Compose\
    \ by executing the following command in the folder\nthat contains the `docker-compose.yml`\
    \ file:\n\n```\n`docker-compose up -d`\n```\n\n> Note\n> The `-d` option is added\
    \ for running the containers in detached mode.\n> The complete documentation for\
    \ the `docker-compose` CLI is available\n> here:\n> `https://docs.docker.com/compose/reference/`\n\
    \nThen, we add the YAML for the MySQL service with the following code:\n\n```\n\
    mysql:\n  image: mysql:5.7\n  container_name: mysql-container\n  environment:\n\
    \    MYSQL_ROOT_PASSWORD: secret\n    MYSQL_DATABASE: mydb\n    MYSQL_USER: myuser\n\
    \    MYSQL_PASSWORD: password\n```\n\nIn the preceding code snippet, we configure\
    \ the `mysql` service with the Docker image,\nthe name of the container, and the\
    \ required environment variable for configuring the\ndatabase access.\n\n> Note\n\
    > The complete source code of this file is available here:\n> `https://github.com/PacktPublishing/Learning-\n\
    > DevOps-Second-Edition/blob/main/CHAP09/docker-\n> compose/docker-compose.yml`\n\
    \nWe have just written the YAML file of the `docker-compose` configuration. Now,\
    \ we will\nrun Docker Compose to execute the containers described in this configuration."
  merge: -1
