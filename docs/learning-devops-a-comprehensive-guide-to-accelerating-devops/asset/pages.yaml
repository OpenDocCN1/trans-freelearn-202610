- pgno: 442
  md: "In this declarative code, the desired state of the resources is described and\
    \ the following actions have been taken:\n\n1. Create a control (or test) called\
    \ `test_rg`.\n2. In this control, we’ll create a method of the `describe` type,\
    \ in which we use the `azure_resource_groups` library of the Azure resource packs,\
    \ which allows us to test the existence of a resource group.\n3. In this `describe`\
    \ method, we write a test assertions that checks whether there is a `bookRg` resource\
    \ group in the Azure subscription.\n\nThen, we’ll continue to write our tests\
    \ for the VM and subnet. To do this, we manually create a `subnet.rb` file in\
    \ the `controls` directory that contains the following code:\n\n```\ncontrol \"\
    subnet\" do\n describe azure_subnet(resource_group: 'bookRg', vnet: 'book-vnet',\
    \ name: 'book-subnet') do\n it { should exist }\n its('address_prefix') { should\
    \ eq '10.0.10.0/24' }\n end\nend\n```\n\nIn this code, we use the `azurerm_subnet`\
    \ library, which allows us to test the existence of a subnet in a VNet. In this\
    \ test, we check that the `book-subnet` subnet exists in the `book-vnet` VNet\
    \ and that it has the IP range `10.0.10.0.0/24`.\n\nFinally, here, we finish with\
    \ writing the tests that allow us to check our VM with the following code in the\
    \ `vm.rb` file:\n\n```\ncontrol 'vm' do\n describe azure_virtual_machine(resource_group:\
    \ 'bookRg', name: 'bookvmn')\n do\n it { should exist }\n its('properties.location')\
    \ { should eq 'westeurope' }\n its('properties.hardwareProfile.vmSize') { should\
    \ eq 'Standard_DS1_v2' }\n its('properties.storageProfile.osDisk.osType') { should\
    \ eq 'Linux' }\n }\nend\n```"
  merge: -1
