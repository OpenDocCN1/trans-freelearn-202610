- pgno: 167
  md: 'This configuration will contain information about the VM, such as the following:


    +   - The box to use

    +   - The hardware configuration such as the RAM and CPU

    +   - The network configuration

    +   - The scripts to use to provision and configure the VM

    +   - The local folder to share with the VM


    In this section, we will learn how to create a basic Vagrant configuration file
    that creates a local VM that contains an Ansible binary already installed.


    To create a Vagrant configuration, perform the following steps:


    +   1. Create a folder called `VagrantFiles`.

    +   2. Inside this folder, open a new terminal console and run the `vagrant init`
    command with the name of the box, as follows:


    ```

    vagrant init ubuntu/bionic64

    ```


    The following screenshot shows the execution of this command:


    ![](img/d3344b39c888aab0b832625465f837c9_167_0.png)


    The preceding command creates a new Vagrantfile file with the basic configuration
    for a bionic VM with the following code:


    ```

    Vagrant.configure("2") do |config|

    config.vm.box = "ubuntu/bionic64"

    end

    ```


    Next, we will add scripts to install Ansible during the provisioning of this VM.


    +   3. In this `VagrantFiles` folder, create a new folder called `scripts` and
    then create a new file script, called `ansible.sh`, using the following content:


    ```

    apt-get update

    sudo apt-get --assume-yes install software-properties-common

    sudo apt-add-repository --yes --update ppa:ansible/ansible

    sudo apt-get --assume-yes install ansible

    ```'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 4. In the Vagrantfile file, update the configuration with the following lines:


    ```

    Vagrant.configure("2") do |config|

    config.vm.box = "ubuntu/bionic64"

    config.vm.provision "shell", path: "scripts/ansible.sh"

    end

    ```


    # 5. To test the local Ansible playbook, we can share the local directory with
    the VM by adding the following lines to the configuration file:


    ```

    Vagrant.configure("2") do |config|

    config.vm.box = "ubuntu/bionic64"

    config.vm.provision "shell", path: "scripts/ansible.sh"

    config.vm.synced_folder "C:\\<path>\\CHAP03\\devopsansible", "/learningdevops"

    end

    ```


    In the preceding configuration, we shared the local c:\\...\Chap03\\devopsansible
    folder (this is an example of a local folder) between the local machine and the
