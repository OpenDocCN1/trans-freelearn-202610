    _Chapter

    +   9, Containerizing Your Application with Docker_, we can activate the **Enable**

    +   **Kubernetes** option in **Settings** on the **Kubernetes** tab, as shown
    in the following

    +   screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_330_0.png)


    Figure 10.2 – Enabling Kubernetes in Docker Desktop'
  merge: -1
