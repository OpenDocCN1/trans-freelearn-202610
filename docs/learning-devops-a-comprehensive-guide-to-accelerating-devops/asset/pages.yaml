- pgno: 151
  md: "> > **Note**\n> >The complete documentation of the Packer build command is\
    \ available here:\n> >https://www.packer.io/docs/commands/build.html.\n\nWe have\
    \ just seen the Packer command lines to check the syntax of the JSON Packer\n\
    template and then to run Packer on a template that generates a VM image in Azure.\n\
    \nNow we will learn about the basic elements for writing Packer templates using\n\
    HCL format.\n\n# # Writing Packer templates with HCL format\n\nSince the release\
    \ of version 1.5.0 of Packer, it’s possible to write Packer templates using\n\
    HCL format, which we learned in detail in _Chapter 2, Provisioning Cloud Infrastructure\n\
    with Terraform_.\n\n> > **Note**\n> >The HCL integration in Packer is currently\
    \ in Beta, and will be preferred by\n> >HashiCorp from version 1.7.0.\n\nThe HCL\
    \ format of the template is very similar to the JSON format and it’s composed\
    \ of\n`variable`, `source`, `build`, and `provisioner` blocks. The following code\
    \ shows the\nstructure of the HCL Packer template.\n\nFor writing an HCL template,\
    \ create a file, `.pkr.hcl`, that contains all the following\ncode:\n\n```\n```\n\
    packer {\n  required_plugins\n  {\n    azure =\n    {\n      version = \">= 1.0.0\"\
    \n      source = \"github.com/hashicorp/azure\"\n    }\n  }\n}\n\nVariable \"\
    var name\"{\n```\n```"
  merge: -1
  img_proc: true
- pgno: 152
  md: "```\n...\n}\nSource \"name\" {\n...\n}\nBuild {\n    Source = []\n    Provisioner\
    \ \"\" {}\n}\n```\n\nFirst, we start with the Packer plugin configuration that\
    \ has been introduced from\nversion 1.7.0. In this block, we list all plugins\
    \ that will be used in the code.\n\n> Note\n> For more information about Packer\
    \ plugins, read the documentation at\n> https://www.packer.io/docs/plugins.\n\n\
    Then, in the `variable` block, we declare the user variables, for example Azure\n\
    credentials, VM name, VM size, or other variables. The following code shows a\
    \ sample\n`variable` block:\n\n```\nvariable \"image_folder\" {\n    default =\
    \ \"/image\"\n}\nvariable \"vm_size\" {\n    default = \"Standard_DS2_v2\"\n}\n\
    ```\n\n> Note\n> For more information and details about HCL variables, read the\n\
    > documentation at https://www.packer.io/guides/hcl/\n> variables."
  merge: -1
