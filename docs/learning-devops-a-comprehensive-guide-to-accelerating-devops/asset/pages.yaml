- pgno: 375
  md: 'For example, consider an API that returns a response in JSON format with several
    properties. In the tests of this API, it will be necessary to verify that the
    result returned is a JSON text that contains the expected properties, and even
    more so to verify the values of these properties.


    In Postman, it is possible to write tests that will ensure that the response of
    the request corresponds to the expected result in terms of return or execution
    time using the JavaScript language.


    Postman tests are written in the **Tests** tab of the request:


    ![](img/d3344b39c888aab0b832625465f837c9_375_0.png)


    Figure 11.13 – Postman Tests tab


    To test our request, we will write several tests, which are as follows:


    +   - That the return code of the request is 200

    +   - That the response time of the request is less than 400 ms

    +   - That the answer is not an empty JSON

    +   - That the return JSON response contains the `userId` property, which is equal
    to 1


    To perform these tests, we will write the code for the following in the **Tests**
    tab.


    The following code illustrates the return code of the request:


    ```

    pm.test("Status code is 200", function () {

    pm.response.to.have.status(200);

    });

    ```'
  merge: -1
  img_proc: true
- pgno: 376
  md: "The following code illustrates a response time of less than 400 ms:\n\n```\n\
