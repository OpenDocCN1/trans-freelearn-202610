- pgno: 273
  md: "Before we start using Packer, we need first to create an Azure resource group\
    \ that will\nstore the created VM image by the pipeline. In our lab, we named\
    \ this Azure resource\ngroup rg_images. The following screenshot shows the Azure\
    \ resource group:\n\n![](img/d3344b39c888aab0b832625465f837c9_273_0.png)\n\nFigure\
    \ 8.1 – The Azure resource group for the Packer image\n\nNow, we can write the\
    \ code of the pipeline, which will execute Packer command lines on\nthe Packer\
    \ template.\n\nTo do this, in the same folder as the Packer template, create a\
    \ new YAML file that will\ndescribe the steps of the pipeline, and then write\
    \ three blocks of code, as follows:\n\n+   1. The first step is to execute the\
    \ `packer init` command:\n+   \n+   ```yaml\n+   - script: packer init $(Build.SourcesDirectory)/CHAP08/\n\
    +     packer/.pkr.hcl\n+     displayName: Packer init\n+   ```\n\n+   2. The second\
    \ step is to validate the Packer template by running the `packer validate` command:\n\
    +   \n+   ```yaml\n+   - script: packer validate $(Build.SourcesDirectory)/\n\
    +     CHAP08/packer/.pkr.hcl\n+     displayName: Packer validate template\n+ \
    \  ```\n\n+   3. The last step is to build the image with Packer by running the\
    \ `packer build` command:\n+   \n+   ```yaml\n+   - script: packer build $(Build.SourcesDirectory)/CHAP08/\n\
    +     packer/.pkr.hcl\n+     displayName: Packer build template\n+     env:\n\
    +       PKR_VAR_clientid: $(PKR_VAR_clientid)\n+       PKR_VAR_clientsecret: $(PKR_VAR_clientsecret)\n\
    +       PKR_VAR_subscriptionid: $(PKR_VAR_subscriptionid)\n+       PKR_VAR_tenantid:\
    \ $(PKR_VAR_tenantid)\n+   ```"
  merge: -1
  img_proc: true
