    In the next section, we will learn how to set up and write the configuration action
    code in Ansible playbooks.


    # # Executing the first playbook


    One of the essential elements of Ansible is its playbooks because, as stipulated
    in the introduction, they contain the code of the actions or tasks that need to
    be performed to configure or administer a VM.'
