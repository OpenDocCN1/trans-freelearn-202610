    > > **Important Note**

    > > To learn more about Azure Cloud Shell, please refer to its documentation at
    `https://azure.microsoft.com/en-us/features/cloud-shell/`.


    To use it from the Azure Cloud Shell, follow these steps:


    +   1. Connect to the Azure portal by opening `https://portal.azure.com`, and
    sign in with your Azure account:


    ![](img/d3344b39c888aab0b832625465f837c9_58_0.png)


    Figure 2.4 – The Azure Sign in page'
  merge: -1
