    # # Installing Docker


    Docker’s daemon is free and very well suited to developers and small teams—it’s
    what

    we’ll use in this book.


    Docker is a cross-platform tool that can be installed on Windows, Linux, or macOS
    and

    is also natively present on some cloud providers, such as **Amazon Web Services
    (AWS)**

    and Azure.


    To operate, Docker needs the following elements:


    +   - **The Docker client**: This allows you to perform various operations on
    the

    +   command line.


    +   - **The Docker daemon**: This is Docker’s engine.


    +   - **Docker Registry**: This is a public registry (Docker Hub) or private registry
    of

    +   Docker images.


    Before installing Docker, we will first create an account on Docker Hub.


    # # Registering on Docker Hub


    Docker Hub is a public space called a **registry**, containing more than 2 million
    public

    Docker images that have been deposited by companies, communities, and even

    individual users.'
  merge: -1
  img_proc: true
