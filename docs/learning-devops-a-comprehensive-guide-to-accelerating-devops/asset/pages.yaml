- pgno: 439
  md: '+   - --scopes is the **identifier (ID)** of the subscription (or other scopes)
    in which the Azure resources will be present.

    +   - --role is the role name that the service principal will have on the specified
    resource scope.


    The execution of this preceding command returns the following three pieces of
    authentication information relating to the created service principal:


    +   - The client ID

    +   - The client secret

    +   - The tenant ID


    > Note

    > For more details on service principals, see the following documentation:

    > https://docs.microsoft.com/en-us/cli/azure/create-an-azure-service-principal-azure-cli?view=azure-cli-latest


    We’ll see how to use this authentication information when running InSpec, but
    before it is executed, we need enough knowledge to write InSpec tests. Let’s see
    how to do this.


    # Writing InSpec tests


    After installing InSpec and configuring authentication for Azure, we can start
    using InSpec. To show an example of InSpec tests, we’ll write tests that will
    check that the Azure infrastructure we provisioned with Terraform in _Chapter
    2, Provisioning Cloud Infrastructure with Terraform_, is compliant with the specifications
    of our Azure infrastructure, which must be composed of the following:


    +   - One resource group named `bookRg`

    +   - One **virtual network (VNet)** with one subnet inside it named `book-subnet`

    +   - One **virtual machine (VM)** named `bookvm`


    As a first step in writing our InSpec tests, we’ll create an InSpec profile file.'
