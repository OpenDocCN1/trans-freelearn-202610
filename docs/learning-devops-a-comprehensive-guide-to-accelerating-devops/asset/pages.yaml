    # ## Using AKS


    A production Kubernetes cluster can often be complex to install and configure.
    This type of installation requires the availability of servers, human resources
    who have the requisite skills regarding the installation and management of a Kubernetes
    cluster, and— especially—the implementation of an enhanced security policy to
    protect the applications.


    To overcome these problems, cloud providers offer managed Kubernetes cluster services.
    This is the case with Amazon with **Elastic Kubernetes Service (EKS)**, Google
    with **Google Kubernetes Engine (GKE)**, and finally, Azure with AKS. In this
    section, I propose an overview of AKS, while also highlighting the advantages
    of a managed Kubernetes cluster.'
  merge: -1
  img_proc: true
- pgno: 350
  md: "AKS is, therefore, an Azure service that allows us to create and manage a real\
    \ Kubernetes\ncluster as a managed service.\n\nThe advantage of this managed Kubernetes\
    \ cluster is that we don't have to worry about its\nhardware installation and\
    \ the management of the master part is done entirely by Azure\nwhen the nodes\
    \ are installed on **virtual machines (VMs)**.\n\nThe use of this service is free;\
    \ what is charged is the cost of the VMs on which the nodes\nare installed.\n\n\
    > **Note**\n> \n> To learn more about the benefits offered by AKS, you can read\
    \ the\n> documentation at https://docs.microsoft.com/en-us/\n> azure/aks/intro-kubernetes.\n\
    \nLet's now look at how to create an AKS service.\n\n# # Creating an AKS service\n\
    \nThe creation of an AKS cluster in Azure can be done in three different ways,\
    \ as\noutlined here:\n\n+   • **Manually, via the Azure portal**: The standard\
    \ way to create an AKS service is to do\n+   so via the Azure portal, by creating\
    \ a Kubernetes service, and then entering its basic\n+   Azure properties—that\
    \ is, the type and number of nodes desired, as shown in the\n+   following screenshot:\n\
    \n![](img/d3344b39c888aab0b832625465f837c9_350_0.png)\n\nFigure 10.24 – AKS creation\
    \ via the Azure portal"
  merge: -1
  img_proc: true
- pgno: 351
  md: "+   • **Creation via an az cli script**: You can also use an az `cli` script\
    \ to automate the creation of the AKS cluster. The script is shown here:\n+  \
    \ \n+   ```\n+   #Create the Resource group\n+   az group create --name Rg-AKS\
    \ --location westeurope\n+   #Create the AKS resource\n+   az aks create --resource-group\
    \ Rg-AKS --name demoBookAKS\n+   --node-count 2 --generate-ssh-keys --enable-addons\n\
    +   monitoring\n+   ```\n\nThe node-count property indicates the number of nodes,\
    \ and the enable-addons property enables us to monitor the AKS service.\n\n+ \
    \  • **Creation with Terraform**: It is also possible to create an AKS service\
    \ with Terraform. The complete Terraform script is available in the Azure documentation\
    \ at https://docs.microsoft.com/en-us/azure/terraform/terraform-create-k8s-cluster-with-tf-and-aks,\
    \ and to learn more about using Terraform, you can read Chapter 2, Provisioning\
    \ Cloud Infrastructure with Terraform.\n\nNow that the AKS cluster has been created,\
    \ we will be able to configure the kubeconfig file in order to connect to this\
    \ AKS cluster.\n\n# # Configuring the kubeconfig file for AKS\n\nTo configure\
    \ the kubeconfig file used by kubectl for connecting to the AKS service, we will\
    \ use the az cli tool by executing the following commands in a Terminal:\n\n```\n\
    az login\n#If you have several Azure subscriptions\naz account set --subscription\
    \ <subscription Id>\naz aks get-credentials --resource-group Rg-AKS --name\ndemoBookAKS\n\
    ```\n\nThis last command takes the resource group as the parameter, and as the\
    \ name of the created AKS cluster. The role of this command is to automatically\
    \ create a .kube\\config file and with this file configure kubectl for connection\
    \ to the AKS cluster, as shown in the following screenshot:\n\n![](img/d3344b39c888aab0b832625465f837c9_351_0.png)\n\
    \nFigure 10.25 – AKS getting credentials via az cli"
  merge: -1
  img_proc: true
- pgno: 352
