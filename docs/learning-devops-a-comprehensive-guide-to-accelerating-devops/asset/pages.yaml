- pgno: 420
  md: '# # Technical requirements


    To use ZAP, we need to install the **Java Runtime Environment (JRE)**, which is
    available at https://www.oracle.com/technetwork/java/javase/downloads/jre8-downloads-2133155.html
    (an Oracle account is required).


    In this chapter, we''ll talk about Postman, which we discussed in _Chapter 11,
    Testing APIs with Postman_.


    Check out the following video to see the Code in Action: https://bit.ly/3HbOgD0.


    # # Applying web security and penetration testing with ZAP


    Today, application security must be at the heart of companies'' concerns. As soon
    as a web application (or website) is publicly exposed on the internet, it is a
    candidate for an attack by malicious people. In addition, it is important to note
    that application security is even more important if it is used to store sensitive
    data such as bank accounts or your personal information.


    To address this problem, there''s **Open Web Application Security Project (OWASP)**
    (https://www.owasp.org/index.php/Main_Page), a worldwide organization that studies
    application security issues. The goal of this organization is to publicly highlight
    the security problems and vulnerabilities that can be encountered in an application
    system. In addition to this valuable security information, OWASP provides recommendations,
    solutions, and tools for testing and protecting applications.


    One of the important and useful projects and documents that''s provided by OWASP
    is the top 10 application security issues. This document is available at https://owasp.org/www-project-top-ten/.
    The document is very detailed and provides an explanation, examples, and a solution
    for each security issue. In this document, we can see that the top security vulnerability
    that applications are most vulnerable to is injection vulnerability, such as SQL
    injection, which consists of injecting code or requests into an application to
    collect, delete, or corrupt data from the application.


    At the time of writing, the top 10 OWASP mitigation techniques are as follows:


    +   1. Ongoing risk assessment


    +   2. Use automated as well as manual means for assessments


    +   3. Choose a strong **Web Application Firewall (WAF)**'
  merge: -1
  img_proc: true
- pgno: 421
  md: '+   4. Ensure that the web development framework and coding practices have
    inbuilt security

    +   5. Enforce **multi-factor authentication (MFA)**

    +   6. Encrypt all data

    +   7. Apply all software updates instantly

    +   8. Ensure that the web application is sanitized

    +   9. Have formal awareness initiatives

    +   10. Adhere to OWASP compliance standards


    For more details about these mitigation techniques, read the following article:
    `https://www.indusface.com/blog/owasp-top-10-mitigation-techniques/`.


    We also have another known security flaw in this document, which is **cross-site
    scripting (XSS)**. This consists of executing HTML or malicious JavaScript code
    on a user''s web browser.


    The challenge for companies is to be able to automate the security tests of their
    applications to protect them and take steps as quickly as possible when a flaw
    is discovered.


    There are many security and penetration testing tools available. A very complete
    list is available at `https://www.owasp.org/index.php/Appendix_A:_Testing_Tools`.
    Among them, we learned about SonarQube in the previous chapter, which allows you
    to analyze code to detect security vulnerabilities.


    Another tool in this list that is very interesting is **Zed Attack Proxy (ZAP)**
    (`https://www.owasp.org/index.php/OWASP_Zed_Attack_Proxy_Project`), which was
    developed by the OWASP community.


    Let''s learn how to use ZAP to perform security tests on our applications.


    # # Using ZAP for security testing


    ZAP is a free and open source graphical tool that allows you to scan websites
    and perform a multitude of security and penetration tests.


    Unlike SonarQube, which also performs security analysis in the application''s
    source code but does not execute it, ZAP runs the application and performs security
    tests.'
  merge: -1
  img_proc: true
- pgno: 422
