- pgno: 76
  md: '# # Applying the changes


    After validating that the result of the `plan` command corresponds to our expectations,

    the final step is the application of the Terraform code in real time to provision
    and apply

    the changes to our infrastructure.


    To do this, we will execute the `apply` command:


    ```

    terraform apply

    ```


    This command does the same operation as the `plan` command and interactively asks
    the

    user for confirmation that we want to implement the changes.


    The following is a screenshot of the `terraform apply` confirmation:


    ![](img/d3344b39c888aab0b832625465f837c9_76_0.png)


    Figure 2.13 – Confirmation of the changes to be applied in Terraform


    The confirmation is given by inputting `yes` (or `no` to cancel), then Terraform
    applies the

    changes to the infrastructure.


    # ## Important Note


