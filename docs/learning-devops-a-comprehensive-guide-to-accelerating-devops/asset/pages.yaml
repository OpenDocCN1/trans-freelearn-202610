    After having seen the steps that are taken to create an AKS service in Azure,
    we will now provide an overview of its advantages.


    # # Advantages of AKS


    AKS is a Kubernetes service that is managed in Azure. This has the advantage of
    being integrated with Azure, as well as some other advantages listed here:


    +   • **Ready to use**: In AKS, the Kubernetes web dashboard is natively installed,
    and the documentation at `https://docs.microsoft.com/en-us/azure/aks/ kubernetes-dashboard`
    explains how to access it.


    +   • **Integrated monitoring services**: AKS also has all of Azure''s integrated
    monitoring services, including container monitoring, cluster performance management,
    and log management, as shown in the following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_352_1.png)


    Figure 10.27 – AKS monitoring'
  merge: -1
  img_proc: true
- pgno: 353
  md: '+   - **Very easy to scale**: AKS allows the quick and direct scaling of the
    number of nodes of a cluster via the portal, or via scripts.


    As we can see in the following screenshot, we choose the number of nodes that
    we want in the Azure portal, and the change is effective immediately:


    ![](img/d3344b39c888aab0b832625465f837c9_353_0.png)


    Figure 10.28 – AKS scaling


    If we have an Azure subscription and we want to use Kubernetes, it’s intuitive
    and quick to install. AKS has a number of advantages, such as integrated monitoring
    and scaling in the Azure portal. Using the `kubectl` tool does not require any
    changes compared to a local Kubernetes instance.


    In this section, we have discussed AKS, which is a managed Kubernetes service
    in Azure. Then, we created an AKS instance and configured the `kubeconfig` file
    in order to connect to this AKS instance. Finally, we listed its advantages, which
    are mainly integrated monitoring and fast scalability.


    In the next section, we will see some resources for how to deploy an application
    in Kubernetes by using a CI/CD pipeline with Azure Pipelines.


    # # Creating a CI/CD pipeline for Kubernetes with Azure Pipelines


    So far, we have seen how to use `kubectl` to deploy a containerized application
    in a local Kubernetes cluster or in a remote cluster with AKS.


    In the first edition of this book, I explained how to build a complete pipeline
    in Azure DevOps, from the creation of a new Docker image pushed into Docker Hub
    to its deployment in an AKS cluster.'
