- pgno: 440
  md: "# # Creating an InSpec profile file\n\nTo create an InSpec profile file, we’ll\
    \ generate the test directory structure, then modify the\nInSpec profile file\
    \ that was generated.\n\nTo perform this manipulation, we create a test folder\
    \ structure and an InSpec profile that\ndefines some metadata and the InSpec configuration.\
    \ To create a structure and an InSpec\nprofile file, on your machine, go to the\
    \ directory of your choice and execute the following\ncommand:\n\n```\ninspec\
    \ init profile azuretets\n```\n\nThis command initializes a new profile by creating\
    \ a new folder, azuretets, that\ncontains all of the artifacts needed for InSpec\
    \ tests, with the following:\n\n+   - Controls (tests)\n+   \n+   - Libraries\n\
    +   \n+   - A profile file, `inspec.yml`, with some default metadata\n\nThen,\
    \ we modify this `inspec.yml` profile file with some personal metadata and add\n\
    the **Uniform Resource Locator (URL)** link from the InSpec-Azure resource pack\
    \ to the\nsample code, as follows:\n\n```\nname: azuretets\ntitle: InSpec Profile\n\
    maintainer: Your name\ncopyright: Your name\ncopyright_email: you@example.com\n\
    license: All Rights Reserved\nsummary: An InSpec Compliance Profile\nversion:\
    \ 0.1.0\ninspec_version: '>= 4.6.9'\ndepends:\n- name: inspec-azure\nurl: https://github.com/inspec/inspec-azure.git\n\
    ```\n\nIn this code, we have entered some personal information, such as our name,\
    \ and\ninformation about the license type of this code. Then, finally, in the\
    \ last part of this file,\nwe indicated a dependency with the URL of the InSpec-Azure\
    \ resource library pack."
