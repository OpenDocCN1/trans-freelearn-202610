- pgno: 277
  md: "The complete Ansible code that we used to install nginx on the Linux machine\
    \ is available\nhere: https://github.com/PacktPublishing/Learning-DevOps-Second-\n\
    Edition/blob/main/CHAP08/ansible/playbookdemo.yml. We already\nlearned about it\
    \ in Chapter 3, Using Ansible for Configuring IaaS Infrastructure. For the\nAnsible\
    \ inventory, we use a **dynamic inventory** that selects VM hosts based on a specific\n\
    Azure resource group and a tag on a VM.\n\nThe configuration code of this dynamic\
    \ inventory is available here: https://github.\ncom/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/\n\
    CHAP08/ansible/inv.azure_rm.yml.\n\nNow that we have all the Terraform and Ansible\
    \ code, we can write the YAML code of the\nAzure Pipelines with the following\
    \ steps. For this, create a new azure-pipeline.yml\nfile with the following content:\n\
    \n+   1. The first step is to run Terraform workflow commands with `init`, `plan`,\n\
    +   and `apply`:\n\n```\n```\n- script: terraform init --backend-config backend.\n\
    tfvars\n    displayName: Terraform init\n    workingDirectory: $(Build.SourcesDirectory)/CHAP08/\n\
    \    terraform\n    env:\n        ARM_CLIENT_ID: $(AZURE_CLIENT_ID)\n        ARM_CLIENT_SECRET:\
    \ $(AZURE_SECRET)\n        ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)\n   \
    \     ARM_TENANT_ID: $(AZURE_TENANT)\n        ARM_ACCESS_KEY: $(AZURE_ACCESS_KEY)\n\
    - script: terraform plan\n    displayName: Terraform plan\n    workingDirectory:\
    \ $(Build.SourcesDirectory)/CHAP08/\n    terraform\n    env:\n        ARM_CLIENT_ID:\
    \ $(AZURE_CLIENT_ID)\n        ARM_CLIENT_SECRET: $(AZURE_SECRET)\n        ARM_SUBSCRIPTION_ID:\
    \ $(AZURE_SUBSCRIPTION_ID)\n        ARM_TENANT_ID: $(AZURE_TENANT)\n        ARM_ACCESS_KEY:\
    \ $(AZURE_ACCESS_KEY)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 278
  md: "```\n- script: terraform apply -auto-approve\n  displayName: Terraform apply\n\
    \  workingDirectory: $(Build.SourcesDirectory)/CHAP08/terraform\n  env:\n    ARM_CLIENT_ID:\
    \ $(AZURE_CLIENT_ID)\n    ARM_CLIENT_SECRET: $(AZURE_SECRET)\n    ARM_SUBSCRIPTION_ID:\
    \ $(AZURE_SUBSCRIPTION_ID)\n    ARM_TENANT_ID: $(AZURE_TENANT)\n    ARM_ACCESS_KEY:\
    \ $(AZURE_ACCESS_KEY)\n```\n\nIn these script tasks, we run the following three\
    \ commands:\n\n+   - The `terraform init` command using a Terraform state backend\
    \ configuration.\n+   - The `terraform plan` command for previewing the changes.\n\
    \n> Important Note\n> Optionally, we can add one step here to manually approve\
    \ the `plan` result before we apply the changes. Here, in this lab, we are confident\
    \ with the plan changes, and the pipeline can apply the changes directly.\n\n\
    +   - The `terraform apply` command for applying changes and creating the VM if\
    \ it does not exist. To this command, we add the `-auto-approve` option to automatically\
    \ apply changes without asking for confirmation.\n\nFor Azure authentication,\
    \ we use the service principal credentials and the Azure storage access key (for\
    \ state backend) as environment variables.\n\n+   2. Then, in this pipeline, we\
    \ continue with the Ansible execution with the following code:\n\n```\n- script:\
    \ pip install ansible[azure]==2.8.6\n  displayName: Get requirements\n- script:\
    \ ansible-playbook playbookdemo.yml -i inv.azure_rm.yml\n  displayName: Ansible\
    \ playbook\n  workingDirectory: $(Build.SourcesDirectory)/CHAP08/ansible\n  env:\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 279
  md: '```

    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)

    AZURE_SECRET: $(AZURE_SECRET)

    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)

    AZURE_TENANT: $(AZURE_TENANT)

    ANSIBLE_HOST_KEY_CHECKING: False

    ```


    In this code, the first script installs the Azure plugins for Ansible that are
    required

    for the dynamic inventory.


    The second script executes an Ansible playbook and uses the dynamic inventory

    configured in the `inv.azure_rm.yml` file. We also use the Azure service

