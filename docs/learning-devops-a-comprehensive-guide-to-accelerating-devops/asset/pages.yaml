- pgno: 327
  md: '# # 10 Managing Containers Effectively with Kubernetes


    In the previous chapter, we learned in detail about containers with Docker, about
    the construction of a Docker image, and about the instantiation of a new container
    on the local machine. Finally, we set up a **continuous integration/continuous
    deployment** (CI/CD) pipeline that builds an image, deploys it in Docker Hub,
    and executes its container in **Azure Container Instances** (ACI).


    All this works well and does not pose too many problems when working with a few
    containers. But in so-called **microservice applications**—that is, applications
    that are composed of several services (each of them is a container), we will need
    to manage and orchestrate these containers.


    There are two major container orchestration tools on the market: Docker Swarm
    and Kubernetes.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'For some time now, Kubernetes, also known as **K8S**, has proved to be a true
    leader in the field of container management and is therefore becoming a _must_
    for the containerization of applications.


    In this chapter, we will learn how to install Kubernetes on a local machine, as
    well as an example of how to deploy an application in Kubernetes, both in a standard
    way and with Helm. We will learn in more depth about Helm by creating a chart
    and publishing it in a private registry on **Azure Container Registry (ACR)**.


    Then, we will talk about **Azure Kubernetes Service (AKS)** as an example of a
    Kubernetes cluster, and finally, we will learn how to monitor applications and
    metrics in Kubernetes.


    This chapter will cover the following topics:


    +   - Installing Kubernetes


    +   - A first example of Kubernetes application deployment


    +   - Using Helm as a package manager


    +   - Publishing a Helm chart in a private registry (ACR)


    +   - Using AKS


    +   - Creating a CI/CD pipeline for Kubernetes with Azure Pipelines


    +   - Monitoring applications and metrics in Kubernetes


    # # Technical requirements


    This chapter is a continuation of the previous chapter on Docker, so to understand
    it properly, it is necessary to have read that chapter and to have installed Docker
    Desktop (for the Windows **operating system (OS)**).


    In the CI/CD part of this chapter, you will need to retrieve the source code that
    was provided in the previous chapter on Docker, which is available at `https://github.
    com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/ CHAP09/appdocker`.


    For the section about Helm charts on ACR, it''s necessary to have an Azure subscription
    (register for free here: `https://azure.microsoft.com/en-us/free/`) and that you
    have installed the Azure **Command-Line Interface (CLI)** binary, available here:
    `https://docs.microsoft.com/en-us/cli/azure/install-azure-cli`.


    The entire source code for this chapter is available at `https://github.com/ PacktPublishing/Learning-DevOps-Second-Edition/tree/main/
    CHAP10`.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'Check out the following video to see the Code in Action:

    https://bit.ly/3p7ydjt


    # # Installing Kubernetes


    Before installing Kubernetes, we need to have an overview of its architecture
    and main

    components, because Kubernetes is not a simple tool but is a cluster—that is,
    it consists of

    a **master** server and other slave servers called **nodes**.

    I suggest you explore the architecture of Kubernetes in a simplified way.


    # # Kubernetes architecture overview


    Kubernetes is a platform that is made up of several components that assemble together

    and extend on demand, in order to enable better scalability of applications. The

    architecture of Kubernetes, which is a client/server type, can be represented
    simply, as

    shown in the following diagram:


    ![](img/d3344b39c888aab0b832625465f837c9_329_0.png)


    In the previous diagram, we can see that a cluster is made up of a master component
    and

    nodes (also called **worker** nodes), which represent the slave servers.

    In each of these nodes, there are **pods**, which are virtual elements that will
    contain

    containers and volumes.

    Put simply, we can create one pod per application, and it will contain all the
    containers

    of the application. For example, one pod can contain a web server container, a
    database

    container, and a volume that will contain persistent files for images and database
    files.'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'Finally, `kubectl` is the client tool that allows us to interact with a Kubernetes
