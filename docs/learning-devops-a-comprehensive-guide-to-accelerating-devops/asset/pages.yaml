- pgno: 125
  md: '# # 4 Optimizing Infrastructure Deployment with Packer


    In the previous chapters, we learned how to provision a cloud infrastructure using

    Terraform and then we continued with the automated configuration of VMs with Ansible.

    This automation allows us to benefit from a real improvement in productivity and
    very

    visible time-saving.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'However, despite this automation, we notice the following:


    +   • Configuring a VM can be very time-consuming because it depends on its hardening
    as well as the middleware that will be installed and configured on this VM.


    +   • Between each environment or application, the middleware versions are not
    identical because their automation script is not necessarily identical or maintained
    over time. Hence, for example, the production environment, being more critical,
    will be more likely to have the latest version of packages, which is not the case
    in pre-production environments. And with this situation, we often encounter issues
    with the behavior of applications in production.


    +   • Configuration and security compliance is not often applied or updated.


    To address these issues, all cloud providers have integrated a service that allows
    them to create or generate custom VM images. These images contain all of the configurations
    of the VMs with their security administration and middleware configurations and
    can then be used as a basis to create VMs for applications.


    The benefits of using these images are as follows:


    +   • The provisioning of a VM from an image is very fast.


    +   • Each VM is uniform in configuration and, above all, is safety compliant.


    Among the **Infrastructure as Code (IaC)** tools, there is Packer from the HashiCorp
    tools, which allows us to create VM images from a file (or template).


    In this chapter, we will learn how to install Packer in different modes. We will
    discuss the syntax of Packer templates to create custom VM images in Azure that
    use scripts or Ansible playbooks.


    We will detail the execution of Packer with these templates using JSON and HCL
    format. Finally, we will see how Terraform uses the images created by Packer.
    Through this chapter, we''ll understand that Packer is a simple tool that simplifies
    the creation of VMs in a DevOps process and integrates very well with Terraform.


    In this chapter, we will cover the following:


    +   • An overview of Packer


    +   • Creating Packer templates using scripts


    +   • Creating Packer templates using Ansible


    +   • Executing Packer'
  merge: -1
  img_proc: true
- pgno: 127
  md: '+   - Writing Packer templates with HCL format

    +   - Using images created by Packer with Terraform


    # # Technical requirements


    This chapter will explain how to use Packer to create a VM image in an Azure

    infrastructure as an example of cloud infrastructure. So, you will need an Azure

    subscription, which you can get here for free: https://azure.microsoft.com/

    en-us/free/.


    In the Using Ansible in a Packer template section, we will learn how to write
    Packer

    templates that use Ansible, so you will need to install Ansible on your machine
    and

    understand how it works, which is detailed in Chapter 3, Using Ansible for Configuring

    IaaS Infrastructure.


    The last section of this chapter will give an example of using Terraform with
    a Packer

    image; for its application, it will be necessary to install Terraform and understand

    its operation, which is detailed in Chapter 2, Provisioning Cloud Infrastructure
    with

    Terraform.


    The entire source code of this chapter is available at https://github.com/

    PacktPublishing/Learning-DevOps-Second-Edition/tree/main/

    CHAP04.


    Check out the following video to see the Code in Action: https://bit.ly/35exxSo.


    # # An overview of Packer


    Packer is part of the HashiCorp open source suite of tools, and this is the official
    Packer

    page: https://www.packer.io/. It''s an open source command-line tool that allows

    us to create custom VM images of any OS (these images are also called **templates**)
    on

    several platforms from a JSON file.


    Packer''s operation is simple; it is based on the basic OS provided by the different
    cloud

    providers and configures a temporary VM by executing the scripts described in
    the JSON

    or HCL template. Then, from this temporary VM, Packer generates a custom image
    ready

    to be used to provision VMs.


    Apart from VM images, Packer also provides other types of images such as Docker

    images or Vagrant images. After this brief overview of Packer, let''s look at
    the different

    installation modes.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# # Installing Packer


    Packer, like Terraform, is a cross-platform tool and can be installed on Windows,
    Linux, or macOS. The installation of Packer is almost identical to the Terraform
    installation (see Chapter 2, Provisioning Cloud Infrastructure with Terraform)
    and can be done in two ways: either manually or via a script.


    # ## Installing manually


    To install Packer manually, use the followings steps:


    +   1. Go to the official download page (`https://www.packer.io/downloads.html`)
    and download the package corresponding to your operating system.

    +   2. After downloading, unzip and copy the binary into an execution directory
    (for example, inside `c:\Packer`).

    +   3. Then, the `PATH` environment variable must be set with the path to the
    binary directory.


    > > **Tip**

    > > For detailed instructions on how to update the `PATH` environment variable
    on Windows, refer to this article: `https://www.architectryan.com/2018/03/17/add-to-the-path-on-windows-10/`,
    and for Linux, refer to this one: `https://www.techrepublic.com/article/how-to-add-directories-to-your-path-in-linux/`.


    Now that we''ve learned how to install Packer manually, let''s look at the options
    available to us to install it using a script.


    # ## Installing by script


    It is also possible to install Packer with an automatic script that can be installed
    on a remote server and be used on a CI/CD process. Indeed, Packer can be used
    locally, as we will see in this chapter, but its real goal is to be integrated
    into a CI/CD pipeline. This automatic DevOps pipeline will allow the construction
    and publication of uniform VM images that will guarantee the integrity of middleware
    and VM security based on these images.


    Let''s see the structure of these scripts for the different OSes, that is, Linux,
    Windows, and macOS.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# # Installing Packer by script on Linux


    For installing the Packer binary on Linux, we have two solutions:


    +   • The first solution is to install Packer with the following script:


    ```

    PACKER_VERSION="1.7.3" #Update with your desired version

    curl -Os https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip
    \

    && curl -Os https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_SHA256SUMS
    \

    && curl https://keybase.io/hashicorp/pgp_keys.asc | gpg --import \

    && curl -Os https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_SHA256SUMS.sig
    \

    && gpg --verify packer_${PACKER_VERSION}_SHA256SUMS.sig packer_${PACKER_VERSION}_SHA256SUMS
    \

    && shasum -a 256 -c packer_${PACKER_VERSION}_SHA256SUMS 2>&1 | grep "${PACKER_VERSION}_linux_amd64.zip:\sOK"
    \

    && unzip -o packer_${PACKER_VERSION}_linux_amd64.zip -d /usr/local/bin

    ```


    ```

    Note

    The code of this script is also available here: https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP04/install_packer.sh.

    ```


    This script performs the following actions:


    +   • Downloads the Packer version 1.7.3 package and checks the checksum


    +   • Unzips and copies the package into a local directory, `/usr/local/bin` (by
    default, this folder is in the `PATH` environment variable)'
  merge: -1
  img_proc: true
