- pgno: 445
  md: 'We have just seen here the installation of InSpec, then the writing of InSpec
    tests, and finally how to use it with its command line to test the compliance
    of Azure infrastructure. In the next section, we’ll look at another aspect of
    security with the protection of sensitive data using the secrets manager, Vault,
    from HashiCorp.


    # # Keeping sensitive data safe with HashiCorp Vault


    Today, when we talk about security in information systems, the most expected topic
    is the protection of sensitive data between different components of the system.
    This sensitive data that needs to be protected includes server access passwords,
    database connections, **application programming interface (API) authentication
    tokens**, and application user accounts. Indeed, many security attacks occur because
    this type of data is decrypted in the source code of applications or in poorly
    protected files that are exposed to local workstations. Many known tools can be
    used to secure this sensitive data, such as these:


    +   - KeyPass (`https://keepass.info/`)

    +   - LastPass (`https://www.lastpass.com/`)

    +   - Ansible Vault, the use of which we discussed _Chapter 3, Using Ansible for
    Configuring IaaS Infrastructure_

    +   - Vault from HashiCorp


    Also, cloud providers offer their own secrets protection services such as the
    following:


    +   - Azure Key Vault: `https://azure.microsoft.com/en-us/services/ key-vault/`

    +   - **Key Management Service (KMS)** for Google Cloud Platform: `https://cloud.
    google.com/kms/`

    +   - AWS Secrets Manager for AWS: `https://aws.amazon.com/secrets- manager/?nc1=h_ls`


    Out of all of the tools we have mentioned, we’ll look at the use of **Vault**
    from HashiCorp, which is free and open source and can be installed on any type
    of OS as well as on Kubernetes.


    These are the main features and benefits of Vault:


    +   - It allows the storage of static secrets as well as dynamic secrets.

    +   - It also has a system for rotating and revoking secrets.'
  merge: -1
  img_proc: true
- pgno: 446
  md: '+   - It allows data to be encrypted and decrypted without having to store
    it.

    +   - It also has a web interface that allows the management of secrets.

    +   - It integrates with a multitude of authentication systems.

    +   - All secrets are stored in a single centralized tool.

    +   - It allows you to be independent of your architecture by being accessible
    with all major cloud providers, Kubernetes, or even on internal data centers (on-premises).


    > Note

    > For more information on Vault features, see the product page at https : // www.vaultproject.io/docs/what-is-vault/index.html.


    With all of these very interesting features, Vault is therefore a tool that I
    recommend for any company that wants to protect its sensitive information and
    integrate its secure accessibility into a CI/CD pipeline. Indeed, in addition
    to being very efficient for data protection, Vault integrates very well in CI/CD
    pipelines. These pipelines will be able to use this protected data when provisioning
    infrastructure and deploying applications.


    After an overview of Vault, we’ll proceed with the installation of Vault on a
    local machine and use it for encrypting and decrypting data. We’ll also give an
    overview of the Vault user interface (UI), and finally, we’ll expose the process
    of how to retrieve data from Vault in Terraform.


    # # Installing Vault locally


    If you decide to use Vault, it is important to know that it is a tool that is
    responsible for the security of your sensitive infrastructure and application
    data. In practice, Vault is not just a tool, and before installing it in production,
    you need to understand its concepts and its different architectural topologies.


    > Note

    > To learn more about Vault architecture topologies, please refer to the documentation
    at https : //learn.hashicorp.com/vault/ operations/ops-reference-architecture.


    The purpose of this chapter is therefore not to go into the details of the concepts
    and architecture of Vault but to explain the installation and use of Vault in
    development mode. In other words, we’ll install Vault on a local workstation to
    have a small instance that’s used for testing and development.'
  merge: -1
  img_proc: true
- pgno: 447
  md: "We have already detailed the use of HashiCorp tools in this book with Terraform\
    \ and Packer, and similarly, Vault can be installed either manually or via a script,\
    \ as follows:\n\n+   • To **install Vault manually**, the procedure is exactly\
    \ the same as that of installing Terraform and Packer, so you need to do the following:\n\
    +   \n+   A. Navigate to the download page: `https://www.vaultproject.io/ downloads.html`.\n\
    +   \n+   B. Download the package related to your OS in the folder of your choice.\n\
    +   \n+   C. Unzip the package and update the `PATH` environment variable with\
    \ its path to this folder.\n\n+   • To **install Vault automatically**, we’ll\
    \ use a script, the code of which depends on our OS.\n\nFor **Linux**, in a Terminal,\
    \ run the following script (from `https://www. vaultproject.io/downloads`):\n\n\
    ```\ncurl -fsSL https://apt.releases.hashicorp.com/gpg | sudo\napt-key add -sudo\
    \ apt-add-repository \"deb [arch=amd64] https://\napt.releases.hashicorp.com $(lsb_release\
    \ -cs) main\"sudo apt-get\nupdate && sudo apt-get install vault\n```\n\nThis script\
    \ performs the following actions:\n\n+   1. It registers to the HashiCorp package\
    \ registry.\n+   \n+   2. Installs the Vault package.\n\nFor **Windows**, to install\
    \ Vault via a script, we’ll use **Chocolatey**, which is the Windows software\
    \ package manager (`https://chocolatey.org/`), by executing the following command\
    \ in a Terminal:\n\n```\nchoco install vault -y\n```\n\nThis command downloads\
    \ and installs Vault from Chocolatey.\n\nApart from these scripts that allow Vault\
    \ to be installed on a local workstation, HashiCorp also provides Terraform code\
    \ that allows you to create a complete Vault infrastructure on different cloud\
    \ providers."
  merge: -1
  img_proc: true
- pgno: 448
  md: '# # Note


    This Terraform code is available for Azure at `https://github.com/hashicorp/terraform-azurerm-vault`;
    for AWS, it is available at `https://github.com/hashicorp/terraform-aws-vault`;
    and for GCP, it is available at `https://github.com/hashicorp/terraform-google-vault`.


    For **Kubernetes**, we can use a Helm chart to install Vault inside a Kubernetes
    instance using the following script:


    ```

    helm repo add hashicorp https://helm.releases.hashicorp.com

    kubectl create namespace vault

    helm install vault hashicorp/vault --namespace vault

    ```


    In the preceding script, we perform the following actions:


    +   1. Add the Hashicorp Helm repository locally.

    +   2. Create a `vault` namespace.

    +   3. Install Vault in the `vault` namespace using the Helm chart.


    For more details about Vault installation on Kubernetes, read the tutorial here:


    `https://learn.hashicorp.com/tutorials/vault/kubernetes-raft-deployment-guide?in=vault/kubernetes`


    After installing Vault, we''ll test its installation by running the following
    command in the Terminal:


    ```

    vault --version

    ```


    This command displays the installed version of Vault. We can also execute the
    `vault --help` command to display a list of available commands.


    We have just seen the different ways to install Vault on a local machine or on
    Kubernetes; the next step is to start the Vault server.


    # # Starting the Vault server


    Vault is a client/server tool that consists of a client component that''s used
    by developers for applications and a server component that is responsible for
    protecting data in remote backends.'
