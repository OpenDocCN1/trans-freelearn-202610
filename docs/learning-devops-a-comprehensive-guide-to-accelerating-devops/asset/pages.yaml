- pgno: 59
  md: '2. Open the Cloud Shell and choose the mode you want, that is, either Bash
    or PowerShell.


    3. Then, we can run the Terraform command line in the shell.


    The following is a screenshot of the execution of Terraform in Azure Cloud Shell:


    ![](img/d3344b39c888aab0b832625465f837c9_59_0.png)


    Figure 2.5 – Azure Cloud Shell


    The advantage of using this solution is that we don’t need any software to install;
    we can simply upload your Terraform files to Cloud Shell and run them in Cloud
    Shell. Additionally, we are already connected to Azure, so no configuration is
