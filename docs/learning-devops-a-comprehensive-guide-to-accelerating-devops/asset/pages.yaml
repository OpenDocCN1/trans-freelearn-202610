    # # Sharing binaries in GitHub releases


    The purpose of an open source project is not only to make the source code of a
    project visible, but also to share it with public users. For each new version
    of the project (called a **release**), this share contains a release note, as
    well as the binary resulting from the compilation of the project.


    Thus, for a user who wishes to use this application, they don’t need to retrieve
    the entire source code and compile it – they just have to retrieve the shared
    binary from the desired release and use it directly.


    Note that a release is linked to a Git tag, which is used to position a label
    at a specific point in the source code’s history. A tag is often used to provide
    a version number to the source code; for example, the tag could be v1.0.1.'
