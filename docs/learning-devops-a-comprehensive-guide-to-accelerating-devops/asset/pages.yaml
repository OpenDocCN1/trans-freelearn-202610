- pgno: 134
  md: "# # The structure of the Packer template\n\nThe Packer template is composed\
    \ of several main sections, such as `builders`,\n`provisioners`, and `variables`.\
    \ The JSON format of the template is as follows:\n\n```\n{\n\t\"variables\": {\n\
    \t\t// list of variables\n\t\t...\n\t},\n\t\"builders\": [\n\t\t{\n\t\t\t//builders\
    \ properties\n\t\t\t...\n\t\t}\n\t],\n\t\"provisioners\": [\n\t\t{\n\t\t\t// list\
    \ of scripts to execute for image provisionning\n\t\t\t...\n\t\t}\n\t]\n}\n```\n\
    \nLet's look at the details of each section.\n\n# ## The builders section\n\n\
    The `builders` section is mandatory and contains all of the properties that define\
    \ the\nimage and its location, such as its name, the type of image, the cloud\
    \ provider on which\nthe image will be generated, connection information to the\
    \ cloud, the base image to use,\nand other properties that are specific to the\
    \ image type.\n\nHere is some example code of a `builders` section:\n\n```\n{\n\
    \t\"builders\": [{\n\t\t\"type\": \"azure-rm\",\n\t\t\"client_id\": \"xxxxxxxx\"\
    ,\n\t\t\"client_secret\": \"xxxxxxxx\",\n```"
  merge: -1
  img_proc: true
- pgno: 135
  md: '```

    "subscription_id": "xxxxxxxxxx",

    "tenant_id": "xxxxxx",

    "os_type": "Linux",

    "image_publisher": "Canonical",

    "image_offer": "UbuntuServer",

    "location": "westus"

    ......

    }]

    }

    ```


    In this sample, the builders section defines an image that will be stored in the
    Azure cloud and is based on the Linux Ubuntu OS. We also configure the authentication
    keys for the cloud.


    > Note

    > The documentation on the builders section is here: https://www.

    > packer.io/docs/builders.


    If we want to create the same image but on several providers, we can indicate
    in the same template file multiple block builders that will contain the provider
    properties. For example, see the following code sample in JSON format:


    ```

    {

    "builders": [

    {

    "type": "azure-rm",

    "location": "westus",

    ......

    },

    {

    "type": "docker",

    "image": "alpine:latest",

    ...

    }

    ]

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 136
  md: "To translate the same block code in HCL format, we write first two `sources`\
    \ block\nthat define the different provider properties. And we call these `sources`\
    \ in the `build`\nsection as follows:\n\n```\nbuild {\n    sources = [\"sources.azure-arm.azurevm\"\
    ,\"sources.docker.\ndocker-img\"]\n    ...\n}\n```\n\nIn this code sample, we\
    \ define in the Packer template the information for an image of an\nAzure VM,\
    \ and the information for a Docker image based on Alpine. The advantage of\nthis\
    \ is to standardize the scripts that will be detailed in the provisioning section\
    \ of these\ntwo images.\n\nJust after the details of each section, we will see\
    \ a concrete example with a `builders`\nsection to create an image in Azure.\n\
    \nLet’s move on to explaining the `provisioners` section.\n\n# The provisioners\
    \ section\n\nThe `provisioners` section, which is optional, contains a list of\
    \ scripts that will be\nexecuted by Packer on a temporary VM base image in order\
    \ to build our custom VM\nimage according to our needs.\n\nIf the Packer template\
    \ does not contain a `provisioners` section, no configuration\nwill be made on\
    \ the base images.\n\nThe actions defined in this section are available for Windows\
    \ as well as Linux images,\nand the actions can be of several types, such as executing\
    \ a local or remote script,\nexecuting a command, or copying a file.\n\n> Note\n\
    > The `provisioners` type proposed natively by Packer is detailed\n> in the documentation:\
    \ https://www.packer.io/docs/\n> provisioners/index.html.\n\nIt is also possible\
    \ to extend Packer by creating custom provisioning types. To learn more\nabout\
    \ custom `provisioners`, refer to the documentation here: https://www.\npacker.io/docs/extending/custom-provisioners.html."
  merge: -1
  img_proc: true
- pgno: 137
  md: 'The following is a sample of a `provisioners` section for JSON format:


    ```

    {

    ...

    "provisioners": [

    {

    "type": "shell",

    "script": "hardening-config.sh"

    },

    {

    "type": "file",

    "source": "scripts/installers",

    "destination": "/tmp/scripts"

    }

    ]

    ...}


    ```


    And the following is the same block code in HCL format:


    ```

    provisioner "shell" {

    scripts = ["hardening-config.sh"]

    }

    provisioner "file" {

    source = "scripts/installers"

    destination = "/tmp/scripts"

    }


    ```


    In this `provisioners` section, Packer will upload and execute the local script,

    `hardening-config.sh`, to apply the hardening configuration on the remote

    temporary VM base image, and copy the content of the `scripts/installers` local

    folder to the remote folder, `/tmp/scripts`, to configure the image.


    So, in this section, we list all of the configuration actions for the image to
    be created.


    However, when creating an image of a VM, it’s necessary to generalize it – in
    other words,

    delete all of the personal user information that was used to create this image.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'For example, for a Windows VM image, we will use the Sysprep tool as the last
    step of

    provisioners with the following code:


    ```

    "provisioners": [

    ...

    {

    "type": "powershell",

    "inline": ["& C:\\windows\\System32\\Sysprep\\Sysprep.exe /

    oobe /generalize /shutdown /quiet"]

    }]

    ```


    Another example of Sysprep usage in Packer templates is available here: https://www.

    packer.io/docs/builders/azure.html.


    And for deleting the personal user information on a Linux image, we will use the

    following code:


    ```

    "provisioners": [

    .....

    {

    "type": "shell",

    "execute_command": "sudo sh -c ''{{ .Vars }} {{ .Path }}''",

    "inline": [

    "/usr/sbin/waagent -force -deprovision+user & export

    HISTSIZE=0 & sync"

    ]

    }

    ]

    ```


    > Note

    > For more information about the provisioners section, refer to

    > the documentation here: https://www.packer.io/docs/

    > templates/provisioners.html, and the list of actions can be found

    > here: https://www.packer.io/docs/provisioners/index.

    > html.


    After the provisioners section, let’s talk about variables.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# # The variables section


    In the Packer template, we may often need to use values that are not static in
    the code.

    This optional `variables` section is used to define variables that will be filled
    either as

    command-line arguments or as environment variables. These variables will then
    be used

    in the `builders` or `provisioners` sections.


    Here is an example of a `variables` section:


    ```

    {

    "variables": {

    "access_key": "{{env ''ACCESS_KEY''}}",

    "image_folder": "/image",

    "vm_size": "Standard_DS2_v2"

    },

    ....

    }

    ```


    In this example, we initialize the following:


    +   - The `access_key` variable with the `ACCESS_KEY` environment variable

    +   - The `image_folder` variable with the `/image` value

    +   - The value of the VM image size, which is the `vm_size` variable


    To use these so-called user variables, we use the `{{user ''variablename'' }}`

    notation, and here is an example of using these variables in the `builders` section:


    ```

    "builders": [

    {

    "type": "azure-arm",

    "access_key": "{{user ''access_key''}}",

    "vm_size": "{{user ''vm_size''}}",

    ...

    }

    ],

    ```


    And in the `provisioners` section, we use the variables defined in the `variables`

    section, as follows:


    ```

    "provisioners": [

    {


    ```'
  merge: -1
  img_proc: true
- pgno: 140
  md: '```

    "type": "shell",

    "inline": [

    "mkdir {{user ''image_folder''}}",

    "chmod 777 {{user ''image_folder''}}",

    ...

    ],

    "execute_command": "sudo sh -c ''{{ .Vars }} {{ .Path }}''",

    },

    ...

    ]

    ```


    We, therefore, define the properties of the image with variables that will be
    provided when

    executing the Packer template. We can also use these variables in the `provisioners`

    section for centralizing these properties and not have to be redefined , here,
    the path of

    the images (`/image`) that will be repeated several times in the templates.


    > Note

    > Apart from the variables provided by the user, it is also possible to retrieve

    > other variable sources, such as secrets stored in HashiCorp Vault or

    > Consul. For more information about variables, refer to the documentation:

    > https://www.packer.io/docs/templates/legacy_json_

    > templates/user-variables.


    We have just seen the structure of the Packer template with the principal sections
    that

    compose it, which are `builders`, `provisioners`, and `variables`. Now let''s
    look

    at a concrete example with the writing of a Packer template to create an image
    in Azure.


    # # Building an Azure image with the Packer template


    With all of the elements we saw earlier, we will now be able to create a Packer
    template

    that will create a VM image in Azure.


    For this, we will need to first create an Azure AD **Service Principal** (**SP**)
    that will have

    the permissions to create resources in our subscription. The creation is exactly
    the same

    as we did for Terraform; for more details, see the _Configuring Terraform for
    Azure_ section

    in _Chapter 2, Provisioning Cloud Infrastructure with Terraform_. Then, on the
    local disk, we

    will create a Packer template file.'
  merge: -1
