- pgno: 482
  md: '# # Using the LaunchDarkly solution


    In the previous section, we discussed using open source tools for feature flags,
    which can be a good solution but requires some infrastructure components and is
    dependent on a development language (in our example, it was .NET Core).


    For better use and management of feature flags, we can use a cloud solution that
    does not require the implementation of an architecture and provides a lot of features
    around feature flags.


    Among these cloud solutions (**software as a service**, or **SaaS**), there is
    **LaunchDarkly** (`https://launchdarkly.com/`), which is a SaaS platform that
    is composed of a feature flag management back office and SDKs that allow us to
    manipulate the feature flags in our applications.


    The LaunchDarkly SDKs are available for many development languages, such as .NET,
    JavaScript, Go, and Java. A complete list of SDKs is available here: `https://docs.launchdarkly.com/sdk`.


    In addition to the classic version of feature flag management with `RimDev.FeatureFlags`,
    LaunchDarkly allows feature flags to be managed by a user and also provides A/B
    testing features that are linked to feature flags. A/B testing can measure the
    use of the application''s features through feature flags.


    However, LaunchDarkly is a paid solution (`https://launchdarkly.com/pricing/`).
    Fortunately, it provides a 30-day trial so that we can test it out. Please take
    a look at how to use LaunchDarkly so that you can implement feature flags in a
    .NET application.


    For that, we will start by creating some feature flags, as follows:


    +   1. First, log in to your LaunchDarkly account by clicking on the **Sign In**
    button that is located in the top menu of the LaunchDarkly site. Alternatively,
    you can go to `https://app.launchdarkly.com/`.


    +   2. Once we''re connected to our account, in the **Account settings** section,
    we can create a new project called `DemoBook`, as illustrated in the following
    screenshot:'
