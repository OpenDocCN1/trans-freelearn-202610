- pgno: 153
  md: "The `source` block contains the properties of the target image to build an\
    \ Azure image or Docker image. The following code show examples of two `source`\
    \ blocks:\n\n+   • The first `source` declaration is for an Azure VM:\n\n```\n\
    ```\nsource \"azure-arm\" \"azurevm\" {\n    os_type = \"Linux\"\n    location\
    \ = \"West Europe\"\n    vm_size = \"Standard_DS2_V2\"\n    ...\n}\n```\n```\n\
    \n+   • The second `source` declaration is for the Docker image:\n\n```\n```\n\
    source \"docker\" \"docker-img\"\n{\n    image = \"ubuntu\"\n    export_path =\
    \ \"imagedocker.tar\"\n}\n```\n```\n\nThe `build` block contains the source list\
    \ to use and the `provisioner` scripts for configuring the images. The following\
    \ code show a sample `build` block:\n\n```\n```\nbuild {\n    sources = [\"sources.azure-arm.azurevm\"\
    ,\"sources.docker.docker- img\"]\n    provisioner \"shell\" {\n    inline = [\n\
    \    \"apt-get update\",\n    \"apt-get -y install nginx\"\n    ]\n    execute_command\
    \ = \"chmod +x {{ .Path }}; {{ .Vars }} sudo -E sh '{{ . Path }}'\"\n    inline_shebang\
    \ = \"/bin/sh -x\"\n    }\n    provisioner \"shell\" {\n    inline = [\n    \"\
    sleep 30\",\n    \"/usr/sbin/waagent -force -deprovision+user && export HISTSIZE=0\
    \ && sync\"\n    }\n}\n```\n```"
  merge: -1
