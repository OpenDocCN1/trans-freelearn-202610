- pgno: 355
  md: '# # Using the kubectl command line


    To debug applications with the `kubectl` command line, run the command detailed
    next:


    +   • To display the state of Kubernetes resources, run the following command:


    ```

    kubectl get pods,svc

    ```


    The output of the preceding command is shown in the following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_355_0.png)


    Figure 10.29 – kubectl getting resources


    With this command, we can see if pods are running and find out about services’
    statuses.


    +   • To display application logs, run the `kubectl logs pod/<pod name>` command,
    as illustrated in the following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_355_1.png)


    Figure 10.30 – kubectl getting pod logs


    This command displays the output of the application logs.


    For more details on the use of `kubectl` to debug applications, read the documentation
    here:


    `https://kubernetes.io/docs/tasks/debug-application-cluster/ debug-running-pod/`


    With the `kubectl` command, we can automate the debugging of applications, but
    it’s necessary to learn all command-line options.


    Next, we will discuss debugging applications with some tools.'
  merge: -1
  img_proc: true
