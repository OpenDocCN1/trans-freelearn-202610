- pgno: 521
  md: '# # 17 DevOps Best Practices


    We have reached the last chapter of this book and, finally, after reading everything,
    you are probably asking yourself. _What are the best practices to apply to effectively
    implement a development-operations (DevOps) culture?_


    This chapter is a great overview of DevOps good practices that we have already
    seen and that will allow you to practice all the elements we have seen in this
    book.


    We will discuss best practices in automation, tooling choice, **Infrastructure
    as Code (IaC)**, application architecture, and infrastructure design. We will
    also discuss good practices to be applied in project management to facilitate
    the implementation of a DevOps culture and practices. Then, we will review best
    practices for **continuous integration/continuous deployment (CI/CD)** pipelines,
    test automation, and the integration of security into your DevOps processes.


    Finally, we will end this chapter with some best practices for monitoring in a
    DevOps culture.'
  merge: -1
  img_proc: true
- pgno: 522
  md: '# # Automating everything


    When you want to implement DevOps practices within a company, it is important
    to remember the purpose of the DevOps culture: it delivers new releases of an
    application faster, in shorter cycles.


    To do this, the first good practice to apply is to automate all tasks that deploy,
    test, and secure the application and its infrastructure. Indeed, when a task is
    done manually, there is a high risk of error in its execution. The fact that these
    tasks are performed manually increases the deployment cycles of applications.


    In addition, once these tasks are automated in scripts, they can be easily integrated
    and executed in CI/CD pipelines. Another advantage of automation is that developers
    and the operational team can spend more time and focus their work on the functionality
    of their business.


    It is also important to start the automation of the delivery process at the beginning
    of project development; this allows us to provide feedback faster and earlier.


    Finally, automation makes it possible to improve the monitoring of deployments
    by putting traces on each action and allows you to make a backup and restore very
    quickly in case of a problem.


    Automating deployments will, therefore, reduce deployment cycles, and teams can
    now afford to work in smaller iterations. Thus, the **time to market (TTM)** will
    be improved, with the added benefit of better-quality applications.


    +   - Automating everything

    +   - Choosing the right tool

    +   - Writing all your configuration in code

    +   - Designing the system architecture

    +   - Building a good CI/CD pipeline

    +   - Integrating tests

    +   - Shifting security left with **development-security-operations** (**DevSecOps**)

    +   - Monitoring your system

    +   - Evolving project management'
  merge: -1
  img_proc: true
- pgno: 523
  md: 'However, automation and orchestration require tools to be implemented, and
    the choice

    of these tools is an important element to consider in the implementation of a
    DevOps

    culture.


    # # Choosing the right tool


    One of the challenges a company faces when it wants to apply a DevOps culture
    is the

    choice of tools.


    Indeed, many tools are either paid for or free and open source and allow you to
    version

    the source code of applications, process automation, implement CI/CD pipelines,
    and test

    and monitor applications.


    Along with these tools, scripting languages are also added, such as PowerShell,
    Bash, and

    Python, which are also part of the DevOps suite of tools to integrate.


    So, a question I’m often asked is: _How do I choose the right DevOps tools that
    are useful for

    my company and business?_


    In fact, to answer this question, we must remember the definition of DevOps culture

    provided by Donovan Brown, which was mentioned in _Chapter 1, The DevOps Culture

    and Infrastructure as Code Practices_, and reproduced here:


    > _"The DevOps culture is the union of people, processes, and products to

    > enable continuous delivery of value to our end users."_


    The important point of this definition is that a DevOps culture is the _union_
    of Dev, Ops,

    processes, and also _tools_. That is to say, the tools used must be shared and
    usable by both

    Dev and Ops and should be integrated into the same process. In other words, the
    choice of

    tools depends on the teams and the company model.


    It is also necessary to take into account the financial system by choosing open
    source

    tools, which are often free of charge; it is easier to use them at the beginning
    of the

    DevOps transformation of the company. That is not the case with paid tools, which
    are

    certainly richer in features and support but require a significant investment.


    Concerning scripting languages, I would say that the choice of language must be
    made

    according to the knowledge of the teams. For example, Ops teams that are more
    trained

    on Linux systems will be able to make automation scripts better with Bash than
    with

    PowerShell.'
  merge: -1
  img_proc: true
- pgno: 524
  md: 'In this book, we have introduced you to several tools, some of which are open
    source and free—such as Terraform, Packer, Vault, and Ansible—and others that
    are paid for—such as Azure DevOps (for more than five users) or LaunchDarkly—and
    this is to help you choose the tools that best suit you.


    After this reflection on the choice of tools in the implementation of a DevOps
    practice, we will look at another good practice, which is putting everything into
    code.


    # # Writing all your configuration in code


    We have seen throughout the book, especially with the first three chapters on
    IAC, that writing the desired infrastructure configuration in code offers many
    advantages for the productivity of both teams and the company.


    It is, therefore, a very good practice to put everything related to infrastructure
    configuration in code. We have seen this in practice with Terraform, Ansible,
    and Packer, but many other tools exist that may be better suited to your needs
    and your organization. Among these tools, we are not only talking about the major
    editors, but also about the use of **JavaScript Object Notation** (**JSON**) files,
    Bash, PowerShell, and Python scripts that we’ll apply to this configuration. The
    key is to have a description of your infrastructure in code that is easy for a
    human to read, and tools that are adapted to you, as discussed in the previous
    section.


    Moreover, this practice continues to evolve in other fields, as we have seen in
    _Chapter 14, Security in the DevOps Process with DevSecOps_, with the use of InSpec,
    which allows us to describe the compliance rules of the infrastructure in code.


    We have also seen this IaC practice in several chapters of this book with what
    is called **Pipeline as Code** (**PaC**), with GitLab CI, Travis CI, GitHub Actions,
    and also Azure Pipelines, which also allows a **YAML Ain’t Markup Language** (**YAML**)
    pipeline mode (this mode has not been discussed in this book).


    Putting any configuration into code is a key practice of the DevOps culture to
    take into account from the beginning of projects for both operational and development
    teams. For developers, there are also good practices for designing the application
    and infrastructure architecture, as we’ll discuss in the next section.'
  merge: -1
  img_proc: true
- pgno: 525
  md: '# # Designing the system architecture


    A few years ago, all services of the same application were _coded_ in the same
    application block. This architecture design was legitimate since the application
    was managed in a waterfall model (https://activecollab.com/blog/project-management/
    waterfall-project-management-methodology), so new versions of the application
    were deployed in very long cycles. Since then, many changes have taken place in
    software engineering practices, starting with the adoption of the agile method
    and a DevOps culture, and then continuing with the arrival of the cloud.


    This evolution has brought many improvements, not only in applications but also
    in their infrastructure.


    However, in order to take advantage of an effective DevOps culture to deploy an
    application in the cloud, there are good practices to consider when designing
    software architecture and also when designing infrastructure.


    First of all, cloud architects must work hand in hand with developers (or solution
    architects) to ensure that the application developed is in line with the different
    components of the architecture and that the architecture also takes into consideration
    the different constraints of the application.


    In addition to this collaboration, security teams must also provide specifications
    that will be implemented by developers and cloud architects.


    In order to be able to deploy a new version of the application more frequently
    without having to impact all of its features, it is a good practice to separate
    the different areas of the application into separate code at first, and then into
    different departments at a later stage. Thus, the separate code will be much more
    maintainable and scalable and can be deployed faster without having to redeploy
    everything.


    > > **Note**

    > > This method of separating code into several services is part of the architecture
    pattern called **microservices**; to learn more, read the following comprehensive
    article: https://microservices.io/patterns/ microservices.html.


    Once decoupled, however, there is still a need to control dependency in order
    to implement a CI/CD pipeline that takes into account all the dependencies of
    the application.'
  merge: -1
  img_proc: true
- pgno: 526
  md: 'In Chapter 15, Reducing Deployment Downtime, we discussed another good practice
    that allows deployment in production more frequently, which consists of encapsulating
    the functionalities of the application in feature flags. These feature flags must
    also be taken into account when designing the application, as they allow the application
    to be deployed in the production stage, enabling/disabling its features dynamically
    without having to redeploy it.


    Finally, the implementation of unit tests and the logging mechanism must be taken
    into account as soon as possible in the development of the application because
    these allow feedback on the state of the application to be shared very quickly
    in its deployment cycle.


    A DevOps culture involves the implementation of CI/CD pipelines; as we have just
    seen, this requires changes in the design of applications, with the separation
    of functionalities to create less-monolithic applications, the implementation
    of tests, and the addition of a logging system.


    After considering good practices for application design, we will explore some
    good practices for the implementation of CI/CD pipelines.


    # # Building a good CI/CD pipeline


    In this book, we have dedicated a complete chapter, Chapter 7, Continuous Integration
    and Continuous Delivery, to the creation of CI/CD pipelines using different tools
    such as GitLab CI, Jenkins, and Azure Pipelines, in which we have already mentioned
    the prerequisites for the implementation of CI/CD pipelines.


    We also discussed the CI/CD process in Chapter 16, DevOps for Open Source Projects,
    with some examples of a CI pipeline for open source projects such as Travis CI
    and GitHub Actions.


    Building a good CI/CD pipeline is indeed an essential practice in a DevOps culture
    and, together with the correct choice of tools, allows for faster deployment and
    better-quality applications.


    One of the best practices for CI/CD pipelines is to set them up as early as the
    project launch stage. This is especially true for the CI pipeline, which will
    allow the code (at least the compilation step) to be verified when writing the
    first lines of code. Then, as soon as the first environment is provisioned, immediately
    create a deployment pipeline, which will allow the application to be deployed
    and tested in this environment. The rest of the CI/ CD pipeline process''s tasks,
    such as unit-test execution, can be performed as the project progresses.'
  merge: -1
  img_proc: true
- pgno: 527
  md: 'In addition, it is also important to optimize the processes of the CI/CD pipeline
    by having pipelines that run quickly. These are used to provide quick feedback
    to team members (especially for CI) and also to avoid blocking the execution queue
    of other pipelines that may be in the queue.


    Thus, if some pipelines take too long to run, such as integration tests (which
    can be long), it may be a good idea to schedule their execution for hours with
    less activity, such as at night.


    Finally, it is also important to protect sensitive data embedded in CI/CD pipelines.
    So, if you use a configuration management tool in your pipelines, don’t leave
    information such as passwords, connection strings, and tokens visible to all users.


    To protect this data, use centralized secret management tools such as Vault, which
    we saw in Chapter 14, Security in the DevOps Process with DevSecOps, or use Azure
    Key Vault (AKV) if you have an Azure subscription.


    These are some of the best practices for the implementation of CI/CD pipelines;
    we have mentioned other good practices for CI/CD pipelines that you can study
    in the different chapters of this book and in other books dedicated to DevOps
    cultures.


    As a follow-up to the good practices for CI/CD pipelines, let’s review good practices
    for the integration of tests into DevOps processes.


    # ## Integrating tests


    Testing is, in today’s world, a major part of the DevOps process, but also of
    development practices. Indeed, it is possible to have the best DevOps pipeline
    that automates all delivery phases, but without the integration of tests, it loses
    almost all its efficiency. For my part, I think that the minimum requirement for
    a DevOps process is to integrate at least the execution of unit tests of the application.
    In addition, these unit tests must be written from the first line of code of the
    application using testing practices such as **test-driven development (TDD)**
    (https://hackernoon.com/introduction-to-test- driven-development-tdd-61a13bc92d92)
    and **behavior-driven development (BDD)**, and in this way, the automatic execution
    of these tests can be integrated into the CI pipeline.


    However, it is important to integrate other types of tests, such as functional
    tests or integration tests, that allow the application to be tested functionally
    from start to finish with the other components of its ecosystem.'
  merge: -1
  img_proc: true
- pgno: 528
  md: 'It is certainly true that the execution of these tests can take time; in this
    case, it is possible to schedule their execution at night. But these integration
    tests are the ones that will guarantee the quality of the application''s smooth
    operation during all stages of delivery, from deployment to production.


    However, there is often a very bad practice of disabling the execution of tests
    in the CI pipeline in case their execution fails. This is often done to avoid
    the blocking of the complete CI process and thus deliver faster in production.
    But keep in mind that errors detected by the unit tests, including ones that would
    have been detected by tests that have been disabled, will be detected in the production
    stage at some point, and the correction of the failed code will cost more time
    than if the tests had been enabled during CI.


    We have also learned about other types of tests in this book, such as code analysis
    tests or security tests, which are not to be ignored. The sooner they are integrated
    into CI/CD pipelines, the more value will be added for maintaining code and securing
    our application.


    To summarize, you should not ignore the implementation of tests in your applications
    and their integration into CI/CD pipelines, as they guarantee the quality of your
    application.


    After good practices for test integration, I suggest you see what good practices
    there are for the integration of security in your CI/CD processes.


    # # Shifting security left with DevSecOps


    As we discussed in Chapter 14, Security in the DevOps Process with DevSecOps,
    security and compliance analyses must be part of DevOps processes. However, in
    companies, there is often a lack of awareness among development teams about security
    rules, and this is why security is implemented too late in DevOps processes.


    To integrate security into processes, it is, therefore, necessary to raise awareness
    among developers of aspects of application code security, but also of the protection
    of CI/CD pipeline configuration.


    In addition, it is also necessary to eliminate the barrier between DevOps and
    security by integrating security teams more often into the various meetings that
    bring together Dev and Ops teams, thus ensuring better consistency between developers,
    operational teams, and also security. Regarding the choice of tools, don''t use
    too many different tools, because the goal is for these tools to also be used
    by developers and be integrated into CI/ CD pipelines. It is, therefore, necessary
    to select a few tools that are automated, do not require great knowledge of security,
    and provide reports for better analysis.'
  merge: -1
  img_proc: true
- pgno: 529
  md: 'Finally, if you don’t know where to start when it comes to analyzing the security
    of the application, work with simple security rules that are recognized by communities,
    such as the top 10 **Open Web Application Security Project (OWASP)** rules (`https://www.
    owasp.org/index.php/Category:OWASP_Top_Ten_Project`), which we saw in _Chapter
    13, Security and Performance Tests_. You can use the **Zed Attack Proxy (ZAP)**
    tool, which uses these 10 rules, to perform security tests on a web application.


    These are some good practices for integrating security into a DevOps culture in
    order to achieve a DevSecOps culture. We will now view some good practices for
    monitoring.


    # # Monitoring your system


    One of the main elements for the success of a DevOps culture is the implementation
    of tools that will continuously monitor the state of a system and applications.
    Monitoring must be implemented at all levels of the system by involving all teams,
    with the aim of having applications with real added value for the end user.


    Indeed, the first component that can be monitored is the application itself, by
    implementing, as soon as possible, a logging or tracing system that will serve
    to gather information on the use of the application. Then, we will measure and
    monitor the state of the infrastructure, such as the **random-access memory (RAM)**
    and **central processing unit (CPU)** level of the **virtual machines (VMs)**
    or the network bandwidth. Finally, the last element that must be monitored is
    the status of DevOps processes. It is, therefore, important to have metrics on
    the execution of CI/CD pipelines, such as information on the execution time of
    pipelines, or the number of pipelines that have executed successfully or failed.
    With this data, for example, we can determine the deployment speed of an application.


    There are many monitoring tools, such as Prometheus, Grafana, New Relic, Nagios,
    and others that are integrated into the various cloud providers, such as Azure
    Application Insights or Azure Monitor Logs.


    Concerning good practices for monitoring, I would say that it is important to
    target the **key performance indicators (KPIs)** that are necessary for you and
    that are easy to analyze. It is useless to have a monitoring system that captures
    a lot of data or an application that writes a lot of logs, as it’s too time-consuming
    when it comes to analyzing this information. In addition, on the volume of the
    captured data, we need to take care in ensuring its retention. The retention time
    of the data must be evaluated, and different teams should be consulted. Too much
    retention can cause capacity saturation on VMs or high costs for managed components
    in the cloud, and with too little retention, the log history is shorter, and therefore
    you can lose track of any problems.'
  merge: -1
  img_proc: true
- pgno: 530
  md: 'Finally, when choosing a tool, you must make sure that it protects all the
    data that is captured, that the dashboards the tools present are understandable
    enough by all team members, and that it is integrated into a DevOps process.


    We have explained that monitoring is a practice that must be integrated into a
    DevOps culture, taking into account some points of good practice that can improve
    communication between Dev and Ops and improve product quality for the end users.


    After reviewing DevOps best practices with automation, CI/CD pipelines, and monitoring,
    we will take an overview of DevOps practices for project management and team organization.


    # # Evolving project management


    We have previously discussed some good DevOps practices to apply to projects,
    but all this can only be implemented and realized with a change in the way that
    projects are managed and teams are organized.


    Here are some good practices that can facilitate the implementation of a DevOps
    culture in project management within companies.


    First of all, it should be remembered that a DevOps culture only makes sense with
    the implementation of development and delivery practices that will allow applications
    to be delivered in short deployment cycles. Therefore, in order to be applicable,
    projects must also be managed with short cycles. To achieve this, one of the most
    suitable project management methods to apply a DevOps culture that has proven
    its worth in recent years is the agile method, which uses sprints (short cycles
    of 2 to 3 weeks) with incremental, iterative deployments and strong collaboration
    between developers.


    A DevOps culture just extends the agile methodology by promoting collaboration
    between several domains (Dev/Ops/security/testers).


    > > **Note**

    > > To learn more about the agile method and its different frameworks (Scrum and
    Extreme Programming (XP), for example), I recommend `http:// agilemethodology.org/`,
    which provides a lot of documentation.'
  merge: -1
  img_proc: true
- pgno: 531
  md: 'In addition, for a better application of DevOps implementations, it is important
    to change your organization by no longer having teams organized by areas of expertise,
    such as having a team of developers, another team of operations, and a team of
    testers. The problem with this organizational model is that the teams are compartmentalized,
    resulting in a lack of communication (which we saw in Chapter 1, The DevOps Culture
    and Infrastructure as Code Practices, with the wall of confusion). This means
    that different teams have different objectives, which slams the brakes on applying
    good practices for a DevOps culture.


    One of the models that allow for better communication is feature team organization
    with multidisciplinary project teams that are composed of people from all fields.
    In a team, we have developers, operational staff, and testers, and all these people
    work with the same objective.


    If you want to know more about Microsoft''s DevOps transformation, I suggest you
    watch the presentation by Donovan Brown at https://www.agilealliance.org/ resources/sessions/microsoft-devops-transformation-donovan-
    brown/, which explains how Microsoft has changed its organization to adapt to
    a DevOps culture to continuously improve its products while taking into account
    user needs.


    We have just seen that to implement a DevOps culture in companies, organizational
    changes are required, including agile project management and the composition of
    multidisciplinary teams.


    # ## Summary


    In this final chapter, we have seen that the implementation of a DevOps culture
    within projects requires the use of best practices regarding the automation of
    all manual tasks, the proper choice of tools, a less-monolithic project architecture,
    and the implementation of monitoring.


    On a large scale, for the organization of teams and the company as a whole, we
    have seen that the agile method, as well as multidisciplinary teams, contribute
    strongly to the implementation of a DevOps culture.


    To finish this book, my advice to all you readers who are adopting DevOps practices
    is to implement and monitor them on small projects and to start by using the tools
    that are most familiar and accessible to you. Then, as soon as your DevOps process
    is working properly, you can extend this to larger projects.'
  merge: -1
  img_proc: true
