- pgno: 215
  md: '# # 7 Continuous Integration and Continuous Delivery


    One of the main pillars of **development-operations (DevOps)** culture is the
    implementation of **continuous integration (CI)** and deployment processes, as
    we explained in _Chapter 1, The DevOps Culture and Infrastructure as Code Practices_.


    In the previous chapter, we looked at the use of Git with its command lines and
    usage workflow, and in this chapter, we will look at the important role Git has
    in the CI/CD workflow.


    **CI** is a process that provides rapid feedback on the consistency and quality
    of code to all members of a team. It occurs when each user''s code commit retrieves
    and merges the code from a remote repository, compiles it, and tests it.


    **Continuous delivery (CD)** is the automation of the process that deploys an
    application in different stages (or environments).'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'In this chapter, we will learn the principles of the CI/CD process as well
    as its practical use with different tools such as **Jenkins, Azure Pipelines**,
    and **GitLab CI**. For each of these tools, we will present the advantages, disadvantages,
    and best practices, and look at a practical example of implementing a CI/CD pipeline.


    You will learn about the concept of a CI/CD pipeline. After this, we will explore
    package managers and the role they play in the pipeline.


    Then, you will learn how to install Jenkins and, finally, build a CI/CD pipeline
    on Jenkins, Azure Pipelines, and GitLab CI.


    This chapter covers the following topics:


    +   - CI/CD principles

    +   - Using a package manager in the CI/CD process

    +   - Using Jenkins for CI/CD implementation

    +   - Using Azure Pipelines for CI/CD

    +   - Using GitLab CI


    # # Technical requirements


    The only requirement for this chapter is to have Git installed on your system,
    as detailed in the previous chapter.


    The source code for this chapter is available at `https://github.com/ PacktPublishing/Learning-DevOps-Second-Edition/tree/main/
    CHAP07`.


    Check out the following video to see the code in action: `https://bit.ly/3s9G8Pj`.


    # # CI/CD principles


    To implement a CI/CD pipeline, it is important to know the different elements
    that will be required to build an efficient and safe pipeline. In order to understand
    the principles of CI/CD, the following diagram shows the different steps of a
    CI/CD workflow, which we already saw in _Chapter 1, The DevOps Culture and Infrastructure
    as Code Practices_:'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/d3344b39c888aab0b832625465f837c9_217_0.png)


    Figure 7.1 – CI/CD workflow


    Let’s look in detail at each of these steps in order to list the artifacts of
    the CI/CD process.


    # ## CI


    The CI phase checks the code archived by the team members. It must be executed
    on each commit that has been pushed to the remote repository.


    The setting up of a Git-type **source control version (SCV)** is a necessary prerequisite
    that makes it possible to centralize the code of all the members of a team.


    The team will have to decide on a code branch that will be used for CI. For example,
    we can use the `master` branch, or the `develop` branch as part of GitFlow; it
    just needs to be an active branch that very regularly centralizes code changes.


    In addition, CI is achieved by an automatic task suite that is executed on a server,
    following similar patterns executed on a developer’s laptop that has the necessary
    tools for CI; this server is called the **CI server**.


    The CI server can be either of the on-premises type, installed in the company
    data center, such as Jenkins or TeamCity, or perhaps a cloud type that we don’t
    have to worry about installing and maintaining, such as Azure Pipelines or GitLab
    CI.


    The tasks performed during the CI phase must be automated and take into account
    all the elements that are necessary for the verification of the code.


    These tasks are generally the compilation of code and the execution of unit tests
    with code coverage. We can also add static code analysis with SonarQube (or SonarCloud),
    which we will look at in _Chapter 12, Static Code Analysis with SonarQube_.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'At the end of the verification tasks, in many cases, the CI generates an application
    package that will be deployed on the different environments (also called **stages**).


    To be able to host this package, we need a package manager, also called a **repository
    manager**, which can be on-premises (installed locally) such as Nexus, Artifactory,
    or ProGet, or a **software-as-a-service (SaaS)** solution such as Azure Pipelines,
    Azure Artifacts, or the GitHub Packages registry. This package must also be neutral
    in terms of environment configuration and _must_ be versioned in order to deploy
    the application in a previous version if necessary.


    # ## CD


    Once the application has been packaged and stored in a package manager during
    CI, the CD process is ready to retrieve the package and deploy it in different
    environments.


    The deployment in each environment consists of a succession of automated tasks
    that are also executed on a remote server that has access to the different environments.


    It is, therefore, necessary to involve Dev, Ops, and also the security team in
    the implementation of CI/CD tools and processes. It will, indeed, be this union
    of people with the tools and processes that will deploy applications on the different
    servers or cloud resources, respecting the network rules but also the company’s
    security standards.


    During the deployment phase, it is often necessary to modify the configuration
    of the application in the generated package in order for it to be adapted to the
    target environment. It is, therefore, necessary to integrate a **configuration
    manager** that is already present in common CI/CD tools such as Jenkins, Azure
    Pipelines, or Octopus Deploy. In addition, when there is a new configuration key,
    it is good practice for every environment, including production, to be entered
    with the involvement of the Ops team.


    Finally, the triggering of a deployment can be done automatically, but for environments
    that are more critical (for example, production environments), heavily regulated
    companies may have gateways that require a manual trigger with checks on the people
    authorized to trigger the deployment.


    The different tools for setting up a CI/CD pipeline are listed here:


    +   - An SCV

    +   - A package manager

    +   - A CI server

    +   - A configuration manager'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'But let’s not forget that all these tools will only be really effective in
    delivering added value to the product if the Dev and Ops teams work together around
    them.


    We have just looked at the principles of implementing a CI/CD pipeline. In the
    rest of the chapter, we will look at the practical implementation with different
    tools, starting with package managers.


    # # Using a package manager in the CI/CD process


    A package manager is a central repository to centralize and share packages, development
    libraries, tools, and software.


    For consumer clients that use package managers, the benefit is the possibility
    to track, update, install, and remove installed packages.


    There are many public package managers, such as NuGet, **Node Package Manager
    (npm)**, Maven, Bower, and Chocolatey, that provide frameworks or tools for developers
    in different languages and platforms.


    The following screenshot is from the NuGet package manager, which publicly provides
    more than 150,000 .NET frameworks:


    ![](img/d3344b39c888aab0b832625465f837c9_219_0.png)


