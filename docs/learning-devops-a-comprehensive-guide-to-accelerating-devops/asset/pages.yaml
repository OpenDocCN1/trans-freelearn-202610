- pgno: 285
  md: '# # 9 Containerizing Your Application with Docker


    In the last few years, one technology in particular has been making headlines
    on the net, on social networks, and at events—Docker.


    Docker is a containerization tool that became open source in 2013. It allows you
    to isolate an application from its host system so that the application becomes
    portable, and the code tested on a developer’s workstation can be deployed to
    production without any concerns about execution runtime dependencies. We’ll talk
    a little about application containerization in this chapter.


    A container is a system that embeds an application and its dependencies. Unlike
    a **virtual machine (VM)**, a container contains only a light **operating system
    (OS)** and the elements required for the OS, such as system libraries, binaries,
    and code dependencies.


    To learn more about the differences between VMs and containers, and why containers
    will replace VMs in the future, I suggest you read this blog article: `https://blog.docker.com/2018/08/containers-replacing-virtual-machines/`.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'The principal difference between VMs and containers is that each VM that is
    hosted on

    a hypervisor contains a complete OS and is therefore completely independent of
    the guest

    OS that is on the hypervisor.


    Containers, however, don''t contain a complete OS—only a few binaries—but they
    are

    dependent on the guest OS, and use its resources (**central processing unit (CPU)**,

    **random-access memory (RAM)**, and network).


    In this chapter, we will learn how to install Docker on different platforms, how
    to create

    a Docker image, and how to register it in Docker Hub. Then, we''ll discuss an
    example of

    a **continuous integration/continuous deployment (CI/CD)** pipeline that deploys

    a Docker image in **Azure Container Instances (ACI)**. After that, we will show
    how to

    use Docker to runn tools with **command-line interfaces (CLIs)**.


    Finally, we will also learn the basic notions about **Docker Compose** and how
    to deploy

    Docker Compose containers in ACI.


    # This chapter covers the following topics:


    +   - Installing Docker

    +   - Creating a Dockerfile

    +   - Building and running a container on a local machine

    +   - Pushing an image to Docker Hub

    +   - Pushing a Docker image to a private registry (ACR)

    +   - Deploying a container to ACI with a CI/CD pipeline

    +   - Using Docker for running command-line tools

    +   - Getting started with Docker Compose

    +   - Deploying Docker Compose containers in ACI


    # Technical requirements


    This chapter has the following technical requirements:


    +   - An Azure subscription. You can get a free account here: `https://azure.

    +   microsoft.com/en-us/free/`.

    +   - For some Azure commands, we will use the Azure CLI. Refer to the documentation

    +   here: `https://docs.microsoft.com/en-us/cli/azure/install-

    +   azure-cli`.'
  merge: -1
  img_proc: true
- pgno: 287
