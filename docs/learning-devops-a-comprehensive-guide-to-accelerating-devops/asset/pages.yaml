- pgno: 436
  md: '# Overview of InSpec


    InSpec is an open source tool written in Ruby that runs on the command line and
    is produced by one of the leading DevOps tools, **Chef**, whose website is `https://www.
    chef.io/`. It allows users writing declarative-style code to test the compliance
    of a system or infrastructure.


    To use InSpec, it’s not necessary to learn a new scripting language; we should
    already have enough knowledge to write the desired state of the infrastructure
    resources or the system we want to test.


    With InSpec, we can test the compliance of remote machines and data and, since
    the latest version, it is also possible to test a cloud infrastructure such as
    Azure, **Amazon Web Services (AWS)**, and **Google Cloud Platform (GCP)**.


    After this little overview of InSpec, let’s look at how to download and install
    it.


    # Installing InSpec


    We have seen in the _Technical requirements_ section that InSpec needs to have
    **Ruby (**>2.4**)** installed on our machine.


    InSpec can be installed either manually or via a script, as outlined here:


    +   - **Manually**: This can be done by downloading the package corresponding
    to our OS from `https://www.chef.io/downloads/tools/inspec`.

    +   - **With a script**: We can install InSpec by executing the commands detailed
    next in a terminal.


    On Windows, we can download and install InSpec using the Chocolatey package at
    `https://community.chocolatey.org/packages/inspec` with the following command:


    ```

    choco install inspec -y

    ```


    On Linux, use the following script:


    ```

    curl https://omnitruck.chef.io/install.sh | sudo bash -s -- -P inspec

    ```


    The following screenshot shows the installation of InSpec via the **Chocolatey
    package**:'
  merge: -1
  img_proc: true
