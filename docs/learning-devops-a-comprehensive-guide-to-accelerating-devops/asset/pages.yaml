    +     ↓ 1 281 207 499 total downloads ↻ last updated 6 months ago ↥ Latest version:
    13.0.1 ◇ json

    +     Json.NET is a popular high-performance JSON framework for .NET


    +   - Microsoft.Extensions.DependencyInjection ✔ by: aspnet dotnetframework Microsoft

    +     ↓ 753 833 308 total downloads ↻ last updated 12 days ago ↥ Latest version:
    6.0.0-rc.1.21451.13

    +     Default implementation of dependency injection for Microsoft.Extensions.DependencyInjection.


    +   - Microsoft.Extensions.Logging ✔ by: aspnet dotnetframework Microsoft

    +     ↓ 735 313 652 total downloads ↻ last updated 12 days ago ↥ Latest version:
    6.0.0-rc.1.21451.13

    +     Logging infrastructure default implementation for Microsoft.Extensions.Logging.


    Figure 7.2 – NuGet package manager'
  merge: -1
