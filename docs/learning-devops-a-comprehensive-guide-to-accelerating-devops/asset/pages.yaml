- pgno: 452
  md: '# # Reading secrets in Vault


    Once we have created secrets in Vault, we’ll have to read them to use them in
    our

    applications or infrastructure scripts.


    To read a key that is stored in Vault, we go to a Terminal to execute this command:


    ```

    ```

    vault kv get secret/vmadmin

    ```

    ```


    In this command, we use the `kv` operation with the `get` operator, and we indicate
    in the

    parameter the complete path of the key to get the protected value within our example,

    `secret/vmadmin`.


    The following screenshot shows the command execution, as well as its output:


    ![](img/d3344b39c888aab0b832625465f837c9_452_0.png)


