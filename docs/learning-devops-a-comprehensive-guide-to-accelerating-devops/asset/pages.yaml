- pgno: 51
  md: '# # 2 Provisioning Cloud Infrastructure with Terraform


    In the previous chapter, we introduced the tools, practices, and benefits of **Infrastructure
    as Code (IaC)** and its impact on DevOps culture. Out of all of the IaC tools
    that have been mentioned, one that is particularly popular and powerful is **Terraform**,
    which is part of the HashiCorp tools suite.


    In this chapter, we will explore the basics of using Terraform to provision a
    cloud infrastructure, using Azure as an example. We will start with an overview
    of its strengths compared to other IaC tools. We will learn how to install it
    in both manual mode and automatic mode, and then we will create our first Terraform
    script to provision an Azure infrastructure with the use of best practices and
    its automation in a **Continuous Integration (CI)/Continuous Deployment (CD)**
    process. Finally, we will go a little deeper with the implementation of a remote
    backend for the Terraform state file.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# # Technical requirements


    This chapter will explain how you can use Terraform to provision an Azure infrastructure
    as an example of cloud infrastructure. Therefore, you will need an Azure subscription,
    which you can get, for free, at https://azure.microsoft.com/en-us/free/.


    In addition, we will require a code editor to write the Terraform code. There
    are several editors out there, but I will be using **Visual Studio Code**. It
    is free, lightweight, multiplatform, and has several extensions for Terraform.
    You can download it at https://code.visualstudio.com/. The complete source code
    of this chapter is available at https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP02.


    Check out the following video to view the Code in Action:

    https://bit.ly/3p7x63h


    # # Installing Terraform


    Terraform is a command-line tool that, in its basic version, is open source, uses
    the **HashiCorp Configuration Language (HCL)**, is declarative, and is relatively
    easy to read. Its main advantage is the use of the same language to deploy on
    a multitude of cloud providers such as Azure, AWS, and Google—the complete list
    is available at https://www.terraform.io/docs/providers/.


    Terraform has other advantages:


    +   - It''s multiplatform, and it can be installed on Windows, Linux, and Mac.

    +   - It allows a preview of infrastructure changes before they are implemented.


    +   - Installing Terraform

    +   - Configuring Terraform for Azure

    +   - Writing a Terraform script to deploy an Azure infrastructure

    +   - Running Terraform for deployment

    +   - Understanding the Terraform life cycle with different command-line options

    +   - Protecting the state file with a remote backend'
  merge: -1
  img_proc: true
- pgno: 53
  md: '+   - It allows the parallelization of operations by considering resource dependencies.

    +   - It integrates a very large number of providers.


    Terraform can be installed onto your system in a number of ways. Let’s begin by
    looking at the manual installation method.


    # # Manual installation


    To install Terraform manually, perform the following steps:


    +   1. Go to the official download page at https://www.terraform.io/ downloads.html.
    Then, download the package corresponding to your operating system.

    +   2. After downloading, unzip and copy the binary into an execution directory
    (for example, inside c:\Terraform).

    +   3. Then, the PATH environment variable must be completed with the path to
    the binary directory. For detailed instructions, please view the video at https://
    learn.hashicorp.com/tutorials/terraform/install-cli.


    Now that we’ve learned how to install Terraform manually, let’s take a look at
    the options available to us to install it using a script.


    # # Installation by script


    Script installation automates the installation or update of Terraform on a remote
    server that will be in charge of executing Terraform code, such as on a Jenkins
    slave or an Azure Pipelines agent.


    # # Installing Terraform by script on Linux


    To install the Terraform binary on Linux, we have two solutions. The first solution
    is to install Terraform using the following script:


    ```

    ```

    TERRAFORM_VERSION="1.0.0" #Update with your desired version

    curl -Os https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
    \

    && curl -Os https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_SHA256SUMS
    \

    && curl https://keybase.io/hashicorp/pgp_keys.asc | gpg --import \

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 54
  md: '```

    && curl -Os https://releases.hashicorp.com/

    terraform/${{TERRAFORM_VERSION}}/terraform_${{TERRAFORM_VERSION}}_

    SHA256SUMS.sig \

    && gpg --verify terraform_${{TERRAFORM_VERSION}}_SHA256SUMS.sig

    terraform_${{TERRAFORM_VERSION}}_SHA256SUMS \

    && shasum -a 256 -c terraform_${{TERRAFORM_VERSION}}_SHA256SUMS

    2>&1 | grep "${{TERRAFORM_VERSION}}_linux_amd64.zip:\sOK" \

    && unzip -o terraform_${{TERRAFORM_VERSION}}_linux_amd64.zip -d /

    usr/local/bin

    ```


    This script does the following:


    +   - It sets the `TERRAFORM_VERSION` parameter with the version to download.

    +   - It downloads the Terraform package by checking the checksum.

    +   - It unzips the package in the user''s local directory.


    > Important Note

    > This script is also available in the GitHub source for this book at https :
    //

    > github.com/PacktPublishing/Learning-DevOps-Second-

    > Edition/blob/main/CHAP02/Terraform_install_Linux.

    > sh.


    To execute this script, follow these steps:


    +   1. Open a command-line Terminal.

    +   2. Copy and paste the preceding script.

    +   3. Execute it by hitting `Enter` in the command-line Terminal.


    The following screenshot displays an execution of the script to install Terraform
    on Linux:'
