- pgno: 294
  md: 'A container is an instance that is executed from a Docker image. It is possible
    to have several instances of the same image within a container that the application
    will run.

    Finally, a volume is a storage space that is physically located on the host OS
    (that is,

    outside the container), and it can be shared across multiple containers if required.
    This

    space will allow the storage of persistent elements such as files or databases.


    To manipulate these elements, we will use command lines, which will be discussed
    as we

    progress through this chapter.


    In this section, we discussed Docker Hub and the different steps for creating
    an account.

    Then, we looked at the steps for installing Docker Desktop locally, and finally,
    we finished

    with an overview of Docker elements.


    We will now start working with Docker, and the first operation we will look at
    is the

    creation of a Docker image from a Dockerfile.


    # # Creating a Dockerfile


    A basic Docker element is a file called a **Dockerfile**, which contains step-by-step

    instructions for building a Docker image.


    To understand how to create a Dockerfile, we''ll look at an example that allows
    us to build

    a Docker image that contains an Apache web server and a web application.


    Let''s start by writing a Dockerfile.


    # # Writing a Dockerfile


    To write a Dockerfile, we will first create a **HyperText Markup Language (HTML)**
    page

    that will be our web application. So, we''ll create a new `appdocker` directory
    and an

    `index.html` page in it, which includes the example code that displays welcome
    text on a

    web page, as follows:


    ```

    <html>

    <body>

    <h1>Welcome to my new app</h1>

    This page is test for my demo Dockerfile.<br />

    Enjoy ...

    </body>

    </html>

    ```'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'Then, in the same directory, we create a Dockerfile (without an extension)
    with the

    following content, which we will detail right after:


    ```

    FROM httpd:latest

    COPY index.html /usr/local/apache2/htdocs/

    ```


    To create a Dockerfile, start with the FROM statement. The required FROM statement

    defines the base image, which we will use for our Docker image—any Docker image
    is

    built from another Docker image. This base image can be saved either in Docker
    Hub or

    in another registry, such as JFrog Artifactory, Nexus Repository, or ACR.


    In our code example, we use the Apache httpd image tagged as the latest version,

    https://hub.docker.com/_/httpd/, and we use the FROM httpd:latest

    Dockerfile instruction.


    Then, we use the COPY instruction to execute the image construction process. Docker

    copies the local index.html file that we just created into the /usr/local/apache2/

    htdocs/ directory of the image.


    > Note

    > The source code for this Dockerfile and the HTML page can be found here:

    > https://github.com/PacktPublishing/Learning-

    > DevOps-Second-Edition/tree/main/CHAP09/appdocker.


    We have just looked at the FROM and COPY instructions of the Dockerfile, but there
    are

    other instructions as well that we''ll cover in the following section.


    # # Dockerfile instructions overview


    We previously mentioned that a Dockerfile file is comprised of instructions, and
    we also

    looked at a concrete example with the FROM and COPY instructions. There are other

    instructions that will allow you to build a Docker image. Here is an overview
    of the

    principal instructions that can be used for this purpose:


    +   • FROM: This instruction is used to define the base image for our image, as
    shown in

    +   the example detailed in the preceding _Writing a Dockerfile_ section.


    +   • COPY and ADD: These are used to copy one or more local files into an image.

    +   The ADD instruction supports an extra two functionalities, to refer to a **Uniform**

    +   **Resource Locator (URL)** and to extract compressed files.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '> Note

    > For more details about the differences between COPY and ADD, you can

    > read this article: https://nickjanetakis.com/blog/docker-

    > tip-2-the-difference-between-copy-and-add-in-a-

    > dockerfile.


    +   • RUN and CMD: These instructions take a command as a parameter that will
    be

    +   executed during the construction of the image. The RUN instruction creates
    a

    +   layer so that it can be cached and versioned. The CMD instruction defines
    a default

    +   command to be executed during the call to run the image. The CMD instruction
    can

    +   be overwritten at runtime with an extra parameter provided.


    You can write the following example of the RUN instruction in a Dockerfile to

    execute the apt-get command:


    ```

    RUN apt-get update

    ```


    With the preceding instruction, we update the apt packages that are already

    present in the image and create a layer. We can also use the CMD instruction in
    the

    following example, which will display a docker message during execution:


    ```

    CMD "echo docker"

    ```


    +   • ENV: This instruction allows you to instantiate environment variables that
    can be

    +   used to build an image. These environment variables will persist throughout
    the life

    +   of the container, as follows:


    ```

    ENV myvar=mykey

    ```


    The preceding command sets a myvar environment variable with the mykey value

    to the container.


    +   • WORKDIR: This instruction gives the execution directory of the container,
    as follows:


    ```

    WORKDIR usr/local/apache2

    ```


    That was an overview of Dockerfile instructions. There are other instructions
    that are

    commonly used, such as EXPOSE, ENTRYPOINT, and VOLUME, which you can find in

    the official documentation at https://docs.docker.com/engine/reference/

    builder/.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'We have just observed that the writing of a Dockerfile is performed with different
    instructions, such as FROM, COPY, and RUN, which are used to create a Docker image.
    Now, let''s look at how to run Docker in order to build a Docker image from a
    Dockerfile, and run that image locally to test it.


    # # Building and running a container on a local machine


    So far in the chapter, we have discussed Docker elements and have looked at an
    example of a Dockerfile that is used to containerize a web application. Now, we
    have all the elements to run Docker.


    The execution of Docker is performed by different operations, as outlined here:


    +   - Building a Docker image from a Dockerfile

    +   - Instantiating a new container locally from this image

    +   - Testing our locally containerized application


    Let''s take a deep dive into each operation.


    # # Building a Docker image


    We''ll build a Docker image from our previously created Dockerfile that contains
    the following instructions:


    ```

    FROM httpd:latest

    COPY index.html /usr/local/apache2/htdocs/

    ```


    We''ll go to a terminal to head into the directory that contains the Dockerfile,
    and then execute the `docker build` command with the following syntax:


    ```

    docker build -t demobook:v1 .

    ```


    The `-t` argument indicates the name of the image and its tag. Here, in our example,
    we call our image demobook, and the tag we''ve added is v1.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'The . (dot) at the end of the command specifies that we will use the files
    in the current

    directory. The following screenshot shows the execution of this command:


    ![](img/d3344b39c888aab0b832625465f837c9_298_0.png)


    Figure 9.9 – docker build command


    We can see in this preceding execution the three steps of the Docker image builder,
    as

    follows:


    +   1. Docker downloads the defined base image.


    +   2. Docker copies the index.html file in the image.


    +   3. Docker creates and tags the image.


    When you execute the docker build command, it downloads the base image indicated

    in the Dockerfile from Docker Hub, and then Docker executes the various instructions

    that are mentioned in the Dockerfile.


    Note

    Note that if during the first execution of the docker build command you

    get a Get https://registry-1.docker.io/v2/library/

    httpd/manifests/latest: unauthorized: incorrect

    username or password error, then execute the docker logout

    command. Next, restart the docker build command, as indicated in this

    article: https://medium.com/@blacksourcez/fix-docker-

    error-unauthorized-incorrect-username-or-password-

    in-docker-f80c45951b6b.


    At the end of the execution, we obtain a locally stored Docker demobook image.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '> Note

    > The Docker image is stored in a local folder system depending on your OS.

    > For more information about the location of Docker images, you can read this

    > article: http://www.scmgalaxy.com/tutorials/location-

    > of-dockers-images-in-all-operating-systems/.


    We can also check if the image is successfully created by executing the following
    Docker

    command:


    ```

    docker images

    ```


    Here is the output of the preceding command:


    ```

    PS C:\Users\Administrator\Documents\Learning-DevOps-Second-Edition\CHAP09\appdocker>
    docker images

    REPOSITORY TAG IMAGE ID CREATED SIZE

    demobook v1 9a3862a66c65 5 minutes ago 143MB

    gcr.io/k8s-minikube/kicbase v0.0.12-snapshot3 25ac91b9c8d7 14 months ago 952MB

    ```


    Figure 9.10 – docker images command


    This command displays a list of Docker images on my local machine, and we can
    see the

    demobook image we just created. So, the next time the image is built, we will
    not need to

    download the httpd image again.


    Now that we have created a Docker image of our application, we will instantiate
    a new

    container of this image.


    # # Instantiating a new container of an image


    To instantiate a new container of our Docker image, we will execute the docker
    run

    command in our Terminal, with the following syntax:


    ```

    docker run -d --name demoapp -p 8080:80 demobook:v1

    ```


    The -d parameter indicates that the container will run in the background. In the
    --name

    parameter, we specify the name of the container we want. In the -p parameter,
    we indicate

    the desired port translation. In our example, this would mean port 80 of the container

    will be translated to port 8080 on our local machine. And finally, the last parameter
    of the

    command is the name of the image and its tag.


    The execution of this command is shown in the following screenshot:


    ```

    PS C:\Users\Administrator\Documents\Learning-DevOps-Second-Edition\CHAP09\appdocker>
    docker run -d --name demoapp -p 8080:80 demobook:v1

    6cce2099b174cbe29fcd4d88d4f6uc4d5b2ebbfdf58cedfb1a5e2984e3f4e6bee7e1a

    ```


    Figure 9.11 – docker run command'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'At the end of its execution, this command displays the ID of the container,
    and the container runs in the background. It is also possible to display a list
    of containers running on the local machine by executing the following command:


    ```

    `docker ps`

    ```


    The following screenshot shows the execution with our container:


    ![](img/d3344b39c888aab0b832625465f837c9_300_0.png)


    Figure 9.12 – `docker ps` command


    After the execution of each container, we have its shortcut ID, its associated
    image, its name, its execution command, and its translation port information displayed.


    So, we have built a Docker image and instantiated a new container of that image
    locally. We will now see how to run a web application that is in the local container.


    # # Testing a container locally


    _Everything that runs in a container remains inside it_—this is the principle
    of container isolation. However, in the port translation that we did previously,
    you can test your container on your local machine with the `run` command.


    To do this, open a web browser and enter `http://localhost:8080` with 8080, which
    represents the translation port indicated in the command. You should be able to
    see the following result:


    ![](img/d3344b39c888aab0b832625465f837c9_300_1.png)


    Figure 9.13 – Docker application launched


    We can see the content of our `index.html` page displayed.


    In this section, we looked at the different Docker commands that can be used to
    build a Docker image. Then, we instantiated a new container from that image, and
    finally, we tested it locally.


    In the next section, we will see how to publish a Docker image in Docker Hub.'
  merge: -1
  img_proc: true
- pgno: 301
  md: "# # Pushing an image to Docker Hub\n\nThe goal of creating a Docker image that\
    \ contains an application is to be able to use it on\nservers that contain Docker\
    \ and host the company's applications, just as with a VM.\n\nIn order for an image\
    \ to be downloaded to another computer, it must be saved in a Docker\nimage registry.\
    \ As already mentioned in this chapter, there are several Docker registries that\n\
    can be installed on-premises, which is the case for JFrog Artifactory and Nexus\
    \ Repository.\n\nIf you want to create a public image, you can push (or upload)\
    \ it to Docker Hub, which\nis Docker's public (and free, depending on your license)\
    \ registry. We will now see how to\nupload the image we created in the previous\
    \ section to Docker Hub. To do this, you need\nto have an account on Docker Hub,\
    \ which we created prior to installing Docker Desktop.\n\nTo push a Docker image\
    \ to Docker Hub, perform the following steps:\n\n+   1. **Sign in to Docker Hub**:\
    \ Log in to Docker Hub using the following command:\n+   \n+   ```\n+   docker\
    \ login -u <your dockerhub login>\n+   ```\n\nWhen executing the command, you\
    \ will be asked to enter your Docker Hub\npassword and indicate that you are connected\
    \ to the Docker registry, as shown in\nthe following screenshot:\n\n![](img/d3344b39c888aab0b832625465f837c9_301_0.png)\n\
    \n+   2. **Retrieve the image ID**: The next step consists of retrieving the ID\
    \ of the image that\n+   has been created. To do so, we will execute the `docker\
    \ images` command to\n+   display a list of images with their ID.\n\n![](img/d3344b39c888aab0b832625465f837c9_301_1.png)\n\
    \n+   3. **Tag the image for Docker Hub**: With the ID of the image we retrieved,\
    \ we will now\n+   tag the image for Docker Hub. To do so, the following command\
    \ is executed:\n+   \n+   ```\n+   docker tag <image ID> <dockerhub login>/demobook:v1\n\
    +   ```\n\nThe following screenshot shows the execution of this command on the\
    \ created image:\n\n![](img/d3344b39c888aab0b832625465f837c9_301_2.png)"
  merge: -1
  img_proc: true
- pgno: 302
  md: '# ## 4. Push the Docker image to Docker Hub


    After tagging the image, the last step is to push the tagged image to Docker Hub.


    For this purpose, we will execute the following command:


    ```

    docker push docker.io/<dockerhub login>/demobook:v1

    ```


    The following screenshot shows the execution of the preceding command:


    ![](img/d3344b39c888aab0b832625465f837c9_302_0.png)


    We can see from this execution that the image is uploaded to Docker Hub.


    To view the pushed image in Docker Hub, we connect to the Docker Hub web portal
    at https://hub.docker.com/ and see that the image is present, as shown in the
    following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_302_1.png)


    By default, the image pushed to Docker Hub is in public mode—everybody can view
    it in the explorer and use it.


