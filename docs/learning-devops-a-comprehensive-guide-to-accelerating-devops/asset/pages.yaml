- pgno: 204
  md: 'The execution of this command performs these actions, as follows:


    1. Creates a new directory with the name of the repository.

    2. Creates a local repository with its initialization and configuration.

    3. Downloads the remote code.


    The team member can therefore modify and make changes to the code.


    # # Updating the code


    When the code is modified and the developer updates their changes on the remote
    repository, they will perform exactly the same actions as when the remote repository
    was initialized, with the execution of the following commands:


    ```

    git add .

    git commit -m "update the code"

    git push origin master

    ```


    We added the files to the next commit, created a commit, and pushed the commit
    to the remote repository.


    The last remaining step is the retrieval of updates by other members.


    # # Retrieving updates


    When one member updates the remote repository, it is possible to retrieve these
    updates and update our local repository with the changes by running the `git pull`
    command, as follows:


    ```

    git pull origin master

    ```


    The following screenshot shows the execution of this `git pull` command:


    ![](img/d3344b39c888aab0b832625465f837c9_204_0.png)


    Figure 6.32 – git pull command'
