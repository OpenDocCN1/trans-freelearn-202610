    Gitflow branch pattern and its utility.


    # ## Branching strategy with Gitflow


    When we start using branches in Git, the question that often arises is: _Which
    is the right

    branch strategy to use_? In other words, what is the key that we need to isolate
    our code—is

    it by environment, functionality, theme, or release?


    This question has no universal answer, and the management of branches within a
    project

    depends on the context of the project. However, there are branch strategy patterns
    that

    have been approved by several communities and a multitude of users that allow
    a better

    collaboration process in a project under Git.


    I suggest we have a closer look at one of these branch patterns, which is Gitflow.


    # ### The Gitflow pattern


    One of these patterns is **Gitflow**, developed by _nvie_, which is very popular
    and has a very

    easy-to-learn Git workflow.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# A branch diagram of Gitflow is shown here:


    ![](img/d3344b39c888aab0b832625465f837c9_211_0.png)


    Figure 6.42 – Gitflow diagram


    Let’s look at the details of this workflow, as well as the purpose of each of
    these branches in their order of creation, as follows:


    +   1. First of all, we have the `master` branch, which contains the code that
    is currently in production. No developer is working directly on it.


    +   2. From this `master` branch, we create a `develop` branch, which is the branch
    that will contain the changes to be deployed in the next delivery of the application.


    +   3. For each of the application’s functionalities, a `feature/<name of the
    feature>` branch is created (/ will hence create a `feature` directory) from the
    `develop` branch.


    +   4. As soon as a feature is finished being coded, the branch of the feature
    is merged into the `develop` branch.


    +   5. Then, as soon as we want to deploy all of the latest features developed,
    we create a `release` branch from `develop`.


    +   6. The `release` branch content is deployed in all environments successfully.


    +   7. As soon as the deployment in production has taken place, the `release`
    branch is merged with the `master` branch, and, with this merge operation, the
    `master` branch contains the production code. Hence, the code that is on the `release`
    branch and feature branch is no longer necessary, and these branches can be deleted.


    +   8. If a bug is detected in production, we create a `hotfix/<bug name>` branch;
    then, once the bug is fixed, we merge this branch into the `master` and `develop`
    branches to propagate the fix on the next branches and deployments.


    After seeing the workflow of the Gitflow pattern, we’ll discuss the tools that
    facilitate its implementation.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# # Gitflow tools


    To help teams and developers to use Gitflow, _nvie_ created a Git override command-line
