- pgno: 232
  md: '# # Using Azure Pipelines for CI/CD


    Azure Pipelines is one of the services offered by Azure DevOps. It was previously
    known as **Visual Studio Team Services (VSTS)**.


    Azure DevOps is a complete DevOps platform provided by Microsoft that is fully
    accessible via a web browser and requires no installation. It is very useful for
    the following reasons:


    +   - The DevOps tools manage their code in a **version control system (VCS)**.


    +   - It manages a project in agile mode.


    +   - It deploys applications in a CI/CD pipeline, to centralize packages.


    +   - It performs manual test plans.


    Each of these features is combined into services that are summarized in this table:


    | Service name | Description | Documentation link |

    |---|---|---|

    | Azure Repos | This is an VCS that we looked at in the previous chapter. | https://azure.microsoft.com/en-us/services/devops/repos/
    |

    | Azure Boards | This is a service for project management in agile mode with sprints,
    backlogs, and boards. | https://azure.microsoft.com/en-us/services/devops/boards/
    |

