- pgno: 346
  md: '# ## 3. Finally, we publish the chart in our Kubernetes cluster by running
    the `helm install <chart name> <chart path root>` command, as follows:


    ```

    ```

    helm install demochart ./demobook

    ```

    ```


    The following screenshot shows the execution of the preceding command:


    ![](img/d3344b39c888aab0b832625465f837c9_346_0.png)


    To check the package installation by Helm, run the `kubectl get pods` command
    to display a list of created pods.


    The following screenshot shows a list of created pods:


    ![](img/d3344b39c888aab0b832625465f837c9_346_1.png)


    And run the `helm ls` command to display a list of installed Helm charts, as shown
    in the following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_346_2.png)


    We can see in the preceding screenshot the `demochart` Helm chart that is installed
    on the Kubernetes cluster.


    In this section, we have seen an overview of the installation and use of Helm,
    which is the package manager for Kubernetes. Then, we learned about the installation
    of Helm charts from Artifact Hub. Finally, we learned how to create a custom Helm
    chart and install this chart on a Kubernetes cluster.


    In the next section, we will learn how to publish a custom Helm chart to a private
    Helm repository—that is, ACR.'
  merge: -1
