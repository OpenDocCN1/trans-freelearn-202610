- pgno: 335
  md: '# ## 5. After clicking on the SIGN IN button, the dashboard is displayed, as
    follows:


    ![](img/d3344b39c888aab0b832625465f837c9_335_0.png)


    Figure 10.8 – Kubernetes dashboard resources list


    We have just seen how to install a Kubernetes cluster on a local machine, and
    then we installed and configured the Kubernetes web dashboard in this cluster.
    We will now deploy our first application in the local Kubernetes cluster using
    **YAML Ain’t Markup Language (YAML)** specification files and `kubectl` commands.


    # # A first example of Kubernetes application deployment


    After installing our Kubernetes cluster, we will deploy an application in it.
    First of all, it is important to know that when we deploy an application in Kubernetes,
    we create a new instance of the Docker container in a Kubernetes **pod** object,
    so we first need to have a Docker image that contains the application.


    For our example, we will use the Docker image that contains a web application
    that we have pushed into Docker Hub in _Chapter 9, Containerizing Your Application
    with Docker_.'
  merge: -1
  img_proc: true
- pgno: 336
  md: "To deploy this instance of the Docker container, we will create a new k8sdeploy\
    \ folder,\nand inside it, we will create a Kubernetes deployment YAML specification\
    \ file (myapp-\ndeployment.yml) with the following content:\n\n```\n```\n---\n\
    apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: webapp\nspec:\n  selector:\n\
    \    matchLabels:\n      app: webapp\n  replicas: 2\n  template:\n    metadata:\n\
    \      labels:\n        app: webapp\n    spec:\n      containers:\n        - name:\
    \ demobookk8s\n          image: mikaelkrif/demobook:latest\n          ports:\n\
    \            - containerPort: 80\n```\n```\n\nIn this preceding code snippet,\
    \ we describe our deployment in the following way:\n\n+   - The apiVersion property\
    \ is the version of api that should be used.\n+   - In the Kind property, we indicate\
    \ that the specification type is deployment.\n+   - The replicas property indicates\
    \ the number of pods that Kubernetes will create\n+     in the cluster; here,\
    \ we choose two instances.\n\nIn this example, we chose two replicas, which can—at\
    \ the very least—distribute the traffic\nload of the application (if there is\
    \ a high volume of load, we can put in more replicas),\nwhile also ensuring the\
    \ proper functioning of the application. Therefore, if one of the\ntwo pods has\
    \ a problem, the other (which is an identical replica) will ensure the proper\n\
    functioning of the application."
  merge: -1
  img_proc: true
- pgno: 337
  md: 'Then, in the `containers` section, we indicate the image (from Docker Hub)
    with `name`

    and `tag`. Finally, the `ports` property indicates the port that the container
    will use within

    the cluster.


    > Note

    > This source code is also available at `https://github.com/`

    > `PacktPublishing/Learning-DevOps-Second-Edition/`

    > `blob/main/CHAP10/k8sdeploy/myapp-deployment.yml`.


    To deploy our application, we go to our Terminal and execute one of the essential

    `kubectl` commands (`kubectl apply`), as follows:


    ```

    `kubectl apply -f myapp-deployment.yml`

    ```


    The `-f` parameter corresponds to the YAML specification file.


    This command applies the deployment that is described in the YAML specification
    file on

    the Kubernetes cluster.


    Following the execution of this command, we will check the status of this deployment

    by displaying a list of pods in the cluster. To do this in the Terminal, we execute
    the

    `kubectl get pods` command, which returns a list of cluster pods. The following

    screenshot shows the execution of the deployment and displays the information
    in the

    pods, which we use to check the deployment:


    ![](img/d3344b39c888aab0b832625465f837c9_337_0.png)


    Figure 10.9 – kubectl apply command


    What we can see in the preceding screenshot is that the second command displays
    our

    two pods, with the name (`webapp`) specified in the YAML file, followed by a **unique**

    **identifier** (UID), and that they are in a `Running` status.


    We can also visualize the status of our cluster on the Kubernetes web dashboard,
    the

    `webapp` deployment with the Docker image that has been used, and the two pods
    that

    have been created. For more details, we can click on the different links of the
    elements.


    Our application has been successfully deployed in our Kubernetes cluster but,
    for the

    moment, it is only accessible inside the cluster, and for it to be usable, we
    need to expose it

    outside the cluster.'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'In order to access the web application outside the cluster, we must add a service
    type and

    a NodePort category element to our cluster. To add this service type and NodePort

    element, in the same way as for deployment, we will create a second YAML file
    (myapp-

    service.yml) of the service specification in the same k8sdeploy directory, which
    has

    the following code:


    ```

    ```

    ---

    apiVersion: v1

    kind: Service

    metadata:

    name: webapp

    labels:

    app: webapp

    spec:

    type: NodePort

    ports:

    - port: 80

    targetPort: 80

    nodePort: 31000

    selector:

    app: webapp

    ```

    ```


    In the preceding code snippet, we specify the kind, Service, as well as the type
    of

    service, NodePort.


    Then, in the ports section, we specify the port translation: port 80, which is
    exposed

    internally, and port 31000, which is exposed externally to the cluster.


    > > **Note**

    > >

    > > The source code of this file is also available at https://github.com/

    > > PacktPublishing/Learning-DevOps-Second-Edition/

    > > blob/main/CHAP10/k8sdeploy/myapp-service.yml.


    To create this service on the cluster, we execute the kubectl apply command, but
    this

    time with our myapp-service.yml file as a parameter, as follows:


    ```

    ```

    kubectl apply -f myapp-service.yml

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'The execution of the command creates the service within the cluster, and, to
    test our

    application, we open a web browser with the http://localhost:31000 URL, and

    our page is displayed as follows:


    ![](img/d3344b39c888aab0b832625465f837c9_339_0.png)


    Figure 10.10 – Demo Kubernetes application


    Our application is now deployed on a Kubernetes cluster, and it can be accessed
    from

    outside the cluster.


    In this section, we have learned that the deployment of an application, as well
    as the

    creation of objects in Kubernetes, is achieved using specification files in YAML
    format and

    several kubectl command lines.


    The next step is to use Helm packages to simplify the management of the YAML

    specification files.


    # Using Helm as a package manager


    As previously discussed, all the actions that we carry out on the Kubernetes cluster
    are

    done via the kubectl tool and the YAML specification files.


    In a company that deploys several microservice applications on a Kubernetes cluster,

    we often notice a large number of these YAML specification files, and this poses

    a maintenance problem. In order to solve this maintenance problem, we can use
    Helm,

    which is the package manager for Kubernetes.


    > Note

    > For more information on package managers, you can also read the Using a

    > package manager section of Chapter 7, Continuous Integration and Continuous

    > Delivery.


    Helm is, therefore, a repository that will allow the sharing of packages called
    charts that

    contain ready-to-use Kubernetes specification file templates.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# # Installing the Helm client


    So, we''ll see how to install Helm on our local Kubernetes cluster, and later,
    we''ll go through the installation of an application with Helm.


    Since version 3, Helm is composed of only one binary: a **client tool** that allows
    us mainly to install packages of Kubernetes specification files on a target Kubernetes
    cluster, list the packages of a repository, and indicate the package(s) to be
    installed.


    To install the Helm client, please refer to the installation documentation at
    `https:// helm.sh/docs/using_helm/#installing-the-helm-client`, which details
    the installation procedure according to the different OSs.


    In Windows, for example, we can install it via the **Chocolatey** package manager,
    with the execution of the following command:


    ```

    ```

    choco install kubernetes-helm -y

    ```

    ```


    To check its installation, execute the `helm --help` command, as shown in the
    following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_340_0.png)


    Figure 10.11 – helm --help command


    The execution of the command tells us that the Helm is properly installed. Now,
    we will learn how to use a public Helm chart.


    > > **Note**

    > >

    > > To learn more about Helm and to access its documentation, visit

    > > `https://helm.sh/`.


    > > **Note**

    > >

    > > In the first edition of this book, we used a Helm version prior to 3.0, and
    we learned to install the Helm Tiller plugin. Since version 3.0+, the Tiller plugin
    doesn''t need to be installed, so the Tiller installation guide is deleted in
    this second edition.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# # Using a public Helm chart from Artifact Hub


    The packages contained in a Helm repository are called **charts**. Charts are
    composed of

    files that are templates of Kubernetes specification files for an application.


    With charts, it’s possible to deploy an application in Kubernetes without having
    to write

    any YAML specification files. So, to deploy an application, we will use its corresponding

    chart, and we will pass some configuration variables of this application.


    Once Helm is installed, we will install a chart that is in the Helm public repository
    called

    **Artifact Hub** and available here: `https://artifacthub.io/`. But first, to
    display

    a list of public charts, we run the following command:


    ```

    helm search hub

    ```


