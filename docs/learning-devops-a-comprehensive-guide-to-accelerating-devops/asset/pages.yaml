    # # Configuring Azure for InSpec


    Before writing test cases to test the compliance of our Azure infrastructure,
    we need to create an Azure service principal that has read permission on the Azure
    resources that will be tested.


    To create this Azure service principal, we’ll use the same procedure that we already
    detailed in the _Configuring Terraform for Azure_ section of _Chapter 2, Provisioning
    Cloud Infrastructure with Terraform_.


    Using the **Azure CLI** tool, we execute the following `az cli` command:


    ```

    ```

    az ad sp create-for-rbac -name="<SP name> -role="Reader" -scopes="/subscriptions/<subscription
    Id>"

    ```

    ```


    This preceding command requires the following parameters:


    +   • `-name` is the name of the Azure service principal to be created.'
  merge: -1
