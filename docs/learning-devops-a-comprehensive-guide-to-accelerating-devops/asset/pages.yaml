- pgno: 489
  md: '# # DevOps for Open Source Projects


    Until a few years ago, the open source practice, which consists of delivering
    the source code of a product to the public, was essentially only used by the Linux
    community. Since then, many changes have taken place regarding open source with
    the arrival of GitHub. Microsoft has since made a lot of its products open source
    and is also one of the largest contributors to GitHub.


    Today, open source is a must in the development and enterprise world, regardless
    of whether we wish to use a project or even contribute to it.


    However, open source applications are not always free. There are sometimes licensing
    fees for plugins, support, or enterprise features. Also, in terms of support,
    using open source software can sometimes present difficulties and pitfalls when
    it comes to product support.


    Throughout this book, we have seen many instances where open source tools such
    as Terraform, Ansible, Packer, Vagrant, Jenkins, and SonarQube have been used.
    However, one of the great advantages of open source is not only the use of products
    but also the fact that we can contribute to them.


    To contribute to an open source project, we need to participate in its evolution
    by discussing issues with its use or by making suggestions regarding improving
    it. In addition, if you are a developer, you can also modify its source code to
    make it evolve.'
  merge: -1
  img_proc: true
- pgno: 490
  md: 'Finally, as a developer or a member of an operational team, we can share our
    project in

    open source and make it available to the community.


    In this chapter, we''ll discuss open source contributions and why it''s important
    to apply

    DevOps practices to all open source projects.


    All of these practices, such as the use of Git, a CI/CD pipeline, and security
    analysis, have

    already been discussed throughout this book. However, in this chapter, we''ll
    focus more

    on how to apply them in the context of our open source project.


    We will start by learning how to share the code of a project in GitHub and how
    to

    initialize a contribution to another project. We will also discuss how to manage
    pull

    requests, which is one of the most important features of the contribution. In
    addition, we

    will look at how to indicate version changes using release notes, and the topic
    of binary

    sharing in GitHub Releases. We''ll explain GitHub Actions, which allows us to
