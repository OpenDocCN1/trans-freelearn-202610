- pgno: 457
  md: 'Here is an example of Terraform code that allows you to retrieve the password
    of a VM that you want to provision from Vault. This Terraform code example is
    composed of three blocks, which are detailed as follows:


    +   1. First, we use the Vault provider for configuring the Vault URL by executing
    the following code:

    +   ```

    +   provider "vault" {

    +       address = "http://127.0.0.1:8200" #Local Vault Url

    +   }

    +   ```


    The Vault provider is configured with the Vault server configuration and its authentication.


    In our case, we configure the Vault server URL in the Terraform code, and for
    the authentication of a token, we’ll use an environment variable when running
    Terraform after an explanation of the code.


    > Note

    > For more details on the Terraform Vault provider and its configuration, see
    the following documentation:

    > https://www.terraform.io/docs/providers/vault/

    > index.html


    +   2. Then, we add the Terraform data block, vault_generic_secret, which is used
    for retrieving a secret from a Vault server. The code is illustrated in the following
    snippet:

    +   ```

    +   data "vault_generic_secret" "vmadmin_account" {

    +       path = "secret/vmadmin"

    +   }

    +   ```


    This data block allows us to retrieve (in read-only mode) the content of a secret
    stored in Vault. Here, we ask Terraform to retrieve the secret that is in the
    secret/vmadmin Vault path that we created earlier in this section.


    > Note

    > For more details on vault_generic_secret data and its configuration, see the
    following documentation:

    > https://www.terraform.io/docs/providers/vault/d/

    > generic_secret.html'
  merge: -1
  img_proc: true
- pgno: 458
  md: "# ## 3. Finally, we add an output block to use the decrypted value of the secret,\
    \ as follows:\n\n```\n```\noutput \"vmpassword\" {\n  value = \"${data.vault_generic_secret.vmadmin_account.data[\"\
    vmpassword\"]}\"\n  sensitive = true\n}\n```\n```\n\nThis block provides an example\
    \ of the exploitation of the secret.\n\nThe `data.vault_generic_secret.vmadmin_account.data[\"\
    vmpassword\"]` expression is used to get the secret returned by the previously\
    \ used data block. In the `data` array, we add the name of only those keys for\
    \ which we need the encrypted values to be recovered. Also, this output is considered\
    \ `sensitive` so that Terraform does not display its value in plaintext when it\
    \ is executed.\n\n> > **Note**\n> >\n> > The complete Terraform source code is\
    \ also available here:\n> > https://github.com/PacktPublishing/Learning-\n> >\
    \ DevOps-Second-Edition/blob/main/CHAP14/vault/\n> > terraform_usevault/main.tf\n\
    \nWe have finished writing the Terraform code; we'll now quickly execute it to\
    \ see the recovery of the secret.\n\n> > **Note**\n> >\n> > For the execution\
    \ of the code, which we have already detailed in _Chapter 2, Provisioning Cloud\
    \ Infrastructure with Terraform_, we'll only quote the commands without further\
    \ detailing them in this section.\n\nTo execute Terraform, we go in a Terminal\
    \ to the folder that contains the Terraform code, and then we proceed in this\
    \ order:\n\n+   1. Export the `VAULT_TOKEN` environment variable with the value\
    \ of the Vault token. In our development mode case, this token is provided at\
    \ the start of the Vault server. The following command shows the export of this\
    \ environment variable on a Linux OS:\n\n```\n```\nexport VAULT_TOKEN=xxxxxxxxxxxxxx\n\
    ```\n```"
  merge: -1
