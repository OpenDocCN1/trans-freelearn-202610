- pgno: 155
  md: "# # Using a Packer image with Terraform\n\nNow that we have generated a custom\
    \ VM image, we will provision a new VM based on this new image. For the provisioning\
    \ of this VM, we will continue to use IaC practices using Terraform from HashiCorp.\n\
    \nTo do this, we will take the Terraform script created in _Chapter 2, Provisioning\
    \ Cloud Infrastructure with Terraform_, and modify it to use the custom image.\n\
    \nIn the `compute.tf` script, add the following block of data, which will point\
    \ to the VM image that we generated with Packer in the last section:\n\n```\n\
    ## GET THE CUSTOM IMAGE CREATED BY PACKER\ndata \"azurerm_image\" \"customngnix\"\
    \ {\n    name = \"linuxWeb-0.0.1\"\n    resource_group_name = \"rg_images\"\n\
    }\n```\n\nIn this code, we add a block of `azurerm_image` Terraform data that\
    \ allows us to retrieve the properties of a VM image in Azure, in which we specify\
    \ the `name` property with name of the custom image, and the `resource_group_name`\
    \ property with the resource group of the image.\n\nFor more information about\
    \ this `azurerm_image` data block and its properties, refer to the documentation:\
    \ https://www.terraform.io/docs/providers/ azurerm/d/image.html.\n\nThen, in the\
    \ VM Terraform code in the `azurerm_virtual_machine` resource code (still in the\
    \ `compute.tf` file), the `storage_image_reference` section is modified with the\
    \ following code:\n\n```\nresource \"azurerm_virtual_machine\" \"vm\" {\n...\n\
    ## USE THE CUSTOM IMAGE\nstorage_image_reference {\n    id = \"${data.azurerm_image.customngnix.id}\"\
    \n}\n```\n\nWe have discussed how to write and execute Packer templates using\
    \ the HCL format that will become the preferred format for HashiCorp. We will\
    \ now learn how to provision, with Terraform, a VM based on this image that we\
    \ have just generated."
  merge: -1
  img_proc: true
