- pgno: 64
  md: "If several subscriptions are accessed, the desired one can be selected using\
    \ the following command:\n\n```\naz account set --subscription=\"<Subscription\
    \ ID>\"\n```\n\nThen, we configure the Terraform provider as before using the\
    \ `provider`, \"azurerm\" `{ }`. Of course, this authentication method should\
    \ not be done in the case of an execution on a remote server.\n\n> Important Note\n\
    > For more information regarding the provider configuration, please refer to the\
    \ documentation at https://www.terraform.io/docs/providers/azurerm/index.html.\n\
    \nTherefore, the Terraform configuration for Azure is defined by the configuration\
    \ of the provider that uses the information from an Azure SP.\n\nOnce this configuration\
    \ is complete, we can start writing the Terraform configuration to manage and\
    \ provision Azure resources.\n\n# # Writing a Terraform script to deploy an Azure\
    \ infrastructure\n\nTo illustrate the use of Terraform to deploy resources in\
    \ Azure, we will provide a simple Azure architecture with Terraform that is composed\
    \ of the following components:\n\n+   - There’s an Azure resource group.\n+  \
    \ - There’s also a network configuration that is composed of a virtual network\
    \ and a subnet.\n+   - In this subnet, we will create a virtual machine that has\
    \ a public IP address in order to be publicly available.\n\nTo do this, in the\
    \ same directory where we previously created the `provider.tf` file, we will create\
    \ a `main.tf` file with the following code:\n\n+   1. Let’s start with the code\
    \ that provides the `resource` group:\n\n```\nresource \"azurerm_resource_group\"\
    \ \"rg\" {\n  name = \"bookRg\"\n  location = \"West Europe\"\n}\n```"
  merge: -1
  img_proc: true
- pgno: 65
  md: "```\ntags {\n    environment = \"Terraform Azure\"\n}\n}\n```\n\nAny piece\
    \ of Terraform code is composed of the same syntax model, and the syntax\nof a\
    \ Terraform object consists of four parts:\n\n+   - A type of `resource` or `data`\
    \ block\n\n+   - A name of the resource to be managed (for example, `azurerm_resource_\n\
    +   group`)\n\n+   - An internal Terraform ID (for example, `rg`)\n\n+   - A list\
    \ of properties that correspond to the real properties of the resource (that is,\n\
    +   `name` and `location`)\n\n> Important Note\n> More documentation regarding\
    \ the Terraform syntax is available at\n> https://www.terraform.io/docs/configuration-0-11/\n\
    > resources.html.\n\nThis code uses the `azurerm_resource_group` Terraform resource\
    \ and will\nprovision a resource group, named `bookRg`, that will be stored in\
    \ the West\nEurope location.\n\n+   2. Then, we will write the code for the network\
    \ part:\n\n```\nresource \"azurerm_virtual_network\" \"vnet\" {\n    name = \"\
    book-vnet\"\n    location = \"West Europe\"\n    address_space = [\"10.0.0.0/16\"\
    ]\n    resource_group_name = azurerm_resource_group.rg.name\n}\n\nresource \"\
    azurerm_subnet\" \"subnet\" {\n    name = \"book-subnet\"\n    virtual_network_name\
    \ = azurerm_virtual_network.vnet.\n    name\n    resource_group_name = azurerm_resource_group.rg.name\n\
    \    address_prefix = \"10.0.10.0/24\"\n}\n```"
  merge: -1
  img_proc: true
- pgno: 66
  md: "In this Terraform code for the network part, we create the code for a VNet,\
    \ book-vnet, and in it, we create a subnet called book-subnet.\n\nIf we look at\
    \ this code carefully, we can see that, for the dependencies between the resources,\
    \ we do not put in clear IDs, but we use pointers on the Terraform resources.\n\
    \nThe VNet and subnet are the property of the resource group with ${azurerm_resource_group.rg.name},\
    \ which tells Terraform that the VNet and subnet will be created just after the\
    \ resource group. As for the subnet, it is dependent on its VNet with the use\
    \ of the ${azurerm_virtual_network.vnet.name} value; it's the explicit dependence\
    \ concept.\n\nNow, let's write the Terraform provisioning code of the virtual\
    \ machine, which is composed of the following:\n\n+   - A network interface\n\
    +   - A public IP address\n+   - An Azure Storage object for the diagnostic boot\
    \ (boot information logs)\n+   - A virtual machine\n\nThe sample code for the\
    \ **network interface** with the IP configuration is as follows:\n\n```\n```\n\
    resource \"azurerm_network_interface\" \"nic\" {\n  name = \"book-nic\"\n  location\
    \ = \"West Europe\"\n  resource_group_name = azurerm_resource_group.rg.name\n\
    \  ip_configuration {\n    name = \"bookipconfig\"\n    subnet_id = azurerm_subnet.subnet.id\n\
    \    private_ip_address_allocation = \"Dynamic\"\n    public_ip_address_id = azurerm_public_ip.pip.id\n\
    \  }\n}\n```\n```\n\nIn this Terraform code, we use an azurerm_network_interface\
    \ block (https:// www.terraform.io/docs/providers/azurerm/r/network_interface.\
    \ html). In it, we configure the name, region, resource group, and IP configuration\
    \ with the dynamic IP address of the network interface."
  merge: -1
  img_proc: true
- pgno: 67
  md: "The code for public ip address, which has an IP address in the subnet we just\
    \ created, is as follows:\n\n```\n```\nresource \"azurerm_public_ip\" \"pip\"\
    \ {\n  name = \"book-ip\"\n  location = \"West Europe\"\n  resource_group_name\
    \ = \"${azurerm_resource_group.rg.name}\"\n  public_ip_address_allocation = \"\
    Dynamic\"\n  domain_name_label = \"bookdevops\"\n}\n```\n```\n\nIn this Terraform\
    \ code, we use an azurerm_public_ip block at https://www. terraform.io/docs/providers/azurerm/r/public_ip.html.\
    \ In it, we configure the dynamic allocation of the IP address and the DNS label.\n\
    \nThe code for storage account, which we use for the boot diagnostic logs, is\
    \ as follows:\n\n```\n```\nresource \"azurerm_storage_account\" \"stor\" {\n \
    \ name = \"bookstor\"\n  location = \"West Europe\"\n  resource_group_name = azurerm_resource_group.rg.name\n\
    \  account_tier = \"Standard\"\n  account_replication_type = \"LRS\"\n}\n```\n\
    ```\n\nIn this Terraform code, we use an azurerm_storage_account block at https://\
    \ www.terraform.io/docs/providers/azurerm/r/storage_account.html. In it, we configure\
    \ the name, region, resource group, and type of storage, which, in our case, is\
    \ Standard LRS.\n\n> > **Important Note**\n> > The documentation for the storage\
    \ account can be found at https:// docs.microsoft.com/en-us/azure/storage/common/\
    \ storage-account-overview."
  merge: -1
  img_proc: true
- pgno: 68
  md: "And the code for the Ubuntu virtual machine, which contains the ID of the network\
    \ interface created earlier, is as follows:\n\n```\n```\nresource \"azurerm_linux_virtual_machine\"\
    \ \"vm\" {\n  name = \"bookvm\"\n  location = \"West Europe\"\n  resource_group_name\
    \ = azurerm_resource_group.rg.name\n  vm_size = \"Standard_DS1_v2\"\n  network_interface_ids\
    \ = [\"${azurerm_network_interface.nic.id}\"]\n  storage_image_reference {\n \
    \   publisher = \"Canonical\"\n    offer = \"UbuntuServer\"\n    sku = \"16.04-LTS\"\
    \n    version = \"latest\"\n  }\n  ...\n}\n```\n```\n\nIn this Terraform code,\
    \ we use an azurerm_linux_virtual_machine block at https://registry.terraform.io/providers/hashicorp/azurerm/\
    \ latest/docs/resources/linux_virtual_machine. In it, we configure the name, size\
    \ (Standard_DS1_V2), reference to the network_interface Terraform object, and\
    \ the type of virtual machine operating system (Ubuntu).\n\nAll of these code\
    \ sections are exactly like the previous ones with the use of an explicit dependency\
    \ to specify the relationships between the resources.\n\n> > **Important Note**\n\
    > > This complete source code is available at https://github.com/ PacktPublishing/Learning-DevOps-Second-Edition/\
    \ tree/main/CHAP02/terraform_simple_script.\n\nWe have just created a complete\
    \ Terraform script that allows us to provision a small Azure infrastructure. However,\
    \ as in any language, there are good practices regarding file separation, applying\
    \ a clear and readable code, and, finally, the use of built-in functions."
  merge: -1
  img_proc: true
- pgno: 69
  md: "# # Following some Terraform good practices\n\nWe have just looked at an example\
    \ of Terraform code to provision an Azure infrastructure,  \nbut it is also useful\
    \ to look at some good practices for writing Terraform code.\n\n# ## Better visibility\
    \ with the separation of files\n\nWhen executing Terraform code, all of the configuration\
    \ files in the `execution`  \ndirectory that have the `.tf` extension are automatically\
    \ executed; in our example, we have  \n`provider.tf` and `main.tf`. It is good\
    \ to separate the code into several files in order to  \nimprove the readability\
    \ of the code and its evolution.\n\nUsing our example script, we can do better\
    \ by separating it with the following:\n\n+   - `Rg.tf`: This contains the code\
    \ for the resource group.\n\n+   - `Network.tf`: This contains the code for the\
    \ VNet and subnet.\n\n+   - `Compute.tf`: This contains the code for the network\
    \ interface, public IP, storage,  \n+     and virtual machine.\n\n> > **Important\
    \ Note**  \n> > The complete code with separate files can be located at `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP02/terraform_separate_files`.\n\
    \n# ## The protection of sensitive data\n\nCare must be taken with sensitive data\
    \ in the Terraform configuration, such as passwords  \nand access permissions.\
    \ We have already learned that, for access authentication to Azure,  \nit is not\
    \ necessary to leave them in the code. Additionally, in our example concerning\
    \  \nthe administrator account of the virtual machine, note that the password\
    \ of the admin  \naccount of the virtual machine has been clearly specified in\
    \ this Terraform configuration.  \nTo remedy this, we can use a strong secret\
    \ manager to store passwords, such as Azure Key  \nVault or HashiCorp Vault, and\
    \ get them via Terraform."
  merge: -1
  img_proc: true
- pgno: 70
  md: "# # Dynamizing the configuration with variables and interpolation functions\n\
    \nWhen writing the Terraform configuration, it is important to take into account—from\
    \ the beginning—that the infrastructure that will host an application is very\
    \ often the same for all stages. However, only some information will vary from\
    \ one stage to another, such as the name of the resources and the number of instances.\n\
    \nTo give more flexibility to the code, we must use variables in the code with\
    \ the following steps:\n\n+   1. Declare the variables by adding the following\
    \ sample code in the global Terraform code. Alternatively, we can add it within\
    \ another file (such as `variables.tf`) for better readability of the code:\n\
    +   \n+   ```\n+   variable \"resource_group_name\" {\n+       description =\"\
    Name of the resource group\"\n+   }\n+   variable \"location\" {\n+       description\
    \ =\"Location of the resource\"\n+       default =\"West Europe\"\n+   }\n+  \
    \ variable \"application_name\" {\n+       description =\"Name of the application\"\
    \n+   }\n+   ```\n\n+   2. Instantiate their values in another `.tfvars` file,\
    \ named `terraform.tfvars`, with the `variable_name=value` syntax, similar to\
    \ the following:\n+   \n+   ```\n+   resource_group_name =\"bookRg\"\n+   application_name\
    \ =\"book\"\n+   ```\n\n+   3. Use these variables in code with `var.<name of\
    \ the variable>`; for example, in the resource group Terraform code, we can write\
    \ the following:\n+   \n+   ```\n+   resource \"azurerm_resource_group\" \"rg\"\
    \ {\n+       name = var.resoure_group_name\n+       location = var.location\n\
    +       tags {\n+           environment = \"Terraform Azure\"\n+       }\n+  \
    \ }\n+   ```"
  merge: -1
  img_proc: true
- pgno: 71
  md: "```\n}\n}\n```\n\nIn addition to this, Terraform has a large list of built-in\
    \ functions that can be used to\nmanipulate data or variables. To learn more about\
    \ these functions, please refer to the\nofficial documentation at `https://www.terraform.io/docs/configuration/\n\
    functions.html`.\n\nOf course, there are many other good practices, but these\
    \ are to be applied from the first\nlines of code to ensure that your code is\
    \ well maintained.\n\n> **Important Note**\n> \n> The complete and final code\
    \ of this example is available at `https://\n> github.com/PacktPublishing/Learning-DevOps-Second-\n\
    > Edition/tree/main/CHAP02/terraform_vars_interp`.\n\nWe have written a Terraform\
    \ configuration, using best practices, which allows us to create\na simple cloud\
    \ infrastructure in Azure that provides a network and a virtual machine.\nNow,\
    \ let's take a look at how to run Terraform with our code in order to provision\
    \ this\ninfrastructure.\n\n# # Running Terraform for deployment\n\nWith the Terraform\
    \ configuration written, we now need to run Terraform to deploy\nour infrastructure.\n\
    \nHowever, before any execution, first, it is necessary to provide authentication\
    \ with the\nAzure SP to ensure that Terraform can manage the Azure resources.\n\
    \nTo do this, we can either set the environment variables specific to Terraform\
    \ to contain the\ninformation of the SP created earlier in the _Configuring Terraform\
    \ for Azure_ section, or we\ncan use the `az cli` script.\n\nThe following script\
    \ exports the four Terraform environment variables in the Linux OS:\n\n```\nexport\
    \ ARM_SUBSCRIPTION_ID=xxxxx-xxxxx-xxxxx-xxxx\nexport ARM_CLIENT_ID=xxxxx-xxxxx-xxxxx-xxxx\n\
    export ARM_CLIENT_SECRET=xxxxxxxxxxxxxxxxxxxx\nx\nexport ARM_TENANT_ID=xxxxx-xxxxx-xxxxx-xxxx\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 72
  md: '# # Additionally, we can use the az cli script with the login command:


    ```

    az login

    ```


    Once authenticated, we can run the Terraform workflow.


    In our scenario, we begin with an empty Azure subscription without any Azure resource
    groups; however, in the real world, our subscription might already contain a resource
    group.


    Before running Terraform, in the Azure portal, check that you do not have a resource
    group in your subscription, as follows:


    ![](img/d3344b39c888aab0b832625465f837c9_72_0.png)


    Figure 2.9 – No resource group on Azure


    To run Terraform, we need to open a command-line Terminal such as CMD, PowerShell,
    or Bash and navigate to the directory where the Terraform configuration files
    we wrote earlier are located.


    The Terraform configuration is executed in several steps, including initialization,
    the preview of changes, and the application of those changes.


    Next, let’s take a look, in detail, at the execution of these steps, starting
    with the initialization step.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# # Initialization


    The initialization step allows Terraform to do the following:


    +   - Initialize the Terraform context to check and make the connection between
    the Terraform provider and remote service—in our case, this is with Azure.


    +   - Download the plugin(s) of the provider(s)—in our case, it will be the azurerm
    provider.


    +   - Check the code variables.


    To execute the initialization, run the init command:


    ```

    terraform init

    ```


    The following is a screenshot of terraform init:


    ![](img/d3344b39c888aab0b832625465f837c9_73_0.png)


    Figure 2.10 – Executing the terraform init command'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'As we have gathered during its execution of the preceding command, Terraform
    does the following:


    +   - It downloads the latest version of the `azurerm` plugin.

    +   - It creates a working `.terraform` directory.


    The following is a screenshot of the `.terraform` directory:


    ![](img/d3344b39c888aab0b832625465f837c9_74_0.png)


    Figure 2.11 – The Terraform configuration directory


    > > **Important Note**

    > > For more information about the `init` command line, please refer to

    > the documentation at `https://www.terraform.io/docs/

    > commands/init.html`.


    Once the initialization step is complete, we can proceed to the next step, which
    is previewing the changes.


    # # Previewing the changes


    The next step is to preview the changes made to the infrastructure before applying
    them.

    To do this, run Terraform with the `plan` command. When executed, the plan

    automatically uses the `terraform.tfvars` file to set the variables.

    To execute it, launch the `plan` command:


    ```

    ```

    terraform plan

    ```

    ```'
  merge: -1
  img_proc: true
