    # # Deploying a container to ACI with a CI/CD pipeline


    One of the major reasons Docker has quickly become attractive to developers and
    operations teams is because the deployment of Docker images and containers has
    made CI and CD pipelines for enterprise applications easier.


    To automate the deployment of our application, we will create a CI/CD pipeline
    that deploys the Docker image containing our application in ACI.


    ACI is a managed service by Azure that allows you to deploy containers very easily,
    without having to worry about the hardware architecture.


    > > **Note**

    > > To learn more about ACI, head to the official page at `https://azure.microsoft.com/en-us/services/container-instances/`.'
