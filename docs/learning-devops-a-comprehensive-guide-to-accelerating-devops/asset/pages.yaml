- pgno: 62
  md: "Here, we have just discovered how to create an SP in Azure AD, and we have\
    \ given it permissions to manipulate the resources of our Azure subscriptions.\n\
    \nNow, let's learn how to configure Terraform to use our Azure SP.\n\n# # Configuring\
    \ the Terraform provider\n\nOnce the Azure SP has been created, we will configure\
    \ our Terraform configuration to connect to Azure using this SP. To do this, follow\
    \ these steps:\n\n+   1. In a directory of your choice, create a new filename,\
    \ `provider.tf` (the `extension .tf` file corresponds to Terraform files), which\
    \ contains the following code:\n+   \n+   ```\n+   provider \"azurerm\" {\n+ \
    \   features {}\n+    subscription_id = \"<subscription ID>\"\n+    client_id\
    \ = \"<Client ID>\"\n+    client_secret = \"<Client Secret>\"\n+    tenant_id\
    \ = \"<Tenant Id>\"\n+   }\n+   ```\n+   \n+   In the preceding code, we indicate\
    \ that the provider we are using is `azurerm`. The authentication information\
    \ to Azure is the SP that has been created, and we add new block **features**\
    \ that provide the possibility that we can customize the behavior of the Azure\
    \ provider resources.\n+   \n+   However, for security reasons, it is not advisable\
    \ to put identification information in plain text inside your configuration, especially\
    \ if you know that this code might be accessible by other people.\n\n+   2. Therefore,\
    \ we will improve the preceding code by replacing it with this one:\n+   \n+ \
    \  ```\n+   provider \"azurerm\" {\n+    features {}\n+   }\n+   ```\n\n+   3.\
    \ So, we delete the credentials in the Terraform configuration, and we will pass\
    \ the identification values to specific Terraform environment variables:\n+  \
    \ \n+   - `ARM_SUBSCRIPTION_ID`\n+   - `ARM_CLIENT_ID`"
  merge: -1
  img_proc: true
- pgno: 63
  md: '+   - ARM_CLIENT_SECRET

    +   - ARM_TENANT_ID


    > > **Important Note**

    > > For more information regarding the azurerm provider, please refer to

    > the documentation at https://registry.terraform.io/

    > providers/hashicorp/azurerm/latest/docs. We will learn

    > how to set these environment variables later in this chapter, in the Running

    > Terraform form deployment section.


    As a result, the Terraform code no longer contains any identification information.


    We have just learned how to configure Terraform for Azure authentication. Now,
    we will

    explain how to quickly configure Terraform to perform local development and testing.


    # # The Terraform configuration for local development and testing


    When you work locally and want to test the Terraform code quickly—for example,
    in a

    sandbox environment—it might be more convenient and faster to use your own Azure

    account instead of using an SP.


    To do this, it is possible to connect to Azure beforehand using the az login command.

    Then, enter your identification information in the window that opens.


    The following is a screenshot of the Azure login window:


    ![](img/d3344b39c888aab0b832625465f837c9_63_0.png)


    Figure 2.8 – The Azure Sign in page with Azure login'
  merge: -1
