    In this section, we have looked at the architecture of SonarQube, along with details
    about the client and server components. Then, we looked at the different installation
    methods that are available and the configuration of SonarQube. In the next section,
    we will look at how developers can perform real-time code analysis using SonarLint
    before they commit their code.


    # Real-time analysis with SonarLint


    Developers who use SonarQube in a CI context often face the problem of having
    to wait too long before they get the results of the SonarQube analysis. They must
    commit their code and wait for the end of the CI pipeline before they get the
    results of the code analysis.


    To address this problem and, therefore, improve the daily lives of developers,
    SonarSource—the editor of SonarQube—provides another tool, SonarLint, which allows
    real-time code analysis.


    SonarLint is a free and open source tool (https://www.sonarlint.org/) that downloads
    differently depending on your development tool and development language. SonarLint
    is available for Eclipse, IntelliJ IDEA, Visual Studio, and Visual Studio Code
    (VS Code) integrated development environments (IDEs).'
