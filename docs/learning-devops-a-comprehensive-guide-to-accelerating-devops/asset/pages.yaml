  md: '# # Contributing to open source projects using pull requests


    When we want to contribute to an open source project in GitHub, we need to make
    changes to the source code of the application that is in the repository of our
    GitHub account. To merge these code changes to the initial repository, we must
    perform a **merge** operation.


    In GitHub, there is an element called a **pull request** that allows us to perform
    a merge operation between repositories. In addition to performing a simple and
    classic merge between code branches, a pull request also adds a whole new aspect
    of collaboration by providing features that allow different contributors to discuss
    code changes.


