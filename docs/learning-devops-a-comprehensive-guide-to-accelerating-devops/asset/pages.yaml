  md: 'We can gather from the portal that the resources specified in the Terraform
    code have been provisioned successfully.


    So, we have just learned how Terraform is useful for provisioning infrastructure
    using three main commands:


    +   - The `init` command to initialize the context

    +   - The `plan` command to preview the changes

    +   - The `apply` command to apply the changes


    In the next section, we will explore other Terraform commands and the Terraform
    life cycle.


    # # Understanding the Terraform life cycle with different command-line options


    We have just discovered that applying changes to a piece of infrastructure with
    Terraform is mainly done using three commands. They include the `init`, `plan`,
    and `apply` commands. However, Terraform has other very practical and important
    commands that can be used to best manage the life cycle of our infrastructure,
    and the question of how to execute Terraform in an automation context such as
    a CI/CD pipeline must also be considered.


    Among the other operations that can be done on a piece of infrastructure is the
    cleaning up of resources by removing them. This is done to either better rebuild
    or remove temporary infrastructure.


    # # Using destroy to better rebuild


    One of the steps in the life cycle of infrastructure that is maintained by IaC
    is the removal of the infrastructure; do not forget that one of the objectives
    and benefits of IaC is to be able to make rapid changes to infrastructure but
    also create environments on demand. That is to say, we create and keep environments
    as long as we need them, and we will destroy them when they are no longer used,
    thereby allowing the company to make financial savings.


    To accomplish this, it is necessary to automate the removal of the infrastructure
    in order to be able to rebuild it quickly.'
  merge: -1
  img_proc: true
