    ARM_TENANT_ID=<tenant ID>`

    ```


    > Note

    > For Windows, we can use the PowerShell $env command to set an

    > environment variable.


    The first step of authentication is done, and we will now check the Packer template
    we

    wrote.


    # Checking the validity of the Packer template


    Before executing Packer to generate the image, we will execute the `packer validate`

    command to check that our template is correct.


    So, inside the folder that contains the Packer template, we execute the following
    command

    on the template:


    ```

    `packer validate azure_linux.json`

    ```


    The output of the execution of this command returns the status of the check for
