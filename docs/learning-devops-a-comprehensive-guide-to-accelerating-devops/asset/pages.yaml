    original repository will be updated with the code changes we have made.


    In this section, we have seen that, with a pull request, we have a simple way
    of contributing to an open source project in GitHub by proposing code changes.
    Then, the project owner can either accept this pull request and merge the code
    or refuse the changes. In the next section, we will learn how to manage the changes
    that we''ve made to our project using the changelog file.


    # # Managing the changelog file and release notes


    When we host a project as open source, it is good practice to provide information
    to users about the changes that are being applied to it as they occur. This change
    logging system (also called **release notes**) is all the more important if, in
    addition to the source code, our repository also publicly provides a binary of
    the application since the use of this binary is dependent on its different versions
    and code changes.


    Logically, we could find the history of code changes by navigating through the
    history of Git commits. However, this would be too tedious and time-consuming
    for Git novices. For these reasons, we will indicate the change in history with
    the code versions in a text file that can be read by everyone. This file has no
    fixed nomenclature or formalism, but for simplicity, we have decided to call it
    `CHANGELOG.md`.


    So, this changelog file is a text file in markdown format, which is easy to edit
    with simple formatting and is placed at the root of the repository. In this file,
    the history of the changes is provided in a list and doesn''t give away too many
    details about each change.'
  merge: -1
  img_proc: true
