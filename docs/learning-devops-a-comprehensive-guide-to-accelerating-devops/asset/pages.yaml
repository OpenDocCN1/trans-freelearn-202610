  md: '# # Contributors


    # ## About the author


    **Mikael Krief** (born in 1980) lives in France and works as a DevOps engineer.


    He loves to share his passion through various communities such as the HashiCorp
    User Group. In 2019, he wrote the first edition of this book, and in 2020, he
    wrote _Terraform Cookbook_ (Packt Publishing), and also contributes to many public
    projects, writes blogs and books, and speaks at conferences.


    He is interested in HashiCorp products and specializes in the use of Terraform
    in several company contexts.


    For all his contributions and passion, he has received the Microsoft **Most Valuable
    Professional** (MVP) award, which Microsoft has awarded him for the last 6 years
    and he has been nominated and selected as a Hashicorp Ambassador since 2020.


    _I would like to extend my thanks to my family for accepting that I needed to
    work long hours on this book during family time. I would like to thank Meeta Rajani
    for giving me the opportunity to write this second edition of this book, which
    was a very enriching experience. Special thanks to Romy Dias and Vaidehi Sawant
    for their valuable input and time reviewing this book and to the entire Packt
    team for their support during the course of writing this book._'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# # About the reviewers


    **Kevin Bridges** is a senior DevOps engineer at Alegeus. Kevin’s worked with
    a wide range of tools supporting stable releases and hotfixes. He’s relatively
    new to the cloud space (Azure), is enjoying it so far, and just received Azure
    Fundamentals certification in June 2021.


    Kevin spent 20 years in the Army in active and reserve capacities. He graduated
    from Granite State College with a Bachelor of Science in information technology
    in 2009 and graduated with an MBA from the University of New Hampshire (Manchester)
    in May 2015.


    Kevin loves making complicated things simple.


    > _I would like to thank all my family, friends, and colleagues for all their
    support_


    **Deb Bhattacharya** applies Agile and DevOps to make organizations more successful.
    Over 20 years, Deb has helped over 50 teams across 4 countries to be more Agile
    and to be more DevOps. Deb is passionate about that.


    Deb’s other passion is sports. When Deb was younger, he used to play professional
    table tennis. He won many tournaments, but most importantly, he coached tournament-winning
    table tennis teams. Deb still enjoys playing table tennis.


    Deb uses all his experience from his hands-on software development background
    and his sports background to develop high-performing Agile and DevOps teams. The
    two passions nicely come together here.


    > _I am thankful to Anand Athani, the delivery manager I reported to some 20 years
    ago when I was an engineering lead. I was writing the thesis paper for my master’s
    and Anand suggested Rational Unified Process (RUP). That started my Agile journey.
    The learning and contributing are still going on._'
