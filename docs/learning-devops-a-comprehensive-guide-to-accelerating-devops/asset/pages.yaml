- pgno: 389
  md: '# # Integration of Newman in the CI/CD pipeline process


    Newman is a tool that automates the execution of Postman requests from the command
    line, which will quickly allow us to integrate it into a CI/CD pipeline.


    To simplify its integration in a pipeline, we go to the first step in the directory
    that contains the JSON files that were exported from Postman and create an npm
    configuration file—package.json.


    This will have the following content:


    ```

    {

    "name": "postman",

    "version": "1.0.0",

    "description": "postmanrestapi",

    "scripts": {

    "testapilocal": "newman run DemoBook.postman_collection.json -e Local.postman_environment.json
    -r junit,cli --reporter junit-export result-tests-local.xml",

    "testapiQA": "newman run DemoBook.postman_collection.json -e QA.postman_environment.json
    -r junit,cli --reporter-junit export result-tests-qa.xml"

    },

    "devDependencies": {

    "newman": "^5.3.0"

    }

    }

    ```


    In the scripts section, we put the two scripts that will be executed with the
    command lines that we saw in the previous section and we add to them the -r argument,
    which allows the output of the command with reporting in JUnit format, while,
    in the DevDependencies section, we indicate that we need the Newman package.


    That’s it; we have all the files that are necessary for integrating Newman’s execution
    into a CI/CD pipeline.'
  merge: -1
  img_proc: true
