- pgno: 91
  md: '# # 3 Using Ansible for Configuring IaaS Infrastructure


    In the previous chapter, we talked about provisioning an Azure cloud infrastructure
    with Terraform. If this infrastructure contains **virtual machines** (VMs), once
    they’ve been provisioned, it is necessary to configure their systems and install
    all the necessary middleware. This configuration will be necessary for the proper
    functionality of the applications that will be hosted on the VM.


    There are several **Infrastructure as Code** (IaC) tools available for configuring
    VMs and the most well-known are Ansible, Puppet, Chef, SaltStack, and PowerShell
    DSC. Among them, Ansible from Red Hat (`https://www.ansible.com/overview/ it-automation`)
    stands out for its many assets, as follows:


    +   • It is declarative and uses the easy-to-read YAML language.


    +   • Ansible only works with one executable.


    +   • It does not require agents to be installed on the VMs to be configured.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '+   - A simple SSL/WinRM connection is required for Ansible to connect to remote
    VMs.

    +   - It has a template engine and a vault to encrypt/decrypt sensitive data.

    +   - It is idempotent.


    The main uses cases of Ansible are as follows:


    +   - Configuring a VM with middleware and hardening, which we will learn about
    in

    +   this chapter

    +   - Infrastructure provisioning, such as Terraform, but using YAML configuration

    +   - Security compliance to test that the system or network configuration conforms
    to

    +   the enterprise requirements


    In this chapter, we will learn how to install Ansible, and then use it to configure
    a VM with

    an inventory and a playbook. We will also learn how to protect sensitive data
    with Ansible

    Vault before discussing how to use a dynamic inventory in Azure.


    The following topics will be covered in this chapter:


    +   - Installing Ansible

    +   - Creating an Ansible inventory

    +   - Executing the first playbook

    +   - Executing Ansible

    +   - Protecting data with Ansible Vault

    +   - Using a dynamic inventory for an Azure infrastructure


    # ## Technical requirements


    To follow along with the chapter, you must meet the following technical requirements:


    +   - To install Ansible, we need an OS such as Red Hat, Debian, CentOS, macOS,
    or any

    +   of the BSDs. For those who have Windows, you can install the **Windows Subsystem

    +   for Linux (WSL)**; refer to the documentation at `https://docs.microsoft.

    +   com/en-us/windows/wsl/install-win10`.

    +   - Python 2 (version 2.7) or Python 3 (version 3.5+) must be installed on the
    machine

    +   that runs Ansible. You can download it here: `https://www.python.org/

    +   downloads/`. For more information about the Ansible requirements, refer to
    the

    +   documentation here: `https://docs.ansible.com/ansible/latest/

    +   installation_guide/intro_installation.html#control-node-

    +   requirements`.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '+   - An Ansible playbook uses YAML configuration files, so any code editor
    would work; however, we will be using Visual Studio Code as it is very suitable.
    You can download it here: https://code.visualstudio.com/.

    +   - Most of this chapter will not focus on a particular cloud provider, except
    for the last section on Azure. We will need an Azure subscription for this, which
    we can get for free from here: https://azure.microsoft.com/en-us/free/.

    +   - To run the Ansible dynamic inventory for Azure, we need to install the Azure
