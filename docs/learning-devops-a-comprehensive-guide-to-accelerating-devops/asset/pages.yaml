- pgno: 363
  md: '# # 11 Testing APIs with Postman


    In the previous chapters, we talked about DevOps culture and **Infrastructure
    as Code**

    (IaC) with Terraform, Ansible, and Packer. Then, we saw how to use a source code

    manager with Git, along with the implementation of a CI/CD pipeline with Jenkins
    and

    Azure Pipelines. Finally, we showed the containerization of applications with
    Docker and

    their deployment in a Kubernetes cluster.


    If you are a developer, you should realize that you use APIs every day, either
    for client-side

    use (where you consume the API) or as a provider of the API.


    An API, as well as an application, must be testable, that is, it must be possible
    to test the

    different methods of this API in order to verify that it responds without error
    and that the

    response of the API is equal to the expected result.


    In addition, the proper functioning of an API is much more critical to an application

    because this API is potentially consumed by several client applications, and if
    it does not

    work, it will have an impact on all of these applications.


    The common API challenges are that we need to script or develop a dedicated application

    client to test each API individually or a workflow of multiple API execution.'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'In this chapter, we will learn how to test an API with a specialized tool called
    **Postman**. We will explore the use of collections and variables, then we will
    write Postman tests, and finally, we will see how to automate the execution of
    Postman tests with Newman in a CI/ CD pipeline.


    This chapter covers the following topics:


    +   - Creating a Postman collection

    +   - Using environments and variables

    +   - Writing Postman tests

    +   - Executing tests locally

    +   - Understanding the Newman concept

    +   - Preparing Postman collections for Newman

    +   - Running the Newman command line

    +   - Integration of Newman in the CI/CD pipeline process


    # # Technical requirements


    In this chapter, we will use **Newman**, which is a Node.js package. Therefore,
    we need to install Node.js and npm on our computer beforehand, which we can download
    at `https://nodejs.org/en/`.


    For the demo APIs that are used in this chapter, we will use an example that is
    provided on the internet: `https://jsonplaceholder.typicode.com/`.


    The GitHub repository, which contains the complete source code used in this chapter,
    can be found at `https://github.com/PacktPublishing/Learning-DevOps- Second-Edition/tree/main/CHAP11`.


    Check out the following video to see the code in action: `https://bit.ly/3s7239U`.


    # # Creating a Postman collection with requests


    Postman is a free client tool in a graphical format that can be installed on any
    type of OS. Its role is to test APIs through requests, which we will organize
    into collections. It also allows us to dynamize API tests through the use of variables
    and the implementation of environments. Postman is famous for its ease of use,
    but also for the advanced features that it offers.'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'In this section, we will learn how to create and install a Postman account,
    then we will

    create a collection that will serve as a folder to organize our requests, and
    finally, we will

    create a request that will test a demo API.


    Before we use Postman, we will need to create a Postman account by going to `https://

    www.postman.com/` and clicking on the **Sign Up for Free** button. In the form,
    click on

    the **Create Account** link, as shown in the following screenshot:


    ![](img/d3344b39c888aab0b832625465f837c9_365_0.png)


    Figure 11.1 – Postman signup


    Now, you can either create a Postman account for yourself by filling out the form,
    or you

    can create an account using your Google account.


    This account will be used to synchronize Postman data between your machine and
    your

    Postman account. This way, the data will be accessible on all of your workstations.


    After creating a Postman account, we will look at how to download and install
    it on a

    local machine.'
  merge: -1
