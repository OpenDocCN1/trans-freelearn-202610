- pgno: 60
  md: '# # Configuring Terraform for Azure


    Before writing the Terraform code in which to provision a cloud infrastructure
    such

    as Azure, we must configure Terraform to allow the manipulation of resources in
    an

    Azure subscription.


    To do this, first, we will create a new Azure **Service Principal (SP)** in Azure
    Active

    **Directory (AD)**, which, in Azure, is an _application user_ who has permission
    to manage

    Azure resources.


    > > **Important Note**

    > > For more details about the Azure SP, please read the documentation at

    > > https://docs.microsoft.com/en-us/azure/active-

    > > directory/develop/app-objects-and-service-

    > > principals.


    For this Azure SP, we have to assign to it the contributing permissions on the
    subscription

    in which we will create resources.


    # ## Creating the Azure SP


    This operation can be done either via the Azure portal (all steps are detailed
    within

    the official documentation at https://docs.microsoft.com/en-us/azure/

    active-directory/develop/howto-create-service-principal-portal)

    or via a script by executing the following `az cli` command (which we can launch
    in

    Azure Cloud Shell).


    The following is a template `az cli` script that you have to run to create an
