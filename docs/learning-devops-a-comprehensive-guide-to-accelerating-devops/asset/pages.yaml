    \ the client ID\n\n+   - The client secret\n\n+   - The tenant ID\n\nThe SP is\
    \ created in Azure AD. The following screenshot shows the Azure AD SP:\n\n![](img/d3344b39c888aab0b832625465f837c9_61_1.png)\n\
