    \ code:\n\n```\n```\n\"provisioners\": [\n{\n\"type\": \"shell\",\n\"execute_command\"\
    : \"sudo sh -c '{{ .Vars }} {{ .Path }}'\",\n\"inline\": [\n```\n```"
