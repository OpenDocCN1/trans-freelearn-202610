  \ ASP.NET Core 项目。\n入门管道\n从最小管道开始，您可以自定义该管道来生成和部署代码。\n现有 Azure Pipelines YAML 文件\n\
  在存储库的任何分支中选择 Azure Pipelines YAML 文件。\n\n图 7.51 – Azure Pipelines：选择使用现有 YAML 文件的选项\n\
  \n然后，选择管道 YAML 文件的路径，如下所示：\n\n选择现有 YAML 文件\n在存储库的任何分支中选择 Azure Pipelines YAML 文件。\n\
  分支\nmaster\n路径\n/azure-pipeline.yml\n从下拉列表中选择文件或键入文件路径\nDemoAspNetApp.git\n取消 继续\n\
  \n图 7.52 – Azure Pipelines：选择 YAML 文件\n\n通过单击 Continue 按钮进行验证。\n\n\n\n\n\n### 6.\
  \ 文件内容将显示在屏幕上。最后，要执行管道，请单击 **Run** 按钮，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_258_0.png)\n\
  \n图 7.53 – Azure Pipelines：运行管道\n\n管道已创建并正在执行。\n\n### 7. 最后，我们可以查看管道执行的详细信息，如下图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_259_0.png)\n\n图 7.54 – Azure Pipelines：作业执行\n\
  \n单击 **Job**，如上图所示，以显示每个任务执行的详细信息。您应该会看到类似这样的屏幕：\n\n![](img/d3344b39c888aab0b832625465f837c9_259_1.png)\n\
  \n图 7.55 – Azure Pipelines：执行详情\n\n在本节中，我们学习了如何使用包含管道定义的 YAML 文件的基础知识，该文件还有许多其他非常有趣的功能。要了解更多信息，请参阅此处的文档：https://docs.microsoft.com/en-us/azure/devops/pipelines/?view=azure-devops。\n\
  \n现在让我们看看如何使用 GitLab CI 创建 CI 管道。\n\n### 使用 GitLab CI\n\n在本章的前几节中，我们学习了如何使用 Jenkins\
  \ 和 Azure Pipelines 创建 CI/CD 管道。\n\n现在，让我们看看使用另一种正在流行起来的 DevOps 工具的实验：GitLab CI。GitLab\
  \ CI 是 GitLab 提供的服务之一（https://about.gitlab.com/），与 Azure DevOps 类似，是一个具有以下属性的云平台：\n\
  \n- 源代码管理器\n- CI/CD 管道管理器\n- 项目管理看板\n\n它提供的其他服务列在此处：https://about.gitlab.com/features/。\n\
  \nGitLab 采用免费定价模式，附加服务需付费；定价表可在此处查看：https://about.gitlab.com/pricing/。Azure DevOps\
  \ 与 GitLab 之间的差异在此链接中详细说明：https://about.gitlab.com/devops-tools/azure-devops-vs-gitlab.html。\n\
  \n在本实验中，我们将了解以下内容：\n\n1. GitLab 身份验证\n2. 创建新项目并在 GitLab 中对其代码进行版本控制\n3. 在 GitLab\
  \ CI 中创建和执行 CI 管道\n\n### GitLab 身份验证\n\n创建 GitLab 帐户是免费的，可以通过创建 GitLab 帐户或使用外部帐户（例如\
  \ Google、GitHub、Twitter 或 Bitbucket）来完成。\n\n要创建 GitLab 帐户，我们需要访问 https://gitlab.com/users/sign_in#register-pane\
  \ 并选择身份验证类型。\n\n以下屏幕截图显示了 GitLab 身份验证表单：\n\n### GitLab.com\n\nGitLab.com 提供免费无限（私有）仓库和无限协作者。\n\
  \n- 在 GitLab.com 上探索项目（无需登录）\n- 关于 GitLab.com 的更多信息\n- GitLab.com 支持论坛\n- GitLab\
  \ 主页\n\n通过注册并登录此服务，您即表示接受我们的：\n\n- 隐私政策\n- GitLab.com 条款。\n\n![](img/d3344b39c888aab0b832625465f837c9_261_0.png)\n\
  \n图 7.56 – GitLab 注册\n\n一旦您的帐户已创建并经过身份验证，您将被带到帐户主页，该主页提供了以下屏幕截图中显示的所有功能：\n\n![](img/d3344b39c888aab0b832625465f837c9_262_0.png)\n\
  \n图 7.57 – GitLab 主页\n\n现在我们已完成身份验证，让我们继续创建新项目。\n\n### 创建新项目并管理源代码\n\n要在 GitLab\
  \ 中创建新项目，请执行以下步骤：\n\n1. 单击主页上的 **Create a project**，如下图所示：\n\n### 欢迎使用 GitLab\n\n\
  一起编写代码、测试和部署\n\n![](img/d3344b39c888aab0b832625465f837c9_263_0.png)\n\n图 7.58 –\
  \ GitLab 新建项目\n\n- 然后，我们可以从几个选项中进行选择，如下所示：\n- 要创建空项目（无代码），表单要求您输入项目名称，如下图所示：\n\n\
  ![](img/d3344b39c888aab0b832625465f837c9_263_1.png)\n\n图 7.59 – GitLab 项目配置\n\n\
  - 要从内置模板项目创建新项目，请按以下步骤操作：\n\n![](img/d3344b39c888aab0b832625465f837c9_264_0.png)\n\
  \n图 7.60 – GitLab 项目模板\n\n- 要从另一个 SVC 平台的内部或外部仓库导入代码，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_264_1.png)\n\
  \n图 7.61 – GitLab：导入代码\n\n- 要导入的代码位于外部 SVC 仓库中，如下图所示：\n\n### 为外部仓库运行 CI/CD 管道\n\n\
  连接您的外部仓库，CI/CD 管道将针对新提交运行。将创建一个仅启用 CI/CD 功能的 GitLab 项目。\n\n如果使用 GitHub，您将在 GitHub\
  \ 上看到提交和拉取请求的管道状态。[更多信息](https://docs.gitlab.com/ee/ci/external_repos/index.html)\n\
  \n**从以下位置连接仓库**\n\n![](img/d3344b39c888aab0b832625465f837c9_265_0.png)\n\n图 7.62\
  \ – GitLab：外部仓库的 CI/CD\n\n在本例中，对于本实验，我们将从第一个选项开始，即空项目，并且正如我们在表单中看到的，我们选择一个项目名称，例如\
  \ BookDemo，然后单击 **Create a project** 按钮进行验证。\n\n2. 项目创建完成后，我们将看到一个页面，指示执行不同 Git\
  \ 命令以推送代码的方法。\n\n3. 为此，在本地磁盘上，我们将创建一个新的 `gitlab-ci-demo.yml` 文件，然后复制示例的内容，该示例可在\
  \ `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP07`\
  \ 中找到，并将其放入 `gitlab-ci-demo.yml` 文件中。\n\n4. 然后，我们将在终端中执行以下命令将代码推送到仓库，详情请参见 _第 6\
  \ 章，使用 Git 管理源代码_：\n\n```\ngit init\ngit remote add origin <git repo Url>\ngit add\
  \ .\ngit commit -m \"Initial commit\"\ngit push -u origin master\n```\n\n> **注意**\n\
  > 执行期间，将出现一个身份验证窗口，要求您输入 GitLab 帐户的 **标识符 (ID)**，因为这是一个私有项目。登录 GitLab Web 门户的帐户后，您的用户名将在帐户页面\
  \ `https://gitlab.com/profile/account` 上可用。\n\n执行这些命令后，我们将获得一个包含实验代码的远程 GitLab 仓库。\n\
  \n### 以下屏幕截图显示了远程 GitLab 仓库：\n\n![](img/d3344b39c888aab0b832625465f837c9_266_0.png)\n\
  \n图 7.63 – GitLab 仓库\n\n我们的应用程序代码已存入 GitLab，现在可以使用 GitLab 创建 CI 流程了。\n\n### 创建 CI\
  \ 管道\n\n在 GitLab CI 中，CI 管道（和 CD）的创建不是通过 **图形用户界面 (GUI)** 完成的，而是通过项目根目录中的 YAML 文件完成的。\n\
  \n这种方法，即在与代码位于同一位置的文件中描述管道的过程，可以称为 **管道即代码 (PaC)**，与 **基础设施即代码 (IaC)** 类似。我们将按以下步骤操作：\n\
  \n1. 要创建此管道，我们将在应用程序代码的根目录下创建一个 `.gitlab-ci.yml` 文件，内容如下：\n\n```yaml\nimage: microsoft/dotnet:latest\n\
  stages:\n  - build\n  - test\n```\n\n```yaml\nvariables:\n  BuildConfiguration:\
  \ \"Release\"\n\nbuild:\n  stage: build\n  script:\n    - \"cd app\"\n    - \"dotnet\
  \ restore\"\n    - \"dotnet build --configuration $BuildConfiguration\"\ntest:\n\
  \  stage: test\n  script:\n    - \"cd tests\"\n    - \"dotnet test --configuration\
  \ $BuildConfiguration\"\n```\n\n> **注意**\n> 此文件的代码也可在此处查看：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP07/gitlab-ci-demo.yml。\n\
  \n我们可以在代码开头看到，我们使用了 microsoft/dotnet:latest Docker 镜像，该镜像将在容器中挂载，管道的操作将在其中执行。\n\n\
  然后，我们定义了两个阶段，一个用于构建，一个用于测试执行，以及一个将在脚本中使用的 BuildConfiguration 变量。\n\n最后，我们描述了各自目录中要执行的脚本的每个阶段。这些\
  \ .NET Core 脚本与我们在“使用 Azure Pipelines 进行 CI/CD”部分中看到的脚本相同。\n\n> **注意**\n> 关于此 .gitlab-ci.yml\
  \ 文件的格式和语法的完整文档可在此处查看：https://docs.gitlab.com/ee/ci/yaml/。\n\n2. 然后，我们将提交并推送此文件到远程仓库。\n\
  \n3. 代码推送后，我们可以看到 CI 进程已触发。\n\n\n\n\n\n\n因此，当代码被推送到仓库时，我们的 CI 流水线会被触发，现在让我们来看看如何查看其执行详情。\n\
  \n### 访问 CI 流水线执行详情\n\n要访问已执行 CI 流水线的执行详情，请执行以下步骤：\n\n1. 在 GitLab CI 菜单中，进入 **CI\
  \ / CD | 流水线**，你将看到流水线执行列表，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_268_0.png)\n\
  \n图 7.64 – GitLab 流水线\n\n2. 要显示流水线的详情，我们点击所需的流水线执行，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_268_1.png)\n\
  \n图 7.65 – GitLab 流水线执行\n\n3. 我们可以看到执行状态，以及在流水线 YAML 文件中定义的两个阶段。要查看某个阶段的执行日志详情，我们点击该阶段，如下图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_269_0.png)\n\n图 7.66 – GitLab 执行日志详情\n\
  \n我们可以看到流水线 YAML 文件中编写的脚本的执行情况。\n\n在本节中，我们了解了在 GitLab CI 中实现 CI 流水线的过程，包括初始化远程仓库、创建用于配置流水线的\
  \ YAML 文件以及执行流水线。\n\n### 摘要\n\n在本章中，我们探讨了 DevOps 中最重要的主题之一：CI/CD 流程。我们首先介绍了 CI 和\
  \ CD 的原则。然后，我们重点介绍了包管理器，涵盖了 NuGet、npm、Nexus 和 Azure Artifacts。\n\n最后，我们了解了如何使用三种不同的工具（Jenkins、Azure\
  \ Pipelines 和 GitLab CI）实现和执行端到端 CI/CD 流水线。对于每种工具，我们都介绍了应用程序源代码的归档，以及流水线的创建和执行。\n\
  \n阅读本章后，我们应该能够以源代码管理作为源来创建 CI 和 CD 流水线。此外，我们将能够选择和使用包管理器来集中和分发我们的包。\n\n在下一章中，我们将学习如何使用\
  \ Azure DevOps 为 IAC 项目创建 CI/CD 流水线，目标是执行 Packer、Terraform 和 Ansible 代码。\n\n###\
  \ 问题\n\n1. 实现 CI 流水线的先决条件是什么？\n2. CI 流水线何时会被触发？\n3. 包管理器的用途是什么？\n4. NuGet 包管理器中存储哪些类型的包？\n\
  5. Azure Artifacts 集成到哪个平台中？\n6. Jenkins 是云服务吗？\n7. 在 Azure DevOps 中，允许管理 CI/CD\
  \ 流水线的服务名称是什么？\n8. GitLab 提供哪三种服务？\n9. 在 GitLab CI 中，哪个元素允许你构建 CI 流水线？\n\n### 延伸阅读\n\
  \n如果你想了解更多关于 CI/CD 流水线的信息，可以参考以下资源：\n\n- Hands-On Continuous Integration and Delivery:\
  \ https://www.packtpub.com/virtualization-and-cloud/hands-continuous-integration-and-delivery\n\
  - Continuous Integration, Delivery, and Deployment: https://www.packtpub.com/application-development/continuous-integration-delivery-and-deployment\n\
  - Mastering Jenkins: https://www.packtpub.com/application-development/mastering-jenkins\n\
  - Azure DevOps Server 2019 Cookbook: https://www.packtpub.com/networking-and-servers/azure-devops-server-2019-cookbook-second-edition\n\
  - Mastering GitLab 12: https://www.packtpub.com/cloud-networking/mastering-gitlab-12\n"
- "## 8 使用 CI/CD 流水线部署基础设施即代码\n\n在本书的第一部分，我们学习了大量关于 **基础设施即代码 (IaC)**、其优势以及 Terraform、Packer\
  \ 和 Ansible 等工具及其命令行的知识。然后，在第二部分中，我们讨论了 Git，并专门用一章来介绍应用程序的持续集成和持续部署。\n\n但是，我们也不应忽视将\
  \ CI/CD 作为 IaC 付诸实践，这将使我们能够编排和自动化整个基础设施配置过程。\n\n正是在这本书的第二版中，我想添加这一章，以重复利用我们在前面章节中学到的所有内容，并展示如何使用\
  \ CI/CD 流水线实现 IaC，该流水线将由 Packer、Terraform 和 Ansible 组成。\n\n将要使用的流水线工具是 Azure Pipelines，我们已经在\
  \ _第 7 章，持续集成和持续交付_ 中详细介绍过它。因此，我们将学习如何编写 Azure 流水线的 YAML 文件以使用 Packer 生成镜像。然后，我们将看到如何编写\
  \ YAML 流水线以使用 Terraform 配置 **虚拟机 (VM)**，并通过执行 Ansible 在该 VM 上安装 nginx 来完成。\n\n本章涵盖以下主题：\n\
  \n- 在 Azure Pipelines 中运行 Packer\n- 在 Azure Pipelines 中运行 Terraform 和 Ansible\n\n\
  ### 技术要求\n\n本章需要以下内容：\n\n- 用于创建 Packer 镜像和配置 VM 的 Azure 订阅；你可以在此处创建免费帐户：https://azure.microsoft.com/en-us/free/search/。\n\
  - 用于创建 YAML 流水线定义的 Azure DevOps 帐户；你可以在此处创建免费帐户：https://azure.microsoft.com/en-us/pricing/details/devops/azure-devops-services/。\n\
  \n本章的源代码可在此处查看：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP08。\n\
  \n查看以下视频以观看代码实际运行情况：https://bit.ly/3BDT9ne\n\n### 在 Azure Pipelines 中运行 Packer\n\
  \n要启动我们的 IaC 流水线，我们将自动使用 Packer 创建 Azure VM 镜像。要执行此操作，我们将使用带有 YAML 格式流水线的 Azure\
  \ Pipelines。该流水线的目标是自动执行 Packer 命令。\n\n> **重要说明**\n> 有关如何在 Azure DevOps 中创建 YAML\
  \ 流水线的更多详细信息，请阅读 _第 7 章，持续集成和持续交付_。\n\n我们将在本节的实验中使用的 Packer 模板是我们在 _第 4 章，使用 Packer\
  \ 优化基础设施部署_ 中学习的代码。此源代码可在此处查看：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP08/packer/.pkr.hcl。\n\
  \n在开始使用 Packer 之前，我们需要先创建一个 Azure 资源组，用于存储流水线创建的 VM 镜像。在我们的实验中，我们将此 Azure 资源组命名为\
  \ rg_images。下图显示了 Azure 资源组：\n\n![](img/d3344b39c888aab0b832625465f837c9_273_0.png)\n\
  \n图 8.1 – Packer 镜像的 Azure 资源组\n\n现在，我们可以编写流水线代码，该代码将在 Packer 模板上执行 Packer 命令行。\n\
  \n为此，在与 Packer 模板相同的文件夹中，创建一个新的 YAML 文件来描述流水线的步骤，然后编写三个代码块，如下所示：\n\n1. 第一步是执行 `packer\
  \ init` 命令：\n\n```yaml\n- script: packer init $(Build.SourcesDirectory)/CHAP08/packer/.pkr.hcl\n\
  \  displayName: Packer init\n```\n\n2. 第二步是通过运行 `packer validate` 命令来验证 Packer 模板：\n\
  \n```yaml\n- script: packer validate $(Build.SourcesDirectory)/CHAP08/packer/.pkr.hcl\n\
  \  displayName: Packer validate template\n```\n\n3. 最后一步是通过运行 `packer build` 命令使用\
  \ Packer 构建镜像：\n\n```yaml\n- script: packer build $(Build.SourcesDirectory)/CHAP08/packer/.pkr.hcl\n\
  \  displayName: Packer build template\n  env:\n    PKR_VAR_clientid: $(PKR_VAR_clientid)\n\
  \    PKR_VAR_clientsecret: $(PKR_VAR_clientsecret)\n    PKR_VAR_subscriptionid:\
  \ $(PKR_VAR_subscriptionid)\n    PKR_VAR_tenantid: $(PKR_VAR_tenantid)\n```\n\n\n\
  \n\n\n\n在此步骤代码中，我们将 Azure 服务主体账户对应的环境变量添加到脚本中。要在 Packer 模板中使用，这些环境变量必须采用 PKR_VAR_<变量名>\
  \ 格式。\n\n> Important Note\n> 此 YAML 管道文件的完整源代码可在此处查看：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP08/packer/pipeline.yaml。\n\
  \n然后，将此文件提交并推送到你的 Git 仓库。在本实验中，我们使用 GitHub，但你也可以使用其他 Git 仓库，例如 Azure Repos 或 Bitbucket。最后一步是按照以下步骤创建并运行\
  \ Azure 管道：\n\n1. 在 Azure Pipelines 菜单中，单击 **New pipeline**：\n\n![](img/d3344b39c888aab0b832625465f837c9_274_0.png)\n\
  \n图 8.2 – 在 Azure Pipelines 中创建新管道\n\n2. 选择包含 Packer 模板和 YAML 管道文件的 Git 仓库，并选择使用现有\
  \ YAML 管道文件的选项。此步骤的所有详细信息均在第 7 章 *Continuous Integration and Continuous Delivery*\
  \ 的 *Creating the full pipeline definition in a YAML file* 节中介绍。创建管道后，在 **Edit**\
  \ 模式下，添加四个变量以存储 Azure 服务主体的凭据信息。\n\n### 变量\n\n![](img/d3344b39c888aab0b832625465f837c9_275_0.png)\n\
  \n图 8.3 – Azure Pipelines 变量\n\n这些是我们在上一步骤脚本中使用的 YAML 管道变量。\n\n3. 然后，我们可以运行管道并等待执行结束。在日志面板中，我们可以显示所有执行详细信息。\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_275_1.png)\n\n图 8.4 – Azure Pipelines\
  \ Packer 管道日志\n\n4. 最后，在 Azure 门户中，我们可以在 Azure 资源组中查看生成的 VM 镜像。\n\n![](img/d3344b39c888aab0b832625465f837c9_276_0.png)\n\
  \n图 8.5 – Azure 上的 Packer 镜像\n\n在本节中，我们学习了如何使用 Azure DevOps 中的管道自动创建 Packer 镜像。在下一节中，我们将继续介绍\
  \ IaC 管道，以在自动管道中执行 Terraform 和 Ansible 命令。\n\n### 在 Azure Pipelines 中运行 Terraform\
  \ 和 Ansible\n\n创建 Packer 管道后，我们将创建用于预配 Azure VM 的管道，该 VM 使用 Packer 创建的镜像，然后使用 Ansible\
  \ 配置此 VM。在此演示中，我们将使用 Ansible 在此 VM 上安装 nginx。\n\n此代码中使用的 Terraform 配置将预配新的 Azure\
  \ 资源组、带有子网的虚拟网络，以及带有标签 role 且值为 webserver 的 Linux VM。\n\n此完整 Terraform 代码可在此处查看：`https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP08/terraform`。我不会对其进行解释，因为它与我们在第\
  \ 2 章 *Provisioning Cloud Infrastructure with Terraform* 中学习的代码相同。\n\n我们用于在 Linux\
  \ 机器上安装 nginx 的完整 Ansible 代码可在此处查看：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP08/ansible/playbookdemo.yml。我们已在第\
  \ 3 章 *Using Ansible for Configuring IaaS Infrastructure* 中了解过它。对于 Ansible 清单，我们使用\
  \ **动态清单**，它根据特定的 Azure 资源组和 VM 上的标签来选择 VM 主机。\n\n此动态清单的配置代码可在此处查看：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP08/ansible/inv.azure_rm.yml。\n\
  \n现在我们已拥有所有 Terraform 和 Ansible 代码，可以按照以下步骤编写 Azure Pipelines 的 YAML 代码。为此，创建一个新的\
  \ azure-pipeline.yml 文件，内容如下：\n\n1. 第一步是运行带有 `init`、`plan` 和 `apply` 的 Terraform\
  \ 工作流命令：\n\n```yaml\n- script: terraform init --backend-config backend.tfvars\n\
  \  displayName: Terraform init\n  workingDirectory: $(Build.SourcesDirectory)/CHAP08/terraform\n\
  \  env:\n    ARM_CLIENT_ID: $(AZURE_CLIENT_ID)\n    ARM_CLIENT_SECRET: $(AZURE_SECRET)\n\
  \    ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)\n    ARM_TENANT_ID: $(AZURE_TENANT)\n\
  \    ARM_ACCESS_KEY: $(AZURE_ACCESS_KEY)\n- script: terraform plan\n  displayName:\
  \ Terraform plan\n  workingDirectory: $(Build.SourcesDirectory)/CHAP08/terraform\n\
  \  env:\n    ARM_CLIENT_ID: $(AZURE_CLIENT_ID)\n    ARM_CLIENT_SECRET: $(AZURE_SECRET)\n\
  \    ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)\n    ARM_TENANT_ID: $(AZURE_TENANT)\n\
  \    ARM_ACCESS_KEY: $(AZURE_ACCESS_KEY)\n- script: terraform apply -auto-approve\n\
  \  displayName: Terraform apply\n  workingDirectory: $(Build.SourcesDirectory)/CHAP08/terraform\n\
  \  env:\n    ARM_CLIENT_ID: $(AZURE_CLIENT_ID)\n    ARM_CLIENT_SECRET: $(AZURE_SECRET)\n\
  \    ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)\n    ARM_TENANT_ID: $(AZURE_TENANT)\n\
  \    ARM_ACCESS_KEY: $(AZURE_ACCESS_KEY)\n```\n\n在这些脚本任务中，我们运行以下三个命令：\n\n- 使用 Terraform\
  \ 状态后端配置的 `terraform init` 命令。\n- 用于预览更改的 `terraform plan` 命令。\n\n> Important Note\n\
  > 可选地，我们可以在此处添加一个步骤，在应用更改前手动批准 `plan` 结果。在此实验中，我们对计划更改有信心，管道可以直接应用更改。\n\n- 用于应用更改并在\
  \ VM 不存在时创建 VM 的 `terraform apply` 命令。对此命令，我们添加 `-auto-approve` 选项以自动应用更改，无需确认。\n\
  \n对于 Azure 身份验证，我们使用服务主体凭据和 Azure 存储访问密钥（用于状态后端）作为环境变量。\n\n2. 然后，在此管道中，我们继续使用以下代码执行\
  \ Ansible：\n\n```yaml\n- script: pip install ansible[azure]==2.8.6\n  displayName:\
  \ Get requirements\n- script: ansible-playbook playbookdemo.yml -i inv.azure_rm.yml\n\
  \  displayName: Ansible playbook\n  workingDirectory: $(Build.SourcesDirectory)/CHAP08/ansible\n\
  \  env:\n    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)\n    AZURE_SECRET: $(AZURE_SECRET)\n\
  \    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)\n    AZURE_TENANT: $(AZURE_TENANT)\n\
  \    ANSIBLE_HOST_KEY_CHECKING: False\n```\n\n在此代码中，第一个脚本安装动态清单所需的 Ansible Azure\
  \ 插件。\n\n第二个脚本执行 Ansible playbook，并使用在 `inv.azure_rm.yml` 文件中配置的动态清单。我们还将 Azure\
  \ 服务主体凭据用作环境变量。\n\n然后，将此文件提交并推送到你的 Git 仓库。\n\n最后一步是按照以下步骤创建并运行 Azure 管道：\n\n1. 在\
  \ Azure Pipelines 菜单中，单击 **New pipeline**。\n\n2. 选择包含 Packer 模板和 YAML 管道文件的 Git\
  \ 仓库，并选择使用现有 YAML 管道文件的选项。\n\n此步骤的所有详细信息均在第 7 章 Continuous Integration and Continuous\
  \ Delivery 的 *Creating the full pipeline definition in a YAML file* 节中介绍。\n\n3.\
  \ 创建管道后，在 **Edit** 模式下，添加五个变量以存储 Azure 服务主体的凭据信息以及用于 Terraform 状态后端的 Azure 存储访问密钥。\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_279_0.png)\n\n图 8.6 – Azure Pipelines\
  \ Terraform 和 Ansible 变量\n\n这些是我们在 YAML 管道的所有脚本步骤中使用的变量。\n\n4. 然后，我们可以运行管道并等待执行结束。在日志面板中，我们可以逐步显示所有执行详细信息。\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_280_0.png)\n\n图 8.7 – Azure Pipelines\
  \ Terraform 和 Ansible 日志详细信息\n\n我们可以在此屏幕上看到 Terraform 命令执行，然后是 Ansible 执行。\n\n5.\
  \ 最后，要验证执行是否成功，请在 Azure 门户中查找此 VM 的公共 IP。\n\n![](img/d3344b39c888aab0b832625465f837c9_280_1.png)\n\
  \n图 8.8 – Azure VM 公共 IP\n\n打开浏览器并导航到此公共 IP：\n\n\n\n\n\n### 欢迎使用 nginx！\n\n如果您看到此页面，则表示\
  \ nginx Web 服务器已成功安装并正在运行。还需要进一步配置。\n\n有关在线文档和支持，请参阅 [nginx.org](https://nginx.org/)。商业支持可在\
  \ [nginx.com](https://nginx.com/) 获得。\n\n_感谢您使用 nginx。_\n\n图 8.9 – nginx 主页\n\n\
  我们现在可以看到 nginx 的主页了。\n\n在本节中，我们学习了如何编写管道代码，以便在 Azure DevOps 中使用 YAML 管道自动执行 Terraform，然后执行\
  \ Ansible，以及 Terraform 和 Ansible 命令行。\n\n### 摘要\n\n在本章中，我们实现了基础设施即代码（IaC）的示例管道。在第一节中，我们学习了如何在管道中集成\
  \ Packer 命令行。然后，在第二部分中，我们继续使用另一个管道运行 Terraform 来预配 Azure 虚拟机，并使用 Ansible 在该虚拟机上安装\
  \ nginx。\n\n本章中使用的所有 YAML 管道代码均适用于 GitHub 和 Azure Pipelines，对于 Jenkins 或 GitLab\
  \ CI 等其他 CI/CD 工具，流程完全相同。\n\n在下一章中，我们将学习如何使用 Docker 构建和运行容器。\n\n### 问题\n\n- 1. 本章使用的工具名称是什么？\n\
  \n- 2. Terraform、Ansible 和 Packer 之间的 IaC 预配顺序是什么？\n\n### 进一步阅读\n\n如果您想了解更多关于 IaC\
  \ 管道的信息，以下是一些实验室：\n\n- Azure DevOps 上的 Terraform DevOps 实验室：`https://azuredevopslabs.com/labs/vstsextend/terraform/`。\n\
  \n- Azure DevOps 上的 Ansible DevOps 实验室：`https://www.azuredevopslabs.com/labs/vstsextend/ansible/`。\n"
- '# 第 3 部分：使用 Docker 和 Kubernetes 的容器化微服务


  在本部分中，我们将介绍 Docker 的基本用法以及如何从 Dockerfile 创建和运行容器。然后，我们将探讨 Kubernetes 的作用以及如何在 Kubernetes
  上部署更复杂的应用程序。


  本部分包含以下章节：


  - 第 9 章，使用 Docker 容器化您的应用程序

  - 第 10 章，使用 Kubernetes 有效管理容器

  '
- "## 9 使用 Docker 容器化应用程序\n\n在过去几年中，一种技术尤其在网络、社交网络和活动中引起轰动——Docker。\n\nDocker 是一种容器化工具，于\
  \ 2013 年开源。它允许您将应用程序与其主机系统隔离，使应用程序变得可移植，并在开发者的工作站上测试的代码可以部署到生产环境，而无需担心执行运行时依赖项。我们将在本章中简要讨论应用程序容器化。\n\
  \n容器是一种嵌入应用程序及其依赖项的系统。与**虚拟机（VM）**不同，容器仅包含轻量级**操作系统（OS）**以及 OS 所需的元素，例如系统库、二进制文件和代码依赖项。\n\
  \n要了解 VM 和容器之间的区别，以及为什么容器将在未来取代 VM，我建议您阅读这篇博客文章：`https://blog.docker.com/2018/08/containers-replacing-virtual-machines/`。\n\
  \nVM 和容器的主要区别在于，托管在虚拟机监控程序上的每个 VM 都包含一个完整的 OS，因此与虚拟机监控程序上的客户机 OS 完全独立。\n\n然而，容器不包含完整的\
  \ OS——只包含少数几个二进制文件——但它们依赖于客户机 OS，并使用其资源（**中央处理器（CPU）**、**随机存取存储器（RAM）**和网络）。\n\n\
  在本章中，我们将学习如何在不同平台上安装 Docker，如何创建 Docker 镜像，以及如何将其注册到 Docker Hub。然后，我们将讨论一个**持续集成/持续部署（CI/CD）**管道示例，该管道将\
  \ Docker 镜像部署到 **Azure 容器实例（ACI）**。之后，我们将展示如何使用 Docker 运行带有**命令行界面（CLI）**的工具。\n\n\
  最后，我们还将学习 **Docker Compose** 的基本概念以及如何在 ACI 中部署 Docker Compose 容器。\n\n本章涵盖以下主题：\n\
  \n- 安装 Docker\n- 创建 Dockerfile\n- 在本地计算机上构建和运行容器\n- 将镜像推送到 Docker Hub\n- 将 Docker\
  \ 镜像推送到私有注册表（ACR）\n- 使用 CI/CD 管道将容器部署到 ACI\n- 使用 Docker 运行命令行工具\n- Docker Compose\
  \ 入门\n- 在 ACI 中部署 Docker Compose 容器\n\n### 技术要求\n\n本章有以下技术要求：\n\n- 一个 Azure 订阅。您可以在此处获取免费帐户：`https://azure.microsoft.com/en-us/free/`。\n\
  - 对于某些 Azure 命令，我们将使用 Azure CLI。请参阅此处的文档：`https://docs.microsoft.com/en-us/cli/azure/install-azure-cli`。\n\
  - 在本章的最后部分，在 *为容器创建 CI/CD 管道* 节中，我们将讨论 Terraform 和 CI/CD 管道，这些内容已在 *第 2 章，使用 Terraform\
  \ 预配云基础设施* 和 *第 7 章，持续集成和持续部署* 中解释。\n\n本章中包含的脚本的所有源代码均可在此处找到：\nhttps://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP09.\n\
  \n查看以下视频，观看代码的实际运行情况：\nhttps://bit.ly/3tlJov8\n\n### 安装 Docker\n\nDocker 的守护程序是免费的，非常适合开发人员和小团队——我们将在本书中使用它。\n\
  \nDocker 是一种跨平台工具，可以安装在 Windows、Linux 或 macOS 上，并且在某些云提供商（例如 **Amazon Web Services\
  \ (AWS)** 和 Azure）上也原生存在。\n\n要运行，Docker 需要以下元素：\n\n- **Docker 客户端**：这允许您在命令行上执行各种操作。\n\
  - **Docker 守护程序**：这是 Docker 的引擎。\n- **Docker 注册表**：这是公共注册表（Docker Hub）或 Docker 镜像的私有注册表。\n\
  \n在安装 Docker 之前，我们将首先在 Docker Hub 上创建一个帐户。\n\n### 在 Docker Hub 上注册\n\nDocker Hub\
  \ 是一个称为 **注册表** 的公共空间，包含超过 200 万个由公司、社区甚至个人用户上传的公共 Docker 镜像。\n\n### 使用 Docker 容器化您的应用程序\n\
  \n要在 Docker Hub 上注册并列出公共 Docker 镜像，请执行以下步骤：\n\n1. 访问 https://hub.docker.com/，您将看到以下屏幕：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_288_0.png)\n\n图 9.1 – Docker Hub 登录页面\n\
  \n2. 用唯一标识符（ID）、电子邮件和密码填写表单。然后，单击注册按钮。\n\n3. 创建帐户后，您可以登录该网站，该帐户将允许您上传自定义镜像并下载 Docker\
  \ Desktop。\n\n4. 要查看和探索 Docker Hub 上可用的镜像，请转到探索部分，如以下屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_289_0.png)\n\
  \n图 9.2 – Docker Hub 探索页面\n\n将显示一个 Docker 镜像列表，带有搜索过滤器，您可以使用它来搜索官方镜像或经过验证的发布者的镜像，以及\
  \ Docker 认证的镜像。\n\n在 Docker Hub 上创建帐户后，我们现在将查看在 Windows 上安装 Docker。\n\n### Docker\
  \ 安装\n\n我们现在将详细讨论在 Windows 上安装 Docker。\n\n在 Windows 或 macOS 上安装 Docker Desktop 之前，我们需要检查所有许可证选项。有关\
  \ Docker Desktop 许可证的更多信息，请阅读定价页面（https://www.docker.com/pricing）和 **常见问题解答（FAQ）**页面（https://www.docker.com/pricing/faq）。\n\
  \n要在 Windows 计算机上安装 Docker Desktop，首先需要检查硬件要求，如下所示：\n\n- Windows 10/11 64 位，至少配备\
  \ 4 **千兆字节（GB）**的 RAM\n- **适用于 Linux 的 Windows 子系统 2（WSL 2）**后端或已启用 Hyper-V。如果遇到任何问题，您可以参考此文档：https://docs.docker.com/docker-for-windows/troubleshoot/#virtualization-must-be-enabled。\n\
  \n\n\n\n\n> 注意\n> 关于 WSL 的更多信息，请阅读此处的文档：\n> https://docs.microsoft.com/en-us/windows/wsl/\n\
  > install\n> 关于 Docker Desktop 要求的更多详细信息在此处指定：\n> https://docs.docker.com/desktop/windows/install/\n\
  \n要安装 Docker Desktop（它与适用于 Windows 和 macOS 的 Docker 安装程序是相同的二进制文件），请执行以下步骤：\n\n\
  1. 首先，通过单击安装文档页面 https://docs.docker.com/desktop/windows/install/ 上的 **Docker Desktop\
  \ for Windows** 按钮下载 Docker Desktop，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_290_0.png)\n\
  \n图 9.3 – Docker Desktop 下载链接\n\n2. 下载完成后，单击下载的 **可执行文件 (EXE)**。\n3. 然后，执行单个配置步骤，即安装\
  \ WSL 2 后端所需组件的可能性，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_290_1.png)\n\
  \n### 配置\n\n![](img/d3344b39c888aab0b832625465f837c9_290_2.png)\n\n图 9.4 – Docker\
  \ Desktop 配置\n\n在我们的示例中，我们将勾选此选项，以使用 WSL 2 作为后端安装 Windows 组件。\n\n4. 安装完成后，我们将收到确认消息和一个关闭安装的按钮，如下图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_291_0.png)\n\n图 9.5 – Docker Desktop\
  \ 安装结束\n\n5. 最后，要启动 Docker，请启动 Docker Desktop 程序。通知栏中将出现一个图标，指示 Docker 正在启动。然后，它将通过一个小窗口要求您登录\
  \ Docker Hub。Docker Desktop 的启动步骤如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_291_1.png)\n\
  \n图 9.6 – 从 Docker Desktop 登录 Docker Hub\n\n就这样！我们已在 Windows 上安装并启动了 Docker。\n\n\
  要在其他操作系统上安装 Docker，可以在 https://docs.docker.com/get-docker/ 阅读每个操作系统的文档。之后，您可以从此页面选择所需的目标操作系统，如下图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_292_0.png)\n\n要检查 Docker 安装，请打开终端窗口（在\
  \ Windows PowerShell 终端上也适用）并执行以下命令：\n\n`docker --help`\n\n您应该能看到类似这样的内容：\n\n![](img/d3344b39c888aab0b832625465f837c9_293_0.png)\n\
  \n图 9.8 – docker --help 命令\n\n如上图所示，该命令显示 Docker 客户端工具中可用的不同操作。\n\n在详细了解 Docker\
  \ 命令的执行之前，了解 Docker 的概念非常重要。\n\n### Docker 元素概览\n\n在执行 Docker 命令之前，我们将讨论 Docker\
  \ 的一些基本元素，即 **Dockerfile**、**容器** 和 **卷**。\n\n首先，需要知道 **Docker 镜像** 是 Docker 的基本元素，由名为\
  \ Dockerfile 的文本文档组成，其中包含我们要容器化的二进制文件和应用程序文件。\n\n**Docker 注册表** 是共享 Docker 镜像的集中式存储系统。此注册表可以是公共的（如\
  \ Docker Hub 的情况），也可以是私有的，例如 **Azure Container Registry (ACR)** 或 JFrog Artifactory。\n\
  \n容器是从 Docker 镜像执行的实例。可以在容器中拥有同一镜像的多个实例，应用程序将在其中运行。最后，卷是物理位于主机操作系统（即容器外部）上的存储空间，如果需要，可以在多个容器之间共享。此空间将允许存储持久元素，例如文件或数据库。\n\
  \n要操作这些元素，我们将使用命令行，这些命令行将在本章后续内容中讨论。\n\n在本节中，我们讨论了 Docker Hub 和创建帐户的不同步骤。然后，我们查看了在本地安装\
  \ Docker Desktop 的步骤，最后，我们以 Docker 元素概览结束。\n\n我们现在将开始使用 Docker，我们将要查看的第一个操作是从 Dockerfile\
  \ 创建 Docker 镜像。\n\n### 创建 Dockerfile\n\n一个基本的 Docker 元素是名为 **Dockerfile** 的文件，其中包含构建\
  \ Docker 镜像的逐步说明。\n\n要了解如何创建 Dockerfile，我们将查看一个示例，该示例允许我们构建包含 Apache Web 服务器和 Web\
  \ 应用程序的 Docker 镜像。\n\n让我们开始编写 Dockerfile。\n\n### 编写 Dockerfile\n\n要编写 Dockerfile，我们将首先创建一个\
  \ **超文本标记语言 (HTML)** 页面，它将是我们的 Web 应用程序。因此，我们将创建一个新的 `appdocker` 目录，并在其中创建一个 `index.html`\
  \ 页面，其中包含在网页上显示欢迎文本的示例代码，如下所示：\n\n```\n<html>\n<body>\n<h1>Welcome to my new app</h1>\n\
  This page is test for my demo Dockerfile.<br />\nEnjoy ...\n</body>\n</html>\n```\n\
  \n然后，在同一目录中，我们创建一个 Dockerfile（不带扩展名），其内容如下，我们将在稍后详细说明：\n\n```\nFROM httpd:latest\n\
  COPY index.html /usr/local/apache2/htdocs/\n```\n\n要创建 Dockerfile，请从 FROM 语句开始。必需的\
  \ FROM 语句定义基础镜像，我们将使用它来构建 Docker 镜像——任何 Docker 镜像都是从另一个 Docker 镜像构建而来。此基础镜像可以保存在\
  \ Docker Hub 或另一个注册表中，例如 JFrog Artifactory、Nexus Repository 或 ACR。\n\n在我们的代码示例中，我们使用标记为最新版本的\
  \ Apache httpd 镜像，https://hub.docker.com/_/httpd/，并使用 FROM httpd:latest Dockerfile\
  \ 指令。\n\n然后，我们使用 COPY 指令执行镜像构建过程。Docker 将我们刚刚创建的本地 index.html 文件复制到镜像的 /usr/local/apache2/htdocs/\
  \ 目录中。\n\n> 注意\n> 此 Dockerfile 和 HTML 页面的源代码可在此处找到：\n> https://github.com/PacktPublishing/Learning-\n\
  > DevOps-Second-Edition/tree/main/CHAP09/appdocker.\n\n我们刚刚查看了 Dockerfile 的 FROM\
  \ 和 COPY 指令，但还有其他指令，我们将在下一节中介绍。\n\n### Dockerfile 指令概览\n\n我们之前提到，Dockerfile 文件由指令组成，我们还查看了使用\
  \ FROM 和 COPY 指令的具体示例。还有其他指令将允许您构建 Docker 镜像。以下是可用于此目的的主要指令概览：\n\n- FROM：此指令用于定义我们镜像的基础镜像，如上一节\
  \ _编写 Dockerfile_ 中详细示例所示。\n- COPY 和 ADD：用于将一个或多个本地文件复制到镜像中。ADD 指令支持额外的两个功能，即引用\
  \ **统一资源定位符 (URL)** 和提取压缩文件。\n\n> 注意\n> 关于 COPY 和 ADD 之间差异的更多详细信息，您可以阅读此文章：https://nickjanetakis.com/blog/docker-tip-2-the-difference-between-copy-and-add-in-a-dockerfile.\n\
  \n- RUN 和 CMD：这些指令将命令作为参数，该命令将在镜像构建期间执行。RUN 指令创建一个层，以便可以缓存和版本化。CMD 指令定义在调用运行镜像时要执行的默认命令。CMD\
  \ 指令可以在运行时通过提供额外参数来覆盖。\n\n您可以在 Dockerfile 中编写以下 RUN 指令示例来执行 apt-get 命令：\n\n```\n\
  RUN apt-get update\n```\n\n使用上述指令，我们更新镜像中已存在的 apt 软件包并创建一个层。我们还可以使用 CMD 指令，如以下示例所示，该示例将在执行期间显示\
  \ docker 消息：\n\n```\nCMD \"echo docker\"\n```\n\n- ENV：此指令允许您实例化可用于构建镜像的环境变量。这些环境变量将在容器的整个生命周期中持续存在，如下所示：\n\
  \n```\nENV myvar=mykey\n```\n\n上述命令将 mykey 值设置为容器中的 myvar 环境变量。\n\n- WORKDIR：此指令给出容器的执行目录，如下所示：\n\
  \n```\nWORKDIR usr/local/apache2\n```\n\n这就是 Dockerfile 指令的概览。还有其他常用指令，例如 EXPOSE、ENTRYPOINT\
  \ 和 VOLUME，您可以在 https://docs.docker.com/engine/reference/builder/ 的官方文档中找到它们。\n\n\
  \n\n\n\n### 在本地计算机上构建和运行容器\n\n在本章迄今为止，我们已讨论 Docker 元素，并查看了用于容器化 Web 应用程序的 Dockerfile\
  \ 示例。现在，我们拥有运行 Docker 所需的所有元素。\n\nDocker 的执行通过不同的操作进行，如下所示：\n\n- 从 Dockerfile 构建\
  \ Docker 镜像\n- 从该镜像在本地实例化新容器\n- 测试我们在本地容器化的应用程序\n\n让我们深入了解每个操作。\n\n### 构建 Docker\
  \ 镜像\n\n我们将从先前创建的 Dockerfile 构建 Docker 镜像，该文件包含以下指令：\n\n```\nFROM httpd:latest\n\
  COPY index.html /usr/local/apache2/htdocs/\n```\n\n我们将转到终端并进入包含 Dockerfile 的目录，然后使用以下语法执行\
  \ `docker build` 命令：\n\n```\ndocker build -t demobook:v1 .\n```\n\n`-t` 参数指示镜像的名称及其标记。在此示例中，我们将镜像命名为\
  \ demobook，并添加的标记为 v1。\n\n命令末尾的 .（点）指定我们将使用当前目录中的文件。以下屏幕截图显示了此命令的执行：\n\n![](img/d3344b39c888aab0b832625465f837c9_298_0.png)\n\
  \n图 9.9 – docker build 命令\n\n我们可以在此前执行中看到 Docker 镜像构建器的三个步骤，如下所示：\n\n1. Docker 下载定义的基础镜像。\n\
  2. Docker 将 index.html 文件复制到镜像中。\n3. Docker 创建并标记镜像。\n\n当你执行 docker build 命令时，它会从\
  \ Docker Hub 下载 Dockerfile 中指示的基础镜像，然后 Docker 执行 Dockerfile 中提到的各种指令。\n\n> **Note**\n\
  > 请注意，如果在首次执行 docker build 命令时收到 `Get https://registry-1.docker.io/v2/library/httpd/manifests/latest:\
  \ unauthorized: incorrect username or password` 错误，则执行 docker logout 命令。接下来，重新启动\
  \ docker build 命令，如本文所示：https://medium.com/@blacksourcez/fix-docker-error-unauthorized-incorrect-username-or-password-in-docker-f80c45951b6b。\n\
  \n执行结束时，我们获得本地存储的 Docker demobook 镜像。\n\n> **Note**\n> Docker 镜像根据操作系统存储在本地文件夹系统中。有关\
  \ Docker 镜像位置的更多信息，可以阅读本文：http://www.scmgalaxy.com/tutorials/location-of-dockers-images-in-all-operating-systems/。\n\
  \n我们还可以通过执行以下 Docker 命令检查镜像是否成功创建：\n\n```\ndocker images\n```\n\n以下是前面命令的输出：\n\n\
  ```\nPS C:\\Users\\Administrator\\Documents\\Learning-DevOps-Second-Edition\\CHAP09\\\
  appdocker> docker images\nREPOSITORY TAG IMAGE ID CREATED SIZE\ndemobook v1 9a3862a66c65\
  \ 5 minutes ago 143MB\ngcr.io/k8s-minikube/kicbase v0.0.12-snapshot3 25ac91b9c8d7\
  \ 14 months ago 952MB\n```\n\n图 9.10 – docker images 命令\n\n此命令显示本地计算机上的 Docker 镜像列表，我们可以看到刚刚创建的\
  \ demobook 镜像。因此，下次构建镜像时，我们不需要再次下载 httpd 镜像。\n\n现在，我们已为应用程序创建了 Docker 镜像，将实例化该镜像的新容器。\n\
  \n### 实例化镜像的新容器\n\n要实例化 Docker 镜像的新容器，我们将在终端中执行 docker run 命令，语法如下：\n\n```\ndocker\
  \ run -d --name demoapp -p 8080:80 demobook:v1\n```\n\n-d 参数指示容器将在后台运行。在 --name\
  \ 参数中，我们指定要使用的容器名称。在 -p 参数中，我们指示所需的端口转换。在我们的示例中，这意味着容器的端口 80 将转换为本地计算机上的端口 8080。最后，命令的最后一个参数是镜像名称及其标记。\n\
  \n此命令的执行如下所示：\n\n```\nPS C:\\Users\\Administrator\\Documents\\Learning-DevOps-Second-Edition\\\
  CHAP09\\appdocker> docker run -d --name demoapp -p 8080:80 demobook:v1\n6cce2099b174cbe29fcd4d88d4f6uc4d5b2ebbfdf58cedfb1a5e2984e3f4e6bee7e1a\n\
  ```\n\n图 9.11 – docker run 命令\n\n执行结束时，此命令显示容器的 ID，容器在后台运行。也可以通过执行以下命令显示本地计算机上运行的容器列表：\n\
  \n```\ndocker ps\n```\n\n以下屏幕截图显示了我们容器的执行：\n\n![](img/d3344b39c888aab0b832625465f837c9_300_0.png)\n\
  \n图 9.12 – `docker ps` 命令\n\n每个容器执行后，我们会看到其快捷 ID、关联的镜像、名称、执行命令以及端口转换信息。\n\n因此，我们已构建\
  \ Docker 镜像并在本地实例化了该镜像的新容器。我们现在将了解如何运行本地容器中的 Web 应用程序。\n\n### 在本地测试容器\n\n_在容器中运行的所有内容都保留在容器内_——这是容器隔离的原则。但是，在我们之前进行的端口转换中，您可以使用\
  \ `run` 命令在本地计算机上测试容器。\n\n为此，打开 Web 浏览器并输入 `http://localhost:8080`，其中 8080 表示命令中指示的转换端口。您应该能够看到以下结果：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_300_1.png)\n\n图 9.13 – Docker 应用程序已启动\n\
  \n我们可以看到我们的 `index.html` 页面的内容已显示。\n\n在本节中，我们了解了可用于构建 Docker 镜像的不同 Docker 命令。然后，我们从该镜像实例化了新容器，最后在本地对其进行了测试。\n\
  \n在下一节中，我们将了解如何将 Docker 镜像发布到 Docker Hub。\n\n### 将镜像推送到 Docker Hub\n\n创建包含应用程序的\
  \ Docker 镜像的目标是能够在包含 Docker 并托管公司应用程序的服务器上使用它，就像使用虚拟机一样。\n\n为了使镜像能够下载到另一台计算机，它必须保存在\
  \ Docker 镜像注册表中。如前所述，有几个 Docker 注册表可以本地安装，例如 JFrog Artifactory 和 Nexus Repository。\n\
  \n如果要创建公共镜像，可以将其推送（或上传）到 Docker Hub，即 Docker 的公共（且免费，具体取决于您的许可证）注册表。我们现在将了解如何将上一节中创建的镜像上传到\
  \ Docker Hub。为此，您需要在 Docker Hub 上拥有一个帐户，我们在安装 Docker Desktop 之前已创建该帐户。\n\n要将 Docker\
  \ 镜像推送到 Docker Hub，请执行以下步骤：\n\n1. **登录 Docker Hub**：使用以下命令登录 Docker Hub：\n\n```\n\
  docker login -u <your dockerhub login>\n```\n\n执行命令时，系统会要求您输入 Docker Hub 密码，并指示您已连接到\
  \ Docker 注册表，如以下屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_301_0.png)\n\
  \n2. **检索镜像 ID**：下一步是检索已创建镜像的 ID。为此，我们将执行 `docker images` 命令以显示带有 ID 的镜像列表。\n\n\
  ![](img/d3344b39c888aab0b832625465f837c9_301_1.png)\n\n3. **为 Docker Hub 标记镜像**：使用我们检索到的镜像\
  \ ID，我们现在将为 Docker Hub 标记镜像。为此，执行以下命令：\n\n```\ndocker tag <image ID> <dockerhub\
  \ login>/demobook:v1\n```\n\n以下屏幕截图显示了在创建的镜像上执行此命令的情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_301_2.png)\n\
  \n\n\n\n\n### 4. 将 Docker 镜像推送到 Docker Hub\n\n为镜像打上标签后，最后一步是将打好标签的镜像推送到 Docker Hub。\n\
  \n为此，我们将执行以下命令：\n\n```\ndocker push docker.io/<dockerhub login>/demobook:v1\n```\n\
  \n以下截图显示了上述命令的执行情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_302_0.png)\n\n从这次执行中我们可以看到，镜像已上传到\
  \ Docker Hub。\n\n要在 Docker Hub 中查看推送的镜像，我们连接到 Docker Hub 网页门户 https://hub.docker.com/，可以看到该镜像已存在，如下图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_302_1.png)\n\n默认情况下，推送到 Docker Hub 的镜像处于公开模式——所有人都可以在资源管理器中查看并使用它。\n\
  \n我们可以在 Docker Hub 搜索引擎中访问此镜像，如下图所示：\n\n图 9.19 – 在 Docker Hub 中查找镜像\n\n要将此镜像设为私有——即只有经过身份验证的你才能使用它——你必须进入镜像的\
  \ Settings 选项卡，然后单击 Make private 按钮，如下图所示：\n\n图 9.20 – 将 Docker 镜像设为私有\n\n在本节中，我们介绍了通过命令行登录\
  \ Docker Hub 的步骤和 Docker 命令，然后介绍了用于将 Docker 镜像上传到 Docker Hub 的 tag 和 push 命令。\n\n\
  在下一节中，我们将通过一个 ACR 实例示例，了解如何将 Docker 镜像推送到私有 Docker 注册表。\n\n### 将 Docker 镜像推送到私有注册表\
  \ (ACR)\n\n在上一节中，我们学习了如何将 Docker 镜像推送到 Docker Hub（这是一个公共注册表）。现在，我们将学习如何将 Docker\
  \ 镜像推送到私有注册表。\n\n有许多本地或云解决方案支持 Docker 私有注册表。以下是这些解决方案的列表：\n\n- Docker registry server:\
  \ `https://docs.docker.com/registry/deploying/`\n- Artifactory from JFrog: `https://www.jfrog.com/confluence/display/JFROG/Docker+Registry`\n\
  - Amazon Elastic Container Registry (ECR): `https://aws.amazon.com/ecr/`\n- Google\
  \ Container Registry (GCR): `https://cloud.google.com/container-registry`\n- ACR:\
  \ `https://azure.microsoft.com/en-us/services/container-registry/`\n\n在本节中，我们将研究其中一种解决方案——ACR。\n\
  \n要将 Docker 镜像推送到 ACR，我们将执行以下步骤：\n\n1. 在推送 Docker 镜像之前，我们将使用以下方法之一创建 ACR 资源：\n\n\
  \   - Azure CLI (`https://docs.microsoft.com/en-us/azure/container-registry/container-registry-get-started-azure-cli`)。创建资源组和\
  \ ACR 资源的 az cli 脚本如下所示：\n\n   ```\n   az group create --name RG-ACR --location\
  \ eastus\n   az acr create --resource-group RG-ACR --name acrdemo --sku Basic\n\
  \   ```\n\n   - PowerShell (`https://docs.microsoft.com/en-us/azure/container-registry/container-registry-get-started-powershell`)。创建资源组和\
  \ ACR 资源的 PowerShell 脚本如下所示：\n\n   ```\n   New-AzResourceGroup -Name RG-ACR -Location\
  \ EastUS\n   $registry = New-AzContainerRegistry -ResourceGroupName \"RG-ARC\" -Name\
  \ \"acrdemo\" -EnableAdminUser -Sku Basic\n   ```\n\n   - Azure 门户 (`https://docs.microsoft.com/en-us/azure/container-registry/container-registry-get-started-portal`)\n\
  \n   在下一步中，我们将使用名为 demobookacr 的 ACR 资源。\n\n2. 然后，我们将通过运行以下 az cli 命令连接到 Azure 帐户：\n\
  \n   ```\n   az login\n   ```\n\n3. 我们将使用以下 az acr login 命令连接到已创建的 ACR 资源（步骤 1），并将\
  \ --name 参数作为步骤 1 中创建的 ACR 资源的名称，如下所示：\n\n   ```\n   az acr login --name demobookacr\n\
  \   ```\n\n   此命令将在后台使用 docker login 命令连接到 Docker 注册表。\n\n4. 要将 Docker 镜像推送到此 ACR\
  \ 资源，我们将执行几个命令。\n\n   第一个命令是为本地镜像创建标签，如下所示：\n\n   ```\n   docker tag demobook:v1\
  \ demobookacr.azurecr.io/demobook:v1\n   ```\n\n   第二个命令是将镜像推送到 ACR 资源，如下所示：\n\n\
  \   ```\n   docker push demobookacr.azurecr.io/demobook:v1\n   ```\n\n   这两个命令与我们学习的用于将\
  \ Docker 镜像打标签并推送到 Docker Hub 的命令完全相同，区别在于此处 ACR 的 Docker 注册表 URL 为 <acr name>.azurecr.io。\n\
  \n   以下截图显示了这些命令的执行情况：\n\n   ![](img/d3344b39c888aab0b832625465f837c9_305_0.png)\n\
  \n   图 9.21 – 将 Docker 镜像推送到 ACR\n\n   以下截图显示了 ACR 中推送的 Docker 镜像：\n\n   ![](img/d3344b39c888aab0b832625465f837c9_306_0.png)\n\
  \n   图 9.22 – ACR 中的 Docker 镜像\n\n5. 最后，要拉取此 Docker 镜像，我们将使用以下命令：\n\n   ```\n  \
  \ docker pull demobookacr.azurecr.io/demobook:v1\n   ```\n\n   在本节中，我们学习了如何使用 Docker\
  \ 在私有 Docker 注册表（即 ACR）中推送和拉取 Docker 镜像。\n\n   在下一节中，我们将了解如何使用 CI/CD 管道在托管云容器服务（ACI\
  \ 和 Terraform）中部署此镜像。\n\n### 使用 CI/CD 管道将容器部署到 ACI\n\nDocker 之所以迅速受到开发人员和运维团队的青睐，主要原因之一是\
  \ Docker 镜像和容器的部署使企业应用程序的 CI 和 CD 管道变得更加容易。\n\n为了自动化我们应用程序的部署，我们将创建一个 CI/CD 管道，用于部署包含我们应用程序的\
  \ Docker 镜像到 ACI。\n\nACI 是 Azure 提供的一项托管服务，可让您非常轻松地部署容器，而无需担心硬件架构。\n\n> **Note**\n\
  > 要了解有关 ACI 的更多信息，请访问官方页面 `https://azure.microsoft.com/en-us/services/container-instances/`。\n\
  \n此外，我们将使用 Terraform 进行 **基础设施即代码 (IaC)**，我们在 _第 2 章，使用 Terraform 预配云基础设施_ 中讨论过这一点，并使用\
  \ Azure ACI 资源及其与 Docker 镜像的集成。\n\n因此，我们将本节分为以下两个部分：\n\n- Azure ACI 的 Terraform\
  \ 代码配置及其与我们 Docker 镜像的集成\n- Azure Pipelines 中 CI/CD 管道的示例，允许您执行 Terraform 代码\n\n\
  首先，我们将编写允许您在 Azure 中预配 ACI 资源的 Terraform 代码。\n\n### 编写 ACI 的 Terraform 代码\n\n要使用\
  \ Terraform 预配 ACI 资源，我们导航到新的 `terraform-aci` 目录并创建一个 Terraform 文件 `main.tf`。\n\n\
  在此代码中，我们将使用 `azurerm_container_group` Terraform 对象为资源组和 ACI 资源提供 Terraform 代码。\n\
  \n> **Note**\n>\n> Terraform ACI 资源的文档可在此处查阅：`https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/container_group`。\n\
  \n此 `main.tf` 文件包含以下 Terraform 代码，用于创建资源组：\n\n```\nresource \"azurerm_resource_group\"\
  \ \"acidemobook\" {\n  name = \"demoBook\"\n  location = \"westus2\"\n}\n```\n\n\
  在此 `main.tf` 文件中，我们在 Terraform 配置中添加 `variable` 声明，如下所示：\n\n```\nvariable \"imageversion\"\
  \ {\n  description=\"Tag of the image to deploy\"\n}\nvariable \"dockerhub-username\"\
  \ {\n  description =\"Tag of the image to deploy\"\n}\n```\n\n然后，我们使用 `azurerm_container_group`\
  \ 资源块添加 ACI 的 Terraform 代码，如下所示：\n\n```\nresource \"azurerm_container_group\" \"\
  aci-myapp\" {\n name = \"aci-agent\"\n location = \"West Europe\"\n resource_group_name\
  \ = azurerm_resource_group.acidemobook.name\n os_type = \"linux\"\n container {\n\
  \ name = \"myappdemo\"\n image = \"docker.io/mikaelkrif/${{var.dockerhub-username}}:${{var.imageversion}}\"\
  \n cpu = \"0.5\"\n memory = \"1.5\"\n ports {\n port = 80\n protocol = \"TCP\"\n\
  \ }\n }\n}\n```\n\n在前面的代码片段中，我们执行以下操作：\n\n- 我们声明 `imageversion` 和 `dockerhub-username`\
  \ 变量，这些变量将在 CI/CD 管道期间实例化，并包含要部署的镜像的用户名和标签。\n- 我们使用 Terraform 的 `azurerm_container_group`\
  \ 资源来管理 ACI。在其 `image` 属性中，我们指示要部署的镜像的信息——即，其在 Docker Hub 中的完整名称及其标签，在我们的示例中，该标签在\
  \ `imageversion` 变量中。\n\n最后，为了保护 Terraform 状态文件，我们可以使用 Terraform 远程后端，通过 Azure Blob\
  \ 存储实现，正如我们在 _第 2 章，使用 Terraform 预配云基础设施_ 的 _保护远程后端中的状态文件_ 部分中讨论的那样。\n\n\n\n\n\n\
  ### 为容器创建 CI/CD 流水线\n\n要创建一个用于构建镜像并执行 Terraform 代码的 CI/CD 流水线，我们可以使用在 _第 7 章，持续集成与持续交付_\
  \ 中详细讨论过的所有工具。\n\n在本章中，为了可视化流水线，我们将使用 **Azure Pipelines**，它是之前详细介绍的工具之一。建议仔细阅读 _第\
  \ 7 章，持续集成与持续交付_ 中的 _使用 Azure Pipelines_ 部分。出于这个原因，我们不会详细介绍流水线的所有阶段，而只介绍与我们的容器主题相关的阶段。\n\
  \n要在 Azure Pipelines 中实现 CI/CD 流水线，我们将按照以下步骤进行：\n\n1. 我们将创建一个新的生成定义，其 **源代码** 将指向\
  \ GitHub 仓库的分支（`https://github.com/PacktPublishing/Learning-DevOps-Second-Edition`），并选择该仓库的根文件夹，如下图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_309_0.png)\n\n图 9.23 – 使用 GitHub 源的 Azure\
  \ Pipelines\n\n> **注意**\n>\n> 此 Terraform 文件的完整源代码可在此处查看：`https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP09/terraform-aci`。\n\
  \n我们有允许创建 Azure ACI 资源的 Terraform 代码，该资源将执行我们镜像的容器。现在，我们将创建一个 CI/CD 流水线，以自动部署应用程序的容器。\n\
  \n### 注意\n\n有关 GitHub 分支的更多信息，请阅读 _第 16 章，开源项目的 DevOps_。\n\n您可以自由使用 Azure Pipelines\
  \ 中可用的任何源代码控制版本。\n\n2. 然后，在 **变量** 选项卡上，我们将定义将在流水线中使用的变量。下图显示了 **变量** 选项卡上的信息：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_310_0.png)\n\n### 图 9.24 – 流水线变量\n\n\
  我们定义了四个用于 Azure 和 Docker Hub 用户名的 Terraform 连接信息。\n\n3. 然后，在 **任务** 选项卡上，我们必须执行以下步骤：\n\
  \n- A. 在 Dockerfile 上运行 `docker build` 命令。\n- B. 将镜像推送到 Docker Hub。\n- C. 运行 Terraform\
  \ 代码以使用更新镜像的新版本更新 ACI 资源。\n\n下图显示了任务的配置：\n\n![](img/d3344b39c888aab0b832625465f837c9_311_0.png)\n\
  \n我们按照以下步骤配置在 _步骤 3_ 中提到的任务：\n\n1. 第一个任务，**Docker 构建和推送**，允许您构建 Docker 镜像并将其推送到\
  \ Docker Hub。其配置非常简单，如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_311_1.png)\n\
  \n这是该任务所需的参数：\n\n- 使用名为 DockerHub 的服务连接连接到 Docker Hub\n- 将推送到 Docker Hub 的镜像标记\n\
  \n2. 第二个任务，**Terraform 安装程序（显示名称为使用 Terraform 0.14）**，允许您通过指定要使用的 Terraform 版本，在流水线代理上下载\
  \ Terraform。\n\n> 注意\n> 此任务可在 Visual Studio Marketplace 上找到，网址为\n> https://marketplace.visualstudio.com/\n\
  > items?itemName=charleszipp.azure-pipelines-tasks-\n> terraform&targetId=76c79aec-9641-44c5-be15-\n\
  > beacfae67a9。\n\n下图显示了其配置，配置非常简单：\n\n![](img/d3344b39c888aab0b832625465f837c9_312_0.png)\n\
  \n图 9.27 – Terraform 步骤参数\n\n3. 最后一个任务，**Bash**，允许您在 Bash 脚本中执行 Terraform，下图显示了其配置：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_313_0.png)\n\n### 图 9.28 – Bash 步骤参数\n\
  \n配置的脚本如下：\n\n```\nexport ARM_CLIENT_ID=\"$(ARM_CLIENT_ID)\"\nexport ARM_CLIENT_SECRET=\"\
  $(ARM_CLIENT_SECRET)\"\nexport ARM_TENANT_ID=\"$(ARM_TENANT_ID)\"\nexport ARM_SUBSCRIPTION_ID=\"\
  $(ARM_SUBSCRIPTION_ID)\"\nterraform init -backend-config=\"backend.tfvars\"\nterraform\
  \ apply -var \"imageversion=$(Build.BuildNumber)\" \n-var \"dockerhub-username=$(dockerhub_Username)\"\
  \ --auto-\napprove\n```\n\n此脚本执行三个操作，按以下顺序进行：\n\n- A. 导出 Terraform 所需的环境变量。\n- B.\
  \ 执行 `terraform init` 命令。\n- C. 执行 `terraform apply` 以应用更改，带有两个 `-var` 参数，分别是我们的\
  \ Docker Hub 用户名以及要应用的标记。这些参数允许执行一个容器，使用刚刚推送到 Docker Hub 的新镜像。\n\n然后，要在 **代理作业**\
  \ 选项中配置要使用的生成代理，我们使用 Azure Pipelines 代理托管的 Ubuntu 16.04，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_314_0.png)\n\
  \n图 9.29 – 代理作业参数\n\n最后，最后一个配置是 **触发器** 选项卡上的触发器配置，它在每次提交时启用 CI 并触发此生成，如下图所示：\n\n\
  ![](img/d3344b39c888aab0b832625465f837c9_314_1.png)\n\n图 9.30 – 已启用 CI\n\n至此，Azure\
  \ Pipelines 中的 CI/CD 流水线配置完成。\n\n触发此生成后，我们应该能够在其执行结束时看到 Docker 镜像的新版本，该版本对应于将 Docker\
  \ 镜像推送到 Docker Hub 的生成编号，如下图所示：\n\n### mikaelkrif / demobook\n\n此仓库没有描述\n\n最后推送：一小时前\n\
  \n### 标记\n\n此仓库包含 7 个标记。\n\n1.0.13 一小时前\n\n1.0.12 一小时前\n\n图 9.31 – 通过流水线在 Docker\
  \ Hub 中推送的 Docker 镜像\n\n在 Azure 门户中，我们有 `aci-app` ACI 资源和我们的 `mydemoapp` 容器，如下图所示：\n\
  \n图 9.32 – ACI 容器\n\n请注意，容器运行正常。\n\n现在，要访问我们的应用程序，我们需要检索 Azure 门户中提供的容器的公共 **完全限定域名\
  \ (FQDN)** URL。下图显示了可以在哪里找到此信息：\n\n![](img/d3344b39c888aab0b832625465f837c9_316_0.png)\n\
  \n图 9.33 – ACI 中应用程序容器的 FQDN\n\n我们使用此 URL 打开网页浏览器：\n\n![](img/d3344b39c888aab0b832625465f837c9_316_1.png)\n\
  \n### 欢迎使用我的新应用\n\n此页面是我的演示 Dockerfile 的测试。\n享受 ...\n\n图 9.34 – 测试应用程序\n\n我们的 Web\
  \ 应用程序显示正确。\n\n下次应用程序更新时，CI/CD 生成将被触发，镜像的新版本将被推送到 Docker Hub，并且新容器将加载此镜像的新版本。\n\n\
  在本节中，我们探讨了编写 Terraform 代码以管理 ACI 资源，以及在 Azure Pipelines 中创建 CI/CD 流水线，该流水线允许您将应用程序的镜像部署到\
  \ Docker Hub，然后使用镜像的新版本更新 ACI 资源。\n\n在下一节中，我们将讨论 Docker 的另一个用例——即运行命令行工具。\n\n###\
  \ 使用 Docker 运行命令行工具\n\n到目前为止，在本章中，我们已研究了使用 Docker 将带有 Nginx 的 Web 应用程序容器化的用例。\n\n\
  Docker 的另一个用例是能够运行位于 Docker 容器中的命令行工具。\n\n为了说明这一点，我们将运行一个 Terraform 配置示例，使用 **Terraform**\
  \ 二进制文件，该文件不位于本地计算机上，而是位于 Docker 容器中。\n\n本节中使用的 Terraform 配置与上一节 _使用 CI/CD 流水线将容器部署到\
  \ ACI_ 中的配置相同，源代码可在此处查看：`https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP09/terraform-aci`。\n\
  \n本实验的目标是使用 Docker 容器中的 Terraform 二进制文件运行此 Terraform 配置。要运行此实验，请执行以下步骤：\n\n1. 首先，我们使用以下命令从\
  \ Docker Hub 拉取官方 Terraform 镜像：\n\n   `docker pull hashicorp/terraform`\n\n下图显示了此命令的执行情况：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_317_0.png)\n\n图 9.35 - 用于拉取 Terraform\
  \ 镜像的 docker pull 命令\n\n2. 然后，在包含 Terraform 配置的文件夹中，我们将使用以下三个 `docker run` 命令运行\
  \ Terraform 工作流：\n\n   首先，我们运行 `terraform init` 命令，如下所示：\n\n   `docker run -i -t\
  \ -v ${PWD}:/usr/tf -w /usr/tf ' --env ARM_CLIENT_ID=\"<azure clientId>\" ' --env\
  \ ARM_CLIENT_SECRET=\"<azure client secret>\" ' --env ARM_SUBSCRIPTION_ID=\"<azure\
  \ subscription>\" ' --env ARM_TENANT_ID=\"azure tenant id\" ' --env ARM_ACCESS_KEY=\"\
  azure access key \" ' hashicorp/terraform:latest ' init -backend-config=\"backend.tfvars\"\
  `\n\n   在此 `docker run` 命令中，我们使用以下参数：\n\n   - `-v` 用于创建卷，将包含 Terraform 代码的当前本地目录挂载到容器内的\
  \ `/usr/tf` 目录中\n\n\n\n\n+   - `-w` 用于指定工作目录\n+   - `--env` 用于指定 Terraform 进行 Azure\
  \ 身份验证所需的环境变量\n+   - `Hashicorp/terraform:latest`，即镜像名称\n+   - `init -backend-config=\"\
  backend.tfvars\"`，即 Terraform 命令要运行的参数\n\n现在，我们运行 `terraform plan` 命令，如下所示：\n\n\
  ```\ndocker run -i -t -v ${PWD}:/usr/tf -w /usr/tf '\n--env ARM_CLIENT_ID=\"<azure\
  \ clientId>\" '\n--env ARM_CLIENT_SECRET=\"<azure client secret>\" '\n--env ARM_SUBSCRIPTION_ID=\"\
  <azure subscription>\" '\n--env ARM_TENANT_ID=\"azure tenant id\" '\n--env ARM_ACCESS_KEY=\"\
  azure access key \" '\nhashicorp/terraform:latest '\nplan -var dockerhub-username=\"\
  <docker hub username>\" -out plan.tfplan\n```\n\n在上述命令中，我们使用相同的参数，配合 `plan` 命令用于\
  \ Terraform。\n\n最后，我们运行 `terraform apply` 命令，如下所示：\n\n```\ndocker run -i -t -v ${PWD}:/usr/tf\
  \ -w /usr/tf '\n--env ARM_CLIENT_ID=\"<azure clientId>\" '\n--env ARM_CLIENT_SECRET=\"\
  <azure client secret>\" '\n--env ARM_SUBSCRIPTION_ID=\"<azure subscription>\" '\n\
  --env ARM_TENANT_ID=\"azure tenant id\" '\n--env ARM_ACCESS_KEY=\"azure access key\
  \ \" '\nhashicorp/terraform:latest '\napply plan.tfplan\n```\n\n我们刚刚学习了在 Docker\
  \ 容器中运行工具（此处为 Terraform）的基本示例。这种 Docker 用法具有以下优势：\n\n+   - 无需在本地机器上安装这些工具；安装过程由\
  \ Docker 镜像中的工具编辑器完成。\n+   - 可以运行同一工具的多个版本。\n\n在下一节中，我们将讨论 Docker Compose 的使用，它允许我们将多个\
  \ Docker 镜像挂载到同一组容器中。\n\n### Docker Compose 入门\n\n在本章迄今为止，我们已学习如何编写 Dockerfile、创建\
  \ Docker 镜像以及运行该 Docker 镜像的容器。\n\n如今，应用程序不再以独立模式运行；它们需要其他依赖项，例如服务（例如，另一个应用程序；**应用程序编程接口**（API））或数据库。这意味着对于这些应用程序，Docker\
  \ 工作流更加一致。确实，当我们使用多个 Docker 应用程序时，需要为每个应用程序执行 `docker build` 和 `docker run` 命令，这需要一些精力。\n\
  \nDocker Compose 是一个更高级的 Docker 工具，允许我们在同一部署周期中同时部署多个 Docker 容器。Docker Compose 还允许我们管理这些\
  \ Docker 容器共有的元素，例如数据卷和网络配置。\n\n> **注意**\n> 有关 Docker Compose 的更多详细信息，请阅读此处的官方文档：\n\
  > `https://docs.docker.com/compose`\n\n在 Docker Compose 中，此配置（包含构成同一应用程序的工件的 Docker\
  \ 镜像、卷和网络）只需在 **YAML Ain't Markup Language**（**YAML**）格式的配置文件中简单完成即可。\n\n在本节中，我们将了解\
  \ Docker Compose 的基本模式安装。然后，我们将编写一个简单的 Docker Compose 配置文件，在同一上下文中运行带有 MySQL 数据库的\
  \ nginx 应用程序。最后，我们将执行此 Docker Compose 配置文件并在 Docker 容器中查看结果。\n\n### 安装 Docker Compose\n\
  \n在 Windows 或 macOS 上，**Docker Compose** 二进制文件已随 Docker Desktop 一起安装。\n\n按照此文档在\
  \ Linux 上安装 Docker Compose 二进制文件：`https://docs.docker.com/compose/install/#install-compose-on-linux-systems`。\n\
  \n我们可以通过运行以下命令来检查 Docker Compose 是否已正确安装：\n\n```\ndocker-compose version\n```\n\n\
  以下屏幕截图显示了此命令的结果：\n\n![](img/d3344b39c888aab0b832625465f837c9_320_0.png)\n\n图 9.36\
  \ – docker-compose version 命令\n\n此命令显示已安装的 `docker-compose` 二进制文件的版本。\n\n既然 Docker\
  \ Compose 已安装，我们将编写 Docker Compose 配置 YAML 文件。\n\n### 编写 Docker Compose 配置文件\n\n\
  对于使用 Docker Compose 部署容器，我们将编写一个配置文件来运行与 `mysql` 容器耦合的 nginx 容器。\n\n为此，我们将创建一个名为\
  \ `docker-compose.yml` 的新文件，包含以下两个代码块的内容。\n\n第一个代码片段（YAML 格式）用于创建 nginx 容器，如下所示：\n\
  \n```\nversion: '3' #version of the Docker Compose YAML schema\nservices:\n  nginx:\n\
  \    image: nginx:latest\n    container_name: nginx-container\n    ports:\n    \
  \  - 8080:80\n```\n\n在上述代码片段中，我们从 `services` 属性开始，该属性包含要在 Docker 中运行的服务（或 Docker\
  \ 应用程序）列表。第一个服务是 nginx 服务。我们配置要使用的 `nginx` `docker` 镜像、容器名称以及公开端口，即 `8080`，用于本地访问\
  \ nginx 服务。\n\n### 执行 Docker Compose\n\n对于运行 YAML 配置文件中描述的 Docker 容器，我们将通过在包含 `docker-compose.yml`\
  \ 文件的文件夹中执行以下命令来运行 Docker Compose 的基本操作：\n\n```\ndocker-compose up -d\n```\n\n>\
  \ 注意\n> `-d` 选项用于以分离模式运行容器。\n> `docker-compose` CLI 的完整文档可在此处查阅：\n> `https://docs.docker.com/compose/reference/`\n\
  \n然后，我们使用以下代码添加 MySQL 服务的 YAML：\n\n```\nmysql:\n  image: mysql:5.7\n  container_name:\
  \ mysql-container\n  environment:\n    MYSQL_ROOT_PASSWORD: secret\n    MYSQL_DATABASE:\
  \ mydb\n    MYSQL_USER: myuser\n    MYSQL_PASSWORD: password\n```\n\n在上述代码片段中，我们使用\
  \ Docker 镜像、容器名称以及配置数据库访问所需的环境变量来配置 `mysql` 服务。\n\n> 注意\n> 此文件的完整源代码可在此处查阅：\n> `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP09/docker-compose/docker-compose.yml`\n\
  \n我们刚刚编写了 `docker-compose` 配置的 YAML 文件。现在，我们将运行 Docker Compose 以执行此配置中描述的容器。\n\n\
  以下屏幕截图显示了 `docker-compose up -d` 命令的执行：\n\n![](img/d3344b39c888aab0b832625465f837c9_322_0.png)\n\
  \n图 9.37 – docker-compose up -d 命令\n\n执行结束时，Docker Compose 会显示已启动容器的列表。在我们的示例中，这些是\
  \ `nginx` 和 `mysql`。\n\n要检查容器是否正在运行，我们执行 `docker ps` Docker 命令以显示正在运行的容器列表。\n\n\
  以下屏幕截图显示了 `docker ps` 命令的执行：\n\n![](img/d3344b39c888aab0b832625465f837c9_322_1.png)\n\
  \n图 9.38 – docker ps 命令\n\n我们可以看到我们的两个容器正在运行。\n\n在 Windows 或 macOS 上，我们也可以使用 Docker\
  \ Desktop，它在容器列表中显示由 Docker Compose 在 `docker-compose` 组内挂载的正在运行的容器，如以下屏幕截图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_322_2.png)\n\n图 9.39 – Docker Desktop\
  \ 中的 Docker Compose 容器列表\n\n在本节中，我们学习了编写 Docker Compose 配置文件以及在本地执行 Docker Compose\
  \ 以运行 Docker 容器的一些基本功能。\n\n在下一节中，我们将讨论在 ACI 上远程执行这些容器的相同过程。\n\n### 在 ACI 中部署 Docker\
  \ Compose 容器\n\n我们在 _Deploying a container to ACI with a CI/CD pipeline_ 部分讨论了 ACI。\n\
  \n现在，我们将学习如何在 ACI 中使用 Docker Compose 配置执行容器，以运行一组位于同一应用程序服务上的容器。\n\n对于此实验，我们将使用在\
  \ _Using Docker for running command-line tools_ 部分中学习的相同 Docker Compose 配置。唯一的区别是，nginx\
  \ 服务的运行端口为 80，而不是我们在本地使用的 8080（因为我的端口 80 已被另一项服务占用）。\n\n对于在 ACI 上部署容器，我们将执行以下步骤：\n\
  \n+   1. 在我们的 Azure 订阅中，我们将创建一个名为 `rg-acicompose` 的新资源组。\n+   2. 然后，在控制台终端中，运行以下\
  \ Docker 命令以登录 Azure：\n+   \n    `docker login azure`\n+   \n    执行此命令将打开一个窗口，允许我们对\
  \ Azure 订阅进行身份验证。\n+   3. 通过运行以下命令创建新的 Docker 上下文：\n+   \n    `docker context create\
  \ aci demobookaci`\n+   \n    通过运行此命令，我们选择在步骤 1 中创建的 Azure 订阅和资源组，如以下屏幕截图所示：\n+\
  \   \n    PS C:\\Users\\Learning DevOps-Second-Edition\\CHAP09(docker-compose> docker\
  \ context create aci demobookaci\n    ? Select a subscription ID Microsoft Azure\
  \ Sponsorship (* **************)\n    ? Select a resource group rg-acicompose (westeurope)\n\
  \    Successfully created aci context \"demobookaci\"\n+   \n    图 9.40 – 为 ACI\
  \ 创建 Docker 上下文\n+   4. 通过运行以下命令检查新的 Docker 上下文：\n+   \n    `docker context ls`\n\
  \n\n\n\n此命令显示 Docker 上下文列表，并使用 * 符号指示当前上下文，如下面的屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_324_0.png)\n\
  \n图 9.41 – Docker 上下文列表\n\n5. 通过运行以下命令选择新创建的 demobookaci 上下文：\n\n```\ndocker context\
  \ use demobookaci\n```\n\n6. 最后，要在该 ACI 资源中部署 Docker Compose 配置应用程序，请运行以下命令：\n\n\
  ```\ndocker compose up\n```\n\n以下屏幕截图显示了执行此命令的结果：\n\n![](img/d3344b39c888aab0b832625465f837c9_324_1.png)\n\
  \n图 9.42 – 用于部署到 ACI 的 docker compose up 命令\n\n在我们的 Azure 订阅中，可以看到包含两个容器的已创建 ACI\
  \ 资源，如下面的屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_324_2.png)\n\n图 9.43\
  \ – Docker Compose 创建的 ACI 容器\n\n最后，要测试并访问已部署的应用程序，请在 ACI 属性中查找应用程序 FQDN 并在浏览器中启动应用程序。这正是我们在本章的\
  \ *使用 CI/CD 管道将容器部署到 ACI* 部分中学到的内容。\n\n> 注意\n> 关于 ACI 中 Docker Compose 的另一个示例，请阅读此处的官方教程：\n\
  > https://docs.microsoft.com/en-us/azure/container-instances/tutorial-docker-compose\n\
  \n在本节中，我们学习了如何使用 `docker-compose` YAML 文件和一些 Docker 命令行上下文，在 ACI 中使用 Docker Compose\
  \ 部署多个容器。\n\n### 摘要\n\n在本章中，我们介绍了 Docker 及其基本概念。我们讨论了创建 Docker Hub 帐户所需的步骤，然后在本地使用\
  \ Docker Desktop 安装了 Docker。\n\n我们创建了一个 Dockerfile，详细说明了 Web 应用程序 Docker 镜像的组成，还查看了它包含的主要指令——`FROM`、`COPY`\
  \ 和 `RUN`。\n\n我们执行了 `docker build` 和 `docker run` 命令，从我们的 Dockerfile 构建镜像并在本地执行它，然后使用\
  \ `push` 命令将其推送到 Docker Hub。\n\n在本章的第二部分，我们在 Azure Pipelines 中实现并执行了 CI/CD 管道，将我们的容器部署到使用\
  \ Terraform 预配的 ACI 资源中。然后，我们讨论了使用 Docker 运行命令行工具（例如 Terraform）。\n\n最后，我们学习了如何安装和使用\
  \ Docker Compose 来创建多个应用程序容器并将它们部署到 ACI 中。\n\n在下一章中，我们将继续探讨容器主题，并了解 Kubernetes，它是一种大规模管理容器的工具。我们将使用\
  \ **Azure Kubernetes Service (AKS)** 和 Azure Pipelines 在 Kubernetes 中使用 CI/CD 管道部署应用程序。\n\
  \n### 问题\n\n- 1. 什么是 Docker Hub？\n- 2. 允许您创建 Docker 镜像的基本元素是什么？\n- 3. 在 Dockerfile\
  \ 中，定义要使用的基础镜像的指令是什么？\n- 4. 哪个 Docker 命令允许您创建 Docker 镜像？\n- 5. 哪个 Docker 命令允许您实例化新容器？\n\
  - 6. 哪个 Docker 命令允许您将镜像发布到 Docker Hub？\n\n### 延伸阅读\n\n如果您想了解更多有关 Docker 的信息，以下是一些优秀的书籍：\n\
  \n- *Docker Cookbook*: https://www.packtpub.com/virtualization-and-cloud/docker-cookbook-second-edition\n\
  - *Beginning DevOps with Docker*: https://www.packtpub.com/virtualization-and-cloud/beginning-devops-docker\n"
- "## 10 使用 Kubernetes 有效管理容器\n\n在上一章中，我们详细了解了 Docker 容器、Docker 镜像的构建以及在本地计算机上实例化新容器。最后，我们设置了一个\
  \ **持续集成/持续部署** (CI/CD) 管道，用于构建镜像、将其部署到 Docker Hub 并在 **Azure 容器实例** (ACI) 中执行其容器。\n\
  \n当使用少量容器时，这一切都运行良好且不会带来太多问题。但在所谓的 **微服务应用程序**——即由多个服务（每个服务都是一个容器）组成的应用程序——中，我们需要管理和编排这些容器。\n\
  \n市场上有两种主要的容器编排工具：Docker Swarm 和 Kubernetes。\n\n一段时间以来，Kubernetes（也称为 **K8S**）已被证明是容器管理领域的真正领导者，因此正在成为应用程序容器化的\
  \ _必备_ 技术。\n\n在本章中，我们将学习如何在本地计算机上安装 Kubernetes，以及如何以标准方式和使用 Helm 在 Kubernetes 中部署应用程序的示例。我们将通过创建图表并将其发布到\
  \ **Azure 容器注册表 (ACR)** 上的私有注册表，更深入地了解 Helm。\n\n然后，我们将讨论 **Azure Kubernetes Service\
  \ (AKS)** 作为 Kubernetes 集群的示例，最后，我们将学习如何监控 Kubernetes 中的应用程序和指标。\n\n本章将涵盖以下主题：\n\
  \n- 安装 Kubernetes\n- Kubernetes 应用程序部署的第一个示例\n- 使用 Helm 作为包管理器\n- 在私有注册表 (ACR) 中发布\
  \ Helm 图表\n- 使用 AKS\n- 使用 Azure Pipelines 为 Kubernetes 创建 CI/CD 管道\n- 在 Kubernetes\
  \ 中监控应用程序和指标\n\n### 技术要求\n\n本章是上一章 Docker 章节的延续，因此要正确理解它，有必要阅读该章节并安装 Docker Desktop（适用于\
  \ Windows **操作系统 (OS)**）。\n\n在本章的 CI/CD 部分中，您需要检索上一章 Docker 章节中提供的源代码，该代码可在 `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP09/appdocker`\
  \ 上找到。\n\n关于 ACR 上 Helm 图表的部分，有必要拥有 Azure 订阅（在此处免费注册：`https://azure.microsoft.com/en-us/free/`）并且您已安装\
  \ Azure **命令行界面 (CLI)** 二进制文件，可在此处获取：`https://docs.microsoft.com/en-us/cli/azure/install-azure-cli`。\n\
  \n本章的完整源代码可在 `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP10`\
  \ 上找到。\n\n查看以下视频以观看代码实际运行情况：\nhttps://bit.ly/3p7ydjt\n\n### 安装 Kubernetes\n\n在安装\
  \ Kubernetes 之前，我们需要了解其架构和主要组件，因为 Kubernetes 不是一个简单的工具，而是一个集群——即它由一个 **主服务器** 和其他称为\
  \ **节点** 的从服务器组成。我建议您以简化的方式探索 Kubernetes 的架构。\n\n### Kubernetes 架构概述\n\nKubernetes\
  \ 是一个由多个组件组成的平台，这些组件一起组装并按需扩展，以便实现应用程序的更好可扩展性。Kubernetes 的架构（一种客户端/服务器类型）可以简单地表示，如下图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_329_0.png)\n\n在前面的图中，我们可以看到集群由主组件和节点（也称为\
  \ **工作节点**）组成，它们代表从服务器。在每个节点中，都有 **Pod**，它们是将包含容器和卷的虚拟元素。简单来说，我们可以为每个应用程序创建一个 Pod，它将包含应用程序的所有容器。例如，一个\
  \ Pod 可以包含 Web 服务器容器、数据库容器以及将包含图像和数据库文件的持久文件的卷。\n\n最后，`kubectl` 是允许我们与 Kubernetes\
  \ 集群交互的客户端工具。有了这个，我们就具备了使用 Kubernetes 的主要要求，因此让我们看看如何在本地计算机上安装它。\n\n### 在本地计算机上安装\
  \ Kubernetes\n\n在开发将托管在 Kubernetes 上的容器化应用程序时，在将其部署到远程 Kubernetes 生产集群之前，能够在本地计算机上运行应用程序（及其容器）非常重要。\n\
  \n为了在本地安装 Kubernetes 集群，有几种解决方案，将在下面详细介绍。\n\n第一种解决方案是使用 **Docker Desktop**，执行以下步骤：\n\
  \n- 1. 如果我们已经安装了 Docker Desktop（我们在 _第 9 章 使用 Docker 容器化您的应用程序_ 中了解过），可以在 **Kubernetes**\
  \ 选项卡的 **设置** 中激活 **启用 Kubernetes** 选项，如下面的屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_330_0.png)\n\
  \n图 10.2 – 在 Docker Desktop 中启用 Kubernetes\n\n\n\n\n\n2. 单击 **Apply & Restart**\
  \ 按钮后，Docker Desktop 将在本地计算机上安装一个本地 Kubernetes 集群，以及 `kubectl` 客户端工具。\n\n在本地安装 Kubernetes\
  \ 的第二种方式是安装 minikube，它也会在本地安装一个简化的 Kubernetes 集群。以下是您可以阅读的官方文档：https://minikube.sigs.k8s.io/docs/start/。\n\
  \n> Note\n> 安装本地 Kubernetes 还有其他解决方案，例如 kind 或 kubeadm。有关更多详细信息，请阅读此处的文档：https://kubernetes.io/docs/tasks/tools/。\n\
  \n在本地安装 Kubernetes 后，我们将通过在终端中执行以下命令来检查其安装情况：\n\n```\nkubectl version --short\n\
  ```\n\n以下屏幕截图显示了上述命令的结果：\n\n![](img/d3344b39c888aab0b832625465f837c9_331_0.png)\n\
  \n图 10.3 – kubectl 获取二进制版本\n\n> Note\n> 我们在 Kubernetes 集群上执行的所有操作都将使用 `kubectl`\
  \ 命令完成。\n\n安装 Kubernetes 集群后，我们还需要另一个元素，即 Kubernetes 仪表板。这是一个 Web 应用程序，允许我们查看集群的状态以及所有组件。\n\
  \n在下一节中，我们将讨论如何安装和测试 Kubernetes 仪表板。\n\n### 安装 Kubernetes 仪表板\n\n为了安装 Kubernetes\
  \ 仪表板（这是一个预打包的容器化 Web 应用程序，将部署在我们的集群中），我们将在终端中运行以下命令：\n\n```\nkubectl apply -f https://raw.githubusercontent.com/kubernetes/dashboard/v2.4.0/aio/deploy/recommended.yaml\n\
  ```\n\n其执行情况如下屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_332_0.png)\n\n\
  图 10.4 – Kubernetes 仪表板安装\n\n从上述屏幕截图中，我们可以看到创建了不同的工件，具体如下：secrets、两个 Web 应用程序、**基于角色的访问控制\
  \ (RBAC)** 角色、权限和服务。\n\n> **Note**\n> 请注意，安装仪表板的命令参数中提到的 **统一资源定位符 (URL)** 可能会根据仪表板的版本而更改。要查找当前有效的\
  \ URL，请访问官方文档 `https://kubernetes.io/docs/tasks/access-application-cluster/web-ui-dashboard/`。\n\
  \n现在我们已经安装了此 Kubernetes 仪表板，将连接到它并对其进行配置。\n\n要从本地计算机打开仪表板并连接到它，我们必须首先通过执行以下步骤在 Kubernetes\
  \ 集群和我们的计算机之间创建代理：\n\n1. 要创建代理，我们在终端中执行 `kubectl proxy` 命令。执行详情如下屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_333_0.png)\n\
  \n图 10.5 – kubectl proxy 命令\n\n我们可以看到，代理已在本地主机地址 (127.0.0.1) 的 8001 端口上打开。\n\n2.\
  \ 然后，在 Web 浏览器中打开以下 URL，`http://localhost:8001/api/v1/namespaces/kubernetes-dashboard/services/https:kubernetes-dashboard:/proxy/#/login`，这是一个由代理创建的本地\
  \ URL（localhost 和 8001），指向我们已安装的 Kubernetes 仪表板应用程序。\n\n以下屏幕截图显示了如何选择 Kubernetes\
  \ 配置文件或输入身份验证令牌：\n\n![](img/d3344b39c888aab0b832625465f837c9_333_1.png)\n\n图 10.6\
  \ – Kubernetes 仪表板身份验证\n\n3. 要创建新的用户身份验证令牌，我们将在 PowerShell 终端中执行以下脚本：\n\n```\n$TOKEN=((kubectl\
  \ -n kube-system describe secret default |\nSelect-String \"token:\") -split \"\
  \ +\")[1]\nkubectl config set-credentials docker-for-desktop\n--token=\"${TOKEN}\"\
  \n```\n\n执行此脚本会在本地配置文件中创建一个新令牌。\n\n4. 最后，在仪表板中，我们将选择位于 `C:\\Users\\<user name>.kube\\\
  ` 文件夹中的 `config` 文件，如下屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_334_0.png)\n\
  \n图 10.7 – 使用 kubeconfig 文件进行 Kubernetes 仪表板身份验证\n\n> **Note**\n> 关于令牌身份验证，请阅读此博客文章：\n\
  > https://www.replex.io/blog/how-to-install-access-and-add-heapster-metrics-to-the-kubernetes-dashboard\n\
  \n5. 单击 SIGN IN 按钮后，仪表板将显示如下：\n\n![](img/d3344b39c888aab0b832625465f837c9_335_0.png)\n\
  \n图 10.8 – Kubernetes 仪表板资源列表\n\n我们刚刚了解了如何在本地计算机上安装 Kubernetes 集群，然后在该集群中安装和配置了\
  \ Kubernetes Web 仪表板。我们现在将使用 **YAML Ain’t Markup Language (YAML)** 规范文件和 `kubectl`\
  \ 命令在本地 Kubernetes 集群中部署我们的第一个应用程序。\n\n### Kubernetes 应用程序部署的第一个示例\n\n安装 Kubernetes\
  \ 集群后，我们将在其中部署一个应用程序。首先，需要知道的是，当我们在 Kubernetes 中部署应用程序时，我们会在 Kubernetes **pod**\
  \ 对象中创建 Docker 容器的新实例，因此我们首先需要一个包含应用程序的 Docker 镜像。\n\n对于我们的示例，我们将使用包含 Web 应用程序的\
  \ Docker 镜像，该镜像已在 _第 9 章，使用 Docker 容器化您的应用程序_ 中推送到 Docker Hub。\n\n要部署此 Docker 容器实例，我们将创建一个新的\
  \ k8sdeploy 文件夹，并在其中创建一个 Kubernetes 部署 YAML 规范文件 (myapp-deployment.yml)，内容如下：\n\n\
  ```\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: webapp\nspec:\n\
  \  selector:\n    matchLabels:\n      app: webapp\n  replicas: 2\n  template:\n\
  \    metadata:\n      labels:\n        app: webapp\n    spec:\n      containers:\n\
  \        - name: demobookk8s\n          image: mikaelkrif/demobook:latest\n    \
  \      ports:\n            - containerPort: 80\n```\n\n在上述代码片段中，我们以如下方式描述我们的部署：\n\
  \n- apiVersion 属性是应使用的 API 版本。\n- 在 Kind 属性中，我们指定规范类型为 deployment。\n- replicas 属性指示\
  \ Kubernetes 将在集群中创建的 Pod 数量；这里，我们选择两个实例。\n\n在此示例中，我们选择了两个副本，这至少可以分发应用程序的流量负载（如果负载量很大，可以增加更多副本），同时确保应用程序正常运行。因此，如果两个\
  \ Pod 中的一个出现问题，另一个（即相同的副本）将确保应用程序正常运行。\n\n然后，在 `containers` 部分中，我们使用 `name` 和 `tag`\
  \ 指定镜像（来自 Docker Hub）。最后，`ports` 属性指示容器在集群中将使用的端口。\n\n> Note\n> 此源代码也可在 `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP10/k8sdeploy/myapp-deployment.yml`\
  \ 上找到。\n\n要部署我们的应用程序，我们进入终端并执行一个基本的 `kubectl` 命令 (`kubectl apply`)，如下所示：\n\n```\n\
  kubectl apply -f myapp-deployment.yml\n```\n\n`-f` 参数对应于 YAML 规范文件。\n\n此命令将 YAML\
  \ 规范文件中描述的部署应用于 Kubernetes 集群。\n\n执行此命令后，我们将通过显示集群中 Pod 列表来检查此部署的状态。为此，在终端中我们执行\
  \ `kubectl get pods` 命令，该命令将返回集群 Pod 列表。以下屏幕截图显示了部署的执行情况，并显示了我们用于检查部署的 Pod 信息：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_337_0.png)\n\n图 10.9 – kubectl apply\
  \ 命令\n\n从上述屏幕截图中可以看到，第二个命令显示了我们的两个 Pod，其名称（`webapp`）在 YAML 文件中指定，后跟一个 **唯一标识符 (UID)**，并且它们处于\
  \ `Running` 状态。\n\n我们还可以在 Kubernetes Web 仪表板上可视化集群的状态，包括 `webapp` 部署、使用的 Docker\
  \ 镜像以及已创建的两个 Pod。如需更多详细信息，可以单击元素的不同链接。\n\n我们的应用程序已成功部署在 Kubernetes 集群中，但目前它仅在集群内可访问，要使其可用，我们需要将其暴露到集群外部。\n\
  \n\n\n\n\n为了在集群外部访问 Web 应用程序，我们必须向集群添加一种服务类型和一个 NodePort 类别元素。要添加此服务类型和 NodePort\
  \ 元素，与部署的方式相同，我们将在同一个 k8sdeploy 目录中创建第二个服务规范 YAML 文件（myapp-service.yml），其代码如下：\n\
  \n```yaml\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: webapp\n  labels:\n\
  \    app: webapp\nspec:\n  type: NodePort\n  ports:\n    - port: 80\n      targetPort:\
  \ 80\n      nodePort: 31000\n  selector:\n    app: webapp\n```\n\n在前面的代码片段中，我们指定了\
  \ kind，Service，以及服务类型，NodePort。\n\n然后，在 ports 部分，我们指定端口转换：内部暴露的端口 80，以及对集群外部暴露的端口\
  \ 31000。\n\n> **Note**\n> 此文件的源代码也可在 https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP10/k8sdeploy/myapp-service.yml\
  \ 上获取。\n\n要在集群上创建此服务，我们执行 kubectl apply 命令，但这次将 myapp-service.yml 文件作为参数，如下所示：\n\
  \n```bash\nkubectl apply -f myapp-service.yml\n```\n\n命令的执行在集群中创建了服务，并且，为了测试我们的应用程序，我们打开带有\
  \ http://localhost:31000 URL 的 Web 浏览器，我们的页面显示如下：\n\n![](img/d3344b39c888aab0b832625465f837c9_339_0.png)\n\
  \nFigure 10.10 – Demo Kubernetes application\n\n我们的应用程序现在已部署在 Kubernetes 集群上，并且可以从集群外部访问。\n\
  \n在本节中，我们了解到，应用程序的部署以及在 Kubernetes 中创建对象，是通过使用 YAML 格式的规范文件和几个 kubectl 命令行来实现的。\n\
  \n下一步是使用 Helm 包来简化 YAML 规范文件的管理。\n\n### 使用 Helm 作为包管理器\n\n如前所述，我们在 Kubernetes 集群上执行的所有操作都是通过\
  \ kubectl 工具和 YAML 规范文件完成的。\n\n在一家在 Kubernetes 集群上部署多个微服务应用程序的公司中，我们经常注意到大量的这些 YAML\
  \ 规范文件，这会带来维护问题。为了解决这个维护问题，我们可以使用 Helm，它是 Kubernetes 的包管理器。\n\n> Note\n> 有关包管理器的更多信息，您也可以阅读第\
  \ 7 章 持续集成和持续交付中的使用包管理器部分。\n\n因此，Helm 是一个存储库，它将允许共享称为 charts 的包，这些包包含可直接使用的 Kubernetes\
  \ 规范文件模板。\n\n### 安装 Helm 客户端\n\n那么，我们将了解如何在本地 Kubernetes 集群上安装 Helm，稍后，我们将了解如何使用\
  \ Helm 安装应用程序。\n\n自版本 3 以来，Helm 仅由一个二进制文件组成：一个 **客户端工具**，它主要允许我们在目标 Kubernetes 集群上安装\
  \ Kubernetes 规范文件包，列出存储库的包，并指示要安装的包。\n\n要安装 Helm 客户端，请参阅 `https://helm.sh/docs/using_helm/#installing-the-helm-client`\
  \ 的安装文档，该文档详细说明了根据不同操作系统的安装程序。\n\n例如，在 Windows 中，我们可以通过 **Chocolatey** 包管理器安装它，执行以下命令：\n\
  \n```bash\nchoco install kubernetes-helm -y\n```\n\n要检查其安装，请执行 `helm --help` 命令，如下面的屏幕截图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_340_0.png)\n\nFigure 10.11 – helm --help\
  \ command\n\n命令的执行告诉我们 Helm 已正确安装。现在，我们将学习如何使用公共 Helm chart。\n\n> **Note**\n> 要了解有关\
  \ Helm 的更多信息并访问其文档，请访问 `https://helm.sh/`。\n\n> **Note**\n> 在本书第一版中，我们使用了 3.0 之前的\
  \ Helm 版本，并学习了如何安装 Helm Tiller 插件。自 3.0+ 版本起，Tiller 插件不再需要安装，因此本版删除了 Tiller 安装指南。\n\
  \n### 使用 Artifact Hub 中的公共 Helm chart\n\nHelm 存储库中包含的包称为 **charts**。Charts 由文件组成，这些文件是应用程序的\
  \ Kubernetes 规范文件模板。\n\n使用 charts，可以在不编写任何 YAML 规范文件的情况下在 Kubernetes 中部署应用程序。因此，要部署应用程序，我们将使用其对应的\
  \ chart，并传递该应用程序的一些配置变量。\n\n安装 Helm 后，我们将安装一个位于 Helm 公共存储库（称为 **Artifact Hub**）中的\
  \ chart，可在此处访问：`https://artifacthub.io/`。但是首先，要显示公共 charts 列表，我们运行以下命令：\n\n```bash\n\
  helm search hub\n```\n\n`hub` 参数是 Artifact Hub 的名称。\n\n要搜索特定包，我们可以运行 `helm search\
  \ hub <package name>` 命令，如果我们想要搜索所有 `wordpress` 包（例如），我们运行以下命令：\n\n```bash\nhelm\
  \ search hub wordpress\n```\n\n以下是结果摘录，其中包含大量 charts：\n\n![](img/d3344b39c888aab0b832625465f837c9_341_0.png)\n\
  \nFigure 10.12 – Searching for Helm packages\n\n要轻松查找包，请访问 Artifact Hub 网站（https://artifacthub.io/）并搜索\
  \ wordpress 包，如下面的屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_342_0.png)\n\
  \nFigure 10.13 – Artifact Hub wordpress search\n\n此页面列出了所有社区发布者的所有 wordpress 包。\n\
  \n然后，单击所需的包以显示包的详细信息，如下面的屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_343_0.png)\n\
  \nFigure 10.14 – Artifact Hub wordpress details\n\n在此页面上，我们可以看到包的当前版本以及一些技术包安装指南。\n\
  \n> **Note**\n> 也可以使用 Nexus、Artifactory 或甚至 ACR 等工具创建我们自己的私有或企业 Helm 存储库。\n\n现在让我们使用\
  \ Helm 安装一个应用程序。\n\n为了说明 Helm 的使用，我们将使用 Helm chart 在 Kubernetes 集群中部署一个 WordPress\
  \ 应用程序。\n\n为此，请执行以下命令（在此处提及：https://artifacthub.io/packages/helm/bitnami/wordpress）：\n\
  \n```bash\nhelm repo add bitnami https://charts.bitnami.com/bitnami\nhelm install\
  \ wpdemo bitnami/wordpress\n```\n\n第一个命令 helm repo add 将 bitnami 存储库的索引添加到本地。然后，我们使用\
  \ helm install <release name> <package name> 命令在 Kubernetes 上安装所需的包。\n\n下面的屏幕截图显示了这两个命令的执行情况：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_344_0.png)\n\nFigure 10.15 – Installing\
  \ an application with Helm\n\n执行前面的命令后，Helm 在本地 Kubernetes 集群上安装了名为 wpdemo 的 WordPress\
  \ 实例和所有 Kubernetes 组件。\n\n我们还可以通过执行以下命令显示集群上安装的 Helm 包列表：\n\n```bash\nhelm ls\n\
  ```\n\n下面的屏幕截图显示了此命令的执行情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_344_1.png)\n\
  \nFigure 10.16 – Helm list of installed packages\n\n如果我们想要删除包及其所有组件（例如，删除使用此包安装的应用程序），我们执行\
  \ helm delete 命令，如下所示：\n\n```bash\nhelm delete wpdemo\n```\n\n下面的屏幕截图显示了此命令的执行情况：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_344_2.png)\n\nFigure 10.17 – helm delete\
  \ command\n\n我们已讨论了将 Artifact Hub 中的 Helm chart 安装到 Kubernetes 集群。在下一节中，我们将学习如何创建自定义\
  \ Helm chart 包。\n\n### 创建自定义 Helm chart\n\n我们刚刚学习了如何从 Artifact Hub 使用和安装公共 Helm\
  \ chart，但在公司中，我们通常有一些自定义应用程序，需要我们创建自定义 Helm charts。\n\n以下是创建自定义 Helm chart 的基本步骤：\n\
  \n1. 在将包含 Helm chart 文件模板的文件夹内，运行 `helm create <chart name>` 命令，如下所示：\n\n   ```bash\n\
  \   helm create demobook\n   ```\n\n   执行此命令将为我们的 chart 创建目录结构和基本模板文件，如下面的屏幕截图所示：\n\
  \n   ![](img/d3344b39c888aab0b832625465f837c9_345_0.png)\n\n   Figure 10.18 – Helm\
  \ chart structure folder\n\n2. 然后，按照此处的技术文档自定义 chart 模板和值：`https://helm.sh/docs/chart_template_guide/`。\n\
  \n\n\n\n\n### 3. 最后，我们通过运行 `helm install <chart name> <chart path root>` 命令在 Kubernetes\
  \ 集群中发布图表，如下所示：\n\n```\nhelm install demochart ./demobook\n```\n\n以下截图显示了上述命令的执行情况：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_346_0.png)\n\n要检查 Helm 包的安装情况，请运行 `kubectl\
  \ get pods` 命令以显示创建的 Pod 列表。\n\n以下截图显示了创建的 Pod 列表：\n\n![](img/d3344b39c888aab0b832625465f837c9_346_1.png)\n\
  \n并运行 `helm ls` 命令以显示已安装的 Helm 图表列表，如以下截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_346_2.png)\n\
  \n我们可以在上述截图中看到已安装在 Kubernetes 集群上的 `demochart` Helm 图表。\n\n在本节中，我们了解了 Helm 的安装和使用概述，Helm\
  \ 是 Kubernetes 的包管理器。然后，我们了解了如何从 Artifact Hub 安装 Helm 图表。最后，我们了解了如何创建自定义 Helm 图表并将其安装到\
  \ Kubernetes 集群中。\n\n在下一节中，我们将学习如何将自定义 Helm 图表发布到私有 Helm 仓库——即 ACR。\n\n### 在私有注册表（ACR）中发布\
  \ Helm 图表\n\n在上一节中，我们讨论了名为 Artifact Hub 的公共 Helm 仓库，它非常适合公共（或社区）应用程序或工具。但对于公司应用程序，拥有私有\
  \ Helm 注册表更好，也是推荐的做法。\n\n在市场上，有很多私有注册表，例如 Nexus 或 Artifactory，本文档解释了如何创建私有 Helm\
  \ 仓库：`https://helm.sh/docs/topics/chart_repository/`。\n\n在本节中，我们将讨论如何使用私有 Helm 仓库（即\
  \ ACR，我们在 _第 9 章：使用 Docker 容器化您的应用程序_ 中已经了解过）。因此，为了开始我们的实验，我们假设已经在 Azure 上创建了名为\
  \ demobookacr 的 ACR。\n\n> **注意**\n> 如果您尚未创建 ACR，请按照此处的文档操作：\n> `https://docs.microsoft.com/en-us/azure/container-registry/container-registry-get-started-azure-cli`\n\
  \n要在 ACR 中发布自定义 Helm 图表，请执行以下步骤：\n\n1. 第一步是在包含图表的 `chart.yaml` 文件的文件夹中运行 `helm package`\
  \ 命令，以 `tar.gz` 格式创建图表的包。\n\n运行以下命令，将 \".\" 作为参数，以指示 `chart.yaml` 文件位于当前文件夹中：\n\n\
  ```\nhelm package .\n```\n\n以下截图显示了此命令的执行情况：\n\n图 10.22 – 创建 Helm 包\n\nHelm 图表包以\
  \ `demobook-0.1.0.tgz` 的名称创建。\n\n2. 然后，使用以下 PowerShell 脚本对 ACR 进行身份验证：\n\n```\n\
  $env:HELM_EXPERIMENTAL_OCI=1\n$USER_NAME=\"00000000-0000-0000-0000-000000000000\"\
  \n$ACR_NAME=\"demobookacr\"\n\naz login\n$PASSWORD=$( az acr login --name $ACR_NAME\
  \ --expose-token\n--output tsv --query accessToken)\nhelm registry login \"$ACR_NAME.azurecr.io\"\
  \ --username\n$USER_NAME --password \"$PASSWORD\"\n```\n\n上述脚本执行以下操作：\n\n- 将 HELM_EXPERIMENTAL_OCI\
  \ 环境变量设置为 1。有关环境变量的更多详细信息，请阅读此文档：https://helm.sh/docs/topics/registries/。\n- 将 USER_NAME\
  \ 变量设置为一个 000 的虚拟值。\n- 将 ACR_NAME 变量设置为 ACR 的名称。\n- 通过使用 az cli 命令动态设置 PASSWORD\
  \ 变量。\n- 使用 Helm registry login 对 ACR 注册表进行身份验证。\n\n3. 最后，我们使用以下命令将 Helm 图表推送到 ACR\
  \ 注册表：\n\n```\nhelm push .\\demobook-0.1.0.tgz oci://$ACR_NAME.azurecr.io/helm\n\
  ```\n\n执行此命令后，推送的 Helm 图表将位于 ACR 上的 helm/demobook 存储库中。\n\n4. 我们可以通过运行以下命令来检查 Helm\
  \ 图表是否已正确推送到 ACR：\n\n```\naz acr repository show --name $ACR_NAME --repository helm/demobook\n\
  ```\n\n执行此命令将显示 helm/demobook Helm 图表的详细信息。\n\n在 Azure 门户中，我们可以看到 Helm 仓库、Helm 图表和标签，如以下截图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_349_0.png)\n\n图 10.23 – ACR Helm 仓库\n\
  \n我们刚刚学习了如何使用 Helm 命令行和 `az cli` 命令构建并推送自定义 Helm 图表到 ACR。\n\n现在，在下一节中，让我们来看一个托管在\
  \ Azure 上的托管 Kubernetes 服务示例，称为 AKS。\n\n### 使用 AKS\n\n生产 Kubernetes 集群的安装和配置通常可能很复杂。这种类型的安装需要服务器的可用性、具备\
  \ Kubernetes 集群安装和管理所需技能的人力资源，以及——尤其是——实施增强的安全策略以保护应用程序。\n\n为了解决这些问题，云提供商提供托管 Kubernetes\
  \ 集群服务。亚马逊的 **Elastic Kubernetes Service (EKS)**、谷歌的 **Google Kubernetes Engine\
  \ (GKE)** 以及最后 Azure 的 AKS 就是这种情况。在本节中，我将介绍 AKS 的概述，同时也强调托管 Kubernetes 集群的优势。\n\n\
  因此，AKS 是一项 Azure 服务，允许我们创建和管理真正的 Kubernetes 集群作为托管服务。\n\n使用此托管 Kubernetes 集群的优势在于，我们不必担心其硬件安装，并且当节点安装在\
  \ **虚拟机 (VMs)** 上时，主节点部分的管理完全由 Azure 完成。\n\n使用此服务是免费的；收取的是节点安装所在 VMs 的费用。\n\n> **注意**\n\
  > 要了解有关 AKS 提供的优势的更多信息，您可以阅读 https://docs.microsoft.com/en-us/azure/aks/intro-kubernetes\
  \ 上的文档。\n\n让我们现在来看看如何创建 AKS 服务。\n\n### 创建 AKS 服务\n\n在 Azure 中创建 AKS 集群可以通过三种不同的方式，如下所示：\n\
  \n- **手动，通过 Azure 门户**：创建 AKS 服务的标准方式是通过 Azure 门户，创建 Kubernetes 服务，然后输入其基本 Azure\
  \ 属性——即所需节点的类型和数量，如以下截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_350_0.png)\n\
  \n图 10.24 – 通过 Azure 门户创建 AKS\n\n- **通过 az cli 脚本创建**：您也可以使用 az `cli` 脚本来自动化 AKS\
  \ 集群的创建。脚本如下所示：\n\n```\n#Create the Resource group\naz group create --name Rg-AKS\
  \ --location westeurope\n#Create the AKS resource\naz aks create --resource-group\
  \ Rg-AKS --name demoBookAKS\n--node-count 2 --generate-ssh-keys --enable-addons\n\
  monitoring\n```\n\nnode-count 属性指示节点数量，enable-addons 属性使我们能够监控 AKS 服务。\n\n- **使用\
  \ Terraform 创建**：也可以使用 Terraform 创建 AKS 服务。完整的 Terraform 脚本可在 Azure 文档 https://docs.microsoft.com/en-us/azure/terraform/terraform-create-k8s-cluster-with-tf-and-aks\
  \ 上找到，要了解有关使用 Terraform 的更多信息，您可以阅读第 2 章，使用 Terraform 配置云基础设施。\n\n现在 AKS 集群已创建，我们将能够配置\
  \ kubeconfig 文件以连接到此 AKS 集群。\n\n### 为 AKS 配置 kubeconfig 文件\n\n要配置 kubectl 用于连接到\
  \ AKS 服务的 kubeconfig 文件，我们将使用 az cli 工具，在终端中执行以下命令：\n\n```\naz login\n#If you have\
  \ several Azure subscriptions\naz account set --subscription <subscription Id>\n\
  az aks get-credentials --resource-group Rg-AKS --name demoBookAKS\n```\n\n此最后命令将资源组作为参数，以及创建的\
  \ AKS 集群的名称。此命令的作用是自动创建 .kube\\config 文件，并使用此文件配置 kubectl 以连接到 AKS 集群，如以下截图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_351_0.png)\n\n图 10.25 – 通过 az cli 获取\
  \ AKS 凭据\n\n\n\n\n\n要测试与 AKS 的连接，我们可以执行以下命令，`kubectl get nodes`，该命令显示创建 AKS 群集时配置的节点数量，如下图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_352_0.png)\n\n图 10.26 – kubectl get nodes\
  \ 列表\n\n本章中我们在 _Kubernetes 应用程序部署的第一个示例_ 部分看到的所有操作，无论是使用 AKS 还是 `kubectl` 部署应用程序，都是相同的。\n\
  \n在了解在 Azure 中创建 AKS 服务的步骤后，我们将现在提供其优势的概述。\n\n### AKS 的优势\n\nAKS 是在 Azure 中托管的 Kubernetes\
  \ 服务。这有助于与 Azure 集成，并具有此处列出的其他一些优势：\n\n- **即用型**：在 AKS 中，Kubernetes Web 仪表板原生安装，位于\
  \ `https://docs.microsoft.com/en-us/azure/aks/kubernetes-dashboard` 的文档说明了如何访问它。\n\
  \n- **集成监控服务**：AKS 还具有 Azure 的所有集成监控服务，包括容器监控、群集性能管理和日志管理，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_352_1.png)\n\
  \n图 10.27 – AKS 监控\n\n- **非常易于扩展**：AKS 允许通过门户或脚本快速直接扩展群集的节点数量。\n\n如下图所示，我们在 Azure\
  \ 门户中选择所需的节点数量，更改会立即生效：\n\n![](img/d3344b39c888aab0b832625465f837c9_353_0.png)\n\
  \n图 10.28 – AKS 扩展\n\n如果我们有 Azure 订阅并且想要使用 Kubernetes，安装是直观且快速的。AKS 具有许多优势，例如 Azure\
  \ 门户中的集成监控和扩展。使用 `kubectl` 工具不需要与本地 Kubernetes 实例相比进行任何更改。\n\n在本节中，我们讨论了 AKS，它是\
  \ Azure 中的托管 Kubernetes 服务。然后，我们创建了 AKS 实例并配置了 `kubeconfig` 文件以连接到该 AKS 实例。最后，我们列出了其优势，主要是集成监控和快速可扩展性。\n\
  \n在下一节中，我们将看到一些关于如何使用 Azure Pipelines 的 CI/CD 管道在 Kubernetes 中部署应用程序的资源。\n\n###\
  \ 使用 Azure Pipelines 为 Kubernetes 创建 CI/CD 管道\n\n到目前为止，我们已经了解如何使用 `kubectl` 在本地\
  \ Kubernetes 群集或使用 AKS 的远程群集中部署容器化应用程序。\n\n在本书的第一版中，我解释了如何在 Azure DevOps 中构建完整的管道，从创建新\
  \ Docker 镜像并将其推送到 Docker Hub 到在 AKS 群集中部署。\n\n自第一版以来，不同 CI/CD 工具的许多功能已得到改进，以便在 Kubernetes\
  \ 中部署。\n\n这就是为什么在第二版中，我不会再详细解释它，而是为您提供一些对我日常工作有用的不同资源，如下所示：\n\n- 第一个资源是一个非常完整的视频，解释了使用\
  \ Azure DevOps 在 AKS 中部署应用程序的所有详细信息，位于以下链接：https://www.youtube.com/watch?v=K4uNl6JA7g8\n\
  \n- 关于同一主题，在 Azure DevOps 上有一个很棒的实验室，位于以下链接：https://www.azuredevopslabs.com/labs/vstsextend/kubernetes/\n\
  \n- 要创建用于部署到 Kubernetes 的 YAML 格式的 Azure DevOps 管道，请阅读此处的官方文档：https://docs.microsoft.com/en-us/azure/devops/pipelines/ecosystems/kubernetes/aks-template?view=azure-devops\n\
  \n- 然后，以下文档还提供了一个使用 Jenkins 和 Azure DevOps 将应用程序部署到 Kubernetes 的教程：https://docs.microsoft.com/en-us/azure/devops/pipelines/release/integrate-jenkins-pipelines-aks?view=azure-devops\n\
  \n在本节中，我们报告了一些用于端到端 (E2E) DevOps CI/CD 管道的资源，以便使用 Azure Pipelines 在 Kubernetes 群集（我们示例中的\
  \ AKS）中部署应用程序。\n\n在下一节中，我们将学习监控 Kubernetes 上的应用程序和指标的不同方法，并了解可以使用的工具。\n\n### 监控\
  \ Kubernetes 中的应用程序和指标\n\n当我们在 Kubernetes 中部署应用程序时，拥有一个监控策略来检查和调试这些应用程序的生命周期以及检查\
  \ **中央处理器 (CPU)** 和 **随机存取存储器 (RAM)** 指标非常重要——我认为这是一项要求。\n\n我们将现在讨论在 Kubernetes\
  \ 中调试和监控应用程序的不同方法。\n\n让我们从基本方法开始，即使用 `kubectl` 命令行。\n\n### 使用 kubectl 命令行\n\n要使用\
  \ `kubectl` 命令行调试应用程序，请运行下面详细说明的命令：\n\n- 要显示 Kubernetes 资源的状态，请运行以下命令：\n\n```\n\
  kubectl get pods,svc\n```\n\n前面命令的输出如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_355_0.png)\n\
  \n图 10.29 – kubectl 获取资源\n\n使用此命令，我们可以查看 pod 是否正在运行并了解服务的状态。\n\n- 要显示应用程序日志，请运行\
  \ `kubectl logs pod/<pod name>` 命令，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_355_1.png)\n\
  \n图 10.30 – kubectl 获取 pod 日志\n\n此命令显示应用程序日志的输出。\n\n有关使用 `kubectl` 调试应用程序的更多详细信息，请阅读此处的文档：\n\
  \n`https://kubernetes.io/docs/tasks/debug-application-cluster/debug-running-pod/`\n\
  \n使用 `kubectl` 命令，我们可以自动化应用程序调试，但有必要学习所有命令行选项。\n\n接下来，我们将讨论使用一些工具调试应用程序。\n\n###\
  \ 使用 Web 仪表板\n\n如前一节本章第一部分 _安装 Kubernetes_ 中所述，我们可以使用基本仪表板在 Web **用户界面 (UI)** 中显示在\
  \ Kubernetes 中部署的所有资源的详细信息。\n\n对于 Azure 的 AKS、Amazon Web Services (AWS) 的 EKS 和\
  \ Google Cloud Platform (GCP) 的 GKE 等云托管 Kubernetes 服务，我们可以使用集成和托管的仪表板。例如，对于 Azure\
  \ 门户中的 AKS，我们可以轻松查看所有 pod 日志。以下是 Azure 门户中 pod 日志的示例：\n\n![](img/d3344b39c888aab0b832625465f837c9_356_0.png)\n\
  \n图 10.31 – AKS 实时日志\n\n有关在 AKS 上调试的更多详细信息，请阅读此处的文档：\n\n`https://docs.microsoft.com/en-us/azure/architecture/microservices/logging-monitoring`\n\
  \n我们还可以使用 Octant 或 Lens 等分层工具。\n\n### 使用分层工具\n\n有许多工具或解决方案可用于监控和显示在 Kubernetes 群集中部署的所有资源。其中包括两个我经常使用的免费工具：Octant\
  \ 和 Lens。\n\n### Octant\n\nOctant 是一个 VMware 社区项目，是一个在本地或 Docker 容器中启动的 Web 应用程序，用于可视化\
  \ Kubernetes 资源和应用程序日志。\n\nOctant 的文档可在此处查看：\n\n`https://octant.dev/`\n\n源代码可在此处查看：\n\
  https://github.com/vmware-tanzu/octant/blob/master/README.md\n\n### Lens\n\nLens\
  \ 也是一个免费工具，通过客户端二进制文件安装。对我来说，Lens 是可视化和调试应用程序的最佳工具。Lens 的文档可在此处查看：\nhttps://k8slens.dev/。\n\
  \n您可以在下图中查看 Lens 仪表板的概览：\n\n![](img/d3344b39c888aab0b832625465f837c9_357_0.png)\n\
  \n图 10.32 – Lens 仪表板\n\n讨论了调试应用程序的工具后，我们将看到如何显示 Kubernetes 指标。\n\n### 监控 Kubernetes\
  \ 指标\n\n刚才描述的所有工具对于调试 Kubernetes 资源和托管在 Kubernetes 中的应用程序非常出色。但这还不够——在监控方面，我们还需要监控应用程序使用的\
  \ CPU 和 RAM 等指标。\n\n\n\n\nWith the following basic `kubectl` command line, we can\
  \ display the CPU and RAM used by nodes and pods:\n\n```\nPS C:\\Users\\mkrieg>\
  \ kubectl top nodes\nNAME CPU(cores) CPU% MEMORY(bytes) MEMORY%\naks-default-29977126-vmss000000\
  \ 133m 7% 1875Mi 87%\naks-default-29977126-vmss000001 147m 7% 1986Mi 92%\naks-default-29977126-vmss000002\
  \ 342m 18% 2017Mi 93%\nPS C:\\Users\\mkrieg> kubectl top pods -n vault\nNAME CPU(cores)\
  \ MEMORY(bytes)\naks-helloworld-7bfc99f965-m78dl 15m 87Mi\nconsul-consul-connect-injector-webhook-deployment-79b4b98ctt844\
  \ 4m 38Mi\nconsul-consul-controller-5bd877dfd-4rlmw 2m 22Mi\nconsul-consul-gjtkq\
  \ 8m 32Mi\nconsul-consul-klk08 8m 26Mi\nconsul-consul-server-0 14m 64Mi\nconsul-consul-tnlds\
  \ 9m 23Mi\nconsul-consul-webhook-cert-manager-556df5dbfd-k6wfp 3m 20Mi\nvault-0\
  \ 4m 53Mi\nvault-1 6m 37Mi\nvault-agent-injector-846f9f7bc6-76bjz 4m 13Mi\nweb-0lenqv6avrgwgqscxzhzsz6rqk-f5984776d-lkzqz\
  \ 0m 0Mi\n```\n\nFigure 10.33 – kubectl getting metrics\n\nAmong the best-known\
  \ solutions are **Prometheus** and **Grafana**, which monitor the metrics of Kubernetes\
  \ and provide a lot of dashboard models.\n\nFor more details, you can read this\
  \ article, which explains Kubernetes monitoring with Prometheus and Grafana:\n\n\
  `https://sysdig.com/blog/kubernetes-monitoring-prometheus/`\n\nIn this section,\
  \ we discussed some `kubectl` commands, tools, or solutions such as dashboards,\
  \ Octant, and Lens to debug applications on Kubernetes.\n\n### 摘要\n\nIn this chapter,\
  \ we have seen an advanced use of containers with the use of Kubernetes, which is\
  \ a container manager.\n\nWe discussed the different options for installing a small\
  \ cluster on a local machine using Docker Desktop. Then, using the YAML specification\
  \ file and the `kubectl` command, we realized the deployment of a Docker image in\
  \ our Kubernetes cluster in order to run a web application.\n\nWe installed and\
  \ configured Helm, which is the package manager of Kubernetes. Then, we applied\
  \ it in practice with an example of a chart deployment in Kubernetes.\n\nWe also\
  \ had an overview of AKS, which is a Kubernetes service managed by Azure, looking\
  \ at its creation and configuration and some resources links that explain how to\
  \ deploy applications with CI/CD pipelines with Azure DevOps.\n\nFinally, we finished\
  \ this chapter with a short list of Kubernetes monitoring tools such as the `kubectl`\
  \ command line, Lens, Prometheus, and Grafana for debugging Kubernetes metrics.\n\
  \nThe next chapter begins a new part of this book, which deals with application\
  \ testing, and we will start with **application programming interface (API)** testing\
  \ with Postman.\n\n### 问题\n\n- 1. What is the role of Kubernetes?\n- 2. Where is\
  \ the configuration of the objects that are written in Kubernetes?\n- 3. What is\
  \ the name of the Kubernetes client tool?\n- 4. Which command allows us to apply\
  \ a deployment in Kubernetes?\n- 5. What is Helm?\n- 6. What is AKS?\n\n### 延伸阅读\n\
  \nIf you want to know more about Kubernetes, take a look at the following resources:\n\
  \n- _The DevOps 2.3 Toolkit_: `https://www.packtpub.com/business/devops-23-toolkit`\n\
  - _Hands-On Kubernetes on Azure_: `https://www.packtpub.com/virtualization-and-cloud/hands-kubernetes-azure`\n\
  - _Hands-On Kubernetes on Azure - Second Edition_: `https://www.packtpub.com/product/hands-on-kubernetes-on-azure-second-edition/9781800209671`\n\
  - _Mastering Kubernetes - Third Edition_: `https://www.packtpub.com/product/mastering-kubernetes-third-edition/9781839211256`\n"
- '# 第 4 部分：测试您的应用程序


  This part explains some ways of testing APIs with Postman. Then we talk about static
  code analysis with SonarQube and performance tests involving Postman. This section
  comprises the following chapters:


  - Chapter 11, Testing APIs with Postman

  - Chapter 12, Static Code Analysis with SonarQube

  - Chapter 13, Security and Performance Tests

  '
- "## 11 使用 Postman 测试 API\n\nIn the previous chapters, we talked about DevOps culture\
  \ and **Infrastructure as Code** (IaC) with Terraform, Ansible, and Packer. Then,\
  \ we saw how to use a source code manager with Git, along with the implementation\
  \ of a CI/CD pipeline with Jenkins and Azure Pipelines. Finally, we showed the containerization\
  \ of applications with Docker and their deployment in a Kubernetes cluster.\n\n\
  If you are a developer, you should realize that you use APIs every day, either for\
  \ client-side use (where you consume the API) or as a provider of the API.\n\nAn\
  \ API, as well as an application, must be testable, that is, it must be possible\
  \ to test the different methods of this API in order to verify that it responds\
  \ without error and that the response of the API is equal to the expected result.\n\
  \nIn addition, the proper functioning of an API is much more critical to an application\
  \ because this API is potentially consumed by several client applications, and if\
  \ it does not work, it will have an impact on all of these applications.\n\nThe\
  \ common API challenges are that we need to script or develop a dedicated application\
  \ client to test each API individually or a workflow of multiple API execution.\n\
  \nIn this chapter, we will learn how to test an API with a specialized tool called\
  \ **Postman**. We will explore the use of collections and variables, then we will\
  \ write Postman tests, and finally, we will see how to automate the execution of\
  \ Postman tests with Newman in a CI/CD pipeline.\n\nThis chapter covers the following\
  \ topics:\n\n- Creating a Postman collection\n- Using environments and variables\n\
  - Writing Postman tests\n- Executing tests locally\n- Understanding the Newman concept\n\
  - Preparing Postman collections for Newman\n- Running the Newman command line\n\
  - Integration of Newman in the CI/CD pipeline process\n\n### 技术要求\n\nIn this chapter,\
  \ we will use **Newman**, which is a Node.js package. Therefore, we need to install\
  \ Node.js and npm on our computer beforehand, which we can download at `https://nodejs.org/en/`.\n\
  \nFor the demo APIs that are used in this chapter, we will use an example that is\
  \ provided on the internet: `https://jsonplaceholder.typicode.com/`.\n\nThe GitHub\
  \ repository, which contains the complete source code used in this chapter, can\
  \ be found at `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP11`.\n\
  \nCheck out the following video to see the code in action: `https://bit.ly/3s7239U`.\n\
  \n### 使用请求创建 Postman 集合\n\nPostman is a free client tool in a graphical format that\
  \ can be installed on any type of OS. Its role is to test APIs through requests,\
  \ which we will organize into collections. It also allows us to dynamize API tests\
  \ through the use of variables and the implementation of environments. Postman is\
  \ famous for its ease of use, but also for the advanced features that it offers.\n\
  \nIn this section, we will learn how to create and install a Postman account, then\
  \ we will create a collection that will serve as a folder to organize our requests,\
  \ and finally, we will create a request that will test a demo API.\n\nBefore we\
  \ use Postman, we will need to create a Postman account by going to `https://www.postman.com/`\
  \ and clicking on the **Sign Up for Free** button. In the form, click on the **Create\
  \ Account** link, as shown in the following screenshot:\n\n![](img/d3344b39c888aab0b832625465f837c9_365_0.png)\n\
  \nFigure 11.1 – Postman signup\n\nNow, you can either create a Postman account for\
  \ yourself by filling out the form, or you can create an account using your Google\
  \ account.\n\nThis account will be used to synchronize Postman data between your\
  \ machine and your Postman account. This way, the data will be accessible on all\
  \ of your workstations.\n\nAfter creating a Postman account, we will look at how\
  \ to download and install it on a local machine.\n\n### 安装 Postman\n\nOnce the Postman\
  \ account has been created, those who are using Windows can download Postman from\
  \ `https://www.getpostman.com/downloads/` and choose the version to install. For\
  \ those who want to install it on Linux or macOS, just click on the link of your\
  \ OS. The following screenshot shows the download links according to your OS:\n\n\
  #### Postman 应用程序\n\nThe ever-improving Postman app (a new release every two weeks)\
  \ gives you a full-featured Postman experience.\n\n![](img/d3344b39c888aab0b832625465f837c9_366_0.png)\n\
  \nBy downloading and using Postman, I agree to the [Privacy Policy](https://www.getpostman.com/privacy)\
  \ and [Terms](https://www.getpostman.com/terms).\n\nVersion 9.4.1 · [Release Notes](https://www.getpostman.com/release-notes)\
  \ · [Product Roadmap](https://www.getpostman.com/product-roadmap)\n\nNot your OS?\
  \ Download for Mac ([Intel Chip](https://www.getpostman.com/downloads/mac-intel)\
  \ / [Apple Chip](https://www.getpostman.com/downloads/mac-apple)) or Linux (x64)\n\
  \nFigure 11.2 - Postman download\n\nOnce Postman is downloaded, we need to install\
  \ it by clicking on the download file for Windows, or for other OSes, follow the\
  \ installation documentation at `https://learning.getpostman.com/docs/postman/launching_postman/installation_and_updates/`.\n\
  \nWe have just seen that the installation of Postman is very simple; the next step\
  \ is to create a collection in which we will create a request.\n\n> **Note**\n>\
  \ The API that we will test in this chapter is a demo API, which is provided freely\
  \ on the following site: `https://jsonplaceholder.typicode.com/`.\n\n\n\n\n\n###\
  \ 创建集合\n\n在 Postman 中，我们测试的任何请求都必须添加到名为 `Collection` 的目录中，该目录用于存储请求，并允许更好地组织请求。\n\
  \n因此，我们将创建一个名为 `DemoBook` 的集合，该集合将包含对演示 API 的请求，为此，我们将执行以下任务：\n\n1. 在 Postman 中，在左侧面板上，单击\
  \ **Collections | +** 按钮。\n2. 选项卡打开后，我们将输入名称 `DemoBook`。创建新集合的这些步骤在以下屏幕截图中有所说明：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_367_0.png)\n\n图 11.3 – Postman 集合创建\n\
  \n因此，我们有一个名为 `Demobook` 的集合，它出现在 Postman 的左侧面板中。\n\n此集合还与我们的 Postman Web 帐户同步，我们可以在\
  \ `https://web.postman.co/me/collections` 访问它。\n\n此集合将允许我们组织 API 测试的请求，并且还可以修改其属性，以便对包含在此集合中的所有请求应用某些配置。\n\
  \n这些属性包括请求身份验证、请求前后要执行的测试以及此集合中所有请求共有的变量。\n\n要修改此集合的设置和属性，请执行以下操作：\n\n1. 单击集合上下文菜单中的\
  \ ... 按钮。\n2. 选择 **Edit** 选项，此时将出现编辑表单，我们可以在其中更改将应用于此集合中请求的所有设置。\n3. 在编辑授权、脚本、测试或变量选项的所有配置选项卡之间切换。\n\
  \n### 创建我们的第一个请求\n\n在 Postman 中，包含要测试的 API 属性的对象称为 **请求**。\n\n此请求包含 API 本身的配置，但它还包含要执行的测试，以检查其是否正常运行。\n\
  \n请求的主要参数如下：\n\n- API 的 URL\n- 其方法：GET/POST/DELETE/PATCH\n- 其身份验证属性\n- 其查询字符串键及其请求正文\n\
  - 要在 API 执行前后执行的测试\n\n以下屏幕截图显示了修改集合属性的步骤：\n\n因此，我们已经讨论了创建集合（即第一个 Postman 工件）所遵循的过程，这将允许我们组织\
  \ API 测试请求。\n\n我们现在将创建一个请求，该请求将调用并测试我们的演示 API 的正常运行情况。\n\n![](img/d3344b39c888aab0b832625465f837c9_368_0.png)\n\
  \n请求的创建分为两步：在集合中创建，然后进行配置。\n\n1. **创建请求**：要创建我们 API 的请求，需要遵循以下步骤：\n\n   I. 我们转到\
  \ DemoBook 集合的上下文菜单，并单击 **Add Request** 选项：\n\n   ![](img/d3344b39c888aab0b832625465f837c9_369_0.png)\n\
  \n   图 11.5 – 在 Postman 中添加请求\n\n   II. 然后，在新选项卡中输入请求名称，即 Get all posts，如以下屏幕截图所示：\n\
  \n   ![](img/d3344b39c888aab0b832625465f837c9_370_0.png)\n\n2. **配置请求**：创建请求后，我们将通过输入要测试的\
  \ API 的 URL（即 `https://jsonplaceholder.typicode.com/posts`）并使用 **GET** 方法来对其进行配置。输入\
  \ URL 后，我们单击 **Save** 按钮保存请求配置。以下屏幕截图显示了带有 URL 和方法的此请求参数：\n\n   ![](img/d3344b39c888aab0b832625465f837c9_370_1.png)\n\
  \n最后，为了完成测试并为我们的实验室添加更多内容，我们将向集合中添加第二个请求，我们将其命名为 Get a single post。它将测试 API 的另一种方法，并且还将确保我们使用\
  \ `https://jsonplaceholder.typicode.com/posts/<ID of post>` URL 对其进行配置。\n\n以下屏幕截图显示了我们集合中的请求：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_371_0.png)\n\n图 11.8 – Postman 请求列表\n\
  \n> **Note**\n> 请注意，有关集合创建的 Postman 文档可在 `https://learning.getpostman.com/docs/postman/collections/creating_collections/`\
  \ 上找到。\n\n在本节中，我们学习了如何在 Postman 中创建集合，以及如何创建请求及其配置。\n\n在下一节中，我们将学习如何使用环境和变量来动态化我们的请求。\n\
  \n### 使用环境和变量动态化请求\n\n当我们想要测试 API 时，我们需要在多个环境中对其进行测试以获得更好的结果。例如，我们将在本地计算机和开发环境中对其进行测试，然后也在\
  \ QA 环境中进行测试。为了优化测试实现时间并避免在 Postman 中出现重复请求，我们将向同一请求注入变量，以便在所有环境中都可测试。\n\n因此，在以下步骤中，我们将通过创建一个环境和两个变量来改进我们的请求；然后，我们将修改请求以使用这些变量：\n\
  \n1. 在 Postman 中，我们将首先创建一个名为 `Local` 的 **环境**，如以下屏幕截图所示：\n\n   ![](img/d3344b39c888aab0b832625465f837c9_372_0.png)\n\
  \n   图 11-9 – 在 Postman 中添加环境\n\n2. 然后，在此 `Local` 环境中，我们将插入一个名为 `POSTID` 的 **变量**，该变量将包含要传递给请求\
  \ URL 的值。以下屏幕截图显示了 `POSTID` 变量的创建：\n\n   图 11.10 – 在 Postman 中添加环境变量\n\n3. 因此，对于\
  \ `Local` 环境，`PostID` 变量的值为 6。要为其他环境设置不同的值，有必要使用我们刚刚看到的相同步骤创建其他环境，然后添加相同的变量（同名）及其相应的值。例如，以下是\
  \ `QA` 环境的变量屏幕：\n\n   图 11.11 – 在 Postman 中添加第二个环境\n\n4. 最后，我们将修改请求以使用刚刚声明的变量。在\
  \ Postman 中，变量的使用是通过 `{{variable_name}}` 模式完成的。因此，首先，我们从右上角的下拉列表中选择所需的环境。然后，在请求中，我们将用\
  \ `{{POSTID}}` 替换 URL 末尾的帖子 ID，如以下屏幕截图所示：\n\n   ![](img/d3344b39c888aab0b832625465f837c9_374_0.png)\n\
  \n   图 11.12 – 在 Postman 中使用环境变量\n\n> **Note**\n> 请注意，有关环境和变量的 Postman 文档可在 https://learning.getpostman.com/docs/postman/environments_and_globals/intro_to_environments_and_globals/\
  \ 上找到。\n\n在本节中，我们创建了一个 Postman 请求，该请求将允许我们测试 API。然后，我们通过在 Postman 中创建包含变量的环境（这些变量也用于\
  \ Postman 的请求）来使其执行更加灵活。\n\n在下一节中，我们将编写 Postman 测试以验证 API 结果。\n\n### 编写 Postman\
  \ 测试\n\n测试 API 不仅仅是检查其调用是否返回 200 返回码，即 API 是否响应正常，还要检查其返回结果是否符合预期，或者其执行时间是否不过长。\n\
  \n例如，考虑一个以 JSON 格式返回包含多个属性的响应的 API。在此 API 的测试中，有必要验证返回的结果是包含预期属性的 JSON 文本，并且更有必要验证这些属性的值。\n\
  \n在 Postman 中，可以编写测试，以确保请求的响应在返回或执行时间方面符合预期结果，使用的是 JavaScript 语言。\n\nPostman 测试在请求的\
  \ **Tests** 选项卡中编写：\n\n![](img/d3344b39c888aab0b832625465f837c9_375_0.png)\n\n图\
  \ 11.13 – Postman Tests 选项卡\n\n要测试我们的请求，我们将编写几个测试，如下所示：\n\n- 请求的返回码为 200\n- 请求的响应时间小于\
  \ 400 ms\n- 答案不是空 JSON\n- 返回的 JSON 响应包含 `userId` 属性，且其值等于 1\n\n要执行这些测试，我们将在 **Tests**\
  \ 选项卡中编写以下代码。\n\n以下代码说明了请求的返回码：\n\n```\npm.test(\"Status code is 200\", function\
  \ () {\npm.response.to.have.status(200);\n});\n```\n\n\n\n\n\n下面的代码说明响应时间小于 400\
  \ ms：\n\n```\npm.test(\"Response time is less than 400ms\", function () {\n    pm.expect(pm.response.responseTime).to.be.below(400);\n\
  });\n```\n\n下面的代码说明 JSON 格式的响应不为空：\n\n```\npm.test(\"Json response is not empty\"\
  , function () {\n    pm.expect(pm.response).to.be.json;\n});\n```\n\n下面的代码说明，在 JSON\
  \ 响应中，`userId` 属性等于 1：\n\n```\npm.test(\"Json response userId eq 1\", function ()\
  \ {\n    var jsonRes = pm.response.json();\n    pm.expect(jsonRes.userId).to.eq(1);\n\
  });\n```\n\n因此，最终，我们请求的 **Tests** 选项卡（用于测试我们的 API）包含所有这些代码，如下面的截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_376_0.png)\n\
  \n图 11.14 – Postman Tests 代码\n\n我们已完成带有测试编写的 Postman 请求，它将根据 API 的反馈代码、性能和响应内容来检查\
  \ API 的正常运行。\n\n> 注意\n> 要了解有关 Postman 测试和脚本的更多信息，可以阅读 https://learning.getpostman.com/docs/postman/scripts/intro_to_scripts\
  \ 上的文档。\n\n在本节中，我们刚刚了解了如何在 Postman 中编写 API 测试来检查我们 API 的正常运行。我们现在将在本地运行我们的 Postman\
  \ 请求以测试我们的 API。\n\n### 在本地执行 Postman 请求测试\n\n到目前为止，在 Postman 中，我们已创建一个集合，其中两个请求包含我们要测试的\
  \ API 的参数和测试。要使用参数和测试来检查 API 的正常运行，我们现在必须执行位于 Postman 中的请求。请注意，只有在执行结束时，我们才会知道我们的\
  \ API 是否符合我们的预期。\n\n要执行 Postman 请求，请执行以下操作：\n\n1. 首先必须选择所需的环境。\n2. 单击请求的 **Send**\
  \ 按钮，如下面的截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_377_0.png)\n\n图 11.15\
  \ – Postman 注册\n\n3. 在 **Body** 选项卡中，我们可以查看查询响应的内容，如果我们想以 JSON 格式显示它，可以选择显示格式。下面的截图显示了以\
  \ JSON 格式显示的请求响应：\n\n![](img/d3344b39c888aab0b832625465f837c9_378_0.png)\n\n4. **Test\
  \ Results** 选项卡显示我们之前编写的测试的执行结果，在我们的情况中，四个测试都已正确执行——它们全部显示为绿色，如下面的截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_378_1.png)\n\
  \n在前面的截图中，我们可以看到 Postman 请求的返回代码等于 200，这对应于请求成功执行的返回代码，以及其 23 ms 的执行时间，这低于我为自己设定的阈值（400\
  \ ms）作为示例。\n\n如果某个测试失败，它将显示为红色以便清晰识别。失败测试的示例如下面的截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_379_0.png)\n\
  \n图 11.18 – Postman 测试失败\n\n我们刚刚了解了执行 Postman 请求以测试 API，但此执行仅适用于当前请求。如果我们想要执行集合中的所有\
  \ Postman 请求，可以使用 **Postman Collection Runner**。\n\nPostman Collection Runner 是\
  \ Postman 的一个功能，它会按请求在集合中组织的顺序自动执行集合中的所有请求。\n\n你可以通过访问 `https://learning.getpostman.com/docs/postman/collection_runs/starting_a_collection_run/`\
  \ 了解更多有关集合文档的信息。\n\n下面的两个截图显示了 **Runner** 执行步骤，在其中我们选择要执行的集合、环境和迭代次数。要启动其执行，我们单击\
  \ **Run DemoBook** 按钮：\n\n![](img/d3344b39c888aab0b832625465f837c9_380_0.png)\n\n\
  图 11.19 – Postman Runner\n\n因此，在 **Runner** 选项卡中，我们可以看到集合中所有请求的测试执行结果，如下面的截图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_380_1.png)\n\n图 11.20 – Postman Runner\
  \ 执行\n\n![](img/d3344b39c888aab0b832625465f837c9_381_0.png)\n\n在本节中，我们学习了如何执行 Postman\
  \ 请求以单元方式测试 API，然后再使用 Postman Runner 执行集合中的所有请求。在下一节中，我们将介绍 Newman，它允许我们自动化执行 Postman\
  \ 测试。\n\n### 理解 Newman 概念\n\n在本章中，到目前为止，我们一直在讨论在本地使用 Postman 来测试我们开发或使用的 API。但在单元测试、验收测试和集成测试中，重要的是它们是自动化的，以便可以在\
  \ CI/CD 管道中执行。\n\nPostman 本身是一个图形工具，不会自动化自身，但有一个名为 **Newman** 的另一个工具，它可以自动化在 Postman\
  \ 中编写的测试。\n\n![](img/d3344b39c888aab0b832625465f837c9_381_1.png)\n\nNewman 是一个免费的命令行工具，其巨大的优势在于可以自动化已经在\
  \ Postman 中编写的测试。它允许我们将 API 测试执行集成到 CI/CD 脚本或流程中。\n\n此外，它还提供生成不同格式（HTML、JUnit 和\
  \ JSON）的测试结果报告的可能性。\n\n不过，Newman 不允许我们执行以下操作：\n\n- 创建或配置 Postman 请求；正如我们将看到的，由 Newman\
  \ 执行的请求将从 Postman 导出。\n- 仅执行集合中的一个请求——它执行集合中的所有请求。\n\n### 使用 Postman 测试 API\n\n\
  > 注意\n> 要了解有关 Newman 的更多信息，可以访问 `https://www.npmjs.com/package/newman` 上的产品页面。\n\
  \n要使用 Newman，我们需要——如本章 _Technical requirements_ 部分所述——安装 Node.js 和 npm，它们可在 `https://nodejs.org/en/`\
  \ 上获得（此安装程序同时安装这两个工具）。\n\n然后，要安装 Newman，我们必须在终端中执行此命令：\n\n```\nnpm install -g newman\n\
  ```\n\n下面的截图显示了命令的执行：\n\n![](img/d3344b39c888aab0b832625465f837c9_382_0.png)\n\n\
  图 11.21 – Newman 安装\n\n此命令在全局范围内安装 npm `newman` 包及其所有依赖项，也就是说，它在整个本地机器上都可访问。\n\n\
  安装后，我们可以通过运行 `newman --help` 命令来测试其安装，该命令显示要使用的参数和选项，如下面的截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_382_1.png)\n\
  \n图 11.22 – Newman 帮助命令\n\n在本节中，我们通过讨论 Newman 的优势来介绍它，并学习了如何安装它。在下一节中，我们将导出 Postman\
  \ 的集合和环境以供 Newman 使用。\n\n### 为 Newman 准备 Postman 集合\n\n正如我们刚刚看到的，Newman 是 Postman\
  \ 的客户端工具，要工作，它需要我们在 Postman 中创建的集合、请求和环境的配置。\n\n这就是为什么，在运行 Newman 之前，我们将不得不导出 Postman\
  \ 的集合和环境，并且此导出将作为 Newman 的参数。那么，让我们开始导出我们在 Postman 中创建的 DemoBook 集合。\n\n#### 导出集合\n\
  \n导出 Postman 集合包括获取一个 JSON 文件，该文件包含此集合及其中请求的所有设置。\n\n正是从这个 JSON 文件，Newman 才能运行与我们从\
  \ Postman 运行时相同的 API 测试。\n\n要执行此导出，请执行以下任务：\n\n1. 转到我们要导出的集合的上下文菜单。\n2. 选择 **Export**\
  \ 操作。\n3. 然后，在打开的窗口中，取消选中 **Collection v2.1 (recommended)** 复选框。\n4. 最后，通过单击 **Export**\
  \ 按钮进行验证。\n\n\n\n\n\n### 这些步骤在以下截图中显示：\n\n![](img/d3344b39c888aab0b832625465f837c9_384_0.png)\n\
  \n单击 **Export** 按钮会将集合导出为 JSON 格式文件，`DemoBook.postman_collection.json`，我们将其保存在创建的专用于\
  \ Newman 的文件夹中。\n\n导出集合后，我们还需要导出环境和变量信息，因为我们集合中的请求依赖于这些信息。\n\n### 导出环境\n\n我们可以在此处停止\
  \ Newman 的配置，但问题是我们的 Postman 请求使用的是在环境中配置的变量。\n\n因此，我们还需要以 JSON 格式导出每个环境的信息，以便可以将其作为参数传递给\
  \ Newman。\n\n要导出环境及其变量，请执行以下任务：\n\n- 从 Postman 左侧面板打开 **ENVIRONMENTS**。\n- 然后，单击\
  \ **Export** 环境按钮。\n\n这些步骤在以下截图中显示：\n\n![](img/d3344b39c888aab0b832625465f837c9_385_0.png)\n\
  \n图 11.24 – Postman 导出环境\n\n因此，对于每个环境，我们将其配置导出到一个 JSON 文件中，并将其保存在导出集合的同一文件夹中。\n\n\
  最后，我们在机器上有一个文件夹，其中包含三个 Postman JSON 文件：\n\n- 一个用于集合的 JSON 文件\n- 一个用于 `Local` 环境的\
  \ JSON 文件\n- 一个用于 `QA` 环境的 JSON 文件\n\n以下截图显示了包含 Postman 导出内容的本地文件夹：\n\n![](img/d3344b39c888aab0b832625465f837c9_386_0.png)\n\
  \n图 11.25 – Postman 导出文件夹\n\n我们刚刚介绍了 Postman 请求的所有配置的导出，包括集合和环境，现在我们将查看 Newman 命令行的执行。\n\
  \n### 运行 Newman 命令行\n\n在导出了前面看到的 Postman 配置后，我们将在本地机器上运行 Newman 实用程序。\n\n要执行 Newman，请转到\
  \ Terminal，然后转到 JSON 配置文件所在的文件夹，并执行以下命令：\n\n```\nnewman run DemoBook.postman_collection.json\
  \ -e Local.postman_environment.json\n```\n\n`newman run` 命令将我们导出的集合的 JSON 文件作为参数和参数\
  \ `-e`（即导出的环境的 JSON 文件）进行处理。\n\n> **Note**\n>\n> 有关此命令的所有参数的更多详细信息，请阅读 https://www.npmjs.com/package/newman#newman-options\
  \ 上的文档。\n\nNewman 将执行我们导出的集合中的 Postman 请求。它还将使用导出环境的变量，并执行我们在请求中编写的测试。\n\n其执行结果（非常详细）在以下截图中显示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_387_0.png)\n\n图 11.26 – Newman 执行\n\n\
  以下是另一个截图，显示了在测试中出现错误时的执行结果：\n\n![](img/d3344b39c888aab0b832625465f837c9_388_0.png)\n\
  \n图 11.27 – Newman 测试失败\n\n我们可以看到显示错误的测试详细信息以及请求中预期的内容。在本节中，我们学习了如何在本地机器上运行 Newman，现在我们将学习\
  \ Newman 如何集成到 CI/CD 管道中。\n\n### Newman 在 CI/CD 管道流程中的集成\n\nNewman 是一个工具，可从命令行自动执行\
  \ Postman 请求，这将使我们能够快速将其集成到 CI/CD 管道中。\n\n为了简化其在管道中的集成，我们转到包含从 Postman 导出的 JSON\
  \ 文件的目录中的第一步，并创建一个 npm 配置文件——package.json。\n\n这将具有以下内容：\n\n```json\n{\n  \"name\"\
  : \"postman\",\n  \"version\": \"1.0.0\",\n  \"description\": \"postmanrestapi\"\
  ,\n  \"scripts\": {\n    \"testapilocal\": \"newman run DemoBook.postman_collection.json\
  \ -e Local.postman_environment.json -r junit,cli --reporter junit-export result-tests-local.xml\"\
  ,\n    \"testapiQA\": \"newman run DemoBook.postman_collection.json -e QA.postman_environment.json\
  \ -r junit,cli --reporter-junit export result-tests-qa.xml\"\n  },\n  \"devDependencies\"\
  : {\n    \"newman\": \"^5.3.0\"\n  }\n}\n```\n\n在 scripts 部分，我们放置了前面部分中看到的命令行将执行的两个脚本，并向它们添加了\
  \ `-r` 参数，该参数允许以 JUnit 格式输出命令的报告，而在 DevDependencies 部分，我们指示需要 Newman 包。\n\n就这样；我们拥有将\
  \ Newman 的执行集成到 CI/CD 管道所需的所有文件。\n\n为了展示 Newman 在 CI/CD 管道中的集成，我们将使用 **Azure Pipelines**——一个我们在\
  \ _Chapter 7, Continuous Integration and Continuous Delivery_ 和 _Chapter 9, Containerizing\
  \ Your Application with Docker_ 中见过的 Azure DevOps 服务，它的优势在于拥有管道的图形表示。\n\n作为管道的先决条件，包含\
  \ Postman 导出的 JSON 文件以及 `package.json` 文件的目录必须提交到源代码控制版本中。在我们的情况中，我们将使用包含本章完整源代码的\
  \ GitHub 仓库：`https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP11`。\n\
  \n### 生成和发布配置\n\n在 Azure Pipelines 中，我们将通过执行以下操作来创建生成和发布配置：\n\n- 我们创建一个新的 **build\
  \ definition**，它将运行 Newman 所需的文件复制到生成构件中，如以下截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_390_0.png)\n\
  \n图 11.28 – Azure Pipelines 发布 Newman 文件\n\n我们还在 **Triggers** 选项卡中启用持续集成选项。然后，为了运行此生成，我们保存并排队此生成定义。\n\
  \n- 然后，我们创建一个新的 **release definition**，它将负责为每个环境运行 Newman。此发布将获取生成的构件，并将由两个阶段组成，**DEV**\
  \ 和 **QA**，如以下截图所示：\n\nAll pipelines > Newman exec\n\nPipeline Tasks ↓ Variables\
  \ Retention Options History\n\n![](img/d3344b39c888aab0b832625465f837c9_391_0.png)\n\
  \n图 11.29 – Azure Pipelines Newman 执行发布\n\n对于每个阶段，我们根据 package.json 文件配置三个任务，如下所示：\n\
  \n- 安装 Newman。\n- 运行 Newman。\n- 在 Azure Pipelines 中发布测试结果。\n\n以下截图显示了每个阶段的任务配置：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_392_0.png)\n\n图 11.30 – Azure Pipelines\
  \ Newman 发布步骤\n\n让我们按顺序查看这些任务参数的详细信息。\n\n### npm install\n\n**npm install** 任务的参数如下：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_393_0.png)\n\n图 11.31 – Azure Pipelines\
  \ npm install\n\n在此，要在包含构件文件的目录中执行的命令是 `npm install`。\n\n### npm run newman\n\n\
  **npm run newman** 任务的参数如下：\n\n![](img/d3344b39c888aab0b832625465f837c9_394_0.png)\n\
  \n在此，要执行的自定义命令是在包含构件文件的目录中运行 `npm run testapilocal`，其中 `testapilocal` 命令在 `package.json`\
  \ 文件的 script 部分中定义（如前所述），并执行 Newman 的命令行。\n\n### 发布测试结果\n\n**Publish Test Results**\
  \ 任务的参数如下，该任务允许我们发布 Newman 执行的测试结果在 Azure Pipelines 中：\n\n### 发布测试结果\n\nTask version\
  \ 2.*\n\nDisplay name *\nPublish Test Results\n\nTest result format *\nJUnit\n\n\
  Test results files *\n**/result-tests-local.xml\n\nSearch folder\n$(System.DefaultWorkingDirectory)\n\
  \n图 11.33 – Azure Pipelines 发布 Newman 测试结果\n\n在此任务的参数中，我们指示由 Newman 生成的 JUnit XML\
  \ 报告文件，并在此任务的 **Control Options** 字段中选择一个选项，即使 **npm run newman** 任务失败也要执行该任务。\n\
  \n\n\n\n\n### 流水线执行\n\n完成发布配置后，我们可以执行此发布，最后，可以在 **Tests** 选项卡中查看 Newman 测试的报告。\n\
  \n以下截图显示了 Azure Pipelines 中 Newman 测试的报告：\n\n![](img/d3344b39c888aab0b832625465f837c9_396_0.png)\n\
  \n图 11.35 – Azure Pipelines 中 Newman 测试结果视图\n\n以下截图显示了运行此任务的 **Control Options**\
  \ 参数：**即使之前的任务失败，除非部署已取消**：\n\n![](img/d3344b39c888aab0b832625465f837c9_396_1.png)\n\
  \n图 11.34 – Azure Pipelines 发布 Newman 测试结果选项\n\n流水线配置已完成——我们现在将进行其执行。\n\n所有 Postman\
  \ 测试均已成功完成。\n\n以下是一张截图，显示了在某个测试失败时的测试报告：\n\n![](img/d3344b39c888aab0b832625465f837c9_397_0.png)\n\
  \n图 11.36 – Azure Pipelines 中 Newman 失败测试结果视图\n\n因此，我们成功集成了 Newman 的执行，从而能够在 CI/CD\
  \ 流水线中自动化我们在 Postman 中配置的 API 请求。\n\n关于在 **Jenkins** 中集成 Newman 执行，请阅读 https://learning.getpostman.com/docs/postman/collection_runs/integration_with_jenkins\
  \ 的文档，关于与 **Travis CI** 集成，文档可在 https://learning.getpostman.com/docs/postman/collection_runs/integration_with_travis\
  \ 找到。\n\n在本节中，我们学习了如何在 Azure Pipelines 中创建和配置 CI/CD 流水线，该流水线执行已为 Newman 导出的 Postman\
  \ 测试。\n\n### 总结\n\n在本章中，我们介绍了 Postman，这是一个用于测试 API 的优秀工具。我们创建了 Postman 账户并将其本地安装。\n\
  \n然后，我们创建了集合和环境，其中创建了包含待测试 API 设置的请求。\n\n我们还讨论了使用 Newman 命令行工具自动化这些测试，并导出 Postman\
  \ 集合和环境。\n\n最后，在本章的最后部分，我们在 Azure DevOps 中创建并执行了一个 CI/CD 流水线，该流水线在 DevOps 过程中自动化\
  \ API 测试的执行。\n\n在下一章中，我们将继续探讨测试主题，并将研究使用名为 **SonarQube** 的知名工具进行静态代码分析。\n\n### 问题\n\
  \n- 1. Postman 的目标是什么？\n- 2. 在 Postman 中首先需要创建什么元素？\n- 3. 包含待测试 API 配置的元素名称是什么？\n\
  - 4. Postman 中哪个工具允许我们执行集合中的所有请求？\n- 5. 哪个工具允许我们将 Postman API 测试集成到 CI/CD 流水线中？\n\
  \n### 延伸阅读\n\n如果您想了解更多关于 Postman 的信息，以下是一些额外资源：\n\n• Postman Learning Center: `https://learning.getpostman.com/`\n\
  \n• 关于 Postman 的视频和教程: `https://www.getpostman.com/resources/videos-tutorials/`\n"
- "## 12 使用 SonarQube 进行静态代码分析\n\n在上一章中，我们探讨了如何使用 Postman（一个用于测试 API 的免费工具）测试 **应用程序编程接口\
  \ (API)** 的功能，以及使用 Newman 将这些测试集成和自动化到 **持续集成/持续部署 (CI/CD)** 流水线中。\n\n测试 API 或应用程序的功能是一种良好的实践，当我们希望提高应用程序质量时。在公司中，应用程序的质量必须由所有成员考虑，因为为用户带来商业价值的应用程序会增加公司的利润。\n\
  \n然而，我们常常忽略测试应用程序代码的质量，因为我们认为重要的是应用程序如何工作，而不是它是如何编写的。这种思维方式是一个大错误，因为编写不良的代码可能包含安全漏洞，也可能导致性能问题。此外，代码质量对其维护和可扩展性有影响，因为过于复杂或编写不良的代码难以维护，因此公司修复它的成本会更高。\n\
  \n在本章中，我们将重点介绍使用名为 SonarQube 的知名工具进行静态代码分析。我们将简要概述它并介绍如何安装它。然后，我们将使用 SonarLint 在本地分析代码。最后，我们将\
  \ SonarQube 集成到 Azure Pipelines 上的 CI/CD 流水线中。\n\n在本章中，我们将涵盖以下主题：\n\n- 探索 SonarQube\n\
  - 安装 SonarQube\n- 使用 SonarLint 进行实时分析\n- 在 CI 过程中执行 SonarQube\n\n### 技术要求\n\n要使用\
  \ SonarQube 和 SonarLint，我们必须安装 **Java 运行时环境 (JRE)**，可在 `https://www.oracle.com/technetwork/java/javase/downloads/jre8-downloads-2133155.html`\
  \ 上找到（需要 Oracle 账户），在安装了 SonarQube 的服务器和安装了 SonarLint 的本地开发环境上。\n\n要将 SonarQube\
  \ 集成到 Azure DevOps 流水线中，我们必须在 Azure DevOps 组织上安装以下扩展：`https://marketplace.visualstudio.com/items?itemName=SonarSource.sonarqube`。\n\
  \n本章的完整代码源可在 `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP12`\
  \ 上找到。\n\n查看以下视频以查看代码运行情况：`https://bit.ly/3s96XTR`。\n\n### 探索 SonarQube\n\nSonarQube\
  \ 是 SonarSource (`https://www.sonarsource.com/`) 的开源工具，使用 Java 编写。它允许我们执行静态代码分析以验证应用程序代码的质量和安全性。\n\
  \nSonarQube 专为开发团队设计，为他们提供可自定义的仪表板和报告，以便他们可以展示其应用程序中的代码质量。\n\n它允许分析多种语言（超过 25 种）的静态代码，例如\
  \ **PHP: Hypertext Preprocessor (PHP)**、Java、.NET、JavaScript、Python 等。完整列表可在 `https://www.sonarqube.org/features/multi-languages/`\
  \ 上找到。\n\n此外，除了代码分析中的安全问题、代码异味和代码重复外，SonarQube 还为单元测试提供代码覆盖率。有关这些问题概念的更多详细信息，请阅读此处的文档：`https://docs.sonarqube.org/latest/user-guide/concepts/`。\n\
  \n最后，SonarQube 与 CI/CD 流水线集成良好，以便在开发人员提交代码时自动化代码分析。这降低了部署具有安全漏洞或代码复杂性过高的应用程序的风险。\n\
  \n另一方面，需要注意的是，他们有许多可以付费的插件。插件列表可在此处找到：`https://www.sonarplugins.com/`。\n\n现在我们已提供了\
  \ SonarQube 的概述，将查看其架构和组件。最后，我们将查看不同的安装方式。\n\n### 安装 SonarQube\n\nSonarQube 是一种本地解决方案，换句话说，必须安装在服务器或\
  \ **虚拟机 (VMs)** 上。此外，SonarQube 由多个组件组成，这些组件将分析应用程序的源代码，检索和存储来自此分析的数据，并提供关于代码质量和安全性的报告。\n\
  \n在安装 SonarQube 之前，查看其架构和组件是至关重要的。\n\n#### SonarQube 架构概述\n\nSonarQube 是一种客户端/服务器工具，这意味着其架构由服务器端和客户端端的构件组成。\n\
  \n以下图表显示了简化的 SonarQube 架构：\n\n![](img/d3344b39c888aab0b832625465f837c9_402_0.png)\n\
  \n图 12.1 – 带有客户端和服务器组件的 SonarQube 架构\n\n让我们看看前面图表中显示的组件。构成 SonarQube 服务器端的组件列表如下：\n\
  \n- 包含所有分析数据的 SQL Server、MySQL、Oracle 或 PostgreSQL 数据库。\n- 显示仪表板的 Web 应用程序。\n- 负责检索分析和处理并将其放入数据库的计算引擎。\n\
  - 使用 Elasticsearch 构建的搜索引擎。\n\n客户端组件列表如下：\n\n- 扫描器，它扫描应用程序的源代码并将数据发送到计算引擎。\n- 扫描器通常安装在用于执行\
  \ CI/CD 流水线的构建代理上。\n- SonarLint 是安装在开发人员工作站上的工具，用于实时分析。我们将在本章后面详细介绍它。\n\n\n\n\n\n\
  有关此架构的更多详细信息，我们可以查阅 SonarQube 架构和集成文档，该文档可在 https://docs.sonarqube.org/latest/user-guide/concepts/\
  \ 上找到。\n\n现在我们已经了解了其架构和组件，将学习如何安装它。\n\n### SonarQube 安装\n\nSonarQube 可以通过不同方式安装——手动安装，或从\
  \ Sonar 镜像安装 Docker 容器。或者，如果我们有 Azure 订阅，可以使用来自 Azure 市场的 SonarQube 虚拟机。让我们逐一详细了解这些选项。\n\
  \n### SonarQube 手动安装\n\n如果我们想手动安装 SonarQube 服务器，必须考虑先决条件。这些先决条件是：服务器上必须已安装 Java，并且需要检查\
  \ https://docs.sonarqube.org/latest/requirements/requirements/ 中显示的硬件配置。\n\n然后，我们必须按顺序手动安装服务器组件，如下所示：\n\
  \n1. 安装数据库。可以是 MSSQL、Oracle、PostgreSQL 或 MySQL。\n2. 然后，对于 Web 应用程序，从 https://www.sonarqube.org/downloads/\
  \ 下载 SonarQube 社区版，并解压下载的 ZIP 文件。\n3. 在 $SONARQUBE-HOME/conf/sonar.properties 文件中，配置对步骤\
  \ 1 中安装的数据库以及 Elasticsearch 存储路径的访问，详情请参阅以下文档：https://docs.sonarqube.org/latest/setup/install-server/。\n\
  4. 启动 Web 服务器。\n\n要了解根据所选数据库和我们的 **操作系统 (OS)** 进行此安装的所有详细信息，可以查阅以下文档：https://docs.sonarqube.org/latest/setup/install-server/。\n\
  \n### 通过 Docker 安装\n\n如果我们想为测试或演示目的安装 SonarQube 社区版，可以通过 Docker Hub 上提供的官方 Docker\
  \ 镜像 `https://hub.docker.com/_/sonarqube/` 进行安装。请注意，此镜像使用一个小型集成数据库，不适用于生产环境。\n\n\
  ### 在 Azure 中安装\n\n如果我们有 Azure 订阅，可以使用来自 Azure 市场的 SonarQube 虚拟机快速访问整个 SonarQube\
  \ 服务器。按照以下步骤在 Azure 中创建 SonarQube 虚拟机：\n\n1. 在 Azure 市场中，搜索并选择 **SonarQube** 镜像。以下截图显示了市场中的\
  \ SonarQube 页面：\n\n![](img/d3344b39c888aab0b832625465f837c9_404_0.png)\n\n图 12.2\
  \ – Azure 市场中的 SonarQube\n\n2. 单击 **创建** 按钮开始。\n\n3. 在 VM 表单中，在 **基本** 选项卡上，选择 **资源组**\
  \ 类型并提供 **虚拟机名称** 信息，如以下截图所示：\n\n### 创建虚拟机 ...\n\n基本   磁盘   网络   管理   高级   标记  \
  \ 审阅 + 创建\n\n创建运行 Linux 或 Windows 的虚拟机。从 Azure 市场选择镜像或使用您自己的自定义镜像。完成基本选项卡，然后选择审阅\
  \ + 创建以使用默认参数预配虚拟机，或查看每个选项卡以进行完全自定义。[了解更多](https://docs.microsoft.com/en-us/azure/virtual-machines/linux/quick-create-portal?toc=%2Fazure%2Fvirtual-machines%2Flinux%2Ftoc.json&bc=%2Fazure%2Fvirtual-machines%2Flinux%2Ftoc.json)\n\
  \n#### 项目详细信息\n\n选择订阅以管理已部署资源和成本。使用资源组像文件夹一样来组织和管理所有资源。\n\n订阅 *\nMicrosoft Azure\
  \ Sponsorship\n资源组 *\n(新) demo-sonar\n新建\n\n#### 实例详细信息\n\n虚拟机名称 *\ndemo-sonar\n\
  区域 *\n(欧洲) 西欧\n可用性选项\n不需要基础设施冗余\n安全类型\n标准\n镜像 *\nSonarQube packaged by Bitnami -\
  \ Gen1\n查看所有镜像 | 配置 VM 代\n\n审阅 + 创建\n< 上一步\n下一步：磁盘 >\n\n图 12.3 – SonarQube Azure\
  \ 创建\n\n我们还可以在 **磁盘** 和 **网络** 选项卡中更改一些可选 VM 选项。然后，通过单击 **审阅 + 创建** 按钮验证这些更改。\n\n\
  资源创建结束时，我们可以在 Azure 门户中查看部署状态，在此示例中部署成功：\n\n### 您的部署已完成\n\n部署名称：CreateVm-bitnami.sonarqube-6-4-2019072815...\
