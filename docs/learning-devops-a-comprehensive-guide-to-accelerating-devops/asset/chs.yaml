  | demo-sonar-vnet | Microsoft.Network/virtu... | OK | 操作详细信息 |\n| demo-sonar-nsg\
  \ | Microsoft.Network/netw... | OK | 操作详细信息 |\n| demo-sonar-ip | Microsoft.Network/publi...\
  \ | OK | 操作详细信息 |\n\n图 12.4 – SonarQube Azure 部署\n\n#### 4. 要访问已安装的 SonarQube 服务器，请查看\
  \ VM 的详细信息并获取公共 IP 地址值，如以下截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_406_0.png)\n\
  \n图 12.5 – SonarQube Azure 互联网协议 (IP) 地址\n\n打开 Web 浏览器，将此 IP 地址作为 **统一资源定位符 (URL)**。将显示\
  \ SonarQube 身份验证页面，如以下截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_407_0.png)\n\
  \n图 12.6 – SonarQube 登录屏幕\n\n默认登录名为 admin，可通过 VM 启动诊断信息访问，如文档 (https://docs.bitnami.com/azure/faq/get-started/find-credentials/)\
  \ 中所示。以下截图显示如何通过 **启动诊断** 选项执行密码恢复：\n\n![](img/d3344b39c888aab0b832625465f837c9_407_1.png)\n\
  \n图 12.7 – SonarQube Azure 密码恢复\n\n身份验证后，我们可以访问 SonarQube 仪表板，如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_408_0.png)\n\
  \n图 12.8 – SonarQube 主页\n\n我们已了解在 VM 中安装 SonarQube 的步骤，现在将学习如何在 Kubernetes 上安装 SonarQube。\n\
  \n### 在 Kubernetes 上安装 SonarQube\n\n要在 Kubernetes 集群上安装 SonarQube，我们将使用此处提供的 helm-chart\
  \ 包：https://github.com/SonarSource/helm-chart-sonarqube/tree/master/charts/sonarqube。\n\
  \n在 Kubernetes 上安装 SonarQube 之前，重要的是阅读此处的要求：https://docs.sonarqube.org/latest/setup/sonarqube-on-kubernetes/。\n\
  \n要在 Kubernetes 上安装 SonarQube，请运行以下脚本：\n\n```bash\nhelm repo add sonarqube https://SonarSource.github.io/helm-chart-sonarqube\n\
  helm repo update\nkubectl create namespace sonarqube\nhelm upgrade --install -n\
  \ sonarqube sonarqube/sonarqube\n```\n\n脚本的第一行将 SonarQube Helm 注册表添加到本地。\n\n第二行更新此注册表的索引。\n\
  \n然后，脚本创建 sonarqube 命名空间。\n\n最后，最后一行安装 sonarqube Helm 图表。\n\n执行此脚本结束时，Helm 图表执行会在控制台上显示用于使用已安装\
  \ SonarQube 实例的脚本，如以下截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_409_0.png)\n\
  \n图 12.9 – 使用 Helm 在 Kubernetes 上安装 SonarQube\n\n> 注意\n> 执行此脚本之前，请通过执行以下命令检查所有 pod\
  \ 是否正在运行：\n> kubectl get pods -n sonarqube\n\n在本节中，我们了解了 SonarQube 的架构，以及客户端和服务器组件的详细信息。然后，我们了解了可用的不同安装方法和\
  \ SonarQube 的配置。在下一节中，我们将了解开发人员如何在提交代码之前使用 SonarLint 进行实时代码分析。\n\n### 使用 SonarLint\
  \ 进行实时分析\n\n在 CI 环境中使用 SonarQube 的开发人员经常面临不得等待太长时间才能获得 SonarQube 分析结果的问题。他们必须提交代码并等待\
  \ CI 管道结束，才能获得代码分析结果。\n\n为了解决这个问题，从而改善开发人员的日常工作，SonarQube 的开发商 SonarSource 提供了另一个工具\
  \ SonarLint，它允许进行实时代码分析。\n\nSonarLint 是一个免费开源工具 (https://www.sonarlint.org/)，下载方式因开发工具和开发语言而异。SonarLint\
  \ 可用于 Eclipse、IntelliJ IDEA、Visual Studio 和 Visual Studio Code (VS Code) 集成开发环境\
  \ (IDE)。\n\n\n\n\n\n在这本书中，我们将查看在 VS Code IDE 中使用 TypeScript 编写的应用程序上使用 SonarLint\
  \ 的示例。使用 SonarLint 的前提是在本地开发计算机上安装 JRE。可以从 https://www.oracle.com/technetwork/java/javase/downloads/jre8-downloads-2133155.html\
  \ 下载。\n\n要了解有关 SonarLint 具体用法的更多信息，请执行以下步骤：\n\n1. 在 VS Code 中，通过转到 Azure 市场上的以下页面安装\
  \ SonarLint 扩展：\n\n![](img/d3344b39c888aab0b832625465f837c9_410_0.png)\n\n图 12.10\
  \ – SonarLint VS Code 扩展\n\n2. 然后，在 VS Code 中，在 **User** 设置中，使用 JRE 的安装路径配置扩展，如下所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_410_1.png)\n\n图 12.11 – SonarLint VS\
  \ Code 扩展配置\n\n3. 在我们的项目中，创建一个 tsApp 文件夹。在该文件夹内，创建一个包含应用程序代码的 app.ts 文件。源代码可在此处查看：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP12/tsApp/app.ts。\n\
  \n4. 请注意，在此 SonarLint 示例代码中，它指出代码不正确，如以下屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_411_0.png)\n\
  \n图 12.12 – SonarLint 示例检查代码\n\nSonarLint 允许我们通过显示有关错误及其修复方法的详细信息来了解更多有关此错误的信息，如以下屏幕截图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_411_1.png)\n\n图 12.13 – SonarLint 示例检查代码错误详情\n\
  \n因此，SonarLint 及其与各种 IDE 的集成允许我们尽可能实时检测静态代码错误——即在开发人员编写代码并在将其提交到源代码控制版本之前。\n\n在本节中，我们学习了如何在\
  \ VS Code 中安装 SonarLint 以及如何使用它执行实时代码分析。\n\n在下一节中，我们将讨论如何将 SonarQube 分析集成到 Azure\
  \ Pipelines 中的 CI 进程。\n\n### 在 CI 进程中执行 SonarQube\n\n迄今为止，在本章中，我们了解了如何安装 SonarQube\
  \ 以及开发人员如何在本地计算机上使用 SonarLint。\n\n现在，我们将了解如何在 CI 过程中执行代码分析，以确保每次进行代码提交时，我们都可以检查所有团队成员提供的应用程序代码。\n\
  \n为了将 SonarQube 集成到 CI 进程中，我们需要执行以下操作：\n\n1. 通过创建新项目配置 SonarQube。\n2. 在 Azure Pipelines\
  \ 中创建和配置 CI 构建。\n\n让我们先来看看在 SonarQube 中创建新项目。\n\n### 配置 SonarQube\n\nSonarQube 的配置包括创建新项目和检索识别令牌。要创建新项目，请执行以下步骤：\n\
  \n1. 单击仪表板上的 **Create new project** 链接。\n2. 然后，在表单中输入唯一的 `demobook` 键和名为 `demo-book`\
  \ 的项目名称。\n3. 要验证此操作，请单击 **Set Up** 按钮创建项目。步骤如以下屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_412_0.png)\n\
  \n图 12.14 – SonarQube 项目创建\n\n项目创建后，SonarQube 助手建议我们创建一个令牌（唯一密钥），该令牌将用于分析。\n\n要生成和创建此令牌，请执行以下步骤：\n\
  \n1. 在输入框中，键入所需的令牌名称。\n2. 然后，通过单击 **Generate** 按钮对其进行验证。\n3. 唯一密钥随后显示在屏幕上。此密钥即为我们的令牌，我们必须妥善保管。以下屏幕截图显示了生成令牌的步骤：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_413_0.png)\n\n图 12.15 – SonarQube 令牌生成\n\
  \n使用新项目配置 SonarQube 已完成。现在，我们将配置 CI 管道以执行 SonarQube 分析。\n\n### 在 Azure Pipelines\
  \ 中为 SonarQube 创建 CI 管道\n\n为了说明将 SonarQube 分析集成到 CI 管道中，我们将使用 Azure Pipelines，我们在第\
  \ 7 章“持续集成和持续交付”中详细介绍过它。\n\n本节中将用作示例的应用程序是使用 Node.js 开发的，它是一个简单的计算器，包含一些方法，包括单元测试方法。\n\
  \n> 注意\n> 请注意，本节的目的不是讨论应用程序代码，而是管道。您可以在 https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP12/AppDemo\
  \ 访问应用程序源代码。\n\n要在 Azure Pipelines 中使用 SonarQube，我们必须从 Visual Studio 市场（位于 https://marketplace.visualstudio.com/items?itemName=SonarSource.sonarqube）在我们的\
  \ Azure DevOps 组织中安装 SonarQube 扩展，如本章技术要求部分所述。\n\n以下屏幕截图显示了从 Visual Studio 市场安装扩展的标题和按钮：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_414_0.png)\n\n图 12.16 – SonarQube Azure\
  \ DevOps 扩展\n\n安装扩展后，我们可以配置 CI 构建。\n\n在 Azure Pipelines 中，我们将创建一个带有以下配置的新生成定义：\n\
  \n1. 在 **Get Sources** 选项卡中，选择包含应用程序源代码的存储库和分支，如以下屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_414_1.png)\n\
  \n图 12.17 – Azure DevOps 选定的存储库\n\n2. 然后，在 **Tasks** 选项卡中，配置任务的计划，如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_415_0.png)\n\
  \n图 12.18 – Azure Pipelines SonarQube：准备分析\n\n以下是这些任务配置的详细信息：\n\n1. **Prepare analysis\
  \ on SonarQube** 任务包括使用以下内容配置 SonarQube：\n\n   - 一个端点服务，即与我们之前在 SonarQube 配置中生成的\
  \ URL 和令牌的 SonarQube 连接\n   - SonarQube 项目的键和名称\n   - 分析的版本号\n\n2. 然后，我们使用 `npm\
  \ build` 和 `npm test` 构建并执行应用程序的单元测试。\n\n3. **Run Code Analysis** 任务检索测试结果，分析我们应用程序的\
  \ TypeScript 代码，并将分析数据发送到 SonarQube 服务器。\n\n然后，我们保存，开始执行 CI 构建，并等待其完成。\n\n### SonarQube\
  \ 仪表板已使用代码分析进行更新，如以下屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_416_0.png)\n\
  \n图 12.19 – SonarQube 仪表板分析\n\n在此，我们可以看到错误数量、代码可维护性以及代码覆盖率的度量。单击这些数据中的每一项，我们可以访问元素的详细信息。\n\
  \n在本节中，我们了解了如何将 SonarQube 分析集成到 CI 管道中，该管道将提供仪表板，以及每次代码提交的代码分析结果和报告。\n\n### 总结\n\
  \n在本章中，我们了解了如何使用 SonarQube 分析应用程序的静态代码。此分析可以检测和防止代码语法问题和代码中的漏洞，还可以指示单元测试提供的代码覆盖率。\n\
  \n然后，我们详细讨论了 SonarLint 的使用，它允许开发人员在编写代码时实时检查代码。\n\n最后，我们了解了 SonarQube 的配置及其集成到 CI\
  \ 进程中，以确保在团队成员的每次代码提交时都会触发持续分析。\n\n在下一章中，我们将通过使用 **Zed Attack Proxy (ZAP)** 工具执行安全测试、使用\
  \ Postman 执行性能测试以及使用 Azure DevOps 启动负载测试来探讨一些安全实践。\n\n### 问题\n\n1. SonarQube 是用哪种语言开发的？\n\
  2. 安装 SonarQube 的要求是什么？\n3. SonarQube 的作用是什么？\n4. 允许开发人员进行实时分析的工具名称是什么？\n\n### 进一步阅读\n\
  \n如果您想了解更多有关 SonarQube 的信息，以下是一个可以帮助您的资源：\n\n- • SonarQube 文档：`https://docs.sonarqube.org/latest/`\n\
  \n\n\n\n"
- '## 13 安全与性能测试


  在第 11 章《使用 Postman 测试 API》和第 12 章《使用 SonarQube 进行静态代码分析》中，我们分别介绍了使用 Postman 进行 API
  测试以及使用 SonarQube 进行静态代码分析的测试自动化。


  在本章中，我们将讨论如何基于 OWASP 建议，使用 ZAP 工具对 Web 应用程序进行安全和渗透测试。随后，我们将进一步提升 Postman 技能，以便能够对
  API 进行性能测试。


  本章将涵盖以下主题：


  - 使用 ZAP 进行 Web 安全和渗透测试

  - 使用 Postman 运行性能测试


  ### 技术要求


  要使用 ZAP，我们需要安装 **Java 运行时环境 (JRE)**，可从 https://www.oracle.com/technetwork/java/javase/downloads/jre8-downloads-2133155.html
  获取（需要 Oracle 账户）。


  在本章中，我们将讨论 Postman，我们在 _第 11 章《使用 Postman 测试 API》_ 中已介绍过它。


  请查看以下视频，观看代码实际运行情况：https://bit.ly/3HbOgD0。


  ### 使用 ZAP 进行 Web 安全和渗透测试


  如今，应用程序安全必须成为企业关注的核心。只要 Web 应用程序（或网站）在互联网上公开暴露，就可能成为恶意人员攻击的目标。此外，需要注意的是，如果应用程序用于存储银行账户或个人信息等敏感数据，应用程序安全就更加重要。


  为了解决这个问题，存在 **开放 Web 应用程序安全项目 (OWASP)** (https://www.owasp.org/index.php/Main_Page)，这是一个研究应用程序安全问题的全球性组织。该组织的目标是公开突出应用程序系统中可能遇到的安全问题和漏洞。除了这些宝贵的安全信息外，OWASP
  还为测试和保护应用程序提供建议、解决方案和工具。


  OWASP 提供的一个重要且有用的项目和文档是前 10 大应用程序安全问题。该文档可在 https://owasp.org/www-project-top-ten/
  获取。该文档非常详细，为每个安全问题提供了解释、示例和解决方案。在该文档中，我们可以看到，应用程序最容易受到的首要安全漏洞是注入漏洞，例如 SQL 注入，它涉及向应用程序注入代码或请求，以从应用程序中收集、删除或损坏数据。


  在撰写本文时，前 10 大 OWASP 缓解技术如下：


  1. 持续风险评估

  2. 使用自动化和手动手段进行评估

  3. 选择强大的 **Web 应用程序防火墙 (WAF)**

  4. 确保 Web 开发框架和编码实践具有内置安全性

  5. 强制实施 **多因素身份验证 (MFA)**

  6. 加密所有数据

  7. 立即应用所有软件更新

  8. 确保 Web 应用程序已进行清理

  9. 开展正式的意识提升活动

  10. 遵守 OWASP 合规性标准


  有关这些缓解技术的更多详细信息，请阅读以下文章：`https://www.indusface.com/blog/owasp-top-10-mitigation-techniques/`。


  我们在该文档中还了解到另一个已知安全缺陷，即 **跨站点脚本 (XSS)**。它涉及在用户的 Web 浏览器上执行 HTML 或恶意 JavaScript 代码。


  企业面临的挑战是能够自动化其应用程序的安全测试，以保护它们，并在发现缺陷时尽快采取措施。


  有许多安全和渗透测试工具可用。一个非常完整的列表可在 `https://www.owasp.org/index.php/Appendix_A:_Testing_Tools`
  获取。其中，我们在上一章中了解了 SonarQube，它允许您分析代码以检测安全漏洞。


  该列表中另一个非常有趣的工具是 **Zed Attack Proxy (ZAP)** (`https://www.owasp.org/index.php/OWASP_Zed_Attack_Proxy_Project`)，它由
  OWASP 社区开发。


  让我们学习如何使用 ZAP 对我们的应用程序进行安全测试。


  ### 使用 ZAP 进行安全测试


  ZAP 是一个免费开源的图形化工具，允许您扫描网站并执行大量安全和渗透测试。


  与 SonarQube 不同，SonarQube 也在应用程序的源代码中执行安全分析但不执行它，而 ZAP 运行应用程序并执行安全测试。


  运行时，ZAP 将在用户和应用程序之间充当代理，扫描应用程序的所有 URL，然后对这些不同的 URL 执行一系列渗透测试。它目前是应用程序测试中最广泛使用的工具之一，因为除了免费之外，它还提供许多非常有趣的功能，例如能够配置
  Ajax 渗透测试，以及高级测试配置。此外，它与许多 CI/CD 流水线平台集成良好。最后，可以使用 REST API 控制它。相应的文档可在 `https://www.zaproxy.org/docs/api/`
  获取。


  我建议在一个带有安全漏洞的公共演示网站上使用 ZAP 进行一个小型实验室。正如我们在 _技术要求_ 部分中提到的，使用 ZAP 的一个先决条件是在将执行测试的机器上安装
  Java。它可以是本地机器或构建代理。


  我们可以在 `https://www.zaproxy.org/download/` 下载 ZAP；下载与您的操作系统对应的软件包。


  然后，按照操作系统的软件安装程序安装 ZAP。安装完成后，我们可以打开 ZAP 并访问其界面。


  以下截图显示了默认的 ZAP 界面：


  ![](img/d3344b39c888aab0b832625465f837c9_422_0.png)


  图 13.1 – OWASP ZAP 工具


  我们将按照以下步骤使用 ZAP 进行第一次安全分析：


  1. 在右侧面板中，单击 **自动扫描** 按钮，这将打开一个表单，我们可以在其中输入要扫描的 URL。

  2. 在 **要攻击的 URL** 字段中，输入要分析的网站的 URL。在我们的示例中，我们将输入演示站点的 URL：`http://demo.guru99.com/Security/SEC_V1/`。

  3. 然后，要开始分析，请单击 **攻击** 按钮。


  以下截图直观地显示了上述步骤：


  ![](img/d3344b39c888aab0b832625465f837c9_423_0.png)


  图 13.2 – OWASP ZAP – 自动扫描


  我们必须等待此网站的安全测试分析完成。


  4. 分析完成后，我们可以在左下角的面板中看到遇到了哪些安全问题。

  5. 最后，单击其中一个警报将显示问题的详细信息，并帮助我们解决它。


  以下截图显示了我们刚刚提到的分析结果：


  ![](img/d3344b39c888aab0b832625465f837c9_424_0.png)


  图 13.3 – OWASP ZAP 扫描结果


  至此，我们学习了如何使用 ZAP，这是一个图形化工具，可用于非常快速地分析网站的安全漏洞。


  现在，让我们来看看自动执行 ZAP 的不同方式。


  ### 自动执行 ZAP 的方式


  我们还可以通过将 ZAP 安装在 CI/CD 流水线的代理服务器上并使用 zap-cli 工具来自动化此 ZAP 分析，该工具可在 `https://github.com/Grunny/zap-cli`
  获取。它用于命令行并调用 ZAP API。


  以下截图显示了在命令行中使用 zap-cli 分析我们的演示网站：


  ![](img/d3344b39c888aab0b832625465f837c9_424_1.png)


  图 13.4 – zap-cli 扫描命令行


  在上述执行中，使用了两个命令：


  - 第一个，`zap-cli active-scan`，分析作为命令参数传递的网站。

  - 第二个，`zap-cli report`，以 HTML 格式生成扫描结果的报告。


  > 注意

  >

  > 在上述命令中，我们使用了 `--api-key` 参数。要检索您的 API 密钥值，请在 ZAP 工具实例中转到 **工具 | 选项 | API** 菜单。


  如果我们使用 Azure DevOps 作为 CI/CD 流水线平台，可以使用 Visual Studio Marketplace 上的 OWASP Zed Attack
  Proxy Scan 任务，该任务可在 `https://marketplace.visualstudio.com/items?itemName=kasunkodagoda.owasp-zap-scan`
  获取。如果我们有 Azure 订阅，Azure Pipelines 还可以在 Docker 容器中运行 ZAP，该容器托管在 Azure 容器实例中，如 `https://devblogs.microsoft.com/premier-developer/azure-devops-pipelines-leveraging-owasp-zap-in-the-release-pipeline/`
  中详细说明。


  如果我们使用 Jenkins 作为构建工厂，请查看以下文章，它解释了如何在运行作业时集成和使用 ZAP 插件：`https://www.breachlock.com/integrating-owasp-zap-in-devsecops-pipeline/`。


  我们刚刚学习了如何使用由 OWASP 社区开发的 ZAP 对我们的 Web 应用程序进行安全测试。我们了解了通过其图形界面的基本用法，并对演示应用程序进行了安全测试。然后，我们看到也可以使用
  `zap-cli` 自动化其执行，以便我们可以将其集成到 DevOps CI/CD 流水线中。


  现在，让我们学习如何使用 Postman 进行性能测试。


  ### 使用 Postman 运行性能测试


  在为保证应用程序质量并确保其功能正常（包括代码分析和安全测试）而需要进行的测试中，还有性能测试。性能测试的目的不是检测应用程序中的错误，而是确保应用程序（或 API）在可接受的时间范围内响应，以提供良好的用户体验。






  ### 应用程序的性能由以下指标决定：


  - 响应时间

  - 其使用的资源（CPU、RAM 和网络）

  - 错误率

  - 每秒请求数


  性能测试分为多种测试类型，例如负载测试、压力测试和可扩展性测试。


  有许多工具可用于执行性能测试。以下文章列出了 15 个最佳工具：https://www.softwaretestinghelp.com/performance-testing-tools-load-testing-tools/。在本书中我们已经见过的工具中，Postman
  并非专门用于性能测试的工具，尤其是因为它主要关注 API 而不是单体 Web 应用程序。但是，Postman 可以很好地指示我们 API 的性能。


  我们在第 11 章《使用 Postman 测试 API》中详细讨论了其用法。当您执行以单元方式测试 API 的请求时，Postman 会提供该 API 的执行时间，如下图所示：


  ![](img/d3344b39c888aab0b832625465f837c9_426_0.png)


  图 13.5 – Postman 性能测试


  此外，在 Postman 的 **集合运行器** 中，可以执行集合中的所有请求并指定迭代次数；也就是说，运行器将执行循环测试的次数。这模拟了多个调用 API 的连接，这也是
  Postman 呈现的执行时间变得非常有趣的地方。


  下图显示了 Postman **运行器** 的配置，输入参数中有多个迭代：


  ![](img/d3344b39c888aab0b832625465f837c9_427_0.png)


  图 13.6 – Postman 运行器配置测试


  下图显示了运行器的结果：


  ![](img/d3344b39c888aab0b832625465f837c9_428_0.png)


  在这里，我们可以看到运行器显示每个请求的执行时间，这意味着我们可以识别 API 上的过载问题。


  现在我们已经学习了如何使用 Postman 执行性能测试，让我们总结本章。


  ### 总结


  在本章中，我们了解了如何使用 ZAP，这是由 OWASP 社区开发的用于自动执行 Web 应用程序安全测试的工具。我们还了解了 Postman 如何提供 API
  性能信息。


  在下一章中，我们将继续讨论安全和 DevSecOps，学习如何使用 Inspec 自动化基础设施测试，如何使用 HashiCorp 的 Vault 保护机密，以及使用
  Azure 安全开发工具包检查 Azure 基础设施的安全合规性。


  ### 问题


  回答以下问题以测试您对本章的了解：


  1. ZAP 是分析应用程序源代码的工具吗？


  2. 在 Postman 中，什么指标允许我们获取性能信息？


  ### 延伸阅读


  要了解本章涵盖的更多内容，请查看以下资源：


  - 学习渗透测试：https://www.packtpub.com/networking-and-servers/learn-penetration-testing


  - 关于 OWASP 和 ZAP 的 Pluralsight 视频：https://www.pluralsight.com/search?q=owasp

