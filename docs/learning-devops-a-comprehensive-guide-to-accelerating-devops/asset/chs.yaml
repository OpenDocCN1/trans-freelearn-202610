  \n图 7.47 – Azure Pipelines：部署状态\n\n在此屏幕截图中，我们看到集成环境中的部署已成功完成。\n\n通过遵循本实验中的步骤，我们已在\
  \ **用户界面** (UI) 模式（称为经典模式）下创建了 CI 和 CD 管道。现在，我们将学习如何使用 YAML 文件以代码模式创建管道。\n\n###\
  \ 在 YAML 文件中创建完整的管道定义\n\n在前面的部分中，我们讨论了在 Azure DevOps 中使用 UI 创建 CI 和 CD 管道，这有一些优势，但其不便之处之一是为大量项目自动化创建管道的困难。\n\
  \n为了解决这个问题，Azure DevOps 提供了将完整的管道定义（CI 和 CD）编写在保存在存储库中的 YAML 文件中的可能性。\n\n### 230\
  \ 持续集成和持续交付\n\n> 注意\n> 本节的目的是演示仅包含 CI 步骤的 Azure DevOps 管道 YAML 的概览。这不是一个高级实验，如果您想了解更多信息，请阅读此处的文档：https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema。\n\
  \n在以下实验中，我们将学习如何在 YAML 文件中创建基本管道定义。具体操作如下：\n\n1. 在 Azure Repos 中，在先前创建的 DemoBook\
  \ 存储库内，添加一个名为 azure-pipeline.yml 的新文件，内容如下：\n\n```yaml\ntrigger:\n- master\npool:\n\
  vmImage: ubuntu-latest\nsteps:\n- task: DotNetCoreCLI@2\ndisplayName: \"Restore\"\
  \ninputs:\ncommand: restore\nprojects: '**/*.csproj'\n- task: DotNetCoreCLI@2\n\
  displayName: \"build\"\ninputs:\ncommand: 'build'\nprojects: '**/*.csproj'\narguments:\
  \ '--configuration Release'\n- task: DotNetCoreCLI@2\ndisplayName: \"Run tests\"\
  \ninputs:\ncommand: 'test'\nprojects: '**/tests/*.csproj'\narguments: '--configuration\
  \ Release'\n- task: DotNetCoreCLI@2\ndisplayName: \"Code coverage\"\ninputs:\ncommand:\
  \ test\nprojects: '**/*/Tests/*.csproj'\narguments: '--configuration Release --collect\
  \ \"Code coverage\"'\n```\n\n在此文件中，我们有三个部分：`trigger`、`pool` 和 `steps`。在 `trigger`\
  \ 部分，我们指定触发管道的代码分支，因此，`master` 分支上的任何提交都将执行管道。\n\n然后，`pool` 部分指示用于执行管道的代理池。最后，在\
  \ `steps` 部分，我们编写管道执行期间将运行的所有任务。在此实验中，我们声明了四个任务，如下所示：\n\n- 项目的 NuGet 包还原\n- 项目的编译\n\
  - 测试的执行\n- 已执行测试的代码覆盖率发布\n\n2. 我们将此文件提交并推送到存储库的根目录，如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_255_0.png)\n\
  \n图 7.48 – Azure Pipelines：YAML 管道\n\n### 3. 在 Azure Pipelines 中，打开 **Pipeline**\
  \ 菜单并单击 **Create pipeline** 按钮，如下面的屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_256_0.png)\n\
  \n图 7.49 – Azure Pipelines：创建新的 YAML 管道\n\n### 4. 选择代码源（此处，我们选择 **Azure Repos Git**）并选择包含管道\
  \ YAML 文件的存储库，如下面的屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_256_1.png)\n\
  \n图 7.50 – Azure Pipelines：选择存储库\n\n5. 然后，通过选择使用现有 YAML 文件的选项来配置 Azure 管道，如下面的屏幕截图所示：\n\
