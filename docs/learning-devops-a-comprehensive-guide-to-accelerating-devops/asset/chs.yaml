  ### 使用 WhiteSource Bolt 检测安全漏洞


  由于公开可见性，开源项目或组件高度暴露于安全漏洞，因为更容易无意中将包含安全漏洞的组件（包或其依赖项之一）注入其中。


  除了静态源代码分析之外，持续检查开源项目中引用或使用的包的安全性也非常重要。


  有许多可用的工具，我们可以用来分析应用程序中引用的包的安全性，例如 SonaType AppScan (https://www.sonatype.com/appscan)、Snyk
  (https://snyk.io/) 和 WhiteSource Bolt (https://bolt.whitesourcesoftware.com/)。


