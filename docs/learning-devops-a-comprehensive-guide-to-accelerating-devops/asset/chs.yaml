- '# 第 5 部分：进阶 DevOps/更多 DevOps 内容


  本部分介绍与 DevOps 流程中安全集成（DevSecOps）相关的高级主题、一些关于蓝绿部署的技术，以及如何在开源项目中应用 DevOps。


  本部分包含以下章节：


  - 第 14 章，DevOps 流程中的 DevSecOps 安全

  - 第 15 章，减少部署停机时间

  - 第 16 章，开源项目的 DevOps

  - 第 17 章，DevOps 最佳实践

  '
- "## 14 DevOps 流程中的 DevSecOps 安全\n\n到目前为止，在本书中，我们详细讨论了 **开发运维（DevOps）** 文化以及将促进开发人员和运维人员（**信息技术运维**，或\
  \ **ITOps**）之间沟通与协作的 DevOps 工具。\n\n然而，在这种结合中，我们注意到一个非常重要的方面往往缺失，那就是安全。确实，**持续集成/持续部署（CI/CD）**\
  \ 管道和 **基础设施即代码（IaC）** 允许更快地部署基础设施和应用程序，但问题是，为了更快地部署，我们没有包含安全团队，这导致以下情况：\n\n- 安全团队阻塞或减慢部署，从而导致更长的部署周期。\n\
  \n- 安全问题在基础设施和应用程序中被非常晚地发现。\n\n这就是为什么，一段时间以来，安全已被纳入 DevOps 文化，成为更广泛的 **开发安全运维（DevSecOps）**\
  \ 文化。安全无所不在。由于我们以快速的速度开发，将安全作为过程的一部分而不是在过程之外是非常合理的。\n\n因此，DevSecOps 文化或方法是开发人员和运维人员的结合，并尽早将安全集成到项目的实现和设计中。DevSecOps\
  \ 方法也是 CI/CD 管道中合规性和安全验证流程的自动化，以保证持续安全且不减慢应用程序部署周期。\n\n今天，DevOps 文化必须绝对集成安全团队，也要集成所有安全流程，无论是在工具、基础设施还是应用程序上。这是为了不仅提供更好的质量，而且提供更安全的应用程序。\n\
  \n在本章中，我们将重点介绍 DevSecOps 方法。首先，我们将了解如何使用 Chef 的 InSpec 测试 Azure 基础设施的合规性。然后，我们将学习如何使用\
  \ HashiCorp 的 Vault 保护所有基础设施和应用程序机密。\n\n本章将涵盖以下主题：\n\n- 使用 Chef InSpec 测试 Azure\
  \ 基础设施合规性\n- 使用 HashiCorp Vault 保护敏感数据\n\n### 技术要求\n\n在本章中，我们将了解 InSpec 的使用，它要求本地计算机上安装了\
  \ **Ruby** 2.4 或更高版本。要根据您特定的 **操作系统**（OS）安装 Ruby，请阅读此文档：`https://www.ruby-lang.org/en/documentation/installation/`。\n\
  \n在《使用 HashiCorp Vault 保护敏感数据》部分中，我们将讨论 Vault 与 Terraform 的集成，而不深入探讨 Terraform 的细节，因此我建议您先阅读《第\
  \ 2 章，使用 Terraform 配置云基础设施》。\n\n本章的完整源代码可在此处查看：\n\n`https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP14`\n\
  \n查看以下视频以观看代码实际运行情况：\n\n`https://bit.ly/3In9kb2`\n\n### 使用 Chef InSpec 测试 Azure\
  \ 基础设施合规性\n\nDevOps 文化的重要实践之一是 IaC，详细介绍于《第 1 章，DevOps 文化与基础设施即代码实践》，它包括对基础设施配置进行编码，然后通过\
  \ CI/CD 管道自动部署。IaC 允许非常快速地部署和配置云基础设施，但经常出现的问题是：_自动配置的基础设施是否符合功能合规性和安全要求？_\n\n要回答这个问题，我们将不得不编写和自动化基础设施测试，这些测试将验证以下内容：\n\
  \n- 部署的基础设施与应用程序和企业架构规范相符。\n- 公司的安全策略已正确应用于基础设施。\n\n这些测试可以用任何可以与我们的云提供商交互的脚本语言编写，如果我们有\
  \ Azure 订阅，可以使用 Azure **命令行界面（CLI）** 或 Azure PowerShell 命令来编码我们 Azure 资源的测试。此外，如果我们使用\
  \ PowerShell，可以使用 **Pester** (`https://pester.dev/docs/quick-start/#what-is-pester`)，这是一个允许我们执行\
  \ PowerShell 测试的库，结合 Azure PowerShell，允许我们执行基础设施合规性测试。\n\n> **注意**\n> 要了解如何使用 Pester\
  \ 测试 Azure 基础设施的示例，我建议您阅读此文章：`https://dzone.com/articles/azure-security-audits-with-pester`。此外，请查看此博客文章：`https://dev.to/omiosec/unit-testing-in-powershell-introduction-to-pester-1de7`。\n\
  \n这些脚本工具的问题是它们需要编写大量代码。此外，这些工具专用于特定的云提供商，并且需要学习一种新的脚本语言。\n\nIaC 工具之一是 **InSpec**\
  \ (`https://www.inspec.io/`)，它执行基础设施合规性测试。\n\n在本节中，我们将详细了解使用 InSpec 测试 Azure 基础设施合规性，并为了开始其实现，我将为您提供\
  \ InSpec 的概述。\n\n\n\n\n\n### InSpec 概述\n\nInSpec 是一个用 Ruby 编写的开源工具，可在命令行上运行，由领先的\
  \ DevOps 工具之一 **Chef** 生产，其网站为 `https://www.chef.io/`。它允许用户编写声明式代码来测试系统或基础架构的合规性。\n\
  \n要使用 InSpec，无需学习新的脚本语言；我们应当已经具备足够的知识来编写要测试的基础架构资源或系统的期望状态。\n\n使用 InSpec，我们可以测试远程机器和数据的合规性，并且自最新版本起，还可以测试云基础架构，例如\
  \ Azure、**Amazon Web Services (AWS)** 和 **Google Cloud Platform (GCP)**。\n\n对 InSpec\
  \ 做了简要概述后，让我们来看看如何下载和安装它。\n\n### 安装 InSpec\n\n我们在 _Technical requirements_ 部分中了解到，InSpec\
  \ 需要在我们的机器上安装 **Ruby (>2.4)**。\n\nInSpec 可以手动安装，也可以通过脚本安装，具体如下：\n\n- **手动**：可以从\
  \ `https://www.chef.io/downloads/tools/inspec` 下载与我们操作系统对应的软件包。\n- **使用脚本**：我们可以在终端中执行下面详细说明的命令来安装\
  \ InSpec。\n\n在 Windows 上，我们可以使用 Chocolatey 软件包下载并安装 InSpec，软件包地址为 `https://community.chocolatey.org/packages/inspec`，使用以下命令：\n\
  \n```\nchoco install inspec -y\n```\n\n在 Linux 上，使用以下脚本：\n\n```\ncurl https://omnitruck.chef.io/install.sh\
  \ | sudo bash -s -- -P inspec\n```\n\n以下截图显示了通过 **Chocolatey 软件包** 安装 InSpec 的过程：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_437_0.png)\n\n### 图 14.1 – Windows 上的\
  \ InSpec 安装\n\n#### 注意\n\n有关所有操作系统上安装 InSpec 的更多信息，请参阅此文档：`https://docs.chef.io/inspec/install/`。\n\
  \n要验证 InSpec 是否已正确安装并正常工作，我们运行 `inspec --version` 命令来显示其版本，并运行 `inspec` 命令来显示可用命令列表。\n\
  \n以下截图显示了这些命令的执行情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_437_1.png)\n\n###\
  \ 图 14.2 – 检查 InSpec 版本并显示 InSpec 选项\n\n此外，与本书中已详细介绍的许多工具一样，InSpec 已集成到 **Azure\
  \ Cloud Shell** 工具套件中，如以下截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_438_0.png)\n\
  \n图 14.3 – Azure Cloud Shell 中的 InSpec\n\n我们刚刚了解了安装 InSpec 的不同方式，现在将了解为 InSpec 配置\
  \ Azure。\n\n### 为 InSpec 配置 Azure\n\n在编写测试用例来测试 Azure 基础架构的合规性之前，我们需要创建一个对将要测试的\
  \ Azure 资源具有读取权限的 Azure 服务主体。\n\n要创建此 Azure 服务主体，我们将使用在 _Chapter 2, Provisioning\
  \ Cloud Infrastructure with Terraform_ 的 _Configuring Terraform for Azure_ 部分中已详细介绍的相同过程。\n\
  \n使用 **Azure CLI** 工具，我们执行以下 `az cli` 命令：\n\n```\naz ad sp create-for-rbac -name=\"\
  <SP name>\" -role=\"Reader\" -scopes=\"/subscriptions/<subscription Id>\"\n```\n\
  \n此命令需要以下参数：\n\n- `-name` 是要创建的 Azure 服务主体的名称。\n- `--scopes` 是 Azure 资源所在的订阅（或其他范围）的\
  \ **标识符 (ID)**。\n- `--role` 是服务主体在指定资源范围内将拥有的角色名称。\n\n执行此命令将返回与创建的服务主体相关的以下三个身份验证信息：\n\
  \n- 客户端 ID\n- 客户端密钥\n- 租户 ID\n\n> 注意\n> 有关服务主体的更多详细信息，请参阅以下文档：\n> https://docs.microsoft.com/en-us/cli/azure/create-an-azure-service-principal-azure-cli?view=azure-cli-latest\n\
  \n我们将了解如何在运行 InSpec 时使用这些身份验证信息，但在执行之前，我们需要具备足够的知识来编写 InSpec 测试。让我们看看如何操作。\n\n###\
  \ 编写 InSpec 测试\n\n安装 InSpec 并为 Azure 配置身份验证后，我们可以开始使用 InSpec。为了展示 InSpec 测试的示例，我们将编写测试，用于检查我们使用\
  \ Terraform 在 _Chapter 2, Provisioning Cloud Infrastructure with Terraform_ 中预配的\
  \ Azure 基础架构是否符合我们 Azure 基础架构的规范，该基础架构必须由以下内容组成：\n\n- 一个名为 `bookRg` 的资源组\n- 一个包含名为\
  \ `book-subnet` 的子网的 **虚拟网络 (VNet)**\n- 一个名为 `bookvm` 的 **虚拟机 (VM)**\n\n作为编写 InSpec\
  \ 测试的第一步，我们将创建一个 InSpec 配置文件。\n\n### 创建 InSpec 配置文件\n\n要创建 InSpec 配置文件，我们将生成测试目录结构，然后修改生成的\
  \ InSpec 配置文件。\n\n要执行此操作，我们创建一个测试文件夹结构和一个定义一些元数据和 InSpec 配置的 InSpec 配置文件。要创建结构和\
  \ InSpec 配置文件，请在您的机器上转到所选目录并执行以下命令：\n\n```\ninspec init profile azuretets\n```\n\
  \n此命令通过创建一个名为 azuretets 的新文件夹来初始化新配置文件，该文件夹包含 InSpec 测试所需的所有工件，包括：\n\n- 控件（测试）\n\
  - 库\n- 一个配置文件，`inspec.yml`，包含一些默认元数据\n\n然后，我们使用一些个人元数据修改此 `inspec.yml` 配置文件，并从 InSpec-Azure\
  \ 资源包添加 **统一资源定位符 (URL)** 链接到示例代码，如下所示：\n\n```\nname: azuretets\ntitle: InSpec Profile\n\
  maintainer: Your name\ncopyright: Your name\ncopyright_email: you@example.com\n\
  license: All Rights Reserved\nsummary: An InSpec Compliance Profile\nversion: 0.1.0\n\
  inspec_version: '>= 4.6.9'\ndepends:\n- name: inspec-azure\nurl: https://github.com/inspec/inspec-azure.git\n\
  ```\n\n在此代码中，我们输入了一些个人信息，例如我们的姓名，以及有关此代码许可证类型的信息。然后，最后，在此文件的最后部分，我们指示了一个依赖项，并附上了\
  \ InSpec-Azure 资源库包的 URL。\n\n事实上，自 InSpec 2.2.7 版本起，我们可以使用一组使用 Azure API 的 InSpec\
  \ 库，从而允许我们访问所有 Azure 资源。基于此，InSpec 团队创建了一个 Azure 资源包，其中包含大量库，用于测试广泛的 Azure 资源，例如\
  \ Azure 用户、Azure Monitor、Azure 网络（VNet 和子网）、Azure SQL Server、Azure 虚拟机 (Azure VM)\
  \ 以及许多其他 Azure 资源。\n\n> 注意\n> 有关可用 Azure 资源的完整列表，请参阅 InSpec 文档中关于 InSpec Azure 资源包的内容：\n\
  > https://www.inspec.io/docs/reference/resources/#azure-resources\n\n在生成包含测试和配置文件更新的目录后，我们将编写基础架构合规性测试。\n\
  \n### 编写合规性 InSpec 测试\n\n为了回答我们的示例规范，我们将编写测试，用于验证我们预配的基础架构是否包含资源组、VM 和子网。\n\n我们将起草的所有测试都位于\
  \ controls 文件夹中，并以 Ruby 文件 (.rb) 编写，代码非常简单且易于人类阅读。\n\n首先，我们将编写一个检查资源组是否存在的测试，为此，我们将删除\
  \ controls 文件夹中的 example.rb 示例文件（这是测试模板中提供的测试示例），并创建一个名为 resourcegroup.rb 的新文件，其中包含以下代码内容：\n\
  \n```\ncontrol 'rg' do\n describe azure_resource_groups do #call the azurerm_resource_groups\
  \ of Azure Resource Pack\n its('names') { should include 'bookRg' } #test assert\n\
  \ end\nend\n```\n\n\n\n\n\n在这段声明式代码中，描述了资源的期望状态，并采取了以下操作：\n\n1. 创建一个名为 `test_rg`\
  \ 的控制（或测试）。\n2. 在此控制中，我们将创建一个 `describe` 类型的方法，在其中使用 Azure 资源包中的 `azure_resource_groups`\
  \ 库，该库允许我们测试资源组是否存在。\n3. 在此 `describe` 方法中，我们编写一个测试断言，用于检查 Azure 订阅中是否存在名为 `bookRg`\
  \ 的资源组。\n\n然后，我们将继续为 VM 和子网编写测试。为此，我们在 `controls` 目录中手动创建一个包含以下代码的 `subnet.rb` 文件：\n\
  \n```\ncontrol \"subnet\" do\n describe azure_subnet(resource_group: 'bookRg', vnet:\
  \ 'book-vnet', name: 'book-subnet') do\n it { should exist }\n its('address_prefix')\
  \ { should eq '10.0.10.0/24' }\n end\nend\n```\n\n在此代码中，我们使用 `azurerm_subnet` 库，该库允许我们测试\
  \ VNet 中子网是否存在。在此测试中，我们检查 `book-subnet` 子网是否存在于 `book-vnet` VNet 中，并且其 IP 范围为 `10.0.10.0/24`。\n\
  \n最后，在此，我们通过在 `vm.rb` 文件中使用以下代码来完成编写允许我们检查 VM 的测试：\n\n```\ncontrol 'vm' do\n describe\
  \ azure_virtual_machine(resource_group: 'bookRg', name: 'bookvmn') do\n it { should\
  \ exist }\n its('properties.location') { should eq 'westeurope' }\n its('properties.hardwareProfile.vmSize')\
  \ { should eq 'Standard_DS1_v2' }\n its('properties.storageProfile.osDisk.osType')\
  \ { should eq 'Linux' }\n end\nend\n```\n\n在此代码中，我们使用 `azurerm_virtual_machine`\
  \ 库并测试名为 `demovm` 的 VM 是否存在于 `bookRg` 资源组中。我们还检查其一些属性，例如区域、操作系统类型和 VM 大小。\n\n我们已完成编写将用于检查\
  \ Azure 基础设施合规性的 InSpec 测试，现在将看到使用我们刚刚编写的这些测试执行 InSpec 的过程。\n\n### 执行 InSpec\n\n\
  要执行 InSpec，我们将执行以下步骤：\n\n1. 我们将配置 InSpec 对 Azure 的身份验证；为此，我们将使用之前在“配置 Azure 以用于\
  \ InSpec”部分中创建的 Azure 服务主体信息的值创建环境变量。此处列出了四个环境变量及其值：\n   - `AZURE_CLIENT_ID` 与服务主体的客户端\
  \ ID\n   - `AZURE_CLIENT_SECRET` 与服务主体的客户端密钥\n   - `AZURE_TENANT_ID` 与租户 ID\n  \
  \ - `AZURE_SUBSCRIPTION_ID` 与包含资源且其服务主体具有读取者权限的订阅的 ID\n\n   以下是在 Linux 操作系统中创建这些变量的示例：\n\
  \   ```\n   export AZURE_SUBSCRIPTION_ID=\"<Subscription ID>\"\n   export AZURE_CLIENT_ID=\"\
  <Client Id>\"\n   export AZURE_CLIENT_SECRET=\"<Secret Client>\"\n   export AZURE_TENANT_ID=\"\
  <Tenant Id>\"\n   ```\n\n2. 然后，在终端中，我们将进入包含配置文件 `inspec.yml` 的目录，并运行 `inspec vendor\
  \ .` 命令以下载所有依赖项并在 `vendor` 目录中生成锁文件。\n\n3. 然后，执行以下 `inspec` 命令以检查测试的语法是否正确：\n  \
  \ ```\n   inspec check .\n   ```\n\n此命令提供的参数是包含 `inspec.yml` 文件的目录的路径。在此命令中，我们在参数中使用\
  \ `.`（点）来指示 `inspec.yml` 文件位于当前目录，以下截图显示了执行此命令的结果：\n\n![](img/d3344b39c888aab0b832625465f837c9_444_0.png)\n\
  \n图 14.4 – InSpec 检查配置文件\n\n4. 最后，我们使用 `inspec exec` 命令执行 InSpec 来运行测试，如下所示：\n\n\
  ```\ninspec exec . -t azure://\n```\n\n此命令以包含 `inspec.yml` 文件的目录的路径作为参数（此处为点）。我们还添加了\
  \ `-t` 选项，该选项将测试的目标（即 azure）作为值。\n\n以下截图显示了执行此命令的结果：\n\n![](img/d3344b39c888aab0b832625465f837c9_444_1.png)\n\
  \n图 14.5 – InSpec 执行测试\n\n从此结果可以看出，所有测试均为绿色，因此成功，基础设施的合规性非常成功。\n\n我们刚刚在本节中解释了如何编写\
  \ InSpec 测试并运行它们以验证 Azure 基础设施的合规性。\n\nInSpec 是一个非常强大的工具；它还允许您测试 VM 的配置。因此，我邀请您查看以下文档：https://www.inspec.io/docs/。\n\
  \n我们在此处了解了 InSpec 的安装，然后是 InSpec 测试的编写，最后是如何使用其命令行来测试 Azure 基础设施的合规性。在下一节中，我们将探讨使用\
  \ HashiCorp 的 Vault 密钥管理器保护敏感数据的另一个安全方面。\n\n### 使用 HashiCorp Vault 保护敏感数据\n\n当今，当我们谈论信息系统安全时，最受期待的话题是系统不同组件之间敏感数据的保护。需要保护的这种敏感数据包括服务器访问密码、数据库连接、**应用程序编程接口（API）身份验证令牌**以及应用程序用户帐户。确实，许多安全攻击之所以发生，是因为这种数据在应用程序的源代码或暴露于本地工作站的保护不佳的文件中被解密。许多已知工具可用于保护此类敏感数据，例如：\n\
  \n- KeyPass (`https://keepass.info/`)\n- LastPass (`https://www.lastpass.com/`)\n\
  - Ansible Vault，我们在 _第 3 章，使用 Ansible 配置 IaaS 基础设施_ 中讨论过其用法\n- HashiCorp 的 Vault\n\
  \n此外，云服务提供商还提供其自身的密钥保护服务，例如：\n\n- Azure Key Vault: `https://azure.microsoft.com/en-us/services/key-vault/`\n\
  - **密钥管理服务（KMS）**适用于 Google Cloud Platform: `https://cloud.google.com/kms/`\n- AWS\
  \ Secrets Manager 适用于 AWS: `https://aws.amazon.com/secrets-manager/?nc1=h_ls`\n\n\
  在我们提到的所有工具中，我们将探讨 HashiCorp 的 **Vault** 的使用，它是免费且开源的，可以安装在任何类型的操作系统上，也可以安装在 Kubernetes\
  \ 上。\n\nVault 的主要功能和优势如下：\n\n- 它允许存储静态密钥以及动态密钥。\n- 它还具有用于轮换和撤销密钥的系统。\n- 它允许在不存储数据的情况下对数据进行加密和解密。\n\
  - 它还具有允许管理密钥的 Web 界面。\n- 它与众多身份验证系统集成。\n- 所有密钥都存储在单个集中式工具中。\n- 它允许您独立于架构，因为它可以通过所有主要云服务提供商、Kubernetes，甚至内部数据中心（本地）访问。\n\
  \n> 注意\n> 有关 Vault 功能的更多信息，请参阅 https://www.vaultproject.io/docs/what-is-vault/index.html\
  \ 的产品页面。\n\n凭借所有这些非常有趣的功能，Vault 因此是我推荐给任何希望保护其敏感信息并将其安全可访问性集成到 CI/CD 管道中的公司的工具。确实，除了在数据保护方面非常高效之外，Vault\
  \ 在 CI/CD 管道中集成得非常好。这些管道将能够在预配基础设施和部署应用程序时使用此受保护的数据。\n\n在对 Vault 进行概述后，我们将继续在本地计算机上安装\
  \ Vault 并使用它来加密和解密数据。我们还将介绍 Vault 用户界面（UI），最后，我们将介绍如何在 Terraform 中从 Vault 检索数据的过程。\n\
  \n### 在本地安装 Vault\n\n如果您决定使用 Vault，重要的是要知道它是负责保护您的敏感基础设施和应用程序数据的工具。在实践中，Vault 不仅仅是一个工具，在将其安装到生产环境之前，您需要了解其概念及其不同的架构拓扑。\n\
  \n> 注意\n> 要了解有关 Vault 架构拓扑的更多信息，请参阅 https://learn.hashicorp.com/vault/operations/ops-reference-architecture\
  \ 的文档。\n\n本章的目的因此不是深入探讨 Vault 概念和架构的细节，而是解释如何在开发模式下安装和使用 Vault。换句话说，我们将在本地工作站上安装\
  \ Vault，以便拥有一个用于测试和开发的小型实例。\n\n\n\n\n\n我们已经在本书中详细介绍了如何使用 Terraform 和 Packer 等 HashiCorp\
  \ 工具，同样，Vault 可以手动安装，也可以通过脚本安装，具体步骤如下：\n\n- 若要**手动安装 Vault**，其步骤与安装 Terraform 和\
  \ Packer 完全相同，因此你需要执行以下操作：\n\n  A. 导航至下载页面：`https://www.vaultproject.io/downloads.html`。\n\
  \n  B. 在所选文件夹中下载与你的操作系统相关的软件包。\n\n  C. 解压软件包，并将 `PATH` 环境变量更新为包含该文件夹路径的路径。\n\n-\
  \ 若要**自动安装 Vault**，我们将使用一个脚本，其代码取决于我们的操作系统。\n\n对于 **Linux**，在终端中运行以下脚本（来自 `https://www.vaultproject.io/downloads`）：\n\
  \n```bash\ncurl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add\
  \ -\nsudo apt-add-repository \"deb [arch=amd64] https://apt.releases.hashicorp.com\
  \ $(lsb_release -cs) main\"\nsudo apt-get update && sudo apt-get install vault\n\
  ```\n\n此脚本执行以下操作：\n\n1. 向 HashiCorp 软件包注册表注册。\n2. 安装 Vault 软件包。\n\n对于 **Windows**，若要通过脚本安装\
  \ Vault，我们将使用 **Chocolatey**（即 Windows 软件包管理器（`https://chocolatey.org/`）），并在终端中执行以下命令：\n\
  \n```bash\nchoco install vault -y\n```\n\n此命令从 Chocolatey 下载并安装 Vault。\n\n除了这些允许在本地工作站上安装\
  \ Vault 的脚本之外，HashiCorp 还提供 Terraform 代码，可让你在不同的云提供商上创建完整的 Vault 基础设施。\n\n### 注意\n\
  \n此 Terraform 代码可用于 Azure，地址为 `https://github.com/hashicorp/terraform-azurerm-vault`；用于\
  \ AWS，地址为 `https://github.com/hashicorp/terraform-aws-vault`；用于 GCP，地址为 `https://github.com/hashicorp/terraform-google-vault`。\n\
  \n对于 **Kubernetes**，我们可以使用 Helm chart 在 Kubernetes 实例中安装 Vault，使用以下脚本：\n\n```bash\n\
  helm repo add hashicorp https://helm.releases.hashicorp.com\nkubectl create namespace\
  \ vault\nhelm install vault hashicorp/vault --namespace vault\n```\n\n在上述脚本中，我们执行以下操作：\n\
  \n1. 在本地添加 HashiCorp Helm 仓库。\n2. 创建 `vault` 命名空间。\n3. 使用 Helm chart 在 `vault` 命名空间中安装\
  \ Vault。\n\n有关在 Kubernetes 上安装 Vault 的更多详细信息，请阅读此处的教程：\n\n`https://learn.hashicorp.com/tutorials/vault/kubernetes-raft-deployment-guide?in=vault/kubernetes`\n\
  \n安装 Vault 后，我们将通过在终端中运行以下命令来测试其安装：\n\n```bash\nvault --version\n```\n\n此命令显示已安装的\
  \ Vault 版本。我们也可以执行 `vault --help` 命令以显示可用命令列表。\n\n我们刚刚了解了在本地机器或 Kubernetes 上安装 Vault\
  \ 的不同方式；下一步是启动 Vault 服务器。\n\n### 启动 Vault 服务器\n\nVault 是一种客户端/服务器工具，由开发者用于应用程序的客户端组件和负责保护远程后端中数据的服务器组件组成。\n\
  \n> 注意\n> Vault 支持非常多的后端，列表可在此处查看：\n> https://www.vaultproject.io/docs/configuration/storage/index.html\n\
  \n在本地安装 Vault 后，我们只能访问客户端部分，为了能够使用 Vault，我们将启动服务器组件。\n\n要在开发模式下启动 Vault 服务器组件，我们将在第二个终端中执行此命令：\n\
  \n```bash\nvault server -dev\n```\n\n此命令启动并配置 Vault 服务器，使用包含身份验证令牌和名为 in-memory\
  \ 的默认后端的最小配置，该后端将所有机密数据存储在服务器内存中，如以下截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_449_0.png)\n\
  \n图 14.6 – Vault 启动 -dev 模式\n\n> 重要注意事项\n> 此终端必须保持打开状态，以使 Vault 服务器保持运行。\n\n此外，由于我们处于开发模式且后端存储仅在内存中，一旦\
  \ Vault 服务器停止，所有机密数据都将从内存中删除。\n\n然后，如执行过程中所示，我们将在另一个终端中使用以下命令导出 VAULT_ADDR 环境变量：\n\
  \n```bash\nexport VAULT_ADDR='http://127.0.0.1:8200'\n```\n\n最后，为了检查 Vault 服务器的执行状态，我们执行以下命令：\n\
  \n```bash\nvault status\n```\n\n以下是命令输出，显示了 Vault 服务器的属性：\n\n![](img/d3344b39c888aab0b832625465f837c9_450_0.png)\n\
  \n图 14.7 – Vault 状态\n\n> **注意**\n> 要了解有关在开发模式下启动的 Vault 服务器的更多信息，请阅读 `https://www.vaultproject.io/docs/concepts/dev-server.html`\
  \ 中的文档。\n\n现在 Vault 已安装且服务器已启动，我们将了解如何将数据写入 Vault 以保护它，并读取该数据以便从第三方应用程序使用。\n\n###\
  \ 将机密写入 Vault\n\n当你想要保护将由应用程序或基础设施资源使用的敏感数据时，第一步是将此数据存储在公司选择的机密数据管理器中。我们将在实践中了解将数据写入\
  \ Vault 的步骤。\n\n要在 Vault 中保护数据，我们进入终端并执行以下命令：\n\n```bash\nvault kv put secret/vmadmin\
  \ vmpassword=admin123*\n```\n\n以下截图显示了其执行情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_451_0.png)\n\
  \n图 14-8 – 使用 vault kv put 命令行将机密写入 Vault\n\n该命令的 put 操作在内存中创建名为 vmadmin 的新机密数据，类型为键值对，在此示例中是\
  \ VM 的管理员帐户，位于 secret/ 路径中。\n\n在 Vault 中，所有受保护的数据都存储在对应于 Vault 中组织位置的路径中。Vault 的默认路径为\
  \ secret/，并且可以创建自定义路径，这些路径将允许更好地管理机密权限，并按域、主题或应用程序更好地组织。\n\n关于存储在 Vault 中的机密，其优势之一是可以在同一机密中存储多个数据；例如，我们将使用另一个机密（即\
  \ VM 的登录管理员）来更新我们已创建的机密数据。\n\n为此，我们将执行以下命令，该命令在同一 Vault 数据中添加另一个键值机密：\n\nvault kv\
  \ put secret/vmadmin vmpassword=admin123* vmadmin=bookadmin\n\n正如我们在此执行中所见，我们使用了完全相同的命令和相同的机密，并添加了新的键值数据——即\
  \ vmadmin。\n\n注意\n有关此 kv put 命令的更多信息，请阅读 `https://www.vaultproject.io/docs/commands/kv/put.html`\
  \ 中的文档。\n\n我们学习了如何使用命令在 Vault 中创建机密以及机密的各种用途，现在我们将查看读取此机密的命令，以便在应用程序或基础设施资源中使用它。\n\
  \n### 在 Vault 中读取机密\n\n一旦我们在 Vault 中创建了机密，就必须读取它们以便在我们的应用程序或基础设施脚本中使用它们。\n\n要读取存储在\
  \ Vault 中的键，我们进入终端以执行此命令：\n\n```bash\nvault kv get secret/vmadmin\n```\n\n在此命令中，我们使用\
  \ `kv` 操作和 `get` 运算符，并在参数中指定要获取的键的完整路径，以便在我们的示例中获取受保护的值 `secret/vmadmin`。\n\n以下截图显示了命令执行情况及其输出：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_452_0.png)\n\n图 14.9 – 使用 vault kv get\
  \ 命令行获取机密\n\n我们在此命令输出中注意到以下内容：\n\n- 此处机密的版本号为 `2`，因为我们执行了两次 `kv put` 命令，因此每次执行时版本号都会递增。\n\
  - 在之前的“将机密写入 Vault”部分中，我们在机密中保护了两个键值数据项。\n\n如果你想要访问此机密中存储的数据，但来自较早版本，你可以执行相同的命令，并可选地指定所需的版本号，如以下示例所示：\n\
  \n```bash\nvault kv get -version=1 secret/vmadmin\n```\n\n\n\n\n\n### 以下是执行的截图：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_453_0.png)\n\n图 14.10 – 通过版本获取 Vault\
  \ 密钥\n\n我们可以在此输出中看到，在 Data 部分，第一次执行 `kv put` 命令时的键值数据的版本 1。\n\n> **注意**\n> 有关 `kv\
  \ get` 命令的更多信息，请阅读 `https://www.vaultproject.io/docs/commands/kv/get.html` 上的文档。\n\
  \n我们刚刚了解了使用 `kv get` Vault 命令来检索密钥的所有或特定版本的值；现在我们将简要了解如何使用 Vault UI Web 界面来更好地管理密钥。\n\
  \n### 使用 Vault UI Web 界面\n\nVault 的一个有趣的功能是，除了允许您在 Vault 服务器上执行所有操作的客户端工具之外，Vault\
  \ 还有一个 UI Web 界面，允许您管理密钥，但更加直观和图形化。\n\n要打开并使用 Vault Web 界面来可视化我们使用客户端工具创建的密钥，我们必须遵循以下步骤：\n\
  \n1. 在浏览器中，输入启动服务器时提供的 URL，即 `http://127.0.0.1:8200/ui`，这是默认的本地 Vault URL。\n\n2.\
  \ 在身份验证表单中，输入在终端的根令牌信息中提供的令牌，如下面的截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_454_0.png)\n\
  \n图 14-11 – Vault 获取根令牌\n\n3. 单击 Sign In 按钮进行身份验证，如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_454_1.png)\n\
  \n图 14-12 – Vault UI 登录\n\n4. 界面的主页显示一个名为 **Secrets Engines** 的密钥路径列表，包含已存储的密钥，如下面的截图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_455_0.png)\n\n图 14.13 – Vault UI Secrets\
  \ Engines\n\n5. 单击每个密钥引擎，您可以查看已保存的密钥列表。下面的截图显示了密钥引擎页面，该页面显示了我们在上一节中在命令行上创建的密钥：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_455_1.png)\n\n图 14.14 – Vault UI 密钥\n\
  \n6. 单击特定密钥，您可以访问已保护的数据列表，并有可能以明文查看每个键的值。我们还可以通过在 **History** 下拉菜单中选择所需的版本来显示密钥内容的历史记录，如下面的截图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_456_0.png)\n\n图 14.15 – Vault UI：读取密钥详细信息\n\
  \nVault Web 界面还允许您对密钥和其他 Vault 组件执行所有管理操作。\n\n> **注意**\n> 如果您想了解更多关于此 Web 界面的信息，请阅读此文章：https://www.hashicorp.com/resources/vault-oss-ui-introduction\n\
  \n我们已经看到，Vault Web 界面是客户端工具的一个非常好的替代方案，允许您查看和管理 Vault 元素。在对 Vault 及其操作进行概述后，我提出一个小的\
  \ Vault 用例，向您展示如何在 Terraform 代码中获取密钥。\n\n### 在 Terraform 中获取 Vault 密钥\n\n正如我们在 _第\
  \ 2 章，使用 Terraform 配置云基础设施_ 中已经看到的，保护我们在 Terraform 代码中编写的基础设施配置信息非常重要。保护此敏感数据的一种方法是将其存储在\
  \ Vault 等密钥管理器中，并直接使用 Terraform 动态检索它。\n\n以下是一个 Terraform 代码示例，允许您从 Vault 检索要配置的\
  \ VM 的密码。此 Terraform 代码示例由三个块组成，详细说明如下：\n\n1. 首先，我们使用 Vault 提供程序通过执行以下代码来配置 Vault\
  \ URL：\n\n```hcl\nprovider \"vault\" {\n    address = \"http://127.0.0.1:8200\"\
  \ #Local Vault Url\n}\n```\n\nVault 提供程序已配置 Vault 服务器配置及其身份验证。\n\n在我们的案例中，我们在 Terraform\
  \ 代码中配置 Vault 服务器 URL，并且对于令牌身份验证，我们将在运行 Terraform 时使用环境变量，在代码说明之后。\n\n> 注意\n> 有关\
  \ Terraform Vault 提供程序及其配置的更多详细信息，请参阅以下文档：\n> https://www.terraform.io/docs/providers/vault/index.html\n\
  \n2. 然后，我们添加 Terraform 数据块 vault_generic_secret，用于从 Vault 服务器检索密钥。代码如下片段所示：\n\n\
  ```hcl\ndata \"vault_generic_secret\" \"vmadmin_account\" {\n    path = \"secret/vmadmin\"\
  \n}\n```\n\n此数据块允许我们（以只读模式）检索存储在 Vault 中的密钥的内容。在这里，我们要求 Terraform 检索位于我们在本节中先前创建的\
  \ secret/vmadmin Vault 路径中的密钥。\n\n> 注意\n> 有关 vault_generic_secret 数据及其配置的更多详细信息，请参阅以下文档：\n\
  > https://www.terraform.io/docs/providers/vault/d/generic_secret.html\n\n3. 最后，我们添加一个输出块来使用密钥的解密值，如下所示：\n\
  \n```hcl\noutput \"vmpassword\" {\n  value = \"${data.vault_generic_secret.vmadmin_account.data[\"\
  vmpassword\"]}\"\n  sensitive = true\n}\n```\n\n此块提供了密钥利用的示例。\n\n`data.vault_generic_secret.vmadmin_account.data[\"\
  vmpassword\"]` 表达式用于获取先前使用的数据块返回的密钥。在 `data` 数组中，我们添加了需要加密值被恢复的键的名称。此外，此输出被视为 `sensitive`，以便\
  \ Terraform 在执行时不以明文显示其值。\n\n> **注意**\n> 完整的 Terraform 源代码也可在此处找到：\n> https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP14/vault/terraform_usevault/main.tf\n\
  \n我们已完成编写 Terraform 代码；现在我们将快速执行它以查看密钥的恢复。\n\n> **注意**\n> 对于我们已在 _第 2 章，使用 Terraform\
  \ 配置云基础设施_ 中详细说明的代码执行，我们将在此节中仅引用命令而不再进一步详细说明。\n\n要执行 Terraform，我们在终端中进入包含 Terraform\
  \ 代码的文件夹，然后按以下顺序进行：\n\n1. 将 `VAULT_TOKEN` 环境变量导出为 Vault 令牌的值。在我们的开发模式案例中，此令牌在启动\
  \ Vault 服务器时提供。以下命令显示在 Linux 操作系统上导出此环境变量：\n\n```bash\nexport VAULT_TOKEN=xxxxxxxxxxxxxx\n\
  ```\n\n2. 然后，我们将使用以下命令执行 Terraform：\n\n```bash\nterraform init\nterraform plan\n\
  terraform apply\n```\n\n以下是这些命令详细信息的快速摘要：\n\n- `terraform init` 命令初始化上下文并下载所有必要的提供程序。\n\
  - `terraform plan` 命令显示 Terraform 将应用的所有更改的预览。\n- `terraform apply` 命令对基础设施应用所有更改并显示输出值。\n\
  \n> **注意**\n> 要了解主要 Terraform 命令和 Terraform 生命周期的所有详细信息，请阅读本书 _第 2 章，使用 Terraform\
  \ 配置云基础设施_。\n\n下面的截图显示了 `apply` 命令的执行：\n\n![](img/d3344b39c888aab0b832625465f837c9_459_0.png)\n\
  \n图 14.16 – Terraform 敏感输出\n\n我们可以看到，名为 `vmpassword` 的 Terraform 输出中的值在终端中未以明文显示。\n\
  \n3. 最后，我们使用 `terraform output` 命令和 `-json` 选项以 **JavaScript Object Notation**（JSON）格式显示\
  \ Terraform 输出值，如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_460_0.png)\n\n\
  图 14.17 – JSON 格式的 Terraform 输出命令\n\n我们看到，Terraform 已显示密钥中键的值，我们已将该值插入 Vault。此值现在可用于任何不应存储在\
  \ Terraform 代码中的敏感数据，例如 VM 密码。\n\n> 但是，请小心\n> 我们已通过将所有敏感数据外包给密钥管理器来保护我们的 Terraform\
  \ 代码，但不应忘记 Terraform 将所有信息（包括数据和输出信息）存储在 Terraform 状态文件中。因此，将 Terraform 状态文件存储在受保护的远程后端中非常重要，如我们在\
  \ _第 2 章，使用 Terraform 配置云基础设施_ 的“在远程后端中保护状态文件”部分中所见。\n\n在本节中，我们研究了 HashiCorp 的 Vault\
  \ 的使用，它是一个密钥数据管理器。我们了解了如何在不同操作系统上手动和自动进行安装。我们使用其命令行来保护和读取我们在其中保护的数据。然后，我们讨论了如何使用其\
  \ Web 界面在 Vault 中管理密钥。最后，我们编写并执行了使用 Vault 提供程序并允许我们从 Vault 服务器检索存储密钥的 Terraform\
  \ 代码。\n\n### 摘要\n\n本章专门介绍将安全性集成到 DevOps 实践中。我们介绍了三种工具来验证和保护您的数据和云基础设施。我们讨论了如何使用\
  \ Chef 的 **InSpec** 检查 Azure 基础设施的合规性。\n\n为此并检查基础设施合规性，我们安装了 InSpec 并详细介绍了 InSpec\
  \ 测试的编写。我们使用其命令行来验证 Azure 基础设施的合规性。\n\n\n\n\n\n在上一节中，我们了解了如何使用 HashiCorp 的 **Vault**\
  \ 保护敏感数据。在本节中，我们探讨了 Vault 中的数据加密和解密，并编写了 Terraform 代码，该代码将动态检索存储在 Vault 中的密钥。\n\n\
  在下一章中，我们将介绍 **蓝绿部署** 的概念及其用于减少部署停机时间的模式。然后，我们将学习如何在应用程序以及 Azure 基础设施部署中实现它。\n\n\
  ### 问题\n\n- 1. InSpec 的作用是什么？\n- 2. 允许您通过命令行下载 InSpec 的包管理器的名称是什么？\n- 3. 哪个 InSpec\
  \ 命令允许您执行 InSpec 测试？\n- 4. Vault 的发布者是谁？\n- 5. 哪个命令以开发模式启动 Vault？\n- 6. 当 Vault\
  \ 在本地安装时，可以用于生产环境吗？\n- 7. 在本地模式下，Vault 的加密数据存储在哪里？\n\n### 进一步阅读\n\n如果您想了解有关使用 InSpec、Vault\
  \ 和 **Azure 安全开发工具包 (AzSK)** 进行 DevSecOps 的更多信息，以下是一些资源：\n\n- InSpec 文档：`https://www.inspec.io/`\n\
  - HashiCorp Vault 文档：`https://www.vaultproject.io/docs/`\n- 了解 HashiCorp Vault：`https://learn.hashicorp.com/vault`\n"
- "## 15 减少部署停机时间\n\n到目前为止，在本书中，我们讨论了 **DevOps** 实践，例如 **基础设施即代码 (IaC)**、**持续集成/持续部署\
  \ (CI/CD)** 管道以及不同类型测试的自动化。\n\n在 _第 1 章，DevOps 文化和基础设施即代码实践_ 中，我们了解到这些 DevOps 实践将提高应用程序的质量，从而提高公司的财务收益。我们将进一步深入了解\
  \ DevOps 实践，探讨如何在部署期间确保应用程序的持续可用性，以及如何更频繁地将这些应用程序的新版本交付到生产环境中。\n\n通常，我们看到的是，部署需要中断应用程序，例如——基础设施更改或服务停机。而且，我们还看到的是，公司仍然不愿更频繁地交付到生产环境。他们无法在生产环境中测试应用程序，或者正在等待其他依赖项。\n\
  \n在本章中，我们将探讨几种有助于改进应用程序交付流程的实践。我们将从一种在 Terraform 部署期间减少基础设施和应用程序停机时间的方法开始。然后，我们将讨论蓝绿部署的概念和模式，以及如何使用一些\
  \ Azure 资源对其进行配置。最后，我们将介绍在应用程序中实现功能标志的详细信息，这将允许您修改应用程序的操作，而无需在生产环境中重新部署它。\n\n您还将学习如何配置\
  \ Terraform 代码以减少应用程序停机时间。您将能够使用蓝绿部署配置 Azure 资源，并使用开源组件或 LaunchDarkly 平台在应用程序中实现功能标志。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 使用 Terraform 减少部署停机时间\n- 了解蓝绿部署概念和模式\n- 在 Azure 上应用蓝绿部署\n\
  - 功能标志简介\n- 使用开源框架实现功能标志\n- 使用 LaunchDarkly 解决方案\n\n### 技术要求\n\n为了理解本章中将介绍的 Terraform\
  \ 概念，您需要阅读过 _第 2 章，使用 Terraform 配置云基础设施_。\n\n我们将查看如何在 Azure 中实现蓝绿部署的示例。如果您没有 Azure\
  \ 订阅，可以在此处创建免费的 Azure 帐户：`https://azure.microsoft.com/en-gb/free/`。\n\n然后，我们将查看如何在\
  \ ASP.NET Core 应用程序中使用功能标志的示例。要使用我们的示例，您需要安装 **.NET Core 软件开发工具包 (SDK)**，可以从 `https://dotnet.microsoft.com/download`\
  \ 下载。\n\n对于代码编辑，我们使用了免费的 **Visual Studio Code (VS Code)** 编辑器，可以在此处下载：`https://code.visualstudio.com/`。\n\
  \n本章的完整源代码可在 `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP15`\
  \ 找到。\n\n查看以下视频，观看代码实际运行情况：\nhttps://bit.ly/3hcvrVH\n\n### 使用 Terraform 减少部署停机时间\n\
  \n在第 2 章，使用 Terraform 配置云基础设施中，我们详细介绍了 Terraform 的使用，探讨了其命令和生命周期，并通过在 Azure 中的实施进行了实践。\n\
  \nTerraform 的一个问题是，根据需要实施的基础设施更改，Terraform 可能会自动销毁并重建某些资源。\n\n为了充分理解这种行为，让我们查看以下\
  \ Terraform 执行的输出，该执行在 Azure 中配置了 Azure Web 应用，并已通过名称更改进行了修改：\n\n![](img/d3344b39c888aab0b832625465f837c9_465_0.png)\n\
  \n图 15.1 – Terraform 停机时间\n\n在这里，我们可以看到 Terraform 将销毁 Web 应用，然后使用新名称重建它。虽然销毁和重建是自动完成的，但在\
  \ Terraform 销毁和重建 Web 应用期间，应用程序对用户不可访问。\n\n为了解决这个停机问题，我们可以添加 Terraform create_before_destroy\
  \ 选项，如下所示：\n\n```hcl\nresource \"azurerm_app_service\" \"webapp\" {\n  name = \"\
  MyWebAppBook1\" #new name\n  location = \"West Europe\"\n  resource_group_name =\
  \ \"${azurerm_resource_group.rg-app.name}\"\n  app_service_plan_id = \"${azurerm_app_service_plan.serviceplan-app.id}\"\
  \n  app_settings = {\n    WEBSITE_RUN_FROM_PACKAGE = var.package_zip_url\n  }\n\
  \  lifecycle { create_before_destroy = true }\n}\n```\n\n添加此选项后，Terraform 将执行以下操作：\n\
  \n- 首先，Terraform 使用新名称创建一个新的 Web 应用。\n- 在配置新 Web 应用期间，它使用 app_settings 属性中提供的 ZIP\
  \ 格式应用程序包的 **统一资源定位符 (URL)**。使用 WEBSITE_RUN_FROM_PACKAGE 启动应用程序。\n- 然后，Terraform\
  \ 将销毁旧的 Web 应用。\n\n使用 Terraform create_before_destroy 选项将确保在部署期间我们的应用程序的可行性。\n\n\
  但是，请注意，只有当正在创建的新资源允许我们在配置的同时非常快速地运行应用程序，从而不会发生服务中断时，此选项才有用。\n\n在我们的 Web 应用示例中，当我们使用\
  \ Web 应用的 WEBSITE_RUN_FROM_PACKAGE 属性时，这奏效了。对于 **虚拟机 (VM)**，我们可以使用由 **Packer** 创建的\
  \ VM 映像。正如我们在 _第 4 章，使用 Packer 优化基础设施部署_ 中所见，Packer 包含有关 VM 映像中已更新的 VM 应用程序的信息。\n\
  \n> 注意\n> 有关 `create_before_destroy` 选项的更多信息，请参阅以下 Terraform 文档：https://www.terraform.io/language/meta-arguments/lifecycle。\n\
  \n我们刚刚看到，使用 Terraform 和 IaC，在资源更改的情况下，可以减少部署期间的停机时间。\n\n我们现在将探讨一种称为 **蓝绿部署** 的实践的概念和模式，它允许我们以极大的信心在生产环境中部署和测试应用程序。\n\
  \n### 了解蓝绿部署概念和模式\n\n蓝绿部署是一种允许我们在不影响当前应用程序版本的情况下在生产环境中部署新版本应用程序的实践。在此方法中，生产架构必须由\
  \ **两个相同的环境** 组成；一个环境称为 **蓝色** 环境，而另一个环境称为 **绿色** 环境。\n\n允许在环境之间进行路由的元素是路由器——即负载均衡器。\n\
  \n以下图表显示了蓝绿架构的简化示意图：\n\n![](img/d3344b39c888aab0b832625465f837c9_467_0.png)\n\n\
  图 15.2 – 蓝绿架构\n\n如我们所见，有两个相同的环境——称为 **蓝色** 的环境，即应用程序的当前版本，以及称为 **绿色** 的环境，即应用程序的新版本或下一个版本。我们还可以看到一个路由器，它将用户的请求重定向到蓝色环境或绿色环境。\n\
  \n\n\n\n\n现在我们已经介绍了蓝绿部署的原理，将在部署过程中探讨如何在实践中实现它。\n\n### 使用蓝绿部署改进生产环境\n\n蓝绿部署的基本使用模式如下：当我们部署应用程序的新版本时，应用程序将部署在蓝色环境（版本\
  \ _N_）中，并在此环境中配置路由器。\n\n当部署下一个版本（版本 _N+1_）时，应用程序将部署在绿色环境中，并在此环境中配置路由器。\n\n蓝色环境将变得未使用且闲置，直到版本\
  \ _N+2_ 的部署。它也将在需要快速回滚到版本 _N_ 时使用。\n\n这种蓝绿部署的实践也可以分解为几种模式——即金丝雀发布和暗启动模式。让我们详细讨论每种模式的实现。我们将从金丝雀发布模式开始。\n\
  \n### 理解金丝雀发布模式\n\n金丝雀发布技术与蓝绿部署非常相似。应用程序的新版本将部署在绿色环境中，但仅针对一小部分受限制的用户群体，他们将在真实的生产环境中测试应用程序。\n\
  \n这种实践是通过配置路由器（或负载均衡器）将流量重定向到两个环境来实现的。在此路由器上，我们应用用户组的重定向限制，使其只能重定向到包含新版本的绿色环境。\n\
  \n以下是金丝雀发布模式的示例图：\n\n![](img/d3344b39c888aab0b832625465f837c9_468_0.png)\n\n图 15.3\
  \ – 蓝绿金丝雀发布\n\n在前面的图中，路由器将 90% 的用户重定向到蓝色环境，将 10% 的用户重定向到包含应用程序新版本的绿色环境。\n\n然后，一旦由该用户组完成测试，路由器可以完全配置到绿色环境，从而使蓝色环境可用于测试下一个版本（N+2）。\n\
  \n如下图所示，路由器配置为将所有用户重定向到绿色环境：\n\n![](img/d3344b39c888aab0b832625465f837c9_469_0.png)\n\
  \n图 15.4 – 带路由器的蓝绿架构\n\n这种部署技术使得可以在真实的生产环境中部署和测试应用程序，而无需影响所有用户。\n\n我们将在本章后面的“在 Azure\
  \ 上应用蓝绿部署”部分中，探讨这种蓝绿部署模式的实际实现。但在此之前，让我们来看另一种蓝绿部署模式——暗启动模式。\n\n### 探索暗启动模式\n\n暗启动模式是与蓝绿部署相关的另一种实践，它包括以隐藏或禁用模式（因此不可访问）将新功能部署到生产环境中。然后，当我们希望在已部署的应用程序中访问这些功能时，可以逐步激活它们，而无需重新部署应用程序。\n\
  \n与金丝雀发布模式不同，暗启动模式不是依赖于基础设施的蓝绿部署，而是在应用程序代码中实现的。要设置暗启动模式，有必要将应用程序的每个功能的代码封装在称为**功能标志**（或**功能开关**）的元素中，这些元素将用于远程启用或禁用这些功能。\n\
  \n我们将在本章的最后几个部分中，探讨使用开源框架和云平台实现和使用功能标志的方法。\n\n在本节中，我们介绍了蓝绿部署的实践，以及其概念和模式，例如金丝雀发布和暗启动模式。我们讨论了这种实践需要对生产基础设施进行更改，因为它由两个基础设施实例组成——一个蓝色和一个绿色——以及一个重定向用户请求的路由器。\n\
  \n现在我们已经讨论了蓝绿部署模式，将探讨如何在 Azure 云基础设施中实际实现其中一种。\n\n### 在 Azure 上应用蓝绿部署\n\n现在我们已经了解了蓝绿部署，将探讨如何使用两种类型的组件——App\
  \ Service 槽位和 Azure 流量管理器——将其应用于 Azure 基础设施。\n\n让我们先来看看最基本的组件——App Service 槽位。\n\
  \n### 使用带槽位的 App Service\n\n如果我们有 Azure 订阅，并且希望在不投入太多精力的情况下使用蓝绿部署，可以使用 App Service\
  \ 槽位（Azure Web Apps 或 Azure Functions）。\n\n在 Azure App Services（例如 Web App）中，我们可以通过为其创建槽位（根据\
  \ App Service 计划最多可创建 20 个槽位）来创建 Web App 的第二个实例。这个槽位是一个次要的 Web 应用，但附加到我们的主 Web 应用上。\n\
  \n换句话说，主 Web 应用代表蓝色环境，槽位代表绿色环境。\n\n要使用此 Web 应用及其槽位作为蓝绿架构，我们将执行以下配置步骤：\n\n+ 1. 一旦创建了\
  \ Web 应用槽位，应用程序的新版本将部署在此槽位中，我们可以分配一定比例的流量，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_471_0.png)\n\
  \n在此，我们已将 10% 的流量分配给包含新版本应用程序更改的 Web 应用槽位。\n\n+ 2. 一旦应用程序的新版本在槽位上经过测试，我们可以将槽位交换到主\
  \ Web 应用（蓝色环境），如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_471_1.png)\n\n\
  通过此交换，Web 应用将获取其槽位的内容，反之亦然。\n\nWeb 应用现在包含应用程序的新版本（_N+1_），而槽位包含旧版本（_N_）。如果出现紧急问题，我们可以通过再次执行交换来恢复应用程序的先前版本。\n\
  \n> **注意**\n> 要了解有关配置和使用 Web 应用槽位的更多信息，可以阅读以下文档：https://docs.microsoft.com/en-us/azure/app-service/deploy-staging-slots。\n\
  \n这正是我们在金丝雀发布模式中看到的内容，它允许我们为一组用户分配生产流量，并将应用程序路由到包含 _N+1_ 版本的环境。\n\n现在我们已经讨论了槽位的使用，将探讨\
  \ Azure 流量管理器组件，它也允许我们实现蓝绿部署。\n\n### 使用 Azure 流量管理器\n\n在 Azure 中，有一个名为 **Azure 流量管理器**\
  \ 的组件，它允许我们管理多个资源终结点（例如两个 Web 应用）之间的流量。\n\n为此，我们需要有两个 Web 应用：一个用于蓝色环境，另一个用于绿色环境。\n\
  \n然后，在我们的 Azure 订阅中，我们需要创建一个 Azure 流量管理器，并按以下步骤进行配置：\n\n+ 1. 在流量管理器中，我们将首先配置一个确定流量路由方法的配置文件。在我们的案例中，我们将配置一个\
  \ **加权** 配置文件——即根据我们将在 Web 应用中分配的权重进行配置。下图显示了按权重配置配置文件的过程：\n\n![](img/d3344b39c888aab0b832625465f837c9_473_0.png)\n\
  \n图 15.7 – Azure 流量管理器配置\n\n> **注意**\n> 要了解其他配置文件配置选项及其工作原理，可以阅读以下文档：https://docs.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods。\n\
  \n2. 然后，我们将记录构成我们两个 Web 应用的终结点。对于每个终结点，我们将配置一个优先权重，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_473_1.png)\n\
  \n图 15.8 – Azure 流量管理器终结点\n\n\n\n\n\n因此，`main` 终结点（即蓝色环境）具有最大权重，相当于 100% 的流量。\n\n\
  > 注意\n> 如果你想了解有关配置流量管理器的更多信息，可以参考本教程：https://docs.microsoft.com/en-us/azure/traffic-manager/tutorial-traffic-manager-weighted-endpoint-routing.\n\
  \n至于应用服务槽位，通过流量管理器，我们可以根据希望在每个终结点上获得的流量来调整此权重，然后应用蓝绿部署。\n\n我们刚刚讨论了蓝绿部署的实现，更具体地说，是在\
  \ Azure 基础设施中使用几种解决方案实现金丝雀发布模式，总结如下：\n\n- 对于第一种解决方案，我们使用了一个位于 Web 应用下的槽位，并配置了其用户流量百分比。\n\
  - 对于第二种解决方案，我们使用并配置了一个 Azure 流量管理器资源，该资源充当两个 Web 应用之间的路由器。\n\n现在，让我们详细了解暗启动模式，首先介绍功能标志及其实现。\n\
  \n### 引入功能标志\n\n功能标志（也称为功能开关）允许我们动态启用或禁用应用程序的某个功能，而无需重新部署它。\n\n与使用金丝雀发布模式的蓝绿部署不同，后者是一种架构概念，功能标志是在应用程序代码中实现的。其实现是通过使用条件\
  \ `if` 规则的简单封装完成的，如以下代码示例所示：\n\n```\nif(activateFeature (\"addTaxToOrder\") ==True)\
  \ {\n    ordervalue = ordervalue + tax\n}else{\n    ordervalue = ordervalue\n}\n\
  ```\n\n在此示例代码中，`activateFeature` 函数允许我们了解应用程序是否应根据 `addTaxToOrder` 参数将税费添加到订单中，该参数在应用程序外部指定（例如在数据库或配置文件中）。\n\
  \n功能标志封装的功能可能对于应用程序的运行或内部目的（例如日志激活或监控）是必要的。\n\n功能的启用和禁用可以由管理员控制，也可以由用户通过图形界面直接控制。\n\
  \n功能标志的生命周期可以是以下之一：\n\n- **临时**：用于测试功能。一旦用户验证，功能标志将被删除。\n- **确定**：用于长期保留功能标志。\n\n\
  因此，使用功能标志，应用程序的新版本可以更快地部署到生产阶段。这是通过禁用发布的新功能来完成的。然后，我们将为特定用户组（例如测试人员）重新激活这些新功能，他们将直接在生产环境中测试这些功能。\n\
  \n此外，如果我们发现应用程序的某个功能无法正常工作，功能标志可以非常快速地禁用它，而无需重新部署应用程序的其余部分。\n\n功能标志还允许 A/B 测试——即由特定用户测试新功能的行为并收集他们的反馈。\n\
  \n在应用程序中实现功能标志时，有几种技术解决方案，概述如下：\n\n- 你开发和维护自定义功能标志系统，该系统已根据你的业务需求进行调整。此解决方案适合你的需求，但需要大量的开发时间，以及对架构规范（例如使用数据库、数据安全性和数据缓存）的必要考虑。\n\
  - 你使用必须在项目中安装的开源工具。此解决方案可以节省开发时间，但需要选择工具，尤其是在开源工具的情况下。此外，在这些工具中，很少提供门户或仪表板管理功能，允许远程管理功能标志。功能标志有大量开源框架和工具。请访问\
  \ http://featureflags.io/resources/ 查找它们。请参考以下内容：\n\n  - RimDev.FeatureFlags (https://github.com/ritterim/RimDev.FeatureFlags)\n\
  \  - Flagr (https://github.com/checkr/flagr)\n  - Unleash (https://github.com/Unleash/unleash)\n\
  \  - Togglz (https://github.com/togglz/togglz)\n  - Flip (https://github.com/pda/flip).\n\
  \n- 你可以使用云解决方案（平台即服务，或 PaaS），无需安装并具有用于管理功能标志的后台，但其中大多数在企业大规模使用时需要财务投资。在这些解决方案中，我们可以提及以下内容：\n\
  \n  - LaunchDarkly (https://launchdarkly.com/)\n  - Rollout (https://app.rollout.io/signup)\n\
  \  - Featureflag.tech (https://featureflag.tech/)\n  - Featureflow (https://www.featureflow.io/).\n\
  \n在本节中，我们讨论了使用功能标志是一种开发实践，允许你直接在生产阶段测试应用程序。\n\n我们还提到了不同的功能标志使用解决方案，并说明了其实现。让我们讨论一下使用名为\
  \ RimDev.FeatureFlags 的开源工具的其中一种实现。\n\n### 使用开源框架实现功能标志\n\n正如我们所见，有大量开源工具或框架允许我们在应用程序中使用功能标志。\n\
  \n在本节中，我们将查看在 .NET (Core) 应用程序中使用名为 RimDev.FeatureFlags 的简单框架实现功能标志的示例。\n\nRimDev.FeatureFlags\
  \ 是一个用 .NET 编写的免费开源框架 (https://github.com/ritterim/RimDev.FeatureFlags)，并通过 NuGet\
  \ 包进行打包和分发。可以在此处找到：https://www.nuget.org/packages/RimDev.AspNetCore.FeatureFlags.\n\
  \n要存储功能标志数据，RimDev.FeatureFlags 使用必须事先创建的数据库。RimDev.FeatureFlags 的优势在于，一旦在我们的应用程序中实现，它提供了一个\
  \ Web **用户界面 (UI)**，允许我们启用或禁用功能标志。\n\n作为本示例的先决条件，我们需要有一个已初始化的 ASP.NET Core MVC 应用程序。我们将使用一个已创建的\
  \ SQL Server 数据库来存储功能标志数据。\n\n要在此应用程序中初始化 RimDev.FeatureFlags，我们将执行以下步骤：\n\n1. 第一步是在我们的应用程序中引用\
  \ NuGet RimDev.FeatureFlags 包，并使用任何文本编辑器修改应用程序的 .csproj 文件（位于应用程序文件的根目录，包含一些应用程序参数），添加\
  \ PackageReference 元素，如下所示：\n\n   ```xml\n   <ItemGroup>\n   ...\n   <PackageReference\
  \ Include=\"RimDev.AspNetCore.FeatureFlags\" Version=\"2.1.3\" />\n   </ItemGroup>\n\
  \   ```\n\n   或者，我们可以在终端命令行中执行以下命令，以在现有项目中引用 NuGet 包：\n\n   ```\n   dotnet add package\
  \ RimDev.AspNetCore.FeatureFlags\n   ```\n\n2. 然后，我们将转到 appsettings.json 配置文件，使用以下代码配置我们事先创建的数据库的连接字符串：\n\
  \n   ```json\n   \"connectionStrings\": {\n   \"localDb\": \"Data Source=<your database\
  \ server>;Database=FeatureFlags.AspNetCore;User ID=<your user>;Password=<password\
  \ data>\"\n   }\n   ```\n\n### 3. 在 `startup.cs` 文件中，该文件位于应用程序文件的根目录，我们将使用以下代码块向\
  \ `RimDev.FeatureFlags` 添加配置：\n\n```csharp\nprivate readonly FeatureFlagOptions\
  \ options;\npublic Startup(IConfiguration configuration)\n{\n    Configuration =\
  \ configuration;\n    options = new FeatureFlagOptions()\n        .UseCachedSqlFeatureProvider(Configuration.GetConnectionString(\"\
  localDb\"));\n}\n```\n\n在前面的代码片段中，我们使用数据库连接初始化了 RimDev.FeatureFlags 的选项。我们可以使用以下代码配置服务加载：\n\
  \n```csharp\npublic void ConfigureServices(IServiceCollection services)\n{\n   \
  \ ...\n    services.AddFeatureFlags(options);\n}\npublic void Configure(IApplicationBuilder\
  \ app, IHostingEnvironment env)\n{\n    ...\n    app.UseFeatureFlags(options);\n\
  \    app.UseFeatureFlagsUI(options);\n}\n```\n\n应用程序启动后，RimDev 将功能标志数据加载到应用程序上下文中。至此，我们已在项目中配置了\
  \ RimDev.FeatureFlags。\n\n\n\n\n\n现在，我们将创建功能标志并在应用程序中使用它们。在这个示例中，我们将创建一个名为 ShowBoxHome\
  \ 的功能标志，它可能会或可能不会显示应用程序主页中间的图像。让我们看看如何在项目中创建和操作这些功能标志，如下所示：\n\n+ 1. 首先，我们将通过创建一个包含以下代码的新类来创建功能标志：\n\
  \n```csharp\nusing RimDev.AspNetCore.FeatureFlags;\n\nnamespace appFeatureFlags.Models{\n\
  \    public class ShowBoxHome : Feature {\n        public override string Description\
  \ { get;\n        } = \"Show the home center box.\";\n    }\n}\n```\n\n这个类包含 ShowBoxHome\
  \ 功能标志。为这个功能标志提供了一个覆盖的描述。\n\n+ 2. 然后，在我们的控制器中，我们使用以下代码调用 ShowBoxHome 类：\n\n```csharp\n\
  public class HomeController : Controller {\n    private readonly ShowBoxHome showboxHome;\n\
  \    public HomeController (ShowBoxHome showboxHome) {\n        this.showboxHome\
  \ = showboxHome;\n    }\n    public IActionResult Index() {\n        return View(new\
  \ HomeModel{ShowboxHome = this.showboxHome.Value});\n    }\n    ...\n}\n```\n\n\
  控制器接收存储在数据库中的功能标志值，这些值在应用程序启动时加载。\n\n3. 我们还将创建一个 HomeModel 类，用于列出主页所需的所有功能标志，如下所示：\n\
  \n```csharp\npublic class HomeModel\n{\n    public bool ShowBoxHome { get; set;\
  \ }\n}\n```\n\n4. 最后，在 Views/Home/index.cshtml 中，我们将使用这个模型来根据功能标志的值显示主页中间的图像，代码如下：\n\
  \n```razor\n@if(Model.ShowBoxHome){\n<div><img src=\"img/test.png\"></div>\n}\n\
  ```\n\n一旦开发过程结束，部署并运行我们的应用程序。默认情况下，主页中间没有图像，如下面的截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_480_0.png)\n\
  \n图 15-9 – 功能标志演示主页应用程序\n\n要显示图像，我们需要动态激活功能，如下所示：\n\n+ 1. 访问 http://<yoursite>/_features\
  \ 的后台。我们将看到一个名为 ShowHomeBow 的开关。\n\n+ 2. 我们通过打开切换开关来激活标志，如下面的截图所示：\n\n图 15.10 –\
  \ 功能标志演示功能切换\n\n重新加载我们应用程序的主页。在这里，我们可以看到图像显示在页面中间：\n\n![](img/d3344b39c888aab0b832625465f837c9_481_0.png)\n\
  \n图 15.11 – 功能标志演示应用程序\n\n通过使用 RimDev.FeatureFlags 框架和功能标志，我们能够启用或禁用应用程序的功能，而无需重新部署它。\n\
  \n> **Note**\n> \n> 此应用程序的完整源代码可在 `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP15/appFF`\
  \ 找到。\n\n我们刚刚看到如何使用开源工具在 .NET Core 应用程序中实现基本的功能标志。我们注意到，使用开源工具，我们可以在基础设施中创建数据库。这种功能标志的使用相当基础，而且，管理功能标志的\
  \ UI 访问不安全。\n\n最后，与任何开源工具一样，检查它是否由其编辑器或社区定期维护和更新很重要。但是，使用开源工具进行功能标志对于小型商业项目来说仍然很有吸引力且成本低廉。\n\
  \n### 使用 LaunchDarkly 解决方案\n\n在上一节中，我们讨论了使用开源工具进行功能标志，这可能是一个好的解决方案，但需要一些基础设施组件，并且依赖于开发语言（在我们的示例中，它是\
  \ .NET Core）。\n\n为了更好地使用和管理功能标志，我们可以使用一个云解决方案，它不需要实现架构，并提供许多围绕功能标志的功能。\n\n在这些云解决方案（**软件即服务**，或\
  \ **SaaS**）中，有 **LaunchDarkly** (`https://launchdarkly.com/`)，它是一个 SaaS 平台，由功能标志管理后台和允许我们在应用程序中操作功能标志的\
  \ SDK 组成。\n\nLaunchDarkly SDK 可用于许多开发语言，例如 .NET、JavaScript、Go 和 Java。完整的 SDK 列表可在此处找到：`https://docs.launchdarkly.com/sdk`。\n\
  \n除了经典的 `RimDev.FeatureFlags` 功能标志管理版本之外，LaunchDarkly 还允许功能标志由用户管理，并提供与功能标志相关的 A/B\
  \ 测试功能。A/B 测试可以通过功能标志来衡量应用程序功能的使用情况。\n\n但是，LaunchDarkly 是一个付费解决方案 (`https://launchdarkly.com/pricing/`)\
  \ 。幸运的是，它提供 30 天试用，以便我们可以试用。请看看如何使用 LaunchDarkly，以便您可以在 .NET 应用程序中实现功能标志。\n\n为此，我们将首先创建一些功能标志，如下所示：\n\
  \n+ 1. 首先，通过单击 LaunchDarkly 网站顶部菜单中的 **Sign In** 按钮登录您的 LaunchDarkly 帐户。或者，您可以访问\
  \ `https://app.launchdarkly.com/`。\n\n+ 2. 一旦我们连接到帐户，在 **Account settings** 部分，我们可以创建一个名为\
  \ `DemoBook` 的新项目，如下面的截图所示：\n\n图 15.12 – LaunchDarkly 项目创建\n\n默认情况下，项目中创建了两个环境。我们将能够创建自己的环境，然后在不同环境中测试功能标志。此外，每个环境都有一个唯一的\
  \ SDK 密钥，将作为 SDK 的身份验证。\n\n+ 1. 然后，在名为 **Test** 的环境中，我们将导航到 **Feature flags** 菜单，单击\
  \ **Create flag** 按钮，然后创建一个名为 `ShowBoxHome` 的功能标志，如下面的截图所示：\n\n图 15.13 – LaunchDarkly\
  \ 功能标志创建\n\n创建后，我们可以通过单击 **On/Off** 切换开关来激活它。现在我们已经在 LaunchDarkly 门户中配置和创建了功能标志，我们将看到如何在应用程序代码中使用\
  \ SDK。\n\n> Note\n> 在 LaunchDarkly 中，对功能标志所做的更改是由连接到应用程序的用户完成的。这意味着应用程序必须提供身份验证系统。\n\
  \n要使用 SDK 并启动应用程序，请执行以下步骤：\n\n+ 1. 第一步是选择与应用程序开发语言对应的 SDK。我们可以通过访问 https://docs.launchdarkly.com/docs/getting-started-with-launchdarkly-sdks#section-supported-sdks\
  \ 来完成此操作。在我们的例子中，我们有一个 .NET 应用程序，因此我们将遵循此过程：https://docs.launchdarkly.com/docs/dotnet-sdk-reference。\n\
  \n+ 2. 现在，让我们将 NuGet LaunchDarkly.ServerSdk 包（https://www.nuget.org/packages/LaunchDarkly.ServerSdk/）的引用集成到我们应用程序的\
  \ .csproj 文件中，通过将其添加到引用包中，如下所示：\n\n```xml\n<ItemGroup>\n<PackageReference Include=\"\
  LaunchDarkly.ServerSdk\"\nVersion=\"6.3.1\" />\n...\n</ItemGroup>\n```\n\n+ 3. 在\
  \ .NET 代码中，我们在控制器中执行此操作。为此，我们需要使用 using 命令导入 SDK，如下所示：\n\n```csharp\nusing LaunchDarkly.Client;\n\
  ```\n\n+ 4. 仍在控制器代码中，我们添加对 LaunchDarkly 的连接，由 FeatureFlag 调用。代码如下片段所示：\n\n```csharp\n\
  public IActionResult Index() {\nLdClient ldClient = new LdClient(\"sdk-eb0443dc-xxxx-xxx-xx-xxx\"\
  );\nUser user = LaunchDarkly.Client.User.WithKey(User.Identity.Name);\nbool showBoxHome\
  \ = ldClient.BoolVariation(\"show-box-home\", user, false);\nreturn View(new HomeModel{ShowBoxHome\
  \ = showBoxHome});\n}\n```\n\n\n\n\n\nFor the connection to LaunchDarkly, we need\
  \ to use the SDK key that was provided when the project was created. Then, in the\
  \ preceding code, we connect the user who is connected to the application to the\
  \ feature flag that we created previously in the portal.\n\n5. Finally, in the Home/Index.cshtml\
  \ view, we add the following code to add a condition that will display the image,\
  \ depending on the value of the feature flag:\n```\n<div class=\"text-center\">\n\
  @if(Model.ShowBoxHome) {\n<div><img src=\"img/test.png\"></div>\n}\n</div>\n```\n\
  \n6. Finally, we deploy and execute the application. As illustrated in the following\
  \ screenshot, the home page shows the central image because the feature flags are\
  \ set to true by default:\n\n![](img/d3344b39c888aab0b832625465f837c9_485_0.png)\n\
  \nFigure 15.14 – LaunchDarkly feature flag demonstration application\n\n### 7.\n\
  \nThen, we go to the LaunchDarkly portal and modify the configuration of this feature\
  \ flag for the current user with a `false` value. On the **Users** management page,\
  \ we select the user, as illustrated in the following screenshot:\n\n![](img/d3344b39c888aab0b832625465f837c9_486_0.png)\n\
  \nFigure 15.15 – LaunchDarkly user\n\nThen, we update the value of the feature flag\
  \ to `false`, as illustrated in the following screenshot:\n\n![](img/d3344b39c888aab0b832625465f837c9_486_1.png)\n\
  \nFigure 15.16 – LaunchDarkly feature flag user settings\n\n### 8.\n\nBy reloading\
  \ the page, we can see that the central image is no longer displayed, as illustrated\
  \ here:\n\n![](img/d3344b39c888aab0b832625465f837c9_486_2.png)\n\nFigure 15.17 –\
  \ Feature flag demo application with LaunchDarkly\n\nThis is an example of how to\
  \ use LaunchDarkly, which has many other interesting features, such as a user management\
  \ system, feature usage with A/B testing, integration with CI/CD platforms, and\
  \ reporting.\n\n> Note\n> The complete code source for this application can be found\
  \ at `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP15/appdemoLD`.\n\
  \nWhat we have discussed in this section is an overview of LaunchDarkly, which is\
  \ a feature flag cloud platform. We studied its implementation in a web application\
  \ with the creation of feature flags in the LaunchDarkly portal.\n\nThen, we manipulated\
  \ this feature flag in the application code via the SDK provided by LaunchDarkly.\
  \ Finally, in the LaunchDarkly portal, we enabled/disabled a feature for a user\
  \ who wants to test a new feature of the application without having to redeploy\
  \ it.\n\n### 摘要\n\nIn this chapter, we focused on improving production deployments.\
  \ We started by using Terraform to reduce downtime during provisioning and resource\
  \ destruction.\n\nThen, we focused on the practice of blue-green deployment and\
  \ its patterns, such as canary release and dark launch. We looked at the implementation\
  \ of a blue-green deployment architecture in Azure using App Service and the Azure\
  \ Traffic Manager component.\n\nFinally, we detailed the implementation of feature\
  \ flags in a .NET application using two types of tools—`RimDev.FeatureFlags`, which\
  \ is an open source tool that offers a basic feature flag system, and LaunchDarkly,\
  \ which is a cloud-based solution. It's not free of charge but provides complete\
  \ and advanced feature flag management.\n\nThe next chapter is dedicated to GitHub.\
  \ Here, we will look at the best practices for contributing to open source projects.\n\
  \n### 问题\n\n1. In Terraform, which option can we use to reduce downtime?\n2. What\
  \ is a blue-green deployment infrastructure composed of?\n3. What are the two blue-green\
  \ deployment patterns that we looked at in this chapter?\n4. In Azure, what are\
  \ the components that allow us to apply a blue-green deployment practice?\n5. What\
  \ is the role of feature flags?\n6. What is the `RimDev.FeatureFlags` tool?\n7.\
  \ Which feature flag tool discussed in this chapter is a SaaS solution?\n\n### 延伸阅读\n\
  \nIf you want to find out more about zero-downtime and blue-green deployment practices,\
  \ take a look at the following resources:\n\n- * _Zero Downtime Updates with HashiCorp\
  \ Terraform_: `https://www.hashicorp.com/blog/zero-downtime-updates-with-terraform`\n\
  - * _BlueGreenDeployment_ by _Martin Fowler_: `https://martinfowler.com/bliki/BlueGreenDeployment.html`\n\
  - * _Feature Toggles (aka Feature Flags)_ by _Martin Fowler_: `https://martinfowler.com/articles/feature-toggles.html`\n\
  - * _Blue-Green Deployment on Azure with Zero Downtime_ (article): `http://work.haufegroup.io/Blue-Green-Deployment-on-Azure/`\n\
  - * Feature flag guide: `http://featureflags.io/`\n- * LaunchDarkly feature flag\
  \ use cases: `https://launchdarkly.com/use-cases/`\n"
- '## 开源项目的 DevOps


  Until a few years ago, the open source practice, which consists of delivering the
  source code of a product to the public, was essentially only used by the Linux community.
  Since then, many changes have taken place regarding open source with the arrival
  of GitHub. Microsoft has since made a lot of its products open source and is also
  one of the largest contributors to GitHub.


  Today, open source is a must in the development and enterprise world, regardless
  of whether we wish to use a project or even contribute to it.


  However, open source applications are not always free. There are sometimes licensing
  fees for plugins, support, or enterprise features. Also, in terms of support, using
  open source software can sometimes present difficulties and pitfalls when it comes
  to product support.


  Throughout this book, we have seen many instances where open source tools such as
  Terraform, Ansible, Packer, Vagrant, Jenkins, and SonarQube have been used. However,
  one of the great advantages of open source is not only the use of products but also
  the fact that we can contribute to them.


  To contribute to an open source project, we need to participate in its evolution
  by discussing issues with its use or by making suggestions regarding improving it.
  In addition, if you are a developer, you can also modify its source code to make
  it evolve.


  Finally, as a developer or a member of an operational team, we can share our project
  in open source and make it available to the community.


  In this chapter, we''ll discuss open source contributions and why it''s important
  to apply DevOps practices to all open source projects.


  All of these practices, such as the use of Git, a CI/CD pipeline, and security analysis,
  have already been discussed throughout this book. However, in this chapter, we''ll
  focus more on how to apply them in the context of our open source project.


  We will start by learning how to share the code of a project in GitHub and how to
  initialize a contribution to another project. We will also discuss how to manage
  pull requests, which is one of the most important features of the contribution.
  In addition, we will look at how to indicate version changes using release notes,
  and the topic of binary sharing in GitHub Releases. We''ll explain GitHub Actions,
  which allows us to created CI/CD pipelines on open source projects that are hosted
  on GitHub. Finally, we will look at the source code analysis of open source projects.
  We''ll do this using SonarCloud, which is used for static code analysis, and WhiteSource
  Bolt, which is used for analyzing package security vulnerabilities that are contained
  in an open source project.


  In this chapter, we will cover the following topics:


  - Storing source code in GitHub

  - Contributing to open source projects using pull requests

  - Managing the changelog file and release notes

  - Sharing binaries in GitHub releases

  - Getting started with GitHub Actions

  - Analyzing code with SonarCloud

  - Detecting security vulnerabilities with WhiteSource Bolt


  ### Technical requirements


  In this chapter, we will use GitHub as a Git repository platform to store our open
  source project. Therefore, you will need a GitHub account, which you can create
  for free at `https://github.com/`. To fully understand the DevOps practices that
  will be used in this chapter, you should be well-versed with the following chapters
  of this book:


  - _Chapter 6, Managing Your Source Code with Git_

  - _Chapter 7, Continuous Integration and Continuous Delivery_

  - _Chapter 12, Static Code Analysis with SonarQube_






  本章的完整代码可在 `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP16/`
  找到。

  请观看以下视频，查看代码的实际运行情况：

  `https://bit.ly/3JJCb9V`。


  ### 在 GitHub 中存储源代码


  如果我们想以开源方式共享某个项目，必须在支持以下元素的 Git 平台上对其代码进行版本控制：


  - 公共仓库；也就是说，我们需要能够访问该仓库中包含的源代码，但不一定需要在此 Git 平台上进行身份验证。

  - 该平台不同成员之间进行代码协作的功能和工具。


  有两个主要平台允许我们托管开源工具：**GitLab**（我们在 *第 7 章，持续集成和持续交付* 的 *使用 GitLab CI* 部分中介绍过）和 **GitHub**，后者目前是开源项目最常用的平台。

  让我们学习如何使用 GitHub，以便我们可以托管自己的项目或为其他项目做出贡献。


  ### 在 GitHub 上创建新仓库


  如果我们想在 GitHub 上托管项目，需要创建一个仓库。请按照以下步骤操作：


  1. 首先，登录您的 GitHub 账户，如果您是新用户，请通过访问 `https://github.com/` 创建一个新账户。

  2. 登录后，进入账户中的 **Repositories** 选项卡。单击 **New** 按钮，如下图所示：


  ![](img/d3344b39c888aab0b832625465f837c9_491_0.png)


  图 16.1 – 添加仓库


  ### 创建新仓库


  仓库包含所有项目文件，包括修订历史记录。已在其他地方拥有项目仓库？

  导入仓库。


  ![](img/d3344b39c888aab0b832625465f837c9_492_0.png)


  图 16.2 – GitHub 仓库详细信息


  创建仓库需要填写的信息如下：


  - 仓库名称。

  - 描述（可选）。

  - 我们需要指定仓库是 **Public**（所有人都可以访问，即使未经过身份验证）还是 **Private**（仅可供我们授权的成员访问）。

  - 我们还可以选择使用空的 `README.md` 文件以及 `.gitignore` 文件来初始化仓库。


  然后，单击 **Create repository** 按钮验证表单。


  ### 4. 创建仓库后，主页将显示第一条 Git 说明，以便您可以开始存档其代码。下图显示了新 GitHub 仓库说明页面的一部分：


  ![](img/d3344b39c888aab0b832625465f837c9_493_0.png)


  图 16.3 – GitHub 仓库 – 第一条 Git 说明


  一切已准备就绪，可在 GitHub 中存档代码。请使用我们在 _第 6 章，使用 Git 管理源代码_ 中介绍的工作流程和 Git 命令来执行此操作。


  此过程适用于在 GitHub 中创建仓库。现在，让我们学习如何使用另一个仓库的项目来为 GitHub 做出贡献。


  ### 为 GitHub 项目做出贡献


  我们刚刚学习了如何在 GitHub 上创建仓库。但是，我们需要知道的是，默认情况下，只有仓库的所有者才被允许修改该仓库的代码。


  > **注意**

  > 我们可以将人员添加为此仓库的协作者，以便他们可以对代码进行更改。有关此过程的更多信息，请访问 https://help.github.com/en/articles/inviting-collaborators-to-a-personal-repository。


  根据这一原则，我们无权修改另一个仓库的代码。


  要为另一个仓库的代码做出贡献，我们需要创建要贡献的初始仓库的一个 **fork**。fork 是在我们的 GitHub 账户中执行的初始仓库的副本，从而在我们的账户中创建一个新仓库。


  请按照以下步骤了解如何创建仓库的 fork：


  1. 首先，导航到您要为其做出贡献的初始仓库。然后，单击页面顶部的 **Fork** 按钮，如下图所示：


  ![](img/d3344b39c888aab0b832625465f837c9_494_0.png)


  图 16.4 – GitHub – 复刻仓库


  2. 几秒钟后，该仓库连同其所有内容将被复刻并复制到您的账户中。这样做，您的账户中将获得一个与初始仓库关联的新仓库，如下图所示：


  ![](img/d3344b39c888aab0b832625465f837c9_494_1.png)


  图 16.5 – GitHub fork 链接


  3. 现在，您的 GitHub 账户中有一个您要为其做出贡献的仓库的精确副本。您可以自由修改代码并提交更改，所有更改都将存档在您的仓库中。


  但是，即使初始仓库和 fork 之间存在链接，每个仓库的代码也完全不相关，并且代码不会自动同步。


  在本节中，我们学习了如何创建 GitHub 仓库或对另一个仓库进行 fork，以便我们可以为其做出贡献。现在，让我们学习如何使用拉取请求提出代码更改并将我们的代码合并到另一个仓库中。


  ### 使用拉取请求为开源项目做出贡献


  当我们想要为 GitHub 上的开源项目做出贡献时，我们需要对我们 GitHub 账户仓库中的应用程序源代码进行更改。要将这些代码更改合并到初始仓库，我们必须执行
  **merge** 操作。


  在 GitHub 中，有一个称为 **pull request** 的元素，它允许我们在仓库之间执行合并操作。除了在代码分支之间执行简单且经典的合并之外，拉取请求还通过提供允许不同贡献者讨论代码更改的功能，增加了全新的协作方面。


  让我们学习如何执行拉取请求：


  1. 在对您账户仓库中的源代码进行更改后，您必须通过提交 commit 来存档这些更改。已进行的更改现在已准备好与远程仓库合并。为此，请转到您的仓库，进入 **Pull
  requests** 选项卡，然后单击 **New pull request** 按钮，如下图所示：


  ![](img/d3344b39c888aab0b832625465f837c9_495_0.png)


  图 16.6 – GitHub – 新建拉取请求


  ### 2. 出现的页面将指定将要创建的拉取请求的所有信息，如下图所示：


  比较更改

  选择两个分支以查看更改内容或开始新的拉取请求。如果需要，您还可以跨 fork 进行比较。


  与其他人讨论和审查此比较中的更改。了解拉取请求。


  显示 1 个已更改文件，包含 6 处添加和 5 处删除。


