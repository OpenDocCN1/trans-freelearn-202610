  \ 经典编辑器链接\n\n\n\n\n\n在 Azure Pipelines 中，可以选择经典编辑器模式，该模式允许我们通过图形界面配置管道，或者 YAML 管道模式，该模式涉及使用\
  \ **YAML Ain't Markup Language** (YAML) 文件来描述管道的配置。\n\n在此实验中，我们将使用经典编辑器模式，以便可以可视化不同的选项和配置步骤。\n\
  \n3. 管道的第一个配置步骤是选择包含应用程序源代码的仓库。\n\n今天，Azure Pipelines 支持多种 Git 系统，例如 Azure Repos、GitHub、Bitbucket\
  \ 和 **Subversion** (SVN)。因此，我们将在包含导入源代码的仓库中选择 **Azure Repos Git**，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_237_0.png)\n\
