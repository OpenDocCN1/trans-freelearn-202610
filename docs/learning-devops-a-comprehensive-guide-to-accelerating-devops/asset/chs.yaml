  ![](img/d3344b39c888aab0b832625465f837c9_496_0.png)


  屏幕上显示的信息如下：

  • 源仓库/分支和目标仓库/分支

  • 指示是否存在代码冲突的指示器

  • 包含在此拉取请求中的提交列表

  • 修改文件的代码差异


  3. 要验证拉取请求的创建，请单击 **Create pull request** 按钮。

  4. 在出现的表单中输入拉取请求的名称和描述，如下图所示：


  ### 打开拉取请求


  通过比较两个分支的更改来创建新的拉取请求。如果需要，您还可以跨 fork 进行比较。


  ![](img/d3344b39c888aab0b832625465f837c9_497_0.png)


