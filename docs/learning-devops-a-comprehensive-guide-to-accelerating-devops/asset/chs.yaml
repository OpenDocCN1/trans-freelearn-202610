- '# 第 1 部分：DevOps 和基础设施即代码


  第一部分的目标是介绍 DevOps 文化，并提供基础设施即代码最佳实践的所有关键要点。本部分解释了 DevOps 在云基础设施中的应用，展示了使用 Terraform
  进行配置和使用 Ansible 进行配置。然后，我们通过使用 Packer 对此基础设施进行模板化来进一步改进。


  本部分包含以下章节：


  - 第 1 章，DevOps 文化和基础设施即代码实践

  - 第 2 章，使用 Terraform 配置云基础设施

  - 第 3 章，使用 Ansible 配置 IaaS 基础设施

  - 第 4 章，使用 Packer 优化基础设施部署

  - 第 5 章，使用 Vagrant 编写开发环境

  '
- "## 1 DevOps 文化和基础设施即代码实践\n\n**DevOps**，这个术语在企业中越来越常见，常与“我们做 DevOps”或“我们使用 DevOps\
  \ 工具”等短语一起出现，它是“Development”和“Operations”两个词的缩写。\n\nDevOps 是一种与传统企业文化不同的文化，需要改变思维、流程和工具。它通常与**持续集成（CI）**和**持续交付（CD）**实践相关联，这些是软件工程实践，同时也与**基础设施即代码（IaC）**相关联，后者包括对基础设施结构和配置进行_代码化_。\n\
  \n在本章中，我们将了解什么是 DevOps 文化，什么是 DevOps 原则，以及它们为公司带来的好处。然后，我们将解释 CI/CD 实践，最后，我们将详细介绍\
  \ IaC 及其模式和实践。\n\n在本章中，我们将涵盖以下主题：\n\n- DevOps 入门\n- 实现 CI/CD 和持续部署\n- 了解 IaC 实践\n\
  \n查看以下视频以观看代码实际运行情况：`https://bit.ly/3JJAMAb`\n\n### DevOps 入门\n\n_DevOps_ 术语由 Patrick\
  \ Debois、Gene Kim 和 John Willis 在 2007-2009 年引入，它代表了**开发（Dev）**和**运维（Ops）**的结合。它催生了一种主张将开发人员和运维人员聚集在团队中的运动。这能更快地向用户提供额外的业务价值，从而使其在市场上更具竞争力。\n\
  \nDevOps 文化是一组实践，旨在减少**开发人员**（希望创新并更快交付）与**运维人员**（希望保证生产系统的稳定性以及他们所做系统变更的质量）之间的障碍。\n\
  \nDevOps 文化也是敏捷流程（Scrum、XP 等）的延伸，这些流程可以缩短交付时间，并且已经涉及开发人员和业务团队。然而，由于 Ops 未被纳入同一团队，他们常常受到阻碍。\n\
  \nDev 和 Ops 之间的沟通和这种联系，可以更好地跟踪端到端的生产部署，并进行更频繁、质量更高的部署，从而为公司节省资金。\n\n为了促进这种协作并改善\
  \ Dev 和 Ops 之间的沟通，流程中必须建立几个关键要素，如下所示：\n\n- 使用集成和持续交付（称为**CI/CD**）进行更频繁的应用程序部署。\n\
  - 实施和自动化单元测试和集成测试，采用以**行为驱动设计（BDD）**或**测试驱动设计（TDD）**为重点的流程。\n- 实施收集用户反馈的手段。\n- 监控应用程序和基础设施。\n\
  \n### DevOps 运动基于三个轴心：\n\n- **协作文化**：这是 DevOps 的本质——团队不再因专业化孤岛而分离（一个开发团队，一个 Ops\
  \ 团队，一个测试团队，等等）。然而，这些人通过组建具有相同目标的多学科团队聚集在一起：尽可能快地为产品交付附加值。\n- **流程**：为了期望快速部署，这些团队必须遵循敏捷方法论的开发流程，具有允许更好功能、质量和快速反馈的迭代阶段。这些流程不仅应集成到持续集成的开发工作流中，还应集成到持续交付和部署的部署工作流中。DevOps\
  \ 流程分为几个阶段：\n  - A. 规划和优先级排序功能\n  - B. 开发\n  - C. 持续集成和交付\n  - D. 持续部署\n  - E. 持续监控\n\
  \n  这些阶段在项目整个生命周期中以循环和迭代的方式进行。\n- **工具**：团队使用的工具和产品的选择在 DevOps 中非常重要。确实，当团队分为 Dev\
  \ 和 Ops 时，每个团队使用其特定工具——开发人员使用部署工具，Ops 使用基础设施工具——这进一步扩大了沟通差距。\n\n将开发和运维聚集在一起的团队，以及这种团结文化，所使用的工具必须能够被所有成员使用和利用。\n\
  \n开发人员需要与 Ops 团队使用的监控工具集成，以尽早检测性能问题，并与 Ops 提供的安全工具集成，以保护对各种资源的访问。\n\n另一方面，Ops 必须自动化创建和更新基础设施的过程，并将代码集成到代码管理器中。这称为\
  \ IaC，但这只能在与了解应用程序所需基础设施的开发人员协作下完成。Ops 还必须集成到应用程序发布流程和工具中。\n\n下图说明了 DevOps 文化的三个轴心——Dev\
  \ 和 Ops 之间的协作、流程以及工具的使用：\n\n![](img/d3344b39c888aab0b832625465f837c9_30_0.png)\n\
  \n图 1.1 – DevOps 文化联盟\n\n因此，我们可以回到 Donovan Brown 对 DevOps 文化的定义（http://donovanbrown.com/post/what-is-devops）：\n\
  \n> “DevOps 是人员、流程和产品的结合，以便向最终用户持续交付价值。”\n\n在企业内建立 DevOps 文化的好处如下：\n\n- 团队内更好的协作和沟通，对公司内部产生人文和社会影响\n\
  - 缩短到生产的前置时间，从而带来更好的性能和最终用户满意度\n- 使用 IaC 降低基础设施成本\n- 通过迭代周期显著节省时间，这些周期减少了应用程序错误，自动化工具减少了手动任务，因此团队更专注于开发具有附加业务价值的新功能。\n\
  \n\n\n\n\n\n> 注意\n> 关于 DevOps 文化及其对企业的影响和转型的更多信息，请阅读由 Gene Kim 和 Kevin Behr 编写的《The\
  \ Phoenix Project: A Novel about IT, DevOps, and Helping Your Business Win》，以及由\
  \ Gene Kim、Jez Humble、Patrick Debois 和 John Willis 编写的《The DevOps Handbook: How\
  \ to Create World-Class Agility, Reliability, and Security in Technology Organizations》。\n\
  \n在本节中，我们了解了 DevOps 文化的基本概念。现在，让我们来看看 DevOps 文化的第一种实践：实施 CI/CD 和持续部署。\n\n### 实施\
  \ CI/CD 和持续部署\n\n此前，我们了解到，DevOps 的关键实践之一是持续集成和持续交付的过程，也称为 CI/CD。事实上，在 CI/CD 这些缩写词背后，有三种实践：\n\
  \n- **持续集成 (CI)**\n- **持续交付 (CD)**\n- **持续部署**\n\n这些实践各自对应什么？它们的前提条件和最佳实践是什么？适用于哪些场景？\n\
  让我们详细了解每种实践，从持续集成开始。\n\n### 持续集成 (CI)\n\n在 Martin Fowler 给出的以下定义中，提到了三个关键点——团队成员、集成以及尽可能快速：\n\
  \n> “持续集成是一种软件开发实践，团队成员频繁集成他们的工作……每次集成都通过自动化构建（包括测试）进行验证，以尽可能快速地检测集成错误。”\n\n也就是说，CI\
  \ 是一种自动化过程，允许您在团队成员每次更改时检查应用程序代码的完整性。这种验证必须尽可能快速地完成。\n\n我们可以在 CI 中非常清楚地看到 DevOps\
  \ 文化，其精神是协作和沟通，因为 CI 的执行会影响所有成员的工作方法，从而影响协作；此外，CI 还需要实施流程（分支、提交、拉取请求、代码审查等），并使用针对整个团队进行了调整的工具（Git、Jenkins、Azure\
  \ DevOps 等）进行自动化。最后，CI 必须快速运行，以便尽快收集代码集成的反馈，从而能够更快地向用户交付新功能。\n\n### 实施 CI\n\n因此，要设置\
  \ CI，需要有一个 **源代码管理器 (SCM)** 来集中管理所有成员的代码。这种代码管理器可以是任何类型：Git、SVN 或 **团队基础版本控制 (TFVC)**。同样重要的是，需要有一个支持持续集成的自动化\
  \ **构建管理器 (CI 服务器)**，例如 Jenkins、GitLab CI、TeamCity、Azure Pipelines、GitHub Actions、Travis\
  \ CI 和 Circle CI。\n\n> **注意**\n> 在本书中，我们将使用 Git 作为 SCM，并将更深入地了解其具体用途。\n\n每个团队成员将每天迭代和增量地处理应用程序代码（例如在敏捷和\
  \ Scrum 方法中）。每个任务或功能必须通过使用分支与其他开发工作分开。\n\n定期地，甚至一天多次，成员会存档或提交他们的代码，并且最好使用小提交（主干），以便在出现错误时可以轻松修复。这些代码将集成到应用程序的其余代码中，以及其他成员的其余提交中。\n\
  \n集成所有提交是 CI 过程的起点。\n\n这个由 CI 服务器执行的过程需要自动化，并在每次提交时触发。服务器将检索代码，然后执行以下操作：\n\n- 构建应用程序包——编译、文件转换等\n\
  - 执行单元测试（带代码覆盖率）\n\n> 注意\n> 也可以通过静态代码和漏洞分析来丰富此过程，我们将在第 12 章《使用 SonarQube 进行静态代码分析》中介绍，该章专门用于测试。\n\
  \n必须尽快优化此 CI 过程，以便它能快速运行，并且开发人员可以快速获得关于其代码集成的反馈。例如，已存档但无法编译或测试执行失败的代码可能会影响并阻塞整个团队。\n\
  \n有时，不良实践可能导致 CI 期间测试失败。要禁用此测试的执行，必须认为问题不严重，需要快速交付，或者编译该代码是必不可少的论据。\n\n相反，当测试检测到的错误在生产环境中显现时，这种做法可能会产生严重后果。CI\
  \ 期间节省的时间将用于通过热修复来修复错误并快速重新部署，这可能会导致压力。这与 DevOps 文化背道而驰，因为最终用户的应用程序质量较差，也没有真正的反馈；我们不是在开发新功能，而是花时间修复错误。\n\
  \n通过优化且完整的 CI 过程，开发人员可以快速修复问题并改进代码，或与团队其他成员讨论，然后提交代码进行新的集成。让我们看看下图：\n\n### 持续集成\
  \ (CI) 管道\n\n![](img/d3344b39c888aab0b832625465f837c9_33_0.png)\n\n图 1.2 – 持续集成工作流\n\
  \n此图显示了持续集成的循环步骤。这包括团队成员将代码推送到 SCM，以及 CI 服务器执行构建和测试。此过程的目的是向成员提供快速反馈。\n\n现在我们已经了解了持续集成是什么，让我们来看看持续交付。\n\
  \n### 持续交付 (CD)\n\n持续集成完成后，下一步是将应用程序自动部署到一个或多个非生产环境，这称为 **暂存环境**。此过程称为 **持续交付 (CD)**。\n\
  \nCD 通常从 CI 准备好的应用程序包开始，该包将基于自动化任务列表进行安装。这些任务可以是任何类型：解压缩、停止和重启服务、复制文件、替换配置等。在 CD\
  \ 过程中，还可以执行功能测试和验收测试。\n\n与 CI 不同，CD 旨在测试带有所有依赖项的整个应用程序。这在由多个服务和 API 组成的微服务应用程序中非常明显；CI\
  \ 只会测试正在开发的微服务，而一旦部署到暂存环境中，就可以测试和验证整个应用程序，以及它所包含的 API 和微服务。\n\n在实践中，今天将 CI 与 CD\
  \ 在 _集成_ 环境中关联非常普遍；也就是说，CI 同时在一个环境中部署。这是必要的，以便开发人员不仅可以执行单元测试，还可以在每次提交时验证整个应用程序（UI\
  \ 和功能），以及其他团队成员开发的集成。\n\n重要的是，CI 期间生成的包（也将在 CD 期间部署）必须是安装到所有环境中的同一个包，并且这种情况应一直持续到生产环境。但是，可能会有根据环境不同而不同的配置文件转换，但应用程序代码（二进制文件、DLL、Docker\
  \ 镜像和 JAR）必须保持不变。\n\n代码的这种不可变、不可更改的特性是唯一保证，即在一个环境中验证的应用程序质量与在前一个环境中部署的版本相同，也与将在下一个环境中部署的版本相同。如果需要在其中一个环境中验证后对代码进行更改（改进或错误修复），完成后，这些修改将需要再次经过\
  \ CI 和 CD 循环。\n\n为 CI/CD 设置的工具通常与其他解决方案一起使用，如下所示：\n\n- **包管理器**：这构成了 CI 生成的包和 CD\
  \ 检索的包的存储空间。这些管理器必须支持 feed、版本控制和不同类型的包。市场上有几种，例如 Nexus、ProGet、Artifactory 和 Azure\
  \ Artifacts。\n\n\n\n\n\n### 持续交付（CD）管道\n\n![](img/d3344b39c888aab0b832625465f837c9_35_0.png)\n\
  \n图 1.3 – 持续交付工作流\n\n前面的图表清楚地表明，CD 过程是 CI 过程的延续。它代表了 CD 步骤的链条，这些步骤对于暂存环境是自动的，但对于生产部署是手动的。它还表明，包是由\
  \ CI 生成并存储在包管理器中的，并且在不同环境中部署的是同一个包。\n\n现在我们已经了解了 CD，让我们来看看持续部署实践。\n\n### 持续部署\n\n\
  持续部署是 CD 的扩展，但这一次，它拥有一个从开发人员提交代码到生产环境部署的整个 CI/CD 管道自动化的过程，涵盖所有验证步骤。\n\n这种实践在企业中很少实施，因为它要求应用程序覆盖各种测试（单元测试、功能测试、集成测试、性能测试等）。成功执行这些测试足以验证应用程序在所有这些依赖项方面的功能是否正常。但是，它还允许你在不需要任何批准操作的情况下自动部署到生产环境。\n\
  \n持续部署过程还必须考虑在发生生产问题时恢复应用程序的所有步骤。\n\n持续部署可以通过使用和实现功能开关技术（或功能标志）来实现，这涉及将应用程序的功能封装在功能中，并直接在生产环境中按需激活其功能，而无需重新部署应用程序的代码。\n\
  \n另一种技术是使用蓝绿生产基础设施，它由两个生产环境组成，一个蓝色，一个绿色。首先，我们部署到蓝色环境，然后部署到绿色环境；这将确保不需要停机。\n\n###\
  \ 持续部署管道\n\n![](img/d3344b39c888aab0b832625465f837c9_36_0.png)\n\n图 1.4 – 持续部署工作流\n\
  \n> **注意**\n> 我们将在 _第 15 章，减少部署停机时间_ 中更详细地介绍功能开关和蓝绿部署的用法。\n\n前面的图表与 CD 的图表几乎相同，但区别在于它描绘了端到端的自动化部署。\n\
  \n因此，CI/CD 过程是 DevOps 文化的重要组成部分，CI 允许团队集成和测试其代码的连贯性，并定期获得快速反馈。CD 自动部署到一个或多个暂存环境，从而提供测试整个应用程序直到部署到生产环境的可能性。\n\
  \n最后，持续部署自动化了从提交到生产环境部署应用程序的能力。\n\n> **注意**\n> 我们将学习如何在实践中使用 Jenkins、Azure DevOps\
  \ 和 GitLab CI 实现所有这些过程，内容将在 _第 7 章，持续集成和持续交付_ 中介绍。\n\n在本节中，我们讨论了对 DevOps 文化至关重要的实践，即持续集成、持续交付和持续部署。\n\
  \n在下一节中，我们将探讨另一种称为 IaC 的 DevOps 实践。\n\n### 了解 IaC 实践\n\nIaC 是一种由编写构成基础设施的资源的代码组成的实践。\n\
  \n随着 DevOps 文化的兴起和云基础设施的现代化，这种实践开始发挥作用。确实，手动部署基础设施的运维团队由于处理不一致和出错的风险，交付基础设施变更需要花费时间。此外，随着云及其可扩展性的现代化，构建基础设施的方式需要通过采用更自动化的方法来审查配置和变更实践。\n\
  \nIaC 是编写基础设施组件的配置和配置步骤代码的过程，这有助于以可重复且一致的方式自动化其部署。\n\n在我们探讨 IaC 的使用之前，我们将了解这种实践的好处。\n\
  \n### IaC 的好处\n\nIaC 的好处如下：\n\n- 基础设施配置的标准化降低了出错的风险。\n- 描述基础设施的代码在源代码管理器中进行版本控制。\n\
  - 代码集成到 CI/CD 管道中。\n- 进行基础设施变更的部署更快且更高效。\n- 基础设施的管理、控制更好，成本降低。\n\nIaC 还为 DevOps\
  \ 团队带来好处，使运维团队能够更高效地处理基础设施改进任务，而不是花费时间在手动配置上。它还为开发团队提供了升级基础设施和进行变更的可能性，而无需申请更多运维资源。\n\
  \nIaC 还允许创建自助服务、临时环境，这将使开发人员和测试人员能够更灵活地隔离测试新功能，且不受其他环境的影响。\n\n### IaC 语言和工具\n\n\
  用于编写基础设施配置的语言和工具可以是不同类型的，即 **脚本类型**、**声明式** 和 **编程式**。我们将在以下部分中探讨它们。\n\n#### 脚本类型\n\
  \n这些是 Bash、PowerShell 或其他使用云提供商提供的不同客户端（SDK）的脚本；例如，你可以使用 Azure CLI 或 Azure PowerShell\
  \ 脚本化 Azure 基础设施的配置。\n\n例如，以下是创建 Azure 资源组的命令：\n\n- 使用 Azure CLI（文档可在 `https://bit.ly/2V10fxJ`\
  \ 上查看），我们有以下命令：\n\n```\naz group create --location westeurope --resource-group MyAppResourcegroup\n\
  ```\n\n- 使用 Azure PowerShell（文档可在 https://bit.ly/2VcASeh 上查看），我们有以下命令：\n\n```\n\
  New-AzResourceGroup -Name MyAppResourcegroup -Location westeurope\n```\n\n这些语言和工具的问题是它们需要大量的代码行。这是因为我们需要管理被操作资源的不同状态，并且需要编写创建或更新所需基础设施的所有步骤。\n\
  \n但是，这些语言和工具对于在资源列表上自动化重复操作（选择和查询）的任务，或者需要对基础设施资源执行带有某些逻辑的复杂处理的任务（例如，自动删除带有特定标签的\
  \ VM 的脚本）可能非常有用。\n\n#### 声明式类型\n\n这些是只需以配置和属性的形式编写所需系统或基础设施状态的语言。例如，HashiCorp 的\
  \ Terraform 和 Vagrant、Ansible、Azure ARM 模板、Azure Bicep（https://docs.microsoft.com/en-us/azure/azure-resource-manager/templates/bicep-overview）、PowerShell\
  \ DSC、Puppet 和 Chef 都属于此类。用户只需编写所需基础设施的最终状态，工具将负责应用它。\n\n例如，以下 Terraform 代码允许你定义\
  \ Azure 资源组的所需配置：\n\n```\nresource \"azurerm_resource_group\" \"myrg\" {\n  name\
  \ = \"MyAppResourceGroup\"\n  location = \"West Europe\"\n  tags = {\n    environment\
  \ = \"Bookdemo\"\n  }\n}\n```\n\n在此示例中，如果你想要添加或修改标签，只需修改前面代码中的 `tags` 属性，Terraform\
  \ 将自行执行更新。\n\n\n\n\n\nHere is another example that allows you to install and restart\
  \ nginx on a server using Ansible:\n\n```\n---\n- hosts: all\ntasks:\n- name: install\
  \ and check nginx latest version\napt: name=nginx state=latest\n- name: start nginx\n\
  service:\nname: nginx\nstate: started\n```\n\nTo ensure that the service is not\
  \ installed, just change the preceding code, with `service` as an absent value and\
  \ the `state` property with the `stopped` value:\n\n```\n---\n- hosts: all\ntasks:\n\
  - name: stop nginx\nservice:\nname: nginx\nstate: stopped\n- name: check nginx is\
  \ not installed\napt: name=nginx state=absent\n```\n\nIn this example, it was enough\
  \ to change the `state` property to indicate the desired state of the service.\n\
  \n> Note\n> For details regarding the use of Terraform and Ansible, see _Chapter\
  \ 2, Provisioning Cloud Infrastructure with Terraform_, and _Chapter 3, Using Ansible\
  \ for Configuring IaaS Infrastructure_.\n\n### 程序化类型\n\nFor a few years now, an\
  \ observation has been made that the two types of IaC code, which are of the scripting\
  \ or declarative languages, are destined to be in the **operational** team. This\
  \ does not commonly involve the developers in the IaC.\n\nThis is done to create\
  \ more union between developers and operations so that we see the emergence of IaC\
  \ tools that are based more on languages known by developers, such as TypeScript,\
  \ Java, Python, and C#.\n\nAmong the IaC tools that allow us to provision infrastructure\
  \ using a programming language, we have **Pulumi** (https://www.pulumi.com/) and\
  \ **Terraform CDK** (https://github.com/hashicorp/terraform-cdk).\n\nThe following\
  \ is an example of some _TypeScript_ code written with the Terraform CDK:\n\n```\n\
  import { Construct } from 'constructs';\nimport { App, TerraformStack, TerraformOutput\
  \ } from 'cdktf';\nimport {\n    ResourceGroup,\n} from './.gen/providers/azurerm';\n\
  class AzureRgCDK extends TerraformStack {\n    constructor(scope: Construct, name:\
  \ string) {\n        super(scope, name);\n        new AzurermProvider(this, 'azureFeature',\
  \ {\n            features: [{}]\n        });\n        const rg = new ResourceGroup(this,\
  \ 'cdktf-rg', {\n            name: 'MyAppResourceGroup',\n            location:\
  \ 'West Europe',\n        });\n    }\n}\nconst app = new App();\nnew AzureRgCDK(app,\
  \ 'azure-rg-demo');\napp.synth();\n```\n\nIn this example, which is written in Typescript,\
  \ we are using two-tier libraries: the npm package and a Terraform CDK called cdktf.\
  \ The npm package that’s used to provision Azure resources is called ‘gen/providers/azurerm’.\n\
  \nThen, we declare a new class that initializes the Azure provider and we define\
  \ the creation of the resource group with the `new ResourceGroup` method.\n\nFinally,\
  \ to create the resource group, we instantiate this class and call the `app.synth`\
  \ method of the CDK.\n\n### IaC 拓扑\n\nIn a cloud infrastructure, IaC is divided\
  \ into several typologies:\n\n- Deploying and provisioning the infrastructure\n\
  - Server configuration and templating\n- Containerization\n- Configuration and deployment\
  \ in Kubernetes\n\nLet's deep dive into each topology.\n\n### 部署和预配基础设施\n\nProvisioning\
  \ is the act of instantiating the resources that make up the infrastructure. They\
  \ can be of the **Platform-as-a-Service** (**PaaS**) and serverless resource types,\
  \ such as a web app, Azure function, or Event Hub, but also the entire network part\
  \ that is managed, such as VNet, subnets, routing tables, or Azure Firewall. For\
  \ virtual machine resources, the provisioning step only creates or updates the VM\
  \ cloud resource, but not its content.\n\nThere are different provisioning tools\
  \ we can use for this, such as Terraform, the ARM template, AWS Cloud training,\
  \ the Azure CLI, Azure PowerShell, and also Google Cloud Deployment Manager. Of\
  \ course, there are many more, but it is difficult to mention them all. In this\
  \ book, we will look at, in detail, the use of Terraform to provide an infrastructure.\n\
  \n### 服务器配置\n\nThis step concerns configuring virtual machines, such as the hardening,\
  \ directories, disk mounting, network configuration (firewall, proxy, and so on),\
  \ and middleware installation.\n\n> **Note**\n> For more information about the Terraform\
  \ CDK, I suggest reading the following blog posts and watching the following video:\n\
  > https://www.hashicorp.com/blog/cdk-for-terraform-enabling-python-and-typescript-support\n\
  > https://www.hashicorp.com/blog/announcing-cdk-for-terraform-0-1\n> https://www.youtube.com/watch?v=5hSdb0nadRQ\n\
  \nThere are different configuration tools, such as Ansible, PowerShell DSC, Chef,\
  \ Puppet, and SaltStack. Of course, there are many more, but in this book, we will\
  \ look in detail at the use of Ansible to configure a virtual machine.\n\nTo optimize\
  \ server provisioning and configuration times, it is also possible to create and\
  \ use server models, also called images, that contain all of the configuration (hardening,\
  \ middleware, and so on) of the servers. While provisioning the server, we will\
  \ indicate the template to use. So, in a few minutes, we will have a server that's\
  \ been configured and is ready to be used.\n\nThere are also many IaC tools for\
  \ creating server templates, such as **Aminator** (used by Netflix) and **HashiCorp\
  \ Packer**.\n\nHere is an example of some Packer file code for creating an Ubuntu\
  \ image with package updates:\n\n```\n{\n\"builders\": [{\n\"type\": \"azure-arm\"\
  ,\n\"os_type\": \"Linux\",\n\"image_publisher\": \"Canonical\",\n\"image_offer\"\
  : \"UbuntuServer\",\n\"image_sku\": \"16.04-LTS\",\n\"managed_image_resource_group_name\"\
  : \"demoBook\",\n\"managed_image_name\": \"SampleUbuntuImage\",\n\"location\": \"\
  West Europe\",\n\"vm_size\": \"Standard_DS2_v2\"\n}],\n\"provisioners\": [{\n\"\
  execute_command\": \"chmod +x {{ .Path }}; {{ .Vars }} sudo -E sh '{{ .Path }}'\"\
  ,\n\"inline\": [\n\"apt-get update\",\n\"apt-get upgrade -y\",\n\"/usr/sbin/waagent\
  \ -force -deprovision+user && export HISTSIZE=0 && sync\"\n],\n\"inline_shebang\"\
  : \"/bin/sh -x\",\n\"type\": \"shell\"\n}\n}\n```\n\n```\n}]\n}\n```\n\nThis script\
  \ creates a template image for the `Standard_DS2_V2` virtual machine based on the\
  \ Ubuntu OS (the `builders` section). Additionally, Packer will update all the packages\
  \ during the creation of the image with the `apt-get update` command. Afterward,\
  \ Packer will deprovision the image to delete all user information (the `provisioners`\
  \ section).\n\n> **Note**\n> The Packer part will be discussed in detail in _Chapter\
  \ 4, Optimizing Infrastructure Deployment with Packer_.\n\n### 使用容器的不可变基础设施\n\n\
  Containerization consists of deploying applications in containers instead of deploying\
  \ them in VMs.\n\nToday, it is very clear that the container technology to be used\
  \ is **Docker** and that a Docker image is configured with code in a _Dockerfile_.\
  \ This file contains the declaration of the base image, which represents the operating\
  \ system to be used, additional middleware to be installed on the image, only the\
  \ files and binaries necessary for the application, and the network configuration\
  \ of the ports. Unlike VMs, containers are said to be immutable; the configuration\
  \ of a container cannot be modified during its execution.\n\nHere is a simple example\
  \ of a Dockerfile:\n\n```\nFROM ubuntu\nRUN apt-get update\nRUN apt-get install\
  \ -y nginx\nENTRYPOINT [\"/usr/sbin/nginx\", \"-g\", \"daemon off;\"]\nEXPOSE 80\n\
  ```\n\nIn this Docker image, we are using a basic Ubuntu image, installing `nginx`,\
  \ and exposing port 80.\n\n> **Note**\n> The Docker part will be discussed in detail\
  \ in _Chapter 9, Containerizing Your Application with Docker_.\n\n### Kubernetes\
  \ 中的配置和部署\n\n**Kubernetes** is a container orchestrator – it is the technology that\
  \ most embodies IaC (in my opinion) because of the way it deploys containers, the\
  \ network architecture (load balancer, ports, and so on), and volume management,\
  \ as well as how it protects sensitive information, all of which are described in\
  \ the YAML specification files.\n\nHere is a simple example of a YAML specification\
  \ file:\n\n```\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: nginx-demo\n\
  \  labels:\n    app: nginx\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n\
  \      app: nginx\n  template:\n    metadata:\n      labels:\n        app: nginx\n\
  \    spec:\n      containers:\n        - name: nginx\n          image: nginx:1.7.9\n\
  \          ports:\n            - containerPort: 80\n```\n\nIn the preceding specification\
  \ file, we can see the name of the image to deploy (nginx), the port to open (80),\
  \ and the number of replicas (2).\n\n> **Note**\n> The Kubernetes part will be discussed\
  \ in detail in _Chapter 10, Managing Containers Effectively with Kubernetes_.\n\n\
  \n\n\n\nIaC，如同软件开发一样，要求我们实施能够让基础设施代码演进并便于维护的实践和流程。\n\n其中包括软件开发的实践，如下：\n\n- 有良好的命名原则。\n\
  - 不要用不必要的注释使代码臃肿。\n- 使用小函数。\n- 实现错误处理。\n\n> Note\n> 要了解更多关于良好软件开发实践的内容，请阅读这本优秀的书籍，就我而言，它是该领域的参考之作，即\
  \ Robert Martin 所著的 Clean Code。\n\n然而，还有更具体的实践，我认为值得更多关注：\n\n- **代码中必须自动化一切**：在执行\
  \ IaC 时，有必要对所有配置步骤进行编码和自动化，而不应将手动步骤留在代码之外，因为这会扭曲基础设施的自动化，并可能导致错误。如果有必要，请不要犹豫使用多种工具，例如\
  \ Terraform 和配合 Azure CLI 脚本的 Bash。\n- **代码必须在源代码管理器中**：基础设施代码也必须放在 SCM 中，以便进行版本控制、跟踪、合并和恢复，从而使\
  \ Dev 和 Ops 之间对代码的可见性更好。\n- **基础设施代码必须与应用程序代码在一起**：在某些情况下，这可能比较困难，但如果可能，将基础设施代码放在与应用程序代码相同的仓库中要好得多。这样做是为了确保开发人员和运维人员之间有更好的工作组织，他们将共享同一个工作区。\n\
  - **角色和目录的分离**：根据代码的角色将代码与基础设施分开是很好的。这样可以创建一个用于配置 VM 的目录，以及另一个包含测试完整基础设施集成的代码的目录。\n\
  - **集成到 CI/CD 流程中**：IaC 的目标之一是能够自动化基础设施的部署。因此，从其实施开始，就需要建立一个 CI/CD 流程，该流程将集成代码、测试代码，并在不同环境中部署代码。一些工具，例如\
  \ Terratest，允许你在基础设施代码上编写测试。最佳实践之一是将基础设施的 CI/CD 流程集成到与应用程序相同的管道中。\n- **代码必须是幂等的**：基础设施部署代码的执行必须是幂等的；也就是说，它应该可以随意自动执行。这意味着脚本在运行时必须考虑基础设施的状态，并且如果要创建的资源已经存在，或者要删除的资源已经被删除，则不应生成错误。我们将看到，声明式语言（例如\
  \ Terraform）原生支持这种幂等性。基础设施代码一旦完全自动化，就必须允许构建和销毁应用程序的基础设施。\n- **作为文档使用**：基础设施代码必须清晰，并且能够作为文档。编写基础设施文档需要很长时间，而且在许多情况下，它不会随着基础设施的演进而更新。\n\
  - **代码必须是模块化的**：在基础设施中，组件通常具有相同的代码——唯一的区别是其属性的值。此外，这些组件在公司的应用程序中被多次使用。因此，通过使用模块（或\
  \ Ansible 中的角色）将代码作为函数调用来优化代码编写时间非常重要。使用模块的另一个优势是能够标准化资源命名和某些属性的合规性。\n- **拥有开发环境**：IaC\
  \ 的问题是，很难在用于集成的环境中测试正在开发的基础设施代码，同样也很难测试应用程序，因为更改基础设施可能会产生影响。因此，即使对于 IaC，拥有一个可以随时受到影响甚至被销毁的开发环境也很重要。\n\
  \n对于本地基础设施测试，有些工具模拟本地环境，例如 Vagrant（来自 HashiCorp），因此你应该尽可能使用它们来测试代码脚本。\n\n当然，良好实践的完整列表比这更长；软件工程实践的所有方法和流程也同样适用。\n\
  \n因此，IaC 如同 CI/CD 流程一样，是 **DevOps 文化** 的关键实践，它允许你通过编写代码来部署和配置基础设施。但是，只有使用适当的工具并实施良好实践，IaC\
  \ 才能有效。\n\n在本节中，我们介绍了一些 DevOps 最佳实践的概述。接下来，我们将介绍 DevOps 文化演进的简要概述。\n\n### DevOps\
  \ 文化的演进\n\n随着时间的推移和使用 DevOps 文化所积累的经验，我们可以观察到实践以及融入这一运动的团队的演变。\n\n例如，**GitOps**\
  \ 实践就是这种情况，它正在企业中越来越多地出现。\n\nGitOps 工作流通常应用于 Kubernetes，包括使用 Git 作为唯一的事实来源；也就是说，Git\
  \ 仓库包含基础设施状态的代码，以及要部署的应用程序的代码。\n\n控制器将在代码提交期间监督 Git 源的检索，执行测试，并重新部署应用程序。\n\n> Note\n\
  > 有关 GitOps 文化、实践和工作流的更多详细信息，请阅读 GitOps 发起者的官方指南：`https://www.weave.works/technologies/gitops/`。\n\
  \n### 总结\n\n在本章中，我们了解到 DevOps 文化是协作、流程和工具的故事。然后，我们详细介绍了 CI/CD 流程的不同步骤，并解释了持续集成、持续交付和持续部署之间的区别。最后，最后一部分解释了如何使用\
  \ IaC 及其最佳实践，我们还介绍了 DevOps 文化的演进。\n\n我们了解了 DevOps 文化及其实践的基础，这为本书其余章节定下了基调，我们将在其中讨论如何使用工具和实践来应用这种文化。\n\
  \n在下一章中，我们将首先介绍 *Infrastructure as Code* 的实施，以及如何使用 Terraform 配置基础设施。\n\n### 问题\n\
  \n1. DevOps 是哪些单词的缩写？\n2. DevOps 是一个代表工具名称、文化或社会名称，还是书籍标题的术语吗？\n3. DevOps 文化的三个轴是什么？\n\
  4. 持续集成的目标是什么？\n5. 持续交付和持续部署之间有什么区别？\n6. 什么是 IaC？\n\n### 延伸阅读\n\n如果你想了解更多关于 DevOps\
  \ 文化的信息，以下是一些资源：\n\n- DevOps 资源中心（Microsoft 资源）：https://docs.microsoft.com/en-us/azure/devops/learn/\n\
  - 2020 年 DevOps 现状报告（由 Puppet 提供）：https://puppet.com/resources/report/2020-state-of-devops-report\n"
- "## 2 使用 Terraform 配置云基础设施\n\n在上一章中，我们介绍了 **基础设施即代码（IaC）** 的工具、实践和优势及其对 DevOps 文化的影响。在所有提到的\
  \ IaC 工具中，一个特别流行且强大的工具是 **Terraform**，它是 HashiCorp 工具套件的一部分。\n\n在本章中，我们将探讨使用 Terraform\
  \ 配置云基础设施的基础知识，以 Azure 为例。我们将首先概述其与其他 IaC 工具相比的优势。我们将学习如何以手动模式和自动模式安装它，然后我们将创建第一个\
  \ Terraform 脚本，使用最佳实践并在 **持续集成（CI）/持续部署（CD）** 流程中配置 Azure 基础设施。最后，我们将深入了解为 Terraform\
  \ 状态文件实现远程后端。\n\n\n\n\n\n### 技术要求\n\n本章将解释如何使用 Terraform 预配 Azure 基础架构，以云基础架构为例。因此，您需要一个\
  \ Azure 订阅，可以免费获取，地址为 https://azure.microsoft.com/en-us/free/。\n\n此外，我们还需要一个代码编辑器来编写\
  \ Terraform 代码。市面上有多种编辑器，但我将使用 **Visual Studio Code**。它免费、轻量、跨平台，并拥有多个 Terraform\
  \ 扩展。您可以在 https://code.visualstudio.com/ 下载它。本章的完整源代码可在 https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP02\
  \ 获取。\n\n观看以下视频，查看代码实际运行情况：\nhttps://bit.ly/3p7x63h\n\n### 安装 Terraform\n\nTerraform\
  \ 是一个命令行工具，其基本版本是开源的，使用 **HashiCorp 配置语言 (HCL)**，是声明式的，并且相对易于阅读。其主要优势在于使用同一种语言在众多云提供商（如\
  \ Azure、AWS 和 Google）上进行部署，完整列表可在 https://www.terraform.io/docs/providers/ 查看。\n\
  \nTerraform 还有其他优势：\n\n- 它是跨平台的，可以安装在 Windows、Linux 和 Mac 上。\n- 它允许在实施基础架构更改之前进行预览。\n\
  - 它通过考虑资源依赖关系来允许操作并行化。\n- 它集成了非常多的提供商。\n\nTerraform 可以通过多种方式安装到您的系统上。让我们先来看看手动安装方法。\n\
  \n#### 手动安装\n\n要手动安装 Terraform，请执行以下步骤：\n\n1. 访问官方下载页面 https://www.terraform.io/downloads.html。然后，下载与您的操作系统对应的软件包。\n\
  2. 下载后，解压缩并将二进制文件复制到执行目录（例如，c:\\Terraform 目录中）。\n3. 然后，必须将 PATH 环境变量与二进制目录的路径相结合。有关详细说明，请观看\
  \ https://learn.hashicorp.com/tutorials/terraform/install-cli 上的视频。\n\n现在我们已经了解了如何手动安装\
  \ Terraform，让我们来看看可用于通过脚本安装它的选项。\n\n#### 通过脚本安装\n\n脚本安装可自动化在远程服务器上安装或更新 Terraform，该服务器将负责执行\
  \ Terraform 代码，例如在 Jenkins 从属节点或 Azure Pipelines 代理上。\n\n#### 在 Linux 上通过脚本安装 Terraform\n\
  \n要在 Linux 上安装 Terraform 二进制文件，我们有两种解决方案。第一种解决方案是使用以下脚本安装 Terraform：\n\n```\nTERRAFORM_VERSION=\"\
  1.0.0\" #Update with your desired version\ncurl -Os https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip\
  \ \\\n&& curl -Os https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_SHA256SUMS\
  \ \\\n&& curl https://keybase.io/hashicorp/pgp_keys.asc | gpg --import \\\n&& curl\
  \ -Os https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_SHA256SUMS.sig\
  \ \\\n&& gpg --verify terraform_${TERRAFORM_VERSION}_SHA256SUMS.sig \\\nterraform_${TERRAFORM_VERSION}_SHA256SUMS\
  \ \\\n&& shasum -a 256 -c terraform_${TERRAFORM_VERSION}_SHA256SUMS \\\n2>&1 | grep\
  \ \"${TERRAFORM_VERSION}_linux_amd64.zip:\\sOK\" \\\n&& unzip -o terraform_${TERRAFORM_VERSION}_linux_amd64.zip\
  \ -d /usr/local/bin\n```\n\n此脚本执行以下操作：\n\n- 它将 `TERRAFORM_VERSION` 参数设置为要下载的版本。\n\
  - 它通过检查校验和下载 Terraform 软件包。\n- 它将软件包解压缩到用户的本地目录中。\n\n> 重要说明\n> 此脚本也可在本书的 GitHub\
  \ 源代码中找到，地址为 https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP02/Terraform_install_Linux.sh。\n\
  \n要执行此脚本，请执行以下步骤：\n\n1. 打开命令行终端。\n2. 复制并粘贴前面的脚本。\n3. 在命令行终端中按 `Enter` 键执行它。\n\n\
  以下屏幕截图显示了在 Linux 上安装 Terraform 的脚本执行情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_55_0.png)\n\
  \n图 2.1 – Linux 上的 Terraform 安装脚本\n\n在执行前面的脚本时，我们可以看到 Terraform ZIP 软件包的下载（使用 curl\
  \ 工具）以及该软件包在 /usr/local/bin 文件夹内的解压缩操作。\n\n此解决方案的好处是，我们可以选择 Terraform 安装文件夹，并且它适用于各种\
  \ Linux 发行版。这是因为它使用常见工具，包括 curl 和 unzip。\n\n在 Linux 上安装 Terraform 的第二种解决方案是使用 apt\
  \ 包管理器。您可以对 Ubuntu 发行版使用以下脚本：\n\n```\nsudo apt-get update && sudo apt-get install\
  \ -y gnupg software-properties-common curl \\\n&& curl -fsSL https://apt.releases.hashicorp.com/gpg\
  \ | sudo apt-key add - \\\n&& sudo apt-add-repository \"deb [arch=amd64] https://apt.releases.hashicorp.com\
  \ $(lsb_release -cs) main\" \\\n&& sudo apt-get update && sudo apt-get install terraform\n\
  ```\n\n此脚本执行以下操作：\n\n- 它添加 apt HashiCorp 存储库。\n- 它更新本地存储库。\n- 它下载 Terraform CLI。\n\
  \n> 重要说明\n> 有关此脚本以及在其他发行版上安装 Terraform 的更多详细信息，请参阅 https://learn.hashicorp.com/tutorials/terraform/install-cli\
  \ 上的文档，并导航到 Linux 选项卡。\n\n此解决方案的好处是，您可以使用 Linux 包管理，它可以集成到流行的配置工具中（例如 Ansible、Puppet\
  \ 或 Docker）。\n\n我们刚刚讨论了在 Linux 上安装 Terraform。现在，让我们来看看它在 Windows 上的安装。\n\n#### 在\
  \ Windows 上通过脚本安装 Terraform\n\n如果我们使用 Windows，可以使用 **Chocolatey**，它是一个免费的公共包管理器，类似于\
  \ **NuGet** 或 **npm**，但专门用于软件。它广泛用于 Windows 服务器甚至本地计算机上的软件自动化。\n\n> 重要说明\n> Chocolatey\
  \ 官方网站可在 https://chocolatey.org/ 找到，其安装文档可在 https://chocolatey.org/install 找到。\n\
  \n安装 Chocolatey 后，我们只需在 PowerShell 或 CMD 工具中运行以下命令：\n\n```\nchoco install terraform\
  \ -y\n```\n\n以下是使用 Chocolatey 在 Windows 上安装 Terraform 的屏幕截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_56_0.png)\n\
  \n图 2.2 – Windows 上的 Terraform 安装\n\n执行 `choco install terraform` 命令将从 Chocolatey\
  \ 安装最新版本的 Terraform。\n\n安装后，我们可以通过运行以下命令检查 Terraform 版本：\n\n```\nterraform version\n\
  ```\n\n此命令显示已安装的 Terraform 版本。\n\n我们还可以通过运行以下命令查看 Terraform 提供的不同命令：\n\n```\nterraform\
  \ --help\n```\n\n以下屏幕截图列出了不同命令及其功能：\n\n![](img/d3344b39c888aab0b832625465f837c9_57_0.png)\n\
  \n图 2.3 – Terraform 的可用命令\n\n现在，让我们来看看在 macOS 上安装 Terraform。\n\n#### 在 macOS 上通过脚本安装\
  \ Terraform\n\n在 macOS 上，我们可以使用 **Homebrew**（macOS 包管理器，`https://brew.sh/`），通过在终端中执行以下命令来安装\
  \ Terraform：\n\n```\nbrew install terraform\n```\n\n通过脚本安装 Terraform 的内容到此结束。让我们来看看另一种解决方案，它使用\
  \ Terraform 在 Azure 上部署，而无需安装它——**Azure Cloud Shell**。\n\n### 将 Terraform 与 Azure\
  \ Cloud Shell 集成\n\n如果我们使用 Terraform 在 Azure 上部署基础架构，还应该知道 Azure 团队已将 Terraform\
  \ 集成到 Azure Cloud Shell 中。\n\n> **重要说明**\n> 要了解有关 Azure Cloud Shell 的更多信息，请参阅其文档\
  \ `https://azure.microsoft.com/en-us/features/cloud-shell/`。\n\n要从 Azure Cloud Shell\
  \ 使用它，请执行以下步骤：\n\n1. 通过打开 `https://portal.azure.com` 连接到 Azure 门户，并使用您的 Azure 帐户登录：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_58_0.png)\n\n图 2.4 – Azure 登录页面\n\n\n\
  \n\n\n2. 打开 Cloud Shell 并选择所需模式，即 Bash 或 PowerShell。\n\n3. 然后，我们可以在 shell 中运行 Terraform\
  \ 命令行。\n\n以下是在 Azure Cloud Shell 中执行 Terraform 的截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_59_0.png)\n\
  \n图 2.5 – Azure Cloud Shell\n\n使用此解决方案的优点是我们不需要安装任何软件；只需将 Terraform 文件上传到 Cloud\
  \ Shell 并在 Cloud Shell 中运行即可。此外，我们已经连接到 Azure，因此无需配置（请参阅 *Configuring Terraform\
  \ for Azure* 部分）。\n\n但是，此解决方案仅用于开发模式，不适用于本地或自动化的 Terraform 使用。因此，在本章中，我们将讨论 Azure\
  \ 的 Terraform 配置。\n\n既然我们已安装 Terraform，现在可以开始在本地使用它来预配 Azure 基础设施。我们将从第一步开始，即配置\
  \ Azure 的 Terraform。\n\n### 为 Azure 配置 Terraform\n\n在编写用于预配 Azure 等云基础设施的 Terraform\
  \ 代码之前，我们必须配置 Terraform 以允许操作 Azure 订阅中的资源。\n\n为此，首先，我们将在 Azure Active **Directory\
  \ (AD)** 中创建一个新的 Azure **Service Principal (SP)**，在 Azure 中，这是一个具有管理 Azure 资源权限的\
  \ _应用程序用户_。\n\n> **Important Note**\n> 有关 Azure SP 的更多详细信息，请阅读 https://docs.microsoft.com/en-us/azure/active-directory/develop/app-objects-and-service-principals\
  \ 上的文档。\n\n对于此 Azure SP，我们必须为其分配将在其中创建资源的订阅上的参与者权限。\n\n### 创建 Azure 服务主体\n\n此操作可以通过\
  \ Azure 门户（所有步骤均在 https://docs.microsoft.com/en-us/azure/active-directory/develop/howto-create-service-principal-portal\
  \ 的官方文档中详细说明）或通过执行以下 `az cli` 命令的脚本来完成（我们可以在 Azure Cloud Shell 中启动它）。\n\n以下是您必须运行以创建\
  \ SP 的模板 `az cli` 脚本。在此，您需要输入 SP 名称、角色和范围：\n\n```bash\naz ad sp create-for-rbac\
  \ --name=\"<ServicePrincipal name>\"\n--role=\"Contributor\" --scopes=\"/subscriptions/<subscription\
  \ Id>\"\n```\n\n请参阅以下示例：\n\n```bash\naz ad sp create-for-rbac --name=\"SPForTerraform\"\
  \n--role=\"Contributor\" --scopes=\"/subscriptions/8921-1444-...\"\n```\n\n此示例脚本创建一个名为\
  \ `SPForTerraform` 的新 SP，并授予其对订阅 ID（即 `8921....`）的参与者权限。\n\n### 重要提示\n\n有关创建 Azure\
  \ SP 的 Azure CLI 命令的更多详细信息，请参阅 https://docs.microsoft.com/en-us/cli/azure/create-an-azure-service-principal-azure-cli?view=azure-cli-latest\
  \ 上的文档。\n\n以下截图显示了创建 Azure SP 的脚本执行情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_61_0.png)\n\
  \n### Figure 2.6 – Creating an Azure SP\n\n创建此 Azure SP 会返回三段身份识别信息：\n\n- 应用程序 ID，也称为客户端\
  \ ID\n- 客户端密钥\n- 租户 ID\n\nSP 在 Azure AD 中创建。以下截图显示了 Azure AD SP：\n\n![](img/d3344b39c888aab0b832625465f837c9_61_1.png)\n\
  \n### Figure 2.7 – The App registrations list in the Azure portal\n\n在此，我们刚刚了解如何在\
  \ Azure AD 中创建 SP，并已授予其操作我们 Azure 订阅资源的权限。\n\n现在，让我们学习如何配置 Terraform 以使用我们的 Azure\
  \ SP。\n\n### Configuring the Terraform provider\n\n创建 Azure SP 后，我们将配置 Terraform\
  \ 配置以使用此 SP 连接到 Azure。为此，请执行以下步骤：\n\n1. 在任意目录中，创建一个新文件名 `provider.tf`（扩展名 `.tf`\
  \ 的文件对应于 Terraform 文件），其中包含以下代码：\n\n```hcl\nprovider \"azurerm\" {\n  features {}\n\
  \  subscription_id = \"<subscription ID>\"\n  client_id = \"<Client ID>\"\n  client_secret\
  \ = \"<Client Secret>\"\n  tenant_id = \"<Tenant Id>\"\n}\n```\n\n在上述代码中，我们指示使用的提供程序是\
  \ `azurerm`。连接到 Azure 的身份验证信息是已创建的 SP，我们添加了新块 **features**，它提供了可以自定义 Azure 提供程序资源行为的可能性。\n\
  \n但是，出于安全考虑，不建议将身份识别信息以纯文本形式放在配置中，尤其是如果您知道此代码可能被其他人访问。\n\n2. 因此，我们将通过将其替换为以下代码来改进上述代码：\n\
  \n```hcl\nprovider \"azurerm\" {\n  features {}\n}\n```\n\n3. 因此，我们从 Terraform 配置中删除凭据，并将身份识别值传递给特定的\
  \ Terraform 环境变量：\n\n- `ARM_SUBSCRIPTION_ID`\n- `ARM_CLIENT_ID`\n- `ARM_CLIENT_SECRET`\n\
  - `ARM_TENANT_ID`\n\n> **Important Note**\n> 有关 azurerm 提供程序的更多信息，请参阅 https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs\
  \ 上的文档。我们将在本章稍后的 Running Terraform form deployment 部分学习如何设置这些环境变量。\n\n因此，Terraform\
  \ 代码不再包含任何身份识别信息。\n\n我们刚刚了解如何为 Azure 身份验证配置 Terraform。现在，我们将解释如何快速配置 Terraform 以进行本地开发和测试。\n\
  \n### 用于本地开发和测试的 Terraform 配置\n\n在本地工作并希望快速测试 Terraform 代码时（例如，在沙箱环境中），使用您自己的 Azure\
  \ 帐户而不是使用 SP 可能更方便且更快。\n\n为此，可以使用 az login 命令预先连接到 Azure。然后，在打开的窗口中输入您的身份识别信息。\n\
  \n以下是 Azure 登录窗口的截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_63_0.png)\n\nFigure\
  \ 2.8 – The Azure Sign in page with Azure login\n\n如果访问多个订阅，可以使用以下命令选择所需的订阅：\n\n\
  ```bash\naz account set --subscription=\"<Subscription ID>\"\n```\n\n然后，我们像以前一样使用\
  \ `provider`, \"azurerm\" `{ }` 配置 Terraform 提供程序。当然，在远程服务器上执行时不应使用此身份验证方法。\n\n\
  > Important Note\n> 有关提供程序配置的更多信息，请参阅 https://www.terraform.io/docs/providers/azurerm/index.html\
  \ 上的文档。\n\n因此，Azure 的 Terraform 配置由使用来自 Azure SP 的信息的提供程序配置定义。\n\n完成此配置后，我们可以开始编写\
  \ Terraform 配置来管理和预配 Azure 资源。\n\n### 编写 Terraform 脚本以部署 Azure 基础设施\n\n为了说明使用 Terraform\
  \ 在 Azure 中部署资源，我们将提供一个由 Terraform 组成的简单 Azure 架构，该架构由以下组件组成：\n\n- 有一个 Azure 资源组。\n\
  - 还有一个由虚拟网络和子网组成的网络配置。\n- 在此子网中，我们将创建一个具有公共 IP 地址的虚拟机，以便公开可用。\n\n为此，在我们之前创建 `provider.tf`\
  \ 文件的同一目录中，我们将创建一个带有以下代码的 `main.tf` 文件：\n\n1. 让我们从提供 `resource` 组的代码开始：\n\n```hcl\n\
  resource \"azurerm_resource_group\" \"rg\" {\n  name = \"bookRg\"\n  location =\
  \ \"West Europe\"\n}\n```\n\n\n\n\n\n\n### 任何一段 Terraform 代码都由相同的语法模型组成\n\n任何一段\
  \ Terraform 代码都由相同的语法模型组成，Terraform 对象的语法由四个部分组成：\n\n- `resource` 或 `data` 块的类型\n\
  - 要管理的资源名称（例如，`azurerm_resource_group`）\n- 内部 Terraform ID（例如，`rg`）\n- 对应于资源实际属性的属性列表（即，`name`\
  \ 和 `location`）\n\n> Important Note\n> 有关 Terraform 语法的更多文档可在 https://www.terraform.io/docs/configuration-0-11/resources.html\
  \ 上找到。\n\n此代码使用 `azurerm_resource_group` Terraform 资源，将预配一个名为 `bookRg`、存储在 West\
  \ Europe 位置的资源组。\n\n2. 然后，我们将编写网络部分的代码：\n\n```hcl\nresource \"azurerm_virtual_network\"\
  \ \"vnet\" {\n    name = \"book-vnet\"\n    location = \"West Europe\"\n    address_space\
  \ = [\"10.0.0.0/16\"]\n    resource_group_name = azurerm_resource_group.rg.name\n\
  }\n\nresource \"azurerm_subnet\" \"subnet\" {\n    name = \"book-subnet\"\n    virtual_network_name\
  \ = azurerm_virtual_network.vnet.name\n    resource_group_name = azurerm_resource_group.rg.name\n\
  \    address_prefix = \"10.0.10.0/24\"\n}\n```\n\n在这段用于网络部分的 Terraform 代码中，我们创建了一个名为\
  \ book-vnet 的 VNet 的代码，并在其中创建了一个名为 book-subnet 的子网。\n\n如果我们仔细查看这段代码，可以看到，对于资源之间的依赖关系，我们没有使用明确的\
  \ ID，而是使用对 Terraform 资源的指针。\n\nVNet 和子网是资源组的属性，使用 `${azurerm_resource_group.rg.name}`，这告诉\
  \ Terraform VNet 和子网将在资源组之后创建。至于子网，它通过使用 `${azurerm_virtual_network.vnet.name}`\
  \ 值依赖于其 VNet；这是显式依赖概念。\n\n现在，让我们编写虚拟机的 Terraform 预配代码，它由以下内容组成：\n\n- 一个网络接口\n- 一个公共\
  \ IP 地址\n- 一个用于诊断启动（启动信息日志）的 Azure 存储对象\n- 一个虚拟机\n\n带有 IP 配置的 **网络接口** 的示例代码如下：\n\
  \n```hcl\nresource \"azurerm_network_interface\" \"nic\" {\n  name = \"book-nic\"\
  \n  location = \"West Europe\"\n  resource_group_name = azurerm_resource_group.rg.name\n\
  \  ip_configuration {\n    name = \"bookipconfig\"\n    subnet_id = azurerm_subnet.subnet.id\n\
  \    private_ip_address_allocation = \"Dynamic\"\n    public_ip_address_id = azurerm_public_ip.pip.id\n\
  \  }\n}\n```\n\n在这段 Terraform 代码中，我们使用了一个 azurerm_network_interface 块（https://www.terraform.io/docs/providers/azurerm/r/network_interface.html）。在其中，我们配置了网络接口的名称、区域、资源组和带有动态\
  \ IP 地址的 IP 配置。\n\n公共 IP 地址的代码，该 IP 地址位于我们刚刚创建的子网中，如下所示：\n\n```hcl\nresource \"\
  azurerm_public_ip\" \"pip\" {\n  name = \"book-ip\"\n  location = \"West Europe\"\
  \n  resource_group_name = \"${azurerm_resource_group.rg.name}\"\n  public_ip_address_allocation\
  \ = \"Dynamic\"\n  domain_name_label = \"bookdevops\"\n}\n```\n\n在这段 Terraform 代码中，我们在\
  \ https://www.terraform.io/docs/providers/azurerm/r/public_ip.html 上使用了一个 azurerm_public_ip\
  \ 块。在其中，我们配置了 IP 地址的动态分配和 DNS 标签。\n\n存储帐户的代码，我们用于启动诊断日志，如下所示：\n\n```hcl\nresource\
  \ \"azurerm_storage_account\" \"stor\" {\n  name = \"bookstor\"\n  location = \"\
  West Europe\"\n  resource_group_name = azurerm_resource_group.rg.name\n  account_tier\
  \ = \"Standard\"\n  account_replication_type = \"LRS\"\n}\n```\n\n在这段 Terraform\
  \ 代码中，我们在 https://docs.microsoft.com/en-us/azure/storage/common/storage-account-overview\
  \ 上使用了一个 azurerm_storage_account 块。在其中，我们配置了名称、区域、资源组和存储类型，在我们的情况中，是 Standard LRS。\n\
  \n> Important Note\n> 存储帐户的文档可在 https://docs.microsoft.com/en-us/azure/storage/common/storage-account-overview\
  \ 上找到。\n\n以及包含先前创建的网络接口 ID 的 Ubuntu 虚拟机的代码，如下所示：\n\n```hcl\nresource \"azurerm_linux_virtual_machine\"\
  \ \"vm\" {\n  name = \"bookvm\"\n  location = \"West Europe\"\n  resource_group_name\
  \ = azurerm_resource_group.rg.name\n  vm_size = \"Standard_DS1_v2\"\n  network_interface_ids\
  \ = [\"${azurerm_network_interface.nic.id}\"]\n  storage_image_reference {\n   \
  \ publisher = \"Canonical\"\n    offer = \"UbuntuServer\"\n    sku = \"16.04-LTS\"\
  \n    version = \"latest\"\n  }\n  ...\n}\n```\n\n在这段 Terraform 代码中，我们在 https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/linux_virtual_machine\
  \ 上使用了一个 azurerm_linux_virtual_machine 块。在其中，我们配置了名称、大小（Standard_DS1_V2）、对 network_interface\
  \ Terraform 对象的引用以及虚拟机操作系统的类型（Ubuntu）。\n\n所有这些代码部分都与之前的部分完全相同，使用显式依赖来指定资源之间的关系。\n\
  \n> Important Note\n> 此完整源代码可在 https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP02/terraform_simple_script\
  \ 上找到。\n\n我们刚刚创建了一个完整的 Terraform 脚本，允许我们预配一个小型 Azure 基础设施。但是，与任何语言一样，关于文件分离、应用清晰可读的代码以及最后使用内置函数，都有良好的实践。\n\
  \n### 遵循一些 Terraform 良好实践\n\n我们刚刚查看了用于预配 Azure 基础设施的 Terraform 代码示例，但查看编写 Terraform\
  \ 代码的一些良好实践也是有用的。\n\n#### 通过文件分离获得更好的可见性\n\n执行 Terraform 代码时，`execution` 目录中所有带有\
  \ `.tf` 扩展名的配置文件都会自动执行；在我们的示例中，我们有 `provider.tf` 和 `main.tf`。将代码分离到多个文件中是很好的，以便提高代码的可读性和可演进性。\n\
  \n使用我们的示例脚本，我们可以通过以下方式将其分离来做得更好：\n\n- `Rg.tf`：包含资源组的代码。\n- `Network.tf`：包含 VNet\
  \ 和子网的代码。\n- `Compute.tf`：包含网络接口、公共 IP、存储和虚拟机的代码。\n\n> Important Note\n> 带有单独文件的完整代码可在\
  \ `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP02/terraform_separate_files`\
  \ 上找到。\n\n#### 敏感数据的保护\n\n必须小心 Terraform 配置中的敏感数据，例如密码和访问权限。我们已经了解到，对于对 Azure 的访问身份验证，没有必要将它们留在代码中。此外，在我们关于虚拟机管理员帐户的示例中，请注意虚拟机管理员帐户的密码已在此\
  \ Terraform 配置中明确指定。为了解决这个问题，我们可以使用强大的密钥管理器来存储密码，例如 Azure Key Vault 或 HashiCorp\
  \ Vault，并通过 Terraform 获取它们。\n\n### 使用变量和插值函数动态化配置\n\n编写 Terraform 配置时，重要的是从一开始就考虑到，托管应用程序的基础设施通常对所有阶段都是相同的。但是，只有某些信息会因阶段而异，例如资源名称和实例数量。\n\
  \n为了给代码提供更多灵活性，我们必须在代码中使用变量，步骤如下：\n\n1. 通过在全局 Terraform 代码中添加以下示例代码来声明变量。或者，我们可以将其添加到另一个文件（例如\
  \ `variables.tf`）中，以便更好地阅读代码：\n\n```hcl\nvariable \"resource_group_name\" {\n  \
  \  description =\"Name of the resource group\"\n}\nvariable \"location\" {\n   \
  \ description =\"Location of the resource\"\n    default =\"West Europe\"\n}\nvariable\
  \ \"application_name\" {\n    description =\"Name of the application\"\n}\n```\n\
  \n2. 在另一个名为 `terraform.tfvars` 的 `.tfvars` 文件中，使用 `variable_name=value` 语法实例化它们的值，类似于以下内容：\n\
  \n```hcl\nresource_group_name =\"bookRg\"\napplication_name =\"book\"\n```\n\n3.\
  \ 在代码中使用这些变量，使用 `var.<name of the variable>`；例如，在资源组 Terraform 代码中，我们可以编写以下内容：\n\
  \n```hcl\nresource \"azurerm_resource_group\" \"rg\" {\n    name = var.resource_group_name\n\
  \    location = var.location\n    tags {\n        environment = \"Terraform Azure\"\
  \n    }\n}\n```\n\n\n\n\n\n除此之外，Terraform 拥有一大套内置函数，可用于操作数据或变量。要了解这些函数的更多信息，请参阅官方文档\
  \ `https://www.terraform.io/docs/configuration/functions.html`。\n\n当然，还有许多其他良好实践，但这些实践应从第一行代码开始应用，以确保您的代码得到良好维护。\n\
  \n> **重要提示**\n> \n> 本示例的完整最终代码可在 `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP02/terraform_vars_interp`\
  \ 获取。\n\n我们已编写了一个 Terraform 配置，采用最佳实践，允许我们在 Azure 中创建一个提供网络和虚拟机的简单云基础设施。现在，让我们来看看如何使用我们的代码运行\
  \ Terraform 来预配此基础设施。\n\n### 运行 Terraform 进行部署\n\n编写好 Terraform 配置后，我们现在需要运行 Terraform\
  \ 来部署基础设施。\n\n但是，在任何执行之前，首先需要使用 Azure SP 进行身份验证，以确保 Terraform 可以管理 Azure 资源。\n\n\
  为此，我们可以设置特定于 Terraform 的环境变量以包含在 _Configuring Terraform for Azure_ 部分中先前创建的 SP 的信息，也可以使用\
  \ `az cli` 脚本。\n\n以下脚本在 Linux 操作系统中导出四个 Terraform 环境变量：\n\n```\nexport ARM_SUBSCRIPTION_ID=xxxxx-xxxxx-xxxxx-xxxx\n\
  export ARM_CLIENT_ID=xxxxx-xxxxx-xxxxx-xxxx\nexport ARM_CLIENT_SECRET=xxxxxxxxxxxxxxxxxxxx\n\
  export ARM_TENANT_ID=xxxxx-xxxxx-xxxxx-xxxx\n```\n\n此外，我们可以使用带有登录命令的 az cli 脚本：\n\
  \n```\naz login\n```\n\n身份验证完成后，我们可以运行 Terraform 工作流。\n\n在我们的场景中，我们从一个没有任何 Azure\
  \ 资源组的空 Azure 订阅开始；然而，在现实世界中，我们的订阅可能已经包含一个资源组。\n\n在运行 Terraform 之前，在 Azure 门户中，检查您的订阅中是否没有资源组，如下所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_72_0.png)\n\n图 2.9 – Azure 上没有资源组\n\n\
  要运行 Terraform，我们需要打开一个命令行终端，例如 CMD、PowerShell 或 Bash，并导航到我们之前编写的 Terraform 配置文件所在的目录。\n\
  \nTerraform 配置的执行分为几个步骤，包括初始化、更改预览和应用这些更改。\n\n接下来，让我们详细了解这些步骤的执行过程，从初始化步骤开始。\n\n\
  ### 初始化\n\n初始化步骤允许 Terraform 执行以下操作：\n\n- 初始化 Terraform 上下文以检查并建立 Terraform 提供程序与远程服务之间的连接——在我们的案例中，这是与\
  \ Azure 的连接。\n- 下载提供程序的插件——在我们的案例中，将是 azurerm 提供程序。\n- 检查代码变量。\n\n要执行初始化，请运行 init\
  \ 命令：\n\n```\nterraform init\n```\n\n以下是 terraform init 的截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_73_0.png)\n\
  \n图 2.10 – 执行 terraform init 命令\n\n如前面命令执行过程中所了解到的，Terraform 执行以下操作：\n\n- 它下载 `azurerm`\
  \ 插件的最新版本。\n- 它创建一个工作 `.terraform` 目录。\n\n以下是 `.terraform` 目录的截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_74_0.png)\n\
  \n图 2.11 – Terraform 配置目录\n\n> **重要提示**\n> 有关 `init` 命令行的更多信息，请参阅 `https://www.terraform.io/docs/commands/init.html`\
  \ 中的文档。\n\n一旦初始化步骤完成，我们可以进入下一步，即预览更改。\n\n### 预览更改\n\n下一步是在应用更改之前预览对基础设施所做的更改。为此，请使用\
  \ `plan` 命令运行 Terraform。执行时，plan 会自动使用 `terraform.tfvars` 文件来设置变量。要执行它，请启动 `plan`\
  \ 命令：\n\n```\nterraform plan\n```\n\n以下输出显示了 terraform plan 命令的执行：\n\n```\nRefreshing\
  \ Terraform state in-memory prior to plan...\nThe refreshed state will be used to\
