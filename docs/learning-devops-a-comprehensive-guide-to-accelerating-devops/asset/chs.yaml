  \n图 6.18 – 使用 Chocolatey 安装 Git\n\n要在 **Linux** 机器上安装 Git，对于 Ubuntu 等 Debian 系统，我们按如下方式运行\
  \ `apt-get` 命令：\n\n```\napt-get install git\n```\n\n或者，对于 **CentOS** 或 **Fedora**，使用\
