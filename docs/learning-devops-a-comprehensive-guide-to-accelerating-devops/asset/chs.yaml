  \n### 创建 CI 管道\n\n我们将按照以下步骤在 Azure Pipelines 中创建 CI 管道：\n\n1. 要创建此管道，请打开 **管道 |\
  \ 构建** 菜单，如下面的屏幕截图所示。然后，单击 **新建管道** 按钮：\n\n![](img/d3344b39c888aab0b832625465f837c9_236_0.png)\n\
  \n图 7.22 – Azure Pipelines：创建构建\n\n2. 对于配置模式，我们选择 **使用经典编辑器** 选项，如下面的屏幕截图所示：\n\n\
