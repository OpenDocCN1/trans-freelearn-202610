  Git 安装完成，我们现在将继续进行其配置。\n\n### Git 配置\n\nGit 配置要求我们配置用户名和电子邮件，这些信息将在代码提交时使用。要执行此配置，我们在终端中执行以下命令——无论是原生的\
  \ **操作系统 (OS)** 终端，还是 Windows 上的 Git Bash：\n\n```\ngit config --global user.name\
  \ \"<your username>\"\ngit config --global user.email \"<your email>\"\n```\n\n\
  然后，我们可以通过执行以下命令检查配置值：\n\n```\ngit config --global --list\n```\n\n请参阅以下屏幕截图：\n\n\
  ![](img/d3344b39c888aab0b832625465f837c9_190_0.png)\n\n图 6.19 – Git 配置\n\nGit 现已配置完毕并可供使用，但在使用之前，我们将对其术语进行概述。\n\
  \n### 有用的 Git 术语\n\nGit 是一个对象和术语非常丰富且拥有自己概念的工具。在使用之前，了解其工件及其组成术语非常重要。以下是该术语的简要列表：\n\
  \n- **Repository**：仓库是 Git 的基本元素；它是跟踪和版本化源代码的存储空间。有 **远程仓库** 集中托管团队代码并允许团队协作。还有\
  \ **本地仓库**，它是本地机器上远程仓库的副本。\n\n- **Clone**：克隆是制作远程仓库本地副本的操作。\n\n- **Commit**：提交是对一个或多个文件所做的更改，该更改保存到本地仓库。每个提交都是唯一的，并由一个称为\
  \ SHA-1 的唯一编号标识，通过该编号可以跟踪代码更改。\n\n- **Branch**：仓库中的代码默认存储在 `master` 分支中。分支可以创建其他分支，这些分支将是\
  \ master 的副本，开发者在其中进行更改，从而允许我们隔离工作而不影响 master 分支。随时可以将一个分支合并到另一个分支。\n\n- **Merge**：这是一个操作，用于将一个分支的代码与另一个分支合并。\n\
  \n- **Checkout**：这是一个操作，允许我们从一个分支切换到另一个分支。\n\n- **Fetch**：这是一个操作，用于从远程仓库检索代码，而不将其与本地仓库合并。\n\
  \n- **Pull**：这是一个操作，用于从远程仓库更新本地仓库。拉取相当于获取和合并操作。\n\n- **Push**：推送是拉取的反向操作——它允许我们从本地仓库更新远程仓库。\n\
  \n- **Pull request (PR)**：PR 是 Git 的一项功能（由 GitHub 发起），它提供 **图形用户界面 (GUI)** 客户端或\
  \ Web 界面，用于在团队用户之间讨论拟议的更改，然后再将其集成到主分支。如果您想了解有关 PR 的更多信息，请阅读 GitHub 文档：`https://docs.github.com/en/github/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests`。\n\
  \n这些是使用 Git 及其工作流程时需要知道的概念。当然，此列表并不详尽，还有其他重要的术语和概念；我们可以在多个网站上找到相关信息。以下是一个简短列表：\n\
  \n- **GitHub 词汇表**：`https://help.github.com/en/articles/github-glossary`\n- **Atlassian\
  \ 词汇表**：`https://www.atlassian.com/git/glossary/terminology`\n- **Linux Academy**：`https://linuxacademy.com/blog/linux/git-terms-explained/`\n\
  \n在解释了这些概念后，我们现在可以了解如何使用 Git 命令行。\n\n### Git 命令行\n\n在迄今为止所了解的所有 Git 内容基础上，我们现在可以开始操作它。最好的方法是先学习如何在命令行上使用\
  \ Git；然后，一旦掌握了流程，我们就可以更好地使用图形化工具。\n\n以下是主要 Git 命令行的介绍，这些命令现在已成为（或应该成为）开发者日常工作的一部分。我们将在下一节\
  \ _Understanding the Git process and Gitflow pattern_ 中了解它们在实践中的应用。\n\n第一个命令是允许我们从远程仓库检索代码的命令。\n\
  \n#### 检索远程仓库\n\n需要知道的第一个命令行是 `clone` 命令，它会复制远程仓库以创建本地仓库。要执行的命令如下所示：\n\n```\ngit\
  \ clone <url of the remote repository>\n```\n\n唯一的必需参数是仓库 **Uniform Resource Locator\
  \ (URL)**（任何仓库都可以通过唯一 URL 标识）。执行此命令后，远程仓库的内容将下载到本地机器，本地仓库会自动创建并配置。\n\n#### 初始化本地仓库\n\
  \n请注意，`init` 是允许创建本地仓库的 Git 命令。要在将包含本地仓库的目录中执行此操作，请运行以下简单命令：\n\n```\ngit init\n\
  ```\n\n此命令创建一个 `.git` 目录，该目录包含本地仓库的所有文件夹和配置文件。\n\n#### 配置本地仓库\n\n执行 `init` 命令后，必须通过设置链接的远程仓库来配置新的本地仓库。要进行此设置，我们将使用以下命令添加\
  \ `remote`：\n\n```\ngit remote add <name> <url of the remote>\n```\n\n作为参数传递的名称允许在本地标识此远程仓库；它相当于别名。我们也可以在本地仓库上配置多个远程设备。\n\
  \n#### 为下一次提交添加文件\n\n提交（我们将在下一节中介绍）是将我们的更改存档到本地仓库。当我们编辑文件时，可以选择哪些文件将包含在下一次提交中；这是一个暂存概念。未选中的其他文件将被搁置，以备以后提交。\n\
  \n要为下一次提交添加文件，我们执行 add 命令，如下所示：\n\n```\ngit add <files path to add>\n```\n\n因此，例如，如果我们希望在下一次提交中包含所有修改的文件，请执行\
  \ `git add .` 命令。我们还可以使用 **正则表达式 (RegEx)** 过滤要添加的文件，例如 `git add *.txt`。\n\n####\
  \ 创建提交\n\n提交是 Git 实体，包含对文件所做的更改列表，这些更改已在本地仓库中注册。因此，提交是指存档之前使用 add 命令选定的文件所做的更改。\n\
  \n创建提交的命令如下所示：\n\n```\ngit commit -m \"<your commit message>\"\n```\n\n-m 参数对应于我们分配给此提交的消息或描述。消息非常重要，因为我们将能够识别文件更改的原因。\n\
  \n还可以提交自上次提交以来修改的所有文件，而无需执行 add 命令，方法是执行 `git commit -a -m \"<message>\"` 命令。\n\n\
  执行提交后，更改将存档在本地仓库中。\n\n\n\n\n\n### 更新远程仓库\n\n当我们提交代码时，提交记录会保存在本地仓库中，当我们准备与团队其他成员共享这些代码以进行验证或部署时，必须将其发布到远程仓库。要使用本地仓库中的提交记录更新远程仓库，需要执行推送操作，使用以下命令：\n\
  \n```\ngit push <alias> <branch>\n```\n\n作为参数传递的别名对应于本地仓库 Git 配置中配置的远程仓库别名（通过 `git\
  \ remote add` 命令完成）。\n\n而 branch 参数是要更新的分支——默认情况下，它是 `master` 分支。\n\n### 从远程仓库同步本地仓库\n\
  \n如前所述，Git 命令行用于从本地仓库更新远程仓库。现在，要执行相反的操作——即使用其他成员推送到远程仓库的所有更改来更新仓库——我们将执行拉取操作，使用以下命令：\n\
  \n```\ngit pull\n```\n\n执行此命令会导致两个操作：\n\n- 将本地代码与远程代码合并。\n- 提交到本地仓库。\n\n另一方面，如果我们不想提交——例如，为了能够进行其他更改——则不应使用\
  \ pull 命令，而应执行 `fetch`，使用以下命令：\n\n```\ngit fetch\n```\n\n其执行仅将远程代码合并到本地代码，要存档，我们将不得不执行\
  \ `commit` 来更新本地仓库。\n\n### 管理分支\n\n默认情况下，创建仓库时，代码位于名为 `master` 的主分支中。为了能够隔离 `master`\
  \ 分支的开发——例如，开发新功能、修复 bug，甚至进行技术实验——我们可以从其他分支创建新分支，并在想要合并代码时将它们合并在一起。\n\n要从当前本地加载的分支创建分支，我们执行以下命令：\n\
  \n```\ngit branch <name of the desired branch>\n```\n\n要切换到另一个分支，我们执行以下命令：\n\n```\n\
  git checkout <name of the branch>\n```\n\n此命令会更改分支，并使用该分支的内容加载当前工作目录。\n\n要将分支合并到当前分支，执行合并命令，如下所示：\n\
  \n```\ngit merge <branch name>\n```\n\n将要合并的分支名称作为参数。\n\n最后，要显示本地分支列表，我们执行 branch\
  \ 命令，如下所示：\n\n```\ngit branch\n```\n\n从命令行使用分支管理并不容易。Git 的图形工具（已提及）允许更好的可视化和分支管理。我们将在下一节详细了解它们的用途，该节将介绍\
  \ Git 流程。关于常用 Git 命令行就介绍到这，虽然还有更多命令用于处理其他事项。\n\n在下一节，我们将通过应用 Git 的工作和协作流程，将所有这些付诸实践，并了解\
  \ Gitflow 模式的概览。\n\n### 了解 Git 流程和 Gitflow 模式\n\n到目前为止，我们已经了解了一个非常强大的版本控制系统 Git\
  \ 的基础知识，包括其安装、配置以及一些最常用的命令行。在本节中，我们将通过一个案例研究将所有这些付诸实践，该案例将展示在项目生命周期中应应用哪个 Git 流程。\n\
  \n在这个案例研究中，对于远程仓库，我们将使用 **Azure Repos**（Azure DevOps 服务之一），这是一个免费的 Git 云平台，可用于个人甚至商业项目。要了解有关\
  \ Azure DevOps 的更多信息，请参阅此处的文档：`https://azure.microsoft.com/en-us/services/devops/`。我们将在本书中经常提到它。\n\
  \n### 开始使用 Git 流程\n\n在这个实验中，我们将解释两名开发人员开始新应用程序开发项目的 Git 协作流程。\n\n以下是我们将在本节中详细讨论的\
  \ Git 流程步骤：\n\n- 第一位开发人员在本地仓库中提交代码，并将其推送到远程仓库。\n- 然后，第二位开发人员从远程仓库获取推送的代码。\n- 第二位开发人员更新此代码，创建提交，并将代码的新版本推送到远程仓库。\n\
  - 最后，第一位开发人员在本地仓库中检索代码的最新版本。\n\n我们将了解的 Gitflow 数据流如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_196_0.png)\n\
  \n图 6.20 – Git 数据流\n\n但是，在开始使用 Git 命令之前，我们将先了解在 Azure Repos 中创建和配置 Git 仓库的步骤。\n\n\
  ### 创建和配置 Git 仓库\n\n首先，我们将在 Azure DevOps 中创建一个远程 Git 仓库，用于与其他团队成员协作。请按照以下步骤操作：\n\
  \n- 在 Azure DevOps 中，我们将创建一个新项目，如下所示：\n\n### 创建项目以开始\n\n项目名称 *\nBookDemo\n描述\nDemo\
  \ 项目\n可见性\n公共\n任何人在互联网上都可以查看项目。某些功能（如 TFVC）不受支持。\n私有\n只有您授予访问权限的人才能查看此项目。\n高级\n\
  版本控制\nGit\n工作项流程\n基本\n+ 创建项目\n\n图 6.21 – 创建 Azure DevOps 项目\n\n### 输入项目名称和描述，正如我们从前面的截图中可以看到，**版本控制**类型是\
  \ **Git**。然后，在左侧菜单中，我们单击 Azure **Repos** 服务，如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_198_0.png)\n\
  \n图 6.22 – Azure Repos 菜单\n\n### 默认仓库已创建，且与项目同名，如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_198_1.png)\n\
  \n图 6.23 – Azure DevOps 新仓库\n\n现在 Git 仓库已在 Azure Repos 中创建，我们将了解如何初始化和配置本地工作目录以使用此\
  \ Git 仓库。\n\n要初始化此仓库，我们将创建一个本地目录并为其命名（例如，bookProject）。这将包含应用程序代码。\n\n创建此目录后，我们将通过在\
  \ bookProject 文件夹内执行 git init 命令来初始化本地 Git 仓库，如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_199_0.png)\n\
  \n前面命令的结果是一条确认消息和一个新的 .git 目录。这个新目录将包含本地 Git 仓库的所有信息和配置。\n\n然后，我们将配置此本地仓库以链接到 Azure\
  \ DevOps 远程仓库。此链接将允许本地仓库和远程仓库的同步。为此，在 Azure DevOps 中，我们获取仓库的 URL，该 URL 位于仓库信息中，如下面的截图所示：\n\
  \nBookDemo 为空。添加一些代码！\n\n![](img/d3344b39c888aab0b832625465f837c9_199_1.png)\n\n\
  在我们在第 4 步中创建的 bookProject 文件夹内运行 git remote add 命令，如下所示：\n\n```\ngit remote add\
  \ origin <url of the remote repository>\n```\n\n通过执行前面的命令，我们创建了一个 `origin` 别名，它将指向远程仓库\
  \ URL。\n\n> 注意\n> \n> 此整个初始化和配置过程也适用于空目录（如我们的情况），或适用于已包含我们想要存档的代码的目录。\n\n因此，我们现在有一个要使用的本地\
  \ Git 仓库。在创建和配置仓库后，我们将开始为应用程序开发代码，并从提交代码开始使用 Git 流程进行协作。\n\n### 提交代码\n\n流程的第一步是代码提交，它允许您将代码更改存储在本地\
  \ Git 仓库中，请按照以下步骤操作：\n\n- 在我们的目录中，我们将创建一个包含以下示例文本的 `Readme.md` 文件：\n\n![](img/d3344b39c888aab0b832625465f837c9_200_0.png)\n\
  \n- 要在本地仓库中提交此文件，我们必须通过执行 `git add .` 命令将其添加到下一次提交的文件列表中（末尾的 `.` 字符表示包括要修改、添加或删除的所有文件）。\n\
  \n- 我们还可以通过运行 `git status` 命令查看将对本地仓库进行的更改的状态，如下面的截图所示：\n\n\n\n\n\n\n从前面的执行中，我们可以看到创建了一个\
  \ Readme.md 文件，并且它也会集成到提交中。\n\n最后要执行的操作是通过将更改存档到本地仓库来验证更改，为此，我们执行以下命令：\n\n```\n\
  git commit -m \"Add file readme.md\"\n```\n\n我们进行带有描述的提交，以便跟踪更改。以下是前面命令的截图：\n\n\
  ![](img/d3344b39c888aab0b832625465f837c9_201_1.png)\n\n### 存档到远程仓库\n\n为了存档本地更改并允许团队对这段代码进行协作，我们将通过执行以下命令将提交推送到远程仓库：\n\
  \n```\ngit push origin master\n```\n\n我们向 `git push` 命令指示远程仓库的别名和分支。在首次执行此命令时，系统会要求我们对\
  \ Azure DevOps 仓库进行身份验证，如下面的截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_202_0.png)\n\
  \n图 6.29 – 在 Azure DevOps 上执行 git push\n\n身份验证后，推送操作将执行，如下所示：\n\n```\nC:\\Users\\\
  user\\BookProject>git push origin master\nEnumerating objects: 3, done.\nCounting\
  \ objects: 100% (3/3), done.\nWriting objects: 100% (3/3), 275 bytes | 275.00 KiB/s,\
  \ done.\nTotal 3 (delta 0), reused 0 (delta 0)\nremote: Analyzing objects... (3/3)\
  \ (6 ms)\nremote: Storing packfile... done (324 ms)\nremote: Storing index... done\
  \ (148 ms)\nTo https://dev.azure.com/BookLabs/BookDemo/_git/BookDemo\n * [new branch]\
  \      master -> master\n```\n\n图 6.30 – git push 结果\n\n远程仓库已与我们的更改保持同步，在 Azure\
  \ Repos 界面中，我们可以看到远程仓库的代码。下面的截图显示了 Azure Repos 中包含新添加文件的目录：\n\n图 6.31 – Azure Repos\
  \ 新增文件\n\n就这样：我们完成了 Git 流程的第一个主要步骤，该步骤包括初始化仓库并将代码推送到远程仓库。下一步是由另一名团队成员对代码进行更改。\n\n\
  ### 克隆仓库\n\n当另一名成员首次想要检索整个远程仓库代码时，他们会执行克隆操作，为此，他们必须执行此命令：\n\n```\ngit clone <repository\
  \ url>\n```\n\n执行此命令将执行以下操作：\n\n1. 创建一个与仓库同名的新目录。\n2. 创建一个带有初始化和配置的本地仓库。\n3. 下载远程代码。\n\
  \n因此，团队成员可以修改代码并进行更改。\n\n### 更新代码\n\n当代码被修改且开发者在远程仓库上更新他们的更改时，他们将执行与初始化远程仓库时完全相同的操作，即执行以下命令：\n\
  \n```\ngit add .\ngit commit -m \"update the code\"\ngit push origin master\n```\n\
  \n我们将文件添加到下一次提交中，创建了一个提交，并将提交推送到远程仓库。\n\n最后剩下的步骤是其他成员检索更新。\n\n### 检索更新\n\n当一名成员更新远程仓库时，可以通过运行\
  \ `git pull` 命令来检索这些更新，并使用更改更新我们的本地仓库，如下所示：\n\n```\ngit pull origin master\n```\n\
  \n下面的截图显示了执行此 `git pull` 命令的情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_204_0.png)\n\
  \n图 6.32 – git pull 命令\n\n从前面的执行中，我们指示要在本地仓库中更新的 origin 别名和 master 分支，其执行显示了推送的提交。在执行此命令结束时，我们的本地仓库已保持最新。\n\
  \n关于代码更新的其余流程，与我们在“更新代码”部分中看到的相同。\n\n我们刚刚了解了使用 Git 的简单流程，但也可以通过使用分支来隔离开发。\n\n###\
  \ 使用分支隔离代码\n\n在开发应用程序时，我们通常需要修改部分代码，但又不希望影响应用程序现有的稳定代码。为此，我们将使用所有版本控制系统（VCS）中都存在的一个功能，该功能允许我们创建和管理分支。\n\
  \n使用分支的机制非常简单，如下所述：\n\n1. 从一个分支，我们创建另一个分支。\n2. 我们开发这个新分支。\n3. 如果我们在团队中工作，创建一个 PR\
  \ 以讨论代码更改。如果审核人同意这些更改，他们将批准更改的代码。\n4. 要将在此新分支上所做的更改应用到原始分支，将执行合并操作。\n\n从概念上讲，分支系统的表示方式如下：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_205_0.png)\n\n图 6.33 – 分支图\n\n在此图中，我们看到分支\
  \ B 是从分支 A 创建的。这两个分支将由开发团队修改，以便为我们的应用程序添加新功能。但最终，分支 A 与分支 B 合并，从而合并了分支 B 的代码更改。\n\
  \n现在我们已经了解了分支的基础知识，让我们按照以下步骤了解如何在 Git 中使用分支：\n\n1. 本实验的目的是从 `master` 分支创建一个 `Feature1`\
  \ 分支。然后，在 `Feature1` 分支上进行一些更改后，我们将把 `Feature1` 分支的代码更改合并到 `master` 分支。首先，使用以下命令从\
  \ `master` 在本地仓库上创建一个 `Feature1` 分支：\n\n```\ngit branch Feature1\n```\n\n执行此命令创建了一个新分支\
  \ `Feature1`，它包含与父分支 `master` 完全相同的代码。\n\n2. 要使用此分支的代码加载工作目录，我们执行以下命令：\n\n```\n\
  git checkout Feature1\n```\n\n从以下输出中，我们可以看到分支的切换：\n\n![](img/d3344b39c888aab0b832625465f837c9_206_0.png)\n\
  \n3. 我们还可以使用以下命令查看本地仓库的分支列表：\n\n```\ngit branch\n```\n\n此命令的输出如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_206_1.png)\n\
  \n在执行过程中，我们可以看到两个分支以及当前活动的分支。\n\n4. 现在，我们将在此分支上对代码进行更改。更新机制与我们之前看到的所有内容相同，因此我们将执行以下命令：\n\
  \n```\ngit add .\ngit commit -m \"Add feature 1 code\"\n```\n\n5. 对于 `push` 操作，我们将使用此命令在参数中指定\
  \ `Feature1` 分支的名称：\n\n```\ngit push origin Feature1\n```\n\n下面的截图显示了执行所有这些步骤的代码：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_207_0.png)\n\n图 6.36 – 添加 Git 分支\n\n\
  6. 通过我们执行的前面命令，我们在 `Feature1` 分支上创建了一个提交。然后我们执行了 `push` 命令，将新分支及其提交发布到远程仓库。另一方面，在\
  \ Azure Repos 界面中，我们可以在 **Branches** 部分看到我们的两个分支，如下面的截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_207_1.png)\n\
  \n图 6.37 – Azure Repos 分支列表\n\n7. 在合并代码之前，我们创建一个 PR 以讨论更改。下面的截图显示了在 Azure DevOps\
  \ 中创建 PR 和审批步骤。我们首先创建一个 PR，如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_208_0.png)\n\
  \n图 6.38 – Azure Repos：创建 PR\n然后，通过选择源分支和目标分支、输入标题和描述以及选择审核人来填写此 PR 的表单。我们还可以查看将要合并的代码差异。该过程在下面的截图中说明：\n\
  \n\n\n\n\n最后，审核人员将审查、批准或拒绝这些更改（他们也可以直接合并），如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_209_1.png)\n\
  \n8. 我们流程中的最后一步是将 `Feature1` 分支的代码合并到 `master` 分支的代码中，即 `master` 分支。要执行此合并操作，我们首先将工作目录加载到\
  \ `master` 分支，然后将 `Feature1` 分支合并到当前分支（即 `master` 分支）。\n\n为此，我们将执行以下命令：\n\n```\n\
  git checkout master\ngit merge Feature1\n```\n\n这些命令的执行过程如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_210_0.png)\n\
  \n执行结束后，`master` 分支的代码中就包含了 `Feature1` 分支中所做的更改。\n\n我们刚刚了解了 Git 中分支及其合并的使用；现在，让我们来看看\
  \ Gitflow 分支模式及其实用性。\n\n### Gitflow 分支策略\n\n当我们开始在 Git 中使用分支时，经常会出现这样一个问题：_使用哪种分支策略是正确的_？换句话说，我们需要隔离代码的关键是什么——是按环境、功能、主题还是发布版本来划分？\n\
  \n这个问题没有通用的答案，项目中分支的管理取决于项目的上下文。然而，有一些分支策略模式已经被多个社区和大量用户认可，能够在 Git 项目中实现更好的协作流程。\n\
  \n建议我们仔细研究其中一种分支模式，即 Gitflow。\n\n#### Gitflow 模式\n\n这些模式之一是 **Gitflow**，由 _nvie_\
  \ 开发，非常流行且具有非常容易上手的 Git 工作流。\n\nGitflow 的分支图如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_211_0.png)\n\
  \n图 6.42 – Gitflow 图\n\n让我们来看看这个工作流的细节，以及每个分支在创建顺序中的用途，如下所示：\n\n- 1. 首先，我们有 `master`\
  \ 分支，其中包含当前处于生产环境中的代码。没有开发人员直接在其上工作。\n- 2. 从这个 `master` 分支，我们创建一个 `develop` 分支，它是将包含应用程序下一次交付中要部署的更改的分支。\n\
  - 3. 对于应用程序的每个功能，都会从 `develop` 分支创建一个 `feature/<功能名称>` 分支（/ 将因此创建一个 `feature` 目录）。\n\
  - 4. 当一个功能编码完成后，该功能的分支会合并到 `develop` 分支中。\n- 5. 然后，当我们想要部署所有最新开发的功能时，我们会从 `develop`\
  \ 分支创建一个 `release` 分支。\n- 6. `release` 分支的内容会成功部署到所有环境中。\n- 7. 当生产环境中的部署完成后，`release`\
  \ 分支会与 `master` 分支合并，通过此合并操作，`master` 分支包含生产代码。因此，`release` 分支和功能分支上的代码不再必要，这些分支可以被删除。\n\
  - 8. 如果在生产环境中检测到错误，我们会创建一个 `hotfix/<错误名称>` 分支；然后，一旦错误修复，我们会将此分支合并到 `master` 和 `develop`\
  \ 分支中，以便在后续分支和部署中传播修复。\n\n在了解 Gitflow 模式的工作流后，我们将讨论有助于其实现的工具。\n\n### Gitflow 工具\n\
  \n为了帮助团队和开发人员使用 Gitflow，_nvie_ 创建了一个 Git 命令行覆盖工具，允许您根据工作流步骤轻松创建分支。此工具可在 _nvie_ 的\
  \ GitHub 页面上找到：`https://github.com/nvie/gitflow`。\n\n另一方面，也有支持 Gitflow 模型的 Git 图形工具，例如\
  \ GitKraken (`https://www.gitkraken.com/`) 和 Sourcetree (`https://www.sourcetreeapp.com/`)。这些工具允许我们通过图形界面使用\
  \ Gitflow 流程，如下图所示，使用带有 `Git-flow` 功能的 Sourcetree，该功能允许我们使用 Gitflow 模式创建分支。\n\n\
  下图显示了 Sourcetree 针对 Gitflow 模式分支命名的配置：\n\n![](img/d3344b39c888aab0b832625465f837c9_212_0.png)\n\
  \n图 6.43 – Sourcetree Git-flow 工具\n\n然后，在此配置之后，我们可以轻松使用此名称创建分支，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_213_0.png)\n\
  \n图 6.44 – 创建 Sourcetree 分支\n\n如前几张截图所示，我们使用 Sourcetree 和允许我们直观创建分支的图形界面。\n\n> **注意**\n\
  >\n> 有关 Gitflow 及其流程的更多文档，请阅读此文章：\n> https://jeffkreeftmeijer.com/git-flow/。\n\n\
  要开始使用 Gitflow，我建议您先从小型项目开始，然后您会发现该机制在大型项目中也是相同的。在本节中，我们了解了使用 Git 命令行及其工作流的过程。然后，我们讨论了开发分支的管理，最后，我们进一步了解了\
  \ Gitflow 分支，它允许简单地管理分支，并提供更好的 Git 开发工作流。\n\n### 总结\n\nGit 如今是所有开发人员的必备工具；它允许我们使用命令行或图形工具，共享和版本化代码，以实现更好的团队协作。\n\
  \n在本章中，我们了解了如何在不同操作系统上安装 Git 以及主要命令行的概述。然后，通过一个小型实验，我们了解了 Git 工作流及其 Git 命令行的应用。最后，我们介绍了通过实现分支和使用\
  \ Gitflow 模式来隔离代码，该模式提供了一个简单的分支策略模型。\n\n在下一章中，我们将讨论 CI/CD，它是 DevOps 文化的关键实践之一。\n\
  \n### 问题\n\n- 1. 什么是 Git？\n- 2. 哪个命令用于初始化仓库？\n- 3. Git 用于保存部分代码的工件名称是什么？\n- 4. 哪个\
  \ Git 命令允许您将代码保存到本地仓库？\n- 5. 哪个 Git 命令允许您将代码发送到远程仓库？\n- 6. 哪个 Git 命令允许您从远程仓库更新本地仓库？\n\
  - 7. 哪个 Git 机制用于 Git 代码隔离？\n- 8. 什么是 Gitflow？\n\n### 进一步阅读\n\n如果您想了解更多关于 Git 的信息，以下是一些资源：\n\
  \n- Git 文档：https://www.git-scm.com/doc\n- Pro Git 书籍：https://git-scm.com/book/en/v2\n\
  - Mastering Git 书籍：https://www.packtpub.com/application-development/mastering-git\n\
  - 设置 Git：https://try.github.io/\n- 学习 Git 分支：https://learngitbranching.js.org/\n\
  - Atlassian Git 教程：https://www.atlassian.com/git/tutorials\n- git-flow 速查表：https://danielkummer.github.io/git-flow-cheatsheet/\n"
- "## 7 持续集成和持续交付\n\n**开发运维（DevOps）**文化的主要支柱之一是实施**持续集成（CI）**和部署流程，正如我们在 _第 1 章，DevOps\
  \ 文化和基础设施即代码实践_ 中所解释的那样。\n\n在上一章中，我们了解了 Git 及其命令行和使用工作流，在本章中，我们将了解 Git 在 CI/CD 工作流中所起的重要作用。\n\
  \n**CI** 是一个过程，它向团队所有成员提供关于代码一致性和质量的快速反馈。当每个用户的代码提交从远程仓库检索并合并代码、对其进行编译和测试时，就会发生\
  \ CI。\n\n**持续交付（CD）** 是将应用程序部署到不同阶段（或环境）的过程的自动化。\n\n\n\n\n\n在本章中，我们将学习 CI/CD 流程的原则，以及如何使用不同的工具（如\
  \ **Jenkins**、**Azure Pipelines** 和 **GitLab CI**）来实践该流程。对于每种工具，我们将介绍其优点、缺点和最佳实践，并查看实现\
  \ CI/CD 流水线的实际示例。\n\n你将了解 CI/CD 流水线的概念。之后，我们将探讨包管理器及其在流程中的作用。\n\n然后，你将学习如何安装 Jenkins，最后，在\
  \ Jenkins、Azure Pipelines 和 GitLab CI 上构建 CI/CD 流水线。\n\n本章涵盖以下主题：\n\n- CI/CD 原则\n\
  - 在 CI/CD 过程中使用包管理器\n- 使用 Jenkins 进行 CI/CD 实现\n- 使用 Azure Pipelines 进行 CI/CD\n-\
  \ 使用 GitLab CI\n\n### 技术要求\n\n本章唯一的要求是系统中已安装 Git，如上一章中详细说明。\n\n本章的源代码可在 `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP07`\
  \ 上获取。\n\n查看以下视频，观看代码的实际运行情况：`https://bit.ly/3s9G8Pj`。\n\n### CI/CD 原则\n\n要实现 CI/CD\
  \ 流水线，了解构建高效且安全流水线所需的不同元素非常重要。为了理解 CI/CD 的原则，以下图表展示了 CI/CD 工作流的不同步骤，我们在 _第 1 章，DevOps\
  \ 文化和基础设施即代码实践_ 中已经见过：\n\n![](img/d3344b39c888aab0b832625465f837c9_217_0.png)\n\n\
  图 7.1 – CI/CD 工作流\n\n让我们详细查看每个步骤，以列出 CI/CD 过程的产物。\n\n#### CI\n\nCI 阶段检查团队成员存档的代码。它必须在每个推送到远程仓库的提交上执行。\n\
  \n设置 Git 类型的 **源代码控制版本 (SCV)** 是一个必要的先决条件，它使集中化所有团队成员的代码成为可能。\n\n团队将需要决定一个用于 CI\
  \ 的代码分支。例如，我们可以使用 `master` 分支，或作为 GitFlow 一部分的 `develop` 分支；它只需要是一个非常定期集中代码更改的活跃分支。\n\
  \n此外，CI 是通过在服务器上执行的自动任务套件实现的，该套件遵循在开发人员笔记本电脑上执行的类似模式，该笔记本电脑具有 CI 所需的工具；此服务器称为 **CI\
  \ 服务器**。\n\nCI 服务器可以是本地类型，安装在公司数据中心，例如 Jenkins 或 TeamCity，或者可能是云类型，我们不必担心安装和维护，例如\
  \ Azure Pipelines 或 GitLab CI。\n\nCI 阶段执行的任务必须自动化，并考虑验证代码所需的所有元素。\n\n这些任务通常是代码编译和带有代码覆盖率的单元测试执行。我们还可以添加\
  \ SonarQube（或 SonarCloud）的静态代码分析，我们将在 _第 12 章，使用 SonarQube 进行静态代码分析_ 中查看。\n\n在验证任务结束时，在许多情况下，CI\
  \ 生成一个将部署到不同环境（也称为 **阶段**）的应用程序包。\n\n为了能够托管此包，我们需要一个包管理器，也称为 **仓库管理器**，它可以是本地（本地安装）的，例如\
  \ Nexus、Artifactory 或 ProGet，或者是 **软件即服务 (SaaS)** 解决方案，例如 Azure Pipelines、Azure\
  \ Artifacts 或 GitHub Packages 注册表。此包在环境配置方面也必须是中立的，并且 _必须_ 进行版本控制，以便在必要时部署应用程序的先前版本。\n\
  \n#### CD\n\n一旦应用程序在 CI 期间被打包并存储在包管理器中，CD 过程就准备好检索包并将其部署到不同环境。\n\n每个环境中的部署由一系列自动任务组成，这些任务也在具有访问不同环境权限的远程服务器上执行。\n\
  \n因此，有必要让 Dev、Ops 以及安全团队参与 CI/CD 工具和流程的实施。确实，正是这种人员与工具和流程的结合，将在不同服务器或云资源上部署应用程序，既遵守网络规则，也遵守公司的安全标准。\n\
  \n在部署阶段，通常需要修改生成包中的应用程序配置，以便其适应目标环境。因此，有必要集成一个 **配置管理器**，它已经存在于常见的 CI/CD 工具中，例如\
  \ Jenkins、Azure Pipelines 或 Octopus Deploy。此外，当有新的配置键时，最佳实践是让每个环境（包括生产环境）在 Ops 团队的参与下进行输入。\n\
  \n最后，部署的触发可以自动完成，但对于更关键的环境（例如，生产环境），受严格监管的公司可能有需要手动触发并检查有权触发部署的人员的网关。\n\n设置 CI/CD\
  \ 流水线的不同工具列表如下：\n\n- 一个 SCV\n- 一个包管理器\n- 一个 CI 服务器\n- 一个配置管理器\n\n但请不要忘记，所有这些工具只有在\
  \ Dev 和 Ops 团队围绕它们协作时，才能真正有效地为产品交付增值。\n\n我们刚刚了解了实现 CI/CD 流水线的原则。在本章的其余部分，我们将查看不同工具的实际实现，从包管理器开始。\n\
  \n### 在 CI/CD 过程中使用包管理器\n\n包管理器是一个中央仓库，用于集中和共享包、开发库、工具和软件。\n\n对于使用包管理器的消费客户端，其好处是能够跟踪、更新、安装和删除已安装的包。\n\
  \n有许多公共包管理器，例如 NuGet、**Node Package Manager (npm)**、Maven、Bower 和 Chocolatey，它们为不同语言和平台的开发人员提供框架或工具。\n\
  \n以下截图来自 NuGet 包管理器，它公开提供了超过 150,000 个 .NET 框架：\n\n![](img/d3344b39c888aab0b832625465f837c9_219_0.png)\n\
  \n#### 共有 255,875 个包\n\n- Newtonsoft.Json ✔ by: dotnetfoundation jamesnk newtonsoft\n\
  \  ↓ 1,281,207,499 总下载量 ↻ 6 个月前上次更新 ↥ 最新版本：13.0.1 ◇ json\n  Json.NET 是 .NET 的一个流行的高性能\
  \ JSON 框架\n\n- Microsoft.Extensions.DependencyInjection ✔ by: aspnet dotnetframework\
  \ Microsoft\n  ↓ 753,833,308 总下载量 ↻ 12 天前上次更新 ↥ 最新版本：6.0.0-rc.1.21451.13\n  Microsoft.Extensions.DependencyInjection\
  \ 的依赖注入默认实现。\n\n- Microsoft.Extensions.Logging ✔ by: aspnet dotnetframework Microsoft\n\
  \  ↓ 735,313,652 总下载量 ↻ 12 天前上次更新 ↥ 最新版本：6.0.0-rc.1.21451.13\n  Microsoft.Extensions.Logging\
  \ 的日志基础设施默认实现。\n\n图 7.2 – NuGet 包管理器\n\n开发人员使用这种类型包管理器的一个优势是，他们不必将包与应用程序源代码一起存储，而是可以在配置文件中将其作为引用，这样包将被自动检索。\n\
  \n在企业应用程序中，事情有点不同，因为尽管开发人员使用公共管理器中的包，但在企业中生成的一些元素必须保持内部。\n\n确实，通常的情况是，框架（例如 NuGet\
  \ 或 npm 库）是在内部开发的，不能公开暴露。此外，正如我们在 CI/CD 流水线中看到的，我们需要为应用程序制作一个包，并将其存储在对公司私有的包管理器中。\n\
  \n这就是为什么建议查看 NuGet 和 npm 等包管理器，它们可以在企业内部或个人需求中使用。\n\n### 私有 NuGet 和 npm 仓库\n\n如果您需要集中\
  \ NuGet 或 npm 包，可以创建自己的本地仓库。\n\n要创建您的 **NuGet 服务器** 实例，请参阅 Microsoft 文档：`https://docs.microsoft.com/en-us/nuget/hosting-packages/overview`。\n\
  \n对于 npm，我们也可以使用 `npm local-npm` 包在本地安装它，其文档可在此处查看：`https://www.npmjs.com/package/local-npm`。\n\
  \n按包类型方法安装每个仓库的问题是，我们需要为不同类型的包安装和维护仓库及其基础设施。\n\n这就是为什么最好切换到通用仓库解决方案，例如用于本地解决方案的\
  \ Nexus (Sonatype)、ProGet 和 Artifactory，以及用于 SaaS 解决方案的 Azure Artifacts、MyGet 或\
  \ Artifactory。\n\n为了了解包管理器的工作原理，我们将查看 Nexus Repository OSS 和 Azure Artifacts。\n\n\
  ### Nexus Repository OSS\n\nNexus Repository 是 Sonatype 公司的产品（`https://www.sonatype.com/`），该公司专门从事\
  \ **开发-安全-运维 (DevSecOps)** 工具，这些工具将安全控制集成到应用程序的代码中。\n\n\n\n\n\nNexus Repository\
  \ 存在开源/免费版本，其文档可在 https://www.sonatype.com/nexus-repository-oss?smtNoRedir=1 和 https://help.sonatype.com/repomanager3\
  \ 上查阅。\n\n在安装和使用 Nexus 之前，请考虑要求文档中详细说明的软件和硬件要求，文档地址如下：https://help.sonatype.com/repomanager3/installation/system-requirements。\n\
  \n关于安装和配置步骤，请参阅安装流程，文档地址如下：https://help.sonatype.com/repomanager3/installation。\n\
  \n您也可以通过 Docker 容器使用它（我们将在下一章详细介绍 Docker），相关文档如下：https://hub.docker.com/r/sonatype/nexus3/。\n\
  \n安装 Nexus Repository 后，我们必须按照以下步骤创建一个仓库：\n\n- 1. 在 **Repositories** 部分，单击 **Create\
  \ repository** 按钮。\n- 2. 然后，选择将存储在仓库中的包类型（例如，npm、NuGet 或 Bower），如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_221_0.png)\n\
  \n图 7.3 – Nexus 包管理器\n\nNexus 是一个高性能且广泛使用的企业仓库，但安装和维护它需要付出努力。对于 Azure Artifacts\
  \ 等 SaaS 包管理器则不存在此问题，我们将在本节后面介绍。\n\n### Azure Artifacts\n\nAzure Artifacts 是 Azure\
  \ DevOps 提供的服务之一。我们在上一章已经介绍过它，并且在本章的 _使用 Azure Pipelines 进行 CI/CD_ 部分还会再次介绍。它托管在云端，因此允许管理私有包源。\n\
  \n当前支持的包包括 NuGet、npm、Maven、Gradle、Python 以及通用包。与 Nexus 的主要区别在于，在 Azure Artifacts\
  \ 中，源不是按包类型划分的，一个源可以包含不同类型的包。\n\nAzure Artifacts 的一个优势是它与其他 Azure DevOps 服务（例如 Azure\
  \ Pipelines）完全集成，Azure Pipelines 允许管理 CI/CD 管道，我们将在稍后介绍。\n\n在 Azure Artifacts 中，还有一种称为\
  \ **通用包** 的包类型，它允许在源中存储所有类型的文件（称为 **包**），这些包可以被其他服务或用户消费。\n\n以下是一个 Azure Artifacts\
  \ 源的示例，其中包含多种类型的包，我们可以看到一个 NuGet 包、一个 npm 包、一个通用包、一个 Maven 包和一个 Python 包：\n\n![](img/d3344b39c888aab0b832625465f837c9_222_0.png)\n\
  \n图 7.4 – Azure Artifacts 包\n\nAzure Artifacts 的优势在于它是 SaaS 产品模式，因此无需安装或管理基础设施；有关更多信息，文档可在此处查阅：https://azure.microsoft.com/en-us/services/devops/artifacts/。\n\
  \n我们已完成对包管理器的概述，涵盖了本地 NuGet 服务器实例、NPM、Nexus 和 Azure Artifacts。当然，还有许多其他包管理器工具应根据公司需求予以考虑。\n\
  \n在介绍完包管理器后，我们将使用一个名为 Jenkins 的知名工具实现 CI/CD 管道。\n\n### 使用 Jenkins 进行 CI/CD 实现\n\n\
  Jenkins 是最古老的 CI 工具之一，最初发布于 2011 年。它是开源的，并使用 Java 开发。\n\nJenkins 之所以闻名，得益于为其工作的庞大社区及其插件。事实上，有超过\
  \ 1,500 个 Jenkins 插件可让您在作业中执行各种操作。而且，即使您的某项任务没有插件，您也可以自行创建一个。\n\n在本节中，我们将介绍 Jenkins\
  \ 的安装和配置，并将创建一个 CI Jenkins 作业，该作业将在 Git 仓库中提交代码时执行。\n\n演示应用程序的源代码是一个开源 Java 项目，可在\
  \ GitHub Microsoft 仓库空间中查阅：https://github.com/microsoft/MyShuttle2。要使用它，您需要将其 fork\
  \ 到您的 GitHub 帐户中。\n\n在介绍 Jenkins 作业之前，我们将了解如何安装和配置 Jenkins。\n\n### 安装和配置 Jenkins\n\
  \nJenkins 是一个跨平台工具，可以安装在任何类型的支持上，例如 **虚拟机 (VM)** 甚至 Docker 容器。其安装文档可在此处查阅：https://jenkins.io/doc/book/installing/。\n\
  \n对于我们的演示，以及为了快速访问 CI/CD 管道的配置，我们将在 Azure VM 上使用 Jenkins。事实上，Azure Marketplace 包含一个预装了\
  \ Jenkins 及其先决条件的 VM。\n\n### 以下步骤展示了如何创建带有 Jenkins 及其基本配置的 Azure VM：\n\n- 1. 要了解创建已预装\
  \ Jenkins 的 Azure VM 的所有步骤，请阅读此处提供的文档：https://docs.microsoft.com/en-us/azure/jenkins/install-jenkins-solution-template。\n\
  - 以下截图显示了 Azure Marketplace 上的 Jenkins 集成：\n\n![](img/d3344b39c888aab0b832625465f837c9_224_0.png)\n\
  \n图 7.5 – Azure Marketplace 上的 Jenkins\n\n- 2. 安装并创建后，我们将在浏览器中访问 Jenkins，方法是在 Azure\
  \ 门户的 **DNS 名称** 字段中提供其 **统一资源定位符 (URL)**，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_224_1.png)\n\
  \n图 7.6 – Jenkins 的 Azure 域名系统 (DNS) 名称\n\n3. 按照 Jenkins 主页上显示的说明操作，通过安全 **安全套接层\
  \ (SSL)** 隧道启用对此 Jenkins 实例的访问。有关此步骤的更多详细信息，请阅读 `https://docs.microsoft.com/en-us/azure/jenkins/install-jenkins-solution-template#connect-to-jenkins`\
  \ 中的文档以及此文章：`https://jenkins.io/blog/2017/04/20/secure-jenkins-on-azure/`。\n\n4.\
  \ 然后，按照 Jenkins 屏幕上显示的 **解锁 Jenkins** 消息中的配置说明操作。配置完成后，我们即可准备好 Jenkins 以创建 CI 作业。\n\
  \n为了在 Jenkins 中使用 GitHub 功能，我们还通过 Jenkins 插件管理安装了 **GitHub 集成插件**，具体操作请参阅此文档：`https://jenkins.io/doc/book/managing/plugins/`。\n\
  \n以下截图显示了 GitHub 插件的安装：\n\n![](img/d3344b39c888aab0b832625465f837c9_225_0.png)\n\
  \n图 7.7 – Jenkins GitHub 集成\n\n现在我们已在 Jenkins 中安装了 GitHub 插件，让我们来看看如何使用 Webhook\
  \ 配置 GitHub 以便与 Jenkins 集成。\n\n### 配置 GitHub Webhook\n\n为了让 Jenkins 运行新作业，我们必须首先在\
  \ GitHub 仓库中创建一个 Webhook。当仓库中发生新的推送时，此 Webhook 将用于通知 Jenkins。\n\n为此，请执行以下步骤：\n\n\
  - 1. 在 GitHub 仓库中，转到 **设置 | Webhook** 菜单。\n- 2. 单击 **添加 Webhook** 按钮。\n- 3. 在 **有效载荷\
  \ URL** 字段中，填写 Jenkins 的 URL 地址，后跟 /github-webhook/，保持密钥输入不变，并选择 **仅推送事件** 选项。\n\
  - 4. 验证 Webhook。\n\n以下截图显示了为 Jenkins 配置 GitHub Webhook 的过程：\n\n![](img/d3344b39c888aab0b832625465f837c9_226_0.png)\n\
  \n图 7.8 – Jenkins 的 GitHub Webhook 配置\n\n- 5. 最后，我们可以在 GitHub 界面上检查 Webhook 是否已正确配置并与\
  \ Jenkins 通信，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_226_1.png)\n\n图\
  \ 7.9 – GitHub Webhook 验证\n\nGitHub 的配置已完成。我们现在将在 Jenkins 中创建一个新的 CI 作业。\n\n###\
  \ 配置 Jenkins CI 作业\n\n要配置 Jenkins，请执行以下步骤：\n\n- 1. 首先，我们将通过单击 **新建项目** 或 **创建新作业**\
  \ 链接来创建一个新作业，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_227_0.png)\n\n图\
  \ 7.10 – 在 Jenkins 中创建新作业\n\n- 2. 在作业配置表单中，输入作业名称（例如，`demoCI`），并选择 **自由风格项目** 模板，然后通过单击\
  \ **确定** 进行验证，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_227_1.png)\n\n\
  图 7.11 – Jenkins 作业名称\n\n\n\n\n\n### 3. 然后，我们使用以下参数配置作业：\n\n- 在 **GitHub 项目** 输入框中，输入\
  \ GitHub 仓库的 URL，如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_228_0.png)\n\n\
  图 7.12 – Jenkins 作业：GitHub\n\n- 在 **源代码管理** 部分，输入 GitHub 仓库的 URL 和代码分支，如下所示：\n\n\
  ![](img/d3344b39c888aab0b832625465f837c9_228_1.png)\n\n图 7.13 – Jenkins 作业：GitHub\
  \ 配置\n\n- 在 **构建触发器** 部分，勾选 **GitHub hook trigger for GITScm polling** 复选框，如下所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_229_0.png)\n\n图 7.14 – Jenkins 作业：GitHub\
  \ hook 触发器\n\n- 在 **构建** 部分，在 **添加构建步骤** 下拉列表中，我们将为本实验选择 **执行 Shell** 步骤。您可以根据需要向\
  \ CI 添加尽可能多的操作（编译、文件复制和测试）。您可以在下面的屏幕截图中看到一些可能操作的示例：\n\n![](img/d3344b39c888aab0b832625465f837c9_229_1.png)\n\
  \n图 7.15 – Jenkins 作业：添加构建步骤\n\n- 在 Shell 命令文本框中，我们输入 `printenv` 命令，以便在作业管道执行期间执行，如下面的屏幕截图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_230_0.png)\n\n图 7.16 – Jenkins 作业命令步骤示例\n\
  \n- 4. 然后，单击 **应用**，再单击 **保存** 按钮完成配置。\n\n我们的 Jenkins CI 作业现已创建，并配置为在提交时触发，并执行各种操作。\n\
  \n我们将手动运行它以测试其正常运行情况。\n\n### 执行 Jenkins 作业\n\n要测试作业执行，我们将执行以下步骤：\n\n- 1. 首先，我们将修改\
  \ GitHub 仓库的代码——例如，通过修改 `Readme.md` 文件。\n\n- 2. 然后，直接从 GitHub Web 界面提交到 master 分支。\n\
  \n- 3. 在提交后，我们在 Jenkins 中看到的是 `DemoCI` 作业已排队并正在运行。\n\n### 永久链接\n\n- 上一次构建 (#4)，18\
  \ 秒前\n- 上一次稳定构建 (#4)，18 秒前\n- 上一次成功构建 (#4)，18 秒前\n- 上一次完成构建 (#4)，18 秒前\n\n下面的屏幕截图显示了作业执行队列：\n\
  \n图 7.17 – Jenkins 作业运行历史记录\n\n4. 单击作业，然后单击 **控制台输出** 菜单的链接，我们可以查看作业执行日志，如下面的屏幕截图所示：\n\
  \n图 7.18 – Jenkins 作业控制台输出\n\n我们刚刚在 Jenkins 中创建了一个 CI 作业，它在 Git 仓库（在我们的示例中为 GitHub）提交时运行。\n\
  \n在本节中，我们介绍了在 Jenkins 中创建管道的过程。现在，让我们看看如何使用另一种 DevOps 工具：Azure Pipelines 来创建 CI/CD\
  \ 管道。\n\n![](img/d3344b39c888aab0b832625465f837c9_231_0.png)\n\n![](img/d3344b39c888aab0b832625465f837c9_231_1.png)\n\
  \n### 使用 Azure Pipelines 进行 CI/CD\n\nAzure Pipelines 是 Azure DevOps 提供的服务之一。它以前称为\
  \ **Visual Studio Team Services (VSTS)**。\n\nAzure DevOps 是 Microsoft 提供的完整 DevOps\
  \ 平台，可通过 Web 浏览器完全访问，无需安装。它非常有用，原因如下：\n\n- DevOps 工具在 **版本控制系统 (VCS)** 中管理其代码。\n\
  - 它以敏捷模式管理项目。\n- 它在 CI/CD 管道中部署应用程序，以集中管理软件包。\n- 它执行手动测试计划。\n\n这些功能中的每一个都组合成服务，如下表所示：\n\
  \n| 服务名称 | 描述 | 文档链接 |\n|---|---|---|\n| Azure Repos | 这是我们在上一章中介绍的 VCS。 | [https://azure.microsoft.com/en-us/services/devops/repos/](https://azure.microsoft.com/en-us/services/devops/repos/)\
  \ |\n| Azure Boards | 这是一种用于敏捷模式下项目管理的服务，包含冲刺、待办事项列表和看板。 | [https://azure.microsoft.com/en-us/services/devops/boards/](https://azure.microsoft.com/en-us/services/devops/boards/)\
  \ |\n| Azure Pipelines | 这是一种允许管理 CI/CD 管道的服务。 | [https://azure.microsoft.com/en-us/services/devops/pipelines/](https://azure.microsoft.com/en-us/services/devops/pipelines/)\
  \ |\n| Azure Artifacts | 这是一个私有包管理器。 | [https://azure.microsoft.com/en-us/services/devops/artifacts/](https://azure.microsoft.com/en-us/services/devops/artifacts/)\
  \ |\n| Azure Test Plans | 这允许您创建和管理手动测试计划。 | [https://azure.microsoft.com/en-us/services/devops/test-plans/](https://azure.microsoft.com/en-us/services/devops/test-plans/)\
  \ |\n\n表 7.1 – Azure DevOps 服务列表\n\nAzure DevOps 对最多五名用户免费。超过此数量后，有按用户收费的许可证版本。有关许可的更多信息，请参阅\
  \ https://azure.microsoft.com/en-us/pricing/details/devops/azure-devops-services/\
  \ 上的产品说明，其中还包含一个计算器，可用于估算团队的成本。\n\n> 注意\n> 还有一种 **Azure DevOps Server**，它与 Azure\
  \ DevOps 是同一产品，但本地安装。要了解这两种产品之间的区别，请阅读此处的文档：https://docs.microsoft.com/en-us/azure/devops/user-guide/about-azure-devops-services-tfs?view=azure-devops。\n\
  \n要注册 Azure DevOps 并创建名为组织的帐户，我们需要 Microsoft Live 帐户或 GitHub 帐户，然后执行以下步骤：\n\n1.\
  \ 在浏览器中，访问此 URL：https://azure.microsoft.com/en-us/services/devops/。\n2. 单击 **登录**\
  \ 按钮。\n3. 在下一页，选择要使用的帐户（**Live** 或 **GitHub**）。\n4. 注册后，建议的第一步是创建一个具有唯一名称的组织，并选择\
  \ Azure 位置——例如，组织名称为 BookLabs，位置为 `West Europe`。\n5. 在此组织中，我们现在可以创建带有 CI/CD 管道的项目，就像我们在\
  \ _第 6 章，使用 Git 管理源代码_ 中学到的那样。\n\n在本实验中，我们将展示如何设置 **端到端 (E2E)** CI 和 CD 管道，首先使用\
  \ Azure Repos 对代码进行版本控制。然后，在 Azure Pipelines 中，我们将介绍 CI 流程，并以应用程序在发布中的自动部署结束。\n\n\
