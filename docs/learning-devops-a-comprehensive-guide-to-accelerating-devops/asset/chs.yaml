  以下是仓库所有者可以对此拉取请求执行的不同操作：


  - 通过单击 **Files changed** 选项卡，审阅者可以查看对代码所做的更改，并在每个修改的行上留下注释。

  - 审阅者或仓库所有者可以就代码更改发起讨论，并单击 **Comment** 按钮来验证他们的评论。

  - 如果所有者对代码更改满意，他们可以单击 **Merge pull request** 按钮来执行合并。

  - 另一方面，如果所有者不满意并拒绝拉取请求，他们可以单击 **Close pull request** 按钮，此时请求将被关闭。

  - 我们还可以执行一些自动化检查。


  合并后，拉取请求将具有 **Merged** 状态，原始仓库的代码将使用我们所做的代码更改进行更新。


  在本节中，我们了解到，通过拉取请求，我们有一种简单的方法来为 GitHub 上的开源项目做出贡献，即提出代码更改。然后，项目所有者可以接受此拉取请求并合并代码，或者拒绝这些更改。在下一节中，我们将学习如何使用
  changelog 文件来管理我们对项目所做的更改。


  ### 管理 changelog 文件和发行说明


  当我们将项目作为开源项目托管时，最好在更改发生时向用户提供有关正在应用到项目的更改的信息。如果除了源代码之外，我们的仓库还公开提供应用程序的二进制文件，那么此更改日志系统（也称为
  **release notes**）就更加重要，因为该二进制文件的使用取决于其不同的版本和代码更改。


  从逻辑上讲，我们可以通过浏览 Git 提交历史来找到代码更改的历史记录。但是，对于 Git 新手来说，这将过于繁琐且耗时。出于这些原因，我们将在文本文件中以代码版本的形式指示历史记录中的更改。此文件没有固定的命名法或形式，但为简单起见，我们决定将其称为
  `CHANGELOG.md`。


  因此，此 changelog 文件是一个 markdown 格式的文本文件，可以使用简单的格式轻松编辑，并放置在仓库的根目录下。在此文件中，更改历史记录以列表形式提供，不会透露每个更改的太多细节。


  为了更好的可见性，最近更改的历史记录将按从新到旧的顺序排列，以便我们可以快速访问最新更改。为了让您了解 changelog 文件的形状，以下是一张截图，显示了
  Azure Terraform 提供程序的 changelog 文件中的摘录：


