  \ Azure Repos 中通过以下步骤完成此操作：\n\n1. 要开始本实验，我们将创建一个新项目；此操作已在 _第 6 章，使用 Git 管理源代码_ 的\
  \ _开始使用 Git 流程_ 部分中介绍过。\n\n2. 然后，在 Azure Repos 中，我们将使用存储库菜单的 **导入存储库** 选项从另一个 Git\
