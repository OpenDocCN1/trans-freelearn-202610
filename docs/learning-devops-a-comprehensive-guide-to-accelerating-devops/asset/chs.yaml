  \ – 执行 terraform plan 命令\n\n在执行 plan 命令期间，该命令会显示将受更改影响的资源的名称和属性。它还显示新资源的数量、将被修改的资源数量以及将被删除的资源数量。\n\
  \n### 应用更改\n\n在验证 `plan` 命令的结果符合我们的预期后，最后一步是实时应用 Terraform 代码以预配并将更改应用到我们的基础设施。\n\
  \n为此，我们将执行 `apply` 命令：\n\n```\nterraform apply\n```\n\n此命令执行与 `plan` 命令相同的操作，并交互式地询问用户确认我们是否要实施更改。\n\
  \n以下是 `terraform apply` 确认的截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_76_0.png)\n\
  \n图 2.13 – Terraform 中要应用的更改的确认\n\n确认是通过输入 `yes`（或输入 `no` 以取消）给出的，然后 Terraform 将更改应用到基础设施。\n\
  \n### 重要提示\n\n有关 `plan` 命令行的更多信息，请参阅 https://www.terraform.io/docs/commands/plan.html\
  \ 中的文档。\n\n因此，我们刚刚看到了将要应用到我们基础设施的更改预测。现在，我们将查看如何应用它们。\n\n\n\n\n\n### 以下是 terraform\
  \ apply 执行的截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_77_0.png)\n\n### 图 2.14\
  \ – 执行 terraform apply 命令\n\napply 命令的输出显示 Terraform 执行的所有操作，以及所有更改和受影响的资源。它以一行摘要结束，显示添加、更改或销毁的资源总数。\n\
  \n> Important Note\n> \n> 有关 apply 命令行的更多信息，请参阅 https://www.terraform.io/docs/commands/apply.html\
  \ 上的文档。\n\n由于 Terraform apply 命令已正确执行，我们可以在 Azure 门户中检查 Terraform 代码中描述的资源是否存在。\n\
  \n### 以下是 Terraform 创建的 Azure 资源的截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_77_1.png)\n\
  \n### 图 2.15 – 已预配的 Azure 资源列表\n\n我们可以从门户中看到，Terraform 代码中指定的资源已成功预配。\n\n因此，我们刚刚学习了如何使用三个主要命令通过\
  \ Terraform 预配基础架构：\n\n- `init` 命令用于初始化上下文\n- `plan` 命令用于预览更改\n- `apply` 命令用于应用更改\n\
  \n在下一节中，我们将探讨其他 Terraform 命令和 Terraform 生命周期。\n\n### 使用不同命令行选项了解 Terraform 生命周期\n\
  \n我们刚刚发现，使用 Terraform 对基础架构应用更改主要是通过三个命令完成的。它们包括 `init`、`plan` 和 `apply` 命令。但是，Terraform\
  \ 有其他非常实用且重要的命令，可用于最佳管理我们基础架构的生命周期，并且必须考虑如何在 CI/CD 管道等自动化上下文中执行 Terraform。\n\n可以对一段基础架构执行的其他操作之一是通过删除资源来清理资源。这样做是为了更好地重建或删除临时基础架构。\n\
  \n### 使用 destroy 更好地重建\n\n由 IaC 维护的基础架构生命周期中的一个步骤是删除基础架构；不要忘记，IaC 的目标和优势之一是能够快速更改基础架构，也可以按需创建环境。也就是说，我们创建并保留环境，只要我们需要它们，当它们不再使用时，我们将销毁它们，从而使公司能够节省资金。\n\
  \n为了实现这一点，有必要自动化基础架构的删除，以便能够快速重建它。\n\n要销毁之前使用 Terraform 预配的基础架构，请执行以下命令：\n\n```\n\
  terraform destroy\n```\n\n执行此命令应给出以下输出：\n\n```\nroot@vm:/mnt/d/DevOps/Learning-DevOps/CHAP02/terraform_separate_files$\
  \ terraform destroy\nazurerm_resource_group.rg: Refreshing state... [ID /subscriptions/1da42ac9-ee3e-4fdb-b294-f7a607f589d5/resourceGroups/bookRg]\n\
  azurerm_storage_account.stor: Refreshing state... [ID /subscriptions/1da42ac9-ee3e-4fdb-b294-...\
  \ /storageAccounts/bookstorage123]\nazurerm_public_ip.pip: Refreshing state... [ID\
  \ /subscriptions/1da42ac9-ee3e-4fdb-b294-... soft.Network/publicIPAddresses/book-ip]\n\
  azurerm_virtual_network.vnet: Refreshing state... [ID /subscriptions/1da42ac9-ee3e-4fdb-b294-...\
  \ /virtualNetworks/book-vnet]\nazurerm_subnet.subnet: Refreshing state... [ID /subscriptions/1da42ac9-ee3e-4fdb-b294-...\
  \ /subnets/book-subnet]\nazurerm_network_interface.nic: Refreshing state... [ID\
  \ /subscriptions/1da42ac9-ee3e-4fdb-b294-...oft.Network/networkInterfaces/book-nic]\n\
  azurerm_virtual_machine.vm: Refreshing state... [ID /subscriptions/1da4ac9-ee3e-4fdb-b294-...crosoft.Compute/virtualMachines/bookvm]\n\
  \nAn execution plan has been generated and is shown below.\nResource actions are\
  \ indicated with the following symbols:\n  - destroy\n\nTerraform will perform the\
  \ following actions:\n\n  - azurerm_network_interface.nic\n\n  - azurerm_public_ip.pip\n\
  \n  - azurerm_resource_group.rg\n\n  - azurerm_storage_account.stor\n\n  - azurerm_subnet.subnet\n\
  \n  - azurerm_virtual_machine.vm\n\n  - azurerm_virtual_network.vnet\n\nPlan: 0\
  \ to add, 0 to change, 7 to destroy.\n\nDo you really want to destroy all resources?\n\
  \  Terraform will destroy all your managed infrastructure, as shown above.\n  There\
  \ is no undo. Only 'yes' will be accepted to confirm.\n\n  Enter a value: yes\n\n\
  azurerm_resource_group.rg: Still destroying... [ID /subscriptions/1da42ac9-ee3e-4fdb-b294-f7a607f589d5/resourceGroups/bookRg,\
  \ 2m40s elapsed]\nazurerm_resource_group.rg: Destruction complete after 2m47s\n\n\
  Destroy complete! Resources: 7 destroyed.\n```\n\n图 2.16 – 确认 terraform destroy\
  \ 命令\n\n此命令与 apply 一样，在应用销毁之前需要用户确认：\n\n```\nazurerm_resource_group.rg: Still destroying...\
  \ [ID /subscriptions/1da42ac9-ee3e-4fdb-b294-f7a607f589d5/resourceGroups/bookRg,\
  \ 2m40s elapsed]\nazurerm_resource_group.rg: Destruction complete after 2m47s\n\n\
  Destroy complete! Resources: 7 destroyed.\n```\n\n图 2.17 – 执行 terraform destroy\
  \ 命令\n\n验证后，等待确认消息，表明基础架构已被销毁。\n\ndestroy 命令仅销毁当前 Terraform 配置中配置的资源。其他资源（手动创建或由其他\
  \ Terraform 代码创建）不受影响。但是，如果我们的 Terraform 代码提供了一个资源组，它将销毁其所有内容。\n\n### 格式化和验证配置\n\
  \n学习如何使用 Terraform 销毁资源后，强调拥有符合 Terraform 样式规则的格式良好的代码的重要性，并验证代码不包含语法或变量错误也很重要。\n\
  \n### 格式化代码\n\nTerraform 有一个命令，允许代码与 Terraform 的样式和约定正确对齐。\n\n以下命令自动格式化代码：\n\n```\n\
  terraform fmt\n```\n\n以下是 Terraform 排列的文件的截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_80_0.png)\n\
  \n该命令重新格式化代码，并指示排列好的文件列表。\n\n> Important Note\n> \n> 有关 Terraform 样式指南的更多信息，请参阅\
  \ https://www.terraform.io/docs/configuration/style.html。此外，有关 terraform fmt 命令行的信息，请参阅\
  \ https://www.terraform.io/docs/commands/fmt.html。\n\n### 验证代码\n\n同样，Terraform 有一个命令来验证代码，并允许我们在执行\
  \ `plan` 命令或 `apply` 命令之前检测可能的错误。\n\n让我们考虑以下代码片段的示例：\n\n```\nresource \"azurerm_public_ip\"\
  \ \"pip\" {\n  name = var.ip-name\n  location = var.location\n  resource_group_name\
  \ = \"${azurerm_resource_group.rg.name}\"\n  allocation_method = \"Dynamic\"\n \
  \ domain_name_label = \"bookdevops\"\n}\n```\n\n在 `name` 属性中，我们使用了一个未声明或未实例化任何值的\
  \ `ip-name` 变量。\n\n执行 `terraform plan` 命令应返回错误：\n\n![](img/d3344b39c888aab0b832625465f837c9_81_0.png)\n\
  \n图 2.19 – 带有错误的 terraform plan 命令\n\n由于此错误，在 CI/CD 过程中，可能会延迟基础架构的部署。\n\n为了尽早检测\
  \ Terraform 代码中的错误，请在开发周期中执行以下命令。这将验证目录中的所有 Terraform 文件：\n\n```\nterraform validate\n\
  ```\n\n以下截图显示了此命令的执行：\n\n![](img/d3344b39c888aab0b832625465f837c9_81_1.png)\n\n\
  图 2.20 – 执行 terraform validate 命令\n\n在这里，我们观察到与 `plan` 命令返回的相同错误。\n\n我们刚刚发现了 Terraform\
  \ 的主要命令行。让我们深入了解一下将 Terraform 集成到 CI/CD 过程中的内容。\n\n\n\n\n\n### CI/CD 流程中的 Terraform\
  \ 生命周期\n\n到目前为止，我们已在本地计算机上查看并执行了各种 Terraform 命令，这些命令允许我们初始化、预览、应用和销毁基础架构，以及格式化和验证\
  \ Terraform 代码。在本地使用 Terraform（在开发环境中）时，执行生命周期如下：\n\n![](img/d3344b39c888aab0b832625465f837c9_82_0.png)\n\
  \n图 2.21 – Terraform CICD 流程\n\n以下步骤说明了前面图表中的顺序：\n\n- 代码开发\n- 使用 `terraform fmt`\
  \ 格式化代码\n- 使用 `terraform init` 初始化\n- 使用 `terraform validate` 验证代码\n- 使用 `terraform\
  \ plan` 进行规划\n- 手动验证基础架构上的 Terraform 更改\n\n但是，IaC 类似于应用程序，必须在自动化 CI/CD 流程中部署或执行。这始于团队成员的\
  \ Terraform 代码归档。然后，它触发 CI 并执行我们在本章中学习的 Terraform 命令。\n\n以下是 CI/CD 自动化中 Terraform\
  \ 生命周期的屏幕截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_83_0.png)\n\n图 2.22 – Terraform\
  \ CICD 工作流\n\nCI 服务器（已安装 Terraform）为 Terraform 执行 CI/CD 的步骤如下：\n\n- 从 SCM 检索代码\n\
  - 使用 `terraform fmt` 格式化代码\n- 使用 `terraform init` 初始化\n- 使用 `terraform validate`\
  \ 验证代码\n- 使用 `terraform plan -out-out.tfplan` 显示基础架构更改的预览\n- 使用 `terraform apply\
  \ --auto-approve out.tfplan` 在自动模式下应用更改\n\n通过向 `apply` 和 `destroy` 命令添加 `--auto-approve`\
  \ 选项，Terraform 也可以在自动模式下执行。这是为了避免向用户请求确认以验证需要应用的更改。通过这种自动化，Terraform 可以与 CI/CD 工具集成。\n\
  \n在 `plan` 命令中，添加了 `out` 选项以指定带有 `.tfplan` 格式的文件，该文件包含 `plan` 命令的输出。然后，`apply` 命令使用此\
  \ `out.tfplan` 文件。此过程的优点是可以在以后的计划上执行应用程序，这可用于回滚情况。\n\n在本节中，我们了解到，除了常规的 `init`、`plan`、`apply`\
  \ 和 `destroy` Terraform 命令外，Terraform 还具有允许我们改善代码可读性并验证代码语法的选项。此外，我们解释了 Terraform\
  \ 允许与 CI/CD 管道完美集成，具有生命周期和自动化选项。\n\n在下一节中，我们将研究 `tfstate` 文件是什么以及如何使用远程后端保护它。\n\n\
  ### 使用远程后端保护状态文件\n\n当 Terraform 处理资源时，它会将这些资源的状态写入 Terraform 状态文件。该文件采用 JSON 格式，并在\
  \ Terraform 执行过程中保留资源及其属性。\n\n默认情况下，名为 `terraform.tfstate` 的文件在首次执行 `apply` 命令时在本地创建。然后，每次执行\
  \ `plan` 命令时，Terraform 都会使用它，以将其状态（写入状态文件中）与目标基础架构的状态进行比较。最后，它将返回将要应用内容的预览。\n\n\
  在企业中使用 Terraform 时，本地存储的此状态文件会带来许多问题：\n\n- 由于该文件包含基础架构的状态，因此不应删除。如果删除，执行 Terraform\
  \ 时可能无法按预期运行。\n- 它必须同时可供处理同一基础架构资源的所有团队成员访问。\n- 该文件可能包含敏感数据，因此必须安全。\n- 当预配多个环境时，需要能够使用多个状态文件。\n\
  \n鉴于所有这些要点，无法在本地保留此状态文件，甚至无法将其归档到 SCM 中。\n\n为了解决此问题，Terraform 允许将此状态文件存储在名为远程后端的共享安全存储中。\n\
  \n> **重要说明**\n> Terraform 支持多种类型的远程后端；完整列表可在 https://www.terraform.io/docs/backends/types/remote.html\
  \ 上查看。\n\n在我们的案例中，我们将使用 azurerm 远程后端，通过存储帐户和状态文件的 Blob 来存储状态文件。\n\n因此，我们将分三步实现和使用远程后端：\n\
  \n- 创建存储帐户\n- 远程后端的 Terraform 配置\n- 使用此远程后端执行 Terraform\n\n让我们详细了解这些步骤的执行过程：\n\n\
  1. 若要创建 Azure 存储帐户和 Blob 容器，可以使用 Azure 门户（https://docs.microsoft.com/en-gb/azure/storage/common/storage-quickstart-create-account?tabs=azure-portal）或\
  \ az cli 脚本：\n\n```\n### 1-Create resource group\naz group create --name MyRgRemoteBackend\
  \ --location westeurope\n### 2-Create storage account\naz storage account create\
  \ --resource-group MyRgRemoteBackend --name storageremotetf --sku Standard_LRS --encryption-services\
  \ blob\n### 3-Get storage account key\nACCOUNT_KEY=$(az storage account keys list\
  \ --resource-group MyRgRemoteBackend --account-name storageremotetf --query [0].value\
  \ -o tsv)\n### 4-Create blob container\naz storage container create --name tfbackends\
  \ --account-name storageremotetf --account-key $ACCOUNT_KEY\n```\n\n此脚本创建一个名为 MyRgRemoteBackend\
  \ 的资源组和一个名为 storageremotetf 的存储帐户。然后，脚本从存储帐户中检索帐户密钥，并在该存储帐户内创建名为 tfbackends 的 Blob\
  \ 容器。此脚本可以在 Azure Cloud Shell 中运行，使用脚本而非 Azure 门户的优势在于，该脚本可以集成到 CI/CD 流程中。\n\n2.\
  \ 然后，要配置 Terraform 以使用先前创建的远程后端，需要在 Terraform.tf 文件中添加配置部分：\n\n```\nterraform {\n\
  \ backend \"azurerm\" {\n storage_account_name = \"storageremotetfdemo\"\n container_name\
  \ = \"tfbackends\"\n key = \"myappli.tfstate\"\n snapshot = true\n }\n}\n```\n\n\
  storage_account_name 属性包含存储帐户的名称，container_name 属性包含容器名称，key 属性包含 Blob 状态对象的名称，snapshot\
  \ 属性在每次 Terraform 执行时对此 Blob 对象启用快照。\n\n但是，仍需向 Terraform 提供另一条配置信息，以便它能够连接并拥有存储帐户的权限。此信息是访问密钥，即存储帐户上的私有身份验证和授权密钥。要向\
  \ Terraform 提供存储密钥，如同 Azure SP 信息一样，请设置带有存储帐户访问密钥值的 ARM_STORAGE_KEY 环境变量。\n\n以下是\
  \ Azure 存储访问密钥的屏幕截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_86_0.png)\n\n图\
  \ 2.23 – Azure 存储访问密钥\n\n> Important Note Terraform 支持存储帐户上的其他身份验证类型，例如使用 SAS 令牌或使用\
  \ SP。有关如何为 azurerm 远程后端配置 Terraform 的更多信息，请参阅 https://www.terraform.io/docs/backends/types/azurerm.html\
  \ 上的文档。\n\n3. 最后，一旦 Terraform 配置完成，即可使用此新远程后端运行 Terraform。在 `init` 期间，Terraform\
  \ 初始化状态文件的上下文。默认情况下，`init` 命令保持不变，即 `terraform init`。\n\n但是，如果使用多个 Terraform 状态来管理多个环境，则可以在\
  \ `.tf` 文件中使用简化代码创建多个远程后端配置：\n\n```\nterraform {\nbackend \"azurerm\" {}\n}\n```\n\
  \n然后，创建多个仅包含后端属性的 `backend.tfvars` 文件。\n\n这些 `backend` 属性是存储帐户名称、Blob 容器名称和状态文件的\
  \ Blob 名称：\n\n```\nstorage_account_name = \"storageremotetf\"\ncontainer_name =\
  \ \"tfbackends\"\nkey = \"myappli.tfstate\"\nsnapshot = true\n```\n\n在此场景中，执行 `init`\
  \ 命令时，可以使用以下命令指定要使用的 `backend.tfvars` 文件：\n\n```\nterraform init -backend-config=\"\
  backend.tfvars\"\n```\n\n`-backend-config` 参数是后端配置文件的路径。\n\n就我个人而言，我更喜欢这种做法，因为它允许我通过将后端属性的值外部化来解耦代码，从而提高代码的可读性。\n\
  \n\n\n\n\n### 那么，以下是 Terraform 的执行过程：\n\n![](img/d3344b39c888aab0b832625465f837c9_88_0.png)\n\
  \n图 2.24 – 带后端配置的 terraform init 命令\n\n在此执行过程中，我们可以查看 ARM_ACCESS_KEY 环境变量的导出，以及\
  \ Terraform init 命令，该命令通过 -backend-config 选项确定后端配置。\n\n使用此远程后端后，状态文件将不再本地存储，而是存储在存储账户上，这是一个共享空间。因此，它可以同时被多个用户使用。同时，此存储账户提供安全性来保护状态文件的敏感数据，并提供状态文件的备份或还原功能，这两者都是\
  \ Terraform 必不可少且至关重要的元素。\n\n> **注意**\n>\n> 本章的完整源代码可在 `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP02`\
  \ 获取，最终的 Terraform 代码位于 `terraform_vars_interp` 文件夹中。\n\n### 总结\n\n在本章关于 Terraform\
  \ 的内容中，我们了解到其安装可以手动完成，也可以使用脚本完成。\n\n要应用 Terraform，我们详细介绍了其配置的不同步骤，以使用 Azure 服务主体\
  \ (SP) 预配 Azure 基础设施。\n\n此外，我们逐步解释了其本地执行过程及其主要命令行，即 `init`、`plan`、`apply` 和 `destroy`，以及其在\
  \ CI/CD 流程中的生命周期。最后，我们通过查看 Azure 远程后端中的状态文件保护来结束本章。\n\n因此，Terraform 是一个符合基础设施即代码\
  \ (IaC) 原则的工具。Terraform 代码对用户来说可读且易于理解，其执行能很好地集成到 CI/CD 流水线中，从而允许您自动预配云基础设施。\n\n\
  在本书中，我们将继续讨论 Terraform，并补充其与 Packer、Azure Kubernetes 服务以及减少停机时间相关的内容。\n\n在下一章中，我们将探索\
  \ IaC 的下一步，即使用 Ansible 进行配置管理。我们将介绍其安装、用于配置预配虚拟机的用法，以及如何使用 Ansible Vault 保护机密。\n\
  \n### 问题\n\n- 1. Terraform 使用什么语言？\n- 2. Terraform 的作用是什么？\n- 3. Terraform 是一种脚本工具吗？\n\
  - 4. 哪个命令允许您显示已安装的版本？\n- 5. 使用 Terraform 管理 Azure 时，连接 Terraform 与 Azure 的 Azure\
  \ 对象名称是什么？\n- 6. Terraform 工作流的三个主要命令是什么？\n- 7. 哪个 Terraform 命令允许您销毁资源？\n- 8. 添加到\
  \ `apply` 命令的选项是什么，用于自动应用基础设施更改？\n- 9. Terraform 状态文件的用途是什么？\n- 10. 将 Terraform\
  \ 状态文件留在本地是一种好的做法吗？如果不是，应该怎么做？\n\n### 延伸阅读\n\n如果您想了解更多关于 Terraform 的信息，以下是一些资源：\n\
  \n- 官方 Terraform 文档：https://www.terraform.io/\n- Terraform 下载和安装信息：https://www.terraform.io/downloads.html\n\
  - Terraform Azure 提供程序：https://www.terraform.io/docs/providers/azurerm/index.html\n\
  - 官方 Azure Terraform 文档：https://docs.microsoft.com/en-us/azure/terraform/terraform-overview\n\
  - 书籍：Terraform Cookbook：https://www.packtpub.com/product/terraform-cookbook/9781800207554\n\
  - Terraform 入门指南，第二版：https://www.packtpub.com/networking-and-servers/getting-started-terraform-second-edition\n\
  - Terraform 在线学习：https://learn.hashicorp.com/terraform\n"
- "## 3 使用 Ansible 配置 IaaS 基础设施\n\n在上一章中，我们讨论了使用 Terraform 预配 Azure 云基础设施。如果该基础设施包含\
  \ **虚拟机** (VM)，一旦预配完成，就需要配置其系统并安装所有必要的中间件。这种配置对于将托管在 VM 上的应用程序正常运行是必要的。\n\n有几种 **基础设施即代码**\
  \ (IaC) 工具可用于配置 VM，其中最著名的是 Ansible、Puppet、Chef、SaltStack 和 PowerShell DSC。其中，来自\
  \ Red Hat 的 Ansible (`https://www.ansible.com/overview/it-automation`) 凭借其众多优势脱颖而出，具体如下：\n\
  \n- 它是声明式的，并使用易于阅读的 YAML 语言。\n- Ansible 只使用一个可执行文件。\n- 它不需要在要配置的 VM 上安装代理。\n- Ansible\
  \ 连接到远程 VM 只需要简单的 SSL/WinRM 连接。\n- 它具有模板引擎和保险库，用于加密/解密敏感数据。\n- 它是幂等的。\n\nAnsible\
  \ 的主要用例如下：\n\n- 配置带有中间件和加固的 VM（我们将在本章中学习）\n- 基础设施预配，例如 Terraform，但使用 YAML 配置\n-\
  \ 安全合规性，以测试系统或网络配置是否符合企业要求\n\n在本章中，我们将学习如何安装 Ansible，然后使用它配置带有清单和剧本的 VM。我们还将学习如何在讨论如何在\
  \ Azure 中使用动态清单之前，使用 Ansible Vault 保护敏感数据。\n\n本章将涵盖以下主题：\n\n- 安装 Ansible\n- 创建 Ansible\
  \ 清单\n- 执行第一个剧本\n- 执行 Ansible\n- 使用 Ansible Vault 保护数据\n- 为 Azure 基础设施使用动态清单\n\n\
  ### 技术要求\n\n要跟随本章学习，您必须满足以下技术要求：\n\n- 要安装 Ansible，我们需要一个操作系统，例如 Red Hat、Debian、CentOS、macOS\
  \ 或任何 BSD 系统。对于 Windows 用户，可以安装 **适用于 Linux 的 Windows 子系统 (WSL)**；请参阅文档 `https://docs.microsoft.com/en-us/windows/wsl/install-win10`。\n\
  - 运行 Ansible 的机器上必须安装 Python 2（版本 2.7）或 Python 3（版本 3.5+）。您可以在此处下载：`https://www.python.org/downloads/`。有关\
  \ Ansible 要求的更多信息，请参阅此处的文档：`https://docs.ansible.com/ansible/latest/installation_guide/intro_installation.html#control-node-requirements`。\n\
  - Ansible 剧本使用 YAML 配置文件，因此任何代码编辑器都可以；但是，我们将使用 Visual Studio Code，因为它非常合适。您可以在此处下载：https://code.visualstudio.com/。\n\
  - 本章的大部分内容不会专注于特定的云提供商，除了最后关于 Azure 的部分。为此，我们需要一个 Azure 订阅，可以在此处免费获取：https://azure.microsoft.com/en-us/free/。\n\
  - 要运行 Azure 的 Ansible 动态清单，我们需要安装 Azure Python SDK：https://docs.microsoft.com/en-us/azure/python/python-sdk-azure-install?view=azure-python。\n\
  - 本章的完整源代码可在此处获取：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP03。\n\
  \n查看以下视频，观看代码实际运行情况：\nhttps://bit.ly/3HdwbVc。\n\n### 安装 Ansible\n\n在开始使用 Ansible\
  \ 之前，我们必须知道可以在哪些操作系统上使用它，以及如何安装和配置它。然后，我们必须了解围绕其运行所需的工件的一些概念。\n\n在本节中，我们将了解如何在本地或服务器机器上安装\
  \ Ansible，以及如何将 Ansible 集成到 Azure Cloud Shell 中。然后，我们将讨论构成 Ansible 的不同元素或工件。最后，我们将配置\
  \ Ansible。\n\n要开始，我们将学习如何使用自动脚本下载和安装 Ansible。\n\n### 使用脚本安装 Ansible\n\n与 Terraform\
  \ 不同，Ansible 不是跨平台的，只能安装在 Red Hat、Debian、CentOS、macOS 或任何 BSD 系统上。您使用脚本进行安装，该脚本根据操作系统而有所不同。\n\
  \n例如，要在 Ubuntu 上安装最新版本，我们必须在 Bash 终端中运行以下脚本：\n\n```bash\nsudo apt-get update\nsudo\
  \ apt-get install software-properties-common\nsudo apt-add-repository --yes --update\
  \ ppa:ansible/ansible\nsudo apt-get install ansible\n```\n\n\n\n\n\n### 重要提示\n\n\
  此脚本也可在此处查看：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP03/install_ansible_ubuntu.sh。\n\
  \n此脚本会更新必要的软件包，安装 software-properties-common 依赖项，添加 Ansible 仓库，并安装最新版本的 Ansible。\n\
  \n### 重要提示\n\n所有发行版类型的 Ansible 安装脚本均可在此处查看：https://docs.ansible.com/ansible/latest/installation_guide/intro_installation.html#installing-ansible-on-specific-operating-systems。\n\
  \n要在 Windows 操作系统计算机上本地安装 Ansible，没有原生解决方案，但可以在本地 VirtualBox 虚拟机或 WSL 上安装。WSL 允许使用\
  \ Windows 操作系统的开发人员直接在其工作站上测试脚本和应用程序，而无需安装虚拟机。\n\n### 重要提示\n\n阅读本文以了解如何在本地 VirtualBox\
  \ 环境中安装 Ansible：https://phoenixnap.com/kb/install-ansible-on-windows。有关 WSL 的更多详细信息，请阅读此处的文档：https://docs.microsoft.com/en-us/windows/wsl/about。\n\
  \n要测试是否已成功安装，我们可以运行以下命令来检查其已安装的版本：\n\n```\nansible --version\n```\n\n执行此命令的结果会提供有关已安装的\
  \ Ansible 版本的一些信息，如下所示：\n\n```\nmikael@VmAnsible:~$ ansible --version\nansible 2.8.3\n\
  config file = /etc/ansible/ansible.cfg\nconfigured module search path = [u'/home/mikael/.ansible/plugins/modules',\
  \ u'/usr/share/ansible/plugins/modules']\nansible python module location = /usr/lib/python2.7/dist-packages/ansible\n\
  executable location = /usr/bin/ansible\npython version = 2.7.15+ (default, Oct 7\
  \ 2019, 17:39:04) [GCC 7.4.0]\n```\n\n图 3.1 – ansible --version 命令\n\n要显示所有 Ansible\
  \ 命令和选项的列表，请使用 `--help` 参数执行 `ansible` 命令：\n\n```\nansible --help\n```\n\n以下屏幕截图显示了此命令的执行情况：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_95_0.png)\n\n图 3.2 – `ansible --help`\
  \ 命令\n\n如我们所见，在本地或远程计算机上安装 Ansible 非常简单，并且可以通过脚本实现自动化。如果我们在 Azure 中部署基础架构，也可以使用\
  \ Ansible，因为它已集成到 Azure Cloud Shell 中。\n\n现在，让我们看看 Ansible 是如何集成到 Azure Cloud Shell\
  \ 中的。\n\n### 将 Ansible 集成到 Azure Cloud Shell 中\n\n如我们在 _第 2 章，使用 Terraform 部署云基础架构_\
  \ 中所学，**Azure Cloud Shell** 集成了第三方工具，这些工具可在 Azure 中使用，而无需在 VM 上安装它们。其中的工具包括 Terraform（我们在上一章中详细介绍过），还有\
  \ Ansible，Microsoft 已将其集成，以允许我们自动配置托管在 Azure 上的 VM。\n\n要在 Azure 云中使用 Ansible，我们必须执行以下操作：\n\
  \n- 连接到 `https://portal.azure.com` 的 Azure 门户。\n- 打开 Cloud Shell。\n- 选择 Bash 模式。\n\
  - 在打开的终端中，我们现在可以访问所有 Ansible 命令。\n\n以下屏幕截图显示了 Azure Cloud Shell 中的 `ansible` 命令：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_96_0.png)\n\n图 3.3 – Azure Cloud Shell\
  \ 中的 Ansible\n\n这样，就可以在不安装任何软件的情况下使用 Ansible 进行开发和测试。\n\n此外，Ansible 具有允许我们预配 Azure\
  \ 基础架构（例如 Terraform，但本书不会涵盖 Ansible 的这一方面）的模块，因此其集成到 Azure Cloud Shell 中允许简化身份验证。\n\
  \n> **重要提示**\n> 有关将 Ansible 集成到 Azure Cloud Shell 的详细文档可在此处查看：`https://docs.microsoft.com/en-us/azure/ansible/ansible-run-playbook-in-cloudshell`。\n\
  \n在开始使用 Ansible 之前，我们将回顾本章中将一直使用的 Ansible 的重要概念（或工件）。\n\n### Ansible 工件\n\n要配置系统，Ansible\
  \ 需要几个主要工件：\n\n- **主机**：这些是 Ansible 将配置的目标系统；主机也可以是本地系统。\n- **清单**：这是一个 INI 或 YAML\
  \ 格式的文件，包含 Ansible 将执行配置操作的目标主机列表。此清单也可以是一个脚本，动态清单就是这种情况。\n\n> **重要提示**\n> 我们将在\
  \ _创建 Ansible 清单_ 部分中了解如何实现 Ansible 清单，而将在 _为 Azure 基础架构使用动态清单_ 部分中了解如何实现动态清单。\n\
  \n- **剧本**：这是将执行以配置主机的 Ansible 配置脚本。\n\n> **重要提示**\n> 我们将在本章后面的 _执行第一个剧本_ 部分中学习如何编写剧本。\n\
  \n在了解如何安装 Ansible 后，我们研究了 Ansible 的基本元素，即主机、清单和剧本。现在，让我们学习如何配置 Ansible。\n\n### 配置\
  \ Ansible\n\n默认情况下，Ansible 配置位于 `/etc/ansible/ansible.cfg` 文件中，该文件在安装 Ansible 时创建。此文件包含多个配置键，例如\
  \ SSL 连接、用户、协议、传输等。\n\n如前所述，此文件在安装 Ansible 时默认创建。为了帮助用户入门，初始内容被放置在其中。此内容包含大量被注释掉的配置键，因此不会被\
  \ Ansible 应用，但用户可以随时激活它们。\n\n> 注意\n> 如果我们在 Azure Cloud Shell 中使用 Ansible，则需要在 Azure\
  \ 云驱动器中手动创建此文件（ansible.cfg），并将 ANSIBLE_CONFIG 环境变量设置为创建的文件的路径。有关此环境变量的文档可在此处查看：https://docs.ansible.com/ansible/latest/reference_appendices/config.html#envvar-ANSIBLE_CONFIG。\n\
  \n以下屏幕截图显示了此 /etc/ansible/ansible.cfg 配置文件的摘录，其中包含一些注释中的键，如 # 符号所示：\n\n```\n###\
  \ config file for ansible -- https://ansible.com/\n### ==============================================\n\
  \n### nearly all parameters can be overridden in ansible-playbook\n### or with command\
  \ line flags. ansible will read ANSIBLE_CONFIG,\n### ansible.cfg in the current\
  \ working directory, .ansible.cfg in\n### the home directory or /etc/ansible/ansible.cfg,\
  \ whichever it\n### finds first\n\n[defaults]\n\n### some basic default values...\n\
  \n#inventory      = /etc/ansible/hosts\n#library        = /usr/share/my_modules/\n\
  #module_utils   = /usr/share/my_module_utils/\n#remote_tmp     = ~/.ansible/tmp\n\
  #local_tmp      = ~/.ansible/tmp\n#plugin_filters_cfg = /etc/ansible/plugin_filters.yml\n\
  #forks          = 5\n#poll_interval  = 15\n#sudo_user      = root\n#ask_sudo_pass\
  \  = True\n#ask_pass       = True\n#transport      = smart\n#remote_port    = 22\n\
  #module_lang    = C\n#module_set_locale = False\n```\n\n图 3.4 – Ansible 配置文件\n如果我们想更改默认的\
  \ Ansible 配置，可以修改此文件。\n\n> 重要提示\n> 有关所有 Ansible 配置键的更多详细信息，请参阅官方文档：https://docs.ansible.com/ansible/latest/reference_appendices/config.html#ansible-configuration-settings。\n\
  \n我们也可以使用 ansible-config 命令查看和修改此配置。例如，要显示 Ansible 配置文件，可以执行以下命令：\n\n```\nansible-config\
  \ view\n```\n\n以下屏幕截图显示了此命令的执行情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_99_0.png)\n\
  \n图 3.5 – 使用 CLI 查看 Ansible 配置\n\n在本节中，我们学习了如何安装 Ansible 并探索了一些 Ansible 工件。最后，我们研究了配置\
  \ Ansible 的不同方法。\n\n\n\n\n\n### 创建 Ansible 清单\n\n在下一节中，我们将详细介绍静态 Ansible 清单以及如何创建它以定位主机。\n\
  \n清单包含 Ansible 将执行管理和配置操作的主机列表。\n\n清单有两种类型：\n\n- **静态清单**：主机以 INI（或 YAML）格式列在文本文件中；这是\
  \ Ansible 清单的基本模式。当我们知道主机地址（IP 或 FQDN）时，会使用静态清单。\n\n- **动态清单**：主机列表由外部脚本动态生成（例如，使用\
  \ Python 脚本）。如果我们没有主机地址，例如，在由按需环境组成的基础架构中，则会使用动态清单。\n\n在本节中，我们将学习如何以 `init` 格式创建静态清单，从基本示例开始，然后我们将查看组和主机配置。\n\
  \n让我们先学习如何创建静态清单文件。\n\n### 清单文件\n\n为了在运行 playbook 时配置主机，Ansible 需要一个包含主机列表的文件；也就是说，目标机器的\
  \ IP 或 **完全限定域名（FQDN）** 地址列表。此主机列表记录在名为 **清单文件** 的静态文件中。\n\n默认情况下，Ansible 在安装过程中包含一个创建的清单文件；该文件是\
  \ `/etc/ansible/hosts`，其中包含多个清单配置示例。在我们的案例中，我们将手动在我们选择的目录中创建并填充此文件，例如 `devopsansible`。\n\
  \n让我们一步步来：\n\n1. 首先，我们必须使用以下基本命令创建目录：\n\n```bash\nmkdir devopsansible\ncd devopsansible\n\
  ```\n\n2. 现在，让我们创建一个名为 myinventory（不带扩展名）的文件，其中我们将写入目标主机的 IP 地址或 FQDN，如以下示例所示：\n\
  \n```\n192.10.14.10\nmywebserver.entreprise.com\nlocalhost\n```\n\n当基于此清单执行 Ansible\
  \ 时，它将在此清单中提到的所有主机上执行所有请求的操作（playbook）。\n\n> **重要说明**\n> 有关清单文件的更多信息，请阅读 https://docs.ansible.com/ansible/latest/user_guide/intro_inventory.html\
  \ 上的文档。\n\n但是，在企业中使用 Ansible 时，相同的 Ansible 代码（或 playbook）包含为应用程序的所有 VM 执行的配置操作。由于这些\
  \ VM 在应用程序中具有不同的角色，例如，应用程序由一个（或多个）Web 服务器和一个数据库服务器组成，我们必须将清单分开以按功能角色分离 VM。\n\n要在清单中按角色对\
  \ VM 进行分组，我们将 VM 组织到将在 [] 中标记的组中，这给我们提供了以下清单：\n\n```\n[webserver]\n192.10.20.31\n\
  mywebserver.exemple.com\n[database]\n192.20.34.20\n```\n\n在此示例中，我们定义了两个组，webserver\
  \ 和 database。所有主机都分布在这些组中。\n\n作为另一个示例，我们还可以按环境对主机进行分组，使用此示例清单：\n\n```\n[dev]\n192.10.20.31\n\
  192.10.20.32\n[qa]\n192.20.34.20\n192.20.34.21\n[prod]\n192.10.12.10\n192.10.12.11\n\
  ```\n\n在本章后面，我们将学习这些组将如何在 playbook 编写中使用。\n\n现在，让我们学习如何通过配置主机来完成我们的清单。\n\n### 在清单中配置主机\n\
  \n如我们所见，整个 Ansible 配置都在 `ansible.cfg` 文件中。但是，此配置是通用的，适用于所有 Ansible 执行，以及与主机的连接。\n\
  \n但是，当使用 Ansible 配置来自不同环境或角色且具有不同权限的 VM 时，拥有不同的连接配置很重要，例如每个环境的不同管理用户和 SSL 密钥。出于此原因，可以通过按主机配置特定参数来在清单文件中覆盖默认的\
  \ Ansible 配置，如在此清单中定义。\n\n可以覆盖的主要配置参数如下：\n\n- `ansible_user`：这是连接到远程主机的用户。\n- `ansible_port`：可以更改\
  \ SSH 端口的默认值。\n- `ansible_host`：这是主机的别名。\n- `ansible_connection`：这是到远程主机的连接类型，可以是\
  \ Paramiko、SSH 或 local。\n- `ansible_private_key_file`：这是用于连接到远程主机的私钥。\n\n> **重要说明**\n\
  > 参数的完整列表可在以下文档中找到：\n> https://docs.ansible.com/ansible/latest/user_guide/intro_inventory.html#list-of-behavioral-inventory-parameters。\n\
  \n### 测试清单\n\n编写清单后，可以测试是否可以从 Ansible 访问提到的所有主机。为此，我们可以执行以下命令：\n\n```bash\nansible\
  \ -i inventory all -u demobook -m ping\n```\n\n`-i` 参数是清单文件的路径，`-u` 参数对应于用于连接到远程机器的远程用户名，`-m`\
  \ 是要执行的命令。在这里，我们在清单中的所有机器上执行 `ping` 命令。\n\n以下是我们配置了主机连接的清单示例：\n\n```\n[webserver]\n\
  webserver1 ansible_host=192.10.20.31 ansible_port=2222\nwebserver2 ansible_host=192.10.20.31\
  \ ansible_port=2222\n[database]\ndatabase1 ansible_host=192.20.34.20 ansible_user=databaseuser\n\
  database2 ansible_host=192.20.34.21 ansible_user=databaseuser\n[dev]\nwebserver1\n\
  database1\n[qa]\nwebserver2\ndatabase2\n```\n\n在此清单示例中可以看到以下内容：\n\n- 连接信息已在每个主机旁指定。\n\
  - 别名实现（例如 `webserver1` 和 `webserver2`）用于另一个组（例如本示例中的 `qa` 组）。\n\n在实现了 Ansible 清单后，我们现在将学习如何测试此清单。\n\
  \n以下屏幕截图显示了此命令的执行：\n\n![](img/d3344b39c888aab0b832625465f837c9_104_0.png)\n\n图 3.6\
  \ – 使用 all 选项测试 ansible ping 命令\n\n我们还可以通过使用组名而不是 `all` 来调用此命令，测试特定组中主机的连接性。例如，在我们的案例中，我们将执行此命令：\n\
  \n`ansible -i inventory webserver -u demobook -m ping`\n\n以下屏幕截图显示了此命令的执行：\n\n![](img/d3344b39c888aab0b832625465f837c9_104_1.png)\n\
  \n图 3.7 – 针对特定主机测试 ansible ping 命令\n\n在本节中，我们了解到 Ansible 需要一个清单文件来配置主机。然后，我们创建并测试了我们的第一个清单文件，然后再学习如何进一步配置此文件。\n\
  \n在下一节中，我们将学习如何在 Ansible playbooks 中设置和编写配置操作代码。\n\n### 执行第一个 playbook\n\nAnsible\
  \ 的基本元素之一是它的 playbooks，因为如在介绍中规定的那样，它们包含配置或管理 VM 所需执行的操作或任务的代码。\n\n确实，一旦 VM 已配置，就必须对其进行配置，并且必须安装在该\
  \ VM 上托管的应用程序所需的所有中间件。此外，有必要执行有关目录配置及其访问的管理任务。\n\n在本节中，我们将了解 playbook 由什么组成，它的模块，以及如何使用角色来改进我们的\
  \ playbook。\n\n现在，让我们开始学习如何编写基本 playbook。\n\n### 编写基本 playbook\n\nplaybook 的代码是用\
  \ YAML 编写的，YAML 是一种声明性语言，允许我们轻松可视化配置步骤。\n\n为了了解 playbook 的样子，让我们看一个简单而经典的示例；也就是说，在\
  \ Ubuntu VM 上安装 NGINX 服务器。之前，我们创建了一个工作目录 devopsansible，我们将在其中创建一个 playbook.yml 文件并插入以下内容代码：\n\
  \n```yaml\n---\n- hosts: all\ntasks:\n- name: install and check nginx latest version\n\
  \  apt: name=nginx state=latest\n- name: start nginx\n  service:\n    name: nginx\n\
  \    state: started\n---\n```\n\n让我们详细看看：\n\n- 首先，YAML 文件以可选的 -- 字符开始和结束。\n\n- `-\
  \ hosts` 属性包含要配置的主机列表。在这里，我们将此属性的值写为 `all` 以在我们清单中列出的所有 VM 上安装 NGINX。如果我们想仅在特定组上安装它，例如，在\
  \ webserver 组上，我们将按如下方式记录：\n\n```yaml\n---\n- hosts: webserver\n```\n\n\n\n\n\n\
  ### 了解 Ansible 模块\n\n在上一节中，我们了解到，在 Ansible playbook 中，我们使用模块。这使得 Ansible 今天如此流行，以至于\
  \ Ansible 原生提供了大量的公共模块（+200）。完整列表可在此处查看：`https://docs.ansible.com/ansible/latest/collections/index_module.html`。\n\
  \n这些模块允许我们执行在 VM 上进行配置和管理所需的所有任务和操作，而无需编写任何代码或脚本行。\n\n在企业中，我们还可以创建自定义模块，并在内部私有注册表中发布它们。更多信息可在此处查看：`https://docs.ansible.com/ansible/latest/dev_guide/developing_modules_general.html`。\n\
  \n现在我们已经学习了如何编写简单的 playbook 以及如何使用模块，我们将通过角色进一步改进 playbook。\n\n### 使用角色改进 playbook\n\
  \n在企业中，配置 VM 时，我们注意到每个应用程序之间存在一定的任务重复。例如，多个应用程序需要相同的 NGINX 安装，并且必须以相同的方式执行。\n\n\
  使用 Ansible，这种重复将需要在多个 playbook 之间复制 playbook 代码，如我们在 *执行基本 playbook* 部分中的 playbook\
  \ 示例所示（因为每个应用程序都包含一个 playbook）。为了避免这种重复，从而节省时间、避免错误，并使安装和配置操作保持一致，我们可以将 playbook\
  \ 代码封装在名为 *role* 的目录中，该目录可被多个 playbook 使用。\n\n要创建与我们示例相对应的 `nginx` 角色，我们将在 `devopsansible`\
  \ 目录中创建以下目录和文件树：\n\n![](img/d3344b39c888aab0b832625465f837c9_107_0.png)\n\n图 3.8\
  \ – Ansible 架构文件夹\n\n然后，在位于 `tasks` 中的 `main.yml` 文件中，我们将从 playbook 中复制并粘贴以下代码到创建的文件中：\n\
  \n```yaml\n- name: install and check nginx latest version\n  apt: name=nginx state=latest\n\
  - name: start nginx\n  service:\n    name: nginx\n    state: started\n```\n\n然后，我们将修改\
  \ playbook 以使用此角色，内容如下：\n\n```yaml\n---\n- hosts: webserver\n  roles:\n    - nginx\n\
  ```\n\n按照节点角色，我们将提供要使用的角色列表（角色目录的名称）。因此，此 `nginx` 角色现在已集中化，可以在多个 playbook 中使用，而无需重写其代码。\n\
  \n以下是配置带有 Apache 的 VM Web 服务器和包含 MySQL 数据库的另一个 VM 的 playbook 代码：\n\n```yaml\n---\n\
  - hosts: webserver\n  roles:\n    - php\n    - apache\n- hosts: database\n  roles:\n\
  \    - mysql\n```\n\n> 重要说明\n> 有关角色创建的更多信息，请阅读官方文档 https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse_roles.html。\n\
  \n但是，在开始创建角色之前，我们可以使用 Ansible Galaxy（`https://galaxy.ansible.com/`），它包含社区提供的大量角色，涵盖大量配置和管理需求。\n\
  \n在企业中，我们还可以创建自定义角色，并在公司内部私有 galaxy 中发布它们。更多信息可在此处查看：`https://docs.ansible.com/ansible/latest/dev_guide/developing_modules_general.html`。\n\
  \n在本节中，我们学习了如何编写 playbook，以及如何使用角色改进 playbook。我们所有的工件最终都已准备就绪，因此现在可以执行 Ansible。\n\
  \n### 执行 Ansible\n\n到目前为止，我们已经学习了如何安装 Ansible、列出清单中的主机以及设置我们的 Ansible playbook。现在，我们可以运行\
  \ Ansible 来配置我们的 VM。\n\n为此，我们将运行带有 `ansible-playbook` 命令的 Ansible 工具，如下所示：\n\n```bash\n\
  ansible-playbook -i inventory playbook.yml\n```\n\n此命令的基本选项如下：\n\n- 带有清单文件路径的 `-i`\
  \ 参数\n- playbook 文件的路径\n\n以下是该命令的执行情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_109_0.png)\n\
  \n该命令的执行将 playbook 应用于清单中的主机，分几个步骤进行：\n\n1. 收集事实：Ansible 检查主机是否可达。\n2. 在主机上执行任务的\
  \ playbook。\n\n### PLAY Recap：这是在每个主机上执行的更改状态；此状态的值可以如下：\n\n| ok | 这是已正确应用于主机的 playbook\
  \ 任务数量。 |\n|---|---|\n| changed | 这是已应用的更改数量。 |\n| unreachable | 主机不可达。 |\n| failed\
  \ | 此主机上的执行失败。 |\n\n表 3.1 – PLAY Recap 的值\n\n如果我们需要升级 playbook 以在 VM 上添加或修改中间件，在使用此升级后的\
  \ playbook 第二次执行 Ansible 时，我们将看到 Ansible 没有重新应用 VM 的完整配置；它只应用了差异。\n\n以下截图显示了在未对\
  \ playbook 进行任何更改的情况下，Ansible 的第二次执行：\n\n![](img/d3344b39c888aab0b832625465f837c9_110_0.png)\n\
  \n在这里，我们可以看到 Ansible 在主机上没有更改任何内容（changed=0）。\n\n我们还可以向此命令添加一些有用选项，以提供以下内容：\n\n\
  - 在应用更改之前预览 Ansible 更改\n- 执行输出中的更多日志\n\n这些选项不仅对 playbook 开发阶段很重要，而且在执行过程中出现错误时对调试也很重要。\n\
  \n### 使用预览或干运行选项\n\n在编码 Ansible playbook 时，我们通常需要在不直接将其应用于基础架构的情况下测试不同步骤。因此，尤其是在使用\
  \ Ansible 自动化 VM 配置时，拥有其执行预览非常有用。这使我们可以检查 playbook 的语法是否与主机上已存在的系统配置保持良好一致性。\n\n\
  使用 Ansible，可以通过向命令添加 `--check` 选项来检查 playbook 在主机上的执行：\n\n```bash\nansible-playbook\
  \ -i inventory playbook.yml --check\n```\n\n以下是此干运行执行的示例：\n\n![](img/d3344b39c888aab0b832625465f837c9_111_0.png)\n\
  \n图 3.11 – Ansible playbook 干运行执行\n\n使用此选项，Ansible 不会将配置更改应用于主机；它只检查并预览已对主机所做的更改。\n\
  \n> **重要说明**\n> 有关 `--check` 选项的更多信息，请参阅以下文档：https://docs.ansible.com/ansible/latest/user_guide/playbooks_checkmode.html。\n\
  \n### 增加日志级别输出\n\n在出现错误时，可以通过向 Ansible 命令添加 -v、-vvv 或 -vvvv 选项来在输出中添加更多日志。\n\n-v\
  \ 选项启用基本详细模式，-vvv 选项启用带有更多输出的详细模式，-vvvv 选项添加详细模式和连接调试信息。\n\n执行以下命令将应用 playbook，并将使用已添加的\
  \ -v 选项显示更多日志信息：\n\n```bash\nansible-playbook -i inventory playbook.yml -v\n```\n\
  \n这在出现 Ansible 错误时可用于调试。\n\n> **重要说明**\n> `ansible-playbook` 命令的完整文档可在此处查看：`https://docs.ansible.com/ansible/2.4/ansible-playbook.html`。\n\
  \n我们刚刚学习了如何使用清单和 playbook 执行 Ansible，并探索了一些允许以下操作的选项：\n\n- 预览 Ansible 将要做出的更改\n\
  - 增加日志级别以便于调试\n\n在下一节中，我们将讨论使用 Ansible Vault 时的数据安全性。\n\n我们刚刚看到，Ansible 允许我们在将 playbook\
  \ 应用于主机之前对其进行检查；同样有必要知道，还有其他工具可以测试 playbook 的功能（而无需模拟其执行），例如 HashiCorp 的 Vagrant。\n\
  \nVagrant 允许我们非常快速地在本地创建由 VM 组成的测试环境，我们可以在其中运行 playbook 并查看结果。有关使用 Ansible 和 Vagrant\
  \ 的更多信息，请参阅以下文档：`https://docs.ansible.com/ansible/latest/scenario_guides/guide_vagrant.html`。\n\
  \n我们刚刚学习了如何预览 Ansible 将要应用的更改。现在，让我们看看如何增加 Ansible 执行的日志级别输出。\n\n\n\n\n\n### 使用\
  \ Ansible Vault 保护数据\n\n到目前为止，我们已学习如何使用包含要配置的主机列表的清单文件以及包含主机配置操作代码的剧本来使用 Ansible。但在所有基础设施即代码（IaC）工具中，都需要将特定于上下文或环境的某些数据提取到变量中。\n\
  \n在本节中，我们将了解如何在 Ansible 中使用变量以及如何使用 Ansible Vault 保护敏感数据。\n\n为了说明变量的使用和保护，我们将通过在数据库服务器上安装\
  \ MySQL 服务器来完善我们的示例。\n\n让我们先来看看 Ansible 中变量的使用和实用性。\n\n#### 在 Ansible 中使用变量以实现更好的配置\n\
  \n使用 IaC 部署基础设施时，所使用的代码通常由两部分组成：\n\n- 描述构成基础设施的元素或资源的部分。\n- 另一部分用于区分不同环境下此基础设施的属性。\n\
  \n针对每个环境的这种差异化第二部分是通过使用变量来完成的，Ansible 拥有一个完整的系统，允许我们将变量注入剧本中。\n\n为了学习如何在 Ansible\
  \ 中使用变量，我们将完善代码，并在 roles 目录中添加一个名为 mysql 的角色，其目录结构如下：\n\n![](img/d3344b39c888aab0b832625465f837c9_113_0.png)\n\
  \n图 3.12 – Ansible 角色文件夹结构\n\n在此角色的 main.yml 文件中，我们将编写以下代码：\n\n```yaml\n---\n- name:\
  \ Update apt cache\n  apt: update_cache=yes cache_valid_time=3600\n- name: Install\
  \ required software\n  apt: name=\"{{ packages }}\" state=present\n  vars:\n   \
  \ packages:\n    - python-mysqldb\n    - mysql-server\n- name: Create mysql user\n\
  \  mysql_user:\n    name={{ mysql_user }}\n    password={{ mysql_password }}\n \
  \   priv=*.*:ALL\n    state=present\n```\n\n在此代码中，一些静态信息已被变量替换。它们如下：\n\n- packages：包含要安装的软件包列表，该列表在以下代码中定义。\n\
  - mysql_user：包含 MySQL 数据库的 admin 用户。\n- mysql_password：包含 MySQL 数据库的 admin 密码。\n\
  \n此角色的不同任务如下：\n\n- 更新软件包\n- 安装 MySQL 服务器和 Python MySQL 软件包\n- 创建 MySQL 用户\n\n####\
  \ 重要提示\n\n此角色的完整源代码可在 `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP03/devopsansible/roles/mysql.`\
  \ 处找到。\n\n如我们所见，在用户创建任务中，我们将 `mysql_user` 和 `mysql_password` 变量用于用户名和密码。因此，此信息可能因环境而异，或者在运行\
  \ Ansible 时动态实例化。\n\n为了定义这些变量的值，我们将创建一个 `group_vars` 目录，该目录将包含我们清单中定义的每个组的所有变量值。\n\
  \n然后，在此 `group_vars` 文件夹中，我们将创建一个与清单中定义的数据库组对应的 `database` 子目录和一个 `main.yml` 子文件。\n\
  \n在此 `main.yml` 文件中，我们放置这些变量所需的值，如下所示：\n\n```yaml\n---\nmysql_user: mydbuserdef\n\
  mysql_password: mydbpassworddef\n```\n\n最后，我们将通过添加以下代码来调用 `mysql` 角色来完善我们的剧本：\n\n\
  ```yaml\n- hosts: database\nbecome: true\nroles:\n  - mysql\n```\n\n我们可以与之前相同的命令\
  \ ansible-playbook -i inventory playbook.yml 来执行 Ansible。将生成以下输出：\n\n![](img/d3344b39c888aab0b832625465f837c9_116_0.png)\n\
  \n图 3.13 – Ansible 剧本的 MySQL 执行\n\n在此，Ansible 已对数据库服务器进行了两项更改：要安装的软件包列表和 MySQL 管理员用户。我们刚刚学习了如何在\
  \ Ansible 中使用变量，但此变量在代码中是明确的，这引发了安全问题。\n\n> **重要提示**\n> 有关 Ansible 变量的更多信息，请阅读此处的完整文档：https://docs.ansible.com/ansible/latest/user_guide/playbooks_variables.html。\n\
  \n现在，让我们学习如何使用 Ansible Vault 保护剧本变量。\n\n#### 使用 Ansible Vault 保护敏感数据\n\n配置系统通常需要敏感信息，这些信息不应落入错误的人手中。在\
  \ Ansible 工具中，有一个名为 **Ansible Vault** 的子工具，用于保护通过剧本传输到 Ansible 的数据。\n\n在本节中，我们将学习如何操作\
  \ Ansible Vault 来加密和解密 MySQL 用户的信息。\n\n第一步是加密包含变量值的 `group_vars/database/main.yml`\
  \ 文件，方法是执行以下命令：\n\n```bash\nansible-vault encrypt group_vars/database/main.yml\n\
  ```\n\nAnsible Vault 要求您包含一个密码，该密码将用于解密文件，然后显示此命令的执行过程以加密文件的内容：\n\n![](img/d3344b39c888aab0b832625465f837c9_117_0.png)\n\
  \n执行此命令后，文件的内容已被加密，因此值不再清晰。以下是其中的示例：\n\n![](img/d3344b39c888aab0b832625465f837c9_117_1.png)\n\
  \n要解密文件以进行修改，必须执行 `decrypt` 命令：\n\n```bash\nansible-vault decrypt group_vars/database/main.yml\n\
  ```\n\nAnsible Vault 要求输入用于加密文件的密码，文件将再次变得可读。\n\n在 Ansible 使用自动化过程中，最好将密码存储在受保护位置的文件中；例如，在\
  \ `~/.vault_pass.txt` 文件中。\n\n然后，要使用此文件加密变量文件，我们必须执行 `ansible-vault` 命令并添加 `--vault-password-file`\
  \ 选项：\n\n```bash\nansible-vault encrypt group_vars/database/main.yml --vault-password-file\
  \ ~/.vault_pass.txt\n```\n\n现在文件已加密且数据受到保护，我们将运行 Ansible。在 **交互模式** 下，我们将运行以下命令：\n\
  \n```bash\nansible-playbook -i inventory playbook.yml --ask-vault-pass\n```\n\n\
  Ansible 要求用户输入以下屏幕截图中显示的密码：\n\n![](img/d3344b39c888aab0b832625465f837c9_118_0.png)\n\
  \n图 3.16 – 使用 Ansible Vault 解密的文件\n\n在 **自动模式** 下——即在 CI/CD 管道中——我们可以添加 `--vault-password-file`\
  \ 参数，指定包含用于解密数据的密码的文件路径：\n\n```bash\nansible-playbook -i inventory playbook.yml\
  \ --vault-password-file ~/.vault_pass.txt\n```\n\n至此，我们已使用不再在代码中清晰显示的数据以及 `ansible-vault`\
  \ 命令执行了 Ansible。\n\n> **重要提示**\n> 清单、剧本和角色的完整源代码可在此处找到：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP03/devopsansible。\n\
  \n在本节中，我们学习了如何使用 `ansible-vault` 实用程序保护剧本中的敏感数据。我们加密和解密了变量文件以保护它们，然后使用这些加密文件重新运行了\
  \ Ansible。在下一节中，我们将学习如何将 Ansible 与动态清单一起使用。\n\n#### 将动态清单用于 Azure 基础设施\n\n在配置由多个虚拟机以及按需构建的临时环境组成的基础设施时，常见的观察是，维护静态清单（如我们在\
  \ _创建 Ansible 清单_ 部分中所见）可能会迅速变得复杂，且其维护需要花费大量时间才能完成。\n\n为了解决这个问题，Ansible 允许通过调用脚本（例如\
  \ Python 脚本）动态获取清单，该脚本可以由云提供商提供，也可以由我们自己开发并返回清单内容。\n\n在本节中，我们将了解如何使用 Ansible 通过动态清单配置\
  \ Azure 中的虚拟机。让我们开始：\n\n1. 第一步是配置 Ansible 以便能够访问 Azure 资源。为此，我们将在 Azure AD 中创建一个\
  \ Azure 服务主体，方式与我们为 Terraform 所做的完全相同（请参见 _第 2 章，使用 Terraform 配置云基础设施_ 中的 _为 Azure\
  \ 配置 Terraform_ 部分）。然后，我们必须将四个服务主体 ID 的信息导出到以下环境变量中：\n\n```bash\nexport AZURE_SUBSCRIPTION_ID=<subscription_id>\n\
  export AZURE_CLIENT_ID=<client ID>\nexport AZURE_SECRET=<client Secret>\nexport\
  \ AZURE_TENANT=<tenant ID>\n```\n\n> **重要提示**\n> 有关 Ansible 的 Azure 环境变量的更多信息，请参阅此处的\
  \ Azure 文档：https://docs.ansible.com/ansible/latest/scenario_guides/guide_azure.html。\n\
  \n2. 然后，为了能够生成带有组的清单并筛选虚拟机，最好为虚拟机添加标记。标记可以使用 Terraform、`az cli` 命令行或 Azure PowerShell\
  \ 脚本添加。以下是使用 `az cli` 的示例脚本：\n\n```bash\naz resource tag --tags role=webserver -n\
  \ VM01 -g demoAnsible --resource-type \"Microsoft.Compute/virtualMachines\"\n```\n\
  \n\n\n\n前面的脚本将 `role` 标签的值设置为 webserver，并添加到 VM01 虚拟机中。\n然后，我们必须对 VM02 虚拟机执行相同的操作（只需在前面的脚本中将\
  \ `-n` 参数的值更改为 VM02）。\n\n下面的截图显示了 Azure 门户中的 VM 标签：\n\n![](img/d3344b39c888aab0b832625465f837c9_120_0.png)\n\
  \n图 3.17 – Azure 角色标签\n\n现在，我们必须使用以下脚本将包含数据库的标签添加到我们的 VM 中：\n\n```\naz resource\
  \ tag --tags role=database -n VM04 -g demoAnsible --resource-type \"Microsoft.Compute/virtualMachines\"\
  \n```\n\n此脚本将 `role` 标签添加到 VM04，其值为 `database`。\n\n> **重要说明**\n> 关于管理 Azure 标签的\
  \ `az cli` 文档可在此处找到：https://docs.microsoft.com/\n> fr-fr/cli/azure/resource?view=azure-cli-\n\
  > latest&viewFallbackFrom=azure-cli-latest.md#az-\n> resource-tag.\n\n3. 若要在 Azure\
  \ 中使用动态清单，我们需要执行以下操作：\n\n- 在机器上使用以下脚本安装 Ansible Azure 模块。\n\n```\nwget -q https://raw.githubusercontent.com/ansible-collections/azure/dev/requirements-azure.txt;\n\
  pip3 install -r requirements-azure.txt;\n```\n\n- 我们也可以通过执行以下命令使用 Ansible Galaxy\
  \ 安装 Azure 模块：\n\n```\nansible-galaxy collection install azure.azcollection\n```\n\
  \n> 注意\n> 有关 Azure 集合的更多详细信息，请阅读 https://galaxy.ansible.com/azure/azcollection 上的文档。\n\
  \n创建一个名为 inv.azure_rm.yml 的新文件（该文件的名称必须以 azure_rm 结尾），并在文件中写入以下配置：\n\n- 使用 azure_rm\
  \ 插件。\n- 允许按角色标签对返回的 VM 列表进行分组。\n- 仅筛选 demoAnsible 资源组。\n\n该文件的内容将如下所示：\n\n```\n\
  plugin: azure_rm\ninclude_vm_resource_groups:\n- demoAnsible\nauth_source: auto\n\
  keyed_groups:\n- key: tags.role\nleading_separator : false\n```\n\n> 重要说明\n> inv.azure_rm.yml\
  \ 文件的完整源代码可在此处找到：https://github.com/PacktPublishing/\n> Learning-DevOps-Second-Edition/tree/main/CHAP03/\n\
  > devopsansible/inventories.\n\n4. 在 Azure 中设置好 Ansible 动态清单的所有构件后，最好测试其功能，其中包括执行以下操作：\n\
  \nA. 确保没有执行错误。\nB. 确保与我们的 Azure 环境的连接和身份验证已正确完成。\nC. 确保其执行返回我们基础设施中的 Azure VM。\n\
  \n### 重要说明\n\n如前所述的 _技术要求_ 部分中所述，在运行以下命令之前，我们需要在机器上安装 Azure Python 模块。\n\n要执行此测试，请运行以下命令：\n\
  \n```\nansible-inventory -i inv.azure_rm.yml --list\n```\n\n此命令允许我们以列表格式显示清单脚本作为输出。以下是此执行的一个小示例屏幕：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_122_0.png)\n\n图 3.18 – 动态 Ansible 清单\
  \ VM 列表\n\n我们也可以通过运行相同的命令但带有 `--graph` 选项来以图形模式显示此清单，如下所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_122_1.png)\n\
  \n图 3.19 – 按角色分组的动态 Ansible 清单 VM 列表\n\n使用 `--graph` 选项，我们可以根据 VM 的标签获得更好的可视化效果。\n\
  \n测试结束后，我们可以进行最后一步，即使用动态清单执行 Ansible。\n\n5. 一旦我们在 Azure 中测试了动态清单，我们就只需在其上运行 Ansible，并使用我们应用到\
  \ VM 的标签。为此，我们必须使用以下命令运行我们的 playbook：\n\n```\nansible-playbook playbook.yml -i inv.azurerm.yml\
  \ -u demobook --ask-pass\n```\n\n### 注意\n\n在我们的实验室中，我们使用带有用户名和密码的 VM，因此在前面的命令中，我们使用\
  \ -u 参数（用于 VM 用户名）和 -ask-pass 参数（用于提示输入 VM 用户密码）。但更好的做法是建议使用 SSH 公钥/私钥而不是密码。\n\n\
  下面的截图显示了使用动态清单执行 Ansible playbook 的情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_123_0.png)\n\
  \n图 3.20 – 动态 Ansible 清单执行\n\n从现在起，每当我们 Azure 基础设施中的 VM 具有 role=webserver 标签时，它都会被动态清单自动考虑，因此不需要任何代码修改。\n\
  \n### 重要说明\n\n有关在 Azure 上使用动态清单的其他方法，您可以查阅 https://docs.microsoft.com/en-\nus/azure/developer/ansible/dynamic-inventory-\n\
  configure?tabs=azure-cli 上的 Azure 文档。\n\n通过使用动态清单，我们可以充分利用云的可扩展性，实现自动 VM 配置，而无需进行任何代码更改。\n\
  \n在本节中，我们学习了如何在 Azure 中使用动态清单，通过实现其配置并进行必要的脚本恢复，然后使用 Ansible 执行此动态清单。\n\n### 摘要\n\
  \n在本章中，我们了解到 Ansible 是一个非常强大且完整的工具，允许我们自动化服务器配置和管理。为了工作，它使用一个包含要配置的主机列表的清单，以及一个\
  \ playbook，其中编码了配置操作列表。\n\n角色、模块和变量也允许更好地管理和集中 playbook 代码。Ansible 还有一个保护敏感 playbook\
  \ 数据的保险库。最后，对于动态环境，可以通过实现动态清单来简化清单编写。\n\n在下一章中，我们将学习如何使用 Packer 创建服务器模板来优化基础设施部署。\n\
  \n### 问题\n\n1. 本章详细介绍了 Ansible 的什么角色？\n2. 我们可以在 Windows 操作系统上安装 Ansible 吗？\n3. 本章研究的两个构件是什么，Ansible\
  \ 运行需要它们？\n4. `ansible-playbook` 命令中添加了什么选项，用于预览将要应用的更改？\n5. 用于加密和解密 Ansible 数据的实用程序名称是什么？\n\
  6. 在 Azure 中使用动态清单时，清单脚本用于返回 VM 列表的 VM 属性是什么？\n\n### 进一步阅读\n\n如果您想了解更多关于 Ansible\
  \ 的信息，以下是一些资源：\n\n- Ansible 文档：`https://docs.ansible.com/ansible/`\n`latest/index.html`\n\
  - 快速入门视频：`https://www.ansible.com/resources/`\n`videos/quick-start-video?extIdCarryOver=true&sc_`\n\
  `cid=701f2000001OH6uAAG`\n- Azure 上的 Ansible 文档：`https://docs.microsoft.com/en-us/`\n\
  `azure/ansible/`\n- Visual Studio Code Ansible 扩展：`https://marketplace.`\n`visualstudio.com/items?itemName=vscoss.vscode-ansible`\n\
  - 精通 Ansible：`https://www.packtpub.com/virtualization-and-`\n`cloud/mastering-ansible-third-edition`\n\
  - Ansible 网络研讨会培训：`https://www.ansible.com/resources/`\n`webinars-training`\n"
- "## 4 使用 Packer 优化基础设施部署\n\n在前几章中，我们学习了如何使用 Terraform 配置云基础设施，然后继续使用 Ansible 对 VM\
  \ 进行自动化配置。\n这种自动化使我们能够从生产力的真正提升和非常明显的节省时间中受益。\n\n然而，尽管有这种自动化，我们注意到以下几点：\n\n- 配置\
  \ VM 可能非常耗时，因为它取决于其加固情况，以及将在该 VM 上安装和配置的中间件。\n\n- 在每个环境或应用程序之间，中间件版本不尽相同，因为它们的自动化脚本不一定相同或随时间维护。因此，例如，生产环境由于更关键，更有可能拥有最新版本的软件包，而预生产环境则不是这样。在这种情况下，我们经常会遇到生产环境中应用程序行为的问题。\n\
  \n- 配置和安全合规性通常没有应用或更新。\n\n为了解决这些问题，所有云提供商都集成了一项服务，允许他们创建或生成自定义 VM 镜像。这些镜像包含 VM 的所有配置及其安全管理和中间件配置，然后可以用作创建应用程序\
  \ VM 的基础。\n\n使用这些镜像的好处如下：\n\n- 从镜像配置 VM 非常快速。\n\n- 每个 VM 的配置都是统一的，而且最重要的是，符合安全合规性。\n\
  \n在 **基础设施即代码 (IaC)** 工具中，有来自 HashiCorp 工具的 Packer，它允许我们从文件（或模板）创建 VM 镜像。\n\n在本章中，我们将学习如何以不同模式安装\
  \ Packer。我们将讨论 Packer 模板的语法，以创建在 Azure 中使用脚本或 Ansible playbook 的自定义 VM 镜像。\n\n我们将详细介绍使用\
  \ JSON 和 HCL 格式的模板执行 Packer 的过程。最后，我们将了解 Terraform 如何使用 Packer 创建的镜像。通过本章，我们将了解\
  \ Packer 是一个简单的工具，它简化了 DevOps 过程中 VM 的创建，并与 Terraform 集成得很好。\n\n在本章中，我们将涵盖以下内容：\n\
  \n- Packer 概述\n\n- 使用脚本创建 Packer 模板\n\n- 使用 Ansible 创建 Packer 模板\n\n- 执行 Packer\n\
  \n\n\n\n### 技术要求\n\n本章将以在 Azure 基础架构中使用 Packer 创建 VM 镜像为例，介绍如何在云基础架构中使用 Packer。因此，你需要一个\
  \ Azure 订阅，可以在此处免费获取：https://azure.microsoft.com/en-us/free/。\n\n在“在 Packer 模板中使用\
  \ Ansible”部分，我们将学习如何编写使用 Ansible 的 Packer 模板，因此你需要在机器上安装 Ansible 并了解其工作原理，详细内容请参阅第\
  \ 3 章《使用 Ansible 配置 IaaS 基础架构》。\n\n本章的最后一部分将介绍将 Terraform 与 Packer 镜像结合使用的示例；对于其应用，需要安装\
  \ Terraform 并了解其操作，详细内容请参阅第 2 章《使用 Terraform 配置云基础架构》。\n\n本章的完整源代码可在此处获取：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP04。\n\
  \n请观看以下视频，查看代码实际运行情况：https://bit.ly/35exxSo。\n\n### Packer 概述\n\nPacker 是 HashiCorp\
  \ 开源工具套件的一部分，Packer 的官方页面在此：https://www.packer.io/。它是一个开源命令行工具，允许我们从 JSON 文件在多个平台上创建任何操作系统的自定义\
  \ VM 镜像（这些镜像也称为 **templates**）。\n\nPacker 的操作非常简单；它基于不同云提供商提供的基础操作系统，通过执行 JSON 或\
  \ HCL 模板中描述的脚本来配置临时 VM。然后，从这个临时 VM 中，Packer 生成可用于配置 VM 的自定义镜像。\n\n除了 VM 镜像，Packer\
  \ 还提供其他类型的镜像，例如 Docker 镜像或 Vagrant 镜像。对 Packer 进行简要介绍后，让我们来看看不同的安装模式。\n\n### 安装\
  \ Packer\n\n与 Terraform 类似，Packer 是一个跨平台工具，可以安装在 Windows、Linux 或 macOS 上。Packer\
  \ 的安装几乎与 Terraform 的安装相同（请参阅第 2 章《使用 Terraform 配置云基础架构》），可以通过两种方式完成：手动安装或通过脚本安装。\n\
  \n#### 手动安装\n\n要手动安装 Packer，请使用以下步骤：\n\n- 1. 访问官方下载页面（`https://www.packer.io/downloads.html`）并下载与你的操作系统对应的软件包。\n\
  - 2. 下载后，解压缩并将二进制文件复制到执行目录中（例如，在 `c:\\Packer` 内）。\n- 3. 然后，必须将 `PATH` 环境变量设置为二进制目录的路径。\n\
  \n> **Tip**\n> 有关如何在 Windows 上更新 `PATH` 环境变量的详细说明，请参阅此文章：`https://www.architectryan.com/2018/03/17/add-to-the-path-on-windows-10/`，对于\
  \ Linux，请参阅此文章：`https://www.techrepublic.com/article/how-to-add-directories-to-your-path-in-linux/`。\n\
  \n现在我们已经了解了如何手动安装 Packer，让我们来看看使用脚本安装它的可用选项。\n\n#### 通过脚本安装\n\n也可以使用自动脚本安装 Packer，该脚本可以安装在远程服务器上并用于\
  \ CI/CD 过程。确实，Packer 可以在本地使用，正如我们将在本章中看到的那样，但它的真正目标是集成到 CI/CD 管道中。这个自动化 DevOps 管道将允许构建和发布统一的\
  \ VM 镜像，这些镜像将保证基于这些镜像的中间件和 VM 安全性的完整性。\n\n让我们来看看针对不同操作系统（即 Linux、Windows 和 macOS）的这些脚本的结构。\n\
  \n### 在 Linux 上通过脚本安装 Packer\n\n在 Linux 上安装 Packer 二进制文件，我们有两种解决方案：\n\n- 第一个解决方案是使用以下脚本安装\
  \ Packer：\n\n```\nPACKER_VERSION=\"1.7.3\" #Update with your desired version\ncurl\
  \ -Os https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip\
  \ \\\n&& curl -Os https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_SHA256SUMS\
  \ \\\n&& curl https://keybase.io/hashicorp/pgp_keys.asc | gpg --import \\\n&& curl\
  \ -Os https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_SHA256SUMS.sig\
  \ \\\n&& gpg --verify packer_${PACKER_VERSION}_SHA256SUMS.sig packer_${PACKER_VERSION}_SHA256SUMS\
  \ \\\n&& shasum -a 256 -c packer_${PACKER_VERSION}_SHA256SUMS 2>&1 | grep \"${PACKER_VERSION}_linux_amd64.zip:\\\
  sOK\" \\\n&& unzip -o packer_${PACKER_VERSION}_linux_amd64.zip -d /usr/local/bin\n\
  ```\n\n```\nNote\nThe code of this script is also available here: https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP04/install_packer.sh.\n\
  ```\n\n此脚本执行以下操作：\n\n- 下载 Packer 版本 1.7.3 软件包并检查校验和\n- 解压缩并将软件包复制到本地目录 `/usr/local/bin`（默认情况下，此文件夹位于\
  \ `PATH` 环境变量中）\n\n以下是在 Linux 上安装 Packer 的脚本执行截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_130_0.png)\n\
  \n图 4.1 – 安装 Packer 脚本执行\n\n此解决方案的好处是我们可以选择 Packer 安装文件夹，并且它适用于各种 Linux 发行版，因为它使用常用工具，即\
  \ curl 和 unzip。\n\n- 在 Linux 上安装 Packer 的第二种解决方案是对 Ubuntu 发行版使用 apt 包管理器，使用以下脚本：\n\
  \n```\nsudo apt-get update && sudo apt-get install -y gnupg software-properties-common\
  \ curl \\\n&& curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add\
  \ - \\\n&& sudo apt-add-repository \"deb [arch=amd64] https://apt.releases.hashicorp.com\
  \ $(lsb_release -cs) main\" \\\n&& sudo apt-get update && sudo apt-get install packer\n\
  ```\n\n此脚本执行以下操作：\n\n- 添加 apt HashiCorp 存储库\n- 更新本地存储库\n- 下载 Packer CLI\n\n> Important\
  \ Note\n> 有关此脚本以及在其他发行版上安装 Packer 的更多详细信息，请阅读 https://learn.hashicorp.com/tutorials/packer/get-started-install-cli?in=packer/docker-get-started\
  \ 的文档，并导航到 Linux 选项卡。\n\n### 在 Windows 上通过脚本安装 Packer\n\n在 Windows 上，我们可以使用 **Chocolatey**，它是一个软件包管理器。Chocolatey\
  \ 是一个免费的公共包管理器，类似于 NuGet 或 npm，但专门用于软件。它广泛用于 Windows 服务器甚至本地机器上的软件自动化。Chocolatey\
  \ 的官方网站在此：`https://chocolatey.org/`，其安装文档在此：`https://chocolatey.org/install`。\n\n\
  安装 Chocolatey 后，我们只需在 PowerShell 或 CMD 工具中运行以下命令：\n\n```\n`choco install packer\
  \ -y`\n```\n\n以下是使用 Chocolatey 在 Windows 上安装 Packer 的截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_131_0.png)\n\
  \n图 4.2 – 使用 Chocolatey 安装 Packer\n\n执行 `choco install packer -y` 将从 Chocolatey\
  \ 安装最新版本的 Packer。\n\n### 在 macOS 上通过脚本安装 Packer\n\n在 macOS 上，我们可以使用 **Homebrew**（macOS\
  \ 包管理器，`https://brew.sh/`），通过在终端中执行以下命令来安装 Packer：\n\n```\n`brew install packer`\n\
  ```\n\n### 将 Packer 与 Azure Cloud Shell 集成\n\n正如我们在《第 2 章：使用 Terraform 配置云基础架构》的“将\
  \ Terraform 与 Azure Cloud Shell 集成”部分中详细了解的那样，Packer 也与 Azure Cloud Shell 集成，如以下截图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_132_0.png)\n\n图 4.3 – Azure Cloud Shell\
  \ 上的 Packer\n\n现在我们已经了解了在不同操作系统上安装 Packer 及其与 Azure Cloud Shell 的集成，接下来我们将检查其已安装的版本。\n\
  \n### 检查 Packer 安装\n\n安装后，我们可以通过运行以下命令检查已安装的 Packer 版本：\n\n```\npacker --version\n\
  ```\n\n\n\n\n\n此命令显示已安装的 Packer 版本：\n\n```\nPS C:\\Users\\mkrief> packer --version\n\
  1.7.3\n```\n\n图 4.4 – Packer 版本命令\n\n要查看所有 Packer 命令行选项，我们可以执行以下命令：\n\n```\npacker\
  \ --help\n```\n\n执行后，我们将看到可用命令列表，如下图所示：\n\n```\nPS C:\\Users\\mkrief> packer --help\n\
  Usage: packer [--version] [--help] <command> [<args>]\n\nAvailable commands are:\n\
  \    build        build image(s) from template\n    console      creates a console\
  \ for testing variable interpolation\n    fix          fixes templates from old\
  \ versions of packer\n    fmt          Rewrites HCL2 config files to canonical format\n\
  \    hcl2_upgrade transform a JSON template into an HCL2 configuration\n    init\
  \         Install missing plugins or upgrade plugins\n    inspect      see components\
  \ of a template\n    validate     check that a template is valid\n    version  \
  \    Prints the Packer version\n```\n\n图 4.5 – Packer 帮助命令\n\n我们刚刚了解了 Packer 的手动安装过程以及在不同操作系统上使用脚本进行安装，以及它与\
  \ Azure Cloud Shell 的集成。\n\n我们将使用脚本编写模板，以便在 Azure 中使用 Packer 创建 VM 镜像。\n\n### 使用脚本为\
  \ Azure VM 创建 Packer 模板\n\n如前所述，要创建 VM 镜像，Packer 基于一个以 JSON 格式或 **HashiCorp 配置语言**（HCL）编写的文件（模板），HCL\
  \ 是从 Packer 1.5.0 版本引入的（有关更多信息，请阅读以下博客文章：`https://www.packer.io/guides/hcl`）。我们将首先了解此模板的结构和组成，然后实践如何创建一个在\
  \ Azure 中创建 VM 镜像的模板。\n\n### Packer 模板的结构\n\nPacker 模板由几个主要部分组成，例如 `builders`、`provisioners`\
  \ 和 `variables`。模板的 JSON 格式如下：\n\n```\n{\n\t\"variables\": {\n\t\t// list of variables\n\
  \t\t...\n\t},\n\t\"builders\": [\n\t\t{\n\t\t\t//builders properties\n\t\t\t...\n\
  \t\t}\n\t],\n\t\"provisioners\": [\n\t\t{\n\t\t\t// list of scripts to execute for\
  \ image provisionning\n\t\t\t...\n\t\t}\n\t]\n}\n```\n\n让我们详细了解每个部分。\n\n#### builders\
  \ 部分\n\n`builders` 部分是必需的，包含定义镜像及其位置的所有属性，例如名称、镜像类型、将生成镜像的云提供商、云连接信息、要使用的基础镜像以及特定于镜像类型的其他属性。\n\
  \n以下是 `builders` 部分的示例代码：\n\n```\n{\n\t\"builders\": [{\n\t\t\"type\": \"azure-rm\"\
  ,\n\t\t\"client_id\": \"xxxxxxxx\",\n\t\t\"client_secret\": \"xxxxxxxx\",\n\t\t\"\
  subscription_id\": \"xxxxxxxxxx\",\n\t\t\"tenant_id\": \"xxxxxx\",\n\t\t\"os_type\"\
  : \"Linux\",\n\t\t\"image_publisher\": \"Canonical\",\n\t\t\"image_offer\": \"UbuntuServer\"\
  ,\n\t\t\"location\": \"westus\"\n\t\t......\n\t}]\n}\n```\n\n在此示例中，builders 部分定义了一个将存储在\
  \ Azure 云中且基于 Linux Ubuntu 操作系统的镜像。我们还配置了云的身份验证密钥。\n\n> 注意\n> builders 部分的文档位于：https://www.packer.io/docs/builders。\n\
  \n如果我们想要在多个提供商上创建相同的镜像，可以在同一模板文件中指定多个包含提供商属性的 builders 块。例如，请参阅以下 JSON 格式的代码示例：\n\
  \n```\n{\n\"builders\": [\n{\n\"type\": \"azure-rm\",\n\"location\": \"westus\"\
  ,\n......\n},\n{\n\"type\": \"docker\",\n\"image\": \"alpine:latest\",\n...\n}\n\
  ]\n}\n```\n\n要将相同的块代码转换为 HCL 格式，我们首先编写两个 `sources` 块来定义不同的提供商属性。然后在 `build` 部分中调用这些\
  \ `sources`，如下所示：\n\n```\nbuild {\n    sources = [\"sources.azure-arm.azurevm\"\
  ,\"sources.docker.docker-img\"]\n    ...\n}\n```\n\n在此代码示例中，我们在 Packer 模板中定义了 Azure\
  \ VM 镜像的信息以及基于 Alpine 的 Docker 镜像的信息。这样做的好处是标准化将在 provisioning 部分详细介绍的这两个镜像的脚本。\n\
  \n在详细介绍每个部分之后，我们将看到一个带有 `builders` 部分的具体示例，用于在 Azure 中创建镜像。\n\n让我们继续介绍 `provisioners`\
  \ 部分。\n\n### provisioners 部分\n\n`provisioners` 部分是可选的，包含一系列脚本，Packer 将在临时 VM 基础镜像上执行这些脚本，以根据我们的需求构建自定义\
  \ VM 镜像。\n\n如果 Packer 模板不包含 `provisioners` 部分，则不会对基础镜像进行任何配置。\n\n此部分中定义的操作适用于 Windows\
  \ 和 Linux 镜像，操作可以是多种类型，例如执行本地或远程脚本、执行命令或复制文件。\n\n> 注意\n> Packer 原生提供的 `provisioners`\
  \ 类型在文档中有详细介绍：https://www.packer.io/docs/provisioners/index.html。\n\n还可以通过创建自定义\
  \ provisioning 类型来扩展 Packer。要了解有关自定义 `provisioners` 的更多信息，请参阅此处的文档：https://www.packer.io/docs/extending/custom-provisioners.html。\n\
  \n以下是 JSON 格式的 `provisioners` 部分示例：\n\n```\n{\n...\n\"provisioners\": [\n{\n\"type\"\
  : \"shell\",\n\"script\": \"hardening-config.sh\"\n},\n{\n\"type\": \"file\",\n\"\
  source\": \"scripts/installers\",\n\"destination\": \"/tmp/scripts\"\n}\n]\n...}\n\
  ```\n\n以下是相同块代码的 HCL 格式：\n\n```\nprovisioner \"shell\" {\nscripts = [\"hardening-config.sh\"\
  ]\n}\nprovisioner \"file\" {\nsource = \"scripts/installers\"\ndestination = \"\
  /tmp/scripts\"\n}\n```\n\n在此 `provisioners` 部分中，Packer 将上传并执行本地脚本 `hardening-config.sh`，以在远程临时\
  \ VM 基础镜像上应用强化配置，并将本地文件夹 `scripts/installers` 的内容复制到远程文件夹 `/tmp/scripts`，以配置镜像。\n\
  \n因此，在此部分中，我们列出了要创建的镜像的所有配置操作。\n\n但是，在创建 VM 镜像时，有必要对其进行通用化，换句话说，删除用于创建此镜像的所有个人用户信息。\n\
  \n例如，对于 Windows VM 镜像，我们将使用 Sysprep 工具作为 provisioners 的最后一步，使用以下代码：\n\n```\n\"provisioners\"\
  : [\n...\n{\n\"type\": \"powershell\",\n\"inline\": [\"& C:\\\\windows\\\\System32\\\
  \\Sysprep\\\\Sysprep.exe /oobe /generalize /shutdown /quiet\"]\n}]\n```\n\nPacker\
  \ 模板中 Sysprep 用法的另一个示例可在此处找到：https://www.packer.io/docs/builders/azure.html。\n\n\
  对于在 Linux 镜像上删除个人用户信息，我们将使用以下代码：\n\n```\n\"provisioners\": [\n.....\n{\n\"type\"\
  : \"shell\",\n\"execute_command\": \"sudo sh -c '{{ .Vars }} {{ .Path }}'\",\n\"\
  inline\": [\n\"/usr/sbin/waagent -force -deprovision+user & export HISTSIZE=0 &\
  \ sync\"\n]\n}\n]\n```\n\n> 注意\n> 有关 provisioners 部分的更多信息，请参阅此处的文档：https://www.packer.io/docs/templates/provisioners.html，操作列表可在此处找到：https://www.packer.io/docs/provisioners/index.html。\n\
  \n介绍完 provisioners 部分后，让我们来谈谈变量。\n\n### variables 部分\n\n在 Packer 模板中，我们通常需要使用代码中不是静态的值。这个可选的\
  \ `variables` 部分用于定义变量，这些变量将作为命令行参数或环境变量填充。然后，这些变量将在 `builders` 或 `provisioners`\
  \ 部分中使用。\n\n以下是 `variables` 部分的示例：\n\n```\n{\n\"variables\": {\n\"access_key\":\
  \ \"{{env 'ACCESS_KEY'}}\",\n\"image_folder\": \"/image\",\n\"vm_size\": \"Standard_DS2_v2\"\
  \n},\n....\n}\n```\n\n在此示例中，我们初始化以下内容：\n\n- 使用 `ACCESS_KEY` 环境变量初始化 `access_key`\
  \ 变量\n- 使用 `/image` 值初始化 `image_folder` 变量\n- VM 镜像大小的值，即 `vm_size` 变量\n\n要使用这些所谓的用户变量，我们使用\
  \ `{{user 'variablename' }}` 表示法，以下是在 `builders` 部分中使用这些变量的示例：\n\n```\n\"builders\"\
  : [\n{\n\"type\": \"azure-arm\",\n\"access_key\": \"{{user 'access_key'}}\",\n\"\
  vm_size\": \"{{user 'vm_size'}}\",\n...\n}\n],\n```\n\n在 `provisioners` 部分中，我们使用在\
  \ `variables` 部分中定义的变量，如下所示：\n\n```\n\"provisioners\": [\n{\n\n\n\n\n\n因此，我们使用变量来定义镜像的属性，这些变量将在执行\
  \ Packer 模板时提供。我们也可以在 `provisioners` 部分使用这些变量来集中管理这些属性，从而避免在此处重新定义，例如，将在模板中多次重复的镜像路径（`/image`）。\n\
  \n> Note\n> 除了用户提供的变量之外，还可以检索其他变量来源，例如存储在 HashiCorp Vault 或 Consul 中的密钥。有关变量的更多信息，请参阅文档：https://www.packer.io/docs/templates/legacy_json_templates/user-variables.\n\
  \n我们刚刚了解了 Packer 模板的结构及其主要组成部分，即 `builders`、`provisioners` 和 `variables`。现在，让我们通过一个具体示例来了解如何编写\
  \ Packer 模板，以便在 Azure 中创建镜像。\n\n### 使用 Packer 模板构建 Azure 镜像\n\n有了前面看到的所有元素，我们现在就能够创建一个\
  \ Packer 模板，用于在 Azure 中创建 VM 镜像。\n\n为此，我们首先需要创建一个 Azure AD **服务主体** (**SP**)，它将拥有在我们的订阅中创建资源的权限。创建过程与我们为\
  \ Terraform 所做的完全相同；有关详细信息，请参见 _第 2 章，使用 Terraform 配置云基础设施_ 中的 _为 Azure 配置 Terraform_\
  \ 部分。然后，在本地磁盘上，我们将创建一个 Packer 模板文件。\n\n如果你想使用 JSON 模板格式，请创建一个 azure_linux.json 文件，这将是我们的\
  \ Packer 模板。我们将从 builders 部分开始编写此文件，如下所示：\n\n```json\n...\"builders\": [{\n\"type\"\
  : \"azure-arm\",\n\"client_id\": \"{{user 'clientid'}}\",\n\"client_secret\": \"\
  {{user 'clientsecret'}}\",\n\"subscription_id\": \"{{user 'subscriptionid'}}\",\n\
  \"tenant_id\": \"{{user 'tenantid'}}\",\n\"os_type\": \"Linux\",\n\"image_publisher\"\
  : \"Canonical\",\n\"image_offer\": \"UbuntuServer\",\n\"image_sku\": \"18.04-LTS\"\
  ,\n\"location\": \"West Europe\",\n\"vm_size\": \"Standard_DS2_v3\",\n\"managed_image_resource_group_name\"\
  : \"{{user 'resource_group'}}\",\n\"managed_image_name\": \"{{user 'image_name'}}-{{user\
  \ 'image_version'}}\",\n\"azure_tags\": {\n\"version\": \"{{user 'image_version'}}\"\
  ,\n\"role\": \"WebServer\"\n}\n}],....\n```\n\n本部分描述了以下内容：\n\n- 它描述了 azure_rm 类型，该类型指示提供程序。\n\
  - 此外，它描述了 client_id、secret_client、subscription_id 和 tenant_id 属性，这些属性包含先前创建的 SP\
  \ 的信息。出于安全考虑，这些值不会以明文形式写入 JSON 模板；它们将放置在变量中（我们将在 builders 部分的详细信息之后立即看到）。\n- managed_image_resource_group_name\
  \ 和 managed_image_name 属性指示要创建的资源组以及镜像的名称。镜像的名称也放置在一个带有名称和版本号的变量中。\n- 其他属性对应于操作系统类型（Ubuntu\
  \ 18）、大小（Standard_DS2_v3）、区域和标记的信息。\n\n现在我们将编写 `variables` 部分，该部分定义非固定元素：\n\n```json\n\
  ...\"variables\": {\n\"subscriptionid\": \"{{env 'AZURE_SUBSCRIPTION_ID'}}\",\n\"\
  clientid\": \"{{env 'AZURE_CLIENT_ID'}}\",\n\"clientsecret\": \"{{env 'AZURE_CLIENT_SECRET'}}\"\
  ,\n\"tenantid\": \"{{env 'AZURE_TENANT_ID'}}\",\n\n\"resource_group\": \"rg_images\"\
  ,\n\"image_name\": \"linuxWeb\",\n\"image_version\": \"0.0.1\"\n},...\n```\n\n我们定义了变量及其默认值，如下所示：\n\
  \n- SP 的四个身份验证信息将通过 Packer 命令行或环境变量传递。\n- 要生成的镜像的资源组、名称、大小和区域也在 `variables` 中。\n\
  - 包含镜像版本（用于镜像名称）的 `image_version` 变量已定义。\n\n因此，有了这些变量，我们就可以使用同一个 JSON 模板文件生成多个名称和大小不同的镜像（我们将在执行\
  \ Packer 时看到这一点）。\n\n最后，最后一步是使用以下代码编写 `provisioners` 镜像的步骤：\n\n```json\n\"provisioners\"\
  : [\n{\n\"type\": \"shell\",\n\"execute_command\": \"sudo sh -c '{{ .Vars }} {{\
  \ .Path }}'\",\n\"inline\": [\n\"apt-get update\",\n\"apt-get -y install nginx\"\
  \n]\n},\n{\n\"type\": \"shell\",\n\"execute_command\": \"sudo sh -c '{{ .Vars }}\
  \ {{ .Path }}'\",\n\"inline\": [\n\"/usr/sbin/waagent -force -deprovision+user &\
  \ export HISTSIZE=0 & sync\"\n]\n}\n]\n```\n\n前面的代码块的作用如下：\n\n- 它使用 `apt-get update`\
  \ 和 `upgrade` 更新软件包。\n- 它安装 NGINX。\n\n然后，在创建镜像之前的最后一步中，VM 将被取消预配，以删除用于在临时 VM 上安装所有内容的用户信息，使用以下命令：\n\
  \n/usr/sbin/waagent -force -deprovision+user & export HISTSIZE=0 & sync\n\n> **Note**\n\
  > 此 Packer 模板的完整源代码可在此处查看：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP04/templates/azure_linux.json.\n\
  \n我们刚刚了解了 Packer 模板的结构，它主要由三个部分组成，即 `variables`、`builders` 和 `provisioners`，然后我们看了一个具体示例，即编写\
  \ Packer 模板以在 Azure 中生成使用脚本或预配命令的自定义 VM 镜像。\n\n我们的 Packer 模板已完成并准备好运行，但首先我们将看到另一种使用\
  \ Ansible 的 `provisioners` 类型。\n\n### 在 Packer 模板中使用 Ansible\n\n我们刚刚了解了如何编写使用命令脚本（例如\
  \ apt-get）的 Packer 模板，但也可以使用 Ansible playbook 来创建镜像。确实，当我们使用 IaC 配置 VM 时，我们通常习惯于在考虑将其制作成\
  \ VM 镜像之前，直接使用 Ansible 配置 VM。\n\nPacker 有趣的地方在于，我们可以重用用于配置 VM 的相同 playbook 脚本来创建我们的\
  \ VM 镜像。因此，这是一个巨大的节省时间的方法，因为我们不必重写脚本。\n\n为了付诸实践，我们将编写以下内容：\n\n- 一个安装 NGINX 的 Ansible\
  \ playbook\n- 一个使用我们的 playbook 的 Packer 模板\n\n让我们从编写 Ansible playbook 开始。\n\n###\
  \ 编写 Ansible playbook\n\n我们将要编写的 playbook 与我们在第 3 章，使用 Ansible 配置 IaaS 基础设施中设置的\
  \ playbook 几乎相同，但有一些更改。\n\n以下是 playbook 的示例：\n\n```yaml\n---\n- hosts: 127.0.0.1\n\
  \  become: true\n  connection: local\n  tasks:\n  - name: installing Nginx latest\
  \ version\n    apt:\n      name: nginx\n      state: latest\n  - name: starting\
  \ Nginx service\n    service:\n      name: nginx\n      state: started\n```\n\n\
  所做的更改如下：\n\n- 没有清单，因为是 Packer 管理远程主机，即将用于创建镜像的临时 VM。\n- 因此，`hosts` 的值是本地 IP 地址。\n\
  - 我们在此 playbook 中仅保留 NGINX 的安装，并删除了安装 MySQL 数据库的任务。\n\n> Note\n> 此 playbook 的代码可在此处查看：https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP04/templates/ansible/playbookdemo.yml.\n\
  \n现在我们已经编写了 Ansible playbook，我们将看到如何将其执行集成到 Packer 模板中。\n\n### 在 Packer 模板中集成 Ansible\
  \ playbook\n\n就 Packer 模板而言，JSON builders 和 variables 部分与我们在“在 Packer 模板中使用 Ansible”部分中详细介绍的使用脚本的模板之一相同。不同之处在于\
  \ JSON provisioners 部分，我们将按以下方式编写：\n\n```json\n\"provisioners\": [\n{\n\"type\"\
  : \"shell\",\n\"execute_command\": \"sudo sh -c '{{ .Vars }} {{ .Path }}'\",\n\"\
  inline\": [\n\"add-apt-repository ppa:ansible/ansible\", \"apt-get update\", \"\
  apt-get install ansible -y\"\n]\n},\n{\n\"type\": \"ansible-local\",\n\"playbook_file\"\
  : \"ansible/playbookdemo.yml\"\n},\n{\n\n\n\n\n\n本节中描述的操作（Packer 将使用此模板执行这些操作）如下：\n\
  \n- 1. 在临时 VM 上安装 Ansible。\n- 2. 在此临时 VM 上，`ansible-local` 预配器运行 playbook `playbookdemo.yml`，该\
  \ playbook 安装并启动 NGINX。此预配器的文档位于：`https://www.packer.io/docs/provisioners/ansible/ansible-local`。\n\
  - 3. `clean.sh` 脚本删除不再使用的 Ansible 及其依赖包。\n- 4. 取消预配 VM 以删除本地用户信息。\n\n> Note\n> 完整的\
  \ Packer 模板可在此处查看：`https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP04/templates/azure_linux_ansible.json`，clean\
  \ 脚本 `clean.sh` 的源代码可在此处查看：`https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP04/templates/clean.sh`。\n\
  \n如我们在此处所见，Packer 将在用于创建映像的临时 VM 上执行 Ansible，但也可以通过使用 Packer 的 Ansible 预配器远程使用 Ansible，其文档位于：`https://www.packer.io/docs/provisioners/ansible/ansible`。\n\
  至此，我们了解了 Packer 模板由 `builders`、`variables` 和 `provisioners` 部分组成，并且可以在 Packer 模板中使用\
  \ Ansible。\n我们将使用这些 JSON 模板运行 Packer，在 Azure 中创建 VM 映像。\n\n### 执行 Packer\n\n现在我们已创建\
  \ Packer 模板，下一步是运行 Packer 以生成自定义 VM 映像，该映像将用于快速预配已配置并可供应用程序使用的 VM。\n\n作为提醒，要生成此映像，Packer\
  \ 将从我们的 JSON 模板中 _创建临时 VM_，在该 VM 上执行本模板中描述的 _所有配置操作_，然后从此映像 _生成映像_。最后，在执行结束时，它 _删除临时\
  \ VM_ 及其所有依赖项。\n\n要在 Azure 中生成我们的 VM 映像，请执行以下步骤：\n\n- 1. 配置 Packer 以对 Azure 进行身份验证。\n\
  - 2. 检查我们的 Packer 模板。\n- 3. 运行 Packer 以生成我们的映像。\n\n让我们详细了解每个步骤的执行情况。\n\n### 配置 Packer\
  \ 以对 Azure 进行身份验证\n\n为了允许 Packer 在 Azure 中创建资源，我们将使用本章前面在 _使用 Packer 模板构建 Azure\
  \ 映像_ 部分中创建的 Azure AD SP。\n要在 Azure 中执行 Packer，我们将使用此 SP 的四个身份验证信息（subscription_id、client_id、client_secret\
  \ 和 tenant_id），这些信息在我们 Packer 模板的 _variables_ 部分中提供的环境变量中。\n\n在我们的以下模板中，我们有四个变量（_client_id_、_client_secret_、_subscription_id_\
  \ 和 _tenant_id_），它们的值分别取自四个环境变量（_ARM_CLIENT_ID_、_ARM_CLIENT_SECRET_、_ARM_SUBSCRIPTION_ID_\
  \ 和 _ARM_TENANT_ID_）：\n\n![](img/d3344b39c888aab0b832625465f837c9_147_0.png)\n\n\
  图 4.6 – Packer 模板变量\n\n因此，我们可以按如下方式设置这些环境变量（这是 Linux 示例）：\n\n```\nexport ARM_SUBSCRIPTION_ID=<subscription_id>\n\
  export ARM_CLIENT_ID=<client ID>\nexport ARM_CLIENT_SECRET=<client Secret>\nexport\
  \ ARM_TENANT_ID=<tenant ID>\n```\n\n> Note\n> 对于 Windows，我们可以使用 PowerShell $env\
  \ 命令设置环境变量。\n\n身份验证的第一步已完成，我们将现在检查我们编写的 Packer 模板。\n\n### 检查 Packer 模板的有效性\n\n在执行\
  \ Packer 生成映像之前，我们将执行 `packer validate` 命令以检查我们的模板是否正确。\n\n因此，在包含 Packer 模板的文件夹中，我们对模板执行以下命令：\n\
  \n```\npacker validate azure_linux.json\n```\n\n此命令的执行输出返回模板是否有效的检查状态，如以下屏幕截图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_148_0.png)\n\n图 4.7 - Packer validate\
  \ 命令\n\n我们的 Packer 模板语法正确，因此可以启动 Packer 以生成我们的映像。\n\n### 运行 Packer 以生成我们的 VM 映像\n\
  \n要使用 Packer 生成我们的映像，我们将在模板文件上使用 `build` 命令执行 Packer，如下所示：\n\n```\npacker build\
  \ azure_linux.json\n```\n\n在 Packer 执行的输出中，我们可以看到 Packer 正在执行的不同操作。首先是创建临时 VM，如以下屏幕截图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_149_0.png)\n\n图 4.8 – Packer 创建临时 VM\
  \ 输出\n\n在 Azure 门户中，我们看到 Packer 创建的临时资源组及其资源，如以下屏幕截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_149_1.png)\n\
  \n图 4.9 – Azure 门户中的 Packer 临时资源组\n\nPacker 的执行时间取决于要在临时 VM 上执行的操作。执行结束时，Packer\
  \ 指示它已生成映像并删除临时资源。\n\n### 126 使用 Packer 优化基础设施部署\n\n以下屏幕截图是 Packer 执行输出的结束部分，显示了临时资源组的删除和映像的生成：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_150_0.png)\n\n图 4.10 – Packer 执行输出\n\n\
  Packer 执行后，在 Azure 门户中，我们检查映像是否存在。以下屏幕截图显示了我们生成的映像：\n\n![](img/d3344b39c888aab0b832625465f837c9_150_1.png)\n\
  \n图 4.11 – Packer 创建的 Azure VM 映像\n\n在此屏幕中，我们可以看到我们的映像以及使用 Ansible 的 Packer 模板生成的映像。\n\
  \n还值得注意的是，在执行 `packer build` 命令时，我们可以覆盖模板的变量，如以下示例所示：\n\n```\npacker build -var\
  \ 'image_version=0.0.2' azure_linux.json\n```\n\n我们可以将所有变量通过 `-var` 选项传递给 `build`\
  \ 命令。\n\n因此，使用此选项，我们可以在不更改模板内容的情况下更改映像名称，并且可以对模板中定义的所有变量执行此操作。\n\n> **Note**\n>\
  \ Packer build 命令的完整文档可在此处查看：https://www.packer.io/docs/commands/build.html。\n\n\
  我们刚刚了解了用于检查 JSON Packer 模板语法的 Packer 命令行，然后在生成 Azure 中 VM 映像的模板上运行 Packer。\n\n现在我们将学习使用\
  \ HCL 格式编写 Packer 模板的基本元素。\n\n### 使用 HCL 格式编写 Packer 模板\n\n自 Packer 1.5.0 版本发布以来，可以使用\
  \ HCL 格式编写 Packer 模板，我们已在 _第 2 章，使用 Terraform 预配云基础设施_ 中详细了解了该格式。\n\n> **Note**\n\
  > Packer 中的 HCL 集成目前处于 Beta 阶段，HashiCorp 将从 1.7.0 版本开始优先采用该格式。\n\n模板的 HCL 格式与 JSON\
  \ 格式非常相似，由 `variable`、`source`、`build` 和 `provisioner` 块组成。以下代码显示了 HCL Packer 模板的结构。\n\
  \n要编写 HCL 模板，请创建一个包含以下所有代码的 `.pkr.hcl` 文件：\n\n```\npacker {\n  required_plugins\
  \ {\n    azure = {\n      version = \">= 1.0.0\"\n      source = \"github.com/hashicorp/azure\"\
  \n    }\n  }\n}\n\nvariable \"var name\" {\n```\n\n首先，我们从 1.7.0 版本引入的 Packer 插件配置开始。在此块中，我们列出代码中将使用的所有插件。\n\
  \n> Note\n> 有关 Packer 插件的更多信息，请阅读 https://www.packer.io/docs/plugins 上的文档。\n\n然后，在\
  \ `variable` 块中，我们声明用户变量，例如 Azure 凭据、VM 名称、VM 大小或其他变量。以下代码显示示例 `variable` 块：\n\n\
  ```\nvariable \"image_folder\" {\n    default = \"/image\"\n}\nvariable \"vm_size\"\
  \ {\n    default = \"Standard_DS2_v2\"\n}\n```\n\n> Note\n> 有关 HCL 变量的更多信息和详细信息，请阅读\
  \ https://www.packer.io/guides/hcl/variables 上的文档。\n\n\n\n\n\nThe `source` block\
  \ contains the properties of the target image to build an Azure image or Docker\
  \ image. The following code show examples of two `source` blocks:\n\n- The first\
  \ `source` declaration is for an Azure VM:\n\n```\nsource \"azure-arm\" \"azurevm\"\
  \ {\n    os_type = \"Linux\"\n    location = \"West Europe\"\n    vm_size = \"Standard_DS2_V2\"\
  \n    ...\n}\n```\n\n- The second `source` declaration is for the Docker image:\n\
  \n```\nsource \"docker\" \"docker-img\"\n{\n    image = \"ubuntu\"\n    export_path\
  \ = \"imagedocker.tar\"\n}\n```\n\nThe `build` block contains the source list to\
  \ use and the `provisioner` scripts for configuring the images. The following code\
  \ show a sample `build` block:\n\n```\nbuild {\n    sources = [\"sources.azure-arm.azurevm\"\
  ,\"sources.docker.docker-img\"]\n    provisioner \"shell\" {\n    inline = [\n \
  \   \"apt-get update\",\n    \"apt-get -y install nginx\"\n    ]\n    execute_command\
  \ = \"chmod +x {{ .Path }}; {{ .Vars }} sudo -E sh '{{ .Path }}'\"\n    inline_shebang\
  \ = \"/bin/sh -x\"\n    }\n    provisioner \"shell\" {\n    inline = [\n    \"sleep\
  \ 30\",\n    \"/usr/sbin/waagent -force -deprovision+user && export HISTSIZE=0 &&\
  \ sync\"\n    ]\n    execute_command = \"chmod +x {{ .Path }}; {{ .Vars }} sudo\
  \ -E\nsh '{{ .Path }}'\"\n    inline_shebang = \"/bin/sh -x\"\n    }\n}\n```\n\n\
  在前面的代码中，`source` 属性包含在 `source` 块详细信息中刚才声明的源列表。\n\n然后，我们使用一系列 `shell` 类型的 `provisioner`\
  \ 块来安装 NGINX 包并清理包含个人信息的镜像——这与我们使用 JSON 格式时执行的操作完全相同。\n\n> Note\n> 此 HCL 模板格式的代码源可在\
  \ `https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP04/templates/.pkr.hcl`\
  \ 上找到。\n\n最后，要使用 HCL 模板执行 Packer，我们执行以下命令来下载插件：\n\n```\npacker init .pkr.hcl\n```\n\
  \n然后，通过运行 `validate` 命令来检查模板语法：\n\n```\npacker validate .pkr.hcl\n```\n\n最后，通过运行以下命令来构建所需的镜像：\n\
  \n```\npacker build .pkr.hcl\n```\n\n执行前面的命令后，将创建镜像，这与我们之前在 JSON 格式中看到的情况完全相同。\n\
  \n> Note\n> 要将 Packer 模板从 JSON 格式迁移到 HCL 格式，请阅读此文档：`https://learn.hashicorp.com/tutorials/packer/hcl2-upgrade`。\n\
  \n### 将 Packer 镜像与 Terraform 配合使用\n\n现在，我们已经生成了自定义 VM 镜像，将基于此新镜像预配一个新 VM。对于此 VM\
  \ 的预配，我们将继续使用 HashiCorp 的 Terraform 实践 IaC。\n\n为此，我们将使用在第 2 章《使用 Terraform 预配云基础架构》中创建的\
  \ Terraform 脚本，并对其进行修改以使用自定义镜像。\n\n在 `compute.tf` 脚本中，添加以下数据块，该块将指向我们在上一节中使用 Packer\
  \ 生成的 VM 镜像：\n\n```\n### GET THE CUSTOM IMAGE CREATED BY PACKER\ndata \"azurerm_image\"\
  \ \"customngnix\" {\n    name = \"linuxWeb-0.0.1\"\n    resource_group_name = \"\
  rg_images\"\n}\n```\n\n在此代码中，我们添加了一个 `azurerm_image` Terraform 数据块，它允许我们检索 Azure\
  \ 中 VM 镜像的属性，其中我们使用自定义镜像的名称指定 `name` 属性，并使用镜像的资源组指定 `resource_group_name` 属性。\n\n\
  有关此 `azurerm_image` 数据块及其属性的更多信息，请参阅文档：https://www.terraform.io/docs/providers/azurerm/d/image.html。\n\
  \n然后，在 VM Terraform 代码中的 `azurerm_virtual_machine` 资源代码（仍在 `compute.tf` 文件中），`storage_image_reference`\
  \ 部分将使用以下代码进行修改：\n\n```\nresource \"azurerm_virtual_machine\" \"vm\" {\n...\n###\
  \ USE THE CUSTOM IMAGE\nstorage_image_reference {\n    id = \"${data.azurerm_image.customngnix.id}\"\
  \n}\n```\n\n在此代码中，ID 属性使用我们先前添加的数据块中镜像的 ID。\n\n> Note\n> `compute.tf` 脚本的完整代码可在此处找到：`https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/blob/main/CHAP04/terraform/compute.tf`，完整的\
  \ Terraform 代码可在此处找到：`https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP04/terraform`。\n\
  \n执行此 Terraform 代码时，与第 2 章《使用 Terraform 预配云基础架构》中看到的经典 Terraform 执行相同，预配的 VM 将基于\
  \ Packer 生成的自定义镜像。\n\n我们看到，通过稍微修改我们之前的 Terraform 代码，添加一个检索 VM 镜像信息的数据块，并使用该镜像的 ID，我们就可以在\
  \ Terraform 中使用 Packer 生成的自定义 VM 镜像。\n\n### 摘要\n\n在本章中，我们了解了如何安装 Packer 并使用它来创建自定义\
  \ VM 镜像。VM 镜像是由两个 Packer 模板制作而成：第一个使用脚本，第二个使用 Ansible。\n\n然后，我们了解了如何使用 HCL 格式编写\
  \ Packer 模板。最后，我们修改了 Terraform 代码以使用我们的 VM 镜像。\n\n本章结束了 IaC 实践的实现，首先使用 **Terraform**\
  \ 预配云基础架构，然后使用 **Ansible** 进行服务器配置，最后使用 **Packer** 完成 VM 镜像创建。\n\n借助这些由 Packer 创建的\
  \ VM 镜像，我们将能够通过更快的部署、即用型 VM 以及因此减少停机时间来改善基础架构预配时间。\n\n显然，这些并非唯一的 IaC 工具；市场上有许多其他工具，您将需要进行技术监控，以找到最适合您需求的工具。\n\
  \n在下一章中，我们将开始一个新部分，即 CI/CD 的实现，并学习如何使用 Git 来管理您的代码。\n\n### 问题\n\n1. 什么是安装 Packer\
  \ 的两种方式？\n\n2. 用于在 Azure 中创建 VM 镜像的 Packer 模板的强制性部分有哪些？\n\n3. 哪个命令用于验证 Packer 模板？\n\
  \n4. 哪个命令用于生成 Packer 镜像？\n\n### 延伸阅读\n\n如果您想了解更多有关 Packer 的信息，以下是一些资源：\n\n- Packer\
  \ 文档：https://www.packer.io/docs/\n- Packer Learning：https://learn.hashicorp.com/packer\n\
  - 在 Azure 中使用 Packer：https://docs.microsoft.com/en-us/azure/virtual-machines/linux/build-image-with-packer\n\
  - 使用 Packer 设计不可变基础架构（Pluralsight 视频）：https://www.pluralsight.com/courses/packer-designing-immutable-infrastructure\n"
- "## 5 使用 Vagrant 构建开发环境\n\n在前面的章节中，我们学习了如何使用 Terraform 预配基础架构，如何使用 Ansible 安装中间件，以及最后如何使用\
  \ Packer 创建虚拟机 (VM) 镜像。\n\n运维团队经常指出的一个问题是，他们需要能够在隔离环境中测试所有自动化脚本，即不在本地计算机上的环境。例如，在\
  \ Linux 下编写 Ansible 脚本，在本地 Windows 机器上测试是困难的。\n\n为了解决这个问题，我们可以使用 Hyper-V 或 VirtualBox\
  \ 等虚拟化系统，它们允许您在本地运行带有不同操作系统的 VM。但是，要更进一步，我们可以使用 HashiCorp 的 Vagrant 工具来自动化这些 VM\
  \ 的创建和预配。\n\n在本章中，我们将学习使用 Vagrant 的基础知识。我们将讨论其安装、如何编写 Vagrant 文件，以及最后，我们将检查其执行以创建和预配\
  \ Linux VM。\n\n在本章中，我们将介绍以下主要主题：\n\n- 安装 Vagrant\n- 编写 Vagrant 配置文件\n- 使用 Vagrant\
  \ CLI 预配本地 VM\n\n### 技术要求\n\nVagrant 可以在任何虚拟机监控程序上创建 VM。在本章中，我们将使用 VirtualBox 作为本地\
  \ VM 虚拟机监控程序。您可以从 `https://www.virtualbox.org/wiki/Downloads` 下载并安装它。\n\n在 Windows\
  \ 上，如果您已经安装了 Hyper-V，要使用 VirtualBox，您需要禁用 Hyper-V。请参阅以下文档：\n\n`https://www.vagrantup.com/docs/installation#windows-virtualbox-and-hyper-v`\n\
  \n本章中执行的所有命令都将在终端控制台（例如 PowerShell 或 Bash）中执行。\n\n本章的完整源代码可在此处找到：\n\n`https://github.com/PacktPublishing/Learning-DevOps-Second-Edition/tree/main/CHAP05/`\n\
  \n查看以下视频以查看代码实际运行情况：`https://bit.ly/3s5a049`\n\n### 安装 Vagrant\n\nVagrant 是一个跨平台工具，可以安装在\
  \ Windows、Linux 或 macOS 上。安装可以通过两种方式进行：手动安装或通过 Windows 中的脚本安装。\n\n### 在 Windows\
  \ 上手动安装\n\n要在 Windows 上手动安装 Vagrant，请执行以下步骤：\n\n1. 转到官方下载页面 (`https://www.vagrantup.com/downloads`)，单击\
  \ **Windows** 选项卡，并下载与您操作系统 CPU 类型（32 位或 64 位）对应的 MSI 包。\n\n\n\n\n\n### 2. 下载完成后，单击下载的\
  \ MSI 文件并选择安装目录（保留默认值）：\n\n![](img/d3344b39c888aab0b832625465f837c9_161_0.png)\n\
  \n图 5.1 – Vagrant Setup 文件夹选择\n\n### 3. 然后，单击 Install 按钮：\n\n![](img/d3344b39c888aab0b832625465f837c9_161_1.png)\n\
  \n图 5.2 – Vagrant Setup Install 按钮\n\n你已学习如何在 Windows 系统上手动安装 Vagrant。在下一节中，我们将讨论使用\
  \ Chocolatey 或脚本安装 Vagrant。\n\n### 在 Windows 上通过脚本安装 Vagrant\n\n在 Windows 上，我们可以使用\
  \ **Chocolatey**，它是一个软件包管理器。\n\n> **注意**\n> 在本章中，我不会重新介绍 Chocolatey，因为我们已在前面的章节中介绍过。有关\
  \ Chocolatey 的更多信息，请阅读 https://chocolatey.org/ 上的文档。\n\n安装 Chocolatey 后，我们只需在 PowerShell\
  \ 或 CMD 工具中运行以下命令：\n\n```\nchoco install vagrant -y\n```\n\n以下是使用 Chocolatey 在 Windows\
  \ 上安装 Vagrant 的截图：\n\n![](img/d3344b39c888aab0b832625465f837c9_162_0.png)\n\n要完成\
  \ Vagrant 的安装，我们需要重启机器。\n\n### 在 Linux 上通过脚本安装 Vagrant\n\n在 Linux 上，我们可以执行以下脚本来自动安装\
  \ Vagrant：\n\n```\nsudo apt-get update && sudo apt-get install -y gnupg software-properties-common\
  \ curl \\\n&& curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add\
  \ - \\\n&& sudo apt-add-repository \"deb [arch=amd64] https://apt.releases.hashicorp.com\
  \ $(lsb_release -cs) main\" \\\n&& sudo apt-get update && sudo apt-get install vagrant\n\
  ```\n\n此脚本执行以下操作：\n\n- 它添加 apt HashiCorp 存储库。\n- 它更新本地存储库。\n- 它下载并安装 Vagrant CLI。\n\
  \n> **注意**\n> 有关在其他操作系统上安装 Vagrant 的所有信息，请参阅 `https://www.vagrantup.com/downloads`\
  \ 上的文档。\n\n安装 Vagrant 后，我们可以通过运行以下命令来测试 Vagrant CLI 的安装：\n\n```\nvagrant --version\n\
  ```\n\n上述命令显示已安装的 Vagrant 版本，以下截图显示了此命令的执行情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_163_0.png)\n\
  \n图 5.4 – 显示已安装的 Vagrant 版本\n\n我们刚刚学习了 Vagrant 的手动安装过程以及如何在 Linux 上使用脚本安装它。\n\n\
  现在，我们将介绍一些主要的 Vagrant 工件，并编写 Vagrant 模板配置，以在本地创建一个基本的 Linux VM，并使用 Ansible 对其进行配置来测试\
  \ Ansible 脚本。\n\n### 编写 Vagrant 配置文件\n\n在讨论如何编写 Vagrant 配置文件之前，有必要提及 Vagrant 的几个工件。\n\
  \nVagrant 的重要元素如下：\n\n- Vagrant 二进制文件（CLI）：我们在上一节 _Installing Vagrant_ 中学习了如何下载和安装它。\n\
  \n- VM 的基础镜像，称为 **Vagrant Boxes**，将在配置文件中使用和提及。此镜像可以是公共镜像，即发布在 Vagrant 云上的镜像，也可以是机器上的本地镜像。\n\
  \n- 配置文件定义了我们想要在本地创建的 VM 的组成。\n\n现在我们已经了解了 Vagrant 的不同元素，将编写我们 VM 的配置文件。首先，我们将检查将使用哪个基础机器。\n\
  \n### 使用 Vagrant Cloud 获取 Vagrant Boxes\n\n要使用基本 Vagrant 镜像，HashiCorp 已设置了一个门户，允许你发布和公开共享与\
  \ Vagrant 兼容的 VM 镜像。\n\n要访问这些镜像（称为 boxes），你可以导航到 `https://app.vagrantup.com/boxes/search`\
  \ 网站，然后根据以下标准搜索你感兴趣的特定 box：\n\n- 操作系统（Windows 或 Linux）\n\n- 支持的虚拟机监控程序\n\n- 已安装的中间件\n\
  \n- 发布者\n\n以下截图显示了在 Vagrant Cloud 上搜索的示例：\n\n![](img/d3344b39c888aab0b832625465f837c9_165_0.png)\n\
  \n图 5-5 – Vagrant Cloud 搜索框\n\n在此示例中，我们正在搜索一个基本 Bionic box。在结果列表中，我们找到了官方的 `ubuntu/bionic64`\
  \ box，它与 VirtualBox 虚拟机监控程序兼容。\n\n单击所需的 box 后，门户将显示更多信息，例如配置详细信息和 box 的变更日志：\n\n\
  ![](img/d3344b39c888aab0b832625465f837c9_166_0.png)\n\nubuntu / bionic64 Vagrant\
  \ box\n\n如何使用 Vagrant 使用此 box：\n\n```\nVagrantfile New\nVagrant.configure(\"2\"\
  ) do |config|\n  config.vm.box = \"ubuntu/bionic64\"\nend\n```\n\nv20210827.0.0\
  \ 当前发布版本\n\n此版本是在 1 天前创建的。\n\n没有描述。\n\n图 5.6 – Vagrant Cloud box 详细信息\n\n> **注意**\n\
  > 有关 Vagrant Cloud 以及如何创建和发布自定义 boxes 的更多信息，建议你参阅 https://www.vagrantup.com/vagrant-cloud\
  \ 上的官方文档。\n\n现在我们已选择基础 box，将为我们的 VM 编写 Vagrant 配置文件。\n\n### 编写 Vagrant 配置文件\n\n\
  要使用 Vagrant 创建本地 VM，我们需要在配置文件中编写 VM 的配置。\n\n此配置将包含有关 VM 的信息，例如：\n\n- 要使用的 box\n\
  - 硬件配置，例如 RAM 和 CPU\n- 网络配置\n- 用于配置和配置 VM 的脚本\n- 要与 VM 共享的本地文件夹\n\n在本节中，我们将学习如何创建一个基本的\
  \ Vagrant 配置文件，该文件将创建一个本地 VM，其中已安装 Ansible 二进制文件。\n\n要创建 Vagrant 配置，请执行以下步骤：\n\n\
  1. 创建一个名为 `VagrantFiles` 的文件夹。\n2. 在此文件夹内，打开一个新的终端控制台，并运行带有 box 名称的 `vagrant init`\
  \ 命令，如下所示：\n\n```\nvagrant init ubuntu/bionic64\n```\n\n以下截图显示了此命令的执行情况：\n\n![](img/d3344b39c888aab0b832625465f837c9_167_0.png)\n\
  \n上述命令创建了一个新的 Vagrantfile 文件，其中包含 bionic VM 的基本配置，代码如下：\n\n```\nVagrant.configure(\"\
  2\") do |config|\nconfig.vm.box = \"ubuntu/bionic64\"\nend\n```\n\n接下来，我们将添加脚本，以便在配置此\
  \ VM 时安装 Ansible。\n\n3. 在此 `VagrantFiles` 文件夹中，创建一个名为 `scripts` 的新文件夹，然后使用以下内容创建一个名为\
  \ `ansible.sh` 的新脚本文件：\n\n```\napt-get update\nsudo apt-get --assume-yes install\
  \ software-properties-common\nsudo apt-add-repository --yes --update ppa:ansible/ansible\n\
  sudo apt-get --assume-yes install ansible\n```\n\n4. 在 Vagrantfile 文件中，使用以下行更新配置：\n\
  \n```\nVagrant.configure(\"2\") do |config|\nconfig.vm.box = \"ubuntu/bionic64\"\
  \nconfig.vm.provision \"shell\", path: \"scripts/ansible.sh\"\nend\n```\n\n5. 要测试本地\
  \ Ansible playbook，我们可以通过在配置文件中添加以下行来共享本地目录与 VM：\n\n```\nVagrant.configure(\"2\"\
  ) do |config|\nconfig.vm.box = \"ubuntu/bionic64\"\nconfig.vm.provision \"shell\"\
  , path: \"scripts/ansible.sh\"\nconfig.vm.synced_folder \"C:\\\\<path>\\\\CHAP03\\\
  \\devopsansible\", \"/learningdevops\"\nend\n```\n\n在上述配置中，我们在本地机器和 VM 中的 /learningdevops\
  \ 文件夹之间共享了本地 c:\\\\...\\Chap03\\\\devopsansible 文件夹（这是本地文件夹的一个示例）。\n\n> **注意**\n\
  > 有关此 Vagrant 配置文件的更多详细信息，请参阅 https://www.vagrantup.com/docs/vagrantfile 上的完整文档。\n\
  \n6. 最后一步是通过运行以下命令来验证此配置文件：\n\n```\nvagrant validate\n```\n\n此命令的输出显示在以下截图中：\n\n\
  ![](img/d3344b39c888aab0b832625465f837c9_168_0.png)\n\n图 5.8 – 验证 Vagrant 配置\n\n\
  \n\n\n\n> 注意\n> 在本节中，我们学习了如何使用 Vagrant 配置文件创建 VM。如果希望在同一配置文件中创建多个 VM，请参阅官方文档 https://www.vagrantup.com/docs/multi-machine。\n\
  \n我们刚刚讨论了如何选择 Vagrant box 以及如何编写 Vagrant 配置文件。现在，在下一节中，我们将学习如何使用 Vagrant CLI 和配置文件在本地创建\
  \ VM。\n\n### 使用 Vagrant CLI 创建本地 VM\n\n既然我们已经编写了配置文件，就可以在本地创建 VM 了。\n\n为此，我们将使用多个\
  \ Vagrant CLI 命令。要显示所有可用命令，我们将运行 `vagrant --help` 命令：\n\n```\nPS C:\\Learning-DevOps-Second-Edition\\\
  CHAP05\\VagrantFiles> vagrant --help\nUsage: vagrant [options] <command> [<args>]\n\
  \n-h, --help Print this help.\n\nCommon commands:\n autocomplete manages autocomplete\
  \ installation on host\n box manages boxes: installation, removal, etc.\n cloud\
  \ manages everything related to Vagrant Cloud\n destroy stops and deletes all traces\
  \ of the vagrant machine\n global-status outputs status Vagrant environments for\
  \ this user\n halt stops the vagrant machine\n help shows the help for a subcommand\n\
  \ init initializes a new Vagrant environment by creating a Vagrantfile\n login\n\
  \ package packages a running vagrant environment into a box\n plugin manages plugins:\
  \ install, uninstall, update, etc.\n port displays information about guest port\
  \ mappings\n powershell connects to machine via powershell remoting\n provision\
  \ provisions the vagrant machine\n push deploys code in this environment to a configured\
  \ destination\n rdp connects to machine via RDP\n reload restarts vagrant machine,\
  \ loads new Vagrantfile configuration\n resume resume a suspended vagrant machine\n\
  \ snapshot manages snapshots: saving, restoring, etc.\n ssh connects to machine\
  \ via SSH\n ssh-config outputs OpenSSH valid configuration to connect to the machine\n\
  \ status outputs status of the vagrant machine\n suspend suspends the machine\n\
  \ up starts and provisions the vagrant environment\n upload upload to machine via\
  \ communicator\n validate validates the VagrantFile\n version prints current and\
  \ latest Vagrant version\n winrm executes commands on a machine via WinRM\n winrm-config\
  \ outputs WinRM configuration to connect to the machine\n```\n\n图 5.9 – 显示 Vagrant\
  \ 命令\n\n> 注意\n> 关于 Vagrant CLI 命令的所有详细信息均记录在 https://www.vagrantup.com/docs/cli。\n\
  \n在下一节中，我们将学习如何创建 VM，然后连接到该 VM，最后执行一些脚本。\n\n### 创建 VM\n\n要创建 VM，请导航到创建 `Vagrantfile`\
  \ 文件的文件夹，并运行以下命令：\n\n```\nvagrant up\n```\n\n输出如下截图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_170_0.png)\n\
  \n执行上述命令将执行以下步骤：\n\n- 从 Vagrant Cloud 导入 box。\n- 在 hypervisor 中创建新 VM（在本例中，这是 VirtualBox）。\n\
  - 使用 SSH 密钥创建 SSH 连接（Vagrant 创建私有/公共 SSH 密钥）。\n- 挂载共享文件夹。\n- 应用 provisioning Ansible\
  \ 脚本。\n\nVM provisioning 完成后，我们可以在 VirtualBox 中的 hypervisor 里查看此 VM。\n\n既然 VM 已启动并完成了\
  \ provisioning，我们可以连接到它。\n\n### 连接到 VM\n\n要使用 SSH 连接 VM，可以使用专用于 Vagrant 的默认 SSH\
  \ 命令（以管理员模式运行）：\n\n```\n`vagrant ssh`\n```\n\n输出如下截图所示：\n\n```\nPS C:\\Users\\Administrator\\\
  Learning-DevOps-Second-Edition\\CHAP05\\VagrantFiles> vagrant ssh\nWelcome to Ubuntu\
  \ 18.04.5 LTS (GNU/Linux 4.15.0-154-generic x86_64)\n\n * Documentation:  https://help.ubuntu.com\n\
  \ * Management:     https://landscape.canonical.com\n * Support:        https://ubuntu.com/advantage\n\
  \nSystem information as of Sun Aug 29 14:25:23 UTC 2021\n\nSystem load:  0.01  \
  \              Processes:             96\nUsage of /:   4.1% of 38.71GB     Users\
  \ logged in:       0\nMemory usage: 17%                 IP address for enp0s3: 10.0.2.15\n\
  Swap usage:   0%\n\n0 updates can be applied immediately.\n\nNew release '20.04.3\
  \ LTS' available.\nRun 'do-release-upgrade' to upgrade to it.\n\nvagrant@ubuntu-bionic:~$\n\
  ```\n\n图 5.11 – 连接 SSH 到 Vagrant VM\n\n执行此命令意味着 Vagrant 自动将 SSH 凭据连接到 VM，我们可以在 VM\
  \ 内部运行任何命令或脚本。\n\n例如，我们可以运行 `ansible --version` 命令以显示已安装的 Ansible 版本：\n\n```\nvagrant@ubuntu-bionic:\
  \ $ ansible --version\nansible 2.9.24\n  config file = /etc/ansible/ansible.cfg\n\
  \  configured module search path = [u'/home/vagrant/.ansible/plugins/modules', u'/usr/share/ansible/plugins/modules']\n\
  \  ansible python module location = /usr/lib/python2.7/dist-packages/ansible\n \
  \ executable location = /usr/bin/ansible\n  python version = 2.7.17 (default, Feb\
  \ 27 2021, 15:10:58) [GCC 7.5.0]\nvagrant@ubuntu-bionic: $\n```\n\n图 5.12 – 在 VM\
  \ 内部执行命令\n\n运行所需的测试后，如果我们希望销毁此 VM 以重新创建它，可以运行 `vagrant destroy` 命令：\n\n```\nPS C:\\\
  Users\\<username>\\Learning-DevOps-Second-Edition\\CHAP05\\VagrantFiles> vagrant\
  \ destroy\ndefault: Are you sure you want to destroy the 'default' VM? [y/N] y\n\
  ==> default: Forcing shutdown of VM...\n==> default: Destroying VM and associated\
  \ drives...\n```\n\n图 5.13 – 销毁 Vagrant VM\n\n在本节中，我们学习了如何使用 Vagrant CLI 创建 VM 并连接到它。\n\
  \n### 摘要\n\n在本章中，我们了解到可以使用 HashiCorp 的 Vagrant 在本地创建 VM，以便拥有一个隔离的开发环境。\n\n我们讨论了如何下载和安装它。然后，我们学习了如何使用\
  \ Bionic box、一个 `ansible install` 脚本和一个本地共享文件夹编写 Vagrant 配置文件。\n\n最后，我们学习了如何执行 Vagrant\
  \ 命令行以创建此 VM 并连接到它进行测试。\n\n在下一章中，我们将开始一个新主题，即 CI/CD 的实现，并学习如何使用 Git 来管理您的代码。\n\n\
  ### 问题\n\n- Vagrant 的作用是什么？\n- 创建 VM 的 Vagrant 命令是什么？\n- 连接 SSH 到 VM 的 Vagrant 命令是什么？\n\
  \n### 延伸阅读\n\n如果您想了解更多关于 Vagrant 的信息，请查看以下资源：\n\n- 官方 Vagrant 文档：https://www.vagrantup.com/docs/\n\
  - 官方 Vagrant Cloud 文档：https://www.vagrantup.com/vagrant-cloud\n"
- '# 第 2 部分：DevOps CI/CD 管道


  本部分涵盖 DevOps 管道流程，从持续集成和持续部署的原则开始。它将通过使用不同的工具进行说明，包括 Jenkins、Azure Pipelines 和 GitLab。


  本节包含以下章节：


  - 第 6 章，使用 Git 管理您的源代码

  - 第 7 章，持续集成和持续部署

  - 第 8 章，使用 CI/CD 管道部署基础设施即代码

  '
- "## 6 使用 Git 管理源代码\n\n几年前，当我们作为开发人员并作为团队的一部分编写代码时，我们遇到了反复出现的问题，大部分问题如下：\n\n- 如何与团队成员共享我的代码\n\
  - 如何对我的代码更新进行版本控制\n- 如何跟踪我代码的更改\n- 如何检索我代码的旧状态或其部分\n\n随着时间的推移，这些问题已通过源代码管理器的出现得到解决，也称为\
  \ **版本控制系统 (VCS)** 或更常见地称为 **版本控制管理器 (VCM)**。\n\n这些 VCS 的目标主要是执行以下操作：\n\n- 允许开发人员代码协作\n\
  - 检索代码\n- 对代码进行版本控制\n- 跟踪代码更改\n\n\n\n\n\n\n随着敏捷方法和 **开发-运维（DevOps）** 文化的兴起，在流程中使用版本控制系统（VCS）已成为强制性要求。正如在\
  \ _第 1 章，DevOps 文化和基础设施即代码实践_ 中所述，实施 **持续集成/持续部署（CI/CD）** 流程的前提条件是必须使用 VCS。\n\n\
  在本章中，我们将了解如何使用最著名的 VCS 之一——Git。我们将先概述 Git 并了解如何安装它。然后，我们将学习其主要命令行，以便让任何开发者熟悉其用法。最后，我们将了解当前使用\
  \ Git 工作流和 Gitflow 的过程。本章的目的是展示如何使用简单的流程在日常工作中使用 Git。\n\n本章涵盖以下主题：\n\n- 概述 Git 及其主要命令行\n\
  - 了解 Git 流程和 Gitflow 模式\n\n本章不涵盖 Git 服务器的安装，因此如果您想了解更多相关信息，可以参考以下链接的文档：`https://git-scm.com/book/en/v2/Git-on-the-Server-The-Protocols.`\n\
  \n### 技术要求\n\n使用 Git 没有任何技术先决条件；我们只需要一个命令行终端。\n\n为了在本章中说明其用法，我们将使用 Azure DevOps\
  \ 平台上的 Azure Repos（原名 **Visual Studio Team System (VSTS)**），这是一个带有 Git 仓库管理器的云平台。您可以在此处免费注册：`https://visualstudio.microsoft.com/team-services/`。\n\
  \n查看以下视频，观看代码的实际运行情况：`https://bit.ly/3LTcoOi`。\n\n### 概述 Git 及其主要命令行\n\n要了解 Git\
  \ 的起源，有必要知道有两种类型的 VCS：集中式系统和分布式系统。\n\n最早出现的第一种类型是 **集中式系统**，例如 **Subversion (SVN)**、**Concurrent\
  \ Version System (CVS)**、**Team Foundation Version Control (TFVC)** 和 Microsoft\
  \ **Visual SourceSafe (VSS)**。这些系统由一个远程服务器组成，该服务器集中存储所有开发者的代码。\n\n我们可以这样表示集中式源代码控制系统：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_179_0.png)\n\n图 6.1 – 集中式源代码控制\n\n所有开发者都可以在远程服务器上存档和检索他们的代码。该系统允许团队之间更好地协作，并保证代码备份。但是，它也有其缺点，例如：\n\
  \n- 如果开发者与远程服务器之间没有连接（由于网络问题或因特网断开连接），则无法再执行存档或代码恢复操作。\n- 如果远程服务器不再工作，代码以及历史记录都将丢失。\n\
  \n第二种 VCS 类型，即后来出现的 **分布式系统**，例如 Mercurial 或 Git。这些系统由一个远程仓库和每个开发者本地机器上的该仓库的本地副本组成，如下图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_179_1.png)\n\n图 6.2 – 分布式源代码控制\n\n因此，使用这种分布式系统，即使与远程仓库断开连接，开发者也可以继续使用本地仓库工作，并在远程仓库再次可访问时进行同步。代码及其历史记录的副本也存在于本地仓库中。\n\
  \n因此，Git 是一个分布式 VCS，由 Linus Torvalds 和 Linux 开发社区于 2005 年创建。\n\n> 注意\n> 要了解更多关于\
  \ Git 历史的信息，请阅读此页面：`https://git-scm.com/book/en/v2/Getting-Started-A-Short-History-of-Git`。\n\
  \n自创建以来，Git 已成为一个非常强大且成熟的工具，任何人都可以用于编码。\n\nGit 是一个免费的跨平台工具，可以安装在本地机器上供操作代码的人使用——即客户端模式——但也可以安装在服务器上以托管和管理远程仓库。\n\
  \nGit 是一个带有大量选项的命令行工具。然而，如今有许多图形化工具——例如 Git GUI、GitKraken、GitHub Desktop 或 Sourcetree——允许您更轻松、更直观地与\
  \ Git 操作进行交互，而无需自己使用命令行。但是，这些图形化工具不包含命令行中可用的所有操作和选项。幸运的是，许多代码编辑器，例如 **Visual Studio\
  \ Code (VS Code)**、Visual Studio、JetBrains 和 Sublime Text，允许与 Git 和远程仓库直接集成代码。\n\
  \n对于远程仓库，有几种云和免费解决方案，例如 GitHub、GitLab、Azure DevOps 或 Bitbucket Cloud。此外，还有称为本地解决方案的其他解决方案，可以安装在企业中，例如\
  \ Azure DevOps Server、Bitbucket 或 GitHub Enterprise。\n\n在本章中，我们将了解如何使用 Git——例如，将\
  \ Azure DevOps 作为远程仓库——并且我们将在未来章节中了解如何使用 GitLab 和 GitHub。\n\n在本节中，我们介绍了 Git，现在将了解如何在本地机器上安装它以开发和版本化我们的源代码。\n\
  \n### Git 安装\n\n我们现在将详细介绍在 Windows、Linux 和 macOS 系统上安装和配置 Git 的步骤。\n\n要在 Windows\
  \ 机器上手动安装，我们必须从 `https://gitforwindows.org/` 下载 **Git for Windows 工具** 可执行文件，下载完成后，单击可执行文件，并在安装过程中按照以下不同的配置步骤操作：\n\
  \n1. 为 Git 二进制文件选择安装路径。我们保留默认路径，如下图所示：\n\n![](img/d3344b39c888aab0b832625465f837c9_181_0.png)\n\
  \n图 6.3 – Git 安装路径\n\n2. 在 Windows 资源管理器中选择 Git 集成组件，标记 **Windows 资源管理器集成** 复选框，如下图所示：\n\
  \n![](img/d3344b39c888aab0b832625465f837c9_182_0.png)\n\n图 6.4 – 选择 Git 安装组件\n\n\
  3. 选择您的代码编辑器 **集成开发环境 (IDE)**；在我们的情况中，我们通过选择 **将 Visual Studio Code 用作 Git 的默认编辑器**\
