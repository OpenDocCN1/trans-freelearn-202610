  \n## 摘要\n\n本章提供了下一代基于云的分析应用程序的简要概述，该应用程序提供端到端的云分析体验。SAP Analytics Cloud 可帮助改变您在单一解决方案中发现、规划、预测、协作、可视化和扩展的方式。除了本地数据源之外，您还可以从各种其他云应用甚至\
  \ Excel 和文本文件中获取数据来构建数据模型，然后基于这些模型创建故事。这款出色且易于使用的应用程序的最终目的是让您做出正确的决策。SAP Analytics\
  \ Cloud 不仅仅是数据的可视化；它是洞察到行动，是成功的实现。\n\n系好安全带，准备进行云之旅。从下一章开始，您将执行动手练习来探索 SAP Analytics\
  \ Cloud 的精彩世界，从模型开始。\n\n## SAP Analytics Cloud 中的模型\n\n在 SAP Analytics Cloud 中，您创建模型作为所有数据输出的基础。模型是对组织业务数据的表示。它是暴露最终用户分析需求的高级设计。为了确定模型中包含的内容，您必须首先识别源数据中用户需要查询的列。然后，为了确定每列所扮演的角色，请确定它是度量列还是维度属性。我们将学习这些属性以及许多其他步骤，这些步骤将帮助我们创建和查看模型以及其他数据过滤。\n\
  \n本章将涵盖以下主题：\n\n- 模型简介\n- 理解度量和维度\n- 规划和分析模型\n- 创建新的分析模型\n- 在建模器界面中查看模型详细信息\n- 浏览模型\n\
  - 查看模型数据\n\n## 理解度量和维度\n\n您将在本书中看到“measures”和“dimensions”这两个术语。从源导入的每个数据列以在 SAP\
  \ Analytics Cloud 中构建模型必须标记为度量或维度。度量是组织衡量其业务运营和绩效的列，而维度列包含用于限定度量的数据。\n这些术语可以进一步扩展如下：\n\
  \n**度量：** 度量是可以进行测量、聚合或用于数学运算的字段。度量通常是计算得出的数据，例如美元价值或销售数量，并且可以根据维度进行指定。例如，您可能想要确定在给定市场在给定时间段内特定产品的美元总和。\n\
  \n**维度：** 企业使用度量通过成熟的维度来评估绩效，例如按时间、产品和市场。维度通常是无法聚合的字段。维度包含描述业务实体（例如时间、产品、客户名称、区域、国家、城市、地址等）的值。在给定的维度中，可能存在许多属性。例如，时间维度可以包含年份、季度、月份、周和日等属性。这些属性用于深入和跨维度钻取以获得数据的更详细视图。\n\
  \n在关系数据库管理系统（RDBMS）术语中，连接一端的表被视为维度表，而连接多端的表则被视为度量表。以下图示说明了到承载度量数据的表的多对一连接。在此图中，所有连接都具有鸽足符号（表示多侧）指向度量表：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_59_0.png)\n\n![](img/c69568baeee565fe02397867c05883e1_59_1.png)\n\
  \n*当您在 SAP Analytics Cloud 中导入数据以创建模型时，它会确定将字段视为维度还是度量。默认情况下，所有文本值的字段被确定为维度，而数值字段被视为度量。*\n\
  \n## 规划和分析模型\n\n在 SAP Analytics Cloud 中，您可以创建规划和分析模型。规划模型是一个功能齐全的模型，其中预先配置了实际、预算、规划、预测和滚动预测的时间和类别维度。规划模型还支持多币种，并在模型和维度级别提供安全功能，以限制对报告中特定值的访问，仅限指定个人。它还具有用于可追溯性的审计功能。拥有规划权限的用户可以创建模型数据的自己的版本，使用分配功能，向模型添加新数据，并将数据复制并粘贴到模型中。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_60_0.png)\n\n*相比之下，分析模型是更简单、更灵活的通用 BI\
  \ 模型。分析模型未预先配置预算和预测数据的类别。*\n\n除了这两种模型之外，您还可以连接到 SAP **high-performance analytic\
  \ appliance (HANA)** 数据库以导入数据库视图并创建新模型。您可以基于 HANA 视图创建分析模型，这使您可以从 HANA 访问维度。要创建此类模型，系统管理员必须首先设置\
  \ HANA 数据库。数据库中的分析或计算类型 HANA 视图可以导入以创建新的分析类型模型。视图只能导入一次；要重新导入视图，请从“模型”列表页面删除现有模型，然后开始导入过程。\n\
  \n本章将教您如何从 Excel 文件创建一个简单的分析模型，而规划模型是第 3 章 *规划模型* 的主题。\n\n\n\n## 创建新的分析模型\n\n执行以下步骤创建新的分析模型。截图中包含编号步骤，说明创建分析模型的顺序：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_61_0.png)\n\n## 选择源文件\n\n您可以将数据从外部文件（如\
  \ Excel 电子表格或逗号分隔值文件）导入到新模型中。如果数据保存在 Excel 工作簿的多个工作表中，您将看到一个下拉列表，可从中选择要导入的工作表：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_62_0.png)\n\n源数据必须包含可用于在新模型中创建维度的列，并且还必须包含事务数据（度量）。事务数据在建模器中不可见，仅在生成的输出中可见。\n\
  \n您可以连接到其他系统以从外部源创建新模型。要连接到此类外部源，您必须选择使用数据源或从应用程序获取数据选项。您也可以通过单独设置维度并精确定义模型的所有偏好和细节来手动创建模型。您可以在向故事添加表格时在规划向导中使用的模板创建模型。\n\
  \n请注意，其中一些模型创建选项在试用版中不可用。因此，为了保持简单，您将使用 Excel 文件创建模型。Bocage.xlsx 文件是随本书提供的用于演示目的的简单\
  \ Excel 文件。它包含度量数据（Quantity sold、Sales Revenue、Gross Margin、Discount、和 Original\
  \ Sales Price）用于衡量使用日期、州、城市、商店、经理、产品和类别维度的绩效。除了度量和维度外，该文件还包含两列（纬度和经度）可帮助您在地理地图中可视化数据。此文件可从\
  \ https://github.com/PacktPublishing/Learning-SAP-Analytics-Cloud 下载。\n\n## 为模型设置名称、描述和其他参数\n\
  \n一段时间后，您将在 DataView 选项卡中看到包含已上传数据的 Data Integration 屏幕，如以下屏幕截图所示：\n\n![](img/c69568baeee565fe02397867c05883e1_63_0.png)\n\
  \n源数据的初始列标题名称与符号 (A) 一起显示，以显示已识别的数据类型。源文件中的数据列用于在模型中创建维度和度量。导入过程分析源数据并创建初始数据视图，其中包含新模型建议的维度。\n\
  \n完成此自动映射过程后，您可以通过指定维度类型并修复任何数据质量问题来完善建议，您将在下一步中执行此操作。在 Details 面板中，查看模型名称 (B)，如有需要可更改。您还可以输入可选描述\
  \ (C)。指定是否要将数据的第一行用作列标题 (D)，在当前场景中您应该这样做。您可以通过双击列标题或在 Details 面板中更改列名称来编辑列名称。指定是否要使模型处于\
  \ Planning Enabled 状态 (E)。\n\n指定是否要使用自动生成的值填充空 ID 单元格 (F)。如果清除此复选框，则包含空 ID 单元格的行将被省略。\n\
  \n## 设置维度类型\n\n导入数据后，您需要更改一些维度类型，以确保它们提供您希望从模型中获得的结果：\n\n![](img/c69568baeee565fe02397867c05883e1_64_0.png)\n\
  \n可以按照以下屏幕截图所示进一步完善属性：\n\n切换 Type 属性后，两个列的标题图标也会发生变化。\n\n![](img/c69568baeee565fe02397867c05883e1_65_0.png)\n\
  \n11\n\n将纬度和经度列的 Type 属性从 Measure 改为 Dimension。您可以向模型添加多个此类维度。请注意，导入过程已将 State、City、Store、Manager、Product\
  \ 和 Category 列的类型设置为维度。\n\n![](img/c69568baeee565fe02397867c05883e1_65_1.png)\n\n\
  12\n\n将 Quantity sold 列的 Type 属性从 Dimension 改为 Measure。在初始数据导入中，包含文本的列通常被识别为 Dimensions，而数值数据可能被识别为\
  \ Measures。确保 Quantity Sold、Sales Revenue、Gross Margin、Discount 和 Original Sales\
  \ Price 列的 Type 属性标记为 Measure。\n\n## 创建位置维度\n\n您可以通过使用数据集中纬度和经度列创建位置维度来丰富模型，这将使用户能够在地理地图中可视化数据。以下是创建位置维度的步骤：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_66_0.png)\n\n## 从模型中删除不必要的列\n\n您应将模型保持清洁，避免不必要的数据。在此步骤中，您将从模型中删除几列冗余列：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_67_0.png)\n\n## 在两列之间创建层次关系\n\n**层次结构**在两列之间存在层次关系时很有用，例如类别和产品。将列设置为层次结构允许我们在图表中在类别和产品值之间上下钻取。如果图表中包含层次维度，您可以上下钻取维度以在不同级别探索数据。\n\
  \n您使用名为 Parent-Child Hierarchy (Parent) 的维度属性为任何通用维度定义层次结构。例如，如果导入的数据包含两列 Country\
  \ 和 City，您可以将 Country 列设置为 Country-City 层次结构的父级。\n\n在当前场景中，您将在导入数据中可用的 Category\
  \ 和 Product 列之间创建层次关系：\n\n![](img/c69568baeee565fe02397867c05883e1_69_0.png)\n\n\
  单击 Product 列以在 Details 面板中查看其属性。\n\n接下来，单击 Add Dimension Attributes 链接。\n\n从列表中选择\
  \ Parent-Child Hierarchy (Parent) 选项。这将添加一个标记为 PARENT-CHILD HIERARCHY (PARENT) 的下拉列表。\n\
  \n从下拉列表中选择 Category 列，将此列设置为 Product 列的父级。\n\n以下步骤可确保 Category 列被标记为 Product 列的父级：\n\
  \n单击 Category 列，查看该列是否被标记为 Product 列的父级。\n\n## 建模\n\n+   - Carbonated\n+   - Juices\n\
  +   - Others\n+   - Carbonated\n+   - Juices\n+   - Others\n+   - Carbonated\n+\
  \   - Juices\n+   - Others\n+   - Carbonated\n+   - Juices\n+   - Others\n\nCOLUMN\n\
  Category\nTYPE\nParent-Child Hierarchy (Parent)\n+ Make this a Dimension\nPARENT\
  \ OF DIMENSION\nProduct\n\n创建模型后，您将在 Modeler 界面中看到此层次关系。\n\nNAME\nBocage\nDESCRIPTION\n\
  optional description here\nMAPPING QUALITY\nMapping complete\nDATA QUALITY\nNo data\
  \ quality issues detected.\nUse First Row as Column Headers\nPlanning Enabled\n\
  Fill applicable empty ID cells with a default value?\nDEFAULT CURRENCY FOR MODEL\n\
  USD\nCreate Model\n\n最后，单击 Details 面板中的 Create Model 按钮，然后单击在单独对话框中出现的另一个 Create\
  \ 按钮，以完成模型创建过程。\n\n## 在建模器界面中查看模型\n\n创建模型后，您将被带到建模器区域，新模型会出现在界面中。它包含一个选项卡，其中包含两个内置维度（time\
  \ 和 account）和五个私有维度（state、city、store、manager、和 product），这些维度是使用源数据文件创建的。\n\n## 时间维度\n\
  \n单击 Time dimension 选项卡 (A)。Time dimension 内置于分析模型中，用于定义计划时间线的开始和结束日期以及计划中将使用的最小时间单位。时间维度指定模型的整体时间范围以及粒度——数据将被分析到的最小时间段，例如年、季度、月或日。\n\
  \n*请注意，在当前场景中，最低粒度以及两个日期范围筛选器是根据底层模型中定义的时间粒度自动应用的（请参阅 `Bocage.xlsx` 文件中的 Date 列格式）。*\n\
  \n这些筛选器将确保仅在所选时间段内的详细信息可见，如以下屏幕截图所示：\n\n![](img/c69568baeee565fe02397867c05883e1_72_0.png)\n\
  \n\n\n## 账户维度\n\n账户维度（B）是模型的主要维度。账户维度定义了账户成员的集合以及账户数据的格式。您映射为度量的每一列（当前场景中为销售数量、销售额、毛利、折扣和原始销售价格）都将作为成员出现在账户维度中。模型只能有一个账户维度。与私有维度不同，其值位于不同的列中，账户维度成员的数据在建模器中不可见。正如以下插图所示，您为某些基于关键指标的列（销售额、毛利、折扣、原始销售价格和销售数量）导入的数据不可见：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_73_0.png)\n\n除了基本的 ID、描述和账户类型列之外，在首次设置维度时会自动创建一组技术属性。您可以使用工具栏上的技术属性按钮隐藏这些列，但它们无法删除。账户维度的大多数属性都提供列表框以帮助您输入数据。例如，您可以为四个货币列设置货币值，以便在数值后显示货币符号。默认情况下，所有这些账户成员的聚合类型均设置为\
  \ SUM，因此您在此处无需显式选择此聚合方法。\n\n## 私有维度\n\n私有维度仅存在于当前模型中，不会出现在公共维度列表中。当您在从文件或 SAP Business\
  \ Warehouse、SAP ERP、SAP Universe 或其他数据库导入数据时创建维度时，它们会被创建为私有维度。当您删除一个模型时，该模型中的私有维度也会被删除，但公共维度不会被删除。所有维度至少都具有描述和\
  \ ID 属性。通常，对于每个维度，导入的数据列用作维度的描述属性。然后为每个维度自动生成一个 ID 列，以包含行的唯一 ID：\n\n![](img/c69568baeee565fe02397867c05883e1_74_0.png)\n\
  \n请回忆，在第 13 步创建位置维度部分时，我们将 Store 列设置为其位置标识符，并指定了纬度和经度列。模型创建过程将所有这些信息汇总到 Store 选项卡下，这将使您能够在地理地图中可视化数据：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_74_1.png)\n\n您在第 16 至 20 步中在类别和产品列之间创建了层级关系。您可以在产品选项卡下看到该关系。例如，椰子水产品已链接到其他类别。相同的层级关系在右侧的蓝色预览面板中呈现：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_75_0.png)\n\n当您在建模器中对模型进行任何更改（例如在时间维度中更改筛选器）时，请单击保存图标（A）以保留您的更改。\n\
  \n## 浏览模型\n\n要查看现有模型的列表，请单击主菜单图标上的模型并转到浏览 | 模型。您将被带到模型界面（此处所示），其中列出了您所有的模型：\n\n\
  ![](img/c69568baeee565fe02397867c05883e1_76_0.png)\n\n## 复制模型\n\n模型工具栏部分中的复制选项是基于现有模型创建新模型的非常方便的选项。它在以下屏幕截图中说明。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_77_0.png)\n\n当您使用此选项复制模型时，数据和私有维度也会复制到新模型中。公共维度从被复制的模型中引用。请注意，您只能对\
  \ SAP Analytics Cloud 2016.21 版本或更高版本创建的模型使用此选项。此外，请注意，如果模型使用池维度（用于分配），则无法使用复制实用程序。执行以下步骤以复制现有模型：\n\
  \n- 1. 转到主菜单 | 浏览 | 模型。\n- 2. 在要复制的模型前打勾。如果所选模型允许复制，则复制图标将被启用。\n- 3. 单击复制图标。\n-\
  \ 4. 为新模型输入名称并提供描述，描述为可选。\n- 5. 单击确定以进行复制。\n\n## 删除模型\n\n工具栏上的删除图标可让您删除模型及其所有数据：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_78_0.png)\n\n但是，此选项仅适用于具有删除模型权限的用户角色。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_78_1.png)\n\n> *请注意，您无法删除当前正在使用的模型。故事依赖于模型，因此如果您尝试删除在故事中使用的模型，则会显示故事的名称，并且删除操作将被中止。*\n\
  \n使用以下步骤集删除模型：\n\n- 1. 转到主菜单 | 浏览 | 模型。\n- 2. 使用要删除的模型旁边的复选框。请注意，您可以一次选择多个模型并同时删除它们。\n\
  - 3. 单击工具栏上的删除图标。\n\n## 清除模型数据\n\n工具栏上用橡皮擦图标表示的清除所选模型选项用于清除所选模型的所有数据：\n\n![](img/c69568baeee565fe02397867c05883e1_79_0.png)\n\
  \n与删除选项一样，此选项也需要对模型具有删除权限。以下是此过程的步骤：\n\n- 1. 转到主菜单 | 浏览 | 模型。\n- 2. 通过勾选其框来选择一个模型。\n\
  - 3. 单击工具栏上的清除所选模型图标。您将看到模型中每个维度的成员层次结构。请注意，您可以整体清除模型、单个维度或所选维度成员。选择单个账户成员，或在顶层选择分支的所有成员。\n\
  - 4. 在做出选择后单击确定按钮继续。将出现确认对话框。接受确认以完成该过程。\n\n## 查看模型数据\n\n如前所述，账户维度成员的数据在建模器中不可见。您可以在故事中查看此数据，这是第\
  \ 4 章《使用图表创建故事》的主题。目前，您将创建一个临时故事来查看模型数据的反映。\n\n要查看模型数据，请执行以下步骤：\n\n![](img/c69568baeee565fe02397867c05883e1_80_0.png)\n\
  \n单击故事选项后，将启动向导，您将看到以下屏幕：\n\n![](img/c69568baeee565fe02397867c05883e1_80_1.png)\n\
  \n当您单击导入和导出数据时，您会看到选择如何添加数据的屏幕：\n\n## 选择如何添加数据。\n\n使用现有数据\n\n导入文件\n\n连接到 Google\
  \ Drive\n\n在下一屏幕中，选择使用现有数据。\n\n## 选择您的数据\n\n名称\n\nBocage\n\n在选择您的数据屏幕上，选择 Bocage\
  \ 模型并单击确定。\n\n按照以下屏幕截图中显示的步骤继续添加维度：\n\n## 故事 > 新文档(1)*\n\n## 数据视图\n\n## 指标\n\n-\
  \ 销售数量\n- 销售额\n- 毛利\n- 折扣\n- 原始销售价格\n\n指标窗格显示所选模型中的所有可用指标。\n\n## 添加维度\n\n从您的数据集中引入更多维度以开始探索\n\
  \n单击添加维度图标。这将显示显示/隐藏数据框。选择显示全部选项以显示所有维度，或单独单击每个维度以按您想要查看的顺序对它们进行排序。\n\n单击箭头图标以展开/折叠数据视图面板。\n\
  \n## 显示/隐藏数据\n\n- 显示全部\n- 州\n- 城市\n- 商店\n- 经理\n- 产品\n- 日期\n\n您可以使用眼睛图标（A）在初始选择后更改显示的维度。\n\
  \n## 查看数值数据\n\n我们有查看数值数据的选项。我们可以用以下屏幕截图中描述的顺序来完成此操作：\n\n![](img/c69568baeee565fe02397867c05883e1_82_0.png)\n\
  \n单击销售数量度量。该度量的总值将作为数字点图表出现在下部面板中，您可以将其与 Bocage.xlsx 文件中的源数据进行核对。\n\n展开日期节点并在 2013\
  \ 年下选择 Q1。然后从州窗格中选择加利福尼亚。下部窗格中将出现 1250 的销售数量值。打开源 Excel 文件并在销售数量列下的第二行匹配此数字。单击链接“已应用\
  \ 2 个筛选器”（A）将显示两个已应用的筛选器。\n\n\n\n## 以图形方式查看数据\n\n图形化表示可以非常清晰地呈现数据。\n我们可以通过以下截图中列出的步骤来实现：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_83_0.png)\n\n现在，再次点击加利福尼亚州将其取消选择，然后点击内华达州进行选择。当您点击该州名称时，图表会自动更新以反映内华达州的数据，您可以将其与源数据进行匹配。重复此步骤以查看俄勒冈州的数据。\n\
  \n## 观察更多的数据过滤\n\n保持 Measures 面板中所有度量项处于选中状态（如前图所示），并在 Date 面板中选择 2013 年下的 Q1。当您不选择任何州时，结果将类似于以下截图中第一列所示的输出。结果显示所有州的所有城市、商店、经理和产品。在第二列中，您对加利福尼亚州设置了过滤器。当您选择该州时，其余面板将被过滤，仅显示与加利福尼亚州相关的城市、商店、经理和产品。同样，第三列和第四列分别显示内华达州和俄勒冈州的相应数据。这展示了\
  \ SAP Analytics Cloud 的自动过滤过程，该过程基于源数据执行。\n\n![](img/c69568baeee565fe02397867c05883e1_84_0.png)\n\
  \n## 摘要\n\n本章提供了在 SAP Analytics Cloud 中创建分析模型的实践操作，该模型是满足您所有分析需求的基础。\n\n从文件创建新的分析模型的工作流程如下：\n\
  \n- 1. 导入源文件。\n- 2. 为模型设置名称、描述和其他参数。\n- 3. 在初始数据视图中，为新模型中的维度选择维度类型。\n- 4. 为维度指定属性。\n\
  - 5. 清理您的数据并修复任何映射或数据质量问题。\n- 6. 如有需要，创建位置维度以在地理地图中可视化数据。\n- 7. 删除您不打算在故事中使用的列。\n\
  - 8. 在列之间创建层次关系。\n- 9. 启动模型的自动创建。\n\n在下一章中，您将学习第二种模型类型，即规划模型，它具有预算、计划和预测的类别。它还带有默认时间段，您可以根据数据进行调整。它通过审计功能提供可追溯性，并提供强大的安全功能来控制用户访问权限。\n\
  \n## 规划模型\n\n本章是前一章的延续，在前一章中您了解了 SAP Analytics Cloud 中模型的概念，并对分析模型进行了实践操作。在这里，您将了解第二种模型类型，即规划模型。规划模型是您使用规划功能工作的模型。提醒您，规划模型是一个功能齐全的模型，它带有预配置的时间和类别维度，用于实际值、预算、规划、预测和滚动预测。\n\
  \n规划模型还支持多币种，并在模型和维度级别提供安全性，以限制对报告中特定值的访问，仅限指定个人。它还带有用于可追溯性的审计功能。具有规划权限的用户可以创建自己的模型数据版本、使用分配功能、向模型添加新数据以及将数据复制并粘贴到模型中。\n\
  \n在本章中，您将学习以下内容：\n\n- 创建规划模型\n- 可视化规划模型的数据\n- 在表格中查看模型的文本数据\n- 展开、分配和分配值\n- 创建规划模型的私有版本\n\
  \n## 创建规划模型\n\n执行以下步骤创建规划模型：\n\n- 1. 点击主菜单图标，然后转到 创建 | 模型：\n\n![](img/c69568baeee565fe02397867c05883e1_87_0.png)\n\
  \n您可以从头开始创建规划模型，在其中手动在单元格中输入值或从电子表格复制和粘贴数据。您也可以通过从各种来源导入数据来创建此模型类型。为了简化操作，在本练习中您将从名为\
  \ `storesData.xlsx` 的 Excel 文件中获取数据。\n\n- 2. 在 新建模型 页面上，点击 从计算机导入文件：\n\n![](img/c69568baeee565fe02397867c05883e1_87_1.png)\n\
  \n- 3. 在 从文件导入模型 对话框中，点击 选择源文件 按钮（A），并在 Windows 打开 对话框中浏览来自书籍源的 `storesData.xlsx`\
  \ 文件（B）。请注意，该文件有三个工作表，包含 Actuals、Budget 和 Forecast 类别的数据。通过从 工作表 列表中选择 Actuals 选项（C）开始流程并导入数据。其他两个类别的数据将在后续步骤中导入。点击\
  \ 导入 开始流程：\n\n![](img/c69568baeee565fe02397867c05883e1_88_0.png)\n\n过了一会儿，您将看到数据集成屏幕，如以下截图所示。该屏幕对您来说应该很熟悉，因为您在上一章中使用过它。在这里，唯一需要您注意的是\
  \ Planning Enabled 选项，该选项必须为此模型打开。\n\n- 4. 为模型名称输入 StoresData（A），并选择 Planning Enabled\
  \ 选项（B）。点击 创建模型 按钮（C），并在后续对话框中确认模型创建：\n\n![](img/c69568baeee565fe02397867c05883e1_88_1.png)\n\
  \n模型将被创建，其定义将出现在 Modeler 界面中，如以下截图所示。Store 维度包含您从 Excel 文件导入的五个商店的信息。对于每个规划模型，都会自动创建一个\
  \ Version 维度，它显示模型包含的数据类型。由于您在步骤 3 中选择导入 Actuals 类别的数据，Version 选项卡显示模型当前持有 Actual\
  \ 类别的数据。当您在后续步骤中将数据上传到模型时，额外的版本类别（预算和预测）将被添加到此网格中：\n\n![](img/c69568baeee565fe02397867c05883e1_89_0.png)\n\
  \nTime & Categories 选项卡显示 Lowest Granularity 部分，您在上一章创建分析模型时已了解过该部分。它现在有一个 Categories\
  \ 部分，其中包含一些类别，用于定义您将在模型中管理的数据类型。请注意，分析模型仅包含一个类别来显示实际结果。规划模型中类别旁边的下拉列表让您可以分别定义每个类别的规划范围。例如，您可以将\
  \ Budget 设置为年，Planning 设置为季度，Forecast 设置为月。您可以通过在 Look Back 和 Look Ahead 框中输入值来设置范围。无论是对模型进行何种类型的更改，无论是添加新维度还是切换类别，都不要忘记保存您的模型。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_89_1.png)\n\n- 5. 点击 Modeler 面包屑链接返回并访问主\
  \ Models 页面，如下一截图所示。\n\n在前四个向导式步骤中，我们创建了规划模型并从 Excel 文件添加了实际类别的数据。在以下步骤中，我们将附加剩余两个类别的数据。\n\
  \n- 6. 在 Models 页面上，选择 StoresData 模型（A）。然后点击工具栏上的 导入数据 图标（B）。除了从文件导入数据外，您还有多种其他选项可以使用数据填充模型。所有这些可用选项在您点击\
  \ 导入数据 图标时都会显示。对于本示例，点击 导入数据自文件 选项（C）：\n\n![](img/c69568baeee565fe02397867c05883e1_90_0.png)\n\
  \n- 7. 再次在 导入数据自文件 对话框中点击 选择源文件 按钮（A）。这次，从 工作表 列表中选择 Budget 选项（B），以从同一 Excel 文件的第二个工作表中导入\
  \ Budget 类别的数据：\n\n![](img/c69568baeee565fe02397867c05883e1_90_1.png)\n\n\n\n当您在“从文件导入数据”对话框中单击“导入”按钮时，StoresData.xlsx\
  \ 文件中 Budget 工作表中的 Budget 类别数据将被导入，并且您将再次看到“数据集成”页面，如以下屏幕截图所示。\n\n8. 单击 Date 列标题\
  \ (A) 以在“列信息”选项卡 (B) 上查看其详细信息。目前，该列未正确映射。为了使文件中的数据与模型中定义的数据维度保持一致，您需要正确映射该列，这可以通过从“映射到”列表中选择\
  \ Date (C) 来完成：\n\n![](img/c69568baeee565fe02397867c05883e1_91_0.png)\n\n9. 单击“模型信息”选项卡\
  \ (D)。在此，您必须指定要导入数据的类别。要合并预算数据，请将“类别”设置为 Budget，并为“版本名称”输入 Budget。\n\n10. 在“导入方法”部分，您必须选择三个选项之一。Update\
  \ 选项 (A) 会更新现有数据并向目标模型添加新条目。Clean and Replace (B) 会删除现有数据并向目标模型添加新条目。Append (C)\
  \ 会保留现有数据不变并向目标模型添加新条目。对于本次练习，请选择 Append 选项，将预算类别数据附加到模型中已有的 Actuals 类别数据。单击“完成映射”以完成映射过程并导入数据：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_92_0.png)\n\n11. 使用前几步提供的说明并参考以下屏幕截图，从同一\
  \ Excel 文件导入预测数据。在“从文件导入数据”对话框中，从 Excel 文件中选择 Forecast 工作表 (A)。在“模型信息”选项卡上，将“类别”选择为\
  \ Forecast (B)，并为“版本名称”输入 Forecast (C)。最后，选择 Append 选项 (D) 以避免覆盖。单击“完成映射”以完成该过程。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_92_1.png)\n\n如果在为三个类别导入数据后查看“版本”选项卡，您会看到该选项卡现在显示全部三个版本\
  \ (A)，如以下屏幕截图所示：\n\n![](img/c69568baeee565fe02397867c05883e1_93_0.png)\n\n这些是模型中当前正在使用的每个类别的公共版本。您还可以对这些版本设置限制。要添加用户限制，请打开维度首选项\
  \ (B) 并启用“数据访问控制”选项 (C)。启用此选项后，维度中将添加“读取”和“写入”列 (D)，使您能够指定要在每个可用版本中授予读取和写入访问权限的用户。有关访问权限的更多详细信息，请参阅第\
  \ 10 章 *System Administration* 中的 *Setting security for models* 部分。\n\n## 可视化规划模型数据\n\
  \n模型已准备好进行分析。与分析模型一样，我们再次需要创建一个临时故事来查看此模型的数据。为此，请执行以下步骤：\n\n- 1. 从主菜单转到“创建 | 故事”。\n\
  - 2. 在询问您如何开始故事的第一个向导页面上，选择“添加画布页面”选项。故事页面将出现，并为新故事提供默认名称。\n- 3. 单击工具栏上“数据视图”部分中的箭头。系统将提示您添加数据。\n\
  - 4. 在此屏幕上，选择“使用现有数据”。\n- 5. 在“选择您的数据”对话框中，选择 StoresData。这是您在上一节中上传的规划模型数据。单击“确定”以关闭对话框：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_94_0.png)\n\n您将再次看到上一章中使用的“数据视图”面板。单击“度量”窗格中的\
  \ Quantity sold (A) 以查看其实际数据。默认情况下，“版本”设置为 Actual (B)。单击“显示维度”图标 (C)，并从列表中选择“显示全部”\
  \ (D)，以同时查看 Date (E) 和 Store (F) 维度。展开 Date 节点，并选择一月 (G)。在“商店”窗格中，选择 Farlos (H)。Farlos\
  \ 一月的实际销售数量 600 将出现在下部窗格中。您可以在源 Excel 文件中验证此数字 (I)：\n\n![](img/c69568baeee565fe02397867c05883e1_95_0.png)\n\
  \n让我们从不同角度看看如何可视化规划数据。在这些步骤中，我们将在故事页面上添加一个条形图，以便同时比较实际、预算和预测数据。\n\n- 1. 在工具栏上，单击“图表”图标以向故事的第\
  \ 1 页添加空白图表。\n- 2. 单击“设计器”链接以查看设计器面板：\n\n![](img/c69568baeee565fe02397867c05883e1_95_1.png)\n\
  \n在设计器面板中单击“构建器”选项卡以设置图表的属性。由于您已在第 16 步中选择了模型，因此 StoresData 模型将自动出现在“数据源” (A) 下。执行以下步骤来填充图表。\n\
  \n- 3. 在“度量”部分，单击“添加度量”链接，并从列表中选择 Quantity Sold。\n- 4. 在“维度”部分，单击“添加维度”链接，并选择 Date\
  \ 维度。\n- 5. 在“颜色”部分，单击“添加维度”链接，并选择 Version。将会添加一个 Version 部分，其中包含 Actual 版本。单击“添加版本”链接\
  \ (B)，并选择 Budget 以在 Actual 下添加 Budget 版本。重复此过程以添加 Forecast 版本。您可以选择设置不同的图案 (C) 和颜色\
  \ (D) 以在图表中区分三个版本：\n\n![](img/c69568baeee565fe02397867c05883e1_96_0.png)\n\n图表将根据您的选择进行转换，并显示代表三个版本的三个条形。单击图表下方的\
  \ all 链接 (A)，并从出现的工具栏中选择“按日期下钻” (B) 图标。再次单击此选项三次，直到看到月份，这是最低粒度；您无法在此级别之外进行下钻。\n\n\
  - 6. 单击图表垂直工具栏上的“更多操作”图标。\n- 7. 从后续菜单中选择“添加差异”：\n\n![](img/c69568baeee565fe02397867c05883e1_97_0.png)\n\
  \n“创建差异”面板出现在您的右侧。通过向图表添加差异，您可以比较两个值。例如，在当前场景中，您将创建一个差异，以显示销售数量的实际值与预算值之间的差异。\n\n\
  - 8. 在“比较” (A) 部分，选择 Quantity sold 作为度量。\n- 9. 在“比较” (A) 部分中选择 Actual 作为版本。\n- 10.\
  \ 在“到” (B) 部分，选择相同的 Quantity sold 列作为度量。\n- 11. 在“到” (B) 部分中选择 Budget 作为版本。\n- 12.\
  \ 单击“确定”以保存您的差异设置。\n\n![](img/c69568baeee565fe02397867c05883e1_97_1.png)\n\n您的设置输出将类似于以下屏幕截图。第一个差异数据点显示负值\
  \ -1,200 (A)。该数字是通过减去一月份的实际值 (8,000) 和预算值 (9,200) 计算得出的。剩余点以相同方式计算。为方便起见，图中已显示数值。如果您还想以百分比查看结果，则可在“创建差异”面板的“显示选项”部分下打开“百分比”选项：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_98_0.png)\n\n## 查看文本数据\n\n在 SAP Analytics\
  \ Cloud 中，您可以使用表格对象查看模型数据。表格是一种类似电子表格的对象，可用于查看和分析模型中的文本数据。有关此对象的更多详细信息，请参阅第 7 章《Working\
  \ With Tables and Grids》。执行以下步骤以在表格对象中查看三个版本的数据：\n\n- 1. 在您的故事页面上，单击页面工具栏上的加号图标，并选择“网格”以向故事添加网格页面。\n\
  - 2. 在新的网格页面上，单击工具栏上的“添加”图标以添加表格对象。\n- 3. 在“选择模型”对话框中，选择第一个“现有模型”选项 (A)，然后从“名称”列表中选择\
  \ StoresData (B)。单击“确定”。\n\n在“构建器”面板中，设置表格对象的以下属性：\n\n![](img/c69568baeee565fe02397867c05883e1_99_0.png)\n\
  \n- 4. 在“行”部分单击“添加度量/维度”链接 (A)，并选择 Store 维度。\n- 5. 再次单击同一链接，并选择 Date 维度。\n- 6. 在“列”部分单击“添加度量/维度”链接，并选择\
  \ Version。\n- 7. 将鼠标指针悬停在 Version 维度上，并单击“管理筛选器”图标。\n- 8. 在“Version 的所选筛选器”对话框中，选择全部三个版本，如以下屏幕截图所示：\n\
  \n\n![](img/c69568baeee565fe02397867c05883e1_100_0.png)\n\n您选择的输出在以下截图中显示。商店和日期维度占据行位置，而三个数据版本则显示在单独的列中。日期维度以层次结构呈现，包含年份、季度和月份节点。月度数据汇总到季度，然后再汇总到年份：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_100_1.png)\n\n## 分摊、分配和指派值\n\n除了从模型数据中获取值之外，您还可以在表格中添加自己的值。为此，您使用\
  \ SAP Analytics Cloud 的分配功能，其中包括分摊、分配和指派值。分配是将源数据派生的值拆分为多个值并将值存储到目标数据的过程。分配功能用于规划和数据分析以获得洞察。\n\
  \n分摊、分配和指派操作是将表格中的值分配到一个或多个目标单元格的方式。这些功能可以帮助您快速录入新值并调整计划中的现有值：\n\n- **分摊**：在分摊操作中，源单元格的值会分摊到叶成员。值从层次结构的较高层级获取并分摊到较低层级。您可以自动或手动执行分摊。\n\
  - **分配**：在分配中，值在层次结构内通过将源成员的金额分配给其兄弟节点的叶成员而发生变化。您可以将一个单元格中的部分或全部值移动到同一层级中的其他单元格，或移动到同一层次结构不同分支的成员。与分摊不同，分配会从源单元格中减去值以添加到目标单元格。汇总到源单元格的叶成员会按比例减少，而目标单元格的叶成员会按比例增加。\n\
  - **指派**：使用指派功能，您可以在不指定源单元格的情况下向目标单元格追加或覆盖值。在此，您选择要指派的金额。您指派的值不会从使用分摊或分配时出现的任何其他单元格中扣除。\n\
  \n让我们看看当我们在已有值的单元格中指定新值时，值是如何自动分摊的。将 Farlos 商店的第一季度预测值从 3,700 改为 4,000。该商店的整个层次结构都将受到此更改的影响。如以下截图所示，新值已根据每个月先前分配的值在三个月之间进行分摊。当您以这种方式指定值时，层次结构中较低层级项目之间的现有权重得以保留。例如，修改前的\
  \ 1 月份预测值为 800，该数字对总金额的贡献为 21.62%（800*100/3700）。修改后，相同的百分比用于计算该月份的新值，即（4000 * 21.62%\
  \ = 864.80）。\n\n|  | 商店 | 日期 | 实际值 | 预算 | 预测 |\n|---|---|---|---|---|\n|  |  | 版本\
  \ | 实际值 | 预算 | 预测 |\n|  |  | 版本 | 实际 | 预算 | 预测 |\n|  | 商店 | 日期 |  |  |  |\n| 5 |\
  \ InterMart | ▶ (all) | 5,200.00 | 6,500.00 | 6,600.00 |\n| 6 | Frills | ▶ (all)\
  \ | 3,300.00 | 3,300.00 | 3,400.00 |\n| 7 | Kullens | ▶ (all) | 5,700.00 | 5,000.00\
  \ | 5,000.00 |\n| 8 | Farlos | ▼ (all) | 3,300.00 | 3,700.00 | 4,000.00 |\n| 9 |\
  \  | ▼ 2017 | 3,300.00 | 3,700.00 | 4,000.00 |\n| 10 |  | ▼ Q1 (2017) | 3,300.00\
  \ | 3,700.00 | 4,000.00 |\n| 11 |  | Jan (2017) | 600.00 | 900.00 | 864.80 |\n|\
  \ 12 |  | Feb (2017) | 1,300.00 | 1,000.00 | 1,513.60 |\n| 13 |  | Mar (2017) |\
  \ 1,400.00 | 1,800.00 | 1,621.60 |\n| 14 | Hudsons | ▶ (all) | 4,200.00 | 4,300.00\
  \ | 4,300.00 |\n\n除了自动分摊值之外，您还可以手动为特定维度和层级的成员指定权重，方法是选择源单元格，然后从工具栏转到分配值 (↕) | 分摊。\n\
  \n在分摊对话框中，您需要指定要分摊所选值的目标维度。在当前场景中，日期维度将被设为目标维度。使用此对话框右侧的图标，您可以选择要分摊所选值的层次级别。未预订选项允许您分摊到没有值的成员。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_102_0.png)\n\n> *请注意，如果您未选择层次结构的底部级别作为目标，则值将使用现有权重自动分摊到叶单元格，前提是这些单元格已填充。如果您已打开未预订选项且单元格为空，则会将相等的值分摊到所有叶单元格。*\n\
  \n有几种方法可以分摊值。您可以输入数值权重值，例如成员之间的简单比率，或单击吸管图标以按顺序从故事中的其他单元格复制值到可用字段中。当您手动输入值时，分摊的是值的相对权重，而不是值本身。\n\
  \n当我们希望在成员之间应用相同的权重时，此功能很有用。预览列显示分摊后表格中会出现的值。一旦您对该对话框中的统计数据感到满意，请单击应用分摊按钮以分摊值：\n\
  \n## 分摊 4000.00 $\n\n目标维度\n\n日期\n\n## 选择级别和权重\n\n未预订 关闭\n\n| 级别 | 权重 | 预览 |\n|---|---|---|\n\
  | Jan | 864.80 | 21.62% 864.80 $ |\n| Feb | 1513.60 | 37.84% 1513.60 $ |\n| Mar\
  \ | 1621.60 | 40.54% 1621.60 $ |\n\n应用分摊\n\n取消\n\n## 创建私有版本\n\n您在上一节中添加到规划模型中的三个数据版本（实际值、预算和预测）被称为公共版本。公共版本存储在数据库中的原始模型数据中。如本章前面所述，对模型数据的访问由数据权限控制，您可以通过为维度启用数据访问控制并在建模器中为用户分配适当的权限来建立这些权限。\n\
  \n在 SAP Analytics Cloud 中，您可以从这些公共版本类别创建自己的私有数据版本。私有版本仅对模型的创建者或所有者可见。您使用这些版本来更改或模拟计划值，而不会让其他人看到。当您发布私有版本时，它会被提升为公共版本，而私有版本将被删除。您可以使用\
  \ SAP Analytics Cloud 的版本管理功能在给定类别内创建私有版本。通过创建私有版本，您可以修改值而不干扰公共版本数据。采用此方法的另一个优点是，在您进行更改时，公共数据仍在您的视图中。\n\
  \n以下是创建私有版本的步骤。在此练习中，您将为预测类别创建一个私有版本：\n\n- 1. 选择表格，然后在工具栏上单击版本管理图标 ( )。版本管理面板，如以下截图所示，将显示在屏幕右侧。\n\
  - 2. 在版本管理面板中，选择要用作私有版本的版本，然后单击复制图标。\n- 3. 在复制到私有版本对话框中，为版本输入名称，例如 Private Forecast。\n\
  - 4. 单击确定按钮。\n\n![](img/c69568baeee565fe02397867c05883e1_105_0.png)\n\n新版本 (A) 将被添加到表格中（请参阅下一张截图），并且在版本管理面板的私有版本部分中也会出现相应的条目\
  \ (B)。您可以随意对新的私有版本进行任何更改。\n\n更改私有版本中的值后，通过单击保存图标 (C) 保存它。您将获得两个选项：保存和另存为。保存选项将您的工作作为对公共版本的更新保存，而另存为则创建新的公共版本。在后一种情况下，您必须选择一个类别，例如规划，为新版本输入名称，然后选择确定。选择另存为选项以将私有版本发布到模型中尚未使用的类别，例如规划或滚动预测。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_105_1.png)\n\n> 保存选项用于在任何类别中替换现有公共版本。例如，如果您想替换现有的公共预测，请选择保存。一旦您选择保存选项，现有的公共预测值将被您的私有预测替换，并且私有预测将从版本管理面板中移除。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_105_2.png)\n\n当然，您也可以在不先创建私有版本的情况下直接在公共版本中进行更改。公共版本在版本管理中切换到编辑模式\
  \ (D)\n\n\n在您进行更改时面板。在公共版本中编辑数据时，其他用户无法看到您的更改，您也无法看到他们的更改。\n\n当您完成编辑后，必须选择是否丢弃更改或将其发布到原始公共版本。当您进行此类更改并尝试离开页面时，会出现一个对话框，提示您发布编辑内容或丢弃它们。您也可以通过选择\
  \ Revert Changes (E) 来丢弃更改，该选项位于版本管理面板中每个版本旁边。\n\n## Summary\n\n计划失败就是失败的计划。因为规划有助于您确定短期和长期目标，因此其对组织的重要性不容忽视。规划是一个涉及确定未来行动方向的过程。为什么、如何以及何时采取行动是规划的主要内容。提高组织适应未来不确定性的能力，使公司在其行业中更具竞争力，减少错误和疏忽，有效利用组织资源并更好地控制，是规划的一些特点。\n\
  \n鉴于规划的重要性，SAP Analytics Cloud 可帮助您创建功能齐全的规划模型。创建和使用规划模型是一个庞大的主题，可以专门为此撰写一本完整的书籍。在本简短章节中，您获得了该重要领域的概述，足以让您起步。一旦您熟悉这些基础知识，就可以在自己探索其他领域。您学习了如何为规划启用模型并在同一模型中使用数据的不同版本。\n\
  \n您还体验了可视化和查看模型数据的方法，并创建了差异以比较来自两个不同版本的数据。分摊、分配和指派值也在此上下文中进行了讨论。最后，您学习了使用现有公共版本创建自己的私有版本的过程。\n\
  \n创建模型后，您可以在不同类型的对象中可视化其数据，例如图表、表格和地理地图；本章也为您提供了这一方面的概览。这些对象是在一个或多个故事页面上创建的，我们将在后续章节中详细介绍。\n"
- '## Creating Stories Using Charts


  在 SAP Analytics Cloud 中，故事用于使用图表、表格、地理地图、文本、图像和形状以图形方式呈现数据。在本章以及接下来的几章中，您将学习使用不同类型的图表和其他对象创建故事页面的方法，如下图所示：


  ![](img/c69568baeee565fe02397867c05883e1_108_0.png)


  以下是所示例故事页面的简要说明：


  - A: 这是描述其用途的故事页面标题。

  - B: 添加了这三个单独的图块，用于演示如何创建 Numeric Point 图表，使用自定义阈值以不同颜色动态呈现数值数据。

  - C: 毛利率图表将使用折线图创建。

  - D: 关键绩效指标（KPI）是一种成功度量类型。根据用户定义的阈值，KPI 指示度量的状态。

  - E, F, and G: 这些数据筛选器将在下一章中为日期、产品和位置维度创建。

  - H, I, and J: 这些图块将演示条形图的使用及其不同功能，例如在图表中向上和向下钻取以及绘制参考线以显示图表上的重要值。


