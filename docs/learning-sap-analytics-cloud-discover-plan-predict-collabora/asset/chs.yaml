  \ |  |  |  |\n\n34\n\n35\n\n36\n\nA\n\n## 角色设置\n\n工具栏中的“设置”选项可让您查看角色设置。单击“设置”图标（A），将在“设置”对话框中显示以下选项：\n\
  \n- **启用自助服务**：如果激活此选项，任何业务用户都可以使用“请求角色”选项（B）为自己请求此角色。一旦审批者收到角色分配请求的通知，他将从主菜单转到\
  \ 安全 | 请求 页面，通过选择用户 ID 然后选择“批准”来批准请求。确认后，所请求的角色会立即分配给用户。请求也可以以相同的方式被拒绝。会显示一个对话框，审批者在其中输入解释拒绝请求原因的理由。\n\
  - **用作默认角色**：如果在导入或创建用户时未指定角色，则该角色将默认分配给所有新用户。\n- **完全数据访问**：应谨慎使用此选项，因为分配此角色的用户可以看到任何模型的所有数据，而不管模型的数据访问方式如何定义。\n\
