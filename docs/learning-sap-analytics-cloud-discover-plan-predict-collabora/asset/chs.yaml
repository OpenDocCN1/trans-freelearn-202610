  ## 设置可见性筛选器


  在之前的章节中，您学习了许多用于筛选页面对象返回结果的技术。在这些练习中，您应用了常规筛选选项来控制维度成员的显示。在本节中，我们将介绍另一种称为 **visibility
  filter** 的筛选器。常规筛选器与可见性筛选器之间的主要区别在于，当您应用常规筛选器时，被筛选出的成员会从场景中消失并且不参与计算，而如果您对某些维度成员应用可见性筛选器，它们也会从页面对象中消失，但仍参与计算。让我们通过一个示例来阐述这一概念。首先，您将添加一个常规筛选器，然后应用可见性筛选器以观察两者之间的差异。


  目前，表格对象中显示的 Net Revenue 值为 320.84 百万 (A)，如下图所示。按照说明首先创建常规筛选器：


  ![](img/c69568baeee565fe02397867c05883e1_275_0.png)


  46. 选择表格，并单击代表 Location 维度的 Manage Filter 图标 (B)。在 Selected filters for Location
  对话框中，在 Exclude selected members 选项 (C) 和 Oregon 州 (D) 框中放置复选标记以从表格中排除该州的数据。一旦您单击
  OK 返回页面，您会注意到 Oregon 州的数据不再存在于表格中，如下图所示的下部视图所示。由于此排除，Net Revenue 度量的总值 (E) 也受到影响。


  ![](img/c69568baeee565fe02397867c05883e1_276_0.png)


  在了解了常规筛选器的功能后，让我们看看可见性筛选器是如何工作的：


  47. 再次单击代表 Location 维度的相同 Manage Filter 图标 (F)。在 Selected filters for Location 对话框中，取消选中
  Exclude selected members (G)，并选中 All Members (H) 以将所有维度成员包含到表格中。然后，单击 Oregon 州旁边的
  Set to invisible 图标 (I) 使该州的数据不可见。单击 OK 返回页面。再次，Oregon 州在表格中未显示，但其数据会贡献到总计 (J)。使用可见性筛选器，您可以在不干扰整体汇总的情况下将视图限制为您最感兴趣的区域：


  ![](img/c69568baeee565fe02397867c05883e1_276_1.png)


