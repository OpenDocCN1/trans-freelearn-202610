  \ 23. 在“角色”页面上，单击现有角色以打开其定义页面。\n- 24. 在所选角色的定义页面上，单击“分配角色”图标 (\U0001F511)，并从用户列表中选择一个或多个用户。所选角色将被分配给所有所选成员，如以下屏幕截图所示：\n\
