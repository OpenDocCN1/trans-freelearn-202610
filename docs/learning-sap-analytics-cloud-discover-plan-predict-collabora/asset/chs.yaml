  ## 创建聚合计算


  您已在上一章中学习了四种计算类型中的三种。在本练习中，您将了解聚合计算类型的工作原理。您可以在图表和表格中使用此类型。您将在第 7 章《使用表格和网格》中了解表格，因此在这里您将创建一个新图表来尝试此计算类型。该图表将显示每个州每种产品类型的每个商店的平均毛利率。


  - 46. 使用“插入”工具栏上的“图表”选项创建一个新图表。

  - 47. 将数据源设置为 Best Run Demo。

  - 48. 从“比较”类别中选择“条形/列”选项。

  - 49. 单击“添加度量”链接，然后选择“单击以创建新计算”。创建聚合计算的说明在下一页提供。

  - 50. 在下一页创建名为“商店平均毛利率”的聚合计算后，将“产品”选为图表的维度。

  - 51. 在“颜色”部分单击“添加维度/阈值”链接，并选择“位置”：


  ![](img/c69568baeee565fe02397867c05883e1_198_0.png)


  当您在步骤 49 中选择“单击以创建新计算”选项时，您会看到


  计算编辑器屏幕。


  52. 在计算编辑器窗口中，为计算类型选择聚合。


  53. 为计算名称输入 Store Average Gross Margin。


  54. 从操作下拉列表中选择 Average。这是您将在当前场景中使用的聚合类型。此列表中的 Count 类型计算具有度量值的维度成员的数量，而 Count Dimensions
  用于计算维度成员的数量，无论它们是否有度量值。剩余的类型不言自明。


  55. 选择 Gross Margin 作为度量。这是您将应用聚合的度量。


  56. 为聚合维度选择 Store ID。通过将 Store ID 选择为聚合维度，您指定使用此维度执行聚合。然后毛利率平均值将在商店级别计算。如有需要，您可以使用本节提供的链接添加更多聚合维度。


  57. 选中标记为使用条件聚合的复选框。当您想要对聚合计算添加进一步限制时使用此选项。


  58. 为条件选择不具有度量值。使用条件聚合时，您可以选择在指定条件下存在度量值时应用聚合，或在这些条件下没有度量值时应用聚合。在此示例中，您选择了不具有度量值的条件选项以从计算中排除已关闭的商店。


  59. 在条件部分，从维度列表中选择 Store ID 以选择要排除的商店。


  60. 从值或输入控件下拉列表中，选择第一个选项按成员选择。您在后续屏幕上选择的值将显示在此列表中。请注意，如果需要，您也可以创建输入控件，以便用户在查看故事时指定条件值。


  ![](img/c69568baeee565fe02397867c05883e1_200_0.png)


  61. 当您在计算编辑器窗口中单击按成员选择选项时，会看到此对话框。在 ST101 商店 ID 前放置一个复选标记以选择此成员，然后单击确定。所选商店将出现在计算编辑器窗口中的值或输入控件列表
  (60) 中。


  ![](img/c69568baeee565fe02397867c05883e1_200_1.png)


  在计算编辑器窗口中，单击确定按钮并提供维度信息，如步骤 49 和 50 中所述。完成上述步骤后，您将看到的图表显示了除商店 101 外，三个州中每个商店以及每个产品类别的平均毛利率。


