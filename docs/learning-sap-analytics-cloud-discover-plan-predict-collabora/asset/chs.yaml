  \n审批者部分提供的两个选项决定谁有权授予该角色：\n\n- **经理**：如果选择此选项，请求用户的经理将被授权批准角色请求。请注意，经理在用户管理区域的用户页面上分配给用户。\n\
  - **其他用户**：您从对话框中选择的具体用户必须批准请求。\n\n![](img/c69568baeee565fe02397867c05883e1_367_0.png)\n\
  \n## 权限\n\n当管理员创建新角色或修改角色时，他会看到权限屏幕，在此屏幕中他可以查看或编辑与该特定角色关联的权限。下表描述了您可以分配给不同文件类型和其他项目的[content]\n\
  | 查看者 | 分配给仅允许查看董事会会议议程的用户。 |\n\n## 创建新角色\n\n作为系统管理员，您经常需要创建特殊角色。例如，可能需要为新员工创建仅能访问一个规划模型的角色。您可以从零创建新角色，也可基于内置角色作为模板。创建自定义角色的步骤如下：\n\
  \n29. 转到 主菜单 | 安全 | 角色 访问角色页面。\n\n30. 在角色页面工具栏单击 新 图标，向角色管理表添加新行。\n\n![](img/c69568baeee565fe02397867c05883e1_364_0.png)\n\
  \n31. 在“创建新角色”对话框中输入唯一角色名，如 Sales_Marketing_Plan_Role，然后点确定，如前图。角色名中不允许有空格。\n\n\
  ![](img/c69568baeee565fe02397867c05883e1_364_1.png)\n\n角色创建后显示其权限页面，可为新角色的每项活动定义权限，可针对业务对象类型的所有对象或单个对象定义。本例中为只能访问一个模型的用户创建角色。\n\
  \n权限页的层次结构包含大量对象。可手动指定权限，也可基于模板创建角色，后者只需对现有角色做少量修改。\n\n32. 若基于内置角色定义权限，在权限页工具栏单击“选择模板”图标（\
  \ ）。\n\n33. 在“选择模板”对话框中选择角色，如 Planner_Reporter。\n\n![](img/c69568baeee565fe02397867c05883e1_365_0.png)\n\
  \n所选角色的权限会复制到新角色，必要时可修改以满足业务需求。\n\n34. 若需用户仅读取特定模型，移除 Planning Model 的全局读取设置，否则新员工可读取所有模型。然后展开\
